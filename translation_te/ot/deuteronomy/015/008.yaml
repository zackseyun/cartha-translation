- from: దానికి బదులుగా, నువ్వు అతనికి నీ చెయ్యి తప్పకుండా తెరిచి, అతనికి ఏది కొదువగా ఉందో ఆ అవసరానికి సరిపడా తప్పకుండా అప్పుగా ఇవ్వాలి.[a]
  to: దానికి బదులుగా, నీవు అతనివైపు నీ చెయ్యిని తప్పకుండా విప్పాలి; అతనికి ఏ కొరత ఉందో, దానికి సరిపడేంత తప్పకుండా అప్పుగా ఇవ్వాలి.[a]
  rationale: The revision preserves every source element and the English audit trail while improving Telugu syntax and contemporary readability. ‘విప్పాలి’ retains the concrete open-hand image, and the final clause now clearly expresses a loan sufficient for the particular lack the recipient has.
