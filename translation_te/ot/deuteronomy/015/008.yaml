source:
  edition: WLC
  text: כִּֽי פָתֹ֧חַ תִּפְתַּ֛ח אֶת יָדְ/ךָ֖ ל֑/וֹ וְ/הַעֲבֵט֙ תַּעֲבִיטֶ֔/נּוּ דֵּ֚י מַחְסֹר֔/וֹ אֲשֶׁ֥ר יֶחְסַ֖ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: te
  text: దానికి బదులుగా, నీవు అతనివైపు నీ చెయ్యిని తప్పకుండా విప్పాలి; అతనికి ఏ కొరత ఉందో, దానికి సరిపడేంత తప్పకుండా అప్పుగా ఇవ్వాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తెరవడం, నీవు తెరవాలి … అప్పుగా ఇవ్వడం, నీవు అప్పుగా ఇవ్వాలి.” ఈ పునరుక్త క్రియారూపాలు ఆజ్ఞను నొక్కి చెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: దానికి బదులుగా
  rationale: మునుపటి వచనంలోని కఠినహృదయంతో నిరాకరించకూడదనే ఆజ్ఞకు విరుద్ధంగా చేయవలసినదాన్ని ఇది పరిచయం చేస్తుంది; సందర్భానుసారమైన వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פָתֹחַ תִּפְתַּח
  choice: తప్పకుండా తెరిచి
  rationale: క్రియారూప పునరుక్తి ఆజ్ఞను బలపరుస్తుంది. ‘చెయ్యి తెరవడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ దాతృత్వంతో సహాయం చేయాల్సిన ఖచ్చితమైన బాధ్యతను తెలియజేస్తుంది.
- source_word: יָדְךָ
  choice: నీ చెయ్యి
  rationale: మూలంలోని స్పష్టమైన దృశ్యరూపకాన్ని నిలుపుతుంది; ఆధునిక తెలుగులో కూడా ఉదారంగా ఇవ్వడాన్ని సూచించే సహజమైన ప్రయోగం.
- source_word: לוֹ
  choice: అతనికి
  rationale: పేద సహోదరుడే సహాయం అందుకునే వ్యక్తి అని ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: తప్పకుండా అప్పుగా ఇవ్వాలి
  rationale: עבט యొక్క హిఫీల్ భావం ‘అప్పుగా ఇవ్వడం.’ పునరుక్త క్రియారూపంలోని బలాన్ని ‘తప్పకుండా’ ద్వారా, ఆజ్ఞాత్మక బాధ్యతను ‘ఇవ్వాలి’ ద్వారా తెలియజేస్తుంది.
- source_word: דֵּי
  choice: సరిపడా
  rationale: అవసరాన్ని తీర్చగల పరిమాణం లేదా సమృద్ధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַחְסֹרוֹ
  choice: ఆ అవసరానికి
  rationale: మూలపదంలోని కొరత లేదా అవసర భావాన్ని తెలియజేస్తూ, వెంట వచ్చే సంబంధ వాక్యంతో అనవసరమైన కఠిన పునరుక్తి రాకుండా చేస్తుంది.
- source_word: אֲשֶׁר יֶחְסַר לוֹ
  choice: అతనికి ఏది కొదువగా ఉందో
  rationale: అతని అవసరపు పరిధిని తెరవిడిగా ఉంచి, అతనికి లోటుగా ఉన్నదేదైనా అనే మూలార్థాన్ని కాపాడుతుంది.
