  edition: WLC
  text: לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֤י/ךָ תֹאכֲלֶ֨/נּוּ֙ שָׁנָ֣ה בְ/שָׁנָ֔ה בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה אַתָּ֖ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: te
  text: నీవూ నీ ఇంటివారూ ఏటేటా నీ దేవుడైన యాహ్వే సన్నిధిలో[a], యాహ్వే ఎంచుకునే స్థలంలో దాన్ని తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎదుట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ఈ హీబ్రూ పదబంధానికి ‘ఎదుట’ లేదా ‘సన్నిధిలో’ అనే అర్థాలున్నాయి. ఇక్కడ యాహ్వే సమక్షంలో జరిగే ఆరాధనాపరమైన భోజన భావాన్ని ‘సన్నిధిలో’ సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ఈ రూపం ‘నీ దేవుడు’ అని అర్థం; తెలుగులో యాహ్వేతో సహజంగా అనుసంధానించేందుకు ‘నీ దేవుడైన యాహ్వే’ అని ఇచ్చాం.
- source_word: תֹאכֲלֶנּוּ
  choice: దాన్ని తినాలి
  rationale: పూర్వ సందర్భంలో చెప్పిన ప్రథమజాత జంతువును సూచించే పురుష ఏకవచన కర్మ ప్రత్యయాన్ని ‘దాన్ని’గా, న్యాయబోధక అపూర్ణ క్రియను విధిగా ‘తినాలి’గా అనువదించాం.
- source_word: שָׁנָה בְּשָׁנָה
  choice: ఏటేటా
  rationale: ప్రతి సంవత్సరమూ పునరావృతమయ్యే ఆచరణను తెలిపే హీబ్రూ పంపిణీ ప్రయోగాన్ని సంక్షిప్తమైన సహజ తెలుగు రూపంలో నిలిపాం.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: యాహ్వే ఎంచుకునే స్థలంలో
  rationale: ద్వితీయోపదేశకాండంలోని కేంద్రీయ ఆరాధనాస్థల సూత్రాన్ని సహజ తెలుగులో తెలియజేస్తూ, ఏ స్థలమో యాహ్వే నిర్ణయిస్తాడనే భావాన్ని నిలిపాం.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: నీవూ నీ ఇంటివారూ
  rationale: בֵּיתֶךָ ఇక్కడ భవనాన్ని కాక గృహ సముదాయంలోని వ్యక్తులను సూచిస్తుంది; ‘ఇంటివారు’ ఆ సామాజిక భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామమే ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణను సూచించే ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: לִפְנֵי లోని ఆరాధనాపరమైన సంబంధం
  choice: సన్నిధిలో
  alternative: ఎదుట
  rationale: రెండు భావాలూ మూలపదానికి సాధ్యమే. ‘సన్నిధిలో’ దేవుని సమక్షంలో భోజనం చేయడాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యక్ష రూపమైన ‘ఎదుట’ను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయబోధక శైలిని ఉపయోగించాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘నీవూ నీ ఇంటివారూ’ అనే కర్తను ముందుకు తెచ్చి సహజ తెలుగు వాక్య నిర్మాణాన్ని పాటించాం.
