source:
  edition: WLC
  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: te
  text: 'విడుదల నియమం ఇదే: ప్రతి అప్పుదాత తన పొరుగువానికి ఇచ్చిన అప్పును వదులుకోవాలి[a]. అతడు తన పొరుగువానిని గానీ, తన సహోదరునిని గానీ[b] అప్పు తీర్చమని ఒత్తిడి చేయకూడదు; ఎందుకంటే యాహ్వే కొరకు విడుదల ప్రకటించబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘విడుదల’ (హీబ్రూ: షెమిట్టా) అంటే విశ్రాంతి సంవత్సరంలో అప్పును వసూలు చేసే హక్కును విడిచిపెట్టడం; దీనిని ‘అప్పు మాఫీ’ లేదా ‘అప్పు రద్దు’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సహోదరుడు’ అంటే నిబంధన సమాజంలోని తోటి సభ్యుడు; భావానువాదంగా ‘తోటి ఇశ్రాయేలీయుడు’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: విడుదల నియమం
  rationale: ఈ న్యాయసంబంధ సందర్భంలో דְּבַר అనేది కేవలం ‘మాట’ను కాక, వివరించబోయే నియమాన్ని సూచిస్తుంది; שְׁמִטָּה అప్పుపై హక్కును వదలడాన్ని సూచిస్తుంది.
- source_word: שָׁמוֹט
  choice: వదులుకోవాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్ ఆజ్ఞను బలపరుస్తుంది. తెలుగులో ‘వదులుకోవాలి’ ఆ తప్పనిసరి విడుదలను సహజంగా తెలియజేస్తుంది.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: ప్రతి అప్పుదాత
  rationale: పదశః ‘తన చేతి అప్పుకు యజమాని’ అనే హీబ్రూ న్యాయపరమైన నుడికారానికి ‘అప్పుదాత’ స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: తన పొరుగువానికి ఇచ్చిన అప్పు
  rationale: హిఫీల్ రూపం అప్పుగా ఇవ్వడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో నామవాచక రూపం సహజంగా ఉండి, అప్పు సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא יִגֹּשׂ
  choice: అప్పు తీర్చమని ఒత్తిడి చేయకూడదు
  rationale: ఈ క్రియకు అప్పు వసూలు కోసం నొక్కి అడగడం లేదా ఒత్తిడి చేయడం అనే భావం ఉంది. ఈ అనువాదం వసూలు విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: רֵעֵהוּ
  choice: పొరుగువాడు
  rationale: నిబంధన సమాజంలోని తోటి వ్యక్తిని సూచించే רֵעַకు ఇది సాధారణమైన, మూలపాఠానికి సమీపమైన తెలుగు పదం.
- source_word: אָחִיו
  choice: సహోదరుడు
  rationale: హీబ్రూ పదంలోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతూ, దాని విస్తృత నిబంధన-సమాజ భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: כִּי קָרָא
  choice: ఎందుకంటే ... ప్రకటించబడింది
  rationale: హీబ్రూలోని కర్తలేని పర్ఫెక్ట్ రూపం బహిరంగ ప్రకటనను సూచిస్తుంది; తెలుగులో కర్మణి ప్రయోగం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వే నిమిత్తం
  rationale: לְ ఉపసర్గలోని ‘కోసం/సంబంధించి/అంకితంగా’ అనే సంబంధాన్ని ఒకే దిశలో అతిగా కుదించకుండా, విడుదల యాహ్వేతో ప్రత్యేకంగా సంబంధించిందని తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో నిబంధన దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: אָחִיו పదానికి న్యాయ-సామాజిక సందర్భంలోని భావం
  choice: సహోదరుడు
  alternative: తోటి ఇశ్రాయేలీయుడు; బంధువు
  rationale: మూలంలోని పుంలింగ బంధుత్వ పదాన్ని ప్రధాన పాఠంలో నిలిపి, అది నిబంధన సమాజంలోని తోటి సభ్యుణ్ణి సూచించగలదని పాదసూచికలో తెలిపాం.
- issue: లַיהוָהలోని సంబంధం
  choice: యాహ్వే నిమిత్తం
  alternative: యాహ్వేకు; యాహ్వే పేరిట
  rationale: ఉపసర్గ విడుదలను యాహ్వేతో అనుసంధానిస్తుంది; అది ఆయన కోసం, ఆయన గౌరవార్థం లేదా ఆయనకు అంకితమైన ప్రకటన అనే భావ ఛాయలను కలిగి ఉండవచ్చు. ప్రధాన పాఠం ఈ సంబంధాన్ని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘అప్పుదాత’, ‘అప్పు తీర్చమని ఒత్తిడి’ వంటి పదబంధాలు సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి; మూలంలోని ‘పొరుగువాడు/సహోదరుడు’ జంటను భావపరంగా సమతలీకరించకుండా నిలిపాం.
