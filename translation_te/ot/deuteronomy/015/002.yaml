  to: 'విడుదల నియమం ఇదే: ప్రతి అప్పుదాత తన పొరుగువానికి ఇచ్చిన అప్పును వదులుకోవాలి[a]. అతడు తన పొరుగువానిని గానీ, తన సహోదరునిని గానీ[b] అప్పు తీర్చమని ఒత్తిడి చేయకూడదు; ఎందుకంటే యాహ్వే కొరకు విడుదల ప్రకటించబడింది.'
  rationale: Only minor idiomatic refinements are made. The revision retains the source’s legal force, the distinction between ‘neighbor’ and ‘brother,’ the ambiguity of the Yahweh-related proclamation, and both original footnote anchors and explanations.
