id: DEU.15.13
reference: Deuteronomy 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי תְשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ לֹ֥א תְשַׁלְּחֶ֖/נּוּ רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: te
  text: నీవు అతణ్ణి నీ దగ్గరనుండి విడుదల చేసి పంపివేసేటప్పుడు[a], అతణ్ణి ఒట్టి చేతులతో పంపివేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు అతణ్ణి నీ దగ్గరనుండి విడుదల చేసి పంపివేస్తే.” హీబ్రూ పదబంధాన్ని షరతార్థకంగా (“ఒకవేళ …తే”) లేదా కాలార్థకంగా (“…టప్పుడు”) అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: పంపివేసేటప్పుడు
  rationale: וְכִי ఈ న్యాయసందర్భంలో కాలార్థకంగా ‘అప్పుడు/ఎప్పుడు’ లేదా షరతార్థకంగా ‘ఒకవేళ’ అనే భావం ఇవ్వగలదు. ముందున్న విధి ప్రకారం విడుదల జరగబోయే సందర్భాన్ని సహజంగా సూచించేందుకు ప్రధాన పాఠంలో ‘పంపివేసేటప్పుడు’ వాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: תְשַׁלְּחֶנּוּ
  choice: అతణ్ణి ... పంపివేసేటప్పుడు / అతణ్ణి ... పంపివేయకూడదు
  rationale: పియేల్ రూపంలోని שלחకు ‘పంపివేయడం, వెళ్లనివ్వడం’ అనే భావం ఉంది. మూలంలో రెండుసార్లు వచ్చిన పదాన్ని తెలుగులోనూ ‘పంపివేయు’తో పునరావృతం చేశాం.
- source_word: חָפְשִׁי
  choice: స్వతంత్రునిగా
  rationale: దాస్యానికి విరుద్ధంగా חָפְשִׁי ‘స్వతంత్రుడు/విడుదల పొందినవాడు’ అని సూచిస్తుంది. వ్యక్తిని వర్ణించే విశేషణ భావాన్ని ‘స్వతంత్రునిగా’ నిలుపుతుంది.
- source_word: מֵעִמָּךְ
  choice: నీ దగ్గరనుండి
  rationale: అక్షరార్థంగా ‘నీతో ఉన్న స్థితి నుండి/నీ దగ్గరనుండి.’ ‘నీ సేవనుండి’ లేదా ‘నీ ఇంటినుండి’ అని విస్తరించడం కంటే ‘నీ దగ్గరనుండి’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: לֹא תְשַׁלְּחֶנּוּ
  choice: పంపివేయకూడదు
  rationale: నిషేధార్థక לֹא + అసంపూర్ణ క్రియకు ఉన్న న్యాయపరమైన బలాన్ని ఆధునిక, సహజమైన తెలుగులో ‘కూడదు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: רֵיקָם
  choice: వట్టిచేతులతో
  rationale: רֵיקָם అంటే ‘ఖాళీగా, ఏమీ లేకుండా.’ విడుదల సమయంలో ఏ సహాయమూ ఇవ్వకుండా పంపడాన్ని తెలుగులో ‘వట్టిచేతులతో’ అనే సహజమైన నుడికారం తెలియజేస్తుంది.
