translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ అనువదించబడింది. ఏకవచన పురుష సంబోధనను ‘నీవు’తో, పురుష సేవకుని సూచనను ‘అతణ్ణి’తో నిలిపాం; పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో పొందుపరచబడింది.
