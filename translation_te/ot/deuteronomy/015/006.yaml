- from: ఎందుకంటే, నీ దేవుడైన యెహోవా నీతో చెప్పినట్లే[a] నిన్ను ఆశీర్వదించాడు. నీవు అనేక జనాలకు అప్పిస్తావు, కానీ నీవు అప్పు తీసుకోవు; నీవు అనేక జనాలపై పరిపాలిస్తావు, కానీ వారు నీపై పరిపాలించరు.
  to: ఎందుకంటే నీ దేవుడైన యహ్వే, నీకు చెప్పినట్లే, నిన్ను ఆశీర్వదించాడు. నీవు అనేక దేశాలకు అప్పు ఇస్తావు, కానీ అప్పు తీసుకోవు; నీవు అనేక దేశాలపై పరిపాలిస్తావు, కానీ అవి నీపై పరిపాలించవు.
