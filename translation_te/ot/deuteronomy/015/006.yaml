  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: te
  text: ఎందుకంటే నీ దేవుడైన యహ్వే, నీకు చెప్పినట్లే, నిన్ను ఆశీర్వదించాడు. నీవు అనేక దేశాలకు అప్పు ఇస్తావు, కానీ అప్పు తీసుకోవు; నీవు అనేక దేశాలపై పరిపాలిస్తావు, కానీ అవి నీపై పరిపాలించవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించాం.
- source_word: בֵּרַכְךָ
  choice: నిన్ను ఆశీర్వదించాడు
  rationale: హీబ్రూ క్రియ సంపూర్ణ రూపంలో ఉంది; తరువాత చెప్పే ఆర్థిక, రాజకీయ ఫలితాలకు ఆధారమైన దేవుని నిశ్చిత ఆశీర్వాదాన్ని ఇది సూచిస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: నీతో చెప్పినట్లే
  rationale: דִּבֶּר అనే పదానికి నేర అర్థమైన ‘చెప్పాడు/మాట్లాడాడు’ను ప్రధాన పాఠంలో ఉంచి, నిబంధన సందర్భంలో ఉండగల ‘వాగ్దానం చేశాడు’ అనే భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְהַעֲבַטְתָּ
  choice: నీవు ... అప్పిస్తావు
  rationale: עבט హిఫిల్ రూపం ఇతరులకు రుణం ఇవ్వడాన్ని సూచిస్తుంది; ‘అప్పిస్తావు’ సహజమైన, సంక్షిప్తమైన తెలుగు.
- source_word: גּוֹיִם רַבִּים
  choice: అనేక జనాలు
  rationale: ఇక్కడ גּוֹיִם ఆర్థిక, రాజకీయ సంబంధాల్లోని జాతీయ సమూహాలను సూచిస్తుంది; ‘జనాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని సమూహ భావాన్ని నిలుపుతుంది.
- source_word: לֹא תַעֲבֹט
  choice: నీవు అప్పు తీసుకోవు
  rationale: עבט యొక్క కాల్ రూపం ముందున్న హిఫిల్‌కు వ్యతిరేకంగా అప్పు తీసుకోవడాన్ని సూచిస్తుంది; ఈ అనువాదం మూలంలోని స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וּמָשַׁלְתָּ
  choice: నీవు ... పరిపాలిస్తావు
  rationale: משׁל పాలన లేదా ఆధిపత్యాన్ని సూచిస్తుంది; జాతీయ సందర్భంలో ‘పరిపాలిస్తావు’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే రూపం.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: వారు నీపై పరిపాలించరు
  rationale: బహువచన క్రియ ముందున్న అనేక జనాలను తిరిగి సూచిస్తుంది; ‘వారు’ అని స్పష్టం చేయడం తెలుగులో సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక దేవుని నిబంధన నామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- issue: דִּבֶּר యొక్క నిబంధన సంబంధ భావం
  choice: ప్రధాన పాఠంలో ‘చెప్పినట్లే’
  alternative: ‘వాగ్దానం చేసినట్లే’
  rationale: మూల క్రియకు నేర అర్థాన్ని కాపాడుతూ, సందర్భంలో అది వాగ్దాన భావాన్ని మోసే అవకాశాన్ని పాదటిప్పణిలో సూచించడం ద్వారా నిజమైన అర్థ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించాం. ఏకవచన ‘నీవు/నీ’ ద్వారా ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సంబోధించే హీబ్రూ రూపాన్ని కాపాడాం. మూలంలోని ‘అప్పించడం—అప్పు తీసుకోవడం’, ‘పరిపాలించడం—పరిపాలింపబడకపోవడం’ అనే సమాంతర విరుద్ధ నిర్మాణాన్ని నిలిపాం.
