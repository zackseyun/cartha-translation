source:
  edition: WLC
  text: הַעֲנֵ֤יק תַּעֲנִיק֙ ל֔/וֹ מִ/צֹּ֣אנְ/ךָ֔ וּ/מִֽ/גָּרְנְ/ךָ֖ וּ/מִ/יִּקְבֶ֑/ךָ אֲשֶׁ֧ר בֵּרַכְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ תִּתֶּן לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: te
  text: నీవు అతనికి నీ గొర్రెలు మేకల మందలోనుండి, నీ కళ్లంలోనుండి, నీ ద్రాక్షగానుగలోనుండి తప్పక సమకూర్చాలి[a]; నీ దేవుడైన యాహ్వే నిన్ను దేనితో ఆశీర్వదించాడో దానిలోనుండి అతనికి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి సమృద్ధిగా సరఫరా చేయాలి.’ హెబ్రీలో ఒకే ధాతువును బలార్థకంగా పునరుక్తి చేసిన రూపం ఉంది; అది విడుదల చేసే సమయంలో అతనికి ఉదారంగా సమకూర్చాలని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: తప్పక సమకూర్చాలి
  rationale: ఒకే ధాతువుతో కూడిన హెబ్రీ క్రియావిశేష రూపం మరియు సమాపక క్రియ ఆజ్ఞను బలపరుస్తాయి. ‘తప్పక’ ఆ బలాన్ని తెలియజేస్తుంది; ‘సమకూర్చాలి’ విడుదల సమయంలో అవసరమైన సరఫరా చేయడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. సమృద్ధిగా ఇవ్వాలనే పదార్థ ఛాయను పాదటిప్పణిలో ఉంచి, ప్రధాన వచనంలో అనవసర విస్తరణను నివారించాం.
- source_word: מִצֹּאנְךָ
  choice: నీ మందలోనుండి
  rationale: צאן ప్రధానంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచిస్తుంది. ‘మంద’ ఆ సమష్టి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּמִגָּרְנְךָ
  choice: నీ కళ్లంలోనుండి
  rationale: גֹּרֶן అక్షరార్థంగా ధాన్యం నూర్చే కళ్లాన్ని సూచించి, ఇక్కడ అక్కడి ధాన్య దిగుబడికి ప్రతీకగా ఉంది. ‘కళ్లం’ హెబ్రీ వ్యవసాయ చిత్రణను కాపాడుతుంది.
- source_word: וּמִיִּקְבֶךָ
  choice: నీ ద్రాక్షగానుగలోనుండి
  rationale: יֶקֶב ద్రాక్షరసం తీసే గానుగను లేదా దాని తొట్టిని సూచిస్తుంది. ‘ద్రాక్షగానుగ’ సందర్భాన్ని స్పష్టంగా, చిత్రాత్మకంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే నిన్ను దేనితో ఆశీర్వదించాడో
  rationale: ఈ సంబంధవాక్యం ఇవ్వవలసినది దేవుడు ముందుగా ప్రసాదించిన ఆశీర్వాదం నుండే రావాలని తెలియజేస్తుంది. తెలుగు నిర్మాణం మూలంలోని మూలాధార భావాన్ని నిలుపుతుంది; ఆశీర్వాద పరిమాణానికి అనుగుణంగా ఇవ్వాలనే సంభావ్య భావాన్ని బలవంతంగా స్పష్టీకరించదు.
- source_word: תִּתֶּן לוֹ
  choice: దానిలోనుండి అతనికి ఇవ్వాలి
  rationale: చివరి ఆజ్ఞలోని נתן అనే సాధారణ ‘ఇవ్వు’ క్రియను నేరుగా ప్రతిబింబిస్తూ, ముందున్న ఆశీర్వాదం నుండే ఇవ్వాలనే సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. ‘యాహ్వే’ దానికి సాధారణంగా అంగీకరించిన పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కళ్లం’, ‘ద్రాక్షగానుగ’ అనే పదాలు మూలంలోని మూడు వ్యవసాయ వనరుల స్పష్టమైన చిత్రణను నిలుపుతాయి. ఆజ్ఞ యొక్క బలాన్ని ‘తప్పక’ ద్వారా వ్యక్తపరిచాం.
