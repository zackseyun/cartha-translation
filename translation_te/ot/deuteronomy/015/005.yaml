  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: te
  text: మీరు మీ దేవుడైన యెహోవా స్వరాన్ని శ్రద్ధగా విని, నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న ఈ ఆజ్ఞనంతటినీ జాగ్రత్తగా ఆచరిస్తేనే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: జాగ్రత్తగా విని
  rationale: హీబ్రూ ధాతువు పునరుక్తి శ్రద్ధతో వినడాన్ని బలపరుస్తుంది; తెలుగులో సహజంగా క్రియావిశేషణంతో వ్యక్తం చేశాం.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యెహోవా స్వరాన్ని
  rationale: ‘స్వరాన్ని విను’ అనే మూలభాషా ప్రయోగాన్ని నిలిపి, దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించాం.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటిస్తే
  rationale: ‘కాపాడి చేయడం’ అనే సంయుక్త భావం ఆజ్ఞను శ్రద్ధగా ఆచరించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘జాగ్రత్తగా పాటించు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ఈ ఆజ్ఞ అంతటినీ
  rationale: ఏకవచనమైన ‘ఆజ్ఞ’ను అలాగే ఉంచి, כָּל సూచించే సంపూర్ణతను ‘అంతటినీ’తో వ్యక్తం చేశాం.
- source_word: רַק אִם
  choice: …తేనే
  rationale: షరతును బలపరిచే ‘మాత్రమే/అయితేనే’ భావాన్ని తెలుగు వాక్యాంతంలోని ‘తేనే’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה ప్రతినిధానం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు పరిచితమైన రూపంలో ఉంచాం.
- issue: ‘వినడం’లో విధేయత భావాన్ని స్పష్టీకరించడం
  choice: ‘విని’ అనే మూల రూపాన్ని ఉంచి, తరువాతి ‘పాటిస్తే’తో ఆచరణ భావాన్ని తెలిపాం
  alternative: ‘విధేయత చూపితే’ అని అనువదించడం
  rationale: మూలంలోని ‘స్వరం వినడం’ రూపకాన్ని కాపాడుతూ, దాని సందర్భానుగుణ విధేయత భావాన్ని తరువాతి పదబంధం వెల్లడించేలా చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఈ వచనం ముందున్న వాగ్దానానికి అనుసంధానమైన షరతు కావడంతో స్వతంత్ర వాక్యంగానూ సహజంగా వినిపించేలా ‘తేనే’తో ముగించాం.
