  edition: WLC
  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: te
  text: అయితే[a] మీ మధ్య పేదవాడు ఉండకూడదు. ఎందుకంటే, మీరు స్వాధీనం చేసుకోవడానికి మీ దేవుడైన యాహ్వే మీకు స్వాస్థ్యంగా ఇస్తున్న దేశంలో యాహ్వే మిమ్మల్ని తప్పకుండా ఆశీర్వదిస్తాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అయినప్పటికీ’ లేదా ‘మినహా’; హీబ్రూ పదం ముందున్న ఆదేశానికి ఒక పరిమితిని లేదా మినహాయింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: అయితే
  rationale: ముందున్న రుణవిమోచన ఆదేశానికి పరిమితిని లేదా మినహాయింపును సూచించే సంభాషణ మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶבְיוֹן
  choice: పేదవాడు
  rationale: ఆర్థిక కొరతలో ఉన్న పేద లేదా అవసరంలో ఉన్న వ్యక్తిని సూచిస్తుంది; సందర్భానికి విస్తృతంగా, సహజంగా సరిపోతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యాహ్వే ఆశీర్వాదమే ముందున్న ప్రకటనకు కారణమని స్పష్టంగా తెలిపే కారణార్థక ప్రయోగం.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: మిమ్మల్ని తప్పకుండా ఆశీర్వదిస్తాడు
  rationale: ధాతురూపానికి ముందు వచ్చిన infinitive absolute కలిగించే బలాన్ని, అదనపు భావాన్ని చేర్చకుండా, తెలుగులో ‘తప్పకుండా’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: נֹתֵן
  choice: ఇస్తున్న
  rationale: భూమిని దేవుడు ఇస్తున్న కార్యాన్ని సమీపమైన లేదా కొనసాగుతున్న కార్యంగా చూపే హీబ్రూ participle భావాన్ని నిలుపుతుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: ఒడంబడికలో కేటాయించబడిన భూస్వాస్థ్యానికి సంబంధించిన న్యాయపరమైన, ధార్మిక ప్రతిధ్వనులను నిలుపుతుంది.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: భూమిని ఆధీనంలోకి తీసుకొని అనుభవించడాన్ని సూచించే ירשׁ క్రియాభావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం టెట్రాగ్రామటన్‌ను నేరుగా ఉపయోగిస్తుంది. ‘ప్రభువు’ అనే బిరుదును పెట్టకుండా ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. ‘స్వాస్థ్యంగా స్వాధీనం చేసుకోవడానికి’ అనే పదబంధం נַחֲלָה మరియు ירשׁ మధ్య ఉన్న సంబంధాన్ని నిలుపుతుంది. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
