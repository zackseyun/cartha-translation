source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמַ֣ר אֵלֶ֔י/ךָ לֹ֥א אֵצֵ֖א מֵ/עִמָּ֑/ךְ כִּ֤י אֲהֵֽבְ/ךָ֙ וְ/אֶת בֵּיתֶ֔/ךָ כִּי ט֥וֹב ל֖/וֹ עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: te
  text: 'అతడు నీతో ఇలా అంటే: “నేను నిన్ను విడిచి వెళ్లను”[a]—అతడు నిన్నూ నీ ఇంటివారినీ[b] ప్రేమిస్తున్నందున, నీతో అతనికి బాగుంది కాబట్టి—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను నీ దగ్గరనుంచి బయటికి వెళ్లను.” ఈ సందర్భంలో అది “నేను నిన్ను విడిచి వెళ్లను” లేదా “నేను నీ దగ్గరనుంచి విడుదలై వెళ్లను” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నీ ఇంటివారు” ఇక్కడ హీబ్రూ మాట “నీ ఇల్లు”ను అనువదిస్తుంది. అది కేవలం భవనాన్ని కాక, యజమాని ఇంటి పరిధిలోని ప్రజలనూ గృహజీవితాన్నీ సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అప్పుడు ... అని అంటే
  rationale: న్యాయవిధిలో సంభవించగల పరిస్థితిని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో షరతుగా వ్యక్తపరుస్తుంది.
- source_word: יֹאמַר אֵלֶיךָ
  choice: అతడు నిన్ను ... అని అంటే
  rationale: ఈ న్యాయ సందర్భంలోని అపూర్ణ క్రియ సంభవించగల సందర్భాన్ని సూచిస్తుంది; ప్రత్యక్ష వాక్యంతో కూడిన తెలుగు నిర్మాణం సహజంగా ఉంటుంది.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: నేను నిన్ను విడిచి వెళ్లను
  rationale: యָצָא యొక్క ‘బయటికి వెళ్లడం’ అనే మూలచిత్రం ఇక్కడ యజమాని సాంగత్యం నుంచి వెళ్లిపోవడాన్ని సూచిస్తుంది. ‘విడిచి వెళ్లను’ సంబంధార్థాన్ని సహజంగా తెలియజేస్తూ, విడుదల భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: כִּי אֲהֵבְךָ
  choice: అతడు నిన్నూ ... ప్రేమిస్తున్నాడు
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది; వర్తమాన రూపం సేవకుని కొనసాగుతున్న అనురాగాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶת בֵּיתֶךָ
  choice: నీ ఇంటివారినీ
  rationale: בַּיִת ఇక్కడ కేవలం భవనాన్ని కాక యజమాని గృహసముదాయంలోని ప్రజలను సూచిస్తుంది; ‘ఇంటివారు’ ఆధునిక తెలుగులో సహజంగా ఆ సామాజిక భావాన్ని అందిస్తుంది.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: నీ దగ్గర అతనికి మేలు కలుగుతోంది
  rationale: ‘నీతో అతనికి మంచిగా ఉంది’ అనే హీబ్రూ భావాన్ని, సేవకుడు యజమాని వద్ద క్షేమంగా ఉన్నాడనే అర్థంతో సహజమైన తెలుగులో తెలియజేస్తుంది; కారణ సంబంధాన్ని ‘కాబట్టి’ కలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-కథన శైలి. వాక్యం తరువాతి వచనంలో పూర్తయ్యే షరతు నిర్మాణం కావడంతో చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది. ఏకవచన ద్వితీయ పురుష రూపాలు మూలంలోని రూపాన్ని నిలుపుతాయి.
