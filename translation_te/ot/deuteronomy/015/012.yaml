id: DEU.15.12
reference: Deuteronomy 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: te
  text: నీ సహోదరుడైన హెబ్రీయ పురుషుడైనా, హెబ్రీయ స్త్రీయైనా నీకు అమ్మబడినప్పుడు, అతడు ఆరు సంవత్సరాలు నీకు సేవ చేస్తే, ఏడవ సంవత్సరంలో అతణ్ణి నీ దగ్గరనుండి స్వతంత్రునిగా పంపివేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పంపివేయాలి” అనే క్రియకు హెబ్రీలో పురుష ఏకవచన ప్రత్యయం ఉంది. అయితే ముందు “హెబ్రీయ పురుషుడైనా, హెబ్రీయ స్త్రీయైనా” అని ఉన్నందున, ఈ ఆజ్ఞ వారిలో ఎవరికైనా వర్తిస్తుంది.
    reason: మూలంలోని పురుష ఏకవచన వ్యాకరణ రూపాన్ని నిలుపుతూ దాని సమావేషక పరిధిని స్పష్టం చేయడం.
lexical_decisions:
- source_word: יִמָּכֵר
  choice: నీకు అమ్మబడినప్పుడు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని నేరుగా నిలుపుతుంది; అప్పు కారణంగా తనను తాను అమ్ముకోవడం వంటి సాధ్యమైన నేపథ్యాన్ని అనవసరంగా పాఠ్యంలో చేర్చదు.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడైన
  rationale: ఒడంబడిక సమాజంలోని కుటుంబసంబంధ భాషను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: హెబ్రీయ పురుషుడైనా, హెబ్రీయ స్త్రీయైనా
  rationale: మూలంలోని పుంలింగ, స్త్రీలింగ జాతి గుర్తింపులను స్పష్టంగా ప్రతిబింబిస్తుంది; ఇక్కడ లేని ‘దాసుడు/దాసి’ అనే పదాలను చేర్చదు.
- source_word: וַעֲבָדְךָ
  choice: నీకు సేవ చేస్తే
  rationale: עבד అనే క్రియలోని సేవ/పని భావాన్ని చట్టపరమైన సందర్భానికి తగిన సహజ తెలుగులో అందిస్తుంది.
- source_word: שֵׁשׁ שָׁנִים
  choice: ఆరు సంవత్సరాలు
  rationale: సంఖ్యా వ్యక్తీకరణకు నేరమైన సమానం.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: ఏడవ సంవత్సరంలో
  rationale: ఆరు సంవత్సరాల సేవ తర్వాతి తప్పనిసరి విడుదల సమయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: అతణ్ణి ... పంపివేయాలి
  rationale: שלח యొక్క ‘పంపు’ ప్రతిమను నిలుపుతుంది; పురుష ఏకవచన ప్రత్యయాన్ని ప్రధాన పాఠ్యంలో ప్రతిబింబిస్తుంది.
- source_word: חָפְשִׁי
  choice: స్వతంత్రునిగా
  rationale: విడుదల పొందిన వ్యక్తి స్వేచ్ఛా స్థితిని సహజమైన న్యాయసంబంధ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעִמָּךְ
  choice: నీ దగ్గరనుండి
  rationale: ‘నీతో ఉన్న స్థితి నుండి’ అనే మూల భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పురుషుడు లేదా స్త్రీ అని పేర్కొన్న తర్వాత విడుదల పొందే వ్యక్తికి పురుష ఏకవచన రూపం వాడటం
  choice: ప్రధాన పాఠ్యంలో ‘అతణ్ణి’ మరియు ‘స్వతంత్రునిగా’ అనే పురుష ఏకవచన రూపాలను నిలిపి, అవి ఇద్దరిలో ఎవరికైనా వర్తిస్తాయని పాదటిప్పణిలో స్పష్టం చేయడం.
  alternative: ‘అతణ్ణిగాని ఆమెనుగాని’ అని లింగ సమావేషాన్ని ప్రధాన పాఠ్యంలోనే విప్పి చెప్పడం.
  rationale: హెబ్రీ పాఠ్యం పురుషుడు, స్త్రీ ఇద్దరినీ స్పష్టంగా పేర్కొన్నప్పటికీ తరువాత పురుష ఏకవచన ప్రత్యయాన్ని వాడుతుంది. మూలంలోని వ్యాకరణ రూపాన్ని మరియు ధర్మశాసనం ఇద్దరికీ వర్తించే పరిధిని రెండింటినీ ఈ విధానం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయశైలి. ‘సహోదరుడు’ ద్వారా మూలంలోని కుటుంబ/ఒడంబడిక భావం నిలుపబడింది; ‘అమ్మబడినప్పుడు’ ద్వారా కర్మణి రూపం సంరక్షించబడింది.
