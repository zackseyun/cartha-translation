revisions:
- from: నీ మధ్య, అంటే నీ సహోదరులలో ఒకడు[b], నీ దేవుడైన యహ్వే నీకు ఇస్తున్న దేశంలోని నీ పట్టణాల్లో ఒకదానిలో[a] పేదవాడై ఉంటే, పేదవాడైన నీ సహోదరుని పట్ల నీ హృదయాన్ని కఠినపరచుకోకు; నీ చేతిని మూసుకోకు.
  to: నీ దేవుడైన యహ్వే నీకు ఇస్తున్న నీ దేశంలోని నీ పట్టణాల్లో ఏదో ఒకదానిలో నీ సహోదరులలో ఒక పేదవాడు నీ మధ్యలో ఉంటే, పేదవాడైన నీ సహోదరుని పట్ల నీ హృదయాన్ని కఠినపరచుకోకు; నీ చేతిని మూసుకోకు.
  rationale: 'The revision removes an added gloss, improves Telugu word order, and renders the poor person’s condition without implying that he has newly become poor. It retains the source’s covenant kinship language, the gate/town footnote distinction, the divine name, and both heart-and-hand metaphors. Footnote anchors remain: [b] after “సహోదరులలో ఒక” and [a] after “పట్టణాల్లో ఏదో ఒకదానిలో.”'
  reviewer_model: gpt-5.6-terra
