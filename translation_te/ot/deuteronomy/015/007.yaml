  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: te
  text: నీ దేవుడైన యహ్వే నీకు ఇస్తున్న నీ దేశంలోని నీ పట్టణాల్లో ఏదో ఒకదానిలో నీ సహోదరులలో ఒక పేదవాడు నీ మధ్యలో ఉంటే, పేదవాడైన నీ సహోదరుని పట్ల నీ హృదయాన్ని కఠినపరచుకోకు; నీ చేతిని మూసుకోకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: ఉంటే
  rationale: న్యాయవిధిలో ఒక సంభావ్య పరిస్థితిని పరిచయం చేసే షరతు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶבְיוֹן
  choice: పేదవాడు
  rationale: ఆర్థికంగా పేదవాడు లేదా అవసరంలో ఉన్నవాడు అనే భావాన్ని తెలియజేస్తుంది; హీబ్రూ పుంలింగ ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: מֵאַחַד אַחֶיךָ
  choice: నీ సహోదరులలో ఒకడు
  rationale: ఒడంబడిక సమాజంలోని వారిని కుటుంబ బంధుత్వ భాషలో పేర్కొన్న మూలపాఠానికి దగ్గరగా ఉంటుంది.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో ఒకదానిలో
  rationale: ‘ద్వారాలు’ అనే హీబ్రూ ప్రయోగం సందర్భంలో పట్టణాలు లేదా నివాస స్థలాలను సూచిస్తుంది; ప్రధాన పాఠంలో సహజమైన తెలుగు ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: నీ హృదయాన్ని కఠినపరచుకోకు
  rationale: కనికరం చూపకుండా మొండిగా ఉండడాన్ని సూచించే హీబ్రూ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: నీ చేతిని మూసుకోకు
  rationale: సహాయం చేయకుండా చేతిని బిగించుకునే మూలపాఠంలోని సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: పేదవాడైన నీ సహోదరుని పట్ల
  rationale: నిరాకరణ ఎవరిపట్ల చూపబడుతోందో తెలుగులో సహజంగా తెలియజేస్తూ బంధుత్వ భాషను కాపాడుతుంది.
theological_decisions:
- issue: ఒడంబడిక సమాజానికి వాడిన אַחֶיךָ / אָחִיךָ బంధుత్వ భాష
  choice: సహోదరులు / సహోదరుడు
  alternative: బంధువులు / తోటి ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబ సంబంధ భాష సమాజ సభ్యుల పరస్పర బాధ్యతను బలంగా తెలియజేస్తుంది; దానిని వివరణాత్మక పదంతో సమతలపరచలేదు.
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని వ్యక్తిగత నామంగానే నిలుపుతుంది.
- issue: ఏకవచన పుంలింగ న్యాయవిధి భాష
  choice: పేదవాడు / సహోదరుడు
  alternative: పేద వ్యక్తి / సమాజ సభ్యుడు
  rationale: హీబ్రూ వ్యాకరణ రూపాన్ని కాపాడుతూ, అది ఒడంబడిక సమాజ సభ్యుని ప్రతినిధిగా వాడబడిందని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా ఆజ్ఞాపించే శైలిని ఉపయోగించాం. హీబ్రూలోని సామూహిక ఏకవచన సంబోధనను ‘నీ’ రూపంతో నిలిపాం; ‘హృదయాన్ని కఠినపరచుకోవడం,’ ‘చేతిని మూసుకోవడం’ అనే రెండు మూల రూపకాలను సహజంగా సంరక్షించాం.
