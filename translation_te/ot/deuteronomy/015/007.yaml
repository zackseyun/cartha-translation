review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal Hebrew elements: the conditional legal formulation, covenant-family terminology, the town/gate expression, the divine name, and the paired prohibitions concerning heart and hand. However, “పేదవాడై ఉంటే” can suggest ‘becomes poor,’ whereas אֶבְיוֹן denotes a poor/needy person in the stated situation. The inserted “అంటే” is also an explanatory gloss not present in the source.'
  naturalness: The opening construction is somewhat awkward in modern standard Telugu, especially “నీ మధ్య, అంటే నీ సహోదరులలో ఒకడు.” Reordering the nested locative and kinship phrases yields a clear legal-style sentence without adding interpretation.
  terminology: “యహ్వే,” “సహోదరులు/సహోదరుడు,” and “హృదయాన్ని కఠినపరచుకోకు” are suitable. “పట్టణాలు” is an acceptable contextual rendering of ‘gates’ when the literal wording is retained in a footnote. The existing cultural footnote appropriately explains the covenant-community sense without replacing the familial terminology in the text.
  issues:
  - severity: medium
    issue: The phrase “పేదవాడై ఉంటే” may imply becoming poor.
    rationale: The Hebrew אֶבְיוֹן identifies the person as poor/needy in the conditional circumstance; it does not specifically express a transition into poverty. “పేదవాడు ఉంటే” more closely preserves the source sense.
  - severity: low
    issue: “అంటే” adds an unneeded explanatory identification and makes the opening less natural.
    rationale: The Hebrew simply places a poor person ‘from one of your brothers’ among the addressees. The added phrase is not required and can obscure the syntactic relationship.
  revised_text: నీ దేవుడైన యహ్వే నీకు ఇస్తున్న నీ దేశంలోని నీ పట్టణాల్లో ఏదో ఒకదానిలో నీ సహోదరులలో ఒక పేదవాడు నీ మధ్యలో ఉంటే, పేదవాడైన నీ సహోదరుని పట్ల నీ హృదయాన్ని కఠినపరచుకోకు; నీ చేతిని మూసుకోకు.
  revised_footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా “నీ ద్వారాల్లో ఒకదానిలో.” ఇక్కడ పట్టణ ద్వారాలు పట్టణాన్నే సూచించే ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులు,” “సహోదరుడు” అనే కుటుంబ సంబంధ పదాలు ఇక్కడ ఒడంబడిక సమాజంలోని తోటి సభ్యులను సూచిస్తాయి.
    reason: cultural_note
  revision_rationale: 'The revision removes an added gloss, improves Telugu word order, and renders the poor person’s condition without implying that he has newly become poor. It retains the source’s covenant kinship language, the gate/town footnote distinction, the divine name, and both heart-and-hand metaphors. Footnote anchors remain: [b] after “సహోదరులలో ఒక” and [a] after “పట్టణాల్లో ఏదో ఒకదానిలో.”'
