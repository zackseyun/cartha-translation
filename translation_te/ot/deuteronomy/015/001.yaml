  yaml_path: translation/ot/deuteronomy/015/001.yaml
  text: At the end of every seven years you shall make a release[a].
translation:
  language: te
  text: ప్రతి ఏడు సంవత్సరాల చివరలో నీవు విడుదల చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రద్దు’ లేదా ‘మాఫీ’; హీబ్రూ שְׁמִטָּה ఏడవ సంవత్సరానికి సంబంధించిన అప్పుల విడుదలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: ముగింపులో
  rationale: מִקֵּץ అనే కాలసూచక ప్రయోగం ‘ముగింపులో’ అనే భావాన్ని ఇస్తుంది. ఇది చర్య సరిగ్గా ఏ క్షణంలో జరగాలనే విషయాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని కాలసూచనను నిలుపుతుంది.
- source_word: שֶׁבַע שָׁנִים
  choice: ప్రతి ఏడు సంవత్సరాల
  rationale: అక్షరార్థంగా ‘ఏడు సంవత్సరాలు’; ధర్మశాస్త్ర సందర్భంలో ఇది పునరావృతమయ్యే ఏడు సంవత్సరాల చక్రాన్ని సూచిస్తుంది కాబట్టి ‘ప్రతి’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: నీవు ... అమలు చేయాలి
  rationale: עשה అనే క్రియ విస్తృతంగా ‘చేయు’ అని అర్థం. ఇక్కడ శְׁמִטָּה అనే ధర్మశాస్త్ర ఏర్పాటును కార్యరూపంలో పెట్టడాన్ని సూచిస్తున్నందున ‘అమలు చేయాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆజ్ఞాత్మక బలాన్ని కాపాడుతుంది.
- source_word: שְׁמִטָּה
  choice: విడుదల
  rationale: ఈ పదం వదిలివేయడం లేదా విడుదల చేయడం అనే విస్తృత భావాన్ని కలిగి ఉంది; తరువాతి వచనాలు ఇది అప్పుల విడుదలకు సంబంధించినదని వివరిస్తాయి. ‘విడుదల’ ఆ వివరాన్ని ముందుగానే అతిగా నిర్ణయించకుండా మూలపదపు విస్తృతిని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘విడుదల’ అనే పదం మూలంలోని విస్తృత భావాన్ని కాపాడగా, పాదటిప్పణి సందర్భంలోని అప్పుల మాఫీ భావాన్ని స్పష్టం చేస్తుంది.
