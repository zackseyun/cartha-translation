- from: అప్పుడు నీవు గుచ్చే పనిముట్టును తీసుకొని, అతని చెవిలోనుంచి తలుపులోకి దాన్ని గుచ్చాలి. అప్పుడు అతడు శాశ్వతంగా[a] నీకు బానిసగా ఉంటాడు. నీ ఆడ బానిసకు కూడా అలాగే చేయాలి.
  to: అప్పుడు నీవు ఆ మొనగల పనిముట్టును తీసుకొని, అతని చెవిని తలుపుకు ఆనించి దానితో గుచ్చాలి. అప్పుడు అతడు జీవితాంతం[a] నీకు బానిసగా ఉంటాడు. నీ స్త్రీ బానిసకు కూడా అలాగే చేయాలి.
