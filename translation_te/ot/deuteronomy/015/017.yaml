source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: te
  text: అప్పుడు నీవు ఆ మొనగల పనిముట్టును తీసుకొని, అతని చెవిని తలుపుకు ఆనించి దానితో గుచ్చాలి. అప్పుడు అతడు జీవితాంతం[a] నీకు బానిసగా ఉంటాడు. నీ స్త్రీ బానిసకు కూడా అలాగే చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాశ్వతంగా” లేదా “ఎప్పటికీ.” ఈ న్యాయ సందర్భంలో హీబ్రూ పదం జీవితకాలమంతా కొనసాగే స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: గుచ్చే పనిముట్టు
  rationale: మַרְצֵעַ అనేది రంధ్రం చేయడానికి లేదా గుచ్చడానికి ఉపయోగించే మొనగల పనిముట్టు. ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండేందుకు అరుదైన లేదా ప్రాచీన సాంకేతిక పదం బదులు ‘గుచ్చే పనిముట్టు’ అని అనువదించాం.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: అతని చెవిలోనుంచి తలుపులోకి దాన్ని గుచ్చాలి
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ఆ పనిముట్టును అతని చెవిలోను తలుపులోను పెట్టడాన్ని చెబుతుంది. సందర్భంలోని చెవి గుచ్చే క్రియను స్పష్టంగా తెలియజేస్తూ, చెవి నుంచి తలుపులోకి వెళ్లే చర్యను ఈ రూపం సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֶבֶד
  choice: బానిస
  rationale: ఈ న్యాయ సందర్భంలో స్వేచ్ఛగా వెళ్లకుండా స్థిరమైన బంధిత స్థితిని స్వీకరించడం ప్రధానాంశం. అందువల్ల మృదువైన ‘సేవకుడు’ కంటే ‘బానిస’ సామాజిక-న్యాయ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: עוֹלָם
  choice: శాశ్వతంగా
  rationale: ఈ పదం దీర్ఘకాలికంగా, స్థిరంగా కొనసాగే స్థితిని సూచిస్తుంది. ఇక్కడ అది తాత్త్వికమైన అనంతకాలాన్ని తప్పనిసరిగా సూచించదు; అందుకే న్యాయపరమైన స్థిరత్వాన్ని తెలిపే ‘శాశ్వతంగా’ వాడి, సందర్భోచితమైన ‘జీవితాంతం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֲמָתְךָ
  choice: నీ ఆడ బానిస
  rationale: אָמָה స్త్రీ బానిసను లేదా బంధిత సేవకురాలిని సూచిస్తుంది. ఇదే వచనంలోని עֶבֶד కు ‘బానిస’ అని చేసిన అనువాదంతో సామాజిక స్థితి పరంగా ఏకరూపత ఉండేందుకు ‘ఆడ బానిస’ ఎంచుకున్నాం.
- source_word: וְאַף ... תַּעֲשֶׂה כֵּן
  choice: కూడా అలాగే చేయాలి
  rationale: ఈ పదబంధం ముందటి నియమాన్ని స్త్రీ బానిసకు కూడా వర్తింపజేస్తుంది. ‘కూడా అలాగే’ ఆ విస్తరణను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు బానిసత్వ న్యాయంలో బంధిత స్థితిని సూచించే పదజాలం
  choice: ‘బానిస’ / ‘ఆడ బానిస’
  alternative: ‘సేవకుడు’ / ‘సేవకురాలు’
  rationale: ఈ వచనం ఒక న్యాయ కర్మ ద్వారా స్థిరపరచబడే బంధిత స్థితి గురించి మాట్లాడుతుంది. ‘బానిస’ అనేది ఆ సామాజిక-న్యాయ బలాన్ని దాచకుండా చూపుతుంది; అదే సమయంలో తరువాతి కాలాల సిద్ధాంతపరమైన భావాలను ఇందులో చేర్చదు.
- issue: עוֹלָם సూచించే కాలవ్యాప్తి
  choice: ప్రధాన పాఠంలో ‘శాశ్వతంగా’; పాదటిప్పణిలో ‘జీవితాంతం’
  alternative: ‘ఎప్పటికీ’ లేదా కేవలం ‘జీవితాంతం’
  rationale: హీబ్రూ పదంలోని దీర్ఘకాలికతను ప్రధాన పాఠం నిలుపుతుంది; న్యాయ సందర్భంలో అది వ్యక్తి జీవితకాలాన్ని సూచించవచ్చనే పరిమితిని పాదటిప్పణి తెలియజేస్తుంది. ఈ విధంగా మూలంలోని భావ ఉద్రిక్తతను ఒకే అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. అరుదైన ‘కదురు’ వంటి పదం బదులు ‘గుచ్చే పనిముట్టు’ వాడాం. ఆజ్ఞారూపానికి సహజమైన ‘చేయాలి’ నిర్మాణాన్ని పాటించాం.
