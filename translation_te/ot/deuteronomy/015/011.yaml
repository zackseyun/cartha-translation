id: DEU.15.11
reference: Deuteronomy 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: te
  text: 'ఎందుకంటే దేశంలో పేదవారు ఎప్పటికీ లేకుండా పోరు. అందుకే నేను నీకు ఇలా ఆజ్ఞాపిస్తున్నాను: “నీ దేశంలో ఉన్న నీ సహోదరునికి[a], నీ దీనునికి[b], నీ పేదవానికి నీ చెయ్యి తప్పక తెరవాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ తోటి ఇశ్రాయేలీయునికి.” హీబ్రూ పాఠంలో “నీ సహోదరునికి” అని ఉంది; ఇది నిబంధన సమాజంలో బంధుత్వ భాషగా ప్రతినిధి భావంతో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: “దీనుడు” అని అనువదించిన హీబ్రూ పదం పేదవాణ్ని, అణగారినవాణ్ని లేదా కష్టాల్లో ఉన్నవాణ్ని సూచించగలదు; “పేదవాడు,” “అవసరంలో ఉన్నవాడు” అనే అనువాదాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: పేదవారు ఎప్పటికీ లేకుండా పోరు
  rationale: ఏకవచన రూపం ఇక్కడ ఒక వర్గాన్ని సమష్టిగా సూచిస్తోంది. తెలుగు బహువచనం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఎప్పటికీ లేకుండా పోరు’ నిరాకరణతో కూడిన కొనసాగుతున్న వాస్తవాన్ని నిలుపుతుంది.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: దేశంలో
  rationale: కֶרֶב యొక్క ‘మధ్యలో/లోపల’ భావం తెలుగులో స్థానవాచక ‘లో’ ద్వారా సహజంగా వస్తుంది. ద్వితీయోపదేశకాండ సందర్భంలో הָאָרֶץ భూమండలం కంటే నిబంధన దేశాన్ని సూచిస్తుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: మొదటి వాక్యం నుంచి వచ్చే తార్కిక నిర్ధారణను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: నేను నీకు ఇలా ఆజ్ఞాపిస్తున్నాను
  rationale: వర్తమాన ఆజ్ఞాపక బలాన్ని నిలుపుతూ, לֵאמֹר అనే ఉల్లేఖన పరిచయాన్ని తెలుగులో ‘ఇలా’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פָּתֹחַ תִּפְתַּח אֶת יָדְךָ
  choice: నీ చెయ్యి తప్పక తెరవాలి
  rationale: అనంతక్రియతో కూడిన క్రియారూపం ఇచ్చే తీవ్రతను ‘తప్పక’ తెలియజేస్తుంది; ‘చెయ్యి తెరవడం’ అనే దాతృత్వ రూపకాన్ని వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: לְאָחִיךָ
  choice: నీ సహోదరునికి
  rationale: నిబంధన సమాజంలోని బంధుత్వ భాషను కాపాడుతుంది; తెలుగులో గౌరవప్రదమైన, అర్థమయ్యే పదప్రయోగం.
- source_word: לַעֲנִיֶּךָ
  choice: దీనునికి
  rationale: עָנִי పేదరికంతో పాటు అణచివేత, కష్టస్థితి, దీనత్వాన్ని సూచించగలదు. పక్కనే ఉన్న אֶבְיוֹן నుంచి పదభేదాన్ని నిలుపుతుంది.
- source_word: וּלְאֶבְיֹנְךָ
  choice: పేదవానికి
  rationale: ఆర్థిక కొరత భావాన్ని స్పష్టంగా తెలియజేస్తూ, ముందటి עָנִיకి వేరైన పదంగా ఉంచుతుంది.
- source_word: בְּאַרְצֶךָ
  choice: నీ దేశంలోని
  rationale: గ్రహీతలందరినీ దేశపు సందర్భంలో ఉంచేలా తెలుగులో ముందుకు మార్చబడింది; మూలంలోని నిబంధన దేశ పరిధి నిలుస్తుంది.
theological_decisions:
- issue: నిబంధన బంధుత్వ భాష
  choice: నీ సహోదరునికి
  alternative: నీ తోటి ఇశ్రాయేలీయునికి
  rationale: మూలంలోని పురుష ఏకవచన బంధుత్వ పదాన్ని నిలుపుతూ, దాని ప్రతినిధి/నిబంధన సమాజ భావాన్ని పాదసూచికలో వివరిస్తుంది; దానిని సమతలమైన సామాజిక పదంగా మార్చదు.
- issue: הָאָרֶץ / אַרְצֶךָ పరిధి
  choice: దేశం / నీ దేశం
  alternative: భూమి / నీ నేల
  rationale: ద్వితీయోపదేశకాండలో తక్షణ సూచన ఇశ్రాయేలు నిబంధన దేశానికే. విశ్వవ్యాప్త భూమండల ప్రకటనగా అతిశయింపకుండా ఆ చారిత్రక సందర్భాన్ని కాపాడుతుంది.
- issue: עָנִי మరియు אֶבְיוֹן మధ్య భావసామీప్యం
  choice: దీనుడు మరియు పేదవాడు అనే వేర్వేరు పదాలు
  alternative: ఇద్దరికీ పేదవాడు లేదా అవసరంలో ఉన్నవాడు
  rationale: రెండు హీబ్రూ పదాల భావపరిధులు కొంత కలిసినా అవి ఒకే వాక్యంలో జతగా ఉన్నాయి. ఒకే పదంతో సమానీకరించకుండా అసలు పాఠంలోని స్వల్ప ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ దాతృత్వ రూపకమైన ‘చెయ్యి తెరవడం’ నిలుపబడింది. సహజ తెలుగు వాక్యక్రమం కోసం ‘నీ దేశంలోని’ అనే భాగం గ్రహీతల జాబితాకు ముందు ఉంచబడింది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉన్నాయి.
