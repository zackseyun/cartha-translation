source:
  edition: WLC
  text: אֶת הַ/נָּכְרִ֖י תִּגֹּ֑שׂ וַ/אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ אֶת אָחִ֖י/ךָ תַּשְׁמֵ֥ט יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: te
  text: విదేశీయుని నుండి నీవు బాకీని వసూలు చేయవచ్చు[a]; అయితే నీ సహోదరుని[b] దగ్గర నీకు చెందవలసినదేదైనా ఉంటే, దానిపై నీ పట్టు విడిచిపెట్టాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విదేశీయుని నుండి చెల్లింపును కోరవచ్చు.’ హీబ్రూ క్రియ ఋణాన్ని తిరిగి చెల్లించాలని ఒత్తిడి చేయడం లేదా బాకీని వసూలు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘నీ సహోదరుడు’ అంటే ఇశ్రాయేలు నిబంధన సమాజంలోని తోటి సభ్యుడు.
    reason: cultural_note
  - marker: c
    text: హీబ్రూ మాటకు అక్షరార్థం, ‘నీ చేయి వదులుతుంది.’ విడుదల సంవత్సరంలో తన ఋణహక్కును వదులుకోవడం లేదా బాకీని మాఫీ చేయడం దీని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: విదేశీయుడు
  rationale: ఈ న్యాయసందర్భంలో נָכְרִי ఇశ్రాయేలు నిబంధన సమాజానికి వెలుపల ఉన్న వ్యక్తిని సూచిస్తుంది. ‘విదేశీయుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, సామాజిక-న్యాయ భేదాన్ని నిలుపుతుంది.
- source_word: תִּגֹּשׂ
  choice: బాకీని వసూలు చేయవచ్చు
  rationale: ఋణసందర్భంలో נגשׂ అంటే తిరిగి చెల్లించాలని ఒత్తిడి చేయడం లేదా బాకీని వసూలు చేయడం. తెలుగు న్యాయవాడుకలో ‘బాకీని వసూలు చేయడం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: నీ బాకీ ఏదైనా
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నీకు చెందినది ఏదైతే ఉందో’ అని విస్తృతంగా ఉన్నా, ముందు-వెనుక సందర్భం ఋణవిమోచనకు సంబంధించినది. అందువల్ల ‘నీ బాకీ ఏదైనా’ దాని న్యాయార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: అక్షరార్థ కుటుంబసంబంధ రూపకాన్ని నిలుపుతూ, ద్వితీయోపదేశకాండ న్యాయసందర్భంలో తోటి ఇశ్రాయేలీయుని సూచించే భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: దానిపై నీ పట్టు విడిచిపెట్టాలి
  rationale: שׁמט తో ‘నీ చెయ్యి’ కలిసిన ఈ ప్రయోగం తన హక్కును వదులుకోవడం లేదా ఋణాన్ని మాఫీ చేయడాన్ని సూచిస్తుంది. ‘నీ పట్టు విడిచిపెట్టు’ మూలంలోని చేతి రూపకాన్ని సహజ తెలుగులో కొంతవరకు నిలుపుతూ న్యాయచర్యను తెలియజేస్తుంది.
theological_decisions:
- issue: ద్వితీయోపదేశకాండ న్యాయంలో ‘నీ సహోదరుడు’ అనే పదం యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘నీ సహోదరుడు’ అనే నిబంధనాత్మక కుటుంబపదాన్ని నిలుపడం
  alternative: నీ తోటి ఇశ్రాయేలీయుడు
  rationale: వచనం విదేశీయునికి, నిబంధన సమాజంలోని ‘సహోదరునికి’ మధ్య భేదం చూపుతుంది. మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సామాజిక పరిధిని పాదటిప్పణిలో వివరిస్తే అనవసరమైన వ్యాఖ్యానాన్ని పాఠ్యంలోకి తీసుకురాకుండా ఉంటుంది.
- issue: ‘నీ చెయ్యి విడిచిపెట్టాలి’ అనే హీబ్రూ ప్రయోగం
  choice: ‘దానిపై నీ పట్టు విడిచిపెట్టాలి’ అని రూపకాన్ని సహజ తెలుగులో వ్యక్తం చేయడం
  alternative: నీ బాకీని మాఫీ చేయాలి
  rationale: సందర్భార్థం ఋణహక్కును వదులుకోవడమే అయినా, ప్రధాన పాఠ్యంలో ‘పట్టు విడిచిపెట్టు’ అని ఉంచడం మూలంలోని శరీరరూపకాన్ని కాపాడుతుంది; స్పష్టమైన న్యాయార్థాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన న్యాయశైలి. ‘సహోదరుడు’ ద్వారా మూలంలోని నిబంధనాత్మక కుటుంబరూపకం నిలుపబడింది; ‘పట్టు విడిచిపెట్టు’ ద్వారా చేతి రూపకం సహజంగా వ్యక్తమైంది.
