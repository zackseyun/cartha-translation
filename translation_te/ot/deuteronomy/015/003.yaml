  terminology: ‘విదేశీయుడు,’ ‘సహోదరుడు,’ మరియు ఋణవసూలు/విమోచన సంబంధ పదజాలం తగినవి. ‘సహోదరుడు’కు ఇచ్చిన సాంస్కృతిక పాదటిప్పణి అవసరమైనంత మేరకే వివరిస్తుంది. పాదటిప్పణి cలో అక్షరార్థాన్ని ‘నీ చేయి వదులుతుంది’గా సవరించడం హీబ్రూ రూపకానికి మరింత సమీపం.
