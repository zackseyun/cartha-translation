  source_fidelity: మొదటి ఉపవాక్యం హీబ్రూ ఋణవసూలు భావాన్ని సరిగ్గా ఇస్తుంది. అయితే וַאֲשֶׁר יִהְיֶה לְךָ (‘నీకు చెందినది ఏదైతే ఉందో’) అనే విస్తృత ప్రయోగాన్ని ‘నీ బాకీ’గా పరిమితం చేయడం ప్రధాన పాఠ్యంలో అవసరానికి మించిన వ్యాఖ్యానం. సందర్భం ఋణవిమోచనమే అయినప్పటికీ, మూలంలోని విస్తృతతను నిలుపవచ్చు.
