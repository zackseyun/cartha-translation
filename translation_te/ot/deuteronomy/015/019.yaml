revisions:
- from: నీ పశువులలో, నీ మందలో పుట్టే ప్రతి తొలిచూలు మగపిల్లను నీ దేవుడైన యెహోవాకు ప్రతిష్ఠించాలి.[a] నీ ఎద్దు తొలిచూలుదానితో పని చేయించకూడదు; నీ మందలోని తొలిచూలుదానికి బొచ్చు కత్తిరించకూడదు.
  to: నీ పశువుల గుంపులోను నీ గొర్రెలమేకల మందలోను పుట్టే ప్రతి మగ తొలిచూలును నీ దేవుడైన యెహోవాకు ప్రతిష్ఠించాలి.[a] నీ ఎద్దులో పుట్టిన తొలిచూలును పనికి ఉపయోగించకూడదు; నీ గొర్రెలమేకల మందలో పుట్టిన తొలిచూలు బొచ్చును కత్తిరించకూడదు.
  rationale: సవరణలు అర్థాన్ని మార్చకుండా జంతువులకు వర్తించే పదప్రయోగాన్ని సహజం చేశాయి; בקר మరియు צאן మధ్య వ్యత్యాసాన్ని పశువుల గుంపు మరియు గొర్రెలమేకల మందగా నిలిపాయి; పనికి ఉపయోగించడం, బొచ్చు కత్తిరించడం అనే రెండు నిషేధాలను మూలానికి సన్నిహితంగా స్పష్టం చేశాయి. [a] గుర్తు పాదటిప్పణితో సరిపోతుంది.
