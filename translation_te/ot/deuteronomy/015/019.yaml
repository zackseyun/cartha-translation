source:
  edition: WLC
  text: כָּֽל הַ/בְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּ/בְקָרְ/ךָ֤ וּ/בְ/צֹֽאנְ/ךָ֙ הַ/זָּכָ֔ר תַּקְדִּ֖ישׁ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֤א תַעֲבֹד֙ בִּ/בְכֹ֣ר שׁוֹרֶ֔/ךָ וְ/לֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: te
  text: నీ పశువుల గుంపులోను నీ గొర్రెలమేకల మందలోను పుట్టే ప్రతి మగ తొలిచూలును నీ దేవుడైన యెహోవాకు ప్రతిష్ఠించాలి.[a] నీ ఎద్దులో పుట్టిన తొలిచూలును పనికి ఉపయోగించకూడదు; నీ గొర్రెలమేకల మందలో పుట్టిన తొలిచూలు బొచ్చును కత్తిరించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పశువుల గుంపులోను నీ గొర్రెలమేకల మందలోను పుట్టే మగ తొలిచూలు వాటన్నిటినీ నీ దేవుడైన యెహోవాకు ప్రతిష్ఠించాలి.”
    reason: כָּל הַבְּכוֹרను విభజనాత్మకంగా ‘ప్రతి తొలిచూలు’ అని లేదా సమష్టిగా ‘తొలిచూలు వాటన్నిటినీ’ అని వ్యక్తీకరించవచ్చు.
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  choice: ప్రతి తొలిచూలు
  rationale: ఏకవచన పదబంధంతో ఉన్న כָּל ఇక్కడ విభజనాత్మక భావాన్ని ఇస్తుంది; అందువల్ల ‘ప్రతి’ సహజంగా ఉంది. ‘తొలిచూలు’ మొదట పుట్టిన సంతానాన్ని సూచించే గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: పుట్టే
  rationale: ילד నిఫాల్ రూపంలోని కర్మణి భావాన్ని తెలుగులో సహజమైన సంబంధక క్రియారూపంతో తెలిపింది.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: నీ పశువులలో, నీ మందలో
  rationale: בקר పెద్ద పశువులను, צאן గొర్రెలు-మేకల వంటి మంద జంతువులను సూచిస్తాయి; జాతులను అనవసరంగా కుదించకుండా ఈ వ్యత్యాసాన్ని నిలిపింది.
- source_word: הַזָּכָר
  choice: మగపిల్లను
  rationale: ఆజ్ఞ మగ తొలిచూలు సంతానానికే వర్తిస్తుందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּקְדִּישׁ
  choice: ప్రతిష్ఠించాలి
  rationale: קדש హిఫిల్ రూపం దేవునికోసం పవిత్రంగా ప్రత్యేకపరచడాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠించాలి’ ఆ ఆరాధనాత్మక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: నీ ఎద్దు తొలిచూలుదానితో పని చేయించకూడదు
  rationale: עבד మరియు ב కలయిక ఆ జంతువును శ్రమకు ఉపయోగించడాన్ని నిషేధిస్తుంది; ‘పని చేయించకూడదు’ తెలుగులో ఈ కార్యార్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: నీ మందలోని తొలిచూలుదానికి బొచ్చు కత్తిరించకూడదు
  rationale: גזז అంటే బొచ్చు కత్తిరించడం. צאןను కేవలం గొర్రెలకే పరిమితం చేయకుండా ‘మంద’గా ఉంచింది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచయమైన రూపంలో లిప్యంతరీకరించింది; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పశువుల వర్గాల మధ్య హీబ్రూ వ్యత్యాసాన్ని నిలిపి, వ్యవసాయ సందర్భంలోని నిషేధాలను సహజ తెలుగు క్రియలతో తెలిపింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
