id: DEU.13.14
reference: Deuteronomy 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: te
  text: మీ మధ్యనుండి కొంతమంది నీచులు[a] బయలుదేరి, వారి పట్టణంలోని నివాసులను దారి తప్పించి, ‘మనం వెళ్లి, మీరు ఎరుగని ఇతర దేవుళ్లను సేవిద్దాం’ అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: ‘పనికిమాలినతనపు కుమారులు’; సంప్రదాయ అనువాదం: ‘బెలీయాలు యొక్క కుమారులు.’'
    reason: మూల నానుడి యొక్క అక్షరార్థాన్ని, సంప్రదాయ ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: יָצְאוּ
  choice: బయలుదేరి
  rationale: יצא అనే క్రియ వారు సమాజం లోపల నుండే ఉద్భవించి ముందుకు వచ్చారనే భావాన్ని ఇస్తుంది; తెలుగు వాక్యప్రవాహంలో తరువాతి క్రియలతో అనుసంధానించేందుకు అసమాపక రూపం సహజంగా ఉంది.
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: నీచులైన కొందరు మనుషులు
  rationale: בני בליעל అక్షరార్థంగా ‘పనికిమాలినతనపు కుమారులు’ అయినా, ఇక్కడ నైతికంగా చెడిపోయిన లేదా అధర్ములైన వ్యక్తులను సూచించే నానుడి. ‘నీచులైన’ అనే పదం దాని నైతిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘బెలీయాలు’ అనే తరువాతి కాలపు వ్యక్తినామ భావాన్ని దిగుమతి చేయదు.
- source_word: מִקִּרְבְּךָ
  choice: మీ మధ్యనుండి
  rationale: వారు ఒడంబడిక సమాజానికి వెలుపలి వారు కాక, దాని లోపలి నుండే వచ్చినవారనే సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: וַיַּדִּיחוּ
  choice: దారి తప్పిస్తూ
  rationale: נדח హిఫీల్ రూపం ఇతరులను మతపరమైన విశ్వాసనిష్ఠ నుండి తొలగించి తప్పుదారిలోకి నడిపించడాన్ని సూచిస్తుంది. ‘దారి తప్పిస్తూ’ ఈ కారణార్థక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יֹשְׁבֵי עִירָם
  choice: తమ పట్టణ నివాసులను
  rationale: అక్షరార్థమైన ‘వారి పట్టణంలో నివసించేవారిని’ అనే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: మనం వెళ్లి ... సేవిద్దాం
  rationale: రెండు కోహోర్టేటివ్ రూపాలు సమూహాన్ని ప్రేరేపించే ఆహ్వానాన్ని వ్యక్తం చేస్తాయి. עבד యొక్క విస్తృతమైన మతసేవ భావాన్ని ‘సేవిద్దాం’ నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: ద్వితీయోపదేశకాండంలో సాధారణంగా వచ్చే పదబంధాన్ని ప్రత్యక్షంగా అనువదిస్తుంది; ‘విదేశీ దేవుళ్లు’ అనే సంకుచిత వివరణను చేర్చదు.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: మీరు ఎరుగని
  rationale: ידע లోని పరిచయ లేదా సంబంధ భావాన్ని ‘ఎరుగని’ నిలుపుతుంది; కేవలం సమాచారం తెలియకపోవడం అనే అర్థానికి పరిమితం చేయదు.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל పదబంధం వ్యక్తినామమా, నానుడా?
  choice: నీచులైన కొందరు మనుషులు
  alternative: బెలీయాలు కుమారులు / పనికిమాలినతనపు కుమారులు
  rationale: ఈ సందర్భంలో ఇది నైతికంగా భ్రష్టులైన వ్యక్తులను సూచించే హీబ్రూ నానుడి. దీనిని ‘బెలీయాలు’ అనే వ్యక్తినామంగా అనువదిస్తే తరువాతి కాలపు దయ్యసంబంధమైన భావనను ఈ వచనంలోకి అనవసరంగా చేర్చినట్లవుతుంది.
- issue: ידע యొక్క భావవ్యాప్తి
  choice: మీరు ఎరుగని
  alternative: మీకు తెలియని
  rationale: ‘ఎరుగని’ అనే రూపం జ్ఞానంతో పాటు పూర్వ సంబంధం లేదా గుర్తింపు లేకపోవడాన్నీ తెరిచి ఉంచుతుంది; వచనం ఉద్దేశించే ఒడంబడికసంబంధమైన ఉద్రిక్తతను అతిగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఎరుగని,’ ‘సేవిద్దాం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని మతపరమైన మరియు సంబంధాత్మక భావాన్ని నిలుపుతాయి. [a] గుర్తు అది వివరిస్తున్న పదబంధం వెంట ఉంచబడింది.
