  naturalness: “కొంతమంది నీచులు” అనేది “నీచులైన కొందరు మనుషులు” కంటే ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజం. “వారి పట్టణంలోని నివాసులను” అనే రూపం యోషెవే ఈరం యొక్క సంబంధాన్ని స్పష్టంగా, సులభంగా వ్యక్తం చేస్తుంది.
