  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת כָּל שְׁלָלָ֗/הּ תִּקְבֹּץ֮ אֶל תּ֣וֹךְ רְחֹבָ/הּ֒ וְ/שָׂרַפְתָּ֨ בָ/אֵ֜שׁ אֶת הָ/עִ֤יר וְ/אֶת כָּל שְׁלָלָ/הּ֙ כָּלִ֔יל לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וְ/הָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: te
  text: దాని దోపుడు సొమ్మంతటినీ దాని బహిరంగ కూడలి మధ్యలో పోగుచేయాలి. ఆ పట్టణాన్నీ దాని దోపుడు సొమ్మంతటినీ నీ దేవుడైన యెహోవాకు సంపూర్ణ అర్పణగా[a] అగ్నితో కాల్చివేయాలి. అది ఎప్పటికీ శిథిలాల దిబ్బగా[b] ఉండాలి; దాన్ని మళ్లీ కట్టకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దేవుడైన యెహోవా కోసం పూర్తిగా.” హీబ్రూ పదాన్ని “పూర్తిగా” అనే క్రియావిశేషణంగా గానీ, దేవునికి పూర్తిగా దహనం చేసి సమర్పించే అర్పణ భావంతో గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధానికి అక్షరార్థం “ఎప్పటికీ ఒక దిబ్బ”; అంటే శాశ్వతంగా నిలిచే శిథిలాల దిబ్బ.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: దాని దోపుడు సొమ్ము
  rationale: שָׁלָל యుద్ధంలో దోచుకున్న లేదా స్వాధీనం చేసుకున్న వస్తుసంపదను సూచిస్తుంది. ‘దోపుడు సొమ్ము’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּקְבֹּץ
  choice: పోగుచేయాలి
  rationale: కבץ అనే క్రియకు ‘సమకూర్చు, పోగుచేయు’ అనే భావం ఉంది. ధర్మశాస్త్ర ఆదేశ సందర్భంలో ‘పోగుచేయాలి’ సహజమైన నిర్దేశక రూపం.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: దాని బహిరంగ కూడలి మధ్యలో
  rationale: רְחוֹב ఇక్కడ ఇరుకైన వీధిని కాకుండా పట్టణంలోని విశాలమైన ప్రజా కూడలిని సూచిస్తుంది. ‘బహిరంగ కూడలి’ ఆ పట్టణ సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: అగ్నితో కాల్చివేయాలి
  rationale: ఈ హీబ్రూ పదబంధం అగ్ని ద్వారా పూర్తిగా నాశనం చేయడాన్ని సూచిస్తుంది. ‘అగ్నితో కాల్చివేయాలి’ మూలంలోని సాధనార్థాన్ని, ఆదేశ స్వరాన్ని నిలుపుతుంది.
- source_word: כָּלִיל
  choice: సంపూర్ణ అర్పణగా
  rationale: כָּלִיל అనే పదానికి ‘పూర్తిగా’ అనే క్రియావిశేషణార్థంతో పాటు, దేవునికి పూర్తిగా దహనం చేసి అర్పించే భావం కూడా ఉంది. తరువాత לַיהוָה రావడం వల్ల ‘సంపూర్ణ అర్పణగా’ ఆ ఆరాధనాపరమైన ప్రతిధ్వనిని అతిగా సాంకేతికం చేయకుండా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל అనే ఉపసర్గ ఇక్కడ సమర్పణ లేదా అంకితాన్ని సూచిస్తుంది; అందువల్ల ‘యెహోవాకు’ మూలంలోని దిశా-అంకిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תֵּל עוֹלָם
  choice: ఎప్పటికీ శిథిలాల దిబ్బ
  rationale: תֵּל అనేది దిబ్బను, ముఖ్యంగా శిథిలాలు పేరుకున్న దిబ్బను సూచించగలదు; עוֹלָם దీర్ఘకాలిక లేదా శాశ్వత స్థితిని తెలియజేస్తుంది. ఈ ఎంపిక భౌతిక చిత్రాన్నీ శాశ్వత నిర్జనతనూ కాపాడుతుంది.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: దాన్ని మళ్లీ కట్టకూడదు
  rationale: בנה యొక్క నిఫాల్ రూపం పునర్నిర్మాణాన్ని సూచిస్తుంది; לֹא ... עוֹד ఇకపై అలా జరగకూడదనే నిషేధాన్ని తెలియజేస్తుంది. తెలుగులో కర్మణి ప్రయోగం కంటే ‘దాన్ని మళ్లీ కట్టకూడదు’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: పట్టణాన్ని కాల్చే ఆదేశంలో כָּלִיל పదానికి ఉన్న ఆరాధనాపరమైన భావం
  choice: ‘నీ దేవుడైన యెహోవాకు సంపూర్ణ అర్పణగా’ అని అనువదించబడింది.
  alternative: ‘నీ దేవుడైన యెహోవా కోసం పూర్తిగా’ అని క్రియావిశేషణంగా అనువదించవచ్చు.
  rationale: ఈ పదం కేవలం సంపూర్ణ విధ్వంసాన్ని మాత్రమే కాకుండా, దేవునికి పూర్తిగా అంకితం చేయడాన్ని కూడా సూచించవచ్చు. ‘సంపూర్ణ అర్పణగా’ అనే రూపం ఆ బలిసంబంధ ప్రతిధ్వనిని నిలుపుతూ, దీనిని జంతుబలికి వాడే నిర్దిష్ట సాంకేతిక పదంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర ఆదేశానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. రెండవ పురుష ఏకవచన హీబ్రూ ఆదేశాన్ని తెలుగులో సహజమైన ‘చేయాలి/కూడదు’ రూపాలతో అందించాం. యెహోవా అనే దైవనామాన్ని ప్రత్యక్షంగా నిలిపాం.
