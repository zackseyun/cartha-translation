    reason: హీబ్రూ బּוֹ తో ఉన్న ‘చేయి’ అనే ప్రయోగాన్ని ‘అతనిమీద పడాలి’ అని సహజంగా అనువదించారు; అది అక్షరార్థంగా ‘అతనిలో/అతనిమీద ఉండాలి’ లేదా సందర్భానుసారంగా ‘అతనికి వ్యతిరేకంగా ఉండాలి’ అనే భావాన్ని కలిగి ఉంది.
