revisions:
- from: ఎందుకంటే, నీవు అతన్ని తప్పకుండా చంపాలి; అతన్ని చంపడానికి మొదట నీ చెయ్యే అతనికి వ్యతిరేకంగా ఉండాలి[a]; ఆ తర్వాత ప్రజలందరి చేతులు అతనికి వ్యతిరేకంగా ఉండాలి.
  to: ఎందుకంటే నీవు అతన్ని తప్పకుండా చంపాలి; అతన్ని చంపడానికి మొదట నీ చేయి అతనిమీద పడాలి[a]; ఆ తరువాత ప్రజలందరి చేతులు పడాలి.
  rationale: 'Revised the hand clauses to idiomatic Telugu that explicitly conveys the required order of action: the addressee’s hand acts first, followed by the hands of all the people. The revision retains the emphatic command, legal-execution context, and Hebrew hand imagery. The footnote preserves the lexical and idiomatic ambiguity of בּוֹ without imposing an interpretation beyond the context.'
