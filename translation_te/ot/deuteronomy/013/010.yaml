id: DEU.13.10
reference: Deuteronomy 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י הָרֹג֙ תַּֽהַרְגֶ֔/נּוּ יָֽדְ/ךָ֛ תִּֽהְיֶה בּ֥/וֹ בָ/רִֽאשׁוֹנָ֖ה לַ/הֲמִית֑/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: te
  text: ఎందుకంటే నీవు అతన్ని తప్పకుండా చంపాలి; అతన్ని చంపడానికి మొదట నీ చేయి అతనిమీద పడాలి[a]; ఆ తరువాత ప్రజలందరి చేతులు పడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని చంపడానికి మొదట నీ చేయి అతనికి వ్యతిరేకంగా ఉండాలి.” హీబ్రూలో అక్షరార్థంగా, “నీ చేయి అతనిలో/అతనిమీద మొదటిగా ఉండాలి” అని ఉంది.
    reason: హీబ్రూ బּוֹ తో ఉన్న ‘చేయి’ అనే ప్రయోగాన్ని ‘అతనిమీద పడాలి’ అని సహజంగా అనువదించారు; అది అక్షరార్థంగా ‘అతనిలో/అతనిమీద ఉండాలి’ లేదా సందర్భానుసారంగా ‘అతనికి వ్యతిరేకంగా ఉండాలి’ అనే భావాన్ని కలిగి ఉంది.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ పదం ముందున్న ఆజ్ఞకు కారణాన్ని లేదా వివరణను కలుపుతోంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: నీవు అతన్ని తప్పకుండా చంపాలి
  rationale: క్రియావిశేష బలార్థక రూపం మరియు క్రియ కలయిక గట్టి విధిని సూచిస్తుంది. ‘తప్పకుండా ... చంపాలి’ ఆ ఉద్ఘాటనను, మరణశిక్ష సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יָדְךָ
  choice: నీ చెయ్యే
  rationale: హీబ్రూలోని స్పష్టమైన ‘నీ చెయ్యి’ అనే న్యాయపరమైన దృశ్యరూపాన్ని నిలుపుతూ, ‘-ఏ’ మొదటి చర్యపై ఉన్న ప్రాధాన్యాన్ని సహజ తెలుగులో చూపుతుంది.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: మొదట ... అతనికి వ్యతిరేకంగా ఉండాలి
  rationale: తీర్పును అమలు చేయడంలో ఆ వ్యక్తి చెయ్యి ముందుగా ఉండాలని ఈ వాక్యభాగం చెబుతుంది; ‘వ్యతిరేకంగా’ בּוֹ యొక్క సందర్భానుగుణ ప్రతికూల భావాన్ని అందిస్తుంది.
- source_word: לַהֲמִיתוֹ
  choice: అతన్ని చంపడానికి
  rationale: హిఫిల్ రూపం అతనికి మరణం కలిగించడాన్ని సూచిస్తుంది. తెలుగులో ‘చంపడానికి’ న్యాయసందర్భంలోనూ నేరుగా, సహజంగా ఉంటుంది.
- source_word: וְיַד כָּל הָעָם
  choice: ప్రజలందరి చేతులు
  rationale: ‘నీ చెయ్యి’తో ఉన్న హీబ్రూ సమాంతరతను, సమాజమంతటి భాగస్వామ్యాన్ని నిలుపుతుంది; తెలుగు సంఖ్యానుసరణ కోసం సహజంగా బహువచనం వాడబడింది.
- source_word: בָּאַחֲרֹנָה
  choice: ఆ తర్వాత
  rationale: ‘మొదట’కు విరుద్ధంగా తదుపరి చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన క్రమసూచకం.
theological_decisions:
- issue: న్యాయపరమైన మరణశిక్ష భాషను మెత్తబరచకుండా లేదా అతిశయింపకుండా అనువదించడం
  choice: చంపాలి / చంపడానికి
  alternative: మరణశిక్ష విధించాలి / మరణానికి గురిచేయడానికి
  rationale: వచనం వ్యక్తి చేతితో ప్రారంభమయ్యే సామూహిక శిక్ష అమలును వివరిస్తోంది. ‘చంపాలి’ మూలంలోని הרג అనే నేరుగా ఉన్న క్రియను నిలుపుతుంది; ‘మరణశిక్ష విధించాలి’ అనేది తీర్పు ప్రకటించడమే అన్న అపార్థానికి దారితీయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలి. మూలంలోని ‘నీ చెయ్యి—ప్రజలందరి చేతులు’ సమాంతర దృశ్యాన్ని నిలిపి, హీబ్రూ బలార్థక క్రియారూపాన్ని ‘తప్పకుండా’తో వ్యక్తం చేసింది.
