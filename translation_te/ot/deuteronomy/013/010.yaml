review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic obligation in הָרֹג תַּהַרְגֶנּוּ and preserves the sequence in which the addressee acts before the people. However, ‘నీ చెయ్యే అతనికి వ్యతిరేకంగా ఉండాలి’ is not idiomatic Telugu action-language and can sound static rather than indicating that the addressee’s hand initiates the execution. The revised wording preserves the concrete ‘hand’ imagery and the priority expressed by בָּרִאשֹׁנָה.
  naturalness: ‘చేయి ... అతనిమీద పడాలి’ is a natural modern Telugu idiom for the hand taking action against someone. It conveys the intended judicial-action context more clearly than ‘చెయ్యి ... వ్యతిరేకంగా ఉండాలి,’ while retaining the Hebrew’s concrete formulation.
  terminology: ‘తప్పకుండా చంపాలి’ appropriately represents the emphatic infinitive absolute plus finite verb. ‘చేయి’ and ‘ప్రజలందరి చేతులు’ retain the Hebrew parallelism. No doctrinal interpretation has been added.
  issues:
  - severity: medium
    issue: The expression ‘మొదట నీ చెయ్యే అతనికి వ్యతిరేకంగా ఉండాలి’ is awkward and overly static in Telugu.
    rationale: The Hebrew idiom says that the addressee’s hand is to be first in carrying out the killing. Telugu ‘చేయి ... ఉండాలి’ does not naturally express this action, whereas ‘చేయి ... పడాలి’ does.
  - severity: low
    issue: The main text’s rendering ‘అతనికి వ్యతిరేకంగా’ is less concrete than the Hebrew hand-against/on-him idiom.
    rationale: A more literal yet idiomatic Telugu formulation can preserve the physical-action imagery without implying merely general opposition.
  revised_text: ఎందుకంటే నీవు అతన్ని తప్పకుండా చంపాలి; అతన్ని చంపడానికి మొదట నీ చేయి అతనిమీద పడాలి[a]; ఆ తరువాత ప్రజలందరి చేతులు పడాలి.
