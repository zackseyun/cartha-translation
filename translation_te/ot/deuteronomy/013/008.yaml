id: DEU.13.8
reference: Deuteronomy 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: te
  text: మీ చుట్టూ ఉన్న ప్రజల దేవుళ్ల నుండి—వారు నీకు దగ్గరగా ఉన్నవారైనా, నీకు దూరంగా ఉన్నవారైనా, భూమి[a] ఒక చివర నుండి మరో చివర వరకు ఉన్నవారైనా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశం ఒక చివర నుండి మరో చివర వరకు.’ హెబ్రీ పదమైన אֶרֶץకు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: దేవుళ్లలో నుంచి
  rationale: מִן మూలం లేదా సమూహం నుంచి ఎంపిక అనే భావాన్ని ఇక్కడ తెలియజేస్తుంది. ముందు వాక్యభాగంతో అనుసంధానమయ్యేలా ‘దేవుళ్లలో నుంచి’ సహజంగా ఉంటుంది.
- source_word: הָעַמִּים
  choice: ప్రజల
  rationale: עַמִּים అనేది జాతిపరమైన సమూహాలను సూచించే బహువచనం. ఆధునిక తెలుగులో ‘ప్రజలు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: మీ చుట్టూ ఉన్న
  rationale: ఈ సంబంధవాచక భాగం ప్రజలను విశేషిస్తూ వారి భౌగోళిక పరిసరాన్ని సూచిస్తుంది. మూలంలోని బహువచన సంబోధనను ‘మీ’తో నిలిపాం.
- source_word: הַקְּרֹבִים אֵלֶיךָ
  choice: నీకు దగ్గరగా ఉన్నా
  rationale: קָרוֹב సమీపాన్ని సూచిస్తుంది. తరువాతి ‘దూరంగా’ అనే జతతో సహజంగా ఉండేందుకు ‘దగ్గరగా’ ఎంచుకున్నాం; మూలంలోని ఏకవచన సంబోధనను ‘నీకు’తో నిలిపాం.
- source_word: אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: నీకు దూరంగా ఉన్నా
  rationale: רָחוֹק దూరాన్ని సూచిస్తుంది. ‘దగ్గరగా ఉన్నా, దూరంగా ఉన్నా’ అనే తెలుగులో సహజమైన విరుద్ధ జత మూలభావాన్ని కాపాడుతుంది.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: భూమి ఒక చివర నుంచి భూమి మరో చివర వరకు
  rationale: ఈ నానుడి సంపూర్ణ భౌగోళిక విస్తృతిని తెలియజేస్తుంది. హెబ్రీ నిర్మాణంలోని ‘భూమి’ పునరుక్తిని, విస్తృత వాక్చాతుర్యాన్ని నిలిపాం.
theological_decisions:
- issue: ముగింపు నానుడిలో הָאָרֶץ పరిధి
  choice: భూమి
  alternative: దేశం
  rationale: אֶרֶץ అనే పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే రెండు అర్థాలూ సాధ్యమే. ఇక్కడ చివర నుంచి చివర వరకు అనే నానుడి అత్యంత విస్తృత పరిధిని సూచిస్తున్నందున ప్రధాన పాఠ్యంలో ‘భూమి’ ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదటీకలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది ముందు వాక్యభాగాన్ని కొనసాగించే అసంపూర్ణ భాగం కావడంతో ప్రారంభంలో ‘దేవుళ్లలో నుంచి’ అని, చివరలో దీర్ఘవిరామంతో ఉంచాం. హెబ్రీలో ‘మీ చుట్టూ’ వద్ద బహువచన సంబోధన, ‘నీకు’ వద్ద ఏకవచన సంబోధన ఉన్న మార్పును ఉద్దేశపూర్వకంగా నిలిపాం.
