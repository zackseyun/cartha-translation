revisions:
- from: నాశనానికి ప్రతిష్ఠించిన దానిలో ఏదీ నీ చేతికి అంటుకోకూడదు[a]. అప్పుడు యెహోవా తన మండే కోపాన్ని విడిచి, నీకు కనికరం అనుగ్రహించి, నిన్ను కరుణించి, నీ పితరులకు ప్రమాణం చేసినట్లుగా నిన్ను విస్తరింపజేస్తాడు.
  to: నాశనానికి ప్రతిష్ఠించిన దానిలో ఏదీ నీ చేతికి అంటుకోకూడదు[a]. దానివల్ల యెహోవా తన మండే కోపం నుండి మరలి, నీకు కనికరం చూపి, నిన్ను కరుణించి, నీ పితరులకు ప్రమాణం చేసినట్లుగా నిన్ను అనేకులుగా చేస్తాడు.
  rationale: The revision makes the Hebrew purpose/result relationship explicit and renders the covenantal multiplication language as becoming numerous. It otherwise retains the draft’s accurate handling of the concrete “cling to your hand” image, the ḥerem terminology, Yahweh’s burning anger, and the mercy/compassion intensification.
