source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: te
  text: నాశనానికి ప్రతిష్ఠించిన దానిలో ఏదీ నీ చేతికి అంటుకోకూడదు[a]. దానివల్ల యెహోవా తన మండే కోపం నుండి మరలి, నీకు కనికరం చూపి, నిన్ను కరుణించి, నీ పితరులకు ప్రమాణం చేసినట్లుగా నిన్ను అనేకులుగా చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయబద్ధంగా, “శాపార్పితమైన దానిలో ఏదీ” లేదా “నిషేధం కింద ఉన్న దానిలో ఏదీ.” హీబ్రూ חֵרֶם దేవునికి తిరుగులేని విధంగా ప్రతిష్ఠించబడినదాన్ని, తరచుగా నాశనం చేయవలసినదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: నీ చేతికి అంటుకోకూడదు
  rationale: దబక్ క్రియలోని ‘అంటుకోవడం’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, చేతి ప్రస్తావన ద్వారా స్వాధీనంలో ఉంచుకోవడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מְאוּמָה מִן הַחֵרֶם
  choice: నాశనానికి ప్రతిష్ఠించిన దానిలో ఏదీ
  rationale: నిషేధంతో కూడిన מְאוּמָה సంపూర్ణతను ‘ఏదీ’ తెలియజేస్తుంది. חֵרֶם దేవునికి తిరుగులేని విధంగా అంకితం చేసి, ఈ సందర్భంలో నాశనం చేయవలసిన దానిని సూచిస్తుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: హీబ్రూ పదం ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేస్తుంది. ఇక్కడ ముందు ఆజ్ఞకు అనుసంధానమైన ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: యెహోవా తన మండే కోపాన్ని విడిచి
  rationale: שׁוּב מן కోపం నుండి మరలడాన్ని సూచిస్తుంది; חֲרוֹן אַף అనే తీవ్ర కోపపు నుడికారాన్ని శరీరావయవ రూపకాన్ని బలవంతంగా దిగుమతి చేయకుండా ‘మండే కోపం’గా అందిస్తుంది.
- source_word: וְנָתַן לְךָ רַחֲמִים
  choice: నీకు కనికరం అనుగ్రహించి
  rationale: ‘కనికరాన్ని ఇవ్వడం’ అనే మూల నిర్మాణాన్ని గౌరవిస్తూ, తెలుగులో సహజమైన ‘అనుగ్రహించి’ అనే క్రియను ఉపయోగిస్తుంది.
- source_word: וְרִחַמְךָ
  choice: నిన్ను కరుణించి
  rationale: ముందున్న רַחֲמִים తోనున్న సమీపార్థక పునరుక్తిని చెరపకుండా, వేరొక సహజ తెలుగు పదంతో బలపరుస్తుంది.
- source_word: וְהִרְבֶּךָ
  choice: నిన్ను విస్తరింపజేస్తాడు
  rationale: హిఫిల్ రూపంలోని ‘అనేకులుగా చేయడం/వృద్ధి చేయడం’ అనే జనాభా మరియు నిబంధన వాగ్దాన భావాన్ని నిలుపుతుంది.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: నీ పితరులకు ప్రమాణం చేసినట్లుగా
  rationale: పితృపురుషుల నిబంధన రేఖను సూచించే אֲבֹתֶיךָ ను లింగ-నిర్దిష్టంగానూ గౌరవప్రదంగానూ అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని నిబంధన దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచుతుంది; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’.
- issue: חֵרֶם భావం
  choice: నాశనానికి ప్రతిష్ఠించినది
  alternative: శాపార్పితమైనది / నిషేధం కింద ఉన్నది
  rationale: దేవునికి తిరుగులేని విధంగా అంకితం చేయబడి, ఈ సందర్భంలో నాశనం చేయవలసినదనే రెండు అంశాలను పారదర్శకంగా తెలియజేస్తుంది; కేవలం ‘నిషేధం’ అని చెప్పి భావాన్ని అస్పష్టంగా చేయదు.
- issue: దైవకోపపు మానవరూప నుడికారం
  choice: తన మండే కోపాన్ని విడిచి
  alternative: తన ముక్కు మండుట నుండి మరలి
  rationale: తీవ్రమైన దైవకోపాన్ని తగ్గించకుండా నిలుపుతుంది; అయితే హీబ్రూ శరీరావయవ నుడికారాన్ని తెలుగులో అపార్థకరంగా అక్షరానువదించదు.
- issue: אֲבֹתֶיךָ యొక్క లింగ-నిర్దిష్టత
  choice: నీ పితరులకు
  alternative: నీ పూర్వీకులకు
  rationale: ఈ సందర్భంలోని పితృపురుషుల నిబంధన సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. ‘అంటుకోకూడదు’ మూల రూపకాన్ని, ‘కనికరం…కరుణ’ మూలంలోని సమీపార్థక బలపరచడాన్ని నిలుపుతాయి. ప్రధాన పాఠంలోని [a] గుర్తు పాదటీకతో సరిపోలుతుంది.
