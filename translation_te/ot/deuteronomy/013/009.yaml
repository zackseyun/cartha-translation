review_pass:
  verdict: revise
  source_fidelity: 'The draft retains all five Hebrew prohibitions in sequence: refusal to consent, refusal to listen/heed, refusal of pity expressed with the ‘eye’ idiom, refusal to spare, and refusal to conceal. The final phrase appropriately preserves the likely range of concealing the person and covering up the matter.'
  naturalness: ‘నీ కన్ను అతనిపై జాలిపడకూడదు’ is understandable but is less idiomatic in modern standard Telugu. ‘నీ కన్ను అతనిమీద జాలిచూపకూడదు’ retains the Hebrew image while reading naturally. Rendering the following חמל as ‘అతన్ని విడిచిపెట్టవద్దు’ better expresses its juridical sense of not sparing, and avoids an unnecessarily repetitive pair of Telugu terms for pity/compassion.
  terminology: ‘సమ్మతించవద్దు,’ ‘అతని మాట వినవద్దు,’ and ‘అతని సంగతి కప్పిపుచ్చవద్దు’ are suitable modern-standard Telugu choices. The revision differentiates חוס (show pity) from חמל (spare) without importing interpretation.
  issues:
  - severity: low
    issue: The phrase ‘నీ కన్ను అతనిపై జాలిపడకూడదు’ is somewhat calqued and less natural Telugu.
    rationale: The source explicitly uses ‘your eye,’ which should be retained, but Telugu more naturally says that the eye ‘shows pity’ rather than that it ‘feels pity.’
  - severity: low
    issue: ‘అతన్ని కనికరించవద్దు’ does not clearly distinguish חמל from the preceding pity verb.
    rationale: In this legal context חמל prominently carries ‘spare’; ‘అతన్ని విడిచిపెట్టవద్దు’ conveys that force and preserves the escalating prohibitions.
