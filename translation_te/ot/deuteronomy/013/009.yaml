source:
  edition: WLC
  text: לֹא תֹאבֶ֣ה ל֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע אֵלָ֑י/ו וְ/לֹא תָח֤וֹס עֵֽינְ/ךָ֙ עָלָ֔י/ו וְ/לֹֽא תַחְמֹ֥ל וְ/לֹֽא תְכַסֶּ֖ה עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: te
  text: నీవు అతనికి సమ్మతించవద్దు[a], అతని మాట వినవద్దు. నీ కన్ను అతనిమీద జాలిచూపకూడదు[b]; అతన్ని విడిచిపెట్టవద్దు, అతని సంగతి కప్పిపుచ్చవద్దు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి లొంగవద్దు.’ హీబ్రూ క్రియ ఇష్టపడడం, సమ్మతించడం లేదా లొంగడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ కన్ను అతనిమీద జాలిచూపకూడదు.’ ఇది జాలితో చూడడం లేదా కనికరంతో విడిచిపెట్టడం గురించి చెప్పే హీబ్రూ ప్రయోగం.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘అతన్ని దాచిపెట్టవద్దు,’ లేదా ‘అతనికి అండగా నిలిచి దాచవద్దు.’ ఈ మాట వ్యక్తిని దాచడం లేదా అతని అపరాధాన్ని కప్పిపుచ్చడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: అతనికి సమ్మతించవద్దు
  rationale: אָבָה అనే క్రియ ఇక్కడ ఇష్టపడడం, సమ్మతించడం లేదా ప్రలోభానికి లొంగడం అనే భావాన్ని ఇస్తుంది. ‘సమ్మతించవద్దు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, అతని ప్రేరేపణకు అంగీకరించకూడదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִשְׁמַע אֵלָיו
  choice: అతని మాట వినవద్దు
  rationale: שׁמע + אֶל కేవలం శబ్దం వినడాన్ని కాక, ఒకరి మాటను శ్రద్ధగా ఆలకించడం లేదా దానికి చెవియొగ్గడం అనే భావాన్ని ఇస్తుంది. ‘అతని మాట వినవద్దు’ ఈ సందర్భంలో సహజంగా ఉంది; ‘లోబడవద్దు’ అని అనువదిస్తే పూర్తి విధేయత అనే భావాన్ని అతిగా నిర్దిష్టం చేస్తుంది.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: నీ కన్ను అతనిపై జాలిపడకూడదు
  rationale: חוּס జాలిచూపడం లేదా విడిచిపెట్టడం అనే భావాన్ని కలిగి ఉంది. మూలంలోని ‘నీ కన్ను’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే విధంగా ఈ ప్రయోగం ఎంపికైంది.
- source_word: תַחְמֹל
  choice: అతన్ని కనికరించవద్దు
  rationale: חמל కనికరించడం, కరుణ చూపడం లేదా విడిచిపెట్టడం అనే భావాలను ఇస్తుంది. ముందున్న חוּסతో ఉన్న పునరుక్తి బలాన్ని నిలుపుతూ, దానితో పదభేదం కనిపించేలా ‘కనికరించవద్దు’ వాడబడింది.
- source_word: תְכַסֶּה עָלָיו
  choice: అతని సంగతి కప్పిపుచ్చవద్దు
  rationale: Piel రూపంలోని כסה కప్పడం, దాచడం లేదా ఒకరి విషయాన్ని బయటపడనీయకుండా చేయడం అనే భావాన్ని ఇస్తుంది. ‘అతని సంగతి కప్పిపుచ్చవద్దు’ అనేది వ్యక్తిని దాచడానికీ అతని అపరాధాన్ని దాచడానికీ మధ్య మూలంలో ఉన్న భావవ్యాప్తిని పూర్తిగా ఒక్క దిశకు పరిమితం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: విగ్రహారాధనకు ప్రేరేపించిన వ్యక్తి గురించి ఉన్న కఠిన నిబంధన-న్యాయ భాషను నిలుపడం
  choice: వరుసగా ఉన్న ప్రత్యక్ష నిషేధాలను మెత్తబరచకుండా అనువదించడం
  alternative: దీనిని కేవలం భావోద్వేగపరమైన దూరంగా ఉండమనే సాధారణ సూచనగా మార్చడం
  rationale: ఈ వాక్యం ప్రేరేపించిన వ్యక్తికి సమ్మతించకూడదని, అతని మాట వినకూడదని, అతనిపై జాలి లేదా కనికరం చూపకూడదని, అతని సంగతి కప్పిపుచ్చకూడదని వరుసగా ఆజ్ఞాపిస్తుంది. అందువల్ల మూలంలోని తీవ్రతను సిద్ధాంతపరంగా తగ్గించకుండా, దాని క్రమబద్ధమైన బలాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-ఆజ్ఞాత్మక శైలి వాడబడింది. రెండవ పురుష ఏకవచన రూపం నిలుపబడింది. వరుస నిషేధాల బలం, ‘నీ కన్ను’ అనే హీబ్రూ రూపకం, చివరి క్రియలోని కొంత భావవ్యాప్తి సంరక్షించబడ్డాయి.
