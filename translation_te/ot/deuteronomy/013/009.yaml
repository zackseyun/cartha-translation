revisions:
- from: నీవు అతనికి సమ్మతించవద్దు[a], అతని మాట వినవద్దు. నీ కన్ను అతనిపై జాలిపడకూడదు[b]; అతన్ని కనికరించవద్దు, అతని సంగతి కప్పిపుచ్చవద్దు[c].
  to: నీవు అతనికి సమ్మతించవద్దు[a], అతని మాట వినవద్దు. నీ కన్ను అతనిమీద జాలిచూపకూడదు[b]; అతన్ని విడిచిపెట్టవద్దు, అతని సంగతి కప్పిపుచ్చవద్దు[c].
  rationale: The revision makes two limited stylistic-semantic adjustments. It uses an idiomatic Telugu expression for the Hebrew ‘eye’ idiom while preserving that imagery, and it renders the second compassion-related verb as ‘do not spare/release him’ to reflect its distinct legal force. The final expression remains deliberately broad, as the Hebrew can refer to concealing him or suppressing his wrongdoing.
