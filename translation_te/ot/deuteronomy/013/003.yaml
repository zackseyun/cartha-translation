id: DEU.13.3
reference: Deuteronomy 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָ֤א הָ/אוֹת֙ וְ/הַ/מּוֹפֵ֔ת אֲשֶׁר דִּבֶּ֥ר אֵלֶ֖י/ךָ לֵ/אמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא יְדַעְתָּ֖/ם וְ/נָֽעָבְדֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: te
  text: ‘నీవు ఎరుగని ఇతర దేవుళ్లను అనుసరిద్దాం; వారికి సేవ చేద్దాం[b]’ అని అతడు నీతో చెప్పిన సూచన గాని అద్భుతం గాని నెరవేరినప్పుడు[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంభవించినప్పుడు’. అక్షరార్థంగా, ‘సూచన మరియు అద్భుతం’; హీబ్రూలో ఈ జంట పదాలు తరచుగా ‘సూచన గాని అద్భుతం గాని’ అనే భావంలో వాడబడతాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారిని ఆరాధిద్దాం’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: నెరవేరి
  rationale: సూచకక్రియ లేదా అద్భుతం గురించి ముందుగా చెప్పినది వాస్తవంగా సంభవించడాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: ఆ సూచకక్రియ లేదా అద్భుతం
  rationale: אוֹת ను ‘సూచకక్రియ’గా, מוֹפֵת ను ‘అద్భుతం’గా వేరు చేస్తూ, ఈ జంట సందర్భంలో ప్రత్యామ్నాయ వర్గాలను సూచించే సహజమైన ‘లేదా’ను వాడింది; అక్షరార్థ ‘మరియు’ పాదటిప్పణిలో నిలుపబడింది.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: అతడు నీతో చెప్పిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: נֵלְכָה אַחֲרֵי
  choice: అనుసరిద్దాం
  rationale: అక్షరార్థంగా ‘వెనుక వెళ్దాం’ అనే చిత్రాన్ని మతపరమైన విధేయత సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: ద్వితీయోపదేశకాండంలో సాధారణంగా కనిపించే నిబంధనాత్మక పదబంధానికి సూటియైన తెలుగు రూపం.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: నీవు ఎరుగని
  rationale: ידע యొక్క పరిచయం లేదా గుర్తింపు భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది; తెలుగు సంబంధవాచక నిర్మాణం జీవ/నిర్జీవ వ్యక్తిత్వంపై అనవసర నిర్ణయం చేయదు.
- source_word: וְנָעָבְדֵם
  choice: వారికి సేవ చేద్దాం
  rationale: עבד లోని మతపరమైన సేవ, విధేయత అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘ఆరాధిద్దాం’ సందర్భోచిత ప్రత్యామ్నాయం.
theological_decisions:
- issue: ఇతర దేవుళ్లను సూచించే సంబంధవాచక ప్రయోగం
  choice: నీవు ఎరుగని ఇతర దేవుళ్లు
  alternative: నీకు తెలియని ఇతర దేవుళ్లు
  rationale: హీబ్రూ వాక్యం చెప్పనిదాన్ని జోడించి ఆ దేవుళ్ల వ్యక్తిత్వం లేదా అస్తిత్వంపై తీర్పు ఇవ్వకుండా, పరిచయం/గుర్తింపు అనే నిబంధనాత్మక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: עבד యొక్క మతపరమైన భావం
  choice: సేవ చేద్దాం
  alternative: ఆరాధిద్దాం
  rationale: ‘సేవ’ హీబ్రూ పదంలోని విస్తృత నిబంధనాత్మక విధేయతను కాపాడుతుంది; సందర్భంలో ఆరాధన అంతర్భూతమైనప్పటికీ దానికే భావాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మగ్రంథానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఎరుగని’ కొద్దిగా ఉన్నతమైనప్పటికీ సులభంగా గ్రహించదగిన పదం; ידע లోని పరిచయం/గుర్తింపు భావాన్ని ‘తెలియని’ కంటే మెరుగుగా నిలుపుతుంది. వాక్యం తరువాతి వచనంతో వ్యాకరణపరంగా కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
