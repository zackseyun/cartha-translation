id: DEU.13.16
reference: Deuteronomy 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: te
  text: ఆ పట్టణ నివాసులను నీవు కత్తి ధారతో[b] తప్పకుండా హతమార్చాలి. ఆ పట్టణాన్నీ, దానిలో ఉన్న సమస్తాన్నీ, దాని పశువులనూ కత్తి ధారతో సంపూర్ణ నాశనానికి అంకితం చేయాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమూలంగా నాశనం చేయాలి.’ హీబ్రూ క్రియ దేనినైనా తిరిగి తీసుకోలేని విధంగా నాశనానికి అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘కత్తి నోటికి’; ఇది కత్తి ధారతో హతమార్చడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: తప్పకుండా హతమార్చాలి
  rationale: నכה క్రియకు ముందు అదే ధాతువు యొక్క infinitive absolute రావడం ఆజ్ఞను బలపరుస్తుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కత్తి ప్రస్తావన వల్ల ఇక్కడ దెబ్బకొట్టడం ప్రాణాంతకమని ‘హతమార్చాలి’ స్పష్టం చేస్తుంది.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: ఆ పట్టణ నివాసులను
  rationale: యֹשְׁבֵי అనే participle అక్కడ నివసించే ప్రజలను సూచిస్తుంది. ‘నివాసులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సమగ్రంగా ఉంది.
- source_word: לְפִי חָרֶב
  choice: కత్తివాతతో
  rationale: అక్షరార్థంగా ‘కత్తి నోటికి’ అనే హీబ్రూ నుడికారానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం. హీబ్రూలోని పునరుక్తిని తెలుగులోనూ రెండుసార్లు ఉంచాం.
- source_word: הַחֲרֵם
  choice: పూర్తిగా నిర్మూలనకు అంకితం చేయాలి
  rationale: חרם హిఫిల్ రూపం కేవలం నాశనం చేయడమే కాక, తిరిగి తీసుకోలేని విధంగా నిర్మూలనకు అప్పగించే ధార్మిక-న్యాయ భావాన్ని కలిగి ఉంది. ‘అంకితం’ ఆ ప్రత్యేక భావాన్ని, ‘పూర్తిగా నిర్మూలనకు’ దాని భయంకర పరిణామాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: אֹתָהּ
  choice: ఆ పట్టణాన్ని
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ‘పట్టణం’ వైపు తిరిగి సూచిస్తుంది. తెలుగులో సందిగ్ధత రాకుండా నామవాచకాన్ని మళ్లీ పేర్కొన్నాం.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న సమస్తాన్ని
  rationale: పట్టణంలో ఉన్నదంతా ఆ ఆజ్ఞ పరిధిలోకి వస్తుందని మూలపాఠం తెలిపే విస్తృతిని ఇది యథాతథంగా ఉంచుతుంది.
- source_word: בְּהֶמְתָּהּ
  choice: దాని పశువులను
  rationale: בְּהֵמָה సాధారణంగా పెంపుడు జంతువులను సమూహంగా సూచిస్తుంది. ‘పశువులు’ తెలుగులో ఈ సామూహిక భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యుద్ధం/తీర్పు సందర్భంలో חרם పదానికి అనువాదం
  choice: పూర్తిగా నిర్మూలనకు అంకితం చేయాలి
  alternative: సమూలంగా నాశనం చేయాలి; నిషిద్ధంగా ప్రకటించాలి
  rationale: ఈ పదంలో సంపూర్ణ నాశనంతోపాటు దేవునికి తిరుగులేని విధంగా అప్పగించే పవిత్ర-న్యాయ ఛాయ కూడా ఉంది. ఎంపిక చేసిన పదబంధం దానిని అస్పష్టమైన పరిభాషగా మార్చకుండా ఆ రెండు అంశాలను నిలుపుతుంది.
- issue: తీర్పు ఆజ్ఞలోని తీవ్రత
  choice: ఆజ్ఞ యొక్క సంపూర్ణ, కఠిన బలాన్ని యథాతథంగా ఉంచడం
  alternative: ఓడించాలి వంటి మృదువైన పదాన్ని వాడడం
  rationale: హీబ్రూ పాఠం ప్రాణాంతకమైన, సమగ్ర తీర్పును స్పష్టంగా ఆజ్ఞాపిస్తుంది. దాన్ని మృదుపరచడం మూలపాఠానికి ఆధారం లేని వ్యాఖ్యానాన్ని చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆజ్ఞారూపాన్ని వాడాం. ద్వితీయ పురుష ఏకవచనాన్ని ‘నీవు’తో స్పష్టం చేశాం. మూలంలోని కత్తి నుడికార పునరుక్తినీ, חרם పదంలోని ధార్మిక-న్యాయ ఉద్రిక్తతనూ మృదుపరచకుండా నిలిపాం.
