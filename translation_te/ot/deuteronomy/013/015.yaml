source:
  edition: WLC
  text: וְ/דָרַשְׁתָּ֧ וְ/חָקַרְתָּ֧ וְ/שָׁאַלְתָּ֖ הֵיטֵ֑ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/קִרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: te
  text: నీవు విచారించాలి, క్షుణ్ణంగా పరిశోధించాలి, జాగ్రత్తగా ఆరా తీయాలి; అప్పుడు, ఇదిగో, ఆ విషయం నిజమని, స్థిరపడిందని తేలితే,[a] ఈ హేయకార్యం నీ మధ్య జరిగిందని—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివేదిక నిజమని, విషయం స్థిరపడిందని.”
    reason: אֱמֶת נָכוֹן הַדָּבָר అనే ధృవీకరణ సూత్రంలో הַדָּבָרను ‘విషయం’గా లేదా సందర్భంలోని ‘నివేదిక’గా గ్రహించవచ్చు.
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: విచారించి
  rationale: ఈ న్యాయసంబంధ సందర్భంలో דרש నివేదికను అధికారికంగా విచారించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘విచారించు’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: וְחָקַרְתָּ
  choice: క్షుణ్ణంగా పరిశోధించి
  rationale: חקר జాగ్రత్తగా లోతుగా పరిశీలించడాన్ని సూచిస్తుంది; వరుసలోని మొదటి క్రియతో తేడాను నిలుపుతూ దాని తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: జాగ్రత్తగా ఆరా తీయాలి
  rationale: שאל మరియు దాన్ని బలపరిచే הֵיטֵב కలిసి సమగ్రంగా ప్రశ్నించి తెలుసుకోవాలనే భావాన్ని ఇస్తాయి.
- source_word: וְהִנֵּה
  choice: అప్పుడు, ఇదిగో
  rationale: הנה విచారణ ఫలితం వెల్లడవుతున్నదని సూచించే సంభాషణా చిహ్నం; దాని ఉద్ఘాటనను పూర్తిగా వదలకుండా తెలుగులో సహజంగా అందించబడింది.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: ఆ విషయం నిజమని, నిర్ధారణ అయిందని
  rationale: ఈ ధృవీకరణ సూత్రంలో אמת సత్యత్వాన్ని, נכון స్థిరంగా నిర్ధారించబడిన స్థితిని తెలియజేస్తాయి; הדברను స్పష్టంగా ‘ఆ విషయం’గా ఉంచడం మూలంలోని న్యాయపరమైన భావాన్ని కాపాడుతుంది.
- source_word: נֶעֶשְׂתָה
  choice: జరిగిందని
  rationale: ఇక్కడ עשׂה రూపం ఆ కార్యం చోటుచేసుకున్నదనే భావాన్ని ఇస్తుంది; తెలుగులో ‘జరిగింది’ సహజమైన ఫలితవాక్యం.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: ఈ హేయకార్యం
  rationale: תועבה బలమైన నైతిక, నిబంధనాత్మక అసహ్యాన్ని సూచిస్తుంది; ‘హేయకార్యం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి గంభీరతను నిలుపుతుంది.
- source_word: בְּקִרְבֶּךָ
  choice: నీ మధ్య
  rationale: ఈ పదబంధం ఇశ్రాయేలు సమాజం లోపల జరిగినదని సూచిస్తుంది; ఏకవచన సంబోధనను ‘నీ’తో నిలిపింది.
theological_decisions:
- issue: న్యాయపరమైన ధృవీకరణ సూత్రం
  choice: విచారణల వరుస తర్వాత ‘ఆ విషయం నిజమని, నిర్ధారణ అయిందని—ఈ హేయకార్యం నీ మధ్య జరిగిందని—తేలితే’ అని అనువదించడం
  alternative: ‘ఈ నివేదిక నిజమై, విషయం స్థిరపడితే’
  rationale: హీబ్రూ వాక్యం బహుళ విచారణా క్రియల నుంచి ధృవీకరించబడిన నిర్ధారణకు సాగుతుంది. ‘విషయం’ అనేది నివేదికనా లేక జరిగిన కార్యానికి సంబంధించిన విషయమా అన్న స్వల్ప విస్తృతిని నిలుపుతూ, ఏ సిద్ధాంతపరమైన అదనపు అర్థాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. మూడు విచారణా క్రియల సమాహారాన్ని వేర్వేరు భావఛాయలతో నిలిపాం. తరువాతి వచనంతో వాక్యం కొనసాగుతున్నందున చివర షరతార్థక రూపం మరియు విరామచిహ్నం ఉంచాం.
