id: DEU.13.2
reference: Deuteronomy 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יָק֤וּם בְּ/קִרְבְּ/ךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְ/נָתַ֥ן אֵלֶ֛י/ךָ א֖וֹת א֥וֹ מוֹפֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: te
  text: మీ మధ్య ఒక ప్రవక్తగాని, కలలు కనేవాడుగాని లేచి, మీకు ఒక సూచననో అద్భుతాన్నో ఇస్తే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక సూచననో శకునాన్నో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఒకవేళ … ఇస్తే
  rationale: న్యాయపరమైన ఈ సందర్భంలో ఇది తరువాతి వచనంలో కొనసాగనున్న షరతును ప్రవేశపెడుతుంది; తెలుగులో షరతును సహజంగా తెలియజేయడానికి వాక్యాంతంలోని ‘ఇస్తే’తో కలిపి అనువదించాం.
- source_word: יָקוּם
  choice: లేచి
  rationale: సమాజం మధ్య అలాంటి వ్యక్తి ఉద్భవించడాన్ని సూచిస్తుంది; ‘లేచి’ మూలంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: בְּקִרְבְּךָ
  choice: మీ మధ్య
  rationale: సమాజం నడుమ లేదా ప్రజలలో అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נָבִיא
  choice: ప్రవక్త
  rationale: ఈ హీబ్రూ పదానికి ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: אוֹ
  choice: గాని … గాని / …నో …నో
  rationale: రెండు ప్రత్యామ్నాయ వ్యక్తులను, అలాగే రెండు ప్రత్యామ్నాయ ఘటనలను తెలుగులో సహజంగా వేరుచేస్తుంది.
- source_word: חֹלֵם חֲלוֹם
  choice: కలలు కనేవాడు
  rationale: హీబ్రూలోని క్రియావాచక పదం–సజాతి నామవాచక ప్రయోగాన్ని సహజ తెలుగులో తెలియజేస్తూ, ప్రవక్తకు భిన్నమైన వ్యక్తిగా అతణ్ణి చూపుతుంది.
- source_word: וְנָתַן אֵלֶיךָ
  choice: మీకు … ఇస్తే
  rationale: షరతు వాక్య క్రమంలో ఈ రూపానికి భవిష్యత్/సంభావ్య భావం ఉంది; ‘ఇస్తే’ ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: אוֹת
  choice: సూచన
  rationale: రుజువుగా లేదా నిర్ధారణగా ఉండే సంకేతాన్ని సూచించే సాధారణ, స్పష్టమైన పదం.
- source_word: מוֹפֵת
  choice: అద్భుతం
  rationale: చూసేవారిని ఆశ్చర్యపరిచే విశేష ఘటనను సూచిస్తుంది; అది నిజమైన దైవిక అద్భుతమా కాదా అని అనువాదంలో ముందే నిర్ణయించదు.
theological_decisions:
- issue: ప్రవక్త లేదా కలలు కనేవాడు ఇచ్చే సూచన/అద్భుతం స్వభావం
  choice: ‘ఒక సూచననో అద్భుతాన్నో’ అని నేరుగా అనువదించడం
  alternative: ‘ఒక సూచననో శకునాన్నో’ లేదా ‘ఒక అద్భుత సూచననో మహత్కార్యాన్నో’
  rationale: ఆ ఘటన నిజంగా అలోకసాధారణమైనదా, మోసపూరితమైనదా, లేక కేవలం అతని వాదన మాత్రమేనా అనే విషయాన్ని ఈ వచనం నిర్ణయించదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. షరతు వాక్యం తరువాతి వచనంలో కొనసాగుతుందనే భావాన్ని ‘ఒకవేళ … ఇస్తే’ నిర్మాణం చూపుతుంది; ‘గాని’ మరియు ‘నో’ రూపాలు ప్రత్యామ్నాయాలను స్పష్టంగా ఉంచుతాయి.
