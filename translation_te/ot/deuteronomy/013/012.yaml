  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֔ל יִשְׁמְע֖וּ וְ/יִֽרָא֑וּ/ן וְ/לֹֽא יוֹסִ֣פוּ לַ/עֲשׂ֗וֹת כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: te
  text: ఇశ్రాయేలీయులందరూ అది విని భయపడతారు; ఇకపై నీ మధ్య ఇలాంటి చెడు పని చేయరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మధ్య.” ఇశ్రాయేలును ఒక సమష్టిగా సంబోధిస్తూ హెబ్రీయ మూలం ఏకవచన రూపాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ మొత్తం నిబంధన ప్రజలను సమష్టిగా సూచిస్తుంది. తెలుగులో వ్యక్తులను స్పష్టంగా సూచించేందుకు ‘ఇశ్రాయేలీయులందరూ’ సహజంగా ఉంటుంది.
- source_word: יִשְׁמְעוּ
  choice: అది విని
  rationale: שׁמע అనే క్రియకు ఇక్కడ శిక్ష సంగతి వినడం అనే భావం ఉంది. ముందు చెప్పిన సంఘటనను తెలుగులో సహజంగా అనుసంధానించేందుకు ‘అది’ చేర్చబడింది.
- source_word: וְיִרָאוּן
  choice: భయపడతారు
  rationale: ఈ న్యాయ సందర్భంలో భయం మరలా అలాంటి పని చేయకుండా నిరోధించే ప్రతిస్పందనను సూచిస్తుంది; ‘భయపడతారు’ మూలార్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: ఇకపై ... చేయరు
  rationale: יסף + క్రియార్థక రూపం ఇక్కడ మళ్లీ చేయకపోవడాన్ని సూచిస్తుంది. ‘ఇకపై చేయరు’ ఆ హెబ్రీయ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ఇలాంటి చెడు పని
  rationale: דָּבָר సందర్భంలో ముందుగా వివరించిన దుష్కార్యాన్ని సూచిస్తుంది. כַּ ఉపసర్గ వల్ల ‘ఇలాంటి’ అనే పోలిక భావం వస్తుంది; ‘పని’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּקִרְבֶּךָ
  choice: నీ మధ్య
  rationale: అక్షరార్థంగా ‘నీ మధ్యలో’; ఏకవచన ప్రత్యయం ఇశ్రాయేలును ఒక సమష్టిగా సంబోధిస్తుంది. ‘నీ మధ్య’ ఆ రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన ప్రజల పట్ల ఏకవచన సంబోధన
  choice: నీ మధ్య
  alternative: మీ మధ్య / మీలో
  rationale: హెబ్రీయ మూలంలో పురుష ఏకవచన ప్రత్యయం ఉంది; ద్వితీయోపదేశకాండంలో ఇశ్రాయేలును ఒక సమష్టి ప్రజగా సంబోధించే విధానాన్ని అనువాదంలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయ-నిబంధన శైలి. మూలంలోని సమష్టి ఏకవచన సంబోధనను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం ఉపయోగించబడింది.
