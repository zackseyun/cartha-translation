  source_fidelity: 'హెబ్రీయ వాక్యంలోని అన్ని ప్రధాన అంశాలు నమ్మకంగా ప్రతిఫలించాయి: ‘ఇశ్రాయేలీయులందరూ’ సమస్త ఇశ్రాయేలును, ‘అది విని’ సందర్భోచితమైన వినికిడిని, ‘భయపడతారు’ నిరోధక భయాన్ని, ‘ఇకపై ... చేయరు’ పునరావృతిని నిషేధించే יסף ప్రయోగాన్ని, ‘ఇలాంటి చెడు పని’ כַּדָּבָר הָרָע הַזֶּה యొక్క పోలిక/సూచక భావాన్ని, ‘నీ మధ్య’ సమష్టి ఇశ్రాయేలుకు ఉన్న ఏకవచన సంబోధనను అందిస్తున్నాయి.'
