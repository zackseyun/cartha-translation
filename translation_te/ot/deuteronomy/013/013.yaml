  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תִשְׁמַ֞ע בְּ/אַחַ֣ת עָרֶ֗י/ךָ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֥ן לְ/ךָ֛ לָ/שֶׁ֥בֶת שָׁ֖ם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: te
  text: 'మీ దేవుడైన యాహ్వే మీరు అక్కడ నివసించడానికి మీకు ఇస్తున్న మీ పట్టణాల్లో ఒకదానిలో ఇలా చెప్పడం మీరు వింటే[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు విన్నప్పుడు.” న్యాయపరమైన వాక్యాల్లో హీబ్రూ సంధిపదం షరతును గానీ కాలసంబంధాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִשְׁמַע
  choice: మీరు వింటే
  rationale: న్యాయపరమైన సందర్భంలో כִּי షరతును ప్రవేశపెడుతుంది; תִשְׁמַע ఇక్కడ ఒక సమాచారం లేదా మాట వినడాన్ని సూచిస్తుంది.
- source_word: בְּאַחַת עָרֶיךָ
  choice: మీ పట్టణాల్లో ఒకదానిలో
  rationale: עִיר పట్టణం లేదా నగరం అనే అర్థం కలిగి ఉంది; ఆధునిక తెలుగులో ఈ సందర్భానికి ‘పట్టణం’ సహజంగా ఉంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యాహ్వే
  rationale: దైవనామం יהוה ను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, ఒడంబడిక సంబంధాన్ని తెలిపే ‘మీ దేవుడు’ అనే భావాన్ని నిలిపింది.
- source_word: נֹתֵן לְךָ
  choice: మీకు ఇస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంతం కొనసాగుతున్న లేదా లక్షణాత్మకమైన అనుగ్రహ చర్యను సూచిస్తుంది.
- source_word: לָשֶׁבֶת שָׁם
  choice: నివసించడానికి
  rationale: ל + ישׁב నిర్మాణం పట్టణాలను ఇవ్వడంలోని ఉద్దేశాన్ని తెలియజేస్తుంది; ‘నివసించడానికి’ ఆధునికమైనదీ గౌరవప్రదమైనదీ.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పడం
  rationale: తరువాతి వచనంలో వచ్చే నివేదిక విషయాన్ని పరిచయం చేసే ఉద్ధరణ సూచకాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో మార్చకుండా, సాధారణంగా అంగీకరించబడిన ‘యాహ్వే’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని షరతుతో కూడిన అసంపూర్ణ వాక్య నిర్మాణం తరువాతి వచనానికి దారితీసేలా నిలిపివేయబడింది.
