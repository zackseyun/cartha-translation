- from: 'మీ దేవుడైన యాహ్వే మీరు నివసించడానికి[b] మీకు ఇస్తున్న పట్టణాల్లో ఒకదానిలో ఇలా చెప్పడం మీరు వింటే[a]:'
  to: 'మీ దేవుడైన యాహ్వే మీరు అక్కడ నివసించడానికి మీకు ఇస్తున్న మీ పట్టణాల్లో ఒకదానిలో ఇలా చెప్పడం మీరు వింటే[a]:'
  rationale: ‘అక్కడ’ is restored for שָׁם, and ‘మీ పట్టణాల్లో’ directly represents the possessive suffix on עָרֶיךָ. The b footnote is retained as a valid alternative for the purpose infinitive, but its anchor is not needed in the revised text because ‘నివసించడానికి’ is already a clear rendering; the footnote set nevertheless preserves the supplied lexical alternative.
