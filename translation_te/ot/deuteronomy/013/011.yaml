source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: te
  text: నీవు అతణ్ణి రాళ్లతో కొట్టి చంపాలి; ఎందుకంటే, ఐగుప్తు దేశం నుండి, బానిసత్వపు గృహం నుండి[b] నిన్ను బయటకు తీసుకొచ్చిన నీ దేవుడైన యాహ్వే నుండి నిన్ను దూరం చేయడానికి[a] అతడు ప్రయత్నించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నిన్ను నీ దేవుడైన యాహ్వే నుండి తప్పుదారి పట్టించడానికి” లేదా “నిన్ను నీ దేవుడైన యాహ్వే నుండి తొలగించడానికి.”'
    reason: lexical_alternative
  - marker: b
    text: “బానిసత్వపు గృహం” అనేది ఐగుప్తులో ఇశ్రాయేలు అనుభవించిన బానిసత్వం నుండి దేవుడు వారిని విడిపించిన సంగతిని జ్ఞాపకం చేసే నిబంధన సంబంధమైన పదబంధం.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  choice: నీవు అతణ్ణి రాళ్లతో కొట్టాలి
  rationale: న్యాయపరమైన ఆజ్ఞగా ఉన్న క్రియారూపాన్ని ఆధునిక తెలుగులో స్పష్టమైన విధిగా వ్యక్తం చేస్తుంది; రాళ్లే మరణశిక్ష సాధనమని మూలపాఠం చెప్పిన విధంగా నిలుపుతుంది.
- source_word: וָמֵת
  choice: అతడు చనిపోవాలి
  rationale: రాళ్లతో కొట్టడం వల్ల కలిగే మరణ ఫలితాన్ని మూలంలోని ప్రత్యేక ఉపవాక్యంలాగే స్పష్టంగా ఉంచుతుంది.
- source_word: כִּי בִקֵּשׁ
  choice: ఎందుకంటే ... అతడు ప్రయత్నించాడు
  rationale: כִּי యొక్క కారణార్థాన్ని, בִקֵּשׁ సూచించే ఉద్దేశపూర్వక ప్రయత్నాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְהַדִּיחֲךָ
  choice: నిన్ను దూరం చేయడానికి
  rationale: హిఫీల్ క్రియలోని కారణార్థాన్ని నిలుపుతూ, యాహ్వే పట్ల నిబంధన విశ్వాసం నుండి తొలగించాలనే భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది; אֱלֹהֶיךָను సహజంగా అనుసంధానిస్తుంది.
- source_word: הַמּוֹצִיאֲךָ
  choice: నిన్ను బయటకు తీసుకొచ్చిన
  rationale: చారిత్రక విమోచన కార్యాన్ని సూచించే కృదంతాన్ని తెలుగులో సంబంధార్థక గతకాల రూపంతో సహజంగా అందిస్తుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: భౌగోళిక పదబంధాన్ని సంప్రదాయబద్ధంగా గుర్తించదగిన, స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: బానిసత్వపు గృహం నుండి
  rationale: ‘గృహం’ అనే రూపకాన్ని, బానిసత్వ స్థితిని రెండింటినీ నిలుపుతుంది; మూలంలోని నిబంధనాత్మక విమోచన సూత్రభాషను అధికంగా వివరణ చేయదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుగా మార్చకుండా తెలుగులో సమీప లిప్యంతరీకరణగా ఉంచుతుంది.
- issue: לְהַדִּיחֲךָ מֵעַל יְהוָהలో నిబంధన విరోధానికి సంబంధించిన భాష
  choice: యాహ్వే నుండి నిన్ను దూరం చేయడానికి
  alternative: యాహ్వేను విడిచిపోయేలా నిన్ను తప్పుదారి పట్టించడానికి; యాహ్వే నుండి నిన్ను ప్రలోభపెట్టి దూరం చేయడానికి
  rationale: క్రియలోని కారణార్థ బలాన్ని, సంబంధం నుండి తొలగించే భావాన్ని నిలుపుతుంది; ‘ప్రలోభం’ వంటి మూలంలో తప్పనిసరిగా లేని విధానాన్ని జోడించదు.
- issue: మరణశిక్ష వాక్య నిర్మాణం
  choice: నీవు అతణ్ణి రాళ్లతో కొట్టాలి; అతడు చనిపోవాలి
  alternative: నీవు అతణ్ణి రాళ్లతో కొట్టి చంపాలి
  rationale: మూలంలోని చర్య మరియు మరణ ఫలితాన్ని రెండు వరుస భాగాలుగా ఉంచి న్యాయపరమైన గంభీరతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరత కోసం ఏకవచన సంబోధనను, సంక్షిప్త విధి వాక్యాలను ఉపయోగించింది. దైవనామాన్ని ‘యాహ్వే’గా ఉంచింది. [a]ను దాని నిజమైన పదసంబంధ స్థలమైన ‘దూరం చేయడానికి’ వద్ద ఉంచి, [b]ను మొత్తం విమోచన సూత్రవాక్యానికి చివర ఉంచింది.
