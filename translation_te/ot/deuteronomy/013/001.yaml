source:
  edition: WLC
  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: te
  text: నేను మీకు ఆజ్ఞాపిస్తున్న మాట అంతటినీ[a] జాగ్రత్తగా పాటించండి. దానికి ఏదీ కలపకండి[b]; దానిలోనుంచి ఏదీ తీసివేయకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మీకు ఆజ్ఞాపిస్తున్న ప్రతి మాటను.” హీబ్రూలో అక్షరార్థంగా “మాట అంతటినీ” అనే ఏకవచన సమష్టి ప్రయోగం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని బైబిల్ వచన-సంఖ్యా సంప్రదాయాల్లో ఇది ద్వితీయోపదేశకాండము 12:32గా ఇవ్వబడింది.
    reason: versification
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: మాట అంతటినీ
  rationale: హీబ్రూలోని ఏకవచన సమష్టి ప్రయోగాన్ని ‘మాట అంతటినీ’ అని నిలిపి, అది ఆజ్ఞాపించబడిన సందేశమంతటినీ సూచించేలా చేశాం. తెలుగులో సహజమైన ప్రత్యామ్నాయం ‘ప్రతి మాటను’.
- source_word: מְצַוֶּה
  choice: ఆజ్ఞాపిస్తున్న
  rationale: వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న లేదా ప్రస్తుత ఆజ్ఞాపన భావాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటించండి
  rationale: శ్రద్ధగా కాపాడుతూ ఆచరించాలనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, విధేయత భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: לֹא תֹסֵף עָלָיו
  choice: దానికి ఏదీ కలపకండి
  rationale: ఉన్నదానికి మరేదైనా చేర్చడాన్ని నిషేధించే న్యాయపరమైన బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: దానిలోనుంచి ఏదీ తీసివేయకండి
  rationale: తగ్గించడం లేదా తొలగించడం అనే భావాన్ని తెలుగులో సహజంగా, ముందు నిషేధానికి సమాంతరంగా అందిస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామంలోని వక్త అధికారాన్ని తెలుగులో సహజమైన ‘నేను’ సరిపడా వ్యక్తపరుస్తుంది; అనవసరంగా ‘నేనే’ అని అధిక ఉద్ఘాటన చేయలేదు.
theological_decisions:
- issue: వచన సంఖ్య మరియు సందర్భ సంబంధం
  choice: తరువాతి వచనంలోని విషయాన్ని చేర్చకుండా, ఈ వచనాన్ని సంపూర్ణ ఆజ్ఞగా అనువదించడం
  alternative: కొన్ని సంప్రదాయాల్లో దీనిని ద్వితీయోపదేశకాండము 12:32గా లెక్కించి, ముందున్న విభాగంతో మరింత బిగువుగా అనుసంధానించడం
  rationale: హీబ్రూ పాఠంలో ఇది స్వతంత్రమైన సంపూర్ణ ఆజ్ఞ; తరువాత వచ్చే అబద్ధ ప్రవక్తల నియమాలకు మార్గసంధిగా కూడా పనిచేస్తుంది. సంఖ్యా సంప్రదాయాలను ప్రధాన పాఠంలో సమన్వయపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక బహువచన ఆజ్ఞారూపాలను వాడాం. ‘మాట అంతటినీ’ అనే కొద్దిగా శాస్త్రోచితమైన ప్రయోగం హీబ్రూ ఏకవచన సమష్టి భావాన్ని నిలుపుతుంది; అర్థస్పష్టత కోసం పాదటిప్పణిలో సహజమైన ప్రత్యామ్నాయం ఇచ్చాం.
