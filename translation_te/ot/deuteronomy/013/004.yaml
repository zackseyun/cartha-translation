source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: te
  text: ఆ ప్రవక్త మాటలనైనా, ఆ కలలు కనేవాడి మాటలనైనా మీరు వినకూడదు. ఎందుకంటే మీ దేవుడైన యహ్వే మిమ్మల్ని పరీక్షిస్తున్నాడు—మీరు మీ దేవుడైన యహ్వేను మీ హృదయమంతటితోను మీ ప్రాణమంతటితోను ప్రేమిస్తున్నారో లేదో తెలుసుకోవడానికి[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా ‘తెలుసుకోవడానికి.’ దీనిని ‘బయటపెట్టడానికి’ అని మార్చకుండా మూలపాఠంలోని వ్యక్తీకరణనే ఉంచాం.
    reason: theological_tension
  - marker: b
    text: ఇక్కడ ‘ప్రాణం’ అనే మాటకు ‘జీవితం,’ ‘స్వయం,’ లేదా ‘సంపూర్ణ అస్తిత్వం’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל דִּבְרֵי
  choice: మాటలను మీరు వినకూడదు
  rationale: שׁמע אֶל అనేది కేవలం శబ్దం వినడమే కాక దానికి చెవియొగ్గడం లేదా లోబడడం అనే భావాన్నీ కలిగిస్తుంది. సహజమైన తెలుగులో ‘వినకూడదు’ ఆ విస్తృత భావాన్ని సందర్భానుసారంగా మోస్తుంది.
- source_word: הַנָּבִיא הַהוּא
  choice: ఆ ప్రవక్త
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన הַהוּא ముందుగా ప్రస్తావించబడిన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘ఆ ప్రవక్త’ సహజమైన సమానార్థకం.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: కలలు కనేవాడైన ఆ వ్యక్తి
  rationale: హీబ్రూ పదబంధంలోని ‘కలను కనేవాడు’ అనే పునరుక్తిని యథాతథంగా ఉంచితే తెలుగులో కృత్రిమంగా ఉంటుంది. ‘కలలు కనేవాడు’ అనే సహజ ప్రయోగం అతడు కలల ద్వారా సందేశం చెప్పుకుంటున్న వ్యక్తి అనే భావాన్ని నిలుపుతుంది.
- source_word: מְנַסֶּה
  choice: పరీక్షిస్తున్నాడు
  rationale: Piel రూపంలోని נסה ఇక్కడ పరీక్షించడం, నిజస్థితిని వెలికి తీయడం అనే భావం ఇస్తుంది. ‘పరీక్షిస్తున్నాడు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: לָדַעַת
  choice: తెలుసుకోవడానికి
  rationale: హీబ్రూ మూలపాఠంలోని ఉద్దేశార్థక క్రియారూపాన్ని, దానిలోని మానవరూపక theological tension‌ను వివరణతో మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: మీరు ... ప్రేమిస్తున్నారో లేదో
  rationale: ప్రశ్నార్థక కణం మరియు participle కలయికను కొనసాగుతున్న స్థితిగా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל לְבַבְכֶם
  choice: మీ పూర్ణ హృదయంతో
  rationale: לֵבָב అంతరంగం, సంకల్పం, ఆలోచనలను సూచించగలదు. నిబంధనా భాషలో ‘పూర్ణ హృదయం’ ఖచ్చితమైనదీ సుపరిచితమైనదీ.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: మీ పూర్ణ ప్రాణంతో
  rationale: נֶפֶשׁ ప్రాణం, జీవితం, స్వయం, సంపూర్ణ వ్యక్తిత్వం అనే అర్థాలను కలిగి ఉంటుంది. ‘ప్రాణం’ సంప్రదాయ అంతర్పాఠ్య అనుసంధానాన్ని కాపాడుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా సాధ్యమైన ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: దేవుడు పరీక్షించి ‘తెలుసుకోవడం’
  choice: మూలంలోని ‘తెలుసుకోవడానికి’ అనే మాటను నిలుపడం
  alternative: బయటపెట్టడానికి; మీకే తెలియజేయడానికి
  rationale: ప్రత్యామ్నాయాలు దేవుని జ్ఞానం గురించి ఒక నిర్దిష్ట theological పరిష్కారాన్ని పాఠ్యంలోకి చేర్చుతాయి. హీబ్రూ వాక్యంలోని ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా అలాగే ఉంచింది.
- issue: נֶפֶשׁ యొక్క భావవ్యాప్తి
  choice: ప్రాణం
  alternative: జీవితం; సర్వస్వం; సంపూర్ణ అస్తిత్వం
  rationale: ‘ప్రాణం’ నిబంధనా సూత్రంలోని సంప్రదాయ పదజాలాన్ని, ఇతర సంబంధిత వచనాలతో ఉన్న అనుసంధానాన్ని కాపాడుతుంది; అయినా ఈ పదం కేవలం శరీరానికి వేరైన అమూర్త ‘ఆత్మ’కే పరిమితం కాదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా అర్థమయ్యే శైలి. న్యాయ-నిబంధనా ఆజ్ఞ యొక్క బలాన్ని ‘వినకూడదు’ ద్వారా నిలిపి, హీబ్రూ వాక్యంలోని theological ambiguityని వివరణాత్మకంగా పరిష్కరించలేదు.
