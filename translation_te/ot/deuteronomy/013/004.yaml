revisions:
- from: ఆ ప్రవక్త మాటలనైనా, కలలు కనేవాడైన ఆ వ్యక్తి మాటలనైనా మీరు వినకూడదు. ఎందుకంటే, మీ దేవుడైన యహ్వే మిమ్మల్ని పరీక్షిస్తున్నాడు—మీరు మీ దేవుడైన యహ్వేను మీ పూర్ణ హృదయంతో, మీ పూర్ణ ప్రాణంతో[b] ప్రేమిస్తున్నారో లేదో తెలుసుకోవడానికి[a].
  to: ఆ ప్రవక్త మాటలనైనా, ఆ కలలు కనేవాడి మాటలనైనా మీరు వినకూడదు. ఎందుకంటే మీ దేవుడైన యహ్వే మిమ్మల్ని పరీక్షిస్తున్నాడు—మీరు మీ దేవుడైన యహ్వేను మీ హృదయమంతటితోను మీ ప్రాణమంతటితోను ప్రేమిస్తున్నారో లేదో తెలుసుకోవడానికి[a].[b]
