id: DEU.13.7
reference: Deuteronomy 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: te
  text: నీ తల్లి కుమారుడైన నీ సహోదరుడైనా, నీ కుమారుడైనా, నీ కుమార్తెయైనా, నీవు కౌగిలించుకొనే నీ భార్యైనా[a], నీ ప్రాణంలాంటి నీ స్నేహితుడైనా[b] రహస్యంగా నిన్ను ప్రలోభపెట్టి, ‘నీవుగానీ నీ పూర్వీకులుగానీ ఎరుగని ఇతర దేవుళ్లను సేవించడానికి మనం వెళ్లుదాం’ అని చెబితే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం అక్షరార్థంగా ‘నీ ఒడిలోని భార్య’; ఇది అత్యంత దాంపత్య సాన్నిహిత్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ సొంత జీవం/ప్రాణంతో సమానమైన నీ స్నేహితుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: నిన్ను ప్రలోభపెట్టి
  rationale: హిఫీల్ రూపంలోని క్రియ ఒక కార్యం వైపు మరొకరిని ఆకర్షించడం లేదా పురికొల్పడం అనే భావాన్ని ఇస్తుంది. బַּסֵּתֶר‌తో కలిపి ‘రహస్యంగా నిన్ను ప్రలోభపెట్టి’ అని అనువదించడం సహజంగా ఉంది.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: నీ తల్లి కుమారుడైన నీ సహోదరుడు
  rationale: హీబ్రూలోని స్పష్టమైన సమానాధికార పదబంధాన్ని నిలిపి, అత్యంత సన్నిహిత రక్తసంబంధంపై ఉన్న ఉద్ఘాటనను కాపాడుతుంది.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: నీవు కౌగిలించుకొనే నీ భార్య
  rationale: חֵיק అంటే ఒడి, వక్షస్థలం లేదా కౌగిలి. తెలుగులో అసహజమైన శబ్దానువాదం కాకుండా దాంపత్య సాన్నిహిత్యాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని రూపకాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: నీ ప్రాణంలాంటి నీ స్నేహితుడు
  rationale: נֶפֶשׁ‌లోని ప్రాణం/జీవం అనే రూపకాన్ని నిలిపి, అత్యంత సన్నిహితుడైన స్నేహితుణ్ణి సూచిస్తుంది; కేవలం ‘ప్రాణస్నేహితుడు’ అని కుదించి మూల చిత్రాన్ని తొలగించలేదు.
- source_word: בַּסֵּתֶר
  choice: రహస్యంగా
  rationale: ‘రహస్యంగా’ అనే క్రియావిశేషణం ‘రహస్య స్థితిలో’ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: సేవించడానికి మనం వెళ్లుదాం
  rationale: రెండు ప్రేరణార్థక క్రియలైన వెళ్లడం, సేవించడం రెండింటినీ నిలుపుతుంది. తెలుగు వాక్యనిర్మాణంలో ఉద్దేశార్థక రూపం సహజంగా ఉండి, ‘ఆరాధించు’ కంటే עבד యొక్క విస్తృతమైన మతసేవ భావాన్ని కాపాడుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: אֲחֵרִים యొక్క సాధారణ అర్థం ‘ఇతర’; మూలంలో లేని ‘విదేశీ’ అనే భావాన్ని చేర్చలేదు.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: నీవుగానీ నీ పూర్వీకులుగానీ ఎరుగని
  rationale: తెలుసుకోవడం లేదా మతపరంగా గుర్తించడం అనే יָדַע భావాన్ని ‘ఎరుగని’ కాపాడుతుంది. ‘నీవుగానీ... పూర్వీకులుగానీ’ అనే నిర్మాణం ఇద్దరికీ నిరాకరణ వర్తిస్తుందని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: అత్యంత సన్నిహిత బంధాలను తెలిపే హీబ్రూ నుడికారాల అనువాదం
  choice: ‘నీ తల్లి కుమారుడైన నీ సహోదరుడు,’ ‘నీవు కౌగిలించుకొనే నీ భార్య,’ ‘నీ ప్రాణంలాంటి నీ స్నేహితుడు’ అని బంధాల తీవ్రతను నిలపడం
  alternative: ‘సొంత సహోదరుడు,’ ‘ప్రియమైన భార్య,’ ‘అత్యంత సన్నిహిత స్నేహితుడు’ వంటి సులభీకరించిన పదబంధాలు
  rationale: ఈ వాక్యం అత్యంత సన్నిహిత మానవ సంబంధాలను వరుసగా పేర్కొని హెచ్చరిక తీవ్రతను పెంచుతుంది. మూలంలోని చిత్రాలను వీలైనంతగా నిలపడం ఆ వాక్చాతుర్యాన్ని కాపాడుతుంది; అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- issue: అన్య దేవుళ్లకు సంబంధించిన עבד క్రియ భావం
  choice: ‘సేవించు’
  alternative: ‘ఆరాధించు’
  rationale: עבד ఆరాధనను కలిగి ఉన్నప్పటికీ దేవతకు చేసే మతపరమైన సేవను విస్తృతంగా సూచిస్తుంది. ‘సేవించు’ ఆ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సన్నిహిత బంధాల వరుసను, రహస్య ప్రలోభాన్ని, ‘వెళ్లి సేవిద్దాం’ అనే ఆహ్వాన భావాన్ని నిలిపాం. తెలుగు వాక్యప్రవాహం కోసం ఉద్ధరణలో ‘సేవించడానికి మనం వెళ్లుదాం’ అని అమర్చాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ సూచికను ఉంచాం.
