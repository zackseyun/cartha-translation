reference: Deuteronomy 13:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: te
  text: నీవు నీ దేవుడైన యాహ్వే స్వరాన్ని విని, నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ పాటించి, నీ దేవుడైన యాహ్వే దృష్టిలో సరైనది చేస్తే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: చేస్తే
  rationale: ఇక్కడ כִּי ముందున్న వాగ్దానానికి సంబంధించిన షరతును పరిచయం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ‘చేస్తే’ అనే షరతార్థక రూపం సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: תִשְׁמַע בְּקוֹל
  choice: స్వరాన్ని విని
  rationale: ఈ హీబ్రూ ప్రయోగంలో శ్రద్ధగా వినడమూ దానికి లోబడడమూ అంతర్భాగంగా ఉన్నాయి. ‘స్వరాన్ని విని’ శ్రవణ రూపకాన్ని నిలుపుతూ విధేయత భావాన్నీ సందర్భంలో సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ఏకవచన సంబోధనతో కూడిన నిబంధన సంబంధ పదబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంలో ఇచ్చాం.
- source_word: לִשְׁמֹר
  choice: పాటిస్తూ
  rationale: ఆజ్ఞలను జాగ్రత్తగా గైకొనడం అనే భావాన్ని ‘పాటిస్తూ’ సహజంగా తెలియజేస్తుంది; ప్రధాన షరతుతో దీని సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: כָּל מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలన్నిటిని
  rationale: ‘అన్నిటిని’ ద్వారా כָּל స్పష్టంగా నిలుస్తుంది; מִצְוָה కు న్యాయ-నిబంధన సందర్భంలో ‘ఆజ్ఞ’ సహజమైన సమానం.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్న
  rationale: హీబ్రూ కృదంతంలోని ప్రస్తుత, కొనసాగుతున్న ప్రసంగక్రియను ‘ఆజ్ఞాపిస్తున్న’ ప్రతిబింబిస్తుంది.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: సరైనది చేస్తే
  rationale: יָשָׁר యొక్క నైతికంగా సరైనది/నిటారైనది అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో ‘సరైనది’గా ఇచ్చాం.
- source_word: בְּעֵינֵי
  choice: దృష్టికి
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అయినా, మూలంలోని మూల్యాంకన భావాన్ని తెలుగులో ‘దృష్టికి’ సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించడానికి దగ్గరైన ప్రత్యామ్నాయం.
- issue: వినడం మరియు విధేయత మధ్య భావసంబంధం
  choice: స్వరాన్ని విని
  alternative: మాటకు లోబడి
  rationale: שׁמע בקול విధేయతను సూచించినప్పటికీ, మూలంలోని ‘స్వరం’ అనే వ్యక్తిగత శ్రవణ రూపకాన్ని తొలగించకుండా ఉంచాం. ఆజ్ఞలను పాటించడం అనే వెంటనున్న పదబంధం విధేయత భావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గౌరవప్రద శైలి. హీబ్రూ ఏకవచన ‘నీవు’ను ‘నీ/నీకు’గా నిలిపాం. ఈ వచనం ముందున్న వాక్యానికి షరతు భాగంగా ఉన్నందున తెలుగులో చివర ‘చేస్తే’తో ముగుస్తుంది.
