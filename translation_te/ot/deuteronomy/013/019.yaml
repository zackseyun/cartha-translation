revisions:
- from: నీ దేవుడైన యెహోవా స్వరాన్ని విని, నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటిని పాటిస్తూ, నీ దేవుడైన యెహోవా దృష్టికి సరైనది చేస్తే.
  to: నీవు నీ దేవుడైన యాహ్వే స్వరాన్ని విని, నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ పాటించి, నీ దేవుడైన యాహ్వే దృష్టిలో సరైనది చేస్తే.
