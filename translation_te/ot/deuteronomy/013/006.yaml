source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: te
  text: అయితే ఆ ప్రవక్తగానీ, ఆ కలను కలగన్నవాడుగానీ మరణశిక్షకు గురిచేయబడాలి. ఎందుకంటే, అతడు ఐగుప్తు దేశం నుండి మిమ్మల్ని బయటకు తీసుకువచ్చి, బానిసల గృహం నుండి నిన్ను విమోచించిన[b][c] మీ దేవుడైన యాహ్వేకు వ్యతిరేకంగా తిరుగుబాటు మాటలు పలికాడు[a]. మీ దేవుడైన యాహ్వే నీవు దానిలో నడవాలని ఆజ్ఞాపించిన మార్గం నుండి నిన్ను తప్పుదారి పట్టించడానికి అతడు ఇలా పలికాడు. కాబట్టి నీవు నీ మధ్య నుండి చెడును తొలగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తిరుగుబాటు మాటలు పలికాడు” అనే హీబ్రూ వ్యక్తీకరణకు “విశ్వాసభ్రష్టతను ప్రోత్సహించాడు” అని కూడా అర్థం కావచ్చు. ఇది యాహ్వే పట్ల నిబంధన విశ్వాసాన్ని విడిచిపెట్టడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “బానిసల గృహం” అని అక్షరార్థం; అంటే బానిసత్వంలో ఉన్న స్థలం.
    reason: literal_rendering
  - marker: c
    text: హీబ్రూ పాఠంలో మొదట బహువచన సంబోధన (“మిమ్మల్ని,” “మీ దేవుడు”), ఆ తరువాత సమూహంలోని ప్రతి వ్యక్తిని ఉద్దేశించే ఏకవచన సంబోధన (“నిన్ను,” “నీ దేవుడు”) వస్తుంది.
    reason: source_grammar
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: అయితే ఆ ప్రవక్తగానీ, ఆ కలను కన్నవాడుగానీ
  rationale: וְ ఇక్కడ ముందటి న్యాయవిషయానికి ప్రతిస్పందనగా వచ్చే భావాన్ని “అయితే” సహజంగా తెలియజేస్తుంది. రెండవ నిర్దేశక పదంలోని “ఆ” భావాన్ని కూడా నిలిపింది.
- source_word: יוּמָת
  choice: మరణశిక్ష పొందాలి
  rationale: מות యొక్క హోఫల్ రూపం సాధారణ మరణాన్ని కాక న్యాయపరంగా మరణానికి గురిచేయడాన్ని సూచిస్తుంది.
- source_word: כִּי דִבֶּר סָרָה
  choice: ఎందుకంటే ... తిరుగుబాటు మాటలు పలికాడు
  rationale: סָרָה నిబంధనపరమైన విధేయత నుంచి తొలగిపోవడం, తిరుగుబాటు లేదా విశ్వాసభ్రష్టత అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠం సహజంగా ఉండేలా “తిరుగుబాటు మాటలు” ఎంచుకుని, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వేకు వ్యతిరేకంగా
  rationale: వైరభావ సందర్భంలో עַל అనే పదం “వ్యతిరేకంగా” అనే భావాన్ని ఇస్తుంది; יהוה అనే నిబంధన నామాన్ని “యాహ్వే”గా లిప్యంతరీకరించాం.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుంచి మిమ్మల్ని బయటకు తీసుకువచ్చి
  rationale: నిర్గమాన్ని సూచించే సాధారణ హీబ్రూ పదబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: బానిసల గృహం నుంచి నిన్ను విమోచించిన
  rationale: פּדה లోని విడిపించడం/విమోచించడం భావాన్ని, בֵּית עֲבָדִים లోని స్పష్టమైన “బానిసల గృహం” రూపకాన్ని నిలిపింది.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: మార్గం నుంచి నిన్ను తొలగించడానికి
  rationale: נדח హిఫీల్ రూపంలోని దూరం చేయడం లేదా తప్పుదారి పట్టించడం అనే బలమైన భావాన్ని “తొలగించడానికి” తెలియజేస్తుంది; “మార్గం” అనే నిబంధన రూపకాన్ని కాపాడింది.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: మీ దేవుడైన యాహ్వే నిన్ను నడవమని ఆజ్ఞాపించిన మార్గం
  rationale: “మార్గంలో నడవడం” అనే హీబ్రూ నడవడి రూపకాన్ని తెలుగులోనూ నిలిపింది.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: కాబట్టి నీ మధ్య నుంచి చెడును నిర్మూలించాలి
  rationale: ద్వితీయోపదేశకాండంలోని న్యాయసూత్ర పదబంధంలో בער నిర్ణయాత్మకంగా తొలగించడాన్ని సూచిస్తుంది. הָרָע లోని వ్యక్తి/చర్యకు వర్తించగల కొంత అస్పష్టతను “చెడు” నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- issue: סָרָה యొక్క నిబంధనపరమైన భావం
  choice: తిరుగుబాటు మాటలు
  alternative: విశ్వాసభ్రష్టతను ప్రోత్సహించాడు
  rationale: మూలంలోని తిరుగుబాటు/మతభ్రష్టత ఉద్రిక్తతను ఒకే సిద్ధాంతపరమైన పదంతో పరిమితం చేయకుండా, ప్రధాన భావాన్ని పాఠంలోనూ ప్రత్యామ్నాయాన్ని పాదసూచికలోనూ ఉంచాం.
- issue: ఏకవచన-బహువచన సంబోధన మార్పు
  choice: మూలంలోని మార్పును నిలిపివేయడం
  alternative: తెలుగు పాఠమంతటా బహువచనంగా సమతలీకరించడం
  rationale: హీబ్రూ మొదట సమాజాన్ని బహువచనంలో, తరువాత సమిష్టి ఇశ్రాయేలును/ప్రతి వ్యక్తిని ఏకవచనంలో సంబోధిస్తుంది. ఈ రూపాన్ని పాదసూచిక సహాయంతో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయ-నిబంధన శైలిని వాడాం. “మరణశిక్ష పొందాలి,” “విమోచించిన,” “నిర్మూలించాలి” వంటి పదాలు వాక్యంలోని న్యాయబలాన్ని నిలుపుతాయి. మూలంలోని సంబోధన సంఖ్య మార్పును ఉద్దేశపూర్వకంగా కాపాడాం.
