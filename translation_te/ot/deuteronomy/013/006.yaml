revisions:
- from: 'అయితే ఆ ప్రవక్తగానీ, ఆ కలను కన్నవాడుగానీ మరణశిక్ష పొందాలి. ఎందుకంటే, ఐగుప్తు దేశం నుంచి మిమ్మల్ని బయటకు తీసుకువచ్చి, బానిసల గృహం నుంచి నిన్ను విమోచించిన మీ దేవుడైన యాహ్వేకు వ్యతిరేకంగా అతడు తిరుగుబాటు మాటలు పలికాడు[a]. మీ దేవుడైన యాహ్వే నిన్ను నడవమని ఆజ్ఞాపించిన మార్గం నుంచి నిన్ను[c] తొలగించడానికే అతడు అలా చేశాడు. కాబట్టి నీ మధ్య నుంచి చెడును నిర్మూలించాలి.


    [a] “తిరుగుబాటు మాటలు పలికాడు” అనే హీబ్రూ వ్యక్తీకరణకు “విశ్వాసభ్రష్టతను ప్రోత్సహించాడు” అని కూడా అర్థం కావచ్చు. ఇది యాహ్వే పట్ల నిబంధన విశ్వాసాన్ని విడిచిపెట్టడాన్ని సూచిస్తుంది.


    [b] “బానిసల గృహం” అని అక్షరార్థం; అంటే బానిసత్వంలో ఉన్న స్థలం.


    [c] హీబ్రూ పాఠంలో మొదట బహువచన సంబోధన (“మిమ్మల్ని,” “మీ దేవుడు”), ఆ తరువాత సమూహంలోని ప్రతి వ్యక్తిని ఉద్దేశించే ఏకవచన సంబోధన (“నిన్ను,” “నీ దేవుడు”) వస్తుంది.'
  to: అయితే ఆ ప్రవక్తగానీ, ఆ కలను కలగన్నవాడుగానీ మరణశిక్షకు గురిచేయబడాలి. ఎందుకంటే, అతడు ఐగుప్తు దేశం నుండి మిమ్మల్ని బయటకు తీసుకువచ్చి, బానిసల గృహం నుండి నిన్ను విమోచించిన[b][c] మీ దేవుడైన యాహ్వేకు వ్యతిరేకంగా తిరుగుబాటు మాటలు పలికాడు[a]. మీ దేవుడైన యాహ్వే నీవు దానిలో నడవాలని ఆజ్ఞాపించిన మార్గం నుండి నిన్ను తప్పుదారి పట్టించడానికి అతడు ఇలా పలికాడు. కాబట్టి నీవు నీ మధ్య నుండి చెడును తొలగించాలి.
  rationale: The revision corrects the unanchored [b] footnote, places the number-shift note at its first occurrence, and restores the Hebrew syntactic relationship in which the prophet’s rebellious speech is intended to lead the addressee astray. It also improves idiomatic Telugu while preserving the legal register, covenantal vocabulary, and source ambiguity of “the evil.”
