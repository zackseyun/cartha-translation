  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే వెంబడి మీరు నడవాలి[a]. ఆయనకు భయపడాలి; ఆయన ఆజ్ఞలను పాటించాలి; ఆయన స్వరాన్ని వినాలి[b]; ఆయనను సేవించాలి; ఆయనను అంటిపెట్టుకొని ఉండాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దేవుడైన యాహ్వేను అనుసరించాలి.” హీబ్రూలో అక్షరార్థంగా, “మీ దేవుడైన యాహ్వే వెంబడి నడవాలి.”
    reason: lexical_alternative
  - marker: b
    text: “ఆయన స్వరాన్ని వినాలి” అనే మాటకు “ఆయన మాటకు విధేయులై ఉండాలి” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయనను గట్టిగా పట్టుకొని ఉండాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי ... תֵּלֵכוּ
  choice: వెంబడి ... నడవాలి
  rationale: ‘వెనుక/వెంబడి నడవడం’ అనే హీబ్రూ నిబంధనాత్మక రూపకాన్ని నిలుపుతూ, విధేయతతో అనుసరించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణానుసార రూపాన్ని ఉపయోగించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రెండవ పురుష బహువచన ప్రత్యయాన్ని, ఇశ్రాయేలుతోనున్న నిబంధన సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: תִירָאוּ
  choice: ఆయనకు భయపడాలి
  rationale: దేవునిపట్ల భయం, భక్తి, విస్మయం కలిసిన నిబంధనాత్మక భావాన్ని మెత్తబరచకుండా నిలుపుతుంది.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: ఆయన ఆజ్ఞలను పాటించాలి
  rationale: ఆజ్ఞలను కాపాడి ఆచరించాలనే భావాన్ని ఆధునిక సహజ తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: ఆయన స్వరాన్ని వినాలి
  rationale: ఈ పదబంధంలో విధేయత అంతర్లీనంగా ఉన్నప్పటికీ, మూలంలోని ‘స్వరాన్ని వినడం’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: תַעֲבֹדוּ
  choice: ఆయనను సేవించాలి
  rationale: దేవునికి చేసే సేవలో ఆరాధన కూడా ఇమిడి ఉండవచ్చు; ‘సేవించాలి’ అనే విస్తృతమైన అర్థం మూలపదాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: תִדְבָּקוּן
  choice: ఆయనను హత్తుకొని ఉండాలి
  rationale: సన్నిహితంగా అంటిపెట్టుకొని, విశ్వాసంతో విడువకుండా ఉండే నిబంధన అనుబంధాన్ని సజీవంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ఉచ్చారణానుసారంగా ఇచ్చాం.
- issue: שׁמע בְּקוֹל అనే పదబంధంలో వినడం–విధేయత సంబంధం
  choice: ఆయన స్వరాన్ని వినాలి
  alternative: ఆయన మాటకు విధేయులై ఉండాలి
  rationale: పదబంధం విధేయతను సూచించగలిగినా, మూలంలోని శ్రవణ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
- issue: דבק లోని అనుబంధ తీవ్రత
  choice: ఆయనను హత్తుకొని ఉండాలి
  alternative: ఆయనను గట్టిగా పట్టుకొని ఉండాలి
  rationale: దేవునితో నిబంధనాత్మకంగా అంటిపెట్టుకొని ఉండే సన్నిహితత్వాన్ని నిలుపుతూ, కేవలం శారీరక చర్యగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆజ్ఞాత్మక శైలిని ఉపయోగించాం. వరుస హీబ్రూ క్రియల లయను సెమీకోలన్లతో నిలిపాం; దైవ నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
