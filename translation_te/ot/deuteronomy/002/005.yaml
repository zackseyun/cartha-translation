language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: te
  text: వారితో కలహానికి దిగవద్దు[a], ఎందుకంటే వారి దేశంలోనుండి అరికాలు మోపడానికి సరిపడినంత స్థలమైనా నేను మీకు ఇవ్వను; శేయీరు పర్వతాన్ని నేను ఏశావుకు స్వాస్థ్యంగా ఇచ్చాను.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇంకొక అనువాదం: “వారిని కవ్వించవద్దు” లేదా “వారితో పోరుకు దిగవద్దు.”'
    reason: lexical_alternative
  - marker: c
    text: “శేయీరు పర్వతం” అనేది శేయీరు కొండప్రాంతాన్నంతటినీ కూడా సూచించవచ్చు.
    reason: cultural_note
  - marker: d
    text: “స్వాస్థ్యంగా” అనే మాటను “సొత్తుగా” లేదా “వారసత్వంగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: వారితో కలహానికి దిగవద్దు
  rationale: హిత్‌పయేల్ రూపం בָםతో కలిసి శత్రుత్వపూర్వకంగా తలపడడం, కలహాన్ని ప్రారంభించడం అనే భావాన్ని ఇస్తుంది. ‘కలహానికి దిగవద్దు’ యుద్ధానికే పరిమితం చేయకుండా ఆ విరోధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: వారి దేశంలోనుంచి ... నేను మీకు ఇవ్వను
  rationale: 'מִן ఇక్కడ భాగార్థకంగా ఉంది: వారి దేశంలోని ఏ భాగమూ ఇశ్రాయేలుకు ఇవ్వబడదు. తెలుగు వాక్య నిర్మాణంలో ఈ భావం సహజంగా వ్యక్తమవుతుంది.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: ఒక అరికాలు మోపగలిగినంత స్థలాన్ని కూడా
  rationale: అరికాలు మోపే చోటు అనే మూలభాషా దృశ్యాన్ని నిలుపుతూ, అతి చిన్న భూభాగం కూడా ఇవ్వబడదనే నుడికార భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יְרֻשָּׁה
  choice: స్వాస్థ్యంగా
  rationale: ఈ పదం సొత్తు లేదా వారసత్వంగా లభించిన స్వాస్థ్యం అనే రెండు సమీప భావాలను కలిగి ఉంటుంది. ‘స్వాస్థ్యం’ దైవికంగా అనుగ్రహించబడిన భూహక్కును సంక్షిప్తంగా తెలియజేస్తూ మూలంలోని భావవిస్తృతిని చాలావరకు నిలుపుతుంది.
- source_word: לְעֵשָׂו
  choice: ఏశావుకు
  rationale: לְ గ్రహీతను సూచిస్తుంది; ఏశావు అనే వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: הַר שֵׂעִיר
  choice: శేయీరు పర్వతాన్ని
  rationale: నిర్మాణాన్ని నేరుగా ప్రతిబింబించే అనువాదం ఇది. సందర్భానుసారంగా ఇది శేయీరు పర్వత ప్రాంతాన్నంతటినీ కూడా సూచించవచ్చు; ఆ విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ఏదోము ప్రాంతంపై దేవుడు ఏశావుకు ఇచ్చిన హక్కు
  choice: ఇశ్రాయేలు ఏశావు సంతతితో కలహానికి దిగకూడదనే ఆజ్ఞకు, దేవుడే శేయీరును ఏశావుకు ఇచ్చాడనే కారణాన్ని యథాతథంగా నిలిపాం.
  alternative: దీనిని కేవలం రాజకీయ ఘర్షణను నివారించే ఆజ్ఞగా మాత్రమే చూపడం.
  rationale: వచనంలోని రెండు כִּי కారణవాక్యాలు నిషేధాన్ని దేవుని భూవిభజనతో అనుసంధానిస్తాయి. అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఆ సంబంధాన్ని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కలహానికి దిగవద్దు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని శత్రుత్వపూర్వక తలపడే భావాన్ని యుద్ధానికే పరిమితం చేయదు. ‘అరికాలు మోపగలిగినంత’ అనే రూపం మూల నుడికార దృశ్యాన్ని నిలుపుతుంది.
