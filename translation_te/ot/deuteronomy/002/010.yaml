translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని విశేషణాల వరుసను సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు వాక్యప్రవాహం కోసం రెండవ వాక్యంగా అమర్చాం.
