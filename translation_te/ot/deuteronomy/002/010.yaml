  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: te
  text: పూర్వకాలంలో ఏమీయులు అక్కడ నివసించారు[a]. వారు అనాకీయులవలె గొప్పవారూ, అనేకమందీ, ఎత్తైనవారూ అయిన ప్రజలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మునుపు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵמִים
  choice: ఏమీయులు
  rationale: ఈ ప్రజావర్గపు హీబ్రూ పేరును అర్థానువాదం చేయకుండా, తెలుగులో సహజమైన బహువచన జననామ రూపంలో లిప్యంతరీకరించాం.
- source_word: לְפָנִים
  choice: పూర్వకాలంలో
  rationale: ఇక్కడ పదం స్థలాన్ని కాక కాలాన్ని సూచిస్తుంది; ‘పూర్వకాలంలో’ అనే రూపం ‘formerly/in former times’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יָשְׁבוּ בָהּ
  choice: అక్కడ నివసించారు
  rationale: ישׁב + ב నివాసాన్ని సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న ప్రాంతం లేదా దేశాన్ని సూచిస్తున్నందున ‘అక్కడ’ అని అనువదించాం.
- source_word: עַם
  choice: ప్రజలు
  rationale: ఇది ఒక జాతి లేదా ప్రజావర్గాన్ని సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజంగా ఉంది.
- source_word: גָּדוֹל
  choice: గొప్పవారు
  rationale: పదం పరిమాణం లేదా భీకరతతో కూడిన గొప్పదనాన్ని సూచించగలదు; తరువాతి విశేషణాలతో కలిపి ‘గొప్పవారు’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְרַב
  choice: అనేకులు
  rationale: ప్రజల సంఖ్య ఎక్కువగా ఉందనే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וָרָם
  choice: ఎత్తైనవారు
  rationale: అనాకీయులతో శారీరక పోలిక ఉన్న సందర్భంలో רָם దేహపు ఎత్తును సూచిస్తుంది.
- source_word: כָּעֲנָקִים
  choice: అనాకీయులవలె
  rationale: తులనార్థక כְּ భావాన్ని ‘వలె’ నిలుపుతుంది; జాతిపేరును తెలుగులో లిప్యంతరీకరించాం.
