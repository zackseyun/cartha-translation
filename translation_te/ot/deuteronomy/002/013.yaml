  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ఆజ్ఞలోని బహువచనం నిలుపబడింది; ‘వాగు’ సాధారణ పాఠకునికి అర్థమయ్యే ప్రధాన పదంగా ఎంచుకొని, హీబ్రూ భౌగోళిక పదం యొక్క విస్తృతిని పాదటిప్పణిలో భద్రపరచాం.
