  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: te
  text: “ఇప్పుడు లేచి, జెరెదు వాగును[a] దాటండి.” అప్పుడు మేము జెరెదు వాగును దాటాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జెరెదు లోయను,” “జెరెదు ప్రవాహపాత్రను.” హీబ్రూ పదం נחל సందర్భాన్ని బట్టి వాగు, లోయ లేదా కాలానుగుణంగా నీరు ప్రవహించే ప్రవాహపాత్రను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: తదుపరి ఆజ్ఞను తక్షణ చర్యగా పరిచయం చేసే కాలసూచక పదాన్ని సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: קֻמוּ
  choice: లేచి
  rationale: బహువచన ఆజ్ఞారూప బలాన్ని నిలుపుతూ, వెంటనే అనుసరించే ‘దాటండి’తో సహజమైన తెలుగు ఆజ్ఞా నిర్మాణాన్ని ఇస్తుంది.
- source_word: וְעִבְרוּ
  choice: దాటండి
  rationale: ప్రయాణ సందర్భంలో ఒక వైపు నుండి మరో వైపుకు వెళ్లడాన్ని స్పష్టంగా తెలియజేస్తుంది; తెలుగు వాడుకలో ‘దాటి వెళ్లండి’ కంటే సంక్షిప్తంగా సహజంగా ఉంది.
- source_word: לָכֶם
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడి ప్రయోజనార్థక/నైతిక దత్తివాచకం ఆజ్ఞకు ఉద్ఘాటనను జోడిస్తుంది; తెలుగులో ‘మీ కోసం’ అని అక్షరార్థంగా పెట్టడం అనవసరమైన భావాన్ని కలిగించవచ్చు కాబట్టి ఆజ్ఞా రూపంలోనే అంతర్భావం చేయబడింది.
- source_word: נַחַל
  choice: వాగు
  rationale: ఎండాకాలంలో ఎండిపోయే జలమార్గం, ప్రవాహపాత్ర లేదా చిన్న ప్రవాహం అనే సందర్భోచిత పరిధిని సాధారణ ఆధునిక తెలుగు పాఠకునికి సహజంగా అందిస్తుంది; పదంలోని భౌగోళిక విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
- source_word: זָרֶד
  choice: జెరెదు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וַנַּעֲבֹר
  choice: అప్పుడు మేము … దాటాము
  rationale: మొదటి పురుష బహువచన కథనక్రియను, ఆజ్ఞ తరువాత జరిగిన కార్యంగా సహజమైన తెలుగు క్రమసూచకంతో వ్యక్తం చేస్తుంది.
