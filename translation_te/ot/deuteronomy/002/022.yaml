id: DEU.2.22
reference: Deuteronomy 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: te
  text: సేయీరులో నివసించే ఏశావు సంతానం కోసం ఆయన చేసినట్లే, ఆయన వారి ఎదుటనుండి హోరీయులను నాశనం చేశాడు; వారు హోరీయుల స్థలాన్ని స్వాధీనం చేసుకొని, వారి స్థానంలో నేటివరకు నివసిస్తున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲש׶ֶר עָשָׂה
  choice: చేసినట్లే
  rationale: ముందటి వాక్యంతో ఉన్న పోలికను సహజమైన తెలుగులో చూపిస్తూ, עָשָׂה అనే విస్తృతార్థ క్రియను అతిగా నిర్దిష్టం చేయదు.
- source_word: לִבְנֵי עֵשָׂו
  choice: ఏశావు సంతానం కోసం
  rationale: ఇది ప్రత్యక్ష కుమారులను మాత్రమే కాక ఏశావు వంశస్థులను సూచించే జాతి-వంశ ప్రయోగం; ఆధునిక తెలుగులో ‘సంతానం’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: సేయీరులో నివసించే
  rationale: వర్తమాన కృదంత భావాన్ని సహజంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִשְׁמִיד
  choice: నాశనం చేశాడు
  rationale: హిఫీల్ క్రియలోని బలమైన నిర్మూలన భావాన్ని నిలుపుతుంది; ‘తుడిచిపెట్టాడు’ కంటే తటస్థమైన గంభీర శైలి.
- source_word: הַחֹרִי
  choice: హోరీయులను
  rationale: ప్రజావర్గ నామాన్ని తెలుగులో ప్రామాణిక ధ్వన్యనుకరణతో బహువచనంగా అందిస్తుంది.
- source_word: מִפְּנֵיהֶם
  choice: వారి ఎదుటనుండి
  rationale: హీబ్రూ స్థలసంబంధ నుడికారాన్ని సాధ్యమైనంతగా నిలుపుతుంది; వారి సన్నిధి లేదా భూభాగం నుంచి తొలగించడం అనే సందర్భార్థం కలదు.
- source_word: וַיִּירָשֻׁם
  choice: వారు హోరీయులను స్వాధీనంలోనుండి తొలగించి
  rationale: ירשׁ యొక్క ఆక్రమణ సందర్భార్థం—మునుపటి నివాసులను తొలగించి వారి భూమిని స్వాధీనం చేసుకోవడం—తెలుగులో స్పష్టమవుతుంది. సర్వనామ గందరగోళాన్ని నివారించేందుకు ‘హోరీయులను’ పునరుక్తి చేసింది.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: వారి స్థానంలో ... నివసిస్తున్నారు
  rationale: మునుపటి ప్రజల స్థానాన్ని ఆక్రమించి అక్కడ స్థిరనివాసం ఏర్పరచుకున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: హీబ్రూ కాలవ్యక్తీకరణకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: עָשָׂה మరియు הִשְׁמִיד క్రియల అంతర్నిహిత కర్త
  choice: ‘ఆయన’ అని స్పష్టపరచి, సందర్భానుసారం యెహోవాను కర్తగా ఉంచడం
  alternative: కర్తను తెలుగులో కూడా అంతర్నిహితంగానే ఉంచడం
  rationale: సమీప సందర్భంలో మూడవ పురుష ఏకవచన క్రియల కర్త యెహోవా; ‘ఆయన’ అనడం కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
- issue: וַיִּירָשֻׁם లోని భావం
  choice: ఏశావు సంతానం హోరీయులను తొలగించి వారి స్థలాన్ని స్వాధీనం చేసుకున్నట్లు అనువదించడం
  alternative: ‘వారిని స్వాధీనం చేసుకున్నారు’ అని పదశః అనువదించడం
  rationale: ఇక్కడ వ్యక్తులను ఆస్తిగా స్వాధీనం చేసుకోవడం కాదు; పూర్వ నివాసులను తొలగించి వారి భూభాగాన్ని ఆక్రమించడం సందర్భార్థం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని పోలిక, కర్త మార్పు, ఆక్రమణ-నివాస క్రమాన్ని నిలిపింది.
