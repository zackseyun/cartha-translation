source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: te
  text: మీరు అమ్మోను కుమారులకు[a] ఎదురుగా చేరినప్పుడు, వారిని వేధించవద్దు[b] లేదా వారితో కలహానికి దిగవద్దు. ఎందుకంటే అమ్మోను కుమారుల దేశంలో ఏ భాగాన్నీ నేను మీకు స్వాధీనంగా[c] ఇవ్వను. దానిని నేను లోతు కుమారులకు స్వాధీనంగా ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ వచనమంతటా ‘అమ్మోనీయులు’.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిపై దాడి చేయవద్దు.’ హీబ్రూ పదం కేవలం అధికారిక ముట్టడినే కాక, శత్రుత్వపూర్వక చర్యను విస్తృతంగా నిషేధించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారసత్వ ఆస్తిగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: ఎదురుగా చేరినప్పుడు
  rationale: קָרַב అనే సమీపించే క్రియను, מוּל అనే ‘ఎదురుగా/ముఖాముఖిగా’ ఉన్న స్థలసంబంధ భావాన్ని కలిపి సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోను కుమారులు
  rationale: జాతిపేరుగా మాత్రమే మార్చకుండా, మూలంలోని కుటుంబ-వంశ సంబంధ పదబంధాన్ని నిలుపుతుంది.
- source_word: אַל תְּצֻרֵם
  choice: వారిని వేధించవద్దు
  rationale: ఇక్కడ צור శత్రుత్వపూర్వక ఒత్తిడి లేదా దాడికి సంబంధించిన విస్తృత భావాన్ని కలిగి ఉండవచ్చు; ‘ముట్టడించవద్దు’ అని నగర ముట్టడికే పరిమితం చేయకుండా ఈ విస్తృతిని నిలుపుతుంది.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: వారితో కలహానికి దిగవద్దు
  rationale: גרה హిత్పయేల్ రూపంలోని కలహాన్ని రేపడం లేదా శత్రుత్వంలోకి దిగడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని ‘యుద్ధానికి’ అనే పదాన్ని చేర్చదు.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: అమ్మోను కుమారుల దేశంలో దేనినీ
  rationale: నిషేధ వాక్యంలో מִן సూచించే భాగార్థాన్ని—ఆ దేశంలో ఏ భాగమూ ఇవ్వబడదనే భావాన్ని—స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יְרֻשָּׁה
  choice: స్వాధీనంగా
  rationale: భూమిని దేవుడు కేటాయించి స్థిరంగా అనుభవించడానికి ఇచ్చిన ఆస్తి అనే సందర్భోచిత భావాన్ని ఇస్తుంది; ‘వారసత్వం’ అనే ప్రత్యామ్నాయ భావం గమనికలో ఉంచబడింది.
- source_word: לִבְנֵי לוֹט
  choice: లోతు కుమారులకు
  rationale: మూలంలోని బంధుత్వ నిర్మాణాన్ని కాపాడి, ఇదే వచనంలోని ‘అమ్మోను కుమారులు’ అనే ప్రయోగంతో అనుసరణను నిలుపుతుంది.
- source_word: נְתַתִּיהָ
  choice: దానిని నేను ... ఇచ్చాను
  rationale: పూర్తయిన దైవిక భూదానాన్ని, ప్రస్తుతం చెల్లుబాటులో ఉన్న నిర్ణయంగా తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: జాతీయ సమూహాలకు వాడిన בְּנֵי అనే బంధుత్వ పదం
  choice: అమ్మోను కుమారులు / లోతు కుమారులు
  alternative: అమ్మోనీయులు / లోతు సంతతివారు
  rationale: మూలంలోని వంశ-కుటుంబ భాషను నిలిపి, దేవుడు బంధువర్గాలకు కేటాయించిన భూహక్కుల నేపథ్యాన్ని అనవసరంగా సాధారణ జాతిపేరుగా మార్చకుండా ఉంచుతుంది.
- issue: יְרֻשָּׁה యొక్క భావం
  choice: స్వాధీనంగా
  alternative: వారసత్వ ఆస్తిగా
  rationale: ఈ భూకేటాయింపు సందర్భంలో రెండూ సాధ్యమే. ప్రధాన పాఠం స్వాధీన హక్కును ముందుకు తెస్తుంది; కుటుంబ వారసత్వ భావాన్ని తప్పనిసరిగా మోపకుండా నిజమైన పదార్థ పరిధిని గమనికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కుమారులు’ అనే మూలభాషా బంధుత్వ రూపం ఉద్దేశపూర్వకంగా నిలుపబడింది; అస్పష్టత ఉన్న చోట ప్రత్యామ్నాయాలు పాదటిప్పణుల్లో ఇవ్వబడ్డాయి.
