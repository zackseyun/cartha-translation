source:
  edition: WLC
  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: te
  text: అయితే హెష్బోను రాజైన సీహోను మనలను తన దేశం గుండా వెళ్లనివ్వడానికి ఇష్టపడలేదు; ఎందుకంటే నీ దేవుడైన యాహ్వే అతని ఆత్మను కఠినపరచి, అతని హృదయాన్ని మొండిగా చేశాడు[a], అతన్ని నీ చేతికి అప్పగించడానికి—ఈనాడు ఉన్నట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని హృదయాన్ని బలపరిచాడు’ లేదా ‘దృఢపరచాడు.’ హెబ్రీ క్రియకు ‘బలపరచు’ అనే అర్థం రావచ్చు; అయితే ఈ సందర్భంలో అది మొండితనం లేదా దృఢమైన ప్రతిఘటనను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ఇష్టపడలేదు
  rationale: ఈ క్రియ బాహ్యమైన నిరాకరణను మాత్రమే కాక అంతర్గత సమ్మతి లేదా సుముఖత లేకపోవడాన్ని సూచిస్తుంది.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: మనలను తన దేశం గుండా వెళ్లనివ్వడానికి
  rationale: హిఫీల్ రూపం అనుమతించడం లేదా దాటనివ్వడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో בּוֹ సీహోను వ్యక్తిని కాక అతని ఆధీనంలోని ప్రాంతాన్ని సూచిస్తుంది.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: అతని ఆత్మను కఠినపరచి
  rationale: మూలంలోని ‘ఆత్మ’ అనే మానవ అంతరంగ పదాన్ని నిలుపుతూ, హిఫీల్ క్రియలోని ‘కఠినం చేయడం’ అనే సూటి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: అతని హృదయాన్ని మొండిగా చేశాడు
  rationale: אמץ అనే క్రియకు ‘బలపరచు’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ నిరాకరణ మరియు దైవిక కఠినపరచడం అనే సందర్భంలో మొండితనాన్ని సూచిస్తుంది; ప్రత్యామ్నాయ సూటి అర్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְמַעַן
  choice: అప్పగించాలనే ఉద్దేశంతో
  rationale: ఈ పదబంధం ఉద్దేశం లేదా లక్ష్యాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉద్దేశార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: అతన్ని నీ చేతికి అప్పగించడానికి
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హెబ్రీ నుడికారం ఒకరి అధికారానికి లేదా వశానికి అప్పగించడాన్ని సూచిస్తుంది; ‘నీ చేతికి’ అనడం మూల రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజు ఉన్నట్టుగా
  rationale: ద్వితీయోపదేశకాండంలో తరచు వచ్చే ఈ నుడికారం ప్రస్తుతం కనిపిస్తున్న పరిణామాన్ని సూచిస్తుంది; తెలుగు రూపం దాని కాలసూచనను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
theological_decisions:
- issue: దైవిక కఠినపరచడం మరియు సీహోను సొంత అయిష్టత
  choice: సీహోను ఇష్టపడకపోవడాన్ని, యెహోవా అతని ఆత్మను కఠినపరచి హృదయాన్ని మొండిగా చేయడాన్ని రెండింటినీ సూటిగా నిలుపడం
  alternative: దేవుడు కేవలం అనుమతించాడని చెప్పడం లేదా సీహోను తానే తనను కఠినపరచుకున్నాడనే అంశాన్ని మాత్రమే నొక్కిచెప్పడం
  rationale: హెబ్రీ పాఠం మానవ అయిష్టతను, దేవుని కార్యాన్ని రెండింటినీ స్పష్టంగా చెబుతుంది. వాటి మధ్య ఉన్న వేదాంతపరమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘ఆత్మ,’ ‘హృదయం,’ ‘నీ చేతికి’ వంటి మూల రూపకాలు నిలుపబడ్డాయి; ‘తన దేశం’ అనేది సందర్భంలో సూచితమైన ప్రాంతార్థాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
