- from: అయితే హెష్బోను రాజైన సీహోను మనలను తన దేశం గుండా వెళ్లనివ్వడానికి ఇష్టపడలేదు. ఎందుకంటే నీ దేవుడైన యెహోవా అతని ఆత్మను కఠినపరచి, అతని హృదయాన్ని మొండిగా చేశాడు[a]. ఈ రోజు ఉన్నట్టుగా అతన్ని నీ చేతికి అప్పగించాలనే ఉద్దేశంతో ఆయన అలా చేశాడు.
