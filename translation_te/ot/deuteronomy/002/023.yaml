translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణాన్ని ఉపయోగించాం. మూలంలోని జనసమూహాల పేర్లను తెలుగు ధ్వని వ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించాం. בַּחֲצֵרִים పదంలోని అర్థవిస్తృతిని పాదటిప్పణిలో నిలిపాం.
