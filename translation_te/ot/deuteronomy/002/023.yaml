  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: te
  text: అవ్వీయుల[a] విషయానికొస్తే, గాజా వరకు విస్తరించిన గ్రామాల్లో[b] నివసించిన వారిని కఫ్తోరు నుండి బయలుదేరి వచ్చిన కఫ్తోరీయులు నాశనం చేసి, వారి స్థానంలో స్థిరపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవ్వీములు.’
    reason: lexical_alternative
  - marker: b
    text: ‘గ్రామాలు’ అనే పదాన్ని ‘చిన్న నివాసస్థలాలు’ లేదా ‘శిబిరాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: అవ్వీయులు
  rationale: ఇది ఒక జనసమూహపు పేరు. మూలంలోని ‘అవ్వీమ్’ రూపాన్ని తెలుగు పాఠకులకు సహజంగా వినిపించే జనవాచక రూపమైన ‘అవ్వీయులు’గా లిప్యంతరీకరించాం.
- source_word: הַיֹּשְׁבִים
  choice: నివసించిన
  rationale: ישב ఇక్కడ ఒక ప్రాంతంలో నివాసముండడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నివసించిన’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בַּחֲצֵרִים
  choice: నివాస గ్రామాల్లో
  rationale: חֲצֵרִים ప్రాకారాలు లేని గ్రామాలు, చిన్న నివాస ప్రాంతాలు లేదా శిబిరసదృశ నివాసాలను సూచించగలదు. ‘నివాస గ్రామాలు’ స్థిర నివాస భావాన్ని తెలియజేస్తూనే పదార్థాన్ని అతిగా సంకుచితం చేయదు.
- source_word: עַד עַזָּה
  choice: గాజా వరకు ఉన్న
  rationale: עַד భౌగోళిక విస్తృతి యొక్క చివరి హద్దును సూచిస్తుంది; ‘గాజా వరకు ఉన్న’ తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כַּפְתֹּרִים
  choice: కఫ్తోరీయులు
  rationale: ఇది జనసమూహపు పేరు; కఫ్తోరు ప్రాంతానికి చెందిన ప్రజలను సూచించే సహజ తెలుగు జనవాచక రూపాన్ని వాడాం.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: కఫ్తోరు నుండి వచ్చిన
  rationale: יצאలోని బయలుదేరి రావడం అనే భావాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘నుండి వచ్చిన’ అని అనువదించాం.
- source_word: הִשְׁמִידֻם
  choice: వారిని నాశనం చేసి
  rationale: Hiphil రూపంలోని שׁמד పూర్తిగా నాశనం చేయడం లేదా నిర్మూలించడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘నాశనం చేసి’ ఆ బలాన్ని అనవసరంగా పెంచకుండా నిలుపుతుంది.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: వారి స్థానంలో స్థిరపడ్డారు
  rationale: תַחְתָּם ఇక్కడ మునుపటి నివాసులను భర్తీ చేసి వారి ప్రాంతాన్ని ఆక్రమించుకొని నివసించడాన్ని సూచిస్తుంది. ‘వారి స్థానంలో స్థిరపడ్డారు’ నివాసం మరియు భర్తీ అనే రెండు భావాలనూ స్పష్టంగా ఇస్తుంది.
