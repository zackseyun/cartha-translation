source:
  edition: WLC
  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: te
  text: అర్నోను లోయ అంచున ఉన్న అరోయేరు నుండి, ఆ లోయలోని పట్టణం నుండి గిలాదు వరకు, మాకు అందనంత ఎత్తులో ఉన్న[a] ఏ పట్టణమూ లేదు. మన దేవుడైన యాహ్వే అన్నిటినీ మనకు అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనకంటే బలమైన పట్టణమేదీ లేదు,’ లేదా ‘మనం చేరుకోలేని పట్టణమేదీ లేదు.’ హీబ్రూ మూలంలో అక్షరార్థంగా, ఏ పట్టణమూ ‘మనకు అందనంత ఎత్తుగా లేదు’ అని ఉంది; ఇక్కడ ఎత్తు దుర్భేద్యతను లేదా చేరుకోలేని స్థితిని సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: అరోయేరు నుండి
  rationale: מִן ఉపసర్గ భౌగోళిక పరిధి ప్రారంభాన్ని సూచిస్తుంది; తెలుగులో ‘నుండి’ సహజంగా దానిని తెలియజేస్తుంది.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: అర్నోను లోయ అంచు
  rationale: שָׂפָה అంటే అక్షరార్థంగా ‘పెదవి/అంచు/ఒడ్డు’; נַחַל ఇక్కడ లోయ లేదా వాడీని సూచిస్తుంది. ‘లోయ అంచు’ భౌగోళిక చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: ఆ లోయలో ఉన్న పట్టణం మీదుగా
  rationale: హీబ్రూ వావ్‌తో మరో భౌగోళిక స్థలాన్ని జతచేస్తుంది. తెలుగులో ‘మీదుగా’ పరిధిలోని వరుస స్థలాన్ని సహజంగా సూచిస్తుంది; ‘సహా’ అని చెప్పి సంబంధాన్ని అతిగా నిర్ధారించదు.
- source_word: וְעַד הַגִּלְעָד
  choice: గిలాదు వరకు
  rationale: עַד భౌగోళిక పరిధి ముగింపు బిందువును సూచిస్తుంది.
- source_word: קִרְיָה
  choice: పట్టణం
  rationale: ఈ పదం పట్టణం లేదా నగరాన్ని సూచించగలదు; ఆధునిక తెలుగులో ‘పట్టణం’ పరిమాణాన్ని అతిశయింపకుండా సరిపోతుంది.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: మాకు అందనంత ఎత్తులో ఉన్న
  rationale: మూలంలోని ఎత్తు రూపకాన్ని నిలుపుతూ, దుర్గం చేరుకోలేనిదిగా లేదా జయించలేనిదిగా ఉండే భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת הַכֹּל
  choice: వాటన్నిటినీ
  rationale: సందర్భంలో ముందుగా చెప్పిన పట్టణాలు లేదా ప్రాంతమంతటిని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచన సూచన సహజంగా ఉంటుంది.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యాహ్వే
  rationale: దైవనామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, אֱלֹהֵינוּను సహజ తెలుగు నిర్మాణంలో ‘మన దేవుడైన’గా ఇచ్చింది.
- source_word: לְפָנֵינוּ
  choice: మనకు అప్పగించాడు
  rationale: జయసందర్భంలో ‘మన ఎదుట ఉంచాడు’ అనే హీబ్రూ నుడికారం వారి వశానికి అప్పగించడాన్ని సూచిస్తుంది; తెలుగులో ‘మనకు అప్పగించాడు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం నామ స్వభావాన్ని నిలుపుతుంది.
- issue: జయాన్ని దేవుడు అప్పగించిన కార్యంగా వ్యక్తీకరించడం
  choice: వాటన్నిటినీ మనకు అప్పగించాడు
  alternative: వాటన్నిటినీ మన ఎదుట ఉంచాడు
  rationale: לְפָנֵינוּ యొక్క హీబ్రూ రూపాన్ని యథాతథంగా అనుసరించే ప్రత్యామ్నాయం ఉన్నప్పటికీ, ఈ సైనిక సందర్భంలో అది శత్రు పట్టణాలను ఇశ్రాయేలు వశానికి అప్పగించడాన్ని సూచిస్తుంది. అదనపు సిద్ధాంతార్థం చేర్చకుండా సందర్భార్థాన్ని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. భౌగోళిక నామాలను తెలుగు బైబిలు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం. మూలంలోని ‘ఎత్తు’ రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సాధ్యమైన సైనిక అర్థాలను పాదటిప్పణిలో ఇచ్చాం.
