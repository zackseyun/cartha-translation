  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: te
  text: అంతేకాక, యాహ్వే హస్తం వారికి విరోధంగా ఉండి, శిబిరం మధ్యలో నుండే వారిని కలవరపరచడానికి పనిచేసింది; వారు పూర్తిగా అంతమయ్యే వరకు అలాగే చేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కలవరపరచడానికి” అని అనువదించిన హీబ్రూ క్రియకు “భయాందోళనకు గురిచేయడానికి” లేదా “చెదరగొట్టడానికి” అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ అది దైవిక తీర్పు కార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: ముందటి వాక్యంతో సంబంధాన్ని కొనసాగిస్తూ, అదనపు ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יַד יְהוָה
  choice: యెహోవా హస్తం
  rationale: దేవుని శక్తి లేదా కార్యాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతూ, దైవనామాన్ని లిప్యంతరీకరించింది.
- source_word: בָם
  choice: వారికి విరోధంగా
  rationale: యెహోవా హస్తంతో కలిసినప్పుడు ఈ విభక్తి వారిపై జరిగిన ప్రతికూల కార్యాన్ని సూచిస్తుంది.
- source_word: לְהֻמָּם
  choice: వారిని కలవరపరిచింది
  rationale: హీబ్రూ క్రియ సూచించే భయాందోళన, గందరగోళం లేదా చెదరగొట్టడాన్ని ‘నాశనం చేసింది’గా కుదించకుండా వ్యక్తం చేస్తుంది.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: శిబిరం మధ్యనుండి
  rationale: శిబిరపు అంతర్భాగం లేదా సమాజం మధ్యనుండి తొలగిపోవడాన్ని సూచించే మూలభాషా concrete expressionను నిలుపుతుంది.
- source_word: עַד תֻּמָּם
  choice: వారు పూర్తిగా అంతమయ్యే వరకు
  rationale: ఆ సమూహం పూర్తిగా ముగింపుకు రావడాన్ని సహజమైన తెలుగులో తెలుపుతూ, అది ఎలా సంభవించిందనే విషయంలో మూలంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా ఉంచింది; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన శైలిని ఉపయోగించాం. ‘హస్తం’ అనే బైబిలీయ రూపకాన్ని ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సహజ తెలుగు ప్రవాహానికి అనుగుణంగా తీర్చిదిద్దాం.
