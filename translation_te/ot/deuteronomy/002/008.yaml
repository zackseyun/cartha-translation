source:
  edition: WLC
  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: te
  text: ఆ విధంగా, శేయీరులో నివసించే మన సహోదరులైన ఏశావు కుమారులను[a] దాటి ముందుకు సాగాం. ఏలతు, ఎజ్యోను-గెబెరు నుండి సాగే అరాబా మార్గాన్ని[b] విడిచి, మలుపు తిరిగి మోయాబు అరణ్య మార్గంలో ముందుకు సాగాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన బంధువులైన ఏశావు సంతతివారిని.’ హీబ్రూలో అక్షరార్థంగా, ‘మన సహోదరులు, ఏశావు కుమారులు’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: ‘అరాబా’ అనేది మృత సముద్రానికి దక్షిణంగా ఉన్న భ్రంశలోయ ప్రాంతాన్ని సూచిస్తుంది. ‘అరాబా మార్గం నుండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_and_geographical_clarification
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: దాటి ముందుకు సాగాం
  rationale: עבר తో מֵאֵת కలిసి ఇక్కడ ఒక సమూహాన్ని దాటి ప్రయాణాన్ని కొనసాగించడాన్ని సూచిస్తుంది. ‘దాటి ముందుకు సాగాం’ అనే రూపం ప్రయాణ సందర్భాన్నీ, ముందుకు కొనసాగిన భావాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: మన సహోదరులైన ఏశావు కుమారులు
  rationale: హీబ్రూలోని బంధుత్వ పదమైన ‘మన సహోదరులు’ను నిలుపుతూ, ‘ఏశావు కుమారులు’ అనే వంశపరమైన అసలు రూపాన్ని కూడా కాపాడుతుంది.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: శేయీరులో నివసించే
  rationale: ישב యొక్క స్థిర నివాస భావాన్ని ఆధునిక, సహజమైన తెలుగులో ‘నివసించే’గా అందిస్తుంది.
- source_word: מִדֶּרֶךְ הָעֲרָבָה מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: ఏలతు, ఎసోన్గెబెరు నుండి సాగే అరాబా మార్గాన్ని విడిచి
  rationale: స్థలనామమైన ‘అరాబా’ను అనువదించకుండా ఉంచి, ఏలతు మరియు ఎసోన్గెబెరుతో మార్గానికి ఉన్న సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. מן యొక్క దూరమయ్యే భావాన్ని ‘విడిచి’గా వ్యక్తం చేసింది.
- source_word: וַנֵּפֶן
  choice: మలుపు తిరిగి
  rationale: פנה సూచించే దిశ మార్పును సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: మోయాబు అరణ్య మార్గంలో ముందుకు సాగాం
  rationale: ప్రయాణ సందర్భంలో עבר యొక్క కొనసాగింపు భావాన్ని నిలుపుతూ, ‘మోయాబు అరణ్య మార్గం’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఏదోమీయులతో ఇశ్రాయేలు బంధుత్వం
  choice: మన సహోదరులైన ఏశావు కుమారులు
  alternative: మన బంధువులైన ఏశావు సంతతివారు
  rationale: ‘సహోదరులు’ అనే హీబ్రూ బంధుత్వ భాషను యథాతథంగా నిలపడం ద్వారా ఇశ్రాయేలు–ఏదోము సంబంధాన్ని సాధారణ జాతి సూచనగా పలుచన చేయకుండా కాపాడుతుంది; అదే సమయంలో ‘ఏశావు కుమారులు’ను జీవశాస్త్రీయ ప్రత్యక్ష కుమారులకే పరిమితం చేయకుండా వంశపరమైన ప్రయోగంగా చదవవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రయాణ వర్ణన శైలిని వాడాం. ‘నివసించే,’ ‘మలుపు తిరిగి,’ ‘ముందుకు సాగాం’ వంటి సాధారణ పదాలతో పాఠాన్ని సులభంగా ఉంచుతూ, శేయీరు, అరాబా, ఏలతు, ఎసోన్గెబెరు, మోయాబు వంటి స్థలనామాలను బైబిలు సందర్భానికి తగిన రూపాల్లో నిలిపాం.
