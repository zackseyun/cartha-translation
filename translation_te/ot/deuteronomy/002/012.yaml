  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: te
  text: సేయీరులో హోరీయులు పూర్వం నివసించేవారు. అయితే ఏశావు కుమారులు వారిని వెళ్లగొట్టి వారి భూమిని స్వాధీనం చేసుకొని[a], తమ ఎదుటనుండి వారిని నాశనం చేసి, వారి స్థానంలో నివసించారు. యెహోవా ఇశ్రాయేలీయులకు ఇచ్చిన తన స్వాస్థ్య దేశం విషయంలో ఇశ్రాయేలు చేసినట్టే వారు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని వెళ్లగొట్టారు.’ హీబ్రూ క్రియ ముందున్న నివాసులను తొలగించి వారి భూమిని స్వాధీనం చేసుకోవడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: హోరీయులు
  rationale: సేయీరులో నివసించిన జాతి పేరుగా ఉన్నందున, ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణమైన ప్రజానామ రూపాన్ని ఉపయోగించాం.
- source_word: לְפָנִים
  choice: పూర్వం
  rationale: ఇక్కడ స్థలార్థం కాక, గతకాలాన్ని సూచించే సహజమైన కాలార్థం ఉంది.
- source_word: יִירָשׁוּם
  choice: వారిని వెళ్లగొట్టి వారి భూమిని స్వాధీనం చేసుకొని
  rationale: ירשׁ క్రియలో ముందున్న నివాసులను తొలగించడం, వారి భూమిని స్వాధీనపరచుకోవడం అనే రెండు భావాలూ ఉన్నాయి. తెలుగులో ఈ రెండింటినీ స్పష్టంగా ఉంచాం; ‘వారి భూమిని’ అనేది సందర్భం ద్వారా గ్రహించబడే కర్మ.
- source_word: וַיַּשְׁמִידוּם
  choice: వారిని ... నాశనం చేసి
  rationale: שׁמד లోని బలమైన నిర్మూలన భావాన్ని నిలుపుతూ, మూలం చెప్పినదానికంటే ఎక్కువగా సంపూర్ణ అంతమని నిర్దిష్టం చేయలేదు.
- source_word: מִפְּנֵיהֶם
  choice: తమ ఎదుటనుండి
  rationale: వారి సన్నిధి లేదా ప్రాంతం నుంచి తొలగించడాన్ని తెలిపే హీబ్రూ నుడికారపు రూపాన్ని సాధ్యమైనంత సహజంగా నిలిపాం.
- source_word: תַּחְתָּם
  choice: వారి స్థానంలో
  rationale: మునుపటి నివాసుల స్థానాన్ని వీరు ఆక్రమించి నివసించారనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: ఇశ్రాయేలు చేసినట్టే
  rationale: మూలంలోని సరళమైన చారిత్రక పోలికను కాలసంబంధ సమస్యలను సవరించకుండా యథాతథంగా ఉంచాం.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: తన స్వాస్థ్యమైన దేశానికి
  rationale: יְרֻשָּׁהలో వారసత్వంగా లభించినదీ, స్వాధీనంలో ఉన్నదీ అనే భావాలు కలిసివున్నాయి. ‘తన’ అనే ఏకవచనం సమష్టిగా చెప్పబడిన ఇశ్రాయేలును అనుసరిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: לָהֶם
  choice: ఇశ్రాయేలీయులకు
  rationale: హీబ్రూలో సమష్టి ఏకవచనమైన ‘ఇశ్రాయేలు’ నుంచి బహువచనమైన ‘వారికి’కి మార్పు ఉంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘ఇశ్రాయేలీయులకు’ అని చెప్పి, ప్రజల సమష్టిని సూచించాం.
theological_decisions:
- issue: ‘ఇశ్రాయేలు తన స్వాస్థ్యదేశానికి చేసినట్టే’ అనే పోలిక యొక్క కాలసంబంధ సూచన
  choice: దీనిని మూలపాఠంలోని చారిత్రక పోలికగానే నిలిపాం.
  alternative: ఇది తరువాత చేర్చిన వివరణగా చూపడం లేదా ఇశ్రాయేలు అప్పటికే దేశాన్ని స్వాధీనం చేసుకున్నాడనే సూచన రాకుండా వాక్యాన్ని మార్చడం.
  rationale: హీబ్రూ పాఠం ఇశ్రాయేలు చేసిన కార్యంతో నేరుగా పోలుస్తుంది. మూలవిమర్శ లేదా కాలక్రమ సమన్వయ సిద్ధాంతాన్ని అనువాదంలోకి చొప్పించలేదు.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సమష్టి ఏకవచనం (‘ఇశ్రాయేలు/తన’) నుంచి ప్రజలను సూచించే బహువచనానికి వచ్చే మార్పును అర్థవంతంగా నిలిపాం. ‘తమ ఎదుటనుండి’ అనే రూపం హీబ్రూ నుడికారపు స్వరాన్ని కొంత కాపాడుతుంది.
