- from: సేయీరులో పూర్వం హోరీయులు నివసించేవారు. అయితే ఏశావు కుమారులు వారిని వెళ్లగొట్టి వారి భూమిని స్వాధీనం చేసుకొని[a], వారిని తమ ఎదుటనుండి నాశనం చేసి, వారి స్థానంలో నివసించారు. యెహోవా ఇశ్రాయేలీయులకు ఇచ్చిన తన స్వాస్థ్యమైన దేశానికి[b] ఇశ్రాయేలు చేసినట్టే వారు చేశారు.
