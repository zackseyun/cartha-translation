source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: te
  text: లేచి బయలుదేరి, అర్నోను వాగులోయను[a] దాటండి. ఇదిగో, హెష్బోను రాజైన అమోరీయుడు సీహోనును, అతని దేశాన్ని నీ చేతికి అప్పగించాను. దాన్ని స్వాధీనం చేసుకోవడం మొదలుపెట్టు[b]; అతనితో యుద్ధానికి తలపడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అర్నోను లోయను,’ ‘అర్నోను వాగును.’ హీబ్రూ పదం వాగు, దాని ప్రవాహపథం, లేదా వాగులోయను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాన్ని సొంతం చేసుకోవడం మొదలుపెట్టు.’ ఈ క్రియకు సందర్భానుసారం ‘స్వాధీనం చేసుకో,’ ‘సొంతం చేసుకో,’ లేదా ‘ఆక్రమణదారులను తొలగించు’ అనే భావాలు ఉండవచ్చు; ఇక్కడ వెంటనే ముందున్న కర్మ సీహోను దేశం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అతనితో యుద్ధం చేయి,’ ‘అతన్ని యుద్ధానికి రెచ్చగొట్టు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: లేచి బయలుదేరి
  rationale: రెండు బహువచన ఆజ్ఞల కదలికను సహజమైన ఆధునిక తెలుగులో వరుసగా వ్యక్తం చేస్తుంది.
- source_word: נַ֣חַל אַרְנֹן
  choice: అర్నోను వాగులోయ
  rationale: נחל ప్రవాహం ఉండే లోయను లేదా వాగు ప్రవాహపథాన్ని సూచించగలదు; ‘వాగులోయ’ ఈ రెండు భౌగోళిక భావాలను సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: רְאֵ֣ה
  choice: ఇదిగో
  rationale: ఏకవచన ఆజ్ఞ ద్వారా దైవ ప్రకటనవైపు దృష్టి మళ్లించే బలాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: נָתַ֣תִּי בְ֠יָדְךָ
  choice: నీ చేతికి అప్పగించాను
  rationale: అధికారం లేదా నియంత్రణకు అప్పగించడాన్ని తెలిపే హీబ్రూ రూపకాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָאֱמֹרִ֛י
  choice: హెష్బోను రాజైన అమోరీయుడు సీహోను
  rationale: సీహోను రాజ్యపదవినీ జాతి గుర్తింపునీ మూలంలోని అన్వయ నిర్మాణానికి దగ్గరగా, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: దాన్ని స్వాధీనం చేసుకోవడం మొదలుపెట్టు
  rationale: החל యొక్క ‘మొదలుపెట్టు’ భావాన్నీ ירש యొక్క ‘స్వాధీనం చేసుకో/సొంతం చేసుకో’ భావాన్నీ, ముందున్న దేశాన్ని కర్మగా తీసుకొని, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִתְגָּ֥ר בּ֖וֹ מִלְחָמָֽה
  choice: అతనితో యుద్ధానికి తలపడు
  rationale: శత్రుత్వంలోకి ప్రవేశించి యుద్ధం చేయమనే భావాన్ని తెలుగులో సహజంగా ఇస్తుంది; ‘రెచ్చగొట్టు’ అనే ఒక్క సూక్ష్మార్థానికే పరిమితం చేయదు.
theological_decisions:
- issue: దేవుడు ఇచ్చిన కార్యసిద్ధి మరియు ఇశ్రాయేలు చేయవలసిన చర్య
  choice: ‘అప్పగించాను’ అనే పూర్తయిన దైవ కార్యాన్నీ, ‘స్వాధీనం చేసుకోవడం మొదలుపెట్టు; ... యుద్ధానికి తలపడు’ అనే మానవ చర్యకు ఇచ్చిన ఆజ్ఞలనూ రెండింటినీ నిలుపడం.
  alternative: ‘అప్పగిస్తాను’ అని భవిష్యత్ వాగ్దానంగా మార్చడం, లేదా ప్రధాన పాఠంలో ירש ను కేవలం ‘అతన్ని వెళ్లగొట్టు’గా అనువదించడం.
  rationale: హీబ్రూ వాక్యం దేవుని పూర్తయిన అనుగ్రహాన్నీ ప్రజలకు ఆజ్ఞాపించిన కార్యాచరణనూ పక్కపక్కనే ఉంచుతుంది; అనువాదం ఆ ఉద్వేగాన్ని సడలించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవగంభీరమైనదిగానూ సాధారణ పాఠకులకు స్పష్టమైనదిగానూ ఉంచబడింది. మూలంలో బహువచన ఆజ్ఞల నుంచి మోషేను ఉద్దేశించిన ఏకవచన ఆజ్ఞలకు వచ్చే మార్పును ‘దాటండి’ మరియు ‘మొదలుపెట్టు/తలపడు’ రూపాలతో నిలిపింది.
