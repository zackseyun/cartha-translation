id: DEU.2.37
reference: Deuteronomy 2:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: te
  text: అయితే, అమ్మోనీయుల దేశానికి మాత్రం—యబ్బోకు వాగు ఒడ్డున ఉన్న ప్రాంతమంతటికీ, కొండప్రాంతంలోని పట్టణాలకూ, మా దేవుడైన యాహ్వే ఆజ్ఞాపించిన దేనికీ—నీవు దగ్గరగా వెళ్లలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: అయితే ... మాత్రం / వెళ్లలేదు
  rationale: ముందటి విజయాల సారాంశానికి మినహాయింపును సూచిస్తుంది. తెలుగులో సహజమైన విరుద్ధ-మినహాయింపు భావాన్ని ‘అయితే’తో తెలియజేశాం.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల దేశానికి
  rationale: ‘అమ్మోను కుమారుల దేశం’ అనే అక్షరార్థానికి బదులుగా, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే జాతినామ రూపాన్ని వాడాం; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לֹא קָרָבְתָּ
  choice: నీవు ... దగ్గరగా వెళ్లలేదు
  rationale: קָרַב యొక్క స్థలసంబంధమైన ‘సమీపించడం’ భావాన్ని కాపాడుతుంది; దాడి చేయడం అనే భావాన్ని అనవసరంగా చేర్చదు. ఏకవచనం సమష్టిగా ఇశ్రాయేలును ఉద్దేశిస్తుంది.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: యబ్బోకు వాగు పొడవునా ఉన్న తీరప్రాంతమంతటికీ
  rationale: ‘వాగు యొక్క చెయ్యి’ అనే హీబ్రూ నుడికారం వాగు పక్క, తీరం, లేదా దాని వెంటనున్న ప్రాంతాన్ని సూచిస్తుంది. ‘పొడవునా’ כָּל యొక్క విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעָרֵי הָהָר
  choice: కొండప్రాంత పట్టణాలకూ
  rationale: הָהָר ఇక్కడ ఒకే కొండకన్నా ఎత్తైన కొండప్రాంతాన్ని సూచిస్తుంది; עָרֵיకి సందర్భానుకూలంగా ‘పట్టణాలు’ వాడాం.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: వెళ్లవద్దని ఆజ్ఞాపించిన ఏ ప్రాంతానికీ
  rationale: హీబ్రూలో ఆజ్ఞ యొక్క కర్మ, అలాగే నిషేధార్థం, సందర్భం ద్వారా గ్రహించబడతాయి. ప్రధాన పాఠ్యంలో సందర్భానుగుణ అర్థాన్ని స్పష్టంచేశాం; మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో తెలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణను వాడాం.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవుడు
  rationale: ప్రసంగిస్తున్న మోషే ఇశ్రాయేలుతో కలిసి పలికే ప్రథమ పురుష బహువచన స్వామ్యరూపాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత నామమే ఉంది; కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించాం.
- issue: וְכֹל אֲשֶׁר צִוָּה లో ఆజ్ఞ యొక్క అంతర్లీన భావం
  choice: యాహ్వే వెళ్లవద్దని ఆజ్ఞాపించిన ఏ ప్రాంతానికీ
  alternative: యాహ్వే ఆజ్ఞాపించినదంతటికీ
  rationale: మునుపటి ఆజ్ఞల ప్రకారం అమ్మోనీయుల ప్రాంతాన్ని సమీపించకూడదనే సందర్భం నిషేధార్థాన్ని బలపరుస్తుంది. అయినా హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడనందున అక్షరార్థంలోని అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇశ్రాయేలును సమష్టిగా ఉద్దేశించే హీబ్రూ ఏకవచనాన్ని ‘నీవు’గా నిలిపాం. భౌగోళిక పదాలకు సాధారణ పాఠకునికి అర్థమయ్యే ‘వాగు’, ‘తీరప్రాంతం’, ‘కొండప్రాంతం’ రూపాలను వాడాం.
