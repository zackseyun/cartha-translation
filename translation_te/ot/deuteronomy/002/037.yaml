revisions:
- from: అయితే నీవు అమ్మోనీయుల దేశానికి[a] దగ్గరగా వెళ్లలేదు—యబ్బోకు వాగు పొడవునా ఉన్న తీరప్రాంతమంతటికీ[b], కొండప్రాంత పట్టణాలకూ, మా దేవుడైన యాహ్వే వెళ్లవద్దని ఆజ్ఞాపించిన ఏ ప్రాంతానికీ[c] దగ్గరగా వెళ్లలేదు.
