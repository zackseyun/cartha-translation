id: DEU.2.31
reference: Deuteronomy 2:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే నాతో ఇలా అన్నాడు: “చూడు, సీహోనును అతని దేశాన్నీ నీకు అప్పగించడం నేను ప్రారంభించాను[a]. అతని దేశాన్ని స్వాధీనం చేసుకోవడం ప్రారంభించు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ ముందు.” ఈ సందర్భంలో సీహోనును, అతని దేశాన్ని నీ అధీనంలోకి అప్పగించడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘స్వాధీనం చేసుకోవడం’ అనే క్రియ ఆజ్ఞారూపంలోనూ, తదనంతర క్రియారూపంలోనూ పునరుక్తమై ఆ ఆజ్ఞను బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వాడుకలో ఉన్న ‘యెహోవా’ రూపంలో అందించాం.
- source_word: רְאֵה
  choice: చూడు
  rationale: శ్రద్ధను ఆకర్షించే ఏకవచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: הַחִלֹּתִי תֵּת
  choice: నీ వశం చేయడం నేను మొదలుపెట్టాను
  rationale: ‘ఇవ్వడం మొదలుపెట్టాను’ అనే మూల నిర్మాణాన్ని, యుద్ధ సందర్భంలో ఒకరిని మరొకరి అధికారానికి అప్పగించే భావంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ వశం
  rationale: అక్షరార్థంగా ‘నీ ముందు’; ఈ సందర్భంలో సీహోనును, అతని దేశాన్ని ఇశ్రాయేలు అధికారానికి అప్పగించడాన్ని సూచిస్తుంది.
- source_word: הָחֵל רָשׁ לָרֶשֶׁת
  choice: స్వాధీనం చేసుకోవడం మొదలుపెట్టు
  rationale: దేవుడు ‘మొదలుపెట్టాను’ అన్న మాటకు ప్రతిస్పందనగా ఇశ్రాయేలు ‘మొదలుపెట్టు’ అనే సమాంతరతను నిలుపుతూ, ירש ధాతువు పునరుక్తిని సహజ తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אַרְצוֹ
  choice: అతని దేశం
  rationale: ఇక్కడ אֶרֶץ సీహోను పాలనలోని భూభాగాన్ని సూచిస్తుంది; ‘దేశం’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం ఒక బిరుదు కాకుండా దేవుని ప్రత్యేక నామాన్ని ఉపయోగిస్తుంది; అందువల్ల దానిని తెలుగులో పరిచితమైన వ్యక్తినామ రూపంగా నిలిపాం.
- issue: దైవ కార్యం మరియు ఇశ్రాయేలు చర్య మధ్య సంబంధం
  choice: దేవుడు అప్పగించడం మొదలుపెట్టాడు; ఇశ్రాయేలు స్వాధీనం చేసుకోవడం మొదలుపెట్టాలి
  alternative: దైవ చర్య మాత్రమే లేదా మానవ చర్య మాత్రమే ముందుకు తేవడం
  rationale: హీబ్రూ వాక్యంలో ఒకే ‘మొదలు’ భావం దేవుని కార్యానికీ ఇశ్రాయేలు ఆజ్ఞకూ వర్తిస్తుంది; ఆ ఉద్రిక్త సమన్వయాన్ని యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టంగా ఉండే శైలి. మోషేతో దేవుడు మాట్లాడుతున్నందున ఏకవచన సంబోధనను వాడాం. మూలంలోని ‘నేను మొదలుపెట్టాను / నీవు మొదలుపెట్టు’ సమాంతరతను నిలిపాం.
