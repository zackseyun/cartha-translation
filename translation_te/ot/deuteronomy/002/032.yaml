  yaml_path: translation/ot/deuteronomy/002/032.yaml
  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: te
  text: అప్పుడు సీహోను తన ప్రజలందరితో కలిసి మనలను ఎదుర్కొనడానికి యుద్ధం చేయడానికి యాహసుకు బయలుదేరి వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి వచ్చాడు
  rationale: יצא అనే క్రియ ఇక్కడ గత కథనంలోని చర్యను తెలియజేస్తుంది. వక్తల వైపు సీహోను రావడం అనే దృష్టికోణాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘బయలుదేరి వచ్చాడు’ అనువైనది.
- source_word: סִיחֹן
  choice: సీహోను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో స్థిరమైన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לִקְרָאתֵנוּ
  choice: మనకు ఎదురుగా
  rationale: పదబద్ధంగా ‘మనలను ఎదుర్కొనడానికి/కలవడానికి’ అనే భావం. తరువాతి ‘యుద్ధం చేయడానికి’ అనే పదబంధం శత్రుత్వ సందర్భాన్ని స్పష్టం చేస్తుంది; అందువల్ల మూలంలోని సాపేక్ష విస్తృతిని నిలుపుతూ ‘మనకు ఎదురుగా’ అని అనువదించాం.
- source_word: הוּא וְכָל עַמּוֹ
  choice: తన ప్రజలందరితో కలిసి
  rationale: సీహోను స్వయంగా తన ప్రజలతో వచ్చాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. עם ను సందర్భం సైనికమైనప్పటికీ ‘సైన్యం’గా కుదించకుండా ‘ప్రజలు’గా ఉంచాం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: ל ఉపసర్గ ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది. ‘యుద్ధం చేయడానికి’ అనేది సహజంగా ఉండి పోరాట ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָהְצָה
  choice: యాహసులో
  rationale: స్థలపేరును ‘యాహసు’గా లిప్యంతరీకరించి, దిశ/స్థల సూచక హీబ్రూ -ָה రూపాన్ని సందర్భానుసారంగా తెలుగు స్థానవాచక విభక్తితో వ్యక్తం చేశాం.
