translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని అర్థం మరియు శత్రుత్వ సందర్భాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపాం.
