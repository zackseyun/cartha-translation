source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: te
  text: 'ప్రజలకు ఇలా ఆజ్ఞాపించు: ‘శేయీరులో నివసిస్తున్న మీ సహోదరులైన ఏశావు కుమారుల ప్రాంతం గుండా మీరు వెళ్లబోతున్నారు[a]. వారు మీ పట్ల భయపడతారు. కాబట్టి ఎంతో జాగ్రత్తగా ఉండండి[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు వెళ్తున్నారు,” లేదా “మీరు వెళ్తారు.” హీబ్రూ కృదంతం సమీప భవిష్యత్తులో జరగబోయే చర్యను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అందుచేత మిమ్మల్ని మీరు ఎంతో జాగ్రత్తగా కాపాడుకోండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: ఆజ్ఞాపించు
  rationale: צוה క్రియ యొక్క ఆజ్ఞార్థక రూపం బలమైన, అధికారపూర్వకమైన నిర్దేశాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించు’ దాని బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలకు
  rationale: עם ఇక్కడ ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది; ‘ప్రజలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: אַתֶּם עֹבְרִים
  choice: మీరు వెళ్లబోతున్నారు
  rationale: స్వతంత్ర సర్వనామంతో ఉన్న కృదంతం సందర్భంలో సమీప భవిష్యత్తు చర్యను సూచిస్తుంది; ‘వెళ్లబోతున్నారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּגְבוּל
  choice: ప్రాంతం గుండా
  rationale: גְּבוּל సరిహద్దు రేఖను లేదా దాని లోపలి భూభాగాన్ని సూచించగలదు. ప్రయాణ సందర్భంలో ‘ప్రాంతం గుండా’ ప్రధాన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: మీ సహోదరులైన ఏశావు కుమారుల
  rationale: ‘సహోదరులు’ ఇశ్రాయేలు-ఏదోము మధ్య వంశబంధాన్ని నిలుపుతుంది; ‘ఏశావు కుమారులు’ మూలంలోని వంశావళి వ్యక్తీకరణను ప్రత్యక్షంగా కాపాడుతుంది.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: శేయీరులో నివసిస్తున్న
  rationale: ישב ఇక్కడ స్థిర నివాసాన్ని సూచిస్తుంది; ‘నివసిస్తున్న’ గౌరవప్రదమైన, ఆధునిక తెలుగు ప్రయోగం.
- source_word: וְיִירְאוּ מִכֶּם
  choice: వారు మీకు భయపడతారు
  rationale: ירא + מן ఇక్కడ ఇశ్రాయేలీయుల పట్ల కలిగే భయాన్ని సూచిస్తుంది; ‘మీకు భయపడతారు’ తెలుగులో స్పష్టమైన సహజ ప్రయోగం.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: కాబట్టి మీరు చాలా జాగ్రత్తగా ఉండాలి
  rationale: שמר నిఫాల్ రూపం ఇక్కడ స్వీయజాగ్రత్త భావాన్ని ఇస్తుంది; ‘చాలా’ అనే పదం מְאֹד యొక్క ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: ఏదోమీయులతో బంధుత్వ భాష
  choice: మీ సహోదరులైన ఏశావు కుమారులు
  alternative: మీ బంధువులైన ఏశావు సంతతి
  rationale: ‘సహోదరులు’ అనే ప్రత్యక్ష బంధుత్వ పదం ఇశ్రాయేలు, ఏదోము మధ్య వంశసంబంధాన్ని మరియు దానిపై ఆధారపడిన ప్రవర్తనా బాధ్యతను మృదువుపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆజ్ఞ యొక్క గంభీరతను మరియు వంశబంధ భాషను నిలుపుతూ అనువదించబడింది. גְּבוּל యొక్క ‘సరిహద్దు/ప్రాంతం’ అర్థసాధ్యతలో సందర్భానుకూలంగా ‘ప్రాంతం’ ఎంచుకోబడింది.
