  - severity: low
    issue: The full verse is enclosed in an extra pair of quotation marks.
    rationale: The Hebrew has a quoted message introduced after “saying,” not an additional quotation enclosing the whole verse. Removing the outer pair makes the punctuation conform to the discourse structure.
