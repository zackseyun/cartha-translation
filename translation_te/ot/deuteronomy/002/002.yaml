lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమానుగత పురోగతిని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֵלַי
  choice: నాతో
  rationale: ఈ సందర్భంలో ‘నాతో అన్నాడు’ అనేది אֶל + ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే לֵאמֹר భావాన్ని తెలుగులో సహజంగా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా తెలుగులో సంప్రదాయంగా పరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం; హీబ్రూ ఉచ్చారణను ‘యాహ్వే’గా పునర్నిర్మించడం కూడా సాధ్యం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ఇలా అన్నాడు’ ద్వారా హీబ్రూ לֵאמֹר యొక్క కార్యాన్ని సహజంగా ప్రతిబింబించాం.
