  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: te
  text: ఎందుకంటే నీ దేవుడైన యెహోవా నీ చేతి ప్రతి పనిలో నిన్ను ఆశీర్వదించాడు. ఈ గొప్ప అరణ్యంలో నీ ప్రయాణాన్ని ఆయన ఎరిగాడు.[a] ఈ నలభై సంవత్సరాలుగా నీ దేవుడైన యెహోవా నీతో ఉన్నాడు; నీకు ఏ కొదువూ కలగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ గొప్ప అరణ్యంలో నీ ప్రయాణాన్ని ఆయన శ్రద్ధగా చూసుకున్నాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “ఎరిగాడు” అని అర్థం; ఈ సందర్భంలో అది శ్రద్ధగల గమనింపు, సంరక్షణను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: בֵּרַכְךָ
  choice: నిన్ను ఆశీర్వదించాడు
  rationale: పూర్తయినప్పటికీ ఇప్పటికీ ప్రాసంగికమైన దేవుని కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఒడంబడిక సంబంధమైన ‘ఆశీర్వాదం’ భావాన్ని నిలుపుతుంది.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: నీ చేతుల పనులన్నిటిలో
  rationale: హీబ్రూ శరీరాంగ రూపకాన్ని తెలుగులో సహజంగా ఉంచి, వ్యక్తి చేసే శ్రమలు, కార్యాలన్నిటినీ సూచిస్తుంది.
- source_word: יָדַע
  choice: ఎరిగి ఉన్నాడు
  rationale: మూల క్రియలోని ‘తెలుసుకొను/ఎరుగును’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, సందర్భంలో ఉన్న శ్రద్ధగల అవగాహనను పూర్తిగా వివరణగా మార్చకుండా కాపాడుతుంది.
- source_word: לֶכְתְּךָ
  choice: నీ ప్రయాణాన్ని
  rationale: ఇశ్రాయేలు అరణ్యంలో సాగిన నడక లేదా సంచారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: ఈ గొప్ప అరణ్యంలో
  rationale: ప్రయాణం జరిగిన ప్రదేశాన్ని తెలుగులో సహజమైన విభక్తితో తెలుపుతుంది; ‘గొప్ప’ అనే మూల విశేషణాన్ని నిలుపుతుంది.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: ఈ నలభై సంవత్సరాలు
  rationale: కాలవ్యాప్తిని సూచించే హీబ్రూ ప్రయోగానికి దగ్గరగా ఉండే సహజ తెలుగు రూపం.
- source_word: עִמָּךְ
  choice: నీతో ఉన్నాడు
  rationale: హీబ్రూలో అంతర్లీనంగా ఉన్న స్థితి క్రియను తెలుగులో స్పష్టంగా పూరించి, దేవుని నిరంతర సన్నిధిని తెలియజేస్తుంది.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: నీకు ఏదీ కొదువ కాలేదు
  rationale: ఏ విషయములోనూ లోటు లేకపోవడాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నామంగా ఉంచాం; తెలుగు పాఠకులకు విస్తృతంగా సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: יָדַע క్రియలోని జ్ఞానం మరియు సంరక్షణ భావాలు
  choice: ఎరిగి ఉన్నాడు
  alternative: నీ ప్రయాణాన్ని కనిపెట్టుకొని ఉన్నాడు / నీ ప్రయాణాన్ని శ్రద్ధగా చూశాడు
  rationale: ప్రధాన పాఠంలో ‘ఎరుగుట’ అనే మూలార్థాన్ని నిలుపుతూ, శ్రద్ధగల పర్యవేక్షణ అనే సందర్భార్థాన్ని పాదసూచికలో చూపించాం; తద్వారా భావసందిగ్ధతను ఒకే అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సంబోధనను మూలపాఠానికి అనుగుణంగా ‘నీ/నిన్ను/నీకు’ రూపాల్లో నిలిపాం. దైవనామాన్ని బిరుదుగా మార్చలేదు; יָדַע లోని ఉద్దేశపూర్వక భావవిస్తృతిని ప్రధాన పాఠం మరియు పాదసూచిక కలిపి కాపాడాయి.
