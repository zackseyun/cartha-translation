revisions:
- from: ఎందుకంటే నీ దేవుడైన యెహోవా నీ చేతుల పనులన్నిటిలో నిన్ను ఆశీర్వదించాడు. ఈ గొప్ప అరణ్యంలో నీ ప్రయాణాన్ని ఆయన ఎరిగి ఉన్నాడు.[a] ఈ నలభై సంవత్సరాలు నీ దేవుడైన యెహోవా నీతో ఉన్నాడు; నీకు ఏదీ కొదువ కాలేదు.
  to: ఎందుకంటే నీ దేవుడైన యెహోవా నీ చేతి ప్రతి పనిలో నిన్ను ఆశీర్వదించాడు. ఈ గొప్ప అరణ్యంలో నీ ప్రయాణాన్ని ఆయన ఎరిగాడు.[a] ఈ నలభై సంవత్సరాలుగా నీ దేవుడైన యెహోవా నీతో ఉన్నాడు; నీకు ఏ కొదువూ కలగలేదు.
