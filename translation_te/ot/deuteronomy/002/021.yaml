revisions:
- from: వారు గొప్ప జనసమూహం—అనేకులూ, అనాకీయులవలె[a] ఎత్తైనవారూ. యాహ్వే వారిని వీరి ఎదుటనుండి నాశనం చేశాడు; వీరు వారిని వెళ్లగొట్టి వారి భూమిని స్వాధీనం చేసుకొని, వారి స్థానంలో నివసించారు.
  to: వారు గొప్ప, అనేకమైన, అనాకీయులవలె[a] ఎత్తైన ఒక జనాంగం. యాహ్వే వారిని వీరి ఎదుటనుండి నాశనం చేశాడు; వీరు వారిని తొలగించి, వారి స్థానంలో నివసించారు.
  rationale: సవరణ మూలంలోని మూడు విశేషణాలను ఒకే జనాంగానికి సహజంగా అనుసంధానించింది. ירשׁకు సంబంధించి మూలంలో లేని “భూమి”ని తొలగించి, పూర్వనివాసులను తొలగించి వారి స్థానంలో నివసించినారనే సందర్భసిద్ధమైన భావాన్ని కాపాడింది. దైవనామం, ప్రజానామం, మరియు పోలిక సూచకాన్ని యథాతథంగా నిలిపింది.
