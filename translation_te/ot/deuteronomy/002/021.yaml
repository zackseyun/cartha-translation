id: DEU.2.21
reference: Deuteronomy 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִ֑ים וַ/יַּשְׁמִידֵ֤/ם יְהוָה֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּירָשֻׁ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: te
  text: వారు గొప్ప, అనేకమైన, అనాకీయులవలె[a] ఎత్తైన ఒక జనాంగం. యాహ్వే వారిని వీరి ఎదుటనుండి నాశనం చేశాడు; వీరు వారిని తొలగించి, వారి స్థానంలో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అనాకువారివలె.”'
    reason: ‘అనాకీయులు’ అనే ప్రజానామానికి ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: గొప్ప జనసమూహం—అనేకులు
  rationale: עַם అనే ఏకవచన సమూహవాచకాన్ని ‘జనసమూహం’గా ఉంచి, גָּדוֹל మరియు רַב మధ్యనున్న భావభేదాన్ని ‘గొప్ప’ మరియు ‘అనేకులు’ ద్వారా సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: רָם
  choice: ఎత్తైనవారు
  rationale: అనాకీయులతో పోలిక శారీరక ఎత్తును సూచిస్తున్నందున ‘ఉన్నతులు’ వంటి అస్పష్ట పదానికి బదులు ‘ఎత్తైనవారు’ అని అనువదించింది.
- source_word: כָּעֲנָקִים
  choice: అనాకీయులవలె
  rationale: כְּ పోలికను స్పష్టంగా నిలిపి, עֲנָקִים అనే ప్రజానామాన్ని తెలుగులో ‘అనాకీయులు’గా లిప్యంతరీకరించింది.
- source_word: וַיַּשְׁמִידֵם
  choice: వారిని ... నాశనం చేశాడు
  rationale: שׁמד హిఫీల్ రూపంలోని బలమైన నిర్మూలన భావాన్ని నిలిపినా, సంపూర్ణ జాతినాశనం అని మూలం కంటే ఎక్కువగా నిర్దేశించలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో నేరుగా లిప్యంతరీకరించింది.
- source_word: מִפְּנֵיהֶם
  choice: వీరి ఎదుటనుండి
  rationale: హీబ్రూ నుడికారంలోని ‘వారి సమక్షం/ముందునుండి తొలగించడం’ అనే భావాన్ని సహజమైన తెలుగులో తెలిపింది; ‘వీరు’ పూర్వసందర్భంలోని ఏశావు సంతతిని సూచిస్తుంది.
- source_word: וַיִּירָשֻׁם
  choice: వారిని వెళ్లగొట్టి వారి భూమిని స్వాధీనం చేసుకొని
  rationale: ירשׁ ఇక్కడ పూర్వనివాసులను తొలగించి వారి భూస్వాధీనాన్ని పొందడం అనే ద్వంద్వభావాన్ని కలిగి ఉంది; తెలుగు పాఠకుడికి స్పష్టంగా ఉండేందుకు రెండింటినీ వ్యక్తం చేసింది.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: వారి స్థానంలో నివసించారు
  rationale: తొలగించబడిన ప్రజల స్థానాన్ని మరొక ప్రజ స్వీకరించి అక్కడ నివసించారనే ప్రత్యామ్నాయ నివాస భావాన్ని నేరుగా నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామపు అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: దేవుడు వారిని నాశనం చేశాడనే వాక్యంలోని బలం
  choice: నాశనం చేశాడు
  alternative: సమూలంగా నిర్మూలించాడు
  rationale: హీబ్రూ క్రియ బలమైన విధ్వంసాన్ని సూచిస్తుంది; అయితే ‘సమూలంగా’ అని చేర్చడం మూలపాఠం స్పష్టంగా చెప్పినదానికంటే సంపూర్ణతను ఎక్కువగా నిర్దేశించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. మొదటి వాక్యం హీబ్రూ వివరణాత్మక నిర్మాణాన్ని సహజంగా వినిపించేందుకు డ్యాష్‌తో అమర్చబడింది. వరుసగా వచ్చే సర్వనామాల సూచ్యాలను స్పష్టంచేయడానికి ‘వారు/వీరు’ భేదం వాడబడింది.
