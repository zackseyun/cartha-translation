  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని బహువచన ఆజ్ఞను గౌరవ/బహువచన రూపమైన ‘తిరగండి’తో నిలిపాం; భౌగోళిక పదంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఇచ్చాం.
