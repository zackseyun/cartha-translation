  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: te
  text: మీరు ఈ కొండ ప్రాంతం చుట్టూ చాలాకాలం తిరిగారు; ఇక ఉత్తరం వైపు తిరగండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ కొండ.’ హీబ్రూ పదం הַר ఒక కొండను లేదా కొండల ప్రాంతాన్ని సూచించగలదు; ఇక్కడి ప్రయాణ సందర్భం ‘కొండ ప్రాంతం’ అనే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: మీరు ... తిరిగింది చాలు
  rationale: ఈ హీబ్రూ ప్రయోగం కేవలం ‘ఎక్కువ’ అని కాక, సందర్భంలో ఇప్పటివరకు చేసిన ప్రయాణం ఇక చాలుననే భావాన్ని తెలియజేస్తుంది.
- source_word: סֹב
  choice: చుట్టూ తిరిగింది
  rationale: סבב ధాతువు ఇక్కడ ఒక ప్రాంతం చుట్టూ ప్రయాణించడాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం గతంగా కొనసాగిన చర్య ఇప్పుడు చాలుననే భావంతో సహజంగా కలుస్తుంది.
- source_word: הָהָר הַזֶּה
  choice: ఈ కొండ ప్రాంతం
  rationale: הַר ఒక కొండను లేదా పర్వత ప్రాంతాన్ని సూచించగలదు; ప్రయాణ సందర్భంలో విస్తృత భూభాగ భావం సరిపోతుంది.
- source_word: פְּנוּ
  choice: తిరగండి
  rationale: ప్రయాణ దిశను మార్చమనే బహువచన ఆజ్ఞను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָכֶם
  choice: తెలుగులో విడిగా అనువదించలేదు
  rationale: ఆజ్ఞ తరువాతి ఈ దత్తివ ప్రయోగాన్ని ‘మీ కోసం/మీకు’ అని విడిగా చేర్చితే తెలుగులో కృత్రిమంగా లేదా తప్పు భావంతో వినిపిస్తుంది; ‘తిరగండి’లో సంబోధితుల భావం సహజంగానే ఉంది.
- source_word: צָפֹנָה
  choice: ఉత్తరం వైపు
  rationale: దిశాసూచక ప్రత్యయం ఉత్తర దిశగా కదలడాన్ని సూచిస్తుంది; ‘ఉత్తరం వైపు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
