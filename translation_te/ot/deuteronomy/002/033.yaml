source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֛/הוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵ֑י/נוּ וַ/נַּ֥ךְ אֹת֛/וֹ וְ/אֶת בנ/ו וְ/אֶת כָּל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: te
  text: మన దేవుడైన యాహ్వే అతణ్ణి మనకు అప్పగించాడు[a]. మేము అతణ్ణీ, అతని కుమారులనూ[b], అతని ప్రజలందరినీ హతమార్చాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, ‘మన ఎదుట’; ఇక్కడ భావం, యాహ్వే అతణ్ణి ఇశ్రాయేలీయుల అధికారానికి అప్పగించాడని.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వ్యంజన పాఠాన్ని ‘అతని కుమారుడు’ అని చదవవచ్చు; మసొరా పఠన సంప్రదాయం దీనిని ‘అతని కుమారులు’గా చదువుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: అతణ్ణి మనకు అప్పగించాడు
  rationale: యుద్ధ సందర్భంలో נתן + לְפָנֵינוּ శత్రువును ఇశ్రాయేలీయుల అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘మన ఎదుట ఉంచాడు’ అనే అక్షరార్థం కంటే ఈ భావానువాదం సహజంగా, సందర్భానుకూలంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మొదటి పురుష బహువచన ప్రత్యయంతో ఉన్న రూపానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: וַנַּךְ
  choice: హతమార్చాము
  rationale: נכה అనే క్రియ ఈ యుద్ధ కథనంలో కేవలం కొట్టడాన్ని కాక ప్రాణాంతకంగా సంహరించడాన్ని సూచిస్తుంది; తరువాతి వచనంలోని సంపూర్ణ విధ్వంస సందర్భంతోనూ ఇది సరిపోతుంది.
- source_word: בנו
  choice: అతని కుమారులను
  rationale: లిఖిత వ్యంజన పాఠం ఏకవచనంగా చదవవచ్చు; అయితే మసొరా పఠన సంప్రదాయం మరియు సందర్భం బహువచనార్థాన్ని సమర్థిస్తాయి. పాఠభేదపు ఉద్రిక్తతను పాదటిప్పణిలో నిలిపాం.
- source_word: כָּל עַמּוֹ
  choice: అతని ప్రజలందరినీ
  rationale: עַם కు నేరమైన అర్థం ‘ప్రజలు’; ‘సైన్యం’ అని పరిమితం చేయకుండా మూలంలోని విస్తృత పదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: యుద్ధంలో దేవుని క్రియాశీల పాత్ర
  choice: యాహ్వే అతణ్ణి మనకు అప్పగించాడు
  alternative: అతడు మా చేతికి చిక్కాడు
  rationale: ఫలితాన్ని మాత్రమే చెప్పకుండా, మూలపాఠం దేవునికే ఆ అప్పగింపు చర్యను ఆపాదిస్తున్న theological tension ను యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘అతణ్ణి/అతణ్ణీ’ రూపాలు వాక్యప్రవాహాన్ని సహజంగా ఉంచుతాయి; ‘హతమార్చాము’ యుద్ధ సందర్భంలోని ప్రాణాంతక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
