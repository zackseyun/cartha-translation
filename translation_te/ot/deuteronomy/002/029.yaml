  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: te
  text: శేయీరులో నివసించే ఏశావు సంతతివారు, ఆరులో నివసించే మోయాబీయులు నాకు చేసినట్లే[a], మన దేవుడైన యాహ్వే మనకు ఇస్తున్న దేశంలోకి యొర్దాను దాటి వెళ్లేంతవరకు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నాతో వ్యవహరించినట్లే’; హీబ్రూలో అక్షరార్థంగా ‘నాకు చేసినట్లే’ అని ఉంది. సందర్భంలో ఇది ప్రయాణానికి అనుమతించడం, అవసరమైన సరఫరాలను ఇవ్వడం గురించి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: చేసినట్లే
  rationale: పోలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָשׂוּ לִי
  choice: నాకు చేసినట్లే
  rationale: హీబ్రూలోని విస్తృతమైన ‘నాకు చేశారు’ అనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది; సందర్భంలో ఇది ప్రయాణానికి అనుమతి, ఆహార సరఫరా గురించి సూచిస్తుంది.
- source_word: בְּנֵי עֵשָׂו
  choice: ఏశావు సంతతివారు
  rationale: అక్షరార్థమైన ‘ఏశావు కుమారులు’ ఇక్కడ ఒక జనసమూహాన్ని సూచిస్తుంది; ‘సంతతివారు’ ఆ వంశసంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: శేయీరులో నివసించే
  rationale: స్థిర నివాసాన్ని సూచించే ישב కృదంతానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וְהַמּוֹאָבִים
  choice: మోయాబీయులు
  rationale: జాతివాచక బహువచనాన్ని నేరుగా తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: ఆరులో నివసించే
  rationale: ముందున్న సమాంతర కృదంత నిర్మాణాన్ని నిలుపుతూ, ఆర్ అనే స్థలనామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: עַד אֲשֶׁר אֶעֱבֹר
  choice: దాటి వెళ్లేంతవరకు
  rationale: యొర్దాను సందర్భంలో עבר యొక్క ‘దాటడం’ అనే అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶת הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: నదిని సూచించే స్థిరమైన తెలుగు బైబిలు స్థలనామ రూపం; ‘నది’ సందర్భానుగతంగా అంతర్భూతం.
- source_word: אֶל הָאָרֶץ
  choice: దేశంలోకి
  rationale: సరిహద్దు దాటి లోపలికి ప్రవేశించే దిశను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: ప్రథమ పురుష బహువచన సంబంధాన్ని సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: נֹתֵן לָנוּ
  choice: మనకు ఇస్తున్న
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న/నిశ్చితమైన దాన భావాన్ని తెలుగులో వర్తమాన కొనసాగింపు రూపంతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తినామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; మూల ఉచ్చారణను సూచించేందుకు ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఈ వచనం ముందున్న అభ్యర్థనను కొనసాగిస్తున్నందున చివర దీర్ఘ విరామ సూచకం ఉంచబడింది.
