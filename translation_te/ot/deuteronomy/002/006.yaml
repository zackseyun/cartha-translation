  variant: modern standard Telugu
source:
  edition: WLC
  text: אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וַ/אֲכַלְתֶּ֑ם וְ/גַם מַ֜יִם תִּכְר֧וּ מֵ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וּ/שְׁתִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: te
  text: మీరు వారి వద్ద వెండితో ఆహారం కొని తినాలి; అలాగే వారి వద్ద వెండితో నీరు కూడా కొని తాగాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: ఇది సాధారణంగా తినదగిన పదార్థాలను లేదా ఆహార సరఫరాలను సూచిస్తుంది; ఈ సందర్భంలో ధాన్యానికే పరిమితం చేయకుండా ‘ఆహారం’ సహజంగా, విస్తృతంగా అర్థాన్ని అందిస్తుంది.
- source_word: תִּשְׁבְּרוּ
  choice: కొనాలి
  rationale: שׁבר ఇక్కడ ఆహారాన్ని ధర చెల్లించి పొందడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కొనాలి’ స్పష్టమైన సహజ సమానం.
- source_word: מֵאִתָּם
  choice: వారి దగ్గర
  rationale: ఈ ప్రయోగం వస్తువులు ఎవరి నుండి పొందాలో సూచిస్తుంది; ‘వారి దగ్గర’ సహజమైన తెలుగు వాడుకలో మూలాన్ని తెలియజేస్తుంది.
- source_word: בַּכֶּסֶף
  choice: వెండితో
  rationale: హీబ్రూ పదంలోని నిర్దిష్టమైన ‘వెండి’ భావాన్ని నిలుపుతూ, అది చెల్లింపు సాధనమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: וַאֲכַלְתֶּם
  choice: మీరు తినడానికి కావలసిన
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియారూపం ఇక్కడ కొనుగోలు అనంతర ఉద్దేశిత ఫలితాన్ని సూచించగలదు. తెలుగులో వాక్యాన్ని సహజంగా ఉంచడానికి ఈ భావాన్ని ముందున్న నామవాచకంతో అనుసంధానించాం.
- source_word: וְגַם
  choice: అలాగే ... కూడా
  rationale: ఆహారం గురించిన ఆజ్ఞకు సమాంతరంగా నీటి గురించిన రెండో ఆజ్ఞను జోడించే భావాన్ని నిలుపుతుంది.
- source_word: מַיִם
  choice: నీరు
  rationale: మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: תִּכְרוּ
  choice: కొనాలి
  rationale: כרה ఇతర సందర్భాల్లో ‘తవ్వు’ అని అర్థమివ్వగలిగినా, ‘వారి దగ్గర’ మరియు ‘వెండితో’ అనే వాణిజ్య సందర్భం వల్ల ఇక్కడ ధర చెల్లించి నీటిని పొందడమే భావం.
- source_word: וּשְׁתִיתֶם
  choice: మీరు తాగడానికి కావలసిన
  rationale: ఆహారం గురించిన సమాంతర నిర్మాణంలాగే, నీటిని కొనడంలోని ఉద్దేశిత ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఎదోమీయుల ఆహారం, నీటి విషయంలో ఆజ్ఞకున్న నైతిక మరియు న్యాయబద్ధమైన బలం
  choice: ఇశ్రాయేలీయులు ఆహారాన్నీ నీటినీ పరిహారం లేకుండా తీసుకోకుండా, వెండి చెల్లించి కొనాలి.
  alternative: క్రియల సమన్వయాన్ని మరింత అక్షరార్థంగా ‘కొని తినాలి ... కొని తాగాలి’ అని అనువదించవచ్చు.
  rationale: సందర్భంలోని ఆజ్ఞ వారి వనరులను స్వాధీనం చేసుకోవడం కాకుండా చెల్లించి పొందాలని స్పష్టం చేస్తుంది. ఉద్దేశం/ఫలితాన్ని తెలిపే తెలుగు నిర్మాణం అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞారూప శైలి. ‘డబ్బుతో’ కంటే మూలంలోని నిర్దిష్ట పదాన్ని నిలుపుటకు ‘వెండితో’ వాడబడింది. తెలుగు సహజత్వం కోసం ‘వారి దగ్గర’ ఎంచుకోబడింది.
