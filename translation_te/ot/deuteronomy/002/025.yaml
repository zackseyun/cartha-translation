translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ పదక్రమాన్ని బలవంతంగా అనుకరించకుండా దాని చిత్రాత్మకతను సాధ్యమైనంతవరకు నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉంచబడ్డాయి.
