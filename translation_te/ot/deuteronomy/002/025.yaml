- from: ఈ రోజే నేను ఆకాశమంతటి కింద ఉన్న ప్రజలందరిలో నీ గురించిన భయభీతులను కలిగించడం మొదలుపెడతాను. వారు నీ గురించిన వార్త విని[a], నీ ఎదుట వణికి, వేదనతో మెలికలు తిరుగుతారు[b].
  to: ఈ రోజే నేను ఆకాశాలన్నిటి కింద ఉన్న ప్రజలందరిమీద నీ పట్ల భయాన్నీ భీతినీ కలిగించడం మొదలుపెడతాను. వారు నీ గురించిన వార్త విని[a], నీ ఎదుట వణికి, వేదనతో మెలికలు తిరుగుతారు[b].
  rationale: The revision corrects the universal scope of ‘under all the heavens’ and replaces an awkward construction with a natural Telugu rendering that preserves the two Hebrew fear terms. The contextual ambiguity of מִפָּנֶיךָ is retained with ‘నీ ఎదుట.’ Footnote anchors and their lexical alternatives remain correctly matched to the relevant words.
