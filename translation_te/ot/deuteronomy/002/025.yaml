source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ תֵּ֤ת פַּחְדְּ/ךָ֙ וְ/יִרְאָ֣תְ/ךָ֔ עַל פְּנֵי֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָ֑יִם אֲשֶׁ֤ר יִשְׁמְעוּ/ן֙ שִׁמְעֲ/ךָ֔ וְ/רָגְז֥וּ וְ/חָל֖וּ מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: te
  text: ఈ రోజే నేను ఆకాశాలన్నిటి కింద ఉన్న ప్రజలందరిమీద నీ పట్ల భయాన్నీ భీతినీ కలిగించడం మొదలుపెడతాను. వారు నీ గురించిన వార్త విని[a], నీ ఎదుట వణికి, వేదనతో మెలికలు తిరుగుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ కీర్తి విని,’ లేదా ‘నీ గురించిన సమాచారం విని.’ హీబ్రూ పదం విన్న వార్తకూ, దానివల్ల ఏర్పడిన పేరుప్రఖ్యాతికీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తీవ్ర వేదన చెందుతారు,’ లేదా ‘ప్రసవవేదన పడుతున్న స్త్రీలా మెలికలు తిరుగుతారు.’ హీబ్రూ క్రియ తీవ్రమైన శారీరక వేదనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  choice: కలిగించడం మొదలుపెడతాను
  rationale: חלל హిఫిల్‌తో נתן క్రియావాచకం కలిసి ‘ఇవ్వడం/కలిగించడం ప్రారంభించు’ అనే భావాన్నిస్తాయి. ఆధునిక తెలుగులో భయానికి ‘కలిగించడం’ సహజంగా ఉంటుంది.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: నీ గురించిన భయభీతులను
  rationale: రెండు సమాంతర పదాల తీవ్రతను ‘భయభీతులు’ అనే జంటప్రయోగం నిలుపుతుంది; ఇది ఇశ్రాయేలు అనుభవించే భయం కాక, అతని కారణంగా ప్రజలకు కలిగే భయమని ‘నీ గురించిన’ స్పష్టం చేస్తుంది.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: ప్రజలందరిలో
  rationale: అక్షరార్థంగా ‘ప్రజల ముఖంపై’ అయినా, ఇక్కడ భయం ప్రజల మీదికి/వారిలోకి వ్యాపించడమే భావం. ‘ప్రజలందరిలో’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: ఆకాశమంతటి కింద ఉన్న
  rationale: ‘ఆకాశాలన్నిటి కింద’ అనే హీబ్రూ విశ్వవ్యాప్త నుడికారాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: వారు నీ గురించిన వార్త విని
  rationale: שֵׁמַע వార్త, సమాచారం, లేదా కీర్తి అనే భావాలను కలిగి ఉంటుంది. ప్రధాన పాఠంలో ‘వార్త’ మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: וְרָגְזוּ
  choice: వణికి
  rationale: భయంతో కంపించడం లేదా కలవరపడడం అనే క్రియాభావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְחָלוּ
  choice: వేదనతో మెలికలు తిరుగుతారు
  rationale: తీవ్రమైన శారీరక వేదనలో, ముఖ్యంగా ప్రసవవేదనలో, మెలికలు తిరిగే సజీవ చిత్రాన్ని నిలుపుతుంది; ప్రధాన పాఠం ప్రసవాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుట
  rationale: అక్షరార్థమైన ‘నీ సన్నిధి/ముఖం ఎదుట’ అనే స్థానిక-కారణార్థ అస్పష్టతను కొంతవరకు నిలుపుతుంది; ‘నీ కారణంగా’ అని పూర్తిగా కారణార్థానికే పరిమితం చేయదు.
