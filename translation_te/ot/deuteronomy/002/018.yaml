  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: te
  text: నీవు నేడు ఆరు వద్ద మోయాబు సరిహద్దును దాటుతున్నావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోయాబు సరిహద్దైన ఆరును.’ హీబ్రూ పాఠంలో ‘ఆరు’కు ముందు కర్మ సూచిక మళ్లీ వస్తుంది; కాబట్టి ‘ఆరు’ మోయాబు సరిహద్దు ప్రాంతాన్ని లేదా పట్టణాన్ని గుర్తించే సమానాధికార పదంగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: దాటుతున్నావు
  rationale: కర్తగా వాడిన ఏకవచన సర్వనామంతో కూడిన కాల్ వర్తమాన కృదంతం సందర్భంలో తక్షణంగా జరుగుతున్న చర్యను సూచిస్తుంది; తెలుగు వర్తమాన ప్రగతిశీల రూపం దాని భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: ‘ఈ రోజు’ అనే కాలార్థాన్ని తెలిపే సాధారణ క్రియావిశేషణం; ‘నేడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: ఇక్కడ మోయాబు ప్రాంతపు హద్దును సూచిస్తుంది; ‘సరిహద్దు’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: מוֹאָב
  choice: మోయాబు
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: עָר
  choice: ఆరు
  rationale: ఇది ఒక స్థలనామం; అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֶת ... אֶת
  choice: మోయాబు సరిహద్దును, అంటే ఆరును
  rationale: రెండుసార్లు వచ్చిన కర్మ సూచిక మొదట ‘మోయాబు సరిహద్దు,’ తరువాత ‘ఆరు’ను సూచిస్తుంది. రెండవది మొదటిదాన్ని సమానాధికారంగా గుర్తిస్తున్న అవకాశాన్ని ప్రధాన పాఠం నిలుపుతుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: హీబ్రూలో పురుష ఏకవచన సంబోధన; ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధించే మూలపాఠ రూపాన్ని తెలుగు ‘నీవు’ నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలుకు ఏకవచన సంబోధన
  choice: ‘నీవు’ అనే ఏకవచన రూపాన్ని వివరణాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: ‘ఇశ్రాయేలు ప్రజలారా, మీరు’ అని బహువచనంగా విస్తరించడం
  rationale: మూలపాఠం ఇశ్రాయేలును ఒక సమష్టి వ్యక్తిగా పురుష ఏకవచనంలో సంబోధిస్తుంది. ‘నీవు’ ఆ వాక్చాతుర్యాన్ని వ్యాఖ్యానాత్మక పదాలు చేర్చకుండా కాపాడుతుంది.
- issue: ‘ఆరు’కు ‘మోయాబు సరిహద్దు’తో ఉన్న వాక్యనిర్మాణ సంబంధం
  choice: ‘అంటే ఆరును’ అని సమానాధికార గుర్తింపుగా ప్రధాన పాఠంలో చూపడం
  alternative: ‘ఆరు దగ్గర మోయాబు సరిహద్దును’ అని భౌగోళిక స్థాన సంబంధంగా చూపడం
  rationale: రెండవ אֶת ‘ఆరు’ను ప్రత్యేక కర్మగా లేదా ముందున్న పదబంధానికి సమానాధికార వివరణగా చూపగలదు. ప్రధాన అనువాదం సమానాధికార పఠనాన్ని అనుసరిస్తుంది; స్థల సంబంధ పఠనాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఏకవచన సంబోధనను అలాగే ఉంచి, ‘ఆరు’తో ఉన్న నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
