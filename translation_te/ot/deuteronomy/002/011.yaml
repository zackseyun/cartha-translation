translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని అనుసరించాం. ప్రాచీన ప్రజావర్గాల పేర్లకు తెలుగు బహువచన వ్యక్తివాచక రూపాలను వాడాం; మూలంలోని వర్గీకరణ మరియు పేరుపెట్టడమనే తేడాను నిలిపాం.
