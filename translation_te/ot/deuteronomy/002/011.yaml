source:
  edition: WLC
  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: te
  text: వారు కూడా అనాకీయుల్లాగే రెఫాయీయులుగా[a] పరిగణించబడ్డారు; అయితే మోయాబీయులు వారిని ఏమీము అని పిలుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దైత్యులుగా.’ అయితే హీబ్రూ పదం ఇక్కడ ఒక ప్రాచీన ప్రజావర్గపు పేరును సూచించడం మరింత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: రెఫాయీయులు
  rationale: ఇక్కడ ఇది ప్రాచీన ప్రజావర్గపు పేరుగా సహజంగా అర్థమవుతుంది. అందువల్ల ‘దైత్యులు’ అని వ్యాఖ్యానాత్మకంగా అనువదించకుండా పేరును లిప్యంతరీకరించాం.
- source_word: יֵחָשְׁבוּ
  choice: పరిగణించబడ్డారు
  rationale: నిఫ్అల్ రూపంలోని కర్మణి భావాన్ని, ఒక వర్గానికి చెందినవారిగా భావించబడటాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַף הֵם
  choice: వారు కూడా
  rationale: ముందు ప్రస్తావించిన వర్గంలో వీరూ చేరుతారనే చేర్పు, ఉద్ఘాటన రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּעֲנָקִים
  choice: అనాకీయుల్లాగే
  rationale: כְּ ఉపసర్గ సూచించే పోలికను కాపాడుతూ, ప్రజావర్గపు పేరును తెలుగులో సహజంగా రూపాంతరం చేశాం.
- source_word: וְהַמֹּאָבִים
  choice: అయితే మోయాబీయులు
  rationale: వావ్ ఇక్కడ సాధారణ వర్గీకరణ నుంచి మోయాబీయులు వాడిన ప్రత్యేక పేరుకు మార్పును సూచిస్తుంది; ‘అయితే’ ఆ సంభాషణాత్మక వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִקְרְאוּ לָהֶם
  choice: వారిని ... అని పిలుస్తారు
  rationale: קרא ל అనే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు సమానార్థక నిర్మాణం.
- source_word: אֵמִים
  choice: ఏమీము
  rationale: మోయాబీయులు ఈ ప్రజలను పిలిచిన పేరుగా లిప్యంతరీకరించాం; మూలంలో నిర్దిష్ట ఉపపదం లేదు.
