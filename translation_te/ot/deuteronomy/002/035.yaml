id: DEU.2.35
reference: Deuteronomy 2:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֥ק הַ/בְּהֵמָ֖ה בָּזַ֣זְנוּ לָ֑/נוּ וּ/שְׁלַ֥ל הֶ/עָרִ֖ים אֲשֶׁ֥ר לָכָֽדְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/035.yaml
  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: te
  text: పశువులను, అలాగే మేము స్వాధీనం చేసుకున్న పట్టణాల దోపుడుసొమ్మును మాత్రమే మనకోసం దోచుకున్నాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: మాత్రమే
  rationale: మునుపటి వచనంలో ప్రజలను పూర్తిగా నాశనం చేసిన దానికి భిన్నంగా, పశువులు మరియు ఇతర దోపుడుసొమ్ము మాత్రం ఉంచుకున్నారనే పరిమితిని సూచిస్తుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులను
  rationale: ఇక్కడ సాధారణంగా జంతువులు కాక, యుద్ధంలో దోపుడుసొమ్ముగా తీసుకున్న పెంపుడు పశువులు ఉద్దేశించబడ్డాయి.
- source_word: בָּזַזְנוּ לָנוּ
  choice: మన కోసం దోచుకున్నాం
  rationale: בזז అనే క్రియలో దోచుకోవడం అనే భావం ఉంది; לָנוּ వల్ల లబ్ధిదారు/ఆత్మార్థక భావం వచ్చి ‘మన కోసం’ అని అనువదించబడింది.
- source_word: וּשְׁלַל
  choice: దోపుడుసొమ్ముతో పాటు
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులను సూచిస్తుంది; ‘తో పాటు’ సమన్వయాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֶעָרִים
  choice: పట్టణాల
  rationale: עִיר కు సందర్భానుసారంగా పట్టణం లేదా నగరం అనే అర్థం ఉంది; ఈ కథనంలో ‘పట్టణాలు’ సహజంగా ఉంది.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: మేము పట్టుకున్న
  rationale: לכד సైనిక సందర్భంలో పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అని అర్థం; పట్టణాలకు సంబంధించి ‘పట్టుకున్న’ స్పష్టంగా, సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి పాటించబడింది. హీబ్రూ వాక్యంలో ‘మాత్రమే’ ప్రధానంగా పశువులను పరిమితం చేస్తున్న నిర్మాణాన్ని నిలుపుతూ, పట్టణాల దోపుడుసొమ్మును సమన్వయ పదబంధంగా ఇచ్చాం.
