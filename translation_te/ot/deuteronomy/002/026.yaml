id: DEU.2.26
reference: Deuteronomy 2:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: te
  text: 'అప్పుడు నేను కెదేమోతు అరణ్యం నుండి హెష్బోను రాజైన సీహోనుకు శాంతి మాటలతో[a] దూతలను పంపి, ఇలా చెప్పాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శాంతి నిబంధనలతో.’ హీబ్రూలో అక్షరార్థంగా ‘శాంతి మాటలు’ అని ఉంది; ఇది శాంతియుతమైన దౌత్య ప్రతిపాదనను సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: అప్పుడు నేను ... పంపి
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘అప్పుడు’ దాని క్రమసూచక భావాన్ని సహజంగా తెలియజేస్తుంది. తరువాతి ఉల్లేఖన క్రియతో అనుసంధానించేందుకు ‘పంపి’ వాడబడింది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ దౌత్య సందర్భంలో ఇది పరలోక దూతలను కాకుండా మానవ సందేశవాహకులను సూచిస్తుంది; ‘దూతలు’ సహజమైన, విస్తృతంగా అర్థమయ్యే పదం.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: కెదేమోతు అరణ్యం నుండి
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘అరణ్యం’ తెలుగు బైబిలు భాషలో సహజంగా ఉండగా, కెదేమోతు స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֶל
  choice: '...కు'
  rationale: దౌత్య సందేశం అందుకునే వ్యక్తిని సూచించే దిశ/గ్రహీత భావాన్ని తెలుగు సంప్రదాన విభక్తి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: హెష్బోను రాజైన సీహోనుకు
  rationale: హీబ్రూ అన్వయాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా ఇచ్చి, రెండు పేర్లను లిప్యంతరీకరించాం.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: శాంతి మాటలతో
  rationale: అక్షరార్థమైన ‘శాంతి మాటలు’ అనే వ్యక్తీకరణను నిలిపి, అది శాంతియుత దౌత్య ప్రతిపాదనను సూచించే అవకాశం ఉన్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాను:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హీబ్రూ ఉల్లేఖన రూపాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
