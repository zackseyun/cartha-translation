translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని మొదటి పురుష వచనం, దౌత్య సందర్భం, ‘శాంతి మాటలు’ అనే ఉద్దేశపూర్వకంగా కొంత విస్తృతార్థం కలిగిన వ్యక్తీకరణ నిలుపబడ్డాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
