id: DEU.2.20
reference: Deuteronomy 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: te
  text: అది కూడా రెఫాయీయుల దేశంగా పరిగణించబడుతుంది[a]. పూర్వం రెఫాయీయులు[b] దానిలో నివసించారు; అయితే అమ్మోనీయులు వారిని జమ్జుమ్మీయులు అని పిలుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెఫాయీయుల భూమి.’
    reason: హీబ్రూ אֶרֶץ కు సందర్భానుసారం ‘దేశం’ లేదా ‘భూమి’ అని అనువదించవచ్చు; నిర్దిష్టతను తెలుగులో విడిగా సూచించాల్సిన అవసరం లేదు.
  - marker: b
    text: ‘రెఫాయీయులు’ అనే పేరు, సంప్రదాయంగా అసాధారణమైన పెద్ద దేహాకృతితో అనుసంధానించబడిన ఒక పురాతన ప్రజావర్గాన్ని సూచించవచ్చు; కొన్ని అనువాదాలు ఇక్కడ ‘దైత్యులు’ అని ఇస్తాయి.
    reason: రְפָאִים అనే జాతిపేరుకు ఉన్న వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని తెలియజేస్తూ, ప్రధాన పాఠ్యంలో మూలపేరును నిలుపుతుంది.
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: రెఫాయీయుల దేశం
  rationale: אֶרֶץ అంటే ‘దేశం/భూమి’; ఇక్కడ రְפָאִים ఒక ప్రజావర్గపు పేరుగా ఉంది. అందువల్ల దానిని ‘దైత్యుల దేశం’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, జాతిపేరును లిప్యంతరీకరించి సహజమైన తెలుగు సంబంధరూపంలో ఇచ్చాం.
- source_word: תֵּחָשֵׁב
  choice: పరిగణించబడుతుంది
  rationale: חשׁב క్రియ యొక్క నిఫాల్ రూపం ‘అలా భావించబడుట/లెక్కించబడుట’ అనే కర్మణి భావాన్ని తెలియజేస్తుంది; ‘పరిగణించబడుతుంది’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: אַף הִוא
  choice: అది కూడా
  rationale: ముందు ప్రస్తావించిన ప్రాంతాల చర్చలో ఈ దేశాన్ని కూడా చేర్చే సంధానార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רְפָאִים
  choice: రెఫాయీయులు
  rationale: సందర్భంలో ఇది ఒక పురాతన ప్రజావర్గపు పేరు. ‘దైత్యులు’ అని అనువదిస్తే ఒక వ్యాఖ్యాన సంప్రదాయాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచినట్లవుతుంది; కాబట్టి పేరును లిప్యంతరీకరించాం.
- source_word: יָשְׁבוּ בָהּ
  choice: దానిలో నివసించారు
  rationale: ישׁב ఇక్కడ ఒక ప్రాంతంలో నివసించడాన్ని సూచిస్తుంది. ‘నివసించారు’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: לְפָנִים
  choice: పూర్వకాలంలో
  rationale: ఇది గతంలోని మునుపటి కాలాన్ని సూచించే అవ్యయం; ‘పూర్వకాలంలో’ ఆ కాలసూచనను సహజంగా తెలియజేస్తుంది.
- source_word: וְהָעַמֹּנִים
  choice: అయితే అమ్మోనీయులు
  rationale: వావ్‌ను ఇక్కడ కేవలం ‘మరియు’గా కాక, వర్ణకుడు ఉపయోగించిన పేరు నుంచి అమ్మోనీయుల వాడుకపేరుకు వచ్చే వ్యత్యాసాన్ని చూపే ‘అయితే’గా ఇచ్చాం.
- source_word: יִקְרְאוּ לָהֶם
  choice: వారిని ... అని పిలుస్తారు
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ అలవాటైన లేదా ప్రాచుర్యంలో ఉన్న పేరుపెట్టడాన్ని సూచిస్తుంది; తెలుగు వర్తమాన వాడుకరూపం దాన్ని సహజంగా అందిస్తుంది.
- source_word: זַמְזֻמִּים
  choice: జంజుమ్మీయులు
  rationale: ఇది ఒక ప్రజావర్గపు పేరు. హీబ్రూ వ్యంజనాలు మరియు తెలుగు బైబిలు పేర్ల రూపనిర్మాణానికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: רְפָאִים అనే పదం ప్రజావర్గపు పేరా, ‘దైత్యులు’ అనే వర్ణనా?
  choice: ప్రధాన పాఠ్యంలో ‘రెఫాయీయులు’ అనే ప్రజావర్గపు పేరును ఉంచడం
  alternative: ‘దైత్యులు’ అని అనువదించడం
  rationale: ఈ వాక్యంలో రְפָאִים, זַמְזֻמִּים అనే ప్రత్యామ్నాయ ప్రజాపేరుతో సరిపోల్చబడుతోంది. వారి అసాధారణ దేహాకృతితో ఉన్న సంప్రదాయ అనుబంధాన్ని పాదటీపులో తెలియజేయడం ద్వారా మూలంలోని జాతిపేరు మరియు దాని వ్యాఖ్యాన అనిశ్చితి రెండూ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘పరిగణించబడుతుంది’ అనే కర్మణి రూపం మూలంలోని నిఫాల్‌ను నిలుపుతుంది. పురాతన ప్రజాపేర్లను తెలుగులో బహువచన ప్రజావర్గ రూపాలుగా ‘రెఫాయీయులు,’ ‘అమ్మోనీయులు,’ ‘జంజుమ్మీయులు’ అని ఇచ్చాం.
