revisions:
- from: అది కూడా రెఫాయీయుల దేశంగా పరిగణించబడుతుంది[a]. పూర్వకాలంలో రెఫాయీయులు[b] దానిలో నివసించారు; అయితే అమ్మోనీయులు వారిని జంజుమ్మీయులు అని పిలుస్తారు.
  to: అది కూడా రెఫాయీయుల దేశంగా పరిగణించబడుతుంది[a]. పూర్వం రెఫాయీయులు[b] దానిలో నివసించారు; అయితే అమ్మోనీయులు వారిని జమ్జుమ్మీయులు అని పిలుస్తారు.
