  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: te
  text: “నీ దేశం గుండా నన్ను వెళ్లనివ్వు. నేను మార్గంలోనే వెళ్తాను[a]. కుడివైపుగానీ ఎడమవైపుగానీ తిరగను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మార్గంలో, మార్గంలో.” ఈ ఉద్ఘాటనాత్మక పునరుక్తి ఇశ్రాయేలీయులు నిర్ణీత మార్గాన్ని ఏమాత్రం విడవకుండా వెళ్తారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: నన్ను వెళ్లనివ్వు
  rationale: עבר ధాతువు యొక్క Qal cohortative రూపం ఈ దౌత్యపూర్వక సందర్భంలో మర్యాదతో చేసిన అభ్యర్థనను సూచిస్తుంది; తెలుగులో ‘నన్ను వెళ్లనివ్వు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְאַרְצֶךָ
  choice: నీ దేశం గుండా
  rationale: עבר తర్వాత ב ఉపసర్గ ప్రదేశం లోపల ఉండడాన్ని కాక, ఆ భూభాగం గుండా ప్రయాణించడాన్ని సూచిస్తుంది.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: రహదారినే అనుసరించి
  rationale: ‘మార్గంలో, మార్గంలో’ అనే పునరుక్తి నిర్ణీత మార్గాన్ని ఏమాత్రం విడవకుండా ప్రయాణిస్తామనే ఉద్ఘాటన. ‘రహదారినే అనుసరించి’ తెలుగులో ఆ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֵלֵךְ
  choice: వెళ్తాను
  rationale: הלך ఇక్కడ ప్రయాణాన్ని తెలిపే సాధారణ క్రియ; ‘వెళ్తాను’ స్పష్టమైన ఆధునిక తెలుగు సమానం.
- source_word: לֹא אָסוּר
  choice: తిరగను
  rationale: סור అంటే మార్గం నుంచి పక్కకు తిరగడం లేదా తొలగడం. వెంట వచ్చే దిశల ప్రస్తావనతో ‘తిరగను’ సహజంగా సరిపోతుంది.
- source_word: יָמִין וּשְׂמֹאול
  choice: కుడివైపుగానీ ఎడమవైపుగానీ
  rationale: ఏ దిశలోనూ మార్గం విడవబోమనే స్థిర దిశాసూచక ప్రయోగాన్ని ఈ రూపం స్పష్టంగా నిలుపుతుంది.
