translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దౌత్య అభ్యర్థనగా అనువదించబడింది. మూలంలోని మార్గం-మార్గం పునరుక్తి భావాన్ని ప్రధాన పాఠంలో ‘రహదారినే’ ద్వారా, రూపాన్ని పాదసూచికలో నిలిపాం.
