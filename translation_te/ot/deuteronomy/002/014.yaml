- from: మేము కాదేషు-బర్నేయ నుండి ప్రయాణం మొదలుపెట్టి జెరెదు వాగును[a] దాటే వరకు ముప్పై ఎనిమిది సంవత్సరాలు గడిచాయి. యాహ్వే వారికి ప్రమాణం చేసినట్లే, యుద్ధం చేసే పురుషుల ఆ తరమంతా శిబిరం మధ్యనుండి అంతరించిపోయే వరకు ఆ కాలం గడిచింది.
