language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: te
  text: కాదేషు-బర్నేయ నుండి జెరెదు వాగును[a] దాటే వరకు మేము ప్రయాణించిన కాలం ముప్పై ఎనిమిది సంవత్సరాలు; యాహ్వే వారికి ప్రమాణం చేసినట్లే, యుద్ధం చేసే పురుషుల ఆ తరమంతా శిబిరం మధ్యనుండి అంతరించిపోయే వరకు ఆ కాలం కొనసాగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జెరెదు ఎండవాగు’ లేదా ‘జెరెదు వాగుపాత్ర’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగును, దాని పాత్రను, లేదా చిన్న ప్రవాహాన్ని సూచించగలదు.
    reason: నַחַל అనే పదంలోని భౌగోళిక మరియు అర్థ వైవిధ్యాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: ఆ కాలం / ముప్పై ఎనిమిది సంవత్సరాలు గడిచాయి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆ రోజులు’ ఉన్నా, ఇక్కడ ప్రయాణానికి పట్టిన వ్యవధిని సూచిస్తుంది. తెలుగులో ‘కాలం’ మరియు ‘సంవత్సరాలు గడిచాయి’ సహజంగా అదే భావాన్ని అందిస్తాయి.
- source_word: הָלַכְנוּ
  choice: మేము ... ప్రయాణం మొదలుపెట్టి
  rationale: ప్రయాణ వర్ణనలో הלך నడకను మాత్రమే కాక ఒక ప్రాంతం నుండి సాగిపోవడాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం ప్రారంభస్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: కాదేషు-బర్నేయ నుండి
  rationale: హీబ్రూ స్థలనామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: దాటే వరకు
  rationale: నీటిప్రవాహం లేదా లోయను దాటడాన్ని עבר ఇక్కడ సహజంగా సూచిస్తుంది.
- source_word: נַחַל זֶרֶד
  choice: జెరెదు వాగు
  rationale: נחל అనేది వాగు, కాలానుగుణంగా నీరు ప్రవహించే వాగుపాత్ర, లేదా చిన్న ప్రవాహాన్ని సూచించగలదు. ‘వాగు’ సాధారణ తెలుగు పాఠకులకు స్పష్టంగా ఉండి మూలంలోని విస్తృత అర్థాన్ని అతిగా కుదించదు.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: ముప్పై ఎనిమిది సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యకు సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: עַד תֹּם
  choice: అంతరించిపోయే వరకు
  rationale: תם ఇక్కడ పూర్తిగా ముగియడాన్ని సూచిస్తుంది; సందర్భంలో ఆ తరం శిబిరంలో ఇక మిగలకుండా మరణించడమే భావం. కర్తను అదనంగా నిర్దేశించకుండా క్రియను అకర్మకంగా ఉంచింది.
- source_word: כָּל הַדּוֹר
  choice: ఆ తరమంతా
  rationale: మొత్తం తరాన్ని సూచించే సహజమైన సమష్టి తెలుగు వ్యక్తీకరణ.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధం చేసే పురుషులు
  rationale: ‘యుద్ధపు పురుషులు’ అనే హీబ్రూ భావాన్ని తెలుగులో అర్థమయ్యేలా ఇస్తూ, మూలంలోని స్పష్టమైన పురుష సూచనను నిలుపుతుంది.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: శిబిరం మధ్యనుండి
  rationale: קֶרֶב లోని ‘మధ్య/లోపల’ భావాన్ని నిలుపుతూ వారు శిబిర ప్రజలలోనుండి తొలగిపోయినట్లు తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: యాహ్వే వారికి ప్రమాణం చేసినట్లే
  rationale: దైవనామాన్ని పేరుగానే లిప్యంతరీకరించి, נשבע లోని ప్రమాణ భాషను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రత్యక్షంగా అందించింది.
- issue: אַנְשֵׁי הַמִּלְחָמָה లోని లింగ సూచన
  choice: యుద్ధం చేసే పురుషులు
  alternative: యోధులు
  rationale: హీబ్రూ పదబంధం స్పష్టంగా పురుషులను సూచిస్తుంది; లింగతటస్థమైన రూపంతో ఆ వివరాన్ని తొలగించలేదు.
- issue: תם సూచించే ముగింపు స్వభావం
  choice: అంతరించిపోయే వరకు
  alternative: వారిని అంతమొందించే వరకు
  rationale: హీబ్రూ రూపం తరం పూర్తిగా ముగిసిందని చెబుతుంది గాని ఈ వాక్యభాగంలో కర్తను వ్యాకరణపరంగా పేర్కొనదు; అందువల్ల అదనపు ప్రత్యక్ష కర్తను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, ‘వరకు’ అనే పునరావృత సంబంధాన్ని నిలుపుతూ వ్యవధి మరియు తరపు అంతం మధ్య బంధాన్ని కాపాడింది.
