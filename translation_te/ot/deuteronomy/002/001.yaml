  source_fidelity: హీబ్రూ వచనంలోని కథన క్రమం, మొదటి పురుష బహువచన క్రియలు, అరణ్యం వైపునకు దిశార్థం, యాహ్వే మోషేతో మాట్లాడిన ప్రకారం జరిగిన ప్రయాణం, శేయీరు పర్వతాన్ని అనేక రోజులు చుట్టి వెళ్లిన భావం అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘దిశ మార్చుకొని’ అనేది פנה యొక్క ‘తిరగడం/దిశ మార్చడం’ అనే భావాన్ని, మూలం నిర్దేశించని ‘వెనుదిరగడం’ భావాన్ని చేర్చకుండా అందిస్తుంది.
