id: DEU.2.1
reference: Deuteronomy 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/נֵּ֜פֶן וַ/נִּסַּ֤ע הַ/מִּדְבָּ֨רָ/ה֙ דֶּ֣רֶךְ יַם ס֔וּף כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/נָּ֥סָב אֶת הַר שֵׂעִ֖יר יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: te
  text: అప్పుడు మేము దిశ మార్చుకొని, యాహ్వే నాతో చెప్పినట్లే ఎర్ర సముద్రం[a] మార్గంలో అరణ్యం వైపు బయలుదేరాము. మేము శేయీరు పర్వతం చుట్టూ చాలా రోజులు తిరిగాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెల్ల సముద్రం.’ హీబ్రూ పేరు ‘యామ్ సూఫ్’ను మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: అప్పుడు మేము దిశ మార్చుకొని
  rationale: פנה అనే క్రియ ఇక్కడ ప్రయాణ దిశను మార్చుకోవడాన్ని సూచిస్తుంది. మూలంలో తప్పనిసరిగా లేని ‘వెనుదిరిగాము’ అనే భావాన్ని జోడించకుండా, కథన క్రమాన్ని ‘అప్పుడు’తో నిలిపింది.
- source_word: וַנִּסַּע
  choice: బయలుదేరాము
  rationale: ప్రయాణ సందర్భంలో נסע శిబిరాన్ని ఎత్తి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరాము’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యం వైపు
  rationale: పదాంతంలోని directional he అరణ్యం దిశగా కదలికను సూచిస్తుంది; ‘వైపు’ ఆ దిశార్థాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: דֶּרֶךְ יַם סוּף
  choice: ఎర్ర సముద్రం[a] మార్గంలో
  rationale: דֶּרֶךְ ఇక్కడ ప్రయాణ మార్గాన్ని సూచిస్తుంది. יַם סוּף‌కు సంప్రదాయ భౌగోళిక పేరు ‘ఎర్ర సముద్రం’ ప్రధాన పాఠ్యంలో ఉంచి, మరింత అక్షరార్థ అనువాదాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: యాహ్వే నాతో చెప్పినట్లే
  rationale: כַּאֲשֶׁר‌లోని పోలికను, నొక్కిచెప్పే భావాన్ని ‘చెప్పినట్లే’ సహజంగా వ్యక్తం చేస్తుంది; דִּבֶּר אֵלָי అంటే ‘నాతో చెప్పాడు/మాట్లాడాడు.’
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణ ‘యాహ్వే’గా ఉంచాం.
- source_word: וַנָּסָב
  choice: చుట్టూ ... తిరిగాము
  rationale: סבב ఇక్కడ ఒక ప్రాంతం లేదా పర్వతం చుట్టూ ప్రయాణించడాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా విడదీసి సహజంగా అనువదించాం.
- source_word: אֶת הַר שֵׂעִיר
  choice: శేయీరు పర్వతం
  rationale: הַר అనే పదానికి ఇక్కడ భౌగోళిక నామంలో ‘పర్వతం’ సరైన సమానార్థకం; שֵׂעִירను ‘శేయీరు’గా లిప్యంతరీకరించాం.
- source_word: יָמִים רַבִּים
  choice: చాలా రోజులు
  rationale: కాలవ్యవధిని తెలిపే హీబ్రూ పదబంధాన్ని వ్యాఖ్యానాత్మకమైన ‘చాలా కాలం’గా మార్చకుండా, దాని రూపానికి దగ్గరగా అనువదించాం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ఒక బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని మొదటి పురుష బహువచన దృష్టికోణం, ప్రయాణ క్రమం, దిశార్థం నిలిపాం; అనవసరంగా ‘వెనుదిరిగాము’ అనే భావాన్ని చేర్చలేదు.
