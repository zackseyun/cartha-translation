  yaml_path: translation/ot/deuteronomy/002/017.yaml
  text: Then Yahweh spoke to me[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] నాతో ఇలా పలికాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’; దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమకథన రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; అందువల్ల ‘అప్పుడు’ సహజంగా ఉంటుంది. דִּבֵּר అనే క్రియకు ‘మాట్లాడాడు’ అనేది మరింత రూపసామ్యమైనా, వెంట వచ్చే לֵאמֹרతో కూడిన వాక్యారంభ సూత్రాన్ని ఆధునిక తెలుగులో ‘ఇలా అన్నాడు’ అని సహజంగా వ్యక్తపరచవచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֵלַי
  choice: నాతో
  rationale: אֶל + ప్రథమ పురుష ఏకవచన ప్రత్యయం మాట ఎవరిని ఉద్దేశించి పలికిందో సూచిస్తుంది. తెలుగు మాటలాడే సందర్భంలో ‘నాతో అన్నాడు’ సహజమైన ప్రయోగం; ‘నాకు అన్నాడు’ కూడా సాధ్యమే.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: ఈ క్రియానామ రూపం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో దాని కార్యాన్ని ‘ఇలా’ అనే పదంతో సహజంగా చూపించాం; ప్రధాన క్రియతో కలిపి ‘ఇలా అన్నాడు’ అయింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచాం. ఉచ్చారణ పునర్నిర్మాణానికి దగ్గరైన ‘యాహ్వే’ సాధ్యమైన ప్రత్యామ్నాయం; అయితే ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తుపట్టే లిప్యంతరీకరణగా ‘యెహోవా’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా, సాధారణ పాఠకుడికి సహజంగా రూపొందించాం. మూలంలోని ద్వంద్వ వాక్యారంభ నిర్మాణాన్ని పదేపదే అనుకరించకుండా, దాని భావకార్యాన్ని ‘ఇలా అన్నాడు’ ద్వారా నిలిపాం.
