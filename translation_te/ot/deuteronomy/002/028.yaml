id: DEU.2.28
reference: Deuteronomy 2:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֹ֣כֶל בַּ/כֶּ֤סֶף תַּשְׁבִּרֵ֨/נִי֙ וְ/אָכַ֔לְתִּי וּ/מַ֛יִם בַּ/כֶּ֥סֶף תִּתֶּן לִ֖/י וְ/שָׁתִ֑יתִי רַ֖ק אֶעְבְּרָ֥ה בְ/רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: te
  text: నేను తినడానికి ఆహారాన్ని నాకు డబ్బుకు అమ్మండి, తాగడానికి నీటిని కూడా నాకు డబ్బుకు ఇవ్వండి; నేను కాలినడకన దాటిపోవడానికి మాత్రమే నన్ను అనుమతించండి—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: ఇక్కడ ఈ పదం ధాన్యం లేదా రొట్టెకు మాత్రమే పరిమితం కాకుండా సాధారణంగా తినే పదార్థాన్ని సూచిస్తుంది.
- source_word: בַּכֶּסֶף
  choice: డబ్బుకు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వెండికి/వెండితో’ ఉంది; ఆధునిక తెలుగులో చెల్లింపును సహజంగా తెలియజేయడానికి ‘డబ్బుకు’ అనువైనది.
- source_word: תַּשְׁבִּרֵנִי
  choice: నాకు అమ్మవచ్చు
  rationale: ఈ సందర్భంలో שׁבר హిఫీల్ రూపం ఆహారాన్ని అమ్మడాన్ని సూచిస్తుంది; వాక్యం వినయపూర్వక అభ్యర్థనగా ఉన్నందున ఈ రూపం సరిపోతుంది.
- source_word: וְאָכַלְתִּי
  choice: తినడానికి
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియ ఇక్కడ కోరిన చర్య యొక్క ఉద్దేశాన్ని లేదా ఫలితాన్ని తెలియజేస్తుంది.
- source_word: וּמַיִם
  choice: నీటిని
  rationale: మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: תִּתֶּן לִי
  choice: నాకు ఇవ్వవచ్చు
  rationale: נתן + ל నిర్మాణాన్ని నేరుగా తెలియజేస్తూ, ముందున్న అభ్యర్థన స్వరాన్ని కొనసాగిస్తుంది.
- source_word: וְשָׁתִיתִי
  choice: తాగడానికి
  rationale: ముందున్న తినే ప్రకటనలాగే, కోరిన చర్య యొక్క ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: רַק
  choice: మాత్రం
  rationale: అభ్యర్థనను ప్రధానమైన ఒక పరిమిత షరతుకు కుదించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶעְבְּרָה
  choice: దాటిపోనివ్వండి
  rationale: కోహోర్టేటివ్ రూపం ఈ సందర్భంలో అనుమతి కోరే వినయపూర్వక విజ్ఞప్తిని సూచిస్తుంది.
- source_word: בְרַגְלָי
  choice: కాలినడకన
  rationale: అక్షరార్థం ‘నా కాళ్లపై’; ‘కాలినడకన’ ఆధునిక తెలుగులో అదే ప్రయాణ విధానాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన విజ్ఞప్తి స్వరాన్ని నిలిపాం. ‘వెండికి’ అనే అక్షరానువాదం కంటే సందర్భానుకూలమైన ‘డబ్బుకు’ వాడాం; ‘నా కాళ్లపై’ అనే అసహజ రూపం బదులు ‘కాలినడకన’ వాడాం. చివరి దీర్ఘ విరామచిహ్నం వాక్యం తదుపరి వచనంలో కొనసాగుతుందనే భావాన్ని సూచిస్తుంది.
