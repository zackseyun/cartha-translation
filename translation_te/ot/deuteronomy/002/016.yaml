  text: And when all the men of war had finished dying from among the people,[a]
translation:
  language: te
  text: ప్రజల మధ్య నుండి యుద్ధం చేసే పురుషులందరూ చనిపోవడం పూర్తయినప్పుడు,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పోరాడే పురుషులు.’ హీబ్రూలో అక్షరాలా ‘యుద్ధపు పురుషులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: అప్పుడు / ఎప్పుడైతే అనే భావాన్ని ‘…అయినప్పుడు’లో సహజంగా కలిపి చెప్పడం
  rationale: ఈ పదబంధం కథనంలోని తదుపరి సంఘటనకు కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అది జరిగింది’ అని చేర్చకుండా ‘అయినప్పుడు’ అనడం సహజం.
- source_word: תַּמּוּ ... לָמוּת
  choice: చనిపోయి అంతమైనప్పుడు
  rationale: תמם క్రియతో ‘చనిపోవడానికి’ అనే క్రియారూపం కలిసి, ఆ వర్గం చనిపోవడం పూర్తయిందనే భావాన్ని ఇస్తుంది. ‘చనిపోయి అంతమయ్యారు’ అనే పదప్రయోగం సమాప్తి భావాన్ని నిలుపుతుంది.
- source_word: כָּל
  choice: అందరూ
  rationale: మూలంలోని సమగ్రతను స్పష్టంగా నిలుపుతుంది.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధ పురుషులు
  rationale: అక్షరార్థంగా ‘యుద్ధపు పురుషులు.’ పురుషలింగాన్ని, సైనిక భావాన్ని రెండింటినీ నిలుపుతూ, ప్రత్యామ్నాయ సహజ అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: מִקֶּרֶב הָעָם
  choice: ప్రజల మధ్యనుండి
  rationale: ఒక సమూహం మధ్యనుండి తొలగిపోవడాన్ని సూచించే మూలభాషా భావాన్ని నేరుగా, అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని ఉపయోగించాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామాను ఉంచాం; మూలంలోని చనిపోవడం పూర్తయిన భావాన్ని అతిగా సరళీకరించకుండా నిలిపాం.
