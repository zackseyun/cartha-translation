source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: te
  text: 'యహ్వే నాతో ఇలా అన్నాడు: “మోయాబును వేధించవద్దు; వారితో యుద్ధానికి దిగవద్దు.[a] దాని దేశంలో ఏ భాగాన్నీ నీకు స్వాస్థ్యంగా[b] ఇవ్వను. ఎందుకంటే ఆర్‌ను లోతు కుమారులకు స్వాస్థ్యంగా ఇచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మోయాబును ఇబ్బంది పెట్టవద్దు; వారితో యుద్ధం రేపవద్దు.”'
    reason: צרר యొక్క శత్రుత్వపూర్వక ఒత్తిడి భావాన్నీ, התגר בם מלחמה యొక్క వారితో యుద్ధ ఘర్షణను రేపడం/తలపడడం అనే ప్రత్యామ్నాయ సూక్ష్మార్థాన్నీ చూపడానికి.
  - marker: b
    text: 'లేదా: “వారసత్వంగా.” ఈ వచనంలోని ‘స్వాస్థ్యంగా’ అనే రెండు ప్రయోగాలకూ ఇది వర్తిస్తుంది.'
    reason: יְרֻשָּׁה స్వాధీన ఆస్తి మరియు వారసత్వం అనే పరస్పరం మిళితమైన భావాలను కలిగి ఉండటాన్ని నిలుపుకోవడానికి.
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ధ్వన్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: మోయాబును వేధించవద్దు
  rationale: צרר ఇక్కడ పూర్తిస్థాయి యుద్ధానికి ముందు ఉండే శత్రుత్వపూర్వక ఒత్తిడి లేదా వేధింపును సూచిస్తుంది; ‘వేధించవద్దు’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: వారితో యుద్ధానికి దిగవద్దు
  rationale: ఈ ప్రయోగం వారిపై యుద్ధాన్ని రేపడం లేదా వారితో సైనిక ఘర్షణలో ప్రవేశించడం అనే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని వాడి, ప్రత్యామ్నాయ సూక్ష్మార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מֵאַרְצוֹ
  choice: దాని దేశంలో ఏ భాగాన్నీ
  rationale: ఏకవచన ప్రత్యయం మోయాబును ఒక జాతీయ సమూహంగా సూచిస్తుంది; מִן యొక్క భాగార్థాన్ని ‘ఏ భాగాన్నీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְרֻשָּׁה
  choice: స్వాస్థ్యంగా
  rationale: కేటాయింపుగా లభించి స్వాధీనంలో ఉండే ఆస్తి లేదా వారసత్వ భూభాగం అనే భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: לִבְנֵי לוֹט
  choice: లోతు కుమారులకు
  rationale: హీబ్రూ వచనంలోని వంశావళి రూపమైన ‘లోతు కుమారులు’ అనే మాటను నిలుపుకున్నాం; సందర్భంలో ఇది అతని సంతతిని కూడా సూచించగలదు.
- source_word: עָר
  choice: ఆర్
  rationale: మోయాబుతో సంబంధమున్న స్థల నామాన్ని తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
theological_decisions:
- issue: దైవ నామం יְהוָה యొక్క అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: יְרֻשָּׁה లోని స్వాధీనత–వారసత్వ భావసమ్మేళనం
  choice: స్వాస్థ్యంగా
  alternative: వారసత్వంగా; స్వాధీన ఆస్తిగా
  rationale: ఈ పదం కేవలం ప్రస్తుత స్వాధీనాన్ని మాత్రమే కాక కేటాయింపుగా లభించిన వారసత్వ ఆస్తిని కూడా సూచించగలదు. ప్రధాన పాఠంలో రెండింటినీ సహజంగా మేళవించే పదాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్య నిర్మాణాన్ని వాడాం. మోయాబు అనే సమూహ నామానికి అనుగుణంగా మొదట ఏకవచన రూపం (‘మోయాబును’, ‘దాని’), తరువాత ప్రజలను సూచించే బహువచన రూపం (‘వారితో’) నిలిపాం. మూలంలోని నిషేధాల సమాంతర నిర్మాణాన్ని అర్ధవిరామంతో స్పష్టంగా చూపించాం.
