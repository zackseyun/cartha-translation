  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: te
  text: ఆ సమయంలో అతని పట్టణాలన్నిటినీ మేము స్వాధీనం చేసుకున్నాం. ప్రతి పట్టణాన్నీ—అందులోని పురుషులను, స్త్రీలను, చిన్నపిల్లలను—నిర్మూలనకు అంకితం చేశాం.[a] ప్రాణాలతో మిగిలినవారెవరినీ విడిచిపెట్టలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియ హేరెం భావాన్ని తెలియజేస్తుంది—అంటే ఒకదాన్ని నిర్మూలన కోసం ప్రత్యేకంగా అంకితం చేయడం. దీనిని “పూర్తిగా నాశనం చేశాం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: స్వాధీనం చేసుకున్నాం
  rationale: לכד అనే సైనిక క్రియ పట్టణాన్ని పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం సూచిస్తుంది. ఆధునిక తెలుగు సందర్భంలో ‘స్వాధీనం చేసుకున్నాం’ సహజంగా ఉండి యుద్ధ నేపథ్యాన్ని నిలుపుతుంది.
- source_word: כָּל עָרָיו
  choice: అతని పట్టణాలన్నిటినీ
  rationale: עיר పట్టణం లేదా నగరం అనే అర్థం ఇవ్వగలదు. ఈ ప్రాచీన యుద్ధ సందర్భంలో ‘పట్టణాలు’ సహజం; כָּל యొక్క సమగ్రతను ‘అన్నిటినీ’ తెలియజేస్తుంది.
- source_word: בָּעֵת הַהִוא
  choice: ఆ సమయంలో
  rationale: కాలాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో సూచించే రూపం.
- source_word: וַנַּחֲרֵם
  choice: నిర్మూలనకు అంకితం చేశాం
  rationale: חרם హిఫిల్ రూపం సాధారణ నాశనం కంటే, ఒకదాన్ని ప్రత్యేకంగా నిర్మూలనకు అప్పగించే సాంకేతిక-పవిత్ర భావాన్ని కలిగి ఉంది. ఈ అనువాదం ఆ భావాన్ని చదవదగిన తెలుగులో నిలుపుతుంది.
- source_word: כָּל עִיר מְתִם
  choice: పురుషులతో పాటు ... నివాసమున్న ప్రతి పట్టణాన్నీ
  rationale: మసొరెటిక్ పాఠంలోని మְתִם ‘పురుషులు/మగవారు’ అని సూచించే సంక్షిప్త నిర్మాణం. దాని లింగ నిర్దిష్టతను ‘పురుషులు’గా నిలుపుతూ, పట్టణం నివాసులతో కూడినదనే భావాన్ని వాక్య నిర్మాణంలో స్పష్టం చేసింది.
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: స్త్రీలను, చిన్నపిల్లలను
  rationale: రెండు పదాల ప్రత్యేక సూచనను నిలుపుతుంది; טף చిన్న పిల్లలు లేదా చిన్న వయసు ఆధారితులను సూచిస్తుంది.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: ప్రాణాలతో మిగిలినవారెవరినీ విడిచిపెట్టలేదు
  rationale: שָׂרִיד యుద్ధ సందర్భంలో ప్రాణాలతో మిగిలిన వ్యక్తిని సూచిస్తుంది. ఈ రూపం ‘ఎవరూ బతికి మిగలలేదు’ అనే భావాన్ని స్పష్టమైన సహజ తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: జయాపజయ వర్ణనలో חרם పదప్రయోగం
  choice: నిర్మూలనకు అంకితం చేశాం
  alternative: పూర్తిగా నాశనం చేశాం; శాపితంగా విడిచిపెట్టాం
  rationale: మూలపాఠంలోని חרם కేవలం తీవ్ర నాశనాన్ని మాత్రమే కాక, నిర్మూలన కోసం ప్రత్యేకంగా అప్పగించే సాంకేతిక భావాన్ని కలిగి ఉంది. ఎంపిక చేసిన రూపం హింసను మృదువుచేయకుండా, తరువాతి సిద్ధాంత వివరణను కూడా చేర్చకుండా ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: מְתִם లోని లింగ నిర్దిష్టత
  choice: పురుషులతో పాటు స్త్రీలను, చిన్నపిల్లలను
  alternative: ప్రజలను, స్త్రీలను, పిల్లలను
  rationale: హీబ్రూ పాఠం పురుషులు, స్త్రీలు, చిన్నపిల్లలను వేరువేరుగా సూచిస్తుంది. సాధారణ ‘ప్రజలు’గా మార్చకుండా ఈ భేదాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. חרם యొక్క సాంకేతిక భావాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది. మూలంలోని పురుషులు–స్త్రీలు–చిన్నపిల్లలు అనే స్పష్టమైన జాబితాను నిలిపింది.
