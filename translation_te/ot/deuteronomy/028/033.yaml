id: DEU.28.33
reference: Deuteronomy 28:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פְּרִ֤י אַדְמָֽתְ/ךָ֙ וְ/כָל יְגִ֣יעֲ/ךָ֔ יֹאכַ֥ל עַ֖ם אֲשֶׁ֣ר לֹא יָדָ֑עְתָּ וְ/הָיִ֗יתָ רַ֛ק עָשׁ֥וּק וְ/רָצ֖וּץ כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: te
  text: నీకు తెలియని ఒక జనాంగం నీ భూమి ఫలాన్ని[a], నీ శ్రమ ఫలమంతటినీ[b] తినివేస్తుంది; నీ రోజులన్నిటా నీవు అణచివేతకు గురై నలిగిపోయినవాడివే ఉంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ భూమి పంటను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ శ్రమనంతటినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: నీ నేల ఫలాన్ని
  rationale: వ్యవసాయ దిగుబడిని సూచించే ‘నేల ఫలం’ అనే స్పష్టమైన రూపాన్ని నిలుపుతుంది; ‘అదామా’ను సందర్భానుసారంగా ‘నేల’గా అనువదించింది.
- source_word: כָל יְגִיעֲךָ
  choice: నీ శ్రమ ఫలాన్నంతటినీ
  rationale: יְגִיעַ శ్రమను లేదా శ్రమవల్ల వచ్చిన సంపాదనను సూచించగలదు. ‘తింటారు’ అనే క్రియతో తెలుగులో సహజంగా ఉండేందుకు శ్రమ ఫలితాన్ని వ్యక్తం చేస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: יֹאכַל
  choice: తింటారు
  rationale: సాధారణ ‘తిను’ అనే అర్థాన్నే నిలిపి, మూలంలో లేని ‘దోచుకుంటారు’ వంటి అదనపు భావాన్ని చేర్చలేదు.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: నీవు ఎరుగని ఒక ప్రజ
  rationale: తెలియని విదేశీ జనసమూహాన్ని సూచించే ఏకవచన సమూహనామ భావాన్ని, ידע లోని పరిచయ భావాన్ని కాపాడుతుంది.
- source_word: רַק עָשׁוּק וְרָצוּץ
  choice: అణచివేయబడి, నలగగొట్టబడుతూనే
  rationale: רַק సూచించే నిరంతర, మినహాయింపులేని దుస్థితిని ‘బడుతూనే’ ద్వారా సహజ తెలుగులో వ్యక్తం చేసింది; రెండు బాధాకర స్థితుల తీవ్రతను నిలిపింది.
- source_word: כָּל הַיָּמִים
  choice: నీ రోజులన్నిటిలో
  rationale: వ్యక్తిగత సంబోధనను, నిరంతర కాలవ్యాప్తిని యథాతథంగా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన ద్వితీయ పురుష సంబోధనతో గంభీరమైన శాపవాక్య ధోరణి నిలుపబడింది. ‘ప్రజ’ను సమూహ ఏకవచనంగా ఉంచినా, సహజ తెలుగు అన్వయానికి ‘తింటారు’ అనే గౌరవ/బహువచన క్రియ వాడబడింది.
