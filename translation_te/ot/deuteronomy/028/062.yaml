revisions:
- from: మీ దేవుడైన యెహోవా స్వరాన్ని మీరు వినలేదు కాబట్టి, మీరు ఆకాశ నక్షత్రాలంత విస్తారంగా ఉన్నప్పటికీ, మీలో అతి కొద్దిమంది మాత్రమే మిగిలిపోతారు.[a][b]
  to: మీరు ఆకాశంలోని నక్షత్రాలవలె అనేకులై ఉన్నప్పటికీ,[b] మీరు సంఖ్యలో కొద్దిమందిగా మాత్రమే మిగిలిపోతారు.[a] ఎందుకంటే మీరు మీ దేవుడైన యాహ్వే మాట వినలేదు.[c]
  rationale: The revision follows the Hebrew clause sequence, renders the numerical idiom directly, and uses the required POB form “యాహ్వే” for the Tetragrammaton. It retains the source’s contrast and covenantal listening idiom without forcing ‘obey’ into the main text. Footnotes are separated and anchored to their respective expressions.
