  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: te
  text: మీరు ఆకాశంలోని నక్షత్రాలవలె అనేకులై ఉన్నప్పటికీ,[b] మీరు సంఖ్యలో కొద్దిమందిగా మాత్రమే మిగిలిపోతారు.[a] ఎందుకంటే మీరు మీ దేవుడైన యాహ్వే మాట వినలేదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘కొద్దితనపు మనుషులు/వ్యక్తులు’; ఇది సంఖ్యలో చాలా కొద్దిగా మిగలడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు ఆకాశంలోని నక్షత్రాలవలె అనేకులై ఉండగా.’ హీబ్రూ పదబంధం గతంలోని విస్తార సంఖ్యకూ రాబోయే కొద్దితనానికీ మధ్య వ్యత్యాసాన్ని చూపిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, ‘యాహ్వే మీ దేవుని స్వరాన్ని వినలేదు.’ ఇది నిబంధన సందర్భంలో ఆయన మాటను ఆలకించి విధేయత చూపడం అనే భావాన్నీ కలిగిస్తుంది. చివరి క్రియ హీబ్రూలో ఇశ్రాయేలును సమష్టిగా సూచించే ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: మిగిలిపోతారు
  rationale: שׁאר నిఫల్ రూపం నష్టం లేదా తీర్పు తరువాత మిగిలి ఉండే ఫలితస్థితిని సూచిస్తుంది; ‘మిగిలిపోతారు’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: בִּמְתֵי מְעָט
  choice: మీలో అతి కొద్దిమంది మాత్రమే
  rationale: מתי מעט అనేది సంఖ్యాపరంగా చాలా కొద్దిమంది అనే నుడికారం; పురుషులకు మాత్రమే పరిమితం చేయకుండా సమూహపు తీవ్ర క్షీణతను తెలుపుతుంది.
- source_word: תַּחַת אֲשֶׁר
  choice: ఉన్నప్పటికీ
  rationale: గతంలోని విస్తార సంఖ్యకూ రాబోయే కొద్దితనానికీ మధ్యనున్న వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అయితే/కాగా’ అనే ప్రత్యామ్నాయ భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: הֱיִיתֶם
  choice: ఉన్నారు
  rationale: ఇక్కడ היה ఇశ్రాయేలు అప్పటికే పొందిన విస్తార స్థితిని సూచిస్తుంది; తెలుగు సందర్భంలో ‘ఉన్నారు’ సహజంగా ఆ పూర్వస్థితిని తెలియజేస్తుంది.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: ఆకాశ నక్షత్రాలంత విస్తారంగా
  rationale: నక్షత్రాల పోలికను, గొప్ప సంఖ్య అనే לָרֹב భావాన్ని కలిపి స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: స్వరాన్ని మీరు వినలేదు కాబట్టి
  rationale: ‘స్వరాన్ని వినడం’ అనే ద్వితీయోపదేశకాండ నిబంధనాత్మక పదచిత్రాన్ని కాపాడుతుంది; సందర్భంలో విధేయత చూపకపోవడం కూడా అంతర్భావంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన వ్యక్తినామ రూపంలో ప్రతిబింబిస్తుంది; దానిని కేవలం బిరుదుగా మార్చదు.
- source_word: אֱלֹהֶיךָ
  choice: మీ దేవుడైన
  rationale: ఏకవచన సమూహ సంబోధనను తెలుగు గౌరవ/సమూహ రూపమైన ‘మీ’ ద్వారా సహజంగా అందిస్తూ, యెహోవాతోనున్న నిబంధన సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తింపున్న ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: שׁמע בקול యొక్క భావవ్యాప్తి
  choice: స్వరాన్ని వినలేదు
  alternative: మాట వినలేదు / విధేయత చూపలేదు
  rationale: మూలంలోని ‘స్వరాన్ని వినడం’ అనే రూపకాన్ని నిలిపి, దానిలోని విధేయత భావాన్ని పాదసూచికలో వివరించాం; తద్వారా భావాన్ని ఒకే వివరణకు కుదించలేదు.
- issue: బహువచన సంబోధన నుంచి సమూహ ఏకవచనానికి మార్పు
  choice: తెలుగులో ‘మీరు’ రూపాన్ని కొనసాగించడం
  alternative: సంఖ్యామార్పును పదరూపంగా బలవంతంగా చూపించడం
  rationale: హీబ్రూలో చివరి ఉపవాక్యంలో ఇశ్రాయేలును సమష్టిగా ఉద్దేశించిన ఏకవచనం ఉంది. తెలుగులో ‘మీరు’ సమూహాన్ని సహజంగా సూచిస్తుంది; సంఖ్యామార్పును పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. శాపవాక్యంలోని సంఖ్యాపరమైన వ్యత్యాసం, నిబంధనాత్మక ‘స్వరాన్ని వినడం’ పదచిత్రం, సమూహ సంబోధన అన్నీ సంరక్షించబడ్డాయి.
