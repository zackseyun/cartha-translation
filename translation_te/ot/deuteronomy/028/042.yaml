  text: The cricket shall take possession of all your trees and the fruit of your ground[a].
translation:
  language: te
  text: కీచురాయి నీ చెట్లన్నిటినీ, నీ భూమిలోని పంటనంతటినీ స్వాధీనం చేసుకుంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
