    text: లేదా ‘మిడత,’ ‘గొల్లభామ,’ లేదా మరింత విస్తృతంగా ‘ఝంకారధ్వని చేసే పురుగు’; హీబ్రూ పదం צְלָצַל సూచించే పురుగు ఏదో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֵצְךָ
  choice: నీ చెట్లన్నిటినీ
  rationale: כָּל మొత్తం సముదాయాన్ని సూచిస్తుంది; వ్యవసాయ సందర్భంలో עֵץ చెట్లను సూచిస్తుంది. తెలుగు బహువచన రూపం సహజంగా ఉంది.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: నీ నేల పంటనంతటినీ
  rationale: פְרִי అంటే ఫలం లేదా దిగుబడి, אַדָמָה అంటే నేల. ఇక్కడ ‘నేల పంట’ వ్యవసాయ దిగుబడిని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తూ మూలంలోని నేల చిత్రణను నిలుపుతుంది.
- source_word: יְיָרֵשׁ
  choice: స్వాధీనం చేసుకుంటుంది
  rationale: ירשׁ యొక్క ప్రాథమిక భావం స్వాధీనం చేసుకోవడం లేదా మరొకరిని తొలగించి ఆక్రమించడం. కేవలం ‘తినివేస్తుంది’ అని మార్చకుండా మూలంలోని బలమైన ఆక్రమణ భావాన్ని నిలుపుతుంది.
- source_word: הַצְּלָצַל
  choice: ఝంకార పురుగు
  rationale: ఈ హీబ్రూ పురుగుపేరు యొక్క ఖచ్చితమైన జీవశాస్త్రీయ గుర్తింపు అనిశ్చితం; అది శబ్దాన్ని సూచించే పదంతో సంబంధం కలిగి ఉండవచ్చు. ఒక నిర్దిష్ట జాతిని నిశ్చయించకుండా, ధ్వని లక్షణాన్ని తెలిపే సాధారణ పదబంధం వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘స్వాధీనం చేసుకుంటుంది’ ద్వారా శాపవాక్యంలోని ఆక్రమణ భావం నిలుపబడింది; అనిశ్చిత పురుగు గుర్తింపును ప్రధాన పాఠం మరియు పాదసూచికలో పారదర్శకంగా తెలిపాం.
