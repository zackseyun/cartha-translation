id: DEU.28.10
reference: Deuteronomy 28:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: te
  text: అప్పుడు భూమిలోని ప్రజలందరూ యాహ్వే పేరు నీపై పిలువబడిందని[a] చూస్తారు; వారు నీకు భయపడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు యాహ్వే పేరుతో పిలువబడుతున్నావని.” హీబ్రూ నుడికారం అక్షరార్థంగా యాహ్వే పేరు “నీపై పిలువబడింది” అని చెబుతుంది; ఇది ఒడంబడికకు సంబంధించిన గుర్తింపును, నీవు ఆయనకు చెందినవాడవనే భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: అప్పుడు ... చూస్తారు
  rationale: ఆశీర్వాదాల పరంపరలో సంయోజకంతో వచ్చిన క్రియ ముందున్న వాగ్దానాల ఫలితాన్ని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ ఆ భావప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: భూమిలోని ప్రజలందరూ
  rationale: עַמִּים అనేక జనసమూహాలను సూచిస్తుంది; అంతర్జాతీయ సందర్భంలో הָאָרֶץను ‘భూమి’గా తీసుకోవడం ‘దేశం’ అనే పరిమిత అర్థం కంటే తగినది.
- source_word: שֵׁם יְהוָה
  choice: యెహోవా పేరు
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: נִקְרָא עָלֶיךָ
  choice: నీ మీద పిలువబడిందని
  rationale: దేవుని పేరు ఒకరి మీద పిలువబడటం అనే హీబ్రూ రూపకాన్ని కాపాడుతూ, ఆ వ్యక్తి దేవునికి చెందినవాడనే బహిరంగ గుర్తింపును సూచిస్తుంది.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: వారు నీకు భయపడతారు
  rationale: ఇక్కడ ירא యెహోవా అనుగ్రహం ఇశ్రాయేలుపై ఉందని చూసి కలిగే భయాన్ని సూచిస్తుంది. ‘భయపడతారు’ అనే పదం భీతి మరియు గౌరవభయాల మధ్య ఉన్న విస్తృత భావాన్ని అనవసరంగా కుదించదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచుతుంది; ఆధునిక తెలుగు బైబిలు పాఠకులకు ‘యెహోవా’ సుపరిచితమైన రూపం.
- issue: נִקְרָא עָלֶיךָ అనే నుడికారం
  choice: యెహోవా పేరు నీ మీద పిలువబడింది
  alternative: నీవు యెహోవా పేరుతో పిలువబడుతున్నావు
  rationale: ఇశ్రాయేలు యెహోవాకు చెందిన ప్రజగా గుర్తించబడుతున్నారనే అర్థాన్ని కలిగిన మూల రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; ప్రత్యామ్నాయం భావాన్ని స్పష్టం చేసినా వ్యాకరణ చిత్రాన్ని మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ఏకవచన ‘నీ’ మూలంలోని ఇశ్రాయేలును సమష్టిగా సంబోధించే రెండవ పురుష ఏకవచనాన్ని కాపాడుతుంది.
