id: DEU.28.35
reference: Deuteronomy 28:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: te
  text: యాహ్వే నీ మోకాళ్లపైనా పిక్కలపైనా,[a] నీ పాదతలం నుండి నీ తల శిఖరం వరకు నయం కాని తీవ్రమైన కురుపులతో నిన్ను కొడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాలి కింది భాగాలపై”; హీబ్రూ పదం మోకాలికి కింద ఉన్న కాలి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: నిన్ను కొడతాడు
  rationale: נכה హిఫీల్ రూపం నేరుగా ‘కొట్టు’ అనే బలమైన అర్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, దేవుని ప్రత్యక్ష చర్యను నిలుపుతూ ‘నిన్ను కొడతాడు’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: בִּשְׁחִין רָע
  choice: తీవ్రమైన కురుపులతో
  rationale: שְׁחִין వాపుతో కూడిన చర్మ కురుపు లేదా పుండును సూచిస్తుంది; ఇక్కడ ఏకవచనం సమూహార్థకంగా ఉంది. רָע వ్యాధి తీవ్రతను తెలియజేస్తుంది.
- source_word: עַל הַבִּרְכַּיִם
  choice: మోకాళ్లమీద
  rationale: అవయవ సూచనను నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: కింది కాళ్లమీద
  rationale: שׁוֹק సాధారణంగా మోకాలి కింది భాగాన్ని సూచిస్తుంది. ‘కాళ్లు’ కంటే ‘కింది కాళ్లు’ మూలపదానికి మరింత నిర్దిష్టమైన సమానార్థకం.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: వాటి నుంచి నీవు స్వస్థత పొందలేవు
  rationale: హీబ్రూ నిష్క్రియార్థక నిర్మాణాన్ని నిలుపుతూ, ఆ కురుపులు నయం కానివని సహజమైన తెలుగులో తెలిపాం.
- source_word: מִכַּף רַגְלְךָ
  choice: నీ అరికాలి నుంచి
  rationale: כַּף רֶגֶל పాదం అడుగుభాగాన్ని, అంటే అరికాలిని సూచించే సహజ నుడికారం.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: నీ నడినెత్తి వరకు
  rationale: קָדְקֹד తలపైభాగం లేదా శిఖరాన్ని సూచిస్తుంది. ‘నడినెత్తి’ శరీరమంతటినీ ఆవరించే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. శరీర భాగాల వరుసను స్పష్టపరచడానికి చివరి పరిధి వాక్యాన్ని ‘అవి ... వ్యాపిస్తాయి’ అని సహజంగా వ్యక్తం చేశాం; ఇది హీబ్రూ వాక్యంలో అంతర్లీనంగా ఉన్న కురుపుల వ్యాప్తిని వివరిస్తుంది.
