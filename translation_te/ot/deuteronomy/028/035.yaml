    rationale: שׁוֹק ప్రధానంగా కాలి కింది భాగాన్ని సూచిస్తుంది. “పిక్కలు” సహజమైన ప్రధాన అనువాదం; ప్రత్యామ్నాయ విస్తృత అర్థాన్ని పాదటిప్పణిలో ఇవ్వడం మూలపదంలోని పరిధిని కాపాడుతుంది.
