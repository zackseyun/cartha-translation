revisions:
- from: యెహోవా నీ మోకాళ్లమీద, కింది కాళ్లమీద[a] తీవ్రమైన కురుపులతో నిన్ను కొడతాడు. వాటి నుంచి నీవు స్వస్థత పొందలేవు. అవి నీ అరికాలి నుంచి నీ నడినెత్తి వరకు వ్యాపిస్తాయి.
  to: యాహ్వే నీ మోకాళ్లపైనా పిక్కలపైనా,[a] నీ పాదతలం నుండి నీ తల శిఖరం వరకు నయం కాని తీవ్రమైన కురుపులతో నిన్ను కొడతాడు.
  rationale: మూలంలోని ఒకే వాక్య నిర్మాణాన్ని పునరుద్ధరించి, కురుపులు వ్యాపిస్తాయని చెప్పే అదనపు భావాన్ని తొలగించాం. శరీరభాగ సూచనను సహజమైన తెలుగులో ఇచ్చి, దాని విస్తృత లెక్సికల్ అర్థాన్ని పాదటిప్పణిలో భద్రపరిచాం. దైవనామాన్ని ఆంగ్ల POB audit trail కు అనుగుణంగా “యాహ్వే”గా లిప్యంతరీకరించాం.
  reviewer_model: gpt-5.6-terra
