source:
  edition: WLC
  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: te
  text: యహ్వే నిన్నూ, నీవు నీ మీద నియమించుకునే రాజునూ, నీవుగానీ నీ పితరులుగానీ ఎరుగని ఒక దేశానికి తీసుకువెళ్తాడు. అక్కడ నీవు చెక్కతోనూ రాతితోనూ చేసిన ఇతర దేవుళ్లను సేవిస్తావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సేవిస్తావు” అని ఉన్న హెబ్రీ క్రియను ఈ సందర్భంలో “ఆరాధిస్తావు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: తీసుకువెళ్తాడు
  rationale: הלך యొక్క హిఫీల్ రూపం ‘వెళ్లేలా చేయడం/తీసుకువెళ్లడం’ అనే కారణార్థాన్ని ఇస్తుంది. శాపసందర్భంలో బలవంతపు తరలింపు సూచితమైనా, మూలంలో లేని ‘చెరగా కొనిపోవడం’ అనే భావాన్ని స్పష్టంగా చేర్చకుండా ఈ పదప్రయోగం నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: నువ్వు నీ మీద నియమించుకునే రాజు
  rationale: קום హిఫీల్ ఇక్కడ ఒక పాలకుణ్ణి నిలబెట్టడం లేదా నియమించడం అనే భావంలో ఉంది; עָלֶיךָ లోని ‘నీ మీద’ అనే పాలనా సంబంధాన్ని కూడా నిలిపాం.
- source_word: גּוֹי
  choice: ఒక జనదేశం
  rationale: גוי ఒక ప్రజాసమూహాన్నీ, ఆ ప్రజల రాజకీయ దేశాన్నీ సూచించగలదు. విదేశానికి తరలింపబడే ఈ సందర్భంలో ‘జనదేశం’ ప్రజలు-దేశం అనే రెండు పార్శ్వాలనూ సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: నువ్వుగానీ నీ పితరులుగానీ ఎరుగని
  rationale: నీవు మరియు నీ పితరులు ఆ దేశాన్ని అనుభవపూర్వకంగా ఎరుగకపోవడంపై ఉన్న హెబ్రీ నొక్కును ‘గానీ...గానీ’ నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: וְעָבַדְתָּ שָׁם
  choice: అక్కడ ... సేవిస్తావు
  rationale: עבד దేవతలను ఉద్దేశించినప్పుడు ఆరాధనాత్మక సేవను సూచించగలదు. ‘సేవించు’ మూలపదానికి దగ్గరగా ఉండి, మతపరమైన భావాన్ని సందర్భమే మోయనిస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: ఒడంబడిక భాషలోని సాధారణ పదబంధాన్ని అదనపు వ్యాఖ్యానం లేకుండా నేరుగా అందిస్తుంది.
- source_word: עֵץ וָאָבֶן
  choice: చెక్కతోనూ రాతితోనూ చేసిన
  rationale: హెబ్రీలో ‘చెక్క మరియు రాయి’ అని సంక్షిప్త సమానాధికార ప్రయోగం ఉంది. తెలుగులో అది విగ్రహాల పదార్థాన్ని సూచిస్తుందని స్పష్టంగా, సహజంగా చెప్పడానికి ‘చేసిన’ను పూరించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని ఉపయోగిస్తుంది. అందువల్ల నామం-బిరుదు భేదాన్ని నిలుపుతూ, విస్తృతంగా పునర్నిర్మించిన ఉచ్చారణకు సమీపమైన ‘యహ్వే’ను వాడాం.
- issue: עבד యొక్క మతపరమైన భావం
  choice: సేవిస్తావు
  alternative: ఆరాధిస్తావు
  rationale: ఇతర దేవుళ్ల సందర్భంలో ఆరాధన భావం నిజమే అయినా, ‘సేవించు’ అనే మూలార్థం విధేయత మరియు ఆరాధన రెండింటి మధ్య ఉన్న భావవిస్తృతిని నిలుపుతుంది.
- issue: శాపంలో ఇశ్రాయేలు ఇతర దేవుళ్లను సేవించడం
  choice: వాక్యంలోని ప్రత్యక్ష ప్రకటనను యథాతథంగా ఉంచడం
  alternative: వారు బలవంతంగా అలా చేయించబడతారని లేదా కేవలం విగ్రహారాధకుల మధ్య నివసిస్తారని వివరణ చేర్చడం
  rationale: హెబ్రీ పాఠం కారణాన్ని లేదా స్వచ్ఛందత స్థాయిని వివరించకుండా ‘నువ్వు సేవిస్తావు’ అని మాత్రమే చెబుతుంది. ఆ వేదాంతపరమైన ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనా సులభంగా అర్థమయ్యే వచనం. హెబ్రీలోని ఏకవచన సంబోధనను ‘నువ్వు/నీ’తో నిలిపాం. ‘పితరులు’ covenantal-historical registerను కాపాడుతుంది; ‘జనదేశం’ గויలోని ప్రజలు మరియు దేశం అనే భావాలను కలిపి అందిస్తుంది.
