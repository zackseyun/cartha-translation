  text: בָּר֧וּךְ פְּרִֽי בִטְנְ/ךָ֛ וּ/פְרִ֥י אַדְמָתְ/ךָ֖ וּ/פְרִ֣י בְהֶמְתֶּ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: te
  text: నీ గర్భఫలం, నీ నేల పంట, నీ పశువుల సంతానం—నీ పశువుల దూడలు, నీ గొర్రెమేకల పిల్లలు[a]—దీవించబడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పశువుల పెరుగుదల, నీ గొర్రెమేకల పెరుగుదల.” שְׁגַר אֲלָפֶיךָ, עַשְׁתְּרֹת צֹאנֶךָ అనే హీబ్రూ పదబంధాలు పశువుల పునరుత్పత్తి ద్వారా కలిగే పెరుగుదలను సూచించే సంప్రదాయ పదాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: దీవించబడతాయి
  rationale: ఒడంబడిక దీవెనల సందర్భంలోని ఫలితార్థక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; జాబితాలోని అనేక అంశాలకు అనుగుణంగా బహువచనం వాడబడింది.
- source_word: פְּרִי בִטְנְךָ
  choice: నీ గర్భఫలం
  rationale: పిల్లలను గర్భఫలంగా పేర్కొనే హీబ్రూ రూపకాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: פְּרִי אַדְמָתְךָ
  choice: నీ నేల పంట
  rationale: אַדָמָה ఇక్కడ సాగుచేసే నేలను సూచిస్తుంది; అక్షరార్థమైన ‘నేల ఫలం’ కన్నా ‘నేల పంట’ ఆధునిక తెలుగులో సహజంగా ఉండి వ్యవసాయ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: פְּרִי בְהֶמְתֶּךָ
  choice: నీ పశుసంపద సంతానం
  rationale: בְּהֵמָה పెంపుడు పశువులను విస్తృతంగా సూచిస్తుంది; ‘సంతానం’ వాటి పునరుత్పత్తి వల్ల కలిగే అభివృద్ధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: నీ పశువుల దూడలు
  rationale: ఈ సంప్రదాయ పశుపోషణ పదబంధం పెద్ద పశువులు కనే సంతానాన్ని సూచిస్తుంది; ‘దూడలు’ తెలుగులో స్పష్టమైన సహజ సమానం.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: నీ గొర్రెమేకల పిల్లలు
  rationale: צֹאן గొర్రెలు, మేకలు వంటి మందజంతువులను సమష్టిగా సూచిస్తుంది; మొత్తం పదబంధం వాటి పిల్లలను లేదా పెరుగుదలను తెలియజేస్తుంది.
