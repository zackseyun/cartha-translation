source:
  edition: WLC
  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: te
  text: ఈ గ్రంథంలో[a] వ్రాయబడిన ఈ ధర్మశాస్త్రపు మాటలన్నిటినీ ఆచరించడానికి జాగ్రత్తగా పాటించకపోతే, ఈ మహిమాన్వితమైన, భయానకమైన నామమైన నీ దేవుడైన యాహ్వేకు[c] భయపడడానికి[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ చుట్టలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘భక్తిభయంతో గౌరవించడానికి.’ హీబ్రూ క్రియలో భక్తిపూర్వక గౌరవం, భయం అనే రెండు భావాలూ ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటించి
  rationale: שׁמר + עשׂה అనే నిబంధనాత్మక ప్రయోగంలో శ్రద్ధగా కాపాడుకోవడం, ఆచరణలో చేయడం అనే రెండు భావాలూ ఉన్నాయి. ఆధునిక తెలుగులో ‘జాగ్రత్తగా పాటించి’ వాటిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్రంలోని మాటలన్నిటినీ
  rationale: דִּבְרֵי లోని ‘మాటలు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, ఈ సందర్భంలో תּוֹרָה సూచించే నిబంధనాత్మక ధర్మశాస్త్రాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: ఈ గ్రంథంలో వ్రాయబడిన
  rationale: లిఖితరూపంలో ఉన్న నిబంధన వాక్యాలను సూచిస్తుంది. ‘గ్రంథం’ ఆధునిక గౌరవప్రద తెలుగు; మూలంలోని סֵפֶר కు ‘చుట్ట’ అనే చారిత్రక ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: לְיִרְאָה
  choice: భయపడకపోతే
  rationale: ירא లో భయం, భక్తిపూర్వక విస్మయం రెండూ ఉన్నాయి. ప్రధాన పాఠంలో ‘భయపడు’ను ఉంచడం వల్ల మూలంలోని తీవ్రత తగ్గిపోదు; తెలుగు వాక్యనిర్మాణం కోసం షరతు రూపంలో అనుసంధానించబడింది.
- source_word: הַשֵּׁם
  choice: నామానికి
  rationale: దేవుని ప్రత్యక్షపరచబడిన వ్యక్తిత్వం, ఖ్యాతిని సూచించే ‘నామం’ అనే మూల రూపకాన్ని తొలగించకుండా నిలుపుతుంది.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: మహిమాన్వితమైన, భయంకరమైన
  rationale: נכבד లోని ఘనత/మహిమను, נורא లోని భయాన్ని కలిగించే విస్మయాన్ని ఈ జంట పదాలు నిలుపుతాయి.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా లిప్యంతరీకరించింది; హీబ్రూ రూపం పాదటిప్పణిలో సూచించబడింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఏకవచన ద్వితీయ పురుష సంబంధాన్ని నేరుగా నిలుపుతూ, యెహోవాతో ఉన్న నిబంధన సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా ప్రత్యామ్నాయం చేయకుండా వ్యక్తిగత నామంగా ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ירא ను కేవలం భక్తిగౌరవంగా మృదువుపరచాలా
  choice: భయపడు
  alternative: భక్తితో గౌరవించు
  rationale: ఈ పదం భక్తిపూర్వక గౌరవంతో పాటు నిజమైన భయం, విస్మయాన్ని కూడా కలిగి ఉంది. ‘భయపడు’ అనే రూపం ఆ ఉద్దేశపూర్వకమైన వేదాంత ఉద్వేగాన్ని నిలుపుతుంది; విస్తృత భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- issue: לְיִרְאָה కు పాటించడంలోని ఉద్దేశం/ఫలితం అనే సంబంధం
  choice: పాటించడం మరియు నామానికి భయపడడం రెండింటినీ ఒకే షరతులో అనుసంధానించడం
  alternative: ‘భయపడేలా’ అని స్పష్టమైన ఉద్దేశార్థక ఉపవాక్యంగా అనువదించడం
  rationale: హీబ్రూ infinitive ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. తెలుగు ప్రధాన పాఠం ఆ సంబంధాన్ని అతిగా నిర్ధారించకుండా రెండు అంశాలను షరతులో సహజంగా కలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ధర్మశాస్త్రం,’ ‘నామం,’ ‘యెహోవా’ వంటి బైబిలు సందర్భానికి అవసరమైన పదాలు నిలుపబడ్డాయి. వచనం 59వ వచనంలో పూర్తయ్యే షరతు వాక్యానికి ఆరంభం కావడంతో చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
