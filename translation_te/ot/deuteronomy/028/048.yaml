id: DEU.28.48
reference: Deuteronomy 28:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: te
  text: యాహ్వే నీ మీదికి పంపే నీ శత్రువులకు నీవు ఆకలితో, దాహంతో, నగ్నంగా, అన్నీ కొరవడిన స్థితిలో సేవ చేస్తావు. ఆయన[a] నిన్ను నాశనం చేసేవరకు నీ మెడపై ఇనుప కాడి పెడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ వాక్యంలో ‘పెడతాడు’ మరియు ‘నాశనం చేసేవరకు’ అనే క్రియలకు శత్రువునే కర్తగా కూడా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం మాత్రం ముందరి ఉపవాక్యంలో ఉన్న యాహ్వేనే ఈ క్రియలకు కొనసాగుతున్న కర్తగా తీసుకుంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ אֶת אֹיְבֶיךָ
  choice: నీ శత్రువులకు నీవు ... సేవ చేస్తావు
  rationale: ఇక్కడ עבד ఆరాధనను కాక శత్రువుల అధీనంలో చేయాల్సిన సేవను సూచిస్తుంది. భవిష్యత్తు రూపం నిబంధన-శాపపు ప్రకటన ధోరణిని నిలుపుతుంది.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: యెహోవా నీ మీదికి పంపే
  rationale: בָּךְ ఇక్కడ శత్రుత్వపూర్వకంగా ‘నీ మీదికి/నీకు విరోధంగా’ పంపడాన్ని సూచిస్తుంది; ‘నీ మీదికి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  choice: ఆకలితో, దాహంతో, నగ్నంగా, అన్నీ కొరవడిన స్థితిలో
  rationale: మూలంలోని వరుసగా పెరుగుతున్న దారిద్ర్య తీవ్రతను నిలుపుతూ, వ్యక్తిగత ఆకలి, దాహం, వస్త్రహీనత, సంపూర్ణ కొరత అనే భావాలను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עֹל בַּרְזֶל
  choice: ఇనుప కాడి
  rationale: ఇది ఇనుముతో చేసిన కాడిని సూచించే నిర్మాణం; ‘ఇనుప కాడి’ కఠిన బానిసత్వం, అణచివేత అనే రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַל צַוָּארֶךָ
  choice: నీ మెడపై
  rationale: కాడిని మెడపై ఉంచే ప్రత్యక్ష దృశ్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: నిన్ను నాశనం చేసేవరకు
  rationale: హిఫీల్ రూపంలోని పూర్తిగా నాశనం చేయడం అనే తీవ్ర భావాన్ని అతిశయింపకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న నిబంధన దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- issue: וְנָתַן ... עַד הִשְׁמִידוֹ క్రియల కర్త
  choice: యెహోవానే కొనసాగుతున్న కర్తగా తీసుకుని ‘ఆయన ... పెడతాడు’ అని అనువదించడం
  alternative: శత్రువునే కర్తగా తీసుకుని ‘అతడు ... పెడతాడు’ అని అనువదించడం
  rationale: ముందరి ఉపవాక్యంలో స్పష్టంగా పేర్కొన్న ఏకవచన కర్త యెహోవా; తరువాతి ఏకవచన క్రియలను అదే కర్తతో కొనసాగించడం వ్యాకరణపరంగా సహజం. అయినా శత్రువు కర్తగా ఉండే అవకాశాన్ని మూలం పూర్తిగా తొలగించదు కాబట్టి పాదసూచికలో దాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన నిబంధన-శాప ధోరణిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. ‘ఊడిగం’ వంటి పాత లేదా ప్రాంతీయంగా అనిపించే పదానికి బదులుగా ‘సేవ చేస్తావు’ వాడాం; సందర్భమే ఇది బలవంతపు అధీన సేవ అని స్పష్టం చేస్తుంది.
