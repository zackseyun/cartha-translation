source:
  edition: WLC
  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: te
  text: 'ద్వితీయోపదేశకాండము 28:20


    యహ్వే నీ మీదికి శాపాన్నీ, కలవరాన్నీ, గద్దింపునీ పంపిస్తాడు—నీవు చేసే ప్రతి చేతిపనిలో[a]—నీవు నాశనం చేయబడే వరకు, త్వరగా అంతరించిపోయే వరకు; నీవు నన్ను విడిచిపెట్టిన నీ దుష్టకార్యాల వల్ల.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “నీ చేతిని చాచే ప్రతిదానిలో”; అంటే, నీవు చేతులు వేసే ప్రతి పనిలో.'
    reason: హిబ్రూ జాతీయ ప్రయోగంలోని ‘చెయ్యి చాచడం’ అనే రూపకాన్ని చూపించడానికి.
lexical_decisions:
- source_word: יְשַׁלַּח יְהוָה בְּךָ
  choice: యహ్వే నీ మీదికి ... పంపిస్తాడు
  rationale: హిబ్రూ వాక్యంలో యహ్వేయే కర్త; తీర్పును ఆయనే క్రియాశీలంగా పంపుతున్నాడనే భావాన్ని, בְּךָ సూచించే లక్ష్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַמְּאֵרָה
  choice: శాపాన్ని
  rationale: నిబంధన ఉల్లంఘనకు వచ్చే నిర్దిష్ట శిక్షను సూచించే సహజమైన తెలుగు పదం.
- source_word: הַמְּהוּמָה
  choice: కలవరాన్ని
  rationale: ఈ నామవాచకంలోని గందరగోళం, అల్లకల్లోలం, భయాందోళన అనే విస్తృత భావాన్ని ‘కలవరం’ సహజంగా అందిస్తుంది.
- source_word: הַמִּגְעֶרֶת
  choice: గద్దింపును
  rationale: גער మూలంలోని బలమైన దైవిక మందలింపు లేదా అదిలింపు భావాన్ని నిలుపుతుంది.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: నువ్వు చేసే ప్రతి పనిలో—నీ చెయ్యి పెట్టే ప్రతిదానిలో
  rationale: ప్రతి ప్రయత్నం లేదా చేపట్టే పని అనే జాతీయార్థాన్ని స్పష్టంగా చెబుతూ, హిబ్రూలోని ‘చెయ్యి’ రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: నువ్వు నాశనమై త్వరగా అంతరించిపోయే వరకు
  rationale: שׁמד మరియు אבד అనే సమాంతర క్రియల రెండింటినీ వేర్వేరు తెలుగు పదాలతో ఉంచి, מַהֵר తెలిపే వేగాన్ని ‘త్వరగా’గా వ్యక్తం చేస్తుంది.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ אֲשֶׁר עֲזַבְתָּנִי
  choice: నువ్వు నన్ను విడిచిపెట్టి చేసిన నీ దుష్ట కార్యాల కారణంగా
  rationale: తీర్పుకు కారణం కార్యాల దుష్టత్వమనీ, ఆ దుష్టత్వం యహ్వేను విడిచిపెట్టడంతో సంబంధించిందనీ తెలిపేలా సంబంధ వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది; అందువల్ల వ్యక్తిగత నిబంధన నామాన్ని లిప్యంతరీకరించి ఉంచాం.
- issue: నిబంధన తీర్పులో దైవిక కర్తృత్వం
  choice: యహ్వే ... పంపిస్తాడు
  alternative: శాపం స్వయంగా వస్తుంది
  rationale: హిబ్రూ క్రియకు יהוה స్పష్టమైన కర్త. కాబట్టి తీర్పును వ్యక్తిరహితంగా మార్చకుండా ప్రత్యక్ష దైవిక కర్తృత్వాన్ని నిలిపాం.
- issue: అంతిమ పదబంధంలోని సంబంధం
  choice: నన్ను విడిచిపెట్టి చేసిన నీ దుష్ట కార్యాలు
  alternative: నీ దుష్ట కార్యాలు; ఎందుకంటే నువ్వు నన్ను విడిచిపెట్టావు
  rationale: אֲשֶׁר పదం సంబంధార్థం లేదా వివరణాత్మక/కారణార్థ ఛాయను కలిగి ఉండవచ్చు. ప్రధాన పాఠం కార్యాలు మరియు విడిచిపెట్టడాన్ని దగ్గరగా అనుసంధానిస్తుంది; ప్రత్యామ్నాయం భావాన్ని మరింత కారణవాక్యంగా విడదీస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. సందర్భంలో ఏకవచన సంబోధన ఉన్నందున ‘నువ్వు’ రూపం నిలుపబడింది. హిబ్రూ సమాంతరతను కాపాడుతూ అనవసరమైన సిద్ధాంత వివరణను ప్రధాన పాఠంలో చేర్చలేదు.
