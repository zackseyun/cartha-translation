id: DEU.28.18
reference: Deuteronomy 28:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָר֥וּר פְּרִֽי בִטְנְ/ךָ֖ וּ/פְרִ֣י אַדְמָתֶ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: te
  text: నీ గర్భఫలం, నీ నేల ఫలం[a], నీ పశువుల పిల్లలు[b], నీ గొర్రెలు-మేకల మందల పిల్లలు శాపగ్రస్తమవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సాగుభూమి పంట.” హీబ్రూలో అక్షరార్థంగా “నీ నేల ఫలం” అని ఉంది; ఇది “నీ గర్భఫలం”తో ఉన్న సమాంతరతను నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ ప్రయోగాలు ఇక్కడ పశువుల, అలాగే గొర్రెలు-మేకల మందల పిల్లలను లేదా వాటి పెరుగుదలను సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: శపించబడతాయి
  rationale: నిబంధన శాపాల సందర్భంలోని విధివాచక ప్రకటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి బహుళ కర్తలన్నిటికీ వర్తిస్తుంది.
- source_word: פְּרִי בִטְנְךָ
  choice: నీ గర్భఫలం
  rationale: సంతానాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే గౌరవప్రదమైన ప్రయోగం.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: నీ నేల ఫలం
  rationale: אַדָמָה అనే పదంలోని నేల/సాగుభూమి భావాన్ని, అలాగే గర్భఫలం—నేల ఫలం అనే మూలపాఠ సమాంతరతను నిలుపుతుంది.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: నీ పశువుల సంతానం
  rationale: పెద్ద పశువులు కనిన పిల్లలు లేదా వాటి పెరుగుదలను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: నీ మందల పిల్లలు
  rationale: గొర్రెలు, మేకలు వంటి చిన్న పశువుల మందలు కనిన పిల్లలను సహజంగా సూచిస్తుంది; పదరూపాన్ని దేవత అష్తోరెతుతో తప్పుగా అనుసంధానించదు.
