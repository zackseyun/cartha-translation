translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన నిబంధన-శాప ప్రకటన. మూలంలోని ‘ఫలం’ సమాంతర రూపకం నిలుపబడింది. సంబోధన ఏకవచనంగా ‘నీ’ రూపంలో ఉంది.
