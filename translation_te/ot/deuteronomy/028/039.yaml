id: DEU.28.39
reference: Deuteronomy 28:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּרָמִ֥ים תִּטַּ֖ע וְ/עָבָ֑דְתָּ וְ/יַ֤יִן לֹֽא תִשְׁתֶּה֙ וְ/לֹ֣א תֶאֱגֹ֔ר כִּ֥י תֹאכְלֶ֖/נּוּ הַ/תֹּלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: te
  text: నీవు ద్రాక్షతోటలు నాటి, వాటిని సాగుచేస్తావు; కానీ ద్రాక్షామద్యం తాగవు, దానిని సమకూర్చుకోవు[a], ఎందుకంటే పురుగు దాన్ని తింటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిని నిల్వచేసుకోవు.’ హీబ్రూ క్రియకు సమకూర్చడం, పోగుచేయడం లేదా నిల్వచేయడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: ద్రాక్షతోటలు
  rationale: బహువచన నామవాచకానికి ఆధునిక తెలుగులో సహజమైన, వ్యవసాయ సందర్భానికి సరిపోయే పదం.
- source_word: תִּטַּע
  choice: నాటి
  rationale: נטע అనే క్రియకు ‘నాటు’ ప్రత్యక్షమైన అర్థం; తరువాతి క్రియతో సహజంగా అనుసంధానించడానికి అసమాపక రూపం వాడబడింది.
- source_word: וְעָבָדְתָּ
  choice: వాటిని సాగుచేస్తావు
  rationale: వ్యవసాయ సందర్భంలో עבד అంటే భూమిని లేదా తోటలను పనిచేయించడం, సాగుచేయడం. తెలుగులో సూచిత కర్మను ‘వాటిని’ అని స్పష్టం చేయడం సహజం.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: ద్రాక్షతోటల సందర్భంలో יין పానీయమైన ద్రాక్షారసాన్ని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో స్పష్టంగా అర్థమయ్యే పదం.
- source_word: לֹא תִשְׁתֶּה
  choice: తాగవు
  rationale: శాపాల వరుసలోని భవిష్యత్ ఫలితాన్ని సహజమైన తెలుగు భవిష్యత్ నిరాకరణతో వ్యక్తం చేస్తుంది.
- source_word: וְלֹא תֶאֱגֹר
  choice: దానిని పోగుచేసుకోవు
  rationale: אגר కు పోగుచేయడం, సమకూర్చడం, నిల్వచేయడం అనే అర్థపరిధి ఉంది. ‘పోగుచేసుకోవు’ ఈ విస్తృతిని కొంతవరకు నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన పంటలేమికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תֹאכְלֶנּוּ
  choice: దాన్ని తినేస్తుంది
  rationale: ‘తింటుంది’ అనే ప్రత్యక్ష భావంతో పాటు పంటను నాశనం చేసే ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హీబ్రూలోని పుంలింగ ఏకవచన సర్వనామాన్ని ‘దాన్ని’గా నిలుపుతుంది.
- source_word: הַתֹּלָעַת
  choice: పురుగు
  rationale: జాతిని అతిగా నిర్దిష్టపరచకుండా, పంటను తినే పురుగు లేదా లార్వా వంటి జీవిని సూచించే విస్తృతమైన పదం.
