translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన శాప ప్రకటనగా రూపొందించబడింది. మూలంలోని ద్వితీయ పురుష ఏకవచన స్వామ్యాన్ని ‘నీ’తో నిలిపింది; అస్పష్టమైన పాత్ర ఆకారాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
