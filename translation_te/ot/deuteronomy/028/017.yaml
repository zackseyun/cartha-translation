lexical_decisions:
- source_word: אָרוּר
  choice: శపించబడతాయి
  rationale: హీబ్రూ నిష్క్రియార్థక విశేషణ రూపంలోని శాప ప్రకటనను, రెండు ఏకవచన వస్తువులు కలిసిన తెలుగు కర్తకు సహజమైన బహువచన క్రియతో వ్యక్తం చేసింది.
- source_word: טַנְאֲךָ
  choice: నీ గంప
  rationale: ఈ పదం సాధారణంగా పంట లేదా ఇతర వస్తువులు మోసే గంపను సూచిస్తుంది; సందర్భం నిర్దిష్ట విషయాన్ని చెప్పనందున ‘గంప’ అని విస్తృతార్థాన్ని నిలిపింది.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: నీ పిండి కలిపే తొట్టి
  rationale: ఈ పదం పిండిని కలిపేందుకు లేదా పిసికేందుకు ఉపయోగించే పాత్రను సూచిస్తుంది. ఆధునిక పాఠకునికి ఉపయోగం స్పష్టమయ్యేలా ‘పిండి కలిపే తొట్టి’ అని ఇచ్చింది.
