id: DEU.28.22
reference: Deuteronomy 28:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְ֠הוָה בַּ/שַּׁחֶ֨פֶת וּ/בַ/קַּדַּ֜חַת וּ/בַ/דַּלֶּ֗קֶת וּ/בַֽ/חַרְחֻר֙ וּ/בַ/חֶ֔רֶב וּ/בַ/שִּׁדָּפ֖וֹן וּ/בַ/יֵּרָק֑וֹן וּ/רְדָפ֖וּ/ךָ עַ֥ד אָבְדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: te
  text: యహ్వే నిన్ను క్షీణింపజేసే వ్యాధితో[a], జ్వరంతో, వాపుతో, మండే వేడితో, ఖడ్గంతో, ఎండుతెగులుతో, బూజు తెగులుతో కొడతాడు. నీవు నశించేవరకు అవి[b] నిన్ను వెంటాడుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్షయవ్యాధితో’; హీబ్రూ పదం శరీరాన్ని క్రమంగా క్షీణింపజేసే బలహీనకర వ్యాధిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ముందుగా పేర్కొన్న వ్యాధులు, విపత్తులు. హీబ్రూ క్రియ బహువచనంలో ఉంది; ‘ఈ విపత్తులు నిన్ను వెంటాడుతాయి’ అని కూడా అనువదించవచ్చు.
    reason: grammatical_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: నిన్ను ... కొడతాడు
  rationale: נכה హిఫీల్ రూపం నేరుగా ‘కొట్టు/దెబ్బతీయు’ అనే శిక్షాత్మక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా క్రియను జాబితా చివర ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంగా లిప్యంతరీకరించాం.
- source_word: שַׁחֶפֶת
  choice: క్షీణింపజేసే వ్యాధి
  rationale: శరీరాన్ని క్రమంగా క్షీణింపజేసే బలహీనకర వ్యాధిని సూచిస్తుంది. ‘క్షయవ్యాధి’ అనడం క్షయరోగానికే పరిమితం చేసే ప్రమాదం ఉన్నందున వివరణాత్మక రూపాన్ని ఎంచుకున్నాం.
- source_word: קַּדַּחַת
  choice: జ్వరం
  rationale: జ్వర సంబంధమైన వ్యాధిని సూచించే సాధారణ, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: דַּלֶּקֶת
  choice: శరీర వాపు
  rationale: మంట లేదా వాపుతో కూడిన శారీరక బాధను సూచిస్తుంది. పొరుగు వేడి సంబంధ పదాలతో కలిసిపోకుండా ‘శరీర వాపు’గా ఇచ్చాం.
- source_word: חַרְחֻר
  choice: మండే వేడి
  rationale: ఈ అరుదైన పదం తీవ్రమైన మండే వేడి లేదా దహనస్థితిని సూచించే అవకాశం ఉంది; మూలంలోని కొంత అనిశ్చితిని నిలుపుతూ సహజంగా అనువదించాం.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: పదానికి ప్రత్యక్ష అర్థం ‘ఖడ్గం’; సందర్భంలో యుద్ధం లేదా హింసాత్మక మరణాన్ని కూడా సూచించవచ్చు. రూపక విస్తరణను పాఠకుడికి వదిలేలా ప్రత్యక్ష పదాన్నే నిలిపాం.
- source_word: שִׁדָּפוֹן
  choice: ఎండుతెగులు
  rationale: వేడి లేదా ఎండ వల్ల పంటను నాశనం చేసే తెగులును సూచిస్తుంది; వ్యవసాయ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֵרָקוֹן
  choice: బూజుతెగులు
  rationale: మొక్కలకు వచ్చే పసుపుదనం లేదా బూజు తరహా తెగులును సూచించే వ్యవసాయ పదం; ముందున్న ఎండుతెగులుతో తేడాను నిలుపుతుంది.
- source_word: וּרְדָפוּךָ
  choice: అవి నిన్ను వెంటాడుతాయి
  rationale: హీబ్రూ క్రియ బహువచనంలో ఉంది; ముందుగా పేర్కొన్న వ్యాధులు, విపత్తులనే సమిష్టిగా తిరిగి సూచిస్తుంది.
- source_word: עַד אָבְדֶךָ
  choice: నీవు నశించేవరకు
  rationale: אבד వ్యక్తి నాశనం కావడం లేదా అంతరించిపోవడం అనే భావాన్ని ఇస్తుంది; రెండవ పురుష ఏకవచన ప్రత్యక్ష సంబోధనను నిలిపాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా, మూలనామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- issue: శాపాలు వెంటాడే కర్త
  choice: అవి నిన్ను వెంటాడుతాయి
  alternative: అది నిన్ను వెంటాడుతుంది
  rationale: మూలంలోని רְדָפוּ క్రియ బహువచనం. కాబట్టి ఒక్క శాపం లేదా దేవుడే కర్త అని సవరించకుండా, ముందు చెప్పిన బాధలు, విపత్తులనే బహువచన కర్తగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలం వాడాం. శాపాల వరుసను మూలంలోని క్రమంలోనే ఉంచి, వ్యాధి పదాలు మరియు వ్యవసాయ విపత్తుల మధ్య తేడా స్పష్టంగా కనిపించేలా చేశాం.
