review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the second-person singular address, Yahweh as the subject of the striking, the ordered catalogue of afflictions, the plural verb ‘they will pursue you,’ and the endpoint ‘until you perish.’ However, ‘శరీర వాపు’ is overly specific: דַּלֶּקֶת denotes inflammation/burning inflammation, not necessarily bodily swelling. ‘వాపు’ is a more accurate and natural equivalent without adding an unwarranted body-part specification.'
  naturalness: The verse is generally fluent modern standard Telugu. Replacing ‘శరీర వాపుతో’ with ‘వాపుతో’ makes the list more concise and idiomatic while retaining the distinct sense between fever, inflammation, and burning heat.
  terminology: ‘యహ్వే,’ ‘క్షీణింపజేసే వ్యాధి,’ ‘జ్వరం,’ ‘మండే వేడి,’ ‘ఖడ్గం,’ ‘ఎండుతెగులు,’ and ‘బూజు తెగులు’ are suitable. The alternative ‘క్షయవ్యాధి’ is retained only as a traditional lexical alternative and is not used in the main text, avoiding medical over-specification.
  issues:
  - severity: medium
    issue: ‘శరీర వాపు’ narrows the meaning of דַּלֶּקֶת.
    rationale: The Hebrew term refers to inflammation or an inflammatory burning condition. ‘శరీర వాపు’ can imply visible bodily swelling and adds ‘body,’ neither of which is specified by the source. ‘వాపు’ retains the intended medical sense more directly.
  revised_text: యహ్వే నిన్ను క్షీణింపజేసే వ్యాధితో[a], జ్వరంతో, వాపుతో, మండే వేడితో, ఖడ్గంతో, ఎండుతెగులుతో, బూజు తెగులుతో కొడతాడు. నీవు నశించేవరకు అవి[b] నిన్ను వెంటాడుతాయి.
