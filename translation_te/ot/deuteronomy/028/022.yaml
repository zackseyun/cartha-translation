- from: యహ్వే నిన్ను క్షీణింపజేసే వ్యాధితో[a], జ్వరంతో, శరీర వాపుతో, మండే వేడితో, ఖడ్గంతో, ఎండుతెగులుతో, బూజుతెగులుతో కొడతాడు. నీవు నశించేవరకు అవి[b] నిన్ను వెంటాడుతాయి.
