revisions:
- from: మీలో ఎంతో సుకుమారంగా, నాజూకుగా పెరిగిన స్త్రీ—నాజూకుతనం, సుకుమారత కారణంగా తన అరికాలు నేలమీద మోపడానికి కూడా సాహసించని స్త్రీ—తాను కౌగిలించుకునే భర్తపట్ల[a], తన కుమారునిపట్ల, తన కుమార్తెపట్ల కటువుగా చూస్తుంది[b]—
