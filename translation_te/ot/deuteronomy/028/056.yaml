base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: te
  text: మీలోని సుకుమారమైన, నాజూకైన స్త్రీ—నాజూకుతనం, సుకుమారత కారణంగా తన పాదతలాన్ని నేలపై మోపడానికి కూడా తెగించని ఆమె—తన ఒడిలోని భర్తపట్ల[a], తన కుమారునిపట్ల, తన కుమార్తెపట్ల శత్రుత్వంతో లేదా స్వార్థపూరితంగా చూస్తుంది[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమె ఒడిలోని పురుషుడు”; ఇది ఆమె భర్తను సూచించే సన్నిహితమైన వైవాహిక వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారం అక్షరార్థంగా, “ఆమె కన్ను చెడ్డదవుతుంది.” ఇది శత్రుత్వంగా చూడడం లేదా స్వార్థంతో వారికి ఇవ్వడానికి ఇష్టపడకపోవడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: ఎంతో సుకుమారంగా
  rationale: רך స్త్రీలింగ రూపం మృదుత్వం, సుకుమారతను సూచిస్తుంది. ఆధునిక తెలుగులో వ్యక్తి పెంపకం లేదా స్వభావంలోని సున్నితత్వాన్ని సహజంగా తెలియజేయడానికి ‘సుకుమారంగా’ సరిపోతుంది.
- source_word: וְהָעֲנֻגָּה
  choice: నాజూకుగా పెరిగిన
  rationale: ענג యొక్క ఈ రూపం నాజూకుగా, సుఖంగా లేదా గారాబంగా పెంచబడిన స్థితిని సూచిస్తుంది. ‘నాజూకుగా పెరిగిన’ అనే ప్రయోగం ఆ నేపథ్యాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: తన అరికాలు నేలమీద మోపడానికి కూడా సాహసించని
  rationale: నాజూకుతనం వల్ల పాదం నేలపై పెట్టడానికే వెనుకాడే తీవ్ర సుకుమారతను ఈ వాక్యం చిత్రిస్తుంది. ‘సాహసించని’ నִסְּתָה లోని ప్రయత్నించుట/తెగించుట భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: నాజూకుతనం, సుకుమారత కారణంగా
  rationale: מִן ఇక్కడ కారణార్థకంగా ఉంది. రెండు సమాంతర పదాల భేదాన్ని ‘నాజూకుతనం, సుకుమారత’గా నిలిపి, ముందున్న విశేషణాలతో భావసంబంధాన్ని కాపాడింది.
- source_word: תֵּרַע עֵינָהּ
  choice: కటువుగా చూస్తుంది
  rationale: అక్షరార్థంగా ‘ఆమె కన్ను చెడ్డదవుతుంది’ అనే హీబ్రూ నుడికారం సందర్భంలో శత్రుత్వంతో లేదా స్వార్థపూరితంగా చూడడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు నుడిని వాడి, విస్తృత భావపరిధిని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: తాను కౌగిలించుకునే భర్తపట్ల
  rationale: అక్షరార్థం ‘ఆమె ఒడిలోని పురుషుడు.’ ఇది భర్తతోని సన్నిహిత వైవాహిక బంధాన్ని సూచిస్తుంది. ‘తాను కౌగిలించుకునే భర్త’ ఆ సాన్నిహిత్య చిత్రాన్ని ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: తన కుమారునిపట్ల, తన కుమార్తెపట్ల
  rationale: హీబ్రూ కుమారుడు, కుమార్తెను విడివిడిగా పేర్కొంటుంది; ‘పిల్లలు’ అని సాధారణీకరించకుండా ఆ నిర్దిష్టతను నిలిపాం.
