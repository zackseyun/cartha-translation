translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. మూలంలోని సుకుమారత/నాజూకుతనం జంటను, భర్తతోని సాన్నిహిత్య చిత్రాన్ని, కుమారుడు–కుమార్తె అనే విడి ప్రస్తావనను నిలిపాం. తరువాతి వచనంతో కొనసాగుతున్నదని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
