  yaml_path: translation/ot/deuteronomy/028/060.yaml
  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: te
  text: నీవు భయపడిన ఐగుప్తు వ్యాధులన్నిటినీ ఆయన మళ్లీ నీ మీదకు రప్పిస్తాడు; అవి నీకు అంటిపెట్టుకొని ఉంటాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: మళ్లీ ... రప్పిస్తాడు
  rationale: שׁוב హిఫీల్ రూపం ‘తిరిగి వచ్చేలా చేయడం/మళ్లీ రప్పించడం’ అనే కారణార్థాన్ని ఇస్తుంది. శాపాల సందర్భంలో వ్యాధులను తిరిగి వారి మీదికి రప్పించడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּךָ
  choice: నీ మీదికి
  rationale: వ్యాధిని ఒకరి మీదికి రప్పించడం అనే తెలుగు ప్రయోగం, בְּ అనే సంబంధబోధక అవ్యయం ఇక్కడ తెలిపే బాధను మోపే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: ఐగుప్తు వ్యాధులన్నిటినీ
  rationale: מַדְוֶה అనేది వ్యాధి లేదా రోగాన్ని సూచిస్తుంది. బహువచన భావంతో కూడిన సమష్టి ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘వ్యాధులన్నిటినీ’గా ఇచ్చాం.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: నీవు భయపడిన
  rationale: יגר బలమైన భయం లేదా బెదరును సూచిస్తుంది. సందర్భంలో సర్వనామ ప్రత్యయం వ్యాధులనే తిరిగి సూచిస్తుంది; ‘నీవు భయపడిన’ అనేది మూల భావాన్ని సంక్షిప్తంగా, సహజంగా ఉంచుతుంది.
- source_word: וְדָבְקוּ בָּךְ
  choice: అవి నిన్ను అంటిపెట్టుకొని ఉంటాయి
  rationale: דבק అంటుకోవడం, అతుక్కొని ఉండడం, విడువకుండా పట్టుకొని ఉండడం అనే సజీవ చిత్రాన్ని ఇస్తుంది. ‘అంటిపెట్టుకొని ఉంటాయి’ వ్యాధుల నిరంతర పట్టును ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. కర్తను సందర్భానుసారంగా ‘ఆయన’గా ఉంచి, వ్యాధులు తిరిగి రావడం మరియు విడువకుండా అంటుకొని ఉండడం అనే హెబ్రీ చిత్రాలను నిలిపాం.
