id: DEU.28.11
reference: Deuteronomy 28:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: te
  text: యాహ్వే నీకు మేలు కలిగేలా సమృద్ధి కలిగిస్తాడు[a]—నీ గర్భఫలంలో[b], నీ పశువుల సంతానంలో, నీ భూమి దిగుబడిలో[c]—నీకు ఇవ్వాలని యాహ్వే నీ పితరులతో ప్రమాణం చేసిన దేశంలో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేలుకోసం [నిన్ను] సమృద్ధిగా చేస్తాడు”; ఇక్కడ సమృద్ధితో పాటు శ్రేయస్సు అనే భావమూ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “నీ గర్భఫలం” అంటే నీ పిల్లలు లేదా సంతానం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీ నేల పంటలో” లేదా “నీ భూమి పంటలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: నీకు ... సమృద్ధిని అనుగ్రహిస్తాడు
  rationale: יתר హిఫీల్ రూపంలోని కారణార్థాన్ని, అలాగే మిగులు లేదా సమృద్ధి కలిగించడమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְטוֹבָה
  choice: మేలు కలిగేలా
  rationale: అక్షరార్థంగా ‘మేలు కోసం’; ఆశీర్వాద సందర్భంలో శ్రేయస్సుకు దారితీసే సమృద్ధిని సూచిస్తుంది. మూలంలోని విస్తృత భావాన్ని ఒకే ఆర్థిక అర్థానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: בִּפְרִי בִטְנְךָ
  choice: నీ గర్భఫలంలో
  rationale: సంతానాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతూ, ఈ వచనంలోని ‘ఫలం’ అనే పునరావృత నిర్మాణాన్ని కొంతవరకు కాపాడుతుంది.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: నీ పశువుల సంతానంలో
  rationale: తెలుగులో ‘పశువుల ఫలం’ అసహజంగా ఉండటం వల్ల, జంతువుల పెరుగుదలను స్పష్టంగా చెప్పే సహజ సమానార్థక రూపం ఎంచుకోబడింది.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: నీ నేల పంటలో
  rationale: אדמה సాగుచేసే నేలను సూచిస్తుంది; ‘నేల పంట’ వ్యవసాయ దిగుబడిని సహజంగా తెలియజేస్తుంది.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: ఇక్కడ అదే పదం కేవలం మట్టిని కాక, ప్రమాణం ద్వారా ఇవ్వబడే వాగ్దాన దేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: నీకు ఇస్తానని యెహోవా నీ పితరులతో ప్రమాణం చేసిన
  rationale: భూమి ప్రస్తుత సంబోధితునికి ఇవ్వబడుతుందని, ప్రమాణం పితరులతో చేయబడిందని తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: దైవ నామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది బిరుదు కాదు, వ్యక్తిగత దైవ నామం అని నిలుపుతుంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని వాడింది; మూల ఉచ్చారణను ప్రతిబింబించే ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
- issue: ‘గర్భఫలం’ అనే రూపకాన్ని వ్యాఖ్యానించాలా
  choice: ప్రధాన పాఠంలో ‘గర్భఫలం’ను నిలుపడం
  alternative: ‘సంతానం’ అని నేరుగా అనువదించడం
  rationale: మానవ సంతానం, పశుసంతానం, నేల పంట అనే మూడు రంగాలను ఒకే ఆశీర్వాద సూత్రంలో అనుసంధానించే మూల రూపకాన్ని కాపాడుతుంది; పాదటిప్పణి అర్థాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సంబోధనను నిలిపింది. ‘యెహోవా’ను దైవ నామంగా ఉపయోగించింది. మూలంలోని రూపకాన్ని మానవ సంతానం విషయంలో నిలుపుతూ, పశువులు మరియు వ్యవసాయ దిగుబడి విషయంలో సహజ తెలుగు పదప్రయోగాన్ని ఎంచుకుంది.
