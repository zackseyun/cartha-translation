source:
  edition: WLC
  text: בָּר֥וּךְ אַתָּ֖ה בָּ/עִ֑יר וּ/בָר֥וּךְ אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: te
  text: పట్టణంలో నీవు దీవించబడతావు[a], పొలంలోనూ నీవు దీవించబడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణంలో నీవు దీవించబడినవాడివి; పొలంలోనూ నీవు దీవించబడినవాడివి.”
    reason: హెబ్రీ మూలంలో క్రియ స్పష్టంగా లేదు; ఈ మాటలను వాగ్దానాత్మక భవిష్యదర్థంలో గానీ, ప్రస్తుత స్థితిని ప్రకటించే విధంగా గానీ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: దీవించబడతావు
  rationale: ברך అనే ధాతువు నుంచి వచ్చిన నిష్క్రియార్థక రూపం ఇది. నిబంధన దీవెనల సందర్భంలో ‘దీవించబడతావు’ అనే ప్రయోగం కేవలం అదృష్టాన్ని కాక, దేవుని అనుగ్రహానికి పాత్రుడవుతావనే భావాన్ని తెలియజేస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: ఇది పుంలింగ ఏకవచన సంబోధన; ఇశ్రాయేలును సమష్టిగా ఒక నిబంధన పక్షంగా ఏకవచనంలో ఉద్దేశిస్తుంది. తెలుగు ‘నీవు’ ఈ రూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: בָּעִיר
  choice: పట్టణంలో
  rationale: ב ఉపసర్గ స్థలాన్ని సూచిస్తుంది; עִיר అంటే పట్టణం/నగరం. ‘పట్టణంలో’ అనేది పొలంతో ఉన్న పట్టణ-గ్రామీణ వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּבָרוּךְ
  choice: పొలంలోనూ ... దీవించబడతావు
  rationale: וּ సంధిని ‘నూ’తో తెలియజేసి, హెబ్రీ పాఠంలోని పునరుక్త దీవెనను అలాగే ఉంచడం ద్వారా రెండు జీవన రంగాల సమాంతరతను కాపాడాం.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שָׂדֶה అనేది పొలం, బహిరంగ భూమి లేదా గ్రామీణ వ్యవసాయ ప్రదేశాన్ని సూచించగలదు. పట్టణానికి వ్యతిరేకంగా ఉన్న స్పష్టమైన వ్యవసాయ సందర్భాన్ని ‘పొలంలో’ కాపాడుతుంది.
theological_decisions:
- issue: క్రియలేని దీవెన సూత్రాన్ని కాలార్థంతో అనువదించడం
  choice: నీవు దీవించబడతావు
  alternative: నీవు దీవించబడినవాడివి
  rationale: హెబ్రీ వాక్యంలో స్పష్టమైన క్రియ లేకపోయినా, ద్వితీయోపదేశకాండము 28లోని నిబంధన దీవెనల సందర్భం వాగ్దానాత్మక భావాన్ని ఇస్తుంది. అందువల్ల భవిష్యదర్థక ‘దీవించబడతావు’ను ప్రధాన పాఠంలో వాడి, స్థితివాచక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హెబ్రీ ఏకవచన సంబోధనను ‘నీవు’తో, పట్టణం–పొలం సమాంతర నిర్మాణాన్ని పునరుక్తితో నిలిపాం.
