id: DEU.28.1
reference: Deuteronomy 28:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: te
  text: “నీ దేవుడైన యెహోవా స్వరాన్ని నీవు శ్రద్ధగా విని లోబడి[a], నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ జాగ్రత్తగా పాటిస్తే, నీ దేవుడైన యెహోవా భూమిమీదనున్న సమస్త జనములకంటే నిన్ను ఉన్నతంగా ఉంచుతాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “వింటూ నీవు వింటే” అని ఉంది. ఇది శ్రద్ధగా విని విధేయత చూపడాన్ని బలంగా వ్యక్తం చేసే నుడికారం.
    reason: మూలంలోని బలవాచక నిర్మాణం మరియు వినడం–లోబడడం అనే ద్వంద్వ భావాన్ని వివరించడం.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: పరిస్థితి–ఫలిత సంబంధాన్ని సహజమైన ‘పాటిస్తే … ఉంచుతాడు’ నిర్మాణంతో వ్యక్తీకరించడం
  rationale: వాక్యారంభంలోని וְהָיָה భవిష్యత్ నిబంధనాత్మక పరిణామాన్ని పరిచయం చేస్తుంది. తెలుగులో దానిని విడిగా ‘అప్పుడు ఇలా జరుగుతుంది’ అని పెట్టడం కంటే షరతు–ఫలిత వాక్యనిర్మాణంలో కలపడం సహజంగా ఉండి భావాన్ని పూర్తిగా నిలుపుతుంది.
- source_word: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: స్వరాన్ని నీవు శ్రద్ధగా విని లోబడుతూ
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ శ్రద్ధతో, నిశ్చయంగా వినడాన్ని బలపరుస్తుంది; నిబంధన సందర్భంలో ‘వినడం’ లోబడటాన్ని కూడా సూచిస్తుంది. ‘విని లోబడుతూ’ అనే రూపం రెండు భావాలను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన విధంగా దేవుని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటిస్తే
  rationale: ‘కాపాడటం/శ్రద్ధ వహించడం’ మరియు ‘చేయడం’ అనే జత భావాలను సహజమైన ఆధునిక తెలుగులో ఆచరణాత్మక విధేయతగా వ్యక్తీకరిస్తుంది.
- source_word: כָּל מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలన్నిటినీ
  rationale: నిబంధనాత్మక-న్యాయపరమైన భావాన్ని నిలుపుతూ, మూడవ పురుష ప్రత్యయాన్ని స్పష్టంగా వ్యక్తీకరిస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ఈ రోజు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: మోషే ప్రస్తుత ప్రసంగంలోని తక్షణత్వాన్ని, హీబ్రూ భాగవాచక రూపంలోని కొనసాగుతున్న చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: నిన్ను ఉన్నతంగా ఉంచుతాడు
  rationale: ఇక్కడ נתן సాధారణంగా ‘ఇవ్వడం’ కాక, ఉన్నత స్థానంలో నిలపడం అనే భావంలో ఉంది; עֶלְיוֹן ఆ స్థితిని వివరిస్తుంది.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: భూమిమీదున్న సమస్త జనాలకంటే
  rationale: తులనాత్మక భావాన్ని సహజ తెలుగులో చూపుతుంది. הָאָרֶץ ఇక్కడ స్థానిక దేశం కంటే సమస్త జనాలను కలిగిన భూమిని సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచింది. ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
- issue: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל లో వినడం–విధేయత సంబంధం
  choice: స్వరాన్ని నీవు శ్రద్ధగా విని లోబడుతూ
  alternative: స్వరాన్ని నీవు తప్పకుండా వింటూ
  rationale: నిబంధన సందర్భంలో ‘వినడం’ కేవలం శబ్దాన్ని గ్రహించడం కాదు, విధేయతతో స్పందించడం కూడా. అయితే మూలంలోని ‘స్వరం వినడం’ అనే చిత్రాన్ని తొలగించకుండా రెండింటినీ ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఏకవచన ‘నీ/నిన్ను’ రూపాలు హీబ్రూ మూలంలోని ఇశ్రాయేలును సమష్టిగా ఉద్దేశించిన పురుష ఏకవచనాన్ని నిలుపుతాయి. ప్రధాన వాక్యంలో [a] గుర్తు సంబంధిత భాగం వద్ద ఉంచబడింది.
