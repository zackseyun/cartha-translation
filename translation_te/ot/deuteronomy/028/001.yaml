  revised_text: “నీ దేవుడైన యెహోవా స్వరాన్ని నీవు శ్రద్ధగా విని లోబడి[a], నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ జాగ్రత్తగా పాటిస్తే, నీ దేవుడైన యెహోవా భూమిమీదనున్న సమస్త జనములకంటే నిన్ను ఉన్నతంగా ఉంచుతాడు.”
