    rationale: '[a] గుర్తు ‘శ్రద్ధగా విని లోబడి’ వద్ద ఉండాలి; ఎందుకంటే పాదసూచిక שָׁמוֹעַ תִּשְׁמַע అనే బలవాచక ‘వినడం’ నిర్మాణాన్ని వివరిస్తుంది, ‘పాటిస్తే’ అనే తరువాతి క్రియను కాదు.'
  - severity: low
    issue: ‘సమస్త జనాలు’ అనే పదం మూలంలోని גּוֹיֵי (‘జనములు/జాతులు’) కంటే వ్యక్తులను సూచించేలా వినవచ్చు.
