id: DEU.28.49
reference: Deuteronomy 28:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: te
  text: యాహ్వే దూరం నుండి, భూమి అంచు నుండి, గద్ద దూసుకొచ్చినట్లు, నీకు విరోధంగా ఒక జనాంగాన్ని రప్పిస్తాడు; దాని భాష నీకు అర్థం కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ גּוֹי
  choice: ఒక జనాన్ని నీ మీదికి రప్పిస్తాడు
  rationale: నשא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు/మోయు’ అనే అర్థమున్నా, על తో కూడిన ఈ సందర్భంలో ఒక విదేశీ జనాన్ని దాడికి తీసుకురావడం లేదా రప్పించడం అనే భావం ఉంది. ‘రప్పిస్తాడు’ దేవుని క్రియాశీల పాత్రను సహజమైన తెలుగులో చూపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: גּוֹי
  choice: జనం
  rationale: ఇక్కడ גוי దండెత్తి వచ్చే విదేశీ జాతీయ సమూహాన్ని సూచిస్తుంది. ‘జనం’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమూహార్థాన్ని నిలుపుతుంది.
- source_word: מֵרָחוֹק
  choice: దూరం నుండి
  rationale: మూలంలోని సుదూర భావాన్ని సరళమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: מִקְצֵה הָאָרֶץ
  choice: భూమి అంచు నుండి
  rationale: ఈ హీబ్రూ అభివ్యక్తి అత్యంత సుదూర ప్రాంతాన్ని సూచిస్తుంది. రూపకాన్ని నిలుపుతూ ‘భూమి అంచు’ అని అనువదించాం.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: గద్ద వేగంగా దూసుకొచ్చినట్లు
  rationale: דאה వేగంగా ఎగరడం లేదా దూసుకురావడాన్ని సూచిస్తుంది. దాడి సందర్భంలోని వేగం, ముప్పు రెండింటినీ ‘వేగంగా దూసుకొచ్చినట్లు’ సహజంగా వ్యక్తం చేస్తుంది; נשר ను ‘గద్ద’గా అనువదించాం.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: వారి భాష నీకు అర్థం కాదు
  rationale: అక్షరార్థం ‘దాని నాలుకను నీవు వినవు’; అయితే భాషతో వాడిన שמע ఇక్కడ విన్న మాటను గ్రహించడం అనే భావం ఇస్తుంది. తెలుగులో భావాన్ని స్పష్టంగా తెలియజేయడానికి ‘అర్థం కాదు’ అన్నాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని సాధారణ బిరుదుతో మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ఏ పాదటిప్పణీ అవసరం లేకపోవడంతో ప్రధాన పాఠ్యంలో సూచికలు లేవు.
