id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: te
  text: నీ ఎద్దును నీ కళ్ల ముందే వధిస్తారు, కానీ దానిలో కొంచెమైనా నీవు తినవు. నీ గాడిదను నీ కళ్ల ఎదుటినుంచే దోచుకుపోతారు[a]; అది నీకు తిరిగి రాదు. నీ మందను నీ శత్రువులకు అప్పగిస్తారు; నిన్ను రక్షించేవాడు ఎవడూ ఉండడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దొంగిలించబడుతుంది’; హీబ్రూ పదం బలవంతంగా తీసుకుపోవడం లేదా దోచుకోవడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీకు రక్షకుడు ఎవడూ ఉండడు’ లేదా ‘నీకు విడిపించేవాడు ఉండడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: నీ ఎద్దు
  rationale: שׁוֹר ఇక్కడ శ్రమకు ఉపయోగించే ఒంటరి పశువును సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎద్దు’ సహజమైన, సందర్భోచితమైన సమానం.
- source_word: טָבוּחַ
  choice: వధిస్తారు
  rationale: טבח సాధారణంగా చంపడం మాత్రమే కాక, మాంసం కోసం జంతువును వధించడాన్ని సూచిస్తుంది. హీబ్రూ కృదంతానికి ఈ శాపాల వరుసలో భవిష్యత్ భావం ఉంది.
- source_word: לְעֵינֶיךָ
  choice: నీ కళ్ల ముందే
  rationale: సంఘటన సంబోధితుని సమక్షంలో బహిరంగంగా జరుగుతుందని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలో కొంచెమైనా
  rationale: అక్షరార్థంగా ‘దానిలోనుంచి’; తినే సందర్భంలో వధించిన ఎద్దులో ఏ భాగమూ యజమానికి దక్కదనే సంపూర్ణ నిషేధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲמֹרְךָ
  choice: నీ గాడిద
  rationale: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా అర్థమయ్యే సాధారణ పదం.
- source_word: גָּזוּל
  choice: దోచుకుపోతారు
  rationale: גזל బలవంతపు స్వాధీనపరచుకోవడం లేదా దోపిడీ భావాన్ని కలిగిస్తుంది. తెలుగులో కర్తను నిర్దిష్టంగా పేర్కొనని బహువచన క్రియ సహజంగా ఉండి, హీబ్రూ కర్మణి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִלְּפָנֶיךָ
  choice: నీ కళ్ల ఎదుటినుంచే
  rationale: అక్షరార్థమైన ‘నీ ముఖం/సమక్షం ఎదుటినుంచి’ అనే దృశ్య తీవ్రతను నిలుపుతుంది.
- source_word: יָשׁוּב לָךְ
  choice: అది నీకు తిరిగి రాదు
  rationale: హీబ్రూలో క్రియ కర్తరి రూపంలోనే ఉంది; గాడిద తిరిగి రాదనే మూల నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: צֹאנְךָ
  choice: నీ మంద
  rationale: צֹאן గొర్రెలు, మేకలు రెండింటినీ కలుపగలదు. ‘మంద’ ఏ ఒక్క జాతికీ పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: נְתֻנוֹת
  choice: అప్పగిస్తారు
  rationale: נתן కర్మణి కృదంతం ఇక్కడ శత్రువుల చేతికి ఇచ్చివేయబడటాన్ని సూచిస్తుంది; ‘అప్పగిస్తారు’ ఆ విరోధపూర్వక బదలాయింపును సహజంగా తెలియజేస్తుంది.
- source_word: לְאֹיְבֶיךָ
  choice: నీ శత్రువులకు
  rationale: ఒడంబడిక శాపాల సందర్భంలో אֹיֵב కు నేరమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: నిన్ను రక్షించేవాడు ఎవడూ ఉండడు
  rationale: מוֹשִׁיעַ అనేది ‘రక్షించే/విడిపించే వ్యక్తి’ అనే కర్తృవాచక రూపం. వ్యక్తిగత సహాయకుడు పూర్తిగా లేకపోవడాన్ని ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని రక్షణ భాష
  choice: నిన్ను రక్షించేవాడు ఎవడూ ఉండడు
  alternative: నీకు విడిపించేవాడు ఎవడూ ఉండడు
  rationale: ישע మూలం రక్షించడం లేదా విడిపించడం అనే భావాన్ని కలిగిస్తుంది. ఈ సందర్భంలో అది ఒడంబడిక శాపం నుంచి ప్రాపంచిక విమోచనను సూచిస్తుంది; నిత్య రక్షణ అనే ప్రత్యేక సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చకుండా ‘రక్షించేవాడు’ అనే నేరమైన పదాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ శాప వాక్యాల భవిష్యత్ భావం తెలుగులో స్పష్టంగా వ్యక్తమైంది. ‘మంద’ ద్వారా צֹאן ను కేవలం గొర్రెలకు పరిమితం చేయకుండా ఉంచాం; అవసరమైన పదార్థ ప్రత్యామ్నాయాలు మాత్రమే పాదసూచికల్లో ఇచ్చాం.
