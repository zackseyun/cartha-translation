  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గంభీరమైన శాపవాక్య స్వరాన్ని నిలిపాం. ‘శవం,’ ‘మృగాలు,’ ‘బెదరగొట్టేవాడు’ అనే పదాలు మూలంలోని కఠినతను తగ్గించకుండా సహజమైన తెలుగును అందిస్తాయి.
