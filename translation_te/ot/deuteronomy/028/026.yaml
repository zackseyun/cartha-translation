  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה נִבְלָֽתְ/ךָ֙ לְ/מַאֲכָ֔ל לְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: te
  text: నీ శవం ఆకాశంలోని పక్షులన్నిటికీ, భూమి మృగాలకూ ఆహారమవుతుంది[a][b]; వాటిని బెదరగొట్టి తరిమివేసేవారు ఎవరూ ఉండరు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ మృతదేహం’ లేదా ‘నీ కళేబరం.’ ఈ తీర్పు సందర్భంలో హీబ్రూ పదానికి అవమానకరమైన భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆకాశపు ప్రతి పక్షి’ మరియు ‘భూమి మృగాలు.’ ఆకాశం–భూమి అనే ఈ స్థిరమైన జత, రక్షణ లేక బహిరంగంగా పడివేయబడడాన్ని, అవమానాన్ని నొక్కిచెబుతుంది.
    reason: cultural_note
  - marker: c
    text: అంటే, శవాన్ని తింటున్న పక్షులను, మృగాలను ఎవరూ బెదరగొట్టి తరిమివేయరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ఆహారమవుతుంది
  rationale: శాపాల సందర్భంలో సంయోజక వావుతో వచ్చిన ఖతల్ రూపం భవిష్యత్ పరిణామాన్ని సూచిస్తుంది; לְמַאֲכָלతో కలిపి తెలుగులో ‘ఆహారమవుతుంది’ సహజంగా ఉంది.
- source_word: נִבְלָתְךָ
  choice: నీ శవం
  rationale: నְבֵלָה అంటే మృతదేహం లేదా కళేబరం; ఈ తీర్పు సందర్భంలోని అవమానకరమైన తీవ్రతను ‘శవం’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְמַאֲכָל
  choice: ఆహారమవుతుంది
  rationale: ఈ నామవాచకం తినబడేదాన్ని లేదా ఆహారాన్ని సూచిస్తుంది; ఫలితార్థక לְ భావాన్ని తెలుగు క్రియారూపంలో వ్యక్తం చేశాం.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: ఆకాశంలోని పక్షులన్నిటికీ
  rationale: עוֹף సమూహార్థకంగా ఎగిరే జీవులను సూచించినా, ఈ సందర్భంలో ‘పక్షులు’ సహజమైన తెలుగు; הַשָּׁמַיִםకు ‘ఆకాశం’ సందర్భోచితం.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: భూమిమీద ఉన్న మృగాలకూ
  rationale: בְּהֵמָה ఇక్కడ భూజంతువులను సమూహంగా సూచిస్తుంది. శాపవాక్యపు భయానక స్వరాన్ని ‘మృగాలు’ నిలుపుతుంది; ఆకాశం–భూమి జతను కూడా కాపాడాం.
- source_word: וְאֵין מַחֲרִיד
  choice: వాటిని బెదరగొట్టేవాడు ఎవడూ ఉండడు
  rationale: חרד హిఫీల్ రూపం భయపెట్టడం లేదా చెదరగొట్టడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో పక్షులు, మృగాలు శవాన్ని తినకుండా వాటిని తరిమేవారు ఉండరనే అంతర్భావాన్ని స్పష్టంచేశాం.
