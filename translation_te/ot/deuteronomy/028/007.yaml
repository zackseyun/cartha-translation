source:
  edition: WLC
  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: te
  text: నీకు విరోధంగా లేచే నీ శత్రువులను యాహ్వే నీ ఎదుట ఓడిపోయినవారిగా అప్పగిస్తాడు[a]. వారు ఒకే మార్గంలో నీ మీదికి వస్తారు[b]; ఏడు మార్గాల్లో నీ ఎదుటనుంచి పారిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు విరోధంగా లేచే నీ శత్రువులను యాహ్వే నీ చేతికి అప్పగిస్తాడు; వారు నీ ఎదుట ఓడిపోతారు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఒకే మార్గంలో ... ఏడు మార్గాల్లో.” శత్రువులు ఐక్యంగా వచ్చి, చెల్లాచెదురై పారిపోతారనే దృశ్యం ఇది.
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: అప్పగిస్తాడు
  rationale: נתן యొక్క ప్రాథమిక అర్థం ‘ఇవ్వడం’; యుద్ధ సందర్భంలో ‘చేతికి అప్పగించడం’ అనే భావం సహజంగా వస్తుంది. తెలుగులో ‘అప్పగిస్తాడు’ ఆ సైనిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణను సూచించే రూపంగా ఇచ్చాం.
- source_word: אֹיְבֶיךָ
  choice: నీ శత్రువులను
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన నామానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: הַקָּמִים עָלֶיךָ
  choice: నీకు విరోధంగా లేచే
  rationale: קום + על అనే శత్రుత్వపూర్వక ప్రయోగంలోని ‘ఎదిరించి లేవడం’ భావాన్ని నిలుపుతుంది; నిర్దిష్టమైన దాడి విధానాన్ని అనవసరంగా చేర్చదు.
- source_word: נִגָּפִים
  choice: ఓడిపోయినవారిగా
  rationale: నిఫాల్ రూపం ఇక్కడ కొట్టబడడం లేదా పరాజయం పొందడం అనే ఫలితాన్ని సూచిస్తుంది. ‘ఓడిపోయినవారిగా’ అనేది యుద్ధసందర్భానికి తగిన సహజ తెలుగు.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుట
  rationale: ‘నీ సన్నిధిలో/నీ ముఖం ఎదుట’ అనే హీబ్రూ నుడికారానికి సంక్షిప్తమైన సహజ సమానం.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ఒకే మార్గంలో
  rationale: ‘ఏడు మార్గాల్లో’ అనే తరువాతి విరుద్ధ సమాంతర నిర్మాణాన్ని నిలుపుతూ, ఏకీకృతంగా రావడం అనే దృశ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: నీ మీదికి వస్తారు
  rationale: యుద్ధ సందర్భంలో ‘ఎదిరించడానికి బయలుదేరడం’ అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: ఏడు మార్గాల్లో
  rationale: హీబ్రూ దృశ్యాన్నీ ‘ఒకే మార్గం—ఏడు మార్గాలు’ అనే బలమైన వ్యత్యాసాన్నీ నిలుపుతుంది.
- source_word: יָנוּסוּ
  choice: పారిపోతారు
  rationale: נוס అనే క్రియలోని భయంతో పారిపోవడం, పరాజయం చెందడం అనే బలమైన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ధ్వన్యనుకరణ రూపంలో ఇవ్వడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: יִתֵּן ... נִגָּפִים నిర్మాణంలోని కర్తృత్వం
  choice: ఓడిపోయినవారిగా అప్పగిస్తాడు
  alternative: నీ ఎదుట వారిని ఓడిస్తాడు
  rationale: మూలంలోని ‘ఇస్తాడు/అప్పగిస్తాడు’ అనే క్రియనూ, ‘ఓడిపోయినవారు’ అనే ఫలితస్థితినీ రెండింటినీ నిలుపుతుంది; దేవుడు వారిని ఎలా ఓడిస్తాడో అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కానీ సహజమైన శైలిని వాడాం. ఏకవచన సంబోధనను ‘నీ’ రూపంలో నిలిపాం. ‘ఒకే మార్గం—ఏడు మార్గాలు’ అనే మూలపాఠ సమాంతర చిత్రాన్ని అనువాదంలో కాపాడాం.
