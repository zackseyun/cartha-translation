  source_fidelity: The three curse clauses and their future force are retained. However, “పెండ్లి చేసుకోవడానికి నిశ్చయించుకుంటావు” expresses a decision/intention to marry, rather than the formal act of betrothal conveyed by תְאָרֵשׂ. The revised wording renders betrothal directly. The vineyard idiom is retained without reducing it to harvesting or enjoyment.
  naturalness: “ఒక స్త్రీతో నిశ్చితార్థం చేసుకుంటావు” is idiomatic modern standard Telugu and more precise than the draft’s periphrastic expression. The remaining clauses are clear, grave, and natural for this context.
