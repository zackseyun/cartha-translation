source:
  edition: WLC
  text: אִשָּׁ֣ה תְאָרֵ֗שׂ וְ/אִ֤ישׁ אַחֵר֙ ישגל/נה בַּ֥יִת תִּבְנֶ֖ה וְ/לֹא תֵשֵׁ֣ב בּ֑/וֹ כֶּ֥רֶם תִּטַּ֖ע וְ/לֹ֥א תְחַלְּלֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: te
  text: నీవు ఒక స్త్రీతో నిశ్చితార్థం చేసుకుంటావు, కానీ వేరొక పురుషుడు ఆమెతో శయనిస్తాడు[a]. నీవు ఇల్లు కడతావు, కానీ దానిలో నివసించవు. నీవు ద్రాక్షతోట నాటుతావు, కానీ దాని పండ్లను సాధారణ వినియోగానికి తీసుకురావడం మొదలుపెట్టవు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ క్రియ మొరటైన లైంగిక పదం. కొందరు దీనిని ‘ఆమెను బలాత్కరిస్తాడు’ అని అనువదిస్తారు; అయితే ఈ క్రియారూపం ఒక్కటే బలవంతాన్ని స్పష్టంగా పేర్కొనదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దానిని అపవిత్రం చేయవు/సాధారణం చేయవు.’ ద్రాక్షతోట పండ్లను సాధారణ ఆహార వినియోగానికి మొదటిసారిగా తెరవడాన్ని సూచించే జాతీయం ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: ఒక స్త్రీని పెండ్లి చేసుకోవడానికి నిశ్చయించుకుంటావు
  rationale: ארשׂ అనేది వివాహానికి ముందు జరిగే అధికారిక నిశ్చితార్థాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండేలా, కేవలం ‘పెండ్లి చేసుకుంటావు’ అని వివాహం పూర్తయినట్లు చెప్పకుండా ఈ భావాన్ని స్పష్టం చేసింది.
- source_word: אִישׁ אַחֵר
  choice: వేరొక పురుషుడు
  rationale: సంబోధించబడుతున్న వ్యక్తికి భిన్నమైన మరో మగవాడిని నేరుగా సూచిస్తుంది.
- source_word: ישגלנה
  choice: ఆమెతో శయనిస్తాడు
  rationale: ఈ హీబ్రూ పదం మొరటైన లైంగిక పదం. తెలుగు ప్రధాన పాఠ్యంలో లైంగిక చర్యను స్పష్టంగా తెలియజేస్తూ, క్రియారూపంలో స్పష్టంగా లేని బలవంతాన్ని అనవసరంగా చేర్చకుండా ‘శయనిస్తాడు’ అని అనువదించింది; పదంలోని మొరటుతనాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: תֵשֵׁב בּוֹ
  choice: దానిలో నివసించవు
  rationale: ఇంటి సందర్భంలో ישב అంటే కూర్చోవడం కాదు, అందులో నివాసం ఉండడం.
- source_word: כֶּרֶם
  choice: ద్రాక్షతోట
  rationale: כרםకు సహజమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: תְחַלְּלֶנּוּ
  choice: దాని పండ్లను సాధారణంగా ఉపయోగించడం మొదలుపెట్టవు
  rationale: ద్రాక్షతోట విషయంలో חלל పీయేల్ రూపం, దాని ఫలాన్ని సాధారణ వినియోగానికి తెరవడం లేదా మొదటిసారిగా ఉపయోగించడం అనే సాంకేతిక భావాన్ని ఇస్తుంది. ‘పండ్లు కోయవు’ లేదా ‘ఆనందించవు’ కంటే ఇది మూలార్థాన్ని ఖచ్చితంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించింది. ‘నిశ్చితార్థం’ అనే నామవాచక నిర్మాణం కంటే సహజమైన క్రియాత్మక వాక్యాన్ని ఎంచుకుంది. లైంగిక క్రియను మరీ మృదువుగా చేయకుండా, అదే సమయంలో మూలంలో నిర్దిష్టంగా లేని బలవంతాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో పద స్వభావాన్ని వివరించింది.
