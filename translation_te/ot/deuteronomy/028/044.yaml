id: DEU.28.44
reference: Deuteronomy 28:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: te
  text: అతడు నీకు అప్పు ఇస్తాడు[a]; కానీ నీవు అతనికి అప్పు ఇవ్వవు. అతడు తలగా ఉంటాడు, నీవు తోకగా ఉంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ముందటి వచనంలో పేర్కొన్న పరదేశి.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: నీకు అప్పు ఇస్తాడు / అతనికి అప్పు ఇవ్వవు
  rationale: హిఫిల్ రూపం ఇక్కడ ‘అప్పు ఇవ్వడం’ అనే అర్థాన్ని ఇస్తుంది. రెండు ఉపవాక్యాల్లోనూ ఒకే పదబంధాన్ని ఉంచడం వల్ల అప్పిచ్చేవాడు–అప్పు తీసుకునేవాడు అనే ఆర్థిక అసమానత, స్థితిగతుల తారుమారు స్పష్టమవుతాయి.
- source_word: הוּא
  choice: అతడు
  rationale: ఇది ముందు వచనంలోని ఏకవచన పురుషలింగ పరదేశిని సూచిస్తుంది; హీబ్రూ భాషలోని ఏకవచన సూచనను నిలుపుతుంది.
- source_word: לְרֹאשׁ
  choice: తలగా
  rationale: ప్రాధాన్యం లేదా ఆధిపత్యాన్ని సూచించే హీబ్రూ రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: לְזָנָב
  choice: తోకగా
  rationale: ‘తల’కు విరుద్ధమైన స్థానం, అధీనతను తెలిపే స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: ఉంటాడు / ఉంటావు
  rationale: శాపం ఫలితంగా ఏర్పడే భవిష్య స్థితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאַתָּה
  choice: కానీ నీవు / నీవు
  rationale: మొదటి సందర్భంలో ‘కానీ’ వ్యత్యాసాన్ని స్పష్టం చేస్తుంది; రెండవ సందర్భంలో తెలుగులో సహజమైన సమాంతర నిర్మాణం కోసం సంధాయకం లేకుండానే వ్యత్యాసం నిలుస్తుంది.
theological_decisions:
- issue: ఏకవచన పురుషలింగ సూచన
  choice: ‘అతడు’, ‘నీవు’ అనే ఏకవచన రూపాలను ఉపయోగించడం
  alternative: ‘వారు’ అనే బహువచనం ఉపయోగించడం లేదా ప్రధాన పాఠంలో ‘పరదేశి’ అని మళ్లీ పేర్కొనడం
  rationale: హీబ్రూ పాఠం వ్యాకరణపరంగా పురుషలింగ ఏకవచనంలో ఉండి, ముందటి వచనంలోని పరదేశిని ప్రతినిధిగా సూచిస్తుంది. అందువల్ల దానిని బహువచనంగా మార్చకుండా, సూచనను పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘తల–తోక’ అనే మూల రూపకం యథాతథంగా సంరక్షించబడింది. అందించిన ఆంగ్ల పాదసూచిక b దాని గుర్తు ఉన్న స్థానంతో సరిపోలకపోవడం మరియు ప్రధానంగా ఆంగ్ల పదప్రయోగ సమస్యను వివరించడం వల్ల తెలుగు ముసాయిదాలో చేర్చలేదు.
