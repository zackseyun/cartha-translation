revisions:
- from: కానీ నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ, ఆయన కట్టడలనూ పాటించి ఆచరించడానికి, నీ దేవుడైన యాహ్వే స్వరాన్ని నీవు వినకపోతే[a], ఈ శాపాలన్నీ నీ మీదికి వచ్చి నిన్ను పట్టుకుంటాయి.[b]
  to: కానీ నీ దేవుడైన యాహ్వే స్వరాన్ని నీవు వినకపోతే, నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ, ఆయన కట్టడలనూ పాటించి ఆచరించేలా వినకపోతే, ఈ శాపాలన్నీ నీ మీదికి వచ్చి నిన్ను చేరుకుంటాయి.[a][b]
  rationale: The revision introduces Yahweh before the possessive pronoun and reshapes the paired infinitives as ‘పాటించి ఆచరించేలా,’ preserving their connection to obedient listening in natural Telugu. ‘నిన్ను చేరుకుంటాయి’ better expresses the curses’ overtaking the hearer. Both footnote anchors remain present and correctly placed.
  reviewer_model: gpt-5.6-terra
