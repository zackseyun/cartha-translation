review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional contrast, the covenant name, the singular addressee, the commandments/statutes distinction, the coming of the curses, and their overtaking force. However, the fronted infinitival phrase is syntactically overburdened in Telugu and places the pronoun ‘ఆయన’ before its antecedent, obscuring the relationship of ‘to keep and to do’ to hearing Yahweh’s voice.
  naturalness: 'The present word order is difficult in modern standard Telugu: ‘నేడు ... ఆయన ఆజ్ఞలన్నిటినీ ... పాటించి ఆచరించడానికి, నీ దేవుడైన యాహ్వే స్వరాన్ని...’ makes the referent of ‘ఆయన’ temporarily unclear and leaves the purposive phrase awkwardly suspended. Reordering produces a clear, dignified conditional sentence.'
  terminology: ‘యాహ్వే,’ ‘ఆజ్ఞలు,’ ‘కట్టడలు,’ and ‘శాపాలు’ are suitable and maintain the legal-covenantal register. ‘నిన్ను చేరుకుంటాయి’ naturally renders the resultative/overtaking sense of וְהִשִּׂיגוּךָ without implying physical arrest.
  issues:
  - severity: medium
    issue: The infinitival phrase and its object precede ‘నీ దేవుడైన యాహ్వే,’ producing a cataphoric and awkward construction.
    rationale: In Telugu, ‘ఆయన ఆజ్ఞలు/కట్టడలు’ should follow the introduction of Yahweh. The source’s connection between listening and keeping/doing can be retained more naturally with ‘పాటించి ఆచరించేలా.’
  - severity: low
    issue: ‘నిన్ను పట్టుకుంటాయి’ can suggest apprehension or seizure more than overtaking.
    rationale: ‘నిన్ను చేరుకుంటాయి’ is more idiomatic for curses that come upon someone and catch up with them; the footnote preserves the pursuit imagery.
  revised_text: కానీ నీ దేవుడైన యాహ్వే స్వరాన్ని నీవు వినకపోతే, నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ, ఆయన కట్టడలనూ పాటించి ఆచరించేలా వినకపోతే, ఈ శాపాలన్నీ నీ మీదికి వచ్చి నిన్ను చేరుకుంటాయి.[a][b]
