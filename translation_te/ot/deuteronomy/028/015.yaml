  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: te
  text: కానీ నీ దేవుడైన యాహ్వే స్వరాన్ని నీవు వినకపోతే, నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన ఆజ్ఞలన్నిటినీ, ఆయన కట్టడలనూ పాటించి ఆచరించేలా వినకపోతే, ఈ శాపాలన్నీ నీ మీదికి వచ్చి నిన్ను చేరుకుంటాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారం అక్షరార్థంగా ‘స్వరాన్ని వినడం’; ఇక్కడ అది విధేయతతో వినడాన్ని కూడా సూచిస్తుంది. మరో అనువాదం: ‘నీ దేవుడైన యాహ్వేకు విధేయత చూపకపోతే.’'
    reason: lexical_alternative
  - marker: b
    text: 'చివరి మాటలో వెంబడించి చేరుకోవడం, లేదా అందుకోవడం అనే భావచిత్రం ఉంది; మరో అనువాదం: ‘నిన్ను అందుకుంటాయి.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: కానీ ... వినకపోతే
  rationale: మునుపటి ఆశీర్వాద విభాగానికి విరుద్ధమైన షరతును సహజమైన తెలుగులో తెలియజేస్తుంది; పదశః ‘అప్పుడు జరుగుతుంది, ఒకవేళ’ అనే కఠిన నిర్మాణాన్ని నివారిస్తుంది.
- source_word: תִשְׁמַע בְּקוֹל
  choice: స్వరాన్ని ... విను
  rationale: హీబ్రూ నుడికారంలోని శ్రవణ చిత్రాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది విధేయతతో వినడాన్ని కూడా సూచిస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఉంచి, రెండవ పురుష ఏకవచన నిబంధన సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: పాటించి ఆచరించడానికి
  rationale: ‘కాపాడడం/పాటించడం’ మరియు ‘చేయడం/ఆచరించడం’ అనే రెండు సమాంతర క్రియల భేదాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘జాగ్రత్తగా’ అనే భావాన్ని చేర్చదు.
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: ఆయన ఆజ్ఞలన్నిటినీ, ఆయన కట్టడలనూ
  rationale: מִצְוָה మరియు חֹק అనే న్యాయపర పదాల మధ్య భేదాన్ని ‘ఆజ్ఞలు’, ‘కట్టడలు’ ద్వారా నిలుపుతుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేడు నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: మోషే ప్రస్తుత ప్రసంగంలో ఇస్తున్న ఆజ్ఞ యొక్క తక్షణత్వాన్ని, ఏకవచన సంబోధనను ప్రతిబింబిస్తుంది.
- source_word: וּבָאוּ עָלֶיךָ כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: ఈ శాపాలన్నీ నీ మీదికి వస్తాయి
  rationale: శాపాలు వ్యక్తిపైకి రావడం అనే హీబ్రూ నుడికారాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְהִשִּׂיגוּךָ
  choice: నిన్ను పట్టుకుంటాయి
  rationale: వెంబడించి చేరుకోవడం అనే సజీవ చిత్రాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణలో ఉంచబడింది.
- issue: వినడం మరియు విధేయత మధ్య సంబంధం
  choice: ‘స్వరాన్ని వినడం’ అనే నుడికారాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘విధేయత చూపడం’ అని అర్థాన్ని నేరుగా చెప్పడం
  rationale: హీబ్రూ వాక్యం వినడమనే శ్రవణ రూపకం ద్వారా విధేయతను సూచిస్తుంది. దానిని ఒక్క వివరణాత్మక క్రియగా కుదించకుండా మూలపాఠపు నిబంధనాత్మక ధ్వనిని నిలుపుతుంది.
- issue: לִשְׁמֹר לַעֲשׂוֹת లోని ద్వంద్వ వ్యక్తీకరణ
  choice: పాటించి ఆచరించడానికి
  alternative: జాగ్రత్తగా చేయడానికి
  rationale: మూలంలోని రెండు infinitives‌ను వేరుగా ప్రతిబింబిస్తుంది; సందర్భసమ్మతమైనా మూలంలో ప్రత్యక్షంగా లేని ‘జాగ్రత్తగా’ అనే విశేషణ భావాన్ని ప్రధాన పాఠంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకుడికి అర్థమయ్యే శైలి. ఏకవచన ‘నీ/నీవు’ మూలంలోని ఇశ్రాయేలు సమూహాన్ని ఏకవచనంగా సంబోధించే రూపాన్ని నిలుపుతుంది. ‘ఆజ్ఞలు/కట్టడలు’ న్యాయ-నిబంధన పదభేదాన్ని కాపాడుతాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
