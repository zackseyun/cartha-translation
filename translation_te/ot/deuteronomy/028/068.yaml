base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: te
  text: యాహ్వే నిన్ను ఓడలలో ఐగుప్తుకు తిరిగి తీసుకువెళ్తాడు—నువ్వు ఇక దానిని మళ్లీ చూడవని నేను నీతో చెప్పిన ఆ మార్గం గుండా. అక్కడ మీరు మీ శత్రువులకు దాసులుగాను దాసీలుగాను మిమ్మల్ని మీరు అమ్మకానికి పెట్టుకుంటారు[a]; కానీ కొనేవారు ఎవరూ ఉండరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ మీరు మీ శత్రువులకు దాసులుగాను దాసీలుగాను అమ్మబడతారు.” హీబ్రూ క్రియను “మిమ్మల్ని మీరు అమ్మకానికి పెట్టుకుంటారు” అనే ప్రతికర్తృక/మధ్యమ భావంలో గానీ, బానిసత్వంలోకి వెళ్లడాన్ని సూచించే మరింత సాధారణ భావంలో గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: నిన్ను ... తిరిగి తీసుకువెళ్తాడు
  rationale: שוב హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రదేశనామం.
- source_word: בָּאֳנִיּוֹת
  choice: ఓడల్లో
  rationale: ב ఉపసర్గతో కూడిన బహువచనం సముద్ర రవాణా సాధనాన్ని సూచిస్తుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר אָמַרְתִּי לְךָ
  choice: నేను నీతో చెప్పిన మార్గంలోనే
  rationale: మార్గాన్ని ముందటి దైవవాక్యంతో అనుసంధానించే హీబ్రూ నిర్మాణాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: నువ్వు ఇక ఎన్నటికీ దాన్ని చూడవు
  rationale: יסף + עוד అనే ప్రయోగం ఆ క్రియ మళ్లీ జరగదనే బలమైన భావాన్ని ఇస్తుంది.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: మిమ్మల్ని మీరు అమ్మకానికి పెట్టుకుంటారు
  rationale: హిత్పయేల్ రూపంలోని ప్రతికర్తృక/మధ్యమ భావాన్ని కాపాడుతూ, కొనేవారు లేరనే తదుపరి వాక్యంతో విరోధం రాకుండా అమ్మకం పూర్తయిందని కాక అమ్మకానికి ముందుకు రావడాన్ని సూచిస్తుంది.
- source_word: לְאֹיְבֶיךָ
  choice: మీ శత్రువులకు
  rationale: లామెద్ అమ్మకం ఉద్దేశించిన పక్షాన్ని సూచిస్తుంది.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: దాసులుగా, దాసీలుగా
  rationale: పురుష, స్త్రీ బానిసల జతను సంక్షిప్తంగా, గౌరవభరిత ఆధునిక తెలుగులో వేరుచేస్తుంది.
- source_word: וְאֵין קֹנֶה
  choice: కానీ కొనేవాడు ఎవడూ ఉండడు
  rationale: అక్షరార్థమైన ‘కొనేవాడు లేడు’ అనే ఆర్థిక చిత్రాన్ని సందర్భానుగుణ భవిష్యత్ రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు; ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన రూపాన్ని ఉపయోగించింది.
- issue: וְהִתְמַכַּרְתֶּם యొక్క ప్రతికర్తృక/నిష్క్రియ భావం
  choice: మిమ్మల్ని మీరు అమ్మకానికి పెట్టుకుంటారు
  alternative: మీరు ... అమ్మబడతారు
  rationale: రూపంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యంలో ప్రతికర్తృకంగా చూపి, నిష్క్రియ అర్థాన్ని పాదటిప్పణిలో నిలిపింది; కొనుగోలుదారు లేడనే వాక్యం దృష్ట్యా పూర్తయిన అమ్మకాన్ని సూచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ఏకవచన సంబోధన నుంచి సమూహ బహువచనానికి మారే మూలపాఠ్య రూపాన్ని ‘నిన్ను/నువ్వు’ మరియు ‘మీరు’ ద్వారా కాపాడింది.
