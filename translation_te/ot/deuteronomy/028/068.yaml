revisions:
- from: యెహోవా నిన్ను ఓడల్లో ఐగుప్తుకు తిరిగి తీసుకువెళ్తాడు; “నువ్వు ఇక ఎన్నటికీ దాన్ని చూడవు” అని నేను నీతో చెప్పిన మార్గంలోనే తీసుకువెళ్తాడు. అక్కడ మీరు దాసులుగా, దాసీలుగా మీ శత్రువులకు మిమ్మల్ని మీరు అమ్మకానికి పెట్టుకుంటారు[a]; కానీ కొనేవాడు ఎవడూ ఉండడు.
  to: యాహ్వే నిన్ను ఓడలలో ఐగుప్తుకు తిరిగి తీసుకువెళ్తాడు—నువ్వు ఇక దానిని మళ్లీ చూడవని నేను నీతో చెప్పిన ఆ మార్గం గుండా. అక్కడ మీరు మీ శత్రువులకు దాసులుగాను దాసీలుగాను మిమ్మల్ని మీరు అమ్మకానికి పెట్టుకుంటారు[a]; కానీ కొనేవారు ఎవరూ ఉండరు.
