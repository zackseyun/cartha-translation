  edition: WLC
  text: וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/בְּרָכ֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֻ֑/ךָ כִּ֣י תִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే స్వరానికి నీవు లోబడితే, ఈ ఆశీర్వాదాలన్నీ నీ మీదికి వచ్చి నిన్ను అందుకుంటాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దేవుడైన యాహ్వే స్వరాన్ని నీవు వింటే.” హీబ్రూలో “స్వరాన్ని వినడం” అనే నుడికారం సాధారణంగా విధేయంగా స్పందించడం అనే భావాన్ని కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: నీ మీదికి వస్తాయి
  rationale: వచ్చే కదలికను సూచించే בוא మరియు עַל కలయికను సహజమైన ఆధునిక తెలుగులో ‘నీ మీదికి వస్తాయి’గా అందించింది.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: ఈ ఆశీర్వాదాలన్నీ
  rationale: నిర్దేశక పదం, సమగ్రతను తెలిపే כָּל, మరియు బహువచన నామవాచకాన్ని సంక్షిప్తంగా, సహజంగా నిలిపింది.
- source_word: וְהִשִּׂיגֻךָ
  choice: నిన్ను అందుకుంటాయి
  rationale: נשׂג హిఫీల్‌లోని వెంబడించి చేరుకోవడం లేదా పట్టుకోవడం అనే సజీవ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: లోబడితే
  rationale: ఈ ఆశీర్వాద సందర్భంలో כִּי షరతును పరిచయం చేస్తుంది; తెలుగులో క్రియకు జోడించిన ‘-తే’ ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: תִשְׁמַע בְּקוֹל
  choice: స్వరానికి నీవు లోబడితే
  rationale: అక్షరార్థంగా వినడాన్ని సూచించినా, ఈ హీబ్రూ నుడికారం విధేయంగా విని ఆచరించడాన్ని సూచిస్తుంది; ‘లోబడు’ ఆ ప్రయోగార్థాన్ని సహజంగా తెలియజేస్తుంది, ‘స్వరం’ మూల రూపకాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని ‘నీ దేవుడు’గా నిలిపి, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా విశేషణ రూపాన్ని వాడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. బిరుదైన ‘ప్రభువు’తో దాన్ని భర్తీ చేయలేదు; ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: שׁמע בְּקוֹל యొక్క నిబంధనాత్మక భావం
  choice: స్వరానికి లోబడు
  alternative: స్వరాన్ని విను
  rationale: కేవలం శబ్దం వినడం కాక, విని విధేయంగా స్పందించడం ఈ నుడికార భావం. అయినప్పటికీ ‘స్వరం’ అనే మూల రూపకాన్ని నిలిపింది.
- issue: כִּי యొక్క సంబంధం
  choice: షరతు—‘లోబడితే’
  alternative: కారణం—‘లోబడుతున్నావు కాబట్టి’
  rationale: 28:1లో ప్రారంభమైన నిబంధనాత్మక నిర్మాణం మరియు ఈ వచనంలోని ఆశీర్వాద ఫలితం దృష్ట్యా షరతార్థమే సందర్భానికి తగినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించింది. ‘వచ్చి నిన్ను అందుకుంటాయి’ అనే రూపం ఆశీర్వాదాలు వెంబడించి చేరే మూలంలోని సజీవ చిత్రాన్ని నిలుపుతుంది.
