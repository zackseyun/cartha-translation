    issue: Divine name rendered as ‘యెహోవా’ rather than ‘యాహ్వే.’
    rationale: The supplied English audit trail explicitly selects ‘Yahweh’ for יהוה. ‘యెహోవా’ reflects a different traditional vocalization and does not follow that lexical/theological decision.
  - severity: low
    issue: ‘హృదయ కలవరంతో’ narrows תמהון toward emotional agitation.
    rationale: תמהון denotes bewilderment, consternation, or confusion. ‘హృదయ గందరగోళంతో’ better preserves that semantic range without interpreting it merely as anxiety.
  revised_text: యాహ్వే నిన్ను పిచ్చితో, అంధత్వంతో, హృదయ గందరగోళంతో[a] దెబ్బతీస్తాడు.
