source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְהוָ֔ה בְּ/שִׁגָּע֖וֹן וּ/בְ/עִוָּר֑וֹן וּ/בְ/תִמְה֖וֹן לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: te
  text: యాహ్వే నిన్ను పిచ్చితో, అంధత్వంతో, హృదయ గందరగోళంతో[a] దెబ్బతీస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హృదయ దిగ్భ్రాంతితో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: నిన్ను ... దెబ్బతీస్తాడు
  rationale: נכה హిఫీల్ రూపం కొట్టడం లేదా విపత్తుతో దెబ్బతీయడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘దెబ్బతీస్తాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, నిబంధన-శాప భాషలోని తీవ్రతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో దైవిక వ్యక్తినామమైన చతురక్షర నామం ఉంది. తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపం దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచుతుంది.
- source_word: בְּשִׁגָּעוֹן
  choice: పిచ్చితో
  rationale: שִׁגָּעוֹן మానసిక విక్షిప్తతను సూచిస్తుంది. ‘పిచ్చి’ సాధారణ ఆధునిక తెలుగులో నేరుగా అర్థమయ్యే పదం; శాపవాక్యంలోని కఠినతను మృదుపరచదు.
- source_word: וּבְעִוָּרוֹן
  choice: అంధత్వంతో
  rationale: עִוָּרוֹן అక్షరార్థంగా అంధత్వం. మూలం ఇక్కడ ‘హృదయ’ లేదా ‘మనస్సు’ అని జోడించనందున వివరణాత్మక విస్తరణ లేకుండా అనువదించబడింది.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: హృదయ కలవరంతో
  rationale: תִמְהוֹן దిగ్భ్రాంతి, దిక్కుతోచకపోవడం, గందరగోళం వంటి భావాలను కలిగి ఉంది; לֵבָב అంతరంగం లేదా మనస్సును సూచించగలదు. ‘హృదయ కలవరం’ హీబ్రూ రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: לֵבָב
  choice: హృదయ
  rationale: ఈ పదం మనస్సు, సంకల్పం, అంతరంగం అనే విస్తృత భావాలను కలిగి ఉన్నప్పటికీ, ‘హృదయ’ మూల భాషా రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తినామాన్ని నేరుగా ఉపయోగిస్తుంది. తెలుగులో స్థిరంగా పరిచయమైన లిప్యంతరీకరణను ఎంచుకుని, దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: వּבְתִמְהוֹן לֵבָב యొక్క అర్థ పరిధి
  choice: హృదయ కలవరంతో
  alternative: హృదయ గందరగోళంతో; హృదయ దిగ్భ్రాంతితో
  rationale: תִמְהוֹן కు కలవరం, గందరగోళం, దిగ్భ్రాంతి అనే పరస్పరం మిళితమైన భావాలు ఉన్నాయి. ప్రధాన పాఠంలో ఒకే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజమైన రూపాన్ని ఉంచి, నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శాపవాక్య శైలి. మూడు విపత్తుల సమాంతర నిర్మాణాన్ని ‘తో’ ప్రత్యయ పునరావృతితో నిలిపాం. ‘హృదయం’ అనే హీబ్రూ అంతరంగ రూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘మనస్సు’గా మార్చలేదు.
