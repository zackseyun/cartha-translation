lexical_decisions:
- source_word: בָּרוּךְ
  choice: ఆశీర్వదించబడుతుంది
  rationale: ఇది ఆశీర్వాద సూత్రంలో విధేయార్థకంగా వాడిన నిష్క్రియార్థక కృదంతం. సందర్భంలోని నిబంధన ఆశీర్వాదాల ప్రకటనాత్మక, భవిష్యదర్థ బలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; కోరిక లేదా ప్రార్థనగా మార్చదు.
- source_word: טַנְאֲךָ
  choice: నీ బుట్ట
  rationale: టెనే అనేది సాధారణంగా వస్తువులను, ముఖ్యంగా పంటను మోసే బుట్ట. మూలంలో లేని అదనపు నిర్దిష్టతను చేర్చకుండా ‘బుట్ట’ సహజమైన సమానార్థకం.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: నీ పిండి కలిపే గిన్నె
  rationale: మిష్ఎరెత్ పిండిని సిద్ధం చేయడానికి లేదా కలపడానికి ఉపయోగించే పాత్రను సూచిస్తుంది. ‘పిండి కలిపే గిన్నె’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, గృహ ఆహారసిద్ధత సందర్భాన్ని కాపాడుతుంది.
