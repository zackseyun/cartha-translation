  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: te
  text: నీవు కుమారులకూ కుమార్తెలకూ తండ్రి అవుతావు; అయినా వారు నీకు చెందరు[a], ఎందుకంటే వారు చెరలోకి వెళ్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘వారు నీకు ఉండరు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బందీలుగా వెళ్తారు.’ హీబ్రూ పదం ప్రత్యేకంగా చెరను లేదా బందీతనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులను, కుమార్తెలను
  rationale: హీబ్రూ మూలం మగ, ఆడ సంతానాన్ని విడివిడిగా పేర్కొంటుంది; ఈ జంటను అలాగే ఉంచడం శాపవాక్యంలోని సంపూర్ణతను కాపాడుతుంది.
- source_word: תּוֹלִיד
  choice: కంటావు
  rationale: ఇది ילד ధాతువు హిఫిల్ 2ms రూపం. ఆధునిక తెలుగులో పురుష సంబోధితునికీ సహజంగా వర్తించే ‘కంటావు’ సంతానాన్ని పొందే భావాన్ని స్పష్టంగా అందిస్తుంది; ‘కనిస్తావు’ ఇక్కడ సహజం కాదు.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: అయితే వారు నీకు చెందరు
  rationale: అక్షరార్థంగా ‘వారు నీకు ఉండరు.’ చెర వల్ల వారిని కోల్పోయే భావం సందర్భంలో ఉన్నప్పటికీ, దానిని ‘నీ దగ్గర ఉండరు’ అని మాత్రమే పరిమితం చేయకుండా మూలంలోని స్వాధీన/సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పిల్లలు ఎందుకు అతనికి చెందకుండా పోతారో తెలిపే కారణార్థక సంధిగా స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: יֵלְכוּ
  choice: వెళ్తారు
  rationale: הלך అనే క్రియ ఇక్కడ క్రియాశీల Qal రూపంలో ఉంది. సందర్భం బలవంతపు తరలింపును సూచించినా, ‘తీసుకుపోబడతారు’ అని అనువదించడం మూలక్రియలో స్పష్టంగా లేని కర్మణి భావాన్ని చేర్చుతుంది.
- source_word: בַּשֶּׁבִי
  choice: చెరలోకి
  rationale: שֶׁבִי యుద్ధసంబంధమైన చెర లేదా బందీతనాన్ని సూచిస్తుంది. ‘చెరలోకి’ అనేది ‘వెళ్తారు’తో సహజంగా కలిసే ప్రత్యక్ష తెలుగు రూపం.
