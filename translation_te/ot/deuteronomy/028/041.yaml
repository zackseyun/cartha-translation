translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కుమారులు, కుమార్తెలు’ అనే మూలంలోని లింగజంటను నిలిపి, ‘వెళ్తారు’ అనే క్రియాశీల రూపాన్ని కాపాడాం. ప్రధాన పాఠంలో మూలానికి దగ్గరైన ‘నీకు చెందరు’ ఉంచి, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
