- from: నీవు కుమారులను, కుమార్తెలను కంటావు; అయితే వారు నీకు చెందరు[a]. ఎందుకంటే వారు చెరలోకి వెళ్తారు[b].
  to: నీవు కుమారులకూ కుమార్తెలకూ తండ్రి అవుతావు; అయినా వారు నీకు చెందరు[a], ఎందుకంటే వారు చెరలోకి వెళ్తారు[b].
  rationale: The revision corrects the inappropriate childbirth verb for a male addressee. ‘తండ్రి అవుతావు’ is idiomatic modern Telugu and conveys the source’s begetting/fathering sense as closely as Telugu usage permits. The remaining wording and both footnote anchors retain the source’s relationship-loss and captivity nuances without adding a passive deportation verb.
