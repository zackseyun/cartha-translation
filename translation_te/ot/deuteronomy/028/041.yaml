review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the explicitly male and female offspring, the future force, the causal relation, the active sense of ‘they will go,’ and the captivity sense of בַּשֶּׁבִי. However, కంటావు ordinarily means ‘you will give birth’ and is not suitable for the masculine-singular addressee of the Hebrew.
  naturalness: చెరలోకి వెళ్తారు and నీకు చెందరు are clear, modern-standard Telugu. Replacing the childbirth verb with a natural masculine expression removes a significant gender/idiom mismatch.
  terminology: కుమారులు, కుమార్తెలు and చెర are appropriate. తండ్రి అవుతావు conveys the male addressee naturally, while avoiding an archaic or unnatural attempt to reproduce the Hebrew Hiphil morphology.
  issues:
  - severity: high
    issue: కంటావు is used for giving birth.
    rationale: The Hebrew addresses a masculine singular subject and uses a causative/begetting form. In modern Telugu, a male addressee saying that he ‘will give birth’ is semantically and idiomatically inappropriate. ‘కుమారులకూ కుమార్తెలకూ తండ్రి అవుతావు’ naturally communicates the intended male-parent sense.
