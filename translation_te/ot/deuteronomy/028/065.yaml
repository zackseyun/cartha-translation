review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the twofold lack of rest, the concrete image of no resting place for the sole, and the three consequences Yahweh gives. Two revisions improve fidelity: the divine name should align with the stated POB rendering of יהוה as “Yahweh,” and the final Hebrew noun phrase is more naturally represented as an anguish/pain-of-life expression rather than the awkward participial phrase “వేదనపడే ప్రాణం.”'
  naturalness: Modern Telugu is generally clear. “నీ అరికాలికి నిలిచే చోటు” is slightly stiff; “నీ అరికాలు విశ్రమించడానికి చోటు” is more idiomatic while retaining the image. “ప్రాణవేదన” is concise, natural in a solemn register, and preserves the breadth of נפש without imposing a technical theological sense.
  terminology: Use “యాహ్వే” for יהוה, consistent with the supplied English POB audit trail and its explicit divine-name policy. Retain “హృదయం,” “కళ్లు,” and “ప్రాణం”/“ప్రాణవేదన” without doctrinal expansion.
  issues:
  - severity: medium
    issue: The draft renders יהוה as “యెహోవా.”
    rationale: The source explicitly has the Tetragrammaton, and the supplied POB audit trail requires its rendering as “Yahweh.” In Telugu transliteration this should be “యాహ్వే,” not “యెహోవా.”
  - severity: low
    issue: “వేదనపడే ప్రాణం” is unnatural Telugu for דַּאֲבוֹן נָפֶשׁ.
    rationale: The Hebrew is a noun phrase, “anguish/pain of soul/life.” “ప్రాణవేదన” retains the nominal force and is more idiomatic without narrowing נפש to a disembodied soul.
  - severity: low
    issue: Footnote b adds an interpretive explanation about waiting and disappointment.
    rationale: That explanatory scenario exceeds the lexical alternative requested by the source audit trail. A concise literal gloss preserves ambiguity better.
  revised_text: ఆ జనాల మధ్య నీకు విశ్రాంతి దొరకదు[a]; నీ అరికాలు విశ్రమించడానికి చోటు ఉండదు. అక్కడ యాహ్వే నీకు వణికే హృదయాన్ని, క్షీణించే కళ్లను[b], ప్రాణవేదనను[c] ఇస్తాడు.
