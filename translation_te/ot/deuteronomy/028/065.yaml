- from: ఆ జనాల మధ్య నీకు విశ్రాంతి దొరకదు[a]; నీ అరికాలికి నిలిచే చోటు ఉండదు. అక్కడ యెహోవా నీకు వణికే హృదయాన్ని, క్షీణించే కళ్లను[b], వేదనపడే ప్రాణాన్ని[c] ఇస్తాడు.
  to: ఆ జనాల మధ్య నీకు విశ్రాంతి దొరకదు[a]; నీ అరికాలు విశ్రమించడానికి చోటు ఉండదు. అక్కడ యాహ్వే నీకు వణికే హృదయాన్ని, క్షీణించే కళ్లను[b], ప్రాణవేదనను[c] ఇస్తాడు.
