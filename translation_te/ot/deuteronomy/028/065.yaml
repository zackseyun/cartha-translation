source:
  edition: WLC
  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: te
  text: ఆ జనాల మధ్య నీకు విశ్రాంతి దొరకదు[a]; నీ అరికాలు విశ్రమించడానికి చోటు ఉండదు. అక్కడ యాహ్వే నీకు వణికే హృదయాన్ని, క్షీణించే కళ్లను[b], ప్రాణవేదనను[c] ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు నెమ్మది ఉండదు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “కళ్ల క్షీణత” లేదా “కళ్లు క్షీణించడం.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ప్రాణ దుఃఖం” లేదా “ప్రాణ బాధ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: నీకు విశ్రాంతి దొరకదు
  rationale: హిఫీల్ రూపం ఇక్కడ స్థిమితపడటం లేదా విశ్రాంతి పొందటం అనే భావాన్ని ఇస్తుంది. ‘విశ్రాంతి దొరకదు’ అనేది సహజమైన ఆధునిక తెలుగు; ‘నెమ్మది ఉండదు’ అనే భావసంభావ్యతను పాదసూచికలో ఉంచింది.
- source_word: מָנוֹחַ
  choice: నిలిచే చోటు
  rationale: ‘అరికాలికి’ అనే శరీరరూపకంతో కలిసి ఇది విశ్రాంతి తీసుకోవడానికి లేదా స్థిరంగా నిలవడానికి చోటు లేకపోవడాన్ని సూచిస్తుంది. పదేపదే ‘విశ్రాంతి’ అనకుండా సహజంగా భావాన్ని అందిస్తుంది.
- source_word: לְכַף רַגְלֶךָ
  choice: నీ అరికాలికి
  rationale: כַּף־רֶגֶל పాదం కింది భాగమైన అరికాలిని నిర్దిష్టంగా సూచిస్తుంది; తెలుగు రూపకం మూలంలోని శరీరచిత్రాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: לֵב רַגָּז
  choice: వణికే హృదయం
  rationale: רַגָּז లోని వణుకు, కలత అనే సజీవ భావాలను నిలుపుతుంది; కేవలం ‘ఆందోళన’గా మానసిక భావానికి పరిమితం చేయదు.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: క్షీణించే కళ్లు
  rationale: כִּלְיוֹן క్షయించడం, నీరసించడం, విఫలమవడం వంటి భావాలను కలిగి ఉంది. ‘క్షీణించే కళ్లు’ మూలంలోని కొనసాగుతున్న క్షయచిత్రాన్ని సహజంగా ఉంచుతుంది.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: వేదనపడే ప్రాణం
  rationale: דַּאֲבוֹן లోని నొప్పి, దుఃఖం, వేదనలను ‘వేదనపడే’ అందిస్తుంది; נֶפֶשׁ ను కేవలం భావోద్వేగంగా కుదించకుండా ‘ప్రాణం’గా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం; ఆధునిక ప్రామాణిక తెలుగులో పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: נֶפֶשׁ యొక్క భావపరిధి
  choice: ప్రాణం
  alternative: ఆత్మ / అంతరంగం
  rationale: ఈ సందర్భంలో నెఫెష్ వ్యక్తి అంతటినీ, జీవ అంతరంగాన్ని సూచించగలదు. ‘ప్రాణం’ ఆ విస్తృతతను కొంతవరకు నిలుపుతుంది; దానిని తప్పనిసరిగా శరీరానికి వేరైన ‘ఆత్మ’గా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించింది. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, అసహజమైన పదేపదే అనువాదాన్ని తగ్గించింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
