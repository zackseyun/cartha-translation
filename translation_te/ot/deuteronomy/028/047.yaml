id: DEU.28.47
reference: Deuteronomy 28:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: te
  text: నీకు సమస్తమూ సమృద్ధిగా ఉన్నప్పటికీ, నీవు సంతోషంతో, హృదయానందంతో నీ దేవుడైన యాహ్వేను సేవించలేదు గనుక,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: గనుక
  rationale: శాపాలకు కారణాన్ని తెలిపే ఈ సందర్భంలో ఈ హీబ్రూ పదబంధం కారణార్థకంగా ఉంది. తెలుగులో వాక్యాంతంలోని ‘గనుక’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָבַדְתָּ
  choice: సేవించలేదు
  rationale: దేవునిపట్ల ఆరాధన, విధేయత, ఒడంబడిక సంబంధమైన సేవ అన్నిటినీ కలుపుకునే విస్తృత భావాన్ని ‘సేవించు’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో దైవనామంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: בְּשִׂמְחָה
  choice: సంతోషంతో
  rationale: సేవ చేసిన విధానాన్ని సూచించే పదబంధం; ఆధునిక సాధారణ తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: וּבְטוּב לֵבָב
  choice: హృదయానందంతో
  rationale: అక్షరార్థంగా ‘హృదయపు మేలు/మంచితనం’ అయినా, ఈ సందర్భంలో అంతరంగ ఉల్లాసాన్ని సూచించే హీబ్రూ నుడికారంగా గ్రహించాం. ముందున్న ‘సంతోషంతో’ అనే భావానికి సమీపత్వాన్ని దాచకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: מֵרֹב כֹּל
  choice: నీకు సమస్తమూ సమృద్ధిగా ఉన్నప్పటికీ
  rationale: పదబంధం అక్షరార్థంగా ‘సమస్త సమృద్ధి నుండి/వల్ల’ అని ఉన్నా, సమృద్ధిగా అనుగ్రహాలు ఉన్న పరిస్థితిలోనూ ఇశ్రాయేలు సేవించలేదనే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; సమృద్ధే వైఫల్యానికి యాంత్రిక కారణమని చెప్పదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా నామంగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: עבד లోని ఒడంబడిక సేవ భావం
  choice: సేవించు
  alternative: ఆరాధించు
  rationale: ‘ఆరాధించు’ అనే పదం భావాన్ని మతకర్మకు పరిమితం చేయవచ్చు. ‘సేవించు’ ఆరాధనతోపాటు విధేయత, నిబద్ధతలను కూడా నిలుపుతుంది.
- issue: מֵרֹב כֹּל మరియు వైఫల్యానికి కారణం
  choice: సమస్తమూ సమృద్ధిగా ఉన్నప్పటికీ
  alternative: సమస్త సమృద్ధివల్ల
  rationale: హీబ్రూ מִן నిర్మాణానికి కారణార్థం లేదా పరిస్థితి/నేపథ్యార్థం ఉండవచ్చు. విస్తృత సందర్భం సమృద్ధి ఉన్నా కృతజ్ఞ సేవ చేయని విరోధాన్ని ప్రధానంగా సూచిస్తుంది; అందువల్ల సమృద్ధే పాపానికి కారణమని నిర్ధారించకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఈ వచనం తరువాత వచ్చే ప్రధాన వాక్యంతో వ్యాకరణపరంగా కలిసే కారణవాక్యం కావడంతో చివర కామా ఉంచబడింది. ద్వితీయ పురుష ఏకవచన సంబోధనను ‘నీకు/నీవు/నీ’ రూపాల్లో నిలిపాం.
