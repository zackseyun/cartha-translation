revisions:
- from: యెహోవా నిన్ను ఏయే ప్రజల మధ్యకు తోలివేస్తాడో[c], ఆ ప్రజలందరి మధ్య నీవు భయానక దృశ్యంగా[a], సామెతగా, ఎగతాళి మాటగా[b] మారతావు.
  to: యాహ్వే నిన్ను తోలివేసే ప్రజలందరి మధ్య నీవు భయానకమైన దానిగా[a], సామెతగా, ఎగతాళి మాటగా[b] మారతావు.
