source:
  edition: WLC
  text: וְ/הָיִ֣יתָ לְ/שַׁמָּ֔ה לְ/מָשָׁ֖ל וְ/לִ/שְׁנִינָ֑ה בְּ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁר יְנַהֶגְ/ךָ֥ יְהוָ֖ה שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: te
  text: యాహ్వే నిన్ను తోలివేసే ప్రజలందరి మధ్య నీవు భయానకమైన దానిగా[a], సామెతగా, ఎగతాళి మాటగా[b] మారతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దిగ్భ్రాంతి కలిగించే దానిగా.’ హీబ్రూ పదం తీవ్రంగా నాశనమై, చూసేవారికి భయం లేదా దిగ్భ్రాంతి కలిగించే దానిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సామెతగా, ఎగతాళి మాటగా’ అనే రెండింటినీ ‘అవహేళన నానుడిగా’ అని కూడా అనువదించవచ్చు. హీబ్రూలో బహిరంగ అపహాస్యాన్ని సూచించే, పరస్పరం సంబంధమున్నప్పటికీ వేర్వేరైన రెండు పదాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: నీవు ... మారతావు
  rationale: శాపవాక్యాల వరుసలో ఈ రూపానికి భవిష్యత్తులో కలిగే ఫలితస్థితి భావం ఉంది. కేవలం ‘ఉంటావు’ కంటే ‘మారతావు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְשַׁמָּה
  choice: భయానక దృశ్యంగా
  rationale: తీర్పు సందర్భాల్లో שַׁמָּה తీవ్ర నాశనం వల్ల భయం లేదా దిగ్భ్రాంతి కలిగించే దానిని సూచిస్తుంది. ప్రజలు చూసి భయపడే వస్తువుగా ఇశ్రాయేలు మారుతుందనే భావాన్ని ఈ పదబంధం వ్యక్తం చేస్తుంది.
- source_word: לְמָשָׁל
  choice: సామెతగా
  rationale: מָשָׁל అనే పదానికి ‘సామెత’ ప్రత్యక్ష సమానార్థకం. దాని ప్రతికూల భావం ఈ శాప సందర్భం నుండీ, పక్కనున్న ‘ఎగతాళి మాట’ నుండీ స్పష్టమవుతుంది.
- source_word: וְלִשְׁנִינָה
  choice: ఎగతాళి మాటగా
  rationale: שְׁנִינָה పదునైన అవహేళనాత్మక పలుకును లేదా హేళన నానుడిని సూచిస్తుంది. ‘ఎగతాళి మాట’ దాని శత్రుత్వపూర్వక వాక్కు భావాన్ని నిలుపుతూ מָשָׁלతో ఉన్న తేడాను కూడా కాపాడుతుంది.
- source_word: בְּכֹל הָעַמִּים
  choice: ఆ ప్రజలందరి మధ్య
  rationale: עַמִּים అనేది ‘ప్రజలు’ అనే బహువచనం. సంబంధ వాక్యాన్ని సహజమైన తెలుగులో ముందుగా ఉంచినందున ‘ఆ ప్రజలందరి మధ్య’ అని తిరిగి సూచించబడింది.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: నిన్ను ఏయే ప్రజల మధ్యకు తోలివేస్తాడో
  rationale: נהג అంటే నడిపించడం లేదా తోలడం. నిర్బంధ ప్రవాసాన్ని ప్రకటించే ఈ శాప సందర్భంలో ‘తోలివేయడం’ బలవంతపు తరలింపును స్పష్టంగా తెలియజేస్తుంది; ‘ఏయే ప్రజల మధ్యకు’ గమ్యార్థక సంబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: שָׁמָּה
  choice: ఆ ప్రజలందరి మధ్య
  rationale: ‘అక్కడ’ అనే భావం తెలుగులో సంబంధ వాక్యానంతర సూచనగా ‘ఆ ప్రజలందరి మధ్య’ అనే పదబంధంలో సహజంగా ఇమిడింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల వ్యక్తిగత నామాన్ని తెలుగులో లిప్యంతరీకరించి నిలిపాం.
- issue: נהג క్రియలో నడిపించడం–తోలివేయడం మధ్య భావసందిగ్ధత
  choice: తోలివేస్తాడో
  alternative: నడిపిస్తాడో
  rationale: ఈ అధ్యాయంలోని శాపం, బలవంతపు చెదరగొట్టడం అనే సందర్భం coercive భావానికి మద్దతిస్తుంది; అయితే మూలక్రియకు తటస్థమైన ‘నడిపించడం’ అర్థమూ సాధ్యమేనని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలోని మూడు వరుస విధేయ పదాలైన భయానక దృశ్యం, సామెత, ఎగతాళి మాట అనే నిర్మాణం నిలుపబడింది. సంబంధ వాక్యాన్ని ముందుకు తెచ్చి ‘ఏయే ... వారందరి మధ్య’ అనే సహజ తెలుగు నిర్మాణాన్ని వాడాం.
