id: DEU.28.59
reference: Deuteronomy 28:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: te
  text: అప్పుడు యాహ్వే నీ తెగుళ్లను, నీ సంతానపు తెగుళ్లను అసాధారణమైనవిగా చేస్తాడు[a]—గొప్పవైన, నిలకడగా ఉండే తెగుళ్లుగా, తీవ్రమైన, నిలకడగా ఉండే వ్యాధులుగా చేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆశ్చర్యకరమైనవిగా చేస్తాడు.’ హీబ్రూ క్రియ ఏదైనా అసాధారణమైనదిగా లేదా విస్మయం కలిగించేదిగా చేయడాన్ని సూచించగలదు; ఇక్కడ తీర్పు అసాధారణంగా తీవ్రంగా ఉండడాన్ని వివరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నిలకడగా ఉండే’ అని అనువదించిన హీబ్రూ పదానికి స్థిరమైన, నిలిచే లేదా విడవకుండా ఉండే అనే భావాలు ఉన్నాయి. ఇదే పదం తెగుళ్లకూ వ్యాధులకూ వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: అసాధారణమైనవిగా చేస్తాడు
  rationale: פלא అనే ధాతువు హిఫీల్ రూపంలో ఇక్కడ తెగుళ్లను అసాధారణమైనవిగా, ఆశ్చర్యం కలిగించేంత తీవ్రంగా చేయడాన్ని సూచిస్తుంది. శాప సందర్భంలో సానుకూల భావం కలిగించే ‘అద్భుతమైనవి’ అనే పదాన్ని నివారించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగులో ధ్వన్యంతరీకరించాం.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: నీకు కలిగే తెగుళ్లు / తెగుళ్లు
  rationale: מכה అంటే దెబ్బ, ఆపద లేదా తెగులు కావచ్చు. నిబంధన శాపాల సందర్భంలో దేవుడు కలిగించే పీడలను ‘తెగుళ్లు’ సహజంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తినీ నిలిపాం.
- source_word: זַרְעֶךָ
  choice: నీ సంతానం
  rationale: זרע ఇక్కడ సమష్టిగా ఒకరి తరువాతి తరాన్ని సూచిస్తుంది. ‘సంతానం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమష్టి భావాన్ని కాపాడుతుంది.
- source_word: גְּדֹלוֹת
  choice: గొప్పవి
  rationale: మూల పదానికి ప్రాథమికంగా ‘గొప్పవి/పెద్దవి’ అనే అర్థం ఉంది; ఇక్కడ తెగుళ్ల పరిమాణం లేదా తీవ్రతను బలపరుస్తుంది.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: కొనసాగే
  rationale: אמן ధాతువు నుంచి వచ్చిన ఈ రూపాలు స్థిరంగా, నిలిచేలా, కొనసాగేలా ఉండడాన్ని సూచిస్తాయి. తెగుళ్లు, వ్యాధులు రెండింటికీ ఒకే పదాన్ని వాడి హీబ్రూ పునరుక్తిని కాపాడాం.
- source_word: חֳלָיִם
  choice: వ్యాధులు
  rationale: ఈ నామవాచకం రోగాలు లేదా అనారోగ్యాలను సూచిస్తుంది. ‘వ్యాధులు’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: רָעִים
  choice: తీవ్రమైనవి
  rationale: పదశః ‘చెడ్డవి/హానికరమైనవి’ అయినా, వ్యాధులను విశేషించేటప్పుడు బాధాకరమైన లేదా తీవ్రమైన స్వభావమే సందర్భోచిత భావం.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా మూలంలోని నామస్వరూపాన్ని నిలిపేందుకు ‘యాహ్వే’ అని ధ్వన్యంతరీకరించాం.
- issue: తీర్పు సందర్భంలో פלא పదబలం
  choice: అసాధారణమైనవిగా చేస్తాడు
  alternative: ఆశ్చర్యకరమైనవిగా చేస్తాడు / అద్భుతమైనవిగా చేస్తాడు
  rationale: ఈ క్రియ అసాధారణతను సూచిస్తుంది; శాప సందర్భంలో సానుకూలమైన ప్రశంసాభావాన్ని చొప్పించకుండా, తీర్పు యొక్క అసాధారణ తీవ్రతను తెలియజేసే రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే వాక్య నిర్మాణం వాడాం. మూలంలోని తెగుళ్లు–వ్యాధులు సమాంతరతను, ‘కొనసాగే’ అనే పద పునరుక్తిని కాపాడాం; ‘నీకు/నీ సంతానానికి కలిగే’ అనే నిర్మాణం తెలుగు సహజత్వం కోసం వాడబడింది.
