source:
  edition: WLC
  text: זֶ֥רַע רַ֖ב תּוֹצִ֣יא הַ/שָּׂדֶ֑ה וּ/מְעַ֣ט תֶּאֱסֹ֔ף כִּ֥י יַחְסְלֶ֖/נּוּ הָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: te
  text: నీవు ఎంతో విత్తనాన్ని పొలానికి తీసుకెళ్తావు[a], కానీ పంటను కొద్దిగానే సేకరిస్తావు; ఎందుకంటే మిడతలు దానిని తినివేస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు పొలంలో ఎంతో విత్తుతావు, కానీ కొద్దిగానే పంట కోస్తావు.” హీబ్రూలో మరింత అక్షరార్థంగా, “ఎంతో విత్తనాన్ని పొలానికి తీసుకెళ్తావు,” “కొద్దిగానే సేకరిస్తావు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: విస్తారంగా విత్తనాన్ని
  rationale: זֶרַע విత్తనాన్ని, רַב దాని అధిక పరిమాణాన్ని సూచిస్తాయి. ఈ పదప్రయోగం స్పష్టమైన వ్యవసాయ చిత్రాన్ని నిలుపుతుంది.
- source_word: תּוֹצִיא
  choice: తీసుకెళ్తావు
  rationale: יצא హిఫీల్ రూపానికి అక్షరార్థంగా ‘బయటికి తీసుకెళ్లు’ అనే భావం ఉంది; సందర్భంలో విత్తడానికి విత్తనాన్ని పొలానికి తీసుకెళ్లడాన్ని సూచిస్తుంది.
- source_word: הַשָּׂדֶה
  choice: పొలానికి
  rationale: שׂדה ఇక్కడ సాగుచేసే పొలాన్ని సూచిస్తుంది; దిశను తెలుగులో సహజంగా చతుర్థీ విభక్తితో తెలిపాం.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: కానీ కొద్దిగానే సమకూర్చుకుంటావు
  rationale: אסף అంటే పోగుచేయడం లేదా సమకూర్చుకోవడం. పంటకోత సందర్భాన్ని సూచిస్తూనే మూల క్రియలోని ‘సమకూర్చు’ భావాన్ని నిలుపుతుంది; מעט అధిక విత్తనానికి వ్యతిరేకంగా అల్ప ఫలాన్ని తెలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי తక్కువగా సమకూరడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יַחְסְלֶנּוּ
  choice: దానిని తినివేస్తాయి
  rationale: חסל పూర్తిగా తినివేయడం లేదా నాశనం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘తినివేస్తాయి’ మిడతల సందర్భంలో సహజంగా ఉండి ఆ తీవ్రతను నిలుపుతుంది.
- source_word: הָאַרְבֶּה
  choice: మిడతలు
  rationale: אַרְבֶּה మిడతను సూచిస్తుంది. హీబ్రూలో ఏకవచన సమూహార్థక రూపం ఉన్నప్పటికీ, తెలుగులో తెగులుగా వచ్చే సమూహాన్ని సహజంగా బహువచనంతో వ్యక్తం చేశాం.
