translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రధాన పాఠంలో హీబ్రూ వ్యవసాయ చిత్రాన్ని సాధ్యమైనంతగా నిలిపి, మరింత సందర్భానుగుణమైన ‘విత్తు/పంట కోయు’ అనువాదాన్ని పాదటిప్పణిలో ఇచ్చాం.
