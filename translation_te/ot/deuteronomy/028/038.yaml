review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the clause sequence and the causal statement. However, “విస్తారంగా విత్తనాన్ని” treats the quantitative adjective רַב as an adverb and is less precise than a direct quantity expression. Adding “పంటను” in the gathering clause makes the implied agricultural object clear in Telugu without materially altering the sense.
  naturalness: “ఎంతో విత్తనాన్ని” is idiomatic modern Telugu for “much seed.” “పంటను కొద్దిగానే సేకరిస్తావు” is clearer and more natural than “కొద్దిగానే సమకూర్చుకుంటావు,” which can suggest obtaining or accumulating rather than gathering a harvest.
  terminology: “మిడతలు” appropriately conveys the Hebrew collective singular אַרְבֶּה in natural Telugu. “తినివేస్తాయి” suitably renders the destructive force of יַחְסְלֶנּוּ. The footnote preserves the more contextual sow/harvest alternative while identifying the literal Hebrew imagery.
  issues:
  - severity: low
    issue: “విస్తారంగా విత్తనాన్ని” is awkward and slightly blurs the syntax of זֶרַע רַב.
    rationale: The Hebrew denotes a large quantity of seed, not primarily the manner of carrying it. “ఎంతో విత్తనాన్ని” expresses this directly.
  - severity: medium
    issue: “కొద్దిగానే సమకూర్చుకుంటావు” is semantically broad and unnatural in this harvest context.
    rationale: אָסַף means gather/bring in; specifying the implicit crop as “పంటను” yields a clear, natural Telugu agricultural expression while retaining the source sense.
  revised_text: నీవు ఎంతో విత్తనాన్ని పొలానికి తీసుకెళ్తావు[a], కానీ పంటను కొద్దిగానే సేకరిస్తావు; ఎందుకంటే మిడతలు దానిని తినివేస్తాయి.
  revised_footnotes:
  - marker: a
    text: లేదా, “నీవు పొలంలో ఎంతో విత్తుతావు, కానీ కొద్దిగానే పంట కోస్తావు.” హీబ్రూలో మరింత అక్షరార్థంగా, “ఎంతో విత్తనాన్ని పొలానికి తీసుకెళ్తావు,” “కొద్దిగానే సేకరిస్తావు” అని ఉంది.
    reason: lexical_alternative
  revision_rationale: 'The revision improves modern Telugu idiom and clarifies the harvest object while maintaining the Hebrew sequence: abundant seed carried to the field, little gathered, and destruction by locusts. The footnote remains anchored at the first clause and retains both the contextual alternative and the literal wording.'
