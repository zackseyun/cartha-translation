revisions:
- from: నీవు విస్తారంగా విత్తనాన్ని పొలానికి తీసుకెళ్తావు[a]; కానీ కొద్దిగానే సమకూర్చుకుంటావు. ఎందుకంటే మిడతలు దానిని తినివేస్తాయి.
  to: నీవు ఎంతో విత్తనాన్ని పొలానికి తీసుకెళ్తావు[a], కానీ పంటను కొద్దిగానే సేకరిస్తావు; ఎందుకంటే మిడతలు దానిని తినివేస్తాయి.
  rationale: 'The revision improves modern Telugu idiom and clarifies the harvest object while maintaining the Hebrew sequence: abundant seed carried to the field, little gathered, and destruction by locusts. The footnote remains anchored at the first clause and retains both the contextual alternative and the literal wording.'
  reviewer_model: gpt-5.6-terra
