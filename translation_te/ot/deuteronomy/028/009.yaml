revisions:
- from: నీ దేవుడైన యెహోవా ఆజ్ఞలను నీవు పాటిస్తూ, ఆయన మార్గాల్లో నడిస్తే, యెహోవా నీకు ప్రమాణం చేసినట్లే నిన్ను తన కోసం పవిత్ర ప్రజగా స్థిరపరుస్తాడు.[a]
  to: నీ దేవుడైన యెహోవా నీకు ప్రమాణం చేసిన ప్రకారమే, నీవు ఆయన ఆజ్ఞలను పాటించి ఆయన మార్గాల్లో నడిస్తే, నిన్ను తనకొరకు పవిత్ర ప్రజగా స్థిరపరుస్తాడు.[a]
  rationale: సవరణ అర్థాన్ని మార్చకుండా, హీబ్రూలోని రెండు విధేయత క్రియలు షరతుకు సమానంగా సంబంధించినవని స్పష్టపరుస్తుంది. అలాగే పాదటిప్పణిలోని కారణార్థక ప్రత్యామ్నాయాన్ని పూర్తి, వ్యాకరణపరంగా సమన్వయమైన వాక్యంగా అందిస్తుంది.
