source:
  edition: WLC
  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా నీకు ప్రమాణం చేసిన ప్రకారమే, నీవు ఆయన ఆజ్ఞలను పాటించి ఆయన మార్గాల్లో నడిస్తే, నిన్ను తనకొరకు పవిత్ర ప్రజగా స్థిరపరుస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దేవుడైన యెహోవా నీకు ప్రమాణం చేసిన ప్రకారమే, నీవు ఆయన ఆజ్ఞలను పాటించి ఆయన మార్గాల్లో నడుస్తున్నందున, నిన్ను తనకొరకు పవిత్ర ప్రజగా స్థిరపరుస్తాడు.” హీబ్రూ సంధిపదానికి కారణార్థం కూడా ఉండవచ్చు; అయితే ఇక్కడి సందర్భం షరతు భావానికే ఎక్కువ మద్దతు ఇస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: నిన్ను ... స్థిరపరుస్తాడు
  rationale: קום హిఫీల్ రూపం ఇక్కడ భౌతికంగా లేపడం కాక, నిబంధన సంబంధమైన స్థితిలో నిలబెట్టడం లేదా స్థాపించడం అనే భావాన్ని ఇస్తుంది. ‘స్థిరపరుస్తాడు’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לּוֹ
  choice: తన కోసం
  rationale: ఈ సర్వనామం యెహోవాకు చెందిన ప్రజగా ప్రత్యేకపరచబడే సంబంధాన్ని సూచిస్తుంది; ‘తన కోసం’ ఆ స్వాధీనత/సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: לְעַם קָדוֹשׁ
  choice: పవిత్ర ప్రజగా
  rationale: ఈ పదబంధం ఫలితంగా కలిగే నిబంధనపరమైన గుర్తింపును సూచిస్తుంది. ‘పవిత్ర ప్రజగా’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: నీకు ప్రమాణం చేసినట్లే
  rationale: ముందుగా చేసిన ప్రమాణానికి అనుగుణంగా ఈ వాగ్దానం నెరవేరుతుందని తులనాత్మక ఉపవాక్యం తెలియజేస్తుంది.
- source_word: כִּי
  choice: నడిస్తే
  rationale: ఈ ఆశీర్వాద సందర్భంలో כִּי షరతును ప్రవేశపెడుతుంది. తెలుగులో క్రియకు జోడించిన ‘-తే’ రూపం ఆ షరతును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִשְׁמֹר
  choice: పాటిస్తూ
  rationale: ఆజ్ఞలతో వాడిన שׁמר వాటిని కాపాడటం అనే అక్షరార్థం కంటే ఆచరించడం/పాటించడం అనే భావాన్ని ఇస్తుంది.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: ‘ఆజ్ఞలు’ నిబంధనపరమైన, ధర్మశాస్త్ర సంబంధమైన గంభీరతను సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: ఆయన మార్గాల్లో నడిస్తే
  rationale: దేవుడు వెల్లడించిన చిత్తానికి అనుగుణంగా జీవించడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణగా అందించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: యెహోవాతో ఇశ్రాయేలుకు ఉన్న నిబంధన సంబంధాన్ని ‘నీ దేవుడైన యెహోవా’ అనే సహజ తెలుగు నిర్మాణం తెలియజేస్తుంది.
theological_decisions:
- issue: ఆశీర్వాద ఉపవాక్యంలోని షరతు భావం
  choice: ‘పాటిస్తూ ... నడిస్తే’ అని నిజమైన షరతుగా అనువదించడం
  alternative: ‘పాటిస్తున్నందున’ అని కారణార్థకంగా చదవడం
  rationale: ద్వితీయోపదేశకాండంలోని ఆశీర్వాద–శాపాల విస్తృత సందర్భం మరియు వాక్యనిర్మాణం నిబంధన విధేయతతో ముడిపడిన షరతు భావానికే ఎక్కువ మద్దతు ఇస్తాయి; అయితే హీబ్రూ כִּי కి కారణార్థక సాధ్యత ఉన్నందున దానిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘మార్గాల్లో నడవడం’ అనే మూలభాషా రూపకం నిలుపబడింది. తెలుగు వాక్యప్రవాహం కోసం షరతు ఉపవాక్యాన్ని ముందుకు తెచ్చినా, మూలంలోని తార్కిక సంబంధం మారలేదు.
