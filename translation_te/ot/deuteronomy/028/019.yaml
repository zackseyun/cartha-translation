source:
  edition: WLC
  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: te
  text: నీవు లోపలికి వచ్చినప్పుడు శపించబడతావు[a]; నీవు బయటికి వెళ్లినప్పుడు శపించబడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీవు లోపలికి రావడంలో … నీవు బయటికి వెళ్లడంలో.’ ఈ హీబ్రూ జతపదం రోజువారీ జీవితం మొత్తాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: శపించబడతావు
  rationale: ఇది ‘శపించబడినవాడు’ అనే అర్థమిచ్చే నిష్క్రియాత్మక విశేషణ/కృదంత రూపం. తెలుగు వాక్యంలో సహజంగా ఉండటానికి, నిబంధన శాప ప్రకటనలోని గంభీరతను నిలుపుతూ ‘శపించబడతావు’ అని అనువదించాం.
- source_word: אַתָּה
  choice: నీవు
  rationale: ఇది రెండవ పురుష ఏకవచన పుంలింగ సర్వనామం. ఇశ్రాయేలును నిబంధన సంబంధమైన ఏకవచన సంబోధనలో ఉద్దేశిస్తున్న రూపాన్ని ‘నీవు’ స్పష్టంగా నిలుపుతుంది.
- source_word: בְּבֹאֶךָ
  choice: లోపలికి వచ్చినప్పుడు
  rationale: ב అనే ఉపసర్గతో בוא ధాతువు యొక్క infinitive construct మరియు రెండవ పురుష ఏకవచన ప్రత్యయం కలిసి అక్షరార్థంగా ‘నీ లోపలికి రావడంలో’ అని వస్తుంది. ఆధునిక తెలుగులో ‘లోపలికి వచ్చినప్పుడు’ సహజంగా ఉండి, జతపదంలోని దిశాభావాన్ని కాపాడుతుంది.
- source_word: וְ
  choice: ;
  rationale: హీబ్రూ సంధాయకం రెండు సమాంతర శాప ప్రకటనలను కలుపుతుంది. తెలుగులో పునరుక్త నిర్మాణాన్ని స్పష్టంగా, గంభీరంగా చూపడానికి అర్ధవిరామంతో విభజించాం; భావసంబంధం యథాతథంగా ఉంది.
- source_word: בְּצֵאתֶךָ
  choice: బయటికి వెళ్లినప్పుడు
  rationale: ב అనే ఉపసర్గతో יצא ధాతువు యొక్క infinitive construct మరియు రెండవ పురుష ఏకవచన ప్రత్యయం కలిసి అక్షరార్థంగా ‘నీ బయటికి వెళ్లడంలో’ అని వస్తుంది. ‘బయటికి వెళ్లినప్పుడు’ అనేది సమాంతర జతను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన శాప సూత్రంలోని ముందుంచిన ‘శపించబడిన’ అనే ఉద్ఘాటనను తెలుగులో ఎలా వ్యక్తీకరించాలి
  choice: ప్రతి సమాంతర వాక్యంలో ‘శపించబడతావు’ను ఉంచడం
  alternative: ‘లోపలికి వచ్చినా, బయటికి వెళ్లినా నీవు శపించబడతావు’
  rationale: ప్రత్యామ్నాయం భావాన్ని సంక్షిప్తంగా తెలిపినా, మూలంలోని ద్విగుణీకరణను మరియు ప్రతి జీవన పరిధిపైనా విడివిడిగా పడే గంభీర శాప ప్రకటనను తగ్గిస్తుంది. ఎంపిక చేసిన రూపం పునరుక్తిని కాపాడుతూ సహజ ఆధునిక తెలుగులో ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన నిబంధన-ప్రకటన శైలి వాడబడింది. ‘నీవు’ ద్వారా మూలంలోని ఏకవచన సంబోధన నిలుపబడింది; ‘లోపలికి రావడం/బయటికి వెళ్లడం’ అనే జత యొక్క విస్తృత జీవనార్థాన్ని పాదసూచిక వివరిస్తుంది.
