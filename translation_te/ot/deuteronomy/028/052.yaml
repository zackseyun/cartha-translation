  to: అతడు నీ పట్టణ ద్వారాలన్నిటి దగ్గర నిన్ను ముట్టడిస్తాడు; నీవు నమ్ముకున్న ఎత్తైన, బలపరచబడిన నీ ప్రాకారాలు నీ దేశమంతటా కూలిపోయే వరకు ముట్టడిస్తాడు. నీ దేవుడైన యాహ్వే నీకు ఇచ్చిన నీ దేశమంతటా, నీ పట్టణ ద్వారాలన్నిటి దగ్గర అతడు నిన్ను ముట్టడిస్తాడు.
