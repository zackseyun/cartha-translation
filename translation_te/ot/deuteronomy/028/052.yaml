    rationale: హెబ్రీలో ఈ పదబంధం ముందుగా ‘నీ ఎత్తైన, బలపరచబడిన ప్రాకారాలు’ అన్న భాగంతో అనుసంధానమై ఉంది; తరువాతి పునరుక్త ముట్టడికి కూడా వస్తుంది. ప్రాకారాల కూలిపోవడానికి సంబంధించి దానిని ఉంచడం మూల సంబంధాన్ని స్పష్టపరుస్తుంది.
  - severity: low
