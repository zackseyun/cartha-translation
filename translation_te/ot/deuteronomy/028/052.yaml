source:
  edition: WLC
  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: te
  text: అతడు నీ పట్టణ ద్వారాలన్నిటి దగ్గర నిన్ను ముట్టడిస్తాడు; నీవు నమ్ముకున్న ఎత్తైన, బలపరచబడిన నీ ప్రాకారాలు నీ దేశమంతటా కూలిపోయే వరకు ముట్టడిస్తాడు. నీ దేవుడైన యాహ్వే నీకు ఇచ్చిన నీ దేశమంతటా, నీ పట్టణ ద్వారాలన్నిటి దగ్గర అతడు నిన్ను ముట్టడిస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: అతడు ... ముట్టడిస్తాడు
  rationale: צור హిఫీల్ రూపం ఇక్కడ ద్వారాలు, ప్రాకారాలు అనే సైనిక సందర్భంలో రావడం వల్ల సాధారణంగా ‘బాధిస్తాడు’ అని కాకుండా ‘ముట్టడిస్తాడు’ అని అనువదించాం; రెండుసార్లూ ఒకే విధంగా ఉంచాం.
- source_word: שְׁעָרֶיךָ
  choice: నీ పట్టణ ద్వారాలన్నిటి దగ్గర
  rationale: మూలార్థం ‘నీ ద్వారాలు’. ఇవి పట్టణాలకు సూచకంగా ఉన్నప్పటికీ, ముట్టడి దృశ్యాన్ని నిలుపుతూ తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘పట్టణ ద్వారాలు’ అని ఇచ్చాం.
- source_word: עַד רֶדֶת
  choice: కూలిపోయే వరకు
  rationale: ירד అంటే అక్షరార్థంగా ‘దిగిపోవడం’; ప్రాకారాలపై ముట్టడి సందర్భంలో సహజమైన తెలుగు భావం ‘కూలిపోవడం’.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: ఎత్తైన, పటిష్ఠమైన ప్రాకారాలు
  rationale: రెండు విశేషణాలనూ నిలిపాం. בָּצוּר రక్షణార్థంగా బలపరచబడినదాన్ని సూచిస్తుంది; ‘పటిష్ఠమైన’ అనేది ప్రాకారాల సందర్భంలో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: నీవు నమ్ముకున్న
  rationale: בטח + ב సూచించే ఆధారం/నమ్మకాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּכָל אַרְצֶךָ
  choice: నీ దేశమంతటా
  rationale: בְּכָל యొక్క సమగ్ర, విస్తృత భావాన్ని ‘దేశమంతటా’ సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: నీ దేవుడైన యెహోవా నీకు ఇచ్చిన
  rationale: హెబ్రీ సంపూర్ణ క్రియను ‘ఇచ్చిన’గా, సంబంధ పదబంధాన్ని తెలుగులో సహజమైన క్రమంలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: ఏకవచన రెండవ పురుష సంబోధన
  choice: నీ / నిన్ను / నీవు
  alternative: మీ / మిమ్మల్ని / మీరు
  rationale: మూల హీబ్రూలో ఏకవచన రూపాలున్నాయి; అవి సమూహమైన ఇశ్రాయేలును ఏకవచనంగా సంబోధిస్తున్న ఉద్వేగాన్ని నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన శిక్షా ప్రకటన శైలిని నిలిపి, పొడవైన హెబ్రీ వాక్యాన్ని స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. ‘ద్వారాలు’ అనే మూల దృశ్యాన్ని కాపాడుతూ అవి పట్టణ ద్వారాలని స్పష్టం చేశాం.
