translation:
  language: te
  text: కఠోర ముఖముగల ఒక జనము[a]—వృద్ధుని పట్ల గౌరవం చూపని[b], యువకునిపై కనికరం చూపని[c] జనము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ముఖంలో బలం గల జనము.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వృద్ధుని పట్ల పరిగణన చూపని.’ హీబ్రూ నుడికారం అక్షరార్థంగా, ‘వృద్ధుని ముఖాన్ని ఎత్తని’ అని ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘యువకునిపై అనుగ్రహం చూపని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹי
  choice: జనము
  rationale: విదేశీ దండయాత్ర చేసే ప్రజాసమూహాన్ని సూచించే గּוֹיకు ‘జనము’ సహజమైన, గంభీరమైన తెలుగు సమానం.
- source_word: עַז פָּנִים
  choice: కఠిన ముఖంగల
  rationale: ‘బలమైన/కఠినమైన ముఖం గల’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, నిర్దయతో కూడిన దృఢ స్వభావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר
  choice: — ... జనము
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా పునరుక్త ‘జనము’తో కట్టిపెడుతుంది.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: వృద్ధుని ముఖాన్ని లక్ష్యపెట్టని
  rationale: ‘వృద్ధుని ముఖాన్ని ఎత్తకపోవడం’ అనే హీబ్రూ నుడికారంలోని ముఖ రూపకాన్ని కొంత నిలుపుతూ, అతనికి గౌరవం లేదా పరిగణన చూపకపోవడాన్ని వ్యక్తం చేస్తుంది.
- source_word: זָקֵן
  choice: వృద్ధుడు
  rationale: ఏకవచనం ప్రతినిధి అర్థంలో ఉంది; వయస్సు మళ్లిన వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: וְנַעַר
  choice: యువకుడు
  rationale: נַעַרకు బాలుడు నుండి యువకుడు వరకు అర్థపరిధి ఉంది; זָקֵןతో వయోభేదాన్ని చూపే సందర్భంలో ‘యువకుడు’ తగినది.
- source_word: לֹא יָחֹן
  choice: దయ చూపని
  rationale: חנןలోని అనుగ్రహం/కరుణ చూపడం అనే భావాన్ని దండయాత్ర సందర్భంలో సహజంగా తెలియజేస్తుంది; ‘అనుగ్రహించని’ కంటే సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
