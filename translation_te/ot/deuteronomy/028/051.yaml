  terminology: ధాన్యం, కొత్త ద్రాక్షారసం, and నూనె appropriately represent the agricultural triad. దూడలు suitably renders the cattle offspring, while గొర్రెల మందల పిల్లలు retains the disputed reproductive-yield sense without over-specifying it. The lexical-alternative footnote is anchored to that disputed expression.
  issues:
