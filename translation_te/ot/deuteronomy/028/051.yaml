translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన శాపవాక్య ధోరణిని నిలిపాము. వరుసలోని ప్రతి అంశంపై ‘గానీ’ వాడటం ఏదీ మిగలదనే సంపూర్ణతను సహజంగా తెలియజేస్తుంది. మూలంలోని రెండు నాశన సూచనలనూ పునరుక్తి అయినప్పటికీ నిలిపాము; మొదటిదాన్ని తెలుగు ప్రవాహం కోసం ఫలితార్థక వాక్యంగా తీర్చిదిద్దాము.
