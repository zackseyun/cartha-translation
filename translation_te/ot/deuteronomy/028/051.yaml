id: DEU.28.51
reference: Deuteronomy 28:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: te
  text: అది నీ పశువుల సంతానాన్నీ, నీ భూమి పంటనూ తిని, నీవు నాశనమయ్యేవరకు కొనసాగుతుంది; అది నీకు ధాన్యమూ, కొత్త ద్రాక్షారసమూ, నూనెయూ, నీ పశువుల మందల దూడలూ, నీ గొర్రెల మందల పిల్లలూ[a] ఏదీ మిగల్చదు—నిన్ను నాశనం చేసేవరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ గొర్రెల మందల వృద్ధి.” ఇక్కడి హెబ్రీ పదం మంద నుంచి కలిగే సంతానాన్ని లేదా దాని ఉత్పాదక వృద్ధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: అది ... తినివేస్తూ
  rationale: אכל అనే క్రియకు ప్రాథమిక అర్థం ‘తిను.’ ఇక్కడ శత్రు జనము వనరులను పూర్తిగా హరించడాన్ని ‘తినివేయు’ సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: నీ పశువుల సంతానాన్ని
  rationale: జంతువులకు సంబంధించి פְּרִי వాటి పిల్లలను లేదా సంతానాన్ని సూచిస్తుంది; בְהֵמָה పెంపుడు పశువులను విస్తృతంగా సూచిస్తుంది.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: నీ నేల పంటను
  rationale: פְּרִי మరియు אֲדָמָה కలయిక భూమి ఇచ్చే వ్యవసాయ దిగుబడిని సూచిస్తుంది; ‘నేల పంట’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: עַד הִשָּׁמְדָךְ
  choice: చివరికి నిన్ను నాశనం చేస్తుంది
  rationale: ఈ పదబంధం తినివేసే చర్యకు అంతిమ హద్దుగా ఇశ్రాయేలు నాశనాన్ని పేర్కొంటుంది. తెలుగులో సహజ వాక్యప్రవాహం కోసం ఫలితార్థకంగా వ్యక్తం చేయబడింది.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: అది నీకు ... మిగలనివ్వదు
  rationale: శత్రువు ఏ వనరునూ ఉంచకుండా చేసే సంపూర్ణ హరణాన్ని ఈ ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
- source_word: דָּגָן
  choice: ధాన్యం
  rationale: ఈ పదం ఒకే రకమైన పంటను కాకుండా తృణధాన్యాన్ని సాధారణంగా సూచిస్తుంది.
- source_word: תִּירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: ఈ పదం తాజాగా ఉత్పత్తి చేసిన ద్రాక్షారసం లేదా కొత్త ద్రాక్షారసాన్ని సూచిస్తుంది; ‘కొత్త’ అనే విశేషణం దాని ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: יִצְהָר
  choice: నూనె
  rationale: ధాన్యం, ద్రాక్షారసం అనే వ్యవసాయ త్రయంలో ఇది ఆలివ్ నూనెను సూచిస్తుంది; సందర్భంలో ‘నూనె’ సరిపోతుంది.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: నీ పశువుల మందలోని దూడలను
  rationale: שְׁגַר పశువుల నుంచి పుట్టిన పిల్లలను సూచిస్తుంది; మందలోని పశువుల పిల్లలకు ‘దూడలు’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: నీ గొర్రెల మందలోని పిల్లలను
  rationale: అరుదైన עַשְׁתְּרֹת పదానికి ఖచ్చితమైన ఛాయ వివాదాస్పదమైనా, ఈ సమాంతర సందర్భంలో అది మంద యొక్క సంతానాన్ని లేదా ఉత్పాదక వృద్ధిని సూచిస్తుంది. ‘పిల్లలు’ గొర్రెపిల్లలు, మేకపిల్లలు రెండింటినీ చేర్చగలదు.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: నిన్ను నాశనం చేసేవరకు
  rationale: אבד యొక్క హిఫీల్ రూపం ‘నశింపజేయు’ అనే కారక భావాన్ని ఇస్తుంది; ‘నాశనం చేయు’ శాపవాక్య తీవ్రతను నిలుపుతుంది.
