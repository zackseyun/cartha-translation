  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: te
  text: నీవు మధ్యాహ్నంలో చీకటిలో అంధుడు తడుముకుంటున్నట్లుగా తడుముకుంటావు[a]; నీ మార్గాల్లో నీవు సఫలం కావు[b]. నీ దినములన్నిటిలో నీవు కేవలం అణచివేయబడుతూ, దోపిడీకి గురవుతూనే ఉంటావు; నిన్ను విడిపించేవాడు ఎవ్వరూ ఉండడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చేతులతో వెదుక్కుంటావు’; హీబ్రూ క్రియ చూడలేక స్పర్శ ద్వారా వెదకడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ మార్గాల్లో నీవు వర్ధిల్లవు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నిన్ను రక్షించేవాడు ఎవ్వరూ ఉండడు’ లేదా ‘విడిపించేవాడు ఎవ్వరూ ఉండడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: తడుముకుంటావు / తడుముకున్నట్లు
  rationale: చూడలేక చేతులతో వెదకడం అనే క్రియ యొక్క భౌతిక భావాన్ని, దానివల్ల కలిగే దిక్కుతోచని స్థితిని ‘తడుముకొను’ సహజంగా తెలియజేస్తుంది.
- source_word: בַּצָּהֳרַיִם
  choice: మధ్యాహ్న సమయంలో
  rationale: రోజులో వెలుగు అత్యధికంగా ఉండే సమయాన్ని సూచిస్తుంది; చీకటిలోని గుడ్డివానితో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הָעִוֵּר
  choice: గుడ్డివాడు
  rationale: హీబ్రూలోని పురుష ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. తెలుగు సందర్భంలో ‘గుడ్డివాడు’ ఆ రూపాన్నీ ఉపమానంలోని వ్యక్తిగత బలాన్నీ నిలుపుతుంది.
- source_word: בָּאֲפֵלָה
  choice: చీకటిలో
  rationale: చీకటి లేదా గాఢాంధకారాన్ని సూచించే పదానికి ఇది సహజమైన తెలుగు; మధ్యాహ్న వెలుగుతో వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: תַצְלִיחַ
  choice: సఫలం కావు
  rationale: హిఫిల్ రూపం విజయవంతమవడం లేదా వర్ధిల్లడాన్ని సూచిస్తుంది. ఇక్కడ ‘సఫలం కావు’ వ్యక్తి ప్రయత్నాలు, జీవనగతి రెండింటిలోనూ విజయం లేకపోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת דְּרָכֶיךָ
  choice: నీ మార్గాల్లో
  rationale: మూలంలోని ‘నీ మార్గాలు’ అనే రూపకాన్ని నిలుపుతూ, జీవన విధానం మరియు కార్యప్రయత్నాలు అనే విస్తృత భావానికి అవకాశం ఇస్తుంది.
- source_word: אַךְ
  choice: మాత్రమే
  rationale: ఈ అవ్యయం పరిమితి మరియు తీవ్రతను తెలియజేస్తుంది; వ్యక్తి పరిస్థితి అణచివేత, దోపిడీకే పరిమితమవుతుందని చూపుతుంది.
- source_word: עָשׁוּק
  choice: అణచివేయబడి
  rationale: పీడనకు, దౌర్జన్యానికి లేదా దోపిడీకి గురికావడాన్ని సూచించే కర్మణి భావాన్ని విస్తృతంగా అందిస్తుంది.
- source_word: גָזוּל
  choice: దోచుకోబడుతూ
  rationale: దొంగతనం లేదా బలవంతపు స్వాధీనంతో ఆస్తి పోగొట్టుకోవడాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; ‘అణచివేయబడి’తో సహజంగా జతకడుతుంది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లప్పుడూ
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు’; ఈ సందర్భంలో నిరంతరంగా కొనసాగడం అనే భావాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: నిన్ను రక్షించేవాడు ఎవడూ ఉండడు
  rationale: ఏ రక్షకుడూ లేకపోవడాన్ని వ్యక్తిగతంగా, స్పష్టంగా తెలియజేస్తుంది; ఇక్కడ సాధారణ అపాయం నుంచి విడిపించడం అనే భావమే ఉద్దేశం.
theological_decisions:
- issue: మెస్సీయ సంబంధం ప్రత్యక్షంగా లేని నిబంధన-శాప సందర్భంలో מוֹשִׁיעַ అనువాదం
  choice: రక్షించేవాడు
  alternative: విడిపించేవాడు / కాపాడేవాడు
  rationale: יָשַׁע మూలం సాధారణంగా రక్షించడం లేదా అపాయం నుంచి విడిపించడాన్ని సూచించగలదు. ఈ సందర్భంలో తరువాతి కాలపు ప్రత్యేక బిరుదు భావాన్ని చేర్చకుండా, సాధారణ రక్షణ భావాన్ని ‘రక్షించేవాడు’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని రెండవ పురుష ఏకవచనం, మధ్యాహ్నం–చీకటి వ్యత్యాసం, నిరంతర అణచివేత మరియు రక్షకుడు లేకపోవడం అనే తీవ్రతలను నిలుపుకుంది.
