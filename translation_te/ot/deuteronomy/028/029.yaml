revisions:
- from: నీవు మధ్యాహ్న సమయంలో కూడా, చీకటిలో గుడ్డివాడు తడుముకున్నట్లు తడుముకుంటావు[a]. నీ మార్గాల్లో నీవు సఫలం కావు[b]. నీవు ఎల్లప్పుడూ అణచివేయబడి, దోచుకోబడుతూ మాత్రమే ఉంటావు; నిన్ను రక్షించేవాడు ఎవడూ ఉండడు[c].
  to: నీవు మధ్యాహ్నంలో చీకటిలో అంధుడు తడుముకుంటున్నట్లుగా తడుముకుంటావు[a]; నీ మార్గాల్లో నీవు సఫలం కావు[b]. నీ దినములన్నిటిలో నీవు కేవలం అణచివేయబడుతూ, దోపిడీకి గురవుతూనే ఉంటావు; నిన్ను విడిపించేవాడు ఎవ్వరూ ఉండడు[c].
  rationale: The revision removes an added intensifier, uses neutral modern standard Telugu for the blind man, makes the robbery clause idiomatic, preserves the source’s ‘all the days’ duration, and regularizes the register in the final clause. Footnote anchors remain correctly attached to the relevant expressions.
