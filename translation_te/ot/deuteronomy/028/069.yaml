  text: אֵלֶּה֩ דִבְרֵ֨י הַ/בְּרִ֜ית אֲֽשֶׁר צִוָּ֧ה יְהוָ֣ה אֶת מֹשֶׁ֗ה לִ/כְרֹ֛ת אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ מוֹאָ֑ב מִ/לְּ/בַ֣ד הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת אִתָּ֖/ם בְּ/חֹרֵֽב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: te
  text: యాహ్వే మోషేకు మోయాబు దేశంలో ఇశ్రాయేలు కుమారులతో నిబంధన కుదుర్చుకోమని[a] ఆజ్ఞాపించిన నిబంధన మాటలు ఇవి; ఇవి యాహ్వే హోరేబులో వారితో కుదుర్చిన నిబంధనకు అదనం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారంలో అక్షరార్థంగా, “నిబంధనను కోయడం”; వచనం చివరలో కూడా అక్షరార్థంగా, “వారితో కోసిన నిబంధన.”
    reason: హీబ్రూ నిబంధన-స్థాపన నుడికారంలోని అక్షరార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: నిబంధన మాటలు ఇవి
  rationale: శీర్షికలాంటి హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో ఉంచుతూ, דִבְרֵי యొక్క ‘మాటలు/విషయవస్తువు’ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: నిబంధన కుదుర్చుకోవాలని / కుదిర్చిన
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధనను కోయడం’ అనే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘నిబంధన కుదుర్చుకోవడం’గా తెలిపింది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: ఈ పదబంధం సమూహార్థంలో ఉన్నప్పటికీ, మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని కనిపించేలా నిలుపుతుంది.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: మోయాబు దేశంలో
  rationale: భౌగోళిక సందర్భంలోని ‘దేశం’ అనే మూలపదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִלְּבַד
  choice: అదనంగా
  rationale: మోయాబులోని నిబంధన హోరేబు నిబంధనకు వేరైనదీ, దానికి తోడైనదీ అనే సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּחֹרֵב
  choice: హోరేబులో
  rationale: హీబ్రూ స్థలనామమైన హోరేబును సీనాయి అని సమన్వయపరచకుండా యథాతథంగా ఉంచింది.
theological_decisions:
- issue: బְּנֵי יִשְׂרָאֵל అనే సమూహపదబంధం
  choice: ఇశ్రాయేలు కుమారులతో
  alternative: ఇశ్రాయేలీయులతో / ఇశ్రాయేలు ప్రజలతో
  rationale: సందర్భంలో ఇది మొత్తం ప్రజాసమూహాన్ని సూచించినా, మూలంలోని లింగసూచక కుటుంబరూపాన్ని అనవసరంగా సమతలీకరించకుండా నిలుపుతుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున బిరుదును ఉపయోగించలేదు; ‘యెహోవా’ కంటే ‘యాహ్వే’ హీబ్రూ నామానికి సమీపమైన లిప్యంతరీకరణ.
- issue: హోరేబు నిబంధనతో మోయాబు నిబంధన సంబంధం
  choice: నిబంధనకు అదనంగా
  alternative: నిబంధనకు వేరుగా
  rationale: מִלְּבַד పదం రెండింటినీ వేరు చేస్తూనే అదనపు నిబంధన భావాన్ని అనుమతిస్తుంది; అవి పూర్తిగా సంబంధంలేనివని గానీ ఒకటేనని గానీ వ్యాఖ్యానాత్మకంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. పొడవైన హీబ్రూ సంబంధవాక్యాన్ని తెలుగులో సహజంగా చదవడానికి హోరేబు భాగాన్ని ముందుకు తెచ్చాం; భావసంబంధం మార్చలేదు.
