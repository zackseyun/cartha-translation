source:
  edition: WLC
  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: te
  text: ఈ శాపాలన్నీ నీ మీదికి వచ్చి, నిన్ను తరుమి పట్టుకుంటాయి—నీవు నాశనమయ్యే వరకు. ఎందుకంటే నీ దేవుడైన యాహ్వే మాట నీవు వినలేదు[a]; ఆయన నీకు ఆజ్ఞాపించిన ఆజ్ఞలను, కట్టడలను పాటించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మాటకు అక్షరార్థం, “నీ దేవుడైన యాహ్వే స్వరాన్ని నీవు వినలేదు.” ఇక్కడ “మాట వినడం” అంటే ఆయనకు లోబడి ఆయన ఆజ్ఞలను పాటించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: నీ మీదికి వచ్చి
  rationale: ఒడంబడిక హెచ్చరిక సందర్భంలో క్రియకు భవిష్యదర్థం ఉంది. ‘నీ మీదికి’ అనేది శాపాలు వ్యక్తిని ఆవరించే ప్రతికూల దిశాభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: ఈ శాపాలన్నీ
  rationale: ద్వితీయోపదేశకాండము 28లోని ఆశీర్వాదాలు–శాపాల సందర్భానికి ‘శాపాలు’ సూటిగా, స్పష్టంగా సరిపోతుంది.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: నిన్ను తరుమి పట్టుకుంటాయి
  rationale: ‘తరుము’ మరియు ‘చేరుకొని పట్టుకో/అందుకో’ అనే వరుస భావాలను సహజమైన తెలుగు జంటక్రియగా అందిస్తుంది; శాపాలనుంచి తప్పించుకోలేని భావాన్ని కాపాడుతుంది.
- source_word: עַד הִשָּׁמְדָךְ
  choice: నీవు నాశనమయ్యే వరకు
  rationale: హీబ్రూ క్రియానామ నిర్మాణంలోని అంతిమ ఫలితాన్ని, కర్తను ప్రత్యేకంగా నిర్ణయించకుండా, ఫలితార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: ఎందుకంటే ... మాట నీవు వినలేదు
  rationale: שׁמע בקול అనేది ‘మాట వినడం’ ద్వారా విధేయతను సూచించే ప్రయోగం. తెలుగు ‘మాట వినలేదు’ కూడా వినికిడి రూపకాన్నీ అవిధేయత భావాన్నీ సహజంగా కలుపుతుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, ఒడంబడిక సూత్రంలోని వ్యక్తిగత సంబంధాన్ని నిలుపుతుంది.
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: ఆయన ... ఆజ్ఞలను, కట్టడలను పాటించలేదు
  rationale: ‘కాపాడుట/పాటించుట’ అనే ఆచరణాత్మక విధేయతను తెలుగులో స్పష్టపరుస్తుంది. מצוה మరియు חק మధ్యనున్న పదభేదాన్ని ‘ఆజ్ఞలు’, ‘కట్టడలు’గా నిలుపుతుంది.
- source_word: אֲשֶׁר צִוָּךְ
  choice: ఆయన నీకు ఆజ్ఞాపించిన
  rationale: ఈ నియమాలకు దేవుడే ప్రత్యక్ష మూలమని సంబంధవాక్యం స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక పండిత లోకంలో సాధారణమైన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- issue: שׁמע בקול ను ‘వినడం’గా ఉంచాలా, ‘లోబడడం’గా విప్పి చెప్పాలా
  choice: మాట వినలేదు
  alternative: లోబడలేదు
  rationale: హీబ్రూ వినికిడి రూపకాన్ని నిలుపుతూ, తెలుగులో ‘మాట వినడం’కు సహజంగా ఉన్న విధేయత భావాన్నీ అందిస్తుంది. తరువాతి ‘పాటించలేదు’ అనే మాట ఆ ఆచరణాత్మక భావాన్ని స్పష్టపరుస్తుంది.
- issue: לִשְׁמֹר యొక్క సంబంధాన్ని ప్రయోజనార్థకంగా లేదా వివరణాత్మకంగా చూపడం
  choice: ప్రత్యేక సమాంతర వాక్యంగా ‘పాటించలేదు’
  alternative: ‘పాటించడానికి ... వినలేదు’
  rationale: హీబ్రూ infinitive విధేయత యొక్క విషయాన్ని లేదా ఆచరణను వివరించగలదు. తెలుగులో ప్రయోజనార్థక నిర్మాణం కృత్రిమంగా లేదా తప్పుగా వినిపించే అవకాశం ఉన్నందున, అర్థసంబంధాన్ని స్పష్టంగా ఉంచే సమాంతర వాక్యం వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ఒడంబడిక హెచ్చరిక స్వరం నిలుపబడింది. రెండవ పురుష ఏకవచన రూపాలు వాడబడ్డాయి. సాధారణ పాఠకులకు అర్థమయ్యేలా వాక్యనిర్మాణం సహజీకరించబడినా, ‘శాపాలు’, ‘ఆజ్ఞలు’, ‘కట్టడలు’ వంటి న్యాయ–ఒడంబడిక పదజాలం భేదాలతో నిలుపబడింది.
