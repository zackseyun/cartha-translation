id: DEU.28.13
reference: Deuteronomy 28:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: te
  text: యెహోవా నిన్ను తలగా చేస్తాడు, తోకగా కాదు; నీవు పైనే ఉంటావు, కింద ఉండవు—ఈ రోజు వాటిని పాటించమని, ఆచరించమని నేను నీకు ఆజ్ఞాపిస్తున్న నీ దేవుడైన యెహోవా ఆజ్ఞలను నీవు వింటే[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ దేవుడైన యెహోవా ఆజ్ఞలకు విధేయత చూపితే.’ హెబ్రీయ పదబంధం అక్షరార్థంగా ‘వింటే’ అని చెబుతుంది; ఈ నిబంధన సందర్భంలో అది విధేయంగా వినడాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: యెహోవా నిన్ను ...గా చేస్తాడు
  rationale: נתן అనే క్రియకు ‘ఇవ్వు/ఉంచు/నియమించు’ అనే మూలార్థాలు ఉన్నా, ‘తలగా, తోకగా కాదు’ అనే విధేయపూరకాలతో ఇక్కడ ఒక స్థితిలో ఉంచడం లేదా చేయడం అనే కారణార్థం ఉంది. ఆధునిక తెలుగులో ‘చేస్తాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: తలగా ... తోకగా కాదు
  rationale: ప్రాముఖ్యత, నాయకత్వం మరియు అప్రాముఖ్యతను సూచించే హెబ్రీయ రూపకాన్ని చదును చేయకుండా యథాతథంగా నిలుపుతుంది.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: నీవు పైనే ఉంటావు, కింద ఉండవు
  rationale: רק లోని ప్రత్యేకతను ‘-నే’ తెలియజేస్తుంది; ‘పైన/కింద’ అనే జంట సామాజిక స్థితిని సూచించే మూలంలోని ప్రాదేశిక రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי תִשְׁמַע אֶל
  choice: వాటిని వింటే
  rationale: ఈ ఆశీర్వాద సందర్భంలో כִּי షరతును పరిచయం చేస్తుంది. שמע אל అక్షరార్థంగా ‘విను’; నిబంధన సందర్భంలో విధేయంగా వినడం దాని భావంలో భాగం. ‘పాటించి అమలు చేయడానికి’ అనే తరువాతి పదబంధం ఆ విధేయతను స్పష్టం చేస్తుంది.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: מצוה కు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థం ‘ఆజ్ఞ’; బహువచనం నిబంధన నియమాలను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: దైవనామంతో కలిసిన నిబంధన సంబంధ సూచనను సహజమైన తెలుగులో ‘నీ దేవుడైన యెహోవా’గా అందిస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: అంటే నేను ఈ రోజు నీకు ఆజ్ఞాపిస్తున్నవాటిని
  rationale: మోషే ప్రస్తుతం ఇస్తున్న ఆజ్ఞలనే సూచించే సంబంధాన్ని ‘అంటే’ స్పష్టం చేస్తుంది; వర్తమాన కొనసాగింపు భావాన్ని ‘ఆజ్ఞాపిస్తున్న’ నిలుపుతుంది; ‘ఈ రోజు’ను విడిచిపెట్టదు.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటించి అమలు చేయడానికి
  rationale: שמר లోని శ్రద్ధగా కాపాడి పాటించే భావాన్ని, עשה లోని కార్యరూపంలో చేసే భావాన్ని వేర్వేరుగా నిలుపుతుంది. తెలుగు వాక్యప్రవాహం కోసం సమన్విత క్రియారూపం వాడబడింది.
theological_decisions:
- issue: כִּי ద్వారా పరిచయమయ్యే నిబంధన షరతు
  choice: వింటే
  alternative: వింటున్నందున / విధేయత చూపితే
  rationale: ద్వితీయోపదేశకాండము 28లోని ఆశీర్వాదాల నిర్మాణంలో ఇది కారణ ప్రకటనకన్నా షరతుగా పనిచేస్తుంది. అయితే שמע లోని ‘వినడం’ను నేరుగా ‘విధేయత చూపడం’గా మార్చకుండా, మూలంలోని వినికిడి రూపాన్ని నిలిపి, తరువాతి ‘పాటించి అమలు చేయడానికి’ ద్వారా విధేయ భావాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘తల/తోక,’ ‘పైన/కింద’ రూపకాలు నిలుపబడ్డాయి. ఏకవచన ‘నీవు/నీ’ ద్వారా ఇశ్రాయేలును సమష్టిగా సంబోధించే హెబ్రీయ రూపం ప్రతిబింబించబడింది.
