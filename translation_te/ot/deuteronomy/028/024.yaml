id: DEU.28.24
reference: Deuteronomy 28:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִתֵּ֧ן יְהוָ֛ה אֶת מְטַ֥ר אַרְצְ/ךָ֖ אָבָ֣ק וְ/עָפָ֑ר מִן הַ/שָּׁמַ֨יִם֙ יֵרֵ֣ד עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: te
  text: యాహ్వే నీ దేశానికి కురిసే వర్షాన్ని ధూళిగాను మట్టిపొడిగాను[a] చేస్తాడు; ఆకాశం నుండి అది నీ మీద పడుతూ, నీవు నాశనమయ్యే వరకు కొనసాగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధూళిగాను మట్టిగాను.’ హీబ్రూలో పొడిగా, రేణువుల రూపంలో ఉండే పదార్థాన్ని సూచించే రెండు సమీపార్థక పదాలు ఉన్నాయి; వర్షం కరువుగా, వినాశనంగా మారే చిత్రాన్ని ఈ జంట తీవ్రతరం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: יִתֵּן
  choice: చేస్తాడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘ఇస్తాడు’ అయినా, ఈ సందర్భంలో వర్షం స్థానంలో ధూళి, మట్టిపొడి కలిగేలా చేయడాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מְטַר אַרְצְךָ
  choice: నీ దేశపు వర్షాన్ని
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: אָבָק
  choice: ధూళి
  rationale: గాలిలో ఎగిరే సన్నని పొడి పదార్థాన్ని సూచించే సాధారణ తెలుగు పదం.
- source_word: וְעָפָר
  choice: మట్టిపొడి
  rationale: మొదటి పదమైన ‘ధూళి’తో ఉన్న సమీపార్థక జంటను, రెండింటినీ ఒకే పదంగా కలపకుండా నిలుపుతుంది.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూలో రూపపరంగా బహువచనం ఉన్నప్పటికీ, ఈ వాతావరణ సందర్భంలో ఆధునిక తెలుగులో సహజమైన భావసమాన రూపం.
- source_word: יֵרֵד עָלֶיךָ
  choice: అది ... నీ మీదికి దిగివస్తుంది
  rationale: ఏకవచన క్రియను నిలుపుతూ, ముందున్న శాపకర పదార్థం పైనుండి పడే దృశ్యాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַד הִשָּׁמְדָךְ
  choice: నీవు నాశనమయ్యే వరకు
  rationale: కర్తను మూలంలో లేనంత స్పష్టంగా చేర్చకుండా, శాపం చేరే అంతిమ ఫలితాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. మూలంలోని శాపవాక్య తీవ్రతను, సమీపార్థక పదజంటను, చివరి ఫలితంలోని వ్యాకరణ అస్పష్టతను సాధ్యమైనంతవరకు నిలిపింది.
