revisions:
- from: యెహోవా నీ దేశపు వర్షాన్ని ధూళిగాను మట్టిపొడిగాను[a] చేస్తాడు; నీవు నాశనమయ్యే వరకు అది ఆకాశం నుండి నీ మీదికి దిగివస్తుంది.
  to: యాహ్వే నీ దేశానికి కురిసే వర్షాన్ని ధూళిగాను మట్టిపొడిగాను[a] చేస్తాడు; ఆకాశం నుండి అది నీ మీద పడుతూ, నీవు నాశనమయ్యే వరకు కొనసాగుతుంది.
  rationale: The revision aligns the divine name with the project’s Yahweh policy, makes the agricultural sense of “rain of your land” explicit in idiomatic Telugu, and uses a natural Telugu expression for the dust and soil descending upon the addressee. The passive final result retains the compactness of the Hebrew/English audit rendering without imposing an explicit subject in the final clause. The footnote now gives a precise Telugu lexical alternative for the second paired term.
