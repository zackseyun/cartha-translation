    issue: ‘నీవు భయానకంగా మారతావు’లో לְזַעֲוָה యొక్క నామవాచక/వస్తుగత భావం తక్కువగా కనిపిస్తోంది.
    rationale: హీబ్రూ పదం ఇతర రాజ్యాలకు భయం లేదా దిగ్భ్రాంతి కలిగించే వస్తువు, దృశ్యం, లేదా భీతికరమైన ఉదాహరణ అనే భావాన్ని ఇస్తుంది. ‘భయానకమైన దృశ్యంగా మారతావు’ ఈ భావాన్ని తెలుగులో సహజంగా, నిర్దిష్టతను అతిగా పెంచకుండా వ్యక్తం చేస్తుంది.
