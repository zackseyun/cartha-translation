id: DEU.28.25
reference: Deuteronomy 28:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִתֶּנְ/ךָ֨ יְהוָ֥ה נִגָּף֮ לִ/פְנֵ֣י אֹיְבֶי/ךָ֒ בְּ/דֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔י/ו וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְ/פָנָ֑י/ו וְ/הָיִ֣יתָ לְ/זַעֲוָ֔ה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: te
  text: యాహ్వే నిన్ను నీ శత్రువుల ఎదుట ఓటమికి అప్పగిస్తాడు. నీవు ఒకే మార్గంలో వారిపైకి బయలుదేరతావు; కానీ ఏడు మార్గాల్లో వారి ఎదుటనుండి పారిపోతావు. భూమిమీదున్న రాజ్యాలన్నిటికీ నీవు భయానకమైన దృశ్యంగా[a] మారతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భయానికి కారణమైన దానిగా.” హీబ్రూ పదం భయాన్ని లేదా దిగ్భ్రాంతిని కలిగించే దానిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: నిన్ను ... ఓటమికి అప్పగిస్తాడు
  rationale: נתן యొక్క ‘అప్పగించు’ భావాన్నీ, נִגָּף సూచించే సైనిక ఓటమి ఫలితాన్నీ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా అందిస్తుంది.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: నీ శత్రువుల ఎదుట
  rationale: హీబ్రూ పదబంధంలోని ‘ఎదుట’ అనే యుద్ధసందర్భ భావాన్ని నిలుపుతుంది.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ఒకే మార్గంలో
  rationale: ఏకీకృతంగా ముందుకు వెళ్లడాన్ని చూపుతూ, తరువాతి ‘ఏడు మార్గాల్లో’ అనే వ్యతిరేక సమాంతరతను కాపాడుతుంది.
- source_word: תֵּצֵא אֵלָיו
  choice: వారిపైకి బయలుదేరతావు
  rationale: యుద్ధసందర్భంలో ‘వారిపైకి వెళ్లడం’ అనే అర్థాన్ని స్పష్టంగా ఇస్తుంది; హీబ్రూలోని సమూహాన్ని సూచించే ఏకవచన సర్వనామాన్ని సహజ తెలుగులో బహువచనంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: ఏడు మార్గాల్లో
  rationale: సంపూర్ణంగా చెదరిపోవడాన్ని సూచించగల సంఖ్యాత్మక రూపకాన్ని వివరించి మార్చకుండా అలాగే నిలుపుతుంది.
- source_word: תָּנוּס לְפָנָיו
  choice: వారి ఎదుటనుండి పారిపోతావు
  rationale: נוס యొక్క ‘పారిపోవు’ భావాన్నీ, యుద్ధంలో శత్రువుల సమక్షం నుంచి వెనుదిరిగే చిత్రాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: నీవు భయానకంగా మారతావు
  rationale: זַעֲוָהలోని భయం, దిగ్భ్రాంతి కలిగించే స్థితి లేదా దృశ్యం అనే భావాన్ని సంక్షిప్తంగా ఇస్తూ, అది అనుభవించిన భయమా లేక ఇతరులకు భయం కలిగించే వస్తువా అన్న స్వల్ప భావవ్యాప్తిని పూర్తిగా మూసివేయదు.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: భూమిమీదున్న రాజ్యాలన్నిటికీ
  rationale: ఇక్కడ הארץకు ఉన్న విస్తృత అంతర్జాతీయ పరిధిని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: לְזַעֲוָהలోని శాపచిత్రం
  choice: భయానకంగా
  alternative: భయానికి కారణమైన దానిగా / భీతిగా
  rationale: ఇశ్రాయేలు ఇతర రాజ్యాలకు దిగ్భ్రాంతికరమైన దృశ్యంగా లేదా భయకారణంగా మారే భావాన్ని, తరువాతి సిద్ధాంతపరమైన వర్గాలను చేర్చకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఏకవచనంగా సంబోధించబడుతున్న ఇశ్రాయేలును ‘నీవు’గా నిలిపి, సమూహవాచక శత్రువులను సహజ తెలుగులో ‘వారు’గా సూచించాం. హీబ్రూ సమాంతరత కోసం ‘ఒకే మార్గంలో / ఏడు మార్గాల్లో’ రూపాన్ని కాపాడాం.
