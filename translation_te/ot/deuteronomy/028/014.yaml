id: DEU.28.14
reference: Deuteronomy 28:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: te
  text: నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న మాటల నుండి కుడికిగానీ ఎడమకుగానీ తొలగిపోయి, ఇతర దేవుళ్లను అనుసరించడానికి[a] వారికి సేవ చేయవద్దు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, ‘వారి వెనుక వెళ్లడం’; అంటే, ‘వారిని అనుసరించడం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారిని ఆరాధించడం.’ ఈ క్రియ దేవతలకు చేసే సేవను సూచిస్తుంది; కాబట్టి ఆరాధన భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: తొలగిపోకండి
  rationale: సוּר అనే క్రియకు పక్కకు తొలగడం, నిర్దేశించిన మార్గం నుంచి మళ్లడం అనే భావాలు ఉన్నాయి. నిషేధార్థక సందర్భంలో ‘తొలగిపోకండి’ సహజంగా ఉండి, ఆజ్ఞల నుంచి వైదొలగకూడదనే నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: מִכָּל הַדְּבָרִים
  choice: మాటలలో దేనినుండీ
  rationale: నిషేధంతో కూడిన מִכָּל ఇక్కడ ‘ఏ ఒక్కదానినుండీ’ అనే సమగ్ర భావాన్ని ఇస్తుంది. דְּבָרִים కు నేరుగా ‘మాటలు’ అని ఉంచి, వాటి ఆజ్ఞాత్మక స్వభావాన్ని తరువాతి ఉపవాక్యం తెలియజేస్తుంది.
- source_word: מְצַוֶּה
  choice: ఆజ్ఞాపిస్తున్న
  rationale: హీబ్రూ కృదంతం మోషే ప్రస్తుతం చేస్తున్న ప్రసంగంలోని కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘ఆజ్ఞాపిస్తున్న’ ఆ తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: నిబంధన పునరుద్ధరణ ప్రసంగంలోని ప్రస్తుతకాల తక్షణత్వాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు రూపం.
- source_word: יָמִין וּשְׂמֹאול
  choice: కుడికిగానీ ఎడమకుగానీ
  rationale: ఏ దిశలోనూ నిర్దేశిత మార్గం నుంచి మళ్లకూడదనే స్థలరూపకాన్ని తెలుగులో స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: అనుసరించి
  rationale: ‘వెనుక వెళ్లడం’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన సమానార్థకం ‘అనుసరించడం’; ఇది ఇతర దేవతల పట్ల విధేయత చూపే సందర్భార్థాన్ని అతిగా వివరించకుండా తెలియజేస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: మూలంలోని సాధారణ పదబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘అన్య దేవతలు’ వంటి మతపరంగా స్థిరపడిన లేదా ‘విదేశీ దేవుళ్లు’ వంటి వ్యాఖ్యాత్మక పదాలను నివారిస్తుంది.
- source_word: לְעָבְדָם
  choice: వారికి సేవ చేయడం
  rationale: עבד దేవతలకు సంబంధించి సేవను, ఆరాధనాత్మక విధేయతను సూచించగలదు. ‘సేవ చేయడం’ విస్తృతమైన మూలార్థాన్ని నిలుపుతుంది; ‘ఆరాధించడం’ సందర్భానుగుణ ప్రత్యామ్నాయం.
theological_decisions:
- issue: నిబంధన హెచ్చరికలో ఇతర దేవతల ప్రస్తావన
  choice: ఇతర దేవుళ్లు
  alternative: విదేశీ దేవుళ్లు / అన్య దేవతలు
  rationale: వాక్యం ఇతర దేవుళ్ల అస్తిత్వ స్వభావాన్ని వివరించదు; వారి వెంట వెళ్లి సేవ చేయడాన్ని మాత్రమే నిషేధిస్తుంది. అందువల్ల మూలపాఠంలోని వాక్చాతుర్యాన్ని నిలిపి, వాక్యం పరిష్కరించని తాత్త్విక ప్రశ్నను అనువాదంలో పరిష్కరించలేదు.
- issue: עבד యొక్క మతపరమైన భావవ్యాప్తి
  choice: సేవ చేయడం
  alternative: ఆరాధించడం
  rationale: ‘సేవ’ అనే అనువాదం మతపరమైన విధేయతతో పాటు ఆరాధనాత్మక కార్యాన్ని కూడా కలిగి ఉండగల మూలక్రియ యొక్క విస్తృతిని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను వాడాం. హీబ్రూ వాక్యంలోని ఒకే నిషేధ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు సమన్విత నిషేధ క్రియలుగా వ్యక్తం చేశాం. స్థలరూపకమైన ‘కుడి/ఎడమ’ను నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
