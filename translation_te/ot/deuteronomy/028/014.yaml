revisions:
- from: నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న మాటలలో దేనినుండీ కుడికిగానీ ఎడమకుగానీ తొలగిపోకండి; ఇతర దేవుళ్లను అనుసరించి[a] వారికి సేవ చేయకండి.[b]
  to: నేను ఈ రోజు మీకు ఆజ్ఞాపిస్తున్న మాటల నుండి కుడికిగానీ ఎడమకుగానీ తొలగిపోయి, ఇతర దేవుళ్లను అనుసరించడానికి[a] వారికి సేవ చేయవద్దు.[b]
