  text: מִ/תֵּ֣ת לְ/אַחַ֣ד מֵ/הֶ֗ם מִ/בְּשַׂ֤ר בָּנָי/ו֙ אֲשֶׁ֣ר יֹאכֵ֔ל מִ/בְּלִ֥י הִשְׁאִֽיר ל֖/וֹ כֹּ֑ל בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בְּ/כָל שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: te
  text: నీ శత్రువు నీ పట్టణాలన్నిటిలో[a] నీకు కలిగించే ముట్టడిలోను సంకటంలోను, తనకోసం ఏదీ మిగలకపోవడం వల్ల, తాను తింటున్న తన కుమారుల మాంసంలో కొంచెమైనా వారిలో ఎవరికీ ఇవ్వడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘నీ గుమ్మాలన్నిటిలో’; ఇక్కడ ‘గుమ్మాలు’ అనే మాట పట్టణాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: వారిలో ఎవరికీ ఇవ్వడు
  rationale: మునుపటి వచనంలోని వాక్యాన్ని కొనసాగిస్తూ, తీవ్రమైన కొరతలో తన సన్నిహితులకు కూడా పంచకుండా నిరాకరించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִבְּשַׂר בָּנָיו
  choice: తన కుమారుల మాంసంలో కొంచెమైనా
  rationale: בָּשָׂר అనే స్పష్టమైన ‘మాంసం’ పదాన్నీ, בָּנָיו లోని పురుషలింగ ‘కుమారులు’ అర్థాన్నీ నిలుపుతూ, מִן యొక్క విభాజక భావాన్ని ‘కొంచెమైనా’తో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יֹאכֵל
  choice: తాను తింటున్న
  rationale: ముట్టడి దృశ్యంలోని కొనసాగుతున్న భయానక చర్యను తెలుగు వర్తమాన కృదంత రూపంతో సజీవంగా చూపిస్తుంది.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: అతనికి ఏమీ మిగలదు కాబట్టి
  rationale: ఏదీ మిగిలి లేకపోవడం పంచకపోవడానికి కారణమనే సందర్భార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: ముట్టడిలో ... విపత్కర పరిస్థితిలో
  rationale: మొదటి పదంలోని సైనిక ముట్టడి భావాన్నీ, రెండవ పదంలోని తీవ్రమైన ఇరుకు, బాధ, దురవస్థ భావాన్నీ వేరు చేసి నిలుపుతుంది.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: నీ శత్రువు నిన్ను ఇరికించే
  rationale: צוּק హిఫీల్ రూపంలోని గట్టిగా నొక్కడం, ఇరుకున పెట్టడం అనే భావాన్ని ముట్టడి సందర్భానికి తగినట్లు అందిస్తుంది; సాధారణ ‘బాధించడం’ కంటే మూలంలోని ఒత్తిడి రూపకాన్ని కాపాడుతుంది.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: నీ పట్టణాలన్నిటిలో
  rationale: ‘నీ గుమ్మాలన్నిటిలో’ అనే అక్షరార్థం ఇక్కడ పట్టణాలను సూచించే హీబ్రూ లక్షణప్రయోగం. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశిత అర్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా అర్థమయ్యే శైలి. శాపవాక్యంలోని భయానకతను మెత్తబరచకుండా ‘కుమారుల మాంసం’ అని స్పష్టంగా ఉంచాం. వచనం మునుపటి వాక్యాన్ని కొనసాగిస్తున్నప్పటికీ, తెలుగులో స్వతంత్రంగా చదవదగిన క్రమంలో పునర్వ్యవస్థీకరించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
