    text: 'మరింత అక్షరార్థంగా: “నీ కళ్లకు కనిపించే దృశ్యం వల్ల నీవు పిచ్చివాడవుతావు.”'
    reason: lexical_alternative
  revision_rationale: The revision corrects the Telugu predicate so that it directly addresses the singular addressee and expresses the future consequence in the curse sequence. It retains the causal relationship and the source's intentional eye/seeing emphasis. The footnote is revised for grammatical Telugu while offering a closer alternative expression.
