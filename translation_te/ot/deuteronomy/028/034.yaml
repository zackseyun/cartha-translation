- from: నీ కళ్లతో నీవు చూసే దృశ్యం వల్ల నీకు పిచ్చిపడుతుంది.[a]
  to: నీ కళ్లతో నీవు చూసే దృశ్యం వల్ల నీవు పిచ్చివాడవుతావు.[a]
  rationale: The revision corrects the Telugu predicate so that it directly addresses the singular addressee and expresses the future consequence in the curse sequence. It retains the causal relationship and the source's intentional eye/seeing emphasis. The footnote is revised for grammatical Telugu while offering a closer alternative expression.
  reviewer_model: gpt-5.6-terra
