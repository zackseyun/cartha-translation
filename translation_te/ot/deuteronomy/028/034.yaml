  edition: WLC
  text: וְ/הָיִ֖יתָ מְשֻׁגָּ֑ע מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/034.yaml
  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: te
  text: నీ కళ్లతో నీవు చూసే దృశ్యం వల్ల నీవు పిచ్చివాడవుతావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నీ కళ్లకు కనిపించే దృశ్యం వల్ల నీవు పిచ్చివాడవుతావు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: నీకు ... పడుతుంది
  rationale: శాపాల వరుసలో ఈ రూపం భవిష్యత్తులో కలిగే ఫలితాన్ని సూచిస్తుంది. తెలుగులో ‘నీకు ... పడుతుంది’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מְשֻׁגָּע
  choice: పిచ్చిపడుతుంది
  rationale: שׁגע మూలానికి చెందిన ఈ రూపం మతిస్థిమితం కోల్పోయే ఫలితస్థితిని సూచిస్తుంది. ‘పిచ్చిపడుతుంది’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, కారణంగా కలిగే ఉన్మాదాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִמַּרְאֵה
  choice: దృశ్యం వల్ల
  rationale: ఇక్కడ מִן కారణార్థకంగా ఉంది. ‘వల్ల’ ఆ కారణసంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; מַרְאֶהకు ‘దృశ్యం’ తగిన సమానార్థకం.
- source_word: עֵינֶיךָ
  choice: నీ కళ్లతో
  rationale: హీబ్రూలోని శరీరాంగ సూచనను నిలుపుతూ, తెలుగులో చూడటానికి సాధనార్థకంగా సహజమైన రూపాన్ని ఉపయోగించింది.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: నీవు చూసే
  rationale: సంబంధవాక్యాన్ని నేరుగా నిలుపుతుంది. ‘కళ్లతో ... చూసే’ అనే పునరుక్తి హీబ్రూ వాక్యంలోని దృశ్యానుభవపు తీవ్రతను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ఏకవచన సంబోధనను ‘నీ/నీవు’తో కాపాడింది; హీబ్రూలోని చూడటం-కళ్లు అనే ఉద్దేశపూర్వక పునరుక్తిని పూర్తిగా తొలగించలేదు.
