review_pass:
  verdict: revise
  source_fidelity: 'The verse accurately conveys the Hebrew contrast: the ger residing within Israel rises progressively above the addressee, while the addressee progressively declines. “నీకంటే” appropriately expresses the comparative force of עָלֶיךָ in this context, and the repeated “అంతకంతకు” preserves the intensification of מַעְלָה מָּעְלָה / מַטָּה מָּטָּה.'
  naturalness: The main translation is natural modern standard Telugu and retains the solemn curse-context register. “నీవేమో” is understandable, but “నీవు మాత్రం” is slightly more polished in this formal register.
  terminology: “పరదేశి” is a suitable rendering of הַגֵּר, provided the note clarifies that this is a non-native resident among Israel, not merely a passing traveler. The existing footnote has an avoidable person mismatch (“మీ” rather than “నీ”) and its alternative wording is less natural than necessary.
  issues:
  - severity: low
    issue: Footnote shifts from singular to plural address.
    rationale: The verse addresses Israel in singular form (בְּקִרְבְּךָ; “నీ”). The note’s “మీ మధ్య” is inconsistent with that form.
  - severity: low
    issue: Footnote alternative “స్థిరపడి నివసించే అన్యుడు” is somewhat cumbersome.
    rationale: It can be made more concise and natural while retaining the lexical point that גֵּר is a non-native resident within Israel’s community.
  revised_text: నీ మధ్య నివసిస్తున్న పరదేశి[a] నీకంటే అంతకంతకు పైకి ఎదుగుతాడు; నీవు మాత్రం అంతకంతకు కిందికి దిగజారుతావు.
