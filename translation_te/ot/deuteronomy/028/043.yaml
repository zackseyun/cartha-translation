language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/גֵּר֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/ךָ֔ יַעֲלֶ֥ה עָלֶ֖י/ךָ מַ֣עְלָ/ה מָּ֑עְלָ/ה וְ/אַתָּ֥ה תֵרֵ֖ד מַ֥טָּה מָּֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: te
  text: నీ మధ్య నివసిస్తున్న పరదేశి[a] నీకంటే అంతకంతకు పైకి ఎదుగుతాడు; నీవు మాత్రం అంతకంతకు కిందికి దిగజారుతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మధ్య నివసించే అన్యుడు” లేదా “వలసవాసి.” హీబ్రూ గֵּר పదం ఇశ్రాయేలు మధ్య నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసిస్తున్న స్థానికేతరుణ్ణి సూచించే גֵּר భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది. ఇది కేవలం తాత్కాలిక ప్రయాణికుడని లేదా పౌరసత్వానికి సంబంధించిన సాంకేతిక హోదా అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: నీ మధ్య నివసిస్తున్న
  rationale: ఆ వ్యక్తి ఇశ్రాయేలు సమాజం లోపల నివసిస్తున్నాడనే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: నీకంటే ... పైకి ఎదుగుతాడు
  rationale: עלה మరియు על కలిపి సూచించే తులనాత్మక స్థాయి పెరుగుదలను నిలుపుతుంది; దానిని ఆర్థిక, రాజకీయ లేదా సామాజిక రంగానికే పరిమితం చేయదు.
- source_word: מַעְלָה מָּעְלָה
  choice: అంతకంతకు పైకి
  rationale: హీబ్రూ పదపునరుక్తి తెలిపే క్రమమైన, తీవ్రమవుతున్న ఎదుగుదలను సహజ తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: וְאַתָּה
  choice: నీవేమో
  rationale: సాధారణ సముచ్చయాన్ని పూర్తిగా విస్మరించకుండా, సందర్భంలోని స్పష్టమైన వ్యత్యాసాన్ని సహజ తెలుగులో చూపిస్తుంది.
- source_word: תֵרֵד
  choice: దిగజారుతావు
  rationale: עלהకు వ్యతిరేకమైన ירד రూపకాన్ని తెలుగులో స్థాయి లేదా పరిస్థితి క్షీణతగా సహజంగా తెలియజేస్తుంది.
- source_word: מַטָּה מָּטָּה
  choice: అంతకంతకు కిందికి
  rationale: మూలంలోని పునరుక్తి, పైకి–కిందికి అనే సమాంతర వ్యత్యాసం రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: శాప సందర్భంలోని సామాజిక-నిబంధనాత్మక హోదా తారుమారు
  choice: ఇశ్రాయేలు మధ్య నివసించే స్థానికేతరుడు ఇశ్రాయేలుకంటే పైకి ఎదగడం, ఇశ్రాయేలు కిందికి దిగజారడం అనే విస్తృత హోదా తారుమారుగా అనువదించడం.
  alternative: దీనిని కేవలం ఆర్థిక ఎదుగుదల-క్షీణతగా లేదా కేవలం రాజకీయ ఆధిపత్యంగా నిర్దిష్టపరచడం.
  rationale: పైకి ఎదగడం, కిందికి దిగడం అనే హీబ్రూ రూపకాలు ఉద్దేశపూర్వకంగా విస్తృతమైనవి. అందువల్ల మూలం పేర్కొనని ఒక్క రంగానికి భావాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ఏకవచన సంబోధనను నిలిపి, హీబ్రూ వాక్యంలోని పైకి–కిందికి సమాంతరతను స్పష్టంగా ఉంచింది.
