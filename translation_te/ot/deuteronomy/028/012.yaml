revisions:
- from: యెహోవా నీ కోసం తన మంచి గిడ్డంగిని[a], అంటే ఆకాశాన్ని, తెరిచి, తగిన కాలంలో నీ దేశానికి వర్షం కురిపిస్తాడు; నీ చేతి పనులన్నిటినీ ఆశీర్వదిస్తాడు. నీవు అనేక జనాలకు అప్పు ఇస్తావు, కానీ నీవు అప్పు తీసుకోవు.
  to: యాహ్వే తన మంచి గిడ్డంగియైన ఆకాశాన్ని నీకోసం తెరిచి, తగిన కాలంలో నీ దేశంపై వర్షం కురిపిస్తాడు; నీ చేతిపనులన్నిటినీ ఆశీర్వదిస్తాడు. నీవు అనేక జనాంగాలకు అప్పు ఇస్తావు, కానీ నీవు అప్పు తీసుకోవు.
  rationale: సవరించిన పాఠం మూలంలోని ఆకాశం-భాండాగారం రూపకాన్ని, కాలానుసార వర్షాన్ని, శ్రమపై ఆశీర్వాదాన్ని, అప్పు ఇవ్వడం–తీసుకోవడం మధ్య వ్యత్యాసాన్ని కాపాడుతుంది. దైవనామం POB ఆడిట్ ట్రయిల్‌తో సమన్వయంగా ‘యాహ్వే’గా చేయబడింది; జాతీయ అర్థం మరియు సహజ తెలుగు ప్రయోగం స్పష్టపరచబడ్డాయి. పాదసూచికలోని ప్రత్యామ్నాయ అర్థం యథాతథంగా నిలిపబడింది.
