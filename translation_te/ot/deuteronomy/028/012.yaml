id: DEU.28.12
reference: Deuteronomy 28:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: te
  text: యాహ్వే తన మంచి గిడ్డంగియైన ఆకాశాన్ని నీకోసం తెరిచి, తగిన కాలంలో నీ దేశంపై వర్షం కురిపిస్తాడు; నీ చేతిపనులన్నిటినీ ఆశీర్వదిస్తాడు. నీవు అనేక జనాంగాలకు అప్పు ఇస్తావు, కానీ నీవు అప్పు తీసుకోవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’గా నేరుగా సూచిస్తుంది.
- source_word: יִפְתַּח
  choice: తెరిచి
  rationale: ఆశీర్వాద సందర్భంలోని భవిష్యత్ భావాన్ని తరువాతి క్రియలతో సహజమైన తెలుగు వాక్యనిర్మాణంలో కలుపుతూ, తెరవడం అనే స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: తన మంచి గిడ్డంగిని
  rationale: אוֹצָר అనే పదానికి గిడ్డంగి లేదా ఖజానా అనే అర్థాలు ఉన్నాయి; వర్షం, వ్యవసాయం సందర్భంలో ‘గిడ్డంగి’ సహజంగా సరిపోతుంది. ‘మంచి’ అనే విశేషణాన్ని అలాగే ఉంచింది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశాన్ని
  rationale: ఇది ముందు చెప్పిన గిడ్డంగిని వివరిస్తున్న సమానాధికరణ పదం. వర్షం సందర్భంలో ఆధునిక తెలుగులో ‘ఆకాశం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לָתֵת מְטַר אַרְצְךָ בְּעִתּוֹ
  choice: తగిన కాలంలో నీ దేశానికి వర్షం కురిపిస్తాడు
  rationale: హీబ్రూ ఉద్దేశార్థక నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, వర్షానికి సంబంధించిన కాలానుకూలతను నిలుపుతుంది. ‘దేశం’ ఇక్కడ ఇశ్రాయేలు భూభాగాన్ని సూచిస్తుంది.
- source_word: וּלְבָרֵךְ אֵת כָּל מַעֲשֵׂה יָדֶךָ
  choice: నీ చేతి పనులన్నిటినీ ఆశీర్వదిస్తాడు
  rationale: ‘చేతి పని’ అనే హీబ్రూ ఏకవచన రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతూ, సమస్త శ్రమను సూచిస్తుంది.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: నీవు అనేక జనాలకు అప్పు ఇస్తావు
  rationale: లוה యొక్క హిఫీల్ రూపం ఇక్కడ అప్పు ఇవ్వడాన్ని సూచిస్తుంది. גּוֹיִםకు ఈ జాతీయ-నిబంధన సందర్భంలో ‘జనాలు’ సరైనది.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: కానీ నీవు అప్పు తీసుకోవు
  rationale: లוה యొక్క ఖల్ రూపం అప్పు తీసుకోవడం. ‘కానీ’ రెండు భాగాల మధ్య ఉన్న వ్యత్యాసాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచింది. ‘యెహోవా’ తెలుగు బైబిలు పాఠకులకు స్థిరంగా పరిచయమైన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని గిడ్డంగి రూపకాన్ని, ఆకాశం అనే సమానాధికరణ వివరణను, అప్పు ఇవ్వడం–తీసుకోవడం మధ్య వ్యత్యాసాన్ని నిలిపింది.
