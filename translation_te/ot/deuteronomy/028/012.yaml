    rationale: ‘నీ దేశంపై వర్షం కురిపిస్తాడు’ వర్షం పడే స్థలాన్ని స్పష్టంగా తెలుపుతూ హీబ్రూ వ్యవసాయ సందర్భాన్ని సహజ తెలుగులో అందిస్తుంది.
