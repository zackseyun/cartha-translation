source:
  edition: WLC
  text: וּֽ/בְ/שִׁלְיָתָ֞/הּ הַ/יּוֹצֵ֣ת מִ/בֵּ֣ין רַגְלֶ֗י/הָ וּ/בְ/בָנֶ֨י/הָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי תֹאכְלֵ֥/ם בְּ/חֹֽסֶר כֹּ֖ל בַּ/סָּ֑תֶר בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: te
  text: ఆమె కాళ్ల మధ్యనుండి బయటకు వచ్చే మావి[a] పట్లను, ఆమె కనే పిల్లల పట్లను కనికరం లేకుండా ఉంటుంది; ఎందుకంటే నీ శత్రువు నీ పట్టణాల్లో[c] నిన్ను ముట్టడించి తీవ్రమైన కష్టాలకు గురిచేసినప్పుడు, సమస్తం కొరవడినందువల్ల[b] ఆమె వాటిని రహస్యంగా తింటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మావి’ని ‘ప్లాసెంటా’ అని కూడా అంటారు. ఇది ప్రసవ సమయంలో శిశువు తర్వాత గర్భం నుంచి బయటకు వచ్చే భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, అన్నీ కొరవడిన తీవ్రమైన లేమి వల్ల.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘నీ ద్వారాల్లో.’ ఇక్కడ ఈ మాట ముట్టడికి గురైన పట్టణాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: ఆమె ... మావి
  rationale: ఈ నామవాచకం ప్రసవానంతరం వెలువడే మావిని సూచిస్తుంది. ‘మావి’ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన పదం.
- source_word: הַיּוֹצֵת מִבֵּין רַגְלֶיהָ
  choice: ఆమె కాళ్ల మధ్యనుండి బయటకు వచ్చే
  rationale: ప్రసవాన్ని నేరుగా వర్ణించే మూలపాఠ భావాన్ని మృదుపరచకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: ఆమె కనే పిల్లల విషయంలోనూ
  rationale: בנים ఇక్కడ మగపిల్లలకే పరిమితం కాకుండా సంతానాన్ని సాధారణంగా సూచిస్తుంది; ילד యొక్క ప్రసవ భావాన్ని ‘కనే’ నిలుపుతుంది.
- source_word: כִּי תֹאכְלֵם
  choice: ఎందుకంటే ... ఆమె వాటిని ... తింటుంది
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది; אכל యొక్క దిగ్భ్రాంతికరమైన ప్రత్యక్షతను ‘తింటుంది’ నిలుపుతుంది. ‘వాటిని’ మావి మరియు పిల్లలు రెండింటినీ వ్యాకరణపరంగా కలుపుతుంది.
- source_word: בְּחֹסֶר כֹּל
  choice: సమస్తమూ కొరవడటం వల్ల
  rationale: పూర్తి లేమిని సహజ తెలుగులో తెలియజేస్తుంది; సందర్భంలో కారణార్థక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בַּסָּתֶר
  choice: రహస్యంగా
  rationale: ఆమె ఇతరులకు తెలియకుండా తినే క్రియను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: ముట్టడించి, తీవ్ర ఇబ్బందికి గురిచేసినప్పుడు
  rationale: ముట్టడి మరియు దాని వల్ల కలిగే తీవ్రమైన ఒత్తిడి అనే జత భావాలను సహజ తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: నీ శత్రువు ... నిన్ను ... తీవ్ర ఇబ్బందికి గురిచేసినప్పుడు
  rationale: צוּק హిఫీల్ రూపంలోని తీవ్రమైన ఒత్తిడి, నిర్బంధ భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: בִּשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో
  rationale: అక్షరార్థంగా ‘నీ ద్వారాల్లో’; ఇక్కడ పట్టణ ద్వారాల లోపలనున్న పట్టణాలను సూచించే హీబ్రూ ప్రయోగాన్ని అర్థానుసారంగా అనువదించింది.
theological_decisions:
- issue: וּבְ... וּבְ... నిర్మాణంలో స్త్రీ ప్రవర్తనకు సంబంధించిన భావం మునుపటి వచనం నుంచి కొనసాగుతుంది
  choice: ‘విషయంలోనూ ... విషయంలోనూ ఆమె కఠినంగా ప్రవర్తిస్తుంది’ అని సందర్భసంబంధ క్రియను పూరించింది
  alternative: ‘మావి వైపూ ... పిల్లల వైపూ’ అని మాత్రమే అక్షరానుసారంగా ఉంచడం
  rationale: 57వ వచనం వాక్యనిర్మాణపరంగా 56వ వచనంలోని ‘ఆమె కన్ను చెడ్డదై ఉంటుంది/కఠినంగా ఉంటుంది’ అనే భావంపై ఆధారపడుతుంది. స్వతంత్ర తెలుగు వచనంగా అర్థమయ్యేలా ఆ భావాన్ని స్పష్టంగా పూరించాం; దాని అర్థాన్ని ప్రత్యేక సిద్ధాంత దిశగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; శాపవాక్యంలోని భయానక ప్రత్యక్షతను మృదుపరచకుండా, వైద్యపరంగా అతిగా సాంకేతికంగా కాకుండా అనువదించబడింది. వచనం ముందటి వాక్యంపై ఆధారపడటాన్ని పాఠకుడికి స్పష్టంచేయడానికి సందర్భసంబంధ క్రియ పూరించబడింది.
