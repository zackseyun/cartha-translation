  edition: WLC
  text: יַדְבֵּ֧ק יְהוָ֛ה בְּ/ךָ֖ אֶת הַ/דָּ֑בֶר עַ֚ד כַּלֹּת֣/וֹ אֹֽתְ/ךָ֔ מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: te
  text: యాహ్వే నీకు తెగులు అంటిపెట్టుకొని ఉండేలా చేసి, నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న ఆ దేశం నుండి నిన్ను పూర్తిగా నిర్మూలించే వరకు అలాగే చేస్తాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహమ్మారి.” ఈ హీబ్రూ పదం తీర్పుగా వచ్చిన ప్రాణాంతక అంటువ్యాధిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది నిన్ను పూర్తిగా నాశనం చేసే వరకు”; ఈ అర్థంలో ‘తెగులు’ తరువాతి పదబంధానికి అంతర్భావ కర్త.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: అంటిపెట్టుకొని ఉండేలా చేస్తాడు
  rationale: దבק్ హిఫీల్ రూపంలోని కారణార్థాన్ని, విడువకుండా పట్టుకునే బాధ అనే సజీవ చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: הַדָּבֶר
  choice: తెగులు
  rationale: నిబంధన శాపాల సందర్భంలో ప్రాణాంతక అంటువ్యాధి లేదా మహమ్మారిని సూచించే పదానికి సహజమైన, గంభీరమైన తెలుగు సమానం.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: నిన్ను పూర్తిగా తుడిచివేసే వరకు
  rationale: כלה పదంలోని అంతం చేయడం లేదా పూర్తిగా నిర్మూలించడం అనే బలాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రధాన వాక్యంలోని యెహోవానే అంతర్భావ కర్తగా తీసుకుంటుంది.
- source_word: מֵעַל הָאֲדָמָה
  choice: దేశం నుండి
  rationale: ఇక్కడ אֲדָמָה కేవలం నేలను కాక, ఇశ్రాయేలు స్వాధీనం చేసుకోబోయే భూభాగాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: నువ్వు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న
  rationale: బוא שמה యొక్క ‘ప్రవేశించు’ భావాన్ని, ירש యొక్క భూమిని స్వాధీనం చేసుకునే నిబంధనాత్మక సందర్భాన్ని సహజంగా కలుపుతుంది.
theological_decisions:
- issue: דֶּבֶר అనే నిబంధన-శాప వ్యాధి పదం
  choice: తెగులు
  alternative: మహమ్మారి; అంటువ్యాధి
  rationale: ‘తెగులు’ తీవ్రమైన ప్రాణాంతక వ్యాధి తీర్పును సంక్షిప్తంగా తెలియజేస్తుంది; అయితే పదానికి మహమ్మారి అనే భావం కూడా ఉండవచ్చని పాదటిప్పణి సూచిస్తుంది.
- issue: כַּלֹּתוֹ లోని అంతర్భావ కర్త
  choice: యెహోవా అంతర్భావ కర్త
  alternative: 'తెగులు కర్తగా: ‘అది నిన్ను పూర్తిగా నాశనం చేసే వరకు’'
  rationale: ముఖ్య వాక్యపు కర్త అయిన యెహోవాను కొనసాగించడం సందర్భపరంగా సహజం. అయినా తెగులే కర్తగా ఉండగల వ్యాకరణసాధ్యతను పాదటిప్పణిలో ఉంచి అసలైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ఏకవచన సంబోధనను ‘నువ్వు/నిన్ను’తో నిలిపి, మూలంలోని ప్రత్యక్షతను కాపాడింది. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
