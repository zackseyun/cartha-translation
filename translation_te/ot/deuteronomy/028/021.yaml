revisions:
- from: యెహోవా, నువ్వు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశం నుండి నిన్ను పూర్తిగా తుడిచివేసే వరకు, తెగులు నిన్ను అంటిపెట్టుకొని ఉండేలా చేస్తాడు.[a][b]
  to: యాహ్వే నీకు తెగులు అంటిపెట్టుకొని ఉండేలా చేసి, నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న ఆ దేశం నుండి నిన్ను పూర్తిగా నిర్మూలించే వరకు అలాగే చేస్తాడు.[a][b]
  rationale: దైవనామాన్ని POB యొక్క ‘Yahweh’ విధానానికి అనుగుణంగా ‘యాహ్వే’గా సవరించాను. ప్రధాన వాక్యాన్ని పునఃక్రమీకరించి, తెగులు అంటిపెట్టుకునేలా చేయడం మరియు దేశం నుండి పూర్తిగా నిర్మూలించడం అనే రెండు చర్యలు స్పష్టంగా కలిసేలా చేశాను. ప్రత్యామ్నాయ కర్తకు సంబంధించిన అసలు వ్యాకరణ సందిగ్ధతను పాదటిప్పణి bలో నిలిపాను.
