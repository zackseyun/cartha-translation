id: DEU.28.32
reference: Deuteronomy 28:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּנֶ֨י/ךָ וּ/בְנֹתֶ֜י/ךָ נְתֻנִ֨ים לְ/עַ֤ם אַחֵר֙ וְ/עֵינֶ֣י/ךָ רֹא֔וֹת וְ/כָל֥וֹת אֲלֵי/הֶ֖ם כָּל הַ/יּ֑וֹם וְ/אֵ֥ין לְ/אֵ֖ל יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: te
  text: నీ కుమారులూ కుమార్తెలూ వేరొక ప్రజలకు అప్పగించబడతారు. నీ కళ్లముందే అది జరుగుతుంది; నీ కళ్లు వారికోసం రోజంతా క్షీణిస్తాయి. నీ చేతిలో ఏ శక్తీ ఉండదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది చేయడం నీ వశంలో ఉండదు.” హీబ్రూ నుడికారం అక్షరార్థంగా నీ చేతిలో శక్తి లేకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: నీ కుమారులు, కుమార్తెలు
  rationale: హీబ్రూ మూలం మగ, ఆడ సంతానాన్ని విడివిడిగా పేర్కొంటుంది; దాని స్పష్టతను నిలుపుతుంది.
- source_word: נְתֻנִים
  choice: అప్పగించబడతారు
  rationale: శాపవాక్య సందర్భంలో ఈ కర్మణి కృదంతం భవిష్యత్ ఫలితాన్ని సూచిస్తుంది. ‘అప్పగించబడతారు’ అనేది విరోధపూరిత సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְעַם אַחֵר
  choice: వేరొక ప్రజకు
  rationale: עַם అంటే ప్రధానంగా ‘ప్రజ’; אַחֵר యొక్క ‘వేరొక’ అనే భావాన్ని అదనపు జాతి-రాజకీయ అర్థం చేర్చకుండా ప్రతిబింబిస్తుంది.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: నీ కళ్లు చూస్తూ ఉండగానే
  rationale: తల్లిదండ్రులు తమ పిల్లలను తీసుకుపోవడం నిస్సహాయంగా చూస్తున్న సజీవ దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: వారికోసం ఎదురుచూసి క్షీణించిపోతాయి
  rationale: כלה ఇక్కడ తరిగిపోవడం, నీరసించడం అనే భావాన్ని ఇస్తుంది; אֲלֵיהֶם సందర్భంలో పిల్లలకోసం ఆరాటపడటాన్ని సూచిస్తుంది. ఈ అనువాదం శారీరక రూపకాన్నీ భావోద్వేగ ఆరాటాన్నీ నిలుపుతుంది.
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: అయితే నీ చేతికి ఏ శక్తీ ఉండదు
  rationale: చేతిలో శక్తి లేకపోవడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని దాని శరీరరూపకంతో సహా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: וְאֵין לְאֵל יָדֶךָ అనే నుడికారం
  choice: అయితే నీ చేతికి ఏ శక్తీ ఉండదు
  alternative: అది చేయడం నీ వశంలో ఉండదు
  rationale: ఇక్కడ אֵל దేవుని గురించిన ప్రకటన కాదు; సామర్థ్యం లేదా బలం లేకపోవడాన్ని తెలిపే నుడికారం. ప్రధాన పాఠం చేతి రూపకాన్ని నిలుపుతూ అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ఏకవచన సంబోధనను ‘నీ’ రూపంలో నిలిపాం. మూలంలోని నేత్రాలు క్షీణించే రూపకాన్నీ, చేతికి శక్తి లేకపోవడమనే నుడికారాన్నీ సాధ్యమైనంత సహజంగా పరిరక్షించాం.
