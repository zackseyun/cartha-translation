  to: నీ కుమారులూ కుమార్తెలూ వేరొక ప్రజలకు అప్పగించబడతారు. నీ కళ్లముందే అది జరుగుతుంది; నీ కళ్లు వారికోసం రోజంతా క్షీణిస్తాయి. నీ చేతిలో ఏ శక్తీ ఉండదు.[a]
