review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the children being given to another people, the all-day duration, and the final idiom of inability. However, “ఎదురుచూసి” means ‘having waited’ and does not convey the Hebrew sense of pining/yearning and wasting away. “చూస్తూ ఉండగానే” also shifts the ongoing ‘your eyes are seeing’ clause toward a momentary ‘while looking on’ construction.
  naturalness: The proposed revision is natural modern standard Telugu and preserves the vivid personification of the eyes. “నీ కళ్లముందే” effectively conveys helpless witnessing without introducing an additional event.
  terminology: “కుమారులూ కుమార్తెలూ,” “వేరొక ప్రజలకు,” and “నీ చేతిలో ఏ శక్తీ ఉండదు” are clear and appropriate. The footnote correctly identifies the final phrase as a Hebrew idiom of inability rather than a reference to deity.
  issues:
  - severity: medium
    issue: “వారికోసం ఎదురుచూసి క్షీణించిపోతాయి” renders וְכָלוֹת אֲלֵיהֶם imprecisely.
    rationale: ‘ఎదురుచూసి’ denotes waiting, whereas the Hebrew depicts the eyes being consumed/wasting away in longing toward/for the absent children. “వారికోసం ... క్షీణిస్తాయి” retains the depletion imagery without adding waiting.
  - severity: low
    issue: “నీ కళ్లు చూస్తూ ఉండగానే” can imply a single contemporaneous moment.
    rationale: The Hebrew coordinates ongoing seeing with all-day wasting away. Recasting as ‘నీ కళ్లముందే ...; నీ కళ్లు వారికోసం రోజంతా క్షీణిస్తాయి’ makes the sustained helpless witnessing and duration clearer.
  revised_text: నీ కుమారులూ కుమార్తెలూ వేరొక ప్రజలకు అప్పగించబడతారు. నీ కళ్లముందే అది జరుగుతుంది; నీ కళ్లు వారికోసం రోజంతా క్షీణిస్తాయి. నీ చేతిలో ఏ శక్తీ ఉండదు.[a]
  revised_footnotes:
  - marker: a
