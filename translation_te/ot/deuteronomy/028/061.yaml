- from: అంతేకాక, ఈ ధర్మశాస్త్ర గ్రంథంలో రాయబడని ప్రతి వ్యాధిని, ప్రతి తెగులును[a] యాహ్వే నీ మీదికి రప్పిస్తాడు; నీవు నాశనమయ్యే వరకు అవి నిన్ను విడిచిపెట్టవు.
  to: అంతేకాక, ఈ ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడని ప్రతి వ్యాధిని, ప్రతి విపత్తును[a] యాహ్వే నీ మీదికి రప్పిస్తాడు, నీవు నాశనమయ్యే వరకు.
