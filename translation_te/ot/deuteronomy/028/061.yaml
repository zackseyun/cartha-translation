id: DEU.28.61
reference: Deuteronomy 28:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: te
  text: అంతేకాక, ఈ ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడని ప్రతి వ్యాధిని, ప్రతి విపత్తును[a] యాహ్వే నీ మీదికి రప్పిస్తాడు, నీవు నాశనమయ్యే వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి దెబ్బను” లేదా “ప్రతి తెగులును”; ఇక్కడి హీబ్రూ పదం దెబ్బ, గాయం, తెగులు లేదా తీవ్రమైన విపత్తును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: అంతేకాక
  rationale: శాపాల జాబితాకు మరొక అంశాన్ని చేర్చే అదనపు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל חֳלִי
  choice: ప్రతి వ్యాధిని
  rationale: חֳלִי సూచించే విస్తృతమైన అనారోగ్య భావానికి ‘వ్యాధి’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: וְכָל מַכָּה
  choice: ప్రతి తెగులును
  rationale: מַכָּה దెబ్బ, గాయం, తెగులు లేదా విపత్తును సూచించగలదు. ఈ శాపాల సందర్భంలో ‘తెగులు’ శిక్షాత్మక విపత్తు భావాన్ని ఇస్తుంది; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: రాయబడని
  rationale: హీబ్రూ కర్మణి రూపాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: ఈ ధర్మశాస్త్ర గ్రంథంలో
  rationale: סֵפֶר యొక్క గ్రంథం/పత్రం భావాన్నీ, הַתּוֹרָה యొక్క ధర్మశాస్త్ర భావాన్నీ సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: יַעְלֵם
  choice: రప్పిస్తాడు
  rationale: עלה హిఫిల్ రూపం ఇక్కడ వాటిని ఒకరి మీదికి తెప్పించడం అనే కారణార్థక భావాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: עָלֶיךָ
  choice: నీ మీదికి
  rationale: יַעְלֵם తో కలిసి తీర్పును ఒకరి మీదికి రప్పించే భావాన్ని తెలియజేస్తుంది.
- source_word: עַד הִשָּׁמְדָךְ
  choice: నీవు నాశనమయ్యే వరకు
  rationale: తీర్పు కొనసాగే అంతిమ పరిమితిని తెలియజేసే హీబ్రూ భావాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామప్రయోగాన్ని కాపాడుతుంది.
- issue: చివరి వాక్యభాగంలో కర్త సంబంధం
  choice: అవి నిన్ను విడిచిపెట్టవు అనే భావస్పష్టీకరణతో తీర్పు కొనసాగింపును వ్యక్తపరచడం
  alternative: యాహ్వే వాటిని నీ మీదికి రప్పిస్తాడు, నీవు నాశనమయ్యే వరకు
  rationale: హీబ్రూ వాక్యంలో ‘నీవు నాశనమయ్యే వరకు’ అనేది రప్పించే చర్యకు హద్దు చూపుతుంది. తెలుగులో సహజత్వం కోసం కొనసాగింపు భావాన్ని స్పష్టంచేసినా, కొత్త సిద్ధాంతార్థం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే పదజాలం. ‘ధర్మశాస్త్ర గ్రంథం’ covenant document భావాన్ని నిలుపుతుంది. ప్రధాన పాఠంలోని పాదసూచిక గుర్తు [a] సంబంధిత పదం వెంట ఉంచబడింది.
