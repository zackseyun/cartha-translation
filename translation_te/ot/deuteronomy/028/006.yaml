  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: te
  text: నీవు లోపలికి వచ్చేటప్పుడు ఆశీర్వదించబడతావు[a][b]; నీవు బయటికి వెళ్లేటప్పుడు కూడా ఆశీర్వదించబడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నీవు’ ఏకవచనంలో ఉంది; ఇక్కడ ఇశ్రాయేలు ప్రజలు సమష్టిగా ఏకవచనంలో సంబోధించబడ్డారు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘నీ రాకలో ... నీ పోకలో.’ ‘లోపలికి రావడం, బయటికి వెళ్లడం’ అనే జంట వ్యక్తి జీవితమంతటినీ, కార్యకలాపాలన్నిటినీ సూచించే ప్రయోగం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: ఆశీర్వదించబడతావు
  rationale: ברך యొక్క నిష్క్రియార్థక కృదంతం ఇక్కడ నిబంధన ఆశీర్వాదాన్ని ప్రకటించే విధేయ ప్రయోగం. సందర్భంలోని భవిష్యత్ ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: ఇది ద్వితీయ పురుష ఏకవచన సర్వనామం. ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధిస్తున్న మూలరూపాన్ని ‘నీవు’ నిలుపుతుంది.
- source_word: בְּבֹאֶךָ
  choice: నీవు లోపలికి వచ్చేటప్పుడు
  rationale: ב అనే ఉపసర్గతో בוא ధాతువు యొక్క infinitive construct మరియు ద్వితీయ పురుష ఏకవచన ప్రత్యయం ఉన్నాయి. ‘లోపలికి వచ్చేటప్పుడు’ కదలికను, సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבָרוּךְ
  choice: కూడా ఆశీర్వదించబడతావు
  rationale: హీబ్రూ సమాంతర నిర్మాణంలోని పునరుక్త ఆశీర్వాద ప్రకటనను నిలుపుతూ, తెలుగు వాక్య సమతౌల్యానికి ‘కూడా’ ఉపయోగించబడింది.
- source_word: בְּצֵאתֶךָ
  choice: నీవు బయటికి వెళ్లేటప్పుడు
  rationale: ב అనే ఉపసర్గతో יצא ధాతువు యొక్క infinitive construct మరియు ద్వితీయ పురుష ఏకవచన ప్రత్యయం ఉన్నాయి. ఇది అక్షరార్థ కదలికను నిలుపుతుంది; జతగా వాడినప్పుడు జీవితం, కార్యకలాపాల సమగ్ర పరిధిని కూడా సూచించవచ్చు.
theological_decisions:
- issue: ఇశ్రాయేలుకు సమష్టిగత ఏకవచన సంబోధన
  choice: ‘నీవు’ అనే ఏకవచనాన్ని నిలుపడం
  alternative: ‘మీరు’ లేదా ‘మీరందరూ’ అని బహువచనంగా విస్తరించడం
  rationale: హీబ్రూ ద్వితీయ పురుష పుంలింగ ఏకవచనాన్ని ఉపయోగించి ఇశ్రాయేలును నిబంధన ప్రజగా సమష్టిగా సంబోధిస్తుంది. వ్యాఖ్యానాత్మక విస్తరణ చేయకుండా మూలంలోని రూపాన్ని ‘నీవు’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ సమాంతరతను నిలుపుతూ, కృత్రిమమైన పదక్రమాన్ని నివారించింది. ఏకవచన సంబోధన స్పష్టంగా ఉంచబడింది.
