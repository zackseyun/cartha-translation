  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: te
  text: యాహ్వే నిన్ను ప్రజలందరి మధ్య చెదరగొడతాడు, భూమి యొక్క ఒక చివర నుండి భూమి యొక్క మరో చివర వరకు[a]. అక్కడ నీవుగానీ నీ పూర్వీకులుగానీ ఎరుగని ఇతర దేవుళ్లను—చెక్క, రాయి దేవుళ్లను[b]—నీవు సేవిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భూమి యొక్క ఒక చివర నుండి భూమి యొక్క మరో చివర వరకు’ అనే చోట ‘దేశం యొక్క ఒక చివర నుండి దేశం యొక్క మరో చివర వరకు’ అని కూడా అనువదించవచ్చు. హీబ్రూ אֶרֶץ అనే పదానికి ‘దేశం,’ ‘భూమి’ అనే రెండు అర్థాలూ ఉన్నాయి; ఇక్కడ ప్రజలందరి మధ్య చెదరగొట్టడం ప్రస్తావించబడినందున ‘భూమి’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘చెక్క, రాయి’; ఈ పదార్థాలతో చేసిన విగ్రహాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: నిన్ను చెదరగొడతాడు
  rationale: פוץ హిఫీల్ రూపం ఒకరిని చెదరిపోయేలా చేయడాన్ని సూచిస్తుంది. ఒడంబడిక శాప సందర్భంలో ‘చెదరగొడతాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించడం ద్వారా బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: בְּכָל הָעַמִּים
  choice: ప్రజలందరి మధ్య
  rationale: עַמִּים అనేది రాజకీయ రాజ్యాలకన్నా ప్రజాసమూహాలను సూచిస్తుంది; ‘ప్రజలందరి మధ్య’ మూలార్థాన్నీ తెలుగు సహజత్వాన్నీ కాపాడుతుంది.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: భూమి ఒక చివర నుండి భూమి మరో చివర వరకు
  rationale: మూలంలోని הָאָרֶץ పునరుక్తిని నిలుపుతూ సంపూర్ణ భౌగోళిక విస్తృతిని వ్యక్తం చేస్తుంది. అన్ని ప్రజల మధ్య చెదరగొట్టే సందర్భం వల్ల ‘దేశం’ కంటే ‘భూమి’ అనేది ప్రధాన పఠనం.
- source_word: וְעָבַדְתָּ
  choice: నీవు సేవిస్తావు
  rationale: దేవతలతో వాడిన עבד ఆరాధనతో కూడిన విధేయతను సూచించగలదు; ‘సేవిస్తావు’ మూల క్రియను నేరుగా నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: ఇది ఇశ్రాయేలు దేవునికి భిన్నమైన దేవతలను సూచించే సాధారణ ఒడంబడిక పదబంధానికి నేరమైన అనువాదం.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: నీవుగానీ నీ పూర్వీకులుగానీ ఎరుగని
  rationale: ידע యొక్క ‘ఎరుగుట’ భావాన్ని అతివ్యాఖ్య చేయకుండా నిలుపుతుంది; సమాంతర నిరాకరణను తెలుగులో సహజమైన ‘గానీ…గానీ’ నిర్మాణంతో తెలిపింది.
- source_word: עֵץ וָאָבֶן
  choice: చెక్కను, రాతిని
  rationale: ఇవి ఇతర దేవుళ్లను విగ్రహాల పదార్థాల ద్వారా వివరిస్తున్న సమానాధికార పదాలు. విరామచిహ్నాల మధ్య ఉంచడం ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలిపాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తింపున్న ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: הָאָרֶץ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం
  rationale: אֶרֶץ పదానికి ‘దేశం/భూమి’ రెండూ సాధ్యమైనా, ‘ప్రజలందరి మధ్య’ చెదరగొట్టడం అనే సమీప సందర్భం విస్తృతమైన ‘భూమి’ భావాన్ని సమర్థిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: ఇతర దేవుళ్లను సేవించడం యొక్క బలవంత/ఫలిత భావం
  choice: నీవు సేవిస్తావు
  alternative: నీవు ఆరాధిస్తావు
  rationale: మూలంలోని עבדను ‘సేవించు’గా ఉంచడం వల్ల అది స్వచ్ఛంద ఆరాధనా, ప్రవాస పరిస్థితుల ఫలితమా అనే అంశాన్ని అనవసరంగా పరిష్కరించదు; విగ్రహారాధన భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని భవిష్యత్ శాప ప్రకటన, భౌగోళిక పునరుక్తి, ‘సేవించు’ అనే క్రియను నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
