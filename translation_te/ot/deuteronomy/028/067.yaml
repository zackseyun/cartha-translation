  text: בַּ/בֹּ֤קֶר תֹּאמַר֙ מִֽי יִתֵּ֣ן עֶ֔רֶב וּ/בָ/עֶ֥רֶב תֹּאמַ֖ר מִֽי יִתֵּ֣ן בֹּ֑קֶר מִ/פַּ֤חַד לְבָֽבְ/ךָ֙ אֲשֶׁ֣ר תִּפְחָ֔ד וּ/מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: te
  text: ఉదయం నీవు, “సాయంకాలం అయితే బాగుండేది!” అని అంటావు[a]; సాయంకాలం నీవు, “ఉదయం అయితే బాగుండేది!” అని అంటావు. నీ హృదయంలో నీవు భయపడే భయం వల్ల, నీ కళ్లతో నీవు చూసే దృశ్యం వల్ల ఇలా అంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సాయంకాలాన్ని/ఉదయాన్ని ఎవరు ఇస్తారు?” ఇది తీవ్రమైన కోరికను తెలిపే నుడికారం; అందుకే “... అయితే బాగుండేది!” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: ఉదయం
  rationale: నిర్దిష్ట కాలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: תֹּאמַר
  choice: నీవు ... అంటావు
  rationale: శాపాల సందర్భంలోని Qal imperfect 2ms‌ను భవిష్యత్ సూచనగా వ్యక్తం చేస్తుంది.
- source_word: מִי יִתֵּן
  choice: '... అయితే ఎంత బాగుంటుంది!'
  rationale: అక్షరార్థంగా ‘ఎవరు ఇస్తారు?’ అనే ప్రశ్న కాకుండా, బలమైన కోరికను తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: עֶרֶב / בֹּקֶר
  choice: సాయంకాలం / ఉదయం
  rationale: పరస్పర విరుద్ధ కాలపదాల సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: నీ హృదయాన్ని పట్టుకునే భయం వల్లను
  rationale: מן యొక్క కారణార్థాన్ని ‘వల్ల’తో చూపుతూ, פחד నామవాచకం-క్రియ పునరుక్తిని తెలుగులో అసహజంగా పదేపదే చేయకుండా దాని తీవ్రతను ‘పట్టుకునే భయం’గా వ్యక్తం చేస్తుంది.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: నీ కళ్లతో నీవు చూసే దృశ్యం వల్లను
  rationale: మַרְאֶה యొక్క దృశ్యార్థాన్ని, కళ్ల ప్రస్తావనను, చూడటం అనే క్రియను స్పష్టంగా నిలుపుతుంది.
