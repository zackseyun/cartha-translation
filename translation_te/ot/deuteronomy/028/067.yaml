translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘నీవు’ అనే ఏకవచన సంబోధనను మూలంలోని 2ms‌కు అనుగుణంగా నిలిపింది. చివర చేర్చిన ‘నీవు అలా అంటావు’ తెలుగులో కారణవాక్య సంబంధాన్ని స్పష్టం చేస్తుంది; కొత్త భావాన్ని జోడించదు.
