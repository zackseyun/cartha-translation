id: DEU.28.40
reference: Deuteronomy 28:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֵיתִ֛ים יִהְי֥וּ לְ/ךָ֖ בְּ/כָל גְּבוּלֶ֑/ךָ וְ/שֶׁ֨מֶן֙ לֹ֣א תָס֔וּךְ כִּ֥י יִשַּׁ֖ל זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: te
  text: నీ ప్రాంతమంతటా ఒలీవ చెట్లు ఉంటాయి. అయితే నువ్వు నూనె రాసుకోలేవు; ఎందుకంటే నీ ఒలీవ పంట రాలిపోతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ ఒలీవ కాయలు రాలిపోతాయి”; లేదా “నీ ఒలీవ చెట్టు తన ఫలాన్ని రాల్చేస్తుంది.” హీబ్రూలో “నీ ఒలీవ” అనే ఏకవచన రూపం సమష్టి అర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: ఒలీవ చెట్లు
  rationale: ఈ బహువచన నామవాచకం ఫలాలను లేదా చెట్లను సూచించగలదు; దేశమంతటా ఉండడం అనే సందర్భంలో చెట్లు అనే అర్థం సహజంగా సరిపోతుంది.
- source_word: יִהְיוּ לְךָ
  choice: ఉంటాయి
  rationale: హీబ్రూ స్వాధీనతను సూచించే ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భం వల్ల అవి నీకు ఉంటాయనే భావం స్పష్టమే.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: నీ ప్రాంతమంతటా
  rationale: גְּבוּל సరిహద్దు లేదా ఆ సరిహద్దులలోని ప్రాంతాన్ని సూచిస్తుంది; ఇక్కడ దేశ విస్తీర్ణమంతటినీ ఉద్దేశించడం వల్ల ఈ రూపం సహజం.
- source_word: וְשֶׁמֶן
  choice: నూనె
  rationale: మూలంలో సాధారణంగా 'నూనె' అని ఉంది; ఒలీవ నూనె అని సందర్భమే తెలియజేస్తుంది.
- source_word: לֹא תָסוּךְ
  choice: నూనె రాసుకోలేవు
  rationale: סוך శరీరానికి నూనె పూయడం లేదా రాసుకోవడం అనే సాధారణ ఆచారాన్ని సూచిస్తుంది. 'అభిషేకించుకోలేవు' అన్నది తెలుగులో అనవసరంగా ఆచారపరమైన భావాన్ని కలిగించవచ్చు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి కొరతకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: יִשַּׁל
  choice: రాలిపోతుంది
  rationale: చెట్టు తన ఫలాన్ని రాల్చడం లేదా ఫలం చెట్టు నుంచి పడిపోవడం అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: זֵיתֶךָ
  choice: నీ ఒలీవ పంట
  rationale: ఏకవచన రూపం ఇక్కడ సమష్టిగా ఒలీవ చెట్టు, దాని ఫలం లేదా పంటను సూచించవచ్చు. సందర్భంలో నూనె లభించకపోవడానికి కారణమైన ఫల నష్టాన్ని 'పంట' స్పష్టంగా తెలియజేస్తుంది; మూలంలోని అస్పష్టతను పాదసూచికలో ఉంచాం.
