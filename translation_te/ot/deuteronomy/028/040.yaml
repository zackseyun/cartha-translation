translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. దేవుడు ఇశ్రాయేలుతో ఏకవచన ద్వితీయ పురుషంలో మాట్లాడుతున్నందున 'నీ/నువ్వు' రూపాలు నిలుపుకున్నాం. 'నూనె రాసుకోవడం' సాధారణ శరీర సంరక్షణ భావాన్ని ఇస్తుంది; అనవసరమైన ఆచారపరమైన అర్థాన్ని నివారిస్తుంది.
