source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా నీకు ఇచ్చిన నీ కుమారుల, కుమార్తెల మాంసాన్ని—నీ గర్భఫలాన్ని[a]—నీవు తింటావు; నీ శత్రువు నిన్ను ఇరుకున పెట్టే ముట్టడిలోను సంకటస్థితిలోను ఇది జరుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దేహపు సంతానం.” హీబ్రూ అక్షరార్థంగా, “నీ ఉదరఫలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: నీవు తింటావు
  rationale: శాపవాక్య సందర్భంలో సంయుక్త పరిపూర్ణ క్రియ భవిష్యదర్థక ఫలితాన్ని సూచిస్తుంది.
- source_word: פְרִי בִטְנְךָ
  choice: నీ గర్భఫలాన్ని
  rationale: పిల్లలను సూచించే హీబ్రూ రూపకాన్ని గంభీరంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: నీ కుమారుల, కుమార్తెల శరీరమనే
  rationale: మూలంలోని కుమారులు, కుమార్తెలు అనే స్పష్టమైన జతను నిలుపుతూ, בשר ను మానవ శరీరమాంసం అనే భయానక భావంతో వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా నీకు ఇచ్చిన
  rationale: పిల్లలు దేవుడు ఇచ్చినవారనే సంబంధవాక్యాన్ని నిలిపి, తీర్పు యొక్క విషాద తీవ్రతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: ముట్టడించి తీవ్రమైన ఇబ్బందికి గురిచేసినప్పుడు
  rationale: ముట్టడి మరియు దానివల్ల కలిగే తీవ్రమైన సంకటస్థితిని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: నీ శత్రువు నిన్ను ... గురిచేసినప్పుడు
  rationale: హిఫీల్ రూపంలోని ఒత్తిడి చేయడం, ఇరుకున పెట్టడం అనే శత్రుత్వపూరిత భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు; ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: తీర్పులోని నరమాంసభక్షణ భయానకత
  choice: తింటావు అని నేరుగా నిలుపుట
  alternative: ఆహారంగా తీసుకుంటావు వంటి మృదువైన రూపం
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా కలిగించే భయానకతను మృదువుచేయకుండా, అదే సమయంలో అదనపు వివరణను చేర్చకుండా అనువదించింది.
translation_notes:
  register: గంభీరమైన శాపవాక్య ధోరణిని నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. మూలంలోని రెండవ పురుష ఏకవచనం కొనసాగించబడింది; కుమారులు, కుమార్తెలు రెండూ స్పష్టంగా పేర్కొనబడ్డాయి.
