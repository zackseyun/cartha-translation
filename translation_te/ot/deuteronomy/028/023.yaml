id: DEU.28.23
reference: Deuteronomy 28:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָי֥וּ שָׁמֶ֛י/ךָ אֲשֶׁ֥ר עַל רֹאשְׁ/ךָ֖ נְחֹ֑שֶׁת וְ/הָ/אָ֥רֶץ אֲשֶׁר תַּחְתֶּ֖י/ךָ בַּרְזֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: te
  text: నీ తలపైనున్న ఆకాశం కంచుగా[a], నీ కిందనున్న నేల ఇనుముగా అవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ తలపైనున్న ఆకాశం రాగిగా, నీ కిందనున్న నేల ఇనుముగా అవుతాయి.”
    reason: נְחֹשֶׁת అనే హీబ్రూ పదం ‘కంచు’ లేదా ‘రాగి’ అని అర్థమివ్వగలదు.
lexical_decisions:
- source_word: וְהָיוּ
  choice: అవుతాయి
  rationale: శాపవాక్య సందర్భంలో ఈ క్రియ భవిష్యత్ ఫలితాన్ని సూచిస్తుంది. తెలుగు సహజత్వంలో ‘అవుతాయి’ మార్పు లేదా ఏర్పడబోయే స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: నీ తలపైనున్న ఆకాశం
  rationale: שָׁמַיִם ఇక్కడ వర్షాన్ని ఇచ్చే ఆకాశాన్ని సూచిస్తుంది. ఏకవచన సమాహారార్థకమైన ‘ఆకాశం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘నీ తలపైన’ అనే నిలువు దృశ్యాన్ని నిలుపుతుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం రాగి లేదా కంచును సూచించగలదు. ఇనుముతో జతగా కనిపించే కఠినమైన లోహ దృశ్యాన్ని తెలుగులో ‘కంచు’ సహజంగా నిలుపుతుంది; ‘రాగి’ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: నీ కిందనున్న నేల
  rationale: ఆకాశానికి వ్యతిరేకంగా ఉన్న భూమిని సూచించినా, ఈ శాపచిత్రంలో పంటనిచ్చే నేల కఠినమవడం ప్రధాన భావం. ‘నీ కిందనున్న నేల’ మూలంలోని స్థానసంబంధ సమాంతరతను సహజ తెలుగులో కాపాడుతుంది.
- source_word: בַּרְזֶל
  choice: ఇనుము
  rationale: లోహపదానికి సాధారణమైన, స్పష్టమైన తెలుగు సమానం; ఫలించని కఠిన నేల అనే రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శాపచిత్రంలోని రూపకాల బలం
  choice: ‘కంచు’, ‘ఇనుము’ అనే లోహ రూపకాలను ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచడం
  alternative: వర్షంలేని ఆకాశం, గట్టిపడిన నేల అని వివరణాత్మకంగా అనువదించడం
  rationale: హీబ్రూ పాఠ్యం కరువు ఫలితాన్ని నేరుగా వివరించకుండా దృఢమైన లోహచిత్రంతో తెలియజేస్తుంది. రూపకాన్ని నిలుపడం దాని తీవ్రతను, అలాగే పాఠ్యంలో ఉన్న సూచనాత్మకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శాపవాక్య శైలిని అనుసరించాం. ‘తలపైనున్న/కిందనున్న’ అనే సమాంతర నిర్మాణం మూలపాఠ్యంలోని నిలువు దృశ్యాన్ని కాపాడుతుంది.
