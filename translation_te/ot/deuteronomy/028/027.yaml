  variant: modern standard Telugu
source:
  edition: WLC
  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֤ין מִצְרַ֨יִם֙ ו/ב/עפלים וּ/בַ/גָּרָ֖ב וּ/בֶ/חָ֑רֶס אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: te
  text: యాహ్వే ఐగుప్తు పుండ్లతోను, గడ్డలతోను[a], గజ్జితోను, దురదతోను నిన్ను కొడతాడు; వాటినుండి నీవు స్వస్థత పొందలేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొలలతో.’ ఈ హెబ్రీ పదం అర్థం అనిశ్చితం; ఇది మరింత నిర్దిష్టంగా మలద్వార ప్రాంతంలోని వాపులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: నిన్ను మొత్తుతాడు
  rationale: נכה హిఫీల్ రూపం నేరుగా ‘కొట్టు/మొత్తు’ అనే బలమైన అర్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘మొత్తుతాడు’ దైవిక దండన యొక్క ప్రత్యక్షతను సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: ఐగుప్తు పుండ్లతో
  rationale: שְׁחִין వాచిన చర్మపు పుండు లేదా కురుపును సూచిస్తుంది. వ్యాధి రకాన్ని తెలుగులో సహజంగా తెలిపేందుకు బహువచనమైన ‘పుండ్లు’ వాడి, ఐగుప్తుతో ఉన్న సంబంధాన్ని యథాతథంగా ఉంచాం.
- source_word: וּבְעפלים
  choice: కణుతులతో
  rationale: ఈ హెబ్రీ పదం అర్థం అనిశ్చితం. నిర్దిష్టంగా ‘మొలలు’ అని తేల్చకుండా, వాపులు లేదా గడ్డలను సూచించగల విస్తృత పదమైన ‘కణుతులు’ ఎంచుకున్నాం; నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וּבַגָּרָב
  choice: గజ్జితో
  rationale: גָּרָב పొక్కులు లేదా పొలుసులతో కూడిన చర్మవ్యాధిని సూచిస్తుంది. ‘గజ్జి’ సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన తెలుగు వ్యాధిపేరు.
- source_word: וּבֶחָרֶס
  choice: దురదతో
  rationale: חָרֶס దురద కలిగించే చర్మస్థితిని సూచిస్తుంది. ఆధునిక వైద్యనిర్ధారణను అనవసరంగా నిర్దిష్టం చేయకుండా ‘దురద’ అనే స్పష్టమైన పదాన్ని వాడాం.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: వాటినుంచి నీవు స్వస్థత పొందలేవు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని ‘స్వస్థత పొందలేవు’ నిలుపుతుంది; సంబంధవాచక పదం సూచించే ముందు చెప్పిన వ్యాధులన్నిటినీ ‘వాటినుంచి’ సహజంగా కలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో సంప్రదాయంగా గుర్తించబడే లిప్యంతరీకరణను ఉపయోగించాం.
- issue: దైవిక దండన యొక్క ప్రత్యక్ష కర్తృత్వం
  choice: యెహోవా ... నిన్ను మొత్తుతాడు
  alternative: నీకు ... కలుగుతాయి
  rationale: మూలంలో యెహోవాయే నేరుగా కర్తగా ఉన్నాడు. వ్యాధులు కేవలం సంభవిస్తాయని మార్చకుండా ఆ భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. వ్యాధుల జాబితాలో మూల వాక్యపు సమాంతర నిర్మాణం నిలుపబడింది; అనిశ్చిత వైద్యపదాన్ని ప్రధాన వచనంలో అతిగా నిర్దిష్టం చేయలేదు.
