source:
  edition: WLC
  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: te
  text: 'ఇలా జరుగుతుంది: యాహ్వే మీకు మేలు చేయడానికీ మిమ్మల్ని అధికం చేయడానికీ మీ విషయమై సంతోషించినట్లే, మిమ్మల్ని నాశనం చేయడానికీ పూర్తిగా నిర్మూలించడానికీ యాహ్వే మీ విషయమై సంతోషిస్తాడు. నీవు[a] అక్కడ స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న ఆ దేశం మీదనుండి మీరు పెకలించబడతారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నీవు’ ఏకవచనం; ఇశ్రాయేలు ప్రజలను ఒకే సమాజంగా సంబోధిస్తోంది.
    reason: హీబ్రూ వచనంలోని బహువచనం నుంచి ఏకవచనానికి వచ్చిన మార్పును తెలుగులో స్పష్టంగా గమనింపజేయడం.
  - marker: b
    text: లేదా, ‘ఆ దేశం నుంచి బలవంతంగా తొలగించబడతారు.’
    reason: וְנִסַּחְתֶּם అనే క్రియలోని బలవంతపు తొలగింపు భావానికి రూపకరహిత ప్రత్యామ్నాయాన్ని ఇవ్వడం.
lexical_decisions:
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: సంతోషించినట్లే / సంతోషిస్తాడు
  rationale: రెండు క్రియారూపాలకూ ఒకే తెలుగు మూలపదాన్ని వాడి, ఆశీర్వాదంలోనూ తీర్పులోనూ యాహ్వే సంతోషించాడనే ఉద్దేశపూర్వక సమాంతరాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: మీకు మేలు చేసి
  rationale: హిఫీల్ రూపంలోని విస్తృతమైన మేలు చేయడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: మిమ్మల్ని విస్తరింపజేయడంలో
  rationale: జనసంఖ్యను అధికం చేయడం అనే నిబంధనాత్మక ఆశీర్వాద భావాన్ని తెలియజేస్తుంది; కేవలం వ్యక్తిగత సంపదగా పరిమితం చేయదు.
- source_word: לְהַאֲבִיד אֶתְכֶם וּלְהַשְׁמִיד אֶתְכֶם
  choice: మిమ్మల్ని నాశనం చేసి పూర్తిగా నిర్మూలించడంలో
  rationale: పక్కపక్కన ఉన్న రెండు బలమైన వినాశన క్రియలను వేరు చేస్తూ, రెండవదాని తీవ్రతను ‘పూర్తిగా’ అనే పదంతో వ్యక్తం చేసింది.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: దేశం నుంచి మీరు పెకలించబడతారు
  rationale: נסח సూచించే బలవంతపు తొలగింపును ‘పెకలించబడతారు’ అనే రూపకంతో నిలిపి, తెలుగులో సహజంగా వ్యక్తం చేసింది.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న
  rationale: హీబ్రూలోని ఏకవచన సంబోధనను ‘నీవు’తో స్పష్టంగా చూపిస్తూ, గమ్యస్థానాన్ని సూచించే భావాన్ని ‘ప్రవేశిస్తున్న’లో సహజంగా కలిపింది.
theological_decisions:
- issue: తీర్పులో దేవుడు సంతోషించడం
  choice: ‘మిమ్మల్ని నాశనం చేసి పూర్తిగా నిర్మూలించడంలో కూడా మీ విషయంలో సంతోషిస్తాడు’ అని స్పష్టంగా నిలిపింది.
  alternative: తీర్పును కేవలం దేవుడు అనుమతిస్తాడని లేదా ఇష్టంలేక అమలు చేస్తాడని మృదువుగా చెప్పడం.
  rationale: హీబ్రూ వాక్యం ఆశీర్వదించడంలో సంతోషించడానికీ నాశనం చేయడంలో సంతోషించడానికీ ఉద్దేశపూర్వక సమాంతరాన్ని ఏర్పరుస్తుంది. కఠినమైన ఈ దైవశాస్త్ర ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలిపింది.
- issue: יהוה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించింది. మొదటి భాగంలోని బహువచన ‘మీరు/మిమ్మల్ని’ మరియు చివరి ఉపవాక్యంలోని ఏకవచన ‘నీవు’ మధ్య హీబ్రూ సంఖ్యా మార్పును ఉద్దేశపూర్వకంగా నిలిపింది.
