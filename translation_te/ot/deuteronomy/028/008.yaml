  to: యాహ్వే నీ ధాన్యాగారాల్లోను, నీవు చేతిపెట్టే ప్రతి పనిలోను, నీకు ఆశీర్వాదం కలగాలని ఆజ్ఞాపిస్తాడు. నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలో ఆయన నిన్ను ఆశీర్వదిస్తాడు.
