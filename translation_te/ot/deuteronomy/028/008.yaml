id: DEU.28.8
reference: Deuteronomy 28:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְצַ֨ו יְהוָ֤ה אִתְּ/ךָ֙ אֶת הַ/בְּרָכָ֔ה בַּ/אֲסָמֶ֕י/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֣ח יָדֶ֑/ךָ וּ/בֵ֣רַכְ/ךָ֔ בָּ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: te
  text: యాహ్వే నీ ధాన్యాగారాల్లోను, నీవు చేతిపెట్టే ప్రతి పనిలోను, నీకు ఆశీర్వాదం కలగాలని ఆజ్ఞాపిస్తాడు. నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న దేశంలో ఆయన నిన్ను ఆశీర్వదిస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְצַו
  choice: ఆజ్ఞాపిస్తాడు
  rationale: צוה అనే పియేల్ క్రియకు సాధారణ అర్థం ‘ఆజ్ఞాపించు.’ ఆశీర్వాదం కలగాలని యాహ్వే ఆజ్ఞాపించే హీబ్రూ చిత్రణను సరళీకరించి ‘ఇస్తాడు’ అని మార్చకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: אִתְּךָ אֶת־הַבְּרָכָה
  choice: నీపై ఆశీర్వాదం ఉండాలని
  rationale: ఈ సందర్భంలో ఆశీర్వాదం సంబోధితుని మీదికి నిర్దేశించబడుతుందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; నిర్దిష్టమైన ‘ఆశీర్వాదం’ భావాన్ని కూడా నిలుపుతుంది.
- source_word: בַּאֲסָמֶיךָ
  choice: నీ ధాన్యాగారాల్లో
  rationale: אָסָם ధాన్యం లేదా ఇతర పంట దిగుబడిని నిల్వచేసే స్థలాన్ని సూచిస్తుంది. వ్యవసాయ సందర్భానికి ‘ధాన్యాగారాలు’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: నీ చేతి పనులన్నిటిలో
  rationale: అక్షరార్థంగా ‘నీ చేతిని పంపే ప్రతిదానిలో’ అనే హీబ్రూ నుడికారాన్ని, చేతి అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ అర్థమయ్యే తెలుగులో తెలిపింది.
- source_word: וּבֵרַכְךָ
  choice: ఆయన నిన్ను ఆశీర్వదిస్తాడు
  rationale: ముందున్న భవిష్యత్ క్రియ భావాన్ని కొనసాగిస్తుంది; కర్త యాహ్వేయేనని ‘ఆయన’ స్పష్టం చేస్తుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ద్వితీయోపదేశకాండలో వాగ్దాన దేశాన్ని సూచించే ఒడంబడిక సంబంధమైన భావాన్ని ‘దేశం’ సహజంగా నిలుపుతుంది.
- source_word: נֹתֵן לָךְ
  choice: నీకు ఇస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంతం కొనసాగుతున్న లేదా సమీపిస్తున్న కార్యాన్ని సూచించగలదు. ‘ఇస్తున్న’ దాని ప్రక్రియాత్మకతను నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించడం వల్ల పాఠ్యంలోని గుర్తింపు నిలుస్తుంది.
- issue: ‘దేశం’ అనే పదంలోని ఒడంబడిక భావం
  choice: దేశంలో
  alternative: భూమిలో
  rationale: ఇక్కడ సాధారణ నేల లేదా భూమండలం కాక, యాహ్వే ఇశ్రాయేలుకు ఇస్తున్న దేశమే ఉద్దేశం. ‘దేశం’ అదనపు వ్యాఖ్యానం లేకుండా ఆ భావాన్ని తెలియజేస్తుంది.
- issue: ఆశీర్వాదాన్ని ‘ఆజ్ఞాపించడం’ అనే చిత్రణ
  choice: నీపై ఆశీర్వాదం ఉండాలని ఆజ్ఞాపిస్తాడు
  alternative: నీకు ఆశీర్వాదం ప్రసాదిస్తాడు
  rationale: ‘ప్రసాదిస్తాడు’ అర్థాన్ని సులభతరం చేసినా, దేవుడు ఆశీర్వాదాన్ని ఆజ్ఞాపిస్తాడనే మూలంలోని బలమైన చిత్రణను కోల్పోతుంది; అందువల్ల ఆ ఉద్వేగాన్ని సహజమైన తెలుగులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఒడంబడిక సందర్భానికి తగిన గౌరవప్రద శైలితో రూపొందించబడింది. ‘ఆజ్ఞాపిస్తాడు’ మరియు ‘నీ చేతి పనులు’ అనే మూల చిత్రణలు సహజత్వం కోల్పోకుండా నిలుపబడ్డాయి.
