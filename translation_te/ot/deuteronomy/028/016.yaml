translation:
  language: te
  text: పట్టణంలో నీవు శాపగ్రస్తుడవు[a]; పొలంలోనూ నీవు శాపగ్రస్తుడవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు శాపం కింద ఉన్నావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: శాపగ్రస్తుడవు
  rationale: ఈ నిష్క్రియార్థక కృదంతం నిబంధన సంబంధమైన తీర్పు కింద ఉన్న స్థితిని నేరుగా ప్రకటిస్తుంది. ‘శాపగ్రస్తుడవు’ ఆ భావాన్ని భవిష్యద్వాక్యంగా లేదా శాపకాంక్షగా మార్చకుండా నిలుపుతుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: హీబ్రూలోని స్పష్టమైన ద్వితీయ పురుష ఏకవచన సర్వనామాన్ని ఉంచి, వ్యక్తిని నేరుగా సంబోధించే బలాన్ని కాపాడుతుంది.
- source_word: בָּעִיר
  choice: పట్టణంలో
  rationale: ב స్థానాన్ని సూచిస్తుంది; ‘పట్టణంలో’ అనేది సహజమైన ప్రత్యక్ష అనువాదం, తరువాతి ‘పొలంలో’తో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וְ
  choice: ; ...నూ
  rationale: సరళ సంయోజకాన్ని తెలుగులో సమాంతర వాక్యాల మధ్య సహజంగా వ్యక్తపరుస్తూ, రెండవ పరిధినీ కలిపే సమష్టి బలాన్ని నిలుపుతుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שָׂדֶה వ్యవసాయ భూమి లేదా బహిరంగ గ్రామీణ ప్రదేశాన్ని సూచిస్తుంది. ‘పొలంలో’ పట్టణానికి స్పష్టమైన గ్రామీణ సమాంతరాన్ని ఇస్తుంది.
theological_decisions:
- issue: నిబంధన-శాప సూత్రం మరియు దాని పరిధి
  choice: రెండు భాగాల్లోనూ ‘నీవు శాపగ్రస్తుడవు’ అనే ప్రత్యక్ష స్థితి-ప్రకటనను నిలుపడం.
  alternative: ‘నీవు శపించబడతావు’ లేదా ‘నీవు శపించబడుదువు గాక.’
  rationale: హీబ్రూ పాఠంలో భవిష్యత్ క్రియగానీ, శాపకాంక్షగానీ లేదు; కృదంతం మరియు సర్వనామంతో కూడిన క్రియారహిత విధేయ నిర్మాణం ఉంది. అందువల్ల ఇది నిబంధన తీర్పును ప్రత్యక్షంగా ప్రకటించే మాటగా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. ఏకవచన పుంలింగ సంబోధనను మూలంలోని 2ms రూపానికి అనుగుణంగా ఉంచాం. పట్టణం–పొలం అనే సమాంతర నిర్మాణం జీవన పరిధి మొత్తాన్ని సూచించే బలాన్ని కాపాడుతుంది.
