source:
  edition: WLC
  text: וְ/הָי֣וּ בְ/ךָ֔ לְ/א֖וֹת וּ/לְ/מוֹפֵ֑ת וּֽ/בְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: te
  text: అవి నీ మీదా, నీ సంతానం మీదా ఎప్పటికీ సూచనగానూ అద్భుతంగానూ ఉంటాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ వంశస్థుల మీద”; హీబ్రూ పదం అక్షరార్థంగా “విత్తనం,” ఇక్కడ అది ఒకరి సంతానాన్ని లేదా భావితరాలను సమష్టిగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “అవి” అనేది ముందటి సందర్భంలో వివరించిన శాపాలను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: ఉంటాయి
  rationale: ముందటి సందర్భంలో చెప్పబడిన శాపాల భవిష్యత్ పరిణామాన్ని కొనసాగించే క్రియగా ఉంది; తెలుగులో సహజమైన భవిష్యత్ భావాన్ని ఇస్తుంది.
- source_word: בְּךָ
  choice: నీ మీద
  rationale: శాపాలు సంబోధితునిపై నిలిచి ఉండే లేదా అతనికి అంటిపెట్టుకునే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְאוֹת
  choice: సూచనగా
  rationale: אוֹת అనే పదంలోని గుర్తు లేదా సూచన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וּלְמוֹפֵת
  choice: ఆశ్చర్యకార్యంగా
  rationale: מוֹפֵת అనే పదానికి ఆశ్చర్యం కలిగించే కార్యం లేదా అసాధారణ నిదర్శనం అనే భావం ఉంది; కేవలం అశుభ శకునం అనే భావాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: וּבְזַרְעֲךָ
  choice: నీ సంతానం మీద
  rationale: זֶרַע ఇక్కడ ఒకరి భావితరాలను సమష్టిగా సూచిస్తుంది; 'సంతానం' ఆధునిక తెలుగులో సహజంగా ఉండి సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘకాలికంగా కొనసాగడాన్ని తెలిపే ప్రామాణిక తెలుగు సమానార్థకం; తాత్త్వికమైన అంతంలేనితనాన్ని అదనంగా నిర్వచించదు.
theological_decisions:
- issue: '''అవి'' అనే సర్వనామం దేనిని సూచిస్తుంది?'
  choice: ప్రధాన వాక్యంలో 'అవి' అని ఉంచి, ముందటి సందర్భంలోని శాపాలను సూచిస్తుందని పాదసూచికలో తెలిపింది.
  alternative: ప్రధాన వాక్యంలోనే 'ఆ శాపాలు' అని స్పష్టీకరించడం.
  rationale: హీబ్రూ వాక్యంలో కర్తను నామవాచకంగా మళ్లీ చెప్పలేదు. అందువల్ల మూలంలోని సర్వనామసదృశ అస్పష్టతను నిలిపి, సందర్భ సమాచారాన్ని పాదసూచికకు పరిమితం చేసింది.
- issue: עַד עוֹלָם యొక్క కాలవ్యాప్తి
  choice: '''ఎప్పటికీ'''
  alternative: '''తరతరాలకు'' లేదా ''నిరంతరం'''
  rationale: నిబంధన సంబంధ తీర్పు సందర్భంలో ఇది నిలకడైన కొనసాగింపును సూచిస్తుంది. మూలం చెప్పినదానికంటే ఎక్కువగా తాత్త్విక అంతంలేనితనాన్ని నిర్వచించకుండా సాధారణ సమానార్థకాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వచన గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. 'సూచనగానూ ఆశ్చర్యకార్యంగానూ' అనే జోడింపు హీబ్రూ పదజంటను స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
