revisions:
- from: నీ ప్రాణం నీ కళ్లముందే త్రిశంకులో వేలాడుతూ ఉంటుంది[a]. నీవు రాత్రింబగళ్లు భయపడతావు; నీ ప్రాణం నిలుస్తుందనే నమ్మకం నీకు ఉండదు.
  to: నీ జీవితం నీ ఎదుట వేలాడుతూ ఉంటుంది[a]. నీవు రాత్రింబగళ్లు భయపడతావు; నీ ప్రాణం నిలుస్తుందనే నమ్మకం నీకు ఉండదు.
  rationale: “త్రిశంకులో” తొలగించి, హీబ్రూ మూలంలోని ‘వేలాడుతున్న’ రూపకాన్ని నేరుగా నిలిపాం. ఇది మూలంలోని ప్రమాదకరమైన అనిశ్చితిని కాపాడుతూ, అనవసరమైన స్థానిక పురాణసూచనను నివారిస్తుంది. మిగతా వాక్యాలు మూలార్థాన్నీ ఆధునిక ప్రామాణిక తెలుగు శైలినీ సముచితంగా ప్రతిబింబిస్తున్నాయి.
