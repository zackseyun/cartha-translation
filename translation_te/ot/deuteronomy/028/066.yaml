source:
  edition: WLC
  text: וְ/הָי֣וּ חַיֶּ֔י/ךָ תְּלֻאִ֥ים לְ/ךָ֖ מִ/נֶּ֑גֶד וּ/פָֽחַדְתָּ֙ לַ֣יְלָה וְ/יוֹמָ֔ם וְ/לֹ֥א תַאֲמִ֖ין בְּ/חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: te
  text: నీ జీవితం నీ ఎదుట వేలాడుతూ ఉంటుంది[a]. నీవు రాత్రింబగళ్లు భయపడతావు; నీ ప్రాణం నిలుస్తుందనే నమ్మకం నీకు ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ జీవితం నీ ముందర వేలాడుతూ ఉంటుంది.” హీబ్రూలో జీవితం ప్రమాదకరంగా వేలాడుతున్న చిత్రం ఉంది; అది బతుకుతామో లేదో అనే నిరంతర అనిశ్చితిని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: నీ ప్రాణం
  rationale: రూపరీత్యా బహువచనమైనా, ఇక్కడ వ్యక్తి జీవించి ఉండడాన్ని సూచించే హీబ్రూ ప్రయోగం. ఆధునిక తెలుగులో ‘నీ ప్రాణం’ సహజంగా ఉండి, మనుగడ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּלֻאִים
  choice: త్రిశంకులో వేలాడుతూ ఉంటుంది
  rationale: תלה (‘వేలాడుట’) నుంచి వచ్చిన రూపం. ‘వేలాడుతూ’ అనే మూలచిత్రాన్ని నిలుపుతూ, ‘త్రిశంకులో’ అనేది ప్రాణం నిలుస్తుందో లేదో తెలియని నిరంతర అనిశ్చితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְךָ מִנֶּגֶד
  choice: నీ కళ్లముందే
  rationale: అక్షరార్థంగా ‘నీ ఎదుట/నీ ముందర’. ప్రమాదం ఎప్పుడూ ఎదురుగా ఉన్నట్లున్న స్థానిక చిత్రాన్ని ‘నీ కళ్లముందే’ స్పష్టంగా నిలుపుతుంది.
- source_word: וּפָחַדְתָּ
  choice: నీవు ... భయపడతావు
  rationale: פחד భయం లేదా బెదురు భావాన్ని సూచిస్తుంది. సందర్భాన్ని అతిశయింపకుండా నేరుగా అనువదించబడింది.
- source_word: לַיְלָה וְיוֹמָם
  choice: రాత్రింబగళ్లు
  rationale: హీబ్రూ క్రమంలోని ‘రాత్రి మరియు పగలు’ భావాన్ని సహజమైన తెలుగు సమాసంతో తెలియజేసి, ఎడతెగని భయాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: నీ ప్రాణం నిలుస్తుందనే నమ్మకం నీకు ఉండదు
  rationale: אמן హిఫీల్ రూపం ఇక్కడ మతపరమైన విశ్వాసం కంటే తన మనుగడపై నిశ్చయత లేదా ధీమా లేకపోవడాన్ని సూచిస్తుంది. ‘ప్రాణం నిలుస్తుందనే నమ్మకం’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
