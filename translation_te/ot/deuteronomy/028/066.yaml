review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys continual dread and lack of confidence in continued survival. However, “త్రిశంకులో” imports a specifically Indian mythological idiom not present in the Hebrew. The Hebrew retains the concrete image of life hanging/suspended before the person, with its precarious uncertainty.
  naturalness: Apart from “త్రిశంకులో,” the Telugu is fluent and suitably solemn. “నీ జీవితం నీ ఎదుట వేలాడుతూ ఉంటుంది” is natural enough in context, especially with a footnote explaining the metaphor.
  terminology: “జీవితం” is preferable here to “ప్రాణం” for חַיֶּיךָ, since the expression concerns one’s continued life/survival. The final clause can retain “ప్రాణం నిలుస్తుందనే నమ్మకం” as an idiomatic explanation of lacking assurance regarding survival.
  issues:
  - severity: medium
    issue: The phrase “త్రిశంకులో” is used for תְּלֻאִים.
    rationale: This phrase evokes the Trishanku story and adds a culturally and religiously specific allusion absent from the Hebrew. It also risks shifting the image from precarious suspension to a fixed idiom. The translation should preserve the hanging image without importing that allusion.
  revised_text: నీ జీవితం నీ ఎదుట వేలాడుతూ ఉంటుంది[a]. నీవు రాత్రింబగళ్లు భయపడతావు; నీ ప్రాణం నిలుస్తుందనే నమ్మకం నీకు ఉండదు.
  revised_footnotes:
  - marker: a
    text: లేదా, “నీ జీవితం నీ ముందర వేలాడుతూ ఉంటుంది.” హీబ్రూలో జీవితం ప్రమాదకరంగా వేలాడుతున్న చిత్రం ఉంది; అది బతుకుతామో లేదో అనే నిరంతర అనిశ్చితిని వ్యక్తం చేస్తుంది.
