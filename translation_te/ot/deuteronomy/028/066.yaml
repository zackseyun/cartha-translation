translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన శైలి. మూలంలోని ‘వేలాడుట’ చిత్రాన్ని నిలిపి, మనుగడపై అనిశ్చితిని సహజంగా తెలిపేందుకు ‘త్రిశంకులో’ వాడబడింది; చివరి వాక్యం אמן యొక్క సందర్భానుగుణమైన నిశ్చయత/ధీమా భావాన్ని వ్యక్తం చేస్తుంది.
