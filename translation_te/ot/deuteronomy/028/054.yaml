id: DEU.28.54
reference: Deuteronomy 28:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ/אִישׁ֙ הָ/רַ֣ךְ בְּ/ךָ֔ וְ/הֶ/עָנֹ֖ג מְאֹ֑ד תֵּרַ֨ע עֵינ֤/וֹ בְ/אָחִי/ו֙ וּ/בְ/אֵ֣שֶׁת חֵיק֔/וֹ וּ/בְ/יֶ֥תֶר בָּנָ֖י/ו אֲשֶׁ֥ר יוֹתִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: te
  text: మీలో సుకుమారుడిగా, ఎంతో నాజూకుగా జీవించిన పురుషుడు సైతం తన సహోదరుణ్ణి[a], తన ఒడిలోని భార్యను, తనకు మిగిలి ఉన్న పిల్లలను[b] విరోధభావంతో చూస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని కన్ను చెడ్డదవుతుంది.” ఈ హెబ్రీ నుడికారం విరోధం, పంచడానికి ఇష్టపడని పిసినారితనం, లేదా ఇతరులకు ఇవ్వడానికి నిరాకరించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు మిగిల్చిన పిల్లలను.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: పురుషుడు
  rationale: తదుపరి వచనంలోని స్త్రీతో జతగా ఇక్కడ ప్రత్యేకంగా పురుషుణ్ణే సూచిస్తున్నందున లింగాన్ని స్పష్టంగా నిలిపింది.
- source_word: הָרַךְ בְּךָ וְהֶעָנֹג מְאֹד
  choice: మీలో సుకుమారుడిగా, ఎంతో నాజూకుగా జీవించిన
  rationale: רַךְ లోని మృదుత్వాన్ని ‘సుకుమారుడు’ తెలియజేస్తుంది; עָנֹג సూచించే సౌఖ్యానికి అలవాటైన సున్నిత జీవనస్థితిని ‘నాజూకుగా జీవించిన’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תֵּרַע עֵינוֹ
  choice: విరోధభావంతో చూస్తాడు
  rationale: అక్షరార్థంగా ‘అతని కన్ను చెడ్డదవుతుంది’ అనే హెబ్రీ నుడికారానికి తెలుగులో సహజమైన రూపం. సందర్భంలో ఇది పంచడానికి ఇష్టపడని కాఠిన్యం, ద్వేషపూరిత వైఖరి రెండింటినీ సూచించగలదు; ఆ విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
- source_word: בְאָחִיו
  choice: తన సహోదరుణ్ణి
  rationale: సాధారణ అర్థమైన సొంత సహోదరుణ్ణే నిలిపింది; విస్తృత బంధుత్వార్థాన్ని అనవసరంగా చేర్చలేదు.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: తన ఒడిలోని భార్యను
  rationale: חֵיקוֹ లోని సన్నిహితమైన ‘ఒడి’ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: יֶתֶר בָּנָיו
  choice: మిగిలి ఉన్న పిల్లలను
  rationale: בָּנִים ఇక్కడ సంతానాన్ని సమష్టిగా సూచించగలదు; అందువల్ల ‘కుమారులు’ కంటే ‘పిల్లలు’ సందర్భానికి తగినది.
- source_word: אֲשֶׁר יוֹתִיר
  choice: తనకు మిగిలి ఉన్న
  rationale: యుద్ధముట్టడి మధ్య అతనికి ఇంకా మిగిలిన సంతానాన్ని సూచించే భావాన్ని సహజంగా అందిస్తుంది; అతడే ఉద్దేశపూర్వకంగా వారిని విడిచిపెట్టాడనే భావాన్ని మోపదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హెబ్రీలోని ‘కన్ను చెడ్డదవడం’ అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో యాంత్రికంగా ఉంచకుండా దాని ప్రధాన భావాన్ని తెలిపి, అక్షరరూపం మరియు భావవిస్తృతిని పాదటిప్పణిలో సంరక్షించాం. [b] గుర్తును అది వివరిస్తున్న ‘మిగిలి ఉన్న పిల్లలు’ పదబంధానికే జతచేశాం.
