translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ధర్మశాస్త్ర శైలి వాడబడింది. మూలంలోని మేకు అనే రూపాన్ని నిలుపుతూ దాని కార్యాన్ని సందర్భం ద్వారా తెలియజేశాం; అపరిచితమైన హెబ్రీయు నుడికారాన్ని సహజంగా అనువదించి పాదసూచికలో అక్షరార్థాన్ని భద్రపరిచాం.
