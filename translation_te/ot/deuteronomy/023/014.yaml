source:
  edition: WLC
  text: וְ/יָתֵ֛ד תִּהְיֶ֥ה לְ/ךָ֖ עַל אֲזֵנֶ֑/ךָ וְ/הָיָה֙ בְּ/שִׁבְתְּ/ךָ֣ ח֔וּץ וְ/חָפַרְתָּ֣ה בָ֔/הּ וְ/שַׁבְתָּ֖ וְ/כִסִּ֥יתָ אֶת צֵאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: te
  text: నీ సామగ్రిలో ఒక మేకు[a][b] ఉండాలి. నీవు బయట కూర్చున్నప్పుడు[c], దానితో తవ్వి, తిరిగి వచ్చి నీ మలాన్ని కప్పివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గుడారపు మేకు’ లేదా ‘కొయ్య’; సందర్భాన్ని బట్టి కొందరు దీనిని తవ్వే పనిముట్టు లేదా చిన్న పారగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘నీ చెవి మీద.’ ఇక్కడి హెబ్రీయు ప్రయోగం బహుశా వ్యక్తి వెంట ఉంచుకునే సామగ్రిని లేదా పరికరాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీయులో ‘నీవు బయట కూర్చున్నప్పుడు’ అని ఉంది; ఇది మలవిసర్జనను సూచించే మర్యాదాపూర్వక వ్యంజన.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: మేకు
  rationale: ఈ నామవాచకం సాధారణంగా గుడారపు మేకు లేదా కొయ్యను సూచిస్తుంది. ఇక్కడ అది తవ్వడానికి ఉపయోగించే పరికరంగా పనిచేస్తుంది; ‘మేకు’ మూలంలోని రూపకల్పనను నిలుపుతుంది, తరువాతి క్రియ దాని ఉపయోగాన్ని స్పష్టం చేస్తుంది.
- source_word: עַל אֲזֵנֶךָ
  choice: నీ సామగ్రిలో
  rationale: అక్షరార్థంగా ‘నీ చెవి మీద’ అయినప్పటికీ, ఈ సందర్భంలో సైనికుని వెంట ఉండే సామగ్రి లేదా పరికరాలను సూచించే అరుదైన ప్రయోగంగా అర్థమవుతుంది. సహజమైన తెలుగులో సందర్భార్థాన్ని అందించడానికి ‘నీ సామగ్రిలో’ అని అనువదించబడింది.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: నీవు మలవిసర్జన కోసం బయట కూర్చున్నప్పుడు
  rationale: అక్షరార్థం ‘నీవు బయట కూర్చున్నప్పుడు.’ సందర్భంలో ఇది మలవిసర్జనను సూచించే మర్యాదాపూర్వక వ్యంజన. ప్రధాన పాఠ్యంలో ఉద్దేశం స్పష్టంగా ఉండేలా చేసి, హెబ్రీయు వ్యంజనను పాదసూచికలో తెలిపాం.
- source_word: וְחָפַרְתָּה בָהּ
  choice: దానితో తవ్వి
  rationale: స్త్రీలింగ సర్వనామం יָתֵדను తిరిగి సూచిస్తుంది. హెబ్రీయులో ‘గుంత’ అనే పదం ప్రత్యక్షంగా లేదు కాబట్టి దాన్ని చేర్చలేదు.
- source_word: וְשַׁבְתָּ
  choice: తిరిగి
  rationale: שׁוב ఇక్కడ తవ్విన తరువాత మళ్లీ తిరిగి మలాన్ని కప్పే చర్యను సూచిస్తుంది. ‘తిరిగి’ చర్యల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: צֵאָתֶךָ
  choice: నీ మలాన్ని
  rationale: ఈ పదం మానవ విసర్జిత పదార్థాన్ని సూచిస్తుంది. ‘మలం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, మర్యాదగల, న్యాయవిధి శైలికి తగిన పదం.
