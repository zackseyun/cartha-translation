id: DEU.23.5
reference: Deuteronomy 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: te
  text: ఎందుకంటే, మీరు ఐగుప్తు నుండి బయలుదేరినప్పుడు మార్గంలో వారు రొట్టెతోను నీళ్లతోను మిమ్మల్ని ఎదుర్కొనలేదు; మిమ్మల్ని శపించేందుకు అతడు అరామ్-నహరాయిము[a]లోని పెతోరు నుండి బెయోరు కుమారుడైన బిలామును మీకు విరోధంగా కూలికి నియమించుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అరామ్-నహరాయిమును సంప్రదాయంగా మెసొపొతామియాతో గుర్తిస్తారు; ఈ పేరుకు అక్షరార్థం ‘రెండు నదుల అరాము.’
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: ఎందుకంటే
  rationale: ముందటి నిషేధానికి కారణాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో కారణార్థకంగా వ్యక్తపరుస్తుంది.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: మిమ్మల్ని ఎదుర్కొనలేదు
  rationale: సరఫరాలతో ఎదురువచ్చే భావాన్ని నిలుపుతుంది; ‘స్వాగతించలేదు’ అనేది మూలంలో ఉన్నదానికంటే బలమైన వ్యాఖ్యానం అవుతుంది.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: రొట్టెతో, నీళ్లతో
  rationale: మూలంలోని రెండు నిర్దిష్ట నామవాచకాలను నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: בַּדֶּרֶךְ
  choice: మార్గంలో
  rationale: స్థానార్థక ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: మీరు ఐగుప్తు నుండి బయలుదేరి ... ఉన్నప్పుడు
  rationale: హీబ్రూ క్రియానామక నిర్మాణంలోని కాలార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַאֲשֶׁר
  choice: అంతేకాక
  rationale: మొదటి కారణానికి సమాంతరంగా రెండవ కారణాన్ని కలుపుతుంది; తెలుగు వాక్యంలో కారణ సంబంధం సందర్భం ద్వారా స్పష్టంగా ఉంటుంది.
- source_word: שָׂכַר עָלֶיךָ
  choice: అతడు మీకు విరోధంగా కూలికి పిలిపించాడు
  rationale: שׂכר లోని కూలికి నియమించే భావాన్నీ, עַל లోని శత్రుత్వ దిశనూ రెండింటినీ నిలుపుతుంది.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: బెయోరు కుమారుడైన బిలాము
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరిస్తూ హీబ్రూ పితృనామ సంబంధాన్ని నిలుపుతుంది.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: అరామ్-నహరాయిములోని పెతోరు నుండి
  rationale: రెండు స్థలనామాల హీబ్రూ రూపాలను నిలిపి, వాటి భౌగోళిక సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: לְקַלְלֶךָּ
  choice: మిమ్మల్ని శపించడానికి
  rationale: క్రియానామంలోని ఉద్దేశార్థాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: שָׂכַר అనే ఏకవచన కర్తకు సూచన
  choice: అతడు
  alternative: వారు
  rationale: హీబ్రూ పాఠంలోని ఏకవచన క్రియారూపాన్ని నిలుపుతూ, సందర్భంలో అమ్మోను/మోయాబు సంబంధిత సమూహ ప్రస్తావనతో ఏర్పడే సంఖ్యా ఉద్రిక్తతను సరిచేయకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘రొట్టె,’ ‘శపించడానికి,’ ‘విరోధంగా’ వంటి స్పష్టమైన పదాలతో మూలంలోని నిర్దిష్టతను నిలిపాం. పాదసూచిక గుర్తు సంబంధిత స్థలనామం తరువాత కాక వాక్యాంతంలో ఉంచబడింది, అయితే అది ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంది.
