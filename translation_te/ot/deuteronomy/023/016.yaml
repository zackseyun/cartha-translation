id: DEU.23.16
reference: Deuteronomy 23:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תַסְגִּ֥יר עֶ֖בֶד אֶל אֲדֹנָ֑י/ו אֲשֶׁר יִנָּצֵ֥ל אֵלֶ֖י/ךָ מֵ/עִ֥ם אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: te
  text: తన యజమాని దగ్గరనుంచి తప్పించుకొని నీ దగ్గరకు వచ్చిన బానిసను అతని యజమానికి అప్పగించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకుడు.’ హీబ్రూ పదం సేవకుడిని లేదా బానిసను సూచించగలదు; అయితే ఈ సందర్భంలో ఆ వ్యక్తి యజమాని ఆధీనంలో ఉండడం ప్రధానమైనందున ‘బానిస’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: అప్పగించకూడదు
  rationale: హిఫిల్ రూపం ఒక వ్యక్తిని మరొకరి ఆధీనానికి అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగించు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఈ న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: עֶבֶד
  choice: బానిస
  rationale: ఈ సందర్భంలో ఆ వ్యక్తి యజమాని అధికారానికి లోబడి ఉండడం, అతని దగ్గరనుంచి పారిపోవడం ప్రధానాంశాలు. అందువల్ల ‘సేవకుడు’ కంటే ‘బానిస’ బంధిత సామాజిక స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל אֲדֹנָיו
  choice: అతని యజమానికి
  rationale: ఈ సామాజిక-న్యాయ సందర్భంలో אָדוֹן దైవిక బిరుదు కాదు; బానిసపై అధికారం కలిగిన యజమానిని సూచిస్తుంది.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: తప్పించుకొని ... వచ్చిన
  rationale: నిఫాల్ రూపానికి ‘రక్షింపబడుట’ లేదా ‘తప్పించుకొనుట’ అనే భావాలు ఉండవచ్చు. యజమాని దగ్గరనుంచి పారిపోయిన బానిస సందర్భంలో ‘తప్పించుకొని’ అత్యంత సహజం; సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘వచ్చిన’తో కలిపి అనువదించబడింది.
- source_word: אֵלֶיךָ
  choice: నీ దగ్గరకు
  rationale: אֶל సంబోధితుని వైపు కదలికను సూచిస్తుంది; ‘నీ దగ్గరకు’ ఆ దిశాభావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: מֵעִם אֲדֹנָיו
  choice: తన యజమాని దగ్గరనుంచి
  rationale: מֵעִם యజమానితో ఉన్న స్థలం లేదా సహవాసం నుంచి వేరుకావడాన్ని సూచిస్తుంది. ‘దగ్గరనుంచి’ ఈ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: עֶבֶד అనే సామాజిక స్థితి పదం
  choice: బానిస
  alternative: సేవకుడు
  rationale: వాక్యం యజమాని అధికారానికి లోబడిన వ్యక్తి తప్పించుకొని రావడం, అతన్ని తిరిగి అప్పగించకూడదనే ఆజ్ఞ గురించి చెబుతుంది. బంధిత స్థితి ఇక్కడ కేంద్రీయమైనందున ‘బానిస’ మూలపాఠానికి మరింత స్పష్టంగా సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆజ్ఞా శైలి ఉపయోగించబడింది. ఏకవచన సంబోధన ‘నీ’ మూలంలోని రెండవ పురుష ఏకవచనాన్ని నిలుపుతుంది; ‘అప్పగించకూడదు’ నిషేధాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
