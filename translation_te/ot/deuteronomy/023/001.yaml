review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the two prohibitions, the relationship “his father’s wife,” and the deliberately euphemistic garment-edge metaphor of כְּנַף. However, “స్వీకరించకూడదు” normally means “must not accept/receive” and is less faithful and less idiomatic here than “తీసుకోకూడదు,” which can retain the Hebrew’s broad “take” while allowing its marital force.
  naturalness: “తన తండ్రి భార్యను తీసుకోకూడదు” is more natural modern Telugu in this legal context. “వస్త్రపు అంచును విప్పకూడదు” adequately preserves the formal metaphor, though it remains intentionally opaque, as does the Hebrew.
  terminology: “తండ్రి భార్య” appropriately avoids the interpretively narrower “సవతి తల్లి.” “వస్త్రపు అంచు” is a defensible rendering of כְּנַף. The note should characterize the phrase as a sexual/marital euphemism without presenting “marital rights” as the sole meaning.
  issues:
  - severity: medium
    issue: ‘స్వీకరించకూడదు’ for יִקַּח
    rationale: In contemporary Telugu this chiefly denotes accepting or receiving something. With a wife in this prohibition, ‘తీసుకోకూడదు’ more directly reflects the Hebrew verb while retaining its possible marriage sense, which the footnote can state.
  - severity: low
    issue: Footnote b’s explanatory alternative is overly narrowed to ‘దాంపత్య హక్కు’
    rationale: The euphemism concerns a prohibited sexual/marital violation, but ‘rights’ is an interpretive abstraction. A note using ‘తండ్రి దాంపత్య శయ్యను ఉల్లంఘించడం’ better conveys an available idiomatic sense while marking it as a possible sense.
  revised_text: ఏ పురుషుడూ తన తండ్రి భార్యను తీసుకోకూడదు[a]; తన తండ్రి వస్త్రపు అంచును విప్పకూడదు[b].
