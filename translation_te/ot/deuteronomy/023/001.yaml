  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: te
  text: ఏ పురుషుడూ తన తండ్రి భార్యను తీసుకోకూడదు[a]; తన తండ్రి వస్త్రపు అంచును విప్పకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘తన తండ్రి భార్యను వివాహం చేసుకోకూడదు.’'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: ‘తన తండ్రి వస్త్రపు అంచును విప్పకూడదు.’ ఇది లైంగిక లేదా దాంపత్య సంబంధాన్ని సూచించే నిగూఢోక్తి; భావార్థంగా, ‘తన తండ్రి దాంపత్య శయ్యను ఉల్లంఘించకూడదు’ అని కూడా అర్థం కావచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: స్వీకరించకూడదు
  rationale: לָקַח అనే క్రియకు ‘తీసుకోవడం’ అనే ప్రాథమిక అర్థం ఉంది; ‘భార్య’తో వాడినప్పుడు వివాహం చేసుకోవడం అనే భావం రావచ్చు. ‘స్వీకరించకూడదు’ మూలంలోని విస్తృతతను నిలుపుతూ, వివాహార్థాన్ని [a] పాదసూచికలో స్పష్టం చేస్తుంది.
- source_word: אִישׁ
  choice: ఏ పురుషుడూ
  rationale: ఏకవచన పుంలింగ నామవాచకాన్ని లింగస్పష్టతతో తెలుగులో సహజమైన నిషేధ వాక్య నిర్మాణంగా అందిస్తుంది.
- source_word: אֵשֶׁת אָבִיו
  choice: తన తండ్రి భార్యను
  rationale: ‘తండ్రి భార్య’ అనే సంబంధాన్ని యథాతథంగా నిలుపుతుంది; ‘సవతి తల్లి’ అని అనువదించి మూలంలో లేని కుటుంబ సంబంధాన్ని సంకుచితం చేయదు.
- source_word: יְגַלֶּה
  choice: విప్పకూడదు
  rationale: גלה ఇక్కడ కప్పబడి ఉన్నదాన్ని తెరవడం లేదా తొలగించడం అనే భావం ఇస్తుంది. వస్త్రపు అంచుతో కలిసి ‘విప్పడం’ తెలుగు రూపకాన్ని సహజంగా ఉంచుతుంది.
- source_word: כְּנַף
  choice: వస్త్రపు అంచు
  rationale: כָּנָף కు ‘రెక్క, అంచు, వస్త్రపు కొంగు/అంచు’ అనే అర్థాలున్నాయి. ఇక్కడ ‘వస్త్రపు అంచు’ మూల రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో తప్పుదారి పట్టించే అత్యంత నిర్దిష్ట వస్త్రపదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: లైంగిక నిగూఢోక్తిని ప్రధాన పాఠంలో స్పష్టార్థంగా మార్చాలా?
  choice: ‘తన తండ్రి వస్త్రపు అంచును విప్పకూడదు’ అనే రూపకాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘తన తండ్రి దాంపత్య హక్కును ఉల్లంఘించకూడదు’ లేదా ‘తన తండ్రి నగ్నతను బయలుపరచకూడదు’
  rationale: హీబ్రూ పాఠం సాధారణమైన ‘నగ్నతను బయలుపరచడం’ అనే సూత్రాన్ని కాకుండా כְּנַף అనే వస్త్రరూపకాన్ని వాడుతుంది. దాన్ని ప్రధాన పాఠంలో నిలపడం మూలంలోని నిగూఢతను, భావ ఉద్రిక్తతను కాపాడుతుంది; లైంగిక/దాంపత్య భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘స్వీకరించు’ మరియు ‘వస్త్రపు అంచు’ మూలంలోని ఉద్దేశపూర్వక విస్తృతతను, రూపకాన్ని నిలుపుతాయి; పాదసూచికలు అవసరమైన వివరణను ఇస్తాయి.
