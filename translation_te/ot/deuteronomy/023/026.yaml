review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the situational legal clause, permission to take a small amount by hand, and prohibition of sickle harvesting. However, కోసుకోవచ్చు (‘cut for oneself’) can imply cutting rather than the manual plucking specified by וְקָטַפְתָּ; తెంపుకోవచ్చు is more precise. The rendering of the sickle action is also clearer as ‘apply/use a sickle’ than ‘put/throw a sickle.’
  naturalness: The sentence is generally clear, but ‘నిలిచివున్న ధాన్యం మధ్యకు’ is heavier than necessary, and the agricultural term ‘వెన్నులు’ is less broadly transparent than ‘ధాన్యపు కంకులు.’ The revision uses idiomatic modern standard Telugu while retaining the legal contrast.
  terminology: ‘పొరుగువాని’ suitably renders רֵעֶךָ in this legal context. ‘నిలువ ధాన్యం’ preserves the sense of standing, unharvested grain. ‘ధాన్యపు కంకులు’ clearly identifies the grain heads, and ‘కొడవలిని ప్రయోగించకూడదు’ represents the prohibition without over-specifying the debated nuance of נוּף.
  issues:
  - severity: medium
    issue: ‘కోసుకోవచ్చు’ for וְקָטַפְתָּ
    rationale: The Hebrew describes plucking/picking grain heads by hand, whereas కోయడం normally denotes cutting. ‘తెంపుకోవచ్చు’ preserves the permitted manual action more accurately.
  - severity: low
    issue: ‘వెన్నులు’ may be regionally or agriculturally less transparent
    rationale: ‘ధాన్యపు కంకులు’ is a clearer modern-standard expression for the grain-bearing heads intended by מְלִילֹת.
  - severity: low
    issue: Footnote b anchor is placed after the entire sentence rather than at the sickle expression it explains
    rationale: Moving the marker directly after ‘కొడవలిని ప్రయోగించకూడదు’ makes the anchor correspond clearly to the lexical note.
  revised_text: నీ పొరుగువాని నిలువ ధాన్యంలోకి నీవు వచ్చినప్పుడు, నీ చేతితో ధాన్యపు కంకులను[a] తెంపుకోవచ్చు; అయితే నీ పొరుగువాని నిలువ ధాన్యంపై కొడవలిని ప్రయోగించకూడదు.[b]
