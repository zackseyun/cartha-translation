- from: నీ పొరుగువాని చేలో నిలిచివున్న ధాన్యం మధ్యకు నీవు వచ్చినప్పుడు, నీ చేతితో వెన్నులను[a] కోసుకోవచ్చు; అయితే నీ పొరుగువాని చేలో నిలిచివున్న ధాన్యం మీద కొడవలి వేయకూడదు.[b]
