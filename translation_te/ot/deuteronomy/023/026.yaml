  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే వ్యవసాయ పదజాలం వాడబడింది. అనుమతి–నిషేధం మధ్య వ్యత్యాసం స్పష్టంగా ఉంచబడింది; హెబ్రీ క్రియలోని రూపక అస్పష్టతను పాదటిప్పణిలో కాపాడాం.
