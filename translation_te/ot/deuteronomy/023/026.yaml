source:
  edition: WLC
  text: כִּ֤י תָבֹא֙ בְּ/קָמַ֣ת רֵעֶ֔/ךָ וְ/קָטַפְתָּ֥ מְלִילֹ֖ת בְּ/יָדֶ֑/ךָ וְ/חֶרְמֵשׁ֙ לֹ֣א תָנִ֔יף עַ֖ל קָמַ֥ת רֵעֶֽ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: te
  text: నీ పొరుగువాని నిలువ ధాన్యంలోకి నీవు వచ్చినప్పుడు, నీ చేతితో ధాన్యపు కంకులను[a] తెంపుకోవచ్చు; అయితే నీ పొరుగువాని నిలువ ధాన్యంపై కొడవలిని ప్రయోగించకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధాన్యపు వెన్నులను.” హెబ్రీ పదం చేతితో తెంపుకోదగిన, గింజలు ఉండే ధాన్యపు పైభాగాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ పొరుగువాని నిలువ ధాన్యంపై కొడవలిని ఊపకూడదు.” హెబ్రీ క్రియ కొడవలిని ఊపడం, ఎత్తడం లేదా కోతకు ప్రయోగించడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: నీవు వచ్చినప్పుడు
  rationale: כִּי ఇక్కడ ధర్మశాస్త్రం వర్తించే సందర్భాన్ని పరిచయం చేస్తుంది; షరతును సూచించే ‘వస్తే’ కంటే ‘వచ్చినప్పుడు’ సహజంగా ఉండి సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: בְּקָמַת
  choice: చేలో నిలిచివున్న ధాన్యం మధ్యకు
  rationale: קָמָה కోతకు ముందున్న నిలువు ధాన్యాన్ని సూచిస్తుంది. తెలుగులో స్థలసంబంధాన్ని సహజంగా తెలియజేయడానికి ‘చేలో ... మధ్యకు’ అని, ధాన్యపు స్థితిని కాపాడటానికి ‘నిలిచివున్న ధాన్యం’ అని అనువదించబడింది.
- source_word: רֵעֶךָ
  choice: నీ పొరుగువాని
  rationale: న్యాయసంబంధ సందర్భంలో רֵעַ సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది; ‘పొరుగువాడు’ ఆధునిక తెలుగులో స్థిరమైన, సహజమైన సమానార్థకం.
- source_word: וְקָטַפְתָּ
  choice: కోసుకోవచ్చు
  rationale: రూపపరంగా సాధారణ క్రియ అయినా, ఈ న్యాయసందర్భంలో చేతితో కొద్దిగా తీసుకునే అనుమతిని వ్యక్తం చేస్తుంది; అందువల్ల ‘వచ్చు’ అనుమతి భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מְלִילֹת
  choice: వెన్నులను
  rationale: ఈ పదం ధాన్యపు గింజలు ఉండే కంకులు/వెన్నులను సూచిస్తుంది. వ్యవసాయ సందర్భంలో ‘వెన్నులు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతితో
  rationale: అనుమతించబడిన విధానం చేతితో మాత్రమే కోసుకోవడమని ఈ పదబంధం నిర్దిష్టం చేస్తుంది.
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: అయితే ... కొడవలి వేయకూడదు
  rationale: వావ్ ఇక్కడ చేతితో కోసుకోవడానికి అనుమతి మరియు పరికరంతో కోయడానికి నిషేధం మధ్య వ్యత్యాసాన్ని చూపుతుంది. נוּף యొక్క హిఫీల్ రూపం ఊపడం, ఎత్తడం లేదా ప్రయోగించడం అనే భావాలను కలిగి ఉంది; ‘కొడవలి వేయడం’ తెలుగులో సహజంగా ఉండి పంట కోయడానికి దానిని ప్రయోగించడాన్ని సూచిస్తుంది.
- source_word: עַל קָמַת רֵעֶךָ
  choice: నీ పొరుగువాని చేలో నిలిచివున్న ధాన్యం మీద
  rationale: עַל యొక్క ‘మీద/పై’ సంబంధాన్ని నిలుపుతూ, నిషేధం పొలానికి సాధారణంగా కాక కోతకు సిద్ధంగా నిలిచివున్న ధాన్యంపై కొడవలిని ప్రయోగించడానికేనని స్పష్టం చేస్తుంది.
