id: DEU.23.6
reference: Deuteronomy 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: te
  text: అయితే నీ దేవుడైన యాహ్వే బిలాము మాట వినడానికి ఇష్టపడలేదు; నీ దేవుడైన యాహ్వే ఆ శాపాన్ని నీ కోసం ఆశీర్వాదంగా మార్చాడు, ఎందుకంటే నీ దేవుడైన యాహ్వే నిన్ను ప్రేమించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: ఇష్టపడలేదు
  rationale: ఈ క్రియ సామర్థ్యాన్ని కాక సంకల్పం లేదా సమ్మతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇష్టపడలేదు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు / నీ దేవుడైన
  rationale: ఇది ఏకవచన ద్వితీయ పురుష ప్రత్యయంతో ఉన్న నిర్మాణరూపం; ‘నీ దేవుడు’ దాని ప్రత్యక్ష అర్థం. వాక్యంలో సహజత్వం కోసం ‘నీ దేవుడైన యెహోవా’ అని ఇచ్చాం.
- source_word: לִשְׁמֹעַ אֶל
  choice: మాట వినడానికి
  rationale: ఈ హీబ్రూ ప్రయోగం ఒకరి మాట వినడం లేదా దానికి లోబడడం అనే భావం కలిగిస్తుంది. ‘బిలాము మాట వినడానికి’ అనేది వ్యక్తిని వినడమనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, ‘లోబడడం’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: וַיַּהֲפֹךְ
  choice: మార్చాడు
  rationale: הפך ఇక్కడ ఒక దానిని మరొక ఫలితంగా తిప్పడం లేదా మార్చడం అని సూచిస్తుంది; ‘శాపాన్ని ఆశీర్వాదంగా మార్చాడు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: הַקְּלָלָה
  choice: ఆ శాపం
  rationale: నిర్దిష్ట ఉపపదం సందర్భంలో ఉద్దేశించబడిన శాపాన్ని సూచిస్తుంది; తెలుగులో ‘ఆ శాపం’ ఈ నిర్దిష్టతను సహజంగా తెలియజేస్తుంది.
- source_word: לִבְרָכָה
  choice: ఆశీర్వాదంగా
  rationale: లామెద్ ఇక్కడ మార్పు ఫలితాన్ని సూచిస్తుంది; ‘ఆశీర్వాదంగా’ తెలుగు రూపాంతర నిర్మాణానికి సరిపోతుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: ఇది యెహోవా చేసిన కార్యానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యక్రమంలో కారణ వాక్యం ముందుకు వచ్చినందున ‘కాబట్టి’ సహజంగా కారణ సంబంధాన్ని చూపుతుంది.
- source_word: אֲהֵבְךָ
  choice: నిన్ను ప్రేమించాడు
  rationale: אָהֵב యొక్క సరళమైన అర్థం ‘ప్రేమించు’; ఇది వాక్యంలోని వ్యక్తిగత, నిబంధనాత్మక ఆప్యాయతను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించేందుకు ఉపయోగించే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: ‘బిలాము మాట వినడం’ యొక్క భావపరిధి
  choice: మాట వినడానికి
  alternative: మాటకు లోబడడానికి
  rationale: שׁמע אל వినడం నుండి ఆలకించడం/అంగీకరించడం వరకు భావాన్ని కలిగి ఉండగలదు. ‘మాట వినడానికి’ మూలంలోని విస్తృతిని నిలుపుతుంది; ‘లోబడడానికి’ సందర్భార్థాన్ని మరింత నిర్దిష్టంగా నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించాం. ఏకవచన ‘నీ/నిన్ను’ ద్వారా హీబ్రూ 2ms రూపాన్ని నిలిపాం. కారణ ఉపవాక్యాన్ని తెలుగులో సహజంగా ముందుకు మార్చినా, మూలంలోని కార్య–కారణ సంబంధాన్ని యథాతథంగా ఉంచాం.
