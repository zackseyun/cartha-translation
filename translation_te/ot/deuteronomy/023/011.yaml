id: DEU.23.11
reference: Deuteronomy 23:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: te
  text: మీలో రాత్రివేళ వీర్యస్రావం వల్ల ఆచారపరంగా శుద్ధి లేని పురుషుడు ఉంటే, అతడు శిబిరం వెలుపలికి వెళ్లాలి; శిబిరం లోపలికి రాకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: లేకపోతే
  rationale: ఈ న్యాయసందర్భంలో షరతును పరిచయం చేస్తుంది; తెలుగులో వాక్యాంతంలోని ‘లేకపోతే’ సహజంగా ఆ షరతును వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: మీలో ఒక పురుషుడు
  rationale: היה యొక్క అస్తిత్వ భావాన్నీ, בְךָ యొక్క సమాజం-మధ్య భావాన్నీ నిలుపుతుంది. ఇక్కడ పేర్కొన్న శారీరక స్థితి పురుషునికి ప్రత్యేకమైనది కాబట్టి ‘పురుషుడు’ అని అనువదించబడింది.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: శుద్ధిగా లేకపోతే
  rationale: ఇది నైతిక అపరాధాన్ని కాక ఆచారపరమైన శుద్ధి స్థితిని సూచిస్తుంది; ‘శుద్ధిగా లేకపోతే’ ఆ భేదాన్ని గౌరవప్రదంగా నిలుపుతుంది.
- source_word: מִקְּרֵה לָיְלָה
  choice: రాత్రివేళ వీర్యస్రావం కలిగినందువల్ల
  rationale: అక్షరార్థంగా ‘రాత్రి సంభవం’ అనే హీబ్రూ నానుడి; సందర్భంలో నిద్రలో జరిగే వీర్యస్రావాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు స్పష్టంగా ఉండేందుకు ప్రత్యక్షమైన, వైద్యపరంగా సహజమైన పదప్రయోగం ఎంచుకోబడింది.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: అతడు శిబిరం వెలుపలికి వెళ్లాలి
  rationale: తదుపరి న్యాయనిర్దేశాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, శిబిరపు హద్దుల బయటకు వెళ్లే కదలికను నిలుపుతుంది.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: శిబిరం మధ్యలోకి రాకూడదు
  rationale: תּוֹךְ లోని ‘లోపలి భాగం/మధ్య’ భావాన్ని సాధారణ ‘ప్రవేశించకూడదు’ కంటే స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ వచనంలోని అశుద్ధత స్వభావం
  choice: నైతిక కల్మషంగా కాక ఆచారపరమైన శుద్ధి లేమిగా అనువదించడం
  alternative: ఈ స్థితి నైతిక తప్పును సూచిస్తున్నట్లు అనువదించడం
  rationale: సందర్భం శిబిర పరిశుద్ధతకు సంబంధించిన నియమాలనూ శారీరక స్రావం వల్ల కలిగే ఆచారపరమైన స్థితినీ గురించి మాట్లాడుతుంది; వ్యక్తిగత పాపదోషాన్ని వచనం పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. శారీరక విషయాన్ని అస్పష్టంగా దాచకుండా, అశ్లీలత లేకుండా స్పష్టంగా తెలిపింది; ఆచారపరమైన శుద్ధిని నైతిక అపరాధంతో కలపలేదు.
