  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: te
  text: ఎందుకంటే, నిన్ను రక్షించడానికి, నీ శత్రువులను నీ చేతికి అప్పగించడానికి[a] నీ దేవుడైన యాహ్వే నీ శిబిరం మధ్య సంచరిస్తున్నాడు. కాబట్టి నీ శిబిరం పవిత్రంగా ఉండాలి; ఆయన నీ శిబిరంలో ఏ అసభ్యకరమైన విషయాన్నైనా చూసి నీ వెనుకనుంచి తిరిగిపోకుండా ఉండేందుకు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ శత్రువులను నీ ఎదుట ఇవ్వడానికి.’ ఈ హీబ్రూ నుడికారం వారిని నీ అధికారంలోకి అప్పగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏదైనా సిగ్గుకరమైన విషయం.’ ఈ హీబ్రూ వ్యక్తీకరణ విస్తృతమైనది; శిబిరాన్ని అపవిత్రం చేసే అసభ్యకరమైన, సిగ్గుకరమైన లేదా అపవిత్రమైన దానిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నీ వెనుకనుంచి తిరిగిపోవడం.’ యాహ్వే ఇక శిబిరంతో పాటు సాగకపోవడాన్ని ఈ చిత్రం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: מִתְהַלֵּךְ
  choice: సంచరిస్తున్నాడు
  rationale: శిబిరం మధ్య దేవుని క్రియాశీల సాన్నిధ్యాన్ని తెలిపే హిత్పయేల్ రూపంలోని కదలిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: నీ శిబిరం మధ్య
  rationale: בקרב లోని ‘మధ్యలో/లోపల’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַצִּילְךָ
  choice: నిన్ను రక్షించడానికి
  rationale: సైనిక సందర్భంలోని ప్రమాదం నుంచి విడిపించడం లేదా కాపాడడం అనే భావాన్ని సాధారణ తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: నీ శత్రువులను నీ చేతికి అప్పగించడానికి
  rationale: అక్షరార్థంగా ‘నీ ఎదుట ఇవ్వడం’ అనే హీబ్రూ నుడికారానికి ఉన్న ‘నీ అధికారంలోకి అప్పగించడం’ అనే అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరరూపాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: కాబట్టి నీ శిబిరం పవిత్రంగా ఉండాలి
  rationale: దేవుని సాన్నిధ్యం కారణంగా శిబిర పవిత్రత తప్పనిసరి అనే సందర్భోచిత, ఆజ్ఞాత్మక బలాన్ని చూపుతుంది.
- source_word: עֶרְוַת דָּבָר
  choice: అసభ్యమైనదేదైనా
  rationale: ఈ విస్తృత హీబ్రూ వ్యక్తీకరణను కేవలం నగ్నత్వానికే పరిమితం చేయకుండా, సిగ్గుకరమైన లేదా అపవిత్రమైన విషయాన్నీ సూచించేలా ఉంచుతుంది.
- source_word: וְלֹא יִרְאֶה בְךָ
  choice: ఆయన నీ మధ్య ... చూసి
  rationale: ఏకవచనంగా సంబోధించబడిన ఇశ్రాయేలు సమాజంలో ఏదైనా కనిపించడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: నీ వెనుకనుంచి తిరిగిపోకూడదు
  rationale: ‘నీ వెనుకనుంచి తిరగడం’ అనే మూలపాఠంలోని స్థలాత్మక చిత్రాన్ని నిలుపుతూ, దేవుడు శిబిరంతో ఇక సాగకపోవడం అనే సందర్భార్థాన్ని సూచిస్తుంది.
theological_decisions:
- issue: యాహ్వే శిబిరంలో ‘సంచరించడం’ అనే మానవరూప వర్ణన
  choice: దేవుని సాన్నిధ్యాన్ని అమూర్తంగా మార్చకుండా ‘సంచరిస్తున్నాడు’ అనే కదలిక భాషను నిలుపడం
  alternative: ‘నీ శిబిరంలో ఉన్నాడు’ అని అనువదించడం
  rationale: మూలపాఠం దేవుని సమీప సాన్నిధ్యాన్ని ఉద్దేశపూర్వకంగా కదలిక రూపంలో చిత్రిస్తుంది; దైవ శరీరత్వంపై అదనపు సిద్ధాంత నిర్ణయం చేయకుండా ఆ చిత్రాన్ని అనువాదం కాపాడుతుంది.
- issue: శిబిర పవిత్రత వాక్యానికి ఉన్న బలం
  choice: ‘పవిత్రంగా ఉండాలి’ అనే బాధ్యతారూపం
  alternative: ‘పవిత్రంగా ఉంటుంది’ లేదా ‘పవిత్రంగా ఉండును’
  rationale: సందర్భంలో ఇది కేవలం భవిష్యద్వాక్యం కాదు; యాహ్వే సాన్నిధ్యాన్ని బట్టి శిబిరంపై విధించబడిన అవసరాన్ని సూచిస్తుంది.
- issue: యాహ్వే ‘వెనుకనుంచి తిరిగిపోవడం’
  choice: మూలంలోని స్థలాత్మక చిత్రాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘నిన్ను విడిచిపెట్టడం’ అని భావానువాదం చేయడం
  rationale: మూలపాఠం దేవుడు ప్రజలతో పాటు సాగుతున్న చిత్రాన్ని, ఆయన ఇక వారితో సాగకపోయే ప్రమాదాన్ని కలిపి ఉంచుతుంది; మరింత నిర్దిష్టమైన సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన ‘నీ’ ద్వారా హీబ్రూలో సమష్టిగా సంబోధించబడిన ఇశ్రాయేలును ప్రతిబింబించింది. దైవ నామాన్ని ‘యాహ్వే’గా నిలిపి, మానవరూప కదలిక చిత్రాన్నీ శిబిర పవిత్రతకు ఉన్న ఆజ్ఞాత్మక బలాన్నీ సంరక్షించింది.
