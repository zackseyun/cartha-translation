review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Yahweh's active presence in the camp, deliverance, handing enemies over, the required holiness of the camp, and the consequence of seeing an indecent matter and withdrawing from behind Israel. The footnote on the enemy idiom is sound, and the spatial imagery in the final clause is retained.
  naturalness: The final Telugu sentence is understandable, but “ఆయన నీ మధ్య అసభ్యమైనదేదైనా చూసి, నీ వెనుకనుంచి తిరిగిపోకూడదు” can read as a direct prohibition addressed to Yahweh. Recasting it as the purpose/consequence of the camp's holiness more naturally represents the Hebrew clause sequence.
  terminology: “యాహ్వే,” “శిబిరం,” and “పవిత్రంగా ఉండాలి” are suitable modern-standard Telugu choices. “ఏ అసభ్యకరమైన విషయాన్నైనా” is more idiomatic and clearly renders the broad Hebrew expression עֶרְוַת דָּבָר than the substantivized “అసభ్యమైనదేదైనా.”
  issues:
  - severity: medium
    issue: The final negative clause is syntactically ambiguous in Telugu.
    rationale: 'The wording with “తిరిగిపోకూడదు” may sound like an injunction that Yahweh must not turn away, rather than the stated purpose/result: the camp must be holy so that he does not see an indecent matter and turn away.'
  - severity: low
    issue: “అసభ్యమైనదేదైనా” is less natural than a noun phrase.
    rationale: The Hebrew idiom denotes an indecent/shameful matter. “ఏ అసభ్యకరమైన విషయాన్నైనా” is natural Telugu and retains its breadth without restricting it to literal nudity.
  revised_text: ఎందుకంటే, నిన్ను రక్షించడానికి, నీ శత్రువులను నీ చేతికి అప్పగించడానికి[a] నీ దేవుడైన యాహ్వే నీ శిబిరం మధ్య సంచరిస్తున్నాడు. కాబట్టి నీ శిబిరం పవిత్రంగా ఉండాలి; ఆయన నీ శిబిరంలో ఏ అసభ్యకరమైన విషయాన్నైనా చూసి నీ వెనుకనుంచి తిరిగిపోకుండా ఉండేందుకు[b][c].
