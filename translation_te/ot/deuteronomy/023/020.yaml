source:
  edition: WLC
  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: te
  text: నీ సోదరుని నుండి[a] డబ్బుపై[c] వడ్డీని, ఆహారంపై వడ్డీని[b], లేదా వడ్డీకి ఇచ్చే ఏ ఇతర వస్తువుపై వడ్డీని తీసుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ సోదరుడు’ అని అక్షరార్థం; సందర్భంలో ‘నీ తోటి ఇశ్రాయేలీయుడు’ లేదా ‘నీ స్వజాతీయుడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘వడ్డీ’ అనేది సాధారణంగా అప్పుపై తీసుకునే వడ్డీని సూచిస్తుంది; కేవలం మితిమీరిన వడ్డీని మాత్రమే కాదు.
    reason: lexical_alternative
  - marker: c
    text: ‘డబ్బు’కు అక్షరార్థం ‘వెండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: వడ్డీ వసూలు చేయకూడదు
  rationale: నשׁך హిఫీల్ రూపం అప్పుపై వడ్డీ విధించడం లేదా వసూలు చేయడం అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగు న్యాయసంబంధ సందర్భంలో ‘వడ్డీ వసూలు చేయడం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְאָחִיךָ
  choice: నీ సోదరుని దగ్గర
  rationale: మూలంలో అక్షరార్థంగా ‘నీ సోదరుడు’ ఉంది; ఇది నిబంధన సమాజంలోని సహోదర సంబంధాన్ని నిలుపుతుంది. ‘దగ్గర’ అనేది ఎవరినుంచి వడ్డీ వసూలు చేయకూడదో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נֶשֶׁךְ
  choice: వడ్డీ
  rationale: ఈ పదం అప్పుపై వసూలు చేసే వడ్డీని సాధారణంగా సూచిస్తుంది; కేవలం మితిమీరిన వడ్డీ అనే సంకుచిత అర్థాన్ని జోడించదు.
- source_word: כֶּסֶף
  choice: డబ్బు
  rationale: ఈ న్యాయ-ఆర్థిక సందర్భంలో כֶּסֶף అక్షరార్థంగా ‘వెండి’ అయినప్పటికీ, మారక సాధనమైన డబ్బును సూచిస్తుంది.
- source_word: אֹכֶל
  choice: ఆహారం
  rationale: ఇది తినే పదార్థాలను విస్తృతంగా సూచించే సాధారణ పదం; ‘ఆహారం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: כָּל דָּבָר
  choice: మరే దానిపైనైనా
  rationale: ఈ సమగ్ర పదబంధం డబ్బు, ఆహారం దాటి అన్ని రకాల అప్పు వస్తువులకు నిషేధాన్ని విస్తరిస్తుంది.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: వడ్డీ వసూలు చేయగల
  rationale: సాపేక్ష వాక్యం వడ్డీకి లోబడగల ఏ వస్తువునైనా సూచిస్తుంది. మూలంలోని పదపునరుక్తిని మరియు విస్తృత పరిధిని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘సోదరుడు’ అనే పదం యొక్క నిబంధనాత్మక పరిధి
  choice: ముఖ్య పాఠ్యంలో ‘నీ సోదరుడు’ను నిలుపడం
  alternative: ‘తోటి ఇశ్రాయేలీయుడు’ లేదా ‘స్వజాతీయుడు’
  rationale: మూలంలోని కుటుంబ-నిబంధనాత్మక రూపకాన్ని అనువాదంలోనే ఉంచి, దాని సందర్భానుగత పరిధిని పాదసూచికలో తెలియజేయడం వ్యాఖ్యాత్మక అతివ్యాప్తిని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘వడ్డీ’ అనే పదాన్ని మూలంలోని పునరావృతికి అనుగుణంగా మూడుసార్లు ఉంచి, నిషేధపు పరిధిని స్పష్టంగా చేశాం. అన్ని పాదసూచిక గుర్తులను ప్రధాన పాఠ్యంలో చేర్చాం.
