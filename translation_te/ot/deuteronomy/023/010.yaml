source:
  edition: WLC
  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: te
  text: నీవు నీ శత్రువుల మీదికి సైన్యంతో బయలుదేరినప్పుడు, ప్రతి చెడు విషయం నుండి నిన్ను నీవు కాపాడుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి అపవిత్రమైన దాని నుండి’ లేదా ‘అనుచితమైన దేని నుండైనా.’ హెబ్రీ పదబంధం విస్తృతమైనది; ఈ సందర్భంలో అది ఆచారపరమైన అపవిత్రతను కూడా సూచించవచ్చు, అయితే దానికే పరిమితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: బయలుదేరినప్పుడు
  rationale: ఇక్కడ כִּי తరువాతి ఆజ్ఞకు సందర్భాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు/ఎప్పుడు’ భావాన్ని ‘-నప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: תֵצֵא
  choice: బయలుదేరినప్పుడు
  rationale: יצא యొక్క సాధారణ అర్థం ‘బయటికి వెళ్లడం/బయలుదేరడం’; సైనిక సందర్భంలో ‘బయలుదేరు’ సహజంగా ఉండి, కదలికను అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: מַחֲנֶה
  choice: సైన్యంగా
  rationale: מַחֲנֶה సాధారణంగా ‘శిబిరం’ అని అర్థమైనా, יצא మరియు శత్రువుల మీదికి వెళ్లే సందర్భంలో అది శిబిరమేసిన సైనిక బలగాన్ని సూచిస్తుంది. ‘సైన్యంగా’ తెలుగులో ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עַל
  choice: మీదికి
  rationale: శత్రువులకు సంబంధించిన సైనిక సందర్భంలో עַל విరోధార్థక దిశను సూచిస్తుంది; ‘మీదికి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: אֹיְבֶיךָ
  choice: నీ శత్రువుల
  rationale: אויב మరియు రెండవ పురుష ఏకవచన ప్రత్యయం యొక్క నేరమైన, సందర్భోచిత అనువాదం.
- source_word: וְנִשְׁמַרְתָּ
  choice: నిన్ను నీవు కాపాడుకోవాలి
  rationale: שׁמר నిఫాల్ రూపంలోని ఆత్మనిర్దేశక భావాన్ని ‘నిన్ను నీవు కాపాడుకోవాలి’ నిలుపుతుంది; న్యాయోపదేశ సందర్భంలోని ఆజ్ఞను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִכֹּל
  choice: ప్రతి … విషయానికి దూరంగా
  rationale: מן తో కూడిన כֹּל, ఏదో ఒక దాని నుండి తనను కాపాడుకోవడాన్ని సూచిస్తుంది. తెలుగులో ‘ప్రతి … దూరంగా’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דָּבָר
  choice: విషయం
  rationale: דָּבָר కు ‘మాట, సంగతి, విషయం, వస్తువు’ వంటి విస్తృత అర్థాలు ఉన్నాయి. ఇక్కడ ‘విషయం’ దానిని కేవలం మాటకు లేదా భౌతిక వస్తువుకు పరిమితం చేయదు.
- source_word: רָע
  choice: చెడు
  rationale: רָע నైతికంగా చెడ్డదానితో పాటు ఈ సందర్భంలో ఆచారపరంగా అనుచితమైనదానినీ కలుపుకోగలదు. ‘చెడు’ ఆ విస్తృతిని నిలుపుతుంది; ‘అపవిత్రమైన’ అని మాత్రమే అనడం భావాన్ని సంకుచితం చేస్తుంది.
theological_decisions:
- issue: శిబిర పరిశుద్ధత నియమాల్లో דָּבָר רָע యొక్క పరిధి
  choice: ‘ప్రతి చెడు విషయం’ అని విస్తృతంగా అనువదించడం
  alternative: ‘ప్రతి అపవిత్రమైన విషయం’ లేదా ‘అనుచితమైన ఏదైనా’
  rationale: తరువాతి సందర్భం ఆచారపరమైన అపవిత్రతను ప్రస్తావించినా, హెబ్రీ పదబంధం దానికంటే విస్తృతమైనది. ప్రధాన పాఠంలో విస్తృత అర్థాన్ని ఉంచి, ప్రత్యామ్నాయ సందర్భోచిత భావాలను పాదసూచికలో ఇవ్వడం మూలంలోని ఉద్దేశపూర్వక విస్తృతిని, theological tension ను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. రెండవ పురుష ఏకవచనాన్ని ‘నీవు/నీ’తో నిలిపాం. సైనిక సందర్భాన్ని స్పష్టం చేస్తూనే హెబ్రీ పదబంధంలోని విస్తృత నైతిక-ఆచారపరమైన భావాన్ని సంకుచితం చేయలేదు.
