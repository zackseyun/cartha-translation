  edition: WLC
  text: עִמְּ/ךָ֞ יֵשֵׁ֣ב בְּ/קִרְבְּ/ךָ֗ בַּ/מָּק֧וֹם אֲשֶׁר יִבְחַ֛ר בְּ/אַחַ֥ד שְׁעָרֶ֖י/ךָ בַּ/טּ֣וֹב ל֑/וֹ לֹ֖א תּוֹנֶֽ/נּוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: te
  text: అతడు నీతోపాటు, నీ మధ్య, తనకు మేలైనదిగా అతడు ఎంచుకునే నీ పట్టణాల్లో ఒకదానిలో నివసించాలి.[a] నీవు అతణ్ణి అణచివేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ ద్వారాల్లో ఒకదానిలో.” హీబ్రూలో “ద్వారాలు” అనే మాట సందర్భానుసారంగా పట్టణాలను లేదా నివాస సముదాయాలను సూచించగలదు.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: నివసించాలి
  rationale: ישׁב అనే క్రియకు ‘కూర్చోవడం, ఉండడం, నివసించడం’ అనే అర్థాలున్నాయి. ఆశ్రయం పొందిన వ్యక్తి స్థిరంగా ఉండటాన్ని సూచించే ఈ న్యాయ సందర్భంలో ‘నివసించాలి’ సహజంగా ఉండి, కొనసాగుతున్న నివాస భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עִמְּךָ
  choice: నీతోపాటు
  rationale: עם అనే విభక్తి ప్రయోగానికి అక్షరార్థంగా ‘నీతో’ అని అర్థం. ‘నీతోపాటు’ అనేది వ్యక్తి సమాజంతో కలిసి నివసించడానికి అనుమతి ఉందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּקִרְבְּךָ
  choice: నీ మధ్య
  rationale: קרב ఇక్కడ సమాజం లోపల, దాని సభ్యుల మధ్య ఉండడాన్ని సూచిస్తుంది. ‘నీ మధ్య’ మూలంలోని సామూహిక, స్థానిక చిత్రాన్ని నిలుపుతుంది.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: తాను ఎంచుకునే చోట
  rationale: בחר అంటే ‘ఎంచుకోవడం.’ క్రియకు కర్త ఈ వ్యక్తే; యెహోవా గానీ ఇశ్రాయేలు సమాజం గానీ కాదు. అందువల్ల అతని ఎంపిక హక్కును అనువాదం స్పష్టంగా నిలుపుతుంది.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో ఒకదానిలో
  rationale: שׁערים అక్షరార్థంగా ‘ద్వారాలు’; అయితే ఇక్కడ అది ద్వారాలున్న పట్టణాలను లేదా నివాస సముదాయాలను సూచించే హీబ్రూ లక్షణార్థ ప్రయోగం. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశం వెంటనే అర్థమయ్యేలా ‘పట్టణాల్లో’ అని అనువదించి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בַּטּוֹב לוֹ
  choice: తనకు మేలైనదిగా
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘అతనికి మేలులో’ అని ఉంటుంది. అతని దృష్టిలో అనుకూలమైన లేదా ఉత్తమమైన స్థలాన్ని సూచిస్తుంది. కేవలం ఇష్టాన్ని మాత్రమే సూచించే ‘నచ్చిన’ కంటే ‘మేలైనదిగా’ మూలంలోని טוב భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: לֹא תּוֹנֶנּוּ
  choice: నీవు అతణ్ణి అణచివేయకూడదు
  rationale: ינה క్రియ యొక్క హిఫీల్ రూపం న్యాయ సందర్భాల్లో బలహీనుడిని అణచివేయడం, దోపిడీ చేయడం లేదా అన్యాయం చేయడం అనే భావాన్ని ఇస్తుంది. ‘అణచివేయకూడదు’ ఈ నిషేధంలోని సామాజిక, నైతిక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పుంలింగ ఏకవచన సర్వనామాల సూచిత వ్యక్తి
  choice: మునుపటి వచనంలో ప్రస్తావించిన పారిపోయి వచ్చిన దాసుణ్ణి ఒక వ్యక్తిగా సూచిస్తూ పుంలింగ ఏకవచన రూపాలు వాడటం
  alternative: లింగాన్ని వెల్లడించని బహువచన లేదా తటస్థ రూపాన్ని వాడటం
  rationale: హీబ్రూ పాఠమంతటా పుంలింగ ఏకవచన రూపాలే ఉన్నాయి. కాబట్టి మూలంలోని వ్యాకరణ రూపాన్ని, మునుపటి వచనంతో ఉన్న అనుసంధానాన్ని తెలుగులో నిలిపాం; దీని ద్వారా పాఠంలో లేనిది ఏ సిద్ధాంతపరమైన విస్తరణగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయశైలిని వాడాం. ఏకవచన ‘నీ/నీవు’ రూపాలు హీబ్రూలో సమాజాన్ని సమష్టిగా ఉద్దేశించిన ఏకవచన సంబోధనను నిలుపుతాయి. వాక్యక్రమాన్ని తెలుగు సహజ ప్రవాహానికి అనుగుణంగా మార్చినా, వ్యక్తి సమాజంలో నివసించడం, స్థలాన్ని తానే ఎంచుకోవడం, అతనికి మేలైన చోట ఉండడం, అతణ్ణి అణచివేయకూడదనే నాలుగు ప్రధాన అంశాలన్నీ నిలిపాం.
