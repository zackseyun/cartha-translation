id: DEU.23.19
reference: Deuteronomy 23:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: te
  text: వేశ్యకు లభించిన కూలినిగానీ, కుక్క ధరనుగానీ, ఏ మొక్కుబడికైనా నీ దేవుడైన యెహోవా ఇంటిలోకి తీసుకురాకూడదు.[a] ఎందుకంటే ఆ రెండూ నీ దేవుడైన యెహోవాకు హేయమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పురుష వేశ్యకు ఇచ్చే రుసుము.’ ఇక్కడ ‘కుక్క’ అనే పదం పురుష వేశ్యను అవమానపూర్వకంగా సూచిస్తుందని కొందరు భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: తీసుకురాకూడదు
  rationale: హిఫీల్ రూపం ఒక వస్తువును ఒక స్థలంలోకి తీసుకురావడాన్ని సూచిస్తుంది; నిషేధార్థక לֹאతో కలిసి తెలుగులో సహజమైన నిషేధ రూపంగా అనువదించబడింది.
- source_word: אֶתְנַן זוֹנָה
  choice: వ్యభిచారిణి సంపాదన
  rationale: אֶתְנַן అనేది లైంగిక సేవకు లభించిన కూలి లేదా రుసుము; זוֹנָה వేశ్యావృత్తి చేసే స్త్రీ. ‘సంపాదన’ ఆ చెల్లింపును సహజంగా తెలియజేస్తుంది.
- source_word: מְחִיר כֶּלֶב
  choice: కుక్క వెల
  rationale: מְחִיר అంటే సాధారణంగా వెల లేదా ధర; כֶּלֶב యొక్క ప్రత్యక్ష అర్థం ‘కుక్క’. వివాదాస్పదమైన రూపకార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలపదాన్ని నిలిపి ఉంచింది.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా మందిరం
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ దేవుని ఆరాధనా స్థలాన్ని తెలుగులో సహజంగా ‘మందిరం’ సూచిస్తుంది. יְהוָהను ఒడంబడిక నామమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: לְכָל נֶדֶר
  choice: ఏ మొక్కుబడికోసం అయినా
  rationale: נֶדֶר దేవునికి చేసే మొక్కుబడిని సూచిస్తుంది; לְכָל దాని ఏ సందర్భాన్నీ మినహాయించని విస్తృతిని తెలియజేస్తుంది.
- source_word: תוֹעֲבַת
  choice: హేయమైనవి
  rationale: ఈ పదం దేవుని దృష్టిలో తీవ్రంగా అసహ్యకరమైన లేదా ఆమోదయోగ్యం కాని దానిని సూచిస్తుంది; ‘హేయమైనవి’ ఆ బలమైన నైతిక-ఆరాధనా భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: גַּם שְׁנֵיהֶם
  choice: ఆ రెండూ
  rationale: ముందు ప్రస్తావించిన రెండు రకాల ఆదాయాలూ సమానంగా నిషేధితమని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: מְחִיר כֶּלֶב లో כֶּלֶב అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘కుక్క’ అని ప్రత్యక్షంగా అనువదించడం.
  alternative: ‘పురుష వేశ్య’, ముఖ్యంగా దేవాలయ వ్యభిచారిని సూచించే అవమానపూర్వక పదం.
  rationale: హీబ్రూ పదానికి నిశ్చితమైన ప్రత్యక్ష అర్థం ‘కుక్క’. ఇక్కడ రూపకార్థం ఉందా అనేది వివాదాస్పదం కాబట్టి దానిని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-ఆరాధనా శైలిని పాటించింది. ‘మొక్కుబడి’, ‘హేయమైనవి’ వంటి సులభంగా అర్థమయ్యే సంప్రదాయ పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా చేసింది.
