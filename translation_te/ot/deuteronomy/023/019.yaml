- from: వ్యభిచారిణి సంపాదననుగానీ, కుక్క వెలనుగానీ ఏ మొక్కుబడికోసం అయినా నీ దేవుడైన యెహోవా మందిరంలోకి తీసుకురాకూడదు.[a] ఎందుకంటే ఆ రెండూ నీ దేవుడైన యెహోవాకు హేయమైనవే.
  to: వేశ్యకు లభించిన కూలినిగానీ, కుక్క ధరనుగానీ, ఏ మొక్కుబడికైనా నీ దేవుడైన యెహోవా ఇంటిలోకి తీసుకురాకూడదు.[a] ఎందుకంటే ఆ రెండూ నీ దేవుడైన యెహోవాకు హేయమైనవి.
  rationale: The revision corrects the referent of זוֹנָה, preserves the literal ‘house’ rather than interpreting it as ‘temple,’ and improves idiomatic Telugu for ‘price of a dog.’ The footnote retains the disputed alternative without presenting a cultic interpretation as certain.
