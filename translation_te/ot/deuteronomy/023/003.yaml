  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: te
  text: నిషిద్ధ జన్మస్థితి గల వ్యక్తి[a] యహ్వే సమాజంలో ప్రవేశించకూడదు. పదవ తరం వరకు కూడా అతని వంశస్థులలో ఎవరూ యహ్వే సమాజంలో ప్రవేశించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘నిషిద్ధ జన్మస్థితి గల వ్యక్తి’: హెబ్రీ పదం מַמְזֵר (మమ్జేర్) యొక్క ఖచ్చితమైన అర్థపరిధి వివాదాస్పదం. సంప్రదాయ అనువాదం ‘అక్రమ సంతానం’; అయితే ఇది జన్మస్థితి కారణంగా యహ్వే సమాజంలో ప్రవేశానికి అనర్హుడిగా పరిగణించబడిన వ్యక్తిని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: నిషిద్ధ సంబంధంలో పుట్టిన వ్యక్తి
  rationale: ఈ హెబ్రీ పదం సాధారణంగా ధర్మశాస్త్రం నిషేధించిన సంబంధం వల్ల పుట్టిన వ్యక్తిని లేదా జన్మస్థితి కారణంగా సమాజంలో ప్రవేశానికి అనర్హుడిగా పరిగణించబడిన వ్యక్తిని సూచిస్తుంది. అవమానకరమైన తెలుగు పదాన్ని వాడకుండా, మూలంలోని న్యాయపరమైన భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: יָבֹא
  choice: చేరకూడదు
  rationale: క్రియకు అక్షరార్థంగా ‘రావడం/ప్రవేశించడం’ అనే భావం ఉంది. ఈ న్యాయపరమైన నిషేధ సందర్భంలో ‘చేరకూడదు’ సమాజంలో ప్రవేశం లేదా సభ్యత్వానికి అనుమతి లేదనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קְהַל יְהוָה
  choice: యహ్వే సమాజం
  rationale: קהל అనేది కూడిన ఒడంబడిక సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ అనే పదం ఆధునిక తెలుగులో కేవలం ఒక సమావేశాన్ని కాక, ఆ సముదాయాన్ని కూడా సూచించగలదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సమీప లిప్యంతరీకరణగా ‘యహ్వే’ అని ఇచ్చాం.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: పదో తరం వరకూ
  rationale: నిషేధం పదో తరం దాకా విస్తరిస్తుందని తెలిపే హెబ్రీ న్యాయసూత్రపు కాల/తరాల భావాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: לֹא יָבֹא לוֹ
  choice: అతని సంతానంలో ఎవరూ ... చేరకూడదు
  rationale: తరాన్ని ప్రస్తావించిన సందర్భంలో לוֹ ఆ వ్యక్తికి చెందిన వంశపరంపరను సూచిస్తుంది. తెలుగులో అంతర్లీన భావం స్పష్టంగా ఉండేందుకు ‘అతని సంతానంలో ఎవరూ’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ప్రత్యేక దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, Yahweh‌కు సమీపమైన తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: ‘యహ్వే సమాజంలో చేరడం’ యొక్క పరిధి
  choice: మూలంలోని సామాజిక-ఒడంబడిక పదబంధాన్ని యథాతథంగా ఉంచడం
  alternative: ఆరాధనకు హాజరుకాకూడదు అని పరిమితం చేయడం
  rationale: קהל יהוה యొక్క ఖచ్చితమైన సంస్థాగత పరిధిని ఈ వచనం వివరించదు. కేవలం ఆరాధనా సమావేశానికి హాజరు కావడమే ఉద్దేశమని అనువాదంలో నిర్ణయించకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గంభీరతతో అనువదించాం. వ్యక్తిని అవమానించే పదజాలాన్ని నివారించాం. ‘చేరకూడదు’ నిషేధ స్వరాన్ని సహజంగా తెలియజేస్తుంది; ‘యహ్వే సమాజం’ మూలంలోని ఒడంబడిక సముదాయ భావాన్ని అనవసరంగా సంకుచితం చేయదు.
