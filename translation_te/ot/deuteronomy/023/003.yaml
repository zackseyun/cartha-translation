- from: నిషిద్ధ సంబంధంలో పుట్టిన వ్యక్తి[a] యహ్వే సమాజంలో చేరకూడదు. పదో తరం వరకూ అతని సంతానంలో ఎవరూ యహ్వే సమాజంలో చేరకూడదు.
  to: నిషిద్ధ జన్మస్థితి గల వ్యక్తి[a] యహ్వే సమాజంలో ప్రవేశించకూడదు. పదవ తరం వరకు కూడా అతని వంశస్థులలో ఎవరూ యహ్వే సమాజంలో ప్రవేశించకూడదు.
  rationale: The revision removes an interpretive narrowing of the disputed term מַמְזֵר, preserves its legal-category character in non-pejorative Telugu, and changes “చేరకూడదు” to “ప్రవేశించకూడదు” for closer correspondence to the repeated Hebrew legal formula. The second sentence retains the source’s generational extension without implying a more specific institutional setting.
