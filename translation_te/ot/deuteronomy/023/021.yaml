  text: לַ/נָּכְרִ֣י תַשִּׁ֔יךְ וּ/לְ/אָחִ֖י/ךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְ/ךָ֜ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹל֙ מִשְׁלַ֣ח יָדֶ֔/ךָ עַל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: te
  text: విదేశీయునికి వడ్డీకి అప్పు ఇవ్వవచ్చు[a]; కానీ నీ సహోదరునికి వడ్డీకి అప్పు ఇవ్వకూడదు[b], తద్వారా నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశంలో నీవు చేపట్టే ప్రతి పనిలో నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదించేలా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో అనువాదం: ‘విదేశీయుని దగ్గర వడ్డీ వసూలు చేయవచ్చు.’ హీబ్రూ క్రియకు వడ్డీకి అప్పు ఇవ్వడం లేదా వడ్డీ విధించడం అనే భావం ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సహోదరుడు’ అంటే తోటి ఇశ్రాయేలీయుడు; హీబ్రూ మూలపాఠం కుటుంబ సంబంధ పదాన్నే ఉపయోగిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: విదేశీయునికి
  rationale: נָכְרִי ఇశ్రాయేలు సమాజానికి చెందని విదేశీయుణ్ణి లేదా బయటి వ్యక్తిని సూచిస్తుంది. ‘విదేశీయుడు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉండి, ‘సహోదరుడు’ అనే పదంతో ఉన్న సామాజిక-న్యాయపరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: వడ్డీకి అప్పు ఇవ్వవచ్చు / వడ్డీకి అప్పు ఇవ్వకూడదు
  rationale: נשׁך హిఫీల్ రూపం ఈ రుణనియమ సందర్భంలో వడ్డీ విధిస్తూ అప్పు ఇవ్వడాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘వడ్డీకి అప్పు ఇవ్వడం’ స్పష్టంగా ఉంటుంది; అనుమతి-నిషేధ వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరునికి
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘నీ సహోదరుడు.’ కుటుంబ సంబంధ రూపకాన్ని నిలుపుతూ, ఈ నిబంధన సందర్భంలో అది తోటి ఇశ్రాయేలీయుణ్ణి సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ఈ సందర్భంలో לְמַעַן ఉద్దేశం లేదా దాని ఫలితాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అప్పుడు’ విధేయతకు అనుసంధానమైన ఆశీర్వాద ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా నిన్ను ఆశీర్వదిస్తాడు
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా లిప్యంతరీకరించాం. ఉద్దేశ/ఫలిత సందర్భంలోని క్రియను తెలుగులో సహజమైన భవిష్యత్ రూపంతో వ్యక్తం చేశాం.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: నీవు చేపట్టే ప్రతి పనిలో
  rationale: అక్షరార్థంగా ‘నీ చెయ్యి పంపే ప్రతి దానిలో’ అనే హీబ్రూ నుడికారం వ్యక్తి చేసే పనులు, ప్రయత్నాలు, కార్యాలను సూచిస్తుంది. ‘నీవు చేపట్టే ప్రతి పని’ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: దేశంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, ఈ సందర్భంలో స్థలార్థకమైన సహజ తెలుగు ‘దేశంలో.’ הָאָרֶץ ఇక్కడ ఇశ్రాయేలు స్వాధీనం చేసుకోబోయే దేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: నీవు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న
  rationale: ఈ ఉపవాక్యం దేశంలోకి సమీప ప్రవేశాన్ని, దాన్ని స్వాధీనం చేసుకోవడం అనే ఉద్దేశాన్ని తెలియజేస్తుంది. ‘ప్రవేశిస్తున్న’ మరియు ‘స్వాధీనం చేసుకోవడానికి’ రెండింటినీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే నిబంధన నామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది. దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: వడ్డీ నిషేధం వర్తించే ‘సహోదరుడు’
  choice: కుటుంబ పదాన్ని ప్రధాన పాఠంలో నిలుపుతూ, తోటి ఇశ్రాయేలీయుడు అనే సందర్భార్థాన్ని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠంలోనే ‘తోటి ఇశ్రాయేలీయుడు’ అని విప్పి చెప్పడం
  rationale: אָחִיךָ అనే మూలపదంలోని కుటుంబ-నిబంధన భాషను నిలుపడం అవసరం; అదే సమయంలో ఆధునిక పాఠకుడు దాన్ని కేవలం సొంత అన్నదమ్మునిగా అపార్థం చేసుకోకుండా పాదసూచిక స్పష్టత ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకునికి స్పష్టంగా ఉండే వాక్యనిర్మాణం. ‘సహోదరుడు’ అనే మూల రూపకాన్ని నిలిపి, దాని సామాజిక అర్థాన్ని పాదసూచికలో ఇచ్చాం. హీబ్రూ చేతి-పని నుడికారాన్ని పదశః కాకుండా సహజంగా ‘చేపట్టే ప్రతి పని’గా అందించాం.
