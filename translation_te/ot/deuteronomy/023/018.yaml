review_pass:
  verdict: revise
  source_fidelity: The paired Hebrew nouns קְדֵשָׁה and קָדֵשׁ are feminine and masculine counterparts in a legal prohibition, with the Israelite daughters/sons parallel retained. The draft correctly expresses the prohibition and the communal scope. However, the Telugu masculine term వ్యభిచారి normally denotes an adulterer or sexually immoral man rather than specifically a male prostitute, weakening the lexical parallel. The phrase ఆరాధనాచార is also not idiomatic modern Telugu.
  naturalness: ఇశ్రాయేలు కుమార్తెలలో/కుమారులలో and ఎవ్వరూ ... ఉండకూడదు are clear and natural in contemporary formal Telugu. Replacing the awkward compound ఆరాధనాచార with ఆరాధనా-సంబంధ and using the gendered pair వేశ్య/వేశ్యుడు produces a clearer, parallel rendering.
  terminology: Use ఆరాధనా-సంబంధ వేశ్య and ఆరాధనా-సంబంధ వేశ్యుడు. This conveys the cultic element without over-specifying a temple location in the main text. The footnote preserves “temple prostitute” as an alternative and explains the literal ‘consecrated woman/man’ wording without making an unsupported claim about a particular institution.
  issues:
  - severity: medium
    issue: ఆరాధనాచార వ్యభిచారి does not clearly mean a male cult prostitute.
    rationale: వ్యభిచారి commonly means an adulterer or sexually immoral man. The Hebrew קָדֵשׁ is deliberately parallel to the feminine noun and should be rendered with an equally specific male term.
  - severity: low
    issue: ఆరాధనాచార is an awkward, nonstandard compound in modern Telugu.
    rationale: ఆరాధనా-సంబంధ is more idiomatic and communicates the intended cultic association clearly.
  revised_text: ఇశ్రాయేలు కుమార్తెలలో ఎవ్వరూ ఆరాధనా-సంబంధ వేశ్యగా ఉండకూడదు[a]; ఇశ్రాయేలు కుమారులలో ఎవ్వరూ ఆరాధనా-సంబంధ వేశ్యుడిగా ఉండకూడదు.
