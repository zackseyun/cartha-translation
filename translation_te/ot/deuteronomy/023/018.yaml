id: DEU.23.18
reference: Deuteronomy 23:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: te
  text: ఇశ్రాయేలు కుమార్తెలలో ఎవ్వరూ ఆరాధనా-సంబంధ వేశ్యగా ఉండకూడదు[a]; ఇశ్రాయేలు కుమారులలో ఎవ్వరూ ఆరాధనా-సంబంధ వేశ్యుడిగా ఉండకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవాలయ వేశ్య.” ఇక్కడి హీబ్రూ స్త్రీలింగ, పుంలింగ పదాలకు అక్షరార్థంగా “ప్రతిష్ఠించబడిన స్త్రీ/పురుషుడు” అనే భావం ఉంది. సందర్భానుసారం అవి ఆరాధనతో ముడిపడిన లైంగిక ఆచారానికి సంబంధించిన వ్యక్తులను సూచిస్తాయి; “దేవాలయ” అనే పదం ఒక సాధ్యమైన, కానీ మరింత నిర్దిష్టమైన, అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: ఆరాధనాచార వ్యభిచారిణి
  rationale: స్త్రీలింగ నామవాచకం అన్యదేవతారాధనకు సంబంధించిన అక్రమ లైంగిక ఆచారంలో పాల్గొనే స్త్రీని సూచిస్తుంది. ‘ఆరాధనాచార’ అనే విశేషణం మతాచార సంబంధాన్ని నిలుపుతుంది; ‘వ్యభిచారిణి’ లింగాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: קָדֵשׁ
  choice: ఆరాధనాచార వ్యభిచారి
  rationale: ఇది קְדֵשָׁהకు పుంలింగ సమాంతర పదం. అదే పదబంధాన్ని పుంలింగ రూపంలో వాడడం మూలంలోని సమాంతర నిర్మాణాన్ని, ఆచార సంబంధమైన భావాన్ని కాపాడుతుంది.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: ఎవ్వరూ ... ఉండకూడదు
  rationale: ఈ న్యాయవాక్య నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది. హీబ్రూ క్రియల స్త్రీలింగ–పుంలింగ భేదం తరువాతి నామవాచకాలలో నిలుస్తుంది.
- source_word: מִבְּנוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమార్తెలలో
  rationale: హీబ్రూ జాతీయ-కుటుంబ వ్యక్తీకరణను, స్త్రీలింగ నిర్దిష్టతను నిలుపుతూ, ఈ సందర్భంలో מִן సూచించే సమూహాంతర్గత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలో
  rationale: మొదటి భాగంతో కుమార్తెలు/కుమారులు అనే ఉద్దేశపూర్వక సమాంతరతను నిలుపుతూ, పురుషులను నిర్దిష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: קדש/קדשה పదాల భావం
  choice: అన్యదేవతారాధనతో ముడిపడిన ఆచార సంబంధ లైంగిక వ్యభిచారంలో పాల్గొనే పురుషుడు/స్త్రీ
  alternative: సాధారణంగా లైంగిక దుర్నీతిపరులు; లేదా తటస్థ అర్థంలో ప్రతిష్ఠించబడిన వ్యక్తులు
  rationale: ఈ సందర్భంలో ఇవి సాంకేతిక పదాలు; సాధారణ లైంగిక పాపాన్ని మాత్రమే సూచించవు, సానుకూలమైన ప్రతిష్ఠను కూడా సూచించవు. అయితే ఖచ్చితమైన సంస్థాగత స్థలాన్ని మూలం చెప్పనందున ‘దేవాలయ’ అని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గంభీరతతో అనువదించబడింది. ‘ఆరాధనాచార’ అనే పదం మతాచార సంబంధాన్ని తెలుపుతుంది; ‘దేవాలయ’ అని ప్రధాన పాఠ్యంలో పెట్టకుండా మూలంలోని స్థల సంబంధ అనిశ్చితిని కాపాడింది. కుమార్తెలు/కుమారులు అనే సమాంతర నిర్మాణం నిలుపబడింది.
