revisions:
- from: ఇశ్రాయేలు కుమార్తెలలో ఎవ్వరూ ఆరాధనాచార వ్యభిచారిణిగా ఉండకూడదు[a]; ఇశ్రాయేలు కుమారులలో ఎవ్వరూ ఆరాధనాచార వ్యభిచారిగా ఉండకూడదు.
  to: ఇశ్రాయేలు కుమార్తెలలో ఎవ్వరూ ఆరాధనా-సంబంధ వేశ్యగా ఉండకూడదు[a]; ఇశ్రాయేలు కుమారులలో ఎవ్వరూ ఆరాధనా-సంబంధ వేశ్యుడిగా ఉండకూడదు.
  rationale: The revision retains the legal force, daughters/sons symmetry, and cultic dimension of the Hebrew, while correcting an idiomatically awkward compound and making the masculine noun as specific as its feminine counterpart. The footnote maintains the literal lexical background and avoids asserting a more precise institutional setting than the wording itself requires.
