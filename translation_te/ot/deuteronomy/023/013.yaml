source:
  edition: WLC
  text: וְ/יָד֙ תִּהְיֶ֣ה לְ/ךָ֔ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/יָצָ֥אתָ שָׁ֖מָּ/ה חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: te
  text: నీకు శిబిరం వెలుపల ఒక స్థలం[a] ఉండాలి; నీవు అక్కడికి బయటకు వెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘చేయి’ (యాద్‌); ఇక్కడ ఇది నియమించబడిన స్థలం లేదా చోటు అనే నుడికారార్థంలో వాడబడి ఉండవచ్చు. తరువాతి వచనాన్ని దృష్టిలో ఉంచుకొని కొందరు దీనిని మరింత నిర్దిష్టంగా ‘పరికరం’ లేదా ‘మేకు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: స్థలం
  rationale: సాధారణ అర్థం ‘చెయ్యి’ అయినప్పటికీ, ఇక్కడ శిబిరం వెలుపల నియమించబడిన చోటును సూచించే నుడికార ప్రయోగంగా గ్రహించడం సందర్భానికి, తరువాతి క్రియకు సరిపోతుంది.
- source_word: תִּהְיֶה לְךָ
  choice: ఉంచుకోవాలి
  rationale: היה + לְ నిర్మాణం కలిగి ఉండడం లేదా కేటాయించబడిన ఏర్పాటు ఉండడాన్ని సూచిస్తుంది; ఆజ్ఞాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇది వ్యక్తం చేస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: శిబిరపు సరిహద్దుకు బయట ఉన్న స్థానాన్ని నేరుగా సూచిస్తుంది.
- source_word: וְיָצָאתָ
  choice: వెళ్లాలి
  rationale: יצא యొక్క ‘బయటికి వెళ్లడం’ అనే చలనార్థం సందర్భంలో స్పష్టంగా ఉండేలా సహజ తెలుగు రూపం వాడబడింది.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: ముందు పేర్కొన్న నియమిత స్థలానికే దిశను సూచిస్తుంది.
- source_word: חוּץ
  choice: బయటికి
  rationale: మూలంలోని చివరి חוּץ శిబిరం వెలుపలకు వెళ్లడాన్ని మళ్లీ నొక్కిచెబుతుంది; తెలుగులో కొంత పునరుక్తి ఉన్నా ఆ ఉద్ఘాటన నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘వెలుపల/బయటికి’ పునరుక్తిని ఉద్ఘాటన కోసం నిలిపాం.
