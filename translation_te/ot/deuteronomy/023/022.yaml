  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: te
  text: అయితే నీవు నీ దేవుడైన యాహ్వేకు మొక్కుబడి చేసుకుంటే, దాన్ని చెల్లించడంలో ఆలస్యం చేయకూడదు. ఎందుకంటే నీ దేవుడైన యాహ్వే దాన్ని నీ నుండి తప్పకుండా కోరుతాడు; అప్పుడు నీకు పాపం అవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ యందు పాపం ఉంటుంది”; లేదా, “నీవు పాపదోషివి అవుతావు.”
    reason: హీబ్రూ וְהָיָה בְךָ חֵטְא అనే సంక్షిప్త ప్రయోగం అక్షరార్థంగా ‘నీ యందు పాపం ఉంటుంది’ అని చెబుతుంది; సందర్భంలో అది పాపదోషం కలగడాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: כִּי
  choice: అయితే … చేసుకుంటే
  rationale: మునుపటి వచనంతో స్వల్ప వ్యత్యాసాన్ని చూపుతూ షరతును పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ఈ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: תִדֹּר נֶדֶר
  choice: మొక్కుబడి చేసుకుంటే
  rationale: ఒకే మూలానికి చెందిన క్రియ-నామ పునరుక్తిని తెలుగులో సహజమైన మొక్కుబడి అనే పదంతో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వేకు
  rationale: లక్ష్యాన్ని సూచించే לְ భావాన్ని -కు ద్వారా చూపిస్తూ, יהוה అనే దైవనామాన్ని యాహ్వే అని ప్రత్యక్షంగా లిప్యంతరీకరించింది.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: దాన్ని చెల్లించడంలో ఆలస్యం చేయకూడదు
  rationale: న్యాయపరమైన నిషేధాన్ని సహజ తెలుగులో తెలియజేస్తూ, మొక్కుబడిని నెరవేర్చడం లేదా సమర్పించడంలో ఉన్న బద్ధతను చెల్లించడం అనే పదంతో నిలుపుతుంది.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: దాన్ని … తప్పకుండా కోరుతాడు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో బలపరచబడిన క్రియ యొక్క నిశ్చయార్థాన్ని తప్పకుండా అనే పదం వ్యక్తం చేస్తుంది.
- source_word: מֵעִמָּךְ
  choice: నీ నుండి
  rationale: మొక్కుబడిని చేసిన వ్యక్తి నుండే దాని నెరవేర్పు కోరబడుతుందనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: అలా ఆలస్యం చేయడం నీకు పాపం అవుతుంది
  rationale: హీబ్రూ సంక్షిప్త వాక్యంలోని పాపబాధ్యతను సహజ తెలుగులో తెలుపుతుంది; בְךָ యొక్క మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన యాహ్వే అని లిప్యంతరీకరించింది.
- issue: చివరి వాక్యంలో పాపం ఎవరికి లేదా దేనికి ఆపాదించబడుతుంది
  choice: ఆలస్యం చేయడం నీకు పాపం అవుతుంది
  alternative: నీలో పాపం ఉంటుంది; నీవు పాపదోషివి అవుతావు
  rationale: సందర్భం ఆలస్యాన్ని పాపంగా గుర్తిస్తుంది; అయితే హీబ్రూ వాక్య నిర్మాణంలోని సంక్షిప్తత, సాధ్యమైన పాపదోష భావం పాదసూచికలో సంరక్షించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయోపదేశ శైలి. ఏకవచన ద్వితీయ పురుషాన్ని నిలిపి, దైవనామాన్ని యాహ్వే అని ప్రత్యక్షంగా ఇచ్చింది. పాదసూచిక గుర్తు [a] సంబంధిత చివరి వాక్యానికే జతచేయబడింది.
