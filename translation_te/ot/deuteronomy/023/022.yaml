  source_fidelity: 'ప్రధాన భావం మూలానికి నమ్మకంగా ఉంది: మొక్కుబడి చేసినప్పుడు దానిని ఆలస్యం లేకుండా నెరవేర్చాలి; యాహ్వే దానిని తప్పక కోరుతాడు; నెరవేర్చక ఆలస్యం చేయడం పాపదోషానికి దారితీస్తుంది. అయితే చివరి హీబ్రూ వాక్యం వాస్తవానికి కేవలం ‘నీకు/నీయందు పాపం ఉంటుంది’ అని చెబుతుంది. ‘అలా ఆలస్యం చేయడం’ అనే పదాలు సందర్భానికి సరిపోతున్నప్పటికీ, వాక్యంలో లేని కర్తను స్పష్టంగా చేర్చి మూలంలోని సంక్షిప్తతను తగ్గిస్తున్నాయి.'
