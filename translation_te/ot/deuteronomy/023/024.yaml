  text: מוֹצָ֥א שְׂפָתֶ֖י/ךָ תִּשְׁמֹ֣ר וְ/עָשִׂ֑יתָ כַּ/אֲשֶׁ֨ר נָדַ֜רְתָּ לַ/יהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נְדָבָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ בְּ/פִֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: te
  text: నీవు నీ నోటితో పలికి, నీ దేవుడైన యాహ్వేకు స్వచ్ఛంద అర్పణగా[b] మొక్కుకున్నదాని ప్రకారం, నీ పెదవుల నుండి వెలువడినదాన్ని జాగ్రత్తగా పాటించి నెరవేర్చాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: ‘నీ పెదవుల నుండి వెలువడినదాన్ని కాపాడి, నెరవేర్చాలి.’'
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇష్టపూర్వక అర్పణగా.’ ఈ హీబ్రూ పదం బలవంతం వల్ల కాక స్వచ్ఛందంగా ఇచ్చే అర్పణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: నీ పెదవుల నుంచి వెలువడిన మాట
  rationale: מוֹצָא యొక్క ‘బయటికి వచ్చేది’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, ఇక్కడ అది పలికిన మొక్కుబడి మాటను సూచిస్తుందని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: జాగ్రత్తగా నిలబెట్టి, దాని ప్రకారం చేయాలి
  rationale: שׁמר లోని జాగ్రత్తగా పాటించడం అనే భావాన్నీ, עשה లోని ఆ మాటను కార్యరూపంలో నెరవేర్చడం అనే భావాన్నీ విడివిడిగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: మొక్కుకున్నదాన్ని
  rationale: נדר అనేది దేవునికి గంభీరంగా చేసిన మొక్కుబడిని సూచిస్తుంది; ‘మొక్కుకున్నది’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వేకు
  rationale: వ్యక్తినామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, אֱלֹהֶיךָను సహజమైన తెలుగు సంబంధ నిర్మాణంలో అందిస్తుంది.
- source_word: נְדָבָה
  choice: స్వచ్ఛంద అర్పణగా
  rationale: నిర్బంధంతో కాక స్వచ్ఛందంగా సమర్పించేదనే నְדָבָה భావాన్ని కాపాడుతుంది; సందర్భంలోని అర్పణ భావాన్ని కూడా స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: నీవు నీ నోటితో
  rationale: మొక్కుబడి నోటితో పలికినదనే మూలపాఠంలోని ఉద్దేశపూర్వక పునరుక్తిని సున్నితంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది.
- issue: נְדָבָה మరియు మొక్కుబడి మధ్య కనిపించే ఉద్రిక్తత
  choice: స్వచ్ఛంద అర్పణగా మొక్కుకున్నది
  alternative: కేవలం ‘మొక్కుబడి’ లేదా ‘అర్పణ’గా సవరించడం
  rationale: స్వచ్ఛందంగా చేసిన అర్పణాత్మక మొక్కుబడి, పలికిన తరువాత బద్ధమైనదవుతుందనే మూలపాఠంలోని భావోద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పెదవుల నుంచి వెలువడిన మాట’ మరియు ‘నీ నోటితో’ అనే మూలపాఠపు శరీరాంగ రూపకాన్నీ పునరుక్తినీ నిలిపి, వాక్యాన్ని తెలుగు పఠనానికి అనుకూలంగా రెండు భాగాలుగా అమర్చాం.
