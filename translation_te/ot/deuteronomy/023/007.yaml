source:
  edition: WLC
  text: לֹא תִדְרֹ֥שׁ שְׁלֹמָ֖/ם וְ/טֹבָתָ֑/ם כָּל יָמֶ֖י/ךָ לְ/עוֹלָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: te
  text: ఎప్పటికీ నీ జీవితకాలమంతటా వారి క్షేమాన్ని గానీ వారి మేలును గానీ కోరవద్దు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి శాంతిని గానీ వారి శ్రేయస్సును గానీ.” హీబ్రూ పదాలు కేవలం రాజకీయ శాంతి లేదా ఆర్థిక సమృద్ధికంటే విస్తృతంగా క్షేమం, సౌఖ్యం, మేలు అనే భావాలను కలిగివున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: కోరవద్దు
  rationale: דרש అంటే ‘వెదకు, కోరుకొను, విచారించు’ అనే అర్థాలు వస్తాయి. క్షేమం, మేలు అనే భావవాచక కర్మలతో ‘కోరడం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שְׁלֹמָם
  choice: వారి క్షేమం
  rationale: שָׁלוֹם శాంతి మాత్రమే కాక క్షేమం, సౌఖ్యం, సమగ్ర మేలు అనే విస్తృత భావాన్ని కలిగివుంది. ఈ సందర్భంలో ‘క్షేమం’ ఆ విస్తృతిని సహజంగా తెలియజేస్తుంది.
- source_word: טֹבָתָם
  choice: వారి మేలు
  rationale: טוֹבָה ఇక్కడ వారికి కలిగే మంచి, ప్రయోజనం లేదా అభివృద్ధిని సూచిస్తుంది. ‘మేలు’ మూలపద విస్తృతిని కాపాడుతూ ‘క్షేమం’తో ఉన్న జోడీని వేరుగా ఉంచుతుంది.
- source_word: כָּל יָמֶיךָ
  choice: నీ జీవితకాలమంతా
  rationale: అక్షరార్థంగా ‘నీ దినాలన్నిటిలో’ అయినా, ఆధునిక తెలుగులో ‘నీ జీవితకాలమంతా’ సహజంగా ఉండి ఏకవచన సంబోధనను, మొత్తం జీవనకాల భావాన్ని నిలుపుతుంది.
- source_word: לְעוֹלָם
  choice: ఎన్నటికీ
  rationale: עוֹלָם ఇక్కడ నిషేధం నిరంతరంగా వర్తిస్తుందని బలపరుస్తుంది. ‘ఎన్నటికీ’ ఆధునిక తెలుగులో ఆ దీర్ఘకాలిక బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నీ దినాలన్నిటిలో’ మరియు ‘ఎప్పటికీ’ అనే కాలవ్యక్తీకరణల మధ్య కనిపించే పునరుక్తి
  choice: ‘నీ జీవితకాలమంతా ఎన్నటికీ’ అని రెండు భావాలనూ నిలుపడం
  alternative: ‘నీవు జీవించినంతకాలం’ అని ఒకే వ్యక్తీకరణగా కుదించడం
  rationale: హీబ్రూ మూలం כָּל יָמֶיךָ మరియు לְעוֹלָם అనే రెండు కాలవ్యక్తీకరణలను ఉద్దేశపూర్వకంగా వరుసగా ఉంచి నిషేధాన్ని బలపరుస్తుంది. కొంత పునరుక్తిగా అనిపించినా దానిని తొలగించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఏకవచన సంబోధనను ‘నీ’ ద్వారా, జోడీ నిర్మాణాన్ని ‘గాని…గాని’ ద్వారా నిలిపాం; కాలవ్యక్తీకరణల ఉద్దేశపూర్వక బలాన్ని సవరించలేదు.
