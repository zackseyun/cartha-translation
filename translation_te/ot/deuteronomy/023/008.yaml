id: DEU.23.8
reference: Deuteronomy 23:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: te
  text: ఎదోమీయుణ్ణి అసహ్యించుకోకూడదు[a]; ఎందుకంటే అతడు నీ సహోదరుడు[b]. ఐగుప్తీయుణ్ణి అసహ్యించుకోకూడదు; ఎందుకంటే నీవు అతని దేశంలో పరదేశిగా నివసించావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏవగించుకోకూడదు,” “హేయంగా చూడకూడదు.”
    reason: lexical_alternative
  - marker: b
    text: “నీ సహోదరుడు” అనే మాట ఏశావు ద్వారా ఇశ్రాయేలుకు ఎదోముతో ఉన్న బంధుత్వాన్ని సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: “పరదేశి” అంటే తన స్వదేశానికి వెలుపల ఇతరుల మధ్య నివసించే వ్యక్తి.
    reason: lexical_clarification
lexical_decisions:
- source_word: תְתַעֵב
  choice: అసహ్యించుకోకూడదు
  rationale: పీయేల్ రూపంలోని బలమైన విరక్తి, అసహ్యభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. రెండు సమాంతర నిషేధాల్లోనూ అదే పదబంధాన్ని పునరావృతం చేశాం.
- source_word: אֲדֹמִי
  choice: ఎదోమీయుణ్ణి
  rationale: ఎదోము ప్రజలలో ఒక వ్యక్తిని సూచించే హీబ్రూ ఏకవచన జాతివాచక రూపాన్ని నిలుపుతుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: మూలంలోని కుటుంబ బంధాన్ని నేరుగా నిలుపుతూ, ఎదోముతో ఇశ్రాయేలుకు ఉన్న బంధుత్వాన్ని వ్యాఖ్యానంతో కుదించదు.
- source_word: מִצְרִי
  choice: ఐగుప్తీయుణ్ణి
  rationale: ఐగుప్తు ప్రజలలో ఒక వ్యక్తిని సూచించే ప్రాతినిధ్య ఏకవచనాన్ని నిలుపుతుంది.
- source_word: גֵר
  choice: పరదేశిగా నివసించావు
  rationale: స్వదేశం లేదా స్వజన సమూహం వెలుపల ఇతరుల మధ్య నివసించే వ్యక్తి అనే సామాజిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం ప్రయాణికుడు అనే అర్థానికి పరిమితం చేయదు.
- source_word: בְאַרְצוֹ
  choice: అతని దేశంలో
  rationale: ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, ఐగుప్తీయుడు తన జాతి లేదా దేశానికి ప్రాతినిధ్యం వహిస్తున్న మూల నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెండు ఆజ్ఞలకు ఇవ్వబడిన కారణాన్ని స్పష్టమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
theological_decisions:
- issue: జాతీయ సమూహాలను సూచించే ప్రాతినిధ్య ఏకవచనం
  choice: “ఎదోమీయుణ్ణి,” “ఐగుప్తీయుణ్ణి,” “అతడు,” “అతని దేశం” అనే ఏకవచన రూపాలను నిలుపడం
  alternative: తెలుగు శైలికోసం “ఎదోమీయులను,” “ఐగుప్తీయులను,” “వారి దేశం” అని బహువచనం చేయడం
  rationale: హీబ్రూ ధర్మశాస్త్ర శైలిలో ఒక్కో జాతి సభ్యుడు మొత్తం సమూహానికి ప్రాతినిధ్యం వహించేలా ఏకవచనం వాడబడింది. దాన్ని నిలుపడం ఆజ్ఞ యొక్క వ్యక్తిగత బలాన్ని, మూల నిర్మాణాన్ని కాపాడుతుంది.
- issue: ఎదోముతో బంధుత్వ భాష
  choice: “నీ సహోదరుడు” అని నేరుగా అనువదించడం
  alternative: “నీ బంధువు” అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: వచనం ఇశ్రాయేలు–ఎదోము సంబంధాన్ని కుటుంబ బంధంగా వ్యక్తం చేస్తుంది. “సహోదరుడు” ఆ చారిత్రక-దైవశాస్త్రీయ ఉద్రిక్తతను వ్యాఖ్యానంతో సడలించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని పాటించాం. “అసహ్యించుకోకూడదు” బలమైన నిషేధాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని రెండు సమాంతర వాక్యాలు, ప్రాతినిధ్య ఏకవచనాలు, కుటుంబ బంధ భాష నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
