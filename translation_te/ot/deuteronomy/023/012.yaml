id: DEU.23.12
reference: Deuteronomy 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֥ה לִ/פְנֽוֹת עֶ֖רֶב יִרְחַ֣ץ בַּ/מָּ֑יִם וּ/כְ/בֹ֣א הַ/שֶּׁ֔מֶשׁ יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: te
  text: సాయంకాలం సమీపించినప్పుడు అతడు నీటితో స్నానం చేయాలి; సూర్యుడు అస్తమించినప్పుడు శిబిరం మధ్యలోకి రావచ్చు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: అప్పుడు
  rationale: వావ్ + היה ఇక్కడ ఉనికిని సూచించకుండా, ముందున్న న్యాయనియమాన్ని కొనసాగిస్తూ తదుపరి చర్యను పరిచయం చేస్తుంది.
- source_word: לִפְנוֹת עֶרֶב
  choice: సాయంకాలం సమీపించినప్పుడు
  rationale: פנה + ערב పగలు సాయంకాలం వైపు తిరుగుతున్న కాలాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కాలసూచనను సహజంగా అందిస్తుంది.
- source_word: יִרְחַץ בַּמָּיִם
  choice: అతడు నీళ్లతో స్నానం చేయాలి
  rationale: ఈ శుద్ధి సందర్భంలో רחץ శరీరాన్ని కడుక్కోవడాన్ని సూచిస్తుంది; ‘స్నానం చేయాలి’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించినప్పుడు
  rationale: అక్షరార్థంగా ‘సూర్యుడు లోపలికి వచ్చినప్పుడు’ అనే హీబ్రూ నుడికారం సూర్యాస్తమయాన్ని సూచిస్తుంది; తెలుగులో దాని భావాన్ని నేరుగా అనువదించాం.
- source_word: יָבֹא
  choice: తిరిగి రావచ్చు
  rationale: న్యాయసందర్భంలో ఈ అసంపూర్ణ క్రియ శుద్ధి, సూర్యాస్తమయం తరువాత పునఃప్రవేశానికి అనుమతిని సూచిస్తుంది; సందర్భం వల్ల ‘తిరిగి’ భావం స్పష్టమవుతుంది.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: శిబిరం మధ్యలోకి
  rationale: תוך కేవలం శిబిరంలోకి ప్రవేశించడం కాక దాని అంతర్భాగంలోకి రావడాన్ని ప్రత్యేకంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవిధికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని సూర్యాస్తమయ నుడికారాన్ని భావానువాదం చేసినందున వివరణాత్మక పాదటిప్పణి అవసరం లేదు.
