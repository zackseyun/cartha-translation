id: DEU.23.4
reference: Deuteronomy 23:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: te
  text: అమ్మోనీయుడుగాని మోయాబీయుడుగాని యెహోవా సమాజంలో చేరకూడదు[a]. పదో తరం వరకైనా[b], వారిలో ఎవ్వరూ యెహోవా సమాజంలో ఎన్నటికీ చేరకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెహోవా సభలో.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యంలో ‘పదో తరం వరకు’ అనే మాటతోపాటు ‘ఎన్నటికీ’ అనే మాట కూడా ఉంది. ఒకదాన్ని మరొకదానిలో కలిపివేయకుండా, దీర్ఘకాలిక నిషేధాన్ని బలంగా చెప్పే రెండు వ్యక్తీకరణలనూ ఇక్కడ నిలిపాం.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: చేరకూడదు
  rationale: న్యాయసంబంధ సందర్భంలో לֹא తో కూడిన అసంపూర్ణ క్రియ నిషేధాన్ని లేదా ప్రవేశానికి అనర్హతను సూచిస్తుంది. ‘చేరకూడదు’ అనేది కేవలం ఒక ప్రదేశంలోకి రావడాన్ని కాక, అధికారిక సమాజంలో ప్రవేశం పొందడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַמּוֹנִי
  choice: అమ్మోనీయుడు
  rationale: ఈ జాతివాచక పదానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: מוֹאָבִי
  choice: మోయాబీయుడు
  rationale: ఈ జాతివాచక పదానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: קָהָל
  choice: సమాజం
  rationale: ఇక్కడ ఈ పదం నిబంధనకు చెందిన ప్రజల అధికారిక సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, ‘సభ’ అనే ప్రత్యామ్నాయంలోని సమావేశం లేదా పాలకమండలి భావాన్ని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: పదో తరం వరకైనా
  rationale: גַּם యొక్క బలప్రయోగాన్ని ‘అయినా’ ద్వారా చూపిస్తూ, పదో తరం వరకు వ్యాపించే నిషేధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָהֶם
  choice: వారిలో ఎవ్వరూ
  rationale: హీబ్రూ సర్వనామం సూచించే అమ్మోనీయులు, మోయాబీయులకు చెందిన వారిని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; వారసులకే పరిమితం చేసే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: עַד עוֹלָם
  choice: ఎన్నటికీ
  rationale: దీర్ఘకాలికమైన, అంతంలేని నిషేధ భావాన్ని ప్రస్తుత తెలుగులో స్పష్టంగా తెలియజేస్తుంది. పదో తరం అనే వాక్యభాగాన్ని దీనిలో కలిపివేయకుండా రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: ‘పదో తరం వరకు’ మరియు ‘ఎన్నటికీ’ మధ్య సంబంధం
  choice: రెండు కాలవ్యక్తీకరణలనూ ప్రధాన పాఠ్యంలో యథాతథంగా నిలుపడం
  alternative: ‘పదో తరం’ను కేవలం ‘ఎప్పటికీ కాదు’ అనే నుడికారంగా భావించి ఒకే కాలవ్యక్తీకరణగా అనువదించడం
  rationale: హీబ్రూ పాఠ్యంలో రెండూ ఉన్నాయి. వాటి మధ్యనున్న భావ ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా, నిషేధానికి సంబంధించిన రెండు బలప్రయోగాలనూ కాపాడాలి.
- issue: קהל יהוה యొక్క స్వభావం
  choice: ‘యెహోవా సమాజం’ అని అనువదించడం
  alternative: ‘యెహోవా సభ’ లేదా ‘ప్రభువు సంఘం’
  rationale: ఈ పదబంధం నిబంధన ప్రజల అధికారిక సమూహాన్ని సూచించినా, సభ్యత్వం లేదా హక్కుల ఖచ్చిత పరిధిని వచనం స్వయంగా నిర్వచించదు. అందువల్ల ఒక నిర్దిష్ట మతసంస్థ భావాన్ని దిగుమతి చేయకుండా విస్తృతమైన పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కానీ ధర్మశాస్త్ర వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘అమ్మోనీయుడుగాని మోయాబీయుడుగాని’ అనే నిర్మాణం రెండు జాతివాచకాలను సమాన నిషేధ పరిధిలో ఉంచుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
