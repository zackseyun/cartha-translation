source:
  edition: WLC
  text: וְ/כִ֥י תֶחְדַּ֖ל לִ/נְדֹּ֑ר לֹֽא יִהְיֶ֥ה בְ/ךָ֖ חֵֽטְא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: te
  text: కానీ నీవు మొక్కుబడి చేయకుండా ఉంటే, నీకు పాపం ఉండదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మీద దోషం ఉండదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: కానీ ... ఉంటే
  rationale: ముందటి వచనంలో మొక్కుబడిని నెరవేర్చాల్సిన బాధ్యతకు భిన్నమైన షరతును ఇది పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘కానీ ... ఉంటే’ ఆ వ్యత్యాసాన్నీ షరతునూ సహజంగా తెలియజేస్తుంది.
- source_word: תֶחְדַּל
  choice: చేసుకోకుండా ఉంటే
  rationale: חדל అంటే మానుకోవడం లేదా చేయకుండా ఉండడం. ఇక్కడ ఇప్పటికే చేస్తున్న పనిని ఆపడం కాదు, మొక్కుబడి చేయకూడదని ఉండడం భావం; అందువల్ల ఈ రూపం సందర్భానికి సహజం.
- source_word: לִנְדֹּר
  choice: మొక్కుబడి
  rationale: נדר అంటే దేవునికి చేసే ప్రమాణపూర్వక మొక్కుబడి. ‘మొక్కుబడి చేసుకోవడం’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ఆ నిర్దిష్ట కార్యాన్ని నిలుపుతుంది.
- source_word: לֹא יִהְיֶה
  choice: ఉండదు
  rationale: నిషేధార్థక అస్తిత్వ ప్రయోగాన్ని తెలుగులో సహజమైన భవిష్యత్/ఫలితార్థక రూపంగా అందిస్తుంది.
- source_word: בְּךָ
  choice: నీకు
  rationale: అక్షరార్థంగా ‘నీలో’ అయినప్పటికీ, పాపం లేదా అపరాధ బాధ్యత ఒకరికి అంటగట్టబడదనే న్యాయ-నైతిక భావాన్ని ‘నీకు ... ఉండదు’ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֵטְא
  choice: పాపం
  rationale: חֵטְא పాపం లేదా అపరాధాన్ని సూచించగలదు. సందర్భంలో మొక్కుబడి చేయకపోవడం పాపకార్యం కాదనే ప్రధాన భావానికి ‘పాపం’ స్పష్టమైన ఎంపిక; అపరాధభావాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: మొక్కుబడి చేయకపోవడం యొక్క నైతిక స్థితి
  choice: మొక్కుబడి చేసుకోకుండా ఉండడం స్వయంగా పాపం కాదు.
  alternative: వ్యక్తిపై అపరాధం లేదా దోషబాధ్యత ఉండదనే న్యాయపరమైన భావానికి ప్రాధాన్యం ఇవ్వడం.
  rationale: חֵטְא అనే పదంలో పాపం, అపరాధం అనే రెండు ఛాయలూ ఉన్నాయి. ప్రధాన పాఠం నైతిక వ్యత్యాసాన్ని ‘పాపం’తో స్పష్టంగా ఉంచి, న్యాయపరమైన అపరాధ ఛాయను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన సంబోధన వాడబడింది. ‘మొక్కుబడి’ అనే సాధారణ బైబిలు-మతపర పదం נדר యొక్క నిర్దిష్ట భావాన్ని కాపాడుతుంది; ‘నీకు పాపం ఉండదు’ మూలంలోని భావాన్ని సహజ తెలుగు నుడికారంలో అందిస్తుంది.
