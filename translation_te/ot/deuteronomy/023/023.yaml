    issue: Informal second-person pronoun
    rationale: “నువ్వు” is more colloquial than the respectful, standard biblical register claimed in the notes. Use “నీవు.”
  - severity: low
    issue: Reflexive phrasing for making a vow
    rationale: “మొక్కుబడి చేసుకోకుండా” is possible, but “మొక్కుబడి చేయకుండా” is cleaner and more direct for the Hebrew infinitive ‘to vow.’
  - severity: low
    issue: Footnote’s alternative term
    rationale: For the contextual ‘guilt/liability’ sense of חֵטְא, “నీ మీద దోషం ఉండదు” is more idiomatic and semantically precise than “అపరాధం ఉండదు.”
  revised_text: కానీ నీవు మొక్కుబడి చేయకుండా ఉంటే, నీకు పాపం ఉండదు.[a]
