revisions:
- from: కానీ నువ్వు మొక్కుబడి చేసుకోకుండా ఉంటే, నీకు పాపం ఉండదు.[a]
  to: కానీ నీవు మొక్కుబడి చేయకుండా ఉంటే, నీకు పాపం ఉండదు.[a]
  rationale: The revision preserves the Hebrew conditional contrast and its teaching that declining to make a vow is not sinful. It improves modern standard Telugu register and idiom without adding interpretive content, and it retains the legitimate guilt/liability alternative in the footnote.
