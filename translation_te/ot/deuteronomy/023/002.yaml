source:
  edition: WLC
  text: לֹֽא יָבֹ֧א פְצֽוּעַ דַּכָּ֛א וּ/כְר֥וּת שָׁפְכָ֖ה בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: te
  text: వృషణాలు నలిగినవాడుగానీ, పురుషాంగం కోయబడినవాడుగానీ యహ్వే సభలో ప్రవేశించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే సభ’ అనేది ఇశ్రాయేలు నిబంధన సమాజంలో అధికారిక భాగస్వామ్యాన్ని సూచించవచ్చు; ఈ నిషేధం యొక్క ఖచ్చితమైన పరిధి గురించి భిన్న అభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָבֹא
  choice: చేరకూడదు
  rationale: בוא అంటే ‘రావడం/ప్రవేశించడం.’ ఈ న్యాయ సందర్భంలో లֹאతో కలిసిన నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ‘చేరకూడదు’ అని వ్యక్తపరుస్తుంది.
- source_word: פְצוּעַ דַּכָּא
  choice: వృషణాలు నలిగినవాడు
  rationale: ఈ పదబంధం నలిపివేయడం వల్ల పురుషుని లైంగిక అవయవాలకు, ప్రత్యేకంగా వృషణాలకు కలిగిన గాయాన్ని సూచిస్తుంది. అస్పష్టమైన సభ్యోక్తికి బదులు శరీర నిర్మాణపరంగా స్పష్టమైన పదప్రయోగం ఎంచుకోబడింది.
- source_word: וּכְרוּת שָׁפְכָה
  choice: పురుషాంగం కోయబడినవాడు
  rationale: ఈ పదబంధం పురుషుని జననేంద్రియం కోయబడిన స్థితిని సూచిస్తుంది. ‘పురుషాంగం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన శరీర నిర్మాణ పదం. రెండు వేర్వేరు పరిస్థితులను తెలుగులో సహజంగా చూపేందుకు ‘అయినా … అయినా’ వాడబడింది.
- source_word: בִּקְהַל
  choice: సమాజంలో
  rationale: קהל కూడిన ప్రజాసమూహాన్ని, ఇక్కడ యహ్వేకు చెందిన నిబంధన సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ సాధారణ పాఠకులకు సహజంగా ఉండి, పదం యొక్క న్యాయ-నిబంధన నేపథ్యాన్ని అతిగా నిర్వచించదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని స్వనామ రూపంగా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: ‘యహ్వే సమాజంలో చేరడం’ అనే నిషేధం యొక్క పరిధి
  choice: మూలంలోని నిబంధన-సమాజ పదబంధాన్ని నేరుగా ఉంచి, నిషేధపు ఖచ్చితమైన సామాజిక లేదా ఆరాధనా పరిధిని ప్రధాన వాక్యంలో నిర్వచించలేదు.
  alternative: ఇది ఆరాధనా సభలో పాల్గొనడానికే, పౌర సభ్యత్వానికే, వివాహ అర్హతకే, లేదా మరింత విస్తృతమైన ఆచార సంబంధ ప్రవేశానికే వర్తిస్తుందని నిర్దిష్టంగా చెప్పడం.
  rationale: ఈ వచనం ‘యహ్వే సమాజం’ అని మాత్రమే చెబుతుంది; ఆ పదబంధపు పూర్తి న్యాయ, సామాజిక, లేదా రక్షణ సంబంధ పరిణామాలను ఇక్కడే వివరించదు. అందువల్ల అనిశ్చితిని పాదసూచికలో గుర్తించి, తరువాతి మతసిద్ధాంతాలను వాక్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయ వాక్యానికి తగిన సంక్షిప్తతతో, శరీర భాగాలను సభ్యోక్తుల వెనుక దాచకుండా స్పష్టమైనప్పటికీ గౌరవప్రదమైన పదజాలం ఉపయోగించబడింది. ‘చేరకూడదు’ ప్రవేశ నిషేధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
