revisions:
- from: వృషణాలు నలిగినవాడైనా, పురుషాంగం కోయబడినవాడైనా యహ్వే సమాజంలో చేరకూడదు.[a]
  to: వృషణాలు నలిగినవాడుగానీ, పురుషాంగం కోయబడినవాడుగానీ యహ్వే సభలో ప్రవేశించకూడదు.[a]
  rationale: The revision renders the legal verb as explicit entry, uses ‘సభ’ for the Hebrew qahal, and marks the two conditions as alternatives. It retains the source’s ambiguity concerning the practical scope of exclusion and does not add theological conclusions.
