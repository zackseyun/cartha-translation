translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద న్యాయశైలిని ఉపయోగించాం. అనుమతి మరియు నిషేధం మధ్య వ్యత్యాసాన్ని ‘తినవచ్చు ... వేసుకోకూడదు’ ద్వారా స్పష్టంగా నిలిపాం; మూలంలోని కాలార్థక/షరతార్థక సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
