base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: te
  text: నీ పొరుగువాని ద్రాక్షతోటలోకి నీవు ప్రవేశించినప్పుడు[a], నీ ఇష్టం మేరకు తృప్తి చెందే వరకు ద్రాక్షపండ్లు తినవచ్చు[b]. కానీ వాటిలో దేనినీ నీ పాత్రలో వేసుకోకూడదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పొరుగువాని ద్రాక్షతోటలోకి నీవు ప్రవేశిస్తే.’ హీబ్రూ అవ్యయం కాలార్థకంగానూ షరతార్థకంగానూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ ప్రాణం/కోరిక మేరకు, నీ తృప్తికి.’ ఇక్కడ ఇది నీ కోరిక లేదా ఆకలి మేరకు, తృప్తి చెందే వరకు తినవచ్చని తెలిపే నానుడి.
    reason: lexical_alternative
  - marker: c
    text: ‘పాత్ర’కు మూలమైన హీబ్రూ పదం సాధారణమైనది; అది సంచి, బుట్ట లేదా ఏదైనా నిర్దిష్ట రకమైన పాత్రను సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: వెళ్లినప్పుడు
  rationale: כִּי ఇక్కడ కారణార్థకం కాక సందర్భాన్ని పరిచయం చేసే కాలార్థక లేదా షరతార్థక అవ్యయం; בוא తో కలిపి ద్రాక్షతోటలో ప్రవేశించే సందర్భాన్ని సహజ తెలుగులో ‘వెళ్లినప్పుడు’ అని వ్యక్తం చేశాం. ‘వెళితే’ కూడా సాధ్యమే.
- source_word: בְּכֶרֶם רֵעֶךָ
  choice: నీ పొరుగువాని ద్రాక్షతోటలోకి
  rationale: כֶּרֶם ప్రత్యేకంగా ద్రాక్షతోటను సూచిస్తుంది; רֵעַ ఇక్కడ పొరుగువాడు లేదా తోటి వ్యక్తి అనే అర్థంలో ఉంది. ప్రవేశాన్ని తెలుగులో సహజంగా తెలియజేయడానికి בְּ ను ‘లోకి’గా వ్యక్తం చేశాం.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: ద్రాక్షపండ్లు తినవచ్చు
  rationale: న్యాయసందర్భంలో ఈ రూపం అనుమతించబడిన చర్యను సూచిస్తుంది; అందువల్ల ఆజ్ఞగా కాక అనుమతిగా ‘తినవచ్చు’ అని అనువదించాం.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: నీకు తృప్తి కలిగేంతవరకు నీ కోరిక మేరకు
  rationale: נֶפֶשׁ ఇక్కడ ‘ఆత్మ’ అనే తాత్త్విక అర్థంలో కాక వ్యక్తిగత కోరిక లేదా ఆకలిని సూచిస్తుంది; שָׂבְעֶךָ తిని తృప్తి చెందే పరిమితిని తెలియజేస్తుంది.
- source_word: וְאֶל כֶּלְיְךָ לֹא תִתֵּן
  choice: అయితే వాటిలో దేనినీ నీ పాత్రలో వేసుకోకూడదు
  rationale: כְּלִי అనేది సంచి లేదా బుట్ట అని నిర్దిష్టంగా చెప్పని సాధారణ పాత్ర/సామగ్రి పదం. נתן కు ఈ సందర్భంలో సహజమైన అర్థం ‘వేయడం’; ముందు పేర్కొన్న ద్రాక్షపండ్లను సూచించేందుకు ‘వాటిలో దేనినీ’ అని స్పష్టం చేశాం.
