source:
  edition: WLC
  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: te
  text: వారికి పుట్టే పిల్లలు మూడవ తరంలో యాహ్వే సమాజంలో ప్రవేశించవచ్చు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘కుమారులు’; ఈ న్యాయ-వంశావళి సందర్భంలో ఈ పదం సంతానాన్ని లేదా వారసులను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మూడవ తరం ప్రవేశిస్తుంది.’ హీబ్రూ వాక్యాన్ని మరింత అక్షరానుసారంగా ఇలా అనువదించవచ్చు; సందర్భంలో మూడవ తరంనుంచి ప్రవేశానికి అనుమతి ఉందనే భావం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: పిల్లలు
  rationale: హీబ్రూ పదానికి అక్షరార్థంగా ‘కుమారులు’ అని ఉన్నా, ఈ వంశపారంపర్య న్యాయ సందర్భంలో అది సంతానాన్ని విస్తృతంగా సూచిస్తుంది. ‘పిల్లలు’ కుటుంబ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: వారికి పుట్టే
  rationale: ילד క్రియ యొక్క కర్మణి రూపం, לָהֶםతో కలిసి, ‘వారికి పుట్టే’ అనే సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: דּוֹר שְׁלִישִׁי
  choice: మూడవ తరంలో
  rationale: ప్రవేశానికి అర్హత కలిగే వంశపారంపర్య దశను ఈ పదబంధం సూచిస్తుంది; తెలుగులో ‘మూడవ తరంలో’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: יָבֹא
  choice: చేరవచ్చు
  rationale: క్రియ అక్షరార్థంగా ‘వచ్చు/ప్రవేశించవచ్చు.’ న్యాయ సందర్భంలో ఇది అనుమతిని సూచిస్తుంది; సమాజం అనే కర్మతో ‘చేరవచ్చు’ సహజమైన తెలుగు.
- source_word: בִּקְהַל יְהוָה
  choice: యెహోవా సమాజంలో
  rationale: קהל ఒడంబడిక సంబంధమైన కూడిక లేదా సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, సంఘటిత సమూహ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచాం.
- issue: בָּנִים పదం సూచించే పరిధి
  choice: పిల్లలు
  alternative: కుమారులు
  rationale: రూపపరంగా ఇది పుంలింగ బహువచనమైనా, ఈ న్యాయ-వంశావళి సందర్భంలో వంశంలోని సంతానాన్ని విస్తృతంగా సూచిస్తుంది.
- issue: יָבֹא యొక్క న్యాయపరమైన భావం
  choice: చేరవచ్చు
  alternative: చేరును
  rationale: సూటి రూపం భవిష్యత్/నిర్దేశక ధోరణిని కలిగి ఉండగలదు; సందర్భంలో మూడవ తరంనుంచి ప్రవేశానికి అనుమతి ఉందనే భావాన్ని ‘చేరవచ్చు’ స్పష్టం చేస్తుంది, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-వంశావళి శైలి. ‘సమాజం’ సాధారణ పాఠకులకు అర్థమయ్యేలా קהל యొక్క సామూహిక భావాన్ని అందిస్తుంది; మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపాం.
