id: DEU.6.13
reference: Deuteronomy 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א וְ/אֹת֣/וֹ תַעֲבֹ֑ד וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేకు నీవు భయపడాలి[a]; ఆయనను సేవించాలి[b]; ఆయన పేరుతో ప్రమాణం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ దేవుడైన యాహ్వే పట్ల భయభక్తులు కలిగి ఉండాలి.’ హీబ్రూ క్రియ కేవలం భీతిని కాకుండా భయభక్తిని, విస్మయాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనను ఆరాధించాలి.’ హీబ్రూ క్రియకు సాధారణంగా ‘సేవించు’ అని అర్థం; ఈ సందర్భంలో అది ఆరాధనతో కూడిన సేవను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో నిలుపుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, యాహ్వేతో ఇశ్రాయేలుకున్న నిబంధన సంబంధాన్ని నిలుపుతుంది.
- source_word: תִּירָא
  choice: భయపడాలి
  rationale: ఈ క్రియలో భయభక్తి, విస్మయం, దేవుని పరిశుద్ధత పట్ల గంభీరమైన భయం అన్నీ ఇమిడి ఉన్నాయి. ‘భయపడాలి’ అనే పదం ఈ సంపూర్ణ భావపరిధిని కుదించకుండా నిలుపుతుంది.
- source_word: וְאֹתוֹ
  choice: ఆయనను
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న కర్మ సర్వనామాన్ని నిలుపుతుంది; మూలపాఠంలో ప్రత్యక్షంగా లేని ‘ఆయననే/ఆయన ఒక్కరినే’ అనే అదనపు భావాన్ని ప్రధాన పాఠంలో చేర్చదు.
- source_word: תַעֲבֹד
  choice: సేవించాలి
  rationale: עבד అనే క్రియ యొక్క విస్తృతమైన ‘సేవచేయు’ భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో ఆ సేవ ఆరాధనను కూడా కలిగి ఉన్నప్పటికీ, దానిని కేవలం ఆరాధనకే పరిమితం చేయదు.
- source_word: וּבִשְׁמוֹ
  choice: ఆయన పేరున
  rationale: ప్రమాణ సందర్భంలో ב అనే విభక్తి ప్రమాణానికి ఆధారంగా లేదా సాక్షిగా ఆ నామాన్ని ఆహ్వానించడాన్ని సూచిస్తుంది; ‘పేరున’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: תִּשָּׁבֵעַ
  choice: ప్రమాణం చేయాలి
  rationale: నిఫాల్ రూపంలోని ‘ప్రమాణం చేయు’ అనే అర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా పదం అవసరం లేదు, వాక్య నిర్మాణంలో దాని పని వ్యక్తమవుతుంది.
theological_decisions:
- issue: దేవునిపట్ల తగిన స్పందనను సూచించే ירא క్రియను ‘భయపడాలి’గా ఉంచాలా, ‘భయభక్తులు కలిగి ఉండాలి’గా మృదువుగా చేయాలా
  choice: ప్రధాన పాఠంలో ‘భయపడాలి’ అని ఉంచడం
  alternative: ‘భయభక్తులు కలిగి ఉండాలి’ లేదా ‘విస్మయంతో గౌరవించాలి’
  rationale: హీబ్రూ పదం కేవలం భీతిని మాత్రమే సూచించదు; భయభక్తి, విస్మయం, విధేయతతో కూడిన గంభీర భయాన్ని సూచిస్తుంది. ‘భయపడాలి’ని నిలుపడం ద్వారా ఈ నిబంధన ఆజ్ఞలోని ఉద్రిక్తతను తగ్గించకుండా ఉంచి, వివరణను పాదసూచికలో అందిస్తుంది.
- issue: עבד క్రియను ‘సేవించాలి’గా అనువదించాలా, ‘ఆరాధించాలి’గా అనువదించాలా
  choice: ‘సేవించాలి’
  alternative: ‘ఆరాధించాలి’
  rationale: ఇక్కడ దేవునిపట్ల నిబంధన విశ్వాసం సేవ ద్వారా వ్యక్తమవుతుంది. ‘సేవించాలి’ మూలపదపు విస్తృతిని నిలుపుతుంది; దానిలోని ఆరాధనా భావాన్ని తోసిపుచ్చకుండా, దానిని కేవలం ఆచారపరమైన ఆరాధనకే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆజ్ఞా శైలిని ఉపయోగించాం. రెండవ పురుష ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. హీబ్రూ ఆజ్ఞాత్మక yiqtol రూపాలను సహజమైన తెలుగు విధ్యర్థక ‘-ాలి’ నిర్మాణంతో వ్యక్తపరిచాం; మూడు సమాంతర ఆజ్ఞలను అర్ధవిరామాలతో కలిపాం.
