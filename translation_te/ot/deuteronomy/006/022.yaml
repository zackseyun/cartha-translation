id: DEU.6.22
reference: Deuteronomy 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: te
  text: యెహోవా ఐగుప్తులో[a], ఫరోపై, అతని ఇంటివారందరిపై మన కళ్ల ఎదుట గొప్ప, భయంకరమైన సూచనలనూ అద్భుతాలనూ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐగుప్తుకు వ్యతిరేకంగా.” ఇక్కడి హీబ్రూ ఉపసర్గను స్థానార్థంలో “ఐగుప్తులో” అని, సందర్భానుసారం తీర్పు ఐగుప్తుపైకి వచ్చిందని తెలిపే అర్థంలో “ఐగుప్తుకు వ్యతిరేకంగా” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: జరిగేలా చేశాడు
  rationale: נתן యొక్క మూలార్థం ‘ఇచ్చాడు/ఉంచాడు.’ అయితే ‘సూచకకార్యాలు, అద్భుతాలు’ అనే కర్మలతో తెలుగులో ‘ఇచ్చాడు’ అసహజంగా ఉంటుంది; దేవుడు వాటిని ప్రత్యక్షంగా కలిగించాడనే హీబ్రూ భావాన్ని ‘జరిగేలా చేశాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: సూచకకార్యాలను, అద్భుతాలను
  rationale: אותות దేవుని కార్యాల సూచనాత్మక స్వభావాన్ని, מפתים వాటి ఆశ్చర్యకర స్వభావాన్ని తెలియజేస్తాయి. రెండు పదాల భేదాన్ని నిలుపుటకు ఈ జంటను వాడాం.
- source_word: גְּדֹלִים וְרָעִים
  choice: గొప్పవైన, భయంకరమైన
  rationale: גדלים పరిమాణం లేదా ప్రభావంలోని గొప్పతనాన్ని సూచిస్తుంది. רעים ఇక్కడ నైతిక దుష్టత్వాన్ని కాక, ఐగుప్తుపై వాటి వినాశకరమైన, భయానకమైన ప్రభావాన్ని సూచిస్తుంది.
- source_word: בְּמִצְרַיִם
  choice: ఐగుప్తులో
  rationale: ב అనే ఉపసర్గకు సహజమైన స్థానార్థం ‘లో.’ తరువాత ఫరోను, అతని ఇంటివారిని లక్ష్యాలుగా పేర్కొనడం వల్ల, ఐగుప్తును కూడా లక్ష్యంగా చదవవచ్చనే సందర్భార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּפַרְעֹה וּבְכָל בֵּיתוֹ
  choice: ఫరోకు, అతని ఇంటివారందరికీ వ్యతిరేకంగా
  rationale: ఈ సందర్భంలో ב ఫరోను, అతని గృహాన్ని ఆ తీర్పుకార్యాల లక్ష్యాలుగా సూచిస్తుంది. ביתוను భవనం అనే అర్థంలో కాక, అతని గృహస్థులు/ఇంటివారు అనే సమూహార్థంలో అనువదించాం.
- source_word: לְעֵינֵינוּ
  choice: మన కళ్ల ఎదుట
  rationale: ఇది ప్రత్యక్ష సాక్ష్యాన్ని తెలిపే హీబ్రూ నుడికారం; ‘మన కళ్ల ఎదుట’ తెలుగులో సహజమైన, సజీవమైన సమానార్థకం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: וְרָעִים దేవుని కార్యాలను విశేషించడం
  choice: భయంకరమైన
  alternative: హానికరమైన / దారుణమైన / చెడ్డ
  rationale: ఈ విశేషణం ఆ కార్యాల వల్ల ఐగుప్తుకు కలిగిన తీవ్రమైన విపత్తును సూచిస్తుంది; దేవుని కార్యాలు నైతికంగా చెడ్డవని అనవసరంగా సూచించకుండా వాటి భయానక ప్రభావాన్ని నిలుపుతుంది.
- issue: בְּמִצְרַיִם లోని ב అర్థం
  choice: ఐగుప్తులో
  alternative: ఐగుప్తుకు వ్యతిరేకంగా
  rationale: ఉపసర్గ యొక్క ప్రత్యక్ష స్థానార్థాన్ని ప్రధాన పాఠంలో ఉంచాం. సమాంతరంగా వచ్చే ఫరో, అతని ఇంటివారు అనే లక్ష్యాల కారణంగా ప్రతికూల/లక్ష్యార్థ పఠనం సాధ్యమని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ‘సూచకకార్యాలు, అద్భుతాలు’ అనే జంట మూలంలోని రెండు నామవాచకాల భేదాన్ని నిలుపుతుంది. ‘అతని ఇంటివారందరూ’ అనే ప్రయోగం హీబ్రూ ‘అతని ఇల్లంతా’ యొక్క కుటుంబ/గృహస్థుల భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
