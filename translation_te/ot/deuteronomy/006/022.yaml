revisions:
- from: యెహోవా ఐగుప్తులో[a] ఫరోకు, అతని ఇంటివారందరికీ వ్యతిరేకంగా గొప్పవైన, భయంకరమైన సూచకకార్యాలను, అద్భుతాలను మన కళ్ల ఎదుట జరిగేలా చేశాడు.
  to: యెహోవా ఐగుప్తులో[a], ఫరోపై, అతని ఇంటివారందరిపై మన కళ్ల ఎదుట గొప్ప, భయంకరమైన సూచనలనూ అద్భుతాలనూ చేశాడు.
