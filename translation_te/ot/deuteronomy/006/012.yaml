id: DEU.6.12
reference: Deuteronomy 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: te
  text: నిన్ను ఐగుప్తు దేశం నుండి, దాసుల గృహం నుండి బయటకు తీసుకొచ్చిన యాహ్వేను[a] మరచిపోకుండా జాగ్రత్తగా ఉండు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (יהוה), దేవుని వ్యక్తిగత నామం; దీనిని ‘యాహ్వే’ అని లిప్యంతరీకరించారు.'
    reason: divine_name_transliteration
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తగా ఉండు
  rationale: నిఫాల్ ఆజ్ఞారూపం వ్యక్తి తనను తాను కాపాడుకోవాలనే హెచ్చరికను ఇస్తుంది. ఆధునిక తెలుగులో ‘జాగ్రత్తగా ఉండు’ సహజంగా ఉండి, ఏకవచన సంబోధననూ ఆజ్ఞ బలాన్నీ నిలుపుతుంది.
- source_word: פֶּן תִּשְׁכַּח
  choice: మరచిపోకుండా
  rationale: פֶּן ప్రతికూల హెచ్చరికను పరిచయం చేస్తుంది. ‘మరచిపోకుండా’ ప్రమాదాన్ని నివారించాలనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; ఇక్కడ ‘మరచిపోవడం’లో యెహోవా చేసిన కార్యాలను నిర్లక్ష్యం చేయడమనే నిబంధనాత్మక అంతర్భావం ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తినామంగా అందించాం.
- source_word: הוֹצִיאֲךָ
  choice: నిన్ను ... బయటకు తీసుకొచ్చిన
  rationale: יצא హిఫిల్ రూపం నిర్గమ సందర్భంలో ‘బయటకు తీసుకురావడం’ అని అర్థం. ఈ ఎంపిక దేవుడే విమోచన కార్యానికి కర్త అనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలోని ‘దేశం’ అనే పదాన్ని నిలుపుతూ, తెలుగులో సహజమైన విభక్తి నిర్మాణాన్ని వాడాం.
- source_word: מִבֵּית עֲבָדִים
  choice: దాసుల గృహం నుండి
  rationale: మూలంలో ఉన్న concrete plural ‘దాసులు’ను, అలాగే ‘గృహం’ అనే రూపకాన్ని నిలిపాం. ఇది ‘బానిసత్వ గృహం’ అనే మరింత నుడికారమైన ప్రత్యామ్నాయంకంటే హీబ్రూ నిర్మాణానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపడం మూలభేదాన్ని కాపాడుతుంది.
- issue: עֲבָדִים అనే బానిస స్థితిని సూచించే పదం
  choice: దాసులు
  alternative: బానిసత్వం
  rationale: హీబ్రూలో భావవాచకమైన ‘బానిసత్వం’ కాకుండా బహువచన వ్యక్తివాచక పదం ఉంది. అందువల్ల ప్రధాన పాఠంలో concrete రూపాన్ని నిలిపి, నుడికార ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. ఏకవచన సంబోధనను ‘నిన్ను/ఉండు’ ద్వారా నిలిపాం. ‘దాసుల గృహం’ మూలంలోని concrete రూపకాన్ని కాపాడుతుంది.
