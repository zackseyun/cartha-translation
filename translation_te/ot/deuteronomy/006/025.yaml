source:
  edition: WLC
  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: te
  text: మన దేవుడైన యాహ్వే సన్నిధిలో, ఆయన మనకు ఆజ్ఞాపించిన ప్రకారం, ఈ ఆజ్ఞ అంతటినీ[b] జాగ్రత్తగా ఆచరిస్తే, అది మనకు నీతిగా[a] ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతి’ అని అనువదించిన హీబ్రూ పదానికి ‘న్యాయమైనది’ లేదా ‘సరైనదిగా ఉండడం’ అనే భావాలు కూడా ఉన్నాయి. ఇక్కడ అది నిబంధన సంబంధ సందర్భంలో దేవుని ఎదుట సరైనదిగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'మరొక విధంగా: ‘ఈ మొత్తం ఆజ్ఞను.’ ఏకవచనంలోని ‘ఆజ్ఞ’ ఇక్కడ బోధననంతటినీ ఒక సమగ్ర ఏకకంగా సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: నీతిగా
  rationale: צְדָקָה ఇక్కడ దేవుని నిబంధన సంబంధంలో సరైనదిగా ఉండడాన్ని సూచిస్తుంది. ‘నీతి’ దాని నైతిక, న్యాయ సంబంధ భావవిస్తృతిని కాపాడుతుంది; సాంకేతికమైన తరువాతి సిద్ధాంతార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: תִּהְיֶה לָּנוּ
  choice: అది మనకు ... ఉంటుంది
  rationale: హీబ్రూ విధేయ వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘లెక్కించబడుతుంది’ వంటి మూలంలో స్పష్టంగా లేని సిద్ధాంతపరమైన భావాన్ని చేర్చదు.
- source_word: כִּי
  choice: ఆచరిస్తే
  rationale: ఈ సందర్భంలో כִּי షరతును పరిచయం చేస్తుంది; తెలుగులో ‘-తే’ రూపం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: జాగ్రత్తగా ఆచరిస్తే
  rationale: שׁמר లోని శ్రద్ధగా కాపాడి పాటించే భావాన్నీ, עשה లోని కార్యరూపంలో చేయడం అనే భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ఈ ఆజ్ఞ అంతటినీ
  rationale: ఏకవచనమైన ‘ఆజ్ఞ’ను నిలుపుతూ, כָּל సూచించే సమగ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: దేవుని ఎదుట, ఆయన సమక్షంలో జీవించి ఆచరించడమనే నిబంధన సంబంధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మూలంలోని బహువచన ప్రథమ పురుష స్వామ్య సంబంధాన్ని, నిబంధన సంబంధాన్ని సూటిగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: ఆయన మనకు ఆజ్ఞాపించిన ప్రకారం
  rationale: ఇప్పటికే ఇచ్చిన దైవాజ్ఞకు అనుగుణంగా ఆచరించడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన విధేయత సందర్భంలో ‘నీతి’ భావం
  choice: ఈ విధేయత ‘మనకు నీతిగా ఉంటుంది’ అని వచనం చెప్పే సంబంధాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని సాంకేతిక అర్థంలో ‘మన ఖాతాలో నీతిగా జమ చేయబడుతుంది’ అని వివరించడం, లేదా కేవలం ‘న్యాయం’గా అనువదించడం
  rationale: హీబ్రూ వచనం విధేయతకు, నీతికి మధ్య నిజమైన సంబంధాన్ని ప్రకటిస్తుంది; అయితే తరువాతి సిద్ధాంత వ్యవస్థలోని నిర్దిష్ట యాంత్రికతను వివరించదు. అందువల్ల ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. షరతును ముందుంచడం తెలుగు వాక్యప్రవాహానికి అనుకూలం; అయినా ‘అది మనకు నీతిగా ఉంటుంది’ అనే మూలంలోని కీలక విధేయ నిర్మాణం నిలుపబడింది. దైవనామం బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
