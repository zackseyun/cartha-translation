  yaml_path: translation/ot/deuteronomy/006/009.yaml
  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: te
  text: నీ ఇంటి ద్వారపు నిలువు కమ్ముల మీదా, నీ గుమ్మాల మీదా వాటిని రాయాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ ఇంటి ద్వారబంధాల మీద.’ హీబ్రూ పదం ప్రత్యేకంగా ద్వారానికి ఇరువైపులా ఉండే నిలువు కమ్ములను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ గుమ్మపు కమ్ముల మీద’ లేదా ‘నీ గుమ్మాల దగ్గర.’ హీబ్రూ పదం గుమ్మాన్ని, దాని ప్రవేశ ప్రాంతాన్ని, లేదా దాని నిర్మాణాత్మక ప్రవేశ భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: వాటిని ... రాయాలి
  rationale: సందర్భంలోని ఆజ్ఞాక్రమంలో సంయోజకంతో వచ్చిన క్రియ ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. కర్మప్రత్యయం పూర్వసందర్భంలోని మాటలను సూచిస్తున్నందున ‘వాటిని’ అని స్పష్టంగా ఉంచాం.
- source_word: עַל
  choice: మీద
  rationale: రాయవలసిన స్థలాన్ని తెలిపే సాధారణ స్థానార్థక ప్రయోగం; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מְזוּזֹת
  choice: ద్వారబంధాలు
  rationale: ఈ పదం ప్రవేశద్వారానికి ఇరువైపులా ఉండే నిలువు కమ్ములను సూచిస్తుంది. ‘ద్వారబంధాలు’ ఆ నిర్మాణ భాగాన్ని తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: בֵּיתֶךָ
  choice: నీ ఇంటి
  rationale: בַּיִת యొక్క భౌతిక గృహార్థాన్ని నేరుగా నిలుపుతుంది; ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’గా కాపాడుతుంది.
- source_word: וּבִשְׁעָרֶיךָ
  choice: నీ గుమ్మాల మీద
  rationale: שַׁעַר ఆస్తి, ప్రాంగణం లేదా పట్టణ ప్రవేశద్వారాలను సూచించగలదు. బహువచనాన్ని, సమాంతరమైన లిఖనస్థాన భావాన్ని ‘గుమ్మాల మీద’ సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. మూలంలోని ఏకవచన ‘నీ’ మరియు ‘వాటిని’ అనే పూర్వసూచిత కర్మ రెండూ నిలుపబడ్డాయి; ద్వార నిర్మాణానికి సంబంధించిన పదాల అర్థపరిధిని పాదటిప్పణుల్లో చూపించాం.
