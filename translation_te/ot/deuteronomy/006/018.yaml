revisions:
- from: యెహోవా దృష్టికి సరైనదీ మంచిదీ నీవు చేయాలి. అప్పుడు నీకు మేలు కలుగుతుంది; యెహోవా నీ పితరులకు ప్రమాణం చేసిన ఆ మంచి దేశంలోకి నీవు వెళ్లి, దాన్ని స్వాధీనం చేసుకుంటావు.[a]
  to: యెహోవా దృష్టిలో సరైనదీ మంచిదీ నీవు చేయాలి. తద్వారా నీకు మేలు కలుగుతుంది; యెహోవా నీ పితరులకు ఇస్తానని ప్రమాణం చేసిన ఆ మంచి దేశంలోకి నీవు వెళ్లి, దాన్ని స్వాధీనం చేసుకుంటావు.[a]
  rationale: చిన్న శైలీ, స్పష్టత సవరణలు మాత్రమే చేశాం. దైవనామం, ఏకవచన సంబోధన, నైతిక ద్విపదం, ప్రమాణం, మరియు ירשׁ యొక్క క్రియాశీల స్వాధీనత భావం యథాతథంగా ఉన్నాయి. పాదసూచిక ప్రత్యామ్నాయాన్ని ఆధునిక తెలుగులో స్పష్టంగా తీర్చిదిద్దాం.
