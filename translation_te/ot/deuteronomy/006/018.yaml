id: DEU.6.18
reference: Deuteronomy 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: te
  text: యెహోవా దృష్టిలో సరైనదీ మంచిదీ నీవు చేయాలి. తద్వారా నీకు మేలు కలుగుతుంది; యెహోవా నీ పితరులకు ఇస్తానని ప్రమాణం చేసిన ఆ మంచి దేశంలోకి నీవు వెళ్లి, దాన్ని స్వాధీనం చేసుకుంటావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ మంచి దేశాన్ని వారసత్వంగా పొందుతావు.” హీబ్రూ క్రియకు ‘వారసత్వంగా పొందు,’ ‘స్వాధీనం చేసుకో,’ లేదా ‘స్వాధీనంగా కలిగియుండు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఇశ్రాయేలు వాగ్దాన దేశంలో ప్రవేశించి దాన్ని స్వాధీనం చేసుకోవడం ఉద్దేశం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు చేయాలి
  rationale: బోధనాత్మక సందర్భంలో ఈ క్రియ ఆజ్ఞాత్మక భావాన్ని కలిగి ఉంది; ఆధునిక తెలుగులో ‘చేయాలి’ సహజంగా ఆ బాధ్యతను తెలియజేస్తుంది.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: సరైనదీ మంచిదీ
  rationale: ‘న్యాయమైన/నిటారైనది’ మరియు ‘మంచిది’ అనే రెండు నైతిక భావాలను కలపకుండా, సహజమైన తెలుగు జంటగా నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: హీబ్రూ ‘కళ్లలో’ అనే మూలరూపకానికి సమానమైన, తెలుగులో సహజమైన మదింపు ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: అప్పుడు నీకు మేలు కలుగుతుంది
  rationale: ఉద్దేశం/ఫలితం సంబంధాన్ని సహజంగా చూపిస్తూ, కేవలం భౌతిక సంపదకు పరిమితం కాని శ్రేయస్సు భావాన్ని నిలుపుతుంది.
- source_word: וּבָאתָ
  choice: దేశంలోకి నీవు వెళ్లి
  rationale: వాగ్దాన దేశంలో ప్రవేశించే కదలికను స్పష్టంగా, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיָרַשְׁתָּ
  choice: దాన్ని స్వాధీనం చేసుకుంటావు
  rationale: ఇక్కడ క్రియ ఇశ్రాయేలు దేశంలో ప్రవేశించి దానిని అధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది; ‘స్వాస్థ్యంగా పొందు’ అనే ప్రత్యామ్నాయ భావం పాదసూచికలో నిలుపబడింది.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ఆ మంచి దేశం
  rationale: మూలంలోని సూటి మదింపు పదాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: యెహోవా ... ప్రమాణం చేసిన
  rationale: נשבע లోని ప్రమాణపూర్వక వాగ్దాన భావాన్ని ‘వాగ్దానం’గా మాత్రమే సడలించకుండా కాపాడుతుంది.
- source_word: לַאֲבֹתֶיךָ
  choice: నీ పితరులకు
  rationale: పితృసంబంధమైన హీబ్రూ బహువచనాన్ని చారిత్రక నిబంధన సందర్భానికి తగిన విధంగా నిలుపుతుంది.
theological_decisions:
- issue: యְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుతో భర్తీ చేయలేదు; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: וְיָרַשְׁתָּ యొక్క భావపరిధి
  choice: స్వాధీనం చేసుకుంటావు
  alternative: స్వాస్థ్యంగా పొందుతావు
  rationale: సందర్భం దేశంలో ప్రవేశించి దానిని అధీనంలోకి తీసుకోవడాన్ని ముందుకు తెస్తుంది; అయితే వారసత్వ/స్వాస్థ్య భావం సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
- issue: לַאֲבֹתֶיךָ లోని లింగసూచక బంధుత్వ పదం
  choice: నీ పితరులకు
  alternative: నీ పూర్వీకులకు
  rationale: ఇక్కడ పితరులతో చేసిన ప్రమాణానికి చారిత్రక సూచన ఉన్నందున మూలంలోని పురుష బహువచన బంధుత్వ భావాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ఏకవచన సంబోధనను నిలిపి, ప్రమాణం మరియు దేశ స్వాధీనతకు సంబంధించిన నిబంధన స్వరాన్ని కాపాడింది.
