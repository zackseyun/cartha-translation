    rationale: యెహోవా పితరులకు దేశాన్ని ఇస్తానని ప్రమాణం చేశాడనే హీబ్రూ సంబంధం ఉంది. ‘ఇస్తానని’ చేర్చడం కొత్త భావాన్ని జోడించదు; తెలుగులో ప్రమాణపు విషయాన్ని స్పష్టం చేస్తుంది.
