id: DEU.6.14
reference: Deuteronomy 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: te
  text: మీ చుట్టుపక్కల ఉన్న ప్రజల దేవుళ్లైన ఇతర దేవుళ్లను మీరు అనుసరించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇతర దేవుళ్లను వెంబడించి వెళ్లకూడదు.”
    reason: మూల హీబ్రూ పదబంధంలోని ‘వెంబడించి వెళ్లడం’ అనే రూపకాన్ని చూపించే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: మీరు అనుసరించకూడదు
  rationale: הלך אחרי అనే హీబ్రూ పదబంధం అక్షరార్థంగా ‘వెనుక వెళ్లడం’ అని ఉన్నా, ఇక్కడ మతపరంగా ఒక దేవుణ్ణి అనుసరించడం లేదా అతనికి విధేయత చూపడం అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘అనుసరించకూడదు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఏ ఇతర దేవుణ్ణీ
  rationale: ‘ఇతర దేవుళ్లు’ అనే మూల భావాన్ని నిలుపుతూ, నిషేధం వారిలో ఎవరినీ అనుసరించకూడదనే సమగ్ర భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ఏకవచన పంపిణీ నిర్మాణం వాడబడింది.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: ప్రజల దేవుళ్లలో
  rationale: מִן ఇక్కడ భాగసూచకంగా, చుట్టుపక్కల ప్రజల దేవుళ్లలో నుంచి ఏ ఇతర దేవుణ్ణీ అనుసరించవద్దనే భావాన్ని ఇస్తుంది. ‘దేవుళ్లలో’ ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: మీ చుట్టూ ఉన్న
  rationale: ఈ సంబంధవాచక వాక్యభాగం ‘ప్రజలను’ విశేషిస్తుంది; ‘మీ చుట్టూ ఉన్న ప్రజలు’ భౌగోళికంగా సమీపంలోని సమూహాలను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: నిషేధ స్వభావం
  choice: ఇతర దేవుళ్లను మతపరంగా అనుసరించడం లేదా వారికి విధేయత చూపడం నిషేధించబడింది.
  alternative: అన్య దేవతల ఆలయాల వైపు శారీరకంగా వెళ్లడమే నిషేధించబడింది.
  rationale: ద్వితీయోపదేశకాండంలో הלך אחרי అనే పదబంధం సాధారణంగా ఆరాధన, విధేయత, మతపరమైన అనుసరణను సూచిస్తుంది; కేవలం శారీరక గమనాన్ని కాదు. అయినా మూలంలోని రూపకాన్ని పాదటిప్పణిలో నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ప్రజలు’ అనే పదం עַמִּים కు దగ్గరగా ఉండి, ‘దేశాలు’ అని రాజకీయ భావాన్ని జోడించదు. ప్రధాన వాక్యంలో అర్థస్పష్టత కోసం ‘అనుసరించకూడదు’ వాడి, హీబ్రూ రూపకాన్ని పాదటిప్పణిలో భద్రపరచాం.
