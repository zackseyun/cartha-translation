revisions:
- from: వాటిని నీ కుమారులకు శ్రద్ధగా నేర్పించాలి[a]. నీవు నీ ఇంట్లో కూర్చున్నప్పుడు, దారిలో నడుస్తున్నప్పుడు, పడుకున్నప్పుడు, లేచినప్పుడు వాటి గురించి మాట్లాడాలి.[b]
  to: వాటిని నీ కుమారులకు[b] పదేపదే బోధించాలి[a]. నీవు నీ ఇంట్లో కూర్చున్నప్పుడు, దారిలో నడుస్తున్నప్పుడు, పడుకునేటప్పుడు, లేచినప్పుడు వాటి గురించి మాట్లాడాలి.
  rationale: మూలంలోని కుమారుల గురించిన పాదటిప్పణి గుర్తును సంబంధిత పదం వద్దకు మార్చాం. శׁנן క్రియలోని తీవ్ర, పునరావృత బోధనా భావాన్ని ‘పదేపదే బోధించాలి’గా స్పష్టపరిచాం. పడుకోవడం సూచించే కాలపదబంధాన్ని ‘పడుకునేటప్పుడు’గా మార్చి, మూలంలోని చర్యకు ఉపక్రమించే సందర్భాన్ని కాపాడాం. ఇతర సమాంతర కాలపదబంధాలు మరియు రెండవ పురుష ఏకవచన సంబోధన నిలిపాం.
