id: DEU.6.7
reference: Deuteronomy 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שִׁנַּנְתָּ֣/ם לְ/בָנֶ֔י/ךָ וְ/דִבַּרְתָּ֖ בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: te
  text: వాటిని నీ కుమారులకు[b] పదేపదే బోధించాలి[a]. నీవు నీ ఇంట్లో కూర్చున్నప్పుడు, దారిలో నడుస్తున్నప్పుడు, పడుకునేటప్పుడు, లేచినప్పుడు వాటి గురించి మాట్లాడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిని వారి మనస్సుల్లో బలంగా నాటాలి.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘పదును పెట్టు’ అనే భావం ఉంది; ఇక్కడ అది పదేపదే, జాగ్రత్తగా బోధించడాన్ని రూపకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘నీ కుమారులకు’ అని ఉంది; విస్తృతార్థంలో ఈ ఆదేశం ఇంటివారికి ఇచ్చే బోధనకూ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: వాటిని ... శ్రద్ధగా నేర్పించాలి
  rationale: שׁנן అనే క్రియకు అక్షరార్థంగా ‘పదును పెట్టడం’ అనే భావం ఉంది; ఇక్కడ అది పదేపదే, జాగ్రత్తగా బోధించి మనస్సులో బలంగా నాటడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘శ్రద్ధగా నేర్పించాలి’ ఆ తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבָנֶיךָ
  choice: నీ కుమారులకు
  rationale: בנים రెండవ పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న పురుష బహువచనం; మూలంలోని లింగనిర్దిష్ట రూపాన్ని ‘నీ కుమారులకు’ అని నిలిపాం.
- source_word: וְדִבַּרְתָּ בָּם
  choice: వాటి గురించి మాట్లాడాలి
  rationale: דבר తరువాత בָּם ఇక్కడ ‘వాటి గురించి’ మాట్లాడడాన్ని సహజంగా సూచిస్తుంది; తెలుగులో ఈ రూపం స్పష్టంగా, సామాన్య వాడుకకు అనుగుణంగా ఉంటుంది.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: నీ ఇంట్లో కూర్చున్నప్పుడు
  rationale: בְ తో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది. ఈ తెలుగు రూపం అలవాటుగా జరిగే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: దారిలో నడుస్తున్నప్పుడు
  rationale: הלך మరియు דרךలను దగ్గరగా అనుసరిస్తూ, సాధారణ ప్రయాణ సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּבְשָׁכְבְּךָ
  choice: పడుకున్నప్పుడు
  rationale: పడుకోవడం లేదా నిద్రకు ఉపక్రమించే సమయాన్ని తెలిపే సహజమైన కాలవాచక రూపం.
- source_word: וּבְקוּמֶךָ
  choice: లేచినప్పుడు
  rationale: ప్రత్యేకంగా నిద్రనుంచి లేవడాన్ని సూచించే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం; ‘పడుకున్నప్పుడు’తో సమాంతరంగా ఉంటుంది.
theological_decisions:
- issue: నిబంధన బోధలో లింగనిర్దిష్ట సంతాన పదం
  choice: నీ కుమారులకు
  alternative: నీ పిల్లలకు
  rationale: హీబ్రూ పాఠంలో పదం స్పష్టంగా పురుష బహువచనమైన ‘కుమారులు’. అందువల్ల ప్రధాన పాఠంలో దానిని విశాలార్థకమైన ‘పిల్లలు’గా మార్చకుండా మూలరూపాన్ని నిలిపి, విస్తృత గృహ అన్వయాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని రెండవ పురుష ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. వరుస కాలవాచక పదబంధాల సమాంతరతను కాపాడాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
