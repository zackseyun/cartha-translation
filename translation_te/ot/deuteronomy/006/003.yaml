revisions:
- from: కాబట్టి ఇశ్రాయేలూ, విను; నీకు మేలు కలగడానికి, మీరు ఎంతో విస్తరించడానికి దాన్ని జాగ్రత్తగా ఆచరించు. నీ పితరుల[a] దేవుడైన యహ్వే నీతో చెప్పినట్లుగా[b], పాలు తేనెలు ప్రవహించే దేశంలో.
  to: కాబట్టి ఇశ్రాయేలూ, విను; నీకు మేలు కలగడానికి, పాలు తేనె ప్రవహించే దేశంలో మీరు ఎంతో విస్తరించడానికి దానిని జాగ్రత్తగా ఆచరించు—నీ పితరుల దేవుడైన యహ్వే నీతో చెప్పినట్లుగా.
  rationale: వాక్యాన్ని పూర్తి చేయడానికి ‘పాలు తేనె ప్రవహించే దేశంలో’ను ‘మీరు ఎంతో విస్తరించడానికి’తో అనుసంధానించాం. ఈ పఠనానికి మూలవాక్యంలోని పదక్రమం, సందర్భం రెండూ అనుకూలంగా ఉన్నాయి. యహ్వే చెప్పిన/వాగ్దానం చేసిన విషయానికి ‘దేశం’ను అనుసంధానించే ప్రత్యామ్నాయాన్ని పాదటీపులో యథాతథంగా భద్రపరిచాం. ముసాయిదాలో ఉన్న [a], [b] గుర్తులు వరుసగా ‘పితరులు’ మరియు ప్రత్యామ్నాయ వాక్యనిర్మాణం తర్వాత అలాగే ఉంచాలి.
