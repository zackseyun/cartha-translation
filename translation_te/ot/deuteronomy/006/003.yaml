id: DEU.6.3
reference: Deuteronomy 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֤ יִשְׂרָאֵל֙ וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וַ/אֲשֶׁ֥ר תִּרְבּ֖וּ/ן מְאֹ֑ד כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలూ, విను; నీకు మేలు కలగడానికి, పాలు తేనె ప్రవహించే దేశంలో మీరు ఎంతో విస్తరించడానికి దానిని జాగ్రత్తగా ఆచరించు—నీ పితరుల దేవుడైన యహ్వే నీతో చెప్పినట్లుగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: విను
  rationale: שׁמע అనే క్రియకు వినడం, శ్రద్ధగా ఆలకించడం, విధేయత చూపడం అనే భావాలు ఉండవచ్చు. వెంటనే వచ్చే ‘జాగ్రత్తగా ఆచరించు’ అనే మాట విధేయత భావాన్ని తెలియజేస్తుంది కాబట్టి, క్రియను స్వయంగా ‘విధేయత చూపు’ అని విస్తరించకుండా ‘విను’గా ఉంచాం.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: దాన్ని జాగ్రత్తగా ఆచరించు
  rationale: שׁמר + עשה నిర్మాణం కేవలం కాపాడుకోవడం కాక, శ్రద్ధతో పాటించి కార్యరూపంలో పెట్టడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న ఆజ్ఞను సూచిస్తూ ‘దాన్ని’ చేర్చాం.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: నీకు మేలు కలగడానికి
  rationale: ఇది ద్వితీయోపదేశకాండంలో సాధారణంగా కనిపించే శ్రేయస్సును సూచించే ప్రయోగం. ‘నీకు మేలు కలగడానికి’ అనేది దాని ప్రయోజనార్థక భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: మీరు ఎంతో విస్తరించడానికి
  rationale: רבה ఇక్కడ జనసంఖ్య విస్తారంగా పెరగడాన్ని సూచిస్తుంది. హెబ్రీలో ముందున్న ఏకవచనం నుంచి ఇక్కడ బహువచనానికి మార్పు ఉన్నందున తెలుగులోనూ ‘నీకు’ నుంచి ‘మీరు’కి మార్పును నిలిపాం.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్లుగా
  rationale: דבר యొక్క ప్రాథమిక ‘మాట్లాడు/చెప్పు’ భావాన్ని నిలిపాం; సందర్భంలో వాగ్దాన భావం ఉన్నప్పటికీ దాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించలేదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: నీ పితరుల దేవుడు
  rationale: אָבוֹת అనే పురుష బహువచన బంధుత్వ పదాన్ని ‘పితరులు’గా నిలిపాం; విస్తృతార్థమైన ‘పూర్వికులు’ను పాదటీపులో ఇచ్చాం.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశం
  rationale: సమృద్ధిని చిత్రించే స్థిరమైన ఒడంబడిక సంబంధిత వర్ణనను సహజమైన తెలుగు రూపంలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక దేవుని వ్యక్తిగత నామం ఉంది. అందువల్ల దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: אֱלֹהֵי אֲבֹתֶיךָ లోని బంధుత్వ పదం
  choice: నీ పితరుల దేవుడు
  alternative: నీ పూర్వికుల దేవుడు
  rationale: మూలంలోని లింగసూచక పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానికి సాధ్యమైన విస్తృతార్థాన్ని పాదటీపులో తెలిపాం.
- issue: చివరి భూవర్ణనకు వాక్యనిర్మాణ సంబంధం
  choice: విస్తరించడం జరిగే ప్రదేశంగా ‘పాలు తేనెలు ప్రవహించే దేశంలో’
  alternative: యహ్వే వాగ్దానం చేసిన విషయానికి వివరణగా ‘పాలు తేనెలు ప్రవహించే దేశాన్ని నీకు వాగ్దానం చేసినట్లుగా’
  rationale: హెబ్రీ వాక్యం సంక్షిప్తంగా ఉండి, ‘దేశం’ అనే పదబంధాన్ని ముందున్న విస్తరణతోనూ యహ్వే చెప్పిన మాటతోనూ అనుసంధానించవచ్చు. ప్రధాన పాఠ్యం స్థానార్థ సంబంధాన్ని ఉంచి, వాగ్దానార్థ పఠనాన్ని పాదటీపులో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఇశ్రాయేలూ’ అనే సంబోధనను, అలాగే హెబ్రీలోని ఏకవచనం నుంచి బహువచనానికి జరిగే మార్పును సాధ్యమైనంతవరకు నిలిపాం. చివరి వాక్యభాగంలోని మూలభాషా సంక్షిప్తత కొంత అసాధారణంగా అనిపించినా, దాని నిజమైన ద్వంద్వార్థాన్ని తొలగించకుండా పాదటీపుతో స్పష్టం చేశాం.
