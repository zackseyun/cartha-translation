id: DEU.6.6
reference: Deuteronomy 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָי֞וּ הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם עַל לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: te
  text: నేడు నేను నీకు ఆజ్ఞాపిస్తున్న ఈ మాటలు నీ హృదయం మీద ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ హృదయంలో.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘నీ హృదయం మీద’ అని ఉంది; ఈ నుడికారం ఈ మాటలను ఎల్లప్పుడూ తన అంతరంగంలో నిలుపుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ఉండాలి
  rationale: ముందటి ఆజ్ఞా సందర్భాన్ని అనుసరించి, సంయోజక వావ్‌తో కూడిన సంపూర్ణ క్రియ ఇక్కడ ఆదేశాత్మక భావాన్ని కలిగిస్తుంది; ఆధునిక తెలుగులో ‘ఉండాలి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: דְּבָרִים అనే పదానికి ఇక్కడ ‘మాటలు’ అనేది ప్రత్యక్షమైన అర్థం; ‘ఆజ్ఞలు’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే వివరణాత్మకంగా మారుతుంది.
- source_word: אֲשֶׁר
  choice: —స్తున్న
  rationale: హీబ్రూ సంబంధసూచకాన్ని తెలుగులో ‘నేను నీకు ఆజ్ఞాపిస్తున్న ఈ మాటలు’ అనే సహజమైన సంబంధ వాక్య నిర్మాణంతో వ్యక్తపరిచాం.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను అతిగా విస్తరించకుండా సాధారణ తెలుగు ‘నేను’తో నిలిపాం.
- source_word: מְצַוְּךָ
  choice: నీకు ఆజ్ఞాపిస్తున్న
  rationale: భాగధాతు రూపంలోని ప్రస్తుత ప్రసంగక్రియ భావాన్ని ‘ఆజ్ఞాపిస్తున్న’ స్పష్టంగా తెలియజేస్తుంది; ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీకు’గా వ్యక్తపరిచాం.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: మోషే ప్రసంగంలోని కాలసామీప్యాన్ని తెలిపే సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: עַל לְבָבֶךָ
  choice: నీ హృదయం మీద
  rationale: עַל యొక్క ‘మీద’ అనే రూపకాన్ని కాపాడుతూ, ఈ మాటలను అంతరంగంలో నిరంతరం నిలుపుకోవాలనే హీబ్రూ నుడికారాన్ని అనవసరంగా పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: לְבָב అనే మానవ అంతరంగ నుడికారం
  choice: హృదయం
  alternative: మనస్సు; అంతరంగం
  rationale: హీబ్రూ ‘హృదయం’ ఆలోచన, సంకల్పం, భావోద్వేగం అన్నింటినీ కలిగి ఉంటుంది. ‘మనస్సు’ అని పరిమితం చేయకుండా బైబిలు మానవశాస్త్ర రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నేడు,’ ‘ఆజ్ఞాపిస్తున్న,’ ‘హృదయం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని గంభీరతను నిలుపుతాయి. మూలపాఠంలోని ‘హృదయం మీద’ రూపకాన్ని ప్రధాన పాఠంలో ఉంచి, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
