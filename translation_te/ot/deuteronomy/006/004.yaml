  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: te
  text: 'ఇశ్రాయేలూ, విను[a]: యెహోవా మన దేవుడు; యెహోవా ఒక్కడే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా మన దేవుడు; యెహోవా మాత్రమే”; మరో విధంగా, “మన దేవుడైన యెహోవా ఒక్కడే.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; దాని వాక్యనిర్మాణాన్ని ఒకటికంటే ఎక్కువ సమంజసమైన విధాలుగా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: విను
  rationale: ఇది సమష్టిగా భావించిన ఇశ్రాయేలును ఉద్దేశించిన ఏకవచన ఆజ్ఞ. ‘విను’ అనేది శబ్దాన్ని వినడమే కాక శ్రద్ధగా ఆలకించి విధేయత చూపాలనే నిబంధనాత్మక పిలుపును కూడా సహజంగా సూచిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ
  rationale: నిబంధన ప్రజల పేరును ప్రత్యక్ష సంబోధన రూపంలో సహజమైన తెలుగులో ఇచ్చింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: రూపపరంగా బహువచన లక్షణం ఉన్నప్పటికీ, ఈ నిబంధన సందర్భంలో ఇది ఇశ్రాయేలు దేవునికి వాడిన ఏకవచన బిరుదు. మొదటి పురుష బహువచన ప్రత్యయాన్ని ‘మన’గా సహజంగా అనువదించింది.
- source_word: אֶחָד
  choice: ఏకుడు
  rationale: ప్రాథమికమైన ‘ఒకడు/ఒకటి’ అనే భావాన్ని నిలుపుతూ, ‘మాత్రమే’ అనే ప్రత్యేకతార్థాన్ని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించకుండా ఉండేందుకు ‘ఏకుడు’ ఎంచుకుంది.
theological_decisions:
- issue: షెమా చివరి భాగంలోని వాక్యనిర్మాణం మరియు భావం
  choice: యెహోవా మన దేవుడు; యెహోవా ఏకుడు
  alternative: యెహోవాయే మన దేవుడు; యెహోవా మాత్రమే / మన దేవుడైన యెహోవా ఏకైక యెహోవా
  rationale: హీబ్రూలో స్పష్టమైన సంధాన క్రియ లేని సంక్షిప్త నిర్మాణం కారణంగా ఒకటికంటే ఎక్కువ వాక్యాన్వయాలు సాధ్యమవుతాయి. ప్రధాన పాఠ్యం אֶחָד యొక్క ప్రాథమిక ‘ఒకటి’ భావాన్ని కాపాడి, ప్రత్యేకతను సూచించే ‘మాత్రమే’ అనే అర్థాన్ని మౌనంగా నిర్ణయించదు; ఇతర ప్రాచీనంగా సమర్థనీయమైన పఠనాలను పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంబోధనను ఉపయోగించింది. దైవనామానికి ‘యెహోవా’ను నిలిపింది. ‘ఏకుడు’ కొంత గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే పదం; ఇది మూలంలోని సంక్షిప్తతను, ఉద్దేశపూర్వక వాక్యనిర్మాణ సందిగ్ధతను కాపాడుతుంది.
