source:
  edition: WLC
  text: שָׁמ֣וֹר תִּשְׁמְר֔וּ/ן אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/עֵדֹתָ֥י/ו וְ/חֻקָּ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: te
  text: మీ దేవుడైన యహ్వే మీకు ఆజ్ఞాపించిన ఆజ్ఞలను, ఆయన సాక్ష్యాలను[a], నియమాలను మీరు ఎంతో జాగ్రత్తగా పాటించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సాక్ష్యాలు’ అనే పదాన్ని ‘నిబంధన నిబంధనలు’ లేదా ‘శాసనాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎంతో జాగ్రత్తగా పాటించాలి’ అనే భావానికి మూల హీబ్రూలో ఒకే క్రియకు సంబంధించిన రెండు రూపాలను కలిపి వాడి ప్రత్యేక నొక్కింపు ఇచ్చారు; దీనిని ‘తప్పక పాటించాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: ఎంతో జాగ్రత్తగా పాటించాలి
  rationale: అనంతక్రియారూపంతో కూడిన క్రియారూపం ఆజ్ఞను బలంగా నొక్కిచెబుతుంది. ఆధునిక తెలుగులో ‘ఎంతో జాగ్రత్తగా పాటించాలి’ అనేది ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలు
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధన సంబంధమైన ఆదేశాలను సూచించే సహజమైన, గౌరవప్రదమైన పదం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యహ్వే’గా ఇచ్చాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: బహువచన సంబోధనను, ద్వితీయోపదేశకాండానికి ప్రత్యేకమైన నిబంధన సూత్రప్రయోగాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עֵדֹתָיו
  choice: ఆయన సాక్ష్యశాసనాలు
  rationale: ‘సాక్ష్యాలు’ అనే మూలభావాన్ని, నిబంధనలోని విధుల న్యాయపరమైన స్వభావాన్ని రెండింటినీ తెలియజేస్తూ, చుట్టుపక్కల ఉన్న ఇతర న్యాయపదాల నుంచి దీనిని వేరుచేస్తుంది.
- source_word: חֻקָּיו
  choice: ఆయన నియమాలు
  rationale: నిర్దేశించబడిన స్థిర విధులను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది; ‘ఆజ్ఞలు’ అనే ముందరి పదం నుంచి తగినంత భేదాన్ని కూడా కాపాడుతుంది.
- source_word: אֲשֶׁר צִוָּךְ
  choice: ఆయన మీకు ఆజ్ఞాపించిన వీటన్నిటినీ
  rationale: సాపేక్ష వాక్యం ముందున్న మూడు న్యాయపదాలనూ సమష్టిగా విశేషిస్తుందనే సహజ పఠనాన్ని తెలుగులో స్పష్టం చేస్తుంది; ‘మీకు’ అనే రూపం లింగాన్ని పేర్కొనకుండా సంబోధనను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు రూపాన్ని ఉపయోగించాం.
- issue: עֵדֹתָיו అనే నిబంధనపదం
  choice: సాక్ష్యశాసనాలు
  alternative: శాసనాలు / నిబంధన విధులు
  rationale: ఈ పదంలోని ‘సాక్ష్యం’ భావాన్ని పూర్తిగా తొలగించకుండా, ఇది న్యాయపరమైన నిబంధన విధులను సూచిస్తుందనే భావాన్నీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే నిబంధన-న్యాయ సందర్భానికి తగిన గౌరవప్రదమైన శైలిని నిలిపాం. మూడు హీబ్రూ న్యాయపదాల మధ్య ఉన్న భేదాన్ని సాధ్యమైనంతవరకు కాపాడాం.
