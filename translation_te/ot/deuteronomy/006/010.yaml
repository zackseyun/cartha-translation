id: DEU.6.10
reference: Deuteronomy 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּ֥י יְבִיאֲ/ךָ֣ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֜רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ֣/תֶת לָ֑/ךְ עָרִ֛ים גְּדֹלֹ֥ת וְ/טֹבֹ֖ת אֲשֶׁ֥ר לֹא בָנִֽיתָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: te
  text: నీ దేవుడైన యెహ్వే, నీకు ఇవ్వాలని నీ పితరులైన[a] అబ్రాహాము, ఇస్సాకు, యాకోబులకు ప్రమాణం చేసిన, నీవు కట్టని గొప్పవీ మంచివీ అయిన పట్టణాలు గల దేశంలోకి నిన్ను తీసుకువచ్చినప్పుడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పూర్వికులైన.’ హీబ్రూ మూలంలో ‘నీ పితరులు’ అని ఉంది; ఈ సందర్భంలో అబ్రాహాము, ఇస్సాకు, యాకోబుల పేర్లు ప్రత్యేకంగా చెప్పబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: తీసుకువచ్చినప్పుడు
  rationale: ఈ నిర్మాణం భవిష్యత్తులో సంభవించే పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో సహజమైన కాలసూచక ఉపవాక్యంతో దాని భావాన్ని వ్యక్తం చేశాం.
- source_word: יְבִיאֲךָ
  choice: నిన్ను తీసుకువచ్చినప్పుడు
  rationale: בוא ధాతువు హిఫీల్ రూపంలో ‘లోపలికి తీసుకురావడం’ అనే కారణార్థక భావం ఉంది; ‘దేశంలోకి’తో కలిసి ఈ భావం స్పష్టంగా నిలుస్తుంది.
- source_word: יְהוָה
  choice: యెహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన స్వామ్యార్థాన్ని సహజమైన తెలుగు నామవాచక నిర్మాణంలో నిలిపాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ వాగ్దానంగా ఇవ్వబడే నిర్దిష్ట భూభాగం ఉద్దేశించబడింది. ‘దేశం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భూభాగ భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: ప్రమాణం చేసిన
  rationale: నిఫాల్ రూపంలోని ప్రమాణం చేయడం అనే స్పష్టమైన శపథభాషను పరిరక్షించాం.
- source_word: לַאֲבֹתֶיךָ
  choice: నీ పితరులైన
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ పదాన్ని, వెంటనే పేర్లు చెప్పబడుతున్న పితృపురుషుల ప్రత్యేక సూచనను నిలిపాం.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాము, ఇస్సాకు, యాకోబులకు
  rationale: పేర్లను ప్రామాణిక తెలుగు రూపాల్లో ఇచ్చాం; తెలుగులో విభక్తిని చివరి సభ్యునికి జోడించడం సహజంగా జాబితా మొత్తానికి వర్తిస్తుంది.
- source_word: לָתֶת לָךְ
  choice: నీకు ఇస్తానని
  rationale: ఇవ్వడం అనే ఉద్దేశాన్ని తెలుగులో ప్రమాణం చేయడమనే క్రియతో సహజంగా అనుసంధానించాం.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: గొప్పవీ మంచివీ అయిన పట్టణాలు
  rationale: גדלות లోని పరిమాణం/గొప్పతనం, טובות లోని మంచితనం/ఆకర్షణీయతను అతివ్యాఖ్యానం చేయకుండా దగ్గరగా నిలిపాం.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: నీవు కట్టని
  rationale: రెండవ పురుష ఏకవచనంలోని నిరాకరణ సంబంధ ఉపవాక్యాన్ని నేరుగా, సహజంగా అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత నామాన్ని నేరుగా వాడుతుంది. దాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో సూచించాం.
- issue: לַאֲבֹתֶיךָ లోని లింగసూచక బంధుత్వ పదం
  choice: నీ పితరులైన
  alternative: నీ పూర్వికులైన
  rationale: మూలంలోని పురుష బహువచనాన్ని, సందర్భంలో ప్రత్యేకంగా అబ్రాహాము, ఇస్సాకు, యాకోబులను సూచించే పితృపురుష భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున ముగింపులో కొనసాగింపు సూచించే విరామచిహ్నం ఉంచబడింది; పట్టణాలు దేశానికి సంబంధించిన వివరణ అని స్పష్టంచేయడానికి పునరుక్త ‘దేశంలోకి’ నిర్మాణాన్ని డాష్‌ల మధ్య ఉంచాం.
