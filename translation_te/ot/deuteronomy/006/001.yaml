- from: ఇదే[a] ఆ ఆజ్ఞ—అంటే శాసనాలు, న్యాయవిధులు—మీ దేవుడైన యహ్వే[b] మీకు బోధించమని ఆజ్ఞాపించినది. మీరు స్వాధీనం చేసుకోవడానికి[c] దాటి వెళ్తున్న దేశంలో వాటిని ఆచరించాలి.
  to: 'ఇదే[a] ఆజ్ఞ—శాసనాలు, న్యాయవిధులు—మీ దేవుడైన యహ్వే[b] మీకు బోధించమని ఆజ్ఞాపించినది: మీరు స్వాధీనం చేసుకోవడానికి[c] దాటి వెళ్తున్న దేశంలో వాటిని ఆచరించడానికి.'
  rationale: 'సవరణ మూల వాక్యంలోని ఉద్దేశార్థక క్రియల క్రమాన్ని తెలుగు వాక్యంలో నిలిపింది: యహ్వే బోధించమని ఆజ్ఞాపించాడు; ప్రజలు తాము స్వాధీనం చేసుకోబోయే దేశంలో వాటిని ఆచరించాలి అనే విధిభావాన్ని ప్రత్యేకంగా చేర్చకుండా, ‘ఆచరించడానికి’ అని మూల నిర్మాణానికి దగ్గరగా ఇచ్చింది. అనవసరమైన ‘ఆ’ పునరుక్తి, ‘అంటే’ వివరణను తొలగించాం. పాదసూచికల గుర్తులు వాటి సంబంధిత పదాల వద్దనే ఉన్నాయి.'
