source:
  edition: WLC
  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: te
  text: 'ఇదే[a] ఆజ్ఞ—శాసనాలు, న్యాయవిధులు—మీ దేవుడైన యహ్వే[b] మీకు బోధించమని ఆజ్ఞాపించినది: మీరు స్వాధీనం చేసుకోవడానికి[c] దాటి వెళ్తున్న దేశంలో వాటిని ఆచరించడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం అనుసంధానక అవ్యయంతో మొదలవుతుంది; దీన్ని “మరియు ఇదే” అని కూడా అనువదించవచ్చు.
    reason: discourse_and_lexical_alternative
  - marker: b
    text: “యహ్వే” అనేది హీబ్రూ దైవనామమైన YHWHకు లిప్యంతరీకరణ; దాని ప్రాచీన ఉచ్చారణ ఖచ్చితంగా తెలియదు. కొన్ని అనువాదాలు దీన్ని “ప్రభువు” అని ఇస్తాయి.
    reason: divine_name
  - marker: c
    text: లేదా “వారసత్వంగా పొందడానికి”; ఇక్కడి హీబ్రూ క్రియకు స్వాధీనం చేసుకోవడం, వారసత్వంగా పొందడం అనే భావాలు రెండూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ఇదే
  rationale: ప్రారంభంలోని וְ పూర్వ సందర్భంతో సంబంధాన్ని చూపుతుంది; తెలుగులో సహజమైన విభాగారంభం కోసం ‘ఇదే’ అని ఇచ్చి, ‘మరియు ఇదే’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַמִּצְוָה
  choice: ఆ ఆజ్ఞ
  rationale: ఏకవచనాన్ని అలాగే నిలిపి, తరువాత వచ్చే బహువచన న్యాయవర్గాలకు సమగ్ర శీర్షికగా వినిపించేలా చేశాం.
- source_word: הַחֻקִּים
  choice: శాసనాలు
  rationale: స్థిరంగా విధించబడిన చట్టనియమాలు అనే న్యాయపరమైన భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: న్యాయనిర్ణయాలు లేదా చట్టబద్ధమైన విధులు అనే భావాన్ని ‘శాసనాలు’ నుండి కొంత భిన్నంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: మీకు బోధించమని
  rationale: ఎవరికి బోధించాలో స్పష్టంగా ఉంచుతూ, ఆజ్ఞతో అనుసంధానమైన హీబ్రూ ఉద్దేశార్థక క్రియారూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: వాటిని ఆచరించాలి
  rationale: అక్షరార్థంగా ‘చేయడం’; చట్టాలు, విధుల సందర్భంలో ‘ఆచరించడం’ సహజంగా ఉండి, సూచిత బహువచన కర్మను ‘వాటిని’ అని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: దాటి వెళ్తున్న దేశంలో
  rationale: ప్రజలు గమ్యదేశంలోకి దాటుతున్న చలనాన్ని నిలుపుతుంది; కేవలం ‘ప్రవేశిస్తున్న’ అని చెప్పి దాటడం అనే మూలభావాన్ని తొలగించలేదు.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ద్వితీయోపదేశకాండలో ירשׁ భూమిని పొందడం, ఆక్రమించి ఆధీనంలోకి తెచ్చుకోవడం అనే భావాలను కలిగి ఉంది; ఈ ఎంపిక క్రియాశీల స్వాధీన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం బిరుదును కాక నాలుగు అక్షరాల దైవనామాన్ని ఉపయోగిస్తుంది. అందువల్ల పేరును పేరుగానే లిప్యంతరీకరించాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న పరిమితిని పాదసూచికలో తెలిపాం.
- issue: ఏకవచన ‘ఆజ్ఞ’కు బహువచన ‘శాసనాలు, న్యాయవిధులు’కు ఉన్న సంబంధం
  choice: ఏకవచనాన్ని సమగ్ర శీర్షికగా ఉంచి, బహువచన పదాలను వివరణగా నిలపడం
  alternative: అన్నింటినీ బహువచనంగా ‘ఆజ్ఞలు, శాసనాలు, న్యాయవిధులు’ అని సమతలీకరించడం
  rationale: హీబ్రూలోని సంఖ్యాభేదాన్ని నిలిపి, ఒక సమగ్ర ఆజ్ఞ తరువాత దాని న్యాయవర్గాలు విప్పి చెప్పబడుతున్న నిర్మాణాన్ని చెరపలేదు.
- issue: לְרִשְׁתָּהּ యొక్క స్వాధీనం/వారసత్వ భావం
  choice: స్వాధీనం చేసుకోవడానికి
  alternative: దాన్ని వారసత్వంగా పొందడానికి
  rationale: సందర్భంలో భూమిలోకి దాటి వెళ్లి దానిని ఆధీనంలోకి తీసుకోవడం ప్రధానంగా ఉంది; అయినా ‘వారసత్వంగా పొందడం’ అనే నిజమైన భావసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-నిబంధన శైలిని ఉపయోగించాం. ‘శాసనాలు’, ‘న్యాయవిధులు’ పదాలు పరస్పర భేదాన్ని సాధ్యమైనంత వరకు నిలుపుతాయి; వాక్యాన్ని సాధారణ పాఠకుడికి సులభంగా ఉండేలా రెండు వాక్యాలుగా విభజించాం.
