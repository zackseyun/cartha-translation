  source_fidelity: ముసాయిదా మూలంలోని ఏకవచన ‘ఆజ్ఞ’ను, ఆ తర్వాతి బహువచన న్యాయవర్గాలను, యహ్వే నామాన్ని, భూమిలోకి దాటి వెళ్లి దానిని స్వాధీనం చేసుకోవాలనే భావాన్ని మొత్తంగా నిలుపుతుంది. అయితే ‘వాటిని ఆచరించాలి’ మూలంలోని ఉద్దేశార్థక అనంతక్రియను విధి/ఆజ్ఞ రూపంగా మార్చుతోంది; దానిని ఉద్దేశాన్ని చూపే రూపంలో ఉంచడం మరింత సన్నిహితమైనది.
