id: DEU.6.24
reference: Deuteronomy 6:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַוֵּ֣/נוּ יְהוָ֗ה לַ/עֲשׂוֹת֙ אֶת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/ט֥וֹב לָ֨/נוּ֙ כָּל הַ/יָּמִ֔ים לְ/חַיֹּתֵ֖/נוּ כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: te
  text: మన దేవుడైన యెహోవాకు భయపడి, ఎల్లకాలం మనకు మేలు కలిగేలా, నేటిలా మనలను సజీవంగా ఉంచడానికి ఈ కట్టడాలన్నిటినీ పాటించాలని యెహోవా మనకు ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־הַחֻקִּים הָאֵלֶּה
  choice: ఈ కట్టడాలన్నిటినీ
  rationale: חֻקִּים అనేది నిర్దేశించబడిన శాసనాలు లేదా కట్టడాలను సూచిస్తుంది; ‘కట్టడాలు’ న్యాయపరమైన భావాన్ని నిలుపుతూ సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే పదం.
- source_word: לְיִרְאָה
  choice: భయపడి
  rationale: దేవునిపట్ల భయం, భక్తిపూర్వక గౌరవం రెండింటినీ కలిగి ఉండగల మూలపద విస్తృతిని ‘భయపడడం’ నేరుగా నిలుపుతుంది.
- source_word: לְטוֹב לָנוּ כָּל־הַיָּמִים
  choice: ఎల్లకాలం మనకు మేలు కలిగేలా
  rationale: ‘మన మేలుకోసం, అన్ని దినాల్లో’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కాలవ్యాప్తిని ‘ఎల్లకాలం’ నిలుపుతుంది.
- source_word: לְחַיֹּתֵנוּ
  choice: మనలను సజీవంగా ఉంచడానికి
  rationale: పియేల్ రూపంలోని causative భావం—‘మనకు జీవం కలిగించడం/మనలను బ్రతికించడం’—స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: నేటిలా
  rationale: ప్రస్తుత దినంలోని జీవించి ఉన్న స్థితిని పోలికగా సూచించే హీబ్రూ ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన ‘యెహోవా’గా స్పష్టంగా నిలుపుతుంది.
- issue: ‘భయపడడం’ యొక్క అర్థ పరిధి
  choice: భయపడి
  alternative: భక్తితో గౌరవించి
  rationale: మూలంలోని ירא పదాన్ని కేవలం గౌరవంగా పరిమితం చేయకుండా, దాని నిజమైన భావ ఉద్వేగాన్ని మరియు ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
- issue: ఆజ్ఞల ఉద్దేశాల సంబంధం
  choice: మేలు కలగడం మరియు సజీవంగా ఉంచబడడం రెండింటినీ యెహోవా ఆజ్ఞకు ఉద్దేశాలుగా చూపడం
  alternative: ఆజ్ఞపాలనే జీవానికి సంపాదక కారణమని స్పష్టీకరించడం
  rationale: లְ ఉపసర్గల ఉద్దేశార్థ సంబంధాన్ని నిలుపుతూ, మూలం చెప్పనంత కారణ-ఫలిత సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ఉద్దేశార్థ శ్రేణిని సహజ తెలుగు క్రమంలో అమర్చాం. పాదటిప్పణులు అవసరం లేదు.
