source:
  edition: WLC
  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వేకు నీవు భయపడేలా, నేను నీకు ఆజ్ఞాపిస్తున్న ఆయన కట్టడాలన్నిటినీ, ఆజ్ఞలన్నిటినీ నీవు, నీ కుమారుడు, నీ కుమారుని కుమారుడు మీ జీవితకాలమంతా పాటించడానికి, తద్వారా నీ రోజులు దీర్ఘమవడానికి ఇలా చెప్పబడింది.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ దేవుడైన యాహ్వేను భక్తిగౌరవంతో గౌరవించేలా.’ హీబ్రూ క్రియలో భయంతో పాటు భక్తి, గౌరవం, విస్మయం అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘నీవు, నీ కుమారుడు, నీ కుమారుని కుమారుడు.’
    reason: lexical_clarification
  - marker: c
    text: లేదా, ‘నీ రోజులు దీర్ఘంగా ఉండడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: నీవు భయపడి
  rationale: לְמַעַן తెలిపే ఉద్దేశాన్ని తెలుగు వాక్య నిర్మాణంలో చివరి ‘తద్వారా’ ఫలిత వాక్యంతో సహజంగా వ్యక్తం చేస్తూ, ירא లోని భయం–భక్తిగౌరవం ఉద్వేగాన్ని ‘భయపడి’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוה ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని నేరుగా, సహజ తెలుగులో నిలుపుతుంది.
- source_word: לִשְׁמֹר
  choice: పాటించాలి
  rationale: దైవ నియమాలు, ఆజ్ఞల సందర్భంలో שמר అంటే కేవలం కాపాడటం కాక వాటిని జాగ్రత్తగా అనుసరించడం; ‘పాటించాలి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: חֻקֹּתָיו
  choice: ఆయన నియమాలు
  rationale: నిర్దేశిత శాసనాలను సూచించే חקה ను సాధారణ పాఠకులకు అర్థమయ్యే ‘నియమాలు’గా అనువదించి, מצוה తో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలు
  rationale: מצוה యొక్క ఆదేశాత్మక భావాన్ని ‘ఆజ్ఞలు’ నేరుగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: నేను నీకు ఆజ్ఞాపిస్తున్న
  rationale: పాల్గొనే క్రియారూపంలోని ప్రస్తుత ప్రసంగకాల భావాన్ని ‘ఆజ్ఞాపిస్తున్న’ నిలుపుతుంది; మూలంలో లేని ‘నేడు’ను చేర్చదు.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: నీవూ, నీ కుమారుడూ, నీ కుమారుని కుమారుడూ
  rationale: మూలంలోని మూడు తరాలను, ముఖ్యంగా అక్షరార్థమైన ‘నీ కుమారుని కుమారుడు’ను సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: నీ జీవితకాలమంతా
  rationale: ‘నీ జీవితంలోని అన్ని రోజులు’ అనే భావాన్ని సహజమైన సంక్షిప్త తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: తద్వారా నీ రోజులు దీర్ఘమవుతాయి
  rationale: రెండవ ఉద్దేశం/ఫలితాన్ని ‘తద్వారా’తో చూపిస్తూ, ‘రోజులు దీర్ఘమగుట’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా లిప్యంతరీకరించాలి; తెలుగులో స్థిరపడ్డ ‘యెహోవా’ రూపం సాధారణ పాఠకులకు సులభంగా గుర్తించబడుతుంది.
- issue: దేవునికి ‘భయపడటం’ యొక్క అర్థ పరిధి
  choice: భయపడి
  alternative: భక్తితో గౌరవించి; భయభక్తులు కలిగి
  rationale: ירא లో భయం, విస్మయం, భక్తిగౌరవం అన్నీ ఉండగలవు. ప్రధాన పాఠంలో ‘భయపడి’ ఉంచడం ద్వారా వేదాంతపరమైన ఉద్వేగాన్ని మృదువుగా పరిష్కరించకుండా నిలిపి, పాదసూచికలో విస్తృత అర్థాన్ని తెలియజేస్తుంది.
- issue: తరాల సూచన
  choice: నీ కుమారుని కుమారుడు
  alternative: నీ మనవడు; నీ సంతానం
  rationale: మూలం పురుష ఏకవచన రూపాల్లో మూడు తరాలను స్పష్టంగా పేర్కొంటుంది. ‘సంతానం’ అని విస్తరించకుండా, అక్షరార్థ నిర్మాణాన్ని పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఆజ్ఞాసంబంధ పదజాలంలో ‘నియమాలు/ఆజ్ఞలు’ అనే భేదాన్ని ఉంచి, హీబ్రూ వాక్యంలోని ఉద్దేశం–ఫలిత సంబంధాన్ని సహజ తెలుగు క్రమంలో వ్యక్తం చేసింది.
