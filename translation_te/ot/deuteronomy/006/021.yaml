id: DEU.6.21
reference: Deuteronomy 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/בִנְ/ךָ֔ עֲבָדִ֛ים הָיִ֥ינוּ לְ/פַרְעֹ֖ה בְּ/מִצְרָ֑יִם וַ/יּוֹצִיאֵ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: te
  text: 'అప్పుడు నీవు నీ కుమారునితో[a] ఇలా చెప్పాలి: “మేము ఐగుప్తులో ఫరోకు బానిసలమై ఉన్నాం. యాహ్వే బలమైన చేతితో[b] మమ్మల్ని ఐగుప్తు నుండి బయటకు తీసుకొచ్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు నీవు నీ కుమారునితో చెప్పాలి.” హీబ్రూ సంధిపదాన్ని సాధారణంగా “మరియు” అని కూడా అనువదించవచ్చు; ఇక్కడ “అప్పుడు” ముందటి వచనంలోని ప్రశ్నకు సమాధానం చెప్పే క్రమాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “బలమైన చేతితో” అనేది యాహ్వే తన గొప్ప శక్తితో చేసిన విమోచన కార్యాన్ని సూచించే హీబ్రూ రూపకం; “శక్తిమంతమైన చేతితో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: అప్పుడు నీవు ... చెప్పాలి
  rationale: వావ్ సంధి ముందటి వచనంలోని ప్రశ్నకు అనుసరించే బోధనా క్రమాన్ని కొనసాగిస్తుంది. ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; ‘చెప్పాలి’ ఆదేశ భావాన్ని నిలుపుతుంది.
- source_word: לְבִנְךָ
  choice: నీ కుమారునితో
  rationale: హీబ్రూ పదబంధం పురుష ఏకవచనంగా ‘నీ కుమారునికి’ అని స్పష్టంగా ఉంది. తెలుగులో మాట్లాడే వ్యక్తిని సూచించడానికి ‘కుమారునితో చెప్పాలి’ సహజంగా ఉంటుంది.
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: మేము ... ఫరోకు బానిసలుగా ఉన్నాము
  rationale: నిర్గమ సందర్భంలో עֲבָדִים అణచివేతతో కూడిన బానిసత్వాన్ని సూచిస్తుంది; అందువల్ల మృదువైన ‘సేవకులు’ కంటే ‘బానిసలు’ మూలంలోని బలాన్ని మెరుగుగా తెలియజేస్తుంది. לְפַרְעֹה ఫరోకు లోబడిన స్థితిని సూచిస్తుంది.
- source_word: בְּמִצְרָיִם
  choice: ఐగుప్తులో
  rationale: స్థలాన్ని సూచించే בְకు నేరమైన, ప్రాచుర్యంలో ఉన్న తెలుగు రూపం.
- source_word: וַיּוֹצִיאֵנוּ
  choice: మమ్మల్ని ... బయటకు తీసుకొచ్చాడు
  rationale: יצא హిఫీల్ రూపం ‘బయటకు వచ్చేలా చేయడం/బయటకు తీసుకురావడం’ అనే కారణార్థక భావాన్ని కలిగి ఉంది. ‘బయటకు తీసుకొచ్చాడు’ నిర్గమ కార్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది; ‘నుండి’ తెలుగులో దానికి నేరమైన సమానార్థకం.
- source_word: בְּיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ, దేవుని శక్తిమంతమైన విమోచన కార్యాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ సాధ్యమైన ప్రత్యామ్నాయ ఉచ్చారణ.
- issue: עֲבָדִים సూచించే బంధిత స్థితి
  choice: బానిసలు
  alternative: సేవకులు
  rationale: ఐగుప్తులో ఇశ్రాయేలీయుల అణచివేత మరియు బలవంతపు శ్రమను దృష్టిలో ఉంచితే ‘బానిసలు’ చారిత్రక, ధార్మిక తీవ్రతను నిలుపుతుంది; ‘సేవకులు’ ఆ తీవ్రతను తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ప్రత్యక్ష సంభాషణ, బానిసత్వపు తీవ్రత, ‘చేతి’ రూపకం నిలుపబడ్డాయి. ‘అయితే’ హీబ్రూ וַ యొక్క ప్రతివ్యతిరేక సందర్భబలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
