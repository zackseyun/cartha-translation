id: DEU.6.23
reference: Deuteronomy 6:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: te
  text: మన పితరులకు తాను ప్రమాణం చేసిన దేశాన్ని మనకు ఇవ్వడానికి, మనలను లోపలికి తీసుకువచ్చేందుకే ఆయన అక్కడి నుండి మనలను బయటికి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא מִשָּׁם
  choice: ఆయన అక్కడి నుండి మనలను బయటికి తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపంలోని יצא కు ‘బయటికి తీసుకురావడం’ అనే భావం ఉంది. వాక్యారంభంలోని ప్రత్యక్ష కర్మను సహజమైన తెలుగు వాక్యక్రమంలో అమర్చుతూ, నిర్గమన భావాన్ని నిలిపింది.
- source_word: לְמַעַן
  choice: …డానికే అలా చేశాడు
  rationale: ఉద్దేశాన్ని సూచించే ఈ పదబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలిపి, బయటికి తీసుకురావడం తరువాతి కార్యానికి ఉద్దేశించబడిందనే సంబంధాన్ని కాపాడింది.
- source_word: הָבִיא אֹתָנוּ
  choice: మనలను లోపలికి తీసుకువచ్చి
  rationale: בוא హిఫిల్ రూపం ‘ప్రవేశింపజేయడం/లోపలికి తీసుకురావడం’ అని అర్థం. ముందు ఉన్న ‘బయటికి తీసుకొచ్చాడు’తో మూలంలోని వ్యతిరేక గమనాన్ని నిలిపింది.
- source_word: לָתֶת לָנוּ אֶת־הָאָרֶץ
  choice: దేశాన్ని మనకు ఇవ్వడానికి
  rationale: נתן యొక్క సరళమైన ‘ఇవ్వడం’ భావాన్ని, הָאָרֶץ యొక్క నిబంధనాపరమైన నిర్దిష్ట భూదేశ భావాన్ని సహజమైన తెలుగులో అందించింది.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: తాను ప్రమాణం చేసిన
  rationale: שׁבע నిఫల్ రూపంలోని ప్రమాణబద్ధమైన వాగ్దాన భావాన్ని కేవలం ‘వాగ్దానం’ అని సడలించకుండా నిలిపింది.
- source_word: לַאֲבֹתֵינוּ
  choice: మన పితరులతో
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘మన తండ్రులు/పితరులు’ అని సూచిస్తుంది. ఈ నిబంధన సందర్భంలో ‘పితరులు’ గౌరవప్రదంగా, సహజంగా ఉండి పూర్వపితామహుల అనుసంధానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: לַאֲבֹתֵינוּ లో లింగసూచక నిబంధనాపరమైన సంబోధన
  choice: మన పితరులతో
  alternative: మన పూర్వీకులతో
  rationale: మూలపదం పురుష బహువచనంలో ఉండి ఇశ్రాయేలు పితరులను సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘పితరులు’ను ఉంచి, విస్తృతమైన సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: נִשְׁבַּע లో నిబంధన ప్రమాణ భాష
  choice: ప్రమాణం చేసిన
  alternative: వాగ్దానం చేసిన
  rationale: దేశాన్ని ఇవ్వడం దేవుని సాధారణ వాగ్దానంపైనే కాక, ఆయన చేసిన ప్రమాణంపై ఆధారపడిందనే మూలంలోని బలాన్ని ఇది కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘బయటికి—లోపలికి’ అనే మూలంలోని గమన వ్యత్యాసాన్ని నిలిపి, ఉద్దేశ సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో స్పష్టం చేసింది.
