  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: te
  text: రాబోయే కాలంలో[a] నీ కుమారుడు నిన్ను, ‘మన దేవుడైన యాహ్వే మీకు ఆజ్ఞాపించిన సాక్ష్యాలు, శాసనాలు, న్యాయవిధులు ఏమిటి?’ అని అడిగినప్పుడు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘రేపు’; ఇక్కడ అది భవిష్యత్తులో రాబోయే కాలాన్ని సూచించే నుడికార ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మన దేవుడైన యాహ్వే మీకు ఆజ్ఞాపించిన సాక్ష్యాలు, శాసనాలు, న్యాయవిధుల అర్థం ఏమిటి?’ సందర్భం ఈ భావాన్ని సూచించవచ్చు; అయితే హీబ్రూ వాక్యం నేరుగా ‘ఏమిటి?’ అని అడుగుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: అడిగినప్పుడు
  rationale: న్యాయబోధ సందర్భంలో ఎదురవుతుందని ఆశించబడుతున్న భవిష్యత్ పరిస్థితిని ఇది పరిచయం చేస్తుంది; షరతార్థకమైన ‘అడిగితే’ కంటే ‘అడిగినప్పుడు’ తగినది.
- source_word: יִשְׁאָלְךָ
  choice: నిన్ను ... అడిగినప్పుడు
  rationale: שאל యొక్క సాధారణ అర్థమైన ‘అడుగు’ను సహజమైన ఆధునిక తెలుగులో, ద్వితీయ పురుష ఏకవచన కర్మను నిలుపుతూ అందిస్తుంది.
- source_word: בִנְךָ
  choice: నీ కుమారుడు
  rationale: హీబ్రూ పదం స్పష్టంగా పుంలింగ ఏకవచనం; అందువల్ల లింగనిరపేక్షంగా మార్చలేదు.
- source_word: מָחָר
  choice: రాబోయే కాలంలో
  rationale: అక్షరార్థంగా ‘రేపు’; ఇక్కడ భవిష్యత్ కాలాన్ని సాధారణంగా సూచించే నుడికార ప్రయోగం.
- source_word: לֵאמֹר
  choice: అని
  rationale: కుమారుని ప్రశ్నలోని మాటలను పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజ తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: מָה
  choice: ఏమిటి
  rationale: మూలంలోని ప్రత్యక్ష ‘ఏమిటి?’ అనే ప్రశ్నను నిలుపుతుంది; ‘అర్థం ఏమిటి?’ అని స్పష్టీకరించడం సాధ్యమైన భావమే అయినా మూలంలో ‘అర్థం’ అనే పదం లేదు.
- source_word: הָעֵדֹת
  choice: సాక్ష్యాలు
  rationale: ఒడంబడికకు సాక్ష్యంగా నిలిచే ఆజ్ఞల భావాన్ని కాపాడుతూ, తరువాతి రెండు న్యాయపదాల నుండి దీనిని వేరుగా ఉంచుతుంది.
- source_word: הַחֻקִּים
  choice: కట్టడలు
  rationale: నిర్ణయించి స్థాపించిన శాసనాల భావాన్ని తెలుపుతూ, త్రయంలోని ప్రత్యేక న్యాయపదంగా నిలుపుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: తీర్పులు, న్యాయనియమాలు అనే משפטים పదంలోని న్యాయపరమైన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా ప్రాచుర్యం పొందిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మొదటి పురుష బహువచన సంబంధాన్ని సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: צִוָּה ... אֶתְכֶם
  choice: మీకు ఆజ్ఞాపించిన
  rationale: క్రియతో ఉన్న ద్వితీయ పురుష బహువచన కర్మను ఏకవచన ‘నీకు’గా మార్చకుండా ‘మీకు’గా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది; కాబట్టి ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ‘యాహ్వే’ మూల ఉచ్చారణను మరింత ప్రత్యక్షంగా సూచించే ప్రత్యామ్నాయం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన దైవనామ రూపం.
- issue: בִנְךָ లోని లింగ సూచన
  choice: నీ కుమారుడు
  alternative: నీ బిడ్డ
  rationale: మూలం పుంలింగ ఏకవచనాన్ని స్పష్టంగా పేర్కొంటుంది; అందువల్ల ఆ ప్రత్యేకతను నిలిపాం.
- issue: מָה ప్రశ్న యొక్క ఉద్దేశం
  choice: ఏమిటి?
  alternative: వాటి అర్థం ఏమిటి?
  rationale: సందర్భంలో వివరణ లేదా ప్రాముఖ్యతను అడగడం అంతర్లీనంగా ఉండవచ్చు; అయినా మూలంలోని ప్రత్యక్ష ప్రశ్నను విస్తరించకుండా, దాని సహజమైన అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. తండ్రిని ఉద్దేశించిన ఏకవచన ‘నీ/నిన్ను’ మరియు ఇశ్రాయేలు సమూహాన్ని సూచించే బహువచన ‘మీకు’ మధ్య మూలంలోని వ్యత్యాసం నిలుపబడింది. వాక్యం తరువాతి వచనంలో వచ్చే సమాధానంతో కొనసాగుతుందనే భావాన్ని చూపేందుకు చివర కామా ఉంచబడింది.
