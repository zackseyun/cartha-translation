review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the causal connective, Yahweh’s presence among the people, the burning of divine anger, and destruction/removal. However, రోషంగల means ‘wrathful/angry’ and does not render קַנָּא (‘jealous,’ in the sense of exclusive covenant claim). It also obscures the distinction between God’s jealousy and the anger named later in the verse.
  naturalness: The revised wording uses clear modern standard Telugu while retaining the solemn warning structure. ‘లేకపోతే ... నిర్మూలిస్తాడేమో’ naturally conveys פֶּן (‘lest/otherwise’) without making the warning a flat assertion.
  terminology: Use అసూయగల దేవుడు for אֵל קַנָּא. Although the term can evoke ordinary human jealousy, the anchored note appropriately specifies its covenantal sense without paraphrasing it away in the text. యహ్వే consistently preserves the divine name.
  issues:
  - severity: high
    issue: రోషంగల దేవుడు for אֵל קַנָּא
    rationale: రోషంగల denotes being angry or wrathful, whereas קַנָּא denotes jealousy/zeal in the context of exclusive covenant loyalty. The draft consequently duplicates the subsequent anger concept and misses the source term’s central meaning.
  - severity: medium
    issue: Footnote a identifies the source sense inaccurately
    rationale: Its explanation is broadly covenantally appropriate, but calling the term ‘రోషంగల’ and offering ‘తీవ్ర ఆసక్తిగల’ as its meaning does not represent the lexical alternative ‘zealous’ to ‘jealous.’ The note should be aligned with the corrected translation.
  revised_text: ఎందుకంటే నీ మధ్యనున్న నీ దేవుడైన యహ్వే అసూయగల దేవుడు.[a] లేకపోతే నీ దేవుడైన యహ్వే కోపం నీ మీద రగిలి, ఆయన నిన్ను భూమి మీదనుండి నిర్మూలిస్తాడేమో.[b]
