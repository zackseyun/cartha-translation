revisions:
- from: ఎందుకంటే, నీ మధ్య ఉన్న నీ దేవుడైన యహ్వే రోషంగల దేవుడు.[a] నీ దేవుడైన యహ్వే కోపం నీ మీద రగులుకొని, భూమి మీద నుంచి నిన్ను నిర్మూలించవచ్చు.[b]
  to: ఎందుకంటే నీ మధ్యనున్న నీ దేవుడైన యహ్వే అసూయగల దేవుడు.[a] లేకపోతే నీ దేవుడైన యహ్వే కోపం నీ మీద రగిలి, ఆయన నిన్ను భూమి మీదనుండి నిర్మూలిస్తాడేమో.[b]
  rationale: కַנָּא యొక్క మూలార్థాన్ని నిలుపుటకు రోషంగల స్థానంలో అసూయగల అని మార్చబడింది. హెచ్చరికాత్మక פֶּן నిర్మాణాన్ని స్పష్టంగా చూపేందుకు లేకపోతే మరియు నిర్మూలిస్తాడేమో వాడబడింది. పాదసూచికలు సవరించిన పదప్రయోగానికి, అలాగే మూలంలోని నిబంధన-ప్రత్యేకత భావానికి అనుగుణంగా సరిచేయబడ్డాయి.
