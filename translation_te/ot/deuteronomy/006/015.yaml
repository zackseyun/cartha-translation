source:
  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: te
  text: ఎందుకంటే నీ మధ్యనున్న నీ దేవుడైన యహ్వే అసూయగల దేవుడు.[a] లేకపోతే నీ దేవుడైన యహ్వే కోపం నీ మీద రగిలి, ఆయన నిన్ను భూమి మీదనుండి నిర్మూలిస్తాడేమో.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అసూయగల దేవుడు’ అనే మాటకు ప్రత్యామ్నాయంగా ‘తనకే ప్రత్యేక నిబద్ధత కోరే దేవుడు’ అని అనవచ్చు. హీబ్రూలో ఇది తన ప్రజలపై యహ్వేకున్న ప్రత్యేక నిబంధన హక్కును, ఇతర దేవతల ఆరాధనను ఆయన సహించకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నేల ముఖం మీద నుంచి’; పూర్తిగా తొలగించబడడాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: אֵל קַנָּא
  choice: రోషంగల దేవుడు
  rationale: ప్రత్యర్థి ఆరాధనను సహించని యహ్వే యొక్క ప్రత్యేక నిబంధన హక్కును తెలియజేస్తుంది; పాపపూరిత అసూయ అనే భావాన్ని మోపకుండా మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בְּקִרְבֶּךָ
  choice: నీ మధ్య ఉన్న
  rationale: దేవుడు తన ప్రజల మధ్య ఉన్నాడనే సమూహాత్మక, స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: నిర్మూలించవచ్చు
  rationale: హెచ్చరికగా చెప్పబడిన సంభావ్య పరిణామాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: יֶחֱרֶה אַף
  choice: కోపం ... రగులుకొని
  rationale: కోపం మండడం అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בָּךְ
  choice: నీ మీద
  rationale: కోపానికి లక్ష్యమైన వ్యక్తిని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: וְהִשְׁמִידְךָ
  choice: నిన్ను నిర్మూలించవచ్చు
  rationale: שׁמד హిఫీల్ రూపంలోని పూర్తిగా నాశనం చేసి తొలగించే బలమైన భావాన్ని అందిస్తుంది.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: భూమి మీద నుంచి
  rationale: నేల/భూమి ముఖం మీద నుంచి పూర్తిగా తొలగించబడడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవిక קַנָּא పదం అనువాదం
  choice: రోషంగల దేవుడు
  alternative: అసూయగల దేవుడు; తనకే నిబద్ధత కోరే దేవుడు
  rationale: ‘రోషం’ ప్రత్యర్థి ఆరాధన పట్ల నిబంధన సంబంధమైన అసహనాన్ని, సంబంధాత్మక తీవ్రతను నిలుపుతుంది. వివరణాత్మక ప్రత్యామ్నాయం మూలంలోని సంక్షిప్తతనూ ఉద్రిక్తతనూ ముందుగానే పరిష్కరిస్తుంది.
- issue: יהוה దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా సంరక్షిస్తుంది.
- issue: פֶּן హెచ్చరిక నిర్మాణం
  choice: నిర్మూలించవచ్చు
  alternative: నిన్ను నిర్మూలించకుండా జాగ్రత్త; లేనిపక్షంలో ... నిర్మూలిస్తాడు
  rationale: మూలంలోని ప్రతికూల సంభావ్యతతో కూడిన హెచ్చరికను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఫలితాన్ని నిశ్చిత ప్రకటనగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన నిబంధన-హెచ్చరిక శైలిని ఉపయోగించాం. ఏకవచన సంబోధనను ‘నీ/నిన్ను’తో నిలిపాం. ‘రోషంగల’ అనే పదం సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, మూలంలోని దైవిక ప్రత్యేక హక్కు మరియు సంబంధాత్మక ఉద్రిక్తతను కాపాడుతుంది.
