id: DEU.6.5
reference: Deuteronomy 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ וּ/בְ/כָל מְאֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: te
  text: నీవు నీ దేవుడైన యహ్వేను నీ హృదయమంతటితో, నీ ప్రాణమంతటితో[a], నీ శక్తియంతటితో[b] ప్రేమించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అని అనువదించిన హెబ్రీ పదం నెఫెష్; దీనికి ‘జీవితం,’ ‘స్వయం’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘శక్తి’ అని అనువదించిన హెబ్రీ పదం మెఓద్ అక్షరార్థంగా ‘అధికత’ లేదా ‘సమృద్ధి’తో సంబంధమున్నది; ఇది బలం, తీవ్రత లేదా వనరులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: ప్రేమించాలి
  rationale: సంయోజక వావుతో కూడిన కాల్ పర్ఫెక్ట్ రూపం ఈ నిబంధనాత్మక ఉపదేశ సందర్భంలో ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది. ‘ప్రేమించాలి’ ఆధునిక తెలుగులో ఆ బద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీయ ఉచ్చారణకు సమీపమైన వ్యక్తినామంగా లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రూపపరంగా బహువచన ఛాయ ఉన్నప్పటికీ, ఏకవచన సూచ్యంతో ఇక్కడ ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘నీ దేవుడైన యహ్వే’ సహజంగా ఉంటుంది.
- source_word: בְּכָל
  choice: …మంతటితో
  rationale: בְּ־తో కూడిన כָּל సంపూర్ణ సమర్పణను సూచిస్తుంది. ప్రతి పదబంధంలో ‘మంతటితో’ అని పునరావృతం చేయడం మూలంలోని సమాంతర ఉద్ఘాటనను నిలుపుతుంది.
- source_word: לְבָבְךָ
  choice: నీ హృదయమంతటితో
  rationale: לֵבָב భావోద్వేగాన్ని మాత్రమే కాక ఆలోచన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచిస్తుంది. ‘హృదయం’ ఈ విస్తృతతను సంప్రదాయబద్ధంగా, సహజంగా మోస్తుంది.
- source_word: נַפְשְׁךָ
  choice: నీ ప్రాణమంతటితో
  rationale: נֶפֶשׁ ప్రాణం, జీవితం, స్వయం లేదా జీవి అనే విస్తృత అర్థాలను కలిగి ఉంటుంది. ‘ప్రాణం’ మూలంలోని జీవమయమైన సంపూర్ణ వ్యక్తిత్వ భావాన్ని నిలుపుతుంది; అర్థవిస్తృతిని పాదసూచిక తెలియజేస్తుంది.
- source_word: מְאֹדֶךָ
  choice: నీ శక్తియంతటితో
  rationale: מְאֹד సాధారణంగా ‘చాలా/అత్యంత’ అనే భావాన్ని కలిగి ఉండి, ఇక్కడ నామవాచకంగా మొత్తం సామర్థ్యం లేదా వనరులను సూచిస్తుంది. ‘శక్తి’ సంక్షిప్తంగా, సహజంగా ప్రధాన భావాన్ని అందిస్తుంది; అసాధారణ హెబ్రీయ ప్రయోగాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత నిబంధన నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని ఇవ్వడం మూలంలోని వ్యక్తినామాన్ని కాపాడుతుంది.
- issue: హృదయం—ప్రాణం—శక్తి అనే మానవ సంబంధ పదాలు
  choice: నీ హృదయమంతటితో, నీ ప్రాణమంతటితో, నీ శక్తియంతటితో
  alternative: నీ మనస్సుతో, నీ జీవితంతో, నీ బలమంతటితో
  rationale: ఈ పదాలు ఆధునిక మనోవిజ్ఞాన శాస్త్రంలోని వేర్వేరు విభాగాలుగా కాక, పరస్పరం ఆవరించే విధంగా సంపూర్ణ వ్యక్తిని సూచిస్తాయి. అనువాదం వాటిని కృత్రిమంగా నిర్వచించకుండా మూలంలోని సమగ్రతను, భావ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి ఉపయోగించబడింది. ‘…మంతటితో’ అనే పునరావృత నిర్మాణం మూలంలోని త్రివిధ సమాంతర ఉద్ఘాటనను కాపాడుతుంది. ‘ప్రేమించాలి’ ఆజ్ఞను సహజమైన తెలుగు నైతిక-నిబంధనాత్మక రూపంలో వ్యక్తం చేస్తుంది.
