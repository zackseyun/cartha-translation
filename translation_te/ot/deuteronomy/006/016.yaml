  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వేను పరీక్షించకూడదు; మీరు మస్సాలో ఆయనను పరీక్షించినట్లుగా కాదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మస్సా అనేది అరణ్యంలో ఇశ్రాయేలీయులు యాహ్వేను పరీక్షించిన స్థలం (నిర్గమకాండము 17:1–7); ఆ పేరు ‘పరీక్షించడం’ అనే భావంతో సంబంధం కలిగి ఉంది.
    reason: cross_reference
  - marker: b
    text: లేదా, “మీ దేవుడైన యాహ్వేను పరీక్షకు పెట్టకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: పరీక్షించకూడదు
  rationale: לֹא తో వచ్చిన పియేల్ అసంపూర్ణ క్రియ ఇక్కడ నిషేధాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘పరీక్షించకూడదు’ సహజంగా ఉండి, దేవుణ్ణి పరీక్షకు గురిచేయడమనే హెచ్చరికను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన ప్రత్యయాన్ని ‘మీ’గా అందించి, తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండేందుకు ‘మీ దేవుడైన యెహోవా’ అని అనువదించాం.
- source_word: כַּאֲשֶׁר
  choice: …ట్లుగా
  rationale: గత సంఘటనతో పోలికను సూచించే హీబ్రూ సంబంధపదాన్ని సహజమైన తెలుగు పోలికా నిర్మాణంతో అందించాం.
- source_word: נִסִּיתֶם
  choice: పరీక్షించిన
  rationale: ముందున్న תְנַסּוּతో ఒకే మూలక్రియ נסה కావడం వల్ల, పదసంబంధాన్ని నిలుపుతూ రెండుచోట్లా ‘పరీక్షించు’నే వాడాం.
- source_word: בַּמַּסָּה
  choice: మస్సాలో
  rationale: ఇది స్థలనామం కాబట్టి ప్రధాన పాఠ్యంలో అనువదించకుండా లిప్యంతరీకరించాం; ‘పరీక్ష’తో దాని పదసంబంధాన్ని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: మస్సా సంఘటనను ప్రధాన పాఠ్యంలో వివరించాలా
  choice: స్థలనామాన్ని మాత్రమే ఉంచడం
  alternative: ‘పరీక్ష స్థలమైన మస్సాలో’ అని విస్తరించడం
  rationale: హీబ్రూ పాఠ్యం కేవలం స్థలనామాన్నే ఇస్తుంది. నిర్గమకాండము 17లోని నేపథ్యాన్ని ప్రధాన వాక్యంలో చేర్చడం అదనపు వివరణ అవుతుంది కాబట్టి పాదసూచికలో ఉంచాం.
- issue: נסה క్రియలోని భావాన్ని ఎలా వ్యక్తీకరించాలి
  choice: పరీక్షించు
  alternative: పరీక్షకు గురిచేయు
  rationale: ‘పరీక్షించు’ మూలక్రియను సంక్షిప్తంగా, రెండుచోట్లా ఒకే విధంగా అందిస్తుంది; ‘పరీక్షకు గురిచేయు’ దాని ఉద్దేశపూర్వక సవాలు భావాన్ని మరింత స్పష్టంగా చెప్పే సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని క్రియాపునరుక్తిని ‘పరీక్షించు’తో నిలిపి, స్థలనామాన్ని వివరణ లేకుండా ప్రధాన పాఠ్యంలో ఉంచాం.
