source:
  edition: WLC
  text: וּ/קְשַׁרְתָּ֥/ם לְ/א֖וֹת עַל יָדֶ֑/ךָ וְ/הָי֥וּ לְ/טֹטָפֹ֖ת בֵּ֥ין עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: te
  text: వాటిని నీ చేతిమీద సూచనగా కట్టుకోవాలి; అవి నీ కళ్ల మధ్య నుదుటి పట్టీలుగా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తఫిల్లీన్‌లుగా”; తరువాతి యూదు ఆచారంలో ధరించే చిన్న పెట్టెలను సూచించే పదం. ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని మరింత అక్షరార్థమైన భావం నుదుటి ఆభరణాలు లేదా పట్టీలు అనే భావానికి దగ్గరగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: వాటిని ... కట్టుకోవాలి
  rationale: క్రియ యొక్క స్పష్టమైన భౌతిక చర్యను నిలుపుతూ, ముందున్న మాటలు/ఆజ్ఞలను సూచించే బహువచన ప్రత్యయాన్ని ‘వాటిని’గా వ్యక్తం చేస్తుంది. ఆజ్ఞాత్మక బోధనా క్రమానికి ఆధునిక తెలుగులో ‘కట్టుకోవాలి’ సహజంగా సరిపోతుంది.
- source_word: לְאוֹת
  choice: సూచనగా
  rationale: אוֹת అనే పదంలోని ‘సూచన/గుర్తు’ భావాన్ని కాపాడుతుంది; ఆ ఆచరణకు మించిన నిర్దిష్ట వ్యాఖ్యానాన్ని రుద్దదు.
- source_word: עַל יָדֶךָ
  choice: నీ చేతిమీద
  rationale: יָד యొక్క సాధారణ అర్థమైన ‘చేయి’నే అనుసరిస్తుంది; ‘బాహువు’ అని అనువదించడం అవసరానికి మించిన వ్యాఖ్యానం అవుతుంది.
- source_word: וְהָיוּ
  choice: అవి ... ఉండాలి
  rationale: మొదటి ఉపదేశాత్మక క్రియకు సమాంతరంగా ఆజ్ఞార్థక భావాన్ని కొనసాగిస్తుంది; కేవలం భవిష్యత్ అంచనాగా మార్చదు.
- source_word: לְטֹטָפֹת
  choice: నుదుటి పట్టీలుగా
  rationale: అరుదైన טֹטָפֹת పదం తల ముందుభాగంలో ధరించే వస్తువులను సూచిస్తుందని గ్రహించి, తరువాతి యూదు ఆచారంలోని నిర్దిష్ట రూపాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా తెలుగులో అర్థమయ్యే రూపాన్ని ఎంచుకుంది.
- source_word: בֵּין עֵינֶיךָ
  choice: నీ కళ్ల మధ్య
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన చిత్రణను యథాతథంగా నిలుపుతుంది; దానిని కేవలం ‘నీ నుదుటిమీద’గా వ్యాఖ్యానించి పరిమితం చేయదు.
theological_decisions:
- issue: ఈ ఆజ్ఞ అక్షరార్థమైన శారీరక ఆచరణనా, జ్ఞాపకంలో ఉంచుకోవడానికి రూపకమా, లేక రెండూ కలిసినదా అనే ప్రశ్న
  choice: శరీరానికి సంబంధించిన స్పష్టమైన చిత్రణను నిలుపుతూ, దాని ఉద్దేశాన్ని అనువాదంలో తేల్చకుండా ఉంచడం
  alternative: దీనిని నిరంతర జ్ఞాపకానికి రూపకంగా మాత్రమే అనువదించడం, లేదా తరువాతి కాలపు తఫిల్లీన్ ఆచారాన్ని నేరుగా సూచించేలా అనువదించడం
  rationale: మూల హీబ్రూ స్పష్టమైన శారీరక చిత్రణను ఉపయోగించినా, అది అక్షరార్థమా రూపకమా అన్నది స్వయంగా పరిష్కరించదు. అందువల్ల ప్రధాన పాఠ్యం ఆ ఉద్రిక్తతను కాపాడుతుంది; నిర్దిష్టమైన తరువాతి ఆచారాన్ని పాదసూచనలో మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. ‘కట్టుకోవాలి/ఉండాలి’ రూపాలు ఉపదేశాత్మక ఆజ్ఞా క్రమాన్ని సహజంగా తెలియజేస్తాయి. ప్రతి పాదసూచన సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
