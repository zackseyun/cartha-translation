source:
  edition: WLC
  text: לַ/הֲדֹ֥ף אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: te
  text: నీ ఎదుట నుండి[a] నీ శత్రువులందరినీ తరిమివేయడానికి, యాహ్వే చెప్పినట్లుగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ నుడికారం అక్షరార్థంగా ‘నీ ఎదుట నుండి’; అంటే నీ మార్గం లేదా సమక్షం నుండి శత్రువులను తొలగించడం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘చెప్పినట్లుగానే.’ హెబ్రీ క్రియ అక్షరార్థంగా ‘చెప్పాడు’; గతంలో పలికిన దైవిక మాట అమలులోనే ఉందనే భావం సందర్భంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: తరిమివేయడానికి
  rationale: లְ ఉపసర్గతో కూడిన హిఫిల్ క్రియారూపం ముందరి వాక్యంతో అనుసంధానమైన ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; శత్రువులను తొలగించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל אֹיְבֶיךָ
  choice: నీ శత్రువులందరినీ
  rationale: כָּל యొక్క సమగ్ర భావాన్నీ, ద్వితీయ పురుష ఏకవచన సంబోధననూ నిలుపుతుంది; אֶת తెలుగులో కర్మవిభక్తి ద్వారా వ్యక్తమవుతుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుట నుండి
  rationale: అక్షరార్థంగా ‘నీ ముఖం/సన్నిధి నుండి’; సైనిక సందర్భంలో మార్గం లేదా సమక్షం నుండి తొలగించడాన్ని సూచించే హెబ్రీ నుడికారాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లుగా
  rationale: దైవిక వాక్యానికి అనుగుణంగా జరుగుతుందనే పోలిక లేదా సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: דִּבֶּר
  choice: చెప్పిన
  rationale: హెబ్రీ పర్ఫెక్ట్ గతంలో పలికిన మాటను సూచిస్తుంది; ‘వాగ్దానం చేసిన’ అని వ్యాఖ్యానాత్మకంగా నిర్దిష్టం చేయకుండా అసలు క్రియ యొక్క విస్తృతిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే విధంగా దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సమీప లిప్యంతరీకరణ.
- issue: דִּבֶּר యొక్క కాలబలం మరియు నిబంధన సందర్భం
  choice: చెప్పిన
  alternative: చెప్పినట్లుగానే / వాగ్దానం చేసినట్లుగా
  rationale: గతంలో పలికిన దైవిక మాట ప్రస్తుత సందర్భంలో అమలులో ఉందనే భావం సందర్భం ద్వారా తెలుస్తుంది. ‘వాగ్దానం చేసిన’ అనడం సాధ్యమైన భావవ్యాఖ్య అయినా, మూలంలోని సాధారణ ‘మాట్లాడు/చెప్పు’ క్రియను మరీ నిర్దిష్టం చేస్తుంది.
translation_notes:
  register: ముందరి వచనంపై ఆధారపడే ఉద్దేశార్థక ఖండవాక్య స్వరూపాన్ని ‘తరిమివేయడానికి’తో నిలిపాం. భాష ఆధునికం, గౌరవప్రదం, సాధారణ పాఠకులకు స్పష్టం. దీర్ఘ విరామచిహ్నం ఈ వచనం వ్యాకరణపరంగా ముందరి వాక్యానికి కొనసాగింపని సూచిస్తుంది.
