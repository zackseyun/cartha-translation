  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: te
  text: నీవు నింపని అన్ని మంచి వస్తువులతో నిండిన ఇళ్లు, రాతిలో చెక్కిన నీటి తొట్టెలు[a]—నీవు చెక్కనివి—నీవు నాటని ద్రాక్షతోటలు, ఒలీవ చెట్లు; నీవు తిని తృప్తి చెందుతావు[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బావులు.” హీబ్రూ పదం మరింత నిర్దిష్టంగా నీటిని నిల్వ చేయడానికి రాతిలో చెక్కిన తొట్టెలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు తిని నిండుగా ఉంటావు.” హీబ్రూ క్రియలు ఇశ్రాయేలు దేశంలో ప్రవేశించినప్పుడు జరగబోయే సంఘటనల క్రమాన్ని కొనసాగిస్తాయి.
    reason: grammatical_sequence
lexical_decisions:
- source_word: בָתִּים
  choice: ఇళ్లు
  rationale: భౌతిక నివాస భవనాలను సూచించే సాధారణ, సహజమైన తెలుగు పదం; జాబితాలోని వస్తుసంపద భావాన్ని నిలుపుతుంది.
- source_word: מְלֵאִים כָּל טוּב
  choice: ప్రతి మంచి వస్తువుతో నిండిన
  rationale: ఇక్కడ טוּב నైతిక మంచితనం మాత్రమే కాక, ఉపయోగకరమైన విలువైన వస్తువులు, సరఫరాలను విస్తృతంగా సూచిస్తుంది.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: నీవు నింపని
  rationale: రెండవ పురుష ఏకవచన సంబోధనను, ఇశ్రాయేలు శ్రమించకుండానే పొందే సంపద అనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בֹרֹת חֲצוּבִים
  choice: తొలిచిన నీటి తొట్టెలు
  rationale: בֹרֹת అనే పదాన్ని సందర్భానుసారం నీటిని నిల్వ చేసే తొట్టెలుగా, חֲצוּבִיםను తొలిచినవిగా వ్యక్తం చేస్తుంది; సాధారణ బావులకంటే మూలంలోని చెక్కి చేయబడిన నిర్మాణ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: నీవు తొలవని
  rationale: חֲצוּבִיםతో పదసంబంధాన్ని నిలిపి, వాటిని తయారు చేయడంలో సంబోధితుని శ్రమ లేదనే పునరుక్తిని కాపాడుతుంది.
- source_word: כְּרָמִים
  choice: ద్రాక్షతోటలు
  rationale: ఒక్కొక్క తీగను కాక సాగుచేసిన ద్రాక్షతోటలను సూచించే సహజమైన తెలుగు సమానార్థకం.
- source_word: זֵיתִים
  choice: ఒలీవ చెట్లు
  rationale: నాటబడే వనరుల జాబితాలో ఈ బహువచనం చెట్లను సూచిస్తుందని స్పష్టపరుస్తుంది; మూలంలో లేని ‘తోపులు’ అనే సమూహ భావాన్ని జోడించదు.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: నీవు నాటని
  rationale: రెండవ పురుష ఏకవచనాన్ని, తాను ఉత్పత్తి చేయని వనరులను పొందే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: నీవు తిని తృప్తి చెందుతావు
  rationale: సందర్భంలోని భవిష్యత్తు సంఘటనల క్రమాన్ని సహజమైన తెలుగులో చూపుతూ, భోజనం తరువాత కలిగే సంపూర్ణ తృప్తి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వాగ్దాన దేశంలోని సమృద్ధి స్వభావం
  choice: ఇశ్రాయేలు తాను తయారు చేయకుండానే పొందే భౌతిక వనరుల సరళ జాబితాగా అనువదించడం
  alternative: ఈ వచనంలోనే హెచ్చరికను లేదా ఆ వస్తువులు అక్రమంగా పొందినవనే భావాన్ని చేర్చడం
  rationale: వచనం ఇళ్లు, నీటి వనరులు, సాగు భూముల సమృద్ధిని మాత్రమే వివరిస్తుంది. మరచిపోవద్దనే హెచ్చరిక తరువాతి వచనంలో వస్తుంది; దానిని ఇక్కడ ముందుగానే చేర్చలేదు.
- issue: రెండవ పురుష ఏకవచన సంబోధన
  choice: ‘నీవు’ అనే ఏకవచన రూపాన్ని అంతటా నిలుపడం
  alternative: ‘మీరు’ అనే బహువచన లేదా గౌరవ రూపానికి మార్చడం
  rationale: ద్వితీయోపదేశకాండంలోని నిబంధనాత్మక శైలిలో ఇశ్రాయేలు సమాజాన్ని ఏక సమూహంగా ఉద్దేశించిన హీబ్రూ ఏకవచనాన్ని ఇది కాపాడుతుంది.
- issue: క్రియల కాలసంబంధం
  choice: దేశంలో ప్రవేశించినప్పుడు జరగబోయే ఫలితంగా ‘తిని తృప్తి చెందుతావు’ అని భవిష్యత్తు భావంతో అనువదించడం
  alternative: ‘తిని తృప్తి చెందావు’ అనే పూర్తయిన గత చర్యగా అనువదించడం
  rationale: ఈ క్రియారూపాలు ముందున్న వాగ్దాన సంఘటనల క్రమాన్ని కొనసాగిస్తున్నాయి; రూపాన్ని యాంత్రికంగా గతకాలంగా చూపడం సందర్భార్థాన్ని తప్పుదోవ పట్టిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ ఏకవచన సంబోధన కోసం ‘నీవు’ను నిలిపాం. ఈ వచనం ముందరి వాక్యంపై ఆధారపడిన జాబితాలో భాగం కావడంతో చివర దీర్ఘ విరామ చిహ్నాన్ని ఉంచాం; తెలుగులో వాక్యసంబంధం సహజంగా ఉండేందుకు ముందరి సందర్భంలోని షరతు భావాన్ని ‘నీకు దొరికినప్పుడు’తో వ్యక్తం చేశాం.
