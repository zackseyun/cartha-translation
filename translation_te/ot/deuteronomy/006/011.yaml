    issue: Awkward rendering of hewn cisterns
    rationale: “నీవు తొలవని తొలిచిన” is stylistically strained and does not clearly express cisterns hewn from rock. Revising to “రాతిలో చెక్కిన ... నీవు చెక్కనివి” retains the source contrast naturally.
