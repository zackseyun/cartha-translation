- from: నీవు నింపని ప్రతి మంచి వస్తువుతో నిండిన ఇళ్లు, నీవు తొలవని తొలిచిన నీటి తొట్టెలు[a], నీవు నాటని ద్రాక్షతోటలు, ఒలీవ చెట్లు నీకు దొరికినప్పుడు, నీవు తిని తృప్తి చెందుతావు[b]—
