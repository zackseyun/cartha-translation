- from: అప్పుడు వారు అతనికి వంద వెండి షెకెల్ల జరిమానా విధించి, ఆ యువతి తండ్రికి ఇవ్వాలి; ఎందుకంటే అతడు ఇశ్రాయేలుకు చెందిన ఒక కన్యకు చెడ్డపేరు తెచ్చాడు. ఆమె అతనికి భార్యగా ఉండాలి; అతడు తన జీవితకాలమంతా ఆమెను పంపివేయకూడదు.[a]
  to: అప్పుడు వారు అతనికి వంద వెండి షెకెల్లను జరిమానాగా విధించి, వాటిని ఆ యువతి తండ్రికి ఇవ్వాలి; ఎందుకంటే అతడు ఒక ఇశ్రాయేలీయ కన్యపై చెడ్డపేరు మోపాడు. ఆమె అతనికి భార్యగా ఉండాలి; అతడు తన జీవితకాలమంతా ఆమెను పంపివేయకూడదు.[a]
  rationale: సవరణలు అర్థాన్ని మార్చవు. అవి కేవలం ధనదండన చెల్లింపు క్రమాన్ని స్పష్టం చేసి, ‘చెడ్డపేరు మోపాడు’ అనే హీబ్రూ న్యాయ నుడికారాన్ని ఆధునిక సహజ తెలుగు రూపంలో అందిస్తాయి. ‘పంపివేయు’ అనే మూలపదాధారిత ప్రధాన పాఠాన్ని అలాగే ఉంచి, ‘విడాకులు ఇవ్వు’ అనే సందర్భానుగుణ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
