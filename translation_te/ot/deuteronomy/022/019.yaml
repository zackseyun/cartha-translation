source:
  edition: WLC
  text: וְ/עָנְשׁ֨וּ אֹת֜/וֹ מֵ֣אָה כֶ֗סֶף וְ/נָתְנוּ֙ לַ/אֲבִ֣י הַֽ/נַּעֲרָ֔ה כִּ֤י הוֹצִיא֙ שֵׁ֣ם רָ֔ע עַ֖ל בְּתוּלַ֣ת יִשְׂרָאֵ֑ל וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֔ה לֹא יוּכַ֥ל לְ/שַּׁלְּחָ֖/הּ כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: te
  text: అప్పుడు వారు అతనికి వంద వెండి షెకెల్లను జరిమానాగా విధించి, వాటిని ఆ యువతి తండ్రికి ఇవ్వాలి; ఎందుకంటే అతడు ఒక ఇశ్రాయేలీయ కన్యపై చెడ్డపేరు మోపాడు. ఆమె అతనికి భార్యగా ఉండాలి; అతడు తన జీవితకాలమంతా ఆమెను పంపివేయకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెకు విడాకులు ఇవ్వకూడదు.” హీబ్రూలో అక్షరార్థంగా “ఆమెను పంపివేయకూడదు” అని ఉంది; వైవాహిక న్యాయ సందర్భాల్లో ఇది వివాహ బంధాన్ని రద్దు చేయడాన్ని సూచించే సాధారణ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: జరిమానా విధించి
  rationale: ఈ న్యాయ సందర్భంలో క్రియ సాధారణ శిక్షను కాకుండా నిర్దిష్టమైన ధనదండనను సూచిస్తుంది.
- source_word: מֵאָה כֶסֶף
  choice: వంద వెండి షెకెల్లు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వంద వెండి’ అని ఉన్నా, న్యాయ-ఆర్థిక సందర్భంలో ఇది వెండి బరువు ప్రమాణమైన షెకెల్లను సూచిస్తుంది.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: ఆ యువతి తండ్రికి
  rationale: נַעֲרָה వివాహ వయస్సులోని యువతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘యువతి’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: చెడ్డపేరు తెచ్చాడు
  rationale: ‘చెడ్డ పేరు బయటకు తేవడం’ అనే హీబ్రూ నుడికారపు రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది; ‘అపవాదు మోపాడు’ కంటే మూలానికి దగ్గరగా ఉంది.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు చెందిన ఒక కన్యకు
  rationale: בְּתוּלָה ఈ ఆరోపణకు సంబంధించిన న్యాయ సందర్భంలో కన్యను సూచిస్తుంది; ‘ఇశ్రాయేలుకు చెందిన’ అనే రూపం సమాజ సంబంధాన్ని నిలుపుతుంది.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: ఆమె అతనికి భార్యగా ఉండాలి
  rationale: ఈ వాక్యం కొనసాగవలసిన న్యాయపరమైన వైవాహిక స్థితిని తెలియజేస్తుంది; తెలుగులో విధినిర్దేశక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא יוּכַל
  choice: కూడదు
  rationale: న్యాయ సందర్భంలో ఇది శారీరక అసమర్థతకన్నా నిషేధం లేదా న్యాయపరమైన అనుమతి లేకపోవడాన్ని సూచిస్తుంది.
- source_word: לְשַׁלְּחָהּ
  choice: ఆమెను పంపివేయకూడదు
  rationale: ‘పంపివేయు’ అనే మూలపదాన్ని నిలుపుతూ, వైవాహిక న్యాయ సందర్భంలో దాని విడాకుల భావాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
- source_word: כָּל יָמָיו
  choice: తన జీవితకాలమంతా
  rationale: ‘అతని దినాలన్నీ’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: వైవాహిక బంధాన్ని రద్దు చేయడానికి వాడిన న్యాయ నుడికారం
  choice: ఆమెను పంపివేయకూడదు
  alternative: ఆమెకు విడాకులు ఇవ్వకూడదు
  rationale: ప్రధాన పాఠం హీబ్రూ వ్యక్తీకరణను నిలుపుతుంది; న్యాయ సందర్భంలో సాధ్యమైన స్పష్టమైన అర్థాన్ని పాదసూచిక తెలియజేస్తుంది. దీనివల్ల మూలంలోని నుడికారమూ, దాని న్యాయ భావమూ రెండూ సంరక్షించబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయ విధినిర్దేశక స్వరాన్ని ‘విధించి’, ‘ఇవ్వాలి’, ‘ఉండాలి’, ‘కూడదు’ వంటి రూపాలతో నిలిపాం. మూలంలోని ‘చెడ్డపేరు తెచ్చాడు’, ‘పంపివేయు’ అనే నుడికారాలను సహజమైన తెలుగులో సాధ్యమైనంత దగ్గరగా ఉంచాం.
