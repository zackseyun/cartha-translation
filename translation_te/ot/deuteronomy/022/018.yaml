  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ వాక్యానికి తగిన గంభీరమైన కానీ సామాన్యులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని వరుస చర్యను ‘పట్టుకొని శిక్షించాలి’గా సహజీకరించాం; శిక్ష స్వరూపంపై ఉన్న మూలభాషా అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
