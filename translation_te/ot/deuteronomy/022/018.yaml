  yaml_path: translation/ot/deuteronomy/022/018.yaml
  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: te
  text: అప్పుడు ఆ పట్టణపు పెద్దలు ఆ మనిషిని తీసుకొని శిక్షించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనికి క్రమశిక్షణ విధించాలి,’ ‘అతన్ని దండించాలి’; బహుశా ‘కొరడాతో కొట్టాలి.’ హీబ్రూ క్రియ దిద్దుబాటు కోసం చేసే క్రమశిక్షణను విస్తృతంగా సూచిస్తుంది; శిక్ష యొక్క ఖచ్చితమైన రూపాన్ని ఈ క్రియ ఒక్కటే స్పష్టం చేయదు, దానికి చుట్టూ ఉన్న న్యాయ సందర్భం మరింత వెలుగు చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: పట్టుకొని
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకోవడం’ అనే అర్థం ఉన్నా, ఈ న్యాయ సందర్భంలో అధికారిక అదుపులోకి తీసుకోవడాన్ని సహజంగా సూచించేందుకు ‘పట్టుకొని’ అనువైనది; ‘బలవంతంగా బంధించి’ వంటి అధిక నిర్దిష్టతను చేర్చదు.
- source_word: זִקְנֵי
  choice: పెద్దలు
  rationale: ఇక్కడ זקנים కేవలం వృద్ధ పురుషులను కాక, పట్టణపు గుర్తింపు పొందిన సామాజిక-న్యాయ నాయకులను సూచిస్తుంది; తెలుగు బైబిలు మరియు సాధారణ వాడుకలో ‘పెద్దలు’ ఈ సంస్థాగత భావాన్ని అందిస్తుంది.
- source_word: הָעִיר הַהִוא
  choice: ఆ పట్టణపు
  rationale: עיר స్థానిక నివాస ప్రాంతం లేదా న్యాయ పరిధిని సూచిస్తుంది. ‘ఆ పట్టణపు’ అనే రూపం నిర్దేశక భావాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో ఉంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషిని
  rationale: איש అక్షరార్థంగా ‘మనిషి/పురుషుడు’; పూర్వ సందర్భంలో అతడు భర్త అయినప్పటికీ, మూలంలోని సాధారణ పదాన్ని నిలుపుతూ సందర్భానుసార నిర్దేశాన్ని ‘ఆ’ తెలియజేస్తుంది.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: శిక్షించాలి
  rationale: יסר దిద్దుబాటు, క్రమశిక్షణ, శిక్ష వంటి విస్తృత భావాలను కలిగి ఉంది. తెలుగు న్యాయ సందర్భంలో ‘శిక్షించాలి’ సహజంగా ఉండి, శిక్ష విధానాన్ని కొరడా దెబ్బలుగా అనవసరంగా నిర్దిష్టం చేయదు.
