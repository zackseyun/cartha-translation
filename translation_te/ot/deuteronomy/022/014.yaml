id: DEU.22.14
reference: Deuteronomy 22:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: te
  text: అతడు ఆమెపై నిందారోపణలు[a] మోపి, ఆమెకు చెడ్డపేరు[b] తెచ్చి, ‘నేను ఈ స్త్రీని భార్యగా తీసుకున్నాను. నేను ఆమెతో కలిసినప్పుడు[c], ఆమెలో కన్యత్వానికి ఆధారాలు[d] నాకు కనిపించలేదు’ అని అంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబద్ధ ఆరోపణలు.’ హీబ్రూ పదబంధం అపకీర్తి కలిగించే ఆరోపణలను సూచిస్తుంది; ‘అబద్ధ’ అనే భావం సందర్భం వల్ల రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆమెపై చెడ్డ పేరు బయటకు తెచ్చి’; అంటే ఆమె ప్రతిష్ఠను దెబ్బతీసి.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నేను ఆమెను సమీపించినప్పుడు.’ ఇది లైంగిక సంబంధానికి హీబ్రూలో వాడిన మర్యాదాపూర్వక సూచన.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, ‘ఆమెకు కన్యత్వం నాకు కనిపించలేదు.’ ఇక్కడ ఇది కన్యత్వానికి సంబంధించిన సూచనలు లేదా ఆధారాలను ఉద్దేశిస్తుంది; తరువాతి వచనాలు వాటిని వివరిస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: ఆమెపై నిందారోపణలు మోపి
  rationale: ఈ హీబ్రూ పదబంధం సందర్భంలో ఒకరిపై ఆరోపణలు మోపడాన్ని సూచిస్తుంది. ‘నిందారోపణలు’ అపకీర్తి కలిగించే ఆరోపణల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అవి అబద్ధమని ప్రధాన పాఠంలో ముందుగానే నిర్ణయించకుండా ఉంచుతుంది.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: ఆమెకు చెడ్డపేరు తెచ్చి
  rationale: ‘ఆమెపై చెడ్డ పేరు బయటకు తేవడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తం చేస్తూ, ఆమె ప్రతిష్ఠను దెబ్బతీయడం అనే భావాన్ని నిలుపుతుంది.
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: నేను ఈ స్త్రీని భార్యగా తీసుకున్నాను
  rationale: לָקַחְתִּי అనే ‘తీసుకున్నాను’ క్రియకు ఇక్కడ వివాహసంబంధ అర్థం ఉంది. ‘భార్యగా’ చేర్చడం ద్వారా ఆ అర్థం స్పష్టమవుతుంది; ‘ఈ స్త్రీ’ అనే దూరాన్ని సూచించే మూలపాఠపు అభివ్యక్తి నిలుస్తుంది.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: నేను ఆమెతో కలిసినప్పుడు
  rationale: మూలంలోని ‘ఆమెను సమీపించాను’ అనేది లైంగిక సంబంధానికి మర్యాదాపూర్వక సూచన. ‘ఆమెతో కలిసినప్పుడు’ తెలుగులో అదే మితమైన, సందర్భానికి అర్థమయ్యే సూచనను ఇస్తుంది.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: ఆమెలో కన్యత్వానికి ఆధారాలు నాకు కనిపించలేదు
  rationale: బహువచన రూపమైన בְּתוּלִים ఈ న్యాయ సందర్భంలో కేవలం కన్యత్వ స్థితినే కాక, తదుపరి వచనాల్లో ప్రస్తావించబడే దాని సూచనలను లేదా ఆధారాలను సూచిస్తుంది. ‘కన్యత్వానికి ఆధారాలు’ ఆ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆరోపణలు అబద్ధమైనవని ప్రధాన పాఠంలో స్పష్టంగా చెప్పాలా
  choice: ప్రధాన పాఠంలో ‘నిందారోపణలు’ అని ఉంచి, ‘అబద్ధ ఆరోపణలు’ అనే భావాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇవ్వడం
  alternative: అబద్ధ ఆరోపణలు
  rationale: తదుపరి న్యాయ విచారణలో ఆరోపణల నిజానిజాలు తేలుతాయి. ఈ పదబంధానికే ‘అబద్ధ’ అనే అర్థం తప్పనిసరిగా ఉందా అన్నది స్పష్టంగా లేనందున, మూలంలోని న్యాయపరమైన ఉద్రిక్తతను ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ సందర్భానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే విధంగానూ అనువదించబడింది. లైంగిక సంబంధానికి మూలపాఠంలో ఉన్న మర్యాదాపూర్వక పరోక్షతను నిలుపుతూ, అస్పష్టతను పాదటిప్పణులతో వివరించింది.
