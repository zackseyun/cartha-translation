  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన న్యాయశైలి వాడబడింది. మూలంలోని షరతు, యాదృచ్ఛికంగా ఎదురుపడే భావం, తల్లి పక్షి స్థానం, నిషేధ స్వరూపం నిలుపబడ్డాయి.
