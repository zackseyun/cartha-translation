source:
  edition: WLC
  text: כִּ֣י יִקָּרֵ֣א קַן צִפּ֣וֹר לְ/פָנֶ֡י/ךָ בַּ/דֶּ֜רֶךְ בְּ/כָל עֵ֣ץ א֣וֹ עַל הָ/אָ֗רֶץ אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְ/הָ/אֵ֤ם רֹבֶ֨צֶת֙ עַל הָֽ/אֶפְרֹחִ֔ים א֖וֹ עַל הַ/בֵּיצִ֑ים לֹא תִקַּ֥ח הָ/אֵ֖ם עַל הַ/בָּנִֽים־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: te
  text: దారిలో, ఏదైనా చెట్టు మీద గానీ నేల మీద గానీ పక్షిపిల్లలు లేదా గుడ్లు ఉన్న పక్షిగూడు నీకు అనుకోకుండా కనిపిస్తే[a], ఆ పక్షిపిల్లల మీద లేదా గుడ్ల మీద తల్లి పక్షి కూర్చుని ఉంటే, పక్షిపిల్లలతోపాటు తల్లి పక్షిని తీసుకోకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పక్షిగూడు నీకు ఎదురైతే.” ఇక్కడి హీబ్రూ క్రియ ఉద్దేశపూర్వకంగా వెదకడం కంటే అనుకోకుండా ఎదురుపడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పక్షిపిల్లలపై తల్లి పక్షిని తీసుకోకూడదు.” ఈ సందర్భంలోని హీబ్రూ ప్రయోగం తల్లి పక్షిని దాని పిల్లలతో కలిపి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: '...కనిపిస్తే'
  rationale: ఇది షరతుతో కూడిన న్యాయనియమాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘-తే’ నిర్మాణం సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יִקָּרֵא
  choice: అనుకోకుండా కనిపిస్తే
  rationale: నిఫాల్ రూపం ఉద్దేశపూర్వకంగా వెదకడాన్ని కాక యాదృచ్ఛికంగా ఎదురుపడడాన్ని సూచిస్తుంది.
- source_word: קַן צִפּוֹר
  choice: పక్షిగూడు
  rationale: హీబ్రూ సమాస పదబంధానికి సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: నీవు దారిలో వెళ్తున్నప్పుడు ... నీకు
  rationale: ప్రయాణ మార్గంలో ఒక గూడు ఎదురుపడే సందర్భాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: ఏదైనా చెట్టుమీద గానీ నేలమీద గానీ
  rationale: గూడు ఉండగల రెండు ప్రదేశాలను స్పష్టంగా, సహజమైన తెలుగు జత నిర్మాణంతో అందిస్తుంది.
- source_word: אֶפְרֹחִים
  choice: పిల్లలు
  rationale: పక్షిజాతిని లేదా ఎదుగుదల దశను అనవసరంగా నిర్దిష్టం చేయకుండా గూటిలోని చిన్న పక్షులను సూచిస్తుంది.
- source_word: בֵיצִים
  choice: గుడ్లు
  rationale: మూలపదానికి నేరమైన, సందిగ్ధతలేని తెలుగు సమానార్థకం.
- source_word: וְהָאֵם
  choice: తల్లి పక్షి
  rationale: తెలుగులో ‘తల్లి’ మాత్రమే అనడం సాధ్యమైనా, పక్షి సందర్భాన్ని వెంటనే స్పష్టం చేయడానికి సహజమైన విస్తరణ.
- source_word: רֹבֶצֶת
  choice: కూర్చుని ఉంటే
  rationale: పిల్లలపై లేదా గుడ్లపై ఉన్న తల్లి పక్షి స్థితిని సహజంగా చెబుతుంది; ‘పొదుగుతూ’ అనే మరింత సంకుచిత వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: לֹא תִקַּח
  choice: పట్టుకోకూడదు
  rationale: ఇక్కడ పక్షిని స్వాధీనం చేసుకోవడం లేదా తీసుకుపోవడం అనే నిషేధాన్ని ఆధునిక తెలుగు న్యాయశైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֵם עַל הַבָּנִים
  choice: పిల్లలతోపాటు తల్లిని
  rationale: ఈ సందర్భంలో עַל‌ను స్థలార్థకంగా కాక, తల్లిని దాని సంతానంతో కలిపి తీసుకోవడాన్ని సూచించే ప్రయోగంగా అందిస్తుంది.
