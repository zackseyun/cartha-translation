review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the conditional legal case, the chance encounter, the alternative nest locations, the young or eggs, the mother positioned upon them, and the prohibition. However, 'పట్టుకోకూడదు' can mean merely 'must not catch/hold,' whereas Hebrew לֹא תִקַּח prohibits taking the mother; 'తీసుకోకూడదు' is closer. The footnote marked b calls an incomplete phrase literal and should include the prohibition represented by the Hebrew clause.
  naturalness: The Telugu is generally natural modern standard Telugu. Replacing the contextually ambiguous 'పిల్లలు' with 'పక్షిపిల్లలు' improves immediate clarity without over-specifying the Hebrew term. 'తీసుకోకూడదు' is also natural in this legal instruction.
  terminology: '''పక్షిగూడు,'' ''గుడ్లు,'' and ''తల్లి పక్షి'' are appropriate. ''పక్షిపిల్లలు'' accurately denotes the avian young in context. No theological terminology is involved.'
  issues:
  - severity: medium
    issue: The main text renders לֹא תִקַּח as 'పట్టుకోకూడదు.'
    rationale: The Hebrew verb means 'take,' and the law concerns taking the mother together with the offspring, not simply catching or holding her. 'తీసుకోకూడదు' more directly preserves the legal force and scope.
  - severity: low
    issue: Footnote b inaccurately labels only 'పిల్లలమీద ఉన్న తల్లిని' as the literal wording.
    rationale: The relevant Hebrew wording includes the prohibition, literally approximately 'you shall not take the mother upon/with the young.' The note should represent the full clause and then explain the idiom.
  revised_text: దారిలో, ఏదైనా చెట్టు మీద గానీ నేల మీద గానీ పక్షిపిల్లలు లేదా గుడ్లు ఉన్న పక్షిగూడు నీకు అనుకోకుండా కనిపిస్తే[a], ఆ పక్షిపిల్లల మీద లేదా గుడ్ల మీద తల్లి పక్షి కూర్చుని ఉంటే, పక్షిపిల్లలతోపాటు తల్లి పక్షిని తీసుకోకూడదు[b].
