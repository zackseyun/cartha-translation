revisions:
- from: నీవు దారిలో వెళ్తున్నప్పుడు, ఏదైనా చెట్టుమీద గానీ నేలమీద గానీ పిల్లలు లేదా గుడ్లు ఉన్న పక్షిగూడు నీకు అనుకోకుండా కనిపిస్తే[a], ఆ పిల్లలమీద లేదా గుడ్లమీద తల్లి పక్షి కూర్చుని ఉంటే, పిల్లలతోపాటు తల్లిని పట్టుకోకూడదు[b].
  to: దారిలో, ఏదైనా చెట్టు మీద గానీ నేల మీద గానీ పక్షిపిల్లలు లేదా గుడ్లు ఉన్న పక్షిగూడు నీకు అనుకోకుండా కనిపిస్తే[a], ఆ పక్షిపిల్లల మీద లేదా గుడ్ల మీద తల్లి పక్షి కూర్చుని ఉంటే, పక్షిపిల్లలతోపాటు తల్లి పక్షిని తీసుకోకూడదు[b].
  rationale: The revision uses 'తీసుకోకూడదు' to reflect the Hebrew prohibition against taking, clarifies that the young are birds, and corrects footnote b so that its literal rendering includes the full prohibitive clause while preserving the idiomatic explanation.
