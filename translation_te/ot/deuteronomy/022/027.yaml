  edition: WLC
  text: כִּ֥י בַ/שָּׂדֶ֖ה מְצָאָ֑/הּ צָעֲקָ֗ה ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/אֵ֥ין מוֹשִׁ֖יעַ לָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: te
  text: ఎందుకంటే అతడు ఆమెను పొలంలో[a] ఎదుర్కొన్నాడు; నిశ్చితార్థమైన ఆ యువతి కేక వేసింది, కానీ ఆమెను రక్షించేవారు ఎవరూ లేరు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బహిరంగ గ్రామీణ ప్రదేశంలో.’ హీబ్రూ పదబంధం సహాయం అందుబాటులో లేని ఏకాంత గ్రామీణ ప్రదేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆమెను కాపాడేవారు ఎవరూ లేరు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి న్యాయతీర్పుకు కారణాన్ని వివరిస్తున్న సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: בַשָּׂדֶה
  choice: పొలంలో
  rationale: మూలంలోని గ్రామీణ, జనసంచారం లేని బహిరంగ ప్రదేశ భావాన్ని నేరుగా నిలుపుతుంది; ‘బయట ప్రదేశంలో’ అనే విస్తృత భావం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: מְצָאָהּ
  choice: ఆమెను ఎదుర్కొన్నాడు
  rationale: מצא యొక్క ‘కనుగొను/ఎదురుపడు’ భావాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; ముందే వెదికి కనుగొన్నాడనే అనవసర సూచనను నివారిస్తుంది.
- source_word: צָעֲקָה
  choice: కేక వేసింది
  rationale: ఆపదలో సహాయం కోసం గట్టిగా మొరపెట్టుకున్న భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הנער
  choice: ఆ యువతి
  rationale: లిఖిత రూపంలో ఉన్న రూపభేదాన్ని సందర్భం, స్త్రీలింగ సూచనలు స్పష్టీకరిస్తాయి; ఆధునిక తెలుగులో లింగాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: הַמְאֹרָשָׂה
  choice: నిశ్చితార్థమైన
  rationale: వివాహానికి అధికారికంగా ఒప్పించబడిన ప్రాచీన న్యాయ-సామాజిక స్థితిని ఆధునిక పాఠకులకు అర్థమయ్యే రీతిలో సూచిస్తుంది.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: కానీ ఆమెను రక్షించేవారు ఎవరూ లేరు
  rationale: సందర్భంలోని విరుద్ధతను తెలుగులో సహజంగా చూపిస్తూ, సహాయానికి రక్షకుడు అందుబాటులో లేడనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הַמְאֹרָשָׂה సూచించే న్యాయ-సామాజిక స్థితి
  choice: నిశ్చితార్థమైన
  alternative: వివాహానికి ఒప్పించబడిన
  rationale: ఆమె వివాహబంధానికి అధికారికంగా నియమించబడిన స్థితిని చూపిస్తుంది; ఆధునిక నిశ్చితార్థంతో పూర్తిగా సమానమని అతిగా నిర్ధారించకుండా సాధారణ పాఠకునికి అర్థమయ్యే పదాన్ని ఎంచుకుంది.
- issue: הנער యొక్క సందర్భానుసార లింగ సూచన
  choice: యువతి
  alternative: యువ వ్యక్తి
  rationale: సందర్భం మరియు అనుసంధానమైన స్త్రీలింగ రూపాలు సూచించే లింగాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- issue: מוֹשִׁיעַ యొక్క సందర్భార్థం
  choice: రక్షించేవారు
  alternative: కాపాడేవారు
  rationale: ఇక్కడ పదం తక్షణ శారీరక ప్రమాదం నుంచి విడిపించడాన్ని సూచిస్తుంది; విస్తృత రక్షణశాస్త్ర భావాన్ని అనవసరంగా దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయవివరణ శైలి. మూలంలోని కారణసంబంధం, గ్రామీణ ఏకాంతత, యువతి చేసిన సహాయ కేక, రక్షకుడు లేకపోవడం నిలుపబడ్డాయి.
