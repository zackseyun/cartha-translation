lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: దున్నకూడదు
  rationale: నిషేధాన్ని సూచించే לֹא తో కూడిన Qal imperfect రూపాన్ని తెలుగు ధర్మశాస్త్ర శైలిలో సహజమైన ప్రత్యక్ష నిషేధంగా అనువదించాం.
- source_word: בְּשׁוֹר
  choice: ఎద్దును
  rationale: వ్యవసాయంలో దున్నడానికి ఉపయోగించే పశువును సూచించే సందర్భానుకూలమైన సాధారణ తెలుగు పదం.
- source_word: וּבַחֲמֹר
  choice: గాడిదను
  rationale: חֲמוֹר కు స్పష్టమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: יַחְדָּו
  choice: కలిపి కట్టి
  rationale: రెండు జంతువులను ఒకే పనికి జతగా ఉపయోగించడమే నిషేధమని వ్యవసాయ సందర్భంలో సహజంగా తెలియజేస్తుంది; 'కలిసి' అనే అర్థాన్ని స్పష్టపరుస్తుంది.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలోని నిషేధ బలం
  choice: ‘దున్నకూడదు’ అనే ప్రత్యక్ష న్యాయ నిషేధంగా అనువదించడం
  alternative: ‘దున్నవద్దు’ అని ఆజ్ఞారూపంలో అనువదించడం
  rationale: మూలంలోని నిషేధార్థక imperfect న్యాయ ఆదేశాన్ని సూచిస్తుంది. ‘దున్నకూడదు’ ఆధునిక తెలుగులో గంభీరమైన ధర్మశాస్త్ర శైలిని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. మూలంలోని ‘కలిసి’ అనే భావం తెలుగులో వ్యవసాయపరంగా స్పష్టంగా ఉండేందుకు ‘కలిపి కట్టి’ అని వ్యక్తీకరించబడింది.
