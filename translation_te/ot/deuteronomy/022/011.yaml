  text: You shall not wear cloth made of wool and linen together[a].
translation:
  language: te
  text: ఉన్ని మరియు నారబట్ట రెండూ కలిసిన వస్త్రాన్ని ధరించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “షాత్నేజ్, ఉన్ని మరియు నారబట్ట కలిసి.” “షాత్నేజ్” అనే అరుదైన పదం ఉన్ని, నారబట్ట కలయికతో చేసిన వస్త్రాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: ధరించకూడదు
  rationale: న్యాయపరమైన సందర్భంలో నిషేధాన్ని తెలిపే ఈ నిర్మాణాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: שַׁעַטְנֵז
  choice: కలిపి నేసిన వస్త్రం
  rationale: అరుదైన హీబ్రూ పదం తరువాత వచ్చే ‘నూలు, అవిసెనార కలిపి’ అనే వివరణతో నిర్దిష్టమైన మిశ్రమ వస్త్రాన్ని సూచిస్తుంది; పదాన్ని లిప్యంతరీకరించడం కంటే భావాన్ని తెలుగులో చెప్పడం సులభంగా అర్థమవుతుంది.
- source_word: צֶמֶר
  choice: నూలు
  rationale: వస్త్ర సందర్భంలో ఇది గొర్రె బొచ్చు నుండి తయారైన ఉన్ని నూలును సూచిస్తుంది; సాధారణ తెలుగు పాఠకులకు ‘నూలు’ సహజంగా ఉంటుంది, అయితే మూలపదార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וּפִשְׁתִּים
  choice: అవిసెనార
  rationale: ఈ పదం అవిసె మొక్క నారను లేదా దానితో చేసిన వస్త్రాన్ని సూచించగలదు; మిశ్రమంగా నేసే పదార్థాన్ని తెలుగులో ‘అవిసెనార’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַחְדָּו
  choice: కలిపి
  rationale: రెండు పదార్థాలు ఒకే వస్త్రంలో కలిసి ఉన్నాయని సహజమైన తెలుగులో తెలియజేస్తుంది.
