    text: 'హీబ్రూ: “షాత్నేజ్, ఉన్ని మరియు నారబట్ట కలిసి.” “షాత్నేజ్” అనే అరుదైన పదం ఉన్ని, నారబట్ట కలయికతో చేసిన వస్త్రాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
