translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన న్యాయ నిషేధంగా అనువదించబడింది. అరుదైన సాంకేతిక పదాన్ని ప్రధాన వాక్యంలో భావానువాదం చేసి, మూలంలోని పదప్రయోగాన్ని పాదసూచికలో భద్రపరిచాం.
