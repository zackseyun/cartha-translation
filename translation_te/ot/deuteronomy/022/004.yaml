  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర ఆజ్ఞకు తగిన గౌరవభరితమైన శైలి. మూలంలోని రెండవ పురుష ఏకవచన సంబోధనను ‘నీ’ రూపంలో ఉంచి, ఆజ్ఞను ‘ఉండకూడదు/లేపాలి’తో సహజంగా వ్యక్తం చేశాం.
