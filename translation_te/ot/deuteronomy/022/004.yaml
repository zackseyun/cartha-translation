id: DEU.22.4
reference: Deuteronomy 22:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: te
  text: నీ సహోదరుని గాడిదగానీ, అతని ఎద్దుగానీ దారిలో పడిపోయి ఉండడం చూసి, వాటిని పట్టించుకోకుండా ఉండకూడదు; అతనితో కలిసి వాటిని తప్పకుండా లేపాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: నీ సహోదరుని
  rationale: మూలంలోని ‘నీ సహోదరుడు’ అనే కుటుంబ-సమాజ భావాన్ని నిలుపుతుంది; ఈ ధర్మశాస్త్ర సందర్భంలో అది నిబంధన సమాజంలోని తోటి సభ్యుని సూచించగలదు.
- source_word: חֲמוֹר
  choice: గాడిద
  rationale: ఆధునిక ప్రామాణిక తెలుగులో ఈ జంతువుకు సహజమైన, స్పష్టమైన పదం.
- source_word: שׁוֹרוֹ
  choice: అతని ఎద్దు
  rationale: పనికి ఉపయోగించే పశువును సూచించే ఈ న్యాయసందర్భంలో שׁוֹרకు ‘ఎద్దు’ సముచితమైన అనువాదం.
- source_word: נֹפְלִים
  choice: పడిపోయి ఉండడం
  rationale: జంతువులు దారిలో కూలి లేదా పడిపోయి ఉన్న స్థితిని తెలిపే participle భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: స్థలాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: వాటిని పట్టించుకోకుండా ఉండకూడదు
  rationale: ఇక్కడి hitpael రూపం ఉద్దేశపూర్వకంగా చూడనట్టు ఉండడం లేదా నిర్లక్ష్యం చేయడం అనే నుడికార భావాన్ని ఇస్తుంది; బహువచన సర్వనామాన్ని ‘వాటిని’గా నిలిపింది.
- source_word: הָקֵם תָּקִים
  choice: తప్పకుండా లేపాలి
  rationale: infinitive absoluteతో కూడిన క్రియ ఆజ్ఞను బలపరుస్తుంది; ‘తప్పకుండా’ ఆ తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עִמּוֹ
  choice: అతనితో కలిసి
  rationale: యజమానితో కలసి సహాయం చేయాలనే మూలంలోని సహకార భావాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
