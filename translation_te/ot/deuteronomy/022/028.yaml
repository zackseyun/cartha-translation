id: DEU.22.28
reference: Deuteronomy 22:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: te
  text: ఒక పురుషుడు వివాహానికి నిశ్చయించబడని[a] కన్యయైన యువతిని కనుగొని, ఆమెను పట్టుకొని[b] ఆమెతో శయనించి, వారిద్దరూ కనుగొనబడితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిశ్చితార్థం కాని.” ఇక్కడి హెబ్రీయ పదం వివాహానికి చట్టబద్ధంగా నిశ్చయించబడని స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హెబ్రీయ క్రియకు “పట్టుకొను,” “బిగించి పట్టుకొను,” లేదా “అదుపులోకి తీసుకొను” అనే అర్థాలు రావచ్చు. ఈ సందర్భంలో అది అత్యాచారాన్ని సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు; మరికొందరు ఆ న్యాయపరమైన భావాన్ని ఈ క్రియ ఒక్కదానినుంచి కాక, విస్తృత సందర్భం నుంచి నిర్ణయించాలని భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי יִמְצָא
  choice: కనుగొని … అయితే
  rationale: ఇది ఒక సందర్భాధారిత న్యాయనియమాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యనిర్మాణంలో షరతును చివరనున్న ‘అయితే’ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: మూలంలోని లింగనిర్దిష్ట ఏకవచన నామవాచకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נער בְתוּלָה
  choice: కన్యయైన యువతిని
  rationale: హెబ్రీయ పదబంధంలోని యౌవనాన్నీ కన్యత్వాన్నీ రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: పెళ్లి నిశ్చయం కాని
  rationale: ఆమె వివాహానికి చట్టబద్ధంగా నిశ్చయించబడలేదనే భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే భాషలో తెలియజేస్తుంది.
- source_word: וּתְפָשָׂהּ
  choice: ఆమెను పట్టుకొని
  rationale: תפשׂ అనే క్రియలోని పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం అనే భావాన్ని నిలుపుతూ, ప్రధాన పాఠ్యంలోనే ‘అత్యాచారం’ అనే మరింత నిర్దిష్ట న్యాయవ్యాఖ్యను చేర్చదు.
- source_word: וְשָׁכַב עִמָּהּ
  choice: ఆమెతో శయనించి
  rationale: లైంగిక సంభోగాన్ని సూచించే హెబ్రీయ నానుడికి తెలుగులో గౌరవప్రదమైన, సుపరిచితమైన సమానార్థక రూపం.
- source_word: וְנִמְצָאוּ
  choice: వారిద్దరూ పట్టుబడితే
  rationale: బహువచన నిష్క్రియ రూపాన్ని నిలుపుతూ, జరిగినది ఇతరులకు తెలిసిపోయిందనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ చర్యను ప్రధాన పాఠ్యంలోనే ‘అత్యాచారం’ అని నిర్దిష్టంగా అనువదించాలా?
  choice: ‘ఆమెను పట్టుకొని ఆమెతో శయనించి’ అనే మూలానికి దగ్గరైన పదప్రయోగాన్ని ఉంచడం
  alternative: ‘ఆమెపై అత్యాచారం చేసి’ లేదా ‘ఆమెను తీసుకొని’
  rationale: תפשׂ శారీరకంగా పట్టుకోవడాన్ని సూచిస్తుంది; అయితే ఈ క్రియ ఒక్కటే చర్యకు సంబంధించిన పూర్తి న్యాయనిర్ణయాన్ని స్పష్టంగా నిర్ధారించదు. ‘పట్టుకొని’ అనేది భావాన్ని మెత్తబరచకుండా నిలుపుతుంది; అదే సమయంలో వివాదాస్పద వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయనియమానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘శయనించి’ అనే మర్యాదపూర్వక బైబిలు నానుడిని ఉంచగా, వివాదాస్పద న్యాయవ్యాఖ్యను పాదటిప్పణిలో వివరించారు.
