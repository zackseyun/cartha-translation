id: DEU.22.9
reference: Deuteronomy 22:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: te
  text: నీ ద్రాక్షతోటలో రెండు రకాల విత్తనాలను కలిపి విత్తవద్దు; లేకపోతే నీవు విత్తిన విత్తనం యొక్క దిగుబడీ, ద్రాక్షతోట పంటా—మొత్తమూ పవిత్రమైనదిగా వేరుచేయబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మొత్తం దిగుబడి పవిత్రమైనదిగా/ప్రతిష్ఠితమైనదిగా అవుతుంది.” అంటే అది సాధారణ వినియోగం కోసం వేరుచేయబడదు. ఈ పదం దానిని తప్పనిసరిగా జప్తు చేస్తారని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: విత్తకూడదు
  rationale: זרע అంటే సాధారణంగా విత్తనం విత్తడం; వ్యవసాయ నియమ సందర్భంలో ‘విత్తు’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: כַּרְמְךָ
  choice: నీ ద్రాక్షతోటలో
  rationale: כרםకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం ‘ద్రాక్షతోట’.
- source_word: כִּלְאָיִם
  choice: రెండు రకాల విత్తనాలను కలిపి
  rationale: כלאים నిషిద్ధమైన భిన్న రకాల కలయికను సూచిస్తుంది. ‘రెండు రకాల’ అనేది సంఖ్యాపరంగా అతిగా కట్టుబడిన అర్థం కావచ్చినా, ఈ నియమంలోని భిన్న జాతుల కలయికను సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘కలిపి’ మిశ్రమ భావాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: అలా చేస్తే
  rationale: פן నివారించవలసిన ప్రతికూల పరిణామాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అలా చేస్తే’ నియమశైలిలో సహజంగా ఆ హెచ్చరికను తెలియజేస్తుంది.
- source_word: תִּקְדַּשׁ
  choice: ప్రతిష్ఠితమై, సాధారణ వినియోగానికి పనికిరాకుండా పోతుంది
  rationale: קדש యొక్క మూలభావమైన ‘పవిత్రపరచబడుట/ప్రతిష్ఠించబడుట’ను నిలుపుతూ, ఈ న్యాయ సందర్భంలో అది సాధారణ వినియోగం నుంచి వేరుచేయబడే పరిణామమని స్పష్టం చేస్తుంది; కేవలం ‘జప్తు అవుతుంది’ అని అర్థాన్ని నిర్ణయించదు.
- source_word: הַמְלֵאָה
  choice: మొత్తం దిగుబడి
  rationale: המלאה ఇక్కడ పంట యొక్క సంపూర్ణ ఫలసాయాన్ని సూచిస్తుంది; ‘మొత్తం దిగుబడి’ సహజమైన వ్యవసాయ పదబంధం.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: నీవు విత్తిన విత్తనపు పంట
  rationale: విత్తిన విత్తనం వల్ల కలిగే ఫలసాయమే పరిణామానికి లోబడుతుందని సందర్భానుసారంగా తెలుపుతుంది.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: ద్రాక్షతోట ఫలసాయం
  rationale: תבואה పంట లేదా ఫలసాయాన్ని సూచిస్తుంది; ద్రాక్షతోట సందర్భంలో ‘ఫలసాయం’ సహజంగా ఉంది.
theological_decisions:
- issue: పరిశుద్ధత-నియమ సందర్భంలో תִּקְדַּשׁ అర్థం
  choice: ‘ప్రతిష్ఠితమై, సాధారణ వినియోగానికి పనికిరాకుండా పోతుంది’ అని అనువదించడం
  alternative: ‘జప్తు అవుతుంది’ లేదా ‘పవిత్రమవుతుంది’
  rationale: హీబ్రూ క్రియ యొక్క ప్రతిష్ఠిత/పవిత్రమైనదిగా వేరుచేయబడే భావాన్ని దాచకుండా, ఇక్కడ అది ప్రశంస కాదు, సాధారణ వినియోగాన్ని కోల్పోయే న్యాయపరమైన పరిణామమని తెలియజేస్తుంది. అది తప్పనిసరిగా దేవాలయానికి జప్తు అవుతుందని వచనం స్పష్టంగా చెప్పనందున ఆ అర్థాన్ని ప్రధాన పాఠ్యంలో విధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయశైలి. హీబ్రూలోని క్లిష్టమైన תִּקְדַּשׁ పదాన్ని పూర్తిగా పరిణామార్థకంగా మార్చకుండా, మూలంలోని ప్రతిష్ఠిత భావాన్నీ ఆచరణాత్మక నిషేధాన్నీ కలిపి వ్యక్తం చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
