revisions:
- from: నీ ద్రాక్షతోటలో రెండు రకాల విత్తనాలను కలిపి విత్తకూడదు. అలా చేస్తే నీవు విత్తిన విత్తనపు పంట, ద్రాక్షతోట ఫలసాయం—రెండింటి మొత్తం దిగుబడీ ప్రతిష్ఠితమై, సాధారణ వినియోగానికి పనికిరాకుండా పోతుంది.[a]
  to: నీ ద్రాక్షతోటలో రెండు రకాల విత్తనాలను కలిపి విత్తవద్దు; లేకపోతే నీవు విత్తిన విత్తనం యొక్క దిగుబడీ, ద్రాక్షతోట పంటా—మొత్తమూ పవిత్రమైనదిగా వేరుచేయబడుతుంది.[a]
  rationale: The revision preserves the Hebrew warning structure and avoids expanding “the seed that you sow” into “the crop from the seed.” It renders the disputed legal sense of תִּקְדַּשׁ with a source-near Telugu expression and leaves the practical consequence to a restrained explanatory footnote.
