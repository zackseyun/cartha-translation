  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: te
  text: నీవు కప్పుకొనే నీ వస్త్రపు నాలుగు మూలలకు కుచ్చులు[a][b] చేసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మెలిపెట్టిన దారాలు’ లేదా ‘అంచు వేలాడుదారాలు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘నీ కప్పుకొనే వస్త్రం’; ‘నీ పైవస్త్రం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: కుచ్చులు
  rationale: వస్త్రపు అంచులకు వేలాడేలా కట్టే దారాల సముదాయాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుచ్చులు’ సహజంగా, స్పష్టంగా ఉంది; మెలిపెట్టిన దారాలు లేదా అంచు జూల్లు అనే భావాలు కూడా సాధ్యమే.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: చేసుకోవాలి
  rationale: న్యాయపరమైన ఆజ్ఞను తెలిపే క్రియతో పాటు వ్యక్తిగత ప్రయోజనాన్ని సూచించే לָּךְ భావాన్ని తెలుగు ఆత్మార్థక నిర్మాణమైన ‘చేసుకోవాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: నాలుగు మూలలపై
  rationale: כָּנָף సాధారణంగా ‘రెక్క’ లేదా ‘కొన’ అని అర్థమిచ్చినా, వస్త్ర సందర్భంలో దాని నాలుగు మూలలు లేదా అంచుల కొనలను సూచిస్తుంది.
- source_word: כְּסוּתְךָ
  choice: నీ వస్త్రం
  rationale: ఈ నామవాచకం కప్పుకొనే వస్తువును, తరచుగా వస్త్రం లేదా పైవస్త్రాన్ని, సూచిస్తుంది. ‘వస్త్రం’ తెలుగులో సహజంగా ఉండి ప్రత్యేక వస్త్ర రకాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: నీవు కప్పుకొనే
  rationale: సంబంధ వాక్యం ఆ వస్త్రపు ఉపయోగాన్ని వివరిస్తుంది. ‘కప్పుకొనే’ అనే రూపం כסה యొక్క మూలభావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
