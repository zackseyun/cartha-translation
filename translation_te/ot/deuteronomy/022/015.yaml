id: DEU.22.15
reference: Deuteronomy 22:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֛ח אֲבִ֥י ה/נער וְ/אִמָּ֑/הּ וְ/הוֹצִ֜יאוּ אֶת בְּתוּלֵ֧י ה/נער אֶל זִקְנֵ֥י הָ/עִ֖יר הַ/שָּֽׁעְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/015.yaml
  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: te
  text: అప్పుడు ఆ యువతి తండ్రి మరియు ఆమె తల్లి ఆ యువతి కన్యత్వానికి సంబంధించిన ఆధారాలను తీసుకొని, పట్టణ ద్వారం వద్దనున్న ఆ పట్టణపు పెద్దల దగ్గరకు తీసుకువెళ్లాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆ యువతి కన్యత్వాలు’; ఇది కన్యత్వానికి సాక్ష్యంగా సమర్పించే రుజువులు లేదా గుర్తులను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తీసుకొని
  rationale: న్యాయపరమైన కార్యవరుసలో ఇది తదుపరి చేయవలసిన చర్యను సూచిస్తుంది; తెలుగులో ‘తీసుకొని’ తరువాతి ‘తీసుకురావాలి’తో సహజంగా కలుస్తుంది.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: ఆ యువతి తండ్రి, ఆమె తల్లి
  rationale: נַעֲרָה ఇక్కడ వివాహ వయసున్న యువతిని సూచిస్తుంది; ‘యువతి’ ఆధునిక, గౌరవప్రదమైన పదం.
- source_word: וְהוֹצִיאוּ
  choice: తీసుకురావాలి
  rationale: హిఫీల్ రూపం ఆధారాలను అధికారుల ఎదుటకు తెచ్చి సమర్పించే చర్యను సూచిస్తుంది; ఈ సందర్భంలో ‘తీసుకురావాలి’ సహజమైన న్యాయపరమైన భావాన్ని ఇస్తుంది.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: ఆ యువతి కన్యత్వానికి సంబంధించిన ఆధారాలను
  rationale: అక్షరార్థంగా బహువచన రూపమైన ‘యువతి కన్యత్వాలు’ ఒక హీబ్రూ నుడికారం; ఈ న్యాయ సందర్భంలో కన్యత్వానికి సాక్ష్యంగా చూపించే గుర్తులు లేదా రుజువులను సూచిస్తుంది.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: పట్టణ పెద్దల వద్దకు
  rationale: אֶל దిశను సూచిస్తుంది; పెద్దలు ఇక్కడ న్యాయాధికారులుగా వ్యవహరిస్తున్నా, మూలంలోని సాధారణ ‘పెద్దలు’ అనే పదాన్నే నిలిపింది.
- source_word: הַשַּׁעְרָה
  choice: పట్టణ ద్వారం దగ్గర ఉన్న
  rationale: దిశాసూచక రూపం ద్వారం వద్దకు వెళ్లడాన్ని సూచిస్తుంది; సందర్భంలో పట్టణ ద్వారం పెద్దలు తీర్పు చెప్పే స్థలం కాబట్టి, తెలుగులో స్థలసంబంధాన్ని స్పష్టంగా తెలిపింది.
