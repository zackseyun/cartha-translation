id: DEU.22.1
reference: Deuteronomy 22:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: te
  text: నీ సోదరుని ఎద్దుగాని అతని గొర్రెగాని దారి తప్పి తిరుగుతున్నట్లు కనిపిస్తే, వాటిని పట్టించుకోకుండా ఉండకూడదు. వాటిని తప్పకుండా నీ సోదరునికి తిరిగి ఇవ్వాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ (ʾāḥîḵā)
  choice: నీ సోదరుని
  rationale: మూలపదం అక్షరార్థంగా ‘నీ సోదరుడు’; ఈ ధర్మశాస్త్ర సందర్భంలో సహ ఇశ్రాయేలీయుడనే విస్తృత భావం ఉండగలిగినా, ఆ భావాన్ని పాఠ్యంలో అనవసరంగా విప్పకుండా మూలరూపాన్ని నిలిపింది.
- source_word: שֵׂיוֹ (śêw)
  choice: అతని గొర్రె
  rationale: ఏకవచన సమూహార్థం లేదా ఒక్క గొర్రె రెండూ సాధ్యమైన మూలరూపాన్ని సహజమైన తెలుగు ఏకవచనంతో నిలిపింది.
- source_word: נִדָּחִים (niddāḥîm)
  choice: దారి తప్పి తిరుగుతూ
  rationale: నిఫాల్ రూపం ‘తప్పిపోయినవి, చెదరిపోయినవి, దూరం వెళ్లిపోయినవి’ అనే పరిధిని కలిగి ఉంది. స్పష్టమైన బాహ్య కర్తను ఊహించే ‘తోలివేయబడినవి’ కంటే, పశువులు యజమాని నుంచి దూరమై తిరుగుతున్న స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: וְהִתְעַלַּמְתָּ (wəhiṯʿallamtā)
  choice: వాటిని చూడనట్టు ఉండకూడదు
  rationale: అక్షరార్థంగా ‘నిన్ను నీవు దాచుకోవడం/కనిపించనట్టు చేసుకోవడం’ అనే భావం; సందర్భంలో బాధ్యతను తప్పించుకోవడానికి ఉద్దేశపూర్వకంగా పట్టించుకోకపోవడాన్ని ఈ తెలుగు ప్రయోగం స్పష్టంగా తెలుపుతుంది.
- source_word: הָשֵׁב תְּשִׁיבֵם (hāšēḇ təšîḇēm)
  choice: వాటిని తప్పకుండా ... తిరిగి తీసుకురావాలి
  rationale: అదే ధాతువు యొక్క infinitive absolute + finite verb నిర్మాణం ఆజ్ఞకు బలమైన నిశ్చయాన్ని ఇస్తుంది; ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘సోదరుడు’ అనే సంబోధన పరిధి
  choice: పాఠ్యంలో ‘నీ సోదరుడు’ అని నిలిపివేయడం
  alternative: ‘నీ తోటి ఇశ్రాయేలీయుడు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: నిబంధన సమాజ సందర్భం విస్తృత సామాజిక బాధ్యతను సూచించినా, మూలంలోని కుటుంబపదాన్ని మార్చకుండా ఉంచడం దాని సహజ మరియు నిబంధనాత్మక భావాల మధ్య ఉన్న పరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో అనువదించబడింది. దీర్ఘమైన హీబ్రూ వాక్యాన్ని సహజ తెలుగు కోసం రెండు వాక్యాలుగా విభజించినా, నిషేధం మరియు సానుకూల ఆజ్ఞ రెండూ యథాతథంగా ఉన్నాయి.
