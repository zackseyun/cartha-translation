    reason: lexical_alternative
  - marker: c
    text: లేదా ‘లైంగిక దుర్నీతికి పాల్పడి.’ హీబ్రూ זנה పదం అక్షరార్థంగా వేశ్యలా ప్రవర్తించడాన్ని సూచించినా, అక్రమ లైంగిక ప్రవర్తనకు విస్తృతార్థంలో కూడా వాడబడుతుంది.
    reason: lexical_alternative
  revision_rationale: శిక్షను మృదువుపరచకుండా సְקָלוּהָ యొక్క రాళ్లతో మరణశిక్ష అనే భావాన్ని స్పష్టం చేయడానికి ‘రాళ్లతో కొట్టి చంపుతారు’ అని సవరించబడింది. ‘వָמֵתָה’లోని ప్రత్యేకంగా చెప్పబడిన మరణఫలితం ఈ తెలుగులో అంతర్లీనంగా ఉండటం వల్ల వేరుగా పునరుక్తి చేయలేదు. ముగింపు సూత్రంలో మూలంలోని రెండవ పురుష సంబోధనను నిలుపడానికి ‘నీవు’ చేర్చబడింది. పాదసూచిక గుర్తులు, వాటి క్రమం, మరియు అర్థాలు యథాతథంగా సరైనవి.
