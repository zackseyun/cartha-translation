  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: te
  text: అప్పుడు వారు ఆ యువతిని[a] ఆమె తండ్రి ఇంటి ప్రవేశద్వారం దగ్గరికి తీసుకొస్తారు. ఆమె తన తండ్రి ఇంట్లో వేశ్యలా ప్రవర్తించి[c], ఇశ్రాయేలులో నీచమైన పని[b] చేసింది కాబట్టి, ఆమె పట్టణంలోని పురుషులు ఆమెను రాళ్లతో కొట్టి చంపుతారు. ఈ విధంగా నీవు నీ మధ్యనుండి ఆ చెడును తొలగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ అమ్మాయిని.’ హీబ్రూ נַעַר సందర్భానుసారం యువ స్త్రీని లేదా అమ్మాయిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అవమానకరమైన పని,’ ‘ఘోరమైన పని.’ హీబ్రూ נְבָלָה నైతికంగా దిగ్భ్రాంతి కలిగించే నీచకార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘లైంగిక దుర్నీతికి పాల్పడి.’ హీబ్రూ זנה పదం అక్షరార్థంగా వేశ్యలా ప్రవర్తించడాన్ని సూచించినా, అక్రమ లైంగిక ప్రవర్తనకు విస్తృతార్థంలో కూడా వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: ఆ యువతిని
  rationale: సందర్భం స్త్రీని సూచిస్తోంది. ఆధునిక ప్రామాణిక తెలుగులో ‘యువతి’ సహజంగా ఉండి, ఆమె యౌవనాన్ని తెలియజేస్తుంది; ‘బాలిక’ అని వయస్సును మరీ కుదించదు.
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: ఆమె తండ్రి ఇంటి ప్రవేశద్వారం దగ్గరికి
  rationale: פֶּתַח అనేది తలుపు పలకను కాక ప్రవేశస్థలాన్ని సూచిస్తుంది. ‘ప్రవేశద్వారం దగ్గరికి’ గమ్యార్థక אֶל‌ను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: ఆమెను రాళ్లతో కొడతారు
  rationale: హీబ్రూలోని చర్యను, రాళ్లు అనే సాధనాన్ని రెండింటినీ స్పష్టంగా ఉంచుతూ తెలుగులో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: אַנְשֵׁי עִירָהּ
  choice: ఆమె పట్టణంలోని పురుషులు
  rationale: אַנְשֵׁי అనే పుంలింగ బహువచనాన్ని సాధారణీకరించి ‘ప్రజలు’ అని చేయకుండా మూలంలోని లింగసూచనను నిలుపుతుంది.
- source_word: נְבָלָה
  choice: నీచమైన పని
  rationale: ఈ న్యాయ-నైతిక సందర్భంలో పదం సాధారణ మూర్ఖత్వాన్ని కాక తీవ్రమైన అవమానకర దుష్కార్యాన్ని సూచిస్తుంది. ‘నీచమైన పని’ ఆధునిక పాఠకులకు స్పష్టంగా, గంభీరంగా ఉంటుంది.
- source_word: לִזְנוֹת
  choice: వేశ్యలా ప్రవర్తించి
  rationale: זנה లోని వేశ్యావృత్తి రూపకాన్ని నిలుపుతూ, డబ్బుకు లైంగిక సేవలు చేసిందని మూలం కంటే సంకుచితంగా నిర్ధారించకుండా ఉంటుంది.
- source_word: בֵּית אָבִיהָ
  choice: తన తండ్రి ఇంట్లో
  rationale: మూలంలోని స్థలార్థాన్ని నేరుగా నిలుపుతుంది; ‘కుటుంబం’ లేదా ‘తండ్రి అధికారంలో’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: ఈ విధంగా నీ మధ్యనుండి ఆ చెడును తొలగించాలి
  rationale: ద్వితీయోపదేశకాండంలోని న్యాయసూత్ర భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ఏకవచన ‘నీ’ మూలంలోని సమూహాన్ని ఉద్దేశించిన ద్వితీయ పురుష ఏకవచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: లైంగిక-న్యాయ పదజాలాన్ని మృదువుపరచకుండా, అతిగా నిర్దిష్టం చేయకుండా అనువదించడం
  choice: ‘నీచమైన పని’, ‘వేశ్యలా ప్రవర్తించి’ అనే బలమైన పదప్రయోగాలను ఉపయోగించడం
  alternative: ‘లైంగిక దుర్నీతికి పాల్పడి’ లేదా ‘అనుచితంగా ప్రవర్తించి’ అని సాధారణీకరించడం
  rationale: ఎంచుకున్న రూపం హీబ్రూ వచనంలోని నైతిక తీవ్రతను, వేశ్యావృత్తి రూపకాన్ని నిలుపుతుంది; అయితే వాణిజ్యపరమైన వ్యభిచారమని తప్పనిసరిగా తేల్చదు.
- issue: చట్ట అమలుదారుల లింగసూచన
  choice: ‘ఆమె పట్టణంలోని పురుషులు’ అని అనువదించడం
  alternative: ‘ఆమె పట్టణ ప్రజలు’ అని లింగతటస్థంగా అనువదించడం
  rationale: మూలంలోని పుంలింగ బహువచన వ్యక్తీకరణను నిలుపుతూ, పాఠ్యంలో లేని విస్తృతీకరణను నివారిస్తుంది.
- issue: ‘చెడును తొలగించడం’ అనే సమూహ న్యాయసూత్రం
  choice: చెడును సమాజం మధ్యనుండి తొలగించాలనే మూలసూత్రాన్ని యథాతథంగా ఉంచడం
  alternative: వ్యక్తిని ‘శుద్ధి చేయడం’ లేదా పాపానికి ప్రాయశ్చిత్తం చేయడం అనే ధార్మిక వివరణను జోడించడం
  rationale: వాక్యం సమాజంలోనుండి చెడును తొలగించే న్యాయపరమైన ఫలితాన్ని చెబుతుంది; విమోచన లేదా ప్రాయశ్చిత్త సిద్ధాంతాన్ని ఇక్కడ చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని పాటించాం. ‘వారు… తీసుకొస్తారు,’ ‘పురుషులు… కొడతారు’ అనే రూపాలు హీబ్రూ వరుస ఆజ్ఞాత్మక-న్యాయ నిర్మాణాన్ని తెలుగులో చదవదగిన విధంగా అందిస్తాయి. హింసాత్మక చర్యను మృదువుపరచలేదు; అలాగే మూలంలో లేని వివరణను చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
