  to: అప్పుడు వారు ఆ యువతిని[a] ఆమె తండ్రి ఇంటి ప్రవేశద్వారం దగ్గరికి తీసుకొస్తారు. ఆమె తన తండ్రి ఇంట్లో వేశ్యలా ప్రవర్తించి[c], ఇశ్రాయేలులో నీచమైన పని[b] చేసింది కాబట్టి, ఆమె పట్టణంలోని పురుషులు ఆమెను రాళ్లతో కొట్టి చంపుతారు. ఈ విధంగా నీవు నీ మధ్యనుండి ఆ చెడును తొలగించాలి.
