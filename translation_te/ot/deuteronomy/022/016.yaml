  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-కథన శైలిని ఉపయోగించాం. ‘పెద్దలు’ అనే పదం స్థానిక న్యాయ నాయకుల భావాన్ని సహజంగా అందిస్తుంది.
