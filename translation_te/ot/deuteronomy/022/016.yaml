id: DEU.22.16
reference: Deuteronomy 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמַ֛ר אֲבִ֥י ה/נער אֶל הַ/זְּקֵנִ֑ים אֶת בִּתִּ֗/י נָתַ֜תִּי לָ/אִ֥ישׁ הַ/זֶּ֛ה לְ/אִשָּׁ֖ה וַ/יִּשְׂנָאֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: te
  text: 'అప్పుడు ఆ యువతి తండ్రి పెద్దలతో ఇలా చెప్పాలి: “నా కుమార్తెను ఈ మనిషికి భార్యగా ఇచ్చాను; కానీ ఇతడు ఆమెను ద్వేషిస్తున్నాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతనికి ఆమెపై ద్వేషం పుట్టింది.” హీబ్రూ క్రియ నేరుగా ‘ద్వేషించు’ అని అర్థమిస్తుంది; దాన్ని ప్రస్తుత వైఖరిగా గానీ, ఏర్పడిన వైఖరిగా గానీ తెలుగులో వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: అప్పుడు ... ఇలా చెప్పాలి
  rationale: ఇది ధర్మశాస్త్రంలోని సందర్భవివరణాత్మక న్యాయనియమం. కాబట్టి సాధారణ భూతకాలంగా కాక, ఆ సందర్భంలో చేయవలసిన చర్యగా ‘చెప్పాలి’ అని అనువదించాం.
- source_word: אֲבִי הַנַּעַר
  choice: ఆ యువతి తండ్రి
  rationale: ఇక్కడ נַעַר అనే రూపం వివాహ సందర్భంలోని యువతిని సూచిస్తోంది. ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘యువతి’ సహజంగా ఉంటుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: ఈ న్యాయ సందర్భంలో ఇది కేవలం వృద్ధులను కాక, సమాజంలోని గుర్తింపు పొందిన న్యాయ/పౌర నాయకులను సూచిస్తుంది.
- source_word: אֶת בִּתִּי
  choice: నా కుమార్తెను
  rationale: אֶת ప్రత్యక్ష కర్మ సూచికను ప్రత్యేకంగా అనువదించనవసరం లేదు; בִּתִּי నేరుగా ‘నా కుమార్తె’ అని అర్థం.
- source_word: נָתַתִּי
  choice: ఇచ్చాను
  rationale: వివాహ ఏర్పాటులో కుమార్తెను వివాహానికి ఇవ్వడం అనే సాధారణ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לָאִישׁ הַזֶּה
  choice: ఈ మనిషికి
  rationale: אִישׁ యొక్క ప్రాథమిక అర్థమైన ‘మనిషి’ని నిలిపి, తదుపరి ‘భార్యగా’ అనే పదబంధం వివాహ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఇది వివాహ సంబంధాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיִּשְׂנָאֶהָ
  choice: కానీ ఇతడు ఆమెను ద్వేషిస్తున్నాడు
  rationale: שׂנא యొక్క నేరమైన అర్థం ‘ద్వేషించు.’ ప్రత్యక్ష ప్రసంగంలో భర్త ప్రస్తుత వైఖరిని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ద్వేషిస్తున్నాడు’ వాడాం; సందర్భంలోని వ్యతిరేక మలుపును ‘కానీ’ స్పష్టం చేస్తుంది.
