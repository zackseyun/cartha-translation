base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: te
  text: అయితే నీ సహోదరుడు నీకు సమీపంలో లేకపోతే[a], అతడు ఎవరో నీకు తెలియకపోతే[b], దానిని నీ ఇంటికి తీసుకురావాలి. నీ సహోదరుడు దాని కోసం వెదికే వరకు అది నీ దగ్గర ఉండాలి; అప్పుడు దానిని అతనికి తిరిగి అప్పగించాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నీ సహోదరుడు’ అనేది కేవలం సొంత అన్నదమ్ముడినే కాక, విస్తృతంగా తోటి ఇశ్రాయేలీయుణ్ణి సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, ‘నీవు అతనిని ఎరుగకపోయినా’; సందర్భంలో యజమాని ఎవరో తెలియకపోవడం భావం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దానిని అతనికి తిరిగి ఇవ్వాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: హీబ్రూ బంధుత్వ పదాన్ని నిలుపుతూ, ద్వితీయోపదేశకాండ న్యాయ సందర్భంలో అది తోటి నిబంధన సమాజ సభ్యునినీ సూచించగలదనే విస్తృతిని పాదటిప్పణిలో తెలిపాం.
- source_word: קָרוֹב אֵלֶיךָ
  choice: నీకు సమీపంలో
  rationale: భౌతిక సమీపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: అతడు ఎవరో నీకు తెలియకపోయినా
  rationale: అక్షరార్థంగా పురుష ఏకవచన కర్మప్రత్యయం ‘అతనిని’ అని ఉన్నప్పటికీ, సందర్భంలో యజమాని ఎవరో తెలియకపోవడమే భావం; వ్యక్తి సూచనను నిలుపుతూ తెలుగులో స్పష్టంగా చెప్పాం.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: దానిని నీ ఇంటికి తీసుకురావాలి
  rationale: తప్పిపోయిన జంతువు లేదా వస్తువును ఇంటిలోకి చేర్చడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָיָה עִמְּךָ
  choice: అది నీ దగ్గర ఉండాలి
  rationale: ‘నీతో ఉండాలి’ అనే మూల భావాన్ని, కొంతకాలం భద్రపరచాలనే సందర్భార్థంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: నీ సహోదరుడు దాని కోసం వెదికే వరకు
  rationale: דרש పదంలోని వెదకడం లేదా ఆరా తీయడం అనే భావాన్ని నిలుపుతుంది.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: దానిని అతనికి తిరిగి అప్పగించాలి
  rationale: హిఫీల్ రూపంలోని తిరిగి చేర్చడం లేదా యజమానికి పునరప్పగించడం అనే న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘సహోదరుడు’ అనే పదం పరిధి
  choice: ప్రధాన వచనంలో ‘సహోదరుడు’ అని నిలుపుట
  alternative: తోటి ఇశ్రాయేలీయుడు
  rationale: మూలంలోని బంధుత్వ భాషను మార్చకుండా ఉంచి, దాని సామాజిక-నిబంధనాత్మక విస్తృతిని పాదటిప్పణిలో వివరించడం ద్వారా ఏ ప్రత్యేక సిద్ధాంతాన్నీ రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకునికి అర్థమయ్యే సరళమైన వాక్య నిర్మాణం. ఏకవచన అనౌపచారిక ‘నీ’ రూపం హీబ్రూ ఏకవచన సంబోధనను అనుసరిస్తుంది.
