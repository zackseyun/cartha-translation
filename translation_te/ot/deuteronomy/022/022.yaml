id: DEU.22.22
reference: Deuteronomy 22:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִמָּצֵ֨א אִ֜ישׁ שֹׁכֵ֣ב עִם אִשָּׁ֣ה בְעֻֽלַת בַּ֗עַל וּ/מֵ֨תוּ֙ גַּם שְׁנֵי/הֶ֔ם הָ/אִ֛ישׁ הַ/שֹּׁכֵ֥ב עִם הָ/אִשָּׁ֖ה וְ/הָ/אִשָּׁ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: te
  text: ఒక పురుషుడు వివాహిత స్త్రీతో[a] శయనిస్తుండగా దొరికితే, ఆ స్త్రీతో శయనించిన పురుషుడూ ఆ స్త్రీయూ ఇద్దరూ మరణించాలి.[b] అలా నీవు ఇశ్రాయేలులోనుండి చెడును నిర్మూలించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘భర్తగల స్త్రీతో,’ అంటే భర్తతో వివాహబంధంలో ఉన్న స్త్రీతో.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మరణించాలి’ అనేది ధర్మశాస్త్రం విధించే మరణశిక్షను సూచిస్తుంది; దీన్ని ‘మరణశిక్షకు గురిచేయాలి’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: దొరికితే
  rationale: מצא యొక్క నిఫాల్ రూపం ఇక్కడ న్యాయపరమైన సందర్భంలో ఆ చర్య బయటపడడాన్ని లేదా కనుగొనబడడాన్ని సూచిస్తుంది. ‘దొరికితే’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: שֹׁכֵב עִם
  choice: తో శయనిస్తూ
  rationale: ఈ హెబ్రీ జాతీయ ప్రయోగం లైంగిక సంభోగాన్ని సూచిస్తుంది. ‘శయనిస్తూ’ మూలంలోని సౌమ్యోక్తిని, న్యాయవాక్యపు గంభీరతను నిలుపుతుంది.
- source_word: בְעֻלַת בַּעַל
  choice: వివాహిత స్త్రీతో
  rationale: ఈ పదబంధం భర్తతో వివాహబంధంలో ఉన్న స్త్రీని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ఆధునిక తెలుగు కోసం ‘వివాహిత స్త్రీ’ అని ఇచ్చి, మూలంలోని మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: వారిద్దరూ మరణించాలి
  rationale: న్యాయసందర్భంలో ఈ రూపం విధించబడిన మరణశిక్షను తెలియజేస్తుంది. ‘మరణించాలి’ హెబ్రీలోని ‘చనిపోవాలి’ అనే ప్రత్యక్ష పదప్రయోగానికి దగ్గరగా ఉండగా, న్యాయపరమైన అమలు భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה וְהָאִשָּׁה
  choice: ఆ స్త్రీతో శయనించిన పురుషుడు, ఆ స్త్రీ
  rationale: హెబ్రీలో ఇద్దరినీ తిరిగి స్పష్టంగా పేర్కొన్న న్యాయపరమైన పునరుక్తిని నిలిపి, ఇద్దరిపైనా శిక్ష వర్తిస్తుందని స్పష్టం చేస్తుంది.
- source_word: וּבִעַרְתָּ הָרָע
  choice: అలా నీవు ... చెడును నిర్మూలించాలి
  rationale: ద్వితీయోపదేశకాండంలోని స్థిర న్యాయసూత్రంలో בער అనేది సమాజం మధ్యనుండి చెడును పూర్తిగా తొలగించడాన్ని సూచిస్తుంది. ‘నిర్మూలించాలి’ దాని బలమైన నైతిక-న్యాయ భావాన్ని అందిస్తుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులోనుండి
  rationale: మూలంలోని מן విభక్తి ఇశ్రాయేలు సమాజం మధ్యనుండి తొలగింపును సూచిస్తుంది; ఈ రూపం సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: בְעֻלַת בַּעַל అనే వివాహస్థితి పదబంధం
  choice: వివాహిత స్త్రీ
  alternative: భర్తగల స్త్రీ / భర్తతో వివాహబంధంలో ఉన్న స్త్రీ
  rationale: మూలం ఆమె వివాహబంధంలో ఉన్నదనే విషయాన్ని నొక్కి చెబుతుంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు రూపాన్ని వాడి, అక్షరార్థ ఛాయను పాదసూచికలో నిలిపాం; స్త్రీని ఆస్తిగా చూపించే అనవసర భావాన్ని దిగుమతి చేయలేదు.
- issue: మరణశిక్షను అమలు చేయడాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చెప్పాలా
  choice: మరణించాలి
  alternative: మరణశిక్ష విధించాలి / చంపబడాలి
  rationale: న్యాయసందర్భం ఇది విధించబడిన మరణశిక్ష అని స్పష్టం చేస్తున్నప్పటికీ, హెబ్రీ వాక్యం అక్షరార్థంగా ‘మరణించాలి’ అంటుంది. అందువల్ల ప్రధాన పాఠ్యం మూలానికి దగ్గరగా ఉండి, న్యాయపరమైన భావాన్ని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన న్యాయశైలిని అనుసరించాం. లైంగిక చర్యకు మూలంలోని సౌమ్యోక్తిని ‘శయనిస్తూ’ ద్వారా నిలిపాం. ఆజ్ఞలోని ఏకవచన ద్వితీయ పురుషాన్ని ‘నీవు’ అని స్పష్టంగా ఉంచాం; పునరుక్తిని న్యాయస్పష్టత కోసం కాపాడాం.
