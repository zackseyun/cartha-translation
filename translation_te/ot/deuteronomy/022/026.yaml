id: DEU.22.26
reference: Deuteronomy 22:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: te
  text: అయితే ఆ యువతికి నీవు ఏమీ చేయకూడదు. ఆ యువతికి మరణశిక్షకు పాత్రమైన పాపం లేదు. ఒకడు తన పొరుగువానిపై లేచి అతనిని హత్య చేసినట్లుగా, ఈ విషయం కూడా అలాగే ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: అయితే ఆ యువతికి
  rationale: మునుపటి వచనంలో పురుషునికి విధించిన శిక్షతో ఉన్న వ్యత్యాసాన్ని וְ సూచిస్తోంది. ఈ న్యాయ సందర్భంలో נַעַר అనేది మునుపు ప్రస్తావించిన నిశ్చితార్థమైన యువతిని సూచిస్తుంది.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: ఏమీ చేయకూడదు
  rationale: ఆమెపై ఎలాంటి శిక్షాత్మక చర్యా తీసుకోరాదనే సంపూర్ణ న్యాయ నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: మరణశిక్షకు తగిన పాపం ఆ యువతిలో లేదు
  rationale: అక్షరార్థంగా ‘ఆ యువతికి మరణపు పాపం లేదు.’ సందర్భానుసారం ఇది మరణదండనకు పాత్రమైన నేరదోషం లేదనే న్యాయపరమైన భావాన్ని కలిగి ఉంది; ‘పాపం’ అనే మూలపద భావాన్నీ నిలుపుతుంది.
- source_word: כִּי כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: ఒకడు తన పొరుగువానిపై దాడిచేసి
  rationale: యָקוּם עַל అనే ప్రయోగం ఇక్కడ విరోధంగా లేచి దాడి చేయడాన్ని సూచిస్తుంది. ‘పొరుగువాడు’ రֵעַ యొక్క సంబంధపరమైన న్యాయ సందర్భాన్ని నిలుపుతుంది.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: అతణ్ణి హత్య చేసినప్పుడు
  rationale: רצח సాధారణంగా చట్టవిరుద్ధంగా ప్రాణం తీయడాన్ని సూచిస్తుంది; అందువల్ల ‘చంపు’ కంటే ‘హత్య చేయు’ ఖచ్చితమైనది. క్రియలోని సర్వనామ ప్రత్యయం బాధితుడైన పొరుగువానిని సూచిస్తుంది.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: ఈ విషయం కూడా అలాగే ఉంది
  rationale: హత్యకోసం చేసిన దాడితో ప్రస్తుత కేసును పోల్చే హీబ్రూ ఉపమాన ముగింపును రూపకల్పనను అతిగా వివరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: యువతి నిర్దోషిత్వ స్వభావం
  choice: ఈ కేసులో యువతికి మరణశిక్షను కోరే పాపదోషం లేదని న్యాయపరంగా పేర్కొనడం
  alternative: ఆమెకు అన్ని విధాలా సంపూర్ణ నైతిక నిర్దోషిత్వం ఉందని విస్తృతంగా పేర్కొనడం
  rationale: חֵטְא מָוֶת అనే పదబంధం ఈ ధర్మశాస్త్ర సందర్భంలో మరణదండనకు పాత్రమైన దోషాన్ని సూచిస్తుంది. పాఠ్యం చెప్పేదానికంటే విస్తృతమైన నైతిక లేదా సిద్ధాంతపరమైన నిర్ధారణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని హత్య-దాడి పోలికను స్పష్టంగా ఉంచుతూ, మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
