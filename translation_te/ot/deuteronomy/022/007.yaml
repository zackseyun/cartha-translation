source:
  edition: WLC
  text: שַׁלֵּ֤חַ תְּשַׁלַּח֙ אֶת הָ/אֵ֔ם וְ/אֶת הַ/בָּנִ֖ים תִּֽקַּֽח לָ֑/ךְ לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וְ/הַאֲרַכְתָּ֖ יָמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: te
  text: తల్లిని తప్పక విడిచిపెట్టు[a]; పిల్లలను మాత్రం నీ కోసం తీసుకోవచ్చు[b]. అలా చేస్తే నీకు మేలు కలుగుతుంది, నీవు దీర్ఘకాలం జీవిస్తావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “విడిచిపెట్టు” అనే క్రియ రెండుసార్లు వచ్చి ఆజ్ఞను బలంగా ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “కుమారులను”; పక్షిగూడు సందర్భంలో ఇది పిల్లలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “నీ రోజులను పొడిగిస్తావు”; అంటే, దీర్ఘకాలం జీవిస్తావు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: తప్పక విడిచిపెట్టు
  rationale: క్రియావిశేషణార్థక infinitive absolute తో అదే ధాతువు గల finite verb కలయిక ఆజ్ఞను బలపరుస్తుంది. ఆధునిక తెలుగులో ‘తప్పక’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: הָאֵם
  choice: తల్లిని
  rationale: సమీప సందర్భం పక్షిగూడు గురించి కావడంతో ‘తల్లి’ అనేది స్పష్టంగా ఉంది; మూలంలో లేని ‘పక్షి’ని ప్రధాన పాఠ్యంలో చేర్చాల్సిన అవసరం లేదు.
- source_word: הַבָּנִים
  choice: పిల్లలను
  rationale: అక్షరార్థంగా ‘కుమారులు/పిల్లలు’; పక్షిగూడు సందర్భంలో సంతానాన్ని సూచిస్తుంది. ‘పిల్లలు’ సహజంగా ఉండి, అతిగా నిర్దిష్టమైన ‘పక్షిపిల్లలు’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: תִּקַּח לָךְ
  choice: నీ కోసం తీసుకోవచ్చు
  rationale: తల్లిని విడిచిపెట్టాలనే ఆజ్ఞ తరువాత ఇది సందర్భానుసారంగా అనుమతిని సూచిస్తుంది. ‘నీ కోసం’ לָךְ భావాన్ని నిలుపుతుంది.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: అప్పుడు నీకు మేలు కలుగుతుంది
  rationale: లక్ష్యాన్ని లేదా ఫలితాన్ని తెలిపే నిబంధనాత్మక ఆశీర్వాద సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: నీవు దీర్ఘకాలం జీవిస్తావు
  rationale: అక్షరార్థంగా ‘రోజులను పొడిగిస్తావు’; ఇది దీర్ఘాయుష్షును తెలిపే హీబ్రూ నుడికారం. ఎంపిక చేసిన రూపం తెలుగులో సహజంగా అదే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: వాగ్దానం చేసిన ఫలితం యొక్క స్వభావం
  choice: విధేయతకు అనుసంధానమైన నిబంధనాత్మక ఆశీర్వాదం లేదా ఫలితంగా వాక్యాన్ని అనువదించడం
  alternative: ప్రతి వ్యక్తిగత సందర్భంలోనూ తప్పక జరిగే యాంత్రికమైన దీర్ఘాయుష్షు హామీగా స్పష్టీకరించడం
  rationale: לְמַעַן నిర్మాణం ఉద్దేశం లేదా ఫలితాన్ని, దానికి అనుసంధానమైన ఆశీర్వాదాన్ని తెలియజేస్తుంది. మూలపాఠ్యం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టమైన హామీని అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఏకవచన సంబోధనను నిలిపి, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ఉద్ఘాటిత ఆజ్ఞ, అనుమతి, ఆశీర్వాద ఫలితం మధ్య ఉన్న భేదాలను స్పష్టంగా ఉంచాం.
