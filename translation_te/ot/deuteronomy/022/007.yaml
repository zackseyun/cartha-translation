  to: తల్లిని తప్పక విడిచిపెట్టు[a]; పిల్లలను మాత్రం నీ కోసం తీసుకోవచ్చు[b]. అలా చేస్తే నీకు మేలు కలుగుతుంది, నీవు దీర్ఘకాలం జీవిస్తావు[c].
  rationale: The revision replaces the merely temporal “అప్పుడు” with “అలా చేస్తే,” which naturally communicates the Hebrew purpose/result formula in this context. It also improves footnote a while retaining all source-sensitive lexical and theological ambiguity. Footnote markers remain attached to their corresponding terms.
