revisions:
- from: నీవు కొత్త ఇల్లు కట్టినప్పుడు, నీ పైకప్పుకు చుట్టూ రక్షణ గోడ[a] కట్టాలి. ఎవరైనా దానిమీద నుంచి పడిపోతే, ఆ రక్తదోషం నీ ఇంటిమీదికి రాకుండా ఇలా చేయాలి.
  to: నీవు కొత్త ఇల్లు కట్టినప్పుడు, ఎవరైనా నీ పైకప్పు మీదనుంచి పడిపోతే నీ ఇంటిమీద రక్తదోషం రాకుండా, దాని చుట్టూ అంచుగోడ కట్టాలి.[a]
  rationale: The revision corrects Telugu idiom, identifies the roof explicitly as the place from which a person might fall, and retains the source’s command to construct a protective roof-edge barrier so that bloodguilt does not come upon the house. The footnote preserves the lexical alternatives and the historical flat-roof setting.
