    rationale: Placing the preventive purpose before the commanded action produces a clearer Telugu legal instruction while retaining the source meaning.
  revised_text: నీవు కొత్త ఇల్లు కట్టినప్పుడు, ఎవరైనా నీ పైకప్పు మీదనుంచి పడిపోతే నీ ఇంటిమీద రక్తదోషం రాకుండా, దాని చుట్టూ అంచుగోడ కట్టాలి.[a]
