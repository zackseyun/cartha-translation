language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: te
  text: నీవు కొత్త ఇల్లు కట్టినప్పుడు, ఎవరైనా నీ పైకప్పు మీదనుంచి పడిపోతే నీ ఇంటిమీద రక్తదోషం రాకుండా, దాని చుట్టూ అంచుగోడ కట్టాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, చదునైన పైకప్పు అంచు చుట్టూ పడిపోకుండా కట్టే పిట్టగోడ లేదా రక్షణ కంచె.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కట్టినప్పుడు
  rationale: ఇక్కడ כִּי కారణాన్ని కాకుండా నియమంలోని సందర్భాన్ని పరిచయం చేస్తుంది; అందువల్ల ‘అప్పుడు’ భావం సహజం.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: నీవు కొత్త ఇల్లు కట్టినప్పుడు
  rationale: క్రియ, కర్మ, విశేషణాల స్పష్టమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְעָשִׂיתָ
  choice: కట్టాలి
  rationale: న్యాయవాక్య సందర్భంలో ఈ రూపానికి ఆజ్ఞాత్మక బలం ఉంది; ‘కట్టాలి’ ఆ విధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַעֲקֶה
  choice: రక్షణ గోడ
  rationale: చదునైన పైకప్పు అంచు చుట్టూ పడిపోకుండా నిర్మించే అడ్డుగోడను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְגַגֶּךָ
  choice: నీ పైకప్పుకు చుట్టూ
  rationale: హీబ్రూ ఉపసర్గ సంక్షిప్తమైనప్పటికీ, రక్షణ గోడ పైకప్పు అంచు చుట్టూ ఉండే సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: ఆ రక్తదోషం నీ ఇంటిమీదికి రాకుండా
  rationale: ‘రక్తాలను ఉంచడం’ అనే హీబ్రూ నుడికారానికి నిరోధించగల మరణానికి కలిగే నైతిక-న్యాయ బాధ్యత అనే భావం ఉంది; ‘రక్తదోషం’ దానిని నిలుపుతుంది.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: ఎవరైనా ... పడిపోతే
  rationale: హీబ్రూలోని ‘పడేవాడు పడితే’ అనే పునరుక్త నిర్మాణం ఒక అనిర్దిష్ట సంభావ్య వ్యక్తిని సూచిస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: מִמֶּנּוּ
  choice: దానిమీద నుంచి
  rationale: సర్వనామం సమీపంలోని పైకప్పు లేదా ఇంటి నిర్మాణాన్ని సూచిస్తుంది; ‘దాని’ అనే రూపం మూలంలోని సూచనాత్మక సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: న్యాయ సందర్భంలో דָּמִים భావం
  choice: రక్తదోషం
  alternative: రక్తపాతం; రక్తానికి సంబంధించిన అపరాధం
  rationale: ఈ వాక్యం కేవలం రక్తం కారడాన్ని కాకుండా, నివారించగల మరణానికి ఇంటి యజమానిపై వచ్చే నైతిక-న్యాయ బాధ్యతను సూచిస్తుంది. ‘రక్తదోషం’ ఆ ఉద్వేగాన్ని అదనపు సిద్ధాంతార్థం జోడించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే స్పష్టతతోనూ అనువదించబడింది. ‘పిట్టగోడ’ ప్రాంతానుసారం భిన్నంగా అర్థమయ్యే అవకాశం ఉన్నందున ప్రధాన పాఠ్యంలో ‘రక్షణ గోడ’ను ఉంచి, ప్రత్యామ్నాయ పదాలను పాదటిప్పణిలో ఇచ్చాం.
