language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: te
  text: ఒక పురుషునికి వివాహ నిశ్చయం చేయబడిన కన్యయైన యువతి ఉంటే, మరొక పురుషుడు ఆమెను పట్టణంలో కనుగొని ఆమెతో శయనిస్తే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: ఉండగా … శయనిస్తే
  rationale: హీబ్రూ న్యాయశైలిలోని ఊహాత్మక సందర్భాన్ని తెలుగులో సహజమైన షరతు వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: נער
  choice: యువతి
  rationale: వివాహ వయస్సులోని స్త్రీని సూచించే ఆధునిక, గౌరవప్రదమైన పదం.
- source_word: בְתוּלָה
  choice: కన్య
  rationale: మూలంలోని కన్యత్వ సూచనను సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: ఒక పురుషునితో వివాహ నిశ్చయం చేయబడి
  rationale: ఇది సాధారణ ఆధునిక నిశ్చితార్థం కంటే చట్టబద్ధంగా బలమైన వివాహ ఒప్పందమని ప్రధాన పాఠంలో సహజంగా తెలియజేస్తుంది.
- source_word: וּמְצָאָהּ אִישׁ
  choice: మరొక పురుషుడు ఆమెను కనుగొని
  rationale: మూలంలో కేవలం ‘ఒక పురుషుడు’ ఉన్నా, వివాహ నిశ్చయం జరిగిన పురుషుని నుండి ఇతన్ని వేరుచేయడానికి సందర్భానుగుణంగా ‘మరొక’ అని స్పష్టం చేస్తుంది.
- source_word: בָּעִיר
  choice: పట్టణంలో
  rationale: తదుపరి న్యాయ నిర్ణయానికి ప్రాధాన్యమైన స్థల సూచనను నిలుపుతుంది.
- source_word: וְשָׁכַב עִמָּהּ
  choice: ఆమెతో శయనిస్తే
  rationale: లైంగిక సంభోగాన్ని సూచించే మూలంలోని సభ్యోక్తిని, న్యాయపరమైన గంభీర శైలిని నిలుపుతుంది.
theological_decisions:
- issue: ఈ వచనంలో లైంగిక చర్య బలవంతమైనదని స్పష్టంగా చెప్పాలా?
  choice: ‘ఆమెతో శయనిస్తే’ అని తటస్థంగా అనువదించడం
  alternative: ‘ఆమెపై అత్యాచారం చేస్తే’ లేదా ‘ఆమెను బలవంతం చేస్తే’
  rationale: ఈ వచనంలోని క్రియ స్వయంగా బలవంతాన్ని నిర్దేశించదు. కాబట్టి పరిసర వచనాల ఆధారంగా ఇక్కడే తీర్మానాన్ని చేర్చకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘శయనిస్తే’ అనే సభ్యోక్తి మూల శైలిని నిలుపుతుంది.
