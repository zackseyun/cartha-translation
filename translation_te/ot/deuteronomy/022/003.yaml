source:
  edition: WLC
  text: וְ/כֵ֧ן תַּעֲשֶׂ֣ה לַ/חֲמֹר֗/וֹ וְ/כֵ֣ן תַּעֲשֶׂה֮ לְ/שִׂמְלָת/וֹ֒ וְ/כֵ֣ן תַּעֲשֶׂ֜ה לְ/כָל אֲבֵדַ֥ת אָחִ֛י/ךָ אֲשֶׁר תֹּאבַ֥ד מִמֶּ֖/נּוּ וּ/מְצָאתָ֑/הּ לֹ֥א תוּכַ֖ל לְ/הִתְעַלֵּֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: te
  text: అలాగే అతని గాడిద విషయంలోనూ చేయాలి; అతని పైవస్త్రం విషయంలోనూ అలాగే చేయాలి. నీ సహోదరుని దగ్గర నుంచి పోయిన ఏ వస్తువైనా నీకు దొరికితే, దాని విషయంలోనూ అలాగే చేయాలి. నీవు చూసీచూడనట్లు ఉండకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ఇంకా పదబద్ధంగా, “నిన్ను నీవు దాచుకోకూడదు”; అంటే, గమనించనట్లు నటించకూడదు.
    reason: హెబ్రీ ఆత్మనేపద క్రియలోని ‘తనను తాను దాచుకోవడం’ అనే మూలచిత్రాన్ని చూపించి, సందర్భంలోని భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וְכֵן תַּעֲשֶׂה
  choice: అలాగే ... చేయాలి
  rationale: ముందటి వచనంలోని ఆజ్ఞను కొనసాగిస్తూ, హెబ్రీ పునరుక్త న్యాయశైలిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַחֲמֹרוֹ
  choice: అతని గాడిద విషయంలోనూ
  rationale: לְ ఉపసర్గ ఇక్కడ ఆ వస్తువుకు సంబంధించి అదే విధంగా వ్యవహరించాలనే భావాన్ని ఇస్తుంది; ‘విషయంలో’ తెలుగు న్యాయసందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: לְשִׂמְלָתוֹ
  choice: అతని పైవస్త్రం విషయంలోనూ
  rationale: שִׂמְלָה సాధారణంగా బయట ధరించే వస్త్రాన్ని సూచిస్తుంది; ‘పైవస్త్రం’ నిర్దిష్టతను కాపాడుతూ ఆధునిక పాఠకులకు అర్థమయ్యే పదం.
- source_word: לְכָל אֲבֵדַת אָחִיךָ
  choice: నీ సహోదరుని ... ఏ వస్తువైనా
  rationale: పేరుపెట్టి చెప్పిన వాటి నుంచి పోయిన అన్ని రకాల వస్తువులకు ధర్మాన్ని విస్తరిస్తుంది. אָחִיךָ లోని ఏకవచన పురుష బంధుత్వ భాషను ‘సహోదరుడు’గా నిలిపింది.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: నీ సహోదరుని దగ్గర నుంచి పోయిన
  rationale: హెబ్రీ వాక్యం నేరుగా ‘అతడు పోగొట్టుకున్న’ అని కర్తృవాచ్యంలో చెప్పకుండా, ఆ వస్తువు అతని దగ్గర నుంచి పోయిందని చెబుతుంది; తెలుగు రూపం ఆ సూక్ష్మతను కాపాడుతుంది.
- source_word: וּמְצָאתָהּ
  choice: నీకు దొరికితే
  rationale: వస్తువు ఆజ్ఞను వినేవారికి దొరికే వరుస సంఘటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  choice: నీవు చూసీచూడనట్లు ఉండకూడదు
  rationale: న్యాయసందర్భంలోని నిషేధాన్ని స్పష్టంగా తెలియజేస్తూ, బాధ్యత నుంచి తప్పించుకోవడానికి గమనించనట్లు నటించే హెబ్రీ ఆత్మనేపద భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆחִיךָ అనే నిబంధన-సమాజ బంధుత్వ పదం
  choice: నీ సహోదరుడు
  alternative: నీ తోటి ఇశ్రాయేలీయుడు
  rationale: ఈ సందర్భంలో పదం నిబంధన సమాజంలోని సభ్యుణ్ణి సూచించవచ్చుగానీ, మూలంలోని పురుష ఏకవచన బంధుత్వ రూపాన్ని విస్తరించి వ్యాఖ్యానించకుండా ప్రధాన పాఠ్యంలో నిలిపింది.
- issue: לֹא תוּכַל לְהִתְעַלֵּם అనే నిషేధపు బలం
  choice: నీవు చూసీచూడనట్లు ఉండకూడదు
  alternative: నిన్ను నీవు దాచుకోలేవు
  rationale: పదబద్ధ రూపంలో తనను తాను దాచుకోవడం అనే చిత్రం ఉన్నా, ఈ న్యాయసందర్భంలో అది బాధ్యతను తప్పించుకోవద్దనే నిషేధం. ప్రధాన పాఠ్యం ఆ కార్యబలాన్ని ఇస్తుంది; పాదసూచిక మూలచిత్రాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయశైలి. హెబ్రీలోని ‘అలాగే చేయాలి’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం. పాదసూచిక సూచిక [a] సంబంధిత చివరి నిషేధం వద్ద ఉంచబడింది.
