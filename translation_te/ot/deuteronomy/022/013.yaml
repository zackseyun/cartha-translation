  yaml_path: translation/ot/deuteronomy/022/013.yaml
  text: If a man takes a wife and goes in to her[a], and then hates her,
translation:
  language: te
  text: ఒక పురుషుడు ఒక స్త్రీని పెళ్లి చేసుకొని, ఆమె దగ్గరకు వెళ్లి[a], ఆమెను ద్వేషిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమె దగ్గరకు వెళ్లి.” హీబ్రూ వాక్యప్రయోగంలో ఇది దాంపత్య లైంగిక సంబంధాన్ని సూచించే సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఒక ... అయితే
  rationale: ఇక్కడ כִּי న్యాయపరమైన ఒక సందర్భాన్ని షరతుగా పరిచయం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ‘-తే’ నిర్మాణం సహజంగా ఆ షరతును తెలియజేస్తుంది.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ఒక పురుషుడు ఒక స్త్రీని పెళ్లి చేసుకొని
  rationale: לקח యొక్క మూలార్థం ‘తీసుకొను’ అయినా, אִשָּׁהతో కూడిన ఈ వివాహ సందర్భంలో ‘పెళ్లి చేసుకొను’ అనేది ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థక ప్రయోగం. אִישׁ యొక్క పురుష లింగ సూచనను ‘పురుషుడు’ నిలుపుతుంది.
- source_word: וּבָא אֵלֶיהָ
  choice: ఆమెతో శారీరకంగా కలిసిన తరువాత
  rationale: ఈ హీబ్రూ సభ్యోక్తి వివాహ సంబంధమైన లైంగిక కలయికను సూచిస్తుంది. పదప్రతిపదార్థమైన ‘ఆమె వద్దకు వెళ్లి’ ఆధునిక తెలుగులో ఉద్దేశించిన అర్థాన్ని స్పష్టంగా అందించదు; ‘శారీరకంగా కలిసిన’ అనేది గౌరవప్రదంగానూ అర్థవంతంగానూ ఉంటుంది. ‘తరువాత’ వరుస చర్యలను సహజంగా తెలుపుతుంది.
- source_word: וּשְׂנֵאָהּ
  choice: ఆమెను ద్వేషిస్తే
  rationale: שׂנא యొక్క బలమైన భావాన్ని ‘ద్వేషించు’ నేరుగా నిలుపుతుంది; దానిని ‘ఇష్టపడకపోవు’ లేదా ‘తిరస్కరించు’గా మృదువుచేయలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయ-కథన శైలి వాడబడింది. లైంగిక సంబంధానికి సంబంధించిన హీబ్రూ సభ్యోక్తి యొక్క మర్యాదపూర్వక స్వరాన్ని నిలుపుతూ, ప్రధాన వచనంలో అర్థం స్పష్టంగా చెప్పి అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
