  to: అప్పుడు వారిద్దరినీ ఆ పట్టణ ద్వారం దగ్గరికి తీసుకువచ్చి[a], వారిమీద రాళ్లతో కొట్టి చంపాలి. పట్టణంలో కేక వేయనందుకు ఆ యువతిని, తన పొరుగువాని భార్యను అవమానించినందుకు[b] ఆ పురుషుణ్ణి చంపాలి. ఈ విధంగా నీ మధ్యనుండి ఆ చెడును తొలగించాలి.
  rationale: The revision corrects the reversed referent of ‘both of them,’ removes the added concessive nuance, and explicitly states the identical penalty for the man rather than using an unclear ‘do so.’ It keeps the source’s difficult legal rationale and the lexical ambiguity of עִנָּה without importing contemporary legal or doctrinal conclusions. Footnote anchors remain correctly attached to the city gate and to עִנָּה respectively.
