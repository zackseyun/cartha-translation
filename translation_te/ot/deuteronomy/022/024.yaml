source:
  edition: WLC
  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: te
  text: అప్పుడు వారిద్దరినీ ఆ పట్టణ ద్వారం దగ్గరికి తీసుకువచ్చి[a], వారిమీద రాళ్లతో కొట్టి చంపాలి. పట్టణంలో కేక వేయనందుకు ఆ యువతిని, తన పొరుగువాని భార్యను అవమానించినందుకు[b] ఆ పురుషుణ్ణి చంపాలి. ఈ విధంగా నీ మధ్యనుండి ఆ చెడును తొలగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రాచీన ఇశ్రాయేలు పట్టణాల్లో పట్టణ ద్వారం న్యాయ విచారణలు, తీర్పులు జరిగే సాధారణ బహిరంగ స్థలం.
    reason: cultural_note
  - marker: b
    text: ఇక్కడి హీబ్రూ క్రియకు ‘అవమానించాడు,’ ‘బాధించాడు,’ లేదా ఈ సందర్భంలో ‘లైంగికంగా హింసించాడు’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם אֶת שְׁנֵיהֶם
  choice: మీరిరువురినీ ... తీసుకొచ్చి
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో చూపుతూ, ఇద్దరినీ స్పష్టంగా సూచిస్తుంది.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: ఆ పట్టణ ద్వారం దగ్గరికి
  rationale: ప్రాచీన పట్టణ ద్వారం న్యాయ విచారణ జరిగే బహిరంగ స్థలమనే భావాన్ని ప్రధాన వచనంలో అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים וָמֵתוּ
  choice: వారు చనిపోయేలా వారిమీద రాళ్లు రువ్వాలి
  rationale: రాళ్లతో కొట్టడాన్ని స్పష్టంగా తెలిపి, తరువాతి మరణాన్ని ఆ చర్య ఫలితంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הנער
  choice: ఆ యువతిని
  rationale: లిఖిత రూపం అస్పష్టత కలిగించినా צָעֲקָה అనే స్త్రీలింగ క్రియ వల్ల ఇక్కడ స్త్రీ ఉద్దేశించబడిందని స్పష్టం; ‘యువతి’ వయస్సును అనవసరంగా కుదించదు.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: పట్టణంలో ఉన్నప్పటికీ కేక వేయనందుకు
  rationale: తీర్పుకు వచనం తెలిపే కారణాన్ని కాపాడుతుంది; పట్టణ పరిస్థితికి ఉన్న వ్యత్యాస భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עִנָּה
  choice: లైంగికంగా అవమానించినందుకు
  rationale: ఈ లైంగిక-న్యాయ సందర్భంలో క్రియ సూచించే అవమానం/హింసను నిలుపుతూ, ఆధునిక న్యాయపదమైన ‘అత్యాచారం’ను మూలానికి మించి నిర్దిష్టం చేయదు.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: తన పొరుగువాని భార్యను
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులోనూ, సామాజిక-ఒడంబడిక సంబంధాన్ని యథాతథంగానూ ఉంచుతుంది.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: నీ మధ్యనుండి ఆ చెడును తొలగించాలి
  rationale: ద్వితీయోపదేశకాండలో పునరావృతమయ్యే న్యాయసూత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యువతి దోషానికి వచనం చెప్పే న్యాయ కారణం
  choice: పట్టణంలో ఉన్నప్పటికీ కేక వేయనందుకు
  alternative: పట్టణంలో సహాయం కోసం పిలవనందుకు
  rationale: మూలవచనం స్వయంగా కేక వేయకపోవడాన్నే తీర్పు కారణంగా చెబుతుంది. అనుమతి లేదా ఆధునిక న్యాయ ప్రమాణాలపై మూలానికి మించిన నిర్ణయాన్ని అనువాదం చేర్చదు.
- issue: లైంగిక న్యాయ సందర్భంలో עִנָּה అనువాదం
  choice: లైంగికంగా అవమానించినందుకు
  alternative: లైంగికంగా హింసించినందుకు; అత్యాచారం చేసినందుకు
  rationale: క్రియలోని హింస, అవమాన భావాలను కాపాడుతూ, ఈ సందర్భంలో మూలపదం కంటే సన్నని ఆధునిక న్యాయ నిర్వచనాన్ని రుద్దదు.
- issue: וָמֵתוּ యొక్క సంబంధం
  choice: వారు చనిపోయేలా
  alternative: అప్పుడు వారు చనిపోతారు
  rationale: రాళ్లు రువ్వడం తరువాత కలిగే మరణ ఫలితాన్ని సహజంగా తెలియజేస్తుంది; ఇది కేవలం వేరొక సంఘటనగా కాక శిక్ష ఫలితంగా అర్థమయ్యేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ శైలిని వాడాం. మూలంలోని ఏకవచన-బహువచన మార్పును సాధ్యమైనంత సహజంగా ఉంచాం; అయితే ప్రారంభంలోని సంబోధనను స్పష్టత కోసం బహువచనంగా, ముగింపు సూత్రాన్ని మూలంలోని ఏకవచనానికి అనుగుణంగా ‘నీ’ అని ఇచ్చాం.
