source:
  edition: WLC
  text: וְ/הִנֵּה ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵ/אמֹ֗ר לֹֽא מָצָ֤אתִי לְ/בִתְּ/ךָ֙ בְּתוּלִ֔ים וְ/אֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑/י וּ/פָֽרְשׂוּ֙ הַ/שִּׂמְלָ֔ה לִ/פְנֵ֖י זִקְנֵ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: te
  text: “ఇదిగో, ‘నీ కుమార్తె కన్యత్వానికి సంబంధించిన గుర్తులు నాకు దొరకలేదు’ అంటూ ఇతడు ఆమెపై అపవాదాలు మోపాడు. అయితే ఇవే నా కుమార్తె కన్యత్వానికి ఆధారాలు[a].” అప్పుడు వారు ఆ వస్త్రాన్ని[b] పట్టణ పెద్దల ఎదుట పరచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కుమార్తె కన్యత్వానికి గుర్తులు/సాక్ష్యాలు.”
    reason: lexical_alternative
  - marker: b
    text: ఈ వస్త్రాన్ని ఈ న్యాయవ్యవహారంలో ఆధారంగా పట్టణ పెద్దల ఎదుట పరుస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆరోపణపై శ్రద్ధను ఆకర్షించే హీబ్రూ సంభాషణా సూచకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: ఆమెపై అపవాదపు ఆరోపణలు మోపాడు
  rationale: ‘పెట్టడం’ మరియు ‘ఆరోపణకు ఆధారమైన మాటలు/నిందారోపణలు’ అనే న్యాయసంబంధ ప్రయోగాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ఆమెపై’ సందర్భం నుంచి పూరించబడింది.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: నీ కుమార్తెలో కన్యత్వం నాకు కనిపించలేదు
  rationale: హీబ్రూలోని ‘నీ కుమార్తెకు కన్యత్వాలు నాకు దొరకలేదు’ అనే అసాధారణ బహువచన ప్రయోగాన్ని అతిగా వ్యాఖ్యానించకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: అయితే ఇవే నా కుమార్తె కన్యత్వానికి ఆధారాలు
  rationale: ఈ న్యాయ సందర్భంలో בְּתוּלִים అనే బహువచనం కన్యత్వానికి సంబంధించిన గుర్తులు లేదా సాక్ష్యాలను సూచిస్తుంది; ‘ఆధారాలు’ న్యాయపరమైన భావాన్ని సహజంగా ఇస్తుంది.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: వారు ఆ వస్త్రాన్ని పరచాలి
  rationale: చట్టపరమైన వరుస చర్యను ‘పరచాలి’ తెలియజేస్తుంది; שִׂמְלָה ను దాని ఖచ్చిత స్వరూపాన్ని అనవసరంగా నిర్దేశించకుండా ‘వస్త్రం’గా అనువదించింది.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: పట్టణ పెద్దల ఎదుట
  rationale: న్యాయాధికారుల సమక్షంలో సాక్ష్యాన్ని ఉంచడాన్ని సూచించే ప్రామాణిక, సహజ తెలుగు ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన సందర్భం స్పష్టంగా ఉండేలా గౌరవప్రదమైన సాధారణ శైలిని ఉపయోగించాం. మూలంలోని ప్రత్యక్ష ఉల్లేఖన నిర్మాణాన్ని నిలిపి, ‘కన్యత్వం’ మరియు దానికి సంబంధించిన ఆధారాల మధ్య ఉన్న భావ ఉద్వేగాన్ని అతిగా వివరణ ఇవ్వకుండా పరిరక్షించాం.
