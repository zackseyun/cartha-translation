id: DEU.22.25
reference: Deuteronomy 22:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: te
  text: అయితే పొలంలో ఒక పురుషుడు పెళ్లి నిశ్చయమైన యువతిని కనుగొని, ఆమెను బలంగా పట్టుకొని[a] ఆమెతో శయనిస్తే, ఆమెతో శయనించిన ఆ పురుషుడు మాత్రమే మరణించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమెను అదుపులోకి తీసుకొని,’ ‘ఆమెను బలవంతం చేసి.’ హీబ్రూ పదం అక్షరార్థంగా బలంగా పట్టుకోవడాన్ని సూచిస్తుంది; చుట్టూ ఉన్న ధర్మశాస్త్ర సందర్భం ఈ చర్య ఆమె సమ్మతి లేకుండా జరిగిందని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: మునుపటి న్యాయపరిస్థితికి భిన్నమైన షరతును పరిచయం చేసే సందర్భోచిత వ్యతిరేక భావాన్ని తెలియజేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: బయట పొలంలో
  rationale: שׂדה అనే పదానికి నేరుగా ‘పొలం’ అనే అర్థం ఉంది; పట్టణానికి వెలుపల, సహాయం అందని ప్రదేశమనే సందర్భభేదాన్ని ‘బయట’ సహజంగా సూచిస్తుంది.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: పెళ్లి నిశ్చయమైన యువతిని
  rationale: స్త్రీని సూచించే సందర్భాన్ని ‘యువతి’ స్పష్టం చేస్తుంది; ארשׂ సూచించే చట్టబద్ధమైన వివాహ వాగ్దానాన్ని సాధారణ ఆధునిక తెలుగులో ‘పెళ్లి నిశ్చయమైన’ అని వ్యక్తం చేస్తుంది.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: ఆమెను బలంగా పట్టుకొని
  rationale: חזק హిఫీల్ రూపం బలవంతంగా పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం సూచిస్తుంది. ఈ అనువాదం బలప్రయోగాన్ని తెలియజేస్తూనే మూలపదంలో లేని ప్రత్యేక క్రియను నేరుగా చేర్చదు.
- source_word: וְשָׁכַב עִמָּהּ
  choice: ఆమెతో శయనిస్తే
  rationale: లైంగిక సంభోగాన్ని సూచించే హీబ్రూ నానుడికి ఇది గౌరవప్రదమైన, మూలానికి సన్నిహితమైన తెలుగు రూపం.
- source_word: וּמֵת ... לְבַדּוֹ
  choice: ఆ పురుషుడు మాత్రమే మరణించాలి
  rationale: న్యాయసందర్భంలోని విధివాచక ఫలితాన్ని ‘మరణించాలి’ తెలియజేస్తుంది; לבדו ఆ శిక్ష యువతికి కాక పురుషునికి మాత్రమే వర్తిస్తుందని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: లైంగిక హింసను మూలంలోని חזק కంటే మరింత స్పష్టంగా ప్రధాన వాక్యంలో చెప్పాలా?
  choice: ‘ఆమెను బలంగా పట్టుకొని’ అని ఉంచడం
  alternative: ‘ఆమెపై అత్యాచారం చేసి’ లేదా ‘ఆమెను బలవంతం చేసి’
  rationale: తదుపరి వచనాలతో కూడిన న్యాయసందర్భం ఇది సమ్మతి లేని చర్య అని స్పష్టం చేస్తుంది. అయినప్పటికీ ఇక్కడి ప్రత్యేక క్రియ חזק అంటే పట్టుకోవడం, బలంగా అదుపులోకి తీసుకోవడం; అది స్వతంత్రంగా ‘అత్యాచారం చేయడం’ అనే ప్రత్యేక క్రియ కాదు. అందువల్ల మూలభాష పారదర్శకతను కాపాడుతూ బలప్రయోగాన్ని ప్రధాన పాఠ్యంలో చూపించి, మరింత స్పష్టమైన భావాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపాఠ్యానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. ‘శయనిస్తే’ అనే సంప్రదాయ గౌరవప్రద నానుడిని ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
