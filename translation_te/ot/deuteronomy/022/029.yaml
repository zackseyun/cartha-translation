  source_fidelity: మూలంలోని న్యాయవిధి, యాభై షెకెలుల వెండి చెల్లింపు, వివాహస్థితి, లైంగిక అవమానం/ఉల్లంఘనకు కారణసూచన, జీవితకాల విడాకుల నిషేధం అన్నీ ముసాయిదాలో ప్రధానంగా సరిగ్గా ఉన్నాయి. అయితే ‘ఆమె అతనికి భార్య కావాలి’ కంటే ‘ఆమె అతనికి భార్య అవుతుంది’ మూలంలోని ఫలితాత్మక న్యాయనిర్ణయాన్ని మరింత నేరుగా తెలియజేస్తుంది.
