source:
  edition: WLC
  text: וְ֠/נָתַן הָ/אִ֨ישׁ הַ/שֹּׁכֵ֥ב עִמָּ֛/הּ לַ/אֲבִ֥י ה/נער חֲמִשִּׁ֣ים כָּ֑סֶף וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔/הּ לֹא יוּכַ֥ל שַׁלְּחָ֖/ה כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: te
  text: అప్పుడు ఆమెతో శయనించిన పురుషుడు ఆ యువతి తండ్రికి యాభై షెకెల్ల వెండి ఇవ్వాలి. అతడు ఆమెను లైంగికంగా అవమానపరిచాడు[a] కాబట్టి ఆమె అతనికి భార్య అవుతుంది. అతడు తన జీవితాంతం ఆమెకు విడాకులు ఇవ్వకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమెను అణగదొక్కాడు/కించపరిచాడు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ఇలాంటి భావం ఉంది; ఇక్కడ అది లైంగికంగా చేసిన అవమానకరమైన హానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆమెను పంపివేయకూడదు’; ఈ వివాహ న్యాయసందర్భంలో అది ఆమెను విడిచిపెట్టడం లేదా విడాకులు ఇవ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: అప్పుడు ... ఇవ్వాలి
  rationale: న్యాయవిధిలోని వరుస చర్యను ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది; ‘ఇవ్వాలి’ ఆజ్ఞాత్మక బాధ్యతను నిలుపుతుంది.
- source_word: הַשֹּׁכֵב עִמָּהּ
  choice: ఆమెతో శయనించిన
  rationale: లైంగిక చర్యను సూచించే హీబ్రూ భాగాన్ని మర్యాదపూర్వకమైన, స్పష్టమైన న్యాయశైలిలో వ్యక్తపరుస్తుంది.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: ఆ యువతి తండ్రికి
  rationale: נַעֲרָה వివాహయోగ్య వయస్సులోని యువతిని సూచిస్తుంది; ‘యువతి’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: యాభై షెకెలుల వెండి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యాభై వెండి’ ఉన్నా, ఈ ఆర్థిక సందర్భంలో ఉద్దేశించిన బరువు ప్రమాణాన్ని ‘షెకెలులు’ స్పష్టం చేస్తుంది.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: ఆమె అతనికి భార్య కావాలి
  rationale: ఫలితంగా ఏర్పడవలసిన వివాహస్థితిని సహజ తెలుగులో తెలుపుతుంది; యాజమాన్య భావాన్ని అనవసరంగా చేర్చదు.
- source_word: תַּחַת אֲשֶׁר
  choice: కాబట్టి
  rationale: ఈ న్యాయవాక్యంలో తీర్పుకు కారణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עִנָּהּ
  choice: ఆమెను లైంగికంగా అవమానపరిచాడు
  rationale: పియేల్ రూపంలోని ఈ క్రియ లైంగిక సందర్భంలో ఆమెకు కలిగించిన అవమానం, హాని, దిగజార్చడాన్ని సూచిస్తుంది. ఈ అనువాదం దోషాన్ని తక్కువ చేయకుండా, ఈ ఒక్క క్రియకన్నా మరీ నిర్దిష్టమైన అర్థాన్ని బలవంతంగా రుద్దదు.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: ఆమెకు విడాకులు ఇవ్వకూడదు
  rationale: అక్షరార్థంగా ‘ఆమెను పంపివేయలేడు’; వివాహ న్యాయసందర్భంలో ఇది భార్యను విడిచిపెట్టడం లేదా విడాకులు ఇవ్వడాన్ని సూచిస్తుంది. ఆధునిక పాఠకునికి ‘విడాకులు ఇవ్వకూడదు’ స్పష్టంగా ఉంటుంది.
- source_word: כָּל יָמָיו
  choice: తన జీవితాంతం
  rationale: ‘అతని దినాలన్నీ’ అనే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: లైంగిక హానిని సూచించే עִנָּהּ అనే క్రియను తక్కువ చేయకుండా, మూలపదం కంటే అతినిర్దిష్టంగా చేయకుండా అనువదించడం
  choice: ఆమెను లైంగికంగా అవమానపరిచాడు
  alternative: ఆమెపై అత్యాచారం చేశాడు; ఆమెను అవమానపరిచాడు; ఆమెను కించపరిచాడు
  rationale: ముందున్న సందర్భం తీవ్రమైన లైంగిక దోషానికి సంబంధించినదైనా, ఈ వాక్యం బలవంతాన్ని నేరుగా తెలిపే మరింత నిర్దిష్ట క్రియకు బదులు ענה ను వాడుతుంది. ‘లైంగికంగా అవమానపరిచాడు’ తీవ్రతను నిలుపుతూ ఆ పదభేదాన్ని చెరపదు; ‘అవమానపరిచాడు’ మాత్రమే అంటే లైంగిక సందర్భం మసకబారవచ్చు, ‘అత్యాచారం చేశాడు’ అంటే ఈ క్రియ స్వయంగా చెప్పినదానికంటే ఎక్కువ నిర్దిష్టత రావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘శయనించిన’ అనే పదం లైంగిక చర్యను మర్యాదగా సూచిస్తుంది; ‘లైంగికంగా అవమానపరిచాడు’ మూలంలోని తీవ్రతతో పాటు కొంత అర్థవిస్తృతిని నిలుపుతుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట సరిగా ఉంచబడ్డాయి.
