  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: te
  text: అయితే, ఈ విషయం నిజమైతే, ఆ యువతికి కన్యత్వపు ఆనవాళ్లు కనిపించకపోతే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ యువతికి కన్యత్వానికి సంబంధించిన సాక్ష్యాలు కనిపించకపోతే.” హీబ్రూ పదం בְּתוּלִים అక్షరార్థంగా “కన్యత్వం” అని అర్థం కావచ్చు; ఈ ప్రాచీన న్యాయాచార సందర్భంలో అది కన్యత్వపు ఆనవాళ్లు లేదా సాక్ష్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి వచనంలోని పరిస్థితికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: אֱמֶת הָיָה הַדָּבָר הַזֶּה
  choice: ఈ విషయం నిజమై
  rationale: న్యాయపరమైన సందర్భంలో דָּבָר ను అతిగా నిర్దిష్టం చేయకుండా ‘విషయం’గా, predicative אֱמֶת ను ‘నిజం’గా అందిస్తుంది; తరువాతి షరతుతో వాక్యాన్ని సహజంగా కలుపుతుంది.
- source_word: לֹא נִמְצְאוּ בְתוּלִים
  choice: కన్యత్వపు ఆనవాళ్లు కనిపించకపోతే
  rationale: בְּתוּלִים యొక్క బహువచన రూపాన్నీ, ఈ ప్రాచీన న్యాయాచార సందర్భంలో ఉద్దేశించిన భౌతిక సూచనల భావాన్నీ ‘ఆనవాళ్లు’ సహజంగా తెలియజేస్తుంది.
- source_word: לַנַּעֲרָ
  choice: ఆ యువతికి
  rationale: నַעֲרָה వివాహయోగ్య వయస్సులోని యువ స్త్రీని సూచిస్తుంది; ל ఉపసర్గను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘-కి’తో అందించింది.
