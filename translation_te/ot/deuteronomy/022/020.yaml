translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన సందర్భానికి తగిన గంభీరతతో అనువదించబడింది. ‘కన్యత్వపు ఆనవాళ్లు’ అనే పదబంధం మూలంలోని బహువచన రూపాన్నీ సందర్భార్థాన్నీ కాపాడుతుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచింది.
