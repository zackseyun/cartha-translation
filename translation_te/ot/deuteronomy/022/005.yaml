source:
  edition: WLC
  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: te
  text: పురుషునికి చెందిన సామగ్రిని స్త్రీ ధరించకూడదు[a]; పురుషుడు స్త్రీ వస్త్రాన్ని వేసుకోకూడదు. ఎందుకంటే వీటిని చేసేవారందరూ నీ దేవుడైన యెహోవాకు హేయులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్త్రీ పురుషుని వస్త్రాన్ని ధరించకూడదు.” మొదటి వాక్యభాగంలోని హీబ్రూ పదం, రెండవ వాక్యభాగంలో వాడిన నిర్దిష్టమైన ‘వస్త్రం’ అనే పదం కంటే విస్తృతార్థకమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: పురుషునికి చెందిన సామగ్రి
  rationale: כְלִי అనే పదం వస్త్రం కంటే విస్తృతమైనది; అది వస్తువు, పరికరం లేదా సామగ్రిని సూచించగలదు. రెండవ అర్ధవాక్యంలో వస్త్రానికి ప్రత్యేకమైన שִׂמְלָה ఉన్నందున, రెండు పదాల మధ్య తేడాను నిలుపుతూ ‘సామగ్రి’ అని అనువదించాం.
- source_word: עַל אִשָּׁה
  choice: స్త్రీ ధరించకూడదు
  rationale: అక్షరార్థంగా ‘స్త్రీ మీద ఉండకూడదు.’ వస్త్రం లేదా సామగ్రి ఒకరి మీద ఉండడం అనే వాడుకలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ధరించకూడదు’ అని వ్యక్తం చేశాం.
- source_word: יִלְבַּשׁ
  choice: వేసుకోకూడదు
  rationale: ఈ క్రియ దుస్తులు ధరించడాన్ని లేదా వేసుకోవడాన్ని సూచిస్తుంది. రెండవ అర్ధవాక్యంలోని నిర్దిష్ట వస్త్రసందర్భానికి ‘వేసుకోకూడదు’ సహజంగా సరిపోతుంది.
- source_word: שִׂמְלַת אִשָּׁה
  choice: స్త్రీ వస్త్రం
  rationale: שִׂמְלָה సాధారణంగా వస్త్రాన్ని లేదా పైదుస్తిని సూచిస్తుంది. ఒక నిర్దిష్ట దుస్తురకంగా అనవసరంగా కుదించకుండా ‘వస్త్రం’ అనే పదం దాని అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: גֶּבֶר / אִשָּׁה
  choice: పురుషుడు / స్త్రీ
  rationale: మూలపాఠం పురుషుణ్ణి, స్త్రీని స్పష్టంగా పరస్పరం భేదిస్తుంది; అందువల్ల లింగభేదాన్ని యథాతథంగా నిలిపాం.
- source_word: תוֹעֲבַת יְהוָה
  choice: యెహోవాకు హేయులు
  rationale: תוֹעֵבָה దేవుని దృష్టిలో తీవ్రమైన అసహ్యతను సూచించే బలమైన నిబంధనాత్మక పదం. ‘హేయులు’ ఆ తీవ్రతను గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; יהוהను ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: వీటిని చేసే ప్రతి ఒక్కరూ
  rationale: కృదంత నిర్మాణంలోని సాధారణీకరణను, כָּל పదంలోని సమగ్ర భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలిపే రూపం ఇది.
theological_decisions:
- issue: మొదటి నిషేధంలోని כְלִי גבר పరిధి
  choice: ‘పురుషునికి చెందిన సామగ్రి’ అని విస్తృతంగా అనువదించడం
  alternative: ‘పురుషుని వస్త్రం’ లేదా ‘పురుషుని ఆయుధం/పరికరం’
  rationale: మొదటి అర్ధవాక్యంలో విస్తృతార్థకమైన כְלִי, రెండవ అర్ధవాక్యంలో వస్త్రానికి ప్రత్యేకమైన שִׂמְלָה ఉన్నాయి. కాబట్టి ఇది కేవలం దుస్తులనే సూచిస్తుందా, లేక ఇతర పురుషసంబంధ సామగ్రినీ కలుపుతుందా అనే సందిగ్ధతను అనువాదం ఏకపక్షంగా పరిష్కరించలేదు.
- issue: లింగాన్ని సూచించే భాష
  choice: ‘స్త్రీ’, ‘పురుషుడు’ అనే స్పష్టమైన పదాలను వాడడం
  alternative: లింగనిరపేక్షమైన ‘వ్యక్తి’ లేదా ‘ఎవరైనా’
  rationale: హీబ్రూ పాఠం స్త్రీ, పురుషులను స్పష్టంగా భేదిస్తుంది; ఆ భేదాన్ని అనువాదంలో నిలిపాం.
- issue: תוֹעֲבַת יְהוָה యొక్క బలం
  choice: చర్యలను మాత్రమే కాక వాటిని చేసేవారిని ‘యెహోవాకు హేయులు’ అని చెప్పడం
  alternative: ‘ఈ పనులు యెహోవాకు అసహ్యమైనవి’
  rationale: హీబ్రూ వాక్యనిర్మాణంలో ‘వీటిని చేసే ప్రతి ఒక్కరూ’ అనే వ్యక్తులే תוֹעֲבָהగా పేర్కొనబడ్డారు. ఆ కఠినమైన ధార్మిక ఉద్వేగాన్ని మెత్తబరచకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘సామగ్రి’ ద్వారా మూలంలోని విస్తృతార్థాన్ని, ‘వస్త్రం’ ద్వారా రెండవ అర్ధవాక్యంలోని నిర్దిష్టతను వేరు చేసి చూపించాం. వాక్యంలోని నిషేధాత్మక, నిబంధనాత్మక తీవ్రతను తగ్గించలేదు.
