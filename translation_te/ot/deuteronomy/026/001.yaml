id: DEU.26.1
reference: Deuteronomy 26:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: te
  text: నీ దేవుడైన యహ్వే నీకు స్వాస్థ్యంగా ఇస్తున్న దేశంలోకి నీవు ప్రవేశించి, దాన్ని స్వాధీనం చేసుకొని[a], అందులో నివసించినప్పుడు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాన్ని సొంతం చేసుకొని.’ కొన్ని సందర్భాల్లో ఈ హీబ్రూ క్రియకు ‘వారసత్వంగా పొందు’ అనే అర్థం కూడా ఉంటుంది; ఇక్కడ దేశాన్ని స్వాధీనం చేసుకోవడమే ప్రధాన భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అందులో స్థిరపడి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …చేసినప్పుడు
  rationale: ఈ హీబ్రూ సూత్రప్రయోగం భవిష్యత్తులో ఏర్పడే పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో సహజమైన కాలార్థక ఉపవాక్యంగా చివర ‘చేసినప్పుడు’ అని ఇచ్చాం.
- source_word: תָבֹוא אֶל־הָאָרֶץ
  choice: దేశంలోకి నీవు ప్రవేశించి
  rationale: בוא మరియు אֶל కలయిక కేవలం దేశం వైపు వెళ్లడాన్ని కాక, దానిలోకి ప్రవేశించడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబోధనను నిలిపి, తెలుగులో ‘యహ్వే’తో సహజంగా అనుసంధానించాం.
- source_word: נֹתֵן לְךָ
  choice: నీకు … ఇస్తున్న
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న లేదా సమీప భవిష్యత్తులో నెరవేరే కార్యాన్ని సూచించగలదు; ‘ఇస్తున్న’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: ఈ పదం కేటాయించబడిన వారసత్వ ఆస్తిని సూచిస్తుంది. ‘స్వాస్థ్యం’ భూదానపు వారసత్వ స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וִירִשְׁתָּהּ
  choice: దాన్ని స్వాధీనం చేసుకొని
  rationale: భూమికి సంబంధించిన సందర్భంలో ירשׁ దానిని ఆక్రమించి ఆధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది; ముందు వచ్చిన ‘స్వాస్థ్యం’తో అనవసర పునరుక్తిని కూడా ఇది నివారిస్తుంది.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: అందులో నివసించినప్పుడు
  rationale: ישׁב ఇక్కడ స్థిరంగా ఉండడం లేదా నివాసం ఏర్పరచుకోవడం అనే భావంలో ఉంది. ‘నివసించు’ ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: దేవుని భూదానం మరియు ఇశ్రాయేలు స్వాధీనపరచుకోవడం మధ్య సంబంధం
  choice: ‘నీకు స్వాస్థ్యంగా ఇస్తున్న’ అనే దైవకార్యాన్ని, ‘స్వాధీనం చేసుకొని’ అనే మానవ కార్యం నుంచి వేరుగా నిలిపాం
  alternative: భూమిని పొందడమనే ఒకే సరళ ప్రకటనగా రెండింటినీ కలపడం
  rationale: హీబ్రూ వాక్యం ప్రవేశించడం, దేవుడు ఇవ్వడం, స్వాధీనం చేసుకోవడం, నివసించడం అనే వరుసను చూపుతుంది. ఈ వరుస దైవదానాన్నీ మానవ స్వాధీనతనూ రెండింటినీ ఉద్వేగాన్ని తొలగించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని రెండవ పురుష ఏకవచన సంబోధనను ‘నీ/నీవు’ రూపాలతో నిలిపాం. వాక్యం తరువాతి వచనంతో వ్యాకరణపరంగా కొనసాగుతుందని సూచించడానికి చివర కామా ఉంచాం.
