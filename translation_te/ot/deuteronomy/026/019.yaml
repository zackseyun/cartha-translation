  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: te
  text: ఆయన చేసిన అన్ని జనాంగాలకంటే నిన్ను ఉన్నతంగా ఉంచడానికి, స్తుతికీ, కీర్తికీ[a], శోభకూ[b], అలాగే ఆయన చెప్పినట్లుగా[c] నీవు నీ దేవుడైన యెహోవాకు పవిత్ర ప్రజగా ఉండడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పేరుకు’; ఇక్కడ ‘పేరు’ అంటే ప్రఖ్యాతి లేదా కీర్తి కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మహిమకు’; హెబ్రీ పదం శోభ, వైభవం లేదా మహిమను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆయన వాగ్దానం చేసినట్లుగా’; అక్షరార్థంగా, ‘ఆయన చెప్పినట్లుగా.’
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: సమస్త జనాలకంటే నిన్ను ఉన్నతంగా ఉంచడానికి
  rationale: נתן తో עֶלְיוֹן ఇక్కడ స్థానం లేదా గౌరవంలో ఉన్నతంగా చేయడాన్ని సూచిస్తుంది. తులనాత్మక עַל భావాన్ని సహజమైన తెలుగులో ‘కంటే’తో వ్యక్తం చేశాం.
- source_word: אֲשֶׁר עָשָׂה
  choice: ఆయన చేసిన
  rationale: עשה అనే సాధారణ క్రియను ‘చేసిన’గా ఉంచడం వల్ల ‘సృష్టించిన’ అనే మరింత నిర్దిష్ట భావాన్ని అనవసరంగా చేర్చకుండా మూలంలోని విస్తృత అర్థం నిలుస్తుంది.
- source_word: לִתְהִלָּה
  choice: స్తుతికి
  rationale: תְּהִלָּה యొక్క ప్రధాన భావమైన praise ను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וּלְשֵׁם
  choice: కీర్తికి
  rationale: שֵׁם అక్షరార్థంగా ‘పేరు’ అయినా, ఈ సందర్భంలో పేరు ద్వారా కలిగే ప్రఖ్యాతి లేదా కీర్తిని సూచిస్తుంది. ‘పేరుకు’ కంటే ‘కీర్తికి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וּלְתִפְאָרֶת
  choice: శోభకు
  rationale: תִּפְאֶרֶת లోని సౌందర్యం, వైభవం, మహిమ అనే అర్థపరిధిని ‘శోభ’ విస్తృతంగా ప్రతిబింబిస్తుంది; ‘మహిమ’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ
  choice: నీవు ... పవిత్ర ప్రజగా ఉండడానికి
  rationale: ప్రత్యయంతో ఉన్న infinitive construct యొక్క ఉద్దేశ్య/ఫలిత భావాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది. קָדוֹשׁ ను ‘పవిత్ర’గా అనువదించడం వేరుగా ఉంచబడిన, దేవునికి అంకితమైన ప్రజ అనే భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాకు
  rationale: లామెద్ సూచించే సంబంధం లేదా చెందిన భావాన్ని ‘యెహోవాకు’ సహజంగా తెలియజేస్తుంది; יהוה అనే వ్యక్తిగత నామాన్ని తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: ఆయన చెప్పినట్లుగా
  rationale: דבר అక్షరార్థంగా మాట్లాడడం లేదా చెప్పడాన్ని సూచిస్తుంది. నిబంధన సందర్భంలో వాగ్దాన భావం ఉండవచ్చుగానీ, ప్రధాన పాఠ్యంలో దానిని స్పష్టంగా చేర్చకుండా మూలంలోని సాధారణ క్రియను నిలిపాం.
theological_decisions:
- issue: చివరి ఉపవాక్యాన్ని స్పష్టంగా వాగ్దానంగా అనువదించాలా
  choice: ఆయన చెప్పినట్లుగా
  alternative: ఆయన వాగ్దానం చేసినట్లుగా
  rationale: మూలంలోని דבר అంటే ‘చెప్పాడు/మాట్లాడాడు’; సందర్భం వాగ్దానాన్ని సూచించవచ్చు, కాని క్రియ స్వయంగా దానిని నిర్దిష్టం చేయదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- issue: יהוה అనే దైవనామాన్ని ఎలా చూపాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఇది సాధారణ బిరుదు కాక దేవుని వ్యక్తిగత నామం. తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ దైవనామం మరియు ‘ప్రభువు’ అనే బిరుదు మధ్య తేడాను నిలుపుతుంది.
- issue: תִּפְאֶרֶת లోని సౌందర్యం–మహిమ అర్థపరిధి
  choice: శోభ
  alternative: మహిమ
  rationale: ఈ నామవాచకం సౌందర్యం, వైభవం, మహిమలను సూచించగలదు. ‘శోభ’ దాని దృశ్య/వైభవ భావాన్ని నిలుపుతుంది; ‘మహిమ’ కూడా సముచితమైన సందర్భార్థం కాబట్టి పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఈ వచనం ముందరి వాక్యాన్ని కొనసాగించే ఉద్దేశ్య నిర్మాణంగా ఉన్నందున ‘ఉంచడానికి ... ఉండడానికి’ అనే సమాంతర నిర్మాణాన్ని నిలిపాం. స్తుతి–కీర్తి–శోభ అనే త్రయాన్ని సంక్షిప్త నామవాచకాలతో కాపాడాం.
