source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న నీ దేశం నుండి నీవు తెచ్చే నేల పంటలన్నిటి ప్రథమఫలాల్లో కొంతను తీసుకొని[a], దానిని ఒక గంపలో పెట్టి, తన నామం అక్కడ నివసించేలా చేయడానికి నీ దేవుడైన యాహ్వే ఎన్నుకొనే స్థలానికి వెళ్లాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత వివరణాత్మకంగా: “నేల పంటలన్నిటిలో మొదటిభాగంలో కొంత.”'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “తన నామం అక్కడ నివసించేలా చేయడానికి.” యాహ్వే తన ఆరాధనా సన్నిధి కోసం ఎన్నుకొనే స్థలాన్ని సూచించడానికి ద్వితీయోపదేశకాండంలో వాడే ప్రత్యేక అభివ్యక్తి ఇది.
    reason: theological_idiom
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తీసుకొని
  rationale: న్యాయపరమైన ఆదేశాల వరుసలో ఉన్న క్రియను తెలుగులో సహజంగా తదుపరి ఆజ్ఞతో అనుసంధానిస్తుంది.
- source_word: מֵרֵאשִׁית כָּל־פְּרִי הָאֲדָמָה
  choice: నేల పంటలన్నిటిలో మొదట పండిన వాటిలో కొంత
  rationale: מִן వల్ల మొత్తం ప్రథమఫలాలన్నీ కాక వాటిలో కొంత అనే భావాన్ని, רֵאשִׁית వల్ల తొలి దిగుబడి భావాన్ని, פְּרִי הָאֲדָמָה వల్ల విస్తృతమైన వ్యవసాయ పంటల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: దేశం నుండి నీవు తెచ్చే
  rationale: בוא హిఫీల్ రూపంలోని ‘తీసుకురావడం’ అనే గమన భావాన్ని కాపాడుతుంది; ‘కోయడం’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: నీ దేవుడైన యాహ్వే నీకు ఇస్తున్న
  rationale: వర్తమాన కృదంతం నֹתֵן లోని కొనసాగుతున్న దాన భావాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచుతుంది.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: దాన్ని ఒక గంపలో పెట్టాలి
  rationale: טֶנֶא పంటలను మోసే గంపను సూచిస్తుంది; సమిష్టి పంట భాగాన్ని ‘దాన్ని’ అని ఏకవచనంగా సూచించడం తెలుగులో సహజం.
- source_word: וְהָלַכְתָּ אֶל־הַמָּקוֹם
  choice: స్థలానికి వెళ్లాలి
  rationale: ఆదేశ క్రమాన్ని స్పష్టమైన ఆధునిక తెలుగు విధ్యర్థక రూపంలో అందిస్తుంది.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: తన నామం అక్కడ నివసించేలా చేయడానికి
  rationale: שכן హిఫీల్ రూపంలోని కారణార్థాన్ని, అలాగే ద్వితీయోపదేశకాండంలోని ‘నామం నివసించడం’ అనే ప్రత్యేక అభివ్యక్తిని సరళీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם అనే పవిత్రస్థల సూత్రవాక్యం
  choice: తన నామం అక్కడ నివసించేలా చేయడానికి
  alternative: తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: దేవుడు ఆ స్థలంలో భౌతికంగా పరిమితుడని చెప్పకుండా, ఆయన నామం అక్కడ నివసిస్తుందనే మూలపాఠంలోని భావసాంద్రతను, కారణార్థక రూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా ‘నేల పంటలు,’ ‘గంప’ వంటి సహజ పదాలు వాడబడ్డాయి. అదే సమయంలో ‘నామం నివసించడం’ అనే మూలపాఠపు ధార్మిక అభివ్యక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. దీర్ఘమైన హీబ్రూ వాక్యాన్ని తెలుగులో చదవడానికి అనుకూలంగా రెండు వాక్యాలుగా విభజించాం.
