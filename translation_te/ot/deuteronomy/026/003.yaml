  source_fidelity: హీబ్రూ వాక్యంలోని ఆదేశక్రమం, అప్పటి సేవా/పదవిలో ఉన్న యాజకుని సూచన, యాజకునికి ఉద్దేశించి పలకవలసిన ప్రకటన, ‘నీ దేవుడైన యాహ్వే,’ ‘మన పితరులు,’ మరియు దేశాన్ని మనకు ఇవ్వాలని చేసిన ప్రమాణం అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. הִגַּדְתִּי యొక్క సంభావ్య కార్యనిర్వాహక ప్రయోగాన్ని ‘నేడు నేను ప్రకటిస్తున్నాను’ సముచితంగా చూపుతుంది; ప్రత్యామ్నాయ గతకాల పఠనం పాదసూచికలో ఉంది.
