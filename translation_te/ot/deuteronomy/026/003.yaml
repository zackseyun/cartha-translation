reference: Deuteronomy 26:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: te
  text: 'ఆ రోజుల్లో సేవలో ఉన్న యాజకుని[a] దగ్గరికి వెళ్లి అతనితో ఇలా చెప్పాలి: “నీ దేవుడైన యాహ్వేకు నేడు నేను ప్రకటిస్తున్నాను[b]: యాహ్వే మన పితరులకు[c] మనకు ఇస్తానని ప్రమాణం చేసిన దేశంలోకి నేను వచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘ఆ రోజుల్లో ఉండే యాజకుడు’; అంటే ఆ సమయంలో యాజక సేవలో లేదా పదవిలో ఉన్న వ్యక్తి.'
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేడు నేను ప్రకటించాను.’ హీబ్రూ క్రియారూపం, ఈ మాటలు పలకడం ద్వారానే ప్రకటన చేయబడుతుందనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మన పూర్వీకులకు.’ హీబ్రూలో అక్షరార్థంగా ‘మన పితరులకు’ అని ఉంది; ఈ సందర్భంలో అది పితృపురుషులను ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: దగ్గరికి వెళ్లి
  rationale: בוא అనే క్రియ సందర్భానుసారం ‘రా/వెళ్లు/ప్రవేశించు’ అని అర్థమవుతుంది. ఇక్కడ ఆరాధకుడు యాజకుని దగ్గరికి కదలడాన్ని సహజమైన తెలుగులో ‘వెళ్లి’ అని వ్యక్తం చేశాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధన, ధర్మశాస్త్ర సందర్భంలో כֹּהֵןకు సాధారణమైన, స్థిరమైన తెలుగు పదం.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో సేవలో ఉన్న
  rationale: అక్షరార్థంగా ‘ఆ రోజుల్లో ఉండే’ అని ఉన్నా, సందర్భంలో అప్పుడు యాజక సేవలో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘సేవలో ఉన్న’ అనేది పదవిలో ఉండటం, సేవ చేయటం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: అతనితో ఇలా చెప్పాలి
  rationale: ఆదేశాల వరుసలోని నిర్దేశక భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: నేడు నేను ప్రకటిస్తున్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపం ఇక్కడ పలకడం ద్వారానే ప్రకటనను చేసే కార్యనిర్వాహక భావంలో ఉండవచ్చు. వర్తమాన రూపం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: లַ ఉపసర్గలోని దిశా భావాన్ని ‘కు’తో నిలిపి, יהוה అనే ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: యాజకునితో మాట్లాడుతున్న వ్యక్తి ఉపయోగించే రెండవ పురుష ఏకవచనాన్ని మార్చకుండా ఉంచాం; ‘మన దేవుడు’గా సవరించలేదు.
- source_word: כִּי בָאתִי
  choice: వచ్చాను
  rationale: ప్రకటనలోని విషయాన్ని పరిచయం చేసే כִּיతో కలిసి, దేశంలోకి ప్రవేశించడం పూర్తయి ప్రస్తుతం ప్రాసంగికంగా ఉన్నదనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל הָאָרֶץ
  choice: దేశంలోకి
  rationale: వాగ్దాన దేశంలోకి ప్రవేశించే గమనాన్ని ‘లోకి’ స్పష్టంగా తెలుపుతుంది.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: యాహ్వే ... ప్రమాణం చేసిన
  rationale: దైవ వాగ్దానంలోని ప్రమాణ భాషను యథాతథంగా నిలుపుతుంది.
- source_word: לַאֲבֹתֵינוּ
  choice: మన పితరులకు
  rationale: మొదటి పురుష బహువచనాన్ని, అలాగే హీబ్రూలోని పుంలింగ ‘పితరులు’ అనే పదాన్ని నిలిపాం. తెలుగులో ‘మన’ వక్తనూ శ్రోతనూ కలుపుతుంది.
- source_word: לָתֶת לָנוּ
  choice: మనకు ఇస్తానని
  rationale: దేశం దేవుడు ఇచ్చే వరమనే భావాన్ని, మొదటి పురుష బహువచన గ్రహీతలను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: ‘మన పితరులు’ ఎవరిని సూచిస్తారు
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: హీబ్రూ పదం పుంలింగ బహువచనం; ద్వితీయోపదేశకాండపు ఒడంబడిక సందర్భంలో ఇది ప్రత్యేకంగా పితృపురుషులను సూచించే అవకాశం ఉంది. అందువల్ల విస్తృతమైన ‘పూర్వీకులు’ అని చేసి ఆ ప్రత్యేకతను తొలగించలేదు.
- issue: הִגַּדְתִּי యొక్క కాలం మరియు కార్యనిర్వాహక భావం
  choice: ప్రకటిస్తున్నాను
  alternative: ప్రకటించాను
  rationale: సంపూర్ణ క్రియారూపాన్ని కేవలం గతకాలంగా నిర్బంధించకుండా, ఈ మాట పలకడం ద్వారానే ప్రకటన జరుగుతుందనే సంభావ్య భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర నిర్దేశానికి తగిన గంభీరతతోనూ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణంతోనూ అనువదించాం. ప్రత్యక్ష ప్రసంగంలో ‘నీ దేవుడు’ అనే అసాధారణమైన కానీ మూలానికి ముఖ్యమైన రూపాన్ని అలాగే నిలిపాం.
