source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: te
  text: “ఇప్పుడు ఇదిగో, యాహ్వే, నీవు నాకు ఇచ్చిన నేల పంటలోని ప్రథమఫలాలను[a] నేను తీసుకొచ్చాను.” అప్పుడు నీవు దానిని నీ దేవుడైన యాహ్వే సన్నిధిలో ఉంచి, నీ దేవుడైన యాహ్వే సన్నిధిలో సాగిలపడాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేల పంటలో మొదటి భాగాన్ని” లేదా “భూమి దిగుబడిలో మొదటిదాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ క్రియ ప్రత్యేకంగా శరీరాన్ని వంచి సాగిలపడడాన్ని సూచిస్తుంది; “ఆరాధించాలి” అనేది మరింత విస్తృతమైన వ్యాఖ్యానాత్మక అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ముందున్న విశ్వాస ప్రకటన నుంచి ప్రస్తుతం అర్పిస్తున్న కార్యానికి జరిగే మార్పును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: అర్పణపై దృష్టి నిలిపే హీబ్రూ సూచనార్థక అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: הֵבֵאתִי
  choice: నేను తీసుకొచ్చాను
  rationale: అప్పటికే పూర్తయిన తీసుకురావడం అనే కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: నేల పంటలోని ప్రథమఫలాలను
  rationale: వ్యవసాయ దిగుబడిలో మొదటిదైన అర్పణను స్పష్టంగా తెలిపే, తెలుగు బైబిలు పాఠకులకు అర్థమయ్యే పదబంధం.
- source_word: הָאֲדָמָה
  choice: నేల
  rationale: ఈ సందర్భంలో ప్రాదేశిక దేశం కంటే పంటను పండించే నేల భావమే ప్రధానమైనది.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: నీవు నాకు ఇచ్చిన
  rationale: పంట దేవుడు ఇచ్చిన వరమని నేరుగా ఒప్పుకునే సంబంధ వాక్యాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
- source_word: וְהִנַּחְתּוֹ
  choice: ఆ తరువాత దానిని ... ఉంచి
  rationale: ఆచార విధానంలోని తదుపరి ఆదేశాన్ని తెలియజేస్తూ, ఏకవచన సర్వనామ భావాన్ని ‘దానిని’గా నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: దేవుని ఎదుట, ఆయన సమక్షంలో అర్పణ ఉంచడమనే ఆరాధనా సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: సాగిలపడాలి
  rationale: ‘ఆరాధించాలి’ అనే విస్తృత వ్యాఖ్యానానికి బదులు శరీరంతో వంగి పడే నిర్దిష్ట క్రియను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా అందిస్తుంది.
- issue: וְהִשְׁתַּחֲוִיתָ యొక్క ఆరాధనా భావం
  choice: సాగిలపడాలి
  alternative: ఆరాధించాలి; వంగి నమస్కరించాలి
  rationale: ఈ క్రియలో ఆరాధన అంతర్భాగమైనప్పటికీ, మూలపదం సూచించే శారీరకంగా వంగి పడే చర్యను అనువాదం స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మొదటి వాక్యాన్ని ఆరాధకుడు పలికే ప్రకటనగా ఉద్ధరణ చిహ్నాల్లో ఉంచి, తరువాతి ఆదేశం నుంచి వేరు చేశాం. ‘ప్రథమఫలాలు’ అనే పరిచిత ఆరాధనా పదానికి పాదసూచికలో మరింత పారదర్శక ప్రత్యామ్నాయాలు ఇచ్చాం.
