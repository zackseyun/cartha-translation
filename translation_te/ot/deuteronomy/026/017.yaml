source:
  edition: WLC
  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: te
  text: నేడు యాహ్వేనే నీ దేవుడని నీవు ప్రకటించావు[a]; ఆయన మార్గాల్లో నడుస్తానని, ఆయన శాసనాలను, ఆజ్ఞలను, న్యాయవిధులను పాటిస్తానని, ఆయన స్వరాన్ని వింటానని[b] కూడా ప్రకటించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రకటించావు’ అని అనువదించిన హీబ్రూ క్రియ అసాధారణమైనది; దానికి ‘గంభీరంగా అంగీకరించావు’ లేదా ‘దృఢంగా ప్రకటించావు’ అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆయన స్వరాన్ని వింటానని’; ఈ సందర్భంలో వినడం విధేయత చూపడాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הֶאֱמַרְתָּ
  choice: నీవు ప్రకటించావు
  rationale: ఇక్కడ אמר క్రియ యొక్క అసాధారణ హిఫీల్ రూపం సాధారణంగా చెప్పడాన్ని కాక, నిబంధన సంబంధమైన గంభీర అంగీకారాన్ని లేదా ప్రకటనను సూచిస్తుంది. ‘ప్రకటించావు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: కాలానికి ఉన్న ప్రాధాన్యాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: నీ దేవుడిగా అంగీకరిస్తున్నానని
  rationale: ఈ నిర్మాణం నిబంధన సంబంధాన్ని తెలియజేస్తుంది. తెలుగు వాక్యంలో ప్రకటనకు ఎవరు కట్టుబడుతున్నారో సహజంగా స్పష్టమయ్యేలా ‘అంగీకరిస్తున్నానని’ వాడాం; దేవుడు కొత్తగా దేవుడు అవుతున్నాడనే భావాన్ని చేర్చలేదు.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: ఆయన మార్గాల్లో నడుస్తానని
  rationale: ‘మార్గాల్లో నడవడం’ అనే హీబ్రూ నిబంధనాత్మక రూపకాన్ని వివరణగా మార్చకుండా తెలుగులో నిలిపాం.
- source_word: חֻקָּיו
  choice: ఆయన శాసనాలను
  rationale: חֻקִּים యొక్క స్థిరపరచబడిన న్యాయనియమాల భావాన్ని, ఇతర న్యాయపదాలతో కలపకుండా ‘శాసనాలు’గా ఇచ్చాం.
- source_word: מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: దైవిక ఆదేశాల అధికారిక, నిబంధనాత్మక భావాన్ని ‘ఆజ్ఞలు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפָּטָיו
  choice: ఆయన న్యాయవిధులను
  rationale: న్యాయతీర్పులు లేదా అమలుచేయవలసిన న్యాయనియమాలు అనే పరిధిని నిలిపి, ‘శాసనాలు,’ ‘ఆజ్ఞలు’ అనే సమీప పదాలతో పూర్తిగా కలిపివేయకుండా ఉంచుతుంది.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: ఆయన మాటకు లోబడతానని
  rationale: శׁמע + קול నిర్మాణంలో వినడమే కాక విధేయత చూపే భావం సందర్భానుసారంగా ఉంది. సహజ తెలుగులో ‘మాటకు లోబడడం’ ఆ భావాన్ని అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో నమోదు చేశాం.
theological_decisions:
- issue: నిబంధన ప్రకటనలో ఇశ్రాయేలు యొక్క పాత్ర
  choice: యాహ్వేను తన దేవుడిగా అంగీకరిస్తూ, ఆయన మార్గాల్లో నడిచి ఆయన ఆదేశాలకు లోబడతానని ఇశ్రాయేలు చేసిన గంభీర ప్రకటనగా అనువదించాం.
  alternative: హీబ్రూ క్రియను మరింత అక్షరానుసారంగా కాని తెలుగులో అస్పష్టంగా ‘చెప్పించావు’ లేదా కేవలం ‘చెప్పావు’ అని ఇవ్వవచ్చు.
  rationale: అసాధారణమైన హిఫీల్ క్రియకూ దాని తరువాత వచ్చే ఉద్దేశార్థక క్రియారూపాలకూ ఉన్న నిబంధనాత్మక సంబంధాన్ని స్పష్టం చేస్తుంది; అయితే పరస్పర నిబంధన గురించి ఈ వచనం చెప్పినదానికంటే అధికమైన సిద్ధాంత వివరణను చేర్చదు.
- issue: ‘ఆయన స్వరం వినడం’లో వినికిడి మరియు విధేయత
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన మాటకు లోబడతానని’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
  alternative: ‘ఆయన స్వరాన్ని వింటానని’ అని అక్షరానుసారంగా అనువదించవచ్చు.
  rationale: ఈ నిబంధన సందర్భంలో ‘వినడం’ విధేయతను అంతర్భూతంగా సూచిస్తుంది. ప్రధాన పాఠ్యం సహజ తెలుగు భావాన్ని ఇస్తుండగా, పాదసూచిక మూలంలోని వినికిడి రూపకాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ‘మార్గాల్లో నడవడం’ అనే ప్రధాన నిబంధనాత్మక రూపకాన్ని నిలిపి, వరుస న్యాయపదాలైన ‘శాసనాలు, ఆజ్ఞలు, న్యాయవిధులు’ మధ్య ఉన్న భేదాన్ని సాధ్యమైనంతవరకు కాపాడాం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, రెండో వాక్యాన్ని ‘కూడా ప్రకటించావు’ ద్వారా మొదటి ప్రకటనతో అనుసంధానించాం.
