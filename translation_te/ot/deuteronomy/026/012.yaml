- from: నీ పంట దిగుబడి అంతటిలోని దశమభాగాన్ని మూడవ సంవత్సరంలో—దశమభాగపు సంవత్సరంలో—వేరు చేయడం ముగించినప్పుడు, దాన్ని లేవీయునికి, మీ మధ్య నివసించే పరదేశికి, తండ్రిలేనివానికి, విధవరాలికి ఇవ్వాలి. వారు నీ పట్టణాల్లో[a] తిని తృప్తిపడాలి.
  to: నీ పంట దిగుబడిలోని దశమభాగమంతటినీ మూడవ సంవత్సరంలో—దశమభాగపు సంవత్సరంలో—వేరు చేయడం ముగించినప్పుడు, దాన్ని లేవీయునికి, నీ మధ్య నివసించే పరదేశికి, తండ్రిలేనివానికి, విధవరాలికి ఇవ్వాలి. వారు నీ పట్టణాల్లో[a] తిని తృప్తిపడాలి.
  rationale: 'సవరణలు అర్థాన్ని మార్చకుండా రెండు అంశాలను పరిష్కరిస్తాయి: మూలంలోని ఏకవచన సంబోధనను ‘నీ మధ్య’ ద్వారా నిలబెట్టడం, అలాగే దశమభాగం మరియు పంట దిగుబడి మధ్య సంబంధాన్ని స్పష్టంగా చెప్పడం. పాదటిప్పణి గుర్తు మరియు దాని వివరణ యథాతథంగా సరైన స్థానంలో ఉన్నాయి.'
