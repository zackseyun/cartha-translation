id: DEU.26.12
reference: Deuteronomy 26:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: te
  text: నీ పంట దిగుబడిలోని దశమభాగమంతటినీ మూడవ సంవత్సరంలో—దశమభాగపు సంవత్సరంలో—వేరు చేయడం ముగించినప్పుడు, దాన్ని లేవీయునికి, నీ మధ్య నివసించే పరదేశికి, తండ్రిలేనివానికి, విధవరాలికి ఇవ్వాలి. వారు నీ పట్టణాల్లో[a] తిని తృప్తిపడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ గుమ్మాల్లో.” అంటే నీ పట్టణాల పరిధిలో.
    reason: హీబ్రూ నుడికారం בִשְׁעָרֶיךָ యొక్క అక్షరార్థాన్నీ, సందర్భానుసార అర్థాన్నీ సంరక్షించడానికి.
lexical_decisions:
- source_word: כִּי תְכַלֶּה
  choice: ముగించినప్పుడు
  rationale: כִּי ఇక్కడ కాలసంబంధ సందర్భాన్ని పరిచయం చేస్తుంది; כלה పీయేల్ రూపం కార్యాన్ని పూర్తిచేయడాన్ని సూచిస్తుంది.
- source_word: לַעְשֵׂר אֶת כָּל מַעְשַׂר
  choice: దశమభాగాన్ని ... వేరు చేయడం
  rationale: עשר క్రియను ఆచరణాత్మకంగా ‘వేరు చేయడం’ అని, మַעְשַׂר నామవాచకాన్ని ‘దశమభాగం’ అని అనువదించడం ద్వారా మూలంలోని క్రియా-నామ సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: תְּבוּאָתְךָ
  choice: నీ పంట దిగుబడి
  rationale: תְּבוּאָה భూమి నుంచి లభించే పంట ఉత్పత్తి లేదా దిగుబడిని సూచిస్తుంది; ఈ సందర్భంలో ‘పంట దిగుబడి’ సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: దశమభాగపు సంవత్సరం
  rationale: ప్రత్యేకమైన మూడవ సంవత్సరాన్ని గుర్తించే మూలంలోని నిర్మాణ సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: לַלֵּוִי
  choice: లేవీయునికి
  rationale: గోత్ర సంబంధమైన సామాజిక వర్గానికి ప్రామాణికమైన తెలుగు రూపం.
- source_word: לַגֵּר
  choice: మీ మధ్య నివసించే పరదేశికి
  rationale: גֵּר సాధారణ అపరిచితుణ్ణి కాక, ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది; వివరణాత్మక తెలుగు రూపం ఆ భావాన్ని అందిస్తుంది.
- source_word: לַיָּתוֹם
  choice: తండ్రిలేనివానికి
  rationale: יָתוֹם యొక్క నిబంధనాత్మక సామాజిక బలహీనత భావాన్ని ‘తండ్రిలేనివాడు’ దగ్గరగా నిలుపుతుంది; ‘అనాథ’ కూడా సాధ్యమే.
- source_word: בִשְׁעָרֶיךָ
  choice: నీ పట్టణాల్లో
  rationale: ‘నీ గుమ్మాల్లో’ అనే అక్షరార్థపు హీబ్రూ నుడికారం సందర్భంలో పట్టణాలు లేదా స్థానిక నివాస ప్రాంతాలను సూచిస్తుంది; ఆధునిక తెలుగులో అర్థవంతమైన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: וְשָׂבֵעוּ
  choice: తృప్తిపడాలి
  rationale: שׂבע కడుపునిండా తిని సంతృప్తి చెందడాన్ని సూచిస్తుంది; ముందు ఉన్న ‘తిని’తో కలిపి సహజమైన న్యాయనిర్దేశ రూపం.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో పేర్కొన్న సామాజిక వర్గాలు
  choice: లేవీయుడు, మీ మధ్య నివసించే పరదేశి, తండ్రిలేనివాడు, విధవరాలు అనే నిర్దిష్ట వర్గాలను నిలుపడం
  alternative: మతసేవకులు, వలసవారు, అనాథలు, విధవరాలు; లేదా అవసరంలో ఉన్నవారు
  rationale: మూలపాఠం దశమభాగం పొందవలసిన నిర్దిష్ట నిబంధనాత్మక వర్గాలను పేరుపెట్టి చెబుతుంది. వాటిని సాధారణీకరించడం వల్ల ధర్మశాస్త్రపు సామాజిక-వేదాంత నిర్మాణం కోల్పోతుంది.
- issue: בִשְׁעָרֶיךָ యొక్క అక్షరార్థం మరియు నుడికారార్థం
  choice: ప్రధాన పాఠ్యంలో ‘నీ పట్టణాల్లో’
  alternative: ‘నీ గుమ్మాల్లో’
  rationale: ఈ హీబ్రూ నుడికారం పట్టణాల పరిధిలో లేదా స్థానిక సమాజాల్లో అని సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి అర్థం స్పష్టంగా ఉండేందుకు నుడికారార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ధర్మశాస్త్ర శైలి. వ్యక్తిగత సంబోధనకు మూలంలోని ఏకవచనాన్ని అనుసరించి ‘నీ’ వాడబడింది; గేర్‌ను స్పష్టంచేసే చోట సహజ తెలుగు కోసం ‘మీ మధ్య’ అనే సామూహిక భావవ్యక్తీకరణ వచ్చింది. ‘దశమభాగం’ అనే పారదర్శక పదాన్ని ఉపయోగించి, మతసంఘ-ప్రత్యేక పరిభాషను నివారించాం.
