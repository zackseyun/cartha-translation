id: DEU.26.5
reference: Deuteronomy 26:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָנִ֨יתָ וְ/אָמַרְתָּ֜ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔/י וַ/יֵּ֣רֶד מִצְרַ֔יְמָ/ה וַ/יָּ֥גָר שָׁ֖ם בִּ/מְתֵ֣י מְעָ֑ט וַֽ/יְהִי שָׁ֕ם לְ/ג֥וֹי גָּד֖וֹל עָצ֥וּם וָ/רָֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: te
  text: 'నీవు నీ దేవుడైన యహ్వే సన్నిధిలో ఇలా జవాబిచ్చి చెప్పాలి: “నా తండ్రి సంచారిగా ఉన్న అరామీయుడు[a]. అతడు కొద్దిమందితో ఐగుప్తుకు దిగివెళ్లి, అక్కడ పరదేశిగా నివసించాడు. అక్కడ అతడు గొప్ప, బలమైన, అనేకమంది గల జనంగా ఎదిగాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తండ్రి నశించిపోతున్న అరామీయుడు.” హీబ్రూ కృదంతానికి “సంచారిగా ఉన్న” అనే భావంతోపాటు “నశించిపోతున్న” అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: జవాబిచ్చి చెప్పాలి
  rationale: ఆచారబద్ధమైన ప్రకటనను పరిచయం చేసే జత క్రియలైన ‘జవాబిచ్చి చెప్పు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యహ్వే సన్నిధిలో
  rationale: לִפְנֵי అనే పదంలోని ‘ఎదుట/సన్నిధిలో’ భావాన్ని సహజంగా తెలుపుతూ, దేవుని వ్యక్తిగత నామాన్ని యహ్వే అని లిప్యంతరీకరించింది.
- source_word: אֲרַמִּי
  choice: అరామీయుడు
  rationale: చారిత్రక జాతి గుర్తింపును కచ్చితంగా తెలుపుతుంది; విస్తృతార్థం కలిగిన ‘సిరియనుడు’ అనే పదాన్ని నివారిస్తుంది.
- source_word: אֹבֵד
  choice: సంచరిస్తూ తిరిగిన
  rationale: ఈ క్రియావిశేషణానికి ‘సంచరిస్తున్న’ మరియు ‘నశించిపోతున్న’ అనే రెండు సాధ్య భావాలు ఉన్నాయి. ఐగుప్తుకు వలస వెళ్లే పూర్వికుని సందర్భంలో మొదటి భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, రెండవ భావాన్ని పాదసూచికలో నిలిపింది.
- source_word: אָבִי
  choice: నా తండ్రి
  rationale: ప్రతినిధిగా చెప్పబడిన పూర్వికుని గురించి ఉన్న ఏకవచన, సజీవమైన మూలపాఠ్య వ్యక్తీకరణను నిలుపుతుంది.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: ఐగుప్తుకు దిగివెళ్లి
  rationale: ఐగుప్తుకు ప్రయాణాన్ని ‘దిగివెళ్లడం’గా చెప్పే హీబ్రూ దిశాసూచక నుడికారాన్ని నిలుపుతుంది.
- source_word: וַיָּגָר שָׁם
  choice: అక్కడ పరదేశిగా నివసించాడు
  rationale: גור లోని పరదేశ నివాసి లేదా తాత్కాలిక వాసి అనే భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: בִּמְתֵי מְעָט
  choice: కొద్దిమందితో
  rationale: ఆ సమూహం సంఖ్యాపరంగా చిన్నదని చెప్పే హీబ్రూ నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: అక్కడ ... జనంగా ఎదిగాడు
  rationale: ఏకవచన పూర్వికుడు తన సంతానం ద్వారా ఒక జనంగా మారాడనే ప్రతినిధి భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: గొప్పదీ, బలమైనదీ, బహుసంఖ్యాకమైనదీ
  rationale: పరిమాణం, శక్తి, జనసంఖ్య అనే మూడు సమీకృత లక్షణాలను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: אֲרַמִּי אֹבֵד אָבִי అనే పదబంధం యొక్క అర్థం
  choice: నా తండ్రి సంచరిస్తూ తిరిగిన అరామీయుడు
  alternative: నా తండ్రి నశించిపోతున్న అరామీయుడు
  rationale: మసొరా స్వరచిహ్నాల ప్రకారం ‘నా తండ్రి’నే కర్తగా తీసుకోవడం అత్యంత సూటి నిర్మాణం. אֹבֵד పదానికి సందర్భంలో ‘సంచరిస్తూ తిరిగిన’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నప్పటికీ, ‘నశించిపోతున్న’ అనే నిజమైన పదార్థ సాధ్యతను పాదసూచికలో ఉంచి మూలంలోని ఉద్విగ్నతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారబద్ధమైన ఒప్పుకోలు తగిన గంభీరతతో వినిపించేలా రూపొందించబడింది. అరుదైన పాత పదాల స్థానంలో ‘పరదేశిగా నివసించాడు’, ‘బహుసంఖ్యాకమైన’ వంటి స్పష్టమైన పదబంధాలు వాడబడ్డాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత అస్పష్ట పదబంధం వెంట ఉంచబడింది.
