- from: 'నీవు నీ దేవుడైన యహ్వే సన్నిధిలో ఇలా జవాబిచ్చి చెప్పాలి: “నా తండ్రి సంచరిస్తూ తిరిగిన అరామీయుడు[a]. అతడు కొద్దిమందితో ఐగుప్తుకు దిగివెళ్లి, అక్కడ పరదేశిగా నివసించాడు. అక్కడ అతడు గొప్పదీ, బలమైనదీ, బహుసంఖ్యాకమైనదీ అయిన జనంగా ఎదిగాడు.”'
  to: 'నీవు నీ దేవుడైన యహ్వే సన్నిధిలో ఇలా జవాబిచ్చి చెప్పాలి: “నా తండ్రి సంచారిగా ఉన్న అరామీయుడు[a]. అతడు కొద్దిమందితో ఐగుప్తుకు దిగివెళ్లి, అక్కడ పరదేశిగా నివసించాడు. అక్కడ అతడు గొప్ప, బలమైన, అనేకమంది గల జనంగా ఎదిగాడు.”'
  rationale: అర్థవివాదం ఉన్న אֹבֵדకు ప్రధాన పాఠ్యంలో సందర్భానుకూలమైన సంచార భావాన్ని ఉంచి, ‘నశించిపోతున్న’ అనే చెల్లుబాటయ్యే ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం. సవరణలు అర్థాన్ని మార్చకుండా సహజత్వం, వ్యాకరణ కచ్చితత్వం, మరియు పదబంధాల ప్రవాహాన్ని మెరుగుపరుస్తాయి.
