  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: te
  text: ఆకాశంలోని నీ పరిశుద్ధ నివాసం నుండి కిందికి చూసి, నీ ప్రజలైన ఇశ్రాయేలును, మా పితరులకు నీవు ప్రమాణం చేసిన ప్రకారం పాలు, తేనె ప్రవహించే దేశమైన నీవు మాకు ఇచ్చిన నేలను ఆశీర్వదించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: కిందికి చూసి
  rationale: దేవుడు పైనున్న తన నివాసం నుండి దృష్టి సారించాలనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది; తరువాతి ఆజ్ఞతో కలిపి వాక్యం సాఫీగా ప్రవహిస్తుంది.
- source_word: מִמְּעוֹן קָדְשְׁךָ מִן הַשָּׁמַיִם
  choice: ఆకాశంలోని నీ పరిశుద్ధ నివాసం నుండి
  rationale: ‘పరిశుద్ధ నివాసం’ అనే పవిత్ర స్థల భావాన్ని నిలుపుతూ, ‘ఆకాశం నుండి’ అనే వివరణను సహజమైన తెలుగు సంబంధ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וּבָרֵךְ
  choice: ఆశీర్వదించు
  rationale: ברך ఆజ్ఞారూపానికి నేరమైన, ప్రామాణికమైన తెలుగు సమానార్థకం.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలును
  rationale: ఇశ్రాయేలు ఎవరో—దేవుని ప్రజలు—అనే సమానాధికార సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָאֲדָמָה
  choice: నేలను
  rationale: ఈ పదంలోని నేల/సాగుభూమి భావాన్ని నిలుపుతూ, వాక్యం చివరనున్న אֶרֶץ‌కు ఉపయోగించిన ‘దేశం’తో మూలంలోని పదభేదాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: నీవు మాకు ఇచ్చిన
  rationale: పూర్తయిన దైవిక అనుగ్రహాన్ని సహజమైన తెలుగు భూతకృదంత నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: మా పితరులకు నీవు ప్రమాణం చేసిన ప్రకారం
  rationale: ప్రమాణ సంబంధ సూత్రాన్ని, అలాగే మూలంలోని పురుషలింగ ‘పితరులు’ అనే పదాన్ని నిలుపుతుంది.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశం
  rationale: సమృద్ధి, సారవంతతను సూచించే స్థిరమైన హెబ్రీ నుడికారాన్ని తెలుగులో పరిచితమైన రూపంలో అందిస్తుంది.
theological_decisions:
- issue: నిబంధన సంబంధ సూత్రంలో לַאֲבֹתֵינוּ అనువాదం
  choice: మా పితరులకు
  alternative: మా పూర్వికులకు
  rationale: హెబ్రీ మూలం ‘తండ్రులు/పితరులు’ అనే పురుషలింగ పదాన్ని ఉపయోగిస్తుంది; ఇక్కడ అది ప్రత్యేకంగా పితరులైన అబ్రాహాము, ఇస్సాకు, యాకోబులను సూచించే నిబంధన సంబంధ ప్రయోగం. విస్తృత అర్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘నేల’ మరియు ‘దేశం’ అనే పదాలతో הָאֲדָמָה / אֶרֶץ భేదాన్ని సాధ్యమైనంతవరకు నిలిపాం; కృత్రిమమైన పదక్రమాన్ని నివారించడానికి ఆకాశాన్ని పరిశుద్ధ నివాసం ఉన్న స్థలంగా సహజంగా అనుసంధానించాం.
