id: DEU.26.8
reference: Deuteronomy 26:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: te
  text: యహ్వే మమ్మల్ని ఐగుప్తులోనుండి బలమైన చేతితో, చాచిన బాహువుతో, మహా భీతితో[a], సూచకాలతోను అద్భుతాలతోను బయటకు తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మహా విస్మయంతో”; లేదా “భీతిని కలిగించే గొప్ప కార్యాలతో.” హీబ్రూ పదం భయం, భీతి లేదా విస్మయం కలిగించే ప్రదర్శనను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: మమ్మల్ని బయటకు తీసుకొచ్చాడు
  rationale: יצא అనే ధాతువు హిఫీల్ రూపంలో ‘బయటకు వచ్చేలా చేయడం’ లేదా ‘బయటకు తీసుకురావడం’ అనే అర్థం ఇస్తుంది. ఈ ఎంపిక నిర్గమన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తులోనుండి
  rationale: מן అనే విభక్తి సూచించే బయలుదేరిన స్థలాన్ని, ‘బయటకు తీసుకొచ్చాడు’ అనే క్రియతో కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: దేవుని శక్తివంతమైన కార్యాన్ని సూచించే హీబ్రూ రూపకాన్ని దాని శరీరాంగ చిత్రణతోనే నిలుపుతుంది.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: చాచిన బాహువుతో
  rationale: దైవిక శక్తి కార్యరూపంలో బయలుపడటాన్ని సూచించే నిర్గమన రూపకాన్ని దగ్గరగా, గౌరవప్రదంగా అనువదిస్తుంది.
- source_word: וּבְמֹרָא גָּדֹל
  choice: మహా భీతితో
  rationale: מוֹרָאలోని భయం, భీతి, విస్మయం కలిగించే ప్రదర్శన అనే అర్థపరిధిలో, ఐగుప్తుపై జరిగిన కార్యాల తీవ్ర ప్రభావాన్ని ‘భీతి’ స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణి నిలుపుతుంది.
- source_word: וּבְאֹתוֹת
  choice: సూచక క్రియలతో
  rationale: אוֹתוֹתను కేవలం గుర్తులుగా కాక, సందర్భంలో దేవుని కార్యాలను సూచించే క్రియలుగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘అద్భుత’ అనే భావాన్ని ముందుగానే కలపదు.
- source_word: וּבְמֹפְתִים
  choice: అద్భుతాలతో
  rationale: מוֹפְתִיםకు సందర్భానుకూలమైన సాధారణ తెలుగు సమానార్థకం; ‘సూచక క్రియలు, అద్భుతాలు’ అనే జంటను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో బిరుదు కాక దేవుని వ్యక్తిగత నామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అని మార్చకుండా యహ్వే అని లిప్యంతరీకరించడం మూలపాఠాన్ని నిలుపుతుంది.
- issue: מוֹרָא అనే పదంలోని భావ ఛాయ
  choice: మహా భీతి
  alternative: మహా విస్మయం; విస్మయం పుట్టించే గొప్ప కార్యాలు
  rationale: ఈ పదం భయం లేదా భీతినీ, విస్మయం పుట్టించే దైవిక ప్రదర్శననూ సూచించగలదు. ప్రధాన పాఠంలో నిర్గమన కార్యాల తీవ్రతను చూపే ‘మహా భీతి’ని ఎంచుకుని, పదంలోని నిజమైన అనిశ్చితిని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చేతి,’ ‘బాహువు’ అనే మూల రూపకాలను నిలిపి, వరుసగా వచ్చే సాధనార్థక నిర్మాణాలను ‘-తో’ రూపంలో ఇచ్చాం. పాదటిప్పణి సూచికను అది వివరిస్తున్న ‘మహా భీతితో’ వెంట ఉంచాం.
