source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే నీకూ నీ ఇంటివారికీ ఇచ్చిన సమస్త మేలును బట్టి నీవు, లేవీయుడు, నీ మధ్య నివసించే పరదేశి[a] సంతోషించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నివాస పరదేశి.’ హీబ్రూ పదం ఇశ్రాయేలీయుల మధ్య వారి రక్షణలో నివసించే ఇశ్రాయేలీయేతర వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: సంతోషించాలి
  rationale: బోధనా సందర్భంలోని ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ఆనందం మరియు పండుగసంబంధమైన ఉల్లాసం రెండింటినీ నిలుపుతుంది.
- source_word: בְּכָל הַטּוֹב
  choice: మేలంతటిని బట్టి
  rationale: בְּ అనే సంబంధాన్ని సందర్భానుసారంగా కారణార్థంలో సహజంగా తెలుపుతుంది; దేవుడు అనుగ్రహించిన సమస్త మేలును సూచిస్తుంది.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: నీకూ ... ఇచ్చిన
  rationale: נתן యొక్క పూర్తయిన దానక్రియను, לְךָ లోని గ్రహీత భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచుతుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ఒడంబడిక సంబంధాన్ని తెలిపే ‘నీ దేవుడు’ అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: וּלְבֵיתֶךָ
  choice: నీ ఇంటివారికీ
  rationale: ఇక్కడ בַּיִת భవనాన్ని కాక కుటుంబం లేదా గృహసముదాయాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆ సామాజిక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ఉద్ఘాటక సర్వనామాన్ని జాబితాలో ప్రత్యేకంగా నిలుపుతుంది.
- source_word: הַלֵּוִי
  choice: లేవీయుడు
  rationale: లేవి గోత్రానికి చెందిన వ్యక్తిని సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: הַגֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజం మధ్య నివసిస్తూ దాని రక్షణలో ఉన్న స్థానికేతర నివాసిని సూచిస్తుంది; పాదటిప్పణి దాని న్యాయసామాజిక సూక్ష్మార్థాన్ని వివరిస్తుంది.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: నీ మధ్య నివసించే
  rationale: ‘నీ మధ్య ఉన్న’ అనే మూలభావాన్ని సహజంగా తెలుపుతూ, גֵּר యొక్క నివాస స్వభావాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత ఒడంబడిక నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా సుపరిచితమైన రూపం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సంబోధనను నిలిపి, ఉద్ఘాటక జాబితిని డాష్‌లతో స్పష్టంచేశాం.
