source:
  edition: WLC
  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: te
  text: 'అప్పుడు నీ దేవుడైన యాహ్వే సన్నిధిలో నీవు ఇలా చెప్పాలి: ‘పవిత్ర భాగాన్ని[a] నేను ఇంటి నుండి తీసివేశాను; దానిని లేవీయునికి, పరదేశికి[b], తండ్రిలేనివానికి[c], విధవరాలికి కూడా ఇచ్చాను. నీవు నాకు ఆజ్ఞాపించిన ప్రతి ఆజ్ఞ ప్రకారం చేశాను. నీ ఆజ్ఞలను నేను అతిక్రమించలేదు; వాటిని మరచిపోలేదు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతిష్ఠిత భాగం,’ ‘పవిత్రమైనది’; హీబ్రూ పదం పంపిణీ కోసం ప్రత్యేకపరచిన దశమభాగాన్ని లేదా దిగుబడిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే ఇశ్రాయేలీయుల మధ్య నివసించే విదేశీయుడు.
    reason: lexical_clarification
  - marker: c
    text: లేదా ‘అనాథకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: అప్పుడు ... నీవు ఇలా చెప్పాలి
  rationale: వావ్‌తో కూడిన క్రియ ముందున్న ఆచారక్రమాన్ని కొనసాగిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో’; ‘సన్నిధిలో’ సమక్షత భావాన్ని సహజంగా అందిస్తుంది. יְהוָהను వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: בִּעַרְתִּי
  choice: తీసివేశాను
  rationale: ఈ సందర్భంలో క్రియకు దహనం చేయడం కాక, ఇంటి నుంచి పూర్తిగా తొలగించడం అనే భావం ఉంది.
- source_word: הַקֹּדֶשׁ
  choice: ప్రతిష్ఠిత భాగం
  rationale: పంపిణీ కోసం దేవునికి ప్రత్యేకపరచిన దశమభాగాన్ని సూచిస్తుంది; ‘భాగం’ సందర్భార్థాన్ని స్పష్టం చేస్తూ ‘ప్రతిష్ఠిత’ పవిత్రపరచబడిన స్థితిని నిలుపుతుంది.
- source_word: מִן הַבַּיִת
  choice: ఇంటి నుండి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆ ఇంటి నుండి’; తెలుగులో స్వామ్యాన్ని అనవసరంగా చేర్చకుండా సహజంగా ఇచ్చాం.
- source_word: וְגַם נְתַתִּיו
  choice: దాన్ని ... ఇచ్చాను
  rationale: కర్మప్రత్యయం ముందు పేర్కొన్న ప్రతిష్ఠిత భాగాన్ని సూచిస్తుంది; ‘కూడా’ అనే గם భావం వాక్యక్రమంలో సహజంగా అంతర్లీనమై ఉంది.
- source_word: לַלֵּוִי
  choice: లేవీయునికి
  rationale: మూలం సాధారణంగా లేవీయుణ్ణే పేర్కొంటుంది; యాజకుడని పరిమితం చేయదు.
- source_word: לַגֵּר
  choice: మీ మధ్య నివసించే పరదేశికి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో స్థిరంగా నివసించే బయటి వ్యక్తిని సూచిస్తుంది; కేవలం ప్రయాణికుడు లేదా అపరిచితుడు కాదు.
- source_word: לַיָּתוֹם
  choice: తండ్రిలేనివానికి
  rationale: יָתוֹם సూచించే సామాజిక బలహీనతను దగ్గరగా నిలుపుతుంది; సందర్భానుసారం ‘అనాథ’ కూడా సాధ్యం.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: నీవు నాకు ఆజ్ఞాపించిన ఆజ్ఞ అంతటి ప్రకారం
  rationale: మూలంలోని ఏకవచన సమూహార్థక מִצְוָהను, అలాగే ‘ఆజ్ఞ/ఆజ్ఞాపించు’ పునరుక్తిని నిలుపుతుంది.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: నీ ఆజ్ఞలను నేను అతిక్రమించలేదు
  rationale: עבר מן ఇక్కడ ఆజ్ఞలను దాటిపోవడం లేదా ఉల్లంఘించడం అనే భావం; ‘అతిక్రమించలేదు’ దానికి సరైన గౌరవప్రద తెలుగు.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: వాటిని మరచిపోలేదు
  rationale: తెలుగులో స్పష్టత కోసం బహువచన కర్మను పూరించాం; అది ముందున్న ఆజ్ఞలను సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: הַקֹּדֶשׁ సూచించే వస్తువు
  choice: ప్రతిష్ఠిత భాగం
  alternative: పవిత్రమైనది
  rationale: ఈ ప్రకటన దశమభాగంగా ప్రత్యేకపరచి పంపిణీ చేసిన దిగుబడిని సూచిస్తుంది. ‘భాగం’ సందర్భాన్ని తెలియజేస్తుంది; అయితే మూలనామం స్వతహాగా ‘పవిత్రమైనది’ అనే విస్తృత భావాన్ని కూడా కలిగి ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆచార ప్రకటన స్వరాన్ని నిలుపుతూ అధిక పురాతన పదజాలాన్ని నివారించాం. మూలంలోని ఏకవచన సమూహార్థక ‘ఆజ్ఞ’ను మొదటి వాక్యభాగంలో, తరువాతి బహువచన ‘ఆజ్ఞలను’ యథాతథంగా ప్రతిబింబించాం.
