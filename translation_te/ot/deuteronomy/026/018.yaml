  revision_rationale: The revision preserves the rare covenantal verb as ‘ప్రకటించాడు’ while making both infinitival clauses—being Yahweh’s special people and keeping all his commandments—depend on that single declaration. It retains the more literal ‘ఆయన నీతో చెప్పినట్లే’ in the text, with ‘promised’ appropriately supplied as an alternative. The footnote for סְגֻלָּה now reads naturally while preserving the explicit Hebrew term for ‘people.’
