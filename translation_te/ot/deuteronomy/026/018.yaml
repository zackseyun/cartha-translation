revisions:
- from: యెహోవా నేడు నిన్ను తనకు అమూల్యమైన ప్రజగా[a] ఉండాలని ప్రకటించాడు—ఆయన నీతో చెప్పినట్లే[b]—నీవు ఆయన ఆజ్ఞలన్నిటినీ పాటించాలని ప్రకటించాడు.
  to: యెహోవా నేడు నీవు తనకు ప్రత్యేకమైన ప్రజగా[a] ఉండాలని, ఆయన నీతో చెప్పినట్లే[b], ఆయన ఆజ్ఞలన్నిటినీ పాటించాలని నీ గురించి ప్రకటించాడు.
  rationale: The revision preserves the rare covenantal verb as ‘ప్రకటించాడు’ while making both infinitival clauses—being Yahweh’s special people and keeping all his commandments—depend on that single declaration. It retains the more literal ‘ఆయన నీతో చెప్పినట్లే’ in the text, with ‘promised’ appropriately supplied as an alternative. The footnote for סְגֻלָּה now reads naturally while preserving the explicit Hebrew term for ‘people.’
  reviewer_model: gpt-5.6-terra
