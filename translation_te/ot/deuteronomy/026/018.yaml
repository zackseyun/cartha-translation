  text: וַֽ/יהוָ֞ה הֶאֱמִֽירְ/ךָ֣ הַ/יּ֗וֹם לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/לִ/שְׁמֹ֖ר כָּל מִצְוֺתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: te
  text: యెహోవా నేడు నీవు తనకు ప్రత్యేకమైన ప్రజగా[a] ఉండాలని, ఆయన నీతో చెప్పినట్లే[b], ఆయన ఆజ్ఞలన్నిటినీ పాటించాలని నీ గురించి ప్రకటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన అమూల్యమైన సొత్తుగా ఉండే ప్రజగా’; హీబ్రూలో అక్షరార్థంగా, ‘ప్రజగా, అమూల్యమైన సొత్తుగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన నీకు వాగ్దానం చేసినట్లే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను వ్యక్తినామంగా గుర్తించదగిన, ఆధునిక తెలుగు రూపమైన ‘యెహోవా’తో అనువదించాం.
- source_word: הֶאֱמִירְךָ
  choice: నిన్ను ... ఉండాలని ప్రకటించాడు
  rationale: అరుదైన హిఫీల్ రూపం నిబంధన సందర్భంలోని అధికారిక ప్రకటన భావాన్ని సూచిస్తుంది; ‘ఎన్నుకున్నాడు’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: హీబ్రూ పదంలోని తక్షణ కాలసూచనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִהְיוֹת לוֹ
  choice: తనకు ... ఉండాలని
  rationale: దైవ ప్రకటనతో అనుసంధానమైన ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְעַם סְגֻלָּה
  choice: అమూల్యమైన ప్రజగా
  rationale: עַם అనే ‘ప్రజ’ భావాన్నీ, סְגֻלָּהలోని విలువైన సొత్తు లేదా నిధి భావాన్నీ కలిపి నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: ఆయన నీతో చెప్పినట్లే
  rationale: דבר యొక్క ప్రాథమిక ‘మాట్లాడు/చెప్పు’ భావాన్ని కాపాడుతుంది; సందర్భంలో వాగ్దాన భావం ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: וְלִשְׁמֹר
  choice: పాటించాలని
  rationale: ఆజ్ఞలకు సంబంధించి שׁמר అంటే వాటిని కాపాడి ఆచరించడం; ‘పాటించు’ ఆధునిక తెలుగులో సహజంగా ఆచరణ భావాన్ని ఇస్తుంది.
- source_word: כָּל מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలన్నిటినీ
  rationale: కర్తకు సంబంధించిన సర్వ ఆజ్ఞలు అనే హీబ్రూ భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ద్వితీయోపదేశకాండము 26:18లో הֶאֱמִיר అనే అరుదైన క్రియ యొక్క నిబంధనాత్మక బలం
  choice: నిబంధన సందర్భంలో దేవుని అధికారిక ప్రకటన
  alternative: ‘ఎన్నుకున్నాడు’ అనే ఎన్నిక భావం లేదా ప్రాచీన శైలిలో ‘ఒట్టుగా అంగీకరించాడు’
  rationale: మూలవాక్యం ఇశ్రాయేలు స్థితి గురించి యెహోవా చేసిన గంభీర ప్రకటనను చెబుతుంది. ‘ప్రకటించాడు’ ఆ కార్యసాధక బలాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: וְלִשְׁמֹרను ముందు ఉన్న ప్రకటనకు వ్యాకరణపరంగా అనుసంధానించడం
  choice: ‘నీవు ... పాటించాలని ప్రకటించాడు’ అని సమాంతరంగా స్పష్టం చేయడం
  alternative: ‘మరియు ఆయన ఆజ్ఞలన్నిటినీ పాటించడానికి’ అని ఉద్దేశార్థకంగా అనువదించడం
  rationale: హీబ్రూలోని వరుస infinitive నిర్మాణాల సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపుతుంది; ప్రజగా ఉండడానికీ ఆజ్ఞలు పాటించడానికీ ఒకే ప్రకటన వర్తిస్తుందని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘యెహోవా’ దైవనామాన్ని స్పష్టంగా ఉంచాం. అరుదైన నిబంధనాత్మక క్రియకు ‘ప్రకటించాడు’ను ఎంచుకొని, ఎన్నిక వంటి అదనపు సిద్ధాంతార్థాన్ని మోపలేదు. ప్రధాన వాక్యంలో [a], [b] సూచికలు రెండూ చేర్చబడ్డాయి.
