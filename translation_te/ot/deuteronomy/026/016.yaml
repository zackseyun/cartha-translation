id: DEU.26.16
reference: Deuteronomy 26:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֗ה יְהוָ֨ה אֱלֹהֶ֜י/ךָ מְצַוְּ/ךָ֧ לַ/עֲשׂ֛וֹת אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה וְ/אֶת הַ/מִּשְׁפָּטִ֑ים וְ/שָׁמַרְתָּ֤ וְ/עָשִׂ֨יתָ֙ אוֹתָ֔/ם בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: te
  text: ఈ రోజు నీ దేవుడైన యెహోవా ఈ శాసనాలను, న్యాయవిధులను[a] ఆచరించమని నీకు ఆజ్ఞాపిస్తున్నాడు; మరియు నీవు నీ హృదయమంతటితోను నీ ప్రాణమంతటితోను వాటిని పాటించి ఆచరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “న్యాయవిధులు” అనే పదాన్ని “నియమాలు,” “విధులు,” లేదా “న్యాయతీర్పులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: కాలాన్ని నేరుగా సూచించే ఈ పదబంధం సందర్భంలోని తక్షణతను, నిబంధనాత్మక గంభీరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ ఇశ్రాయేలుతో ఉన్న నిబంధన సంబంధాన్ని ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: מְצַוְּךָ
  choice: నీకు ఆజ్ఞాపిస్తున్నాడు
  rationale: హీబ్రూ కృదంత రూపంలోని ప్రస్తుత, తక్షణ బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: ఆచరించమని
  rationale: చట్టసంబంధ సందర్భంలో కేవలం ‘చేయడం’కన్నా ‘ఆచరించడం’ సహజంగా ఉండి, ఆజ్ఞలను కార్యరూపంలో పెట్టే భావాన్ని ఇస్తుంది.
- source_word: הַחֻקִּים
  choice: శాసనాలు
  rationale: నిర్ణయించబడిన నిబంధనలు అనే చట్టపరమైన భావాన్ని ఇస్తూ מִשְׁפָּטִים నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: చట్టపరమైన తీర్పులు, నియమాలు అనే విస్తృత భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְשָׁמַרְתָּ
  choice: పాటించాలి
  rationale: నిబంధన సందర్భంలో שמר అంటే కాపాడుకోవడం మాత్రమే కాక విధేయతతో పాటించడం; తెలుగు వాక్యంలో ఆజ్ఞాత్మక బలాన్ని సహజంగా ఇస్తుంది.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: వాటిని ... ఆచరించాలి
  rationale: עשה అనే మూలపదపు పునరావృతిని సాధ్యమైనంతవరకు నిలుపుతూ ‘పాటించి ఆచరించాలి’ అనే జంట ద్వారా విధేయత మరియు కార్యాచరణ రెండింటినీ చూపుతుంది.
- source_word: בְּכָל לְבָבְךָ
  choice: నీ పూర్ణహృదయంతో
  rationale: ఆలోచన, సంకల్పం, అనురాగం సహా అంతరంగ సమగ్రతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: నీ పూర్ణప్రాణంతో
  rationale: נֶפֶשׁ యొక్క ప్రాణం, జీవితం, స్వయం అనే భావపరిధిని సాంప్రదాయికంగా మరియు గంభీరంగా నిలుపుతుంది; విస్తృత భావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన నామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరింత పునర్నిర్మిత ఉచ్చారణను ప్రతిబింబించే ప్రత్యామ్నాయం.
- issue: రెండవ పురుష ఏకవచన సంబోధన
  choice: నీ/నీవు అనే ఏకవచనాన్ని నిలుపడం
  alternative: ‘ఇశ్రాయేలూ’ అని స్పష్టంగా చేర్చడం లేదా బహువచనం వాడడం
  rationale: హీబ్రూ సమూహమైన ఇశ్రాయేలును ఏకవచనంలో నేరుగా సంబోధిస్తుంది. మూలంలోని నిబంధనాత్మక ప్రత్యక్షతను అదనపు వివరణ లేకుండా నిలిపాం.
- issue: וְ సంధానకారకపు బలం
  choice: తెలుగు ప్రవాహంలో ‘కాబట్టి’
  alternative: ‘మరియు’ లేదా వాక్య విరామం మాత్రమే
  rationale: రెండవ వాక్యభాగం మొదటి ఆజ్ఞకు అనుసరించాల్సిన బాధ్యతను తెలియజేస్తున్నందున తెలుగులో ‘కాబట్టి’ సహజంగా ఉంది; అయితే హీబ్రూ సాధారణ సంధానకారకం మాత్రమే కావడంతో ఇది స్వల్పంగా వివరణాత్మక ఎంపిక.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే నిబంధన మరియు ధర్మశాస్త్ర సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని రెండవ పురుష ఏకవచనం, ‘పాటించి ఆచరించాలి’ అనే ద్వంద్వ బలం, హృదయం–ప్రాణం జంట నిలుపబడ్డాయి.
