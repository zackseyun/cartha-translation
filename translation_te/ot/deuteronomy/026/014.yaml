source:
  edition: WLC
  text: לֹא אָכַ֨לְתִּי בְ/אֹנִ֜י מִמֶּ֗/נּוּ וְ/לֹא בִעַ֤רְתִּי מִמֶּ֨/נּוּ֙ בְּ/טָמֵ֔א וְ/לֹא נָתַ֥תִּי מִמֶּ֖/נּוּ לְ/מֵ֑ת שָׁמַ֗עְתִּי בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י עָשִׂ֕יתִי כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: te
  text: నేను దుఃఖంలో ఉన్నప్పుడు దానిలో కొంతనూ తినలేదు[a]; అపవిత్రంగా ఉన్నప్పుడు దానిలో కొంతనూ తొలగించలేదు[b]; ఒక మృతుని కోసం దానిలో కొంతనూ ఇవ్వలేదు[c]. నా దేవుడైన యాహ్వే స్వరానికి లోబడాను; నీవు నాకు ఆజ్ఞాపించినదంతా చేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా శోకంలో,’ ‘విచారంలో,’ లేదా ‘బాధలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దానిలో కొంతనూ కాల్చలేదు’ లేదా ‘దానిలో కొంతనూ తొలగించి వేయలేదు.’ హీబ్రూ క్రియ కాల్చడాన్ని లేదా తొలగించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఒక మృతునికి’ లేదా ‘మృతునికి సంబంధించిన దేనికోసం.’ నిషేధించబడిన ఉపయోగం ఏమిటో హీబ్రూ పాఠ్యం ఖచ్చితంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: నేను దుఃఖంలో ఉన్నప్పుడు
  rationale: אֹנִי దుఃఖం, శోకం లేదా బాధను సూచించగలదు. పవిత్ర భాగం మరియు అపవిత్రత ప్రస్తావన ఉన్న ఈ ఆచార సందర్భంలో, దుఃఖస్థితిలో ఉన్నప్పుడు తినడాన్ని సూచించే సహజమైన తెలుగు రూపాన్ని ఎంచుకున్నాం; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: దానిలో కొంతైనా తొలగించలేదు
  rationale: Piel రూపంలోని בער కాల్చడం, తొలగించడం, నిర్మూలించడం వంటి అర్థాలు ఇవ్వగలదు. ఇక్కడ చర్య యొక్క ఖచ్చిత స్వరూపాన్ని నిర్ణయించకుండా విస్తృతమైన ‘తొలగించలేదు’ అని అనువదించాం.
- source_word: בְּטָמֵא
  choice: అపవిత్రంగా ఉన్నప్పుడు
  rationale: ఇది ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. కాల/స్థితి భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמֵת
  choice: చనిపోయినవారి కోసం
  rationale: హీబ్రూ పదబంధం మృతునికి సంబంధించిన ఉపయోగాన్ని మాత్రమే సంక్షిప్తంగా సూచిస్తుంది; అది అంత్యక్రియల అర్పణనా, శవసంబంధమైన ఉపయోగమా అనేది స్పష్టంగా చెప్పదు. అందువల్ల విస్తృతతను నిలిపాం.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: మాటకు విధేయుడనయ్యాను
  rationale: ఈ హీబ్రూ నుడికారం కేవలం వినడాన్ని కాక, విని లోబడడాన్ని సూచిస్తుంది. తెలుగు ‘మాటకు విధేయుడనయ్యాను’ ఆ ఒడంబడిక సంబంధమైన విధేయతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: నీవు నాకు ఆజ్ఞాపించినదంతా
  rationale: దేవుడు ఆజ్ఞాపించిన సమస్తానికి సంపూర్ణ అనుగుణతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לְמֵת అనే నిషిద్ధ ఉపయోగం యొక్క స్వరూపం
  choice: ‘చనిపోయినవారి కోసం’ అనే విస్తృత పదబంధాన్ని నిలిపివేయడం
  alternative: ‘అంత్యక్రియల కోసం,’ ‘ఒక మృతునికి,’ లేదా ‘శవం విషయంలో’
  rationale: మూల హీబ్రూ ఖచ్చితమైన ఆచారాన్ని పేర్కొనదు. ఒక నిర్దిష్ట అంత్యక్రియల ఆచారం లేదా శవస్పర్శ అపవిత్రతను పాఠ్యంలోకి చేర్చకుండా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆచారపరమైన ప్రకటనకు తగిన గంభీరతను నిలుపుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణాన్ని వాడాం. ‘దానిలో కొంతైనా’ అనే పునరుక్తి మూలంలోని מִמֶּנּוּ పునరావృతిని ప్రతిబింబిస్తుంది. దైవనామానికి ‘యెహోవా’ రూపం ఉపయోగించబడింది.
