source:
  edition: WLC
  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: te
  text: అప్పుడు మేము మా పితరుల[a] దేవుడైన యాహ్వేకు మొరపెట్టుకున్నాం. యాహ్వే మా స్వరాన్ని[b] విని, మా బాధను, మా శ్రమను, మాపై జరిగిన అణచివేతను చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మా పూర్వీకుల దేవుడు.’ ఇక్కడ ‘పితరులు’ అనే మాట ఇశ్రాయేలు పూర్వపితరులతో దేవునికున్న ఒడంబడిక సంబంధాన్ని గుర్తుచేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘మా స్వరాన్ని’; భావం ‘మా మొరను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: మొరపెట్టుకున్నాం
  rationale: צעק ఇక్కడ సహాయం కోసం చేసిన తీవ్రమైన విజ్ఞప్తిని సూచిస్తుంది. ‘మొరపెట్టుకున్నాం’ ఆ అత్యవసరతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: మా పితరుల దేవుడు
  rationale: ఈ నిర్మాణం ఇశ్రాయేలు పితరులతో సంబంధమున్న ఒడంబడిక దేవుణ్ణి గుర్తిస్తుంది. ‘పితరులు’ మూలంలోని సాంప్రదాయ ఒడంబడిక సూత్రాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: మా స్వరాన్ని విని
  rationale: ‘మా స్వరాన్ని విన్నాడు’ అనే హీబ్రూ రూపాన్ని నిలుపుతూ, దేవుడు వారి మొరను ఆలకించాడనే భావాన్ని సందర్భం వెల్లడించేలా చేశాం.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: సరళమైన ‘చూశాడు’ మూలార్థాన్ని, అలాగే వారి స్థితిని దేవుడు గమనించాడనే అంతర్లీన బరువును అతివ్యాఖ్యానం చేయకుండా నిలుపుతుంది.
- source_word: עָנְיֵנוּ
  choice: మా బాధ
  rationale: עֳנִי బాధ, దుస్థితి లేదా దీనస్థితిని సూచిస్తుంది. ‘బాధ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, ఇక్కడి విమోచన సందర్భానికి సరిపోతుంది.
- source_word: עֲמָלֵנוּ
  choice: మా శ్రమ
  rationale: עָמָל కఠిన శ్రమను, ప్రయాసను లేదా కష్టాన్ని సూచించగలదు. ఐగుప్తులో బలవంతంగా చేయించిన పనిని గుర్తుచేసేలా ‘శ్రమ’ను ఎంచుకున్నాం; ఇది ‘బాధ’, ‘అణచివేత’ల నుంచి భావభేదాన్ని కూడా నిలుపుతుంది.
- source_word: לַחֲצֵנוּ
  choice: మాపై జరిగిన అణచివేత
  rationale: לַחַץ ఇతరులు కలిగించే ఒత్తిడి లేదా అణచివేతను సూచిస్తుంది. ‘మాపై జరిగిన అణచివేత’ బాధితులపై ప్రయోగించబడిన చర్యను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఒడంబడిక నామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం יהוה అనే వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- issue: ‘మా పితరుల దేవుడు’ అనే ఒడంబడిక సూత్రం
  choice: మా పితరుల దేవుడు
  alternative: మా పూర్వీకుల దేవుడు
  rationale: ‘పితరులు’ హీబ్రూ אֲבֹתֵינוּలోని పురుష పూర్వపితరుల సూచనను, పంచగ్రంథంలోని ఒడంబడిక సూత్రాన్ని నిలుపుతుంది; విస్తృతార్థంలో ‘పూర్వీకులు’ కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘బాధ—శ్రమ—అణచివేత’ అనే మూడు వేర్వేరు హీబ్రూ పదాల భావభేదాన్ని సాధ్యమైనంత స్పష్టంగా నిలిపాం; వాక్యంలోని దేవుని గమనింపు లేదా స్పందనను మూలంలో ఉన్నదానికంటే విస్తరించలేదు.
