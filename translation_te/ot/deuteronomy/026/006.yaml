    issue: “కఠినమైన చాకిరి” is narrower and less neutral than the source expression.
    rationale: The Hebrew denotes hard/harsh labor or service broadly. In modern standard Telugu, “చాకిరి” may evoke menial service, whereas “కఠిన శ్రమ” naturally conveys burdensome labor without narrowing the setting.
  revised_text: ఈజిప్టీయులు మాకు కీడు చేశారు; మమ్మల్ని బాధించారు; మాపై కఠిన శ్రమను మోపారు.
