  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּרֵ֧עוּ אֹתָ֛/נוּ הַ/מִּצְרִ֖ים וַ/יְעַנּ֑וּ/נוּ וַ/יִּתְּנ֥וּ עָלֵ֖י/נוּ עֲבֹדָ֥ה קָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: te
  text: ఈజిప్టీయులు మాకు కీడు చేశారు; మమ్మల్ని బాధించారు; మాపై కఠిన శ్రమను మోపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: మాకు కీడు చేశారు
  rationale: רעע హిఫీల్ రూపం హాని కలిగించడం లేదా చెడుగా వ్యవహరించడం అనే భావాన్ని ఇస్తుంది. ‘మాకు కీడు చేశారు’ అనేది సహజమైన తెలుగులో ఆ హానికర ప్రవర్తనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמִּצְרִים
  choice: ఈజిప్టీయులు
  rationale: ఇది అణచివేసిన సమూహంగా ఈజిప్టు ప్రజలను సూచించే నిర్దిష్ట జాతీయ నామం.
- source_word: וַיְעַנּוּנוּ
  choice: మమ్మల్ని బాధించారు
  rationale: ענה పియేల్ రూపానికి బాధించడం, అణచివేయడం, అవమానించడం వంటి అర్థవ్యాప్తి ఉంది. ‘బాధించారు’ మొదటి క్రియతో కలపకుండా, కలిగించిన వేదనను విస్తృతంగా నిలుపుతుంది.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: మాపై … మోపారు
  rationale: נתן על అనే ప్రయోగం ఒకరిపై భారాన్ని ఉంచడం లేదా విధించడం అనే భావం ఇస్తుంది. తెలుగులో ‘మోపారు’ ఆ భారసూచక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבֹדָה קָשָׁה
  choice: కఠినమైన చాకిరి
  rationale: עֲבֹדָה పని లేదా సేవను, קָשָׁה కఠినత్వాన్ని సూచిస్తాయి. సందర్భంలోని బలవంతపు, భారమైన సేవను ‘కఠినమైన చాకిరి’ సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అణచివేతను తెలిపే వరుస క్రియలను వేర్వేరుగా అనువదించడం
  choice: ‘మాకు కీడు చేశారు,’ ‘మమ్మల్ని బాధించారు,’ ‘మాపై కఠినమైన చాకిరి మోపారు’ అనే మూడు వేరు భావవ్యక్తీకరణలను ఉపయోగించడం
  alternative: మొదటి రెండు క్రియలను ఒకే ‘అణచివేశారు’ అనే భావంలో కలపడం
  rationale: హీబ్రూ పాఠం పరస్పర సంబంధమున్నా ఒకే అర్థం కాని మూడు వ్యక్తీకరణలతో అణచివేతను క్రమంగా వివరిస్తుంది. వాటిని వేర్వేరుగా ఉంచడం మూలంలోని వాక్చాతుర్యాన్ని, భావప్రగతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన శైలి. మూలంలోని మూడు దశల భావప్రగతి నిలుపబడింది; అనవసరంగా బలమైన బానిసత్వ పదజాలం చేర్చలేదు.
