id: DEU.26.4
reference: Deuteronomy 26:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן הַ/טֶּ֖נֶא מִ/יָּדֶ֑/ךָ וְ/הִ֨נִּיח֔/וֹ לִ/פְנֵ֕י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: te
  text: అప్పుడు యాజకుడు నీ చేతిలోనుండి ఆ బుట్టను తీసుకొని, నీ దేవుడైన యాహ్వే[a] బలిపీఠం ఎదుట దానిని ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు హీబ్రూ రూపాన్ని మరియు సంప్రదాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְלָקַח
  choice: అప్పుడు ... తీసుకొని
  rationale: ఆచార విధానంలోని వరుస చర్యను సూచించే సంయుక్త క్రియారూపం; తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: నిర్దిష్ట ఏకవచన నామవాచకం; ఈ ఆచారాన్ని నిర్వహించే యాజకుణ్ణి సూచిస్తుంది.
- source_word: הַטֶּנֶא
  choice: ఆ బుట్టను
  rationale: ప్రథమఫలాలను ఉంచిన బుట్టను సూచిస్తుంది; ముందే ప్రస్తావించిన నిర్దిష్ట వస్తువు కాబట్టి ‘ఆ’ వాడబడింది.
- source_word: מִיָּדֶךָ
  choice: నీ చేతిలోనుండి
  rationale: అర్పించేవాని చేతినుండి యాజకునికి జరిగే ప్రత్యక్ష బదిలీని, మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: וְהִנִּיחוֹ
  choice: దాన్ని ఉంచాలి
  rationale: హిఫిల్ రూపం ఇక్కడ పెట్టడం లేదా ఉంచడం అనే అర్థం ఇస్తుంది; ప్రత్యయం బుట్టనే సూచిస్తుంది. విధానాత్మక భావాన్ని ‘ఉంచాలి’ తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: బలిపీఠానికి సంబంధించి స్థలార్థకంగా ‘ముందు/ఎదుట’ అనే భావం; ఆరాధనా సందర్భంలో ‘ఎదుట’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: מִזְבַּח
  choice: బలిపీఠం
  rationale: బలులు అర్పించే altar‌కు ప్రామాణిక తెలుగు పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా పరిచయమైన నామరూపంతో అందిస్తుంది; మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన సంబోధనను నిలుపుతూ, ‘యెహోవా’తో సంబంధాన్ని సహజ తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం יהוה అనే వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంగా ఉంచడం మూలానికి దగ్గరగా ఉంటుంది; ‘యెహోవా’ తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం. పాదటిప్పణి హీబ్రూ అక్షరరూపాన్ని, సంప్రదాయ ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆచార విధానానికి తగిన గౌరవప్రదమైన శైలి. ఏకవచన ‘నీ’ మూలంలోని ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
