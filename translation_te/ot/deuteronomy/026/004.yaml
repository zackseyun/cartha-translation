  source_fidelity: మూల హీబ్రూలోని యెహోవా/יהוה (YHWH) దైవనామాన్ని ఆంగ్ల POB audit trail అనుసరించి ‘యాహ్వే’గా ఇవ్వాలి. ప్రస్తుత ‘యెహోవా’ రూపం మూల వ్యంజనలిపి ఆధారంగా నేరుగా వచ్చిన ఉచ్చారణ కాదు; అలాగే పాదటిప్పణి దానిని కేవలం ప్రత్యామ్నాయ ఉచ్చారణగా చూపడం అసంగతం. మిగతా వాక్యభాగాలు—యాజకుడు, బుట్టను చేతిలోనుండి తీసుకోవడం, బలిపీఠం ఎదుట ఉంచడం—మూలానికి నమ్మకంగా ఉన్నాయి.
  naturalness: ‘అప్పుడు యాజకుడు నీ చేతిలోనుండి ఆ బుట్టను తీసుకొని ... దానిని ఉంచాలి’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఆచార-విధాన శైలి. ‘దాన్ని’ స్థానంలో ‘దానిని’ కొద్దిగా మరింత సంపాదకీయంగా సజావుగా ఉంటుంది.
  terminology: ‘యాజకుడు,’ ‘బుట్ట,’ ‘బలిపీఠం’ తగిన ప్రామాణిక పదాలు. దైవనామానికి ‘యాహ్వే’ను స్థిరంగా వాడాలి; ‘నీ దేవుడైన యాహ్వే’ మూలంలోని ‘యాహ్వే, నీ దేవుడు’ అనే సంబంధాన్ని సహజంగా ప్రతిబింబిస్తుంది.
  issues:
