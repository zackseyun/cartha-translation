id: HEB.12.23
reference: Hebrews 12:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: ja
  text: また、天[a]に登録されている長子たちの集いに、すべての者を裁く神に、そして完全な者とされた正しい人々の霊に、近づいているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「諸天に」。ギリシア語では「天」が複数形です。
    reason: 原文の複数形を示しつつ、本文では自然な日本語の単数表現を用いるため。
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: 集い
  rationale: 天のシオンに集められた共同体という文脈に合わせ、後代の制度的含意を避けつつ、集められた人々という基本義を自然な日本語で表す。
- source_word: πρωτοτόκων
  choice: 長子たち
  rationale: 複数属格の実質名詞的用法を保ち、長子としての身分や相続権を持つ人々を示す。「息子たち」は原文以上に性別を明示するため避ける。
- source_word: ἀπογεγραμμένων
  choice: 登録されている
  rationale: 完了受動分詞が示す、登録済みで現在もその状態にあることを表し、名簿・登録の比喩も保つ。
- source_word: ἐν οὐρανοῖς
  choice: 天に
  rationale: ギリシア語は複数形だが、日本語では「天に」が自然であり、同じ領域概念を過不足なく伝える。原文の複数形は脚注で明示する。
- source_word: κριτῇ θεῷ πάντων
  choice: すべての者を裁く神
  rationale: πάντωνを人々への裁きとして自然に表しつつ、神が万人の裁き主であるという同格的関係を明確にする。
- source_word: πνεύμασι
  choice: 霊
  rationale: 語の基本義をそのまま採り、天使などへの解釈的な言い換えを避ける。
- source_word: δικαίων
  choice: 正しい人々
  rationale: 人間を指す複数形を現代日本語で明確かつ包括的に表す。
- source_word: τετελειωμένων
  choice: 完全な者とされた
  rationale: 完了受動の形と、ヘブライ書における完成・完全という主題を保つ。単なる道徳的無欠ではなく、完成へ導かれた意味も含み得る表現とする。
theological_decisions:
- issue: 「長子たち」の指示対象
  choice: 長子の身分・相続にあずかる神の民を集合的に指す表現として訳す。
  alternative: キリスト一人を「長子」とし、その長子に属する集いと理解する。
  rationale: πρωτοτόκωνが複数形であるため、集合的な人々を指す読みが文法上最も素直である。ただし、その身分の詳しい神学的内容は訳文に付加しない。
- issue: 「完全な者とされた正しい人々の霊」の指示対象
  choice: 神の前で完成へ至らされた正しい人々の霊として、原文どおり簡潔に表す。
  alternative: 肉体を離れた義人の死者に限定する、または身体の有無を問わずすべての義人を指すと明示する。
  rationale: 人間の霊を指すことは自然だが、中間状態について原文が明言しない詳細までは訳文に持ち込まない。
translation_notes:
  register: 現代の一般読者に明瞭で、礼拝朗読にも耐える格調を保った。「近づいているのです」は前節から続く与格列を日本語の独立した節として成立させるため補った文脈上の述語である。
source_grounding:
  english_pob_role: consult_only
