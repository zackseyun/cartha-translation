id: HEB.12.1
reference: Hebrews 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: ja
  text: こういうわけで、私たちも、これほど大勢の証人たちという雲に囲まれているのですから、あらゆる重荷と、まとわりつく罪[a]を捨て、私たちの前に置かれている競走を、忍耐をもって走り抜こう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「容易に絡みつく罪」「しっかりまといつく罪」「容易に罠にかける罪」。このギリシア語の形容詞は用例が少なく、絡みつくこと、罠にかけること、またはぴったりまといつくことのいずれを強調するのか確定しにくい。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: こういうわけで
  rationale: 11章を受けて結論と勧告を導く推論の力を、自然な現代日本語で表した。
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: これほど大勢の証人たちに雲のように
  rationale: 多数性を表す「雲」の比喩を保ちつつ、日本語として理解しやすい語順と表現にした。
- source_word: περικείμενον ἡμῖν
  choice: 私たちも…取り囲まれている
  rationale: 証人たちが周囲にいるという空間的イメージを明瞭に伝える。
- source_word: μαρτύρων
  choice: 証人たち
  rationale: 11章の人々が信仰を証しするという意味を保ち、彼らを観客とのみ断定しない表現とした。
- source_word: ὄγκον ... πάντα
  choice: あらゆる重荷
  rationale: 走者の妨げとなる重量・負担という競走の比喩を保持した。
- source_word: ἀποθέμενοι
  choice: 捨て
  rationale: 競走に先立って、またはそれに伴って妨げを決然と取り除く動作を簡潔に表す。
- source_word: τὴν εὐπερίστατον ἁμαρτίαν
  choice: まとわりつく罪
  rationale: 走者を妨げる罪という文脈に合う一方、この稀な形容詞の意味上の不確かさは脚注で明示した。定冠詞を特定の一つの罪名と断定せず、罪を具体的な妨げとして表した。
- source_word: δι’ ὑπομονῆς
  choice: 忍耐をもって
  rationale: 困難の中でも持続する堅忍を、明瞭で格調ある日本語で表した。
- source_word: τρέχωμεν
  choice: 走ろうではありませんか
  rationale: 一人称複数の勧奨的接続法を、読者を含む共同の勧めとして表した。
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: 私たちの前に置かれている競走
  rationale: τρέχωμενとの結びつきからἀγώνを「競走」とし、定められた行程が前にあるというπρόκειμαιのイメージを保った。
theological_decisions:
- issue: ヘブライ11章との関係における「証人たち」の意味
  choice: 信仰による生き方を通して証しする人々であり、その人々に囲まれているというイメージが勧告を強める
  alternative: 天から信者の競走を見守る観客であることを主眼とする
  rationale: 直前の11章は信仰によって忍耐した人々を列挙している。訳文では「証人たち」を保持し、彼らが積極的に観戦しているとまでは限定せず、解釈上の余地を残した。
- issue: 「罪」が特定の一つの罪を指すか
  choice: 罪を具体的な妨げとして述べるが、特定の罪名には限定しない
  alternative: 不信仰など一つの特定の罪を指す
  rationale: ギリシア語には定冠詞があるものの、本文は罪の名称を特定していないため、訳でそれ以上の限定を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告にふさわしい格調を保った。「証人の雲」という直訳的で硬い表現は避け、「大勢の証人たちに雲のように」として比喩と可読性を両立させた。
