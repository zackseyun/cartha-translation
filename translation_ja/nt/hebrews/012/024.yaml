id: HEB.12.24
reference: Hebrews 12:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: ja
  text: また、新しい契約の仲介者であるイエスに、そして、アベルよりもすぐれたことを語る、振りかけられた血[b]に近づいています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「近づいています」は、22節の動詞を補ったものです。
    reason: 文脈上補われた動詞の明示
  - marker: b
    text: 「振りかけられた血」は、契約を結ぶことや清めに際して、いけにえの血を振りかけたことを背景としています。アベルとの比較は、地から叫んだアベルの血（創世記4:10）を暗示していると考えられます。原文は簡潔に「アベルよりも」としています。
    reason: 祭儀的背景と比較表現の曖昧さの説明
lexical_decisions:
- source_word: διαθήκης νέας
  choice: 新しい契約
  rationale: διαθήκηはヘブライ人への手紙では聖書的な契約関係を表す。「新約」ではなく「新しい契約」とし、冠詞のない表現を日本語で自然に訳した。
- source_word: μεσίτῃ
  choice: 仲介者
  rationale: 契約を成立させるために当事者の間に立つ者という法的・神学的意味を、現代日本語で明確に表す。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 日本語聖書で定着した人名表記に従った。
- source_word: αἵματι ῥαντισμοῦ
  choice: 振り注がれた血
  rationale: 契約締結や清めに際して血を振りかける祭儀的背景を保ちつつ、単なる『散った血』と誤解されにくい表現とした。
- source_word: κρεῖττον λαλοῦντι
  choice: すぐれたことを語る
  rationale: κρεῖττονの比較と、血が『語る』という擬人的表現を自然な日本語で保持した。何がすぐれているかは明示しすぎず、原文の簡潔さを残した。
- source_word: παρὰ τὸν Ἅβελ
  choice: アベルよりも
  rationale: 原文は『アベルの血』と補わず、アベル本人を比較対象として簡潔に記すため、その省略と曖昧さを本文に保った。
theological_decisions:
- issue: アベルとの比較対象
  choice: 本文を『アベルよりも』とし、原文の簡潔な比較を保持する
  alternative: 『アベルの血よりも』、または『アベルの血が求めたものよりも良いことを』
  rationale: 創世記4章10節の、地から叫ぶアベルの血への暗示は濃厚だが、ギリシア語本文は明示的には『アベル』とのみ述べる。本文で補完せず、注で有力な理解を示した。
- issue: 節の統語上の未完結性
  choice: 前節から続く与格の列挙を、日本語では『近づいています』を補って完結させる
  alternative: 『イエスに、また……血に。』と断片のまま訳す
  rationale: 12章22節の προσεληλύθατε が支配する列挙であるため、現代日本語で単独の節として理解できるよう動詞を補った。補足であることを脚注で明示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。前節から続く列挙を単独でも読めるようにしつつ、補った動詞を脚注で示した。本文中の脚注記号は、それぞれ説明対象である『振り注がれた血』と補足動詞の直後に配置した。
