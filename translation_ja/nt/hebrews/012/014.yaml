source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: ja
  text: すべての人との平和、また聖さ[a]を追い求めなさい。この聖さがなければ、だれも主を見ることはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖化」。ギリシア語は、生活に現れる聖さという性質、または聖なるものとされていく状態や過程を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: 平和
  rationale: 人との関係における平和を指す語であり、「すべての人と」という句に合わせて「すべての人との平和」とした。単なる内面的な平安には限定しない。
- source_word: διώκετε
  choice: 追い求めなさい
  rationale: 継続的かつ熱心に求める能動的な響きを保ち、現代日本語の勧告として自然に表した。
- source_word: μετὰ πάντων
  choice: すべての人との
  rationale: 対象が例外なく人々全体に及ぶことを明確にし、「平和」と自然につながる形にした。
- source_word: τὸν ἁγιασμόν
  choice: 聖さ
  rationale: この語は聖なる状態・生活の性質と、聖なるものとされていく過程の双方を含み得る。本文では勧告として分かりやすい「聖さ」を用い、別訳を脚注に示した。
- source_word: οὗ χωρὶς
  choice: この聖さがなければ
  rationale: 男性単数の関係代名詞が直前の ἁγιασμόν を受けることを日本語で明確にした。
- source_word: οὐδεὶς ὄψεται
  choice: だれも…見ることはありません
  rationale: 絶対的な否定と未来の意味を、明瞭で自然な現代日本語にした。
- source_word: τὸν κύριον
  choice: 主
  rationale: 原文の称号をそのまま保ち、父なる神かイエス・キリストかを訳文で限定しない。
theological_decisions:
- issue: ἁγιασμός の意味
  choice: 本文では「聖さ」
  alternative: 「聖化」
  rationale: 倫理的・宗教的な生活の性質を普通の読者に明瞭に伝えつつ、聖なるものとされる状態または過程という語義を脚注で保持した。
- issue: 「主」の指示対象
  choice: 「主」のまま保持
  alternative: 「神」または「主イエス」と明示
  rationale: 原文は指示対象を明示していないため、特定の理解に狭めず、その曖昧さを保った。
- issue: οὗ χωρὶς の先行詞
  choice: 「聖さ」を指すものとして明示
  alternative: 平和と聖さの両方を指すと解する
  rationale: 関係代名詞 οὗ は男性単数で、直前の男性単数名詞 ἁγιασμόν と文法的に一致する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告の力強さと宗教的な尊厳を保った。長い関係節を独立文にして意味関係を明確にし、「この聖さ」で原文の先行詞を示した。
