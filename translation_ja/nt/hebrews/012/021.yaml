  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: ja
  text: その光景[a]があまりにも恐ろしかったので、モーセは言った[b]。「私はひどく恐れ、震えている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「現れたもの」または「目に映ったもの」。ギリシャ語は、シナイで目に見える形で現れたものを指す。
    reason: lexical_alternative
  - marker: b
    text: この言葉は旧約聖書からの逐語的な引用ではないが、シナイでの出来事に結び付いたモーセの恐れを反映している。申命記9章19節参照。
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: （前文からの連続として無訳）
  rationale: 前節から叙述をつなぐ接続詞。日本語では「その光景が」で自然に連続性が伝わるため、機械的に「そして」を置かない。
- source_word: οὕτω φοβερὸν ἦν
  choice: あまりにも恐ろしかった
  rationale: οὕτω が表す程度の強さと、φοβερόν の強烈な恐ろしさを、自然な現代日本語で表す。
- source_word: τὸ φανταζόμενον
  choice: その光景
  rationale: シナイで目に見える形で現れたものを指す名詞化された分詞。「光景」は経験される視覚的現れを簡潔に示しつつ、何が現れたかを限定しすぎない。
- source_word: Μωϋσῆς εἶπεν
  choice: モーセは言った
  rationale: 人名と一般的な発話動詞を、標準的かつ直接的に訳す。
- source_word: Ἔκφοβός εἰμι καὶ ἔντρομος
  choice: 私は恐れ、おののいている
  rationale: ἔκφοβος の強い恐怖と、ἔντρομος の震え・戦慄を別々に保つ。「おののく」は身体的な震えを伴う恐怖を表し、聖書本文にふさわしい品位もある。
theological_decisions:
- issue: この発言と旧約のシナイ物語との関係
  choice: 本文では、恐ろしい顕現に対するモーセの発言としてそのまま訳す。
  alternative: 申命記9章19節などに基づく自由な要約であることを本文中で説明する。
  rationale: ギリシャ語本文はモーセが語ったと明言する一方、この文言は旧約の逐語的引用ではない。本文ではその緊張を解消せず、出典上の事情は脚注に示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、直接話法には簡潔で厳粛な響きを保った。「恐れ、おののいている」は二つのギリシャ語形容詞を区別して表し、過度に口語化しない。脚注記号は英語監査層の提示順に合わせて本文中を[b][a]とした。
