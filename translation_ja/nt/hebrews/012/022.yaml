    rationale: 「あなたがたが近づいている」は進行中の接近として読まれやすく、προσεληλύθατε（すでに近づいた／来たことの現在的効力を含む完了形）を十分に表さない。
  - severity: low
    issue: 脚注アンカーの対象
    rationale: 統語に関する脚注は「祝祭の集い」に、語義に関する脚注は「幾万もの」に付すと、それぞれが何を説明するか明確になる。
