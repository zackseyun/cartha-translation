id: HEB.12.22
reference: Hebrews 12:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: ja
  text: しかし、あなたがたは、シオンの山、生ける神の都、すなわち天のエルサレム、そして祝祭の集い[a]にいる幾万もの[b]御使いたちに近づいてきました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幾万もの御使いたち、祝祭の集い」。ギリシア語では、「祝祭の集い」を御使いたちの様子と取ることも、列挙された別の項目と取ることもできる。
    reason: alternative_reading
  - marker: b
    text: 「幾万もの」は、文字どおり「何万もの」を指すことも、より広く、数え切れないほどの大群を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前のシナイ山への接近との強い対比を、現代日本語で自然かつ明確に示す。
- source_word: προσεληλύθατε
  choice: あなたがたが近づいている
  rationale: 完了形が表す、すでに近づいた結果として現在その場にある状態を日本語で表現する。単なる過去の出来事には限定しない。
- source_word: Σιὼν ὄρει
  choice: シオンの山
  rationale: 固有名と山のイメージを保ち、日本語として自然な語順にした。
- source_word: πόλει θεοῦ ζῶντος
  choice: 生ける神の都
  rationale: θεοῦの属格を所属・所有として表し、ζῶντοςの聖書的で重みのある表現を「生ける」によって保持する。
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: 天のエルサレム
  rationale: 直前の「生ける神の都」と同格であることを「である」によって明示しつつ、ἐπουράνιοςを簡潔で自然な日本語にした。
- source_word: μυριάσιν ἀγγέλων
  choice: 幾万もの御使いたち
  rationale: μυριάςが文字どおりの「万の幾倍」も、数え切れない大群も指し得ることを保つ。宗教的文脈にふさわしい「御使い」を用いた。
- source_word: πανηγύρει
  choice: 祝祭に集う
  rationale: 祝いのための公的な集会という語義を自然な日本語で表し、本文では直前の御使いたちに結び付けた。別の統語的理解は脚注に残した。
theological_decisions:
- issue: πανηγύρειの統語的な結び付き
  choice: 「祝祭に集う」が直前の「幾万もの御使いたち」を説明する
  alternative: 「幾万もの御使いたち」と「祝祭の集い」を、近づいた対象として別々に並べる。または次節の「長子たちの集会」と結び付ける。
  rationale: 与格の連続には複数の解釈が可能だが、直前の御使いたちに結び付ければ、天上で祝う大群という首尾一貫した意味になる。ギリシア語に実在する曖昧さは脚注で明示し、特定の教理的理解に固定しない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「生ける神」「御使い」によって聖書本文にふさわしい品位を保った。列挙関係が把握しやすいよう「近づいているのは」という構文を用い、「生ける神の都」と「天のエルサレム」の同格関係を自然に示した。
