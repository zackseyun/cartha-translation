id: HEB.12.15
reference: Hebrews 12:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: ja
  text: だれも神の恵みを受け損なう人がいないように[a]、また、苦い根[b]が生え出て悩みを引き起こし、それによって多くの人が汚されることのないように、よく見守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の恵みに達しない者がないように」。ギリシア語の表現は、神の恵みを得られないこと、またはそれに及ばないことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「苦い根」は申命記29章18節を踏まえた表現である可能性がある。そこでは、苦味と毒を生じる根という比喩が、主から心を背ける者を表している。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: よく見守りなさい
  rationale: 現在分詞の継続的な監督・注意の意味を、文脈上の勧告として自然な現代日本語で表した。制度的な「監督」ではなく、共同体全体への注意深い見守りを示す。
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: だれも神の恵みに達しない者とならないように
  rationale: ὑστερέωとἀπόの組み合わせが持つ、差し出されたものに達しない、またはそれに及ばないという警告を保つ。救いの喪失など特定の教理的結論は訳文に持ち込まない。
- source_word: χάριτος
  choice: 恵み
  rationale: 神から与えられる好意と救済的含意を併せ持つ、聖書日本語として自然で定着した語を用いた。
- source_word: ῥίζα πικρίας
  choice: 「苦い根」
  rationale: 属格表現を簡潔に再現し、申命記29章18節への響きを保った。「苦々しさの根」と限定せず、契約への背信や有害な実を生むものを含み得る比喩として残した。
- source_word: ἄνω φύουσα
  choice: 生え出て
  rationale: 根が上方へ芽を出して現れるという生長の比喩を、簡潔で自然な表現にした。
- source_word: ἐνοχλῇ
  choice: 悩みを引き起こし
  rationale: 共同体を悩ませ、混乱させる作用を表す。単なる不快感に弱めず、同時に過度に具体化しない表現を選んだ。
- source_word: δι’ αὐτῆς
  choice: それによって
  rationale: 女性代名詞が直前の「根」を指すことを自然に示し、διάの手段・媒介の意味を保った。
- source_word: μιανθῶσιν πολλοί
  choice: 多くの人が汚される
  rationale: μιαίνωの道徳的・祭儀的な汚れの強い含意を「汚される」で保持し、単なる社会的悪影響に弱めなかった。
theological_decisions:
- issue: 「神の恵みに達しない」が、救いの喪失、恵みを受け損なうこと、または共同体からの排除のいずれを意味するか
  choice: 神の恵みに達しない者とならないように
  alternative: 神の恵みを得損なう者がないように／神の恵みから外れる者がないように
  rationale: 原文は恵みに到達しない、またはそれに及ばないという警告を表し得るが、後代の背教や堅忍をめぐる教理論争をこの一節だけで決着させてはいない。訳文と脚注で幅を保った。
- issue: 「苦い根」を個人的な怨恨に限定するか、申命記に由来する共同体内の背信の比喩として保つか
  choice: 「苦い根」と直訳的に表し、脚注で申命記との関連を示す
  alternative: 恨みの根／苦々しさの根
  rationale: 申命記29章18節では、有毒な実を生む根が契約への背信を象徴する。感情的な恨みだけに限定しないため、比喩の広がりを保った。
- issue: μιαίνωを社会的な迷惑程度に弱めるか
  choice: 汚される
  alternative: 悪影響を受ける／害される
  rationale: 原語には道徳的・祭儀的な汚染の強い意味があるため、その深刻さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「恵み」「汚される」など原文の神学的・聖書的重みを担う語は保持した。文頭の分詞は前後の勧告に沿って「よく見守りなさい」とした。「苦い根」は慣用的に個人の苦々しい感情だけを指すと誤解されないよう引用符と脚注を付した。
