  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: ja
  text: というのも、彼らは命じられたことに耐えられなかったからです。「たとえ動物でも、その山に触れるなら、石で打ち殺される。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本には、「または矢で射られる」と続く。これは出エジプト記19章12～13節に呼応している。
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: 耐えられなかった
  rationale: 否定を伴うφέρωはここでは「耐える、堪える」の意。シナイで告げられた命令の厳しさに耐えられなかったことを、自然な現代日本語で表す。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の内容に理由・説明を加える接続辞であるため、日本語として自然に説明関係が伝わる形にした。
- source_word: τὸ διαστελλόμενον
  choice: 次のような命令
  rationale: διαστέλλομαιの受動分詞は、権威をもって命じられた事柄を指す。後続する引用を自然に導きつつ、「命令」という意味を明確にした。
- source_word: Κἂν
  choice: たとえ……でも
  rationale: καὶ ἐάνの条件と強調のニュアンスを表し、人間だけでなく獣でさえ例外ではないことを示す。
- source_word: θηρίον
  choice: 獣
  rationale: 動物一般を指し得る語だが、聖書的文脈で簡潔かつ格調を保つ「獣」とした。野生動物だけに限定する意図はない。
- source_word: θίγῃ
  choice: 触れるなら
  rationale: 条件節中のアオリスト接続法を、日本語で自然な条件表現として訳した。
- source_word: τοῦ ὄρους
  choice: その山
  rationale: 文脈上はシナイ山を指すが、原文は固有名を用いず「山」としているため、それを保った。指示対象の明確さのため「その」を添えた。
- source_word: λιθοβοληθήσεται
  choice: 石で打ち殺される
  rationale: 未来受動形が示す処刑を明確に表す。「石打ちにされる」より一般読者に意味が伝わりやすい表現とした。
theological_decisions:
- issue: シナイでの命令の引用範囲
  choice: SBLGNT本文どおり「石で打ち殺される」で引用を終える。
  alternative: 出エジプト記19章12–13節に呼応する「または矢で射られる」を本文に加える。
  rationale: 一部の写本には追加句があるが、提示されたギリシア語本文にはない。本文を調和的に拡張せず、異読は脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、引用命令の厳粛さを保った。「というのも……からです」で前節との説明関係を示し、「たとえ獣でも」で原文の強調を自然に表現した。
