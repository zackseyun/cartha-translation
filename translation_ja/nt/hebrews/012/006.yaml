source:
  edition: SBLGNT
  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: ja
  text: 主は、愛する者を鍛え、受け入れるすべての息子をむち打つからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「むち打つ」は、鞭で打つことを表す強い語です。ここでは厳しい訓練を描いています。
    reason: lexical_alternative
  - marker: b
    text: 「すべての息子」は、原文の表現です。文脈上、神がご自分の子として受け入れる人々を代表的に指しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: 者を／子を
  rationale: 二つの関係代名詞を、日本語として自然な名詞句と目的語の形で表し、一般的な命題としての単数の人称的指示を保った。
- source_word: γὰρ
  choice: からです
  rationale: 直前の勧告を根拠づける接続語の働きを、自然な現代日本語で示した。
- source_word: ἀγαπᾷ
  choice: 愛する
  rationale: 語の基本的な意味を簡潔かつ自然に表した。
- source_word: κύριος
  choice: 主
  rationale: 称号としての神学的な重みを保つ、標準的で簡潔な訳語を用いた。
- source_word: παιδεύει
  choice: 鍛え
  rationale: 罰だけでなく、教育的・形成的な訓練と矯正を含む語義を表すため。文脈上の父による訓練にも自然につながる。
- source_word: μαστιγοῖ
  choice: むち打たれる
  rationale: 鞭で打つという強い比喩を弱めず、現代の読者にも意味が明瞭な表現を選んだ。
- source_word: δὲ
  choice: （読点による並列）
  rationale: ここでは強い対立よりも第二の節を続ける働きが中心であり、日本語では明示的な接続詞を置かず並列するのが自然である。
- source_word: πάντα υἱὸν
  choice: すべての子
  rationale: υἱόςの親子関係と文脈上の子としての身分を保ちつつ、一般的・代表的に神の子ら全体を指す働きを、現代日本語で誤解なく表した。
- source_word: παραδέχεται
  choice: 受け入れる
  rationale: 承認し、好意をもって迎え入れるという関係的な含みを自然に表した。
theological_decisions:
- issue: υἱόςが神の訓練と子としての身分を語る文脈で持つ代表的範囲
  choice: すべての子
  alternative: すべての息子
  rationale: ギリシア語は男性単数だが、この格言的表現は神がご自分の子として認める者全体に及ぶ。日本語の「息子」は男性だけを指す意味が強いため、「子」により親子関係の比喩と代表的範囲をともに保った。
- issue: μαστιγοῖが示す神の訓練の厳しさ
  choice: むち打たれる
  alternative: 厳しく懲らしめられる
  rationale: 原文の身体的で苛烈な比喩を抽象化して弱めず、神の愛と痛みを伴う訓練との緊張をそのまま残した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「鍛える」で παιδεύω の教育的・形成的側面を示し、「むち打つ」で後半の強烈さを保持した。敬意を示すため、神を主語とする述語に尊敬表現を用いた。
