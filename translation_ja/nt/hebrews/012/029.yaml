  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: ja
  text: なぜなら、私たちの神は焼き尽くす火だからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 申命記4章24節で、神が「焼き尽くす火」と述べられていることを反映しています。
    reason: cross_reference
  - marker: b
    text: 別訳「焼き尽くしてしまう火」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実に
  rationale: γάρの説明・根拠提示の働きを文末の「なのです」とともに表し、καίの強調も自然な現代日本語の「実に」に込めた。直前の勧告を受けるつながりを保つ。
- source_word: ὁ θεὸς ἡμῶν
  choice: 私たちの神
  rationale: 属格の所有・共同体的な関係を、自然で明瞭な日本語でそのまま表した。
- source_word: πῦρ
  choice: 火
  rationale: 申命記4章24節を響かせる比喩を解釈で置き換えず、字義どおり保持した。
- source_word: καταναλίσκον
  choice: 焼き尽くす
  rationale: 完全に消費し尽くす、滅ぼし尽くすという分詞の強い意味を自然な日本語で表した。「焼き尽くす火」は火の作用を明瞭にしつつ、原文の比喩を保つ。
theological_decisions:
- issue: 神を火とする比喩的な叙述
  choice: 「私たちの神は、実に、焼き尽くす火なのです」
  alternative: 「私たちの神は、焼き尽くす火のような方です」
  rationale: ギリシア語は比較を示す語を伴わない等置文であるため、「ような」を補って直喩に弱めず、警告の文脈と申命記4章24節への響きを保持した。
- issue: καταναλίσκονの表現
  choice: 「焼き尽くす火」
  alternative: 「すべてを焼き尽くす火」
  rationale: 原文に明示されていない目的語「すべて」を本文へ補わず、何を焼き尽くすかという開かれた表現を保った。
translation_notes:
  register: 明瞭な現代標準語による、簡潔で荘重な警告の調子。「なのです」で直前の文への説明・根拠提示を自然に示し、「実に」によりκαίの強調を反映した。比喩は弱めず、そのまま保持した。
