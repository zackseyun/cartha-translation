id: HEB.12.17
reference: Hebrews 12:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: ja
  text: あなたがたが知っているように、エサウは後になっても、祝福を受け継ごうとしたとき、退けられました。というのも、涙を流してそれ[b]を切に求めたにもかかわらず、悔い改めの余地[a]を見いだせなかったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悔い改めの余地を見いだせなかった」は、起きた結果を覆す機会がなかった、またはイサクに考えを変えてもらうことができなかった、という意味にも取れます。
    reason: alternative_reading
  - marker: b
    text: 「それ」は「祝福」を指すとも、「悔い改め」またはその「余地」を指すとも考えられます。ギリシア語では指示対象が明確に限定されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: あなたがたも知っているとおり
  rationale: 現在の意味を持つ οἶδα の完了形。読者がすでに知っている事柄に訴える語調を、自然な日本語で表した。γάρ は文脈とのつながりを「とおり」に含ませた。
- source_word: μετέπειτα
  choice: 後になって
  rationale: その後の時点を示す時間副詞。警告の文脈に合う明瞭で自然な表現。
- source_word: θέλων
  choice: 願いましたが
  rationale: 意志・願望を示す分詞。「望んだ」より文脈に自然な「願った」とし、後続する拒絶との関係を「が」で示した。
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: 祝福を受け継ぎたい
  rationale: 父から与えられる特定の祝福という創世記の背景を保ちつつ、κληρονομέω の継承の意味を明示した。
- source_word: ἀπεδοκιμάσθη
  choice: 退けられました
  rationale: 検討の末に受け入れられないという受動の意味を表し、救済論上の専門的意味を持ち込まない表現とした。
- source_word: μετανοίας ... τόπον οὐχ εὗρεν
  choice: 悔い改めの余地を見いだせなかった
  rationale: τόπος の比喩的な「余地」を保ち、μετάνοια は新約聖書で通常用いられる「悔い改め」とした。結果を覆す機会、またはイサクの心変わりを得る余地という解釈可能性は注に残した。
- source_word: καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν
  choice: 涙を流してそれを求めたにもかかわらず
  rationale: 譲歩の構文と、涙を伴う切実な探求を自然な日本語で表現した。「それ」は祝福または悔い改めの余地を指し得る原文の曖昧さを保持する。
theological_decisions:
- issue: αὐτήν（「それ」）の指示対象
  choice: 本文では「それ」とし、指示対象を限定しない
  alternative: 「祝福」を求めた、または「悔い改めの余地」を求めたと明示する
  rationale: 女性形の代名詞は「祝福」または「悔い改め」を指し得るため、原文以上に解釈を限定しない。
- issue: μετανοίας τόπον の意味
  choice: 「悔い改めの余地」
  alternative: 「事態を覆す機会」または「イサクに考えを変えてもらう余地」
  rationale: 標準的な語義を本文に残しつつ、この句がエサウ自身の悔い改め、結果の撤回、またはイサクの心変わりに関わる可能性を注で示す。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、警告としての厳粛さを保つ敬体。「エサウ」は直前の文脈から明らかな主語だが、単独節としての理解を助けるため明示した。二つの注記マーカーは、それぞれ説明対象に厳密に隣接させると文が読みにくくなるため節末にまとめた。
