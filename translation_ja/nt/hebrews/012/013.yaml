  naturalness: 「足の不自由なところ」とすることで、身体的な比喩を保ちながら、原文の中性的で開かれた表現に近づける。「道から」は原文に明示されないため、「外れる」として簡潔に保つ。
  terminology: 「癒やされる」「むしろ」は適切である。「まっすぐな道筋を作りなさい」も、τροχιάς ὀρθὰς ποιεῖτε の道行きの比喩を自然に伝える。脚注は、それぞれ本文中の対応箇所に置かれている。
