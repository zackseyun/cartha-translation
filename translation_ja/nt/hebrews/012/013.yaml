  to: そして、自分の足のためにまっすぐな道筋を作りなさい[a]。それは、足の不自由なところが外れることなく[b]、むしろ癒やされるためです。
  rationale: 中性の τὸ χωλόν を、人物に限定せず、かつ身体的・比喩的両面を残せる「足の不自由なところ」とした。また、「道から」という原文にない補足を省き、ἐκτραπῇ の一般的な「外れる」と医学的な「脱臼する」の可能性を本文と脚注の組合せで保った。
