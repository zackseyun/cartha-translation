source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: ja
  text: そして、自分の足のためにまっすぐな道筋を作りなさい[a]。それは、足の不自由なところが外れることなく[b]、むしろ癒やされるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この表現は箴言4章26節を思わせ、この箇所に続く、訓練された歩みのイメージを保っている。
    reason: cross_reference
  - marker: b
    text: 別訳「脱臼することなく」。このギリシア語動詞は、身体の比喩の中で医学的な意味合いを持つことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: 道筋
  rationale: 車輪の跡や踏みならされた道を指し得る語。ここでは歩みの比喩を自然に保ちつつ、単なる物理的な道路に限定しない「道筋」とした。
- source_word: ὀρθὰς
  choice: まっすぐな
  rationale: 正しく整えられ、逸れのない進路を表す。「平らな」も可能だが、箴言4章26節との響きと進路の比喩をより明瞭に保つ。
- source_word: ποιεῖτε
  choice: 作りなさい
  rationale: 現在命令形の継続的な勧告を、簡潔で直接的な表現にした。文脈上は「整えなさい」も可能だが、原語の基本的意味を優先した。
- source_word: τοῖς ποσὶν ὑμῶν
  choice: 自分の足のために
  rationale: 与格を利益・関係の意味に取り、歩むための道筋を備えるという比喩を保持した。
- source_word: τὸ χωλὸν
  choice: 足の不自由なもの
  rationale: 中性単数の形容詞が名詞的に用いられており、個人にも弱った部分にも開かれた表現である。身体的イメージを保ち、文字どおりか比喩的かを本文で限定しない。
- source_word: ἐκτραπῇ
  choice: 道から外れることなく
  rationale: 基本的な「脇へそれる、進路を外れる」という意味を歩行の比喩に合わせた。身体的文脈では「脱臼する」という医学的含みもあり、脚注に残した。
- source_word: ἰαθῇ
  choice: 癒やされる
  rationale: 通常の「癒やす」という意味をそのまま訳し、身体的比喩と回復の目的を保持した。
- source_word: μᾶλλον
  choice: むしろ
  rationale: 直前の否定的結果と、望ましい結果との対照を明確に表す。
theological_decisions:
- issue: 身体的表現を文字どおりに取るか、霊的・共同体的な比喩に取るか
  choice: 身体的な言葉を本文に残し、文字どおりの身体的弱さか、霊的・共同体的弱さかを限定しない。
  alternative: 「信仰の弱い人」などと解釈を明示する。
  rationale: 原文は勧告の文脈で身体と歩行のイメージを用いるが、その指示対象を明示していない。解釈を狭めず、原文の緊張と広がりを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告としての厳粛さを保った。「足の不自由なもの」は身体的イメージを残しつつ、文字どおりの意味と比喩的な意味のどちらにも限定しない。脚注記号は内容に対応する位置へ配置した。
