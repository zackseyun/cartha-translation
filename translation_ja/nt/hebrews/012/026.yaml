  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: ja
  text: その方の声は、あの時、地を揺り動かしました。しかし今、その方はこう約束しておられます。[b]「なおもう一度、わたしは地だけでなく、天[a]をも揺り動かす。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では定冠詞を伴う単数形で、直訳的には「その天」。
    reason: lexical_alternative
  - marker: b
    text: ハガイ書2章6節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: その方の声
  rationale: 属格関係代名詞を所有関係として自然に表し、前の文脈における神とのつながりを保った。「音」よりも、語り手である神を示す「声」が適切。
- source_word: ἐσάλευσεν
  choice: 揺り動かしました
  rationale: シナイで起きた過去の出来事を指すアオリストの力を保ちつつ、宇宙的な震動を自然な日本語で表した。
- source_word: τὴν γῆν
  choice: 地
  rationale: 「天」と対をなす被造世界の領域を表すため、局地的な「土地」ではなく「地」とした。
- source_word: τότε
  choice: あの時
  rationale: νῦνとの時間的対照を明確にし、過去のシナイの出来事を自然に指し示す。
- source_word: νῦν δὲ
  choice: しかし今
  rationale: 過去の震動と、今なお有効な約束との対照を明確に表した。
- source_word: ἐπήγγελται
  choice: 約束しておられます
  rationale: 完了形が示す、なされた約束の現在に至る有効性を表す。「宣言した」ではなく、語の基本的な意味である「約束する」を採った。
- source_word: λέγων
  choice: こう
  rationale: 引用を導く分詞を、日本語で冗長にならない自然な引用導入として表した。
- source_word: Ἔτι ἅπαξ
  choice: もう一度
  rationale: 将来さらに一度起こることを示す句を、明瞭で自然な日本語にした。
- source_word: σείσω
  choice: 揺り動かす
  rationale: 預言的引用の未来表現を保ち、前半のσαλεύωとの意味上のつながりも示した。
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: だけでなく、…をも
  rationale: 原文の相関構文と強調を、格調を損なわない自然な日本語で再現した。
- source_word: τὸν οὐρανόν
  choice: 天
  rationale: 「地」と対をなす広い宇宙的領域として訳した。「空」では範囲を狭く限定しすぎるため採らなかった。
theological_decisions:
- issue: 関係代名詞の指示対象と約束の主体
  choice: 前の文脈にある神を「その方」として示し、その方が声を発し、約束していると訳す。
  alternative: 主体を明示せず、神への指示を曖昧にする訳。
  rationale: 直前の文脈とハガイ書からの引用はいずれも神を語り手として示す。固有名を補わず、「その方」によって原文の文脈的な指示を保った。
- issue: 「地」と「天」の範囲
  choice: 被造世界を包括する宇宙的な対として「地」と「天」と訳す。
  alternative: 局地的な「土地」と可視的な「空」に限定する訳。
  rationale: 引用の対句は広範な震動を表している。出来事の具体的な仕組みを付加せず、原文の宇宙的な広がりを保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の発話と預言的引用にふさわしい品位を保った。「その方」「約束しておられます」は前後関係と完了形の継続的効力を自然に伝える。引用内では簡潔で力強い表現を優先した。
