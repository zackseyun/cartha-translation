  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: ja
  text: 罪に対して戦う中で、あなたがたはまだ、流血に至るまで抵抗したことはありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「まだ血に至るまで抵抗してはいません」。「血に至るまで」は、流血に至るほどの抵抗を表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: まだ……ありません
  rationale: これまで限界点に達していないことを表す時間副詞であり、現代日本語として自然に訳した。
- source_word: μέχρις αἵματος
  choice: 血を流すほどまで
  rationale: 直訳的には「血に至るまで」。流血を伴うほどの抵抗という限度を示す慣用的表現を、意味を狭めすぎず自然な日本語にした。
- source_word: ἀντικατέστητε
  choice: 抵抗したことはありません
  rationale: アオリスト直説法二人称複数。相手に立ち向かうことを表し、文脈の闘争の比喩にも合う「抵抗する」を用いた。
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: 罪と
  rationale: πρόςと対格はここで対抗の対象を示す。日本語では「罪と戦う」とすることで、罪を対抗相手として自然に表した。
- source_word: ἀνταγωνιζόμενοι
  choice: 戦っていますが
  rationale: 継続的な競技・戦闘を思わせる現在分詞。主動詞の状況を示すため「戦っています」とし、未到達の限界との対比を「が」で明確にした。
theological_decisions:
- issue: 「罪」が具体的に何を指すか
  choice: 限定せず「罪」と訳す
  alternative: 迫害者たちの罪深い敵対、一般的な罪、または信仰を捨てる誘惑と明示する
  rationale: 直近の文脈には敵対への忍耐と罪を退ける勧めの双方があるが、本節自体は指示対象を限定していないため、その幅と緊張を保った。
- issue: 「血に至るまで」が負傷か殉教か
  choice: 「血を流すほどまで」とし、負傷と死のいずれにも限定しない
  alternative: 「殉教するまで」または「死ぬまで」と訳す
  rationale: 表現は流血に至る限度を示すが、死のみを明示してはいない。原文以上に意味を狭めないようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、勧告文にふさわしい落ち着いた格調を保った。「罪」の指示対象と、流血が負傷または死のどちらを指すかは限定していない。
