id: HEB.12.9
reference: Hebrews 12:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: ja
  text: そのうえ、私たちには、私たちを訓練する地上の父たち[a]がいて、私たちはその父たちを敬っていました。まして、霊たちの父[b]に服従して、生きるべきではないでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちの肉の父たち」。人間としての父、すなわち地上の父を指します。
    reason: lexical_alternative
  - marker: b
    text: 「霊たちの父」は、地上の父たちと対比して特に「私たちの霊の父」を意味する可能性がありますが、原文の表現はそれより広くも解釈できます。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: そのうえ
  rationale: 時間的な「それから」よりも、ここでは議論をさらに一段進める語として用いられているため。
- source_word: τοὺς τῆς σαρκὸς ἡμῶν πατέρας
  choice: 肉親の父たち
  rationale: 直訳的な「私たちの肉の父たち」が表す身体的・人間的な父を、現代日本語で自然に示しつつ、「霊たちの父」との対比を保つ。
- source_word: παιδευτὰς
  choice: 私たちを訓練する
  rationale: 周囲の文脈にある訓練・鍛錬・懲らしめとの語義的なつながりを保ち、単なる教育より広い意味を表す。
- source_word: ἐνετρεπόμεθα
  choice: 私たちは彼らを敬っていました
  rationale: 親による訓練に対して示した畏敬を伴う尊重を、過度に強い感情表現にせず自然に表す。
- source_word: οὐ πολὺ μᾶλλον
  choice: まして……ではないでしょうか
  rationale: 小さいものから大きいものへ進む強意の修辞疑問を、自然な日本語で再現する。
- source_word: ὑποταγησόμεθα
  choice: 服従して
  rationale: 受動形の意味を日本語では主体的な応答として自然に表し、神の権威の下に身を置くことを示す。
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: 霊たちの父
  rationale: 属格と複数形を保ち、「私たちの霊の父」または「霊的存在の父」のいずれかに限定しない。
- source_word: ζήσομεν
  choice: 生きる
  rationale: 服従の帰結としての未来的な「生きる」を簡潔に保つ。
theological_decisions:
- issue: 「霊たちの父」の範囲
  choice: 「霊たちの父」と広い表現のまま訳す
  alternative: 「私たちの霊の父」または「霊的存在の父」
  rationale: 直前の人間の父との対比から人間の霊が念頭にある可能性は高いが、原文は「私たちの」を明示せず、表現自体はより広い。解釈を一つに限定しないため。
- issue: 「生きる」の意味
  choice: 限定語を加えず「生きる」とする
  alternative: 「永遠に生きる」または「真に生きる」
  rationale: 文脈上、神から与えられる命という神学的含意はあり得るが、原文は命の性質や期間を明示していないため。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「肉親の父たち」により直訳調の不自然さを避け、「霊たちの父」は原文の複数形と神学的な幅を保った。修辞疑問は「まして……べきではないでしょうか」で勧告の力を自然に表した。
