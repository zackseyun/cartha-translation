id: HEB.12.2
reference: Hebrews 12:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: ja
  text: 信仰の先駆者であり、完成者であるイエスを、ひたすら見つめましょう。[a] イエスは、ご自分の前に置かれた喜びのために、恥をものともせず十字架に耐え、[b] 神の御座の右に座っておられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さの先駆者であり、完成者」、または「私たちの信仰の先駆者であり、完成者」とも訳せます。ギリシア語の表現は簡潔で、「信仰」は「忠実さ」を意味することも、信じる者たちの信仰を指すこともあります。
    reason: alternative_reading
  - marker: b
    text: 直訳では「恥を軽んじて」。十字架刑に伴う辱めを、決定的なものとは見なさなかったという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: ひたすら見つめましょう
  rationale: 周囲のものから目をそらし、特定の対象へ注意を集中する含意を、直前から続く勧告として自然な現代日本語で表した。
- source_word: ἀρχηγὸν
  choice: 先駆者
  rationale: 物事を始める者と、先頭に立って道を開く者という両面を保ち、競走の文脈にも適合する。
- source_word: τελειωτὴν
  choice: 完成者
  rationale: 信仰を意図された完成へ導く者という意味を簡潔に表す。「完成させる方」も可能だが、「先駆者」との並行を重視した。
- source_word: τῆς πίστεως
  choice: 信仰の
  rationale: 属格にない「私たちの」を本文へ補わず、πίστις の基本的な訳語を採用した。圧縮された句の別解は脚注に残した。
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: ご自分の前に置かれた喜びのために
  rationale: 前方に置かれた喜びを見据えて苦難に耐えたという、競走と忍耐の文脈に沿う動機・目的の意味を表した。
- source_word: ὑπέμεινεν σταυρὸν
  choice: 十字架に耐え
  rationale: 苦難の下で揺るがず耐え抜く意味を保持し、イエスの十字架刑を指すものとして日本語では自然に無冠詞で表した。
- source_word: αἰσχύνης καταφρονήσας
  choice: 恥をものともせず
  rationale: 十字架の辱めを決定的なものとして重んじなかったという意味を自然に表す。「恥を軽んじて」より、恥そのものを道徳的に侮蔑したとの誤解が少ない。
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: 神の御座の右に
  rationale: 最高の誉れと権威の座を示す空間的・王権的表現を保った。
- source_word: κεκάθικεν
  choice: 着座されました
  rationale: 完了した行為とその継続的な結果を、敬意ある自然な日本語で表した。
theological_decisions:
- issue: ἀρχηγὸν καὶ τελειωτὴν にかかる τῆς πίστεως の意味
  choice: イエスを「信仰の先駆者であり、完成者」とする。
  alternative: 「真実（忠実さ）の先駆者であり、完成者」、または「私たちの信仰の先駆者であり、完成者」。
  rationale: ギリシア語は簡潔で、「信仰」が信者の信仰を指すか、イエスに示された忠実さを指すかを一義的に確定しない。本文では語を補わず「信仰」とし、別解を脚注に示した。
- issue: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς の解釈
  choice: 前に置かれた喜びを見据え、それを動機として十字架に耐えた。
  alternative: 前にあった喜びを選ばず、その代わりに十字架に耐えた。
  rationale: ἀντί には「代わりに」の意味もあるが、約束された目標へ向かう忍耐という文脈では、将来の喜びを見据えたとの理解が最も自然である。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。前節から続く分詞を「見つめましょう」と勧告形にし、単独節としても理解しやすくした。神への敬意を示す「御座」と、イエスへの尊敬語を用いたが、過度に古風な語法は避けた。
