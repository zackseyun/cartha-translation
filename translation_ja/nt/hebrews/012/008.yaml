source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: ja
  text: しかし、もしあなたがたが、すべての者があずかってきた訓練を受けていないなら、あなたがたは私生児であり、正式な子ではありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: 訓練
  rationale: 文脈上、父が子を鍛え、正す働きを指す。「懲らしめ」だけに狭めず、教育・矯正・鍛錬を含む語として訳した。
- source_word: ἧς μέτοχοι γεγόνασι πάντες
  choice: すべての子が受ける
  rationale: 直訳は「すべての者がその共有者となっている」。日本語では訓練との関係を自然に表し、文脈が示す神の子らを「すべての子」として補った。
- source_word: νόθοι
  choice: 私生児
  rationale: 嫡出でなく、正統な家族的身分を持たない子を指す強い対比語。現代では慎重さを要する表現だが、原文の衝撃と当時の相続・身分上の対照を保つ。
- source_word: υἱοί
  choice: 正統な子
  rationale: νόθοιとの対比を明示するため、単なる「息子」ではなく、正式な子として認められた身分を表した。性別より親子関係と相続上の地位が焦点である。
theological_decisions:
- issue: 「すべての者」の範囲
  choice: 文脈上、神の子である者すべてを指すものとして「すべての子」とした
  alternative: 人間一般、または読者共同体の全員を指すものとして「すべての人」とする
  rationale: 直前の父子の比喩と、後半の「正統な子／私生児」の対照から、訓練にあずかる子ら全体を指すと理解するのが自然。ただし、誰が最終的にその範囲に属するかという教理的結論までは加えていない。
- issue: υἱοίのジェンダー表現
  choice: 「子」と訳した
  alternative: 語形どおり「息子たち」と訳す
  rationale: ここでの焦点は男性性ではなく、父に認められた子としての身分である。日本語の「子」が文脈上の意味を明瞭に伝える。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、原文の厳しい家族・身分上の対比を弱めないようにした。「私生児」は現代日本語で侮蔑的に響き得るが、原文のνόθοιの強さと歴史的な身分差を伝えるため採用した。
