id: HEB.12.5
reference: Hebrews 12:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: ja
  text: 'そして、あなたがたに息子たちとして語りかける勧めを忘れているのです。


    「わが子よ[a]、主の訓練[b]を軽く見てはならない。

    主に戒められるとき、気落ちしてはならない。」[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「わが息子よ」。箴言の引用であり、この箇所の「息子」としての表現を受けている。
    reason: lexical_alternative
  - marker: b
    text: 「訓練」は「教育」「矯正」「懲らしめ」とも訳せる。処罰だけでなく、人を育てて正すことを含む。
    reason: lexical_alternative
  - marker: c
    text: 箴言3章11節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: 忘れてしまった
  rationale: 完了形が示す、忘れた結果として今も忘れている状態を自然な日本語で表し、叱責の響きも保つ。
- source_word: παρακλήσεως
  choice: 励ましのことば
  rationale: この語は励まし、勧め、慰めを含み得る。ここでは警告を伴う聖句を指すため、「励ましのことば」として勧告と慰めの両面を残す。
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: あなたがたを息子として諭している
  rationale: 聖書のことばが読者に直接語りかける表現であり、διαλέγεται の対話的・訓戒的な響きを「諭している」で表す。υἱοῖς は箴言の引用と周辺の子としての議論を保つため「息子」とする。
- source_word: Υἱέ μου
  choice: わが子よ
  rationale: 原文は男性単数の「息子」だが、日本語の呼びかけとして自然で格調があり、親子関係を明示する「わが子よ」を採用する。性別を明示する別訳は脚注に示す。
- source_word: ὀλιγώρει
  choice: 軽く見てはならない
  rationale: 重要でないものとして扱う、軽視するという意味を、明瞭な現代日本語で表す。
- source_word: παιδείας
  choice: 鍛錬
  rationale: 教育、訓練、矯正、懲らしめを含む広い形成的意味を持つ。「鍛錬」は単なる処罰に限定せず、厳しさを伴う育成も表せる。
- source_word: ἐκλύου
  choice: 気落ちしてはならない
  rationale: 戒めの下で内面的に力を失い、くじけることへの警告を自然な日本語で表す。
- source_word: ἐλεγχόμενος
  choice: 戒められるとき
  rationale: 誤りを指摘して正すという意味を、親による鍛錬の文脈に即して表現する。
theological_decisions:
- issue: 子としての性別を伴う表現
  choice: ὡς υἱοῖς は「息子として」とし、引用中の Υἱέ μου は自然な日本語の「わが子よ」とする
  alternative: 「子どもとして」／「息子よ」
  rationale: 読者に関する複数形ではヘブライ書の息子性の議論を明示する一方、引用の呼びかけは日本語として自然な形にする。原文の男性形は脚注で透明性を確保する。
- issue: 神の παιδεία の意味範囲
  choice: 鍛錬
  alternative: 訓練／教育／懲らしめ
  rationale: 形成的な訓練と痛みを伴う矯正の両面を残し、処罰だけにも単なる教授だけにも限定しない。
- issue: παράκλησις の勧告性と慰め
  choice: 励ましのことば
  alternative: 勧告／慰め
  rationale: 引用は警告であると同時に、神が子として扱うことを示す励ましでもあるため、一方だけに限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、旧約引用には「わが子よ」という簡潔で dignified な呼びかけを採用した。本文の論理が追いやすいよう引用導入部を一文とし、引用は改行した。
