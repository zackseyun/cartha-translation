  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: ja
  text: また、ラッパの響きと、ことばを語る声[b]にも近づいてはいません。その声[a]を聞いた人々は、これ以上、自分たちにことばが語られないようにと懇願しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「それを聞いた人々は、これ以上、自分たちに語りかけないでほしいと懇願しました。」この場合、「それ」は声だけでなく、シナイ山での顕現全体を広く指すと考えます。
    reason: alternative_reading
  - marker: b
    text: 出エジプト記20章18節・19節、申命記5章23節–27節参照。イスラエルの民は、神の声をこれ以上直接聞かずに済むよう願いました。
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: ラッパの響き
  rationale: ἦχοςの聴覚的な意味とシナイ山での具体的な情景を、自然で荘重な日本語によって保つ。「ラッパの音」も可能だが、「響き」は周囲を圧する現象を過度に説明せずに表せる。
- source_word: φωνῇ ῥημάτων
  choice: ことばを語る声
  rationale: 単なる物音ではなく、明瞭なことばとして聞こえる声を示す。直訳的な「ことばの声」は現代日本語では不自然なため、属格関係を自然に展開した。
- source_word: ἧς
  choice: その声を
  rationale: 女性単数の関係代名詞は、直前の女性名詞φωνήを最も自然な先行詞とする。日本語では関係節を独立した文として「その声を聞いた人々は」と表した。より広いシナイ山の顕現全体を指す可能性は脚注に残す。
- source_word: οἱ ἀκούσαντες
  choice: 聞いた人々
  rationale: 冠詞付き分詞を明快な現代日本語で表し、シナイ山で神の声を聞いたイスラエルの民を文脈から特定できる形にした。
- source_word: παρῃτήσαντο
  choice: 懇願しました
  rationale: ここでは単なる拒否ではなく、直接語りかけられることを免れたいという切迫した願いを表すため、「断りました」ではなく「懇願しました」とした。
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: これ以上、自分たちにことばを語らないでほしい
  rationale: προστίθημιの「さらに加える」という慣用的意味と受動の趣旨を、明瞭な日本語で表した。「ことば」はλόγοςとの語彙的対応を保っている。
theological_decisions:
- issue: 関係節ἧςの先行詞
  choice: 直前の「ことばを語る声」を主たる先行詞として訳す。
  alternative: ラッパの響きと声を含む、シナイ山での恐るべき顕現全体を指すと解する。
  rationale: 文法上は女性単数のφωνήが最も近く自然な先行詞である一方、文脈上は民が顕現全体に恐れおののいたことも視野に入る。本文では直接的な文法関係を示し、広い解釈を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、シナイ山の場面にふさわしい荘重さを保った。前節から続く与格の列挙であるため、「近づいてはいません」を補って日本語の文として完結させた。「ことばを語る声」は原文のやや異例な表現を完全に平板化せず、同時に不自然な直訳を避けるための表現である。
