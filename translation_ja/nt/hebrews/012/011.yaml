id: HEB.12.11
reference: Hebrews 12:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: ja
  text: すべての訓練は、その時には喜びではなく、悲しみであるように思われます。しかし後になると、それによって鍛えられた人々に、義[a]という、平和な実をもたらします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義」とも訳せる。ギリシア語は、正しいあり方を表す「義」と、公正さを表す「正義」のどちらをも意味し得る。ここでは、神の訓練によって生み出される正しい生き方を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: 訓練
  rationale: 神が子を育てる文脈で、教え、矯正し、鍛える働きを広く表す語である。「懲らしめ」だけでは処罰の響きが強いため、形成を目的とする意味の広さを保つ「訓練」とした。
- source_word: πρὸς μὲν τὸ παρὸν
  choice: その時には
  rationale: 後続の「後になると」と対照をなし、訓練を受けている当座の経験を自然な現代日本語で示す。
- source_word: οὐ δοκεῖ
  choice: 思われます
  rationale: 客観的な断定ではなく、受ける人にそのように感じられるという知覚上の意味を保つ。
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: 喜ばしいものではなく、悲しいもの
  rationale: 原文の「喜び」と「悲しみ」の対照を保ちつつ、日本語として自然な述語表現にした。「苦痛」として意味を狭めない。
- source_word: ὕστερον
  choice: 後になると
  rationale: 現在の経験と、その後に現れる結果との時間的対照を明確にする。
- source_word: καρπὸν εἰρηνικὸν
  choice: 平和な実
  rationale: 「実」を直接修飾する形容詞の構造を保ち、平和を特徴とする実という意味を表す。
- source_word: γεγυμνασμένοις
  choice: 鍛えられた人々
  rationale: 反復的な訓練によって形づくられた状態を示す完了受動分詞と、背後にある身体訓練の比喩を伝える。
- source_word: ἀποδίδωσιν
  choice: もたらします
  rationale: 訓練が後に実を生じさせる結果的な意味を、実の比喩と調和する自然な日本語で表す。
- source_word: δικαιοσύνης
  choice: 義
  rationale: この文脈では神の訓練によって生じる正しいあり方を指すため、意味の広い「義」を本文に用いる。「正義」の可能性は脚注に残す。
theological_decisions:
- issue: 神の働きとしての παιδεία の意味
  choice: 教えや矯正を含む、形成を目的とした訓練
  alternative: 処罰、または教示だけ
  rationale: ヘブライ人への手紙12章5～10節では、神が子を育てて聖さへ導く父子的な働きとして描かれる。単なる報復とも単なる知的教育とも限定しない。
- issue: δικαιοσύνης の解釈
  choice: 義
  alternative: 正義
  rationale: ここでは訓練が生み出す正しい人格や生き方を広く指すと考えられるが、語には「正義」の意味もあるため、その可能性を脚注に示す。
- issue: καρπὸν εἰρηνικὸν ... δικαιοσύνης の関係
  choice: 義という平和な実
  alternative: 平和をもたらす義の実
  rationale: 原文は実そのものを「平和な」と形容しており、平和を生み出すという因果関係までは明示しない。「義という」は属格を、実の内容を示すものとして自然に表す。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「です・ます」調を用い、親による形成的な訓練という文脈を保ちながら、過度に処罰的な語感を避けた。
