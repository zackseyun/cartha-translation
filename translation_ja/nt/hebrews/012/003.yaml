id: HEB.12.3
reference: Hebrews 12:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: ja
  text: 罪人たちからご自分に向けられた[a]このような敵対を耐え忍んだ方のことを、よく考えなさい。それは、あなたがたが疲れ果て、心がくじけてしまわないためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によって「ご自分に」と「自分たち自身に」の違いがある。SBLGNT本文は「自分たち自身に」と読むが、文脈では敵対がイエスに向けられたことを指す。
    reason: textual_variant
  - marker: b
    text: 直訳に近くは、「あなたがたの魂において力を失わないため」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: よく考えなさい
  rationale: 単に思い浮かべるのでなく、注意深く考察するよう促すアオリスト命令形の力を、明瞭で自然な現代日本語で表した。
- source_word: τοιαύτην
  choice: このような
  rationale: 反抗の種類や程度を広く指し示し、原文以上に「非常に激しい」などと限定しない表現とした。
- source_word: ὑπομεμενηκότα
  choice: 耐え忍んだ
  rationale: 苦難の下にとどまって耐えたことを表す完了分詞。完了形の継続的な意義は文脈に委ねつつ、日本語として自然で尊厳ある表現にした。
- source_word: ἀντιλογίαν
  choice: 反抗
  rationale: 言葉による反論だけでなく、イエスに向けられた広い抵抗や敵対を含み得る語なので、「反論」より広い「反抗」とした。
- source_word: ἁμαρτωλῶν
  choice: 罪人たち
  rationale: 罪ある者として特徴づけられた人々を直接表す、聖書語として定着しつつ理解しやすい訳語を用いた。
- source_word: κάμητε
  choice: 疲れ果て
  rationale: 疲労して力尽きることを表す動詞の基本的意味を保ち、続く「心がくじける」と区別した。
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: 心がくじけてしまわない
  rationale: ψυχήをこの文脈で人の内面・心として自然に表し、ἐκλύομαιの力を失って意気消沈する意味を明瞭に伝えた。脚注でより逐語的な可能性も示した。
theological_decisions:
- issue: 「耐え忍んだ方」が指す人物
  choice: 本文では固有名を補わず、「方」としてイエスを指す
  alternative: 「イエス」と明記する
  rationale: 直前の12章2節により指示対象はイエスと明白だが、この節自体は分詞を名詞的に用いており、名を繰り返していない。その表現を保った。
- issue: εἰς ἑαυτούς の指示対象と本文異読
  choice: 文脈上、反抗がイエスご自身に向けられた意味を本文に置き、異読問題を脚注で明示する
  alternative: SBLGNTの複数形をそのまま取り、「自分たち自身に向けた」とする
  rationale: SBLGNT本文のἑαυτούςは形態上「彼ら自身／自分たち自身」だが、単数形ἑαυτόνを読む有力な異読があり、直前からの統語と文脈はいずれもイエスへの反抗を自然に示す。本文では文脈上の意味を明瞭にしつつ、原文証拠の緊張を脚注で隠さず提示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告としての厳粛さを保った。「ご自分」「方」により指示対象であるイエスへの適切な敬意を自然に示した。本文中の脚注記号[a]と[b]は、それぞれ該当箇所に明示した。
