- from: こういうわけで、私たちは揺り動かされることのない御国を受けているのですから、恵みを受けていましょう[a]。その恵みによって、畏敬と畏れをもって、神に喜ばれるように仕えようではありませんか。
  to: それゆえ、私たちは揺り動かされることのない御国を受けているのですから、恵みを受けましょう[a]。この恵みによって、畏敬と畏れをもって、神に喜ばれるように仕えようではありませんか。
  rationale: 訳文の意味を変えず、接続表現と勧告形を整えた。本文は、直後の「この恵みによって」との文法的・意味的な照応を保つため χάριν を「恵み」とし、「感謝する」という有力な別解は脚注に残した。
