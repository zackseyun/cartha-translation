id: HEB.12.28
reference: Hebrews 12:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: ja
  text: それゆえ、私たちは揺り動かされることのない御国を受けているのですから、恵みを受けましょう[a]。この恵みによって、畏敬と畏れをもって、神に喜ばれるように仕えようではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「感謝しましょう」。ギリシア語の表現は字義的には「恵みを持つ／受ける」と理解できる一方、慣用的に「感謝する」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: こういうわけで
  rationale: 直前に述べられた、造られたものが揺り動かされて取り除かれることからの結論を、自然な現代日本語で示す。
- source_word: βασιλείαν ἀσάλευτον
  choice: 揺り動かされることのない御国
  rationale: 直前の「揺り動かされる」ものとの対照を保つ。「御国」は神の支配・王国を表す日本語の聖書的用語として広く理解される。
- source_word: παραλαμβάνοντες
  choice: 受けているのですから
  rationale: 現在分詞の継続的・現実的な意味と、後続の勧告に対する理由を表す働きを明示する。
- source_word: ἔχωμεν χάριν
  choice: 恵みを受けていましょう
  rationale: χάριςの「恵み」を本文に保ちつつ、日本語として不自然な「恵みを持ちましょう」を避けた。慣用的に「感謝しましょう」と解する可能性は脚注に残す。
- source_word: δι’ ἧς
  choice: その恵みによって
  rationale: 女性関係代名詞が直前のχάρινを受けることと、διά＋属格の手段の意味を明確にする。
- source_word: λατρεύωμεν
  choice: 仕えようではありませんか
  rationale: 神にささげる宗教的奉仕・礼拝を含む語義を、単に内面的な礼拝へ狭めずに表す。勧告の接続法も反映する。
- source_word: εὐαρέστως τῷ θεῷ
  choice: 神に喜ばれるように
  rationale: 神の目にかなう仕え方という評価的意味を、自然な日本語で表す。
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: 畏敬と畏れをもって
  rationale: εὐλάβειαの敬虔な慎み・畏敬と、δέοςの圧倒されるような畏れを区別しつつ、並列を保つ。
theological_decisions:
- issue: ἔχωμεν χάρινにおけるχάρινの意味
  choice: 恵みを受けていましょう
  alternative: 感謝しましょう
  rationale: 直後のδι’ ἧςを「その恵みによって」と自然に受けられるため、本文では神の恵みを手段とする読みを採用した。ただし、この句全体を慣用的に「感謝しましょう」と解する読みも十分可能なので、脚注で明示して解釈上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、勧告の荘重さを「御国」「畏敬」「仕えようではありませんか」で保った。「恵みを受けていましょう」は通常の日常語よりやや高い文体だが、原文の曖昧さと直後の照応関係を維持するために採用した。
