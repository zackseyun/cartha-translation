    issue: 接続句「こういうわけで」の文体
    rationale: διὸ の推論的な力は表しているが、周囲の「御国」「畏敬」より口語的である。「それゆえ」のほうが現代標準語として自然で、原文の論証的調子にもよく合う。
  - severity: low
    issue: 「恵みを受けていましょう」の相の表現
    rationale: ἔχωμεν は勧告の接続法であり、「受けていましょう」は継続の相を加えてやや迂遠になる。「恵みを受けましょう」とすれば、日本語として明快であり、本文で採る「恵み」の読みと後続の「この恵みによって」の照応を保てる。
  revised_text: それゆえ、私たちは揺り動かされることのない御国を受けているのですから、恵みを受けましょう[a]。この恵みによって、畏敬と畏れをもって、神に喜ばれるように仕えようではありませんか。
