  verdict: revise
  source_fidelity: βέβηλοςを「神聖なものを軽んじる者」とするのは、聖なるものを尊重しないという語義とエサウの長子権軽視の文脈をよく伝えている。「エサウのように」は後者にのみ係る形で保持されており、エサウを性的不品行の実例と断定していない。ἀντὶ βρώσεως μιᾶςおよびτὰ πρωτοτόκια ἑαυτοῦも「一度の食事と引き換えに」「自分の長子の権利」で適切である。ただし、πόρνοςは「性的不品行に陥ること」ではなく、そのような者を表すため、並列する人物表現を保つほうが原文に忠実である。
  naturalness: 現行文は意味が通るが、「性的不品行に陥ったり、…者になったり」は並列の形がそろわず、πόρνοςとβέβηλοςという二つの名詞的述語の対比が弱まる。「性的不品行な者にも、…者にもならないように」とすれば、明瞭な現代標準日本語で、構文も整う。
  terminology: 「性的不品行な者」はπόρνοςの一般的な意味を過度に限定しない。「神聖なものを軽んじる者」はβέβηλοςの聖俗に関する含意を保ち、「不信心な者」や「神を信じない者」のような本文にない無神論的意味を加えない。「長子の権利」は定着した適切な表現である。
  issues:
