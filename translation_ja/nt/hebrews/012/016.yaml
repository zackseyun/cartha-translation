    rationale: 原文はπόρνοςとβέβηλοςをἢで並列する名詞的な人物表現である。「性的不品行な者にも、…者にも」とすると、原文の並列と日本語の自然さの双方が改善する。
  revised_text: また、だれも性的不品行な者にも、エサウのように神聖なものを軽んじる者にもならないようにしなさい。エサウは一度の食事と引き換えに、自分の長子の権利を売り渡したのです。
