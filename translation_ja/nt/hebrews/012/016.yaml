reference: Hebrews 12:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: ja
  text: また、だれも性的不品行な者にも、エサウのように神聖なものを軽んじる者にもならないようにしなさい。エサウは一度の食事と引き換えに、自分の長子の権利を売り渡したのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: 性的不品行に陥った者
  rationale: 性的な不道徳を行う者を指す語。現代日本語で意味が明瞭になるように表現した。
- source_word: βέβηλος
  choice: 神聖なものを軽んじる者
  rationale: 聖なるものと日常的・俗なるものとの境を顧みない人を表す。単に無神論的な「神を信じない者」と誤解されやすい「不信心な者」を避け、文脈上のエサウの態度を明示した。
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: 一度の食事と引き換えに
  rationale: 単一の食事を代価として交換したことを自然かつ正確に表す。
- source_word: ἀπέδετο
  choice: 売り渡した
  rationale: 売却・譲渡を意味する中動態アオリストであり、創世記25章の出来事に対応する。
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: 自分の長子の権利
  rationale: 複数形の名詞だが、長子としての身分に伴う諸権利を一括して指す定着した表現として訳した。
theological_decisions:
- issue: βέβηλοςが表すエサウの性質
  choice: 神聖なものを軽んじる者
  alternative: 不信心な者／世俗的な者／神を敬わない者
  rationale: 語の基本的対比は「聖なるもの」に対する「俗なるもの」であり、エサウが長子の権利を軽視した物語との結びつきを保つ。神の存在を否定したという本文にない意味は加えない。
- issue: πόρνοςとエサウの関係
  choice: 二つの警告を並列させつつ、「エサウのように」は後者に自然に結びつく語順とした
  alternative: エサウを性的不品行と神聖軽視の両方の例と読む
  rationale: ギリシア語のὡς Ἠσαῦは直前のβέβηλοςに最も自然にかかるが、統語上の広がりを完全には断定できない。訳文ではエサウを明確に性的不品行の例と決めつけない。
translation_notes:
  register: 現代標準日本語の、明瞭で格調を保った勧告文。「俗悪」「冒涜的」など意味が狭すぎたり古風だったりする語を避け、βέβηλοςの聖俗の対比を説明的に表した。
