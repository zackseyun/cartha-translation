id: HEB.12.7
reference: Hebrews 12:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: ja
  text: 訓練のために耐え忍びなさい[a]。神はあなたがたを息子たちとして扱っておられます[b]。いったい、父が訓練しない子がいるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これを訓練として耐え忍びなさい」。ギリシア語は、訓練のために耐え忍ぶという意味にも、耐えている苦難を訓練として受け止めるという意味にも理解できます。また、「耐え忍んでいる」と直説法に取ることも文法上可能です。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では「息子たち」。ここでは父と息子の比喩が用いられていますが、その適用は男性だけに限られません。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: 訓練のために
  rationale: παιδείαには、子を育てるための教育・矯正・鍛錬が含まれる。「訓練」は懲罰だけに狭めず、形成的な意味を保つ。εἰςは主本文では目的・方向を示すものとして訳したが、「訓練として」も可能なので脚注に示す。
- source_word: ὑπομένετε
  choice: 耐え忍びなさい
  rationale: 直説法と命令法が同形であり得るが、文脈上は勧告として読むのが自然である。原文にない目的語は補わず、継続して持ちこたえる意味を表した。
- source_word: ὡς υἱοῖς
  choice: 子として
  rationale: 日本語では「息子として」だと適用対象を男性に限定する印象が強いため、自然な包括性を持つ「子」を用いた。父と子の比喩は後続文によって保たれ、原語の男性形は脚注で明示する。
- source_word: προσφέρεται
  choice: 扱っておられます
  rationale: ここでは神が読者に対してどのように振る舞うかを表す慣用的用法。「扱う」は関係的な意味を自然な現代日本語で伝える。
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: いったい、父が訓練しない子がいるでしょうか
  rationale: 修辞疑問の力を自然に表し、πατήρに原文にない所有表現を加えない。παιδεύειは同節のπαιδείαとの語彙的つながりを保って「訓練する」とした。
theological_decisions:
- issue: 父と息子という性別を伴う家族比喩
  choice: 本文では「父」と「子」を用い、原語υἱόςの男性形を脚注で示す
  alternative: 本文を「父」と「息子」とする
  rationale: 原文の父子関係の論証を保ちつつ、日本語の「息子」が生みやすい男性限定の含意を避けるため。「子」は父との関係を明確に表し、共同体全体への適用を不必要に狭めない。
- issue: 苦難と神の訓練との関係
  choice: 「訓練のために」を本文とし、「訓練として」を脚注に残す
  alternative: 「これを訓練として耐え忍びなさい」
  rationale: εἰς παιδείανの目的・方向の読みを優先しながら、それを受けている事柄そのものを訓練と見なす読みも文法的に可能であるため、曖昧さを脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。παιδεία／παιδεύειは一貫して「訓練」とし、教育的・矯正的な幅を保持した。敬体は神の行為を述べる文で用い、修辞疑問は「いったい」「でしょうか」によって自然に表した。
