id: HEB.12.25
reference: Hebrews 12:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: ja
  text: 語っておられる方を拒まないよう、注意しなさい。地上で神の警告を告げた方[a]を拒んだあの人々が逃れられなかったのなら、まして、天から語りかける方に背を向けるなら、私たちはなおさら逃れられません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神からの指示を告げた方」とも訳せる。ギリシャ語の動詞は、神に由来する告知・指示・警告を伝えることを表し得る。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語では、後半は直訳すると「まして、天からの方に背を向ける私たちは」となり、「逃れる」という述語は前半から補って理解される。「背を向けるなら」は、この警告の条件的な含意を明瞭にするための訳し方である。
    reason: ellipsis
lexical_decisions:
- source_word: Βλέπετε
  choice: 注意しなさい
  rationale: 複数形の命令で、単に「見る」のではなく、警戒して心を配るよう促す表現であるため。
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: 拒まないよう／拒んだ
  rationale: 同じ動詞の反復を日本語でも「拒む」で保ち、語りかけを受け入れないという文脈上の意味を明確にした。
- source_word: τὸν λαλοῦντα
  choice: 語っておられる方
  rationale: 現在分詞が表す継続中の語りかけを保ち、指示対象を本文以上に「神」または「キリスト」と特定しない表現とした。
- source_word: ἐξέφυγον
  choice: 逃れられなかった
  rationale: 文脈上、裁きまたはその結果を免れることができなかったという意味を自然な日本語で表す。
- source_word: ἐπὶ γῆς
  choice: 地上で
  rationale: 後半の「天から」との対照を保ち、シナイなど特定の場所を本文に補わない。
- source_word: χρηματίζοντα
  choice: 神の警告を告げた方
  rationale: 神的な告知・指示・警告を表し得る語であり、この警告的文脈では「神の警告を告げる」とした。ただし意味の幅は脚注に残した。
- source_word: πολὺ μᾶλλον
  choice: まして
  rationale: 小さい事例から大きい事例へ進む否定的な論証を、自然で簡潔な日本語にした。
- source_word: ἀποστρεφόμενοι
  choice: 背を向ける
  rationale: 単なる聞き逃しではなく、語る方から意図的に離れる含みを保つ。
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: 天から語りかける方
  rationale: ギリシャ語は「天からの方」と省略的だが、冒頭の「語っておられる方」を補って自然な日本語にし、地上と天の対照を明示した。
theological_decisions:
- issue: 語る方・警告する方の同定
  choice: 「方」という一般的な表現にとどめ、神またはキリストと明示しない
  alternative: 地上ではモーセ、天からは神またはキリストと明示する
  rationale: 文脈は神的な語りを示すが、この節自体は固有名や称号を用いていないため、その曖昧さを保った。
- issue: 後半で省略された述語
  choice: 「私たちは、逃れられません」と補う
  alternative: 「まして、天からの方に背を向ける私たちは」と省略のままにする
  rationale: 前半の「逃れられなかった」が後半にも意味上かかる。現代日本語で文を完結させるため補ったが、補足であることを脚注に示した。
- issue: χρηματίζοντα の神的含意
  choice: 「神の警告を告げた」と訳す
  alternative: 「指示を与えた」「告げ知らせた」と訳す
  rationale: この動詞には神からの告知という含みがあり、節全体が裁きを警告しているため「警告」が文脈に適する。ただし語義を警告だけに限定しないよう脚注を付した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「語っておられる」で敬意と継続性を表しつつ、過度に古風な語法は避けた。前半と後半の「地上で／天から」、「拒む／背を向ける」の対照を読み取りやすくした。
