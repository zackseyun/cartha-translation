id: HEB.12.10
reference: Hebrews 12:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: ja
  text: 彼らは、わずかな間[a]、自分たちに良いと思われるとおりに[b]私たちを訓練しました。しかし神は、私たちがご自分の聖さにあずかるように、私たちの益のためにそうされます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「わずかな日々のために」。地上の父による訓練の期間が限られていることを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼らに良いと思われることに従って」。地上の父たち自身の判断を表す。
    reason: lexical_clarification
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: わずかな日の間
  rationale: 直訳的な時間表現を自然な日本語にし、地上の父による訓練の期間が限られていることを示す。慣用的に「短い間」と理解する余地も脚注に残した。
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: 自分たちがよいと思うところに従って
  rationale: 地上の父たち自身の判断に基づくことを表し、その判断が必ず正しかったとも、恣意的だったとも断定しない。
- source_word: ἐπαίδευον
  choice: 訓練しました
  rationale: 文脈上、単なる処罰ではなく、親による矯正・教育を含む広い意味なので、「罰しました」よりも「訓練しました」が適切である。
- source_word: ὁ δὲ
  choice: しかし神は……そうされます
  rationale: ギリシア語では主語が省略的に示されるが、文脈上は神である。日本語では代名詞だけでは不自然または不明瞭になりやすいため、主語を明示し、動詞の省略を「そうされます」で補った。
- source_word: ἐπὶ τὸ συμφέρον
  choice: 私たちの益のために
  rationale: 神の訓練が受け手の利益を目的とすることを明確に表す。
- source_word: εἰς τὸ μεταλαβεῖν
  choice: あずかるように
  rationale: 目的・結果の方向性と、あるものを共に受けるという μεταλαμβάνω の意味を自然な日本語で表す。
- source_word: τῆς ἁγιότητος αὐτοῦ
  choice: ご自分の聖さ
  rationale: 神に属する聖さという性質を示す。敬意を保ちつつ、神の聖さへの参与という表現をそのまま残す。
theological_decisions:
- issue: 対照をなす単数主語 ὁ δὲ の指示対象
  choice: 文脈上の主語である神を「しかし神は」と明示する。
  alternative: 「しかし、この方は」など代名詞的に訳す。
  rationale: ヘブライ人への手紙12章5～11節では地上の父と神が対比されている。日本語で指示対象が曖昧になるのを避けるため神を補うが、原文の対比関係は変えない。
- issue: 「ご自分の聖さにあずかる」の意味
  choice: 神の聖さへの参与として訳し、その仕組みや段階は限定しない。
  alternative: 身分上の聖さだけ、または漸進的な聖化だけを指すと解釈して訳す。
  rationale: 本文は神の訓練の目的を述べるが、聖さへの参与がどのように実現するかを狭く定義していないため、神学的な緊張を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい品位を保った。「訓練」は罰だけでなく教育と矯正を含む語として採用し、「聖さにあずかる」は原文の神学的な重みを保つため簡略化しなかった。
