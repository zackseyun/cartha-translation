id: HEB.12.27
reference: Hebrews 12:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: ja
  text: この「もう一度」という言葉は、揺り動かされているものが、造られたものとして取り除かれることを示しています。それは、揺り動かされていないものが残るためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「揺り動かされていないもの」は、「揺り動かすことのできないもの」または「揺るがないもの」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: この「もう一度」という言葉は
  rationale: 中性冠詞 τὸ が引用句を名詞化しており、著者が直前の「もう一度」を取り上げて説明していることを自然な日本語で示す。δέ は軽い接続・展開であり、ここでは「この」による文脈的なつながりで十分に表される。
- source_word: δηλοῖ
  choice: 示しています
  rationale: 引用された表現が何を意味するかを明らかにする説明的な働きを、平明な現代日本語で表す。
- source_word: τῶν σαλευομένων
  choice: 揺り動かされているもの
  rationale: 現在受動分詞の進行的・特徴的な響きを保ち、後半の否定形との平行関係も示す。
- source_word: μετάθεσιν
  choice: 取り除かれること
  rationale: 文脈では単なる変化ではなく、揺り動かされる被造物が除去されることを指す。「移されること」より意味が明瞭である。
- source_word: ὡς πεποιημένων
  choice: 造られたものとして
  rationale: ὡς の「〜として」と、ποιέω の完了受動分詞が示す、造られたものという性格・範疇を保持する。「被造物であるため」と因果に限定しない。
- source_word: ἵνα μείνῃ
  choice: それは、…残るためです
  rationale: ἵνα の目的・結果の含みを自然な日本語で示す。
- source_word: τὰ μὴ σαλευόμενα
  choice: 揺り動かされていないもの
  rationale: 原文は不能を明示せず、μή と現在分詞で前半と対照をなすため、「揺り動かすことのできないもの」と解釈的に強めず、原文の緊張を保つ。
theological_decisions:
- issue: τὰ μὴ σαλευόμενα を不能表現として訳すか、否定分詞として訳すか
  choice: 揺り動かされていないもの
  alternative: 揺り動かすことのできないもの／揺るがないもの
  rationale: 原文は「揺り動かされているもの」と「揺り動かされていないもの」という分詞の対照を用いる。次節の「揺るがない御国」に先立って解釈を固定せず、本文の形式と神学的緊張を保持する。
- issue: ὡς πεποιημένων の関係をどう表すか
  choice: 造られたものとして
  alternative: 造られたものなので／すなわち、造られたものが
  rationale: ὡς は、除去されるものを「造られたものとして」捉える表現であり、明示的な因果や同格だけに限定しない訳を選ぶ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半と後半の分詞の平行を見える形で残しつつ、長文を二文に分けて読みやすくした。「造られたものとして」は原文の ὡς を保つため本文に置き、別訳注は解釈差がより大きい後半に限定した。
