source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: ja
  text: というのも、あなたがたは、手で触れられるもの[a]、燃え盛る火、暗闇、深い闇、嵐に近づいたのではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「手で触れられる山」。文脈ではシナイ山が指されていますが、この節のギリシア語本文に「山」という語はありません。
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: というのも……ではありません
  rationale: γάρの説明的なつながりを「というのも」で示し、文頭の否定は日本語として自然な位置である列挙の末尾に置いた。
- source_word: προσεληλύθατε
  choice: あなたがたが近づいた
  rationale: 完了形が表す、近づいた結果として現在その状態にあるという含みを保ちつつ、自然な現代日本語とした。
- source_word: ψηλαφωμένῳ
  choice: 手で触れられるもの
  rationale: 語義は「触れることのできる、触知できる」。本文に「山」に当たる名詞はないため、指示対象を明示しない表現にした。
- source_word: κεκαυμένῳ πυρί
  choice: 燃え盛る火
  rationale: 火が燃えている状態を表す完了分詞の生々しさを、明瞭で自然な表現によって伝えた。
- source_word: γνόφῳ
  choice: 暗闇
  rationale: 濃い暗さを指す語として訳し、後続する類義語との畳みかけを保った。
- source_word: ζόφῳ
  choice: 濃い闇
  rationale: 暗く不気味な闇を示す語。「暗闇」と区別しながら、原文の意味の重なりも残した。
- source_word: θυέλλῃ
  choice: 嵐
  rationale: 激しい暴風を意味する語を、一般読者に明瞭な現代語で表した。
theological_decisions:
- issue: 近づいた対象を「山」と明示するか
  choice: 本文では「山」を補わず、「手で触れられるもの」とする。
  alternative: 「手で触れられる山」とする。
  rationale: 文脈上はシナイ山が想定されるが、この節のギリシア語本文には「山」（ὄρος）が明記されていない。指示対象を限定しない原文の表現を本文に残し、文脈上の理解は脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、暗闇を表す二つの類義語の重なりと、畳みかける列挙の荘重さを保った。日本語では一連の項目をまとめ、否定を文末に置いて自然に読める形とした。
