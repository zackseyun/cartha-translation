id: HEB.12.12
reference: Hebrews 12:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: ja
  text: ですから[a]、力なく垂れた手と弱った膝を、まっすぐにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳すると、「それゆえ、垂れ下がった手と弱った膝をまっすぐにしなさい」。この表現は、ギリシア語訳のイザヤ書35章3節を思わせ、身体の姿を通して勇気と忍耐を取り戻すよう促しています。
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の、訓練と忍耐についての議論を受けて勧告を導く推論的接続詞。現代日本語として自然で、論理的なつながりを明確にする。
- source_word: παρειμένας χεῖρας
  choice: 力なく垂れた手
  rationale: παρίημιの分詞は、緩んで垂れ下がった状態を表す。「力なく垂れた」により、身体的な像と意気消沈・疲労の含みをともに保つ。原文に明示されない所有代名詞は補わない。
- source_word: παραλελυμένα γόνατα
  choice: 弱った膝
  rationale: παραλύωの完了分詞は、力を失って弱くなった状態を示す。文脈上、臨床的な「麻痺した」よりも「弱った」が比喩を誤解なく伝える。
- source_word: ἀνορθώσατε
  choice: まっすぐにしなさい
  rationale: ἀνορθόωの「まっすぐにする、起こす、立て直す」という身体的表現を保持する命令形。「強くしなさい」より原文の像とイザヤ書35章3節の響きをよく残しつつ、日本語として理解できる。
theological_decisions:
- issue: 身体的弱さの比喩をどの程度明示的に解釈するか
  choice: 「手」と「膝」の身体的な像を残し、「まっすぐにしなさい」と訳す
  alternative: 「手と膝を強くしなさい」と意味を前面に出す
  rationale: 文脈は忍耐と訓練を促しており、比喩は勇気と持久力の回復を指す。しかし原文は身体像を用い、ギリシア語訳イザヤ書35章3節にも響くため、解釈を本文で尽くさず緊張を保つ。
translation_notes:
  register: 明快な現代標準日本語。勧告としての品位を保つため「しなさい」を用いた。原文の身体的比喩を保持しつつ、「力なく」で意味を自然に補った。
