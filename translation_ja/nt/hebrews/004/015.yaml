id: HEB.4.15
reference: Hebrews 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: ja
  text: というのも、私たちには、私たちの弱さに共感できない大祭司がおられるのではありません。むしろ、あらゆる点で私たちと同じように試みを受けられた[a]が、罪を犯すことなく[b]あられた方なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「試された」、または「誘惑を受けられた」とも訳せる。
    reason: πειράζω は、試練によって「試す」ことと、悪へ「誘惑する」ことの両方を表し得るため。
  - marker: b
    text: 直訳は「類似に従って、罪なしに」。καθ’ ὁμοιότητα の比較対象は原文に明記されていない。「罪を除いて、あらゆる点で私たちと同じように試みを受けられた」と理解することもできる。
    reason: 本文の「私たちと同じように」は文脈上の含意を明示した訳であり、καθ’ ὁμοιότητα と χωρὶς ἁμαρτίας の関係には解釈上の幅があるため。
lexical_decisions:
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: ユダヤの祭儀上の職務を表す標準的で正確な訳語であり、ヘブライ人への手紙におけるイエスの仲介者としての役割を明確に示す。
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: 同情できない方ではありません
  rationale: οὐ…μὴ δυνάμενον の二重の否定的表現を保ちつつ、συμπαθέω が表す、他者の弱さを身をもって理解し共に感じる意味を自然な現代日本語で伝える。
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: 私たちの弱さ
  rationale: 身体的な病気だけでなく、人間の脆さや限界を広く指すため、包括的で自然な「弱さ」とした。
- source_word: πεπειρασμένον
  choice: 試みを受けられた
  rationale: πειράζω が持つ「試す」と「誘惑する」の両義をある程度保てる聖書文脈上自然な表現。「試された」よりも人格的な試練を示し、「誘惑された」と断定して意味を狭めない。別訳を脚注に示す。
- source_word: κατὰ πάντα
  choice: あらゆる点で
  rationale: 試みの包括性を簡潔かつ自然に表す。
- source_word: καθ’ ὁμοιότητα
  choice: 私たちと同じように
  rationale: 字義は「類似に従って」だが、日本語でそのまま訳すと不自然で比較対象も分かりにくい。文脈上含意される人間との類似を明示しつつ、完全な同一ではなく対応・類似を表す「同じように」とした。字義的表現は脚注に残す。
- source_word: χωρὶς ἁμαρτίας
  choice: 罪は犯されなかった
  rationale: 「罪なしに」という圧縮された句を、試みを受けたこととの対照が明瞭になる自然な日本語にした。ただし、ギリシア語は結果として罪を犯さなかったことだけでなく、罪から隔たっていたことも含み得るため、脚注で直訳を示す。
theological_decisions:
- issue: πεπειρασμένον とキリストの無罪性の関係
  choice: 試みを受けられた
  alternative: 誘惑を受けられた／試された
  rationale: 現実の試練を十分に表しながら、語の「試す／誘惑する」という幅を不必要に一方へ限定しない。直後の χωρὶς ἁμαρτίας が無罪性を明示するため、その緊張を本文と脚注で保持する。
- issue: καθ’ ὁμοιότητα の比較対象
  choice: 私たちと同じように
  alternative: 類似に従って
  rationale: 原文では比較対象が明記されないが、直前の「私たちの弱さ」と文脈から人間との類似が含意される。本文では理解可能な日本語とし、原文の簡潔さと曖昧さは脚注で示す。
- issue: χωρὶς ἁμαρτίας の統語的・神学的幅
  choice: 罪は犯されなかった
  alternative: 罪なしに／罪を別にして
  rationale: 試みと罪との決定的な対照を自然に伝える。ただし「罪を除いてあらゆる点で」と結び付ける解釈も可能なので、原文に近い別訳を脚注に示し、範囲を過度に固定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の修辞的な否定形「同情できない方ではない」を保持した。「大祭司」「試み」は聖書的文脈に適した語だが、一般読者にも理解できる範囲に収めた。敬意を示すため、キリストを指す述語には尊敬表現を用いた。
