    rationale: 受動的な完了事実のように響き、原文の「罪なしに／罪を離れて」という副詞句を行為上の一面に狭める。『罪を犯すことなく』は、試みを受けたことに伴う無罪性を自然に表しつつ、原文の構文により近い。
  - severity: low
    issue: συμπαθῆσαι を「同情できない」としている。
    rationale: 誤りではないが、日本語の「同情」には一方的な憐れみの響きもある。「共感できない」は、弱さを共有して理解するという語義をよりよく表す。
  - severity: low
    issue: 脚注 b の記号が文末に置かれている。
    rationale: 脚注は主として καθ’ ὁμοιότητα と χωρὶς ἁμαρτίας を説明するため、後者に対応する本文句の直後に置くと参照関係が明瞭になる。
