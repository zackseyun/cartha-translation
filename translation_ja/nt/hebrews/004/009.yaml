  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: ja
  text: したがって、神の民のために、安息日の休み[a]がなお残されています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「安息日を守ること」。ギリシア語「サバティスモス」はまれな語で、安息日を明確に想起させます。ここでは、神の民のためになお残されている、安息日に結びつく安息を指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: したがって
  rationale: 直前までの議論から結論を導く推論の接続語として、現代日本語で明瞭かつ自然に論理関係を示す。
- source_word: ἀπολείπεται
  choice: なお残っています
  rationale: 現在形が示す、今も存続し利用可能であるという含みを「なお」によって明示しつつ、簡潔に表す。
- source_word: σαββατισμός
  choice: 安息日の安息
  rationale: 稀な語であり、単なる一般的な「休み」ではなく安息日を明示的に響かせる。「安息日の安息」はやや特徴的な表現だが、安息日遵守だけにも、安息日との関係を失った比喩的休息だけにも限定せず、原語の緊張を保つ。
- source_word: τῷ λαῷ
  choice: 民のためには
  rationale: 与格を利益・帰属の意味に取り、その安息が神の民に残されていることを自然な日本語で示す。係助詞「は」は結論文の焦点を明確にする。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 所有・関係を表す属格を簡潔に訳し、神に属する民という契約的な表現を保つ。
theological_decisions:
- issue: ヘブライ人への手紙4章9節における σαββατισμός の意味
  choice: 安息日を明確に想起させる、神の民のためになお残る安息として「安息日の安息」と訳す。
  alternative: 「安息日を守ること」または安息日との響きを示さない単なる「安息」。
  rationale: 文脈は神の安息、第七日、約束された安息を結びつけている。そこで、週ごとの安息日遵守だけに限定することも、安息日の含意を消すことも避け、原語が持つ両義的な幅と神学的緊張を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「安息日の安息」は日常的ではないものの、原語の安息日との明示的な結びつきを保つために意図的に採用した。脚注標識[a]を該当語の直後に置いた。
