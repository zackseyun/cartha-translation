id: HEB.4.10
reference: Hebrews 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: ja
  text: というのも、その安息[a]に入った者は、神がご自分のわざをやめて休まれたように、自分のわざをやめて休んだからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その方の安息に」。この代名詞は文脈上、神を指し、「神の安息」の意味である可能性が最も高い。別訳「自分の安息に」。
    reason: alternative_reading
  - marker: b
    text: 別訳「自分のわざから休んだからです」。原語の動詞は、この箇所の「安息」と同じ語根を持つため、本文では「休んだ」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: 入った者
  rationale: 定冠詞を伴うアオリスト分詞を名詞的に捉え、安息に入った者を一般的な単数で表す。完了した動作も自然に伝わる。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の主張の根拠を説明する接続辞として、現代日本語で自然な説明のつながりを示す。
- source_word: κατάπαυσιν
  choice: 安息
  rationale: ヘブライ人への手紙3～4章の中心語であり、創世記における神の休みとの関連を保つため、「休み」よりも文脈上の重みを持つ「安息」とした。
- source_word: αὐτοῦ（κατάπαυσινの後）
  choice: その方の
  rationale: 文脈上は神を指す可能性が最も高いが、代名詞を「神の」と明示し切らず、原文に残る指示対象の余地を保った。
- source_word: καὶ αὐτὸς
  choice: 自分もまた
  rationale: καίの付加的意味とαὐτόςの強調を、自然な日本語でともに表す。
- source_word: κατέπαυσεν
  choice: 休んだ
  rationale: κατάπαυσιςとの同根語の反復を日本語でも「安息／休む」として見える形にしつつ、ἀπόと結びつく「やめた」という意味も脚注に残す。
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: 自らのわざを
  rationale: 日本語では「わざから休む」が不自然なため目的語構文とした。「わざ」はἔργαの広い意味を保ち、功績を得る行いなどに限定しない。
- source_word: ὥσπερ
  choice: 同じように
  rationale: 安息に入った者と神との明確な比較を自然に示す。
- source_word: ἀπὸ τῶν ἰδίων
  choice: ご自分のわざを
  rationale: 省略されているἔργωνを日本語では補い、ἰδίωνの強調を「ご自分の」で示す。神を主語とするため敬語表現を用いた。
- source_word: ὁ θεός
  choice: 神
  rationale: θεόςの標準的な訳語。比較対象である神を明示する原文の働きを保つ。
theological_decisions:
- issue: 「その方の安息」（αὐτοῦ）の指示対象
  choice: 本文では「その方の」とし、文脈上は神の安息を指すと脚注で示す。
  alternative: 安息に入る者自身の安息を指す。
  rationale: 3～4章では一貫して神の安息が論じられ、後半の神ご自身の休みとの比較もこの理解を支える。しかし原文は固有名詞ではなく代名詞なので、本文で「神の」と置き換えて曖昧さを完全には解消しない。
- issue: 「わざを休んだ」の性質
  choice: 人のわざ一般から休んだ、という幅を保つ。
  alternative: 救いを得るための功績的行為をやめたことに限定する。
  rationale: ἔργα自体は広い語であり、この一節だけから特定の教理的意味に限定しない。神が創造のわざを休まれたこととの比較を前面に保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「安息」「わざ」によって本文の荘重さと3～4章の主要語彙のつながりを保った。神の行為には「ご自分」「休まれた」を用い、過度に古風にならない範囲で敬意を示した。
