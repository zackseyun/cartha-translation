  to: というのも、その安息[a]に入った者は、神がご自分のわざをやめて休まれたように、自分のわざをやめて休んだからです[b]。
  rationale: 指示対象が不明瞭な「その方」を、文脈に依存する「その安息」に改め、脚注で原文の代名詞と代替的理解を明示しました。また、「わざを休む」という不自然で曖昧な目的語構文を、「わざをやめて休む」に改めました。これにより、わざをやめることと休むことの両方を表しつつ、κατάπαυσις／καταπαύωの語のつながりを保っています。
