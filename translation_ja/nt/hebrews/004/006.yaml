  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: ja
  text: そこで、なお何人かがその安息に入ることが残されており、以前に良い知らせを告げられた人たちが、不従順[a]のためにそこに入らなかったので、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不信仰のために」。このギリシア語は、信じることを拒むことが不従順として表れる場合を指すことがある。
    reason: ἀπείθειαは中心的には不従順を指すが、この文脈では不信仰とも重なりうるため。
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: したがって、……ので
  rationale: οὖνの推論的な働きを「したがって」で、ἐπείの理由・前提を示す働きを文末の「ので」で表し、原文が次節へ続く構文も保った。
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: なお何人かがその安息に入る余地があり
  rationale: 現在形のἀπολείπεταιが示す継続的な可能性を「なお……余地があり」と自然な日本語で表した。αὐτήνの指示対象は直前の文脈にある「安息」なので、代名詞の指示を日本語で明確にした。
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: 以前に良い知らせを告げられた人たち
  rationale: 受動態を保ちつつ、教会用語に偏りすぎない明瞭な現代語とした。πρότερονは「以前に」と訳した。
- source_word: οὐκ εἰσῆλθον
  choice: そこに入らなかった
  rationale: アオリストの単純な否定をそのまま表し、「そこ」は先に述べた安息を指す。
- source_word: δι’ ἀπείθειαν
  choice: 不従順のために
  rationale: ἀπείθειαの中心的な意味である、神の言葉に従わないことを保持した。不信仰との意味上の重なりは脚注に示した。
theological_decisions:
- issue: 安息への不入場の原因を表すἀπείθεια
  choice: 不従順のために
  alternative: 不信仰のために
  rationale: この語は信じようとしないことと従わないことが重なる文脈で用いられるが、本文では行為を伴う拒絶という語義を保つため「不従順」とした。「不信仰」という可能な訳は脚注に残し、両者の緊張を解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「良い知らせ」を用いて受動態を保ち、過度に専門的な教会用語を避けた。原文の文が次節へ続くため、末尾を「ので、」として未完の構文を維持した。
