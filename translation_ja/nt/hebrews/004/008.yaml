source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: ja
  text: もしヨシュア[a]が彼らに安息を与えていたのなら、その後、別の日について語ることはなかったでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「イエス」。Ἰησοῦςという名の形は「イエス」と「ヨシュア」のどちらも表し得ますが、ここでは文脈上、ヌンの子ヨシュアを指します。
    reason: 原語の同形異名と文脈上の指示対象を示すため。
lexical_decisions:
- source_word: Ἰησοῦς
  choice: ヨシュア
  rationale: ギリシア語形は「イエス」と「ヨシュア」の双方を表し得るが、ここではカナン入国と詩編95編より後にも残る安息との対比が論旨なので、ヌンの子ヨシュアを指す。
- source_word: κατέπαυσεν
  choice: 彼らに安息を与えていた
  rationale: 他動詞として「休ませる、安息を与える」という使役的意味を表し、文脈の中心語である「安息」とのつながりも保つ。
- source_word: οὐκ ἂν ... ἐλάλει
  choice: 語ることはなかったでしょう
  rationale: ἄνを伴う未完了過去が示す反実仮想の帰結を、自然な現代日本語で表す。主語は原文同様に明示せず、文脈に委ねる。
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: 別の日について
  rationale: 先の時点とは異なる、なお約束されている日を指す表現として、簡潔かつ自然に訳す。
- source_word: μετὰ ταῦτα
  choice: その後
  rationale: ヨシュアの時代より後の発言であるという時間的順序を明確にする。
- source_word: γὰρ
  choice: もし…のなら
  rationale: 日本語では条件文の流れ自体が前節を説明する関係を十分に伝えるため、独立した接続語を加えず自然な形にした。
theological_decisions:
- issue: ヘブライ人への手紙4章8節のἸησοῦςが指す人物
  choice: ヌンの子ヨシュア
  alternative: イエス
  rationale: 文脈はヨシュアに率いられたイスラエルの土地への入国と、それでも後に語られた安息の日を論じている。ただし、原文の名の形が「イエス」と同一であることは脚注に残す。
- issue: ἐλάλειの省略された主語
  choice: 日本語でも主語を明示しない
  alternative: 神は語ることはなかったでしょう
  rationale: 原文に明示的な主語がなく、直前までの文脈から理解される。神を補う解釈は妥当だが、本文では曖昧さを不必要に解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「安息」は周辺文脈の神学的な中心語として統一した。反実仮想は「もし…ていたのなら、…なかったでしょう」で自然に表し、原文にない主語は補わなかった。
