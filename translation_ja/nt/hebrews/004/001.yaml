  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: ja
  text: ですから、神の安息に入るという約束がなお残されている間は、あなたがたのうちのだれかが神の安息に入れなかったと思われることがないように、私たちは恐れましょう[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちは恐れを抱きましょう」。原語は単なる「注意しましょう」より強く、警告の深刻さを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神の安息に入るという約束がなお残されているので」。原文の構文は簡潔で、状況または理由を表すものとして訳すことができる。
    reason: alternative_reading
  - marker: c
    text: 別訳「神の安息に入れなかったように見えることがないよう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: 私たちは恐れましょう
  rationale: 勧告を表す接続法の強い警告を保つ。「注意しましょう」では原文の切迫感が弱まるため、「恐れましょう」とした。
- source_word: οὖν
  choice: ですから
  rationale: 前段で語られた、安息に入れなかったイスラエルの例から導かれる結論であることを、明瞭な現代日本語で示す。
- source_word: μήποτε
  choice: ことのないよう
  rationale: 勧告に続く否定的な懸念・警戒を、日本語として自然に表す。
- source_word: καταλειπομένης ἐπαγγελίας
  choice: 約束がなお残されている間に
  rationale: 属格独立構文が示す同時的状況と、約束が今も有効である含みを保った。
- source_word: εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: その方の安息に入る
  rationale: 「入る」という動きと「安息」を保持し、αὐτοῦを解釈的に「神の」と置き換えず「その方の」とした。
- source_word: δοκῇ
  choice: と思われる
  rationale: 実際の失敗と見かけだけの失敗のどちらかに断定せず、「見える・思われる」という原文の幅を残す。
- source_word: τις ἐξ ὑμῶν
  choice: あなたがたのうちのだれか
  rationale: 不定代名詞の単数性と部分を示す表現を自然な日本語で保持する。
- source_word: ὑστερηκέναι
  choice: そこに達しなかった
  rationale: 約束された安息という目標に届かず、取り残される意味を文脈に即して明確にした。
theological_decisions:
- issue: 警告を単なる注意へと弱めるか
  choice: 「私たちは恐れましょう」と強い勧告を保つ
  alternative: 「注意しましょう」「気をつけましょう」
  rationale: φοβηθῶμενの明白な強さを保ち、忍耐や背教をめぐる教理的結論を翻訳で先取りしない。
- issue: 「その方の安息」を本文で神の終末的安息と明示するか
  choice: 「その方の安息」と代名詞を保つ
  alternative: 「神の安息」「神の安息の日」
  rationale: 文脈上の指示対象を尊重しつつ、原文が用いる代名詞以上の解釈的限定を加えない。
- issue: δοκῇを単なる外見とみなすか、実際の失敗とみなすか
  choice: 「達しなかったと思われる」と曖昧さを保つ
  alternative: 「実際に達しない」「達しなかったように見えるだけである」
  rationale: 原文の「思われる／見える」という要素を消さず、警告の現実性も弱めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、警告にふさわしい厳粛さを保った。「その方」は文脈上の指示対象を示す品位ある表現とし、「安息」はヘブライ人への手紙3–4章の中心語として統一的に訳した。
