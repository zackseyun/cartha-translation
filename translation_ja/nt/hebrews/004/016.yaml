  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: ja
  text: ですから、あわれみを受け、時にかなった助けとなる恵みを見いだすために、私たちは大胆に[a]恵みの御座に近づこうではありませんか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確信をもって」とも訳せる。ギリシア語は、臆せず自由に語ったり近づいたりする大胆さと確信の両方を表しうる。
    reason: lexical_alternative
  - marker: b
    text: 「必要な時に助けていただくために」とも訳せる。直訳的には、適切な時に与えられる助けを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: 近づこうではありませんか
  rationale: 現在接続法の勧奨の力を、現代日本語の自然で品位ある呼びかけとして表した。「近づく」は神への接近という文脈を明確に保つ。
- source_word: οὖν
  choice: ですから
  rationale: 直前の大祭司イエスについての論述から導かれる結論を、明瞭な現代日本語で示す。
- source_word: μετὰ παρρησίας
  choice: 大胆に
  rationale: παρρησίαが含む、臆せず自由に近づく強い意味を保持する。「確信をもって」も可能なので脚注に示した。
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: 恵みの御座に
  rationale: 属格表現と御座の比喩を解釈しすぎずに保つ。「御座」は神の王権を表す文脈にふさわしい、理解可能で品位ある語である。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を導くἵναの働きを明示し、長い一文になりすぎないよう二文に分けた。
- source_word: λάβωμεν ἔλεος
  choice: あわれみを受け
  rationale: λαμβάνωとἔλεοςの基本義を自然に表し、後続の「恵みを見いだす」と異なる動詞を保持した。
- source_word: χάριν εὕρωμεν
  choice: 恵みを見いだす
  rationale: εὑρίσκωを「見いだす」、χάριςを「恵み」とし、原文の語彙的・神学的な重みを保った。
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: 時にかなった助けのために
  rationale: εὔκαιροςの「適時の、時宜にかなった」という意味を優先し、「必要な時」という受け手側の状況に限定しなかった。
theological_decisions:
- issue: 神の御座に近づく際のπαρρησίαのニュアンス
  choice: 大胆に
  alternative: 確信をもって
  rationale: イエスの大祭司としての働きに基づく、臆することのない自由な接近を強く表す一方、脚注によって内面的な確信の意味も保持した。厚かましさや不遜さを意味するとは限定しない。
- issue: χάριςの訳語
  choice: 恵み
  alternative: 好意
  rationale: 神から与えられる恩恵を表す文脈と、節内の「恵みの御座」との語彙的連関を保持した。
- issue: εὔκαιρον βοήθειανの時間的含意
  choice: 時にかなった助け
  alternative: 必要な時の助け
  rationale: 原文は助けが適切な時に与えられることを表しうるため、その焦点を残し、困窮時という伝統的な解釈は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の王座を指す「御座」と中心語である「あわれみ」「恵み」に聖書本文としての品位を保たせた。勧奨は硬すぎない「近づこうではありませんか」とした。
