revisions:
- from: 神のことばは生きていて、力を働かせ[a]、どんな両刃の剣よりも鋭く、魂と霊、関節と骨髄を分けるところにまで刺し通し[b]、心の思いと意図を見分けることができるからです。
  to: 神のことばは生きていて、働きがあり、どんな両刃の剣よりも鋭く、魂と霊、関節と骨髄との分かれ目にまで達し、心の思いと意図を見分けるからです。
  rationale: ἐνεργήςを自然な日本語で「働きがあり」と改め、剣が深く達する比喩を「分かれ目にまで達し」として明瞭にしました。脚注a・bの内容自体は保持しましたが、改訂本文に脚注記号がないため、完全な本文・脚注セットとしては脚注を本文に対応づける必要があります。
