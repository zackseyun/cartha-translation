id: HEB.4.12
reference: Hebrews 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: ja
  text: 神のことばは生きていて、働きがあり、どんな両刃の剣よりも鋭く、魂と霊、関節と骨髄との分かれ目にまで達し、心の思いと意図を見分けるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζῶν
  choice: 生きていて
  rationale: 神のことばが持つ継続的な生命力を、現代日本語で自然に表す。
- source_word: γὰρ
  choice: からです
  rationale: 直前の勧告を根拠づける説明の働きを、文末で自然に示す。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 聖書、宣教、神の発言、人格的なロゴスのいずれかに限定せず、原文の広がりを保つ。
- source_word: ἐνεργὴς
  choice: 力を働かせ
  rationale: 単に活動中であるだけでなく、作用を及ぼす語感を自然な日本語で表す。「有効である」ほど結果に限定しない。
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: どんな両刃の剣よりも鋭く
  rationale: 比較表現と剣の比喩を明瞭かつ簡潔に保つ。
- source_word: διϊκνούμενος
  choice: 刺し通し
  rationale: 剣の比喩を継続し、深部まで達する動きを鮮明に表す。
- source_word: ἄχρι μερισμοῦ
  choice: 分けるところにまで
  rationale: ἄχριの到達範囲とμερισμόςの分離・区分の意味を保つ。
- source_word: ψυχῆς καὶ πνεύματος
  choice: 魂と霊
  rationale: 語彙上の区別を保持しつつ、人間の構成について特定の体系を断定しない。
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: 関節と骨髄
  rationale: 身体の奥深くまで達する並行的な比喩を、通常の現代日本語で表す。
- source_word: κριτικὸς
  choice: 見分けることができる
  rationale: 内面を評価・判別する能力を表し、「批判する」という現代語の狭い含意を避ける。
- source_word: ἐνθυμήσεων
  choice: 思い
  rationale: 心中の思考や熟考を広く自然に表す。
- source_word: ἐννοιῶν
  choice: 意図
  rationale: ἐνθυμήσεωνとの差を示し、内的な志向や企てを表す。
theological_decisions:
- issue: 「神のことば」の指示対象
  choice: 「神のことば」と広く訳し、指示対象を限定しない。
  alternative: 聖書、語られた約束や裁き、御子なるロゴスのいずれかに特定する。
  rationale: 文脈は神が語ることの効力を強調するが、ギリシア語自体が持つ幅と神学的緊張を保つ。
- issue: 「魂と霊」が示す人間論
  choice: 「魂と霊」をそのまま保持し、固定的な二分説・三分説を含意させない。
  alternative: 人間を構成する分離可能な二要素として技術的に解釈する。
  rationale: 深く刺し通して見分けるという比喩の中の対語であり、この一節だけで特定の人間論を断定しない。
- issue: 「分ける」の関係
  choice: 「魂と霊、関節と骨髄を分けるところにまで」とし、各対の間を分けるという通常の読みを保つ。
  alternative: 魂そのもの、霊そのもの、関節そのもの、骨髄そのものをそれぞれ分割すると読む。
  rationale: 属格の連鎖には統語上の余地があるため、本文では簡潔な表現を採りつつ、脚注で曖昧さを示す。
translation_notes:
  register: 明瞭で格調ある現代標準語。「御言葉」ではなく「ことば」として一般読者への透明性を優先し、「両刃」「骨髄」など原文の強い比喩は保持した。
