id: HEB.4.4
reference: Hebrews 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: ja
  text: というのも、七日目について、ある箇所でこう語られているからです。「そして神は七日目に、すべてのみわざをやめて休まれた。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「どこかで」。聖書のどの箇所かを明示しない引用の仕方であり、その権威について不確かだという意味ではありません。
    reason: lexical_alternative
  - marker: b
    text: 「やめられた」または「休止された」とも訳せます。この語は働きをやめることを表します。ここでは創世記2:2と、ヘブライ3―4章における神の「休み」とのつながりを保つため、「休まれた」としました。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: 語られている
  rationale: 完了形が示す、過去に語られた聖書の言葉が今も効力を持つという含みを、現代日本語で自然に表す。非人称的な引用導入にもよく合う。
- source_word: γάρ
  choice: というのも…からです
  rationale: 直前の議論を根拠づける説明の接続であることを明確にする。
- source_word: που
  choice: ある箇所で
  rationale: 引用箇所を特定せずに導入する表現。聖書の権威への不確かさではなく、場所を明示しない引用形式を表す。
- source_word: περὶ τῆς ἑβδόμης
  choice: 七日目について
  rationale: 文脈上省略されている「日」を補い、日本語として明瞭にした。
- source_word: οὕτως
  choice: こう
  rationale: 後続する引用の文言を自然かつ簡潔に導入する。
- source_word: Καὶ
  choice: そして
  rationale: 創世記からの引用に含まれる接続詞を保持する。
- source_word: κατέπαυσεν
  choice: 終えて休まれた
  rationale: 動詞の「やめる、休む」という両面を自然な日本語で表し、創世記2章およびヘブライ3―4章の「休み」との語彙的連関を保つ。
- source_word: ὁ θεὸς
  choice: 神は
  rationale: 明確な主語として標準的に訳した。
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: 七日目に
  rationale: 日を示す日本語の自然な助詞「に」を用いた。
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: すべてのみわざを
  rationale: ἀπόが示す、働きから離れて中止する意味を「終えて休む」という述語全体で表した。ἔργωνの複数性は集合的な「すべてのみわざ」で保持した。
theological_decisions:
- issue: 神の安息を表す κατέπαυσεν と、ヘブライ書における「休み」の主題との関係
  choice: 終えて休まれた
  alternative: やめられた／休まれた
  rationale: 神が疲労から回復したとの誤解を避けつつ、働きをやめたという語義と、創世記2:2およびヘブライ3―4章の「休み」との神学的・語彙的つながりの双方を保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書引用にふさわしい品位を保った。「みわざ」は神の働きを指す文脈で広く理解される語として用い、敬語は「休まれた」に限定して過度に荘重になることを避けた。
