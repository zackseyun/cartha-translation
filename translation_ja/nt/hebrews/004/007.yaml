source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: ja
  text: '神は再び、ある日を「今日」と定め、長い時を経た後、ダビデを通して[a]、すでに述べられているとおり、こう語っておられます。


    「今日、もしあなたがたがその方の声を聞くなら、


    　あなたがたの心をかたくなにしてはならない。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ダビデにおいて」。すなわち、ダビデに結び付けられた詩篇の中で。
    reason: ἐν Δαυὶδ は「ダビデを通して」と理解できる一方、ダビデに関連する詩篇内で語ることを指す表現とも理解できるため。
lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: 議論を再開し、神が改めて一つの日を定めることを示す。
- source_word: τινὰ ὁρίζει ἡμέραν
  choice: ある日を…定め
  rationale: τινάの特定されつつ名称未提示のニュアンスと、ὁρίζειの権威ある指定を自然な日本語で保つ。
- source_word: Σήμερον
  choice: 「今日」
  rationale: 詩篇引用の中で、その日を名づける語としての修辞的な力を引用符で明示する。
- source_word: ἐν Δαυὶδ λέγων
  choice: ダビデを通して…語っておられます
  rationale: 神がダビデを媒介として語るという自然な理解を示しつつ、著者性を必要以上に断定しない。
- source_word: μετὰ τοσοῦτον χρόνον
  choice: 長い時を経た後
  rationale: 荒野の世代からの長い時間的隔たりを、簡潔で格調ある現代日本語で表す。
- source_word: καθὼς προείρηται
  choice: 前に言われたとおり
  rationale: 以前に語られ、今も効力を持つ発言への参照を表す。
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: もしその方の声を聞くなら
  rationale: 応答を含意する聖書的な「聞く」を保ち、「従う」と意訳して意味を限定しない。文脈上の神を指すαὐτοῦは、敬意と明瞭さのため「その方」とした。
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: あなたがたの心をかたくなにしてはならない
  rationale: 内面の意志と態度を表す「心」を保持し、警告の力を自然な禁止表現で伝える。
theological_decisions:
- issue: 神の安息に関する議論における「今日」の意味
  choice: 応答のために神が定めた、現在性を帯びる機会として訳すが、暦上の日または終末の日のみに限定しない。
  alternative: 詩篇が語られた歴史上の日だけ、または専ら終末論的な日と解する。
  rationale: 本文は荒野の時代から長い後にも神が「今日」を定めると論じる。引用符と構文を保つことで、その神学的緊張を解消せずに伝える。
- issue: ἐν Δαυὶδ の意味
  choice: 「ダビデを通して」とする。
  alternative: 「ダビデの中で」、または「ダビデの詩篇において」とする。
  rationale: 神がダビデを媒介として語る意味を自然に伝える一方、詩篇の著者性や標題について本文以上の断定を避ける。別の統語的理解は脚注で示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「語っておられます」は神を主語とする流れを明示し、引用は改行して詩篇の警告を際立たせた。「かたくな」は一般読者に通じる聖書的表現として平仮名表記にした。
