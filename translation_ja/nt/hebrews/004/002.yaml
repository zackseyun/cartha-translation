id: HEB.4.2
reference: Hebrews 4:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: ja
  text: 実際、私たちにも、彼らと同じように良い知らせが告げられています。しかし、彼らが聞いたことばは、彼らの益になりませんでした。彼らが信仰[a]によって聞いた人たちと結びついていなかったからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 異読に従えば、「聞いた人たちのうちで、そのことばが信仰と結びついていなかったからです」とも訳せる。
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: 良い知らせが告げられています
  rationale: 迂言的完了形が表す、すでになされた告知とその現在的な効力を自然な日本語で示す。「福音」という後代の術語だけに限定せず、荒野の世代との比較にも適する動詞的表現とした。
- source_word: καθάπερ κἀκεῖνοι
  choice: 彼らと同じように
  rationale: 現在の受け手と荒野の世代が、ともに神から知らせを受けたことを簡潔で自然な比較表現にした。
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: 彼らが聞いたことば
  rationale: 属格構文を直訳調の「聞くことのことば」とせず、λόγοςを告げられた内容、ἀκοήを聞いたこととして表した。
- source_word: ὠφέλησεν
  choice: 益になりませんでした
  rationale: その知らせが彼らに霊的な効用をもたらさなかったという意味を、現代日本語で明瞭に表す。
- source_word: συγκεκερασμένους
  choice: 結び合わされていなかった
  rationale: 「混ぜ合わせる」という語像を踏まえつつ、ここでの比喩的・関係的な結合を表す。SBLGNT本文の対格複数形に従い、ἐκείνουςを受ける表現とした。
- source_word: πίστει
  choice: 信仰
  rationale: 聞くだけでなく信じて応答することとの対照に適する。手段または領域を表す与格として「信仰によって」とした。
- source_word: τοῖς ἀκούσασιν
  choice: 聞いた人たち
  rationale: ἀκούωの基本義を保ち、本文には明示されない「受け入れた」などの解釈を加えなかった。
theological_decisions:
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼
  rationale: 文脈は、知らせを耳にすることと、それに信仰をもって応答することを対照している。「信仰」は意味を過度に限定せず、神学的緊張も保つ。
- issue: 末尾の分詞句の係り先
  choice: 彼らが、聞いた人たちと信仰によって結び合わされていなかった
  alternative: 聞いた人たちのうちで、そのことばが信仰と結びついていなかった
  rationale: 提示されたSBLGNT本文のσυγκεκερασμένουςは対格男性複数で、最も自然にはἐκείνους「彼ら」を修飾する。構文上の難しさを平板化せず、異読に基づく伝統的理解は脚注に残した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「良い知らせ」で原語の動詞性を保ち、「益になりませんでした」で簡潔に因果を示した。本文はSBLGNTの難しい構文を保持し、異読による伝統的訳は脚注で提示した。
