    rationale: διέρχομαιの「通り抜ける／通り過ぎる」で十分であり、「行く」を加える必要はありません。より簡潔な「通り抜けられた」が原文に近く自然です。
  - severity: medium
    issue: 「告白を固く保つ」という連語
    rationale: κρατῶμεν τῆς ὁμολογίαςは告白に堅くとどまることを求めます。「守り続ける」は日本語として自然で、現在形の継続的な勧告をよく伝えます。
  - severity: low
    issue: 脚注アンカーの位置
    rationale: 複数形「天」についての脚注なので、文末ではなく該当語の直後に置くと参照対象が明確になります。
