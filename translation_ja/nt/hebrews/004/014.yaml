id: HEB.4.14
reference: Hebrews 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: ja
  text: ですから、私たちには、もろもろの天[a]を通り抜けられた偉大な大祭司、神の子イエスがおられるのですから、私たちの告白をしっかり守り続けましょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天」は原文では複数形。別訳「もろもろの天を通って行かれた」。
    reason: 原文の複数形と、διέρχομαιの訳語の可能性を示すため。
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: こういうわけで、私たちには……おられるのですから
  rationale: οὖνの推論的なつながりと、ἔχοντεςが勧告の根拠を示す働きの両方を、自然な現代日本語で表した。
- source_word: ἀρχιερέα μέγαν
  choice: 偉大な大祭司
  rationale: 名詞と形容詞の組み合わせを簡潔に保ち、イエスの祭司職の卓越性を明示する。
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: もろもろの天を通り抜けて行かれた
  rationale: 完了分詞が示す完了した出来事と現在に及ぶ意義を文脈に委ねつつ、διέρχομαιの通過のイメージとοὐρανούςの複数形を保持した。尊敬表現はイエスを指す日本語として自然である。
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: 神の子イエス
  rationale: 人名とキリスト論的称号を原文の同格関係に沿って明瞭に示した。
- source_word: κρατῶμεν
  choice: 固く保とうではありませんか
  rationale: 勧告の接続法を共同体への継続的な呼びかけとして、格調を保ちながら分かりやすく訳した。
- source_word: τῆς ὁμολογίας
  choice: 私たちの告白
  rationale: ὁμολογίαを共同体が公に認め表明する内容として「告白」と訳した。「私たちの」はギリシア語の定冠詞を機械的に訳したものではなく、勧告の主体を日本語で明確にする文脈的補足である。
theological_decisions:
- issue: υἱὸς τοῦ θεοῦのキリスト論的称号
  choice: 神の子
  alternative: 神の御子
  rationale: 原文の称号を言い換えずに保持しつつ、現代の一般読者にも直接理解できる表現を選んだ。「御子」も可能だが、特定の教会語彙への依存を避けた。
- issue: τοὺς οὐρανούςの宇宙論的イメージ
  choice: もろもろの天
  alternative: 天
  rationale: 原文の複数形と、イエスが天上の領域を通過したというイメージを保持した。ただし、天の層数など、本文が明言しない体系的宇宙論は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「大祭司」「告白」など本文の神学的中核語は保持した。「もろもろの天」は日常語よりやや格調があるが、原文の複数形を不自然になりすぎず伝えるために採用した。
