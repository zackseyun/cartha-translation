source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: ja
  text: 神の前に隠れている被造物は一つもありません。すべてのものは、その目の前に裸であり、あらわにされています[b]。この方に、私たちは申し開きをしなければなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「この方に対して、私たちには言葉（または事柄）がある」。この表現は、「私たちがかかわる方」と理解することもできます。
    reason: alternative_reading
  - marker: b
    text: 「あらわにされている」と訳した語は、首を露出させる、または首を反らせる情景を思わせる可能性のある、まれな動詞です。神の前に完全にさらされていることを強調します。
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: 被造物
  rationale: 単数形が総称的に用いられ、造られた存在・ものを一つ一つ含む。「被造物」は創造主との関係を保ちつつ、「被造世界」という集合的意味への誤解を避ける。
- source_word: ἀφανὴς
  choice: 隠れている
  rationale: ここでは存在論的な不可視性より、神の吟味から隠されている状態が問題であるため。
- source_word: ἐνώπιον αὐτοῦ
  choice: 神の前に
  rationale: 直訳に近い「その方の前に」では指示対象がやや不明瞭なため、文脈上の指示対象である神を明示した。後半の「その目の前に」とも自然につながる。
- source_word: πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的な範囲を明確に表す。
- source_word: γυμνὰ
  choice: 裸で
  rationale: 完全な露出を示す鮮明な比喩をそのまま保つ。
- source_word: τετραχηλισμένα
  choice: あらわにされています
  rationale: まれな動詞の完了分詞で、首を反らされる、または首が露出する像を含み得るが確定的ではない。本文では結果として完全にさらされた状態を自然な日本語で示し、語源的な含みは脚注に残す。
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: その目の前に
  rationale: 神の視線に対して何も覆われていないことを自然かつ具体的に表す。
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: この方に、私たちは申し開きをしなければなりません
  rationale: 圧縮された慣用的表現を、直前の神による吟味と裁きの文脈に即して説明責任として訳した。ギリシア語が許す、より字義的な別解は脚注に示す。
theological_decisions:
- issue: πρὸς ὃν ἡμῖν ὁ λόγος の解釈
  choice: 人が神に申し開きをしなければならないことを表す。
  alternative: 「私たちがかかわる方」「この方に私たちの言葉／事柄が向けられている」
  rationale: 直前では神の前にすべてが露呈していることが強調され、4章12–13節全体にも吟味と裁きの警告があるため、「申し開き」は文脈上もっとも明瞭である。ただし原文は簡潔で多義的なので、代替理解を脚注に保存した。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で厳粛な文体。「裸」という原文の強い比喩は保持し、希少語の不確かな具体像は本文で断定せず脚注に置いた。脚注[a]は対応する最終節の直後、脚注[b]は「あらわにされています」の直後に配置した。
