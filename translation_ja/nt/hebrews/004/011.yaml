  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: ja
  text: ですから、あの安息に入るために力を尽くしましょう。だれも同じ不従順の前例に倣って倒れることのないように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じ不信仰の前例に倣って」とも理解できます。ここで「不従順」と訳した語は、神を信頼しようとしなかった荒野の世代を背景にしていますが、ギリシア語ではより直接的に「不従順」を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: 力を尽くしましょう
  rationale: 勧告を表すアオリスト接続法の力を保ちつつ、熱意と勤勉な努力を意味する語を自然な現代日本語で表した。
- source_word: οὖν
  choice: ですから
  rationale: 神の安息と荒野の世代の失敗についての先行する議論から導かれる結論であることを、明確で自然な接続表現で示した。
- source_word: εἰσελθεῖν
  choice: 入るために
  rationale: σπουδάσωμενに続く不定詞を目的として自然に表現した。
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: あの安息
  rationale: これまで論じられてきた神の安息を指す指示語の強調を保持し、内容を過度に限定しなかった。
- source_word: ἵνα μὴ ... τις
  choice: だれも……ことがないためです
  rationale: 否定的な目的ないし結果を示す警告の構文を、明瞭な現代日本語で表した。
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: 同じ……前例にならって
  rationale: ὑπόδειγμαは模範、型、実例を意味し、ここでは荒野の世代の警告的な先例を指す。単なる『模範』との誤解を避け、『前例にならって』とした。
- source_word: πέσῃ
  choice: 倒れる
  rationale: 警告の厳粛さを保ち、失敗または滅びに至ることを過度に解釈せず表した。
- source_word: τῆς ἀπειθείας
  choice: 不従順の
  rationale: 属格としてὑποδείγματιを限定する構造を保ち、語の直接的意味である『不従順』を採用した。文脈上密接に関連する『不信仰』は脚注に示した。
theological_decisions:
- issue: 荒野の世代の失敗におけるἀπείθειαと不信仰の関係
  choice: 本文では「不従順」と訳す
  alternative: 不信仰
  rationale: ヘブライ人への手紙は不信仰と不従順を密接に結びつけているが、ἀπείθειαのより直接的な語義は『不従順』である。本文で両概念を同一視せず、その神学的緊張を脚注によって保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。共同体への勧告を「〜ましょう」で表し、専門的すぎる表現を避けた。脚注記号[a]は該当する文末に置いた。
