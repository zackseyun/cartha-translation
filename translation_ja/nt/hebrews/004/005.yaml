  text: καὶ ἐν τούτῳ πάλιν· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: ja
  text: また別の箇所で、こう言われています。「彼らは決してわたしの安息に入ることはない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では直訳すると「もし彼らがわたしの安息に入るなら」となるが、これは「彼らは決してわたしの安息に入ることはない」という意味の誓いの表現。
    reason: 原文の条件文形式と、その慣用的な強い否定の意味を示すため。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 別の箇所では
  rationale: 直訳は「この箇所で」だが、πάλινとともに別の聖書箇所からの引用を導く表現として、現代日本語で自然な「別の箇所では」とした。
- source_word: πάλιν
  choice: また
  rationale: 新たに、あるいは重ねて聖書を引用する流れを簡潔に示す。
- source_word: Εἰ εἰσελεύσονται
  choice: 決して…入ることはない
  rationale: 形の上では「もし彼らが入るなら」だが、ヘブライ語に由来する誓いの定型を反映し、強い否定を表すため、その意味を自然な日本語で示した。
- source_word: κατάπαυσίν
  choice: 安息
  rationale: ヘブライ人への手紙3―4章で繰り返される主要語であり、神の休みを指す語として文脈上の連続性と宗教的な品位を保つ。
- source_word: μου
  choice: わたしの
  rationale: 詩編からの神の発言における所有関係をそのまま保持する。
theological_decisions:
- issue: 誓いの形式を持つ条件節 Εἰ εἰσελεύσονται の訳し方
  choice: 彼らは決して、わたしの安息に入ることはない
  alternative: もし彼らがわたしの安息に入るなら
  rationale: ギリシア語の表面上の条件形を注に残しつつ、引用元のヘブライ語的な誓いの定型が持つ強い否定の意味を本文で伝えた。特定の教理的解釈は付加していない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「安息」は文脈上の鍵語として保持し、誓いの強調は「決して…ない」で自然に表した。
