id: HEB.4.3
reference: Hebrews 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: ja
  text: '信じた私たちは、その安息に入るのです。神がこう言われたとおりです。


    「私は怒りのうちに誓った。


    『彼らが私の安息に入ることは決してない。』」[a]


    もっとも、神のみわざは世界の基が据えられた時から、すでに成し遂げられていました。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では直訳すると「もし彼らが私の安息に入るなら」。これは誓いの定型表現で、「彼らは決して私の安息に入らない」という意味です。
    reason: 原文の条件文形式と、その慣用的な強い否定の意味を併記するため。
  - marker: b
    text: 別訳「神のみわざは、世界の基が据えられた時から完成していました」。
    reason: γενηθέντωνを文脈に即して「完成していました」と表す可能性を示すため。
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: 入るのです
  rationale: 現在形の継続的・一般的な力を保ち、信じる者が今、神の安息に入るという主張を自然な日本語で表す。未来だけに限定しない。
- source_word: κατάπαυσιν
  choice: その安息
  rationale: 文脈ですでに論じられている神の特定の安息を指すため、「その」を添えて談話上のつながりを明確にした。
- source_word: οἱ πιστεύσαντες
  choice: 信じた私たち
  rationale: アオリスト分詞が表す、信じるに至った者という性格と、一人称複数動詞による著者の自己包含を保った。
- source_word: καθὼς εἴρηκεν
  choice: 神がこう言われたとおりです
  rationale: 完了形の現在にも及ぶ効力を日本語として自然に示し、発言者が神であることを文脈に沿って明示した。
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: 私は怒りのうちに誓った
  rationale: ὀργήの強い意味と、誓いの厳粛な裁きの調子を保った。
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: 彼らが私の安息に入ることは決してない
  rationale: セム語的な誓言定型の実際の意味である強い否定を、誤解のない現代日本語で示した。表面上の条件文は脚注で知らせる。
- source_word: καίτοι
  choice: もっとも
  rationale: 先行する引用と、創造のみわざがすでに成し遂げられていたという事実との譲歩的関係を自然に示す。
- source_word: τῶν ἔργων ... γενηθέντων
  choice: 神のみわざは…すでに成し遂げられていました
  rationale: 属格絶対が示す既完了の背景を表し、文脈上の行為者である神を明示した。「みわざ」は創造の文脈にふさわしい品位を持つ。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 世界の基が据えられた時から
  rationale: 世界の創設・創造を表す慣用句を、原文の「基」の比喩を保ちながら明瞭に訳した。
theological_decisions:
- issue: 詩篇95篇の誓言引用の効力
  choice: 強い否定として「決してない」と本文で訳す
  alternative: 表面に即して「もし彼らが私の安息に入るなら」と訳し、否定の意味を文脈に委ねる
  rationale: εἰ＋未来形は、ヘブライ語に由来する誓言定型であり、文脈上は入ることを確実に否定する。本文では意味を明示しつつ、ギリシア語の形式は脚注に残した。
- issue: 信じる者が安息に入る時制
  choice: 現在の「入るのです」とする
  alternative: 「入ろうとしています」または「入ります」と未来的に訳す
  rationale: 現在形を保ち、信仰によって現在すでに安息に入る面と、文脈に残る将来の完成との緊張を一方に限定しない。
- issue: 神のみわざの完了時点
  choice: 「世界の基が据えられた時から、すでに成し遂げられていました」
  alternative: 「世界の基が据えられた時に完成していました」
  rationale: ἀπόの起点的な意味と、属格絶対による背景説明を保つ。創造以来、神の安息が利用可能であるという議論を過度に解釈しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「安息」は本書の神学的主題語として保持し、「休み」と意訳しない。引用は詩的な改行で示し、誓言の厳粛さを保つ。「みわざ」は一般読者にも理解可能な聖書的敬語として用いた。
