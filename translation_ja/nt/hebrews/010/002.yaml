id: HEB.10.2
reference: Hebrews 10:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: ja
  text: そうでなければ、一度きよめられた礼拝者たちがもはや罪の意識[a]を持たなくなるので、いけにえがささげられることはやんだはずではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪についての良心」。ここでは、罪を見分ける良心そのものではなく、神の前で罪を負っているという意識を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: そうでなければ
  rationale: 前節の主張を受けた反実仮想的な推論を示す。日本語でも論理の流れが明瞭になる。
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: いけにえをささげることはやんだはずではありませんか
  rationale: 反実仮想を含む修辞疑問を「はずではありませんか」で表し、受動分詞は前節のいけにえを補って自然な日本語にした。
- source_word: τοὺς λατρεύοντας
  choice: 礼拝する人々
  rationale: 祭儀に携わる者という文脈を保ちつつ、現代日本語で明快に表した。
- source_word: ἅπαξ κεκαθαρισμένους
  choice: 一度きよめられ
  rationale: 完了受動分詞による、完了して結果が続くきよめを文脈から伝える。「一度」は明示しつつ、「ただ一度で完全に」と断定しすぎない。
- source_word: συνείδησιν ἁμαρτιῶν
  choice: 罪の意識
  rationale: 罪を倫理的に認識できなくなるという意味ではなく、神の前で罪を負っているという持続的な自覚を指すため、「良心」よりも文脈に適する。
theological_decisions:
- issue: きよめられた礼拝者に「罪の意識」がなくなることの意味
  choice: 継続する罪責の自覚がなくなることとして訳す
  alternative: 罪についての良心がまったくなくなることとして訳す
  rationale: 文脈の論点は、有効なきよめが反復献祭を不要にすることであり、倫理的な罪の認識能力の消滅ではない。
- issue: ἅπαξ の決定的・非反復的な含意
  choice: 本文では「一度」とする
  alternative: 「ただ一度で完全に」と明示する
  rationale: 文脈上は決定的な意味を帯びうるが、この副詞だけで強い解釈を本文に固定せず、原文の余地を保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、修辞疑問と祭儀的文脈を保持した。「清め」ではなく聖書文体として定着しつつ読みやすい「きよめ」を採用した。
