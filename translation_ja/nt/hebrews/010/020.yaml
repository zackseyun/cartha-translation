id: HEB.10.20
reference: Hebrews 10:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: ja
  text: これは、キリストが私たちのために開いてくださった、垂れ幕を通る新しい、生きた道です。垂れ幕とは、ご自分の肉のことです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἣν
  choice: この道は
  rationale: 前節から続く関係代名詞を、日本語で自然に節をつなぐため、先行する「道」を明示して表した。
- source_word: ἐνεκαίνισεν
  choice: 新しく開いてくださった
  rationale: 新たに使用できるようにする、開設するという意味を明瞭に伝えつつ、私たちのためになされた行為であることを自然な敬語で示す。
- source_word: ἡμῖν
  choice: 私たちのために
  rationale: 利益を表す与格として訳した。
- source_word: ὁδὸν πρόσφατον καὶ ζῶσαν
  choice: 生きた道
  rationale: πρόσφατον の新しさは動詞「新しく開いて」に含め、ζῶσαν は解釈を加えて「命を与える」とせず「生きた」と保持した。
- source_word: διὰ τοῦ καταπετάσματος
  choice: 垂れ幕を通って
  rationale: 幕屋・神殿の隔ての幕を指す語として、現代日本語で分かりやすい「垂れ幕」を用い、διά の通過・媒介の意味を保った。
- source_word: τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ
  choice: すなわち、ご自分の肉を通って
  rationale: 説明句が垂れ幕をキリストの肉と結び付ける構造を保ち、先行する διά の関係を日本語で明示した。σάρξ は「体」と平板化せず「肉」とした。
theological_decisions:
- issue: 垂れ幕とキリストの肉との比喩的同定
  choice: 「垂れ幕を通って、すなわち、ご自分の肉を通って」
  alternative: 「垂れ幕、すなわち、ご自分の肉を通って」
  rationale: ギリシャ語の同格的説明を保ちながら、道が何を「通る」のかを日本語で明瞭にする。両者の関係をそれ以上教理的に説明しない。
- issue: σάρξ の訳語
  choice: 肉
  alternative: 体
  rationale: ここではキリストの具体的な肉を指すため、原語に透明な「肉」を採用し、身体一般を表す語へ置き換えなかった。
translation_notes:
  register: 明瞭な現代標準日本語。前節に依存するギリシャ語の関係節は、日本語として単独でも理解できるよう「この道は」で受けた。荘重さを保ちつつ古語調は避けた。
