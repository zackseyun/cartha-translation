id: HEB.10.38
reference: Hebrews 10:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: ja
  text: しかし、わたしの義人[b]は信仰によって[a]生きる。もしその人が退くなら[c]、わたしの魂はその人を喜ばない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さによって」または「信頼によって」とも訳せる。ギリシア語のピスティスにはこれらの意味があり得るが、本文では「信仰」とした。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては「わたしの」がなく、単に「義人」とする。
    reason: textual_variant
  - marker: c
    text: 原文は単数男性形で表現するが、ここで男性だけに限定しているとは限らない。日本語では単数性を保って「その人」とした。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: しかし、わたしの義人
  rationale: 定冠詞を伴う形容詞を名詞的に取り、「義とされる者」などの解釈を加えず、簡潔で定着した「義人」とした。μουはSBLGNT本文に従って「わたしの」と訳した。δὲは文脈上の対照を示す「しかし」とした。
- source_word: ἐκ πίστεως
  choice: 信仰によって
  rationale: ἐκはここでは生きることの根拠・源を表すため「によって」とした。πίστιςの主要な訳語として「信仰」を本文に置き、「真実」「忠実さ」「信頼」の可能性は脚注に残した。
- source_word: ζήσεται
  choice: 生きる
  rationale: 未来形だが、引用文中の確言・原則を自然な現代日本語で表すため非過去形「生きる」とした。
- source_word: ὑποστείληται
  choice: 退く
  rationale: 圧力を前に身を引き、後退する意味を、警告の文脈に合う簡潔な「退く」で表した。
- source_word: οὐκ εὐδοκεῖ
  choice: 喜びとしない
  rationale: 「喜ぶ、よしとする」という意味を保ちつつ、「魂」を主語とする表現として自然で格調のある日本語にした。
- source_word: ἡ ψυχή μου
  choice: わたしの魂
  rationale: 単に「わたしは」と平板化せず、聖書引用にある明示的な「わたしの魂」という人格的表現を保持した。
- source_word: ἐν αὐτῷ
  choice: その人を
  rationale: εὐδοκέωとともに対象を示すἐν＋与格を、日本語では「その人を喜びとする」と自然に表した。
theological_decisions:
- issue: ἐκ πίστεωςにおけるπίστιςの意味
  choice: 信仰によって
  alternative: 真実によって／忠実さによって／信頼によって
  rationale: πίστιςには文脈上「信仰」「信頼」「真実・忠実さ」の意味領域があり得る。本文では標準的な「信仰」を採用しつつ、ハバクク書からの引用に伴う解釈上の幅を脚注で明示した。
- issue: 「退く」者の指示対象
  choice: 先に述べた単数の「わたしの義人」を受け得る「その人」
  alternative: 義人とは別の不特定の人物
  rationale: ギリシア語は単数形のまま続き、主語の交替を明示していない。そのため同一人物を受け得る文法的流れと警告の緊張を保ち、教理上の理由で別人に限定しなかった。
- issue: 単数男性形の代表性
  choice: 「その人」という単数表現を保持
  alternative: 男性だけを指す「彼」／複数化した「彼ら」
  rationale: 原文の単数性と指示の連続性を保つ一方、日本語では文法上の性を表示する必要がないため「その人」とした。原文の男性単数形が男性だけに限定されるとは限らないことを脚注で説明した。
- issue: μουの本文採否
  choice: 「わたしの」を本文に含める
  alternative: 「義人」とだけ訳す
  rationale: 提示されたSBLGNT本文のμουを訳出した。ただし、これを欠く写本があるため異読を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、引用文としての格調を保った。「義人」「信仰」「魂」は聖書語として定着しており、一般読者にも理解可能と判断した。「わたしの魂はその人を喜びとしない」は原文の擬人的・人格的表現を保持するため、やや荘重な言い回しを意図的に採用した。
