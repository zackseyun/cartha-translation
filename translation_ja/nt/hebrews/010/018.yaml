  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: ja
  text: これらのことの赦しがあるところでは[a]、もはや罪のためのささげ物はありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらのこと」は、前節にある「罪」と「不法な行い」を指します。
    reason: 指示語の指示対象を明確にするため。
lexical_decisions:
- source_word: ὅπου
  choice: ところでは
  rationale: 場所そのものというより、赦しが成立している場合・領域を示す。日本語では「ところでは」が原文の比喩的な場所表現を保ちつつ自然である。
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: ここでは弱い推論・移行を示す。文脈上の結論関係は日本語の文の流れで明らかなため、「しかし」「さて」などを加えて対比や時間性を強めない。
- source_word: ἄφεσις
  choice: 赦されている
  rationale: 名詞「赦し」をそのまま用いるより、「これらのことが赦されている」とした方が明快で自然であり、罪の赦免という意味を保つ。
- source_word: τούτων
  choice: これらのことが
  rationale: 指示語の曖昧さを本文に残し、直前の「罪」と「不法な行い」を指すことは脚注で説明する。
- source_word: οὐκέτι
  choice: もはや…ありません
  rationale: 赦しがある以上、罪のためのささげ物がそれ以上存在しないことを明確かつ自然に表す。
- source_word: προσφορὰ
  choice: ささげ物
  rationale: 一般的な祭儀用語としての広がりを保ち、「いけにえ」と狭く限定しない。
- source_word: περὶ ἁμαρτίας
  choice: 罪のための
  rationale: 祭儀的文脈に即しつつ、「罪祭」と専門的に限定せず、原文の簡潔な表現を保つ。
theological_decisions:
- issue: キリストの犠牲の最終性が含意するもの
  choice: 赦しが成立しているところでは、罪のためのささげ物はもはやないと訳す。
  alternative: あらゆる種類のささげ物が全面的に廃止されたと明示する／レビ記的祭儀だけに限定すると明示する。
  rationale: 直前の文脈は、繰り返される犠牲とキリストの一度限りの有効なささげ物を対比している。本文が述べる「罪のためのささげ物」の終結を保ち、それ以上の教理的限定や拡張は加えない。
translation_notes:
  register: 明快な現代標準日本語。「赦し」という抽象名詞の重なりを避け、動詞表現で自然にした。「ささげ物」はひらがな表記とし、一般読者にも読みやすく、かつ祭儀的な品位を保った。
