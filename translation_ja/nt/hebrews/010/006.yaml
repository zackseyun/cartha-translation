  text: ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ εὐδόκησας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: ja
  text: また、全焼のいけにえと罪のためのいけにえを、あなたは喜ばれなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全焼のいけにえと罪祭」とも訳せる。ギリシア語の「罪のための」は、祭儀の文脈では、罪のためにささげるいけにえを指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: 全焼のいけにえ
  rationale: ささげ物を火で完全に焼き尽くす祭儀上の種類を明示する、現代日本語で理解しやすい表現。
- source_word: καὶ
  choice: また……と
  rationale: 直前から続く列挙を受けつつ、二つのいけにえの種類を並列する接続として自然に表現した。
- source_word: περὶ ἁμαρτίας
  choice: 罪のためのいけにえ
  rationale: 祭儀的文脈で、罪に関してささげる供え物を指す慣用表現。単に「罪について」とせず、いけにえの種類であることを明確にした。
- source_word: οὐκ εὐδόκησας
  choice: あなたは喜ばれなかった
  rationale: 神への二人称の呼びかけと否定を保ち、εὐδοκέωの好意・満足を示す意味を、自然で敬意ある日本語にした。
theological_decisions:
- issue: 詩篇40篇の七十人訳を引用する文脈における祭儀用語
  choice: 「全焼のいけにえ」と「罪のためのいけにえ」という具体的な祭儀上の表現を用いる。
  alternative: 「焼き尽くすいけにえと罪祭」または一般化した「ささげ物」
  rationale: ヘブライ人への手紙の議論で対照される犠牲の種類を保持し、一般的な「ささげ物」へ薄めず、同時に特定の教派用語へ不必要に限定しない。
- issue: 神がいけにえを「喜ばれなかった」という表現の緊張
  choice: 原文どおり否定を明確に保つ。
  alternative: 「それだけでは満足されなかった」などの説明的限定を加える。
  rationale: 文脈から導かれ得る説明を節そのものへ持ち込まず、引用文が持つ神学的緊張をそのまま残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神への二人称には敬語を用いた。「いけにえ」は具体的な祭儀性を保ちながら一般読者にも通じる表記とした。
