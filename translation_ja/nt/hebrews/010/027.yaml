review_pass:
  verdict: revise
  source_fidelity: 「予感」は個人的・直感的な感覚を表しやすく、ἐκδοχή（待ち受けること、予期）にはやや狭すぎます。「予期」とすることで、目前に待ち受ける裁きという原文の意味をより直接に保てます。δέの対照、裁きと火の並列、μέλλοντοςの切迫性、および「敵対する者たち」は適切に反映されています。
  naturalness: 「裁きが来るとの予感」は現代日本語としては通じますが、厳粛な警告の文脈では「裁きへの恐ろしい予期」のほうが自然で、語義にも近い表現です。関係節内の読点は外し、並列する二項に「と」を添えると構造が明瞭になります。
  terminology: 「裁き」「敵対する者たち」「焼き尽くす」は適切です。「燃え盛る火」はπυρὸς ζῆλοςの激烈な火の描写を自然な日本語で伝えており、本文だけから特定の教義的結論を加えていません。
