  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: ja
  text: ただ、裁きへの恐ろしい予期と、敵対する者たちを焼き尽くそうとしている燃え盛る火とが残っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβερὰ
  choice: 恐ろしい
  rationale: ἐκδοχήを修飾する述語的形容詞の強い恐怖を、自然で明瞭な現代日本語で表す。
- source_word: δέ
  choice: ただ
  rationale: 前節の「もはや…残っていません」と対照をなし、代わりに残るものを示す逆接として訳す。
- source_word: τις
  choice: 明示的には訳出しない
  rationale: 不定性を日本語で直訳すると不自然になるため、文全体の未特定ながら現実的な予期に含ませる。
- source_word: ἐκδοχὴ κρίσεως
  choice: 裁きが来るとの予感
  rationale: ἐκδοχήの「待ち受けること・予期」とκρίσιςの司法的意味を保ちつつ、単なる主観的期待より不吉な切迫感を伝える。
- source_word: πυρὸς ζῆλος
  choice: 燃え盛る火
  rationale: ζῆλοςはここで激しく燃える熱情・猛威を表す。日本語で不自然な「火の熱情」を避け、火の激烈さを自然に表現する。
- source_word: ἐσθίειν
  choice: 焼き尽くす
  rationale: 火が対象を食い尽くす比喩を、日本語の火の文脈で自然かつ強く表す。
- source_word: μέλλοντος
  choice: …しようとしている
  rationale: これから起ころうとする切迫した事態を示し、単なる可能性には弱めない。
- source_word: τοὺς ὑπεναντίους
  choice: 敵対する者たち
  rationale: 神に対して反対の側に立つ者という関係的な意味を保ち、「敵」より原語の対立性を明示する。
theological_decisions:
- issue: 裁きの火の性質
  choice: 敵対する者たちを焼き尽くす火という鮮烈な裁きの描写をそのまま保つ。
  alternative: 永遠の刑罰であると明示する、または単なる比喩として弱める。
  rationale: 本文は厳しい神の裁きを描くが、その持続期間や体系的な性質まではこの節自体で規定していないため。
- issue: πυρὸς ζῆλοςにおける擬人的な熱情
  choice: 自然な日本語として「燃え盛る火」とする。
  alternative: 「火の激しい熱情」「火のねたみ」として擬人的・属格的構造を前面に出す。
  rationale: ζῆλοςの激烈さは保持しつつ、「ねたみ」という限定的な神学解釈を持ち込まず、文脈上の破壊的な火の猛威を明瞭にする。
translation_notes:
  register: 警告の厳粛さを保った、明瞭で現代的な標準日本語。前節から続けて読めるよう述語を補い、原文の圧縮された構文を自然な一文に整えた。
