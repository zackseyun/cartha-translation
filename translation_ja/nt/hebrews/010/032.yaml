id: HEB.10.32
reference: Hebrews 10:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: ja
  text: しかし、あなたがたが光に照らされた後、苦しみを伴う激しい戦いに耐え抜いた以前の日々を思い起こしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: 思い起こしなさい
  rationale: 現在命令形の呼びかけを、自然で明確な日本語の命令表現とした。文脈上、過去の経験を意識的に振り返る意味を表す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の警告から、読者の過去の忍耐を想起させる勧めへと転じる、穏やかな対照を示す。
- source_word: τὰς πρότερον ἡμέρας
  choice: あの以前の日々
  rationale: 過去の特定の時期を読者に想起させる表現として、指示的なニュアンスと時間的対比を保った。
- source_word: ἐν αἷς
  choice: （関係節として）…日々
  rationale: 字義的には「その日々に」であるが、日本語では後続の経験を「日々」にかかる連体修飾としてまとめることで、時間関係を自然に示した。
- source_word: φωτισθέντες
  choice: 光に照らされた
  rationale: 受動の比喩表現を保持し、回心、洗礼、信仰教育など特定の出来事に限定しないようにした。
- source_word: πολλὴν ἄθλησιν
  choice: 激しい戦い
  rationale: ἄθλησιςにある競技・格闘のイメージと、πολλήνが示す強度を、現代日本語で自然に表した。
- source_word: ὑπεμείνατε
  choice: 耐え抜いた
  rationale: 苦しみの中で持ちこたえたという完遂的な響きを簡潔に表す。
- source_word: παθημάτων
  choice: 苦しみの
  rationale: 属格が戦いの性質・領域を示すものとして、広い意味を保つ「苦しみ」を採用した。
theological_decisions:
- issue: 警告と勧告の文脈における φωτισθέντες の意味
  choice: 「光に照らされた」という比喩をそのまま保持する。
  alternative: 「回心した」「洗礼を受けた」「福音の光を受けた」
  rationale: 本文は霊的な照明を受けたことを示すが、それが具体的に回心、洗礼、信仰教育のいずれを指すかは明示しないため、特定の教派的理解に限定しない。
- issue: φωτισθέντες と ὑπεμείνατε の時間関係
  choice: 本文では「光に照らされた後」とし、照明が忍耐に先立つ読みを採用する。
  alternative: 「光に照らされたころ」として、時間的重なりを表す。
  rationale: アオリスト分詞は文脈上、主動詞に先立つ出来事として自然に理解できるが、時間関係を厳密に一義化できないため、別の可能性を脚注に残した。
translation_notes:
  register: 明確な現代標準日本語を用いながら、勧告としての厳粛さを保った。「光に照らされた」という神学的比喩と「戦い」の競技的イメージを残し、解釈を本文で狭めないようにした。
