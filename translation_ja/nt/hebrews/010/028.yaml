  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: ja
  text: モーセの律法を退けた者は、二人または三人の証人の証言に基づき、あわれみを受けることなく死にます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死刑に処されます」。ギリシア語は直訳すると「死にます」ですが、ここではモーセの律法における法的な処刑が文脈となっています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: 退けた
  rationale: 権威あるものを拒み、無効なものとして扱う意味を簡潔に表す。「違反した」よりも、律法の権威を拒む含みを保てる。
- source_word: τις
  choice: 者
  rationale: 不定代名詞の一般的・代表的用法を、条件節に近い自然な日本語で表す。
- source_word: νόμον Μωϋσέως
  choice: モーセの律法
  rationale: 属格関係を明瞭かつ慣用的に表す標準的な訳語。
- source_word: χωρὶς οἰκτιρμῶν
  choice: あわれみを受けることなく
  rationale: 複数形の οἰκτιρμῶν を日本語の抽象的表現で自然に訳し、司法的文脈における容赦のなさを示す。
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: 二人または三人の証人の証言に基づき
  rationale: ἐπί＋与格が判決の根拠を示すため、「証言」を補って法的意味を明瞭にした。
- source_word: ἀποθνῄσκει
  choice: 死にます
  rationale: 原文は明示的な使役・受動表現ではなく「死ぬ」と述べるため、その抑制を本文で保つ。司法的処刑の含みは注で示す。
theological_decisions:
- issue: ἀποθνῄσκει の司法的・処刑的意味を本文で明示するか
  choice: 本文では原文に近く「死にます」とする
  alternative: 「死刑にされます」または「殺されます」
  rationale: モーセ律法下の法的手続きと死刑を背景とするが、ギリシア語自体は単に「死ぬ」と述べている。本文では原文の表現上の抑制を保ち、文脈上の意味を脚注で説明する。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準語。「あわれみ」は聖書的文脈に自然でありつつ一般読者にも理解できる表現とした。法的根拠を示す句は「証言に基づき」として自然な日本語に整えた。
