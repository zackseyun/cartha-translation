  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: ja
  text: 「というのは、あとほんのわずかな時で[a]、来る方は来る。遅れることはない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「少し、どれほどどれほど」。ごく短い時を強調する反復的な言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: もう……すれば
  rationale: γάρは前節の忍耐への勧めを支える説明的な接続を担う。日本語では引用の流れを自然にするため独立した「というのは」を置かず、「もう」によってἔτιの時間的意味を表した。
- source_word: μικρὸν ὅσον ὅσον
  choice: ほんのしばらく
  rationale: 反復を伴う強調的な慣用句であり、残された時間がごく短いことを、現代日本語として自然に表す。逐語的な反復は脚注で示す。
- source_word: ὁ ἐρχόμενος
  choice: 来られる方
  rationale: 冠詞付き現在分詞の実体詞的用法を保ちつつ、文脈上のメシア的な含みを断定的な称号化によって過度に固定せず、敬意ある自然な日本語とした。
- source_word: ἥξει
  choice: 来られる
  rationale: 未来直説法の予告を表し、ὁ ἐρχόμενοςとの語根上の反復も日本語で「来られる方は来られる」と保持した。
- source_word: οὐ χρονίσει
  choice: 遅れることはない
  rationale: 到来が引き延ばされないことを明瞭な現代日本語で表し、古風な「遅滞する」は避けた。
theological_decisions:
- issue: ὁ ἐρχόμενοςをメシア的称号として明示するか、一般的な分詞句として訳すか
  choice: 「来られる方」と訳し、指示対象への敬意と文脈上のメシア的含意を保つ
  alternative: 「来る者」または称号的に「来たるべき方」
  rationale: 冠詞付き分詞は「来る者」を意味し、この引用がキリスト論的文脈に置かれているため称号的な響きを持ち得る。しかしギリシア語自体の分詞的表現を超えて称号性を断定しないよう、「来られる方」とした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。聖句引用として簡潔な二文にし、原文の「来る」の反復と、到来が遅れないという強調を保持した。
