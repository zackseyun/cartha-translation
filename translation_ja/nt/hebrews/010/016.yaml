source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: ja
  text: 「その日々の後に、わたしが彼らと結ぶ契約はこれである」と主は言われる。「わたしの律法を彼らの心に置き、彼らの思いにもそれを書き記す。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: 契約
  rationale: エレミヤ書の新しい契約を引用する文脈を保ち、現代日本語で明確な「契約」とした。
- source_word: διαθήσομαι πρὸς αὐτούς
  choice: わたしが彼らと結ぶ
  rationale: 契約を締結するという文脈で自然な日本語とし、πρὸς αὐτούςの相手関係を「彼らと」で表した。
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: あの日々の後
  rationale: 時間表現を補足せず、原文の指示性を保った。
- source_word: κύριος
  choice: 主
  rationale: 引用文中のκύριοςを、簡潔で格調ある標準的な訳語で表した。
- source_word: διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν
  choice: わたしの律法を彼らの心に置き
  rationale: δίδωμιの「置く」という文脈的意味と、心を受け入れの場として示す比喩を自然な日本語で保った。νόμουςは文法上複数だが、日本語の「律法」は集合的に複数の規定を表せるため単数形で表現した。
- source_word: ἐπὶ τὴν διάνοιαν αὐτῶν
  choice: 彼らの思いにも
  rationale: διάνοιαを知性だけに狭めず、思考・理解の内面を広く示す「思い」とした。二つ目のἐπίは「にも」で対応関係を示した。
- source_word: ἐπιγράψω αὐτούς
  choice: それを書き記す
  rationale: 書きつける・刻み記すという含意を「書き記す」で表し、αὐτούςが先行する律法を指すことを「それ」で明確にした。
theological_decisions:
- issue: エレミヤ書引用における分詞と定動詞の関係
  choice: 「心に置き、…思いにもそれを書き記す」と連続する約束として訳した
  alternative: 「心に置くことによって、…書き記す」のように分詞を明示的な従属表現にする
  rationale: ギリシア語ではδιδοὺςが分詞、ἐπιγράψωが定動詞であるが、日本語で機械的に従属させると契約の内容が不自然になる。二つの動作の密接な関係を保ちつつ、両者を別々の神の約束として読み得る自然な連用形にした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用としての荘重さを保った。「あの日々」「心」「思い」という原文の比喩と指示表現は説明的に言い換えず残した。
