id: HEB.10.30
reference: Hebrews 10:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: ja
  text: 私たちは、こう言われた方を知っているからです。「復讐はわたしのものだ。わたしが報いる。」また、こうもあります。[a]「主はご自分の民を裁かれる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: これら二つの引用は申命記32章35～36節を踏まえています。元の文脈で「裁く」は、処罰だけでなく擁護を含むことがありますが、ここでは警告の文脈が神の審判を強調しています。
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: 私たちは…知っています
  rationale: οἶδαの現在的な意味を自然な現代日本語で表し、γάρの説明関係は前後の流れの中で伝わるようにした。
- source_word: τὸν εἰπόντα
  choice: こう言われた方
  rationale: 引用を語った神への人格的な言及と敬意を保ちつつ、日本語として自然にした。
- source_word: Ἐμοὶ ἐκδίκησις
  choice: 復讐はわたしのもの
  rationale: 『わたしに復讐が属する』という省略的なギリシア語の所有の力を、簡潔で荘重な日本語にした。
- source_word: ἐγὼ ἀνταποδώσω
  choice: わたしが報いる
  rationale: 報復・応報を意味する未来形を保ち、単なる恩返しと誤解されにくい文脈の中で簡潔に訳した。
- source_word: καὶ πάλιν
  choice: また、こうもあります
  rationale: 第二の引用を導入する機能を自然な日本語で明示した。
- source_word: Κρινεῖ κύριος
  choice: 主は…裁かれる
  rationale: κρίνωの司法的な意味を保ち、κύριοςは神を指す称号として『主』とした。
- source_word: τὸν λαὸν αὐτοῦ
  choice: ご自分の民を
  rationale: 所有代名詞の指示と契約共同体の含意を、自然で敬意ある日本語で表した。
theological_decisions:
- issue: 申命記引用におけるκρίνωの意味範囲
  choice: 裁かれる
  alternative: 正しい者として認められる／擁護される
  rationale: 原引用では処罰だけでなく民の擁護を含み得るが、ヘブライ人への手紙10章の警告文脈では神の審判が前面に出る。『裁く』は意味範囲を不必要に狭めず、その緊張を保つ。
- issue: ἐκδίκησιςとἀνταποδώσωの応報表現
  choice: 「復讐はわたしのもの。わたしが報いる」
  alternative: 「報復はわたしに属する。わたしが返報する」
  rationale: 神の正当な応報という厳粛さを保ちつつ、普通の読者に明瞭な現代日本語とした。
translation_notes:
  register: 明瞭な現代標準語を用い、聖書引用としての簡潔さと荘重さを保った。「言われた方」「ご自分」「裁かれる」によって神への敬意を示した。脚注記号[a]は第二引用の直前に置き、二つの引用と申命記との関係を注記した。
