source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: ja
  text: 自分たちの集まりをないがしろにしてはなりません[a]。ある人たちにはそれが習慣になっていますが、むしろ互いに励まし合いなさい。その日[b]が近づいているのを見ているなら、なおさら互いに励まし合いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの集まりを見捨ててはなりません」「自分たちの集まりを放棄してはなりません」。
    reason: lexical_alternative
  - marker: b
    text: 「その日」は、主が来られる日、または最後の裁きの日を指すと考えられます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: やめてはなりません
  rationale: 共同の集まりを怠る、または見捨てるという幅を持つ語。本文では、完全な離反に限定せず、集まることを継続しなくなる行為を自然な現代日本語で表した。より強い意味の可能性は脚注に残した。
- source_word: τὴν ἐπισυναγωγὴν ἑαυτῶν
  choice: 自分たちが共に集まること
  rationale: 信者たち自身の共同の集まりを指す。「礼拝」や制度的な「教会」に限定せず、ἐπισυναγωγήの集合の意味とἑαυτῶνの共同体的な指示を保った。
- source_word: καθὼς ἔθος τισίν
  choice: ある人たちの習慣にならってはならず
  rationale: ἔθοςの「習慣」を明示し、分詞句が前の禁止に従属する勧告の流れを自然に表した。
- source_word: παρακαλοῦντες
  choice: 互いに励まし合いましょう
  rationale: この文脈では、忍耐を支える勧め・励ましの意味が中心。目的語は明示されないが、共同体の文脈から相互性を自然に補った。
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: その日が近づいているのを見ているのですから、ますますそうしよう
  rationale: 日が近づくのを認識する程度に応じて勧めが強まる相関的な比較表現を、明瞭な日本語にした。
- source_word: βλέπετε
  choice: 見ている
  rationale: 知覚の内容を兆候などに限定せず、原語の一般的な「見る、認める」を保った。
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: その日が近づいている
  rationale: 終末的な特定の日を示唆しつつ、原文にない「主の日」「裁きの日」を本文へ補わなかった。日本語では大文字による区別ができないため、脚注で指示内容を説明した。
theological_decisions:
- issue: 「その日」の終末論的指示
  choice: 本文では「その日」とし、脚注で主の来臨または最後の裁きの日を指す可能性が高いと説明する。
  alternative: 「主の日」または「裁きの日」と明示する。
  rationale: 文脈上は終末的な日が強く示唆されるが、ギリシア語本文は単に定冠詞付きの「日」としており、特定の名称を付加しないことで解釈の幅を保った。
- issue: παρακαλοῦντεςの相互的対象
  choice: 「互いに」を補い、「励まし合う」とする。
  alternative: 対象を明示せず「励ましましょう」とする。
  rationale: 集まりについて語る共同体的文脈から相互性が強く含意され、日本語では「励まし合う」がその談話的意味を自然に表す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。文脈上続いている勧告を独立節として読みやすく整えつつ、「礼拝を休む」のような狭い制度的表現を避けた。脚注記号[a][b]は該当語句の直後に配置した。
