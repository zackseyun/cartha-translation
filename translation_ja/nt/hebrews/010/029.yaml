id: HEB.10.29
reference: Hebrews 10:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: ja
  text: まして、神の御子を踏みつけ、その血によって聖別された契約の血をありふれたものと見なし[a][b]、恵みの御霊を侮辱した者は、どれほど重い刑罰に値するとあなたがたは思いますか。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ありふれたもの」は、「汚れたもの」または「俗なもの」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「その血によって聖別された」は、ギリシア語の統語上、この節で述べられている者を指すのが自然である。ただし、指示対象については別の解釈もある。ここでは神学上の議論を訳文で決着させず、原文のつながりを保っている。
    reason: alternative_reading
  - marker: c
    text: 「侮辱した」は、「不遜にも辱めた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: どれほど重い
  rationale: 比較級を伴う修辞疑問として、日本語で自然な「どれほど重い刑罰」とした。「さらに悪い」より刑罰の程度が明瞭である。
- source_word: ἀξιωθήσεται τιμωρίας
  choice: 刑罰を受けるに値する
  rationale: 受動形の「…にふさわしいと判断される」という司法的な意味を、明瞭な現代日本語で保った。
- source_word: καταπατήσας
  choice: 踏みつけ
  rationale: 単なる「軽蔑」へ抽象化せず、原文の強烈な比喩を保持した。
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: 神の御子
  rationale: キリスト論的称号を、現代日本語の聖書文体として自然かつ尊厳ある形で表した。
- source_word: τὸ αἷμα τῆς διαθήκης
  choice: 契約の血
  rationale: 契約と犠牲の響きを持つ原文の定型的表現を簡潔に保持した。
- source_word: κοινὸν
  choice: ありふれたもの
  rationale: 聖別されたものとの対照にある「普通の、聖別されていない」という基本義を読みやすく表した。「汚れた」「俗な」も文脈上可能なので脚注に示した。
- source_word: ἡγησάμενος
  choice: …と見なし
  rationale: 意識的な評価・判断を表す語として自然な日本語を選んだ。
- source_word: ἐν ᾧ
  choice: …によって
  rationale: ここでは契約の血を聖別の手段とする道具的用法が自然であり、日本語では関係節に組み込んだ。
- source_word: ἡγιάσθη
  choice: 自分を聖なるものとした
  rationale: 受動形と、文法上最も近い単数の行為者との結び付きを自然な日本語で示した。「聖別された」より一般読者に明瞭である。
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: 恵みの御霊
  rationale: 属格を保ちつつ、神の霊を指す尊厳ある伝統的かつ理解可能な表現とした。
- source_word: ἐνυβρίσας
  choice: 侮辱した
  rationale: 横柄で不敬な扱いを表す強い動詞を、過度に説明的にせず明確に訳した。
theological_decisions:
- issue: 「聖なるものとされた」（ἐν ᾧ ἡγιάσθη）の指示対象
  choice: 本文では、統語上もっとも自然に、背反行為をする単数の人物を指す形で「自分を聖なるものとした」と訳した。
  alternative: キリスト、契約共同体、または血そのものに関連づける解釈も提示される。
  rationale: 分詞句の主体と受動動詞の単数形との自然なつながりを反映する一方、この節から背教や救いの教理を一義的に確定せず、解釈上の論争を脚注で明示した。
- issue: κοινόν の祭儀的含意
  choice: 「ありふれたもの」として、聖なるものとの対照を前面に出した。
  alternative: 「汚れたもの」「俗なもの」
  rationale: 原語は文脈により「汚れた」を含意し得るが、基本的な「共通の、普通の」を保つことで、聖別された契約の血を普通扱いする冒瀆の力を読者に委ねた。
translation_notes:
  register: 明瞭で尊厳ある現代標準日本語。「まして」で直前の軽い刑罰との論証の連続性を示し、長い三つの分詞句を日本語の並列として保った。御子・御霊は聖書的な称号として「御」を用いた。すべての脚注記号を対応箇所に配置した。
