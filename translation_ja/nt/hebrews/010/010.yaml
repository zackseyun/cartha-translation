source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: ja
  text: そのみこころにより[a]、私たちは、メシアであるイエス[b]のからだの献げ物を通して、ただ一度限り、聖なるものとされているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「そのみこころのうちに」。文脈上、直前に述べられた神のみこころによって聖なるものとされる、という意味です。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエス・キリスト」。ギリシア語の「クリストス」は「メシア」という称号を意味します。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: このみこころによって
  rationale: 直前に述べられた神のみこころを指す関係表現として受け取り、ἐν の手段的な意味を自然な日本語で表した。字義的な「そのみこころのうちに」は脚注に残した。
- source_word: ἡγιασμένοι ἐσμὲν
  choice: 聖なる者とされています
  rationale: 完了分詞と現在形のコピュラによる迂言的完了であり、すでになされた行為と現在まで続く結果の両方を表す。「聖別されています」より一般読者に分かりやすくしつつ、受動の意味を保持した。
- source_word: διὰ τῆς προσφορᾶς
  choice: 献げられたことを通して
  rationale: διά＋属格の手段を「通して」で表し、προσφορά の献げ物・奉献の意味を、後続する「からだ」と自然につながる動詞的表現にした。
- source_word: τοῦ σώματος
  choice: からだ
  rationale: 具体的な身体の奉献を示す語として、現代日本語で柔らかく明瞭な「からだ」を用いた。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστός の称号としての意味を明示し、日本語として自然な形にした。伝統的な音写「イエス・キリスト」は脚注に示した。
- source_word: ἐφάπαξ
  choice: ただ一度限り
  rationale: 一回性だけでなく、決定的で反復されない意味合いを簡潔に保持した。
theological_decisions:
- issue: 聖化の時制・相
  choice: 「聖なる者とされています」とし、完了した行為と継続する結果をともに表す
  alternative: 「聖なる者とされました」または「聖なる者とされつつあります」
  rationale: ギリシア語は迂言的完了であり、単なる過去にも進行中の過程だけにも限定しない。特定の教派的体系に寄せず、文法上の緊張を保った。
- issue: Χριστός の称号性
  choice: 「メシアであるイエス」
  alternative: 「イエス・キリスト」
  rationale: ここではΧριστόςを称号として意味が見える形で訳した。一方、日本語で定着した音写も正当な訳し方なので脚注に残した。
- issue: からだの奉献における行為主体
  choice: 「からだが…献げられた」と受動形で表す
  alternative: 「イエスがご自分のからだを…献げた」
  rationale: 原文は「イエス・メシアのからだの奉献」という名詞句であり、行為主体を文法上明示しない。能動形で主体を補わず、原文の表現範囲を保った。
translation_notes:
  register: 明瞭で現代的ながら礼拝・朗読にも適する格調を保った。「みこころ」「献げる」は聖書文体として定着しつつ一般にも理解可能な語である。「聖なる者とされています」により、専門語「聖別」のみへ依存せず原文の完了的結果を表した。
