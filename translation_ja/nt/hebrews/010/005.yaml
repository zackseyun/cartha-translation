source:
  edition: SBLGNT
  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: ja
  text: 'ですから[a]、キリストはこの世に来られるとき、こう言います。


    「あなたは、いけにえとささげ物を望まず、


    しかし、わたしのために体を備えてくださいました。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでヘブライ人への手紙は、詩編40:6のギリシア語訳に従って「わたしのために体を備えてくださいました」と引用しています。詩編40:6のヘブライ語本文は「わたしの耳を開いてくださいました」となっています。
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の議論からの帰結を示す推論的な接続を、自然な現代日本語で表す。
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: 世に入るとき
  rationale: 現在分詞の同時的・状況的な働きを保ちつつ、時制を不必要に過去へ限定しない自然な表現。
- source_word: λέγει
  choice: こう言われます
  rationale: 聖書引用を導入する現在形を維持する。主語は文脈上キリストであり、補って明示した。敬語はキリストへの自然で品位ある日本語表現として用いる。
- source_word: Θυσίαν καὶ προσφορὰν
  choice: いけにえやささげ物
  rationale: 二つの祭儀用語を区別して保ち、一般読者にも理解しやすい語を選ぶ。καί は並列される二項を日本語で自然にまとめる「や」とした。
- source_word: οὐκ ἠθέλησας
  choice: 望まず
  rationale: θέλω の意志・願望の意味を簡潔に表し、祭儀的文脈にも適する。
- source_word: σῶμα
  choice: 体
  rationale: ヘブライ語詩編本文に合わせず、ヘブライ人への手紙のギリシア語 σῶμα をそのまま訳す。
- source_word: δὲ
  choice: かえって
  rationale: 望まれなかったいけにえと、備えられた体との対照を明瞭に示す。
- source_word: κατηρτίσω μοι
  choice: わたしのために体を備えてくださいました
  rationale: καταρτίζω の「備える」を採り、μοι の受益的な意味を「わたしのために」で明示する。
theological_decisions:
- issue: ヘブライ人への手紙の引用文と、詩編40:6のヘブライ語本文との相違
  choice: ヘブライ人への手紙のギリシア語本文に従い、「わたしのために体を備えてくださいました」と訳す。
  alternative: 詩編40:6のヘブライ語本文に基づく「わたしの耳を開いてくださいました」。
  rationale: 翻訳対象であるヘブライ人への手紙10:5には明確に σῶμα（体）とあり、詩編のヘブライ語本文へ調和させない。重要な本文上・引用上の緊張は脚注に残す。
- issue: εἰσερχόμενος と λέγει の時間的表現
  choice: 「世に入るとき、こう言われます」と現在的な引用提示を保つ。
  alternative: 「世に来られたとき、こう言われました」と過去の出来事として訳す。
  rationale: ギリシア語の現在分詞と現在形を尊重し、受肉の時点という解釈を認めつつも、原文以上に時制を過去へ固定しない。
translation_notes:
  register: 明瞭で品位ある現代標準語。引用は詩的な改行を用いた。「犠牲」より祭儀的で聖書文脈になじむ「いけにえ」を採用し、「供え物」より広く自然な「ささげ物」とした。
