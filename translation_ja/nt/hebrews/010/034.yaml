reference: Hebrews 10:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: ja
  text: 実際、あなたがたは投獄されている人たちと苦しみを共にし[a]、また、自分たちには、よりすぐれた、いつまでも残る財産がある[b]と知っていたので、あなたがたの持ち物が略奪されることをも、喜んで受け入れました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「投獄されている人たちに同情し」。このギリシア語は同情を示すことも意味しますが、ここでは彼らの苦しみに連帯してあずかることを含むと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「自分たちには、天に、よりすぐれた、いつまでも残る財産がある」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: 囚人たち
  rationale: 鎖につながれた者、投獄された者を指す。文脈上、信仰のために捕らえられた人々だが、原文が明示する範囲を越えて限定しない。
- source_word: συνεπαθήσατε
  choice: 苦しみを共にし
  rationale: 単に同情を感じたというだけでなく、投獄された人々との連帯によって苦難にあずかった含みを表す。同時に、語が「同情した」とも訳し得ることは脚注に残す。
- source_word: ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν
  choice: 持ち物が略奪されること
  rationale: ἁρπαγήが表す、強引で不当な奪取を「略奪」で保ち、所有物を意味する実詞的なὑπαρχόντωνを日常的な「持ち物」とした。
- source_word: μετὰ χαρᾶς προσεδέξασθε
  choice: 喜んで受け入れました
  rationale: 損失そのものを是認したという意味ではなく、それを避けられない苦難として進んで耐えたことを、自然な現代日本語で表す。
- source_word: γινώσκοντες
  choice: 知っていたので
  rationale: 分詞の因果的な含みを明確にし、喜んで受け入れた理由を自然な日本語で示す。
- source_word: ἑαυτοὺς ἔχειν
  choice: 自分たちには…ある
  rationale: 再帰代名詞の強調を「自分たちには」で保つ。所有を日本語として自然な存在構文で表した。
- source_word: κρείττονα
  choice: さらにまさった
  rationale: ヘブライ人への手紙で反復される比較表現を、明瞭で格調を保つ語にした。
- source_word: ὕπαρξιν
  choice: 財産
  rationale: 所有物・財産を意味し、地上の「持ち物」と対照される、より良い所有を表す。「受け継ぐもの」など、原文以上に意味を限定する表現は避けた。
- source_word: μένουσαν
  choice: いつまでも残る
  rationale: μένωの存続・永続の意味を、普通の読者に明瞭な表現で伝える。
theological_decisions:
- issue: 投獄された人々との連帯の意味
  choice: 「囚人たちと苦しみを共にし」とし、行動を伴う連帯を前面に出した。
  alternative: 「囚人たちに同情し」
  rationale: συμπαθέωは同情も表し得るが、ここでは迫害の文脈と共同を示す接頭辞συν-により、苦難への参与が含まれると判断した。ただし別訳を脚注に示し、語義の幅を残した。
- issue: 「さらにまさった、いつまでも残る財産」の性質
  choice: 天、救い、報い、相続財産などに特定せず、原文どおり一般的な表現にした。
  alternative: 「天にある、さらにまさった、いつまでも残る財産」または「さらにまさった永遠の相続財産」
  rationale: 採用本文は場所や具体的内容を明示しない。異読には「天に」を含む形があるため、それは脚注で知らせ、本文には持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「さらにまさった」「いつまでも残る」で書簡の格調と対比を保った。「略奪」は行為の不当さと強制性を弱めないために採用した。脚注記号は、それぞれが説明する語句の直後に配置した。
