id: HEB.10.11
reference: Hebrews 10:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: ja
  text: 祭司は皆、日ごとに立って祭司の務めを行い、同じいけにえを何度も献げる。そのようないけにえは、決して罪を取り除く[a]ことができない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「罪を取り去る」。
    reason: περιαιρέω は、罪を除去することを「取り除く」「取り去る」のいずれでも表せるため。
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: 祭司は皆
  rationale: 単数名詞を伴う πᾶς の配分的な意味を自然な日本語で表し、レビ族の祭司一人一人を指す。ἀρχιερεύς ではないため「大祭司」とはしない。
- source_word: ἕστηκεν
  choice: 立って
  rationale: 完了形が示す立った状態を簡潔に表し、次節でキリストが座ることとの対照を保つ。
- source_word: καθ’ ἡμέραν
  choice: 日ごとに
  rationale: 毎日繰り返される継続的な奉仕を、簡潔で格調を保った現代日本語で表す。
- source_word: λειτουργῶν
  choice: 祭司の務めを行い
  rationale: 一般的な奉仕ではなく祭儀的・祭司的な務めであることを明確にしつつ、専門用語に偏らない表現とした。
- source_word: τὰς αὐτὰς ... θυσίας
  choice: 同じいけにえ
  rationale: 同一の種類の犠牲が繰り返し献げられるという強調を直接表す。
- source_word: πολλάκις
  choice: 何度も
  rationale: 反復を自然かつ明瞭に表し、祭儀が繰り返されるという論旨を保つ。
- source_word: προσφέρων
  choice: 献げます
  rationale: 犠牲を供える文脈での προσφέρω の標準的な意味を表す。
- source_word: αἵτινες
  choice: しかし、そのようないけにえは
  rationale: 先行するいけにえを受け、その性質を説明する関係代名詞の含みを「そのような」で保つ。「しかし」は、反復される奉仕と無力さとの論理的対照を自然な日本語で示す。
- source_word: οὐδέποτε δύνανται
  choice: 決して……ことができません
  rationale: いかなる時にも不可能であるという絶対的な否定を弱めずに表す。
- source_word: περιελεῖν ἁμαρτίας
  choice: 罪を取り除く
  rationale: 罪を除去するという περιαιρέω の意味を、現代日本語で明瞭かつ直接的に表す。
theological_decisions:
- issue: 祭司が立っている姿勢と次節との対照
  choice: 「立って」と訳し、継続する祭司の務めと、次節で座るキリストとの文学的・神学的対照を保った。
  alternative: 「立っています」または「立ち続け」として姿勢や継続性をさらに明示する。
  rationale: 原文の姿勢をそのまま訳すことで対照は十分伝わるため、次節の内容を先取りする説明は加えない。
- issue: いけにえが罪を除くことのできない範囲
  choice: 「決して罪を取り除くことができません」とし、原文の絶対的な不能を保った。
  alternative: 「罪を完全に処理することはできません」のように限定を補う。
  rationale: οὐδέποτε δύνανται は強い絶対表現であり、本文にない「完全に」などを補って主張を弱めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、礼拝文としての品位を保った。「いけにえ」は一般読者に理解しやすい表記とし、「祭司の務め」で λειτουργέω の祭儀的含意を明示した。
