    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: 心を配りましょう
  rationale: 現在接続法一人称複数の勧奨的用法を「～ましょう」で表した。単に考えるだけでなく、互いを注意深く見つめ、よく考慮する意味を自然な現代日本語で示す。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 共同体の成員が相互に注意を向けるという再帰的・相互的関係を簡潔に表す。
- source_word: εἰς
  choice: ために
  rationale: 後続する名詞句が目的ないし目指す結果を表すことを、日本語で明確かつ自然に示す。
- source_word: παροξυσμὸν
  choice: 奮い立たせる
  rationale: 強い刺激、促し、駆り立てを意味する名詞を、日本語では動詞化して自然に表現した。対象が「愛と良い行い」であるため肯定的な文脈に合う一方、「励ます」よりも強い働きかけを保つ。
- source_word: ἀγάπης
  choice: 愛
  rationale: ἀγάπηの標準的で明瞭な訳語。
- source_word: καλῶν ἔργων
  choice: 良い行い
  rationale: 形容詞と名詞の意味を率直に保ちつつ、現代日本語として自然にした。特定の功徳思想を訳文に持ち込まない。
- source_word: καὶ
  choice: また／と
  rationale: 冒頭のκαίは前節から続く勧告を「また」で結び、句中のκαίは「愛」と「良い行い」を「と」で並列した。
theological_decisions:
- issue: παροξυσμόςの強く、ときに否定的な含意
  choice: 本文では「奮い立たせる」と訳す
  alternative: 「駆り立てる」または「刺激する」
  rationale: この語は強い刺激や挑発をも表し得るが、ここで目指されるものは愛と良い行いである。本文では肯定的な方向性と語の強さを両立させ、より鋭い語感は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。勧奨の力を「～ましょう」で示し、原文の目的構文は「ために」で保持した。
