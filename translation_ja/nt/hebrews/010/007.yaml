  source_fidelity: 全体として原文の構文と意味をよく反映している。「ἥκω」の到来の完了的含意、「γέγραπται」の継続する書記内容、神への呼格も適切である。ただし「ἐν κεφαλίδι βιβλίου」は「書の巻物に」よりも「書物の巻物に」とする方が、属格関係をより明確に保ち、日本語としても意味を取りやすい。
  naturalness: 「ご覧ください」は現代日本語として可能だが、この短い詩編引用の強調語Ἰδοὺには「見てください」のほうが自然で、かつ直接的な注意喚起を保てる。「みこころ」は敬虔な聖書的語法として通じるが、明瞭な現代標準日本語という対象では「御心」と漢字表記にすることで読みやすい。
  terminology: 「神よ」「御心」「行う」はこの文脈で適切である。話者をキリスト等と本文で特定していない点も、原文と文脈の区別を尊重している。巻物の注は有益だが、「紙など」に限定せず、古代の書写媒体一般に対応する表現がより安全である。
