source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: ja
  text: 'その時、私は言った。


    「見てください。私は来ました。


    書物の巻物[a]に、私について書かれています。


    神よ、あなたの御心を行うために。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「巻物」は、書写材料を巻いた古代の書物の形であり、現代のように綴じられた本ではない。
    reason: κεφαλίςが指す古代の巻物の形態を明確にしつつ、特定の素材に限定しないため。
lexical_decisions:
- source_word: τότε εἶπον
  choice: その時、私は言った
  rationale: 引用内の応答を導く時間表現と発話動詞を、簡潔で自然な現代日本語にした。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 注意を促す強い指示的な働きと、神への語りかけにふさわしい厳粛さを保った。「見よ」より現代的である。
- source_word: ἥκω
  choice: 私は来ました
  rationale: 到着して今ここにいるという現在的な含みを持つ語であり、日本語では完了した到来として自然に表した。
- source_word: ἐν κεφαλίδι βιβλίου
  choice: 書の巻物に
  rationale: κεφαλίς がこの慣用句で古代の巻物を指すことを示し、現代の冊子本と誤解されないようにした。
- source_word: γέγραπται περὶ ἐμοῦ
  choice: 私について書かれています
  rationale: 完了受動の、書かれた内容が今も有効に存在する含みを「書かれています」で表した。
- source_word: τοῦ ποιῆσαι
  choice: 行うために
  rationale: 話者が来た目的を示す不定詞として訳し、ποιέω の直接的な意味を保った。
- source_word: ὁ θεός
  choice: 神よ
  rationale: 形は主格だが呼びかけとして用いられているため、日本語でも明示的な呼格表現にした。
- source_word: τὸ θέλημά σου
  choice: あなたのみこころ
  rationale: 神の意志・望みを指す重要語を、神への直接の語りかけとして自然で広く理解される表現にした。
theological_decisions:
- issue: 詩編引用の一人称話者をヘブライ書がメシアに適用していること
  choice: 本文では一人称の発言をそのまま訳し、話者を明示的に「メシア」や「キリスト」と補わない。
  alternative: 本文中で話者をメシアまたはキリストと明示する。
  rationale: 文脈はこの言葉を御子に適用するが、この節そのものは一人称の宣言である。キリスト論的適用は周囲の文脈に委ね、本文に解釈を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用と神への呼びかけにふさわしい厳粛さを保った。詩的な行分けによって引用の構造を見やすくした。
