id: HEB.10.35
reference: Hebrews 10:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: ja
  text: ですから、あなたがたの確信[a]を投げ捨ててはいけません。その確信には、大きな報いがあるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大胆さ」。ギリシア語は、特に神に近づく際の、確信に満ちた自由や率直さを表すことがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: 投げ捨ててはいけません
  rationale: μήを伴うアオリスト接続法の禁止を表す。ἀποβάλλωの、単に失うのではなく意図的に放棄するという強い意味を、自然な日本語で保った。
- source_word: οὖν
  choice: ですから
  rationale: 直前の勧告と模範を受けた推論上のつながりを、明瞭で現代的な日本語で示す。
- source_word: τὴν παρρησίαν ὑμῶν
  choice: あなたがたの確信
  rationale: παρρησίαは、神に近づく際の自由で大胆な確信や、公然と信仰を保つ姿勢を含み得る。本文では自然さを優先して「確信」とし、その幅を脚注で示した。
- source_word: ἥτις ἔχει
  choice: その確信には、…がある
  rationale: 関係節が先行するπαρρησίαの性質を説明する構造を明確に表し、ἔχειを過度に因果的な「もたらす」とせず「ある」とした。
- source_word: μεγάλην μισθαποδοσίαν
  choice: 大きな報い
  rationale: μεγάληνの評価的な強さと、μισθαποδοσίαの肯定的な報償の意味を、簡潔で自然かつ品位ある日本語で表した。
theological_decisions:
- issue: ヘブライ人への手紙10章35節におけるπαρρησίαの意味
  choice: 本文では「確信」とし、神の前での大胆さや、信仰を公然と堅持する姿勢も含み得ることを脚注で示す。
  alternative: 「大胆さ」「大胆な確信」
  rationale: この語はヘブライ人への手紙で、神に近づく確信に満ちた自由と、信仰を堅く保つ率直さの双方を帯びる。単一の訳語で意味を狭めず、本文の自然さと脚注による意味範囲の保存を両立させた。
- issue: 報いと確信との関係
  choice: 「その確信には、大きな報いがある」と、原文のἔχειを直接的に表す。
  alternative: 「その確信は大きな報いをもたらす」
  rationale: 「もたらす」は因果関係を明示しすぎる可能性があるため、原文の表現が持つ神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「ですから」「投げ捨ててはいけません」によって論理的つながりと勧告の強さを保った。「報い」は聖書的な品位を保ちながら一般読者にも理解しやすい。
