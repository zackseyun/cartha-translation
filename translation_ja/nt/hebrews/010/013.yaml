  text: τὸ λοιπὸν ἐκδεχόμενος ἕως τεθῶσιν οἱ ἐχθροὶ αὐτοῦ ὑποπόδιον τῶν ποδῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: ja
  text: その後は、敵たちがご自分の足台[b]とされるまで、待っておられます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「待ち望んでおられます」。ギリシア語の分詞には、期待しながら待つ意味を含めることができます。
    reason: lexical_alternative
  - marker: b
    text: この表現は詩篇110篇1節を踏まえています。「わたしの右に座っていなさい。わたしがあなたの敵をあなたの足台とするまで。」
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: その後は
  rationale: 直前に述べられた着座以後の時を指す副詞的表現として、現代日本語で自然かつ明確に訳した。
- source_word: ἐκδεχόμενος
  choice: 待っておられます
  rationale: 継続して待つ姿を表す分詞。文脈上の期待を含み得るが、確実性や心理状態を過度に明示せず、敬意ある自然な表現とした。
- source_word: ἕως
  choice: まで
  rationale: 待つことの時間的な終点を示す標準的な表現。
- source_word: τεθῶσιν
  choice: とされる
  rationale: τίθημιのアオリスト受動接続法を受動表現で保持し、敵を足台とする行為者を本文が明示しない点も保った。
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: 敵たちが
  rationale: 定冠詞付き複数名詞と所有代名詞を簡潔に反映した。日本語では「ご自分の」によってキリストとの所有関係を自然に示す。
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: ご自分の足台
  rationale: 「足の足台」という不自然な重複を避けつつ、詩篇110篇1節の具体的な足台の比喩を保持した。
theological_decisions:
- issue: 詩篇110篇1節に由来するメシアの即位の比喩
  choice: 敵たちが「ご自分の足台とされる」という具体的な像を保持する。
  alternative: 敵たちが打ち負かされる／足の下に置かれる
  rationale: 単なる敗北や服従へ説明的に言い換えず、ヘブライ人への手紙が意図的に用いる詩篇の即位表象とその神学的含意を残した。
- issue: 敵を足台とする行為者
  choice: 受動態のまま「とされる」と訳す。
  alternative: 神が敵たちをご自分の足台とする
  rationale: 文脈と詩篇の引用は行為者を示唆するが、この節のギリシア語本文自体は受動態で行為者を明示しないため、補わなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、キリストへの敬意を「ご自分」「おられます」で自然に示した。前後の文脈から続く一文であることを踏まえつつ、この節単独でも理解できる形にした。脚注記号は対応する語句の後に[a][b]の順で置いた。
