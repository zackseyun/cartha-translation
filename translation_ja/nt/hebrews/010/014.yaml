  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: ja
  text: 一つのささげ物によって、聖なる者とされつつある人々[a]を、永久に完全な者としたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖別されつつある人々」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: 一つの
  rationale: προσφορᾷを修飾する数詞であり、ささげ物の唯一性を明確に示す。
- source_word: γὰρ
  choice: からです
  rationale: 前節までの論述に根拠を与える説明的な接続を、自然な日本語の文末表現で示す。
- source_word: προσφορᾷ
  choice: ささげ物
  rationale: 神に差し出す供え物を表す語の広がりを保ちつつ、ヘブライ人への手紙のいけにえの文脈にも適合する。「いけにえ」より解釈を限定しない。
- source_word: τετελείωκεν
  choice: 完全な者とされた
  rationale: 完了した行為と、その結果が現在まで存続していることを表す完了形の力を、文脈上の主語に対する敬語を用いて表現する。
- source_word: εἰς τὸ διηνεκές
  choice: 永遠に
  rationale: 一つのささげ物による完成の効力が恒久的であることを、簡潔で自然な現代日本語で示す。
- source_word: τοὺς ἁγιαζομένους
  choice: 聖なる者とされつつある人々
  rationale: 現在受動分詞が持つ継続的な様相を「されつつある」で保持し、当人たちが聖なるものとされる受動の意味も明示する。
theological_decisions:
- issue: 完了した完成と、進行中の聖化との関係
  choice: 「完全な者とされた」と「聖なる者とされつつある」を併置する。
  alternative: 一方を他方に合わせ、「すでに聖なる者とされた」または進行的な完成として訳す。
  rationale: 原文は、完了形 τετελείωκεν の完結し持続する結果と、現在分詞 ἁγιαζομένους の継続的な様相を意図的に並置している。特定の教理体系に合わせて緊張関係を解消せず、そのまま保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ささげ物」は宗教的文脈を保ちながら一般読者にも理解しやすい語とし、「されつつある」によって原文の継続的な様相を明示した。
