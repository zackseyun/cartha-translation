source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: ja
  text: 一方では、侮辱や苦難を受けて、公然と見せ物にされ[a]、他方では、そのように扱われた人々の仲間となりました。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「劇場の見せ物にされ」。公衆の面前で辱められたことを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「そのように生活していた（または、振る舞っていた）人々の仲間となりました」。ギリシア語は生活態度を指すこともあるが、ここでは迫害の文脈から「そのように扱われた」の意と考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: ある時には……またある時には
  rationale: 二つの経験を対照的に並べる相関表現を、自然な現代日本語で表した。
- source_word: ὀνειδισμοῖς
  choice: 侮辱
  rationale: 敵意ある言葉によって辱められることを、簡潔で明瞭に表す。
- source_word: θλίψεσιν
  choice: 苦難
  rationale: 迫害による圧迫や苦しみを含みつつ、意味を特定の形態に狭めない表現。
- source_word: θεατριζόμενοι
  choice: 人々の見せ物にされ
  rationale: 劇場でさらされるように公然と辱められるという、この動詞の鮮明な比喩を保持した。
- source_word: κοινωνοὶ
  choice: 仲間
  rationale: 単なる知人ではなく、その人々に連帯し、その境遇を共にしたことを自然な日本語で示す。
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: そのように扱われた人々
  rationale: 直前の侮辱と苦難という迫害の文脈に即して受動的な意味に取る。ただし、生き方や振る舞いを指す可能性は脚注に残す。
- source_word: γενηθέντες
  choice: 仲間となりました
  rationale: その人々との連帯に加わったことを、文脈上の過去の回想に合わせて表した。
theological_decisions:
- issue: ἀναστρεφομένων の文脈上の意味
  choice: 同じような迫害を受けた人々を指す
  alternative: そのように生活していた、または振る舞っていた人々を指す
  rationale: 直前には侮辱と苦難が語られ、次節にも苦しむ人々との連帯が続くため、「扱われた」が最も自然である。しかし語そのものには生活態度を指す用法もあるので、その曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「見せ物にされ」によって原語の劇場的・公然たる辱めのイメージを本文に保ち、解釈上の曖昧さは脚注で提示した。
