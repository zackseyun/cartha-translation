id: HEB.10.1
reference: Hebrews 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: ja
  text: 律法は、やがて来る良いものの影を持っているだけで、それらの事柄そのものの像を持っているのではありません。[a] したがって律法は、毎年絶えず献げられる同じいけにえによっても、神に近づく人々[b]を決して完全な者とすることができません。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「事柄そのものの像ではありません」。「影」と「像」とが対比されています。
    reason: lexical_alternative
  - marker: b
    text: 「近づく」は、礼拝のために神のもとへ進み出るという意味合いを持ちます。
    reason: cultural_note
  - marker: c
    text: 「完全な者とする」は、「完成させる」「目指すところまで到達させる」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: 影
  rationale: 「影」という比喩を保ち、後に来る良いものを先取りして示しながらも、その完全な実体ではないという対比を表した。
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: やがて来る良いもの
  rationale: 未来に属する良いものという意味を、終末論的時期を過度に限定せず、自然な現代日本語で示した。
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: 実体をそのまま映す像ではありません
  rationale: σκιάとの対比を明確にしつつ、εἰκώνの「像」という語義とαὐτήνの強意を保った。「実体」は文脈上のπράγματαを表す。
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: 毎年、絶えず同じいけにえを献げ続けても
  rationale: 年ごとの反復と継続的な奉献の双方を、日本語で過度に重くならない形で表した。「ても」により、その反復によっても目的を達成できないという論旨を自然に示した。
- source_word: οὐδέποτε δύναται
  choice: 決して……できません
  rationale: 可能性を絶対的に否定するοὐδέποτεとδύναταιの力を明確に表した。
- source_word: τοὺς προσερχομένους
  choice: 神に近づく人々
  rationale: ヘブライ書における礼拝的な意味合いを明確にするため、文脈上の到達点である「神」を補った。
- source_word: τελειῶσαι
  choice: 完全な者にする
  rationale: ヘブライ書の重要語であるτελειόωとの語彙的連続性を保った。ここでの「完全」は、単なる道徳的無欠よりも、神に近づく者を目的にかなう状態へ至らせる意味を含む。
theological_decisions:
- issue: 律法における影と像・実体の対比
  choice: 律法は来る良いものの「影」を持つが、実体をそのまま映す「像」ではないと訳す。
  alternative: 律法は将来の祝福の象徴にすぎない、と説明的に訳す。
  rationale: 原文のσκιάとεἰκώνの明示的な対比を保ち、律法の予表的役割を認めながら、最終的実体と同一視しない緊張を残した。
- issue: 犠牲が礼拝者をτελειῶσαιできないという主張
  choice: 「完全な者にすることはできません」と訳す。
  alternative: 「完成させることはできません」または「目的に到達させることはできません」。
  rationale: 伝統的かつ文脈的に重要な「完全」という表現を維持しつつ、脚注で完成・到達の含意を示し、道徳的無欠だけに限定しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語とした。「いけにえ」は一般読者に理解しやすい表記を用い、「神に近づく」はヘブライ書特有の礼拝的用法が伝わるようにした。長いギリシア語文は二文に分け、因果関係を「そのため」で明示した。
