id: HEB.10.21
reference: Hebrews 10:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἱερέα μέγαν ἐπὶ τὸν οἶκον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/021.yaml
  text: and a great priest over the house of God[b][a],
translation:
  language: ja
  text: また、神の家[b]を治める偉大な祭司[a]がおられるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大祭司」。ヘブライ人への手紙はイエスを繰り返し大祭司として示しますが、ここを直訳すると「偉大な祭司」です。
    reason: alternative_reading
  - marker: b
    text: 「神の家」は、神に属する家族、すなわち神の民をも指し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節から続く、信仰者が持つもう一つの根拠を並列して示す接続詞として、現代日本語で自然な「また」とした。
- source_word: ἱερέα
  choice: 祭司
  rationale: ἱερεύςの通常の意味を保った。この節は大祭司を表す定着した語ἀρχιερεύςを用いていないため、「大祭司」とは本文で断定しない。
- source_word: μέγαν
  choice: 偉大な
  rationale: 祭司の卓越性を表すμέγαςを、専門的称号に置き換えず形容詞として明示した。
- source_word: ἐπὶ τὸν οἶκον
  choice: 神の家を治める
  rationale: ἐπί＋対格がここで表す管理・権威の関係を、硬い「上に」ではなく自然な日本語で示した。οἶκοςの家／家族共同体という比喩は「家」に残した。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 所有・所属を示す属格を簡潔に訳した。
theological_decisions:
- issue: ἱερέα μέγανを専門的称号「大祭司」と訳すか
  choice: 偉大な祭司
  alternative: 大祭司
  rationale: ヘブライ人への手紙全体ではイエスが大祭司として示されるが、この節のギリシア語はἀρχιερεύςではなくἱερεύς＋μέγαςである。原文の語法上の違いを保ち、文脈からの神学的理解を本文へ過剰に持ち込まない。
- issue: 「神の家」を建物と神の民のどちらに限定するか
  choice: 神の家
  alternative: 神の家族／神の民
  rationale: οἶκοςには家と家に属する共同体の両義があり、ヘブライ3章2–6節との響きもあるため、比喩と共同体的含意の双方を保つ表現とした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「神の家を治める」は権威・管理を自然に表し、「偉大な祭司」は原文と一般的な称号「大祭司」との違いを保持する。文脈上、前節から続く未完の構文だが、日本語の単独節として理解できるよう「おられるのです」を補った。脚注記号は該当表現に近い順に[b][a]とした。
