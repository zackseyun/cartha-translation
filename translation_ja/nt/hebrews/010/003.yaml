  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: ja
  text: しかし、これらのいけにえにおいては、年ごとに罪が思い起こされます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「毎年」。
    reason: κατ’ ἐνιαυτόνは、年ごとの反復を表し、「年ごとに」とも「毎年」とも訳せるため。
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 前節の「礼拝する者たちを完全にすることができない」という論旨を受ける逆接として、簡潔で自然な現代日本語とした。
- source_word: ἐν αὐταῖς
  choice: これらのいけにえによって
  rationale: 女性複数代名詞は直前の文脈にあるいけにえを指すため、指示対象を明示した。ἐνはここで、それらのいけにえを機縁・手段として罪の想起が生じることを自然な日本語で表す「によって」とした。
- source_word: ἀνάμνησις
  choice: 思い起こされる
  rationale: 名詞構文を自然な日本語の受動表現にし、罪が記憶に呼び戻されるという意味を保った。「思い出させるもの」より簡潔で、文脈にも適する。
- source_word: ἁμαρτιῶν
  choice: 罪が
  rationale: ἀνάμνησιςに従属する属格を、名詞構文から受動文へ移すことに伴って主語として表した。罪が想起の対象であるという関係は保持している。
- source_word: κατ’ ἐνιαυτόν
  choice: 年ごとに
  rationale: 毎年繰り返されることを簡潔かつ格調を保って表す。文脈上の反復性を自然に伝える。
theological_decisions:
- issue: αὐταῖςの指示対象
  choice: 旧い契約のもとで繰り返されるいけにえを指すものとして「これらのいけにえ」と明示した。
  alternative: 「それらによって」とし、代名詞のまま残す。
  rationale: 直前の10章1–2節では繰り返し献げられる同じいけにえが論じられている。指示対象の明示は新たな解釈を加えず、読みやすさを高める。
- issue: ἐν αὐταῖςの機能
  choice: 「これらのいけにえによって」とし、いけにえの反復が罪を思い起こさせるという関係を表した。
  alternative: 「これらのいけにえのうちに」または「これらのいけにえにおいて」。
  rationale: ギリシア語のἐνには領域・機会・手段の幅がある。「によって」は日本語として自然だが、いけにえが罪の赦しではなく想起をもたらすという文脈上の対照を過度に説明しない形で示す。
- issue: κατ’ ἐνιαυτόνの反復性
  choice: 「年ごとに」と訳し、毎年の反復を示した。
  alternative: 「毎年」。
  rationale: いずれも可能だが、「年ごとに」は継続的な年次反復を自然に表し、ヘブライ書の論旨にある繰り返しを保つ。贖罪日の背景は本文に明示されていないため訳文には加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい簡潔で格調ある文体とした。「いけにえ」は一般読者に理解しやすく、文脈上の祭儀的意味も保つ。
