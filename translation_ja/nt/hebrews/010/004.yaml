  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: ja
  text: 雄牛と雄やぎの血が罪を取り除く[a]ことは、決してできないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を除去する」。
    reason: ギリシア語の動詞は、「取り除く」または「除去する」を表しうるため。
lexical_decisions:
- source_word: ἀδύνατον
  choice: 決してできない
  rationale: 不定詞「取り除くこと」と結びつく述語形容詞の絶対的な不可能性を、自然な現代日本語で明確に表す。
- source_word: γὰρ
  choice: からです
  rationale: 直前の議論を根拠づける説明的な接続を、文末表現によって自然に示す。
- source_word: αἷμα
  choice: 血
  rationale: ヘブライ人への手紙の議論に中心的な犠牲の血を、抽象化せず字義どおり保持する。
- source_word: ταύρων
  choice: 雄牛
  rationale: 語の指す雄の牛を明示し、レビ記的な犠牲の背景にも合う表現とする。
- source_word: τράγων
  choice: 雄やぎ
  rationale: τράγοςが雄のやぎを指すことを保ちつつ、一般読者に分かりやすい表記とする。
- source_word: ἀφαιρεῖν
  choice: 取り除く
  rationale: 罪を除去するという具体的な力を保ち、文脈上の神学的含意を過度に説明しない。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 日本語では複数の罪を包括的に表す際にも通常「罪」とするため、原文の意味を自然に伝えられる。
theological_decisions:
- issue: 動物犠牲の効力
  choice: 動物の血には罪を取り除くことが絶対にできないと、そのまま訳す。
  alternative: 動物犠牲には儀礼的な清めや一時的な機能があったと本文中で補足する。
  rationale: この節自体は不可能性を断言している。文脈から導かれる効力の範囲を訳文に付加せず、反復される動物犠牲と後に語られる決定的ないけにえとの緊張を保持する。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「雄牛や雄やぎ」は祭儀的対象を具体的に示し、「決してできない」で原文の強い不可能性を自然に表現した。
