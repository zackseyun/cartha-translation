id: HEB.10.12
reference: Hebrews 10:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: ja
  text: しかし、この方は、罪のためにただ一つの、永遠に有効ないけにえを献げて[a]、神の右の座に着かれた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の「永遠に」は、一つのいけにえの永続する効力を示すと理解されることが多い。「神の右の座に永遠に着かれた」と、後半の「座に着かれた」に係ると取ることもできる。
    reason: alternative_reading
  - marker: b
    text: 「神の右の座に」は詩編110:1を踏まえた表現。この詩編は、ヘブライ人への手紙でメシアの高挙を語る重要な箇所として用いられている。
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: この方
  rationale: 直前の、繰り返しいけにえを献げる祭司たちとの対比を保ちつつ、現代日本語で敬意ある自然な指示表現とした。
- source_word: δὲ
  choice: しかし
  rationale: 前節の祭司たちが日々立って奉仕する姿と、この方の一回限りの献げ物および着座との対比を明示する。
- source_word: μίαν ... θυσίαν
  choice: ただ一つのいけにえ
  rationale: μίανの強調を「ただ一つ」で表し、繰り返される多くのいけにえとの対照を保った。
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: 罪のために
  rationale: 犠牲を献げる目的を自然な日本語で示し、複数形のἁμαρτιῶνは日本語で総称的な「罪」とした。
- source_word: προσενέγκας
  choice: 献げ
  rationale: アオリスト分詞が主動詞に先行する行為を表すことを、自然な連用形で示した。
- source_word: εἰς τὸ διηνεκές
  choice: 永遠に
  rationale: 継続性・恒久性を簡潔に表す。ただし、ギリシア語では「献げた」にも「座に着いた」にも結び付け得るため、その統語的曖昧さを脚注で明示した。
- source_word: ἐκάθισεν
  choice: 座に着かれた
  rationale: 単なる姿勢よりも、詩編110:1を背景とする着座・高挙の含意を自然に伝え、完了した行為を表す。
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: 神の右の座に
  rationale: 字義的な「神の右に」を踏まえつつ、日本語の聖書文体で王的着座を自然に表し、詩編110:1への暗示を保った。
theological_decisions:
- issue: εἰς τὸ διηνεκέςがどこに係るか
  choice: 本文では直後の主動詞に自然に係る「永遠に神の右の座に着かれた」とした。
  alternative: 「罪のために永遠に有効な、ただ一つのいけにえを献げた」または「罪のためにただ一つのいけにえを永遠に献げた」。
  rationale: 語順上はἐκάθισενに結び付ける読みが自然であり、ヘブライ人への手紙10:13も着座の継続を支える。一方、文脈は一つの犠牲の永続的効力も強く語るため、別の係り方を排除せず脚注に残した。
- issue: 神の右に座ることの意味
  choice: 王的・メシア的高挙を暗示する表現としてそのまま保持した。
  alternative: 権威ある地位を説明的に本文へ織り込む。
  rationale: 詩編110:1への明確な反響はあるが、解釈を本文に付加せず、参照関係を脚注で示すにとどめた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「この方」と敬語形「着かれた」でキリストへの自然な敬意を示す一方、過度に古風な語法は避けた。「いけにえ」は一般読者にも理解しやすく、祭儀的文脈を保つ表記とした。
