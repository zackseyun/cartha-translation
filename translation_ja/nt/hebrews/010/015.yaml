  text: また、聖霊も私たちに証ししています。というのも、こう語った後、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: 証ししておられます
  rationale: 現在能動直説法の継続的な証言行為を表す。「証しする」は証人として語る意味を自然に保ち、聖霊を主語とするため敬語表現を用いた。
- source_word: δὲ
  choice: また
  rationale: 強い対比ではなく、論証を進める穏やかな接続として訳した。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: μαρτυρέωに伴う与格を、証言の受け手を示す「私たちに」とした。
- source_word: καὶ
  choice: も
  rationale: 聖霊を追加の証言者として示す付加の意味を表した。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 特定された聖なる霊を指す、現代日本語で定着した呼称。
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: すなわち、こう言われた後
  rationale: μετάと冠詞付き不定詞が示す時間的順序を保った。γάρは後続する引用による説明を導くため「すなわち」とし、不定詞の主語は直前の聖霊と理解されるので「言われた」とした。「こう」は次節の引用を自然に導く補足である。
theological_decisions:
- issue: 聖霊の証言における主体性
  choice: 聖霊も私たちに証ししておられます
  alternative: 聖霊も私たちのために証言しておられます
  rationale: ギリシア語では聖霊が能動的な証言主体であり、ἡμῖνは受益者よりも証言の受け手と解するのが文脈に適う。
- issue: εἰρηκέναιの暗黙の主語
  choice: こう言われた後
  alternative: こう記されているからです
  rationale: 直前の主語である聖霊を暗黙の主語として保ち、聖書本文を単なる無人格な記述に置き換えない。後続節まで続く未完の構文も維持した。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「証し」は聖書的・法廷的な含意を保ちながら一般読者にも理解できる。原文どおり後続の引用へ続く未完結な形にした。
