source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: ja
  text: 先にこう言われました。「あなたは、いけにえやささげ物、全焼のささげ物[a]や罪のためのささげ物[b]を望まず、喜ばれなかった。」これらは律法に従ってささげられるものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全焼のささげ物」は、祭壇で全体を焼き尽くすささげ物を指します。「焼き尽くすささげ物」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「罪のささげ物」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: まず先にこう言われました
  rationale: 直前に引用された詩編の文言を振り返りつつ、後続する10:9の「次に」に対応する談話の順序を、自然な日本語で示す。
- source_word: Θυσίας καὶ προσφορὰς
  choice: いけにえやささげ物
  rationale: 祭儀的文脈を保ちながら、現代の一般読者にも理解しやすい語を用いる。
- source_word: ὁλοκαυτώματα
  choice: 全焼のささげ物
  rationale: 祭壇で全体を焼き尽くすささげ物であるという複合語の意味を明示する。
- source_word: περὶ ἁμαρτίας
  choice: 罪のためのささげ物
  rationale: 七十人訳的な祭儀表現として読める一方、直訳的には「罪に関するもの」であるため、特定の日本語術語だけに固定せず意味を伝える。
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: 望まず、喜ばれなかった
  rationale: 二つの動詞の違いを保ち、神に対する敬語として自然に表現する。共通の目的語は日本語では前にまとめる。
- source_word: κατὰ νόμον προσφέρονται
  choice: 律法に従ってささげられる
  rationale: これらの祭儀が律法の規定に沿うものであることを、解釈を加えず表す。
theological_decisions:
- issue: 神が祭儀を望まず喜ばなかったという引用と、祭儀が律法に従うものであることとの緊張
  choice: 否定表現と「律法に従って」の双方をそのまま残す
  alternative: 神が単に不従順な祭儀だけを退けた、と説明的に限定する
  rationale: 本文はその限定を明示せず、詩編引用と律法による祭儀との緊張を著者の議論の中に保持しているため。
- issue: περὶ ἁμαρτίας の祭儀的意味
  choice: 罪のためのささげ物
  alternative: 罪のきよめのささげ物／罪祭
  rationale: 祭儀的カテゴリーを示しつつ、後代の特定の術語や神学的説明を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祭儀語は必要な具体性を保った。「あなた」は引用中の神への呼びかけであり、述語は敬意を込めて訳した。原文末尾の継続性は、単独節として読めるよう文にしつつ、次節への論理的接続を妨げない形にした。
