review_pass:
  verdict: revise
  source_fidelity: 主文は全体として対照構文と「滅び／いのちを保つ」の対比をよく伝えている。しかし、「退いて」は文法上「退いて滅びに至る」という出来事の連鎖を強く示し、ὑποστολή（後退・ひるみという名詞的な性質）と εἰς ἀπώλειαν（その帰結）との結び付きをやや狭める。また「信仰をもって」は手段の意味を補うため、πίστεως と εἰς περιποίησιν ψυχῆς の対照的なカテゴリー表現を多少解釈している。
  naturalness: 現行文は読みやすいが、「退いて滅びに至る者」は、後退そのものではなく、後退した人が必ず滅びに至るという因果的叙述として読まれやすい。「滅びに至るような後退をする者」とすることで、自然な現代日本語を保ちつつ原文の名詞的表現に近づけられる。
  terminology: ὑποστολήは「後退」とし、背教と断定しない。πίστιςは標準的に「信仰」とする。ψυχήはこの文脈では狭い意味の非物質的「魂」に限定されないため、本文の「いのち」は適切である。脚注aの「後ずさりして」「退却して」は本文改訂に合わせ、名詞形の訳語へ整える。
  issues:
  - severity: medium
    issue: 「退いて」がὑποστολήの名詞的・性質的表現を出来事の連鎖として読ませる。
    rationale: 原文は「滅びに至る後退の者」と「いのちを保つ信仰の者」を対照する。日本語では「滅びに至るような後退をする者」とするほうが、後退とその結末の関係を保ち、個々の出来事の叙述に狭めない。
  - severity: low
    issue: 脚注aの代替訳が動詞形で、改訂後の本文語「後退」との対応が弱い。
    rationale: 「後ずさり」「退却」と名詞形にして、原語の語類と本文の訳語の関係を明瞭にする。
  revised_text: しかし、私たちは、滅びに至るような後退をする者ではなく、信仰をもっていのちを保つ者です。
