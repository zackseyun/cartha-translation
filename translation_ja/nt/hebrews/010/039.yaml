source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: ja
  text: しかし、私たちは、滅びに至るような後退をする者ではなく、信仰をもっていのちを保つ者です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: しかし、私たちは
  rationale: 明示された一人称複数代名詞の強調を残し、δὲによる直前の警告との対照を自然な現代日本語で示した。
- source_word: ὑποστολῆς
  choice: 退いて
  rationale: 後ずさり、撤退するという語義を動詞化して自然に表した。「背教」と断定せず、原文の幅を保った。
- source_word: εἰς ἀπώλειαν
  choice: 滅びに至る
  rationale: εἰςが示す行き着く結果を「に至る」で表し、ἀπώλειαの重大な帰結を簡潔に訳した。
- source_word: πίστεως
  choice: 信仰をもって
  rationale: ὑποστολήと対照される信じる姿勢を示す。「忠実」の含みもあり得るため脚注に残した。
- source_word: εἰς περιποίησιν ψυχῆς
  choice: いのちを保つ
  rationale: 「滅び」との対照からπεριποίησιςを「保つ」とした。ψυχήはここで狭義の霊魂だけでなく、人のいのち・自己全体を指し得るため「いのち」とした。取得・獲得の語義の可能性は脚注に示した。
theological_decisions:
- issue: πίστιςが「信仰」か「忠実さ」か
  choice: 信仰をもって
  alternative: 忠実であって／忠実を保って
  rationale: 文脈上、信じ続ける姿勢が中心だが、語そのものを「忠実さ」に限定せず、可能な含みを脚注で保持した。
- issue: περιποίησις ψυχῆςの意味
  choice: いのちを保つ
  alternative: たましいを得る／自分自身を獲得する
  rationale: 直前の「滅び」との対照は保存の意味を支持するが、περιποίησιςには獲得・取得の語義もあるため、その曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の簡潔な対照を、日本語で自然な「者ではなく……者です」の構文に移し、抽象名詞を必要な範囲で動詞化した。
