  to: しかし、私たちは、滅びに至るような後退をする者ではなく、信仰をもっていのちを保つ者です。
  rationale: 本文の「退いて」を「滅びに至るような後退をする」と改め、ὑποστολήを後退・撤退という名詞的性質として表しつつ、εἰς ἀπώλειανが示す結末との関係を自然に明示した。「信仰をもっていのちを保つ」は、原文の簡潔な対照を明瞭な日本語に移す既存の選択として維持した。脚注aは本文の語類に合わせて整え、背教は可能な解釈としてのみ保持した。
