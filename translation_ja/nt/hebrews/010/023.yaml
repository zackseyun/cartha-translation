  to: 希望の告白を、揺るぐことなくしっかり守り続けましょう。約束してくださった方は忠実な方だからです。
  rationale: 原文に明示されない「私たちの」を省き、これに伴い不要となる脚注を削除した。勧告を先に、理由を後に置いてギリシア語の構文と論理の流れを明瞭に反映した。「告白」「忠実な方」は原語の意味とヘブライ書の用語法を保ち、神を本文で明示しない原文の含みも維持している。
