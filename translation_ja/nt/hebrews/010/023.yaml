  source_fidelity: 本文は勧告（κατέχωμεν）とその根拠（πιστὸς γὰρ ὁ ἐπαγγειλάμενος）を適切に表している。しかし、「私たちの」は原文にない補足であり、日本語では補わなくても自然に訳せる。また、脚注が文末に置かれているため、この補足語ではなく文全体にかかるように見える。
  naturalness: 「希望の告白を、揺らぐことなく堅く保ちましょう」は意味は通るものの、「揺らぐことなく」と「堅く」の重なり、および「告白を保つ」の結び付きがやや硬い。「希望の告白を、揺るぐことなくしっかり守り続けましょう」のほうが明瞭な現代標準日本語として自然である。
  terminology: ὁμολογίαは「告白」、πιστόςは約束を守る方という文脈を含む「忠実な方」とするのが適切である。「希望」は所有表現を加えずに原文の表現を保つ。約束者は原文どおり明示せず、「約束してくださった方」とする。
  issues:
