  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: ja
  text: 希望の告白を、揺るぐことなくしっかり守り続けましょう。約束してくださった方は忠実な方だからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέχωμεν
  choice: 堅く保ちましょう
  rationale: 一人称複数・現在接続法の勧告的用法を「ましょう」で表し、しっかり保持し続ける意味を「堅く保つ」で自然に伝えた。
- source_word: ὁμολογίαν
  choice: 告白
  rationale: ここでは、信じる希望を公に言い表すことを指す。「告白」はヘブライ書の文脈に合い、現代日本語でも宗教的な信仰表明として理解できる。
- source_word: τῆς ἐλπίδος
  choice: 私たちの希望の
  rationale: ギリシア語に所有代名詞は明示されないが、共同体への勧告であることを自然な日本語で表すため「私たちの」を補った。原文により近い形は脚注に示した。
- source_word: ἀκλινῆ
  choice: 揺らぐことなく
  rationale: 字義的には傾かないことを表し、ここでは告白を不動のものとして保つ意味。「揺らぐことなく」は信仰的な確固さを明瞭かつ自然に伝える。
- source_word: πιστὸς
  choice: 真実な方
  rationale: 約束を確実に守る、信頼に値する方という意味を保ちつつ、神について用いられる聖書的な響きを持つ表現とした。
- source_word: ὁ ἐπαγγειλάμενος
  choice: 約束してくださった方
  rationale: 冠詞付きアオリスト中動態分詞の実体詞的用法。指示対象である神を明記せず、原文どおり「方」として暗示にとどめた。敬語は神を指すことが文脈上明らかな日本語として自然である。
theological_decisions:
- issue: 「約束してくださった方」の指示対象
  choice: 神を指すと理解しつつ、本文では「神」と明記しない。
  alternative: 「約束してくださった神」と明示する。
  rationale: 文脈上の指示対象は神だが、ギリシア語は名を明示していない。原文の含意を保ち、解釈的な補足を避けた。
- issue: 「希望」に一人称複数の所有表現を補うか
  choice: 自然な共同体的勧告として「私たちの希望」とした。
  alternative: 「希望の告白」とし、所有表現を補わない。
  rationale: 原文のτῆς ἐλπίδοςには「私たちの」が明示されないため、その点を脚注で示す。一方、本文では勧告の主語との関係を自然な日本語で明らかにした。
- issue: πιστόςの訳語
  choice: 「真実な方」とし、約束を守る信頼性を文脈に含ませる。
  alternative: 「忠実な方」または「信頼できる方」。
  rationale: 「忠実」は何かに対する忠実さと誤解される可能性があり、「信頼できる」は意味を明瞭にする一方で神学的・聖書的な響きが弱い。「真実な方」は約束者の確かさを簡潔に保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、共同体への勧告を丁寧な「ましょう」で表した。文頭に理由節を置くことで、日本語として論理関係を自然に示しつつ、原文の「約束者の真実さが忍耐の根拠である」という強調を保った。
