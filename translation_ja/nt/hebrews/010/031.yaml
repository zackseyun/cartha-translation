  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: ja
  text: 生ける神の手に落ちることは、恐ろしいことだ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「生ける神の手に落ちることは、恐るべきことだ」。
    reason: φοβερὸν は「恐ろしい」のほか、「恐るべき」とも訳せる。
lexical_decisions:
- source_word: φοβερὸν
  choice: 恐ろしいことである
  rationale: 恐怖や畏怖を引き起こすものを表す述語形容詞。名詞化された不定詞を主題とするギリシア語の構文を、自然で厳粛な現代日本語にした。
- source_word: τὸ ἐμπεσεῖν
  choice: 陥ること
  rationale: 冠詞を伴うアオリスト不定詞を名詞的に訳した。「出会う」では、相手の力や裁きのもとに入るという強い響きが失われる。
- source_word: εἰς χεῖρας
  choice: 手に
  rationale: ある者の力や裁きのもとに置かれることを示す慣用表現だが、聖書的な比喩と関連箇所との響きを保つため「手」を残した。
- source_word: θεοῦ
  choice: 神の
  rationale: 「手」にかかる属格として、そのまま明確に訳した。
- source_word: ζῶντος
  choice: 生ける
  rationale: 神が現実に生きて働かれる方であることを示す定型的な聖書表現。「生ける」は現代日本語でもこの表現の荘重さを簡潔に保つ。
theological_decisions:
- issue: 警告文の射程と裁きの含意
  choice: 生ける神の手に陥ることの恐ろしさを述べる、厳粛で一般的な宣言として訳す
  alternative: 一時的な懲らしめだけを指すと限定する、または裁きの含意を除いた実存的表現と見る
  rationale: 文脈上、警告段落を締めくくる文であり、「手に陥る」は神の力と裁きのもとに置かれる含みを持つ。ただし原文に「裁き」という名詞はないため、本文には補わず、比喩が持つ緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、警告の厳粛さを保った。「生ける神」は定型的な聖書表現として採用し、原文の簡潔さと荘重さを維持した。
