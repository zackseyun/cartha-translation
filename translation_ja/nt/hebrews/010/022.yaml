id: HEB.10.22
reference: Hebrews 10:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: ja
  text: 真実な心[a]をもって、信仰について十分な確信を抱き、心に振りかけを受けて[d]悪い良心[b]から清められ、体を清い水で洗われた者として[c]、近づこう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誠実な心」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「やましい良心」。ただし原語は罪責感だけでなく、より広く「悪い良心」を意味し得る。
    reason: lexical_alternative
  - marker: c
    text: この清めの表現は祭儀的な洗いを背景とし、洗礼を思わせる可能性もあるが、この節はその洗いを明確に洗礼とは特定していない。
    reason: cultural_note
  - marker: d
    text: 直訳に近くは「心に振りかけを受け、悪い良心から」。本文の「清められ」は、振りかけと「～から」という表現がこの文脈で示す清めの含意を明らかにしている。
    reason: translation_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: 近づこう
  rationale: 一人称複数の勧奨的接続法を、現代日本語の自然な勧誘表現で示した。文脈上、近づく相手は神だが、原文には目的語が明示されていないため補わなかった。
- source_word: ἀληθινῆς καρδίας
  choice: 真実な心
  rationale: ἀληθινόςの「真実な、真正な」という幅を保ち、「誠実さ」だけに意味を狭めない表現とした。
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: 信仰の確信に満たされ
  rationale: πληροφορίαが表す十分な確信を自然な日本語で表し、πίστιςはこの文脈で「信仰」とした。
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: 心は振りかけを受けて
  rationale: 完了受動分詞の、振りかけを受けた状態を保ち、祭儀的な比喩を消さないようにした。何を振りかけたかは原文が明示しないため補わなかった。
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: 悪い良心から清められ
  rationale: ἀπόの分離と文脈上の清めの結果を日本語で明確にしつつ、πονηρόςを「罪責感のある」と狭く解釈せず「悪い」と訳した。
- source_word: λελουσμένοι τὸ σῶμα
  choice: 体は…洗われた者として
  rationale: 完了形が示す、すでに洗われた状態を表した。単数の「体」は複数の読者それぞれに配分的にかかるため、日本語でも単数形が自然である。
- source_word: ὕδατι καθαρῷ
  choice: 清い水で
  rationale: καθαρόςの物理的・祭儀的な清さの両面を保てる「清い」を採用した。
theological_decisions:
- issue: 水で体を洗う表現を洗礼と明示するか
  choice: 清めのイメージをそのまま訳し、洗礼とは明示しない
  alternative: 「洗礼を受けて」などと明示する、または内面的な清めだけを指す表現にする
  rationale: この表現は洗礼を想起させ得る一方、レビ的な清めの言語とも響き合う。節自体は洗いを明確に洗礼と同定していないため、解釈の余地を残した。
- issue: πονηρᾶςを罪責感に限定するか
  choice: 悪い良心
  alternative: やましい良心、罪責を感じる良心
  rationale: 原語は単に心理的な罪責感だけでなく、道徳的・祭儀的な汚れを含み得るため、意味を狭めない訳を選んだ。
- issue: 振りかけの対象物を補うか
  choice: 何が振りかけられたかを明示しない
  alternative: 血を振りかけられ
  rationale: 周辺文脈には血の祭儀的背景があるが、この節の表現自体には振りかける物が明記されていないため、本文では補わなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭儀的な「振りかけ」と「洗い」の並行関係を保ちつつ、原文の完了分詞が表す継続状態を「洗われた者として」などで示した。
