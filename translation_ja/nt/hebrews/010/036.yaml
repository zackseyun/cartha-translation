id: HEB.10.36
reference: Hebrews 10:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: ja
  text: あなたがたには、神の御心を行った後で約束を受けるために、忍耐が必要です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「約束されたものを受けるために」。
    reason: ἐπαγγελίαは「約束」のほか、文脈上「約束されたもの」を指すことがあるため。
lexical_decisions:
- source_word: ὑπομονῆς
  choice: 忍耐
  rationale: 試練や圧迫のもとでも踏みとどまり続けることを表す。現代日本語として自然で、文脈上の持続的な堅忍を簡潔に伝える。
- source_word: χρείαν ἔχετε
  choice: あなたがたには…が必要です
  rationale: 「必要としている」というギリシア語の慣用表現を、明瞭で自然な日本語にした。
- source_word: ἵνα
  choice: …ためです
  rationale: 目的または意図された結果を示す接続を、文脈に即して明確に表す。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 神のみこころ
  rationale: 一般の読者にも理解しやすく、聖書的な品位を保つ定着した表現である。
- source_word: ποιήσαντες
  choice: 行った後
  rationale: アオリスト分詞が主動詞に先行する行為を示すことを、自然な日本語で明示する。
- source_word: κομίσησθε
  choice: 受ける
  rationale: ここでは、約束されたものを受領する、または獲得する意味。簡潔で文脈に適する。
- source_word: τὴν ἐπαγγελίαν
  choice: 約束
  rationale: 原文の名詞表現を保ち、「約束そのもの」と「約束されたもの・その成就」との含みを本文で狭めすぎない。
theological_decisions:
- issue: ἐπαγγελίανが「約束」そのものを指すか、「約束されたもの／約束の成就」を指すか
  choice: 約束
  alternative: 約束されたもの
  rationale: 原文は字義的には「約束」だが、κομίσησθεとの組み合わせでは約束された祝福を受ける意味にもなりうる。本文では原語の形を保ち、より説明的な読みを脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある調子とした。「みこころ」は漢字を避けて読みやすくし、定着した聖書語としての響きを保った。
