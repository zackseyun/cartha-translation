  terminology: 「いけにえ」はヘブライ人への手紙の祭儀的文脈にふさわしく、平明な聖書語彙として維持できる。「真理を知った」も本文には適切であり、ἐπίγνωσιςの強い含意は脚注で限定的に示す。
