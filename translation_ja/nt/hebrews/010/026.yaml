  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: ja
  text: というのも、私たちが真理を知った[a]後、故意に罪を犯し続けるなら、罪のためのいけにえはもはや残されていないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「真理についての十分な、あるいは決定的な知識を得た」。ギリシア語は、より十分な、または決定的な認識という意味合いを持つことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: 故意に
  rationale: 意図的、自発的にという意味を、現代日本語で簡潔に表す。「ことさらに」より明瞭で、「意のままに」より自然である。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節を受ける説明・理由のつながりを、日本語として自然な呼応表現で示す。
- source_word: ἁμαρτανόντων ἡμῶν
  choice: 私たちが……罪を犯し続けるなら
  rationale: 現在分詞の継続的な相を「犯し続ける」で表し、属格独立構文の条件的な含みを「なら」で自然に訳す。単発の一度の罪に限定しない。
- source_word: μετὰ τὸ λαβεῖν
  choice: 知った後にも
  rationale: 時間的な前後関係を明示する。「にも」は、その後も行為が続くという警告の対照を自然に示す。
- source_word: ἐπίγνωσιν
  choice: 知った
  rationale: 名詞構文を日本語らしい動詞表現にしつつ、知識を受けたという内容を保持する。より深い、十分な認識という語感の可能性は脚注に残す。
- source_word: τῆς ἀληθείας
  choice: 真理を
  rationale: 定冠詞を伴う句を、文脈上特定された真理として自然に表す。
- source_word: οὐκέτι
  choice: もはや……ない
  rationale: その時点以後、残っていないという意味を明瞭に示す。
- source_word: περὶ ἁμαρτιῶν
  choice: 罪のための
  rationale: 犠牲・供え物の文脈におけるπερὶ＋属格の意味を、慣用的かつ明確に訳す。
- source_word: ἀπολείπεται
  choice: 残されていない
  rationale: 受動的な形を保ちつつ、利用可能ないけにえが残っていないという意味を自然な日本語で示す。
- source_word: θυσία
  choice: いけにえ
  rationale: ヘブライ人への手紙の祭儀的・犠牲的文脈に適した、一般読者にも通じる聖書語彙。
theological_decisions:
- issue: ἁμαρτανόντωνの相と警告の射程
  choice: 「故意に罪を犯し続けるなら」とし、継続的・持続的な行為として訳す。
  alternative: 「故意に罪を犯すなら」
  rationale: 現在分詞は継続する行為を自然に示す。単発の故意の罪を直ちに指すかのような過剰な限定を避けつつ、警告の深刻さを保つ。背教や聖徒の堅忍について特定教派の結論を訳文に持ち込まない。
- issue: ἐπίγνωσιςが示す認識の神学的性格
  choice: 本文では「真理を知った」とし、その認識が救いに至る再生を必ず意味するかどうかを特定しない。
  alternative: 「真理を十分に知った」「真理を救いに至る仕方で知った」
  rationale: 原文は真理のἐπίγνωσιςを受けたことを述べるが、その経験的・救済論的な深さを明示的には定義しない。語の強意的な可能性は脚注で示し、神学的緊張を保つ。
- issue: いけにえが残されていないことの範囲
  choice: 「罪のためのいけにえは、もはや残されていない」と原文に即して述べる。
  alternative: 「赦しを得る方法はもはやない」
  rationale: 後者は解釈を加えすぎるため避け、ヘブライ人への手紙の犠牲祭儀の語彙と論証を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、警告の厳粛さにふさわしい品位を保った。「というのも……からです」は単独節ではやや重なるが、前節との説明関係を明確にするため採用した。脚注記号[a]は該当語句の直後に置いた。
