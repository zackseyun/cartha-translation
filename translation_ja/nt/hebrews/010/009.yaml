  to: そこで、こう言われました。「見てください。私は、あなたの御心を行うために来ました。」彼は、第二のものを確立するために、第一のものを取り除きます。
  rationale: 順接の τότε を「そこで」とし、引用の Ἰδού を現代日本語として自然な「見てください」としました。「第一のもの」「第二のもの」は解釈を補わず維持し、ἵνα の目的関係は「…するために」で明示しています。内容上の有意な代替訳を提供せず、曖昧な指示対象を説明で狭める既存脚注は削除しました。
