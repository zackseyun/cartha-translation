    issue: 「その時」が τότε を時間的に限定している
    rationale: ここでの τότε は直前の引用・論証を受ける順接であり、「そこで」または「それから」が日本語としても文脈に即します。
  - severity: low
    issue: 引用内の「ご覧ください」が不自然
    rationale: Ἰδού の注意喚起は保たれているものの、日本語では「ご覧ください、私は来ました」は不自然な連結になりやすいです。「見てください」がより直接的で明瞭です。
  - severity: medium
    issue: 脚注が有意な代替訳を提示せず、解釈をやや固定している
    rationale: 「第一のものを取り除き、第二のものを確立されます」は本文の語順を入れ替えただけで、脚注を要する訳の差ではありません。続く説明も本文が保つ指示対象の曖昧さを狭めうるため、削除します。
