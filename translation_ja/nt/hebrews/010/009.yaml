id: HEB.10.9
reference: Hebrews 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: ja
  text: そこで、こう言われました。「見てください。私は、あなたの御心を行うために来ました。」彼は、第二のものを確立するために、第一のものを取り除きます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 直前の引用と議論を受ける時間的・論理的なつながりを、自然な現代日本語で示す。
- source_word: εἴρηκεν
  choice: 言われました
  rationale: 完了形の発言が現在にも効力を持つ点は文脈に委ねつつ、日本語として自然な過去表現にした。主語は引用中のキリストと理解し、敬語を用いた。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 注意を促す間投詞の力と聖書的な格調を保ちながら、「見よ」より現代の一般読者に明瞭な表現とした。
- source_word: ἥκω
  choice: 私は…来ました
  rationale: 到着して今ここにいるという含意を持つ現在形を、日本語で自然な完了的表現にした。
- source_word: τοῦ ποιῆσαι
  choice: 行うために
  rationale: 冠詞付き不定詞が示す目的を明示した。
- source_word: τὸ θέλημά σου
  choice: あなたのみこころ
  rationale: 神の意志・望みを表す定着した尊敬表現であり、神学的な語感も保つ。
- source_word: ἀναιρεῖ
  choice: 取り除かれます
  rationale: 第一のものを退ける意味を過度に「廃止」と制度化せず、原語の幅を保つ。
- source_word: τὸ πρῶτον
  choice: 第一のもの
  rationale: 実質名詞化された形容詞の簡潔さを保ち、その指示対象を本文で限定しすぎない。
- source_word: ἵνα
  choice: …ために
  rationale: 目的を自然かつ明確に表す。
- source_word: τὸ δεύτερον
  choice: 第二のもの
  rationale: 「第一のもの」との修辞的な対比を保ち、指示対象の解釈を本文に付加しない。
- source_word: στήσῃ
  choice: 確立する
  rationale: 立てる、成立させる、効力あるものとするという文脈上の意味を簡潔に表す。
theological_decisions:
- issue: 「第一のもの」と「第二のもの」の指示対象
  choice: 本文では原文どおり簡潔に「第一のもの」「第二のもの」とし、犠牲の第一の仕組みと、メシアのささげ物によって成就された神のみこころという理解を脚注で示す。
  alternative: 詩編の引用中の二つの発言、または広く古い契約と新しい契約を指すと理解する。
  rationale: ヘブライ10:8–10の直近の文脈は、犠牲とささげ物を神のみこころの実行と対比する。しかし原文自体は指示対象を明示しないため、本文で解釈を固定せず、神学的な緊張と曖昧さを保った。
- issue: 動詞ἀναιρεῖとστήσῃの主語
  choice: 直前に語るキリストを主語とする流れを保ち、「彼は」と訳す。
  alternative: 神が第一のものを取り除き第二のものを確立すると理解する。
  rationale: ギリシャ語は主語を明示せず、文脈上の理解には余地がある。直前のεἴρηκενと同じ主語を自然に継続させつつ、固有名を補って解釈を固定することは避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部には穏やかな聖書的格調を持たせた。「見よ」は避けて「ご覧ください」とし、神・キリストに関する動詞には敬語を用いた。本文の簡潔な対比と指示対象の曖昧さを保持した。
