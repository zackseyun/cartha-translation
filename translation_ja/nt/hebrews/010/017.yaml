  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: ja
  text: また、彼らの罪と彼らの不法な行いを、わたしはもはや決して思い起こさない[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もはや決して思い起こさない」は、強い否定を表すοὐ μήと、「もはや」を表すἔτιを反映している。
    reason: lexical_alternative
  - marker: b
    text: 「不法な行い」はἀνομίαιの訳。「律法に背く行い」または伝統的に「不義」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節から続く引用を結ぶ接続詞。日本語では文頭の「また」が自然であり、継続関係を保つ。
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: 彼らの罪
  rationale: ἁμαρτίαの通常の意味を直接的かつ簡潔に表す。複数形は日本語では集合的な「罪」で自然に伝わる。
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: 彼らの不法な行い
  rationale: ἀνομίαが持つ、律法に反すること・不法という意味を、現代の読者に分かりやすい具体的な表現で示す。「不義」より原語の法に背く含意が明確。
- source_word: οὐ μὴ μνησθήσομαι
  choice: わたしは……決して思い起こさない
  rationale: οὐ μήによる強い否定を「決して」で表し、μνησθήσομαιの「覚える／思い起こす」という聖書的表現を言い換えずに保つ。
- source_word: ἔτι
  choice: もはや
  rationale: 否定表現と結びつく「もうこれ以上は／もはや」の意味を自然な日本語で示す。
theological_decisions:
- issue: 神が罪を思い起こさないという表現
  choice: 「わたしはもはや決して思い起こさない」と、神の約束をそのまま訳す。
  alternative: 「もはや罪に問わない」「二度と彼らの罪を持ち出さない」
  rationale: 「思い起こす」という聖書的・契約的な表現を保持し、神が知識を失うという哲学的説明にも、単に処罰しないという解釈的な言い換えにも狭めない。原文の神学的緊張を残す。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「もはや」と「決して」を併用してἔτιとοὐ μήをそれぞれ反映し、強調を保った。文脈上の話者である神の一人称は「わたし」とした。
