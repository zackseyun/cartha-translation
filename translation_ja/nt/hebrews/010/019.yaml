  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: ja
  text: そこで、兄弟たち[a]、私たちはイエスの血によって聖所[b]に入る確信を持っているのですから、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、会衆全体への呼びかけとして女性を含む場合がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「聖なる所々」。ヘブライ書の幕屋の比喩では、神の臨在する聖なる領域を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: 持っているのですから
  rationale: 分詞の形を機械的に移さず、後続の勧告の根拠を示す働きを日本語の理由表現で明確にした。
- source_word: οὖν
  choice: ですから
  rationale: 前段の議論を受けた推論を、明瞭で自然な現代日本語で示す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形による呼びかけを保つ。会衆全体を代表的に指し得ることは脚注で示す。
- source_word: παρρησίαν
  choice: 確信
  rationale: ここでは神の御前へ近づく際の、自由で揺るがない信頼を表す。「大胆さ」も可能だが、現代日本語では不遜さを連想させ得るため避けた。
- source_word: εἰς τὴν εἴσοδον
  choice: 入る
  rationale: 名詞的な原文表現の意味を保ちながら、日本語として自然な動詞表現にした。
- source_word: τῶν ἁγίων
  choice: 聖所
  rationale: ヘブライ書の幕屋・礼拝の文脈にある、神の聖なる臨在の場所を指す。「至聖所」と限定しすぎず、日本語で自然な祭儀的表現を採った。
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: イエスの血によって
  rationale: イエスの犠牲の血が接近の手段または根拠であることを、解釈を過度に加えず表す。
theological_decisions:
- issue: τῶν ἁγίων の範囲
  choice: 神の臨在に属する聖なる場所を指す「聖所」
  alternative: 「聖なる所々」「至聖所」「聖徒たち」
  rationale: ヘブライ書の幕屋の比喩では空間的・祭儀的意味が最も自然である。「至聖所」は意味を限定しすぎ、「聖徒たち」は直近の文脈に合わない。単数形の「聖所」は日本語で領域全体を表し得る。
- issue: ἀδελφοί の代表的用法
  choice: 本文では「兄弟たち」を保ち、女性を含む可能性を脚注で説明する
  alternative: 「兄弟姉妹たち」「信仰の仲間たち」
  rationale: 原文の形を保ちつつ、実際の呼びかけの範囲についての情報も失わないため。
- issue: παρρησίαν の含意
  choice: 神の御前に入る「確信」
  alternative: 「大胆さ」「はばからず入る自由」
  rationale: 自由な接近と揺るがない信頼を含む語だが、日本語の「大胆さ」が持ち得る無遠慮な響きを避ける。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文は次節以降へ続く一文なので、理由節を閉じず読点で終えた。「ですから」と「のですから」の重なりは、οὖν と分詞の論理的役割をそれぞれ保持するために採用した。
