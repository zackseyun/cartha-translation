  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: ja
  text: 'そのため、私は四十年の間、この世代に憤りを覚え、こう言った。


    「彼らはいつも心の中で迷い続けている。しかし、彼らは私の道を知らなかった。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: 四十年の間
  rationale: 時の長さを表す対格を、自然な現代日本語で明示した。直前の文脈から続く詩篇引用の時間表現を保っている。
- source_word: διὸ
  choice: だからこそ
  rationale: 先行内容を受ける結果・推論のつながりを明確にしつつ、引用文として自然な表現とした。
- source_word: προσώχθισα
  choice: 憤り
  rationale: この動詞が表す強い不快や反感を弱めず、同時に「嫌悪した」とまで一義的に強めない表現を選んだ。
- source_word: τῇ γενεᾷ ταύτῃ
  choice: この世代に
  rationale: 与格を日本語の自然な結び付きで表し、荒野の民を一つの世代として指す語を保った。
- source_word: καὶ εἶπον
  choice: こう言った
  rationale: 直接話法の導入として自然な日本語にした。「こう」は原文に独立した対応語を持たないが、後続の引用を明瞭に導く。
- source_word: Ἀεὶ πλανῶνται τῇ καρδίᾳ
  choice: 彼らはいつも心で迷っている
  rationale: 継続的な逸脱を「いつも…迷っている」と表した。καρδίᾳ の単数形は、日本語では所有代名詞や複数化を加えず「心」とすることで自然に保持した。
- source_word: αὐτοὶ δὲ
  choice: 彼らは
  rationale: 日本語では改行と主題提示によって対照が自然に伝わるため、δέを機械的に「しかし」としなかった。αὐτοίは「彼ら」と明示した。
- source_word: οὐκ ἔγνωσαν
  choice: 知らなかった
  rationale: アオリストを素直な過去形で表し、単なる理解不足に限定せず、神の道を認識し受け入れなかった含みを残した。
- source_word: τὰς ὁδούς μου
  choice: 私の道
  rationale: 神の行い方と、神が示す歩みを含みうる聖書的比喩を、日本語で定着した「道」によって保った。ギリシア語は複数形だが、日本語の総称的単数が自然で意味を損なわない。
theological_decisions:
- issue: προσώχθισα に表された神の強い不快
  choice: 「憤り」と訳す
  alternative: 「怒った」「嫌悪した」
  rationale: 神の契約的な憤りを実質的に表しつつ、単なる怒りに平板化することも、嫌悪へ過度に限定することも避けた。
- issue: τῇ καρδίᾳ の集合的単数
  choice: 「心で」と単数のまま訳す
  alternative: 「それぞれの心で」「彼らの心々で」
  rationale: 世代全体を集合的に扱う可能性を保ち、日本語として不自然な複数表現や個人化を加えない。
- issue: οὐκ ἔγνωσαν の知識の性格
  choice: 「知らなかった」と訳す
  alternative: 「理解しなかった」「知ろうとしなかった」
  rationale: 認知的理解だけでなく関係的・契約的な認識も含みうる曖昧さを保ち、意志的拒絶を本文以上に明示しない。
translation_notes:
  register: 明瞭で現代的だが、神の宣言としての威厳を保つ文体とした。詩的引用に合わせて改行し、不要な古語や漢文調を避けた。注記を要するほど本文理解を左右する異読はないため、脚注は付していない。
