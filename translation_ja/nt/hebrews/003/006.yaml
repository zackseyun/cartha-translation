    rationale: παρρησίαには確信の側面があるが、ここでは率直さ・恐れない大胆さも含む。「大胆さ」として脚注で「確信」を示すほうが語義の幅と本文の力を保てる。
  - severity: medium
    issue: 「希望から生まれる確信と誇り」が属格を因果関係に限定している
    rationale: τῆς ἐλπίδοςは少なくとも直近のκαύχημαに「希望についての／希望を誇る」という関係を示す。両名詞が希望から生じるという因果関係は明示されていない。
  - severity: medium
