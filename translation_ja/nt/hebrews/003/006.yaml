revisions:
- from: しかし、メシア[a]は御子として神の家を治めています。その家とは、私たちのことです。私たちが、希望から生まれる確信[b]と誇り[c]をしっかり保つならばです。
  to: しかし、メシア[a]は御子として神の家を治める方です。私たちが大胆さ[b]と、希望についての誇り[c]をしっかり保つなら、私たちはその家です。
  rationale: 語順を整えて、条件節が「私たちはその家です」を限定する原文の構造を明瞭にした。「大胆さ」によりπαρρησίαの中心的な含意を本文で保ち、「希望についての誇り」により希望との関係を因果関係へ限定しないようにした。脚注は代替語義を維持しつつ、本文の変更に対応させた。
