id: HEB.3.6
reference: Hebrews 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: ja
  text: しかし、メシア[a]は御子として神の家を治める方です。私たちが大胆さ[b]と、希望についての誇り[c]をしっかり保つなら、私たちはその家です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語「クリストス」は、称号として「メシア」とも、名に近く「キリスト」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 別訳「確信」「率直さ」。ギリシア語は、隠さず率直に語る自由や、揺るがない大胆な確信を表す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「希望についての誇る根拠」「希望についての誇らしい確信」。ギリシア語は「誇り」「誇る根拠」「高らかな確信」を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: メシア
  rationale: モーセとの対比では称号としての働きが明瞭であるため「メシア」とした。ただし、名に近い「キリスト」も可能なので脚注に示した。
- source_word: δὲ
  choice: しかし
  rationale: 前節の、僕として神の家に仕えたモーセとの対比を明確に表す。
- source_word: ὡς υἱὸς
  choice: 御子として
  rationale: ὡς の比較・資格の意味を保ちつつ、現代日本語のキリスト論的文脈で自然かつ敬意ある表現とした。
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: 神の家を治めています
  rationale: ἐπί＋対格が示す監督・権威を「治める」で表した。αὐτοῦ の指示対象は直前の文脈では神が自然であり、日本語で曖昧になりすぎないよう「神の」とした。「家」は神の民を指す比喩を保持する。
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: その家とは、私たちのことです
  rationale: 神の民が家であるという比喩を保ちつつ、関係節を明快な現代日本語にした。
- source_word: ἐὰν
  choice: ならば
  rationale: 現実の条件を示し、忍耐や離反をめぐる特定の教理的解釈を付加しない。
- source_word: παρρησίαν
  choice: 確信
  rationale: この文脈では希望に基づく率直で揺るがない態度を表す。「大胆さ」も可能だが、日本語では対神的な不遜さを連想しうるため「確信」を本文に採った。
- source_word: καύχημα
  choice: 誇り
  rationale: 誇るもの、また誇らしい確信という意味を自然に表し、単なる内面的な自信へ弱めない。
- source_word: τῆς ἐλπίδος
  choice: 希望から生まれる
  rationale: 属格が παρρησία と καύχημα に関係することを自然な日本語で表した。原文にない所有代名詞は補わず、希望との意味関係を明示した。
- source_word: κατάσχωμεν
  choice: しっかり保つ
  rationale: 保持し続けるという勧告的な力を、分かりやすい現代日本語で表した。
theological_decisions:
- issue: Χριστόςを称号として訳すか、名に近い形で訳すか
  choice: メシア
  alternative: キリスト
  rationale: 救済史におけるモーセと御子の対比では称号性が働いている。ただし語が名に近く用いられる可能性を排除せず、脚注に別訳を示す。
- issue: αὐτοῦが示す家の所有者
  choice: 神の家
  alternative: 御子の家／その方の家
  rationale: 3:2、3:5の文脈では神の家を指すのが最も自然である。一方、統治者である御子との関係も文脈上含みうるが、本文では直近の談話上の指示を優先した。
- issue: ἐὰν ... κατάσχωμεν の条件をどの程度強く表すか
  choice: しっかり保つならば
  alternative: 保つかぎり／確かに保つならば
  rationale: 原文の実質的な条件をそのまま示し、聖徒の忍耐や背教について特定の教派的結論を翻訳に持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、御子、神の家、希望という荘重な聖書的語彙を保持した。条件節は独立文に近い形で後置し、原文の神学的緊張を目立たせた。すべての脚注記号を該当語の直後に配置した。
