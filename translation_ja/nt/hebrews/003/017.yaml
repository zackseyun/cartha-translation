source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: ja
  text: また、神は四十年の間、だれに対して怒られたのでしょうか。罪を犯し、その者たちの体[a]が荒野に倒れた人々に対してではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「手足、身体の部分」。ここでは、荒野で倒れた者たちの体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσώχθισεν
  choice: 怒られた
  rationale: 神が人々に対して怒り、憤られたことを表す動詞。現代日本語として明瞭で、修辞疑問の流れにも自然な「怒られた」とした。
- source_word: τεσσεράκοντα ἔτη
  choice: 四十年の間
  rationale: 期間を表す対格を、自然な日本語で明示した。
- source_word: ἁμαρτήσασιν
  choice: 罪を犯し…た人々
  rationale: アオリスト分詞を後続の関係節とまとめ、罪を犯した荒野の世代を自然に特定する表現とした。
- source_word: κῶλα
  choice: 死体
  rationale: 語は本来「手足、身体」を指し、この文脈では荒野で死んだ者たちの遺体を意味する。「死体」は裁きの厳しさと死の含意を明確に伝える。
- source_word: ἔπεσεν
  choice: 倒れた
  rationale: 原文の「倒れる」という像を保ちつつ、「死体」と組み合わせて死亡の意味を過度な補足なしに示した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野に
  rationale: イスラエルの荒野放浪という聖書的背景を保持する定着した訳語を用いた。
theological_decisions:
- issue: προσώχθισεν の省略された主語
  choice: 神
  alternative: 代名詞「その方」または主語を省略する
  rationale: 直前の文脈で主語は神であり、日本語では修辞疑問を明瞭にするため「神」を補った。原文の文脈が前提とする指示対象を明示したもので、新たな神学的主張は加えていない。
- issue: κῶλα が示す死の明示性
  choice: 死体
  alternative: 体、亡骸
  rationale: 荒野での裁きによる死を指す文脈と語の強い響きを保った。「体」では死亡が曖昧になり、「亡骸」はやや婉曲的である。
translation_notes:
  register: 明瞭な現代標準日本語。修辞疑問を「のでしょうか」「ではありませんか」で再現し、敬語は神への自然な尊敬を示す「怒られた」に限定した。
