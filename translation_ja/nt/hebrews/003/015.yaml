  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: ja
  text: 'こう語られているとおりです。


    「今日、もしあなたがたがその方の声を聞くなら、


    反逆の時のように、心をかたくなにしてはならない。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: こう語られている間に
  rationale: ἐν＋冠詞付き現在受動不定詞の時間的・状況的意味と、引用が今も語られているという継続性を保ちつつ、自然な現代日本語にした。
- source_word: Σήμερον
  choice: 今日
  rationale: 引用に込められた現在的な切迫感を、そのまま簡潔に表す。
- source_word: ἐὰν ... ἀκούσητε
  choice: もし…聞くなら
  rationale: ἐὰνとアオリスト接続法による条件節を、勧告の文脈に合う自然な条件表現で訳した。ここでの「聞く」は単なる聴覚以上の応答を含み得るが、原文の表現を狭めないよう「聞き従う」とはしなかった。
- source_word: τῆς φωνῆς αὐτοῦ
  choice: その方の声
  rationale: αὐτοῦの指示対象は文脈上神である。「その声」より人格的な所有関係が明確で、かつ引用内で原文にない「神」を補わない表現とした。
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: 心をかたくなにしてはならない
  rationale: 能動形の禁止命令を保ち、「心」は感情だけでなく意志や内面全体を指す聖書的用法として維持した。複数形は日本語では集合的な単数「心」が自然である。
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: 反逆の時のように
  rationale: παραπικρασμόςが指す荒野での神への反抗を、現代の読者に明瞭な「反逆」で表した。「時」を補うことで、出来事への言及として自然な日本語にした。
theological_decisions:
- issue: παραπικρασμόςの訳語と詩篇95篇への連関
  choice: 反逆
  alternative: 挑発／神を怒らせた時
  rationale: 語は神を挑発した行為と荒野での反抗という出来事の双方を想起させる。「反逆」は契約の民の不従順という道徳的重みを明瞭に伝える一方、特定の地名や解釈を本文に持ち込まない。
- issue: 「その方」の指示対象
  choice: 引用の表現を保ち「その方」とする
  alternative: 「神の声」と明示する
  rationale: 文脈上は神を指すが、原文は代名詞であるため、本文では明示的な名詞に置き換えず指示の形を保持した。
translation_notes:
  register: 明瞭で現代的だが、聖書引用としての威厳を保つ文体。「かたくな」は一般読者にも理解でき、定着した聖書語法でもある。原文に脚注標識はなく、日本語案にも脚注を設けていない。
