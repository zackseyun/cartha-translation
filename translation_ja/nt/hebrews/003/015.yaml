    rationale: 「間に」は通常、その間に起こる出来事を述べる主節を必要とします。ギリシア語の構文上の前節への係りを機械的に再現すると、日本語では引用導入が不自然になります。引用内容を示す自然な導入句に改めるのが安全です。
