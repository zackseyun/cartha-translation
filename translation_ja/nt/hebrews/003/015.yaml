  source_fidelity: 主要な引用文はギリシア語に忠実です。ἐὰν ... ἀκούσητε の条件、禁止命令 Μὴ σκληρύνητε、また παραπικρασμός を出来事として表す「反逆の時」は適切です。ただし、ἐν τῷ λέγεσθαι は引用が語られていることに伴う時間的・状況的導入であり、「こう語られている間に」は日本語として後続する主節を強く予期させるため、この節だけでは不自然に途切れます。
  naturalness: 「こう語られているとおりです」とすれば、引用導入として明瞭で自然な現代標準語になります。「その方の声」「心をかたくなにしてはならない」は、聖書引用にふさわしい明瞭さと格調を保っています。
  terminology: 「反逆」は παραπικρασμός の荒野での反抗という含意を自然に伝えています。「かたくなにする」は定着した適切な表現です。本文の代名詞的表現を保つ「その方」も許容されます。
