source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: ja
  text: 兄弟たち[a]、あなたがたのうちのだれかに、生ける神から離れるような、不信仰に満ちた悪い心がないよう、気をつけなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は男性複数形ですが、男女を含む信仰者の仲間全体への呼びかけとして用いられることがあります。
    reason: lexical_alternative
  - marker: b
    text: 「不信仰に満ちた悪い心」は「不実な悪い心」とも訳せます。「生ける神から離れる」は「背を向ける」「離反する」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: 気をつけなさい
  rationale: 二人称複数の現在命令形による警告。継続的な注意を促す力を、自然な現代日本語で表す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数呼格の形を保つ。文脈上、信仰共同体全体への呼びかけとなり得ることは脚注で示す。
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: あなたがたのうちのだれにも……ないよう
  rationale: 共同体の一人一人にそのような状態が生じる可能性を警戒するギリシア語の構文を、明瞭な日本語にする。
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: 不信仰の悪い心
  rationale: καρδίαの聖書的比喩を「心」で保ち、πονηράの道徳的な重みを「悪い」で示す。ἀπιστίαは直近の文脈に即して「不信仰」とするが、「不実」の含意もあり得る。
- source_word: ἐν τῷ ἀποστῆναι
  choice: 離れてしまうような
  rationale: 神から退く・離反する意味と警告の深刻さを表しつつ、「背教する」のような後代の専門用語に限定しない。ἐν＋冠詞付き不定詞の、状態の現れ・帰結に関わる幅は日本語の修飾表現で保つ。
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: 生ける神から
  rationale: 聖書で定着した尊厳ある表現「生ける神」を用い、真に生きておられる神という対照的な響きを保つ。
theological_decisions:
- issue: ἀπιστίαςを「不信仰」とするか「不実」とするか
  choice: 不信仰
  alternative: 不実
  rationale: ヘブライ人への手紙3章では、神の言葉を信じなかった荒野の世代が中心的背景であるため「不信仰」が最も適合する。ただし、忠実でないという道徳的側面も排除しない。
- issue: ἀποστῆναιを一般的な「離れる」とするか、神学的な「背教する」とするか
  choice: 離れてしまう
  alternative: 背を向ける／離反する／背教する
  rationale: 原語は退く、離れる、離反することを表す。警告の深刻さを保ちながら、後代の神学的専門概念へ意味を狭めない。
- issue: ἐν τῷ ἀποστῆναιと「悪い心」との関係
  choice: 離れてしまうような、不信仰の悪い心
  alternative: 生ける神から離れることによって、不信仰の悪い心となる
  rationale: この構文は離反という状態・現れ・帰結などの関係を含み得る。原因関係に固定せず、心の不信仰が神から離れることに現れるという広がりを残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としつつ、「生ける神」に聖書的で dignified な響きを残した。原文の直接的な呼びかけと警告を維持し、専門的な神学用語による過度な限定を避けた。
