id: HEB.3.2
reference: Hebrews 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: ja
  text: この方は、ご自分を任命した方[a]に忠実でした。モーセもその方の家[b]で忠実であったのと同じです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分を造った方」。ギリシア語は字義的には「造る、作る」とも訳せますが、ここでは「任命する、務めに就ける」という意味だと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 異本には「その方の家全体で」とあります。これは民数記12章7節の表現により近い読みです。この「家」は神の家を指すと考えられます。
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: この方は…忠実でした
  rationale: 1節のイエスを受ける分詞句を、現代日本語で自然な文にした。πιστόςはここでは「信じている」ではなく、託された務めに対する忠実さを表す。
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: ご自分を任命した方に
  rationale: ποιέωの基本義「造る／作る」は残るが、ここではモーセとの比較と神の家における務めが文脈であるため、「任命した」が適切である。可能な字義的訳は脚注に示した。
- source_word: ὡς καὶ
  choice: …も…のと同じです
  rationale: イエスの忠実さとモーセの忠実さを比較する構文を、明瞭で自然な日本語にした。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: その方の家で
  rationale: SBLGNT本文には「すべて」に当たる語がないため、本文では補わない。οἶκοςは後続節で展開される「家」の比喩を保つため「家」とし、αὐτοῦは「その方の」として、任命した方を指す読みを自然に示しつつ固有名詞への置換は避けた。
theological_decisions:
- issue: 御子について用いられた ποιήσαντι の意味
  choice: 任命した
  alternative: 造った／作った
  rationale: 「造った」は語義として可能だが、この文脈では職務を与えた、あるいは立てたという意味が最も自然である。御子が被造物であるとの含意を翻訳によって不必要に持ち込まず、語義上の別訳は脚注に残した。
- issue: 「その方の家」の所有者
  choice: 任命した方を指すと読める「その方の家」
  alternative: モーセの家
  rationale: 民数記12章7節との響きから神の家を指す可能性が高い。ただし本文では「神の家」と明示せず、原文の代名詞表現を保った。
- issue: οἶκος の比喩
  choice: 家
  alternative: 家族／家の者たち
  rationale: 後続の3章3–6節では建物としての家と共同体としての家が重ねられているため、一方に限定しない「家」を採用した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。1節から続く分詞構文を独立した文に整えた。「家」は後続の議論との語の連続性と、建物・共同体の両義性を保つ。脚注記号は該当語句の直後に配置した。
