reference: Hebrews 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: ja
  text: むしろ、「今日」と呼ばれている間は[a]、毎日、互いに励まし合いなさい[b]。それは、あなたがたのうちだれ一人も、罪の欺きによって頑なにならないようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今日」は詩篇95篇を踏まえた語で、神の呼びかけに応答すべき現在の時を指します。
    reason: cross_reference
  - marker: b
    text: 「強く勧め合いなさい」とも訳せます。ギリシア語の動詞には、励ます、勧める、促す、慰めるという意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: そうではなく
  rationale: 直前の警告と対照を示す強い逆接。単独の「しかし」よりも、前節の否定的な事態に代わる行動を示す文脈に自然に合う。
- source_word: παρακαλεῖτε
  choice: 励まし合いなさい
  rationale: この動詞は励ます、勧める、強く促す、慰めるという意味範囲を持つ。ここでは共同体が不信仰と頑なさを避けるよう互いを支える継続的行為なので、「励まし合う」を本文に採り、勧告の意味も脚注に残した。
- source_word: ἑαυτοὺς
  choice: 互いに
  rationale: 形は複数の再帰代名詞だが、複数命令とともに相互的な行為を表す。「自分たちを」ではなく「互いに」とすることで自然な日本語で相互性を明示した。
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: 日々
  rationale: 毎日繰り返す継続的な行為を、簡潔で格調を保つ現代日本語で表す。
- source_word: ἄχρις οὗ
  choice: 間は
  rationale: 単なる終点よりも、勧めが必要とされる期間の継続性を自然に示す。
- source_word: τὸ Σήμερον καλεῖται
  choice: 「今日」と呼ばれている
  rationale: 冠詞を伴う「今日」が詩篇95篇からの主題的な語であることをかぎ括弧で示し、受動形「呼ばれている」も保持した。
- source_word: ἵνα μὴ
  choice: ならないためです
  rationale: 避けるべき結果を伴う目的を明確な現代日本語で示す。
- source_word: σκληρυνθῇ
  choice: 頑なにならない
  rationale: 受動形の意味を日本語として不自然な「頑なにされる」に固定せず、罪の惑わしの影響で頑なな状態に至ることを表す。原文にない「心」は補わなかった。
- source_word: τις ἐξ ὑμῶν
  choice: あなたがたのうち誰一人
  rationale: 否定目的節内の不定代名詞を、日本語で自然な全員への警告として表した。
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: 罪の惑わしによって
  rationale: 与格を手段として捉え、罪が人を欺き惑わす性質と、その結果として頑なさが生じることを表した。
theological_decisions:
- issue: 相互的な勧告の範囲
  choice: 互いに励まし合いなさい
  alternative: 自分たちを励ましなさい／互いに勧め合いなさい
  rationale: 複数の再帰代名詞の相互的用法を明示し、個人的な自己激励ではなく共同体全体の責任として訳した。「励ます」と「勧める」の意味の幅は脚注で保持した。
- issue: 「今日」の解釈
  choice: 詩篇95篇を響かせる主題語として「今日」と表記
  alternative: 単なる暦日の「今日」として表記
  rationale: ヘブライ人への手紙3章の文脈では詩篇95篇の引用を受け、神の呼びかけに今応答すべき時を指す。本文ではかぎ括弧にとどめ、詳しい解釈は脚注に置いた。
- issue: 頑なにする働きの主体
  choice: 罪の惑わしによって頑なになる
  alternative: 罪が人を頑なにする／神によって頑なにされる
  rationale: 原文の受動形は行為主体を明示せず、手段として罪の惑わしを挙げる。特定の主体を本文に補わず、原文の余地を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令と警告の厳粛さを保った。「心」など原文にない語を補わず、「今日」の聖書間参照と παρακαλεῖτε の意味の幅は脚注で示した。
