  - severity: low
    issue: 目的節の日本語表現
    rationale: 「……ならないためです」だけでは、何のためかを受ける要素が省略され、命令後の説明として少し硬く不自然です。「それは」を補って目的を明示しても意味は変わりません。
  - severity: low
    issue: 罪の ἀπάτη の表現
    rationale: 「惑わし」も可能ですが、「欺き」は名詞 ἀπάτῃ の基本的な意味をより直接に伝え、現代日本語としても明瞭です。
