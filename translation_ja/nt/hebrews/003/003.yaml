source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: ja
  text: この方は、モーセよりも大きな栄光を受けるにふさわしいと認められました。家そのものよりも、家を建てた者のほうが大きな誉れを受けるのと同じようにです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: この方
  rationale: 直前の文脈で語られるイエスを指す指示代名詞。日本語では敬意を保ちつつ自然に指示対象を示す。
- source_word: ἠξίωται
  choice: 受けるにふさわしいと認められました
  rationale: 完了受動形の、価値があると評価され、その評価が成り立っている含意を表す。
- source_word: δόξης
  choice: 栄光
  rationale: 新約聖書の神学的語彙として定着しており、単なる評判以上の意味を保つ。
- source_word: κατασκευάσας
  choice: 建てた
  rationale: 家との比喩では、備える・造るという広い語義のうち『建てる』が最も自然で明瞭。
- source_word: τιμὴν
  choice: 誉れ
  rationale: δόξαとの語彙上の区別を保ち、評価・尊敬の意味を表す。
theological_decisions:
- issue: 『家を建てた者』が誰を指すか
  choice: 本文では『家を建てた者』とだけ訳し、指示対象を明示しない
  alternative: 『キリスト』または『神』と補う
  rationale: この節自体の比喩と文法が持つ余地を保ち、続く4節との関係を訳文で先取りして限定しない。
- issue: 比較表現 καθ’ ὅσον の関係
  choice: 理由を示す『からです』
  alternative: 『ちょうど……であるのと同じように』
  rationale: ここでは家と建て手の誉れの比較が、モーセと『この方』の栄光の差を根拠づけている。日本語では理由として結ぶと論旨が明瞭になる。
translation_notes:
  register: 現代標準日本語。荘重さを保ちながら、長い一文を二文に分けて論理関係を明瞭にした。『この方』により敬意を示すが、本文にない称号は補っていない。
