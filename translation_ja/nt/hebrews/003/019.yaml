  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: ja
  text: そして、彼らが不信仰[a]のために入ることができなかったことが分かります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不忠実」。このギリシア語は、信じないことだけでなく、信頼することを拒む不忠実さを表す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: こうして
  rationale: 直前までの議論から結論を導く文脈上のつながりを、現代日本語で自然に示す。単なる並列の「そして」より、この箇所の談話機能に合う。
- source_word: βλέπομεν
  choice: 分かります
  rationale: 一人称複数現在形の認識を、読者を含む自然な日本語で表す。「見ます」では視覚的意味に偏りやすい。
- source_word: ὅτι
  choice: ことが
  rationale: 認識内容を導く補文として、日本語の「〜ことが分かります」という構造で表す。
- source_word: οὐκ ἠδυνήθησαν
  choice: 彼らが…できなかった
  rationale: δύναμαι の能力・可能性の否定を明確に保つ。
- source_word: εἰσελθεῖν
  choice: 入ること
  rationale: 直前の約束の地および安息への入場を指す表現を、解釈を本文に補わず簡潔に訳す。
- source_word: δι’
  choice: 〜のためだった
  rationale: 対格を伴う διά の原因・理由を明瞭に示す。
- source_word: ἀπιστίαν
  choice: 不信仰
  rationale: 神の言葉と約束を信じず、信頼しなかったことを表す標準的な訳語。語には不忠実という含みもあり得るため、脚注で保持する。
theological_decisions:
- issue: ἀπιστίαを、信じないことと不忠実さのどちらに重点を置いて訳すか
  choice: 不信仰
  alternative: 不忠実
  rationale: 直近の文脈は神の約束を信じなかったことを強調するため、「不信仰」が最も明瞭である。ただし、信頼を拒む不忠実さという契約的・行為的含意を排除しないよう、別訳を脚注に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、聖書本文としての品位を保った。「こうして」で直前の議論からの結論を自然に示し、「分かります」で βλέπομεν の認識的用法を表現した。
