id: HEB.3.1
reference: Hebrews 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: ja
  text: それゆえ、聖なる兄弟たち[a]、天の召しにあずかる者たち[b]よ、私たちの告白の使徒また大祭司であるイエスに、心を留めなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は、女性も含む信仰者の共同体全体への呼びかけです。
    reason: cultural_note
  - marker: b
    text: 別訳「天の召しを共に受けている者たち」。
    reason: lexical_alternative
  - marker: c
    text: あるいは、「私たちが告白する方、使徒また大祭司であるイエスに、心を留めなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: それゆえ
  rationale: 直前までの論述、特に2章17～18節を受ける推論・帰結を明確に示す、現代日本語の簡潔で格調ある接続表現。
- source_word: ἀδελφοὶ ἅγιοι
  choice: 聖なる兄弟たち
  rationale: 男性複数形の呼びかけを保持しつつ、ἅγιοιの、神のものとして聖別された共同体という含意を「聖なる」で表した。文脈上は女性を含む信仰共同体全体への呼びかけであるため脚注を付した。
- source_word: κλήσεως ἐπουρανίου
  choice: 天の召し
  rationale: ἐπουρανίουが示し得る天的な起源と性質の両方を、どちらか一方に限定せず簡潔に保つ。κλῆσιςは神の招き・召命を示す「召し」とした。
- source_word: μέτοχοι
  choice: あずかる者たち
  rationale: あるものを共有し、それに参与する者という意味を、自然で聖書本文にふさわしい現代日本語で表した。
- source_word: κατανοήσατε
  choice: 心を留めなさい
  rationale: 単に思い浮かべるのでなく、注意深く観察し熟考するよう求めるアオリスト命令の力を自然に表す。
- source_word: ἀπόστολον
  choice: 使徒
  rationale: 神から遣わされた方という含意と、本文がイエスに明示的に用いる称号性を保つため、説明的な「使者」に置き換えず「使徒」とした。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: ユダヤ教祭儀の職務を指し、ヘブライ人への手紙の中心主題となる語の標準的で分かりやすい訳語。
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: 私たちの告白の
  rationale: 二つの称号「使徒また大祭司」にかかる属格表現を形式上保持し、告白の内容、告白される方、告白に属する務めという関係を本文で過度に限定しないようにした。別解を脚注に示す。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 日本語で定着している人名表記。二つの称号の指示対象として明確に配置した。
theological_decisions:
- issue: ἀδελφοὶの性別を伴う呼びかけ
  choice: 本文では「兄弟たち」とし、共同体全体を含むことを脚注で示す。
  alternative: 「兄弟姉妹たち」または「きょうだいたち」
  rationale: ギリシア語の男性複数形を保ちながら、この呼びかけが女性を排除するものと誤解されないよう注記する。
- issue: イエスに用いられるἀπόστολος
  choice: 称号「使徒」を保持する。
  alternative: 「遣わされた方」または「使者」
  rationale: イエスが神から遣わされた方であるという意味を含みつつ、原文が用いる称号の神学的・文学的な力を説明訳で弱めない。
- issue: τῆς ὁμολογίας ἡμῶνの属格関係
  choice: 「私たちの告白の」として関係の幅を保つ。
  alternative: 「私たちが告白する使徒また大祭司」または「私たちが告白する方、使徒また大祭司であるイエス」
  rationale: 属格が二つの称号とどのような意味関係にあるかには幅があるため、本文では一つの解釈に固定せず、より明示的な読みを脚注に置く。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、呼びかけと命令には本文にふさわしい格調を持たせた。「それゆえ」「大祭司」は定着した聖書語として保持し、「あずかる」「心を留める」は一般読者にも理解可能な範囲の自然な表現とした。
