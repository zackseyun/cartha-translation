source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: ja
  text: また、神が、彼らはご自分の安息に入ることはないと誓われたのは、いったいだれに対してでしたか。従わなかった者たち[a]に対してではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「従わなかった」は、「信じようとしなかった」という含みを持つこともあります。ここでは不従順と不信仰が密接に結びついています（3章19節参照）。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: だれに対して
  rationale: 人を指す与格複数の疑問代名詞。誓いが向けられた相手を自然な日本語で明示する。
- source_word: δὲ
  choice: また
  rationale: 前節から続く一連の修辞疑問をつなぎ、強い対立を持ち込まない。
- source_word: ὤμοσεν
  choice: 誓われた
  rationale: ὀμνύωのアオリストが持つ厳粛な誓いの意味を保ち、主語である神への敬意を示す。
- source_word: μὴ εἰσελεύσεσθαι
  choice: 入らせないと
  rationale: 誓いの内容を表す不定詞句。文脈上、彼らが入ることを神が認めないという意味を自然に表す。
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: ご自分の安息に
  rationale: ヘブライ人への手紙における神のκατάπαυσιςという主題を「安息」で保ち、εἰςの方向性も助詞「に」で示す。
- source_word: εἰ μὴ
  choice: ではありませんか
  rationale: 修辞疑問において唯一の答えを示す表現。ギリシア語の「…でなければだれか」という力を自然な日本語の反問で再現する。
- source_word: τοῖς ἀπειθήσασιν
  choice: 従わなかった者たちに対して
  rationale: ἀπειθέωのアオリスト分詞を、単なる知的な不信ではなく、従うことを拒んだ行為として表す。
theological_decisions:
- issue: 警告箇所におけるἀπειθήσασινの訳
  choice: 従わなかった者たち
  alternative: 信じなかった者たち／不従順だった者たち
  rationale: 次節の不信仰との密接な関係は保ちつつ、本節がἀπιστέωではなくἀπειθέωを用いる語彙上の区別を維持する。「不従順だった」よりもアオリストの行為性を自然に示す。
- issue: 神の安息への進入を表す構文
  choice: 神が「入らせない」と誓われた
  alternative: 彼らが「入らない」と誓われた
  rationale: 否定不定詞は誓いの内容を示す。日本語では使役形により、詩編95篇から引用される神の宣告としての意味を明確にするが、安息の性質自体は説明しすぎない。
translation_notes:
  register: 明快で格調ある現代標準語。連続する修辞疑問として「いったい」「ではありませんか」を用い、神への敬語は過度にならない範囲で「ご自分」「誓われた」とした。
