  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: ja
  text: というのは、どの家もだれかによって建てられるものですが、すべてのものを造られた方は神です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς … οἶκος
  choice: どの家も
  rationale: 単数名詞を伴うπᾶςの分配的な意味を、自然な現代日本語で表した。文脈にある「家」の具体像と比喩の両方を保つ。
- source_word: γὰρ
  choice: （前節から続く説明関係を文脈で示す）
  rationale: 前節の主張を根拠づける接続語。日本語では独立した「というのは」を置くと重くなるため、文頭の明示的な訳語を省いて説明の流れを自然に保った。
- source_word: κατασκευάζεται ὑπό τινος
  choice: だれかによって建てられるものです
  rationale: 受動態と行為者を明示し、一般原則を表す現在形の含みを「ものです」で示した。建築の比喩に合わせ、ここでは「建てる」とした。
- source_word: ὁ δὲ
  choice: ですが、…方は
  rationale: 一般原則から決定的な適用へ移るδέの穏やかな対比と、冠詞付き分詞の実体詞的用法を保った。
- source_word: πάντα
  choice: すべてのもの
  rationale: 範囲を限定せず、包括的な複数中性形の意味を自然に表した。
- source_word: κατασκευάσας
  choice: 造られた
  rationale: πάνταを目的語とするため、日本語では家に限る「建てる」より広い「造る」が自然であり、神への敬意を示す主体敬語を用いた。ただし、同じ語根による対応は文脈上理解できる範囲で保たれる。
- source_word: θεός
  choice: 神です
  rationale: 無冠詞のθεόςが「すべてのものを造った方」を神と同定する述語的位置にあることを、文末で明確に表した。
theological_decisions:
- issue: 後半節における神と「すべてのものを造った方」との同定
  choice: すべてのものを造られた方は神です
  alternative: 神は、すべてのものを造られた方です
  rationale: ギリシア語の語順と述語的なθεόςを反映し、「造った方」が神であるという明示的な同定を保った。被造世界の範囲や創造の仕方について、本文にない説明は加えていない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「どの家も」で一般命題を自然に示し、後半は文末の「神です」に重心を置いた。敬語の「造られた」は受け身ではなく主体敬語として用いている。
