source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: ja
  text: 'ですから、聖霊がこう語っているとおりです。


    「今日、もしあなたがたがその方の声を聞くなら、」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: ですから
  rationale: 直前の議論を受けて結論を導く接続詞。現代日本語として自然で、論理的なつながりを明確に保つ。
- source_word: καθὼς
  choice: こう言っているとおりです
  rationale: 引用を導く比較表現を、後続の λέγει と合わせて自然な日本語の引用導入句とした。単なる「ように」より文脈上の機能が明瞭である。
- source_word: λέγει
  choice: 言っている
  rationale: 現在形を保ち、聖霊のことばが今も語りかける引用形式の生きた響きを表す。「言いました」と過去に限定しない。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 定冠詞を伴う標準的な表現であり、日本語の定着した訳語を用いた。原文にない強調は加えない。
- source_word: Σήμερον
  choice: 今日
  rationale: 詩編引用冒頭の時間副詞を直接かつ自然に訳した。
- source_word: ἐὰν
  choice: もし
  rationale: 条件を導く機能を明示する、最も直接的な現代日本語。
- source_word: τῆς φωνῆς αὐτοῦ
  choice: その方の声を
  rationale: ἀκούω が属格目的語を取る構文を自然な日本語の目的格で表した。αὐτοῦ の指示対象は引用内で明示されないため、「神の」と補わず、敬意を保つ「その方」とした。
- source_word: ἀκούσητε
  choice: あなたがたが…聞くなら
  rationale: 二人称複数のアオリスト接続法を、ἐὰν とともに自然な条件節として訳した。「聞き従う」として服従の意味を明示的に付加せず、語義上の幅を保った。
theological_decisions:
- issue: 詩編引用の発話者
  choice: 引用を聖霊が現在「言っている」ことばとして直接導入する。
  alternative: 聖霊が聖書または詩編作者を通して語った、と説明的に訳す。
  rationale: ギリシア語本文は明示的に「聖霊が言う」としている。霊感についての説明を本文に加えず、直接的な帰属と現在形を保持した。
- issue: αὐτοῦ の指示対象
  choice: 「その方」とし、文脈上の指示を保つ。
  alternative: 「神の」と指示対象を明示する。
  rationale: 引用文では神の声を指すと理解されるが、この節のギリシア語自体は代名詞を用いる。訳文で名詞に置き換えて曖昧さを解消しすぎないようにした。
- issue: ἀκούω の含意
  choice: 「聞く」と訳す。
  alternative: 「聞き従う」「耳を傾ける」と訳す。
  rationale: 引用の後続文脈は応答と従順を求めるが、この動詞そのものの訳では聴取と服従の緊張を残し、解釈を過度に織り込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書引用にふさわしい品位を保った。文末は次節へ続く未完の条件節であるため、閉じた文にせず読点で終えた。「言っている」によってギリシア語現在形を自然に反映した。
