id: HEB.3.5
reference: Hebrews 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: ja
  text: さて、モーセは、後に語られること[c]の証しとなるために、仕える者[a]として、神の家全体[b]で忠実でした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕える者」に当たるギリシア語は、尊ばれる奉仕者や従者を表し得る語で、「奴隷」とは異なります。
    reason: lexical_nuance
  - marker: b
    text: 「神の家全体」は、「神の家族全体」とも訳せます。ここでは続く節にも通じる「家」の比喩を残しています。
    reason: lexical_alternative
  - marker: c
    text: 「後に語られること」は、「語られるはずのこと」とも訳せます。何が語られるかを原文はここで限定していません。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ … μὲν
  choice: さて、…は
  rationale: 前節から議論をつなぎつつ、次節のδέによって示されるモーセとキリストの対比の前半を、自然な日本語の主題提示で表した。
- source_word: πιστός
  choice: 忠実でした
  rationale: 神から委ねられた務めを確かに果たしたという文脈上の意味を明瞭に表す。
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: 神の家全体で
  rationale: 直前の文脈では家を建てた方が神とされており、民を指す「家」の比喩を保った。「家族」だけに限定せず、民とその秩序を含む広がりを残す。
- source_word: θεράπων
  choice: 仕える者
  rationale: δοῦλοςのような奴隷身分を直接示す語ではなく、尊ばれる奉仕者・従者という役割を表すため、「奴隷」ではなく「仕える者」とした。
- source_word: εἰς μαρτύριον
  choice: 証しとなるために
  rationale: 目的または結果を示し得るεἰςの幅を保ちながら、モーセの忠実な奉仕が証しとして機能したことを自然な日本語で表す。
- source_word: τῶν λαληθησομένων
  choice: 後に語られること
  rationale: 未来受動分詞の将来性と受動態を表した。語る主体を本文で補わず、原文の簡潔さを保つ。
theological_decisions:
- issue: 「その方の家」（οἴκῳ αὐτοῦ）が誰の家か
  choice: 神の家
  alternative: その方の家／彼の家
  rationale: 3:4で万物を造った方が神と明示され、民を神の家とする民数記12:7の背景もある。日本語の曖昧な代名詞を避けつつ、家の比喩そのものは保持した。
- issue: θεράπωνが示すモーセの地位
  choice: 仕える者
  alternative: しもべ／奉仕者／従者
  rationale: 名誉ある奉仕の含みと、次節の「御子」との役割上の対比を保ち、「奴隷」というより強い身分的意味を持ち込まない。
- issue: εἰς μαρτύριονの目的・結果の関係
  choice: 証しとなるために
  alternative: 証しとして／証しとなりました
  rationale: 目的を前面に出しつつ、忠実な奉仕そのものが証しとして機能したという結果の含みも排除しない。
- issue: τῶν λαληθησομένωνが指す内容
  choice: 後に語られること
  alternative: 語られるはずのこと
  rationale: 将来の神的啓示、特に御子に関わる語りを含み得るが、本文では対象を限定せず、原文の包括性を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、モーセへの敬意と論述の格調を保った。「仕える者」は日常的に理解でき、同時に次節の「御子」との対比を損なわない。「家」はヘブライ人への手紙3章で展開される比喩を維持するため残した。
