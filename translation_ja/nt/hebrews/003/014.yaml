id: HEB.3.14
reference: Hebrews 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: ja
  text: 私たちは、初めの確信[b]を最後まで堅く保つなら、メシアにあずかる者[a]となっているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアに参与する者」または「メシアを分かち合う者」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「確信」は「信頼」とも訳せる。このギリシア語は、文脈によっては「実体」や「現実」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: あずかる者
  rationale: 属格を伴い、メシアとの関わりや共有にあずかる者を表す。現代日本語として自然であり、「仲間」「共同者」よりも、この文脈の参与の意味を明確に伝える。
- source_word: γὰρ
  choice: のです
  rationale: 前節の警告・勧告を説明する理由づけの機能を、日本語の文末表現で自然に示す。
- source_word: τοῦ Χριστοῦ
  choice: メシアに
  rationale: Χριστόςをここでは称号として理解し、「メシア」と訳す。μέτοχοιとの関係は日本語では「にあずかる」が自然である。
- source_word: γεγόναμεν
  choice: となっている
  rationale: 完了形が示す、過去に成立して現在も続く状態を表す。「なった」だけより継続する結果を保つ。
- source_word: ἐάνπερ
  choice: なら、確かに
  rationale: 強意を伴う条件を、条件節の「なら」と主節の「確かに」によって自然な日本語で示す。単なる「もし」より原文の強調を反映する。
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: 初めに抱いた確信
  rationale: 直訳的な「確信の初め」は日本語では不明瞭なため、当初から持っていた確信という文脈上の意味を自然に表す。ただしὑπόστασιςの語義の幅は脚注に残す。
- source_word: μέχρι τέλους
  choice: 最後まで
  rationale: 継続と忍耐の終点を簡潔で自然な日本語で表す。
- source_word: βεβαίαν κατάσχωμεν
  choice: 堅く保つ
  rationale: κατέχωの保持・固守と、βεβαίανの堅固さを一体として自然に表現する。
theological_decisions:
- issue: 条件節と忍耐の関係
  choice: 「最後まで堅く保つなら」という実質的な条件として訳し、条件の力をそのまま残す。
  alternative: 忍耐が過去の参与を証明するという読み、または参与が継続的忍耐によって維持されるという読み。
  rationale: ギリシア語本文は条件を明示するが、忍耐、背教、救いの確証をめぐる後代の教理的仕組みまでは特定しないため、どちらかに限定しない。
- issue: メシアにあずかることの時制
  choice: 「となっている」として、成立した状態が現在まで続く完了の含意を保つ。
  alternative: 単純な現在形の「である」、または過去形の「となった」。
  rationale: γεγόναμενの完了形が持つ、成立と現存する結果の両面を日本語で示すため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「初めに抱いた確信」は語順を日本語化した意訳だが、原文の各要素を保持している。条件節の神学的緊張は解消せず、そのまま提示した。
