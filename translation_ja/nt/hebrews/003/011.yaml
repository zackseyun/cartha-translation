base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: ja
  text: 'わたしが怒りのうちに誓ったとおり、


    『彼らは決してわたしの安息に入れない。』[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語を直訳すると、「もし彼らがわたしの安息に入るなら」。これは誓いの定型句で、「彼らは決してわたしの安息に入れない」という意味。
    reason: 原文の省略された否定の誓い表現を示すため。
lexical_decisions:
- source_word: ὡς
  choice: （直前の文脈を受けて訳文には明示しない）
  rationale: この節は詩編引用の途中であり、ὡς は前節から続く引用内で「そのように／そこで」に近い働きをする。単独節として不自然な「〜のように」を置かず、文脈上のつながりを日本語では含意させた。
- source_word: ὤμοσα
  choice: 誓った
  rationale: ὀμνύω のアオリストで、神が厳粛に誓約したことを直接かつ自然に表す。
- source_word: ἐν τῇ ὀργῇ μου
  choice: わたしは怒りのうちに
  rationale: ὀργή の強く厳粛な響きを保ちつつ、現代日本語で理解しやすい「怒り」を用いた。
- source_word: Εἰ εἰσελεύσονται
  choice: 彼らを決して…入らせない
  rationale: εἰ＋未来形は、単純な条件ではなく、強い否定を表すセム語的な誓いの定型句である。その意味を日本語で明確にした。能動形「彼らが入る」を使う案もあるが、「わたしの安息」への立ち入りを神が認めないという誓いの力を自然に表した。
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: わたしの安息に
  rationale: κατάπαυσις はヘブライ人への手紙で展開される重要な主題であり、土地、天国、心の平安など一つの意味に狭めず、「安息」として文脈上の広がりを保った。
theological_decisions:
- issue: 誓いの定型句 Εἰ εἰσελεύσονται の解釈
  choice: 「彼らを決して、わたしの安息に入らせない」
  alternative: 「もし彼らが、わたしの安息に入るなら」
  rationale: 字面どおりの条件文では誓いの省略表現が伝わらず、意味を誤解させる。強い否定として訳し、原文の厳粛な拒絶を保持した。
- issue: κατάπαυσις の意味範囲
  choice: 安息
  alternative: 憩いの場所
  rationale: 詩編95編との連続性と、本書で後に展開される神の安息という神学的緊張を保つため、特定の場所に限定しない訳語を選んだ。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。「御怒り」ではなく「怒り」として過度に文語的になるのを避け、「安息」は本書の中心語として維持した。引用の厳粛さを二文構成で表した。
