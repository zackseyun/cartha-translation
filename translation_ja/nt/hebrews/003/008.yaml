  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: ja
  text: 反逆のときのように、荒れ野での試みの日のように、あなたがたの心をかたくなにしてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 詩編95編8節のヘブライ語本文にある地名に従えば、「メリバでのように、荒れ野のマサの日のように」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: かたくなにしてはならない
  rationale: μήを伴うアオリスト能動接続法の禁止を直接的に表し、聞き手自身の責任ある応答を保つ。
- source_word: τὰς καρδίας ὑμῶν
  choice: あなたがたの心
  rationale: 共同体への二人称複数の呼びかけを明示し、καρδίαを感情だけでなく意志・思考・態度を含む内なる人として表す。
- source_word: ἐν τῷ παραπικρασμῷ
  choice: 反逆した時
  rationale: παραπικρασμόςの神への反抗・挑発という出来事の意味を、現代日本語で自然に伝える。ギリシア語本文にないヘブライ語地名は本文へ置換しない。
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: 試みた日にしたように
  rationale: κατάの比較的な力を「したように」で表し、πειρασμόςはこの文脈で誘惑ではなく荒れ野における試みの出来事を指す。誰が誰を試みたかは本文で補わず、原文の含みを保つ。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒れ野で
  rationale: イスラエルの旅と詩編引用の聖書的背景を保ちつつ、現代日本語で定着した表現を用いる。
theological_decisions:
- issue: 詩編95編8節の歴史的暗示の訳し方
  choice: ギリシア語の出来事を示す語を「反逆」「試み」と記述的に訳す。
  alternative: 「メリバでのように、荒れ野のマサの日のように」とヘブライ語本文背後の地名で訳す。
  rationale: ヘブライ人への手紙が引用する七十人訳系のギリシア語本文を優先する。ヘブライ語の地名に基づく読みは重要だが、本文を置き換えず脚注で示す。
- issue: πειρασμόςにおける試みの主体と対象
  choice: 「試みた日」とし、目的語を補わない。
  alternative: 「神を試した日」または「彼らが試された日」と明示する。
  rationale: 語そのものは「試み／試練」を表し、直近の文だけでは関係を完全には明示しないため、後続節や詩編背景による解釈を本文へ先取りしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用文としての反復構造を「〜ように」で残し、「心」は聖書的人間観の広がりを保つ。
