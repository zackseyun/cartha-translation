  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: ja
  text: そこで、あなたがたの先祖は、試みによって私を試し[a]、私のわざを見た[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「試練の中で私を試し」または「私を試しにかけ」。この句は難解で、試みた方法または状況を表している可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「私のわざを見たにもかかわらず」と訳すこともできる。ギリシア語は単に「そして見た」と述べている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: そこで
  rationale: 前節の荒野という場所を受ける関係副詞。場所を示す意味を保ちつつ、引用文として自然な日本語にした。
- source_word: ἐπείρασαν
  choice: 私を試み
  rationale: 神を挑発的に試す意味合いを持つ。目的語「私」はギリシア語本文では明記されないが、詩篇からの引用と文脈上の話者によって明らかなため補った。
- source_word: οἱ πατέρες ὑμῶν
  choice: あなたがたの先祖
  rationale: 歴史上の父祖を指す。現代の一般読者に明瞭な「先祖」を採用した。
- source_word: ἐν δοκιμασίᾳ
  choice: 試すことによって
  rationale: 方法・手段を表す可能性のある難解な句。直前の動詞との反復を残し、原文の表現上の緊張を保った。
- source_word: καὶ εἶδον
  choice: そして…見た
  rationale: καίの単純な並列を保ち、文脈から「それにもかかわらず」という譲歩を本文に加えなかった。日本語本文では読点による連結とした。
- source_word: τὰ ἔργα μου
  choice: 私のわざ
  rationale: 荒野での神の行為を指す。聖書的な響きを保ちながら、現代日本語でも理解できる表現とした。
theological_decisions:
- issue: 試した対象
  choice: 私を試み
  alternative: 試み
  rationale: 目的語は当該節のギリシア語に明記されていないが、引用の話者である神が試されたことは文脈上明白であり、日本語として必要な目的語を補った。
- issue: わざを見たことと試みたことの論理関係
  choice: 単純な並列
  alternative: 私のわざを見たにもかかわらず
  rationale: 文脈上は譲歩的に理解できるが、ギリシア語は単にκαίで結ぶため、その解釈を本文に固定しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文にある「試す／試みる」の反復と、単純な接続が持つ曖昧さを保持した。
