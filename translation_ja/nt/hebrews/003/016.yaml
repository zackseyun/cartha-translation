  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: ja
  text: では、聞いた人々のうち、いったいだれが反抗した[a]のでしょうか。モーセによってエジプトから出た人々すべてではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「（神を）怒らせた」、または「（神を）苦々しくさせた」。ここでは、荒野で神に反抗したことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: いったいだれ
  rationale: 複数の特定の人々を問う修辞疑問の力を、自然な現代日本語で表す。
- source_word: γὰρ
  choice: では
  rationale: 直前の議論を受けて説明を進める接続機能を、日本語の論述に自然な形で示す。
- source_word: ἀκούσαντες
  choice: 聞いたのに
  rationale: 先行する聴聞を表す分詞を保ちつつ、聞きながら反抗したという文脈上の対照を自然に伝える。目的語は原文同様に明示しない。
- source_word: παρεπίκραναν
  choice: 神に逆らった
  rationale: 荒野でのイスラエルの反抗という文脈上の意味を明瞭にする。神は動詞の含意と引用文脈から補い、より字義的な訳は脚注に残す。
- source_word: ἀλλ’ οὐ πάντες
  choice: すべてではありませんか
  rationale: 肯定の答えを期待する修辞疑問として自然に表現する。ἀλλάの訂正・応答的な力は、この疑問形式全体で伝える。
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: エジプトから出た人々
  rationale: 名詞的分詞とἐξの起点を簡潔かつ自然に表す。
- source_word: διὰ Μωϋσέως
  choice: モーセによって
  rationale: διά＋属格の媒介・代理の意味を保ち、『モーセに率いられて』と解釈的に広げすぎない。
theological_decisions:
- issue: παραπικραίνωの荒野世代の文脈における意味
  choice: 本文では「神に逆らった」
  alternative: 「神を怒らせた」「神を憤らせた」「苦々しくさせた」
  rationale: 語の字義的な『憤らせる／苦々しくさせる』という側面を踏まえつつ、ここでは神への不従順な反抗を指すため、現代の読者に行為の性質が明確な表現を採用する。字義的な可能性は脚注で示す。
- issue: 最初の疑問と後半の「すべて」の範囲
  choice: 原文どおり、強い一般化を含む修辞疑問として訳す
  alternative: 後の物語上の例外を本文に補って「ほとんどすべて」とする
  rationale: 原文のπάντεςを弱めず、民数記の物語との関係は訳文中で暗黙に調整しない。修辞的な強調と物語上の緊張を保持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。二つの修辞疑問を保持し、「いったい」で問いの力を示した。脚注記号[a]は該当動詞句の直後に置いた。
