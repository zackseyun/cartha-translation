  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: ja
  text: これらがこのように整えられた後、祭司たちは常に第一の幕屋[a]に入り、祭儀の務め[b]を行います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「第一の天幕」または「第一の区画」とも訳せる。ギリシア語のσκηνήは幕屋そのものを指すことも、この文脈のようにその第一の区画を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: 「礼拝の行為」または「祭儀上の務め」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: これらがこのように整えられると
  rationale: 属格独立構文が示す後続行為の状況を自然な日本語で表した。「整えられる」は、直前に述べられた幕屋とその備品の設置を指しつつ、建造だけに意味を限定しない。δὲは軽い移行であり、日本語では文脈上あえて独立した接続語を置かなかった。
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: 第一の幕屋に
  rationale: σκηνήの祭儀的・旧約的背景を「幕屋」で保った。「第一」はここでは幕屋の第一の区画を指すが、原語が持つ「天幕／幕屋」と「区画」の重なりを本文と脚注で保持した。μένは次節のδέとの対照を準備するが、本節だけの日本語では「第一の」によって対照が十分に予告される。
- source_word: διὰ παντὸς
  choice: 絶えず
  rationale: 祭司たちが慣例として繰り返し第一の区画に入ることを示す。途切れのない滞在を意味するのではなく、次節の年一度の入場との対照を表す。
- source_word: εἰσίασιν
  choice: 入ります
  rationale: 現在形の習慣的・反復的な行為を、自然な現代日本語の現在表現で訳した。
- source_word: οἱ ἱερεῖς
  choice: 祭司たち
  rationale: 次節の大祭司と対照される通常の祭司たちを指す。複数を明示して原文の対照を保った。
- source_word: τὰς λατρείας
  choice: 礼拝の務め
  rationale: 聖所で行われる複数の祭儀的奉仕を指す。「礼拝」だけでは行為や職務の含意が弱いため「務め」を添え、現代の集会形式だけを連想させないようにした。
- source_word: ἐπιτελοῦντες
  choice: 果たします
  rationale: 祭司たちが定められた礼拝上の務めを遂行することを表す。「務めを果たす」は自然で、分詞が主動詞と同時に行われる内容を示すことも伝える。
theological_decisions:
- issue: 聖所の文脈におけるσκηνήの訳
  choice: 第一の幕屋
  alternative: 第一の天幕／第一の区画
  rationale: ヘブライ人への手紙9章はモーセの幕屋とその二つの区画を論じている。「幕屋」は旧約の祭儀的背景を保ち、「第一の」によってここで第一の区画が意図されることを示す。ただしσκηνή自体の語義の幅は脚注に残した。
- issue: 祭司の奉仕におけるδιὰ παντόςの意味
  choice: 絶えず
  alternative: いつも／常に
  rationale: 通常の祭司たちが第一の区画へ反復して入れることと、大祭司だけが第二の区画へ年に一度入ることとの対照を保つ。物理的に一瞬も途切れないという意味には限定しない。
translation_notes:
  register: 明快な現代標準語を用いながら、幕屋礼拝の祭儀的な重みを保つため「幕屋」「祭司」「礼拝の務め」を採用した。文体は丁寧体で統一し、原文の習慣的な現在と次節への対照を自然に伝えた。
