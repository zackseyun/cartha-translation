  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: ja
  text: また、幕屋[a]にも、礼拝の務めに用いるすべての器具[b]にも、同じように血を振りかけました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天幕」。ここでは聖所である幕屋を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「礼拝の務めのすべての器具」。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: 幕屋
  rationale: この文脈では一般的な「天幕」ではなく、モーセの時代の聖所を指すため、日本語聖書で定着しつつ意味も明確な「幕屋」とした。
- source_word: σκεύη
  choice: 器具
  rationale: 礼拝の務めに使われるさまざまな物品・用具を包括する語として、現代日本語で自然な「器具」を選んだ。
- source_word: λειτουργία
  choice: 礼拝の務め
  rationale: ここでは祭司による聖所での奉仕を指す。「務め」だけでは範囲が曖昧になるため、「礼拝の務め」として祭儀的文脈を明らかにした。
- source_word: αἷμα
  choice: 血
  rationale: 犠牲の血を文字どおり指しており、比喩化や言い換えを避けた。
- source_word: ὁμοίως
  choice: 同じように
  rationale: 前節で述べられた血を振りかける行為との対応を、自然な現代日本語で示した。
- source_word: ἐράντισεν
  choice: 振りかけました
  rationale: 血を散らして儀礼的に適用する動作を、専門用語に寄りすぎず明確に表す。
- source_word: δὲ
  choice: また
  rationale: 強い対比ではなく、前節に続く追加的な叙述なので、穏やかな接続を表す「また」とした。
- source_word: πάντα τὰ σκεύη
  choice: すべての器具
  rationale: πάνταの包括性を保ち、礼拝の務めに属する器具全体を指す表現とした。
theological_decisions:
- issue: 出エジプト記の儀礼記事との関係
  choice: モーセが幕屋とその礼拝用具に血を振りかけたという本節の要約を、そのまま訳す。
  alternative: 出エジプト記との細部の対応や相違を本文中で説明・調和する。
  rationale: 本文は儀礼上の聖別または清めを要約している。翻訳では背景説明を付加せず、原文が提示する記述と緊張関係を保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「礼拝の務め」として祭儀的意味を保ちつつ、一般読者にも理解しやすくした。日本語では文脈上明らかな主語「モーセ」を反復せず省略し、与格的な「にも」によって幕屋と器具の双方が血を振りかけられた対象であることを示した。
