  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: ja
  text: そこには、金の香炉[a]と、全面を金で覆った契約の箱がありました。その箱の中には、マナの入った金の壺、芽を出したアロンの杖、そして契約の板がありました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「金の香壇」。ギリシア語は香をたく器具または香壇を指すことがあり、ここでの意味については見解が分かれています。
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: 金の香壇がありました
  rationale: θυμιατήριονは香をたく器具または香壇を指し得る。幕屋の備品を列挙する文脈では「香壇」が自然だが、語義上の議論があるため別訳を脚注に残した。χρυσοῦνは簡潔に「金の」とした。
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: 契約の箱
  rationale: イスラエルの聖なる箱を指す定着した日本語表現であり、διαθήκηを文脈に即して「契約」と訳した。
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: 全面を金で覆われた
  rationale: πάντοθενが示す全方向からの覆いを、明瞭で自然な日本語で表した。完了受動分詞の結果状態も「覆われた」によって保った。
- source_word: ἐν ᾗ
  choice: その箱の中には
  rationale: 女性単数関係代名詞の先行詞が契約の箱であることを日本語で明示し、後続する複数の内容物へ自然につないだ。
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: マナを納めた金の壺
  rationale: στάμνοςを現代日本語で分かりやすい「壺」とし、ἔχουσαは聖所の容器にふさわしく「納めた」と自然に表現した。
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: 芽を出したアロンの杖
  rationale: ῥάβδοςを「杖」、βλαστήσασαを出来事を明確に示す「芽を出した」と訳した。
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: 契約の石板
  rationale: πλάκεςを「石板」とした。「石」は当該の板を自然に特定する聖書的背景に沿う明示化であり、一般読者にも内容が伝わりやすい。
theological_decisions:
- issue: θυμιατήριονが香壇を指すか香炉を指すか
  choice: 香壇
  alternative: 香炉
  rationale: 語は香をたく器具を広く指し得て、幕屋の配置との関係から古くから解釈が分かれる。備品を記述する本文では「香壇」を採用しつつ、「香炉」という実在する語義を脚注に示して曖昧さを保持した。
- issue: 契約の箱と列挙された品々との位置関係
  choice: 「その箱の中には」と原文どおり表現
  alternative: 箱に属するもの、または至聖所にあるものとして広く理解する
  rationale: ἐν ᾗは文法上、契約の箱を先行詞として「その中に」を意味する。旧約の関連記述との調和を図って本文を言い換えず、原文の表現を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこには……がありました」として前節から続く分詞構文を自然な文に整えた。専門的な祭儀用語は「香壇」「契約の箱」に限定し、内容物は一般読者に理解しやすい表現とした。
