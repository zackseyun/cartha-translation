  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: ja
  text: したがって、最初の契約でさえ、血を用いずに制定されたわけではありません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「最初のもの」。文脈上、「最初の契約」を指す。「最初の遺言」と訳すこともできる。
    reason: 原文では「契約」に当たる名詞が省略されており、直前のδιαθήκηには「契約」と「遺言」の意味上の重なりがあるため。
lexical_decisions:
- source_word: ὅθεν
  choice: したがって
  rationale: 直前の契約、死、血をめぐる議論から結論を導く推論の接続語として、明瞭で自然な現代日本語にした。
- source_word: οὐδὲ
  choice: でさえ……ではありません
  rationale: 「～さえもない」という強調された否定を表し、その原則が最初の契約にも当てはまったことを示す。
- source_word: ἡ πρώτη
  choice: 最初の契約
  rationale: 原文では女性形の形容詞「最初の」が名詞的に用いられ、文脈上「契約」を指す。日本語で意味を明確にするため、含意された名詞を補った。
- source_word: χωρὶς αἵματος
  choice: 血なしに
  rationale: 血が伴わなかったわけではないことを簡潔に表し、契約制定時の犠牲の血という文脈を保つ。
- source_word: ἐγκεκαίνισται
  choice: 制定された
  rationale: ἐγκαινίζωの完了受動形。契約が血によって正式に開始され、効力を持つに至ったことを自然な日本語で表す。「奉献された」だけに狭めない訳語を選んだ。
theological_decisions:
- issue: 「最初の」（ἡ πρώτη）が指すもの
  choice: 最初の契約
  alternative: 「最初の」／「最初の遺言」／最初の幕屋に関わる制度
  rationale: ヘブライ9章15–18節の直接の文脈と、出エジプト記24章の血による契約制定への言及から、「契約」が最も自然である。ただし原文に名詞が明記されていないことは脚注で示した。
- issue: ἐγκεκαίνισταιの意味合い
  choice: 制定された
  alternative: 開始された／奉献された／発効した
  rationale: 儀式的な開始と契約の成立を含む語であり、法的な「批准」または祭儀的な「奉献」の一方だけに限定しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「締結された」も可能だが、ἐγκαινίζωが表す正式な開始・導入をより広く保つため「制定された」とした。
