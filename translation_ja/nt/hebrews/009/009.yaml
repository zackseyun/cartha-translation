id: HEB.9.9
reference: Hebrews 9:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: ja
  text: これは今の時に対する比喩[a]であり、それに従って、供え物もいけにえも献げられています。しかし、それらは礼拝する人を良心の点で完全にすることができません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今の時に対する象徴」または「表象」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: これは
  rationale: 直前に述べられた幕屋の仕組みを受ける説明的な関係代名詞を、日本語として自然な指示表現で示した。
- source_word: παραβολὴ
  choice: たとえ
  rationale: 対応関係を通して意味を示すという語の広がりを保ち、単なる抽象的な記号に限定しない。文脈上可能な「象徴」は脚注に残した。
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: 今の時を示す
  rationale: 当時現にある時を指す表現を明瞭にしつつ、それが具体的にどの時代を指すかは本文で限定しなかった。
- source_word: καθ’ ἣν
  choice: それに従って
  rationale: 先行する幕屋ないしたとえの仕組みに即して供え物が献げられる関係を表し、指示対象の曖昧さを過度に解消しない。
- source_word: δῶρά τε καὶ θυσίαι
  choice: 供え物といけにえ
  rationale: 二つの祭儀的用語を区別して保持し、τε καὶによる対を自然な日本語で表した。
- source_word: προσφέρονται
  choice: 献げられています
  rationale: 現在受動形が表す継続中の祭儀行為を示した。
- source_word: μὴ δυνάμεναι
  choice: することができません
  rationale: 供え物といけにえに能力がないことを明示し、分詞構文を自然な日本語の述語にした。
- source_word: κατὰ συνείδησιν
  choice: 良心の点で
  rationale: 完全にできない領域が良心に関するものであることを示し、単なる主観的誠実さという意味には狭めなかった。
- source_word: τελειῶσαι
  choice: 完全にする
  rationale: ヘブライ書で重要な、目的とされた完成・適格な状態へ至らせるという語義を保持した。
- source_word: τὸν λατρεύοντα
  choice: 礼拝する人
  rationale: 祭儀的な奉仕に携わる者を指す単数の実詞的分詞を、一般読者に分かりやすく表した。
theological_decisions:
- issue: 祭儀的・類型的文脈における παραβολή の訳
  choice: たとえ
  alternative: 象徴、表象
  rationale: 地上の幕屋の仕組みと「今の時」との対応関係を保ち、それを単なる抽象的象徴へ還元しないため。「象徴」も文脈上有力なので脚注に示した。
- issue: 「今の時」の同定
  choice: 今の時
  alternative: 現在の時代、この現今の時
  rationale: 本文は時間的指示を置くが、その指示範囲について解釈上の余地があるため、特定の救済史的区分を訳文に加えなかった。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある聖書文体。「献げる」は祭儀的行為を示すため漢字表記とし、「いけにえ」は一般読者への可読性を優先して平仮名とした。
