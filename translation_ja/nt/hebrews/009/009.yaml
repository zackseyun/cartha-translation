revisions:
- from: これは今の時を示すたとえ[a]であり、それに従って、供え物といけにえが献げられています。しかし、それらは礼拝する人を、良心の点で完全にすることができません。
  to: これは今の時に対する比喩[a]であり、それに従って、供え物もいけにえも献げられています。しかし、それらは礼拝する人を良心の点で完全にすることができません。
  rationale: 本文の構文と祭儀的な語彙を保ちながら、παραβολή をこの箇所に即した「比喩」とし、εἰς の関係を「今の時に対する」として過剰な解釈を避けた。また、「供え物もいけにえも」により原文の対を明示した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:06:17Z'
review_pass:
  verdict: revise
  source_fidelity: 「これは」は直前の幕屋の配置を受けるものとして適切であり、祭儀用語、良心に関する限定、また「完全にする」はおおむね原文に忠実です。ただし、παραβολή はこの文脈で物語的な「たとえ」と受け取られやすいため、「比喩」とする方が対応関係を示す語として正確です。「今の時を示す」より「今の時に対する」の方が εἰς の関係を過度に限定しません。
  naturalness: 現代標準日本語として読みやすい訳文です。「しかし」は原文に明示された接続詞ではありませんが、供え物の限界を導く対比として日本語では自然です。供え物の対を「供え物もいけにえも」として τε καί を明瞭に反映できます。
  terminology: 「献げる」「いけにえ」「良心」「完全にする」は祭儀的・神学的文脈にふさわしく、一貫して用いることができます。「礼拝する人」も可読性のある訳です。脚注は本文の「比喩」に対応して、「象徴」および「表象」を代替訳として示します。
  issues:
  - severity: medium
    issue: παραβολή の本文訳が「たとえ」になっている
    rationale: この語はここではイエスの物語的な「たとえ話」を指すのではなく、幕屋の仕組みがもつ対応的・比喩的機能をいう。「比喩」は現代日本語でこの文脈をより誤解なく表し、脚注の「象徴」「表象」とも整合する。
  - severity: low
    issue: εἰς τὸν καιρὸν τὸν ἐνεστηκότα を「今の時を示す」としている
    rationale: 「示す」は意味として不可能ではないが、前置詞 εἰς が示す『今の時に対して／今の時のために』という関係を「指し示す」として具体化している。「今の時に対する」とすれば指示の性質を過度に定めない。
  - severity: low
    issue: δῶρά τε καὶ θυσίαι の対が本文で明示されていない
    rationale: 「供え物もいけにえも」とすることで、τε καί の対を自然な日本語で反映できる。
  revised_text: これは今の時に対する比喩[a]であり、それに従って、供え物もいけにえも献げられています。しかし、それらは礼拝する人を良心の点で完全にすることができません。
