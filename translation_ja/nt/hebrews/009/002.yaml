  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: ja
  text: 第一の幕屋が整えられ、その中には燭台と机と、供えのパン[a]がありました。その場所は「聖所」[b]と呼ばれます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「パンを並べて供えること」。慣用的には「臨在のパン」または「供えのパン」と訳されます。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は複数形で、「聖なる所々」の意です。ここでは幕屋の第一の部屋、すなわち聖所を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ ... ἡ πρώτη
  choice: 最初の幕屋
  rationale: σκηνήの祭儀的・歴史的背景を保つ定着した訳語として「幕屋」を用いた。「最初の」は次節の奥の区画との対比を示す。ここでは幕屋全体ではなく第一の区画を指すが、その換喩的な表現を本文に残した。
- source_word: κατεσκευάσθη
  choice: 整えられ
  rationale: 建造だけでなく、礼拝のために設けて備える意味を含み得るため、「建てられ」より広い「整えられ」とした。
- source_word: λυχνία
  choice: 燭台
  rationale: ろうそくではなく油のともしびを載せる祭具を指す。日本語聖書で定着し、簡潔な「燭台」を採用した。
- source_word: τράπεζα
  choice: 机
  rationale: 聖所に置かれた祭具としてのtableを、自然で明瞭な現代日本語の「机」とした。
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: 供えのパン
  rationale: 直訳的には「パンを並べて供えること」だが、ここでは机上に置かれたパンを指す。自然さを保ちつつ、πρόθεσιςの「供える／並べる」要素を残した。
- source_word: Ἅγια
  choice: 「聖所」
  rationale: 語形は中性複数だが、この文脈では幕屋の第一室を指すため、日本語で定着した単数的名称「聖所」とした。
theological_decisions:
- issue: Ἅγιαの複数形と幕屋の区画との関係
  choice: 「聖所」
  alternative: 「聖なる場所々」または「聖域」
  rationale: 原語は複数形だが、直後の文脈は第一室と奥の第二室を区別する。「聖所」はこの空間的対比を明確にし、余分な教理的解釈を加えない。複数形であることは脚注で示した。
- issue: ἡ πρώτηが指すもの
  choice: 最初の幕屋
  alternative: 第一の区画
  rationale: 原文のσκηνήを保って「幕屋」とした一方、実際には幕屋の第一室を指すことを脚注で明示し、表現上の緊張を解消しすぎないようにした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「幕屋」「燭台」「聖所」は聖書的背景を保つ定着語として採用した。原文の長い一文は二文に分け、関係代名詞ἥτιςの指示対象が第一の幕屋（第一室）であることを自然に示した。
