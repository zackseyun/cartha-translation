  to: というのは、もし雄やぎと雄牛の血、また、汚れた人々[a]に振りかける若い雌牛の灰[c][d]が、肉体[b]の清めのために彼らを聖なるものとするのなら、
  rationale: 本文の受動表現を、原文の能動分詞に対応する「振りかける」へ改めた。民数記19章に基づく儀礼上の具体的な動作は脚注で説明し、本文には原文にない受動構文を持ち込まないようにした。「というのは」によりγάρを反映し、「彼らを」を補って聖別の対象を明確にした。
