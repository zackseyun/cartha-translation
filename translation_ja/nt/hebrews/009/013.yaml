id: HEB.9.13
reference: Hebrews 9:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: ja
  text: というのは、もし雄やぎと雄牛の血、また、汚れた人々[a]に振りかける若い雌牛の灰[c][d]が、肉体[b]の清めのために彼らを聖なるものとするのなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「汚れ」は、道徳的な意味ではなく、儀式上の汚れを指す。別訳「汚れた状態にある人々」。
    reason: lexical_alternative
  - marker: b
    text: 旧契約の儀式による、外面的・身体的な清めを指す。次節の「良心」の清めと対照されている。
    reason: cultural_note
  - marker: c
    text: 若い雌牛の灰を用いる清めの儀式については、民数記19章参照。
    reason: cross_reference
  - marker: d
    text: ギリシア語では「振りかける」は「灰」を修飾する能動分詞である。民数記19章の儀礼では、灰を混ぜた清めの水が汚れた人に振りかけられる。
    reason: translation_note
lexical_decisions:
- source_word: αἷμα
  choice: 血
  rationale: いけにえの儀式における文字どおりの血を指すため、簡潔で正確な「血」とした。
- source_word: τράγων καὶ ταύρων
  choice: 雄やぎと雄牛
  rationale: いけにえとなる動物の種類と性を明示し、属格は「血」にかかる形で訳した。
- source_word: σποδὸς δαμάλεως
  choice: 若い雌牛の灰
  rationale: 民数記19章の清めの儀式を背景とする。δαμάλεως が若い雌牛を指すことを明確にしつつ、本文にない「赤い」は補わなかった。
- source_word: ῥαντίζουσα
  choice: 振りかけられる
  rationale: ギリシア語の形は「灰」を修飾する能動分詞だが、儀式では灰を含む清めの水が人に振りかけられる。日本語で誤解なく儀式の動作を表すため受動形とし、原文の構文は脚注で示した。
- source_word: τοὺς κεκοινωμένους
  choice: 汚れた人々
  rationale: ここでは道徳的堕落ではなく、儀式上の汚れた状態を指す。完了分詞の結果状態を自然な日本語で表した。
- source_word: ἁγιάζει
  choice: 人を聖なるものとする
  rationale: 旧契約の儀式によって礼拝共同体に復帰できる状態にされるという祭儀的意味を保ち、「清める」と同一表現にはしなかった。
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: 肉体を清めるために
  rationale: 直訳的な「肉の清さ」より自然な日本語としつつ、次節の「良心」と対照される外面的・身体的な清めを保持した。
- source_word: εἰ γὰρ
  choice: もし……のなら
  rationale: 14節で完結する条件構文であることを明確にした。「なぜなら」に相当する γάρ の論証的機能は、日本語では前後のつながりと条件表現によって自然に伝わるため明示しなかった。
theological_decisions:
- issue: 旧契約の儀式が「聖なるものとする」という表現の意味
  choice: 祭儀上、神の前に近づける清い状態にすること
  alternative: 内面的・道徳的に全面的な聖さを与えること
  rationale: 直後の「肉体」の清めと14節の「良心」の清めとの対照から、ここで述べられる効力は外面的・祭儀的な領域にある。ただし、原文の強い動詞 ἁγιάζει は弱めずに訳した。
- issue: σάρξ の意味
  choice: 文字どおりの外面的・身体的な領域を指す「肉体」
  alternative: 罪深い性質としての「肉」
  rationale: 文脈はレビ記的な清めの儀式であり、罪の性質ではなく身体に関わる儀式上の清さを述べている。
- issue: ῥαντίζουσα の統語と儀式上の動作
  choice: 本文では自然な受動表現「振りかけられる」とする
  alternative: 原文の文法形式に沿って「汚れた人々に振りかける灰」とする
  rationale: 能動分詞は文法上「灰」に一致するが、民数記19章では灰を入れた清めの水が人に振りかけられる。日本語で灰そのものが主体的に人へ動作するかのような不自然さを避け、形式上の相違は脚注で開示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祭儀的・神学的な重みを保つ文体とした。本節は14節へ続く条件節なので読点で終えた。「聖別する」は専門語になりやすいため「聖なるものとする」とし、「肉」は罪深い性質と誤解されやすいため、この文脈では「肉体」とした。
