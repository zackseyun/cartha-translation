review_pass:
  verdict: revise
  source_fidelity: 要改訂です。ῥαντίζουσαは女性・単数・能動現在分詞で、σποδὸς（灰）を修飾し、「汚れた人々に振りかける灰」という能動の構文です。本文の「振りかけられる」は、民数記19章の儀礼的実態を説明しやすくはするものの、原文の態を受動に変えています。またγάρの論証的な接続は、「というのは」を補うことで自然に示せます。
  naturalness: 「灰が…振りかける」は日本語としてやや擬人的に聞こえますが、祭儀を述べる原文の構文を保つために許容されます。脚注で、民数記19章の儀礼では灰を混ぜた水が振りかけられることを説明すれば、本文の不自然さを抑えつつ原文への忠実さを確保できます。「肉体の清め」は現代日本語として明瞭で、次節の良心との対照も保ちます。
  terminology: 「雄やぎと雄牛」「若い雌牛の灰」「汚れた人々」は適切です。「聖なるものとする」はἁγιάζειの祭儀的な力を保つ明瞭な表現です。ただし、目的語を「彼ら」と明示し、灰に振りかけられる人々との照応を明確にします。
