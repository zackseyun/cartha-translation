  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: ja
  text: また、人間には一度死ぬことが定められており、その後には裁きがあるように、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: ちょうど……ように
  rationale: 程度ではなく、次節の対応表現へ続く比較を導入しているため。日本語では「ちょうど……ように」として比較構文を明確にした。
- source_word: ἀπόκειται
  choice: 定められている
  rationale: 本来は「取っておかれている、備えられている」だが、与格の人と不定詞を伴うここでは、人間に定まった運命を表す。「定められている」が自然で文脈に適する。
- source_word: τοῖς ἀνθρώποις
  choice: 人間には
  rationale: ἄνθρωποι はここで男女を含む人類一般を指す。日本語の「人間」は包括的な意味を自然に伝える。
- source_word: ἅπαξ
  choice: 一度
  rationale: 死が一回起こることを示す。「ただ一度」や「一度限り」よりも過度な強調を避け、原文の簡潔さを保つ。
- source_word: ἀποθανεῖν
  choice: 死ぬこと
  rationale: ἀπόκειται に従属する不定詞を、自然な日本語の名詞節で表した。
- source_word: μετὰ δὲ τοῦτο
  choice: その後には
  rationale: 死に続く出来事の順序を明確に示す。δέ は日本語では前半との接続に溶け込ませた。
- source_word: κρίσις
  choice: 裁き
  rationale: 司法的な判定を広く表し、結果が有罪宣告であると限定しない。「裁きの日」など、原文にない詳細も加えない。
theological_decisions:
- issue: τοῖς ἀνθρώποις の包括的指示
  choice: 「人間には」と訳し、全人類を指すものとした
  alternative: 「人々には」
  rationale: ギリシア語は文法上の男性複数形だが、ここでは男性だけでなく人類一般を指す。日本語の「人間」はその包括的意味を追加説明なしに正確に伝える。
- issue: 死後の κρίσις の範囲
  choice: 単に「裁き」とした
  alternative: 「有罪の宣告」「最後の審判」
  rationale: この節は死後の裁きを述べるが、その結果や終末論上の詳細までは規定していないため、意味を狭めずに保った。
- issue: 第28節へ続く比較構文
  choice: 「ちょうど……ように、」として文を次節へ開いたままにした
  alternative: この節だけで完結する独立文にする
  rationale: καθ’ ὅσον は第28節の対応する比較へ続くため、原文の統語関係と修辞的な流れを保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体とした。「人間」は一般的・包括的な語なので、英語版にある性別表現の脚注は日本語では不要。節末は原文どおり次節へ続く比較構文として読点で結んだ。
