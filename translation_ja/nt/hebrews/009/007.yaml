id: HEB.9.7
reference: Hebrews 9:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: ja
  text: しかし、第二の部屋[a]には、年に一度、大祭司だけが入ります。それも、血を携えずに入ることはありません。その血を、自分自身のため、また民が知らずに犯した罪のためにささげるのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「第二の幕屋」または「第二の区画」とも訳せる。幕屋の内側の部分を指す。
    reason: lexical_alternative
  - marker: b
    text: 「民が意図せず犯した罪」または「民の過失」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: しかし、第二の部屋には
  rationale: 直前の第一の幕屋と対照される内側の区画を指す省略表現。日本語では「部屋」を補い、空間的な対比を明確にした。「第二の幕屋」「第二の区画」も可能であるため脚注に示した。
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: 年に一度
  rationale: 年ごとの一回という頻度を、自然で正確な現代日本語で表す。
- source_word: μόνος ὁ ἀρχιερεύς
  choice: 大祭司だけが
  rationale: 入る者が大祭司に限られるという μόνος の排他性を明瞭に表した。
- source_word: οὐ χωρὶς αἵματος
  choice: 血を携えずに入ることはありません
  rationale: ギリシア語の婉曲的な否定を保ちつつ、入る際に犠牲の血を伴うことを日本語で自然に示した。「血」は明示された祭儀的イメージとしてそのまま残した。
- source_word: ὃ προσφέρει
  choice: その血を……ささげる
  rationale: 関係代名詞の先行詞が「血」であることを明示し、προσφέρει の祭儀的意味を「ささげる」で表した。
- source_word: ὑπὲρ ἑαυτοῦ
  choice: 自分自身のため
  rationale: 犠牲を代理・利益のためにささげる文脈での ὑπέρ を、過度に解釈せず自然に訳した。
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: 民が知らずに犯した罪
  rationale: ἀγνοήματα が無知や意図しないことによって犯された罪を表すため、「知らずに犯した罪」とした。単なる知識不足ではなく罪としての性格も保持する。
theological_decisions:
- issue: 祭儀的文脈における ἀγνοήματα の性質
  choice: 民が知らずに犯した罪
  alternative: 民の過失／民が意図せず犯した罪
  rationale: 無知に特徴づけられた責任ある違反を指す語として、罪の性格と非故意性の双方を残した。故意・非故意の体系的な教理区分を本文以上に持ち込まない。
- issue: 血を伴う入室と奉献の関係
  choice: 血を携えて入り、その血をささげることを明示
  alternative: 「血なしには入らず、それをささげる」と直訳的に連結する
  rationale: 関係代名詞 ὃ が αἵματος を受ける構造を明確にしながら、血そのものを犠牲としてささげる祭儀的表現を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「大祭司」「ささげる」は聖書の祭儀的文脈で広く理解される語として用いた。原文の現在時制に合わせて「入ります」「ささげるのです」とし、一般的な祭儀の規定を述べる調子を保った。
