source:
  edition: SBLGNT
  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: ja
  text: 契約は、死者が関わる場合に有効である[a][b]。それを定めた者が生きている間は、決して効力を持たないからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「遺言は、死後に初めて有効となる。それを定めた者が生きている間は、決して効力を持たないからである」。ギリシア語の「ディアテーケー」は、「契約」と「遺言」のどちらも意味し得る。
    reason: alternative_reading
  - marker: b
    text: 「死者が関わる場合」に当たるギリシア語は簡潔で、遺言との関連では死者を、契約との関連では契約制定に伴う死（犠牲の死）を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: 契約
  rationale: ヘブライ人への手紙8～10章ではモーセの契約、血、契約の制定が中心であるため、本文では文脈上の基本義である「契約」を採用した。ただし、この語は「遺言」も意味し得るので、脚注に別訳を示した。
- source_word: ἐπὶ νεκροῖς
  choice: 死者があって
  rationale: 直訳的には「死者の上で」という簡潔で省略のある句。「死者があって」は、遺言者の死を指す可能性と、契約制定に伴う犠牲の死を指す可能性を一方に限定せず、現代日本語として理解できる形で保つ。
- source_word: βεβαία
  choice: 有効となる
  rationale: ここでは単なる確実さより、契約または遺言が法的・契約的な効力を持つことを表す。
- source_word: ἐπεὶ
  choice: からである
  rationale: 前の命題の理由を導く因果関係を明確に表す。
- source_word: μήποτε
  choice: 決して…ない
  rationale: この文脈では ἰσχύει と結びつき、「いつであっても効力を持たない」という強い否定を表す。
- source_word: ἰσχύει
  choice: 効力を持たない
  rationale: 契約または遺言が発効し、拘束力を持つという法的・制度的な意味を自然な日本語で表す。
- source_word: ὅτε ζῇ
  choice: 生きている間は
  rationale: 死者との対照を明瞭にし、継続する生存期間を自然に表す。
- source_word: ὁ διαθέμενος
  choice: それを定めた者
  rationale: 「契約を定めた者」と「遺言をした者」の双方を含み得る分詞なので、どちらかに限定しない表現を採用した。
theological_decisions:
- issue: διαθήκη を「契約」と「遺言」のどちらに訳すか
  choice: 本文では「契約」とし、「遺言」を脚注の別訳として示す。
  alternative: 本文を「遺言」と訳す。
  rationale: 8～10章全体の契約と犠牲の血という文脈を尊重しつつ、9:16～17に認められる遺言的・法的な読みも排除せず、真正な解釈上の緊張を脚注に保存する。
- issue: ἐπὶ νεκροῖς の省略された意味をどこまで明示するか
  choice: 「死者があって」とし、死者または死の関与を開いたままにする。
  alternative: 「人が死んだ後に」、または「死んだ犠牲の上に」と明示する。
  rationale: ギリシア語は簡潔で、遺言者の死と契約制定に伴う犠牲の死のどちらを指すかが論争されているため、本文で一方に決めない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「死者があって」は通常よりやや圧縮された表現だが、原文の意図的な簡潔さと解釈上の曖昧さを保つために採用した。「それを定めた者」によって、契約制定者と遺言者の両義性を維持した。
