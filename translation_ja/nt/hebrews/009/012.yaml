id: HEB.9.12
reference: Hebrews 9:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: ja
  text: また、雄やぎと子牛の血によってではなく、ご自身の血によって、永遠の贖いを成し遂げて、ただ一度限り聖所[a]に入られました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「聖なる所々」。祭儀的な表現として「聖域」とも訳せます。「至聖所」とする訳もありますが、原文そのものはそこまで限定していません。
    reason: 原文の複数形と、この祭儀的表現が指す範囲についての解釈上の幅を示すため。
lexical_decisions:
- source_word: οὐδὲ
  choice: また、……によってではなく
  rationale: 前節から続くつながりを「また」で示しつつ、後続の「むしろ」に相当する対比を日本語では「ではなく、……によって」と自然に表した。
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: 雄やぎと子牛の血によって
  rationale: διά＋属格の手段・媒介の意味を「によって」で表し、後半の同じ前置詞との対照を保った。μόσχωνはここでは「子牛」とした。
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: ご自身の血によって
  rationale: 反復されるδιάを同じ「によって」で訳し、ἰδίουの所有の強調は、キリストへの敬意を伴う自然な現代日本語「ご自身の」で表した。
- source_word: εἰσῆλθεν
  choice: 入り
  rationale: 完了した一回的な行為を表すアオリストであり、聖所の比喩に合う簡潔な「入る」を用いた。文末の敬語表現とつないでいる。
- source_word: ἐφάπαξ
  choice: ただ一度
  rationale: 単に一回というだけでなく、決定的で反復されない行為というヘブライ書での含意を、簡潔で自然な「ただ一度」で表した。
- source_word: εἰς τὰ ἅγια
  choice: 聖所
  rationale: ギリシア語は中性複数形だが、祭儀的用法では聖域全体を指し得る。日本語で不自然な複数表現を避けつつ、「至聖所」と限定しない「聖所」を採用した。
- source_word: αἰωνίαν λύτρωσιν
  choice: 永遠の贖い
  rationale: 永続的な効力を持つ贖いという意味を、定着した明瞭な表現で訳した。
- source_word: εὑράμενος
  choice: 成し遂げられました
  rationale: 字義的には「見いだして」だが、この文脈では贖いを獲得・確保することを意味する。「贖いを得る」ではキリスト自身が贖われるとの誤解を招き得るため、文脈上の達成の意味を自然な日本語で表した。
theological_decisions:
- issue: キリストがご自身の血によって入ったことの意味
  choice: 動物の血ではなく、ご自身の血を媒介・手段として聖所に入ったという対比を保った。
  alternative: 血を文字どおり携えて提示した、または単に血を流した後に入ったと明示する。
  rationale: 反復されるδιά＋属格を一貫して「によって」と訳し、レビ的犠牲との類型的対比を保つ一方、天上の聖所で血がどのように提示されたかという、本文が明示しない仕組みは訳文に持ち込まなかった。
- issue: τὰ ἅγιαの範囲
  choice: 「至聖所」ではなく「聖所」とした。
  alternative: 「聖なる場所々」または「至聖所」。
  rationale: 原文は複数形で、祭儀的に聖域を指し得るが、「至聖所」とすると解釈を過度に限定する。「聖所」は日本語として自然でありながら、その範囲を決めすぎない。
- issue: εὑράμενοςと主動詞の関係
  choice: キリストの一回的な入場と永遠の贖いの達成を一続きの出来事として訳した。
  alternative: 「永遠の贖いを得てから入った」と時間的先行を強く明示する。
  rationale: アオリスト分詞は先行を示し得るが、ここで厳密な時間順序を日本語に補う必要はない。訳文は両者の密接な関係を保ちつつ、本文以上に順序を固定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、礼拝・聖書朗読にも耐える品位を保った。キリストを指す表現には「ご自身」「入られました」を用いたが、過度に古風な敬語や教派固有の用語は避けた。「贖い」は中心的な祭儀・救済概念を保持するため採用した。
