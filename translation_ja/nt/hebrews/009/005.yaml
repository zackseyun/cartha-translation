  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: ja
  text: その上には、栄光のケルビムが贖罪所[a]を覆っていました。これらについては、今は一つ一つ詳しく述べることはできません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 契約の箱の蓋を指す。「恵みの座」とも訳せる。
    reason: ἱλαστήριον はこの文脈では契約の箱の覆いを指す祭具名であり、訳語の伝統的な別表現を示すため。
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: その上には
  rationale: 女性単数代名詞は直前の契約の箱を指す。日本語では指示語で自然に受け、空間的位置を明確にした。
- source_word: Χερουβὶν δόξης
  choice: 栄光のケルビム
  rationale: 属格表現の簡潔さと、神の栄光との関係を断定しすぎない曖昧さを保った。ケルビムは定着した聖書用語である。
- source_word: κατασκιάζοντα
  choice: 覆っていました
  rationale: ケルビムが翼を広げて箱の覆いの上を覆う配置を、自然な現代日本語で表した。単に影を落とすとの限定は避けた。
- source_word: τὸ ἱλαστήριον
  choice: 贖いの座
  rationale: この箇所では契約の箱の蓋という具体物を指しつつ、罪の贖いが行われる祭儀的機能も帯びる。日本語の伝統的な「贖罪所」より意味を把握しやすく、物体と神学的機能の双方を保てる表現とした。
- source_word: περὶ ὧν
  choice: これらについて
  rationale: 直前まで列挙された幕屋の調度を広く受ける自然な表現。
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: 今、詳しく述べることはできません
  rationale: κατὰ μέροςの「一つ一つ／詳細に」という意味を簡潔に表し、現在の論述では詳説できないという修辞的な留保を保った。
theological_decisions:
- issue: ἱλαστήριον の祭具としての指示対象と贖罪的含意
  choice: 贖いの座
  alternative: 贖罪所／恵みの座／契約の箱の蓋
  rationale: 文脈上は契約の箱を覆う蓋そのものだが、この語には贖罪儀礼との結びつきがある。「贖いの座」は具体的な祭具であることを示しながら、その神学的含意も消さない。脚注で物理的指示対象と他の訳語を明示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「ケルビム」は聖書語として保持し、「贖いの座」は読者が祭具と贖罪的機能の双方を捉えられるよう選んだ。
