  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: ja
  text: また、大祭司が年ごとに他者の血を携えて聖所[a]に入るように、何度もご自身を献げるためでもありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聖なる場所」（複数形）。この祭儀的文脈では、「至聖所」を指すと理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: また、…ためでもありません
  rationale: 前節から続く否定された目的を、現代日本語で自然に示す。
- source_word: πολλάκις
  choice: 何度も
  rationale: 大祭司の年ごとの反復と対照をなす、繰り返しの意味を明確に表す。
- source_word: προσφέρῃ ἑαυτόν
  choice: ご自分を献げる
  rationale: προσφέρωの犠牲を献げる意味と、再帰代名詞の強調を保つ。文脈上のキリストへの敬意を「ご自分」で示す。
- source_word: ὥσπερ
  choice: …ように
  rationale: 大祭司の慣例的行為との比較を、日本語として滑らかに示す。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: ユダヤ祭儀における職名の標準的な訳語。
- source_word: εἰσέρχεται
  choice: 入る
  rationale: 大祭司の慣例的行為を表す現在形の趣旨を保つ。
- source_word: εἰς τὰ ἅγια
  choice: 聖所
  rationale: ヘブライ人への手紙の祭儀的文脈に合う自然な訳語。ギリシア語の複数形や「至聖所」の可能性は脚注で示す。
- source_word: κατ’ ἐνιαυτὸν
  choice: 年ごとに
  rationale: 毎年繰り返される祭儀を簡潔かつ自然に表す。
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: 自分のものではない血を携えて
  rationale: 血が大祭司自身のものではないという対照を明示し、血を伴って入る祭儀的場面を自然な日本語で表す。
theological_decisions:
- issue: キリストと大祭司の比較の焦点
  choice: キリストが何度もご自分を献げるのではないことを、大祭司が自分以外の血を携えて毎年入ることと対照させる。
  alternative: 「聖所」をより限定して「至聖所」と訳す。
  rationale: 本文にある反復性と、キリスト自身の献身および大祭司が用いる別の血との対照を保ちつつ、「τὰ ἅγια」が指す場所を本文で過度に限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。前節に続く文であることを「また」で示し、原文の比較構造と祭儀的対照を保った。
