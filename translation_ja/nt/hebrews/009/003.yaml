  yaml_path: translation/nt/hebrews/009/003.yaml
  text: And behind the second curtain was a tabernacle called the Most Holy Place,[a]
translation:
  language: ja
  text: また、第二の垂れ幕の奥には、「最も聖なる所」[a]と呼ばれる幕屋の一区画がありました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「至聖所」。直訳すると「聖なるものの中の聖なるもの」。
    reason: 語義上の別訳と伝統的表現を示すため。
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: 第二の垂れ幕の奥には
  rationale: μετά＋対格はここでは聖所内の空間的位置を示す。「後」では時間的にも読めるため、「奥」として内側にあることを明確にした。καταπέτασμαは内側を仕切る幕を指すので、現代日本語で自然な「垂れ幕」とした。
- source_word: δὲ
  choice: また
  rationale: 強い逆接ではなく、幕屋内部についての説明を先へ進める緩やかな接続であるため。
- source_word: σκηνὴ
  choice: 幕屋
  rationale: この文脈では幕屋の内側の一区画を指すが、原語はσκηνήであり、祭儀的背景を保つため「部屋」と意訳せず「幕屋」とした。
- source_word: ἡ λεγομένη
  choice: と呼ばれる
  rationale: 名称を示す連体的分詞を、自然な現代日本語で表した。
- source_word: Ἅγια Ἁγίων
  choice: 最も聖なる所
  rationale: セム語的な最上級表現「聖なるものの中の聖なるもの」の意味を、普通の読者に明瞭な日本語で表した。伝統的な名称は脚注に残した。
theological_decisions:
- issue: Ἅγια Ἁγίωνという聖所名称の訳し方
  choice: 最も聖なる所
  alternative: 至聖所／聖なるものの中の聖なるもの
  rationale: 幕屋の最奥部を指す祭儀上重要な表現である。本文では意味が直ちに伝わる訳を採り、伝統的な用語と原語の表現形式を脚注で示すことで、解釈を狭めず透明性を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ありました」は前後の幕屋描写に合う叙述調とし、「奥」を用いて空間関係を自然に示した。
