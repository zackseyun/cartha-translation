revisions:
- from: キリストは、人の手で造られた聖所、すなわち真のものの写しに入られたのではなく、天そのものに入られたのです。それは今、私たちのために神の御前に現れるためでした。[a]
  to: キリストは、真のものの写しである、人の手で造られた聖所に入られたのではなく、今、私たちのために神の御前に現れるために、天そのものに入られたのです。[a]
  rationale: 二文に分かれていた後半を主節に結び、「今」が神の御前に現れることにかかる原文の関係を明瞭にした。「真のものの写しである」を「人の手で造られた聖所」に係らせ、ἀντίτυπα τῶν ἀληθινῶνがその聖所を説明する関係も日本語で明確にした。意味の限定や教理的な付加はしていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:06:23Z'
review_pass:
  verdict: revise
  source_fidelity: 原文の対比（人の手で造られた聖所ではなく天そのもの）と、天に入られた目的（今、神の御前に私たちのために現れること）は適切に捉えている。「聖所」は複数形ἅγιαを祭儀文脈に即して集合的に表す自然な訳であり、「真のものの写し」もἀντίτυπα τῶν ἀληθινῶνの対応関係を過度に限定しない。もっとも、「それは今、…現れるためでした」は、νῦνと不定詞の目的関係を二文に分けるため、現在的な意義がやや弱まり、文としても不自然になる。
  naturalness: 全体として明瞭で荘重な現代標準日本語である。ただし後半の「それは今、私たちのために神の御前に現れるためでした」は指示語「それは」の受け先が曖昧で、「今」と過去形「でした」の組み合わせもぎこちない。目的節を「天そのものに入られた」の近くに置くと、原文の構造と日本語の流れの双方が改善する。
  terminology: 「キリスト」「聖所」「神の御前」は日本語聖書の用語として定着し、ここでも適切である。「私たちのために」はὑπὲρ ἡμῶνの広い代表的・恩恵的含意を保持しており、「私たちに代わって」と狭めない点でよい。脚注の「神の顔の前に」はτῷ προσώπῳ τοῦ θεοῦの直訳的背景を正確に示している。
  issues:
  - severity: medium
    issue: 目的節の分離と時制表現
    rationale: 「それは今、…現れるためでした」は、原文のνῦν ἐμφανισθῆναι（今、現れるために）を不自然な過去の説明として響かせる。目的節を主節に接続して、現在的な目的・働きを明確にするのが安全である。
  revised_text: キリストは、真のものの写しである、人の手で造られた聖所に入られたのではなく、今、私たちのために神の御前に現れるために、天そのものに入られたのです。[a]
  revised_footnotes:
