id: HEB.9.24
reference: Hebrews 9:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: ja
  text: キリストは、真のものの写しである、人の手で造られた聖所に入られたのではなく、今、私たちのために神の御前に現れるために、天そのものに入られたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の御前に」は、直訳では「神の顔の前に」。
    reason: 原文の比喩的表現を示すため。
lexical_decisions:
- source_word: Χριστός
  choice: キリスト
  rationale: 現代日本語の聖書用語として自然で定着しており、この箇所ではメシアとしての職務を担う称号として用いられている。
- source_word: χειροποίητα ἅγια
  choice: 人の手で造られた聖所
  rationale: χειροποίητα の人為的に造られたという対比を保ちつつ、祭儀的文脈の中性複数 ἅγια を日本語で自然な集合的単数「聖所」とした。
- source_word: ἀντίτυπα τῶν ἀληθινῶν
  choice: 真のものの写し
  rationale: 地上の聖所が天上の実体に対応するものだという意味を簡潔に表し、「真のもの」という原文の複数実詞的表現を過度に具体化しない。
- source_word: αὐτὸν τὸν οὐρανόν
  choice: 天そのもの
  rationale: 強意を「そのもの」で示し、人造の聖所との直接的な対照を保つ。
- source_word: νῦν ἐμφανισθῆναι
  choice: 今、…現れるため
  rationale: νῦν の時間的要素と、不定詞が示す入った目的を保持する。「現れる」は受動形の形態を無理なく日本語化する。
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: 神の御前に
  rationale: 直訳的には「神の顔の前に」だが、日本語では人格的な臨在と直接の接近を自然かつ荘重に示す。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 代理・代表を含みうる ὑπέρ を自然な日本語で表し、特定の贖罪理論に狭めない。
theological_decisions:
- issue: ἅγια の数と祭儀的意味
  choice: 集合的に「聖所」と訳す
  alternative: 「聖なる所々」「至聖所」
  rationale: 原語は複数形だが、ヘブライ人への手紙では聖域全体を指す祭儀用語として用いられうる。日本語の「聖所」はその意味を自然に伝え、「至聖所」と限定する解釈を避ける。
- issue: Χριστός の称号性
  choice: 「キリスト」と訳す
  alternative: 「メシア」
  rationale: 称号としての意味を認めつつ、日本語で定着した表現を採用する。固有名だけに還元せず、文脈上の祭司的・救済史的役割を保つ。
- issue: ὑπὲρ ἡμῶν の代表的含意
  choice: 「私たちのために」と訳す
  alternative: 「私たちに代わって」
  rationale: 原文は恩恵・代表・代理の含みを持つが、「代わって」だけでは代理の意味を確定しすぎるため、幅を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祭儀的文脈にふさわしい荘重さを保った。「入られたのです／ためでした」で文の論理を明示し、原文の対比と目的関係を読み取りやすくした。
