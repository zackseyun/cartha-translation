id: HEB.9.15
reference: Hebrews 9:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: ja
  text: こういうわけで、キリストは新しい契約[a]の仲介者です。これは、最初の契約のもとで犯された違反から贖い出すために死が起こったことで、召された人々が永遠の相続財産という約束を受けることができるようになるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「契約」と訳したギリシア語は「遺言」とも訳せます。ヘブライ人への手紙9章16–17節では、この二つの意味の重なりが展開されますが、この節では「最初の契約」と対比されているため、「契約」が文脈に最もよく合います。
    reason: διαθήκηの「契約」と「遺言」という意味範囲、および後続節での語義の重なりを保持するため。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: こういうわけで
  rationale: 直前の議論を受ける因果的なつながりを、自然な現代日本語で示す。
- source_word: διαθήκης καινῆς
  choice: 新しい契約
  rationale: この節にある「最初の契約」との対比を優先した。「遺言」の意味もあり得るため脚注で保持した。
- source_word: μεσίτης
  choice: 仲介者
  rationale: 当事者の間に立って契約関係を成立させる者という意味を、簡潔かつ正確に表す。
- source_word: θανάτου γενομένου
  choice: 死が起こったので
  rationale: 属格独立構文が示す、死の発生とその結果を成り立たせる根拠との関係を保つ。原文がこの句で死の主体を明示していないことも保持した。
- source_word: ἀπολύτρωσιν
  choice: 贖う
  rationale: 代価を伴う解放という祭儀的文脈を、一般にも理解可能な聖書語で表す。
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: 最初の契約のもとで犯された違反
  rationale: ἐπί＋与格を契約の支配領域・時代を示す「もとで」と取り、παραβάσεωνの行為性を自然な日本語で明示した。
- source_word: οἱ κεκλημένοι
  choice: 召された人々
  rationale: 完了受動分詞が示す、すでに召されてその状態にある人々という意味を簡潔に表す。
- source_word: τὴν ἐπαγγελίαν … τῆς αἰωνίου κληρονομίας
  choice: 永遠の相続財産の約束
  rationale: 目的語が「約束」であるという原文の構造を保ち、その内容が永遠の相続財産であることを示す。
theological_decisions:
- issue: ἐστίνの省略された主語
  choice: 「キリストは」と明示
  alternative: 主語を省略する／「この方は」とする
  rationale: 直前の文脈における明確な指示対象はキリストであり、現代日本語で節の論旨を明瞭にするため名を補った。
- issue: διαθήκηの意味
  choice: 本文では「契約」
  alternative: 「遺言」
  rationale: 新しい契約と最初の契約の対比がこの節の中心である。一方、続く9章16–17節で活用される「遺言」の語義は脚注に残し、意味の重なりを消さないようにした。
- issue: θανάτου γενομένουにおける死の明示性
  choice: 「死が起こった」とし、本文中では「キリストの死」と限定しない
  alternative: 「キリストが死なれたので」
  rationale: 文脈上はキリストの死を指すが、この句自体は主体を明示せず「死が生じた」と述べるため、その表現上の余地を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「仲介者」「贖う」「相続財産」など本文の契約的・祭儀的論旨に必要な語は保持した。文体は説明的になりすぎない、落ち着いた敬体とした。
