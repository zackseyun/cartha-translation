revisions:
- from: 'こういうわけで、キリストは新しい契約[a]の仲介者です。それは、最初の契約のもとで犯された違反を贖うために死が起こったので、召された人々が永遠の相続財産の約束を受けるためです。


    [a] 「契約」と訳したギリシア語は「遺言」とも訳せます。ヘブライ人への手紙9章16–17節では、この二つの意味の重なりが展開されますが、この節では「最初の契約」と対比されているため、「契約」が文脈に最もよく合います。'
  to: こういうわけで、キリストは新しい契約[a]の仲介者です。これは、最初の契約のもとで犯された違反から贖い出すために死が起こったことで、召された人々が永遠の相続財産という約束を受けることができるようになるためです。
  rationale: 原文の目的構文（ὅπως）を日本語で明瞭にし、ἀπολύτρωσιςと「違反」の関係を自然かつ忠実に表すために、「違反を贖う」を「違反から贖い出す」に改めました。「死が起こった」は、θανάτου γενομένουが死の主体を明示しない表現であることを保持しています。脚注は内容・アンカーともに適切なため維持しました。
