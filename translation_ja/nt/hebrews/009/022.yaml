  source_fidelity: 原文の語順を不自然に模倣せず、κατὰ τὸν νόμον（「律法によれば」）、σχεδόν（「ほとんど」）、ἐν αἵματι（「血によって」）、καθαρίζεται（「清められます」）を適切に反映している。後半も、χωρὶς αἱματεκχυσίας（「血が流されることなしには」）とοὐ γίνεται ἄφεσις（「赦しはありません」）を過不足なく訳している。原文の「ほとんど」による限定も保持されている。
  naturalness: 明瞭で自然な現代標準日本語であり、祭儀的・格言的な文脈にふさわしい格調も保たれている。「また」による二節の接続、および「血が流されることなしには、赦しはありません」という構文はいずれも読みやすい。
  terminology: 「律法」「清められます」「血によって」「赦し」は文脈に即した一貫した訳語である。「赦し」はἄφεσιςのこの文脈で最も明快な訳であり、脚注は「赦免」を代替訳として示しつつ、より広い語義にも簡潔に触れている。特定教派の解釈を持ち込んでいない。
