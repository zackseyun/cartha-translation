id: HEB.9.22
reference: Hebrews 9:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: ja
  text: 律法によれば、ほとんどすべてのものが血によって清められます。また、血が流されることなしには、赦し[a]はありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「赦免」。このギリシア語は解放や免除を表すこともありますが、ここでは罪の赦しを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: ほとんど
  rationale: 断定の範囲を限定する副詞として、律法のもとでの清めが例外なくすべて血によるとは述べていない点を保つ。
- source_word: ἐν αἵματι
  choice: 血によって
  rationale: ἐν の手段を表す用法を自然な日本語で示し、儀礼的な清めの手段が血であることを明確にする。
- source_word: πάντα
  choice: すべてのものが
  rationale: 中性複数の広い指示範囲を保ち、直前の「ほとんど」による限定を受ける自然な表現とした。
- source_word: καθαρίζεται
  choice: 清められます
  rationale: 現在受動形が示す律法上の一般的・慣例的な行為を表し、祭儀的意味を保持する。
- source_word: κατὰ τὸν νόμον
  choice: 律法によれば
  rationale: モーセ律法の規定・原則に沿うことを示す κατά の意味を、簡潔で自然な現代日本語にした。
- source_word: χωρὶς
  choice: なしには
  rationale: 何かを欠いた状態を条件的に示す原文の意味を、後続する否定文と自然につないだ。
- source_word: αἱματεκχυσίας
  choice: 血が流されること
  rationale: 血を注ぎ出すことを指す語の意味と犠牲の文脈を保ちつつ、日本語で過度に硬くならない表現とした。
- source_word: οὐ γίνεται
  choice: ありません
  rationale: 抽象名詞 ἄφεσις と結びついて、それが成立・実現しないことを表す。日本語では「ありません」が格言的な文脈に最も自然である。
- source_word: ἄφεσις
  choice: 赦し
  rationale: 解放・免除・赦免を含みうる語だが、この犠牲と罪の文脈では「赦し」が明瞭かつ自然である。
theological_decisions:
- issue: 犠牲の文脈における ἄφεσις の訳語
  choice: 赦し
  alternative: 赦免、解放
  rationale: この箇所では罪に関する赦しを指すが、特定の教派的体系を加えず、現代の読者に通じる語を選んだ。語そのものが持つより広い意味は脚注で示した。
- issue: 「ほとんど」が限定する範囲
  choice: 「すべてのもの」を限定する
  alternative: 律法に基づく清め全体を無限定に述べる
  rationale: σχεδόν を明示して、律法下の清めには血を用いない事例もありうるという原文の限定を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二つの節を「また」で結び、原文の並列関係を示した。脚注記号は説明対象である「赦し」の直後に置いた。
