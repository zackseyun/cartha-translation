source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: ja
  text: というのは、モーセが律法に従ってすべての戒めを民全体に告げた後、水、緋色の羊毛、ヒソプとともに子牛たち[a]の血を取り、巻物そのものにも、民全体にも振りかけたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「若い雄牛」とも訳せる。ギリシア語は、いけにえの文脈で子牛または若い雄牛を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: すべての戒めが……告げられた後
  rationale: 属格独立構文を時間的な先行関係として自然な日本語にし、πάσηςの包括性とἐντολῆςの個々の戒めという意味を保った。γάρは前後の論証を受ける語だが、単節提示では不自然な「というのは」を避け、文脈上のつながりに委ねた。
- source_word: κατὰ τὸν νόμον
  choice: 律法に従って
  rationale: κατά＋対格が示す規準・一致を、明瞭で自然な日本語で表した。
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: モーセによって民全体に
  rationale: ὑπόの行為者と、παντίが示す聞き手の全体性を明示した。
- source_word: λαβὼν τὸ αἷμα τῶν μόσχων
  choice: モーセは……子牛の血を取り
  rationale: 分詞を日本語の叙述順に沿う定形表現にし、主語を補って明確にした。μόσχωνは複数だが、日本語の「子牛の血」は数を不自然に強調せず集合的に理解できる。別訳可能性は脚注に残した。
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: 水、緋色の羊毛、ヒソプとともに
  rationale: μετάの随伴・儀式的な組み合わせを「とともに」で保ち、ἔριον κοκκίνουを具体的に「緋色の羊毛」と訳した。
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: 巻物そのものと民全体とに
  rationale: τε……καίの並列を「と……と」で示し、αὐτόの強意を「そのもの」で保持した。βιβλίονは当時の物理的形態と契約文書という文脈に即して「巻物」とした。
- source_word: ἐράντισεν
  choice: 振りかけました
  rationale: 儀式的な散布を表す標準的で理解しやすい現代日本語を用いた。
theological_decisions:
- issue: 出エジプト記24章の叙述との関係、およびμόσχωνの訳
  choice: ヘブライ人への手紙のギリシア語本文をそのまま訳し、本文では「子牛」、別訳を脚注に示す
  alternative: 「若い雄牛」と本文で訳す、または出エジプト記の儀式背景を本文に補う
  rationale: 著者の圧縮された叙述を旧約本文に合わせて調整せず、本文固有の表現と曖昧さを保持するため。
- issue: 巻物に血を振りかけたという記述
  choice: αὐτό τε τὸ βιβλίονを省略・調和せず「巻物そのもの」と明記する
  alternative: 出エジプト記24章の叙述に合わせて弱める、または説明を補足する
  rationale: 旧約の参照箇所との細部の相違を翻訳段階で解消せず、ヘブライ人への手紙の記述を忠実に提示するため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、儀式的・聖書的な品位を保った。「緋色」「ヒソプ」「巻物」は具体的な祭儀の像を残すため維持し、文末は本文全体に適合しやすい丁寧体とした。
