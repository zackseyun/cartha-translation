revisions:
- from: 律法に従って、すべての戒めがモーセによって民全体に告げられた後、モーセは、水、緋色の羊毛、ヒソプとともに子牛[a]の血を取り、巻物そのものと民全体とに振りかけました。
  to: というのは、モーセが律法に従ってすべての戒めを民全体に告げた後、水、緋色の羊毛、ヒソプとともに子牛たち[a]の血を取り、巻物そのものにも、民全体にも振りかけたからです。
  rationale: 能動文にして、モーセが戒めを告げ、その後に血を取って散布したという原文の行為連鎖を明瞭にした。「というのは」と「からです」によりγάρの説明的・論証的な接続を反映した。μόσχωνの複数形は「子牛たち」とし、散布対象の並列は「にも…にも」で自然に表した。旧約の叙述との相違を調和させたり、儀式の説明を追加したりはしていない。
