id: HEB.9.26
reference: Hebrews 9:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: ja
  text: そうでなければ、世界が造られて以来、彼は何度も苦しみを受けなければならなかったはずです。しかし実際には、諸時代の終わりに[a]、罪を取り除くために[b]、ご自身の犠牲によって[c]、ただ一度、現れたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸時代の完成の時に」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「罪を廃するために」「罪を無効にするために」。
    reason: lexical_alternative
  - marker: c
    text: 「ご自身をいけにえとすることによって」とも訳せる。直訳は「ご自身の犠牲によって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: そうでなければ
  rationale: 直前の議論を受け、キリストが繰り返しご自身を献げるのであれば生じるはずの帰結を示すため。
- source_word: ἔδει
  choice: 受けなければならなかったはずです
  rationale: 未完了過去形が示す、現実には成立しなかった仮定上の必要を自然な日本語で表した。
- source_word: πολλάκις ... ἅπαξ
  choice: 何度も……ただ一度
  rationale: 反復と一回性の明確な対照を保った。「ただ一度」は文脈上、その決定的で反復されない性格も伝える。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 世界の基が据えられて以来
  rationale: 世界の創設を起点とする時間的意味を保ちつつ、原文の比喩を明瞭に表した。
- source_word: νυνὶ δὲ
  choice: しかし実際には
  rationale: 仮定上の帰結と現実との強い対照を表す。単なる時間的な「しかし今」より、文脈上の論証を明確にする。
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: 諸時代が完成する時に
  rationale: 複数形の「諸時代」と、単なる終了だけでなく完成・成就を含む συντέλεια の意味を保持した。
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: 罪を取り除くために
  rationale: ἀθέτησις の「廃する、無効にする、除去する」という強い意味を、理解しやすい日本語で表した。ἁμαρτίας は原文どおり単数集合的な「罪」とした。
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: ご自身の犠牲によって
  rationale: 「彼の犠牲」と「彼自身を犠牲とすること」の両方を含み得る属格の簡潔さを保ち、文脈上の自己献呈も伝わる表現とした。
- source_word: πεφανέρωται
  choice: 現れたのです
  rationale: 完了形が示す決定的な出現と現在に及ぶ意義を、対照を強調する説明調の語尾で表した。
theological_decisions:
- issue: ἅπαξ が示すキリストの犠牲の一回性
  choice: 「ただ一度」と訳し、何度も繰り返すこととの対照を明示した。
  alternative: 一度
  rationale: 直前の πολλάκις（何度も）との対比とヘブライ書9章の論旨から、決定的で反復されない一回性が認められるが、「一度限り」のように解釈を過度に前面化しない表現を選んだ。
- issue: 単数形 ἁμαρτίας の範囲
  choice: 抽象的・集合的な単数「罪」とした。
  alternative: 罪々／数々の罪
  rationale: 原文は個々の違反行為だけでなく、キリストの犠牲によって処理される現実としての罪を単数で提示しているため。
- issue: θυσίας αὐτοῦ における属格の意味
  choice: 「ご自身の犠牲」とし、原文の簡潔さと一定の曖昧さを保持した。
  alternative: ご自身をいけにえとして献げること
  rationale: 文脈はキリストご自身が献げられることを強く示す一方、この句自体は字義上「彼の犠牲」とも読めるため、本文で一方だけに限定せず脚注で明示した。
translation_notes:
  register: 明瞭で現代的な敬体を用いた。論証の流れが自然に伝わるよう「そうでなければ」「しかし実際には」としつつ、「世界の基」「諸時代」など原文の重みある表現を保持した。
