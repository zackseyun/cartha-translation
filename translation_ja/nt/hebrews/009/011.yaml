id: HEB.9.11
reference: Hebrews 9:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: ja
  text: しかし、メシアは、すでに到来した良いものの大祭司として来られた。[a] より偉大で、より完全な、人の手で造られたものではない、すなわち、この被造世界に属するものではない幕屋を通って――[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「やがて来る良いもの」とあります。
    reason: textual_variant
  - marker: b
    text: または、「しかし、メシアが、すでに到来した良いものの大祭司として現れたとき、より偉大で、より完全な、人の手で造られたものではない、すなわち、この被造世界に属するものではない幕屋を通って――」とも訳せます。
    reason: previous_rendering
lexical_decisions:
- source_word: Χριστὸς
  choice: メシア
  rationale: この文脈では固有名というより称号としての働きが明確であるため、「キリスト」ではなく称号性を表す「メシア」とした。
- source_word: δὲ
  choice: しかし
  rationale: 前段の地上の幕屋と祭司職についての説明に対し、メシアの祭司職を対照的に導入する接続を明示した。
- source_word: παραγενόμενος
  choice: 来られた
  rationale: メシアが大祭司として到来したことを表すアオリスト分詞。日本語では主節的に表し、次節へ続く長いギリシア語構文を読みやすくした。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: ヘブライ人への手紙における祭儀的職務を表す標準的で正確な訳語。
- source_word: τῶν γενομένων ἀγαθῶν
  choice: すでに到来した良いもの
  rationale: SBLGNT本文のγενομένων（到来した／生じた）に従い、μελλόντων（やがて来る）とは訳さない。「すでに」は完了した到来を自然な日本語で示す。
- source_word: διὰ τῆς ... σκηνῆς
  choice: 幕屋を通って
  rationale: διά＋属格の通過経路を保ち、σκηνήが喚起する荒野の聖所との関連を「幕屋」で示した。この句は次節の「入られた」へ続く構文として開いたままにした。
- source_word: μείζονος καὶ τελειοτέρας
  choice: さらに偉大で、さらに完全な
  rationale: 比較級を明示し、単なる物理的な大きさではなく卓越性を表す「偉大」と、ヘブライ書で重要な完成・完全の語彙を保つ「完全」を用いた。
- source_word: οὐ χειροποιήτου
  choice: 人の手で造られたものではなく
  rationale: 人間の製作による地上の聖所との対照を、自然でありながら聖書的響きのある表現で保持した。
- source_word: τοῦτ’ ἔστιν
  choice: すなわち
  rationale: 後続句が幕屋の性質を説明する言い換えであることを明確にした。
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: この被造世界に属するものではない
  rationale: κτίσιςを現在の被造秩序・世界として捉え、単に「この創造ではない」という不自然な表現を避けつつ所属関係を明示した。
theological_decisions:
- issue: τῶν γενομένων ἀγαθῶνの本文異読と終末論的時制
  choice: すでに到来した良いもの
  alternative: やがて来る良いもの
  rationale: 主本文はSBLGNTのγενομένωνに従い、メシアの祭司的働きによって到来した恵みを指す表現とした。一方、多くの写本にあるμελλόντωνは将来的な良いものを指すため、異読として脚注に残した。
- issue: διὰ τῆς ... σκηνῆςが係る動詞
  choice: 次節の「入られた」へ続く経路句として訳文を開いたままにする
  alternative: 「来られた」に直接つなげ、「幕屋を通って現れた」と読む
  rationale: ギリシア語ではこの前置詞句が9:12のεἰσῆλθενに係る可能性が高い。節単独では構文が完結しないことを破線で示し、幕屋がメシア到来の手段であるかのような誤読を避けた。ただし、分詞から連続して読む別の統語的取り方は脚注に示した。
translation_notes:
  register: 現代の一般読者に理解できる標準的で端正な文体とした。「メシア」「大祭司」「幕屋」は文脈上不可欠な聖書用語として保持した。原文が9:12へ続く未完の統語構造であるため、句点で意味を閉じ切らず、後半をダッシュで次節へ接続した。
