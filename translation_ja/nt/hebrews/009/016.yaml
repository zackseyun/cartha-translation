id: HEB.9.16
reference: Hebrews 9:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: ja
  text: というのは、契約[a]がある場合には、それを結んだ者の死が示されなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「遺言がある場合には、それを作成した者の死が示されなければなりません」。ギリシア語の「ディアテーケー」は「契約」と「遺言」のどちらも意味し得ます。16—17節では、法的な「遺言」の意味だと理解する人も多くいます。
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: 契約
  rationale: ヘブライ人への手紙8—10章の文脈では、エレミヤ書31章に基づく契約と、その血による制定が中心であるため、本文では「契約」とした。ただし、この語には「遺言」の意味もあり、16—17節を法的な遺言の意味に解する見方を脚注に残した。
- source_word: θάνατον
  choice: 死
  rationale: ここで論じられている現実の死を表す標準的で明瞭な訳語。
- source_word: ἀνάγκη
  choice: なければなりません
  rationale: 必要性を表す述語を、現代日本語として自然かつ明確に表した。
- source_word: φέρεσθαι
  choice: 示される
  rationale: 受動不定詞の「運ばれる、持ち出される」という基本像を踏まえ、死が提示され、効力を持つものとして示される必要を自然な日本語で表した。「立証される」と断定して法的意味に限定することは避けた。
- source_word: τοῦ διαθεμένου
  choice: それを結んだ者
  rationale: διατίθεμαιが契約を定める者を指すことを、本文の「契約」と自然に対応させた。「遺言者」として意味を限定しなかった。
- source_word: ὅπου γὰρ
  choice: があるところでは
  rationale: ὅπουの場所・場合を示す表現と、γάρの説明的なつながりを文脈上自然に示した。日本語では節冒頭の「というのは」を省いても説明関係が保たれる。
theological_decisions:
- issue: διαθήκηを「契約」とするか「遺言」とするか
  choice: 本文では「契約」とし、「遺言」を脚注に示す
  alternative: 「遺言がある場合、それを作成した者の死が確認されなければなりません」
  rationale: 直近の16—17節には遺言法を思わせる語義上の可能性がある一方、8—10章全体は新しい契約と犠牲の血を論じている。本文で契約の連続性を保ちつつ、脚注で法的な読みを明示して、原文の両義性と解釈上の緊張を保存した。
- issue: φέρεσθαιの意味を法的な「立証」と確定するか
  choice: 「示される」として、提示・証明の幅を残す
  alternative: 「立証される」または「持ち出される」
  rationale: 原語は字義的には「運ばれる、持ち出される」であり、この箇所では死が提示されることを指し得る。「示される」は読みやすさを保ちながら、法的意味だけに狭めない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体と敬体を採用した。「契約を結ぶ」は一般読者に自然であり、「死が示される」は原語の比喩を過度に字義的にせず、解釈を一つに固定しない表現である。
