  source_fidelity: 本文は、ἡ πρώτηを文脈に即して「第一の契約」と補い、δικαιώματα λατρείαςを「礼拝についての規定」、τό ἅγιον κοσμικόνを「地上の聖所」とする。いずれも原文の構文と語義を適切に反映している。「にも」はμὲν οὖνの控えめな強調・接続的な働きを自然な日本語で表している。
  naturalness: 「さて、第一の契約にも、礼拝についての規定と、地上の聖所がありました」は明瞭で自然な現代標準日本語であり、叙述としての品位も保たれている。読点も意味理解を妨げない。
