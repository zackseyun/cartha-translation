id: HEB.9.1
reference: Hebrews 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: ja
  text: さて、第一の契約にも、礼拝についての規定と、地上の聖所がありました[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「第一のもの」。文脈上は「第一の契約」を指すと考えられますが、「第一の仕組み」と広く理解することもできます。
    reason: alternative_reading
  - marker: b
    text: 別訳「この世に属する聖所」。ここでは、この章の後半に出てくる天上のものとの対照から、「地上の」という意味と考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: ありました
  rationale: 未完了過去形で、第一の契約に備わっていたものを導入する。現代日本語では「ありました」が自然で、単純な所有・存在の意味を保つ。
- source_word: μὲν οὖν
  choice: さて、…にも
  rationale: 前段を受けて論を進める移行と穏やかな強調を、「さて」と係助詞「も」で自然に表した。μὲν は後続の対照を予告する働きも持つ。
- source_word: ἡ πρώτη
  choice: 第一の契約
  rationale: 女性形の「第一の」は直前の8章13節にある契約を受けると考えられる。日本語で省略すると不明瞭なため、「契約」を補った。
- source_word: δικαιώματα
  choice: 規定
  rationale: 礼拝を律する定め・法規を指す。古風な「儀礼規定」などに狭めず、明瞭な現代語とした。
- source_word: λατρείας
  choice: 礼拝についての
  rationale: 祭儀的な奉仕・礼拝の領域を示す属格。「礼拝についての」は規定との関係を自然に表す。
- source_word: τό τε ἅγιον
  choice: 聖所
  rationale: 聖なる場所全体を指し、次節以降でその内部が説明されるため、特定の一室に限定しかねない「聖なる場所」より「聖所」が適切。
- source_word: κοσμικόν
  choice: 地上の
  rationale: 後段の天上の聖所との対照を示す語として訳した。現代日本語の「世俗的な」が帯びる道徳的な否定の含みを避ける。
theological_decisions:
- issue: ἡ πρώτη の省略された被修飾語
  choice: 第一の契約
  alternative: 第一のもの／第一の仕組み
  rationale: 直前の8章では古い契約と新しい契約が対比されており、「契約」が最も近い指示対象である。ただし原文には名詞そのものが明記されていないため、脚注で曖昧さを示した。
- issue: κοσμικόν の意味
  choice: 地上の
  alternative: この世に属する／世俗的な
  rationale: ここでの中心的対照は地上と天上であり、道徳的に汚れているという意味を持ち込まない訳を選んだ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「さて」で論述の移行を示し、「にも」で第一の契約にさえ規定と聖所があったという軽い強調を表現した。文末は本文全体の叙述に適した丁寧体とした。
