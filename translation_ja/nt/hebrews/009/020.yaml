  text: λέγων· Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/020.yaml
  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: ja
  text: こう言った。「これは、神があなたがたに命じた契約の血である。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: こう言いました
  rationale: 現在分詞で前節の動作に結びつきつつ引用を導く。日本語では独立した発話として自然に読めるよう定形動詞で表した。
- source_word: Τοῦτο
  choice: これは
  rationale: ギリシア語では繋辞が省略されているが、日本語では文末の「である」によって述語関係を明示する。
- source_word: αἷμα
  choice: 血
  rationale: 契約締結に用いられた犠牲の血を指す具体語なので、説明的に言い換えず直接訳した。
- source_word: διαθήκης
  choice: 契約
  rationale: 出エジプト記24章を背景とするため、遺言ではなく神と民との契約を表す。
- source_word: ἧς
  choice: （神があなたがたに命じられた）
  rationale: 属格の関係代名詞が「契約」を受ける構造を、日本語では連体修飾節として自然に表した。
- source_word: ἐνετείλατο
  choice: 命じられた
  rationale: ἐντέλλομαι の基本義である命令・指示を保ち、神への敬意を示す主体敬語とした。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたに
  rationale: 命令が民に向けられたことを表す πρός の方向性を直接保つ。日本語では「あなたがたのために」よりも動詞「命じる」と自然に結びつく。
- source_word: ὁ θεός
  choice: 神
  rationale: 標準的で簡潔な訳語。
theological_decisions:
- issue: 契約締結の文脈における διαθήκη の訳
  choice: 契約
  alternative: 遺言
  rationale: 出エジプト記24章8節への明白な言及であり、ここでは遺言という法的意味ではなく、神と民との契約を指す。
- issue: Τοῦτο の後に省略された繋辞の表現
  choice: これは……である
  alternative: これ、契約の血
  rationale: 原文に明示されない繋辞を日本語の判断文として補い、意味を加えずに述語関係を明確にした。
- issue: πρὸς ὑμᾶς の関係
  choice: あなたがたに命じられた
  alternative: あなたがたのために命じられた
  rationale: πρός の解釈には幅があるが、ἐντέλλομαι と結びつく宛先として読むのが構文上直接的であり、日本語でも自然である。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「こう言いました」で前節との連続を示し、引用自体は簡潔な「である」体として儀式的宣言の調子を保った。
