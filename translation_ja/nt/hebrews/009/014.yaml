id: HEB.9.14
reference: Hebrews 9:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: ja
  text: ましてどれほど、永遠の霊によって、傷のないご自身を神に献げたメシアの血は、私たちの良心を死んだ行いから清めて、生ける神に仕えるために役立つことでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「永遠の霊によって」は、神の霊を指すと考えられますが、「永遠の霊性をもって」などの意味に取ることもできます。
    reason: 原文の πνεύματος αἰωνίου は冠詞を欠き、指示対象と語義に実質的な曖昧さがあるため。
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: まして
  rationale: 直前との「ましてなお」の論法を、自然な現代日本語で簡潔に示す。
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: メシアの血
  rationale: αἷμα の犠牲的意味を保ち、Χριστός はここで称号として機能するため「メシア」とした。
- source_word: διὰ πνεύματος αἰωνίου
  choice: 永遠の霊によって
  rationale: διά の媒介を「によって」で示す。本文では神の霊を指す可能性が高いと読みつつ、日本語では表記上の曖昧さも残る。
- source_word: ἑαυτὸν προσήνεγκεν
  choice: ご自身を…献げた
  rationale: 祭儀的文脈に合う「献げた」を用い、再帰代名詞を保持した。
- source_word: ἄμωμον
  choice: 傷のない
  rationale: いけにえに欠陥がないという祭儀的含意を、平明な日本語で表す。
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: 私たちの良心を…清め
  rationale: 未来形の効力は文末の「ことでしょう」で表し、συνείδησις は標準的な「良心」とした。
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: 死んだ行いから
  rationale: 解釈を加えて「死に至る行い」などとせず、ヘブライ6:1との語句上の対応も保つ。
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: 生ける神に仕える者とする
  rationale: εἰς τό＋不定詞の目的・結果を自然に示し、λατρεύω の礼拝的奉仕を「仕える」で幅広く保つ。
theological_decisions:
- issue: πνεύματος αἰωνίου の指示対象
  choice: 神の永遠の霊を指す読みを本文に採る
  alternative: 永遠の霊によって／永遠の霊性をもって（キリスト自身の霊または霊的あり方）
  rationale: 神の霊を指す読みが有力だが、冠詞がなく文法的に別解も可能なため、脚注で曖昧さを明示する。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では油注がれた方という称号性が働いているため「メシア」とした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「献げる」「生ける神」は聖書的な祭儀・信仰の響きを保ちつつ、文全体は一般読者に理解しやすく整えた。
