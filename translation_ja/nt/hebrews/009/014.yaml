    rationale: ギリシア語は「生ける神に仕えるために」という目的を示す。「仕える者とする」は、清めの目的を保ちつつも、受け手の身分・変化を明示しており、原文より一歩踏み込む。
  - severity: low
    issue: πόσῳ μᾶλλον の比較的強調が「まして」ではやや弱い。
    rationale: 「ましてどれほど」とすれば、原文の「どれほどなおさら」の修辞的な力を、前節の文脈を知らない読者にも明確に伝えられる。
