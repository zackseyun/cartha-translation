  to: ましてどれほど、永遠の霊によって、傷のないご自身を神に献げたメシアの血は、私たちの良心を死んだ行いから清めて、生ける神に仕えるために役立つことでしょう。[a]
  rationale: 「仕える者とする」を、原文の εἰς τὸ λατρεύειν が示す目的に沿って「生ける神に仕えるために役立つ」と改めた。また、「ましてどれほど」により πόσῳ μᾶλλον の比較的強調を明示した。脚注は、πνεύματος αἰωνίου の解釈上の曖昧さを適切に保存しているため維持した。
