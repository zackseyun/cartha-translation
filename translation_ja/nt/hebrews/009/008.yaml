id: HEB.9.8
reference: Hebrews 9:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: ja
  text: 聖霊はこれによって、第一の幕屋がなお存続している間は、聖所に至る道[a]がまだ明らかにされていないことを示しておられます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖域に入る道」とも訳せる。文脈上、特に「至聖所に至る道」を指すと理解することもできる。
    reason: alternative_reading
  - marker: b
    text: 「第一の幕屋がなお立っている間は」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: 示しておられます
  rationale: 属格絶対の現在分詞が持つ、幕屋の仕組みを通して聖霊が今も意味を示しているという説明的・継続的な力を、自然で敬意ある現代日本語にした。
- source_word: πνεύματος τοῦ ἁγίου
  choice: 聖霊
  rationale: 新約聖書における標準的な指示対象を簡潔に表す。
- source_word: μήπω πεφανερῶσθαι
  choice: まだ明らかにされていない
  rationale: 完了受動不定詞が表す、いまだ開示された状態に至っていないという継続的状態を保った。
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: 聖所に至る道
  rationale: 幕屋と祭司の出入りを扱う文脈に即して空間的・祭儀的な意味に取り、ὁδόςが示す接近・到達の意味を「に至る」で自然に補った。複数形の範囲や至聖所への限定可能性は脚注で保持した。
- source_word: πρώτης σκηνῆς
  choice: 第一の幕屋
  rationale: 直前の幕屋の二つの区画の記述を受ける「第一」を保ち、祭儀的背景に適する「幕屋」を用いた。
- source_word: ἐχούσης στάσιν
  choice: なお存続している
  rationale: 単に物理的に建っていることだけでなく、制度として地位・効力を保つ可能性も含む στάσιν ἔχειν の幅を、日本語として自然な「存続している」で表した。
- source_word: ἔτι
  choice: なお
  rationale: 継続期間を表す語として、文体に合う簡潔な表現を選んだ。
theological_decisions:
- issue: τῶν ἁγίων の指示対象
  choice: 聖所への接近
  alternative: 聖なる人々の道
  rationale: 周囲の文脈は幕屋の構造と祭司の出入りを論じているため、人物ではなく聖なる空間を指すと判断した。
- issue: 聖所の範囲
  choice: 主文では「聖所」として広さを保つ
  alternative: 「至聖所」と限定する
  rationale: 文脈上は特に奥の区画が念頭にある可能性が高いが、ギリシア語 τῶν ἁγίων は複数形で、聖域全般を指し得る。主文で限定せず脚注に別解を示した。
- issue: 第一の幕屋の「存続」
  choice: 制度的効力も含み得る「存続している」
  alternative: 物理的な「立っている」
  rationale: στάσιν ἔχειν は存在・地位の継続を表し得るため、建物の物理的状態だけに狭めない訳を採用した。
translation_notes:
  register: 明快な現代標準語を用いながら、祭儀的文脈にふさわしい品位を保った。「示しておられます」は聖霊を主語とする自然な敬語表現。「聖所」は日本語では単複を明示しないため、原文の複数形が持つ範囲と至聖所に限定する可能性を脚注で補った。
