  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: ja
  text: したがって、天にあるものの写し[a]は、これらによって清められる[b]必要がありました。しかし、天にあるものそのものは、これらよりも優れたいけにえ[c]によって清められる必要がありました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「型」「模型」「表象」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「きよめられる」「浄化される」とも訳せます。ここでは祭儀上の清めを表す言葉です。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語では「いけにえ」は複数形です。ヘブライ人への手紙の文脈は、メシアがただ一度ご自身をささげたことを中心にしていますが、ここでは原文の複数形をそのまま尊重しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: したがって、…必要がありました
  rationale: οὖνの推論を「したがって」で示し、非人称的なἈνάγκηを自然な日本語の「必要がありました」とした。文脈上、地上の礼拝規定とキリストの働きを振り返って説明しているため、過去形が適切である。
- source_word: τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς
  choice: 天にあるものの写し
  rationale: ὑποδείγματαは、天上のものに対応する地上の表象を指す。「写し」は後半の「ものそのもの」との対比を明確にし、解釈を過度に加えない。複数形οὐρανοῖςは、日本語では慣用的かつ自然な「天」で表した。
- source_word: τούτοις
  choice: これらによって
  rationale: 手段を表す与格を「によって」で示した。指示語の具体的内容を本文で補わず、原文どおり「これら」として直前の文脈に委ねた。
- source_word: καθαρίζεσθαι
  choice: 清められる
  rationale: 受動形を保ち、祭儀的な清めを表す語として、現代日本語でも聖書文脈に自然な「清める」を用いた。
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: しかし、天にあるものそのものは
  rationale: δὲの対照を「しかし」で示し、強意のαὐτάを「そのもの」として保持した。「天上の現実」などの解釈的表現は避けた。
- source_word: κρείττοσι θυσίαις παρὰ ταύτας
  choice: これらにまさる、より良いいけにえによって
  rationale: 比較を表すπαράを「これらにまさる」で示し、ヘブライ人への手紙の主要語κρείττωνを「より良い」と訳した。θυσίαιςの複数形は、日本語では数が明示されにくいため脚注で明記し、単数の「いけにえ」と断定して調和させることを避けた。
theological_decisions:
- issue: 「天にあるもの」が清められるという表現
  choice: 原文の祭儀的表現を保ち、「天にあるものそのもの」が清められると訳した。
  alternative: 「天の聖所」または「天に属する人々」と特定する、あるいは天が清められるとの表現を避けて意訳する。
  rationale: 原文は地上の写しと天にあるものそのものを対比し、双方に清めの言葉を用いる。何がどの意味で清められるかを訳文で決めず、本文の神学的緊張と曖昧さを保持した。
- issue: キリストの一度限りのささげ物と「いけにえ」の複数形
  choice: 本文では自然な日本語を用いつつ、脚注でギリシア語が複数形であることを明示した。
  alternative: 文脈に合わせて「一つの、より良いいけにえ」と単数に限定する。
  rationale: ヘブライ人への手紙はキリストの一度限りのささげ物を強調するが、この節のθυσίαιςは複数形である。これを単数に調和させず、原文上の数を読者に知らせる。
translation_notes:
  register: 明瞭で現代的ながら、礼拝・祭儀の文脈にふさわしい品位を保った。「いけにえ」は一般読者に通じやすく、「犠牲」より祭儀的意味が明確である。後半ではギリシア語に省略されている「清められる必要がありました」を補い、日本語として対比が理解しやすい形にした。
