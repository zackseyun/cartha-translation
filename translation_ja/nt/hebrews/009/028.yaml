id: HEB.9.28
reference: Hebrews 9:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: ja
  text: このように、キリストも、多くの人々の罪を負うために一度ささげられ、二度目に、罪とは別に[a]、キリストを待ち望む人々に現れ、救いをもたらします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪に関しては別に」。文脈上は、最初にささげられた時のように罪を負うためではないことを指すと理解される。
    reason: χωρὶς ἁμαρτίαςの簡潔で解釈上の幅を残す表現について、本文の字義的表現を保ちながら、文脈上の理解を断定せずに示すため。
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同じように…も
  rationale: 27節の、人が一度死ぬという比較を受ける表現として、比較の力を自然な現代日本語で示す。
- source_word: ὁ Χριστός
  choice: キリスト
  rationale: 日本語で定着した称号として訳し、文脈上の救済史的な称号性を保つ。
- source_word: ἅπαξ
  choice: 一度
  rationale: 語の直接的な意味を採り、原文に明示されない「ただ一度限り」を補わない。
- source_word: προσενεχθεὶς
  choice: ささげられ
  rationale: アオリスト受動分詞の受動態と、未来の主動詞に先立つ出来事を保つ。
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: 多くの人の罪を負うために
  rationale: 目的を表す構文と、犠牲およびイザヤ書を響かせる「罪を負う」という表現を保持する。
- source_word: ἐκ δευτέρου
  choice: 二度目には
  rationale: 最初のささげられた出来事との対照を簡潔で自然に表す。
- source_word: χωρὶς ἁμαρτίας
  choice: 罪とは関わりなく
  rationale: 直訳的な「罪なしに」ではキリスト自身の無罪性だけを指すとの誤解が生じやすいため、「罪から離れて」という原義の幅を保ちつつ自然に訳す。具体的意味は脚注で示す。
- source_word: ὀφθήσεται
  choice: 現れます
  rationale: 未来受動形だが、終末的な出現を表す慣用的な用法に即して自然な日本語とする。
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: ご自分を待ち望む人々に
  rationale: ἀπεκδέχομαιの強い期待を「待ち望む」で表す。代名詞の指示対象も明確にする。
- source_word: εἰς σωτηρίαν
  choice: 救いをもたらすために
  rationale: 目的・到達点を表す句を、日本語で何に係るかが明瞭になるよう表現する。
theological_decisions:
- issue: 再臨時の「χωρὶς ἁμαρτίας」の意味
  choice: 本文を「罪とは関わりなく」とし、最初の出現時の罪を負う働きとの対照を脚注で説明する。
  alternative: 「罪を負うためではなく」「罪を処理するためではなく」
  rationale: 原文の簡潔さと神学的緊張を残し、キリストに罪がないという意味だけに限定せず、また本文で解釈を断定しすぎないため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、礼拝朗読にも耐える端正さを保った。「ささげる」は犠牲の文脈を示すため平仮名表記とし、「待ち望む」で期待を込めた待機を表した。
