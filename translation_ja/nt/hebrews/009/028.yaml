  rationale: 「ご自分を」を原文の目的語に忠実で自然な「キリストを」に改めた。あわせて、比較を導くοὕτως καὶを「このように」と明示し、ἐκ δευτέρουを自然な「二度目に」とした。脚注は、χωρὶς ἁμαρτίαςについて罪負担との対照を示しつつ、その説明を本文以上に確定的な訳文にしないよう調整した。
