    rationale: 原文のαὐτόνは「彼を」であり、「ご自分」は通常、主語自身を指す再帰表現として読まれる。また敬語的な響きも加わるため、キリストが自分自身を待ち望むかのような一時的な曖昧さを生む。「キリストを待ち望む人々」とするのが明瞭である。
  - severity: low
    issue: 脚注の説明が文脈上の解釈を「という意味」として確定している
    rationale: χωρὶς ἁμαρτίαςは字義的には「罪とは別に／罪に関しては別に」であり、文脈上は最初の献げ物における罪負担との対照と理解される。本文の曖昧さを保つ方針に合わせ、脚注も「文脈上は…を指すと理解される」のように説明するのがより慎重である。
