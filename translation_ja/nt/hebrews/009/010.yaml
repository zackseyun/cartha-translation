source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: ja
  text: これらはただ、食べ物と飲み物、またさまざまな洗いに関する、身体に関わる規定であって、正される時[a]まで課せられているものにすぎません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「正すことの時」。秩序が立て直される時、とも訳せます。
    reason: διορθώσεωςには、是正と秩序の立て直しの含みがあるため。本文は特定の歴史的出来事を断定せず、その意味の幅を保つ。
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: 食べ物と飲み物
  rationale: 飲食物に関する儀礼上の規定を、現代日本語で明瞭かつ原文の複数的な広がりを損なわず表した。
- source_word: διαφόροις βαπτισμοῖς
  choice: さまざまな洗い
  rationale: ここではキリスト教の洗礼だけに限定せず、複数の儀礼的な洗浄を指すため、「洗礼」ではなく「洗い」とした。
- source_word: δικαιώματα σαρκὸς
  choice: 肉に関する規定
  rationale: σάρξを単に「身体」と解釈して限定せず、「肉」という神学的緊張を残しつつ、属格の関係を自然な日本語で示した。
- source_word: ἐπικείμενα
  choice: 課されている
  rationale: 規定が人々の上に置かれ、拘束力をもつという受動的な意味を表した。
- source_word: καιροῦ διορθώσεως
  choice: すべてが正される時
  rationale: διορθώσιςの「正すこと・秩序を立て直すこと」を平明に表し、「宗教改革」など後代の特定概念を連想させる「改革」は避けた。
theological_decisions:
- issue: 「肉に関する規定」が外面的・身体的規定を意味するのか、より広い神学的対比を含むのか
  choice: 肉に関する規定
  alternative: 身体に関する規定
  rationale: 文脈上は飲食や洗浄という外面的規定を指すが、σάρξを「身体」に限定して原文の含意を狭めないため。
- issue: διορθώσεωςが指す出来事の明示
  choice: すべてが正される時
  alternative: 新しい秩序の時／改革の時
  rationale: キリストによる新しい契約秩序が文脈上示唆される一方、本文自体はその語をここで明示しないため、解釈を本文に織り込まず動作の意味を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く構文であることを踏まえ、「これらは」で受けた。「肉」は聖書的な語感を保つ一方、「に関する」を添えて日本語としての理解可能性を確保した。
