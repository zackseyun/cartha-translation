source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: ja
  text: もしこの方が地上におられたなら、祭司でさえなかったでしょう。律法に従って供え物[a]を献げる者たちがいるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「贈り物」。ここでは神に献げる供え物を指します。
    reason: δῶραの基本的な語義と、この祭儀的文脈での意味を示すため。
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: もし
  rationale: 論理の展開を踏まえつつ、反事実的な条件を現代日本語で明確に示す。接続小辞を過度に訳出せず、条件文の流れを自然にした。
- source_word: ἦν ἐπὶ γῆς
  choice: 地上におられるなら
  rationale: ἐπὶ γῆςは文脈上、天上との対比を表す。「おられる」は暗黙の主語であるキリストにふさわしい自然で敬意ある表現であり、現在の仮定として読める形にした。
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: 祭司でさえないでしょう
  rationale: οὐδέの強調を「でさえ」で示し、ἄνを伴う反事実的条件の帰結を「でしょう」で自然に表した。
- source_word: ὄντων τῶν προσφερόντων
  choice: 献げる者たちがいるからです
  rationale: 属格独立構文の理由・状況を示す働きを「からです」で明示し、分詞を自然な関係節として訳した。
- source_word: κατὰ νόμον
  choice: 律法に従って
  rationale: ここでのνόμοςは祭司の奉仕を規定するモーセ律法を指すため、定冠詞の趣旨も含めて「律法」とした。
- source_word: τὰ δῶρα
  choice: 供え物
  rationale: 犠牲祭儀の文脈におけるδῶραの意味を明確にするため「供え物」とした。動詞προσφέρωは「献げる」と訳し、名詞と動詞を不自然に重ねていない。
theological_decisions:
- issue: 条件節の暗黙の主語
  choice: 「この方」と補い、直前の文脈にあるキリストを指すようにした。
  alternative: 主語を省略する、または「彼」とする。
  rationale: 日本語では主語の省略も可能だが、この一節だけでも指示対象が追いやすいよう「この方」とした。本文が明示しない追加の教理的称号は用いていない。
- issue: 条件文の反事実的な力
  choice: 「もし……おられるなら、……ないでしょう」と訳した。
  alternative: 「もし地上におられたなら、祭司ではなかったでしょう」と過去形にする。
  rationale: εἰ＋未完了過去とἄν＋未完了過去による反事実的条件を保ちつつ、過去に地上で生きた事実そのものを否定するかのような日本語を避け、文脈上の現在的・領域的対比を示した。
- issue: 地上の祭司職とキリストの祭司職の関係
  choice: 「祭司でさえないでしょう」とし、地上にいるという仮定のもとでの帰結として限定した。
  alternative: 「祭司になる資格がありません」と説明的に訳す。
  rationale: 原文は資格の理由を明示していないため、説明を加えず、条件文が持つ神学的緊張をそのまま残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、礼拝朗読にも適する簡潔で品位ある文体とした。「この方」「おられる」により敬意を示しつつ、過度に教会的・教派的な用語は避けた。
