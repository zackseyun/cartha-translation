id: HEB.8.11
reference: Hebrews 8:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: ja
  text: また、だれもが、自分と同じ市民[a]に、また自分の兄弟に、『主を知れ』と言って、決して教えることはない。彼らは、小さい者から大きい者に至るまで皆、わたしを知るからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「隣人」。ヘブライ人への手紙のギリシア語本文は「市民」を意味する語を用いているが、引用元であるエレミヤ書のこの箇所は一般に「隣人」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: 教えることは、決してない
  rationale: οὐ μήとアオリスト接続法による強い否定を、現代日本語として自然な「決してない」で明示した。
- source_word: ἕκαστος
  choice: 人々がそれぞれ
  rationale: 契約共同体の成員一人一人を指す配分的な意味を保ちつつ、日本語の不自然な反復を避けた。
- source_word: πολίτην
  choice: 同胞市民
  rationale: 現存するヘブライ語聖書本文のギリシア語πολίτηςが示す「市民」の語義と、同じ共同体に属する者という関係性をともに表した。
- source_word: ἀδελφὸν
  choice: 兄弟
  rationale: 男性単数形と家族的・契約的な表現をそのまま保持した。
- source_word: Γνῶθι τὸν κύριον
  choice: 『主を知れ』
  rationale: アオリスト命令法の直接的な命令を簡潔に表し、κύριοςは文脈に即して「主」とした。
- source_word: πάντες εἰδήσουσίν με
  choice: 皆わたしを知る
  rationale: πάντεςの包括性と、明示された目的語μεを保持した。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: 小さい者から大きい者に至るまで
  rationale: 集団内のあらゆる者を含む慣用的な範囲表現として訳し、年齢や社会的地位のみに意味を限定しなかった。
theological_decisions:
- issue: エレミヤ書31章34節を踏まえた引用におけるπολίτηνの訳
  choice: 同胞市民
  alternative: 隣人
  rationale: エレミヤ書の対応箇所に沿って「隣人」とする伝統もあるが、ヘブライ人への手紙の現存ギリシア語本文はπολίτην（市民）と読むため、本文ではその語彙上の特徴を優先した。一般的な別訳は脚注に示した。
- issue: ἀδελφόνの性を伴う家族的表現
  choice: 兄弟
  alternative: 兄弟姉妹、仲間
  rationale: 原文の男性単数形と契約共同体における家族的表象を保持し、適用範囲について本文以上の限定も拡張も加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、引用文としての荘重さを保った。強い否定は「決してない」で示し、「小さい者から大きい者に至るまで」は聖書的な全包括性を保つ表現とした。
