id: HEB.8.1
reference: Hebrews 8:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: ja
  text: さて、述べている事柄についての要点[a]はこうです。私たちにはこのような大祭司がいます。この方は、天上[b]にある威光の御座の右に着座されました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「総括」または「中心点」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「もろもろの天に」。ギリシア語では複数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: 要点
  rationale: 議論の中心点を示す語として、字義的な「頭」ではなく、現代日本語で明確な「要点」とした。文脈によっては「総括」とも理解できるため、別訳を脚注に示した。
- source_word: δὲ
  choice: さて
  rationale: 強い対立ではなく、論述の区切りと転換を示す軽い接続辞なので、「しかし」ではなく「さて」とした。
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: 今述べていることの
  rationale: 現在受動分詞の継続的な響きを保ちつつ、論じられている事柄を指す自然な日本語とした。
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: 私たちにはこのような大祭司がいます
  rationale: τοιοῦτονが前段で描かれた種類・性質の大祭司を受けることを「このような」で示し、ἔχομενは簡潔に「います」と表した。
- source_word: ἐκάθισεν
  choice: 着座されました
  rationale: 座に着く完了した行為を表し、受動態にはせず、尊敬表現によって主語への敬意を自然に示した。
- source_word: ἐν δεξιᾷ τοῦ θρόνου
  choice: 御座の右に
  rationale: 権威と栄誉の位置を表す聖書的表現を保ち、「右側」などへの説明的な言い換えを避けた。
- source_word: τῆς μεγαλωσύνης
  choice: 威光
  rationale: 神を直接「神」と呼ばず、威厳・至高性によって間接的に指す原文の荘重な婉曲表現を保った。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天上に
  rationale: 日本語として自然で荘重な表現を用いた。ギリシア語が複数形であることは脚注に示した。
theological_decisions:
- issue: 「威光」が指す方を「神」と明示するか
  choice: 「威光の御座」として、原文の間接的な呼称を保つ。
  alternative: 「神の御座」または「大いなる方の御座」
  rationale: 原文はθεόςを用いず、μεγαλωσύνηという抽象名詞による荘重な婉曲表現を用いているため、その緊張を解消しない。
- issue: ἐκάθισενに祭司の働きの完成という解釈を明示するか
  choice: 「着座されました」とのみ訳す。
  alternative: 「務めを成し遂げて着座されました」
  rationale: 文脈上の含意はあるが、この節の動詞そのものにない説明を本文へ加えない。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「大祭司」「御座」「威光」「着座」によってヘブライ人への手紙の荘重な祭司的・王的語調を保った。長いギリシア語文は、日本語で理解しやすいよう二文に分けた。すべての脚注記号を対応箇所に置いた。
source_grounding:
  english_pob_role: consult_only
