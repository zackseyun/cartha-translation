  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: ja
  text: わたしは彼らの不義に対して憐れみを示し、彼らの罪をもはや決して思い起こさないからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もはや決して思い起こさない」は、原文では非常に強い否定表現。契約の文脈で、罪を完全に赦し、もはや責任を問わないことを表す言い回しであり、神が罪についての知識を失うという意味ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: からである
  rationale: 直前の契約の約束を支える理由・根拠を示す接続詞として、文末で自然に表した。
- source_word: ἵλεως ἔσομαι
  choice: あわれみ
  rationale: 直訳的には「あわれみ深くある／好意を示す」。ここでは神が不義を赦す慈悲深い態度を示すため、現代日本語として簡潔な「あわれむ」を用いた。
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: 彼らの不義を
  rationale: ἀδικίαの複数形は不正な行為を指し得るが、「不義」は抽象性と具体的な罪過の双方を保ち、「行い」を補わず原文に近く表せる。与格は日本語の他動詞表現に合わせて目的格とした。
- source_word: καὶ
  choice: （読点による並列）
  rationale: 日本語では二つの約束を読点で自然に連ね、καίの並列関係を保った。
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: 彼らの罪を
  rationale: ἁμαρτίαの複数形を、日本語で集合的にも個々の罪にも理解できる標準的な「罪」で表した。
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: もはや決して思い起こさない
  rationale: οὐ μήによる強い否定を「決して」、ἔτιを「もはや」で明示し、将来にわたる断固とした否定を自然な日本語で保った。
theological_decisions:
- issue: 神が罪を思い起こさないことの意味
  choice: 「思い起こさない」という契約的な赦しの比喩を本文にそのまま残す
  alternative: 神が罪を文字どおり忘れて知識を失うと明示する／「罪に問わない」と解釈して置き換える
  rationale: 原文の表現と神学的含意の幅を保つため、本文では解釈語に置換しない。脚注で、契約的文脈では完全な赦しを表すことを説明する。
- issue: ἀδικίαιςの抽象性と具体性
  choice: 不義
  alternative: 不正な行い／不正
  rationale: 複数形は具体的な悪行を含み得るが、「行い」は原文にないため補わず、「不義」によって道徳的意味と解釈上の余地を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「あわれむ」「不義」「罪」は聖書語彙として定着しているが、一般読者にも理解可能。原文の理由節を日本語らしく文末の「からである」で表し、強い否定は「もはや決して」で保持した。
