reference: Hebrews 8:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: ja
  text: 「新しい」と言うことによって[a][b]、最初のものを古びたものにした。そして、古びつつあり、老いていくものは、消え去る時が近い[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「『新しい』と言うとき」または「『新しい』と言うことで」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「新しい」とだけ記されており、前に引用されたエレミヤ書31章31節の「新しい契約」を受けている。
    reason: cross_reference
  - marker: c
    text: 別訳「消失に近い」または「消え去ることが近い」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: 「新しい」と言うことによって
  rationale: 前置詞ἐνを伴う冠詞付き不定詞は、ここでは状況と手段の両方を帯びる。「言うことによって」は、直前の引用における「新しい」という表現が第一のものの位置づけを変える、という論理的なつながりを自然な日本語で示す。
- source_word: Καινὴν
  choice: 「新しい」
  rationale: 原文は、直前のエレミヤ書引用にある「新しい契約」から形容詞だけを取り上げている。「契約」を補わず、引用符を用いて原文の簡潔な省略表現を保った。
- source_word: πεπαλαίωκεν
  choice: 古びたものとした
  rationale: 完了形が表す、すでに生じて現在も効力を持つ結果を表現する。「古いものとした」より自然であり、「廃止した」ほど強く制度的な意味を加えず、後半の老化の比喩にもつながる。
- source_word: τὴν πρώτην
  choice: 最初のもの
  rationale: 原文では形容詞が名詞的に用いられ、文脈上は最初の契約を指す。「契約」を本文に補わず、原文の省略を保った。
- source_word: τὸ ... παλαιούμενον
  choice: 古びつつあり
  rationale: 現在分詞の進行的な意味を「つつある」で表し、すでに古びたとされたことと、消滅へ向かう過程との緊張を保った。
- source_word: γηράσκον
  choice: 老いていく
  rationale: παλαιούμενονと並ぶ老化の比喩を明確に保ち、進行中の過程を自然な現代日本語で表した。
- source_word: ἐγγὺς ἀφανισμοῦ
  choice: 消え去ろうとしている
  rationale: 直訳的な「消失に近い」ではなく、消失が間近であることを自然な日本語で表す。ἀφανισμόςの中心的な像である、見えなくなること・消え去ることを保ち、「破壊」や「廃止」と限定しない。
theological_decisions:
- issue: 「新しい」と言う主体
  choice: 日本語の本文では主語を明示しない
  alternative: 「神は」または「聖書は」と補う
  rationale: ギリシア語では主語が明示されず、直前のエレミヤ書引用の語り手を受ける。日本語では主語を自然に省略できるため、神か聖書かを本文で過度に特定せず、原文の含みを保った。
- issue: 第一の契約の状態
  choice: 「古びたものとした」
  alternative: 「廃止した」または「時代遅れにした」
  rationale: 本文は新しい契約との対比によって第一のものが古びたと論じるが、この一節だけで律法全体について追加の教理的結論を明示してはいない。「古びた」は原語と後半の老化の比喩を保ちつつ、その旧態化を伝える。
- issue: 消失の切迫性
  choice: 「消え去ろうとしている」
  alternative: 「消え去る時が近い」
  rationale: ἐγγὺς ἀφανισμοῦは消失への近さを述べる。日本語では「消え去ろうとしている」が簡潔で自然だが、意志ではなく切迫した過程を表すものとして用いた。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「契約」や発言主体を本文に補わず、ギリシア語の省略と曖昧さを維持した。「古びた／古びつつあり／老いていく」によって、同語根の反復と老化の比喩を可能な限り再現している。
