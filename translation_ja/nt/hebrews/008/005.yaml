source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: ja
  text: この人たちは、天上のものの写しと影に仕えています。ちょうど、モーセが幕屋を造り上げようとしていたときに、神から指示を受けた[a]とおりです。神はこう言われました。「山であなたに示された型に従って、すべてを造るように注意しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神から警告を受けた」とも訳せる。ギリシア語の動詞には、神による警告や戒めの意味が前面に出る場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: この人たちは
  rationale: 直前のレビ人の祭司たちを受ける関係節を、日本語で自然に独立した文として表した。
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: 写しと影
  rationale: 地上の聖所が天上のものに対応しつつ、それより劣るという比喩と緊張を保った。
- source_word: λατρεύουσιν
  choice: 仕えています
  rationale: 祭儀的・宗教的奉仕を表す語であり、簡潔な「仕える」によって原文の広がりを保った。
- source_word: τῶν ἐπουρανίων
  choice: 天上のもの
  rationale: 場所だけにも抽象的な「実体」だけにも限定せず、広い指示対象を維持した。
- source_word: κεχρημάτισται
  choice: 神から指示を受けた
  rationale: 神による伝達と指示の両面を表し、警告の含意だけに狭めない訳とした。
- source_word: ἐπιτελεῖν τὴν σκηνήν
  choice: 幕屋を造り上げようとしていた
  rationale: 完成へ至らせるという動詞の語感と、文脈上の建造行為の双方を自然な日本語で表した。
- source_word: Ὅρα
  choice: 注意しなさい
  rationale: 単なる視覚的な「見よ」ではなく、引用中の命令が持つ注意・遵守の力を自然に示した。
- source_word: ποιήσεις πάντα
  choice: すべてを造るように
  rationale: 未来形が命令として機能しているため、日本語では明瞭な命令表現にした。
- source_word: τύπον
  choice: 型
  rationale: 山で示された、製作の基準となる原型・様式という意味を簡潔に表した。
theological_decisions:
- issue: 地上の祭儀と天上のものとの関係
  choice: 「天上のものの写しと影」
  alternative: 「天上の実体の模型と影」
  rationale: 地上のものが天上のものに対応しながら同一ではないという関係を保ち、「実体」などの解釈的な限定を加えなかった。
- issue: κεχρημάτισται の力点
  choice: 「神から指示を受けた」
  alternative: 「神から警告を受けた」
  rationale: 神的啓示と命令的な指示をともに表し、文脈にあり得る警告のニュアンスは脚注に残した。
- issue: φησίν の主語
  choice: 「こう言われています」
  alternative: 「神はこう言われます」
  rationale: 引用の発話者が神であることは文脈上明らかだが、ギリシア語本文で主語が明示されていない点を日本語でも過度に確定しないようにした。
translation_notes:
  register: 明瞭な現代標準語を用い、祭儀的文脈にふさわしい品位を保った。「幕屋」「型」は聖書文脈で定着しつつ一般読者にも理解可能な語として採用した。
