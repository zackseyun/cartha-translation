id: HEB.8.9
reference: Hebrews 8:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: ja
  text: これは、わたしが彼らの父祖たちの手を取って、エジプトの地から連れ出した日に、彼らと結んだ契約とは異なる[a]。彼らがわたしの契約にとどまらなかったので、わたしも彼らを顧みなかった[b]――主はこう言われる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、「わたしが彼らの手を取って」。ここで「彼ら」は父祖たちを指す。
    reason: lexical_alternative
  - marker: b
    text: この引用は、ヘブライ人への手紙のギリシア語本文に従い、「わたしも彼らを顧みなかった」と訳している。エレミヤ書31章32節のヘブライ語本文は意味が異なり、「わたしは彼らの夫であったにもかかわらず」、または「わたしは彼らの主人であったにもかかわらず」などと訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: 契約
  rationale: ヘブライ人への手紙では、神が民と結ぶ契約を指す神学的・文脈的な語であり、日本語でも「契約」が最も明確で定着している。
- source_word: ἐποίησα τοῖς πατράσιν αὐτῶν
  choice: 彼らの父祖たちと結んだ
  rationale: διαθήκηとποιέωの結び付きを、日本語の自然な慣用表現「契約を結ぶ」で表した。πατέρεςはイスラエルの先祖である男性たちを指すため「父祖たち」とした。
- source_word: ἐν ἡμέρᾳ
  choice: 日に
  rationale: 出エジプトの歴史的な時を示す具体的な時間表現を保った。後続する分詞句は日本語では連体修飾として自然に組み込んだ。
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: わたしが彼らの父祖たちの手を取って
  rationale: 「手を取る」という具体的な導きの比喩を保った。ギリシア語の代名詞が指す父祖たちを日本語で明示して、曖昧さを避けた。
- source_word: ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου
  choice: エジプトの地から連れ出した
  rationale: ἐξάγωの導き出す意味と、γῆςを含む表現を簡潔かつ自然に保持した。
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: わたしの契約にとどまらなかった
  rationale: ἐμμένωの、ある関係や責務のうちに持続してとどまる意味を保ち、契約への忠実さを過度に説明しない表現とした。
- source_word: κἀγὼ ἠμέλησα αὐτῶν
  choice: わたしも彼らを顧みなかった
  rationale: κἀγώの「わたしも」を保ち、ἀμελέωの顧慮しない、意に介さないという意味を、現代日本語として自然で荘重な「顧みなかった」で表した。積極的な遺棄など、原文以上に強い意味は加えていない。
- source_word: λέγει κύριος
  choice: 主はこう言われる
  rationale: 引用定型句として自然な現在的発話を表し、κύριοςは文脈に沿って「主」とした。
theological_decisions:
- issue: エレミヤ31章32節のヘブライ語本文と、ヘブライ人への手紙が引用するギリシア語本文との意味の違い
  choice: わたしも彼らを顧みなかった
  alternative: わたしは彼らの夫であった／主人であったにもかかわらず
  rationale: ヘブライ人への手紙のギリシア語本文は明確にἠμέλησα αὐτῶνと読み、「顧みなかった」という意味を示すため、本文ではこれに従った。一方、エレミヤ書のヘブライ語本文にある異なる意味は、重要な本文間の緊張として脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、旧約引用にふさわしい品位を保った。「父祖」「顧みる」は一般読者にも理解可能な範囲の聖書的語彙として採用した。長いギリシア語文は、日本語で読みやすいよう二文に分け、末尾の引用定型句をダッシュで接続した。
