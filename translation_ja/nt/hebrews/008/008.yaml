id: HEB.8.8
reference: Hebrews 8:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: ja
  text: というのも、神は彼らを責めて、こう言っておられます。「見よ、日々が来る、と主は言われる。そのとき、わたしはイスラエルの家とユダの家とに、新しい契約を結ぶ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος … αὐτοὺς
  choice: 彼らを責めて
  rationale: 分詞の非難・欠点を指摘する意味と、目的語が「彼ら」である本文を簡潔に保持した。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言の荘重な注意喚起を保ち、引用文として自然な聖書的表現とした。
- source_word: ἡμέραι ἔρχονται
  choice: 日々が来る
  rationale: 到来する将来の時を表す原文の慣用句を、預言的な響きを残して訳した。
- source_word: συντελέσω … διαθήκην καινήν
  choice: 新しい契約を結ぶ
  rationale: 契約について用いられる συντελέω は、成立・締結を完遂する意味であり、日本語では「契約を結ぶ」が自然である。
- source_word: οἶκον Ἰσραὴλ … οἶκον Ἰούδα
  choice: イスラエルの家…ユダの家
  rationale: 共同体・民を指す「家」という原文および旧約引用の表現を保持した。
theological_decisions:
- issue: 責められている対象
  choice: 彼らを責めて
  alternative: それに欠陥を認めて
  rationale: 提示されたSBLGNT本文は αὐτούς（彼らを）を含むため、民を目的語として訳した。異読に基づいて契約そのものを対象とはしなかった。
- issue: 新しい契約の相手
  choice: イスラエルの家とユダの家とに
  alternative: イスラエル民族とユダ民族に
  rationale: 原文の二つの「家」を維持し、その歴史的・神学的指示対象を訳文で狭めなかった。
translation_notes:
  register: 現代の一般読者に理解できる明晰さを保ちつつ、旧約預言の引用にふさわしい荘重さを「見よ」「日々が来る」「家」に残した。文脈上の発話者を明確にするため主語を「神」と補った。引用は次節へ続くため、閉じかぎ括弧を置いていない。
