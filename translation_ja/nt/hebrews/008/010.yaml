  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: ja
  text: 「これが、あの日々の後に、わたしがイスラエルの家と結ぶ契約である」と主は言われる。「わたしの律法を彼らの思いに置いて[a]、彼らの心にそれを書き記す。わたしは彼らの神となり、彼らはわたしの民となる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 日本語としては、「わたしの律法を彼らの思いに置き、彼らの心にそれを書き記す」とも訳せる。ギリシア語では、最初の動詞は分詞（「置いて／与えて」）、次の動詞は未来形（「書き記す」）である。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: 契約
  rationale: エレミヤ書に由来する文脈であり、遺言ではなく、神と民との契約を表す。
- source_word: διαθήσομαι
  choice: 結ぶ
  rationale: 日本語では「契約を結ぶ」が自然であり、契約を制定するという未来の行為を明確に表す。
- source_word: οἴκῳ Ἰσραήλ
  choice: イスラエルの家
  rationale: 預言書の契約表現とのつながりと、民全体を指す集合的な響きを保つ。
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: あの日々の後
  rationale: 預言的な時間表現を簡潔に保ち、「その時」と意訳しすぎない。
- source_word: κύριος
  choice: 主
  rationale: ギリシア語本文のκύριοςを、明瞭で定着した日本語の神称として訳す。
- source_word: διδοὺς
  choice: 置いて
  rationale: 「与える」の意味をこの文脈では内面に「置く」と表し、非定形の接続形によって後続する未来動詞との構文上の違いもある程度保つ。
- source_word: νόμους
  choice: 律法
  rationale: 原文は複数形だが、日本語の「律法」は数を明示せずに個々の掟を含む集合的表現として自然に用いられる。「数々の律法」は不必要に強調的である。
- source_word: διάνοιαν
  choice: 思い
  rationale: 理解、思考、認識を含む内面的な知性を、現代日本語で自然に表す。
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: 彼らの心に
  rationale: 書き記すという比喩を保ちつつ、日本語では場所を示す「に」が自然である。
- source_word: ἐπιγράψω
  choice: 書き記す
  rationale: 単に書く以上に、心に刻みつけるという記銘の比喩を明瞭に伝える。
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: わたしは彼らの神となり
  rationale: 定型的な契約宣言を自然な日本語で表し、その関係性を保つ。
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: 彼らはわたしの民となる
  rationale: 契約による帰属と相互関係を、簡潔で定着した表現として伝える。
theological_decisions:
- issue: エレミヤ書の契約表現との連続性
  choice: 「イスラエルの家」「契約」「彼らの神」「わたしの民」という表現を保つ。
  alternative: 「イスラエル」「約束」「神は彼らと共にいる」など、より平易に言い換える。
  rationale: 引用元の預言的・契約的な言葉遣いがこの節の神学的な力を担っているため、過度な平滑化を避けた。
- issue: διδοὺςとἐπιγράψωの異なる動詞形
  choice: 「置いて」と非定形で受け、「書き記す」を文の中心となる定形動詞にする。
  alternative: 「置き、……書き記す」または「置く。そして……書き記す」と二つの未来の行為として完全に並列化する。
  rationale: 原文の分詞と未来形の組み合わせを、日本語として理解可能な範囲で残し、より滑らかな読み方は脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、預言書からの引用にふさわしい簡潔で格調ある調子を保った。「イスラエルの家」は日常語としてはやや硬いが、原文の契約的な響きと旧約との連続性を優先した。
