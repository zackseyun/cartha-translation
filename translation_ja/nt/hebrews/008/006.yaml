id: HEB.8.6
reference: Hebrews 8:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: ja
  text: しかし今、キリストは、より優れた契約[a]の仲介者であられるだけに、より優れた務めを得ておられます。その契約は、より優れた約束に基づいて制定された[b]ものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「契約」と訳したギリシア語は、文脈によっては「遺言」を意味することもある。ここでは、後の節で引用されるエレミヤ書の「新しい契約」を踏まえ、「契約」とした。
    reason: alternative_reading
  - marker: b
    text: 「制定された」は、「確立された」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今
  rationale: 直前まで述べられた地上の祭司の務めと、キリストが現に持つ務めとを対比する、逆接と時間的意味の両方を明確に表す。
- source_word: διαφορωτέρας
  choice: それだけ優れています
  rationale: 質的な卓越を表す比較級。後続のὅσῳ καὶとの比例関係を「それだけ」で受け、務めの優越性が契約の優越性に対応する論理を自然な日本語で示す。
- source_word: τέτυχεν
  choice: 得ておられる
  rationale: 完了形が示す、すでに得た結果として現在も保持している状態を表す。敬語はキリストを指す文脈にふさわしい自然で荘重な文体のために用いた。
- source_word: λειτουργίας
  choice: 務め
  rationale: 文脈上は聖なる祭司的奉仕を指すが、原語自体を過度に限定せず、周囲の文脈に祭司的意味を担わせる。
- source_word: ὅσῳ καὶ
  choice: それだけ……だからです
  rationale: キリストの務めの優越性と、仲介する契約の優越性を結ぶ比例的・理由的関係を、明瞭な現代日本語で表す。
- source_word: κρείττονός ... διαθήκης
  choice: より優れた契約
  rationale: ヘブライ人への手紙で反復される比較表現κρείττωνを「より優れた」とし、著者の論証を保つ。διαθήκηは直後のエレミヤ書の新しい契約を背景とするため「契約」とした。
- source_word: μεσίτης
  choice: 仲介者
  rationale: 当事者の間に立って契約関係を成立させる者という法的・神学的含意を、一般の読者にも理解しやすく表す。
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: より優れた約束に基づいて
  rationale: ἐπί＋与格が示す基礎・根拠の意味を自然な日本語にし、その契約が神の約束を土台とすることを示す。
- source_word: νενομοθέτηται
  choice: 制定された
  rationale: 完了受動形が示す、法的に定められ、その効力が続いている状態を簡潔に表す。
theological_decisions:
- issue: ヘブライ人への手紙8章6節におけるδιαθήκηの訳語
  choice: 契約
  alternative: 遺言
  rationale: διαθήκηは文脈によって「遺言」の意味を持ち得るが、ここでは直後に引用されるエレミヤ書の「新しい契約」と祭司的仲介が論旨の中心なので、「契約」が最も文脈に即している。別の語義の可能性は脚注に残す。
- issue: 契約と約束の関係を表すἐπίの理解
  choice: 約束に基づいて
  alternative: 約束の上に
  rationale: ここでは、より優れた約束が契約の基礎・根拠であることを示すと理解した。比喩的な「上に」より、現代日本語で関係が明瞭になる。
- issue: νενομοθέτηταιの法的含意
  choice: 制定された
  alternative: 確立された
  rationale: 契約が権威をもって定められたという法的含意を保つ。「確立された」も可能だが、原語に含まれる立法・制定の響きが弱くなる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヘブライ人への手紙の比較論証にふさわしい荘重さを保った。長いギリシア語文を二文に分け、ὅσῳ καὶの比例関係を「それだけ……だからです」で可視化した。指示対象を明確にするため主語を「キリスト」と補った。
