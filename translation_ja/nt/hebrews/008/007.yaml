reference: Hebrews 8:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: ja
  text: というのも、もしあの第一の契約[a]に欠けたところがなかったなら、第二のもののための余地[b]が求められることはなかったはずです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では字義的に「あの第一のもの」。「契約」は文脈から補った。
    reason: lexical_alternative
  - marker: b
    text: または「第二のもののための機会（場合）が求められることはなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: というのも、もし
  rationale: γάρが前の議論への説明を導く働きと、Εἰの条件を、自然な現代日本語でともに表す。
- source_word: ἡ πρώτη ἐκείνη
  choice: あの第一の契約
  rationale: ギリシア語は字義的には「あの第一のもの」だが、女性形の表現は文脈上「契約」を指すため、指示対象を明確にして補った。
- source_word: ἦν ἄμεμπτος
  choice: 欠けたところがなかった
  rationale: ἄμεμπτοςの「非難や欠点の根拠がない」という意味を表しつつ、その欠けが具体的に何にあるかを本文中で決めつけない表現とした。
- source_word: οὐκ ἂν
  choice: なかったはずです
  rationale: 事実に反する条件文の帰結を示すἄνの反実仮想的な力を、自然な日本語で表した。
- source_word: δευτέρας
  choice: 第二のもの
  rationale: 原文では「契約」が省略されているため、その簡潔さを保った。直前に「第一の契約」とあるので指示対象は理解できる。
- source_word: ἐζητεῖτο τόπος
  choice: 求められる余地はなかった
  rationale: 「場所・余地」を意味するτόποςを保ちながら、ζητέωの受動形と組み合わされた「別のものが求められる余地」という文意を分かりやすく表した。
theological_decisions:
- issue: 原文で省略されている「契約」を明示するか
  choice: 「あの第一の契約」として「契約」を補い、「第二のもの」では省略を保つ
  alternative: 「あの第一のもの」または両方を「第一の契約」「第二の契約」とする
  rationale: 直前の文脈は二つの契約を対比しているため、最初の箇所で「契約」を補うと意味が明確になる。一方、後半では原文の省略を保っても指示対象は十分に伝わる。
- issue: 第一の契約にある「欠け」の所在と性質
  choice: 「欠けたところ」と訳し、性質を限定しない
  alternative: 「欠陥」「非難される点」「罪」を明示する
  rationale: この節だけでは、欠けが契約自体、その運用、あるいは関係する民にどうかかわるかを詳述していない。次節に先回りせず、原文の神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、論証を導く「というのも」と丁寧体によって、ヘブライ人への手紙にふさわしい落ち着いた格調を保った。
