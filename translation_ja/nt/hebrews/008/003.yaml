id: HEB.8.3
reference: Hebrews 8:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: ja
  text: というのは、すべての大祭司は、供え物といけにえの両方を献げるために任命されています。ですから、この方も[a]何か献げるものを持っている必要があります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ですから、この方も献げるための何かを持っている必要があります」。ギリシャ語では「この方」が誰を指すかは明示されていませんが、文脈では大祭司であるイエスを指します。
    reason: 「この方」の指示対象が本文では明示されないこと、および末尾の関係節を日本語にする際の別訳を示すため。
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: すべての大祭司は
  rationale: 単数名詞を伴う πᾶς の分配的意味を「すべての大祭司」で表した。γάρ は前節から続く説明関係を示すが、日本語では文脈上明らかなため、ここでは不自然な「というのは」を置かず接続を含意させた。
- source_word: εἰς τὸ προσφέρειν
  choice: 献げるために
  rationale: εἰς と冠詞付き不定詞が示す目的を、自然な現代日本語で明示した。
- source_word: δῶρά τε καὶ θυσίας
  choice: 供え物といけにえの両方
  rationale: τε καὶ の組み合わせを「両方」で示し、祭儀上区別される δῶρα と θυσίαι を一語にまとめず保持した。
- source_word: καθίσταται
  choice: 任命されます
  rationale: 祭司職に就けられることを表す受動形として、現代日本語で明確な「任命される」を採用した。
- source_word: ὅθεν
  choice: ですから
  rationale: 前文から導かれる推論を、明快で自然な接続表現によって示した。
- source_word: ἀναγκαῖον ἔχειν
  choice: 持っている必要があります
  rationale: 必要性を表す非人称的構文を、自然な日本語の「必要がある」で表現した。
- source_word: τι
  choice: 何か
  rationale: 内容が特定されていないことを示す不定代名詞の意味を保った。
- source_word: καὶ τοῦτον
  choice: この方も
  rationale: 指示代名詞 τοῦτον の指示性と καί の追加の意味を保ちつつ、文脈上の大祭司であるイエスへの敬意を自然な日本語で表した。固有名は本文に補わなかった。
- source_word: ὃ προσενέγκῃ
  choice: 献げるもの
  rationale: 関係代名詞とアオリスト接続法が示す、献げるために用いる何かという意図・可能性を、簡潔で自然な連体表現にした。
theological_decisions:
- issue: 「この方」（τοῦτον）の指示対象
  choice: 本文では「この方」とし、文脈上イエスを指すことを脚注で示す。
  alternative: 本文で「イエスも」または「キリストも」と明示する。
  rationale: 直前の文脈ではイエスが大祭司として論じられているが、ギリシャ語本文自体は指示代名詞を用いている。原文以上に明示せず、指示対象は脚注で補った。
- issue: 祭儀用語の区別
  choice: 「供え物」と「いけにえ」を別個の語として保持する。
  alternative: 「ささげ物」など一つの包括的表現にまとめる。
  rationale: δῶρα と θυσίαι はヘブライ人への手紙で区別される祭儀的範疇であり、この節だけでキリストの自己犠牲へ説明的に言い換えず、本文の神学的抑制を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「捧げる」より常用漢字表に沿う「献げる」を用い、祭儀文脈を示した。「この者」では距離や軽視の響きが生じ得るため、「この方」とした。
