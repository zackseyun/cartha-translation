  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: ja
  text: 聖なる所[a]と、主が建てられた[b]真の幕屋とに仕える者です。それを建てたのは人ではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」とも訳せる。ギリシア語は複数形で、聖所内の聖なる場所を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「（主が）張った」。幕屋を設営することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: 聖なる所
  rationale: 実体詞的に用いられた中性複数形。ヘブライ人への手紙の祭儀的文脈では、聖なる人々ではなく聖所を指すのが自然である。「聖なる所」は複数形の含みを残しつつ、至聖所だけに限定しない。
- source_word: λειτουργὸς
  choice: 仕える者
  rationale: 公的・宗教的な務めを果たす者を表す。ここでは祭司的奉仕の意味を保ちつつ、専門語に偏らない自然な日本語とした。
- source_word: σκηνῆς
  choice: 幕屋
  rationale: モーセの幕屋と、それに対応する天上の幕屋を想起させる語であるため、一般的な「天幕」より聖書的・祭儀的な響きを保つ「幕屋」とした。
- source_word: ἀληθινῆς
  choice: 真の
  rationale: 単に虚偽でないというだけでなく、地上の写しに対する究極的な実体という含みを保つ簡潔な訳。
- source_word: ἔπηξεν
  choice: 建てられた
  rationale: 天幕を固定して設営することを表す動詞。「幕屋」と自然に結びつく「建てる」を本文に用い、より字義的な「張る」は脚注に示した。
- source_word: ὁ κύριος
  choice: 主
  rationale: 定冠詞付きの κύριος を、文脈上の主体を明示する「主」と訳した。
- source_word: οὐκ ἄνθρωπος
  choice: それを建てたのは人ではありません
  rationale: 主の行為と人間の行為との対照を明瞭にし、ἄνθρωπος の人類一般を表す用法を自然な現代日本語で示した。
theological_decisions:
- issue: τῶν ἁγίων の指示対象と天上の聖所との関係
  choice: 聖なる人々ではなく、祭儀的な聖所を指す表現として訳す
  alternative: 聖徒たち
  rationale: 8章1–5節は大祭司としてのメシアが天上の聖所で行う務めを扱う。「聖なる所」は幕屋・神殿の枠組みを保ちながら、単数の「聖所」に意味を狭めすぎない。
- issue: οὐκ ἄνθρωπος の一般的対照
  choice: 「人ではありません」とし、主と人間を対照させる
  alternative: 「一人の人ではありません」または「人間ではありません」
  rationale: 特定の男性を否定するのではなく、人間の働き全般と主の働きを対照させているため、簡潔で包括的な「人」を用いた。
- issue: 関係節における否定の係り方
  choice: 主が建てたことを述べた後、「それを建てたのは人ではありません」と独立文で明示する
  alternative: 「人ではなく主が建てられた真の幕屋」
  rationale: 原文末尾の οὐκ ἄνθρωπος が持つ強い対照を保ち、同時に日本語として主語の関係が曖昧にならないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「仕える者」により祭司的奉仕を示しつつ、本文だけで役職名を過度に限定しない。原文の一続きの関係節を二文に分け、末尾の「人ではない」という対照を自然かつ明確に再現した。
