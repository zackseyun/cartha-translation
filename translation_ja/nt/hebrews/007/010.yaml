  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: ja
  text: というのも、メルキゼデクがアブラハムに会ったとき、レビはまだ父祖アブラハムの腰の中にいた[a]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼はまだ父の腰の中にいた」。ここで「父」はアブラハムを指す。「腰の中」は、子孫がまだ祖先のうちにいたことを表す系譜的な言い回しです。
    reason: 「腰の中」という比喩の字義的な形と系譜的意味を示し、「父」がアブラハムを指すことを補足するため。
lexical_decisions:
- source_word: ἔτι
  choice: まだ
  rationale: その出会いの時点で、レビがなお祖先のうちにいたという先行状態を自然な現代日本語で表す。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の主張に理由を添える説明的な接続を、日本語として自然な呼応表現で示す。
- source_word: ἐν τῇ ὀσφύϊ
  choice: 腰の中に
  rationale: 子孫が祖先の生殖的・系譜的な起源のうちにあるという具体的比喩を、平板な意訳にせず保持する。
- source_word: τοῦ πατρὸς
  choice: 父祖の
  rationale: πατήρはここで直接の父ではなく祖先アブラハムを指す。現代日本語で誤解を避けつつ、父系的な系譜表現を保つ。字義的な形は脚注に示す。
- source_word: ἦν
  choice: いた
  rationale: 人について用いられる未完了過去の存在を、日本語では自然に「いた」と表す。
- source_word: ὅτε
  choice: 時
  rationale: メルキゼデクとの出会いが起きた時点を示す標準的な時間表現。
- source_word: συνήντησεν
  choice: 出会った
  rationale: 歴史的な一回の遭遇を簡潔で自然に表す。
- source_word: αὐτῷ
  choice: アブラハムに
  rationale: ギリシア語は代名詞だが、日本語で「彼に」とするとレビとの混同が生じるため、文脈上の指示対象を明示する。
- source_word: Μελχισέδεκ
  choice: メルキゼデク
  rationale: 日本語聖書で一般的な人名表記を用いる。
theological_decisions:
- issue: レビがアブラハムのうちにいたという系譜的表現
  choice: 「父祖の腰の中にいた」とし、具体的な「腰」の比喩を本文に残す
  alternative: 「祖先の体の中にいた」または「まだ生まれていなかった」
  rationale: 著者の議論は、レビが祖先アブラハムのうちに系譜的・代表的な意味で存在したという表現に依拠する。「まだ生まれていなかった」ではその論理が失われ、「体の中」では比喩が弱まるため、解釈を限定せず原文の緊張を保つ。
- issue: 「父」と代名詞の指示対象
  choice: 本文では「父祖」「アブラハム」「レビ」と明示する
  alternative: 字義どおり「彼はまだ彼の父の腰の中にいた。メルキゼデクが彼に出会った時」とする
  rationale: ギリシア語の指示対象は文脈上、主語がレビ、父祖と目的語がアブラハムである。日本語で代名詞を重ねると不明瞭になるため、意味を追加せず指示対象だけを明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、説明的接続には「というのも……からです」を採用した。「腰の中」という原文の具体的比喩を保持し、難解さは脚注で補った。代名詞の連続による混乱を避けるため、文脈上明白なレビとアブラハムを本文で明示した。
