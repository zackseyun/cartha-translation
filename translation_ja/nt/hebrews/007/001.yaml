source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: ja
  text: というのも、このメルキゼデクは、サレムの王、いと高き神の祭司であり、王たちを打ち破って帰る途中のアブラハムに出会い、彼を祝福した人です[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「王たちの殺戮から帰る途中の」。ギリシア語は字義的には「王たちの殺戮から」と読むことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: というのも、このメルキゼデクは
  rationale: γάρが前の議論を説明する接続を表すため「というのも」とし、Οὗτοςの指示性を「この」で保持した。固有名は日本語聖書で定着した「メルキゼデク」とした。
- source_word: βασιλεὺς Σαλήμ
  choice: サレムの王
  rationale: 語義を素直に表し、創世記14章とのつながりが分かる慣用的な音写を用いた。
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: いと高き神の祭司
  rationale: ὕψιστοςを神にかかる称号として保ちつつ、日本語で自然かつ荘重な定着表現とした。
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: アブラハムを迎え……た人
  rationale: συναντάωはここでは帰還するアブラハムに会うことを指す。「迎え」は文脈に自然で、関係節を「人です」と閉じることで、長いギリシア語文の構造を明瞭にした。
- source_word: ὑποστρέφοντι
  choice: 帰る途中の
  rationale: 現在分詞が示す、会った時点で進行中の帰還を簡潔に表した。
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: 王たちを討ち滅ぼして
  rationale: κοπήの「切り倒すこと、殺戮」という強い軍事的含意を「討ち滅ぼす」で保った。属格「王たち」は目的語的に理解したが、表現の幅は脚注で示した。
- source_word: καὶ εὐλογήσας αὐτόν
  choice: 彼を祝福した
  rationale: συναντήσαςと並ぶアオリスト分詞の第二の行為を、自然な日本語の述語として表した。αὐτόνの指示対象であるアブラハムを「彼」とした。
theological_decisions:
- issue: τοῦ θεοῦ τοῦ ὑψίστουという神の称号
  choice: いと高き神
  alternative: 至高の神
  rationale: 特定の教派的含意を加えず、神への称号としての修飾関係を保持した。「いと高き」は現代の一般読者にも理解可能で、聖書文体として自然な荘重さを持つ。
- issue: τῆς κοπῆς τῶν βασιλέωνにおける属格の関係
  choice: 王たちを討ち滅ぼして
  alternative: 王たちとの戦いを終えて／王たちを打ち破って
  rationale: 創世記14章の背景とκοπήの強い語義に基づき目的語的属格として訳した。ただし、アブラハムが王全員を文字どおり殺したとの過度な限定を避けるため、別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「いと高き神」「祭司」「祝福」など定着した聖書語彙を用いて品位を保った。節が次節へ続くギリシア語の構文は、この一節だけでも理解できるよう「人です」で整えた。
