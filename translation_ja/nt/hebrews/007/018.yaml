id: HEB.7.18
reference: Hebrews 7:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: ja
  text: というのも、先にあった戒めは、それが弱く、役に立たないため、廃止されるのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「役に立たない」とは、前後の文脈で論じられている完全な状態に至らせることができない、という意味です（7章19節参照）。神が以前に与えた啓示そのものが悪かった、という意味ではありません。
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: 廃止される
  rationale: 無効化・撤廃という法的な効力を明確にしつつ、現代日本語として自然に表現した。名詞構文を動詞化して読みやすくした。
- source_word: μὲν γὰρ
  choice: というのも
  rationale: γάρの説明的なつながりを自然に示す。μένが次節のδέとの対比を予告する点は、日本語では明示的な「一方では」を置かず、文脈に委ねた。
- source_word: γίνεται
  choice: される
  rationale: 廃止が成立するという出来事を、ἀθέτησιςと合わせた自然な受動表現で示した。
- source_word: προαγούσης ἐντολῆς
  choice: 先にあった戒め
  rationale: 「先行する、以前の」という時間的関係を保ち、特定の範囲を本文だけで過度に限定しない表現とした。
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: それが弱く、役に立たないため
  rationale: 理由を明示し、二つの形容詞の鋭い評価を弱めず、明快な現代日本語にした。
- source_word: ἀσθενές
  choice: 弱く
  rationale: 力または効力の不足を表す直接的な訳語である。
- source_word: ἀνωφελές
  choice: 役に立たない
  rationale: 有益でない、効力をもたないという意味を日常的で明瞭な日本語にした。文脈上の目的に対する無効性は脚注で補った。
theological_decisions:
- issue: 「先にあった戒め」に対する否定的評価の範囲
  choice: 本文では「弱く、役に立たない」という強い表現をそのまま保ち、脚注で直前直後の文脈における完全性との関係を示す。
  alternative: モーセ律法全体があらゆる意味で無価値だと明示する、または否定的表現そのものを「限界があった」などと弱める。
  rationale: ヘブライ7章11、19節の論旨は、先行する祭司制度が完全に至らせることのできない点にある。本文の緊張を保存しつつ、その射程を文脈以上に広げない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「戒め」は聖書文脈になじみがあり、一般読者にも理解可能。「廃止される」は原文の法的・制度的な強さを保持する。脚注記号[a]を本文に配置した。
