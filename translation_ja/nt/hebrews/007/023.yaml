  text: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: ja
  text: また、祭司となった者たちは多くいました[a]。死によって、その職にとどまり続けることを妨げられたからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭司は数多くいました」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「とどまり続けることを妨げられるため」。文脈上、祭司の職にとどまり続けることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: また
  rationale: 前節から議論をつなぐ単純な接続として、自然な現代日本語の「また」を用いた。
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: 祭司となった者は大勢いました
  rationale: 祭司が多数であったことを表し、次節の単一で永続する祭司との対比を準備する。μένの対比機能は文脈上、次節とのつながりによって伝わる。γεγονότεςの「祭司となった」も明示した。
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: 死によって……続けられなかったからです
  rationale: διά＋冠詞付き不定詞の理由を「からです」で示し、θανάτῳの手段・原因を「死によって」で保持した。受動表現は、日本語として自然な可能否定にした。
- source_word: παραμένειν
  choice: その務めを続ける
  rationale: 語そのものは「とどまり続ける」だが、祭司職の文脈で何を続けるのかを明確にした。補足であることは脚注に示した。
theological_decisions:
- issue: 以前の祭司たちとイエスの祭司職との対比
  choice: 死のため祭司職を継続できず、多数の祭司が必要だったことだけを本文で示す
  alternative: 本文に「レビ人の祭司」または「旧い制度の祭司」と明記する
  rationale: 文脈上はレビ系祭司職を指すが、この節のギリシア語本文自体には「レビ人」などの語がないため、教理的説明を本文に加えず、次節との対比を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の一文を二文に分け、理由関係を明確にした。祭司職の制度名は補わず、次節へ続く対比と原文の含みを保った。
