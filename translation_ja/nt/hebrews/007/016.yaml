id: HEB.7.16
reference: Hebrews 7:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: ja
  text: この方は、肉に属する戒めという律法[a]に従ってではなく、滅びることのない命[b]の力によって、祭司となられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「身体に関する規定による律法」または「肉的な戒めの律法」。
    reason: σαρκίνηςは、ここでは道徳的な悪ではなく、身体・血統・外面的条件に関わることを表し得る。また、νόμονとἐντολῆςの関係には複数の自然な表現が可能である。
  - marker: b
    text: 別訳「終わりのない命」または「不滅の命」。
    reason: ἀκατάλυτοςは、終わることがないだけでなく、解体されたり滅ぼされたりし得ないことも表す。
lexical_decisions:
- source_word: ὃς
  choice: この方は
  rationale: 直前に述べられた人物を受ける関係代名詞。日本語では文脈上の指示を明示する「この方は」が自然で、敬意ある文体にも合う。
- source_word: κατὰ νόμον
  choice: 律法によって
  rationale: κατά＋対格が示す基準・根拠を「によって」で表した。νόμοςはここでは特定の律法名というより祭司任命を規定する法的原理を指すが、日本語では不定冠詞を補わず「律法」とした。
- source_word: ἐντολῆς σαρκίνης
  choice: 肉に関する戒めの
  rationale: σαρκίνηςを道徳的な「罪深い」とせず、身体・血統という領域に関わることを示す「肉に関する」とした。νόμονとの属格関係は説明的に解消せず、「戒めの律法」として原文の圧縮された表現を保った。
- source_word: γέγονεν
  choice: 祭司となられた
  rationale: 完了形の結果状態を「なられた」で表し、原文では文脈から補われる述語「祭司」を日本語の明瞭さのために補った。受動を明示する「任命された」までは踏み込まない。
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: ではなく、…力によって
  rationale: 前半のκατάとの対照を同じ「によって」で保ち、ἀλλάの強い対比を「ではなく」で示した。
- source_word: ζωῆς ἀκαταλύτου
  choice: 滅びることのない命
  rationale: ἀκατάλυτοςが表す、解体・破壊・終止を受けない性質を自然な日本語で示した。「終わりのない」よりも、単なる持続時間に限定しない表現である。
theological_decisions:
- issue: σαρκίνηςの意味
  choice: 「肉に関する」とし、身体的・血統的な祭司資格に関わる表現として訳した。
  alternative: 「肉的な」「身体に関する」「物質的な」
  rationale: 文脈は、外面的・身体的な系譜規定と、滅びない命の力とを対照している。「罪深い」という倫理的意味を持ち込まず、同時に原文の「肉」という比喩的語彙を保持した。
- issue: ἀκαταλύτουの意味
  choice: 「滅びることのない」とした。
  alternative: 「終わりのない」「不滅の」
  rationale: 時間的に無限であるだけでなく、破壊・解体され得ないという語の力を保った。「終わりのない」は伝統的な理解として脚注に示した。
- issue: γέγονενで省略された補語
  choice: 文脈から「祭司」を補った。
  alternative: 「そのような者となられた」「そのようになられた」
  rationale: 前節から続く祭司論を日本語で明瞭にするための文脈的補足であり、どのように祭司となったかという原文の対比は変えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司論にふさわしい端正な文体とした。「この方」「なられた」により指示対象への敬意を自然に示した。原文の二つのκατά句は「…によってではなく、…によって」と対応させ、対照構造を明確にした。
