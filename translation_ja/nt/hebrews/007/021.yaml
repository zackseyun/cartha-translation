source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: ja
  text: 'しかし、この方は、この方に語られた方を通してなされた誓いをもって、祭司となられました。


    「主は誓われた。

    『あなたは永遠に祭司である。』

    主はその決意を変えられない。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: しかし、この方は
  rationale: 前節の祭司たちと、この祭司とを対比する冠詞付きの表現を、文脈上の強い対照が伝わる自然な日本語にした。
- source_word: μετὰ ὁρκωμοσίας
  choice: 誓いによって
  rationale: 祭司就任に神の誓いが伴い、それが根拠となっていることを示す。続く διὰ τοῦ λέγοντος と合わせ、日本語では「こう言われた方の誓いによって」と簡潔に表した。
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: この方にこう言われた方の
  rationale: 属格を伴う διά の媒介・作用の意味を保ちつつ、引用を語る神が誓いの主体であることが明瞭になるようにした。二つの指示対象を混同しないため、代名詞だけの表現を避けた。
- source_word: Ὤμοσεν κύριος
  choice: 主は誓われた
  rationale: 詩編110:4の引用として、κύριοςを「主」、アオリストを自然な過去表現「誓われた」とした。誓いの効力が続くことは文脈と後続句から伝わる。
- source_word: οὐ μεταμεληθήσεται
  choice: 思い直すことはない
  rationale: 道徳的な悔い改めではなく、宣言した意志を撤回しないことを表すため、「悔いる」ではなく「思い直す」を用いた。未来形の確定的否定は「ことはない」で表した。
- source_word: Σὺ ἱερεὺς
  choice: あなたは祭司である
  rationale: ギリシア語で省略された連結動詞を日本語で補い、相手の祭司としての身分を明瞭に示した。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: この定型句が表す時間的な永続性を、現代日本語で自然かつ簡潔に表した。
theological_decisions:
- issue: 詩編110:4の引用における祭司職の根拠と永続性
  choice: この祭司が神の誓いによって立てられ、その祭司職が永遠であるという対比を明示した。
  alternative: 語順をより形式的に保ち、「誓いを伴って、彼に語る方を通して」と訳すこともできる。
  rationale: ヘブライ人への手紙の議論は、誓いなしに祭司となった者たちと、神の撤回されない誓いによって祭司となったこの方を対比している。後代の教理用語を加えず、本文の対比と緊張を保った。
- issue: Ὤμοσεν の時制表現
  choice: 「主は誓われた」と過去で訳した。
  alternative: 誓いの現在まで続く効力を前面に出して、「主は誓っておられる」と訳す余地もある。
  rationale: ギリシア語アオリスト自体は誓いの行為を述べるため、まず自然な過去形で示した。誓いが撤回されず永続的に有効であることは「思い直すことはない」と文脈によって十分に表される。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の発言と詩編引用にふさわしい簡潔で荘重な調子を保った。「この方」を反復するのはやや明示的だが、キリストと語り手である神との指示関係を曖昧にしないためである。
