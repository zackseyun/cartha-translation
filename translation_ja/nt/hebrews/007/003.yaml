reference: Hebrews 7:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: ja
  text: 父もなく、母もなく、系図もなく[a]、日の始まりも命の終わりもなく、神の御子に似せられ、いつまでも[b]祭司であり続けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「記録された系図がなく」。創世記にはメルキゼデクの父母や系譜が記されておらず、ヘブライ人への手紙はその記述上の特徴を類型的に用いている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「永遠に」または「絶えず」。この表現は、聖書の記述において彼が祭司として存続することを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος
  choice: 父もなく、母もなく、系図もなく
  rationale: 三つの否定語の並行性を保ちつつ、現代日本語として明瞭にした。「系図もなく」は実際の親の不在とも記録上の不在とも取り得る原文の表現を本文で狭めすぎない。
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: 日の始まりも命の終わりもなく
  rationale: 対になった否定を保ち、「日の始まり」という荘重な聖書的表現によって原文の修辞を伝える。
- source_word: ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ
  choice: 神の御子に似た者とされて
  rationale: 完了受動分詞の受動的な力を反映し、メルキゼデクと御子との同一性ではなく類似性を明示する。「御子」はキリスト論的称号として自然で品位ある表現。
- source_word: μένει ἱερεὺς
  choice: 祭司であり続けます
  rationale: μένειの継続的な状態を自然な日本語で表し、祭司職が存続するという論旨を保つ。
- source_word: εἰς τὸ διηνεκές
  choice: いつまでも
  rationale: 継続・恒久性を示す句を、過度に形而上学的な解釈へ限定せず、一般読者に明瞭な表現で訳した。
theological_decisions:
- issue: メルキゼデクが文字どおり親を持たず永遠に生きる存在なのか、それとも創世記の記述上そのように描かれているのか
  choice: 本文では原文の強い表現をそのまま保ち、注で系譜記録の不在に基づく類型的な理解を示す。
  alternative: メルキゼデクを受肉前の御子そのもの、または本質的に親も生の終わりもない存在と解する。
  rationale: ἀφωμοιωμένοςは御子に「似た者とされた」と述べており、同一性ではなく類似を示す。創世記の沈黙を用いるヘブライ書の議論を踏まえつつ、本文の神学的緊張を解消しすぎない。
- issue: εἰς τὸ διηνεκέςが絶対的な永遠性を意味するか、聖書の提示における持続性を強調するか
  choice: 「いつまでも」と訳し、持続する祭司職を表す。
  alternative: 「永遠に」と訳して絶対的永遠性を前面に出す。
  rationale: 原句の継続的・恒久的な力を伝えながら、著者の類型論的議論を越える断定を避ける。
translation_notes:
  register: 簡潔で荘重な列挙の調子を保った。「日の始まり」「神の御子」「祭司」は現代の一般読者にも理解できる標準的な聖書語彙であり、文末は丁寧体で統一した。英語相談層では脚注bの印が「神の御子」の後に置かれていたが、内容はεἰς τὸ διηνεκέςの訳語に関するため、日本語本文では「祭司であり続けます」の後に配置した。
