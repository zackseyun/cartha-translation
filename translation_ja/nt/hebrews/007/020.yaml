  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: ja
  text: また、これが誓いを伴わないものではなかったという点で（実際、彼らは誓いを伴わずに祭司となったのですが、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: また
  rationale: 直前の議論を受けて新たな論拠を加える接続語として、自然な日本語の「また」とした。
- source_word: καθ’ ὅσον
  choice: …ではなかった分だけ
  rationale: 次節の「それだけいっそう」に対応する程度・根拠の構文を保ち、この節だけで文を完結させない訳とした。
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: 誓いなしではなかった
  rationale: 強調を伴う二重の否定的表現を保ち、誓いがあったという含意を説明的に言い換えすぎないようにした。
- source_word: οἱ μὲν γὰρ
  choice: 実際、彼らは…のですが
  rationale: γάρの説明的な働きを「実際」で示し、次節のδέとの対照を「のですが」という未完の形で予告した。
- source_word: χωρὶς ὁρκωμοσίας
  choice: 誓いなしに
  rationale: χωρίςの「なしに」を簡潔に表し、直前の同じ句との語彙的一貫性を保った。
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: 祭司となった
  rationale: 祭司職に就いた出来事とその結果を、現代日本語として自然な「祭司となった」で表した。
theological_decisions:
- issue: 誓いなしに祭司となった「彼ら」と、誓いによって立てられた祭司との対照
  choice: 「彼ら」を文脈上の従来の祭司たちとして訳し、対照の後半は次節に委ねた。
  alternative: 「彼ら」を明示的に「レビ族の祭司たち」と補う。
  rationale: 直近の文脈はレビ系祭司職とイエスの祭司職を対照するが、本文自体は単に「彼ら」としているため、解釈上の明示を本文へ持ち込まなかった。
- issue: καθ’ ὅσονと次節のκατὰ τοσοῦτοの対応
  choice: 程度を示す未完の比較構文として保持した。
  alternative: 「しかも、これは誓いなしに行われたのではありません」と独立文にする。
  rationale: 原文の論証は20節から22節にまたがっており、20節だけを完結文にすると、誓いの有無が次節の結論の程度を定める構造が弱まるため。
translation_notes:
  register: 論証的で格調ある調子を保ちつつ、現代の読者に通じる語彙を用いた。原文どおり文と括弧が次節へ続く形を保持している。
