id: HEB.7.24
reference: Hebrews 7:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: ja
  text: しかし、この方は永遠にとどまるので、変わることのない祭司職を持っておられます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「他の者に譲られない祭司職」または「受け継がれることのない祭司職」とも訳せます。このギリシア語には、変わらないことと、他者に移らないことの両方のニュアンスがあり得ます。文脈では、この方が永遠に生きておられるため、その祭司職がほかの者に移らないことが要点です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: しかし、この方は
  rationale: 前節の多くの祭司たちとイエスを対比する実詞的冠詞とδέの逆接を、自然で敬意ある日本語で表した。
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: とどまるので
  rationale: διάを伴う冠詞付き不定詞の原因を示す構文と、μένωの継続の意味を保った。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: 終わりなく存続することを表す慣用句を、明瞭な現代日本語にした。
- source_word: ἀπαράβατον
  choice: 変わることのない
  rationale: 語が持ち得る『変わらない』と『他者へ移らない』の両方向を踏まえ、本文では過度に限定しない表現を採用し、文脈上の非移譲性を脚注で明示した。
- source_word: ἔχει τὴν ἱερωσύνην
  choice: 祭司職を持っておられます
  rationale: ἔχωによる保持・所有を表しつつ、対象がイエスであるため自然な敬語を用いた。
- source_word: ἱερωσύνην
  choice: 祭司職
  rationale: ここでは祭司集団ではなく祭司としての職務・身分を指すため、『祭司職』が明確である。
theological_decisions:
- issue: キリストの祭司職に関するἀπαράβατονの意味
  choice: 本文では『変わることのない』とし、永続性を示した。
  alternative: 『他の者に譲られない』『受け継がれることのない』祭司職。
  rationale: この形容詞には不変性と非移譲性のニュアンスがあり得る。直前では死によって交代する多数の祭司と、永遠に生きるイエスが対比されているため、他者に移らないことが文脈上重要だが、本文だけで語義を狭く確定せず脚注に代案を残した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、キリストへの言及には『この方』『持っておられます』という自然で品位ある敬語を採用した。
