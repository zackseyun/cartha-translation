  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: ja
  text: ここでは、死ぬべき人間が十分の一を受け取ります。しかし他方では、生きていると証しされている者が受け取ります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後半の「受け取ります」は文脈から補っています。ギリシア語は、メルキゼデクが文字どおり不死であると直接断言するのではなく、聖書の証言という形で、彼が生きていると述べています。
    reason: 原文で後半に省略されている動詞・目的語を示し、「証しされている」という受動表現が保つ解釈上の幅を明らかにするため。
lexical_decisions:
- source_word: ὧδε ... ἐκεῖ
  choice: ここでは……あちらでは
  rationale: レビ族の祭司が十分の一を受ける現在の制度と、聖書に記されたメルキゼデクの場面との対比を、指示語の対応を保って明瞭に表した。
- source_word: δεκάτας
  choice: 十分の一
  rationale: 十分の一を納める制度を指す文脈に即し、現代日本語で簡潔に表した。
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: 死ぬべき人間
  rationale: 分詞が人間の死すべき性質を強調し、後半の「生きている」と対照を成すことを保った。「死にかけている」という意味には限定しない。
- source_word: λαμβάνουσιν
  choice: 受け取ります
  rationale: 十分の一を受領するという意味を、余分な解釈を加えず自然に表した。
- source_word: μαρτυρούμενος ὅτι ζῇ
  choice: 生きていると証しされている方
  rationale: 受動態の証言表現と現在時制を維持し、聖書の証言として提示されている点を残した。後半では文脈上省略された「受け取る」を日本語で補った。
theological_decisions:
- issue: レビ族の祭司とメルキゼデクの対比の性質
  choice: 死すべき人間である祭司たちと、聖書によって生きていると証しされるメルキゼデクとを対比する。
  alternative: メルキゼデク自身が文字どおり永遠に死なないと、この節が直接断言していると訳す。
  rationale: 原文は「証しされている」という受動表現を用いており、創世記の記述に基づく証言の形を保っている。そこで、文字どおりの不死を訳文で確定せず、原文の神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体と「ここでは……あちらでは」の修辞的対比を保った。
