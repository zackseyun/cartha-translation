  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: ja
  text: しかし、彼らの系譜に属さない者は、アブラハムから十分の一を受け取り、約束を受けていた者[a]を祝福しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「約束を持つ者」。ギリシア語では現在分詞が使われています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: しかし、彼らの系譜に属さないこの人は
  rationale: 文脈上メルキゼデクを指す冠詞付き分詞を「この人」とし、レビの子孫の系譜に基づく祭司職との対比を自然な現代日本語で示す。「属さない」は系譜上の登録・由来を表し、単なる生物学的血統やメルキゼデクの存在論について断定しない。
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: アブラハムから十分の一を受け取り
  rationale: 動詞が十分の一を取る・受け取ることを表すため、「受け取り」とした。日本語では完了形を機械的に再現せず、後続の動詞と結んで、完了した出来事が現在の議論に持つ意義を文脈に委ねる。
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: 約束を受けていた者を
  rationale: 現在分詞の字義は「約束を持つ者」だが、ここでは過去の物語中のアブラハムを指すため、自然な日本語として「受けていた」とした。複数形は日本語では集合的な「約束」で自然に表される。
- source_word: εὐλόγηκεν
  choice: 祝福しました
  rationale: メルキゼデクがアブラハムを祝福した完了した行為を、明瞭で品位ある敬体の日本語で表した。ギリシア語完了形の議論上の継続的意義は文脈から保たれる。
theological_decisions:
- issue: レビ系祭司職との系譜上の対比
  choice: メルキゼデクが「彼らの系譜に属さない」と訳し、レビ系の系譜外にあることを示す。
  alternative: 「彼らから系図をたどられない」または「彼らの子孫ではない」。
  rationale: 本文の論点は祭司職に関わる系譜上の資格の対比であり、メルキゼデクの起源や本性について本文以上の形而上学的主張を加えない。
- issue: 「約束を持つ」の時制と意味
  choice: 過去のアブラハムへの物語的言及として「約束を受けていた者」とする。
  alternative: ギリシア語現在分詞をより形式的に「約束を持つ者」とする。
  rationale: 「受けていた」はアブラハムに神の約束が与えられていたことを明確にしつつ、彼が約束の保持者であるという神学的含意を失わない。原文の現在分詞は脚注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語の敬体。「十分の一」は教会用語に偏り得る「什一」より一般読者に理解しやすい。「この人」で文脈上のメルキゼデクを明確にしつつ、原文にない固有名の反復は避けた。
