source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: ja
  text: アブラハムはまた、すべてのものの十分の一をこの人に分け与えました[a]。この人の名は、まず「義の王」[b]と訳され、次にサレムの王、すなわち平和の王です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「什一」とも訳せます。ギリシア語は直訳すると「十分の一」です。
    reason: lexical_alternative
  - marker: b
    text: 別訳「正義の王」。ギリシア語のδικαιοσύνηは「義」と「正義」のどちらの意味にもなり得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: この人に
  rationale: 関係代名詞は前節のメルキゼデクを指す。日本語では指示対象を自然に示すため「この人に」とした。
- source_word: δεκάτην ἀπὸ πάντων
  choice: すべてのものの十分の一
  rationale: δεκάτην の字義どおりの「十分の一」を保ち、ἀπὸ πάντων は全体から取り分けた割合を表す自然な日本語にした。
- source_word: ἐμέρισεν
  choice: 分け与えました
  rationale: 単に「与えた」とせず、全体から一部を取り分ける μερίζω の含みを残した。
- source_word: ἑρμηνευόμενος
  choice: その名は…と訳され
  rationale: メルキゼデクの名の意味を説明する受動分詞であることを、明瞭な日本語で表した。
- source_word: βασιλεὺς δικαιοσύνης
  choice: 義の王
  rationale: δικαιοσύνη の基本的かつ神学的にも確立した訳語「義」を用い、称号として簡潔に表した。
- source_word: βασιλεὺς Σαλήμ
  choice: サレムの王
  rationale: Σαλήμ を地名として音写し、属格関係を自然に表した。
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: すなわち「平和の王」
  rationale: ὅ ἐστιν の説明機能を「すなわち」で示し、εἰρήνη は一般読者に明瞭な「平和」とした。
theological_decisions:
- issue: δικαιοσύνη を名の解釈・称号としてどう訳すか
  choice: 義
  alternative: 正義
  rationale: δικαιοσύνη は「義」と「正義」の両方を表し得る。本文では聖書全体との語彙的一貫性と名の伝統的な理解を踏まえて「義」とし、司法的・倫理的な含みを明示する「正義」は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。前節から続く文脈を踏まえつつ、この節だけでも指示関係が分かるよう「この人」とした。引用符によって名と称号の語義説明を読み取りやすくした。
