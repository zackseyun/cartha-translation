id: HEB.7.11
reference: Hebrews 7:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: ja
  text: もし、レビ系の祭司職によって完全に至ることが可能だったのなら――民はこの祭司職を基盤として律法を授けられたのですが[a]――どうしてなお、メルキゼデクの位に従う別の祭司が現れ、アロンの位に従う者とは呼ばれない必要があったのでしょうか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民はこの祭司職のもとで律法を与えられた」。ギリシア語は、イスラエルの律法制度がレビ系の祭司職を基盤としていたことを示します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「メルキゼデクの位に従う別の祭司が現れ、アロンの位に従う者とは呼ばれないことが、どうしてなお必要だったのでしょうか」。
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: 完全に至ること
  rationale: 単なる道徳的改善ではなく、ヘブライ書における神への十全な接近と目的の成就を含む語義を保ちつつ、現代日本語として理解しやすくした。
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: レビ系の祭司職によって
  rationale: 属格を伴うδιάの手段・媒介の意味を自然な日本語で表した。「レビ系」は祭司職がレビに由来する制度であることを簡潔に示す。
- source_word: ἐπ’ αὐτῆς
  choice: この祭司職を基盤として
  rationale: 女性代名詞の最も自然な先行詞を「レビ系の祭司職」と取り、ἐπίが示す制度的基盤の関係を明確にした。
- source_word: νενομοθέτηται
  choice: 律法を授けられた
  rationale: 完了受動形が表す、民が律法を与えられてその規定の下に置かれた状態を、過度に説明せず自然に表した。
- source_word: τίς ἔτι χρεία
  choice: どうしてなお…必要があったのでしょうか
  rationale: 必要性を問う修辞疑問の力とἔτιの「なお」を保持した。
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: メルキゼデクの位に従う
  rationale: τάξιςを、祭司の系列・類型・定められた秩序を示す伝統的で簡潔な「位」とし、κατάを「に従う」で表した。
- source_word: ἕτερον ... ἱερέα
  choice: 別の祭司
  rationale: 単なる追加だけでなく異なる種類である含みを「別の」によって保ち、後続するアロンとの対比につないだ。
- source_word: ἀνίστασθαι
  choice: 立てられる
  rationale: ここでは祭司の出現・任命を指すため、復活の意味に限定されない自然な受動表現とした。
- source_word: καὶ οὐ ... λέγεσθαι
  choice: アロンの位に属するとされず
  rationale: λέγεσθαιが名称だけでなく分類・呼称を示すことを踏まえ、「属するとされる」として対照を明瞭にした。
- source_word: Μελχισέδεκ / Ἀαρών
  choice: メルキゼデク／アロン
  rationale: 現代日本語聖書で一般的な固有名表記を用いた。
theological_decisions:
- issue: τελείωσιςの祭司論的意味
  choice: 「完全に至ること」とし、その内容を本文で限定しない
  alternative: 「神に完全に近づくこと」「完成」
  rationale: 祭儀的適格性、神への接近、救済的完成を含み得る語であり、いずれか一つに狭めず、文脈が内容を規定できるようにした。
- issue: ἐπ’ αὐτῆςの指示対象
  choice: レビ系の祭司職
  alternative: 律法、または契約制度全般
  rationale: 文法上最も近い適切な女性名詞がἱερωσύνηであり、民への立法と祭司制度との基盤的関係を説明する挿入句として論旨にもよく合う。
- issue: τάξιςの意味
  choice: 祭司の位・系列・類型を含み得る「位」
  alternative: 「秩序」「方式」「系統」
  rationale: メルキゼデクとアロンの対比を保ちながら、世襲系列だけに限定せず、本文の神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、修辞疑問と祭司論の荘重さを保持した。長い挿入句はダッシュで区切り、論理関係を読み取りやすくした。「完全」「位」などの神学的に厚みのある語は過剰に言い換えず、脚注で代替表現を示した。
