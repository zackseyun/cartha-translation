revisions:
- from: もし、レビ系の祭司職によって完全に至ることができたのなら――民はこの祭司職を基盤として律法を授けられたのですが[a]――どうしてなお、アロンの位に属するとされず、メルキゼデクの位に従う別の祭司が立てられる必要があったのでしょうか。[b]
  to: もし、レビ系の祭司職によって完全に至ることが可能だったのなら――民はこの祭司職を基盤として律法を授けられたのですが[a]――どうしてなお、メルキゼデクの位に従う別の祭司が現れ、アロンの位に従う者とは呼ばれない必要があったのでしょうか。[b]
  rationale: 原文の語順と構文上の結び付きを日本語として自然に示しつつ、祭司の「出現」と、その呼称がアロンの位によらないことを直接訳しました。脚注bも、本文で改めた「現れる」「呼ばれる」に合わせ、代替的な構文を示すよう更新しました。
