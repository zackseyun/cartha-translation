- source_word: δεδεκάτωται
  choice: 十分の一を納めたことになります
  rationale: ギリシア語の完了受動形は直訳すると『十分の一を取られた』だが、この文脈ではアブラハムを通してレビが納付者と見なされるという意味になる。日本語では論旨を明瞭にしつつ、『ことになります』で推論的・代表的な性格を保つ。
