base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: ja
  text: '次のように証しされているからです。


    「あなたは永遠に、メルキゼデクに倣う祭司である。」[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メルキゼデクの位に従う祭司」。
    reason: lexical_alternative
  - marker: b
    text: 詩編110:4からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: 証言されている
  rationale: 現在受動形を保ち、聖書の言葉が証言として提示されていることを表す。証言者を明示して原文以上に限定しない。
- source_word: γὰρ
  choice: からです
  rationale: 直前の論述を根拠づける接続辞。現代日本語で自然に理由・裏づけを示す。
- source_word: ὅτι
  choice: 引用を導く句点
  rationale: 証言の内容を直接引用として導入するため、日本語では「と」の逐語的な補充より、文を切って引用を置くほうが自然である。
- source_word: Σὺ
  choice: あなたは
  rationale: 二人称単数への直接の呼びかけを明確に保つ。
- source_word: ἱερεὺς
  choice: 祭司
  rationale: 原文は「大祭司」ではなく一般名詞「祭司」であるため、そのまま訳す。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠の
  rationale: 継続期間を表す慣用句を、引用文の述語に自然につながる簡潔な日本語で表す。
- source_word: κατὰ τὴν τάξιν
  choice: 位に等しい
  rationale: メルキゼデクに対応する祭司の身分・類型を示す表現として、日本語の聖書文体で定着した訳を採用する。ただし「系列」「継承順序」に限定しないよう、別訳を脚注に示す。
- source_word: Μελχισέδεκ
  choice: メルキゼデク
  rationale: 固有名詞として一般的な日本語音写を用いる。
theological_decisions:
- issue: 詩編の引用における祭司の呼称
  choice: 「祭司」とし、「大祭司」を補わない
  alternative: 文脈上の明確化として「大祭司」とする
  rationale: この節のギリシア語は ἱερεύς「祭司」であり、ヘブライ人への手紙全体がイエスを大祭司として論じていても、この引用に「大」を加えることは原文を越える。
- issue: κατὰ τὴν τάξιν とメルキゼデクとの関係
  choice: 「メルキゼデクの位に等しい」
  alternative: 「メルキゼデクの型に従う」または「メルキゼデクの系列に属する」
  rationale: 身分、型、秩序・系列という語義上の幅を一つの継承制度に固定せず、詩編の簡潔な宣言と神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書引用には簡潔で格調ある言い回しを用いた。「こう証言されているからです」で前節との論理的連続を示し、引用自体は原文の簡潔さを保った。
