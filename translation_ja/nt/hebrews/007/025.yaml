id: HEB.7.25
reference: Hebrews 7:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: ja
  text: したがって、この方は、この方を通して神に近づく人々を完全に[a]救うことができます。彼らのために執り成すために、いつも生きておられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「永遠に」。伝統的には「どこまでも」。
    reason: εἰς τὸ παντελές には、完全性と永続性の双方を表し得る語義上の幅があるため。
lexical_decisions:
- source_word: ὅθεν
  choice: したがって
  rationale: 直前の、イエスの永続する祭司職についての議論から導かれる結論であることを明確に示す。
- source_word: καὶ
  choice: （文脈上「も」の意を含意）
  rationale: 日本語で「救うこともできます」とすると不自然または対比が曖昧になり得るため、推論全体の流れに含ませた。
- source_word: σῴζειν
  choice: 救う
  rationale: 救済論的な文脈にふさわしく、語の神学的な重みと聖書内での連続性を保つ。
- source_word: εἰς τὸ παντελές
  choice: 完全に
  rationale: 救いの徹底性・完全性を自然に表す。時間的な意味の可能性は脚注に残し、語義の幅を狭めない。
- source_word: δύναται
  choice: できます
  rationale: 永続する祭司職に基づく能力を、明瞭で現代的な敬体ではない本文調の日本語で表す。
- source_word: τοὺς προσερχομένους
  choice: 近づく人々
  rationale: ヘブライ人への手紙で繰り返される、礼拝および神への接近という含意を保持する。
- source_word: δι’ αὐτοῦ
  choice: ご自分を通して
  rationale: 祭司であるイエスの仲介によって神に近づくことを明示する。指示対象を自然にするため再帰的な表現とした。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: προσέρχομαι と結びつく与格を、自然で明快な日本語にした。
- source_word: πάντοτε ζῶν
  choice: いつも生きていて
  rationale: 継続的に生きていることを示し、後続句とともに救う能力の根拠として自然に表した。
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: 執り成しておられる
  rationale: 継続的な祭司的働きを、現代日本語で理解しやすく、かつ品位ある表現で示す。
- source_word: ὑπὲρ αὐτῶν
  choice: 彼らのために
  rationale: 当人たちの利益のため、また彼らを代表して行う執り成しを簡潔に表す。
theological_decisions:
- issue: εἰς τὸ παντελές の意味範囲
  choice: 本文では「完全に」
  alternative: 「永遠に」または「どこまでも」
  rationale: この句は徹底性・完全性を表し得る一方、文脈によっては時間的な永続性も帯びる。本文で一方を過度に確定せず、時間的・伝統的な訳を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭司的仲介を表す「神に近づく」「執り成す」を保持した。「この方」「ご自分」により指示対象への敬意を自然に示した。
