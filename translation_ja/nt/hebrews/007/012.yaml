  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: ja
  text: 祭司職が変更されると、必然的に律法にも変更が生じます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭司職が移されると、必然的に律法にも変更が生じます」。「律法」は、文脈上、レビ系の祭司職を定めたモーセの律法を指すとも理解できる。
    reason: μετατιθεμένηςの「移される」という可能な訳語と、νόμουをモーセの律法として具体的に理解する文脈上の可能性を示すため。
lexical_decisions:
- source_word: μετατιθεμένης
  choice: 変更される
  rationale: 属格絶対の分詞で、祭司職が従来の秩序から別の秩序へ移されることを表す。「変更される」は、単なる場所的・行政的な「移管」に狭めず、文脈上の制度的転換を明確に伝える。
- source_word: ἱερωσύνης
  choice: 祭司職
  rationale: 個々の祭司の働きではなく、祭司としての職務・制度を指す。現代日本語では「祭司職」が簡潔で自然。
- source_word: ἐξ ἀνάγκης
  choice: 必然的に
  rationale: 祭司職の変更から律法の変更が論理的に不可避であることを示す。議論調を保ちながら明瞭に表現できる。
- source_word: νόμου
  choice: 律法
  rationale: 直接には祭司職を定める法的秩序を指し、文脈上はモーセの律法を含意する。冠詞のない形なので、特定性を過度に明示する表現は避けた。
- source_word: μετάθεσις
  choice: 変更
  rationale: μετατιθεμένηςとの同根語による対応を、「変更される／変更」という反復で再現する。「廃止」では意味を強めすぎる。
- source_word: γίνεται
  choice: 生じます
  rationale: 結果として変更が起こることを自然な日本語で表す。
- source_word: καὶ
  choice: にも
  rationale: 祭司職の変更に対応して律法も変更されるという付加・連動の関係を示す。
- source_word: γὰρ
  choice: なら
  rationale: 前節への説明的な接続と、属格絶対が示す状況を、日本語では条件的な「なら」にまとめて自然に表した。独立した「というのは」を置かなくても論理関係は保たれる。
theological_decisions:
- issue: νόμοςが指す範囲
  choice: 本文では「律法」とし、祭司職を規定する法的秩序を指しつつ、文脈上のモーセの律法との結び付きを保った。
  alternative: 「その律法」として、レビ系祭司職を定めたモーセの律法をより明示する。
  rationale: 無冠詞のνόμουは法的秩序を一般的に述べる余地を残す一方、ヘブライ人への手紙7章の文脈ではモーセの律法が念頭にある。本文で特定性を過度に狭めず、脚注で明示的な解釈を示す。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った論述調。「祭司職」「律法」は文脈上必要な聖書用語として維持し、「変更される／変更」で原文の同根語の反復を再現した。
