reference: Hebrews 7:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: ja
  text: 一方、レビの子らのうち祭司職を受ける者たちは、律法に従って民、すなわち自分たちの兄弟たち[a]から十分の一を徴収するよう命じられています。その兄弟たちもまた、アブラハムの腰から出た者たち[b]であるのに。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同胞のイスラエル人たち」とも訳せる。原文は男性複数形の親族語で「彼らの兄弟たち」と言い、同じ民に属する者たちを指している。
    reason: lexical_alternative
  - marker: b
    text: すなわち、「アブラハムの子孫である者たち」。原文の字義は「アブラハムの腰から出た者たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: レビの子孫のうち…者たち
  rationale: ἐκ の部分集合の意味を「うち」で示し、レビの系統に属する者すべてではなく、その中で祭司職を受ける者を指す構文を保った。日本語では「レビの息子たちから出た者」より「レビの子孫」が自然である。
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: 祭司職を受ける
  rationale: λαμβάνω を「受ける」とし、自ら獲得するのでなく職務を授けられる含みを保った。ἱερατεία は文脈上、祭司という身分・職務を表すため「祭司職」とした。
- source_word: ἐντολὴν ἔχουσιν ἀποδεκατοῦν
  choice: 十分の一を徴収するよう命じられています
  rationale: 名詞構文を自然な現代日本語の受け身表現にしつつ、ἐντολή の法的な命令性と、ἀποδεκατόω が十分の一を納める側ではなく取り立てる側を表すことを明確にした。
- source_word: τὸν λαὸν κατὰ τὸν νόμον
  choice: 律法に従って民から
  rationale: κατά の規範的意味を「従って」で表し、λαός は説明句を先取りせず簡潔に「民」とした。
- source_word: τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν
  choice: つまり、自分たちの兄弟たちから
  rationale: τοῦτ’ ἔστιν の説明機能を「つまり」で示した。ἀδελφούς の男性複数の親族語を本文に残し、イスラエルの同胞を広く指すことは脚注で補った。
- source_word: καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: 彼らもまた、アブラハムの腰から出た者たちであるにもかかわらず
  rationale: καίπερ の譲歩を明示し、共有された血統を強調する身体的な慣用句「腰から出る」を保持した。「彼ら」は直前の兄弟たちを受け、複数対格分詞の一致関係を反映する。
theological_decisions:
- issue: ἀδελφούς が指す同胞の範囲
  choice: 兄弟たち
  alternative: 同胞のイスラエル人たち
  rationale: 原文の男性親族語と、祭司たちと民が同じ祖先を持つという議論を本文で保った。一方、ここでは実の兄弟だけでなく同じ民に属する者を指すため、脚注で範囲を説明した。
- issue: アブラハムからの身体的血統を表す慣用句
  choice: アブラハムの腰から出た者たち
  alternative: アブラハムの子孫
  rationale: 単に「子孫」と平板化せず、祭司たちとその兄弟たちがともにアブラハムに由来するという7章の比較に関わる具体的な身体表現を保った。意味は脚注で明らかにした。
- issue: ἐξεληλυθότας の文法上の指示対象
  choice: 彼ら（祭司たちの兄弟たち）もまた
  alternative: 祭司たちもまた
  rationale: 分詞は直前の対格複数 τοὺς ἀδελφούς に文法的に一致しているため、直近の指示対象を維持した。結果として、徴収される兄弟たちもアブラハムの血統に属するという譲歩を表す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭司職・律法・十分の一という制度的語彙には聖書本文にふさわしい品位を保った。「アブラハムの腰から出た」は日常表現ではないが、原文の血統を示す具体的比喩を保持するため本文に置き、脚注で意味を補った。
