id: HEB.7.26
reference: Hebrews 7:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: ja
  text: 実に、このような大祭司こそ、私たちにふさわしい方でした。聖で、悪意がなく、汚れなく、罪人たちから分けられ[a]、天よりも高くなられた[b]方です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「罪人たちから離され」。
    reason: κεχωρισμένοςの自然な日本語としての語義上の代案を示すため。
  - marker: b
    text: 直訳「天よりも高くなった」。
    reason: ὑψηλότεροςとγενόμενοςの比較表現および「…となった」という語法を示すため。
lexical_decisions:
- source_word: Τοιοῦτος
  choice: このような
  rationale: 直前までに述べられた大祭司のあり方を受ける指示的な働きを、自然な日本語で保持する。
- source_word: γὰρ ... καὶ ἔπρεπεν
  choice: 実に…こそ、…ふさわしい
  rationale: γάρの説明的つながりと、καίが添える強調を、日本語として過度に硬くならない形で表す。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: ἔπρεπενとの関係で、信じる者たちにとって適切であることを示す。
- source_word: ἀρχιερεύς
  choice: 大祭司
  rationale: ヘブライ人への手紙における祭司職の標準的で明確な訳語。
- source_word: ὅσιος
  choice: 聖く
  rationale: 神への忠実さと道徳的・祭儀的な聖さを含みうる語として、文脈に適した簡潔な訳語。
- source_word: ἄκακος
  choice: 悪意がなく
  rationale: 単に無害であるという弱い意味を避け、悪や邪心のない性質を明瞭に表す。
- source_word: ἀμίαντος
  choice: 汚れなく
  rationale: 道徳的純潔と祭儀的な清さの響きを保ちつつ、現代日本語として分かりやすい。
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: 罪人たちから離され
  rationale: 完了分詞が示す、分けられた結果の状態を表す。地上で罪人と交わらなかったという意味に限定しない。
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: 天よりも高い所に上げられた
  rationale: 比較表現とγενόμενοςが示す到達した状態を自然な日本語で表し、文脈上の高挙を伝える。原文は字義的には『天よりも高くなられた』とも訳せる。
theological_decisions:
- issue: 「罪人たちから離され」の意味
  choice: 道徳的な純潔と、高く上げられた大祭司としての区別を示す表現として、そのまま訳す。
  alternative: 罪ある人々からの純粋に空間的な隔離、または昇天後だけの分離と限定する。
  rationale: 周囲の一連の形容は大祭司としての適格性、清さ、高挙を語っている。イエスが地上で罪人と交わったことを否定するように解釈を固定せず、原文の緊張を保つ。
- issue: γενόμενοςと天を超える高さとの関係
  choice: 救済史における高挙と、その結果としての大祭司的地位を示す「高い所に上げられた」と訳す。
  alternative: 単なる恒常的状態として「天よりも高い方である」、または主体を明示せず「天よりも高くなられた」と訳す。
  rationale: 分詞の出来事性と結果状態を表しつつ、キリストの神的本性が変化したという含意を避ける。
translation_notes:
  register: 明瞭で現代的ながら品位のある文体。「このような大祭司こそ」で直前の議論とのつながりと強調を示した。列挙は簡潔に保ち、「大祭司」を宗教的専門語として維持した。
