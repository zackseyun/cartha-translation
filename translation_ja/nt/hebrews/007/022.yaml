  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: ja
  text: イエスは、それだけ優れた契約[a]の保証人となられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「契約」と訳した語は、文脈によっては「遺言」を意味することもある。ここでは、祭司職と誓いについての議論から、「契約」が最も適切である。
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: それだけ
  rationale: 程度・度合いを表す句で、直前の誓いに基づく祭司職との比較を受けつつ、κρείττονος の比較の強さを自然な日本語で示す。
- source_word: κρείττονος
  choice: まさった
  rationale: ヘブライ人への手紙で繰り返される比較語の働きを保つ。現代日本語として明快で、単に抽象的な「優れた」より比較の響きが自然である。
- source_word: διαθήκης
  choice: 契約
  rationale: 語には文脈により「遺言」の意味もあり得るが、ここでは祭司職と誓いをめぐる議論なので、神の契約的取り決めを指す「契約」が最も適切である。
- source_word: γέγονεν
  choice: なられたのです
  rationale: 完了形が示す、成立した事実とその継続する結果を文脈上自然に表す。敬意を保つため「なられた」とした。
- source_word: ἔγγυος
  choice: 保証人
  rationale: 責任を負って確実性を保証する者を指す。人格的役割を明確にし、「保証」より原語の名詞の人物性を保つ。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で広く定着した人名表記。
theological_decisions:
- issue: διαθήκη の意味
  choice: 契約
  alternative: 遺言
  rationale: 後の箇所では「遺言」の語義との重なりが問題になり得るが、この節は誓いによって立てられたイエスの祭司職を論じており、「契約」が議論に適合する。別の語義の可能性は脚注に残す。
- issue: κατὰ τοσοῦτο が示す比較関係
  choice: 「それだけ」と訳し、直前の誓いによる祭司職との程度上の対応を保つ
  alternative: 「それゆえ」と因果関係だけを前面に出す
  rationale: 原句は単なる結論ではなく程度を示し、イエスが保証人となる契約がどれほどまさっているかを直前の議論に結び付けている。
translation_notes:
  register: 明快で格調ある現代標準日本語。「それだけ」で前節との論理的・比較的つながりを示し、「保証人」でイエスの人格的役割を明確にした。脚注記号[a]は本文中に配置済み。
