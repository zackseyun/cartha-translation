id: HEB.7.14
reference: Hebrews 7:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: ja
  text: というのも、私たちの主がユダから現れ出たことは明らかです[a]。この部族について、モーセは祭司に関して何も語っていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダから出られた」。原語には「昇る」「生え出る」というイメージがある。ここでは主として復活ではなく、ユダ族からの出自を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον γὰρ ὅτι
  choice: ことは明らかです
  rationale: 前節を受ける説明の流れは、日本語では文脈上自然に伝わるため、γάρを機械的に接続詞へ置き換えず、明白な事実を示す述語として簡潔に表した。
- source_word: ἐξ Ἰούδα
  choice: ユダから
  rationale: 出自・系統を示す表現。後続部分に「この部族」とあるため、ここで「ユダ族から」と補って重複させない。
- source_word: ἀνατέταλκεν
  choice: 出られた
  rationale: 原語が持つ「昇る、生え出る」という像を完全に系譜用語へ限定せず、現代日本語として自然に出自を表す。完了形が示す成立した事実も文脈に即して伝える。比喩的な含みは脚注で示す。
- source_word: ὁ κύριος ἡμῶν
  choice: 私たちの主
  rationale: 称号をそのまま保ち、文脈上の指示対象であるイエスを本文に補わない。
- source_word: εἰς ἣν φυλήν
  choice: この部族について
  rationale: 直前のユダを受ける関係表現を、明瞭で自然な日本語にした。
- source_word: περὶ ἱερέων οὐδὲν
  choice: 祭司に関して何も
  rationale: 抽象的な「祭司職」ではなく、原文どおり複数の「祭司」を保持した。
- source_word: Μωϋσῆς ἐλάλησεν
  choice: モーセは…語っていません
  rationale: λαλέωの基本的な意味を保ちつつ、聖書本文について述べる文脈に適した自然で品位ある表現とした。
theological_decisions:
- issue: 「私たちの主」の指示対象
  choice: 称号を「私たちの主」と訳し、イエスという名は補わない。
  alternative: 「私たちの主イエス」
  rationale: 文脈上はイエスを指すが、原文にない固有名を加えず、著者の表現を保持する。
- issue: ἀνατέταλκεν の意味
  choice: ユダからの出自を表す「出られた」とし、原語の像を脚注で示す。
  alternative: 「復活された」または系譜に限定した「子孫として生まれた」
  rationale: 議論の焦点は部族的出自であり、復活を第一義とする読みは文脈に合わない。一方、系譜だけに言い換えると「昇る・生え出る」という比喩が失われるため、本文と脚注で両面を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、論証的な文脈にふさわしい落ち着いた文体とした。「明白」「何一つ」など過度に硬い、または強調的な表現は避けた。
