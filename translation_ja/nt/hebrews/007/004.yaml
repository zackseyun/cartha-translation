source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: ja
  text: この方がどれほど偉大であったか、よく考えてください。あの族長アブラハムが、戦利品[a]の十分の一をこの方に与えたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「戦利品」と訳したギリシア語は、戦争で得た分捕り物を指し、その中でも最上の部分を意味する可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: よく考えてください
  rationale: 現在命令形で、読者に注意深い考察を促している。「見なさい」よりも、文脈上の思考への呼びかけを自然な現代日本語で表す。
- source_word: δὲ
  choice: 独立した語としては訳出しない
  rationale: ここでは弱い移行を示す。日本語では文脈の流れで十分に表せるため、「さて」などを機械的に補わない。
- source_word: πηλίκος
  choice: どれほど偉大であったか
  rationale: 大きさ・偉大さを表す語であり、その偉大さの具体的性質は後続の論証に委ねる。
- source_word: οὗτος
  choice: この方
  rationale: 直前のメルキゼデクを指す。敬意を帯びた自然な指示表現でありつつ、本文にない身分を付加しない。
- source_word: ᾧ
  choice: この方に
  rationale: 与える相手を示す関係代名詞。日本語では前文の「この方」を受けて文を分け、明瞭に表現する。
- source_word: δεκάτην
  choice: 十分の一
  rationale: 字義どおり「十分の一」。制度的含意を帯び得る「十分の一税」より直接的で、この箇所に適する。
- source_word: Ἀβραὰμ
  choice: アブラハム
  rationale: 日本語聖書で定着した固有名詞表記。
- source_word: ἔδωκεν
  choice: 与えた
  rationale: δίδωμιのアオリスト能動態を簡潔に表す。
- source_word: ἐκ τῶν ἀκροθινίων
  choice: 戦利品の
  rationale: ἀκροθίνιαは戦争で得た分捕り物・戦利品を指し、最上の部分という含みを持つ可能性もある。本文では確実な意味を採り、可能な含意は脚注に示す。
- source_word: ὁ πατριάρχης
  choice: 族長
  rationale: アブラハムの祖先としての際立った地位を示す称号。簡潔で定着した日本語表現。
theological_decisions:
- issue: メルキゼデクの偉大さとアブラハムの行為の関係
  choice: アブラハムが十分の一を与えた事実によって、メルキゼデクの偉大さを考えるよう促す訳とする。
  alternative: 十分の一を受けた者としてのメルキゼデクの優越性を、本文中でより明示する。
  rationale: 原文はメルキゼデクの偉大さを強調するが、その優越性についての詳しい神学的推論は周囲の議論に委ねられているため、この節の訳文では明示しすぎない。
- issue: ὁ πατριάρχηςの強調
  choice: 「族長アブラハムでさえ」とし、アブラハムの高い地位にもかかわらず彼が与えた、という論証上の重みを自然に示す。
  alternative: 語順を保って「アブラハム、すなわち族長が」とする。
  rationale: 「でさえ」は文脈上明白な含意を日本語で伝えるが、メルキゼデクの具体的な身分や権威を追加してはいない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」により指示対象への敬意を示し、二文に分けて勧告と根拠を読み取りやすくした。脚注記号[a]は該当する「戦利品」の内容を説明する文の末尾に置いた。
