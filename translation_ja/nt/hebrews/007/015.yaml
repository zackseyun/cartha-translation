id: HEB.7.15
reference: Hebrews 7:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: ja
  text: そして、メルキゼデクに似た[a]別の祭司が現れるなら、このことはなおいっそう明らかです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メルキゼデクに似た」という表現は、この章で詩編110編4節から引用される言い回しと議論を受けています。
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: いっそう
  rationale: すでに述べられた論証をさらに強める比較的な表現を、自然な現代日本語で示す。
- source_word: κατάδηλόν
  choice: 明らかです
  rationale: 「明白な、明らかな」という意味を簡潔に表し、περισσότερον ἔτιによる強意を重ねて訳しすぎない。
- source_word: εἰ
  choice: なら
  rationale: ギリシア語の条件表現を保持し、「以来」「なので」と断定的に解釈しない。文脈上、論証の根拠を提示する用法にも読める。
- source_word: κατὰ τὴν ὁμοιότητα Μελχισέδεκ
  choice: メルキゼデクに似た
  rationale: 直訳的な「メルキゼデクの類似に従って」より自然でありつつ、メルキゼデクを型とする対応関係を保持する。詩篇110篇4節を受けた本章の議論との結びつきも保つ。
- source_word: ἀνίσταται
  choice: 立てられる
  rationale: 祭司が現れ、務めに就く文脈を自然に表す。形態上は中動・受動形であり、「現れる」「起こる」も可能だが、ここでは任命・出現の含意を日本語として明瞭にする。
- source_word: ἱερεὺς ἕτερος
  choice: 別の祭司
  rationale: ἕτεροςが示す追加と相違の双方を「別の」で自然に保持し、単なる人数上の追加に限定しない。
theological_decisions:
- issue: ἕτεροςが祭司職の相違をどこまで強調するか
  choice: 別の祭司
  alternative: もう一人の祭司／異なる祭司
  rationale: レビ系祭司職とは区別され、メルキゼデクに対応する祭司という議論を示しながら、「異質な」とまで過度に強めない。
- issue: εἰの論理的機能
  choice: なら
  alternative: ので／以上
  rationale: 文脈上は事実を前提とする論証とも理解できるが、原文の条件形式を残して解釈上の幅を保つ。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文の条件構文を保ちつつ、日本語として不自然な名詞句の直訳は避けた。文末の読点は次節へ続く原文構造によるが、単独節として読めるよう句点とした。
