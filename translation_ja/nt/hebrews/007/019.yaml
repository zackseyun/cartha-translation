id: HEB.7.19
reference: Hebrews 7:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: ja
  text: というのも、律法は何一つ完全にはしなかった[a]。しかし、より優れた希望が導入され[b]、それによって私たちは神に近づくのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何一つ完成させなかった」。このギリシア語動詞には、「目標に至らせる」「完成させる」という意味もあります。
    reason: lexical_alternative
  - marker: b
    text: 直訳「より優れた希望の導入」。または「より優れた希望がもたらされ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: 何一つ
  rationale: 動詞ἐτελείωσενの目的語となる絶対的否定を、自然な現代日本語で明確に表す。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の内容を根拠づけて説明する接続機能を保ち、日本語として自然につなぐ。
- source_word: ἐτελείωσεν
  choice: 完全なものにはしなかった
  rationale: ヘブライ書で重要な「意図された完成・完全へ至らせる」という意味を保持しつつ、「何もしなかった」という過度に広い意味にはしない。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 文脈上、モーセの律法および祭司制度を含む法体系を指す、日本語聖書で明瞭かつ一般的な語。
- source_word: ἐπεισαγωγὴ
  choice: 導入され
  rationale: 名詞的な原文の構造を日本語では自然な受動表現にし、「新たに持ち込まれる、加えて導入される」という語義を簡潔に示す。
- source_word: δὲ
  choice: しかし
  rationale: 律法が完全にしなかったことと、より良い希望の導入との明確な対照を表す。
- source_word: κρείττονος ἐλπίδος
  choice: さらにまさった希望
  rationale: ヘブライ書に反復される比較語κρείττωνの「より良い／まさった」を保持する。「さらに」はἐπεισαγωγήに含まれる追加・新規導入の含意を自然に補う。
- source_word: δι’ ἧς
  choice: その希望によって
  rationale: 女性形関係代名詞の先行詞を「希望」と明示し、手段を表すδιάの機能を曖昧なく伝える。
- source_word: ἐγγίζομεν
  choice: 私たちは神に近づく
  rationale: 神への礼拝的接近というヘブライ書特有の響きを保ちながら、現代日本語として明快にする。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: ἐγγίζομενの到達・接近対象を簡潔に表す。
theological_decisions:
- issue: 律法との関係におけるτελειόωの意味
  choice: 律法は何一つ完全なものにはしなかった
  alternative: 律法は何も成し遂げなかった／律法は何一つ完成させなかった
  rationale: 律法があらゆる点で無価値だったとするのではなく、人を神の前で意図された完成へ至らせなかったという、ヘブライ書における完成・接近の神学的緊張を保つ。
- issue: 否定節に続く省略的な対照構文
  choice: しかし、さらにまさった希望が導入され
  alternative: しかし、さらにまさった希望の導入がある／しかし、さらにまさった希望がもたらされた
  rationale: 原文には後半の定動詞が明示されないが、日本語では受動動詞を補って自然にし、時制や主体を不必要に特定しない。
- issue: δι’ ἧςの先行詞
  choice: その希望によって
  alternative: その導入によって
  rationale: 文法上の女性形は「希望」にも「導入」にも一致し得るが、意味上は「よりまさった希望」を通して神に近づくという理解が最も自然である。訳文ではこの読みを採用し、原文の構造については過剰な教義的説明を加えない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「完全」「希望」「神に近づく」というヘブライ書の主要語彙を保った。原文の省略構文は、日本語の可読性のため最小限に動詞化した。脚注記号[a][b]は該当箇所に明示した。
