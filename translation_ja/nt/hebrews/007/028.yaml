id: HEB.7.28
reference: Hebrews 7:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: ja
  text: というのも、律法は弱さを抱える人間たちを大祭司に任命しますが、律法の後に与えられた誓いの言葉は、永遠に完全な者とされた御子[a][b]を任命するからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御子」に当たるギリシア語には冠詞がありません。「人間たち」との対比を際立たせる表現ですが、文脈上はイエスを指しています。直訳的には「子」とも訳せます。
    reason: 原文の冠詞の有無を日本語本文だけでは表しにくいため。
  - marker: b
    text: 「完全な者とされた」は、「完成された」、また祭司についての文脈では「祭司として聖別された」という意味を含む可能性があります。
    reason: τελειόω の完成・完全化・祭司的聖別にわたる意味の幅を示すため。
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: 文脈上、モーセの律法、とりわけ祭司制度に関する規定を指すため、聖書用語として一般的で明確な「律法」とした。
- source_word: καθίστησιν
  choice: 任命する
  rationale: 大祭司の職に正式に就ける意味を、現代日本語で自然かつ明確に表す。後半ではギリシア語で省略されている動詞を、対比を明瞭にするため補った。
- source_word: ἀνθρώπους
  choice: 人間たち
  rationale: 複数の歴代大祭司を指すと同時に、御子との対比における彼らの人間性を明確にする。性別を明示する語ではないため、原語に即して「人間たち」とした。
- source_word: ἀρχιερεῖς
  choice: 大祭司
  rationale: 歴代の複数の任職者を指すが、日本語では「人間たちを大祭司に任命する」で複数性が自然に伝わる。
- source_word: ἔχοντας ἀσθένειαν
  choice: 弱さを抱える
  rationale: ἀσθένειαの名詞性を保ちつつ、身体的な病気だけでなく、人間としての脆弱さや罪への弱さも含み得る表現とした。
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: 誓いの言葉
  rationale: 神が誓いをもって語った宣言を指す。λόγοςを「言葉」として残し、詩篇から引用された宣言とのつながりを保つ。
- source_word: τῆς μετὰ τὸν νόμον
  choice: 律法の後に与えられた
  rationale: 誓いの言葉が律法より後の時代に与えられたという議論を、自然な日本語で明示する。「与えられた」は文脈上の補足である。
- source_word: υἱόν
  choice: 御子
  rationale: 文脈上イエスを指すため、日本語の定着した敬称「御子」を用いた。ギリシア語に冠詞がない点は、日本語に不自然な不定表現を持ち込まず脚注で示した。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: 終わることのない祭司職を表す、この文脈で最も自然な訳語。
- source_word: τετελειωμένον
  choice: 完全な者とされた
  rationale: 完了受動分詞の形と、完成・適格化・祭司的聖別にまたがる意味の広がりをできる限り保持した。
theological_decisions:
- issue: 冠詞のない υἱόν と ἀνθρώπους の対比
  choice: 本文では「御子」、冠詞がないことを脚注で説明
  alternative: 一人の御子／子
  rationale: 冠詞のない形は「人間たち」に対する御子としての性質を際立たせ得るが、日本語の「一人の御子」は複数の御子の一人という不要な含意を生みやすい。文脈上の指示対象を明確にしつつ、原文の形は脚注で保持した。
- issue: τετελειωμένον の祭司論的意味
  choice: 完全な者とされた
  alternative: 完成された／祭司として聖別された
  rationale: 「聖別された」だけに限定せず、ヘブライ人への手紙における完全化・完成・祭司としての適格化という意味の緊張を保った。完了受動の結果が持続していることも「とされた」で表した。
translation_notes:
  register: 明快な現代標準語を用いながら、「律法」「大祭司」「御子」など定着した聖書語彙を保持した。前節までの論証を受ける γάρ は「というのも……からです」で表し、律法と誓いの言葉、人間たちと御子の対比が一読で分かる文にした。
