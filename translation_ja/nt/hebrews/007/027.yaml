id: HEB.7.27
reference: Hebrews 7:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: ja
  text: この方には、大祭司たちのように、まず自分の罪のために、次に民の罪のために、日ごとにいけにえを献げる必要はありません。なぜなら、このこと[a]を、ご自分を献げることによって[b]、ただ一度限り[c]行ったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「このこと」が厳密にどこまでを指すかについては、民の罪のために献げることを指すとも、ここで述べられた祭儀的行為全体を指すとも取れます。
    reason: 原文の指示語τοῦτοの範囲に解釈上の幅があるため。
  - marker: b
    text: 別訳「ご自分を献げたとき」または「ご自分を献げて」。
    reason: ギリシア語の分詞は、手段・時・付帯状況のいずれとしても表し得るため。
  - marker: c
    text: 別訳「ただ一度、決定的に」または「ただ一度」。
    reason: ἐφάπαξは、一回限りであることを強調する語であるため。
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 日ごとに
  rationale: 反復される日々の必要を表すギリシア語の慣用句を、自然で簡潔な現代日本語にした。
- source_word: ἀνάγκην
  choice: 必要
  rationale: ἔχει ἀνάγκην の「必要がある」という構文に対応し、日本語として最も自然である。
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: 大祭司たちのように
  rationale: 比較の意味と、ギリシア語の複数形をそのまま保った。
- source_word: πρότερον ... ἔπειτα
  choice: まず……次に
  rationale: いけにえを献げる順序を明瞭かつ自然に示す。
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: 自分の罪のために
  rationale: 祭儀的文脈におけるὑπέρの意味を、簡潔で明瞭な日本語で表した。
- source_word: θυσίας ἀναφέρειν
  choice: いけにえを献げる
  rationale: 祭儀用語としてのἀναφέρωを表しつつ、現代の一般読者にも理解しやすい表現とした。
- source_word: τῶν τοῦ λαοῦ
  choice: 民の罪のために
  rationale: 原文は直前の「罪」を省略しているが、日本語では補わないと不自然になりやすいため、意味を明示した。
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: このことを……成し遂げたからです
  rationale: τοῦτοの指示性を保ち、ἐποίησενは文脈上の決定的な祭儀行為を自然に表すため「成し遂げた」とした。
- source_word: ἐφάπαξ
  choice: ただ一度で
  rationale: 一回限りで決定的な行為であることを表す。「一度だけ」よりも、完結性を自然に伝える。
- source_word: ἑαυτὸν ἀνενέγκας
  choice: ご自分を献げることによって
  rationale: 自己犠牲と祭司的行為の双方を保ち、分詞が主動詞の手段を示す読みを本文に採用した。
theological_decisions:
- issue: 「このこと」（τοῦτο）の指示範囲
  choice: 直前に述べられた、罪に対処する祭儀的行為を指す表現として保持した。
  alternative: 民の罪のために献げることだけを指す、または祭司としての働き全体を広く指す。
  rationale: 原文の指示語が持つ幅を本文で限定しすぎないようにした。文脈はキリストが自分の罪のために献げたという理解を支持しないが、その説明を本文へ付加して原文の構文上の緊張を消すことも避けた。
- issue: 分詞ἑαυτὸν ἀνενέγκαςの関係
  choice: 手段を示す「ご自分を献げることによって」とした。
  alternative: 時を示す「ご自分を献げたとき」、または「ご自分を献げて」。
  rationale: 自己奉献が「このこと」を成し遂げる手段であるという文脈上自然な関係を示す一方、別の統語的理解は脚注で保持した。
- issue: キリストの自己奉献の祭儀性
  choice: 「ご自分を献げる」とした。
  alternative: 「ご自分を与える」。
  rationale: ヘブライ人への手紙における祭司といけにえの語彙的連関を保ち、一般的な自己犠牲へと意味を弱めないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬意を示す「この方」「ご自分」を採用した。祭儀語は「いけにえ」「献げる」で統一し、荘重さを保ちながら古語的な言い回しは避けた。
