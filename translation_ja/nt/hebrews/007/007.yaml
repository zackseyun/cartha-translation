base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: ja
  text: 異論の余地なく[a]、下の者が上の者から祝福を受けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いかなる異論もなく」「反論の余地なく」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: 議論の余地なく
  rationale: χωρίς＋属格の「〜なしに」と πάσης ἀντιλογίας の「いかなる反論・異論も」を、日本語の自然な慣用表現で示した。δέの弱い展開・対照の機能は文脈に委ね、過度な接続語を加えていない。
- source_word: τὸ ἔλαττον
  choice: より小さい者
  rationale: 中性単数の比較級が実体詞的・一般的に用いられ、「より小さい者」を指す。ここでの大小は人格的価値ではなく地位・序列の比較であるため、「劣った者」は避けた。
- source_word: ὑπὸ τοῦ κρείττονος
  choice: より大きい者から
  rationale: ὑπό＋属格は受動文の行為者を示す。κρείττων は文脈上、地位の上位性を表すため、「より優れた者」よりも原文の比較表現を保つ「より大きい者」とした。
- source_word: εὐλογεῖται
  choice: 祝福を受けます
  rationale: 現在受動形を、日本語で明瞭かつ自然な受益表現にした。文脈はメルキゼデクがアブラハムを祝福した出来事であり、単なる「褒められる」では弱い。
theological_decisions:
- issue: 「より小さい者」と「より大きい者」の比較の性質
  choice: 地位のより低い者が、より高い者から祝福を受けるという一般原則として訳す。
  alternative: 神学的意味を伴わない単なる社会慣習として読む。
  rationale: ヘブライ人への手紙7章では、この原則がアブラハムに対するメルキゼデクの優位性を支える。ただし訳文には「地位」や「祭司職」を補わず、原文の簡潔な比較とその解釈上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、格調を保った。「祝福されます」も可能だが、行為者を「〜から」で自然に示すため「祝福を受けます」とした。
