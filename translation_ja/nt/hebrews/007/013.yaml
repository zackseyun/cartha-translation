id: HEB.7.13
reference: Hebrews 7:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: ja
  text: なぜなら、これらのことが言われているその方は、別の部族に属しておられ[a]、その部族からは、だれ一人として祭壇に仕えた[b]者がいないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「別の部族に連なっておられ」または「別の部族の一員であり」。ギリシア語の動詞は、何かを共に持つことや、それに関わることを表し、ここでは部族への所属を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「祭壇の務めに携わった」。この表現は、祭壇に関わる祭司の奉仕を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: その方について／その方に関して（本文では「これらのことが言われているその方」）
  rationale: ἐπί＋対格が示す「〜について」という関係を、受動表現と組み合わせて自然な日本語にした。指示対象を明確にしつつ、原文にない固有名は補わない。
- source_word: γὰρ
  choice: なぜなら……からです
  rationale: 前節の主張に根拠を与える説明の接続を明示し、日本語として自然な呼応表現にした。
- source_word: λέγεται ταῦτα
  choice: これらのことが言われている
  rationale: 現在受動と複数形 ταῦτα を保ち、「このこと」と単数化しなかった。
- source_word: φυλῆς ἑτέρας
  choice: 別の部族
  rationale: イスラエルの部族を指す φυλή を「部族」とし、ἑτέρας が示す祭司部族とは異なる部族という対照を「別の」で表した。
- source_word: μετέσχηκεν
  choice: 属しておられ
  rationale: 完了形が示す現在に及ぶ確立した関係を踏まえ、文脈上の部族的所属を自然に表した。字義的な「分け前を持つ」に固定せず、かといって「子孫である」と系譜を明示しすぎない。
- source_word: ἀφ’ ἧς
  choice: その部族からは
  rationale: 関係代名詞の先行詞 φυλή を日本語で明示し、対比を示す係助詞「は」を添えた。
- source_word: οὐδεὶς
  choice: だれ一人として……者がいない
  rationale: 全面的否定を明確かつ自然な日本語で表した。
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: 祭壇に仕えた
  rationale: προσέχω の祭儀的文脈における、祭壇に付き従って務めを果たす意味を簡潔に表した。単に注意を向けるという一般的意味にはしなかった。
- source_word: θυσιαστηρίῳ
  choice: 祭壇
  rationale: 犠牲をささげる文脈で定着しており、明瞭な標準訳語である。
theological_decisions:
- issue: 祭司職の議論における、その方とレビ系ではない部族との関係
  choice: 「別の部族に属しておられ」とし、部族的所属を示すにとどめた。
  alternative: 「別の部族の子孫であり」または「別の部族から出ておられ」と訳す。
  rationale: 文脈はイエスの祭司職がレビ系の血統によらないことを論じているが、μετέσχηκεν 自体は明示的に「子孫である」と述べる語ではない。原文の意味の幅と議論上の緊張を保つため、系譜を過度に説明しない。
- issue: 節内で指示される人物の特定
  choice: 「その方」とし、イエスという名を本文に補わない。
  alternative: 「イエスは」と明示する。
  rationale: 文脈上の指示対象は明らかでも、この節の原文は関係表現を用いているため、その構文を尊重した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、論証を示す「なぜなら……からです」の形で前後のつながりを保った。指示対象には文脈にふさわしい敬意を込めて「その方」「属しておられ」としたが、原文にない教理説明や部族名は加えていない。
