id: HEB.11.10
reference: Hebrews 11:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: ja
  text: 彼は、土台を備えた都[a]を待ち望んでいたからです。その都の設計者であり建設者であるのは、神です。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「もろもろの土台を持つ都」。原文の「土台」は複数形で、堅固さや永続性を強調している可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その都の設計者また造り主は神です」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: 待ち望んでいた
  rationale: 未完了過去の継続的な期待と忍耐強い待望を自然な日本語で表す。単なる「待っていた」より期待の含意を保つ。
- source_word: γὰρ
  choice: からです
  rationale: 前節でアブラハムが寄留者として暮らした理由を説明する接続関係を示す。
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: 土台を持つ都
  rationale: 分詞句の簡潔な構造を保ち、文脈上特定された終末的な都を「都」と訳す。「土台」を明示して天上の都などの解釈を本文に加えない。
- source_word: θεμελίους
  choice: 土台
  rationale: ギリシア語は複数形だが、日本語では集合的に「土台」とするのが自然であり、仮設の天幕と対照される堅固さも伝わる。脚注で原文の複数形を示す。
- source_word: πόλιν
  choice: 都
  rationale: 単なる町ではなく、神に属する特別な都市という文脈と格調を自然に表す。ただし本文では「天の都」と特定しない。
- source_word: ἧς
  choice: その都を
  rationale: 関係代名詞の属格関係を、日本語では指示表現で受け直し、後続の設計・建造との関係を明瞭にする。
- source_word: τεχνίτης
  choice: 設計し
  rationale: 熟練した職人・設計者を表す語を、δημιουργόςとの対句の中で計画・設計の側面として自然に訳す。
- source_word: δημιουργός
  choice: 造った方
  rationale: 都の建造者という具体的な像を保ちつつ、神を指すため敬意ある「方」を用いる。名詞を動詞化して自然な日本語にした。
- source_word: ὁ θεός
  choice: 神
  rationale: 節の主語として標準的に訳す。
theological_decisions:
- issue: 約束された都の性質
  choice: 「土台を持つ都」とし、本文ではその堅固さを示す像だけを保つ。
  alternative: 「天の都」「永遠の土台を持つ都」
  rationale: この節自体は都を「天の」と明記せず、神が設計し造ったことによって特徴づけるため、近接文脈からの同定を本文に持ち込まない。
- issue: τεχνίτης と δημιουργός の役割の区別
  choice: 「設計し、造った方」と訳す。
  alternative: 「設計者また建設者」「職人また造り主」
  rationale: 二語の計画と実現の側面を区別しつつ、神の働きを別々の二者のように見せず、自然な一文で表す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文にふさわしい品位を保った。「待ち望んでいた」で継続的な期待を表し、「都」は文脈上の特別な都市を示す。「設計し、造った方」は原語二語の区別を読みやすく伝える。すべての脚注記号を本文に配置した。
