id: HEB.11.4
reference: Hebrews 11:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: ja
  text: 信仰によって、アベルはカインよりも優れたいけにえを神に献げました[a]。そのいけにえによって、彼が正しい者であるとの証しを受けました。神が彼の供え物について証ししておられたのです。そして彼は死にましたが、それによって今なお語っています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「より大きないけにえ」とも訳せます。ギリシア語の比較表現は、質の優越にも規模の大きさにも重点を置き得ます。
    reason: lexical_alternative
  - marker: b
    text: 「それ」はアベルの信仰を指すとも、彼のいけにえを指すとも取れます。ギリシア語では指示対象が明示されていません。
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: 信仰によって
  rationale: 手段を表す与格として理解した。ヘブライ人への手紙11章の主題語であるため、πίστιςを標準的な「信仰」とした。
- source_word: πλείονα θυσίαν
  choice: よりも優れたいけにえ
  rationale: πλείωνには質的な「より優れた」と量的な「より大きな／多くの」の両義があり得る。文脈上は質的比較が自然だが、別の可能性を脚注に残した。θυσίαは祭儀的文脈に即して「いけにえ」とした。
- source_word: παρὰ Κάϊν
  choice: カインよりも
  rationale: 比較級とともに用いられたπαράが比較の基準を示すことを、自然な日本語で表した。
- source_word: προσήνεγκεν τῷ θεῷ
  choice: 神に献げました
  rationale: προσφέρωの祭儀的意味を「献げる」で表した。「捧げる」より、供犠として差し出す意味が明確になる表記を採用した。
- source_word: δι’ ἧς
  choice: そのいけにえによって
  rationale: 女性形の関係代名詞が直前の女性名詞θυσίανを受ける文法関係を明示した。
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: 正しい者であると証しされました
  rationale: 受動形の証言・証明の語感を保ち、δίκαιοςを「正しい者」とした。日本語として不自然な直訳を避けつつ、11章に反復される「証し」の主題を維持した。
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: 神が彼の供え物について証しされたのです
  rationale: 属格独立構文を、前文を説明する自然な文として訳した。δῶραは供犠の文脈に合わせて「供え物」とした。
- source_word: δι’ αὐτῆς
  choice: それによって
  rationale: 女性形代名詞が「信仰」と「いけにえ」のどちらを指すか確定しきれないため、本文では指示対象を限定しない表現にした。
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: 彼は死にましたが、それによって今なお語っています
  rationale: アオリスト分詞と「なお」の対照から自然に読み取れる譲歩的な関係を「死にましたが」で表し、現在形の継続性を「今なお語っています」で示した。
theological_decisions:
- issue: 末尾のδι’ αὐτῆςが指すもの
  choice: 本文では「それによって」とし、指示対象を限定しない
  alternative: 「その信仰によって」または「そのいけにえによって」
  rationale: 文法上、女性名詞であるπίστις（信仰）とθυσία（いけにえ）のいずれも候補になり得る。章全体の主題は信仰だが、近接する先行詞はいけにえであるため、真正な曖昧さを本文と脚注で保った。
- issue: ἐμαρτυρήθηの意味合い
  choice: 「証しされました」
  alternative: 「認められました」または「称賛されました」
  rationale: 神の肯定的評価は含まれるものの、より解釈的な語に置き換えず、ヘブライ人への手紙11章におけるμαρτυρέωの証言モチーフを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。敬体で統一し、「いけにえ」「献げる」「証し」など一般読者にも理解可能で、かつ祭儀・神学上の含意を保てる語を選んだ。
