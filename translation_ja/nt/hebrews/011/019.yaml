id: HEB.11.19
reference: Hebrews 11:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: ja
  text: アブラハムは、神には死者の中から人をよみがえらせることさえおできになる、と考えました。そのようにして[a]、彼は比喩的に言えば[b]、イサクを取り戻したのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「そこから」または「そのことから」。直前の「死者の中から」を受け、イサクをそこから取り戻した、という含みをもつとも理解できます。
    reason: lexical_ambiguity
  - marker: b
    text: または「たとえとして」。イサクは実際に復活したのではありませんが、死から戻されたかのようにアブラハムのもとへ返されました。
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: 考えました
  rationale: アブラハムが事情を踏まえて内心で判断したことを表す分詞です。現代日本語として自然であり、思考・推論の意味を保ちます。
- source_word: ἐκ νεκρῶν ἐγείρειν
  choice: 死者の中からよみがえらせる
  rationale: 復活を表す定型的な文脈です。複数形 νεκρῶν の「死者の中から」という意味も明示しました。
- source_word: δυνατὸς ὁ θεός
  choice: 神には…できる
  rationale: 神の能力を述べる現在的・一般的な判断として、簡潔で自然に表しました。
- source_word: ὅθεν
  choice: こうして
  rationale: 直前のアブラハムの判断を受け、その結果としてイサクを取り戻したことを自然に結びます。ただし、語には「そこから」という起点的な響きもあるため脚注に残しました。
- source_word: ἐν παραβολῇ
  choice: 比喩的な意味で
  rationale: 実際の復活ではなく、死から取り戻したかのようであったことを示します。「たとえとして」という類型的な含みも脚注で保持します。
- source_word: ἐκομίσατο
  choice: 取り戻した
  rationale: 犠牲としてささげようとしたイサクを再び得たという文脈上の意味を、簡潔な現代日本語で表します。
- source_word: καὶ ἐκ νεκρῶν
  choice: 死者の中から…ことさえ
  rationale: καί の強調を「さえ」で示し、死者をよみがえらせることまでも神には可能だという意味を保ちます。
theological_decisions:
- issue: イサクを「取り戻した」ことの性質
  choice: 実際の復活ではなく、比喩的な意味で死から取り戻したものとして訳す
  alternative: 「一つのたとえとして」または「型として」と訳し、類型的意味を前面に出す
  rationale: ἐν παραβολῇ は、イサクが文字どおり復活したのではなく、死に渡されたも同然の状態から戻されたことを示します。一方、救済史的な類型への含みを排除しないよう脚注を付しました。
- issue: ὅθεν の関係
  choice: 推論と結果を結ぶ「こうして」
  alternative: 「そこから」、すなわち死者の中から取り戻したと読む
  rationale: ὅθεν は理由・結果を導くことも、起点を示すこともでき、この箇所では両者が重なり得ます。本文は自然な因果関係を示し、起点的な読みは脚注に保持しました。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語です。前節からの主語を明確にするため「アブラハム」と「イサク」を補い、丁寧体で統一しました。
