  - severity: low
    issue: 脚注bがἐν παραβολῇを「実際に復活したのではなく」と説明している
    rationale: 文脈上その理解は妥当ですが、語句自体の意味を完全に尽くすものではありません。「比喩的・たとえとして」という語義を中心にし、復活ではなく死から戻されたかのような出来事であることを補足する表現がより中立的です。
