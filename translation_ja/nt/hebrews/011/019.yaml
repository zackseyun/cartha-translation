  to: アブラハムは、神には死者の中から人をよみがえらせることさえおできになる、と考えました。そのようにして[a]、彼は比喩的に言えば[b]、イサクを取り戻したのです。
  rationale: ὅθενの参照先と機能には解釈上の幅があるため、本文の「こうして」を「そのようにして」に改め、脚注で起点的な読みを保持しました。また、ἐν παραβολῇの説明を、原語が示す比喩・類比の意味を中心にした中立的な表現へ整えました。
