  source_fidelity: 「こうして」はὅθενを一義的に結果を示す語として扱っており、同語にある「そこから／そのことを通して」という前文への参照の余地を十分に保っていません。「そのようにして」として、アブラハムの判断と、死から取り戻すという比喩的な描写の双方に開かれたつながりを保つのが安全です。ἐν παραβολῇは実際の復活を否定する説明ではなく、比喩・類比・たとえの領域での受け取りを述べるため、本文は「比喩的に言えば」とします。
  naturalness: 「神には……おできになる」は明瞭で格調を保つ現代標準日本語です。「死者の中から人をよみがえらせる」と目的語を補うことで、日本語として「神自身がよみがえる」という誤読を避けます。「そのようにして」は本文中でも自然で、脚注に語義上の参照先の幅を残せます。
  terminology: 「よみがえらせる」は復活の文脈に適切です。「イサク」「アブラハム」も標準的です。「比喩的に言えば」はἐν παραβολῇの意味を過度に教義的・類型論的に限定せずに示します。
