reference: Hebrews 11:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: ja
  text: こうして、ただ一人の人から、しかも死んだも同然の状態にあった人から[a]、天の星のように数多く、海辺の数え切れない砂のように、多くの子孫が生まれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「一人から、しかも死んだ状態にされた者から」。ここでは、アブラハムが高齢で、通常なら子をもうけられない状態にあったことを指します。
    reason: νενεκρωμένουの字義的に強い表現と、文脈上の比喩的意味を示すため。
lexical_decisions:
- source_word: διὸ
  choice: こうして
  rationale: 前節の信仰と約束の受領を受け、その結果を示す推論的な接続として、自然な現代日本語にした。
- source_word: ἀφ’ ἑνὸς
  choice: ただ一人の人から
  rationale: 男性形と文脈からアブラハムを指す。固有名を補わず、原文の「一人」を保ちながら、人を指すことを明確にした。
- source_word: ἐγεννήθησαν
  choice: 子孫が生まれました
  rationale: 文法上は複数受動形であり、文脈上、生まれた者たちがアブラハムの子孫であることを自然に表した。
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: しかもその人はすでに死んだも同然であったのに
  rationale: 完了分詞が示す持続的な状態を「すでに」で表し、文字どおりの死ではなく、高齢による生殖能力の衰えを示す比喩として訳した。譲歩の含みも自然に示した。
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: 天の星のように数多く
  rationale: τῷ πλήθει の数量の観点を明示しつつ、約束を想起させる格調を保った。
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: 海辺の数え切れない砂のように
  rationale: 「海の縁にある砂」という原文の像を、日本語で自然な「海辺の砂」とし、ἀναρίθμητοςを「数え切れない」で明瞭に表した。
theological_decisions:
- issue: 「一人から」の指示対象
  choice: 「ただ一人の人」と訳し、文脈上アブラハムを指すようにした。
  alternative: 「一人から」または「一人の男性から」とする。
  rationale: 原文は男性形で、直前の文脈ではアブラハムが指示対象である。ただし原文にない固有名を本文へ入れず、表現上の余地を保った。
- issue: νενεκρωμένου の意味
  choice: 「死んだも同然」とし、高齢で子をもうける力が失われた状態を表す比喩と理解した。
  alternative: 「死んだ者となっていた」など、より字義的に訳す。
  rationale: アブラハムは文字どおり死んでいたのではなく、子をもうける点で人間的な望みがない状態だった。奇跡性を保ちつつ誤解を避けた。
- issue: 子孫の明示
  choice: ἐγεννήθησαν の主語を文脈に即して「子孫」と明示した。
  alternative: 「多くの者が生まれた」とする。
  rationale: 後続の星と砂の比喩は約束された多数の子孫を指すため、日本語として必要な主語を明確にしたが、子孫の範囲や性質は限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、約束の言葉を響かせる「天の星」「海辺の砂」によって聖書的な格調を保った。敬体で統一し、「死んだも同然」は一般読者に理解しやすく、原文の強い比喩も保持する。
