source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: ja
  text: 信仰によって、彼らは乾いた地を通るかのように紅海[a]を渡りました。エジプト人はそれを試みましたが、のみ込まれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「葦の海」。ここでギリシャ語本文は「紅海」（Ἐρυθρὰν Θάλασσαν）としていますが、出エジプト記で用いられるヘブライ語の地名表現は「葦の海」を意味すると理解されることもあります。
    reason: 原文間の地名表現と語源上の別訳を示すため。
lexical_decisions:
- source_word: Πίστει
  choice: 信仰によって
  rationale: 手段を表す与格として理解した。ヘブライ人への手紙11章で繰り返される中心的な表現を保ち、自然な日本語にした。
- source_word: διέβησαν
  choice: 渡りました
  rationale: 一方から他方へ通り抜けることを表す。海を横断する文脈では「渡る」が明快で自然である。
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: 紅海
  rationale: ギリシャ語本文を直接反映する、日本語聖書および一般地理で定着した名称。出エジプト記のヘブライ語地名に基づく別訳は脚注に示した。
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: 乾いた地を通るように
  rationale: ὡςの比較と、前置詞διάが示す通過の意味をともに保った。「乾いた地」は出エジプトの出来事とのつながりも明瞭にする。
- source_word: ἧς πεῖραν λαβόντες
  choice: 同じことを試みましたが
  rationale: πεῖραν λαμβάνεινは「試みる」という慣用表現。ἧςが直前の海の横断を受ける関係を「同じこと」で自然に示した。接続助詞「が」は、試みと結果の対照を明確にする。
- source_word: οἱ Αἰγύπτιοι
  choice: エジプト人たち
  rationale: 出エジプトの物語でイスラエル人を追ったエジプト側の人々を指す表現として、原文の民族名をそのまま訳した。
- source_word: κατεπόθησαν
  choice: のみ込まれました
  rationale: καταπίνωの受動態が持つ「のみ込む」という鮮明な比喩を保持した。「溺れた」より原文の表現に近い。
theological_decisions:
- issue: ヘブライ人への手紙11章における πίστις の訳語
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: 章全体で反復されるΠίστειの定型句を一貫して表し、この文脈で模範となる人々の行動を生み出した信仰を示す。語義上の他の可能性によって本文の意味を狭める必要はない。
- issue: エジプト人が試みた対象
  choice: イスラエル人と同じ海の横断を試みた
  alternative: 海そのものを試した
  rationale: ἧς πεῖραν λαβόντεςの統語には直訳上の硬さがあるが、文脈上は先行する紅海横断をエジプト人も試みたことを指す。「同じこと」でその照応を示しつつ、過度に説明を加えなかった。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で格調を保った「です・ます」体を採用した。「のみ込まれました」によって原文の鮮明な受動表現を残し、「同じことを試みましたが」でギリシャ語の照応関係を自然な日本語にした。
