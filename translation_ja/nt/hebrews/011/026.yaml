id: HEB.11.26
reference: Hebrews 11:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: ja
  text: モーセは、メシア[a]の辱め[b]を、エジプトの宝にまさる大きな富と考えました。報いに目を向けていたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。ギリシア語のΧριστόςは「キリスト」とも訳せますが、ここでは称号としての意味を示すため「メシア」としました。
    reason: alternative_reading
  - marker: b
    text: 「メシアの辱め」は、メシアのために受ける辱め、神に油注がれた方と共に担う辱め、または後にメシアにおいて成就すると本書が見る辱め、という意味を含み得ます。ギリシア語の関係を一つに限定せず訳しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: より大きな富／…にまさる大きな富
  rationale: 比較級と「富」の組み合わせを保ちつつ、日本語では比較対象と結んで「エジプトの宝にまさる大きな富」と自然に表現しました。
- source_word: ἡγησάμενος
  choice: 考えました
  rationale: ἡγέομαιの評価・判断を表す意味を、明瞭な現代日本語で示します。文脈上の主語を補って独立した節として訳しました。
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: エジプトの宝
  rationale: 属格の関係を簡潔に保ち、富との対比が明確になる表現です。
- source_word: τὸν ὀνειδισμὸν
  choice: 辱め
  rationale: 公然と受ける非難、不名誉、侮辱を含み得る語であり、「辱め」は聖書的な響きと現代日本語での理解しやすさを両立します。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςが称号として機能しているため「メシア」としました。属格の関係は解釈で限定せず、そのまま保持しました。
- source_word: ἀπέβλεπεν
  choice: 目を向けていた
  rationale: 未完了過去が示す持続的な注視・志向を自然な日本語で表します。
- source_word: τὴν μισθαποδοσίαν
  choice: 報い
  rationale: 文脈における将来の報償を、簡潔で一般読者に分かりやすい語で示します。
theological_decisions:
- issue: モーセと「メシアの辱め」との関係
  choice: 「メシアの辱め」という属格表現を保持する
  alternative: 「メシアのために受ける辱め」「メシアと共に受ける辱め」「後にメシアにおいて成就する辱め」
  rationale: ギリシア語の属格は複数の関係を含み得ます。本文で一つに決めず、ヘブライ人への手紙が示すキリスト論的な緊張と曖昧さを保ちました。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法よりも「油注がれた者」という称号性が前面にあるため「メシア」とし、慣用的な別訳を脚注に示しました。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「モーセ」は直前の文脈で示される主語を、単独の節として理解できるよう補いました。「辱め」はやや格調を保ちながらも一般読者に通じる語です。
