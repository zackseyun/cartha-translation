source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: ja
  text: 信仰によって、アブラハムは試練を受けていたとき、イサクを献げました。約束を受けた彼は、その独り子[a]を献げていたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「独り子」と訳したギリシャ語は、「ただ一人の子」「比類のない子」とも訳せます。この語は必ずしも生物学上の一人息子だけを指すとは限りません。「ひとり子」は伝統的な訳語です。
    reason: μονογενής の唯一性・特別性の含みを示し、イサクがアブラハムの唯一の生物学上の息子であったという誤解を避けるため。
lexical_decisions:
- source_word: Πίστει
  choice: 信仰によって
  rationale: 手段を表す与格として、章全体で繰り返される定型を自然な現代日本語で表した。
- source_word: προσενήνοχεν
  choice: 献げました
  rationale: προσφέρωの完了形。ここでは物語上の出来事を要約しており、犠牲として神に献げる意味を保つ「献げる」が適切である。
- source_word: πειραζόμενος
  choice: 試練を受けていたとき
  rationale: 現在受動分詞の継続性と時間的関係を示す。「誘惑された」ではなく、信仰が試される文脈に即して「試練を受ける」とした。
- source_word: μονογενῆ
  choice: 独り子
  rationale: 単なる出生の仕方ではなく、唯一無二の特別な子という意味を簡潔に表す伝統的かつ通用する日本語。イサクがアブラハムの唯一の実子だったという誤解を避けるため注を付した。
- source_word: προσέφερεν
  choice: 献げようとしていた
  rationale: 未完了過去の進行中の場面を自然な日本語で表し、実際には完遂されなかった創世記の出来事にも適合させた。ただし、企図の意味を明示する点は文脈に基づく日本語上の調整である。
- source_word: ἀναδεξάμενος
  choice: 受け入れた
  rationale: 約束を単に聞いたのではなく、自ら受領したことを表す中動態分詞を自然に表現した。
- source_word: ἐπαγγελίας
  choice: 約束
  rationale: ギリシャ語は複数形だが、日本語では集合的に「約束」とするほうが自然であり、神から与えられた一連の約束を指し得る。
theological_decisions:
- issue: イサクについての μονογενής の解釈
  choice: 本文では「独り子」とし、唯一無二の特別な息子という意味を注で明示した。
  alternative: 「ただ一人の息子」「唯一の息子」「かけがえのない息子」
  rationale: アブラハムにはイシュマエルもいたため、実子がイサク一人だけだったという意味には限定できない。約束を受け継ぐ唯一無二の息子という本文の緊張を保ち、後代のキリスト論的用語をこの箇所へ不必要に持ち込まない。
- issue: 二度目の προσφέρω の未完了過去
  choice: 「献げようとしていた」とした。
  alternative: 「献げていた」「献げた」
  rationale: 未完了過去の進行性と、行為が完遂される前に止められた物語的状況を自然な日本語で示した。単純過去より場面性を保つが、ギリシャ語自体が必ずしも未遂を語彙的に表すわけではないことには留意した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「献げる」は礼拝・犠牲の文脈を伝えるため漢字表記とした。長いギリシャ語の一文は、日本語で理解しやすいよう二文に分けた。
