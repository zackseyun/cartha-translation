  naturalness: 「イサクやヤコブ」は、この二人が例示にすぎないようにも響くため、原文の明示的な二人の並列には「イサクとヤコブ」が適切である。「同じ約束の共同相続人」はやや格調のある語だが、相続を共にするという συγκληρονόμων の意味を過不足なく自然に示す。
  terminology: 「信仰によって」「約束の地」「寄留」「天幕」は本文脈に適した訳語である。「共同相続人」は専門用語化しすぎず、同じ約束との属格関係および共同性を保てる。
