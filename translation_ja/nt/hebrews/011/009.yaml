id: HEB.11.9
reference: Hebrews 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: ja
  text: 信仰によって、彼は約束の地で、そこがよその土地であるかのように寄留し[a]、同じ約束の共同相続人であるイサクとヤコブとともに天幕に住みました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰によって、彼は約束の地で、よその土地として寄留し」。
    reason: ὡς ἀλλοτρίαν は、約束の地を「よその土地」として扱うという意味にも簡潔に表せる。
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: 手段を示す与格として理解した。ヘブライ人への手紙11章で反復される表現に即し、明瞭で定着した訳語を用いた。
- source_word: παρῴκησεν
  choice: 寄留し
  rationale: 自分の故郷ではない場所に、よそ者として居住する意味を簡潔に表す。「滞在した」だけでは部外者としての社会的含意が弱いため、「寄留」を採用した。
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: 約束の地に
  rationale: εἰς は本来方向を表し得るが、居住を表す動詞とともに到達後の場所を指す。「約束の地」は日本語として自然で、神の約束との結びつきも保持する。
- source_word: ὡς ἀλλοτρίαν
  choice: よその土地にいる者のように
  rationale: ἀλλότριος の「他人に属する、よその」という意味と、ὡς の比較を保った。土地そのものを「外国」と限定せず、自分の所有地ではないという含みを伝える。
- source_word: ἐν σκηναῖς κατοικήσας
  choice: 天幕で暮らしました
  rationale: 分詞を主動詞に伴う生活様式として訳した。「天幕」は一時的な住まいという具体的イメージを保ち、「暮らす」は現代日本語として自然である。
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: イサクやヤコブとともに
  rationale: μετά＋属格の共同を自然な日本語で表した。「や」は二人を例示するのではなく並列する日本語用法として用い、「とともに」で共同性を明示した。
- source_word: τῶν συγκληρονόμων
  choice: 共に受け継ぐ
  rationale: 共同相続人という概念を、一般読者に分かりやすい動詞表現にした。約束への共同参与を保持している。
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: 同じ約束を
  rationale: アブラハム、イサク、ヤコブが同一の約束を共有したことを明確にし、αὐτῆς の同一性の強調を過度に膨らませずに表した。
theological_decisions:
- issue: 省略された主語の指示対象
  choice: 本文では「彼」とし、直前の8節からアブラハムを受ける
  alternative: 「アブラハム」と明示する
  rationale: ギリシア語本文には固有名がなく、先行文脈から主語が継続する。節単独での明瞭さよりも原文の結束を優先し、「彼」とした。
- issue: 約束と相続の関係
  choice: 「同じ約束を共に受け継ぐ」
  alternative: 「同じ約束の共同相続人である」
  rationale: συγκληρονόμων の相続概念を保持しつつ、専門的・教義的に響きやすい名詞表現を避け、自然な現代日本語にした。約束の成就時期や内容は本文以上に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「寄留」は日常語よりやや文語的だが、παροικέω の一時性と、よそ者として住む含意を一語で保持できるため採用した。「天幕」は聖書世界の具体性を保ちつつ一般にも理解可能である。
