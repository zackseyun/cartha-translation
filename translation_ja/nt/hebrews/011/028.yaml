id: HEB.11.28
reference: Hebrews 11:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: ja
  text: 信仰によって、彼は過越の祭りを行い、血を振りかけました[a]。これは、初子を滅ぼす者が彼らに触れないようにするためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「血を塗りました」「血を付けました」。ギリシャ語は儀礼として血を置くことを指します。「振りかける」は伝統的な祭儀表現ですが、過越の場面では、血を戸口に塗る、または付けることが念頭にあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: 手段・根拠を表す与格として訳し、ヘブライ人への手紙11章で繰り返される定型表現との統一も保った。
- source_word: πεποίηκεν
  choice: 行い
  rationale: ποιέωの完了形。ここではモーセが過越の規定を実行したことを指す。「守り」も可能だが、祭りの制定と実施の双方を過度に限定しない自然な表現として「行い」を選んだ。
- source_word: τὸ πάσχα
  choice: 過越の祭り
  rationale: 食事だけでなく過越の儀礼・行事全体を指し得るため、「過越の食事」と限定せず、現代日本語で意味が伝わる「過越の祭り」とした。
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: 血を振りかけました
  rationale: πρόσχυσιςは儀礼的に血を置く・注ぐ行為を指す。伝統的な祭儀表現「振りかける」を本文に採り、過越の場面に即した「塗る／付ける」の可能性を脚注に残した。
- source_word: ἵνα μὴ
  choice: それは、…ないためでした
  rationale: 目的を表すἵνα節の力を明確で自然な日本語にした。
- source_word: ὁ ὀλοθρεύων
  choice: 滅ぼす者
  rationale: 実体詞的分詞をそのまま表し、原文に明記されない「天使」を補わなかった。
- source_word: τὰ πρωτότοκα
  choice: 初子
  rationale: 人間に限らず「最初に生まれたもの」を指し得る中性複数を、出エジプト記との連関が明瞭な聖書用語「初子」で簡潔に表した。
- source_word: θίγῃ
  choice: 触れない
  rationale: 文脈上は致命的な害を意味するが、動詞の基本義「触れる」と出エジプト物語への暗示を保ち、「打つ」「害する」と解釈的に強めなかった。
- source_word: αὐτῶν
  choice: 彼らに
  rationale: 代名詞の簡潔さを保ち、原文にない「イスラエル人」を本文へ補わなかった。
theological_decisions:
- issue: πεποίηκενの省略された主語
  choice: 「彼」
  alternative: 「モーセ」
  rationale: 文脈上の主語はモーセだが、ギリシャ語本文は固有名を置いていないため、明示化せず代名詞を保った。
- issue: πίστιςの訳語
  choice: 「信仰」
  alternative: 「信頼」「忠実」
  rationale: ヘブライ人への手紙11章全体の主題と反復句により、ここでは「信仰」が最も適切である。
- issue: ὁ ὀλοθρεύωνの同定
  choice: 「滅ぼす者」
  alternative: 「滅ぼす天使」
  rationale: 出エジプトの出来事における存在の同定を本文以上に限定せず、原文の称号的表現を維持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「過越」「初子」は聖書的連関を保つため用い、文脈で理解できる形にした。長い一文を二文に分け、目的関係は「それは」で明示した。
