reference: Hebrews 11:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: ja
  text: これらの人々は皆、信仰を抱いたまま死にました。約束の数々を受け取ることはありませんでしたが、それらをはるか遠くから見て、歓迎し[a]、自分たちは地上でよそ者であり、一時的な滞在者[b]であると公言したのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「挨拶し」、または「抱きしめ」。原語は「挨拶する」「歓迎する」を意味し、ここでは遠くに見える約束に対して比喩的に用いられています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「寄留者」または「仮住まいの者」。原語は、その場所に完全に根を下ろした者としてではなく滞在している人を表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: 信仰のうちに
  rationale: κατά＋対格が表す、信仰に即した状態・姿勢を自然な日本語で示した。「信仰によって」も可能だが、ここでは死に至るまで保たれた信仰のあり方に重点がある。
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: 約束の数々を受け取ることはありませんでしたが
  rationale: ἐπαγγελίαςの複数形を「数々」で保持し、否定分詞を主動詞との関係が明瞭な節として訳した。
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: それをはるか遠くから見て
  rationale: 距離を表す比喩を保ちつつ、現代日本語として自然にした。「それ」は複数の約束を集合的に受ける。
- source_word: ἀσπασάμενοι
  choice: 喜んで迎え
  rationale: この動詞の「挨拶する・歓迎する」という語義を、約束を目的語とする比喩的用法に合わせて表した。単なる「受け入れ」より、遠くから約束を歓迎する像を保つ。
- source_word: ὁμολογήσαντες
  choice: 公言した
  rationale: 内面的に認めただけでなく、はっきり言い表したことを示す。
- source_word: ξένοι
  choice: よそ者
  rationale: 所属していない者という社会的意味を、一般読者に分かりやすい現代語で表した。
- source_word: παρεπίδημοί
  choice: 仮住まいの者
  rationale: 定住者として完全には属さず、一時的に滞在する者という意味を、古風な「寄留者」を避けて表した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上では
  rationale: 特定の土地よりも地上での生のあり方を指す文脈に合わせ、γῆを「地上」とした。
theological_decisions:
- issue: πίστιςを信仰・信頼・真実のどれで表すか
  choice: 信仰
  alternative: 信頼
  rationale: ここでは先祖たちが神の約束に寄せた持続的な信頼を指すが、文脈上の宗教的含意を過不足なく伝える標準的な「信仰」を用いた。
- issue: ἀσπασάμενοιの比喩をどう表すか
  choice: 喜んで迎え
  alternative: 挨拶し／抱きしめ
  rationale: 約束を実際に受領したという意味にはせず、遠くに見える約束を歓迎したという比喩を保持した。「抱きしめ」は親密さを強めすぎる可能性がある。
- issue: παρεπίδημοίが亡命を意味するか、一時滞在を意味するか
  choice: 仮住まいの者
  alternative: 追放された者／寄留者
  rationale: 原語自体は強制的な追放を必ずしも含まないため、「追放された者」とはせず、定住地に完全には属さない状態を表した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。分詞の連続は日本語の節に組み替えつつ、「見て、迎え、公言した」という展開を保持した。「寄留者」のような教会語・古語は本文で避け、脚注に残した。
