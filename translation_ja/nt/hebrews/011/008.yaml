reference: Hebrews 11:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: ja
  text: 信仰によって、アブラハムは召されたとき、やがて相続財産として受けることになる場所へ出て行くように従い、どこへ行くのかを知らないまま出て行きました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: 信仰によって
  rationale: 手段・根拠を表す与格として、アブラハムが神の召しに応答した信仰を自然かつ明確に示す。
- source_word: καλούμενος
  choice: 召されたとき
  rationale: 現在受動分詞の時間的・状況的な働きを、順序を過度に限定せず自然な日本語で表す。
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: 出て行くようにとの命令に従いました
  rationale: ὑπακούωの服従と補語的不定詞ἐξελθεῖνの内容を明示する。日本語では単に「出て行くことに従った」より自然であり、召しに命令の含意があることも文脈に適う。
- source_word: τόπον
  choice: 場所
  rationale: 目的地がまだ特定されていない文脈を保ち、日本語では冠詞に相当する語を加えず表す。
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: やがて相続財産として受けることになる
  rationale: μέλλωの未来的意味を「ことになる」で表し、「定められていた」など予定・宿命の意味を過度に加えない。κληρονομίαは土地について用いられているため「相続財産」とした。
- source_word: ἐξῆλθεν
  choice: 出て行きました
  rationale: 先のἐξελθεῖνとの語の反復を保ち、実際の行動を示す。
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: 行き先を知らないまま
  rationale: 否定分詞の付帯状況と、ποῦ ἔρχεταιが示す目的地の不明を簡潔で自然な日本語にする。
theological_decisions:
- issue: πίστιςの訳語
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: この文脈は、神の召しに応じて未知の地へ出たアブラハムの信頼を伴う信仰に焦点を置く。「忠実さ」だけに限定せず、ヘブライ人への手紙11章の反復語として「信仰」を保つ。
- issue: μέλλωの未来性
  choice: やがて…受けることになる
  alternative: 受けるよう定められていた
  rationale: 将来の受領を表しつつ、本文が明示しない予定論的な含意を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬体で格調を保った。「出て行く」を二度用いて原文のἐξελθεῖν／ἐξῆλθενの反復を再現した。注記を要する本文異読や不可避の訳語上の曖昧さはないため、脚注は付していない。
