id: HEB.11.11
reference: Hebrews 11:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: ja
  text: 信仰によって、サラ自身も子を宿す力を授かりました[a]。すでに年齢を過ぎていたにもかかわらず、約束してくださった方を信頼できる方と考えたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には、「種（子孫）を設けるための力を受けた」。ギリシア語では珍しい慣用的な表現で、ここでは子をもうける力を指します。
    reason: 原文の特異な表現を示し、本文で文脈に即した自然な訳を採ったことを明らかにするため。
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: 手段を表す与格であり、ヘブライ人への手紙11章に繰り返される定型句として、簡潔に「信仰によって」とした。
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: サラ自身も
  rationale: καίの追加・強調の働きと、強意的なαὐτῇを自然な日本語で表し、サラがこの節の主体であることを明確にした。
- source_word: δύναμιν ... ἔλαβεν
  choice: 力を授かりました
  rationale: 直訳的な「力を受けた」より自然でありながら、力が与えられたという原文の意味を保つ。
- source_word: εἰς καταβολὴν σπέρματος
  choice: 子を宿す
  rationale: 原文は直訳しにくい特異な表現である。サラを文法上の主体とする文脈に即して、生殖能力を指す自然な日本語とし、字義的表現は脚注に残した。
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: 年齢的にすでにその時期を過ぎていたにもかかわらず
  rationale: παράと対格が示す通常の限界を越えたこと、καιρόςが示す適切な時期、ἡλικίαが示す年齢・人生段階を、過度に説明的にならない現代日本語で表した。
- source_word: ἐπεὶ
  choice: からです
  rationale: サラが力を授かった理由を導く因果関係を明瞭に示す。
- source_word: πιστὸν
  choice: 真実な方
  rationale: 約束を確実に守る神の信頼性・忠実さを表す。「信頼できる方」も可能だが、「真実な方」は神学的な重みと格調を保つ。
- source_word: ἡγήσατο
  choice: 認めた
  rationale: 評価してそのように見なしたという認識上の判断を、簡潔で自然な日本語にした。
- source_word: τὸν ἐπαγγειλάμενον
  choice: 約束してくださった方
  rationale: 神を指す実詞的分詞を敬意ある自然な日本語で表した。「くださった」は日本語としての敬意を示すが、原文にない追加の行為内容は導入しない。
theological_decisions:
- issue: 構文上難しい句における主体と、サラが受けた力の意味
  choice: サラを主体とし、「子を宿す力を授かった」と訳す。
  alternative: アブラハムの関与を前面に出して「種を置く力」と解する、または「子孫の系統を打ち立てる力」と解する。
  rationale: この本文形ではαὐτῇ Σάρρᾳがἔλαβενの主体を示すと理解するのが最も自然である。ただし、καταβολὴ σπέρματοςは字義的には男性側を連想させ得る特異な句なので、その曖昧さは脚注で示した。
- issue: 神について用いられるπιστόςの訳
  choice: 真実な方
  alternative: 信頼できる方／忠実な方
  rationale: 約束された方が確かに約束を守るという信頼性を表しつつ、本文の神学的な響きを保つため。「忠実な方」も可能だが、現代日本語では何に対して忠実なのかが曖昧になりやすい。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「サラ自身も」で原文の追加的・強調的な調子を表し、「年齢的にすでにその時期を過ぎていた」で露骨または過度に説明的な表現を避けた。
