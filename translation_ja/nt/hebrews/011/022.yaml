source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: ja
  text: 信仰によって、ヨセフは死に臨んで、イスラエルの子らがエジプトを出ること[a]に言及し、自分の骨について指示を与えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの子らの出て行くこと」。ここでは、彼らが将来エジプトを出ることを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: ヘブライ人への手紙11章で繰り返される定型表現として、手段・根拠を示す与格を自然に表し、章全体との一貫性を保つ。
- source_word: τελευτῶν
  choice: 死を迎えようとしていたとき
  rationale: 「死につつある／生涯の終わりにある」という同時的な分詞の意味を、直接的すぎず自然な現代日本語で表す。
- source_word: περὶ τῆς ἐξόδου
  choice: エジプトを出ること
  rationale: ἔξοδοςの基本義である「出て行くこと」を表しつつ、文脈上のエジプト脱出を明示する。ギリシア語本文にエジプトの語はないため、より字義的な形を脚注に残す。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: イスラエルの子ら
  rationale: υἱῶνの家族的表現を保持し、「イスラエル人」と平板化しない。
- source_word: ἐμνημόνευσεν
  choice: 言及し
  rationale: περίを伴うため、内面的に「思い出した」ではなく「触れた／語った」の意味である。簡潔で品位ある表現を選ぶ。
- source_word: ἐνετείλατο
  choice: 指示を与えました
  rationale: 命令・指示を与える意味を明確にしつつ、現代日本語で過度に強圧的に響かない形とする。
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: 自分の骨について
  rationale: 「遺骸」と一般化せず、創世記50章25節への具体的な言及である「骨」を保持する。
theological_decisions:
- issue: ヘブライ人への手紙11章における πίστις の訳
  choice: 信仰
  alternative: 忠実さ／信頼
  rationale: 本節は章全体の「信仰によって」という反復句の一部であり、ヨセフが信仰に基づいて行動したことを示す。「忠実さ」より「信仰」が文脈に適合する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体と、原文の家族的表現「イスラエルの子ら」および具体語「骨」を保持した。脚注記号[a]は本文中の該当箇所に配置した。
