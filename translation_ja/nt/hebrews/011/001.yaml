id: HEB.11.1
reference: Hebrews 11:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: ja
  text: 信仰とは、望んでいる事柄についての確信[a]であり、目に見えない事柄についての確証[b]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「望んでいる事柄の実体」または「現実」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「証拠」または「確信」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: 信仰
  rationale: この文脈では、神の約束に信頼を置く姿勢を指す。日本語の聖書語として定着し、章全体の主題にも適する「信仰」とした。
- source_word: ἐλπιζομένων
  choice: 望んでいる事柄
  rationale: 現在受動分詞の名詞的用法を、希望の対象を表す自然な日本語で訳した。
- source_word: ὑπόστασις
  choice: 確信
  rationale: 「実体・現実・確信」という意味領域のうち、この勧告的文脈では、望む事柄に対する揺るがない確かさを自然に伝える「確信」を本文に採用した。存在論的な意味に限定せず、別訳を脚注に残した。
- source_word: πραγμάτων
  choice: 事柄
  rationale: 物体に限定されない広い語なので、「もの」よりも抽象的な現実を含めやすい「事柄」とした。
- source_word: ἔλεγχος
  choice: 確証
  rationale: 証拠・立証と、それによって生じる確信の双方に開かれた語であるため、客観的根拠の響きを保ちながら自然な「確証」とした。別の可能性は脚注に示した。
- source_word: οὐ βλεπομένων
  choice: 目に見えない事柄
  rationale: 現在受動分詞と否定を率直に訳し、現時点で視覚によって捉えられないものという含みを保った。
- source_word: δὲ
  choice: 無訳
  rationale: ここでは強い逆接ではなく穏やかな展開を示す。日本語では「信仰とは」という主題提示だけで自然に移行できるため、独立した接続語を置かなかった。
theological_decisions:
- issue: ヘブライ11章1節におけるὑπόστασιςの意味
  choice: 本文では「確信」
  alternative: 「実体」または「現実」
  rationale: 章全体は信仰によって行動した人々を描くため、「確信」が文脈に自然である。ただし、この語が希望される事柄の客観的な実在・現実を指す可能性を排除せず、脚注に保持した。
- issue: ἔλεγχοςの客観的意味と主観的意味
  choice: 本文では「確証」
  alternative: 「証拠」または「確信」
  rationale: この語は立証する証拠と、それによってもたらされる内的確信のどちらにも解し得る。「確証」は両面をある程度保ち、脚注で幅を明示した。
- issue: πίστιςの訳語
  choice: 「信仰」
  alternative: 「信頼」
  rationale: ここでは「忠実さ」よりも、神とその約束に寄せる信頼が中心である。「信仰」は日本語でその宗教的・関係的意味を自然に担い、章全体との連続性も保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、定義文にふさわしい簡潔で格調ある調子を保った。「についての」を補って、不自然な名詞連結や、信仰そのものが希望対象を存在させるという一義的な読みを避けた。
