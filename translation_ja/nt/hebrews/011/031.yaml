id: HEB.11.31
reference: Hebrews 11:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: ja
  text: 信仰によって、娼婦ラハブは、従わなかった者たちと共に滅びることはありませんでした。[a] 彼女が斥候たちを平和のうちに迎え入れたからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不従順だった者たちと共に滅びることはありませんでした」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「斥候たちを穏やかに受け入れたからです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: 手段・根拠を表す与格として、ヘブライ人への手紙11章の反復表現を明確かつ自然に訳した。
- source_word: Ῥαὰβ ἡ πόρνη
  choice: 遊女ラハブ
  rationale: 固有名は慣用表記「ラハブ」とし、πόρνηは婉曲化せず、現代日本語の聖書文体で明確な「遊女」とした。
- source_word: οὐ συναπώλετο
  choice: 共に滅びることはありませんでした
  rationale: 複合動詞に含まれる「ほかの者たちと一緒に滅びる」という意味を明示した。
- source_word: τοῖς ἀπειθήσασιν
  choice: 従わなかった者たち
  rationale: ἀπειθέωの不服従という意志的・道徳的含意を保ち、「信じなかった者たち」と限定的に解釈することを避けた。
- source_word: δεξαμένη
  choice: 迎え入れた
  rationale: 人を受け入れて保護した文脈に自然であり、単なる受領を意味する表現を避けた。分詞の関係は文脈上の理由として訳した。
- source_word: τοὺς κατασκόπους
  choice: 斥候たち
  rationale: 偵察のために遣わされた者を指す語として自然で、ヨシュア記の文脈にも合う。
- source_word: μετ’ εἰρήνης
  choice: 平和のうちに
  rationale: 原文の「平和」を保ちつつ、敵意なく受け入れた態度を表す聖書的な言い回しとした。
theological_decisions:
- issue: ヘブライ人への手紙11章の定型句における πίστις
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: πίστειと人物名による模範列挙では「信仰によって」が最も自然で、章全体の反復も保てる。
- issue: ἀπειθήσασιν の意味
  choice: 従わなかった者たち
  alternative: 信じなかった者たち
  rationale: この語には不信と不服従の両面があり得るが、ここでは原語の行為的な含意を保つため「従わなかった」とした。神学的に不信だけへ狭めない。
- issue: δεξαμένη の分詞関係
  choice: 理由として「からです」
  alternative: 「迎え入れて」と状況を並置する
  rationale: ラハブが滅びなかったことと行為との関連を自然に示す。ただし、その行為を信仰から切り離された功績として説明する語は加えていない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「遊女」は語義を婉曲化せず、「平和のうちに」は原文の表現を見える形で残している。
