id: HEB.11.23
reference: Hebrews 11:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: ja
  text: 信仰によって、モーセは生まれてから三か月の間、両親に隠されました。両親は、その子が美しい[a]のを見、王の命令を恐れなかったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立派な」「並外れた」とも訳せる。ギリシア語ἀστεῖον。出エジプト記2章2節、使徒の働き7章20節参照。
    reason: ἀστεῖονの語義には、外見の美しさだけでなく、立派さや際立った良さという含みもあり得るため。
lexical_decisions:
- source_word: Πίστει
  choice: 信仰によって
  rationale: 手段・根拠を表す与格として、ヘブライ人への手紙11章で繰り返される表現を明確かつ一貫して示す。
- source_word: γεννηθεὶς
  choice: 生まれてから
  rationale: アオリスト受動分詞の時間的関係を、現代日本語として自然に表す。
- source_word: ἐκρύβη τρίμηνον
  choice: 三か月の間、…隠されました
  rationale: 受動態と期間を保ち、モーセが両親によって隠されたことを明示する。
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: 両親に
  rationale: πατέρωνは字義的には「父たち」だが、この文脈では父母を合わせた親を指すため、「両親」が最も明瞭で自然である。
- source_word: ἀστεῖον
  choice: 美しい
  rationale: 容姿が美しい、愛らしい、または際立って立派であるという語義の幅を持つ。「美しい」は出エジプト記2章2節との響きを保ちながら、過度な解釈を加えない。別訳は脚注に示す。
- source_word: τὸ παιδίον
  choice: その子
  rationale: 指示性を保ちつつ、幼いモーセを指す自然で格調ある表現とした。
- source_word: οὐκ ἐφοβήθησαν
  choice: 恐れなかった
  rationale: 信仰と恐れの対照を簡潔に保つ。
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: 王の命令
  rationale: 王が出した公的な布告・命令を指す。現代の一般読者に明瞭な「命令」を採用した。
theological_decisions:
- issue: モーセを隠した両親の動機
  choice: 両親が子を美しいと認めたことと、王の命令を恐れなかったことの双方を、冒頭の「信仰によって」のもとに置く。
  alternative: 子の美しさだけが動機だったとする、またはその容姿を特別な神的しるしと明示する。
  rationale: 本文は、子がἀστεῖονであるのを見たことと、王の命令を恐れなかったことを並べている。外見に奇跡的なしるしがあったとは明言しないため、その神学的緊張と含みをそのまま残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、礼拝朗読にも適する落ち着いた文体とした。受動態を保って原文の焦点を維持しつつ、二文に分けて理由関係を読み取りやすくした。
