  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: ja
  text: この世は彼らに値するものではなかった。彼らは荒野[a]や山々、洞窟、地面の穴をさまよい歩いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「荒れ果てた場所」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: この人たちに
  rationale: 直前に列挙された信仰のゆえに苦しんだ人々を受ける関係代名詞属格。日本語では「この人たちに、この世はふさわしくなかった」として、評価を表す構文を自然に保った。
- source_word: ἄξιος
  choice: ふさわしくなかった
  rationale: 価値に釣り合う、値するという評価語。ここでは世界の側が彼らに値しなかったという強い逆説的評価を表す。
- source_word: κόσμος
  choice: この世
  rationale: 彼らを退けた人間社会を含む広い世界を指す。聖書日本語として自然でありつつ、単なる物理的地球に限定しない。
- source_word: ἐπὶ ἐρημίαις
  choice: 荒野で
  rationale: ἐπί＋与格はこの文脈では場所を示す。ἐρημίαの荒涼とした無人の地という具体像を「荒野」で表した。
- source_word: πλανώμενοι
  choice: さまよった
  rationale: 定住できず、追われるように各地を歩き回る状態を表す分詞。現代日本語で明瞭な「さまよう」を用いた。
- source_word: ὄρεσι
  choice: 山々
  rationale: 複数形を反映し、高地を表す一般的で自然な語を選んだ。
- source_word: σπηλαίοις
  choice: 洞窟
  rationale: 隠れ場所となる自然の洞穴を指す標準的な訳語。
- source_word: ὀπαῖς τῆς γῆς
  choice: 地の穴
  rationale: ὀπήは穴、開口部、裂け目を表し、τῆς γῆςはそれが地中・地面にあることを示す。原文の簡潔で具体的な像を保った。
theological_decisions:
- issue: 「この世はふさわしくなかった」の指示対象と評価的な力
  choice: 忠実な苦難者たちの価値と、彼らを拒絶したこの世との対比を示す強い道徳的評価として訳した。
  alternative: 信仰者と世界との単なる不適合を述べる中立的表現。
  rationale: 原文はἄξιοςによって明確な価値判断を行っているため、その逆説と緊張を弱めず、同時に本文を越えた教理的説明は加えなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「この人たちに、この世はふさわしくなかった」で原文の逆説的評価を自然に表し、後半は列挙の簡潔さと逃亡生活の厳しさを保った。
