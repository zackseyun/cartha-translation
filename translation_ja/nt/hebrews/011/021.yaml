id: HEB.11.21
reference: Hebrews 11:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: ja
  text: 信仰によって、ヤコブは死を迎えようとしていたとき、ヨセフの息子たちを一人一人祝福し、杖の先に寄りかかって礼拝した。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 創世記47章31節のヘブライ語本文に沿えば、「寝台の枕元で身をかがめて礼拝した」とも訳せる。ここヘブライ人への手紙のギリシア語本文は「杖」となっている。
    reason: textual_variant
  - marker: b
    text: または「杖の先に向かって礼拝した」。この句は、礼拝の対象ではなく、ヤコブの姿勢を述べている可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: ヘブライ人への手紙11章の反復表現として、行為が信仰に基づくことを示す具格・様態の与格を自然に表す。
- source_word: ἀποθνῄσκων
  choice: 死を迎えようとしていたとき
  rationale: 主動詞と同時進行する現在分詞の時間的意味を表し、死期が迫った状況を現代日本語で自然に伝える。
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: ヨセフの息子たちを一人一人
  rationale: ἕκαστονと部分属格が示す個別性、すなわち二人それぞれへの祝福を明確にする。
- source_word: εὐλόγησεν
  choice: 祝福し
  rationale: 創世記の背景と契約的な重みを保つ、標準的で明瞭な訳語。
- source_word: προσεκύνησεν
  choice: 礼拝した
  rationale: 単なる身体的なお辞儀に限定せず、この文脈における神への宗教的崇敬を表す。
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: 杖の先に寄りかかって
  rationale: ギリシア語本文の「杖」を保持しつつ、この句をヤコブの姿勢として自然に表し、杖が礼拝の対象だったとの誤解を避ける。
theological_decisions:
- issue: 末尾の句におけるヤコブの礼拝と杖との関係
  choice: ヤコブは杖の先に寄りかかって神を礼拝した。
  alternative: 「杖の先に向かって礼拝した」、または創世記47章31節のヘブライ語本文に沿って「寝台の枕元で身をかがめて礼拝した」。
  rationale: ヘブライ人への手紙のギリシア語本文は「杖」と読むため本文ではこれを優先する。ただしἐπίを含む句の係り方には幅があり、また創世記のヘブライ語本文は「寝台」と理解されるので、その本文間の緊張と統語上の可能性を脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「死にかけていたとき」より尊厳ある「死を迎えようとしていたとき」を用い、「各々」ではなく「一人一人」で分配的意味を平易に示した。脚注記号は該当する末尾句の直後に配置した。
