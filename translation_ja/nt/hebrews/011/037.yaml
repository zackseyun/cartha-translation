  naturalness: 「二つに引かれ」は日本語としても意味が取りにくい。「二つに切られ」「必要なものに乏しく」は明瞭な現代標準日本語であり、列挙の調子を保つ。原文にない「また」は削除した。
  terminology: 「石打ち」「羊の皮」「山羊の皮」は適切。「殺戮」はこの一人称複数の受難列挙ではやや大仰かつ不自然なので、「殺害」に改めた。φόνοςの暴力的殺害という含みは本文と注で保持する。
