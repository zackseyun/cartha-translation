id: HEB.11.37
reference: Hebrews 11:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: ja
  text: 石打ちにされ、のこぎりで二つに切られ、剣による殺害で命を落としました[a]。羊の皮や山羊の皮をまとってさまよい歩き、必要なものに乏しく、苦しめられ、虐待されました――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「剣で死にました」。ギリシャ語はφόνος（殺害、殺戮）を含み、単に「剣で」よりも暴力的な殺害を強調しています。
    reason: 語義上の別訳を示すとともに、本文がφόνοςの暴力的な含みを保持していることを明示するため。
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: 石打ちにされ
  rationale: λιθάζωのアオリスト受動形を簡潔に表す。「石打ちで殺され」とすると、原文がこの動詞自体には明示していない死を補うため避けた。
- source_word: ἐπρίσθησαν
  choice: のこぎりで二つに引かれ
  rationale: πρίζωの受動形であり、殉教者の苦難を列挙する文脈に即して、身体をのこぎりで二つに切る意味を明確にした。
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: 剣による殺戮で死にました
  rationale: ἀπέθανονの「死んだ」を保ちつつ、φόνοςが持つ暴力的な殺害・殺戮の重みを、単なる「剣で」へ平板化せずに表した。
- source_word: περιῆλθον
  choice: さまよい歩き
  rationale: 各地を移り歩く意味を自然な現代日本語で表し、安住の場を持たない文脈上の含みも伝える。
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: 羊の皮や山羊の皮をまとって
  rationale: いずれも皮を衣服として身に着けていたことを、日本語として明瞭に表した。並列の二つの前置詞句は「や」で自然につないだ。
- source_word: ὑστερούμενοι
  choice: 乏しく
  rationale: 生活に必要なものを欠いている状態を表す。文脈上の深刻さを保ちながら、過度な具体化を避けた。
- source_word: θλιβόμενοι
  choice: 苦しめられ
  rationale: 受動分詞が表す圧迫・苦難を、広い意味を保つ自然な表現にした。
- source_word: κακουχούμενοι
  choice: 虐待されました
  rationale: ひどい扱いを受けるという語義と受動性を明確にし、現代の読者に直截に伝わる表現とした。
theological_decisions:
- issue: ἐν φόνῳ μαχαίρης における暴力的殺害の強さ
  choice: 本文で「剣による殺戮で死にました」とし、φόνοςの強い意味を残す。
  alternative: 「剣で死にました」
  rationale: この句は教理上の対立点ではないが、φόνοςを省けば原文の暴力性が弱まる。「殺戮」はやや硬いものの、原文の意味を保持し、より簡潔な訳は注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、殉教者の苦難を列挙する荘重さを保った。節末のダッシュは文が次節へ続くことを示す。
