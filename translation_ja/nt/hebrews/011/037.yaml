    rationale: ἐπρίσθησανは「のこぎりで切られた／二つに切られた」を意味する。「引かれ」は切断を意味せず、原文の行為を正確に伝えない。
  - severity: medium
    issue: 「剣による殺戮で死にました」
    rationale: φόνοςの強さを保持しようとする意図は妥当だが、日本語では「殺戮で死ぬ」が不自然である。「剣による殺害で命を落としました」により、殺害と死の両方を自然に表せる。
