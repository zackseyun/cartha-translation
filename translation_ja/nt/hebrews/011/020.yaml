  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: ja
  text: 信仰によって、イサクは将来のことについてもヤコブとエサウを祝福しました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: 信仰によって
  rationale: 手段・根拠を表す与格を自然かつ明確に表し、章全体の反復表現とも一致させた。
- source_word: καὶ περὶ μελλόντων
  choice: やがて起こることについても
  rationale: καίの追加・強調を「も」で示し、μέλλωの未来的意味を「やがて起こること」と自然な現代日本語で表した。内容を特定せず、原文の包括性を保った。
- source_word: εὐλόγησεν
  choice: 祝福しました
  rationale: 神の好意と将来に関する祝福を告げる行為を表す標準的な聖書語であり、文脈に適する。
- source_word: τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ
  choice: ヤコブとエサウを
  rationale: 二人を並列の直接目的語として原文どおりに表した。
theological_decisions:
- issue: イサクの祝福と将来の事柄との関係
  choice: 「やがて起こることについても」を祝福の内容・関係領域として訳す
  alternative: 「将来のことを見越して」または具体的な預言内容を補う
  rationale: περίは「〜について」を意味し、原文は祝福の具体的内容やイサクの認識の程度を明示しないため、その曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「〜についても」により、本文異読として示されたκαίの追加的・強調的な働きを簡潔に反映した。
