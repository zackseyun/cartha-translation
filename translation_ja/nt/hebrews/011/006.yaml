source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: ja
  text: 信仰[a]がなければ、神に喜ばれることはできません。神に近づく者は、神がおられること[b]、また、神を熱心に求める者に報いてくださる方であること[c]を、信じなければならないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼」とも訳せます。πίστιςは文脈によって「忠実さ」を表すこともありますが、ここでは直後に神を「信じる」ことが説明されています。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「神があること」。ここでは神の実在を意味します。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は字義的には「報いてくださる方となる」です。ここでは、神を求める者にとって、神が報いてくださる方であることが明らかになる、という意味に理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: 信仰がなければ
  rationale: χωρίςの欠如・分離を自然な条件表現で示した。δέは前節との緩やかな接続であり、日本語では明示しないほうが流れが自然である。πίστιςは直後のπιστεῦσαιによって「信じること」と説明されているため、「信仰」とした。
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: 神に喜ばれることはできません
  rationale: 非人称的な「不可能である」という構文を明快な現代日本語にし、文脈上の対象である神を補った。「神を喜ばせる」よりも「神に喜ばれる」が、神に受け入れられ喜ばれるという関係を自然に表す。
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: 神に近づく者
  rationale: προσέρχομαιの接近する動きを保ち、礼拝や祈りを含み得る表現として、限定しすぎない「近づく」を用いた。
- source_word: ὅτι ἔστιν
  choice: 神がおられること
  rationale: 神の実在を表す簡潔なギリシア語を、日本語で人格的かつ自然に表現した。「存在する」も可能だが、ここでは抽象的に響きすぎる。
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: 神を熱心に求める者
  rationale: ἐκζητέωの強意を「熱心に」で表し、継続的・真剣な探求を示した。
- source_word: μισθαποδότης γίνεται
  choice: 報いてくださる方である
  rationale: μισθαποδότηςを単なる賃金の支払者ではなく、文脈に合う「報いてくださる方」とした。γίνεταιは字義的には「なる」だが、ここでは求める者に対して神がそのような方であると現れることを述べるため、自然な本文では「である」とし、語形上の含みは脚注に残した。
theological_decisions:
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼、真実さ
  rationale: この節ではπιστεῦσαι（信じる）が直後に説明として置かれており、人が神を信じ信頼することが中心である。「信仰」は定着した語であり、特定教派の定義を付加しない。
- issue: ὅτι ἔστινが表す内容
  choice: 神がおられること
  alternative: 神が存在すること、神が『ある』こと
  rationale: 神の実在を肯定する意味を明確にしつつ、ギリシア語の簡潔さと人格的な文脈を保った。
- issue: γίνεταιと神の性質との関係
  choice: 報いてくださる方である
  alternative: 報いてくださる方となられる、報いてくださる方であることを示される
  rationale: 「なられる」を本文に置くと神の性質が変化するとの不要な含意を生じやすい。一方、単純なコピュラに平板化しすぎないよう、原語の「なる／そのような方として現れる」という含みを脚注で示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、礼拝での朗読にも耐える落ち着いた文体とした。「くださる」により神の行為を自然に表すが、過剰な敬語は避けた。二つのὅτι節を「こと、また……こと」と並列し、信じるべき二内容を明瞭にした。
