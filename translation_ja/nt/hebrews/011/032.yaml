source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: ja
  text: このうえ、何を言いましょうか。というのも、ギデオン、バラク、サムソン、エフタ、ダビデ、さらにサムエルと預言者たちについて語るなら、時間が足りなくなるでしょう[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「というのも、……について語り続ければ、時間が私には足りなくなるからです」。
    reason: 未来形と現在分詞の構文、および「私に」という原文の語順・強調をより逐語的に反映した訳を示すため。
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: このうえ、何を言いましょう。
  rationale: τί ἔτι λέγω は、さらに例を挙げる前の修辞疑問である。「このうえ、何を言いましょう」は、その前向きな展開と簡潔な打ち切りの響きを自然な現代日本語で保つ。
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: 時間が足りなくなるでしょう
  rationale: ἐπιλείψει は未来形だが、ここでは長く列挙するなら時間が不足するという修辞的・仮定的な趣旨。日本語では「時間が足りなくなるでしょう」が自然で、著者が現実に一切の時間を失うとの意味に限定しない。γάρの説明関係は、前文に続く文全体の流れで示した。
- source_word: διηγούμενον
  choice: 語っていたら
  rationale: 現在分詞は、語り続ける状況の中で時間が足りなくなることを表す。「語っていたら」により、継続性と仮定的な含みをともに保つ。
- source_word: περὶ
  choice: について
  rationale: 属格を伴い、語る対象・主題を導入する。現代日本語として最も自然な「について」とした。
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: ギデオン、バラク、サムソン、エフタ、ダビデ、サムエル
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: τε καὶ
  choice: さらに
  rationale: ダビデに続いてサムエルを加える連結のニュアンスを、過度に強調せず「さらに」で表した。
- source_word: τῶν προφητῶν
  choice: 預言者たち
  rationale: 複数の預言者を一つの集団として指すため、明瞭な現代日本語の複数表現とした。
theological_decisions:
- issue: 時間が足りなくなるという句の修辞的性格
  choice: 長く語り続けるなら時間が不足する、という修辞的・仮定的な言い方として訳す。
  alternative: 「語っている私には時間が尽きるからです」と未来形をより逐語的に訳す。
  rationale: ギリシャ語の未来直説法を消去せず「でしょう」で残しつつ、文脈上の誇張的な省略表現を自然に伝える。特定の神学的結論は加えない。
- issue: ダビデ、サムエル、預言者たちの結び付き
  choice: 「ダビデ、さらにサムエルと預言者たち」として、加算的な連結を示す。
  alternative: 「ダビデとサムエルと預言者たち」と並列する。
  rationale: τε καὶ のわずかな加算的ニュアンスを示しながら、サムエルと預言者たちの関係を神学的に断定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。修辞疑問には「何を言いましょう」を用い、列挙は定着した日本語人名で読みやすくした。原文の未来形と継続的な分詞構文が持つ緊張を、本文と脚注の組み合わせで保持した。
