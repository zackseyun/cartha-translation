source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: ja
  text: もし彼らが、自分たちが出ていったあの故郷[a]のことを思い続けていたなら、帰る機会があったでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「国」「故国」。ギリシア語は、彼らが後にした地上の場所を指す。
    reason: 「故郷」に当たる語は、文脈により「国」「故国」とも訳せるため。
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: 思い続けていた
  rationale: 現在形が反事実条件の中で継続的な意識を表すため、「思い続けていた」として、単なる一度の想起や郷愁に限定しない。
- source_word: ἐκείνης
  choice: あの故郷
  rationale: 女性形の指示語は14節のπατρίςを受ける。「故郷」は政治的な国家よりも、生まれ育った土地・帰属する地を自然に表す。
- source_word: ἀφ’ ἧς ἐξέβησαν
  choice: 出て来た
  rationale: 起点から外へ出たというἐκβαίνωの空間的な含みを保ちつつ、自然な日本語にした。
- source_word: εἶχον ἂν
  choice: あったでしょう
  rationale: 未完了過去とἄνによる反事実条件の帰結を、日本語の自然な仮定表現で示す。
- source_word: καιρὸν
  choice: 機会
  rationale: 単なる時間ではなく、実際に帰ることのできる好機・可能な機会を指す。
- source_word: ἀνακάμψαι
  choice: 帰る
  rationale: 元の場所へ戻る意味を簡潔に表す。文脈上、故郷への帰還であることが明らかなため、「引き返す」より自然である。
- source_word: καὶ εἰ μὲν
  choice: もし
  rationale: 条件を自然に導入する。καίとμένの談話上の働きは、日本語では明示せずとも文脈の連続と対比で伝わる。
theological_decisions:
- issue: 思い続けていた場所の性質
  choice: 彼らが実際に出て来た地上の故郷
  alternative: 以前の生き方一般を象徴する比喩的な場所
  rationale: 11章13〜16節では地上の故郷と、彼らが求めるより良い天の故郷が対照される。本文では具体的な場所を示す表現を保ち、比喩に限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。「思い続けていたのなら」により反事実条件と継続的な想起を表し、「あの故郷」は直前の文脈とのつながりを保つ。
