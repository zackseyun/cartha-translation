  naturalness: 「この人に対して」はやや硬く、不自然に響きます。「この人に、『……』と言われていた」とすれば、前節から続く説明として自然です。「イサクを通して」は現代日本語として明瞭であり、系統がイサクを通じて定められる含意を保てます。
  terminology: 「イサク」「子孫」「呼ばれる」は適切です。「子孫と呼ばれることになる」により、καλέω の受動表現と未来の含みを保ちます。脚注は直訳を不自然な「あなたに子孫が呼ばれる」とせず、σοι の所有・帰属の用法を「あなたの子孫」として示すべきです。
