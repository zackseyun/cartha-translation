  text: πρὸς ὃν ἐλαλήθη ὅτι Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/018.yaml
  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: ja
  text: この人に、「イサクを通して、あなたの子孫が呼ばれることになる」と言われていたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イサクにおいて、あなたの子孫が呼ばれることになる」。
    reason: ἐν Ἰσαὰκ の字義に近い表現と、κληθήσεται の未来受動形を示すため。
lexical_decisions:
- source_word: πρὸς ὃν
  choice: この人に対して
  rationale: 関係代名詞の先行詞であるアブラハムを受け、彼に向けて語られたことを自然な日本語で示す。
- source_word: ἐλαλήθη
  choice: 言われていました
  rationale: アオリスト受動形の受動表現を保ちつつ、この節が前節に続く従属的な説明であることに合う日本語とした。
- source_word: ὅτι
  choice: 引用符で表現
  rationale: 発言内容を導く接続詞であり、日本語では直接引用の鉤括弧によって自然に示せる。
- source_word: Ἐν Ἰσαὰκ
  choice: イサクから出る者が
  rationale: ここでのἐνは約束の子孫がイサクの系統に定められることを表す。字義的な「イサクにおいて」より明瞭で、引用元の意味を過度に広げない。
- source_word: κληθήσεταί
  choice: 呼ばれる
  rationale: καλέωの未来受動形を保ち、子孫として呼ばれ、認められるという含みを残す。
- source_word: σοι σπέρμα
  choice: あなたの子孫
  rationale: σπέρμαの集合的単数を、現代日本語で自然かつ明瞭な「子孫」とした。σοιは文脈上の帰属を「あなたの」で表した。
theological_decisions:
- issue: アブラハムに約束された子孫とイサクとの関係
  choice: 「イサクから出る者が、あなたの子孫と呼ばれる」
  alternative: 「イサクにおいて、あなたの子孫が呼ばれる」
  rationale: 約束の系統がイサクを通して続くという意味を明確にしながら、「呼ばれる」という原文の表現を残し、ここで「子孫」が単数の特定個人だけを指すか集合的な子孫を指すかを訳文で断定しない。
translation_notes:
  register: 明瞭な現代標準日本語。聖書引用としての品位を保ちつつ、「イサクにあって」のような現代では分かりにくい定型表現を避けた。前節から続く文であるため、冒頭を「この人に対して」とした。
