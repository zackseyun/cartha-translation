- from: こうして、この人たちは皆、信仰によって良い証しを受けながらも[a]、約束のものを受け取りませんでした[b]。
  to: これらの人々は皆、信仰によって証しを受けましたが[a]、約束のものを受け取りませんでした[b]。
  rationale: 単純な接続を過度に推論的にしないよう「こうして」を改め、μαρτυρηθέντεςの受動的な語義を「証しを受けました」で簡潔に保持しました。「約束のもの」は、原文が特定しない約束の内容を限定せず、日本語としても「受け取る」の目的語を明瞭にします。
