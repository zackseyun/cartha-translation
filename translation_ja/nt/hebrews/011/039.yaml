  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: ja
  text: これらの人々は皆、信仰によって証しを受けましたが[a]、約束のものを受け取りませんでした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰によって認められましたが」または「信仰によって証言を受けましたが」。ギリシア語は、これらの人々が信仰によって証しを受けたことを表します。この文脈では、その証しは好意的なものです。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「約束を受け取りませんでした」。ここでは、約束されたものをまだ受け取っていなかったことを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: こうして
  rationale: 直前まで列挙された信仰者たちを総括する接続として、単なる並列よりも自然な日本語の流れを作りつつ、明示されていない強い逆接は加えない。
- source_word: πάντες
  choice: この人たちは皆
  rationale: 直前に挙げられた信仰者たちを指す照応関係を、現代日本語で明確にする。
- source_word: μαρτυρηθέντες
  choice: 良い証しを受けながらも
  rationale: 神から好意的な証言・承認を受けたという受動の意味を保つ。「ながらも」は、後続の「受け取りませんでした」との文脈上の譲歩関係を自然に表す。
- source_word: διὰ τῆς πίστεως
  choice: 信仰によって
  rationale: διά＋属格の手段・媒介を自然に表し、ヘブライ人への手紙11章の中心語である πίστις を「信仰」とする。
- source_word: οὐκ ἐκομίσαντο
  choice: 受け取りませんでした
  rationale: κομίζω 中動態の「受ける、手に入れる」という意味を、平明で格調を失わない日本語にする。
- source_word: τὴν ἐπαγγελίαν
  choice: 約束のもの
  rationale: 定冠詞付き単数の「約束」を踏まえつつ、日本語で「約束を受け取る」とした際に約束そのものを聞いた意味に誤解されるのを避け、約束されたものを受領する意味を表す。成就内容の特定まではしない。
theological_decisions:
- issue: 「約束」が指すもの
  choice: 「約束のもの」とし、具体的な内容を特定しない
  alternative: 「約束」「約束の成就」「約束された相続財産／祝福」
  rationale: 文脈は終末的な約束の成就を示唆するが、ギリシア語自体は簡潔な単数形であり、40節がさらに説明する。本文で特定の内容に限定せず、神学的な緊張を保つ。
- issue: 分詞 μαρτυρηθέντες と主動詞の関係
  choice: 「良い証しを受けながらも」と譲歩的に表現する
  alternative: 「良い証しを受けて」「良い証しを受けたが」
  rationale: 分詞そのものに譲歩を明示する接続詞はないが、信仰による承認と約束を未受領だったことの対比が文脈上明白である。「ながらも」はその関係を自然に示しつつ、承認と救済を同一視しない。
translation_notes:
  register: 明瞭な現代標準語を用い、「良い証し」「約束のもの」により原文の簡潔さと神学的含みを保った。文末は丁寧体で統一し、朗読にも適した自然で品位ある調子とした。
