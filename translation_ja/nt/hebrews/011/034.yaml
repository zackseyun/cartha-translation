source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: ja
  text: 火の力を消し、剣の刃[a]を逃れ、弱さから強くされ、戦いにおいて力強い者となり、外国の軍勢[b]を退かせました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「剣の口々」。剣の刃を意味する慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「軍勢」と訳した語は、字義的には「陣営」または「宿営」。ここではそこにいる軍隊を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: 火の力を消し
  rationale: 「火」だけに平板化せず、δύναμις の「力・威力」を明示する。σβέννυμι の具体的な「消す」という比喩も保った。
- source_word: ἔφυγον στόματα μαχαίρης
  choice: 剣の刃を逃れ
  rationale: στόματα の直訳は「口」だが、剣については切っ先・刃を表す慣用句である。「剣の刃を逃れ」は、危機から無事に逃れたという文脈上の結果を自然に伝える。
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: 弱さの中から強くされ
  rationale: 受動態を「強くされ」として保ち、力が自力だけで生じたとは限定しない。ἀπό は、弱い状態を起点としてそこから強められた展開を「中から」で表した。
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: 戦いでは勇猛となり
  rationale: 直前の「強く」との単調な重複を避けつつ、戦闘において強力な者となったという意味を「勇猛」で表した。πόλεμος はこの軍事的文脈で「戦い」とした。
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: 外国の軍勢を敗走させ
  rationale: παρεμβολή は字義的には「陣営・宿営」だが、ここではそこに属する軍勢を指す換喩と解した。κλίνω は軍事文脈で相手を退却させる意味なので「敗走させ」とした。
theological_decisions:
- issue: 信仰による救出と勝利の描写をどの程度具体的に残すか
  choice: 火、剣、弱さ、戦い、外国の軍勢という歴史的・軍事的な像をそのまま保つ
  alternative: 危険や敵に対する一般的または霊的な勝利として抽象化する
  rationale: 本文は具体的な行為と危難を列挙しており、霊的意味だけに限定する根拠はないため。
- issue: ἐδυναμώθησαν の受動態における行為者
  choice: 「強くされ」とし、行為者を明示しない
  alternative: 「神によって強くされた」と補う、または「強くなった」と能動的に言い換える
  rationale: 神の働きが文脈上含意され得る一方、ギリシャ語本文は行為者を明示していない。受動の形を保つことで、その含意と文法上の余白をともに残した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で格調ある列挙表現とした。原文のアオリスト動詞の連続を、日本語では「消し、逃れ、強くされ、勇猛となり、敗走させました」と一続きのリズムで表現した。敬体は周辺本文への接続を想定して終止部に用いた。
