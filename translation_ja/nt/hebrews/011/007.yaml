  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: ja
  text: 信仰によって、ノアは、まだ見えない事柄について警告を受け[a]、畏れ慎んで[b]、自分の家の者たちを救うために箱舟を造りました。その箱舟によって[c]、彼は世を有罪と定め、信仰に基づく義[d]を受け継ぐ者となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神から告げられた」または「神から警告を受けた」とも訳せます。原文では告知者は明示されていませんが、神からの告知が含意されています。
    reason: lexical_alternative
  - marker: b
    text: 「畏敬の念に動かされて」または「敬虔な畏れを抱いて」とも訳せます。単なる恐怖ではなく、畏れを伴う敬虔な応答を表します。
    reason: lexical_alternative
  - marker: c
    text: 「その箱舟によって」が文法上最も自然です。ただし、ノアの信仰、または信仰に基づく従順な行動を広く指すと理解することもできます。
    reason: alternative_reading
  - marker: d
    text: 「義」は「正義」とも訳せますが、ここでは「信仰に基づく義」という表現と相続の比喩から、「正義」よりも信仰との関係における義を指すと理解するのが適切です。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: 手段を表す与格であり、ヘブライ人への手紙11章に繰り返される定型を保つ。「信頼」や「忠実さ」ではなく、ここではノアの信じて応答する姿を示す。
- source_word: χρηματισθεὶς
  choice: 警告を受け
  rationale: 受動形は神からの告知・警告を受けることを含意するが、ギリシア語本文に「神」が明示されていないため、本文では動作主を補わない。
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: まだ見えない事柄について
  rationale: μηδέπωの「まだ……ない」という時間的意味と、来るべき出来事が現時点では目に見えないことを簡潔に表す。
- source_word: εὐλαβηθεὶς
  choice: 畏れ慎んで
  rationale: 単なる恐怖ではなく、神からの警告に対する敬虔な畏れと慎み深い応答を表す。
- source_word: κατεσκεύασεν κιβωτὸν
  choice: 箱舟を造りました
  rationale: ノア物語におけるκιβωτόςの定着した訳語を用い、κατασκευάζωの意図的に造り上げる行為を自然な日本語で表す。
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: 自分の家の者たちを救うために
  rationale: σωτηρίαの直接的な救出の意味を文脈に即して動詞化し、οἶκοςは単なる建物ではなく世帯・家族を指すため「家の者たち」とする。
- source_word: δι’ ἧς
  choice: その箱舟によって
  rationale: 女性形の関係代名詞が最も自然に直前の女性名詞κιβωτόςを受けることを明確にする一方、広く信仰や従順な行動を指す理解は脚注に残す。
- source_word: κατέκρινεν τὸν κόσμον
  choice: 世を罪に定め
  rationale: ノアの信仰に基づく従順が、不信仰な世の罪を明らかにし、その有罪性を示したという司法的な語感を保つ。
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: 信仰に基づく義
  rationale: κατάを過度に限定せず関係・基準を表す「に基づく」とし、δικαιοσύνηはこの文脈で「正義」よりも神との正しい関係を含む「義」が適切である。
- source_word: ἐγένετο κληρονόμος
  choice: 受け継ぐ者となりました
  rationale: 結果として相続人の身分になったことを、現代日本語で自然に表す。
theological_decisions:
- issue: χρηματισθεὶςの告知者を本文で明示するか
  choice: 本文では「警告を受け」とし、神を明示しない
  alternative: 「神から警告を受け」または「神のお告げを受け」
  rationale: 受動形とノア物語の背景は神を告知者として強く含意するが、本文自体には動作主が明示されていない。原文の含意と省略の双方を保つ。
- issue: εὐλαβηθεὶςの意味合い
  choice: 畏れ慎んで
  alternative: 畏敬の念に動かされて／神を畏れて
  rationale: 単なる恐怖にも、感情を欠いた敬意にも狭めず、敬虔な畏れが従順な行動へ至る緊張を保つ。
- issue: δι’ ἧςの指示対象
  choice: その箱舟によって
  alternative: 信仰によって／信仰に基づく従順な行動によって
  rationale: 文法上最も近く性も一致する先行詞はκιβωτόςである。ただし章全体の主題からより広い指示を認める解釈もあるため脚注で示す。
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 正義
  rationale: 「信仰に基づく」ことと「受け継ぐ者」という表現は、ここでは一般的・社会的な公正よりも、信仰との関係における正しい身分・あり方を示す「義」を支持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「箱舟」「義」「世を罪に定める」など定着した神学的・物語的語彙は維持し、難解になりやすい「家」を「家の者たち」と具体化した。敬体で統一した。
