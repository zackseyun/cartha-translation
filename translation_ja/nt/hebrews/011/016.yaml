id: HEB.11.16
reference: Hebrews 11:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: ja
  text: しかし実際、彼らが切望しているのは、もっとすぐれた故郷[a]、すなわち天の故郷です。だから神は、彼らの神と呼ばれることを恥じてはおられません。神は彼らのために都を用意されたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もっとすぐれた国」。原文では「故郷」に当たる名詞がこの節では省かれており、文脈から補われています。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: しかし実際
  rationale: 前節の仮定と対照をなし、彼らが現に求めているものを示す談話標識として訳した。単に時間的な「しかし今」より文脈上の論理的対照が明確になる。
- source_word: κρείττονος
  choice: もっとすぐれた
  rationale: 比較の意味を明示し、ヘブライ人への手紙に繰り返される「よりすぐれたもの」という対照を自然な現代日本語で表した。
- source_word: ὀρέγονται
  choice: 切望している
  rationale: 単なる希望以上の、強く求めて向かう意味合いを表すため、「望んでいる」より強い「切望している」とした。
- source_word: κρείττονος … ἐπουρανίου
  choice: もっとすぐれた故郷、すなわち天の故郷
  rationale: 原文では女性形の形容詞だけが置かれているが、直前の文脈にある πατρίς（故郷）を補って理解するのが自然である。「天の」は ἐπουρανίου の形容詞的な表現を保つ。
- source_word: διὸ
  choice: だから
  rationale: 彼らが天の故郷を切望することから神の応答を導く推論を、明瞭で自然な接続語で示した。
- source_word: οὐκ ἐπαισχύνεται
  choice: 恥とはされません
  rationale: 神が彼らとの関係を恥じないという原文の名誉・関係性の含みを保ちつつ、神について述べる文にふさわしい自然で品位ある表現とした。
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: 彼らの神と呼ばれる
  rationale: 神が「彼らの神」と名づけられるという関係的な定式を、説明的に拡張せずそのまま保持した。
- source_word: ἡτοίμασεν
  choice: 用意された
  rationale: 神がすでに成し遂げた備えを簡潔に表し、アオリストの完了した行為を過去形で示した。
- source_word: πόλιν
  choice: 都
  rationale: 終末的な具体像としての「町／都市」を保持しながら、現代日本語の聖書文体として自然で品位のある「都」を選んだ。不定冠詞に相当する限定は加えていない。
theological_decisions:
- issue: κρείττονος と ἐπουρανίου に伴う省略された女性名詞
  choice: 直前の文脈の πατρίς を受けて「故郷」を補う
  alternative: 「国」を補う、または名詞を特定せず「もっとすぐれたもの」とする
  rationale: 両形容詞の女性形は文脈上 πατρίς を受ける。「故郷」は出生地だけでなく帰属する郷土も表し、この箇所の関係的な含みを自然に伝える。ただし「国」という訳も可能なので脚注に示した。
- issue: 「彼らの神」と呼ばれるという関係的定式
  choice: 原文どおり「彼らの神と呼ばれる」とする
  alternative: 「彼らを自分の民と認める」などと敷衍する
  rationale: 契約的背景はあり得るが、本文が明言するのは神が「彼らの神」と呼ばれることである。明示されていない対応句を補わず、原文の表現と神学的緊張を保った。
- issue: 神が都を備えた行為の時制
  choice: 「用意された」と完了した行為として訳す
  alternative: 現在の状態を強調して「用意しておられる」とする
  rationale: ἡτοίμασεν はアオリストであり、備えがすでになされたことを表す。現在への意義を否定せず、時制面を過度に解釈しない訳とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「恥とはされません」「都」によって品位ある聖書文体を保った。「故郷」を繰り返すことで、ギリシア語では省略されている指示内容を日本語で曖昧なく示した。
