- source_word: μέγας γενόμενος
  choice: 成人したとき
  rationale: 直訳的な「大きくなったとき」ではなく、成熟して大人になったことを表す慣用的な意味を自然な現代日本語で示した。
- source_word: ἠρνήσατο
  choice: 拒みました
  rationale: 続く不定詞の内容、すなわち特定の身分で呼ばれることを意志的に受け入れなかったという意味を明確に表す。
- source_word: λέγεσθαι
  choice: 呼ばれること
  rationale: 受動不定詞の意味を直接かつ自然に表した。
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: ファラオの娘の息子
  rationale: モーセに帰せられた特定の王族としての身分を表す。原文の属格関係を明瞭に保った。
- source_word: Φαραώ
  choice: ファラオ
  rationale: 現代日本語で一般に理解される称号の表記を採用した。
