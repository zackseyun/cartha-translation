  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: ja
  text: 神は、私たちのために、より良いものをあらかじめ備えておられたのです[a]。それは、彼らが私たちとは別に完全な者とされないようにするためでした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちのために、より良いものをあらかじめ見通しておられた」。ギリシア語は、前もって見通すことと、前もって備えることの両方を含み得る。ここでは文脈に基づき「備えて」とした。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らが私たちなしに完成に至ることがないようにするためでした」または「彼らが私たちとは別に全うされることがないようにするためでした」。
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: あらかじめ備えておられた
  rationale: 語形には「あらかじめ見る」という含みがあるが、文脈では、神が後の信仰者をも視野に入れて、より良い成就を前もって備えたことを表す。「備える」に「あらかじめ」を添え、先行する計画と配慮を保った。
- source_word: κρεῖττόν τι
  choice: より良いもの
  rationale: κρείττων はヘブライ人への手紙で繰り返される比較表現であり、「より良い」として主題的な響きを保つ。τι は不定の「もの」と自然に表した。
- source_word: περὶ ἡμῶν
  choice: 私たちのために
  rationale: 直訳的には「私たちについて／私たちに関して」だが、προβλεψαμένου との結び付きでは、私たちを念頭に置いた神の備えを示すため、自然な受益表現とした。
- source_word: ἵνα μὴ
  choice: それは、…ことがないためでした
  rationale: 目的を明確に示しつつ、長い一文による不自然さを避けるため二文に分けた。目的・意図の力は保持している。
- source_word: χωρὶς ἡμῶν
  choice: 私たちを抜きにして
  rationale: 「私たちから離れて」ではなく、彼らの完成が私たちとは別個に生じないという共同的な意味を、現代日本語で明瞭に表した。
- source_word: τελειωθῶσιν
  choice: 完全にされる
  rationale: 受動態を保ち、τελειόω が持つ「完全にする」と「完成へ至らせる」の両面を一方に限定しない表現とした。
- source_word: τοῦ θεοῦ
  choice: 神は
  rationale: 属格独立構文を、前節の理由を示す自然な日本語の主語節として訳した。
theological_decisions:
- issue: ヘブライ人への手紙における τελειωθῶσιν の意味
  choice: 「完全にされる」とし、完成と完全の両方の含みを残す。
  alternative: 「完成に至る」「全うされる」
  rationale: この語は道徳的な無欠だけでなく、神の救いの計画における成就・完成にも関わる。「完成」のみに狭めず、神による受動的な完成という神学的緊張を保持した。
- issue: 昔の信仰者と「私たち」との関係
  choice: 「私たちを抜きにして」と訳し、彼らが私たちとは切り離されて完成されないことを示す。
  alternative: 「私たちなしに」「私たちとは別に」
  rationale: 本文が示す共同的・救済史的な結び付きを保ちつつ、それが具体的にどのように実現するかについては解釈を加えなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「より良い」「完全にされる」という書簡の神学的な主要語を保った。原文は前節に続く一つの従属的な構文だが、日本語では論理関係を明瞭にするため二文に分けた。「おられたのです」「ためでした」により、説明・理由を示す落ち着いた格調を持たせた。
