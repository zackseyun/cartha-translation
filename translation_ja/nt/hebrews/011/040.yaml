  source_fidelity: 本文は、τοῦ θεοῦ ... προβλεψαμένου を神が前もって備えたこととして、κρεῖττόν τι を「より良いもの」、περὶ ἡμῶν を「私たちのために」と訳しており、原文の主要な意味をよく保っています。ἵνα μὴ 以下も、昔の信仰者たちの完成が「私たち」と切り離されないという趣旨を保持しています。ただし τελειωθῶσιν の受動的・終末論的な含みは、「完全にされる」より「完全な者とされる」の方が日本語として明瞭です。
  naturalness: 「彼らが私たちを抜きにして完全にされる」は意味は通じますが、人についての「完全にされる」は現代標準日本語ではやや硬く不自然です。「私たちとは別に完全な者とされる」とすれば、受動態を保ちながら自然になります。「それは…ためでした」も可能ですが、目的をより直接に示す「それは、…ないようにするためでした」が明瞭です。
