  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: ja
  text: というのは、このようなことを語る人たちは、自分たちが故郷[a]を求めていることを明らかにしているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの国」または「生まれ故郷」とも訳せます。続く文脈では、彼らがさらに良い、天にある故郷を求めていたことが示されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: （訳文では独立した接続語を置かず）
  rationale: 前節を受ける説明のつながりは文脈と「このようなこと」によって自然に伝わる。日本語で「というのは」を加えると、この一節だけでは文が不自然に宙づりになるため、明示しない。
- source_word: τοιαῦτα
  choice: このようなこと
  rationale: 直前に述べられた内容を指す中性複数形の指示語を、簡潔で自然な現代日本語にした。
- source_word: λέγοντες
  choice: 語る人たち
  rationale: 現在分詞の一般的・継続的な働きを、名詞を修飾する自然な表現で示した。
- source_word: ἐμφανίζουσιν
  choice: 明らかにしています
  rationale: 発言によって事実をはっきり示すという意味を保ち、現在形の継続的・一般的な力も表した。
- source_word: ὅτι
  choice: 〜ことを
  rationale: 明らかにされる内容を導く節として、自然な日本語の名詞節で訳した。
- source_word: πατρίδα
  choice: 故郷
  rationale: 自分の国、郷里、祖国を意味し得る語。文脈に自然で、政治的含意を過度に帯びず、天上の帰属先にも用いうる「故郷」を選んだ。
- source_word: ἐπιζητοῦσιν
  choice: 求めている
  rationale: 単なる願望ではなく、継続して探し求める現在形の意味を自然に表した。
theological_decisions:
- issue: 族長たちが求める πατρίς の意味
  choice: 本文では一般的に「故郷」とし、地上か天上かを限定しない。
  alternative: 「天の故郷」または「地上の故郷」と明示する。
  rationale: この節自体は求める場所を限定しておらず、次節がそれをより良い天の故郷として明らかにするため、ここでは先取りして解釈を固定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「故郷」は一般読者に理解しやすく、πατρίς の意味の幅と次節への展開を保つ。
