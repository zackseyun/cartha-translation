  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: ja
  text: 神の民と共に苦しめられることを、罪の一時的な楽しみを得ることよりもむしろ選んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「つかの間の罪の楽しみ」。
    reason: πρόσκαιρονは「一時的な」のほか、「つかの間の」とも訳せる。
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: むしろ選び
  rationale: 比較される二つの道のうち、モーセが前者を意志的に選んだことを、自然な日本語で表す。分詞は前節のモーセを受ける。
- source_word: συγκακουχεῖσθαι
  choice: 共に苦しめられること
  rationale: 接頭辞 συν- の共同性と、虐待・苦難を受ける受動的意味の双方を保つ。
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: 神の民と
  rationale: 契約共同体を指す定型的な表現を、明瞭で格調ある現代日本語にした。
- source_word: ἢ
  choice: …ことを選ばなかった
  rationale: ギリシア語では μᾶλλον…ἢ により選好を示す。日本語では同じ動詞を補って否定対照にすると、二つの選択肢の関係が明瞭になる。
- source_word: πρόσκαιρον
  choice: 一時的な
  rationale: 長続きせず、限られた期間だけであることを過度な解釈なしに示す。
- source_word: ἔχειν
  choice: 得ること
  rationale: 基本義「持つ」を文脈に即して自然に表し、楽しむという意味は名詞側に担わせた。
- source_word: ἁμαρτίας ἀπόλαυσιν
  choice: 罪の一時的な楽しみ
  rationale: 属格の広がりを保ち、罪の具体的内容を特定しない。「楽しみ」は ἀπόλαυσις の享受・快楽の意味を平明に伝える。
theological_decisions:
- issue: 「罪の楽しみ」が具体的に何を指すか
  choice: 罪に伴う短期間の楽しみとして広く訳し、具体的行為を限定しない。
  alternative: ファラオの宮廷における特権や妥協、またはエジプトに結びつく罪深い快楽を特に指すと解する。
  rationale: ギリシア語本文は、神の民との連帯に対置される「罪」の内容を明示していないため、その曖昧さを保つ。
translation_notes:
  register: 現代標準日本語。前節から続く分詞構文を受け、単独でも意味が通るよう対照の後半に「選ばなかった」を補った。平明さと格調を両立させ、罪の具体的内容は本文以上に限定していない。
