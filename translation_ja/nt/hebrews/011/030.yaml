  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: ja
  text: 信仰によって、エリコの城壁は七日間にわたって取り囲まれた後、倒れました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰を通して」。ギリシア語の与格πίστειは、手段または様態を表すことができます。本文では、ヘブライ人への手紙11章で繰り返される定型表現を保っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: πίστιςの与格で、手段または様態を表し得ます。ヘブライ人への手紙11章で繰り返される表現の調子を保ちつつ、自然な現代日本語で表しました。
- source_word: τὰ τείχη Ἰεριχὼ
  choice: エリコの城壁
  rationale: τεῖχοςはここでは都市を囲む壁を指します。「城壁」は文脈に即しており、日本語としても簡潔で明確です。Ἰεριχώは固有名詞として「エリコ」としました。
- source_word: ἔπεσαν
  choice: 崩れ落ちました
  rationale: πίπτωの基本義は「落ちる、倒れる」です。城壁については「崩れ落ちる」が自然ですが、崩壊の仕方を必要以上に詳しく限定しません。
- source_word: κυκλωθέντα
  choice: その周囲を巡られた後
  rationale: κυκλόωのアオリスト受動分詞を、主動詞より前の出来事として表しました。原文が人間の行進を明示せず、城壁が周囲を巡られたことに焦点を置く点を保っています。
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: 七日間にわたって
  rationale: ἐπίと対格の時間表現が示す期間を、自然な日本語で表しました。
theological_decisions:
- issue: ヘブライ人への手紙11章30節におけるπίστιςの訳
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: 11章で反復される定型句と、信仰の模範を列挙する文脈に従い、「信仰」を本文に採用しました。「信頼」や「忠実さ」に限定して神学的緊張を解消することは避けています。
- issue: πίστειの与格が表す関係
  choice: 信仰によって
  alternative: 信仰を通して／信仰のうちに
  rationale: 手段と様態の両方の含みを許す表現を採用しました。脚注で別訳と文法上の幅を示します。
translation_notes:
  register: 明瞭で現代的な敬体を用い、聖書本文としての品位を保ちました。受動分詞の焦点と七日間という期間を明示しつつ、ヨシュア記6章から行為者や具体的な行進の描写を過度に補わないようにしました。
