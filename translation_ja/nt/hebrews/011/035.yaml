language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: ja
  text: 女性たちは、死んだ者たちを復活によって取り戻しました。しかし、ほかの人々は拷問にかけられ、釈放[a]を受け入れませんでした。より優れた復活[b]を得るためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「釈放」は「解放」とも訳せます。ここでは、救いの意味での「贖い」というより、拷問や死から解き放たれることを指します。
    reason: lexical_alternative
  - marker: b
    text: 「より優れた復活」は、前半で死者が通常の地上の命に戻されたことと対照をなしています。ここでは、死を越えた、より優れた復活への希望が示されています。
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: 取り戻しました
  rationale: 単なる「受けた」ではなく、死んでいた者が復活して再びその女性たちのもとに戻されたという文脈上の意味を自然な日本語で表す。
- source_word: γυναῖκες
  choice: 女たちは
  rationale: 文脈上、特に妻に限定されないため、一般的な「女たち」とした。
- source_word: ἐξ ἀναστάσεως
  choice: 復活によって
  rationale: ἐξ が示す源・手段を日本語で明確にし、死者が復活を通して戻されたことを表す。
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: 死んだ身内の者たちを
  rationale: 直訳的な「彼女たちの死者」より自然で、彼女たちに属する亡くなった近親者という含意を伝える。原文は関係を特定しないため「息子」などには限定しない。
- source_word: ἄλλοι δὲ
  choice: しかし、ほかの人々は
  rationale: 前半の生還と、後半で現世の解放を拒んで苦難を受けた人々との対照を示す。
- source_word: ἐτυμπανίσθησαν
  choice: 拷問にかけられました
  rationale: 激しい身体的苦痛を加えられたことを表しつつ、語源的に関連する器具や具体的方法が確定できないため過度に特定しない。
- source_word: οὐ προσδεξάμενοι
  choice: 受け入れず
  rationale: 差し出された解放を意図的に拒んだという分詞の意味を簡潔に表す。
- source_word: τὴν ἀπολύτρωσιν
  choice: 釈放
  rationale: ここでは救済論的な「贖い」よりも、拷問や死から解放されることを指す。提示された解放を受け入れるという文脈に「釈放」が自然に合う。
- source_word: ἵνα
  choice: それは、…ためでした
  rationale: 彼らが釈放を拒んだ目的を明示する。
- source_word: κρείττονος ἀναστάσεως
  choice: さらに優れた復活
  rationale: 直前の、一時的に地上の命へ戻る復活との比較を「さらに」で示し、κρείττων の「より優れた」を保持する。
- source_word: τύχωσιν
  choice: 得る
  rationale: ここでは復活にあずかる、獲得するという意味で、平明な「得る」が自然である。
theological_decisions:
- issue: ἀπολύτρωσιν の文脈上の意味
  choice: 拷問や死からの現世的な釈放
  alternative: 広い救済論的意味での贖い
  rationale: 直近の文脈は、信仰を曲げれば得られたであろう解放を拒む人々について述べる。「釈放」とすることで、本文が明示していない贖罪・救済の教理を持ち込まない。
- issue: 「さらに優れた復活」の比較対象
  choice: 先に述べられた、死者が地上の命へ戻されたことより優れた、死を越える復活
  alternative: 前半との明確な対照を含まない、単により好ましい復活
  rationale: 同じ節の前半と後半の修辞的対照を反映する。ただし、その復活の様態や時期は本文以上に規定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、敬体で統一した。「身内の者たち」は原文の所有関係を自然に表しつつ、続柄を限定しない。「拷問」は方法を断定せず核心的意味を伝える。対照を明確にするため文を分けたが、原文の論理的連続性は接続語と目的表現で保持した。
