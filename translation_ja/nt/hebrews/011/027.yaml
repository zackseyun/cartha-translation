id: HEB.11.27
reference: Hebrews 11:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: ja
  text: 信仰によって、彼はエジプトを去り、王の怒りを恐れませんでした。[a] なぜなら、目に見えない方を見ている者であるかのようにして、耐え忍んだからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで念頭に置かれているのは、モーセがファラオを逃れてエジプトを去った時（出エジプト記2章）とも、イスラエルを率いて出た時（出エジプト記12～14章）とも考えられます。ギリシャ語本文は、どちらの出来事かを特定していません。
    reason: cross_reference
  - marker: b
    text: 「目に見えない方」は、「見えない方」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: 道具・様態を表す与格として理解し、ヘブライ人への手紙11章で繰り返される表現に合わせた。文脈上、行動を生じさせる信仰を表す。
- source_word: κατέλιπεν Αἴγυπτον
  choice: エジプトを去りました
  rationale: καταλείπω の基本的な意味を自然な現代日本語で表した。「捨てた」では離反の含意が強すぎるため避けた。
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: 王の怒りを恐れず
  rationale: 否定を伴う分詞句を主動詞に付随する態度として簡潔に訳した。θυμός は強い怒りを表すが、「激怒」「憤激」よりも過度に強めない「怒り」とした。
- source_word: τὸν ἀόρατον
  choice: 目に見えない方
  rationale: 冠詞付き形容詞が人格的な指示対象を表しているため、「方」を用いた。続く「見ている」との逆説的な響きを保った。
- source_word: ὡς ὁρῶν
  choice: 見ているかのようにして
  rationale: ὡς の比較的な働きと現在分詞の継続的な描写を保ち、実際に肉眼で見たと断定しない表現とした。
- source_word: ἐκαρτέρησεν
  choice: 耐え抜いたのです
  rationale: καρτερέω が表す堅忍と持続を自然に伝える。「耐えた」よりも、困難の中で揺るがず持ちこたえた含意を示す。
theological_decisions:
- issue: 「エジプトを去った」が指す出来事
  choice: 本文では、モーセがエジプトを去ったとのみ訳し、どの出来事かを特定しない。
  alternative: 出エジプト記2章の逃亡、または出エジプト記12～14章でイスラエルを率いて出た出来事と特定する。
  rationale: ギリシャ語本文は出来事を明示しておらず、いずれを指すかについて解釈が分かれるため、曖昧さを本文に残した。
- issue: 「目に見えない方を見る」という表現
  choice: 知覚の逆説を保ち、「目に見えない方を、見ているかのようにして」と訳す。
  alternative: 神への確信や霊的認識という意味を説明的に本文へ織り込む。
  rationale: 本文は信仰による忍耐を視覚の比喩で表しているが、その仕組みを説明してはいないため、神学的説明を付加しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半の分詞構文は日本語として自然な連用表現にし、後半では原文の「見えない方」と「見る」の逆説、および忍耐の強さを保持した。敬体で統一した。
