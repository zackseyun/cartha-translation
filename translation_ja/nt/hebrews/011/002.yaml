  text: ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/002.yaml
  text: For by this the elders received approval[a][b][c].
translation:
  language: ja
  text: というのも、この信仰によって、昔の人々は良い証しを受けました[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「証しを受けました」。この文脈では、好意的に証しされ、認められたことを表します。ギリシア語本文は、その証しをする主体を明記していません。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「年長者たち」または「長老たち」。ここでは、これから挙げられる昔の信仰者たちを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: この信仰によって
  rationale: 女性単数の指示代名詞は直前の πίστις（信仰）を自然に受け、ἐν はここでは手段を表す。日本語では指示内容を明示したほうが自然であり、文脈とのつながりも明確になる。
- source_word: γὰρ
  choice: 実に
  rationale: 前節を根拠づける説明的な接続を示す。単独の節としても不自然にならず、強すぎない形で前文との論理的つながりを保つ。
- source_word: ἐμαρτυρήθησαν
  choice: 神から良い証しを受けました
  rationale: μαρτυρέω のアオリスト受動形で、好意的な証言を受けるという意味。11章全体の文脈では証しの究極的な主体が神であるため、それを補って明瞭にしつつ、『証し』という語を保って同語根のつながりを生かす。
- source_word: οἱ πρεσβύτεροι
  choice: 昔の人々
  rationale: ここでは教会の役職としての『長老たち』ではなく、続いて列挙される昔の信仰者たちを広く指す。現代日本語で誤解なく意味を伝えるため『昔の人々』とする。
theological_decisions:
- issue: ταύτῃ の指示対象
  choice: 直前の『信仰』を指すものとして『この信仰によって』と訳す。
  alternative: 11章1節に述べられた事柄全体を、より広く指す。
  rationale: 文法上、女性単数形が πίστις と一致し、11章の議論も信仰を中心に展開する。ただし『この』を残すことで、前節の記述全体との結びつきも排除しない。
- issue: 好意的な証しの主体
  choice: 文脈に即して『神から』を本文で補う。
  alternative: 主体を明示せず『良い証しを受けました』とする。
  rationale: ギリシア語本文には行為主体が明記されていないが、ヘブライ11章4、5、39節は神による好意的な証しを示唆する。補足語であることと原文の受動表現に残る余地を脚注で示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の簡潔さを保ちながら、『長老』という役職上の誤解を避けた。「良い証し」は本章内の μαρτυρέω 語群との連関を保持する表現とした。
