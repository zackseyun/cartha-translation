  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: ja
  text: 彼らは信仰によって、国々を征服し、義を行い[a]、約束を得て[b]、獅子の口をふさいだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義を実現し」とも訳せる。ギリシア語は、正しい行い全般、または公正を行うことを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「約束されたものを得て」とも訳せる。原文は「約束」を目的語とする表現で、約束そのものを得たこと、または約束された事柄を得たことのいずれにも理解され得る。
    reason: lexical_clarification
lexical_decisions:
- source_word: διὰ πίστεως
  choice: 信仰によって
  rationale: διά＋属格が行為の手段を示すため、「信仰によって」とした。ヘブライ人への手紙11章全体の主題にも合い、神への信頼によって行動したことを表す。
- source_word: κατηγωνίσαντο βασιλείας
  choice: 国々を征服し
  rationale: καταγωνίζομαιの、戦いで打ち負かし支配下に置くという強い意味を「征服する」で表した。複数形の βασιλείας は、ここでは政治的領域を指すため、現代日本語として自然な「国々」とした。
- source_word: εἰργάσαντο δικαιοσύνην
  choice: 義を行い
  rationale: ἐργάζομαιの能動的な「行う」と、δικαιοσύνηの道徳的・契約的な広がりを保った。「正義を実現し」という司法・社会的な意味も可能なので脚注に示した。
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: 約束を得
  rationale: 原文の複数形を日本語で総称的な「約束」として表し、約束そのものを得たのか、約束されたものを受けたのかを本文で過度に限定しないようにした。
- source_word: ἔφραξαν στόματα λεόντων
  choice: 獅子の口をふさいだ
  rationale: φράσσωの「ふさぐ」という意味と鮮明な比喩を保った。ダニエル書への暗示は本文に説明を加えず、そのまま伝えた。
theological_decisions:
- issue: Hebrews 11における πίστις の訳語
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: この文脈では、神に頼って行動することが中心であり、章全体とのつながりも明確な「信仰」が最適である。「忠実さ」を前面に出すほどの文脈上の根拠はない。
- issue: 非パウロ書簡における δικαιοσύνη の意味
  choice: 義
  alternative: 正義
  rationale: 正しい行い全般を含む広い意味を保つため「義」とした。ただし、公正を実現する意味も排除できないため、脚注で代案を示した。
- issue: 「約束を得た」と11章13節との緊張
  choice: 約束を得
  alternative: 約束されたものを得
  rationale: ἐπαγγελιῶν をそのまま「約束」とし、ある約束の成就を経験したことと、究極的な約束をまだ受けていないこととの書簡内の緊張を解消しすぎないようにした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。列挙の簡潔なリズムを保ち、「獅子」は聖書的な格調を保ちながら現代の読者にも理解できる表記とした。
