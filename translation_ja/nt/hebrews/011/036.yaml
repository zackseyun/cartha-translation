  text: ἕτεροι δὲ ἐμπαιγμῶν καὶ μαστίγων πεῖραν ἔλαβον, ἔτι δὲ δεσμῶν καὶ φυλακῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: ja
  text: また別の人々は、あざけりやむち打ち、さらには鎖や投獄という試練を受けました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτεροι
  choice: また別の人々
  rationale: 直前までに挙げられた人々とは別の一群を示す対照を、自然な日本語で表す。
- source_word: ἐμπαιγμῶν
  choice: あざけり
  rationale: 公然と侮辱し嘲笑する行為を、現代の読者に明瞭でありながら品位ある語で表す。
- source_word: μαστίγων
  choice: むち打ち
  rationale: むちによる身体的刑罰を具体的かつ分かりやすく示す。
- source_word: πεῖραν ἔλαβον
  choice: 試練に遭い
  rationale: 字義的には「試みを受けた」であり、苦難を経験したという意味と、それが試練であったという含みの双方を保つ。
- source_word: ἔτι δὲ
  choice: さらに
  rationale: 後続する拘束と投獄への追加・展開を簡潔に示す。文脈上の強調は自然な列挙によって伝える。
- source_word: δεσμῶν
  choice: 鎖につながれ
  rationale: 拘束具を指す具体性を保ち、日本語では動詞表現にして自然につなぐ。
- source_word: φυλακῆς
  choice: 投獄されました
  rationale: 監禁または牢獄に入れられた状態を、現代日本語で明瞭に表現する。
theological_decisions:
- issue: πεῖραν ἔλαβον が単なる経験を表すか、信仰の試練という含意を持つか
  choice: 「試練に遭い」として試練の含意を本文に残す
  alternative: 「経験し」「受け」として中立的に訳す
  rationale: πεῖρα の「試み・試練」という語義を保ちつつ、苦難の目的や神学的原因までは断定しない。
translation_notes:
  register: 明瞭な現代標準日本語。苦難の重さを損なわないよう簡潔で品位ある叙述とし、原文の慣用表現にある「試練」の含意を保持した。
