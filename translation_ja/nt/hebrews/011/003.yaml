id: HEB.11.3
reference: Hebrews 11:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: ja
  text: 信仰によって、私たちはもろもろの時代[a]が神のことばによって整えられたことを理解します。その結果、見えるものは目に見えるものから生じたのではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「世界」または「宇宙」とも訳せる。ギリシア語は字義的には「もろもろの時代」で、時の流れを含む世界秩序を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 信仰によって
  rationale: 手段を表す与格として訳し、11章で繰り返される定型表現を明瞭に保つ。
- source_word: νοοῦμεν
  choice: 私たちは…悟ります
  rationale: 感覚による知覚ではなく、知性による理解・認識を表すため。「理解します」よりも文脈上の信仰による認識を自然に表現できる。
- source_word: κατηρτίσθαι
  choice: 整えられた
  rationale: 完了受動不定詞が示す、適切に形づくられ秩序づけられた状態を表し、物質的創造だけに意味を狭めない。
- source_word: τοὺς αἰῶνας
  choice: もろもろの時代[a]
  rationale: 複数形の字義的な時間性を保つ。同時に、時を通じた世界秩序を指し得るため、脚注で「世界」「宇宙」という解釈可能性を示す。
- source_word: ῥήματι θεοῦ
  choice: 神のことばによって
  rationale: 神の発せられたことばを手段として示す与格を、自然で簡潔な日本語にする。
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: その結果、…生じたのではありません
  rationale: 結果または目的を表し得る構文について、ここでは文脈に自然な結果の意味を採用し、γίνομαιの「生じる」という語義を保つ。
- source_word: ἐκ φαινομένων
  choice: 目に見えるものから
  rationale: 現れているもの、可視的なものを指す分詞を明瞭な現代日本語で表し、後続の可視世界との対照を保つ。
- source_word: τὸ βλεπόμενον
  choice: 見えるもの
  rationale: 単数の実詞的分詞を集合的に捉え、可視的な被造秩序全体を過度に限定せず表す。
theological_decisions:
- issue: 創造に関するαἰῶνεςの範囲
  choice: 本文では「もろもろの時代」とし、脚注で「世界」「宇宙」の可能性を示す。
  alternative: 「世界」または「宇宙」と本文で訳す。
  rationale: αἰῶνεςには時間的な「時代」と、時間を通じて展開する世界秩序の両面があり、「宇宙」だけに限定すると原文の幅が狭まるため。
- issue: 無からの創造との関係
  choice: 「見えるものは、目に見えるものから生じたのではない」と原文の明示的範囲にとどめる。
  alternative: 「無から造られた」と明記する。
  rationale: この節は無からの創造と調和するが、直接述べているのは可視的なものが可視的なものを起源としないことなので、教理的含意を本文へ補わない。
- issue: εἰς τό構文の目的・結果の幅
  choice: 「その結果」と訳す。
  alternative: 「そのため」「それは…ためです」と目的寄りに訳す。
  rationale: この文脈では、神のことばによって整えられたことから導かれる結果として読むのが自然。ただし構文自体には目的の含みもあり得るため、因果関係以上を加えない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「もろもろの時代」は日常語としてやや異質だが、原語の時間的・宇宙的な幅を保つため採用し、脚注で補足した。「ことば」は聖書本文として自然な表記を用いた。
