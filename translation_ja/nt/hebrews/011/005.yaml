id: HEB.11.5
reference: Hebrews 11:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: ja
  text: 信仰によって、エノクは死を見ることがないように移され[a]、見つからなくなりました。神が彼を移されたからです。移される前に、彼は神を喜ばせたと証しされていたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死を見る」は、「死を経験する」という意味の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: 信仰によって
  rationale: πίστιςの基本的な意味を保ちつつ、ここでは与格の手段・あり方を自然な日本語で表す。ヘブライ人への手紙11章の反復表現にも適する。
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: 移され／移された／移される
  rationale: 同語根の反復を日本語でも保ち、神の働きによってエノクが地上の通常の生から移されたことを受動表現で示す。「天に上げられた」など本文に明記されない行き先は補わない。
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: 死を見ることがないように
  rationale: 目的または結果を表す属格付き不定詞を「ないように」で表し、「死を見る」という原文の慣用表現を保持する。
- source_word: οὐχ ηὑρίσκετο
  choice: 見つからなくなりました
  rationale: 未完了過去の継続的な状態を自然に示しつつ、誰が捜したかは原文どおり明示しない。「見いだされなかった」より現代日本語として明瞭。
- source_word: μεμαρτύρηται
  choice: 証しされていた
  rationale: 完了受動の証言・証明の意味と受動性を保つ。単に「称賛された」とせず、聖書の証言を背景に持ち得る語義上の幅を残す。
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: 神に喜ばれた
  rationale: 神を喜ばせた、神に受け入れられたという意味を、日本語として自然で聖書的な受動表現にする。完了不定詞の先行性は「移される前に」「証しされていた」との組み合わせで示す。
theological_decisions:
- issue: エノクが「移された」ことの意味
  choice: 「移された」と訳し、行き先や仕組みを付加しない。
  alternative: 「天に上げられた」「死なずに天へ移された」と明示する。
  rationale: 本文は神がエノクを移し、彼が死を見なかったと述べるが、移された先やその仕組みまでは説明していないため。
- issue: 「死を見る」の解釈
  choice: 原文の慣用表現を本文に残す。
  alternative: 本文で「死を経験する」「死ぬ」と意訳する。
  rationale: 日本語でも意味を推測できる表現であり、原文の比喩的な言い回しを保持できる。意味は脚注で明確にする。
- issue: μεμαρτύρηταιの証言者
  choice: 「証しされていた」とし、証言者を明示しない。
  alternative: 「神から良い証しを受けていた」「聖書に証しされていた」とする。
  rationale: 文脈上は神または聖書の証言が考えられるが、ギリシア語本文は行為者を明示していないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保つ。「移された」の反復により原文のμετατίθημι語群の結び付きを示した。文末の読点は完結した日本語として句点に整えた。
