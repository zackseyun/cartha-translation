  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: ja
  text: そして、完成されて[a]、ご自分に従うすべての人にとって、永遠の救いの源[b]となられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「完全な者とされ」または「全うされ」。ここでは、道徳的に不完全だった方が改善されたという意味ではなく、祭司としての働きと救いの使命を完成されたことを指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「源」は「創始者」または「原因」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から続く関係を自然な現代日本語で示し、論理関係を過度に限定しない。
- source_word: τελειωθεὶς
  choice: 完成された方となり
  rationale: アオリスト受動分詞。道徳的欠陥の改善ではなく、苦難を通して祭司的・贖罪的役割の目標に到達したことを表す文脈上の意味を保つ。日本語では単に「完全にされ」とすると道徳的意味に誤解されやすいため、「完成」を用いた。
- source_word: ἐγένετο
  choice: となられました
  rationale: 完成の後に生じた役割・状態を表す。「なられました」は主語への敬意を自然に示すとともに、γίνομαιの結果的意味を保つ。
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: ご自分に従うすべての人にとって
  rationale: ὑπακούωの服従・従順の意味を「従う」で明示し、現在分詞の特徴的・継続的な含みを保つ。与格は救いの源が誰のためのものかを示すため、「にとって」とした。
- source_word: αἴτιος
  choice: 源
  rationale: 救いを生じさせる責任者・原因という意味を、硬すぎず明瞭な日本語で表す。「創始者」や「原因」も可能なので脚注に示す。
- source_word: σωτηρίας αἰωνίου
  choice: 永遠の救い
  rationale: ヘブライ書の救済論的語調を保ち、αἰώνιοςを現代日本語で最も自然な「永遠の」と訳す。
theological_decisions:
- issue: イエスについて用いられた τελειωθεὶς の意味
  choice: 「完成された方となり」とし、使命・役割が目標に達した意味を前面に出した。
  alternative: 「完全な者とされ」「全うされ」
  rationale: 本文の受動と到達・完成の緊張を保ちつつ、イエスが道徳的不完全から改善されたとの誤解を避ける。特定の教派的説明を本文へ付加しない。
- issue: 「ご自分に従うすべての人」の範囲と条件
  choice: 服従を表す語を「信じる」などに言い換えず、「従う」と明記した。
  alternative: 「ご自分に聞き従うすべての人」「ご自分に従順なすべての人」
  rationale: ギリシャ語が明示する従順の概念を保持し、それと信仰との関係を翻訳によって教理的に解決しない。
- issue: αἴτιος の因果的意味
  choice: 「救いの源」とした。
  alternative: 「救いの創始者」「救いの原因」
  rationale: キリストが永遠の救いをもたらす方であることを自然に示しつつ、因果性を脚注で補足する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。前後の文脈につながる「そして」で開始し、キリストを指す表現には日本語として自然な敬語を用いた。脚注記号[a][b]は対応箇所に明示した。
