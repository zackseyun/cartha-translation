  - severity: low
    issue: 「なってしまいました」が原文以上に遺憾・失態の含意を加える。
    rationale: 文脈には叱責があるが、γεγόνατε はまず到達した結果状態を述べる。「必要とするようになっています」はその含意を本文の流れに委ねつつ、完了の状態を保つ。
