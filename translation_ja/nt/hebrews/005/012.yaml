  naturalness: 「これまでの年月からすれば」および「初歩の基礎」はやや硬く不自然です。「これほど時間がたっているのですから」「初歩的な事柄」に改めると、現代標準日本語として明瞭です。
  terminology: 「神のことば」は λόγια τοῦ θεοῦ の自然で理解しやすい訳です。脚注で神に由来する語りかけ・啓示という含意を補う方針も適切です。「乳」「固い食物」の比喩は本文に保持します。
