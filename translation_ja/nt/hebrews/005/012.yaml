id: HEB.5.12
reference: Hebrews 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: ja
  text: あなたがたは、これほど時間がたっているのですから、もう教える者になっているべきなのに、神のことば[a]の初歩的な事柄を、もう一度だれかに教えてもらう必要があります。あなたがたは、固い食物ではなく、乳[b]を必要とするようになっています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神のことば」は、神から与えられた語りかけや啓示を指す。
    reason: cultural_note
  - marker: b
    text: 「乳」と「固い食物」は、初歩的な教えと、成熟した者にふさわしい教えを対比する比喩。
    reason: metaphor_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι διδάσκαλοι
  choice: 教える者になっているべき
  rationale: 期待される責任を表すὀφείλοντεςと、現在までに到達しているはずの状態を自然な現代日本語で表した。
- source_word: διὰ τὸν χρόνον
  choice: これまでの年月からすれば
  rationale: 単なる時点ではなく、十分な時間が経過したことを成熟への根拠として示す表現。
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: もう一度だれかに教えてもらう必要があります
  rationale: πάλινの反復・後退の含みを保ち、教える主体が明示されていない不定詞構文を日本語として自然にした。
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: 初歩の基礎
  rationale: στοιχεῖαの基礎的要素とτῆς ἀρχῆςの始まり・初歩という重なりを簡潔に保持した。τινάは文脈上、初歩に属する事柄を指すものとして処理した。
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: 神のことば
  rationale: λόγιαは神からの宣言・啓示のことばを指す。日本語で異教の託宣を連想させやすい「神託」よりも明瞭で自然な表現を選び、意味の幅は脚注で補った。
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: 必要とする者になってしまいました
  rationale: 完了形が示す、ある状態に至って今もその状態にあるという意味を保持し、文脈上の退行への非難を「なってしまいました」で自然に表した。
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: 固い食物ではなく、乳
  rationale: 霊的な未成熟と成熟を対照させる原文の食物の比喩を説明的に言い換えず、そのまま残した。
theological_decisions:
- issue: 乳と固い食物の比喩
  choice: 比喩をそのまま保持する
  alternative: 「初歩的な教え」と「高度な教え」と明示的に言い換える
  rationale: 本文は具体的な教理課程を定義していないため、後代の弟子訓練体系を持ち込まず、未成熟と成熟を示す著者の比喩と緊張を保った。
- issue: τῶν λογίων τοῦ θεοῦの意味
  choice: 「神のことば」と訳し、神からの語りかけ・啓示を指すことを脚注で示す
  alternative: 「神の神託」または「神の宣言」
  rationale: 神に由来する権威あることばという意味を保ちつつ、日本語で異教の託宣と誤解されることを避けた。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、叱責を含む厳粛な調子を保持した。「初歩の基礎」はやや重なる表現だが、στοιχεῖαとτῆς ἀρχῆςの重層性を残すために採用した。
