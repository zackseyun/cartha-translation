- from: あなたがたは、これまでの年月からすれば、もう教える者になっているべきなのに、神のことば[a]の初歩の基礎を、もう一度だれかに教えてもらう必要があります。あなたがたは、固い食物ではなく、乳[b]を必要とする者になってしまいました。
  to: あなたがたは、これほど時間がたっているのですから、もう教える者になっているべきなのに、神のことば[a]の初歩的な事柄を、もう一度だれかに教えてもらう必要があります。あなたがたは、固い食物ではなく、乳[b]を必要とするようになっています。
