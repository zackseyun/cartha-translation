id: HEB.5.14
reference: Hebrews 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: ja
  text: しかし、固い食物は成熟した人たちのためのものです。そうした人たちは、実践を重ねることによって[a]知覚する力[b]が鍛えられ、善と悪を見分けることができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「習慣によって」「繰り返し用いることによって」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「感覚」。ここでは、人の内的な知覚能力を比喩的に指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: 成熟した人たち
  rationale: 直前の「幼子」と対比される、十分に成長した人々を指す。罪のない完全さを意味すると限定せず、文脈上の成熟を自然な日本語で表す。
- source_word: στερεὰ τροφή
  choice: 固い食物
  rationale: 乳と対比される比喩を保ち、普通の食物より実質のあるものという原文の像を明確に伝える。
- source_word: διὰ τὴν ἕξιν
  choice: 実践を重ねることによって
  rationale: ἕξιςの「習慣・反復使用・実践」の幅を踏まえ、継続的な働かせ方によって能力が養われるという因果関係を自然に表す。
- source_word: τὰ αἰσθητήρια
  choice: 知覚する力
  rationale: 字義的には感覚器官・感覚能力だが、ここでは善悪を見分ける内的な知覚能力の比喩として用いられている。比喩性を残しつつ意味が通る表現とした。
- source_word: γεγυμνασμένα ἐχόντων
  choice: 知覚する力が鍛えられ
  rationale: 完了受動分詞が示す、訓練されて現在その状態にあることを簡潔な日本語で表現する。
- source_word: πρὸς διάκρισιν
  choice: 見分けることができます
  rationale: πρόςが示す目的・到達結果を、日本語では鍛錬の結果としての識別能力が明確になるよう表した。
- source_word: καλοῦ τε καὶ κακοῦ
  choice: 善と悪
  rationale: 道徳的な識別を表す定型的な対句を、そのまま簡潔に訳す。τε καὶの包括性は「善と悪」の並列で自然に表れる。
- source_word: δέ
  choice: しかし
  rationale: 直前の乳を必要とする幼子との対比を明示する。
theological_decisions:
- issue: 霊的成長の文脈における τελείων の意味
  choice: 成熟した人たち
  alternative: 完全な人たち／成人
  rationale: 文脈は未熟な者と識別力の発達した者を対比している。道徳的に無欠な人々という特定の教理を持ち込まず、成長・成熟という含意を保つ。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、聖書本文としての落ち着いた語調を保った。「固い食物」「鍛えられ」という身体的比喩を維持し、成熟と識別の関係を過度に教理化しないようにした。
