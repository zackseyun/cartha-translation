id: HEB.5.7
reference: Hebrews 5:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: ja
  text: キリストは、肉体をもって生きておられた日々に、死から救うことのできる方に、激しい叫びと涙をもって祈りと願いをささげ、その敬虔さのゆえに聞き入れられました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死から救う」は、「死の中から救い出す」、すなわち復活によって救い出すという意味にも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: 肉体で生きておられた日々に
  rationale: σάρξの身体性を保ちながら、直訳調の「肉の日々」を避け、受肉した地上の生涯を現代日本語で自然に表す。
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: 祈りと願い
  rationale: 二つの語を区別しつつ、切迫した祈願を一般読者に明瞭な表現で伝える。
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: 死から救うことのできる方に
  rationale: ἐκ θανάτουが、死を免れさせることとも、死の中から救い出すこととも理解できる余地を本文に残す。
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: 大きな叫びと涙をもって
  rationale: 単数形κραυγήとその強さを保ちつつ、自然で厳粛な日本語とする。
- source_word: προσενέγκας
  choice: ささげ
  rationale: ヘブライ書の祭司的文脈に響く「ささげる」を用いるが、祭儀的意味に限定しない。
- source_word: εἰσακουσθεὶς
  choice: 聞き入れられました
  rationale: 単に音声を聞いたという意味ではなく、祈願が好意的に聞かれたことを表す受動形として訳す。
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: その敬虔さのゆえに
  rationale: εὐλάβειαの畏敬・敬虔という語義を簡潔に表し、「従順」を本文へ明示的に補わない。
theological_decisions:
- issue: ἀπὸ τῆς εὐλαβείαςがキリストについて表す内容
  choice: その敬虔さのゆえに
  alternative: 神を畏れる態度のゆえに／畏敬のゆえに
  rationale: 不適切な恐怖を暗示せず、同時に「従順」という解釈を過度に織り込まず、神への敬虔な畏敬を表す。
- issue: 「死から救う」の範囲
  choice: 死から救う
  alternative: 死を免れさせる／死の中から救い出す
  rationale: ἐκ θανάτουが死の回避と復活による救出のいずれを指すかを本文で限定せず、神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。節が原文では従属的に続く構造であることを踏まえつつ、単独でも読めるよう主語を「キリスト」と明示した。敬語は過剰にせず、「おられた」で尊厳を保った。
