id: HEB.5.5
reference: Hebrews 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: ja
  text: 同じように、メシア[a]も、大祭司となる栄誉を自ら得た[b]のではありません。むしろ、彼にこう語られた方が、それをお与えになったのです。\n\n「あなたはわたしの子。\n今日、わたしはあなたを生んだ。」[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語の Χριστός は「油を注がれた者」という称号である。
    reason: alternative_reading
  - marker: b
    text: 「自らを栄光ある者とした」とも訳せる。ギリシア語の動詞には「栄光を与える」や「誉れを与える」の意味がある。
    reason: lexical_alternative
  - marker: c
    text: 詩篇2:7からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: 同じように、…も
  rationale: 直前に述べられた大祭司の任命との比較を、自然な現代日本語で明確に示す。
- source_word: ὁ Χριστὸς
  choice: メシア
  rationale: ここでは固有名のような用法よりも、神によって任命された職を論じる称号としての働きが前面に出ているため。
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: 自らに栄光を与えたのではありません
  rationale: 再帰的構文と δοξάζω の「栄光を与える」という語義を保つ。「自らを高めた」より原語との対応が明瞭である。
- source_word: γενηθῆναι ἀρχιερέα
  choice: 大祭司となるために
  rationale: 役割・身分に入ることを表す γενηθῆναι と、目的・結果を示す不定詞の関係を簡潔に表す。
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: むしろ、彼にこう語った方が栄光をお与えになったのです
  rationale: ギリシア語で省略されている対照述語を日本語では補い、自分で栄光を得たのではなく、語った方から受けたという論旨を明確にする。「方」によって、引用から神を指すことが分かる一方、本文に神という語を加えてはいない。
- source_word: Υἱός μου εἶ σύ
  choice: あなたはわたしの子
  rationale: 強調された宣言を、簡潔で格調を保った自然な日本語にする。
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: 今日、わたしはあなたを生んだ
  rationale: γεννάω の比喩を解釈的に言い換えず、詩篇引用の表現と神学的緊張を保持する。
theological_decisions:
- issue: Χριστός の称号性
  choice: メシア
  alternative: キリスト
  rationale: 大祭司職への神的任命を論じる文脈では、油注がれた者という称号の意味が生きている。日本語で称号性を明確にするため「メシア」とした。
- issue: 「今日、あなたを生んだ」のキリスト論的含意
  choice: 引用を解釈的に展開せず、そのまま訳す
  alternative: 即位、復活、永遠の生成など特定の出来事・教理を本文で明示する
  rationale: 本文は詩篇2:7を引用しているため、その言葉が持つ解釈上の幅と神学的緊張を保ち、後代の論争を翻訳によって決着させない。
- issue: 省略された対照述語
  choice: 「語った方が栄光をお与えになった」と補う
  alternative: 「むしろ、彼に語った方」と省略をそのまま残す
  rationale: 原文では前節から意味が補われるが、日本語で省略すると文が成立しにくい。補足は自任と神による任命の対照だけを明示し、任命の仕方をそれ以上規定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、詩篇引用は短い行に分けて格調を保った。神への敬意は「方」「お与えになった」で自然に示し、過度に古風な語法や教派的な専門表現は避けた。
