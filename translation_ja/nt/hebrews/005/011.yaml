source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: ja
  text: このことについては、私たちには語るべきことが多く、説明するのも難しいのです[b]。あなたがたが聞くことに鈍くなっているからです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「解き明かすのが難しい」または「解釈するのが難しい」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「聞くことに鈍い」または「聞くのが遅い」とも訳せる。この表現は、教えを受け止める反応が遅く、鈍くなっていることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: このことについて
  rationale: 直前のメルキゼデク個人を指す可能性もあるが、文脈上はキリストの祭司職を含む話題全体を導入すると理解するのが自然。日本語では中性・話題指示の「このこと」が明瞭である。
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: 私たちには語るべきことが多くあります
  rationale: 直訳的な「私たちに多くの言葉がある」ではなく、著者側に詳しく述べる内容が多いという意味を自然な日本語で表した。
- source_word: δυσερμήνευτος λέγειν
  choice: それを説明するのは困難です
  rationale: δυσερμήνευτοςは「解釈しにくい」「説明しにくい」を表す。λέγεινとの組み合わせでは、聞き手に向けて説明する難しさが中心なので「説明するのは困難」とした。
- source_word: ἐπεὶ
  choice: ので
  rationale: 説明が困難である理由を示す因果関係を、自然な現代日本語で表す。
- source_word: νωθροὶ γεγόνατε
  choice: 鈍くなっている
  rationale: νωθρόςの反応の遅さ・怠さと、完了形γεγόνατεが示す、そうした状態に至り現在も続いていることを表す。
- source_word: ταῖς ἀκοαῖς
  choice: 聞くことに
  rationale: 単なる聴覚器官ではなく、教えを受け止める姿勢・働きを指す比喩を保ちながら、現代日本語として理解しやすくした。
theological_decisions:
- issue: Περὶ οὗの指示対象
  choice: 主として、直前から論じられている事柄を指す「このことについて」
  alternative: メルキゼデク個人を指す「この方について」
  rationale: 文法上は男性単数の関係代名詞がメルキゼデクを指す可能性がある。一方、この節は続く広範な教説への導入でもあるため、本文では話題全体を指す表現を採り、個人的指示の可能性を脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、敬体で品位を保った。「聞くことに鈍く」は原文の比喩を保持しつつ、脚注で意味を補った。脚注記号は該当表現の直後に置いた。
