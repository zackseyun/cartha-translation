id: HEB.5.3
reference: Hebrews 5:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: ja
  text: また、このために[a]、民のためにも、自分自身のためにも、罪のための供え物をささげる義務があります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「このために」に当たる語は、直訳すると「それのために」。前節で述べられた大祭司の「弱さ」を指すと考えられます。
    reason: 代名詞の指示対象と原文の表現を説明するため。
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: このために
  rationale: διά＋対格の因果関係を自然な日本語で表しつつ、代名詞の指示内容を本文で過度に限定しない。文脈上は前節の大祭司の「弱さ」を指すと考えられる。
- source_word: ὀφείλει
  choice: しなければなりません
  rationale: 単なる勧めではなく、祭司として負っている義務を明確に表す。
- source_word: καθὼς ... οὕτως καὶ
  choice: …にするのと同じように、…にも
  rationale: 民と大祭司自身を対応させるギリシア語の比較構文を、明瞭で自然な日本語として保持する。
- source_word: τοῦ λαοῦ
  choice: 民
  rationale: レビ記的な大祭司の文脈における契約の民を指す。「イスラエルの民」と説明的に広げず、原文の簡潔さを保つ。
- source_word: περὶ αὑτοῦ
  choice: 自分自身のためにも
  rationale: 再帰的な意味を明確にし、民のための行為との対比を保つ。
- source_word: προσφέρειν
  choice: ささげる
  rationale: 祭儀的文脈で供え物やいけにえをささげることを表すが、原文に明示されていない目的語を本文へ補わない。日本語では目的語の省略が自然である。
- source_word: περὶ ἁμαρτιῶν
  choice: 罪のために
  rationale: 罪に関して行う祭儀的なささげ物を簡潔に表す。「罪のいけにえとして」と限定して原文以上に特定することを避ける。
theological_decisions:
- issue: 「このために」が指す内容
  choice: 本文では「このために」とし、前節の大祭司の弱さを指す可能性を注で示す。
  alternative: 本文で「この弱さのために」と明示する、または祭司の職務・状況全般を指すと取る。
  rationale: 直近の女性名詞は前節のἀσθένεια（弱さ）であり、文脈上もっとも自然な指示対象である。ただし、原文の代名詞が持つ簡潔さとわずかな余地を本文では保持する。
- issue: προσφέρεινの目的語
  choice: 「ささげる」とし、目的語を補わない。
  alternative: 「ささげ物をする」または「いけにえをささげる」とする。
  rationale: 祭儀的なささげ物が文脈上明白である一方、この節のギリシア語には目的語が明示されていない。日本語では省略しても自然であり、原文への忠実さと可読性を両立できる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭司的文脈にふさわしい落ち着いた敬体とした。「民」と「自分自身」の対応を保ち、原文にない目的語は補わなかった。
