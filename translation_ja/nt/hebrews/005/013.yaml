  source_fidelity: πᾶς γὰρ ὁ μετέχων γάλακτος is accurately represented by「乳を口にしている者は皆」without adding the idea that milk is the person's only nourishment. 「義のことばに不慣れ」appropriately conveys ἄπειρος λόγου δικαιοσύνης as lack of familiarity or proficiency rather than total ignorance. 「その人は幼子だからです」faithfully retains the generic singular and the explanatory force of the second γάρ.
