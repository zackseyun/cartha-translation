id: HEB.5.13
reference: Hebrews 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: ja
  text: というのも、乳を口にしている者は皆、義のことば[a][b]に不慣れです。その人は幼子だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義についてのことば」または「義の教え」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「義」は「正義」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: …者は皆
  rationale: 冠詞付き分詞による一般的な人物類型を、日本語で自然な総称表現として示した。πᾶςの配分的な意味も「皆」で保持している。
- source_word: μετέχων γάλακτος
  choice: 乳を口にしている
  rationale: 乳を摂取する比喩を保ちつつ、「乳だけで生きている」とまでは限定しない表現とした。継続的な状態を「している」で示した。
- source_word: ἄπειρος
  choice: 不慣れ
  rationale: 全面的な無知ではなく、経験や習熟の不足を表す語であり、「ことばに不慣れ」は現代日本語として自然である。
- source_word: λόγου δικαιοσύνης
  choice: 義のことば
  rationale: 属格の関係を狭く確定せず、原文の簡潔さと「義に関することば／義をもたらすことば」などの解釈可能性を保持した。
- source_word: νήπιος
  choice: 幼子
  rationale: 未成熟さを示す乳の比喩とのつながりを保つ。広い年齢を指し得る「子ども」より原語の鋭さがあり、「乳児」ほど医学的・年齢限定的ではない。
- source_word: γάρ ... γάρ
  choice: というのも…だからです
  rationale: 二つのγάρが示す説明関係を、文頭の接続表現と文末の理由表現で自然に再現した。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 正義
  rationale: 文脈上、霊的成熟や教えに関わる広い神学的・倫理的意味を保持するため「義」を本文に採用した。「正義」という意味の可能性は脚注に残した。
- issue: λόγου δικαιοσύνηςにおける属格の関係
  choice: 義のことば
  alternative: 義についてのことば／義の教え
  rationale: 原文は属格の関係を明示していないため、本文では曖昧さを保つ簡潔な表現とし、より説明的な訳を脚注に示した。
- issue: νήπιοςの一般称と文法上の性
  choice: その人は幼子
  alternative: 彼は幼子
  rationale: ギリシア語の男性単数形は一般称として用いられている。日本語では性を明示しない「その人」が一般称として自然であり、指示対象を限定せず原文の単数性を保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、乳と幼子の比喩、二重の説明構造、λόγου δικαιοσύνηςの解釈上の幅を保持した。「不慣れです」により断定的な非難を避けつつ、習熟していない状態を端的に表した。
