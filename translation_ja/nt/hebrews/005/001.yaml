reference: Hebrews 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: ja
  text: というのも、大祭司はだれでも、人々の中から選ばれ、人々のために、神に関わる事柄について任命されます。それは、罪のために供え物といけにえを献げるためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: 大祭司はみな
  rationale: 単数形による総称的・分配的な表現を、現代日本語で自然に表した。「γὰρ」は前文を受ける説明の接続詞だが、日本語では節冒頭に「というのは」を置くより、文脈上省略するほうが自然であり、説明関係は保たれる。
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: 人々の中から選び取られ
  rationale: 受動分詞の意味を保持しつつ、祭司が同じ人間の中から取り分けられることを明確にした。「選び取る」は文脈に適するが、正式な任命は後続の καθίσταται が担う。
- source_word: ὑπὲρ ἀνθρώπων
  choice: 人々のために
  rationale: ὑπέρ の代理・利益の意味を簡潔に表す。日本語の「人々」は性別を不必要に限定せず、ἀνθρώπων の一般的な人間への言及を自然に伝える。
- source_word: καθίσταται
  choice: 任命されます
  rationale: 祭司職に就けられるという制度的意味を、明瞭で自然な敬体で表した。
- source_word: τὰ πρὸς τὸν θεόν
  choice: 神に関する事柄を担う者として
  rationale: この慣用句が示す、神への礼拝や奉仕に関わる務めを、過度に限定せず表した。
- source_word: ἵνα προσφέρῃ
  choice: 献げるためです
  rationale: ἵνα と接続法が示す任命の目的を明確にした。προσφέρω の祭儀的用法には「献げる」が適切である。
- source_word: δῶρά τε καὶ θυσίας
  choice: 供え物といけにえ
  rationale: 二つの祭儀用語を区別して保持した。τε καὶ は日本語では単純な「と」で自然に両者を結べる。
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: 罪のために
  rationale: 犠牲を献げる文脈で、罪に関して、また罪への対処のために献げるという意味を、原文同様に簡潔かつ一定の幅を残して表した。
theological_decisions:
- issue: ἀνθρώπων の代表的・包括的範囲
  choice: 二箇所とも「人々」とする
  alternative: 「男たち」または「人間」とする
  rationale: 歴史上の大祭司職が男性に限られていたことは文脈上明らかだが、ἀνθρώπων はここで、祭司が人間の中から取られ、人間のために仕えることを対比的に述べる。「男たち」とすると受益者まで男性に限定する誤解を招くため、現代日本語では「人々」が原文の代表的用法を最も自然に伝える。
- issue: ὑπὲρ ἁμαρτιῶν の意味範囲
  choice: 「罪のために」とする
  alternative: 「罪を贖うために」と明示する
  rationale: 祭儀的文脈は贖罪との関係を示すが、この句そのものは「贖う」という動詞を含まないため、神学的意味を先取りして限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語の敬体。祭儀用語として「大祭司」「供え物」「いけにえ」「献げる」を用い、一般読者にも理解できる表現にした。原文の長い一文は二文に分け、目的関係を明確にした。
