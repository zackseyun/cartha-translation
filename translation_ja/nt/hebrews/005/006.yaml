  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: ja
  text: '同じように、別の箇所でもこう言われています。


    「あなたは、メルキゼデクの位に従って、とこしえに祭司である。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς καὶ
  choice: また、…でも
  rationale: 前節の引用に並ぶ第二の聖書引用であることを、自然な現代日本語で示す。καθώςの対応関係とκαίの追加の意を文脈に即して表した。
- source_word: ἐν ἑτέρῳ
  choice: 別の箇所
  rationale: ギリシア語では「別のものに」と名詞が省略されているが、ここでは別の聖書箇所を指すため、自然に補った。
- source_word: λέγει
  choice: こう言われています
  rationale: 原文には明示的な主語がない。神が聖書を通して現在語るという響きを保ちつつ、日本語で主語を不必要に特定しない表現とした。
- source_word: Σὺ ἱερεὺς εἰς τὸν αἰῶνα
  choice: あなたは、とこしえに祭司である
  rationale: 直接の呼びかけと、永続する祭司職を簡潔かつ荘重に表した。「とこしえに」は引用文にふさわしく、現代の読者にも理解できる。
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: メルキゼデクの位に従う祭司である
  rationale: τάξιςが示す定められた地位・序列・類型を「位」で表し、「従う」によってκατάの基準・対応関係を保持した。日本語の「教団・修道会」のように誤解されやすい「祭司の一団」という含意を避けた。
theological_decisions:
- issue: 引用導入句λέγειの話者
  choice: 「こう言われています」とし、話者を明示しない
  alternative: 「神はこう言われます」または「聖書にはこうあります」
  rationale: ヘブライ書では聖書の言葉が現在の発言として提示される一方、この節のギリシア語自体は主語を明示しない。受動表現により、その神学的含みを残しながら原文以上に話者を特定しない。
- issue: τάξιςの意味
  choice: 「位」と訳し、メルキゼデクに対応する祭司としての地位・類型を示す
  alternative: 「位階」「秩序」「型」「様式」
  rationale: 文脈上、単なる振る舞い方ではなく、メルキゼデクに結び付く祭司職の区分・類型が論じられる。「位」は伝統的な聖書語法との連続性を持ちつつ、「秩序」より自然で、「型」ほど解釈を狭めない。
translation_notes:
  register: 明瞭な現代標準語を基調とし、詩編からの引用には「とこしえ」「祭司」という簡潔で荘重な語を用いた。引用部は意味上の二行に分け、後半で補われる述語を明示した。固有名は日本語聖書で一般的な「メルキゼデク」とした。
