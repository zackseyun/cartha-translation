  text: καίπερ ὢν υἱός, ἔμαθεν ἀφ’ ὧν ἔπαθεν τὴν ὑπακοήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/008.yaml
  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: ja
  text: 御子でありながら[a]、苦しんだことを通して従順を学ばれた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「子でありながら」。ギリシア語の「子」には冠詞がないが、日本語では冠詞の有無を区別しない。ここでは文脈上、イエスの御子としての身分を指す。
    reason: alternative_reading
  - marker: b
    text: 「従順を学ばれた」とは、苦しみを実際に経験する中で従順を学ばれたということであり、それ以前に不従順であったことを必ずしも意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: でありながら
  rationale: 譲歩の意味を表し、御子という身分と、苦しみを通して従順を学んだこととの対照を、自然で簡潔な日本語にする。
- source_word: ὢν υἱός
  choice: 御子であり
  rationale: 分詞句を日本語の自然な譲歩構文に組み込んだ。冠詞の有無を文法的に示さない日本語では、「御子」が文脈上のイエスの子としての身分を明確に表す。
- source_word: ἔμαθεν
  choice: 学ばれた
  rationale: μανθάνωの直接的な意味である「学ぶ」を保ち、神学的な難しさを言い換えで解消しない。敬語形は御子への言及にふさわしい現代日本語の聖書的な文体を保つ。
- source_word: ἀφ’ ὧν ἔπαθεν
  choice: 苦しんだことを通して
  rationale: 受けた苦しみが従順を経験的に学ぶ契機・経路となったことを、明瞭で自然な日本語で表す。
- source_word: τὴν ὑπακοήν
  choice: 従順
  rationale: 神の意志に聞き従うことを表すὑπακοήの基本的な意味を保つ。日本語では抽象名詞に定冠詞相当の表現を加えないのが自然である。
theological_decisions:
- issue: 御子の身分と、従順を学んだこととの関係
  choice: 御子でありながら
  alternative: 子であったにもかかわらず
  rationale: イエスが御子であることと、苦しみを通して現実に従順を学ばれたことの双方を、その緊張を弱めずに示す。「御子」は文脈上のキリスト論的な指示を自然に伝える。
- issue: 「従順を学ばれた」が以前の不従順を意味するか
  choice: 本文では「従順を学ばれた」をそのまま保持する
  alternative: 従順に伴う代価を身をもって知った
  rationale: 原文は明確に「従順を学んだ」と述べるため、解釈的な言い換えで緊張を取り除かない。注で、苦しみを実際に経験する中での学びであり、以前の不従順を矯正したという意味に限定されないことを示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「御子」「学ばれた」によって礼節と品位を保った。「でありながら」は簡潔で自然な譲歩表現であり、原文の神学的な対照を保持する。
