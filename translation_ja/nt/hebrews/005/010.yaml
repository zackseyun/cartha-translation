base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: ja
  text: そして、神によって、メルキゼデクの位に従う大祭司と呼ばれたのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神によって、メルキゼデクの位に従う大祭司と名づけられた」または「神によって、メルキゼデクの位に従う大祭司に任命された」。
    reason: lexical_alternative
  - marker: b
    text: 詩篇110:4を踏まえています。そこでは祭司について「メルキゼデクの位に従って」と言われています。
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: 呼ばれた
  rationale: アオリスト受動分詞で、神がイエスを大祭司として公に名指しし、宣言したことを表す。「任命された」も可能だが、原語以上に就任の意味を強めるおそれがあるため、受動態と語義の幅を保つ「呼ばれた」とした。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 神によって
  rationale: ὑπό＋属格による受動構文の行為者をそのまま示す。「父なる神」とは補わない。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: ἀρχιερεύςの標準的な訳語であり、ヘブライ人への手紙における祭司論との連続性も明瞭である。
- source_word: κατὰ τὴν τάξιν
  choice: 位に等しい
  rationale: 詩篇110:4を踏まえた定型句で、同一の祭司的な類型・身分に対応することを自然な日本語で表す。「位」は単なる順序ではなく、祭司としての類型や秩序を指す。
- source_word: Μελχισέδεκ
  choice: メルキゼデク
  rationale: 固有名詞の日本語における標準的な音写を用いた。
theological_decisions:
- issue: 分詞が単なる呼称・宣言を表すか、正式な任命を表すか
  choice: 神によって…大祭司と呼ばれた
  alternative: 神によって…大祭司に任命された
  rationale: προσαγορεύωは呼称・名指し・宣言を表し得るため、制度的な就任をより強く示す「任命」へ限定せず、原文の幅と神による公的宣言の含みを保った。
- issue: κατὰ τὴν τάξιν Μελχισέδεκ における τάξις の意味
  choice: メルキゼデクの位に等しい
  alternative: メルキゼデクの系統に属する／メルキゼデクの型に従う
  rationale: 血統的な祭司系譜を意味すると誤解されないよう「系統」を避けつつ、詩篇110:4との結びつきと、メルキゼデクに対応する祭司的な位・類型を保った。
translation_notes:
  register: 明瞭で現代的かつ格調を保った日本語。「そして」で前節からの分詞構文のつながりを示した。引用符によって、神が与えた呼称の内容を読み取りやすくした。
