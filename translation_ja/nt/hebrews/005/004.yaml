source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: ja
  text: だれもこの栄誉を自ら受けるのではなく[a]、神に召されて受けるのです。アロンも同じように神に召されました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その栄誉」。文脈では、大祭司としての尊い身分や務めを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ... τις
  choice: だれも…のではなく
  rationale: 否定辞と不定代名詞の組み合わせを、自然な日本語の全称否定として表した。
- source_word: ἑαυτῷ ... λαμβάνει
  choice: 自分で手にする
  rationale: 栄誉を自ら獲得・取得するという対格的な意味を自然に示し、神による召しとの対照を保った。
- source_word: τὴν τιμήν
  choice: この栄誉
  rationale: 直訳的な「その栄誉」が指す、直前の文脈にある大祭司の尊い身分を、名詞を「職」に限定せず明瞭に表した。
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: 神に召される
  rationale: 受動分詞の神的な動作主を保ちつつ、日本語では文の述語として自然に補った。
- source_word: καθώσπερ καὶ Ἀαρών
  choice: アロンもそうであったように
  rationale: 比較と「も」の意味を保ち、省略されている「召された」を「そうであった」で自然に受けた。
theological_decisions:
- issue: 祭司の栄誉と神の召しの関係
  choice: 人が栄誉を自ら手にするのではなく、神に召されるという対照として訳す
  alternative: 「神に召されたときにのみ、この栄誉を受ける」と条件を明示する
  rationale: 文脈上は祭司職への任命が問題だが、原文の分詞が持つ関係を「ときにのみ」と限定的に解釈せず、簡潔な対照のまま残した。
- issue: τιμήの指示内容
  choice: 「栄誉」とし、祭司の職そのものとは訳し切らない
  alternative: 「祭司の職」または「この尊い務め」
  rationale: 直前の文脈から大祭司の尊厳・身分を指すが、語そのものは「職」ではないため、文脈的含意と語義の幅をともに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「栄誉」「召される」によって聖書本文にふさわしい品位を保った。「召される」は一般読者にも理解できる範囲の伝統的表現であり、神が任命の主体であることを簡潔に示す。
