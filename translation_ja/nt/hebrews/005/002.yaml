id: HEB.5.2
reference: Hebrews 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: ja
  text: 無知で、道を踏み外している人々[a]に、穏やかに接することができます。彼自身もまた、弱さに取り囲まれているからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「迷わされている人々」。ギリシア語の分詞は受動的な意味にも理解できます。
    reason: lexical_alternative
  - marker: b
    text: 直訳「弱さを身にまとっている」、または「弱さに囲まれている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: 穏やかに接する
  rationale: 感情に流されず、厳しすぎも無関心でもない節度ある対応を表す。現代日本語として自然であり、「あわれむ」ほど感情面に限定しない。
- source_word: δυνάμενος
  choice: ことができます
  rationale: 大祭司がそのように対応できる継続的な能力を表す分詞を、明瞭な日本語の述語として訳した。
- source_word: τοῖς ἀγνοοῦσι
  choice: 無知で……いる人々に
  rationale: 知らずにいる者という分詞の意味を保ちつつ、固定的な階層名のように響かない表現とした。文脈上、単なる知識不足に限定せず、過ちに関する無知を含み得る。
- source_word: πλανωμένοις
  choice: 道を踏み外している
  rationale: 正しい道からそれているという比喩的意味を自然な現代日本語で表した。受動的ニュアンスの可能性は脚注に残した。
- source_word: ἐπεὶ
  choice: からです
  rationale: 大祭司が穏やかに接することのできる理由を示す因果関係を明確にした。
- source_word: καὶ αὐτὸς
  choice: 彼自身もまた
  rationale: αὐτόςの強調とκαίの付加的な意味の両方を保った。
- source_word: περίκειται ἀσθένειαν
  choice: 弱さに取り囲まれている
  rationale: 人間的な弱さが大祭司を包んでいるという原文の比喩を保ち、身体的または道徳的な弱さのどちらか一方に限定しなかった。
theological_decisions:
- issue: ἀγνοοῦσι καὶ πλανωμένοιςが示す人々の過ちの性質
  choice: 無知で、道を踏み外している人々という広い表現
  alternative: レビ記の制度における過失の罪だけを指す専門的表現
  rationale: 祭司制度上の過失の罪を想起させるが、ギリシア語自体はそれだけに限定されないため、一般性を保った。
- issue: 大祭司に関するἀσθένειαの意味
  choice: 身体面・道徳面を含み得る人間的な「弱さ」
  alternative: 身体的弱さのみ、または道徳的弱さのみ
  rationale: 原文が意味の範囲を限定していないため、「弱さ」として神学的な幅と緊張を残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文の二つの分詞を一つの人々を描く表現としてまとめ、節度ある対応と、人間的弱さに包まれた状態との因果関係を自然に示した。
