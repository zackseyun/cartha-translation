source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: ja
  text: '金銭を愛さない生き方をし、今あるもので満足しなさい。[a] 神ご自身がこう言われていますからです。


    「わたしは決してあなたを見放さず、[b]


    　決してあなたを見捨てない。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「今あるものによって満足しなさい」。現在持っている物や、今置かれている状況を含みうる表現です。
    reason: lexical_alternative
  - marker: b
    text: この引用は、申命記31章6、8節やヨシュア記1章5節など、旧約聖書にある神の約束を反映しています。
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος ὁ τρόπος
  choice: 金銭を愛さない生き方をし
  rationale: ἀφιλάργυροςの焦点である金銭への愛着の否定を保ち、ὁ τρόποςを生活のあり方として自然な現代日本語で表した。
- source_word: ἀρκούμενοι τοῖς παροῦσιν
  choice: 今あるもので満足しなさい
  rationale: 分詞の勧告的な働きを明確にし、τοῖς παροῦσινを所有物だけに狭めず、現在与えられているものを指しうる表現にした。
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: ご自身がこう言っておられるからです
  rationale: αὐτόςの強調を「ご自身」で示し、本文にない「神」を補わなかった。完了形は、語られた言葉が今も効力を持つことを「言っておられる」で表した。
- source_word: Οὐ μή σε ἀνῶ
  choice: わたしは決してあなたを見放さず
  rationale: οὐ μήの強い否定を「決して」で表し、ἀνίημιを文脈に即して「見放す」とした。
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: 決してあなたを見捨てない
  rationale: 繰り返される強い否定を保持し、ἐγκαταλείπωの「置き去りにする、見捨てる」という意味を荘重で自然な日本語にした。
theological_decisions:
- issue: 引用文の話者の明示
  choice: 「神」を補わず、「ご自身」とする
  alternative: 「神ご自身がこう言っておられる」
  rationale: 文脈上の話者は神だが、ギリシャ語本文はθεόςではなくαὐτόςを用いるため、指示対象を本文で明示的に追加しない。
- issue: 引用文における強意否定
  choice: 二つの節のそれぞれに「決して」を置く
  alternative: 「断じてあなたを見放したり、見捨てたりしない」
  rationale: 二度のοὐ μήが与える確かな保証と反復を、自然な日本語の範囲で保持した。
- issue: 二つの動詞の訳し分け
  choice: ἀνῶを「見放す」、ἐγκαταλίπωを「見捨てる」とする
  alternative: 「離れず、見捨てない」
  rationale: 両語の意味の重なりを残しつつ、日本語でも二重の保証として読めるようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、引用文は神の確かな約束にふさわしい荘重さを保った。「ご自身」は前の文脈を受ける日本語として成立し、原文にない話者名の補足を避けている。
