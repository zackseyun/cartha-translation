  rationale: 不必要な数量表現「一つの」を除き、原文の非限定的な「祭壇」を保ちました。「幕屋で奉仕する人々」によりλατρεύωの祭儀的用法を自然な日本語で表し、代名詞「そこから」によってἐξ οὗの起点を明瞭にしました。注釈の内容は原文が祭壇の指示対象を特定しないことを保っており、アンカーのみ対象語に近づけました。
