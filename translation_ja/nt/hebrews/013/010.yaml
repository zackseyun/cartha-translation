  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: ja
  text: 私たちには祭壇[b]があります。幕屋で奉仕する人々[a]には、そこから食べる権利がありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幕屋で奉仕する人々」とも訳せます。旧契約の聖所で祭儀に携わる人々を指します。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「祭壇」が具体的に何を指すかについては、キリストご自身、十字架、天の祭壇、またはキリストのささげ物による恵みなど、さまざまな解釈があります。ギリシア語本文はここでは特定していません。
    reason: alternative_reading
lexical_decisions:
- source_word: θυσιαστήριον
  choice: 祭壇
  rationale: 通常の意味をそのまま訳し、ここでキリスト、十字架、いけにえなど特定の解釈に置き換えない。
- source_word: ἐξ οὗ
  choice: その祭壇から
  rationale: ἐκと関係代名詞が示す起点を明確にし、祭壇から食べるという比喩を保つ。日本語では先行詞を補うほうが自然である。
- source_word: φαγεῖν
  choice: 食べる
  rationale: 不定詞の基本的な意味を簡潔に表す。
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: 権利は……ありません
  rationale: ἐξουσίαがここで表す、正式に認められた参与の資格・権利がないことを自然な日本語で示す。
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: 幕屋で仕えている人々
  rationale: λατρεύωの礼拝儀礼上の奉仕という意味を「仕える」で表し、σκηνήはヘブライ人への手紙の文脈に沿って「幕屋」とする。
- source_word: ἔχομεν
  choice: 私たちには……あります
  rationale: 著者と読者を含む現在の所有・参与を、自然な現代日本語で表す。
theological_decisions:
- issue: 「祭壇」が具体的に何を指すか
  choice: 本文では「祭壇」という比喩を限定せずに保つ。
  alternative: キリストご自身、十字架、天の祭壇、またはキリストのささげ物による恵みを指すと明示する。
  rationale: ギリシア語本文は指示対象をここで特定しておらず、解釈も分かれるため、本文で神学的緊張を解消しない。
- issue: 「幕屋で仕えている人々」の範囲
  choice: 旧契約の聖所で祭儀に携わる者を指す表現として訳す。
  alternative: 一般的に礼拝するすべての人を指すと取る。
  rationale: σκηνήとλατρεύωの組み合わせ、およびヘブライ人への手紙の祭儀的文脈は、幕屋における奉仕を示す。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「一つの」は不定性を自然に示し、「幕屋」は聖書文脈で定着した語として用いた。二文に分け、長い関係節を日本語として読みやすくした。
