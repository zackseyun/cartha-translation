reference: Hebrews 13:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: ja
  text: あらゆる良いものをもってあなたがたを備え、そのみこころを行うことができるようにしてくださいますように。また、イエス・メシアを通して、御前に喜ばれることを私たちのうちに行ってくださいますように。この方[a]に、栄光が世々限りなくありますように。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この方」は、直前のイエス・メシアを指すとも、この祈りの主語である平和の神を指すとも理解できる。
    reason: 原文の関係代名詞の指示対象に曖昧さがあるため。
lexical_decisions:
- source_word: καταρτίσαι
  choice: 整え
  rationale: 必要なものを備えて目的にかなう状態にする、という祈願の意味を、現代日本語で簡潔かつ品位ある表現にした。
- source_word: ἐν παντὶ ἀγαθῷ
  choice: あらゆる良いものをもって
  rationale: 直訳的な「あらゆる良いもののうちに」より自然であり、神が従順のために必要な良いものを与えて整えるという手段・備えの含意を表す。
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: そのみこころを行わせて
  rationale: 目的を表す不定詞構文を保ちつつ、日本語の祈願文として自然にした。「みこころ」は神の意志を表す一般的で格調ある語。
- source_word: ποιῶν ἐν ἡμῖν
  choice: 私たちのうちに行ってくださいますように
  rationale: 神が信じる者たちの内で働くという最も自然な理解を採り、分詞の継続的な神の働きを祈願文の流れの中で表した。
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: 御前に喜ばれること
  rationale: 神の評価の前で喜ばしいもの、という関係的・評価的意味を自然な日本語で保持した。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを通して
  rationale: διάの媒介的意味を「通して」で表し、Χριστόςはここで称号としての力を保つため「メシア」とした。
- source_word: ᾧ ἡ δόξα
  choice: この方に、栄光が
  rationale: 関係代名詞による頌栄を日本語として自然に表しつつ、指示対象を本文だけで明示し切らず、注で原文の曖昧さを示した。
- source_word: εἰς τοὺς αἰῶνας
  choice: 世々限りなく
  rationale: 終わりのない時間を表す定型的かつ格調ある日本語で、複数形の「時代」の響きもある程度保った。
theological_decisions:
- issue: 頌栄の関係代名詞ᾧが指す相手
  choice: 本文では「この方」とし、指示対象を固有名で確定しない
  alternative: 直前の「イエス・メシア」を指す、または祈りの主語である神を指す
  rationale: 文法上は直前のイエス・メシアを指し得る一方、祈願全体の主語である神を受けるとも理解できる。原文が許す神学的緊張を本文と注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祝祷にふさわしい品位を保った。「みこころ」「御前」「世々限りなく」は一般読者にも理解可能な礼拝的表現として採用した。
