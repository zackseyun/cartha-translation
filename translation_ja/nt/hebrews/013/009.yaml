source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: ja
  text: さまざまで異質な教えに流されてはなりません。心は食物によってではなく、恵みによって確かなものとされるのがよいからです。[a] 食物に関わる実践をしていた人たちは、それによって益を受けなかったのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心が恵みによって強められるのがよい」とも訳せます。「確かなものとされる」と訳したギリシア語には、「強める」「確立する」「堅固にする」という意味があります。
    reason: lexical_alternative
  - marker: b
    text: 「食物に関わる実践をしていた」は、直訳すれば「食物の中を歩んでいた」です。食物を生活上・宗教上の実践のよりどころとしていたことを指すと考えられますが、「食物」が具体的にどのような食事や規定を指すかは、原文では明示されていません。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: さまざまな異質の教え
  rationale: ποικίλαις の多様性と ξέναις の「よそに属する、なじみのない」という警告的な含みを保つ。「異端」などの後代的な分類語は避けた。
- source_word: μὴ παραφέρεσθε
  choice: 流されてはなりません
  rationale: 受動態の「運び去られる」という比喩と、継続的に警戒させる禁止の響きを自然な現代日本語で表した。
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: 心が確かなものとされるのは、恵みによる
  rationale: βεβαιοῦσθαι の「確立する、堅固にする」という意味を「確かなものとされる」で表し、受動態を保持した。χάριτι は手段を示す与格として「恵みによる」とした。
- source_word: οὐ βρώμασιν
  choice: 食物によってではなく
  rationale: βρώμασιν を解釈的に「食物規定」と広げず、原文どおり「食物」とした。
- source_word: ἐν οἷς οἱ περιπατοῦντες
  choice: 食物に従って歩んだ人たち
  rationale: περιπατεῖν の歩行比喩を残しながら、ἐν οἷς が食物を指すことを日本語で理解できる形にした。生活実践として食物に関わる含みはあるが、その具体的範囲は限定しない。
- source_word: οὐκ ὠφελήθησαν
  choice: それによって益を受けませんでした
  rationale: アオリスト受動態を反映し、食物を手段とした実践が有益ではなかったという評価を明確にした。
theological_decisions:
- issue: 「食物」が指す範囲と「恵み」との対比
  choice: 本文では「食物」とだけ訳し、恵みによる心の確立との対比を保つ
  alternative: 食物規定、儀礼的な食事、いけにえの食事
  rationale: 文脈上は食物に関する宗教的実践が想定されうるが、βρώμασιν 自体は単に「食物」であり、本文で特定の制度や儀礼に限定しない。
- issue: 「心」の比喩的意味
  choice: 心
  alternative: 内面、精神、思い
  rationale: καρδία の聖書的・人間論的な広がりを保ち、「知性」や「感情」だけに狭めない。
- issue: βεβαιοῦσθαι の意味幅
  choice: 確かなものとされる
  alternative: 強められる、堅くされる
  rationale: 心が恵みによって安定・確立される意味を示しつつ、語が持つ「強める」と「確立する」の幅を脚注で提示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。禁止命令は丁寧体の「〜てはなりません」とし、原文の比喩と神学的用語である「恵み」「心」を保持した。脚注記号は該当する文の直後に配置した。
