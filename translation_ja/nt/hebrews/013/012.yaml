  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: ja
  text: それゆえ、イエスも、ご自分の血によって民を聖なるものとするために[a]、門の外で[b]苦しみを受けました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖別する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「門の外」は、イエスが苦しみを受けたエルサレムの外の場所を指すと考えられ、直前の文脈で、いけにえの動物のからだが宿営の外で焼かれることと呼応している。
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: それゆえ
  rationale: 直前の議論から結論を導く接続語として、推論のつながりを明確かつ格調を保って示す。
- source_word: καὶ
  choice: も
  rationale: 先に述べられたいけにえの型とイエスとの対応を、過度に強調せずに表す。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語で定着した人名表記。
- source_word: ἵνα ἁγιάσῃ
  choice: 聖なるものとするために
  rationale: ἵναと接続法が示す目的を保ち、ἁγιάζωの祭儀的・契約的意味を一般の読者にも分かる現代語で表す。
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: ご自分の血によって
  rationale: 属格を伴うδιάの手段の意味と、ἰδίουによる『自分自身の』という強調を保持する。
- source_word: τὸν λαόν
  choice: 民
  rationale: 定冠詞を伴うλαόςの契約共同体を指す含みを保ちつつ、原文にない『神の』を補わない。
- source_word: ἔξω τῆς πύλης
  choice: 門の外で
  rationale: 単数形の『門』を保ち、『町の』や『エルサレムの』を本文に補わない。
- source_word: ἔπαθεν
  choice: 苦しみを受けました
  rationale: πάσχωのアオリストを自然な日本語で簡潔に表し、受難を指す意味を保持する。
theological_decisions:
- issue: 祭儀的文脈におけるἁγιάζωの訳し方
  choice: 聖なるものとする
  alternative: 聖別する
  rationale: ヘブライ人への手紙の祭儀的意味を保ちながら、特定教派の聖化論に限定せず、現代の一般読者にも理解しやすくした。
- issue: τὸν λαόνの範囲
  choice: 民
  alternative: 神の民
  rationale: 文脈上は神の契約の民が想定されるが、ギリシア語本文には『神の』がないため、解釈的な補足を本文に加えない。
- issue: 『門の外』の指示対象
  choice: 門の外
  alternative: エルサレムの城門の外
  rationale: イエスが苦しみを受けたエルサレム郊外を示唆するが、原文の曖昧さと直前の宿営外のいけにえとの響き合いを保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、本文は丁寧体で統一した。祭儀的な含意は保ちつつ、専門用語だけに頼らない表現とした。
