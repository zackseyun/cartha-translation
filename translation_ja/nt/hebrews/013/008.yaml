base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: ja
  text: イエス・メシアは、昨日も今日も、また永遠に同じ方です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエス・キリストは、昨日も今日も、また永遠に同じ方です」。ギリシア語の称号「クリストス」は、「メシア」と訳すことも、「キリスト」と音写することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: イエス
  rationale: ギリシア語の人名を、日本語で定着した形に音写した。
- source_word: Χριστὸς
  choice: メシア
  rationale: 固定した姓のように扱わず、「油注がれた者」という称号の働きを示す訳語とした。日本語として自然な複合形「イエス・メシア」を用いた。
- source_word: ἐχθὲς
  choice: 昨日
  rationale: 時間を表す副詞を直訳し、時間的連続を示す三項構成を保った。
- source_word: σήμερον
  choice: 今日
  rationale: 「昨日」と対応する時間表現として、そのまま訳した。
- source_word: ὁ αὐτός
  choice: 変わることがありません
  rationale: 直訳は「同じ方」であるが、過去・現在・永遠にわたる不変性を明瞭で自然な現代日本語で表した。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永遠に
  rationale: 時代を越えて永久に続くことを表す慣用句として、簡潔で自然な日本語にした。
- source_word: καὶ ... καὶ ... καὶ
  choice: も……も、そして
  rationale: ギリシア語の反復によるリズムと強調を、日本語で自然な並列表現に移した。
theological_decisions:
- issue: 時間を越えたイエスの恒常性が持つキリスト論的意味
  choice: イエス・メシアが昨日、今日、永遠に変わらないことを、そのまま述べる。
  alternative: この句を神性または本性の不変性についての明示的な教理説明へ展開する。
  rationale: 原文は強いキリスト論的含意を持つが、何がどの意味で「同じ」であるかを説明してはいないため、訳文では教理的な補足を加えず、その緊張を保った。
- issue: Χριστόςを称号として訳すか、慣用的な音写で示すか
  choice: メシア
  alternative: キリスト
  rationale: 原語の称号としての意味を読者に伝えることを優先した。ただし、日本語で広く定着した「キリスト」も脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「変わることがありません」により、原文で省略された繋辞を補いつつ、ὁ αὐτόςの意味を自然に表現した。
