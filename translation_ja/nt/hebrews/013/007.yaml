  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: ja
  text: あなたがたに神のことばを語った指導者たちを覚えていなさい。彼らの生き方の結末[a]をよく考え、彼らの信仰[b]に倣いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「結末」は「結果」または「終わり」とも訳せる。指導者たちの死に方を特に指すと解することもある。
    reason: lexical_alternative
  - marker: b
    text: または「忠実さ」。ギリシア語は「信仰」と「忠実さ」のどちらの意味にもなりうる。
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: 覚えていなさい
  rationale: 現在命令形の継続的な含みを保ちつつ、現代日本語として自然な勧告にした。単に一度思い出すのではなく、心に留め続ける意味を表す。
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: あなたがたの指導者たち
  rationale: 共同体の中で認められた指導者を指す。「支配者」では政治的・権威主義的な響きが強いため避け、実際の指導的立場を自然に表した。
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: あなたがたに神のことばを語った
  rationale: λαλέωを素直に「語った」とし、τὸν λόγον τοῦ θεοῦの属格表現を一般的な聖書用語である「神のことば」とした。
- source_word: ἀναθεωροῦντες
  choice: よく見つめ
  rationale: 注意深く観察し、考察する意味を、簡潔で自然な日本語にした。視覚的に見るだけでなく、深く省みる含みを持つ。
- source_word: τὴν ἔκβασιν τῆς ἀναστροφῆς
  choice: 彼らの生き方の結末
  rationale: ἔκβασιςの「結果・行き着くところ・終わり」と、ἀναστροφήの「行い・生き方」を簡潔に表した。死や殉教に限定せず、語の幅は脚注で示す。
- source_word: μιμεῖσθε
  choice: 倣いなさい
  rationale: 直接的な命令を保ちつつ、「模倣しなさい」より自然で品位のある現代日本語とした。
- source_word: τὴν πίστιν
  choice: その信仰
  rationale: πίστιςの基本訳として「信仰」を採用した。ただし、人について用いられるこの文脈では「忠実さ」も可能なので、脚注に残した。
theological_decisions:
- issue: 模範とすべきπίστιςが「信仰」か「忠実さ」か
  choice: 信仰
  alternative: 忠実さ
  rationale: この文脈では指導者たちを特徴づけた信仰または忠実さのどちらも成立しうる。本文では基本的な訳語「信仰」を用い、解釈上の緊張を解消せず脚注で別訳を示した。
- issue: ἔκβασιςが指導者たちの死、特に殉教を指すか
  choice: 結末
  alternative: 結果、終わり、または死に方
  rationale: 語は生き方の行き着くところや結果を表しうるが、本文自体は殉教を明言していない。そのため特定の歴史的状況を読み込まず、比較的広い「結末」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「神のことば」「信仰」は一般読者にも通じる定着した聖書語彙として用いた。原文の命令の強さと、指導者たちの生き方を注意深く考察する流れを保持した。
