  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: ja
  text: 牢に入れられている人たちを、自分も彼らと共に縛られているかのように心にかけなさい[a]。苦しめられている人たちのことも、自分たちもまた体をもつ者として心にかけなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「共に縛られている者として」。牢にいる人たちと自分も共に拘束されているかのような連帯を表します。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「自分たちもまた体のうちにいる者として」。おそらく、自分たちも肉体をもつ人間として苦しみにさらされうることを指します。「キリストの体」に属していることへの響きを読み取ることも可能です。
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: 心に留めなさい
  rationale: 現在命令形が示す継続的な覚えと配慮を、現代日本語で自然に表す。「思い出しなさい」よりも、苦しむ人への実際的な関心を含み得る。
- source_word: τῶν δεσμίων
  choice: 牢に入れられている人たち
  rationale: δέσμιοςは拘束されている者、囚人を指す。犯罪者という含みを帯びやすい「囚人」を避け、置かれた境遇を明確にした。
- source_word: ὡς συνδεδεμένοι
  choice: 自分も一緒に鎖につながれているかのように
  rationale: συνδέομαιの「共に縛られる」という具体的な像と、投獄された人々への深い連帯の双方を保持する。
- source_word: τῶν κακουχουμένων
  choice: 虐げられている人たち
  rationale: 他者から不当な扱いや苦痛を受けているという受動的な意味を、簡潔で格調ある日本語で表す。
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: あなたがた自身もまた体のうちにいるのですから
  rationale: ἐν σώματιの直訳的な形を保ち、共通する身体的弱さを主に示しつつ、「体」に共同体的な響きを認める可能性も閉ざさない。「のですから」により文脈上の動機づけを自然に表した。
theological_decisions:
- issue: 「体のうちにいる」（ἐν σώματι）の意味
  choice: 同じ肉体的弱さを負う人間としての状態を主な意味としつつ、原文に近い表現を本文に残す
  alternative: キリストの体に属していることへの言及
  rationale: 文脈では、投獄され虐げられる苦しみを自分にも起こり得るものとして受け止めるよう促しているため、共通の身体的脆弱性が最も自然である。ただし原文の簡潔な表現には共同体的な響きがあり得るので、注で可能性を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の厳粛さと牧会的な温かさを保った。「体のうちにいる」は日常語としてやや特異だが、原文の神学的な含みと解釈上の幅を保つため意図的に採用した。
