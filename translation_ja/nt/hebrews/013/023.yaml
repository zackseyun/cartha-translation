  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: ja
  text: 私たちの兄弟テモテが釈放されたことを知ってください。[a] 彼が間もなく来れば、私は彼と一緒にあなたがたにお会いします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自由にされた」とも訳せる。投獄からの釈放を指す可能性がある。この動詞には「送り出された」「解任された」という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: 知ってください
  rationale: 現在能動命令法複数の知らせを告げる用法を保ちつつ、現代日本語で自然な表現とした。
- source_word: τὸν ἀδελφὸν ἡμῶν Τιμόθεον
  choice: 私たちの兄弟テモテ
  rationale: 初期キリスト教共同体の家族的呼称をそのまま保ち、人名は日本語で定着した音写を用いた。
- source_word: ἀπολελυμένον
  choice: 釈放された
  rationale: ἀπολύωの完了受動分詞で、完了した行為の現在的な結果を表す。文脈上は拘束からの解放が有力だが、別の語義も脚注に残した。
- source_word: μεθ’ οὗ
  choice: 彼と一緒に
  rationale: テモテを伴って訪ねるという関係を、自然な日本語で明示した。
- source_word: ἐὰν τάχιον ἔρχηται
  choice: 彼が早く来れば
  rationale: 条件を表すἐάνと接続法を「来れば」で示し、比較級形のτάχιονは文脈に即して「早く」とした。
- source_word: ὄψομαι ὑμᾶς
  choice: あなたがたに会いに行きます
  rationale: 直訳は「あなたがたに会います」だが、受け手のもとへの訪問という含意を、日本語として自然に表した。
