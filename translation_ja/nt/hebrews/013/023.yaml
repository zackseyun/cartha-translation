- from: 私たちの兄弟テモテが釈放されたことを知ってください。[a] 彼が早く来れば、私は彼と一緒にあなたがたに会いに行きます。
  to: 私たちの兄弟テモテが釈放されたことを知ってください。[a] 彼が間もなく来れば、私は彼と一緒にあなたがたにお会いします。
  rationale: 本文は拘禁からの解放という有力な理解を「釈放された」で保ちつつ、脚注でἀπολύωの他の可能な語義を示す。「会いに行きます」を「お会いします」に改め、原文にない移動方向を加えないようにした。また「間もなく来れば」として、τάχιονがこの文脈で示す到着時期の近さを明確にした。
