  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: ja
  text: 見知らぬ人をもてなすことを忘れないでください。それによって、ある人たちは知らないうちに天使たちをもてなしたのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίας
  choice: 旅人をもてなすこと
  rationale: 語の根底にある「見知らぬ人を親しく迎える」という意味を、現代日本語で具体的かつ自然に表す。「旅人」は文脈上、迎え入れるべきよそから来た人を指し、単なる親しい客への歓待に狭めない。
- source_word: μὴ ἐπιλανθάνεσθε
  choice: 忘れてはなりません
  rationale: 基本義の「忘れる」を保ちつつ、勧告として実践を怠らないよう求める力も自然に伝える。
- source_word: διὰ ταύτης
  choice: そうすることで
  rationale: 女性代名詞が直前の「旅人をもてなすこと」を指すため、その実践を受ける自然な日本語とし、διάの手段的意味を表した。
- source_word: ἔλαθόν … ξενίσαντες
  choice: それと知らずに…もてなしました
  rationale: λανθάνωと分詞の構文が示す、行為者がその事実に気づかないまま客を迎えたという意味を明示した。
- source_word: τινες
  choice: ある人たちは
  rationale: 不特定の複数者を示す語を、過去の事例を指す自然な日本語で表した。
- source_word: ἀγγέλους
  choice: 御使いたち
  rationale: 語には一般的な「使者」の意味もあるが、創世記18―19章など、天からの訪問者を迎えた物語への示唆が有力なため、本文では超自然的存在を表す「御使い」とした。語義上の別の可能性は脚注に残した。
theological_decisions:
- issue: ἀγγέλουςが指すもの
  choice: 超自然的な「御使いたち」
  alternative: 人間の「使者たち」
  rationale: 旧約聖書で、正体を知らないまま天からの訪問者を迎えた出来事への示唆が考えられるため、本文では「御使い」が最も文脈に適する。ただし、ギリシア語自体が持つ「使者」という語義は脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令調は「忘れてはなりません」として厳粛さと読みやすさを両立させ、「歓待」のような日常にはやや硬い名詞を避けて具体的に表現した。
