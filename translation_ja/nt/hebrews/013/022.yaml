source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: ja
  text: 兄弟たち[a]、お願いします。この勧めの言葉[b]を、忍耐して受け止めてください。私はあなたがたに手短に書き送ったのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は原文どおりの表現です。会衆全体への呼びかけとして、「兄弟姉妹たち」とも理解できます。
    reason: lexical_alternative
  - marker: b
    text: 「勧めの言葉」は、「励ましの言葉」とも訳せます。「忍耐して受け止めてください」は、「辛抱して聞いてください」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ δὲ ὑμᾶς
  choice: 兄弟たち、お願いします
  rationale: παρακαλῶはここでは著者の切実な要請を表すため、現代日本語で自然かつ丁重な「お願いします」とした。δὲは弱い移行を示すが、日本語では独立した接続語を置かなくても流れが保たれる。ὑμᾶςは後続の依頼表現の相手として自然に含まれる。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 語形どおり男性複数の呼びかけを保った。会衆全体を包括的に指す可能性はあるが、その解釈を本文に織り込まず注で示す。
- source_word: ἀνέχεσθε
  choice: 受け入れてください
  rationale: ἀνέχομαιには「耐える、我慢する、辛抱して受け入れる」の幅がある。ここでは語られた勧めを忍耐強く受容するよう求める文脈なので、「受け入れてください」が自然であり、「我慢してください」ほど否定的に響かない。忍耐の含意は注で補う。
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: この励ましの言葉
  rationale: λόγοςは伝えられた言葉・メッセージを、παράκλησιςは励ましと勧めの双方を表し得る。「励ましの言葉」は自然な日本語だが、「勧めの言葉」という可能性も注に残す。「この」は日本語で当該の書簡を指すために補った。
- source_word: καὶ γὰρ
  choice: のですから
  rationale: 先の依頼を理由づける説明的な働きを、日本語の理由表現「のですから」で表した。καίを機械的に「また」とはしない。
- source_word: διὰ βραχέων
  choice: 手短に
  rationale: 「少ない言葉で、簡潔に」という慣用的意味を自然な日本語で表す。
- source_word: ἐπέστειλα ὑμῖν
  choice: 私はあなたがたに書いた
  rationale: ἐπιστέλλωは書き送ることを表す。日本語では受取人を示す「あなたがたに書いた」で書簡的文脈が明瞭になり、アオリストも素直な過去形で表せる。
theological_decisions:
- issue: ἀδελφοίの包括性
  choice: 本文は「兄弟たち」とする
  alternative: 「兄弟姉妹たち」または「皆さん」
  rationale: 原文の男性複数形を本文で保持しつつ、混成の会衆全体への呼びかけであり得ることを注記し、対象範囲を一方的に限定も拡張もしない。
- issue: παράκλησιςの意味幅
  choice: 本文は「励まし」とする
  alternative: 「勧め」「勧告」
  rationale: この語は慰め・励ましと勧告・訓戒の意味領域をまたぐ。本文では自然で広い「励まし」を採り、勧告的な含意を注に残して神学的・修辞的緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら、結びの切実な依頼にふさわしい丁重さを保った。「兄弟たち」は原文に即した呼びかけであり、混成会衆を含み得る。主文を先に置き、理由節を「のですから」で結んで自然な日本語の論理関係を示した。
