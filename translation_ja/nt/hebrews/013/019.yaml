  source_fidelity: 原文のπερισσοτέρως（「いっそう／さらに切に」）は、読者が「このこと」を行う熱心さではなく、著者のπαρακαλῶ（「お願いします／強くお願いします」）を修飾する。したがって現訳は修飾関係を改める必要がある。ἵνα以下は、著者がより早く読者のもとへ戻されることを目的として示す。ἀποκατασταθῶの受動性と、事情を特定しない広い意味は保持できる。
