  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: ja
  text: なお私は、このことを行ってくださるよう、いっそう切にお願いします。私がより早くあなたがたのもとに戻されるためです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたのもとに回復される」とも訳せる。ギリシア語は、著者が読者のもとへ戻されることを述べるが、その具体的な事情は特定していない。
    reason: ἀποκατασταθῶの「回復する／戻る」という語義の幅を示し、拘禁、病気、旅行など特定の状況を本文に読み込まないため。
lexical_decisions:
- source_word: περισσοτέρως
  choice: いっそう熱心に
  rationale: 比較の意味を保ちつつ、願いの強さが増していることを自然な日本語で表す。単なる頻度ではなく、切なる勧めの度合いを示す。
- source_word: δὲ
  choice: なお
  rationale: 強い逆接ではなく、前節の祈りの要請に続けてさらに願いを加える軽い接続として訳す。
- source_word: παρακαλῶ
  choice: お願いします
  rationale: ここでは命令的な『勧告する』よりも、祈ってほしいという切実な依頼を表す。現代日本語として自然で、相応の強さも保つ。
- source_word: τοῦτο ποιῆσαι
  choice: このことを…行ってくださる
  rationale: 直前の祈りの要請を指す指示表現を保持する。
- source_word: ἵνα
  choice: そうすれば
  rationale: 祈りを求める目的・期待される結果を、自然な日本語で示す。厳密な因果保証とはせず、願いの目的として読める表現にする。
- source_word: τάχιον
  choice: もっと早く
  rationale: 比較級の力を明示し、何らかの基準より早い時期を望む意味を保つ。
- source_word: ἀποκατασταθῶ
  choice: 戻される
  rationale: 受動形を保ちながら、読者のもとへの回復・帰還を表す。事情が拘禁、病気、旅行などのどれであるかは特定しない。
- source_word: ὑμῖν
  choice: あなたがたのもとに
  rationale: 複数の読者への方向・関係を、日本語で明確かつ自然に表す。
theological_decisions:
- issue: 著者が願うἀποκατασταθῶの具体的状況
  choice: 読者のもとに戻されるという一般的な意味にとどめる
  alternative: 投獄から釈放されて戻る、病気から回復する、旅から帰る、または奉仕に復帰する
  rationale: 本文は読者への回復・帰還を述べるが、その妨げとなっている事情を明示しないため、特定の歴史的状況を訳文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、依頼の切実さと文脈上のつながりを保った。文末の『でしょう』はἵναに伴う期待を表しつつ、実現の断定を避ける。脚注記号[a]は該当表現の直後に置いた。
