  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: ja
  text: あなたがたの指導者たち全員と、すべての聖なる者たちによろしくお伝えください。イタリア出身の人たち[a]が、あなたがたによろしくと言っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イタリアにいる人たち」。ギリシア語の表現は、イタリア出身の人々とも、イタリアにいる人々とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡の結びで挨拶を伝えるよう求めるアオリスト中動態命令形。現代日本語で自然かつ丁寧に命令の力を表す。
- source_word: πάντας
  choice: 皆
  rationale: 二つの集団の全員を指すことを簡潔に示す。
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: あなたがたの指導者たち
  rationale: 共同体の中で導く務めを担う人々を指す。政治的・強権的に響き得る「支配者」ではなく、文脈に適した「指導者」とした。
- source_word: τοὺς ἁγίους
  choice: 聖なる者たち
  rationale: 信者を神に属する聖別された者として呼ぶ新約聖書上の表現を保ち、「神の民」のような説明的言い換えを避けた。
- source_word: ἀσπάζονται
  choice: よろしくと言っています
  rationale: 書簡上の挨拶を表す現在中動態直説法。日本語では、同席者から受取人への挨拶であることを自然に示す。
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: イタリアから来た人たち
  rationale: ἀπό＋属格の通常の起点・出身の意味を本文に採用した。所在地を表す可能性は脚注に残した。
theological_decisions:
- issue: οἱ ἀπὸ τῆς Ἰταλίας の指示対象
  choice: イタリアから来た人たち
  alternative: イタリアにいる人たち
  rationale: ἀπόのより直接的な意味である起点・出身を本文に保つ一方、書簡の発信地に関わる解釈上の曖昧さを脚注で明示し、断定しない。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。「聖なる者たち」は原語の神学的含意を保ち、「よろしく伝えてください／よろしくと言っています」は書簡の挨拶として自然にした。
