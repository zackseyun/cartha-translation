translation:
  language: ja
  text: 兄弟姉妹への愛を、保ち続けなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「兄弟愛」。ここでは、キリスト者の共同体に属する人々の間にある、家族のような愛を指す。男性だけに限る意味ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: 兄弟姉妹としての愛
  rationale: 語源的な家族の比喩を保ちつつ、初期キリスト教共同体における仲間の信者への家族的な愛情を、男性だけに限定せず現代日本語で明確に表す。
- source_word: μενέτω
  choice: 保ち続けなさい
  rationale: 現在命令形が求める継続的な状態を表す。「保つ」に「続ける」を添え、すでにある愛を絶やさず持続させるという意味と命令の力を自然に伝える。
- source_word: Ἡ
  choice: （独立して訳出せず）
  rationale: 定冠詞による、読者に認識されている徳目としての限定は、日本語では「兄弟姉妹としての愛」という文脈上明確な主題に吸収するのが自然である。
theological_decisions:
- issue: φιλαδελφίαの範囲と家族的比喩
  choice: 「兄弟姉妹としての愛」と訳し、信者共同体を家族として捉える比喩と男女を含む範囲をともに明示する。
  alternative: 「兄弟愛」または「互いの愛」
  rationale: 「兄弟愛」は簡潔で伝統的だが、現代の読者には男性だけを指すと誤解され得る。「互いの愛」は範囲を広く伝える一方、φιλαδελφίαに固有の家族的な含みを弱めるため採らない。
translation_notes:
  register: 短い勧告として、明快で dignified な現代標準日本語を用いた。「保ち続けなさい」により、命令形と継続相の双方を表現した。
