source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: ja
  text: 結婚はすべての人の間で[b]尊ばれ[a]、夫婦の床も汚されないようにしなさい。神は、性的に不道徳な者と姦淫を行う者を裁かれるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「結婚はすべての人の間で尊い」。ギリシャ語の最初の節には明示された動詞がないため、勧告とも陳述とも読める。
    reason: alternative_reading
  - marker: b
    text: 「すべての人によって」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: 尊ばれ
  rationale: 「尊い、価値ある、尊重されるべき」の意。周囲の勧告の流れに合わせて勧告として訳し、名誉・尊重の含みを保った。
- source_word: γάμος
  choice: 結婚
  rationale: ここでは婚礼ではなく、結婚という制度・関係を指す。現代日本語で最も自然かつ明確。
- source_word: ἐν πᾶσιν
  choice: すべての人の間で
  rationale: 複数の人を指すと理解し、結婚が広く尊重されるべきことを表す。「すべての人によって」も可能なため脚注に示した。
- source_word: κοίτη
  choice: 夫婦の床
  rationale: 字義は「床」だが、ここでは夫婦の性的関係を婉曲に指す。「夫婦の床」は結婚との結び付きを明確にしつつ、原文の比喩を保つ。
- source_word: ἀμίαντος
  choice: 汚されないように
  rationale: 「汚れのない、汚されていない」の意。倫理的な汚れの響きを保ち、勧告として自然な形にした。
- source_word: πόρνους
  choice: 性的に不道徳な者
  rationale: 不正な性的行為をする者を広く指す。特定の一行為に狭めず、現代の読者に意味が伝わる表現とした。
- source_word: μοιχούς
  choice: 姦淫する者
  rationale: 配偶者以外との性的関係、すなわち姦淫を行う者を具体的に指し、広義の πόρνους との区別を保つ。
- source_word: κρινεῖ
  choice: 裁かれる
  rationale: 未来の神の裁きを表す。「罪に定める」まで結果を限定せず、κρίνω の意味範囲を保った。
- source_word: γάρ
  choice: からです
  rationale: 前の勧告を神の裁きによって根拠づける論理関係を、自然な日本語で示した。
theological_decisions:
- issue: 冒頭の動詞のない節を、陳述と取るか勧告と取るか
  choice: 「結婚は…尊ばれ」と勧告として訳す
  alternative: 「結婚はすべての人の間で尊い」と陳述として訳す
  rationale: ギリシャ語には明示された動詞がなく、両方の解釈が可能。ヘブライ人への手紙13章の連続する倫理的勧告に合わせて本文は勧告としたが、真正な曖昧さを脚注に残した。
- issue: ἐν πᾶσιν が「すべての人の間で」か「すべての人によって」か
  choice: 「すべての人の間で」
  alternative: 「すべての人によって」
  rationale: 前置詞句が、結婚が尊重される社会的範囲を示すとも、尊重する主体を示すとも理解できる。本文では前者を採り、後者を脚注に示した。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文にふさわしい端正さを保った。「夫婦の床」は原文の婉曲表現を残し、「性的に不道徳な者」は πόρνους の広さを過度に限定しない表現とした。
