id: HEB.13.20
reference: Hebrews 13:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: ja
  text: どうか、平和の神が、永遠の契約の血によって[a]、羊たちの偉大な牧者である私たちの主イエスを死者の中から引き上げられ、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「永遠の契約の血によって」は、神が主イエスを死者の中から引き上げられたことにかかるとも、「羊たちの偉大な牧者」により強く結び付くとも理解できる。ギリシア語は複数の係り方を許す。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: どうか
  rationale: δέの弱い推移・接続は日本語では明示せず、後続節まで続く祈願文であることを「どうか」で自然に示した。時間的な「今」は原文にないため加えない。
- source_word: θεὸς τῆς εἰρήνης
  choice: 平和の神
  rationale: 神が平和を特徴とし、また平和をもたらす方であることを表す属格表現を、簡潔で定着した日本語にした。
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: 死者の中から引き上げられた
  rationale: 復活を指す文脈を保ちつつ、ἀνάγωの「上へ連れ出す／引き上げる」という像を残した。「られた」は主語である神への敬意を表す尊敬語で、受け身ではない。
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: 羊たちの偉大な牧者
  rationale: ποιμήνとπρόβαταの牧者・羊という比喩、およびμέγαςによる強調を直接的に保持した。
- source_word: ἐν αἵματι
  choice: 血によって
  rationale: ἐνを手段または根拠を示す表現として訳したが、何を修飾するかという統語上の幅は脚注で示した。
- source_word: διαθήκης αἰωνίου
  choice: 永遠の契約
  rationale: ヘブライ人への手紙の議論に即してδιαθήκηを「契約」とし、冠詞のないギリシア語に日本語で不自然な不定性を付加しなかった。
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: 私たちの主イエス
  rationale: κύριοςを「主」とし、イエスが神によって死者の中から引き上げられた方であるという同格関係を明瞭にした。
theological_decisions:
- issue: ἐν αἵματι διαθήκης αἰωνίουがどこにかかるか
  choice: 神がイエスを死者の中から引き上げた行為にかかるものとして「永遠の契約の血によって」とした。
  alternative: 「永遠の契約の血による、羊たちの偉大な牧者」のように、主として「偉大な牧者」に結び付けることもできる。
  rationale: 語順と文脈からは復活の行為を修飾する理解が自然だが、ギリシア語は別の係り方も許すため、贖罪や契約と復活の関係を本文で過度に限定せず、脚注で曖昧さを保存した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祈願・祝祷にふさわしい品位を保った。文は次節へ続くため読点で終えた。「羊たち」は原語の複数を見せ、「引き上げられた」は復活の意味と原語の上昇イメージをともに保つ表現とした。
