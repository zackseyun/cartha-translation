  terminology: 「賛美のいけにえ」「献げる」「御名」「告白する」は、原文の祭儀的・告白的語彙を保つ適切な聖書的表現である。「神の御名」としても、固有名を不当に補うことではなく、τῷ θεῷ と αὐτοῦ の文脈上の結び付きを日本語で明示する処理である。
