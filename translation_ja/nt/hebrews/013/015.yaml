id: HEB.13.15
reference: Hebrews 13:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: ja
  text: ですから、私たちはこの方を通して、絶えず[a]神に、賛美のいけにえ、すなわち神の御名を告白する[c]唇[b]の実を献げましょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いつも」または「いつでも」。
    reason: lexical_alternative
  - marker: b
    text: 「私たちの唇の実」とも訳せる。ただし、「私たちの」に当たる語はギリシア語本文には明記されていない。
    reason: lexical_alternative
  - marker: c
    text: 別訳「神の御名を認める」。このギリシア語動詞は、公に告白すること、または認めることを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: この方を通して
  rationale: διά＋属格の手段・媒介の意味を保ち、直前の文脈で示されるイエスを指す代名詞を、固有名を補わず自然な日本語で表した。
- source_word: οὖν
  choice: ですから
  rationale: 前段から導かれる勧告であることを、明瞭で自然な現代日本語の接続表現で示した。
- source_word: ἀναφέρωμεν
  choice: 献げましょう
  rationale: 一人称複数の勧奨的接続法を「ましょう」で表し、祭儀的な「献げる」という含意も保持した。
- source_word: θυσίαν αἰνέσεως
  choice: 賛美のいけにえ
  rationale: 賛美をいけにえとして語る比喩と旧約聖書的背景を保ちつつ、日本語として理解しやすい形にした。
- source_word: διὰ παντός
  choice: 絶えず
  rationale: 継続・反復を表す句を簡潔に訳した。「いつも」「いつでも」という可能性は脚注に示した。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: 献げ物の受け手を示す与格を、そのまま自然な日本語で表した。
- source_word: τοῦτ’ ἔστιν
  choice: すなわち
  rationale: 「賛美のいけにえ」の内容を説明し直す機能を明確にした。
- source_word: καρπὸν χειλέων
  choice: 唇の実
  rationale: 聖書的な比喩を保った。ギリシア語に明示されていない「私たちの」は本文に補わず、脚注で訳出の可能性を示した。
- source_word: ὁμολογούντων
  choice: 告白する
  rationale: 公に認め、言い表す意味を保持した。「認める」という訳の可能性は脚注に示した。
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: その御名を
  rationale: ὁμολογέωに伴う与格を自然な日本語の目的語として訳した。「御名」により神を指す文脈を示しつつ、原文の代名詞を過度に展開しなかった。
theological_decisions:
- issue: δι’ αὐτοῦの指示対象
  choice: 「この方」とし、文脈上イエスを指す媒介的表現を保持する。
  alternative: 「イエスを通して」と固有名を明示する。
  rationale: 直前の文脈ではイエスが指示対象と理解されるが、原文は代名詞なので、本文では固有名を補わず文脈との結び付きを保った。
- issue: いけにえの比喩の扱い
  choice: 「献げる」「賛美のいけにえ」と訳し、祭儀的比喩を保持する。
  alternative: 「神を賛美しましょう」と意味を平板化する。
  rationale: この節は賛美を意図的に犠牲奉献の語彙で表しているため、その神学的緊張と旧約的背景を消さないようにした。
- issue: 「その御名を告白する」の意味
  choice: 公に神の御名を認めて言い表す意味を含む「告白する」とした。
  alternative: 「その御名を認める」または「その御名をほめたたえる」。
  rationale: ὁμολογέωの公的な承認・告白の含みを保ち、「賛美」や「感謝」だけに限定しなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「いけにえ」「唇の実」「御名」という聖書的表現は、原文の祭儀的・詩的比喩を保持するため残した。勧奨は「献げましょう」とし、読者を含む共同体への呼びかけとして自然に表した。
