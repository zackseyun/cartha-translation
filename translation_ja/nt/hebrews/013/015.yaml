revisions:
- from: ですから、私たちはこの方を通して、絶えず[a]神に賛美のいけにえを献げましょう。すなわち、その御名を告白する[c]唇[b]の実です。
  to: ですから、私たちはこの方を通して、絶えず[a]神に、賛美のいけにえ、すなわち神の御名を告白する[c]唇[b]の実を献げましょう。
  rationale: 「すなわち」以下を「献げましょう」に従属させ、原文の同格構文を自然な日本語で再現した。また、「その御名」を「神の御名」として、原文の文脈上の指示対象を明瞭にし、「この方」（キリスト）との不要な指示対象の混同を避けた。脚注cも本文に合わせて対象を明示した。
