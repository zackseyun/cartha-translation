lexical_decisions:
- source_word: ἡ χάρις
  choice: 恵み
  rationale: 定冠詞を伴うが、書簡末尾の祝福として機能している。日本語では「その恵み」とせず「恵み」とするのが自然であり、原文の意味を簡潔に保てる。
- source_word: μετὰ
  choice: 共にありますように
  rationale: 属格を伴う μετά は「〜と共に」を意味する。原文は動詞を省いた祝福の定型句なので、日本語では願いを表す「ありますように」を補い、自然で明瞭な結びの言葉とした。
- source_word: πάντων ὑμῶν
  choice: あなたがたすべて
  rationale: πάντων は受け手全員を明示的に含む。「あなたがたすべて」とすることで、その包括性を保った。
