reference: Hebrews 13:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: ja
  text: というのも、私たちには、ここに永続する都はなく、来るべき都を求めているのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 〜のではなく／〜のです
  rationale: γάρは直前の勧めを支える理由・説明を示す。日本語では文末の「のです」によって説明的なつながりを自然に表し、οὐの否定は「持っているのではなく」で示した。
- source_word: ἔχομεν
  choice: 私たちは持っている
  rationale: 現在形の単純な所有表現として、現代日本語で自然な「持っている」を用いた。
- source_word: ὧδε
  choice: この地上に
  rationale: 字義的には「ここに」だが、来たるべき都との対比を日本語で明瞭にするため、文脈上指している現在の地上を表した。ただし場所を過度に具体化しないよう「この地上」とした。
- source_word: μένουσαν
  choice: 永続する
  rationale: πόλινを修飾する現在分詞で、存続し続ける、朽ちずにとどまるという意味を表す。「永続する」は将来の都との対照を簡潔かつ格調を保って伝える。
- source_word: πόλιν
  choice: 都
  rationale: 具体的な都市を指す語を保持した。聖書的な都市像と将来の住まい・共同体の含意を保ちつつ、「天」「故郷」などの解釈語には置き換えない。
- source_word: ἀλλὰ
  choice: 〜のではなく
  rationale: 現在ここにある都の否定と、将来の都を求めることとの強い対照を、日本語の対応構文で自然に表した。
- source_word: τὴν μέλλουσαν
  choice: 来ようとしている都
  rationale: 女性形分詞が直前のπόλινを受けることを明示するため「都」を補った。μέλλωの未来志向を保ち、「来ることになっている」と断定的にしすぎず、到来しつつある都という含みを表した。
- source_word: ἐπιζητοῦμεν
  choice: 切に求めている
  rationale: ἐπιζητέωにある、単なる探索よりも強い追求のニュアンスを「切に」で表し、現在の継続的な姿勢を「求めている」とした。
theological_decisions:
- issue: 「都」の比喩が指すもの
  choice: 本文では「都」をそのまま保持する。
  alternative: 「天」「天の都」「天のエルサレム」と明示する。
  rationale: ヘブライ人への手紙の他の箇所には天上の都の主題があるが、この節自体はそれを明示的に「天」や「エルサレム」と呼んでいない。したがって、現在の永続しない都と来たる都との対照を保ち、解釈を本文へ織り込まない。
- issue: μένουσανとμέλλουσανの時間的対照
  choice: 「永続する」と「来ようとしている」を対置する。
  alternative: 「残る」と「未来の」を対置する。
  rationale: 前者は存続性、後者は到来・未来性を表すため、両者を同じ意味領域へ平板化せず、原文の神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「都」「永続する」「切に求める」によって聖書本文としての品位を保った。短い一節のため不要な注は付さず、原文の指示語ὧδεは文脈に即して「この地上に」とした。
