  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: ja
  text: というのも、罪のためにその血が大祭司によって聖所[a]へ運び入れられる動物の体は、宿営の外で焼かれる[b]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「聖なる所々」。聖なる祭儀空間、すなわち聖域を指す表現で、「聖域」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「完全に焼き尽くされる」とも訳せる。この動詞には、徹底して焼くことを強調する含みがあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: その血が…運び入れられる動物は、その体が
  rationale: 関係節と後半の指示表現の対応を保ちつつ、日本語として追いやすい形にした。「動物」は祭儀に用いられる動物を自然に表し、「その体が」によって同じ動物を受け直している。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 前節の内容を根拠づける説明のつながりを、現代日本語で明確に示す。
- source_word: εἰσφέρεται
  choice: 運び入れられる
  rationale: 現在受動態と、血が聖域内へ携え込まれる祭儀的動作を自然に表す。
- source_word: τὸ αἷμα
  choice: その血
  rationale: 犠牲動物の血を指す文字どおりの祭儀的表現を保持する。
- source_word: περὶ ἁμαρτίας
  choice: 罪のため
  rationale: 罪との関係を示す祭儀的表現を保ち、「罪の供え物」と限定しすぎないようにした。
- source_word: εἰς τὰ ἅγια
  choice: 聖所
  rationale: ヘブライ書における聖なる祭儀空間を指す表現として自然である。ギリシア語の複数形が必ずしも複数の場所を意味するとは限らないため、日本語では慣用的な「聖所」とし、語形と範囲の含みを脚注に残した。
- source_word: διὰ τοῦ ἀρχιερέως
  choice: 大祭司によって
  rationale: 属格を伴う διά が示す行為者を、自然な受動構文で表した。
- source_word: κατακαίεται
  choice: 焼かれる
  rationale: 火で焼く祭儀的行為を簡潔に表し、完全に焼き尽くすという強い含みは脚注に示した。
- source_word: ἔξω τῆς παρεμβολῆς
  choice: 宿営の外
  rationale: 荒野のイスラエルと幕屋を背景とする παρεμβολή の定着した自然な訳であり、続く節との類型的なつながりも保つ。
theological_decisions:
- issue: εἰς τὰ ἅγια が指す祭儀空間
  choice: 本文では「聖所」とし、至聖所に限定しない
  alternative: 至聖所／聖なる所々
  rationale: この句は聖なる祭儀空間を広く指し得る。贖罪日の儀式を背景に持つとしても、本文自体が必ず「至聖所」だけに限定しているとは断定できないため、その曖昧さを保持した。
- issue: περὶ ἁμαρτίας の祭儀的意味
  choice: 「罪のため」
  alternative: 「罪の供え物として」
  rationale: 文脈上は罪に関する犠牲を指すが、ギリシア語はここで名詞「罪の供え物」を明示していないため、過度な特定を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祭儀的な荘重さを保った。「というのも…からです」で前節との論理関係を示し、「聖所」「大祭司」「宿営」は聖書文脈で理解しやすい語を採用した。
