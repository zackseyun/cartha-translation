  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: ja
  text: また、善を行うことと分かち合うこと[b]を忘れてはなりません[a]。神はこのようないけにえを喜ばれるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「忘れてはなりません」。ここでは、これらを実行せずにいる、すなわち怠るという実際的な意味を含みます。
    reason: lexical_alternative
  - marker: b
    text: 「分かち合うこと」は、「交わり」または「惜しみなく与えること」とも訳せます。ここでは、他の人と実際に持ち物などを分かち合うことを指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: 善を行うこと
  rationale: 抽象名詞が表す積極的な善行を、現代日本語で自然かつ動作性を保って表した。
- source_word: κοινωνίας
  choice: 分かち合うこと
  rationale: ここでは善行と並び、いけにえと呼ばれているため、他者との実際的な共有や施しを含む語として訳した。ただし交わりや惜しみない提供という幅も注で残した。
- source_word: μὴ ἐπιλανθάνεσθε
  choice: 忘れてはなりません
  rationale: 原語の基本的な比喩を保ちつつ、実行を怠らないようにとの勧告として自然に理解できる表現を選んだ。
- source_word: τοιαύταις ... θυσίαις
  choice: このようないけにえを
  rationale: 善行と分かち合いを神へのいけにえにたとえる祭儀的比喩を明確に保持した。
- source_word: εὐαρεστεῖται
  choice: 喜ばれる
  rationale: 神がそのようないけにえを喜ばれるという受動形の意味を、簡潔で敬意ある現代日本語にした。
- source_word: ὁ θεός
  choice: 神
  rationale: 主語を標準的に訳した。
- source_word: δὲ
  choice: また
  rationale: 強い対比ではなく、前の勧告にさらに一項を加える接続として訳した。
theological_decisions:
- issue: 「いけにえ」の性質
  choice: 善行と分かち合いを、神に喜ばれるいけにえとして比喩的に表す
  alternative: 施しだけを祭儀に代わるものと見る、または犠牲の比喩を弱めて一般的倫理行為とする
  rationale: 原文は明示的に θυσίαις を用いているため、その祭儀的比喩を保った。一方、分かち合いを施しだけに限定せず、原語の意味の幅も残した。
translation_notes:
  register: 明快で品位ある現代標準日本語。「いけにえ」は聖書的な祭儀の比喩を保つため維持し、「分かち合う」は意味を物質的施しだけに狭めない自然な表現とした。
