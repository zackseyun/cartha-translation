id: HEB.13.6
reference: Hebrews 13:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: ja
  text: ですから、私たちは確信をもって言えます。「主は私の助け手。私は恐れない。人が私に何をするというのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人が私に何をするというのか」は、「人が私に何をできようか」とも訳せる。原文の「人」は、人間一般を指す単数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の内容から導かれる結果・帰結を、現代日本語で自然に示す。
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: 私たちは確信をもって言えます
  rationale: θαρρέω の勇気と確信を保ちつつ、不定詞構文を自然な日本語にした。
- source_word: Κύριος ἐμοὶ βοηθός
  choice: 主は私の助け手
  rationale: 与格 ἐμοὶ の『私のための』という関係を『私の』で表し、βοηθός の人格的な助力者という名詞性を保った。
- source_word: οὐ φοβηθήσομαι
  choice: 私は恐れない
  rationale: 未来形は引用中の確信に満ちた意志・態度を表すため、日本語では簡潔な非過去形が自然である。
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: 人が私に何をするというのか
  rationale: ποιήσει の未来形を反語表現の中に保ち、ἄνθρωπος は性別を限定しない一般的な『人』とした。
theological_decisions:
- issue: 一般的用法の ἄνθρωπος
  choice: 人
  alternative: 人間／誰が
  rationale: 単数の代表的・一般的意味を保ちながら、男性だけを指すとの誤解を避ける。
- issue: 反語的未来 ποιήσει の表現
  choice: 何をするというのか
  alternative: 何ができようか
  rationale: 原文の未来形を反映しつつ、問いが人間の脅威を退ける反語であることを自然に伝える。能力を明示する『できる』を本文に補わない。
- issue: 詩編118:6（七十人訳117:6）からの引用調
  choice: 主は私の助け手。私は恐れない。
  alternative: 主は私を助けてくださる方。私は恐れない。
  rationale: 簡潔で荘重な告白の形と、原文の名詞述語 βοηθός を保つ。
translation_notes:
  register: 明快な現代標準日本語を用い、引用部分は簡潔で dignified な告白調とした。反語の含意は保つが、原文の未来形を能力表現へ置き換えず、別訳を脚注に示した。
