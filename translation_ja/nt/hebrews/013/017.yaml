id: HEB.13.17
reference: Hebrews 13:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: ja
  text: あなたがたの指導者たちの言うことに耳を傾け、従いなさい。[a] 彼らは、やがて報告の責任を負う者として、あなたがたの魂のために絶えず見守っています。彼らが嘆きながらではなく、喜んでこの務めを果たせるようにしなさい。嘆きながらすることになれば、それはあなたがたの益にはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの指導者たちに従いなさい。」最初のギリシア語は、より字義的には「説得される」「信頼して受け入れる」という意味を持ち得ます。
    reason: Πείθεσθεには「従う」という文脈上もっともな意味がある一方、説得を受け入れるという語感もある。本文では「耳を傾け」と訳し、続くὑπείκετεの「従いなさい」と区別した。
lexical_decisions:
- source_word: Πείθεσθε
  choice: 言うことに耳を傾け
  rationale: この中動・受動形の命令は「説得される」「信頼して従う」を表し得る。「耳を傾け」は、単なる命令への服従に限定せず、説得を受け入れる関係的な含みを自然な日本語で伝える。文脈上可能な「従う」は脚注に残した。
- source_word: ἡγουμένοις
  choice: 指導者たち
  rationale: 共同体の中で導く責任を担う人々を指す。過度に支配的な意味を持ち込まず、現代日本語として明瞭である。
- source_word: ὑπείκετε
  choice: 従いなさい
  rationale: 「譲る、屈する、従う」という意味を持つ。日本語では「言うことに耳を傾け」と組み合わせることで、二つの動詞を区別しつつ自然に勧告の力を表せる。
- source_word: ἀγρυπνοῦσιν
  choice: 絶えず見守っています
  rationale: 眠らず警戒するという比喩を背景に、継続的で注意深い配慮を表す。「見守る」によって牧会的な警戒の像を保つ。
- source_word: ψυχῶν
  choice: 魂
  rationale: ψυχήは命、人、自分自身をも指し得るが、ここでは霊的責任の重みを保持する「魂」が適切である。人間全体への配慮を否定する表現ではない。
- source_word: ὡς λόγον ἀποδώσοντες
  choice: やがて申し開きをする者として
  rationale: 未来分詞の将来的な責任と、神の前で責任を問われる含みを簡潔に表す。「申し開き」は責任ある報告・弁明の意味を自然に伝える。
- source_word: μετὰ χαρᾶς
  choice: 喜んで
  rationale: 日本語では副詞的に訳す方が自然であり、喜びをもって務めるという意味を明瞭に表す。
- source_word: στενάζοντες
  choice: 嘆きながら
  rationale: στενάζωの「うめく、ため息をつく、嘆く」という具体的な感情表現を保つ。
- source_word: ἀλυσιτελὲς
  choice: 益にはなりません
  rationale: 「有益でない、ためにならない」という意味を自然な現代日本語で表し、「害になる」と強めすぎない。
theological_decisions:
- issue: 共同体の指導者に対する勧告の性質
  choice: 指導者の言葉を受け入れて従うよう勧めるが、無条件・絶対的な服従とは訳さない。
  alternative: 「指導者たちに服従しなさい」と、より強い権威への服従として訳す。
  rationale: Πείθεσθεとὑπείκετεの組み合わせは、信頼して受け入れ、譲り従う姿勢を求める。一方、その根拠は指導者自身が申し開きを負う見守りにあり、無制限な権威を明示してはいない。
- issue: 指導者が申し開きをする相手
  choice: 本文では相手を補わず、「申し開きをする」とする。
  alternative: 「神に申し開きをする」と明示する。
  rationale: 文脈上は神の前での責任が強く示唆されるが、ギリシア語本文は相手を明記していないため、本文では補足せず原文の含みを保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「魂」「申し開き」で原文の霊的・責任的な重みを保ちつつ、「耳を傾け、従う」によって二つの命令を自然に表現した。代名詞「彼ら」が指導者を指すことを明確にするため「この人たち」とした。
