  naturalness: 「その方」は敬意を表す用法として理解可能ですが、この文脈ではやや指示語的で不自然に響く可能性があります。原文の代名詞性を保ちながら、文を「…出て行き、…を負おう」とするほうが、明瞭な現代標準日本語として自然で、分詞 φέροντες の付帯状況も無理なく表せます。
  terminology: παρεμβολήを「宿営」とするのは、ヘブライ書の祭儀的・荒野のイメージを保つ適切な訳です。ὀνειδισμόςには「そしり」を用いると、侮辱・非難と、それをキリストに従う者が引き受けるという含意を保てます。脚注は「宿営地」を代案とし、レビ16章および町の外という文脈的連関を説明しており、アンカー位置も適切です。
