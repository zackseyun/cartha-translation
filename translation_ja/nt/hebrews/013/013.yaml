  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: ja
  text: それゆえ、私たちはその方のもとへ、宿営の外[a]に出て行き、その方のそしりを負おう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「宿営地の外」とも訳せる。この表現は、レビ記16章の犠牲の情景と、イエスが町の外で受けた拒絶を思い起こさせる。
    reason: παρεμβολήの訳語の幅と、文脈上重要な祭儀的背景を示すため。
lexical_decisions:
- source_word: τοίνυν
  choice: それゆえ
  rationale: 直前の13章11–12節を受けて結論と勧めを導く推論の小辞であるため、論理的なつながりを明確にした。
- source_word: ἐξερχώμεθα
  choice: 出て行き……負おうではありませんか
  rationale: 一人称複数・現在接続法の勧奨的用法。日本語では後続する分詞と一つの勧めとして自然にまとめた。
- source_word: πρὸς αὐτὸν
  choice: その方のもとへ
  rationale: 対格を伴うπρόςが人へ向かう動きを表す。「その方」としてギリシア語の代名詞を保ち、文脈上の指示対象を訳文中で明示的に「イエス」と置き換えなかった。
- source_word: ἔξω τῆς παρεμβολῆς
  choice: 宿営の外
  rationale: παρεμβολήの『宿営、陣営』という具体的な像を保ち、直前の祭儀的背景との連続性を維持した。
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: その方の辱め
  rationale: ὀνειδισμόςが表す非難、侮辱、社会的恥辱を、簡潔で聖書的響きもある「辱め」で表した。属格の関係を過度に説明せず「その方の」とした。
- source_word: φέροντες
  choice: 身に負おう
  rationale: 『担う、負う』という語義を保ちつつ、辱めを引き受けることを自然な現代日本語で表した。単に『耐える』と解釈的に狭めてはいない。
theological_decisions:
- issue: 「その方」の指示対象
  choice: 代名詞のまま「その方」とし、直前の文脈からイエスを指すようにした
  alternative: 訳文で「イエス」または「キリスト」と明示する
  rationale: 13章12節から指示対象は明らかだが、原文は代名詞を用いているため、その結びつきを保った。
- issue: 「宿営の外」の意味
  choice: 祭儀的・比喩的な像をそのまま保持する
  alternative: 「宗教体制の外」「共同体の外」などと意訳する
  rationale: レビ記の犠牲と、宿営または町の外で辱めを受けたイエスとの結びつきを担う表現であり、特定の適用だけに限定しないため。
- issue: 「その方の辱め」の属格
  choice: 「その方の辱め」として関係の幅を残す
  alternative: 「その方に向けられた辱め」または「その方が受けた辱め」と限定する
  rationale: 原文の属格は、イエスに加えられた辱めと、イエスに属する者が分かち持つ辱めとの響きを持ちうるため、一方だけに明確化しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、勧告としての重みを保つため「負おうではありませんか」とした。「その方」は指示対象への敬意を自然に示すが、原文にない固有名を補ってはいない。
