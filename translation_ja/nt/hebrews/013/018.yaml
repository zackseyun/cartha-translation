source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: ja
  text: 私たちのために祈ってください。私たちは良い良心を持っていると確信しています[a]。すべてのことにおいて立派に振る舞いたいと願っているからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確信しています」は、「そう信じています」または「そう確信しています」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 後半は、「私たちは良い良心を持っていると確信しており、すべてのことにおいて立派に振る舞いたいと願っています」とも訳せる。
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: Προσεύχεσθε περὶ ἡμῶν
  choice: 私たちのために祈ってください
  rationale: 祈りを表す動詞とともに用いられる περί＋属格を、現代日本語で自然な「～のために」とした。現在命令形の継続的側面は文脈上含意され得るが、「祈り続けてください」と明示すると意味を狭めるため本文には加えない。
- source_word: πειθόμεθα
  choice: 確信しており
  rationale: 話者たちが自分たちの良心について抱いている、確かな認識を自然に表す。「納得している」「信じている」も可能だが、ここでは認知的な確かさを明瞭に伝える。
- source_word: καλὴν συνείδησιν
  choice: 正しい良心
  rationale: καλός の広い肯定的意味を保ちつつ、日本語として理解しやすい表現とした。「やましいところのない良心」は自然だが、無罪性の意味に限定しやすい。
- source_word: ἐν πᾶσιν
  choice: 何事においても
  rationale: 包括的な意味を保ちながら、倫理的な行動について述べる文脈に合う自然な表現とした。
- source_word: καλῶς
  choice: 立派に
  rationale: 単なる技能上の「うまく」ではなく、倫理的に良く、誉れある仕方で行動する意味を伝える。「正しく」も可能だが、καλός 語群の肯定的な質を広く保つため「立派に」とした。
- source_word: θέλοντες ἀναστρέφεσθαι
  choice: 振る舞いたいと願っている
  rationale: ἀναστρέφομαι の生活態度・行状に関する意味を「振る舞う」で表し、θέλω の継続的な意志・願いを自然な日本語にした。
theological_decisions:
- issue: 分詞節 θέλοντες ἀναστρέφεσθαι と「正しい良心を持っている」との関係
  choice: 「確信しており、……願っているからです」とつなぎ、分詞節を良心についての主張と密接に関連させつつ、厳密な因果関係は明示しない。
  alternative: 「何事においても立派に振る舞いたいと願っているので、正しい良心を持っていると確信しています」と明確な理由として訳す。
  rationale: ギリシア語の現在分詞は理由・説明を含み得るが、その論理関係を一義的に定めてはいない。日本語本文では両者の結び付きを保ち、罪が全くないという強い神学的主張にはしない。
- issue: 「正しい良心」が示す道徳的主張の強さ
  choice: 原文どおり、話者たち自身の確信として述べる。
  alternative: 「良心に何のやましさもない」と訳し、完全な潔白を前面に出す。
  rationale: πειθόμεθα による主観的な確信という枠を保ち、完全無欠や無罪性を本文に付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「祈ってください」「何事においても」など、一般読者に分かりやすく、かつ礼節ある表現にした。「品行」「良心が潔白」などの硬すぎる表現は避けた。
