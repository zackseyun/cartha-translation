id: HEB.1.13
reference: Hebrews 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: ja
  text: 'しかし、神が御使いたちのだれかに、次のように言われたことが一度でもあるでしょうか。


    「わたしの右に座っていなさい。


    わたしがあなたの敵たちを


    あなたの足台とするまで。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: しかし、神が……御使いたちのうちのだれに
  rationale: δέの対照を「しかし」で示し、πρός＋対格を発言の相手として自然に表した。原文で省略され、文脈上明らかな発言者を、日本語の明晰さのため「神」と補った。
- source_word: εἴρηκέν ποτε
  choice: かつて……言われたでしょうか
  rationale: 完了形の現在に及ぶ効力を日本語で過度に形式化せず、ποτέを「かつて」で明示した。修辞疑問は丁寧で格調ある形にした。
- source_word: Κάθου
  choice: 座っていなさい
  rationale: 単なる着席動作だけでなく、右の座にとどまる含みを自然な日本語で示す。
- source_word: ἐκ δεξιῶν μου
  choice: わたしの右に
  rationale: 王権と栄誉の座を表す定型句を、現代日本語で簡潔かつ自然に訳した。「右手」は身体部位との誤解を招きうるため避けた。
- source_word: ἕως ἂν θῶ
  choice: わたしが……とするまで
  rationale: 未来の到達点を示すἕως ἂνと、目的補語を取るτίθημιの構文を「とするまで」で保持した。
- source_word: τοὺς ἐχθρούς σου
  choice: あなたの敵たち
  rationale: 複数形を明示し、意味をそのまま保った。
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: あなたの足台
  rationale: 服従を表す詩的比喩を説明に置き換えず保持した。「足の足台」という不自然な重複は避けつつ、所有関係を明確にした。
theological_decisions:
- issue: 詩編110:1の引用が持つキリスト論的・王権的含意
  choice: 「わたしの右に座っていなさい」「敵たちをあなたの足台とする」という即位と服従の比喩をそのまま残す。
  alternative: 「敵を完全に打ち破るまで」など、比喩の意味を説明的に訳す。
  rationale: ヘブライ人への手紙の論証は、御子に向けられた聖書の具体的な文言と、御使いたちとの対比に依存するため、解釈的な言い換えを避けた。
- issue: 発言者の明示
  choice: 文脈上の発言者を「神」と本文に補う。
  alternative: 原文の省略を保ち、「だれにこう言われたでしょうか」とする。
  rationale: 日本語では主語を補う方が問いの構造が明瞭になる。これは文脈上明白な指示対象を示すものであり、独自の神学的解釈を加えるものではない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書引用には簡潔で詩的な改行と dignified な調子を保った。「御使い」は一般読者にも通じる伝統的な聖書語として採用し、過度な古語調は避けた。
