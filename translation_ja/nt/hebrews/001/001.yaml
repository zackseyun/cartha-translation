id: HEB.1.1
reference: Hebrews 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: ja
  text: 昔、神は、多くの部分に分けて[a]、さまざまな仕方で、預言者たちによって[b]父祖たち[c]に語られました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「多くの部分において」とも訳せる。ギリシア語は、以前の啓示が多くの部分から成ることと、それが多様な仕方で与えられたこととを区別して表している。
    reason: lexical_alternative
  - marker: b
    text: 「預言者たちを通して」とも訳せる。直訳は「預言者たちのうちで」。
    reason: lexical_alternative
  - marker: c
    text: 「先祖たち」とも訳せる。ギリシア語は「父たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: 幾つもの部分に分け
  rationale: 啓示が多くの部分・区分から成っていたことを表し、続く πολυτρόπως の「仕方の多様性」と同義にしてしまわない訳とした。
- source_word: πολυτρόπως
  choice: さまざまな仕方で
  rationale: 伝達の方法や様式が多様であったことを、現代日本語で自然かつ明確に表す。
- source_word: πάλαι
  choice: 昔
  rationale: 遠い過去を簡潔で自然な現代日本語で示し、次節の時との対比に備える。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 定冠詞を不自然に訳出せず、主語を端的に示す。
- source_word: λαλήσας
  choice: 語られました
  rationale: 原文では次節の定動詞に連なるアオリスト分詞だが、単独の節として読めるよう定動詞化した。神を主語とする文にふさわしい敬意ある現代日本語を用いながら、次節との時間的対比を妨げない。
- source_word: τοῖς πατράσιν
  choice: 父祖たち
  rationale: 単なる直近の父親ではなく、契約史上の先祖たちを指す語として、日本語で自然かつ原語の男性形も保つ「父祖たち」とした。
- source_word: ἐν τοῖς προφήταις
  choice: 預言者たちによって
  rationale: ἐν の手段・媒介を表す用法として、神が語り手であり預言者たちがその媒介者であることを自然に示す。
theological_decisions:
- issue: ヘブライ1:2との関係における分詞構文
  choice: 1節では「語られました」と定動詞化しつつ、冒頭の「昔」によって次節との時間的対比を保つ。
  alternative: 「神は……語って」と分詞的な従属構造を保ち、次節まで文を完結させない。
  rationale: λαλήσας は統語上、次節の主動詞につながる。しかし節単独では未完の日本語になりやすいため、可読性を優先して定動詞化し、以前の啓示と御子による啓示との対比そのものは解釈的に増補せず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発話には敬意ある「語られました」を用いた。「幾つもの部分に分け」と「さまざまな仕方で」を並置し、二つの副詞の意味上の区別を保った。
