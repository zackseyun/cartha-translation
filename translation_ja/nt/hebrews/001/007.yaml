id: HEB.1.7
reference: Hebrews 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: ja
  text: 'また、天使たちについては、こう言っておられます。

    「神は、ご自分の天使たちを風[a]とし、

    ご自分に仕える者たちを火の炎とする。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」とも訳せる。ギリシア語は「風」と「霊」のどちらも意味しうる。
    reason: 原語πνεύματαの真正な語義的曖昧さを保存するため。
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: 天使たちについては
  rationale: ここでのπρόςは、天使への直接の呼びかけではなく、天使について神が語る内容を導入する用法。後続する御子についての発言との対比も「については」で自然に示せる。
- source_word: λέγει
  choice: こう言っておられます
  rationale: 聖書の引用を現在の発言として提示する現在形を保ち、暗黙の主語である神への敬意を自然な日本語で表した。
- source_word: Ὁ ποιῶν
  choice: 神は…とし、…とする
  rationale: 分詞の能動的な意味を日本語の引用文として自然に表現した。主語「神は」は文脈上の指示対象を明確にする補足である。
- source_word: ἀγγέλους
  choice: 天使たち
  rationale: ヘブライ人への手紙1章では御子と天上の天使たちが対比されているため、一般的な「使者」ではなく「天使」とした。
- source_word: πνεύματα
  choice: 風
  rationale: 語義には「風」と「霊」の両方があるが、詩編104:4の背景と「火の炎」との詩的並行から、本文では「風」を採用し、真正な曖昧さは脚注に残した。
- source_word: λειτουργοὺς
  choice: ご自分に仕える者たち
  rationale: 奉仕を行う者という意味を明確にしつつ、後代の教会職制を連想させうる専門的な訳語を避けた。文脈上は天使たちを指す。
- source_word: πυρὸς φλόγα
  choice: 火の炎
  rationale: 単数形と詩的な属格表現を保ち、簡潔で格調のある日本語とした。
- source_word: αὐτοῦ
  choice: ご自分の／ご自分に
  rationale: 神を指す所有・関係を日本語として自然に示し、同じ主語への再帰的な関係を明確にした。
theological_decisions:
- issue: 引用中のπνεύματαの意味
  choice: 本文では「風」
  alternative: 「霊」
  rationale: 原語は両義的だが、詩編のヘブライ語背景と「火の炎」との並行は「風」を支持する。ただし、天使を霊的存在として述べる読みも原語上可能なので脚注で明示し、解釈を完全には閉じない。
- issue: λέγειの暗黙の主語
  choice: 敬語表現により神を主語として示す
  alternative: 敬語を用いず「こう言います」とする
  rationale: 直前の文脈では語る方は神である。原文に明示的な主語名詞はないため引用導入部では「神」を補わず、尊敬表現によって自然に示した。一方、引用内では日本語の明瞭さのため「神は」を補った。
translation_notes:
  register: 明瞭で現代的かつ dignified な標準語。引用の詩的な並行を二行で示した。「奉仕者」よりも日常的に理解しやすい「仕える者たち」を用い、教会職制の含意を避けた。脚注記号[a]は該当語「風」の直後に置いた。
