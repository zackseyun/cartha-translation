  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: ja
  text: 御子は、受け継いだ名が天使たちの名よりも優れているのと同じほど、天使たちよりも優れた者となられました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「優れた」は「勝った」「より良い」とも訳せる。ここでは天使たちに対する地位の優越を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「受け継いだ名が天使たちよりも優れている」。日本語本文の「天使たちの名」は、比較されるのが名であることを文脈から補った表現である。ここでいう「名」の内容は、続く箇所で御子の子としての称号・身分として明らかにされる。
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: …分だけ、…はるかに
  rationale: 比例を示す相関構文を保ちつつ、日本語として自然に、御子の優越性と受け継いだ名の卓越性との対応を表した。反復される「はるかに」は比較の強さを明確にする。
- source_word: κρείττων
  choice: 優れた者
  rationale: ここでは道徳的な善さより、天使たちに対する地位・身分上の優越を表す。「より良い者」より文脈に適する。
- source_word: γενόμενος
  choice: なられました
  rationale: 「なった」という変化・到達の表現を保持し、尊敬表現によって御子を指すことを自然に示した。「造られた」という受動的・被造的含意は加えない。
- source_word: τῶν ἀγγέλων
  choice: 天使たちよりも
  rationale: 比較級に伴う属格を、現代日本語の自然な比較表現で訳した。
- source_word: διαφορώτερον
  choice: はるかに優れている
  rationale: 単なる相違ではなく、際立った卓越性を示す比較の意味を表した。
- source_word: παρ’ αὐτοὺς
  choice: 天使たちの名よりも
  rationale: 比較対象を日本語で明確にするため「名」を補った。ギリシア語では天使たち自身との比較とも形式上読めるため、その点は脚注で示す。
- source_word: κεκληρονόμηκεν
  choice: 受け継いだ
  rationale: 相続・継承による獲得を簡潔に表す。ギリシア語完了形の結果状態は、主節の現在的な優越性と日本語の文脈から伝わる。
- source_word: ὄνομα
  choice: 名
  rationale: 後続文脈が内容を明らかにするため、「御子という称号」などと先取りせず、原文の語を保った。
theological_decisions:
- issue: γενόμενοςが示す御子の変化
  choice: 「優れた者となられました」と訳し、到達した地位を表す動きを保持する。
  alternative: 「初めから優れておられます」として変化の表現を消す、または「造られました」と訳す。
  rationale: 原文の分詞は「なる」を意味するため、その語義を透明に残す。一方、この一節だけで御子が被造物である、または後に神性を得たと解釈する文言は加えない。
- issue: 「名」の意味
  choice: 本文では「名」とし、後続箇所が御子の子としての称号・身分を明らかにする流れを保つ。
  alternative: 本文で「『子』という称号」または「身分」と明示する。
  rationale: ὄνομαの文学的・神学的含みを保持し、1:5以降による説明を先取りしない。
- issue: παρ’ αὐτούςの比較対象
  choice: 本文では自然な意味として「天使たちの名よりも」と明示する。
  alternative: 「天使たちよりも」と直訳し、名と存在者との比較をそのまま残す。
  rationale: 「受け継いだ名が」という主語に対応する日本語として名同士の比較が最も明瞭だが、原文の形式的な曖昧さは脚注で保存する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。御子への敬意を自然な尊敬表現で示した。相関比較は日本語の可読性を優先して再構成しつつ、原文の比例関係を維持した。
