id: HEB.1.5
reference: Hebrews 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: ja
  text: 'というのも、神はかつて、天使たちのうちのだれに[a]、

    「あなたはわたしの子。

    わたしは今日、あなたを生んだ」[b]

    と言われたでしょうか。また、

    「わたしは彼の父となり、

    彼はわたしの子となる」[c]

    と言われたでしょうか。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「天使たちのうちのだれに、いつの時か言われたでしょうか」。
    reason: lexical_alternative
  - marker: b
    text: 詩篇2:7からの引用。「今日、あなたを生んだ」は、王の即位、復活、または父と子の永遠の関係に結びつけて理解されてきた。本文はそのいずれかに限定せず、引用の表現を保っている。
    reason: cross_reference
  - marker: c
    text: サムエル記第二7:14からの引用。直訳に近くは「わたしは彼にとって父となり、彼はわたしにとって子となる」。
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: 天使たちのうちのだれに
  rationale: 与格の疑問代名詞と部分属格の組み合わせを自然な日本語で表し、天使たちの中のいずれにも語られなかったという対比を保つ。文脈上、ἀγγέλων は人間の使者ではなく天上の天使を指す。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の主張を聖書の引用によって説明する論理的つながりを、現代日本語で明確に示す。
- source_word: εἶπέν ποτε
  choice: かつて……言われたでしょうか
  rationale: ποτε の「いつであれ一度でも」という修辞疑問の力を「かつて」で保ち、εἶπεν は引用を導く自然な敬語表現にした。
- source_word: Υἱός μου εἶ σύ
  choice: あなたはわたしの子
  rationale: 日本語として自然な語順で、直接呼びかけられる子としての関係をそのまま示す。日本語には英語のような大文字・小文字の区別がないため、表記による解釈は加えない。
- source_word: σήμερον
  choice: 今日
  rationale: 時間を表す語を解釈的に言い換えず、そのまま訳す。
- source_word: γεγέννηκά σε
  choice: あなたを生んだ
  rationale: γεννάω の出生・父子関係の比喩を保持しつつ、現代日本語で明瞭な表現とした。完了形の結果的な含みを日本語の不自然な時制表現で過剰に明示せず、引用句の解釈上の幅を残す。
- source_word: καὶ πάλιν
  choice: また
  rationale: 別の聖書引用を続けて提示する導入句として簡潔で自然である。
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: わたしは彼の父となり
  rationale: εἰς πατέρα の関係形成を「父となる」で保ち、日本語では不自然になりやすい逐語的な「彼にとって父となる」を避けた。
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: 彼はわたしの子となる
  rationale: 前半との均衡と契約的な父子関係を自然な日本語で表す。
theological_decisions:
- issue: 「今日、あなたを生んだ」の意味
  choice: 「生んだ」という語を保持し、王の即位、復活、受肉、または父と子の永遠の関係のいずれかに限定しない。
  alternative: 「今日、あなたを王として立てた」「今日、あなたの父となった」など、特定の解釈を本文に織り込む。
  rationale: ヘブライ人への手紙は詩篇2:7をキリスト論的議論に用いるが、この一節だけで比喩の指示対象を一つに確定するべきではない。原文の神学的緊張と解釈上の幅を保つ。
- issue: 二つの引用における「子」
  choice: どちらも「子」と訳し、文脈によるキリストへの適用は保ちながら、表記上の区別を作らない。
  alternative: 第一の引用だけを「御子」とし、第二を「子」とする。
  rationale: ギリシャ語の大文字・小文字に神学的区別を担わせることはできず、日本語で第一引用のみ「御子」とするなら原文にない解釈的差異が強まる。両引用がこの文脈で御子に適用されることは文そのものから明らかである。
- issue: 第二サムエル記7:14の契約的父子表現
  choice: 「彼の父となり／わたしの子となる」と訳す。
  alternative: 「彼にとって父となり／わたしにとって子となる」と逐語的に訳す。
  rationale: 関係を成立させる原文の力を「となる」で保ちながら、現代日本語として意味が明瞭な所有表現を用いる。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の発言には「言われた」を用いて品位を保った。引用は改行して詩的な並行を見やすくし、「御子」など解釈を強める専門的表記は避けた。
