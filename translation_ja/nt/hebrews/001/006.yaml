source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: ja
  text: そして、神は再び長子をこの世界に導き入れるとき[a]、こう言われます。「神の御使いたちは皆[b]、その方を礼拝せよ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そしてまた、長子をこの世界に導き入れるとき、こう言われます」。ギリシア語の「再び」は、「導き入れる」にも「言われます」にも係り得る。
    reason: alternative_reading
  - marker: b
    text: 別訳「神のすべての御使いたち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ～するとき
  rationale: 特定の出来事を示す時間節として、反復を強く示す「～するたび」ではなく「～するとき」とした。
- source_word: δὲ
  choice: そして
  rationale: 強い対立ではなく、議論を先へ進める穏やかな接続を表す。
- source_word: πάλιν
  choice: 再び
  rationale: 本文では語順に沿って「導き入れる」に係るものとした。ただし「こう言っています」に係る可能性も注で示した。
- source_word: εἰσαγάγῃ
  choice: 導き入れる
  rationale: 単なる移動だけでなく、中へ伴い入れる語感を保ちつつ、現代日本語として自然にした。
- source_word: τὸν πρωτότοκον
  choice: 長子
  rationale: 文脈上、御子を指す称号として用いられている。「長子」は出生順と卓越した地位の両方に関わり得る原語の響きを保つ。
- source_word: εἰς τὴν οἰκουμένην
  choice: この世界に
  rationale: οἰκουμένηは「人の住む世界」を指し得るが、ここでは自然で広い表現として「この世界」とした。
- source_word: λέγει
  choice: こう言っています
  rationale: 引用を導く現在形を保ち、主語を明示的に補わず、文脈から神を指す形にした。
- source_word: προσκυνησάτωσαν
  choice: 礼拝せよ
  rationale: 命令・勧告の力を明確に表す。ヘブライ人への手紙1章の文脈では、単なる敬礼より「礼拝」が適切である。
- source_word: αὐτῷ
  choice: この方を
  rationale: 直前の「長子」を受けることが日本語で明瞭になるよう、敬意ある指示表現とした。
- source_word: πάντες ἄγγελοι θεοῦ
  choice: 神の御使いたちは皆
  rationale: 属格関係と「すべて」の意味を自然な日本語の語順で表した。
theological_decisions:
- issue: πάλινが係る範囲
  choice: 「再び」は「導き入れる」に係る
  alternative: 「再び」は「言っています」に係る（「また、長子をこの世界に導き入れるとき、こう言っています」）
  rationale: ギリシア語は両方の構文を許す。本文では語順上自然な読みを採用し、実在する曖昧さを注に残した。
- issue: 御子に対するπροσκυνέωの意味
  choice: 「礼拝せよ」
  alternative: 「ひれ伏せ」「敬意を表せ」
  rationale: 御子が御使いたちにまさることを論じる文脈と、神のすべての御使いに向けた命令であることから、「礼拝」が動詞の力を最もよく表す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい端正さを保った。「長子」「御使い」「礼拝」は文脈上の神学的な響きを損なわない語として採用した。
