- from: 御子は、神の栄光の輝きであり、神の実在を正確に刻み出す刻印[a]です。また、力あることばによって万物を支えておられます。御子は、ご自身を通して[b]罪のきよめを成し遂げた後、高き所で[c]、大いなる方の右に座られました。
  to: 御子は、神の栄光の輝きであり、神の実在を正確に表す刻印[a]です。また、ご自身の力のことばによって万物を支えておられます。御子は、ご自身を通して[b]罪のきよめを成し遂げた後、高き所で[c]、大いなる方の右に座られました。
  rationale: 本文の二か所だけを安全に修正した。「ご自身の力のことば」はαὐτοῦを明示し、ῥῆμα τῆς δυνάμεως αὐτοῦの属格関係を保つ。「神の実在を正確に表す刻印」はχαρακτήρの刻印の比喩と原型への正確な対応を維持しつつ、自然な現代日本語に整える。高き所と大いなる方の右の関係は、原文の統語上の含みを狭めない既存の表現を保持した。脚注アンカーと内容は本文中の該当箇所に正しく対応している。
