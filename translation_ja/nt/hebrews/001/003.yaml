id: HEB.1.3
reference: Hebrews 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: ja
  text: 御子は、神の栄光の輝きであり、神の実在を正確に表す刻印[a]です。また、ご自身の力のことばによって万物を支えておられます。御子は、ご自身を通して[b]罪のきよめを成し遂げた後、高き所で[c]、大いなる方の右に座られました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の実在を正確に表す像」とも訳せます。「実在」は「本質」「実体」「存在」と訳すこともできます。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本には「ご自身を通して」がありません。ここではSBLGNTの本文に従って含めています。「ご自身によって」とも訳せます。
    reason: textual_variant
  - marker: c
    text: 「天の高みで」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: 輝き
  rationale: 光源から発する光輝という比喩を自然な現代日本語で表し、「反映」のように単なる映し返しと受け取られる表現を避けた。
- source_word: δόξα
  choice: 栄光
  rationale: 神の威光と誉れを含む語として定着しており、文脈の神学的重みも保つ。
- source_word: χαρακτήρ
  choice: 正確に刻み出す刻印
  rationale: 型を押して生じる印という具体的イメージと、原型への厳密な対応の両方を保つため。
- source_word: ὑπόστασις
  choice: 実在
  rationale: ここでは神の根底にある現実存在を示す。「本質」「実体」も可能だが、後代の教理用語を本文へ過度に持ち込まないため「実在」とした。
- source_word: φέρων
  choice: 支えておられます
  rationale: 万物を継続的かつ能動的に保持する意味を、分かりやすい現在の日本語で表す。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 被造世界全体に及ぶ包括性を簡潔で格調ある日本語として保つ。
- source_word: ῥῆμα τῆς δυνάμεως
  choice: 力あることば
  rationale: 力を帯びた発話によって万物を支えるという属格表現を、硬すぎない自然な日本語にした。
- source_word: δι’ αὑτοῦ
  choice: ご自身を通して
  rationale: SBLGNTが採る再帰代名詞を含む読みを本文に反映し、διάの媒介的な意味を明示した。
- source_word: καθαρισμός
  choice: きよめ
  rationale: 一般的な洗浄だけでなく、罪を扱う祭儀的・犠牲的含意を保つ。
- source_word: τῶν ἁμαρτιῶν
  choice: 罪の
  rationale: 属格の関係を簡潔に保ち、きよめが罪に対処するものであることを示す。
- source_word: ποιησάμενος
  choice: 成し遂げた後
  rationale: 主動詞「座られました」に先行する完了した行為として、アオリスト分詞の時間関係を明瞭に表した。
- source_word: ἐν δεξιᾷ
  choice: 右に
  rationale: 権威と栄誉の位置を示す慣用表現を保ちつつ、日本語で不自然な補語を増やさない形にした。
- source_word: ἡ μεγαλωσύνη
  choice: 大いなる方
  rationale: 神を婉曲に指す抽象名詞の人格的用法を、理解しやすく荘重な表現にした。
- source_word: ἐν ὑψηλοῖς
  choice: 高き所で
  rationale: 複数中性形による天上の領域を示し、簡潔で格調のある表現とした。
theological_decisions:
- issue: ὑπόστασιςのキリスト論的表現
  choice: 「神の実在」と訳す
  alternative: 「神の本質」「神の実体」「神の存在」
  rationale: 御子と神の現実存在との厳密な対応を保ちながら、後代の公会議で技術的意味を帯びた語をそのまま遡及的に本文へ入れることを避けた。
- issue: ἀπαύγασμαとχαρακτήρが示す御子の位置
  choice: 「栄光の輝き」「実在を正確に刻み出す刻印」という強い表現を保つ
  alternative: 「栄光の反映」「実在の表象」
  rationale: 御子を単に神を映す二次的存在と弱めず、原文が示す神の栄光への参与と神の実在への正確な対応を保持するため。
- issue: δι’ αὑτοῦを含む本文異読
  choice: SBLGNTに従い「ご自身を通して」を本文に含める
  alternative: この句を省く、または「ご自身によって」と訳す
  rationale: 指定された原語底本を優先しつつ、写本上の相違と可能な訳を脚注で明示して、読者に本文証拠を透明に示す。
- issue: 着座の場所と神の右という表現
  choice: 「高き所で、大いなる方の右に座られました」
  alternative: 「いと高き所におられる大いなる方の右に座られました」
  rationale: ἐν ὑψηλοῖςを着座の天上的領域として素直に読み、神の所在だけを限定するような解釈に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「御子」「万物」「高き所」「大いなる方」により聖書本文にふさわしい格調を保った。長いギリシア語一文は、日本語で関係を追いやすいよう三文に分けたが、分詞と主動詞の論理的・時間的つながりは維持した。
