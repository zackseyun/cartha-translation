id: HEB.1.12
reference: Hebrews 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: ja
  text: また、外套のように、あなたはそれらを巻き上げます。衣のように、それらは変えられます。しかし、あなたは変わることがなく[a]、あなたの年月は尽きることがありません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたは同じです」。
    reason: 「ὁ αὐτὸς」の字義的な表現を示し、継続的同一性という原文の含みを保持するため。
  - marker: b
    text: 別訳「あなたの年月は終わることがありません」または「絶えることがありません」。
    reason: ἐκλείπωが持つ「尽きる・終わる・絶える」という語義の幅を示すため。
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: 外套のように
  rationale: περιβόλαιονは身にまとって体を覆う衣を指す。現代日本語で衣服の比喩を明瞭に保つため「外套」とした。
- source_word: ἑλίξεις
  choice: 巻き上げられます
  rationale: ἑλίσσωの未来能動形で、巻く・畳むという動作を表す。天地を衣のように扱う詩的な像を「巻き上げる」で保ち、主語への敬意を敬語で示した。
- source_word: αὐτούς
  choice: それらを
  rationale: 前の文脈にある造られたもの、特に天を受ける男性複数代名詞。指示対象を過度に限定せず複数形を保持した。
- source_word: ὡς ἱμάτιον
  choice: 衣のように
  rationale: ἱμάτιονは衣服・上着を表す。「衣」は簡潔で格調があり、περιβόλαιονとの並行する衣服の比喩を保つ。
- source_word: ἀλλαγήσονται
  choice: 変えられます
  rationale: 未来受動態をそのまま受動表現にし、被造物が変化を受けることを示した。
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: しかし、あなたは変わることなく
  rationale: 変化する被造物との対照を「しかし」で示す。ὁ αὐτόςの継続的な同一性を自然な日本語で表しつつ、後代の専門的な神学用語は持ち込まない。
- source_word: τὰ ἔτη σου
  choice: あなたの年月
  rationale: 時間的な比喩を保ちつつ、日本語として自然な「年月」とした。
- source_word: οὐκ ἐκλείψουσιν
  choice: 尽きることがありません
  rationale: ἐκλείπωの「尽きる、終わる、絶える」という意味を表す。単なる不足ではなく、存続が終わらないことを明確にした。
theological_decisions:
- issue: キリスト論的引用における不変性の表現
  choice: あなたは変わることなく
  alternative: あなたは同じであり／あなたは変わりません
  rationale: 変化する被造世界と「あなた」の恒常性との対照を保つ。文脈上の神的恒常性は示すが、「不変性」などの組織神学的専門語で本文以上に規定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、詩編からの引用にふさわしい簡潔で荘重な調子を保った。神への二人称には「あなた」を用い、述語は敬語に統一した。
