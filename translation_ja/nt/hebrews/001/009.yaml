id: HEB.1.9
reference: Hebrews 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: ja
  text: あなたは義[a]を愛し、不法を憎んだ。それゆえ、神、あなたの神は、あなたの仲間たちにまさって、喜びの油をあなたに注がれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: 愛し
  rationale: アオリスト直説法を、引用文の格調を保ちつつ自然な日本語の過去表現として訳した。
- source_word: δικαιοσύνην
  choice: 義
  rationale: 道徳的な正しさを表す文脈に合い、聖書用語としても明瞭である。「正義」の含意もあり得るため脚注に残した。
- source_word: ἐμίσησας
  choice: 憎んだ
  rationale: 「愛した」との強い対照を弱めず、原語の直接的な意味を保った。
- source_word: ἀνομίαν
  choice: 不法
  rationale: 法に背くこと、法を顧みないことを直接表し、「義」との対照も保てる。
- source_word: διὰ τοῦτο
  choice: それゆえ
  rationale: 前半と油注ぎとの因果・推論関係を簡潔に示す。
- source_word: ἔχρισέν
  choice: 油を……注がれた
  rationale: 王の任職とメシア的含意を持つχρίωの具体的な油注ぎの比喩を保持した。神を主語とするため敬語表現を用いた。
- source_word: ὁ θεός, ὁ θεός σου
  choice: 神、すなわちあなたの神
  rationale: 神が油を注ぐ主体であることと、「あなたの神」という関係表現の双方を保ち、同格関係を自然な日本語で示した。
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: 喜びの油
  rationale: 祝福と祝いを表す聖書的な油注ぎの比喩を、現代日本語で分かりやすく保持した。
- source_word: παρὰ τοὺς μετόχους σου
  choice: あなたの仲間たちにまさって
  rationale: παράの比較の意味を明示し、μετόχουςをこの文脈で自然な「仲間たち」とした。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 正義
  rationale: この引用では人格的・道徳的な正しさが前面にあるため「義」を本文に採用したが、統治上の「正義」という含意を排除せず脚注に示した。
- issue: 御子に関して語られる「神、あなたの神」
  choice: 神、すなわちあなたの神
  alternative: 三位一体的関係を説明する意訳
  rationale: 神が油を注ぐ主体であり、その神が「あなたの神」と呼ばれる原文の表現をそのまま保ち、教理的な説明を本文に加えなかった。
- issue: 油注ぎにおける比較の範囲
  choice: あなたの仲間たちにまさって
  alternative: 仲間たちより多くの油を
  rationale: 比較が油の量だけを指すのか、油注ぎによる地位や喜びの卓越を指すのかを限定せず、原文の比較表現の幅を保った。
translation_notes:
  register: 詩編からの引用にふさわしい簡潔で格調ある調子を保ちながら、現代の一般読者にも明瞭な語順と語彙を用いた。「神、すなわちあなたの神」は原文の反復と同格関係を示すため、やや荘重な表現としている。
