source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: ja
  text: また、「主よ、あなたは初めに[a]地の基を据え、天はあなたの手のわざです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「初めの時に」。
    reason: κατ’ ἀρχάςの時間表現について、意味の近い別訳を示すため。
lexical_decisions:
- source_word: καί
  choice: また、こうあります
  rationale: 連続する引用に新たな引用を加える接続語として理解し、日本語でその働きが明瞭になるように訳した。「こうあります」は原文に明示された発話動詞ではないが、引用の開始を自然に示す最小限の補いである。
- source_word: Σὺ
  choice: あなたは
  rationale: ギリシア語で明示された強意的な代名詞を保ち、主への直接の呼びかけを明確にした。
- source_word: κατ’ ἀρχάς
  choice: 初めに
  rationale: 起源・開始時を示す慣用的な時の表現。創造の文脈にふさわしく、現代日本語でも自然である。語義上可能な別表現は脚注に示した。
- source_word: κύριε
  choice: 主よ
  rationale: 呼格であることを「よ」で示し、κύριοςの通常の訳語「主」を用いた。
- source_word: τὴν γῆν
  choice: 地
  rationale: 「天」と対をなす創造世界としての地を指す。「大地」より簡潔で、聖書的な天地の対句も保てる。
- source_word: ἐθεμελίωσας
  choice: 基を据え
  rationale: 土台を置くという建築的な比喩を保持しつつ、自然な日本語にした。
- source_word: ἔργα τῶν χειρῶν σού
  choice: あなたの御手の業
  rationale: 手によって造られたものという原文の擬人的な造形を保った。「御手」は主への敬意を示す定着した表現で、「業」は制作物を指す。
- source_word: οἱ οὐρανοί
  choice: 天
  rationale: 複数形を機械的に「諸天」とせず、天地創造の対句として日本語で自然な集合的表現「天」を選んだ。
theological_decisions:
- issue: 詩編102編で主に向けられた言葉を、ヘブライ人への手紙1章が御子に適用していること
  choice: 「主よ、あなたは」という直接の呼びかけをそのまま保持した。
  alternative: キリスト論的な含意を弱めるため、呼びかけを曖昧に訳す。
  rationale: 本文はκύριεを明示し、直前から御子についての引用として提示している。翻訳ではその構文と緊張を保ち、本文を越える教理的説明は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、旧約引用にふさわしい簡潔で格調ある文体とした。「御手の業」は原文の比喩を保つための聖書的表現だが、文全体は現代の読者に理解しやすい語順に整えた。
