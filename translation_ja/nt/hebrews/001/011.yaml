id: HEB.1.11
reference: Hebrews 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: ja
  text: それらは滅びます。しかし、あなたはとどまっておられます。それらはみな、衣のように古びていきます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣のように年老いていきます」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: この表現は詩編102編25～27節を踏まえ、造られたものの移ろいやすさと、呼びかけられている方が変わることなく存続することとを対照させている。
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: それらは
  rationale: 前節の「天」と「地」を受ける。日本語では無生物を指す「それら」が自然で、後続の「あなた」との対照も明確になる。
- source_word: ἀπολοῦνται
  choice: 滅びます
  rationale: 存在が終わるという強い意味を保ちつつ、外から滅ぼす主体を本文以上に特定しない。
- source_word: σὺ δὲ
  choice: しかし、あなたは
  rationale: 被造物と、直接呼びかけられている方との強い対照を明瞭に表す。
- source_word: διαμένεις
  choice: とどまっておられます
  rationale: 存続し続けることを表す。現在形を保ち、文脈上の永続性を示しつつ、「永遠に」など原文にない語は加えない。
- source_word: πάντες
  choice: それらはみな
  rationale: 前に述べられた被造物を集合的に指すことを、自然な日本語で明示する。
- source_word: ὡς ἱμάτιον
  choice: 衣のように
  rationale: ἱμάτιονを特定の衣服に狭めず、詩的なたとえを簡潔に保つ。
- source_word: παλαιωθήσονται
  choice: 古びていきます
  rationale: 年を経て古くなり、すり減る意味を衣の比喩に即して自然に表す。受動形を機械的に再現せず、状態変化として訳す。
theological_decisions:
- issue: 呼びかけられている方とキリスト論的含意
  choice: 「あなた」への直接の呼びかけを保つ
  alternative: 呼びかけの相手を「御子」と訳文中で明示する
  rationale: ヘブライ人への手紙1章の文脈ではこの引用は御子に向けられているが、この節自体の二人称をそのまま保ち、説明的な称号を本文に加えない。
- issue: 被造世界の滅びと、呼びかけられた方の存続との対照
  choice: 「滅びます」と「とどまっておられます」を対置する
  alternative: 「過ぎ去ります」と「永遠に存在します」とする
  rationale: 原文の強い対照を保ちながら、滅びの仕方や存続の期間を本文以上に詳しく規定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、詩編引用にふさわしい簡潔で格調ある調子を保った。神学的敬意が自然に伝わるよう「おられます」を用いたが、原文にない称号や教理的説明は本文へ加えていない。英語案では脚注[a]の位置と内容にずれがあるため、原語 παλαιωθήσονται に対応する「古びていきます」の後に配置した。
