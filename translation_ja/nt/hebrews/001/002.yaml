id: HEB.1.2
reference: Hebrews 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: ja
  text: この終わりの時代には、神は御子において[a]私たちに語られました。神はこの方をすべてのものの相続者に定め、この方を通して諸時代[b]をも造られました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「御子において」。原文の「御子」には冠詞がなく、神がどのような形で決定的に語られたかを際立たせています。「御子によって」と訳すこともできます。
    reason: lexical_alternative
  - marker: b
    text: 「諸時代」に当たる語は、「宇宙」または「世界」、すなわち時代を含む被造秩序全体を指すこともあります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: この終わりの時代には
  rationale: 直訳的な「これらの日々の終わりに」ではなく、終末論的な意味を保ちながら、現代日本語で明瞭な時の表現とした。
- source_word: ἐλάλησεν ἡμῖν
  choice: 私たちに語られました
  rationale: アオリストの完結した出来事を自然な日本語の過去形で表し、神への敬意を示す敬語を用いた。
- source_word: ἐν υἱῷ
  choice: 御子において
  rationale: ἐνの「において」という様態・領域の含みを残し、単なる代理者を示す「御子によって」に狭めなかった。ギリシア語に冠詞がない点は、日本語では冠詞によって再現できないため脚注で説明する。
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: この方をすべてのものの相続者に定め
  rationale: τίθημιの役割への任命・設定という意味を「定め」で表し、πάντωνの包括的範囲を「すべてのもの」とした。
- source_word: δι’ οὗ
  choice: この方を通して
  rationale: διά＋属格が示す媒介を、自然で明瞭な日本語にした。
- source_word: ἐποίησεν
  choice: 造られました
  rationale: ποιέωを、創造の文脈に適した「造る」で訳した。「創造する」より語義を過度に限定せず、対象が神によって存在するに至ったことを示す。
- source_word: τοὺς αἰῶνας
  choice: 諸時代
  rationale: αἰῶνεςの時間的な語形と複数性を本文に残した。この語が被造世界全体を指し得ることは脚注で示す。
theological_decisions:
- issue: ἐν υἱῷにおける御子の啓示的役割
  choice: 御子において
  alternative: 御子によって／ご自分の御子によって
  rationale: 神が御子を単なる伝達手段として用いたという意味に狭めず、御子において頂点に達した語りという修辞的・キリスト論的重みを保った。一方、原文にない所有表現「ご自分の」は本文へ補わなかった。
- issue: τοὺς αἰῶναςの範囲
  choice: 諸時代
  alternative: 宇宙／世界
  rationale: 時間的な諸時代と、それを含む被造秩序全体との間にある語義上の広がりを、本文と脚注を組み合わせて保った。御子の創造への関与を否定も限定もせず、原文以上に空間的意味へ固定しない。
- issue: 文法上省略された主語
  choice: 神は
  alternative: 主語を明示せず前節から続ける
  rationale: 主語は1節のὁ θεόςから継続している。単独の節としても明瞭に読めるよう日本語では補ったが、新たな解釈上の主体を導入したものではない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発話と創造には敬語を用いた。「御子において」と「諸時代」は日常語よりやや格調があるが、原文の神学的・語義的な幅を保つため採用し、脚注で補足した。
