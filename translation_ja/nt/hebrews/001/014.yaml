id: HEB.1.14
reference: Hebrews 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: ja
  text: 彼らは皆、仕える霊であり、救いを受け継ぐことになっている人々のために、奉仕のために遣わされているのではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「救いを受け継ぐ人々」。ギリシア語の表現には、将来に向かう意味があります。
    reason: μέλλοντας の未来志向を示し、本文の「ことになっている」より簡潔な未来的表現を代替訳として示すため。
lexical_decisions:
- source_word: οὐχὶ πάντες εἰσὶν
  choice: 彼らは皆……ではありませんか
  rationale: 肯定の答えを予期する修辞疑問を自然な現代日本語で表し、πάντεςの包括性も保つ。文脈上の指示対象である御使いたちを、解釈的に名詞化せず「彼ら」で受けた。
- source_word: λειτουργικὰ πνεύματα
  choice: 仕える霊
  rationale: λειτουργικόςが持つ公的・聖なる奉仕の含みを踏まえつつ、現代日本語で教会職制に限定されない表現とした。πνεύματαは御使いの霊的存在性を示すため「霊」とした。
- source_word: εἰς διακονίαν
  choice: 奉仕へと
  rationale: εἰςによる目的・方向性とδιακονίαの名詞形を保持する。「奉仕」は宗教的文脈にふさわしい品位を持ちながら、特定の教職を意味しない。
- source_word: ἀποστελλόμενα
  choice: 遣わされている
  rationale: 現在受動分詞の継続的・描写的な力を、日本語の受動継続表現で示した。「遣わす」は権威ある者から任務のために送られる含みを自然に伝える。
- source_word: διὰ τοὺς
  choice: 人々のために
  rationale: 対格を伴うδιάの理由・目的・受益の幅のうち、ここでは御使いの奉仕を受ける者との関係を示す受益的意味が文脈に適する。
- source_word: τοὺς μέλλοντας κληρονομεῖν
  choice: 受け継ごうとしている人々
  rationale: μέλλωの将来的・予期的な含みを保ちつつ、日本語で不自然な切迫性を過度に加えない表現とした。κληρονομεῖνの相続・嗣業の比喩は「受け継ぐ」で保持する。
- source_word: σωτηρίαν
  choice: 救い
  rationale: ヘブライ人への手紙における現在的かつ終末的な広がりを持つ標準的な訳語であり、原文以上に意味を限定しない。
theological_decisions:
- issue: μέλλοντας κληρονομεῖν σωτηρίαν の時間的・神学的含意
  choice: 救いを受け継ごうとしている人々
  alternative: 救いを受け継ぐことになる人々
  rationale: 救いを受け継ぐことが将来に向けて見込まれているというμέλλωの力を示す一方、予定や救いの確実性について原文以上の教理的断定を加えない。「受け継ごうとしている」は本人の意志だけを意味する可能性もあるため、脚注でより単純な未来表現を提示した。
- issue: λειτουργικὰ πνεύματα が指す存在
  choice: 本文では「仕える霊」と訳し、直前の文脈を「彼ら」で受ける
  alternative: 奉仕する御使いたち
  rationale: 文脈上は御使いを指すが、原文のπνεύματαという表現をそのまま保ち、存在論的説明を本文に追加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、修辞疑問、奉仕、派遣、救いの相続という原文の格調と比喩を保持した。「奉仕へと遣わされている」はやや改まった表現だが、λειτουργικάとδιακονίαの二つの奉仕語を区別し、文の神学的な重みを損なわないために採用した。
