source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: ja
  text: 'しかし、御子についてはこう言われます。[a]


    「神よ、あなたの王座は世々限りなく続き、


    公正の笏[b]は、あなたの王国の笏である。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（可能性は低い）：「神は、世々限りなくあなたの王座である。」ギリシア語の構文には議論があるが、ここでは「神よ」という直接の呼びかけが文脈と引用の趣旨に最もよく合う。
    reason: alternative_reading
  - marker: b
    text: 「公正」は「正しさ」または「義」とも訳せる。ギリシア語は、曲がりのないこと、正直さ、正しさを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: しかし、御子についてはこう言われます
  rationale: 前節までの御使いたちとの対比を「しかし」で示し、πρός＋対格の言及対象を「御子については」と表した。原文で省略されている発話動詞は、引用を自然に導入するため受動敬語の「こう言われます」で補った。
- source_word: υἱόν
  choice: 御子
  rationale: 定冠詞を伴う称号的用法。文脈上、神の子を指すため、現代日本語の聖書文体として明瞭で敬意のある「御子」とした。
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: 神よ、あなたの王座は
  rationale: ὁ θεόςを呼格的な直接呼びかけと理解した。語順は日本語として自然になるよう呼びかけを先に置いた。述語「続く」は次の永続表現と合わせて補った。統語上可能な別解は脚注[a]に残した。
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: 世々限りなく続き
  rationale: 終わりのない持続を表す慣用句。尊厳を保ちながら現代の読者にも意味が明瞭な「世々限りなく」を用い、王座について日本語の文を成立させるため「続き」を補った。
- source_word: ῥάβδος
  choice: 笏
  rationale: 王権を象徴する杖を指すため、一般的な杖ではなく王の権威を表す「笏」とした。
- source_word: τῆς εὐθύτητος
  choice: まっすぐさの
  rationale: εὐθύτηςの基本的な意味である直正さ、曲がりのなさを保ち、δικαιοσύνηとの語彙上の区別も見える「まっすぐさ」を採用した。「正義」も文脈上可能なので脚注[b]に示した。
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: あなたの王国の笏
  rationale: βασιλείαを領域・支配の双方を含み得る「王国」と訳し、原文の反復と所有関係を保持した。
theological_decisions:
- issue: ὁ θεόςを御子への直接の呼びかけと取るか、「神があなたの王座である」と取るか
  choice: 「神よ、あなたの王座は」
  alternative: 「神は、世々限りなくあなたの王座である」
  rationale: 定冠詞付き主格形が呼格の働きをする用法として理解するのが、詩篇引用の語りかけとヘブライ人への手紙1章の対比的な論旨に最もよく合う。ただし別の統語解析も可能なため、本文で断定的に解消せず脚注[a]に保存した。
- issue: εὐθύτηςを倫理・司法的な「正義」と訳すか、語の形象を保つか
  choice: 「まっすぐさ」
  alternative: 「正義」または「正しさ」
  rationale: 語の中心的な像である直さを本文に保った。王の公正な統治を指す「正義」という理解も自然であり、脚注[b]に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、詩的な王権表現の尊厳を保った。「御子」「王座」「笏」は引用の荘重さと文脈上の称号・象徴性に適する。「世々限りなく」はやや文語的だが広く理解でき、原文の強調された永続性を簡潔に伝える。脚注記号[a]は引用導入文の末尾に、[b]は該当語を含む引用文の末尾に置いた。
