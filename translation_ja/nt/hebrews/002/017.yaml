id: HEB.2.17
reference: Hebrews 2:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: ja
  text: それゆえ、彼はすべての点で兄弟たちと同じようにならなければなりませんでした[a]。これは、神に関わる事柄において憐れみ深く忠実な大祭司となり、民の罪を贖うためでした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語は男性複数形の「兄弟たち」だが、このような家族を表す語は、文脈によって女性を含むことがある。
    reason: lexical_alternative
  - marker: b
    text: 「民の罪を償うため」、または「民の罪のために（神の怒りを）なだめるため」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: そこで
  rationale: 直前の議論から導かれる帰結を、自然な現代日本語で示す。
- source_word: ὤφειλεν
  choice: ならなければなりませんでした
  rationale: 救いの目的に伴う必然性・責務を表し、外的な強制とまでは限定しない。
- source_word: κατὰ πάντα
  choice: あらゆる点で
  rationale: 類似の包括的な範囲を自然かつ明確に保つ。
- source_word: τοῖς ἀδελφοῖς
  choice: 兄弟たち
  rationale: 原文の男性複数の家族語を保持する。文脈上、神の家族に属する男女を含み得ることは脚注で示す。
- source_word: ὁμοιωθῆναι
  choice: 同じようになる
  rationale: 受動形の意味を日本語として自然に表し、人間性への参与という文脈に適合させる。
- source_word: ἵνα
  choice: それは……ためでした
  rationale: 目的を明瞭に表す。
- source_word: ἐλεήμων
  choice: 憐れみ深い
  rationale: 祭司的文脈にふさわしい、分かりやすく品位ある定訳を用いる。
- source_word: πιστὸς
  choice: 忠実な
  rationale: 神の前での祭司としての信実さと確かさを表す。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: ユダヤ教祭儀上の称号として確立した日本語訳。
- source_word: τὰ πρὸς τὸν θεόν
  choice: 神に関わる事柄において
  rationale: 神に対する祭司的務めの領域を示す原文のやや改まった表現を保持する。
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: 償うため
  rationale: 罪を祭司的に処理する行為を一般読者に分かる語で示し、神の怒りをなだめる側面か罪を除く側面かに一義的に狭めない。
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: 民の罪
  rationale: 定冠詞を日本語では明示せず、民に属する罪という関係を簡潔に表す。
theological_decisions:
- issue: ἱλάσκεσθαι が示す贖罪行為の範囲
  choice: 民の罪を償う
  alternative: 民の罪を贖う／民の罪のためになだめを行う
  rationale: 祭司的な贖罪行為を平易に示しつつ、罪の除去と神に対するなだめのどちらか一方に意味を限定しない。代替表現を脚注に残す。
- issue: ἀδελφοῖς の性と指示範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原文の男性複数形を本文で保持しながら、文脈上は信仰共同体の女性を含み得ることを脚注で明示する。
- issue: ὤφειλεν の必然性
  choice: ならなければなりませんでした
  alternative: なる必要がありました
  rationale: 神の救いの計画に伴う必然性を保つが、キリストが意に反して強制されたという意味には解さない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭司的な厳かさを保った。「大祭司」は定着した聖書用語として維持し、文を二つに分けて長いギリシア語文の論理関係を読み取りやすくした。
