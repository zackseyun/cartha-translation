  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: ja
  text: というのも、神は、私たちが今語っている来たるべき世界を、御使いたちの支配の下に置かれたのではありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: というのも……ではありません
  rationale: γάρが前の議論を受けて理由を示す働きを「というのも」で表し、οὐの否定を述語に自然に反映した。
- source_word: ἀγγέλοις
  choice: 御使いたちに
  rationale: 直近の文脈では人間の使者ではなく天的存在を指すため、日本語聖書で広く理解される「御使い」を用いた。
- source_word: ὑπέταξεν
  choice: 従わせた
  rationale: 権威や支配の下に置く意味を、明瞭で自然な現代日本語で表した。
- source_word: τὴν οἰκουμένην
  choice: 世界
  rationale: ここでは人の住む世界・世界秩序を指しうるが、本文では簡潔で自然な「世界」とし、語義の幅は脚注に残した。
- source_word: τὴν μέλλουσαν
  choice: 来たるべき
  rationale: 未来に到来する世界という終末論的方向性を保ちつつ、荘重で理解しやすい表現とした。
- source_word: περὶ ἧς λαλοῦμεν
  choice: 私たちが今語っている
  rationale: 現在形の継続的な談話指示を「今語っている」で自然に示し、関係節として修飾先を明確にした。
theological_decisions:
- issue: 「来たるべき世界」の指示対象
  choice: 将来到来する世界または世界秩序を指す表現として訳す
  alternative: 現在の人の住む地一般、または特に福音時代を指すと限定する
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν は自然には将来の世界を指す。本文ではその具体的な時代区分や様態を限定せず、詩篇8篇をめぐる人間、御子、御使いの支配関係にある神学的緊張を保持した。
- issue: 省略された主語
  choice: 文脈上の主語を「神」と明示する
  alternative: 主語を省略する、または受動文にする
  rationale: ギリシア語の動詞に主語名詞は明記されていないが、文脈上、世界を従わせる主体は神である。日本語で能動構文を明瞭に保つため「神」を補ったが、新たな解釈上の限定は加えていない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「来たるべき」「御使い」によって聖書本文としての品位を保った。「というのも」で前節との論理的連結を明示し、過度な教派的解釈は避けた。
