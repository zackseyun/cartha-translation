source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: ja
  text: 'しかし、ある人が聖書のある箇所で、こう証言しています。[a]


    「人とは何者なので、あなたは人を心に留めてくださるのか。

    人の子[b]とは何者なので、あなたは人の子を顧みてくださるのか。[c]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ある人がどこかで」。これは引用箇所を知らないという意味ではなく、出典名を挙げずに聖書の言葉を導入する表現です。引用は詩編8章4節です。
    reason: translation_clarity_and_cross_reference
  - marker: b
    text: 「人の子」は、詩編8編では「人」と並んで人間を指す詩的表現です。一方、ヘブライ人への手紙では、後の文脈によってイエスとの結び付きも示されます。
    reason: cross_reference_and_theological_ambiguity
  - marker: c
    text: 「顧みる」と訳したギリシア語には、「訪れる」「世話をする」という意味もあり、訪れて心を配ることを表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: 証言しています
  rationale: 強く証言する、あかしするという意味を保ちつつ、聖書の証言が現在の議論にも効力を持つことを自然な現代日本語で表した。
- source_word: δέ
  choice: しかし
  rationale: 前節からの穏やかな対照と論の転換を示す。
- source_word: πού τις
  choice: ある人が聖書のある箇所で
  rationale: 直訳的な「ある人がどこかで」では日本語で話者の無知を示すように響きやすいため、既知の聖書引用を出典名なしで導入する慣用表現として訳した。「聖書の」は引用導入という文脈からの明示化である。
- source_word: λέγων
  choice: こう証言しています
  rationale: 分詞の「言って」を、引用を自然に導入する日本語に統合した。
- source_word: Τί ἐστιν ἄνθρωπος
  choice: 人とは何者なので
  rationale: ἄνθρωποςの人類一般を代表する単数形と、詩的な問いの形を保った。
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: これを心に留めてくださる
  rationale: 単なる想起ではなく、覚えて配慮する含みを持つ。「くださる」により、神に向けた詩的な問いとして自然にした。代名詞は性別を不必要に限定しない「これ」とした。
- source_word: υἱὸς ἀνθρώπου
  choice: 人の子
  rationale: 詩編8編の人間一般を指す詩的並行表現を保ちつつ、ヘブライ人への手紙の文脈でイエスへと結び付く響きも消さない。
- source_word: ἐπισκέπτῃ αὐτόν
  choice: これを顧みてくださる
  rationale: 訪れて注意を向け、世話をするという動詞の幅を、簡潔で格調ある「顧みる」によって表した。
theological_decisions:
- issue: 「人の子」を明示的なメシア称号として訳すか
  choice: 本文では「人の子」とし、称号であることを示す特別な表記を加えない。
  alternative: 「人間」などと一般化する、またはイエスの称号であることを明示する。
  rationale: 引用元の詩編8編では人間を指す詩的表現だが、ヘブライ人への手紙の後続文脈ではイエスとの関係が明らかになる。本文でどちらか一方に限定せず、その神学的な重なりを保つ。
- issue: 神の行為を「顧みる」とするか「訪れる」とするか
  choice: 本文では「顧みてくださる」とした。
  alternative: 「訪れてくださる」または「世話をしてくださる」。
  rationale: ἐπισκέπτομαιには訪問と配慮の両面がある。ここでは神の注意深い関心を自然に伝えながら、語義の幅は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、詩編引用には簡潔で dignified な調子を持たせた。「人の子」は伝統的な響きを保つが、脚注で原文脈とヘブライ人への手紙における広がりを説明した。
