  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: ja
  text: というのも、確かにこの方が助ける[a]のは、天使たちではなく、アブラハムの子孫です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「つかまえる（取る）」。このギリシア語は、ここでは「手を差し伸べて助ける」という意味で用いられていると考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: 確かに
  rationale: 話し手が聞き手にも明白だとみなしていることを強調する語であり、現代日本語で自然な「確かに」によって、その推論的・強意的な響きを表した。
- source_word: ἀγγέλων
  choice: 御使いたち
  rationale: 天的存在である天使を指す一般的な聖書用語として「御使い」を用い、複数形を「たち」で示した。
- source_word: ἐπιλαμβάνεται
  choice: 助ける
  rationale: 字義的には「つかむ、捕らえる」だが、この文脈では救うために手を差し伸べる、援助するという慣用的意味が適切である。字義的な可能性は脚注に残した。
- source_word: σπέρματος Ἀβραὰμ
  choice: アブラハムの子孫
  rationale: σπέρμαは単数形の集合名詞として、アブラハムに属する子孫を表す。「子孫」は現代日本語として自然であり、集合的な意味も保てる。
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: というのも……ではなく……だからです
  rationale: γάρの説明的なつながりと、οὐ ... ἀλλάの強い対照を、日本語として自然な構文で明示した。
theological_decisions:
- issue: ἐπιλαμβάνεταιがキリストの救いの働きをどのように表すか
  choice: 御使いたちではなくアブラハムの子孫を「助ける」と本文で訳す。
  alternative: アブラハムの子孫を「つかむ／引き受ける」と訳し、人性を取ったことへの含みを強くする。
  rationale: 直近の文脈では、人間と連帯した御子の救助の働きが論じられているため、「助ける」が慣用的意味として最も自然である。ただし、受肉との関連を読み取る伝統的理解にもつながる字義的な「つかむ」を脚注に示し、解釈上の緊張を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」は文脈上の御子を指すが、原文にない固有の称号を本文へ補わないための表現。「御使い」は聖書文体として広く理解される語を採用した。
