id: HEB.2.2
reference: Hebrews 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: ja
  text: というのも、御使いたちを通して語られたことばが確かなものとなり[a]、すべての違反と不従順が相応の報いを受けたのであれば[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: おそらく、ユダヤの伝承で御使いたちを介して授けられたと理解された律法を指す。使徒の働き7章53節、ガラテヤ人への手紙3章19節参照。
    reason: cross_reference
  - marker: b
    text: 別訳「正当な報い」または「当然の返報」。文脈上は処罰を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: 御使いたちを通して語られたことば
  rationale: λόγοςを文脈上の神的な伝達内容として「ことば」とし、διά＋属格の媒介・手段を「通して」で保った。λαληθείςは自然に「語られた」と訳した。
- source_word: ἀγγέλων
  choice: 御使いたち
  rationale: 文脈では人間の使者ではなく、律法授与に関するユダヤ的伝承における天的存在を指す可能性が高い。「天使」より聖書本文の格調になじむ「御使い」を採用した。
- source_word: ἐγένετο βέβαιος
  choice: 確かなものとなり
  rationale: 語られたことばが有効で揺るがないものとして成立したという結果的な意味を表す。「拘束力を持ち」と限定せず、原文の意味幅を保った。
- source_word: πᾶσα παράβασις
  choice: すべての違反
  rationale: παράβασιςは定められた境界や命令を踏み越えることを表す。「違反」は現代日本語で明瞭に法的・契約的含意を伝える。
- source_word: παρακοὴ
  choice: 不従順
  rationale: 聞き従わないことから生じる不服従を表し、παράβασιςと並ぶ道徳的・法的意味を保持する。
- source_word: ἔλαβεν
  choice: 受けた
  rationale: 各々の違反と不従順を主語とする原文の構造を保ち、報いとの自然な連語にした。
- source_word: ἔνδικον μισθαποδοσίαν
  choice: 相応の報い
  rationale: ἔνδικοςの正当・当然という含意と、μισθαποδοσίαの返報・報償という意味を合わせて表す。「刑罰」と断定せず、文脈上は不利な報いであることを保ちながら語の返報性も残した。
theological_decisions:
- issue: 「御使いたちを通して語られたことば」の指示対象
  choice: 本文では律法と明示せず、御使いたちを媒介として語られたことばと訳す
  alternative: シナイの律法と明示する
  rationale: 文脈とユダヤ的伝承は律法を強く示唆するが、ギリシア語本文自体はλόγοςとだけ述べるため、同定は脚注に置いて本文の含みを保った。
- issue: ἔνδικον μισθαποδοσίανの性格
  choice: 相応の報い
  alternative: 正当な刑罰
  rationale: 当該文脈では処罰的意味が明白だが、μισθαποδοσία自体の「返報・報い」という語義を保ち、ἔνδικονを「相応の」で表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書本文としての品位を保った。「御使い」「ことば」は穏当な聖書語彙だが、文全体は過度に文語的にしなかった。後続する2章3節へ続く条件節なので、末尾を「のであれば、」として未完の構文を保持した。
