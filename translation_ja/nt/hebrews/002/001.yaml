  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: ja
  text: ですから私たちは、聞いたことがらにいっそう注意を払わなければなりません。私たちが漂い去ってしまわないように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「漂い過ぎてしまう」「（聞いたことがらを）取り逃がしてしまう」とも訳せます。ギリシア語の動詞は、流れに乗って漂い去る、あるいは何かのそばを通り過ぎるイメージを含みます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: だからこそ
  rationale: 直前の論述から導かれる理由と結論のつながりを、現代日本語で自然かつ力強く示す。
- source_word: δεῖ
  choice: ～なければなりません
  rationale: 単なる勧めではなく必要性を表し、ἡμᾶςを「私たちは」と明示する。
- source_word: περισσοτέρως
  choice: いっそう
  rationale: 比較・強意の働きを簡潔に保ち、直前までに述べられたことを受けて注意の度合いを増す意味を示す。
- source_word: προσέχειν ἡμᾶς
  choice: 私たちは…注意を払わなければなりません
  rationale: 注意を向け、心に留めるという意味を、明瞭で自然な現代日本語にする。
- source_word: τοῖς ἀκουσθεῖσιν
  choice: 聞いたことに
  rationale: 完了受動分詞を実体的に捉え、すでに聞いて今なお関わりを持つ内容を示す。「教え」や「福音」と限定せず、原文の幅を保つ。
- source_word: μήποτε
  choice: ～ことがないためです
  rationale: 起こり得る否定的結果への警告を自然な日本語で表す。
- source_word: παραρυῶμεν
  choice: 押し流されて離れてしまう
  rationale: 流れによって漂流し、通り過ぎ、離れるという比喩を保つ。「押し流される」だけよりも、聞いた内容から離れるという文脈上の危険が伝わる。
theological_decisions:
- issue: παραρυῶμενにおける警告の比喩と主体
  choice: 聞いた者である「私たち」が押し流されて離れるという警告として訳す
  alternative: 聞いたことが私たちからこぼれ落ちる、または私たちがそれを通り過ぎる
  rationale: 一人称複数の動詞と警告の文脈を踏まえ、聞き手の危険な移動を本文に示す。ただし動詞が持つ「漂い過ぎる」「滑り去る」という幅は注で残し、背教について特定の教理的結論を加えない。
translation_notes:
  register: 明瞭で現代的な敬体を用いつつ、勧告の厳粛さを保った。「だからこそ」で直前との論理的連続を示し、比喩は説明に置き換えず本文と注で保持した。
