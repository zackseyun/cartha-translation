  terminology: Διὰ τοῦτοは「ですから」、δεῖは「～なければなりません」、περισσοτέρωςは「いっそう」、προσέχεινは「注意を払う」で適切です。παραρυῶμενは本文では「漂い去る」として比喩を保ち、二つの可能な方向性は注で提示するのが安全です。
