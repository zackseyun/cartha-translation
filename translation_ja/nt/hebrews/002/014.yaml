id: HEB.2.14
reference: Hebrews 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: ja
  text: それゆえ、子どもたちが血と肉[a]にあずかっているので、この方ご自身も同じように、同じものにあずかられました。それは、ご自分の死によって、死の力を持つ者、すなわち悪魔を無力にする[b]ためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉と血」とも訳せる。ギリシア語の語順は「血と肉」。
    reason: lexical_alternative
  - marker: b
    text: 「滅ぼす」とも訳せる。この動詞は、存在を消滅させるというより、「力を失わせる」「無効にする」「廃する」という意味にもなる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: それゆえ、…ので
  rationale: οὖνの推論的なつながりと、ἐπείの理由を示す働きの両方を、自然な日本語で表した。
- source_word: τὰ παιδία
  choice: 子どもたち
  rationale: 直前の文脈にある、御子に与えられた「子どもたち」を指す語として、過度な解釈を加えず平明に訳した。
- source_word: κεκοινώνηκεν
  choice: 共にしている
  rationale: 血と肉にあずかっている結果的・継続的な状態を表す完了形を、現代日本語で自然に示した。
- source_word: αἵματος καὶ σαρκός
  choice: 血と肉
  rationale: 原文の語順を保持した。ここでのσάρξは比喩的な「罪深い性質」ではなく、人間の身体的存在を指す「肉」である。
- source_word: παραπλησίως
  choice: 同じように
  rationale: 真の類似と参与を示しつつ、完全な同一性まで語に読み込まない表現とした。
- source_word: μετέσχεν τῶν αὐτῶν
  choice: それらを身に受けられました
  rationale: 同じ血と肉に実際にあずかったことを自然に表し、先行するκοινωνέωとの語の違いも保った。敬語は指示対象への自然な敬意を示す。
- source_word: διὰ τοῦ θανάτου
  choice: ご自分の死によって
  rationale: διά＋属格の手段の意味を明確にした。日本語では行為者との関係を明らかにするため「ご自分の」を補った。
- source_word: καταργήσῃ
  choice: 無力にする
  rationale: 存在を消滅させるというより、働く力を失わせる意味を明確にした。可能な伝統的訳は脚注に示した。
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: 死の力を持つ者
  rationale: κράτοςの「力・支配力」を過度に説明せず、原文の属格構造を簡潔に保った。
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: すなわち悪魔
  rationale: 先の「者」が誰かを明示する同格表現を、そのまま自然な日本語にした。
theological_decisions:
- issue: キリストが人間の血と肉にあずかったこと
  choice: 「この方ご自身も同じようにそれらを身に受けられました」
  alternative: 「この方も彼らと同じ人間性を共有されました」
  rationale: 原文のπαραπλησίωςと、前半とは異なる動詞μετέχωを反映し、真の参与を肯定しながら、後代の教理用語を本文へ持ち込まないようにした。
- issue: καταργήσῃが悪魔について意味すること
  choice: 「無力にする」
  alternative: 「滅ぼす」
  rationale: 悪魔の存在そのものの消滅を断定せず、力や働きを無効にするという語の意味を優先した。「滅ぼす」も可能なため脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」は文脈上の御子を指し、原文にない固有名を補わない。原文の「血と肉」の語順を本文に残し、日本語で一般的な「肉と血」は脚注に示した。
