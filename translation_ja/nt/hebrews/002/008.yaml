  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: ja
  text: 「あなたは、すべてのものを彼[a]の足の下に従わせた。」というのは、すべてのものを彼に従わせるにあたって、彼に従属していないものを何一つ残さなかったからである[b]。しかし今、私たちは、すべてのものが彼に従属しているのを、まだ見ていない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼」は詩篇8篇の表現を受け継いでいる。詩篇本来の文脈では人間を指しうる一方、ヘブライ人への手紙ではイエスに適用されている。
    reason: cross_reference
  - marker: b
    text: 別訳「すべてのものを彼に従わせたとき、彼に従属していないものを何一つ残さなかった。」このギリシア語の構文は、時間を表すものとしても訳すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: すべてのもの
  rationale: 中性複数形の包括的な範囲を保ち、この節で繰り返される全体性を明瞭に示す。
- source_word: ὑπέταξας / ὑποτάξαι / ὑποτεταγμένα
  choice: 従わせた／従っている
  rationale: 同じ語群による反復をできる限り保つ。末尾の完了受動分詞は、従属させられた結果としての状態を自然な日本語で「従っている」とした。
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: 彼の足の下に
  rationale: 支配と服従を表す聖書的な比喩を、そのまま理解できる日本語で保持する。
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: 従わせたということは
  rationale: 直後の文がその行為の含意を説明する論理的なつながりを自然に示す。時間的な訳も可能なので脚注に残す。
- source_word: οὐδὲν ἀφῆκεν ... ἀνυπότακτον
  choice: 彼に従わないものを何一つ残さなかった
  rationale: 二重否定的な全称表現を明瞭な日本語にしつつ、従属から除外されたものが皆無であるとの主張を保つ。
- source_word: νῦν δὲ οὔπω ὁρῶμεν
  choice: しかし今、私たちは……まだ見ていない
  rationale: 宣言された支配と現在の目に見える現実との対比、および「まだ」という未完了の緊張を保つ。
theological_decisions:
- issue: αὐτοῦ／αὐτῷ（「彼」）の指示対象
  choice: 本文では一貫して「彼」とし、指示対象を限定しない。
  alternative: 詩篇8篇における人間、またはヘブライ人への手紙の適用における御子イエスと明示する。
  rationale: 引用元の詩篇では人間を指しうる一方、著者の議論はイエスへと適用する。本文で一方に限定せず、解釈上・神学上の重なりを保持する。
- issue: 宣言された万物の服従と現在の観察との関係
  choice: 「しかし今」「まだ見ていない」と訳し、両者の緊張をそのまま残す。
  alternative: 将来の成就や霊的な成就を本文に補って説明する。
  rationale: 原文は成就の仕方をここで説明せず、普遍的な服従の宣言と現状との対比を提示しているため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、引用部分には簡潔で格調ある響きを保った。「服従」より日常的に理解しやすい「従う／従わせる」を選び、原文の同語反復を可能な範囲で再現した。
