id: HEB.2.9
reference: Hebrews 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: ja
  text: しかし、しばらくの間、御使いたちより低くされた方、イエスを、私たちは見ています。イエスは死の苦しみのゆえに、栄光と誉れの冠を授けられました。それは、神を離れて[a]、すべての人のために死を味わうためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異読に「神の恵みによって」とある。
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: しばらくの間
  rationale: 詩篇8篇を踏まえた文脈では、程度よりも期間を表すと解するのが自然であり、イエスが御使いたちより低い状態に置かれた期間が限られていたことを示す。
- source_word: παρ’ ἀγγέλους
  choice: 御使いたちより
  rationale: 比較表現におけるπαρά＋対格の意味を明確に表した。「御使い」は聖書本文にふさわしく、現代日本語でも理解可能な語である。
- source_word: ἠλαττωμένον
  choice: 低くされた
  rationale: 受動の意味と比較関係を保ち、単なる内面的な謙遜へ限定しない表現とした。
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: 死の苦しみのゆえに
  rationale: 対格を伴うδιάを理由として取り、イエスが栄光と誉れを受けたのは死の苦しみのゆえであるという構文を保った。
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: 栄光と誉れの冠を授けられました
  rationale: στεφανόωの冠の比喩と受動態を明瞭な日本語で表し、高挙の主題を保った。
- source_word: ὅπως
  choice: それは……ためでした
  rationale: 目的を表す接続関係を自然な日本語で明示しつつ、結果の含みも排除しない表現とした。
- source_word: χωρὶς θεοῦ
  choice: 神を離れて
  rationale: 指定されたSBLGNT本文を優先して直訳に近く表した。意味上・神学上の難しさを解消するための補足は加えず、異読は脚注に示した。
- source_word: ὑπὲρ παντός
  choice: すべての人のために
  rationale: ὑπέρの代理・利益の意味を「ために」で表した。παντόςは文法上「すべてのもの」とも取り得るが、文脈上は人を指す分配的表現と判断した。
- source_word: γεύσηται θανάτου
  choice: 死を味わう
  rationale: 原文の比喩を保持し、日本語でも理解できる定着した表現を用いた。
theological_decisions:
- issue: 目的節における本文異読
  choice: 神を離れて（χωρὶς θεοῦ）
  alternative: 神の恵みによって（χάριτι θεοῦ）
  rationale: 指定された原語資料SBLGNTの本文を主文に採用した。異読は文脈上自然で広く採用されているが、原語資料の読みを黙って置き換えず、重要な異読として脚注に保存した。
- issue: ὑπὲρ παντόςの範囲
  choice: すべての人のために
  alternative: すべてのもののために
  rationale: 単数παντόςには人と物の双方の可能性があるものの、イエスが他者に代わって死を味わうという文脈から人格的・分配的に訳した。ただし、この訳によって救済の適用範囲に関する特定の教派的体系までは読み込まない。
translation_notes:
  register: 明瞭で現代的ながら品位のある文体とした。「御使い」「誉れ」は聖書的な文脈を保ちつつ一般読者にも理解可能な語として採用した。長いギリシア語構文は二文に分け、目的節との関係を「それは」で示した。
