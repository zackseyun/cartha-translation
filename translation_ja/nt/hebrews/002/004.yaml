source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: ja
  text: 神もまた、しるしと不思議、さまざまな力あるわざ[a]、また、ご自分のみこころに従った聖霊の分け与え[b]によって、証しを添えられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「さまざまな力」または「さまざまな力強いわざ」。ギリシア語は力の現れを意味し、この文脈では奇跡的なわざを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖霊の分配」または「聖霊の割り当て」。原文には「賜物」という語は明記されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος
  choice: 神もまた……証しを添えられました
  rationale: 前節の「確かなものとされました」に伴う同時的な分詞であり、神が宣教者たちの証言に証しを加えたことを表す。συν-の共同・付加の含みを、自然な日本語の「もまた」「添えられました」で示した。
- source_word: σημείοις τε καὶ τέρασιν
  choice: しるしと不思議
  rationale: 神の証しの手段を表す与格。定着した対句として、証拠となる行為と驚異を生じさせる行為の両面を保った。
- source_word: ποικίλαις δυνάμεσιν
  choice: さまざまな力あるわざ[a]
  rationale: δύναμιςの基本的な「力」と、この文脈での超自然的な力の現れという意味をともに伝える。「奇跡」だけに限定せず、語の幅を脚注でも保持した。
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: 聖霊の分け与え[b]
  rationale: μερισμοῖςは分配・割り当てを表す。「賜物」は原文に明記されていないため本文に補わず、日本語として理解可能な「分け与え」とした。
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: ご自分のみこころに従った
  rationale: κατά＋対格の一致・基準を表す。αὐτοῦは文の主体である神を指すのが最も自然であり、「ご自分」でその照応を示した。語順に従い、特に「聖霊の分け与え」に結びつく形を保った。
theological_decisions:
- issue: 「ご自分」の指示対象
  choice: 証しをなさる神を指す
  alternative: 聖霊を指すと広く捉える可能性
  rationale: 統語上の支配的な主体は「神」であり、再帰的な「ご自分」が自然である。ただし、この訳は聖霊について本文以上の教理的説明を加えない。
- issue: πνεύματος ἁγίουの訳
  choice: 聖霊
  alternative: 聖なる霊
  rationale: この文脈では確立した称号「聖霊」が自然であり、原文にない説明や教派的限定を加えない。
- issue: μερισμοῖςの内容
  choice: 分け与え
  alternative: 賜物の分配
  rationale: 何が具体的に分け与えられたかについて、原文は「賜物」を明記していない。そのため意味を補いすぎず、表現上の緊張を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文にふさわしい品位を保った。「証しを添えられました」により前節との文法的連続と、神が証言に加わる含みを自然に表現した。
