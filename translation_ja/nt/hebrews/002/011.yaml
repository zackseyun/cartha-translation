source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: ja
  text: 実に、聖なる者とする方も、聖なる者とされている人々も、皆、一つに由来しています[a]。そのため、その方は彼らを兄弟たちと呼ぶことを恥じてはおられません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一人の父から」「一つの源から」または「一人の祖先から」。ギリシア語では「一つ」が何を指すか明記されていない。
    reason: alternative_reading
  - marker: b
    text: 「兄弟たち」に当たるギリシア語は男性複数形だが、ここでは女性を含む、信じる者たち全体を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε γὰρ ἁγιάζων
  choice: 実に、聖なるものとする方も
  rationale: 実体詞的な現在能動分詞を、「方」によって人格的主体を示しつつ訳した。「聖別する」より平明な「聖なるものとする」を用い、現在形の働きも保った。γάρは文脈との結び付きを示す「実に」とした。
- source_word: οἱ ἁγιαζόμενοι
  choice: 聖なるものとされている人々も
  rationale: 現在受動分詞が表す継続中の働き、またはその状態を「されている」で示し、同じ動詞語幹を対応させた。
- source_word: ἐξ ἑνὸς πάντες
  choice: 皆、一つのものから出ています
  rationale: ἐξの起源・源泉の意味を「から出ている」で表した。ἑνόςの指示対象は原文で明記されないため、「父」「祖先」などに限定せず「一つのもの」として曖昧さを保持した。
- source_word: δι’ ἣν αἰτίαν
  choice: そのため
  rationale: 直前の内容を理由として後半の帰結を導く慣用句を、自然で明瞭な現代日本語にした。
- source_word: οὐκ ἐπαισχύνεται
  choice: 恥とはされません
  rationale: 尊敬語の主体は文脈上キリストであり、羞恥を感じないという原義を保った。「ためらわない」という意訳にはしなかった。
- source_word: ἀδελφοὺς αὐτοὺς καλεῖν
  choice: 彼らを兄弟たちと呼ぶこと
  rationale: 男性複数形の親族呼称を「兄弟たち」と訳した。文脈上は女性を含む信仰者共同体を指し得るため、その点を脚注で明示した。
theological_decisions:
- issue: 「聖なるものとする方」の同定
  choice: 本文では名を補わず「その方」と受ける
  alternative: 「イエス」または「御子」と明示する
  rationale: 直前の文脈から主体は御子イエスと理解されるが、この節のギリシア語本文自体には固有名がないため、本文では補わない。
- issue: ἐξ ἑνὸς の指示対象
  choice: 「一つのものから」とし、指示対象を特定しない
  alternative: 「一人の父から」「一つの源から」「一人の祖先から」
  rationale: ἑνόςは男性または中性の属格単数形で、神、父、祖先、共通の源など複数の理解が可能である。原文が残す神学的な幅を本文で狭めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「聖別する」という教会用語を避け、「聖なるものとする」で意味を直接示した。神への敬意を表すため文脈上のキリストを「方」とし、述語にも尊敬表現を用いた。脚注標識[a][b]は該当箇所の本文中に配置した。
