  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: ja
  text: また、死への恐れのために生涯にわたって奴隷状態に置かれていた人々を解放するためでした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奴隷として縛られていた人々」または「奴隷の身にあった人々」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: 解放する
  rationale: 束縛された状態から自由にするという語義を自然かつ明確に表し、後続する「奴隷の状態」との対応も保つ。
- source_word: τούτους, ὅσοι
  choice: 人々
  rationale: 指示代名詞と包括的な関係詞を、日本語として自然な形でまとめた。「そのような人々」とも訳せるが、文脈上の対象は修飾節によって十分明らかである。
- source_word: φόβῳ θανάτου
  choice: 死への恐れのために
  rationale: 与格が表す原因・手段の両面を踏まえつつ、恐れが束縛をもたらす事情であることを明瞭に伝える。
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: 生涯にわたって
  rationale: 生きている期間全体を指す慣用的表現を、簡潔で格調を損なわない現代日本語にした。
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: 奴隷の状態に置かれていた
  rationale: ἔνοχοςの「服している、縛られている」という含みと、δουλείαの実質的な奴隷状態を表す。誰がその状態に置いたかは本文が明示しないため、主体を補わない受動表現とした。
- source_word: καὶ
  choice: そして
  rationale: 前節から続く目的を示す節として、素直な接続を保った。
theological_decisions:
- issue: 死への恐れと奴隷状態の具体的な関係
  choice: 死への恐れによる現実の奴隷状態として訳し、その支配主体や教理的仕組みは特定しない。
  alternative: 悪魔への隷属、罪への隷属、死すべき者としての実存的恐怖と明示する。
  rationale: 直前の節は悪魔と死の力に言及するが、本節自体は「死への恐れ」と「奴隷状態」の関係だけを述べる。翻訳では本文以上に限定しない。
- issue: ἀπαλλάξῃ の目的・結果の連続性
  choice: 「解放するためでした」として、前節から続く目的構文を明示する。
  alternative: 独立した叙述として「解放しました」と訳す。
  rationale: 接続法ἀπαλλάξῃは前節のἵναに連なるため、完了した事実の単純な叙述ではなく目的を表す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「奴隷」を抽象化せず原文の強い比喩を保った。「生涯にわたって」は簡潔で自然な持続表現。脚注記号[a]は本文末に配置した。
