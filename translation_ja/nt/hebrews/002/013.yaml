  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: ja
  text: また、こうあります。「わたしは彼に信頼を置く。」また、こうあります。「見よ、わたしと神がわたしに与えた子どもたち。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節のギリシア語本文は話者を名指ししていません。文脈上、ヘブライ書はこれらの引用を御子に当てはめています。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: またこうあります
  rationale: 別の引用を導く表現。原文に発話動詞はないが、日本語では引用だけに「また」を添えるより、「こうあります」と補うほうが自然であり、話者を特定する「彼は言う」は避けられる。
- source_word: Ἐγὼ ἔσομαι πεποιθὼς
  choice: わたしは…信頼を置く
  rationale: 未来形のεἰμίとπείθωの完了分詞による迂言表現で、確かな信頼の姿勢を表す。「信頼する」も可能だが、引用文として自然で落ち着いた「信頼を置く」とした。
- source_word: ἐπ’ αὐτῷ
  choice: この方に
  rationale: 信頼の対象を表す。日本語の引用内で指示対象を自然に示しつつ、敬意ある文脈に合う「この方」を用いた。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す指示表現の修辞的な力と、引用の格調を保つ。
- source_word: τὰ παιδία
  choice: 子どもたち
  rationale: 引用中の関係的な意味での子どもを指す。指小的な含みを過度に強調せず、現代日本語として自然に訳した。
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: 神がわたしに与えてくださった
  rationale: アオリストἔδωκενを過去の授与として表しつつ、神を主語とする日本語として自然な敬語表現を用いた。関係代名詞ἅの中性形は日本語では明示する必要がない。
theological_decisions:
- issue: 旧約引用の話者とキリスト論的適用
  choice: 一人称の引用をそのまま示し、本文中で話者を名指ししない
  alternative: 「御子は言われます」または「メシアは言われます」と補う
  rationale: この文脈でヘブライ書は引用を御子に適用しているが、ギリシア語本文自体は話者を明示していない。解釈上の同定を本文へ付加せず、文脈に委ねる。
- issue: 神から与えられた子どもたち
  choice: 引用の関係表現をそのまま保持する
  alternative: 「弟子たち」「神の民」などと解釈的に言い換える
  rationale: παιδίαの指示対象を本文以上に限定せず、ヘブライ書の議論にある神学的含みを保つ。
translation_notes:
  register: 明快な現代標準語を基本としつつ、聖書引用としての格調を保つため「見よ」を採用した。「この方」は指示対象への敬意を自然に示す。脚注記号[a]は、節全体の話者に関する注として末尾に置いた。
