  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: ja
  text: というのも、イエスご自身が誘惑を受けて苦しまれたので、誘惑を受けている人たちを助けることができるのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」を、二か所とも「試練」と訳すこともできる。すなわち、「イエスご自身が試練を受けて苦しまれたので、試練を受けている人たちを助けることができるのです」。ギリシア語の動詞は、文脈に応じて「誘惑する」とも「試す」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: というのも、〜からこそ
  rationale: γὰρの説明的なつながりと、ἐν ᾧの因果的な意味を、現代日本語として自然に示す。「からこそ」は、その経験が助けることのできる根拠であることを明確にする。
- source_word: πέπονθεν αὐτός
  choice: ご自身が〜苦しまれた
  rationale: αὐτόςの強調を「ご自身」で保ち、πέπονθενは完了した苦難の経験と現在への意義を文脈に委ねて自然な日本語にする。主語がイエスであるため敬語を用いる。
- source_word: πειρασθείς
  choice: 誘惑を受けて
  rationale: πειράζωの一般的な新約聖書的用法とヘブライ4:15との連関から「誘惑」を本文に採る。ただし「試練を受ける／試される」も可能なので脚注に残す。
- source_word: δύναται
  choice: 助けることができる
  rationale: 能力を表す現在形の意味を明瞭かつ自然に伝える。
- source_word: τοῖς πειραζομένοις
  choice: 誘惑を受けている人たち
  rationale: 現在分詞の継続的な側面を「受けている」で表す。本文ではπείραζωを前半と同じ語で訳し、反復を保つ。
- source_word: βοηθῆσαι
  choice: 助ける
  rationale: 危機にある者のもとへ助けに赴く含みを持つが、ここでは簡潔で明瞭な「助ける」が適切。
theological_decisions:
- issue: イエスと信じる者に用いられるπειράζωの意味
  choice: 誘惑を受ける
  alternative: 試練を受ける／試される
  rationale: イエスが人間の誘惑に伴う苦しみを実際に経験し、それゆえ今誘惑の中にいる人々を助けられるという連帯を表す。イエスが罪に屈したことは含意しない。一方、語には「試す」という意味もあるため、解釈上の幅を脚注で保持する。
- issue: 苦しみと助ける能力との因果関係
  choice: 「からこそ」で経験を助けの根拠として示す
  alternative: 「その点で／そのことにおいて」と、より字義的に訳す
  rationale: ἐν ᾧはここで因果的に理解するのが文脈上自然。ただし、キリストの能力が本質的に以前は欠けていたという意味に限定せず、苦しみを経験したことが人々を助ける根拠として提示されているという本文の論旨を保つ。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「イエス」は直前の文脈から補って主語を明確にし、神の子への敬意を自然な尊敬表現で示した。説明接続「というのも」により前節との論理的連続を保つ。脚注記号[a]は本文末に置き、πειράζωの二つの出現の双方にかかるようにした。
