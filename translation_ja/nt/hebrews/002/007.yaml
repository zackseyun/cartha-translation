  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: ja
  text: あなたは彼を、しばらくの間、天使たちより低くされ[a]、栄光と誉れをもって彼に冠をかぶらせられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたは彼を天使たちよりわずかに低くされ」。ギリシア語の句は、期間ではなく程度を表すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: 低い者とし
  rationale: ἐλαττόωの使役的・比較的な意味を、後続する「御使いたちより」と自然につながる現代日本語で表した。
- source_word: αὐτὸν
  choice: 彼を
  rationale: 詩篇引用中の男性単数代名詞を保持し、この節だけで「人」や「キリスト」と明示して解釈を狭めることを避けた。
- source_word: βραχύ τι
  choice: しばらくの間
  rationale: 程度と期間の両義が可能だが、ヘブライ人への手紙2章の文脈に適合する時間的意味を本文に採用し、程度の意味を脚注に残した。
- source_word: παρ’ ἀγγέλους
  choice: 御使いたちより
  rationale: 比較を表すπαρά＋対格を「より」と訳した。ἄγγελοιは聖書文体として明瞭で定着した「御使いたち」とした。
- source_word: δόξῃ καὶ τιμῇ
  choice: 栄光と誉れの冠を
  rationale: 手段・内容を示す与格を、στεφανόωとの自然な日本語の結びつきによって「栄光と誉れの冠」と表現した。
- source_word: ἐστεφάνωσας
  choice: 授けられました
  rationale: 字義は「冠をかぶらせた」であり、「冠を授ける」という自然で荘重な日本語にした。二人称単数の神への語りかけには敬語を用いた。
- source_word: αὐτόν
  choice: 彼に
  rationale: ギリシア語で反復される目的語を日本語でも明示し、節の構造と指示対象を保った。
theological_decisions:
- issue: 詩篇8篇の引用におけるβραχύ τιの意味
  choice: 時間的意味「しばらくの間」
  alternative: 程度の意味「わずかに低い者とし」
  rationale: ギリシア語は期間と程度の両方を表し得る。ヘブライ人への手紙の直近の文脈では、低くされた後に栄光を受けるという時間的展開が強いが、程度の読みも真正な可能性として脚注に保持した。
- issue: αὐτόνの指示対象
  choice: 代名詞「彼」を保持
  alternative: 「人」または「イエス」と明示
  rationale: 詩篇における代表的人間と、ヘブライ人への手紙におけるキリスト論的適用との重なりを、本文で一方に限定しないため。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、神への二人称には「あなた」と敬語を用いた。「御使い」「栄光」「誉れ」「冠」は聖書的な格調を保ちながら一般読者にも理解できる語彙である。
