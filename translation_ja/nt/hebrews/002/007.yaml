    rationale: ギリシア語ではαὐτόνがστεφανόωの直接目的語であり、『彼を冠する』意です。『彼に冠を授ける』も意味は近いものの、原文の動詞と目的語の関係をより直接に表す表現へ改めるのが安全です。
  - severity: low
    issue: 「御使いたち」は現代一般語としては「天使たち」より限定的・教会文語的である。
    rationale: ἀγγέλουςのこの文脈での指示対象は天上の天使であり、「天使たち」が明瞭な現代標準語であるためです。
  revised_text: あなたは彼を、しばらくの間、天使たちより低くされ[a]、栄光と誉れをもって彼に冠をかぶらせられました。
