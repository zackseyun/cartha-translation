id: HEB.2.3
reference: Hebrews 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: ja
  text: これほど大いなる救いをないがしろにするなら、私たちはどうして逃れることができるでしょうか。この救い[a]は、主を通して語られ始め、主から聞いた人々によって、私たちに確かなものとされました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主を通して語られ始めたこの救いは、主から聞いた人々によって、私たちに確かなものとされました。」
    reason: 関係代名詞ἥτις以下を、独立文の「この救いは」ではなく、前置された連体修飾としてつなぐ訳し方を示す。
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: 私たちはどうして逃れることができるでしょうか
  rationale: 未来形による修辞疑問の強い警告を保ちつつ、明示的な断定には置き換えない。
- source_word: τηλικαύτης ἀμελήσαντες σωτηρίας
  choice: これほど大いなる救いをないがしろにするなら
  rationale: τηλικαύτηςの強調を「これほど大いなる」で表し、分詞ἀμελήσαντεςは文脈上の条件的な関係を自然な日本語で示す。
- source_word: σωτηρίας
  choice: 救い
  rationale: 救出と終末的・贖罪的含意を保持する、文脈にふさわしい標準的な訳語。
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: 初めに…語られ
  rationale: 直訳的な「語られ始めた」も可能だが、初回の宣言という時間的・起点的意味を自然に表す。
- source_word: διὰ τοῦ κυρίου
  choice: 主を通して
  rationale: διά＋属格の媒介・行為者のニュアンスを保ち、κύριοςを定着した称号「主」とする。
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: 主から直接聞いた人々によって
  rationale: 聞いた対象が文脈上「主」であることを自然に補い、後代の受け手との対比を明確にする。「直接」は、主の語りを聞いた者という含意を明示する。
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: 私たちに確かなものとして示されました
  rationale: βεβαιόωの確認・確証の意味と、εἰς ἡμᾶςの受け手への方向性を読みやすい現代日本語で表す。
theological_decisions:
- issue: 「主」（τοῦ κυρίου）の指示対象
  choice: 救いを最初に語ったイエスを指す称号として「主」と訳す。
  alternative: 一般的に神を指す「主」と理解する。
  rationale: 続く「聞いた人々」がその言葉を受け継いだという文脈は、イエスの地上での宣言と、それを聞いた証人たちを強く示唆する。ただし本文では固有名を補わず「主」を保持する。
- issue: 警告の疑問文の力
  choice: 修辞疑問のまま訳す。
  alternative: 「決して逃れられない」と断定文にする。
  rationale: ギリシア語の疑問形式を保ち、強い警告を示しながら、その神学的緊張を明示的断定によって解消しない。
- issue: 関係代名詞ἥτιςの処理
  choice: 「この救いは」と受け直す。
  alternative: 「それは」または連体修飾で前文につなぐ。
  rationale: 指示対象を明瞭にしつつ、救いについて説明を加える関係節の働きを自然な日本語で表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、警告の厳粛さにふさわしい品位を保った。「どうして…できるでしょうか」で修辞疑問を自然に表し、「ないがしろにする」はἀμελέωの意図的な軽視・放置を伝える。
