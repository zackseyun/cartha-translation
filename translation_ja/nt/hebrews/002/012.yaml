  - severity: low
    issue: 引用導入と文体の不統一
    rationale: 「こう言っています」は丁寧体で、引用内の常体・意志形と調子がそろわない。λέγωνには「こう言っている」が自然である。
  - severity: low
    issue: ἐκκλησίαの日本語表現
    rationale: 「集会」は出来事・会合を指しやすい。「会衆」はこの引用における集められた人々をより直接に表す。
