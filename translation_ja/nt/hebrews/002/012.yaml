  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: ja
  text: 'こう言っている。


    「私は、あなたの名を私の兄弟たち[a]に告げ知らせよう。

    会衆[b]の中で、あなたに賛美の歌を歌おう。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは仲間の信仰者全体を含む可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「集会」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: こう言っています
  rationale: 現在分詞で引用を導入している。日本語では、前後の文脈につながる自然な引用導入句とした。
- source_word: Ἀπαγγελῶ
  choice: 告げ知らせ
  rationale: 公に伝え、宣言する意味を保ちつつ、現代日本語として分かりやすい表現を選んだ。
- source_word: τὸ ὄνομά σου
  choice: あなたの名
  rationale: 「名」が人格、評判、啓示された存在を含意し得る曖昧さを保ち、説明的に言い換えなかった。
- source_word: τοῖς ἀδελφοῖς μου
  choice: 私の兄弟たち
  rationale: 男性複数形をそのまま反映した。文脈上、信仰共同体の女性も含み得ることは脚注に示した。
- source_word: ἐν μέσῳ
  choice: ただ中で
  rationale: 「中央で／間で」という意味を保ち、引用文の格調にも合う自然な表現とした。
- source_word: ἐκκλησίας
  choice: 集会
  rationale: ここでは制度としての教会よりも、集められた人々を指すため、「集会」とした。
- source_word: ὑμνήσω
  choice: 賛美して歌おう
  rationale: 単なる称賛ではなく、歌による賛美を表す動詞の意味を明示した。
- source_word: σε
  choice: あなたを
  rationale: 賛美の対象である二人称単数を明確に保持した。
theological_decisions:
- issue: ἀδελφοῖς の代表的な家族表現
  choice: 兄弟たち
  alternative: 兄弟姉妹／きょうだいたち
  rationale: 原文の男性複数形を本文に保ちつつ、文脈上は信仰者の家族全体を含み得ることを脚注で示した。
- issue: 旧約引用における ἐκκλησία の訳語
  choice: 集会
  alternative: 会衆／教会
  rationale: 詩篇22篇の引用として、集められた神の民という意味を優先し、後代の制度的含意を不必要に持ち込まないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、旧約引用にふさわしい簡潔で格調ある調子を保った。「御名」のような原文にない敬語的要素は加えず、「名」とした。
