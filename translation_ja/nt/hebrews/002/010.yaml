reference: Hebrews 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: ja
  text: すべてのものがその方のためにあり、すべてのものがその方を通して存在している、その方が、多くの子たち[a]を栄光へ導くにあたり[d]、彼らの救いの先駆者[b]を、数々の苦しみを通して完成させる[c]ことは、ふさわしいことでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「多くの息子たち」。子としての身分と相続の響きを持つ表現で、男性だけでなく神のすべての子どもを含む。
    reason: lexical_alternative
  - marker: b
    text: 「創始者」「指導者」、または「源」とも訳せる。ここでは、救いの道を切り開いて先頭を進む方という意味。
    reason: lexical_alternative
  - marker: c
    text: ここで「完成させる」とは、道徳的な欠陥を直すことではなく、苦しみを通して意図された目標と使命に至らせること。
    reason: lexical_alternative
  - marker: d
    text: 「多くの子たちを栄光へ導くために」とも理解できる。原文の分詞は、「導くこと」と「完成させること」の関係を明示的な目的節には限定していない。
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: ふさわしいことでした
  rationale: 神の目的にかなった適切さを表す未完了過去の非人称表現を、自然で格調ある日本語にした。
- source_word: αὐτῷ
  choice: その方が
  rationale: 文脈上は神を指すが、固有名を補わず、後続する二つの関係節によって指示対象を示す原文の代名詞表現を保った。日本語の文構造上、行為者として「が」で示した。
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: すべてのものがその方のためにあり、すべてのものがその方を通して存在している
  rationale: 最終目的を示す第一のδιάと、媒介・手段を示す第二のδιάの対照を、「ために」と「通して」で明確にした。
- source_word: πολλοὺς υἱοὺς
  choice: 多くの子たち
  rationale: υἱούςの親子関係と相続の含意を「子たち」で保ちつつ、日本語で男性だけを不必要に限定する「息子たち」は避けた。ギリシア語の男性形と包括的範囲は注記する。
- source_word: εἰς δόξαν
  choice: 栄光へ
  rationale: εἰςが示す目標への移動を簡潔に表した。
- source_word: ἀγαγόντα
  choice: 導くにあたり
  rationale: アオリスト分詞を主不定詞τελειῶσαιに伴う状況として訳し、目的を断定する「導くために」は避けた。統語上可能な別の読みは注記する。
- source_word: ἀρχηγὸν
  choice: 先駆者
  rationale: 救いの道を切り開き、自ら先頭に立って導く者という、開始者と指導者の両面を表す。
- source_word: τῆς σωτηρίας αὐτῶν
  choice: 彼らの救いの
  rationale: 属格構文を自然に保ち、「彼ら」が多くの子たちを指すことを明瞭にした。
- source_word: διὰ παθημάτων
  choice: 数々の苦しみを通して
  rationale: παθημάτωνの複数形を「数々の」によって反映し、具体的に経験した苦しみの重なりを示した。
- source_word: τελειῶσαι
  choice: 完成させる
  rationale: 意図された目標・役割へ到達させる意味を表し、道徳的欠陥を矯正するとの誤解を避けながら、ヘブライ書における完成の語彙を保った。
theological_decisions:
- issue: 御子について用いられるτελειῶσαιの意味
  choice: 完成させる
  alternative: 完全な者とする／全うさせる
  rationale: ここでは道徳的欠陥の修正ではなく、苦しみを経て救いの先駆者としての使命を目標にまで至らせることを表す。本文自体の緊張を消さず、注で意味を限定した。
- issue: πολλοὺς υἱοὺςの性別と子としての身分
  choice: 多くの子たち
  alternative: 多くの息子たち
  rationale: 原語は男性複数形で、子としての身分や相続の響きを持つ。一方、日本語の「息子たち」は男性のみを指す意味が強いため、本文では「子たち」とし、原語の形と包含範囲を注記した。
- issue: ἀγαγόνταとτελειῶσαιの関係
  choice: 導くにあたり
  alternative: 導くために／導いて
  rationale: 分詞を目的節に限定せず、神が多くの子たちを栄光へ導く営みの中で先駆者を完成させた、という原文の統語関係を保った。目的・手段の含みを認めつつ断定しない。
translation_notes:
  register: 現代標準語による、明瞭で礼拝朗読にも耐える格調を目指した。「その方」を反復して神への敬意と指示の明瞭さを両立させ、長いギリシア語文の論理関係は読点で整理した。
