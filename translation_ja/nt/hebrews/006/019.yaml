source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: ja
  text: この希望を、私たちは魂の錨として持っています。それは確かで堅固であり、垂れ幕の内側へと入っていきます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「垂れ幕の奥へ」または「幕の向こう側へ」。
    reason: τοῦ καταπετάσματοςを伴う空間表現は、文脈上は幕の内側・向こう側を指す。日本語では複数の自然な表現が可能である。
lexical_decisions:
- source_word: ἣν
  choice: この希望を
  rationale: 女性単数の関係代名詞は前節の「希望」を受ける。日本語では指示内容を明示したほうが自然で、節間のつながりも明瞭になる。
- source_word: ὡς ἄγκυραν
  choice: 錨として
  rationale: ὡς の比較・役割を簡潔に表し、原文の比喩を保持する。
- source_word: ἔχομεν
  choice: 私たちは…持っています
  rationale: 現在直説法を平明な現代日本語で表す。
- source_word: τῆς ψυχῆς
  choice: 魂の
  rationale: 属格と ψυχή の語義を保ち、「心」や「命」へ狭く解釈しない。
- source_word: ἀσφαλῆ
  choice: 安全で
  rationale: 危険や失敗を免れるという意味を保ち、錨の比喩にも自然に合う。
- source_word: βεβαίαν
  choice: 揺るぎなく
  rationale: 堅固で確かな性質を自然な日本語で表し、ἀσφαλής との違いも保つ。
- source_word: τε καὶ
  choice: …で…なく
  rationale: 二つの形容を並列し、両方の性質を示す原文の連結を日本語として自然に表す。
- source_word: εἰσερχομένην
  choice: 入って行きます
  rationale: 錨を修飾する現在分詞の動的な描写を、独立した述語として自然に表す。
- source_word: εἰς τὸ ἐσώτερον
  choice: 奥の所へ
  rationale: 実体詞的な比較級が指す内側の領域を、至聖所と断定せず簡潔に表す。
- source_word: τοῦ καταπετάσματος
  choice: 垂れ幕の内側にある
  rationale: 聖所の隔てとなる幕のイメージを保ちつつ、属格に含意される空間関係を明瞭にする。
theological_decisions:
- issue: 天の聖所を示す祭儀的比喩
  choice: 「垂れ幕の内側にある奥の所」と訳し、聖所の隔てとその向こう側という空間像を保つ。
  alternative: 「垂れ幕の奥」または「幕の内側」
  rationale: 後続文脈で展開される聖所のイメージを明確にしつつ、ここだけで「至聖所」と特定して原文以上に解釈しない。
- issue: 希望と錨の関係
  choice: 希望そのものを魂の錨として描く。
  alternative: 希望が錨のような働きをすると説明的に意訳する。
  rationale: 関係代名詞の先行詞と ὡς ἄγκυραν の比喩を直接保ち、神学的説明を付加しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「錨」「垂れ幕」によって航海と聖所の二つの比喩を保ち、「至聖所」などの解釈的な用語は本文に補わない。
