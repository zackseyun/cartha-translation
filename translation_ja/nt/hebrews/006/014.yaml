translation:
  language: ja
  text: こう言われました[a]。「わたしは必ずあなたを祝福し、必ずあなたを増やす。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、直訳すると「祝福して、わたしはあなたを祝福し、増やして、わたしはあなたを増やす」。反復による強調表現であり、創世記22章17節を響かせている。
    reason: 原文の反復構文と創世記への言及を示すため。
lexical_decisions:
- source_word: λέγων
  choice: こう言われました
  rationale: 現在分詞で神の誓いの内容を導入する。前節から続く神を主語として補い、引用への自然なつながりを示した。
- source_word: Εἰ μὴν
  choice: 必ず
  rationale: 文字どおりの条件表現ではなく、誓いに伴う強い確言を表すため、現代日本語で明瞭な「必ず」とした。
- source_word: εὐλογῶν εὐλογήσω
  choice: 必ずあなたを祝福し
  rationale: 分詞と定動詞の反復によるセム語的な強調を、日本語では「必ず」で表した。形式上の反復は脚注に残した。
- source_word: σε
  choice: あなたを
  rationale: 単数二人称で、引用中ではアブラハムを指す。
- source_word: καὶ
  choice: し
  rationale: 二つの約束を自然な日本語で並列するため、連用形で接続した。
- source_word: πληθύνων πληθυνῶ σε
  choice: 必ずあなたを大いに増やす
  rationale: 動詞の反復による強調を「必ず」で示し、πληθύνωの増加・増殖の意味を「大いに増やす」で明確にした。文脈上、子孫を増やすことが含意されるが、本文では目的語を限定せず、原文の表現を保った。
theological_decisions:
- issue: アブラハムへの約束を引用する誓言の強調表現
  choice: 二つの動詞それぞれに「必ず」を付け、平行する強調を保つ。
  alternative: 「わたしはあなたを豊かに祝福し、あなたの子孫を大いに増やす」または形式的に「祝福して、わたしはあなたを祝福し、増やして、あなたを増やす」
  rationale: ギリシア語は創世記22章17節の七十人訳を響かせる反復構文で、祝福と増加の双方を強調する。「子孫」を本文に補うと解釈を明示しすぎるため避け、読みやすい日本語と原文の強調を両立させた。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。前節からの連続を踏まえて「こう言われました」とし、神の発言を引用する自然な日本語にした。神の一人称は「わたし」と表記した。
