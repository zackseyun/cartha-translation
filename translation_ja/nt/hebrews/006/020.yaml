  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: ja
  text: 'そこに、イエスは私たちのために[a]先駆者として入られました。イエスは、メルキゼデクの位に従って[b]、永遠に大祭司となられたのです。


    [a] または「私たちを代表して」。ギリシア語は他者のための行為を表し、ここではイエスが私たちを代表して入られたことを強調している。


    [b] または「メルキゼデクの位に属して」。詩編110編4節を踏まえた表現。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私たちを代表して」。ギリシア語は他者のための行為を表し、ここではイエスが私たちを代表して入られたことを強調している。
    reason: lexical_alternative
  - marker: b
    text: または「メルキゼデクの位に属して」。詩編110編4節を踏まえた表現。
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: そこへ
  rationale: 直前の節にある垂れ幕の内側を指す。移動動詞「入られました」と自然につながる方向表現とした。
- source_word: πρόδρομος
  choice: 先駆け
  rationale: 後に続く者たちのために先に進み、道を開く者という比喩を、自然な現代日本語で保つ。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 利益と代表の両義を保てる自然な表現。「身代わりに」という限定的な意味を本文に持ち込まない。
- source_word: εἰσῆλθεν
  choice: 入られました
  rationale: 完了した歴史的行為を表すアオリストを明確に訳しつつ、文脈にふさわしい敬意ある語調とした。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 現代日本語聖書で定着した固有名表記。
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: メルキゼデクの位に従って
  rationale: 詩篇110篇4節との響きを保ち、系譜ではなく祭司職の型・位に沿うことを示す。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: ヘブライ人への手紙の中心的な祭司職を表す定着した訳語。
- source_word: γενόμενος
  choice: となられた
  rationale: 分詞の意味を省略せず、イエスの存在の開始ではなく、大祭司の務めに就かれたことを表す。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: この文脈で永続性を明瞭かつ自然に表す慣用的な訳。
theological_decisions:
- issue: γενόμενοςとキリスト論の関係
  choice: 「永遠に大祭司となられた」とし、祭司職への就任を表した。
  alternative: 「永遠の大祭司に任じられた」
  rationale: 動詞性を保ちながら、イエスが存在し始めた、または本質が変化したという含意を避ける。受動の任命を原文以上に明示しない。
- issue: ὑπὲρ ἡμῶνの意味
  choice: 本文では「私たちのために」とし、受益と代表の幅を保った。
  alternative: 「私たちに代わって」
  rationale: 文脈は、信じる者たちに先立って天の聖所へ入るイエスを描く。特定の贖罪理論に狭めず、原語の幅を保持する。
- issue: κατὰ τὴν τάξιν Μελχισέδεκの祭司的関係
  choice: 「メルキゼデクの位に従って」とした。
  alternative: 「メルキゼデクと同じ位に属する者として」
  rationale: 詩篇110篇4節との間テクスト的なつながりを残し、血統上の系譜と断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、礼拝朗読にも適する品位を保った。「先駆け」「大祭司」は文脈上重要な比喩・職名として保持し、二文に分けて日本語としての理解しやすさを確保した。
