id: HEB.6.5
reference: Hebrews 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: ja
  text: また、神の良いことばと、来るべき時代[b]の力[a]とを味わった者たちが、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奇跡」あるいは「力あるわざ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「来たるべき世」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: 良い
  rationale: ῥῆμαを修飾し、有益で優れたものという肯定的評価を表す。現代日本語で「ことば」と自然に結びつき、意味を過度に限定しない。
- source_word: γευσαμένους
  choice: 味わった
  rationale: 比喩をそのまま保ち、単なる表面的な試食とも、完全な経験とも決めつけない。前後の対格複数の分詞列に連なる形は「者たちが」で示した。
- source_word: θεοῦ ῥῆμα
  choice: 神のことば
  rationale: ῥῆμαは語られたことば・発言を表し得るが、ここでは「神のことば」が自然で明瞭であり、神に由来することばという属格の関係も保てる。
- source_word: δυνάμεις
  choice: 力
  rationale: 奇跡的な力の現れを指し得る一方、より広い神的な力をも意味し得るため、「奇跡」や「力あるわざ」に限定せず「力」とした。
- source_word: τε
  choice: と
  rationale: 前の目的語とδυνάμειςを結ぶ働きを、日本語の並列助詞「と」で自然に表した。
- source_word: μέλλοντος αἰῶνος
  choice: 来るべき時代
  rationale: 将来到来する終末論的な時代を指すことを明確にしつつ、αἰώνの時間的意味を保つ。「来たるべき世」も可能だが、現代語としては「来るべき時代」が明瞭である。
theological_decisions:
- issue: 警告箇所における「味わった」の意味
  choice: 「味わった」とし、比喩を保持する。
  alternative: 「経験した」または「少し味見した」
  rationale: この語が示す参与の深さについての神学的論争を翻訳で決着させず、原文の比喩と緊張を保つため。
- issue: 終末論的文脈におけるδυνάμειςの意味
  choice: 「力」とする。
  alternative: 「奇跡」または「力あるわざ」
  rationale: 来るべき時代に属する奇跡的な現れを含み得るが、それだけに限定されない原文の幅を保つため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く分詞句であることを示すため冒頭を「また」とし、末尾を「者たちが、」として後続節への継続を保った。「ことば」は宗教文脈で定着した表記を採用した。
