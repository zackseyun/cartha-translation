id: HEB.6.13
reference: Hebrews 6:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: ja
  text: 神がアブラハムに約束されたとき[a]、神はご自分より偉大な者にかけて誓うことができなかったので、ご自分にかけて誓い[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「神がアブラハムに約束して」。
    reason: lexical_alternative
  - marker: b
    text: 「ご自分にかけて」は、誓いに際してご自身をその根拠として呼びかける表現。
    reason: translation_alternative
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: 約束されたとき
  rationale: アオリスト中態分詞を、主節との時間的な結びつきが自然に伝わる従属節で表した。約束の内容は後続節に示されるため、ここでは目的語を補わない。
- source_word: ἐπεὶ
  choice: ので
  rationale: ここでは、神がご自分を指して誓った理由を導く因果的用法である。
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: ご自分より偉大な者を指して
  rationale: οὐδενόςは文法上「何もの」とも取り得るが、誓いの対象となる上位者を述べる文脈に即して人格的な「者」とした。比較の基準である神を「ご自分より」と明示した。
- source_word: ὀμόσαι / ὤμοσεν
  choice: 誓うことができなかった／誓い
  rationale: 同一語根の反復を「誓う／誓い」で保った。εἶχεν＋不定詞は、この文脈では可能性を表す自然な日本語にした。
- source_word: καθ’ ἑαυτοῦ
  choice: ご自分を指して
  rationale: 誓いにおけるκατάの用法を表す。「ご自分にかけて」も可能だが、現代日本語で過度に口語的・慣用的に響くのを避けた。
- source_word: γὰρ
  choice: （文脈上の説明接続）
  rationale: γάρは前節の主張を説明する。単独節として不自然な「というのは」を置かず、「ので」による因果関係と前後の流れの中で説明機能が伝わる形にした。
- source_word: Τῷ ... Ἀβραὰμ
  choice: アブラハムに
  rationale: 与格を約束の受け手として素直に表した。
theological_decisions:
- issue: 神の誓いの性質
  choice: 神は、ご自分より偉大な者がいないため、ご自分を指して誓った
  alternative: 神は、ご自分より偉大な何ものもないため、ご自分にかけて誓った
  rationale: 神の比類ない至高性を示す本文の論理を保ちつつ、後代の教理的定式を付加しない。
- issue: 分詞と主節の関係
  choice: 「約束されたとき」と時間的に結ぶ
  alternative: 「約束された神は」と分詞構文を形式的に保つ
  rationale: ギリシア語分詞の関係には一定の幅があるが、日本語では時間的背景として表すのが自然で、文意も変えない。脚注で簡潔な別表現を示す。
translation_notes:
  register: 明瞭で品位ある現代標準語。神への敬意を「ご自分」「された」で示す一方、古風な誓約表現は避けた。この節は次節へ続く構文なので、末尾を「誓い、」とした。
