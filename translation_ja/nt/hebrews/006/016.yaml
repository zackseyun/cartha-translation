id: HEB.6.16
reference: Hebrews 6:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: ja
  text: 人は自分より偉大な者にかけて誓います。そして、彼らにとって誓いは、確証として、あらゆる争いに終止符を打つものです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らにとって、誓いは確証のために、あらゆる争いの終わりです」。また「あらゆる争い」は「あらゆる異議」または「あらゆる論争」とも訳せます。
    reason: 原文の名詞構文を補足し、ἀντιλογίαの語義の幅を示すため。
lexical_decisions:
- source_word: ἄνθρωποι
  choice: 人は
  rationale: 一般的な人間の慣行を述べる総称的複数。現代日本語では「人は」が性別を限定せず、格言的な文脈にも自然である。
- source_word: κατὰ τοῦ μείζονος
  choice: 自分より偉大な者にかけて
  rationale: 誓いにおけるκατά＋属格の「～にかけて」を表し、比較級μείζονοςの比較対象を日本語として自然に補った。特定の人物は指定しない。
- source_word: ὀμνύουσιν
  choice: 誓います
  rationale: 一般的慣行を表す現在形として、簡潔で自然な「誓います」を用いた。
- source_word: πάσης ... ἀντιλογίας
  choice: あらゆる争い
  rationale: ἀντιλογίαはここでは論理的な「矛盾」より、当事者間の異議・論争を指す。「あらゆる争い」は広い意味を保ちつつ平明である。
- source_word: πέρας
  choice: 終わらせます
  rationale: 直訳的な「終わり」を日本語の述語として自然に表し、誓いが争いに終止符を打つ意味を明確にした。
- source_word: εἰς βεβαίωσιν
  choice: 事柄を確かなものとし
  rationale: βεβαίωσιςの確認・確証という機能を自然な日本語で示した。明示されない目的語は一般的な「事柄」とし、過度な法的限定を避けた。
- source_word: ὁ ὅρκος
  choice: 誓いは
  rationale: 冠詞付き名詞を一般的な制度・行為として受け、日本語では主題化して「誓いは」とした。
theological_decisions:
- issue: 格言における人類一般への言及
  choice: 人は
  alternative: 男たちは／人々は
  rationale: ἄνθρωποιは男性に限定されず、人間一般を指す。「人は」はその総称的な力を自然に伝える。
- issue: 誓いが果たす二重の機能の構文
  choice: 事柄を確かなものとし、あらゆる争いを終わらせます
  alternative: 確証のための誓いは、あらゆる争いの終わりです
  rationale: 原文の「確証のために」と「争いの終わり」の関係を保ちながら、現代日本語で明瞭にした。誓い自体の神学的是非を本文に付加せず、人間社会の慣行についての記述として訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。格言的な一般論として丁寧体を用い、原文の法的・社会的な響きを過度に専門化しない。
