id: HEB.6.8
reference: Hebrews 6:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: ja
  text: しかし、いばらやあざみを生じる土地は、役に立たず[a]、呪いに近く、その行き着く先は焼かれることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「退けられた」とも訳せる。
    reason: ἀδόκιμος には、試験にかなわず承認されない、または退けられたという意味もあるため。
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: 生じる
  rationale: 前節から続く土地を主語とする現在分詞。土地がいばらなどを生み出す農耕の比喩を、現代日本語で自然に表した。
- source_word: δὲ
  choice: しかし
  rationale: 良い作物を実らせる土地を述べた前節との対照を明確に示す。
- source_word: ἀκάνθας καὶ τριβόλους
  choice: いばらやあざみ
  rationale: 二種類の有害なとげのある植物を指す農耕表現として、分かりやすい慣用的な組み合わせを用いた。
- source_word: ἀδόκιμος
  choice: 役に立たず
  rationale: 試して承認されない、価値がないという語義を、土地の有用性という直接の文脈に即して表した。「退けられており」という可能性は脚注に残した。
- source_word: κατάρας ἐγγύς
  choice: 呪われる寸前で
  rationale: 直訳的には「呪いに近い」。日本語として自然に、呪いが差し迫っている意味を表す一方、すでに呪われたとはしなかった。
- source_word: ἧς τὸ τέλος
  choice: その行き着く先は
  rationale: 関係代名詞は前節からの土地を受ける。「終わり」の時間的・帰結的な含みを自然な日本語で保った。
- source_word: εἰς καῦσιν
  choice: 焼かれることです
  rationale: 火で焼くという農耕のイメージをそのまま保ち、地獄や最終的断罪とは明示しなかった。
theological_decisions:
- issue: 前節から継続する主語を本文で明示するか
  choice: 「その土地」を補って明示する
  alternative: 代名詞だけで「それは」とする
  rationale: ギリシア語の女性単数分詞は前節の「土地」を受けるが、日本語では主語を補わないと文意が不明瞭になる。新しい解釈を加えず、比喩の連続性を明確にした。
- issue: ἀδόκιμοςを強い神学的含意のある語で訳すか
  choice: 本文は「役に立たず」、脚注に「退けられており」
  alternative: 本文を「退けられており」とする
  rationale: 直接の農耕文脈では土地の無用性が前面に出るが、拒絶・不承認という語義も重要なので脚注で保持した。
- issue: εἰς καῦσινを最終的審判として明示するか
  choice: 「焼かれること」と比喩のまま訳す
  alternative: 「火の裁きを受けること」と説明的に訳す
  rationale: 原文自体は農耕の比喩以上の対象を明示していないため、神学的緊張を保ち、特定の教理的説明を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、農耕の比喩と警告の厳粛さを保った。「行き着く先」によって τέλος の帰結的な力を自然に示した。
