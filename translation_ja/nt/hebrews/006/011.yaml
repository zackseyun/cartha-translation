source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: ja
  text: 私たちは、あなたがた一人ひとりが、希望に関する十分な確信[a]に至るために、最後まで[b]同じ熱心さを示すことを願っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「希望について完全に確信すること」。このギリシア語は、満ちた確かさ、または十分な確信を意味しうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「終わりに至るまで」。ここでは、同じ熱心さを示すことを継続する趣旨を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: 願っています
  rationale: 強い願望を表す語だが、ここでは牧会的な勧めなので、過度に感情的にならず切実さを伝える表現とした。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: 前節からの緩やかな展開を示す小辞であり、日本語では文脈上明らかなため、無理に「しかし」などを補わない方が自然である。
- source_word: ἕκαστον ὑμῶν
  choice: あなたがた一人ひとり
  rationale: 共同体の全員に個別に勧めている分配的な意味を明確にした。
- source_word: τὴν αὐτὴν
  choice: 同じ
  rationale: 前節までに述べられた愛と奉仕における熱心さを受ける表現として簡潔に訳した。
- source_word: ἐνδείκνυσθαι
  choice: 示してほしい
  rationale: 態度や性質を行動によって表す意味を、現代日本語で自然に伝える。
- source_word: σπουδὴν
  choice: 熱心さ
  rationale: 持続的な真剣さと励みを表す。単なる感情的な熱狂ではなく、行動に現れる勤勉さを含む。
- source_word: πρὸς
  choice: ために
  rationale: 目標・目的への方向性を自然な日本語で示した。ただし、確信が努力によって獲得されると断定する意図はない。
- source_word: πληροφορίαν
  choice: 十分な確信
  rationale: 満ちた確かさ、十分な確信を表す語であり、主観的安心だけに限定しない表現とした。
- source_word: ἐλπίδος
  choice: 希望についての
  rationale: 希望を単なる願望ではなく、確かな期待として示しつつ、属格の関係を限定しすぎない訳とした。
- source_word: ἄχρι τέλους
  choice: 最後まで
  rationale: 終わり、または完成に至るまで継続することを簡潔に表した。
theological_decisions:
- issue: 「希望についての十分な確信」と忍耐との関係
  choice: 希望に関する確信を最後まで持ち続けるため、同じ熱心さを示すよう願う表現とした。
  alternative: 希望の内容が完全に実現するまで熱心さを示す、または救いについての内面的確信を完全にする。
  rationale: πληροφορία τῆς ἐλπίδος は、希望に伴う主観的な確信と、希望された約束の確かさ・成就の双方に開かれている。訳文と注で一方の教理体系だけに限定しないようにした。
- issue: ἄχρι τέλους が修飾する範囲
  choice: 日本語では「確信を最後まで持ち続ける」と読める配置にした。
  alternative: 「最後まで同じ熱心さを示す」と理解する。
  rationale: ギリシア語では「最後まで」が確信の持続にも熱心さの持続にも関係しうる。本文を自然にしつつ、注で後者の可能性も示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、勧告の切実さと書簡にふさわしい品位を保った。「確信」を内面的な救いの確証だけに狭めず、希望の確かさとの関係を注で補った。
