  naturalness: 「希望に関する十分な確信に至るために、最後まで同じ熱心さを示す」は、現代標準語として明瞭であり、勧告の格調も保つ。「希望についての十分な確信」も可能だが、「に関する」のほうが属格関係を不必要に限定しない。
  terminology: σπουδή は「熱心さ」、πληροφορία は「十分な確信」、ἐλπίς は「希望」としてよい。「確信」を特定の救いの確証という教理的意味に狭めないため、「希望に関する」とする。
