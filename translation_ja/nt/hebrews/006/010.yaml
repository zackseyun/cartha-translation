  source_fidelity: ギリシア語の「神は…忘れるほど不正ではない」という意味、働きと愛、過去の奉仕（アオリスト分詞）と継続中の奉仕（現在分詞）の対照はいずれも保持されている。ただし現行の「神の御名に示した愛」は日本語として結び付きがやや不自然で、εἰς τὸ ὄνομα αὐτοῦ の「御名のために／御名に向けて」という関係が明瞭でない。
  naturalness: 「神は不正な方ではないので、…忘れることはありません」は意味は通るものの、「忘れるほど不正な方ではありません」とすると原文の不定詞構文を自然な現代日本語で直接表せる。また、奉仕を愛を示す具体的行為として直前に置くことで修飾関係が明確になる。
  terminology: 「働き」「愛」「御名」「聖なる者たち」は適切である。「聖なる者たち」の注は、後代の列聖者に限定しない原文の用法を適切に説明している。
