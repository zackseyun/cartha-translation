revisions:
- from: 神は不正な方ではないので、あなたがたの働きと、聖なる者たち[a]に仕え、今も仕え続けることによって、神の御名に示した愛[b]とを忘れることはありません。
  to: 神は、あなたがたの働きと、聖なる者たち[a]に仕え、今も仕え続けることによって神の御名のために示した愛[b]とを忘れるほど、不正な方ではありません。
  rationale: εἰς τὸ ὄνομα αὐτοῦ を本文では「神の御名のために」とし、愛が御名との関わりにおいて示されたことを自然に明示した。脚注では「御名に対して」という方向性を保つ代案を示す。分詞二つは「仕え、今も仕え続ける」として、過去の奉仕と継続する奉仕の対照を維持した。
