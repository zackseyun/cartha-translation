id: HEB.6.10
reference: Hebrews 6:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: ja
  text: 神は、あなたがたの働きと、聖なる者たち[a]に仕え、今も仕え続けることによって神の御名のために示した愛[b]とを忘れるほど、不正な方ではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる者たち」とは、ここでは神に属する信者たちのことであり、後代に列聖された特定の人々だけを指すのではない。
    reason: cultural_note
  - marker: b
    text: 「神の御名に対して示した愛」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄδικος
  choice: 不正な方
  rationale: 神が彼らの働きを顧みないなら正義に反する、という文脈を、自然で dignified な現代日本語で表す。「不義」も可能だが、この構文ではやや教会用語的である。
- source_word: ἐπιλαθέσθαι
  choice: 忘れる
  rationale: 語の直接的な意味を保ちつつ、単に記憶から消えるだけでなく、行いを顧みないという文脈上の含みも許す。
- source_word: ἔργου
  choice: 働き
  rationale: 単数形の集合的な意味を保ち、後続する具体的な奉仕と自然につながる表現とした。
- source_word: ἀγάπης
  choice: 愛
  rationale: ἀγάπη の基本的で明瞭な訳語であり、ここでは奉仕によって具体的に示された愛を指す。
- source_word: ἐνεδείξασθε
  choice: 示した
  rationale: 愛を目に見える形で実証したという意味を、平明で自然な日本語にする。
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: 神の御名に
  rationale: εἰς の方向性を残し、神の名に向けられた献身・敬意という聖書的表現を維持する。「御名のために」も文脈上可能なので脚注に示す。
- source_word: διακονήσαντες
  choice: 仕え
  rationale: アオリスト分詞が示す、すでになされた奉仕を簡潔に表す。
- source_word: τοῖς ἁγίοις
  choice: 聖なる者たち
  rationale: 語義を直接保ちながら、後世の列聖制度に限定されない、神に属する信者たちという意味を脚注で明確にする。
- source_word: διακονοῦντες
  choice: 今も仕え続ける
  rationale: 現在分詞が前のアオリスト分詞と対照をなし、奉仕が継続中であることを明示する。
theological_decisions:
- issue: この節が人間の行いによる功績を教えるのか、それとも信者の働きを神が正しく覚えておられることを述べるのか
  choice: 神は正しい方なので、彼らの働きと愛を忘れない、と本文どおりに述べる。行いが救いを獲得するとは付け加えない。
  alternative: 人間の行いが功績となり、神には報酬を与える義務があるという強い読み。
  rationale: ギリシア語本文は、神が彼らの働きと愛を忘れることは不正に当たると述べるが、救いを行いで獲得するとは明言していない。神の正義と記憶についての緊張をそのまま保つ。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、「御名」「聖なる者たち」によって原文の聖書的語彙を保持した。過去の奉仕と現在も続く奉仕との相の対照は、「仕え、今も仕え続ける」で明示した。
