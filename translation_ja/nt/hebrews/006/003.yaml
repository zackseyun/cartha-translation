id: HEB.6.3
reference: Hebrews 6:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: ja
  text: そして、神がお許しになるなら、私たちはこのことを行います。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もし本当に神がお許しになるなら」とも訳せる。原文の「なら」に当たる語には、条件を強める含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の勧めを受けて著者の意向を述べる接続語として、自然な現代日本語の「そして」とした。
- source_word: τοῦτο
  choice: このこと
  rationale: 中性単数の指示代名詞であり、直前に述べられた、成熟へ進むという行為ないし方針を受ける。「これ」よりも指示内容が明瞭な「このこと」とした。
- source_word: ποιήσομεν
  choice: 私たちは……行います
  rationale: ποιέω の未来能動直説法を、その基本義に沿って訳した。文脈上は「先へ進みます」も可能だが、原文の簡潔さと指示内容の余地を保つため「行います」とした。
- source_word: ἐάνπερ
  choice: ……なら
  rationale: 条件を示す ἐάν に περ の強調が加わる。本文では自然な条件表現とし、強調の含みは脚注で示した。
- source_word: ἐπιτρέπῃ
  choice: お許しになる
  rationale: 「許す、許可する」を意味する現在能動接続法。神を主語とするため敬語を用い、現代日本語として自然で厳かな表現にした。
- source_word: ὁ θεός
  choice: 神
  rationale: 定冠詞付きの主語だが、日本語では「神」とするのが自然である。
theological_decisions:
- issue: 神の許しを条件とする節
  choice: 著者たちの意志を明言しつつ、その実行が神の許しにかかっているという実質的な条件として訳す。
  alternative: 「神のみこころなら」のような慣用表現に弱める、または神の決定作用について原文以上に踏み込んで意訳する。
  rationale: ἐάνπερ ἐπιτρέπῃ ὁ θεός は、神の許しを明示的な条件としている。人の意志と神の主権の関係を一方に解消せず、原文の緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「お許しになる」によって神を主語とする自然な敬意を示した。脚注標識 [a] は本文末に配置した。
