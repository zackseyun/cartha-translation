reference: Hebrews 6:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: ja
  text: 土地は、幾度もその上に降る雨を吸い込み、その土地が耕されるのもその人々のためであって、その人々に役立つ植物[a]を生じるなら、神から祝福を受けます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「草木」「草」、または「作物」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「耕す人々に役立つ植物」と理解することもできますが、原文の前置詞は、「その人々のために土地が耕される」という意味をより自然に表します。
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: 土地
  rationale: 農耕の比喩における、耕作される一区画の地面を自然に表す。
- source_word: πιοῦσα
  choice: 吸い込み
  rationale: 字義的には「飲む」だが、日本語で土地について「雨を飲む」はやや不自然なため、生き生きした受容のイメージを保つ「吸い込む」とした。
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: 幾度もその上に降る雨
  rationale: πολλάκιςの反復性と、土地の上に雨が来るという構造を自然な現代日本語で示す。
- source_word: τίκτουσα
  choice: 生じる
  rationale: 土地が植物を産出するという生成の意味を、簡潔で自然な農耕表現にした。
- source_word: βοτάνην
  choice: 作物
  rationale: 植物・草本一般も指し得る語だが、耕作と有用性を伴う文脈では「作物」が明瞭。ただし語義の幅を脚注に残す。
- source_word: εὔθετον
  choice: 役立つ
  rationale: 適合性と実用性を、普通の読者に分かりやすい現代語で表す。
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: 耕される目的である人々に
  rationale: διά＋対格の理由・目的の用法を優先し、その人々のために土地が耕されるという関係を保持する。
- source_word: μεταλαμβάνει
  choice: 受けます
  rationale: ここでは土地が神から祝福を得ることを自然に表す。
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: 神から祝福
  rationale: 祝福の源が神であることを明確にし、冠詞の有無を日本語で過度に限定しない。
theological_decisions:
- issue: 警告文脈における農耕の比喩
  choice: 農耕の比喩をそのまま保ち、実を結ぶ土地が神から祝福を受けると訳す。
  alternative: 真の信者・偽りの信者、または堅忍・背教についての特定の教理的結論を訳文に織り込む。
  rationale: 本節自体は農耕の類比の肯定面を述べており、論争のある神学的結論を明示してはいないため、その緊張を保持する。
- issue: δι’ οὓςの解釈
  choice: 「その人々のために／その人々を目的として」という目的・受益の意味
  alternative: 「その人々によって」という行為者の意味
  rationale: διά＋対格は通常、理由または目的を表す。ただし受動動詞との関係から行為者的に理解する可能性も脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。土地が雨を受け、作物を生じ、祝福を受けるという比喩の流れを維持した。脚注記号[a][b]は本文中に配置した。
