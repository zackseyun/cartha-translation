source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: ja
  text: それは、あなたがたが鈍くならず、信仰[a]と忍耐によって約束を受け継ぐ人々に倣う者となるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は「信頼」、文脈によっては「忠実さ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: 鈍くなる
  rationale: 応答や努力が遅く、活気を欠く状態を表す。直前の勤勉さへの勧めと対照を成し、「怠け者」と断定するよりも原語の幅を保つ。
- source_word: γένησθε
  choice: なる
  rationale: γίνομαι の変化・移行の意味を保ち、そのような状態に陥らないようにという警告を表す。
- source_word: μιμηταὶ
  choice: 倣う者
  rationale: 他の人々を模範として同じように歩むことを示す。「模倣者」より自然でありつつ、原語の明示的な模範への呼びかけを保つ。
- source_word: διὰ πίστεως
  choice: 信仰によって
  rationale: πίστις の標準的で神学的な広がりを保つ訳。「信頼」や「忠実さ」の含意は脚注で示す。
- source_word: μακροθυμίας
  choice: 忍耐によって
  rationale: 長い時間をかけて待ち耐える態度を、明瞭で現代的な日本語で表す。
- source_word: κληρονομούντων
  choice: 受け継ぐ人々
  rationale: 現在分詞が示す、そのような人々を特徴づける継続的・一般的な性格を自然に表す。
- source_word: τὰς ἐπαγγελίας
  choice: 約束
  rationale: 複数形は日本語では無標でも集合的に表現でき、神の複数の約束を指す文脈を保つ。「約束されたもの」として内容に置き換えず、原語の名詞を維持する。
- source_word: ἵνα μὴ
  choice: それは、…ことなく、…ためです
  rationale: 前節の勧めに結びつく目的の意味を、自然な日本語で明示する。
theological_decisions:
- issue: 勧告の文脈における πίστις の訳
  choice: 信仰
  alternative: 信頼、または忠実さ
  rationale: ここでは神に信頼することが中心と考えられるが、πίστις には文脈により忠実さの含意もあり得る。本文では標準的で幅のある「信仰」を用い、可能なニュアンスを脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告としての厳粛さを保った。「鈍くなる」は直前の霊的な停滞とのつながりを示し、「倣う者」は不自然に硬い「模倣者」を避けつつ原語の意味を保持する。
