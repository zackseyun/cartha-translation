id: HEB.6.6
reference: Hebrews 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: ja
  text: また、離反した人々を[a]、再び悔い改めに至らせることはできません。彼らが、自分たちのために神の御子を再び十字架につけ、公然と辱めているからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「背教した人々」。ギリシア語の動詞は、重大な離反を表し得ます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らが、自分たちのために神の御子を再び十字架につけ、公然と辱めている間は」。二つのギリシア語分詞は、理由を説明するとも、同時的な状況を示すとも取れます。
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: 堕落してしまった人々
  rationale: 文脈上、単なる失敗ではなく重大な離反を表す。一方、本文では後代の専門的な教義用語に限定せず、警告の重さを保った。
- source_word: πάλιν ἀνακαινίζειν
  choice: もう一度…立ち返らせる
  rationale: πάλινの反復性と、ἀνακαινίζεινが以前の状態への回復を表すことを、自然な現代日本語で示した。
- source_word: εἰς μετάνοιαν
  choice: 悔い改めへと
  rationale: εἰςの方向・到達点を「へと」で示し、μετάνοιαは聖書文脈で一般に理解される「悔い改め」とした。
- source_word: ἀνασταυροῦντας
  choice: 再び十字架につけ
  rationale: ἀνα-の反復と現在分詞の継続的・同時的な性格を保つ表現とした。
- source_word: ἑαυτοῖς
  choice: 自分たちにとって
  rationale: 与格の関係・利害の意味を直訳寄りに残し、彼ら自身の側における行為であることを示した。
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: 神の御子
  rationale: キリスト論的称号を、現代日本語の聖書文体として自然かつ荘重に訳した。
- source_word: παραδειγματίζοντας
  choice: 公然と辱めている
  rationale: 人前にさらして恥辱を与えるという語の社会的・公的側面を明示した。
theological_decisions:
- issue: 前節から続く「不可能である」という統語関係
  choice: 独立した断定を補わず、「立ち返らせることです」として前文への依存を残した
  alternative: 「そのような人々を再び悔い改めへと立ち返らせることは不可能です」と補う
  rationale: ギリシア語では本節が6:4から続く構文の一部であり、本節だけに新たな有限動詞はないため。
- issue: παραπεσόνταςが指す離反の教義的性質
  choice: 堕落してしまった
  alternative: 背教した
  rationale: 重大な離反という力は保ちつつ、救いの喪失、見せかけの信仰、最終的背教など、後代の特定の教義体系を本文に持ち込まないため。
- issue: 二つの現在分詞の論理関係
  choice: 理由を表す「からです」と訳した
  alternative: 同時性を表す「…している間は」
  rationale: 分詞は更新が不可能である理由を説明すると読むのが自然だが、同時的状況を表す可能性も脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、前節に依存する原文の構文、重大な警告、分詞の解釈上の余地を保った。「御子」「悔い改め」は一般読者にも通じる、品位ある聖書語彙として採用した。
