reference: Hebrews 6:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: ja
  text: しかし、愛する皆さん、たとえ私たちがこのように語っていても、あなたがたには、もっと良い、救いに伴う事柄[a]があると確信しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「救いに関わる事柄」「救いに属する事柄」。
    reason: ἐχόμενα σωτηρίαςは「救いに伴う」とも「救いに関わる／属する」とも訳し得る。本文では特定の神学的因果関係を示さない表現を採った。
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: 確信しています
  rationale: 完了形が表す、確立した確信の状態を自然な現代日本語で示す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の厳しい警告から、読者への肯定的な確信へ転じる対照を明示する。
- source_word: περὶ ὑμῶν
  choice: あなたがたについては
  rationale: περί＋属格の意味を保ちつつ、対照を表す「は」によって日本語として自然にした。
- source_word: ἀγαπητοί
  choice: 愛する皆さん
  rationale: 呼びかけの愛情と共同体的な重みを保ちながら、現代の一般読者に自然に通じる表現とした。
- source_word: τὰ κρείσσονα
  choice: もっと良いこと
  rationale: 比較級の力を明確に保ち、直前に述べた滅びに至る事柄との対比を伝える。
- source_word: ἐχόμενα σωτηρίας
  choice: 救いに伴うこと
  rationale: ἔχομαι＋属格が示す密接な関連を表す。「救いに属すること」も可能だが、日本語では「救いに伴うこと」が簡潔で自然であり、証拠・結果・原因のいずれかに限定しない。
- source_word: εἰ καὶ
  choice: たとえ…ても
  rationale: 文脈上の譲歩を自然な日本語で明確に示す。
- source_word: οὕτως λαλοῦμεν
  choice: 私たちがこのように語っていても
  rationale: 直前の厳しい警告の語り方と内容を指す曖昧さをそのまま保つ。
theological_decisions:
- issue: 警告の文脈におけるἐχόμεναとσωτηρίαςの関係
  choice: 「救いに伴うこと」とし、救いと密接に結びつく事柄を表すにとどめた。
  alternative: 「救いに属すること」「救いにつながること」
  rationale: 本文は読者に救いと結びつく、より良い事柄があるとの確信を示すが、それが救いの証拠、随伴物、結果、原因のいずれであるかは特定していない。「救いにつながる」は目的・結果の方向性を強めるため避けた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「愛する皆さん」により原文の温かな呼びかけを保ち、文全体は厳しい警告後の慰めと確信が伝わる語順に整えた。
