- from: というのも、一度光に照らされ[c]、天からの賜物を味わい[a]、聖霊にあずかる者となった[b]人々については、不可能だからです――
  to: というのも、一度光に照らされ[c]、天の賜物を味わい[a]、聖霊にあずかる者となった[b]人々を、……することは不可能だからです――
  rationale: 本節は原文でも後続の6節へ続く未完結な構文です。そのため後続内容を補わず、省略記号とダッシュを維持しました。ただし「人々を、……することは」という形にして、原文の対格が後続の不定詞の目的語であることを日本語でも示しました。「天からの賜物」を「天の賜物」に改め、ἐπουράνιοςの属性的で意図的に非限定的な表現を保ちました。
