id: HEB.6.4
reference: Hebrews 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: ja
  text: というのも、一度光に照らされ[c]、天の賜物を味わい[a]、聖霊にあずかる者となった[b]人々を、……することは不可能だからです――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「味わう」は、単に少し試すことだけでなく、実際に経験することを表す場合があります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖霊を分かち合う者となった」「聖霊に参与する者となった」。
    reason: lexical_alternative
  - marker: c
    text: 「光に照らされた」は、霊的な光や教えを受けたことを広く指し得ます。回心または洗礼を指すと解する見方もあります。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδύνατον
  choice: 不可能だからです
  rationale: 文頭で強調された述語形容詞。「不可能です」に説明の接続辞 γάρ を合わせ、前文とのつながりを自然な日本語で示した。何が不可能なのかは後続節で明らかになるため、本節だけでは未完のまま保つ。
- source_word: γὰρ
  choice: というのも、…だからです
  rationale: 直前の勧告・警告を説明する接続関係を示す。理由を過度に限定せず、現代日本語として自然な形にした。
- source_word: ἅπαξ
  choice: 一度
  rationale: 過去の一回の出来事を表す。「ただ一度限り」とまで強めず、原語の幅を保つ。
- source_word: φωτισθέντας
  choice: 光に照らされ
  rationale: 受動態の光の比喩を保持し、回心や洗礼と明示的に同一視しない表現とした。
- source_word: γευσαμένους
  choice: 味わい
  rationale: 原語の具体的な比喩を保つ。この動詞は実際に経験することも表し得るため、単なる試食・浅い接触とは限定しない。
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: 天からの賜物
  rationale: 「天に属する賜物」と「天から来る賜物」の含みを自然な日本語で表しつつ、賜物の正体は特定しない。
- source_word: μετόχους γενηθέντας
  choice: あずかる者となった
  rationale: γίνομαι の状態への移行と μέτοχος の共有・参与の意味をともに表す。古すぎないが尊厳ある聖書語として「あずかる」を用いた。
- source_word: πνεύματος ἁγίου
  choice: 聖霊
  rationale: μέτοχος が支配する属格として「聖霊にあずかる」とした。新約本文の神的な指示対象を示す標準的な表記である。
theological_decisions:
- issue: φωτισθέντας が回心または洗礼を特定しているか
  choice: 「光に照らされ」と比喩をそのまま訳す
  alternative: 「回心した」「洗礼を受けた」
  rationale: 原文は霊的な光や教えを受けることを示し得るが、ここで回心または洗礼と明示してはいない。教派的な限定を避け、解釈上の幅を残す。
- issue: γευσαμένους が浅い接触か十分な経験か
  choice: 「味わい」と訳し、経験の深さを本文で決めない
  alternative: 「経験し」「少しだけ味見し」
  rationale: この動詞は比喩的に現実の経験を表し得る一方、その経験の範囲は語だけでは確定しない。背教と堅忍をめぐる議論を訳語で決着させない。
- issue: 聖霊への参与が救いに関して何を意味するか
  choice: 「聖霊にあずかる者となった」と直接的に訳す
  alternative: 「聖霊の内住を受けた」「聖霊に少し触れた」
  rationale: 原文の強い参与表現を弱めず、同時にその組織神学的帰結を付加しない。
- issue: 節の途中で終わる統語構造
  choice: ダッシュで後続節への継続を示し、何が不可能かを補わない
  alternative: 後続する6節の内容を本節に補って完全文にする
  rationale: Ἀδύνατον が支配する内容は後続本文まで続く。本節単独では意図的に未完であるため、原文にない内容を先取りしない。
translation_notes:
  register: 明瞭で現代的な標準語を基調としつつ、「賜物」「聖霊にあずかる」により聖書本文としての品位を保った。本節はギリシア語でも後続節へ続く未完の構文なので、末尾のダッシュで継続を明示した。脚注記号は対応する語句の直後に置いた。
