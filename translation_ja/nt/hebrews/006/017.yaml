id: HEB.6.17
reference: Hebrews 6:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: ja
  text: そこで神は、ご自分の計画が変わることのないものであることを、約束を受け継ぐ人々にいっそうはっきり示そうと望み、誓いをもって保証されました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「誓いを間に置かれました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: そこで
  rationale: 直前のアブラハムへの約束と誓いを受ける論理的な接続を、現代日本語で自然に示す。
- source_word: περισσότερον
  choice: いっそうはっきり
  rationale: ἐπιδεῖξαιと結びつき、神が目的の不変性をさらに明瞭に示す意図を表す。
- source_word: βουλόμενος
  choice: 示そうと望み
  rationale: 単なる願望ではなく、神の意図的な望みを表す分詞の意味を保つ。
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: 約束を受け継ぐ人々に
  rationale: 「約束の相続人」という直訳的表現より自然でありながら、約束を受領する者という相続の比喩を保つ。
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: ご自分の計画が変わることのないものであること
  rationale: 神のβουλήが変更不能であるという意味を、専門的な「不変性」や古風な「み旨」に頼らず明確に表す。
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: 誓いをもって保証されました
  rationale: この文脈で、神が誓いによって確証を与えたという機能的意味を自然に表す。動詞のより逐語的な意味は脚注に示す。
theological_decisions:
- issue: 神のβουλήの不変性を、後代の形而上学的概念を持ち込まずに表すこと
  choice: ご自分の計画が変わることのないものであること
  alternative: ご自分の決意の不変性／ご自分の計画の不変性
  rationale: 本文が強調するのは、神の計画・意図が変更されないことである。「計画」はβουλήの熟慮された目的を伝え、「変わることのない」は専門用語化を避ける。
- issue: ἐμεσίτευσενと誓いの関係
  choice: 誓いをもって保証されました
  alternative: 誓いによって確証されました／誓いを間に置かれました
  rationale: 誓いが約束の相続人に確かな保証を与えるという文脈上の働きを明示しつつ、神と神より上位の保証者がいるとの誤解を避ける。逐語的な像は脚注に保存する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「約束を受け継ぐ人々」で相続の概念を自然に伝え、神への敬意を示すため尊敬表現を用いた。
