  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: ja
  text: 種々の洗い[a]についての教え、手を置くこと、死者の復活、そして永遠の裁き。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「種々のバプテスマ」。ギリシア語は複数形で、キリスト教の洗礼に限らず、儀礼的な清めの洗いを広く指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: 種々の洗い
  rationale: 複数形を反映し、ユダヤ教的・儀礼的な清めの洗いを広く指し得る語義を保った。「バプテスマ」に限定すると、複数回のキリスト教的洗礼を意味するかのような誤解を招き得る。
- source_word: διδαχὴν
  choice: についての教え
  rationale: 前節から続く基礎事項の列挙として自然であり、後続する各属格句に関わる教えを表す。
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: 手を置くこと
  rationale: 行為を明瞭に表す現代日本語で、特定の教会制度や儀礼的解釈を付加しない。
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: 死者の復活
  rationale: 属格構文とνεκρῶνの集合的意味を自然な定型表現で保持する。
- source_word: κρίματος αἰωνίου
  choice: 永遠の裁き
  rationale: κρίμαを「刑罰」や「断罪」に狭めず、αἰώνιοςの終末論的な継続性を簡潔に表す。
- source_word: τε ... τε καὶ
  choice: 読点による列挙と「そして」
  rationale: 原文の連結構造を、過度に硬くならない自然な日本語の並列で示す。
theological_decisions:
- issue: βαπτισμῶνが指す範囲
  choice: 本文では「種々の洗い」とした。
  alternative: 「種々のバプテスマ」または「洗礼」
  rationale: 複数形と語の用例は、キリスト教の洗礼だけでなく儀礼的な清めの洗い全般を含み得る。本文で限定せず、別訳を脚注に示した。
- issue: κρίματος αἰωνίουの範囲
  choice: 「永遠の裁き」とした。
  alternative: 「永遠の断罪」
  rationale: 原文は裁きの結果を断罪だけに限定していないため、その幅を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「種々の」によって原文の複数形を示し、「洗い」というやや一般的な語に脚注を添えて語義上の曖昧さを保存した。前節から続く文の断片であるため、原文どおり完全文には補わない。
