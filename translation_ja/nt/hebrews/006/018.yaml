id: HEB.6.18
reference: Hebrews 6:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: ja
  text: それは、神が偽ることのできない二つの変わることのない事柄によって、避け所へ逃れて来た私たちが[a]、前に置かれている希望をしっかりつかむための[b]力強い励ましを得るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「避け所へ逃れて来た」は、危険から逃れて安全な場所に身を寄せる姿を表します。旧約聖書の「逃れの町」を思わせる可能性があります。
    reason: καταφυγόντεςに含まれる避難・庇護の具体的な比喩を示すため。
  - marker: b
    text: 「しっかりつかむ」は「つかむ」「固く保つ」とも訳せます。
    reason: κρατῆσαιの語義の幅を示すため。
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためです
  rationale: 前節から続く目的・結果を表す。日本語として自然に文を結びつつ、ἵναの目的的な力を保つ。
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: 二つの変わることのない事柄によって
  rationale: πράγματαの広い意味を「事柄」で保ち、ἀμεταθέτωνは変更され得ないことを明確に表した。文脈上は約束と誓いを指すが、本文では明示的な補足を加えない。
- source_word: ἐν οἷς ἀδύνατον ψεύσασθαι θεόν
  choice: 神が偽ることのできない
  rationale: 直訳的な「その中で」は日本語では不自然なため、二つの事柄を修飾する形に統合した。神にとって偽ることが不可能だという原文の強い断定を保つ。
- source_word: ἰσχυρὰν παράκλησιν ἔχωμεν
  choice: 力強い励ましを得る
  rationale: παράκλησιςには慰め・励まし・勧めの幅があるが、ここでは希望をつかむよう人を強める働きを「励まし」で自然に表した。ἰσχυράνは「力強い」とした。
- source_word: οἱ καταφυγόντες
  choice: 逃れて来て避け所を求めた私たち
  rationale: καταφεύγωに含まれる、危険から逃れて安全な場所に身を寄せる具体的な動きを保った。「避難した」だけでは比喩の宗教的・物語的響きが弱いため、この表現を選んだ。
- source_word: κρατῆσαι
  choice: しっかりつかむ
  rationale: κρατέωの「つかむ」「固く保持する」という意味の幅を自然な日本語で表し、希望を能動的に自分のものとして保持する像を保つ。
- source_word: τῆς προκειμένης ἐλπίδος
  choice: 目の前に置かれている希望
  rationale: πρόκειμαιの「前に置かれている、提示されている」という客観的な像を保つ。「私たちの」を補わず、原文の簡潔さを維持した。
theological_decisions:
- issue: 避け所と希望の比喩
  choice: 「逃れて来て避け所を求めた」「希望をしっかりつかむ」と具体的に訳す
  alternative: 「よりどころを求めた私たちが、希望を堅く保つ」
  rationale: 原文は避難・庇護を求める動きと、希望をつかむ行為を結びつけている。抽象的な安心の表現へ平板化せず、両方の比喩を保持した。
- issue: 神が偽ることの不可能性
  choice: 「神が偽ることのできない」
  alternative: 「神は決して偽らない」
  rationale: 原文は単に神が偽らないと述べるのでなく、偽ることが不可能だと明言する。その強さを保ちつつ、本文を越えた体系的説明は加えない。
- issue: 「二つの事柄」の指示対象
  choice: 本文では「二つの変わることのない事柄」とのみ訳す
  alternative: 「神の約束と誓いという、二つの変わることのない事柄」
  rationale: 文脈上の指示対象は約束と誓いだが、この節自体はそれを明示せず「二つの事柄」と述べるため、翻訳本文では補足しない。
translation_notes:
  register: 明瞭で現代的かつ品位のある常体寄りの聖書文体。「変わることのない」は「不変の」より一般読者に分かりやすく、「力強い励まし」は原文の強調を自然に伝える。脚注標識[a]は本文末に置き、避け所の比喩と「つかむ／固く保つ」の両方を注記した。
