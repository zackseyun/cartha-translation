id: HEB.6.15
reference: Hebrews 6:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: ja
  text: こうしてアブラハムは、忍耐強く待った末に、約束を得た。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「約束されたものを受けた」。ギリシア語をより直訳すると「約束を得た」。
    reason: 「約束」そのものと「約束されたもの」のどちらを指すかという原文の幅を示すため。
lexical_decisions:
- source_word: καὶ οὕτως
  choice: こうして
  rationale: 前節の神の誓いを受け、経緯と結果を自然につなぐ。καίとοὕτωςを一まとまりとして簡潔に表した。
- source_word: μακροθυμήσας
  choice: 忍耐強く待った末に
  rationale: 長く耐えることを表すアオリスト分詞。約束の実現を待つ文脈と、主動詞に先立つ時間的関係を自然な日本語で示した。
- source_word: ἐπέτυχεν
  choice: 得た
  rationale: 到達する、獲得するという意味を簡潔に表し、完全な成就を受けたとまでは限定しない。
- source_word: τῆς ἐπαγγελίας
  choice: 約束
  rationale: 原文の名詞を保ち、約束されたものと意訳して意味を一方に確定することを避けた。
- source_word: implicit subject
  choice: アブラハムは
  rationale: ギリシア語では主語が省略されているが、直前の文脈上アブラハムを指す。日本語で明確かつ自然になるよう補った。
theological_decisions:
- issue: 「約束を得た」が約束の完全な成就を受けたことまで意味するか
  choice: 約束を得た
  alternative: 約束されたものを受けた
  rationale: 原文は「約束」を目的語とし、その実現内容を明示していない。ヘブライ書内にある約束と成就をめぐる緊張を保ち、完全な成就と断定しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「待った末に」により時間的経過を示し、「忍耐強く」でμακροθυμέωの含意を保持した。
