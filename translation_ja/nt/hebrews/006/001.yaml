id: HEB.6.1
reference: Hebrews 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: ja
  text: ですから、メシアに関する初歩の教えを後にして、成熟へと導かれていきましょう[a]。死んだ行いからの悔い改めと、神に対する信仰という土台を、もう一度据え直すことなく[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアについての初めの教え」または「メシアの初歩の教え」とも訳せる。また、「成熟」は「完成」または「完全」とも訳せる。「導かれていきましょう」は、より簡潔に「先へ進みましょう」とも訳せるが、原文は受動形である。
    reason: lexical_alternative
  - marker: b
    text: 「神に対する信仰」は「神への信仰」または「神を信頼すること」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の議論を受けて勧告を導く推論的な接続詞として、現代日本語で自然に表した。
- source_word: ἀφέντες
  choice: 後にして
  rationale: 初歩を否定したり捨て去ったりするのではなく、そこを出発点として先へ進む文脈を表す。
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: メシアについての初歩の教え
  rationale: 難しい属格連鎖を文脈に即して理解し、λόγοςを「教え」、τῆς ἀρχῆςを「初歩」とした。τοῦ Χριστοῦが「メシアについて」か「メシアの」かには幅があるため脚注を付した。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは称号としての意味が明瞭であり、現代日本語でも理解できる形を採った。
- source_word: ἐπὶ τὴν τελειότητα
  choice: 成熟へと
  rationale: 初歩的教えとの対比から、罪のない絶対的完全よりも、十分に成長した状態を指すと考えられる。別訳は脚注に残した。
- source_word: φερώμεθα
  choice: 導かれて進みましょう
  rationale: 受動形の含みを「導かれて」で保持しつつ、日本語として不自然にならないよう「進みましょう」を添えた。
- source_word: θεμέλιον καταβαλλόμενοι
  choice: 土台を、もう一度据える
  rationale: 基礎的教えを建築の土台にたとえる比喩をそのまま保った。
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: 死んだ行いからの悔い改め
  rationale: μετάνοιαを一般的で神学的にも過度に限定しない「悔い改め」とし、「死んだ行い」の比喩的な曖昧さを保持した。
- source_word: πίστεως ἐπὶ θεόν
  choice: 神に向ける信仰
  rationale: ἐπί＋対格の方向性を表し、「神への信仰」より原文のニュアンスを明示した。自然な別訳を脚注に示した。
theological_decisions:
- issue: 初歩の教えを「後にする」ことが、その否定または放棄を意味するか
  choice: 現在の焦点として初歩を後にし、そこから成熟へ進むことを表す。
  alternative: メシアについての教えそのものを捨てる。
  rationale: 直後の「土台をもう一度据えない」という比喩は、土台の否定ではなく、その上に建て進めることを示唆する。
- issue: τελειότηςが完全無欠を意味するか、成熟を意味するか
  choice: 成熟
  alternative: 完全、完成
  rationale: 初歩との対比を自然に伝え、罪のない完全という解釈を本文に持ち込まないため。ただし語義の幅は脚注に残した。
- issue: φερώμεθαの受動態をどう表すか
  choice: 導かれて進みましょう
  alternative: 先へ進みましょう
  rationale: 原文の受動的な形を保持しつつ、その動作主体を神などと明示せず、原文の余白を保った。
- issue: 「死んだ行い」の意味
  choice: 比喩をそのまま保持する。
  alternative: 命のない行い、死に至らせる行い
  rationale: 原文だけでは、霊的に無益な行い、死に属する行い、死に至らせる行いなどのどれか一つに限定できないため。
translation_notes:
  register: 明快な現代標準日本語を用い、勧告の荘重さを保った。「導かれて進みましょう」で原文の受動態を再現しつつ、行為者を補わなかった。節末のコンマは後続節に続く原文の構文によるが、単節として読みやすいよう句点で閉じた。
