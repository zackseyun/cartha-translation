reference: 2 Timothy 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: ja
  text: 主は、あらゆる悪い行いから私を救い出し、ご自分の天の御国に救い、入れてくださいます[a]。主に栄光が世々限りなくありますように[b]。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近く「ご自分の天の御国へと救ってくださいます」。
    reason: σώσει εἰςは「救う」と御国への到達を結び付ける表現である。本文では、自然な日本語でその両方を明示する。
  - marker: b
    text: 直訳「時代の時代に至るまで」。
    reason: εἰς τοὺς αἰῶνας τῶν αἰώνωνの、永続を強める反復表現の字義を示すため。
lexical_decisions:
- source_word: ῥύσεταί
  choice: 救い出してくださいます
  rationale: 危険や脅威から解放するというῥύομαιの意味を、現代日本語で明確に表す。「救う」だけでなく「救い出す」とすることで、ἀπό（〜から）との結びつきも自然になる。
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: あらゆる悪い行いから
  rationale: ἔργονを文脈に即して「行い」、πονηρόςを「悪い」とした。παντόςの包括性は「あらゆる」で表し、悪が誰の行為であるかは原文同様に特定しない。
- source_word: σώσει
  choice: 救い入れてくださいます
  rationale: σῴζωの救済的な重みと、εἰςが示す御国への到達・進入を一つの自然な日本語表現にまとめた。単なる移送ではなく、最終的な救いの意味を保つ。
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: ご自分の天の御国へと
  rationale: εἰςの方向性を「へと」で表し、αὐτοῦは敬意を含む「ご自分の」とした。ἐπουράνιονは、明瞭で自然な「天の」と訳した。
- source_word: κύριος
  choice: 主
  rationale: 権威と信仰告白の含意を持つκύριοςの標準的な訳語を用いた。
- source_word: ᾧ ἡ δόξα
  choice: 主に栄光が…ありますように
  rationale: 関係代名詞ᾧの指示先を日本語で自然に示しつつ、動詞のない頌栄句が持つ祈願・帰属の力を「ありますように」で表した。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 字義的には「代々の世に至るまで」だが、終わりのない永続を表す定着した荘重な日本語として「世々限りなく」を採用した。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な肯定表現として、日本語で定着した音訳を用いた。
theological_decisions:
- issue: 現在の救出と天の御国への最終的な救いとの関係
  choice: 第一の動詞を「救い出す」、第二の動詞を「救い入れる」と訳し、両者の区別と連続性を保った。
  alternative: 主がパウロを肉体的な死から必ず救い出すという約束として訳す。
  rationale: 「天の御国へ」という到達点は、処刑の回避だけでなく最終的な救いを視野に入れている。訳文は、地上での危険からの救出と終末的救済の関係を断定しすぎず、殉教の可能性とも両立する原文の緊張を残す。
- issue: 「あらゆる悪い行い」の主体
  choice: 誰の悪い行いかを補わない。
  alternative: 「私が悪い行いをすることから」または「他者の悪事から」と明示する。
  rationale: 原文は行為の主体を明示していないため、本人が悪を行うことから守られる意味にも、他者の悪事から救われる意味にも限定しない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、頌栄句では「御国」「世々限りなく」「アーメン」を用いて聖書本文にふさわしい品位を保った。「救い入れる」はやや荘重だが理解可能であり、σώσειとεἰςの双方を一語で自然に結びつける。
