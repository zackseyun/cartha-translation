source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: ja
  text: そして彼らは、真理から耳をそむけ[a]、作り話[b]のほうへそれて行くでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聞くことを真理から背ける」。または「真理を聞こうとしなくなる」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神話」「寓話」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: 真理
  rationale: 定冠詞を伴い、文脈上、使徒的教えとして知られている真理を指すが、「福音」や「健全な教え」と限定せず、原語の広がりを保った。
- source_word: ἀκοὴν
  choice: 耳
  rationale: 字義的には「聞くこと」「聴覚」だが、「真理から耳を背ける」は、聞くことを意図的に拒む比喩を自然な現代日本語で表す。字義的な表現は脚注に示した。
- source_word: ἀποστρέψουσιν
  choice: 背け
  rationale: 「向きを変えて離す」という能動的な意味を保ち、「耳を背ける」という日本語の自然な結びつきで、意図的な拒絶を表した。
- source_word: μύθους
  choice: 作り話
  rationale: ここでは真理と対照される、作られた物語や根拠のない言説を指す。「神話」では古代宗教の神々の物語に意味が狭まりやすいため、本文では「作り話」とし、別訳を脚注に示した。
- source_word: ἐκτραπήσονται
  choice: それて行くでしょう
  rationale: 受動・中動形が持つ「脇道へそれる、向きを変える」という意味を、行為者を過度に特定しない自然な自動詞表現で訳した。
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: 真理から…作り話のほうへ
  rationale: μέν…δέの対照を、「から」と「のほうへ」という方向の対比によって明確に表した。
theological_decisions:
- issue: 「真理」の内容
  choice: 「真理」と訳し、それ以上の説明を本文に加えない。
  alternative: 「健全な教え」「福音の真理」
  rationale: 文脈上は使徒的教えと密接に関係するが、原文はより広い語を用いているため、特定の内容に狭めず、神学的な広がりを保った。
- issue: 作り話へそれる際の主体性
  choice: 「それて行く」とし、受動か中動かを断定しない。
  alternative: 「そらされる」「自らそれる」
  rationale: ἐκτραπήσονταιは受動・中動の形が同形であり、外からそらされることと自らそれることのどちらかに解釈を固定しない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「耳を背ける」と「それて行く」によって、原文の「真理から／作り話へ」という方向的な対照を自然に示した。
