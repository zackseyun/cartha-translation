  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: ja
  text: 私の最初の弁明の際、だれ一人私のもとに来てくれず[a]、皆が私を見捨てました。どうか、そのことが彼らに不利に数えられませんように[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「だれも私のもとに来なかった」。法廷の場面では、パウロを支えるために同席することを指すとも考えられます。「私の最初の弁明の際」は「私の最初の審理の際」または「私が最初に法的弁明をした際」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「それが彼らに数えられませんように」。または「どうか、そのことが彼らの責任に問われませんように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ
  choice: 私が最初に弁明した時
  rationale: 法廷での正式な答弁・弁明を指す文脈を保ちつつ、第一段階の審理を指す可能性も排除しない自然な表現とした。
- source_word: οὐδείς μοι παρεγένετο
  choice: だれも私を支えるために出廷せず
  rationale: 動詞の基本義である「その場に来て居合わせる」と、この法廷文脈での支援・同席の含意をともに表した。
- source_word: πάντες με ἐγκατέλιπον
  choice: 皆が私を見捨てました
  rationale: 危機的状況にある人を残して去るという語義を、現代日本語で明瞭かつ厳粛に表す。
- source_word: μὴ αὐτοῖς λογισθείη
  choice: どうか、そのことが彼らの責任に問われませんように
  rationale: μήを伴うアオリスト受動態希求法の祈願的な力を「どうか…ませんように」で示し、λογίζομαιの算定・帰責の比喩を司法的文脈に自然な日本語で表した。
theological_decisions:
- issue: パウロを見捨てた人々に対する結びの句の調子
  choice: 赦しを願う祈願として「どうか、そのことが彼らの責任に問われませんように」
  alternative: 「そのことが彼らの責任に問われないように」または「彼らに負わせないでください」
  rationale: 希求法は単なる許可や断定よりも願い・祈りを自然に表す。何者が責任を問うのか、また赦しがどのように成立するのかは本文が明示しないため、補って限定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、法廷場面を「弁明」「出廷」「責任に問う」で示した。原文の厳粛さと、結びにある祈願的で寛容な調子を保った。
