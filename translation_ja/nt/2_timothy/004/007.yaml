base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: ja
  text: 私は立派な戦いを戦い抜き、競走を走り終え、信仰を守りました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「信義を守りました」「忠実であり続けました」。ギリシア語の「信仰」は、キリスト教信仰を指すことも、信義や忠実さを保つ意味を帯びることもあります。
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: 立派な戦い
  rationale: ἀγώνの「戦い・競技・奮闘」という比喩的な幅を保ちつつ、καλόςの「良い、立派な、尊い」を自然な現代日本語で表す。「良い戦い」よりも日本語として自然で、倫理的・価値的な肯定も伝わる。
- source_word: ἠγώνισμαι
  choice: 戦い抜き
  rationale: ἀγωνίζομαιの完了形が示す、最後までやり遂げた行為と現在に残る結果を簡潔に表す。後続する二つの完了形との並行も保つ。
- source_word: τὸν δρόμον
  choice: 走るべき道のり
  rationale: δρόμοςの競走・走路という運動競技の比喩を「走る」で明示し、「道のり」によって生涯の務めという含みも自然に伝える。
- source_word: τετέλεκα
  choice: 走り終え
  rationale: τελέωの完了形が表す完遂を、δρόμοςとの結びつきが明瞭な自然な日本語で表す。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: 定冠詞を伴うため「信仰の内容・キリスト教信仰」を指す可能性が高いが、忠実さ・信義という含みもあり得る。本文では簡潔な「信仰」とし、曖昧さを脚注で示す。
- source_word: τετήρηκα
  choice: 守りました
  rationale: τηρέωの「保つ、守る、保持する」という意味領域を自然に表し、信仰を保持したことと忠実であり続けたことの双方に開かれた表現とする。
theological_decisions:
- issue: τὴν πίστιν の意味
  choice: 信仰を守りました
  alternative: 信義を守りました／忠実であり続けました
  rationale: 定冠詞付きの πίστις は、パウロが保持したキリスト教信仰を指し得る。一方で、信義や忠実さを保ったという読みも語義上可能なので、本文で一方に過度に限定せず、脚注に代替理解を記す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。三つの節の簡潔な並行を維持し、完了形は「戦い抜き」「走り終え」「守りました」によって完遂と現在的な重みを表した。
