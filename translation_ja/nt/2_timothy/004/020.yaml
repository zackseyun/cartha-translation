base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: ja
  text: エラストはコリントにとどまりました。一方、私は病気だったトロフィモをミレトスに残してきました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: エラスト
  rationale: 人名Ἔραστοςの、日本語聖書で定着した音写を用いた。
- source_word: ἔμεινεν
  choice: とどまりました
  rationale: μένωのアオリストで、ある場所に滞在したことを表す。文脈に合う自然で格調ある表現とした。
- source_word: ἐν Κορίνθῳ
  choice: コリントに
  rationale: 都市名を伴うἐνの場所用法。「コリントに」が現代日本語として自然である。
- source_word: Τρόφιμον
  choice: トロフィモ
  rationale: 人名Τρόφιμοςの、日本語聖書で定着した音写を用いた。
- source_word: δὲ
  choice: 一方
  rationale: 二つの旅程報告の間の穏やかな対照を示す。強い逆接を避けつつ、δέの談話上の働きを明確にした。
- source_word: ἀπέλιπον
  choice: 私は……残してきました
  rationale: ἀπολείπωの一人称単数アオリスト。語り手がトロフィモをミレトスに残してその場を去ったことを自然な日本語で表した。
- source_word: ἐν Μιλήτῳ
  choice: ミレトスに
  rationale: 都市名を伴うἐνの場所用法。「ミレトスに」が自然である。
- source_word: ἀσθενοῦντα
  choice: 病気だったので
  rationale: トロフィモの当時の状態を表す現在分詞。日本語では理由として読むのが自然だが、原文は分詞の関係を明示しないため、別の捉え方を脚注に示した。
