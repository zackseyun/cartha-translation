  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: ja
  text: 金属職人アレクサンドロは、私に多くの害を加えました。主は、彼の行いに応じて彼に報いられます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本「主が、彼の行いに応じて彼に報いてくださいますように」。
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: 銅細工人
  rationale: χαλκεύςは銅・青銅などを扱う金属職人を指す語である。日本語では「金属細工人」より具体的で、伝統的な理解にも沿う「銅細工人」が自然であるが、扱った金属を厳密に限定する語とはみなさない。
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: 私に多くの害を加えました
  rationale: 直訳的な「私に多くの悪を示した」は現代日本語では意味が不明瞭になるため、この文脈で表す敵対的な行為とその被害を、自然な「多くの害を加えた」とした。πολλάの複数性も「多くの」で保った。
- source_word: ἀποδώσει
  choice: 報いられます
  rationale: 未来直説法として、願望ではなく将来の報いを述べる形にした。敬語ではなく、主を主語とする日本語の聖書文体で一般的な尊敬表現「られる」を用いた。
- source_word: κύριος
  choice: 主
  rationale: 定冠詞を伴うκύριοςを、定まった呼称として「主」と訳した。
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: 彼の行いに応じて
  rationale: ἔργαを「行い」とし、κατάの基準・対応の意味を「に応じて」で明確に表した。
theological_decisions:
- issue: ἀποδώσειを将来の断定として訳すか、祈願として訳すか
  choice: 主は、彼の行いに応じて彼に報いられます
  alternative: 主が、彼の行いに応じて彼に報いてくださいますように
  rationale: 提示されたSBLGNT本文のἀποδώσειは未来直説法であり、本文では神の報いについての将来の言明として訳す。一方、祈願形を伝える写本異読は脚注に残し、解釈上・本文上の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、文体の品位を保った。「多くの悪を示した」という不自然な逐語訳は避けつつ、敵対行為の強さと複数性を「多くの害を加えた」で表現した。
