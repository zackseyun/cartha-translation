    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: よろしく伝えてください
  rationale: 書簡の結びにおける挨拶の伝達を命じるアオリスト中動態命令形。現代日本語では「よろしく伝えてください」が自然で、命令の力を丁寧な依頼表現として保つ。
- source_word: Πρίσκαν
  choice: プリスカ
  rationale: 本文のΠρίσκανを直接音写した。「プリスキラ」という別形に置き換えず、原文の固有名詞の形を保持する。
- source_word: Ἀκύλαν
  choice: アキラ
  rationale: Ἀκύλαςの日本語聖書で定着した音写。
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: オネシフォロの家の人々
  rationale: οἶκοςは建物だけでなく、家族や同居者などから成る家共同体を指し得る。挨拶の対象が人々であることを自然な日本語で明示しつつ、血縁家族だけに限定しない表現とした。
