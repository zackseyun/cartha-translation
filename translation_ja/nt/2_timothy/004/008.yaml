id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: ja
  text: 今からは、義の冠[a]が私のために取っておかれています。その日に、正しい裁き主である主が、それを私にお授けになります。しかも、私だけでなく、主の現れを愛してきたすべての人にもお授けになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義の冠」。ギリシア語は「義」を意味し、文脈によっては「正義」や「公正」を意味することもあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: 今や
  rationale: 直前の「走るべき道のりを走り終えた」という文脈を受け、今後残されていることを指す時間的な意味を自然な日本語で表した。
- source_word: ἀπόκειταί
  choice: 取っておかれています
  rationale: すでに確保され、保管されている現在の状態を表し、原語の比喩も保つ。
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: 義の冠
  rationale: 属格の関係を限定せず、義に対する報い、義そのものから成る冠、正しい裁きによる顕彰などの可能な含意を残した。
- source_word: ἀποδώσει
  choice: お授けになります
  rationale: 勝者に冠を授与する文脈に合い、主に対する自然な敬意を示しつつ、与えるべきものを与える意味を表した。
- source_word: ὁ δίκαιος κριτής
  choice: 正しい裁判官
  rationale: 主が裁きにおいて正しい方であることを、現代の読者に明瞭な表現で示した。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: かの日に
  rationale: 終末的な特定の日を指す聖書的な響きを保ちながら、簡潔な日本語とした。
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: 愛してきたすべての人
  rationale: 完了分詞が示す、これまで形成され現在に至る持続的な姿勢を「愛してきた」で表した。
- source_word: τὴν ἐπιφάνειαν αὐτοῦ
  choice: 主の現れ
  rationale: ἐπιφάνειαを「来臨」へ狭めず「現れ」とし、代名詞の指示対象は日本語で明瞭になるよう「主」とした。
theological_decisions:
- issue: 「義の冠」の意味
  choice: 属格を「義の冠」のまま保持し、関係を特定しない。
  alternative: 義のゆえに授けられる冠／義そのものである冠／正しい裁きによる顕彰
  rationale: ギリシア語の属格は複数の解釈を許すため、本文が決着させていない神学的含意を訳文で一つに限定しない。
- issue: 「主」の指示対象
  choice: 本文では称号「主」を保ち、その現れとのつながりを明示する。
  alternative: 「主イエス」と補う／より一般的に神を指すと理解する
  rationale: 牧会書簡の文脈ではキリストを指す可能性が強いが、原文にない固有名を本文へ補わず、κύριοςをそのまま訳した。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、「かの日」「義の冠」により原文の荘重さと終末的な響きを保った。主への敬意は「お授けになります」で自然に示した。
