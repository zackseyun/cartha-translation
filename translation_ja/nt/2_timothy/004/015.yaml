  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: ja
  text: あなたも彼を警戒しなさい。彼は私たちの言葉[a]に強く反対したからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの知らせ」または「私たちの教え」。ギリシア語では「私たちの言葉」。
