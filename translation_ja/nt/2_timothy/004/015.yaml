lexical_decisions:
- source_word: ὃν καὶ σὺ φυλάσσου
  choice: あなたも彼を警戒しなさい
  rationale: ὃνは前節のアレクサンドロを指す。「あなたも」はκαὶ σὺの強調を保ち、現在命令形φυλάσσουは、本人に対して警戒を続けるよう求める表現として自然に訳した。
- source_word: λίαν
  choice: 激しく
  rationale: 反対の強さを示す副詞であり、日本語では「逆らった」と自然に結び付く。
- source_word: ἀντέστη
  choice: 逆らった
  rationale: ἀνθίστημιのアオリストで、「立ち向かう、抵抗する、反対する」の意。「言葉に逆らう」は原文の与格との関係を自然かつ明瞭に表す。
- source_word: τοῖς ἡμετέροις λόγοις
  choice: 私たちの言葉
  rationale: λόγοιの語義を狭く「教え」や「宣教」と限定せず、パウロたちが語った言葉を指すという原文の幅を保つ。
theological_decisions:
- issue: 「私たちの言葉」の範囲
  choice: パウロとその同労者たちが語った言葉を指すが、法廷での証言、宣教、教えのいずれかに限定しない。
  alternative: 「私たちの知らせ」「私たちの教え」、または法廷での証言と明示する。
  rationale: 本文だけでは発言の場面や内容が特定されないため、解釈を一つに固定せず「言葉」と訳した。
translation_notes:
  register: 明瞭で現代的な標準日本語。命令の強さを保ちつつ、過度に古風または威圧的な表現を避けた。
