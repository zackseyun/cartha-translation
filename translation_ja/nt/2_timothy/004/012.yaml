- source_word: εἰς
  choice: へ
  rationale: 都市を目的地とする方向を自然な現代日本語で示した。
- source_word: Ἔφεσον
  choice: エフェソ
  rationale: 目的地を表す地名。日本語聖書で定着した慣用的な音写を採用した。
