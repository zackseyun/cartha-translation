reference: 2 Timothy 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: ja
  text: というのも、人々が健全な教えに耐えようとせず、自分たちの欲望に従って、自分たちのために教師を次々と集め、聞きたくて耳がむずむずする時が来るからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「聞くことに関してむずむずしながら」。自分の聞きたいことを聞かせてくれる教師を求める様子を表す比喩です。
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: 時
  rationale: ここでは、やがて到来する特定の時期を指す。日本語では「時が来る」が自然で、予告の力を保つ。
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: 健全な教え
  rationale: 「健康である」を意味する語の比喩的用法を「健全な」で保ち、διδασκαλίαを一般読者に分かりやすい「教え」とした。
- source_word: οὐκ ἀνέξονται
  choice: 耐えようとせず
  rationale: 単に耐えられないという能力の欠如ではなく、受け入れて持ちこたえることを拒む文脈上の含みを自然に表す。
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: 自分自身の欲望に従って
  rationale: ἐπιθυμίαιはここで性的な意味に限定されず、自分本位の強い望み全般を表す。「欲望」は否定的な文脈を保つ。
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: 自分のために教師たちを次々と集め
  rationale: 再帰代名詞の利己的方向性を「自分のために」で示し、ἐπισωρεύωの大量に積み上げる像を、日本語として自然な「次々と集め」で表した。
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: 耳をかいてもらいたがる
  rationale: 直訳的な「耳がかゆい」だけでは意味が不透明になりやすいため、聞きたいことによって聴覚を刺激してもらおうとする比喩を自然な日本語で示した。分詞の関係を明示的な原因に限定しないよう、並列的に訳した。
theological_decisions:
- issue: διδασκαλίαの訳語
  choice: 教え
  alternative: 教理
  rationale: 文脈上は正しい信仰内容を含むが、語そのものを過度に専門化せず、指導内容全体を表す「教え」とした。
- issue: κνηθόμενοι τὴν ἀκοήνの比喩と統語関係
  choice: 耳をかいてもらいたがる
  alternative: 耳がかゆくて／耳をくすぐってもらうために
  rationale: 聞きたいことを聞かせてくれる教師を求める像を保持しつつ、ギリシア語分詞が表し得る付帯状況・動機の幅を、明確な原因節に固定しないようにした。
translation_notes:
  register: 現代標準日本語の丁寧体。荘重さを保ちつつ、専門的な教会用語を避けた。「というのも」と文末の「からです」で、前節への理由を示すγάρを明確に表した。
