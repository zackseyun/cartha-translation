id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: ja
  text: 私は、神と、生きている者と死んだ者を裁こうとしておられる[a]メシア・イエスの前で、また、その方の現れとその王国にかけて[b]、あなたに厳かに命じます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裁こうとしておられる」は、「やがて裁かれる方」とも訳せる。
    reason: μέλλωは切迫した未来と一般的な将来のいずれをも表し得るため。
  - marker: b
    text: 直訳に近くは、「そして、その方の現れとその王国」。ギリシア語では、この句が厳命とどう結び付くかは明示されていない。
    reason: 対格句を誓約の対象として補って読むか、より含みを残した並列として読むかに統語上の余地があるため。
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: あなたに厳かに命じます
  rationale: 使徒が後続の命令を託す文脈であり、単なる証言ではなく、権威をもって厳粛に言い渡す意味を表す。「あなたに」はギリシア語では文脈上含意される目的語を、日本語で自然に補った。
- source_word: ἐνώπιον
  choice: 前で
  rationale: 神とキリスト・イエスが立ち会い、見ておられる中での厳粛な委託であることを、簡潔で自然な日本語で表す。
- source_word: Χριστοῦ Ἰησοῦ
  choice: キリスト・イエス
  rationale: Χριστόςの称号性を保ちつつ、日本語で定着した聖書用語「キリスト」を用い、原語の語順も保った。
- source_word: τοῦ μέλλοντος κρίνειν
  choice: 裁こうとしておられる
  rationale: μέλλω＋不定詞が示す将来性と切迫感を単純な未来に平板化せず、同時に具体的な時期を定めない表現とした。
- source_word: ζῶντας καὶ νεκρούς
  choice: 生きている者と死んだ者
  rationale: 二つの実詞的表現を自然に訳し、裁きがすべての人に及ぶことを原文どおり示す。
- source_word: ἐπιφάνειαν
  choice: 現れ
  rationale: 終末における目に見える顕現を指す語として、過度な解釈を加えず簡潔に表した。
- source_word: βασιλείαν
  choice: 御国
  rationale: 神的な王権とその領域を指す日本語聖書で定着した尊敬表現を用いた。「支配」と限定せず、原語の幅を保つ。
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: また、その方の現れとその御国にかけて
  rationale: 対格句を、厳粛な誓命を強める対象として理解した。日本語でその統語関係を明示しつつ、より形式的な並列理解は脚注に残した。
theological_decisions:
- issue: Χριστόςの称号性
  choice: キリスト・イエス
  alternative: メシアであるイエス
  rationale: 「キリスト」は日本語で定着し、称号としても理解可能である。説明的に「メシアである」と展開せず、原文の簡潔さと語順を保った。
- issue: μέλλωが裁きの時について持つ力
  choice: 裁こうとしておられる
  alternative: やがて裁かれる／裁かれることになる
  rationale: 将来の裁きを明言しながら切迫感も残し、時期を特定しない。単純未来と近接未来の間にある原語の緊張を保持した。
- issue: 「現れ」と「御国」を導くκαίと対格句の統語関係
  choice: 現れと御国にかけて
  alternative: 現れと御国とを前にして／そして、その現れとその御国
  rationale: 厳命の誓約的根拠を表す解釈が文脈上自然だが、ギリシア語では関係が明示されず、単純な並列として読む余地があるため脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒的な委託にふさわしい厳粛さを保った。「厳かに命じます」「御国」は格調を持つが、一般読者にも理解できる表現である。文末の読点は次節の命令へ続く構造を意識している。
