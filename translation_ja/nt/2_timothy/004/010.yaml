id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: ja
  text: 'というのも、デマスは今の時代[a]を愛して私を見捨て、テサロニケへ行ったからです。クレスケンスはガラテヤへ、テトスはダルマティアへ行きました。


    [a] 別訳「今の世」。ギリシア語は、より直訳的には現在の時代、時代区分を指す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今の世」。ギリシア語は、より直訳的には現在の時代、時代区分を指す。
    reason: αἰώνの時間的意味を示しつつ、日本語で可能な伝統的別訳も提示するため。
lexical_decisions:
- source_word: γάρ
  choice: というのも
  rationale: 直前の依頼に理由や説明を加える接続の働きを、現代日本語で自然に示す。
- source_word: ἐγκατέλιπεν
  choice: 私を見捨て
  rationale: 単にその場を去ったという以上の、重大で非難を伴う置き去りを表す。一方、信仰そのものを棄てたとまでは訳文に加えない。
- source_word: ἀγαπήσας
  choice: 愛して
  rationale: 分詞を連用的に訳し、デマスが今の時代を愛したことと、パウロを見捨てたこととの密接な結びつきを保つ。明示的な理由表現に限定せず、原文にある関係の含みを残す。
- source_word: τὸν νῦν αἰῶνα
  choice: 今の時代
  rationale: αἰώνの時間的・倫理的な含意を保ち、物理的な世界や宇宙を意味するとの誤解を避ける。「今の世」も可能なため脚注に示す。
- source_word: ἐπορεύθη
  choice: 行った
  rationale: 移動を表す単純な動詞として、移動の様態や動機を過度に補わず自然な日本語にする。
- source_word: Θεσσαλονίκην
  choice: テサロニケ
  rationale: 日本語聖書で一般的な地名表記。
- source_word: Κρήσκης
  choice: クレスケンス
  rationale: ギリシア語の人名に基づく明瞭な音写。
- source_word: Γαλατίαν
  choice: ガラテヤ
  rationale: 日本語聖書で一般的な地域名表記。
- source_word: Τίτος
  choice: テトス
  rationale: ギリシア語の人名に基づく一般的な音写。
- source_word: Δαλματίαν
  choice: ダルマティア
  rationale: 日本語で通用する地域名表記。
theological_decisions:
- issue: デマスの離反を、信仰からの背教と明示するか、パウロを去った行為として訳すか
  choice: 「私を見捨て」とし、行為の非難すべき重さを保ちながら、最終的な背教とは明示しない。
  alternative: 「私のもとを去り」と弱く訳す、または信仰を棄てたと解釈して訳す。
  rationale: 本文はデマスが今の時代を愛してパウロを見捨てたと述べるが、彼が最終的に信仰を棄てたとは直接述べていないため。
- issue: ἀγαπήσαςを明確な原因として訳すか
  choice: 「愛して」と訳し、後続行為との密接な関係を示しつつ、文法上の関係を原因だけに限定しない。
  alternative: 「愛したため」「愛したので」と明示的な原因として訳す。
  rationale: 文脈上は原因の意味が強いが、分詞そのものの簡潔さと解釈上の余地を保つため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、説明接続の「というのも」と丁寧体で自然につないだ。原文で後半二句に省略されている移動動詞は、日本語の理解しやすさのため「行きました」と補った。人名・地名は日本語聖書で通用する表記を採用した。
