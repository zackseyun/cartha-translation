  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: ja
  text: あなたが来るとき、私がトロアスのカルポのところに置いてきた外套[a]を持って来てください。また、書物[b]も、特に羊皮紙を持って来てください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外套」を、書物を入れるケースや包みと理解する説もありますが、ギリシア語の通常の意味は外衣です。
    reason: lexical_alternative
  - marker: b
    text: 別訳「巻物」。このギリシア語は、巻物などの書かれた資料を指すことがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: 外套
  rationale: 通常は旅行時などに着る外衣を指すため、「外套」とした。「書物入れ」とする説もあるが、語の一般的な意味は衣服である。
- source_word: ἀπέλιπον
  choice: 置いてきた
  rationale: 単なる「残した」よりも、話者がその場所を離れ、品物をそこに残してきたという文脈を自然な日本語で表す。
- source_word: παρὰ Κάρπῳ
  choice: カルポのところに
  rationale: παρά＋与格が示す、カルポのもと、またはその家や管理下にあるという位置関係を、過度に「預けた」と限定せずに表した。
- source_word: ἐρχόμενος
  choice: あなたが来るとき
  rationale: 命令動詞に伴う副詞的分詞の時間的意味を、自然で明確な節として訳した。
- source_word: φέρε
  choice: 持って来てください
  rationale: 話者のもとへ品物を運ぶよう求める命令を、現代日本語で自然な依頼表現にした。
- source_word: τὰ βιβλία
  choice: 書物
  rationale: 書かれた資料を広く指せる語を選び、巻物だった可能性は脚注に残した。
- source_word: μάλιστα
  choice: 特に
  rationale: 続く羊皮紙をほかの書物より際立たせる強調を簡潔に表した。
- source_word: τὰς μεμβράνας
  choice: 羊皮紙のもの
  rationale: 獣皮製の筆記資料を指す。「羊皮紙」だけでは未使用の素材とも受け取れるため、「もの」を添えて文書類である可能性を自然に示しつつ、形態を巻物や冊子に限定しなかった。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。命令形は文脈上の依頼として「持って来てください」とし、品位を保ちながら過度に威圧的にならない表現にした。英語相談層では脚注記号と内容の対応にずれが見られたため、日本語本文では語の出現順に従い、外套を[a]、書物を[b]として対応を明確にした。
