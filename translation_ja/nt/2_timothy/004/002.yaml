source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: ja
  text: みことばを宣べ伝えなさい。時機が良くても悪くても、備えていなさい[a]。誤りを指摘し、戒め、勧めなさい[b]。忍耐を尽くし、教えつつ、これらを行いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「迫りなさい」「いつでもその場に立ちなさい」とも訳せる。このギリシア語には、備えること、その場に立つこと、切迫感をもって事に当たることの含みがある。
    reason: lexical_alternative
  - marker: b
    text: 「励ましなさい」または「強く促しなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: 宣べ伝えなさい
  rationale: 公に告げ知らせることを表す命令形。現代日本語として理解しやすく、宣教命令にふさわしい重みも保つ。
- source_word: τὸν λόγον
  choice: みことば
  rationale: ここではテモテが告げ知らせるべき使徒的なことば・メッセージを指す。「福音」や「聖書」と限定せず、原文の広がりを保つ。
- source_word: ἐπίστηθι
  choice: 備えていなさい
  rationale: その場に立つ、いつでも行動できるよう構える、事に当たる、という語感を文脈に即して表す。切迫して迫るという解釈の余地は脚注に残す。
- source_word: εὐκαίρως ἀκαίρως
  choice: 時機が良くても悪くても
  rationale: 好都合な時にも不都合な時にも、機会が適切に見えるか否かにかかわらず、という対句を自然な日本語で再現する。
- source_word: ἔλεγξον
  choice: 誤りを指摘し
  rationale: 過ちを明るみに出して正す働きを表す。単なる非難ではなく、是正へ向けた指摘という力を保つ。
- source_word: ἐπιτίμησον
  choice: 戒め
  rationale: 厳しくたしなめる、叱責するという、直前の動詞より強い是正の調子を簡潔に表す。
- source_word: παρακάλεσον
  choice: 勧めなさい
  rationale: 強く促すことと励ますことの両面を持つ語。「勧める」を本文に置き、「励ます」という可能性を脚注に示す。
- source_word: ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ
  choice: どこまでも忍耐強く教えながら
  rationale: 人に対する十分な忍耐と、教えによって務めを行うことを、自然な日本語の様態表現としてまとめる。
theological_decisions:
- issue: 「ことば」の指示範囲
  choice: 「みことば」とし、「福音」または「聖書」と明示的に限定しない。
  alternative: 「メッセージ」「福音」「聖書のことば」
  rationale: 文脈上は聖書に根ざす使徒的宣教が念頭にあるが、λόγος そのものはこの節で一方に限定されていないため、その幅を保つ。
- issue: παρακάλεσον の促しと慰めの幅
  choice: 本文では「勧めなさい」とする。
  alternative: 「励ましなさい」「強く促しなさい」
  rationale: 叱責に続く命令として真剣な促しが中心だが、励ましの含みも排除しない訳語を選び、代案を脚注に残す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、連続する命令の簡潔さと厳粛さを保った。「宣べ伝える」「戒める」は聖書文体として定着しているが、一般読者にも理解可能な表現である。
