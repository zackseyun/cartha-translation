  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: ja
  text: というのも、私はすでに注ぎの供え物として注ぎ出されており[a]、私の旅立ちの時が来ている[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「私はすでに注ぎ出されている」。この動詞は、祭儀で注ぎの供え物を注ぐイメージを伴う。
    reason: lexical_alternative
  - marker: b
    text: 「旅立ち」に当たる語には、「出発」「解放（解き放ち）」などの意味もある。ここでは死を婉曲に表している。
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: 注ぎの供え物として注ぎ出されており
  rationale: 祭儀でぶどう酒などを注ぐイメージを明示しつつ、受動態と進行中のニュアンスを保つ。単に「犠牲にされる」とせず、原文の比喩を残した。
- source_word: ἤδη
  choice: すでに
  rationale: その出来事が目前にあるだけでなく、すでに始まっているという話者の認識を自然に表す。
- source_word: καιρός
  choice: 時
  rationale: 決定的な時機を指すが、「定められた」を本文に補わず、簡潔な日本語で文脈に委ねる。
- source_word: ἀναλύσεώς
  choice: 世を去る
  rationale: 解くこと、解放、出発という語義を背景に、ここで死を婉曲に指す表現として自然な日本語を選んだ。死と直接言い換えず、原文の婉曲性を保つ。
- source_word: ἐφέστηκεν
  choice: 来ている
  rationale: 完了形が示す、到来して今そこにある状態を表す。「近づいた」だけに弱めず、現在性を保つ。
- source_word: γὰρ
  choice: （前後関係によって「というのも」）
  rationale: 原文では前節への説明を導く接続詞である。単独節として過度に不自然にならないよう本文では明示しないが、連続本文では「というのも」を置く余地がある。
theological_decisions:
- issue: パウロの死を表す二重の比喩
  choice: 迫る死を「注ぎの供え物」と「世を去る時」という比喩・婉曲表現で示す。
  alternative: 「私は間もなく死ぬ」と直接的に訳す。
  rationale: σπένδομαι と ἀνάλυσις の組み合わせは死を強く示唆するが、原文はそれを直接述べず、祭儀的比喩と出立・解放を想起させる語で表すため、その緊張を保持した。
- issue: σπένδομαι の時間的様相
  choice: 「すでに…注ぎ出されており」として、出来事が進行中である含みを保つ。
  alternative: 「今にも供え物にされようとしている」と未来的に訳す。
  rationale: 現在受動形と ἤδη を尊重し、単なる将来の予告に限定しない。
translation_notes:
  register: 明瞭で現代的ながら、遺言的な厳粛さを保つ文体。「注ぎの供え物」は多少説明的だが、祭儀的比喩を一般読者に伝えるために必要と判断した。節単独では γάρ を省いたが、前節と続けて掲載する場合は冒頭を「というのも、私は」にするのが望ましい。
