  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: ja
  text: ルカだけが私と一緒にいます。マルコを連れて来てください。彼は奉仕[a]のために私の役に立つからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「働き」または「務め」とも訳せる。ギリシア語は広く人に仕える働きを指し得るが、ここでは宣教の働きが念頭にある可能性がある。
    reason: διακονία の意味の幅と文脈上の可能性を示すため。
lexical_decisions:
- source_word: Λουκᾶς
  choice: ルカ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: μόνος
  choice: だけ
  rationale: ルカが現在パウロと共にいる唯一の者であるという限定を、自然な現代日本語で表した。
- source_word: μετ’ ἐμοῦ
  choice: 私と一緒にいます
  rationale: 属格を伴う μετά の同伴の意味を明確かつ自然に表した。
- source_word: Μᾶρκον
  choice: マルコ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ἀναλαβὼν ἄγε μετὰ σεαυτοῦ
  choice: マルコを連れて、あなたと一緒に来てください
  rationale: マルコを伴い、そのままテモテと共に来させるという分詞と命令形の流れを、過度に逐語的にならない自然な日本語で表した。
- source_word: γάρ
  choice: からです
  rationale: 先の依頼の理由を示す説明的な接続関係を保持した。
- source_word: μοι εὔχρηστος
  choice: 私の役に立つ
  rationale: μοι の個人的な関係と εὔχρηστος の有用性を、冷淡になりすぎない一般的な日本語で表した。
- source_word: εἰς διακονίαν
  choice: 奉仕のために
  rationale: διακονία の広い『仕える働き』という意味を保ち、特定の教会職や制度に限定しない表現とした。
theological_decisions:
- issue: διακονία が一般的な奉仕を指すか、宣教・教会の働きを指すか
  choice: 奉仕
  alternative: 宣教の働き／務め
  rationale: 文脈上は使徒的な働きが想定されうるが、原語自体はより広い奉仕を表し得るため、本文では意味を狭めず、注で可能な文脈的含意を示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、書簡としての落ち着いた調子を保った。「あなたと一緒に」は原文の μετὰ σεαυτοῦ を明示するため残した。
