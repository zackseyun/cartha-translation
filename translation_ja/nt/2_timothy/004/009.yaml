  text: Σπούδασον ἐλθεῖν πρός με ταχέως·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: ja
  text: できるだけ早く私のところに来るよう努めてください[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「急いで私のところに来るよう努めてください」または「私のところに早く来るために力を尽くしてください」。
    reason: Σπούδασονは熱心に努力することを、ταχέωςは早さ・緊急性を表すため。
lexical_decisions:
- source_word: Σπούδασον
  choice: 力を尽くしてください
  rationale: σπουδάζωのアオリスト能動命令形。単に速度を上げることではなく、熱意をもって真剣に努力することを表すため、「力を尽くしてください」とした。ταχέωςが示す緊急性とは区別して訳した。
- source_word: ἐλθεῖν
  choice: 来るよう
  rationale: ἔρχομαιのアオリスト不定詞で、Σπούδασονに従属する。πρός με（私のところに）を伴うので、日本語では話者を基準とする「来る」が自然である。
- source_word: πρός με
  choice: 私のところに
  rationale: πρόςと対格の代名詞μεは、話者のもとへの移動を示す。「私に」よりも、移動先を自然かつ明確に表す「私のところに」とした。
- source_word: ταχέως
  choice: 一刻も早く
  rationale: 「速やかに」「すぐに」「早く」を意味する副詞。この文脈ではパウロのもとへ早期に来るよう求める切迫感を自然に伝え、Σπούδασονの努力の意味とも重複しない「一刻も早く」とした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、個人的な懇願の切迫感と丁寧さを保つ表現とした。Σπούδασονとταχέωςを一語の「急いで」にまとめず、努力と緊急性の二要素を訳し分けた。
