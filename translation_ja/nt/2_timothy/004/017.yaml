id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: ja
  text: しかし、主は私のそばに立ち、私に力を与えてくださいました。それは、私を通して宣教が余すところなく果たされ、すべての異邦人[a]がそれを聞くためでした。そして私は、獅子の口から救い出されました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての国々」とも訳せる。ギリシア語の ἔθνη は「異邦人」と「国々」のどちらも意味し得るが、ここでは福音を聞く非ユダヤの諸民族を指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 「獅子の口から」は、死に至りかねない危険から救われたことを表す比喩である可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: しかし、主は
  rationale: δέによる前節との対照を「しかし」で示し、κύριοςは指示対象を本文で限定せず、尊称として「主」とした。
- source_word: μοι παρέστη
  choice: 私のそばに立ち
  rationale: 単なる位置ではなく、支え助けるために寄り添って立つという意味を、原文の像を保ちながら自然な日本語で表した。
- source_word: ἐνεδυνάμωσέν με
  choice: 私に力を与えてくださいました
  rationale: 「強くした」より自然で、力を授けて任務を全うさせる意味を明確にする。主への敬意を通常の日本語の敬語で表した。
- source_word: ἵνα
  choice: それは……ためでした
  rationale: 後続する二つの接続法が表す目的を明示した。
- source_word: δι’ ἐμοῦ
  choice: 私を通して
  rationale: διά＋属格の媒介・手段の意味を簡潔に保った。
- source_word: τὸ κήρυγμα
  choice: 宣教
  rationale: 公に告げ知らせる行為とその知らせの双方を含み得る語として選んだ。「福音」を補わず、原文の表現範囲を保った。
- source_word: πληροφορηθῇ
  choice: 余すところなく果たされ
  rationale: 完全に遂行される、十分に成し遂げられるという受動形の広がりを保ち、単に「十分に宣べ伝えられる」と狭く限定しなかった。
- source_word: ἀκούσωσιν
  choice: それを聞く
  rationale: 目的を表す接続法の意味を文全体の「ため」に担わせ、「それを」で宣教内容とのつながりを自然に示した。
- source_word: πάντα τὰ ἔθνη
  choice: すべての異邦人
  rationale: パウロの宣教文脈では非ユダヤの人々を指す可能性が高いため「異邦人」としたが、「すべての国々」という語義も脚注に残した。
- source_word: ἐρρύσθην
  choice: 私は……救い出されました
  rationale: 重大な危険から実際に助け出されたことを表す受動の意味を明瞭にした。
- source_word: ἐκ στόματος λέοντος
  choice: 獅子の口から
  rationale: 比喩、歴史的暗示、文字どおりの危険のいずれかに限定せず、原文の鮮明な像をそのまま保った。
theological_decisions:
- issue: 「主」（κύριος）の指示対象
  choice: 本文では単に「主」とする
  alternative: 特に復活したイエス、またはより一般的に神を指すと明示する
  rationale: 文脈からイエスを指すと理解できる可能性は高いが、原文自体はここで名を明示していないため、翻訳でも特定しなかった。
- issue: 「獅子の口から」の意味
  choice: 原文の比喩的な表現をそのまま保つ
  alternative: ネロ、サタン、猛獣刑、または一般的な死の危険を指すと解釈して本文に入れる
  rationale: 複数の解釈が可能であり、本文だけでは決定できない。特定の歴史的・神学的解釈に狭めず、緊張を保った。
- issue: πληροφορηθῇが示す宣教の完成
  choice: 「宣教が余すところなく果たされ」とする
  alternative: 「宣教が十分に宣べ伝えられ」または「宣教が成就し」
  rationale: 宣べ伝える行為の完遂と使命の達成の両方を含み得るため、一方だけに限定しない表現を選んだ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「獅子」は日常語の「ライオン」より原文の修辞的な響きに適する。「くださいました」は主の行為への自然な敬意を示すが、過度に古風な語法は避けた。
