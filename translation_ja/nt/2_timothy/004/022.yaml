id: 2TI.4.22
reference: 2 Timothy 4:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: ja
  text: 主があなたの霊とともにいてくださいますように。[a] 恵みがあなたがたとともにありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、前半の「あなたの霊」は単数形、後半の「あなたがた」は複数形である。
    reason: 原文における単数から複数への移行を明示するため。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 定冠詞を伴う明確な称号として、パウロ書簡の結びの祝福に自然な「主」とした。イエスを指すと考えられるが、原文にない名は補わない。
- source_word: μετὰ
  choice: とともにいてくださいますように
  rationale: 原文には動詞が明示されていないが、祝福を願う文として自然な日本語にするため、含意された祈願の意味を補った。
- source_word: πνεύματός
  choice: 霊
  rationale: 単数の所有表現「あなたの」を伴うため、ここではテモテの人間の霊を指すものとして、小文字・大文字の区別を持ち込まず「霊」とした。
- source_word: σου
  choice: あなたの
  rationale: 第一文がテモテ個人に向けられていることを示す単数形を明確に保った。
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の結びに用いられる神学的な祝福語として、現代日本語の聖書表現で定着し、意味も明瞭な「恵み」とした。
- source_word: ὑμῶν
  choice: あなたがた
  rationale: 第二文の複数形を明示し、第一文の単数から複数への移行を保った。「皆」は原文に独立して存在しないため加えなかった。
theological_decisions:
- issue: 「主」の指示対象
  choice: パウロ書簡の結びの祝福における主イエスへの言及と理解しつつ、「主」と訳す
  alternative: 神一般への言及と理解する
  rationale: 文脈上はイエスを指す可能性が高いが、原文は名を明記していないため、訳文でも「イエス」を補わず称号のままにした。
- issue: 二つの文における数の移行
  choice: 第一文はテモテ個人、第二文は複数の受け手への祝福として訳し分ける
  alternative: 両方とも慣用的にテモテ一人への言葉として訳す
  rationale: 原文は単数の σου と複数の ὑμῶν を明確に使い分けており、その文学的・神学的含意を日本語でも保持した。
- issue: πνεῦμαの解釈
  choice: テモテの人間の霊
  alternative: 聖霊
  rationale: 「あなたの」という単数所有表現と祝福文の構造から、人間の内なる霊を指す読みが自然である。ただし、主がその霊とともにいるという表現に聖霊の働きが含意される可能性までは否定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。省略された祈願の動詞を「いてくださいますように／ありますように」と補い、祝祷として自然にした。単数「あなた」と複数「あなたがた」の対比を保持した。
