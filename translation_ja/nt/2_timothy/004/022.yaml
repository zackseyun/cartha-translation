  naturalness: 明瞭で自然な現代標準日本語であり、書簡の結びとしてふさわしい格調も保たれている。「主があなたの霊とともにいてくださいますように」「恵みがあなたがたとともにありますように」はともに祝祷として無理のない表現である。
