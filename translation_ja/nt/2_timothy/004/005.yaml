source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: ja
  text: しかし、あなたは、すべてのことにおいて冷静さを保ちなさい[a]。苦難に耐えなさい[b]。福音を伝える者として働きなさい[c]。自分の務めを全うしなさい[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべてのことにおいて、しっかりしていなさい」「すべてのことにおいて、冷静でいなさい」。ギリシア語の動詞は字義的には「酒に酔わずにいる」を意味しますが、新約聖書では精神の明晰さ、自制、落ち着きを表す比喩として用いられています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「苦難を受けなさい」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「伝道者の働きをしなさい」「福音宣教者として働きなさい」。ここでの語は、福音を告げ知らせる人を意味します。
    reason: lexical_alternative
  - marker: d
    text: 別訳「自分の奉仕を十分に果たしなさい」。ギリシア語の動詞には、十分に遂行する、完遂するという意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: しかし、あなたは
  rationale: δέの示す直前との対比と、明示された代名詞σύによる「あなた」への強調を、自然な現代日本語で表した。
- source_word: νῆφε ἐν πᾶσιν
  choice: どんなことにも冷静さを保ちなさい
  rationale: νήφωは字義的には酒に酔っていないことを表すが、新約聖書では比喩的に、精神の明晰さ、自制、圧力の中での落ち着きを指す。ἐν πᾶσινの包括性を「どんなことにも」で保った。
- source_word: κακοπάθησον
  choice: 苦難に耐えなさい
  rationale: 苦しみを受けることだけでなく、その中で持ちこたえるよう求める命令の力を自然に示した。
- source_word: ἔργον ποίησον εὐαγγελιστοῦ
  choice: 福音を伝える者として働きなさい
  rationale: εὐαγγελιστήςの基本義を分かりやすく示し、ἔργον ποιεῖνを日本語として自然な「働きなさい」とした。特定の制度的職位に限定しない表現である。
- source_word: τὴν διακονίαν σου πληροφόρησον
  choice: 自分の務めを全うしなさい
  rationale: διακονίαを文脈上の奉仕の責任として「務め」とし、πληροφορέωが表す十分な遂行・完遂を「全うする」で簡潔に表した。
theological_decisions:
- issue: εὐαγγελιστήςが制度的な役職名を指すか、福音を告げる働きをする人を指すか
  choice: 福音を伝える者として
  alternative: 伝道者として／福音宣教者の働きをしなさい
  rationale: 語は福音を告げ知らせる人を指すが、この一節だけでは後代の特定の職制を規定しているとは断定できないため、機能を明示しつつ役職への限定を避けた。
- issue: διακονίαの範囲
  choice: 自分の務め
  alternative: 自分の奉仕／自分の宣教の務め
  rationale: 直近の文脈ではテモテの福音宣教を含む奉仕が念頭にあるが、語自体を宣教だけに狭めず、託された奉仕全体を表せる「務め」とした。
translation_notes:
  register: 命令が四つ続く原文の簡潔で切迫した調子を、短い独立文で再現した。全体は現代の一般読者に明瞭な語彙を用いつつ、終末的な訓戒にふさわしい端正さを保った。「全うする」はやや格調があるが、現代日本語でも理解しやすく、完遂の意味を簡潔に伝える。
