id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: ja
  text: 冬になる前に、ぜひ来るように努めてください。エウブロ、プデス、リノ、クラウディア、そしてすべての兄弟たち[a]が、あなたによろしくと言っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兄弟姉妹たち一同」。ギリシア語は「兄弟たち」だが、ここではより広く信徒の一同を指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: ぜひ～よう努めてください
  rationale: アオリスト命令形が表す切迫した熱意と努力を、現代日本語として自然かつ明確に伝える。単なる努力だけでなく、来訪を強く促す語調も「ぜひ」で補う。
- source_word: πρὸ χειμῶνος
  choice: 冬になる前に
  rationale: 属格を伴う πρό の時間的意味を明確に表す。「冬の前に」より自然な日本語とした。
- source_word: ἐλθεῖν
  choice: 来る
  rationale: Σπούδασονを補う不定詞で、テモテが語り手パウロのもとへ来ることを指すため、「来る」が視点を正確に保つ。
- source_word: Ἀσπάζεταί σε
  choice: あなたによろしくと言っています
  rationale: 書簡末尾の挨拶として、ἀσπάζομαι の対人的な意味を自然な現代日本語で表す。単数動詞だが、後続する複数の人物・集団をまとめて主語として訳した。
- source_word: Εὔβουλος
  choice: エウブロ
  rationale: ギリシア語固有名を日本語で一般的な聖書音写に従って表記した。
- source_word: Πούδης
  choice: プデス
  rationale: ギリシア語の形に基づき、日本語で定着した音写を採用した。
- source_word: Λίνος
  choice: リノ
  rationale: ギリシア語固有名を日本語で一般的な聖書音写に従って表記した。
- source_word: Κλαυδία
  choice: クラウディア
  rationale: ギリシア語固有名を原語の音に近い自然な日本語で音写した。
- source_word: οἱ ἀδελφοὶ πάντες
  choice: すべての兄弟たち
  rationale: 原文の男性複数形を本文で保持する。一方、初期キリスト教の用法では男女を含む信徒共同体を指し得るため、その可能性を脚注に示す。
theological_decisions:
- issue: 混成の信徒集団を指す可能性があるἀδελφοίの訳
  choice: すべての兄弟たち
  alternative: 兄弟姉妹たち一同／信徒たち一同
  rationale: 原文の文法上の男性複数を本文で明示しつつ、実際の指示対象がより広い信徒共同体である可能性を排除しないよう脚注に代案を残した。
translation_notes:
  register: 明快で現代的ながら、書簡末尾にふさわしい丁寧で落ち着いた文体とした。「ぜひ来るよう努めてください」で命令の切迫感を保ち、「よろしくと言っています」で日本語の書簡的挨拶として自然にした。
