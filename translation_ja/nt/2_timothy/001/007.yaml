source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: ja
  text: 神が私たちに与えてくださったのは、臆病の霊ではなく、力と愛と自制の霊だからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自制」は、「健全な判断」または「自己鍛錬」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 〜ではなく、〜だからです
  rationale: γάρが前節の勧めの根拠を示すことを、文末の「からです」で自然に表した。οὐは後続のἀλλάとの「ではなく」で明確に否定した。
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: 神が私たちに与えてくださった
  rationale: アオリストを自然な過去として訳した。神の行為を述べる日本語として敬意を示す補助動詞「くださった」を用いたが、意味内容は加えていない。
- source_word: πνεῦμα
  choice: 霊
  rationale: 語義上は霊、または人を動かす気質・心のあり方を指し得る。本文では「霊」として原語の曖昧さを保ち、聖霊という固有の指示にも単なる心理的気質にも限定しなかった。
- source_word: δειλίας
  choice: 臆病
  rationale: 一般的な恐れではなく、ひるんで退く否定的な気質を表すため、「恐れ」より限定的で現代日本語として自然な「臆病」を選んだ。
- source_word: δυνάμεως
  choice: 力
  rationale: δύναμιςの直接的で簡潔な訳であり、三つの属格の並列を保てる。
- source_word: ἀγάπης
  choice: 愛
  rationale: ἀγάπηの標準的かつ明瞭な現代日本語訳。
- source_word: σωφρονισμοῦ
  choice: 慎み
  rationale: 自己抑制と健全な判断の両面を含み得る稀な語である。「慎み」は簡潔に並列を保つ一方、意味範囲を注で補った。
theological_decisions:
- issue: πνεῦμαの指示対象
  choice: 「霊」と訳し、指示対象を限定しない
  alternative: 「聖霊」または「心／気質」
  rationale: 無冠詞のπνεῦμαに性質を示す属格が続く構文は、神が与える霊の性質または心のあり方を表し得る。「聖霊」や単なる心理的「心」と断定せず、原文の神学的な含みを保った。
- issue: 三つの属格とπνεῦμαの関係
  choice: 後半にも「霊」を補い、「力と愛と慎みの霊」とした
  alternative: 「力と愛と慎み」だけを並べる
  rationale: ギリシア語ではπνεῦμαが前半から省略されて後半の属格群にもかかる。日本語では「霊」を補うことで対照構造を明瞭にしつつ、新たな解釈を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「臆病の霊ではなく、力と愛と慎みの霊」という対照と三項のリズムを維持した。注記記号は該当節末に置いた。
