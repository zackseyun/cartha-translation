  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: ja
  text: この福音のために、私は宣教者、使徒、教師として任命されました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「宣教者」は「伝令」または「説教者」とも訳せる。ギリシア語は、任命を受けて公に告げ知らせる者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: この福音のために
  rationale: 関係代名詞の先行内容を直前の福音に求め、目的・関係を自然な日本語で明示した。単なる「このために」より参照先が分かりやすい。
- source_word: ἐτέθην
  choice: 任命されました
  rationale: τίθημι の受動形が、後続する三つの役割への任命・委任を表すため。物理的な「置かれた」ではなく、務めを託された意味を伝える。
- source_word: ἐγώ
  choice: 私は
  rationale: 明示された代名詞を訳出する。日本語で「私自身は」とすると強調が過度になり得るため、自然な「私は」とした。
- source_word: κῆρυξ
  choice: 宣教者
  rationale: 公に告げ知らせるよう任じられた者を指す。「伝令」は公的性格をよく保つが現代日本語では軍事的・古風に響きやすく、「説教者」は教会内の説教に狭まり得るため、福音を公に宣べ伝える役割として「宣教者」を選んだ。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: パウロの自己言及における定着した職務的称号を保持した。
- source_word: διδάσκαλος
  choice: 教師
  rationale: 教える者という通常の意味を、簡潔で現代的な語で表した。
theological_decisions:
- issue: κῆρυξを伝統的な「説教者」とするか、公的な告知者という意味を前面に出すか
  choice: 宣教者
  alternative: 説教者／伝令
  rationale: この語は任命を受けて公に告げる者を表す。「宣教者」は福音宣言の務めを自然に伝え、「説教者」が帯び得る後代の教会職的限定を避ける。ただし公的な告知者という原語の含みは脚注で補う。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。直前の文脈への参照を「この福音」で明示し、三つの務めを簡潔に並列した。
