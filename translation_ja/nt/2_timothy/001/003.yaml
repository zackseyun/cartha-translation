  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: ja
  text: 私は、夜も昼も祈りの中で絶えずあなたのことを覚え、先祖以来、清い良心をもって仕えている神に感謝しています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: 神に感謝しています
  rationale: 「恵み・感謝を持つ」というギリシア語の慣用表現を、現代日本語で自然な感謝の表明として訳した。
- source_word: ᾧ λατρεύω
  choice: 仕えている
  rationale: λατρεύω は神への礼拝を含む宗教的奉仕を表す。「仕える」は、礼拝だけに意味を限定せず、継続的な献身も伝える。
- source_word: ἀπὸ προγόνων
  choice: 先祖以来
  rationale: 直訳に近い簡潔な表現を採り、先祖からの信仰との連続性を示しつつ、「先祖と同じように」または「先祖から受け継いで」という解釈の余地を残した。
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: きよい良心をもって
  rationale: 行為のあり方を示す句として自然であり、道徳的・宗教的な潔白さを表す。漢字の「清い」より、聖書文体として読みやすい「きよい」を用いた。
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: 絶えずあなたを思い起こし
  rationale: 名詞中心の原文表現を自然な動詞表現に改めながら、継続的にテモテを覚えている意味を保った。
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: 祈りの中で
  rationale: δέησις は願いや嘆願を含む祈りだが、ここでは簡潔で自然な「祈り」とした。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 夜も昼も
  rationale: 継続的・規則的に祈ることを示す原文の語順と反復感を自然な日本語で保った。
theological_decisions:
- issue: ἀπὸ προγόνων が示すパウロと先祖の信仰との関係
  choice: 「先祖以来」とし、神への奉仕が先祖の信仰と連続していることを示す
  alternative: 「先祖と同じように」または「先祖から受け継いで」
  rationale: パウロがイスラエルの信仰を否定したと断定せず、その信仰との連続性を表す一方、由来・伝承・模範のどれを特に強調するかは決めすぎない。
- issue: λατρεύω の意味範囲
  choice: 仕える
  alternative: 礼拝する
  rationale: この動詞は神への礼拝的奉仕を表しうる。「仕える」は宗教的献身を含みつつ、典礼的な礼拝だけに限定しない。
- issue: ὡς が感謝と想起を結ぶ仕方
  choice: 二つの内容を一文の中で結び、因果関係を明示しない
  alternative: 「あなたを思い起こすたびに神に感謝する」または「あなたを思い起こしているので神に感謝する」
  rationale: ὡς はここで感謝に伴う状況・内容を導くが、明確な因果接続詞と断定する必要はない。日本語では語順と連用形により関係を保ち、解釈を狭めないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、私信にふさわしい温かさと使徒書簡の品位を保った。「夜も昼も」を前に置いて祈りの継続性を際立たせ、全体を一文にして原文にある感謝と想起の結びつきを保持した。
