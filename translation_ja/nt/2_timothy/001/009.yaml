reference: 2 Timothy 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: ja
  text: この方は私たちを救ってくださり、聖なる召しをもって私たちを召してくださったのです[a]。これは私たちの行いによるのではなく、ご自身の目的と恵みによるものです。その恵みは、キリスト・イエスにあって[b]、永遠の昔に先立って[c]私たちに与えられたものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる召しへと」、または「聖なる召しによって」とも訳せる。ギリシア語の与格は複数の理解が可能である。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」は「メシア（油を注がれた者）」を意味する称号。「キリスト・イエスにおいて」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: 「永遠の時代より前に」「時が始まる前に」とも訳せる。原文は直訳すると「永遠の時々より前に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: 救い
  rationale: σῴζωの救済論的な重みを保ちつつ、現代日本語として最も自然で定着した表現を用いた。
- source_word: καλέσαντος κλήσει ἁγίᾳ
  choice: 聖なる招きをもって私たちを召して
  rationale: 動詞と同根名詞の結び付きをある程度残し、「招き」によって不自然な重複を和らげた。与格が手段・様態・目標のいずれとも取り得るため、「をもって」で限定しすぎないようにした。
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: 私たちの行いによるのではなく
  rationale: κατάが表す基準・根拠を自然な日本語で示した。「行い」はパウロ書簡で重要なἔργαの語感を保つ。
- source_word: ἰδίαν πρόθεσιν
  choice: ご自身の目的
  rationale: 文脈上の主体である神ご自身の意図・計画を表す。πρόθεσιςには「目的」が簡潔で神学的含意も保てる。
- source_word: χάριν
  choice: 恵み
  rationale: パウロ書簡におけるχάριςの定着した訳語であり、単なる好意以上の含意を保つ。
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: その恵みは……私たちに与えられた
  rationale: 女性形の分詞がχάρινを受けることを日本語で明確にした。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: キリスト・イエスにあって
  rationale: ἐνの結合・領域を示す神学的な幅を「あって」で保った。Χριστόςは日本語聖書語として定着した称号「キリスト」とした。
- source_word: πρὸ χρόνων αἰωνίων
  choice: 永遠の時より前に
  rationale: 直訳的な逆説性を保ち、単に「大昔」と弱めたり、「時間が始まる前」と解釈を一つに限定したりしないようにした。
theological_decisions:
- issue: κλήσει ἁγίᾳの与格の働き
  choice: 聖なる招きをもって
  alternative: 聖なる招きへと／聖なる招きによって
  rationale: 手段・様態・目標の可能性があるため、本文では比較的幅のある表現を選び、脚注で代案を示した。
- issue: ἐν Χριστῷ Ἰησοῦの訳し方
  choice: キリスト・イエスにあって
  alternative: メシアであるイエスにあって／キリスト・イエスにおいて
  rationale: 結合、領域、関係を含み得るἐνを、教派的に狭く定義せずに保った。「キリスト」は日本語で定着した称号として用いた。
- issue: πρὸ χρόνων αἰωνίωνの時間表現
  choice: 永遠の時より前に
  alternative: 永遠の昔より前に／時が始まる前に
  rationale: 原文の特異な表現と終末以前の神の恵みという緊張を保持し、時間論を過度に説明しないようにした。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、救い、召し、恵み、キリスト・イエスにあって、というパウロ書簡の主要語彙は格調と神学的な連続性のため保持した。長いギリシア語文を日本語では三文に分け、関係節の指示対象が「恵み」であることを明確にした。
