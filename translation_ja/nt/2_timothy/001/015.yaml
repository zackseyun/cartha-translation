id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: ja
  text: あなたはこのことを知っています。アジア[a]にいる者たちは皆、私に背を向けました[b]。その中にはフゲロとヘルモゲネがいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「アジア」は、現代のアジア大陸ではなく、小アジア西部にあったローマ帝国の属州を指します。
    reason: cultural_note
  - marker: b
    text: 別訳「私を見捨てました」「私から離れていきました」。ギリシア語は、より直訳的には「私に背を向けました」と述べています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: あなたは知っています
  rationale: οἶδαの現在的な状態の意味を、現代日本語で自然かつ直接的に表した。
- source_word: τοῦτο ὅτι
  choice: このことを知っています。［以下の文で内容を提示］
  rationale: τοῦτοが後続する内容節を指す構造を保った。日本語では文を分けることで、簡潔さと読みやすさを両立させた。
- source_word: ἀπεστράφησάν με
  choice: 私に背を向けました
  rationale: 関係や支持を断つことを表すと同時に、ἀποστρέφωの「向きを変えて離れる」という比喩を保つ表現である。
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: アジアにいる者たちは皆
  rationale: πάντεςの包括的な力を保ちつつ、その範囲を本文で狭めたり、地域の全住民という意味に拡大したりしない表現とした。
- source_word: Ἀσίᾳ
  choice: アジア
  rationale: 地名を慣用的に音写し、現代の大陸ではなくローマ属州を指すことは脚注で明示した。
- source_word: ὧν ἐστιν
  choice: その中には……がいます
  rationale: 先に述べた集団の中から具体例を挙げる部分的関係を、自然な日本語で表した。
- source_word: Φύγελος
  choice: フゲロ
  rationale: ギリシア語の人名を日本語の聖書で通用する形に音写した。
- source_word: Ἑρμογένης
  choice: ヘルモゲネ
  rationale: ギリシア語の人名を日本語の聖書で通用する形に音写した。
theological_decisions:
- issue: 「アジアにいる者たちは皆」の範囲
  choice: 「皆」という包括的表現をそのまま保ち、その範囲は文脈に委ねる。
  alternative: アジアの全住民または全キリスト者を例外なく指すと明示する／「多くの人」と弱める。
  rationale: πάντεςは強い包括性を持つが、文脈上はパウロと関係のある人々という範囲に限定され得る。本文に限定語を加えず、絶対化も緩和もしないことで原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用いた。「者たち」はやや格調を保ちながらも理解しやすく、人々の範囲を不必要に特定しない。原文の簡潔な告知と、パウロの強い落胆が伝わる語調を維持した。
