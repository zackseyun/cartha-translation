id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: ja
  text: 主がオネシフォロの家の者たちにあわれみを与えてくださいますように。彼はたびたび私を元気づけ、私の鎖[a]を恥じることもなかったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私が投獄されていること」。直訳は「私の鎖」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: 与えてくださいますように
  rationale: アオリスト希求法による祈願を、現代日本語で自然かつ敬意ある願いの表現として訳した。
- source_word: ἔλεος
  choice: あわれみ
  rationale: 困窮する者に示される主の慈愛を表す語として、聖書本文にふさわしく、一般読者にも理解できる表現を選んだ。
- source_word: ὁ κύριος
  choice: 主
  rationale: 神的称号として簡潔に訳し、父なる神か主イエスかという本文上明示されていない指示対象を限定しない。
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: オネシフォロの家の者たちに
  rationale: οἶκοςは建物よりも家族や家に属する人々を指すと考えられるため、現代日本語で自然な社会的意味を表した。
- source_word: ὅτι
  choice: からです
  rationale: 先行する祈願の理由を明確に示す。
- source_word: πολλάκις
  choice: たびたび
  rationale: 行為が何度も繰り返されたことを、簡潔で品位ある日本語で表す。
- source_word: ἀνέψυξεν
  choice: 元気づけ
  rationale: 苦境にあるパウロに安らぎや活力を与えたという意味を自然に伝える。直訳的な『生き返らせた』はここでは強すぎる。
- source_word: τὴν ἅλυσίν μου
  choice: 私の鎖
  rationale: 単数形の具体的な比喩を本文に保ち、投獄を指す換喩的意味は脚注で示す。
- source_word: οὐκ ἐπαισχύνθη
  choice: 恥じることもなかった
  rationale: アオリスト受動形のデポーネント的意味と、社会的・道徳的な恥の含意を自然に表した。καίの付加的な力も『も』で示した。
theological_decisions:
- issue: 祈願における『主』の指示対象
  choice: 『主』とだけ訳し、指示対象を特定しない
  alternative: 父なる神、または主イエスと明示する
  rationale: ギリシア語本文はὁ κύριοςとのみ記しているため、翻訳で特定せず、本文の神学的な余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈願にふさわしい落ち着きと品位を保った。人名は一般的な新約聖書表記に従い『オネシフォロ』とした。
