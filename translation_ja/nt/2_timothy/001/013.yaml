source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: ja
  text: あなたが私から聞いた健全なことばの型を、メシア・イエス[c]にある信仰[a]と愛のうちに[b]、保ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は「忠実さ」または「信頼」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳：「あなたが私から聞いた、メシア・イエスにある信仰と愛についての健全なことばの型を、保ちなさい。」ギリシア語では、「信仰と愛」が型を保つ際のあり方を示すとも、ことばの内容を示すとも取れる。
    reason: alternative_reading
  - marker: c
    text: 「メシア・イエス」の伝統的な訳は「キリスト・イエス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: 型
  rationale: 模範として保つべき形や枠組みを表す語であり、「型」は原語の簡潔さと規範的な含みを保つ。
- source_word: ἔχε
  choice: しっかり保ちなさい
  rationale: 直訳的には「持っていなさい」だが、ここでは受けたものを保持し続ける命令。「保ちなさい」が自然であり、「しっかり」は命令の継続的・確固とした含みを明確にする。
- source_word: ὑγιαινόντων λόγων
  choice: 健全なことば
  rationale: ὑγιαίνωの「健康である」から派生した比喩を「健全な」で保ち、λόγωνも解釈を加えた「教え」ではなく「ことば」とした。
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: あなたが私から聞いた
  rationale: παρά＋属格を情報の出所として自然に訳し、関係節が「ことば」にかかる構造を保った。
- source_word: ἐν πίστει
  choice: 信仰のうちに
  rationale: πίστιςの基本的な訳語を「信仰」とし、ἐνが示す領域・態度を「うちに」で表した。文中では「信仰と愛のうちに」とまとめた。
- source_word: καὶ ἀγάπῃ
  choice: と愛
  rationale: ἀγάπηを現代日本語で明瞭な「愛」とした。
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: 定冠詞を伴う前置詞句が「信仰と愛」をまとめて限定する意味を、自然な日本語の「にある」で表した。
- source_word: Χριστῷ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστόςの称号としての意味を明示するため「メシア」とした。伝統的な「キリスト」は脚注に示す。
theological_decisions:
- issue: ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ の係り先
  choice: 「信仰と愛のうちに」は、テモテが型を保つ際の領域・あり方を示す。
  alternative: 「健全なことば」の内容、すなわちメシア・イエスにある信仰と愛についてのことばを示す。
  rationale: 勧告の流れでは動詞「保ちなさい」にかける読みが自然だが、ギリシア語の統語上は内容を示す読みも可能なので、本文で一方を採りつつ脚注で曖昧さを保存した。
- issue: Χριστόςの訳
  choice: メシア
  alternative: キリスト
  rationale: ここでも称号としての意味が残っているため「メシア」とし、日本語の伝統的表記を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ことば」は聖書翻訳でなじみのある表記としつつ、「健全な」で原文の健康の比喩を残した。「しっかり保ちなさい」は直訳的な不自然さを避け、勧告の力を自然に伝える。
