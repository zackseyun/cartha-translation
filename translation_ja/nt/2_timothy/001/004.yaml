translation:
  language: ja
  text: 私が喜びに満たされるために、あなたに会いたいと切に願い、あなたの涙を覚えています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: 切に願い
  rationale: 強い個人的な願望を表す現在分詞。自然な現代日本語で感情の強さを保ち、後続の「あなたに会いたい」と滑らかにつながる。
- source_word: σε ἰδεῖν
  choice: あなたに会いたい
  rationale: ἐπιποθῶνを補う不定詞句で、願いの内容がテモテに会うことであることを直接的かつ自然に表す。
- source_word: μεμνημένος
  choice: 思い起こしています
  rationale: 完了分詞が示す、思い出して心に留めている状態を、継続性のある自然な日本語で表した。
- source_word: σου τῶν δακρύων
  choice: あなたの涙
  rationale: テモテの涙を指す属格表現を直接訳し、「泣いたこと」などの解釈的な言い換えを避けた。
- source_word: ἵνα
  choice: それは、～ためです
  rationale: 目的を中心に、結果の含みも排除しない構文として表現した。前の分詞句と主節の関係を日本語で明瞭にするため「それは」を補った。
- source_word: χαρᾶς πληρωθῶ
  choice: 私が喜びに満たされる
  rationale: 属格を伴う受動形の慣用的意味を自然な日本語で表し、受動態も保持した。
theological_decisions:
- issue: ἵνα節が表す目的と結果の関係
  choice: 「それは、私が喜びに満たされるためです」
  alternative: 「そうすれば、私は喜びに満たされます」
  rationale: ἵναの目的的な力を本文で保ちつつ、文脈上生じる結果の含みを否定しない訳とした。
translation_notes:
  register: 明瞭で現代的ながら、書簡にふさわしい落ち着きと品位を保った。「切に願う」によりἐπιποθέωの情感を伝え、過度に古風な語は避けた。
