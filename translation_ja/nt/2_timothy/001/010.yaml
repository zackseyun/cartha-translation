id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: ja
  text: しかし今や、私たちの救い主、メシアであるイエス[a]が現れたことによって、その恵みは明らかにされました。この方は死を無力にし、福音によって命と不朽性[b]を明るみに出されたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエス・キリスト」。ギリシア語の「クリストス」は、「メシア」という称号としても、「キリスト」という名称に近い呼び方としても用いられます。
    reason: alternative_reading
  - marker: b
    text: 別訳「不死」。原語は、朽ちることや腐敗を免れていることを強調します。
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: 明らかにされました
  rationale: 受動の意味を保ちつつ、前節の「恵み」を受ける日本語の定形節として自然にした。
- source_word: ἐπιφανείας
  choice: 現れたこと
  rationale: イエスの歴史的な出現を、音訳語や硬い抽象名詞を避けて明瞭に表す。
- source_word: σωτῆρος
  choice: 救い主
  rationale: キリスト論的称号として定着し、救済する方という意味も明確である。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を訳し、日本語として人名と称号の関係が明瞭になる形にした。
- source_word: καταργήσαντος
  choice: 無力にし
  rationale: 死に対する決定的な勝利を強く表しながら、現時点で死が存在しなくなったとまで訳文で断定しない。
- source_word: θάνατον
  choice: 死
  rationale: 語義を直接かつ簡潔に表す。
- source_word: φωτίσαντος
  choice: 明るみに出された
  rationale: 隠されていたものを示し、知られるようにするという比喩的意味を自然な日本語で表す。
- source_word: ζωὴν
  choice: 命
  rationale: 救済論的・終末論的な含みを狭めず、基本的な語義を保持する。
- source_word: ἀφθαρσίαν
  choice: 不朽
  rationale: 腐敗や朽滅を免れていることを簡潔に表し、「不死」だけに意味を限定しない。
- source_word: διὰ τοῦ εὐαγγελίου
  choice: 福音によって
  rationale: διά＋属格の手段を保ち、定着した用語「福音」を用いる。
- source_word: μὲν ... δὲ
  choice: 死を無力にし、…命と不朽を明るみに出された
  rationale: 死への否定的作用と、命・不朽を開示する肯定的作用との対照を、過度に硬い対応表現を使わず並列で示す。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστόςの扱い
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: ここでは「救い主」に続き、Χριστόςの称号性が生きているため「メシア」と訳した。一方、名称化した「キリスト」という理解も脚注に残した。
- issue: καταργήσαντοςが死について述べる効力
  choice: 死を無力にし
  alternative: 死を滅ぼし／死を廃し
  rationale: キリストによる死の決定的敗北を表しつつ、死が現在すでに一切存在しないという意味に解消せず、実現と完成の緊張を保つ。
- issue: ἀφθαρσίανの意味
  choice: 不朽
  alternative: 不死
  rationale: 単なる終わりのない存在よりも、朽ちず腐敗しない性質を中心に表す。一般的な別訳「不死」は脚注に示した。
- issue: φανερωθεῖσανの指示対象
  choice: その恵みは明らかにされました
  alternative: それは明らかにされました
  rationale: 分詞が前節の「恵み」を受ける構文関係を日本語で明示したが、その恵みの内容を訳文でさらに説明することは避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら礼拝朗読にも耐える、平明で品位ある文体とした。「不朽」はやや文語的だが、二つの目的語「命」と「朽ちないこと」を区別して簡潔に保つため採用した。前節から続く断片を単独でも理解できるよう「その恵み」を補っている。
