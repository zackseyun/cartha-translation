  source_fidelity: 原文の与格による宛名、ἀγαπητῷ τέκνῳ（「愛する子」）、および三つの祝福「恵み、あわれみ、平安」を正確に保っている。「私たちの」はκυρίου ἡμῶνにのみ対応し、「父なる神」には原文にない「私たちの」を補っていない。Χριστοῦ Ἰησοῦは「メシアであるイエス」として称号性を明示し、語順・統語上も「私たちの主」に自然に係る。
  naturalness: 簡潔で明瞭な現代標準日本語であり、書簡の挨拶として自然で品位がある。「恵みとあわれみと平安がありますように」は、原文の省略された祈願的挨拶を日本語として無理なく表す。「あわれみ」の表記も読みやすい。
  terminology: 「恵み」「あわれみ」「平安」「主」は適切で、相互の区別も維持されている。「メシア」はΧριστόςの意味を訳出する方針と整合し、脚注は伝統的表現「キリスト・イエス」を適切に示す。
