id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ja
  text: 愛する子テモテへ。父なる神と、私たちの主、メシアであるイエス[a]から、恵みとあわれみと平安がありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。ギリシア語の称号「クリストス」は「メシア」を意味する。
    reason: 称号の意味を表す訳と、伝統的な音写による訳の両方を示すため。
lexical_decisions:
- source_word: ἀγαπητῷ τέκνῳ
  choice: 愛する子
  rationale: ἀγαπητόςの深い愛情と、τέκνονが表す霊的な親子関係を、性別を不必要に付加せず自然な日本語で表した。
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の挨拶における定着した訳語であり、神から与えられる好意と賜物の含意を保つ。
- source_word: ἔλεος
  choice: あわれみ
  rationale: 「恵み」と区別される語として保ち、神の慈悲を明瞭に表す。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在だけでなく、神との関係に基づく安寧を含む聖書的な語感を保つ。
- source_word: θεοῦ πατρὸς
  choice: 父なる神
  rationale: 原文には「私たちの」に当たる修飾語がないため、それを補わず、自然で簡潔な日本語とした。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςを固有名の一部として音写するだけでなく、「油注がれた者」という称号の意味を示しつつ、現代日本語として理解しやすくした。
- source_word: κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριοςが示す権威とキリスト論的な重みを、一般的かつ定着した訳語「主」で保った。
theological_decisions:
- issue: Χριστοῦ Ἰησοῦの訳し方
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςの称号としての意味を本文で明示する一方、伝統的な音写による表現も脚注に残した。
- issue: 挨拶文の名詞句を日本語でどう表すか
  choice: 恵みとあわれみと平安がありますように
  alternative: 恵み、あわれみ、平安
  rationale: 原文は動詞を省いた挨拶の名詞句だが、日本語では祈願を示す述語を補うことで、その発話機能を自然かつ明瞭に表した。
translation_notes:
  register: 明瞭で現代的ながら、書簡の挨拶にふさわしい品位を保った。「あわれみ」は漢字を避けて読みやすくし、三つの祝福を並列して原文のリズムを維持した。
