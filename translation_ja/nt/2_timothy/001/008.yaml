id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: ja
  text: だから、私たちの主についての証し[a]を恥じてはなりません。また、主の囚人である私を恥じてもなりません。むしろ、神の力によって[c]、福音のために共に苦しんでください[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの主の証し」。ギリシア語の属格は、主についての証しとも、主がなさった証しとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「福音と共に苦しんでください」。この動詞には、ほかの人々と苦難を共にする意味が含まれる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「神の力に応じて」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: だから、…てはなりません
  rationale: οὖνが前節からの帰結を示すことを、現代日本語で自然な「だから」によって表した。μήとアオリスト接続法による禁止は「てはなりません」とした。
- source_word: ἐπαισχυνθῇς
  choice: 恥じてはなりません
  rationale: 人前で恥と感じて退く含みを持つ動詞であり、文脈と格調の双方に合う標準的な表現を選んだ。
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: 私たちの主についての証し
  rationale: 属格を、主を内容・対象とする証しと解した。日本語では「主の証し」だと主が行う証しとも読めるため、本文では関係を明示し、別解を脚注に残した。
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: また、主の囚人である私を恥じてもなりません
  rationale: 省略された「恥じる」を補って自然な日本語とし、αὐτοῦの帰属・結びつきを「主の囚人」で保持した。
- source_word: συγκακοπάθησον
  choice: 共に苦しんでください
  rationale: συν-が示す苦難への共同参与を「共に」で保ち、κακοπαθέωの苦難を耐え忍ぶ意味を簡潔に表した。
- source_word: τῷ εὐαγγελίῳ
  choice: 福音のために
  rationale: 動詞に伴う与格の圧縮された関係を、自然な日本語で福音に伴う苦難への参与として表した。「福音と共に苦しむ」という形式的な別訳は脚注に示した。
- source_word: κατὰ δύναμιν θεοῦ
  choice: 神の力に応じて
  rationale: κατά＋対格が持つ基準・尺度・一致の含みを保ち、「神の力によって」として手段だけに限定することを避けた。
theological_decisions:
- issue: 「証し」と「私たちの主」の関係
  choice: 主についての証し（目的属格）
  alternative: 主がなさった証し、または主に属する証し（主の証し）
  rationale: パウロを恥じないこととの並行から、キリスト者が主について行う証しと読むのが文脈に適する。ただしギリシア語の属格自体には別の理解も可能なので脚注に残した。
- issue: 「主の囚人」の意味
  choice: 主との帰属・結びつきをそのまま保持する
  alternative: 主のために囚人となった私
  rationale: 「主のため」と原因だけに限定せず、αὐτοῦが表す帰属や関係を保持した。
- issue: 福音と苦難の関係
  choice: 福音のために共に苦しむ
  alternative: 福音と共に苦しむ／福音に伴う苦しみを共にする
  rationale: τῷ εὐαγγελίῳの与格は簡潔で関係が圧縮されている。本文は自然な日本語を優先しつつ、συν-の共同参与を「共に」で表し、より形式的な可能性を脚注に残した。
- issue: 神の力と苦難の関係
  choice: 神の力に応じて
  alternative: 神の力によって
  rationale: κατάの基準・尺度の意味を優先し、力を単なる手段と断定しないことで原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令形は丁寧で格調を保つ「てはなりません／てください」とした。「証し」「福音」「主」は一般的な聖書語彙として維持した。原文の属格、与格、κατά句の曖昧さは、本文で最有力の読みを自然に示し、脚注で主要な別解を保存した。
