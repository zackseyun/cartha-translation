  source_fidelity: 祈願の希求法、二度の「主」、および「かの日」は概ね適切に保持されています。しかし「彼に許してくださいますように」は、δῴη（与える／かなえる）の意味を「許可する」に変えてしまいます。また「仕えてくれた」は、原文にない話者・受信者側への受益性を加えています。
  naturalness: 全体として読みやすい現代日本語です。ただし、祈願文は「主が……見いだせるようにしてくださいますように」とするほうが、原文の構文と日本語の祈願表現の双方に忠実です。「あなたのほうがよく知っています」は、βέλτιονの比較的含みを自然に表せます。
  terminology: 「主」「あわれみ」「かの日」「エフェソ」は一貫しており、神学的な指示対象も不必要に限定していません。「奉仕」はδιακονέωにふさわしい明瞭な現代語です。
