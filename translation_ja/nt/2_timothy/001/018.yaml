- from: どうか主が、かの日に、主からあわれみを受けることを彼に許してくださいますように[a][b]。また、彼がエフェソでどれほど仕えてくれたかは、あなた自身がよく知っています[c]。
  to: どうか主が、かの日に、彼が主からあわれみを見いだせるようにしてくださいますように[a][b]。また、彼がエフェソでどれほど奉仕したかについては、あなたのほうがよく知っています[c]。
  rationale: δῴηの祈願を「見いだせるようにしてくださいますように」と訳し、「許可する」という意味へのずれを正した。奉仕については原文にない受益者を示す「くれた」を除いた。また、「あなたのほうがよく知っています」によりβέλτιονの比較的な響きを保持した。二つの「主」の関係と「かの日」の終末的含意は、本文で解釈的に確定せず、そのまま保っている。
