  - severity: medium
    issue: 「彼がエフェソでどれほど仕えてくれたか」
    rationale: 「くれた」は、その奉仕が話者または聞き手のためになされたという受益の視点を加える。διηκόνησενは単に「奉仕した」であり、対象を本文で補わないほうがよい。
