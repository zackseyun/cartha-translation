source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: ja
  text: どうか主が、かの日に、彼が主からあわれみを見いだせるようにしてくださいますように[a][b]。また、彼がエフェソでどれほど奉仕したかについては、あなたのほうがよく知っています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主のもとで」とも訳せる。ギリシア語の表現は、あわれみの源が主であることを示すとも、主のみ前にあることを強調するとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「かの日」は、新約聖書で、神の裁きや救いが明らかになる来たるべき日を指す一般的な表現。
    reason: cross_reference
  - marker: c
    text: 直訳では「彼がエフェソで仕えたすべてのこと」。この表現は、彼の奉仕の内容や広がりをまとめて指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος
  choice: どうか主が、あわれみを受けることを彼に許してくださいますように
  rationale: アオリスト希求法による祈願を、現代日本語の自然で格調ある祈りの表現にした。「あわれみを見いだす」も可能だが、εὑρεῖν ἔλεοςという慣用句の意味が明確になる「受ける」を本文に採用した。
- source_word: παρὰ κυρίου
  choice: 主から
  rationale: 属格を伴う παρά の起点・源泉の意味を第一義とした。κύριοςの反復は省かず、原文どおり保った。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: かの日に
  rationale: 終末的含意を明示的に説明へ置き換えず、聖書的でありながら現代の読者にも理解できる指示表現を保った。
- source_word: ὅσα ... διηκόνησεν
  choice: どれほど仕えてくれたか
  rationale: ὅσαが奉仕の内容・広がり・程度をまとめて指すことを自然な日本語で表した。文脈上の受益性を「くれた」で自然に示すが、奉仕の対象は限定していない。
- source_word: βέλτιον σὺ γινώσκεις
  choice: あなた自身がよく知っています
  rationale: βέλτιονの比較的・強意的な含みを、日本語では不自然な比較対象を補わず「よく」で表し、強調されたσὺを「あなた自身」とした。
- source_word: ἐν Ἐφέσῳ
  choice: エフェソで
  rationale: 地名は現代日本語で一般的な聖書表記を用い、場所を示すἐνを自然な助詞「で」で訳した。
theological_decisions:
- issue: 二度現れる「主」（ὁ κύριος ... παρὰ κυρίου）の指示対象
  choice: 両方とも「主」とし、同一の方か、父と子をそれぞれ指すかを特定しない。
  alternative: 最初をキリスト、二度目を父なる神と解する、または両方をキリストと解する。
  rationale: ギリシア語本文は二つのκύριοςを明示的に区別していないため、反復と神学的な曖昧さをそのまま保った。
- issue: 「かの日」の終末論的意味
  choice: 本文では「かの日」とだけ訳す。
  alternative: 「裁きの日」または「終わりの日」と明示する。
  rationale: 終末の裁きまたは救いが明らかになる日を指す可能性が高いが、原文の慣用的な指示表現以上には限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祈願部分には「どうか」「くださいますように」を用いて尊厳ある調子を保った。「憐れみ」は常用的な可読性を優先して「あわれみ」と開いた。主の反復と「かの日」の含意は解釈で解消せず、脚注で選択肢を示した。
