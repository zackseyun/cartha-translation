  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: ja
  text: 神のみこころにより、メシアであるイエスにある命の約束に従って、メシアであるイエスの使徒とされたパウロ、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: パウロ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: パウロの自己紹介における職務上の意味を保ち、一般的な「使者」より定着した術語を採った。
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示しつつ、自然な日本語にした。
- source_word: διὰ θελήματος θεοῦ
  choice: 神の御心によって
  rationale: 神の意志に基づく任命・権威を表すδιά＋属格を、自然で荘重な日本語にした。
- source_word: κατ’ ἐπαγγελίαν
  choice: 約束に従って
  rationale: κατά＋対格が示す規準・対応関係を保った。使徒職と約束との厳密な関係は断定的に補足しない。
- source_word: ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにある命
  rationale: 冠詞付き前置詞句が「命」を限定する構造と、ἐνの結合・領域を示す表現を簡潔に保持した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この句では称号としての意味が認識できるため「メシア」を本文に採用し、日本語での慣用的な「キリスト」を脚注に示した。
- issue: κατ’ ἐπαγγελίανと使徒職の関係
  choice: 「約束に従って」を使徒職に結びつける
  alternative: 「命の約束を告げるために」など目的として明示する
  rationale: 原文のκατάは規準・対応を示し得るが目的を明示してはいないため、解釈を狭める補足を避けた。
translation_notes:
  register: 明快な現代標準日本語を用いた。ただし原文は一節から二節へ続く書簡冒頭の一文であるため、「パウロから」として日本語の書簡形式を示した。κατ’ ἐπαγγελίανの係り先を保つため後半を独立文にしたが、意味上は冒頭の自己紹介全体に属する。
