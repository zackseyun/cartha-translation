id: 2TI.1.14
reference: 2 Timothy 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: ja
  text: あなたに託されたその良いものを、私たちの内に住んでおられる聖霊によって守りなさい[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その良い委託物」。または「その尊い委託物」。
    reason: lexical_alternative
  - marker: b
    text: 「私たちの内に住んでおられる聖霊を通して」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: あなたに託されたその良いもの
  rationale: παραθήκηは保管を任されたものを指す。「委託物」では現代日本語として硬く不自然なため、受け身の表現で委託の比喩を保った。文脈と命令の相手から、受託者を「あなた」と明示した。καλήは意味を狭めず「良い」とした。
- source_word: φύλαξον
  choice: 守りなさい
  rationale: 委ねられたものを注意深く保護するよう求めるアオリスト命令形の力を、自然で明確な命令として表した。
- source_word: διὰ πνεύματος ἁγίου
  choice: 聖霊によって
  rationale: 属格を伴うδιάが示す手段・働きを自然な日本語で表し、聖霊の助けまたは働きによって守るという関係を保持した。
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: 私たちの内に住んでおられる
  rationale: 現在分詞が表す継続的な内住を保ち、ἐν ἡμῖνを狭めず「私たちの内に」と訳した。聖霊への敬意を自然に示すため敬語表現を用いた。
theological_decisions:
- issue: 「託されたその良いもの」の指示対象
  choice: 福音や務めなどに特定せず、包括的な表現のまま残した。
  alternative: テモテに託された福音の教え、またはテモテの宣教の務めと明示する。
  rationale: 文脈は使徒的な福音の委託を強く示唆するが、ギリシア語自体は簡潔な比喩であり、指示対象を一つに限定していないため。
- issue: 「私たち」の範囲
  choice: 「私たち」と訳し、その範囲を限定しなかった。
  alternative: パウロとテモテだけ、または信者全体を指すと明示する。
  rationale: ἡμῖνは直近ではパウロとテモテを含み得る一方、信者共同体への広がりも持ち得るため、原文の曖昧さを保持した。
- issue: 聖霊と守る行為との関係
  choice: 「聖霊によって」とし、手段と働きの主体の両方を許容した。
  alternative: 「聖霊の助けによって」または「聖霊を通して」と限定的に表現する。
  rationale: διά＋属格は手段または媒介・働きを表し得るため、その神学的関係を必要以上に限定しない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「委託物」のような法律・事務用語的な硬さを本文では避け、「あなたに託されたその良いもの」として委託の意味を自然に表した。
