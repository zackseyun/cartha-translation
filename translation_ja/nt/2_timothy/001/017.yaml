lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の文脈で述べられた人々の態度とオネシフォロの行動を対照させる逆接として、自然で明瞭な「しかし」とした。
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: ローマに来たとき
  rationale: γενόμενος は「そこにいた」とも「そこへ来た」とも理解できるが、場所を表す句と結びついたアオリスト分詞として、移動の含みを自然な日本語で表した。意味の幅は脚注に残した。
- source_word: σπουδαίως
  choice: 熱心に
  rationale: 真剣さと力を尽くす態度を表し、人を捜す文脈にも自然に合う。
- source_word: ἐζήτησέν με
  choice: 私を捜し
  rationale: 特定の人物を見つけようと実際に捜し回る行為を、現代日本語で明確に表す。
- source_word: καὶ εὗρεν
  choice: 見つけてくれました
  rationale: 目的語「私」を前節から補い、話者に対してなされた好意を自然な日本語の授受表現で示した。原文の単純な「見つけた」より語用論的な含みを明示するため、必要なら本文を「見つけました」とする余地もある。
