id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: ja
  text: このために、私はこれらの苦しみをも受けています。しかし、恥じてはいません。私が信頼している方[a]を知っており、その方が私の委託物[b]をあの日[c]まで守ることができると確信しているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私が信じている方」とも訳せる。ここでは、単なる命題への同意ではなく、その方に信頼を置く意味を含む。
    reason: lexical_alternative
  - marker: b
    text: 「委託物」は、安全に保つためにだれかに託されたものを表す。パウロが神に委ねたものを指すとも、神からパウロに委ねられたものを指すとも理解できる。
    reason: alternative_reading
  - marker: c
    text: 神が最後に裁き、正しさを明らかにされる将来の日を指す。
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: このために
  rationale: 直前の内容との因果関係を保ちつつ、現代日本語として自然な接続表現にした。
- source_word: καὶ ταῦτα πάσχω
  choice: 私はこのような苦しみにも遭っています
  rationale: πάσχωの継続的な苦難を「苦しみに遭っています」で表し、καίを「も」、ταῦταを「このような」で保持した。
- source_word: οὐκ ἐπαισχύνομαι
  choice: 恥じてはいません
  rationale: 文脈上、苦難や証しを恥としない本人の姿勢を表す自然な訳とした。
- source_word: οἶδα
  choice: 知っており
  rationale: 形は完了形だが現在の状態を表すため、現代日本語の現在表現にした。
- source_word: ᾧ πεπίστευκα
  choice: 自分が信頼してきた方
  rationale: 与格を伴うπιστεύωの人格的な信頼を明確にし、完了形の継続的・確定的な含みを「してきた」で表した。
- source_word: πέπεισμαι
  choice: 確信している
  rationale: 完了受動形が表す、確立して現在も続く確信を自然な日本語で示した。
- source_word: δυνατός ἐστιν
  choice: おできになる
  rationale: 能力を表すと同時に、暗示される神的な人物への敬意を日本語として自然に示す。指示対象自体は本文以上に特定していない。
- source_word: τὴν παραθήκην μου
  choice: 私の委託物
  rationale: 保管のために託されたものを指す語の比喩を保ち、「私の」が、パウロが委ねたものか、パウロに委ねられたものかを本文で確定しないようにした。
- source_word: φυλάξαι
  choice: 守る
  rationale: 委託物を安全に保つという比喩に合い、φυλάσσωの保護・保全の意味を簡潔に表す。
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: あの日まで
  rationale: 終末の特定の日を指し示す表現を保ち、時間的な到達点として自然に訳した。
theological_decisions:
- issue: ᾧの指示対象とδυνατός ἐστινの主語
  choice: 「信頼してきた方」「その方」とし、人格的指示を保ちながら神またはキリストと明示しない。
  alternative: 「神」または「キリスト・イエス」と明示する。
  rationale: 文脈上は神またはキリストを強く示唆するが、この節のギリシア語は名を明記していないため、その特定度を保った。
- issue: παραθήκη μουの意味
  choice: 「私の委託物」とし、委託の方向を確定しない。
  alternative: パウロが神に委ねた命・魂、または神がパウロに委ねた福音・務めと明示する。
  rationale: 属格の関係は両方向に解釈でき、本文だけでは一方に決められない。神学的緊張を残し、説明は脚注に置いた。
- issue: 「あの日」の内容
  choice: 本文では「あの日」のままにする。
  alternative: 神の最後の裁きと救いの完成の日、と本文中で明示する。
  rationale: 終末論的指示は文脈から明らかだが、原文の簡潔な指示表現を保持した。
translation_notes:
  register: 明快な現代標準語を用いながら、手紙としての落ち着きと威厳を保った。「委託物」はやや硬い語だが、原文の保管委託の比喩と解釈上の曖昧さを保つために採用し、脚注で平易に説明した。
