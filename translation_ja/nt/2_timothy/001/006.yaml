    issue: ἀναμιμνῄσκωと不定詞句の構文が二文に分断されている
    rationale: 原文は『私はあなたに、賜物を再び燃え立たせるよう思い起こさせる／促す』という一続きの構文です。現行訳は後半を「…なさい」という独立命令にするため、「思い起こさせます」との統語的関係が日本語で成立しにくくなっています。
  - severity: low
