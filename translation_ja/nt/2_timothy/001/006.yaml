source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: ja
  text: このため私は、私があなたに手を置いたことを通してあなたのうちにある神の賜物を、再び燃え立たせるよう、あなたに改めて促します[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「火をあおって再び燃え立たせる」。ギリシア語の動詞は、火を再び勢いよく燃え立たせるイメージを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: このため
  rationale: 直前の文脈を受ける因果的なつながりを、簡潔で自然な現代日本語で示す。
- source_word: ἀναμιμνῄσκω
  choice: 私はあなたに思い起こさせます
  rationale: 単に情報を知らせるのではなく、すでに知っていることを想起させる語義を保つ。現在形の働きも自然に表現する。
- source_word: σε ἀναζωπυρεῖν
  choice: 再び燃え立たせなさい
  rationale: 火を再び勢いよく燃やすという動詞の比喩を保持しつつ、日本語として命令内容を明確にする。
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: 神の賜物
  rationale: χάρισμαを教会用語に過度に限定せず、恵みによって与えられたものという含みを持つ定着した表現で訳す。
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: あなたのうちにある
  rationale: 賜物がテモテの内に現にあるという関係節を、そのまま自然に表す。
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: 私が手を置いたことによって
  rationale: 按手という行為を普通の読者にも理解できる言い方で表し、διά＋属格の手段・媒介の意味を「によって」で保持する。
theological_decisions:
- issue: パウロの按手と神の賜物との媒介関係
  choice: 私が手を置いたことによって
  alternative: 私が手を置いた時に／私の按手を通して
  rationale: 原文のδιά＋属格が示す手段・媒介の関係を保ち、単なる時間的同時性へ弱めない。一方で、この一節を越えて特定の制度的・秘跡的理解を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「賜物」は聖書語として定着しているが、「手を置いたこと」と組み合わせ、一般読者にも理解しやすくした。原文の火の比喩と、按手を通した賜物という神学的緊張を保持した。
