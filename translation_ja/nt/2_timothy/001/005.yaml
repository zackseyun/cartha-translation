  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: ja
  text: あなたのうちにある偽りのない信仰を思い起こして、私は確信しています。その信仰は、まずあなたの祖母ロイスと母ユニケのうちに宿り、あなたのうちにもあることを。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: 思い起こしています
  rationale: 直訳的には「思い起こさせるものを受けて／思い起こして」。日本語では継続する想起を自然に表し、分詞が主節へつながる流れを保つ。
- source_word: ἀνυποκρίτου πίστεως
  choice: 偽りのない信仰
  rationale: ἀνυπόκριτος の「偽善的でない、真実な」を明瞭に表し、「誠実な信仰」より信仰そのものに偽りがないという語感を保つ。
- source_word: ἐνῴκησεν
  choice: 宿りました
  rationale: 「内に住む」を表す動詞の比喩を、自然で品位ある日本語にした。「生きていた」より原語の居住イメージを保持する。
- source_word: πέπεισμαι
  choice: 確信しています
  rationale: 完了形が示す、確信に至り現在もその確信を抱いている状態を表す。
theological_decisions:
- issue: πίστις が主観的な信仰心を指すか、信仰内容を指すか
  choice: 信仰
  alternative: 信仰心／信じる心
  rationale: 原語の幅を限定せず、ロイス、ユニケ、テモテに宿るものとして描かれる信仰の意味を保つ。
- issue: 「あなたのうちにも」の述語の補充
  choice: 宿っている
  alternative: ある
  rationale: ギリシャ語では述語が省略されているが、先行する ἐνῴκησεν を自然に補い、同じ信仰の連続性を明示する。
translation_notes:
  register: 明瞭な現代標準日本語。家族名は一般的な聖書表記の「ロイス」「ユニケ」を採用し、簡潔で落ち着いた書簡体とした。
