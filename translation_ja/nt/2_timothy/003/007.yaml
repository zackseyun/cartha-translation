  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: ja
  text: いつも学んではいるものの、決して真理を知るに至ることができません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「真理を十分に知る」とも訳せます。ギリシア語は、より十分で完全な認識を意味することがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: いつも
  rationale: 継続・反復される状態を簡潔に表し、μηδέποτεとの鮮明な対照を保つ。
- source_word: μανθάνοντα
  choice: 学んではいる
  rationale: 現在分詞が示す継続的な学びを表す。受け身の教育や正式な勉学に限定しない。
- source_word: μηδέποτε
  choice: 決して…ません
  rationale: 強い時間的否定を自然な現代日本語で表し、πάντοτεとの修辞的対照を保つ。
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: 真理を知るに
  rationale: 直訳的な「真理の知識へ」より自然でありつつ、真理についての真正な認識へ到達する意味を保つ。ἐπίγνωσιςの強意的可能性は脚注に残す。
- source_word: ἐλθεῖν
  choice: 至る
  rationale: 知識・認識への到達という移動の比喩を、日本語として自然に保持する。
- source_word: δυνάμενα
  choice: ことができません
  rationale: 能力・可能性の欠如を明確に表す。主語は前節から続くため、この節では反復しない。
theological_decisions:
- issue: パウロ書簡におけるἐπίγνωσιςのニュアンス
  choice: 知る
  alternative: 十分に知る／深く知る
  rationale: 文脈の中心は、絶えず学んでも真理の真正な認識に到達できないという点にある。「十分に知る」と本文で限定すると強意を確定しすぎるため、可能な含意を脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いつも…決して…ない」の対照を生かし、前節から続く女性たちという主語は日本語では省略した。
