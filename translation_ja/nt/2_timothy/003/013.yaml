id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: ja
  text: しかし、悪人や詐欺師たちは[a]、人を惑わし、自らも惑わされながら、ますます悪くなっていきます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いかさま師たち」「人を欺く者たち」とも訳せる。ギリシア語は、人をだます者を指し、文脈によっては魔術やいかがわしい術を使う者という含みもある。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「より悪い方へ進んでいきます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ἄνθρωποι
  choice: 悪人
  rationale: 単に質が悪いという意味ではなく、道徳的に悪い人々を指すため、「悪人」とした。ἄνθρωποι は男性だけに限定されない一般的な「人々」である。
- source_word: δὲ
  choice: しかし
  rationale: 直前に述べられたテモテとの対照を、自然な現代日本語で明確に示す。
- source_word: γόητες
  choice: 詐欺師たち
  rationale: 人を欺くいかさま師、偽者という中心的な意味を表しつつ、文脈が明示していない魔術行為に限定しない訳語とした。
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: ますます悪くなっていきます
  rationale: 「より悪い方へ進む」という皮肉な前進のイメージを、自然で分かりやすい日本語として表した。
- source_word: πλανῶντες
  choice: 人を惑わし
  rationale: 継続的に他者を欺き、誤った方向へ導く働きを表す現在分詞の意味を保った。
- source_word: πλανώμενοι
  choice: 自らも惑わされながら
  rationale: 受動の形を保ち、他者を惑わす者自身もまた欺きの影響下にあるという緊張を明示した。
theological_decisions:
- issue: ἄνθρωποι の男性複数形の扱い
  choice: 悪人
  alternative: 悪い男たち
  rationale: ここでの複数形は人間一般を指し、男性だけに限定する根拠がないため、性別を限定しない日本語とした。
- issue: γόητες に含まれ得る魔術的含意
  choice: 詐欺師たち
  alternative: 魔術師たち
  rationale: この語には魔術師やまじない師の含みが生じる場合もあるが、この文脈の重点は欺瞞にある。したがって、本文では不必要にオカルト的意味へ限定せず、語義の幅は脚注で示した。
- issue: 惑わす者が惑わされるという受動表現
  choice: 人を惑わし、自らも惑わされながら
  alternative: 人を惑わし、迷いを深めながら
  rationale: πλανώμενοι の受動態を保持し、欺く側であると同時に欺かれる側でもあるという本文の神学的・倫理的緊張を解消しないようにした。
translation_notes:
  register: 明快な現代標準語を用い、聖書本文としての落ち着きと品位を保った。「ますます悪くなっていきます」は慣用的で理解しやすく、原文の未来的な進行も自然に表す。脚注記号は該当語句の直後に置いた。
source_grounding:
  english_pob_role: consult_only
