reference: 2 Timothy 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: ja
  text: 聖書の一つ一つは、神の息吹によるものであり[a][b]、教えるため、誤りを指摘するため、正すため、また義[c]を実践するための訓練のために役立ちます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖書はすべて、神の息吹によるものであり、役立ちます」。ギリシア語の πᾶσα γραφή は、「聖書の一つ一つ」と配分的にも、「聖書はすべて」と集合的にも理解できます。
    reason: alternative_reading
  - marker: b
    text: 別訳「神の息吹による聖書はどれもまた、教えるため、誤りを指摘するため、正すため、また義を実践するための訓練のために役立ちます」。
    reason: alternative_reading
  - marker: c
    text: 「義」は「正義」と訳せる場合もありますが、ここでは正しく生きるための人格形成という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: 聖書の一つ一つ
  rationale: 冠詞のない πᾶσα γραφή の配分的な形を自然な日本語で表しつつ、文脈上の γραφή が一般の文書ではなく聖なる書を指すことを明確にした。集合的な「聖書はすべて」も可能なので脚注に残した。
- source_word: θεόπνευστος
  choice: 神の息吹によるもの
  rationale: 「神の息吹を受けた」という語の構成を見える形で示し、後代の霊感論を訳文に持ち込まない表現とした。
- source_word: ὠφέλιμος
  choice: 役立ちます
  rationale: 有益であり、後続の諸目的に資するという意味を、明瞭で現代的な日本語で表した。
- source_word: πρὸς διδασκαλίαν
  choice: 教えるため
  rationale: 教える行為とその内容の双方を含み得る διδασκαλία を、教派的に狭く響く表現を避けて訳した。
- source_word: ἐλεγμόν
  choice: 誤りを指摘するため
  rationale: 過ちを明るみに出して認識させる意味を表す。「叱責」よりも、人への強い言葉だけに限定されない表現である。
- source_word: ἐπανόρθωσιν
  choice: 正すため
  rationale: 誤った状態を再び正しい状態に戻す意味を、簡潔で自然な日本語にした。
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: 義に生きる訓練
  rationale: παιδεία の継続的な形成・訓練の含意を保ち、ここでの δικαιοσύνη が正しく生きる人格形成を指すことを自然に表した。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: パウロ書簡で重要な語の対応を保つため「義」とした。この文脈では道徳的に正しく生きることが中心だが、「正義」という語義も脚注に示した。
theological_decisions:
- issue: θεόπνευστος と ὠφέλιμος の πᾶσα γραφή に対する統語関係
  choice: 両方を述語として取り、「聖書の一つ一つは、神の息吹によるものであり、……役立ちます」とした。
  alternative: 「神の息吹による聖書はどれもまた、教えるため……役立ちます」
  rationale: 二つの形容詞を並列の述語と見る読みが文脈の流れに最もよく合う。ただし、θεόπνευστος を限定用法に取ることも文法上可能なので、その曖昧さを脚注に保存した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文にふさわしい落ち着いた調子を保った。「聖書の一つ一つ」で原文の配分的な形を示し、統語上の別解と集合的な読みは脚注に置いた。
