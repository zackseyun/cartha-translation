lexical_decisions:
- source_word: Τοῦτο
  choice: このこと
  rationale: 後続するὅτι節の内容を前方指示する中性指示代名詞。「このこと」として日本語で明確に示した。
- source_word: δὲ
  choice: しかし
  rationale: 前の文脈からの穏やかな対照・展開を示す。逆接を過度に強めず、明瞭に伝える。
- source_word: γίνωσκε
  choice: 知っておきなさい
  rationale: 現在命令形の継続的な留意の含みを、自然な現代日本語で表した。「知りなさい」より、この現実を認識し心に留める勧告として自然。
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: 終わりの日々には
  rationale: 終末論的な定型句を、その時間的範囲を限定せずに保持した。
- source_word: ἐνστήσονται
  choice: 訪れます
  rationale: ここでは時期が到来する、現れるという意味。「来ます」より文体にふさわしく、過度な解釈を加えない。
- source_word: καιροὶ
  choice: 時
  rationale: 単なる時刻ではなく、一定の時期・状況を指す。日本語では「困難な時」が自然。
- source_word: χαλεποί
  choice: 困難な
  rationale: 困難、厳しさ、危険性を含み得る語。本文では広い意味を保つ「困難な」を採用し、別訳を脚注に示した。
theological_decisions:
- issue: 「終わりの日々」の時間的範囲
  choice: 「終わりの日々」という終末論的表現をそのまま保ち、範囲を限定しない。
  alternative: キリストの再臨直前だけを指す期間、または新約聖書におけるより広い終末の時代。
  rationale: 原文自体はここで時間的範囲を詳しく定義していないため、特定の終末論体系によって曖昧さを解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。単数のテモテへの命令は「知っておきなさい」とし、後続内容を独立文で読みやすく提示した。
