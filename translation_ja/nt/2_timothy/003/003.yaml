  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: ja
  text: 家族への情愛がなく、和解しようとせず[a]、人を中傷し[b]、自制が利かず、粗暴で、善を愛さない[c]者となります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「執念深く」または「和解の取り決めを破る者」。
    reason: lexical_alternative
  - marker: b
    text: ここで「人を中傷し」と訳したギリシア語は、「悪魔」を指すのではなく、「中傷する」「中傷する者たち」という意味です。
    reason: lexical_alternative
  - marker: c
    text: 別訳「善を憎み」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: 家族への情愛がなく
  rationale: στοργήが特に家族や近親者の間に期待される自然な情愛を指すことを明確にし、単なる「愛がない」より具体的に訳した。
- source_word: ἄσπονδοι
  choice: 和解しようとせず
  rationale: 和平や和解に応じようとしない、融和を拒む態度を自然な現代日本語で表した。既に結ばれた協定を破ることだけに意味を限定しない。
- source_word: διάβολοι
  choice: 人を中傷し
  rationale: この複数形は悪徳の列挙の中で、人を悪く言い訴える行為を表す。「悪魔たち」という存在への言及ではないことが伝わる動詞表現とした。
- source_word: ἀκρατεῖς
  choice: 自制が利かず
  rationale: 欲望や衝動を抑える力がないことを、簡潔で一般的な現代日本語にした。
- source_word: ἀνήμεροι
  choice: 粗暴で
  rationale: 飼いならされていないような荒々しさ、残忍さを表しつつ、悪徳の列挙に適した自然な語を選んだ。
- source_word: ἀφιλάγαθοι
  choice: 善を愛さない
  rationale: 「善を愛する」の否定という語の形を保ち、積極的に善を憎むとまでは本文で断定しない訳とした。
theological_decisions:
- issue: 悪徳表における διάβολοι の意味
  choice: 人を中傷する者という一般的な道徳的描写
  alternative: 悪魔たち、悪魔のような者たち
  rationale: 複数形で他の悪徳と並ぶ統語的文脈から、人を中傷・告発する性質を指す。超自然的存在への言及と取られる訳は避けた。
- issue: ἀφιλάγαθοι の否定の強さ
  choice: 善を愛さない
  alternative: 善を憎む
  rationale: 複合語の否定的要素をそのまま保ち、本文が必ずしも明示しない積極的な憎悪へ意味を強めなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。形容詞が連続するギリシア語の悪徳表を、日本語では「なく／せず／し／利かず／で」と変化をつけて自然につないだ。「者となります」は周辺文脈の述語に接続させるための補完であり、各語の意味自体は原文の列挙に即している。
