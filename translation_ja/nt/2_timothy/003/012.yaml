base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: ja
  text: 実際、メシア・イエスにあって敬虔に生きようと願う人は皆、迫害を受けます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάντες δὲ
  choice: しかし実際、…人は皆
  rationale: καίとδέの連結・確認的な働きを文脈上の軽い対比と強調として自然な日本語にし、πάντεςの普遍的範囲を「皆」で保持した。
- source_word: οἱ θέλοντες
  choice: 生きようと願う人
  rationale: 冠詞付き現在分詞の実質名詞用法と、θέλωの意志・願望の意味を自然に表した。
- source_word: ζῆν εὐσεβῶς
  choice: 敬虔に生きる
  rationale: εὐσεβῶςは神への崇敬を伴う生き方を表す副詞であり、簡潔で品位ある「敬虔に」を採用した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: キリスト・イエスにあって
  rationale: ἐνが示す関係・領域・結びつきを、聖書日本語として明瞭な「にあって」で保った。Χριστόςは日本語で広く定着した称号表現「キリスト」とした。
- source_word: διωχθήσονται
  choice: 迫害を受けます
  rationale: διώκωの未来受動形を、断定的な未来の意味を保ちつつ自然な日本語で表した。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦが示す関係
  choice: キリスト・イエスにあって
  alternative: キリスト・イエスに結ばれて
  rationale: 原文のἐνが持ちうる領域・関係・結合の幅を狭めず、神学的含意を一つに限定しない表現を選んだ。
- issue: Χριστόςの訳し方
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、「キリスト」は現代日本語の聖書語彙として定着しており、固有名化しすぎないよう中黒を用いて「キリスト・イエス」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、短い格言的な断定の力を保った。「敬虔」はやや宗教的な語だが、εὐσεβῶςの神への崇敬を含む意味を簡潔かつ dignified に伝えるため適切と判断した。
