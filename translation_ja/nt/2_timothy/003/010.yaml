source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: ja
  text: しかしあなたは、私の教え、生き方、目的、信仰[a]、辛抱強さ、愛、忍耐をよく学び、身につけてきました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誠実さ」。ここで用いられているギリシア語は、文脈によって「信仰」と「誠実さ」のどちらをも意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: しかし、あなたは
  rationale: δέの前段との対照を「しかし」で示し、明示された強調代名詞Σὺを「あなたは」と訳した。
- source_word: παρηκολούθησάς
  choice: つぶさに見て従ってきました
  rationale: παρακολουθέωが含み得る、注意深く観察して知ることと、その歩みに従うことの両面を自然な日本語で表した。アオリストは、テモテがこれまで実際にそうしてきたことを示す文脈に即して訳した。
- source_word: μου
  choice: 私の
  rationale: 後続する与格の列全体にかかる所有の関係として簡潔に表した。
- source_word: διδασκαλίᾳ
  choice: 教え
  rationale: 現代日本語で自然かつ明瞭であり、過度に専門的な「教理」を避けた。
- source_word: ἀγωγῇ
  choice: 生き方
  rationale: 単なる個々の行為ではなく、生活態度や振る舞い全体を指す語義を自然に表す。
- source_word: προθέσει
  choice: 目的
  rationale: パウロの定まった意図や目標を、簡潔で一般的な語によって表した。
- source_word: πίστει
  choice: 信仰
  rationale: 神への信頼を表す標準的な訳語を本文に採用した。ただし、この徳目の列では「誠実さ」も可能なため脚注に残した。
- source_word: μακροθυμίᾳ
  choice: 辛抱強さ
  rationale: 人に対して性急に怒らず、長く耐える性質を、現代の読者に分かりやすく表した。後続のὑπομονήとの違いも保つ。
- source_word: ἀγάπῃ
  choice: 愛
  rationale: ἀγάπηの意味を最も直接的かつ自然に伝える標準的な訳語である。
- source_word: ὑπομονῇ
  choice: 忍耐
  rationale: 試練のもとで踏みとどまり耐え続けることを表す、自然で簡潔な訳語とした。
theological_decisions:
- issue: パウロ書簡の徳目の列におけるπίστιςの訳
  choice: 信仰
  alternative: 誠実さ
  rationale: この文脈では神への信頼としての「信仰」と、信頼に値する性質としての「誠実さ」の双方が語義上可能である。本文では標準的な「信仰」を採り、意味を一方に限定しないため別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、徳目の列の簡潔さと品位を保った。「つぶさに見て従ってきました」により、単なる観察にも単なる模倣にも限定せず、原語の幅を示した。
