source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: ja
  text: こういう者たちの中には、家々に忍び込み、罪を重く背負った[c]、さまざまな欲望に導かれている弱い女たち[b]をとりこにする[a]者がいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「捕虜にする」。原語には人を捕らえて支配下に置く比喩がある。
    reason: lexical_alternative
  - marker: b
    text: 原語は「女」の指小形で、ここでは軽蔑的に用いられている。女性一般ではなく、付け込まれやすい一部の女性を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳的には「罪を積み上げられた」または「罪を山ほど抱えた」。罪が重く積み重なった状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: こういう者たちの中には
  rationale: 直前に述べられた一群に属する者を指す表現として、自然な日本語にした。
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: 家々に忍び込み
  rationale: ἐνδύω がここで帯びる、ひそかに入り込む含みを保ちつつ、οἰκίαςを具体的な家庭への侵入として自然に表した。
- source_word: αἰχμαλωτίζοντες
  choice: とりこにする
  rationale: 捕虜にするという比喩を保ちながら、相手を支配下に置く意味が現代日本語で伝わる表現とした。
- source_word: γυναικάρια
  choice: 弱い女たち
  rationale: 女性一般ではなく、文脈上、付け込まれやすい一部の女性を軽蔑的に指す指小語であることを表した。原語の形と語調は脚注で明示した。
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: 罪を重く背負い
  rationale: 積み上げられた重荷のような状態を示す完了受動分詞の含みを、簡潔で自然な日本語にした。
- source_word: ἀγόμενα ἐπιθυμίαις ποικίλαις
  choice: さまざまな欲望に引き回されている
  rationale: 受動的かつ継続的に多様な欲望の影響下にある姿を表し、単なる案内より強い否定的文脈も保った。
theological_decisions:
- issue: γυναικάριαの軽蔑的な指示
  choice: 「弱い女たち」とし、偽教師に付け込まれる特定の女性たちを指すようにした。
  alternative: 「小さな女たち」「愚かな女たち」「だまされやすい女たち」
  rationale: 指小語の侮蔑的な響きを完全に平板化せず、同時に女性一般についての普遍的主張へ広げないため。
- issue: οἰκίαςが指す範囲
  choice: 「家々」と訳した。
  alternative: 「家庭」「家の中」
  rationale: 原語の複数形と具体的な侵入の像を直接保った。「家庭」も可能だが、社会集団という解釈を本文に固定しないようにした。
- issue: ἀγόμεναの受動性
  choice: 「欲望に引き回されている」とした。
  alternative: 「欲望に導かれている」「欲望に駆り立てられている」
  rationale: 本人の責任を消すことなく、本文が描く受動的な支配状態を保つため。「駆り立てられる」ほど衝動性に限定しなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、「忍び込み」「とりこにする」「引き回されている」によって原文の強い否定的描写を保った。文末は書簡本文として自然で品位のある「います」とした。
