source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: ja
  text: しかし、彼らはこれ以上進むことはありません[a]。彼らの愚かさは、あの人たち[b]の愚かさが明らかになったのと同じように、すべての人に明らかになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これ以上進展することはありません」。
    reason: lexical_alternative
  - marker: b
    text: 「あの人たち」とは、前の節に出てくるヤンネとヤンブレを指します。
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: 先へ進む
  rationale: 「前進する、進展する」という比喩を保ちつつ、この偽りの教師たちの活動がそれ以上続かないという文脈に自然に合う表現とした。
- source_word: ἐπὶ πλεῖον
  choice: これ以上
  rationale: 否定辞と結びついた「それより先へ、さらに」という意味を、現代日本語で簡潔に表した。
- source_word: ἄνοια
  choice: 愚かさ
  rationale: 理解や判断を欠く状態を表す語であり、知的・道徳的な含みを過度に限定せず伝える。
- source_word: ἔκδηλος
  choice: 明らかになる
  rationale: 人々の目に明白になるという意味を自然な日本語で示し、未来形も反映した。
- source_word: πᾶσιν
  choice: すべての人に
  rationale: 与格が示す、誰の目にも明らかになるかという普遍的な範囲を明示した。
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: あの人たちの場合と同じように
  rationale: 「愚かさ」を補う省略表現を自然な日本語にしつつ、ἐκείνωνの指示性と比較の関係を保った。
theological_decisions:
- issue: ἐκείνων（あの人たち）の指示対象
  choice: 直前の節に挙げられたヤンネとヤンブレを指すものとして注で示す
  alternative: 以前の偽りの教師たちを広く指す
  rationale: 直前の3章8節がヤンネとヤンブレを名指ししており、彼らの愚かさが露呈したことが現在の反対者たちとの比較になっている。ただし本文では固有名を補わず、原文の指示表現を保った。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。原文の対比と理由を示す構造を保ち、過度に古風な「愚かさが露見する」などは避けた。
