id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: ja
  text: また、アンティオキア、イコニオン、リストラで私に起こったような迫害と苦しみ、私が耐えたどれほどの迫害、そして主がそれらすべてから私を救い出してくださったことについても。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: 迫害
  rationale: 信仰や宣教のゆえに受ける敵対的な圧迫を表す、この文脈で自然かつ定着した訳語。反復も原文どおり保った。
- source_word: παθήμασιν
  choice: 苦しみ
  rationale: 外的な苦難だけに限定されない、苦痛を伴う経験全般を表すため、広がりのある訳語とした。
- source_word: οἷά μοι ἐγένετο
  choice: 私が…経験したような
  rationale: 直前の迫害と苦しみについて具体例を挙げる οἷα の働きを、自然な現代日本語で示した。
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: アンティオキア、イコニオン、リストラで
  rationale: 地名を一般的な日本語表記で音写し、三つの場所を明瞭に列挙した。日本語では格助詞「で」を末尾にまとめて自然な流れとした。
- source_word: οἵους διωγμοὺς
  choice: どれほどの迫害
  rationale: οἵους の質的・感嘆的な力を、迫害の甚だしさを示す「どれほどの」で表した。
- source_word: ὑπήνεγκα
  choice: 耐えた
  rationale: 圧迫の下で持ちこたえるという ὑποφέρω の意味を、簡潔で自然な日本語にした。
- source_word: ἐκ πάντων
  choice: それらすべてから
  rationale: 直前に述べた迫害と苦しみを受け、「すべて」からの救出という原文の包括性を保った。
- source_word: ἐρρύσατο
  choice: 救い出してくださいました
  rationale: 危険から救出する ῥύομαι の具体的な意味を表し、ここで救済論的意味に不必要に限定される「救う」だけの表現を避けた。
- source_word: ὁ κύριος
  choice: 主
  rationale: 原文が名を明記せず称号だけを用いるため、「主」と訳し、指示対象を本文で限定しなかった。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文では「主」とだけ訳す
  alternative: 主イエス
  rationale: パウロ書簡の用法からイエスを指す可能性が高いが、ギリシア語本文は ὁ κύριος とだけ記す。原文の含みを保ち、明記されていない名を本文へ補わない。
translation_notes:
  register: 明瞭で現代的ながら品位ある敬体を採用した。本節は前節から続く列挙の一部なので冒頭を「また」とし、日本語として文を成立させるため、前節の支配動詞に相当する「あなたは知っています」を補った。地名列挙と「迫害」の反復を保ち、結語では救出の具体性を示した。
