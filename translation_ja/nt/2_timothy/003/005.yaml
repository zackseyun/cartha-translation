  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: ja
  text: 敬虔らしい形を備えながら、その力を否定している者たちです。[a] このような人々を避けなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「敬虔の形を持ちながら」。ここでの「形」は、敬虔の外面的な表れや様式を指しうる。
    reason: lexical_alternative
  - marker: b
    text: または「このような人々から離れなさい」。原語には、自ら身をそらして遠ざかるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες μόρφωσιν εὐσεβείας
  choice: 敬虔な生き方をしているように見えながら
  rationale: μόρφωσις は形・外形・表れを指し得る。日本語で「敬虔の形を持つ」とすると不自然なため、外面的には敬虔に見えるという対比を自然に表した。εὐσέβεια は神に向けられた敬虔さと、それにかなう生活を含む。
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: その力を
  rationale: αὐτῆς が直前の「敬虔」を受ける構造を保ち、「力」が何を指すかを奇跡、道徳的変化、聖霊の働きなどに限定しない。δέ の対照は「ながら」で表した。
- source_word: ἠρνημένοι
  choice: 否定している
  rationale: 完了分詞が示す、否定した結果として現在も続く確定的な態度を、自然な現代日本語で表現した。単なる一時的行為よりも継続的な姿勢を示す。
- source_word: καὶ τούτους ἀποτρέπου
  choice: このような人々を避けなさい
  rationale: ἀποτρέπου は自ら身をそらす、遠ざかる、避けるという現在中動態命令。日本語では「避けなさい」が簡潔で自然であり、τούτους の複数の人物指示も明示できる。
theological_decisions:
- issue: 外面的な敬虔と、その実効的な力との対比
  choice: 外見上は敬虔な生き方をしているようでありながら、その力を否定しているという対比を保った。
  alternative: 「敬虔の形を持ちながら」「信心深そうに見えながら」
  rationale: 「力」を奇跡、人格の変化、聖霊の働きのいずれか一つに限定せず、原文の幅と神学的緊張を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令の厳粛さは保った。「敬虔」はやや改まった語だが、εὐσέβεια の神に向けられた生活態度を簡潔に示すため採用し、「な生き方」を添えて一般読者に分かりやすくした。
