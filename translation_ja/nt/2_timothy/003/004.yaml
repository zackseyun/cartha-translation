lexical_decisions:
- source_word: προδόται
  choice: 人を裏切り
  rationale: 忠実であるべき相手を裏切る者を指す。前後の列挙と自然につながるよう、現代日本語の動詞表現とした。
- source_word: προπετεῖς
  choice: 向こう見ずで
  rationale: 衝動的に突き進み、結果を顧みない性質を表す。「軽率」より強い危うさを明瞭に伝える。
- source_word: τετυφωμένοι
  choice: 思い上がり
  rationale: 高慢になり、うぬぼれた状態を表す完了受動分詞。日本語では比喩を直訳するよりも、その意味を自然かつ簡潔に示した。
- source_word: φιλήδονοι
  choice: 快楽を愛する者
  rationale: 「快楽」と「愛する」の両要素を示し、後続の「神を愛する」との対句を保つ。
- source_word: μᾶλλον ἢ
  choice: よりも
  rationale: 二つの愛の向かう先を比較し、神より快楽を優先する意味を、原文の比較表現を保って示す。
- source_word: φιλόθεοι
  choice: 神を愛する者
  rationale: 複合語の意味を明示し、「快楽を愛する者」との修辞的な対応を保つ。
theological_decisions:
- issue: 快楽への愛と神への愛の対比
  choice: 「神を愛するよりも快楽を愛する者」と比較表現で訳す。
  alternative: 「神を愛さず、快楽を愛する者」
  rationale: μᾶλλον ἢ は比較・選好を表し、必ずしも神への愛が完全に皆無だと断定する形ではない。原文の緊張と対句を保つ。
- issue: τετυφωμένοι の比喩と意味
  choice: 本文では「思い上がり」と意味を自然に示し、直訳的な像を脚注に置く。
  alternative: 「膨れ上がり」
  rationale: 原語の比喩を脚注で保存しつつ、本文を普通の現代日本語として明瞭にする。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある列挙表現とした。前節から続く文であるため、各形容語を「者」として個別に名詞化せず、最後の「者となります」にまとめた。脚注記号は対応する語の直後に配置した。
