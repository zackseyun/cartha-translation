reference: 2 Timothy 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: ja
  text: というのも、人々は自分を愛する者、金を愛する者、大言壮語する者、高慢な者、そしる者[a]、親に従わない者、恩を知らない者、神聖なものを重んじない者となるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神を冒瀆する者」または「人をそしる者」「暴言を吐く者」。ギリシア語は、人または神の名誉を傷つける発言を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ～者となる
  rationale: 未来形の連結的意味を、悪徳の性質が人々に現れることを示す自然な日本語で表した。
- source_word: γὰρ
  choice: というのも～からです
  rationale: 前節の説明を導く接続機能を明示しつつ、現代日本語として自然な文型にした。
- source_word: οἱ ἄνθρωποι
  choice: 人々
  rationale: 男性だけに限定されない、人間一般を指す総称として訳した。
- source_word: φίλαυτοι
  choice: 自分を愛する者
  rationale: 利己的な自己愛を表す語であり、続く「金を愛する者」との原文の並行を保った。
- source_word: φιλάργυροι
  choice: 金を愛する者
  rationale: 文字どおりの「銀・金銭を愛する」という意味を保ち、単に「貪欲」と一般化しなかった。
- source_word: ἀλαζόνες
  choice: 大言壮語する者
  rationale: 自分を誇示して大きなことを言う、虚勢を伴う自慢の意味を表した。
- source_word: ὑπερήφανοι
  choice: 高慢な者
  rationale: 他者を見下す否定的な誇り・傲慢さを、簡潔で格調ある日本語にした。
- source_word: βλάσφημοι
  choice: 人をそしる者
  rationale: 人または神の名誉を傷つける発言を指し得る語である。本文では悪徳表の対人的な読みを採り、意味の広がりを脚注に残した。
- source_word: γονεῦσιν ἀπειθεῖς
  choice: 親に従わない者
  rationale: 与格の「親に」と、不服従を表す形容詞の意味を自然かつ直接的に訳した。
- source_word: ἀχάριστοι
  choice: 恩を知らない者
  rationale: 感謝を欠く状態を、悪徳表の人物類型として自然な日本語で表した。
- source_word: ἀνόσιοι
  choice: 神聖なものを重んじない者
  rationale: 神や聖なるものへの敬虔さを欠く意味を明確にし、「不浄」など儀礼的意味への不要な限定を避けた。
theological_decisions:
- issue: οἱ ἄνθρωποι の総称的範囲
  choice: 人々
  alternative: 男たち／人間
  rationale: 文法上は男性複数形だが、ここでは男性だけでなく人間一般を指すため、性別を限定しない「人々」とした。
- issue: βλάσφημοι の対象
  choice: 人をそしる者
  alternative: 神を冒瀆する者／暴言を吐く者
  rationale: この語は人への中傷にも神への冒瀆にも用いられる。本文では文脈上自然な対人的意味を示しつつ、対象を一方に確定し切れない語義上の幅を脚注で明記した。
- issue: ἀνόσιοι の宗教的・倫理的含意
  choice: 神聖なものを重んじない者
  alternative: 不敬虔な者／聖なるものを汚す者
  rationale: 敬虔さや聖なるものへの尊重の欠如を示すが、特定の儀礼行為や教派的な聖性理解に狭めない表現を選んだ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の悪徳表の反復とリズムを「～者」でそろえた。冒頭の γὰρ は前節との説明関係が分かるよう「というのも～からです」とした。
