  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: ja
  text: ヤンネとヤンブレがモーセに逆らった[a]のと同じように、この者たちも真理に逆らっています。彼らは思いが腐敗し、信仰[b]について不適格な者たちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「モーセに抵抗した」とも訳せる。後半も「真理に抵抗しています」と訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここでの「信仰」は、単なる個人的な信頼ではなく、キリスト教信仰または使徒たちが伝えた教えを指す可能性が高い。
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: 〜のと同じように
  rationale: 比較を導く表現を自然な現代日本語で示す。δὲは軽い展開を表すが、文脈上、日本語で接続語を明示しなくても流れが保たれる。
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: ヤンネとヤンブレ
  rationale: ギリシア語の人名を、日本語聖書で理解しやすい慣用的な形に音写した。
- source_word: ἀντέστησαν Μωϋσεῖ / ἀνθίστανται τῇ ἀληθείᾳ
  choice: モーセに逆らった／真理に逆らっています
  rationale: 同じ語根を持つ二つの動詞の対応を同一表現で保ち、前者の過去と後者の継続的な現在も示した。
- source_word: οὕτως καὶ οὗτοι
  choice: この者たちも
  rationale: 直前まで論じられている特定の人々を指す指示表現と、比較に伴う「も」を明確にした。
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: 彼らは心が腐敗し
  rationale: 完了受動分詞が表す、腐敗した結果としての状態を簡潔に表現した。νοῦςはここで思考・理解・判断を含む内面を指すため「心」とした。
- source_word: ἀδόκιμοι
  choice: 失格とされた者たち
  rationale: 試験に耐えず、承認されないという評価的意味を保つ。「不適格」よりも平明で、受け入れられない状態を示す。
- source_word: περὶ τὴν πίστιν
  choice: 信仰に関しては
  rationale: περίの関連・領域の意味を示す。「信仰」が個人的な信頼か、キリスト教信仰・使徒的教えかは本文で限定しない。
theological_decisions:
- issue: 「真理」と「信仰」の指示内容
  choice: 本文では「真理」「信仰」と広く訳し、意味を限定しない。
  alternative: 「福音の真理」「キリスト教の教え」と明示する、または「信仰」を個人的な信頼と解する。
  rationale: 文脈上は使徒的な福音とキリスト教信仰を指す可能性が高いが、ギリシア語自体の幅と神学的緊張を保持する。
- issue: ἄνθρωποιの指示対象
  choice: 「彼ら」「者たち」として、文脈上の特定集団を指す。
  alternative: 「人々」または性別を明示する「男たち」。
  rationale: ギリシア語ἄνθρωποιは文法上男性複数形だが、それ自体は必ずしも生物学的男性を明示しない。日本語では指示対象を自然に示し、本文以上の性別限定を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。比較構文と二つの「逆らう」の対応を保った。脚注記号は該当箇所に配置し、[b]は「信仰」の意味を説明するため文末に置いた。
