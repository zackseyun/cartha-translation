source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: ja
  text: それは、神の人[b]が十分に整った者となり、あらゆる良い働きに十分に備えられた者となるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あらゆる良い働きのために十分に備えられた」とも訳せます。ἐξηρτισμένοςは、必要なものを備えられ、十分に準備された状態を表します。
    reason: lexical_alternative
  - marker: b
    text: 「神の人」はギリシア語では男性単数で、聖書で用いられてきた称号です。ここでは特に神に仕える者を指す可能性がありますが、聖書によって形づくられる信者にも広く当てはまります。
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためです
  rationale: 前節を受ける目的を明示しつつ、現代日本語として自然な目的節にした。
- source_word: ἄρτιος
  choice: 十分に整えられ
  rationale: 必要な資質が欠けず、適任であるという意味を表す。「完全」は無欠や罪のなさを連想させうるため避けた。
- source_word: ᾖ
  choice: ……者となる
  rationale: ἵναに続く接続法の目的的な意味を、日本語の「ためです」で表した。
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: 神の人
  rationale: 旧約以来の聖書的な称号を保つ自然な定訳。ギリシア語の男性単数形と、文脈上まず神に仕える者を指しうる点も注で示す。
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: あらゆる良い働きのために
  rationale: πρὸςの目的・適合の意味と、πᾶνの包括性を保った。
- source_word: ἐξηρτισμένος
  choice: すっかり備えられた
  rationale: 完了受動分詞が示す、十分な準備や装備を施された状態を明確に表した。ἄρτιοςとの語感上の連関も「整えられ／備えられ」で保持した。
theological_decisions:
- issue: ὁ τοῦ θεοῦ ἄνθρωπος の性と適用範囲
  choice: 神の人
  alternative: 神に属する人
  rationale: 原文は男性単数で、聖書における称号としての響きを持つため「神の人」とした。ただし、ここでは特に神に仕える者を念頭に置く可能性と、聖書によって形づくられる信者に広く当てはまる可能性の双方を注で保った。
- issue: ἄρτιος と ἐξηρτισμένος の関係
  choice: 十分に整えられ……すっかり備えられた
  alternative: 完全な者となり……備えられる
  rationale: 二語の意味の重なりを消さず、同時に道徳的・霊的な無欠性を断定する訳を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「神の人」は聖書的表現として保持し、意味範囲を脚注で説明した。二つの関連語ἄρτιος／ἐξηρτισμένοςは「整えられ／備えられ」と訳し分け、原文の反復的な強調を残した。
