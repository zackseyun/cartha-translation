id: 2TI.3.15
reference: 2 Timothy 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: ja
  text: あなたはまた、乳幼児のころから聖なる書物[a]を知っています。それらは、メシア・イエスに対する信仰を通して[b]、あなたに救いに至る知恵を与えることができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖書」。ギリシア語では字義的に「聖なる書物」。
    reason: lexical_alternative
  - marker: b
    text: πίστιςを「真実さ」と理解し、「メシア・イエスにある真実さを通して」と訳すこともできる。ただし、ここでは「メシア・イエスに対する信仰を通して」という意味がより自然。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: 幼い時から
  rationale: βρέφοςは乳児を含むごく幼い子どもを指す。日本語では「乳児の時から」より自然で、一般的な「子どもの時から」より原文の強い意味を保つ。
- source_word: ἱερὰ γράμματα
  choice: 聖なる書物
  rationale: 字義的な「神聖な書かれたもの」に近く、ここでテモテが学んだ聖書文書を指す。「聖書」という定着した訳語も脚注に残す。
- source_word: οἶδας
  choice: 知っている
  rationale: 形は完了形だが現在の意味を持つ。ἀπὸ βρέφουςとの組み合わせにより、幼い時から今まで続く知識が自然に表される。
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: 救いに至る知恵をあなたに与えることができます
  rationale: σοφίζωの「賢くする、知恵を授ける」を自然な現代日本語で表し、主語が「聖なる書物」であることも明確にした。
- source_word: εἰς σωτηρίαν
  choice: 救いに至る
  rationale: εἰςの目標・結果の方向性を明示する。
- source_word: διὰ πίστεως
  choice: 信仰によって
  rationale: この文脈ではπίστιςの通常の意味である「信仰」が適切で、διάの手段を「によって」で示す。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスに対する
  rationale: Χριστόςを称号として「メシア」と訳し、πίστιςに伴うἐνを日本語で自然な信仰の対象として表した。
theological_decisions:
- issue: Χριστῷを称号として訳すか、固有名の一部のように訳すか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: Χριστόςの称号としての意味を読者に伝えるため「メシア」を採用した。
- issue: διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦにおけるπίστεωςの意味
  choice: メシア・イエスに対する信仰によって
  alternative: メシア・イエスの真実さによって
  rationale: 属格ではなくἐνを伴うこの構文では、イエスを対象・領域とする信仰がより自然。ただしπίστιςが「真実さ」を表す可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖なる書物」で原文の非専門的な複数表現を保ち、「救いに至る知恵を与える」で日本語として自然にした。すべての脚注記号を本文に配置した。
