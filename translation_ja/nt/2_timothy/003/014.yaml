source:
  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: ja
  text: しかし、あなたは、学び、確信するに至った[a]事柄にとどまりなさい。誰から[b]それを学んだのかを知っているのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「確かなものと認めた」。
    reason: lexical_alternative
  - marker: b
    text: 「誰から」に当たる語は、ここで採用した本文では複数形。一部の写本は単数形で、しばしばパウロ一人を指すと理解される。複数形は、テモテを教えた複数の人々を指し得る。
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
  choice: しかし、あなたは
  rationale: 明示された代名詞の強調と、直前に述べられた人々との対比を、現代日本語で自然に示す。
- source_word: μένε ἐν οἷς
  choice: ことにとどまりなさい
  rationale: 現在命令形が表す継続的な堅持と、ἐν の領域的な比喩を保つ。「歩み続けなさい」などと解釈を加えない。
- source_word: ἔμαθες
  choice: 学び
  rationale: テモテが以前に教えを受けたことを、簡潔で自然な表現にする。
- source_word: ἐπιστώθης
  choice: 確信するに至った
  rationale: 受動形が示す、確かなものとして受け入れるに至った結果を表す。「委ねられた」という文脈上可能性の低い意味は採らない。
- source_word: εἰδὼς
  choice: 知っているのですから
  rationale: 分詞の状況的・理由的なつながりを、日本語として自然に表す。理由の含みは示すが、教師の具体的な身元は補わない。
- source_word: παρὰ τίνων
  choice: 誰から
  rationale: παρά＋属格の出所を表す意味を簡潔に訳す。ギリシア語本文では複数形だが、日本語の「誰から」は人数を限定せず、指示対象の開放性を保てる。
- source_word: ἔμαθες（反復）
  choice: それを学んだ
  rationale: 「それを」は前半の学び確信した内容を受け、原文で反復される動詞を日本語で明瞭にする。
theological_decisions:
- issue: παρὰ τίνων が指す教師
  choice: 本文では「誰から」とし、教師を特定しない
  alternative: パウロ、またはパウロに加えてテモテの母や祖母などを明示する
  rationale: この節自体は教師の身元を明示していない。SBLGNTの複数形を踏まえつつ、特定の人物に狭める解釈を本文へ持ち込まない。
- issue: ἐπιστώθης の意味
  choice: 教えの真実性を確信するに至ったことを表す
  alternative: 教えを委ねられたと解する
  rationale: ἔμαθες と並び、同じ内容を受ける文脈では、確信・確証の意味が最も自然である。ただし受動形の含みを「するに至った」で残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令の厳粛さを保った。「とどまりなさい」により原文の継続性と領域の比喩を残し、教師の具体名は補っていない。脚注記号は本文で意味に対応する箇所に配置した。
