id: 2TI.2.7
reference: 2 Timothy 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: ja
  text: 私の言っていることをよく考えなさい[a]。主[b]が、すべてのことについてあなたに理解を与えてくださるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の言うことを理解しなさい」。この動詞には「考える」と「理解する」の両方の意味合いがあります。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では単に「主」とあり、主イエスを指すのか、より一般的に神を指すのかは明示されていません。
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: よく考えなさい
  rationale: 現在命令形が求める継続的・能動的な思考を、自然な現代日本語で表す。「理解しなさい」の意味もあり得るが、後半で主が理解を与えると約束される流れを考慮し、ここでは熟考への勧めとして訳した。
- source_word: ὃ λέγω
  choice: 私の言っていること
  rationale: 関係代名詞ὃはパウロの発言内容を指し、現在形λέγωは当面の教えを表す。日本語として自然な連体表現にした。
- source_word: δώσει
  choice: 与えてくださる
  rationale: 未来形が表す約束を「与えてくださる」と訳した。敬語は主の行為に対する日本語として自然な敬意を示すものであり、意味を「授ける」などに狭めない。
- source_word: γάρ
  choice: からです
  rationale: 前半の命令の根拠を示す接続関係を、文末の理由表現で明確にした。
- source_word: ὁ κύριος
  choice: 主
  rationale: 定冠詞付きκύριοςを聖書日本語として自然な「主」とし、イエスか神かを訳文で特定しない。
- source_word: σύνεσιν
  choice: 理解
  rationale: 内容を把握する力や洞察を広く表す語として、明快で過度に専門的でない「理解」を選んだ。
- source_word: ἐν πᾶσιν
  choice: すべてのことについて
  rationale: 句の包括的な範囲を保ちつつ、「理解」と自然につながる表現にした。文脈上の教えだけに限定しない。
theological_decisions:
- issue: 「主」（ὁ κύριος）が具体的に誰を指すか
  choice: 「主」とだけ訳し、指示対象を特定しない。
  alternative: 「主イエス」または「神」と明示する。
  rationale: ギリシア語本文はκύριος以上の限定を置いていない。パウロ書簡ではイエスを指すことが多い一方、ここで訳文が曖昧さを解消するだけの明示的根拠はないため、原文の神学的余地を保った。
translation_notes:
  register: 明快で現代的ながら dignified な標準日本語。「よく考えなさい」で勧告の力を保ち、後半は理由を示す「からです」で論理関係を明示した。「あなたに」は原文のσοιを保持している。
