  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: ja
  text: 反対する人たちを柔和に教え導きなさい。[a]あるいは神が、彼らに真理を十分に知るに至るための悔い改めを与えてくださるかもしれません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「反対の立場を取る人たち」。誰に、または何に反対するのかはギリシア語本文には明示されていません。文脈上は、主の僕とその教えに反対する人々を指します。
    reason: lexical_alternative
  - marker: b
    text: 「ひょっとすると、神が彼らに悔い改めを与えてくださるかもしれません」とも訳せます。原文は可能性を慎重に表しています。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: 柔和な心で
  rationale: 行為の仕方を表す句。「柔和」は単なる弱さではなく、穏やかで節度ある態度を示し、「心で」を添えて自然な現代日本語とした。
- source_word: παιδεύοντα
  choice: 正しなさい
  rationale: この文脈では、処罰よりも教え導くことを伴う是正を表す。前節から続く主の僕への命令として訳した。
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: 反対する人たち
  rationale: 分詞は反対の立場を取る人々を指す。目的語はギリシア語本文に明示されていないため、日本語でも補わず、文脈に委ねた。
- source_word: μήποτε
  choice: もしかすると……かもしれません
  rationale: 神が悔い改めを与える可能性についての慎重な表現を保つ。目的・懸念の含みもあり得るが、ここでは自然な日本語で不確定性を示した。
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: 神がその人たちに……与え……くださる
  rationale: 神を悔い改めの授与者として明示し、接続法と μήποτε が示す可能性を「かもしれません」で保持した。
- source_word: μετάνοιαν
  choice: 悔い改め
  rationale: 単なる知的な意見変更に狭めず、心と思いの転換を含む新約聖書上の意味に対応する定着した訳語を採用した。
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: 真理を深く知るように
  rationale: εἰς の目標・結果の方向性を「ように」で示し、ἐπίγνωσις の十分な認識という含みを「深く知る」で表した。
theological_decisions:
- issue: 神の働きと人の悔い改め
  choice: 悔い改めを神が与えるものとして訳しつつ、「もしかすると……かもしれません」によって本文の慎重な表現を保った。
  alternative: 人間の自発的な悔い改めだけを前面に出す訳、または神の授与を無条件・決定論的に断定する訳。
  rationale: 本文は神を悔い改めの授与者としているが、神の主権と人間の応答との関係を体系的には説明していないため、その緊張を解消しない。
- issue: 悔い改めと真理の認識との関係
  choice: 神が悔い改めを与え、その結果または目標として真理を深く知るようになる、という流れを示した。
  alternative: εἰς を純粋な目的のみ、または純粋な結果のみに限定する訳。
  rationale: εἰς は目標と結果の双方を含み得るため、「ように」により一方へ過度に限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く分詞を日本語の命令文として処理した。「柔和な心」「悔い改め」は聖書語として定着している一方、普通の読者にも理解できる表現である。
