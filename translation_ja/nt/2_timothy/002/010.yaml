id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: ja
  text: ですから、私は選ばれた人々[a]のために、すべてのことを耐え忍んでいます。それは、彼らもまた、メシアであるイエス[b]にある救いを、永遠の栄光とともに得るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「選ばれた者たち」。ギリシア語は ἐκλεκτούς。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「キリスト・イエス」。ここでは「キリスト」を称号として訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 直前の文脈を、パウロが耐え忍ぶ理由として受ける表現。現代日本語で自然な因果関係を示す。
- source_word: πάντα ὑπομένω
  choice: すべてのことを耐え忍んでいます
  rationale: πάνταの包括性と、ὑπομένωが表す苦難の下での堅忍をともに保つ。
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: 選ばれた人々のために
  rationale: διά＋対格の受益・目的の意味を「ために」で表し、ἐκλεκτούςの選びの語義を教派的に説明しすぎず保持する。
- source_word: καὶ αὐτοὶ
  choice: 彼らもまた
  rationale: καίの付加的意味とαὐτοίの強調を、過度に重くならない日本語で示す。
- source_word: σωτηρίας τύχωσιν
  choice: 救いを得る
  rationale: τυγχάνω＋属格の「獲得する、あずかる」という意味を明瞭に表す。目的節なので「得るため」とした。
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにある
  rationale: 前置詞ἐνのパウロ的な結合・領域の表現を「にある」で保持し、Χριστόςを意味のある称号「メシア」として訳す。
- source_word: μετὰ δόξης αἰωνίου
  choice: 永遠の栄光とともに
  rationale: μετά＋属格の随伴を明示し、救いに永遠の栄光が伴うことを自然な日本語で示す。
theological_decisions:
- issue: ἐκλεκτούςの訳し方
  choice: 選ばれた人々
  alternative: 選民
  rationale: 原語の「選ばれた者たち」という意味を保ちつつ、「選民」が日本語で帯びうる民族的・体系神学的な含意を不必要に持ち込まない。
- issue: Χριστῷを称号として訳すか、慣用的名称として表記するか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςの称号としての意味を明示する。慣用訳も注記し、名称化の度合いに関する判断を読者に隠さない。
- issue: μετὰ δόξης αἰωνίουの統語的関係
  choice: 救いに伴うものとして訳す
  alternative: 「得る」に直接結びつけて『永遠の栄光を伴って得る』と読む
  rationale: 語順と意味から、永遠の栄光は救いに伴うものと理解するのが自然。ただし日本語では「救いを、永遠の栄光とともに得る」とし、原文の結びつきの幅を狭めすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「耐え忍ぶ」「にある」は聖書的概念を保つために用いるが、文全体は一般読者にも理解できる構文とした。
