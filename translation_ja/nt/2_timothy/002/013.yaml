  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: ja
  text: 私たちが信実でなくても[a]、その方は信実であり続ける[b]。ご自分を否むことはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私たちが信じなくても」「私たちが不忠実であっても」。ギリシア語の動詞には、どちらの意味もあり得る。
    reason: lexical_alternative
  - marker: b
    text: または「信頼できる方であり続ける」。「信実」は、前半の「信実でない」との対照を保つために用いた。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: 私たちが信実でなくても
  rationale: ἀπιστέωには「信じない」と「不忠実である」の両義があり得る。「信実でない」はやや凝縮された表現だが、どちらか一方に限定せず、続く πιστός との対照も保つ。εἰ はここでは「ても」とし、格言的な譲歩の流れを自然に表した。
- source_word: πιστὸς
  choice: 信実であり続ける
  rationale: πιστόςは「忠実な」「信頼できる」の意を持つ。「信実」とすることで、ἀπιστοῦμενとの語義上の対照と、揺るがない確かさの両方を保った。
- source_word: μένει
  choice: あり続ける
  rationale: 継続する状態を、現代日本語として自然かつ明確に表す。
- source_word: ἀρνήσασθαι
  choice: 否む
  rationale: 単なる言語上の否定に限らず、関係的・人格的な強さを持つἀρνέομαιを簡潔に表す。「否定する」よりも原語の幅を保つ。
- source_word: ἑαυτὸν
  choice: ご自分を
  rationale: 主語である「この方」自身を指す再帰代名詞として訳し、自己の本質との一致を明示する。
- source_word: οὐ δύναται
  choice: できない
  rationale: 単なる不意志ではなく不可能であることを、簡潔で自然な日本語で表す。
theological_decisions:
- issue: 人間の不信実に対する「この方」の信実の意味
  choice: この方はご自分を否むことができず、信実であり続ける、とだけ述べる。
  alternative: 弱い者を救い続けることを主に指す、または背教への裁きを含むご自身の言葉への忠実さを主に指す、と限定する。
  rationale: ギリシア語本文は神的な不変の信実を断言するが、それがここで救い、約束の履行、警告に基づく裁きのどれに重点を置くかを明示しない。本文ではその神学的緊張を解消しない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「信実」は日常語よりやや聖書的だが、原文のἀπιστέωとπιστόςの対照および意味の幅を一語で保つために採用した。「この方」はἐκεῖνοςの指示と強調を自然に示し、「ご自分」は敬意を保ちつつ再帰関係を明確にする。
