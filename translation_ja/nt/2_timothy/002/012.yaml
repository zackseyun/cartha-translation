  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: ja
  text: もし私たちが耐え忍ぶなら、彼とともに王として治めることになる。もし彼を否認するなら、彼も私たちを否認する。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένομεν
  choice: 耐え忍ぶ
  rationale: 試練や苦難のもとで堅く持ちこたえる意味を、簡潔で自然な現代日本語で表す。
- source_word: συμβασιλεύσομεν
  choice: 彼とともに王として治めるようになる
  rationale: 「ともに王として治める」という複合動詞の王権的イメージを明示し、未来の意味を自然な日本語で表した。文脈上、ともに治める相手はキリストであるが、原文同様に代名詞で示した。
- source_word: ἀρνησόμεθα
  choice: 彼を拒む
  rationale: ここでは単なる発言内容の否定ではなく、人物を認めず退ける意味があるため、「拒む」とした。後半でも同じ訳語を用いて反復を保つ。
- source_word: κἀκεῖνος
  choice: 彼も
  rationale: καὶ ἐκεῖνοςの相応関係を、自然で簡潔な「彼も」で表す。
- source_word: ἀρνήσεται ἡμᾶς
  choice: 私たちを拒む
  rationale: 前半と同じ動詞を同じ「拒む」で訳し、警告の対句性と修辞的な力を保持する。
theological_decisions:
- issue: 第二の条件節における警告の性質
  choice: 「もし彼を拒むなら、彼も私たちを拒む」と現実の警告として率直に訳す。
  alternative: 報いの喪失だけを指すと限定する、または実際性のない仮定として解する。
  rationale: ギリシア語は均衡した条件文として厳しい相応関係を述べている。背教、聖徒の堅忍、報いをめぐる議論を訳文で決着させず、本文の神学的緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「耐え忍ぶ」は聖書的文体としても一般読者に理解可能。「王として治める」はσυμβασιλεύωの共同統治と王権の含意を自然に伝える。
