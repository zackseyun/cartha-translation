  rationale: 能動動詞ἀρέσῃに対応して「徴募した者を喜ばせる」と改めた。「軍務に就いている者」は、継続中の兵士の勤務を明確にしつつ、「兵役」が帯び得る制度固有の含みを避ける。脚注はπραγματείαιの代替的な軍民対比を自然な日本語で示した。
