review_pass:
  verdict: revise
  source_fidelity: 原文は「兵士として勤務している者」が「生活上の諸活動」に絡め取られず、その目的が「自分を徴募した者を喜ばせる」ことにある、という軍事的比喩である。草案の軍務と日常生活の対比は適切だが、「喜ばれる」は受け身となり、ἀρέσῃ（「喜ばせる」）の能動的意味を変えている。
  naturalness: 「兵役に就いている者」も理解可能だが、「軍務に就いている者」のほうが、徴兵制度を特に連想させず、比喩としても自然である。「自分を兵士として召集した方」はやや不自然で、「自分を兵士として徴募した者」のほうが簡潔である。
  terminology: στρατευόμενοςの軍事的継続性を「軍務に就いている者」で保ち、ἐμπλέκεταιの比喩性を「巻き込まれません」で保持する。τῷ στρατολογήσαντιは特定の階級を加えず「徴募した者」とする。「方」は原文にない敬語的ニュアンスを与えるため用いない。
  issues:
  - severity: medium
    issue: 「喜ばれる」が受け身になっている。
    rationale: ἀρέσῃは「（召集・徴募した者を）喜ばせる／その者の意にかなう」という能動の意味である。「喜ばれるため」では、誰が誰を喜ばせるのかが原文と逆転・曖昧化する。
  - severity: low
    issue: 「召集した」は στρατολογήσαντι の「徴募する・入隊させる」と完全には一致しない。
    rationale: 「召集」は既に兵籍にある者を招集する意味にもなり得る。「徴募した」は、兵士として集め入れたという語の基本義をより直接に示す。
  revised_text: 軍務に就いている者はだれも、日常生活の事柄に巻き込まれません[a]。自分を兵士として徴募した者を喜ばせるためです。
