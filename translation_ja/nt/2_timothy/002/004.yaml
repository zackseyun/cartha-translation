source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: ja
  text: 軍務に就いている者はだれも、日常生活の事柄に巻き込まれません[a]。自分を兵士として徴募した者を喜ばせるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民間の営みに」。ギリシア語は、軍務と通常の生活上の活動とを対比しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: だれも……ません
  rationale: 否定文と組み合わせ、例外のない「だれ一人として〜ない」という普遍的な意味を自然な現代日本語で表す。
- source_word: στρατευόμενος
  choice: 兵役に就いている者
  rationale: 軍務に従事している継続的な状態を表し、文脈の軍事的比喩を明確に保つ。
- source_word: ἐμπλέκεται
  choice: 巻き込まれません
  rationale: 自由な行動を妨げるほど絡み込むという動詞の比喩的な力を保つ。「関わらない」より原文の強さが伝わる。
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: 日常生活の事柄
  rationale: βίοςが指す通常の暮らし・生計と、πραγματείαιが指す活動や用事を平明に表現する。軍務と民間生活との対比は脚注で示す。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を示す接続詞の働きを、前文との関係が明瞭になる自然な日本語で表す。
- source_word: τῷ στρατολογήσαντι
  choice: 自分を兵士として召集した方
  rationale: 兵を募り軍務に就かせた者を表す完了的な行為を保持し、原文にない具体的な階級を加えない。「方」は目的語となる人物への敬意を示し得るが、比喩上の指示対象を明示しすぎない。
- source_word: ἀρέσῃ
  choice: 喜ばれる
  rationale: 目的節の「その人を喜ばせる／その人に喜ばれる」を自然な日本語で表し、兵士が召集者の意にかなうことを目指す意味を保つ。
theological_decisions:
- issue: 軍事的比喩の範囲
  choice: 兵役、巻き込まれること、召集した者という像をそのまま保つ。
  alternative: 奉仕者が世俗的な事柄を避けるべきだという適用を本文に織り込む。
  rationale: この節自体は軍事的な比喩によって勧告を支えているため、その適用を翻訳段階で限定せず、読者が文脈から理解できるようにする。
- issue: τῷ στρατολογήσαντι の指示対象
  choice: 「自分を兵士として召集した方」と訳し、比喩内の人物を保持する。
  alternative: 「神」または「キリスト」と明示する。
  rationale: 文脈上の神学的含意はあり得るが、この句そのものは召集した者を明示的に名指ししていないため、原文の含みを保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「兵役に就く」「召集する」によって軍事的比喩を一貫させつつ、原文にない教会的・教派的な適用は加えていない。脚注記号[a]は該当句の直後に置いた。
