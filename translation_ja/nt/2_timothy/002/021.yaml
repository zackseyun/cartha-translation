id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: ja
  text: ですから、だれでもこれらのものから自分を清めるなら、その人は尊いことに用いられる器[a]となります。すなわち、聖別され[b]、主人にとって役立ち、あらゆる良い働きのために備えられた器です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「誉れのための器」。
    reason: lexical_alternative
  - marker: b
    text: または「聖なるものとされ」、あるいは「取り分けられ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ですから、……なら
  rationale: οὖνの前文からの推論を「ですから」で、ἐάνの条件を「なら」で表し、両方の機能を自然な日本語で保持した。
- source_word: τις
  choice: だれでも
  rationale: 不定代名詞の一般的・包括的な意味を、性別を限定せず自然に表す。
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: これらのものから自分を清める
  rationale: 再帰性と「～から離して清める」という構造を保った。「これらのもの」は直前の文脈を指すが、その対象を本文で一つに限定しない。
- source_word: σκεῦος εἰς τιμήν
  choice: 尊いことに用いられる器
  rationale: 直前の家庭内の器の比喩を保ちつつ、εἰς τιμήνが示す尊い用途・誉れという意味を分かりやすく表した。より字義的な表現は脚注に示した。
- source_word: ἡγιασμένον
  choice: 聖なるものとされ
  rationale: 完了受動分詞が表す、聖なるものとされた結果の状態を保持し、専門用語に偏らない現代日本語とした。
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: 主人に役立ち
  rationale: 家庭内の器という比喩に沿って、δεσπότηςの所有と権威の含意を「主人」で、εὔχρηστοςを「役立つ」で明瞭に表した。
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: あらゆる良い働きのために備えられた
  rationale: πᾶνの包括性、良い働きへの目的、備えられた状態を自然に保持した。
theological_decisions:
- issue: 「これらのもの」が指す対象
  choice: 指示内容を「これらのもの」のまま保持する
  alternative: 偽りの教えや不名誉な人々など、特定の対象を明示する
  rationale: τούτωνの具体的な指示範囲には文脈上の解釈余地があるため、訳文で一つに決めず原文の曖昧さを残した。
- issue: σκεῦος εἰς τιμήν の意味
  choice: 尊いことに用いられる器
  alternative: 誉れのための器／尊い器
  rationale: 前節の「尊い用途」と「卑しい用途」の対比を反映しつつ、τιμήの「誉れ」という語感も脚注に残した。
- issue: δεσπότης の訳と指示対象
  choice: 主人
  alternative: 主／所有者
  rationale: 神を指す可能性は高いが、家庭と器の比喩における権威者という表現を保ち、明示的な神名・称号へ置き換えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「器」「主人」という家庭の比喩を一貫して維持し、神学用語は必要以上に専門的にならないようにした。条件文の主語は「だれでも」とし、後半は「その人」で受けて自然な日本語とした。
