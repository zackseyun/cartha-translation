  source_fidelity: 原文は「イエス・キリストを心に留めよ」という命令に、復活とダビデ的系譜を表す二つの修飾句、および「私の福音に従って」を添える構文である。草案の「これは、…ことです」は原文にない独立の断定文を加え、κατὰ τὸ εὐαγγέλιόν μουの構文上のつながりを損ねている。
  naturalness: 「私の福音に基づくことです」は日本語としては読めるが、この文脈では唐突である。「私の福音に従って、心に留めておきなさい」と命令に結び付けると、明瞭で自然になる。「よみがえられた」は復活文脈で標準的かつ自然で、ギリシア語の受動形にも対応する。
  terminology: 「イエス・キリスト」は現代日本語で定着した名称・称号表現であり、脚注で「メシア」の訳語可能性を示せる。「ダビデの子孫である」はἐκ σπέρματος Δαυίδの系譜的意味を自然に表す。「子孫として生まれた」よりも、原文に明示されない「生まれた」を前景化しない。
