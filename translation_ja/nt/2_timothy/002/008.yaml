  to: 死者の中からよみがえられ、ダビデの子孫であるイエス・キリスト[a]を、私の福音に従って、心に留めておきなさい。[b]
  rationale: 原文の命令構文を保つため、「私の福音に基づくことです」を命令に係る「私の福音に従って」へ改めた。復活の表現は受動的な形を保ちつつ、現代日本語の復活文脈で自然な「よみがえられ」とした。系譜表現は「生まれた」という補足を避け、「ダビデの子孫である」とした。脚注は各対象語句の直後に対応させた。
