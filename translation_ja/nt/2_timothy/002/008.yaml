  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: ja
  text: 死者の中からよみがえられ、ダビデの子孫であるイエス・キリスト[a]を、私の福音に従って、心に留めておきなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 「ダビデの子孫である」は、直訳では「ダビデの種から」。ダビデからの系譜・出自を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: いつも心に留めなさい
  rationale: 現在命令形が示す継続的な勧めを、自然な現代日本語で表した。「覚えていなさい」も可能だが、単なる記憶ではなく意識し続ける意味を明確にした。
- source_word: Ἰησοῦν Χριστόν
  choice: イエス・キリスト
  rationale: 日本語では「キリスト」が称号として定着しており、原文の名称・称号の形を簡潔に保つ。ダビデとの関係によってメシア的含意も文脈上明らかである。
- source_word: ἐγηγερμένον ἐκ νεκρῶν
  choice: 死者の中からよみがえらされ
  rationale: 完了受動分詞の受動態と、復活した状態が続いている含みを保った。「死者の中から」はἐκ νεκρῶνを明確に反映する。
- source_word: ἐκ σπέρματος Δαυίδ
  choice: ダビデの子孫として生まれた
  rationale: σπέρμαの系譜的意味を自然に表しつつ、ἐκによる出自を示した。単なる所属ではなく、ダビデの血統に属して生まれたことを伝える。
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: これは、私の福音に基づくことです
  rationale: κατάの「〜に従って／〜に基づいて」を保つ。独立した句として自然に読み取れるよう補助語を加えたが、「私の福音」というパウロの表現はそのまま残した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςはここでダビデ系の王という称号的意味を帯びるが、日本語の「イエス・キリスト」も定着した名称・称号であり、原文の簡潔な形を自然に再現できる。「メシア」は意味を明示する有力な別訳として脚注に示す。
- issue: ἐγηγερμένονの受動態
  choice: よみがえらされ
  alternative: よみがえった
  rationale: 原文の完了受動を明示し、イエスが復活させられたという文法的形を保持した。行為者は原文同様、本文中に補わない。
- issue: 「私の福音」の意味
  choice: 私の福音
  alternative: 私が宣べ伝える福音
  rationale: 所有代名詞μουを直接訳し、別個の福音であるとも、単に宣教活動だけを指すとも限定しない。原文の簡潔さと解釈上の余地を保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。現在命令形の継続性を「いつも」で示し、復活の受動態を保持した。系譜表現は日本語として自然にしつつ、字義的表現を脚注に残した。
