source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: ja
  text: その福音のために、私は犯罪者のように扱われ、鎖につながれるほどの苦しみを受けています[a]。しかし、神のことばはつながれていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「その中で」。前節の福音を指し、「その福音ゆえに」とも、「その福音にあって」とも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: その福音のために
  rationale: 関係代名詞の先行詞を前節の「福音」と捉え、ここでは苦難の原因を自然な日本語で表した。ギリシア語には「その中で」という領域の含みもあり得るため、脚注で示した。
- source_word: κακοπαθῶ
  choice: 私は苦しみを受け
  rationale: 継続中の苦難を表す現在形と、困難・苦痛を経験するという動詞の意味を、明瞭で自然な表現にした。
- source_word: μέχρι δεσμῶν
  choice: 鎖につながれるまでになっています
  rationale: μέχριの到達点・程度を「まで」とし、δεσμάの具体的な「鎖」の像を保った。拘禁を指す換喩であるが、後半の「つながれていません」との対照を生かした。
- source_word: ὡς κακοῦργος
  choice: 犯罪者のように
  rationale: 司法的な拘束の文脈で、悪事を行う者・犯罪者として扱われる意味を、現代日本語で明瞭に表した。ὡςの比較・見なしのニュアンスを「ように」で保持した。
- source_word: ἀλλὰ
  choice: しかし
  rationale: パウロが拘束されていることと神のことばが拘束されないこととの強い対照を、格調を保つ標準的な接続詞で示した。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 宣べ伝えられる福音を特に指し得るが、聖書または神のメッセージ全般にも及び得るλόγοςの幅を狭めない定訳的表現とした。
- source_word: οὐ δέδεται
  choice: つながれていません
  rationale: 完了受動形が表す拘束された状態の否定を自然に示し、直前の「鎖につながれる」と語を響かせて修辞的対照を保った。
theological_decisions:
- issue: 「神のことば」の指示範囲
  choice: 「神のことば」とし、福音宣教、聖書、または神のメッセージのいずれかに限定しない。
  alternative: 「福音のことば」または「聖書」
  rationale: 直近の文脈では福音の宣教が中心だが、ὁ λόγος τοῦ θεοῦ自体はより広い。本文の意味の幅と神学的緊張を保持した。
- issue: ἐν ᾧが表す関係
  choice: 本文では前節の福音を受ける原因表現「その福音のために」とした。
  alternative: 「その福音にあって」または「その福音を宣べ伝える中で」
  rationale: 文脈上は福音ゆえの苦難が最も自然だが、ἐνの領域的用法も排除できないため、脚注によって曖昧さを明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「鎖」と「つながれる」の反復によって原文の具体的な比喩と対照を保持した。「御言葉」ではなく一般読者にも読みやすい「神のことば」を採用した。
