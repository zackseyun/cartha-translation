revisions:
- from: その福音のために、私は苦しみを受け、犯罪者のように鎖につながれるまでになっています[a]。しかし、神のことばはつながれていません。
  to: その福音のために、私は犯罪者のように扱われ、鎖につながれるほどの苦しみを受けています[a]。しかし、神のことばはつながれていません。
  rationale: 本文を、犯罪者として実際に断定することなく『犯罪者のように扱われ』とし、ὡςのニュアンスを明確にした。また、現在形κακοπαθῶとμέχρι δεσμῶνの程度・到達点を「鎖につながれるほどの苦しみを受けています」と自然に表現した。脚注ではἐν ᾧの領域的・原因的な幅を保ち、「その福音によって」という不必要に手段的に響く表現は避けた。
