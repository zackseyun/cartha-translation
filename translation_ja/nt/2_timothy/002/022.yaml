id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: ja
  text: しかし、若さに伴う欲望[a]からは逃れなさい。そして、純粋な心から主を呼び求める人々と共に、義[b]、信仰[c]、愛、平和を追い求めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「若者にありがちな情欲」。性的な欲望を含み得ますが、それだけに限らず、若さに特徴的な欲求や衝動を広く指すことができます。
    reason: lexical_alternative
  - marker: b
    text: 「義」は、道徳的な正しさだけでなく、人との関係における正しさや公正を含むことがあります。
    reason: alternative_reading
  - marker: c
    text: または「誠実」「忠実」。この語は文脈により、信仰、信頼、誠実さを表します。
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: 若さに伴う欲望
  rationale: 若者に特徴的な欲求や衝動を広く指し得る表現であり、性的欲望だけに限定しない。
- source_word: φεῦγε
  choice: 逃れなさい
  rationale: 継続的に遠ざかるよう命じる現在命令形の強さと、「追い求める」との鮮明な対照を保つ。
- source_word: δίωκε
  choice: 追い求めなさい
  rationale: 倫理的な善を積極的かつ持続的に求める意味を表し、「逃れなさい」と対をなす。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡における基本的な訳語を用いつつ、正しさや公正という含意は脚注に残す。
- source_word: πίστιν
  choice: 信仰
  rationale: 基本義として自然であり、文脈上可能な「誠実」の意味は脚注で示す。
- source_word: ἀγάπην
  choice: 愛
  rationale: 新約聖書で一貫性があり、この徳目一覧にも自然な訳語である。
- source_word: εἰρήνην
  choice: 平和
  rationale: 個人的な平安に狭めず、人との平和も含み得る語義を保つ。
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: 主を呼び求める人々と共に
  rationale: μετάの共同・交わりの意味と、主に祈り求めるἐπικαλέωの意味を自然な日本語で表す。
- source_word: ἐκ καθαρᾶς καρδίας
  choice: 純粋な心から
  rationale: ἐκが示す内的な源を保ち、偽りのない心から主を呼び求めることを表す。
theological_decisions:
- issue: 「若さに伴う欲望」の範囲
  choice: 若者に特徴的な欲求や衝動を広く指す表現
  alternative: 主として性的な情欲を指す
  rationale: 原文は性的欲望を含み得るが、それだけに限定していない。周囲の文脈も性格と行動全般への勧告であるため、広い意味を保った。
- issue: δικαιοσύνηの訳
  choice: 本文では「義」
  alternative: 「正しさ」または「公正」
  rationale: 神や人との関係における正しさを含む伝統的かつ簡潔な訳語を採用し、倫理的・関係的な幅は脚注で明示した。
- issue: πίστιςの訳
  choice: 本文では「信仰」
  alternative: 「誠実」または「忠実」
  rationale: 「信仰」が基本的な意味として適切だが、徳目一覧では誠実さを指す可能性もあるため、曖昧さを脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、命令の力強さと「逃れる／追い求める」の対照を保持した。「若さに伴う」は対象を性的欲望だけに狭めず、「純粋な心から」は原文の内的な源という含意を保つ。
