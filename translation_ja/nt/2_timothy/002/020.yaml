id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: ja
  text: 大きな家には、金や銀の器だけでなく、木製の器や陶器[a]もあります。そして、あるものは誉れのために、あるものは恥辱のために用いられます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陶器」は、粘土を焼いて作った器を指します。
    reason: cultural_note
  - marker: b
    text: 直訳に近くは「あるものは誉れのため、あるものは恥辱のため」です。「尊い用途に……卑しい用途に」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: 大きな家
  rationale: 家の規模や格式を表し得る表現だが、比喩を限定せず自然に伝えるため「大きな家」とした。
- source_word: σκεύη
  choice: 器
  rationale: 容器、道具、用品などを広く指す語であり、家庭の比喩と後続節とのつながりを保てる「器」を採用した。
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: 金や銀の器
  rationale: 器の材質を表す形容詞なので、現代日本語として自然な材質表現にした。καίは列挙として「や」で表した。
- source_word: ξύλινα καὶ ὀστράκινα
  choice: 木や土の器
  rationale: ξύλιναは木製、ὀστράκιναは焼いた粘土製を指す。「木や土の器」は簡潔で分かりやすく、土器については脚注で補った。
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: あるものは……あるものは……
  rationale: 器の二つの区分を対照させる相関構文を、日本語の反復によって明瞭に表した。
- source_word: εἰς τιμήν
  choice: 誉れのために
  rationale: 抽象名詞τιμήの「誉れ、尊敬」という意味を保ち、単に特別な用途と解釈することを避けた。
- source_word: εἰς ἀτιμίαν
  choice: 恥辱のために
  rationale: ἀτιμίαがτιμήの反対語であることを明示し、「普通の用途」などへ意味を狭めず、修辞的対照を保った。
- source_word: δὲ
  choice: 訳語を明示しない
  rationale: ここでは軽い継続・展開を示す接続辞であり、日本語では段落の流れと文の配置によって十分に伝わるため、強い逆接語を置かなかった。
theological_decisions:
- issue: τιμή／ἀτιμίαを用途として具体化するか、抽象的な誉れ／恥辱として残すか
  choice: 「誉れのために……恥辱のために」とし、抽象名詞の対照を本文に残す
  alternative: 「尊い用途に……卑しい用途に」または「特別な用途に……普通の用途に」
  rationale: 家の器という比喩は用途を含意するが、原文自体は「用途」に相当する名詞を用いていない。次節へ続く倫理的・神学的含みを先取りして限定しないため、原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、家庭の器という比喩と「誉れ／恥辱」の対照を保持した。「あります」と「用いられます」に分け、長い一文を読みやすくした。
