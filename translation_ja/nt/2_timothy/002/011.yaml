  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: ja
  text: 次のことばは信頼できます[a]。もし私たちがキリストとともに死んだのなら[b]、キリストとともに生きるでしょう[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「このことばは真実です」「この言明は信頼できます」。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「ともに死んだのなら」。ギリシア語の複合動詞は、キリストと死をともにすることを含意します。
    reason: lexical_alternative
  - marker: c
    text: 「キリストとともに生きる」は、将来の復活の命、キリストの命への参与、またはその両方を指し得ます。
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: 確かです
  rationale: λόγοςについて、その内容が信頼に値し、確実であることを表す述語形容詞。現代日本語で自然かつ簡潔な定型表現とした。
- source_word: ὁ λόγος
  choice: このことば
  rationale: 牧会書簡に見られる、記憶され伝えられる簡潔な宣言を指す定型句として訳した。「この」により、後続する内容を受ける日本語として自然にした。
- source_word: εἰ γὰρ
  choice: …のなら、…からです
  rationale: εἰの条件とγάρの説明的な働きの双方を保ち、前の「確かです」を後続文が説明する流れを自然な日本語で示した。
- source_word: συναπεθάνομεν
  choice: キリストとともに死んだ
  rationale: συν-が示す共同参与を「ともに」で明示した。相手は文脈上キリストであるため、日本語の明瞭さを優先して固有名を補った。アオリストは単純過去形で表した。
- source_word: καὶ
  choice: …にも
  rationale: 死をともにすることと生をともにすることとの対応を示す付加的な意味を、日本語の「も」で表した。
- source_word: συζήσομεν
  choice: キリストとともに生きることになる
  rationale: συν-によるキリストとの共同の生と、未来形による将来的含意を保った。復活後の生に限定する語は加えていない。
theological_decisions:
- issue: συν-複合動詞が示す共同の相手
  choice: 両方の動詞に「キリストとともに」を明示する。
  alternative: 相手を補わず、「死んだのなら、生きる」とする。
  rationale: 原文には独立した目的語がないが、συν-は他者との共同参与を示し、直前の文脈ではキリストが明確な中心である。日本語では省略すると共同性が失われるため補った。
- issue: キリストとともに生きることの時制的・神学的範囲
  choice: 「生きることになる」と広く訳し、将来性を保ちながらその具体的内容を限定しない。
  alternative: 将来の復活の命だけを指す、または現在の霊的な生だけを指す、と限定する。
  rationale: συζήσομενは未来形であるが、訳文では復活後の生か、キリストの命への参与か、あるいはその両方かを断定せず、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、定型的で賛歌のような簡潔さを保った。「確かです」と丁寧体にし、格調を損なわず一般読者にも理解しやすい表現とした。
