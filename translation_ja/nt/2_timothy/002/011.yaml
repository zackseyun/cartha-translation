  naturalness: 「私たちが…死んだのなら、…生きることにもなるからです」は、文末の「からです」により、何に対する理由なのかが曖昧で、定型句としての簡潔さも損ないます。「次のことばは信頼できます。もし…なら、…生きることになります。」とするのが明瞭で自然です。
