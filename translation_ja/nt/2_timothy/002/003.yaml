  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: ja
  text: メシアであるイエスの立派な兵士として、共に苦しみを受けなさい[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアであるイエスの立派な兵士として、私と共に苦難に耐えなさい」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「キリスト・イエス」。ここでは「キリスト」が称号として用いられているため、その意味を表して「メシアであるイエス」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: 共に苦しみを受けなさい
  rationale: アオリスト能動命令法二人称単数。接頭辞 συν- の共同・参与の含意を「共に」で示し、本文に明示されていない相手を補わずに命令の力を保った。
- source_word: ὡς
  choice: として
  rationale: 兵士という比喩的な立場・あり方を自然な現代日本語で示す。
- source_word: καλὸς
  choice: 立派な
  rationale: 兵士としての称賛に値する資質やふさわしさを表す。日本語では「良い兵士」より自然で格調も保てる。
- source_word: στρατιώτης
  choice: 兵士
  rationale: 通常の語義を保ち、比喩をそのまま訳した。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエスの
  rationale: Χριστός を称号として意味訳し、Ἰησοῦ を固有名として音写した。属格は「の」で兵士との所属関係を示した。
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ の訳し方
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστός がここで称号として機能することを明示しつつ、日本語で称号と固有名の関係が明瞭になる形にした。伝統的な「キリスト・イエス」も可能なため脚注に示した。
- issue: συγκακοπάθησον における共同者の明示
  choice: 共に苦しみを受けなさい
  alternative: 私と共に苦難に耐えなさい
  rationale: συν- は共同参与を含意するが、この節の動詞形自体には「私と」が明示されていない。文脈上パウロを共同者と理解する余地を残し、本文では補わなかった。
translation_notes:
  register: 明瞭で現代的ながら、命令文としての簡潔さと尊厳を保った。「立派な兵士」は καλὸς στρατιώτης の評価的な含意を自然に伝える。句読点前に脚注標識を置き、本文中にすべての標識を明示した。
