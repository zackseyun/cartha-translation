id: 2TI.2.1
reference: 2 Timothy 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: ja
  text: だから、私の子よ、あなたはメシア[a]であるイエスにある恵みにあって、強められなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。ギリシア語のΧριστόςは「油を注がれた者」、すなわち「メシア」を意味する称号です。
    reason: alternative_reading
  - marker: b
    text: 別訳「強くなりなさい」。ここでは、力を自ら生み出すというより、力を受ける含みを表すため「強められなさい」としました。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ
  choice: あなたは
  rationale: 明示された代名詞の強調・対照の働きを保つ。日本語では主題を示す「は」によって自然に表した。
- source_word: οὖν
  choice: だから
  rationale: 前の文脈を受ける推論・移行を、現代日本語で明確かつ自然に示す。
- source_word: τέκνον μου
  choice: 私の子よ
  rationale: τέκνονは性別を限定せず「子」を意味するため、「息子」と狭めず、パウロの親愛を呼びかけの形で表した。
- source_word: ἐνδυναμοῦ
  choice: 強められなさい
  rationale: 現在命令形の中受動態を反映し、自力で強くなるというより、力を受ける含みを保った。
- source_word: ἐν τῇ χάριτι
  choice: 恵みの中で
  rationale: ἐνが持つ領域と手段の重なりを、「によって」と手段だけに限定せずに残した。
- source_word: χάριτι
  choice: 恵み
  rationale: パウロ書簡における神の好意と力を与える働きを表す、自然で定着した訳語。
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにある
  rationale: 恵みがイエスとの結びつきのうちにあることを示す連体構造を保ちつつ、Χριστόςの称号としての意味を明示した。
- source_word: Χριστῷ
  choice: メシアである
  rationale: Χριστόςを単なる固有名の一部としてではなく、「油注がれた者」という称号の意味を伝える「メシア」として訳した。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 日本語で定着した人名表記を用いた。
theological_decisions:
- issue: ἐνδυναμοῦにおける態と力の主体
  choice: 「強められなさい」とし、力が与えられる受容的な含みを示す。
  alternative: 「強くなりなさい」または「自らを強くしなさい」
  rationale: 中受動態は受動的な理解を自然に許し、続く「恵みの中で」ともよく結びつく。力の究極的主体を本文以上に明記はしない。
- issue: Χριστόςの訳し方
  choice: 「メシアであるイエス」
  alternative: 「キリスト・イエス」
  rationale: 称号の意味を現代の読者に伝えつつ、Χριστόςがイエスを指す称号であることを自然な日本語で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。呼びかけの親愛、明示された「あなた」の強調、受動的な力の授与、ἐνの領域的な含みを保った。「メシア・イエス」という不自然になりやすい直結形を避け、「メシアであるイエス」とした。
