  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: ja
  text: 彼らは真理からそれてしまい[a]、「復活はすでに起こった」と言って[b]、ある人々の信仰を覆している[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「真理について的を外した」。または「真理から迷い出てしまい」。
    reason: lexical_alternative
  - marker: b
    text: すなわち、将来の復活がすでに過ぎ去った出来事だと主張していた。
    reason: cross_reference
  - marker: c
    text: または「ある人々の信仰を動揺させている」「ある人々の信仰を損なっている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 彼らは
  rationale: 前節の偽教師たちを受ける関係代名詞。日本語では独立した主題として受けるのが自然である。
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: 真理からそれてしまい
  rationale: ἀστοχέωとπερί＋対格の組み合わせは、真理に関して的を外し、そこから逸脱したことを表す。「それる」は比喩を保ちつつ現代日本語として自然である。
- source_word: λέγοντες
  choice: と言って
  rationale: 彼らの逸脱した教えの内容を導く現在分詞として、関係を過度に限定せず簡潔に訳した。
- source_word: ἀνάστασιν
  choice: 復活
  rationale: 無冠詞だが、文脈上は終末の復活を指す。日本語では冠詞を補わず「復活」とすることで、本文以上の説明を加えない。
- source_word: ἤδη γεγονέναι
  choice: すでに起こった
  rationale: 完了不定詞が示す、すでに成立したとの主張を自然に表す。
- source_word: ἀνατρέπουσιν
  choice: 覆している
  rationale: 継続中の作用を表す現在形を反映した。この動詞には倒す、転覆させる、破壊するという強い意味があり、「覆す」は「動揺させる」より原語の力を保つ。
- source_word: τήν τινων πίστιν
  choice: ある人々の信仰
  rationale: τινωνの不定性を「ある人々」で、πίστιςの標準的かつ文脈に適した意味を「信仰」で表した。
theological_decisions:
- issue: 「復活はすでに起こった」の意味
  choice: 偽教師たちの主張をそのまま提示し、終末の復活がすでに起こったとの意味は脚注で簡潔に示す。
  alternative: 霊的復活だけがあるという教説、または将来の身体的復活の否定と明示する。
  rationale: 本文は偽りの教えの内容を報告するが、その体系や仕組みまでは説明していないため、特定の神学的再構成を本文に持ち込まない。
- issue: πίστιςの訳
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: ここでは人々が抱く信仰が偽りの教えによって覆されるという意味が最も自然であり、「信仰」が解釈を狭めすぎない。
- issue: ἀνατρέπουσινの作用の強さ
  choice: 覆している
  alternative: 動揺させている
  rationale: 原語は単なる感情的動揺より強く、倒す、転覆させるという意味を持つ。ただし、救済状態について本文以上の断定はしない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、教会文書としての品位を保った。「それてしまい」は完了した逸脱を自然に示し、「覆している」は現在も続く深刻な影響を表す。引用符で偽教師たちの主張の範囲を明確にした。
