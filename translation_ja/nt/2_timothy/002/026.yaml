  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: ja
  text: 悪魔に生け捕りにされてその意志に従うために捕らえられている彼らが、正気を取り戻し、悪魔のわなから逃れられるようになるかもしれません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: 正気に返り
  rationale: 本来は「酔いからさめる」、そこから「正気を取り戻す」を意味する。欺きから目覚めて明晰さを回復するという文脈上の比喩を、自然な現代日本語で表した。
- source_word: παγίδος
  choice: わな
  rationale: 捕らえるための仕掛けを指し、ここでは悪魔による束縛の比喩である。「わな」は平明でありながら比喩の力を保つ。
- source_word: διαβόλου
  choice: 悪魔
  rationale: この文脈では一般的な「中傷する者」ではなく、サタンを指す称号として用いられている。
- source_word: ἐζωγρημένοι
  choice: 生け捕りにされ
  rationale: ζωγρέωには単に捕らえるだけでなく「生きたまま捕らえる」という具体的な語感がある。完了受動分詞が示す、捕らえられた結果として続く状態も後続の「されていた」で表した。
- source_word: ὑπ’ αὐτοῦ
  choice: 悪魔に
  rationale: 直近の先行詞は「悪魔」である。日本語では「彼に」より指示対象を明示したほうが自然で誤解が少ない。
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: その意志を行わされて
  rationale: 直訳的な「その者の意志のために」は日本語では不明瞭なため、目的・方向を示す εἰς の働きを自然に表した。ἐκείνου の指示対象には議論があるので脚注に別解を示した。
theological_decisions:
- issue: εἰς τὸ ἐκείνου θέλημα における ἐκείνου の指示対象
  choice: 悪魔を指すものとして「その意志を行わされていた」と訳した。
  alternative: ἐκείνου を神と取り、「神の意志を行うために悪魔から逃れる」と理解することもできる。
  rationale: 直前の「悪魔に」が最も近い先行詞であり、悪魔の捕囚状態から逃れるという文の流れにも自然に合う。ただし、代名詞の指示対象は古くから解釈が分かれているため、本文で断定し切らず脚注に別解を保存した。
translation_notes:
  register: 明快な現代標準日本語を用い、悪魔のわなと生け捕りという原文の比喩を保持した。「正気に返る」は日常的に理解できる一方で品位を損なわない表現である。後半は日本語として自然になるよう受動の継続状態を明示し、代名詞の神学的・統語的曖昧さは脚注に残した。
