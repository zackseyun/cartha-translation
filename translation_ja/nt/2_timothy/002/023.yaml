id: 2TI.2.23
reference: 2 Timothy 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: ja
  text: しかし、愚かで無知な議論[a]は退けなさい。それが争いを生み出す[b]ことを知っているのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「問い」または「論争」とも訳せる。ギリシア語は探究や問いを指すこともあるが、ここでは誠実な探究よりも、争いを招く論争的な議論を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「産む」または「もうける」。ここでは、争いを引き起こすことを表す比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: 愚かな
  rationale: 思慮や分別を欠くことを表す語であり、現代日本語として自然で、原語の知的・道徳的な否定性を保つ。
- source_word: ἀπαιδεύτους
  choice: 無知な
  rationale: 訓練や教えを受けていないことを表す。ここでは知的能力そのものより、教えに基づかない性質を指すが、「無知な」が簡潔で自然である。
- source_word: ζητήσεις
  choice: 議論
  rationale: 問いや探究を指すこともあるが、ここでは争いを引き起こす論争的な議論を意味する。語義の幅は脚注に示す。
- source_word: παραιτοῦ
  choice: 退けなさい
  rationale: 関与を断り、避けるよう求める中動態の命令を、簡潔で明確な命令として表す。
- source_word: εἰδὼς
  choice: 知っているのですから
  rationale: 命令の理由を示す分詞の働きを、自然な日本語の理由節として明示する。
- source_word: γεννῶσι
  choice: 生み出す
  rationale: 本来は「産む、もうける」を意味する比喩を保ちながら、争いを引き起こすという意味が自然に伝わる。
- source_word: μάχας
  choice: 争い
  rationale: 身体的な戦いに限定せず、口論や対立を含む文脈上の意味を自然に表す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の勧めとの穏やかな対比を明確に示す。
theological_decisions: []
