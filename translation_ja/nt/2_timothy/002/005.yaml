id: 2TI.2.5
reference: 2 Timothy 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: ja
  text: また、競技をする人も、規則に従って競技をしなければ、栄冠を受けることはできません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正当に」または「定めにかなって」とも訳せる。ここでは、競技の規則に従うことを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: 競技をする／競技をし
  rationale: ἀθλέωが表す運動競技のイメージを明確に保ち、二度の使用も訳文で反復した。
- source_word: τις
  choice: 人
  rationale: 不定代名詞の一般的・代表的な意味を、現代日本語で自然に表した。
- source_word: στεφανοῦται
  choice: 栄冠を受ける
  rationale: 競技の勝者に冠が授けられる比喩を保ちつつ、「冠をかぶせられる」より自然な日本語とした。冠が具体的に何を意味するかは限定していない。
- source_word: νομίμως
  choice: 規則に従って
  rationale: 基本義の「適法に、正当に」を踏まえ、この競技の文脈では競技規則に沿うことを明瞭に表す。語の広がりは脚注に示した。
- source_word: καὶ
  choice: も
  rationale: 前後に並ぶ比喩の一つを追加する機能を、日本語の係助詞で自然に示した。
- source_word: δὲ
  choice: また
  rationale: 別の例へ移る穏やかな接続を表した。
theological_decisions:
- issue: 栄冠の比喩が指すもの
  choice: 競技者が栄冠を受けるという比喩のまま訳し、その霊的意味を特定しない。
  alternative: 終末の報い、または奉仕者としての承認を明示する。
  rationale: 本文は栄冠の具体的な指示対象を説明していないため、特定の神学的解釈を訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「栄冠」は競技上の勝者の冠を自然に想起させる。脚注記号[a]は該当文末に置いた。
