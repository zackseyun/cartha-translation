id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: ja
  text: 主のしもべ[a]は、争ってはならず、むしろ、すべての人に優しく接し、教える力があり、害を受けても忍耐強くなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主の奴隷」とも訳せる。ギリシア語の「ドゥーロス」は、文脈により「しもべ」または「奴隷」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: しもべ
  rationale: 主に仕える者という関係と役割を自然かつ尊厳ある日本語で表す。ギリシア語には「奴隷」の意味もあるため、その語義は脚注で示す。
- source_word: κυρίου
  choice: 主の
  rationale: 属格を自然な所有・帰属表現とし、κύριοςを標準的に「主」と訳す。
- source_word: οὐ δεῖ μάχεσθαι
  choice: 争ってはなりません
  rationale: δεῖの義務的な力を禁止表現で示し、μάχομαιは文脈上、主として論争的・好戦的に振る舞うことを指すため「争う」とした。
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: すべての人に優しく接し
  rationale: ἤπιοςの穏やかで柔和な態度と、πρὸς πάνταςの対人的・普遍的範囲を、自然な日本語で表した。
- source_word: διδακτικόν
  choice: よく教えることができ
  rationale: 単に教える意思があるのではなく、教える力量・適性があることを明示する。「よく」により適切に教えられる含意を補う。
- source_word: ἀνεξίκακον
  choice: ひどい仕打ちにも忍耐し
  rationale: 害や不当な扱いを受けても恨みや報復に走らず耐えるという、稀な形容詞の具体的な意味を明瞭にした。
theological_decisions:
- issue: δοῦλοςを奉仕者への教えの文脈でどう訳すか
  choice: しもべ
  alternative: 奴隷
  rationale: この節の焦点は主への隷属という身分そのものより、主に仕える者に求められる振る舞いにある。「しもべ」はその役割を自然に伝え、「奴隷」という真正な語義は脚注に保存する。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: キリスト教文脈における称号としての意味を保ち、特定の私的解釈を加えない標準的な訳語を採用した。
- issue: ἀνεξίκακοςの倫理的含意
  choice: ひどい仕打ちにも忍耐する
  alternative: 悪を大目に見る
  rationale: 原語は悪そのものを容認することではなく、自分への害や不当な扱いを耐え忍ぶ態度を指すため、誤解を避けて対象を明示した。
translation_notes:
  register: 明瞭な現代標準日本語。教会語として定着した「主」「しもべ」を用いつつ、文全体は一般の読者にも理解できる表現とした。原文の一続きの対比は、日本語で読みやすいよう二文に分けた。脚注標識[a]は、対象語「しもべ」の直後ではなく節末に置いて本文の流れを保った。
