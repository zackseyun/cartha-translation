  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: ja
  text: しかし、神を敬わないむなしい話[a]は避けなさい。彼らはますます不敬虔へと進んでいくからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不敬な空虚なおしゃべり」「神を敬わない中身のない言葉」。
    reason: βέβηλους κενοφωνίαςは、神聖なものへの敬意を欠くことと、内容の空虚さの両面を表す。
lexical_decisions:
- source_word: βεβήλους
  choice: 神を敬わない
  rationale: 神聖なものに属さず、神への敬意を欠くという宗教的・倫理的な意味を、現代日本語で明確に表す。
- source_word: κενοφωνίας
  choice: むなしい話
  rationale: 内容や価値を欠いた言葉という語の意味を、自然で分かりやすい日本語で表す。
- source_word: περιΐστασο
  choice: 避けなさい
  rationale: そのような言葉から身を引き、関わらないようにせよという中動態命令の意味を簡潔に伝える。
- source_word: ἐπὶ πλεῖον
  choice: ますます
  rationale: 程度がさらに増していく進行を自然な日本語で表す。
- source_word: προκόψουσιν
  choice: 深めていく
  rationale: 本来は『前進する』を意味するが、ここでは不敬虔が進展するという否定的文脈に合わせ、日本語として自然に表現する。
- source_word: ἀσεβείας
  choice: 不敬虔
  rationale: 神への畏敬を欠く宗教的・倫理的状態を、聖書文体として明確かつ簡潔に示す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の勧めとの対照を明示する。
theological_decisions:
- issue: 問題の言葉が単に無益なのか、それとも神への敬意を欠くものなのか
  choice: 「神を敬わない、むなしい話」とし、空虚さと宗教的・倫理的な問題の両方を明示する。
  alternative: 「むだ話」「俗悪なおしゃべり」
  rationale: βεβήλους と κενοφωνίας の二語がそれぞれ担う、不敬虔さと空虚さをどちらも保つため。
- issue: προκόψουσιν の暗黙の主語
  choice: 「そうする者たちは」と補い、そのような話に携わる人々を指すものとして訳す。
  alternative: 主語を明示せず「ますます不敬虔へと進む」とする。
  rationale: ギリシア語の三人称複数を保ちつつ、日本語で指示対象を自然に理解できるようにする。特定の人物だけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の強さと宗教的・倫理的な重みを保った。「不敬虔」はやや聖書的な語だが、ἀσέβεια の意味を簡潔に保持するため採用した。
