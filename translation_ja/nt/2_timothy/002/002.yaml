id: 2TI.2.2
reference: 2 Timothy 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: ja
  text: また、多くの証人たちの前で私から聞いたことを[a]、ほかの人たちにも教えることのできる、信頼できる人々に委ねなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「多くの証人たちを通して私から聞いたことを」。原文は、多くの証人が居合わせていたことを表すとも、彼らが媒介したことを表すとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: 聞いたこと
  rationale: 教えの内容を指す中性複数の関係代名詞。日本語では「こと」とまとめるのが自然で、目的語としての意味も明確になる。
- source_word: ἤκουσας
  choice: 聞いた
  rationale: アオリスト直説法を単純過去として訳し、テモテが以前パウロから教えを受けたことを示す。
- source_word: παρ’ ἐμοῦ
  choice: 私から
  rationale: ἀκούωとともに用いられたπαρά＋属格は、聞いた内容の出所を表す。
- source_word: διὰ πολλῶν μαρτύρων
  choice: 多くの証人たちの前で
  rationale: διά＋属格には媒介と付帯状況の両義があり得るが、ここでは多くの証人が居合わせる公の場で教えられたという理解が文脈上もっとも自然である。別解は脚注に残す。
- source_word: ταῦτα
  choice: 聞いたことを
  rationale: 直前の関係節が示す教えの内容を受ける指示代名詞。日本語では目的語を重ねず一度だけ示すことで、同じ指示関係を自然に表す。
- source_word: παράθου
  choice: 委ねなさい
  rationale: παρατίθημιのアオリスト中態命令形。教えを他者の管理と責任に託す意味を、現代日本語で自然に表す。
- source_word: πιστοῖς
  choice: 信頼できる
  rationale: πιστόςは「忠実な」と「信頼に足る」の両方を含み得る。ここでは教えを確実に伝える人物としての信頼性が前景にあるため、この表現を採用した。
- source_word: ἀνθρώποις
  choice: 人々
  rationale: ἄνθρωποςは文法上男性形だが、人間一般を表し得る語である。日本語の「人々」は性別を不必要に限定せず、原語の語彙範囲を自然に保つ。
- source_word: οἵτινες
  choice: 人々に（関係節で修飾）
  rationale: 対象となる人々の性質を説明する質的関係代名詞。日本語では前置修飾節として自然に表した。
- source_word: ἱκανοὶ ἔσονται
  choice: 教えることのできる
  rationale: ἱκανόςは課題を果たす十分な能力を示す。未来形は、委ねられる人々がさらに教えることのできる者であるという見通しを表すが、日本語では可能表現が自然であり、能力の意味を明確に保つ。
- source_word: καὶ ἑτέρους διδάξαι
  choice: ほかの人たちにも教える
  rationale: καίを「にも」とし、教えがさらに別の人々へ伝えられる連鎖を簡潔に示す。
theological_decisions:
- issue: πιστοῖς ἀνθρώποιςの性別表現
  choice: 信頼できる人々
  alternative: 忠実な男性たち
  rationale: ἀνθρώποιςは男性複数形だが、語彙的には男女を含む人間一般を指し得る。日本語では「人々」が原語の性別上の曖昧さを保ち、本文だけから対象を男性に限定する解釈を持ち込まない。
- issue: πιστοῖςの意味
  choice: 信頼できる
  alternative: 忠実な／信仰のある
  rationale: 教えを委ね、さらに他者へ教えるという文脈では、伝達者としての信頼性が中心である。ただし「忠実な」という契約的・信仰的含意を完全に排除するものではない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の重みを保つため「委ねなさい」とした。「ことを、それを」のような不自然な重複は避け、指示代名詞ταῦταの照応を日本語の目的語構文に統合した。
