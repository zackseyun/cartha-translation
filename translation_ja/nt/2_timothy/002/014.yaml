id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: ja
  text: これらのことを人々に繰り返し思い起こさせ、主[b]の御前で、言葉を巡って争わないよう厳かに言い聞かせなさい。そのような争いは何の益にもならず[a]、聞く人々を滅びに至らせます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何の役にも立たず」。
    reason: lexical_alternative
  - marker: b
    text: 「主の御前で」は、神が証人であることを一般的に表すとも考えられます。ここでの「主」が特に主イエスを指すのか、より広く神を指すのかは、本文では明示されていません。
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞で、直前までに述べられた複数の教えを受ける形を保った。
- source_word: ὑπομίμνῃσκε
  choice: 繰り返し思い起こさせ
  rationale: 現在命令形の継続的・反復的な側面を、自然な現代日本語で表した。
- source_word: διαμαρτυρόμενος
  choice: 厳かに命じなさい
  rationale: 神の御前で強く言い渡すという、厳粛な勧告・命令の力を表した。「人々に」は文脈上の対象を補った。
- source_word: ἐνώπιον τοῦ κυρίου
  choice: 主の御前で
  rationale: 神的な証人の前で行うという定型的な意味と厳粛さを保ち、κύριοςの指示対象は限定しなかった。
- source_word: μὴ λογομαχεῖν
  choice: 言葉を巡って争わないよう
  rationale: 言葉そのものをめぐる不毛な論争というλογομαχέωの否定的な含みを、過度な意訳をせず自然に表した。
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: 何の益にもならず
  rationale: 有益な結果が全くないことを簡潔に表し、続く有害な結果との対比を保った。
- source_word: ἐπὶ καταστροφῇ
  choice: 破滅させます
  rationale: καταστροφήの強い破壊的結果を保った。日本語では結果を明確にするため動詞表現とした。
- source_word: τῶν ἀκουόντων
  choice: 聞いている人々
  rationale: 現在分詞の継続的な聞き手という意味を、自然で広く理解できる表現にした。
theological_decisions:
- issue: κύριοςの指示対象
  choice: 主
  alternative: 神／主イエス
  rationale: 本文は単に「主」と述べており、神一般を指すのか、特に主イエスを指すのかを明示していないため、その曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、「主の御前」「厳かに」によって勧告の荘重さを保った。二文に分け、不毛な言葉争いと聞き手への深刻な害との関係を読み取りやすくした。脚注記号は内容に対応する語句の直後に配置した。
