  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: ja
  text: 労苦して働く農夫は、真っ先に収穫の分け前にあずかるべきです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「労苦して働く農夫は、まず収穫にあずかるべきです」とも訳せます。
    reason: 「分け前」は、ギリシア語動詞と属格が示す分有の意味を明確にした表現であるため。
lexical_decisions:
- source_word: κοπιῶντα
  choice: 労苦している
  rationale: 継続的に骨を折って働くことを表す分詞。単なる「働く」よりも、その労苦と努力を明確に伝える。
- source_word: γεωργὸν
  choice: 農夫
  rationale: 土地を耕す人を指す。文脈に適し、現代日本語でも理解しやすい表現。
- source_word: δεῖ
  choice: べきです
  rationale: 必要・当然性を表す。文脈上、単なる未来ではなく、そうあるのが当然だという原則を自然な日本語で示す。
- source_word: πρῶτον
  choice: 真っ先に
  rationale: 分け前にあずかることの優先性を表す。労働の時期ではなく、収穫への参与が先であるという構文上自然な理解を保つ。
- source_word: τῶν καρπῶν
  choice: 収穫の
  rationale: 農業の文脈で καρποί は畑から得られる産物を指す。「実」より広く自然に伝わる。属格は μεταλαμβάνειν の分有の対象を示す。
- source_word: μεταλαμβάνειν
  choice: 分け前にあずかる
  rationale: 何かの一部を受け、共有するという意味を、属格との関係も含めて明瞭に表す。単なる「受け取る」より参与の含意を保つ。
theological_decisions:
- issue: 格言的な文の焦点
  choice: 労苦する農夫には、その労働の実りに優先してあずかるのが当然だという原則
  alternative: 農夫は収穫を食べる前に、まず働かなければならないという意味
  rationale: ギリシア語の語順と統語では、πρῶτον は自然には μεταλαμβάνειν に結びつき、働く時期よりも収穫への参与の優先性を示す。
- issue: δεῖ のニュアンス
  choice: 当然性・必要性を「べきです」で表す
  alternative: 強い義務として「ねばならない」とする
  rationale: δεῖ の必要性を保ちつつ、この格言における適切さや当然性を過度に法的な命令へ限定しない。
translation_notes:
  register: 明瞭で現代的かつ格調を保った文体。「こそ」で労苦する農夫を焦点化し、「真っ先に」によって πρῶτον が収穫への参与を修飾することを自然に示した。
