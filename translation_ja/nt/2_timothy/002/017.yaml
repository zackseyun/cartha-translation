  text: καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: ja
  text: また、彼らのことば[a]は、壊疽のように広がっていきます[b]。その仲間には、ヒメナイオとフィレトがいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの話」または「彼らの言うこと」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 原文は「広がる」「進行する」ことを表す慣用的な表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: ことば
  rationale: 単独の語ではなく、彼らが語る言説や教えを指す。日本語の「ことば」は原語の幅を保ちつつ、直前の不敬虔な無駄話とのつながりも自然に示せる。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: λόγοςを修飾する属格を、自然な所有表現で訳した。
- source_word: ὡς γάγγραινα
  choice: 壊疽のように
  rationale: γάγγραιναの医学的な比喩を直接保つ。「がん」のような一般化を避け、組織を侵して広がる破壊的なイメージを伝える。
- source_word: νομὴν ἕξει
  choice: 広がっていきます
  rationale: 字義的には場所や進路を得ることを表す慣用的表現だが、壊疽の比喩の中では破壊的に進行・拡大する意味になる。「広がっていきます」は継続的な進行も自然に表す。
- source_word: ὧν ἐστιν
  choice: その中には……がいます
  rationale: 先に言及された人々の中から具体例を挙げる部分集合の関係を、自然な日本語で示す。
- source_word: Ὑμέναιος
  choice: ヒメナイ
  rationale: ギリシア語の人名を、日本語聖書で理解しやすい慣用的な形に音写した。
- source_word: Φίλητος
  choice: フィレト
  rationale: ギリシア語の人名を原音に沿って現代日本語で音写した。
theological_decisions:
- issue: 病の比喩が示す力
  choice: 腐敗させる言説が共同体の中で破壊的に広がる警告として訳す
  alternative: 医学的表現だけを字義的に置き、広がる意味を明示しない
  rationale: 壊疽という比喩とνομὴν ἕξειの組み合わせは、誤った言説の進行と害を示す。「広がっていきます」はその力を保ちながら、本文以上の教理的説明を加えない。
translation_notes:
  register: 明瞭で現代的な敬体を用いつつ、「壊疽」という原文の強い医学的比喩を保持した。節頭のκαίは前節からの連続を示す「そして」とし、人名は読みやすい日本語表記にした。
