id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: ja
  text: しかし、神の堅固な土台は立っており、この証印を帯びている[a]。「主は、ご自分に属する者たちを知っておられる。」また、「主の名を口にする者は皆[b]、不義から離れよ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この銘が刻まれている」。ここで「証印」と訳した語は、所有や真正性を示す印、またはその印に刻まれた銘を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: または「主の名を呼び求める者は皆」「主の名を名乗る者は皆」。ギリシア語は直訳すると「主の名を名づける者」で、主を呼び求めること、または主への帰属を公に言い表すことを示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: しかし
  rationale: 前節までの誤った教えと対照をなす強い逆接を、自然な現代日本語で示す。
- source_word: στερεὸς θεμέλιος τοῦ θεοῦ
  choice: 神の堅固な土台
  rationale: 土台の安定性と永続性を示す比喩を保ち、属格「神の」が持つ所有・由来などの幅を限定しない。
- source_word: ἕστηκεν
  choice: 立っており
  rationale: 完了形が表す、確立されて今も立っている状態を簡潔に表す。
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: この証印を帯びている
  rationale: 認証・所有・識別を示す証印の比喩を保持する。「帯びている」は土台が証印を有するという表現を日本語として自然にする。
- source_word: Ἔγνω κύριος τοὺς ὄντας αὐτοῦ
  choice: 主は、ご自分に属する者たちを知っておられる
  rationale: 引用中のアオリストを時を超えた確かな認知として表し、αὐτοῦの所属関係を明示する。
- source_word: Ἀποστήτω ἀπὸ ἀδικίας
  choice: 不義から離れよ
  rationale: 決然と身を引くよう求める命令の力を保ち、ἀδικίαの広い道徳的意味を「不義」で表す。
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: 主の名を口にする者は皆
  rationale: 「名を名づける」という原文の反復的な言い回しを日本語で不自然にせず、主の名を唱えることや主への帰属を公にする含意を残す。
theological_decisions:
- issue: 二つの引用における「主」の指示対象
  choice: どちらも「主」と訳し、父なる神かキリストかを訳文で特定しない。
  alternative: 双方を父なる神、双方をキリスト、または二つを異なる指示対象として明示する。
  rationale: ギリシア語はどちらもκύριοςとだけ記し、聖書引用とキリスト教的適用が重なる。原文が明示しない指示対象を訳文で解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。土台と証印の比喩、二つの引用の並行性、命令の簡潔な力を維持した。句読点は引用の境界を分かりやすく示すため日本語の慣用に従った。
