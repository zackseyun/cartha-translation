id: 2TI.2.15
reference: 2 Timothy 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: ja
  text: 神に認められ、恥じることのない働き手として、真理のことばを正しく扱い、自分を神の前に差し出せるよう努めなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「真理のことばを正しく教えなさい」とも訳せる。直訳では「真理のことばをまっすぐ切りなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: 励みなさい
  rationale: 真剣かつ熱心に努力するよう求めるアオリスト命令形の力を、自然で格調ある現代日本語で表す。
- source_word: σεαυτὸν ... παραστῆσαι τῷ θεῷ
  choice: 神に…自分を示す
  rationale: 自分自身を神の前に差し出し、評価または奉仕に備える意味を保つ。「神の前に立つ」より解釈を狭めない。
- source_word: δόκιμον
  choice: 認められる者
  rationale: 試練や吟味を経て承認に値する者という意味を表す。日本語では「承認された」より自然で、神による評価の文脈にも合う。
- source_word: ἐργάτην
  choice: 働き手
  rationale: 職務に携わる者という比喩を、性別を不必要に強調せず、明瞭な現代日本語で保持する。
- source_word: ἀνεπαίσχυντον
  choice: 恥じる必要のない
  rationale: 単に恥を感じない態度ではなく、恥じる理由のない確かなあり方を示す。
- source_word: ὀρθοτομοῦντα
  choice: 正しく扱いなさい
  rationale: 字義的には「まっすぐ切る」だが、ここでは真理のことばを正確かつ適切に取り扱う意味。教える行為だけに限定しない幅を保つ。
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: 真理のことば
  rationale: 属格構文とパウロ書簡における表現の響きを保ちつつ、現代日本語でも理解できる定訳的表現とした。
theological_decisions:
- issue: 奉仕の文脈における ὀρθοτομοῦντα の意味
  choice: 真理のことばを正しく扱う
  alternative: 真理のことばを正しく教える／真理のことばをまっすぐ切る
  rationale: この分詞は福音のことばを適切かつ正確に取り扱うことを広く指し得る。「教える」に限定せず、同時に字義的比喩と解釈上の幅を脚注に残す。
translation_notes:
  register: 明瞭で現代的かつ格調ある命令文。「ことば」は聖書的な響きを保つため平仮名表記とした。ギリシア語の一文を日本語では二文に分け、修飾関係と勧告の内容を読み取りやすくした。
