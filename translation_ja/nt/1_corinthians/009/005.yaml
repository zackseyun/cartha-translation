id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: ja
  text: 私たちには、ほかの使徒たちや主の兄弟たちやケファと同じように、信仰を同じくする妻[a]を伴って旅をする権利がないのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「姉妹である妻」。ここで「姉妹」は、同じ信仰を持つ女性を指す。
    reason: 原文の二つの名詞を示し、本文の自然な訳が持つ解釈を明らかにするため。
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 権利
  rationale: ここでは抽象的な権威ではなく、使徒として正当に認められる資格・権利を論じているため。
- source_word: ἀδελφὴν γυναῖκα
  choice: 信仰を同じくする妻
  rationale: 直訳的には「姉妹である妻」。ἀδελφήが信仰共同体の姉妹を指し、γυνήがここでは妻を指すという両要素を、現代日本語で誤解なく表した。
- source_word: περιάγειν
  choice: 伴って旅をする
  rationale: 宣教旅行に妻を同行させるという文脈を自然な日本語で示しつつ、「伴う」という原語の移動の含意を保った。
- source_word: ὡς καὶ
  choice: 同じように
  rationale: パウロたちと、続いて挙げられる人々との比較を自然に表す。
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: ほかの使徒たち
  rationale: λοιποίが示す、同じ集団に属する残りの者たちという意味を簡潔に表した。
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: 主の兄弟たち
  rationale: 親族関係の厳密な性質を解釈で限定せず、ギリシア語の表現をそのまま保った。
- source_word: Κηφᾶς
  choice: ケファ
  rationale: 本文にあるアラム語名のギリシア語音写を反映し、ペトロに置き換えなかった。
theological_decisions:
- issue: 「主の兄弟たち」の関係
  choice: 「主の兄弟たち」と訳し、関係を限定しない
  alternative: イエスの実弟たち／義理の兄弟たち／近親者たち
  rationale: 原文だけでは後代の論争における具体的な親族関係まで確定しないため、本文の緊張を保った。
- issue: ἀδελφὴν γυναῖκα の意味
  choice: 信仰を同じくする妻
  alternative: 姉妹である妻／信者の妻／姉妹を妻として
  rationale: 最も自然には、信仰共同体の姉妹でもある妻を指す。単なる女性信者の同行者という誤読を避けながら、直訳形は脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「権利がないのでしょうか」により、肯定の答えを予期する修辞疑問を自然に表した。「伴って旅をする」は宣教旅行の文脈を示すが、本文にない目的や役割は加えていない。
