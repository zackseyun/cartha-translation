id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: ja
  text: ほかの人たちがあなたがたに対する権利を持っているなら、私たちはなおさらではありませんか。しかし、私たちはこの権利を用いませんでした。かえって、すべてを耐え忍んでいます。それは、メシアの福音に何の妨げも生じさせないためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: 権利
  rationale: この文脈では、使徒がコリントの信徒から物質的な支援を受ける正当な資格を指す。「権威」よりも「権利」が自然で、行使できる正当な請求権という意味を伝える。
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: あなたがたに対するこの権利
  rationale: ὑμῶνを権利の所有者と誤解させず、コリントの信徒との関係において行使される権利であることを示す。指示語「この」は後半のταύτῃとの照応と文脈上の既知性を自然に表す。
- source_word: μετέχουσιν
  choice: あずかっている
  rationale: 権利を共有し、その益を受けるという参与の意味を、現代日本語として分かりやすく表す。
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: 私たちはなおさらではありませんか
  rationale: 修辞疑問と比較の強意を保ち、他の人以上にパウロたちに権利があるという含意を自然に示す。
- source_word: ἐχρησάμεθα
  choice: 用いず
  rationale: 権利を実際に利用・行使しなかったというχράομαιの意味を簡潔に表す。
- source_word: πάντα
  choice: すべて
  rationale: 何を耐えるかを限定しない原文の包括性を保つ。
- source_word: στέγομεν
  choice: 耐え忍んでいます
  rationale: ここでは「覆う」ではなく、困難や負担を持続的に忍耐する意味。現在形の継続的な姿勢も表せる。
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: 少しでも妨げない
  rationale: 直訳的な「何らかの妨げを与える」を自然な目的表現にしつつ、τιναの不定的な力を「少しでも」で保持する。
- source_word: εὐαγγελίῳ
  choice: 福音
  rationale: パウロ書簡で定着した明確な訳語であり、宣べ伝えられる良い知らせという神学的・宣教的内容を保つ。
- source_word: Χριστοῦ
  choice: メシア
  rationale: 定冠詞を伴う属格で、ここでは称号としての機能が明瞭であるため、Χριστόςのメシア的意味を表に出す。
theological_decisions:
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは「メシアの福音」という称号的用法と判断し、油注がれた者という意味を保つ。ただし、日本語教会用語としては「キリスト」も可能である。
- issue: 「福音」と属格Χριστοῦの関係
  choice: メシアの福音
  alternative: メシアについての福音／メシアに属する福音
  rationale: 属格が、福音の内容・起源・帰属のいずれを強く表すかを本文で限定せず、日本語の属格「の」によって原文の幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の力とパウロの自制の対比を保持した。「耐え忍ぶ」はやや格調を保ちながら一般読者にも理解できる表現。「メシア」は称号性を明示するために採用した。
