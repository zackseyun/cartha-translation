revisions:
- from: ほかの人たちが、あなたがたに対するこの権利にあずかっているのなら[a]、私たちはなおさらではありませんか。しかし、私たちはこの権利を用いず、かえってすべてを耐え忍んでいます。それは、メシアの福音を少しでも妨げないためです。
  to: ほかの人たちがあなたがたに対する権利を持っているなら、私たちはなおさらではありませんか。しかし、私たちはこの権利を用いませんでした。かえって、すべてを耐え忍んでいます。それは、メシアの福音に何の妨げも生じさせないためです。
  rationale: 前半では、原文に指示詞のない箇所から「この」を除き、後半のταύτῃに対応する「この権利」を保持しました。「持っているなら」は、μετέχωの「分け持つ・享受する」含意をこの文脈で自然に表します。ἀλλὰ πάντα στέγομενの現在形は「耐え忍んでいます」とし、ἵνα μή τινα ἐγκοπὴν δῶμενは「福音に何の妨げも生じさせないため」として、目的・否定・不定的な「何らかの妨げ」を明示しました。
