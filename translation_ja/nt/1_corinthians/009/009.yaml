source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: ja
  text: というのも、モーセの律法にはこう書かれています。「脱穀している[a]牛に口籠をつけてはならない。」神が牛のことを気にかけておられるのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「穀物を踏んで脱穀している」。
    reason: ἀλοῶνταは脱穀作業を表す。申命記の背景では、牛が穀物を踏んで脱穀する情景として具体的に表すこともできる。
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: モーセの律法に
  rationale: ἐνを日本語で自然な引用箇所の表現「～に」とし、属格関係を「モーセの律法」で保った。「なぜなら」は文脈との接続を示すが、単独節として不自然に重くなるため、「こう書かれています」によってγάρの説明的な流れを自然に表した。
- source_word: γέγραπται
  choice: こう書かれています
  rationale: 聖書引用を導入する定型表現の権威性と、完了受動の現在まで有効な状態を、明瞭で自然な日本語にした。
- source_word: Οὐ κημώσεις
  choice: 口籠をはめてはならない
  rationale: κημόωの具体的意味を保ち、未来形による禁止を日本語の律法的な禁止表現「～てはならない」で訳した。
- source_word: βοῦν
  choice: 牛
  rationale: この文脈では作業用の牛を指す。日本語の「雄牛」や「去勢牛」は原文以上に性別・状態を限定するため、包括的で自然な「牛」とした。
- source_word: ἀλοῶντα
  choice: 脱穀している
  rationale: 現在分詞の継続中の動作を保ち、穀粒を穂から分離する作業を簡潔に表した。踏みつける具体的方法は語自体に必須ではないため、別訳を脚注に置いた。
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: 神が気にかけておられるのは、牛のことなのでしょうか
  rationale: μήが導く否定的な答えを予期する修辞疑問の力を、「なのでしょうか」で自然に表した。「だけ」を補わず、神の動物への配慮を絶対的に否定するか否かという緊張を残した。
theological_decisions:
- issue: パウロの、神が牛を気にかけるかという修辞疑問
  choice: 神が気にかけておられるのは、牛のことなのでしょうか。
  alternative: 神は牛のことだけを気にかけておられるのでしょうか。
  rationale: 原文には「だけ」に相当する語がないため補わず、μήによる修辞的な問いをそのまま保った。これにより、律法のより広い意図を論じるパウロの力点を示しつつ、神が動物を顧みないという絶対的主張へ解釈を固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用には「～てはならない」という端正な法的文体を採用した。「口籠」はやや文語的だが、作業中の牛の口を覆う器具を簡潔かつ正確に示す語として保持した。
