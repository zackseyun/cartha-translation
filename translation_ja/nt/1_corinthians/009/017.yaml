id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: ja
  text: 私が自ら進んでこれを行うなら、私には報いがあります。しかし、意に反して行うなら、私は管理の務めを委ねられています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「管理の務め」は、「委ねられた責任」または「委託された任務」とも訳せます。
    reason: οἰκονομίαは、管理を任された責任や任務を表し、文脈上は福音宣教の委託を指す。
lexical_decisions:
- source_word: ἑκὼν
  choice: 自ら進んで
  rationale: 自発的に行うことを表し、単なる感情的な熱意ではなく、自分の意志による行為という意味を自然な日本語で示す。
- source_word: τοῦτο πράσσω
  choice: これを行う
  rationale: 直前の文脈で論じられている福音宣教を指すが、原文どおり指示内容を明示しすぎない表現とした。
- source_word: μισθὸν
  choice: 報い
  rationale: 賃金にも報酬にもなり得る語だが、ここでは自発的な奉仕に伴うものを指すため、金銭的給与に限定されない「報い」が適切である。
- source_word: ἄκων
  choice: 意に反して
  rationale: ἑκὼνとの対照を保ちつつ、単なる「しぶしぶ」という感情的ニュアンスを加えず、自分の意志によらないという意味を表す。
- source_word: οἰκονομίαν
  choice: 管理の務め
  rationale: 委ねられたものを管理する責任という比喩を保ちながら、現代日本語で理解しやすくした。単なる役職や制度的職務には限定しない。
- source_word: πεπίστευμαι
  choice: 委ねられています
  rationale: 完了受動形が示す、すでに委託され、現在もその責任を負っている状態を自然な日本語で表した。
theological_decisions:
- issue: 後半におけるパウロの宣教の性質
  choice: 自分の意志によらず行うとしても、パウロには委ねられた管理の務めがある。
  alternative: 自発的でない場合には報いはなく、義務だけを果たしている。
  rationale: 原文は「報いがある」と「管理の務めを委ねられている」を対照させている。自発性と、神から委ねられた責任との緊張をそのまま保ち、報いの有無や宣教職の性質を本文以上に断定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「自ら進んで」と「意に反して」によって原文の対照を明確にし、「管理の務め」で委託された責任の比喩を残した。
