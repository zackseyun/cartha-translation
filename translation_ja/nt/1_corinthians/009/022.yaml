    rationale: 「得る」は物品などの取得を連想させやすく、この箇所での、人を福音へ勝ち取るという比喩的・宣教的意味を十分に表さない。
  - severity: medium
    issue: πάντωςの「あらゆる手段によって」の強調が「何とかして」では弱い。
    rationale: 「何とかして」は「どうにか」の意味にも読めるため、可能なあらゆる方法を用いるという原語の強調を明示する「あらゆる方法で」がより適切である。
  - severity: low
    issue: 「すべてのものとなりました」が現代日本語として不自然である。
    rationale: 原文のπάνταは包括的な適応を表す修辞であり、日本語では「あらゆる者となってきました」としたほうが読みやすい。これは特定の集団や立場に限定するものではない。
