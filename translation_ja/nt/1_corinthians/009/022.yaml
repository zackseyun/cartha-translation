source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: ja
  text: 弱い人たちには、弱い者となりました[a]。弱い人たちを勝ち取るためです。すべての人に対して、私はあらゆる者となってきました。あらゆる方法で[b]幾人かを救うためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「弱い」は、「良心の弱い」とも訳せる。コリントの信徒への手紙一では、良心が傷つきやすい人を特に指す場合がある。
    reason: lexical_alternative
  - marker: b
    text: 「あらゆる方法で」は、「何とかして」または「どんな方法を用いても」とも訳せる。目的のために可能なあらゆる手段を用いることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: ～となりました
  rationale: γίνομαιのアオリストとして、パウロが宣教の場で相手に応じて自ら取った立場を、自然な現代日本語で表す。
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: 弱い人たち／弱い者
  rationale: 原文の反復を保ちつつ、日本語として自然になるよう名詞化した。文脈上「良心の弱い人」を含み得るが、本文では意味を狭めない。
- source_word: κερδήσω
  choice: 得る
  rationale: κερδαίνωの基本的な比喩表現を保ち、人々を福音へと獲得するという宣教的文脈に合う。
- source_word: τοῖς πᾶσιν
  choice: すべての人に対して
  rationale: ギリシア語で省略されている人を補い、諸集団との関係を明瞭にする。
- source_word: γέγονα
  choice: 私は～となりました
  rationale: 完了形が示す、これまでの行動によって成立し現在にも関わる姿勢を文脈によって伝える。
- source_word: πάντα
  choice: すべてのもの
  rationale: τοῖς πᾶσινとの語形上の響きをできるだけ保ち、「あらゆる立場の者」のように限定的な解釈を本文へ持ち込まない。
- source_word: πάντως
  choice: 何とかして
  rationale: 可能なあらゆる仕方を用いて目的を目指す含意を、非倫理的な妥協を示唆せず自然に表す。
- source_word: τινὰς
  choice: 幾人か
  rationale: 救われるのが全員だとは主張しない、不定代名詞の控えめな表現を保つ。
- source_word: σώσω
  choice: 救う
  rationale: 宣教の文脈におけるσῴζωの救済的な重みを弱めず、簡潔に訳す。
theological_decisions:
- issue: 「弱い人たち」の範囲
  choice: 本文では広く「弱い人たち」とする。
  alternative: 「良心の弱い人たち」または「力のない人たち」
  rationale: 8～10章の文脈では良心の弱さが重要だが、この節の表現自体は広く、周囲に挙げられる諸集団と修辞的に並んでいるため、本文で限定しない。
- issue: 「救う」におけるパウロの役割
  choice: 原文どおり「幾人かを救う」とする。
  alternative: 「幾人かが救われるようにする」または「幾人かを救いへ導く」
  rationale: σῴζωの救済的表現を保つ一方、パウロが究極的な救済者であるとの教理的結論は文脈に持ち込まない。彼の宣教上の手段的役割として理解できる表現を維持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。原文の「弱い」の三度の反復と、「すべて」の語遊びを可能な範囲で保持した。二つの目的節は独立文として訳し、パウロの行動と目的の対応を読み取りやすくした。
