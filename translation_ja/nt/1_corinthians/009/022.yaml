  source_fidelity: 「弱い」の反復、二つの目的節、「幾人か」、および救済を表すσώσωはおおむね適切に訳されている。しかし、κερδήσωの「得る」は日本語では所有・取得の響きが強く、人々を福音へ勝ち取るという文脈上の意味が弱い。また、πάντωςは「何とかして」より「あらゆる方法で」のほうが、可能な手段を尽くすという強調を明確に反映する。
  naturalness: 「すべての人に対して、私はすべてのものとなりました」は原文の修辞を保とうとする訳として理解できるが、「すべてのもの」が日本語では非人称的・不自然に響く。ここでは文脈上、各人に応じて取る姿勢・あり方を指すため、「あらゆる者となってきました」として自然さを改善しつつ、包括性を保つ。完了形γέγοναには「なってきました」がよりよく対応する。
  terminology: 「弱い人たち」は本文で限定しない方針が適切であり、脚注で「良心の弱い」可能性を示すことも妥当である。「救う」はσώσωの救済的な重みを保つ。κερδήσωは「勝ち取る」とする。
  issues:
