id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: ja
  text: たとえほかの人々にとって私が使徒でないとしても、あなたがたにとっては確かに使徒です。あなたがたは主にあって、私の使徒職が本物であることを示す印[a]だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証拠」または「真正さを示すもの」とも訳せる。ギリシア語は「印」を意味する語を用いており、真正であることを確認する印の比喩を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: パウロの自己言及では、単なる使者ではなく、委任された使徒としての務めを指すため、定着した用語「使徒」とした。
- source_word: ἀλλά γε
  choice: あなたがたにとっては確かに
  rationale: ἀλλάの対照とγεの強調を、自然な日本語で「〜にとっては確かに」と表した。
- source_word: σφραγίς
  choice: 証印
  rationale: 真正さや権限を保証する印という比喩と、文脈上の証明力の両方を保つため「証印」とした。
- source_word: ἀποστολή
  choice: 使徒職
  rationale: ここでは一般的な使命ではなく、パウロに委ねられた使徒としての務めと資格を指すため「使徒職」とした。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: コリントの信徒たちが主との関係の中でパウロの使徒職を裏づけているという、パウロ特有の表現を保った。単に「主によって」という行為者の意味には限定しない。
- source_word: ἄλλοις
  choice: ほかの人々にとっては
  rationale: 使徒であることと人々との関係を示す与格を、自然な日本語の「〜にとって」で表した。
theological_decisions:
- issue: パウロの使徒性についての主張の範囲
  choice: パウロは、ほかの人々との関係では使徒と認められないとしても、コリントの信徒たち自身が彼の使徒職を確証すると主張している。
  alternative: パウロの使徒職はコリントの信徒たちだけに限定され、ほかの人々に対しては実際に使徒ではない。
  rationale: 条件節は論争的・修辞的な譲歩であり、パウロの使徒職そのものを一教会に限定する断定ではない。後半は、コリントの教会の存在を使徒職の真正さを示す証印として挙げている。
- issue: ἐν κυρίῳの係り方
  choice: コリントの信徒たちが「主にあって」パウロの使徒職の証印である。
  alternative: 主が行為者として彼らを証印にした、すなわち「主によって」である。
  rationale: 前置詞句は、信徒たちの存在とその証明力を主との関係の中に位置づける表現として、その幅を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「たとえ〜としても」で修辞的譲歩を示し、「確かに」でγεの強調を表現した。「証印」はやや改まった語だが、脚注で比喩の意味を補い、原文の像を保持した。
