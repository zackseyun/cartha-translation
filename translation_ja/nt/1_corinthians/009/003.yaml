base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/003.yaml
  text: This is my defense to those who examine me[a].
translation:
  language: ja
  text: 私を吟味する人たちに対する私の弁明は、これです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私を裁く人たちの前での私の弁明は、これです。」
    reason: ἀνακρίνωには、吟味・審査に加えて「裁く」と訳し得る司法的な含みがあり、与格も「人たちの前で」と表せるため。
lexical_decisions:
- source_word: ἀπολογία
  choice: 弁明
  rationale: 非難や批判に対して自らの立場を説明し擁護する答えを表す。現代日本語の「謝罪」と混同されず、文脈にある使徒としての権利と行動への批判に答える語として適切である。
- source_word: ἀνακρίνουσίν
  choice: 吟味する
  rationale: パウロを詳しく調べ、評価するという継続的な批判的検討を表す。「裁く」より最終的な判決の響きを抑えつつ、単なる質問以上の意味を保つ。
- source_word: Ἡ ἐμὴ
  choice: 私の
  rationale: 所有を自然に表す。日本語では「私自身の」と強調する必要はない。
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: 私を吟味する人たちに対する
  rationale: 与格を弁明の向けられる相手として理解し、自然な日本語で示す。
- source_word: ἐστιν αὕτη
  choice: これです
  rationale: 指示語によって、直前または後続の内容を弁明として特定するギリシア語を簡潔に再現する。
theological_decisions: []
