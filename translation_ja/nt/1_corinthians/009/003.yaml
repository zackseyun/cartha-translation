  source_fidelity: 「私を吟味する人たちに対する私の弁明は、これです」は、Ἡ ἐμὴ ἀπολογία（私の弁明）、τοῖς ἐμὲ ἀνακρίνουσιν（私を吟味する人たちに対して）、ἐστιν αὕτη（これです）を過不足なく反映している。「吟味する」は、批判的な調査・評価というἀνακρίνωの意味を保ち、最終的な司法判断に限定しない。
  naturalness: 明瞭で自然な現代標準日本語である。「～に対する私の弁明」はやや改まった調子だが、パウロの自己弁護という文脈にふさわしく、読みづらさはない。
