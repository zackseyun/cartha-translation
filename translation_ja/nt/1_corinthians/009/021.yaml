  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: ja
  text: 律法の外にいる人々[a]には、律法の外にいる者のようになりました。ただし、私は神の律法の外にいるのではなく、メシアの律法のもとにあります[b]。それは、律法の外にいる人々を得るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「律法を持たない人々」。ここでは、必ずしも道徳的に無法な人々ではなく、モーセの律法のもとにいない人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「メシアに対して律法の内にある者」。また、「メシアの律法のもとにある」とも訳せる。この表現は、メシアとの関係において律法の領域内にあり、その拘束を受けることを表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: 律法の外にいる人々／者
  rationale: 直前の「律法のもとにいる人々」と対照され、モーセの律法のもとにいない人々を指す。「無法な」は道徳的に邪悪という意味に誤解されやすいため避け、三度の反復も保った。
- source_word: ὡς
  choice: 〜のように
  rationale: パウロが絶対的な意味でその状態になったのではなく、相手に応じた振る舞いをしたことを表す。
- source_word: μὴ ὢν
  choice: もっとも、〜のではなく
  rationale: 先行句を限定する譲歩的な説明として、現代日本語で自然に表した。
- source_word: ἔννομος Χριστοῦ
  choice: メシアの律法のもとにある
  rationale: ἔννομοςの、律法の領域内にあり拘束を受けるという法的・関係的意味を自然に表し、直前の「外にいる」との対照を保った。Χριστόςはここでは称号として「メシア」とした。
- source_word: ἵνα κερδάνω
  choice: 得るため
  rationale: ἵναの目的を明示し、κερδαίνωの伝道的文脈における「人を得る」という比喩を簡潔に保った。
theological_decisions:
- issue: この文脈におけるἄνομοςの意味
  choice: モーセの律法のもとにいない人々を指す「律法の外にいる」
  alternative: 道徳的に無法・不法な人々
  rationale: 9章20–21節の対照と、パウロ自身は神との関係で律法の外にいないという直後の限定から、道徳的無法ではなく契約的・法的な位置が中心である。
- issue: ἔννομος Χριστοῦの意味
  choice: メシアの律法のもとにある
  alternative: メシアの律法の内にある／メシアに対して律法の内にある
  rationale: 神への道徳的責任を否定していない点を示しつつ、この属格を過度に説明せず、「律法」とメシアとの関係に原文どおりの余地を残した。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは律法との関係を示す称号的用法が明瞭なため、「メシア」とした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「律法の外にいる」を反復して原文の修辞を保ち、補われる動詞は直前の文脈に合わせて「なりました」とした。「者です」によりパウロの現在の立場を自然に示した。
