  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: ja
  text: ユダヤ人に対しては、ユダヤ人のようになりました。ユダヤ人を得るためです。[a] 律法[b]の下にいる人々に対しては、律法の下にいる者のようになりました――私自身は律法の下にいないのですが――律法の下にいる人々を得るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「得る」は、「獲得する」「味方にする」という意味を持ち、ここでは人を福音へ導くことを表します。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「律法」は、モーセの律法を指すと考えられます。
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: なりました
  rationale: γίνομαι のアオリストを素直に表し、パウロが相手に応じた振る舞いや立場を取ったことを、自然な日本語で伝える。
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: ユダヤ人には、ユダヤ人のようになりました
  rationale: 与格を「〜には」、ὡς の比較を「〜のように」で表し、パウロが民族的にユダヤ人でなくなった、あるいは新たにユダヤ人になったという意味に限定しない。
- source_word: ἵνα ... κερδήσω
  choice: それは、〜を得るためです
  rationale: κερδαίνω の基本的な「得る」を保持する。文脈上は人を福音へ導く意味だが、本文では説明を加えず、語の比喩性を残す。
- source_word: τοῖς ὑπὸ νόμον
  choice: 律法の下にいる人々には
  rationale: 実体詞的な前置詞句を明瞭な日本語にし、ὑπό の支配・拘束の比喩を「下に」で保持する。
- source_word: ὡς ὑπὸ νόμον
  choice: 律法の下にいる者のようになりました
  rationale: 省略の多いギリシア語を日本語として補いながら、先行する「ユダヤ人のように」との並行を保つ。
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: 私自身は律法の下にはいませんが
  rationale: 現在分詞の同時的な但し書きを現在形で表し、μή の否定と対照を自然に示す。
- source_word: αὐτὸς
  choice: 私自身
  rationale: αὐτός の強調を明示する。
- source_word: νόμος
  choice: 律法
  rationale: ユダヤ的文脈で認識される法体系を指す伝統的かつ現代日本語でも通用する語を用いる。モーセ律法との特定は脚注に置く。
theological_decisions:
- issue: パウロが「律法の下にはいない」と述べる意味
  choice: 「私自身は律法の下にはいませんが」と限定を加えず訳す。
  alternative: 「私自身はモーセの律法の下にはいませんが」、または次節を取り込んで「神の律法を持たないのではなく、キリストの律法の下にいますが」と説明する。
  rationale: この節のギリシア語は、パウロ自身が律法の下にいないとのみ述べる。次節による調和や解説を本文に持ち込まず、修辞的対照と神学的緊張を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の二つの目的節と反復を保ちつつ、長すぎる一文を避けて読みやすく区切った。脚注記号は、それぞれが説明する「得る」と「律法」に関わる文の直後に配置した。
