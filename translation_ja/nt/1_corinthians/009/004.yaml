  text: Do we not have the right to eat and drink?[a]
translation:
  language: ja
  text: 私たちには、食べたり飲んだりする権利があるのではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食べたり飲んだりする権限」とも訳せる。ここでいう「権利」は、正当に認められた資格または自由を指し、パウロの議論では、生活上の支援を受けることを意味している可能性が高い。
    reason: ἐξουσίαの語義の幅と文脈上の含意を示すため。
lexical_decisions:
- source_word: μὴ οὐκ
  choice: ないのですか
  rationale: 肯定の答えを予想する修辞疑問を、日本語でも否定疑問の形で保った。
- source_word: ἔχομεν
  choice: 私たちには……がある
  rationale: 現在の所有・保持を自然な現代日本語で表す。
- source_word: ἐξουσίαν
  choice: 権利
  rationale: ここでは支配権や能力ではなく、使徒として正当に認められた自由・資格を指すため、「権利」が文脈に最も適する。
- source_word: φαγεῖν καὶ πεῖν
  choice: 食べたり飲んだりする
  rationale: 並列された二つの行為を自然な日本語で表し、食物と飲み物を受けることの両方を保持する。
theological_decisions:
- issue: 文脈における使徒の権利の範囲
  choice: 本文では「食べたり飲んだりする権利」とし、物質的支援を受ける権利である可能性は注で示す。
  alternative: 一般的に飲食する自由、または本文で明示的に「生活の支援を受ける権利」とする。
  rationale: 第一コリント9章の議論は使徒への生活上の支援を中心とするが、この一節自体は単に飲食する権利と述べている。本文で意味を狭めすぎず、文脈上の含意を注記する。
translation_notes:
  register: 明瞭で現代的な標準語を用い、修辞疑問の力を保った。「飲食する」は簡潔だがやや硬いため、本文では日常的で分かりやすい「食べたり飲んだりする」とした。
