source:
  edition: SBLGNT
  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: ja
  text: それとも、働かないでいる権利がないのは、私とバルナバだけなのでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「働かない権利」。ここでは、自活のための労働をせず、宣教の働きに対する生活の支援を受ける権利を指す。
    reason: 語義と文脈の説明
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の議論に続く別の可能性を示す修辞疑問として、自然な接続を保つ。
- source_word: μόνος
  choice: だけ
  rationale: 「私とバルナバ」という結合された主語を限定し、彼らだけが例外なのかという強調を表す。
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: 私とバルナバ
  rationale: ギリシア語の語順を無理なく保ち、二人を一組の主語として示す。
- source_word: οὐκ ἔχομεν
  choice: ないのは
  rationale: 否定された現在形を修辞疑問に自然に組み込み、「持っていない」という意味を明確に表す。
- source_word: ἐξουσίαν
  choice: 権利
  rationale: ここでは支配権ではなく、使徒が物質的支援を受けて自活の労働を控える正当な資格を指すため。
- source_word: μὴ ἐργάζεσθαι
  choice: 働かないでいる
  rationale: 権利の内容である「働かないこと」を過度に説明せずに表し、否定不定詞の構造を日本語として自然に伝える。
theological_decisions:
- issue: この文脈におけるἐξουσίαの意味
  choice: 使徒が自活のための労働をせず、教会から物質的支援を受ける権利
  alternative: 特定の経済的支援を含意しない、より一般的な権限または自由
  rationale: 第一コリント9章の直近の文脈は、使徒が飲食や生活の支援を受ける権利と、パウロがその権利を自発的に用いなかったことを扱う。ただし本文では説明を加えすぎず、「働かないでいる権利」として文脈的含意を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。修辞疑問の響きを「のでしょうか」で保ち、二重否定になりやすい原文の構造は「権利がないのは」と整理した。
