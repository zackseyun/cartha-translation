id: 1CO.9.19
reference: 1 Corinthians 9:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: ja
  text: というのも、私はすべての人から自由な者でありながら、より多くの人を得るために、自らをすべての人の奴隷[a]としたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕える者」とも訳せますが、ギリシア語は奴隷を表す語を用いています。前半の「自由な者」との対比を保つため、本文では「奴隷」としました。
    reason: 奴隷の比喩が持つ強さと、「仕える者」という文脈上可能な訳語を説明するため。
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: 自由な者
  rationale: 身分・拘束からの自由を表し、後半の「奴隷」との意図的な対比を明確に保つ。
- source_word: ἐκ πάντων
  choice: すべての人から
  rationale: ここでの πάντων は文脈上、人々を指す。「すべての人から」と訳して、原文の簡潔な表現と後半の πᾶσιν との並行を保つ。
- source_word: πᾶσιν
  choice: すべての人の
  rationale: ἐδούλωσα が示す自己従属の相手を表す。日本語では「すべての人の奴隷」とするのが自然で、前半との修辞的な対応も保たれる。
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: 自らを……奴隷とした
  rationale: δουλόω の奴隷化という強い比喩と、ἐμαυτόν の自発的な自己従属を保持する。「仕える者となった」では自由と奴隷の対比が弱まる。
- source_word: ἵνα
  choice: ために
  rationale: 目的を表す接続詞として、自然な現代日本語で明確に訳す。
- source_word: τοὺς πλείονας
  choice: より多くの人
  rationale: 比較級の数量的意味を保つ。「できるだけ多くの人」は原文以上に最大化の意味を加えるため避ける。
- source_word: κερδήσω
  choice: 得る
  rationale: 人を「獲得する／勝ち取る」という宣教的比喩を、過度に解釈せず簡潔に保つ。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の議論に対する説明・根拠を導く機能を明示する。
theological_decisions:
- issue: δουλόω の奴隷表現
  choice: 奴隷
  alternative: 仕える者
  rationale: パウロは「自由な者」と「奴隷」を意図的に対照させているため、歴史的・修辞的に強い奴隷の比喩を弱めずに訳す。これは強制的に奴隷にされたとの意味ではなく、「自らを」とあるとおり自発的な従属を述べている。
- issue: κερδαίνω の目的語が示す意味
  choice: より多くの人を得る
  alternative: より多くの人を救う
  rationale: 原文は「得る／獲得する」という比喩を用いており、「救う」と明示してはいない。宣教的文脈を認めつつ、原文の表現と含みを保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「すべての人から／すべての人の」という反復と、「自由な者／奴隷」という中心的対比を保持した。「でありながら」により譲歩関係を自然に示し、「自らを」でパウロの自発性を明確にした。
