id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: ja
  text: 私はこうしたことを、単に人間的な考えに基づいて言っているのでしょうか。[a] それとも、律法もこうしたことを言っているのではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「人間に従って」。または「人間の基準によって」「人間の観点から」。
    reason: κατὰ ἄνθρωπον の字義的表現と、文脈に即した別訳を示すため。
lexical_decisions:
- source_word: Μὴ
  choice: ～のでしょうか
  rationale: 否定の答えを予期する修辞疑問。日本語では、文脈上「単に～」と組み合わせた疑問形により、その含意を自然に示した。
- source_word: κατὰ ἄνθρωπον
  choice: 単に人間的な考えに基づいて
  rationale: 人間として話すという意味ではなく、聖書の権威との対比において、人間的な観点や根拠だけに基づくことを表す慣用句として訳した。
- source_word: ταῦτα
  choice: こうしたこと
  rationale: 直前までのパウロの議論を受ける複数指示詞を、自然な日本語で保持した。後半でも同じ表現を用いて対応関係を明確にした。
- source_word: λαλῶ
  choice: 言っている
  rationale: 現在進行中の議論における発言を表す現在形として、現代日本語で自然に訳した。
- source_word: ἢ
  choice: それとも
  rationale: 二つの選択肢を対置する修辞疑問に適した接続表現。
- source_word: καὶ
  choice: も
  rationale: 人間的な論拠に加えて律法も証言する、という付加の意味を簡潔に表した。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 次節で申命記25章4節が引用されるため、一般的な法則ではなく、モーセの律法を含む聖書の律法を指す。日本語聖書で定着した「律法」を採用した。
- source_word: οὐ λέγει
  choice: 言っているのではありませんか
  rationale: 肯定の答えを予期するギリシア語の否定疑問を保ち、単純な肯定文に平板化しなかった。
theological_decisions:
- issue: 「律法」の指示対象
  choice: モーセの律法、すなわち聖書の律法的文書を指す表現として「律法」とする
  alternative: 一般的な法則や原則
  rationale: 直後の9節で申命記25章4節が引用されるため、ここでは一般原則ではなく聖書の律法が直接の指示対象である。ただし本文では「モーセの律法」と説明的に限定せず、原文の簡潔さを保った。
- issue: 二つの修辞疑問が示す論証関係
  choice: 第一の問いの否定的含意と第二の問いの肯定的含意を疑問形のまま保持する
  alternative: 「これは人間的な考えだけでなく、律法も述べている」と平叙文にする
  rationale: 原文の対話的な論証と修辞的緊張を保ち、解釈を本文中で明文化しすぎないため。
translation_notes:
  register: 明瞭で現代的ながら、議論の格調を保つ標準的な文体。「単に」を用いて、律法の証言と対比される『人間的な根拠だけ』という含意を自然に示した。
