source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: ja
  text: もし私たちがあなたがたの間に霊的なものを蒔いたのなら、あなたがたから物質的なもの[a]を刈り取るのは、あまりに大きなことでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この世の生活に属するもの」。ギリシア語では、「霊的なもの」と、身体的・物質的な日常生活に属するものとが対比されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: 霊的なもの
  rationale: 中性複数の形容詞が名詞的に用いられ、霊的な益や働きを広く指す。意味を特定しすぎず、後続の「物質的なもの」との対比も保つ。
- source_word: ἐσπείραμεν
  choice: 蒔いた
  rationale: アオリストが指す、すでに行われた宣教の働きを自然な日本語で表し、蒔く・刈り取るという農耕の比喩を維持する。
- source_word: ὑμῖν
  choice: あなたがたの間に
  rationale: 与格は、コリントの人々に対して、また彼らの中で行われた働きを示す。「間に」は種を蒔く比喩にも自然になじむ。
- source_word: μέγα
  choice: 大きすぎること
  rationale: 修辞疑問の中で、要求が過大または不当なのかを問う語。原語の「大きい」という像を残しつつ、文脈上の過大さを明示する。
- source_word: τὰ σαρκικὰ
  choice: 物質的なもの
  rationale: ここでは罪深い性質ではなく、身体的・日常的生活に属する支援を指す。「肉的なもの」より誤解が少なく、霊的な働きに対する生活上の扶養という文脈に合う。
- source_word: θερίσομεν
  choice: 刈り取る
  rationale: 未来形の見込みを「刈り取るとしても」という条件的表現で自然に示し、蒔く・刈り取るという比喩を保つ。
- source_word: ὑμῶν
  choice: あなたがたから
  rationale: 属格を供給源として自然に表し、物質的支援がコリントの人々から来ることを示す。
- source_word: ἡμεῖς
  choice: 私たち
  rationale: 原文で反復される明示的な代名詞を訳し、霊的に蒔いた者と支援を受ける者が同じ「私たち」であるという対照を保つ。
theological_decisions:
- issue: τὰ σαρκικὰ と τὰ πνευματικὰ の対比
  choice: 宣教への物質的・生活上の支援を指す
  alternative: 罪深い意味を帯びた「肉的なもの」
  rationale: 文脈は使徒が生活の支援を受ける権利について論じている。ここでの対比は聖と罪ではなく、霊的な奉仕と物質的・身体的生活に属する支えとの対比である。
translation_notes:
  register: 明瞭な現代標準語を用いながら、原文の修辞疑問と蒔く・刈り取る比喩を保持した。「物質的なもの」は金銭だけに限定せず、生活上の支援全般を含みうる表現とした。
