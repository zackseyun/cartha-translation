source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: ja
  text: それとも、神はもっぱら私たちのためにこう言っておられるのでしょうか。これは私たちのために書かれたのです。耕す者は希望をもって耕すべきであり、脱穀する者は分け前にあずかる希望をもって脱穀すべきだからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「耕す者は希望をもって耕すべきであり、脱穀する者は、あずかることを希望して（脱穀すべきである）」となります。「脱穀すべきである」は前半の「べきである」が後半にも及ぶものです。何にあずかるかは原文に明記されていません。
    reason: implicit_object_and_syntax
lexical_decisions:
- source_word: πάντως
  choice: ひたすら／確かに
  rationale: 修辞疑問を強める副詞であり、第一文では「ひたすら」により「全面的に、まさに」の含みを表した。続く文の肯定的な流れは日本語で自然になるよう「確かに」で受けたが、原文に独立した「はい」はないため補っていない。
- source_word: δι’ ἡμᾶς
  choice: 私たちのために
  rationale: διά＋対格の理由・利益の意味を、文脈に適した自然な日本語で表す。
- source_word: ἐγράφη
  choice: 書かれました
  rationale: アオリスト受動を素直な過去形で訳し、聖書の記述を指す受動表現を保つ。
- source_word: ὀφείλει
  choice: べきです
  rationale: 義務・当然性を表しつつ、強制を過度に強めない。
- source_word: ἐπ’ ἐλπίδι
  choice: 望みを抱いて
  rationale: 労働を支える期待を、明瞭で自然な現代日本語として表す。
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: 耕す者は……耕し
  rationale: 分詞と同根の不定詞の反復、および一般的な働き手という意味を保つ。
- source_word: ὁ ἀλοῶν
  choice: 脱穀する者
  rationale: 農作業を表す語を具体的かつ一般的な表現で訳し、前節との並行を保つ。
- source_word: τοῦ μετέχειν
  choice: 分け前にあずかる
  rationale: μετέχωの参与・分有の意味を表す。対象は原文で明示されていないため、「収穫」と限定せず、農作業の文脈から理解できる表現とした。
theological_decisions:
- issue: πάντωςと修辞疑問の関係
  choice: 「ひたすら」で疑問文を強め、続く説明を「確かに」で自然につなぐ
  alternative: 「そもそも私たちのために言っているのではありませんか」または「全面的に私たちのために」
  rationale: 副詞が「全面的に」を意味するか、「確かに」を意味して疑問全体を強めるかには幅がある。本文ではその緊張を脚注で示し、一義的に固定しない。
- issue: μετέχεινの暗黙の対象
  choice: 「分け前にあずかる」とし、対象を特定しない
  alternative: 「収穫の分け前にあずかる」
  rationale: 農業の比喩から収穫物が想定されるが、ギリシア語本文には目的語がない。パウロの論旨を先取りして限定しないよう、暗黙性を保った。
- issue: 二つの労働者にかかるὀφείλει
  choice: 日本語では両者を一つの「べき」でまとめる
  alternative: 「耕すべきであり、脱穀するべきです」と各節で反復する
  rationale: ギリシア語ではὀφείλειが最初の節に明示され、後半にも並行的に及ぶ。日本語で意味を欠かさず、過度な補足を避けた。
translation_notes:
  register: 明瞭で品位ある現代標準語。「神」は原文の三人称単数動詞の主語を文脈上明示したもの。「こう言っておられる」で直前の聖書引用を受ける。農業語彙は一般読者に理解できる「耕す」「脱穀する」を用いた。
