revisions:
- from: それとも、神はひたすら私たちのためにこう言っておられるのでしょうか。確かに[a]、これは私たちのために書かれました。耕す者は望みを抱いて耕し、脱穀する者は分け前にあずかる望みを抱いて働くべきだからです。[b]
  to: それとも、神はもっぱら私たちのためにこう言っておられるのでしょうか。これは私たちのために書かれたのです。耕す者は希望をもって耕すべきであり、脱穀する者は分け前にあずかる希望をもって脱穀すべきだからです。[a]
  rationale: 原文の反復（耕す者は耕す、脱穀する者は脱穀する）と、前半のὀφείλειが後半にも及ぶ並行関係を本文で保ちました。πάντωςは「もっぱら」として、神の発言が人間、特に「私たち」のためだけに向けられているという修辞的な強調を表しました。「確かに」は原文に対応する独立語がないため本文から外し、γάρの理由説明を「だからです」で示しました。目的語の省略は維持し、「分け前にあずかる」としました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:44Z'
review_pass:
  verdict: revise
  source_fidelity: 後半の「働くべき」は原文にありません。ギリシア語は「脱穀する者は、分け前にあずかることを期待して（脱穀すべきである）」という並行構文で、前半のὀφείλει（べきである）が後半にも及びます。したがって、「働く」は農作業一般へ意味を広げ、原文の「脱穀」の反復を失わせます。また、「望みを抱いて」は可能ですが、ἐπ’ ἐλπίδιの反復は「希望をもって」とするほうが簡潔で明瞭です。
  naturalness: 全体として自然で品位ある現代日本語です。ただし「ひたすら私たちのために」は、ここでは「もっぱら私たちのために」または「全く私たちのために」のほうが、πάντωςの範囲・強調を自然に表します。「確かに」は原文の独立した肯定語ではなく、γάρによる説明の開始をやや強く補っています。
  terminology: 「耕す者」「脱穀する者」「分け前にあずかる」は適切です。「神」は直前の引用の発話者として文脈上補うことができます。μετέχεινの目的語を「分け前」として明示せず、文脈上の参与として保つ方針も妥当です。
  issues:
  - severity: medium
    issue: 「脱穀する者は……働くべき」の「働く」が原文の「脱穀する」を置き換えている。
    rationale: ὁ ἀλοῶνに対応する動詞の反復が日本語本文からなくなります。前節のὀφείλειが後節にも統語的・意味的に及ぶため、「脱穀すべき」と明示して並行を保つのが安全です。
  - severity: low
    issue: 「ひたすら」は「一心に」などの意味にも受け取られうる。
    rationale: πάντωςはこの修辞疑問では全面性・強い確言を表すため、「もっぱら」がより明確です。
  - severity: low
    issue: 脚注bの「直訳では」は、本文と異なる説明を含む。
    rationale: 「直訳」の提示で後半の省略された「脱穀すべきであり」を補うなら、その補いが前半のὀφείλειに基づくことを明示するほうが正確です。
