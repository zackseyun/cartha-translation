  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: ja
  text: 私が福音を宣べ伝えても[a]、私には誇る理由がありません。というのも、私はそうせざるを得ない立場に置かれているからです[b]。福音を宣べ伝えないなら、私は災いに遭います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「良い知らせを告げても」。後半の「福音を宣べ伝えない」も同様。
    reason: lexical_alternative
  - marker: b
    text: 直訳「必要が私の上に置かれているからです」。
    reason: literal_rendering
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: 福音を宣べ伝える
  rationale: この動詞は「良い知らせを告げ知らせる」ことを意味する。この箇所では告げる内容である福音が明白に含意されているため、二つの用例をともに「福音を宣べ伝える」とした。
- source_word: καύχημα
  choice: 誇り
  rationale: 自ら誇る根拠、または誇りとするものを指す。日本語では「私の誇りにはなりません」とすることで、自慢する行為だけでなく、誇る根拠がないという意味を自然に表した。
- source_word: ἀνάγκη
  choice: そうせざるを得ない必要
  rationale: 外から課される必要、強制、避けられない拘束を表す。源を特定せず、単なる自発的な願望でもないことを示すため、この表現を選んだ。
- source_word: ἐπίκειται
  choice: 私に負わされている
  rationale: 何かが人の上にのしかかる、または課される意味を持つ。義務の重みを示しつつ、その源を本文以上に明示しない表現とした。
- source_word: οὐαί
  choice: 災いです
  rationale: 深刻な苦境や災厄を告げる厳粛な感嘆表現である。「悲しい」より強く、預言的な響きも保つ。
- source_word: ἐὰν μή
  choice: ないなら
  rationale: 否定条件を明瞭かつ自然な現代日本語で表した。
- source_word: γάρ
  choice: からです／文脈上の理由説明
  rationale: 繰り返されるγάρはいずれも理由・説明を導く。最初のγάρは前節とのつながりに属するため、日本語では冒頭に機械的な接続語を置かず、節全体の説明的な流れで表した。後続のγάρは「からです」で明示した。
theological_decisions:
- issue: パウロが福音を宣べ伝えざるを得ない理由とその源
  choice: 必要がパウロに負わされていると訳し、その源は特定しない
  alternative: 「神から使命を授けられている」または「内から強く迫られている」と明示する
  rationale: 本文は避けられない必要が彼の上にあることを述べるが、この節自体では、それが神の委託、内的衝動、外的事情のどれであるかを明示していないため。
- issue: 「福音を宣べ伝えないなら、私は災いです」の含意
  choice: 災いの具体的な内容を説明せず、厳粛な警告として保つ
  alternative: 神の裁き、処罰、個人的苦悩などに具体化する
  rationale: οὐαίは深刻な災いを示すが、この節ではその性質が限定されていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「宣べ伝える」「災いです」によって原文の厳粛で宣教的な調子を保った。「そうせざるを得ない必要」はやや重みのある表現だが、ἀνάγκηとἐπίκειταιが示す避けがたい拘束を、源を限定せずに伝えるため採用した。
