id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: ja
  text: では、私の報いとは何でしょうか。それは、良い知らせを宣べ伝えるときに、それを無償で提供し、そうして良い知らせに関する私の権利を十分に行使しないことです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「良い知らせを宣べ伝える働きにおける私の権利を十分に行使しない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: 報い
  rationale: 文脈上、単なる賃金ではなく、パウロが宣教によって得るものを指す修辞的表現であるため。「報い」は、無償で宣べ伝えること自体が彼の報いだという逆説も保つ。
- source_word: εὐαγγελιζόμενος
  choice: 良い知らせを宣べ伝えるとき
  rationale: 分詞の同時的な意味と動詞としての力を自然な日本語で表す。
- source_word: ἀδάπανον
  choice: 無償で
  rationale: 費用や代価を求めないという意味を、簡潔で自然な現代日本語で示す。
- source_word: θήσω τὸ εὐαγγέλιον
  choice: 良い知らせを…提供し
  rationale: 直訳は「良い知らせを置く」だが、この文脈では人々に無償で差し出す意。日本語として自然な「提供する」を用いた。
- source_word: εὐαγγέλιον
  choice: 良い知らせ
  rationale: 語の基本的意味を明瞭な現代日本語で表し、伝統的な「福音」に限定しない。
- source_word: καταχρήσασθαι
  choice: 十分には用いない
  rationale: 正当な権利を全面的に行使しないという文脈に合い、不正利用や濫用の意味を不必要に持ち込まない。
- source_word: ἐξουσίᾳ
  choice: 権利
  rationale: この章では宣教者が生活上の支援を受ける正当な資格が中心であり、「権威」より「権利」が文脈に即する。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 良い知らせに関して
  rationale: ギリシャ語の簡潔さを保ちつつ、「良い知らせの宣教において」という関係を自然に示す。より明示的な理解は脚注に置く。
theological_decisions:
- issue: 文脈におけるパウロのἐξουσίαの性質
  choice: 良い知らせの宣教に伴う支援を受ける正当な権利であり、パウロはそれを十分には行使しない。
  alternative: より広い使徒的権威を指す、または権威の濫用を示唆する。
  rationale: 第一コリント9章の前後では、使徒が物質的支援を受ける権利が繰り返し論じられる。したがって、不当な支配を示す語ではなく「権利」「十分には用いない」とした。
- issue: εὐαγγέλιονの訳語
  choice: 良い知らせ
  alternative: 福音
  rationale: 原語の平明な意味を現代の一般読者に直接伝えるため。「福音」も可能だが、本文ではより透明な表現を採用した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、修辞疑問と、無償で宣べ伝えることが自身の「報い」であるという逆説を保った。「良い知らせ」を反復して原文のεὐαγγέλιονの反復を再現した。
