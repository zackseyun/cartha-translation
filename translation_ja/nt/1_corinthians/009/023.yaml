- from: しかし私は、良い知らせ[a]のためにすべてのことをしています。それは、私もほかの人々とともに、その良い知らせにあずかる者となるためです。[b]
  to: しかし私は、良い知らせ[a]のためにすべてのことをしています。それは、私自身もその良い知らせにともにあずかる者となるためです。[b]
  rationale: 共同性を表すσυγκοινωνόςに対応する「ともに」は保持しつつ、原文にない「ほかの人々」という明示的な補足を除きました。本文は、良い知らせとの参与が祝福・宣教・前進のどれに限られるかを決めず、原文の広がりを維持しています。脚注bも、本文の指示対象と共同参与の意味が明確になるよう整えました。
