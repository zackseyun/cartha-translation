  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: ja
  text: しかし私は、良い知らせ[a]のためにすべてのことをしています。それは、私自身もその良い知らせにともにあずかる者となるためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「福音」。
    reason: lexical_alternative
  - marker: b
    text: または「私もそれをともに分かち合うためです」「私もその良い知らせを分かち合う者となるためです」。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: すべてのこと
  rationale: 目的語として包括的に用いられている中性複数形。直前の文脈で述べた多様な対応を広く指すため、「すべてのこと」とした。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの議論を受ける軽い対比を表す。日本語では「しかし」がその逆接を明確かつ自然に示す。
- source_word: ποιῶ
  choice: しています
  rationale: 現在形が示す継続的・習慣的な行為を、現代日本語で自然に表した。
- source_word: διὰ τὸ εὐαγγέλιον
  choice: 良い知らせのために
  rationale: διά＋対格が示す動機・目的・利益の幅を保つ。「福音」よりも原語の意味を一般読者に直接伝える「良い知らせ」を本文に採用した。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 目的節であることを明確にし、前半とのつながりを自然な日本語で示した。
- source_word: συγκοινωνὸς
  choice: ほかの人々とともに、…にあずかる者
  rationale: συν-の共同性とκοινωνόςの参与の意味をともに表す。「共同参加者」のような不自然な直訳を避けつつ、誰とともに参与するかを限定しすぎない表現とした。
- source_word: αὐτοῦ
  choice: その良い知らせに
  rationale: 直近の中性名詞εὐαγγέλιονを受けると判断した。日本語では指示対象を明示するほうが自然であり、「それに」より誤解が少ない。
- source_word: γένωμαι
  choice: 者となる
  rationale: γίνομαιの「なる」という変化・到達の含みを保持した。
theological_decisions:
- issue: パウロが「良い知らせにあずかる」と言う意味
  choice: 良い知らせそのものへの共同参与として幅を保つ
  alternative: 良い知らせの祝福にあずかる／その宣教に協力する／その働きの仲間となる
  rationale: συγκοινωνός αὐτοῦは、良い知らせの祝福、前進、宣教への参与のいずれか一つに限定されない。本文では「あずかる者」とし、恩恵と使命の両面を含み得る原文の神学的な幅を残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「良い知らせ」を本文に置き、伝統的な教会語「福音」は脚注に示した。συγκοινωνόςは原語の共同性を落とさないよう「ほかの人々とともに」を補い、「あずかる者」で参与の幅を保った。脚注記号は対応箇所にすべて明示した。
