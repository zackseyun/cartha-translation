id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: ja
  text: 同じように、主も、福音を宣べ伝える人たちは福音によって生活するようにと命じられました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「福音によって生計を立てるように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 同じように
  rationale: 直前に挙げられた諸例との類比を明確にしつつ、現代日本語として自然に表現する。
- source_word: καὶ
  choice: も
  rationale: これまでの論拠に加えて、主も命じたという付加の意味を簡潔に示す。
- source_word: ὁ κύριος
  choice: 主
  rationale: パウロ書簡で確立した訳語を用いる。文脈上は主イエスを指す可能性が高いが、原文どおり『主』にとどめる。
- source_word: διέταξεν
  choice: 命じられました
  rationale: 権威ある指示を表す動詞の力を保ち、主への敬意を示す自然な敬語表現とする。
- source_word: τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν
  choice: 福音を宣べ伝える人たち
  rationale: 冠詞付き分詞を人々を指す表現として訳し、καταγγέλλωの公に告げ知らせる意味を『宣べ伝える』で表す。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡における定着した、簡潔で理解可能な訳語を採用する。
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: 福音によって
  rationale: ἐκが示す生活の糧の源を日本語として自然に表す。具体的には福音宣教に伴う支援を意味するが、本文では原文の簡潔さを保つ。
- source_word: ζῆν
  choice: 生活する
  rationale: 文脈上、単に生きることではなく生活の糧を得ることを指すため、『生活する』が自然である。命令内容は『ようにと』で示す。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文では原文どおり『主』とし、イエスという名を補わない
  alternative: 『主イエス』と明示する
  rationale: 文脈上はイエスの教えへの言及と考えるのが自然だが、κύριος自体には『イエス』の名がないため、訳文で限定しない。
- issue: 「福音によって生活する」の意味
  choice: 福音宣教に携わる人が、その働きに伴う物質的支援によって生活すること
  alternative: 福音から霊的ないのちを受けること
  rationale: 直前から続く議論は働き手が生活上の支援を受ける権利についてである。ただし本文は説明を加えすぎず、原文の表現を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。『宣べ伝える』は聖書語として定着しつつ一般にも理解可能であり、『福音によって生活する』という原文の簡潔な表現を残した。脚注標識は該当文末に置いた。
