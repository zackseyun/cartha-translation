  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: ja
  text: 競技場で走る人たちは皆走りますが、賞を受けるのは一人だけだということを、あなたがたは知らないのですか。そのように走りなさい。賞を得られるように[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「賞を手に入れるために」または「賞をつかみ取れるように」。ギリシア語は「手に入れる」「つかむ」「到達する」などの意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: 知らないのですか
  rationale: パウロの修辞疑問を保ちつつ、現代日本語として自然な形にした。
- source_word: ἐν σταδίῳ
  choice: 競技場で
  rationale: στάδιον が指す走競技の場所を具体的に表し、競走の比喩を明確に保った。
- source_word: τρέχοντες ... τρέχουσιν
  choice: 走る人たちは皆走ります
  rationale: τρέχω の反復を日本語でも残し、原文の鮮明な競技イメージを保った。
- source_word: πάντες μὲν ... εἷς δὲ
  choice: 皆……が、……一人だけ
  rationale: μέν...δέ の対比を自然な日本語で明瞭に示した。
- source_word: λαμβάνει τὸ βραβεῖον
  choice: 賞を受ける
  rationale: λαμβάνει の直接的な意味を保ち、「勝つ」と解釈的に言い換えすぎないようにした。
- source_word: οὕτως τρέχετε
  choice: あなたがたも、……走りなさい
  rationale: 直前の競走者の姿を模範として受ける οὕτως を「も」で自然に示し、現在命令形の力強い勧告を簡潔に表した。
- source_word: ἵνα καταλάβητε
  choice: 賞を勝ち取れるように
  rationale: καταλαμβάνω の「手に入れる、獲得する」という意味を賞の文脈に即して自然に表現した。目的を示す ἵνα も明示した。
theological_decisions:
- issue: 競走の比喩とキリスト者の歩み
  choice: 競争的な競走のイメージと、賞を目指す勧告をそのまま保つ
  alternative: 救いや報いについて特定の教理的結論を補って訳す
  rationale: 本文は鍛錬された追求を促す競技の比喩であり、賞の厳密な神学的内容や功績、救いの条件をここで特定してはいないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、修辞疑問と競走の反復を保った。「競技場」は日本語で走路を含む施設を自然に指す。命令部分では、原文の οὕτως が直前の例を受けることを「あなたがたも」で表した。
