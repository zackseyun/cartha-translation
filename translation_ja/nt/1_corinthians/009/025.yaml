  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: ja
  text: 競技に参加する人は皆、あらゆる点で自制します。彼らがそうするのは、朽ちる冠[a]を受けるためです。しかし私たちは、朽ちない冠を受けるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「冠」は「花冠」とも訳せる。ギリシア語は、競技の勝者に授けられる冠を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: 競技に出る人は皆
  rationale: 競技という直前の文脈を明確にしつつ、総称的な単数表現の包括性を自然な現代日本語で表した。
- source_word: πάντα ἐγκρατεύεται
  choice: あらゆることに節制します
  rationale: πάντα の範囲を食事などに限定せず、ἐγκρατεύεται の継続的・実践的な自己抑制を簡潔に表した。
- source_word: ἐκεῖνοι μὲν οὖν ἵνα
  choice: 彼らは…ためにそうするのですが
  rationale: 先に述べた競技者を受け、原文で省略されている節制の行為を日本語で補いながら、ἡμεῖς δέ との対比を保った。
- source_word: φθαρτὸν στέφανον
  choice: 朽ちる冠
  rationale: φθαρτός と ἄφθαρτος の対照を「朽ちる／朽ちない」で直接的に再現した。στέφανος は勝者に授けられる冠だが、比喩の広がりを保つため本文では「冠」とした。
- source_word: λάβωσιν
  choice: 受ける
  rationale: 競技の賞として授けられるものを取得するという目的を、自然な日本語で表した。
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: 私たちは朽ちない冠を受けるためにそうするのです
  rationale: 原文では「冠」と動詞が省略されているが、日本語で意味と対比を明瞭にするため補った。内容は先行句から直接回収でき、解釈上の限定を加えていない。
theological_decisions:
- issue: 報いの比喩が指すもの
  choice: 「朽ちない冠」という競技の賞の比喩をそのまま保つ
  alternative: 永遠の命、または天上の報いと明示する
  rationale: この節自体は冠が具体的に何を指すかを定義していないため、特定の教理的解釈に狭めず、一時的な賞と朽ちない賞との対比を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「節制」は文脈に適した一般的な語として用い、対象を特定の訓練項目に限定しない。対照を読み取りやすくするため、後半では原文の省略要素を自然に補った。
