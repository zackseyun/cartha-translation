source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: ja
  text: いったい、自分で費用を負担して兵役に就く者がいるでしょうか。ぶどう畑を造り、その実を食べない者がいるでしょうか。また、群れを飼って、その群れの乳を飲まない者がいるでしょうか。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の給料（または糧食）で」とも訳せる。ギリシア語は兵士に支給される給与や糧食を指し、ここでは兵役の費用を兵士自身が負担することはない、という意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その群れの乳から食べない」。日本語では乳について通常「飲む」と言うため、このように訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: 兵役に就く
  rationale: 軍務に服することを表す動詞。実際の戦闘に限定せず、軍人として務めるという職業的なたとえを自然な日本語で保つ。
- source_word: ἰδίοις ὀψωνίοις
  choice: 自分で費用を負担して
  rationale: ὀψώνιονは本来、兵士の給与や糧食を指す。ここでは軍務の費用を本人が負担するという意味なので、文脈上の要点を明確に表した。
- source_word: ποτέ
  choice: いったい…いるでしょうか
  rationale: 修辞疑問における「いつそのようなことがあるか／果たして」を、日本語では「いったい」と疑問表現によって自然に示した。
- source_word: φυτεύει ἀμπελῶνα
  choice: ぶどう畑を造り
  rationale: 直訳的には「ぶどう畑を植える」。日本語では畑そのものについて「造る」が自然で、ぶどうを植えて畑を設ける意味を伝える。
- source_word: τὸν καρπὸν αὐτοῦ
  choice: その実
  rationale: καρπόςはここではぶどう畑が産する果実を指す。「その実」は簡潔で、先行するぶどう畑との関係も明瞭。
- source_word: ποιμαίνει ποίμνην
  choice: 群れを飼い
  rationale: 家畜の群れを牧し、世話する意味。「群れを飼う」は一般読者に明快で、牧畜の比喩を保つ。
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: その群れの乳を
  rationale: 群れから得られる乳にあずかるという起点・部分の含意を、自然な日本語で表現した。
- source_word: ἐσθίει
  choice: 食べる／飲む
  rationale: ギリシア語は両箇所とも字義的には「食べる」だが、乳について日本語では通常「飲む」と言うため、対象に応じて訳し分けた。
theological_decisions:
- issue: 三つの修辞疑問が示す働く者の受益の原則
  choice: 各職業の従事者がその働きから支えを受けるという含意を、三つの並行した疑問文として保持した。
  alternative: 権利や報酬という結論を本文中で明示する。
  rationale: 原文は具体例による修辞疑問にとどめ、適用は文脈から導かせているため、解釈上の結論を本文へ付加しない。
- issue: 反復されるτίςの一般的人称
  choice: 「者」を用いて一般的な単数として訳した。
  alternative: 「人」または複数形で訳す。
  rationale: ギリシア語の単数による代表的・一般的な問いを、日本語で性別を不必要に明示せず自然に保持できる。
translation_notes:
  register: 明瞭な現代標準語を用い、三つの修辞疑問の並行性と dignified な語調を保持した。「いったい」は最初の疑問に置き、ποτέの強調を自然に示した。
