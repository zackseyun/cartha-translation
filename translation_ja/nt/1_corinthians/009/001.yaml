source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: ja
  text: 私は自由ではありませんか。私は使徒ではありませんか。私は私たちの主イエスを見たのではありませんか。あなたがたは、主にあって、私の働きの成果ではありませんか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: 自由な者
  rationale: 直前から続く自由と権利の主張を表しつつ、人について述べる日本語として自然にした。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 単なる使者ではなく、パウロが主張する使徒としての務めを指す定着した用語である。
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: 私たちの主イエス
  rationale: 各語の関係を明確にし、現代日本語で自然なキリスト称号の語順とした。
- source_word: ἑόρακα
  choice: 見た
  rationale: 完了形が示す現在にも及ぶ意義は文脈に委ね、日本語では経験を問う自然な形にした。原文にない「復活した」は補わない。
- source_word: ἔργον
  choice: 私が働いた実り
  rationale: コリントの信徒たちがパウロの使徒的働きの成果であるという意味を、単に「私の仕事」として誤解されないよう自然に表した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡に特徴的な、主との関係・領域を示す表現を簡潔に保った。
- source_word: οὐκ / οὐχὶ / οὐ
  choice: ～ではありませんか
  rationale: 肯定の答えを期待する四つの修辞疑問を、統一した自然な否定疑問で表した。
theological_decisions:
- issue: パウロがイエスを見たという主張の意味
  choice: 使徒性を裏づける、イエスを見た経験への言及として訳すが、「復活した」は本文に補わない
  alternative: 復活後のイエスを見たことを本文で明示する
  rationale: 文脈上は復活したイエスの顕現が念頭にあると考えられるが、ギリシア語本文は単に「私たちの主イエスを見た」と述べるため、その簡潔さと含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、四つの修辞疑問の反復と勢いを保った。「私が働いた実り」は、直訳的な「私の仕事」が人を指す日本語として不自然かつ曖昧になるのを避ける最小限の明示化である。
