source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: ja
  text: あなたがたは知らないのですか。聖なる務めに携わる人たちは神殿からのものを食べ、祭壇に仕える人たちは祭壇に献げられたものの分け前を受けるのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「祭壇と分け合う」。すなわち、祭壇に献げられた犠牲の一部を受け取ること。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: あなたがたは知らないのですか
  rationale: パウロに特徴的な修辞疑問の形を保ちつつ、現代日本語として自然で明瞭にした。
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: 聖なる務めに携わる人たち
  rationale: τὰ ἱερά は「聖なるもの」を指し得るが、ἐργάζομαι との組み合わせは祭儀上の奉仕を表す。「神殿で働く」と限定しすぎず、原文の聖なる奉仕という含みを残した。
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: 神殿からのものを食べ
  rationale: 原文の「食べる」という具体的な表現と、神殿に由来する食物という関係を保った。
- source_word: ἱεροῦ
  choice: 神殿
  rationale: ἱερόν は通常、内陣だけでなく神殿域を指すため、標準的で分かりやすい「神殿」とした。
- source_word: οἱ τῷ θυσιαστηρίῳ παρεδρεύοντες
  choice: 祭壇に仕える人たち
  rationale: παρεδρεύω の「そばに付き添う、務めに当たる」という祭儀的意味を自然な日本語で表した。
- source_word: τῷ θυσιαστηρίῳ συμμερίζονται
  choice: 祭壇に献げられたものの分け前を受ける
  rationale: 字義的には「祭壇と分け合う」だが、日本語で意味が伝わるよう、祭壇に関わる犠牲の分け前を受けることを明示した。
theological_decisions:
- issue: 聖なる奉仕に携わる者への物質的な支え
  choice: 神殿奉仕者と祭壇奉仕者が、その奉仕に伴う食物の分け前を得るという祭儀的原則を示す
  alternative: 後代の教会制度や聖職者制度への直接的言及として訳す
  rationale: この節では神殿と祭壇の慣行が類比として述べられているため、その範囲を越える制度的解釈を本文に持ち込まない。
- issue: τῷ θυσιαστηρίῳ συμμερίζονται の表現
  choice: 祭壇に献げられたものの分け前を受ける
  alternative: 祭壇と分け合う
  rationale: 原文の比喩的な構文を脚注に残しつつ、本文では実際の祭儀上の意味が明瞭になるようにした。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「聖なる務め」は祭儀的文脈を保ち、「分け前を受ける」は読者に具体的な意味が伝わる表現とした。
