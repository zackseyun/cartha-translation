source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: ja
  text: しかし私は、これらのものを何一つ用いてきませんでした[a]。また、このようにしてもらうために、これらのことを書いたのでもありません。私はむしろ死ぬほうがよい――私の誇りを、だれも無にすることはありません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は、直前に述べられた使徒としての「権利」を指します。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語原文は「～よりも」のところで文が途切れ、その後「私の誇りを、だれも無にすることはない」と続きます。意味を滑らかにすれば、「私の誇りをだれかに無にされるくらいなら、むしろ死ぬほうがよい」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: 用いてきませんでした
  rationale: 完了形が表す、これまで利用せず現在に至る状態を自然な日本語で示す。「利用する」よりも不当利用の含みが少ない。
- source_word: οὐδενὶ τούτων
  choice: これらのものを何一つ
  rationale: 直訳的な指示表現を保ちつつ、文脈上は直前に論じられた使徒としての権利を指すことを脚注で明示する。
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: このようにしてもらおうと思って
  rationale: パウロが自分に同様の待遇を与えさせる目的で書いたのではない、という圧縮されたギリシア語の趣旨を自然に表す。
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: 私はむしろ死んだほうがよい
  rationale: 比較を伴う強い選好を示し、後続の「そうされるくらいなら」と結び付ける。
- source_word: τὸ καύχημά μου
  choice: 私の誇り
  rationale: ここでは無報酬で福音を宣べ伝えることについての誇る根拠を指す。「誇り」は行為だけでなく、その根拠も含み得る自然な表現。
- source_word: κενώσει
  choice: 空しいものにはさせません
  rationale: 「空にする」という比喩を残しながら、誇りを無効・無内容にするという意味を明瞭な日本語で表す。
theological_decisions:
- issue: ἤ の後で中断する破格構文
  choice: 「そうされるくらいなら――」という補助を最小限に置き、ダッシュで中断を表示する
  alternative: 「私の誇りをだれかに空しいものにされるくらいなら、むしろ死んだほうがよい」と平滑化する
  rationale: 原文は「～よりも」の後で構文が途切れ、別の強い宣言へ移る。意味の理解に必要な最小限の補いを示しつつ、感情的な中断と緊張を残す。
- issue: καύχημα の神学的含意
  choice: 「私の誇り」
  alternative: 「私が誇る根拠」
  rationale: 無報酬の奉仕を救いの功績と断定せず、この文脈におけるパウロの誇りまたは誇る根拠という語義上の幅を保つ。
translation_notes:
  register: 現代の一般読者に理解しやすい、明瞭で品位ある文体。「しかし」「また」で論理関係を示し、原文の強い感情と破格構文はダッシュで保持した。
