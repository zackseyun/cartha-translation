  source_fidelity: 冒頭の「これらのものを何一つ用いてきませんでした」は、κέχρημαι（完了・中動態）とοὐδενὶ τούτωνをよく反映している。しかし後半は、γάρを「死んだほうがよいからです」と独立した理由節にし、その後に「そうされるくらいなら」を補っているため、原文の一続きの破格構文と、ἤ（「…よりも／…するくらいなら」）の直後での中断が不正確になっている。補いを本文から除き、ダッシュによる中断を保つのが安全である。
  naturalness: 「私はむしろ死ぬほうがよい――私の誇りを、だれも無にすることはありません」は、原文の切迫した中断を保ちつつ、現代標準日本語として明瞭である。「無にする」はこの文脈で「空にする／無効にする」という比喩を自然に伝える。
  terminology: 「権利」という脚注の文脈的説明、「私の誇り」というκαύχημαの訳語は適切である。「私の誇りを、だれも無にすることはありません」はκενώσειの比喩的意味を保ち、特定の教理的解釈を加えない。
