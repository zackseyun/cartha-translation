    rationale: 「私はむしろ死んだほうがよいからです。そうされるくらいなら――」は、γάρを前文の理由として完結させ、原文にはない「そうされるくらいなら」を後置している。ギリシア語は「死ぬほうがよい、というより――私の誇りをだれも…」という形で、ἤの後に中断する。
  - severity: low
    issue: κενώσειの日本語表現
    rationale: 「空しいものにはさせません」でも意味は通るが、「だれも無にすることはありません」のほうが、主語οὐδείςと未来形κενώσειを直接的かつ自然に表し、比喩も保てる。
