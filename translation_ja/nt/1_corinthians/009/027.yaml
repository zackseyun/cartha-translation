  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: ja
  text: しかし、私は自分の体を厳しく鍛え[a]、奴隷にします[b]。それは、ほかの人々に宣べ伝えた後で、自分自身が失格者にならないためです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の体を打ちたたき」。このギリシア語は、文字どおりには「目の下を打つ」ことを指し、ここでは厳しい自己鍛錬の比喩として用いられています。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「奴隷にします」または「奴隷の身に引き入れます」。
    reason: lexical_alternative
  - marker: c
    text: 「失格者」は「退けられた者」「試験に不合格となった者」とも訳せます。ここでは前後の競技の比喩に合う訳語を用いています。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: 厳しく鍛え
  rationale: 原義には「目の下を打つ」「打ちたたく」という強い身体的イメージがあるが、ここでは競技者の厳しい自己鍛錬を比喩的に表す。現代日本語で自傷行為と誤解されにくく、比喩の厳しさも伝わる表現とした。原義は脚注に残した。
- source_word: σῶμα
  choice: 自分の体
  rationale: パウロが鍛錬の対象として明示する具体的な「体」を保ち、「自分自身」などへ一般化しなかった。
- source_word: δουλαγωγῶ
  choice: 奴隷として従わせます
  rationale: 「奴隷にする、奴隷として服従させる」という強い比喩を保った。「制御する」のような弱い表現にはしなかった。
- source_word: μή πως
  choice: ならないためです
  rationale: 懸念を伴う否定目的を自然な日本語で示す。文脈上の警戒の意味は、結末全体によって十分に伝わる。
- source_word: ἄλλοις
  choice: ほかの人々に
  rationale: κηρύξαςの相手を示す与格を、明瞭で自然な日本語にした。
- source_word: κηρύξας
  choice: 宣べ伝えた後で
  rationale: 公に告げ知らせる意味を「宣べ伝える」で表し、アオリスト分詞が主動詞に先行する関係を「後で」によって明示した。
- source_word: ἀδόκιμος
  choice: 失格者
  rationale: 直前の競走・節制・賞という競技の比喩に合い、試験に耐えず承認されないという含みを保つ。救いの喪失か、奉仕や報いに関する失格かを訳文で限定しない。
- source_word: γένωμαι
  choice: ならない
  rationale: μή πωςに続く接続法が示す、将来起こり得ることへの懸念を自然に表した。
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前との強い対照を、明瞭な現代日本語の接続詞で示した。
theological_decisions:
- issue: パウロがἀδόκιμοςとなることを恐れる意味
  choice: 競技の比喩に即して「失格者」とし、警告の深刻さを保ちつつ、その失格の最終的範囲を特定しない。
  alternative: 神による最終的な拒絶、または奉仕の資格や報いだけの喪失と限定する。
  rationale: ギリシア語と文脈だけでは、ここで救いの喪失か奉仕・報いの喪失かを明確に限定できない。「失格者」は競技的文脈を生かしながら、神学的緊張と真正な曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的な「です・ます」調を用いつつ、競技と奴隷という原文の強い比喩を保った。「厳しく鍛える」は自然な日本語を優先し、より字義的な打撃のイメージは脚注で示した。
