  text: ἐγὼ τοίνυν οὕτως τρέχω ὡς οὐκ ἀδήλως, οὕτως πυκτεύω ὡς οὐκ ἀέρα δέρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: ja
  text: ですから、私はこのように走ります。あてもなく走るのではありません[a]。また、このように拳闘します。空を打つようなことはしません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不確かに」とも訳せる。ギリシャ語の副詞は、明確さがないこと、または定まった目標がないことを表し得る。ここでは競走の比喩なので、「あてもなく」は明確な目標に向かわず走る意味をよく表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: ですから
  rationale: 直前の競技の比喩を受け、パウロ自身への適用を導く推論的なつながりを、自然な現代日本語で示す。
- source_word: οὕτως
  choice: このように
  rationale: 走ることと拳闘することの仕方を指す語であり、原文どおり二度訳して反復と強調を保つ。
- source_word: τρέχω
  choice: 走ります
  rationale: 直前から続く競走の比喩をそのまま保ち、現在形による継続的・生き生きとした自己描写を表す。
- source_word: ἀδήλως
  choice: あてもなく
  rationale: 明確さや定まった目標を欠く様子を表す。競走の比喩では、目指す先のない走りという意味が自然に伝わる。
- source_word: πυκτεύω
  choice: 拳闘します
  rationale: 一般的な戦いではなく、拳を用いる競技を明示する語なので、競技の比喩を正確に保つ。
- source_word: ἀέρα
  choice: 空
  rationale: 打撃が相手に当たらず空を打つという原文の具体的な像を保つ。
- source_word: δέρων
  choice: 打つ
  rationale: 拳闘の仕方を示す現在分詞を、日本語では「空を打つ」という自然で簡潔な表現にする。
theological_decisions: []
