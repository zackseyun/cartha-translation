  source_fidelity: 原文の受動表現ἐδηλώθηを「私に知らされた」で適切に表し、γάρの前節を説明する機能も「というのも……からです」によって保たれている。περὶ ὑμῶνおよびὅτι節は「あなたがたの間に争いがあること」として日本語の文構造に無理なく統合されている。ὑπὸ τῶν Χλόηςは「クロエのところの人たちから」とされ、「家の者」等に限定せず、クロエと関係する人々という原文の範囲を保っている。ἔριδεςの複数形は日本語では不可算的な「争い」で自然に表現され、共同体内の対立という意味も明確である。
  naturalness: 明瞭で品位のある現代標準日本語であり、呼びかけの「私の兄弟たち」と報告内容の配置も自然である。「というのも……からです」は前節への理由づけを明示する文語寄りだが、聖書本文として不自然ではない。
  terminology: 「兄弟たち」はἀδελφοίの男性複数形を反映しており、脚注は共同体全体を指す可能性を節度をもって示している。「争い」はἔριδεςに適切で、「分裂」と混同しない。固有名「クロエ」も適切である。
