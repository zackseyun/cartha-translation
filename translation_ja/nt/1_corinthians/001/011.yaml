id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: ja
  text: というのも、私の兄弟たち[a]、あなたがたの間に争いがあることが、クロエのところの人たちから私に知らされたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の兄弟姉妹たち」。ギリシア語は「兄弟たち」だが、信者の共同体全体を含めて呼びかけている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: 知らされた
  rationale: 受動態を保ちつつ、情報がパウロに伝えられたことを自然な現代日本語で表す。単なるうわさではなく、知らせを受けたという意味合いにも適する。
- source_word: γάρ
  choice: というのも……からです
  rationale: 直前の勧告を理由づける説明的な接続を、日本語として自然な呼応表現で示す。
- source_word: περὶ ὑμῶν
  choice: あなたがたの間に争いがあること
  rationale: 日本語では「あなたがたについて」と機械的に訳すより、報告内容を示すὅτι節とまとめるほうが自然で、意味も失わない。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: ギリシア語の男性複数形を本文で明示する。共同体全体を包括的に指し得ることは脚注で示す。
- source_word: ὑπὸ τῶν Χλόης
  choice: クロエのところの人たちから
  rationale: クロエに属する、または関係する人々を指す曖昧さを保ち、「家の者」と限定しすぎない自然な表現とする。日本語では情報源を「から」で示すのが自然である。
- source_word: ἔριδες
  choice: 争い
  rationale: 複数の対立や口論を表す語であり、文脈上のより広い「分裂」と区別できる現代的な訳語である。
- source_word: ἐν ὑμῖν εἰσιν
  choice: あなたがたの間に……がある
  rationale: 存在構文を自然な日本語に置き換え、共同体内部で争いが生じていることを明確にする。
theological_decisions:
- issue: 混合性別の教会共同体に対するἀδελφοίの訳し方
  choice: 私の兄弟たち
  alternative: 私の兄弟姉妹たち
  rationale: 語形は男性複数であるため本文では「兄弟たち」と訳す一方、当時の用法として信仰共同体全体を包括的に呼びかけている可能性を脚注で明記し、語形と指示範囲の緊張を保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「というのも……からです」で前節との論理的つながりを示し、「クロエのところの人たち」は原文が関係者の範囲を特定していない点を保った。
