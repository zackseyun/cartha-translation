  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: ja
  text: あなたがたのうち、クリスポとガイオ以外には、だれにもバプテスマを授けなかったことを、私は感謝しています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: 私は感謝しています
  rationale: 現在形の感謝の表明を、明瞭で自然な現代日本語にした。「感謝します」も可能だが、ここでは継続する心情を自然に表す。
- source_word: ὅτι
  choice: 〜ことを
  rationale: パウロが感謝している内容を導く節として、日本語では名詞化した「〜ことを」が自然である。
- source_word: οὐδένα ὑμῶν
  choice: あなたがたのうち、だれにも
  rationale: 対象がコリントの読者たちの中の誰一人でもないことを明確に伝える。
- source_word: ἐβάπτισα
  choice: バプテスマを授けなかった
  rationale: 新約聖書の教会的文脈で βαπτίζω を表す標準的な訳語を用い、洗礼の方法について特定の理解を持ち込まない。
- source_word: εἰ μὴ
  choice: 〜以外には
  rationale: 否定文における例外を、自然で明確な日本語で示す。
- source_word: Κρίσπον
  choice: クリスポ
  rationale: ギリシャ語の人名を、日本語聖書で通用する形に音写した。
- source_word: Γάϊον
  choice: ガイオ
  rationale: ギリシャ語の人名を、日本語聖書で通用する形に音写した。
