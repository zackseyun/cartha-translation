  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: ja
  text: しかし神は、賢い者たちを辱めるために、この世の愚かなものを選ばれました。また神は、強いものを辱めるために、この世の弱いものを選ばれました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前との強い対照を示す接続詞として、明瞭で格調を保つ現代日本語。
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: この世の愚かなもの
  rationale: 中性複数形容詞の名詞的用法を「もの」で表し、人だけを指すと限定せず、τοῦ κόσμουとの関係も自然に保持する。
- source_word: ἐξελέξατο
  choice: 選ばれました
  rationale: 神の意図的な選択を表す標準的な訳語。神を主語とする文にふさわしい敬語表現とした。
- source_word: ἵνα καταισχύνῃ
  choice: 辱めるために
  rationale: ἵναの目的の意味を明示し、καταισχύνωの「恥を受けさせる／面目を失わせる」という強い意味を簡潔に表す。
- source_word: τοὺς σοφούς
  choice: 知恵ある者たち
  rationale: 男性複数の名詞的形容詞で人を指すことを明示し、文脈上の「賢いとされる人々」との対照を保つ。
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: この世の弱いもの
  rationale: 中性複数の名詞的用法を保ち、対象を人に限定しない。前半との並行も再現する。
- source_word: τὰ ἰσχυρά
  choice: 強いもの
  rationale: 中性複数を「もの」で再現し、「弱いもの」との修辞的な対句を明確にする。
theological_decisions:
- issue: 中性複数形容詞が指す対象
  choice: 「もの」と訳し、人・事物・事柄を含み得る表現にする
  alternative: 「人々」と限定して訳す
  rationale: 原文の中性複数は具体的な指示対象を人だけに限定していないため、その曖昧さを保持する。
- issue: ἵνα節の意味
  choice: 目的を表す「ために」
  alternative: 結果を表す「その結果」
  rationale: この文脈では神の選びの意図を示す目的用法が最も自然であり、二つの並行節も同じ構造を持つ。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。原文の二つの並行節を保ち、「愚かなもの／知恵ある者たち」「弱いもの／強いもの」という対照を読み取りやすくした。
