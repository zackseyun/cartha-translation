revisions:
- from: しかし、私たちは十字架につけられたメシア[a]を宣べ伝えます。それは、ユダヤ人にはつまずきとなり、異邦人には愚かなものです[b]。
  to: しかし、私たちは十字架につけられたメシア[a]を宣べ伝えます。ユダヤ人にとってはつまずき、異邦人にとっては愚かさです[b]。
  rationale: 本文を原文の簡潔な対照構文に近づけ、μωρίαを「愚かさ」と訳して抽象名詞の意味と前後の議論との用語上の連関を保持した。「にとっては」は与格が示す受け手側の評価を、日本語で明瞭かつ自然に表す。
