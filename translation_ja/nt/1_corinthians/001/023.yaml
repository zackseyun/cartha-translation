  verdict: revise
  source_fidelity: κήρυσσομεν、Χριστὸν ἐσταυρωμένον、Ἰουδαίοις／ἔθνεσινの対照は適切に反映されている。しかし、μωρίανは抽象名詞「愚かさ／愚かさとされること」であり、「愚かなもの」は形容表現へ移している。また「それは」は原文にない代名詞を立て、原文の簡潔な同格的対照をやや説明的にしている。
  naturalness: 「十字架につけられたメシアを宣べ伝えます」は明瞭で、現代標準日本語として理解できる。「ユダヤ人にとっては…、異邦人にとっては…」という並行構文は、各集団の受け止め方を自然に表す。
  terminology: 「メシア」「十字架につけられた」「ユダヤ人」「異邦人」「つまずき」は適切である。「愚かなもの」はμωρίαとの語彙的・概念的連関を弱めるため、「愚かさ」に改める。脚注は本文の「メシア」と「異邦人」に適切に対応している。
  issues:
