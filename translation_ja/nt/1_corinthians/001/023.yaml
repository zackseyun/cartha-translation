source:
  edition: SBLGNT
  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: ja
  text: しかし、私たちは十字架につけられたメシア[a]を宣べ伝えます。ユダヤ人にとってはつまずき、異邦人にとっては愚かさです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「十字架につけられたキリスト」。
    reason: alternative_reading
  - marker: b
    text: 「異邦人」に当たるギリシア語は直訳すると「諸国民」。ここではユダヤ人との対比で、ユダヤ人以外の人々を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: 宣べ伝えます
  rationale: 公に告げ知らせるという使徒的宣教の意味を保ちつつ、現代日本語の聖書文体として自然な表現。
- source_word: Χριστὸν
  choice: メシア
  rationale: ここでは固有名のような用法よりも、宣べ伝えられる方の称号としての働きが明確であるため。別訳「キリスト」は脚注に示した。
- source_word: ἐσταυρωμένον
  choice: 十字架につけられた
  rationale: 完了受動分詞が表す、十字架刑を受けたメシアという逆説的な姿を簡潔に保持する。
- source_word: Ἰουδαίοις
  choice: ユダヤ人には
  rationale: ἔθνεσινとの民族的・宗教的対照を明瞭に表す。
- source_word: σκάνδαλον
  choice: つまずき
  rationale: 人をつまずかせる障害という比喩を保ち、「不快」などより原語の像に近い。
- source_word: ἔθνεσιν
  choice: 異邦人には
  rationale: 語義は「諸国民」だが、ここではユダヤ人との対比により、ユダヤ人以外の人々を指す。
- source_word: μωρίαν
  choice: 愚かなもの
  rationale: 抽象名詞を日本語として自然に述語化しつつ、周辺文脈の「愚かさ」との意味上の連関を保つ。
theological_decisions:
- issue: Χριστόςを称号として訳すか、名前に近い形で訳すか
  choice: メシア
  alternative: キリスト
  rationale: 文脈は使徒たちが宣べ伝える内容と、十字架につけられた方がメシアであるとの主張を強調しているため、称号性が伝わる訳を本文に採用した。ただし伝統的な「キリスト」も妥当なので脚注に残した。
- issue: σκάνδαλονが誰の評価または経験を表すか
  choice: ユダヤ人にはつまずきとなり
  alternative: ユダヤ人にとっては不快なものとなり
  rationale: 原文の比喩と簡潔な対照構造を保ち、なぜつまずくのかを説明として付加しない。
- issue: μωρίανを客観的断定として訳すか、受け手側の評価として訳すか
  choice: 異邦人には愚かなものです
  alternative: 異邦人には愚かさです
  rationale: 与格「異邦人には」によって彼らにとっての評価であることを示し、十字架の福音そのものを訳者が愚かだと断定する誤解を避ける。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「しかし」で前節との対比を示し、二つの受け手に対する並行構造を自然に表した。「宣べ伝える」はやや聖書的だが現在も理解可能で、κηρύσσωの公的宣言の響きに適している。
