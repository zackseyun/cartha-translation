source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: ja
  text: 私はいつも、メシア・イエス[a]にあってあなたがたに与えられた神の恵みのゆえに、あなたがたのことを私の神に感謝しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「油を注がれた者」という称号。別訳「キリスト・イエス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: 感謝しています
  rationale: 現在形が表す継続的・習慣的な感謝を、自然な現代日本語で表した。
- source_word: τῷ θεῷ μου
  choice: 私の神に
  rationale: 与格と明示された所有代名詞を保ち、パウロの個人的な神への感謝を表した。
- source_word: πάντοτε
  choice: いつも
  rationale: 広い時間的意味を、明快で自然な日本語にした。
- source_word: περὶ ὑμῶν
  choice: あなたがたのことを
  rationale: 感謝の対象というより、感謝が向けられる事柄・人々を示す περί の意味を自然に表し、「あなたがたのために」として執り成しの意味に限定することを避けた。
- source_word: ἐπὶ τῇ χάριτι
  choice: 恵みのゆえに
  rationale: ἐπί＋与格が示す感謝の根拠・理由を、簡潔で品位ある表現にした。
- source_word: χάριτι τοῦ θεοῦ
  choice: 神の恵み
  rationale: パウロ書簡での χάρις の中心的な語義を「恵み」とし、属格は起源と帰属の両方を許す自然な形で保った。
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: あなたがたに与えられた
  rationale: アオリスト受動分詞の受動性を保ち、神が与え手であることを文脈に委ねた。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: キリスト・イエスにあって
  rationale: ἐν の結合・領域を表す含みを残し、日本語聖書で定着した称号表現を用いた。Χριστόςの称号としての意味は脚注で明示した。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ の意味範囲
  choice: キリスト・イエスにあって
  alternative: キリスト・イエスを通して／キリスト・イエスにおいて
  rationale: この句は手段だけでなく、キリストとの結びつきや恵みが与えられる領域も含み得るため、「にあって」によって意味を一つに限定しなかった。
- issue: Χριστός の称号性
  choice: キリスト（脚注で「メシア」）
  alternative: メシアであるイエス
  rationale: 本文では現代日本語のキリスト教語彙として広く定着した「キリスト・イエス」を用いつつ、単なる固有名と受け取られないよう称号の意味を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、書簡にふさわしい品位を保った。「恵みのゆえに」「にあって」はやや改まった表現だが、原文の因果関係と神学的な意味の幅を簡潔に保つため採用した。
