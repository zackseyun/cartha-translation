lexical_decisions:
- source_word: καθὼς
  choice: それは……からです
  rationale: 直前の内容と本節を対応させる接続語。日本語では理由・根拠を示す文脈上の働きが自然に伝わる形にした。
- source_word: μαρτύριον
  choice: 証し
  rationale: 宣べ伝えられた証言と、その証拠性の双方を保つ、現代日本語の簡潔な表現。
- source_word: τοῦ Χριστοῦ
  choice: メシアについての
  rationale: 文脈上、メシアを内容・対象とする証しと読む。ただし属格には『メシアの証し』という余地もあるため脚注に残した。
- source_word: ἐβεβαιώθη
  choice: 確かなものとされた
  rationale: βεβαιόω の受動形が表す『堅固にされる、確証される』を自然な日本語で表した。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 複数の共同体の中で証しが確立されたという意味を明瞭にする。『あなたがたの内に』という読みも可能なので脚注に示した。
theological_decisions:
- issue: τοῦ Χριστοῦ の属格の働き
  choice: 目的語的属格として『メシアについての証し』
  alternative: 主語的・所有的な含みを持つ『メシアの証し』
  rationale: この文脈では、コリントの人々の間で確かなものとなった、メシアに関する宣教の証しを指す可能性が高い。ただしギリシャ語の属格自体は別の理解を排除しないため、曖昧さを脚注で保持した。
translation_notes:
  register: 明瞭で現代的かつ礼拝朗読にも耐える文体。文脈との接続を日本語として自然に示しつつ、属格と前置詞句の真正な曖昧さは脚注に保持した。
