source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: ja
  text: その結果、あなたがたはどの賜物にも欠けることなく[a]、私たちの主イエス・キリストの現れを[b][c]待ち望んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どの霊の賜物にも」、または「どの恵みの賜物にも」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私たちの主イエス・キリストの啓示」。「私たちの主イエス・キリストが現れること」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「キリスト」は「メシア」を意味する称号。「メシアであるイエス」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: こうして
  rationale: 直前に述べられた神の恵みの結果を導く語として、結果の意味を自然な日本語で示す。
- source_word: ὑστερεῖσθαι
  choice: 欠けることなく
  rationale: 不足や欠如がないという意味を、文脈に合う自然な表現で伝える。
- source_word: ἐν μηδενὶ χαρίσματι
  choice: どの賜物にも
  rationale: χαρίσμαは恵みによって与えられる賜物を指す。「霊の賜物」と限定せず、原文の表現範囲を保つ。
- source_word: ἀπεκδεχομένους
  choice: 待ち望んでいます
  rationale: 継続的かつ強い期待を伴う待望を表す分詞のニュアンスを伝える。
- source_word: ἀποκάλυψιν
  choice: 現れるのを
  rationale: 語義は「啓示、現れ」であり、ここでは終末に主が公に現されることを指す。「啓示」より普通の読者に明瞭で、出来事としての意味を保つ。
- source_word: κυρίου
  choice: 主
  rationale: 新約聖書におけるκύριοςの標準的で文脈に適した訳語。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: この箇所では固定した名称に近い結合として用いられているため、日本語で定着した表記を採る。称号として明示する訳は注に示す。
theological_decisions:
- issue: ἀποκάλυψιςを終末的な「啓示」と「現れ」のどちらで表すか
  choice: 現れるのを
  alternative: 啓示されるのを／現れを
  rationale: 単なる情報の伝達ではなく、主が公に現される出来事を指す文脈を明瞭にする一方、「啓示」という語義は注で保持する。
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστοῦの訳し方
  choice: イエス・キリスト
  alternative: メシアであるイエス
  rationale: この文脈では称号を新たに強調するよりも名称的に機能している。日本語で定着した「キリスト」を本文に置き、称号の意味は注記する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、礼拝朗読にも耐える品位を保った。前節から続く結果の関係を「こうして」で示し、終末的期待は「待ち望む」で表した。
