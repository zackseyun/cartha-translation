id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: ja
  text: この方はまた、終わりに至るまであなたがたを堅く立たせ[a]、私たちの主イエス・メシア[c]の日に、責められるところのない者[b]としてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確かな者とし」または「強め」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「非難されるところのない者」または「訴えられるところのない者」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は「クリストス」。ここでは称号の意味を保つため「メシア」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: 堅く支え
  rationale: 「確かなものにする、堅固にする」という意味を、現代日本語で自然に表す。単なる事実確認と誤解されやすい「確認する」は避けた。
- source_word: ἕως τέλους
  choice: 終わりまで
  rationale: 終末的な終点に至るまで継続することを示す時間的表現を、そのまま明瞭に伝える。
- source_word: ἀνεγκλήτους
  choice: 責められるところのない者
  rationale: 告発や非難の対象とならないという語の法廷的含みを保ちつつ、自然で理解しやすい日本語とした。
- source_word: ἐν τῇ ἡμέρᾳ
  choice: 日に
  rationale: 終末における裁きと顕現の時を指す聖書的表現を、自然な日本語の時点表現として訳した。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの標準的かつ文脈にふさわしい称号訳。
- source_word: Χριστοῦ
  choice: メシア
  rationale: 固有名の一部のように処理せず、「油注がれた者」という称号の意味を保つ。日本語では「イエス・メシア」として自然に称号を添えた。
theological_decisions:
- issue: 関係代名詞ὃςの指示対象
  choice: 直前の「私たちの主イエス・メシア」を受ける「この方」
  alternative: より広い文脈で言及される神を指す
  rationale: 直前にある男性単数の「私たちの主イエス・メシア」が統語上もっとも自然な先行詞である。ただし日本語では過度な解釈を加えず、「この方」とした。
- issue: ἀνεγκλήτουςの統語的働き
  choice: 神が信徒を終わりまで堅く支えた結果、主の日に責められるところのない者となる
  alternative: 信徒が現在すでに非難されない状態にあることの単純な叙述
  rationale: 未来形βεβαιώσειと終末的な「主の日」の結びつきを保ち、目的・結果の含みを自然な日本語で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、終末的・法廷的な響きと称号の意味を保った。「してくださいます」は主語の働きが信徒に及ぶことを自然に示す敬意ある表現。
