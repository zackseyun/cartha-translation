source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: ja
  text: というのも、兄弟たち[a]、あなたがたの召しについて考えなさい。人間的な基準からすれば、知恵のある者は多くなく、力のある者も多くなく、家柄のよい者も多くありませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は会衆全体への呼びかけであり、男性だけでなく女性の信徒も含みます。
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: 考えてみなさい
  rationale: 字義的には「見なさい／見ています」とも訳せるが、ここでは会衆自身の状況を振り返るよう促す修辞的な働きを自然な現代日本語で表した。語形上は命令形と直説法の両方に解し得るため、別解を脚注に示した。
- source_word: κλῆσιν ὑμῶν
  choice: あなたがたが召された時のこと
  rationale: パウロの文脈でκλῆσιςは神からの「召し」を指す。「召し」という名詞だけでは現代日本語で硬く不透明になりやすいため、神に召された際の会衆の実情を振り返る文脈に即して節に展開した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文で保持した。ただし会衆全体への呼びかけであり、女性の信徒も含むことを脚注で明示した。
- source_word: κατὰ σάρκα
  choice: 人間的な基準で見て
  rationale: ここでのσάρξは身体そのものや「罪深い性質」ではなく、人間社会の評価基準を表す。「肉によれば」より意味が明瞭で、解釈を過度に限定しない表現とした。
- source_word: δυνατοί
  choice: 力のある者
  rationale: 社会的・政治的な影響力を含み得る語だが、その種類を「有力者」などに限定せず、原語の幅を保った。
- source_word: εὐγενεῖς
  choice: 家柄のよい者
  rationale: 人格的な「高潔さ」ではなく、高い家柄や出生を指すため、現代日本語で誤解されにくい表現を選んだ。
theological_decisions:
- issue: κλῆσιςの主体
  choice: 本文では「召された」と受動態で表し、神を明示しない
  alternative: 「神からの召し」
  rationale: 文脈上、召す主体は神だが、この節のギリシア語本文は主体を明記していない。神学的含意を保ちつつ、原文以上の明示を避けた。
- issue: κατὰ σάρκαの意味
  choice: 人間的な基準で見て
  alternative: 肉によれば
  rationale: この箇所では倫理的な「肉」と断定せず、世俗的・人間的な評価という対比を表す用法として訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。反復される「多くなく」を維持して、原文の三重の並行表現と修辞的な強調を再現した。
