review_pass:
  verdict: revise
  source_fidelity: κλῆσιν ὑμῶν is more directly ‘your calling’ than ‘the time when you were called.’ The draft’s event-focused wording is contextually understandable but narrows the noun into a particular occasion and introduces ‘時’ without a corresponding expression in Greek. The threefold ‘not many’ and the socially oriented sense of κατὰ σάρκα, δυνατοί, and εὐγενεῖς are otherwise represented well.
  naturalness: 「あなたがたの召しについて考えなさい」は明瞭な現代標準日本語で、パウロ書簡にふさわしい格調も保つ。「人間的な基準からすれば」は「人間的な基準で見て」より流れがよい。
  terminology: 「召し」はこの文脈でのκλῆσιςの定着した用語として適切であり、脚注なしでも意味を保てる。「兄弟たち」の本文上の形を維持し、会衆全体を指すことは文化注で補うのが適切。
  issues:
  - severity: medium
    issue: κλῆσιν ὑμῶνを「あなたがたが召された時のこと」としたこと
    rationale: κλῆσιςは「召し／召命」であり、「時」を表す語は原文にない。この訳は名詞の意味を召された一回の時点に限定するため、「あなたがたの召しについて」とするほうが原文の語義と幅を保つ。
  - severity: low
    issue: 脚注bの代案表現
    rationale: 「見れば分かります」はΒλέπετεの直説法の可能性を正確には示していない。直説法なら基本的に「あなたがたは見ている／分かっている」である。本文を命令として訳すなら、この形態上の可能性は本文理解に実質的な差を生まないため、脚注を省くのが明瞭である。
  revised_text: というのも、兄弟たち[a]、あなたがたの召しについて考えなさい。人間的な基準からすれば、知恵のある者は多くなく、力のある者も多くなく、家柄のよい者も多くありませんでした。
