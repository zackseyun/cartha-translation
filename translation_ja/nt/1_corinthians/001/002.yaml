revisions:
- from: コリントにある神の教会、すなわち、キリスト・イエスにあって聖なるものとされた人々[a]、聖なる者として召された人々[b]へ。また、あらゆる場所で、私たちの主イエス・キリスト[c]の名を呼び求めているすべての人々と共に――彼らのところでも、私たちのところでも[d]。
  to: コリントにある神の教会、すなわち、メシアであるイエスにあって聖別された人々[a]、聖なる者として召された人々[b]へ。また、あらゆる場所で、私たちの主、メシアであるイエス[c]の名を呼び求めるすべての人々と共に――彼らのところでも、私たちのところでも[d]。
  rationale: 本文中の二つのΧριστόςを、英語POBの語彙・神学上の選択と原語の称号性に合わせて「メシア」と明示した。また、ἡγιασμένοιςの訳を「聖なるものとされた人々」から「聖別された人々」へ改め、受動性と継続する聖別の状態を保ちながら、明瞭で自然な現代日本語に整えた。末尾のαὐτῶν καὶ ἡμῶνについては、本文で場所に関係づける読みを示し、脚注で「主」にかかる別解を保持した。
