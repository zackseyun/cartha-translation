id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: ja
  text: コリントにある神の教会、すなわち、メシアであるイエスにあって聖別された人々[a]、聖なる者として召された人々[b]へ。また、あらゆる場所で、私たちの主、メシアであるイエス[c]の名を呼び求めるすべての人々と共に――彼らのところでも、私たちのところでも[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアであるイエスとの結びつきの中で」とも表現できる。
    reason: ἐν Χριστῷ Ἰησοῦの「にあって」が表す、領域・結合・帰属の幅を補足するため。
  - marker: b
    text: 直訳に近くは「召された聖なる人々」。伝統的には「聖徒となるよう召された人々」とも訳される。
    reason: κλητοῖς ἁγίοιςという二つの形容詞の関係に複数の自然な訳し方があるため。
  - marker: c
    text: 「メシア」は「油注がれた方」を意味する称号である。
    reason: Χριστόςの称号としての意味を本文の訳語に対応させて補足するため。
  - marker: d
    text: 「彼らのところでも、私たちのところでも」は、主の名を呼び求める人々がいる、彼らと私たち双方のあらゆる場所を指すとも理解できる。この句を「彼らと私たち双方の主」として「主」にかける理解もある。
    reason: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶνの圧縮された構文と係り受けの曖昧さを保存するため。
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: 現代日本語の新約聖書文脈で共同体を自然かつ明確に表す定着語であり、単なる建物ではなく神に属する人々の集まりを指す。
- source_word: ἡγιασμένοις
  choice: 聖なるものとされた人々
  rationale: 完了受動分詞が示す、すでになされた行為とその継続する結果、および神の働きを受けたという受動性を保つ。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: キリスト・イエスにあって
  rationale: パウロ書簡に特徴的な結合・帰属の表現を「にあって」で保持する。「キリスト」は日本語で定着した称号表現である。
- source_word: κλητοῖς ἁγίοις
  choice: 聖なる者として召された人々
  rationale: 二つの形容詞による簡潔なギリシア語を自然な日本語にしつつ、「召し」と「聖なる者」という二要素を保つ。「聖人」という後世の限定的な印象は避ける。
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: 名を呼び求めている
  rationale: 単に名を口にすることではなく、礼拝・祈願・信頼を含む慣用的な聖書表現として自然である。
- source_word: κυρίου
  choice: 主
  rationale: イエスへの初期キリスト教の告白を示す定着した訳語であり、権威と礼拝的含意を保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 現代日本語で最も自然かつ広く理解される形を採用しつつ、脚注で「キリスト」が称号「メシア」を意味することを明示する。
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: あらゆる場所で……彼らのところでも、私たちのところでも
  rationale: 圧縮された属格句を本文では場所に関係づけて読みやすくし、別の係り受けの可能性は脚注に残す。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: 本文では「キリスト」
  alternative: 「メシア」または「油注がれた方」
  rationale: 日本語では「キリスト」が称号として定着しており、固有名の一部のようにも機能するパウロの用法を自然に伝える。原義は脚注で保持する。
- issue: κλητοῖς ἁγίοιςの関係
  choice: 「聖なる者として召された人々」
  alternative: 「召されて聖なる者となった人々」または「召された聖なる人々」
  rationale: ギリシア語に明示されない時間的・因果的順序を加えず、召しと聖性の結びつきを保つ。
- issue: αὐτῶν καὶ ἡμῶνの係り先
  choice: 場所に関係づけて「彼らのところでも、私たちのところでも」
  alternative: 「彼らと私たち双方の主」として「主」に関係づける
  rationale: 語順上は「場所」への関係が自然だが、統語的に圧縮されており別解も可能なため、本文で一案を示し脚注で曖昧さを保存する。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。書簡冒頭の宛先句としてコロン相当の句点構成を用い、「聖人」は避けて共同体全体を指す「聖なる者」とした。原文に一つの長い宛先句があるため、「すなわち」「また」「共に」とダッシュを用いて関係を見通しやすくした。
