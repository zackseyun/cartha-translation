  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: ja
  text: というのも、ユダヤ人はしるしを求め、ギリシア人は知恵を追い求めます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδή
  choice: というのも
  rationale: 直前の議論の理由を示す接続表現として、因果関係を保ちつつ現代日本語で自然に読める。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人
  rationale: ここでは「ギリシア人」と対置される文化的・宗教的集団を指すため、標準的な訳語を用いた。
- source_word: σημεῖα
  choice: しるし
  rationale: 奇跡的なしるしを含み得る語だが、原語の広がりを狭めず、パウロの表現を直接保つ。
- source_word: αἰτοῦσιν
  choice: 求め
  rationale: 「要求する」ほど強くせず、何かを提示するよう求める継続的な態度を簡潔に表す。
- source_word: Ἕλληνες
  choice: ギリシア人
  rationale: 異邦人一般へ広げず、知恵との結びつきを含む原文の具体的な文化的枠組みを保つ。
- source_word: σοφίαν
  choice: 知恵
  rationale: 哲学に限定せず、原語が持つ広い概念範囲を維持する。
- source_word: ζητοῦσιν
  choice: 追い求めます
  rationale: αἰτοῦσινとの語感の違いを示しつつ、継続的に探究する意味を自然な日本語で表す。
