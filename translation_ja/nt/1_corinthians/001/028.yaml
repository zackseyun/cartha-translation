source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: ja
  text: また神は、世の身分の低いもの、見下されているもの、ないものを選ばれました。それは、あるものを無力にする[a]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あるものを無にするため」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: 身分の低いもの
  rationale: 高貴な生まれや社会的地位を持たないものを指す。現代日本語で社会的身分の含意を明確に伝える。
- source_word: ἐξουθενημένα
  choice: 見下されているもの
  rationale: 軽んじられ、価値がないかのように扱われてきたものという完了分詞の意味を、自然な日本語で表す。
- source_word: τὰ μὴ ὄντα
  choice: ないもの
  rationale: 直訳的で強烈な表現を保ち、存在についての字義的な響きと、社会的に無に等しいとされるものという文脈上の意味の両方を残す。
- source_word: τὰ ὄντα
  choice: あるもの
  rationale: 「ないもの」との均衡の取れた対照を維持し、「ひとかどのもの」などの限定的な解釈を本文に持ち込まない。
- source_word: καταργήσῃ
  choice: 無力にする
  rationale: 消滅させるというより、効力や力を失わせるという語義を明確に表す。別訳を脚注に示す。
- source_word: ἐξελέξατο
  choice: 選ばれました
  rationale: 神の意図的な選びを表し、直前の文脈で繰り返される語にも対応する。敬語表現は現代日本語の聖書文体として自然である。
theological_decisions:
- issue: τὰ μὴ ὄντα と τὰ ὄνταを社会的区分として明示するか、存在表現のまま保つか
  choice: 「ないもの」／「あるもの」という対照を保つ。
  alternative: 「何者でもない者」／「ひとかどの者」と社会的地位に即して意訳する。
  rationale: 文脈は世における評価や地位を扱うが、パウロの表現はそれより広く、挑発的である。直訳的な対照によって、存在論的な響きと社会的な意味の緊張を保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「もの」を反復して原文の中性複数表現と修辞的対照を保った。長いギリシア語文を日本語では二文に分け、目的節を明確にした。脚注記号は該当文末に置いた。
