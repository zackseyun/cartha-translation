source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: ja
  text: 知恵ある者はどこにいるのか。律法学者はどこにいるのか。この時代の論客はどこにいるのか。[a] 神は、世の知恵を愚かなものにしたではないか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この時代」は、後半の「世」とは異なるギリシア語の訳である。
    reason: cross_reference
  - marker: b
    text: または「神は、世の知恵が愚かであることを明らかにしたではないか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ σοφός
  choice: 知恵ある者はどこにいるのか
  rationale: ποῦを修辞的な問いとして訳し、男性単数のσοφόςは特定の男性に限定せず、類型を表す自然な日本語「知恵ある者」とした。
- source_word: γραμματεύς
  choice: 律法学者
  rationale: 当時のユダヤ的背景と歴史的な職能を伝える、日本語聖書で定着した明瞭な表現を採った。ただし語そのものはより広く「学者、書記」を指し得る。
- source_word: συζητητής
  choice: 論客
  rationale: 議論や論争を行う者という意味を、簡潔で現代の読者にも通じる「論客」で表した。
- source_word: τοῦ αἰῶνος τούτου
  choice: この時代の
  rationale: αἰώνを時間的・時代的な語として訳し、後半のκόσμος「世」と区別した。
- source_word: οὐχὶ ἐμώρανεν
  choice: 愚かなものにされたではないか
  rationale: 肯定の答えを予期する修辞疑問を「ではないか」で示し、動詞の使役的な力を保った。
- source_word: σοφίαν τοῦ κόσμου
  choice: この世の知恵
  rationale: κόσμοςを「世」とし、前のαἰών「時代」と語を分けながら、自然な日本語の連語にした。
theological_decisions:
- issue: αἰώνとκόσμοςの区別
  choice: αἰώνを「時代」、κόσμοςを「世」と訳し分ける
  alternative: 両方を「世」と訳す
  rationale: 同じ節でパウロが用いた二つの異なるギリシア語を平板化せず、現在の時代と世の知恵との表現上の違いを保持するため。
- issue: ἐμώρανενの意味合い
  choice: 「愚かなものにされた」と使役的に訳す
  alternative: 「愚かであることを明らかにされた」
  rationale: 原語の直接的な使役表現を本文に保ちつつ、「愚かさを暴露した」という解釈の可能性は脚注で示す。
translation_notes:
  register: 明瞭な現代標準語を用い、三つの短い修辞疑問の反復を保持した。「知者」のような文語調を避けて「知恵ある者」とし、全体は公的朗読にも適する格調を保った。
