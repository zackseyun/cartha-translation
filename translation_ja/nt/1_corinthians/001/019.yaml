id: 1CO.1.19
reference: 1 Corinthians 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: ja
  text: 'なぜなら、こう書かれているからです。


    「わたしは知恵のある者の知恵を滅ぼす。


    分別のある者の理解を退ける[a]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「無効にする」または「拒む」。
    reason: ἀθετέωには、退ける、拒絶する、効力を失わせるという意味幅があるため。
lexical_decisions:
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 完了受動形が示す、過去に記されて今も権威をもつ聖書の言葉という含意を、自然な現代日本語の引用導入句で表した。
- source_word: γάρ
  choice: なぜなら、〜からです
  rationale: 直前の主張を聖書によって根拠づける論理関係を明確に保った。
- source_word: Ἀπολῶ
  choice: わたしは〜滅ぼし
  rationale: ἀπόλλυμιの直接的な意味と未来の宣言の力を保ち、必要以上に解釈を加えない表現とした。
- source_word: σοφίαν τῶν σοφῶν
  choice: 知恵ある者の知恵
  rationale: 語根を反復する原文の修辞的効果を、日本語でも「知恵」の反復によって保持した。
- source_word: σύνεσιν τῶν συνετῶν
  choice: 悟りある者の悟り
  rationale: 名詞と形容詞に共通する語根の反復を保ちつつ、理解力や洞察を指す意味を簡潔に表した。
- source_word: ἀθετήσω
  choice: 退ける
  rationale: 拒絶する、効力を失わせる、顧みないという意味幅を残しながら、現代日本語として明瞭で格調のある語を選んだ。
theological_decisions:
- issue: イザヤ書の引用における神の行為の表現
  choice: 「滅ぼし」「退ける」という率直な未来表現
  alternative: 「挫折させる」「無にする」など、結果をより解釈的に明示する表現
  rationale: 人間の知恵に対する神の決定的な働きという対比を保ちつつ、ギリシア語以上の教理的説明を加えないため。
translation_notes:
  register: 明瞭な現代標準語を用い、聖書引用としての格調と二行の並行法を保持した。「知恵ある者の知恵」「悟りある者の悟り」により原文の同語根反復を再現している。
