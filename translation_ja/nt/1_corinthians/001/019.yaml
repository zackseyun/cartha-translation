    reason: ἀθετέωには、退ける、拒絶する、効力を失わせるという意味幅があるため。
  revision_rationale: 「悟り」を、σύνεσις/συνετόςの文脈上の意味に即した「理解」「分別のある者」に改めた。二つの未来形を日本語でも独立した述語として示し、原文の並行と宣言の力を明確にした。
