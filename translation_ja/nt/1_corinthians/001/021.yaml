id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: ja
  text: というのも、神の知恵のうちにあって、この世は知恵によって神を知ることがなかったので、神は、宣べ伝えられる知らせの愚かさ[a][b]によって、信じる人々を救うことをよしとされたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「宣べ伝えることの愚かさ」。
    reason: κήρυγμαは、宣べ伝えられる内容だけでなく、宣べ伝える行為を含んで理解される可能性があるため。
  - marker: b
    text: すなわち、この世が、宣べ伝えられる知らせを愚かだと見なすということ。
    reason: 「愚かさ」に込められた文脈上の逆説と文化的評価を明らかにするため。
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: というのも……ので
  rationale: γάρの説明的なつながりを「というのも」で示し、ἐπειδήの理由・事情を「ので」で自然な日本語にした。
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: 神の知恵のうちにあって
  rationale: ἐνを手段だけに限定せず、神の知恵という領域・秩序の中で起きたこととも読める原文の幅を保った。
- source_word: οὐκ ἔγνω ὁ κόσμος
  choice: この世は……神を知ることがなかった
  rationale: κόσμοςをパウロ書簡で一般的な「この世」とし、ἔγνωが持つ認識的・関係的な広がりを「知る」で保った。
- source_word: διὰ τῆς σοφίας
  choice: 知恵によって
  rationale: 属格を伴うδιάを手段として訳し、その知恵が人間の知恵であることを本文に補って限定するのは避けた。
- source_word: εὐδόκησεν ὁ θεὸς
  choice: 神は……よしとされた
  rationale: 単なる決定ではなく、神の御心と喜びにかなう選択を表すεὐδοκέωの含みを、尊厳ある自然な日本語で示した。
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: 宣べ伝えられる知らせの愚かさによって
  rationale: κήρυγμαを主として宣べ伝えられる内容と捉えつつ、「宣べ伝えられる」という表現で告知行為との結びつきも残した。「愚かさ」は文脈上、この世からそう見なされるという逆説を保持する。
- source_word: σῶσαι
  choice: 救う
  rationale: パウロの救済に関する語法を過不足なく伝える標準的な訳語を用いた。
- source_word: τοὺς πιστεύοντας
  choice: 信じる人々
  rationale: 現在分詞の実質名詞的用法を明瞭に表し、原文以上の教理的限定を加えなかった。
theological_decisions:
- issue: διὰ τῆς μωρίας τοῦ κηρύγματος の意味
  choice: 主として、愚かだと見なされる、宣べ伝えられた知らせを指す
  alternative: 宣べ伝えるという行為・方法の愚かさを指す、または内容と行為の両方を意図的に重ねる
  rationale: κήρυγμαは通常、告知された内容を表すが、ここでは公に宣べ伝える行為も響き得る。本文では内容を前面に出し、脚注で行為を指す可能性を示して解釈上の幅を保った。
- issue: 「愚かさ」の評価主体
  choice: 知らせ自体を神が愚かだと評価しているとは断定せず、この世から愚かに見えるという文脈上の逆説として訳す
  alternative: 神ご自身が宣教を本質的に愚かな手段と呼んでいると解する
  rationale: 直前の1:18–20および後続の議論では、神の知恵とこの世の知恵が対照される。評価の逆転を保ちつつ、本文には原文にない説明句を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「神の知恵のうちにあって」はやや形式的だが、ἐνの領域的・秩序的・手段的な曖昧さを不用意に解消しないために採用した。
