  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: ja
  text: 神の御心により、メシア・イエス[a]の使徒として召されたパウロと、兄弟であるソステネから、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: パウロ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: κλητὸς ἀπόστολος
  choice: 使徒として召された
  rationale: κλητόςがパウロの使徒としての身分を修飾することを、自然な現代日本語で表した。単に本人がその職を選んだのではなく、召しによることも保持している。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア・イエス
  rationale: 語順を保持し、Χριστόςがここでイエスの称号として機能することを明確にした。日本語で定着した「キリスト・イエス」も脚注に示した。
- source_word: διὰ θελήματος θεοῦ
  choice: 神のみこころによって
  rationale: διά＋属格が表す媒介・根拠を自然に示し、パウロの召命が神の意志によることを伝える。
- source_word: Σωσθένης
  choice: ソステネ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ὁ ἀδελφὸς
  choice: 兄弟ソステネ
  rationale: 冠詞付きの同格表現を簡潔に再現した。「兄弟」は信仰共同体の男性成員を指す関係語として保持し、原文にない所有代名詞「私たちの」は本文に補わなかった。
theological_decisions:
- issue: パウロ書簡の挨拶におけるΧριστόςの訳し方
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: この箇所ではΧριστόςをイエスのメシアとしての職務を示す称号として訳した。ただし「キリスト」は日本語で広く定着した対応語なので、脚注に別訳として残した。
- issue: κλητὸςと使徒職の関係
  choice: 使徒として召された
  alternative: 召された使徒
  rationale: 原文は「召された」と「使徒」を密接に結び付けている。日本語では「使徒として召された」が最も自然であり、召命が使徒職に関わるという意味を保つ。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡冒頭にふさわしい簡潔で品位ある文体とした。「みこころ」は教会語として定着しているが、現代日本語でも理解可能である。節末の読点は、宛先へ続く書簡冒頭の構文であることを示す。
