  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: ja
  text: それは、次のように書かれているとおりとなるためです。「誇る者は、主にあって誇りなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: それは～ためです
  rationale: 前節から続く目的・結果を示す接続を、現代日本語で自然に表した。
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおり
  rationale: 聖書引用の定型句を明瞭に示し、完了形が含む現在にも有効な書かれた言葉という含意を自然な日本語で保った。
- source_word: Ὁ καυχώμενος
  choice: 誇る者
  rationale: 冠詞付き分詞の実質名詞的用法を簡潔に表した。καυχάομαιには文脈により肯定・否定両面があるため、中立的な「誇る」を採用した。
- source_word: ἐν κυρίῳ
  choice: 主を誇りなさい
  rationale: ギリシア語のἐνは領域・根拠・対象を含みうるが、日本語の「主にあって誇る」より自然で、引用元エレミヤ9:23–24の趣旨にも沿う目的語表現とした。
- source_word: καυχάσθω
  choice: 誇りなさい
  rationale: 三人称命令の勧告・命令の力を、現代日本語の引用文として自然な形で保持した。
theological_decisions:
- issue: ἐν κυρίῳにおける誇りの対象・領域
  choice: 主を誇りなさい
  alternative: 主にあって誇りなさい
  rationale: 「主を」は、自己ではなく主を誇りの対象とする対比を明瞭にする。一方、ἐνの領域的な含みもありうるため、別訳を脚注に残した。
- issue: καυχάσθωの命令法
  choice: 誇りなさい
  alternative: 誇るべきです
  rationale: 原文の三人称命令を直接的な勧告として表し、単なる一般原則に弱めないようにした。
translation_notes:
  register: 明快で格調のある現代標準語。聖書引用の響きを保ちつつ、古風な「誇る者は主にあって誇れ」は避けた。脚注記号[a]は対応する引用文末に置いた。
