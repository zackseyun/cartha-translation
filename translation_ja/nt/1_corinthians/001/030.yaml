id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: ja
  text: しかし、あなたがたがメシア・イエスにあるのは、神からです。この方は私たちにとって、神からの知恵、また義[a]と聖化と贖いとなられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。
    reason: δικαιοσύνηには文脈により「義」だけでなく「正義、公正」の意味もあり得るため。
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: 神によって
  rationale: 起源・源を表すἐξの意味を、日本語として自然に保ち、信徒がメシア・イエスにあることの源が神であると示す。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあります
  rationale: パウロ特有の「〜にある」という結びつきの表現を過度に説明せず保持し、Χριστόςは称号として「メシア」とした。
- source_word: ἐγενήθη
  choice: なられました
  rationale: 「なった／生じた」という直接的な意味を保ちつつ、指示対象であるメシアへの敬意にかなう自然な日本語とした。
- source_word: σοφία ἡμῖν ἀπὸ θεοῦ
  choice: 私たちにとって、神からの知恵
  rationale: ἡμῖνの関係性とἀπὸ θεοῦの源を明示し、文脈上の「知恵」をそのまま保った。
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロの救済論的文脈に適合する定訳を採用し、「正義」という可能性は脚注に残した。
- source_word: ἁγιασμός
  choice: 聖化
  rationale: 聖なるものとされることを表す神学的含意を簡潔かつ正確に伝える。
- source_word: ἀπολύτρωσις
  choice: 贖い
  rationale: 解放と代価の背景を持つ語の意味を保つ、現代日本語の聖書用語として明瞭な訳語である。
theological_decisions:
- issue: 「神からの知恵」と後続する三つの名詞との関係
  choice: 「また」で緩やかに連結し、知恵に続く並列とも、その内容を説明する同格とも読める形を保った。
  alternative: 「すなわち」を用い、義・聖化・贖いを知恵の明示的な説明とする。
  rationale: ギリシア語の統語は、ἀπὸ θεοῦがどこまで係るか、また後続三語が同格的説明か並列項目かについて一定の幅を残すため、訳文で一義的に固定しない。
- issue: ἐξ αὐτοῦが示す神の働き
  choice: 「神によって」とし、信徒がメシア・イエスにあることの源ないし働き手が神であることを示した。
  alternative: 「神から出て」または「神のおかげで」とする。
  rationale: 「神によって」は日本語として自然であり、起源と作用の双方を含み得る原文の幅を比較的よく保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「メシア・イエスにある」というパウロ的表現は説明的に言い換えず保持した。列挙には「また」を用い、原文の統語的・神学的な余地を残した。
