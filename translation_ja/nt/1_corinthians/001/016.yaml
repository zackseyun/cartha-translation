  text: ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: ja
  text: もっとも、ステファナの家の者たちにもバプテスマを授けました[a]。そのほかには、だれかほかの人にバプテスマを授けたかどうか、私には分かりません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ステファナの家にも」。ギリシャ語の「家」は、建物だけでなく、家族や同居人を含む家の共同体を指すことがあります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「そのほかにだれかにバプテスマを授けたかどうか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: バプテスマを授けました
  rationale: この動詞はバプテスマを施すことを指す。「バプテスマを授ける」は現代日本語の聖書文体として自然であり、浸礼など特定の方式に限定しない。
- source_word: δὲ καὶ
  choice: もっとも、…にも
  rationale: 直前の発言に例外を付け加える、軽い修正を伴う接続として表した。強い対立を示す「しかし」より文脈に合う。
- source_word: τὸν Στεφανᾶ οἶκον
  choice: ステファナの家の者たち
  rationale: οἶκοςはここでは建物そのものより、家族や同居人などから成る家の共同体を指すと考えられる。「家族」だけに狭めず、その社会的な広がりを保った。
- source_word: λοιπὸν
  choice: そのほかには
  rationale: 今述べた例を除き、それ以上について語る表現として、簡潔で自然な日本語にした。
- source_word: οὐκ οἶδα
  choice: 私には分かりません
  rationale: 原文の「知らない／分からない」という表現を直接反映した。文脈上は記憶についての発言だが、本文では「覚えていません」と解釈を限定しなかった。
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: だれかほかの人にバプテスマを授けたかどうか
  rationale: 間接疑問としての不確かさと、「ほかのだれか」という範囲を明確な現代日本語で表した。
theological_decisions:
- issue: 「ステファナの家」に含まれる人々の範囲
  choice: 家の者たち
  alternative: 家族／一家
  rationale: 原文だけでは構成員の年齢や信仰告白の有無は特定できないため、その点を推定せず、οἶκοςの幅を保つ表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒の回想に見られる軽い自己修正の調子を「もっとも」で表した。敬体で統一し、教会用語として広く通用する「バプテスマ」を採用した。
