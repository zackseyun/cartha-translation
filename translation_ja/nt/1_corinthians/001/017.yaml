source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: ja
  text: というのも、メシアが私を遣わされたのは、バプテスマを授けるためではなく、福音を告げ知らせるためであり、それをことばの知恵によって行うためではありません。メシアの十字架がむなしいものとならないためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「むなしいものとならない」は、「無効にされない」、または文脈上「その力を失わない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: メシア／メシアの
  rationale: Χριστόςを固有名のように音写せず、「油注がれた者」という称号として訳した。二つの用例を同じ語で統一した。
- source_word: βαπτίζειν
  choice: バプテスマを授ける
  rationale: 教会用語として定着し、行為を自然に表す。「浸す」と限定して方式上の解釈を持ち込むことを避けた。
- source_word: εὐαγγελίζεσθαι
  choice: 福音を告げ知らせる
  rationale: 動詞の宣教的意味を保ちつつ、現代日本語で内容が明瞭になる表現とした。
- source_word: σοφίᾳ λόγου
  choice: ことばの知恵によって
  rationale: 句の簡潔さと曖昧さを保ち、修辞的雄弁さだけに意味を限定しなかった。ἐνはここでは手段・様態を自然に示す「によって」とした。
- source_word: κενωθῇ
  choice: むなしいものとなる
  rationale: 受動接続法の目的・結果の含みを保った。「力を失う」は文脈上あり得るが、原文にない「力」を本文へ補わなかった。
- source_word: σταυρὸς
  choice: 十字架
  rationale: パウロ書簡の文脈でも自然な標準訳であり、原語の具体的な比喩を保持する。
theological_decisions:
- issue: Χριστόςを称号として訳すか、伝統的に音写するか
  choice: メシア
  alternative: キリスト
  rationale: 原語の称号としての意味を読者に伝えるため「メシア」とした。ただし日本語の伝統的表記「キリスト」も可能である。
- issue: 「メシアの十字架がむなしいものとなる」の意味を明示するか
  choice: 原文どおり比喩を保つ
  alternative: メシアの十字架が力を失う
  rationale: κενόωの具体的な「空にする／むなしくする」という表現を保持し、何が失われるのかを本文で限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも」でγάρを前文への説明として示し、長い一文を三文に分けて読みやすくした。「それも」によりοὐκ ἐν σοφίᾳ λόγουが福音を告げ知らせる方法を修飾する関係を示した。
