  terminology: 「メシア」はΧριστόςの称号性を反映しており、両出現で統一されている点が適切です。「バプテスマ」「福音」「十字架」もこの文脈で定着した正確な用語です。「ことばの知恵」は原文の曖昧さを保てます。
