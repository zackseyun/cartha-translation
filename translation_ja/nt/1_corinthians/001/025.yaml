  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: ja
  text: 神の愚かさは人間よりも賢く、神の弱さは人間よりも強いからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: 神の愚かさ
  rationale: 直訳的な逆説を保ち、直前の「十字架のことば」を背景とするパウロの修辞を説明に置き換えない。
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: 人間よりも賢く
  rationale: 比較級と属格による比較を自然な現代日本語で表現し、ἀνθρώπωνを性別に限定しない「人間」とした。
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: 神の弱さ
  rationale: 前半と対応する逆説的な名詞表現を保った。
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: 人間よりも強い
  rationale: ἰσχυρότερονの比較を簡潔に再現し、前半との並行性を維持した。
- source_word: ὅτι
  choice: からです
  rationale: 前節の主張に理由を与える接続関係を、日本語では文末表現によって自然に示した。
theological_decisions:
- issue: 「神の愚かさ」「神の弱さ」の解釈
  choice: 逆説をそのまま保持する
  alternative: 「人には愚かに見える神のこと」「人には弱く見える神のわざ」と説明的に訳す
  rationale: 本文は神が実際に愚か、または弱いと教えるのではなく、人間の評価を逆転させる修辞である。しかし、その説明を訳文に織り込むと原文の鋭い逆説と解釈上の余地が失われるため、原文どおり保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「人々」も可能だが、神と人間との対比を明確にするため「人間」を採用した。前節との論理関係を示すため、ὅτιは文末の「からです」で表した。
