  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ja
  text: 私たちの父である神と主イエス・メシア[a]から、恵みと平安があなたがたにありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主イエス・キリスト」。
    reason: Χριστόςは「メシア」を意味する称号であり、日本語では音写形「キリスト」も広く定着しているため。
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの挨拶における神からの恩恵を表す定着した訳語であり、語の神学的な重みも保つ。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数二人称の与格を明示し、会衆全体への祝福であることを自然な日本語で表す。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在に限られない、関係的・包括的な安寧を含む挨拶語として適切である。
- source_word: ἀπὸ
  choice: から
  rationale: 恵みと平安の源を示す前置詞を直接的に訳し、父なる神と主イエスの双方に一つの「から」を係らせる。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 私たちの父である神
  rationale: 神が「私たちの父」であるという同格関係を、誤解のない自然な日本語で表す。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの称号としての意味と神学的な重みを保つ標準的な訳語である。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を「メシア」で明示する。日本語で広く定着した「イエス・キリスト」は脚注に示す。
theological_decisions:
- issue: 恵みと平安が父なる神と主イエスの双方から来るという共通の起点関係をどう表すか
  choice: 一つの「から」を「私たちの父である神」と「主イエス・メシア」の両方に係らせる。
  alternative: それぞれの前に「から」を繰り返す、または両者の並列を弱めるように文を組み替える。
  rationale: ギリシャ語では一つのἀπόが両者を支配している。その統語関係を保ち、本文以上の教理的説明は加えない。
- issue: 動詞のないギリシャ語の祝福表現を日本語でどう表すか
  choice: 「ありますように」を補い、願い・祝福として訳す。
  alternative: 「恵みと平安を」と体言止めにする。
  rationale: 原文の挨拶的な願意を、現代日本語で明瞭かつ荘重に伝えるための最小限の補足である。
translation_notes:
  register: 明瞭な現代標準語を用いながら、書簡冒頭の祝福にふさわしい品位を保った。「私たちの父である神」は同格関係を明示し、「ありますように」によって省略された願意を自然に表した。
