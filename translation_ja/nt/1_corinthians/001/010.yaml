id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: ja
  text: 兄弟たち[a]、私たちの主イエス・メシア[b]の名によって、あなたがたに勧めます。皆が同じことを語り、あなたがたの間に分裂[c]がなく、同じ思いと同じ判断において、しっかりと一つに結ばれていてください[d][e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、文法上は男性複数形ですが、ここでは信仰共同体全体への呼びかけとして「兄弟姉妹たち」を含み得ます。
    reason: cultural_note
  - marker: b
    text: 「メシア」は、伝統的には「キリスト」と訳されます。
    reason: lexical_alternative
  - marker: c
    text: 「分裂」は、「分派」または「分裂状態」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: 「一つに結ばれて」は、「整えられて」「修復されて」または「繕い合わされて」とも訳せます。
    reason: lexical_alternative
  - marker: e
    text: 「判断」は、「見解」「意向」または「確信」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ δὲ ὑμᾶς
  choice: さて、あなたがたにお願いします
  rationale: παρακαλῶの牧会的で切実な勧めを、現代日本語で自然かつ丁重な「お願いします」とした。δέはここでは強い逆接ではなく談話の展開を示すため、「さて」で表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を保ちつつ、この呼びかけが共同体全体に及び得ることを脚注で示した。
- source_word: διὰ τοῦ ὀνόματος
  choice: 名によって
  rationale: διά＋属格が示す媒介・根拠を保ち、主イエス・キリストの権威に基づく訴えとして自然に読める表現とした。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語では「キリスト」が称号としても広く理解される定着訳であり、固有名との区別を中黒で明瞭にした。
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: 皆が同じことを語り
  rationale: 「皆」と「同じことを語る」という原文の具体的表現を保持し、単に「一致する」と抽象化しなかった。
- source_word: σχίσματα
  choice: 分裂
  rationale: 共同体内部の裂け目を表す、明瞭で一般的な現代日本語を選んだ。
- source_word: κατηρτισμένοι
  choice: 一つに結ばれていてください
  rationale: 受動・結果的な含みを残しつつ、分裂したものが整えられ結合される文脈上の意味を自然な日本語で表した。修復・整備という語義の幅は脚注に示した。
- source_word: νοῒ
  choice: 思い
  rationale: 思考・理解のあり方を表す語として自然であり、後続の「判断」との区別も保てる。
- source_word: γνώμῃ
  choice: 判断
  rationale: 見解、判断、意向を含み得る語を過度に限定せず、「思い」と区別できる訳語とした。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、日本語の「キリスト」はその称号として定着している。「メシア」も可能だが、本文では自然で荘重な慣用を優先し、指示対象や神学的内容を変更しない。
- issue: ἀδελφοίの指示範囲
  choice: 本文は「兄弟たち」、脚注で共同体全体を含み得ることを明示
  alternative: 兄弟姉妹たち
  rationale: 文法上の男性複数形を本文に反映しながら、パウロが会衆全体に語っている文脈上の包括性を失わないようにした。
- issue: 一致の性質
  choice: 「同じことを語り」「同じ思いと同じ判断」と原文の複数の側面を保持
  alternative: 全員が完全に同じ意見になる
  rationale: 本文は共同体の一致を求めるが、あらゆる事項での画一性とまで明示してはいないため、神学的・実践的範囲を訳文で狭く断定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的な訴えの丁重さと荘重さを保った。「さて」はδέの談話上の移行を自然に示す。「同じことを語る」は原文の具体性を残し、末尾は日本語として過度に命令的にならないよう「いてください」とした。
