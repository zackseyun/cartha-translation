  to: 兄弟たち[a]、私たちの主イエス・メシア[b]の名によって、あなたがたに勧めます。皆が同じことを語り、あなたがたの間に分裂[c]がなく、同じ思いと同じ判断において、しっかりと一つに結ばれていてください[d][e]。
