  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: ja
  text: しかし、召された者たち、すなわちユダヤ人にもギリシア人にも、メシア[a]は神の力であり、神の知恵です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: 召された者たち
  rationale: 形容詞の名詞的用法を、神によって召された人々という動詞的な含みを保って自然な現代日本語にした。
- source_word: Ἰουδαίοις
  choice: ユダヤ人
  rationale: 「ギリシア人」と対をなす民族的・宗教的呼称として明瞭である。
- source_word: Ἕλλησιν
  choice: ギリシア人
  rationale: より広い解釈語である「異邦人」ではなく、原文の語を直接保った。
- source_word: Χριστόν
  choice: メシア
  rationale: ここでは称号としての意味が生きているため、意味内容を表す「メシア」とした。日本語で一般的な「キリスト」は脚注に示した。
- source_word: θεοῦ δύναμιν
  choice: 神の力
  rationale: 属格の簡潔な反復を保つ自然な日本語表現とした。
- source_word: θεοῦ σοφίαν
  choice: 神の知恵
  rationale: 前句と並行する属格構文をそのまま明瞭に示した。
- source_word: implicit copula / verbless predicate relation
  choice: メシアは神の力、神の知恵です
  rationale: 原文は前節の動詞に依存し得る省略的な対格構文だが、この節を単独でも理解できるよう述語関係を明示し、二つの名詞述語の並列を保った。
theological_decisions:
- issue: Χριστόςをキリスト論的称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: 固有名のように音写するだけでなく、「油注がれた者」という称号性を示すため「メシア」とした。ただし、日本語聖書で定着した「キリスト」も語義上可能なので脚注に残した。
- issue: 省略された統語関係
  choice: 「メシアは神の力、神の知恵です」と述語関係を補う
  alternative: 「神の力、神の知恵であるメシアを〔私たちは宣べ伝えます〕」
  rationale: ギリシア語の対格は前節の「宣べ伝える」に統語的に依存し得る一方、意味上は召された者たちにとってのメシアのあり方を述べる。本文では自然な独立文とし、解釈を過度に拡張しない簡潔なコピュラ補充を採った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「にとっては」により αὐτοῖς の関係を自然に示し、「ユダヤ人にもギリシア人にも」の並行を保持した。
