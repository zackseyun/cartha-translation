id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: ja
  text: 神は真実な方です。この神によって、あなたがたは、神の御子、すなわち私たちの主イエス・メシアとの交わり[a]へと召されました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「交わり」は、「共にあずかること」または「共有」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: 真実な方
  rationale: 神が信頼に値し、約束を確かに守る方であることを表す。現代日本語として自然で、神の揺るがない誠実さを保つ。
- source_word: δι’ οὗ
  choice: この神によって
  rationale: διά＋属格が表す媒介・行為主体を、日本語で自然に示す。直前の「神」を明示的に受け、文意を明瞭にした。
- source_word: ἐκλήθητε
  choice: 召されました
  rationale: 神による呼びかけというパウロ書簡の語感を保ちつつ、受動形を忠実に表す。
- source_word: κοινωνίαν
  choice: 交わり
  rationale: 関係的な親交だけでなく、共にあずかり共有する含みも持つ、教会文脈で定着しつつ理解可能な訳語。補足を脚注に示した。
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: 神の御子…との
  rationale: κοινωνίαに続く属格を、日本語で自然な相手関係を示す「との」で表現した。「御子」は尊厳ある標準的な聖書語として用いた。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Ἰησοῦは固有名として音写し、Χριστοῦは称号として意味を訳した。日本語では称号を名に続ける形が簡潔で自然である。
- source_word: κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριοςのキリスト論的称号を、現代日本語で定着した「主」により保持した。
theological_decisions:
- issue: Χριστόςを慣用的な「キリスト」とするか、称号の意味を示す「メシア」とするか
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスの称号としての意味が保たれているため、称号を意味訳した。ただし日本語の自然さを損なわないよう「イエス・メシア」とした。
- issue: κοινωνίαを関係的な「交わり」に限定するか、参与・共有の含みを明示するか
  choice: 本文では「交わり」とし、参与・共有の含みを脚注で示す
  alternative: あずかること／共有
  rationale: 属格が示す関係には、御子との親しい結びつきと御子にあずかることの双方が含まれ得るため、一方に狭めず脚注で幅を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。長いギリシア語の一文を二文に分け、「この神によって」と受け直して読みやすくした。「すなわち」により「神の御子」と「私たちの主イエス・メシア」が同格であることを明示した。
