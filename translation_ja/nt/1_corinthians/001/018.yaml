id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: ja
  text: というのも、十字架についての知らせ[a]は、滅びつつある人々には愚かなものですが、救われつつある私たち[b]には神の力だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「十字架のことば」。
    reason: lexical_alternative
  - marker: b
    text: 「救われつつある」という表現は、ここで救いを進行中の現実として示している。
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: 知らせ
  rationale: ここでは単独の「語」ではなく、十字架について告げられる内容を指すため、現代日本語として明瞭な「知らせ」とした。「ことば」という語義も脚注に残した。
- source_word: σταυροῦ
  choice: 十字架
  rationale: キリストの十字架刑を指す換喩として理解できるが、原文の簡潔な表現と神学的な重みを保つため、字義どおり「十字架」とした。
- source_word: ἀπολλυμένοις
  choice: 滅びつつある人々
  rationale: 現在分詞が示す進行中の状態を保ち、「失われた人々」のように完了した状態へ限定しなかった。
- source_word: μωρία
  choice: 愚かなもの
  rationale: 日本語として自然な述語表現にしつつ、人間には愚かと映るものと神の力との対比を明確にした。
- source_word: σῳζομένοις
  choice: 救われつつある私たち
  rationale: 現在分詞の継続的な側面と、明示されたἡμῖν（私たち）をともに訳出した。
- source_word: δύναμις θεοῦ
  choice: 神の力
  rationale: 原文の簡潔で重みのある表現をそのまま保った。
theological_decisions:
- issue: σῳζομένοιςにおける救いの相
  choice: 救われつつある私たち
  alternative: 救われている私たち
  rationale: 現在分詞が表す、救いを現在進行中の現実として提示する含みを保持し、救いを過去の一時点だけに限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「というのも……だからです」によってγάρの理由説明を自然に表した。対照構造を保ち、平易さと荘重さの均衡を図った。
