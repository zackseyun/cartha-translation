id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: ja
  text: つまり、あなたがたはそれぞれ、「私はパウロにつく」「私はアポロにつく」「私はケファにつく」「私はメシア[a]につく」と言っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: つまり、…のです
  rationale: 直訳的な「私はこのことを言います」ではなく、前言を具体的に説明する機能を、自然な現代日本語の導入と文末で表した。
- source_word: ἕκαστος ὑμῶν λέγει
  choice: あなたがたはそれぞれ…と言っている
  rationale: ἕκαστοςの個別・分配的な意味を「それぞれ」で保ち、現在形λέγειは共同体内で見られる継続的な傾向として表した。
- source_word: εἰμι＋属格
  choice: …につく
  rationale: 各人物への所属・党派的な帰属を示す属格を、文脈に即した簡潔で自然な日本語にした。「…のものだ」よりも派閥的標語として理解しやすく、「従う」ほど弟子関係を明示しない。
- source_word: Παύλου / Ἀπολλῶ / Κηφᾶ
  choice: パウロ／アポロ／ケファ
  rationale: 人名を標準的に音写し、本文がΠέτροςではなくΚηφᾶを用いることも保持した。
- source_word: Χριστοῦ
  choice: メシア
  rationale: Χριστόςを称号として訳し、「油注がれた者」という機能を伝えるプロジェクト方針に従った。
theological_decisions:
- issue: 党派的標語におけるΧριστοῦの訳
  choice: メシア
  alternative: キリスト
  rationale: ここでもΧριστόςは称号であり、固有名のように音写せず「メシア」と訳した。誰の標語が正当かという解釈は本文に加えず、四つの発言を並列のまま保持した。
- issue: εἰμι＋属格が示す関係
  choice: …につく
  alternative: …のものだ／…に属する
  rationale: コリントの分派的忠誠という文脈を自然に示しつつ、所有関係や正式な弟子身分に意味を限定しない表現を選んだ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。反復される四つの標語を同じ構文でそろえ、原文の対照と修辞的なリズムを保った。
