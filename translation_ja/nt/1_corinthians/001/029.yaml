  text: so that no flesh may boast before God[a].
translation:
  language: ja
  text: それは、だれ一人として神の前で誇ることがないようにするためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「すべての肉」。ここでは人間一般を指す。
    reason: σάρξの字義を示しつつ、この文脈での指示対象が人間一般であることを明らかにするため。
lexical_decisions:
- source_word: ὅπως
  choice: それは〜ためです
  rationale: 前節までに述べられた神の選びの目的・結果を示す接続として、目的の力を保ちつつ自然な日本語にした。
- source_word: μὴ καυχήσηται
  choice: 誇ることがない
  rationale: 否定を伴うアオリスト接続法で、ὅπωςによる目的節を構成する。日本語では「誇ることがないため」が自然であり、誇りを排除する趣旨を表す。
- source_word: πᾶσα σὰρξ
  choice: いかなる肉なる者も
  rationale: 否定文における普遍的排除を「いかなる〜も…ない」で表しつつ、σάρξの比喩的響きを「肉なる者」として残した。ここでの指示対象は人間である。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前で
  rationale: 神の臨在・御前を表す簡潔で定着した日本語表現であり、原文の関係を忠実に保つ。
theological_decisions:
- issue: パウロにおけるσάρξの訳し方
  choice: 本文では「肉なる者」とし、人間を指すことを脚注で示す。
  alternative: 「人間」「だれ一人」「罪深い性質」
  rationale: この箇所のσάρξは内在する罪の原理ではなく、神の前にある弱く有限な人間を指す。「罪深い性質」は意味を不当に限定し、「人間」だけではパウロの修辞が失われるため、「肉」の語感と指示対象の明瞭さを両立させた。
translation_notes:
  register: 明瞭で現代的かつ端正な文体。「肉なる者」は日常語より聖書的な表現だが、原文の重要な比喩を保ち、脚注によって普通の読者にも意味が分かるようにした。
