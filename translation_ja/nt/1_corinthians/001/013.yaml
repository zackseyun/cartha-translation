id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: ja
  text: メシア[a]は分けられているのですか。パウロがあなたがたのために十字架につけられたのですか。それとも、あなたがたはパウロの名に入る洗礼を受けたのですか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「パウロの名へと洗礼を受けた」。この表現は、パウロの名との結び付きや帰属を示しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: 分けられてしまった
  rationale: 完了受動形が示す、分けられた結果としての状態を自然な現代日本語で表し、派閥によってメシアが分割されたかのように振る舞うことへの叱責を保った。
- source_word: ὁ Χριστός
  choice: メシア
  rationale: 定冠詞を伴い、ここでは固有名のような用法よりも称号としての意味が前面に出ているため、「メシア」とした。伝統的な「キリスト」は脚注に示した。
- source_word: μὴ
  choice: 修辞疑問の形で表現
  rationale: 否定の答えを予期する疑問であることは、日本語でも疑問文そのものから明瞭であり、「まさか」などを補って解釈を強める必要はない。
- source_word: ἐσταυρώθη
  choice: 十字架につけられた
  rationale: アオリスト受動形を、日本語で定着した明瞭な表現にした。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのために
  rationale: 代理・恩恵の含みを保ちつつ、その神学的ニュアンスを一義的に限定しない自然な訳。
- source_word: εἰς τὸ ὄνομα Παύλου
  choice: パウロの名によって
  rationale: 洗礼の定型句として自然な日本語を優先した。εἰςの方向性をより直訳的に示す表現は脚注に残し、帰属や結合の含みを消さないようにした。
- source_word: ἐβαπτίσθητε
  choice: 洗礼を受けた
  rationale: 受動形を保ち、一般の現代日本語読者に最も通じやすい標準的な表現を用いた。
theological_decisions:
- issue: ὁ Χριστόςを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: 冠詞付きの表現が称号性を際立たせるため「メシア」を本文に置いたが、日本語の伝統的・一般的な表記である「キリスト」も同じ語の妥当な訳として脚注に示した。
- issue: εἰς τὸ ὄνομαの洗礼文脈での関係性
  choice: 名によって
  alternative: 名へと
  rationale: 本文では自然な日本語の洗礼表現を採用しつつ、原文のεἰςが持つ方向性と、名への結合・帰属を示し得る余地を脚注で保持した。特定の洗礼神学に限定して言い換えることは避けた。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で格調ある修辞疑問として訳した。三つの疑問を原文どおり連ね、否定の答えを期待する鋭い調子を保った。「洗礼」は「バプテスマ」より広く理解される標準語として採用した。
