  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: ja
  text: それゆえ、偶像に献げられた食物を食べることについて言えば、私たちは、この世において、偶像は何ものでもなく[a]、ただひとりの神のほかに神はいない[b]ことを知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この世に偶像は実在しない」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神はただひとりである」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ τῆς βρώσεως
  choice: 食べることについて言えば
  rationale: βρῶσιςが食物そのものではなく食べる行為を指すことを保ちつつ、περίによる話題提示を自然な現代日本語で表した。
- source_word: τῶν εἰδωλοθύτων
  choice: 偶像に献げられた食物
  rationale: 偶像への供犠に関係する食物を指す。肉だけに限定せず、語の広がりを保った。
- source_word: οὖν
  choice: それゆえ
  rationale: 前の議論を受ける推論的なつながりを明示した。
- source_word: οἴδαμεν
  choice: 私たちは……知っています
  rationale: 現在の共有認識に訴える完了形の現在的意味を、率直に表した。
- source_word: οὐδὲν εἴδωλον ἐν κόσμῳ
  choice: この世で偶像は何ものでもなく
  rationale: 偶像の実在性または実質のなさを述べる簡潔なギリシア語を保った。「この世で」はἐν κόσμῳの自然な訳である。
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: ただひとりの神のほかに神はいない
  rationale: 唯一神についての排他的な主張を、神々と真の神との対比を損なわない自然な日本語で表した。
theological_decisions:
- issue: 偶像の無価値・非実在性と唯一神信仰
  choice: 「偶像は何ものでもない」と「ただひとりの神のほかに神はいない」を並べ、本文の強い主張をそのまま示す。
  alternative: 偶像には現実の存在がない、と明示し、後半を「神はただひとりである」と訳す。
  rationale: 本文が持つ偶像についての簡潔で幾分曖昧な表現を過度に形而上学的に限定せず、同時に唯一神についての主張を弱めないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの推論的な流れと共同体に共有された認識への訴えを保った。「献げられた」は宗教的供犠を示すが、特定教派の用語には寄せていない。
