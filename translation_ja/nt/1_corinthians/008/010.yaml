  source_fidelity: 全体として原文に忠実で、条件文、偶像神殿での食事、弱い者の良心、またοἰκοδομηθήσεταιの語彙的緊張をよく保っています。ただし、ἀσθενοῦς ὄντοςは観察した人を指すため、「その人は弱いのに、その良心が」という現行の分け方は不自然であり、「のに」は原文にない逆接も加えます。
  naturalness: 「その人は弱いのに、その良心が」は文の係り受けが不自然です。「その弱い人の良心は」とすれば、明瞭な現代標準日本語になり、原文の関係も自然に表せます。「食事の席についている」はκατακείμενονの食事場面を自然に伝えています。
  terminology: 「知識」「良心」「偶像に献げられた肉」は文脈に適切です。「築き上げられる」はοἰκοδομηθήσεταιの反復的な建徳語彙を保つ有効な直訳ですが、日本語では非慣用的なので脚注で慣用的な含意を示すのが適切です。皮肉であることは有力でも解釈を含むため、脚注では断定を避けます。
