reference: 1 Corinthians 8:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: ja
  text: というのは、知識を持つあなたが偶像の神殿で食事の席についているのを、だれかが見たなら、その弱い人の良心は、偶像に献げられた肉を食べるように「築き上げられる」[a]のではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「大胆にさせられる」「後押しされる」。ギリシア語は直訳すると「築き上げられる」。パウロが通常、信仰を育てる意味で用いる語が、ここでは有害な行為へ向かわせることに用いられており、皮肉を帯びている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: というのは
  rationale: 直前の警告の理由または具体例を示す論理的つながりを、自然な現代日本語で表した。
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: 知識を持つあなた
  rationale: 冠詞付き分詞が「あなた」を知識によって特徴づける構造を保ちつつ、日本語として簡潔にした。
- source_word: ἐν εἰδωλείῳ
  choice: 偶像の神殿で
  rationale: 偶像に属する祭儀的な神殿という場所を明確に示す。
- source_word: κατακείμενον
  choice: 食事の席についている
  rationale: 当時の食事で横になっていた具体像を踏まえつつ、現代の読者に食事中であることが明瞭に伝わる表現とした。
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: その人は弱いのに、その良心が
  rationale: ἀσθενοῦς ὄντοςが観察者の弱い状態を表すことを明示し、良心そのものだけが弱いと限定しなかった。
- source_word: οἰκοδομηθήσεται
  choice: 「築き上げられる」
  rationale: パウロが通常は建徳に用いる語を、有害な行為へ向かわせる文脈で皮肉に使う緊張を保持した。引用符と脚注で意図的な異様さを示した。
- source_word: τὰ εἰδωλόθυτα
  choice: 偶像に献げられた肉
  rationale: 祭儀で偶像に供えられた食物を指すが、この文脈で問題となる肉を自然かつ明瞭に表した。
theological_decisions:
- issue: 有害な模倣の文脈における οἰκοδομηθήσεται の訳
  choice: 「築き上げられる」
  alternative: 大胆になる／後押しされる
  rationale: 意訳だけにすると、パウロの通常の建徳語彙とのつながりと皮肉が失われるため、直訳的表現を本文に残し、文脈上の意味を脚注で示した。
- issue: ἀσθενοῦς ὄντος が修飾する対象
  choice: その人は弱いのに
  alternative: その弱い良心が
  rationale: 文法上は属格の「その人」が弱いとされており、弱さを良心だけに狭めずに表現した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「食事の席についている」により古代の食事姿勢を過度に異国的にせず、食事の場面を明確にした。「築き上げられる」は意図的に目立つため引用符を付し、脚注で皮肉と慣用的意味を説明した。
