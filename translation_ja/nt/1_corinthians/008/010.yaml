revisions:
- from: というのは、知識を持つあなたが偶像の神殿で食事の席についているのを、だれかが見たなら、その人は弱いのに、その良心が、偶像に献げられた肉を食べるように「築き上げられる」[a]のではありませんか。
  to: というのは、知識を持つあなたが偶像の神殿で食事の席についているのを、だれかが見たなら、その弱い人の良心は、偶像に献げられた肉を食べるように「築き上げられる」[a]のではありませんか。
  rationale: 観察者の弱さを「その弱い人の良心」と自然に統合し、原文にない逆接を除きました。本文の「築き上げられる」と脚注の語彙的代案は維持しつつ、皮肉についての脚注の断定を慎重な表現に改めました。
