    issue: ἀσθενοῦς ὄντοςの処理と「のに」
    rationale: 属格の分詞句は見た人が弱い状態にあることを示す。「その人は弱いのに、その良心が」は日本語としてぎこちなく、逆接の「のに」は原文の単なる叙述にない含意を加える。
  - severity: low
    issue: 脚注の「皮肉に使われている」という断定
    rationale: οἰκοδομηθήσεταιには通常の建徳語彙との意図的な緊張があるが、皮肉と断定することは翻訳上の解釈を一段進める。「皮肉を帯びている可能性がある」とするほうが原文の修辞を保ちつつ慎重である。
  revised_text: というのは、知識を持つあなたが偶像の神殿で食事の席についているのを、だれかが見たなら、その弱い人の良心は、偶像に献げられた肉を食べるように「築き上げられる」[a]のではありませんか。
