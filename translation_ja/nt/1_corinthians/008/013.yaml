id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: ja
  text: ですから、食べ物が私の兄弟をつまずかせるのなら、私は自分の兄弟をつまずかせないために、いつまでも決して肉を食べません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: 食べ物
  rationale: 食物一般を指す語として自然に訳し、後半の「肉」との区別を保った。
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: つまずかせる
  rationale: 信仰上の過ちや破滅へ導く可能性を含む文脈上の比喩を、定着した自然な表現で保持した。
- source_word: κρέα
  choice: 肉
  rationale: 食用の肉を指す複数形の名詞を、日本語で自然な集合名詞として訳した。
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: いつまでも決して…食べません
  rationale: 強い否定と「永遠に／いつまでも」という時間表現の双方を明示し、原文の誓約的な強調を保った。
theological_decisions:
- issue: パウロの発言が一般的な食物規定か、兄弟をつまずかせないための条件付き自己制限か
  choice: 「…のなら」「…ために」により、兄弟をつまずかせる場合の条件付き自己制限として表現した。
  alternative: 肉を食べること自体の恒久的禁止として表現する。
  rationale: εἰによる条件節とἵνα μήによる目的節が明確であり、禁止の根拠は食物そのものではなく兄弟への影響にある。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、論証を締めくくる「ですから」と、原文の強い否定および「いつまでも」を保持した。「兄弟」は当時の信仰共同体の関係語として原語に沿って残した。
