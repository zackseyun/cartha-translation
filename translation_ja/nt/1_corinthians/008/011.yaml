id: 1CO.8.11
reference: 1 Corinthians 8:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: ja
  text: というのも、あなたの知識によって、弱い人、すなわちメシアがその人のために死なれた兄弟が、滅びていくからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅びる」または「破滅する」とも訳せる。ギリシア語は深刻な破滅を表すが、ここで一時的な霊的破綻、終末的な滅び、あるいはその両方のどれを指すかは断定されていない。
    reason: alternative_reading
  - marker: b
    text: ここで「兄弟」は同じ信仰にある仲間を指す。文脈上、その適用には信仰にある姉妹も含まれ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: 滅びに至る
  rationale: 現在形の深刻な破滅・喪失の意味を保ちつつ、それが一時的な霊的破綻か終末的な滅びかを本文で断定しない表現とした。
- source_word: γάρ
  choice: そのため
  rationale: 直前の警告を受け、その帰結・理由を示す接続として、現代日本語で自然に表した。
- source_word: ὁ ἀσθενῶν
  choice: 弱い人
  rationale: 名詞的現在分詞の単数性を保ち、後に出る「兄弟」をここへ先取りしない。
- source_word: ἐν τῇ σῇ γνώσει
  choice: あなたの知識によって
  rationale: ἐν がここで手段ないし原因となる領域を表すため、「によって」と訳した。
- source_word: γνῶσις
  choice: 知識
  rationale: 8章で反復される語を一貫して表し、知識が兄弟を害するという皮肉を保持する。
- source_word: ὁ ἀδελφός
  choice: その兄弟
  rationale: 男性単数形を本文に反映する。同じ信仰に属する仲間という文脈上の意味は注で示す。
- source_word: δι’ ὃν
  choice: その人のために
  rationale: διά＋対格の受益的意味を自然な日本語で表した。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは称号として機能し、その死の救済的意義を示している。
- source_word: ἀπέθανεν
  choice: 死なれた
  rationale: アオリストの出来事を過去形で表し、主語への自然な敬意を示す日本語とした。
theological_decisions:
- issue: ἀπόλλυταιが真の信者の最終的・永遠の滅びを必然的に意味するか
  choice: 滅びに至る
  alternative: 滅ぼされる／破滅する
  rationale: 語の深刻さを弱めず、時間的な霊的破綻と終末的な滅びのどちらかに限定しない。
- issue: ἀδελφόςの性別表現
  choice: 兄弟
  alternative: 信仰の仲間／兄弟姉妹
  rationale: 原文の男性単数を本文に保ちつつ、文脈上は同じ信仰にある人を指し、適用上女性を含み得ることを注記する。
- issue: Χριστόςを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名化した呼称よりも「油注がれた者」という称号として機能しているため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの厳しい警告と修辞的な後置同格を保った。「メシア」は称号として表記した。
