  to: というのも、あなたの知識によって、弱い人、すなわちメシアがその人のために死なれた兄弟が、滅びていくからです。[a][b]
  rationale: 接続詞γάρを説明用の「というのも」に改め、原文の論理を回復した。さらに、「弱い人」と「メシアがその人のために死なれた兄弟」が同一人物であることを「すなわち」によって明示した。これにより、原文の厳しい警告、単数表現、同格関係、そしてἀπόλλυταιが含む破滅の範囲についての曖昧さを保ちながら、自然な現代日本語にした。
