  - severity: medium
    issue: 「主々」が現代日本語として不自然
    rationale: 原文の複数形は「多くの主」で明確に表せます。「主々」は一般的な現代日本語の語法ではなく、明瞭さを損ないます。
  - severity: low
    issue: 後半の「神々」「主々」へのかぎ括弧は不要
    rationale: かぎ括弧は原文にない距離化を加え、λεγόμενοιが直接かかる前半と後半との関係をかえって不自然にします。パウロの修辞上の距離は「神々と呼ばれるもの」と脚注で十分に示せます。
  revised_text: というのも、たとえ天にであれ地にであれ、神々と呼ばれるものが存在するとしても――実際、多くの神々や多くの主がいるのですが――、
