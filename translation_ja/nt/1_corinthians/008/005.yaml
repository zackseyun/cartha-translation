revisions:
- from: たとえ神々と呼ばれるものが、天にであれ地にであれ存在するとしても――実際、多くの「神々」や多くの「主々」がいるのですが[a][b]――
  to: というのも、たとえ天にであれ地にであれ、神々と呼ばれるものが存在するとしても――実際、多くの神々や多くの主がいるのですが――、
  rationale: καὶ γάρを「というのも」で訳出し、εἴπερの譲歩は「たとえ…としても」で保持しました。ὥσπερ εἰσὶν以下は「実際」とし、原文と同様に挿入的に置いて6節へ続く構文を保っています。「主々」を自然な「多くの主」に改め、原文にないかぎ括弧は除きました。脚注標識は、それぞれ「神々と呼ばれるもの」と「主」の直後に置くことが望まれます。
