  source_fidelity: 原文の基本構造、譲歩条件（εἴπερ）、「天／地」の対、また「多くの神々／多くの主」の反復はよく捉えています。しかし、καὶ γάρの説明的・強調的な導入が本文から落ちています。また、後半のθεοὶ・κύριοιだけをかぎ括弧で囲むことは原文にない解釈上の強調であり、λεγόμενοιが修飾する前半との対応もやや不均衡です。
  naturalness: 「主々」は意味は理解できるものの、明瞭な現代標準日本語としては非常に不自然です。「多くの主」で複数性は「多くの」に十分表され、6節の「主」との語彙的対応も保てます。「というのも、たとえ…としても――実際、…いるのですが――」は、節が6節へ継続することを自然に示します。
  terminology: 「神々」「主」は適切です。κύριοιを「主」として6節との対応を保持するのがよく、「主々」という人工的な複数形は不要です。「神々と呼ばれるもの」はλεγόμενοι θεοίの呼称性を保っており、安全な訳です。
