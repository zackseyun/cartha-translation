  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: ja
  text: というのも、たとえ天にであれ地にであれ、神々と呼ばれるものが存在するとしても――実際、多くの神々や多くの主がいるのですが――、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: たとえ…としても
  rationale: γάρの文脈上のつながりを保ちつつ、καίとεἴπερを合わせた譲歩的な導入を、現代日本語として自然に表した。前節からの説明関係は文脈で明らかである。
- source_word: εἴπερ εἰσὶν
  choice: 存在するとしても
  rationale: 議論のために認める譲歩的条件を表す。存在のあり方を断定しすぎず、後半の確認的表現との緊張を残す。
- source_word: λεγόμενοι θεοὶ
  choice: 神々と呼ばれるもの
  rationale: 分詞の基本的な『呼ばれている』という意味を本文に残し、それが呼称であって真の神性の承認ではないことを示す。日本語の『いわゆる神々』よりも原語の曖昧さを保つ。
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: 天にであれ地にであれ
  rationale: 二つの領域を対にした原文の構造と宇宙的な範囲を、簡潔で格調ある日本語で再現する。
- source_word: ὥσπερ εἰσὶν
  choice: 実際、…いるのですが
  rationale: ὥσπερの確認的なニュアンスを示しながら、この節が次節へ続く未完の譲歩構文であることを語尾で表す。
- source_word: θεοὶ πολλοὶ
  choice: 多くの「神々」
  rationale: 複数形を保ち、かぎ括弧によって人々が神と認める対象についての呼称であり、唯一の神と同列に断定していないことを示す。
- source_word: κύριοι πολλοί
  choice: 多くの「主々」
  rationale: κύριοςと6節の『主』との語彙的対応を保つため『主人たち』とはせず、珍しい複数形ながら『主々』とした。かぎ括弧で唯一の主との区別を示す。
theological_decisions:
- issue: 異教の神々に対するパウロの距離の取り方
  choice: λεγόμενοι θεοὶを『神々と呼ばれるもの』とし、後出の『神々』をかぎ括弧に入れる
  alternative: 『いわゆる神々』
  rationale: 文脈上の距離は明確にしつつ、λεγόμενοι自体が持つ『呼ばれる』と『いわゆる』の幅を本文で過度に一方へ限定しないため。
- issue: 多くの神々・主々が『いる』という表現と一神信仰との緊張
  choice: 原文どおり『実際、多くの「神々」や多くの「主々」がいる』と訳す
  alternative: 『実際、神々や主々とされるものは多い』
  rationale: ὥσπερ εἰσὶνの存在表現を弱めず、同時に呼称を示すかぎ括弧と6節への文の継続によって、唯一の神・唯一の主との区別を保つ。
- issue: κύριοιと6節の唯一のκύριοςとの対応
  choice: 『主々』
  alternative: 『主人たち』『支配者たち』
  rationale: 日本語では稀な形だが、原語の反復を可視化し、5節の多数の『主』と6節の唯一の『主』との意図的な対照を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、対句『天にであれ地にであれ』と語彙的対照『神々／主々』を保持した。節末は次節へ続く構文を示すためダッシュと『のですが』で開いた形にした。脚注標識[a][b]は対応箇所の直後に置いた。
