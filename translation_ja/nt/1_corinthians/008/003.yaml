id: 1CO.8.3
reference: 1 Corinthians 8:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: ja
  text: しかし、だれでも神を愛しているなら、その人は神に知られています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神に認められています」または「神に知られた者です」。ギリシア語の完了受動形は、神に知られ、その状態が続いていることを示唆し得ます。
    reason: 語義上の別訳と完了形の含意を示すため。
lexical_decisions:
- source_word: εἰ δέ
  choice: しかし、…なら
  rationale: εἰの条件と、直前の「知識」と「愛」をめぐる議論に対するδέの穏やかな対比を、自然な現代日本語で表した。
- source_word: τις
  choice: だれでも
  rationale: 不定代名詞の包括的・一般的な意味を保ち、性別を限定しない自然な表現とした。
- source_word: ἀγαπᾷ
  choice: 愛している
  rationale: 現在能動形の継続的な含みを自然に示しつつ、ἀγαπάωを直接的に訳した。
- source_word: τὸν θεόν
  choice: 神を
  rationale: 定冠詞付きのθεόςを、文脈上明確な唯一の神として日本語の通常の言い方で表した。
- source_word: οὗτος
  choice: その人
  rationale: 直前に述べた人を指し示す指示代名詞の力を保ちながら、現代日本語として不自然な「この者」を避けた。
- source_word: ἔγνωσται
  choice: 知られています
  rationale: γινώσκωの完了受動形が示す、知られた結果として現在も続く状態を簡潔に表した。
- source_word: ὑπ’ αὐτοῦ
  choice: 神に
  rationale: αὐτοῦの指示対象は直前の「神」である。日本語では「その方に」よりも「神に」と明示するほうが自然で誤解がない。
theological_decisions:
- issue: 神が人を「知る」ことの意味
  choice: 神に知られています
  alternative: 神に認められています／神に受け入れられています
  rationale: 神を主語とするγινώσκωには、単なる情報的認知を超えた関係的な承認や契約的な意味が含まれ得る。しかし本文はその意味を一つに限定していないため、広がりと神学的緊張を保つ表現にした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「その人」によりοὗτοςの指示性を表し、「神に」を繰り返して代名詞の指示対象を明確にした。
