  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: ja
  text: だれかが自分は何かを知っている[a]と思うなら、その人は、知るべき仕方ではまだ知っていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分は何かを知るに至ったと思う」。
    reason: ἐγνωκέναιは完了不定詞であり、知るに至ってその知識を有しているという含みを明示する代替訳。
lexical_decisions:
- source_word: εἴ τις
  choice: 人がいるなら
  rationale: 不定代名詞を伴う条件節を、一般的な対象を表す自然な日本語にした。
- source_word: δοκεῖ
  choice: 思う
  rationale: 外見上そう見えるというより、本人の主観的な自己評価を表す。
- source_word: ἐγνωκέναι τι
  choice: 何かを知っている
  rationale: 完了不定詞が示す、知識を得て現在それを有しているとの自認を、自然な日本語で表した。
- source_word: οὔπω ἔγνω
  choice: まだ知っていません
  rationale: οὔπωの未完了性を「まだ……ない」で保ち、ここでのアオリストを文脈に即した現在的評価として訳した。
- source_word: καθὼς δεῖ γνῶναι
  choice: 知るべきようには
  rationale: καθὼςの様態・基準とδεῖの規範的な必要性を簡潔に保ち、知識そのものの全面否定を避けた。
theological_decisions:
- issue: パウロの批判の性質
  choice: 知識そのものではなく、知っているとの自己評価と、その知り方の不十分さへの批判
  alternative: 人間には何も知ることができないという全面的否定
  rationale: 本文は「まだ知らない」に続けて「知るべきようには」と基準・様態を示しており、知識の全面否定ではなく、思い上がった認識の不足を指摘している。
- issue: 不定単数 τις の表現
  choice: 人がいるなら、その人は
  alternative: 誰でも
  rationale: 性別を限定せず、ギリシア語の不定単数と後続節の個別的な指示を明瞭に保つため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「知るべきようには」というやや格調ある表現で、原文の反復と様態上の緊張を保持した。
