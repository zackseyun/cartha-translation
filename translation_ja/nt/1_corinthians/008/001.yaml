source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: ja
  text: 偶像に献げられた食物[a]については、私たちは皆、知識を持っている[b]ことを知っています。知識は人を思い上がらせますが、愛は築き上げます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「偶像に供えられた肉」または「偶像に献げられた物」。
    reason: lexical_alternative
  - marker: b
    text: 「私たちは皆、知識を持っている」は、パウロがコリントの人々の標語を取り上げた表現かもしれません。
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 〜については
  rationale: 新しい話題を導入する書簡上の移行を、明示的な時間語を加えず、自然な現代日本語で表した。
- source_word: τῶν εἰδωλοθύτων
  choice: 偶像に献げられた食物
  rationale: 偶像礼拝で供えられた物、文脈上とりわけ食物を指す。肉だけに限定せず、祭儀的な意味を保った。
- source_word: οἴδαμεν
  choice: 知っています
  rationale: 現在の意味で機能する完了形を直接的に訳し、後続の内容節との関係を保った。
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: 私たちは皆、知識を持っていることを
  rationale: πάντεςの包括的な表現とγνῶσιςの語を明示し、コリント側の標語である可能性を本文で断定しなかった。
- source_word: ἡ γνῶσις
  choice: 知識
  rationale: 直前のγνῶσινとの語彙的なつながりを保ち、一般的・抽象的な意味として訳した。
- source_word: φυσιοῖ
  choice: 人を思い上がらせます
  rationale: 膨れ上がるという比喩が示す高慢の意味を、現代の一般読者に明瞭な日本語で表した。
- source_word: ἡ δὲ ἀγάπη
  choice: しかし、愛は（本文では「〜ますが、愛は」）
  rationale: 知識との対照を自然な接続で示し、ἀγάπηを一般的な「愛」と訳した。
- source_word: οἰκοδομεῖ
  choice: 人を築き上げます
  rationale: 建築の比喩を保ちながら、愛が他者を成長・強化させる働きを分かりやすく表した。
theological_decisions:
- issue: 「私たちは皆、知識を持っている」がパウロ自身の断言か、コリントの人々の標語への言及か
  choice: 本文では引用符や限定を加えず、そのまま内容節として訳す
  alternative: 「『私たちは皆、知識を持っている』と言われています」のように標語として明示する
  rationale: ギリシア語本文には引用を明示する標識がないため、修辞的な帰属を本文で決めず、可能性を脚注に示した。
- issue: φυσιοῖの比喩をどの程度明示するか
  choice: 「人を思い上がらせます」
  alternative: 「人を膨れ上がらせます」
  rationale: 高慢という文脈上の作用を明瞭に伝えつつ、知識と愛が人に及ぼす対照を保った。
translation_notes:
  register: 明瞭で現代的ながら、書簡本文にふさわしい落ち着いた敬体を用いた。「知識」と「愛」、「思い上がらせる」と「築き上げる」の対照が耳で聞いても分かる語順にした。
