id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: ja
  text: このように、兄弟たち[a]に対して罪を犯し、彼らの弱い良心を傷つけることによって、あなたがたはメシア[b]に対して罪を犯しているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は信者仲間を指し、文脈上、男性だけでなく女性も含み得ます。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」とも訳せます。ギリシア語は Χριστός（クリストス）です。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: このように
  rationale: 前節までに述べられた行為の仕方を振り返って指す表現。δὲはここでは強い逆接ではなく、論旨を軽くつなぐため、日本語では明示的な接続詞を加えず自然に表した。
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: 兄弟たちに対して罪を犯し
  rationale: εἰςは罪の向けられる相手を示すため「に対して」とした。ἀδελφοίは男性複数形を保って「兄弟たち」とし、共同体の女性を含み得ることは脚注で示した。
- source_word: τύπτοντες
  choice: 傷つける
  rationale: 字義的には「打つ」だが、ここでは良心に害を与える比喩的用法。「傷つける」はその強さと現代日本語の自然さを両立する。
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: 彼らの弱い良心
  rationale: 原文の単数形「良心」と、それを修飾する「弱い」を保持した。複数の人に属する良心を分配的に述べている。
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: メシアに対して罪を犯している
  rationale: εἰςの方向・敵対の意味を「に対して」で表し、現在形の継続的な響きを「犯している」とした。Χριστόςは称号として「メシア」と訳した。
theological_decisions:
- issue: ἀδελφοὺςが指す範囲
  choice: 本文では「兄弟たち」とし、信者仲間全体を指し得ることを脚注で説明する
  alternative: 兄弟姉妹／信者仲間
  rationale: 原文の男性複数形を本文で保ちながら、教会共同体を指す文脈上、女性も含み得る意味範囲を明示するため。
- issue: Χριστόνの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは油注がれた主という称号の意味が保たれているため「メシア」とし、伝統的な音訳は脚注に示した。
- issue: 分詞と主動詞の関係
  choice: 「なら」を用いて、前半の行為と後半の断定を結ぶ
  alternative: 罪を犯し……傷つけているあなたがたは
  rationale: 二つの現在分詞が主動詞の行為の状況・仕方を示す関係を、明瞭で自然な日本語にした。条件を仮定するというより、そのように行うとき何をしていることになるかを述べる用法である。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの直接的で厳粛な警告の調子を保った。「良心」は本文の神学的・倫理的な重要語として維持し、過度な言い換えを避けた。
