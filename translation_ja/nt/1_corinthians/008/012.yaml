  rationale: 「なら」を「ことによって」に改め、二つの分詞が主動詞に対して示す手段・態様の関係を明示した。それ以外の訳語と脚注は原文への忠実さ、現代標準日本語としての明瞭さ、および用語方針に照らして維持できる。
