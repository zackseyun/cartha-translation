id: 1CO.8.8
reference: 1 Corinthians 8:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: ja
  text: しかし、食べ物が私たちを神に近づけるわけではありません。[a] 食べても私たちに益があるわけではなく、食べなくても私たちが不足するわけでもないからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食べ物が私たちを神の前に立たせるわけではありません」、または「食べ物によって私たちが神に認められるわけではありません」。
    reason: παραστήσειは「前に立たせる」「差し出す」「認められる者として示す」などの含みを持ちうるため。
  - marker: b
    text: 別訳「食べても有利になるわけではなく、食べなくても不利になるわけではありません」。
    reason: 「益がある」と「不足する」の対句は、ここでは利益・不利益や優位・劣位を指す可能性があるため。
lexical_decisions:
- source_word: βρῶμα
  choice: 食べ物
  rationale: 特定の肉や食事ではなく、広く食物を指す語であるため。現代日本語として平明で、文脈にも適する。
- source_word: παραστήσει τῷ θεῷ
  choice: 私たちを神に近づける
  rationale: παρίστημιの「前に立たせる、引き合わせる、差し出す」という幅を、この文脈における神との関係上の立場として自然な日本語で表した。原語により近い表現は脚注に残した。
- source_word: περισσεύομεν
  choice: 私たちに何かが増す
  rationale: 「豊かになる、余分に持つ、優位に立つ」という語義を、後半の「欠ける」と対照させつつ、何が増すのかを本文が明示していない点も保った。
- source_word: ὑστερούμεθα
  choice: 何かが欠ける
  rationale: 「不足する、劣る」という意味を表し、περισσεύομενとの対句を維持した。
- source_word: δὲ ... γὰρ
  choice: しかし……からです
  rationale: δὲの穏やかな対照と、γὰρが導く理由説明を、自然な日本語の論理関係として示した。
theological_decisions:
- issue: 食物と神の前での人の立場との関係
  choice: 食べ物そのものが人を神に近づけるのではなく、食べることにも食べないことにも、それ自体で人を増し加えたり欠けさせたりする効力はないと訳した。
  alternative: 偶像に供えられた食物には宗教的価値がないという、直近の問題だけに限定して読むこともできる。
  rationale: 直近の文脈は偶像に供えられた食物と良心を扱うが、この節の表現はより一般的である。何が「増す」「欠ける」のかを補いすぎず、神の前での立場をめぐる含みと文脈上の緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、口語的になりすぎない敬体で整えた。「何かが増す／何かが欠ける」によって原文の対句と対象の非明示性を保ち、脚注で自然な意味上の別訳を示した。
