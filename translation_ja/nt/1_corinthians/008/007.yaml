id: 1CO.8.7
reference: 1 Corinthians 8:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: ja
  text: しかし、すべての人がこの知識を持っているわけではありません。ある人たちは、今に至るまで偶像とのかかわりに慣れているため[a]、その食物を偶像に供えられたものとして食べます。そして、弱い彼らの良心は汚されます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今に至るまで偶像とのかかわりに慣れているため」は、直訳すれば「偶像についての、今に至るまでの習慣（慣れ）によって」ほどで、ギリシア語では係り方が難しい句です。ここでは、偶像礼拝との過去から続くかかわりという意味に訳しています。いくつかの写本は、ここで「習慣（慣れ）」ではなく「良心」と読みます。
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: 知識
  rationale: 直前の文脈で、偶像は実体のないものだと「知っている」ことを指すパウロの語法とのつながりを保つ。
- source_word: συνήθεια
  choice: なじんできた
  rationale: 単なる習慣ではなく、これまでの偶像礼拝との慣れ親しんだ関係がなお影響していることを、自然な現代日本語で表す。
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: 今なお偶像に
  rationale: 難解な句だが、ἕως ἄρτιの時間的意味を明示し、συνήθειαと結びつく表現として訳す。別の本文系統を脚注に示す。
- source_word: εἰδωλόθυτον
  choice: 偶像に供えられた食物
  rationale: 偶像への供犠との関連を明確にしつつ、偶像を実在の神と認める含意を避ける。
- source_word: συνείδησις
  choice: 良心
  rationale: 道徳的な自己認識を指すパウロ書簡での標準的な訳語。
- source_word: ἀσθενής
  choice: 弱い
  rationale: 本章で一貫して用いられる、良心がこの問題について十分な確信を持たない状態を保つ。
- source_word: μολύνεται
  choice: 汚されます
  rationale: 良心が道徳的・宗教的に汚染されるという受動の意味と倫理的な重みを表す。
theological_decisions:
- issue: 偶像に供えられた食物の位置づけ
  choice: それを偶像に供えられた食物として食べます
  alternative: 偶像へのいけにえとしてそれを食べます
  rationale: 食べる人の認識における祭儀的意味を表し、偶像が真の神々であるとパウロが認めたかのようには訳さない。偶像は実体のないものだという知識と、なお良心が傷つき得るという緊張を保つ。
- issue: 難解な τῇ συνηθείᾳ ἕως ἄρτι τοῦ εἰδώλου の扱い
  choice: 今なお偶像になじんできたため
  alternative: 今に至るまでの偶像との習慣によって
  rationale: 時間的要素と、過去から続く偶像礼拝の影響の双方を表しながら、ギリシア語の難しさを過度に解消しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ敬体。難解な原文は本文で自然に表し、異読と構文上の不確かさを脚注で保持した。
