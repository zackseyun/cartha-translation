status: reviewed
revisions:
- from: しかし、すべての人にこの知識があるわけではありません。ある人たちは、今なお偶像になじんできたため、それを偶像に供えられた食物として食べます。そして、彼らの良心は弱いため、汚されます。[a]
  to: しかし、すべての人がこの知識を持っているわけではありません。ある人たちは、今に至るまで偶像とのかかわりに慣れているため[a]、その食物を偶像に供えられたものとして食べます。そして、弱い彼らの良心は汚されます。
  rationale: 本文は、難解な τῇ συνηθείᾳ ἕως ἄρτι τοῦ εἰδώλου の継続性と偶像礼拝との関わりを、「今に至るまで偶像とのかかわりに慣れている」として自然に表します。解釈を固定しすぎないため、句の文字どおりの構成と「習慣（慣れ）」／「良心」の異読を脚注に残します。「その食物」により εἰδωλόθυτον の対象を明瞭にし、「偶像に供えられたものとして」は食べる人たちの認識上の祭儀的意義を表します。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:39Z'
review_pass:
  verdict: revise
  source_fidelity: 「偶像になじんできた」は日本語では偶像そのものに親しむという意味に傾き、τῇ συνηθείᾳ…τοῦ εἰδώλου が示す、偶像礼拝との従来から続く関わり・慣れの文脈を十分に表しません。また、「それ」は日本語の一節として指示対象がやや不明瞭です。
  naturalness: 敬体と全体の流れは明瞭です。ただし「偶像になじむ」は不自然ではないものの意図する意味を取りにくいため、「偶像とのかかわりに慣れている」とするほうが現代標準日本語として自然で明確です。
  terminology: 「知識」「良心」「弱い」「汚されます」は適切です。「偶像に供えられたもの」は εἰδωλόθυτον の祭儀的含意を保ち、偶像の実在性を肯定しません。
  issues:
  - severity: medium
    issue: 「今なお偶像になじんできたため」
    rationale: 原文の難しい句は、偶像礼拝との以前から継続する慣れ・関わりを指す文脈です。現行訳は「偶像になじむ」という日本語の通常の意味に寄り、関わり・習慣という含意が弱くなっています。
  - severity: low
    issue: 脚注のアンカー位置と内容
    rationale: 脚注は難解句と異読を説明していますが、本文末のアンカーではどの句に関する注かが分かりにくくなります。難解句の直後に置き、異読を「習慣（慣れ）」と「良心」の読みの差として明示するのが適切です。
  - severity: low
    issue: 「それ」の指示対象
    rationale: 単独で読んだ場合にも明瞭になるよう、「その食物」または「偶像に供えられた食物」と明示するのが望ましいです。
