- from: しかし、私たちにとっては、唯一の神である父がおられます。すべてのものはこの方から出ており、私たちはこの方のために存在します。[a] また、唯一の主、イエス・キリストがおられます。[b] すべてのものはこの方を通して存在し、私たちもこの方を通して存在します。[c]
  to: しかし、私たちにとっては、唯一の神である父がおられ、すべてのものはこの方から由来し、私たちはこの方のために存在します。また、唯一の主、イエス・キリストがおられ、すべてのものはこの方を通して存在し、私たちもこの方を通して存在します。[a][b][c]
  rationale: 本文を一文に整え、原文の「一人の神、父」と「一人の主、イエス・キリスト」の並行構造、および「から」「ために」「通して」の対照を見えやすくした。「出ており」を「由来し」に改め、父が万物の源であることを、より中立的かつ原文に即して表した。脚注a・bは意味の幅を適切に示しているため、文言を最小限整えた。脚注cの内容は本文の対応関係を説明するものであり、理由区分をcross_referenceに整えた。
