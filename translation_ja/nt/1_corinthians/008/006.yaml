id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: ja
  text: しかし、私たちにとっては、唯一の神である父がおられ、すべてのものはこの方から由来し、私たちはこの方のために存在します。また、唯一の主、イエス・キリストがおられ、すべてのものはこの方を通して存在し、私たちもこの方を通して存在します。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちはこの方へと向かっています」とも訳せる。ギリシア語の表現は、方向、目標、または目的を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「イエス・メシア」とも訳せる。「キリスト」はギリシア語で「油を注がれた者」を意味し、「メシア」に当たる。ここでは称号としても、名前の一部のようにも理解できる。
    reason: alternative_reading
  - marker: c
    text: 「すべてのものは父から」と「すべてのものはイエス・キリストを通して」という対応は、父を源として、イエス・キリストを媒介者として区別している。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 前節の「多くの神々、多くの主」に対し、信仰告白の立場を明確に対比させる接続詞として、現代日本語で自然な「しかし」を選んだ。
- source_word: ἡμῖν
  choice: 私たちにとっては
  rationale: 関係・観点を示す与格であり、パウロと信者たちの告白的立場を自然に表す。
- source_word: εἷς θεὸς ὁ πατήρ
  choice: 唯一の神である父
  rationale: εἷςの数的・排他的な力と、ὁ πατήρによる同定を保つ。「一人の神」よりも日本語の信仰告白として明瞭な「唯一の神」とした。
- source_word: ἐξ οὗ τὰ πάντα
  choice: すべてのものはこの方から出ており
  rationale: ἐκの起源・源を表す意味を保持する。省略された存在動詞を過度に限定せず、日本語として通じる形にした。
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: 私たちはこの方のために存在します
  rationale: εἰςが表し得る方向・目標・目的のうち、ここでは人が神を終極の目的として存在することを自然に表す。ただし「この方へ」とも訳し得るため注記した。
- source_word: εἷς κύριος
  choice: 唯一の主
  rationale: 「唯一の神」との並行を保持し、κύριοςの称号としての重みを弱めない。
- source_word: Ἰησοῦς Χριστός
  choice: イエス・キリスト
  rationale: 現代日本語で定着した表記を採用した。Χριστόςには「メシア」という称号の意味があることを注記し、称号性と固有名詞化の間の幅を保った。
- source_word: δι’ οὗ τὰ πάντα
  choice: すべてのものはこの方を通して存在し
  rationale: 属格を伴うδιάの媒介・作用を「通して」で表し、父についての「から」と区別した。日本語として文を成立させるため「存在し」を補った。
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: 私たちもこの方を通して存在します
  rationale: 原文の省略を文脈に即して補いつつ、それが創造、生命、救いのどれだけを指すかは限定しない。
theological_decisions:
- issue: 「唯一の神」と「唯一の主」の関係
  choice: 「唯一の神である父」と「唯一の主、イエス・キリスト」を並行して訳し、両者の重みと区別をともに保持した。
  alternative: 後代の教理用語を補って両者の関係を説明する、または「主」の意味を弱める。
  rationale: 本文は一神信仰的な告白の中で父とイエス・キリストを語りつつ、「から」と「通して」によって関係を区別している。翻訳ではこの緊張を解消せず、そのまま示す。
- issue: 父とキリストについて用いられる前置詞
  choice: ἐξを「から」、εἰςを「ために」、διάを「通して」と訳し、それぞれの関係を区別した。
  alternative: εἰςを「へ」と訳す、またはδιάを単に「によって」と訳す。
  rationale: 父を源また目的として、キリストを媒介者として示す原文の構造を保つ。「ために」は文脈上自然だが、εἰςの方向性も注で明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、信仰告白としての荘重さを保った。「この方」を反復して指示対象を明確にし、原文の並行構造を見える形にした。原文に動詞が省略されている箇所では、日本語として必要な範囲で「存在します」を補ったが、その存在が創造・生命・救いのいずれを特に指すかは限定していない。
