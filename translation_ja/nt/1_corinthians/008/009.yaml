  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: ja
  text: しかし、あなたがたのこの権利[a]が、弱い人たち[b]にとってつまずきの原因となることがないように、よく注意しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのこの自由」。ギリシア語は「権威」「権利」「自由」を意味し得る。ここでは、偶像に供えられた食物を食べることについて、一部の信者が自分にあると考えた自由を指す。
    reason: lexical_alternative
  - marker: b
    text: ここで「弱い人たち」とは、この問題について良心が弱い人たちを指す。
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: よく注意しなさい
  rationale: 警戒を促す現在命令形。自然な現代日本語で継続的な注意と警告の力を表す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の議論から警告へ移る穏やかな対照を示す。
- source_word: μή πως
  choice: …とならないよう
  rationale: 起こり得る好ましくない結果への警戒を表す否定的な予防表現として、日本語で自然に訳した。
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: あなたがたのこの権利
  rationale: 文脈上、偶像に供えられた食物を食べることについて一部の信者が認められていると考えた権利・自由を指す。「権威」より具体的な倫理上の主張を明確にする。
- source_word: πρόσκομμα
  choice: つまずかせるもの
  rationale: 他者の霊的・道徳的な転倒を引き起こす障害という比喩を、自然な日本語の使役表現で保持する。
- source_word: γένηται
  choice: となる
  rationale: 否定的な予防節における「生じる、なる」という意味を簡潔に表す。
- source_word: τοῖς ἀσθενέσιν
  choice: 弱い人たち
  rationale: この章では良心が弱い信者を指すが、本文では原文の簡潔さと意味の余地を保ち、注で文脈を説明する。
theological_decisions:
- issue: ἐξουσίαの文脈上の意味
  choice: 偶像に供えられた食物をめぐってコリントの信者たちが自分にあると考えた「権利」
  alternative: より一般的な「権威」または「自由」
  rationale: 第一コリント8章の直接の文脈は偶像に関係する食物を食べる自由を扱う。「権利」は制度的権威を持ち込まず、具体的な倫理上の主張を表す一方、語の幅は脚注で示す。
- issue: τοῖς ἀσθενέσινの指示対象
  choice: この問題について良心が弱い人たち
  alternative: 一般的な意味で弱い人たち
  rationale: 同章では「弱い」が傷つきやすい良心と結び付けられている。ただし本文には「弱い人たち」と置き、解釈を過度に織り込まず、脚注で文脈を明示する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「つまずき」を名詞のまま硬く置かず、「つまずかせるもの」として比喩と因果関係を自然に伝えた。すべての脚注記号を対応箇所に配置した。
