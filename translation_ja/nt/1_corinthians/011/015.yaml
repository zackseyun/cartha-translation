id: 1CO.11.15
reference: 1 Corinthians 11:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: ja
  text: 一方、女[a]が長い髪をしているなら、それは彼女の栄光ではありませんか。なぜなら、その髪は覆いの代わりに与えられているからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は、文脈によっては「妻」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「覆いとして」。原語の前置詞は置換または対応を表し得るため、この句だけでは、髪が覆いそのものとして機能するのか、覆いに対応して与えられたのかは確定しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: 女
  rationale: 文脈によって「女」または「妻」を意味し得るが、この節は一般的な対比として述べられているため、「女」とした。
- source_word: κομᾷ
  choice: 髪を長くしている
  rationale: 単に髪があることではなく、髪を長くしている状態を表す。現代日本語として自然で、継続的な状態も伝える。
- source_word: δόξα
  choice: 栄光
  rationale: 誉れや名誉をもたらすものという意味を含む。文脈上「誉れ」も可能だが、原語の語彙的・修辞的な強さを保つため「栄光」とした。
- source_word: κόμη
  choice: 長い髪
  rationale: 頭髪、とりわけ伸ばした髪という含みがある。日本語では「髪」だけだとその含みが弱くなるため、ここでは「長い髪」と明示した。
- source_word: ἀντί
  choice: 代わりに
  rationale: 置換や対応を表す前置詞であり、「代わりに」はその通常の力をよく表す。ただし、この句だけでは髪が覆いそのものとして機能するのか、覆いに対応して与えられたのかは確定しないため、注を付した。
- source_word: περιβολαίου
  choice: 覆い
  rationale: 身に掛けるもの、覆うものを広く指す。「ベール」と限定するには原語より具体的すぎるため、一般的な「覆い」とした。
- source_word: δέδοται
  choice: 与えられている
  rationale: 完了受動形が示す、与えられた結果として現在そうなっている状態を、自然な日本語で表した。
theological_decisions:
- issue: περιβόλαιονを特定の「ベール」と訳し、髪自体と礼拝時のかぶり物との関係を訳文で確定するか。
  choice: 一般的な「覆い」と訳し、髪が「覆いの代わりに」与えられたとする。
  alternative: 「ベール」「身を包むもの」、または「覆いとして」
  rationale: περιβόλαιονは「ベール」より広い語であり、ἀντίも置換または対応を表し得る。したがって、布のかぶり物、一般的な覆い、自然な髪との類比をめぐる議論を訳文だけで決着させない。
- issue: γυνήを「女」とするか「妻」とするか。
  choice: 女
  alternative: 妻
  rationale: この節の表現は一般的な男女の対比として読むのが自然だが、原語自体は文脈により「妻」も意味し得るため、注で代案を示した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。「一方」で前節の男性との対比を示し、「その女」を補って指示関係を明確にした。SBLGNTの句読点は問いを示すが、構文上は11章14節の「自然そのものが教えていないでしょうか」に従属する内容と理解できるため、この節内では自然な叙述形にした。
