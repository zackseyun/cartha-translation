  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: ja
  text: しかし、各自、自分を吟味し、その上で、パンを食べ、杯から飲みなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: 吟味し
  rationale: 試して真価や適否を確かめるという語義を保ちつつ、この文脈での自己検証を自然で厳粛な日本語で表す。
- source_word: ἄνθρωπος
  choice: 一人ひとりが
  rationale: 一般的な人を指す無標の用法であり、特に男性に限定せず、各人への命令であることを明確にする。
- source_word: ἑαυτόν
  choice: 自分を
  rationale: 再帰代名詞の意味を直接表す。
- source_word: οὕτως
  choice: その上で
  rationale: 自己吟味を経て食べ、飲むという手順・仕方を自然に示す。
- source_word: ἐκ τοῦ ἄρτου ἐσθιέτω
  choice: パンを食べ
  rationale: ギリシア語のἐκは部分・取り分けを示し得るが、日本語では「パンから食べる」が不自然なため、意味を損なわない自然な目的語表現とする。
- source_word: ἐκ τοῦ ποτηρίου πινέτω
  choice: 杯から飲みなさい
  rationale: 容器を起点とするἐκの像を、日本語でも自然な「杯から」で保持する。
theological_decisions:
- issue: 自己吟味と聖餐への参加の関係
  choice: 「その上で、パンを食べ、杯から飲みなさい」
  alternative: 「それから食べるのを控えるかどうか判断しなさい」
  rationale: 本文は自己吟味の後に食べ、飲むよう命じており、自己排除を明示してはいないため、その流れを保持する。
- issue: ἄνθρωποςの性別表現
  choice: 「一人ひとり」
  alternative: 「男」または「人」
  rationale: ここでは人間一般を表す語であり、男性限定という神学的含意を加えず、共同体の各人への適用を明瞭にする。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保った。「吟味」はやや改まった語だが、礼拝・倫理的自己検証の文脈に適し、一般読者にも理解可能である。
