  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: ja
  text: しかし、もし私たちが自分自身を裁いていたなら[a]、裁かれることはなかったでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自分自身を吟味していたなら」「自分自身を見分けていたなら」。ギリシア語の動詞には、評価する、区別する、見分けるという意味がある。ここでは後半の「裁かれる」との対照を保つため、「裁いて」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、もし
  rationale: εἰの条件と、δέの穏やかな対照・移行を、自然な現代日本語で表した。
- source_word: ἑαυτοὺς
  choice: 自分自身を
  rationale: 一人称複数を受ける再帰代名詞の対格目的語を明確に表した。
- source_word: διεκρίνομεν
  choice: 裁いていたなら
  rationale: διακρίνωには見分ける、吟味する、評価するという幅があるが、後半のἐκρινόμεθαとの語の響きと対照を保つため「裁く」を採用した。未完了過去は、ἄνを伴う帰結節と対応する反事実的条件として表した。
- source_word: οὐκ ἂν ἐκρινόμεθα
  choice: 裁かれることはなかったでしょう
  rationale: 未完了過去とἄνによる反事実的な帰結を日本語で自然に示した。κρίνωは文脈上の主の裁きを指し得るが、最終的な有罪宣告と限定せず、単に「裁かれる」とした。
theological_decisions:
- issue: 後半の「裁かれる」が最終的な断罪を指すか、主による現世的・懲らしめとしての裁きを指すか
  choice: 意味を限定せず「裁かれる」と訳す
  alternative: 「罪に定められる」または「懲らしめを受ける」
  rationale: 直後の11章32節は、主による裁きと世と共に罪に定められることを区別しているため、本節だけで最終的断罪に強めたり、逆に懲らしめだけに限定したりしない。
- issue: 自分を「裁く」の意味
  choice: 後半との語的対照を優先して「自分自身を裁く」とする
  alternative: 「自分自身を吟味する」または「自分自身を正しく見分ける」
  rationale: 聖餐の文脈における自己評価を含み得るが、単なる内省や自己断罪へ意味を固定せず、脚注で語義の幅を示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。反事実的条件を「もし～ていたなら、～なかったでしょう」で自然に表し、原文の前半と後半にある裁きの語的対照を可能な限り保持した。
