base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: ja
  text: しかし、私たちが主に裁かれるとき、私たちは世とともに罪に定められないために、訓練を受けています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、主に裁かれながら、私たちは訓練を受けています」。ギリシア語は現在形を用いており、継続する働きを強調することがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: 裁かれるとき
  rationale: 現在受動分詞を文脈上の時を表す用法として訳した。「裁く」とすることで、後の「罪に定める」との語義上の違いを保ち、裁きの性質は続く παιδευόμεθα によって明らかにする。
- source_word: δὲ
  choice: しかし
  rationale: 前節の警告との穏やかな対比を明確に示す。
- source_word: ὑπὸ κυρίου
  choice: 主に
  rationale: ὑπό＋属格が行為者を示すことを自然な日本語の受身で表した。κύριοςを本文以上に「主イエス」と補わず、「主」とした。
- source_word: παιδευόμεθα
  choice: 訓練を受けている
  rationale: 教育、訓練、懲らしめを含み得る語であり、この文脈では矯正を目的とする働きを表す。「懲らしめられる」だけに限定せず、継続的な現在形も反映した。
- source_word: ἵνα μὴ
  choice: …ないため
  rationale: 目的を示す節として自然な現代日本語にした。結果の含みを排除しない。
- source_word: σὺν τῷ κόσμῳ
  choice: 世とともに
  rationale: σύνの共同・同じ帰結にあずかる意味を保った。κόσμοςは神に背く人間世界を集合的に指すが、解釈を本文へ足さず「世」とした。
- source_word: κατακριθῶμεν
  choice: 罪に定められない
  rationale: 不利な判決・断罪を表す κατακρίνω を訳し、先の κρίνω「裁く」と区別した。終末的な含意を訳文で明示しすぎない。
theological_decisions:
- issue: 現在の主の裁きと世とともに受ける断罪との関係
  choice: 主による現在の裁きは矯正的な訓練であり、世とともに罪に定められないことを目的とする、という対比を保つ。
  alternative: 一般的な現世の罰と将来の処罰との対比と読み、信者と不信者の区別を特に含意しない。
  rationale: κρινόμενοι と κατακριθῶμεν の対照、παιδευόμεθα、ἵνα μὴ の目的節が、矯正的な扱いと断罪を区別している。ただし、救いの堅忍や聖餐の効力について特定の教理体系を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「訓練を受ける」は παιδεύω の教育的・矯正的な幅を保ち、「罪に定める」は κατακρίνω の断罪的意味を「裁く」と区別する。
