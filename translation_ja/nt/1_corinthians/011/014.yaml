  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: ja
  text: 「男性が髪を長くしているなら[a]、それはその人にとって不名誉である」と、自然そのものさえ[b]あなたがたに教えているではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「男性が髪を長く伸ばすなら」または「男性が長い髪をしているなら」。ギリシア語の動詞は、髪を長く伸ばすこと、または長い髪をしていることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「自然そのもの」は、被造物の秩序、人間に共通する感覚、または文化の中で自然にふさわしいとみなされることを指す可能性がある。ここでギリシア語は、その意味をさらに限定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: 〜も…ではありませんか
  rationale: 先行する議論を受けつつ、否定疑問による修辞的な強調を自然な現代日本語で表す。
- source_word: ἡ φύσις αὐτὴ
  choice: 自然そのもの
  rationale: αὐτήの強調を保ち、φύσιςが被造秩序、一般的感覚、文化的に自然とみなされる適合性のいずれを指すかを限定しない。
- source_word: διδάσκει ὑμᾶς
  choice: あなたがたに教えている
  rationale: 現在形の継続的・一般的な響きと、教示するという動詞の意味を率直に伝える。
- source_word: ἀνὴρ
  choice: 男
  rationale: この節では夫という身分よりも男女の対比が前面にあるため。
- source_word: ἐὰν κομᾷ
  choice: 髪を長くしているなら
  rationale: κομάωは髪を長く伸ばす、または長い髪をしていることを表す。状態と習慣の両方に対応できる自然な表現とした。
- source_word: ἀτιμία
  choice: 不名誉
  rationale: 名誉と恥の対比を保ちつつ、現代日本語で過度に感情的にならない語を選ぶ。
- source_word: αὐτῷ ἐστιν
  choice: それはその人にとって…である
  rationale: 与格の関係を明示し、自然な日本語の述語構文にする。
theological_decisions:
- issue: パウロの議論における「自然」（φύσις）の意味
  choice: 「自然そのもの」と広く訳し、指示内容を限定しない
  alternative: 被造物の秩序、共通の人間的感覚、文化的に自然と受け止められる適切さ
  rationale: この語は文脈上複数の解釈が可能であり、ギリシア語自体はここで意味を狭く特定していないため、本文では曖昧さを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。修辞疑問は「教えているではありませんか」で表し、読者への問いかけを維持した。「不名誉」は名誉・恥の文脈を保ち、「恥」より評価語としての性格を明確にする。
