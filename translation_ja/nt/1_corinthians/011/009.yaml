reference: 1 Corinthians 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: ja
  text: 実際、男が女のために造られたのではなく、女が男のために造られたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女のゆえに／男のゆえに」とも訳せる。ギリシア語の前置詞は、理由・原因または目的を表し得る。ここでは創造についての議論に即して「〜のために」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実際
  rationale: γάρの説明・根拠提示の働きと、καίによる軽い強調を、前節から自然につながる現代日本語で表した。
- source_word: ἐκτίσθη
  choice: 造られた
  rationale: κτίζωの受動形を直接的に訳し、創造物語への言及を明確に保つ。
- source_word: ἀνὴρ / γυνὴ
  choice: 男／女
  rationale: 創造の文脈では、特定の夫婦というより男性と女性を指すため。「夫／妻」と限定しない。
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: 女のために／男のために
  rationale: διά＋対格が表し得る目的・理由の幅を保ちつつ、この創造論的な対比では目的を自然に示す「ために」を採用した。
- source_word: ἀλλὰ
  choice: ではなく
  rationale: 「AではなくB」という対照構文に組み込み、原文の否定と対比を明瞭に表した。
theological_decisions:
- issue: ἀνήρ／γυνήを「男／女」とするか「夫／妻」とするか
  choice: 男／女
  alternative: 夫／妻
  rationale: ἐκτίσθη（造られた）という創造物語への訴えがあるため、婚姻関係だけに狭めず、原文のより広い男女の指示を保つ。
- issue: διά＋対格を目的と理由のどちらに寄せるか
  choice: 本文では「〜のために」とし、注で理由の可能性を示す
  alternative: 「〜のゆえに／〜が理由で」
  rationale: 文脈上は創造の目的・方向性が前面にあるが、ギリシア語の前置詞自体は理由・原因も表し得るため、その曖昧さを注に残す。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「実際」で論証の継続を示し、「造られたのではなく……造られたのです」という均衡の取れた対照表現とした。
