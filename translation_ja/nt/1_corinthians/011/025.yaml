reference: 1 Corinthians 11:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: ja
  text: 同じように、食事の後にも、杯を取り、こう言われました。「この杯は、わたしの血による新しい契約です。[a]あなたがたが飲むたびに、わたしを覚えるために、これを行いなさい。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この杯は、わたしの血における新しい契約です」とも訳せます。原文の前置詞は、契約とイエスの血との密接な関係を表します。
    reason: lexical_alternative
  - marker: b
    text: 「わたしの記念として、これを行いなさい」とも訳せます。「覚える」には、単に思い出すだけでなく、記念するという意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: 同じように
  rationale: 直前のパンについての行為との対応を自然な現代日本語で示す。καίの付加的意味も文脈上含まれる。
- source_word: τὸ ποτήριον
  choice: 杯
  rationale: 器を指す簡潔で品位ある訳。「聖杯」のような原文にない典礼的含意は加えない。
- source_word: μετὰ τὸ δειπνῆσαι
  choice: 食事の後
  rationale: μετά＋冠詞付き不定詞の時間的意味を明確に表し、「夕食後」と限定しすぎない。
- source_word: λέγων
  choice: 杯を取り、こう言われました
  rationale: λέγων自体は「言って」だが、前節と並行する省略された動作を補い、日本語の文として自然にした。敬語はイエスの発話を語る本文の品位に合わせた。
- source_word: ἡ καινὴ διαθήκη
  choice: 新しい契約
  rationale: エレミヤ書などの聖書的背景に即し、διαθήκηを現代日本語で最も明確に表す。
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: わたしの血による
  rationale: 日本語では「わたしの血にある」より自然で、血を介して成立する契約という関係を示す。ただし成立の仕方を過度に説明しない。
- source_word: τοῦτο ποιεῖτε
  choice: これを…行いなさい
  rationale: 命令を明確にし、反復性は続く「飲むたびに」に担わせる。
- source_word: ὁσάκις ἐὰν πίνητε
  choice: 飲むたびに
  rationale: 繰り返される機会を示す構文を簡潔に表す。目的語の杯は直前の文脈から明らかなため、日本語では補わない。
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: わたしを覚えて
  rationale: ἀνάμνησιςの能動的な記念・想起を、一般読者に分かりやすい自然な表現で示す。
theological_decisions:
- issue: 聖餐制定句におけるδιαθήκηの意味
  choice: 契約
  alternative: 遺言
  rationale: 契約の血という旧約聖書的背景に最もよく合う。「遺言」は語義として可能でも、この文脈では誤解を招きやすい。
- issue: 杯と契約との関係
  choice: 「この杯は…新しい契約です」という直接的な同定を保持
  alternative: 「この杯は新しい契約を表します」または「この杯によって新しい契約が批准されます」
  rationale: 原文は直接「である」と述べており、象徴説・実在説など後代の教派的説明を付け加えず、その神学的緊張を保つ。
- issue: ἐν τῷ ἐμῷ αἵματιの関係
  choice: わたしの血による
  alternative: わたしの血にある
  rationale: ἐνの幅を踏まえた自然な日本語。契約と血の関係は示すが、「批准された」などの説明語は本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「杯」「契約」など定着した語を採用し、原文にない教派的・典礼的説明は避けた。
