  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: ja
  text: というのも、あなたがたがこのパンを食べ、杯[b]を飲むたびに[a]、主が来られるまで、主の死を告げ知らせるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「このパンを食べ、杯を飲む時はいつでも」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 原文の「杯」には定冠詞が付くが、「この」に当たる指示詞はない。直前の文脈から、どの杯かは明らかである。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: …たびに
  rationale: 不特定に繰り返される機会を表す組み合わせであり、「…たびに」が反復の意味を自然かつ簡潔に伝える。
- source_word: γὰρ
  choice: というのも
  rationale: 前の指示を理由づけて説明する接続詞として、推論を表す「ですから」ではなく、説明を導く「というのも」とした。
- source_word: ἐσθίητε / πίνητε
  choice: 食べ／飲む
  rationale: ἐὰνを伴う不定時の節にある現在接続法であり、日本語では反復的な行為を普通形で自然に表した。
- source_word: ἄρτον τοῦτον
  choice: このパン
  rationale: τοῦτονの指示性を「この」で保ち、ἄρτοςは文脈に即して標準的な「パン」とした。
- source_word: τὸ ποτήριον
  choice: 杯
  rationale: 原文には定冠詞があるが指示詞はない。日本語では文脈上特定される器を「杯」と無標で表すのが自然で、「この」を補わないことで原文との差異も保った。
- source_word: καταγγέλλετε
  choice: 告げ知らせる
  rationale: 公に宣べ伝え、告知する意味を、現代日本語で明瞭かつ荘重に表す。「宣言する」よりも、この行為による継続的な告知に自然に合う。
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: 主の死
  rationale: 属格関係を簡潔に保ち、句の荘重な焦点を維持した。
- source_word: ἄχρι οὗ ἔλθῃ
  choice: 主が来られる時まで
  rationale: 文脈上の省略された主語を直前の「主」として明示し、再来までという時間的限界を自然な日本語で表した。尊敬表現は主を指すことを明瞭にする。
theological_decisions:
- issue: ἄχρι οὗ ἔλθῃ の省略された主語
  choice: 「主が来られる時まで」と明示する
  alternative: 「その方が来る時まで」または単に「来る時まで」
  rationale: 直前の「主」が最も自然な先行詞であり、パウロの文脈にも合う。これは教派的解釈の付加ではなく、ギリシア語の文脈上の主語を日本語で明瞭にしたものである。
- issue: 聖餐についての表現
  choice: パンを食べ、杯を飲む行為が主の死を告げ知らせる、と本文どおり述べる
  alternative: 秘跡的な説明を加える、または単なる記念行為と限定して言い換える
  rationale: この節は行為が主の死を告げ知らせると述べるが、聖餐論全体を定義してはいない。したがって、いずれかの教派的理解へ狭めず、本文の神学的含みをそのまま保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、礼拝での朗読にも耐える落ち着いた文体とした。「というのも」で前節との説明関係を示し、「告げ知らせるのです」で断定の力を保った。
