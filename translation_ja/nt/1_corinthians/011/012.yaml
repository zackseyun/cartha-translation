id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: ja
  text: というのも、女が男から出たように、男もまた女を通して生まれるからです。しかし、すべてのものは神から出ています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女」と「男」は、文脈をより狭く夫婦関係について述べたものと取る場合、「妻」と「夫」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ ... οὕτως καί
  choice: というのも、…ように、…もまた…からです
  rationale: γάρの説明的なつながりと、ὥσπερ／οὕτως καίの対応する比較構文を、自然な現代日本語で明示する。
- source_word: ἡ γυνὴ / ὁ ἀνήρ
  choice: 女／男
  rationale: いずれも配偶者を指し得るが、創造と出生を対比するこの文では、一般的な男女を表す語として訳すのが文脈に適う。
- source_word: ἐκ τοῦ ἀνδρός
  choice: 男から出た
  rationale: ἐκが表す起源を保ち、女が男から取られたという創造の記事への暗示を伝える。
- source_word: διὰ τῆς γυναικός
  choice: 女を通して生まれる
  rationale: 属格を伴うδιάの媒介・経路の意味を保つ。「生まれる」は意訳上の補足だが、人が女を通して世に出るという対比を日本語で明瞭にする。
- source_word: τὰ δὲ πάντα
  choice: しかし、すべてのものは
  rationale: δέの穏やかな対照を「しかし」で示し、人間相互の起源から究極の源である神へ論点が移ることを保つ。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から出ています
  rationale: ἐκの起源・源の意味を訳し、前半のἐκとの語の対応もできるだけ保持する。
theological_decisions:
- issue: γυνή／ἀνήρの意味範囲
  choice: 一般的な「女／男」
  alternative: 「妻／夫」
  rationale: 語そのものには両方の意味があるが、創造における女の起源と、出生における男の経路を並べるため、結婚関係だけに限定しない訳を本文に採用する。別の理解は脚注に示す。
- issue: ἐκとδιάの関係
  choice: 「から」と「を通して」を区別する
  alternative: 両方を「から」とする
  rationale: 女が男「から」出たことと、男が女「を通して」生まれることの違いを保ち、パウロが示す相互性と緊張を平板化しない。
- issue: τὰ πάνταの範囲
  choice: 「すべてのもの」
  alternative: 「すべての人」
  rationale: 中性複数の表現を限定せずに訳し、万物の究極的な源が神であるという原文の広がりを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「出た／生まれる」により創造と出生の対比を自然に示しつつ、「から／を通して」の区別を保持した。脚注記号は節末に置き、本文全体に関わる語義上の別訳であることを示した。
