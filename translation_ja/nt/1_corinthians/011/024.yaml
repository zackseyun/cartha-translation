id: 1CO.11.24
reference: 1 Corinthians 11:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: ja
  text: そして、感謝をささげてから、パンを裂き、こう言われました。「これは、あなたがたのためのわたしの体です。[a] わたしを覚えて、このことを行い続けなさい。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「あなたがたのため」の後に「裂かれる」を加え、「これは、あなたがたのために裂かれるわたしの体です」とします。
    reason: textual_variant
  - marker: b
    text: 別訳「わたしの記念として、このことを行い続けなさい。」
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: 感謝をささげてから
  rationale: 主動詞に先立つアオリスト分詞の時間的・順序的な関係を、自然な現代日本語で表した。
- source_word: ἔκλασεν
  choice: パンを裂き
  rationale: 動詞は「裂く、割る」の意。ギリシア語では目的語が省略されているが、直前の文脈にあるパンを補い、日本語として明確にした。
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: これは、…わたしの体です
  rationale: 連結動詞による表現を直接訳し、「象徴する」などの解釈語を加えず、聖餐をめぐる神学的緊張を保持した。
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: あなたがたのための
  rationale: ὑπέρ＋属格の受益的・代理的な含意を簡潔に表し、特定の贖罪論に限定しない。
- source_word: τοῦτο ποιεῖτε
  choice: このことを行い続けなさい
  rationale: 現在命令形がこの制定の文脈で示す反復・継続的実践を明示した。
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: わたしを覚えて
  rationale: ἀνάμνησιςの能動的な想起・記念の意味を、日常的で明瞭な日本語にした。目的を示すεἰςは命令全体との関係で自然に表現した。
theological_decisions:
- issue: 聖餐の文脈における「これはわたしの体です」の意味
  choice: 「これは…わたしの体です」と直接訳した。
  alternative: 「これはわたしの体を表します」など、象徴説または特定の現臨理解を明示する訳。
  rationale: ギリシア語は「である」という直接的な表現であり、そのあり方までは説明していないため、後代の教理論争を訳文で解決しない。
- issue: ὑπὲρ ὑμῶν の力
  choice: 「あなたがたのための」
  alternative: 「あなたがたに代わる」「あなたがたの利益のための」
  rationale: 受益・代理の含みを保持しつつ、原文以上に技術的な贖罪理解を持ち込まない。
- issue: ποιεῖτε の現在命令形
  choice: 「行い続けなさい」
  alternative: 「行いなさい」
  rationale: 反復的な聖餐実践という文脈で現在命令形の継続的な力を見える形にしたが、行為の頻度までは規定しない。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。引用内はイエスの発話として丁寧体を用いた。「パン」は文脈から補った語。「体」は現代的な表記とし、「身体」より聖書的表現として自然な語感を保った。
