source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: ja
  text: このため、あなたがたの間には、弱っている人や病気の人が多く、眠りについている人もかなりいます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「眠りについている」とは、死んだことを指す婉曲的な表現です。
    reason: 死を表す比喩であることを明確にしながら、本文では原文の「眠る」という表現を保持するため。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前に述べられた主の晩餐の扱いを原因として指し示す表現であり、明示的な因果関係を自然な日本語で保つ。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間には
  rationale: 個人の内面ではなく、コリントの共同体内に見られる状態を表す。
- source_word: πολλοὶ
  choice: 多く
  rationale: 人数の多さを簡潔かつ自然に示す。
- source_word: ἀσθενεῖς
  choice: 弱っている人
  rationale: 身体的な衰弱を表しつつ、後続のἄρρωστοιとの語義上の区別を保つ。
- source_word: ἄρρωστοι
  choice: 病んでいる人
  rationale: 病気の状態を明確に表し、ἀσθενεῖςより強い身体的不調という文脈上の段階を保つ。
- source_word: κοιμῶνται
  choice: 眠りについている人
  rationale: 死を指す婉曲的な比喩と理解されるが、本文ではパウロの「眠る」という表現を保持する。現在形が示す結果的な状態も自然な日本語で表した。
- source_word: ἱκανοί
  choice: 少なくありません
  rationale: 相当数に上ることを、現代日本語として自然に示しつつ、先の「多く」との機械的な反復を避ける。
theological_decisions:
- issue: κοιμῶνταιを文字どおりの睡眠として訳すか、死を指す比喩として訳すか
  choice: 死を指す「眠り」の比喩を本文に保持する
  alternative: 「死んだ人」と意味を明示する、または文字どおり「眠っている人」とする
  rationale: 弱り、病み、眠るという進行と、共同体に対する神の裁きという文脈から、死を指す婉曲表現と考えられる。ただし本文では比喩を解消せず、原文の神学的な語調と含みを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会衆への語りとしての品位を保った。「弱っている」と「病んでいる」を並べて原文の語彙的区別を示し、「眠り」の比喩は脚注で補足した。
