  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: ja
  text: ですから、あなたがたが同じ場所に集まるとき、主の晩餐を食べることにはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたは主の晩餐を食べているのではありません」。彼らの振る舞いによって、その食事はもはや主の晩餐とは言えないことを強調する訳。
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: 集まっても
  rationale: 属格分詞とὑμῶνによる時を表す構文を、主節との対照的な関係も自然に伝わる形で訳した。共同体として集まる意味を保っている。
- source_word: οὖν
  choice: ですから
  rationale: 直前に述べられた分裂への非難を受けた推論であることを、明確かつ自然な現代日本語で示す。
- source_word: ἐπὶ τὸ αὐτό
  choice: 一つの場所に
  rationale: 単に「一緒に」とせず、同じ場所に会するという空間的な含みを保った。
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: 食べることにはなりません
  rationale: 圧縮されたギリシア語構文を自然な日本語にしつつ、彼らの行為が主の晩餐を食べることに当たらないという評価的な意味を表した。
- source_word: κυριακὸν
  choice: 主の
  rationale: 「主に属する」という形容詞の意味を、日本語で定着した自然な所有表現にした。
- source_word: δεῖπνον
  choice: 晩餐
  rationale: 共同体の食事を指し、この文脈で定着している「主の晩餐」という表現を保つ。
- source_word: κυριακὸν δεῖπνον
  choice: 主の晩餐
  rationale: ギリシア語の形容詞と名詞の組み合わせを正確に表し、教会的文脈でも広く理解される表現を採用した。
theological_decisions:
- issue: パウロは食べること自体の不可能性を述べるのか、それとも彼らの実践が主の晩餐に当たらないと述べるのか
  choice: 彼らの集まり方と振る舞いのため、それは主の晩餐を食べることにはならない。
  alternative: 「あなたがたは主の晩餐を食べているのではありません」または「主の晩餐を食べることはできません」
  rationale: 直後の21–22節は共同の食事のあり方を非難している。「食べることにはなりません」は形而上学的な不可能性に限定せず、彼らの食事が主の晩餐とは認められないという評価を示しながら、原文の緊張を保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「主の晩餐」は定着した表現として維持し、「一つの場所に」で空間的ニュアンスを示した。
