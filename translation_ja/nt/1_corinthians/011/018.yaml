  source_fidelity: 「まず」はπρῶτον μένの第一論点を自然に示し、属格独立構文を「あなたがたが…集まるとき」と時間的に適切に訳している。「教会として」はἐν ἐκκλησίᾳを建物ではなく集まった共同体として理解する訳であり、文脈と整合する。「分裂がある」「ある程度はそうだと信じています」は、σχίσματα ὑπάρχεινおよびκαὶ μέρος τι πιστεύωの報告内容と限定的な確信を正確に保っている。
  naturalness: 明瞭で現代標準語として自然であり、共同体への使徒的な言葉としても品位を保っている。「そして」はやや直訳的ではあるが不自然ではなく、原文のκαίを過度に解釈しない。
  terminology: 「教会として」はこの文脈でのἐκκλησίαの共同体的意味をよく表し、「分裂」は未証明の組織的派閥を含意しすぎない適切な訳語である。神学的な読み込みはない。
