id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: ja
  text: まず、あなたがたが教会として集まるとき、あなたがたの間に分裂があると聞いています。そして、ある程度はそうだと信じています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον μὲν γὰρ
  choice: まず
  rationale: γάρは直前の勧告の理由・説明を導くが、日本語で「というのは、まず」とすると硬く不自然になりやすい。ここでは「まず」で第一の論点への移行を自然に示す。μένに対応する明示的なδέが続かない点も過度に形式化しない。
- source_word: συνερχομένων ὑμῶν
  choice: あなたがたが集まるとき
  rationale: 属格独立構文を時間的に訳し、この章で反復される共同の集会という文脈を明確にする。
- source_word: ἐν ἐκκλησίᾳ
  choice: 教会として
  rationale: 建物の中という意味ではなく、信徒の共同体として集うことを表す。「集会で」も可能だが、ἐκκλησίαの共同体的・教会的含意を保つため「教会として」とした。
- source_word: ἀκούω
  choice: 聞いています
  rationale: 現在形による、報告を通して耳にしている状態を自然な現代日本語で表す。
- source_word: σχίσματα
  choice: 分裂
  rationale: 共同体内の裂け目や不一致を指す。「派閥」ほど組織化された集団の存在を決めつけず、語の幅を保つ。
- source_word: ὑπάρχειν
  choice: ある
  rationale: 間接話法の不定詞が表す存在を簡潔な日本語で示す。
- source_word: καὶ μέρος τι πιστεύω
  choice: そして、ある程度はそうだと信じています
  rationale: μέρος τιによる限定・留保を「ある程度は」で保ち、「そうだ」を補って、報告内容を部分的に信じるという意味を自然に明示する。
theological_decisions:
- issue: ἐν ἐκκλησίᾳが指すもの
  choice: 集まった信徒共同体としての「教会として」
  alternative: 「集会で」「教会で」
  rationale: 主の晩餐のために共同体が集う文脈であり、教会堂という建物を指す読みを避けつつ、単なる一般的集会ではない教会共同体の意味を保つ。
- issue: καὶ μέρος τι πιστεύωにおける留保の範囲
  choice: 報告内容を「ある程度」信じている
  alternative: 報告の一部分だけを信じている
  rationale: ギリシア語は量または程度の限定として理解できるため、どの具体的部分を信じるかを決めず、自然な日本語で留保を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「教会として」は建物中心の誤解を避け、集まった共同体を表す。本文に脚注は設けていないため、脚注標識もない。
