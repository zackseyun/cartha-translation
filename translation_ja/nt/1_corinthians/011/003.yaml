language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: ja
  text: しかし、私はあなたがたに知ってほしいのです。すべての男の頭[a]はメシアであり、女の頭は男[b]であり、メシアの頭は神です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「頭」は、「源」または「権威を持つ者」という意味にも理解できます。本文ではギリシア語の比喩をそのまま残しています。
    reason: lexical_alternative
  - marker: b
    text: ここでの「女」と「男」は、「妻」と「夫」と読むこともできます。
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: しかし、あなたがたに知っておいてほしいのです
  rationale: δὲによる緩やかな対照・話題転換を「しかし」で示し、θέλωとεἰδέναιの構文を、パウロ自身の意向が明確に伝わる自然な現代日本語にした。
- source_word: παντὸς ἀνδρὸς
  choice: 男一人ひとりの
  rationale: ἀνήρの一般的な「男」という意味を保ちつつ、παντόςの個々を包括する力を自然な日本語で表した。配偶者を指す可能性は別の箇所と併せて脚注に残した。
- source_word: κεφαλή
  choice: 頭
  rationale: 原語の比喩をそのまま保持し、「源」または「権威を持つ者」のいずれかに訳文で限定しない。三つの並行する節で同じ語を一貫して用いた。
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: メシア
  rationale: Χριστόςを称号として訳し、二度の出現を統一した。
- source_word: γυναικός / ὁ ἀνήρ
  choice: 女／男
  rationale: 語が持つ一般的な男女の意味を本文に採用し、並行構造を保った。「妻／夫」の可能性は文脈上排除できないため脚注に示した。
- source_word: ὁ θεός
  choice: 神
  rationale: θεόςの標準的で簡潔な訳語であり、最終節の述語関係を原文どおり保つ。
theological_decisions:
- issue: 三つの節におけるκεφαλήの意味
  choice: 比喩を「頭」として保持する
  alternative: 「源」または「権威を持つ者」と明示する
  rationale: この語の比喩的意味には解釈上の争いがあるため、本文で一つに決めず、原文の曖昧さと神学的緊張を保った。
- issue: ἀνήρとγυνήが一般の男女か夫婦か
  choice: 本文では「男／女」とする
  alternative: 「夫／妻」とする
  rationale: 節の一般的・並行的な構文には「男／女」が適するが、語義と周辺文脈から夫婦を指す読みも成り立つため、脚注で明示した。
- issue: 「メシアの頭は神」の関係
  choice: 説明を加えず原文どおり訳す
  alternative: 機能上の秩序などを明示する解釈的意訳
  rationale: 原文が述べていない関係の性質を補わず、文言そのものを保持することで、キリスト論上の結論を訳文に持ち込まないようにした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「男一人ひとり」によりπαντόςの包括性を自然に表し、三つの節の反復構造と「頭」という中心的比喩を保った。
