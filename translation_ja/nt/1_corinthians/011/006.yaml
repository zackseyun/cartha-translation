reference: 1 Corinthians 11:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: ja
  text: もし女性[a]が頭を覆わないなら、髪も短く切りなさい。しかし、女性にとって髪を短く切ること、または髪をそり落とすことが恥ずべきことなら、頭を覆いなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女性」は「妻」とも訳せる。ギリシア語ギュネーは、文脈によって「女性」または「妻」を意味する。
    reason: alternative_reading
  - marker: b
    text: 「頭を覆いなさい」は「ベールを掛けなさい」とも訳せる。ギリシア語は覆うことを述べており、文脈上、頭を覆うことが含意されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: 頭を覆わない／頭を覆いなさい
  rationale: 動詞は「覆う、ベールを掛ける」を意味する。文脈上、覆う対象は頭なので、現代日本語で明確かつ自然になるよう「頭」を補った。特定の覆いの形状には限定しない。
- source_word: γυνή
  choice: 女
  rationale: 「女」と「妻」の両義があるが、この節自体には夫への明示的言及がないため、より限定の少ない「女」とした。「妻」の可能性は脚注に残した。
- source_word: κειράσθω / τὸ κείρασθαι
  choice: 髪も切ってしまえばよい／髪を切ること
  rationale: 髪を刈る、短く切る意味。単なる整髪より強い表現であることを「切ってしまう」で示しつつ、古風な「髪を刈る」は避けた。後半では ξυρᾶσθαι との区別を保った。
- source_word: ξυρᾶσθαι
  choice: そり落とすこと
  rationale: 剃刀などでそることを表し、髪を切ることとの段階差を明確にした。
- source_word: καί
  choice: も
  rationale: 覆わないことに加えて髪を切るという、議論上の帰結と進行を示す。
- source_word: αἰσχρόν
  choice: 恥ずべきこと
  rationale: 社会的な恥、不名誉という含みを保ちながら、自然で格調ある現代日本語とした。
- source_word: γὰρ ... δὲ
  choice: もし……なら……しかし
  rationale: γάρの説明的な論理は前文とのつながりを前提とするが、日本語では条件文を自然に開始し、δέの対照を「しかし」で明示した。
theological_decisions:
- issue: γυνήを「女」とするか「妻」とするか
  choice: 女
  alternative: 妻
  rationale: この節には夫が明示されず、女性一般として読む余地があるため、本文では範囲を狭めない「女」を採用した。ただし、語自体と広い文脈から「妻」も可能なので脚注に示した。
- issue: κατακαλύπτωを特定のベール着用と解するか
  choice: 頭を覆う
  alternative: ベールを掛ける
  rationale: 原語は覆うことを述べ、文脈から頭が対象と理解される。特定の衣服や形態を本文に持ち込まず、行為そのものを訳した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令形は前半の修辞的帰結を「切ってしまえばよい」、後半の直接的勧告を「覆いなさい」と訳し分けた。脚注記号は対応箇所に配置した。
