id: 1CO.11.4
reference: 1 Corinthians 11:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: ja
  text: 祈ったり預言したりするとき、頭に何かをかぶっている男は皆、自分の頭を辱めます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「頭を覆っている」。ギリシア語は字義的には「頭の上に／頭から下に何かを持っている」といい、覆いが何であるかは特定していません。
    reason: lexical_alternative
  - marker: b
    text: 「自分の頭」は、文字どおり本人の頭を指すとともに、周辺の文脈で用いられる関係的な意味での「頭」を響かせている可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: 男は皆
  rationale: ἀνήρは「男」または文脈により「夫」を意味し得るが、ここでは5節の「女」と対になった一般的な男性への言及として、解釈を狭めない「男」を採用した。
- source_word: προσευχόμενος ἢ προφητεύων
  choice: 祈ったり預言したりするとき
  rationale: 二つの現在分詞が表す行為中の状況を、自然な現代日本語で示した。「預言する」は原語の透明性を保つ。
- source_word: κατὰ κεφαλῆς ἔχων
  choice: 頭に何かをかぶっている
  rationale: 直訳的には「頭から下に／頭の上に何かを持っている」という省略を含む表現で、具体的な覆いを明示しない。日本語として通じる範囲で「何か」を残し、品目を特定しなかった。
- source_word: καταισχύνει
  choice: 辱めます
  rationale: 名誉を損ない、恥をもたらす意味を、文脈に合う簡潔で格調ある日本語で表した。
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: 自分の頭
  rationale: 再帰的な所有関係を自然な日本語で示しつつ、「頭」が身体上の頭か、周辺文脈の関係的な「頭」も響かせるかという曖昧さを保持した。
theological_decisions:
- issue: 末尾のκεφαλήを身体上の頭と明示するか、関係的・比喩的な「頭」と明示するか
  choice: 「自分の頭」として曖昧さを保つ
  alternative: 「自分自身の頭」または「自分のかしらである方」
  rationale: この表現は身体上の頭を直接指し得る一方、3節の関係的な「頭」を反響させる可能性もある。本文では一方に限定せず、脚注でその重なりを示した。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも適する丁寧体。「かしら」として比喩性を先取りせず、本文では一貫して「頭」とした。
