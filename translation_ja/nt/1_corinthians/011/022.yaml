id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: ja
  text: 食べたり飲んだりするための家が、あなたがたにはないのですか。それとも、神の教会を軽んじ、持たない人たち[a]に恥ずかしい思いをさせるのですか。あなたがたに何と言えばよいのでしょう。あなたがたを褒めましょうか。このことについては、あなたがたを褒めません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「貧しい人たち」または「食べ物を持たない人たち」とも訳せる。ギリシア語では直訳すると「持っていない人たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: 家
  rationale: 個々の私的な生活空間を指し、集まった共同体である「神の教会」との対比を保つ。
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: 食べたり飲んだりするため
  rationale: 前置詞と冠詞付き不定詞が表す目的を、自然な現代日本語で示す。
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: 神の教会
  rationale: 神に属する、集められた信徒の共同体を表すパウロ書簡の標準的な表現であり、制度的意味に限定しない。
- source_word: καταφρονεῖτε
  choice: 軽んじ
  rationale: 価値のないもののように扱う意を明確にしつつ、文脈にふさわしい強い非難を保つ。
- source_word: καταισχύνετε
  choice: 恥ずかしい思いをさせる
  rationale: 他者に恥を感じさせる使役的な意味を、明瞭で自然な日本語にする。
- source_word: τοὺς μὴ ἔχοντας
  choice: 持たない人たち
  rationale: 原文の「持っていない人たち」という省略を保ち、何を持たないかを本文で食物・財産の一方に限定しない。
- source_word: τί εἴπω ὑμῖν;
  choice: あなたがたに何と言えばよいのでしょう
  rationale: 熟慮を表す接続法の修辞的な困惑を、現代日本語の自然な問いで表す。
- source_word: ἐπαινέσω ὑμᾶς;
  choice: 褒めるべきでしょうか
  rationale: 否定の答えを予期する修辞疑問を明確にする。
- source_word: ἐν τούτῳ
  choice: このことについては
  rationale: 直前まで論じられた問題を指すことを自然に示す。
- source_word: οὐκ ἐπαινῶ
  choice: あなたがたを褒めることはできません
  rationale: 直前の「褒める」と語をそろえて反復を保ち、日本語では強い否定の含意を自然に表す。
theological_decisions:
- issue: 主の晩餐の文脈における「持たない人たち」の指示対象
  choice: 本文では「持たない人たち」と広く訳す。
  alternative: 「貧しい人たち」または「食べ物を持たない人たち」
  rationale: 文脈上は物質的に乏しい信徒、とりわけ食物を十分に得られない者が念頭にある可能性が高いが、ギリシア語自体は目的語を明示せず「持っていない人たち」とだけ述べるため、その幅を本文に残す。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「あるではありませんか」「それとも」によって鋭い修辞疑問を保ち、終盤では「褒める」の反復を維持した。
