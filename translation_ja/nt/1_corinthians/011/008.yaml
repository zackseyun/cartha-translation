  text: For man is not from woman[a], but woman from man.
translation:
  language: ja
  text: なぜなら、男が女から出たのではなく、女が男から出たからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夫は妻から出たのではなく、妻が夫から出たからです」。ギリシア語の語は「男／女」とも「夫／妻」とも訳せる。ここでは創造についてのより広い意味を採った。
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: だからです
  rationale: 前節の主張の根拠を示す接続語。日本語では文末に置くことで、議論の理由説明であることを自然かつ明確に表す。
- source_word: ἀνὴρ / ἀνδρός
  choice: 男
  rationale: 語は「夫」の意味も持つが、ここでは創造における由来が論じられ、γυνήとの対比もあるため、より広い「男」を採る。
- source_word: γυναικός / γυνὴ
  choice: 女
  rationale: 語は「妻」の意味も持つが、創造の文脈における男女の対比を保つため「女」とする。
- source_word: ἐκ / ἐξ
  choice: から出た
  rationale: 起源・由来を示す前置詞。「から」だけよりも、日本語として由来の関係を明瞭に表し、創造物語への言及にも自然に響く。
- source_word: οὐ ... ἀλλὰ
  choice: …のではなく、…が
  rationale: 否定された第一項と肯定される対照項を、簡潔で自然な現代日本語の対比構文で表す。
- source_word: ἐστιν
  choice: 出た
  rationale: 原文では存在動詞がἐκ句と結びついて由来を表す。日本語では「出た」と補って意味関係を自然に明示する。
theological_decisions:
- issue: ἀνήρ/γυνήを「男／女」とするか「夫／妻」とするか
  choice: 男／女
  alternative: 夫／妻
  rationale: 創造物語に基づく起源の議論という広い射程を保ち、特定の夫婦関係だけに限定しないため。ただし、ギリシア語自体には夫／妻の語義もあるため脚注に残す。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。議論をつなぐγάρは文末の「だからです」で表し、聖書本文としての落ち着いた調子を保った。
