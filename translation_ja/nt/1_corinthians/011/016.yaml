id: 1CO.11.16
reference: 1 Corinthians 11:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: ja
  text: しかし、もし争いを好むように見える人がいるなら[a]、私たちにはそのような慣習はなく[b]、神の諸教会にもありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「論争好きであるように見える人がいるなら」「けんか好きであるように見える人がいるなら」。
    reason: lexical_alternative
  - marker: b
    text: 「そのような慣習」が、争いを好むことを指すのか、前の節々で論じられた実践を指すのかは、どちらとも解釈できます。
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: ようであれば
  rationale: 不定詞とともに「～であるように見える／思われる」というギリシア語の表現を自然な日本語にし、本人の自認か外から見た傾向かを断定しない。
- source_word: φιλόνεικος
  choice: 争いたがる
  rationale: 争いや論争を好む性向を表す。現代の読者に明瞭でありつつ、単に意見を述べることではなく好戦的に争う姿勢を示す。
- source_word: τοιαύτην
  choice: そのような
  rationale: 前述の事柄を指す語だが、具体的な指示対象を訳文で限定せず、原文の曖昧さを保つ。
- source_word: συνήθειαν
  choice: 慣習
  rationale: 習慣的・共同体的な実践やならわしを意味するため、「慣習」とした。「習慣」より共同体で受け入れられた実践という含みを伝えやすい。
- source_word: οὐκ ἔχομεν
  choice: 私たちには……なく
  rationale: 「私たちは持たない」を自然な日本語にし、「認めない」「従わない」といった原文以上の意味を加えない。
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: 神の諸教会
  rationale: 複数形と属格を明示し、神に属する各地の教会を指す表現として簡潔かつ格調ある日本語にした。
theological_decisions:
- issue: 「そのような慣習」が何を指すか
  choice: 「そのような慣習」とし、指示対象を本文では特定しない。
  alternative: 争いたがる慣習、または先行節で論じられた実践に関する慣習と明示する。
  rationale: τοιαύτην συνήθειαν は簡潔で、争論的な態度を指すのか、先行する議論の対象となった実践を指すのかが文脈上争われている。訳文で一方に決めず、原文の解釈上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「しかし」で論旨の転換を示した。「神の諸教会」はやや格調を保ちつつ、複数の共同体への訴えを明示する。脚注記号[a][b]は対応箇所に置いた。
