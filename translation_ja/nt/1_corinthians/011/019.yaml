id: 1CO.11.19
reference: 1 Corinthians 11:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: ja
  text: なぜなら、あなたがたの間には派閥[a]もなければならないからです。それは、試されて認められた者たち[b]もあなたがたの間で明らかになるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「分裂」「党派」とも訳せます。後代には「異端」という意味でも用いられましたが、ここでは会衆内部の派閥を指すと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「認められた人たち」「本物であることが確かめられた人たち」とも訳せます。試されて確かだと認められた者、という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: なければならない
  rationale: 強い必要性を保ちつつ、それが神の摂理による必然なのか、状況上の不可避性なのかは限定しない。
- source_word: γὰρ
  choice: なぜなら……からです
  rationale: 前節に対する説明のつながりを、自然な現代日本語で明示する。
- source_word: καὶ αἱρέσεις
  choice: 派閥も
  rationale: この文脈では、後代の教理的な意味での「異端」よりも、共同体内部に生じる党派的な集団を指す。「も」によって καί を反映する。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間に／あなたがたの間で
  rationale: 共同体内部という意味を、日本語の各述語に合う助詞で自然に表す。原文の反復も保持する。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的と結果のどちらにも開かれた原文の含みを保ち、厳密に一方へ限定しない。
- source_word: καὶ οἱ δόκιμοι
  choice: 確かな者たちも
  rationale: 試されて真正・適格であることが確かめられた者という含意を簡潔に表し、第二の καί も「も」で保持する。
- source_word: φανεροὶ γένωνται
  choice: 明らかになる
  rationale: それまで見えていなかったものが明白になるという変化を自然な日本語で表す。
theological_decisions:
- issue: αἱρέσεις の訳語
  choice: 派閥
  alternative: 分裂、党派、異端
  rationale: 主の晩餐をめぐるコリント共同体内の亀裂という直近の文脈に合わせ、後代の教理的概念である「異端」を持ち込まない。
- issue: δεῖ の必要性
  choice: なければならない
  alternative: 避けられない、神の定めにより必ず起こる
  rationale: 原文が必要性の根拠を明示しないため、神的必然か実際上の不可避性かを訳文で決めない。
- issue: ἵνα の目的・結果関係
  choice: ……ためです
  alternative: その結果……明らかになります
  rationale: 原文の目的・結果の幅を保ち、分派そのものを神が積極的に望むと断定しない。
- issue: οἱ δόκιμοι の意味
  choice: 確かな者たち
  alternative: 認められた人たち、本物の人たち、試練に耐えた人たち
  rationale: 誰が認定するのかを補わず、試されて真正であることが判明しているという語の含みを保つ。
translation_notes:
  register: 明快な現代標準語としつつ、書簡の論証にふさわしい端正さを保った。「なぜなら……からです」で前節との説明関係を示し、原文に二度ある「あなたがたの間」を省略せず、共同体内での対照を保持した。
