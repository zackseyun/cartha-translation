base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: ja
  text: あなたがた自身で判断しなさい。女性が頭を覆わずに神に祈ることは、ふさわしいことでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この箇所を含む広い文脈で、γυνήを婚姻上の意味に取る場合は、「妻」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: あなたがた自身で
  rationale: 直訳的な「あなたがた自身の間で」よりも、各自の判断を促す強調を自然な現代日本語で表す。
- source_word: κρίνατε
  choice: 判断しなさい
  rationale: 評価して結論を出すよう求めるアオリスト命令形の直接的な力を保ちつつ、文脈に自然な表現とした。
- source_word: πρέπον ἐστὶν
  choice: ふさわしいことでしょうか
  rationale: 社会的・倫理的な適切さを問う表現であり、「ふさわしい」は品位を保ちながら現代日本語として明瞭である。
- source_word: γυναῖκα
  choice: 女
  rationale: γυνήには「女」と「妻」の両義があるが、この節自体には夫への明示的言及がなく、一般的な問いとして表現されているため、本文では広い意味の「女」を採用する。婚姻上の意味は脚注に残す。
- source_word: ἀκατακάλυπτον
  choice: 頭を覆わずに
  rationale: 語義は「覆われていない」。直前の文脈が頭の覆いを扱っているため、暗黙の対象である頭を補い、日本語として明確にした。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: προσεύχομαιに伴う与格は祈りの向けられる相手を示すため、簡潔に「神に」と訳した。
- source_word: προσεύχεσθαι
  choice: 祈ること
  rationale: 不定詞が適否を問われる行為を表すため、日本語では名詞化して自然に構成した。
theological_decisions:
- issue: 頭を覆うことを論じる文脈でのγυνήの意味
  choice: 女
  alternative: 妻
  rationale: この節単独では夫との関係が明示されず、問いは一般的な形で述べられている。狭い婚姻上の意味を本文に持ち込まず、文脈上可能な「妻」は脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「判断しなさい」で命令の直接性を保ち、「ふさわしいことでしょうか」で修辞疑問を自然に表した。
