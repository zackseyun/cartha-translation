  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: ja
  text: とはいえ、主にあっては、女は男なしにいるのではなく、男も女なしにいるのでもありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「妻は夫なしにいるのではなく、夫も妻なしにいるのでもありません」とも訳せる。ギリシア語の語は、それぞれ「女／男」と「妻／夫」のどちらをも指し得る。ここでは、この発言は結婚に限らない一般的なものと考え、「女／男」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 直前の議論を打ち消さず、ここで相互性を示して均衡を取る転換を、自然な現代日本語で表す。
- source_word: γυνή
  choice: 女
  rationale: 「妻」の可能性もあるが、創造と礼拝をめぐる文脈で一般的な男女の関係を述べているため、より広い意味を採る。
- source_word: ἀνήρ
  choice: 男
  rationale: 「夫」の可能性もあるが、γυνήとの対句が一般的な男女の相互関係を示すため、「男」とする。
- source_word: χωρίς
  choice: なしにある
  rationale: 単なる物理的な不在より、切り離された状態や独立を表す原語の関係的含意を保ちつつ、文脈にない「独立できない」などの強い解釈を避ける。
- source_word: ἐν κυρίῳ
  choice: 主にあっては
  rationale: パウロに特徴的な、主との結びつきの領域・関係を表す句として、定着した自然な聖書語法を用いる。
- source_word: οὔτε ... οὔτε
  choice: …のではなく、…も…のではありません
  rationale: 二つの否定節の均衡と並行性を、明瞭で自然な日本語として表す。
theological_decisions:
- issue: γυνή／ἀνήρを「女／男」とするか「妻／夫」とするか
  choice: 女／男
  alternative: 妻／夫
  rationale: 直近の文脈は創造と礼拝における男女を扱い、この節は「主にあって」の相互性を示す一般的な均衡命題として機能する。ただしギリシア語自体には婚姻上の意味もあり得るため、脚注で明示する。
- issue: χωρίςの関係性をどの程度明示するか
  choice: なしにある
  alternative: から独立しているのではない
  rationale: 「独立」を明示すると相互依存の解釈を強く固定し得るため、原文に近い分離表現を保ち、神学的含みを文脈に委ねる。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「主にあって」はパウロ書簡の神学的・関係的表現を保つため採用した。文末を丁寧体にして、朗読にも適する端正さを持たせた。
