source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: ja
  text: したがって、だれでも、パンをふさわしくないしかたで[a]食べるか、主の杯をふさわしくないしかたで飲むなら、主のからだと血に関して罪責を負うことになります。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ふさわしくないしかたで」は、食べたり飲んだりする行為のしかたを表しており、その人自身に価値がないという意味ではありません。
    reason: lexical_alternative
  - marker: b
    text: より直訳的には「主のからだと血について罪責を負うことになります」とも訳せます。原文の属格は、主のからだと血に関して罪責を負うことを示します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: したがって
  rationale: 直前の主の晩餐についての議論から結論を導く接続語として、推論の力を自然な現代日本語で表す。
- source_word: ὃς ἂν
  choice: 人はだれでも
  rationale: 関係代名詞とἄνによる不定・一般化の意味を表す。
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: パンを食べ
  rationale: 定冠詞は文脈上すでに語られている主の晩餐のパンを指すため、日本語では不自然な限定語を加えず「パン」とする。
- source_word: ἢ
  choice: あるいは
  rationale: 原文の選言を保ち、二つの行為を「そして」と固定的に結びつけない。
- source_word: πίνῃ τὸ ποτήριον τοῦ κυρίου
  choice: 主の杯を飲む
  rationale: 杯をその中身の意味で用いる原文の換喩を、日本語でも通用する聖書的表現として保持する。
- source_word: ἀναξίως
  choice: それにふさわしくないしかたで
  rationale: 形容詞ではなく副詞であり、参加者自身の価値ではなく、食べることや飲むことのしかたを修飾する点を明確にする。
- source_word: ἔνοχος ἔσται
  choice: 罪を負うことになります
  rationale: 有罪性・責任を負う意味を、厳粛さを保ちながら自然な日本語で表す。
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: 主のからだと血に対して
  rationale: ἔνοχοςに伴う属格が示す責任の対象・関係を、意味を過度に限定せず日本語で明瞭にする。
theological_decisions:
- issue: ἀναξίωςが聖餐参加者に関して示す意味
  choice: 食べたり飲んだりするしかたがふさわしくないことを非難する。
  alternative: 参加する人そのものがふさわしくないことを述べる。
  rationale: ἀναξίωςは動詞を修飾する副詞であるため、個人の本質的な資格について本文以上の教理的判断を持ち込まない。
- issue: 食べることと飲むことの間のἢの効力
  choice: どちらか一方でもふさわしくないしかたで行えば警告が当てはまる。
  alternative: 二つを固定的な一組と見なし、実質的に「そして」と読む。
  rationale: 原文の選言接続詞ἤをそのまま保持する。
- issue: ἔνοχοςと属格の関係
  choice: 主のからだと血に対して罪責を負う。
  alternative: 主のからだと血そのものについて「有罪となる」と直訳する。
  rationale: 法的・責任的な重みを保ちつつ、日本語で意味が通るよう関係を「に対して」で表す。
translation_notes:
  register: 明瞭で現代的かつ厳粛な標準日本語。「からだ」は聖書本文として親しみやすい表記を採用した。「あるいは」によって原文の選言を明示し、副詞句の位置と補足語「それに」によってἀναξίωςが行為のしかたを指すことを明確にした。
