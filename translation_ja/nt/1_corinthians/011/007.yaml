  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: ja
  text: 男[a]は、神のかたち、また神の栄光であるのだから、頭を覆う[b]べきではありません。しかし、女は男の栄光です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「男」「女」は、それぞれ「夫」「妻」とも訳せる。ギリシア語のἀνήρとγυνήは、文脈によりどちらの意味にもなりうる。
    reason: alternative_reading
  - marker: b
    text: 「頭に覆いを掛ける」とも訳せる。ギリシア語は覆いの具体的な種類を限定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ / ἀνδρός
  choice: 男／男の
  rationale: この文脈では、礼拝と創造をめぐる男女の対比として読むのが自然であるため、一般的な性別を表す「男」とした。語彙上は「夫」も可能なので脚注に示した。
- source_word: ὀφείλει
  choice: べきです
  rationale: 道徳的・規範的な義務を、現代日本語で自然に表す。「なければならない」ほど絶対的に響かせず、原文の力を保つ。
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: 頭を覆う
  rationale: 覆いの具体的な形を原文以上に限定せず、動作を明瞭に表した。「ベールをかぶる」は可能だが、意味を狭めるため脚注に回した。
- source_word: εἰκὼν
  choice: かたち
  rationale: 創造の記事への示唆を保つ、聖書日本語として定着した表現。「像」よりも人について自然である。
- source_word: δόξα
  choice: 栄光
  rationale: 二つの用例を同じ語で訳し、神学的・関係的な含みと原文の緊張を保った。「誉れ」では意味が狭くなる。
- source_word: θεοῦ
  choice: 神の
  rationale: 属格を簡潔に保持し、εἰκὼνとδόξαの双方にかかる自然な日本語とした。
- source_word: ὑπάρχων
  choice: であるのだから
  rationale: 分詞が前の規範の根拠を示すことを、自然な因果表現で明示した。
- source_word: ἡ γυνὴ
  choice: 女
  rationale: 一般的な男女の対比を保つため「女」とした。語彙上は「妻」も可能であり、その曖昧さは脚注に残した。
theological_decisions:
- issue: ἀνήρ／γυνήを「男／女」とするか「夫／妻」とするか
  choice: 男／女
  alternative: 夫／妻
  rationale: 頭を覆うことと創造を根拠にした議論は、狭く夫婦関係だけに限定するより、男女の代表的な対比として読むのが自然である。ただしギリシア語自体が持つ婚姻上の意味の可能性は脚注で保持した。
- issue: パウロの非対称的な神学的表現をどう訳すか
  choice: 「女は男の栄光です」と直接的に保持する
  alternative: 「女は男の栄光を映すものです」または「女は男の誉れです」
  rationale: 原文はδόξαとἐστινを用いて直接述べているため、説明的に和らげたり「誉れ」に限定したりせず、その神学的緊張を残した。
- issue: 「神の」が「かたち」と「栄光」のどちらにかかるか
  choice: 日本語では双方に明示して「神のかたち、また神の栄光」とする
  alternative: 「神のかたちと栄光」
  rationale: ギリシア語の並列ではθεοῦが両名詞に自然に関係する。日本語で誤読を避けつつ、意味を追加せず明瞭にした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、本文の論理と荘重さを保った。断定内容は和らげず、敬体で読みやすく整えた。脚注記号は内容が指す語句に直接配置した。
