id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: ja
  text: 私もキリストに倣っているように、私に倣う者となりなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιμηταί
  choice: 倣う者
  rationale: 単なる「従う者」ではなく、模範を見習い、その行いに倣う人という明示的な意味を保つ。
- source_word: μου
  choice: 私に
  rationale: 日本語では「私の模倣者」よりも「私に倣う者」が自然で、属格が示す模倣の対象を明確に表せる。
- source_word: γίνεσθε
  choice: となりなさい
  rationale: 単に「ありなさい」ではなく、そのような者になることを命じる γίνομαι の変化・形成の含みを保つ。
- source_word: καθὼς
  choice: ように
  rationale: パウロに倣うことと、パウロがキリストに倣うこととの比較関係を自然な現代日本語で示す。
- source_word: κἀγὼ
  choice: 私も
  rationale: καί と ἐγώ の結合による「私も」という付加の強調を明示する。
- source_word: Χριστοῦ
  choice: キリストに
  rationale: 省略された μιμητής との関係を日本語では「キリストに倣う」と補って表す。「キリスト」は日本語聖書で定着し、Χριστός の称号性も保持する語である。
theological_decisions:
- issue: Χριστοῦ の訳語
  choice: キリスト
  alternative: メシア
  rationale: Χριστός は「油注がれた者」という称号だが、日本語では「キリスト」が称号として広く定着している。「メシア」も意味上可能だが、ここで異なる人物や概念を指すとの印象を避けるため本文には「キリスト」を採用した。
- issue: 後半の省略表現
  choice: 「キリストに倣っている」と補う
  alternative: 「私もキリストの者である」のように省略を形式的に残す
  rationale: ギリシア語では前半の μιμηταί が後半にも意味上補われる。日本語で省略を形式的に再現すると所属を表すと誤解されやすいため、比較の意味を明確にしつつ、原文に内在する語を補って訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の比較関係と「私も」の強調を保ち、日本語として自然になるよう従属節を先に置いた。
