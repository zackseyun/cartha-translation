  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: ja
  text: しかし、この指示を与えるにあたって、私はあなたがたをほめません。あなたがたの集まりが、良くなるどころか、かえって悪くなるからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたがたは、より良いことのためではなく、より悪いことのために集まっている」。この表現は、集まりの目的とも結果とも取れます。
    reason: source_ambiguity
lexical_decisions:
- source_word: Τοῦτο
  choice: このことを
  rationale: 中性指示代名詞で、これから述べる指示内容を指す。「このことを」として前方照応を保った。
- source_word: δὲ
  choice: しかし
  rationale: 前段から話題を移しつつ、11章2節の称賛との対照を示す穏やかな逆接として訳した。
- source_word: παραγγέλλων
  choice: 命じるにあたって
  rationale: παραγγέλλω は「指示する、命じる」を意味する。ここでは使徒的な指示の権威を保ちつつ、分詞を自然な日本語の状況表現にした。
- source_word: οὐκ ἐπαινῶ
  choice: 私はあなたがたを褒めません
  rationale: ἐπαινέω の基本義を明瞭に表し、11章2節の「褒める」との語義上の対照も保った。
- source_word: ὅτι
  choice: からです
  rationale: 称賛しない理由を導く因果関係として訳した。
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: 事態が良くなるどころか、かえって悪くなっている
  rationale: εἰς＋冠詞付き比較級が示す結果の対照を、現代日本語で明確かつ自然に表現した。「良い／悪い」の比較関係を維持している。
- source_word: συνέρχεσθε
  choice: あなたがたが集まることで
  rationale: 共同体が会合することを表す自動詞的用法。集会の文脈を保ちながら、後続する結果表現につながる自然な形にした。
theological_decisions:
- issue: παραγγέλλων の権威的な語調
  choice: 命じるにあたって
  alternative: 指示するにあたって
  rationale: 語は指示から命令までの幅を持つ。ここではパウロが共同体の集まりを是正する権威ある指示を与えているため「命じる」を採用したが、威圧的な含意は加えていない。
- issue: εἰς τὸ κρεῖσσον／εἰς τὸ ἧσσον が示す目的か結果か
  choice: 集まりの結果として事態が良くならず悪くなっている
  alternative: 良くするためではなく、悪くするために集まる
  rationale: 文法上、目的または結果の含みがあり得るが、文脈は彼らの意図が害悪にあると断定するより、実際の集会がもたらす悪い結果を非難していると理解するのが自然である。
translation_notes:
  register: 明瞭な現代標準日本語。叱責の厳粛さを保ちながら、過度に古風または威圧的な表現を避けた。脚注で原文の目的・結果の曖昧さを示した。
