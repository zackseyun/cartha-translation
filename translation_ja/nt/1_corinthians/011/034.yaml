id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: ja
  text: もしだれかが空腹なら、その人は家で食べなさい。あなたがたが裁き[a]を招くような集まりにならないためです。その他のことについては、私がそちらへ行くときに指示します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪に定められること」とも訳せる。ギリシア語のκρίμαは「裁き」または「有罪の判決」を意味し得る。ここでは、主による現在の懲らしめが語られている直前の文脈（29–32節）に照らして、「裁き」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: 空腹な
  rationale: 現在の状態を表す語であり、現代日本語として自然で明確にした。
- source_word: ἐν οἴκῳ
  choice: 家で
  rationale: 教会の集まりではなく各自の家庭で食べることを指すため、簡潔で自然な表現とした。
- source_word: ἐσθιέτω
  choice: 食べなさい
  rationale: 三人称単数の現在命令形の命令の力を、自然な日本語で保った。
- source_word: εἰς κρίμα
  choice: 裁きを受ける
  rationale: εἰς が示す結果・帰結を日本語で明確にしつつ、κρίμα を最終的な有罪宣告に限定せず「裁き」とした。
- source_word: συνέρχησθε
  choice: 集まって
  rationale: この段落で繰り返される共同体の集合を表し、周辺文脈とのつながりを保った。
- source_word: Τὰ δὲ λοιπὰ
  choice: その他のことは
  rationale: 残る諸事項への話題転換を、明瞭で自然な日本語にした。
- source_word: ὡς ἂν ἔλθω
  choice: 私が行ったときに
  rationale: パウロが読者のもとへ赴く将来の時を指す。日本語では話し手の側から相手の所へ向かうため「行く」が自然である。
- source_word: διατάξομαι
  choice: 指示します
  rationale: 今後、実際上の諸事項について取り決めや命令を与える意味を、現代日本語で明確に表した。
theological_decisions:
- issue: 主の晩餐についての警告における κρίμα の意味
  choice: 裁き
  alternative: 罪に定められること／有罪判決
  rationale: 直前の29–32節では、主による現在の裁きと懲らしめが世と共に罪に定められないことと区別されている。「裁き」は語の幅と文脈上の緊張を保ち、最終的な断罪と断定しない。
- issue: 不定代名詞 τις と単数命令形の表現
  choice: 空腹な人がいるなら、その人は……食べなさい
  alternative: 空腹なら、家で食べなさい
  rationale: 原文の不定単数を明示しつつ、性別を原文以上に特定しない自然な日本語とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、勧告と警告の厳粛さを保った。脚注記号は内容上対応する「裁き」の直後に置いた。
