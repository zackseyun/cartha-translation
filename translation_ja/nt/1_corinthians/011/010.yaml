  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: ja
  text: このため、女性は御使いたちのゆえに、頭に権威を持つべきです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「頭に権威のしるしを着けるべきです」。原文は「権威」と述べており、「しるし」や「かぶり物」に当たる語は明記していません。
    reason: alternative_reading
  - marker: b
    text: 「御使いたち」は「使者たち」とも訳せますが、ここでは天的存在を指す可能性が高いと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の議論を受ける因果・帰結のつながりを、簡潔で自然な日本語で示す。
- source_word: ὀφείλει
  choice: 持つべきです
  rationale: 道徳的・適切さに基づく義務を表し、絶対的な法的命令とまでは言い切らない。
- source_word: ἡ γυνὴ
  choice: 女
  rationale: 定冠詞を伴う一般的単数として、男と女についての文脈を保つ。「妻」と限定する必要はない。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 原文に明記された語をそのまま訳し、「しるし」や「かぶり物」を本文へ補わない。
- source_word: ἔχειν
  choice: 持つ
  rationale: 動詞の基本的な意味を保ち、文脈から推測される「身に着ける」を本文に持ち込まない。
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: 頭に
  rationale: 空間的関係を自然な日本語で示し、その具体的なあり方を限定しない。
- source_word: διὰ τοὺς ἀγγέλους
  choice: 御使いたちのゆえに
  rationale: διά＋対格の理由・原因を表す用法を保つ。ἄγγελοι はここでは天的存在を指す可能性が高い。
theological_decisions:
- issue: ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς の意味
  choice: 「頭に権威を持つ」と原文の表現を保つ。
  alternative: 「頭に権威のしるしを着ける」または「権威のしるしとして頭を覆う」。
  rationale: ギリシア語本文には「しるし」や「覆い」に当たる語がない。難解さと解釈上の緊張を本文に残し、一般的な補足解釈は脚注に示す。
- issue: ἀγγέλους の指示対象
  choice: 御使いたち
  alternative: 使者たち
  rationale: ἄγγελος には「使者」の意味もあるが、無限定の複数形はパウロ書簡では通常、天的存在を指す。御使いが言及される理由について特定の説は加えない。
- issue: γυνή の範囲
  choice: 女
  alternative: 妻
  rationale: 周辺文脈はより広く男と女を扱っており、婚姻関係に限定しない。
translation_notes:
  register: 現代標準日本語の丁寧体を用いた。難解な中心句を説明的に言い換えず、原文の簡潔さと曖昧さを保持した。「御使い」は聖書的でありながら一般読者にも理解可能な語として採用した。
