id: 1CO.11.2
reference: 1 Corinthians 11:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: ja
  text: 私は、あなたがたがあらゆる点で私のことを覚えており、私があなたがたに伝えたとおりに、伝承[a]をしっかり守っていることを称賛します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「教え」「指示」。ギリシア語は「伝承」、すなわち受け渡されたもの。
    reason: παραδόσεις の語義の幅を示し、「伝承」が後代の特定の制度や教派的概念だけを意味するとの誤解を避けるため。
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: 称賛します
  rationale: 相手の行動をほめ、評価する意味を、明瞭で品位ある現代日本語で表した。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは強い逆接ではなく穏やかな談話の移行を示す。日本語では文脈上、接続語を補わないほうが自然であり、「しかし」などによる過度な対立を避けられる。
- source_word: ὑμᾶς
  choice: あなたがた
  rationale: 二人称複数であることを日本語で明示した。
- source_word: ὅτι
  choice: 〜ことを
  rationale: 称賛の理由・内容を日本語の自然な名詞節として表した。因果関係は文全体から明確である。
- source_word: πάντα
  choice: あらゆる点で
  rationale: 「すべてのもの」ではなく、広い範囲・あらゆる面を指す用法として自然に表した。「いつも」と断定して時間的意味に限定することを避けた。
- source_word: μου μέμνησθε
  choice: 私のことを覚えており
  rationale: パウロを継続して心に留めていることを、完了形の持続的含意も損なわず自然な日本語で表した。
- source_word: καθὼς
  choice: 〜とおりに
  rationale: パウロが伝えた形と、彼らが保持している形との対応を示した。
- source_word: παρέδωκα
  choice: 伝えた
  rationale: 教えや実践を受け渡す意味を明瞭に表し、「伝承」との語義的な結びつきも保った。
- source_word: τὰς παραδόσεις
  choice: 伝承
  rationale: 「受け渡されたもの」という語義を保ち、単なる一般的な教えへ平板化しない訳語とした。後代の特定教派における伝統観を読み込まないよう、脚注で意味を説明する。
- source_word: κατέχετε
  choice: しっかり守っている
  rationale: 単に所有するのでなく、受けたものを保持し固守する能動的な意味を、現代日本語で自然に表した。
theological_decisions:
- issue: 教会的文脈における παραδόσεις の訳し方
  choice: 伝承
  alternative: 教え／指示／伝えられたこと
  rationale: 本文は、パウロからコリントの信徒へ受け渡された教えや実践を指す。「伝承」は伝達・継承という原語の概念を保持する一方、その内容や後代の権威構造を本文以上に規定しない。別訳は脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える丁寧体を用いた。「あなたがた」で複数を明示し、穏やかな移行を示す δέ は不自然な逆接を避けるため無標とした。
