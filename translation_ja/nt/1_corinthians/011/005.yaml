reference: 1 Corinthians 11:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: ja
  text: しかし、頭を覆わずに[b]祈ったり預言したりする女性は皆、その頭を辱めます[a]。それは、頭を剃られた女性と全く同じだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女性」は「妻」とも訳せる。また「その頭」は、文字どおりの頭を指すとも、文脈上の比喩的な「頭」、すなわち夫または男を指すとも理解されうる。
    reason: alternative_reading
  - marker: b
    text: 「覆わずに」という語だけでは、覆いの具体的な種類は特定されない。ベールを指すのか、より一般に頭が覆われていない状態を指すのかについては解釈が分かれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: 女
  rationale: γυνήは「女」と「妻」の両方を意味し得るが、ここでは「祈ったり預言したりする…皆」という一般的な表現を優先した。「妻」の可能性は脚注に残す。
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: 祈ったり預言したりする
  rationale: 現在分詞が表す、祈りまたは預言を行っている状況を、自然な現代日本語で表した。
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: 頭を覆わずに
  rationale: 頭が覆われていない状態を示しつつ、覆いがベール、髪、その他の何であるかは特定しない。
- source_word: καταισχύνει
  choice: 辱めています
  rationale: 社会的な恥、不名誉をもたらす意味を、文脈にふさわしい簡潔で格調ある日本語で示す。
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: 自分の頭
  rationale: 身体上の頭と比喩的な「頭」のどちらにも理解し得る原文の曖昧さを保つ。
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: 全く同じ
  rationale: 二つを同一視する原文の強調を、自然な日本語で明確に表す。
- source_word: τῇ ἐξυρημένῃ
  choice: 頭をそられたの
  rationale: 剃る行為の結果としてその状態にあることを示す完了分詞の含みを保つ。日本語では対象を補って意味を明瞭にした。
theological_decisions:
- issue: 「自分の頭」（τὴν κεφαλὴν αὐτῆς）が指すもの
  choice: 本文では「自分の頭」とし、身体上か比喩的かを確定しない。
  alternative: 身体上の頭、または議論上の比喩的な「頭」である夫・男。
  rationale: 直近の表現は身体上の頭と読める一方、周囲の文脈は比喩的理解の可能性も生じさせるため、原文の解釈上の緊張を保持する。
- issue: 「覆わずに」が指す覆いの性質
  choice: 覆いの種類を特定しない。
  alternative: ベールを着けずに、または髪を覆わずに。
  rationale: ἀκατακάλυπτος自体は覆われていないことを示すが、その具体的な覆いを明示しないため。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、礼拝と預言を扱う箇所にふさわしい品位を保った。「女」「辱める」「頭」の反復により原文の論旨を見えやすくし、解釈を一方に限定する語を避けた。
