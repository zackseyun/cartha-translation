  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: ja
  text: からだ[a]をわきまえないまま[b]食べたり飲んだりする人は、自分自身への裁きを食べたり飲んだりしている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「からだ」の代わりに「主のからだ」とある。
    reason: textual_variant
  - marker: b
    text: 「からだを区別しないまま」とも訳せる。これは、主の晩餐の意味を正しく認識すること、集められた信者たちを一つのからだとして認めること、またはその両方を指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: 裁き
  rationale: 司法的な判断・判決を表す語であり、直後の文脈では最終的な断罪ではなく神の懲らしめが語られるため、「罪に定められること」ではなく、より広い「裁き」とした。
- source_word: ἑαυτῷ
  choice: 自分に対する
  rationale: 再帰代名詞の与格が、その人自身に不利な裁きを招くことを示すため、自然な日本語でその方向性を明示した。
- source_word: διακρίνων
  choice: わきまえる
  rationale: 正しく区別し、見定め、認識するという認知的・道徳的な含みを保ちつつ、目的語の意味を一つに限定しない表現とした。
- source_word: τὸ σῶμα
  choice: からだ
  rationale: 本文は簡潔に「からだ」とだけ述べる。キリストのからだ、信者から成る共同体、またはその両方という解釈の余地を保つため、説明語を補わなかった。
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: 食べ、また飲む者
  rationale: 冠詞付き分詞の一般的な単数を、日本語として明瞭で格調を保つ表現にした。
- source_word: μὴ διακρίνων
  choice: わきまえないまま
  rationale: 否定分詞の付帯的な意味を保ち、条件節へ断定的に変換せず、裁きを招く食べ方・飲み方のありさまとして自然に表した。
theological_decisions:
- issue: 「からだ」が何を指すか
  choice: 本文では「からだ」とだけ訳し、指示対象を限定しない。
  alternative: 「主のからだ」または「信者から成るからだ」と明示する。
  rationale: ギリシア語本文は単に「からだ」と読む。文脈には主の晩餐におけるキリストとの関係と、コリントの信者たちが互いを顧みない問題の双方があるため、その神学的緊張を訳文でも保った。
- issue: κρίμα の強さ
  choice: 「裁き」
  alternative: 「罪に定められること」
  rationale: 32節では、彼らが世とともに罪に定められないための主の懲らしめが区別されている。「裁き」はこの文脈に適合し、最終的な滅びを必要以上に含意しない。
- issue: μὴ διακρίνων の論理的関係
  choice: 「わきまえないまま」として分詞的な付帯状況を保つ。
  alternative: 「わきまえないなら」と条件節にする。
  rationale: 条件的な含みはあり得るが、原文は分詞構文であるため、その関係を訳文で過度に明示せず、自然な日本語の範囲で曖昧さを保持した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位のある文体。「裁きを食べ、また飲む」という原文の強い比喩は、不自然さを避けられる範囲でそのまま保持した。「身体」ではなく聖書文脈になじむ「からだ」とし、漢字表記によって解釈を狭めないようにした。
