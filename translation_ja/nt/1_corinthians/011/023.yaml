source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: ja
  text: 私は、あなたがたに伝えたことを主から受けました。すなわち、主イエスは、引き渡されていた夜[a]、パンを取りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「裏切られた夜」とも訳される。
    reason: παρεδίδετο は「引き渡されていた」とも「裏切られた」とも理解できるため。
lexical_decisions:
- source_word: παρέλαβον
  choice: 受けた
  rationale: 主を源とする教え・伝承を受けたことを表す。続く παρέδωκα（伝えた）との「受ける／伝える」という対応も保つ。
- source_word: ἀπὸ τοῦ κυρίου
  choice: 主から
  rationale: 源を示す句として簡潔に訳し、直後の「主イエス」に先立って原文どおり「主」とする。
- source_word: παρέδωκα
  choice: 伝えた
  rationale: 受けた教えを他者へ受け渡したという伝承語法を、現代日本語で自然に表す。後の同語源 παρεδίδετο とは文脈上意味が異なるため、機械的に同じ訳語にはしない。
- source_word: ὅτι
  choice: すなわち
  rationale: 受けて伝えた内容を導入する用法を日本語で明確にする。
- source_word: κύριος
  choice: 主
  rationale: 敬意とキリスト論的な含意を保つ標準的な訳語。
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: 夜
  rationale: 関係節を伴う時間表現を、「引き渡されようとしていた夜」と自然な日本語に組み直す。
- source_word: παρεδίδετο
  choice: 引き渡されようとしていた
  rationale: 未完了過去受動の進行的な側面と、「引き渡す」「裏切る」の双方に開かれた語義をできる限り保つ。受難へ向かう動きを自然な日本語で表す。
- source_word: ἔλαβεν ἄρτον
  choice: パンを取り
  rationale: 無冠詞の ἄρτον を不必要に「一つのパン」と限定せず、後続文へつながる分詞的な日本語表現とする。
theological_decisions:
- issue: 制定記事における παρεδίδετο の訳
  choice: 引き渡されようとしていた
  alternative: 裏切られた
  rationale: παραδίδωμι は文脈により「引き渡す」と「裏切る」の両義を取り得る。本文では行為をユダの裏切りだけに狭めず、人間による引き渡しと受難のより広い含意を残し、伝統的な理解は脚注に示す。
- issue: 「主から受けた」の意味
  choice: 原文どおり、主を源として示す
  alternative: 主から直接啓示として受けた、と明示する
  rationale: ἀπὸ τοῦ κυρίου は源を示すが、その受領方法が直接啓示か伝承を介したものかを本文自体は明示しないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「私」はパウロの強調された Ἐγώ を反映する。「あなたがた」を用いて複数形を明示し、聖餐制定記事としての格調を保ちつつ、過度に古風な表現は避けた。
