source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: ja
  text: 実際、食事のときには、それぞれが自分の夕食を先に取ってしまうので、一人は空腹のままで、別の人は酔っています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の食事をほかの人より先に取る」。このギリシア語の動詞は、前もって取ること、または他の人を待たずに先へ進むことを表し得ます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「一人は空腹で、別の人は酔ってしまう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: それぞれが
  rationale: 一人一人を個別に指す分配的な単数の力を、自然な現代日本語で表した。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の叱責に対する理由・説明を導く接続関係を明確にした。
- source_word: τὸ ἴδιον δεῖπνον
  choice: 自分の夕食
  rationale: ἴδιονの私的所有の強調を「自分の」で保ち、δεῖπνονの主要な意味と主の晩餐をめぐる文脈を踏まえて「夕食」とした。
- source_word: προλαμβάνει
  choice: 先に食べてしまい
  rationale: 他の人を待たず、自分の食事を先に取るという文脈上の非難を自然に表す。「しまい」は、その行為が問題視されていることを示すが、語の時間的意味そのものは「先に」で保持した。
- source_word: ἐν τῷ φαγεῖν
  choice: 食べる際に
  rationale: ἐνを伴う冠詞付き不定詞の時間的用法を、解釈を広げすぎず自然な日本語にした。
- source_word: ὃς μὲν ... ὃς δὲ
  choice: 一人は……別の人は
  rationale: 参加者の間に生じている対照的な状態を簡潔に保持した。
- source_word: πεινᾷ
  choice: 空腹で
  rationale: 現在の状態を表す素直な訳とし、意図的に食事を与えられないという含意までは本文に加えなかった。
- source_word: μεθύει
  choice: 酔っている
  rationale: 実際の酒酔いを曖昧にせず、動作と状態の両義性がある中で、πεινᾷとの並行に合う状態表現を採用した。
theological_decisions:
- issue: 分配的単数と性別表現
  choice: それぞれが自分の夕食
  alternative: 一人一人が彼自身の夕食
  rationale: ギリシア語の分配的な個別性は保ちつつ、日本語では「それぞれ」「自分」が性別を問わず単数の再帰関係を自然かつ正確に示すため、不自然な男性限定表現を避けた。
- issue: 主の晩餐における乱用の性質
  choice: 酔っている
  alternative: 酔ってしまう
  rationale: 本文が示す実際の酩酊を「食べ過ぎ」などに弱めず訳した。同時に、動作の開始か結果の状態かを過度に限定しない表現とした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。理由を示すγὰρを日本語の呼応表現「というのも……からです」で再現し、共同の食事における身勝手さと、空腹と酩酊の衝撃的な対照を保った。
