base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: ja
  text: ですから、私の兄弟たちよ[a]、食べるために集まるときは、互いを待ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、男性形で男女を含む会衆全体に呼びかけることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: ですから
  rationale: 直前の主の晩餐をめぐる叱責と指示を受け、その実践的な結論を導く推論の接続詞として、明快で自然な「ですから」とした。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: 所有代名詞を伴う呼格の男性複数形を形態に即して訳した。この語はここでは女性を含む会衆全体への呼びかけと考えられるため、その包摂的用法を脚注で示した。
- source_word: συνερχόμενοι
  choice: 集まるときは
  rationale: 命令が当てはまる状況を表す現在分詞を、自然な日本語の時の節で表した。章内で繰り返される共同の集会という意味も保っている。
- source_word: εἰς τὸ φαγεῖν
  choice: 食事のために
  rationale: 目的を表す前置詞と冠詞付き不定詞を「食事のために」と訳し、単に食べる行為だけでなく共同の食事を目的とした集合であることを自然に表した。ただし食事の性格は本文以上に限定していない。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 相互代名詞の意味を簡潔で自然な日本語で表した。
- source_word: ἐκδέχεσθε
  choice: 待ち合わせなさい
  rationale: 先に食べ始める者がいたという直前の文脈では、他の人々がそろうのを待つ命令と理解するのが最も自然である。「待ち合わせる」は目的語を取らずに相互性を表せるため、ἀλλήλουςとの組み合わせを自然な日本語にした。
theological_decisions:
- issue: ἀδελφοίの代表的男性形による呼びかけ
  choice: 本文では「兄弟たち」を保ち、女性も含み得る用法を脚注で明示する。
  alternative: 本文で「兄弟姉妹たち」とする。
  rationale: ギリシア語は文法上男性複数形だが、コリントの会衆全体への呼びかけとして女性を含む可能性が高い。原文の形を本文に残しつつ、現代の読者が男性だけへの命令と誤解しないよう脚注で説明した。
- issue: ἐκδέχεσθεの意味範囲
  choice: 文脈上の実践的な命令として「待ち合わせなさい」とする。
  alternative: 「互いを迎え入れなさい」または「互いを受け入れなさい」とする。
  rationale: この動詞には受け入れる、迎えるという語義もあり得るが、21節の「自分の食事を先に済ませる」という問題への直接的な是正としては、他の人が来るまで待つ意味が優勢である。
translation_notes:
  register: 現代標準語による簡潔で格調を保った命令文。「待ち合わせなさい」は、単独で先に食べず、互いがそろうのを待つという文脈的意味を自然に伝える。
