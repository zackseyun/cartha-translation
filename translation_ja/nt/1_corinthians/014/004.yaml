base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: ja
  text: 異言[a]を語る人は自分自身[b]を築き上げますが、預言する人は教会[c]を築き上げます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ある言語で」。ただし、この章では異言の賜物による発話を指すと考えられます。その発話が具体的にどのようなものだったかについては見解が分かれています。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の語形は男性単数ですが、ここでは一人の男性だけに限らない代表的な言い方です。
    reason: lexical_alternative
  - marker: c
    text: 別訳「集会」または「会衆」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: 語る人
  rationale: 冠詞付き現在分詞を、継続的・特徴的な行為をする代表的な人として自然な日本語で表した。後半の「預言する人」との並行も保っている。
- source_word: γλώσσῃ
  choice: 異言を
  rationale: この章の文脈では賜物としての発話を指すと考えられるため、教会で広く理解される「異言」を用いた。ただし、それが外国語か、恍惚的発話かなど、その厳密な性質は訳文で限定しない。ギリシア語の与格が示す手段・様態は、日本語では目的語を伴う「異言を語る」で自然に表現した。
- source_word: ἑαυτὸν
  choice: 自分自身を
  rationale: 再帰代名詞の強さを保ち、共同体との対比を明確にした。ギリシア語は男性単数形だが、ここでは代表的・一般的な用法であり、日本語は性を表示せず自然に同じ範囲を表せる。
- source_word: οἰκοδομεῖ
  choice: 築き上げます
  rationale: 本来の建築比喩を保ちながら、霊的な強化や成長を表す現代日本語として理解できる表現を選んだ。「徳を高める」などの解釈的な限定は避けた。
- source_word: ὁ δὲ προφητεύων
  choice: が、預言する人は
  rationale: 冠詞付き現在分詞を前半と並行する形で訳し、δέの穏やかな対比を接続助詞「が」で表した。
- source_word: ἐκκλησίαν
  choice: 教会を
  rationale: ここでは集まったキリスト者共同体を指す。「教会」は文脈上もっとも自然で一般的だが、「集会」「会衆」という語義上の可能性は注で示した。
theological_decisions:
- issue: γλώσσῃが指す発話の性質
  choice: 賜物としての発話を示す「異言」
  alternative: 外国語、通常の言語、または恍惚的発話と明示する
  rationale: 1コリント12―14章の文脈を反映しつつ、現象の厳密な性質について争われている点を訳文で決着させないため。
- issue: οἰκοδομεῖの含意
  choice: 建築比喩を保つ「築き上げる」
  alternative: 霊的に成長させる、徳を高める、強める
  rationale: 原文は行為の価値をここだけで明示的に称賛も非難もしていないため、比喩を保持し、私的益と共同体的益の緊張を読者が文脈から判断できるようにした。
- issue: 男性単数形の代表的用法
  choice: 性を明示しない日本語の「人」「自分自身」
  alternative: 男性を明示する「その人自身」または「彼自身」
  rationale: 原文の男性単数形は一般的・代表的に用いられている。日本語では性を補わなくても単数の再帰関係と一般原則を忠実に表せるため、不必要な男性限定を加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語の丁寧体を用いた。「築き上げる」によって原文の建築比喩と前後半の反復を保ち、教会朗読にも日常の読解にも耐える簡潔で品位ある調子にした。
