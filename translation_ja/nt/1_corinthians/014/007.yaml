revisions:
- from: 同じように、音を出す、命のないものでも、笛であれ竪琴であれ、その音に区別がなければ、笛で吹かれているもの、あるいは竪琴で奏でられているものが、どうして分かるでしょうか。
  to: 同じように、笛であれ竪琴であれ、音を出す命のないものでも、音に違いをつけなければ、笛で奏でられているもの、あるいは竪琴で奏でられているものが、どうして分かるでしょうか。
  rationale: 原文の曖昧さを保ち、「曲」と限定せず「もの」としたまま、音の区別を「音に違いをつける」と自然に表現しました。笛と竪琴の並行、およびγνωσθήσεταιの認識・識別の修辞疑問も維持しています。英語監査記録の楽器語に関する代替注は日本語訳では必須ではなく、本文に注記アンカーを設ける必要はありません。
