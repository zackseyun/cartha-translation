  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: ja
  text: 同じように、笛であれ竪琴であれ、音を出す命のないものでも、音に違いをつけなければ、笛で奏でられているもの、あるいは竪琴で奏でられているものが、どうして分かるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμως
  choice: 同じように
  rationale: 直前の発話の例を、命のない楽器にも当てはめる比較・譲歩的な流れを自然に示す。文脈上「それでも」より「同じように」が明瞭。
- source_word: τὰ ἄψυχα
  choice: 命のないもの
  rationale: 非生物一般を指しつつ、ここでは楽器を具体例とする表現。原語の「魂・命を持たない」という対照を保つ。
- source_word: φωνὴν διδόντα
  choice: 音を出す
  rationale: 直訳的な「声を与える」ではなく、楽器について自然な現代日本語で意味を表す。
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: 笛であれ竪琴であれ
  rationale: αὐλόςを広く理解しやすい「笛」、古代の弦楽器κιθάραを歴史的形状に比較的近い「竪琴」とした。
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: その音に区別がなければ
  rationale: διαστολήの区別・差異と、φθόγγοιの楽音を簡潔に保つ。旋律を成り立たせる各音の違いを指す。
- source_word: πῶς γνωσθήσεται
  choice: どうして分かるでしょうか
  rationale: 受動形の「知られる・識別される」を、修辞疑問として自然な日本語にした。何が演奏されているか認識できないという意味を保つ。
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: 笛で吹かれているもの、あるいは竪琴で奏でられているもの
  rationale: 二つの冠詞付き受動分詞の並行性を保ち、演奏される曲や内容を原文どおり明示しすぎず「もの」とした。
theological_decisions: []
