  source_fidelity: 原文の二つの選択的・修辞的疑問（ἢ … ἢ …）を「それとも／あるいは」で明確に再現している。「あなたがたから」はἀφ’ ὑμῶνの起点・起源の含意を保ち、「出た」はἐξῆλθενの比喩的な発出を過度に説明せずに訳している。「あなたがただけに」はεἰς ὑμᾶς μόνουςの排他性を適切に表し、「届いた」はκατήντησεν（到達した）に忠実である。
