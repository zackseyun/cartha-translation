id: 1CO.14.36
reference: 1 Corinthians 14:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: ja
  text: それとも、神のことばはあなたがたから出たのですか。[a] あるいは、あなたがただけに届いたのですか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神のことばは、あなたがたのところで始まったのですか。」
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたのところにしか来なかったのですか。」
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: それとも／あるいは
  rationale: 二つの修辞疑問を導く選言の機能を明示し、ギリシア語そのものにない感嘆表現は加えなかった。
- source_word: ἀφ’ ὑμῶν
  choice: あなたがたから
  rationale: ἀπό＋属格が示す起点・源を直接的に保つ。文脈上は「あなたがたを源として」の意味を帯びる。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 福音、使徒的教え、集会における権威ある神の知らせのいずれかに狭めず、表現の広がりを保持する。
- source_word: ἐξῆλθεν
  choice: 出た
  rationale: ἐξέρχομαιの移動・発出の像を保ちつつ、自然な現代日本語にした。「始まった」は含意を明らかにするが、やや解釈的である。
- source_word: εἰς ὑμᾶς μόνους
  choice: あなたがただけに
  rationale: μόνουςの排他的な強調を自然に表し、コリントの人々だけが受領者なのかという叱責を保つ。
- source_word: κατήντησεν
  choice: 届いた
  rationale: καταντάωの「到達する」という意味を簡潔に表す。
theological_decisions:
- issue: 「神のことば」の指示対象
  choice: 「神のことば」と広く訳し、指示対象を限定しない
  alternative: 福音、または集会での預言的発言と明示する
  rationale: 文脈では神からの権威ある知らせと教えが念頭にあるが、語句自体はその一つだけに限定していないため、神学的な幅を残した。
- issue: 第一の疑問が問うもの
  choice: 「あなたがたから出た」と発出の比喩を保持する
  alternative: 「あなたがたのところで始まった」と起源の意味を明示する
  rationale: パウロの修辞的叱責は、コリントの人々が神のことばの源であるかのように振る舞うことを問う。本文では原文の像を保ち、起源の含意を脚注で示した。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。「あなたがた」で共同体全体への呼びかけを示し、二つの修辞疑問の鋭さは保ちながら、原文にない感嘆詞は補わない。脚注標識は該当する各疑問文の直後に置いた。
