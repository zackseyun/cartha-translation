  terminology: 「神のことば」はὁ λόγος τοῦ θεοῦの広がりを保つ定着した表現であり、福音・預言・使徒的教えのいずれかへ不必要に限定していない。「あなたがた」も複数の受け手に適切で、本文の格調と明瞭さの均衡が取れている。
