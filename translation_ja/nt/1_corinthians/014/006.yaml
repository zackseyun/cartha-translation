source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: ja
  text: さて、兄弟たち[a]、もし私があなたがたのところへ行って異言[b]で語るなら、啓示か知識か預言か教えによってあなたがたに語らないかぎり、私はあなたがたにどんな益をもたらすでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語の「兄弟たち」は、男女を含む会衆全体への呼びかけとして用いられることがある。
    reason: lexical_alternative
  - marker: b
    text: 「さまざまな言語」とも訳せる。ここでは、一コリント12―14章を通して論じられている発話現象を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: さて
  rationale: 議論の新しい適用へ移る談話上の転換を、過度な対比を加えず自然な日本語で示す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原語の男性複数形を保つ呼びかけ。パウロが男女を含む会衆全体に呼びかけている可能性は脚注で明示する。
- source_word: γλώσσαις λαλῶν
  choice: 異言で語ったとしても
  rationale: 一コリント12―14章で論じられる霊的発話現象を指す文脈上の用法を示しつつ、その現象の性質を断定しない。
- source_word: τί ὑμᾶς ὠφελήσω
  choice: 何の益になるでしょうか
  rationale: 直訳調の『あなたがたを益する』を避け、聞き手に実益をもたらすかという問いを自然な日本語で表す。
- source_word: ἐὰν μὴ
  choice: ないなら
  rationale: 否定条件を自然な日本語で表し、異言だけでは益にならないという文の論理を保つ。
- source_word: ὑμῖν λαλήσω
  choice: あなたがたに語らない
  rationale: 受け手を明示し、前半の『語る』との語彙的な連続性を保つ。
- source_word: ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ
  choice: 啓示か知識か預言か教えによって
  rationale: 反復されるἢと四つの並列項目を簡潔に保ち、ἐνを発話が益を与える手段・様態として『によって』と訳す。
theological_decisions:
- issue: 会衆への呼びかけἀδελφοίの範囲
  choice: 本文は「兄弟たち」、脚注で男女を含み得ることを示す
  alternative: 兄弟姉妹たち
  rationale: 原語の文法的形を本文に残しつつ、混合会衆全体への代表的呼称という語用論的範囲を隠さない。
- issue: γλώσσαιςの意味
  choice: 異言
  alternative: さまざまな言語
  rationale: 当該章の霊的発話現象を指す慣用的な訳語を用いるが、それが既知の外国語か別種の発話かという論争は解決しない。
- issue: 四つのἐν句の関係
  choice: 啓示・知識・預言・教えを、益を与える発話の手段または様態として訳す
  alternative: 啓示のうちに、知識のうちに、預言のうちに、教えのうちに
  rationale: 日本語の『〜のうちに』は不自然で意味が曖昧になりやすい。『によって』は文脈上の道具・様態の意味を明瞭にする一方、四項相互の厳密な分類関係までは規定しない。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある会衆向けの文体。修辞的な問いを自然にし、四項の並列を簡潔に保った。「異言」は教会用語だが文脈上最も特定性があり、脚注で語義の幅を補った。
