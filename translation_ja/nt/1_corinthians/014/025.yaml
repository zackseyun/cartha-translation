id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: ja
  text: その人の心に隠されていることが明らかになり、こうして彼はひれ伏して神を礼拝し、「神は本当にあなたがたの間におられる」[a]と言い表すでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「神は本当にあなたがたの内におられる」。
    reason: ギリシア語 ἐν ὑμῖν は、共同体の「間に」とも「内に」とも訳し得るため。
lexical_decisions:
- source_word: τὰ κρυπτὰ τῆς καρδίας αὐτοῦ
  choice: その人の心に隠されていること
  rationale: 「心」という聖書的な人体観の語を保ちつつ、実体詞的な複数形 τὰ κρυπτά を自然な日本語で表した。「秘密」よりも、内面に隠れた思いや動機を広く含められる。
- source_word: φανερὰ γίνεται
  choice: 明らかになり
  rationale: γίνεται の変化・成立の意味を保ち、「隠されていること」が表に現れて明白になることを簡潔に表す。
- source_word: καὶ οὕτως
  choice: こうして
  rationale: 心の内が明らかになることから、その後の応答へ至る結果的なつながりを自然に示す。
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ひれ伏して
  rationale: 顔を地につける姿勢を含意する慣用的で自然な表現。続く「礼拝」との重複を抑えながら、身体的な服従の姿勢を伝える。
- source_word: προσκυνήσει τῷ θεῷ
  choice: 神を礼拝し
  rationale: 文脈では単なる敬礼ではなく、神に向けられた宗教的礼拝を指す。身体的動作は直前の「ひれ伏して」で表されている。
- source_word: ἀπαγγέλλων
  choice: と言い表す
  rationale: 目の当たりにした事実を認めて言葉にする意味を自然に伝える。「宣言する」ほど公的・形式的に限定しない。
- source_word: Ὄντως
  choice: 本当に
  rationale: 結論が真実であるとの強い確信を、明瞭な現代日本語で表す。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間に
  rationale: 集まった教会に神が臨在しているという文脈上の共同体的意味を自然に表す。同時に「あなたがたの内に」という可能性を脚注に残す。
theological_decisions:
- issue: 結びの告白における ἐν ὑμῖν の意味
  choice: あなたがたの間に
  alternative: あなたがたの内に
  rationale: 直近の文脈は集まった教会と、そこで行われる預言によって未信者が神の臨在を認める場面であるため、共同体のただ中という意味を本文に採った。ただし、ἐν は内在を表し得るため、その解釈可能性を脚注に保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「その人」は文脈上の未信者・事情を知らない人を指し、性別を不必要に強調しない。「おられる」により、告白の対象である神への敬意を自然に示した。
