  source_fidelity: 本文の「神に感謝します」と「異言で語っています」は、εὐχαριστῶ τῷ θεῷ と γλώσσαις λαλῶ を適切に反映している。しかし、「あなたがたのだれよりも」は各個人との比較を明示し、πάντων ὑμῶν の比較範囲にある程度の解釈を加える。より中立的に「あなたがた皆よりも」とするのがよい。また、現在形を進行相の「語っています」とする必然はなく、単純現在の「語ります」のほうが原文のアスペクトを過度に限定しない。
  naturalness: 「あなたがた皆よりも多く、異言で語ります」は明瞭な現代標準日本語であり、聖書文脈にふさわしい自然な表現である。
  terminology: 「異言」は1コリント12―14章の文脈に定着した用語であり、現象の正体について教義的に決めつけない。脚注の別訳は「さまざまな言語」よりも、原語の複数形を不必要に意味づけない「諸言語」が適切である。
