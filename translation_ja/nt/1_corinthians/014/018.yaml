  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: ja
  text: 私は神に感謝します。私はあなたがた皆よりも多く、異言で語ります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私はあなたがた皆よりも多く、諸言語で語ります」。ギリシア語は「言語」を意味することもありますが、ここではコリント人への手紙第一12―14章を通して論じられている現象を指し、伝統的に「異言」と訳されています。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: 私は…感謝します
  rationale: 現在・能動・直説法一人称単数。日本語では感謝の相手を助詞「に」で示すのが自然で、直接的な陳述を保てる。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: εὐχαριστέωの与格目的語。現代日本語の「神に感謝する」という自然な構文で表した。
- source_word: πάντων ὑμῶν μᾶλλον
  choice: あなたがたのだれよりも多く
  rationale: 比較を表す属格複数と μᾶλλον を、集団内の各人との比較として自然な日本語にした。「あなたがた全員を合わせた以上」という意味にはしない。
- source_word: γλώσσαις
  choice: 異言で
  rationale: コリント人への手紙第一12―14章で論じられる現象の伝統的かつ文脈に即した呼称。「言語で」も語彙上可能だが、現象の性質を人間の諸言語に限定し得るため本文では採らない。
- source_word: λαλῶ
  choice: 語っています
  rationale: 現在・能動・直説法一人称単数。継続的・習慣的な実態を自然な現代日本語で示す。単純形「語ります」も可能だが、この発言では「語っています」がより自然。
theological_decisions:
- issue: γλώσσαις が指す現象の訳し方
  choice: 異言で
  alternative: 言語で
  rationale: 「異言」は12―14章で扱われる賜物を指す文脈上の用語を保ち、それが既知の人間言語なのか、恍惚的発話なのか、より広い現象なのかを本文だけで決着させない。「言語で」は語彙上可能なので脚注に残す。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「異言」は聖書文脈に定着した用語として用いつつ、脚注で語彙上の別訳を示した。比較表現は「全員の合計より多く」と誤解されないよう「だれよりも多く」とした。
