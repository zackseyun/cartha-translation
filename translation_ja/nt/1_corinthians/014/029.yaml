  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: ja
  text: 二人か三人の預言者が語り、ほかの人たちはそれを吟味しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「吟味する」は、「判断する」「見分ける」「評価する」とも訳せる。ギリシア語の動詞は、ここでは預言として語られたことを吟味することを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: 預言者
  rationale: 預言を語る者を指す名詞を直接的に訳した。会衆における発言の規定という文脈にも適合する。
- source_word: δὲ
  choice: （訳語を立てない）
  rationale: ここでは一連の指示の中で緩やかな移行を示す。日本語では接続語を置かないほうが自然であり、不要な対照を持ち込まない。
- source_word: δύο ἢ τρεῖς
  choice: 二人か三人
  rationale: 人数を示す表現をそのまま明確に訳した。
- source_word: λαλείτωσαν
  choice: 語り
  rationale: 三人称複数の命令形。後半の命令と合わせ、「二人か三人が語り」とすることで、日本語として自然な指示の形にした。
- source_word: οἱ ἄλλοι
  choice: ほかの人たち
  rationale: ギリシア語は誰を指すかを明示していないため、ほかの預言者、指導者、会衆全体などに限定せず、原文の曖昧さを保った。
- source_word: διακρινέτωσαν
  choice: その内容を吟味しなさい
  rationale: この文脈では、預言として語られた内容を識別し評価することを表す。「吟味する」は慎重な検討を自然に伝え、断罪という含みを避ける。「その内容を」は日本語で目的語を明確にするために補った。
theological_decisions:
- issue: 「ほかの人たち」が誰を指すか
  choice: 「ほかの人たち」と一般的に訳し、範囲を特定しない。
  alternative: 「ほかの預言者たち」または「会衆のほかの人たち」と明示する。
  rationale: 原文はこの集団を οἱ ἄλλοι とだけ呼び、その構成を明示していない。教会秩序に関する特定の解釈で曖昧さを解消せず、そのまま保った。
- issue: 吟味の対象
  choice: 預言として語られた内容を評価する指示として訳す。
  alternative: 語り手本人を裁く指示として訳す。
  rationale: 文脈上、διακρίνω は預言の発言内容を識別・評価する意味が適切である。ただし動詞が持つ「判断する」「見分ける」という幅は注で示した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、会衆への命令としての端正さを保った。「その内容を」は原文の文脈から補った語であり、原文が明示しない「ほかの人たち」の範囲は限定していない。
