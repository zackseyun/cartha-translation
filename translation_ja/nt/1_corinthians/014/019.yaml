id: 1CO.14.19
reference: 1 Corinthians 14:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: ja
  text: しかし、教会では、異言[a]で一万の言葉を語るよりも、ほかの人たちにも教えるために、自分の知性で五つの言葉を語るほうを望みます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異言」に当たるギリシア語は、直訳すれば「舌」で、「言語」を意味することもある。ここでは、1コリント12―14章を通して論じられている種類の発話を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: 教会では
  rationale: ここでは礼拝のために集まったキリスト者の共同体を指す。「集会では」も可能だが、文脈と現代日本語の聖書用語として「教会では」が自然である。
- source_word: θέλω ... ἢ
  choice: …語るほうを望みます
  rationale: θέλω自体は「望む」だが、ἢで結ばれた対比の中では選好を表す。日本語では「…よりも…ほうを望む」として比較の力を明示した。
- source_word: πέντε λόγους / μυρίους λόγους
  choice: 五つの言葉／一万の言葉
  rationale: 具体的な数字を保ち、五と一万の鮮烈な対比をそのまま伝える。λόγουςはこの数量表現では「言葉」が最も素直である。
- source_word: τῷ νοΐ μου
  choice: 自分の知性で
  rationale: νοῦςの「知性、理解する心」の意味と与格の手段的な働きを簡潔に表す。「理解できる言葉で」と意訳すると、話者自身のνοῦςへの言及が失われるため避けた。
- source_word: λαλῆσαι
  choice: 語る
  rationale: 公の場で言葉を発するという文脈に合い、自然で品位のある日本語である。
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: ほかの人たちをも教えるために
  rationale: κατηχέωは口頭で教え諭すことを表す。「教理教育する」のような後代の専門的含意を持ち込まず、「教える」とした。καίは「も」で保持した。
- source_word: ἐν γλώσσῃ
  choice: 異言で
  rationale: 1コリント12―14章で繰り返される特殊な発話を指す用語として、日本語聖書で通用する「異言」を用いた。ただしγλῶσσαは「舌」または「言語」の意味も持つため、現象の性質を訳文だけで断定しないよう脚注を付した。
theological_decisions:
- issue: 1コリント12―14章におけるγλῶσσαの訳し方
  choice: 異言
  alternative: 言語
  rationale: 本文の特殊な用法を示しつつ、それが通常の外国語なのか別種の発話なのかを説明的な訳語で決めつけない。「異言」を本文に置き、語の幅を脚注で示すことで、原文に残る解釈上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、教会で朗読できる品位を保った。原文の五対一万という修辞的対比を維持し、「異言」の性質について特定の教派的理解を訳文に持ち込まないようにした。英語相談訳では脚注記号が「mind」の後に置かれているが、脚注内容はγλώσσαについてのものなので、日本語本文では対応する「異言」の直後に配置した。
