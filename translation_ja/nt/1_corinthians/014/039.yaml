id: 1CO.14.39
reference: 1 Corinthians 14:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: ja
  text: ですから、私の兄弟たち[a]、預言することを熱心に求めなさい。また、異言を語ることを禁じてはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは女性を含む会衆全体への呼びかけであり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前までの議論を受けて結論的な勧告を導く接続詞として、推論と総括の力を自然な現代日本語で示す。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: μουの親愛を込めた所有表現と、ἀδελφοίの男性複数形を本文で保った。文脈上、会衆全体を含み得ることは脚注で明示する。
- source_word: ζηλοῦτε
  choice: 熱心に求めなさい
  rationale: 現在命令形が表す継続的で積極的な志向を、明快な勧告として表現する。
- source_word: τὸ προφητεύειν
  choice: 預言すること
  rationale: 冠詞付き不定詞が勧告の対象となっている構造を、日本語の名詞化表現で自然に示す。
- source_word: μὴ κωλύετε
  choice: 禁じてはいけません
  rationale: μήを伴う現在命令形の直接的な禁止を保ちつつ、現代日本語として自然で明瞭にした。
- source_word: τὸ λαλεῖν γλώσσαις
  choice: 異言を語ること
  rationale: 本章で論じられてきた宗教的発話を指す定着した訳語「異言」を用い、冠詞付き不定詞の構造も自然に表した。
theological_decisions:
- issue: 男女を含む会衆への呼びかけにおけるἀδελφοίの訳し方
  choice: 本文は「私の兄弟たち」とし、会衆全体を含み得ることを脚注で示す
  alternative: 私の兄弟姉妹たち／皆さん
  rationale: 原文の文法上の男性複数形とμουを本文に残しつつ、この語が混成集団を包括的に指し得るという語用論的な幅を脚注で保存する。
translation_notes:
  register: 明快で格調を保った現代標準日本語。二つの命令を「また」で結び、預言を積極的に求めることと異言を禁じないことの対照を原文どおり保持した。
