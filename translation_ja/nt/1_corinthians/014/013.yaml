id: 1CO.14.13
reference: 1 Corinthians 14:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Διὸ ὁ λαλῶν γλώσσῃ προσευχέσθω ἵνα διερμηνεύῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/013.yaml
  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: ja
  text: ですから、異言で語る人は、それを解き明かせるように祈りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の議論から結論を導く推論的接続詞。論理関係を明確にしつつ、現代日本語として自然である。
- source_word: ὁ λαλῶν
  choice: 語る人
  rationale: 冠詞付き現在分詞を一般的な一人の人として表す。日本語では性別を限定せず、継続的な行為の含みも自然に伝わる。
- source_word: γλώσσῃ
  choice: 異言で
  rationale: 単数与格を副詞的に訳した。『異言』は、この章で解き明かしを必要とする発話を指す用語として文脈上のつながりを保ち、それが既知の人間言語か別種の発話かを決めつけない。
- source_word: προσευχέσθω
  choice: 祈りなさい
  rationale: 三人称現在命令の勧告・命令の力を、明瞭で自然な現代日本語の命令表現で示す。
- source_word: ἵνα
  choice: …できるように
  rationale: 祈りの目的または内容を表す。目的の含みを自然な日本語で保持する。
- source_word: διερμηνεύῃ
  choice: それを解き明かせる
  rationale: 会衆に理解可能な形にする意味を表す。『翻訳する』ほど狭く限定せず、『説明する』ほど広げない。目的語『それを』は日本語で指示対象を明確にする補足である。
theological_decisions:
- issue: γλώσσῃが指す現象
  choice: 異言
  alternative: 言語
  rationale: この章では解き明かしを要する霊的な発話として扱われている。『異言』は文学的・神学的連関を保ちながら、人間の既知言語か恍惚的発話かという論争を本文で決着させない。
- issue: 解き明かす主体
  choice: 異言で語る人自身が解き明かせるように祈る
  alternative: 解き明かしが与えられるように祈る
  rationale: διερμηνεύῃの主語は文法上、直前の『語る人』と取るのが最も自然である。ただし日本語では性別を示す代名詞を用いず、ギリシア語の代表的単数を保った。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える、簡潔で dignified な標準語。『異言』『解き明かす』は第一コリント14章内の用語的一貫性を重視した。
