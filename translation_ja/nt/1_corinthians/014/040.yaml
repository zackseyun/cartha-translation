  text: πάντα ⸀δὲ εὐσχημόνως καὶ κατὰ τάξιν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: ja
  text: ただ、すべてのことを、ふさわしく、秩序正しく行いなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ふさわしく」は、「礼節にかなって」または「品位をもって」とも訳せる。ギリシア語は、その場に適切で、見苦しくないあり方を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: すべてのことを
  rationale: 中性複数の広い範囲を保ち、直前まで論じられてきた集会での営み全般を自然な日本語で表す。
- source_word: δὲ
  choice: ただ
  rationale: 前の議論を受けて総括的な指示へ移る、穏やかな対照・転換を表す。強すぎる逆接は避けた。
- source_word: εὐσχημόνως
  choice: ふさわしく
  rationale: 礼節にかない、その場に適切で、品位あるあり方を示す語。「きちんと」よりも尊厳を保ち、「礼儀正しく」より意味を狭めない。
- source_word: κατὰ τάξιν
  choice: 秩序正しく
  rationale: 正しい配列や順序に従うことを、現代日本語として簡潔に表す。固定的な礼拝式次第までは含意させない。
- source_word: γινέσθω
  choice: 行いなさい
  rationale: 三人称現在命令の一般的な指示を、πάνταを目的語とする自然で明確な日本語の命令として表した。
theological_decisions:
- issue: 集会の文脈における命令の範囲
  choice: 集会で行われるすべてのことについて、ふさわしさと秩序を求める総括的指示として訳す。
  alternative: 固定された特定の礼拝形式を定める規則、または文脈を越えて教会活動全般に直接適用される原則と限定する。
  rationale: 直前の預言や異言など、集会での発言と秩序についての議論を総括している。ギリシア語の一般性を保ちつつ、特定教派の礼拝制度を読み込まない。
translation_notes:
  register: 明快な現代標準日本語で、簡潔かつ荘重な勧告調とした。「ただ」により文脈上の転換を示し、二つの副詞的表現を並列して原文の均衡を保った。
