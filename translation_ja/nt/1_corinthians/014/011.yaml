  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: ja
  text: ですから、もし私がその声の意味[a]を知らなければ、私は話している人にとって異国人[b]となり、話している人も私にとって異国人となります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その声の力」。ここでは、その声が伝える意味や内容を指します。
    reason: lexical_alternative
  - marker: b
    text: 「異国人」に当たるギリシア語は、ここでは主に言葉が通じない人、外国語を話す人という意味であり、必ずしも「野蛮人」という意味ではありません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ですから、もし
  rationale: οὖνの推論的なつながりとἐὰνの条件を、文脈の論理展開が明瞭になる自然な現代日本語で表した。
- source_word: μὴ εἰδῶ
  choice: 知らなければ
  rationale: οἶδαの基本義「知る」を保つ。文脈上は「理解しなければ」も可能だが、「意味を知らない」で十分自然である。
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: その声の意味
  rationale: δύναμιςの字義は「力」だが、ここではφωνήが伝える意義・意味を指す。「声」はφωνήを直接反映し、「意味」は日本語で意図を明瞭にする。
- source_word: τῷ λαλοῦντι
  choice: 話している人にとって
  rationale: 現在分詞の継続的な発話を保ちつつ、与格が示す関係を自然な日本語の「にとって」で表した。
- source_word: βάρβαρος
  choice: 異国人
  rationale: ここでは未開人という軽蔑的意味ではなく、言葉が通じない外国語話者として互いに異質であることを表すため、「異国人」とした。
- source_word: ἐν ἐμοὶ
  choice: 私にとって
  rationale: 話し手との相互的な関係を示す慣用的表現として、前半と対応する自然な日本語にした。
