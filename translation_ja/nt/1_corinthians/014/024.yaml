id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: ja
  text: しかし、皆が預言をするなら、信じていない人、あるいは集会のことをよく知らない人[a]が入って来ると、その人は皆から誤りを示され、皆から吟味されます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部外者」とも訳せる。ギリシア語は、その集会の実践についてよく知らない人、十分に理解していない人、または集会の一員でない人を指すことがある。
    reason: ἰδιώτηςには知識・習熟の不足という意味と、集団の外部者という含みの両方があり得るため。
lexical_decisions:
- source_word: πάντες
  choice: 皆
  rationale: 集会で預言する人々全体を指す包括的な表現として、簡潔に訳した。後半の反復とも対応させた。
- source_word: προφητεύωσιν
  choice: 預言をしている
  rationale: この章でパウロが用いる一貫した概念を保ち、単なる説教や霊感を受けた発言と限定しないため、「預言」とした。
- source_word: ἄπιστος
  choice: 信じていない人
  rationale: ここでは不誠実な人ではなく、信仰を持たない人を指す。現代日本語で直接的かつ自然な表現を選んだ。
- source_word: ἰδιώτης
  choice: 事情を知らない人
  rationale: 集会で行われていることについて知識や理解のない人という文脈上の意味を表しつつ、必ずしも共同体の完全な外部者だとは断定しない表現とした。別訳の可能性は脚注に示した。
- source_word: ἐλέγχεται
  choice: 罪を自覚させられ
  rationale: 語られる預言によって、その人の内面や誤りが明るみに出され、責めを認識するという文脈上の力を表した。単なる叱責にも最終的な断罪にも限定しない。
- source_word: ἀνακρίνεται
  choice: 吟味されます
  rationale: 詳しく調べ、評価するという意味を保ち、「裁かれる」として最終的な有罪判決の含みを強めすぎないようにした。
- source_word: ὑπὸ πάντων
  choice: 皆によって
  rationale: ギリシア語の受動表現と二度の反復を保ち、預言する者たち全体を通して作用が及ぶことを示した。
- source_word: δέ
  choice: しかし／（無標）
  rationale: 最初のδέは前節との対照を示す「しかし」とし、二つ目は条件節内の自然な日本語構文によって表した。
- source_word: τις
  choice: 人
  rationale: 「信じていない人か、事情を知らない人」という不定の人物として自然に表し、特定人物を指す印象を避けた。
theological_decisions:
- issue: 集会の文脈におけるἰδιώτηςの意味
  choice: 「事情を知らない人」と訳した。
  alternative: 「部外者」「不案内な人」「素人」
  rationale: 直前からの論点は集会の発言が理解できるかどうかであり、ここでも必要な知識や習熟のない人という意味を中心に据えた。ただし、その人物が共同体外の人である可能性も排除せず、脚注に別訳を残した。
- issue: ἐλέγχεταιが表す作用
  choice: 「罪を自覚させられ」と訳した。
  alternative: 「誤りを示される」「責められる」「明るみに出される」
  rationale: 預言によって内面が露呈し、本人が道徳的・霊的な責めを認識する流れを表した。単なる説得や外面的な叱責に狭めない一方、法廷的な有罪宣告とも断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、集会での預言というパウロの用語を保持した。「皆によって」の反復は原文の修辞を反映して残し、文末は本文として落ち着いた丁寧体に整えた。
