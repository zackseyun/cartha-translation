source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: ja
  text: 自分は預言者である、あるいは霊的な者であると思う人は、私があなたがたに書いていることが主からのものであることを認めなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主の命令である」。ギリシア語は直訳すると「主のものである」または「主に属する」であり、「命令」という語は提示された本文にはない。ただし、文脈上その意味を補って訳すことができる。
    reason: 原文の省略的な属格表現を本文の「主からのものである」で自然に表しつつ、文脈に基づく補足訳「主の命令である」を示すため。
lexical_decisions:
- source_word: δοκεῖ
  choice: 自分は…であると思う
  rationale: ここでは預言者または霊的な者だという自己認識・自認を表す。文脈にある批判的な含みを残しつつ、現代日本語として自然にした。
- source_word: προφήτης
  choice: 預言者
  rationale: 預言と霊の賜物を扱う文脈における標準的で明瞭な訳語。
- source_word: πνευματικός
  choice: 霊的な者
  rationale: 霊に属する者、または霊的な賜物を受けた者という幅を保ち、原文の簡潔さと曖昧さを不用意に限定しない。
- source_word: ἐπιγινωσκέτω
  choice: 認めなさい
  rationale: 単なる知識ではなく、パウロが書くことの権威を認識し承認するよう求める現在命令形の力を表す。
- source_word: ἃ γράφω ὑμῖν
  choice: 私があなたがたに書いていること
  rationale: 現在形と関係節を自然な現代日本語で表した。
- source_word: κυρίου ἐστίν
  choice: 主のものである
  rationale: 原文には「命令」に当たる名詞が明記されていないため、属格を補足しすぎずに訳し、主に由来すること・主に属することという圧縮された表現を保った。
theological_decisions:
- issue: κυρίου ἐστίν の省略的な属格表現
  choice: 「主のものである」と訳す
  alternative: 「主の命令である」
  rationale: 文脈上、パウロの指示が主の権威を帯びるという意味は強いが、ギリシア語本文には「命令」という名詞がない。「主のもの」として本文の曖昧さを残し、文脈的な補足訳を脚注に示した。
- issue: τις … προφήτης … πνευματικός の性と一般性
  choice: 「人」「その人」を用いる
  alternative: 男性を明示する訳
  rationale: ギリシア語は文法上男性単数だが、不定代名詞 τις による一般的な個人への言及である。日本語では「人」が性を不必要に付加せず、原文の一般性を自然に表す。
- issue: πνευματικός における霊／御霊の含み
  choice: 「霊的な者」
  alternative: 「御霊に導かれた者」「霊の賜物を受けた者」
  rationale: 聖霊との関係が文脈上想定されうる一方、語自体はより広い意味を持ちうるため、解釈を一つに固定しない訳とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「認めなさい」により勧告ではなく命令の力を示した。原文にない「命令」を本文では補わず、脚注で有力な文脈的解釈として提示した。
