id: 1CO.14.38
reference: 1 Corinthians 14:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγνοεῖ, ⸀ἀγνοεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/038.yaml
  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: ja
  text: しかし、だれかがこれを認めないなら、その人も認められません。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これを認めない」は、「これを知らない」または「これを承認しない」とも訳せます。ギリシア語では、「認めない」と「認められない」に同じ動詞の能動形と受動形が用いられています。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「だれかが知らないなら、そのまま知らないでいなさい」とあります。ここで採用した本文は、「だれかが認めないなら、その人も認められません」となっています。
    reason: textual_variant
lexical_decisions:
- source_word: εἰ δέ
  choice: しかし、…なら
  rationale: 条件を示す「εἰ」と、直前の主張に対する対照を示す「δέ」を、自然な現代日本語で表した。
- source_word: τις
  choice: だれかが
  rationale: 特定されない一人を一般的に指す語であり、文脈に即して自然に表した。
- source_word: ἀγνοεῖ
  choice: 認めない
  rationale: 14章37節の「認める」とのつながりを保ち、単に知らないことだけでなく、使徒の言葉を承認・承知しないという含みも表せる。目的語「これ」は文脈から補った。
- source_word: ἀγνοεῖται
  choice: 認められません
  rationale: 受動態を保ち、同じ動詞の能動形と受動形による修辞的対応を日本語でも「認めない／認められない」と再現した。行為者が神か共同体かは明示せず、原文の余地を残した。
theological_decisions:
- issue: 受動形 ἀγνοεῖται の意味と行為者
  choice: 「その人も認められません」
  alternative: 「その人も顧みられません」「その人は知られていません」
  rationale: 採用本文は受動直説法であり、命令形ではない。拒んで認めない者が自らも認められないという対応を保ちつつ、誰によって認められないのかを限定しないことで、神による判断と共同体における扱いの双方を過度に決めつけない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「認めない／認められません」の反復により原文の簡潔な警告と語の対応を保った。丁寧体の文末を用い、聖書本文として読みやすくした。
