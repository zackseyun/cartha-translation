  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: ja
  text: 皆が学び、皆が励まされるように、あなたがたは皆、一人ずつ預言することができるのです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「順番に」または「一度に一人ずつ」。
    reason: lexical_alternative
  - marker: b
    text: 「励まされる」と訳したギリシア語は、文脈により「勧めを受ける」または「慰められる」という意味にもなりうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: することができます
  rationale: 現在形の能力・可能性を表す。文脈上、許可よりも実行可能性を示す自然な現代日本語とした。
- source_word: γὰρ
  choice: （独立した訳語を置かず、説明関係を文脈に委ねる）
  rationale: 直前の指示を根拠づける接続辞。単独節として自然な日本語にするため「というのは」などを補わず、説明のつながりを保った。
- source_word: καθ’ ἕνα
  choice: 一人ずつ
  rationale: 順番に一人ずつ、すなわち同時ではなく一人の後に一人が語ることを表す慣用句。
- source_word: πάντες
  choice: 皆
  rationale: 原文で三度繰り返される語を同じ「皆」で再現し、それぞれの範囲を訳文で狭く限定しない。
- source_word: προφητεύειν
  choice: 預言する
  rationale: パウロが用いるカテゴリーを説明的に狭めず、定着した聖書用語で表した。
- source_word: ἵνα
  choice: それは〜ためです
  rationale: 目的または意図された結果を示す節として、明瞭で自然な日本語にした。
- source_word: μανθάνωσιν
  choice: 学び
  rationale: 一般的な学習・理解の意味を保ち、「教えを受ける」などの解釈的な限定を避けた。
- source_word: παρακαλῶνται
  choice: 励まされる
  rationale: 受動形を保持した。παρακαλέωが持ちうる勧告・慰めの含みも注で示しつつ、集会を築き上げる文脈に最も広く適合する語を本文に採った。
theological_decisions:
- issue: 集会への指示における πάντες（「皆」）の範囲
  choice: 三箇所とも「皆」と訳し、対象を明示的に限定しない。
  alternative: 最初を「あなたがたは皆」または「預言者は皆」、後二つを「全員」と解釈的に区別する。
  rationale: 最初の πάντες は預言できる者たち、後二つは集会の参加者・聞き手を指す可能性が高いが、ギリシア語自体は同じ語を反復している。訳文でもその反復と範囲の余地を保った。
- issue: παρακαλῶνται の意味の幅
  choice: 本文では「励まされる」とする。
  alternative: 「勧めを受ける」または「慰められる」とする。
  rationale: 語は文脈により励まし、勧告、慰めを表しうる。ここでは預言によって集会全体が建て上げられる広い効果を示す「励まされる」を選び、他の可能性を注記した。
translation_notes:
  register: 明瞭な現代標準語を用い、「預言」は神学的カテゴリーを保つため定着した聖書語彙とした。原文の πάντες の三度の反復を「皆」で保持しつつ、日本語の文として落ち着いた、集会での朗読にも適する文体に整えた。
