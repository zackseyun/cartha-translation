review_pass:
  verdict: revise
  source_fidelity: 本文は列挙（各人が詩編、教え、啓示、異言、解き明かしを持つ）と、すべてをοἰκοδομήへ向ける命令を概ね正確に伝えています。「異言」はこの文脈のγλῶσσαに適切であり、脚注も語の射程を不当に限定していません。ただし「造り上げるために」は日本語では目的語なしに不自然で、οἰκοδομήが指す共同体の建て上げ・育成という機能が十分に伝わりません。
  naturalness: 「一人一人に、詩編があり」という構文は理解できるものの、ややぎこちないため、「一人一人が、詩編を持ち…」とすると、ἕκαστοςと反復されるἔχειの対応が明瞭になります。終文は「皆を育てるために」として、現代標準日本語として自然で、文脈上含意される共同体的対象を表せます。
  terminology: 「兄弟たち」は原文の呼びかけを保持しており、女性を含む会衆への呼びかけである旨の脚注も適切です。「詩編」「教え」「啓示」「異言」「解き明かし」はいずれも文脈に合っています。「皆を育てる」はοἰκοδομήの比喩を逐語的に再現する語ではありませんが、明瞭な現代日本語で共同体を強める意味を伝えます。
  issues:
