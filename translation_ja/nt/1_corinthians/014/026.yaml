reference: 1 Corinthians 14:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: ja
  text: では、兄弟たち[a]、どういうことになるのでしょうか。あなたがたが集まるとき、各自が、詩編を持ち、教えを持ち、啓示を持ち、異言[b]を持ち、解き明かしを持っています。すべてのことが、皆を育てるために行われるようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は、男性だけでなく女性も含む会衆全体への呼びかけです。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「舌」。このギリシア語は「言語」を意味することもありますが、ここではこの章で論じられている発話を指す語として「異言」と訳しました。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: では、どういうことになるのでしょうか
  rationale: 直前の議論を受けて実践的な結論へ移る修辞疑問として、ギリシア語の問いの形を保ちつつ自然な現代日本語にした。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文に残し、この呼びかけが女性を含む会衆全体に向けられていることを脚注で明示した。
- source_word: ὅταν συνέρχησθε
  choice: 皆さんが集まるとき
  rationale: 会衆が集まる反復的な場面を、明瞭で自然な日本語で表した。
- source_word: ἕκαστος
  choice: 一人一人に
  rationale: 各人に関わる分配的な意味を明確にし、後続する項目とのつながりを保った。
- source_word: ψαλμὸν
  choice: 詩編
  rationale: 一般的な「歌」へ広げず、ψαλμόςの具体性と聖書的な語感を保った。
- source_word: διδαχὴν
  choice: 教え
  rationale: 会衆における教示を指す、簡潔で現代的な訳語を選んだ。
- source_word: ἀποκάλυψιν
  choice: 啓示
  rationale: 集会で与えられる開示を表す標準的かつ透明性の高い訳語である。
- source_word: γλῶσσαν
  choice: 異言
  rationale: コリント第一12―14章で論じられる発話現象を指す定着した訳語であり、それが既知の人間言語か他の発話かを本文だけで決めない。
- source_word: ἑρμηνείαν
  choice: その解き明かし
  rationale: 異言を会衆に理解できるようにする働きを文脈に即して表した。「その」を補い、異言との関係を自然な日本語で明確にした。
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: すべては、造り上げるために行われるようにしなさい
  rationale: οἰκοδομήの建築比喩と、共同体を益し強める目的を保ちながら、命令の力を明確に表した。原文に明示されない目的語は本文で補わなかった。
theological_decisions:
- issue: 会衆への男性複数形による代表的呼びかけ
  choice: 本文では「兄弟たち」とし、包括的な指示対象を脚注で説明する
  alternative: 兄弟姉妹たち
  rationale: 原文の文法形式を保つ一方、文脈上は女性も含む会衆全体への呼びかけであることを明示するため。
- issue: γλῶσσαが指す現象
  choice: 異言
  alternative: 言語
  rationale: この章における専門的な用法を示しつつ、それが既知の言語、恍惚的発話、またはより広い範疇のいずれかを訳文で断定しないため。
- issue: οἰκοδομήの対象
  choice: 目的語を補わず「造り上げるため」とする
  alternative: 教会を造り上げるため／互いを造り上げるため
  rationale: 文脈上は会衆全体の強化を意味するが、原文が目的語を明示していないため、その含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、会衆への教えにふさわしい落ち着いた品位を保った。列挙の反復と最後の命令を生かし、原文の修辞的な流れを維持した。
