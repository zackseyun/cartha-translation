  rationale: 三人称単数命令の連続を「その人は…黙り、…語るようにしなさい」として日本語で一貫して表した。「通訳する人」によりδιερμηνευτήςの機能を明瞭にしつつ、「自分自身に、また神に」という原文の並列と、発話の具体的な様態に関する曖昧さを保持した。
