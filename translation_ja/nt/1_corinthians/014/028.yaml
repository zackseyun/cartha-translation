review_pass:
  verdict: revise
  source_fidelity: 本文の条件、会衆内での沈黙、自分自身と神に語るという対照は適切に捉えている。ただし、διερμηνευτήςには「通訳する人」のほうが直接的で明瞭であり、異言の発言を会衆に理解可能にする役割を過不足なく表せる。
  naturalness: 「その人は…黙っていて、自分自身と神に語りなさい」は、主語が三人称であるのに後半が二人称命令となっており、日本語として視点が不整合である。三人称への指示として一貫させる必要がある。
  terminology: ἐκκλησίᾳを「教会の集まり」とするのは、建物ではなく集まった会衆という文脈を明確にしており適切である。「通訳する人」は本節のδιερμηνευτήςに自然で中立的な現代語である。
  issues:
  - severity: medium
    issue: 人称・命令形式の不整合
    rationale: ギリシャ語のσιγάτωとλαλείτωはいずれも三人称単数命令である。現行訳は「その人は」と三人称で始めながら「語りなさい」と二人称命令へ移るため、文法的・文体的に不自然である。
  - severity: low
    issue: 「解き明かす人」はδιερμηνευτήςの訳としてやや間接的
    rationale: この語は発話を他者に理解できるようにする通訳者を指す。「通訳する人」は役割をより直接的に示し、特定の教理的解釈を加えない。
  revised_text: しかし、通訳する人がいなければ、その人は教会の集まりでは黙り、自分自身に、また神に語るようにしなさい。
