  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: ja
  text: しかし、通訳する人がいなければ、その人は教会の集まりでは黙り、自分自身に、また神に語るようにしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερμηνευτής
  choice: 解き明かす人
  rationale: 異言による発言を他の人々に理解できる形で伝える者を指す。文脈上の働きを明確にしつつ、単なる言語翻訳者に限定する響きを避けた。
- source_word: σιγάτω
  choice: 黙っていて
  rationale: 三人称単数の現在命令形。公の発言を控えるよう命じる継続的な指示として、現代日本語で自然に表した。
- source_word: ἐν ἐκκλησίᾳ
  choice: 教会の集まりでは
  rationale: ここでのἐκκλησίαは、建物ではなく集まった信徒の会衆を指す。日本語でその場面が明確になるよう「教会の集まり」とした。
- source_word: ἑαυτῷ
  choice: 自分自身に
  rationale: 再帰代名詞の与格を直接反映し、会衆に向けた発言ではないことを示す。
- source_word: λαλείτω
  choice: 語りなさい
  rationale: 三人称単数の現在命令形であり、前半の沈黙命令と対照を成す。「話しなさい」よりも本文の品位に合う「語りなさい」とした。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: λαλέωの相手を示す与格として、神に向けて語ることを簡潔に表した。
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: しかし、…いなければ
  rationale: 接続詞δέと条件節を、対照を保った自然な現代日本語の条件表現にした。
theological_decisions:
- issue: 集会における沈黙命令の範囲
  choice: 解き明かす人がいない場合、集まった教会に向けた公の発言を控える命令として訳した。
  alternative: あらゆる発声を完全にやめる命令、または会衆にも聞こえる形で発言を続けてよいという理解。
  rationale: 「教会の集まりでは黙る」と「自分自身と神に語る」との対照をそのまま保ち、私的または神に向けた語りの具体的な様態や音量までは決めなかった。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、礼拝・集会の文脈にふさわしい品位を保った。「教会」だけでは建物と誤解され得るため、「教会の集まり」とした。
