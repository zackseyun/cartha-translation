id: 1CO.14.30
reference: 1 Corinthians 14:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: ja
  text: しかし、座っている別の人に啓示が与えられたなら[a]、先に語っている人は黙りなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「座っている別の人に何かが明らかにされたなら」。
    reason: lexical_alternative
  - marker: b
    text: すなわち、先に語っている人は、もう一人が語れるように話すのをやめる。
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: しかし、…なら
  rationale: ἐὰνの条件を「…なら」で、δὲの穏やかな対照・展開を「しかし」で表した。
- source_word: ἄλλῳ
  choice: 別の人に
  rationale: 現在語っている人とは異なる集会参加者を指す与格であり、現代日本語として自然に表した。
- source_word: ἀποκαλυφθῇ
  choice: 啓示が与えられた
  rationale: 受動形の意味を保ちつつ、文脈上含意される啓示という出来事を名詞で補った。啓示を与える主体は本文に明記されていないため、訳でも明示しない。
- source_word: καθημένῳ
  choice: 座っている
  rationale: ἄλλῳを修飾する現在分詞であり、集会の中で座っている姿をそのまま表した。
- source_word: ὁ πρῶτος
  choice: 先に語っている人
  rationale: 直訳は「最初の人」だが、文脈では先に発言している預言者を指すため、指示対象が普通の読者に明確になるようにした。
- source_word: σιγάτω
  choice: 黙りなさい
  rationale: 三人称命令の力を簡潔に保った。この文脈では、他の人に発言を譲るため話すのをやめることを意味する。
theological_decisions:
- issue: 集会における啓示の出来事とその主体
  choice: 「啓示が与えられた」と受動で訳し、与える主体を明示しない。
  alternative: 「神から啓示を受けた」または「何かが明らかにされた」
  rationale: 文脈上、啓示の源が神であることは含意されるが、この節自体は主体を明記していない。原文の抑制と、動詞だけで表された内容の幅を保つためである。
- issue: 「最初の人」の指示対象
  choice: 文脈に即して「先に語っている人」とする。
  alternative: 「最初の人」または「先の人」
  rationale: 預言者たちが順に語るという直前の文脈では、先に発言中の人を指す。役職や恒久的な優先順位を意味するとの誤解を避ける。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、集会への使徒的指示にふさわしい端正さを保った。「啓示」は文脈上必要な神学語として維持し、命令は過度に威圧的にならない自然な「黙りなさい」とした。
