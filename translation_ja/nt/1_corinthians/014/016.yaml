id: 1CO.14.16
reference: 1 Corinthians 14:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: ja
  text: そうでなければ、あなたが霊で[a]祝福を語るなら、一般の人[b]の立場にいる者は、あなたの感謝[c]に対して、どうして「アーメン」と言えるでしょうか。あなたが何を言っているのか、その人には分からないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊において」または「霊とともに」とも訳せる。ここで人の霊を指すのか、聖霊による働きを指すのかは、ギリシア語だけでは限定されない。
    reason: alternative_reading
  - marker: b
    text: 「部外者」「教えを受けていない人」「専門でない人」とも訳せる。ここでは、その発話を理解して応答できない人を指すが、共同体の外部者か内部の未習熟者かは限定されない。
    reason: lexical_alternative
  - marker: c
    text: ここでの「感謝」は、神に感謝をささげる発話を指し、後代の専門用語としての「聖餐」を必ずしも意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: そうでなければ、……ても
  rationale: 前節までの議論を受けて、そのままでは生じる問題を条件的に示す表現。日本語では「そうでなければ」で推論・修正の力を示し、「……ても」で条件場面を自然に表した。
- source_word: εὐλογῇς
  choice: 祝福をささげる
  rationale: 礼拝における発声された祝福を指す。「祝福する」だけでは他者を祝福する意味に限定されやすいため、「祝福をささげる」として神に向けた発話にも適合させた。
- source_word: πνεύματι
  choice: 霊によって
  rationale: 与格の手段的な含みを自然な日本語で表しつつ、人間の霊か、聖霊によって可能にされた発話かを特定しない。別の捉え方は脚注に示した。
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: 事情を知らない人の立場にいる者
  rationale: 「場所を満たす」というギリシア語の慣用表現を、日本語で理解できる「立場にいる」とした。ἰδιώτηςは、この発話を理解するための知識や経験を持たない者として文脈的に表現した。
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: どうして「アーメン」と言えるでしょうか
  rationale: 会衆が同意を示す応答としての「アーメン」を保持し、修辞疑問を自然な日本語にした。
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: あなたの感謝の祈りに
  rationale: ここでのεὐχαριστίαは感謝を表す発話である。「感謝」だけより場面が明確になるよう「感謝の祈り」としたが、後代の専門用語としての「聖餐」を持ち込んでいない。
- source_word: τί λέγεις οὐκ οἶδεν
  choice: あなたが何を言っているのか、その人には分からない
  rationale: 直訳的な「知らない」より、この文脈の要点である発話の理解不能を明瞭かつ自然に表した。
theological_decisions:
- issue: πνεύματιが人間の霊を指すか、聖霊による働きを指すか
  choice: 「霊によって」とし、指示対象を限定しない
  alternative: 「自分の霊で」「御霊によって」「霊において」
  rationale: 本文だけでは指示対象を一義的に決められないため、カリスマ的発話について特定の神学的理解を訳文に持ち込まず、曖昧さを保った。
- issue: εὐχαριστίαの意味
  choice: 感謝の祈り
  alternative: 感謝、聖餐
  rationale: 直近の文脈は会衆が「アーメン」と応答する感謝の発話を扱う。後代の聖餐を指す専門用語に限定する根拠はない。
- issue: ἰδιώτηςの共同体内での位置づけ
  choice: 事情を知らない人
  alternative: 部外者、一般の人、教えを受けていない人
  rationale: 専門知識や理解を欠く人という意味を中心に据えたが、その人が共同体の外部者か内部の未習熟者かは断定しなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用い、礼拝の場面にふさわしい品位を保った。「アーメン」は日本語の教会用語として定着しているため音写を保持した。「事情を知らない人」は侮蔑的に響きやすい「無知な人」を避けつつ、ἰδιώτηςの幅を脚注で補った。
