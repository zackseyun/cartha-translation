id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: ja
  text: 私は、あなたがた全員に異言を語ってほしいと思います。しかし、それ以上に、預言してほしいのです。預言する人は、異言を語る人よりも優れています。ただし、その人が解き明かす場合は別です。[a] それは、教会が造り上げられるためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれかが解き明かす場合は別です」とも訳せます。ギリシア語の単数動詞は、異言を語る本人を指すとも、文脈上、解き明かしがだれかによって行われることを指すとも理解できます。
    reason: alternative_reading
  - marker: b
    text: 「造り上げられる」とは、集まっている教会が霊的な益を受け、強められることを意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: ほしいと思います
  rationale: パウロ自身の率直な願いを、現代日本語として自然に表す。命令ではなく願望であることも保つ。
- source_word: πάντας ὑμᾶς
  choice: あなたがた全員に
  rationale: 二人称複数と、その全員を含む意味を明示する。
- source_word: λαλεῖν γλώσσαις
  choice: 異言を語る
  rationale: 一コリント12～14章の文脈で定着した表現を用い、γλῶσσα の特殊な発話を指す用法を保つ。
- source_word: μᾶλλον δὲ
  choice: しかし、それ以上に
  rationale: 異言を否定するのではなく、預言をより強く望むという比較と対照を表す。
- source_word: ἵνα προφητεύητε
  choice: 預言してほしい
  rationale: θέλω に続く願いの内容を、自然な日本語で明確にする。
- source_word: μείζων
  choice: よりも優れています
  rationale: 比較の強さを保ちつつ、文脈が示す会衆への有益さという意味を自然に表せる。個人の本質的価値や霊性の序列とは訳文だけで断定しない。
- source_word: ὁ προφητεύων
  choice: 預言する人
  rationale: 冠詞付き分詞による一般的な人物指示を簡潔に表す。
- source_word: ὁ λαλῶν γλώσσαις
  choice: 異言を語る人
  rationale: 前句と並行する一般的な人物指示を維持する。
- source_word: ἐκτὸς εἰ μὴ
  choice: ただし、…場合は別です
  rationale: 例外条件を明瞭で自然な日本語にする。
- source_word: διερμηνεύῃ
  choice: その人が解き明かす
  rationale: 直前の単数主語である異言を語る人を最も自然な指示対象とし、章全体で用いられる異言の内容を理解可能にする行為を「解き明かす」と表す。別人が行う可能性は脚注に残す。
- source_word: ἡ ἐκκλησία
  choice: 教会
  rationale: ここでは集まっているキリスト者共同体を指す、パウロ書簡で一般的な訳語を用いる。
- source_word: οἰκοδομὴν λάβῃ
  choice: 造り上げられる
  rationale: 直訳的な「建て上げを受ける」より自然でありながら、共同体が霊的な益を受けて強められる建築比喩を保つ。
theological_decisions:
- issue: 預言する人が異言を語る人より「大きい」という比較
  choice: 「よりも優れています」とし、比較そのものを本文に残す
  alternative: 「教会にとってより有益です」と機能面を本文で明示する
  rationale: 直後の目的節は教会を造り上げる働きが比較の焦点であることを示すが、本文で「有益さ」だけに限定して原文の比較表現を解消しない。
- issue: διερμηνεύῃ の主語
  choice: 直前の「異言を語る人」を受けて「その人が解き明かす」とする
  alternative: 「だれかが解き明かす」または「解き明かしがなされる」
  rationale: 明示された新しい主語がなく、単数動詞は直前の単数の人物を自然に受ける。一方、章全体では別の人による解き明かしも可能なので、別解を脚注で保存する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、教会朗読にも耐える落ち着いた文体とした。「異言」「預言」「解き明かす」「教会」は当該文脈で広く理解される用語として保持した。
