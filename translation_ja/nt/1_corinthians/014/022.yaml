id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: ja
  text: したがって、異言[a]は、信じる人たちのためではなく、信じない人たちのためのしるし[b]です。一方、預言は、信じない人たちのためではなく、信じる人たちのためのものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸言語」。ギリシア語は「言語」を意味することもありますが、ここではその現象の性質を特定せず、この章で用いられる「異言」という語を保っています。
    reason: lexical_alternative
  - marker: b
    text: 直前のイザヤ書28章11―12節の引用を踏まえ、この「しるし」を裁きのしるしと理解する見方もあります。
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: したがって
  rationale: 直前の議論から導かれる結論を示す推論的な接続語として、明瞭で自然な現代日本語を用いた。
- source_word: γλῶσσαι
  choice: 異言
  rationale: コリントの信徒への手紙一12―14章で定着した用語を保ち、それが外国語か恍惚的発話かという論争を本文で決着させない。
- source_word: εἰς σημεῖόν
  choice: しるしのため
  rationale: εἰςの目的・結果の含みを保ちつつ、日本語の文脈では「～のためのしるし」と自然に構成した。
- source_word: τοῖς πιστεύουσιν
  choice: 信じる人たち
  rationale: 実詞的分詞の動詞的な意味を明示し、「信者」よりも原文の表現に近く、平明にした。
- source_word: τοῖς ἀπίστοις
  choice: 信じない人たち
  rationale: πιστεύουσινとの明確な対照を保ち、「不信者」より一般読者に分かりやすくした。
- source_word: προφητεία
  choice: 預言
  rationale: この章における預言の賜物・活動を表す、直接的で定着した訳語である。
- source_word: δὲ
  choice: 一方
  rationale: 異言と預言の対照を、過度に強い逆接にせず自然に示す。
theological_decisions:
- issue: カリスマ的文脈におけるγλῶσσαιの意味
  choice: 「異言」と訳し、その現象を特定しない。
  alternative: 「諸言語」または「恍惚的発話」
  rationale: 原語と文脈だけでは現象の厳密な性質を一義的に確定できないため、教派的な解釈を持ち込まず、定着した包括的用語を用いた。
- issue: 信じない人たちに対するσημεῖονの性格
  choice: 中立的に「しるし」と訳す。
  alternative: 「確証のしるし」または「裁きのしるし」
  rationale: 直前のイザヤ書引用から裁きの意味を読む余地はあるが、本文自体は性格を明示しないため、神学的な緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「信者／不信者」という名詞化を避けて「信じる人たち／信じない人たち」とし、原文の対照を見えやすくした。「しるし」は聖書語として自然でありつつ、正負いずれの意味にも限定しない。
