id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: ja
  text: 女性たち[a]は教会の集会で黙っていなさい。彼女たちが語ることは許されていません[b]。むしろ、律法[c]も言っているとおり、従順でありなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「妻たちは教会の集会で黙っていなさい」とも訳せる。ギリシア語の「女性」は、文脈によって「妻」を意味する。
    reason: alternative_reading
  - marker: b
    text: この節自体は、どのような種類の発言を指すのかを特定していない。周囲の文脈から、より限定的な発言を指すと理解する見方もある。
    reason: lexical_alternative
  - marker: c
    text: 「律法」がモーセ律法を特に指すのか、より広く聖書を指すのかについては、解釈が分かれる。また、原文は誰または何に従順であるのかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: 女たち
  rationale: γυνήは「女」と「妻」のどちらも意味し得るが、この節自体には夫への明示的言及がないため、本文ではより広い「女たち」とし、「妻たち」の可能性を脚注に残した。
- source_word: ἐκκλησίαις
  choice: 教会の集まり
  rationale: ἐκκλησίαは教会共同体とその集会の双方を指し得る。ここではἐνと複数形、および礼拝秩序を扱う文脈から、場所としての建物ではなく集まった会衆であることが明瞭になるよう訳した。
- source_word: σιγάτωσαν
  choice: 黙っていなさい
  rationale: 現在命令形の継続的な沈黙・発言の抑制を、同章での用法にも沿う自然な日本語で表した。
- source_word: ἐπιτρέπεται
  choice: 許されていません
  rationale: 非人称的な受動表現による許可の否定を保ち、許可する主体を本文に補わなかった。
- source_word: λαλεῖν
  choice: 語ること
  rationale: λαλέωは広く発話を表すため、発言の種類を限定しない「語る」を採用した。何を語ることかは本文だけでは特定されない。
- source_word: ὑποτασσέσθωσαν
  choice: 従っていなさい
  rationale: 現在中・受動命令形が表す服従の姿勢を自然な現代日本語で示した。誰または何に従うかはギリシア語本文に明示されないため補わなかった。
- source_word: νόμος
  choice: 律法
  rationale: 定冠詞付きのὁ νόμοςに対応する慣用的な聖書用語として「律法」を用いた。ただし、モーセ律法を特定しているのか、より広く聖書を指すのかは脚注で曖昧さを示した。
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: 律法も言っているとおり
  rationale: καθώςの比較とκαίの付加的な力をともに保った。
theological_decisions:
- issue: γυναῖκεςの指示対象
  choice: 集会にいる女たち
  alternative: 集会にいる妻たち
  rationale: 語そのものは両義的だが、この節は夫を明示しないため、本文では広い意味を採用し、狭い可能性を脚注に示した。
- issue: 語ることへの制限の範囲
  choice: 本文では発言の種類を限定しない
  alternative: 無秩序な発言、または預言を吟味する発言に限る
  rationale: この節のλαλεῖνは単に「語る」と述べる。周辺文脈による限定には議論があるため、その解釈を本文へ織り込まなかった。
- issue: ὑποτασσέσθωσανの服従対象
  choice: 対象を補わない
  alternative: 夫、男性、教会秩序、または律法に従う
  rationale: 動詞に明示的な補語がなく、対象の特定は解釈を伴うため、原文の省略を保った。
- issue: ὁ νόμοςの指示範囲
  choice: 律法
  alternative: モーセ律法、またはより広く聖書
  rationale: パウロが念頭に置く具体的箇所や範囲はこの節に明記されないため、訳文では特定せず脚注で可能性を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「教会の集まり」により建物ではなく会衆の集会であることを示した。命令形は文脈上の勧告的な三人称命令を日本語の「〜なさい」で自然に表現した。原文が限定しない発言の種類、服従の対象、律法の範囲は本文で解消せず、脚注で透明性を確保した。
