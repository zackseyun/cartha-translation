  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: ja
  text: 確かに、あなたはよく感謝をささげています。しかし、ほかの人は建て上げられることがありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「建て上げられる」は、共同体の中で益を受け、強められることを表す建築の比喩。
    reason: metaphor_clarification
lexical_decisions:
- source_word: σὺ
  choice: あなた
  rationale: 二人称単数の直接的な呼びかけを明示した。
- source_word: μὲν γὰρ ... ἀλλ’
  choice: 確かに……しかし
  rationale: γάρの説明的なつながりを文脈に自然に織り込みつつ、μένとἀλλάが作る譲歩的な対比を明確に表した。
- source_word: καλῶς
  choice: 立派に
  rationale: 感謝そのものが適切になされていることを認める評価語として、自然で肯定的な日本語を選んだ。
- source_word: εὐχαριστεῖς
  choice: 感謝をささげています
  rationale: 礼拝の場で神に感謝するという文脈を自然に示し、現在形の直説法も保持した。
- source_word: ὁ ἕτερος
  choice: ほかの人
  rationale: 集会にいる当人以外の参加者を指すが、その役割を必要以上に限定しない表現とした。
- source_word: οὐκ οἰκοδομεῖται
  choice: 建て上げられません
  rationale: パウロが用いる建築の比喩と受動態を保ち、霊的な益や成長という含意を文脈に委ねた。
theological_decisions:
- issue: οἰκοδομέωの共同体的・霊的な比喩
  choice: 建て上げられません
  alternative: 養われません／霊的に成長できません
  rationale: 具体的な教理的意味に狭めず、パウロの建築比喩と、その人が益を受けないという文脈上の緊張を保持した。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で品位ある文体。「確かに……しかし」により原文の譲歩と対比を再現し、「建て上げる」というパウロの比喩は本文に残した。
