id: 1CO.14.20
reference: 1 Corinthians 14:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: ja
  text: 兄弟たち[a]、考え方では子どもになってはいけません。むしろ、悪に対しては幼子でありなさい[b]。しかし、考え方では成熟した者になりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は男性複数形の「兄弟たち」だが、会衆全体への呼びかけとして用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「悪意に対しては」とも訳せる。ギリシア語の κακία は、悪、邪悪さ、悪意などを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを本文に反映した。文脈上は教会共同体全体への呼びかけと考えられるため、その包括的な用法を脚注で示す。
- source_word: παιδία
  choice: 子ども
  rationale: 年齢を必要以上に限定せず、後続の「幼子」および「成熟した者」との対比を保つ。
- source_word: γίνεσθε
  choice: なってはいけません／なりなさい
  rationale: 単なる状態ではなく「なる」という γίνομαι の動きを保ち、最初と最後の命令の対応を表した。
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: 物の考え方では
  rationale: 理解・思考の働きを指す φρήν を、現代日本語で自然かつ明瞭に表し、両箇所で反復した。
- source_word: τῇ κακίᾳ
  choice: 悪に関しては
  rationale: κακία の広い倫理的意味を保ち、対人的な悪意だけに限定しない。限定的な訳語「悪意」は脚注に示す。
- source_word: νηπιάζετε
  choice: 幼子でありなさい
  rationale: 幼児である、または幼児のようであることを命じる語の比喩を保ち、「子ども」との意図的な語の違いも示した。
- source_word: τέλειοι
  choice: 成熟した者
  rationale: ここでは無欠の完全さより、思考・理解における十分な成熟を表す。
- source_word: ἀλλὰ ... δὲ
  choice: しかし
  rationale: 第一の対照は文を分けることで明示し、δέ の転換は「しかし」で表して、悪に対する幼さと思考における成熟との対比を際立たせた。
theological_decisions:
- issue: 性別を伴う会衆への呼びかけ
  choice: 本文では「兄弟たち」とし、会衆全体を指し得ることを脚注に記す。
  alternative: 兄弟姉妹たち
  rationale: 原文の男性複数形を見える形で残しつつ、この呼びかけが男女を含む教会全体に用いられている可能性を注記する。
- issue: τέλειοι の意味
  choice: 成熟した者
  alternative: 完全な者
  rationale: 子ども・幼子との対比が中心であり、道徳的な無欠性を主張する表現として狭く解さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「物の考え方」を反復して原文の修辞的対応を示し、「子ども」「幼子」「成熟した者」の三項の対比を保った。
