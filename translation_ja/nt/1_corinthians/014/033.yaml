id: 1CO.14.33
reference: 1 Corinthians 14:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: ja
  text: 神は無秩序[a]の神ではなく、平和の神だからです。神に属する民のすべての教会においても、神はそのようなお方です。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「混乱」。ἀκαταστασίαは「不安定さ」や「騒乱」を表すこともあるが、ここでは集会における乱れを広く指す。
    reason: lexical_alternative
  - marker: b
    text: 「神に属する民」は、信者たちを指すパウロの呼称。この句は、本文のように「神は……平和の神」と結び付ける代わりに、次の節の冒頭に結び付けて読むこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: 無秩序
  rationale: 集会で複数の者が秩序なく語る直前の文脈に合い、単なる心理的な「混乱」に限定せず、乱れた状態を表す。
- source_word: εἰρήνης
  choice: 平和
  rationale: ἀκαταστασίαと対照される、集会における調和と秩序を含む標準的な訳語。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 定冠詞を伴う、特定の人格的な神を指す。現代日本語では「神」が自然。
- source_word: ὡς
  choice: そうであるように
  rationale: 諸教会に共通するあり方との比較を表しつつ、何が「そう」なのかというギリシア語の簡潔さを保つ。
- source_word: ἐκκλησίαις
  choice: 教会
  rationale: 地域ごとのキリスト者の集まりを指す、確立した自然な訳語。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: パウロが信者を指して用いる表現を、特別な階級を連想させずに字義的かつ理解可能に表す。
- source_word: γάρ
  choice: だからです
  rationale: 直前の秩序に関する指示の理由を示す接続関係を、自然な日本語で明示する。
theological_decisions:
- issue: ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων の係り先
  choice: 33節に結び付け、独立した短文として「聖なる者たちのすべての教会でそうであるように」と訳す
  alternative: 次の34節に結び付け、「聖なる者たちのすべての教会でそうであるように、…」と読む
  rationale: 提示されたSBLGNTの句読法に従って33節側に置く一方、短文にすることで原文にある係り先の曖昧さを過度に解消しない。異なる統語的接続は脚注で明記する。
translation_notes:
  register: 明瞭で現代的ながら品位ある「です・ます」調。直前の文脈との因果関係を自然に示し、神についての対照表現は原文どおり反復した。
