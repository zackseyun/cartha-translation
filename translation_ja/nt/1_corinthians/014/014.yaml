source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: ja
  text: というのも、もし私が異言[a]で祈るなら、私の霊は祈りますが、私の理解[b]は実を結びません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ある言語で」。「異言」と訳したギリシア語は、人間の言語を指すことも、本章で用いられている、霊によって可能にされる発話を指すこともあります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私の知性」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: というのも、～なら、～からです
  rationale: γάρの説明的なつながりと、ἐάνの条件表現の両方を、自然な現代日本語で示した。
- source_word: προσεύχωμαι
  choice: 私が祈る
  rationale: ἐάνに伴う現在接続法を、条件節内の自然な現在表現で訳した。
- source_word: γλώσσῃ
  choice: 異言で
  rationale: 単数与格の手段・様態を「で」で表した。「異言」は本章の文脈に合う定着した聖書用語だが、「言語」の可能性も脚注に残した。
- source_word: τὸ πνεῦμά μου
  choice: 私の霊
  rationale: 所有表現をそのまま保ち、話者自身の霊を指す可能性を自然に示しつつ、説明語を加えなかった。
- source_word: προσεύχεται
  choice: 祈ります
  rationale: 単純な現在形として明瞭に訳し、前半の「祈る」と語彙を対応させた。
- source_word: ὁ δὲ νοῦς μου
  choice: 私の知性
  rationale: πνεῦμαとの対照を明瞭にし、思考・理解の働きを表すνοῦςを現代日本語として自然な「知性」で訳した。「理解力」の可能性は脚注に示した。
- source_word: ἄκαρπός ἐστιν
  choice: 実を結ばない
  rationale: ἄκαρποςの実りの比喩を、日本語で自然な動詞表現として保持した。
theological_decisions:
- issue: 「私の霊」（τὸ πνεῦμά μου）の指示対象
  choice: 話者自身の霊として読める「私の霊」
  alternative: 話者の内におられる聖霊
  rationale: 所有代名詞「私の」と「私の知性」との対照は、話者自身の霊を指す読みを支持する。ただし訳文には「人間の」などを補わず、原文が残す神学的余地を狭めなかった。
- issue: γλώσσῃが指す発話の性質
  choice: 本文では「異言」
  alternative: 「言語」または人間の言葉
  rationale: コリント人への手紙第一14章の議論との連続性を保つため「異言」としたが、語自体は言語をも意味し得るため、その幅を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも……からです」で前後への説明的接続を示し、「霊」と「知性」、「祈る」と「実を結ばない」の対照を簡潔に保持した。
