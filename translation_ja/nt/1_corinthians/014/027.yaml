  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: ja
  text: 異言[a]を語る人がいるなら、二人、あるいは多くても三人までにし、一人ずつ順に語り、一人が解き明かすようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「言語」。ギリシア語は「舌」または「言語」を意味し得る。ここでは、この章で一貫して扱われる賜物を指す「異言」としたが、その性質が人間の言語か別種の発話かは限定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: 異言を
  rationale: コリントの信徒への手紙一12―14章で扱われる賜物を指す、日本語聖書で定着した表現。「異なる言語」という語義もあり得るため、脚注で示し、その現象の性質を限定しない。
- source_word: τις
  choice: 人がいるなら
  rationale: 不特定の人物を表す条件文として、現代日本語で自然に表現した。
- source_word: λαλεῖ
  choice: 語る
  rationale: 一般的な条件を述べる現在形を、文脈に即した簡潔な日本語で訳した。
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: 二人、あるいは多くても三人までとし
  rationale: 発言者の人数を二人、最大でも三人に制限する規定であることを明瞭にした。
- source_word: ἀνὰ μέρος
  choice: 一人ずつ順番に
  rationale: 同時ではなく、各人が順に語るという分配的な意味を自然に表した。
- source_word: εἷς
  choice: 一人が
  rationale: 実体的に用いられた数詞をそのまま保ち、解き明かす者が一人であるという表現にした。
- source_word: διερμηνευέτω
  choice: 解き明かしなさい
  rationale: 会衆に理解できるよう異言の内容を伝える命令。「翻訳する」または「説明する」と限定せず、この文脈で定着した表現を用いた。
theological_decisions:
- issue: 霊の賜物の文脈における γλώσσῃ の意味
  choice: 本文では「異言」とし、1コリント12―14章で論じられる現象を指すものの、それが人間の外国語か別種の発話かは特定しない。
  alternative: 「異なる言語」と訳す、恍惚的発話に限定する、または人間の外国語に限定する。
  rationale: この節自体は現象の性質を決定していない。「異言」は章内の用語の一貫性を保ち、脚注に語義上の別案を示すことで、解釈上の緊張を残せる。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「とし」によって人数制限を自然に示し、「一人ずつ順番に」で同時発言を禁じる意味を明確にした。
