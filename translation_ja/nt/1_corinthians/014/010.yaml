lexical_decisions:
- source_word: τοσαῦτα
  choice: 非常に多くの
  rationale: 多数であることを示す中性複数形の数量表現。日本語として自然に、種類の多さを表した。
- source_word: εἰ τύχοι
  choice: おそらく
  rationale: 断定を和らげる挿入的な慣用句として理解し、その控えめな調子を保った。
- source_word: γένη
  choice: 種類
  rationale: 異なる類や種別を表すため、文脈に合う一般的な語を用いた。
- source_word: φωνῶν
  choice: ことば
  rationale: φωνήには「音」「声」「ことば」の幅があるが、前後では理解可能な発話が論点となっているため「ことば」とした。より字義的な可能性は脚注に残した。
- source_word: ἐν κόσμῳ
  choice: 世の中には
  rationale: 世界一般を指す表現を、現代日本語で自然な形にした。
- source_word: οὐδὲν ἄφωνον
  choice: そのどれにも意味があります
  rationale: 字義的には「声／音のないものは何もない」だが、ここでは各種のことばや音が伝達上の意味を持つという文脈上の趣旨を明確にした。字義的な読みは脚注に示した。
