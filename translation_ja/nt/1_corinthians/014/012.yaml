source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: ja
  text: 同じように、あなたがたも、霊的な賜物[a]を熱心に求めているのですから、教会を造り上げるために、ますます豊かになることを求めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「霊的なもの」または「霊たち」とも読める。文脈上、霊による賜物やその現れを指すと考えられる。
    reason: 原語の圧縮された表現と解釈上の幅を示すため。
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同じように、あなたがたも
  rationale: 直前の、意味の明瞭な言葉が人を益するという比較を受ける表現として、推論と連続性を自然な日本語で示した。
- source_word: ἐπεὶ
  choice: 〜のですから
  rationale: 勧告の根拠を示す因果的な接続を、現代日本語として自然に表した。
- source_word: ζηλωταί ἐστε
  choice: 熱心に求めている
  rationale: ζηλωτήςが表す強い熱意を、対象を求める文脈に即した動詞表現にした。
- source_word: πνευμάτων
  choice: 霊的な賜物[a]
  rationale: 直訳では「霊たち」または文脈上「霊的なもの」とも取れる圧縮された表現だが、12～14章では御霊にかかわる賜物や現れが論じられているため、本文では文脈上の指示対象を明瞭にし、原語の幅は脚注に残した。
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: 教会を造り上げるために
  rationale: οἰκοδομήの建築比喩を保ちつつ、共同体を強め成長させる目的を平明に示した。ἐκκλησίαはこの文脈の信者共同体として「教会」とした。
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: 豊かにあふれることを求めなさい
  rationale: ζητεῖτεの意図的な追求と、περισσεύωの「豊かになる、あふれる」という意味を保った。原文に明示されない目的語を補わず、何においてあふれるかを過度に限定しない訳とした。
theological_decisions:
- issue: πνευμάτωνの指示内容
  choice: 本文では「霊的な賜物」と訳し、脚注で字義的な選択肢を示す。
  alternative: 「霊的なもの」または「霊たち」
  rationale: 複数の霊的存在を熱望するという誤解を避け、御霊の賜物とその現れを扱う章全体の文脈を反映した。一方、原語自体は「賜物」に限定されないため、その曖昧さを脚注に保存した。
- issue: περισσεύητεの補語
  choice: 明示的な目的語を加えず「豊かにあふれる」とした。
  alternative: 「それらの賜物に豊かになる」「それらに秀でる」
  rationale: ギリシア語は何において豊かになるのかを明示しておらず、教会を造り上げるという目的だけを示す。賜物の量や能力に限定せず、原文の開放性を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。οἰκοδομήの比喩は「造り上げる」として保ち、教会用語に不慣れな読者にも意味が伝わるようにした。命令は強圧的にせず、使徒的勧告として「求めなさい」と表現した。
