  to: 同じように、あなたがたも、霊的な賜物[a]を熱心に求めているのですから、教会を造り上げるために、ますます豊かになることを求めなさい。
  rationale: 原文の構文と曖昧さを保ったまま、περισσεύητεの訳を自然な現代日本語に整えた。本文の「霊的な賜物」は前後の文脈に即して維持し、脚注ではπνευμάτωνが許すより広い意味の幅を正確に保存した。
