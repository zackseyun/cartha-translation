    issue: 「豊かにあふれること」の不自然さ
    rationale: περισσεύητεは「あふれる」とも訳せるが、「豊かにあふれる」は日本語として重複的で、何を求めるのかという命令文の流れも弱くなる。「ますます豊かになることを求めなさい」は原文の目的語を補わず、増し加わる含みを自然に表す。
  - severity: low
    issue: 脚注におけるπνευμάτωνの字義説明
    rationale: 「字義的には『霊たち』」だけでは、文脈上可能な「霊的なもの（ことがら）」という圧縮表現の幅を十分に示さない。本文の「霊的な賜物」を維持しつつ、脚注で代替可能性をより正確に示すべきである。
  revised_text: 同じように、あなたがたも、霊的な賜物[a]を熱心に求めているのですから、教会を造り上げるために、ますます豊かになることを求めなさい。
