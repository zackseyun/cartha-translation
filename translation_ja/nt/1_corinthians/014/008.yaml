  text: καὶ γὰρ ἐὰν ἄδηλον ⸂φωνὴν σάλπιγξ⸃ δῷ, τίς παρασκευάσεται εἰς πόλεμον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: ja
  text: 実際、ラッパがはっきりしない音[a]を出すなら、だれが戦い[b]の備えをするでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「判然としない音」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「戦争のために」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実際
  rationale: 前の例をさらに補強する説明的な接続表現として、現代日本語で自然な「実際」を用いた。
- source_word: ἐὰν
  choice: …なら
  rationale: 接続法を伴う例示的な条件を、自然な日本語の条件表現で示した。
- source_word: ἄδηλον
  choice: はっきりしない
  rationale: 「明らかでない、判然としない」という意味を、信号として識別できない文脈に即して平明に表した。
- source_word: φωνὴν
  choice: 音
  rationale: ラッパが発するものを指すため、「声」ではなく文脈に自然な「音」とした。
- source_word: σάλπιγξ
  choice: ラッパ
  rationale: 軍事的な合図に用いる吹奏楽器を指す一般的で理解しやすい語を選んだ。
- source_word: δῷ
  choice: 出す
  rationale: 字義的には「与える」だが、日本語ではラッパと音の組み合わせに「音を出す」が自然である。
- source_word: τίς
  choice: だれが
  rationale: 修辞疑問を直接かつ自然に表した。
- source_word: παρασκευάσεται
  choice: 備えをする
  rationale: 未来中動態が示す「自ら準備する、用意を整える」という意味を簡潔に表した。
- source_word: εἰς πόλεμον
  choice: 戦いの
  rationale: 直訳は「戦争へ／戦争のために」だが、ラッパの合図を受けて戦闘に備える場面では「戦いの備え」が自然である。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用い、修辞疑問の力を保つため「でしょうか」で結んだ。「ラッパが音を出す」「戦いの備えをする」という自然な連語を選びつつ、原文の比喩と条件構文を保持した。
