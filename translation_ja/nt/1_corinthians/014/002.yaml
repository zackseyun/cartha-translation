  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: ja
  text: 異言を語る者は、人に向かってではなく、神に向かって語るのです。だれも理解しないからです。[a] しかし、その人は霊で奥義を語っています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれも聞かない」とも訳せる。ギリシア語の動詞は「聞く」を基本義とするが、ここでは文脈上「理解する」という意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「霊」は聖霊を指すとも、異言を語る人自身の霊を指すとも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: 語る者
  rationale: 定冠詞を伴う現在分詞を一般的な人物を表す表現として訳し、性別を限定しない簡潔な日本語とした。
- source_word: γλώσσῃ
  choice: 異言を
  rationale: 単数形で示された、この章における特有の発話現象を表す。単に「外国語」として意味を限定しない。日本語では「異言で語る」より「異言を語る」が自然である。
- source_word: ἀνθρώποις
  choice: 人に向かって
  rationale: 男性に限定されない複数の人間を表す。λαλεῖの相手を自然な日本語で明示した。
- source_word: θεῷ
  choice: 神に向かって
  rationale: ἀνθρώποιςとの対照を同じ構文で明瞭に示した。
- source_word: ἀκούει
  choice: 理解しない
  rationale: 基本義は「聞く」だが、理解可能な言葉による伝達との対比が続く文脈では「理解する」の含意が強い。字義的な訳は脚注に残した。
- source_word: πνεύματι
  choice: 霊によって
  rationale: 与格が手段または領域を表し得ることを踏まえた自然な訳。日本語の「霊」は聖霊と話者自身の霊のどちらも指し得るため、原文の指示対象の曖昧さを保ち、脚注で明示した。
- source_word: μυστήρια
  choice: 奥義
  rationale: 単なる不可解な事柄ではなく、パウロ書簡での神学的な響きを保つ語を選んだ。
- source_word: δὲ
  choice: むしろ
  rationale: 直前の否定的説明と、霊によって奥義を語ることとの対照を自然に示す。
theological_decisions:
- issue: πνεύματι が指すもの
  choice: 本文では「霊によって」とした
  alternative: 「自分の霊によって」、または「聖霊によって」
  rationale: ギリシア語は聖霊を指すとも、話者の霊を指すとも解し得る。本文ではいずれか一方に限定せず、脚注で両方の可能性を示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文にふさわしい品位を保った。「異言」「奥義」は文脈上の神学的含意を失わないために採用し、説明的に意味を狭める言い換えは避けた。
