source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: ja
  text: 律法にはこう書かれています。\n\n「異なる言語を話す者たちによって、またほかの者たちの唇によって、\nわたしはこの民に語る。\nそれでもなお、彼らはわたしに耳を傾けない」と主は言われる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: 律法には
  rationale: 引用元はイザヤ書だが、ここでの νόμος はユダヤの聖書全体を広く指す用法。「律法」とすることで、パウロの定型的な聖書呼称を保った。
- source_word: γέγραπται
  choice: こう書かれています
  rationale: 聖書引用を導入する完了受動形の定型表現を、現代日本語として自然に示した。
- source_word: ἐν ἑτερογλώσσοις
  choice: 異なる言語を話す人々を通して
  rationale: ἑτερόγλωσσος は「異なる言語の」を意味する。文脈上、その言語を話す人々が神の語りの媒介となるため「人々を通して」とし、周辺文脈の異言とのつながりも保った。
- source_word: ἐν χείλεσιν ἑτέρων
  choice: 異国人の唇を通して
  rationale: 「唇」という引用の比喩を残しつつ、ἑτέρων がここでは別の民族・言語に属する者を指すことを明確にした。
- source_word: λαλήσω
  choice: わたしは…語る
  rationale: 単純未来の神の発話を、簡潔で格調を保つ「語る」で表した。
- source_word: τῷ λαῷ τούτῳ
  choice: この民に
  rationale: λαός の聖書的な「民」という語感を保った。
- source_word: οὐδ’ οὕτως
  choice: それでも
  rationale: そのような特別な手段によって語ってもなお応答しない、という οὐδέ と οὕτως の強調を自然な日本語で表した。
- source_word: εἰσακούσονταί μου
  choice: わたしに聞き従わない
  rationale: 単に音を聞く以上に、耳を傾けて受け入れる含意があるため「聞き従う」とした。
- source_word: λέγει κύριος
  choice: と主は言われる
  rationale: 現在形の引用定型句を日本語の聖書文体として自然に表し、κύριος は原文どおり「主」とした。
theological_decisions:
- issue: 聖書引用中の κύριος の訳し方
  choice: 主
  alternative: ヤハウェ
  rationale: ギリシア語本文は κύριος であるため、本文では「主」とした。一方、イスラエルの神の発言を引用する背景から、ヘブライ語の神名を意識した訳も可能であることを注で示した。
- issue: εἰσακούω に含まれる応答の強さ
  choice: 聞き従う
  alternative: 耳を傾ける
  rationale: 文脈は単なる聴覚ではなく、神の語りを受け入れない頑なさを扱う。ただし、この動詞自体をより控えめに「耳を傾ける」と訳す余地も残した。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書引用としての品位を保った。「人々を通して」「唇を通して」は、神が異なる言語を話す者たちを媒介として語る構造を自然に示す。引用符を二重にし、パウロの導入句、神の発言、結びの引用定型句の階層を明確にした。
