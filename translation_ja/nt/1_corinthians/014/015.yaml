id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: ja
  text: それでは、どうすればよいのでしょうか。私は霊[a]をもって祈り、また知性をもっても祈ります。霊をもって賛美を歌い[b]、また知性[c]をもっても賛美を歌います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊によって」「霊において」とも訳せる。ギリシア語は、ここでの「霊」が特に聖霊、人間の霊、あるいは霊による発語のどれを指すかを明示していない。
    reason: lexical_alternative
  - marker: b
    text: 「歌い」または「調べを奏で」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「理解力」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: それでは、どうすればよいのでしょうか
  rationale: 直訳的な「それでは、何なのか」ではなく、議論から導かれる実践的な結論を問う修辞的表現として、自然な現代日本語にした。
- source_word: προσεύξομαι
  choice: 私は…祈ります
  rationale: 未来形が表す話者の意志・方針を、文脈に即して一人称の「祈ります」で表した。
- source_word: τῷ πνεύματι
  choice: 霊をもって
  rationale: 与格の手段・様態の幅を保ちつつ、「知性をもって」との対照を明確にした。「聖霊によって」や「自分の霊で」と限定していない。
- source_word: τῷ νοΐ
  choice: 知性をもって
  rationale: νοῦςが指す理解し思考する働きを「知性」で表し、πνεῦμαとの名詞的な並行関係を保った。
- source_word: ψαλῶ
  choice: 賛美を歌います
  rationale: 礼拝の文脈における歌唱の意味を明確にし、単なる「歌う」よりもψάλλωの賛美の含意を伝えた。
- source_word: δὲ καὶ
  choice: また…も
  rationale: 二つのあり方を対照させながら加える働きを、自然な日本語の「また…も」で表した。
theological_decisions:
- issue: 「霊」（πνεῦμα）が何を指すか
  choice: 本文では単に「霊」とし、指示対象を限定しない
  alternative: 「聖霊」、「自分の霊」、「霊的な発語」
  rationale: ギリシア語本文は、聖霊、人間の霊、あるいは霊による発語のいずれかを明示していないため、本文で一つに決めず解釈上の緊張を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、礼拝の文脈にふさわしい品位を保った。「霊をもって／知性をもって」の反復により、原文の平行構造と対照を残した。
