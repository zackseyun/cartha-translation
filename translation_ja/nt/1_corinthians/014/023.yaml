id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: ja
  text: ですから、教会全体が一つの場所に集まり、皆が異言[a]を語っていて、事情を知らない人たち[b]や信者でない人たちが入って来れば、彼らは、「あなたがたは気が狂っている」と言わないでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異なる言語」とも訳せる。ギリシア語は「言語」を意味し得るが、ここでは議論されている現象の性質を限定しないため、定着した表現である「異言」とした。
    reason: alternative_reading
  - marker: b
    text: 「部外者」とも訳せる。ギリシア語は、この集会の慣行について知らない人、または通じていない人を指すと考えられ、ここでは「信者でない人たち」と区別されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる帰結を示す。現代日本語として自然でありながら、論理的なつながりを明確にする。
- source_word: συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτό
  choice: 教会全体が一つの場所に集まり
  rationale: ὅληが共同体全体を強調することと、ἐπὶ τὸ αὐτόが同じ場所への集合を表すことの両方を保った。
- source_word: λαλῶσιν γλώσσαις
  choice: 異言を語っている
  rationale: コリント第一12―14章で扱われる霊的な発話を指す定着した表現を用い、その現象が通常の外国語か別種の発話かを本文で決めない。
- source_word: ἰδιῶται
  choice: 事情を知らない人たち
  rationale: この集会や実践について知らず、通じていない人を指す語義を自然な日本語で表し、続く「信者でない人たち」との区別を保つ。
- source_word: ἄπιστοι
  choice: 信者でない人たち
  rationale: 信仰を持たない者を明瞭に表し、ἰδιῶταιとは別の呼称として訳し分けた。
- source_word: μαίνεσθε
  choice: あなたがたは気が狂っている
  rationale: 狂気と見なされるという強い非難を、過度に俗語的にも古風にもならない現代日本語で表す。
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: と言わないでしょうか
  rationale: 肯定の答えを予期する修辞疑問の力を保つ。
theological_decisions:
- issue: 1コリント14章におけるγλῶσσαιの性質
  choice: 本文では「異言」と訳す。
  alternative: 「異なる言語」または「諸言語」
  rationale: γλῶσσαは言語を意味し得るが、この文脈では議論中の霊的な発話現象の呼称として機能する。「異言」は、それが既知の人間言語なのか、別種の発話なのか、あるいは双方を含むのかという解釈上の問題を決着させずに保つ。
- issue: ἰδιῶταιとἄπιστοιの関係
  choice: 「事情を知らない人たち」と「信者でない人たち」を別々に示す。
  alternative: 両者をまとめて「部外者や未信者」とする。
  rationale: 原文が二つの呼称を並べているため、その区別を平板化しない。「事情を知らない」は、信仰の有無そのものではなく、集会の実践に通じていないという意味を表し得る。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、教会での朗読にも適する落ち着いた文体とした。修辞疑問を保ち、引用部分によって外部の人々が下す判断を明確にした。
