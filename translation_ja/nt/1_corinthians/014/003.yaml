  to: しかし、預言する人は、人々を築き上げ、励まし、慰めるために語ります。
  rationale: 受益者を表す ἀνθρώποις を「人々を築き上げ、励まし、慰める」の対象として自然に表し、三つの対格名詞が示す語りの目的・働きを「〜ために語ります」で明確にしました。これは日本語として必要な明示化であり、「預言」の内容を説教・予告などに限定しません。三項の区別を「築き上げ／励まし／慰め」として保持し、脚注も改訳語と一致させました。
