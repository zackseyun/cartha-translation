  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: ja
  text: しかし、預言する人は、人々を築き上げ、励まし、慰めるために語ります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: しかし、預言する人は
  rationale: 冠詞付き現在分詞を、継続的・特徴的に預言する人を指す自然な日本語で表した。δέは前節との穏やかな対比として「しかし」とした。
- source_word: ἀνθρώποις
  choice: 人々を
  rationale: 原文では語りかける相手を示す与格である。日本語では後続する三つの働きとの関係を自然に示すため「人々を」とし、男性に限定しない包括的な意味を保った。
- source_word: λαλεῖ
  choice: 語ります
  rationale: λαλέωの現在形を、文脈に合う平明で品位ある表現にした。
- source_word: οἰκοδομὴν
  choice: 造り上げ
  rationale: 建築を表す語の比喩的用法を保ち、人の信仰共同体的・霊的な成長を促す意味を表した。「教化」より現代の一般読者に分かりやすい。
- source_word: παράκλησιν
  choice: 励まし
  rationale: 勧め、励まし、慰めを含み得る語だが、続くπαραμυθίαとの区別を保つため、ここでは「励まし」とした。
- source_word: παραμυθίαν
  choice: 慰め
  rationale: いたわり、安心させる語り、慰めを表す語として、前の「励まし」と重ねず「慰め」とした。
theological_decisions:
- issue: 集会における「預言する」の意味
  choice: 「預言する」と訳し、その内容を説教や未来予告に限定しない。
  alternative: 「説教する」または「啓示を語る」
  rationale: 本文は預言を異言と対比し、人々にもたらす働きを述べているが、その性質を一義的に定義してはいない。原語の神学的な幅と緊張を保った。
- issue: 三つの対格名詞とλαλεῖの関係
  choice: 人々を「造り上げ、励まし、慰めることを語る」と、発言の内容・働きを一体として表す。
  alternative: 「築き上げと励ましと慰めを語る」と名詞を形式的に並べる。
  rationale: 原文の三項並列を保ちながら、目的または結果を含み得る関係を自然な現代日本語で示した。単に目的だけに限定する「〜するために」は避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書用語として定着した「預言」は保持した。「教化」「慰藉」のような硬い語を避けつつ、三つの働きの区別と並列を保った。
