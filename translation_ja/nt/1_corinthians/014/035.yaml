id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: ja
  text: しかし、何かを学びたいのなら、家でそれぞれ自分の夫に尋ねなさい。女性[a]が集会[b]で語ることは恥ずべきことだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「妻」とも訳せる。ギリシア語の語は、文脈により「女性」と「妻」のどちらも意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「教会で」または「会衆の中で」とも訳せる。ギリシア語は、集まっている共同体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: 学ぶ
  rationale: μανθάνωの不定詞を直接的に表し、「知る」「教えを受ける」と限定せず、原文の広がりを保つ。
- source_word: ἐν οἴκῳ
  choice: 家で
  rationale: 直訳的な「家の中で」より自然な現代日本語であり、集会の場との対比も明確に伝わる。
- source_word: τοὺς ἰδίους ἄνδρας
  choice: それぞれ自分の夫
  rationale: ἰδίουςと家庭という文脈から、ἀνήρはここでは「夫」の意味が最も自然である。複数の主語と各自の夫との対応を「それぞれ」で示した。
- source_word: ἐπερωτάτωσαν
  choice: 尋ねなさい
  rationale: 現在命令形の力を保ちつつ、質問したり問い合わせたりする意味を自然で明瞭な日本語で表す。
- source_word: αἰσχρὸν
  choice: 恥ずべきこと
  rationale: 社会的・道徳的に恥とされるという語の強さを、「不適切」などに弱めずに表す。
- source_word: γυναικὶ
  choice: 女性
  rationale: γυνήには「女性」と「妻」の両義がある。本文では一般的な表現である「女性」を採り、文脈上可能な「妻」を脚注に残す。
- source_word: λαλεῖν
  choice: 語る
  rationale: 発話の種類を質問、私語、預言などに限定せず、λαλεῖνの広い意味を保つ。「話す」よりも本文の格調に適する。
- source_word: ἐν ἐκκλησίᾳ
  choice: 集会で
  rationale: ここでのἐκκλησίαは集まった共同体を指す。「教会」という制度的・建物的な連想に狭めず、会衆が集う場面を表す。
theological_decisions:
- issue: 女性が集会で語ることへの規定の範囲
  choice: 本文どおり「語る」とし、発言の種類を限定しない。
  alternative: 騒がしい質問、預言の吟味、またはコリント側の主張の引用に限定する。
  rationale: ギリシア語本文自体はここで発言の種類を明示していないため、特定の解釈を訳文に織り込まず、原文の緊張と解釈上の余地を保つ。
- issue: γυνήとἀνήρを「女性／男性」とするか「妻／夫」とするか
  choice: ἄνδραςは「夫」、γυναικίは本文で「女性」とし、「妻」を脚注に示す。
  alternative: 一貫して「妻／夫」または「女性／男性」と訳す。
  rationale: 「それぞれ自分の」という表現と家庭の文脈はἄνδραςの「夫」を強く示すが、単数のγυναικίは一般的な「女性」と文脈的な「妻」のいずれも可能であるため、その曖昧さを保持する。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、命令と「恥ずべき」という原文の強さを保った。「女性／妻」と集会内での発言範囲に関する曖昧さは、本文と脚注によって解消せずに残した。
