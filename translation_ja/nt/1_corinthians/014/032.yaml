  text: また、預言者たちの霊は、預言者たちに従います。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「預言者たちに属する霊は、預言者たちに従います」とも訳せます。「霊」は、預言者に伴う預言の衝動や霊的な働きを指し、預言が自制できないものではないことを強調している可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 直前の命令を支える一般原則を追加する接続詞として、現代日本語では「また」が自然である。
- source_word: πνεύματα προφητῶν
  choice: 預言者たちの霊
  rationale: 属格を簡潔に保ち、「霊」を「衝動」「発言」「賜物」などと解釈的に言い換えず、原文にある意味の幅を残す。
- source_word: προφήταις
  choice: 預言者たちに
  rationale: ὑποτάσσεται が示す服従・統制の相手を表す与格として訳した。他の預言者たちを指す可能性と、預言者自身による統制を強調する文脈上の理解の双方を不必要に限定しない。
- source_word: ὑποτάσσεται
  choice: 従います
  rationale: 中動・受動形の一般的陳述を自然な日本語で表し、権威または統制のもとにあるという意味を保つ。中性複数主語に単数動詞が用いられるギリシア語構文は、日本語では通常の複数表現で訳す。
theological_decisions:
- issue: 「預言者たちの霊」と預言者による統制との関係
  choice: 本文では「預言者たちの霊は、預言者たちに従います」として、預言に伴う霊的活動が統制不能ではないことを示す。
  alternative: 預言者個人の人間の霊が他の預言者たちに従う、または預言の言葉が預言者たちによって吟味される、という理解。
  rationale: 14章29–33節は集会における秩序ある預言を扱う。しかし、この短い句だけで「霊」を預言の衝動、人間の霊、預言の言葉のいずれかに限定することは避け、神学的緊張と文法上の幅を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、礼拝での朗読にも適する簡潔で品位ある文体とした。「服従します」より日常的で自然な「従います」を採用しつつ、原文の意味を弱めないようにした。
