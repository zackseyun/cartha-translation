id: 1CO.14.9
reference: 1 Corinthians 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: ja
  text: 同じように、あなたがたも、舌ではっきり分かることば[a]を語らなければ、語られていることがどうして分かるでしょうか。空気に向かって語ることになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「明瞭なことば」または「理解できる内容」。ギリシア語は、聞き手が聞き分けて理解できる発話を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同じように、あなたがたも
  rationale: 直前の楽器の音のたとえを受け、その原則をコリントの信徒に適用する比較表現を自然に保つ。
- source_word: διὰ τῆς γλώσσης
  choice: 舌で
  rationale: διάの手段の意味を簡潔に表しつつ、γλῶσσαの具体的な「舌」という像を保持する。文脈上は発声による語りを指す。
- source_word: εὔσημον λόγον
  choice: はっきり分かることば
  rationale: εὔσημοςが示す、聞き手に識別でき理解できる明瞭さを、現代日本語で自然に表す。「ことば」はλόγοςを狭い単語一語に限定せず、発話内容として伝える。
- source_word: δῶτε
  choice: 語らなければ
  rationale: 直訳の「与えなければ」は日本語では不自然なため、発話の文脈に即して「語る」とした。後続のλαλέωとの語彙的な重なりはあるが、意味と自然さを優先した。
- source_word: πῶς γνωσθήσεται
  choice: どうして分かるでしょうか
  rationale: 受動形の意味を日本語の自然な無主語表現で示し、聞き手による理解が問題であることを明確にする。
- source_word: τὸ λαλούμενον
  choice: 語られていること
  rationale: 冠詞付き受動分詞を内容を指す名詞句として訳し、継続中の発話という含みも保つ。
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: 空気に向かって語ることになるからです
  rationale: 理解されない発話のむなしさを示す「空気に向かって語る」という比喩を維持し、未来的帰結を「ことになる」で表す。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、修辞疑問と「空気に向かって語る」という原文の比喩を保った。「舌」は周辺文脈とのつながりを損なわないよう具体語のまま残した。
