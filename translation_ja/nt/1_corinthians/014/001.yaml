base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: ja
  text: 愛を追い求めなさい。また、霊的なもの[a]を熱心に求めなさい。とりわけ、預言することを求めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊的なもの」は「霊に属するもの」や「霊的な事柄」とも訳せる。文脈上、「霊の賜物」と訳すこともできる。ギリシア語は「賜物」より広い表現だが、ここでは教会における霊による現れ、特に預言が焦点となっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διώκετε
  choice: 追い求めなさい
  rationale: 継続して積極的に目標を追う命令の力を保ち、現代日本語としても自然である。
- source_word: τὴν ἀγάπην
  choice: 愛
  rationale: 直前の第13章との語彙的なつながりを明確に保つ、標準的で自然な訳語である。
- source_word: ζηλοῦτε
  choice: 熱心に求めなさい
  rationale: ζηλόωの強い願望と熱意を、肯定的な命令として明瞭に表す。
- source_word: τὰ πνευματικά
  choice: 霊に属するもの
  rationale: 中性複数形の幅を保ち、『賜物』と限定しすぎない。同時に、12―14章の文脈では御霊による現れを指すことが理解できる表現である。
- source_word: μᾶλλον δὲ
  choice: とりわけ
  rationale: 預言を他の霊的なものより重視する比較的な力を、過度に対立的にせず自然に表す。
- source_word: ἵνα προφητεύητε
  choice: 預言することを求めなさい
  rationale: ἵνα節がζηλοῦτεの望む内容を示すことを日本語で明確にし、原文の勧告の流れを保つ。
- source_word: προφητεύητε
  choice: 預言する
  rationale: 聖書で確立した概念を保ち、不要な解釈的言い換えを避ける。
theological_decisions:
- issue: τὰ πνευματικάの範囲
  choice: 「霊に属するもの」と訳し、原語の広さを保持する。
  alternative: 「霊の賜物」
  rationale: 周囲の文脈は御霊による賜物や現れを扱うが、原語自体は『賜物』より広い。本文では限定を加えず、文脈に解釈を委ねる。
- issue: 預言を優先する勧めの強さ
  choice: 「とりわけ、預言することを求めなさい」
  alternative: 「むしろ、預言することを求めなさい」
  rationale: μᾶλλον δὲの比較と重点を示しつつ、他の霊的なものを退ける意味に狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令形をそろえ、原文の反復的な勧告と比較的重点を自然に伝えた。
