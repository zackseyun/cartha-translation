  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: ja
  text: 「すべてのことが許されている」。しかし、すべてが益になるわけではありません。「すべてのことが許されている」。しかし、すべてが築き上げるわけではありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: すべてのこと
  rationale: 中性複数形が名詞的に用いられており、包括的な範囲と、二度繰り返される標語的な形を保つ。
- source_word: ἔξεστιν
  choice: 許されている
  rationale: 可能・許可・合法性を表す語。現代日本語で自然に許容の意味を伝え、法律用語に限定しない。
- source_word: ἀλλ’
  choice: しかし
  rationale: 前の主張を限定する簡潔な逆接を明確に表す。
- source_word: συμφέρει
  choice: 有益なのではありません
  rationale: 利益になる、役に立つという意味を表す。文脈上、単なる金銭的利益ではなく倫理的・共同体的な益を指しうるため「有益」とした。
- source_word: οἰκοδομεῖ
  choice: 人を築き上げるのではありません
  rationale: 建築の比喩を保ちつつ、パウロ書簡における共同体や他者を強める意味が日本語で伝わるよう、補語「人を」を明示した。
theological_decisions:
- issue: Πάντα ἔξεστινをコリント人の標語として引用符で示すか
  choice: 二度とも引用符を付け、パウロが取り上げて限定する標語として示す
  alternative: 引用符を付けず、パウロ自身の発言として続ける
  rationale: 古代の写本には現代的な引用符がなく、標語と見ることは解釈上の判断である。ただし反復と直後の限定は引用された標語である可能性を強く示すため、本文では引用符を用い、脚注で不確実性を明示する。
translation_notes:
  register: 明快な現代標準日本語を用い、反復と簡潔な対照構造を保持した。「人を」はοἰκοδομεῖの共同体的な比喩が自然に伝わるための最小限の補足。敬体によって平易さと品位を両立させた。
