reference: 1 Corinthians 10:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: ja
  text: 信じていない人の一人があなたがたを招き、あなたがたが行きたいと思うなら、出されるものは何でも、良心のために何も詮索せずに[a]食べなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「何も調べずに」または「何も問いたださずに」。ここでは、食物がどこから来たかを詮索しないという意味です。
    reason: lexical_alternative
  - marker: b
    text: 「良心」が特に誰の良心を指すかは、次の節で「自分の良心ではなく、相手の良心」と説明されます。
    reason: cross_reference
lexical_decisions:
- source_word: τῶν ἀπίστων
  choice: 信じていない人
  rationale: キリストを信じていない人を指す文脈上の区別を保ちつつ、現代日本語で過度に類型化・敵対化しない自然な表現とした。
- source_word: καλεῖ
  choice: 招き
  rationale: 食事の場面なので、一般的な「呼ぶ」ではなく、食事に「招く」という意味を明示した。
- source_word: θέλετε πορεύεσθαι
  choice: あなたがたも行きたいと思うなら
  rationale: 招待を受ける意思・希望と、条件的な性格の両方を自然な日本語で表した。
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: 出されたものは何でも
  rationale: 食卓に供された食物という意味を簡潔に示し、πᾶνの包括性を「何でも」で保持した。
- source_word: ἐσθίετε
  choice: 食べなさい
  rationale: 一般的な指示を表す現在命令形を、明瞭で自然な命令表現にした。
- source_word: μηδὲν ἀνακρίνοντες
  choice: その由来を何も詮索しないでください
  rationale: ἀνακρίνωの「調べる、問いただす」という幅のうち、この文脈では食物の背景、とりわけ偶像への供え物かどうかを調査しないことが中心であるため、「由来を詮索する」とした。
- source_word: διὰ τὴν συνείδησιν
  choice: 良心のためです
  rationale: διά＋対格が示す理由・配慮を簡潔に訳し、誰の良心かは本文で限定しなかった。
theological_decisions:
- issue: συνείδησιςが誰の良心を指すか
  choice: 本文では単に「良心」とし、所有者を特定しない
  alternative: 「自分の良心」または「相手の良心」と明示する
  rationale: この節だけでは所有者が明示されず、次節で「自分のではなく、相手の良心」と説明されるため、ここで先取りして曖昧さを解消しない。
- issue: 食物について問わない理由
  choice: 食物の由来を調べないという実践的意味を示す
  alternative: 食物を道徳的に吟味・判定しないという抽象的意味にする
  rationale: 偶像に供えられた肉をめぐる直前直後の文脈に即しつつ、その食物自体を汚れたものと断定する神学的含意は加えない。
translation_notes:
  register: 明瞭な現代標準日本語。命令の前半は「食べなさい」で格調と明確さを保ち、分詞句は日本語として読みやすい独立文にした。「詮索」は食物の背景を調査する実際的行為を端的に示す。
