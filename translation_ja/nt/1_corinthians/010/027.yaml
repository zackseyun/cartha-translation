revisions:
- from: 信じていない人のだれかがあなたがたを招き、あなたがたも行きたいと思うなら、出されたものは何でも食べなさい。その由来を何も詮索しないでください[a]。良心のためです[b]。
  to: 信じていない人の一人があなたがたを招き、あなたがたが行きたいと思うなら、出されるものは何でも、良心のために何も詮索せずに[a]食べなさい[b]。
  rationale: 原文の一文構造を保ち、「良心のために」を「何も詮索せずに食べなさい」に係らせた。「何も詮索せずに」は μηδὲν ἀνακρίνοντες の対象の広さを保ち、脚注で食物の由来を調べないという文脈上の意味を示す。脚注アンカーは、それぞれが説明する箇所へ配置した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:08Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の基本的な意味はよく捉えているが、διὰ τὴν συνείδησιν（「良心のために／良心に配慮して」）は「詮索しないで」に係る句であり、独立した「良心のためです」とするより、一文の中で命令を修飾する形にするほうが原文の構文と論理関係を保てる。「その由来」は文脈に適合する補足ではあるものの、ἀνακρίνω の目的語 μηδέν（「何も」）より狭くしているため、本文では限定しない。
  naturalness: 「信じていない人のだれか」より「信じていない人の一人が」が自然である。また、理由句を独立文にせず、「良心のために何も詮索せずに食べなさい」とまとめると、明瞭な現代標準日本語としても滑らかになる。
  terminology: 「信じていない人」「招く」「出されるものは何でも」「食べなさい」「良心」は適切である。「詮索」はやや否定的な響きを持つが、この文脈で不必要に調べないという実践的指示を表せる。脚注は該当語句に直接付す必要がある。
  issues:
  - severity: medium
    issue: 「良心のためです」が独立文になっている。
    rationale: 原文の διὰ τὴν συνείδησιν は μηδὲν ἀνακρίνοντες とともに食べるという命令のあり方を示す句である。独立文でも概意は通るが、係り先と論理の結びつきが弱くなる。
  - severity: low
    issue: 「その由来を」は原文の目的語を限定している。
    rationale: 食物の来歴を問うことが文脈上の中心である一方、μηδὲν は文字どおりには「何も」である。本文は広さを保ち、来歴の含意は脚注で説明するのが安全である。
  - severity: medium
    issue: 脚注アンカーが説明対象の語句に付いていない。
    rationale: 語彙脚注は「何も詮索せずに」に、良心の説明脚注は「良心」に付すべきである。現行では[a]が「行きたいと思うなら」に、[b]が独立した理由文末に置かれ、参照関係が不明瞭である。
  revised_text: 信じていない人の一人があなたがたを招き、あなたがたが行きたいと思うなら、出されるものは何でも、良心のために何も詮索せずに[a]食べなさい[b]。
