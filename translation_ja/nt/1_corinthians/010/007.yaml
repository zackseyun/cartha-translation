revisions:
- from: また、彼らのうちのある者たちのように、偶像を礼拝する者となってはいけません。こう書かれています。「民は座って食べたり飲んだりし、立って戯れた[a]。」
  to: また、彼らの中のある者たちのように、偶像を礼拝する者となってはいけません。こう書かれています。「民は食べたり飲んだりするために座り、立ち上がって戯れた[a]。」
  rationale: 本文の意味や解釈上の幅を変えず、引用部の「座る→立ち上がる」という動きと、「食べ飲みするために」という目的関係を明確にした。また、「彼らの中のある者たち」として現代日本語の自然さを整えた。
