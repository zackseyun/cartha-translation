reference: 1 Corinthians 10:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: ja
  text: また、彼らの中のある者たちのように、偶像を礼拝する者となってはいけません。こう書かれています。「民は食べたり飲んだりするために座り、立ち上がって戯れた[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「浮かれ騒いだ」。これは出エジプト記32章6節からの引用で、「戯れ」は金の子牛をめぐる偶像礼拝の祝宴と結びついている。
    reason: παίζεινの字義的な表現と、文脈上の祝宴・浮かれ騒ぎという含意の両方を示すため。
lexical_decisions:
- source_word: μηδὲ
  choice: また、……してはいけません
  rationale: 前後に続く一連の禁止命令とのつながりを示しつつ、現代日本語として自然な禁止表現にした。
- source_word: εἰδωλολάτραι γίνεσθε
  choice: 偶像を礼拝する者となってはいけません
  rationale: γίνεσθεの「なる」という動きを保ち、「偶像礼拝者」よりも一般読者に直ちに意味が伝わる表現とした。
- source_word: τινες αὐτῶν
  choice: 彼らのうちのある者たち
  rationale: 荒野のイスラエル全体ではなく、その中の一部を指すことを明示した。
- source_word: ὥσπερ γέγραπται
  choice: こう書かれています
  rationale: 聖書引用を導く定型句として、完了形が示す現に書かれている状態を自然な日本語で表した。
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: 民は座って食べたり飲んだりし
  rationale: 目的・行為を表す不定詞を自然な日本語にしつつ、食べることと飲むことの対を保持した。
- source_word: ἀνέστησαν παίζειν
  choice: 立って戯れた
  rationale: 立ち上がって行動へ移った叙述と、παίζεινの基本的な「遊ぶ、戯れる」という語義を簡潔に保った。
theological_decisions:
- issue: 出エジプト記32章の引用におけるπαίζεινの含意
  choice: 本文では「戯れた」とし、偶像礼拝の祝宴に伴う浮かれ騒ぎという文脈を脚注で示す。
  alternative: 「浮かれ騒いだ」「どんちゃん騒ぎをした」
  rationale: 語の基本的な幅と引用表現を保ち、具体的な行為を本文で過度に限定しない。同時に、金の子牛を巡る偶像礼拝の宴という文脈上の含意を脚注で読者に知らせる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。引用部には簡潔で格調ある響きを残しつつ、古語的な言い回しは避けた。
