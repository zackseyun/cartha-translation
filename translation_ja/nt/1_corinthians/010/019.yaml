base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: ja
  text: では、私は何を言っているのでしょうか。偶像に供えられた食べ物が何かである、あるいは偶像が何かである、と言っているのでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί οὖν φημι
  choice: では、私は何を言っているのでしょうか
  rationale: 現在形・一人称の修辞疑問を保ちつつ、議論を受ける οὖν を自然な現代日本語の「では」で表した。
- source_word: εἰδωλόθυτόν
  choice: 偶像に供えられた食物
  rationale: 異教祭儀で偶像に供えられ、食べる対象となる物を指す文脈に即し、一般読者に明瞭な表現とした。
- source_word: τί ἐστιν
  choice: 何か意味がある／何か実体がある
  rationale: τί ἐστιν の簡潔で幅のある問いを、供物については意義、偶像については存在・実在性が問題となる自然な日本語で表した。ただし「神として実在する」とまでは限定していない。
- source_word: ἢ
  choice: とか…、…と
  rationale: 二つの並行する内容疑問を、日本語として自然につなぎながら選言的な関係を保った。
- source_word: εἴδωλον
  choice: 偶像
  rationale: 文脈上、単なる像ではなく礼拝対象としての偶像を指すため。
theological_decisions:
- issue: 偶像および偶像供物が「何かである」という問いの意味
  choice: 供物には「何か意味がある」、偶像には「何か実体がある」とする修辞疑問として訳す。
  alternative: 両方を一律に「何ものかである」または「何かである」と訳す。
  rationale: 原文の τί ἐστιν が持つ意義・効力・実在性の幅を残しつつ、日本語で理解可能にした。パウロが偶像を真の神として認めているとは訳文中で断定せず、後続の議論との神学的緊張も保持する。
translation_notes:
  register: 明瞭な現代標準日本語。修辞疑問の形を維持し、平易さと dignified な調子を両立させた。脚注標識 [a] は対応箇所に置いた。
