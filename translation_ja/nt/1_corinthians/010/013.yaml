reference: 1 Corinthians 10:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: ja
  text: あなたがたを襲った試練は、人に共通するもの以外にはありません。[a] 神は真実な方です。あなたがたが耐えられる以上に試練を受けることを許さず、試練とともに、それに耐えることができるよう、逃れる道をも備えてくださいます。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「人間的なもの以外には」。すなわち、人に共通する、人として経験し得るもの。
    reason: lexical_alternative
  - marker: b
    text: 「試練」「試練を受ける」は、「誘惑」「誘惑を受ける」とも訳せる。原語は、罪へ誘う誘惑と、信仰を試す試練のどちらも表し得る。
    reason: lexical_alternative
  - marker: c
    text: 「逃れる道」は、「出口」「脱出」「結末」とも訳し得る。ここでは、試練をただ回避するというより、それに耐えられるよう神が備える道を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: 試練／試練を受ける
  rationale: 語義には「誘惑」と「試練・試み」の両面がある。直前の罪と偶像礼拝への警告から「誘惑」も十分に可能だが、日本語の「神が誘惑を許す」という表現が神自身を罪へ誘う主体と誤解されないよう、意味の広い「試練」を本文に置き、「誘惑」を脚注に残した。
- source_word: εἴληφεν
  choice: 襲った
  rationale: 完了形が示す、すでに彼らの身に及び捕らえた経験を、自然な現代日本語で表す。
- source_word: εἰ μὴ ἀνθρώπινος
  choice: だれもが人として経験するもの以外には
  rationale: ἀνθρώπινοςの「人間的な、人に属する」という意味を、特別でも超人的でもない試練という文脈上の含意を含めて明瞭に表した。
- source_word: πιστός
  choice: 真実な方
  rationale: 神が信頼でき、約束に忠実であることを表す、聖書日本語として自然で格調ある表現。
- source_word: ἐάσει
  choice: 許さず
  rationale: ἐάωの許可・容認の意味を簡潔に保つ。
- source_word: ὑπὲρ ὃ δύνασθε
  choice: あなたがたが耐えられる以上に
  rationale: δύνασθεは直訳すれば「できる」だが、後半のὑπενεγκεῖνとの関係を明らかにして日本語として自然にした。
- source_word: ποιήσει
  choice: 備えてくださいます
  rationale: ποιέωは広く「作る・もたらす」を意味するが、ἔκβασιςとの結びつきでは、神が脱出・突破の道を設けることを表す。敬意を示す補助動詞は日本語の自然な聖書文体に合わせた。
- source_word: σὺν τῷ πειρασμῷ
  choice: 試練とともに
  rationale: 神の備えが試練に伴うことを示し、試練が直ちに除去されるとは限定しない。
- source_word: ἔκβασιν
  choice: 逃れる道
  rationale: 「出口・脱出・成り行き」の意味範囲のうち文脈に適する表現。ただし後続句は、その道が単なる回避ではなく忍耐を可能にするものであることを示す。
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: それに耐え抜くことができるよう
  rationale: 冠詞付き不定詞の目的・結果の含みを「よう」で表し、ὑποφέρωの「下で支える、耐え通す」という力を「耐え抜く」で示した。
theological_decisions:
- issue: πειρασμόςが「誘惑」か「試練」か
  choice: 本文では「試練」とし、「誘惑」を脚注に示す。
  alternative: 本文を「誘惑」とする。
  rationale: 語そのものは両義的であり、直前の文脈には罪への誘惑が強く響く一方、節全体は人が受ける圧迫や試みも含み得る。本文で意味を狭めすぎず、脚注によって道徳的誘惑の含みを保存した。
- issue: ἔκβασιςと忍耐の関係
  choice: 「逃れる道」を、試練に耐え抜けるよう神が備えるものとして訳す。
  alternative: 試練そのものから即座に脱出させる道と解する。
  rationale: 後続のτοῦ δύνασθαι ὑπενεγκεῖνは、神の備えの目的・結果が忍耐であることを明示する。したがって、逃れることと耐えることの緊張を解消せず、そのまま保った。
- issue: 神の真実さと試練の制限
  choice: 神が人の耐えられる限度を越える試練を許さず、同時に道を備えると述べる。
  alternative: 信徒自身の力だけで、あらゆる苦難に耐えられるという一般命題として読む。
  rationale: 本文は能力の限度だけでなく、神の真実さと神によるἔκβασιςの備えを中心に据えている。人間の自足を読み込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神は真実な方です」「備えてくださいます」によって聖書本文にふさわしい品位を保った。「耐える」を反復する構造は原文後半の論理を明らかにするため意図的に保持した。
