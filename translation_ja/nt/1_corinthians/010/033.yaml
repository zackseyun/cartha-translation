id: 1CO.10.33
reference: 1 Corinthians 10:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: ja
  text: 私も同じように、すべての人を、あらゆることにおいて喜ばせています。[a] 自分自身の利益ではなく、多くの人の利益を求めているのです。[b] それは、彼らが救われるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あらゆることを、すべての人のために」とも訳せます。すべての人の益のために幅広く配慮することを表しています。
    reason: lexical_alternative
  - marker: b
    text: 「利益」は「益」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: 私も同じように
  rationale: καθὼςの比較の働きと、κἀγώの「私も」を自然な日本語で表し、直前の勧めに対するパウロ自身の模範を示した。
- source_word: πάντα πᾶσιν
  choice: あらゆることにおいて、すべての人に
  rationale: 中性複数πάνταと与格複数πᾶσινの広い範囲を保ち、9章22節の異なる表現をそのまま持ち込まずに訳した。
- source_word: ἀρέσκω
  choice: 喜ばれるようにしています
  rationale: 基本義である「喜ばせる／気に入られる」を保ちつつ、日本語では他者に配慮して行動する継続的な姿勢として自然に表した。後続句が、迎合や自己目的の人気取りではないことを明らかにする。
- source_word: μὴ ζητῶν
  choice: 求めているのではなく
  rationale: 現在分詞が表す継続的な動機・行動様式を、主文との関係が明瞭な日本語にした。
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: 自分自身の利益
  rationale: σύμφορονの「有益なもの、利益」を簡潔に表し、後半との対比を保った。
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: 多くの人の利益
  rationale: 省略されたσύμφορονを日本語では補い、τῶν πολλῶνを「多くの人」として原文の範囲表現を維持した。
- source_word: ἵνα σωθῶσιν
  choice: それは、彼らが救われるためです
  rationale: ἵναの目的と、σωθῶσινの受動態および救済的意味を保ち、救う主体を訳文で不必要に特定しなかった。
theological_decisions:
- issue: σωθῶσινの意味と範囲
  choice: 「彼らが救われる」と訳し、パウロ書簡に通常見られる救済的意味を保つ
  alternative: 「彼らが助けられる」「守られる」
  rationale: 周囲の文脈は他者の究極的な益を求める福音的関心を示しているため、単なる社会的援助へ弱めず、同時に受動表現のまま救いの主体を明示しなかった。
- issue: ἀρέσκωが表す他者への姿勢
  choice: 「すべての人に喜ばれるようにしています」とし、他者の益のための配慮として読む
  alternative: 人の承認を得るための迎合と読む
  rationale: 「自分自身の利益ではなく、多くの人の利益を求める」という直後の限定が、この行為の目的を規定している。語の基本義は保ち、教理的説明を本文に加えなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、礼拝朗読にも耐える落ち着いた文体とした。「喜ばれるようにしています」は現代日本語として自然であり、後続する利益の対比によって単なる迎合ではないことが分かる構成にした。
