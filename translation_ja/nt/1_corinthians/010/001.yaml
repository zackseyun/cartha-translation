id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: ja
  text: というのも、兄弟たち[a]、あなたがたにこのことを知らないでいてほしくないのです。私たちの父祖は皆、雲の下におり、皆、海を通り抜けました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は、男女を含む会衆全体への呼びかけとして用いられることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: 私は、あなたがたに……知らずにいてほしくありません
  rationale: 否定された不定詞を用いるパウロ特有の言い回しを保ちつつ、現代日本語として自然にした。「知ってほしい」では原文の否定表現が失われるため採らない。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の議論を説明する接続機能を表す。日本語では「というのも」が説明的なつながりを自然に示す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原語の男性複数形と家族的な呼びかけを本文で保った。会衆全体を指し得ることは脚注で明示する。
- source_word: οἱ πατέρες ἡμῶν
  choice: 私たちの父祖
  rationale: コリントの信徒たちをイスラエルの歴史と結び付ける「私たちの」という表現と、πατέρεςの父系的・家族的な語感を保つ。
- source_word: πάντες
  choice: 皆
  rationale: この段落で重要なπάντεςの反復を、二か所とも同じ語で明確に再現する。
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: 皆、雲の下におり
  rationale: 出エジプトの荒野で民を導いた雲への言及を、過度な説明を加えずに保つ。
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: 皆、海を通り抜けました
  rationale: διάとδιέρχομαιが表す、海の中を経由して進む動きを自然な日本語で表現する。
theological_decisions:
- issue: 男女を含む会衆への呼びかけにおけるἀδελφοίの訳
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 本文では原語の男性複数形を保つ一方、文脈上は会衆全体への呼びかけであることを脚注に示し、原語の形と包括的な指示範囲の双方を伝える。
- issue: 異邦人を含む教会とイスラエルとの「私たちの父祖」による共同体的な結び付き
  choice: 私たちの父祖
  alternative: 私たちの先祖
  rationale: 「私たちの」を保つことで、パウロがコリントの信徒たちをイスラエルの物語に組み入れて語る修辞的・神学的力を弱めない。また「父祖」はπατέρεςの家族的表現を反映する。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「父祖」により原文の家族的・歴史的な響きを残した。「次のこと」を補ってὅτι以下との構文関係を自然に示し、原文の意味を追加してはいない。
