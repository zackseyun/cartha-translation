  rationale: 直前の議論を受けて結論を導く強い推論接続詞。現代日本語で論理的なつながりを自然に示す。
- source_word: ἀγαπητοί μου
  choice: 私の愛する人たち
  rationale: 呼びかけに込められたパウロの愛情と親密さを保ちつつ、現代の読者にも明瞭な表現とした。
- source_word: φεύγετε
  choice: 逃れなさい
  rationale: 現在命令形の切迫した回避命令を表す。「避けなさい」より強く、危険から離れるという動詞の力を保つ。
- source_word: ἀπὸ
  choice: から
  rationale: φεύγωに続いて、避ける対象からの分離を示す標準的な訳。
- source_word: τῆς εἰδωλολατρίας
  choice: 偶像礼拝
  rationale: 偶像を礼拝し仕える行為を指す語であり、文脈上の異教祭儀への参与も含みうる、明瞭で一般的な日本語表現。
theological_decisions:
- issue: 禁止命令の範囲
  choice: 偶像礼拝と、それに結びつく実践への参与から離れるよう命じる直接的な命令
  alternative: 心の中で偶像に傾倒することだけを禁じる狭い警告
  rationale: 直前後の文脈では異教の祭儀的な食事や実践への参与が問題となっている。訳文は一般的な「偶像礼拝」を用い、内面だけに限定せず、同時にギリシア語以上に具体化しない。
translation_notes:
