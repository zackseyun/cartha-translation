  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: ja
  text: 私が感謝して[a]食べるのなら、なぜ私が感謝しているものについて悪く言われるのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恵みによって食べるのなら」。ギリシア語の χάριτι は「恵みによって」とも訳せるが、ここでは後半の「感謝している」とのつながりから「感謝して」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: 感謝して
  rationale: 食物について論じる文脈と、後半の εὐχαριστῶ（「感謝をささげる」）とのつながりを自然に表す。与格の副詞的・手段的な含みを保ちつつ、救済論的な意味を不必要に持ち込まない。
- source_word: μετέχω
  choice: 食べる
  rationale: 動詞自体は「分け前にあずかる、共にする」を意味するが、直前から続く食物の文脈では、日本語では「食べる」が最も自然で明瞭である。目的語が原文で明示されていないことにも配慮した。
- source_word: βλασφημοῦμαι
  choice: 悪く言われる
  rationale: ここでは神への冒瀆ではなく、食べる行為を理由に人が非難・中傷されることを指す。語義の幅を保ちながら、現代日本語で自然に表した。
- source_word: ὑπὲρ οὗ
  choice: もののことで
  rationale: 非難の理由・根拠を示す表現として訳した。「もの」は文脈上、食べる物を指すが、原文同様に一般的な言い方を保った。
- source_word: εὐχαριστῶ
  choice: 感謝をささげている
  rationale: 「感謝する」の意。感謝の相手は文脈上神だが、ギリシア語本文に目的語が明示されていないため、「神に」は補わなかった。
- source_word: ἐγὼ ... ἐγὼ
  choice: 私が…私が
  rationale: 二度の明示的な人称代名詞による強調を日本語でも残した。
- source_word: τί
  choice: なぜ
  rationale: 修辞疑問における理由の問いとして自然に訳した。
theological_decisions:
- issue: 食事との関係における χάριτι の意味
  choice: 感謝して
  alternative: 恵みによって
  rationale: 直後の「感謝をささげている」との語義的な連関から、食事に伴う感謝を表すと理解するのが文脈に適う。ただし「恵みによって」という語義も可能なので脚注に残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、修辞疑問の調子を「のでしょうか」で表した。「感謝をささげる」は礼拝的文脈にふさわしい品位を保ちつつ、感謝の相手を本文に補わない表現とした。
