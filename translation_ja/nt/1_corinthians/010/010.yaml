  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: ja
  text: また、彼らの中のある者が不平を言い、滅ぼす者[a]によって滅ぼされたように、不平を言ってはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「滅ぼす御使い」。ギリシア語は「滅ぼす者」であり、荒野におけるイスラエルへの裁きに関わる滅ぼす者を暗示している可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: また、…してはなりません
  rationale: 直前から続く一連の警告とのつながりを、現代日本語として自然な「また」で示した。
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: 不平を言ってはなりません／不平を言い
  rationale: γογγύζωが表す、不満を抱いてぶつぶつ訴える意味を、古風にならない明瞭な日本語で表した。同じ語根には同じ表現を用いた。
- source_word: καθάπερ
  choice: …されたように
  rationale: イスラエルの例と読者への警告との比較関係を明確に示す。
- source_word: τινὲς αὐτῶν
  choice: 彼らのうちのある者たち
  rationale: 部分を表す表現を保ち、文脈上のイスラエル人全員ではなく、その中の一部を指すことを明示した。
- source_word: ἀπώλοντο
  choice: 滅ぼされた
  rationale: 後続する行為者を示すὑπό句と対応させ、外部の行為者による滅びを明確にした。
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: 滅ぼす者によって
  rationale: ギリシア語が明示する称号的な実体詞をそのまま保ち、「御使い」と特定する解釈を本文に加えなかった。
theological_decisions:
- issue: ὁ ὀλοθρευτήςの正体
  choice: 滅ぼす者
  alternative: 滅ぼす御使い
  rationale: 原文は破壊を行う存在を「滅ぼす者」と呼ぶだけで、その正体を明示していない。本文ではこの曖昧さを保ち、より限定的な理解は脚注に示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、警告としての厳粛さを保った。比較節を先に置くことで、日本語として意味の流れを明確にした。
