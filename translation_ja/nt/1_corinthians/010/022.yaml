  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: ja
  text: それとも、私たちは主をねたませているのでしょうか。まさか、私たちが主より強いのでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: ねたみを引き起こそうとしている
  rationale: 「ねたみを起こさせる／ねたませる」という使役的な意味を自然な現代日本語で表した。文脈上、主に対する挑発を含むが、語が明示する「ねたみ」を保持した。
- source_word: τὸν κύριον
  choice: 主
  rationale: 新約聖書で定着した κύριος の訳語を用い、指示対象を本文以上に限定しない。
- source_word: μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν
  choice: 私たちは主より強いわけではないでしょう
  rationale: 否定の答えを予期する修辞疑問を、比較級の意味と警告の調子を保ちながら自然に表した。代名詞 αὐτοῦ は日本語で参照先を明確にするため「主」とした。
theological_decisions:
- issue: 主の「ねたみ」の表現
  choice: ねたみ
  alternative: 憤り／怒り
  rationale: 旧約的背景を持つ神の契約的な熱情を含み得るため、一般的な感情語へ置き換えず、原語 ζηλόω 系の表現を保持した。
- issue: 第二文の修辞疑問
  choice: 否定を予期する「ではないでしょう」
  alternative: 「私たちは主より強いのでしょうか」
  rationale: μή が否定の答えを予期することを日本語に反映した。ただし断定文にはせず、原文の修辞疑問としての力を保った。
translation_notes:
  register: 明快な現代標準語。警告的で荘重な調子を保ちつつ、過度に古風な「妬みを惹起する」などは避けた。
