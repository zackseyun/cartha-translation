id: 1CO.10.32
reference: 1 Corinthians 10:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: ja
  text: ユダヤ人にも、ギリシア人[b]にも、神の教会にも、つまずきの原因とならないようにしなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれの妨げにもならないようにしなさい」または「非難されるところのない者でありなさい」。
    reason: lexical_alternative
  - marker: b
    text: ここで「ギリシア人」は、パウロの時代の文脈では非ユダヤ人を広く指している可能性が高い。ただし、ギリシア語本文は明確に「ギリシア人」としている。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: つまずきの原因とならないように
  rationale: この語は、他者をつまずかせたり、妨げとなったりしないことを表し得る。文脈では自分の利益でなく多くの人の益を求めるよう勧めているため、対人関係上の意味が明確に伝わる自然な表現とした。
- source_word: γίνεσθε
  choice: しなさい
  rationale: 現在命令形の継続的な勧告を、現代日本語で自然な命令表現として示した。ἀπρόσκοποιと一体で「原因とならないようにしなさい」と訳した。
- source_word: Ἰουδαίοις
  choice: ユダヤ人にも
  rationale: ここではユダヤ地方の住民に限定せず、民族的・宗教的集団としてのユダヤ人を指す。並列を示す与格は「にも」で表した。
- source_word: Ἕλλησιν
  choice: ギリシア人にも
  rationale: 語そのものは「ギリシア人」であり、この文脈では非ユダヤ人を広く指す可能性が高い。本文では一般化して「異邦人」とせず、原語の表現を保持した。
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: 神の教会にも
  rationale: パウロ書簡でἐκκλησίαは信者の共同体を指す通常の語であり、日本語として定着した「教会」を用いた。属格は「神の」として保持した。
theological_decisions:
- issue: 倫理的勧告が対象とする集団の区分
  choice: ユダヤ人、ギリシア人、神の教会という、本文が明示する三つの集団をそのまま並べる。
  alternative: 「ギリシア人」を広く「異邦人」と訳し、ユダヤ人・異邦人・教会という区分を明示する。
  rationale: 本文は三つの対象を明記している。「ギリシア人」が当時の非ユダヤ人を広く指し得ることは注記するが、本文では原語以上に範囲を確定しない。
- issue: ἀπρόσκοποιの倫理的含意
  choice: 他者のつまずきの原因とならないようにする勧告として訳す。
  alternative: 「非難されるところのない者でありなさい」と、本人の無過失性を前面に出して訳す。
  rationale: 直後に三つの集団が与格で続き、前後の文脈も他者の益への配慮を扱うため、他者への妨げを避ける関係的な意味が適切である。ただし語の別の含みは脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の調子は保ちつつ過度に硬い文語を避けた。「にも」の反復によって三つの対象を等しく明示し、「神の教会」は聖書本文にふさわしい簡潔で品位ある表現とした。
