  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: ja
  text: 肉市場で売られているものは何でも、良心のために何も詮索せず、食べなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何も調べず」または「何も問いたださず」とも訳せる。肉の由来を詮索しない、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: 売られているものは何でも
  rationale: 冠詞を伴う中性句の実質的な用法と包括的な意味を、自然な日本語で表した。
- source_word: ἐν μακέλλῳ
  choice: 肉市場で
  rationale: μάκελλονは一般的な市場ではなく食肉を扱う市場を指すため、「肉市場」とした。
- source_word: ἐσθίετε
  choice: 食べなさい
  rationale: 現在能動命令形を、直接的かつ自然な日本語の命令表現で訳した。
- source_word: μηδὲν ἀνακρίνοντες
  choice: 何も詮索せず
  rationale: ここでは肉の由来や背景を調べたり問いただしたりしないことを指す。「詮索せず」は調査と質問の両面を簡潔に表す。
- source_word: διὰ τὴν συνείδησιν
  choice: 良心のために
  rationale: διά＋対格の理由・動機を表しつつ、この節だけでは誰の良心かを特定しない表現とした。
theological_decisions:
- issue: 「良心」の指示対象
  choice: 「良心」とのみ訳し、誰の良心かを特定しない
  alternative: 「自分の良心」または「相手の良心」
  rationale: ギリシア語本文は単に「その良心」と述べ、この節だけでは指示対象が明示されないため、後続文脈に先立って曖昧さを解消しない。
translation_notes:
  register: 明快な現代標準日本語。命令の直接性を保ちながら、日常的すぎない端正な文体とした。
