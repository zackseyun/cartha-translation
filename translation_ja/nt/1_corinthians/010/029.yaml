source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: ja
  text: ここで言う良心とは、自分の良心ではなく、相手の良心のことです。[a] なぜ私の自由が、ほかの人の良心によって判断されるのでしょうか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「自分自身のものではなく、別の人のもの」です。文脈上、「自分の良心ではなく、相手の良心」という意味に理解できます。
    reason: lexical_alternative
  - marker: b
    text: この修辞的な問いは、パウロ自身の問いとも、パウロが引用符なしで提示する反論とも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν / συνειδήσεως
  choice: 良心
  rationale: 行為を道徳的に判断する内面的意識を指すパウロ書簡の標準的な語義であり、現代日本語でも最も明確で自然。
- source_word: δὲ λέγω
  choice: ここで言う…とは、…のことです
  rationale: 直前の発言の意味を明確にする説明的用法を、不要な時間表現を加えず自然な日本語で示す。
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: 自分の良心ではなく、相手の良心
  rationale: ギリシア語の対比を保ちつつ、文脈上の聞き手を含み得る「自分」と、問題となっている別の人を示す「相手」で自然に表現する。
- source_word: ἱνατί γὰρ
  choice: それにしても、なぜ
  rationale: γάρの前文との論理的つながりと、ἱνατίの修辞的な問いを、日本語として不自然な直訳を避けながら表す。
- source_word: ἐλευθερία
  choice: 自由
  rationale: 許されている行為に関するパウロの議論に合い、現代日本語で簡明。
- source_word: κρίνεται
  choice: 裁かれる
  rationale: 他者の良心によって判断を受けるという広い意味を保ち、「罪に定められる」とまでは限定しない。
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: ほかの人の良心によって
  rationale: 受動文の行為主体を明示し、直訳的な「別の良心」よりも日本語で分かりやすくする。
theological_decisions:
- issue: 第一文の再帰代名詞ἑαυτοῦの指示対象
  choice: 文脈に即して「自分の良心」とし、読者自身の良心と相手の良心を対比する
  alternative: 字義どおり三人称として「彼自身の良心ではなく、別の人の良心」とする
  rationale: 形態上は三人称単数だが、直前からの勧告では読者に向けて、問題を告げた相手の良心を配慮するよう説明している。ただし字義的な形は脚注で示す。
- issue: 第二文の修辞疑問の話者と機能
  choice: 話者交代を本文で明示せず、修辞的な問いとして保持する
  alternative: コリント側の反論として引用符を付ける、またはパウロ自身の主張として確定する
  rationale: ギリシア語本文に話者交代を示す引用符等はなく、パウロ自身の問いとも想定上の反論とも解し得るため、曖昧さを残す。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「ここで言う…とは」で説明的な流れを示し、解釈上の曖昧さは脚注に残した。
