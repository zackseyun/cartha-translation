source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: ja
  text: そして皆が同じ霊的な飲み物を飲みました。彼らは、彼らに付き従っていた霊的な岩から飲んでいたからです。その岩はメシアでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: 霊的な飲み物
  rationale: 「霊的」は、単に非物質的という意味に狭めず、御霊の領域に属する神からの備えという含みを保つ。また、前節の「霊的な食べ物」との並行も維持する。
- source_word: ἔπιον
  choice: 飲みました
  rationale: アオリストの直説法として、荒野の世代が皆共有した経験を全体的に述べる。
- source_word: ἔπινον
  choice: 飲んでいた
  rationale: 未完了過去の継続・反復的な側面を表し、前半のアオリスト「飲みました」と区別する。
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: 自分たちについて来る霊的な岩から
  rationale: 無冠詞の πέτρα を不定的な「霊的な岩」とし、現在分詞 ἀκολουθούσης の継続的な動きを自然な日本語の「ついて来る」で保つ。
- source_word: πέτρα
  choice: 岩
  rationale: 小石ではなく岩・岩盤を指し、比喩的・予型的な力も保つ。
- source_word: ἡ πέτρα δὲ ἦν
  choice: その岩は……でした
  rationale: δέ の弱い接続を日本語では文脈上自然な独立文として表し、直前の岩を「その岩」で受ける。
- source_word: ὁ Χριστός
  choice: メシア
  rationale: ここでは固有名のような「キリスト」よりも称号として機能しており、油注がれた者という意味を表す「メシア」が適切である。
- source_word: πάντες τὸ αὐτὸ
  choice: 皆が同じ
  rationale: 集団全体が同一の経験を共有したというパウロの強調を明確に保つ。
theological_decisions:
- issue: 「その岩はメシアでした」という同定
  choice: ギリシア語の等位文をそのまま「その岩はメシアでした」と訳す。
  alternative: 「その岩はメシアを表していました」
  rationale: 本文は単なる象徴表現へと言い換えず、岩とメシアを直接結びつける。物質的な岩と人格を哲学的に同一視する説明も加えず、パウロの予型的・キリスト論的主張の緊張を保持する。
- issue: 食物・飲み物・岩に用いられる「霊的」の意味
  choice: 「霊的」を保持する。
  alternative: 「象徴的」または「超自然的」
  rationale: 「象徴的」や「超自然的」と限定すると πνευματικός の意味領域を狭めるため、神からの備えと予型的意義の双方を含み得る表現を残す。
translation_notes:
  register: 明瞭で現代的な敬体。原文の二つの過去時制の違いを「飲みました／飲んでいた」で示し、説明を加えずに神学的な同定を保った。
