source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: ja
  text: また、私たちは、彼らの中のある者たちが性的不品行を行い、一日のうちに二万三千人[b]が倒れた[a]ように、性的不品行を行ってはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「倒れた」は、「死んだ」または「打ち倒された」とも訳せる。ギリシア語は文字どおりには「倒れた」で、この文脈では裁きによる死を指す表現である。
    reason: lexical_alternative
  - marker: b
    text: 民数記25章9節は二万四千人と記す。ここでパウロは「一日のうちに」二万三千人が倒れたと述べており、その日に死んだ人数と全体の人数を区別している可能性もあるが、本文では調和させず、パウロの記す数をそのまま訳した。
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: また……てはなりません
  rationale: 勧告を表す接続法とともに、直前から続く禁止を示す。現代日本語として自然な形で連続性と禁止の力を保った。
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: 性的不品行を行う／行った
  rationale: πορνεύωの広い道徳的意味を、古風または範囲の狭い語に限定せず表す。同じ動詞の反復も訳文で保った。
- source_word: καθώς
  choice: ように
  rationale: 荒野のイスラエルの事例との比較を自然な日本語で示す。
- source_word: τινες αὐτῶν
  choice: 彼らのうちのある者たち
  rationale: 荒野の世代の全員ではなく、その一部を指す原文の限定を明示する。
- source_word: ἔπεσαν
  choice: 倒れた
  rationale: πίπτωの比喩的な表現を保持する。文脈上は裁きによる死を指すが、本文では明示化しすぎず、脚注で説明する。
- source_word: μιᾷ ἡμέρᾳ
  choice: 一日のうちに
  rationale: 時間の範囲を表す与格を自然に訳し、裁きが一日に集中したことを伝える。
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: 二万三千人
  rationale: SBLGNTの数をそのまま訳し、民数記との見かけ上の相違を本文で調和させない。
theological_decisions:
- issue: 民数記25章9節の人数との関係
  choice: 本文ではパウロが記す「二万三千人」をそのまま保持する。
  alternative: 「二万四千人」に調和させる、または一方を小計、他方を総計と断定する。
  rationale: コリントの信徒への手紙一のギリシア語本文は明確に二万三千人と記す。翻訳で相違を解消せず、可能な説明は脚注にとどめる。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「性的不品行」は原語の広がりを保ち、「姦淫」など特定の行為だけに狭めない。脚注記号は、それぞれ「倒れた」と人数の相違に関する注として節末に配置した。
