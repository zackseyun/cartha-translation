id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: ja
  text: これらのことは、彼らが悪いものを欲しがったように、私たちが悪いものを欲しがる者とならないための実例[a]となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「型」「パターン」。
    reason: τύποιには、実例、型、パターンという意味の幅があるため。
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 直前に語られた荒野での出来事をまとめて指す中性複数の指示語。解釈を加えすぎず、自然な日本語とした。
- source_word: δὲ
  choice: 無訳
  rationale: 移行・説明を示す弱い接続辞であり、この一節だけでも日本語では明示しないほうが自然。強い逆接は含意させない。
- source_word: τύποι
  choice: 実例
  rationale: ここでは過去の出来事が読者への教訓的な先例となる意。専門的な類型論に限定せず、脚注で「型」「模範」の可能性を示す。
- source_word: ἡμῶν
  choice: 私たちのための
  rationale: τύποιとの属格関係を、日本語で目的・適用対象が明瞭になるように表現した。
- source_word: ἐγενήθησαν
  choice: となりました
  rationale: 単に「であった」ではなく、実例としての働きを持つに至ったというγίνομαιの語感を保つ。
- source_word: εἰς τὸ μὴ εἶναι
  choice: ならないため
  rationale: 目的または結果を表し得る構文。文脈上の警告の目的を自然に示しつつ、「者となる」という原文のεἶναιを反映した。
- source_word: ἐπιθυμητὰς κακῶν
  choice: 悪いものを欲しがる者
  rationale: 名詞ἐπιθυμητάςを「欲しがる者」として保持し、κακῶνをその対象として表した。「情欲」は性的意味に狭まりやすいため避けた。
- source_word: καθὼς κἀκεῖνοι
  choice: 彼らと同じように
  rationale: 比較を示すκαθὼςと、加算的なκαίを含むκἀκεῖνοιを簡潔で自然に表現した。
- source_word: ἐπεθύμησαν
  choice: 欲しがる
  rationale: ἐπιθυμητάςとの語根上の反復が日本語でも分かるよう、同じ「欲しがる」を用いた。時制関係は「彼らと同じように」と主節全体から明らかである。
theological_decisions:
- issue: 荒野の出来事に対するτύποιの意味
  choice: 倫理的警告となる「実例」
  alternative: 「型」または「模範」
  rationale: 直近の文脈は教会への戒めを中心としているため、特定の類型論体系を持ち込まず、教訓的な先例という機能を前面に出した。語の幅は脚注に残した。
- issue: ἐπιθυμέω系の欲望の強さと範囲
  choice: 「欲しがる」
  alternative: 「むさぼる」「情欲を抱く」
  rationale: 対象は広く「悪いもの」であり、性的欲望に限定されない。「むさぼる」よりも原語の広い意味範囲を保ち、悪性は「悪いもの」が明示する。
- issue: εἰς τὸによる目的と結果の関係
  choice: 「ため」として目的を前面に出す
  alternative: 「その結果……ならないように」
  rationale: 勧告的文脈では目的表現が最も自然だが、過去の出来事が警告として機能したという結果的な含みも排除しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。「欲しがる者とならないため」は日常語としてやや重みがあるが、原文の名詞表現とεἶναιを反映し、彼らのような性向を持つ者になるなという警告を保持する。
