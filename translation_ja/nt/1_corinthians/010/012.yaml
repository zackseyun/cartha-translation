  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: ja
  text: ですから、自分は立っていると思う人は、倒れないように気をつけなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前に挙げられた警告的な実例から結論を導く接続詞として、推論の力を保ちつつ現代日本語で自然に表した。
- source_word: ὁ δοκῶν
  choice: 自分は…と思う人
  rationale: 冠詞付き現在分詞の名詞的用法を、単数の代表的表現として自然な日本語にした。「思い込んでいる」とすると誤認の含意が強まりすぎるため避けた。
- source_word: ἑστάναι
  choice: 立っている
  rationale: ἵστημι の完了不定詞が示す、立った状態にあることを保った。「堅く立っている」は原文に明示されない強調を加えるため採らなかった。
- source_word: βλεπέτω
  choice: 気をつけなさい
  rationale: 継続的な警戒を促す現在命令形を、明瞭で自然な警告表現にした。
- source_word: μὴ πέσῃ
  choice: 倒れないように
  rationale: 命令に続く μή とアオリスト接続法の否定的目的・警告を自然な日本語で表した。「倒れる」の意味を罪、裁き、背教のいずれかに限定していない。
theological_decisions:
- issue: 「倒れる」の意味
  choice: 意味を限定せず「倒れる」とする
  alternative: 罪に陥る／裁きを受ける／信仰から離れる
  rationale: 文脈はイスラエルの失敗を踏まえて過信を戒めるが、πέσῃ 自体は倒れることの具体的内容を一つに限定しないため、原文の幅と神学的緊張を保った。
- issue: ギリシア語の代表的男性単数の日本語表現
  choice: 「人」を用い、後続では主語を省略する
  alternative: 「彼は…彼が…」と男性単数を明示する
  rationale: 日本語では「人」が性別を不必要に限定せず、単数の代表的用法も自然に表せる。原文の数を複数化せず、意味上の一般性を保持した。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。警告の直接性を維持しつつ、古風な「心せよ」などは避けた。
