id: 1CO.10.31
reference: 1 Corinthians 10:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: ja
  text: ですから、食べるにしても、飲むにしても、何をするにしても、すべてを神の栄光のためにしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: ～にしても、～にしても、～にしても
  rationale: 選択肢となる場合を並べる相関表現を、自然な現代日本語で保つ。三つの節の反復による修辞的な構造も維持する。
- source_word: οὖν
  choice: ですから
  rationale: 直前までの議論を受けた結論・帰結を示す。明快でありながら、勧告にふさわしい丁寧で格調ある接続表現である。
- source_word: ἐσθίετε
  choice: 食べる
  rationale: 現在形は進行中の一回的行為ではなく、一般的な行為を表すため、日本語でも非過去形を用いる。
- source_word: πίνετε
  choice: 飲む
  rationale: ἐσθίετεと同じく一般的な行為を示す。簡潔な非過去形が文脈に適する。
- source_word: τι ποιεῖτε
  choice: 何をする
  rationale: 不定代名詞τιと動詞ποιεῖτεの組み合わせが、飲食以外のあらゆる行為へ範囲を広げることを自然に表す。
- source_word: πάντα
  choice: すべてを
  rationale: あらゆる事柄を包含する語の広い範囲を、明瞭な現代日本語で表す。
- source_word: εἰς δόξαν θεοῦ
  choice: 神の栄光のために
  rationale: εἰςが示す目的・目標を「～のために」で表し、θεοῦとδόξανの属格関係を「神の栄光」として保持する。
- source_word: ποιεῖτε
  choice: しなさい
  rationale: 形態上は現在命令形であり、継続的・一般的な勧告として自然な命令表現にする。過度に硬い「行いなさい」よりも、広範な行為を含むποιέωに適する。
theological_decisions:
- issue: 勧告が及ぶ範囲
  choice: 飲食を具体例としつつ、あらゆる行為を神の栄光に向けるよう求める包括的な勧告として訳す。
  alternative: 食物と飲み物をめぐる問題だけに限定された指示として訳す。
  rationale: 「何をするにしても」と「すべてを」が、直近の飲食問題から一般原則へ明示的に範囲を広げている。ただし、その原則が飲食をめぐる直前の議論から導かれていることは「ですから」によって保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、口語的すぎず古風すぎない、礼拝朗読にも個人読書にも適した文体とした。「～にしても」の三重反復によって原文の並行構造と包括性を保った。
