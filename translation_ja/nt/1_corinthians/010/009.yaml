  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: ja
  text: また、彼らの中のある者たちがメシア[a]を試したように、私たちもメシアを試してはなりません。彼らは蛇によって滅ぼされていきました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「メシア」の代わりに「主」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: また、～してはなりません
  rationale: 直前から続く一連の禁止を示す接続辞の働きと、一人称複数の勧告的接続法を、自然で明確な現代日本語の禁止表現で表した。
- source_word: ἐκπειράζωμεν
  choice: 試してはなりません
  rationale: 相手を不当に試すという否定的含意が文脈から明らかであり、日本語では目的語とともに「試す」で簡潔かつ自然に伝わる。
- source_word: τὸν Χριστόν
  choice: メシア
  rationale: Χριστόςを称号として訳し、SBLGNT本文の読みを反映した。日本語では冠詞を別個に表さない。
- source_word: καθώς
  choice: ～ように
  rationale: 荒野の世代の行為を現在の警告と比較する機能を自然に表す。
- source_word: τινες αὐτῶν
  choice: 彼らのうちのある者たち
  rationale: 荒野のイスラエル全員ではなく、その中の一部を指すことを明示した。
- source_word: ἐπείρασαν
  choice: 試した
  rationale: 歴史上の行為をアオリストに即して簡潔に表した。目的語「メシア」は、日本語で指示対象を明確に保つため補った。
- source_word: ὑπὸ τῶν ὄφεων
  choice: 蛇に
  rationale: ὄφιςの通常の現代日本語訳。「へび」よりも聖書本文にふさわしい品位を保つため漢字表記とした。
- source_word: ἀπώλλυντο
  choice: 滅ぼされていきました
  rationale: 受動的な破滅と未完了過去の進行的・継続的な相を、日本語として無理のない表現で示した。
theological_decisions:
- issue: τὸν Χριστόνの本文と指示対象
  choice: メシア
  alternative: 主
  rationale: SBLGNTの採用本文Χριστόνを訳し、荒野で試された方をメシアとする本文の神学的緊張をそのまま保持した。一方、有力な異読「主」は脚注で明示した。
translation_notes:
  register: 明瞭で現代的ながら、勧告と裁きの厳粛さを保つ丁寧体。英語版の脚注bは「snakes / serpents」という英語上の語彙差であり、日本語の「蛇」には対応する有意な別訳がないため採用しなかった。本文中の脚注記号[a]は異読に関係する「メシア」の直後ではなく節末に置いたが、脚注内容との対応は明確である。
