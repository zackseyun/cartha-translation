  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: ja
  text: 血統上のイスラエルについて考えてみてください。[a] いけにえを食べる人たちは、祭壇にあずかる者ではありませんか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉に従うイスラエル」。別訳「民族としてのイスラエル」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「祭壇と交わりを持つ者」または「祭壇を共にする者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: 見てください
  rationale: 複数への命令で、単なる視覚ではなく、例として注意深く考察するよう促す語。日本語では文脈上「見てください」が自然にその働きを担う。
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: 肉によるイスラエル
  rationale: パウロ特有の「肉」という表現とその曖昧さを保持する。ここでは自然的・血統的なイスラエルを指すが、それを本文で説明し切らず脚注に示す。
- source_word: οὐχ ... εἰσίν;
  choice: …ではありませんか
  rationale: 肯定の答えを予期する修辞疑問を自然な日本語で表す。
- source_word: οἱ ἐσθίοντες
  choice: 食べる人たち
  rationale: 現在分詞の具体的な行為を保ち、「あずかる」と意訳して後続の κοινωνοί と重複させない。
- source_word: τὰς θυσίας
  choice: いけにえ
  rationale: 祭儀でささげられた犠牲を指す、現代の聖書文体として明瞭で簡潔な語。
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: 祭壇にあずかる者
  rationale: κοινωνός の参与・共有の意味と、属格が示す祭壇との関係を、日本語として自然に表す。「祭壇そのものの一部になる」という意味には限定しない。
theological_decisions:
- issue: 「肉によるイスラエル」の意味
  choice: 本文では「肉によるイスラエル」としてパウロの表現を保持する
  alternative: 血筋によるイスラエル／民族としてのイスラエル
  rationale: この文脈では自然的・血統的なイスラエルを指す可能性が高いが、イスラエルと教会についての広範な教理的結論を翻訳に持ち込まず、表現の神学的緊張を残す。
- issue: 祭壇への参与の性質
  choice: 「祭壇にあずかる者」とする
  alternative: 祭壇と交わりを持つ者／祭壇を共にする者
  rationale: 供犠の食事が祭壇によって表される祭儀的交わりへの現実の参与を伴うという論旨を示しつつ、その関係を必要以上に形而上学的に規定しない。
translation_notes:
  register: 明瞭で現代的ながら、議論を進めるパウロの修辞疑問にふさわしい端正な文体。「肉」は理解を助ける脚注を付しつつ本文に残し、「いけにえ」「祭壇にあずかる」で祭儀的背景を簡潔に表現した。
