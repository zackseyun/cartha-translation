id: 1CO.10.17
reference: 1 Corinthians 10:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: ja
  text: パンは一つ[a]ですから、私たちは大勢いても、一つの体です。私たちは皆、その一つのパンにあずかっているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一個のパン」とも訳せる。ギリシア語のἄρτοςは、一つのまとまりとしてのパンを指すことがあり、多くの人が同じ一つのものを分け合うイメージがいっそう明確になる。この節の二つの「一つのパン」の双方に当てはまる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ですから
  rationale: 直前の節に対する根拠を示す接続語として、因果関係が明確で自然な現代日本語にした。
- source_word: εἷς ἄρτος
  choice: 一つのパン
  rationale: ἄρτοςの「パン」と「一個のパン」の両面を保ちつつ、主の晩餐という文脈にも自然に響く表現とした。具体的な「一個のパン」は脚注に示した。
- source_word: ἓν σῶμα
  choice: 一つの体
  rationale: 共同体としての一致と、文脈上の聖餐的な響きの双方を保つ標準的な訳語である。
- source_word: οἱ πολλοί ἐσμεν
  choice: 私たちは大勢いても
  rationale: 多数であることと一つであることの対照を、原文にない解釈を加えず自然な日本語で明示した。
- source_word: οἱ γὰρ πάντες
  choice: 私たちは皆、…からです
  rationale: γάρの説明的な働きと、πάντεςが示す全員の共通参与を明確に表した。
- source_word: ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν
  choice: その一つのパンにあずかっている
  rationale: μετέχωの共有・参与の意味を「あずかる」で表し、ἐκが示す共通の源または対象との関係を、日本語として自然な「に」で表現した。継続的・現実的な参与を「ている」で示した。
theological_decisions:
- issue: 一つのパンと一つの体との関係
  choice: 同じ一つのパンに全員があずかることと、信徒が一つの体であることとの結び付きを、そのまま保った。
  alternative: パンを共同体的一致の単なる象徴と明示する訳、またはパンへの参与が一致を効力的に生じさせると明示する訳。
  rationale: ギリシア語本文は両者を強く関連付けるが、後代の聖餐論上の立場までは限定していないため、神学的緊張を解消せずに残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「あずかる」は日常語よりやや改まった語だが、共有と参与を簡潔に表し、聖餐について特定教派の解釈を持ち込まない。
