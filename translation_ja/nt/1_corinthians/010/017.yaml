  source_fidelity: 原文の因果関係（ὅτι）、一つのパンと一つの体の対照、多数者としての「私たち」、および全員が一つのパンに参与する理由づけ（γάρ）を適切に保持している。「その一つのパンにあずかっている」は、μετέχομενとἐκ τοῦ ἑνὸς ἄρτουの共有・参与の関係を自然な日本語で表す。
  naturalness: 「パンは一つですから、私たちは大勢いても、一つの体です」は明瞭で読みやすく、現代標準語として自然である。「あずかる」はやや格調のある語だが、この文脈では共有への参与を簡潔に表し、文体にも適合する。
  terminology: 「一つのパン」「一つの体」「あずかる」は、本文の語彙的・神学的含意を過度に限定せずに保っている。「体」はパウロ書簡における標準的表現であり、教派的な聖餐論を読み込ませない。脚注の「一個のパン」はἄρτοςの「一個のパン／一つのパン塊」という有効な語彙的代案を適切に示す。
