  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: ja
  text: これらのことは、例として彼らに起こりました[a]。それらは、諸時代の終わり[c]が臨んでいる私たちへの戒めのために[b]、書き記されたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「型として」または「類型的に」。これらの出来事が、後の信仰者に教訓を与える型となったことを表します。
    reason: lexical_alternative
  - marker: b
    text: 「教え諭すために」または「警告するために」とも訳せます。原語には、誤りを正す教えと警告の両方の意味があります。
    reason: lexical_alternative
  - marker: c
    text: 「時代の終わりが臨んでいる」とも訳せます。原文は「諸時代の終わり」と複数形です。
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: 型として
  rationale: 出来事が後の信仰者にとって教訓的な型・パターンとして機能することを表す。「模範」は好ましい行為だけを連想させやすいため避け、文脈上の警告的な事例にも使える「型」とした。
- source_word: συνέβαινεν
  choice: 起こりました
  rationale: 未完了過去の出来事を、現代日本語で自然に表す。複数の出来事であることは「これらのこと」によって明らかである。
- source_word: ἐκείνοις
  choice: 彼らには
  rationale: 直前まで述べられた荒野の世代を指す与格を簡潔に表し、後半の「私たち」との対照も示す。
- source_word: ἐγράφη
  choice: 書かれたのです
  rationale: 神的受動の可能性を限定せず、記録として書かれたことを受動形のまま表す。文脈上、主語は「これらのこと」である。
- source_word: πρὸς νουθεσίαν ἡμῶν
  choice: 私たちを戒めるために
  rationale: νουθεσίαが持つ、正すための教えと警告の両面を、自然で明瞭な日本語の「戒める」で表した。
- source_word: εἰς οὓς
  choice: 私たちに（関係節では「私たち」を修飾）
  rationale: 終末的現実が到来した対象が「私たち」であることを、「諸時代の終わりが臨んでいる私たち」という日本語の関係節で表した。
- source_word: τὰ τέλη τῶν αἰώνων
  choice: 諸時代の終わり
  rationale: τέληとαἰώνωνの複数性を保持し、パウロの救済史的な表現を単数の概念へと平板化しない。
- source_word: κατήντηκεν
  choice: 臨んでいる
  rationale: 完了形が示す到来とその現在的な効力を表す。「臨む」は、人々の上に終末的現実が到来したという文脈にも適する。
theological_decisions:
- issue: τὰ τέλη τῶν αἰώνων の救済史的・終末論的表現
  choice: 諸時代の終わりが臨んでいる
  alternative: 時代の終わりが来ている／諸時代の完成が到来している
  rationale: 原文の二重の複数形と、すでに到来しつつ最終的完成をなお待つという緊張を保つ。「完成」と解釈して意味を一つに限定しない。
- issue: τυπικῶς の類型的含意
  choice: 型として
  alternative: 例として／類型的に
  rationale: 後の信仰者に対する実例であると同時に、出来事が反復可能な型として意義を持つという含みを残す。専門用語的な説明は脚注に委ねる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての落ち着きと尊厳を保った。「型」「諸時代の終わり」は原文固有の表現を保持し、必要な説明を脚注に置いた。
