  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: ja
  text: だれも自分自身の益を求めてはならない。むしろ、他の人の益を求めなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「だれも自分自身のものを求めてはならない。むしろ、他の人のものを［求めなさい］」。
    reason: ギリシア語では「自分自身のもの」と「他の人のもの」の具体的内容が省略されている。本文の「益」は前後の文脈に基づいて補った表現である。
lexical_decisions:
- source_word: μηδεὶς
  choice: だれも……ず
  rationale: 否定の不定代名詞と命令法の組み合わせによる一般的な禁止を、現代日本語で自然な「だれも……ず、……なさい」とした。
- source_word: ζητείτω
  choice: 求めなさい
  rationale: ζητέωの「求める、追求する」という広い意味を保ち、倫理的勧告として自然な表現にした。ギリシア語では一度だけ現れる動詞を、意味を明確にするため後半にも補った。
- source_word: τὸ ἑαυτοῦ
  choice: 自分の利益
  rationale: 直訳では「自分のもの」となる省略表現。文脈上、自分にとって有利なことと他者の益との対比なので、「利益」として意味を明示した。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 単なる逆接だけでなく、自分ではなく他者を求めるよう方向を転じる対比を自然に表す。
- source_word: τὸ τοῦ ἑτέρου
  choice: 他の人の利益
  rationale: ἕτεροςはここで自分に対する「他の人」を指す。前半と同じ省略された内容を「利益」と補い、対句を明確にした。
theological_decisions:
- issue: τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου の省略された目的語
  choice: 「自分の利益」「他の人の利益」と補う
  alternative: 「自分のもの」「他の人のもの」
  rationale: ギリシア語は内容を明示しないため字義的な訳には曖昧さが残るが、直前直後の文脈は自分の都合より他者の益を図ることを扱っている。「利益」はその倫理的対比を自然な日本語で示しつつ、物質的所有だけに限定しない。字義的な形は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「利益」は金銭的利得に限定せず、文脈上の益・有利になること全般を表す。命令の対象が共同体全体であることを「だれも……なさい」で示した。
