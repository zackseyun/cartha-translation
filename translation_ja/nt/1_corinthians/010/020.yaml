id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: ja
  text: そうではなく、彼らがいけにえとして献げるものは、神にではなく悪霊どもに献げているのです。私は、あなたがたに悪霊どもと交わる者[a]になってほしくありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪霊どもにあずかる者」または「悪霊どもの仲間」。
    reason: κοινωνόςには、何かにあずかることと、相手との結びつきの双方を含む意味の幅があるため。
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: そうではなく
  rationale: 直前の節から生じ得る誤解を訂正し、本当に言おうとしている内容へ導く逆接・訂正の力を、自然な日本語で表した。
- source_word: ἃ θύουσιν
  choice: 彼らがいけにえとして献げるもの
  rationale: 中性関係代名詞が指す供え物を過度に限定せず、θύωの祭儀的意味も明確にした。
- source_word: δαιμονίοις
  choice: 悪霊どもに
  rationale: 新約聖書におけるδαιμόνιονの否定的な霊的存在という意味を明確に保った。複数形も反映した。
- source_word: καὶ οὐ θεῷ
  choice: 神にではなく
  rationale: 悪霊どもとの対比に置かれた唯一の神を指す文脈を保ち、日本語として自然な対照表現にした。
- source_word: οὐ θέλω δὲ ὑμᾶς
  choice: 私は、あなたがたに……なってほしくありません
  rationale: θέλωと対格＋不定詞の構文を、パウロの意志と警告が明瞭に伝わる現代日本語にした。
- source_word: κοινωνοὺς τῶν δαιμονίων
  choice: 悪霊どもと交わる者
  rationale: κοινωνόςが表す実質的な参与と関係性を保ちつつ、全面的な忠誠や単なる社交のどちらにも狭めない表現とした。
- source_word: γίνεσθαι
  choice: なる
  rationale: 既存の状態ではなく、そのような参与関係に入ることへの警告である点を保持した。
theological_decisions:
- issue: 異教のいけにえが向けられる相手
  choice: いけにえは神ではなく悪霊どもに献げられている
  alternative: 偶像礼拝の社会的意味だけを述べる、または悪霊を単なる比喩とみなす
  rationale: 本文の明示的な「悪霊どもに、神にではなく」という対比を弱めず、その先の説明を付加しなかった。
- issue: κοινωνοὺς τῶν δαιμονίωνの参与性
  choice: 悪霊どもとの実質的な交わり・参与
  alternative: 偶像礼拝者との単なる社会的接触、または悪霊への全面的忠誠
  rationale: 周辺文脈のκοινωνίαが表す現実的な参与の重みを保ちながら、本文以上に意味を強めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祭儀的な厳粛さを保った。「いけにえとして献げる」により日常的な『捧げる』と区別し、「交わる者」で参与の関係的・霊的な重みを表した。
