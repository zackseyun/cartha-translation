source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: ja
  text: しかし、神は彼らの大多数を喜ばれませんでした。なぜなら、彼らは荒野で倒された[a]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「荒野で打ち倒された」、または「荒野に横たえられた」。
    reason: κατεστρώθησανには、倒れて地に横たわる具体的な像がある。文脈上、裁きによる死を指す表現として理解できるが、受動形のまま行為者は明示しない。
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前に列挙されたイスラエルの民の特権と、その後に述べる神の不興との強い対照を、自然な現代日本語で示す。
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: 彼らの大多数を……喜ばれませんでした
  rationale: 「彼らの大多数においてではない」という原文の構造を日本語として自然に整えつつ、ほとんどの者が対象だったという数量的意味を保つ。
- source_word: ηὐδόκησεν
  choice: 喜ばれませんでした
  rationale: εὐδοκέωの「喜ぶ、満足する」という意味を簡潔に表し、神の不興を過度に解釈せず伝える。
- source_word: ὁ θεός
  choice: 神
  rationale: 明白な主語をそのまま訳す。
- source_word: κατεστρώθησαν
  choice: 倒された
  rationale: 荒野で死に倒れたことと裁きの文脈を伝えながら、原語にある「地に横たえられる」という像も残す。行為者は原文に明示されていないため、日本語でも受動形を保つ。
- source_word: γὰρ
  choice: のです
  rationale: 前文の理由・説明を示す接続関係を、自然な日本語の説明表現で伝える。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: 出エジプト後の放浪という聖書的背景に合う、日本語聖書で定着した表現を用いる。
theological_decisions:
- issue: κατεστρώθησανが表す裁きの性質
  choice: 「倒された」とし、荒野で死に倒れた結果と裁きの警告性を示す
  alternative: 「地に横たえられた」「打ち倒された」
  rationale: 文脈はイスラエルに対する神の不興とその結果を警告として示している。ただし、この動詞の受動形が行為者を明示しない点を保ち、「神が殺した」などとは補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「大多数」は数量的な強調を保ち、「倒された」は文脈上の裁きと原語の身体的な像の両方を簡潔に伝える。脚注記号[a]は対応箇所の直後に置いた。
