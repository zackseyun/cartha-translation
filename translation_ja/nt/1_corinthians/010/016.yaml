id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: ja
  text: 私たちが祝福する、祝福の杯は、メシアの血にあずかることではありませんか。私たちが裂くパンは、メシアの体にあずかることではありませんか。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あずかること」は、「共有すること」「参与すること」とも訳せる。伝統的には「交わり」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の「クリストゥー（Χριστοῦ）」は「メシア」を意味する称号。「キリスト」とも伝統的に訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον τῆς εὐλογίας
  choice: 祝福の杯
  rationale: 属格を簡潔に保ち、祝福・感謝を伴う食卓の背景を狭めずに伝える。
- source_word: ὃ εὐλογοῦμεν
  choice: 私たちが祝福する
  rationale: εὐλογίαとの語の反復を保ち、「感謝する」だけに意味を限定しない。
- source_word: οὐχὶ
  choice: ではありませんか
  rationale: 肯定の答えを期待する修辞疑問の形と力を自然な現代日本語で保つ。
- source_word: κοινωνία
  choice: あずかること
  rationale: 単なる交わり以上の参与・分有を表しつつ、聖餐に関する特定教派の理解へ限定しない。
- source_word: τοῦ αἵματος
  choice: 血
  rationale: 契約的・犠牲的含意を解釈的に展開せず、そのまま保つ。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: ここでは称号としての意味が働いているため「メシア」とし、伝統的な「キリスト」は脚注に示す。
- source_word: τὸν ἄρτον
  choice: パン
  rationale: 文脈上、一つのパンを想定し得るが、この節だけでは「一つのパン」や「パンの塊」と特定しない。
- source_word: ὃν κλῶμεν
  choice: 私たちが裂く
  rationale: 具体的な動作を保つ。「割く」「割る」も可能だが、聖書的文脈で明瞭かつ簡潔な「裂く」を採用する。
- source_word: τοῦ σώματος
  choice: 体
  rationale: 聖餐的・キリスト論的な重みを保ち、意味を教派的に狭めない。
theological_decisions:
- issue: 聖餐の文脈における κοινωνία
  choice: あずかること
  alternative: 共有すること／交わり／聖餐
  rationale: メシアの血と体への実質的な参与を表しつつ、その様態をめぐる教派間の議論を翻訳で決着させない。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では「油注がれた者」という称号性が保たれているため「メシア」を本文に置き、日本語聖書で伝統的な「キリスト」を脚注に残す。
- issue: 血と体への参与の性質
  choice: 説明を加えず、修辞疑問として保持
  alternative: 象徴的な記念、または特定の実体的現臨を明示する訳
  rationale: 原文は参与を強く語るが、その様態を詳述していないため、神学的緊張と曖昧さを保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「祝福する／祝福」の反復と二つの修辞疑問の並行を維持した。「あずかる」は一般読者にも理解可能で、礼典的な専門語に過度に固定されない。
