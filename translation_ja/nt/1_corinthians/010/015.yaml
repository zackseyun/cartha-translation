  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: ja
  text: 私は、あなたがたを分別のある人たちとして語ります[a]。私の言うことを、あなたがた自身で判断してください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「賢い人たちとして」または「思慮深い人たちとして」。
