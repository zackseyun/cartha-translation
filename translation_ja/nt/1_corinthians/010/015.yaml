  source_fidelity: 本文の「分別のある人たち」と「あなたがた自身で判断してください」は、それぞれφρονίμοιςと強調されたὑμεῖς、またκρίνατεの呼びかけをよく反映している。しかし「分別のある人たちに話すように話します」は、ὡςを「～するように」と取るため、「そのように話す」という比較・反復の不自然な意味合いを生じ、原文の『あなたがたを分別ある者として／分別ある者に対するように語る』という修辞的な呼びかけを明瞭に伝えない。
  naturalness: 現行前半は「話すように話します」という重複が現代日本語として不自然である。「あなたがたを分別のある人たちとして語ります」は端正で明瞭であり、パウロの聞き手への直接的な呼びかけに適する。後半は自然である。
  terminology: 「分別のある人たち」はφρόνιμοςの実際的な判断力という含意を適切に保ち、「賢い」ほど広くも強くもならない。「判断してください」はκρίνατεにふさわしい。固有名詞・神学用語に関する問題はない。
