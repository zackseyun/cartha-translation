lexical_decisions:
- source_word: ὡς
  choice: …に話すように
  rationale: パウロが聞き手をどのような者と見なして語るかを示す。日本語として自然になるよう、λέγωと合わせて表現した。
- source_word: φρονίμοις
  choice: 分別のある人たち
  rationale: 実際的な知恵、思慮、健全な判断力を表す語であり、「賢い」と断定するよりも文脈に合う穏当な表現である。
- source_word: λέγω
  choice: 話します
  rationale: 聞き手への語りかけを表す文脈なので、自然な現代日本語の「話します」とした。
- source_word: κρίνατε
  choice: 判断してください
  rationale: 聞き手自身に評価・吟味を求めるアオリスト命令形の力を、自然で明確な日本語で表した。
- source_word: ὑμεῖς
  choice: あなたがた自身で
  rationale: 明示された二人称代名詞の強調を「自身で」によって保持した。
- source_word: ὅ
  choice: こと
  rationale: φημιの内容を受ける関係代名詞を、「私の言うこと」という自然な名詞節で表した。
- source_word: φημι
  choice: 私の言う
  rationale: λέγωとの語彙上の違いを過度に強調せず、簡潔で自然な日本語にした。
theological_decisions:
- issue: 聞き手に対する修辞的な評価
  choice: コリントの信徒たちを、健全な判断ができる者として語りかける表現を保つ。
  alternative: 皮肉として「賢い人たち」と呼ぶ、または全面的に知恵を称賛する。
  rationale: この節は聞き手自身に議論の吟味を促す。訳文は肯定的だが節度のある「分別のある」を用い、皮肉か全面的称賛かを決めつけない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、使徒の勧告にふさわしい端正さを保った。ὑμεῖςの強調は本文に明示したため、英語版の脚注bに相当する情報は脚注化していない。
