source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: ja
  text: しかし、もしだれかがあなたがたに、「これはいけにえとしてささげられたものです」[a]と言うなら、それを知らせた人のために、また良心[b]のために、食べてはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これはいけにえの肉です」。ギリシア語は、いけにえとしてささげられたものを指す。
    reason: lexical_alternative
  - marker: b
    text: ここで言う良心は、自分の良心ではなく、相手の人の良心を指す。次節参照。
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: しかし、もしだれかがあなたがたに……と言うなら
  rationale: ἐὰνと接続法による仮定を「もし……なら」で表し、τιςの不定性を「だれか」で保った。δέは直前の許容的な場合との対照を示すため「しかし」とした。
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: これはいけにえとして献げられたものです
  rationale: ἱερόθυτοςは祭儀上いけにえとして献げられたものを指す。「偶像」はこの語自体には明示されないため本文に補わず、食物という文脈に適合しつつ語の範囲を保つ「もの」とした。
- source_word: μὴ ἐσθίετε
  choice: 食べてはいけません
  rationale: μήを伴う現在命令形の禁止を、明瞭で自然な現代日本語の禁止表現で訳した。目的語は直前の内容から明らかなため日本語では省略した。
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: それを知らせた人……のために
  rationale: διά＋対格が示す理由・配慮を「ために」で表し、μηνύωの告知・知らせるという意味を自然な日本語で示した。
- source_word: καὶ τὴν συνείδησιν
  choice: その人の良心のために
  rationale: 直訳的には「そして良心のために」だが、次節が自分ではなく他者の良心だと明示するため、現代日本語で指示関係を明瞭にした。原文の簡潔さと次節とのつながりは脚注でも示す。
theological_decisions:
- issue: τὴν συνείδησινがだれの良心を指すか
  choice: 知らせた他者の良心
  alternative: 食べる本人の良心、または所有者を特定しない一般的な「良心」
  rationale: 次節で「自分の良心ではなく、もう一人の人の良心」と明示される。日本語では単に「良心」とすると指示対象が不明瞭になりやすいため、「その人の」と補って文脈上の指示を表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「献げる」は祭儀的な奉献を示す表記とし、「偶像」は当該語に明示されないため本文へ取り込まなかった。
