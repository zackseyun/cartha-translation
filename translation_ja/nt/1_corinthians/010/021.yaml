revisions:
- from: あなたがたは、主の杯を飲み、悪霊どもの杯も飲むことはできません。主の食卓にあずかり、悪霊どもの食卓にもあずかることはできません。[a]
  to: あなたがたは、主の杯を飲むことも、悪霊の杯を飲むこともできません。主の食卓にあずかる[a]ことも、悪霊の食卓にあずかることもできません。
  rationale: 原文の複数形を日本語として不自然または評価的に強めることなく表すため、「悪霊ども」を「悪霊」に改めました。また、「…ことも、…こともできません」という反復によって、οὐ δύνασθε が二度述べる断定的な両立不可能性と、二組の並行を明瞭に保ちました。脚注は μετέχειν の訳語に直接対応させました。
