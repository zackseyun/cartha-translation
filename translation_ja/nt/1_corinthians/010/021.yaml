id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: ja
  text: あなたがたは、主の杯を飲むことも、悪霊の杯を飲むこともできません。主の食卓にあずかる[a]ことも、悪霊の食卓にあずかることもできません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食卓に参与する」とも訳せる。
    reason: μετέχειν は、何かにあずかること、共有すること、参与することを表すため。
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: あなたがたは……ことはできません
  rationale: 現在の能力の欠如というだけでなく、二つの礼拝への参与が両立しないことを示す断定的な表現として訳した。二つの節で同じ形を反復し、原文の強調を保った。
- source_word: ποτήριον
  choice: 杯
  rationale: 飲み物の器を指す直接的な訳であり、この文脈にある礼拝的・共同体的な含みも、説明を加えずに保てる。
- source_word: κυρίου
  choice: 主の
  rationale: 属格を自然な日本語の「主の」で表し、「悪霊どもの」との並行を保った。
- source_word: πίνειν
  choice: 飲む
  rationale: δύνασθεに続く不定詞を、簡潔で自然な現代日本語にした。
- source_word: δαιμονίων
  choice: 悪霊ども
  rationale: 霊的かつ人格的な存在を指す語義を明確にし、複数形も表した。「鬼神」などの古風または文化依存的な語を避けた。
- source_word: τραπέζης
  choice: 食卓
  rationale: 単なる家具としての「台」ではなく、食事と交わりへの参与を想起させる語として訳した。「祭壇」と限定する解釈は原文に付加しなかった。
- source_word: μετέχειν
  choice: あずかる
  rationale: 共有し参与する意味を、礼拝的文脈にふさわしい自然で格調ある日本語で表した。「食べる」だけに狭めず、参与の意味を保った。
- source_word: καὶ
  choice: ……し、……も
  rationale: 二つを結ぶ原文の構造を、日本語として自然な並列で示した。
theological_decisions:
- issue: 主の食卓への参与と悪霊的礼拝への参与との関係
  choice: 両者は両立しないという断定として訳す
  alternative: 単なる強い勧告または修辞的な戒めとして訳す
  rationale: 二度繰り返される οὐ δύνασθε は、穏やかな非推奨ではなく、参与の根本的な両立不可能性を示す。具体的な聖餐論や祭儀理解を訳文に付加せず、その緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「杯」「食卓にあずかる」によって原文の荘重さと礼拝的な響きを保った。二つの文を並行させ、パウロの断定的な修辞を再現した。
