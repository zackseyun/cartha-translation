  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: ja
  text: というのも、「地とそこに満ちるものは、主のもの」だからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 詩篇24:1からの引用。別訳「地と、その中にあるすべては、主のもの」。
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: 主のもの
  rationale: 属格による所有を自然な日本語で表し、地とそこに満ちるものが主に属するという意味を明確にした。κύριος は新約本文に即して「主」とした。
- source_word: γὰρ
  choice: というのも、〜だからです
  rationale: 直前の議論に聖書から根拠を示す説明的な接続を、現代日本語で自然に表した。
- source_word: ἡ γῆ
  choice: 地
  rationale: 詩篇引用としての響きを保ちつつ、世界全体を指しうる簡潔な表現とした。
- source_word: τὸ πλήρωμα αὐτῆς
  choice: そこに満ちるもの
  rationale: πλήρωμα の「満たしているもの」という像と詩篇引用の文体を保った。「そのすべて」と意訳しすぎず、原文の表現を伝える。
theological_decisions:
- issue: 詩篇24:1の引用における κύριος の訳
  choice: 主
  alternative: 主なる神／【主】
  rationale: パウロのギリシア語本文は κύριος であり、「主」がその語と引用の神学的重みを保つ。ヘブライ語原文の神名表記を新約ギリシア語本文へ直接持ち込まない。
- issue: 所有関係の表現
  choice: 地と、そこに満ちるものは、主のもの
  alternative: 地は主のものであり、そこに満ちるものもそうである
  rationale: τοῦ κυρίου が文全体の二つの主語にかかる構造を簡潔に保ち、すべてが主に属するという主張を明瞭にした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。引用部分は簡潔な聖書的表現を保ち、説明を担う γάρ は「というのも、〜だからです」と自然につないだ。
