  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: ja
  text: そして皆は、モーセへと[a]、雲の中で、また海の中で[b]洗礼を受けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「モーセと結ばれる洗礼を受けた」または「モーセに従う者となる洗礼を受けた」。ギリシア語は直訳すると「モーセへと」であり、パウロが示す洗礼との類型的な並行関係を保っている。
    reason: alternative_reading
  - marker: b
    text: パウロはここで「海を通って」ではなく「海の中」と述べ、「雲の中」と並行させている。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 皆
  rationale: 文脈にあるイスラエルの民全体を指し、前後で繰り返される「皆」という強調を簡潔に保つ。
- source_word: εἰς τὸν Μωϋσῆν
  choice: モーセへと
  rationale: ギリシア語の異例な方向表現と、洗礼をめぐるパウロの類型的な並行関係を保つ。「モーセと結ばれる」「モーセに従う」と本文で意味を一つに限定しない。
- source_word: ἐβαπτίσαντο
  choice: 洗礼を受けた
  rationale: 中動態を日本語として自然に表しつつ、βαπτίζωの確立した宗教的用法と、この箇所の類型的意味を保つ。「浸された」では方法を狭く示しすぎるおそれがある。
- source_word: ἐν τῇ νεφέλῃ
  choice: 雲の中
  rationale: ἐνの基本的な空間表現と出エジプトの情景を保ち、領域・手段・関係という含みを過度に限定しない。
- source_word: ἐν τῇ θαλάσσῃ
  choice: 海の中
  rationale: 原文がδιά（通って）ではなくἐνを用いることを反映し、「雲の中」との並行を保つ。
theological_decisions:
- issue: イスラエルの民が「モーセへと洗礼を受けた」という表現の意味
  choice: 類型的・代表的な表現を「モーセへと」として本文に残す。
  alternative: 「モーセと結ばれる洗礼を受けた」または「モーセに従う者となった」
  rationale: パウロは出エジプトの出来事とキリスト者の洗礼との類比を描いているが、その関係を本文中で単一の教理的説明に還元せず、原文の緊張と曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「モーセへと」は日常的には異例だが、原文の意図的に特異な表現と神学的な余白を保つため採用し、脚注で自然な解釈候補を示した。
