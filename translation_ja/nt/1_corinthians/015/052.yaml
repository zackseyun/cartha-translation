source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: ja
  text: 一瞬のうちに[a]、まばたきする間に、最後のラッパが鳴る時に。というのも、ラッパが鳴り、死者は朽ちない者としてよみがえらされ、私たちは変えられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「分けることのできないほど短い時に」。極めて短い一瞬を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: 一瞬のうちに
  rationale: ἄτομοςは字義的には「分割できない」を表し、ここでは極めて短い時を指す。「一瞬のうちに」はその時間的意味を自然な現代日本語で伝える。
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: 目を瞬く間に
  rationale: 目の素早い動きを用いて出来事の突然さと速さを表す句であり、日本語の自然な慣用表現とした。
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: 最後のラッパが鳴る時に
  rationale: ἐν＋与格の時間的な働きを明示しつつ、ἐσχάτῃを「最後の」として保った。特定の終末論的体系は織り込んでいない。
- source_word: σαλπίσει
  choice: ラッパが鳴ると
  rationale: 動詞はラッパを吹くこと、またはラッパが鳴ることを意味する。直前のσάλπιγγιを自然な日本語の主語として補った。γάρは出来事の根拠を示すが、ここでは日本語の文脈上自然な順接の「と」で関係を表した。
- source_word: οἱ νεκροὶ
  choice: 死者
  rationale: 死んだ人々を集合的に指す名詞的形容詞を、簡潔で標準的な日本語にした。
- source_word: ἐγερθήσονται
  choice: よみがえらされ
  rationale: 復活の文脈における未来受動形を保ち、死者が外からの働きによって起こされることを表した。
- source_word: ἄφθαρτοι
  choice: 朽ちない者として
  rationale: 腐敗や滅びに服さない状態を表す述語的形容詞であるため、「者として」を添えて死者のよみがえった状態を明確にした。
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 原文で明示される一人称複数を訳出し、「死者」との対照を保った。その指示範囲は説明的に限定していない。
- source_word: ἀλλαγησόμεθα
  choice: 変えられます
  rationale: ἀλλάσσωの未来受動形を直接的に訳し、変化の内容を本文以上に特定しなかった。
theological_decisions:
- issue: 「最後のラッパ」と終末の出来事との関係
  choice: 最後のラッパが鳴る時に
  alternative: 終わりのラッパとともに
  rationale: 原文の終末的な標識をそのまま保ちつつ、特定の終末論的順序や体系を訳文に持ち込まないため。
- issue: 復活する死者の状態
  choice: 死者は朽ちない者としてよみがえらされ
  alternative: 死者は朽ちないものによみがえり
  rationale: 受動態とἄφθαρτοιの述語的な働きを保ち、復活そのものと復活後の朽ちない状態を区別して表した。
- issue: 「私たち」の範囲
  choice: 私たちは変えられます
  alternative: 生きている私たちは変えられます
  rationale: 原文の一人称複数を保持し、文脈から推測される対象を訳文内で説明的に限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、復活を語る箇所にふさわしい簡潔で荘重な調子を保った。「よみがえらされ」により原文の受動態を示し、「変えられます」は内容を過度に説明せず原文の簡潔さを維持した。
