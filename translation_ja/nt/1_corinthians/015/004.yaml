review_pass:
  verdict: revise
  source_fidelity: 原文は「葬られたこと」と「聖書に従って三日目に起こされたこと」を、καὶ ὅτι の反復で並列する。現行案はこの大意を伝えるが、「また」の反復と「こと」の並列を明示すると、原文の告白定式としての構造がより正確になる。ἐγήγερται は完了受動態であり、日本語で完了相を完全に再現することは難しいものの、「復活させられた」は受動態を保てる。
  naturalness: 現行の「葬られ、…よみがえらされたこと」は、最初の内容節のまとまりがやや見えにくい。また「よみがえらされた」は意味は通るが、現代標準語では「復活させられた」のほうが復活の定着した用語として明瞭である。
  terminology: γραφάς は「聖書」でよい。「聖書に書かれているとおり」は自然であり、κατὰ τὰς γραφάς の「聖書との一致／成就」の趣旨を保つ。「復活」は神学用語としても一般的で、受動形により原文の態を不必要に能動化しない。
