  text: καὶ ὅτι ἐτάφη, καὶ ὅτι ἐγήγερται τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: ja
  text: また、葬られたこと、また、聖書に書かれているとおり三日目に復活させられたこと、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτάφη
  choice: 葬られ
  rationale: θάπτωのアオリスト受動態を簡潔に表し、墓の形態など原文にない情報を加えない。
- source_word: ἐγήγερται
  choice: よみがえらされた
  rationale: ἐγείρωの完了受動態。日本語では受動形を保ちつつ、復活という出来事を自然に示す。「よみがえった」よりも、原文の受動態を明確に反映する。完了形の継続的意義は日本語の時制だけでは十分に明示しにくいが、文脈上、現在に及ぶ復活の事実として読める。
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 三日目に
  rationale: 時を表す与格を自然な現代日本語で表す。「三日後」として起算方法を限定しない。
- source_word: κατὰ τὰς γραφάς
  choice: 聖書に書かれているとおり
  rationale: κατάの適合・一致の意味を自然に示し、複数形γραφαίが指す権威ある聖なる文書を「聖書」と表す。単に「聖書によれば」より、聖書の証言との一致を明確にする。
- source_word: ὅτι
  choice: こと
  rationale: 信仰告白的な列挙を構成する内容節として、日本語では節末の「こと」で自然に受ける。
- source_word: καὶ
  choice: また
  rationale: 前節から続く列挙を、現代日本語で自然かつ明瞭につなぐ。
theological_decisions:
- issue: 復活の動詞における完了相と受動態
  choice: よみがえらされた
  alternative: よみがえった／よみがえらされ、今も生きておられる
  rationale: 原文の神的受動を解消せず、復活がキリスト自身による自発的行為であるかのように限定しない。後者は完了相の継続的意義を明示するが、「今も生きておられる」は原文にない説明を加えるため本文には採らない。
- issue: 「聖書に従って」がどの事項に係るか
  choice: 語順どおり復活に直接結び付ける
  alternative: 埋葬と復活の双方に係ると読む
  rationale: この節の語順ではκατὰ τὰς γραφάςは復活句の後に置かれ、直近の復活に自然に係る。前節にも同じ表現があるため、各句に対応する反復として訳す。
- issue: 「聖書」の指示対象
  choice: 聖書
  alternative: 聖なる書物／ユダヤ教の聖書
  rationale: パウロが認める聖なる諸文書を指すが、本文ではその範囲を説明的に限定しない。
translation_notes:
  register: 簡潔な信仰告白のリズムを保つため、前節から続く文として「また」で始め、各内容を「こと」で受ける。現代の一般読者に通じる格調ある標準語を用い、「復活した」より原文の受動態が見える「よみがえらされた」を選んだ。
