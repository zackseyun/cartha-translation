id: 1CO.15.1
reference: 1 Corinthians 15:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: ja
  text: さて、兄弟たち[a]、私があなたがたに告げ知らせ、あなたがたも受け取った福音、すなわちあなたがたがその福音に立っている福音を、あなたがたに知らせます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「兄弟たち」。この男性形は、信じる共同体全体に呼びかける際、女性を含めて用いられることがある。
    reason: 原文の文法上の性を保ちながら、この呼びかけが会衆全体を指し得ることを示すため。
lexical_decisions:
- source_word: Γνωρίζω
  choice: 知らせます
  rationale: 基本義である「知らせる、分からせる」を直接表す。「思い起こさせる」とはせず、パウロが既に伝えた福音を改めて提示する文脈上の働きは、文全体から伝わるようにした。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、話題を移す穏やかな談話標識として訳した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を保った。会衆全体を指し得ることは脚注で明示した。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: 日本語の聖書・キリスト教文脈で広く理解される定着語であり、「良い知らせ」という原語の意味を担う。
- source_word: εὐηγγελισάμην
  choice: 告げ知らせた
  rationale: 良い知らせを公に伝える動作を自然な現代日本語で表し、「福音」との意味上のつながりも保った。
- source_word: παρελάβετε
  choice: 受け
  rationale: 伝承・教え・知らせを受領する意味を保ち、「受け入れた」として主観的受容を必要以上に強めないようにした。
- source_word: ἐν ᾧ
  choice: その福音に
  rationale: 福音を、信徒が立つ領域または基盤として表す。「それによって」として次節の内容を先取りしない。
- source_word: ἑστήκατε
  choice: 立っています
  rationale: 完了形が示す、以前に立って現在もその状態にあるという継続的・確立した状態を、簡潔な現在表現で示した。
theological_decisions:
- issue: 混合された会衆への呼びかけであるἀδελφοίの訳
  choice: 本文では「兄弟たち」とし、女性を含み得ることを脚注で示す
  alternative: 「兄弟姉妹たち」または「きょうだいたち」
  rationale: 原文の男性複数形を本文に残しつつ、パウロ書簡では信仰共同体全体への呼びかけとして用いられることを読者に伝えるため。
- issue: ἐν ᾧとἑστήκατεが表す福音との関係
  choice: 「その福音に立っています」
  alternative: 「その福音によって立っています」または「その福音を固く守っています」
  rationale: ἐνの領域・基盤の比喩を保ち、手段だけに限定したり、堅持という意味を明示的に加えたりしないため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、使徒的な呼びかけにふさわしい落ち着いた文体とした。原文にある「告げ知らせた福音を知らせる」という意図的な反復は、多少の重なりがあっても保持した。「その中に」という不自然な直訳は避け、比喩を「その福音に立つ」と表した。
