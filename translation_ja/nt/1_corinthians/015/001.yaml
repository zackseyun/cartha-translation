  to: さて、兄弟たち[a]、私があなたがたに告げ知らせ、あなたがたも受け取った福音、すなわちあなたがたがその福音に立っている福音を、あなたがたに知らせます。
  rationale: 安全な範囲で文を原文の構造に近づけ、「受け取った」によりπαρελάβετεの受領の意味と過去性を明確にした。「知らせる」と「告げ知らせる」の反復は、Γνωρίζωとεὐηγγελισάμηνの異なる動詞を反映するため保持した。脚注アンカーと脚注内容に変更はない。
