  source_fidelity: Γνωρίζωはここでは「知らせる／明らかにする」であり、既に告げ知らせた福音を改めて提示するという原文の反復を保つ必要がある。δὲの穏やかな転換は「さて」で適切に表されている。παρελάβετεは「受け取った」として、主観的な「受け入れた」を避けるのがより正確である。ἐν ᾧは福音を受ける対象と、そこに立つ領域・基盤の双方として指すため、「その福音に立っています」で保てる。
  naturalness: 現行文は意味を概ね正しく伝えるが、「私があなたがたに告げ知らせた福音を、あなたがたに知らせます」は、同じ受け手への反復が日本語としてやや重い。原文の意図的反復を失わずに、関係節を一文にまとめることで明快な現代標準日本語にできる。
  terminology: 「兄弟たち」はἀδελφοίの男性複数呼格を保つ訳として適切であり、会衆全体を含み得る旨の脚注も適切である。「福音」は定着した簡明な用語である。「受け」を「受け取った」にして、παραλαμβάνωの受領の意味を明示する。
