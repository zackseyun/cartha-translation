base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: ja
  text: しかし、先にあるのは霊に属するものではなく、自然の命に属するもの[a][b]です。その後に、霊に属するものが来ます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈に即して、「自然の体が先にあり、その後に霊に属する体が来る」とも訳せます。原文ではこの節に「体」という語はありませんが、前後の文脈には明記されています。
    reason: alternative_reading
  - marker: b
    text: 「自然の命に属するもの」はギリシア語プシュキコンの訳で、通常の生きた存在としての命に属することを意味します。より直訳的には「魂に属するもの」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: 先
  rationale: 時間的・順序的な先後を示す副詞用法。文末の「その後」と対応させ、自然な日本語で順序を明示した。
- source_word: πνευματικόν
  choice: 霊に属するもの
  rationale: 冠詞付き中性単数形容詞の名詞的用法。「霊的なもの」より意味関係が明確で、文脈上の「体」を本文に補わず、原文の簡潔さと広がりを保つ。
- source_word: ψυχικόν
  choice: 自然の命に属するもの
  rationale: 通常の生きた存在としての命に属するものを指し、終末的な御霊の命との対比を表す。「肉体的」「霊的でない」のような狭義化や道徳的含意を避けた。
- source_word: ἔπειτα
  choice: その後に
  rationale: 後続する順序を明瞭に示し、「先」と自然に対応する。
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: しかし、…なのではなく、…であり
  rationale: 想定された順序を訂正する二重の対比構造を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: ψυχικόν と πνευματικόν の対比
  choice: 人間存在の二つのあり方・秩序の時間的順序として訳し、「体」を本文では補わない。
  alternative: 「自然の体」と「霊の体」の対比として明示する。
  rationale: 直前の44節では「体」が明記されるが、本節では省略され、形容詞が名詞的に用いられている。復活の体という文脈を保ちつつ、本節そのものの幅を狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の省略を尊重して「体」を本文に補わず、脚注で文脈上の読みを示した。脚注記号は該当する対比全体の後にまとめて置いた。
