source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: ja
  text: その後、キリストは五百人を超える兄弟たち[a]に一度に現れました。そのうち大多数は今も生きていますが、一部は眠りにつきました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せます。ギリシア語は「兄弟たち」ですが、初期キリスト教の用法では、女性を含む広い信者共同体を指すことがあります。
    reason: lexical_alternative
  - marker: b
    text: すなわち、亡くなった人たちです。パウロはここで、復活の希望を背景に、死を「眠り」と表現しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: その後
  rationale: 復活したキリストの出現を順に列挙する流れを、自然な現代日本語で示す。
- source_word: ὤφθη
  choice: キリストは……現れました
  rationale: 復活顕現の文脈で自然な「現れた」とし、直前の文脈から補われる主語を明示して日本語として分かりやすくした。
- source_word: ἐπάνω πεντακοσίοις ἀδελφοῖς
  choice: 五百人を超える兄弟たちに
  rationale: ἐπάνωと数詞の「より多い」を正確に表し、ἀδελφοῖςの男性複数形も保持した。
- source_word: ἐφάπαξ
  choice: 一度に
  rationale: 一回性よりも、五百人以上への同時の出現を示す文脈上の意味を明瞭に伝える。
- source_word: ἐξ ὧν οἱ πλείονες
  choice: その大多数は
  rationale: 部分を示す表現と実体詞的比較級を、日本語で簡潔かつ自然に表した。
- source_word: μένουσιν ἕως ἄρτι
  choice: 今も生きています
  rationale: μένωの継続の意味を保ちながら、この文脈で何が継続しているかを明示する自然な日本語とした。
- source_word: τινὲς δὲ ἐκοιμήθησαν
  choice: すでに眠りについた人たちもいます
  rationale: δέの穏やかな対比を「も」で表し、死を指す「眠る」という比喩を復活の文脈に即して保持した。
theological_decisions:
- issue: ἀδελφοῖςが男女を含む共同体を指し得ること
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: ギリシア語の男性複数形を本文に保ちつつ、初期キリスト教用法では女性を含む信者共同体を指し得ることを脚注で示した。
- issue: ἐκοιμήθησανを復活の文脈でどう訳すか
  choice: 眠りについた
  alternative: 死んだ／亡くなった
  rationale: 死を意味することは脚注で明らかにしつつ、パウロが用いた睡眠の比喩と、章全体の復活への希望との響きを本文に保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。敬体を用い、原文の復活顕現の叙述、人数、同時性、死を眠りとする比喩を保持した。
