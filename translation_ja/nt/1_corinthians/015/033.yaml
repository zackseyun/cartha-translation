  yaml_path: translation/nt/1_corinthians/015/033.yaml
  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: ja
  text: 惑わされてはいけません。「悪い交わりは、良い品性を損なう」のです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪い会話は、良い品性を損なう」。ギリシア語は、人との交わりにも会話にも取ることができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: 惑わされてはいけません
  rationale: 受動・中動の形にある禁止を自然な現代日本語で表し、誰が惑わすのか、また自己欺瞞なのかを限定しない。
- source_word: φθείρουσιν
  choice: 損なう
  rationale: 破滅までを必ずしも意味せず、良い品性を徐々に悪化させる倫理的な文脈に合う。
- source_word: ἤθη χρηστά
  choice: 良い品性
  rationale: ἤθηは習慣・振る舞い・道徳的性質を含み得るが、ここでは倫理的な人格形成を自然かつ簡潔に示す「品性」とした。
- source_word: ὁμιλίαι κακαί
  choice: 悪い交わり
  rationale: ὁμιλίαιには付き合いと会話の両義がある。文脈上、人との関わりを広く表す「交わり」を本文に採り、会話という可能性は脚注に残した。
