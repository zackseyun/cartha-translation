lexical_decisions:
- source_word: ἔσχατος
  choice: 最後の
  rationale: 順序の中で最後に位置することを示し、パウロの終末論的な論の流れを自然に保つ。
- source_word: ἐχθρὸς
  choice: 敵
  rationale: 敵対する存在・力を表し、死を人格化する文脈にも合う、明瞭で標準的な訳語。
- source_word: καταργεῖται
  choice: 無力にされる
  rationale: 現在受動形を保ちつつ、καταργέωの「効力を失わせる、働かなくする」という意味を表す。「滅ぼされる」ほど存在の消滅に限定せず、動詞の意味の幅を保つ。
- source_word: ὁ θάνατος
  choice: 死
  rationale: 定冠詞を伴い、最後の敵として人格化された死を指す。日本語では「死」が自然である。
theological_decisions:
- issue: 死の敗北に関する καταργεῖται の訳
  choice: 無力にされる
  alternative: 滅ぼされる／廃される
  rationale: 死が終末に敵として効力を失うことを示しながら、その存在論的な意味を必要以上に限定しない。「滅ぼされる」も文脈上可能なため脚注に残す。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で格調ある文体。「最後の敵として」という構文により、ἔσχατος が敵の順序を示すことと、死がその敵であることを自然な日本語で表した。
