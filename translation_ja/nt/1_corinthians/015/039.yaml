reference: 1 Corinthians 15:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: ja
  text: すべての肉が同じ肉なのではありません。人間の肉があり、動物の肉があり、鳥の肉があり、魚の肉があります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὰρξ
  choice: 肉
  rationale: ここでは罪深い性質の比喩ではなく、生き物ごとに異なる物質的な身体を指す。パウロの反復を保つため、「体」ではなく「肉」とした。
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: すべての肉が同じ肉なのではありません
  rationale: 全否定ではなく、肉には種類の違いがあるという部分否定を明確にしつつ、原文の「肉」の反復を保った。
- source_word: ἄλλη μὲν … ἄλλη δὲ
  choice: …の肉があり、…の肉があり
  rationale: 種類ごとの相違を示す反復構文を、現代日本語で自然かつ並列的に表した。
- source_word: ἀνθρώπων
  choice: 人間
  rationale: 男性に限定せず、人類一般を表す。
- source_word: κτηνῶν
  choice: 家畜
  rationale: κτῆνος は通常、人に飼われる四足動物・家畜を指す。一般的な「動物」では鳥や魚まで含み得るため、列挙の区分を明確にする「家畜」とした。
- source_word: πτηνῶν
  choice: 鳥
  rationale: 飛ぶ生き物を表す語だが、この生物区分では「鳥」が自然で明確である。
- source_word: ἰχθύων
  choice: 魚
  rationale: 魚類一般を表す自然な日本語とした。
theological_decisions:
- issue: パウロ書簡における σάρξ の意味
  choice: 文字どおりの「肉」
  alternative: 「体」または比喩的な「罪深い性質」
  rationale: 文脈は復活をめぐる被造物の身体的相違であり、罪の性質について述べてはいない。「肉」とすることで、物質的意味と原文の語彙的反復を保持する。
- issue: οὐ πᾶσα の否定範囲
  choice: 肉がすべて一様なのではないという部分否定
  alternative: あらゆる肉を否定する全否定
  rationale: 後続する人間・家畜・鳥・魚の対比が、肉の存在自体ではなく種類の同一性を否定していることを示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の修辞的反復を残しながら、日本語では不自然になりやすい「別の肉は…」を避け、四つの区分を同じ構文で並べた。
