  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: ja
  text: 正気に返り、正しく考えなさい[a]。罪を犯し続けてはいけません[b]。神について無知な人がいるからです。あなたがたが恥じるように、私はこう言っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「正しく酔いからさめなさい」。ここでは、酔いからさめることを比喩として、正気を取り戻すよう求めている。別訳「正しく我に返りなさい」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「罪を犯してはいけません」または「罪を犯すのをやめなさい」。現在命令形には、継続中または習慣的な行為を禁じる含みがあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: 目を覚ましなさい
  rationale: 本来は酔いからさめることを表す語だが、ここでは比喩的に、酔ったような思考停止から立ち返って正気を取り戻すよう求める決然とした命令。日本語では「目を覚ます」が自然で、比喩の力も保てる。
- source_word: δικαίως
  choice: 正しく
  rationale: ἐκνήψατεを修飾し、ふさわしい仕方で正気に返ることを求める。「義にかなって」より自然でありつつ、倫理的な響きを残す。
- source_word: μὴ ἁμαρτάνετε
  choice: 罪を犯し続けてはいけません
  rationale: μήを伴う現在命令形の継続的・習慣的な含みを示す。ただし文法だけで「今すぐやめよ」と断定しないよう脚注で別訳を示す。
- source_word: ἀγνωσίαν θεοῦ
  choice: 神を知らない
  rationale: 直訳的には「神についての無知を持つ」。現代日本語では「神を知らない」が自然で、神に関する認識の欠如を簡潔に表す。
- source_word: τινες
  choice: 者が、あなたがたの中にいる
  rationale: τινεςは不特定の一部を指す。「あなたがたの中に」は文脈上自然だが、ギリシア語に明示された場所表現ではないため、その共同体に属する一部という語用論的含意を日本語化した。
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: あなたがたを恥じ入らせるために
  rationale: πρός＋対格が表す目的・効果を自然な日本語にした。パウロの厳しい叱責の調子を保つ。
- source_word: λαλῶ
  choice: 私はこう言っているのです
  rationale: 現在形の発話を、直前の叱責を指す「こう」とともに自然に表現した。
theological_decisions:
- issue: δικαίωςの倫理的・神学的な強さ
  choice: 「正しく」と訳す
  alternative: 「義にかなって」「正しい生き方に立ち返って」
  rationale: 倫理性は認めつつ、「義」をめぐるパウロの専門的神学概念を副詞に過度に読み込まない。
- issue: ἀγνωσίαν θεοῦの関係
  choice: 「神を知らない」
  alternative: 「神について無知である」「神についての知識がない」
  rationale: 対象属格として神に関する無知を表すと理解し、関係的な「神を知る」という聖書的表現も保つ。ただし救済状態などを本文以上に断定しない。
- issue: πρὸς ἐντροπὴνの目的か結果か
  choice: 「恥じ入らせるために」
  alternative: 「あなたがたの恥となるように」「恥ずべきこととして」
  rationale: πρόςの目的・効果の含みと叱責の意図を明瞭にするが、単なる侮辱ではなく悔悟を促す修辞として訳す。
translation_notes:
  register: 明快で現代的な標準語を用いながら、使徒の強い叱責と勧告の格調を保った。命令形は「なさい」と「てはいけません」で明瞭にし、比喩と動作相の解釈余地は脚注に残した。
