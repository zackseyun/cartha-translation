id: 1CO.15.49
reference: 1 Corinthians 15:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: ja
  text: そして、私たちが土からできた人のかたちを帯びてきたのと同じように、天に属する人のかたちをも帯びることになります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「天に属する人のかたちをも帯びよう」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: 〜のと同じように
  rationale: 二つの人間性の対応関係を明確に示し、自然な現代日本語にする。
- source_word: ἐφορέσαμεν
  choice: 帯びてきた
  rationale: アオリストの事実性を保ちつつ、アダムに属する姿をこれまで身に帯びているという文脈上の継続的な関わりを自然に表す。
- source_word: εἰκόνα
  choice: 姿
  rationale: ここでは単なる外見ではなく、その者に対応するあり方を含む。「像」より一般読者に自然で、創世記との関連を過度に限定しない。
- source_word: τοῦ χοϊκοῦ
  choice: 土からできた人
  rationale: χոϊκόςの『土からできた』という意味と創世記への響きを保ち、直前の『人』との対比を明示する。
- source_word: φορέσομεν
  choice: 帯びることになります
  rationale: SBLGNT本文の未来直説法を反映し、将来の復活における確かな変容を表す。異読の勧告的接続法は脚注に残す。
- source_word: τοῦ ἐπουρανίου
  choice: 天に属する方
  rationale: ἐπουράνιοςの性質を表しつつ、直前の文脈でキリストを指すことを自然に示す。原文が固有名を明記しないため、『キリスト』とは訳出しない。
- source_word: καὶ
  choice: も
  rationale: 後半の付加的・対応的な意味を日本語の『も』で表す。
theological_decisions:
- issue: 後半の動詞を未来直説法とするか、勧告的接続法とするか
  choice: 帯びることになります
  alternative: 天に属する方の姿をも帯びようではありませんか
  rationale: SBLGNTのφορέσομενは未来直説法であり、復活時の将来的な同形化を述べる。重要な異読φορέσωμενは本文に採らず、脚注で明示する。
- issue: χոϊκόςとἐπουράνιοςの指示対象
  choice: 土からできた人／天に属する方
  alternative: 土に属する者／天に属する者
  rationale: 直前の45–48節にある最初の人アダムと天からの人との対比を踏まえ、前者には『人』を補う。一方、後者はキリストへの敬意と自然な日本語のため『方』とするが、固有名による解釈の固定は避ける。
translation_notes:
  register: 明瞭で現代的な標準日本語。『土の人』という不自然さを避けつつ創世記への響きを保ち、『姿を帯びる』で原文の反復と対比を再現した。脚注記号[a]は本文末に置いた。
