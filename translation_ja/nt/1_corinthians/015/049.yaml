  terminology: εἰκώνは「かたち」として、単なる外見に限定されうる「姿」より適切に表します。ἐπουράνιοςには「天に属する」を用い、原文にない敬称「方」は用いません。異読のφορέσωμενは簡潔に「帯びよう」と訳します。
