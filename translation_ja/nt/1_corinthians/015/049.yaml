  rationale: 本文はSBLGNTのφορέσομεν（未来直説法）に従い、将来の確実な帰結を表す「帯びることになります」とした。「土からできた人」と「天に属する人」を対応させ、原文にない敬称を避けた。εἰκώνの反復は「かたち」で保ち、重要な勧告的接続法の異読は、意味を増減させない簡潔な脚注訳で示した。
