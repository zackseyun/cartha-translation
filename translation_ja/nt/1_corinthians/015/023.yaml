id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: ja
  text: しかし、それぞれにはそれぞれの順序があります。まず初穂であるメシア[a]、次に、メシアの到来[b]の時にメシアに属する人たちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語Χριστόςは「油を注がれた者」を意味する称号。
    reason: alternative_reading
  - marker: b
    text: 「到来」は「臨在」または「来臨」とも訳せる。ギリシア語παρουσίαは、ここではメシアの将来の到来を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι
  choice: しかし、それぞれに定められた順序があります
  rationale: 前節からの対比を「しかし」で受け、τάγμαの整然とした配列・順番という意味を、復活の時間的順序に適した自然な日本語で表した。「定められた」はἴδιοςを逐語的に「自分自身の」とせず、各々に対応する固有の順序という趣旨を明確にする。
- source_word: ἀπαρχὴ
  choice: 初穂
  rationale: 収穫の最初の実を神に献げる聖書的比喩と、その後に続く収穫を予示する含意を保つ。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは固有名のようにではなく、終末論的役割を担う「油注がれた者」という称号として際立つため。
- source_word: οἱ τοῦ Χριστοῦ
  choice: メシアに属する人たち
  rationale: 属格が表す帰属関係を、明瞭で自然な現代日本語にした。
- source_word: ἐν τῇ παρουσίᾳ αὐτοῦ
  choice: メシアが来られる時
  rationale: παρουσίαは本来「到来」「臨在」を表し、この文脈ではメシアの将来の到来を指す。日本語でその出来事と時間的関係が自然に伝わるようにした。
theological_decisions:
- issue: Χριστόςを称号として訳すか、慣用的な「キリスト」とするか
  choice: メシア
  alternative: キリスト
  rationale: 復活の順序において、油注がれた者とその者に属する人々が対置され、称号としての働きが明瞭であるため。「キリスト」も伝統的な音訳として可能なので脚注に示す。
- issue: παρουσίαをどの程度専門的な終末論用語として表すか
  choice: 来られる時
  alternative: 到来の時／現れる時
  rationale: 将来の来臨という文脈上の意味を明瞭にしつつ、その出来事の様態や特定の教理体系を訳文に付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「初穂」という聖書的比喩は説明的に言い換えず保持した。脚注記号は該当する語句を含む本文末に配置した。
