id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: ja
  text: しかし、神の恵みによって、私は今の私です。そして、私に対する神の恵みは、むなしいものにはなりませんでした。[a] それどころか、私は彼らすべてよりも多く働きました。とはいえ、働いたのは私ではなく、私とともにある神の恵みです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「無駄にはなりませんでした」「実を結ばないものにはなりませんでした」。
    reason: κενόςには「空の」のほか、「無駄な」「成果のない」という意味の幅があるため。
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: しかし、神の恵みによって
  rationale: 与格を手段として取り、「恵みによって」とした。δέは前節との穏やかな対比を示すため「しかし」と訳した。
- source_word: εἰμι ὅ εἰμι
  choice: 私は今の私となりました
  rationale: 直訳的な「私は私である」は日本語では不自然になりやすい。神の恵みによって現在の自分があるという意味を、文脈に即して自然に表した。
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: 私に注がれた神の恵み
  rationale: εἰςの方向性を「私に」で保持しつつ、恵みがパウロに向けられたことを自然な日本語で示した。「注がれた」は方向性を明確にする文脈的表現である。
- source_word: οὐ κενὴ ἐγενήθη
  choice: むなしくはなりませんでした
  rationale: κενόςが持つ「空しい、実を結ばない、無駄な」という幅を保つ表現とした。結果として無効ではなかったという含意も伝わる。
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: それどころか、私は彼らのだれよりも多く働きました
  rationale: κοπιάωの骨折って働く意味を、明瞭な「多く働きました」で表した。比較表現は「彼らのだれよりも」とし、πάντωνを反映した。
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: とはいえ、働いたのは私ではなく、…神の恵みです
  rationale: 直前に述べたパウロ自身の労苦を否定して消去するのではなく、その究極的な働き手を神の恵みとする逆説を保持した。省略された述語を日本語で補った。
- source_word: ἡ σὺν ἐμοί
  choice: 私とともにあった
  rationale: σύνの「ともに」をそのまま保ち、この句が神の恵みを修飾することを明瞭にした。
theological_decisions:
- issue: パウロの労苦と神の恵みとの関係
  choice: パウロが実際に働いたという主張と、その働きを神の恵みに帰する主張の双方を並置した。
  alternative: 人間と神の共同作業として明示する訳、またはパウロ自身の働きを実質的に弱める訳。
  rationale: ギリシャ語は「私は…働いた」と「私ではなく、神の恵み」をともに述べる。この緊張を後代の教理体系によって解消せず、そのまま訳文に残した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある朗読可能な文体。「恵み」はパウロ書簡の中心語として保持した。長い一文を区切りつつ、対比と逆説の流れを保った。
