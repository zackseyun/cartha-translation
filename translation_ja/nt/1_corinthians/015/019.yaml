source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: ja
  text: もし私たちが、この世の生涯だけの希望をメシア[a]に置いているのなら、私たちはすべての人の中で最も哀れむべき者です。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシャ語Χριστόςは、「油を注がれた者」を意味する称号である。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「すべての人よりも哀れむべき者です」。ギリシャ語は比較級だが、ここでは最上級に相当する意味で理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: もし……なら
  rationale: 条件文を導く語として、現代日本語で自然かつ明確に表した。
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: この世の生涯
  rationale: 現在の地上での生を指す。「この人生」よりも、後の復活との対比が伝わりやすい表現を選んだ。
- source_word: ἐν Χριστῷ
  choice: メシアに
  rationale: Χριστόςの称号としての意味を「メシア」で示し、ἐνはここでは望みが向けられる対象として自然な日本語にした。「メシアにあって」とすると日本語では意味が不透明になりやすい。
- source_word: ἠλπικότες ἐσμὲν
  choice: 望みを置いている
  rationale: 迂言的完了形が示す、過去に始まり現在も続く確かな望みを自然な日本語で表した。
- source_word: μόνον
  choice: だけのために
  rationale: 望みの効力がこの生涯に限られるという文脈上の範囲を明確にし、「望むことしかしていない」という誤読を避けた。
- source_word: ἐλεεινότεροι
  choice: 最も哀れむべき
  rationale: 形は比較級だが、πάντων ἀνθρώπωνとの組み合わせを日本語で自然な最上級相当に表した。比較級を直接反映する訳は脚注に示した。
- source_word: πάντων ἀνθρώπων
  choice: すべての人の中で
  rationale: 性別を限定しないἄνθρωποιの普遍的な比較を保った。
theological_decisions:
- issue: パウロの定型句ἐν ΧριστῷにおけるΧριστόςの訳
  choice: メシアに
  alternative: キリストに／メシアにあって
  rationale: 称号としての意味を保つため「メシア」を本文に置いた。一方、伝統的な「キリスト」も脚注で示し、ἐνの神学的含意を過度に説明して一つに固定しないようにした。
- issue: μόνονの係り先と希望の範囲
  choice: この世の生涯だけのために……望みを置いている
  alternative: この世の生涯でだけ、メシアに望みを置いている
  rationale: この生涯に限られた希望という論旨を明確にしつつ、復活や来世について本文以上の教理的説明を加えなかった。
- issue: ἐλεεινότεροι πάντων ἀνθρώπωνの比較表現
  choice: すべての人の中で最も哀れむべき者
  alternative: すべての人よりも哀れむべき者
  rationale: 比較級の形と日本語の慣用的な最上級表現の双方を尊重し、本文は自然な表現、脚注は形式に近い表現とした。
translation_notes:
  register: 明快な現代標準日本語を用い、礼拝朗読にも耐える落ち着いた文体とした。「哀れむべき」は単なる不幸よりも、他者の憐れみを受けるに値するというἐλεεινόςの意味を保つ。
