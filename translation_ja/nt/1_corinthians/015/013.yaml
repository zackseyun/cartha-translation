lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、…ないのなら
  rationale: εἰの条件とδέの穏やかな対比を、前節から続く論証の転換が分かる自然な日本語で表した。
- source_word: ἀνάστασις νεκρῶν
  choice: 死者の復活
  rationale: 属格複数νεκρῶνを、死者という一群についての復活を指すものとして保持した。日本語でも定着した明瞭な表現である。
- source_word: οὐκ ἔστιν
  choice: ない
  rationale: 復活の現実そのものを否定する存在的な表現を、簡潔で自然な日本語にした。
- source_word: οὐδὲ
  choice: …も…ない
  rationale: 条件から導かれる否定的帰結を、日本語の呼応表現で示した。
- source_word: Χριστὸς
  choice: メシア
  rationale: Χριστόςを固有名のように処理せず、「油を注がれた者」という称号の意味を担う呼称として表した。
- source_word: ἐγήγερται
  choice: よみがえらされてはいません
  rationale: ἐγείρωの完了受動形を保ち、すでに起きた出来事の現在に及ぶ結果と、明示されない行為者による働きの両方を示した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての性格を保つため「メシア」を本文に置いた。ただし、日本語で定着した「キリスト」も可能なので脚注に示した。
- issue: ἐγήγερταιの態
  choice: よみがえらされてはいません
  alternative: よみがえってはいません
  rationale: 受動態を保持し、神の働きを暗示しつつも、原文が明示していない行為者を本文に補わないようにした。
translation_notes:
  register: 明瞭な現代標準語を用い、パウロの条件論法が一読して分かる語順にした。「よみがえらされて」は日常語よりやや荘重だが、原文の受動態と神学的含意を保つため採用した。
