source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: ja
  text: 私たちの主メシア・イエス[c]にあって私があなたがたについて抱いている誇りにかけて、私は日々死んでいます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「毎日、私は死ぬ」。文脈上、「日々死の危険に直面している」という含みも考えられます。
    reason: lexical_alternative
  - marker: b
    text: このギリシア語は誓いに似た強い断言です。「私があなたがたについて抱く誇りと同じほど確かに」とも、「あなたがたの誇りにかけて」とも取れ、統語上の解釈には議論があります。
    reason: alternative_reading
  - marker: c
    text: 伝統的な訳では「キリスト・イエス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 日々
  rationale: 「毎日」「日ごとに」を意味する慣用的な表現。反復の力を保ちつつ、簡潔で格調ある現代日本語とした。
- source_word: ἀποθνῄσκω
  choice: 死んでいます
  rationale: 現在能動直説法一人称単数。パウロの鮮烈な「私は死ぬ」という表現を保ち、「死に直面しています」という解釈的な言い換えは避けた。
- source_word: νὴ
  choice: 誇りにかけて、そう断言します
  rationale: 誓言・強い確言に用いられる小辞。日本語で誓いの対象と断言の力が自然に伝わるよう明示した。
- source_word: τὴν ὑμετέραν καύχησιν
  choice: 私があなたがたについて抱いている誇り
  rationale: καύχησις の「誇り／誇ること」を示し、後続の「私が抱いている」に基づいて、本文ではパウロがコリントの人々について抱く誇りと理解した。ただしὑμετέρανの統語的曖昧さは脚注に残した。
- source_word: ἣν ἔχω
  choice: 私が…抱いている
  rationale: 日本語では「誇りを持っている」より「誇りを抱いている」が自然であり、関係節の意味を明確に伝える。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστόςの称号性を「メシア」で示し、ἐνはパウロに重要な結びつきの表現として「にあって」と訳した。
- source_word: τῷ κυρίῳ ἡμῶν
  choice: 私たちの主
  rationale: κύριοςを「主」、ἡμῶνを「私たちの」とする標準的で自然な訳。
theological_decisions:
- issue: Χριστῷを称号として訳すか、慣用的名称として訳すか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: ここではΧριστόςの称号としての意味を訳出した。日本語で伝統的な「キリスト・イエス」も脚注に示した。
- issue: καύχησιςとὑμετέρανの関係
  choice: パウロがコリントの人々について抱く誇り
  alternative: あなたがた自身の誇り／あなたがたの誇りにかけて
  rationale: 関係節「それを私は持っている」が、パウロ自身の誇りを指す理解を支持する。しかしギリシア語の所有表現と誓言構文には議論があるため、別解を脚注に保存した。
- issue: 「日々死ぬ」の意味
  choice: 比喩を解釈せず、そのまま「日々死んでいます」とする
  alternative: 日々死の危険にさらされています
  rationale: 文脈上、絶え間ない死の危険を含み得るが、原文の直接的で神学的にも含みのある表現を解釈的に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの「日々死ぬ」という鮮烈な表現と誓言の強さを保った。長い修飾関係が理解しやすいよう二文構成とし、称号「メシア」とパウロ的な「にあって」を維持した。
