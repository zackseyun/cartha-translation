id: 1CO.15.48
reference: 1 Corinthians 15:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: ja
  text: 土から成る人がそうであるように、土から成る人々もそうであり、天に属する人がそうであるように、天に属する人々もそうです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より逐語的には、「土から成る人がどのようであるか、そのように土から成る人々もあり、天に属する人がどのようであるか、そのように天に属する人々もあります」。
    reason: 原文の οἷος … τοιοῦτοι という相関構文の形を示すため。
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: …がそうであるように、…もそうであり
  rationale: 原文の相関構文が示す、代表となる者とそれに属する人々との対応関係を、自然な日本語の並行表現で保った。
- source_word: χοϊκός
  choice: 土から成る
  rationale: 「土から造られた、土を本質とする」という意味と、アダムの起源を示す創世記への連想を保つ。「地上的」ではこの土との結びつきが弱くなる。
- source_word: ὁ χοϊκός
  choice: 土から成る人
  rationale: 直前の文脈でアダムとキリストが代表的人物として対比されているため、名詞化された男性単数形を自然な日本語で「人」と明示した。
- source_word: οἱ χοϊκοί
  choice: 土から成る人々
  rationale: 「土から成る人」と同じ語を反復し、その人と同じ性質を持つ人間たちを指すことを明確にした。
- source_word: ἐπουράνιος
  choice: 天に属する
  rationale: 「天的な、天に属する」という形容詞の意味を保ち、47節の「天から」という起源表現をこの節へ不必要に持ち込まないようにした。
- source_word: ὁ ἐπουράνιος
  choice: 天に属する人
  rationale: 原文の「土から成る人」との対称性、および文脈上のキリストという人格的指示を保った。
- source_word: οἱ ἐπουράνιοι
  choice: 天に属する人々
  rationale: 天使などの天上の存在ではなく、天に属する代表者に対応する人々を指す文脈を自然に表した。
theological_decisions:
- issue: 単数形の二者をアダムとキリストとして「人」と明示するか
  choice: 「土から成る人」「天に属する人」とした
  alternative: 「土から成る者」「天に属する者」
  rationale: 45–49節の文脈はアダムとキリストを対照させており、「人」の補足はその人格的・代表的対比を明確にする。ただし固有名は本文に加えず、原文の含みを保った。
- issue: οἱ ἐπουράνιοι の指示対象
  choice: 人間を指す「天に属する人々」とした
  alternative: 「天にある者たち」「天的な者たち」
  rationale: この段落の主題は人間の復活と、天に属する人のかたちを担う人々であり、天使を指すとは読ませない表現が文脈に合う。
- issue: 「そうである」が性質、状態、将来の姿のどれを示すか
  choice: 内容を限定せず「そうである」とした
  alternative: 「同じ性質である」「同じ姿になる」
  rationale: 原文は対応関係を述べるが、その内容をこの節だけで一つに限定していないため、性質や復活時の姿のいずれかへ狭める補足を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、前半と後半の厳密な並行関係を保った。「そうです」で文を結び、説明を加えすぎず、礼拝朗読にも個人読書にも適する端正な調子とした。
