  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: ja
  text: しかし今や、メシア[a]は死者の中からよみがえらされました。眠りについた人々[c]の初穂[b]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。「メシア」と「キリスト」は、いずれも「油を注がれた者」という称号を表す。
    reason: alternative_reading
  - marker: b
    text: 「初穂」は、収穫の最初の実りとして神にささげられたもの。ここでは、後に続く復活の先駆けであり、その確かさを示すものという含みがある。
    reason: cultural_note
  - marker: c
    text: 「眠りについた人々」は死者を指す比喩で、特に復活を語る文脈で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: しかし今や
  rationale: 直前までの仮定的な議論を退け、現実の事実を力強く提示する逆接と現在的転換を表す。
- source_word: Χριστὸς
  choice: メシア
  rationale: 油を注がれた者という称号としての意味を示すため、意味を訳した「メシア」とした。日本語で慣用的な「キリスト」も可能なので脚注に示した。
- source_word: ἐγήγερται
  choice: よみがえらされ
  rationale: 完了受動形を反映し、すでに起きた出来事とその継続する結果を示す。行為者は本文が明示していないため補わない。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 複数形 νεκρῶν と ἐκ の意味を保ちつつ、日本語として自然な復活表現にした。
- source_word: ἀπαρχὴ
  choice: 初穂
  rationale: 収穫の最初の部分を神にささげる背景と、後に続く収穫を先取りする代表的意味を保つ。
- source_word: τῶν κεκοιμημένων
  choice: 眠りについた人々
  rationale: 死を眠りにたとえる完了分詞の比喩を保持し、復活という文脈との結びつきを残す。
theological_decisions:
- issue: 復活表現の態と行為者
  choice: よみがえらされ
  alternative: よみがえり
  rationale: ギリシア語の受動態を保ち、神の働きを暗示しつつも、本文にない行為者を明示しない。
- issue: Χριστός の称号表現
  choice: メシア
  alternative: キリスト
  rationale: この箇所では神学的・代表的な称号として用いられていると判断して意味を示す訳を本文に置き、広く定着した音訳も脚注で提示する。
- issue: ἀπαρχή の代表的・将来的含意
  choice: 初穂
  alternative: 最初の実り
  rationale: 単なる時間的な最初だけでなく、後に続く全収穫を先取りする祭儀的比喩を保存する。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、復活、眠り、初穂という原文の主要な比喩と神学的緊張を保持した。「となりました」は日本語として同格関係を自然に表すための補いであり、初穂としての位置づけを明示する。
