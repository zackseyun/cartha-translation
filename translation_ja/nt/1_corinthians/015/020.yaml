  to: しかし今や、メシア[a]は死者の中からよみがえらされました。眠りについた人々[c]の初穂[b]です。
  rationale: 原文の完了受動形を自然な有限形「よみがえらされました」で表し、ἀπαρχὴ の述語的同格を「初穂です」とした。これにより、「初穂になった」という不要な時間的変化を避け、原文が述べるキリストの現在的な位置づけを明瞭に保つ。脚注の内容とアンカーは妥当であるため維持した。
