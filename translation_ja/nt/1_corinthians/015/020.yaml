  source_fidelity: ギリシア語の「しかし今や」「メシア」「死者の中から」「よみがえらされた（完了受動）」「眠りについた人々の初穂」は、全体として適切に反映されている。ただし本文の「よみがえらされ、…初穂となりました」は、原文の述語的同格関係を「初穂になった」という出来事として読ませやすく、完了受動形も日本語文として未完結な形になっている。
  naturalness: 「よみがえらされ、…となりました」は不自然ではないものの、二つの出来事を並べる構文となり、原文の「よみがえらされた方であり、初穂である」という関係が弱まる。文を分けることで、明快な現代標準日本語となる。
  terminology: 「メシア」「死者の中から」「初穂」「眠りについた人々」はいずれも妥当である。脚注aは「キリスト」が可能であることを適切に示し、脚注b・cも本文の比喩と背景を過度に教義化せず説明している。
