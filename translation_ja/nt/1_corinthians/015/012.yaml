id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: ja
  text: ところで、もしキリスト[a]が死者の中からよみがえらされたと宣べ伝えられているなら、どうしてあなたがたの中のある人たちは、死者の復活はないと言うのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア」とも訳せる。ギリシア語Χριστόςは称号で、「油を注がれた者」という意味。
    reason: 称号の意味と可能な別訳を示すため。
lexical_decisions:
- source_word: Χριστὸς
  choice: キリスト
  rationale: 日本語では「キリスト」が称号として定着しており、この箇所でも自然かつ明確である。「メシア」も可能だが、パウロ書簡の一般的な日本語表現との連続性を優先した。
- source_word: κηρύσσεται
  choice: 宣べ伝えられている
  rationale: 現在受動態が示す、共同体で継続して公に告知されていることを表す。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 複数形 νεκρῶν と ἐκ の起点・離脱の意味を明示し、復活表現としても自然である。
- source_word: ἐγήγερται
  choice: よみがえらされた
  rationale: 完了受動態を反映し、すでに起こった出来事とその持続する結果を示す。受動形を保つことで、行為者を本文以上に明示しない。
- source_word: πῶς
  choice: どうして…のでしょうか
  rationale: 単なる方法の問いではなく、告知内容と発言との矛盾を指摘する修辞疑問として自然に表した。
- source_word: ἐν ὑμῖν τινες
  choice: あなたがたの中のある人たち
  rationale: コリントの共同体内部の一部の人々を指すことを明確に保つ。
- source_word: ἀνάστασις νεκρῶν
  choice: 死者の復活
  rationale: 属格構文を簡潔に反映し、個別の出来事ではなく死者一般の復活を指す定着した表現を用いた。
- source_word: οὐκ ἔστιν
  choice: ない
  rationale: 存在を否定する表現として、現代日本語で自然かつ直接的である。
- source_word: Εἰ δὲ
  choice: ところで、…のに
  rationale: δὲ の論旨の展開を「ところで」で示し、εἰ 節はここで前提として受け止められているため、「…のに」によって後半との不整合を自然に表した。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは「油注がれた者／メシア」という称号だが、日本語では「キリスト」も称号として広く定着している。意味を説明する代替表現を脚注に示し、本文は自然で標準的な表記とした。
- issue: ἐγήγερται の受動態と行為者
  choice: よみがえらされた
  alternative: よみがえった
  rationale: ギリシア語の受動態を保ち、神が起こしたという含意を尊重しつつ、本文に明示されていない行為者を補わない。
- issue: 死者の復活の範囲
  choice: 死者の復活
  alternative: 死者の中からの復活
  rationale: ἀνάστασις νεκρῶν はここではキリスト個人の復活ではなく、死者一般の復活を指すため、属格をそのまま自然に表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、議論の厳粛さを保った。「宣べ伝えられている」は聖書的な公的告知の語感を保ち、「どうして…のでしょうか」で修辞疑問を自然に示した。脚注記号は対応箇所が分かるよう「キリスト」の直後に置くべきところ、提出本文では文末配置となっているため、本文上の対応を明確にするには「キリスト[a]」への配置が望ましい。
