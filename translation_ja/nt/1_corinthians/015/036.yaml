  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: ja
  text: 愚かな人よ。[a] あなたが蒔くものは、死ななければ、生かされません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「愚か者よ」または「分別のない人よ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「生きるようにはなりません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: 愚かな人よ
  rationale: 呼格による鋭い叱責を保ちつつ、現代日本語として自然で、必要以上に罵倒的にならない表現とした。
- source_word: σὺ
  choice: あなたが
  rationale: ギリシア語で明示された代名詞の強調を、日本語でも主語を明示することで表した。
- source_word: ὃ σπείρεις
  choice: あなたが蒔くもの
  rationale: 種を蒔くという農耕の比喩をそのまま保ち、自然な日本語にした。
- source_word: οὐ ζῳοποιεῖται
  choice: 命を与えられません
  rationale: 受動態を保ち、単に自然発生的に生き返るというより、命を与えられるという原文の形を反映した。
- source_word: ἐὰν μὴ
  choice: 死ななければ
  rationale: 条件表現を簡潔で自然な日本語の「〜なければ」で表した。
- source_word: ἀποθάνῃ
  choice: 死ななければ
  rationale: 種について述べる条件節として、日本語では単純な条件形が自然であり、「まず」など原文にない語は加えなかった。
theological_decisions:
- issue: 種の死と復活の命との比喩的関係
  choice: 農耕の比喩を説明せず、そのまま保持する
  alternative: 身体の復活についての教理的命題として明示的に言い換える
  rationale: パウロは復活への疑念に種の比喩で答えているが、この節自体にない教理的説明を訳文へ加えず、比喩が持つ含みと緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。パウロの鋭い叱責には品位を保たせ、種を蒔く比喩と「命を与える」という受動表現を維持した。
