id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: ja
  text: ですから、私の愛する兄弟たち[a]、堅く立ち、揺るぐことなく、いつも主の働きに豊かに励みなさい。あなたがたの労苦が主にあって無駄ではないことを、あなたがたは知っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」と訳したギリシア語は、文脈によっては女性を含む信徒たち全体を指します。
    reason: ἀδελφοίの文法上の男性複数形を本文に保ちながら、この宛先における包括的な指示範囲を示すため。
lexical_decisions:
- source_word: Ὥστε
  choice: ですから
  rationale: 直前までの復活についての議論から勧めを導く推論的な接続語として、論理関係を明確かつ自然に表す。
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: 私の愛する兄弟たち
  rationale: ἀγαπητοίの愛情のこもった呼びかけを保ち、ἀδελφοίの文法上の男性複数形を本文に反映する。文脈上、女性を含む信徒全体への呼びかけであることは脚注で示す。
- source_word: ἑδραῖοι γίνεσθε
  choice: 堅く立ち
  rationale: γίνεσθεを単なる存在ではなく求められる状態への勧めとして捉え、ἑδραῖοιの確固とした姿勢を自然な日本語で表す。
- source_word: ἀμετακίνητοι
  choice: 揺るがされることなく
  rationale: 定めた位置から動かされないという強い意味を、信仰上の不動性を示す自然な表現で伝える。
- source_word: περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε
  choice: いつも主の働きに励みなさい
  rationale: περισσεύωの継続的かつ豊かな取り組みを、現代日本語で過度に比喩的にならない「励む」で表す。「主の働き」はἔργονの範囲を特定の奉仕職に狭めない。
- source_word: εἰδότες
  choice: 知っているのです
  rationale: 完了分詞が示す、すでに確立された認識を勧めの根拠として自然な日本語の独立節で表す。
- source_word: ὁ κόπος ὑμῶν
  choice: 自分たちの労苦
  rationale: κόποςが含む骨折りや疲労を伴う働きの重みを「労苦」で表す。再帰的な所有関係を明瞭にするため「自分たちの」とした。
- source_word: οὐκ ἔστιν κενὸς
  choice: 無駄ではない
  rationale: κενόςの「空しい、成果のない」という文脈上の意味を、明快で自然な現代日本語にする。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡に特徴的な広がりのある表現を保ち、単に「主のために」や「主によって」と一義的に限定しない。
theological_decisions:
- issue: ἀδελφοίの性と指示範囲
  choice: 本文は「兄弟たち」とし、教会全体を含み得ることを脚注で示す。
  alternative: 「兄弟姉妹たち」または「皆さん」
  rationale: ギリシア語の文法上の形を保持しつつ、この書簡の宛先が男女を含む信徒共同体であるという文脈上の範囲も明示する。
- issue: 文末のἐν κυρίῳの係り方
  choice: 「労苦」を修飾する「主にあって」とした。
  alternative: 「主によって無駄にならない」または「主との関係では無駄ではない」
  rationale: 語順とパウロの用法に沿って信徒の労苦を限定する句として訳し、結びつきの性質を一つの説明に狭めない。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: この文脈では復活したキリストへの称号として「主」が自然であり、神学的含意も保つ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。勧告の力を保ちながら、「主にあって」の神学的な広がりを説明的な言い換えで狭めない。
