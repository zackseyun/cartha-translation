  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: ja
  text: このようにも書かれています。「最初の人、アダムは、生きた存在となった。最後のアダムは、命を与える霊となった。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「生きた魂」。創世記2章7節の伝統的な訳を反映する表現です。
    reason: lexical_alternative
  - marker: b
    text: 「命を与える霊」は、「命を与える霊的存在」とも理解できます。最初のアダムとの対比の中で最後のアダムを述べる表現です。ギリシア語は質的な表現であり、キリストを三位一体における聖霊の位格と明示的に同一視しているとは限りません。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: このようにも書かれています
  rationale: οὕτωςとκαίが、直前の議論と聖書の引用を結び付けているため、「このようにも」でその連続性を保った。「書かれています」は現代日本語で自然な聖書引用の定型表現。
- source_word: Ἐγένετο
  choice: となった／となりました
  rationale: γίνομαιが示す到達した状態を自然に表す。「造られた」とすると受動の意味を加えるため避けた。引用部分では原文の調子に合わせて常体、後半では本文の敬体に合わせた。
- source_word: ὁ πρῶτος ἄνθρωπος Ἀδὰμ
  choice: 最初の人アダム
  rationale: ἄνθρωποςを「人」とし、人類最初の者であるアダムと「最後のアダム」との類型的対比を明確にした。
- source_word: εἰς ψυχὴν ζῶσαν
  choice: 生きる者
  rationale: 創世記2章7節の背景では、ψυχήは分離可能な非物質的部分に限定されず、生きた存在としての人を指す。「生きる者」は簡潔で、七十人訳との響きも保つ。伝統的な「生きた魂」は脚注に残した。
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: 最後のアダム
  rationale: パウロのアダムとキリストの類型的・終末論的対比を、定着した自然な表現で保持した。
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: 命を与える霊
  rationale: 冠詞のないπνεῦμαの質的な表現と、ζῳοποιέωの「生かす、命を与える」という意味を保った。聖霊という位格との明示的同一視を訳文に加えない。
theological_decisions:
- issue: 創世記引用におけるψυχήの人間論的意味
  choice: ψυχὴν ζῶσανを「生きる者」と訳す。
  alternative: 「生きた魂」
  rationale: ここではアダムが生命ある存在となったことが中心であり、身体から分離した魂という特定の人間論を本文以上に読み込まないため。伝統的な訳語は脚注で示す。
- issue: 「最後のアダムは命を与える霊となった」の意味
  choice: 類型的対比を説明的に狭めず、「命を与える霊」と訳す。
  alternative: 「命を与える御霊」または「命を与える方である霊」
  rationale: πνεῦμαには冠詞がなく、表現は質的に理解できる。したがって、復活したキリストを三位一体における聖霊の位格と明示的に同一視する訳語は避け、原文の神学的緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。本文全体は敬体とし、直接引用のみ聖書引用として簡潔な常体を用いた。「生命」より日常的で自然な「命」を採用し、神学的な説明は本文に織り込まず脚注に置いた。
