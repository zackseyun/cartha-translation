  text: ἰδοὺ μυστήριον ὑμῖν λέγω· ⸀πάντες οὐ κοιμηθησόμεθα πάντες δὲ ἀλλαγησόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/051.yaml
  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: ja
  text: 見なさい。私はあなたがたに奥義を告げます。私たちすべてが眠りにつくのではありません[a]。しかし、私たちは皆、変えられます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちすべてが死ぬのではありません」とも意訳できます。ギリシア語は「眠る」と述べており、新約聖書では、復活を見据えて死を表す一般的な比喩です。
    reason: lexical_alternative
  - marker: b
    text: 注目すべき異読には、「私たちすべてが眠りにつくが、私たちすべてが変えられるのではない」という趣旨のものがあります。本文はSBLGNTの読み方に従っています。
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す提示表現の力を保ちつつ、現代日本語で理解できる荘重な言い方とした。
- source_word: μυστήριον
  choice: 奥義
  rationale: 単なる不可解な謎ではなく、かつて隠され、今や告げられる神の真理というパウロ的意味を簡潔に表す。
- source_word: ὑμῖν λέγω
  choice: 私はあなたがたに奥義を告げます
  rationale: 与格の聞き手を明示し、λέγωの宣言的な力を自然な日本語で表した。目的語『奥義』との結びつきから『言います』より『告げます』が自然である。
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: 私たちは皆が眠りにつくのではありません
  rationale: οὐがπάντεςを伴う全体を否定して『全員がそうなるわけではない』という意味になることを明確にし、復活を背景とする死の比喩『眠る』を保持した。
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: しかし、皆が変えられます
  rationale: δέの対照を『しかし』で示し、未来受動形を『変えられます』として、終末における変容を過度に説明せず直接表した。
theological_decisions:
- issue: 復活の文脈における『眠る』の意味
  choice: 肉体の死を指す比喩として『眠りにつく』を本文に残す
  alternative: 『死ぬ』と解釈的に訳す
  rationale: パウロの復活に関する比喩と文脈上の響きを保つため。これは魂の状態について特定の教説を訳文に持ち込むものではない。
- issue: 節後半の本文異読
  choice: SBLGNTの本文に従い、『皆が眠るのではないが、皆が変えられる』とする
  alternative: 『皆が眠るが、皆が変えられるのではない』という趣旨の異読
  rationale: 提示されたギリシア語本文を直接訳し、意味の大きく異なる注目すべき異読は脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、重大な啓示の告知にふさわしい簡潔で品位ある調子とした。『奥義』はやや宗教的な語だが、パウロのμυστήριονの啓示的意味を『謎』より正確に保つ。
