reference: 1 Corinthians 15:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: ja
  text: その後、キリストはヤコブに現れ、次にすべての使徒に現れました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には、「ヤコブに見られ、次にすべての使徒に見られました」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: その後
  rationale: 復活したキリストの顕現を順に列挙する時間・順序の副詞。直前の出来事を受ける自然な現代日本語として「その後」とした。
- source_word: ὤφθη
  choice: 現れました
  rationale: ὁράωのアオリスト受動形だが、復活後の顕現について慣用的に用いられている。字義的な「見られました」より自然で、出来事を明確に伝える「現れました」とした。
- source_word: Ἰακώβῳ
  choice: ヤコブに
  rationale: ὤφθηに伴う与格。固有名Ἰάκωβοςの日本語聖書で定着した表記を用いた。
- source_word: εἶτα
  choice: 次に
  rationale: 列挙の次の段階を示す順序の副詞。ἔπειταとの機能上の近さを保ちつつ、自然な日本語の流れを作る。
- source_word: ἀποστόλοις
  choice: 使徒
  rationale: ここでは一般的な使者ではなく、復活の証人として認められた使徒たちを指すため、定着した用語「使徒」を用いた。
- source_word: πᾶσιν
  choice: すべての
  rationale: 使徒たち全体を強調する語を、範囲を狭めず直接訳した。
theological_decisions:
- issue: ヤコブと「すべての使徒」との関係、および後者の範囲
  choice: 「すべての使徒」とそのまま訳し、構成員を限定しない。
  alternative: 「十二人」または十二人とは別の、より広い派遣された証人たちの集団と解する。
  rationale: ギリシア語本文はこの集団の厳密な範囲を定義していない。ヤコブへの顕現と、その後の「すべての使徒」への顕現との区別も含め、本文の曖昧さと順序を保つ。
- issue: ὤφθηの態の表現
  choice: 日本語では能動的な慣用表現「現れました」とする。
  alternative: 受動形を表面上保って「見られました」とする。
  rationale: 原語の受動形は復活顕現を表す慣用法であり、「現れた」は主体をキリストとする自然な日本語である。ただし、より字義的な形は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から明らかな主語「キリスト」を補い、二つの顕現に「現れました」を反復して、短い節の並列関係を明確にした。敬体で統一した。
