reference: 1 Corinthians 15:57
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: ja
  text: しかし、神に感謝します。神は、私たちの主イエス・キリスト[a]を通して、私たちに勝利を与えてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」はギリシア語の称号で、「メシア」（油を注がれた者）を意味する。
    reason: Χριστόςの称号的意味を明示し、定着した日本語表記「イエス・キリスト」と原語の意味の対応を追跡可能にする。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の死と罪と律法についての叙述から、神への感謝へ転じる穏やかな対照を示す。
- source_word: τῷ θεῷ χάρις
  choice: 神に感謝します
  rationale: χάρις はここでは神に向けた感謝の定型的表現であり、「恵み」ではなく感謝を表す。現代日本語として明瞭な文にした。
- source_word: τῷ διδόντι
  choice: 神は…与えてくださいます
  rationale: 現在分詞は神を『与える方』として描き、継続的・一般的な働きを表す。敬意と感謝の文脈を自然な補助動詞で表現した。
- source_word: ἡμῖν τὸ νῖκος
  choice: 私たちに勝利を
  rationale: 文脈上、死に対する特定の終末的勝利を指すが、日本語では定冠詞を明示せずとも自然に特定される。
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: 私たちの主…を通して
  rationale: 属格を伴う διά の手段・媒介を「を通して」で表し、κύριος のキリスト論的称号を「主」とした。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語では「イエス・キリスト」が Χριστός の称号的由来を保ちつつ定着した標準表現である。「イエス・メシア」は意味を明示するが、本文では不自然さが勝るため注記で示す。
theological_decisions:
- issue: Χριστός を名称に近い定着形と称号のどちらで表すか
  choice: 本文では「キリスト」
  alternative: 「メシア」または「救い主」
  rationale: Χριστός は「油を注がれた者」、すなわちメシアという称号だが、「イエス・キリスト」は現代日本語の聖書・一般用法で広く定着している。「救い主」は語義を狭めるため避けた。称号の意味は脚注で保持する。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。ギリシア語の一文を日本語では二文に分け、感謝の宣言とその根拠を読み取りやすくした。脚注を置かないため、本文中にも脚注記号はない。
