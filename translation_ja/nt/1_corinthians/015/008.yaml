  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: ja
  text: 最後に、だれよりも後に、まるで流産した胎児のような私にも、キリストは現れました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「流産した胎児」または「中絶された胎児」。比喩的には「異常に生まれた者」とも訳せる。パウロはここで強烈な自己卑下の比喩を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: そして、すべての人の最後に
  rationale: ἔσχατονを副詞的に取り、先に列挙されたすべての証人に続く時間的順序を明確にした。δὲは強い対比ではなく叙述の継続として「そして」とした。
- source_word: ὡσπερεὶ
  choice: まるで…に対するように
  rationale: 近似を伴う比較の働きを保ち、パウロが自らをἐκτρώμαにたとえていることが分かる形にした。
- source_word: τῷ ἐκτρώματι
  choice: 月足らずで生まれた者
  rationale: 文字どおりには流産・死産または中絶された胎児を指し得る強烈な語だが、本文では異常な時に生まれた者という自己卑下の比喩を自然な日本語で保ち、より直訳的な意味を脚注に示した。
- source_word: ὤφθη
  choice: 現れてくださいました
  rationale: 復活顕現の文脈で「現れた」と訳した。主語であるキリストへの日本語としての自然な敬意を表すため敬語を用いたが、原文にない教義的内容は加えていない。
- source_word: κἀμοί
  choice: 私にも
  rationale: καίとἐμοίの融合形が持つ付加の意味を簡潔に表し、パウロ自身も一連の目撃者に含まれることを示した。
theological_decisions:
- issue: パウロの自己描写ἐκτρώματιの訳し方
  choice: 本文を「月足らずで生まれた者」とし、直訳的な語義を脚注に置く。
  alternative: 「流産した胎児」「中絶された者」「異常に生まれた者」
  rationale: 比喩が示す異常性と自己卑下を残しつつ、その具体的な含意を一つの神学的解釈に限定しないため。
- issue: 復活したキリストの顕現を表すὤφθη
  choice: 「現れてくださいました」
  alternative: 「見られました」「現れました」
  rationale: この受動形は復活顕現の定型的文脈で自然に「現れた」と表せる。「見られた」では日本語として目撃者側の行為が前面に出すぎる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの列挙の流れと比喩の衝撃を両立させた。本文は礼拝朗読にも耐える品位を保ち、難語の直訳的意味は脚注で補った。
