reference: 1 Corinthians 15:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: ja
  text: 兄弟たち[a]、私はこう言います。肉と血[b]は神の国を受け継ぐことができず、朽ちるものが朽ちないものを受け継ぐこともありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは会衆全体への呼びかけとして男女の双方を含み得る。
    reason: lexical_alternative
  - marker: b
    text: 「肉と血」は、現在の死すべき状態にある人間を指す慣用表現であり、体を伴う復活そのものを否定する言葉ではない。
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: 私はこう言います
  rationale: 指示語 τοῦτο と発言動詞 φημι を簡潔に保った。δέ の弱い移行の働きは、日本語で不自然な接続語を加えず、文脈上の展開に委ねた。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を保持した。会衆全体を含み得る用法であることは脚注で示した。
- source_word: σὰρξ καὶ αἷμα
  choice: 「肉と血」
  rationale: 現在の死すべき人間のあり方を指す慣用表現を、原文の比喩的な響きとともに保持した。
- source_word: βασιλείαν θεοῦ
  choice: 神の国
  rationale: 属格構文と神学的な重みを自然な定訳で表した。
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: 受け継ぐ
  rationale: 二つの用例を同じ語で訳し、相続と終末的受領の含意、および原文の並行関係を保った。
- source_word: οὐ δύναται
  choice: ことができず
  rationale: 能力または可能性の否定を明確な現代日本語で表した。
- source_word: ἡ φθορά
  choice: 朽ちるもの
  rationale: 復活の文脈における、滅びや腐敗に服する状態を具体的で分かりやすく表し、対句を保った。
- source_word: τὴν ἀφθαρσίαν
  choice: 朽ちないもの
  rationale: φθορά との語形上・意味上の対照を保ち、「不死」と訳して別語 ἀθανασία との区別を失うことを避けた。
theological_decisions:
- issue: 「肉と血」と復活の体との関係
  choice: 現在の死すべき、朽ちる人間のあり方を指す慣用表現として訳す
  alternative: 物質的な身体そのものは神の国に入れないという意味に解する
  rationale: 直前直後の文脈は、体を捨てることではなく、朽ちる状態から朽ちない状態への変容を論じている。本文では原文の慣用表現を保ち、反身体的な解釈を訳文に持ち込まない。
- issue: 呼びかけ ἀδελφοί の対象範囲
  choice: 本文では「兄弟たち」とし、男女を含む会衆全体を指し得ることを脚注に記す
  alternative: 本文で「兄弟姉妹たち」と明示する
  rationale: 原文の文法的な男性形を見える形で保ちつつ、文脈上の包括的用法も読者に知らせるため。
- issue: φθορά と ἀφθαρσία の対照
  choice: 「朽ちるもの／朽ちないもの」
  alternative: 「腐敗／不朽」または「死すべきもの／不死のもの」
  rationale: 原語の対照を保ち、ἀφθαρσία を関連するが同一ではない「不死」に限定しないため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、使徒の直接的な語り口と「受け継ぐ」の反復を保持した。「肉と血」は慣用句として引用符で示し、「朽ちるもの／朽ちないもの」の対照は平易で dignified な表現にした。
