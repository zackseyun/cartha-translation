  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: ja
  text: 「死よ、あなたの勝利はどこにあるのか。[a] 死よ、あなたのとげはどこにあるのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本では、最初の句を「死よ、あなたのとげはどこにあるのか」としています。この読みは、欽定訳聖書などの伝統的な翻訳に反映されています。
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: どこにあるのか
  rationale: 所在を問う疑問副詞だが、ここでは死に対する勝利の宣言を込めた修辞的な問い。日本語として自然で、原文にない「今」を補わず、直接的な力を保つ。
- source_word: σου
  choice: あなたの
  rationale: 二人称単数属格による所有を表す。擬人化された「死」への直接の呼びかけに対応する自然な表現。
- source_word: θάνατε
  choice: 死よ
  rationale: 呼格で、擬人化された死に直接呼びかけている。「死よ」は簡潔で格調があり、詩的な呼びかけの力を保つ。
- source_word: νῖκος
  choice: 勝利
  rationale: 勝利、征服を意味する。直前の15:54にある死が勝利にのみ込まれたとの宣言とも呼応し、SBLGNTの本文をそのまま反映する。
- source_word: κέντρον
  choice: とげ
  rationale: 刺すもの、針、突き棒を指し得る。15:56で罪との関係が説明される死の害する力を表す比喩として、「とげ」は分かりやすく、原語の具体的な像も保つ。
theological_decisions:
- issue: 第一節の本文異読
  choice: SBLGNTのνῖκοςを「勝利」として本文に採用する
  alternative: 一部の写本に従い、第一節も「とげ」とする
  rationale: 指定された原語本文はνῖκοςであり、「勝利……とげ」という対句を形成する。また、直前の15:54における「勝利」との文脈的なつながりも保たれる。伝統的な「とげ」の読みは重要な本文異読として脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、二度の「死よ」という呼びかけと修辞的な問いを保ち、復活の勝利を告げる荘重で詩的な調子を維持した。「刺す針」などと説明的にせず、「とげ」によって比喩の簡潔さを残した。
