  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: ja
  text: また、ケファ[b]に現れ[a]、それから十二人[c]に現れたことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ケファに見られた」。ギリシア語の動詞は形式上受動形ですが、復活後の顕現を述べる文脈では一般に「現れた」と訳されます。
    reason: lexical_alternative
  - marker: b
    text: ケファは、ペトロに対応するアラム語の名です。
    reason: cross_reference
  - marker: c
    text: 「十二人」はイエスの使徒たちの集団を指す定着した呼称で、どの時点でも実際の人数が常に十二人だったという意味ではありません。
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ὅτι
  choice: また、～たことです
  rationale: 直前から続く内容節の連なりを保ちつつ、単独でも自然な現代日本語となるようにした。
- source_word: ὤφθη
  choice: 現れた
  rationale: 形式上は受動形だが、復活後の顕現を述べる文脈では「現れた」が自然であり、イエスが目に見えるかたちでご自身を示したという趣旨を過度に説明せず伝える。
- source_word: Κηφᾷ
  choice: ケファに
  rationale: 固有名Κηφᾶςの与格を音写し、よりなじみ深い「ペトロ」へ本文で置き換えず、原文の名称を保った。
- source_word: εἶτα
  choice: それから
  rationale: 証人の順序を示す語として、自然で明確な時間的推移を表す。
- source_word: τοῖς δώδεκα
  choice: 十二人に
  rationale: イエスの使徒的集団を指す定着した呼称を保持し、「使徒たち」や「十一人」に言い換えなかった。
theological_decisions:
- issue: 復活後の顕現を表すὤφθη
  choice: 現れた
  alternative: 見られた
  rationale: ギリシア語の受動形を機械的に再現せず、復活顕現の文脈に即した慣用的な訳を採用した。ただし、顕現の様態について本文以上の説明は加えていない。
- issue: ユダ不在後の「十二人」
  choice: 十二人
  alternative: 十一人／使徒たち
  rationale: 人数に関する他箇所との調和を図らず、原文にある使徒集団の定着した呼称をそのまま訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「また」と「ことです」で前後の内容節との連続を示し、固有名と集団呼称は原文に即して保持した。
