id: 1CO.15.40
reference: 1 Corinthians 15:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: ja
  text: また、天に属する体[a]も、地に属する体もあります。しかし、天に属する体の栄光と、地に属する体の栄光とは、それぞれ異なります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天体と地上の体」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: 体
  rationale: 「体」はσῶμαの基本的な意味を保ち、ここで天体、復活の体、あるいは存在の身体的な形態のいずれかに限定しません。
- source_word: ἐπουράνια
  choice: 天に属する
  rationale: ἐπουράνιοςの「天にある／天に属する」という広がりを自然な日本語で示し、単に天文学上の「天体」へ限定することを避けます。
- source_word: ἐπίγεια
  choice: 地に属する
  rationale: ἐπίγειοςの「地上の／地に属する」という意味を、対句となる「天に属する」と釣り合う表現で示します。
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前半と後半の対照を明確にする、現代日本語の自然な逆接表現です。
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: それぞれ異なります
  rationale: 二つの栄光が同一ではなく、種類または性質を異にするという対比を、過度に説明せず自然に表します。
- source_word: δόξα
  choice: 栄光
  rationale: 文脈上の輝きや壮麗さを含みつつ、パウロ書簡における語彙上・神学上の連続性を保ちます。
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: 天に属する体の……地に属する体の
  rationale: ギリシア語では「体」が省略されていますが、日本語では補って反復することで指示対象を明確にします。
theological_decisions:
- issue: 「天に属する体」と「地に属する体」の指示対象
  choice: どちらも一般的な「体」と訳し、指示対象を限定しない。
  alternative: 「天体と地上の体」または「天上の存在と地上の存在」とする。
  rationale: 原文は「存在」ではなくσώματα（体）を用いています。天使的存在に限定することも、天文学上の物体だけに限定することもせず、異なる身体的存在と栄光をめぐるパウロの比喩が持つ幅と神学的緊張を保ちます。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「栄光」という聖書的で格調ある語を保持しました。「天に属する／地に属する」の対句により、原文の均衡と意味の広がりを再現しています。
