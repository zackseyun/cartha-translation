  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: ja
  text: この福音によって、あなたがたは、私があなたがたに福音として告げたことばをしっかり保っているなら、救われつつあります[a]。もっとも、あなたがたがむなしく信じたのでなければ、のことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救われています」とも訳せる。ギリシア語の現在形は、進行中の過程を表すとも、現在の事実を一般的に表すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: この福音によって
  rationale: διά＋属格の手段の意味を「によって」で表し、関係代名詞の先行詞である前節の福音を自然な日本語で明示した。
- source_word: σῴζεσθε
  choice: 救われつつあります
  rationale: 現在受動形の継続的な含みを保ちつつ、救いについて特定の教理体系を持ち込まない表現とした。
- source_word: τίνι λόγῳ
  choice: どのようなことばで
  rationale: 疑問詞を含む原文の形と、λόγοςの「ことば／知らせ」の幅をできる限り保った。「で」は告知内容との関係を自然に示す。
- source_word: εὐηγγελισάμην
  choice: 福音を告げた
  rationale: 動詞に含まれる「良い知らせを告げる」という意味を、簡潔で一般に理解しやすい聖書語で表した。
- source_word: κατέχετε
  choice: しっかり保っている
  rationale: 継続して保持し固守する意味を、現代日本語として明瞭に表した。
- source_word: ἐκτὸς εἰ μὴ
  choice: そうでなければ
  rationale: 例外を導く句を、直前の条件との論理的関係が明確になる自然な日本語にした。
- source_word: εἰκῇ
  choice: 無駄だった
  rationale: 空しく、結果を伴わず、目的を果たさないという警告を平明に表した。
- source_word: ἐπιστεύσατε
  choice: 信じた
  rationale: アオリストが指す、福音を受け入れた時点での信仰行為を簡潔に訳した。
theological_decisions:
- issue: σῴζεσθεにおける救いの相
  choice: 救われつつあります
  alternative: 救われます／救われています
  rationale: 現在形の継続的な含みを前面に出し、完成した面と進行中の面をめぐる神学的緊張を一方的に解消しない。
- issue: εἰ κατέχετεの条件性
  choice: ただし……しっかり保っているならです
  alternative: あなたがたが真に信じた証拠として保っているなら／当然保っているのですから
  rationale: 原文が示す条件をそのまま条件として伝え、堅忍や救いの確証に関する特定の教派的説明を加えない。
- issue: ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατεの関係
  choice: そうでなければ、あなたがたが信じたことは無駄だったことになります
  alternative: もっとも、あなたがたがむなしく信じたのでなければ
  rationale: 原文の警告と例外的含意を明瞭な日本語にしつつ、信仰の真正性か結果の空しさかを過度に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「福音」は文脈上の主要語として保持した。「救われつつあります」は日常語としてやや特徴的だが、原文の現在形が持つ継続的な含みを明示するため採用し、別訳を脚注に示した。
