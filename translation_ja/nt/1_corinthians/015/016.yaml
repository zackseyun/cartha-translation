  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: ja
  text: 死者が復活させられないのなら、メシア[a]でさえ復活させられてはいないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語の称号Χριστόςは、「メシア」とも、長年の伝統に従って「キリスト」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 〜のなら、〜からです
  rationale: 条件を表すεἰを「〜のなら」、パウロの論証を支える説明のγάρを文末の「〜からです」で自然に表した。
- source_word: νεκροὶ
  choice: 死者
  rationale: 実体詞的に用いられた複数形で、死んだ人々一般を指すため、簡潔で自然な「死者」とした。
- source_word: οὐκ ἐγείρονται
  choice: 復活させられない
  rationale: 復活という文脈を明示しつつ、受動態を保った。現在形は、死者の復活そのものを否定する一般的な仮定として表した。
- source_word: οὐδὲ
  choice: 〜も…ない
  rationale: 前件の否定がメシアにも及ぶという論理的帰結を、自然な日本語の添加的否定で示した。文脈上、その強い意外性も保たれる。
- source_word: Χριστὸς
  choice: メシア
  rationale: Χριστόςの称号としての意味を明示した。日本語では長年「キリスト」とも訳されるため、その伝統的訳語を脚注に示した。
- source_word: ἐγήγερται
  choice: 復活させられてはいない
  rationale: 完了受動形を、すでに行われたはずの復活とその現在に続く結果の否定として訳し、受動の形も保った。
theological_decisions:
- issue: 復活についての論証におけるΧριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは油注がれた者という称号の意味が神学的論証の中で有効であるため「メシア」とした。一方、「キリスト」は日本語聖書で定着した正当な訳語なので脚注に残し、どちらか一方だけが可能であるかのようには扱わない。
- issue: ἐγείρωの受動態と復活の主体
  choice: 復活させられる
  alternative: 復活する／よみがえる
  rationale: 原文の受動態を保つことで、復活が本人の自発的動作としてだけ表されるのを避けた。ただし、原文がこの節で行為者を明記していないため、「神によって」とは補わなかった。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で格調を保った文体とした。原文の条件文、説明を示すγάρ、二つの受動形、後半の完了による継続的結果を可能な限り自然な日本語で保持した。
