source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: ja
  text: しかし、もしメシアがよみがえらされていないなら[a]、あなたがたの信仰はむなしいものです[b]。あなたがたは今なお、あなたがたの罪の中にいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」の代わりに「キリスト」とも訳せる。また、「よみがえっていない」とも訳せる。
    reason: 称号の別訳、および受動・中動の表現上の別訳を示すため。
  - marker: b
    text: 別訳「無益です」。
    reason: ματαίαが表す、むなしさ・役に立たなさという意味の幅を示すため。
lexical_decisions:
- source_word: Χριστὸς
  choice: メシア
  rationale: ここでは称号としての意味を保ち、「油注がれた者」を指す語として訳した。日本語で伝統的な「キリスト」も可能なため、脚注に示した。
- source_word: ἐγήγερται
  choice: よみがえらされていない
  rationale: 完了形の現在に及ぶ結果と、明示されていない行為者を補わない受動表現の両方を保った。
- source_word: ματαία
  choice: むなしく
  rationale: この文脈で、信仰が望む結果をもたらさず無益であることを、明瞭で自然な現代日本語で表す。
- source_word: πίστις
  choice: 信仰
  rationale: ここではコリントの信徒たちが信じていることを指し、「忠実さ」よりも「信仰」が適切である。
- source_word: ἔτι
  choice: 今なお
  rationale: 復活がなければ罪の中にある状態が現在まで続いている、という継続性を表した。
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: 自分たちの罪の中に
  rationale: 罪にある状態を示す原文の比喩を保持しつつ、ὑμῶνが聞き手自身を指すことを自然な日本語で明確にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前までの議論に対する反対条件を示す接続詞として訳した。
theological_decisions:
- issue: 復活の表現と行為者
  choice: よみがえらされていない
  alternative: よみがえっていない
  rationale: 原文の形態に即して受動的に訳し、暗示されうる神の働きを保ちながらも、原文に明記されていない行為者を本文へ補わないため。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名のように扱うより、油注がれた者という称号として理解できるため。「キリスト」は広く定着した別訳として脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「よみがえらされていない」で原文の完了形と受動的な含みを保ち、「今なお」によって現在まで続く状態を自然に表した。
