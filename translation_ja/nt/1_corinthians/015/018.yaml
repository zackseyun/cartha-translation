  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: ja
  text: そうであれば、メシアにあって眠りについた人たちも、滅びたことになります。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストにあって」。
    reason: alternative_reading
  - marker: b
    text: 「眠りについた」は、死を指すギリシア語の婉曲表現で、ここでは特に信者の死について用いられています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: そうであれば
  rationale: 直前までの仮定から帰結を導く推論の小辞。パウロの反証的な論の流れを自然な日本語で示す。
- source_word: καὶ
  choice: も
  rationale: メシアにあって死んだ人々を、直前に述べられた帰結に加える添加の働きを保つ。
- source_word: οἱ κοιμηθέντες
  choice: 眠りに就いた人たち
  rationale: 死を表すギリシア語の婉曲的な比喩を、単に「死んだ」と平板化せず保持する。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςの称号としての意味と、パウロに特徴的な結合・帰属を表すἐνの表現を保持する。
- source_word: ἀπώλοντο
  choice: 滅びてしまったことになります
  rationale: 復活がないという仮定から生じる決定的な喪失と、その結果としての状態を、日本語の論証の流れに即して表す。
theological_decisions:
- issue: パウロの「ἐν Χριστῷ」の訳し方
  choice: メシアにあって
  alternative: キリストにあって
  rationale: Χριστόςを称号として訳しつつ、ἐνを単なる手段や信仰対象に限定せず、原文の関係的な幅を残す。伝統的な「キリスト」は脚注に示す。
- issue: ἀπώλοντοが示す喪失の性質
  choice: 滅びてしまった
  alternative: 失われた／滅ぼされた
  rationale: 中動態形を不必要に受動化せず、復活がないなら死者は決定的に滅びたことになる、という文脈上の神学的緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「眠りに就く」で原文の比喩を残し、「そうであれば」「ことになります」によって前節からの仮定的推論であることを明示した。
