id: 1CO.15.35
reference: 1 Corinthians 15:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: ja
  text: しかし、ある人はこう言うでしょう。「死者はどのようにしてよみがえらされるのか。また、どのような体で来るのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死者はどのようにしてよみがえるのか」。ギリシア語の動詞は受動態で、直訳すれば「よみがえらされる」であり、神が行為者であることを示唆している可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: しかし
  rationale: 予想される反論または問いへの対照的な移行を、自然な現代日本語で示す。
- source_word: ἐρεῖ τις
  choice: ある人はこう言うでしょう
  rationale: 未来直説法と不定代名詞を保ちつつ、仮想の問い手を導入する修辞的表現として自然に訳した。
- source_word: Πῶς
  choice: どのようにして
  rationale: 復活の方法または可能性を問う疑問副詞の意味を明確に表す。
- source_word: ἐγείρονται
  choice: よみがえらされる
  rationale: 復活の文脈に即しながら、ギリシア語の受動態を保持し、行為者を本文以上に明示しない。
- source_word: οἱ νεκροί
  choice: 死者
  rationale: 集合的な実体用法を簡潔で自然な日本語にした。
- source_word: ποίῳ ... σώματι
  choice: どのような体で
  rationale: ποίῳ の種類・性質を問う力を「どのような」で保ち、与格を自然な助詞「で」で表した。
- source_word: δὲ
  choice: また
  rationale: 強い逆接ではなく、第二の問いを第一の問いに続ける接続として訳した。
- source_word: ἔρχονται
  choice: 来る
  rationale: ἔρχομαι の基本的な語義を保ち、「現れる」などの解釈を加えない。
theological_decisions:
- issue: 復活の表現と行為主体
  choice: 死者はどのようにしてよみがえらされるのか
  alternative: 死者はどのようにしてよみがえるのか
  rationale: ἐγείρονται の受動態を訳文に残し、神の働きを含意し得る余地を保つ一方、行為主体を明示して本文の範囲を越えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「復活させられる」より聖書文脈で自然な「よみがえらされる」を採用し、受動態も保持した。脚注記号は節全体に関わるため文末に置いた。
