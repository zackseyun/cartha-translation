source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: ja
  text: 私は最も大切なこととして、自分も受けたことをあなたがたに伝えました。すなわち、メシア[a]が私たちの罪のために、聖書のとおり[b]死なれたことです、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語のクリストスは「油を注がれた者」を意味する称号である。
    reason: alternative_reading
  - marker: b
    text: または「聖書に従って」「聖書に記されているとおり」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: 伝えた
  rationale: 受け継いだ教えを権威あるものとして他者に伝達する意味を、現代日本語で自然に表す。
- source_word: γὰρ
  choice: （文脈上の説明関係として表現）
  rationale: 前節を説明する接続辞。単独の「というのは」を置くより、「私が…伝えたのは」という構文で説明の流れを自然に示した。
- source_word: ἐν πρώτοις
  choice: まず何よりも大切なこととして
  rationale: 時間的な順序だけでなく、重要性の優先を表す可能性が高い。両方の含みを保つ表現とした。
- source_word: ὃ καὶ παρέλαβον
  choice: 私自身も受けたこと
  rationale: παρέδωκαとの伝承の受領・伝達の対応を保ち、「も」でκαίを示した。
- source_word: ὅτι
  choice: すなわち
  rationale: 受けて伝えた内容を導入する語として、後続する告白的内容が明瞭になる自然な日本語を採った。
- source_word: Χριστὸς
  choice: メシア
  rationale: この告白的要約では称号としての力が認められるため、ユダヤ的な「油注がれた者」の含意を保つ「メシア」とした。
- source_word: ἀπέθανεν
  choice: 死なれた
  rationale: アオリストの出来事を過去形で表し、主語への敬意を自然な日本語として示す。
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: 私たちの罪のために
  rationale: ὑπέρの広い代償的・恩恵的関係を保ち、特定の贖罪理論に限定しない。
- source_word: κατὰ τὰς γραφάς
  choice: 聖書に記されているとおり
  rationale: 聖書との一致・符合を明瞭に表す。複数形γραφαίは、日本語で集合的に用いられる「聖書」で自然に表した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは告白の内容を導く称号的用法が前面に出ているため「メシア」とした。ただし日本語で定着した「キリスト」も可能なので脚注に示す。
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶνの意味
  choice: 私たちの罪のために
  alternative: 私たちの罪に代わって／私たちの罪ゆえに
  rationale: 原文はキリストの死と私たちの罪との救済的関係を述べるが、その仕組みを一つの贖罪理解に限定してはいないため、幅を保つ訳とした。
- issue: κατὰ τὰς γραφάςの係り方
  choice: 死なれたことに係る位置に置く
  alternative: 「聖書に従って」と訳す
  rationale: 聖書との符合を表す一方、特定の旧約箇所や成就の様式を本文で補わない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「まず何よりも大切なこととして」でἐν πρώτοιςの重要性を示し、受領と伝達の対応を保った。節が次節へ続くため読点で閉じた。
