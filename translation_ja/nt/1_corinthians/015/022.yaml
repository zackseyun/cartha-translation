source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: ja
  text: なぜなら、アダムにあってすべての人が死ぬのと同じように、メシア[a]にあってすべての人が生かされることになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシャ語の称号Χριστός（クリストス）は「油を注がれた者」、すなわち「メシア」を意味する。
    reason: 称号の意味訳と伝統的な音訳の両方を示すため。
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: というのも、〜ように
  rationale: γάρの説明・論証を前文につなぐ働きを「というのも」で示し、ὥσπερとοὕτωςの対応を「〜ように、〜」で自然に表した。
- source_word: ἐν τῷ Ἀδὰμ
  choice: アダムにあって
  rationale: ἐνの簡潔な代表的・共同体的含意を保ち、「アダムを通して」のように手段へ限定しない表現とした。
- source_word: πάντες
  choice: すべての人
  rationale: 二度のπάντεςを同じ表現で訳し、原文の広く限定のない並行関係を保った。
- source_word: ἀποθνῄσκουσιν
  choice: 死ぬ
  rationale: 現在形が表す一般的事実を、日本語の非過去形で簡潔に示した。
- source_word: οὕτως καὶ
  choice: 同じ構文による「〜ように、〜」
  rationale: 直訳的な「そのようにまた」より自然な日本語としつつ、前半と後半の対応およびκαίの加算的な力を文全体の並行構造に保持した。
- source_word: ἐν τῷ Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςを称号として意味訳し、ἐνは前半の「アダムにあって」と対応させて、関係の厳密な性質を訳文で限定しなかった。
- source_word: ζῳοποιηθήσονται
  choice: 生かされる
  rationale: 未来受動形を文脈上の将来的な出来事として表しつつ、受動態による神の働きの含みを保持した。日本語では文脈と「からです」により未来の意味が自然に伝わる。
theological_decisions:
- issue: 二つのπάντεςの範囲
  choice: 両方を「すべての人」とし、限定を加えない
  alternative: 後半を「信じるすべての人」などと限定する、または両者の範囲があらゆる点で同一だと明示する
  rationale: 原文はπάντες…πάντεςという意図的な並行を置く一方、この一節だけでは後半の範囲や仕組みを説明していないため、神学的緊張をそのまま残した。
- issue: ἐνの神学的関係
  choice: 「にあって」
  alternative: 「との結びつきによって」「を通して」
  rationale: 代表性、連帯、結合などの可能な含意の一つに絞らず、アダムとメシアの並行を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「にあって」によってパウロの簡潔で神学的な表現を保持した。「生かされる」は自然で格調があり、受動態も明確に保つ。脚注記号は対象語「メシア」の直後に置いた。
