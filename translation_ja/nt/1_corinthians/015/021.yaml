  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: ja
  text: 死が人を通して[a][b]来たのですから、死者の復活もまた人を通して来たのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: どちらの節も「人によって」とも訳せる。ギリシア語の前置詞は、媒介と行為主体のどちらも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 文脈では、この二人はアダムとキリストを指す（15章22、45節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: のですから
  rationale: ἐπειδήの理由・前提を示す働きと、γάρの説明的なつながりを、現代日本語で自然な「のですから」によって表した。
- source_word: δι’ ἀνθρώπου
  choice: 一人の人を通して
  rationale: 属格を伴うδιάが表す媒介・行為主体の幅を「を通して」で保った。ἀνθρώπουは単数であり、文脈上アダムとキリストというそれぞれ一人の男性を指すため、「一人の人」とした。ただし原文に数詞εἷςはない。
- source_word: θάνατος
  choice: 死が…来た
  rationale: 原文は動詞を省いた簡潔な名詞文であるため、日本語として文を成立させるのに「来た」を補った。死が人を介して世界に入ったという文脈にも合う。
- source_word: καὶ
  choice: もまた
  rationale: 二つの節の対応関係を明瞭にし、死と復活の並行を自然な日本語で示した。
- source_word: ἀνάστασις νεκρῶν
  choice: 死者の復活
  rationale: 死者が実際に復活することを指すパウロの表現を簡潔かつ直接的に訳し、単なる死後の生や比喩的な再生には弱めなかった。
- source_word: δι’ ἀνθρώπου
  choice: 一人の人を通して
  rationale: パウロが意図した二節の厳密な並行を保つため、前半と同じ表現を繰り返した。
theological_decisions:
- issue: アダムとキリストの代表的対比
  choice: 本文では両者を「一人の人」とし、固有名は補わない。
  alternative: 「アダムを通して…キリストを通して」または「人を通して…人を通して」
  rationale: 15章22節と45節から人物は明らかだが、この節自体は名を挙げず、簡潔な並行表現によって原理を述べている。その緊張を保った。
- issue: 復活の性質
  choice: ἀνάστασις νεκρῶνを「死者の復活」と訳す。
  alternative: 「霊的な復活」または「死後の生」
  rationale: 第一コリント15章の議論は死者の現実の復活を扱っており、曖昧な死後存続や比喩的再生に置き換えないため。
- issue: 復活について補う動詞の時制
  choice: 「来るのです」とする。
  alternative: 「来たのです」または「もたらされるのです」
  rationale: ギリシア語本文は両節とも動詞を明示しない。日本語では補充が必要であり、死者の復活の将来的完成を自然に表す「来る」を採ったが、原文そのものは時制を限定していない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、死と復活、人と人との簡潔な並行を保持した。「来た／来る」は原文の省略された動詞を日本語として補ったもので、後半を未来的にしたことは注記上の判断として明示した。
