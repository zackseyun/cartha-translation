  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: ja
  text: 「すべてのものをその方の足の下に従わせた」とあるからです。しかし、「すべてのものが従わせられた」と言われるとき、すべてのものをその方に従わせた方は含まれないことが明らかです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的な範囲を保ち、人々だけに限定しない。詩篇8篇を背景とする表現との響きも保つ。
- source_word: ὑπέταξεν
  choice: 従わせた
  rationale: 他者を従属する関係に置く使役的な意味を、自然な現代日本語で表す。文脈上、引用された聖書の宣言として訳した。
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: その方の足の下に
  rationale: 支配と服従を示す聖書的慣用表現であり、引用の響きを保つため字義的に訳す。αὐτοῦの指示対象を本文だけで過度に特定しないよう「その方」とした。
- source_word: ὅταν δὲ εἴπῃ
  choice: しかし、…と言うとき
  rationale: 明示されていない主語を「神」や「聖書」と補わず、ギリシア語の曖昧さを保ちながら自然な日本語にした。
- source_word: ὑποτέτακται
  choice: 従わせられた
  rationale: 完了受動形の、従属させる行為とその結果としての状態を受動表現で示す。
- source_word: δῆλον
  choice: 明らかです
  rationale: 読者が認めるべき論理的帰結を示す非人称的な述語を、明快で格調を損なわない日本語にする。
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: すべてのものをその方に従わせた方は含まれない
  rationale: ἐκτόςの例外の意味を明示し、「すべて」に服従させた方自身は含まれないという論理を自然に表す。
- source_word: αὐτῷ
  choice: その方に
  rationale: すべてのものが服従させられる相手を示す与格を直接的に訳し、本文内では固有の称号を補わない。
theological_decisions:
- issue: 御子と、すべてのものを従わせた方との関係
  choice: 「すべて」の中には、すべてのものをその方に従わせた方は含まれないと明示する。
  alternative: 「すべてのものをその方に従わせた方を除いて」と訳す。
  rationale: パウロが述べる明確な例外と両者の区別を保つ一方、訳文の中で関係性について本文以上の教理的説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書引用の荘重さを保った。「服従させる」より一般読者に自然な「従わせる」を採用し、原文で省略された主語や代名詞の指示対象を不必要に断定しなかった。
