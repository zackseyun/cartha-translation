reference: 1 Corinthians 15:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: ja
  text: というのは、私は使徒たちの中で最も小さい者であり、使徒と呼ばれるにふさわしくありません[a]。神の教会を迫害したからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「使徒と呼ばれる資格がない」または「適任ではない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: （訳文では文脈上の理由関係として表現）
  rationale: 前節を受ける説明の接続詞。日本語では独立した一節として「というのは」を置くより、後半の「からです」と節全体の論理で示すほうが自然である。
- source_word: ἐλάχιστος
  choice: 最も小さい者
  rationale: 身体的な小ささではなく、使徒たちの中での自己評価を表す。「最も小さい」は比喩を保ちつつ、へりくだりを自然に伝える。
- source_word: ἀπόστολος / ἀποστόλων
  choice: 使徒／使徒たち
  rationale: ここでは単なる使者ではなく、認められた使徒の一団とその務めを指すため、定着した用語を用いる。
- source_word: ἱκανός
  choice: ふさわしい
  rationale: 「十分な、適格な」という幅を持つ語だが、迫害の過去に基づく自己卑下の文脈では「ふさわしい」が自然。ただし資格・適格性の含みを脚注で保持する。
- source_word: καλεῖσθαι
  choice: 呼ばれる
  rationale: 受動不定詞の構造をそのまま自然な日本語で表す。
- source_word: διότι
  choice: からです
  rationale: 使徒と呼ばれるにふさわしくないとする明示的な理由を、明瞭な現代日本語で示す。
- source_word: ἐδίωξα
  choice: 迫害した
  rationale: パウロが以前、信者共同体に敵対して行った行為を指すため、「追い求めた」ではなく敵対的意味を明示する。
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: 神の教会
  rationale: パウロ書簡で神に属する信者共同体を指す定着した自然な表現であり、属格関係も保つ。
- source_word: ὃς
  choice: （日本語では主語を反復せず文を接続）
  rationale: ギリシア語では関係代名詞が先行句を受けるが、日本語で直訳的に「その私は」とすると不自然なため、並列的に続けて同一主語を明確に保つ。
theological_decisions:
- issue: パウロの使徒性と自己卑下の関係
  choice: パウロは自分を使徒たちの中に含めながら、その名で呼ばれるにふさわしくないと述べる。
  alternative: パウロが自らの使徒性そのものを否定している、または道徳的な問題ではなく社会的地位だけを低く評価していると読む。
  rationale: 「使徒たちの中で最も小さい者」は彼がその一員であることを前提とし、「ふさわしくない」は迫害の過去に根差す自己評価を示す。訳文では両者の緊張を解消しない。
translation_notes:
  register: 明瞭で現代的かつ礼節のある文体。「いちばん小さい」より「最も小さい」を用いて、公的朗読にも適する格調を保った。脚注記号[a]は関連句の直後ではなく節末に置き、本文の流れを妨げず語義の幅を示した。
