  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: ja
  text: 第一の人は地に由来し、土からなる者であり、第二の人は天に由来します。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτος
  choice: 第一の
  rationale: アダムとキリストを対比する序数であり、後半の「第二の」との明確な並行を保つため。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ここでは第一の人アダムと第二の人キリストを代表的人物として指す。「人」は現代日本語で自然であり、原文の反復も保てる。
- source_word: ἐκ γῆς
  choice: 地から出た
  rationale: ἐκは起源を表し、γῆはこの文脈で人が造られた地・大地を指す。創造記事への連想を保ちながら自然な日本語とした。
- source_word: χοϊκός
  choice: 土でできた者
  rationale: 土・ちりから成ることを表す形容詞で、アダムの創造を響かせる。「土のような」よりも物質的起源が明瞭である。
- source_word: δεύτερος
  choice: 第二の
  rationale: 「第一の」と対をなす序数として、パウロの意図的な並行表現を保持する。
- source_word: ἐξ οὐρανοῦ
  choice: 天から出た
  rationale: 起源が天にあることを示す。「空」ではなく「天」とすることで、文脈上の超越的意味を保つ。
theological_decisions:
- issue: 「第二の人」が誰を指すか
  choice: 原文どおり「第二の人」とし、「キリスト」を補わない。
  alternative: 「第二の人キリスト」
  rationale: 文脈上はキリストを指すが、この節のギリシア語本文には固有名がないため、解釈的な語を本文へ加えない。
- issue: 二つの無動詞節の時制
  choice: 「であり」「です」により現在の一般的な断定として訳す。
  alternative: 前半を過去形の「であった」、後半を現在形の「である」と訳す。
  rationale: ギリシア語にはどちらの節にも明示的なコピュラがない。日本語では不必要な時制差を持ち込まず、対照関係を自然に示した。
- issue: アダムとキリストの対照
  choice: 「第一の人」「第二の人」の反復と並行をそのまま保つ。
  alternative: 「最初の人間アダム」「天から来たキリスト」と説明的に展開する。
  rationale: 神学的な対応関係は文脈から明らかになるため、この節では原文の簡潔さと緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「第一の人／第二の人」という簡潔で格調ある並行表現を保持した。「地」と「土」を使い分け、起源（ἐκ γῆς）と材質・性質（χοϊκός）の双方を伝えた。
