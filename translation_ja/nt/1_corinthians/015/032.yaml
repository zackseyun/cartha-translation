  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: ja
  text: 人間的な見方で言えば[a]、私がエフェソで野獣と戦ったとして[b]、私に何の益があるでしょうか。死者が復活させられないのなら、「食べたり飲んだりしよう。明日は死ぬのだから。」[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間的な言い方をすれば」。この句は、パウロの語り方、または人間的な観点を示している可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「野獣と戦った」は、実際の野獣との闘いとも、野獣のように残忍な人々から受けた激しい敵対の比喩とも理解できる。本文では原文の表現をそのまま保った。
    reason: alternative_reading
  - marker: c
    text: イザヤ書22章13節からの引用またはその言葉への言及。
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: 人間的な見方で言えば
  rationale: 人間の立場・観点または人間的な語り方を示す慣用句として自然に訳しつつ、どちらに係るかの曖昧さは脚注で示した。
- source_word: ἐθηριομάχησα
  choice: 野獣と戦った
  rationale: 語の鮮明な字義を保持し、実際の野獣との闘いか、残忍な人間の敵対者を指す比喩かを本文では決めない。
- source_word: ἐν Ἐφέσῳ
  choice: エフェソで
  rationale: 地名の標準的な日本語音写を用いた。
- source_word: τί μοι τὸ ὄφελος
  choice: それが私に何の益になるでしょう
  rationale: 利益・有益さを問う修辞疑問の力を、明瞭で品位ある現代日本語で表した。
- source_word: νεκροὶ
  choice: 死者
  rationale: 名詞的に用いられた形容詞を、復活の文脈に適した簡潔な日本語にした。
- source_word: ἐγείρονται
  choice: 復活させられない
  rationale: 受動形を保ち、死者を起こす主体を明示せず、神の行為を含意し得る原文の形を維持した。
- source_word: Φάγωμεν καὶ πίωμεν
  choice: 食べたり飲んだりしよう
  rationale: 勧奨の接続法を「～しよう」で表し、引用句の自然な勢いを保った。
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: どうせ明日は死ぬのだから
  rationale: 現在形の未来的用法を自然な日本語で表した。「どうせ」は、復活がないという仮定のもとでの投げやりな標語の含みを伝える。
theological_decisions:
- issue: ἐθηριομάχησαが実際の野獣との闘いか、残忍な人間の敵対者との闘いの比喩か
  choice: 本文では「野獣と戦った」と字義的な像を保持し、歴史的解釈を確定しない。
  alternative: エフェソでの激しい人的迫害を表す比喩として明示的に訳す。
  rationale: 原文の表現はどちらの理解も許し、この節の論証は解釈の確定を必要としないため、神学的・歴史的緊張を保持した。
- issue: κατὰ ἄνθρωπονが語り方を限定するか、行動の観点・動機を限定するか
  choice: 本文では「人間的な見方で言えば」とし、係り方の幅を残す。
  alternative: 「人間の考えだけで」「人間的な言い方をすれば」など、特定の係り方に限定する。
  rationale: 原文の句はパウロの語り方にも、人間的観点から見た行動にも係り得るため、本文と脚注で曖昧さを保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、修辞疑問と引用句の力を保った。「益」はやや格調を保ちつつ一般読者にも理解可能。「復活させられない」はギリシア語の受動態を明示するため採用した。
