revisions:
- from: 人間的な見方で言えば[a]、私がエフェソで野獣と戦ったとしても、それが私に何の益になるでしょう。死者が復活させられないのなら[b]、「食べたり飲んだりしよう。どうせ明日は死ぬのだから。」[c]
  to: 人間的な見方で言えば[a]、私がエフェソで野獣と戦ったとして[b]、私に何の益があるでしょうか。死者が復活させられないのなら、「食べたり飲んだりしよう。明日は死ぬのだから。」[c]
  rationale: 条件表現を原文により忠実な「したとして」へ改め、根拠のない「どうせ」を削除した。さらに、野獣との闘いを説明する脚注bを、その説明対象である「野獣と戦った」に正しく配置した。その他の語彙選択と、文字どおり／比喩的理解を本文で決定しない方針は維持した。
