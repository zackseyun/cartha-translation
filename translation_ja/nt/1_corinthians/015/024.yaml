reference: 1 Corinthians 15:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: ja
  text: それから、終わり[a]が来ます。その時、キリストは王国を父である神に引き渡し[b]、あらゆる支配、あらゆる権威、あらゆる力を無力にします[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「完成」。ギリシア語の「テロス」は、「終わり」「目標」「完成」を意味し得ます。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「王国を神であり父である方に引き渡し」。ここでは「神」と「父」を同格と理解しています。
    reason: lexical_alternative
  - marker: c
    text: または「あらゆる支配、あらゆる権威、あらゆる力を廃します」「無効にします」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: それから
  rationale: 復活について述べる一連の出来事の次の段階を示す。現代日本語で自然に時間的進行を表す。
- source_word: τὸ τέλος
  choice: 終わり
  rationale: τέλοςには「終わり」「目標」「完成」の幅がある。終末的な順序の中で、意味を限定しすぎない簡潔な訳とした。
- source_word: ὅταν παραδιδῷ
  choice: その時、…引き渡し
  rationale: ὅτανと接続法が指す将来の時を自然な日本語で示し、統治を委ね渡す意味を保った。
- source_word: τὴν βασιλείαν
  choice: 王国
  rationale: βασιλείαは王国と王的支配の双方を表し得る。引き渡すという比喩との結びつきが明瞭で、動的な統治の意味も排除しない。
- source_word: τῷ θεῷ καὶ πατρί
  choice: 父である神に
  rationale: 神と父を同格と見る構文を、自然かつ明瞭な日本語で表した。
- source_word: ὅταν καταργήσῃ
  choice: 無力にします
  rationale: καταργέωは機能を失わせる、無効にする、廃するという意味を持つ。存在の消滅まで断定せず、働きを決定的に終わらせる語感を保った。
- source_word: πᾶσαν ἀρχὴν
  choice: あらゆる支配
  rationale: ἐξουσία、δύναμιςと並ぶ文脈で、支配する権力または支配領域を指し得る曖昧さを保つため、抽象名詞で訳した。
- source_word: πᾶσαν ἐξουσίαν
  choice: あらゆる権威
  rationale: 行使される権限・権威を表す標準的で明瞭な訳語。
- source_word: δύναμιν
  choice: 力
  rationale: 権力的存在の連語の一部として、広い意味を保つ簡潔な訳語。
theological_decisions:
- issue: τῷ θεῷ καὶ πατρίにおける「神」と「父」の関係
  choice: 同格的に「父である神」
  alternative: 「神また父に」または「神であり父である方に」
  rationale: 文脈上、御子が王国を引き渡す相手である父を神として示す表現と理解した。御子について本文が述べていない事柄を付加せず、構文関係を明確にした。
- issue: καταργήσῃが諸力に及ぼす作用
  choice: 無力にする
  alternative: 廃する、滅ぼす、無効にする
  rationale: 敵対的な支配・権威・力の働きが決定的に終わることを示しつつ、それらの存在そのものの消滅を必要以上に断定しない。
- issue: ἀρχήが指すもの
  choice: 支配
  alternative: 支配者、統治、元首的な力
  rationale: 人格的支配者とも抽象的な支配権とも取り得るため、日本語でも幅を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、終末についての宣言にふさわしい荘重さを保った。「キリスト」は直前の文脈から補った主語であり、ギリシア語本文では動詞の三人称単数形に含まれる。長い従属構造は二文に分けず、句読点で論理関係を明確にした。
