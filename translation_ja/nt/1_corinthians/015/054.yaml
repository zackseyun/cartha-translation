source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: ja
  text: しかし、この朽ちるものが朽ちない性質を身に着け、この死ぬべきものが死なない性質を身に着ける時、書かれている言葉が実現する。「死は勝利にのみ込まれた。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イザヤ書25章8節からの引用。パウロが引用するギリシア語の伝承に沿った表現。
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: 朽ちるもの
  rationale: 名詞的に用いられた形容詞で、朽ちる性質を持つ現在の身体を指す。「朽ちないもの」との対照を明確に保つ。
- source_word: ἐνδύσηται
  choice: 身に着ける
  rationale: 衣服を着る比喩を自然な現代日本語で保持する。中動態を不自然に逐語訳せず、主体が新しい性質をまとうイメージを伝える。
- source_word: ἀφθαρσίαν
  choice: 朽ちないもの
  rationale: 抽象名詞だが、先行する「朽ちるもの」と対応させ、衣服の比喩にも合う自然な表現とした。「不朽」は簡潔だが一般読者にはやや硬い。
- source_word: θνητὸν
  choice: 死ぬべきもの
  rationale: 死を免れない性質を表し、「死なないもの」と対をなす。ここでの「べき」は義務ではなく必然・運命を示す慣用表現。
- source_word: ἀθανασίαν
  choice: 死なないもの
  rationale: 死のない状態を平明に表し、「死ぬべきもの」との対照を明確にする。
- source_word: γενήσεται
  choice: 実現する
  rationale: γίνομαιの「起こる、現実となる」という意味を、書かれた言葉を主語とする自然な日本語で表す。「成就する」ほど専門的な履行定式にはしない。
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: 書かれている言葉
  rationale: 引用される記述を指す λόγος と完了受動分詞の意味を素直に保持する。
- source_word: Κατεπόθη
  choice: のみ込まれた
  rationale: アオリスト受動の完結した宣言と、死が別の力によってのみ込まれる像を保持する。
- source_word: εἰς νῖκος
  choice: 勝利に
  rationale: 結果として死が勝利のうちに完全に打ち破られることを簡潔に示す。日本語では「勝利にのみ込まれた」が引用の比喩をよく保つ。
theological_decisions:
- issue: γενήσεται と聖書引用の関係
  choice: 「実現する」
  alternative: 「成就する」「そのとおりになる」
  rationale: 書かれた言葉が現実となる意味は伝えつつ、原文に明示されない専門的な「成就」定式へ狭めない。
- issue: Κατεπόθη の時制・相
  choice: 「のみ込まれた」
  alternative: 「のみ込まれてしまう」「のみ込まれている」
  rationale: 未来の時点で確定した事実として引用されるアオリスト受動を、日本語の完了的な過去形で保持する。
- issue: εἰς νῖκος の解釈
  choice: 「勝利に」
  alternative: 「勝利のうちに」「完全に」
  rationale: 「完全に」と意訳して結果の強さだけに限定せず、νῖκος の「勝利」という語を明示し、原文の簡潔さと比喩的緊張を残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「朽ちるもの／朽ちないもの」「死ぬべきもの／死なないもの」という対応を用い、衣服をまとう比喩と二組の対照を保った。引用は簡潔な宣言調とした。
