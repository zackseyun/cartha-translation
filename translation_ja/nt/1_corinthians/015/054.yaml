- from: しかし、この朽ちるものが朽ちないものを身に着け、この死ぬべきものが死なないものを身に着ける時、書かれている言葉が実現する。「死は勝利にのみ込まれた。」[a]
  to: しかし、この朽ちるものが朽ちない性質を身に着け、この死ぬべきものが死なない性質を身に着ける時、書かれている言葉が実現する。「死は勝利にのみ込まれた。」[a]
