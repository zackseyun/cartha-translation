id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: ja
  text: そうでなければ、死者のために[a]バプテスマを受ける人たちは、何をするのでしょうか。死者が全くよみがえらされないのなら、なぜ死者のためにバプテスマを受けるのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死者に代わって」または「死者のゆえに」、可能性は低いものの「死者の上で」とも訳せる。ギリシア語の前置詞には複数の理解が可能であり、パウロがどのような慣行を指しているのかは確定できない。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: そうでなければ
  rationale: 直前までの復活についての議論を受け、復活を否定した場合に生じる帰結を示す修辞的な移行として訳した。
- source_word: τί ποιήσουσιν
  choice: 何をするのでしょうか
  rationale: ποιέωの広い意味を保ち、「何の益があるのか」などと結論を先取りせず、修辞疑問の開かれた表現を維持した。
- source_word: οἱ βαπτιζόμενοι
  choice: バプテスマを受ける人たち
  rationale: 現在受動分詞を、継続または慣行を表し得る自然な日本語で訳し、その実践の正当性については判断を加えていない。
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: 死者のために
  rationale: 属格を伴うὑπέρの代表的な意味を簡潔に示しつつ、「代わって」と限定するよりも広い日本語表現を選び、議論のある関係性を脚注で明示した。
- source_word: εἰ ὅλως
  choice: 全く……ないのなら
  rationale: ὅλωςが条件文に加える強調を、自然な日本語の「全く」で保持した。
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: 死者が全くよみがえらされない
  rationale: ἐγείρονταιの受動態を保ち、復活させる主体を本文に補わず、神的受動の可能性も損なわないようにした。
- source_word: τί καὶ βαπτίζονται
  choice: なぜ……バプテスマを受けるのでしょうか
  rationale: τί καίをこの反復的な修辞疑問に即して「なぜ」と訳し、議論の流れを自然に表した。
- source_word: ὑπὲρ αὐτῶν
  choice: 彼らのために
  rationale: αὐτῶνが前出の死者を指すこと、および最初のὑπέρとの語彙的な対応を保った。
theological_decisions:
- issue: 「死者のための」バプテスマの意味
  choice: 「死者のためにバプテスマを受ける」と、解釈を最小限に抑えて訳す。
  alternative: 「死者に代わって」「死者のゆえに」「死者の上で」バプテスマを受ける。
  rationale: この句が指す歴史的慣行と神学的意味には諸説がある。パウロが復活を論じるためにその慣行へ言及していることは示しつつ、特定の教派的説明や慣行への是認を訳文に持ち込まないため。
translation_notes:
  register: 明瞭で現代的ながら、修辞疑問の重みを保つ丁寧体とした。「洗礼」ではなく原語との対応が見えやすい「バプテスマ」を用い、議論のある慣行を説明的に言い換えなかった。
