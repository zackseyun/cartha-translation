source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: ja
  text: そうすると、私たちもまた、神についての偽証人と認められることになります。というのも、神がメシアを復活させたと、私たちは神に反して[a]証言したからです。もし実際に死者が復活させられないのであれば、神はそのメシアを復活させなかったことになるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神に反して」は「神について」とも訳せます。ギリシア語のκατά＋属格は通常「〜に反して」を意味しますが、ここでは証言の対象を示すと理解することもできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρισκόμεθα δὲ καὶ
  choice: そうであれば、私たちは…とさえ認められることになります
  rationale: 直前から導かれる論理的帰結と、καίの強調を自然な現代日本語で表した。受動形の「認められる」により、偽証人であると判明する意味を保つ。
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: 神についての偽証人
  rationale: 属格を対象・関連の属格と理解し、神について偽りを証言する者という意味を明確にした。
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: 私たちは神に反して証言した
  rationale: κατά＋属格の通常の対立的意味を保持した。神が行わなかったことを神に帰したなら、その証言は神に反するものとなる、という議論の厳しさを表す。
- source_word: ἤγειρεν τὸν Χριστόν
  choice: 神はメシアを復活させた
  rationale: 文脈上、Χριστόςは称号として機能するため「メシア」とした。ἐγείρωは他動詞・能動態なので「復活させた」とした。
- source_word: ὃν οὐκ ἤγειρεν
  choice: 実際、神はメシアを復活させなかったことになります
  rationale: 先行する条件を日本語で明瞭に受けつつ、同じ動詞の反復による修辞的対照を保った。
- source_word: εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται
  choice: 死者が復活させられないのなら
  rationale: 議論のために置かれた条件を「のなら」で示し、受動態により死者が復活させられるという原文の形を保持した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: 定冠詞を伴い、復活論証における称号として用いられているため、音写的な「キリスト」ではなく称号の意味を示した。
- issue: κατὰ τοῦ θεοῦの意味
  choice: 神に反して
  alternative: 神について
  rationale: κατά＋属格の対立的意味を優先した。使徒たちの証言内容は神についてのものだが、それが偽りなら神に逆らう証言になる、という神学的緊張を解消せずに残した。
- issue: 復活を表す受動態
  choice: 復活させられない
  alternative: 復活しない
  rationale: 原文の受動態を保ち、死者の復活が外からなされる出来事として語られている点を示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「偽証人」「証言」で法廷的な響きを保ち、「復活させる」で能動・受動の区別を明示した。長いギリシア語文は論理関係を保ちながら二文に分けた。
