  text: Why are we also in danger every hour?[a]
translation:
  language: ja
  text: では、なぜ私たちも絶えず危険にさらされているのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「また、私たちが毎時間危険にさらされているとは、どういうことですか」。文脈上の意味は、「では、なぜ私たちも絶えず危険にさらされているのですか」。
    reason: τίの「なぜ」に対するより字義的な可能性と、πᾶσαν ὥρανの逐語的な時間表現を示すため。
lexical_decisions:
- source_word: τί
  choice: なぜ
  rationale: この修辞疑問では、行為の理由・意義を問う用法であり、復活がないなら危険を冒す意味は何か、という文脈上の論旨を自然に表す。
- source_word: καὶ
  choice: も
  rationale: 直前までの議論に「私たち」を加える付加的な意味を簡潔に示す。
- source_word: ἡμεῖς
  choice: 私たち
  rationale: 明示された代名詞を保持する。「も」と組み合わせることで、原文の付加・対比の力が伝わる。
- source_word: κινδυνεύομεν
  choice: 危険にさらされている
  rationale: 「危険な状態にある、危険を冒す」という意味を過度に限定せず表す。「命を危険にさらす」ほど解釈を加えない。
- source_word: πᾶσαν ὥραν
  choice: 絶えず
  rationale: 字義的には「一時間ごとに」だが、ここでは継続的・頻繁な危険を表す慣用的な時間表現であるため、現代日本語として自然な「絶えず」とした。
theological_decisions:
- issue: 復活をめぐるパウロの議論における修辞的な力
  choice: 死者が復活しないなら、使徒たちが絶えず危険にさらされるのはなぜか、と問う修辞疑問として訳す。
  alternative: 情報を求める通常の疑問文、または「何のために」と目的を明示する訳。
  rationale: 疑問詞 τί と直近の文脈は修辞疑問を支持する。「なぜ」は論証の力を保ちながら、目的や動機を必要以上に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。文頭の「では」で前節から続く論証を示し、「絶えず」によって πᾶσαν ὥραν の継続的な意味を自然に表した。
