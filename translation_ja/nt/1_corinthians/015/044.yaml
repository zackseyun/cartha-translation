id: 1CO.15.44
reference: 1 Corinthians 15:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: ja
  text: 自然の命に属する体として蒔かれ、霊に属する体としてよみがえらされます。自然の命に属する体があるなら、霊に属する体もあります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「魂に属する体……霊に属する体」。ここでの対比は、物質的な体と非物質的な体との対比ではなく、通常の人間的な命によって特徴づけられる体と、霊によって特徴づけられる体との対比です。文脈上、後者の「霊」は神の御霊を指すと理解されることが多いです。
    reason: ψυχικόνとπνευματικόνの字義的な対比を示しつつ、πνεῦμαの指示対象を本文で過度に限定しないため。また、復活の体を非物質的なものとする誤解を避けるため。
lexical_decisions:
- source_word: σπείρεται
  choice: 蒔かれ
  rationale: 現在受動態を保ち、直前から続く種蒔きの比喩を明確に伝える。
- source_word: σῶμα
  choice: 体
  rationale: 死と復活における人間の身体を指す、直接的で自然な訳語。
- source_word: ψυχικόν
  choice: 自然のいのちに属する
  rationale: 単なる「物質的」ではなく、通常の被造物としてのいのちによって特徴づけられた状態を表し、πνευματικόνとの対比を日本語で明瞭にする。
- source_word: ἐγείρεται
  choice: よみがえらされます
  rationale: 復活を表す受動態として文脈に最も適し、行為を受ける意味も保つ。
- source_word: πνευματικόν
  choice: 御霊に属する
  rationale: 非物質的な体という誤解を避けつつ、神の霊によって特徴づけられるという語の関係的意味を示す。
- source_word: Εἰ
  choice: あるなら
  rationale: 条件文の形を解消せず、そのまま保持する。
- source_word: καὶ
  choice: も
  rationale: 二つ目の体の存在を加える語の力を自然な日本語で表す。
theological_decisions:
- issue: 「自然の体」と「霊の体」の対比
  choice: 通常の人間的ないのちに属する体と、御霊に属する体との対比として訳す。
  alternative: 「物質的な体」と「非物質的な体」との対比として読む。
  rationale: ψυχικόνとπνευματικόνは、体の有無や物質性を対比するのではなく、その体を特徴づけるいのちのあり方を対比している。両方にσῶμαが用いられていることを尊重した。
- issue: πνευματικόνにおけるπνεῦμαの指示
  choice: 文脈上、神の御霊との関係を示す「御霊に属する」とする。
  alternative: 曖昧さをより形式的に保つ「霊的な」とする。
  rationale: 「霊的な体」は日本語では非物質的存在と誤解されやすい。パウロの用法と文脈に即して御霊との関係を明示するが、体そのものを否定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、復活を論じる箇所にふさわしい格調を保った。「自然の体／霊の体」という短い定型表現より説明的だが、現代日本語における誤解を避け、原文の意味上の対比を伝えることを優先した。
