id: 1CO.15.43
reference: 1 Corinthians 15:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: ja
  text: 卑しさのうちに蒔かれ、栄光のうちによみがえらされます。弱さのうちに蒔かれ、力のうちによみがえらされます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: 蒔かれます
  rationale: 現在受動形を保ち、直前から続く種と体の比喩を「植えられる」より明確に伝える。日本語では主語を補わず、文脈上の「体」を自然に受ける。
- source_word: ἀτιμίᾳ
  choice: 卑しいものとして
  rationale: δόξῃとの対照を保ちつつ、単なる内面的な羞恥ではなく、尊厳や誉れを欠く状態を表す。「恥辱のうちに」より現代日本語として自然である。
- source_word: ἐγείρεται
  choice: よみがえらされます
  rationale: 復活の文脈を明示しながら受動態を保持し、行為者である神を本文に明記しない原文の表現を尊重する。
- source_word: δόξῃ
  choice: 栄光あるものとして
  rationale: 復活の文脈におけるδόξαの神学的な広がりと、ἀτιμίαとの鮮明な対照を保つ。
- source_word: ἀσθενείᾳ
  choice: 弱いものとして
  rationale: 身体的なもろさを含み得る広い意味を保ち、δυνάμειとの対照を自然に示す。
- source_word: δυνάμει
  choice: 力あるものとして
  rationale: 単なる筋力に狭めず、復活によって与えられる力を含むδύναμιςの広がりを保つ。
theological_decisions:
- issue: 復活表現の態と行為者
  choice: 「よみがえらされます」という受動表現を用い、行為者を明記しない。
  alternative: 「神がよみがえらせます」
  rationale: ギリシャ語の受動態を保ち、暗黙の神的行為者をパウロが述べた以上に明示しないため。
- issue: 省略された主語の指示対象
  choice: 日本語でも主語を補わず、直前の文脈にある「体」を受けさせる。
  alternative: 「体は蒔かれ、体はよみがえらされます」
  rationale: 原文で動詞に含まれる単数の主語は文脈上「体」を指すが、日本語では反復せずとも明瞭であり、原文の簡潔な並行構造も保てる。
- issue: ἐνを伴う四つの対照表現
  choice: 「卑しいものとして／栄光あるものとして／弱いものとして／力あるものとして」と状態の対照として表す。
  alternative: 「卑しさのうちに／栄光のうちに／弱さのうちに／力のうちに」
  rationale: ἐνの状態・様態的な働きを、意味を狭めず自然な現代日本語で伝え、埋葬時と復活時の体の対照を明瞭にするため。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。原文の二組の反復と対句を保持し、丁寧体で統一した。「蒔く」という比喩は前後の種と体の議論とのつながりを優先して残した。
