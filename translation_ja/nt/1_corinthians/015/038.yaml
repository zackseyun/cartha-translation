  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: ja
  text: しかし神は、ご自身が望まれたとおりに、その種に体を与え、種の一つ一つに、その種固有の体を与えられます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωσιν
  choice: 与えておられます
  rationale: 現在形の継続的・一般的な働きを自然な現代日本語で表しつつ、神を主語とする文にふさわしい敬意を保った。
- source_word: αὐτῷ
  choice: それに
  rationale: 直前の文脈にある単数の「種」を受ける代名詞として、指示対象を説明的に補わず訳した。
- source_word: σῶμα
  choice: 体
  rationale: 章全体における復活の「体」との語彙的なつながりを保ち、種に与えられる具体的な形態も表せる標準的な訳語である。
- source_word: καθὼς ἠθέλησεν
  choice: ご自分が望まれたとおりに
  rationale: 神の意志を明確に表しながら、「選んだ」などの解釈的な限定を加えず、アオリストを日本語として自然に表した。
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: 種の一つ一つに
  rationale: ἑκάστῳの分配的な意味と属格複数を簡潔に保った。「種類」という概念は原文に明示されていないため補わなかった。
- source_word: ἴδιον
  choice: それぞれ固有の
  rationale: 各々の種に特有で、それに属する体という個別化の意味を自然な日本語で表した。
theological_decisions:
- issue: 種と体の比喩における神の主体性と意志
  choice: 神がご自分の望みどおりに各々へ体を与えるという原文の主張をそのまま示した。
  alternative: 神が各「種類」に応じた体を定める、と説明的に訳すこともできる。
  rationale: 本文は神の意志と各々に異なる体が与えられることを強調するが、「種類」や生物学的区分までは明示していないため、特定の体系的解釈を加えなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。神への敬意は「ご自分」「望まれた」「与えておられます」で示したが、過度に古風な宗教語は避けた。
