review_pass:
  verdict: revise
  source_fidelity: 原文は「神が、それ（前節の蒔かれる種）に、御心のままに体を与え、種の一つ一つに固有の体を与える」と述べる。草案の基本的理解は正確だが、「与え、…与えておられます」は同一の現在形動詞に対して時制・相の表し方が不統一であり、「それぞれ固有の」はやや重複する。
  naturalness: 「その種に」「種の一つ一つに、その種固有の体を」とすることで、指示対象とἴδιονの個別化を明瞭で自然な現代日本語として表せる。敬語は一貫して「望まれた」「与えられます」とした。
  terminology: σῶμαは、段落および章内の連関を保つため「体」とする。ἴδιονは「その種固有の」とし、単に異なるという以上に各種に属する体であることを保つ。脚注の「種々の種」は原文にない「種々」を加えているため修正する。
  issues:
  - severity: medium
    issue: 本文内で動詞の表現が「与え」と「与えておられます」に不統一である。
    rationale: δίδωσινは単一の現在形動詞で、後半にも同じ動詞が省略されている。一貫して一般的・現在的な「与えられます」とするのが自然で、継続相を過度に加えない。
  - severity: low
    issue: 「それぞれ固有の体」は分配表現と「固有」がやや重なる。
    rationale: ἴδιονの「各々に属する」を「その種固有の」と明示すれば、重複を避けつつ原文の強調を保持できる。
  - severity: medium
    issue: 脚注の「種々の種のそれぞれに」はギリシア語にない「種々」を含む。
    rationale: ἑκάστῳ τῶν σπερμάτωνは「種の一つ一つに／種のそれぞれに」であり、「種々の」は語彙上の追加となる。
  revised_text: しかし神は、ご自身が望まれたとおりに、その種に体を与え、種の一つ一つに、その種固有の体を与えられます。
  revised_footnotes:
  - marker: a
    text: 「種の一つ一つに」は、「それぞれの種に」とも訳せる。ギリシア語は「種の一つ一つに」という表現で、各々に配分する意味を表す。
    reason: lexical_alternative
  revision_rationale: 原文の語順と二つの与格の関係を保ちながら、単一の現在形δίδωσινを日本語で一貫して表した。αὐτῷの先行詞である前節の種は「その種」として必要最小限に明確化した。脚注から原文にない「種々」を除き、分配的用法のみを説明した。
