- from: しかし神は、ご自分が望まれたとおりに、それに体を与え、種の一つ一つに[a]それぞれ固有の体を与えておられます。
  to: しかし神は、ご自身が望まれたとおりに、その種に体を与え、種の一つ一つに、その種固有の体を与えられます。
  rationale: 原文の語順と二つの与格の関係を保ちながら、単一の現在形δίδωσινを日本語で一貫して表した。αὐτῷの先行詞である前節の種は「その種」として必要最小限に明確化した。脚注から原文にない「種々」を除き、分配的用法のみを説明した。
