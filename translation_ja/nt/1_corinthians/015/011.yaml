  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: ja
  text: ですから、私であれ彼らであれ、私たちはこのように宣べ伝え、あなたがたもこのように信じたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ですから、私であれ彼らであれ、このように私たちは宣べ伝え、このようにあなたがたは信じたのです。」
    reason: οὕτωςの反復と、原文により近い語順を明示する訳の可能性を示す。
lexical_decisions:
- source_word: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι
  choice: そこで、私であれ、あの人たちであれ
  rationale: οὖνの前文を受ける推論的な働きを「そこで」で示し、εἴτε…εἴτεの対比を「…であれ、…であれ」で保った。ἐκεῖνοιは文脈上、先に挙げられたほかの使徒たちを指すが、本文では明示を加えず「あの人たち」とした。
- source_word: οὕτως κηρύσσομεν
  choice: 私たちはこのように宣べ伝え
  rationale: οὕτωςの指示性と、κηρύσσωの公に告げ知らせる意味を保つ。「宣べ伝える」は聖書的な品位を保ちつつ現代日本語でも理解できる。
- source_word: καὶ οὕτως ἐπιστεύσατε
  choice: あなたがたもこのように信じたのです
  rationale: 二度目のοὕτωςを同じ「このように」として並行を保った。καίはここでは宣教と信仰の対応を自然に示す「も」とし、アオリストの過去の応答を「信じた」で表した。
theological_decisions:
- issue: 使徒たちの宣教の一致が何を指すか
  choice: パウロであれ、ほかの人々であれ、直前に要約された同じ復活の福音を宣べ伝え、コリントの人々もそれを信じたという文脈的な一致を示す。
  alternative: 「このように」を宣教や信仰の仕方・様態への強い言及として読む。
  rationale: οὕτωςには内容と様態の両面があり得るため、「このように」として曖昧さを残した。本文を越えた教会論的主張は加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「あの人たち」はἐκεῖνοιの指示性を保ち、前後の文脈からほかの使徒たちを指すと理解できる。脚注標識は本文末に置いた。
