source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: ja
  text: 死者の復活も、これと同じです。朽ちるものとして蒔かれ、朽ちないものとしてよみがえらされます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: も、これと同じです
  rationale: 直前の種の比喩を受ける比較・帰結の力を、自然な現代日本語で明示する。
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: 死者の復活
  rationale: 属格構文を簡潔かつ正確に保ち、文脈上の身体的復活を過度に説明しない。
- source_word: σπείρεται
  choice: 蒔かれ
  rationale: 農耕の比喩と受動態を保持し、後半の「よみがえらされます」と対応させる。
- source_word: ἐν φθορᾷ
  choice: 朽ちるものとして
  rationale: φθοράが表す滅びやすさ・朽ちやすさを自然な日本語で表し、単なる腐敗過程に限定しない。
- source_word: ἐγείρεται
  choice: よみがえらされます
  rationale: 復活文脈での意味とギリシア語の受動態を保ち、主体が自力で起きるとの含みを避ける。
- source_word: ἐν ἀφθαρσίᾳ
  choice: 朽ちないものとして
  rationale: φθοράとの語彙的対照を明瞭にし、不滅性・不朽性を平易な現代日本語で伝える。
theological_decisions:
- issue: パウロが対比する復活の身体の性質
  choice: 蒔くこととよみがえらされることの受動的な比喩を保ち、「朽ちる／朽ちない」の対照を示す。
  alternative: 「体は葬られ、朽ちない体として復活する」と説明的に言い換える。
  rationale: 文脈は身体の復活を論じているが、本文自体はこの節で「体」を明示しない。種の比喩と、連続性と変容の緊張を保つため、説明を補いすぎない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「播く」より一般読者になじみやすい「蒔く」を採用し、受動態の反復は日本語として冗長にならない形に整えた。
