  verdict: approve
  source_fidelity: 「死者の復活」はἡ ἀνάστασις τῶν νεκρῶνを正確に表す。「これと同じです」は、直前の種の比喩を受けるΟὕτως καὶの比較・帰結を自然に伝える。σπείρεται／ἐγείρεταιの受動的な並行は「蒔かれ／よみがえらされます」に保たれ、ἐν φθορᾷ／ἐν ἀφθαρσίᾳの対照も「朽ちるものとして／朽ちないものとして」に明瞭である。本文がこの節で明示しない「体」を補っていない点も適切である。
  naturalness: 明快な現代標準日本語であり、種の比喩にふさわしい「蒔かれ」と、復活文脈で定着した「よみがえらされます」の組合せは自然である。文頭の「も」は前段とのつながりを過不足なく示す。
  terminology: 「死者の復活」「よみがえらされます」は聖書日本語として広く理解される用語である。「朽ちる／朽ちない」はφθοράとἀφθαρσίαの非道徳的な滅びやすさ／不滅性の対照を、平易さを損なわずに保持している。
