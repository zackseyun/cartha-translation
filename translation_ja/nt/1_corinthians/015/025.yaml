language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: ja
  text: なぜなら、キリストは、すべての敵をその足の下に置くまで、王として治めなければならないからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての敵をその足の下に置き終えるまで」とも訳せます。ギリシア語の表現は、これらの日本語のアスペクトの違いをそれ自体では要求しません。
    reason: lexical_alternative
  - marker: b
    text: 敵を「足の下に置く」とは、敵を完全に服従させることを表す聖書的な比喩です。詩篇110篇1節参照。
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: なければならない
  rationale: 神の定めに基づく必然性を表す。現代日本語で自然かつ十分に強い表現。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の内容を根拠づける説明の接続を、日本語として明確に示す。
- source_word: αὐτὸν
  choice: キリストは
  rationale: 日本語では代名詞だけだと指示対象が不明瞭になりやすいため、文脈上の指示対象であるキリストを明示する。
- source_word: βασιλεύειν
  choice: 王として治める
  rationale: 単なる統治ではなく王として支配する意味を、明瞭で自然な日本語で保持する。
- source_word: ἄχρι οὗ
  choice: 時まで
  rationale: 時間的な到達点を示す一方、その後に統治が終わるとは断定しない。
- source_word: θῇ
  choice: 置く
  rationale: τίθημιの基本的意味と『足の下に置く』という聖書的比喩を直接保持する。ギリシア語のアオリスト接続法は、この日本語表現では完了か進行かを過度に限定しない。
- source_word: πάντας τοὺς ἐχθροὺς
  choice: すべての敵
  rationale: 敵対するものを例外なく含む包括性を保つ。所有関係は後続の『その足』と文脈から明らかであり、不自然な重複を避ける。
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: その足の下に
  rationale: 完全な服従を示す聖書的イメージを、そのまま認識可能な形で保持する。
theological_decisions:
- issue: ἄχρι οὗ（まで）の時間的含意
  choice: 『時まで』と訳し、その後にキリストの統治が終わるかどうかは訳文で決めない。
  alternative: 敵が服従した時点でキリストの統治が終わることを示唆する訳。
  rationale: この接続表現はここで注目される時間的到達点を示すが、それ以後の継続・終了をそれ自体では確定しないため。
- issue: 敵を足の下に置く主体
  choice: 本文の主語の自然な連続に従い、キリストが置くと読める形にする。
  alternative: 神がキリストの敵をその足の下に置く、と明示する。
  rationale: θῇには主語が明示されず、詩篇110篇1節の背景から神を主体と理解する余地もある。訳文では不要な補足主語を加えず、原文の簡潔さを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、『王として治める』『足の下に置く』という王権的・聖書的表現を保持した。文末の『というのも……からです』によってγὰρの説明機能を自然に示した。
