  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: ja
  text: というのは、この朽ちる体は朽ちることのない性質を身に着け、この死ぬべき体は死ぬことのない性質を身に着けなければならないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: なければならない
  rationale: 復活に際する変化の必要性を、現代日本語で明確かつ力強く表す。
- source_word: γὰρ
  choice: というのは……からです
  rationale: 前節の説明を導く接続関係を、自然な日本語の呼応表現で示す。
- source_word: τὸ φθαρτὸν τοῦτο
  choice: この朽ちる体
  rationale: φθαρτόςの朽ち、滅びに服する意味を「朽ちる」で表し、文脈上の指示対象である体を補って明確にする。
- source_word: ἐνδύσασθαι
  choice: 身に着ける
  rationale: 衣服をまとう比喩を保ちながら、現代日本語として自然に表す。
- source_word: ἀφθαρσίαν
  choice: 朽ちないもの
  rationale: φθαρτόςとの語義上の対照を分かりやすく保ち、抽象的な専門語を避ける。
- source_word: καὶ
  choice: （読点による並列）
  rationale: 日本語では読点で二つの平行節を自然に結び、原文の並列関係を保つ。
- source_word: τὸ θνητὸν τοῦτο
  choice: この死ぬ体
  rationale: 死に服するものという意味を平易に表し、文脈から「体」を補う。
- source_word: ἀθανασίαν
  choice: 死なないもの
  rationale: θνητόςとの対照を明瞭にし、ἀθανασίαの意味を一般読者に理解しやすく表す。
theological_decisions:
- issue: 原文に σώμα がない箇所で「体」を補うこと
  choice: 二つの実詞的形容詞を「この朽ちる体」「この死ぬ体」と訳す
  alternative: 「この朽ちるもの」「この死ぬもの」と形式的に訳す
  rationale: 直前までの文脈は体の復活と変容を明示しているため、指示対象を「体」とするのが自然である。ただし原文には語として現れないため、脚注で明示する。
- issue: ἀφθαρσίαとἀθανασίαの訳し分け
  choice: 「朽ちないもの」と「死なないもの」
  alternative: 「不朽」と「不死」または「朽ちない性質」と「不死の性質」
  rationale: 朽ちることと死ぬことの平行的だが異なる対照を保ち、衣服を着る比喩にも自然につながる。
translation_notes:
  register: 明快な現代標準日本語を用い、「身に着ける」によって原文の衣服の比喩を保持した。「不朽性」「不死性」のような硬い抽象語は避けつつ、二組の対照を明瞭にした。
