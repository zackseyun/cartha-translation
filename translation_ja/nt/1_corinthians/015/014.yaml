  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: ja
  text: もしメシアがよみがえらされていないなら、私たちの宣教は空虚であり、あなたがたの信仰も空虚です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: メシア
  rationale: 文脈では称号としての意味が生きているため、「キリスト」ではなく、意味を明示する「メシア」とした。
- source_word: ἐγήγερται
  choice: よみがえらされた
  rationale: 復活の文脈における完了受動形。受動態と、その結果が今も存続している含みをできるだけ保った。
- source_word: ἄρα
  choice: なら
  rationale: 条件節から導かれる論理的帰結を、自然な日本語の「もし……のでないなら」で表した。
- source_word: κήρυγμα
  choice: 宣教
  rationale: 公に告げ知らせる内容と行為を指す語として、教会内で理解されつつ現代日本語でも簡潔な「宣教」を採用した。
- source_word: κενὸν / κενὴ
  choice: 空虚
  rationale: 二度の反復を保ち、内容・根拠・効力を失っているという客観的な空しさを表した。
- source_word: πίστις
  choice: 信仰
  rationale: ここではコリントの人々が福音を信じることを指すため、標準的で自然な「信仰」とした。
theological_decisions:
- issue: 復活表現における態と行為主体
  choice: よみがえらされた
  alternative: よみがえった
  rationale: ギリシア語の受動形を保ち、神がメシアをよみがえらせたという含意を残しながら、本文が明示しない行為主体を補わないようにした。
- issue: Χριστόςの称号性
  choice: メシア
  alternative: キリスト
  rationale: パウロの復活論証ではメシアとしての身分が視野にあるため、称号の意味が明瞭な訳を採用した。
translation_notes:
  register: 明快な現代標準日本語を用い、パウロの条件文と「空虚」の修辞的反復を保持した。「よみがえらされた」は日常語としてやや重いが、原文の完了受動形と神学的緊張を守るため採用した。
