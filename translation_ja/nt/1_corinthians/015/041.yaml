  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: ja
  text: 太陽の栄光、月の栄光、星々の栄光は、それぞれ異なります。というのも、星は星ごとに栄光が異なるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλη
  choice: 異なり／また異なります
  rationale: 反復されるἄλληが太陽・月・星々それぞれの栄光の違いを示すため、現代日本語として自然な比較表現で訳した。
- source_word: δόξα
  choice: 栄光
  rationale: ここでは天体の目に見える輝きや光彩を指すが、復活の体を論じる前後の文脈との語彙的・神学的つながりを保つため「栄光」とした。
- source_word: ἡλίου
  choice: 太陽の
  rationale: δόξαにかかる属格として自然に訳した。
- source_word: σελήνης
  choice: 月の
  rationale: δόξαにかかる属格として、太陽との並行関係を保った。
- source_word: ἀστέρων
  choice: 星々の
  rationale: 複数属格を明示し、太陽・月・星々という三項の並びを保った。
- source_word: ἀστὴρ ... ἀστέρος
  choice: 星は一つ一つ
  rationale: 星同士を比較する原文の意味を、個々の星の違いが明確になる自然な日本語で表した。
- source_word: γὰρ
  choice: からです
  rationale: 後半が前半の説明・根拠であることを示した。
- source_word: διαφέρει
  choice: 異なる
  rationale: 優劣を不必要に読み込まず、栄光の相違を表した。
- source_word: ἐν δόξῃ
  choice: 栄光が
  rationale: 何の点で星同士が異なるのかを示し、同節内のδόξαの反復を保った。
theological_decisions:
- issue: 復活論の中の天体の比喩におけるδόξαの訳語
  choice: 栄光
  alternative: 輝き／光彩
  rationale: 直接には天体の可視的な輝きを指すが、「栄光」とすることで、復活の体についての周辺の議論との修辞的・神学的連続性を保ちつつ、脚注で具体的な意味合いを示した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。原文の三項の対比と「栄光」の反復を保ちながら、後半の星同士の比較は日本語として自然な「星は一つ一つ」とした。
