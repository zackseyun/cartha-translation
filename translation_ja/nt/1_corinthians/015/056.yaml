  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: ja
  text: 死のとげは罪であり、罪の力は律法です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法」は、パウロの議論では特にモーセ律法を指すと考えられますが、罪を明らかにし、その働きを強める法の役割をより広く含む可能性もあります。
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: とげ
  rationale: 死が人を害する鋭い武器という比喩を自然に表し、直前の文脈とのつながりも保つ。「突き棒」も語義として可能だが、ここでは「とげ」が適切。
- source_word: θανάτου
  choice: 死の
  rationale: 属格を、死に属するもの、すなわち「死のとげ」として簡潔に訳した。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 個々の罪ではなく、力または原理として語られるパウロ的な単数形を保った。
- source_word: δύναμις
  choice: 力
  rationale: 罪が作用する能力・勢力を表す、自然で意味の広い現代日本語。「強さ」も可能だが、ここでは「力」が文脈に適する。
- source_word: νόμος
  choice: 律法
  rationale: パウロの議論では特にモーセ律法を想起させるため「律法」とした。ただし、罪を明らかにし増幅する法の働きという広がりを排除しない。
- source_word: δὲ
  choice: であり
  rationale: 二つの節を強い逆接ではなく、説明を進める並列的な関係として自然に結んだ。原文に明示的な時間副詞はないため、「さて」「今や」は加えない。
theological_decisions:
- issue: 「律法」が指す範囲
  choice: 本文では「律法」と訳し、モーセ律法との強い関連を示しつつ、注で意味の広がりを保持する。
  alternative: 一般的な法則・法として「法」と訳す。
  rationale: 文脈上はモーセ律法が特に念頭にある可能性が高いが、原文のνόμοςは冠詞を欠き、律法が罪を露呈させ、その働きを強めるというより広い役割も響かせうる。解釈を一つに固定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「とげ」「罪」「力」「律法」という簡潔な対応により、原文の平行構造と神学的緊張を保持した。
