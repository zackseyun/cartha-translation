id: 1CO.15.28
reference: 1 Corinthians 15:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: ja
  text: しかし、すべてのものが御子に従わせられる時、御子自身も、すべてのものを御子に従わせた方に従わせられるでしょう。こうして、神がすべてにおいてすべてとなられるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「神がすべてにおいてすべてとなられる」。また、「神がすべてのものの中ですべてとなられる」あるいは「神がすべての人の中ですべてとなられる」と理解することもできる。ギリシア語の表現は簡潔で、範囲を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: しかし、……時
  rationale: ὅτανの時を示す働きを「時」で表し、δέは前節からの展開を示す穏やかな転換として「しかし」とした。
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: 従わせられた／従われます
  rationale: ὑποτάσσωの受動態を保ちつつ、現代日本語で過度に硬くならない表現とした。二つの用例の語彙的対応も維持した。
- source_word: αὐτῷ
  choice: 御子に
  rationale: 文脈上の指示対象を明示し、日本語での代名詞の曖昧さを避けた。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 中性複数の反復と宇宙的な広がりを保ち、「すべてのこと」より被造世界全体を含み得る表現とした。
- source_word: αὐτὸς ὁ υἱὸς
  choice: 御子自身も
  rationale: αὐτόςの強調を「自身」で表した。「も」は、すべてのものに続いて御子も従われるという構文上の関係を自然な日本語で示す。
- source_word: τῷ ὑποτάξαντι
  choice: 従わせた方に
  rationale: 冠詞付き分詞の実体詞的用法を簡潔に表し、神を指す敬意ある「方」を用いた。
- source_word: ἵνα ᾖ
  choice: こうして、……となられるためです
  rationale: 目的・結果の両面を許すἵνα節を「ため」で保ち、「こうして」により論理的帰結を自然に接続した。
- source_word: πάντα ἐν πᾶσιν
  choice: すべてにおいてすべて
  rationale: 圧縮された表現の反復と広がりを保ち、対象を「すべての人」に限定しなかった。
theological_decisions:
- issue: 御子が従われることと父なる神との関係
  choice: 御子が、すべてを御子に従わせた方に従われると本文どおり訳す。
  alternative: 本質的劣位を避ける説明、または救済史的な服従であるとの限定を本文に加える。
  rationale: 本文が述べる終末的な従属を弱めず、同時に後代の教理的説明を翻訳へ持ち込まないことで、原文の神学的緊張を保った。
- issue: τὰ πάντα および πάντα ἐν πᾶσιν の範囲
  choice: 「すべてのもの」「すべてにおいてすべて」と包括的に訳す。
  alternative: 「すべての人のうちですべて」と人間に限定して訳す。
  rationale: πᾶςの反復が持つ宇宙的・包括的な範囲を狭めず、最後の句の簡潔さと曖昧さを保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御子」「方」「なられる」により敬意を示しつつ、過度な文語表現は避けた。原文の受動態、反復、終末論的順序、最後の句の凝縮性をできる限り保持した。
