id: 1CO.15.37
reference: 1 Corinthians 15:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: ja
  text: また、あなたが蒔くものは、やがて生じる体そのものではなく、むき出しの一粒の種です。おそらく小麦、あるいはほかの何かの種です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: 蒔く
  rationale: 農耕の比喩を明確に保ち、周辺文脈の種と復活の議論にも自然につながる。
- source_word: σῶμα
  choice: 体
  rationale: 復活を論じるパウロの重要語を弱めず、植物の「姿」などに限定しない。
- source_word: τὸ γενησόμενον
  choice: やがて生じる
  rationale: γίνομαιの生成・成立の含みを保ちつつ、単なる植物の成長と解釈しすぎない。
- source_word: γυμνὸν κόκκον
  choice: ただの種粒
  rationale: γυμνόςが示す、後に現れる体をまだ備えていない剥き出しの状態を、現代日本語で不自然にならないよう表す。「裸の種粒」は字義的だが日本語ではやや硬く奇異である。
- source_word: εἰ τύχοι
  choice: たとえば
  rationale: ここでは厳密な条件というより、あり得る一例を挙げる慣用表現として機能するため。
- source_word: σίτου
  choice: 小麦
  rationale: この文脈では穀物一般より具体的な小麦を指すのが自然である。
- source_word: τινος τῶν λοιπῶν
  choice: そのほかの何かの種粒
  rationale: 残りの種類のうち何か一つ、という不特定性を保つ。
theological_decisions:
- issue: 種と復活の体との関係
  choice: 「体」と将来の生成を示す表現を保持し、比喩以上の説明を本文へ加えない。
  alternative: 「やがて育つ植物」と意訳する。
  rationale: この節は復活における連続性と変容を示唆するが、本文自体は農耕の比喩で語る。「体」を植物だけの表現に置き換えず、同時に教理的説明を過剰に補わない。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「種粒」はκόκκοςの個体性を示し、「種」だけの場合に生じ得る集合的な曖昧さを避ける。
