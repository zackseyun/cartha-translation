id: 1CO.4.4
reference: 1 Corinthians 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: ja
  text: というのも、私には自分を責めるようなことは何も思い当たりません[a]。しかし、それによって義と認められているわけではありません[b]。私を吟味する方は主です[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分のうちに何もやましいことを意識していません」または「自分に不利なことは何も知りません」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「それによって無罪とされているわけではありません」または「正しいと認められているわけではありません」。ギリシア語は、パウロがほかの箇所でも「義と認める」という意味で用いる法廷的な語です。
    reason: lexical_alternative
  - marker: c
    text: 別訳「私を裁く方」または「私を調べる方」。この動詞は、司法的な場面で吟味し、調査し、評価することを意味し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: というのも、私には自分を責めるようなことは何も思い当たりません
  rationale: σύνοιδαと再帰代名詞の与格による「自分の良心に照らして何も意識していない」という意味を、文脈上の道徳的・法廷的含意を保ちながら自然な現代日本語で表した。γάρは前文への説明を示すため「というのも」とした。
- source_word: ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι
  choice: しかし、それによって義と認められているわけではありません
  rationale: 完了受動形δεδικαίωμαιの、すでに下された判断が現在も効力を持つ含みと法廷的語感を「義と認められている」で保った。「それ」は、自責の念がないという直前の自己認識を指す。
- source_word: ὁ δὲ ἀνακρίνων με
  choice: 私を吟味する方は
  rationale: ἀνακρίνωは調査、審査、評価、裁判的な取り調べを含み得る。「吟味する」は最終判決に狭めず、厳密に調べ評価する意味を保つ。
- source_word: κύριός
  choice: 主
  rationale: 定冠詞を伴う明確な称号として「主」とした。本文にない「イエス」などの明示は加えない。
theological_decisions:
- issue: δεδικαίωμαιの法廷的・神学的含意
  choice: 義と認められているわけではありません
  alternative: 無罪とされているわけではありません／正しいと認められているわけではありません
  rationale: 直近の文脈はパウロに対する評価と審判だが、δικαιόωに固有の法廷的重みとパウロ書簡内の用語上の響きを残した。ここを一般的な義認論へ拡張せず、自己評価が判断の根拠にならないという本文の緊張を維持する。
- issue: ἀνακρίνωνと最終的な裁きとの関係
  choice: 吟味する
  alternative: 裁く／調べる
  rationale: この動詞は司法的な評価を含み得るが、必ずしも最終判決そのものだけを意味しないため、意味範囲を狭めない訳語を選んだ。
- issue: κύριοςの指示対象
  choice: 主
  alternative: 主イエス
  rationale: パウロの文脈ではキリストを指す可能性が高いとしても、この節のギリシア語本文はκύριοςとのみ記すため、明示されていない同定を訳文に加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒的奉仕者への評価という文脈にふさわしい端正さを保った。前半は日本語として自然な「思い当たる」を用い、後半ではδικαιόωの重要な法廷的・神学的語感を保つため「義と認める」を採用した。すべての脚注記号を対応箇所に配置した。
