language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: ja
  text: あなたがたは、もう満腹している。もう豊かになっている。私たちを抜きにして、王として治めている。ほんとうに王として治めていたらよかったのに。そうすれば、私たちもあなたがたとともに王として治めることができたでしょうに。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節でパウロは皮肉を用いています。コリントの人々は、すでに完全に満たされ、豊かになり、王として治めているかのように振る舞っていました。後半には、彼らがほんとうに王として治めていたなら、という願いも響いています。
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη
  choice: もう
  rationale: 二つの節の冒頭で反復し、パウロの皮肉を帯びた時間的強調を自然な現代日本語で保つ。
- source_word: κεκορεσμένοι ἐστέ
  choice: 満腹している
  rationale: 完了した結果として今も満ち足りている状態を表す。食物による飽満の比喩と皮肉を保つため、「満足している」より具体的に訳した。
- source_word: ἐπλουτήσατε
  choice: 豊かになっている
  rationale: 富むに至ったという動作性と、その結果が現在に及ぶ文脈上の含みを表す。
- source_word: χωρὶς ἡμῶν
  choice: 私たちを抜きにして
  rationale: 使徒たちとは別に、また彼らなしで高い地位に達したかのように振る舞うことへの非難を、自然な表現で示す。
- source_word: ἐβασιλεύσατε
  choice: 王となった／王となっていた
  rationale: 一般的な成功へ薄めず、βασιλεύωの王権的な比喩を保持する。開始の意味は原語に明示されないため加えない。願望節では非現実の願いに合う形にした。
- source_word: ὄφελόν γε
  choice: いや、ほんとうに……たらよかったのに
  rationale: γεの強意を含む切実な願いを現代日本語で表し、先行する皮肉から真の願望への複雑な移行も残す。
- source_word: ἵνα
  choice: そうすれば
  rationale: 願いが実現した場合の目的・帰結を日本語として自然に結ぶ。
- source_word: συμβασιλεύσωμεν
  choice: 私たちもあなたがたとともに王として治められた
  rationale: 接頭辞 συν- の共同性と、βασιλεύωの王として治める意味を明示する。非現実の願いに対応して反実的な結びとした。
theological_decisions:
- issue: 冒頭三節の語調
  choice: 皮肉を帯びた断定として訳す
  alternative: 文字どおりの称賛として訳す
  rationale: 4章7～13節では、コリントの人々の自己評価と使徒たちの苦難が対照されており、皮肉が強く示唆される。ただし本文に「皮肉にも」などの解釈語は加えず、簡潔な断定で伝える。
- issue: 王となるという表現
  choice: 王権・統治の比喩を保持する
  alternative: 「成功した」「頂点に立った」など一般的な地位表現にする
  rationale: βασιλεύωとσυμβασιλεύωの明確な王権的イメージは、終末論的含意を持ち得る重要な修辞であるため保持する。
- issue: ὄφελόν γε以下の願いの性質
  choice: 皮肉をなお含み得る切実な非現実願望として訳す
  alternative: 全面的な皮肉、または単純な将来への希望に限定する
  rationale: 表現には先行する皮肉との連続性と、彼らが真に王として治めるなら使徒もともに治められるという願いの両面があり、一方に決め切らない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、使徒的な叱責にふさわしい簡潔で格調ある語調と、反復・王権比喩・皮肉を保持した。脚注記号は本文末に置き、節全体の修辞を説明する。
