  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: ja
  text: というのも、神の国はことばではなく、力にあるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 〜にではなく……からです
  rationale: γάρが直前の文の理由を示すことを、現代日本語で自然な文末の「からです」によって表した。οὐは「ではなく」で明確に否定した。
- source_word: ἐν λόγῳ
  choice: ことばに
  rationale: λόγοςの「ことば・語り・話」という幅を保ちつつ、ἐν δυνάμειとの簡潔で鋭い対照を再現するため「ことばに」とした。ここでは実効性のない言辞が念頭にあるが、本文で「単なる」と補って意味を限定しなかった。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 日本語として定着した表現であり、神の支配とその領域の両方を含み得るβασιλείαの幅を保つ。
- source_word: ἀλλ’ ἐν δυνάμει
  choice: 力にある
  rationale: δύναμιςを基本義の「力」とし、λόγοςとの対照を保持した。「ある」を補うことで、日本語として自然に神の国の実質がどこに現れるかを示した。
theological_decisions:
- issue: 「ことば」と「力」の対照の性質
  choice: 単なる言辞と、実効性を伴う力との広い対照として訳す。
  alternative: 「力」を奇跡、生活の変革と教会規律、使徒的権威、または御霊の働きのいずれか一つに限定する。
  rationale: ギリシア語本文は力の具体的な現れをここで特定していないため、その神学的な開放性を保った。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「ことば」は硬すぎない表記とし、文末の「からです」でγάρの論理的つながりを自然に示した。
