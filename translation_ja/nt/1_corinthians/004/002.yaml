id: 1CO.4.2
reference: 1 Corinthians 4:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: ja
  text: さて、この場合[a]、管理を任された者に求められる[b]のは、その者が忠実であると認められることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「さて、ここで」または「そこで」。
    reason: ὧδεとλοιπόνの組み合わせは、場所を指すとも、直前の議論を受けて「この点で／そこで」と展開するとも取れるため。
  - marker: b
    text: 直訳「管理を任された者たちの間で捜し求められる」。ここでは、その人々に期待され、要求されることを意味する。
    reason: ζητεῖταιの字義と、この文脈での慣用的な意味の両方を示すため。
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: さて、この場合
  rationale: ὧδεの文脈上の「この場合／この点で」という意味と、λοιπόνの議論を先へ進める働きを、重複感のない自然な日本語で表した。
- source_word: ζητεῖται ἐν τοῖς οἰκονόμοις
  choice: 管理を任された者に求められる
  rationale: ζητεῖταιの字義は「捜し求められる」だが、この構文では要求・期待を表す。「管理を任された者」はοἰκονόμοςの委託と管理の比喩を明確にする。
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: その者が忠実であると認められること
  rationale: εὑρεθῇの受動態を「認められる」で表し、審査の結果そう判明する含みを保った。πιστόςは託された務めに対する信頼性を含む「忠実」とした。τιςの不定単数は「その者」で受けた。
theological_decisions:
- issue: 不定単数と性別を限定しない表現
  choice: その者が忠実であると認められる
  alternative: その人が忠実であると認められる／彼らが忠実であると認められる
  rationale: ギリシア語のτιςは不定単数であり、男性だけを指すものではない。「その者」により、性別を限定せず代表的単数を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、委託された管理という比喩と、忠実さが吟味の中で認められるという厳粛な響きを保つ文体とした。
