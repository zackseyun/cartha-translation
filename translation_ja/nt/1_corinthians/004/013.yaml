  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: ja
  text: 悪く言われても、私たちは訴えかけます[a]。私たちは今に至るまで、世のごみ、あらゆるもののかす同然になっています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「懇願します」「勧めます」「励まします」とも訳せます。この動詞には、呼びかける、勧める、慰めるなどの幅があります。ここでは、悪口に報復せず相手に働きかける応答を表すと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「ごみ」と「かす」に当たる二つの語は、どちらも非常に強く、清掃や清めの際に取り除かれるものを指し得ます。祭儀的な背景を連想させる可能性もありますが、ここでは何よりも、世から徹底して卑しめられた状態を表しています。
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: 悪く言われても
  rationale: 受動分詞の付帯状況を譲歩的に表し、悪意ある中傷や罵倒を含み得る広さを、自然な現代日本語で保った。
- source_word: παρακαλοῦμεν
  choice: なだめるように語りかけます
  rationale: ここでは慰めや勧告よりも、侮辱に報復せず相手に穏やかに働きかける応答を指すと考えられる。ただし語そのものに「穏やかに」が明示されないため、「ように」で文脈上の含意として示した。
- source_word: ὡς
  choice: ～のように
  rationale: 厳密な同一視ではなく比較を導く語として明示した。
- source_word: περικαθάρματα
  choice: ごみ
  rationale: 清めの際に取り除かれるもの、転じて卑しめられた存在を表す強い語を、理解しやすい現代語で表した。
- source_word: τοῦ κόσμου
  choice: 世の
  rationale: 世界または人間社会との関係を簡潔かつ自然に示す属格表現とした。
- source_word: ἐγενήθημεν
  choice: なっています
  rationale: アオリストの結果が執筆時まで続くことを、後続の「今に至るまで」と調和する現在完了的な日本語で表した。
- source_word: πάντων
  choice: すべてのものの
  rationale: 人々だけに限定せず、原文の包括的で曖昧な範囲を保った。
- source_word: περίψημα
  choice: かす
  rationale: 拭い取られ、捨てられる残滓という像と、社会的蔑視の強さを簡潔で通じやすい語にした。
- source_word: ἕως ἄρτι
  choice: 今に至るまで
  rationale: その状態が手紙執筆の現在まで継続していることを明確に表す。
theological_decisions:
- issue: περικαθάρματα と περίψημα に清めや身代わりの祭儀的意味を読み込むか
  choice: 本文では「ごみ」「かす」という社会的蔑視と除去物の像を示し、祭儀的意味を断定しない
  alternative: 清めのための除去物、あるいは身代わりの犠牲への暗示として本文に反映する
  rationale: 両語には清掃・清めで除かれるものという背景があり得るが、ここで確実なのは使徒たちが世から極度に卑しめられているという点である。議論のある祭儀的含意を本文で確定しない。
- issue: παρακαλοῦμεν の応答の性格
  choice: 「なだめるように語りかけます」として非報復的・融和的な訴えを表す
  alternative: 「勧めます」「慰めます」「懇願します」
  rationale: 直前から続く虐待と応答の対照では、相手への融和的な呼びかけが自然である。ただし動詞の意味幅は脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、使徒の屈辱を表す比喩の強さを保った。「汚物」「垢」など過度に生々しい、または不自然になりやすい語を避けつつ、「ごみ」「かす」で軽くなりすぎないよう対句を維持した。敬体で統一した。
