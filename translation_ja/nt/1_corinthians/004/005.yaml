id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: ja
  text: ですから、主が来られる時まで、時に先立って何事も裁いてはいけません[a]。主は、闇に隠されているものを光の中に出し、心の意図を明らかにされます[b][c]。その時、一人ひとりが神から称賛を受けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「時に先立って」は、「その時より前に」または「時期尚早に」とも訳せます。ギリシア語は、ふさわしい時が来る前に行動することを表し得ます。
    reason: lexical_alternative
  - marker: b
    text: 「心の意図」は、「心の企て」または「心の動機」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: すなわち、主が来られ、隠されているものを明らかにされる時の、主による最終的な評価を指します。
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す接続表現として、推論の関係を自然な現代日本語で表した。
- source_word: μὴ πρὸ καιροῦ
  choice: 時に先立って……してはいけません
  rationale: πρὸ καιροῦが、ふさわしい時より前に行うことを指し得る点を保ちつつ、本文にない「定められた」を明示的に補わない訳とした。
- source_word: τι κρίνετε
  choice: 何事も裁いてはいけません
  rationale: τιによる禁止の広がりを「何事も」で表し、κρίνωの評価・判定の意味を「裁く」で簡潔に示した。
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: 主が来られる時までです
  rationale: 禁止が続く時間的な限界を明確にし、主の将来の到来を自然な敬語表現で示した。
- source_word: ὁ κύριος
  choice: 主
  rationale: パウロ書簡における称号としての意味を保ち、本文が明示していない固有名を補わなかった。
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: 闇に隠されているものを光の中に出し
  rationale: 物理的に照らすことより、隠れた事柄を露わにする比喩的意味を自然に表した。「闇」と「光」の対照も保持した。
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: 心の意図を明らかにされます
  rationale: βουλαίが持つ企て・意図・動機の幅を狭めすぎない「意図」を採用し、内面を表す「心」を保った。
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: 一人ひとりが神から称賛を受けます
  rationale: ギリシア語の受益者と源を自然な日本語に組み替え、称賛が神から各人に与えられることを明確にした。
theological_decisions:
- issue: 裁きの範囲と時期
  choice: 主が来られて隠れた事柄を明らかにされる前の、人間による時期尚早な裁きを禁じる表現とした。
  alternative: あらゆる種類の判断を無条件かつ絶対的に禁じると読むこと。
  rationale: 禁止は広い言葉で述べられる一方、「主が来られる時まで」という時間的限定が明示されているため、その緊張を訳文にも残した。
- issue: 「主」の指示対象
  choice: 称号「主」をそのまま訳し、将来来られる裁き主としてのイエスを指す文脈を保った。
  alternative: 本文中で「イエス」または「神」と明示的に展開すること。
  rationale: 文脈上はイエスを指す可能性が最も高いが、原文は固有名ではなくὁ κύριοςと記しているため、訳文でも解釈を過度に明文化しなかった。
- issue: 各人への称賛
  choice: 各人が神から称賛を受けるという原文の肯定的表現をそのまま保った。
  alternative: 裁きの結果に応じて、称賛される者だけが称賛を受けるという条件を訳文に補うこと。
  rationale: 原文は条件や否定的判決をここで明示せず、「各人に称賛が神から」と述べるため、その神学的緊張を説明的な補足で解消しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、終末的な場面にふさわしい格調を保った。「来られる」「明らかにされます」は「主」を主語とする自然な敬語であり、過度に古風な文語表現は避けた。
