id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: ja
  text: また、私たちは自分の手で働いて労苦しています。ののしられても[a]祝福し、迫害されても耐え忍びます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「侮辱されても」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶμεν
  choice: 労苦しています
  rationale: 疲労を伴う骨折りや懸命な働きを表すため、単なる「働く」ではなく「労苦する」とした。
- source_word: ἐργαζόμενοι ταῖς ἰδίαις χερσίν
  choice: 自分の手で働いて
  rationale: 分詞が労苦の具体的なあり方を説明しており、ἰδίαιςの強調も「自分の手で」によって保った。
- source_word: λοιδορούμενοι
  choice: ののしられても
  rationale: 侮辱的な言葉を浴びせられることを表す受動分詞であり、後続する応答との逆説を「ても」で自然に示した。
- source_word: εὐλογοῦμεν
  choice: 祝福し
  rationale: 罵倒に対して善を願い、祝福をもって応じるという聖書的な語の力を保った。
- source_word: διωκόμενοι
  choice: 迫害されても
  rationale: この文脈では敵対者に追われ苦しめられる意味が明確であり、「迫害される」とした。
- source_word: ἀνεχόμεθα
  choice: 耐え忍びます
  rationale: 敵対的な扱いに持ちこたえる意味を示しつつ、原文に明示されない目的語は補わなかった。
theological_decisions:
- issue: 不当な扱いに対する使徒たちの応答
  choice: ののしりには祝福で応じ、迫害には耐えるという使徒たちの実践として訳す
  alternative: 一般信徒への直接的な命令として訳す
  rationale: 原文は一人称複数の直説法で使徒たちの行動を描いており、倫理的含意を保ちながら命令文には広げなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔な対句のリズムを保った。「耐え忍ぶ」はやや格調があるが、一般読者にも理解でき、迫害下で持ちこたえる含意を自然に伝える。
