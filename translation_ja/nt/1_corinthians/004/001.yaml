id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: ja
  text: 人は私たちを次のように見なすべきです。すなわち、キリスト[a]に仕える者、また神の奥義[b]を任された管理者としてです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「油を注がれた者」を意味する称号で、「メシア」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「奥義」は、ここでは神に属する秘められた事柄を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως
  choice: （後続する「～と」によって表現）
  rationale: この語が示す「このように」という様態は、日本語では「私たちを～と見なす」という構文の内容として自然に表した。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 文脈上、パウロとその同労者たちを指す対格代名詞をそのまま表した。
- source_word: λογιζέσθω
  choice: 見なすべきです
  rationale: 現在命令形の規範的な力を、現代日本語で自然かつ明確に表した。
- source_word: ἄνθρωπος
  choice: 人は
  rationale: ここでは特定の男性ではなく、人一般を指す。日本語の「人」は性別を限定せず、原文の単数・総称的用法を自然に表せる。
- source_word: ὑπηρέτας
  choice: 仕える者
  rationale: δοῦλοςのような奴隷身分そのものより、上位者のもとで務める従属的な奉仕者を表すため、「仕える者」とした。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: 日本語の聖書用語として定着し、ギリシア語Χριστόςに直接対応する。称号としての意味は脚注で示した。
- source_word: οἰκονόμους
  choice: 任された管理者
  rationale: 委託を受けて家や財産を管理する者という比喩を、現代の読者に分かる形で表した。
- source_word: μυστηρίων θεοῦ
  choice: 神の奥義
  rationale: 神に属し、かつ神から示される秘められた事柄というパウロの語の含みを、説明しすぎず保持した。複数形は日本語では集合的な「奥義」で自然に表せる。
theological_decisions:
- issue: Χριστοῦを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号として「油を注がれた者」を意味するが、日本語では「キリスト」が最も定着した直接的な対応語である。「メシア」という可能性と称号性は脚注で保持した。
- issue: μυστηρίωνの意味範囲
  choice: 奥義
  alternative: 秘められた事柄／秘義
  rationale: 単なる不可解な謎ではなく、神に属する秘められた真理を指しうる語である。ただし、この節だけで「すでに啓示された真理」と明示するのは解釈を加えすぎるため、簡潔な「奥義」とした。
- issue: ἄνθρωποςの総称性
  choice: 人は
  alternative: だれでも／一人の人は
  rationale: 原文の男性形はここで男性だけを限定せず、人一般を表す。日本語の「人」は総称性を自然に保ち、不要な性別指定を避ける。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「奥義」によってパウロの神学的語彙と原文の含みを保持した。「しもべ」や「家令」など現代では古風に響く語を避け、「仕える者」「任された管理者」とした。
