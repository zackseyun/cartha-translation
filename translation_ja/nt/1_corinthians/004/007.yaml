  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: ja
  text: いったい、だれがあなたをほかの人と異なる者としているのですか。[a] あなたには、受けなかったものが何かあるのですか。受けたのであれば、なぜ受けなかったかのように誇るのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いったい、だれがあなたを区別するのですか」。ギリシア語の動詞には、「区別する」「違いを生じさせる」「異なるものとする」という意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: いったい、だれがあなたをほかの人と違う者にしたのですか
  rationale: γάρは直前の戒めを受ける理由づけとして文脈に織り込み、τίςの修辞的な力を「いったい」で表した。διακρίνειは他者との区別・差異を生じさせる意味を自然な日本語で示しつつ、誰が優越性の根拠を与えたのかという問いを保つ。
- source_word: τί δὲ ἔχεις ὃ οὐκ ἔλαβες
  choice: あなたには、受けなかったものが何かあるのですか
  rationale: δὲは軽い接続なので日本語では明示せず、問いの連続を自然にした。直訳的な「受けなかった何を持っているか」を修辞疑問として明瞭に表し、所有するものは受けたものだという含意を保った。
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: 受けたのであれば
  rationale: εἰと強意的なκαὶによる「実際に受けたのなら」という力を、簡潔で自然な条件表現にした。目的語は直前の「もの」から明らかなため重ねなかった。
- source_word: τί καυχᾶσαι
  choice: なぜ…誇るのですか
  rationale: καυχάομαιのパウロ書簡における標準的な意味を「誇る」で表し、継続的な高慢をとがめる修辞疑問を維持した。
- source_word: ὡς μὴ λαβών
  choice: 受けなかったかのように
  rationale: 否定を伴う分詞句の反事実的な様態を、自然な日本語の「かのように」で表した。
theological_decisions:
- issue: 人の優越性と受けたものに関するパウロの叱責の範囲
  choice: 区別、所有、立場の根拠が本人に由来せず、受けたものであることを示す一方、その範囲を限定しない。
  alternative: 霊的賜物や奉仕の役割だけに限定する、または能力・地位・祝福のすべてを明示的に含める。
  rationale: 直近の文脈は使徒の奉仕、党派心、誇りを扱うが、節自体の表現は一般的であるため、その幅を保ち、本文以上に神学的対象を狭めたり広げたりしない。
translation_notes:
  register: 明瞭な現代標準語の丁寧体を用い、三つの修辞疑問の畳みかけを保った。「ほかの人と」は比較の含意を明確にするための補足であり、「違う者にした」は文脈上の優越性を断定せず、原文の語義的な幅を脚注とともに保持する。
