  naturalness: 「父は多くはいません」は意味は通りますが、対比の焦点を保つ「父は多くはありません」がより自然です。「私があなたがたを生んだからです」は父であるパウロが主語であることとの日本語上の結び付きがやや不自然です。「もうけた」は現代標準日本語として自然で、父性の比喩を明瞭にします。
