reference: 1 Corinthians 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: ja
  text: たとえあなたがたに、キリスト[d]にあって一万人もの[a]養育係[b]がいても、父は多くはありません。キリスト・イエスにあって、福音を通して、私があなたがたをもうけたからです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一万人」は、非常に多い人数を表す言い方としても用いられます。「数え切れないほど」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「養育係」は、古代ギリシア・ローマ社会で子どもに付き添い、その行動やしつけを監督した人です。主として教室で教える教師を指す語ではありません。
    reason: cultural_note
  - marker: c
    text: 直訳は「私があなたがたを生んだ」。ここでは、福音を通して彼らを信仰へ導いたパウロの働きを、父が子をもうけることにたとえています。「私があなたがたの父となった」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: 「キリスト」は称号で、「メシア（油を注がれた者）」という意味です。
    reason: lexical_note
lexical_decisions:
- source_word: μυρίους
  choice: 一万人もの
  rationale: 語の基本的な数値「一万」を保ちつつ、「もの」によって非常に多いことを表す修辞的な力を自然な日本語で示した。
- source_word: παιδαγωγοὺς
  choice: 養育係
  rationale: 古代ギリシア・ローマ社会で子どもを監督し、しつけ、導いた者を指すため、現代的な教室の「教師」よりも役割に近い語を選んだ。
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: キリストにあって／キリスト・イエスにあって
  rationale: パウロに特徴的なἐν Χριστῷの関係・領域を示す表現を「にあって」で保持し、Χριστόςは日本語で定着した称号「キリスト」とした。
- source_word: πατέρας
  choice: 父
  rationale: 原文の明示的な父性の比喩を解釈的に「霊の父」などと拡張せず、そのまま保持した。
- source_word: διὰ τοῦ εὐαγγελίου
  choice: 福音を通して
  rationale: 属格を伴うδιάが示す手段を自然に表し、福音が彼らを生む媒介であったという意味を保った。
- source_word: ἐγέννησα
  choice: 私があなたがたを生んだ
  rationale: γεννάωの具体的な出生の比喩を保持した。日本語では父についても「子を生む」と表現でき、直前の「父」と結びついて比喩的意味が明らかになる。
theological_decisions:
- issue: パウロの父性・出生の比喩をどの程度明示的に解釈するか
  choice: 「父」と「私があなたがたを生んだ」という原文の比喩をそのまま保つ。
  alternative: 「私があなたがたの霊的な父となった」と説明的に訳す。
  rationale: 原文は、福音を通してコリントの信徒を信仰へ導いたパウロの固有の関わりを父と出生の比喩で語るが、「霊的」という限定語は明記していない。教職制度や秘跡について本文以上の含意を加えない。
- issue: ἐν Χριστῷの意味範囲
  choice: 「キリストにあって」とし、関係、結合、領域という重なりを残す。
  alternative: 「キリストを信じる歩みにおいて」など、一つの意味に限定する。
  rationale: パウロの表現には複数の含意があり得るため、説明的に一義化しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロの対照的で格調ある論述を二文で再現した。「父親」ではなく簡潔な「父」とし、比喩の尊厳と直後の「生んだ」との連結を保った。
