base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: ja
  text: 今この時に至るまで、私たちは飢え、渇き、着る物にも事欠き、殴られ、定まった住まいもありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定まった場所もなく、さまよっています」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: 今この時に至るまで
  rationale: 現在まで続く状況を表す時間句。ἄρτιの「今」とὥραの「時」を保ちつつ、現代日本語として自然にした。
- source_word: πεινῶμεν
  choice: 私たちは飢え
  rationale: 現在形が示す継続的な欠乏状態を簡潔に表した。
- source_word: διψῶμεν
  choice: 渇き
  rationale: πεινῶμενと並ぶ継続的状態として、反復を避けながら原文の列挙を保った。
- source_word: γυμνιτεύομεν
  choice: 着る物にも事欠き
  rationale: 完全な裸体と断定せず、衣服が不十分であるという語の意味幅を自然な日本語で示した。
- source_word: κολαφιζόμεθα
  choice: 殴られ
  rationale: 身体的に打たれることを表す現在受動形。継続・反復される虐待を平明に伝える。
- source_word: ἀστατοῦμεν
  choice: 定まった住まいもありません
  rationale: 定住する場所がなく不安定に移動する状態を表し、「ホームレス」という現代的な社会分類への限定を避けた。
- source_word: καὶ ... καὶ ... καὶ ...
  choice: 飢え、渇き、着る物にも事欠き、殴られ、…もありません
  rationale: 日本語の自然な列挙を用いながら、「も」によって苦難が累積する原文の力を表した。
theological_decisions:
- issue: パウロの自己描写の性質
  choice: 使徒たちが現に経験している欠乏と虐待の具体的な列挙として訳す
  alternative: 主として誇張的・修辞的な描写として訳す
  rationale: 原文は現在直説法で継続中の苦難を率直に述べているため、誇張とも婉曲とも決めつけず平明に訳した。
translation_notes:
  register: 明瞭で現代的、かつ聖書本文にふさわしい端正な文体。「着る物にも事欠き」はγυμνιτεύομενを「裸」と過度に限定せず、「定まった住まい」はἀστατοῦμενの不安定さと移動性を保持する。
