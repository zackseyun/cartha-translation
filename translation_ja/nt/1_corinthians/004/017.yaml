id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: ja
  text: このため、私はテモテをあなたがたのもとへ遣わしました。彼は、主にあって私の愛する忠実な子[a]です。彼は、メシア・イエスにある私の歩みを、あなたがたに思い出させるでしょう。私は至る所で、すべての教会において、そのように教えています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主にあって私の愛する忠実な息子」とも訳せる。ギリシア語のτέκνονは字義的には「子」だが、この文脈では「息子」と訳すこともできる。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト・イエスにある」とも訳せる。ギリシア語のΧριστόςは「油注がれた者」、すなわち「メシア」という称号を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の議論を受ける因果関係を、簡潔で自然な日本語で示す。
- source_word: ἔπεμψα
  choice: 遣わしました
  rationale: アオリストを単純な過去として表し、使者を送る文脈にふさわしい「遣わす」を用いた。
- source_word: Τιμόθεον
  choice: テモテ
  rationale: 日本語聖書で定着した人名表記。
- source_word: τέκνον
  choice: 子
  rationale: 性別を限定するυἱόςではなく「子」を意味する語であり、パウロの家族的比喩を保つ。文脈上は「息子」とも訳し得るため注記した。
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: 愛する忠実な
  rationale: パウロの愛情と、テモテの信頼に足る忠実さの双方を保持する。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 主との関係および主に属する生の領域を示すパウロ特有の表現を保つ。
- source_word: ἀναμνήσει
  choice: 思い起こさせてくれるでしょう
  rationale: 未来形と、すでに知られている事柄を想起させる意味を自然に表す。
- source_word: τὰς ὁδούς μου
  choice: 私の歩み
  rationale: 字義的な「道々」が指す、生き方・働き・教えの実践的な型を、日本語で自然な比喩として表す。
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: Χριστόςの称号としての意味を「メシア」で明示し、「歩み」がメシアとの結びつきによって規定されることを保つ。慣用的な「キリスト・イエス」も注記する。
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: 私がどの教会でも至る所で教えているとおり
  rationale: καθὼςの対応関係と、πανταχοῦおよびπάσῃの重なる普遍的範囲を省略せず表す。
theological_decisions:
- issue: Χριστῷ Ἰησοῦの訳
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: ここではΧριστόςがイエスに付された称号としての力を保っているため、その意味を訳出した。一方、日本語で定着した音写も正当な代案として脚注に示す。
- issue: 「私の歩み」の範囲
  choice: メシアに結ばれたパウロの生き方・働き・教えの実践的な型を含む比喩
  alternative: 私の生き方／私のやり方
  rationale: ὁδοίは移動経路ではなく比喩的用法であるが、生き方だけか教え方だけかに狭めず、原文の幅を保つ。
- issue: τέκνονの家族的比喩
  choice: 私の子
  alternative: 私の息子
  rationale: 原語は性別を限定しない「子」であるため広い語義を本文に残す。ただしテモテが男性である文脈から「息子」も自然な訳となる。
translation_notes:
  register: 明瞭で現代的ながら品位ある文体。「遣わしました」「主にあって」「歩み」により書簡としての格調と原文の比喩を保った。脚注記号は、それぞれ「私の子」と「メシア・イエス」に関する文の直後に置いた。
