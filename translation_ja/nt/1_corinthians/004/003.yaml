source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: ja
  text: しかし、私にとっては、あなたがたに吟味されることも、人間の判断によって吟味されることも[a]、ごく小さなことです。いや、私は自分自身をも吟味しません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「人間の日」。ここでは、人間による審理や評価を指す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: 私にとっては
  rationale: 判断する主体であるパウロ自身の観点を示す与格を、自然な現代日本語で表した。
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: それはごく小さなことです
  rationale: 重要性が極めて低いという慣用的な意味を保ちつつ、原文の「小さい」という比喩も残した。
- source_word: ἵνα
  choice: 〜されようと
  rationale: ここでは軽微と見なされる事柄の内容を導く。日本語では二つの評価主体を「〜されようと」で並べるのが自然である。
- source_word: ἀνακριθῶ / ἀνακρίνω
  choice: 吟味される／吟味する
  rationale: 綿密に調べて評価する意味を表し、文脈上の最終的な「裁く」と不用意に同一化せず、二つの用例の語彙的一貫性も保った。
- source_word: ὑφ’ ὑμῶν
  choice: あなたがたに
  rationale: 行為者を示す表現をそのまま明確に訳した。
- source_word: ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: 人間の裁きの場で
  rationale: 直訳では「人間の日」だが、主の日との対照を背景に、人間による審理・評価を指す慣用表現として伝わる形にした。法廷だけに狭めすぎないよう「裁きの場」とした。
- source_word: ἀλλ’ οὐδὲ
  choice: いや、〜さえ…ません
  rationale: 論旨をさらに一歩進める強い対照と、「〜さえない」というοὐδέの含意を自然な日本語で示した。
- source_word: ἐμαυτὸν
  choice: 自分自身
  rationale: 再帰代名詞の強調を明確に保った。
theological_decisions:
- issue: ἀνθρωπίνης ἡμέρας の意味
  choice: 本文では「人間の裁きの場」と慣用的に訳し、脚注で字義を示す。
  alternative: 「人間の日」「人間の判断」「人間の法廷」
  rationale: 暦上の日を述べる表現ではなく、周辺文脈における主の裁きとの対照のもと、人間による審理・評価を指す。「裁きの場」は意味を伝えつつ、制度的な法廷だけに限定しない。
- issue: ἀνακρίνω と最終的な裁きとの関係
  choice: 「吟味する」と訳す。
  alternative: 「裁く」「調べる」「審査する」
  rationale: この語が含む調査・評価の意味を保ち、後続文脈の最終的な神の裁きと同一視する解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「吟味」を反復して原文の語彙的一貫性を保ち、「しかし」「いや」によって論旨の進展を示した。
