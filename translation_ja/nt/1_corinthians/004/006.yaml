reference: 1 Corinthians 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: ja
  text: 兄弟たち[a]、私はあなたがたのために、これらのことを自分とアポロに当てはめました。これは、あなたがたが私たちを例として、「書かれていることを越えない」[b]ということを学び、そうして、だれも一人を支持して別の人に対して思い上がらないようになるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は、男女を含む信徒の集まりへの呼びかけとしても用いられます。
    reason: cultural_note
  - marker: b
    text: ギリシア語は省略的で、直訳に近くは「書かれていることを越えず」です。命令、または標語・格言のような表現とも考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 複数指示代名詞として、直前までの議論を広く受ける形を保った。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数呼格を本文で保ちつつ、男女を含む共同体への呼びかけであり得ることを脚注で示した。
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: 自分とアポロに当てはめて語りました
  rationale: 先の議論をパウロとアポロに移して例示したという修辞的用法を、自然な日本語で表した。「語りました」は、日本語で目的語「これらのこと」とのつながりを明確にするため補った。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのために
  rationale: διά＋対格がここで表す受益・目的を簡潔に示した。
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: それは、私たちを例として……学び
  rationale: 直訳的な「私たちにおいて」の圧縮された意味を、パウロとアポロが学びの実例であることを示す自然な日本語にした。
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 「書かれていることを越えない」ということ
  rationale: 動詞を欠く省略的な句であるため、その簡潔さを保つ否定表現とし、命令形に限定しなかった。
- source_word: γέγραπται
  choice: 書かれている
  rationale: 完了受動形による、現に権威あるものとして存続する書かれた内容を自然に表した。
- source_word: φυσιοῦσθε
  choice: 思い上がる
  rationale: 字義的には「膨れ上がる」だが、現代日本語で傲慢になる意味を明瞭かつ品位ある形で表した。
- source_word: ὑπὲρ τοῦ ἑνὸς κατὰ τοῦ ἑτέρου
  choice: 一方に肩入れして他方に対し
  rationale: 党派的に一人を支持し、別の一人に敵対する対照関係を明確にした。
theological_decisions:
- issue: τό· Μὴ ὑπὲρ ἃ γέγραπται の解釈
  choice: 「書かれていることを越えない」ということ
  alternative: 「書かれていることを越えてはならない」／標語として「書かれていることを越えず」
  rationale: 原文は省略的で、命令または標語・格言として理解し得る。本文では教訓の内容であることを示しつつ、明示的な命令形に決め切らず、脚注で曖昧さを保存した。
- issue: 「書かれていること」の指示範囲
  choice: 本文では特定しない
  alternative: 旧約聖書全体、または直前に引用された聖句を明示する
  rationale: γέγραπται は聖書を指す定型表現である可能性が高いが、ここでの正確な範囲は明記されていないため、解釈を本文に加えなかった。
translation_notes:
  register: 明快な現代標準日本語を用い、礼拝・公読にも耐える品位を保った。「肩入れする」は党派的支持を自然に示し、「思い上がる」は比喩の意味を読み手に明瞭に伝える。
