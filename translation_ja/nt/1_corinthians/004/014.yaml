  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: ja
  text: これらのことを、あなたがたを恥じさせるために書いているのではありません。むしろ、私の愛する子どもたちであるあなたがたを諭しているのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに恥をかかせるために」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたを戒めているのです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: 恥じ入らせるために
  rationale: 否定辞を伴う分詞を、執筆の意図を表す自然な日本語にした。「恥じ入らせる」は、単に困惑させるというより、原語の名誉・恥に関わる意味を保つ。
- source_word: γράφω ταῦτα
  choice: これらのことを書いている
  rationale: 現在形の書簡的用法を「書いている」とし、複数形 ταῦτα を「これらのこと」として明示した。
- source_word: ἀλλ’
  choice: むしろ
  rationale: 否定された意図と実際の意図との対比を、現代日本語で明瞭に示す。
- source_word: ὡς
  choice: として
  rationale: パウロがコリントの信徒たちに接する関係的立場を示し、比喩を過度に説明しない。
- source_word: τέκνα μου ἀγαπητὰ
  choice: 私の愛する子どもたち
  rationale: τέκνα の性別を限定しない親子関係と、ἀγαπητά の深い愛情を自然な日本語で表した。
- source_word: νουθετῶν
  choice: 諭している
  rationale: 警告だけでなく、理解を促しつつ正すという牧会的な意味を簡潔に伝える。
theological_decisions:
- issue: パウロの矯正的な言葉の牧会的調子
  choice: 愛する子どもたちとして諭している
  alternative: 愛する子どもたちとして戒めている
  rationale: 否定された「恥じ入らせる」意図と、愛情に基づく矯正との緊張を保った。「諭す」は矯正の力を残しながら、単なる非難として響くことを避ける。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒的・牧会的な威厳と親愛の情を保った。「子どもたち」は性別を限定しない。
