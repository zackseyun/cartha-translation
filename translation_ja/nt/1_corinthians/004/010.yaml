  terminology: 「メシア」は本節で称号として働くΧριστόςを一貫して表しており、プロジェクト方針および英語監査記録と整合します。「メシアにあって」はやや聖書的ながら、ἐν Χριστῷを説明的に狭めず保持する適切な表現です。
