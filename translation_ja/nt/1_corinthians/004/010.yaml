reference: 1 Corinthians 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: ja
  text: 私たちはメシアのために愚か者ですが、あなたがたはメシアにあって賢い者です。私たちは弱いですが、あなたがたは強い。あなたがたは尊ばれていますが、私たちは不名誉な者とされています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「尊ばれています」「不名誉な者とされています」は、単なる内面的な感情ではなく、人々の目に映る名誉と不名誉、社会的な評価を指す。
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: 愚か者
  rationale: 述語的な形容詞を名詞的に訳し、コリントの人々の自己評価に対するパウロの鋭い皮肉を保った。
- source_word: διὰ Χριστόν
  choice: メシアのために
  rationale: 対格を伴うδιάが表し得る理由・ゆえ・献身の含みを、自然な日本語で過度に限定せず示した。
- source_word: φρόνιμοι
  choice: 賢い者
  rationale: μωροίとの明確な対照を保ち、皮肉な響きをそのまま伝える。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: パウロに特徴的なἐν Χριστῷという関係・領域を表す言い回しを保持した。
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: 弱い／強い
  rationale: 身体的、社会的、権力的な広がりを限定せず、原文の簡潔な対句を再現した。
- source_word: ἔνδοξοι / ἄτιμοι
  choice: 尊ばれる／蔑まれる
  rationale: 公的な名誉と不名誉という社会的対照を自然な現代日本語で表した。
- source_word: ἡμεῖς / ὑμεῖς
  choice: 私たち／あなたがた
  rationale: 原文で明示された代名詞の強調を残し、使徒たちとコリントの人々との反語的対照を明瞭にした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての含みを保つため「メシア」とした。日本語として定着した「キリスト」も可能である。
- issue: διὰ Χριστόνの意味関係
  choice: メシアのために
  alternative: メシアのゆえに
  rationale: διά＋対格は理由または目的・献身を含み得るため、本文では自然で幅のある表現を採り、一義的に解消しなかった。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。原文の三つの対句と皮肉を保つため、簡潔な文節を重ねた。「メシアにあって」は日常語より聖書的な表現だが、ἐν Χριστῷを説明的に解消しないため採用した。
