  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: ja
  text: 私があなたがたのところへ行かないかのように、思い上がっている者たちがいます。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私があなたがたのところへ来ないかのように、高慢になっている者たちがいます」。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「膨れ上がっている」。パウロは1コリント4:6、4:19、5:2、8:1、13:4でも、思い上がった高慢を表すためにこの比喩を用いている。
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: と思い
  rationale: 分詞句とともに、彼らの態度の根底にある想定を表す。日本語では「と思い」が自然であり、事実を直接断定せず、彼らの見込みとして示せる。
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: 私があなたがたのところへ行くことはない
  rationale: ὡςに従属する属格分詞構文で、パウロ自身の断言ではなく、ある者たちが抱く想定を表す。「行かない」より「行くことはない」のほうが、彼らが来訪を見込んでいない含みを明確にする。
- source_word: δέ
  choice: （訳出せず）
  rationale: ここでは弱い談話上の接続を担う。単独節として自然な日本語にするため明示せず、前後の流れに委ねた。
- source_word: ἐφυσιώθησάν
  choice: 思い上がっている
  rationale: 字義的には「膨れ上がった」で、高慢になることの比喩。現代日本語で意味が明瞭な「思い上がっている」を本文に置き、原文の反復される比喩は脚注で示す。アオリストがもたらされた現状を文脈上表すため、結果状態として訳した。
- source_word: τινες
  choice: 者たちがいます
  rationale: 共同体内の一部を指す不定複数。「ある者たち」も可能だが、文末の「います」と合わせた表現が自然である。
theological_decisions:
- issue: コリントの人々の高慢に対するパウロの批判
  choice: 本文では「思い上がっている」と明確に訳し、原語の「膨れ上がる」という比喩を脚注に残す。
  alternative: 私があなたがたのところへ行くことはないかのように、膨れ上がっている者たちがいます。
  rationale: 教理的な限定を加えず、φυσιόωが表す自己尊大な高慢を普通の読者に明瞭に伝える。同時に脚注によって、第一コリント書に繰り返されるパウロの比喩と修辞的連続性を保持する。
translation_notes:
  register: 明瞭で現代的ながら、使徒の戒めにふさわしい引き締まった文体とした。「思い上がっている」は口語的すぎず、原文の批判の強さを自然に伝える。脚注記号は本文中に[a][b]の順で配置した。
