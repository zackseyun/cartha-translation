reference: 1 Corinthians 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: ja
  text: 私が思うに、神は私たち使徒を、死に定められた者たちのように、最後の者として公に示されました。というのも、私たちは世界にも、天使たちにも、人々にも見せ物となったからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: 私が思うに
  rationale: パウロ自身の判断を表す一人称の語感を自然な日本語で保つ。γάρの説明的なつながりは、後半の「からです」と文脈全体によって示した。
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: 私たち使徒を
  rationale: 「私たち」と「使徒」の同格関係を簡潔で自然な日本語にした。
- source_word: ἐσχάτους ἀπέδειξεν
  choice: 最後の者として見せ物になさいました
  rationale: ἀπέδειξενの公然と示す意味を、後続の劇場的比喩と結びつけて表現し、ἐσχάτουςの「最後・最下位」の含みを保った。
- source_word: ὡς ἐπιθανατίους
  choice: 死刑を宣告された者たちのように
  rationale: 死に定められ、公衆の面前に引き出される者という競技場のイメージを明瞭に伝える。
- source_word: θέατρον ἐγενήθημεν
  choice: 見せ物となった
  rationale: θέατρονを建物としての「劇場」ではなく、公衆の観覧にさらされる「見せ物」という文脈上の意味で訳した。
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: 世界に対して、すなわち御使いたちにも人々にも
  rationale: 世界が御使いと人間を含む観衆として展開されている構造を、日本語で理解しやすく示した。ἀνθρώποιςは男性に限定せず「人々」とした。
theological_decisions:
- issue: ἀγγέλοιςの指示対象
  choice: 超自然的な御使いたち
  alternative: 一般的な使者たち
  rationale: 「世界」および「人々」と並ぶ宇宙的な観衆という文脈では、天的存在である御使いを指すのが最も自然である。
- issue: 「世界」と「御使いたち、人々」の関係
  choice: 後者を前者の説明的展開として訳す
  alternative: 三つの観衆を並列的に訳す
  rationale: 原文のκαίの連続には並列の余地もあるが、κόσμοςの包括的意味と「御使い／人々」の対照から、説明的な展開として自然に読める。ただし脚注で統語上の別訳を示す。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、使徒の辱めと公的なさらしものという厳粛な調子を保った。「御使い」は聖書的で品位ある標準的表現として用い、「人々」によって性別を限定しない意味を示した。
