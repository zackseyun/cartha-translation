id: 1CO.4.19
reference: 1 Corinthians 4:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: ja
  text: しかし、主が望まれるなら、私は間もなくあなたがたのところへ行き、思い上がっている人たちのことばではなく、力を見極めます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: しかし、私は間もなくあなたがたのところへ行き
  rationale: δέの穏やかな対比を「しかし」で示し、未来形ἐλεύσομαιと近い時を表すταχέωςを自然な現代日本語で表した。話者から相手の所在地への移動なので、日本語では「来る」より「行く」が自然である。
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: 主が望まれるなら
  rationale: 条件節の意味を保ち、κύριοςが誰を指すかを本文以上に限定しない。「望まれる」は敬意を伴う自然な表現である。
- source_word: γνώσομαι
  choice: 見極めます
  rationale: 単なる知識の獲得ではなく、訪問して実情を確かめる文脈上の意味を簡潔に表す。
- source_word: τὸν λόγον
  choice: ことば
  rationale: λόγοςの幅を保ちつつ、δύναμιςとの簡潔な対照を維持する。「話術」や「主張」と限定しない。
- source_word: τῶν πεφυσιωμένων
  choice: 思い上がっている人たち
  rationale: φυσιόωの『膨れ上がる』という比喩が表す高慢の継続状態を、明瞭な現代日本語で表す。
- source_word: ἀλλὰ τὴν δύναμιν
  choice: ではなく、その力を
  rationale: λόγοςとの対照を保ち、力が奇跡、権威、実効性のどれかに限定されないよう「力」とした。日本語として対照の対象を明確にするため「その」を補った。
theological_decisions:
- issue: 「主」（ὁ κύριος）の指示対象
  choice: 「主」とだけ訳し、特定しない
  alternative: 「主イエス」または「神」
  rationale: ギリシア語本文はὁ κύριοςとのみ述べるため、パウロ用法におけるキリスト論的可能性を認めつつも、本文にない限定を加えない。
- issue: 「ことば」と「力」の対照
  choice: 広い意味を保ったまま「ことば」と「力」と訳す
  alternative: 「弁舌と奇跡」「主張と使徒的権威」などに具体化する
  rationale: 直後の神の国についての記述を踏まえても、δύναμιςの現れを一つに限定せず、原文の神学的な含みを保持する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「思い上がっている」は高慢を表す反復語の意味を自然に伝え、「ことば／力」の簡潔で解釈を限定しない対照を保った。
