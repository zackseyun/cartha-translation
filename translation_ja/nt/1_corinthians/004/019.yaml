  source_fidelity: 全体として原文に忠実です。ἐλεύσομαιは相手側への移動として「行き」、ταχέωςは「間もなく」、条件節は「主が望まれるなら」と自然に再現されています。γνώσομαιを「見極めます」とすることも、訪問して実態を確かめる文脈に適合します。ただし、τὴν δύναμινは冠詞付きの「その力」ではなく、対照項として簡潔に「力」とするのがより直接的です。
  naturalness: 明瞭な現代標準日本語であり、語順も自然です。「思い上がっている人たち」は分かりやすく、文脈にふさわしい表現です。「ことばではなく、力を見極めます」という簡潔な対照は日本語としても十分自然です。
  terminology: 「主」は指示対象を過度に特定せず、κύριοςに適切です。「ことば」と「力」はλόγος／δύναμιςの意味領域を不当に狭めません。「思い上がっている」はπεφυσιωμένωνの比喩的な高慢を適切に表します。
  issues:
