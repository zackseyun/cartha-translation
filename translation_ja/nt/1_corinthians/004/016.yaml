  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: ja
  text: ですから、私はあなたがたに勧めます。私に倣う者となってください。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私を見倣う者となってください」。
    reason: lexical_alternative
  - marker: b
    text: パウロは別の箇所で、「私がキリストに倣っているように、私に倣ってください」と述べている（Ⅰコリント11:1）。
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: 勧めます
  rationale: ここでは慰めではなく、パウロの切実な勧告を表す。「お願いします」より強く、「勧告します」より自然な現代日本語である。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論を受けた推論を明確にしつつ、自然な文章の流れを保つ。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: 二人称複数を明示する。日本語では「勧める」の相手を「に」で示すのが自然である。
- source_word: μιμηταί
  choice: 倣う者
  rationale: 単なる追随ではなく、人物を模範として見習う意味を保つ。「模倣者」より自然で品位ある現代日本語である。
- source_word: μου
  choice: 私に
  rationale: 「私に倣う」という日本語の自然な構文で、パウロ自身が直接の模範であることを明示する。
- source_word: γίνεσθε
  choice: となってください
  rationale: γίνομαι の命令が示す、ある状態に入るよう求める意味を「でありなさい」ではなく「となってください」で表す。
theological_decisions:
- issue: パウロが自分自身に倣うよう命じる表現を、より広いキリスト中心の文脈によって本文中で弱めるべきか。
  choice: 私に倣う者となってください
  alternative: 私の模範に従ってください
  rationale: 本文はパウロ自身を直接の模範として明示しているため、その神学的緊張を弱めずに訳す。キリストとの関係は脚注の相互参照で示す。
translation_notes:
  register: 明瞭で自然な現代標準日本語。丁寧な勧告として訳しつつ、原文の命令的な力と、パウロ自身を模範とする直接性を保持した。
