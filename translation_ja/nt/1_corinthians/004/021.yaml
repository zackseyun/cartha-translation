base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: ja
  text: あなたがたは何を望むのですか。私が杖をもってあなたがたのところに行くのがよいですか。それとも、愛と柔和な心をもって行くのがよいですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「愛と柔和な霊をもって」とも訳せる。「霊」はパウロの柔和な心や態度を指すと考えられるが、聖霊の働きを暗示すると理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: あなたがたは、どちらを望むのですか
  rationale: 二つの選択肢を迫る直接的な修辞疑問として、自然な現代日本語にした。後続の「それとも」とのつながりを明確にするため「どちら」を補った。
- source_word: ἐν ῥάβδῳ
  choice: 杖を持って
  rationale: ῥάβδοςの具体的な比喩を保ち、抽象的な「懲らしめ」とは訳さなかった。ここでは権威と懲戒を象徴する杖であり、「むち」よりも語義の幅を保てる。
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: 私が……あなたがたのところに行くことですか
  rationale: 審議的接続法による問いを、日本語で選択を迫る疑問文として表した。
- source_word: ἐν ἀγάπῃ
  choice: 愛……をもって
  rationale: 前半のἐν ῥάβδῳと並行する、来訪のあり方・手段を示す表現として訳した。
- source_word: πνεύματί τε πραΰτητος
  choice: 柔和な心をもって
  rationale: πνεῦμαをここではパウロの態度・心構えとして自然に表し、πραΰτηςの穏やかさと節度を「柔和」で示した。原文の別の捉え方は脚注に残した。
theological_decisions:
- issue: πνεύματιが人の心・態度を指すか、聖霊を暗示するか
  choice: パウロの「柔和な心」として本文に示す
  alternative: 「柔和をもたらす霊」と理解し、聖霊の働きへの暗示と取る
  rationale: 直近の対比は、パウロが懲戒的な厳しさで行くか、愛と柔和な態度で行くかという二つの来訪の仕方である。冠詞のないπνεῦμαを明示的に「聖霊」と限定する根拠は十分でないが、その可能性を完全には排除せず脚注で示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「杖」という原文の鋭い懲戒的比喩を残しつつ、「柔和な心」は日常的に理解できる表現とした。
