source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: ja
  text: ですから、古いパン種や悪意と邪悪のパン種を用いず、誠実と真理の種なしパンをもって、祭り[a]を祝いましょう。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「祭りを守りましょう」「祭りを祝いつづけましょう」とも訳せます。ギリシア語は、前節から続く過越祭のイメージを保っています。
    reason: lexical_alternative
  - marker: b
    text: 「種なしパン」の「パン」は原文に明記されておらず、直訳すれば「誠実と真理の種なしのもの」です。過越祭の比喩を明確にするため、「パン」を補っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す推論の力を、自然な現代日本語で表す。
- source_word: ἑορτάζωμεν
  choice: 祭りを祝いましょう
  rationale: 現在接続法の勧奨を「〜ましょう」で表し、動詞の祭りを祝う意味と、前節から続く過越祭のイメージを保つ。
- source_word: ζύμῃ παλαιᾷ
  choice: 古いパン種
  rationale: ζύμηを「パン種」として、過越と除酵の聖書的イメージを保つ。前置詞ἐνは日本語では「用いず」によって自然に表した。
- source_word: κακίας
  choice: 悪意
  rationale: 人に害を加えようとする心や道徳的な悪を指し得る語として、後続の「邪悪」と区別できる明瞭な訳語を選ぶ。
- source_word: πονηρίας
  choice: 邪悪
  rationale: 広い意味での道徳的な悪を表し、「悪意」と意味を完全に重ねずに二語の並列を保つ。
- source_word: ἀλλ’ ἐν ἀζύμοις
  choice: 種なしパンをもって
  rationale: ἀζύμοιςは実質名詞的な「種を入れないもの」であり、過越祭の文脈から日本語で自然な「種なしパン」を補って比喩を明確にする。
- source_word: εἰλικρινείας
  choice: 誠実
  rationale: 混じり気のない純真さや真摯さを表し、腐敗を象徴するパン種との対比を保つ。
- source_word: ἀληθείας
  choice: 真理
  rationale: 原語の基本的意味を直接表し、「誠実」と並ぶ属格表現を保つ。
theological_decisions:
- issue: パウロの勧告における過越祭の比喩
  choice: 「祭りを祝いましょう」「種なしパンをもって」と訳し、過越祭と除酵のイメージを保持する。
  alternative: 「祝いましょう」「誠実と真理をもって」と一般化して訳す。
  rationale: 直前の7節でキリストが過越の小羊として示されているため、祭りと種なしパンの表象を保つことが議論の連続性を最もよく伝える。「パン」は原文に明記されていないが、文脈に基づく補足であり、教理的な意味を追加するものではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「パン種」「種なしパン」「祭り」により過越祭の比喩を残しつつ、「祝いましょう」で勧奨を自然に表現した。
