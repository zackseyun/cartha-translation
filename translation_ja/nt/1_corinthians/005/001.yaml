  to: 実際、あなたがたの間に性的不品行があると伝えられています。それも、異邦人[a]の間にさえ見られないような性的不品行です。ある人が自分の父の妻と関係を持っている[b]というのです。
  rationale: 所有を示すように読める「自分のものとしている」を、原文の文脈上の意味を自然な現代日本語で伝える「父の妻と関係を持っている」に改めました。あわせて、強調・驚きを表す冒頭と、異邦人との比較をより自然な日本語に整えました。本文は女性を継母と確定せず、脚注に可能性としてとどめています。
