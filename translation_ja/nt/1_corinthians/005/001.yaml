id: 1CO.5.1
reference: 1 Corinthians 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: ja
  text: 実際、あなたがたの間に性的不品行があると伝えられています。それも、異邦人[a]の間にさえ見られないような性的不品行です。ある人が自分の父の妻と関係を持っている[b]というのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異邦人」は、ここではユダヤ人以外の諸国民を指します。「諸国民」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「父の妻を持っている」。ここでは、その女性と性的な関係を持っていることを意味します。父の再婚相手、すなわち継母であった可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: 現に
  rationale: 量を表す「全く」ではなく、驚きと強調を伴う「実際に／現に」の意味。文脈に合う自然で格調ある表現とした。
- source_word: ἀκούεται
  choice: 伝えられています
  rationale: 受動形が、共同体について広く聞かれ報告されていることを示すため。直訳的な「聞かれています」より自然である。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間に
  rationale: コリントの共同体内部で起きていることを明確に表す。
- source_word: πορνεία
  choice: 性的不品行
  rationale: 不適切な性関係を広く指す語であり、特定の行為だけに狭めない現代日本語として選んだ。
- source_word: τοιαύτη πορνεία
  choice: それも、…ほどの性的不品行
  rationale: τοιαύτη の質的・強調的な力を、日本語として自然な比較構文で表した。
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: 異邦人の間にさえ見られない
  rationale: ἔθνηをパウロのユダヤ人・非ユダヤ人という枠組みに沿って「異邦人」とし、省略された述語は日本語で意味が通るよう「見られない」と補った。
- source_word: γυναῖκά τινα τοῦ πατρὸς ἔχειν
  choice: ある人が、自分の父の妻を自分のものとしている
  rationale: 「父の妻」という原文の言い方を保ちつつ、ἔχειν がこの文脈で継続的な男女関係を婉曲に示すことが伝わるようにした。単なる所有を意味するとの誤解を避けるため注を付した。
theological_decisions:
- issue: ἔθνεσινを民族的・宗教的に中立な語で訳すか、評価的な語で訳すか
  choice: 異邦人
  alternative: 諸国民／異教徒
  rationale: 原語はここで主に非ユダヤ人を指す。「異教徒」は原文以上に宗教的・評価的な含みを加え得るため避けた。
- issue: γυναῖκα τοῦ πατρὸςを「継母」と特定するか
  choice: 父の妻
  alternative: 継母
  rationale: その女性が話題の男性の実母ではない可能性は高いが、原文は専門的な親族名称を用いていない。明示されていない家族関係を本文で確定しないため、原文の表現を保った。
- issue: ἔχεινの性的関係を本文でどこまで明示するか
  choice: 自分のものとしている
  alternative: 性的関係を持っている／妻としている
  rationale: 原文の婉曲さと簡潔さをある程度保ちながら、通常の所有と誤解されない表現を選び、具体的な意味は脚注で示した。「妻としている」は婚姻の成立を原文以上に確定し得る。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの驚きと非難の強さを保った。「性的不品行」は広い意味を保つ語として採用し、「父の妻」は原文以上に「継母」と断定しない形にした。
