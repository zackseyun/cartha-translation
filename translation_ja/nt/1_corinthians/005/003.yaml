  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: ja
  text: 私は、体においては不在ですが、霊[a]においては共にいます。あたかもその場にいるかのように、このようなことを行った者を、すでに裁いています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「霊」は、聖霊ではなく、パウロ自身の霊を指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すでに判決を下しています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: 体では離れていても
  rationale: 与格を「体という点では」と捉え、死や身体からの離脱を示唆せず、身体的に不在であることを自然な日本語で表す。
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: 霊ではそこにおり
  rationale: 身体との対比を保ちつつ、πνεῦμαがパウロ自身の霊を指す可能性を自然に示す。「そこに」は文脈上のコリント共同体への臨在を補っている。
- source_word: ἤδη κέκρικα
  choice: すでに裁いている
  rationale: 完了形が示す、すでになされた判断とその現在的効力を表す。「判決を下した」も可能だが、κρίνωとの語彙的対応を優先した。
- source_word: ὡς παρὼν
  choice: あたかもそこにいるかのように
  rationale: ὡςの比較的な力を保ち、身体的に同席している場合と同様に判断したという意味を明確にする。
- source_word: τὸν ... κατεργασάμενον
  choice: 行った者
  rationale: 名詞化された分詞を性別を不必要に補わず表す。κατεργάζομαιの実行・遂行の意味を簡潔に伝える。
- source_word: οὕτως τοῦτο
  choice: このようなことを
  rationale: οὕτωςとτοῦτοを日本語で一体的に表し、直前に述べられた異常な行為の性質を指す。ぎこちない逐語訳を避けながら両要素を反映する。
- source_word: γάρ
  choice: というのも……からです
  rationale: 前節を説明する論理関係を、日本語で自然な呼応表現によって示す。
- source_word: μὲν ... δὲ
  choice: ……では……いても、……では……
  rationale: 身体的な不在と霊における臨在との対照を、現代日本語の譲歩構文で自然に表す。
theological_decisions:
- issue: 「霊ではそこにいる」の意味
  choice: 身体的には不在でも、自らの霊において共同体と共にいるという表現として訳す。
  alternative: 聖霊による臨在または啓示的洞察を指す、あるいはより強い神秘的臨在を主張していると解する。
  rationale: σώματιと無冠詞のπνεύματιの直接的対照は、パウロ自身の体と霊を指すのが最も自然である。ただし、霊的臨在の仕組みまでは本文で限定しない。
- issue: κρίνωの司法的・共同体規律的な強さ
  choice: 「裁いている」とし、判断と規律的宣告の双方を含み得る表現を保つ。
  alternative: 「判断を下している」または「判決を下している」と訳す。
  rationale: 文脈には共同体規律の強い意味があるが、特定の司法的形式を訳文で過度に確定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「体」と「霊」の簡潔な対照、および完了形の継続的効力を自然に表した。原文上「霊」がパウロ自身の霊か聖霊かについては、前者を本文で自然に示しつつ、そのあり方を説明しすぎない。
