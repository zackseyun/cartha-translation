source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: ja
  text: 私たちの主イエスの名によって[a]、あなたがたが集まり、私の霊もあなたがたと共にいるとき、私たちの主イエスの力と共に、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの主イエスの名によって」は、「あなたがたが集まり」に結び付くとも、続く処置に結び付くとも取れます。原文の構文は簡潔で、係り先に幅があります。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: 名によって
  rationale: 「名において」より自然な現代日本語でありながら、イエスの権威のもとで行うという慣用的な意味を保つ。「権威によって」と説明し切らず、原文の「名」を残した。
- source_word: κυρίου
  choice: 主
  rationale: 新約聖書における称号としての重みを保ち、日本語聖書で定着した自然な訳語を用いた。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 人名を現代日本語で定着した形に音写した。
- source_word: συναχθέντων ὑμῶν
  choice: あなたがたが集まり……とき
  rationale: アオリスト受動分詞を伴う属格独立構文を、集会の時を示す自然な時間節として訳した。
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: 私の霊も共にいる
  rationale: 原文の圧縮された属格独立構文に、日本語として必要な「いる」を補った。パウロの非身体的な参与を示しつつ、そのあり方は規定しない。
- source_word: σὺν
  choice: 共に
  rationale: 同伴を表す基本的な意味を簡潔に保った。
- source_word: δυνάμει
  choice: 力
  rationale: 単なる制度上の「権威」に限定せず、主イエスの働く力という広がりを保った。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 私たちの主イエスの
  rationale: 属格をそのまま保ち、その力の所有・源という含みを狭く限定しない訳とした。
theological_decisions:
- issue: 集会におけるパウロの霊の臨在
  choice: 「私の霊も共にいる」とし、非身体的な参与を明示する
  alternative: 単にパウロの思いや意向が一致していると解する、または特定の神秘的臨在として説明する
  rationale: 本文はパウロの霊が集会に参与することを語るが、その仕組みは説明していないため、主張を保ちつつ教理的に限定しなかった。
- issue: 「主イエスの名によって」の係り先
  choice: 原文と同様に文頭に置き、集会または続く処置のどちらにも関わり得る形を保つ
  alternative: 「主イエスの名によって集まる」と明確に結び付ける、または次節の処置だけに結び付ける
  rationale: ギリシア語の語順と構文には係り先の幅があるため、訳文で一方に断定せず脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「主」「霊」「力」など本文の神学的な語を平易な別語に置き換えず保持した。原文が次節へ続く文の途中であるため、訳文も読点で終えて連続性を示した。
