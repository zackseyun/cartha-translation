id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: ja
  text: あなたがたが誇っているのは、よくないことです。わずかなパン種が練り粉全体[a]を膨らませることを、知らないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「練り粉の塊全体」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: よくないこと
  rationale: ここではコリントの信徒たちの誇りを道徳的・実際的に評価している。「よくないこと」は明快で自然な現代日本語である。
- source_word: καύχημα
  choice: 誇っていること
  rationale: 名詞が表す誇りや誇る行為を、日本語では「あなたがたが誇っているのは」と動詞的に表すことで、叱責の調子を自然に伝えた。
- source_word: οὐκ οἴδατε
  choice: 知らないのですか
  rationale: パウロの修辞的な問いを保ちつつ、現代日本語として自然な形にした。
- source_word: μικρὰ ζύμη
  choice: わずかなパン種
  rationale: 古代の製パンの比喩と聖書的な連想を保つため「イースト」ではなく「パン種」とし、量の少なさを「わずかな」で示した。
- source_word: ὅλον τὸ φύραμα
  choice: 練り粉全体
  rationale: φύραμαは混ぜてこねた生地を指す。「練り粉全体」は伝統的な比喩を保ちながら、現代の読者にも意味が通じる。
- source_word: ζυμοῖ
  choice: 膨らませる
  rationale: パン種が生地全体に作用するという像を、日本語で最も自然かつ具体的に表した。
theological_decisions:
- issue: パン種の比喩が指すもの
  choice: 比喩をそのまま残し、罪や教会への影響とは訳文中で明示しない
  alternative: 「わずかな罪が教会全体を堕落させる」と説明的に訳す
  rationale: この節自体はことわざ的な比喩を述べており、その具体的な適用は文脈に委ねられている。訳文で一義的に解釈を加えず、原文の比喩と緊張を保った。
translation_notes:
  register: 明快な現代標準日本語を用い、パウロの率直な叱責と修辞的な問いを保った。「パン種」「練り粉」により、古代の製パンに基づく比喩を自然で品位ある表現として残した。
