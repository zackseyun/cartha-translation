source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: ja
  text: しかし、外にいる人々[a]を裁くのは神です[b]。あなたがたの中から、その悪い者を除き去りなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「外部の人々」。教会共同体の外にいる人々を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の動詞は現在形（「裁く」）である。文脈から未来の意味で「裁かれる」と訳すこともある。
    reason: lexical_alternative
  - marker: c
    text: 別訳「その悪い者を、あなたがたのただ中から追い出しなさい」。この表現は、申命記に繰り返される、共同体から悪を除くよう命じる定型句を踏まえている。
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: 外の人々
  rationale: 定冠詞を伴う副詞が名詞的に用いられ、教会共同体の外にいる人々を指す。「外の人々」は、その関係的な意味を過度に説明せず、自然な現代日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: 前節の「内の人々」を裁く責任との穏やかな対比を明確にする。
- source_word: κρίνει
  choice: 裁かれます
  rationale: 現在直説法を、神が外の人々を裁くという一般的・継続的な真理として現在形で保つ。文脈から未来形に限定しない。
- source_word: ἐξάρατε
  choice: 除き去りなさい
  rationale: アオリスト命令法が求める断固とした行為を表しつつ、原文にない後代の教会制度上の用語を持ち込まない。
- source_word: τὸν πονηρὸν
  choice: その悪い者
  rationale: 冠詞付きの男性単数形は直近の具体的な違反者を指す。「その悪い者」は指示性と道徳的評価を保ち、文脈上男性であることを否定せず、日本語として不必要に性別を強調しない。
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: あなたがた自身の中から
  rationale: 共同体内部から取り除く意味を明確にし、αὐτῶνの強意も「自身」で反映する。
theological_decisions:
- issue: 教会の規律に関する命令の性質
  choice: 会衆は問題を起こしている者を自分たちの交わりから除くよう命じられ、外の人々への裁きは神に委ねられている。
  alternative: 共同体からの正式な排除ではなく、共同体内の悪を一般的に取り除く命令と読むこともできる。
  rationale: 第一コリント5章の文脈は、教会内の具体的な性的非道徳の事例を扱い、内の人々に対する会衆の責任と、外の人々に対する神の裁きを対比する。ただし訳文では、ギリシア語に明記されていない後代の教会制度や手続きを加えない。
- issue: κρίνειの時制
  choice: 現在形の「裁かれます」とする。
  alternative: 文脈に基づいて未来形の「裁かれます／裁かれるでしょう」とする。
  rationale: ギリシア語本文は現在直説法であり、神の裁きについての一般的陳述として自然に理解できるため、その時制を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「裁かれます」は神を主語とする尊敬表現であると同時に、κρίνειの現在形を保持する。「除き去りなさい」は決然とした命令を示すが、原文以上に処分の制度や手続きを特定しない。脚注記号は対応する語句の直後に配置した。
