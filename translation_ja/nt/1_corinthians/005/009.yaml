  text: Ἔγραψα ὑμῖν ἐν τῇ ἐπιστολῇ μὴ συναναμίγνυσθαι πόρνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/009.yaml
  text: I wrote to you in the letter not to associate with sexually immoral people[c][b][a],
translation:
  language: ja
  text: 私は、手紙の中で[a]、あなたがたに、性的に不道徳な人々[c]とは付き合わないように[b]と書きました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の手紙の中で」。ギリシア語は、パウロが以前に送った手紙を指すとも、この手紙のこれ以前の箇所を指すとも解釈できます。
    reason: alternative_reading
  - marker: b
    text: または「交わらないように」「仲間として行動しないように」。
    reason: lexical_alternative
  - marker: c
    text: または「性的に不道徳な者たち」。ギリシア語の πόρνοις は、性的な不道徳を行う者たちを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: 書きました
  rationale: アオリスト直説法を自然な過去形で表した。以前の手紙を指す可能性と、この手紙の先の箇所を指す可能性のどちらも、動詞だけでは決まらないため、単純に「書きました」とした。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数の受け手であるコリントの信徒たちを指す与格を明示した。
- source_word: ἐν τῇ ἐπιστολῇ
  choice: 手紙の中で
  rationale: 定冠詞を伴う既知の特定の手紙を示しつつ、それが以前の手紙か現在の手紙かを本文では限定しない表現とした。
- source_word: μὴ συναναμίγνυσθαι
  choice: 付き合わないように
  rationale: 社会的に交わり、仲間として行動することを避けるよう求める不定詞句を、明瞭な現代日本語で表した。「交際する」は恋愛関係の意味に受け取られやすいため避けた。
- source_word: πόρνοις
  choice: 性的に不道徳な人々
  rationale: 性的な不道徳を行う者たちを指す複数名詞であり、単一の行為類型に狭めず、人物を指すことが分かるように訳した。
theological_decisions:
- issue: 「手紙」が何を指すか
  choice: 特定の手紙を指すが、以前の手紙か現在の手紙かは本文で特定しない
  alternative: 現存しない以前の手紙を指す／第一コリント書のこれ以前の箇所を指す
  rationale: ἐν τῇ ἐπιστολῇ は特定の手紙を示すが、その歴史的な指示対象まではギリシア語の句そのものから確定できないため、曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、文体の品位を保った。「付き合う」は日常的で分かりやすい一方、ここでは恋愛に限定されない社会的な関わりを意味するため、脚注で語義の幅を補った。
