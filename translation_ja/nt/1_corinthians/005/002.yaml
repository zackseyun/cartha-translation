source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: ja
  text: それなのに、あなたがたは思い上がっています。むしろ悲しみ嘆き、この行いをした者があなたがたの中から取り除かれるようにすべきではなかったのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのただ中から取り去られる」。文脈上は、規律のための処置によってその人を共同体の交わりから外すことを指すと考えられる。
    reason: 「取り除かれる」という受動表現の別の訳し方と、文脈上有力な意味を示すため。
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: 思い上がっています
  rationale: 直訳的には「膨れ上がっている」であり、高慢に満ちた状態を表す完了受動分詞。日本語では比喩を無理なく伝え、この手紙での非難の意味を明確にする「思い上がっています」とした。
- source_word: οὐχὶ μᾶλλον
  choice: むしろ……すべきではなかったのですか
  rationale: 実際の態度と取るべきだった反応を対比する、非難を込めた修辞疑問の力を自然な現代日本語で表した。
- source_word: ἐπενθήσατε
  choice: 悲しみ嘆き
  rationale: 死を悼む場合にも使われる強い悲嘆の語であり、単なる残念さ以上の共同体的な嘆きを示すため「悲しみ嘆き」とした。
- source_word: ἵνα ἀρθῇ
  choice: 取り除かれるように
  rationale: ἵναとアオリスト受動接続法による目的・意図された結果を保ち、受動表現の行為主体を特定しないようにした。
- source_word: ἐκ μέσου ὑμῶν
  choice: あなたがたの中から
  rationale: 共同体のただ中から外すことを示す慣用表現を、明瞭で自然な日本語にした。
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: このような行いをした者
  rationale: 冠詞付き分詞による当事者の特定を簡潔に表し、ἔργονの重みを「行い」で伝えた。
theological_decisions:
- issue: 行為者に求められる処置の性質
  choice: あなたがたの中から取り除かれる
  alternative: 神によって取り去られる、または明示的に除名される
  rationale: 受動形ἀρθῇは行為主体を明示しない。直後の共同体的懲戒の文脈には排除が適合するが、訳文では「除名」と限定せず、原文に残る受動表現と解釈上の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叱責を込めた修辞疑問と「悲しみ嘆く」の強い調子を保った。原文の一文を日本語では二文に分け、対照関係を読み取りやすくした。
