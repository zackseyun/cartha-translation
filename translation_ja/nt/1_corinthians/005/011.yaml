id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: ja
  text: しかし今、私はあなたがたに、兄弟と呼ばれている人が、淫らな者、貪欲な者、偶像を礼拝する者、人をののしる者、酒におぼれる者、あるいは人から奪い取る者であるなら、そのような人とは交際してはならず、一緒に食事さえしてはならない、と書きました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: しかし今、私が…書いたのは
  rationale: アオリストの「書いた」を保ちつつ、直前の説明と対比して、ここで手紙の真意を明確にする流れを自然な日本語で示した。
- source_word: μὴ συναναμίγνυσθαι
  choice: 交際してはならず
  rationale: 単なる接触ではなく、親しい付き合いを持つことを禁じる語意を簡潔に表した。
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: 兄弟と呼ばれている人
  rationale: 共同体の一員を自称する意味にも、他者からそう認められている意味にも限定せず、原文の受動表現の曖昧さを保った。
- source_word: πόρνος
  choice: 淫らな者
  rationale: 性的な不道徳を常習的・特徴的に行う者を指す名詞として、明瞭で品位ある現代語を選んだ。
- source_word: πλεονέκτης
  choice: 貪欲な者
  rationale: 過度に欲しがる者という広い意味を保ち、後出のἅρπαξとの区別も維持した。
- source_word: εἰδωλολάτρης
  choice: 偶像を礼拝する者
  rationale: 「偶像礼拝者」より一般読者に直ちに理解しやすい表現とした。
- source_word: λοίδορος
  choice: 人をののしる者
  rationale: 侮辱的・中傷的な言葉で他者を攻撃する者という能動的な意味を表した。
- source_word: μέθυσος
  choice: 酒におぼれる者
  rationale: 単発の酩酊よりも、飲酒に支配された人物像を自然な現代日本語で示した。
- source_word: ἅρπαξ
  choice: 人から奪い取る者
  rationale: 暴力的な強奪から搾取までを含み得る語なので、「詐欺師」に狭めず、他者のものを不当に取る中心義を表した。
- source_word: μηδὲ συνεσθίειν
  choice: 一緒に食事をしてもならない
  rationale: 禁止の強調「〜さえ」を、日本語では明確な追加禁止として表現した。
theological_decisions:
- issue: 「兄弟」と呼ばれる者の身分
  choice: 兄弟と呼ばれている人
  alternative: 兄弟を名乗る人
  rationale: 原文は自称か共同体による呼称かを明示しないため、偽信者と断定する訳を避けた。
- issue: 食事禁止の範囲
  choice: 一緒に食事をしてもならない
  alternative: 主の晩餐を共にしてもならない
  rationale: συνεσθίειν自体は通常の会食にも共同体の食事にも用い得るため、聖餐だけに限定しなかった。
- issue: 列挙された罪と一時的な過ちの関係
  choice: 「〜な者」という人物類型として訳出
  alternative: これらの罪を一度でも犯した人
  rationale: 原文は各罪を表す名詞で人物を特徴づけており、単発の行為か継続的生活様式かを訳文で過剰に規定せず、少なくとも「一度でも」とはしなかった。
translation_notes:
  register: 明瞭で品位ある現代標準語。命令の厳しさを弱めず、同時に原文が明示しない教会制度上の手続きや聖餐への限定は加えていない。列挙は理解しやすい語で統一した。
