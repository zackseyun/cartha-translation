  source_fidelity: 全体として列挙、対象（「兄弟と呼ばれている人」）、交際禁止、および会食禁止を適切に伝えている。しかし、μηδέ の強調（「…さえ」）が訳文に明示されておらず、原文の「そのような人とは、食事を共にすることさえしない」という強い追加禁止を回復するのが望ましい。
  naturalness: 現訳は概ね自然で明瞭だが、「私が…書いたのは、…ということです」はやや説明的で重い。文を整えて「…と書きました」とすることで、現代標準語として読みやすくなる。
  terminology: 「兄弟と呼ばれている人」は ἀδελφὸς ὀνομαζόμενος の受動表現の曖昧さを保つ。「淫らな者」「貪欲な者」「偶像を礼拝する者」「人をののしる者」「酒におぼれる者」「人から奪い取る者」は、各語の区別をおおむね適切に反映している。
