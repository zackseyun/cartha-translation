id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: ja
  text: それは、この世の、性的に不道徳な人たちや、貪欲な者たち、人のものを奪う者たち[a]、あるいは偶像を礼拝する者たちとは、いっさい付き合わない、という意味ではありません。[b] もしそうなら、あなたがたはこの世から出て行かなければならないことになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人のものを奪う者たち」と訳した語（ἅρπαξιν）は、「強奪する者たち」または「ゆすり取る者たち」とも訳せます。力や搾取によって他者から奪う者を指し得ます。
    reason: lexical_alternative
  - marker: b
    text: パウロはここで、教会外の不道徳な人々すべてを避けるよう命じたのではないことを明らかにしています。5章11節も参照してください。
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: いっさい……ない、という意味ではありません
  rationale: 前節の命令を絶対的な意味に取ることを否定する文脈上の明確化として訳した。日本語では、省略されている前節の「付き合う」を補うことで自然かつ明瞭になる。
- source_word: πόρνοις
  choice: 性的に不道徳な人たち
  rationale: 性的な不道徳を行う者という語の限定性を保ちつつ、現代の一般読者に明確な表現とした。
- source_word: τοῦ κόσμου τούτου
  choice: この世の
  rationale: ここでは教会外を含む人間社会を指す。「この世の」は簡潔で、後半の「この世から」との語の対応も保つ。
- source_word: πλεονέκταις
  choice: 貪欲な者たち
  rationale: もっと多くを得ようとする強い欲望、とりわけ利得への貪欲さを表す標準的で理解しやすい語を選んだ。
- source_word: ἅρπαξιν
  choice: 人のものを奪う者たち
  rationale: 力や搾取によって他者から奪い取る者という幅を保つため、「詐欺師」など一つの手段に限定しない表現とした。
- source_word: εἰδωλολάτραις
  choice: 偶像を礼拝する者たち
  rationale: 「偶像礼拝者」よりも行為内容が直ちに分かる、平明で正確な表現とした。
- source_word: ἐπεὶ
  choice: もしそうなら
  rationale: 先の言葉を絶対的に理解した場合に生じる帰結を導く論理を、自然な日本語で示した。
- source_word: ὠφείλετε
  choice: 出て行かなければならないことになります
  rationale: 形態上は未完了過去だが、この反実的・条件的な論証では実際上の必要を表すため、その含意を日本語で明示した。
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: この世から出て行く
  rationale: 社会のすべての該当者を避けるなら世界そのものを去るほかない、という意図的に強い表現を保った。
theological_decisions:
- issue: 周囲の文脈で命じられている交際断絶の範囲
  choice: 以前の指示は、この世の不道徳な人々すべてとの交際を断つ意味ではない
  alternative: 不道徳な人すべてから完全に社会的に離れるよう命じている
  rationale: この節は、そうした絶対的理解なら「この世から出て行く」必要があるとして退けている。教会外の人々との全面的断絶を訳文に持ち込まず、本文の限定を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、品位を保ちながら過度に教会用語へ依存しない表現とした。前節から続く省略構文は「それは」と「付き合わない」を補って独立した節として理解できるようにした。列挙の構造と、後半の意図的に強い帰結を保持した。
