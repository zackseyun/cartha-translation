source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: ja
  text: そのような者を、肉の滅び[a]のためにサタンに引き渡しなさい。そうして、主[b]の日に霊が救われるようにするのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「肉の破滅のために」。この句は、身体に対する厳しい裁きを指すとも、その人の肉的・罪深いあり方が滅ぼされることを指すとも考えられます。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては「私たちの主イエスの日」または「主イエスの日」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: 引き渡す
  rationale: 共同体が取るべき処置を表す不定詞。対象をある者の支配や領域に渡すという原語の力を、自然な現代日本語で保つ。
- source_word: τὸν τοιοῦτον
  choice: そのような者
  rationale: 特定の違反者を指しつつ、その行為ゆえに類型化する原文の含みを保つ。「男」と補わなくても文脈上の指示は明確である。
- source_word: τῷ Σατανᾷ
  choice: サタンに
  rationale: 固有名を日本語で定着した形に音写し、与格が示す引き渡し先を「に」で表す。
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: 肉の滅びのために
  rationale: ὄλεθροςの深刻な「滅び・破滅」を表しながら、身体的な裁きか、肉的・罪深いあり方の滅却かを本文で限定しない。εἰςの目的・結果の含みは「ために」で表した。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的ないし意図された結果を導く接続詞の働きを、前文との関係が明瞭な日本語で示す。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: 原文に明示されていない所有語「彼の」を補わず、定冠詞付きの名詞を簡潔に訳して指示対象の余地を保つ。
- source_word: σωθῇ
  choice: 救われる
  rationale: 受動態の救済表現を保つ。ἵναに伴う接続法の目的性は日本語の「ため」で表されるため、不自然な可能表現は加えない。
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: 主の日に
  rationale: 終末的な時を表す定着した自然な表現。底本どおりκυρίουだけを「主」とし、「イエス」などを本文に補わない。
theological_decisions:
- issue: 「肉の滅び」の意味
  choice: 本文では「肉の滅び」とし、意味を一つに限定しない。
  alternative: 身体への厳しい裁きまたは死／罪深く肉的な志向の滅却
  rationale: σάρξとὄλεθροςの組み合わせは身体的意味にも倫理的・比喩的意味にも理解され得る。原文が残す厳しさと曖昧さを保持する。
- issue: 「霊」の指示対象
  choice: 「彼の」を補わず「霊」とする。
  alternative: 彼の霊
  rationale: 文脈上は違反者の究極的救いが強く示唆されるが、ギリシャ語に所有代名詞はないため、本文では明示化しない。
- issue: 「主の日」の本文形
  choice: 底本の「主」のみを訳す。
  alternative: 私たちの主イエスの日／主イエスの日
  rationale: 異読には拡張形があるが、指定されたSBLGNT本文はτοῦ κυρίουである。異読は脚注に示し、本文を調和的に拡張しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、教会による厳粛な処置と終末的救いを語る原文にふさわしい格調を保った。「肉」「霊」「主の日」という神学的に重要な語は説明的に言い換えすぎず、原文の対照と解釈上の緊張を残した。
