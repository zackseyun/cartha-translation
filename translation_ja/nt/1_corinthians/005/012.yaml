  source_fidelity: 原文の二つの修辞疑問を保ち、τί γάρ μοι ... κρίνειν を「…私に何の関係があるでしょうか」と自然に表している。τοὺς ἔξω／τοὺς ἔσω の共同体内外の対照、および二度の κρίνειν の対応も明確である。後半を「あなたがたが裁くのは…ではありませんか」としたことで、οὐχὶ が期待する肯定的な答えと、強調された ὑμεῖς を適切に反映している。
  naturalness: 明瞭な現代標準日本語であり、修辞的でやや厳粛な文体も文脈に合っている。「そもそも」は前段を受ける γάρ の論述上のつながりを自然に示す範囲にある。
  terminology: 「裁く」はこの節の共同体規律に関する κρίνω を過度に限定せずに訳せている。「外の人々」と「中にいる人々」は対照として分かりやすく、注[b]は「中」が教会共同体の内側をいうことを簡潔に補っている。特定の教派的解釈は加えていない。
