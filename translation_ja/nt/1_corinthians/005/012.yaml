id: 1CO.5.12
reference: 1 Corinthians 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: ja
  text: そもそも、外の人々を裁くことは、私に何の関係があるでしょうか。[a] あなたがたが裁くのは、中にいる人々ではありませんか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「外の人々を裁くことに、私は何の関わりがあるでしょうか。」
    reason: lexical_alternative
  - marker: b
    text: 「中にいる人々」とは、教会共同体の内にいる人々のこと。
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: そもそも、……私に何の関係があるでしょうか
  rationale: τί … μοι は、その事柄が話者に何の関わりを持つのかを問う慣用表現。γάρ は直前の議論を受けるため、ここでは自然な論述のつながりを示す「そもそも」とした。修辞疑問の力を保ちつつ、現代日本語として明瞭にした。
- source_word: τοὺς ἔξω
  choice: 外の人々
  rationale: 冠詞を伴う ἔξω は、単なる物理的位置ではなく共同体の外にいる人々を指す。「部外者」より中立的で、後半の「中にいる人々」との対照も明確である。
- source_word: κρίνειν / κρίνετε
  choice: 裁く
  rationale: 文脈では共同体の規律に関わる判断を表す。「裁く」は語の幅と厳粛さを保ち、「評価する」よりも文脈上の重みを適切に伝える。
- source_word: οὐχὶ
  choice: ……ではありませんか
  rationale: 肯定の答えを予期する修辞疑問として訳した。現代標準日本語で自然であり、原文の問いかけの形を保持する。
- source_word: τοὺς ἔσω
  choice: 中にいる人々
  rationale: 教会共同体の内側にいる人々を指し、「外の人々」と対応する。本文だけで意味を狭く説明しすぎず、共同体についての注釈を付した。
- source_word: ὑμεῖς κρίνετε
  choice: あなたがたが裁くのは
  rationale: 強調された主語 ὑμεῖς を明示した。現在直説法には事実の記述と文脈上の責務の含みがあり得るため、「裁くべき」と断定せず、修辞疑問そのものに期待される責任を担わせた。
theological_decisions:
- issue: 裁きの対象を教会共同体の内外として理解するか
  choice: 「外の人々」と「中にいる人々」の対照をそのまま示し、共同体内部の裁きに焦点を置く
  alternative: あらゆる道徳的判断一般についての禁止または許可と読む
  rationale: 第一コリント5章9～13節の文脈は共同体の規律を扱っている。訳文は内外の対照を保持しつつ、非信者に関するあらゆる道徳的識別を論じる一般命題へ拡張しない。
- issue: ὑμεῖς κρίνετε の直説法に責務の意味を明示するか
  choice: 「あなたがたが裁くのは」と訳し、記述と責務の両方の含みを残す
  alternative: 「あなたがたが裁くべきなのは」として義務を明示する
  rationale: 周辺文脈には共同体の責任が認められるが、原文は形態上現在直説法である。日本語でも修辞疑問によって責務を十分に示しながら、文法上の曖昧さを不必要に解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの修辞疑問と厳粛な論調を保持した。「外／中」という原文の共同体的対照を見える形で残し、特定教派の用語や解釈は加えていない。
