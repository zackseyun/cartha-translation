source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: ja
  text: 古いパン種をすっかり取り除きなさい。あなたがたがパン種のない者であるのと同じように、新しい練り粉のかたまりとなるためです。というのも、私たちの過越のいけにえであるメシアが、ほふられたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「私たちの過越がほふられた、メシアが」または「メシアである私たちの過越がほふられた」となる。「過越」はここでは過越のいけにえを指すと理解できる。
    reason: 「いけにえ」は原文に明示されていない補足であり、原文末尾のΧριστόςと「私たちの過越」の同格関係には構文上の含みがあるため。
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: すっかり取り除きなさい
  rationale: アオリスト能動命令法の強い命令を、「すっかり」によって徹底的な除去として自然な現代日本語で表した。
- source_word: παλαιὰν ζύμην
  choice: 古いパン種
  rationale: 過越と種なしパンの比喩を保つため、「酵母」ではなく聖書的にも一般に理解可能な「パン種」とした。
- source_word: ἵνα ἦτε νέον φύραμα
  choice: そうすれば、あなたがたは新しい練り粉のかたまりになります
  rationale: ἵναの目的・結果の含みと、φύραμαのパン作りの比喩を保った。「新しいひとかたまり」だけでは何の塊か不明瞭なので「練り粉」を補った。
- source_word: καθώς ἐστε ἄζυμοι
  choice: 事実、あなたがたはパン種の入っていない者なのです
  rationale: καθώςは比較とも根拠提示とも取り得るが、命令と既存の身分との緊張が日本語で明瞭になるよう文脈上の根拠として表現した。比喩は説明しすぎず保持した。
- source_word: τὸ πάσχα ἡμῶν
  choice: 私たちの過越のいけにえ
  rationale: 原文は直訳すれば「私たちの過越」だが、θύωの受動形と過越の文脈から犠牲を指す。「小羊」に限定せず、原文の意味範囲を保つため「いけにえ」とした。
- source_word: ἐτύθη
  choice: すでにほふられた
  rationale: θύωが表す祭儀的な屠殺を「ほふられた」で保持した。「すでに」はアオリストそのものの時制変換ではなく、完了した救済史的出来事として文脈上自然に示す語である。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは過越のいけにえとの同定において称号性が明瞭なため、「キリスト」ではなく「メシア」とした。
theological_decisions:
- issue: 命令と「パン種の入っていない者」という現状の緊張
  choice: 「取り除きなさい……事実、あなたがたは……者なのです」
  alternative: 「取り除きなさい……そのとおり、あなたがたは種なしなのです」
  rationale: 共同体に現実の清めを命じながら、同時に既に与えられた身分を宣言する原文の神学的緊張を解消せずに残した。
- issue: τὸ πάσχα ἡμῶνとメシアの関係
  choice: 私たちの過越のいけにえであるメシア
  alternative: 私たちの過越であるメシア／私たちの過越の小羊であるメシア
  rationale: 「過越」だけでは現代日本語で犠牲としての指示対象が不透明になりやすい。一方、「小羊」は文脈上妥当でも原文に明示されないため、より広い「いけにえ」を採用した。
- issue: Χριστόςの称号性
  choice: メシア
  alternative: キリスト
  rationale: 過越というユダヤ的・救済史的文脈で称号として機能していることを明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ほふる」はやや文語的だが、祭儀的な屠殺という原語の意味と聖書文脈を簡潔に伝えるため採用した。パン作りと過越の連続した比喩を保持し、教派固有の解釈は加えていない。
