  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: ja
  text: すべての兄弟たち[a]が、あなたがたにあいさつを送っています。聖なる口づけをもって[b]、互いにあいさつを交わしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての兄弟姉妹が」とも訳せる。「兄弟たち」は、信仰を同じくする男女をまとめて指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「聖なる口づけ」は、信徒同士の聖さと交わりを表す、当時のあいさつの習慣。
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: よろしくと言っています
  rationale: 手紙の結びにおいて、離れた相手へのあいさつを伝える表現であるため、現代日本語として自然な言い方にした。後半の相互のあいさつとは場面が異なるので、機械的に同じ訳語にはしない。
- source_word: οἱ ἀδελφοὶ πάντες
  choice: すべての兄弟たち
  rationale: 文法上の男性複数形を本文に保つ。ただし、ἀδελφοίは信仰共同体の仲間を男女を含めて指すことがあるため、その可能性を脚注に示す。
- source_word: ἀσπάσασθε
  choice: あいさつを交わしなさい
  rationale: 相互代名詞ἀλλήλουςとともに用いられており、一方的に声をかけるよりも、互いにあいさつする行為を自然に表す。アオリスト命令の直接性を保つ。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 相互性を明確かつ簡潔に表す標準的な現代日本語。
- source_word: ἐν φιλήματι ἁγίῳ
  choice: 聖なる口づけをもって
  rationale: ἐνの手段・様態と、φίλημαの身体的なあいさつ、ἅγιοςの共同体にふさわしい聖性を保持する。『口づけ』は『接吻』より自然で、品位ある聖書文体に適する。
theological_decisions:
- issue: 会衆への呼称としてのἀδελφοί
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信徒の仲間たち
  rationale: 原文の男性複数形を本文で見えるようにしつつ、初期キリスト教の会衆を指す場合には男女を含み得るという語義上の幅を脚注で保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、書簡の結語にふさわしい品位を保った。前半は日本語の手紙表現として自然な「よろしくと言っています」、後半は相互性を明示する「あいさつを交わしなさい」とした。脚注記号は、対象語句または文の直後に置いた。
