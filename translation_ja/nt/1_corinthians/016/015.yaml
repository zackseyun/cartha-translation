source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: ja
  text: 兄弟たち[a]、お願いします。ステファナの一家がアカイアの初穂[b]であり、聖なる人々に仕える働きに自ら進んで身をささげてきたことを、あなたがたは知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、会衆全体を含む呼びかけとして用いられることがある。
    reason: lexical_alternative
  - marker: b
    text: 「初穂」は、アカイアで最初期に信者となった人々を指すと考えられるが、神にささげられた最初の実りという比喩も保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: お願いします
  rationale: 単なる依頼より強い真剣な訴えを表すが、後続の16節へ続く文脈において、現代日本語で自然かつ品位ある勧告表現とした。
- source_word: δὲ
  choice: 独立した語としては訳出しない
  rationale: 弱い談話上の移行を示す。日本語では呼びかけと文の区切りによって自然に表せるため、「さて」などを機械的に補わない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を保持する。会衆全体を含み得る呼びかけであることは脚注で明示する。
- source_word: οἴδατε
  choice: 知っています
  rationale: 完了形だが現在の状態を表し、平明な日本語では「知っています」が自然である。
- source_word: τὴν οἰκίαν Στεφανᾶ
  choice: ステファナの家の者たち
  rationale: 建物そのものではなく家族や同居者を含む共同体を指すため、「一家」より意味を取りやすい表現とした。
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: アカイアの初穂
  rationale: 最初期の信者という時間的意味に加え、神にささげられる最初の実りという比喩的含意を保持する。
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: 聖なる者たちに仕えることに
  rationale: διακονίαを後代の教会職制に限定せず、信徒への具体的な奉仕を表す動詞的で自然な日本語にした。
- source_word: ἔταξαν ἑαυτούς
  choice: 自らをささげました
  rationale: 公的役職への自己任命ではなく、奉仕へ意図的かつ継続的に身を置いたことを表す。
theological_decisions:
- issue: ἀδελφοίの会衆への呼びかけ
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／皆さん
  rationale: 原文の形を本文に残しつつ、男女を含む会衆全体への慣用的呼称になり得ることを脚注で説明し、範囲を不必要に限定しない。
- issue: ἀπαρχὴ τῆς Ἀχαΐαςの比喩
  choice: アカイアの初穂
  alternative: アカイアで最初に信者となった人々
  rationale: 時間的な先行性だけに解消せず、神に属する最初の実りという可能な奉献的含意を保つ。
- issue: τοῖς ἁγίοιςの指示対象
  choice: 聖なる者たち
  alternative: 聖徒たち／神の民
  rationale: パウロが信者を神に属する者として呼ぶ語義を透明に示し、特別に卓越した一部の信者だけを指すとの誤解を避ける。
translation_notes:
  register: 明瞭な現代標準日本語。原文は16節まで続く構文だが、本節単独でも理解できるよう文を区切った。呼びかけには原文の形を残し、曖昧さや包含範囲は脚注で補った。
