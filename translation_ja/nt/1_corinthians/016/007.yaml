  source_fidelity: 「立ち寄って会うだけにはしたくありません」は、ἐν παρόδῳ（通りがかりに／途中で）の一時的な訪問という意味をおおむね伝えている。しかし「今」が「立ち寄って」に係るようにも読め、原文の「今は…会いたくない」という構造がやや不明瞭である。また、ἐπιμεῖναι は滞在し続けることなので、「一緒に過ごす」より「滞在する」がより直接的である。
  naturalness: 現行文は自然だが、「立ち寄って会うだけにはしたくありません」は少し回りくどく、「今は、通りがかりにあなたがたに会いたいとは思いません」のほうが原文の対比と書簡文としての自然さを保つ。
  terminology: 「主」は κύριος の指示対象を限定せず、適切である。「主がお許しになるなら」も自然で、神学的な含意を過度に解釈していない。
