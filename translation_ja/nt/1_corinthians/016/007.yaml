source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: ja
  text: 今は、通りがかりにあなたがたに会いたいとは思いません。主がお許しになるなら、しばらくあなたがたのもとに滞在したいと望んでいるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ θέλω
  choice: したくありません
  rationale: 強い拒絶ではなく、パウロ自身の願いと意向を自然な現代日本語で表す。
- source_word: ἄρτι
  choice: 今
  rationale: 現在の時点・今回の状況を簡潔に示す。
- source_word: ἐν παρόδῳ
  choice: 立ち寄って…だけ
  rationale: 旅の途中で短時間訪れるという句の意味を、文脈に自然な日本語で表した。
- source_word: ἰδεῖν
  choice: 会う
  rationale: 字義は「見る」だが、人を訪ねて対面する文脈では「会う」が自然であり、意味を過不足なく伝える。
- source_word: ἐλπίζω
  choice: 願っている
  rationale: 確定ではない期待と希望を示す。後続の条件節とも自然につながる。
- source_word: χρόνον τινά
  choice: しばらく
  rationale: 長さの定まらない、ある程度の期間を自然な日本語で示す。
- source_word: ἐπιμεῖναι
  choice: 一緒に過ごしたい
  rationale: 単に滞在するだけでなく、相手のもとにとどまる意図を現代日本語で明瞭に伝える。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたと一緒に
  rationale: 人を目的語とする πρὸς と滞在動詞の組み合わせを、交わりを含む自然な日本語にした。
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: 主がお許しになるなら
  rationale: 主の許しに依存する条件を、敬意ある自然な表現で保持する。
- source_word: κύριος
  choice: 主
  rationale: 指示対象を本文以上に限定せず、標準的な聖書用語で訳す。
theological_decisions:
- issue: 「主」の指示対象
  choice: 「主」とだけ訳し、指示対象を特定しない
  alternative: 「主イエス」または「神」
  rationale: ギリシア語本文は κύριος とだけ記しているため、イエスか父なる神かを訳文で明示せず、原文の開かれた表現を保つ。
translation_notes:
  register: 明瞭で現代的ながら、書簡としての落ち着きと品位を保った。「立ち寄って会うだけ」で短い通過訪問という意味を本文内に明示できるため、脚注は設けていない。
