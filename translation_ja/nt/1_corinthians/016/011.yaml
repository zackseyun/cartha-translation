  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: ja
  text: ですから、だれも彼を軽んじてはなりません。彼を平安のうちに送り出してください。彼が私のもとに来られるように。私は兄弟たち[a]とともに彼を待っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。この語は、私とともに彼を待っている信徒または同労者からなる、より広い一団を指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: ですから、だれも…てはなりません
  rationale: οὖνの推論的なつながりと、μή＋アオリスト接続法による禁止を、自然な現代日本語で表した。
- source_word: ἐξουθενήσῃ
  choice: 軽んじて
  rationale: 「価値のない者とみなす、侮る」という意味を持つ。文脈ではテモテを見下して不当に扱うことへの警告であり、「軽んじる」が明瞭で格調も保つ。
- source_word: προπέμψατε
  choice: 旅立てるように送り出してください
  rationale: 単に出発させるだけでなく、旅の継続に必要な見送りや援助をする含みを表した。
- source_word: ἐν εἰρήνῃ
  choice: 安心して
  rationale: 字義的には「平安のうちに」。ここでは争いや妨害を受けず、友好的な支援のもとで出発する意味が自然に伝わる表現を選んだ。
- source_word: ἵνα ἔλθῃ πρός με
  choice: 彼が私のもとに来られるよう
  rationale: ἵνα＋接続法の目的を明示した。
- source_word: ἐκδέχομαι
  choice: 待っています
  rationale: 継続して到着を待ち受けていることを、自然な日本語で表した。期待の含みも文脈から伝わる。
- source_word: μετὰ τῶν ἀδελφῶν
  choice: 兄弟たちとともに
  rationale: μετάを「とともに」、男性複数形ἀδελφῶνを本文では「兄弟たち」と訳し、指示対象が男女を含む可能性は脚注に残した。
theological_decisions:
- issue: μετὰ τῶν ἀδελφῶν の係り方
  choice: 「私は兄弟たちとともに彼を待っています」
  alternative: 「私は彼が兄弟たちと一緒に来るのを待っています」
  rationale: 語順上も通常の統語理解でも、μετὰ τῶν ἀδελφῶνはἐκδέχομαιの主語側、すなわちパウロとともに待つ人々を表すと読むのが自然である。もっとも、ギリシア語の配置だけでは別の係り方を完全には排除できないため、代案を記録した。
- issue: ἀδελφῶνが男女を含む信徒・同労者集団を指す可能性
  choice: 本文では「兄弟たち」
  alternative: 「兄弟姉妹たち」または「仲間の信者たち」
  rationale: 原語は男性複数形であるため本文では形式を保った。一方、この語は文脈により男女を含む信徒または同労者一般を指し得るので、その可能性を脚注で明示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、使徒的勧告にふさわしい端正さを保った。「安心して旅立てるように」はἐν εἰρήνῃとπροπέμψατεを日本語として一体的に表現している。
