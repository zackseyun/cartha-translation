reference: 1 Corinthians 16:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: ja
  text: アジア州の諸教会が、あなたがたにあいさつを送っています。[a] アキラとプリスカは、彼らの家にある教会とともに、主にあってあなたがたに心からあいさつを送っています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「アジア州」は、現在のアジア大陸ではなく、小アジア西部にあったローマ帝国の属州を指す。
    reason: cultural_note
  - marker: b
    text: ギリシア語本文では「プリスカ」。ほかの箇所では「プリスキラ」とも呼ばれている（使徒18章2、18、26節、ローマ16章3節など）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: よろしくと伝えています
  rationale: 書簡の結びにおけるἀσπάζομαιは、離れた相手への挨拶を託す意味なので、現代日本語として自然な「よろしくと伝えています」とした。
- source_word: αἱ ἐκκλησίαι
  choice: 諸教会
  rationale: パウロ書簡における複数の地域的なキリスト者共同体を、簡潔で定着した表現にした。
- source_word: τῆς Ἀσίας
  choice: アジア州
  rationale: ここでのἈσίαは現代の大陸ではなくローマ属州を指すため、本文でも誤解を避けられるよう「州」を補った。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: キリスト者としての交わりと、その挨拶が成り立つ領域の双方を保つ、パウロ的表現として訳した。
- source_word: πολλὰ
  choice: 心から
  rationale: ἀσπάζεταιを強める副詞的対格であり、直訳的な「多く」は不自然なので、挨拶の強い親愛を自然に表した。
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: アキラとプリスカ
  rationale: 本文の固有名詞を音写し、Πρίσκαの短い語形をそのまま反映した。
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: 彼らの家にある教会とともに
  rationale: 家庭に集う地域教会を指す表現だが、「集う」を本文に明示せず、原文の簡潔さを保った。
theological_decisions:
- issue: 家庭内のἐκκλησίαの意味
  choice: 「彼らの家にある教会」とし、家庭を場所とするキリスト者共同体を表す
  alternative: 「彼らの家に集まる教会」または「家の教会」
  rationale: 単なる家族ではなく地域的な信徒の集まりを指すのが自然である一方、原文が明示しない「集まる」を本文で補わないようにした。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: パウロの定型句ἐν κυρίῳが持つ信仰告白的・関係的な響きを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、書簡末尾の挨拶として自然でありながら品位のある文体とした。「主にあって」は神学的含意を保持するため定着した表現を採用した。
