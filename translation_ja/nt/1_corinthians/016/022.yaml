  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: ja
  text: 主を愛さない者がいるなら、その者は呪われよ。[a] マラナ・タ。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の呪いのもとにあれ」。伝統的な音写では「アナテマ」。
    reason: lexical_alternative
  - marker: b
    text: アラム語。「私たちの主よ、来てください」、または「私たちの主は来られた」の意とも考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: 愛さない
  rationale: φιλέωがここで表す主への個人的な愛を、自然で過不足のない現代日本語で示す。感情的な親愛だけに狭めない。
- source_word: κύριον
  choice: 主
  rationale: パウロ書簡においてイエスを指す称号としての重みと、新約聖書で確立した用法を保つ。
- source_word: ἤτω
  choice: その者は…よ
  rationale: εἰμίの現在命令形が持つ命令・宣告的な力を、厳粛な日本語の願望命令で表す。
- source_word: ἀνάθεμα
  choice: 呪われ
  rationale: 神の呪いのもとに置かれるという厳しい司法的・宗教的意味を、現代の読者に直接理解できる語で表す。
- source_word: Μαράνα θά
  choice: マラナ・タ
  rationale: ギリシア文字で保存されたアラム語句であり、語の区切りと意味に議論があるため、本文では音写して曖昧さと典礼的な響きを保つ。
theological_decisions:
- issue: アラム語表現 Μαράνα θά の意味
  choice: 本文では「マラナ・タ」と音写する。
  alternative: 「私たちの主よ、来てください」または「私たちの主は来られた」
  rationale: アラム語の分かち方によって解釈が異なり得る。本文で一つに決めず、主要な理解を脚注に示すことで原文の真正な曖昧さを保つ。
- issue: ἀνάθεμα の宣告の強さ
  choice: 「呪われよ」とする。
  alternative: 「神の呪いのもとにあれ」または伝統的音写「アナテマ」
  rationale: 原文の厳粛な命令・宣告の力を弱めず、同時に特定の教派的な破門制度へ限定しない。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、警告の厳粛さを保つ。「者」は性別を限定せず、条件文の一般性を表す。アラム語句は中黒を用いて読みやすく音写した。
