source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: ja
  text: もしテモテがあなたがたのところに来るなら、彼があなたがたのもとに恐れることなくいられるように、心を配ってください[a]。彼は私と同じように、主の働きをしているのですから[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼があなたがたのもとで恐れることなくいられるように、注意しなさい」。
    reason: ギリシア語の「いる・その状態になる」という表現と命令の語感を示すため。
  - marker: b
    text: 直訳に近くは「彼は、私もそうであるように、主の働きを行っているからです」。
    reason: 原文では「働き」と「行う」に当たる同語根の語が用いられ、「私も」という比較が添えられているため。
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: もしテモテがそちらに行ったなら
  rationale: ἐάν＋接続法の将来的な条件を「もし…なら」で表した。話者パウロからコリントへの移動なので、日本語では「来る」より「そちらに行く」が自然である。δέの軽い移行は、文脈上不自然な逆接を加えずに処理した。
- source_word: βλέπετε ἵνα
  choice: …よう、心を配ってください
  rationale: 命令形βλέπετεが求める積極的な配慮と、ἵνα節の目的・結果を、明瞭で牧会的な現代日本語にした。
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: 彼があなたがたの間で恐れることなく過ごせる
  rationale: γένηται πρὸς ὑμᾶςが表す、彼らのもとにいる状態を「間で…過ごす」とした。ἀφόβωςは心理状態だけに狭めず「恐れることなく」とした。
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: 主の働きに携わっている
  rationale: 同語根のἔργον／ἐργάζεταιを逐語的に重ねる不自然さを避けつつ、継続的に主の働きを行っている意味を保持した。γάρは理由を示す「のです」によって自然に表した。
- source_word: ὡς κἀγώ
  choice: 私と同じように
  rationale: καὶ ἐγώの「私も」を含む比較を自然に表し、テモテの働きがパウロ自身の働きと同列に置かれていることを保持した。
theological_decisions:
- issue: κυρίουにおける「主」の指示対象
  choice: 「主」と訳し、本文中で指示対象を特定しない
  alternative: 「主イエス」と明示する
  rationale: パウロ書簡ではイエスを指す可能性が高いが、ギリシア語本文はκυρίουとのみ記すため、その表現を保持した。
- issue: パウロとテモテの働きの関係
  choice: 「私と同じように、主の働きに携わっている」
  alternative: テモテがパウロと同じ権威を持つと明示する
  rationale: ὡς κἀγώは両者が同じ主の働きをしていることを述べるが、職務や権威の完全な同一性までは明示しないため、それ以上を補わなかった。
translation_notes:
  register: 明瞭で dignified な現代標準語。共同体に対する命令は高圧的にせず「心を配ってください」とし、テモテを恐れさせないよう具体的な受け入れを求める調子を保った。
