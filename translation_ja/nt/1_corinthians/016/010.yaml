  - severity: low
    issue: 「過ごせる」の可能表現
    rationale: γένηταιは、彼らのもとで恐れなくいる状態になることを指す。「過ごせる」は能力や許可の含みを帯びうるため、「いられるように」のほうが原文の状態表現により近い。
  - severity: low
    issue: 理由節を独立文にしている
    rationale: γάρは「心を配る」命令の理由である。日本語でも「…ください。彼も…です」と二文に分けるより、「…ください。彼は…しているのですから」または一文にまとめるほうが論理関係が明瞭になる。
