  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: ja
  text: さて、私はマケドニアを通ってから[a]、あなたがたのところへ行きます。私はマケドニアを通って行くのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「マケドニアを通るとき」。ギリシア語は未来の時点における一まとまりの通過を表し、コリント訪問に先立つ完了を含意し得る。
    reason: 時制・アスペクト上の別訳
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: 行きます
  rationale: 未来の訪問意図を表す。日本語では、話し手が受け手の所在地へ向かう場合、「来ます」より「あなたがたのところへ行きます」のほうが自然である。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、直前の話題から旅行計画へ移る穏やかな転換を表す。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのところへ
  rationale: 移動動詞とともに、複数の受け手のもとへ向かうことを自然な日本語で示す。
- source_word: ὅταν ... διέλθω
  choice: 通り抜けた後
  rationale: 未来の時を示すὅτανとアオリスト接続法の組み合わせを、コリント訪問に先立ってマケドニア通過が一区切りつくという意味に訳した。別の自然な捉え方は脚注に示した。
- source_word: Μακεδονίαν
  choice: マケドニア
  rationale: 地域名の標準的な日本語表記を用いた。
- source_word: γὰρ
  choice: からです
  rationale: 訪問時期について述べた理由を説明する接続関係を明確に表す。
- source_word: διέρχομαι
  choice: 通って行くことにしている
  rationale: 現在形が表し得る、定まった旅程・意図を自然な日本語で示し、前半のアオリスト接続法との違いも保った。
