  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: ja
  text: 私の愛が、メシアであるイエス[a]にあって、あなたがた皆と共にありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「キリスト・イエス」。ギリシア語Χριστόςは、「メシア」とも、伝統的には「キリスト」とも訳される称号である。
    reason: 称号Χριστόςの意味訳と伝統的な別訳を示すため。
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: 私の愛
  rationale: 定冠詞を伴う「愛」と一人称属格を、パウロ自身の愛情を明確に示す自然な日本語で表した。
- source_word: μετὰ πάντων ὑμῶν
  choice: あなたがたすべてと共にありますように
  rationale: μετά＋属格の「共に」を保ち、πάντωνの包括性を「すべて」で明示した。原文は動詞を欠くが、書簡末尾の祈願として「ありますように」を補った。
- source_word: ἐν
  choice: にあって
  rationale: パウロ書簡に特徴的な、メシアとの結びつき・その領域を示す表現を、過度に解釈せず日本語の聖書文体として明瞭に保った。
- source_word: Χριστῷ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を訳し、Ἰησοῦは固有名として表した。「メシア・イエス」よりも現代日本語で関係が分かりやすい。
theological_decisions:
- issue: ἐν Χριστῷ ἸησοῦにおけるΧριστόςの訳し方
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςが持つ「油注がれた者」という称号性を「メシア」で示した。一方、伝統的な音写「キリスト・イエス」も可能なので脚注に掲げた。
- issue: 動詞のない結語を祈願として表すか、事実の叙述として表すか
  choice: ありますように
  alternative: あります
  rationale: 原文には動詞がなく両方の補い方が文法上考えられるが、書簡末尾の祝福・祈願という文脈に即して願望表現とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、書簡末尾の祈願にふさわしい端正さを保った。「にあって」はパウロ特有の表現が持つ含みを残すため維持した。
