  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: ja
  text: そして、私はたぶんあなたがたのもとに滞在するか、あるいは冬を越すことにもなるかもしれません。それは、私がどこへ行くとしても、あなたがたに私を送り出してもらうためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「送り出す」と訳したギリシア語には、出発する旅人を見送ること、途中まで同行すること、また旅に必要な援助をすることが含まれ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのもとに
  rationale: 滞在を表す動詞とともに用いられ、コリントの信徒たちと同じ場所で過ごす意味を自然な日本語で示す。
- source_word: δὲ
  choice: そして
  rationale: 強い対立ではなく、直前から旅行計画の説明を続ける穏やかな接続を表す。
- source_word: τυχὸν
  choice: たぶん
  rationale: 計画が未確定であるという可能性を、簡潔で自然な現代日本語で表す。
- source_word: παραμενῶ
  choice: しばらく滞在し
  rationale: 「とどまる、滞在し続ける」の意味を旅行の文脈に即して表す。文脈上の一定期間を自然に示すため「しばらく」を添えた。
- source_word: ἢ καὶ
  choice: あるいは…さえ
  rationale: 第二の可能性が、単なる滞在より長期に及ぶことを強調する語感を保つ。
- source_word: παραχειμάσω
  choice: 冬を越す
  rationale: ある場所で冬の期間を過ごすという動詞の具体的意味を簡潔に表す。
- source_word: ἵνα
  choice: そうすれば
  rationale: 滞在の目的またはその結果として期待される旅立ちの支援を、文脈に自然な形で示す。
- source_word: προπέμψητε
  choice: 旅立ちを助けてもらえます
  rationale: 見送り、同行、旅に必要な援助を含み得る旅行文脈上の幅を保ち、単なる「送り出す」より広い意味を示す。
- source_word: οὗ ἐὰν πορεύωμαι
  choice: 私がどこへ行くにしても
  rationale: 目的地がまだ定まっていないことと、将来の不確定性を自然な日本語で表す。
