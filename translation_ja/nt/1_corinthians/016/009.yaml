  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: ja
  text: というのも、私のために大きな、実り豊かな門が開かれているからです[a]。また、反対する者も大勢います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私に大きく実り多い機会が開かれているからです」。パウロは、働きの機会を「門」にたとえています。
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: 門
  rationale: 文字どおりの「門」を残し、働きの機会を表すパウロの比喩を保持した。「機会」とすると意味は明瞭になるが、原文の具体的なイメージが失われるため、脚注に示した。
- source_word: γάρ
  choice: というのも……からです
  rationale: 直前に述べられた滞在予定の理由を示す接続関係を、現代日本語で自然に表した。
- source_word: μοι
  choice: 私のために
  rationale: 与格が示すパウロとの個人的な関係または利益を表した。「私の前に」も文脈上可能だが、原文には「前に」に当たる語がない。
- source_word: ἀνέῳγεν
  choice: 開かれている
  rationale: 完了形の結果として現在も開いた状態にあることを表し、受動の形も保った。行為者は原文どおり明示しない。
- source_word: μεγάλη
  choice: 大きく
  rationale: 門の規模と、比喩的には機会の重要性・広がりの双方を含み得る簡潔な表現とした。
- source_word: ἐνεργής
  choice: 実りをもたらす
  rationale: この文脈で、活発に働き、成果を生む可能性があることを自然な日本語で表した。「有効な門」は直訳的だが、日本語として不自然になりやすい。
- source_word: ἀντικείμενοι
  choice: 反対する者
  rationale: 実体詞的に用いられた分詞を、パウロとその働きに対抗する人々として簡潔に訳した。「敵対者」ほど強い敵意を決めつけない。
- source_word: πολλοί
  choice: 大勢
  rationale: 人数が多いことを、人物を受ける自然な現代日本語で表した。
theological_decisions:
- issue: 宣教や奉仕の機会を表す「門」の比喩
  choice: 本文では「門」という比喩を保持する。
  alternative: 「大きく実り多い機会が私に開かれている」
  rationale: 原文は機会の意味を含意するが、明示的には「門」と述べている。比喩を残すことで、神学的・文学的含意を訳文側で一義的に限定しない。
- issue: 開いた門と多くの反対者との関係
  choice: 両者をそのまま並置し、「しかも」で後者を加える。
  alternative: 反対者が多いにもかかわらず門が開かれている、と逆接関係を明示する。
  rationale: 原文の接続詞は καί であり、逆接を明示していない。宣教の好機と反対が同時に存在する緊張を、説明によって解消せず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい落ち着いた丁寧体とした。「実りをもたらす」は ἐνεργής の働きと成果を表しつつ、「門」の比喩と結び付けられる自然さを優先した。
