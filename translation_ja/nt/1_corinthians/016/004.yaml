  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: ja
  text: もし私も行くことが適切なら[a]、彼らは私と一緒に行きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私も行くことがふさわしいなら」。このギリシア語表現は、状況に照らして適切なこと、ふさわしいこと、または行く価値があることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: もし……なら
  rationale: ἐὰνの条件を明確に表す。δέはここでは弱い接続であり、日本語では文脈の流れを損なわないよう独立した接続語を置かない。
- source_word: ἄξιον ᾖ
  choice: 適切なら
  rationale: 中性形を用いた非人称的表現で、パウロ自身の価値ではなく、彼も赴くことが状況に照らして適切かどうかを指す。「適切」は実際的な妥当性を自然に伝える。
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: 私も行くのが
  rationale: 冠詞付き不定詞が、何が適切かという内容を示す。κἀμέの付加的意味を「私も」で保持する。
- source_word: σὺν ἐμοὶ
  choice: 私と一緒に
  rationale: σύνと与格が示す同行を、明瞭で自然な現代日本語にする。
- source_word: πορεύσονται
  choice: 行きます
  rationale: 未来の移動を表す。先の「行く」との語の反復を保ち、「同行する」のような原文以上に限定的な語を避ける。
theological_decisions:
- issue: パウロが使節団に同行する条件の意味
  choice: パウロ自身も行くことが状況に照らして適切なら、使節たちは彼と共に行く。
  alternative: 献金がパウロの同行に値するほど重要なら、またはパウロ自身に行く資格があるなら。
  rationale: ἄξιονは非人称的に用いられ、不定詞句が適切かどうか検討される行為を示す。文脈は献金の運搬に関する実務的な判断であり、パウロの道徳的資格を述べるものではない。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「適切」はやや改まった語だが、書簡の品位を保ちつつ一般読者にも理解しやすい。敬体で統一した。
