  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: ja
  text: 兄弟であるアポロについてですが、私は、彼が兄弟たちと一緒にあなたがたのところへ行くよう強く勧めました。しかし、彼には今行く意向がまったくありませんでした[a]。けれども、よい機会があれば行くでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、彼は今行くことをまったく望みませんでした」。ギリシャ語は直訳すると「今行くことは、彼の意向ではまったくなかった」となります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: 兄弟アポロについてですが
  rationale: περὶ δέによる話題転換を自然な日本語で示す。τοῦ ἀδελφοῦには所有代名詞がないため「私たちの」を補わず、同格的に「兄弟アポロ」とした。
- source_word: πολλὰ παρεκάλεσα αὐτὸν
  choice: 私は…彼に強く勧めました
  rationale: πολλάが勧めの強さを表すため、「強く」で自然に再現した。
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: 兄弟たちと一緒にあなたがたのところへ行くよう
  rationale: 勧めの内容を「行くよう」で表し、μετὰ τῶν ἀδελφῶνは特定の同行者を指す文脈に即して「兄弟たち」とした。
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: しかし、彼には今行く意向がまったくありませんでした
  rationale: πάντωςによる否定の強調を「まったく」で示し、θέλημαの名詞性を「意向」で保った。文脈上、その意向の主体はアポロと理解するのが自然である。
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: けれども、都合のよい時が来れば行くでしょう
  rationale: δέの対照を「けれども」で表し、εὐκαιρέωを単なる気分上の都合ではなく、好機・適切な時という意味で訳した。
theological_decisions:
- issue: οὐκ ἦν θέλημαにおける意向の主体
  choice: アポロ自身の意向
  alternative: 神のみこころ、または主体を明示しない意向
  rationale: 直前から一貫してアポロが話題の中心であり、神への明示的な言及もない。神の意志と訳すことは原文にない神学的内容を加えるため避けた。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で格調を保った文体。「兄弟」はこの箇所でアポロおよび同行する男性の働き手を指す語として保持した。脚注記号は対応箇所に配置した。
