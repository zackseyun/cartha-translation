reference: 1 Corinthians 16:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: ja
  text: 彼らは、私の霊もあなたがたの霊も元気づけてくれたからです。ですから、このような人たちを認めなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「認めなさい」は、「その価値を認めなさい」「重んじなさい」とも訳せる。ギリシア語の表現は男性複数形で、ここでは直前に挙げられた男性たちを指す。
    reason: ἐπιγινώσκετε の語義の幅と、τοὺς τοιούτους の文法的性および文脈上の指示対象を示すため。
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: 元気づけてくれた
  rationale: ここでは文字どおり休ませたというより、内面に安らぎと新たな力を与えたことを表す。「元気づける」は、その比喩的な働きを自然な現代日本語で伝える。
- source_word: γὰρ
  choice: からです
  rationale: 直前の勧めの理由を示す接続辞であり、日本語では文末の「からです」で因果関係を自然に表した。
- source_word: πνεῦμα
  choice: 霊
  rationale: ここでは聖霊ではなく、人の内面的・精神的な状態を指す。パウロの表現を保つため「霊」とした。
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: 私の霊もあなたがたの霊も
  rationale: 後半で省略されている πνεῦμα を日本語では補い、双方の内面が元気づけられたという並列を明確にした。
- source_word: ἐπιγινώσκετε
  choice: 認めなさい
  rationale: 単に見分けるだけでなく、その働きや価値を正当に評価して受け入れるよう求める語。「認めなさい」は意味を過度に「尊敬」へ限定せず、この幅を保つ。
- source_word: οὖν
  choice: ですから
  rationale: 前述の事実から導かれる勧告であることを、自然な推論の接続表現で示した。
- source_word: τοὺς τοιούτους
  choice: このような人たち
  rationale: 直前に挙げられたステファナ、フォルトナト、アカイコのような者たちを指す。日本語の「人たち」は文脈上の男性指示を妨げず、現代語として自然である。
theological_decisions:
- issue: τοὺς τοιούτους の性別と指示範囲
  choice: このような人たち
  alternative: このような男性たち／このような人々
  rationale: ギリシア語は男性複数形で、直接には直前の三人の男性を指す。ただし日本語では「男性たち」と明示すると原文以上に性別を強調しかねないため、文脈上の具体的指示を保ちながら自然な「人たち」とした。脚注で男性を指すことを明示する。
- issue: πνεῦμα の解釈
  choice: 人の内面を指す「霊」
  alternative: 聖霊／心
  rationale: 所有表現「私の」「あなたがたの」と動詞の文脈から、人間の内面的状態を指す。「心」と意訳せず「霊」を残すことで、パウロの語法と意味の広がりを保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「私の霊もあなたがたの霊も」で原文の並列を保ち、「元気づけてくれた」で内面的な回復を自然に表現した。勧告は簡潔な「認めなさい」とし、語義の幅は脚注で補った。
