  terminology: 「贈り物」はこの文脈のχάρις（エルサレムへの献金・寄付）に適切である。既存の脚注は「恵み」という語義と文脈上の具体的意味を適切に示している。「エルサレム」「あなたがた」も本文の落ち着いた丁寧体に合う。
