  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: ja
  text: 私がそちらに着いたら、あなたがたが認めた人たちを、手紙を添えて[b]、あなたがたの贈り物[a]をエルサレムへ届けるために送り出します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの恵みの贈り物」。ギリシア語は「恵み」をも意味するが、ここではエルサレムへ送る献金を指す。
    reason: lexical_alternative
  - marker: b
    text: または、「あなたがたが手紙によって認めた人たちを」。ギリシア語の「手紙によって」は、「認めた」に係るとも「送り出します」に係るとも理解できる。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: 私がそちらに着いたら
  rationale: ὅτανとアオリスト接続法は将来の時点を表す。「そちら」を補うことで、コリントへの到着であることを日本語として自然に示す。δέは文脈上軽い接続なので、独立した逆接語は置かない。
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: あなたがたが認めた人たち
  rationale: δοκιμάζωには吟味して承認する含みがある。ここでは代表者の選定を指すため、「認めた」が簡潔で自然である。
- source_word: δι’ ἐπιστολῶν
  choice: 手紙を持たせ
  rationale: διά＋属格の手段を表す用法。手紙の具体的な種類は本文に明記されていないため、「推薦状」と限定せず、派遣される人々に手紙を携行させる意味を自然な日本語で表した。
- source_word: τούτους πέμψω
  choice: 送り出します
  rationale: τούτουςは先行する承認された人々を受ける。日本語では「人たち」を目的語として示した上で、πέμπωを丁寧で自然な「送り出します」とした。
- source_word: ἀπενεγκεῖν
  choice: 届けるために
  rationale: 目的を表す不定詞。贈り物をエルサレムまで運び届ける任務を明確に表す。
- source_word: τὴν χάριν ὑμῶν
  choice: あなたがたの贈り物
  rationale: 文脈上、エルサレムの聖徒たちへの献金を指す。χάριςの恵み深い行為という含みを残すため、脚注で字義に近い別訳を示す。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムへ
  rationale: 都市を到着先として示すεἰςを、自然な日本語の方向表現で訳した。
theological_decisions:
- issue: 献金の文脈におけるχάριςの意味
  choice: 具体的な贈り物
  alternative: あなたがたの恵み／恵みの贈り物
  rationale: 第一コリント16章の文脈では、エルサレムの聖徒たちのための具体的な献金を指す。ただし、χάριςが帯びる恵みや寛大さの響きを完全には消さないよう、脚注に別訳を掲げる。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、使徒の指示にふさわしい落ち着いた丁寧体を用いた。「手紙を持たせ」により、手紙が承認された使者に伴うことを曖昧にしない。
