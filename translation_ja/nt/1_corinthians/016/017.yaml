  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: ja
  text: さて、ステファナ、フォルトナト、アカイコの来訪を、私は喜んでいます。あなたがたに欠けていたものを、この人たちが補ってくれたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたが来られない分を、この人たちが補ってくれた」とも訳せる。ここでいう「欠け」は、道徳的な欠点ではなく、コリントの人々がパウロのもとに直接いられないことを指すと思われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: 私は喜んでいます
  rationale: 現在形の直接的な喜びを、現代日本語の書簡調として自然に表した。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、話題を進める穏やかな接続として訳した。
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: 来てくれたことを
  rationale: ここでの παρουσία は終末論的な専門語ではなく、三人の到着・同席を指す。喜びを伴う文脈に即して自然な表現とした。
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: ステファナ、フォルトナト、アカイコ
  rationale: 人名を日本語の標準的な音写で示した。
- source_word: ὅτι
  choice: からです
  rationale: パウロが喜ぶ理由を明確に導く。
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: あなたがたに欠けていたもの
  rationale: 直訳的な『あなたがたの不足』が道徳的非難と誤解されるのを避けつつ、ὑστέρημα の『欠けているもの』という幅を保った。文脈上は彼らの不在を指す可能性があるが、本文では限定しない。
- source_word: οὗτοι
  choice: この人たち
  rationale: 指示代名詞の強調を保ち、直前の三人を明示する自然な日本語とした。
- source_word: ἀνεπλήρωσαν
  choice: 補ってくれた
  rationale: 『欠けを満たす、補充する』という意味を保ち、パウロに対する行為として自然に表した。
theological_decisions:
- issue: 『あなたがたに欠けていたもの』が何を指すか
  choice: 本文では対象を『欠けていたもの』として開いたままにし、脚注で不在を指す可能性を示す
  alternative: 『あなたがたの不在を埋め合わせてくれた』と明示する
  rationale: ギリシア語は単に ὑστέρημα と述べ、欠けの具体的内容を明示していない。文脈上はコリントの人々が直接そこにいないことを三人が補った可能性が高いが、その解釈を本文に固定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、書簡としての落ち着きと品位を保った。『欠けていたもの』により原文の曖昧さを本文に残し、文脈上有力な解釈は脚注に置いた。
