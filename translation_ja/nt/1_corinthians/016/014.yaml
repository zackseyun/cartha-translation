  text: Let all that you do be done in love[a].
translation:
  language: ja
  text: 何事も、愛をもって行いなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたがたのすべてのことが、愛のうちになされるようにしなさい」。
    reason: πάντα ὑμῶν と ἐν ἀγάπῃ γινέσθω の語形と構文をより直接に示すため。
lexical_decisions:
- source_word: πάντα
  choice: 何事も
  rationale: 中性複数形が包括的に用いられているため、例外なくすべてを含む自然な日本語とした。
- source_word: ὑμῶν
  choice: （「行いなさい」の主語として含意）
  rationale: πάντα ὑμῶν は直訳すれば「あなたがたのすべてのこと」だが、日本語では「何事も行いなさい」とすることで、あなたがたの行為・営みを指す意味を自然に表せる。
- source_word: ἐν ἀγάπῃ
  choice: 愛をもって
  rationale: 前置詞句が行為のあり方・領域を示す。「愛のうちに」より自然でありながら、愛がすべての行為を特徴づけるという意味を保つ。
- source_word: γινέσθω
  choice: 行いなさい
  rationale: γίνομαι の三人称単数現在命令形で、直訳的には「なされるように／生じるように」。文脈上、共同体のあらゆる営みについての勧告なので、現代日本語で明瞭な命令表現とした。直訳的な形は脚注に示した。
theological_decisions: []
translation_notes:
  register: 簡潔な勧告として、現代の一般読者に明瞭で、礼拝朗読にも適する端正な文体を用いた。「愛」はἀγάπηの基本的かつ文脈に適した訳語である。
