source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: ja
  text: 毎週の初めの日に[a]、あなたがたは各自、自分のもとで[b]、得た恵みに応じて[c]取り分け、蓄えておきなさい。私がそちらへ行く時になって献金を集めることがないようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「週の初めの日に」。ギリシア語の表現はここでは反復を示し、毎週行う習慣を意味します。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「自分のもとに」または「自分で」。各自が個人的に、場合によっては家で、その金を取り分けておくという意味に理解できます。
    reason: lexical_alternative
  - marker: c
    text: 別訳「その人が栄えている程度に応じて」または「収入に応じて」。各自が得た経済的な恵みに応じて取り分けるという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: 毎週の初めの日に
  rationale: κατάを伴う表現の反復・配分的な力を自然な現代日本語で示し、週ごとの継続的な実践であることを明確にした。μίανは週の第一日を指すが、日本語では「初めの日」が自然である。
- source_word: ἕκαστος ὑμῶν
  choice: あなたがたはそれぞれ
  rationale: 会衆の一人一人に適用される指示であることを、明瞭な配分表現で訳した。
- source_word: παρ’ ἑαυτῷ
  choice: 自分のところに
  rationale: 直訳的な「自分のもとに／自分で」という曖昧さをある程度保ち、家庭で個人的に保管するのか、各自が自分の分として取り分けるのかを本文で断定しなかった。
- source_word: τιθέτω θησαυρίζων
  choice: 取り分けて蓄えておきなさい
  rationale: 現在命令形の継続的な指示と、分詞が表す蓄積の仕方を一続きの自然な日本語で表した。
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: 恵まれた分に応じた額を
  rationale: 不定・条件的な表現を、各人が得た繁栄や経済的余裕に対応する額という意味で訳した。「恵まれた」は繁栄を与える主体を明示せず、受動・中動形の含みを保つ。
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: 私が行った時になって献金を集めることのないようにするためです
  rationale: 目的節と時間節を自然に結び、パウロの到着後に初めて集金を行う事態を避ける意図を明示した。λoγεῖαιは文脈上、金銭の献金収集を指す。
theological_decisions:
- issue: εὐοδῶταιにおける繁栄の主体
  choice: 「恵まれた分」とし、誰が恵みを与えたかを本文では明示しない
  alternative: 「神に繁栄を与えられた分」または「収入に応じて」
  rationale: 原文は繁栄の主体を明記していない。「神に」を補うと神学的解釈を本文に加え、「収入」とすると意味を経常所得に限定しかねないため、曖昧さを保った。
- issue: παρ’ ἑαυτῷが家庭での保管を命じるか
  choice: 「自分のところに」と訳して断定しない
  alternative: 「家で」または「各自で」
  rationale: この句は個人的に手元へ取り分けることを表し得るが、保管場所を家庭に限定するかどうかは確定的でないため、本文では解釈を絞らなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「おきなさい」で継続的な使徒的指示を自然に表し、「行った時になって」で到着時の土壇場の収集という含みを示した。教派固有の献金制度や礼拝日の規定は読み込んでいない。
