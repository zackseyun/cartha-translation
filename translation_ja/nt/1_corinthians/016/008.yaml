  text: しかし、私は五旬節[a]までエフェソに滞在します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「七週の祭り」とも訳せる。
    reason: πεντηκοστήは、ユダヤ暦の「七週の祭り」を指す定着したギリシア語名称であり、その背景を示す別訳を掲げた。
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: 滞在します
  rationale: ἐπιμένωの未来能動形で、旅行計画の文脈において、ある場所に一定期間とどまることを表す。現代日本語として自然であり、場所にとどまる意味を明確に伝える。
- source_word: δὲ
  choice: しかし
  rationale: 直前の旅行計画との穏やかな対比を示す接続辞。日本語では「しかし」がその対比を自然に表す。
- source_word: ἐν Ἐφέσῳ
  choice: エフェソに
  rationale: ἐν＋与格の場所を表す用法。地名は現代日本語で一般的な音写を用いた。
- source_word: ἕως τῆς πεντηκοστῆς
  choice: 五旬祭までは
  rationale: ἕως＋属格は、その時点まで継続する期間を示す。πεντηκοστήは新約聖書のユダヤ暦の文脈で「五旬祭」とするのが簡潔で定着した訳語である。「は」を添えて、そこまではエフェソにとどまるという文脈上の対比を自然に示した。
