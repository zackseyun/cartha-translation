id: 1CO.16.1
reference: 1 Corinthians 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: ja
  text: 聖なる者たちのための献金については、私がガラテヤの諸教会に指示したとおり、あなたがたも同じようにしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる者たち」は、ここでは神に属する信徒たちを指す。別訳「神の民のための献金」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 〜については
  rationale: 新しい話題を導入するパウロの定型的な表現として、明示的な時間語を加えず、自然な日本語の主題提示で表した。
- source_word: λογείας
  choice: 献金
  rationale: 金銭を集めることを指す語。文脈上は信徒支援のための金銭であり、日本語では「献金」が簡潔で自然である。ただし礼拝儀礼に限定しない。
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: 聖なる者たちのための
  rationale: 献金の受益者を示す。「聖なる者たち」はパウロが信徒共同体を指す際の語義を保ち、後代の列聖概念を避ける。
- source_word: διέταξα
  choice: 指示した
  rationale: 権威ある具体的な指示を表しつつ、「命令した」ほど不必要に強圧的な響きを与えない。
- source_word: ἐκκλησίαις
  choice: 諸教会
  rationale: 複数のキリスト者共同体を指すため、定着した訳語「教会」に複数性を示す「諸」を添えた。
- source_word: Γαλατίας
  choice: ガラテヤ
  rationale: 地名の標準的な日本語音写。
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: あなたがたも同じようにしなさい
  rationale: 比較対応の意味とアオリスト命令形の指示力を、明瞭で自然な現代日本語で表した。
theological_decisions:
- issue: ἅγιοιを救援献金の文脈でどう訳すか
  choice: 聖なる者たち
  alternative: 神の民／信徒たち
  rationale: パウロが信徒を呼ぶ特徴的な表現と「聖」の語義を保持し、特定の列聖者だけを意味するとの誤解を脚注で防ぐ。
translation_notes:
  register: 明瞭な現代標準語を用い、書簡としての品位と命令の力を保った。「献金」は宗教儀礼上の供え物に狭めず、信徒支援のために集める金銭という意味で用いた。
