  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: ja
  text: 目を覚ましていなさい。信仰にしっかりと立ちなさい。勇気を出しなさい[a]。強くされなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「男らしく振る舞いなさい」。ここでは、勇敢に行動することを求める慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「強くありなさい」。原語は受動形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 現在命令形が表す継続的な警戒を、現代日本語として自然な聖書的表現で示す。文脈上、文字どおり睡眠から覚めることではなく、油断せず警戒することを指す。
- source_word: στήκετε
  choice: しっかりと立ちなさい
  rationale: 単に立つ動作ではなく、揺るがず堅持するという比喩的意味を明示する。
- source_word: ἐν τῇ πίστει
  choice: 信仰に
  rationale: 定冠詞を伴うため『その信仰』、すなわちキリスト者が告白し堅持する信仰を指し得るが、日本語では『信仰にしっかりと立つ』が自然であり、その客観的・領域的な含みも保てる。
- source_word: ἀνδρίζεσθε
  choice: 勇気を出しなさい
  rationale: 語源的には『男らしく振る舞う』という男性的比喩を持つが、命令の慣用的な要点は勇敢であること。現代日本語で誤解なく伝え、語源的イメージは脚注に残す。
- source_word: κραταιοῦσθε
  choice: 強くされなさい
  rationale: 受動態の形を保ち、自力だけで強くなるとの限定を避ける。行為者は本文に明示されていないため補わない。
theological_decisions:
- issue: ἐν τῇ πίστει における πίστις の意味
  choice: 信仰に
  alternative: 信仰をもって
  rationale: 定冠詞と στήκετε との結びつきから、瞬間的・主観的な信頼の仕方よりも、堅持すべき信仰の領域または内容を表すと判断した。ただし日本語で不自然な『その信仰に』とはしない。
- issue: ἀνδρίζεσθε の性別を伴う比喩
  choice: 勇気を出しなさい
  alternative: 男らしく振る舞いなさい
  rationale: 原語の男性的な語源・イメージを脚注で明示しつつ、文脈における慣用的命令を自然な現代日本語で表す。宛先には共同体全体が想定されており、男性だけへの命令とは限定しない。
- issue: κραταιοῦσθε の受動態
  choice: 強くされなさい
  alternative: 強くありなさい
  rationale: ギリシア語の受動形を本文に反映する一方、誰によって強くされるかは原文が明示しないため、『神によって』などの行為者を補わない。
translation_notes:
  register: 短い複数の命令を原文どおり畳みかける構成とし、明瞭で格調のある現代標準日本語を用いた。性別を伴う古代の慣用表現は本文では意味を自然に伝え、脚注で字義的な形を保存した。
