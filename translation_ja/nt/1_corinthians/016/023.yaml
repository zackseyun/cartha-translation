  text: ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/023.yaml
  text: The grace of the Lord Jesus be with you.
translation:
  language: ja
  text: 主イエスの恵みが、あなたがたとともにありますように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの祝祷で用いられる定着した語であり、主から与えられる好意と祝福という意味を、自然かつ神学的な重みを保って表す。
- source_word: κύριος
  choice: 主
  rationale: 新約聖書における称号としての用法とキリスト論的な含意を簡潔に保つ、日本語聖書で定着した訳語。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 人名として、現代日本語で定着した表記を用いる。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたとともにありますように
  rationale: ギリシア語は直訳すれば「あなたがたとともに」だが、動詞を省いた祝祷表現である。日本語では願いの意味を明らかにするため「ありますように」を補い、複数二人称は「あなたがた」とする。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの
  rationale: 属格の構造を保ちつつ自然な日本語とし、恵みが主イエスに属し、主イエスに由来するという含みを過度に限定せず残す。
theological_decisions:
- issue: 明示された動詞のない祝祷句
  choice: 願いを表す「ありますように」を補う。
  alternative: 「主イエスの恵みが、あなたがたとともに。」
  rationale: 原文は無動詞だが、慣用的な祝祷として願望の力を持つ。現代日本語で文意を自然かつ明確に伝えるため、存在と願いを示す表現を補った。
- issue: 属格 τοῦ κυρίου Ἰησοῦ の関係
  choice: 「主イエスの恵み」
  alternative: 「主イエスからの恵み」
  rationale: 「の」は原文の属格が持つ所有・起源の幅を保つ。「からの」として起源だけに明示的に限定することを避けた。
translation_notes:
  register: 明瞭で現代的ながら、結びの祝祷にふさわしい品位を持つ文体。「共に」ではなく「ともに」として読みやすさを優先した。
