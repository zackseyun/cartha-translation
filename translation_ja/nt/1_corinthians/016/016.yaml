  source_fidelity: 原文は「あなたがたも、このような人たちに、また、共に働き、労苦しているすべての人に従ってください」と適切に反映されている。καὶ ὑμεῖς の包含的強調、τοῖς τοιούτοις の直前の奉仕者を類型として指す用法、ならびに協働し労苦する人すべてへの対象の広がりが保たれている。ὑποτάσσησθε は前節の勧めに従属する現在接続法であり、「従ってください」は日本語として自然にその勧告の力を表す。
  naturalness: 明瞭な現代標準日本語であり、句読点と並列も読みやすい。「共に働き、労苦しているすべての人」は、二つの分詞が同じ人を修飾する原文の構造を自然に伝える。
  terminology: 「従ってください」は、この文脈における自発的な服従・従順の要請を、制度的または無条件の服従へと過度に限定せず表現している。「労苦している」もκοπιάωの骨折る働きの含意を保つ。脚注bはσυνεργέωの代替的理解を適切に示し、脚注aはἵναと前節の勧告との構文関係を正しく説明している。
