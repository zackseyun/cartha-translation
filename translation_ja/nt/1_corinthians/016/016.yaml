id: 1CO.16.16
reference: 1 Corinthians 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: ja
  text: あなたがたも、このような人たちに、また、共に働き[b]、労苦しているすべての人に従ってください[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたも、このような人たちに……従うように」。この節の「〜ように」は、前節の「お願いします」に続いて、その願いの内容を示しています。
    reason: syntactic_context
  - marker: b
    text: 「共に働き」は、「協力して働き」または「同労者として働き」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 〜してください
  rationale: 前節の「お願いします」に続いて願いの内容を導く接続詞である。日本語では前節からの従属構文をそのまま写すより、願いの内容を丁寧な命令形で表すほうが明瞭で自然。接続上の形は脚注に示した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: コリントの信徒たちも同様に応答すべきことを示す包含・強調を自然に表す。
- source_word: ὑποτάσσησθε
  choice: 従ってください
  rationale: 自らをその人々の働きと指導のもとに置くよう求める語。文脈にない絶対的服従を加えず、勧告としての力を保つ。
- source_word: τοῖς τοιούτοις
  choice: このような人たちに
  rationale: 直前に挙げられたステファナの家の人々のように、奉仕に身を献げる種類の人々を指す。性別を不必要に限定しない。
- source_word: παντὶ τῷ συνεργοῦντι
  choice: 共に働くすべての人に
  rationale: συνεργέω の参与・協働の意味と分詞の動作性を保つ。「同労者」と固定的な称号のようにせず、共に働く行為として訳す。
- source_word: καὶ κοπιῶντι
  choice: 労苦している
  rationale: κοπιάω が表す骨折って熱心に働く含意を、現代日本語の格調を保ちながら明確に伝える。
theological_decisions:
- issue: 求められている服従の性質
  choice: 直前に述べられた人々のような働き手に進んで従うよう求める勧告
  alternative: 制度上の権威への無条件かつ包括的な服従命令
  rationale: 文脈はステファナの家の人々と、共に働き労苦するすべての人に向けられている。「従う」という本文の力は保ちつつ、本文が明言しない絶対的・制度的服従を持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、丁寧な勧告として訳した。「服従する」より日常的で自然な「従う」を選びつつ、原文の要請の強さは保った。
