id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: ja
  text: たとえ私の持ち物をすべて分け与え、たとえ焼かれるために自分の体を引き渡しても[a]、愛がなければ、私には何の益もありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本では「焼かれるために」の代わりに「誇るために」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: 分け与え
  rationale: 本来は食物を一口ずつ与えることを表し、ここでは財産を人々に配る意味。「分け与え」は、少しずつ配る含みと慈善的な行為を自然な現代日本語で伝える。
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: 私の持ち物をすべて
  rationale: 自分に属する財産・所有物全体を指す。「持ち物」は平明で具体的であり、「すべて」によって全面性を保つ。
- source_word: παραδῶ
  choice: 引き渡して
  rationale: 自分の体を他者の手に渡すという動詞の意味を保ち、「ささげる」などの解釈的・宗教的な語を不用意に加えない。
- source_word: τὸ σῶμά μου
  choice: 自分の体
  rationale: 条件節の主語と同一人物の体であることを自然な日本語で明示する、具体的で直截な訳。
- source_word: ἵνα καυθήσομαι
  choice: 焼かれるために
  rationale: 底本の「焼く」を意味する受動形に従い、ἵναの目的・意図を簡潔に表す。異読は意味を大きく変えるため脚注に示す。
- source_word: ἀγάπην
  choice: 愛
  rationale: ἀγάπηの広い意味を保つ、現代日本語で標準的かつ自然な訳語。
- source_word: οὐδὲν ὠφελοῦμαι
  choice: 私には何の益もありません
  rationale: 話者が何一つ利益を受けないという受動的な含みを保ちつつ、明瞭で品位ある日本語にした。
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: たとえ…たとえ…ても
  rationale: 二つの仮定を反復するパウロの修辞と、その極端な行為を重ねる譲歩的な力を自然な日本語で再現する。
theological_decisions:
- issue: 目的節の本文異読
  choice: SBLGNTのκαυθήσομαιを「焼かれる」として本文に採用する。
  alternative: καυχήσωμαιを「誇る」とする異読。
  rationale: 指定された原語底本を優先する。同時に、焼死を受け入れることと誇ることでは解釈が大きく異なるため、異読を脚注に明記して本文伝承上の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、反復条件文の荘重さを保った。「何の益もありません」は口語的すぎず、一般読者にも理解しやすい表現。脚注記号は、異読が実際に関わる「焼かれるために自分の体を引き渡しても」の直後に置いた。
