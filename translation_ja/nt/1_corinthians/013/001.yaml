  naturalness: 「私が、人間」の読点は不要です。「なっています」はこの仮定的・修辞的な文脈では進行中の状態のようにも響くため、「なってしまいます」のほうが、結果として無価値な騒音になるという比喩を自然に表せます。「天使」は明瞭で現代標準語として広く通じる語です。
  terminology: ἀγγέλωνは、人間との対比および文脈から「天使たち」とするのが適切です。「愛」はἀγάπηνの簡潔で標準的な訳語です。「ことば」はγλῶσσαの「言語／異言」を本文で限定せずに保てます。
