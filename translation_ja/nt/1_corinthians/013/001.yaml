  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: ja
  text: たとえ私が人間のことばや天使たちのことばで語っても、愛を持たなければ、私は鳴り響く青銅、あるいはけたたましく鳴るシンバルになってしまいます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」と訳した原語は、「言語」または「異言」を指すこともあります。ここで「天使たちのことば」が実在する天上の言語を指すのか、最高度の発話を表す修辞なのかは、明示されていません。
    reason: lexical_alternative
  - marker: b
    text: 「鳴り響く青銅」は、「響く金属」または「鳴る銅鑼」とも訳せます。この前半の句は特定の楽器を明示していませんが、後半は「シンバル」を明示しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: たとえ～ても
  rationale: 仮定を導く語。文脈上、パウロが想定上の極端な場合を重ねて論じる修辞を、自然な日本語の譲歩的条件文で表した。
- source_word: ταῖς γλώσσαις τῶν ἀνθρώπων
  choice: 人間の言葉で
  rationale: γλῶσσαには「舌」「言語」「異言」の意味領域がある。「言葉」は人間と御使いの対比を自然に示しつつ、通常の言語か霊的な異言かを本文だけで限定しない。ἀνθρώπωνは性別ではなく御使いに対する人類全体を指すため、「人間」とした。
- source_word: καὶ τῶν ἀγγέλων
  choice: や御使いたちの言葉で
  rationale: ここでは人間との対比から、ἄγγελοςは地上の使者ではなく天的存在を指す。「や」は両者を並べながら、全体を一つの仮定として自然につなぐ。
- source_word: λαλῶ
  choice: 語っても
  rationale: 現在接続法を条件節に合わせ、自然な現代日本語で表した。
- source_word: ἀγάπην δὲ μὴ ἔχω
  choice: 愛がなければ
  rationale: ἀγάπηは一般的で明瞭な「愛」とし、δέの対照とμήによる欠如を簡潔な条件表現で示した。
- source_word: γέγονα
  choice: なっています
  rationale: 完了形が示す、あるものとなって現在その状態にあるという結果的な含みを保った。
- source_word: χαλκὸς ἠχῶν
  choice: 鳴り響く青銅
  rationale: χαλκόςは青銅・銅系の金属を指し、特定の楽器名は本文にないため、原文の金属の比喩をそのまま保った。
- source_word: κύμβαλον ἀλαλάζον
  choice: 騒がしく鳴るシンバル
  rationale: κύμβαλονを「シンバル」、大きくけたたましい音を表すἀλαλάζονを「騒がしく鳴る」として、耳障りな音の印象を明確にした。
theological_decisions:
- issue: 「人間の言葉や御使いたちの言葉」の意味
  choice: 人間と御使いの言葉という対比をそのまま訳し、それが実在する天上の言語なのか、最高度の発話を表す誇張なのかは決定しない。
  alternative: 実在する天上の言語を指す、または修辞的な誇張にすぎないと明示する。
  rationale: 原文はどちらか一方に確定することを要求していないため、神学的・修辞的な緊張を保った。
- issue: γλῶσσαとコリント書における「異言」
  choice: 本文では「言葉」とし、脚注で「言語」「異言」の可能性を示す。
  alternative: 本文で一律に「異言」とする。
  rationale: 「異言」だけでは特定の霊的現象に意味を狭める可能性がある一方、原語とコリント書の議論とのつながりは脚注で保持できる。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「御使い」は天的存在を表す慣用的な聖書語として用いた。「なっています」により完了形の結果状態を示し、比喩の強さを保った。
