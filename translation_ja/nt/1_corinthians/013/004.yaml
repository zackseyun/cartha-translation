id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: ja
  text: 愛は忍耐強く、愛は親切です。ねたまず[a]、自慢せず、思い上がりません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「嫉妬せず」とも訳せます。このギリシア語は積極的な「熱意」を表すこともありますが、ここでは否定的な文脈から「ねたむ」の意味に取っています。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「膨れ上がりません」。高慢になって自分を大きく見せることを表す比喩です。
    reason: metaphor
lexical_decisions:
- source_word: ἀγάπη
  choice: 愛
  rationale: 広い倫理的・神学的意味を保つ、現代日本語の自然で標準的な訳語。
- source_word: μακροθυμεῖ
  choice: 忍耐強く
  rationale: 特に人に対して長く耐えるという継続的な姿勢を、簡潔で自然な日本語で表す。
- source_word: χρηστεύεται
  choice: 親切です
  rationale: 親切に振る舞い、善意を示すことを表す動詞。周囲の簡潔な述語表現に合わせた。
- source_word: ζηλοῖ
  choice: ねたまず
  rationale: この否定的文脈では、積極的な熱意ではなく、他者に対するねたみを指すと判断した。
- source_word: περπερεύεται
  choice: 自慢せず
  rationale: 自分を誇示して大言する意味を、明快で品位のある現代日本語で表した。
- source_word: φυσιοῦται
  choice: 思い上がりません
  rationale: 誇りで膨れ上がるという比喩が示す高慢さを、自然な日本語で伝える。比喩そのものは脚注で明示した。
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: 愛は……愛は……（以後は主語を省略）
  rationale: 冒頭二節の反復による強調を保ちつつ、後続部分では日本語として不自然な反復を避けた。第三の「愛は」は本文上の異同があり、訳文では主語を自然に省略しても意味は変わらない。
- source_word: οὐ
  choice: 〜ず／〜ません
  rationale: 連続する否定を、日本語の文脈に応じた自然な接続形と丁寧な終止形で表した。
theological_decisions:
- issue: ἀγάπηの訳語
  choice: 愛
  alternative: 慈愛
  rationale: 「愛」は、人への態度と行為を含む語の広がりを保つ。「慈愛」は意味を慈しみに狭める可能性がある。
- issue: ζηλοῖの否定形の意味
  choice: ねたまず
  alternative: 嫉妬せず／熱心にならず
  rationale: 動詞自体は熱意にも嫉妬にも用いられるが、ここでは愛に反する性質を列挙する否定的文脈なので「ねたむ」が最も適切である。
- issue: φυσιοῦταιの比喩
  choice: 思い上がりません
  alternative: 膨れ上がりません／高慢になりません
  rationale: パウロの「膨らむ」という比喩が指す高慢を、理解しやすい現代日本語で表し、比喩的背景は脚注に残した。
translation_notes:
  register: 明快な現代標準日本語。広く知られた箇所にふさわしい簡潔さと品位を保ち、冒頭の「愛は」の反復を再現した。後半は日本語で自然になるよう主語を省略し、否定表現を連ねた。
