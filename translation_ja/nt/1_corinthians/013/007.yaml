translation:
  language: ja
  text: 愛は、すべてを忍び[a]、すべてを信じ[b]、すべてを望み、すべてに耐えます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてを覆う」または「すべてを守る」とも訳せる。ここで用いられた語には、覆う・守るという意味と、耐え忍ぶという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「すべてを信頼する」とも訳せる。文脈上、愛が無分別に何でも信じるというより、信頼へと向かう性質を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: すべてを
  rationale: 四つの動詞それぞれにかかる包括的な表現として、原文の反復と広がりを保つ。
- source_word: στέγει
  choice: 耐え
  rationale: 「覆う、守る」と「耐える」の語義を持つが、ここでは愛の持続的な性質を自然に表す「耐え」とした。「覆う」という可能性は脚注に残した。
- source_word: πιστεύει
  choice: 信じ
  rationale: 「信じる、信頼する」という意味を簡潔に表し、原文の並行表現を保つ。無分別に何でも信じ込むという意味には限定しない。
- source_word: ἐλπίζει
  choice: 望み
  rationale: 愛の特徴的、継続的なあり方を、簡潔で自然な日本語で表す。
- source_word: ὑπομένει
  choice: 耐え抜きます
  rationale: 圧力や困難の下にとどまって持ちこたえる語感を示し、στέγειとの違いをある程度表しながら、連句の結びを明確にする。
theological_decisions:
- issue: 四度繰り返される πάντα の意味
  choice: 愛の包括的で揺るがないあり方を修辞的に描く表現として訳す。
  alternative: 愛が善悪を問わず何でも容認し、無批判に信じるという絶対的な意味に取る。
  rationale: 文脈は愛の性質を詩的に描いている。「すべてを」という緊張を本文に残しつつ、道徳的な無分別やだまされやすさを訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「すべてを」の四度の反復を維持し、原文の簡潔なリズムを再現した。文全体の主語が「愛」であることを明示し、終止だけを丁寧形にして日本語として自然な連続述語にした。
