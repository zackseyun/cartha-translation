  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: ja
  text: しかし、完全なもの[a]が来ると、部分的なものは廃されます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「完成したもの」または「成熟したもの」。「完全なもの」（ギリシア語ト・テレイオン）が何を指すかについては見解が分かれており、現在の部分的な状態に対する完成、成熟、または終末における成就などと理解されます。
    reason: alternative_reading
  - marker: b
    text: 別訳「取り除かれます」「消え去ります」または「無効にされます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 来ると
  rationale: 未来に予期される出来事を表す時の節として、現代日本語で自然な「来ると」とした。反復的な「来るたびに」には限定しない。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの「部分的」な状態と、これから来る完全なものとの穏やかな対比を明示する。
- source_word: ἔλθῃ
  choice: 来る
  rationale: ὅτανに続くアオリスト接続法は将来の出来事を指すため、日本語では非過去形の「来る」が自然である。
- source_word: τὸ τέλειον
  choice: 完全なもの
  rationale: τέλειοςが持つ「完全な、完成した、成熟した」という幅を保ち、具体的な指示対象を本文で決めつけないため、中性実体詞に対応する包括的な表現とした。
- source_word: τὸ ἐκ μέρους
  choice: 部分的なもの
  rationale: 冠詞を伴う前置詞句の実体詞的用法を表し、「完全なもの」との対照を明瞭に保つ。
- source_word: καταργηθήσεται
  choice: 廃されます
  rationale: 未来受動形が表す、効力を失わせられること、または終わらされることを簡潔に示す。消滅そのものを必要以上に強調しない。
theological_decisions:
- issue: τὸ τέλειονの指示対象
  choice: 「完全なもの」とし、指示対象を特定しない。
  alternative: 「完成したもの」「成熟したもの」、または終末における完成を明示する訳。
  rationale: ギリシア語本文は、この句が何を具体的に指すかを本節だけでは明示していない。完成、成熟、終末的成就などの理解が可能であるため、特定の教理的解釈に狭めず、曖昧さを保持した。
- issue: καταργηθήσεταιの終止の強さ
  choice: 「廃されます」とし、機能や効力が終わることを表す。
  alternative: 「取り除かれます」「消え去ります」「無効にされます」。
  rationale: 語は廃止、無効化、終止を表し得るが、必ずしも存在の消滅だけを意味しない。文脈上の対照を保ちながら、意味を過度に限定しない訳を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。丁寧体を用い、「完全なもの／部分的なもの」の対応を明示して原文の対照と解釈上の余地を保持した。
