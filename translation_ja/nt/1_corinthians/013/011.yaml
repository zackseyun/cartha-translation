  to: 私が子どもだったとき、子どものように話し、子どものように考え、子どものように判断していました。男となったとき、子どものもの[a]を捨てました。
  rationale: 原文の反復構造、思考に関する二動詞の区別、そして子どもから成人男性への移行を保持した。「しかし」を省いて原文以上の逆接を加えず、ἀνήρ を「男」として性別を特定する原語の表現を反映した。末尾の包括的で曖昧な表現は「子どものもの」とし、脚注で可能な慣用訳を示した。
