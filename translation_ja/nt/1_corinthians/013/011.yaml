reference: 1 Corinthians 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: ja
  text: 私が子どもだったとき、子どものように話し、子どものように考え、子どものように判断していました。男となったとき、子どものもの[a]を捨てました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「子どものもの」。または「子どもじみたこと」「子どものあり方」。
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: 幼子
  rationale: 幼い子ども、また未成熟な者を指す語。成人との対比を保ちつつ、単に乳児に限定しない「幼子」とした。
- source_word: ἐλάλουν
  choice: 話し
  rationale: 通常の発話を表す語であり、三つの動詞の並行を簡潔に再現する。
- source_word: ἐφρόνουν
  choice: 考え
  rationale: 思考だけでなく心構えも含み得るが、ここでは並列の中で自然な「考える」とした。
- source_word: ἐλογιζόμην
  choice: 判断していました
  rationale: 考慮する、推論する、判断する意。ἐφρόνουνとの違いを示しつつ、現代日本語で自然な表現とした。
- source_word: γέγονα
  choice: なった
  rationale: 完了形は成人した状態への移行を示す。時を表す節では日本語の「なった」が自然である。
- source_word: ἀνήρ
  choice: 大人
  rationale: 語自体は成人男性を意味するが、ここでは話者自身の幼少期と成人期の対比が中心である。「男」では性別の対比と誤解されやすいため、「大人」で成熟の対照を明確にした。
- source_word: κατήργηκα
  choice: 捨てました
  rationale: 無効にする、廃する意。幼少期のものを後にするという比喩を、簡潔で力のある日本語にした。
- source_word: τὰ τοῦ νηπίου
  choice: 幼子のもの
  rationale: 直訳的には「幼子に属するもの」。具体的内容を限定せず、原文の包括性を保つ。
theological_decisions:
- issue: ἀνήρの性別表現と成熟の比喩
  choice: 大人
  alternative: 男／一人前の男
  rationale: ἀνήρは男性名詞で成人男性を指すが、この文ではパウロが自分を例に、幼少から成熟への移行を述べている。日本語の「男」は成熟より性別を前景化するため、「大人」が文脈上の対比をより正確に伝える。性差に関する教理的主張を加えない。
- issue: τὰ τοῦ νηπίουの範囲
  choice: 幼子のもの
  alternative: 子どもじみたこと／幼子のあり方
  rationale: 原文は何を指すかを明示しないため、話し方・考え方・判断の仕方だけに限定せず、曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。三度繰り返される「幼子のように」の修辞的リズムを維持し、前半の継続的な過去と後半の転換を「しかし」で自然に示した。
