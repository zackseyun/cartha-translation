  naturalness: 「子どもだったとき、子どものように……」は明瞭な現代標準日本語であり、原文の三重の反復も自然に保てる。「男となったとき」はやや格調を帯びるが、不自然ではなく、原文の対比を簡潔に伝える。
  terminology: νήπιος は文脈上「子ども」とするのが自然で、乳児に限定しない。ἀνήρ は「男」と訳して男性形を保持する。τὰ τοῦ νηπίου は具体的内容を定めない「子どものもの」とし、注で慣用的・解釈的な代案を示す。
