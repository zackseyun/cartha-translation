id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: ja
  text: たとえ私に預言の力があり、すべての奥義とあらゆる知識を理解していても、また、山々を移すほどの最大限の信仰[a]があっても、愛がなければ、私は何ものでもありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼」とも訳せる。可能性は低いが、「誠実さ」の意味を持つ場合もある。ここでは、山々を移すほどの並外れた信仰を指すと考えられる。
    reason: πίστις の語義の幅を示しつつ、この文脈で最も自然な理解を説明するため。
lexical_decisions:
- source_word: προφητείαν
  choice: 預言の力
  rationale: 名詞の広い意味を保ちつつ、現代日本語で不自然な「預言を持つ」を避けた。「預言の賜物」と限定しすぎず、預言する能力を自然に表す。
- source_word: εἰδῶ
  choice: 理解していても
  rationale: 単なる面識ではなく、奥義と知識を把握していることを表す。後続の名詞「知識」との語形上の重複も避けられる。
- source_word: μυστήρια
  choice: 奥義
  rationale: パウロ書簡で用いられる、隠されていた神の事柄という含みと荘重な語調を保つ。
- source_word: γνῶσιν
  choice: 知識
  rationale: 一般的で明瞭な訳語であり、動詞 εἰδῶ の「理解する」と区別しながら原文の並列を保つ。
- source_word: πᾶσαν τὴν πίστιν
  choice: 完全な信仰
  rationale: 字義的な「あらゆる信仰」は日本語として不自然なため、πᾶσαν の全体性・極限性を「完全な」で表した。文脈上、山を移すほどの並外れた信仰を指す。
- source_word: ὥστε ὄρη μεθιστάναι
  choice: 山々を移すほどの
  rationale: 結果・程度を示す構文と、並外れた力を表す原文の山の比喩を簡潔に保つ。
- source_word: ἀγάπην
  choice: 愛
  rationale: 現代日本語で自然かつ広い意味を持ち、ἀγάπη の中心的な意味を過度に限定しない。
- source_word: οὐθέν εἰμι
  choice: 私は何ものでもありません
  rationale: パウロの強い自己否定を、解釈的な補足を加えず、明瞭で品位ある日本語にした。
theological_decisions:
- issue: 山を移す力との関連で用いられた πίστις の意味
  choice: 信仰
  alternative: 信頼。より可能性は低いが「誠実さ」
  rationale: この文脈では、忠実な人格特性よりも、山を移すほどの並外れた信仰を指す可能性が高い。ただし πίστις の語義の幅は脚注に残した。
- issue: 「愛がなければ」と「私は何ものでもない」の関係
  choice: 能力や知識が極限に達していても、愛を欠くなら「私は何ものでもない」とする原文の断言を保持
  alternative: 「何の役にも立たない」「価値がない」など、実用性や評価に限定する訳
  rationale: οὐθέν εἰμι は行為の有用性だけでなく存在についての強い表現であるため、神学的緊張を弱めず直截に訳した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「奥義」「何ものでもありません」によって聖書本文にふさわしい品位と原文の強さを保った。「たとえ……ても、また……ても」という構文で二つの条件節を明確に示した。
