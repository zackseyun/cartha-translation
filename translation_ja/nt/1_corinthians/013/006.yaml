  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: ja
  text: 愛は不正を喜ばず[a]、真理とともに喜ぶ。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不義を」または「悪事を」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「真理を喜ぶ」とも訳せます。ギリシア語の複合動詞は、真理とともに喜びを分かち合う意味にも、真理を喜ぶ意味にも取れます。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: 喜ぶ
  rationale: 喜びやうれしさを表す動詞であり、後半の συγχαίρει との反復を保てる自然な訳語である。
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: 不正を喜ばず
  rationale: ἐπί＋与格はここでは喜びの理由・対象を示す。ἀδικία の道徳的な広がりを保ちつつ、現代日本語で自然な「不正」とした。
- source_word: συγχαίρει
  choice: ともに喜びます
  rationale: συν- が示す『一緒に、喜びを分かち合って』という含みを明示し、単に「喜ぶ」とするより原文の形を保った。
- source_word: δὲ
  choice: （読点による対比）
  rationale: 前半の否定と後半の肯定の明瞭な対比は、日本語では「〜ず、〜ます」という構文で自然に表せるため、独立した接続詞は置かなかった。
- source_word: τῇ ἀληθείᾳ
  choice: 真理
  rationale: ἀδικία と対置される、真実・真実なあり方を含む幅広い概念を保ち、特定の発言や教理だけに限定しない訳とした。
theological_decisions:
- issue: ἀδικία のパウロ的な倫理的対比
  choice: 不正
  alternative: 不義／悪事
  rationale: 「不正」は道徳的に正しくないことを広く表し、司法上の不公平だけに限定されない。「不義」は神学的な響きをより強く保つが、現代の一般読者にはやや硬く、「悪事」は個別の行為に狭まりやすい。
- issue: συγχαίρει と τῇ ἀληθείᾳ の関係
  choice: 真理とともに喜ぶ
  alternative: 真理を喜ぶ
  rationale: συν- の共同的な含みを保持した。一方、ギリシア語は真理を喜びの対象・理由とする理解も許すため、脚注に代案を示した。
translation_notes:
  register: 明快な現代標準語を用いながら、愛の性質を列挙する文脈にふさわしい簡潔で品位ある調子と、原文の対句を保った。節単独でも主語が分かるよう「愛は」を補った。
