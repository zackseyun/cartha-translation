reference: 1 Corinthians 13:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: ja
  text: しかし今、信仰[a]と希望と愛、この三つは残ります[b]。この三つの中で最もすぐれているのは愛です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は「信頼」とも訳せます。
    reason: alternative_reading
  - marker: b
    text: 「残ります」は「存続します」「あり続けます」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今
  rationale: νυνίの「今」と、δέが示す穏やかな対比をともに表す。直前の、過ぎ去るものとの対照にも自然につながる。
- source_word: μένει
  choice: 残ります
  rationale: ここでは、一時的なものが過ぎ去るのに対し、存続する、あり続けることを表す。現代日本語として明快な「残る」を採用した。
- source_word: πίστις
  choice: 信仰
  rationale: パウロ書簡におけるこの三つ組では「信仰」が標準的で自然である。ただし、語義として「信頼」も含み得るため脚注に示した。
- source_word: ἐλπίς
  choice: 希望
  rationale: パウロ書簡で通常、神に向けられた確かな望みを表し、「希望」が簡潔で定着した訳語である。
- source_word: ἀγάπη
  choice: 愛
  rationale: 文脈上、人を生かす自己を与える愛を指し、現代日本語では「愛」が最も明瞭である。
- source_word: τὰ τρία ταῦτα
  choice: この三つ
  rationale: 直前に列挙された信仰、希望、愛を指す指示表現を簡潔に保った。
- source_word: μείζων δὲ τούτων
  choice: そして、この中で最も大いなるもの
  rationale: 形態上は比較級だが、三者の中で愛が最上位であることを示す構文。「最も大いなる」は意味を明確にしつつ、聖書本文にふさわしい品位を保つ。
theological_decisions:
- issue: πίστις の神学的に重要な語義
  choice: 信仰
  alternative: 信頼／誠実
  rationale: 信仰・希望・愛という定型的な三つ組では「信仰」が最も自然である。「誠実」と限定する根拠は弱く、「信頼」の含意は脚注で保持する。
- issue: μείζων の比較級の訳し方
  choice: この中で最も大いなるもの
  alternative: これらより大いなるもの
  rationale: 属格 τούτων を伴う比較級は、ここでは三つの中での最高位を表す。日本語では最上級的に訳すことで意味が自然かつ明瞭になる。
- issue: μένει の単数形と三つの主語
  choice: この三つは残ります
  alternative: 一つ一つ残ります
  rationale: ギリシア語では三つを一まとまりの主語として単数動詞で受けている。日本語では集合として「この三つは残ります」とし、不必要な解釈を加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、結論的な格調を保った。「最も大いなる」は日常語の「最も大きい」よりも抽象的な卓越性を自然に示す。脚注記号は該当語の直後に置いた。
