  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: ja
  text: 私たちが知っているのは一部分であり[a]、預言するのも一部分だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「部分的に」。ギリシア語の慣用句は直訳すると「一部分から」で、二つの節に繰り返されています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: 一部分
  rationale: 「部分から」というギリシア語の慣用句を、文脈上の「完全なもの」との対比と二つの節での反復を保ちながら、自然な日本語で表した。
- source_word: γὰρ
  choice: だからです
  rationale: 前の文を説明する接続関係を、日本語では文末に置くことで自然かつ明確に示した。
- source_word: γινώσκομεν
  choice: 私たちが知っている
  rationale: 認識を表す基本的な意味を保ち、「理解する」などの解釈を加えなかった。
- source_word: καὶ
  choice: ～も
  rationale: 並行する二つの節を結び、後半にも同じ限定が及ぶことを自然な日本語で示した。
- source_word: προφητεύομεν
  choice: 預言する
  rationale: 霊の賜物という文脈における用語を保ち、未来予告や説教のみに意味を限定しなかった。
theological_decisions:
- issue: 教会における預言活動の意味
  choice: 「預言する」と訳し、意味の幅を保つ。
  alternative: 「未来のことを予告する」または「説教する」
  rationale: 原語は霊感による預言的発言を広く指し得るため、未来予告や一般的な説教のどちらかに限定しない。
- issue: 「一部分」の及ぶ範囲
  choice: 知ることと預言することの双方に同じ表現を用いる。
  alternative: 「不完全に」などと解釈的に言い換える。
  rationale: ἐκ μέρους が両節で反復されていることを保ち、次節の「完全なもの」との対比を読者に委ねる。
translation_notes:
  register: 明瞭で現代的な標準語を用いた。「だからです」を文末に置いて γὰρ の説明的関係を自然に表し、二つの並行節では「一部分」を反復して原文の強調を保った。
