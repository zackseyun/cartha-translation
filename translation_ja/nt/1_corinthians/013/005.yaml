id: 1CO.13.5
reference: 1 Corinthians 13:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἀσχημονεῖ, οὐ ζητεῖ τὰ ἑαυτῆς, οὐ παροξύνεται, οὐ λογίζεται τὸ κακόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: ja
  text: 不適切な振る舞いをせず[a]、自分のものを求めず[b]、いらだたず[c]、悪を数に入れません[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恥ずべき振る舞いをせず」「無作法に振る舞わず」。
    reason: ἀσχημονεῖは、礼儀に反することに限らず、恥ずべき・不適切な振る舞いを広く表しうるため。
  - marker: b
    text: 直訳「自分自身のものを求めず」。すなわち、自分の利益や意向ばかりを追い求めないこと。
    reason: ギリシア語の所有表現と、その慣用的な自己追求の意味を併せて示すため。
  - marker: c
    text: 別訳「怒りに駆られず」。原文に「すぐに」「容易に」に当たる語はありません。
    reason: παροξύνεταιの怒り・苛立ちの意味と、強意副詞を補わない判断を明示するため。
  - marker: d
    text: 別訳「受けた悪を心に記録しません」。直訳的には「悪を勘定に入れません」。
    reason: λογίζεταιの会計的比喩と、対人関係の文脈で「受けた悪を記録する」と理解する可能性の両方を示すため。
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: 礼を失する振る舞いをせず
  rationale: 社会的・道徳的にふさわしくない、恥ずべき振る舞いをするという意味を保ちつつ、単なる無礼さだけに狭めない表現とした。
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: 自分のものを求めず
  rationale: 直訳的な「自分自身のものを求める」という表現を自然な日本語にし、自己利益や自分の意向だけを追うという含みを残した。
- source_word: παροξύνεται
  choice: いらだたず
  rationale: 鋭く刺激され、怒りや苛立ちを起こす意味を簡潔に表した。「すぐに」など原文にない程度の副詞は加えていない。
- source_word: λογίζεται τὸ κακόν
  choice: 悪を数え上げません
  rationale: λογίζεται の計算・勘定の比喩と、τὸ κακόν の単数形をできるだけ保った。文脈上は受けた悪を心に記録する意味にも理解できるため、脚注で示した。
- source_word: ἀγάπη（文脈上の主語）
  choice: 省略された主語として「愛」を承ける
  rationale: 前節から続く「愛」の擬人化された叙述であり、日本語では各句に主語を繰り返さず自然に連ねた。
theological_decisions:
- issue: παροξύνεται に「すぐに／容易に」を補うか
  choice: いらだたず
  alternative: すぐに腹を立てず
  rationale: 原文には程度や頻度を示す副詞がないため、愛が刺激にどう反応するかを限定せずに訳した。
- issue: λογίζεται τὸ κακόν を慣用的に展開するか
  choice: 悪を数え上げません
  alternative: 受けた悪を心に記録しません
  rationale: 勘定の比喩と単数形を本文で保ちつつ、対人関係で受けた悪を記録しないという有力な文脈的理解を脚注に置いた。
- issue: τὸ κακόν を一般的な「悪」とするか、被害として限定するか
  choice: 悪
  alternative: 受けた悪／不当な仕打ち
  rationale: ギリシア語は対象を明示せず、「悪」「悪事」「害」の幅を持つ。本文では曖昧さを保ち、脚注で文脈的な読みを示した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある聖書本文。並列のリズムを保つため各句を「〜ず」でつなぎ、末尾を丁寧な「ません」で結んだ。「礼を失する」は日常語よりやや格調があるが理解可能で、ἀσχημονεῖ の社会的・道徳的な幅を保つ。
