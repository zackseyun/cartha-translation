source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: ja
  text: 愛は決して絶えません。[a] しかし、預言は廃され、異言はやみ、知識は廃されます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「愛は決して失敗しません」。直訳「愛は決して倒れません」。
    reason: lexical_alternative
  - marker: b
    text: 「預言」と「知識」には、原文で同じ動詞が使われています。「異言」に用いられた動詞は異なります。
    reason: cross_reference
lexical_decisions:
- source_word: Ἡ ἀγάπη
  choice: 愛
  rationale: 文脈上、人に対する単なる好意より広い、パウロが論じる愛を自然かつ簡潔に表す。
- source_word: οὐδέποτε πίπτει
  choice: 決して絶えることがありません
  rationale: πίπτειの字義的な「倒れる」ではなく、ここでの愛の永続性を現代日本語で明瞭に示す。ただし後続の動詞との違いを完全に失わないよう、脚注に別訳を示す。
- source_word: προφητεῖαι
  choice: 預言
  rationale: 預言の働きまたは預言的発言を指す複数形を、日本語で集合的に自然な「預言」とした。
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: 廃れ／廃れます
  rationale: 機能しなくなる、無用になるという意味を表し、消滅を過度に強調しない。同じ動詞を両節で同じ語に訳した。
- source_word: γλῶσσαι
  choice: 異言
  rationale: コリント第一12―14章で論じられる賜物を指す定着した用語であり、その現象の厳密な性質を訳文で決めつけない。
- source_word: παύσονται
  choice: やみ
  rationale: 「止む」という自然な自動詞で、καταργέωに用いた「廃れる」との語の違いを保つ。
- source_word: γνῶσις
  choice: 知識
  rationale: 直後の部分的な知識についての議論にもつながる、通常の意味を保つ。
theological_decisions:
- issue: πίπτειが表す愛の永続性
  choice: 愛は決して絶えることがありません
  alternative: 愛は決して失敗しません／愛は決して倒れません
  rationale: 愛が終わらないという文脈上の対比を明瞭にする一方、原語の比喩的な幅を脚注で保持した。
- issue: γλῶσσαιの意味
  choice: 異言
  alternative: 言語
  rationale: この章群でのカリスマ的現象を示す文脈的な用語を採用し、それが既知の外国語か別種の発話かという論争は解決しない。
- issue: καταργέωとπαύωの区別
  choice: 「廃れる」と「やむ」を訳し分ける
  alternative: すべてを「終わる」とする
  rationale: 原文が用いる異なる動詞を反映しつつ、預言と知識には同じκαταργέωが使われていることも訳語の反復で示す。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた敬体。三つの並行節では「なら」を反復してギリシア語の構造を保ち、簡潔で朗読しやすい形にした。
