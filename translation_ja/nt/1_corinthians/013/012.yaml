  source_fidelity: 主要な時間的対照（ἄρτι／τότε）、一人称複数から一人称単数への移行、鏡による媒介的な視覚、部分的な知識と将来のより十分な知識との対照、そして受動態で行為者を明示しない点は、全体として原文に忠実です。ただし「謎のうちに見ています」は日本語として不自然で意味を取りにくく、ἐν αἰνίγματιの比喩的・謎めいた様態を、より明瞭に表す必要があります。
