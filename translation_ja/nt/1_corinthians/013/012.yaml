revisions:
- from: 今、私たちは鏡を通して、謎のうちに見ています[a]。しかし、その時には、顔と顔を合わせて見ることになります。今、私は一部分しか知りません。しかし、その時には、私が十分に知られているのと同じように、私も十分に知ることになります。
  to: 今、私たちは鏡を通して、謎めいたしかたで見ています[a]。しかし、その時には、顔と顔を合わせて見ることになります。今、私は部分的にしか知りません。しかし、その時には、私が十分に知られているのと同じように、私も十分に知ることになります。
  rationale: 本文の「謎のうちに」を、αἴνιγμαの比喩的意味を保ちながら自然な現代日本語となる「謎めいたしかたで」に改めました。直訳的な名詞表現と「ぼんやりと」という代替訳の可能性は脚注に残しています。また、「一部分しか知りません」を「部分的にしか知りません」に改め、知識そのものが限定的であるという原文の対照を明確にしました。その他は原文の構文上の省略、受動態の曖昧さ、および神学的な含意の節度を保持しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:00Z'
