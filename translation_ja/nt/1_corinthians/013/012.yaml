reference: 1 Corinthians 13:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: ja
  text: 今、私たちは鏡を通して、謎めいたしかたで見ています[a]。しかし、その時には、顔と顔を合わせて見ることになります。今、私は部分的にしか知りません。しかし、その時には、私が十分に知られているのと同じように、私も十分に知ることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語を直訳すると「謎のうちに」または「謎として」です。間接的で、はっきり理解しきれない見え方を表します。「ぼんやりと」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: 私たちは…見ています
  rationale: 現在形と視覚の比喩を保ち、自然な現代日本語とした。
- source_word: ἄρτι
  choice: 今
  rationale: τότε（その時）との時間的対照を簡潔に示す。
- source_word: δι’ ἐσόπτρου
  choice: 鏡を通して
  rationale: 属格を伴うδιάの媒介的表現を保つ。古代の鏡による間接的な見え方を含みうるが、本文では解釈を限定しない。
- source_word: ἐν αἰνίγματι
  choice: 謎のうちに
  rationale: αἴνιγμαの名詞的比喩を保ち、単に「ぼんやり」と解釈して置き換えない。日本語で意味を補うため脚注を付した。
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: 顔と顔を合わせて
  rationale: 直接的で媒介のない対面を表す自然な日本語表現。後続の動詞は文脈上補った。
- source_word: γινώσκω ἐκ μέρους
  choice: 私は一部分しか知りません
  rationale: 部分的な知識であることを自然な日本語で明確にし、未来の十分な知識との対照を保つ。
- source_word: ἐπιγνώσομαι
  choice: 私も十分に知ることになります
  rationale: γινώσκωとの語彙的連続性と強意を示しつつ、全知を意味する「すべてを知る」は避けた。
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: 私が十分に知られているのと同じように
  rationale: 受動態のまま、知る主体を原文同様に明示しない。前のἐπιγνώσομαιとの対応も「十分に知る／知られている」で保った。
theological_decisions:
- issue: 未来のἐπιγνώσομαιが表す知識の範囲
  choice: 十分に知る
  alternative: 完全に知る／すべてを知る
  rationale: 現在の部分的知識との強い対照は示すが、信者が神と同じ全知を得るとの含意は持ち込まない。
- issue: ἐπεγνώσθηνの暗黙の行為者
  choice: 行為者を明示せず「知られている」とする
  alternative: 神に十分に知られている
  rationale: 文脈上は神が想定されうるが、ギリシア語本文は行為者を明記していないため、その余地を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。現在と未来の対照を反復して示し、視覚から知識への比喩の移行と、原文の一人称複数から一人称単数への移行を保持した。
