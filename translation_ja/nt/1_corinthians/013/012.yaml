  terminology: 「鏡を通して」「顔と顔を合わせて」「部分的にしか知りません」「十分に知る」は適切です。「十分に知る／十分に知られている」はἐπιγινώσκωの対応を保ちつつ、将来の全知を不必要に含意しません。受動態の行為者も明示しません。脚注ではαἴνιγμαのより直訳的な語感（「謎のうちに」「謎として」）を示し、本文の自然な表現が単なる視覚の暗さだけを意味しないことを説明します。
  issues:
