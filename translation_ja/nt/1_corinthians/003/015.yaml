id: 1CO.3.15
reference: 1 Corinthians 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: ja
  text: もし、ある人の働きが焼き尽くされれば、その人は損失を被ります。しかし、その人自身は、火の中を通るようにして救われます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ただ、火を通るようにして」、または「火事から逃れる人のように」。
    reason: 結びの句は簡潔な比喩であり、火を通過すること自体を強調する読みと、危うく逃れる様子を表す読みが可能なため。
lexical_decisions:
- source_word: εἴ τινος
  choice: もし、ある人の
  rationale: 条件文と不定の人物を、明瞭で自然な現代日本語にした。
- source_word: τὸ ἔργον
  choice: 働き
  rationale: 文脈上、建てる者の務めとその成果を指すため。「わざ」より現代的でありつつ、単なる行為に狭めない。
- source_word: κατακαήσεται
  choice: 焼き尽くされれば
  rationale: 完全に焼かれて失われるという強意を保った。
- source_word: ζημιωθήσεται
  choice: 損失を被ります
  rationale: 損失の具体的内容を本文以上に限定せず、受動的に損害を受ける意味を表した。
- source_word: αὐτὸς δὲ σωθήσεται
  choice: しかし、その人自身は救われます
  rationale: 働きが失われることと本人が救われることとの対照、およびαὐτόςの強調を保持した。
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: ただし、火をくぐるようにしてです
  rationale: διάの通過のイメージと簡潔な比喩を保ち、浄化か辛うじての脱出かを断定しない表現とした。
theological_decisions:
- issue: 結びの火の比喩を、特定の教理的な意味に限定するか
  choice: 「ただし、火をくぐるようにして」として比喩と曖昧さを保持した。
  alternative: 「ただ火をくぐり抜けるように」「火事から逃れる人のように」「清めの火を通って」
  rationale: ギリシア語は救いのあり方を火の通過にたとえるが、その機序を説明していないため、煉獄的浄化や辛うじての脱出のどちらにも固定しない。
translation_notes:
  register: 明瞭な現代標準語の丁寧体。「その人自身」で対照を明示し、火の比喩は説明しすぎず、格調と読みやすさを両立させた。
