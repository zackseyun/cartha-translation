  text: ですから、だれも人を誇ってはなりません。すべてはあなたがたのものだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す推論的な接続語として、現代日本語で自然かつ明確にした。
- source_word: μηδεὶς
  choice: だれも……してはなりません
  rationale: すべての人に及ぶ禁止を、明瞭な標準日本語で表した。
- source_word: καυχάσθω
  choice: 誇りとしてはなりません
  rationale: 単に称賛することではなく、誇りや自負のよりどころとする意味を表しつつ、文脈を説明しすぎない表現とした。
- source_word: ἐν ἀνθρώποις
  choice: 人を誇りとして
  rationale: ἐν は誇りの根拠・対象を示し、ἀνθρώποις は性別を限定しない人間一般を指す。日本語の「人」はこの包括性を自然に保つ。文脈上は教会の指導者たちを特に指しうるため脚注で示した。
- source_word: πάντα
  choice: すべて
  rationale: 中性複数の包括的な広がりを簡潔に保ち、後続節とのつながりも自然にした。
- source_word: γὰρ
  choice: だからです
  rationale: 禁止の根拠を示す機能を、日本語では節末の理由表現で自然に表した。
- source_word: ὑμῶν ἐστιν
  choice: あなたがたのもの
  rationale: 所有を直接的に表し、複数二人称も明示した。
theological_decisions:
- issue: 「人」（ἀνθρώποις）が指す範囲
  choice: 本文では一般的な「人」とする
  alternative: 「人間の指導者たち」と明示する
  rationale: 直前のパウロ、アポロ、ケファをめぐる議論から指導者たちが念頭にある可能性は高いが、ギリシア語自体はより広い語なので、本文ではその幅を保ち、文脈的な読みを脚注に置いた。
- issue: 「すべて」（πάντα）の包括性
  choice: 限定語を加えず「すべて」とする
  alternative: 「すべての指導者」などに限定する
  rationale: 次節以降で列挙が広く展開されるため、本文でもパウロの包括的な表現と神学的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「してはなりません」で勧告の厳粛さを保った。「人間」より簡潔で自然な「人」を選び、性別を限定しない原語の用法を反映した。
