id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: ja
  text: すでに据えられている土台以外に、だれも別の土台を据えることはできないからです。その土台とは、メシアであるイエス[a]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエス・キリスト」。
    reason: Χριστόςを称号の意味が分かるよう「メシア」と訳す代わりに、伝統的な音写を示す。
lexical_decisions:
- source_word: θεμέλιον
  choice: 土台
  rationale: 建築の比喩を明確に保ち、直前から続くパウロの建築用語にも自然に合う。
- source_word: γὰρ
  choice: からです
  rationale: 前節の命令・警告の根拠を示す説明的な接続を、日本語の文末表現で自然に示す。
- source_word: ἄλλον
  choice: 別の
  rationale: すでに据えられた唯一の土台とは異なる土台、という対比を明確にする。
- source_word: οὐδεὶς δύναται θεῖναι
  choice: だれも……据えることはできない
  rationale: 能力・可能性の全面的否定を保ちつつ、土台との自然な語の組み合わせとして「据える」を用いる。
- source_word: παρὰ τὸν κείμενον
  choice: すでに据えられている土台以外に
  rationale: παράの排他的意味と、κεῖμαιが表す現在も据えられた状態にあることを自然な日本語で表す。
- source_word: ὅς ἐστιν
  choice: その土台とは……です
  rationale: 関係代名詞が「土台」を受け、それをイエスと同定している構造を、読みやすい独立文で明示する。
- source_word: Ἰησοῦς Χριστός
  choice: メシアであるイエス
  rationale: Ἰησοῦςを固有名として音写し、Χριστόςの称号としての意味を現代日本語で明確に伝える。
theological_decisions:
- issue: Ἰησοῦς ΧριστόςにおけるΧριστόςの訳し方
  choice: メシアであるイエス
  alternative: イエス・キリスト
  rationale: Χριστόςの称号的意味を訳出しつつ、「イエス・キリスト」という伝統的で広く知られた表記も脚注に残す。
- issue: 土台とイエスとの同定
  choice: 「その土台とは」と明示してイエスと同定する
  alternative: 一文の関係節で「それは……である」と訳す
  rationale: 比喩を解消せず、文法上の先行詞が「土台」であることと、土台がイエスであるという神学的同定をともに保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「基礎」よりも建築比喩が日常的に伝わりやすい「土台」を採用し、原文の一文は理解しやすさのため二文に分けた。
