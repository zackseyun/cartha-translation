  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: ja
  text: この世の知恵は、神の前では愚かなものです。実際、こう書かれています。「神は、知恵ある者たちを、彼ら自身の悪知恵によって捕らえる。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφία
  choice: 知恵
  rationale: 文脈上、人間が知恵と見なすものを指すため、自然で標準的な「知恵」とした。
- source_word: κόσμου τούτου
  choice: この世の
  rationale: 現在の人間中心の世界秩序を指す表現として、現代日本語で自然な「この世の」とした。
- source_word: μωρία
  choice: 愚か
  rationale: パウロが同じ文脈で用いる「知恵」との対比を明確にしつつ、自然な述語表現とした。
- source_word: παρὰ τῷ θεῷ
  choice: 神の前では
  rationale: 神の観点・評価においてという意味を、簡潔かつ自然に表す。
- source_word: γέγραπται
  choice: こう書かれています
  rationale: 聖書引用を導入する定型句を、明瞭な現代日本語で表した。
- source_word: δρασσόμενος
  choice: 捕らえる
  rationale: つかむ、または逃れられないように捕捉する含意を保ち、引用の比喩に合う語を選んだ。
- source_word: σοφοὺς
  choice: 知恵ある者たち
  rationale: 性別を不必要に限定せず、知者を指す複数形を明示した。
- source_word: πανουργίᾳ
  choice: 悪知恵
  rationale: 単なる賢さではなく、道徳的に否定的な狡猾さや策略を指すため、日本語として分かりやすい「悪知恵」とした。
theological_decisions:
- issue: ヨブ記5章13節からの引用における神の主語の表現
  choice: 「神は」と明示する
  alternative: 「知恵ある者たちを……捕らえる方」とする
  rationale: ギリシア語の冠詞付き分詞が文脈上、神を指すことを自然な日本語で明示した。神が人間の知恵を覆すという主張を保ち、追加の教理的解釈は加えていない。
- issue: ἐν τῇ πανουργίᾳ αὐτῶν が手段か領域・状況か
  choice: 「彼ら自身の悪知恵によって」
  alternative: 「彼ら自身の悪知恵の中で」
  rationale: ἐν はここで手段またはその策略のただ中という幅を持ち得るが、引用の意味を明瞭にするため手段的に訳した。「自身の」により、彼らの策略が彼らを捕らえる逆転を表した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「神の前では」により評価の観点を自然に示し、引用は簡潔な断定文とした。
