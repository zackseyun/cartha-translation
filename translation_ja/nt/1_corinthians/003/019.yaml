review_pass:
  verdict: revise
  source_fidelity: 冒頭の γάρ は根拠を示し、παρὰ τῷ θεῷ は神の評価・観点を示す。「神の前では」は適切である。一方、「愚かだからです」はコピュラ文 ἐστιν を理由節のようにしており、節単独では不自然かつ意味関係を曖昧にするため、「愚かなものです」とするのが忠実である。引用の「神は」「知恵ある者たち」「彼ら自身の悪知恵によって捕らえる」は、冠詞付き分詞の神を指す用法、複数形、および否定的な πανουργία を適切に反映する。
  naturalness: 「この世の知恵は、神の前では愚かなものです。実際、こう書かれています」は明瞭な現代標準日本語であり、二つの γάρ が果たす根拠提示の流れも自然に表す。
  terminology: 「知恵」「この世」「神」「愚かなもの」「悪知恵」は文脈に適合する。「悪知恵」は πανουργία の狡猾で倫理的に否定的な響きを分かりやすく保つ。
  issues:
  - severity: medium
    issue: 「愚かだからです」が述語 ἐστιν を理由表現へ変えている。
    rationale: 原文は「この世の知恵は神のもとで愚かさ／愚かなものである」という断定である。「だからです」は前提となる問いや先行文を要求しやすく、この一節単独では不自然で、構文上も忠実さを損なう。
  revised_text: この世の知恵は、神の前では愚かなものです。実際、こう書かれています。「神は、知恵ある者たちを、彼ら自身の悪知恵によって捕らえる。」
