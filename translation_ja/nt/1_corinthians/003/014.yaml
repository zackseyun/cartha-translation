  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: ja
  text: もしだれかがその上に建てたものが残るなら、その人は報い[a]を受けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「報酬」または「賃金」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: もし～なら
  rationale: 単純な条件節を自然な現代日本語で表す。
- source_word: τινος
  choice: だれかが／その人は
  rationale: 不定代名詞の属格が示す『だれかの働き』という関係を、日本語では建てる者を主語にした節と後半の『その人』で明確に表す。
- source_word: τὸ ἔργον
  choice: 建てたもの
  rationale: 直訳的な『働き』よりも、直後の建築比喩と自然につながる。建て上げた成果を指しつつ、内容を過度に限定しない。
- source_word: μενεῖ
  choice: 残る
  rationale: μένωの基本義を保ち、火による試験を切り抜けるという文脈上の含みを説明的に言い足さない。
- source_word: ὃ ἐποικοδόμησεν
  choice: その上に建てた
  rationale: ἐποικοδομέωが土台の上に建てることを表すため、『その上に』で前文脈の土台を受ける。ギリシア語にない具体的な対象は補わない。
- source_word: μισθὸν
  choice: 報い
  rationale: 評価に応じて与えられるものという文脈に適し、経済的な賃金だけに狭めない。別訳の可能性は脚注に示す。
- source_word: λήμψεται
  choice: 受けます
  rationale: λαμβάνωの未来形を、明瞭で品位ある現代日本語として訳す。
theological_decisions:
- issue: 『報い』の性質
  choice: 報い
  alternative: 賃金／報酬
  rationale: 何が与えられるかを具体化せず、μισθόςが持つ応報・対価の幅を保つ。救済そのものなどと同一視する解釈は本文に持ち込まない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。建築比喩を保ちながら、主語の反復を避けすぎず、『だれか』を後半で『その人』と受けて意味を明確にした。
