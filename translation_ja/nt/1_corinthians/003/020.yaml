  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: ja
  text: また、こうもあります。「主は、知恵ある者たちの思いが空しいことを知っておられる。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「思い」は「考え」または「推論」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 詩篇94:11からの引用（七十人訳では93:11）。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: また、こうもあります
  rationale: 第二の聖書引用を導入する表現として、簡潔で自然な現代日本語にした。
- source_word: Κύριος
  choice: 主
  rationale: 聖書引用における κύριος の標準的で簡潔な訳語。
- source_word: γινώσκει
  choice: 知っておられる
  rationale: 単純な認識を表すとともに、主を主語とする文にふさわしい自然な敬意を示す。
- source_word: τοὺς διαλογισμοὺς
  choice: 思い
  rationale: 思考や推論を含みうる語を、文脈に合う自然で広い日本語にした。
- source_word: τῶν σοφῶν
  choice: 知恵ある者たちの
  rationale: 名詞的に用いられた形容詞を性別を限定せずに表し、周辺文脈の「知恵」との語彙的つながりも保った。
- source_word: ὅτι
  choice: ことを
  rationale: 原因ではなく、主が知っている内容を導く節として訳した。
- source_word: μάταιοι
  choice: 空しい
  rationale: 実質や有効性に欠けるという意味を、簡潔で格調を失わない現代日本語で表した。
theological_decisions:
- issue: τῶν σοφῶν が指す「知恵ある者たち」の評価
  choice: 引用文どおり「知恵ある者たち」とし、皮肉や「この世の」を本文に補わない
  alternative: 「この世で知恵ある者たち」または「賢いとうぬぼれる者たち」
  rationale: 周辺文脈にはこの世の知恵への批判があるが、この節のギリシア語本文自体に限定句や明示的な皮肉表現はないため、解釈を訳文へ取り込まない。
translation_notes:
  register: 明瞭で現代的かつ端正な聖書文体。「こうもあります」により引用導入を自然にし、引用内部は簡潔な宣言として整えた。
