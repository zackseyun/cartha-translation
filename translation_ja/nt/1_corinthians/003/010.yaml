reference: 1 Corinthians 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: ja
  text: 私に与えられた神の恵みに従って、私は知恵ある棟梁[a]のように土台を据え、別の人がその上に建てている。しかし、各自、どのように建てるかに注意しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「知恵ある建築責任者」。ギリシア語は、建築を指揮・監督する棟梁や主任建築者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: 〜に従って
  rationale: 与えられた恵みとの一致・対応を表し、単なる手段とは限定しない自然な訳。
- source_word: χάριν
  choice: 恵み
  rationale: 神から無償で与えられる好意と働きのための力という、パウロ書簡での神学的な含みを保つ。
- source_word: σοφὸς ἀρχιτέκτων
  choice: 熟練した棟梁
  rationale: σοφόςの知恵と技能の含み、およびἀρχιτέκτωνが古代に建築を指揮する責任者を指したことを、現代日本語で分かりやすく表す。
- source_word: θεμέλιον ἔθηκα
  choice: 土台を据え
  rationale: 建築比喩に自然な日本語であり、不定冠詞のない日本語では文脈上特定しすぎずに表現できる。
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: ほかの人がその上に建てています
  rationale: 複合動詞の『すでにある土台の上に建てる』という意味を明示し、現在形の継続的な働きも自然に示す。
- source_word: ἕκαστος δὲ βλεπέτω
  choice: しかし、一人ひとり、…注意しなさい
  rationale: 分配的な単数と警戒を促す命令の力を、性別を不必要に限定せず明確に伝える。
- source_word: πῶς ἐποικοδομεῖ
  choice: 自分がどのように建てるか
  rationale: 二度目の動詞にも土台の上に建てる意味が含まれるが、日本語では目的語を繰り返さず自然に警告を表す。
theological_decisions:
- issue: ἕκαστοςの男性単数形の代表的用法
  choice: 「一人ひとり、自分が」と訳す
  alternative: 「各人が彼自身どのように」と男性形を表面上反映する
  rationale: 文法上は男性単数だが、意味上は建てる者それぞれを一般的に指す。日本語では「一人ひとり、自分が」が単数的・分配的な力を保ち、男性だけに限定しない。
- issue: 神の恵みとパウロの働きの関係
  choice: 「神の恵みに従って」
  alternative: 「神の恵みによって」
  rationale: κατάはここで恵みを単なる手段と断定するより、パウロの働きが与えられた恵みに対応していることを表すため、その関係を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「棟梁」は建築比喩と指揮者としての役割を簡潔に伝えるが、意味範囲を補うため脚注を付した。命令は共同体全体への厳粛な警告として「注意しなさい」とした。
