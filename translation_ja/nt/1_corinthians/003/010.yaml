revisions:
- from: 私に与えられた神の恵みに従って、私は熟練した棟梁[a]のように土台を据え、ほかの人がその上に建てています。しかし、一人ひとり、自分がどのように建てるかに注意しなさい。
  to: 私に与えられた神の恵みに従って、私は知恵ある棟梁[a]のように土台を据え、別の人がその上に建てている。しかし、各自、どのように建てるかに注意しなさい。
  rationale: 普通体に統一し、分配的な命令を「各自」として自然に表現した。「知恵ある棟梁」として、σοφόςの評価的含みとἀρχιτέκτωνの建築上の役割をともに保持した。二度目の「建てる」は、直前の「その上に建てている」から土台の上に建てる意味が明白なため、日本語として自然に省略した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:21Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として建築の比喩と、すでに据えられた土台の上に別の者が建てるという意味をよく伝えています。ただし、σοφόςは単に技術的な「熟練」だけでなく「知恵ある」の含みを持つため、本文では「知恵ある」とするのがより直接的です。
  naturalness: 原文は「建てています」と「注意しなさい」が文体上混在しています。また、「一人ひとり、自分がどのように建てるかに注意しなさい」は係り方がやや不自然です。「各自、どのように建てるかに注意しなさい」とすれば、分配的な命令を自然な現代日本語で表せます。
  terminology: 「恵み」「土台」は適切です。「棟梁」は理解可能ですが、現代では職人のイメージが強いため、「建築の責任者」という補足脚注を残すのが有益です。「知恵ある棟梁」はσοφὸς ἀρχιτέκτωνの両要素を保ちます。
  issues:
  - severity: medium
    issue: 文体の混在と命令文の不自然さ
    rationale: 「建てています」は丁寧体である一方、「注意しなさい」は普通体の命令です。また「一人ひとり、自分が…注意しなさい」は主題・主語の関係がぎこちなく聞こえます。
  - severity: low
    issue: σοφόςの訳語が「熟練した」に限定されている
    rationale: 「熟練した」は技能面を適切に示しますが、σοφόςの「知恵ある／賢明な」という評価的含みを本文で落とします。
  revised_text: 私に与えられた神の恵みに従って、私は知恵ある棟梁[a]のように土台を据え、別の人がその上に建てている。しかし、各自、どのように建てるかに注意しなさい。
