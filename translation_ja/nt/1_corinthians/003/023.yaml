  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: ja
  text: そして、あなたがたはメシアのもの、メシアは神のものです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 二人称複数を明示し、コリントの信徒たち全体への呼びかけを自然な現代日本語で表す。
- source_word: δὲ
  choice: そして
  rationale: ここでは直前から続く帰属関係の連鎖を受けつつ展開する接続辞であり、「そして」が流れと軽い対照の双方を無理なく伝える。
- source_word: Χριστοῦ
  choice: メシアのもの
  rationale: 属格による帰属を表し、Χριστόςの称号としての意味を「メシア」で保つ。
- source_word: Χριστὸς
  choice: メシア
  rationale: 前半と同じ称号を反復し、原文の簡潔な対句と修辞的対称性を保つ。
- source_word: θεοῦ
  choice: 神のもの
  rationale: 属格による帰属・関係を、説明を加えすぎず簡潔に示す。
theological_decisions:
- issue: 二つの属格 Χριστοῦ と θεοῦ が示す帰属関係をどう訳すか
  choice: 「あなたがたはメシアのもの、メシアは神のものです」
  alternative: 「あなたがたはメシアに属し、メシアは神に属します」
  rationale: 「のもの」という並行表現により原文の短さと対称性を保ち、メシアと神の関係をそれ以上説明して神学的緊張を解消しない。
translation_notes:
  register: 明快で簡潔な現代標準日本語。原文の省略的な二節構造を生かしながら、前半に主題を明示し、末尾の「です」を両節に自然に及ぼした。
