revisions:
- from: それでは、アポロとは何でしょう。パウロとは何でしょう。二人は、あなたがたを信仰へと導いた奉仕者にすぎず、それぞれ主から与えられたとおりに仕えたのです。[a][b]
  to: それでは、アポロとは何でしょうか。パウロとは何でしょうか。あなたがたが彼らを通して信じた奉仕者であり、主がそれぞれに与えられたとおりです。[a][b]
  rationale: 原文の中性の「何」、διάκονοιの非職制的な「奉仕者」、διάによる媒介、および最終節の省略を保つために改めました。「主」の指示対象は本文で特定せず、また主が与えた内容や二人の具体的な奉仕行為も補いません。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:18Z'
review_pass:
  verdict: revise
  source_fidelity: 現行訳は「あなたがたを信仰へと導いた」「奉仕者にすぎず」「仕えたのです」として、原文にない因果・限定・動作を加えています。δι’ ὧν ἐπιστεύσατε は「彼らを通して、あなたがたが信じた」であり、信仰へ導いたという表現は安全な明示化の範囲を超えます。また最終節は主が何を与えたかを省略しており、「仕えた」を補うことは省略された目的語だけでなく動詞的内容を確定してしまいます。
  naturalness: 修正版は明快な現代標準日本語を保ちつつ、原文の修辞疑問と簡潔さを反映します。最終節は日本語でも多少の省略感を残しますが、これは原文の省略を保存するためであり、注で説明します。
  terminology: 「アポロ」「パウロ」「奉仕者」「主」は適切です。「奉仕者にすぎず」は原文に明示されない評価的限定なので削除します。「彼らを通して信じた」は媒介を自然に示し、信仰の対象を彼らとする意味にはなりません。
  issues:
