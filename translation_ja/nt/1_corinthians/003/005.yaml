id: 1CO.3.5
reference: 1 Corinthians 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: ja
  text: それでは、アポロとは何でしょうか。パウロとは何でしょうか。あなたがたが彼らを通して信じた奉仕者であり、主がそれぞれに与えられたとおりです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らを通して信じた」は、彼らが信仰に至るための媒介者であったことを表します。
    reason: translation_clarity
  - marker: b
    text: 「主がそれぞれに与えられたとおり」は原文でも省略を含み、主が何を与えたかは明示されていません。「主がそれぞれに割り当てたとおり」と訳すこともできます。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: 何でしょう
  rationale: 中性疑問代名詞を反映し、人物の身元ではなく、その役割や立場を問う修辞として訳した。
- source_word: οὖν
  choice: それでは
  rationale: 前の議論を受けた推論的・移行的な働きを、自然な現代日本語で表す。
- source_word: διάκονοι
  choice: 奉仕者
  rationale: ここでは教会職としての「執事」に限定されず、仕える者・働き手を指すため。
- source_word: δι’ ὧν ἐπιστεύσατε
  choice: あなたがたを信仰へと導いた
  rationale: διάの媒介性を示しつつ、日本語として自然に、彼らが信仰の対象ではなく信じるための媒介者だったことを表す。
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: それぞれ主から与えられたとおりに仕えた
  rationale: ギリシア語の省略を日本語で理解可能にするため文脈上の「仕えた」を補ったが、主が具体的に何を与えたかは限定しない。
- source_word: κύριος
  choice: 主
  rationale: 固有の神学的称号を保ち、本文では指示対象を過度に特定しない。
theological_decisions:
- issue: 「主」（κύριος）の指示対象
  choice: 本文では「主」とのみ訳す
  alternative: 「主イエス」または「神」と明示する
  rationale: 文脈上は主イエスを指す可能性が高いが、原文自体は固有名を添えていないため、本文で限定しない。
- issue: 「主がそれぞれに与えた」の省略
  choice: 奉仕の動作を補い、与えられた内容は明示しない
  alternative: 「務めを割り当てられたとおりに」
  rationale: 日本語として文を成立させながら、「務め」「役割」「賜物」など原文にない特定の目的語を持ち込まない。
- issue: パウロとアポロの位置づけ
  choice: 「奉仕者にすぎず」と訳す
  alternative: 単に「奉仕者です」とする
  rationale: 直前の修辞疑問と文脈にある指導者崇拝の抑制を自然な日本語で示す。ただし彼らの奉仕を軽蔑する意味ではない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、修辞疑問には品位を保った。「何者でしょう」では身元や価値を問う響きが強くなり得るため、「何でしょう」とした。原文の省略は完全な逐語形では日本語として不自然になるので最小限補った。
