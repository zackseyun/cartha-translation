  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: ja
  text: だれも自分を欺いてはなりません。あなたがたの中で、この時代において自分は賢いと思っている人は[a]、賢くなるために、愚かになりなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この時代の基準で自分は賢いと思っている人は」。
    reason: lexical_alternative
  - marker: b
    text: または「愚か者になりなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: だれも自分を欺いてはなりません
  rationale: 禁止命令の普遍的な否定と、明示された再帰代名詞を、自然で明確な現代日本語で保持した。
- source_word: εἴ τις δοκεῖ σοφὸς εἶναι
  choice: 知恵ある者だと思っている人がいるなら
  rationale: δοκεῖをここでは自己評価を表す「思っている」とし、条件節の意味を明確にした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの中に
  rationale: コリントの共同体に属する人を指す自然な表現とした。
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: この時代において
  rationale: αἰώνの時間的・神学的な含みを保ち、「世界」と広く言い換えることを避けた。
- source_word: μωρὸς γενέσθω
  choice: 愚かな者となりなさい
  rationale: 命令の力と、知恵との意図的な逆説をそのまま保った。
- source_word: ἵνα γένηται σοφός
  choice: 知恵ある者となるために
  rationale: ἵναの目的を明示し、愚かになることと知恵ある者になることの緊張関係を保持した。
theological_decisions:
- issue: 「この時代において」が示す知恵の性質
  choice: 本文では「この時代において知恵ある者」とした。
  alternative: 「この時代の基準で知恵ある者」とする。
  rationale: 原文の前置詞句が持つ簡潔さと曖昧さを本文で保ちつつ、基準を表す可能性を脚注で示した。
- issue: 「愚かな者となる」という逆説
  choice: 逆説を説明で和らげず、そのまま訳した。
  alternative: 「世から愚かだと思われる者となる」などと補足する。
  rationale: 原文は誰の評価による愚かさかを明示していないため、解釈上の補足を本文に持ち込まなかった。
translation_notes:
  register: 明快で格調を保った現代標準日本語。共同体への勧告として丁寧体を用い、個々の該当者に向けられた単数命令は「その人は……なりなさい」と表した。
