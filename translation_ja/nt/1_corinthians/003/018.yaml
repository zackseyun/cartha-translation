    issue: 条件節と命令の接続が不自然である。
    rationale: 「人がいるなら、その人は……なりなさい」は、第三者を主題にしながらその者に命令する形となり、丁寧体の前文とも調子がそろいにくい。原文の条件的・一般的な勧告は、「……と思っている人は、……なりなさい」と自然に表せる。
  - severity: low
