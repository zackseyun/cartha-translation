revisions:
- from: だれも自分を欺いてはなりません。あなたがたの中に、この時代において知恵ある者だと思っている人がいるなら[a]、その人は、知恵ある者となるために、愚かな者となりなさい[b]。
  to: だれも自分を欺いてはなりません。あなたがたの中で、この時代において自分は賢いと思っている人は[a]、賢くなるために、愚かになりなさい[b]。
  rationale: 条件節を、共同体内の該当者へ直接向けられた自然な一般命令に改めた。「賢い／愚か／賢くなる」という対応で原文の逆説を明瞭に保ち、「この時代において」は本文に残してαἰώνの曖昧さを保持した。脚注aは前置詞句が「この時代の基準で」と理解されうることを示し、脚注bは名詞的な訳語の選択肢を示す。
