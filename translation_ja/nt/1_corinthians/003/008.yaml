  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: ja
  text: 植える者も水を与える者も一つであり[a]、それぞれが自分の労苦に応じて、自分の報いを受けるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「一致している」「同じ目的に仕えている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: 植える者
  rationale: 冠詞付き現在分詞を実体詞的に訳し、農耕の比喩と働き手としての継続的な役割を簡潔に保つ。
- source_word: ποτίζων
  choice: 水を注ぐ者
  rationale: 冠詞付き現在分詞の実体詞的用法を反映し、植物に水を与えるという農耕の比喩を自然な現代日本語で表す。
- source_word: ἕν
  choice: 一つです
  rationale: 中性単数による一致・一体性を簡潔に保持し、同一人物であるとの意味には限定しない。意味上の補足候補は脚注に示す。
- source_word: μισθὸν
  choice: 報い
  rationale: 金銭的賃金だけに狭めず、務めに対して与えられる返報という文脈上の幅を保つ。
- source_word: λήμψεται
  choice: 受けます
  rationale: 未来形を文脈に即した自然な日本語で表し、将来の授与を明確にする。
- source_word: κατὰ
  choice: に応じて
  rationale: 各人の労苦との対応・比例関係を自然に表す。
- source_word: κόπον
  choice: 労苦
  rationale: 単なる作業ではなく、骨折りや疲労を伴う働きという語感を保つ。
- source_word: ἴδιον
  choice: 自分の
  rationale: 二度の反復を訳文でも保持し、労苦と報いが各人に固有であることを強調する。
theological_decisions:
- issue: 「一つである」（ἕν εἰσιν）の意味
  choice: 植える者と水を注ぐ者が一致していることを示す表現として、本文では「一つです」とする。
  alternative: 「一致しています」「目的を一つにしています」
  rationale: 中性単数のἕνは両者の人格的同一性ではなく一致・一体性を示す。文脈上は神のもとで異なる役割を担う奉仕者の一致が中心だが、本文で「目的」に限定せず、原文の簡潔さと含みを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。農耕の比喩をそのまま残し、各人の固有の労苦と報いを示すἴδιονの反復も保持した。
