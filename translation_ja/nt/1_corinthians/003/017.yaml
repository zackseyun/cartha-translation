reference: 1 Corinthians 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: ja
  text: もしだれかが神の神殿を滅ぼすなら[a]、神はその人を滅ぼされます。神の神殿は聖なるものであり、あなたがたはその神殿なのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅ぼす」に当たる二つの動詞は同じ語で、「損なう」または「汚す」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがた」は複数形です。パウロは共同体全体を一つの神の神殿として示しています。
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: 神殿
  rationale: 神が住まわれる聖なる場所を指す語として、現代日本語で自然かつ文脈に適する。「聖所」も可能だが、ここでは共同体を神の神殿とする比喩が明瞭になる。
- source_word: φθείρει / φθερεῖ
  choice: 滅ぼす／滅ぼされます
  rationale: 同じ動詞の反復を保ち、警告の厳しさと行為に対応する神の裁きを表した。語には「損なう」「汚す」の幅もあるため脚注で示した。
- source_word: τοῦτον
  choice: その人
  rationale: 先行する不定代名詞 τις を受ける単数の人物指示を、性別を限定せず自然な日本語で表した。
- source_word: ἅγιος
  choice: 聖なる
  rationale: 神に属し、取り分けられた神聖さを簡潔かつ標準的に伝える。
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: その神殿とは、あなたがたのこと
  rationale: 単数の「神殿」と複数の「あなたがた」の同定を明瞭にしつつ、原文の強調された複数形を保った。
theological_decisions:
- issue: 神の神殿が個々の信者を指すか、共同体を指すか
  choice: 複数の「あなたがた」全体を一つの神殿として示す
  alternative: 個々の信者それぞれを神殿と読む
  rationale: 原文は単数の ναός と複数の ὑμεῖς を結び付けており、この文脈では会衆を集合的に神の神殿と同定するのが最も自然である。脚注で複数形を明示し、本文自体も「あなたがた」とした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。神の行為には敬語の「滅ぼされます」を用い、原文の条件文、動詞反復、単数の神殿と複数の読者という対照を保持した。
