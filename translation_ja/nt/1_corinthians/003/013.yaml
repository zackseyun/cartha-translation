id: 1CO.3.13
reference: 1 Corinthians 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: ja
  text: 一人ひとりの働きは明らかになります。その日[a]がそれを明らかにするからです。その日が火の中で[b]明らかにされ、その火自体が、一人ひとりの働きがどのようなものかを試します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その日」は、将来、神が評価または裁きを行う日を指すと考えられます。
    reason: cross_reference
  - marker: b
    text: 別訳「火によって」。ギリシア語の表現は「火の中で」とも、手段を表す「火によって」とも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: 一人ひとりの
  rationale: 単数属格の配分的な意味を保ち、各人が個別に評価されることを自然な現代日本語で表す。
- source_word: τὸ ἔργον
  choice: 働き
  rationale: この文脈では建てる者の奉仕とその成果を広く指すため、「行い」よりも文脈に適し、「仕事」よりも品位のある「働き」とした。
- source_word: φανερὸν γενήσεται
  choice: 明らかになります
  rationale: 形容詞と未来形の組み合わせを自然に訳し、将来明白になるという結果を保つ。
- source_word: ἡ ἡμέρα
  choice: その日
  rationale: 定冠詞と文脈が指す特定の、将来の神による評価の日を示す。日本語では大文字表記がないため、脚注で含意を説明する。
- source_word: δηλώσει
  choice: 明らかにする
  rationale: 前節との語彙的なつながりを保ちつつ、隠れていた性質をはっきり示す意味を平明に表す。
- source_word: ἐν πυρὶ
  choice: 火の中で
  rationale: 前置詞句の場所的な読みを本文に保持し、手段を表す「火によって」という可能性は脚注に残す。
- source_word: ἀποκαλύπτεται
  choice: 現され
  rationale: 受動態と、覆いが取り去られて現れるという意味を簡潔に保つ。
- source_word: ὁποῖόν ἐστιν
  choice: どのようなものか
  rationale: 働きの種類・性質・質が吟味されるという幅を、過度に限定せず自然に表す。
- source_word: δοκιμάσει
  choice: 試します
  rationale: 真価や質を確かめるために吟味する意味を、明瞭な現代語で表す。
- source_word: αὐτὸ
  choice: その火自体
  rationale: 強意代名詞の強調を明示し、火そのものが試すというギリシア語の焦点を保つ。
theological_decisions:
- issue: ἡ ἡμέραが一般的な日を指すか、終末における神の評価の日を指すか
  choice: 「その日」と訳し、脚注で将来の神の評価または裁きの日を指すと考えられることを示す。
  alternative: 単に「日」と訳して特定性を弱める。
  rationale: 定冠詞と前後の文脈は特定の将来的な評価の日を指すが、本文だけで詳細な終末論を付加しないよう簡潔に訳す。
- issue: ἀποκαλύπτεταιの主語
  choice: 直近の女性名詞「その日」を主語として明示する。
  alternative: 主語を曖昧にして「火の中で現される」とする、または「働き」が現されると解する。
  rationale: 動詞の単数形と直前の「その日」が最も自然に対応する。ただしギリシア語では主語が明示されておらず、文脈上の曖昧さが完全になくなるわけではない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、終末的な評価という厳粛な文脈にふさわしい品位を保った。「わざ」のような古風な語を避け、「働き」を採用した。原文の接続関係を示すため二文目に「からです」を用い、後半は過度に細分化しなかった。
