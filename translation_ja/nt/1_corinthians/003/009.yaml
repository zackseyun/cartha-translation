  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: ja
  text: 私たちは神に仕える同労者です。[a] あなたがたは神の畑、神の建物です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちは神と共に働く者です」とも訳せる。
    reason: θεοῦ συνεργοίの属格関係は、神に属し神に仕える働き手という理解のほか、神と共に働く者という理解も文法的に可能であるため。
lexical_decisions:
- source_word: γάρ
  choice: だからです
  rationale: 直前の議論を受ける説明・根拠の働きを、現代日本語で自然に示す。
- source_word: συνεργοί
  choice: 同労者
  rationale: 共に働く者という複数名詞の意味を簡潔かつ荘重に保つ。教会用語として知られているが、文脈からも理解できる。
- source_word: θεοῦ（συνεργοίに伴う属格）
  choice: 神に属する
  rationale: 奉仕者たちが神のものであり、神に仕えているという文脈上の重点を明示する一方、『神と共に働く』という別解は脚注に残す。
- source_word: γεώργιον
  choice: 畑
  rationale: 耕作される土地という農耕の比喩を、簡潔で自然な日本語にする。
- source_word: οἰκοδομή
  choice: 建物
  rationale: 後続節で展開される建築の比喩を明瞭に準備する、平明な訳語。
- source_word: ἐστε
  choice: あなたがたは…です
  rationale: ギリシア語の二人称複数を明示し、コリントの共同体全体への呼びかけを保つ。
theological_decisions:
- issue: θεοῦ συνεργοίを『神に属する同労者』と取るか、『神と共に働く者』と取るか
  choice: 神に属する同労者
  alternative: 神と共に働く者
  rationale: 属格には解釈上の幅がある。直前の文脈では、パウロとアポロが神に仕える者であり、すべてが神に属することが強調されるため本文では前者を採るが、後者も文法的に可能なので脚注で保存する。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、聖書本文にふさわしい簡潔で dignified な調子を保った。『同労者』はやや教会的な語だが、『共に働く者』より簡潔で、συνεργοίの名詞性をよく保つ。脚注記号は、争点を含む文全体の後に置いた。
