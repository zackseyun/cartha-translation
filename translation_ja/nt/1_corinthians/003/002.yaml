  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: ja
  text: 私はあなたがたに乳を飲ませ、固い食物[a]は与えませんでした。あなたがたにはまだ無理だったからです。しかし、今でもなお無理なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は一般に「食物」を意味しますが、ここでは乳との対比から「固い食物」と訳しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: 乳
  rationale: 養育の比喩における「乳」を直接表し、βρῶμαとの対比を保つ。
- source_word: ἐπότισα
  choice: 飲ませ
  rationale: 原語の「飲ませる／飲む物を与える」という意味を自然な現代日本語で直接表す。
- source_word: βρῶμα
  choice: 固い食物
  rationale: 語そのものは一般的な「食物」だが、乳との対比から、乳以外のよりしっかりした食物という含意を自然に伝える。一般語であることは脚注に明記する。
- source_word: οὔπω γὰρ ἐδύνασθε
  choice: あなたがたにはまだ無理だったからです
  rationale: 目的語が省略された原文の簡潔さと曖昧さを保ちつつ、過去に能力がなかったことを自然に表す。
- source_word: ἀλλ’ οὐδὲ ἔτι νῦν δύνασθε
  choice: それどころか、今でもまだ無理なのです
  rationale: ἀλλάの強い転換と、οὐδέ・ἔτι・νῦνが示す「今に至ってもなお」という継続的な不能を明確に表す。
theological_decisions:
- issue: 養いの比喩の解釈
  choice: 乳と固い食物という比喩をそのまま保ち、何を飲ませ、何を与えなかったかを訳文に示す。
  alternative: 「初歩的な教えだけを教えた」などと解釈的に言い換える。
  rationale: 原文は教えの段階を抽象語で説明せず、養いの比喩を用いている。適用範囲を訳文で限定せず、比喩と神学的含みを保持する。
- issue: δύνασθεの省略された補語
  choice: 「無理だった／無理なのです」とし、何をする能力かを補わない。
  alternative: 「固い食物を受け入れることができなかった」または「理解できなかった」と補う。
  rationale: 文脈上は固い食物に対応する教えを受ける能力が想定されるが、原文は補語を明示しないため、その簡潔さと余地を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、乳と食物の比喩、および過去と現在の能力を対照する反復を保持した。「それどころか」により後半の強調を自然に示した。
