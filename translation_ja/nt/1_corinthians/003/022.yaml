  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: ja
  text: パウロも、アポロも、ケファも、世界も、いのちも、死も、今あるものも、未来のものも、すべてはあなたがたのものです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: ～も、～も
  rationale: 反復される選択・列挙の構造を、日本語で不自然な「～であれ」を重ねず、包括性のある並列として明瞭に表した。
- source_word: Παῦλος
  choice: パウロ
  rationale: 現代日本語の聖書で広く定着した音写。
- source_word: Ἀπολλῶς
  choice: アポロ
  rationale: 現代日本語で定着した人名の音写。
- source_word: Κηφᾶς
  choice: ケファ
  rationale: 本文が用いるセム語系の名を保ち、「ペテロ」に置き換えない。
- source_word: κόσμος
  choice: 世界
  rationale: 被造世界や世界秩序を広く指し得る語として、自然で十分に包括的な訳語。
- source_word: ζωή
  choice: いのち
  rationale: 「死」と対をなす語として意味を直接伝えつつ、聖書本文にふさわしい自然で格調ある表記。
- source_word: θάνατος
  choice: 死
  rationale: 語の基本的意味を簡潔に保つ。
- source_word: ἐνεστῶτα
  choice: 今あるもの
  rationale: 実質名詞として現在の諸現実を指すことを、現代日本語で明瞭に表す。
- source_word: μέλλοντα
  choice: やがて来るもの
  rationale: 実質名詞として未来の諸現実を指すことを表し、「今あるもの」と自然に対比させる。
- source_word: πάντα
  choice: すべて
  rationale: 人と事物の双方を含む直前の全列挙を総括するため、「すべてのもの」より自然な形を選んだ。
- source_word: ὑμῶν
  choice: あなたがたのものです
  rationale: 属格が示す帰属を直接表現し、コリントの信徒たちへの複数の呼びかけも明示する。
theological_decisions:
- issue: 「すべてはあなたがたのもの」の帰属関係
  choice: 所有・帰属を示す表現をそのまま保つ
  alternative: 「すべてはあなたがたのためにある」
  rationale: 文脈上の機能や益を説明に織り込まず、原文の簡潔で強い属格表現と、その解釈上の幅を保持する。
translation_notes:
  register: 明快な現代標準日本語を用い、列挙の修辞的な勢いと結論の力強さを保った。人名は原文に即して音写し、特にケファをペテロへ置換しなかった。
