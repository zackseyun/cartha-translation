  text: 私は植え、アポロは水をやった。しかし、成長させておられたのは神です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、神が成長を与えた」。
    reason: ηὔξανεν は「成長を与える」とも表現できる。本文の「成長させておられた」は未完了過去が示す継続的な側面を反映する。
lexical_decisions:
- source_word: ἐγὼ
  choice: 私は
  rationale: 明示された代名詞の対比的な力を保ちつつ、現代日本語として自然な主題提示にした。
- source_word: ἐφύτευσα
  choice: 植え
  rationale: 農耕の比喩を簡潔かつ直接的に保ち、後続の「水をやる」「成長させる」と対応させた。
- source_word: Ἀπολλῶς
  choice: アポロ
  rationale: 人名を日本語聖書で一般的な形に音写した。
- source_word: ἐπότισεν
  choice: 水をやりました
  rationale: 植物への給水を表す自然な現代日本語で、農耕の比喩を明瞭に伝える。
- source_word: ἀλλὰ
  choice: しかし
  rationale: 人間の働きと神の決定的な働きとの強い対照を明示する。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 成長を生じさせる主体が神であることを、焦点構文によって明確にした。
- source_word: ηὔξανεν
  choice: 成長させた
  rationale: 他動詞的な神の働きを直接表す。ギリシア語未完了過去が示し得る継続的側面は、本文を不自然にせず脚注で示した。
theological_decisions:
- issue: 人間の奉仕と神の働きの関係
  choice: パウロとアポロの実際の働きを認めながら、成長を生じさせた主体として神を対照的に示した。
  alternative: 「神が成長を与えました」
  rationale: 本文の対照と神の決定的な作用を保ちつつ、人間の働きを無意味なものとはしていない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。農耕比喩を日常的な語彙で保ち、「成長させたのは神です」という焦点構文により原文の強い対照を再現した。
