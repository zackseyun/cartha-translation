  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: ja
  text: というのも、ある人が「私はパウロにつく」と言い、別の人が「私はアポロにつく」と言うなら、あなたがたは人間ではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたはただの人間にすぎないのではありませんか」、または「人間のように振る舞っているのではありませんか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ～と言うなら
  rationale: 不定または反復的な状況を表す接続詞の働きを、現代日本語で自然な条件表現として示した。特定の一回だけを指す表現にはしていない。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の議論を説明する理由づけのつながりを明確にした。
- source_word: λέγῃ τις
  choice: ある人が…と言い
  rationale: 不定単数の一般的な意味を、自然な日本語で保った。
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: 私はパウロにつく
  rationale: 属格がここで表す党派的な帰属・支持を明瞭にしつつ、「パウロの所有物」という意味に限定されるのを避けた。
- source_word: ἕτερος δέ
  choice: 別の人が
  rationale: μέν…δέによる二者の対照を、過度に強い逆接を用いず自然に表した。
- source_word: Ἐγὼ Ἀπολλῶ
  choice: 私はアポロにつく
  rationale: 前節から省略されている動詞と属格の関係を補い、二つの標語の並行性を保った。
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: あなたがたはただの人間にすぎないのではありませんか
  rationale: 否定疑問による叱責を保ち、「人間」がこの文脈で、神の霊に導かれず人間的な基準で振る舞う者という含意を持つことを自然な日本語で示した。
theological_decisions:
- issue: 「人間」の文脈的含意
  choice: ただの人間にすぎない
  alternative: 人間ではありませんか／人間のように振る舞っているのではありませんか
  rationale: 本文のἄνθρωποιを残しながら、単に人間であるという存在論的主張ではなく、党派争いが示す「人間的な振る舞い」への叱責であることを表した。ただし行動を明示する訳は解釈を一段加えるため、脚注に置いた。
translation_notes:
  register: 明瞭で現代的ながら、問いかけの厳粛さを保つ文体とした。派閥的標語は「～派だ」よりも原文の帰属表現を残す「～につく」とし、一般読者にも意味が通る形にした。
