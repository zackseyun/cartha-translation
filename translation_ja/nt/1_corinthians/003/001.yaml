  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: ja
  text: 兄弟たち[a]、私もあなたがたに、霊に属する人たちに語るようには語ることができず、肉に属する人たちに語るように、すなわちメシアにあって幼子である人たちに語るように語りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は、女性を含む信者の共同体全体への呼びかけとして用いられています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: 私も
  rationale: καίと明示された一人称代名詞の組み合わせを反映し、前の議論とのつながりとパウロ自身への焦点を、過度に強調せず自然な日本語で示す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを形式上忠実に訳す。会衆全体を指し、女性も含み得ることは脚注で示す。
- source_word: οὐκ ἠδυνήθην
  choice: 語ることができず
  rationale: 過去における能力・可能性の欠如を表す。後続するἀλλά以下を受けるため、日本語では連用形にした。
- source_word: πνευματικοῖς
  choice: 霊に属する人たち
  rationale: 実体詞的な形容詞を明確にしつつ、単に『霊的な』とする場合に生じ得る曖昧さを避け、πνεῦμαとの語彙的関係を保つ。
- source_word: σαρκίνοις
  choice: 肉に属する人たち
  rationale: πνευματικοῖςとの対照とσάρξとの語彙的つながりを保ち、『世俗的』『罪深い』などの道徳的意味を過度に読み込まない。
- source_word: νηπίοις
  choice: 幼子
  rationale: 未成熟さを示す比喩を保ち、口語的すぎる『赤ちゃん』を避ける。
- source_word: ἐν Χριστῷ
  choice: キリストにある
  rationale: パウロ書簡で定着した結合表現を自然な日本語で再現する。Χριστόςの称号としての由来を失わず、日本語で一般的な表記を用いる。
theological_decisions:
- issue: πνευματικοῖςとσαρκίνοιςの対照
  choice: 「霊に属する人たち」と「肉に属する人たち」
  alternative: 「霊的な人たち」と「肉的な人たち」
  rationale: 霊と肉の対照を保ちながら、『肉』を身体そのものや特定の教理的な『罪の性質』と断定しない。
- issue: ἐν Χριστῷの訳し方
  choice: キリストにある
  alternative: メシアにある
  rationale: この句はパウロに特徴的な結合表現であり、日本語では「キリストにある」が自然で定着している。Χριστόςが称号に由来することを否定するものではない。
- issue: ὡς νηπίοιςの関係
  choice: 「すなわち」を補い、肉に属する人たちを幼子として言い換える構造を示す
  alternative: 接続語を補わず「肉に属する人たちに対するように、キリストにある幼子に対するように」と並べる
  rationale: 反復されたὡςは、ここでは第二の表現が第一を具体化する同格的関係として自然に読める。「すなわち」は新たな因果関係を加えず、日本語でその関係を明確にする。
translation_notes:
  register: 明瞭で現代的ながら、書簡としての品位を保つ文体。「霊的」「肉的」のような専門用語化しやすい表現を避け、原文の霊／肉の対照を「〜に属する」で示した。
