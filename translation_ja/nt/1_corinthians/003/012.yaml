  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: ja
  text: もしだれかがその土台の上に、金、銀、宝石、木、干し草、わらを用いて建てるなら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: もし、だれかが
  rationale: εἰの条件を「もし」で明示し、τιςの不特定で一般的な指示を「だれか」で自然に表した。δέは弱い展開の接続辞であり、日本語では文脈上あえて独立した語にせず、条件節の導入に織り込んだ。
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: その土台の上に…建てる
  rationale: ἐποικοδομέωの「上に建てる」という意味と、ἐπί＋対格が示す基盤との関係を明確に保った。定冠詞を、直前の文脈で示された土台を受ける「その」とした。
- source_word: χρυσόν, ἄργυρον
  choice: 金、銀
  rationale: 建築材料の列挙として、各物質名を簡潔かつ直接的に訳した。
- source_word: λίθους τιμίους
  choice: 宝石
  rationale: 直訳的には「価値ある石」「高価な石」も可能だが、一般的で簡潔な「宝石」は語句の価値性を自然に伝える。建築用の高価な石を指す可能性も文脈上残るため、解釈を本文でそれ以上限定しない。
- source_word: ξύλα
  choice: 木
  rationale: 複数形だが材料を表す集合的用法として、現代日本語で自然な「木」とした。
- source_word: χόρτον
  choice: 干し草
  rationale: 本来は草を広く指し得るが、燃えやすい建材の対比的列挙では「干し草」が自然である。
- source_word: καλάμην
  choice: わら
  rationale: 茎、刈り株、葦などの意味域を持つが、この建材の列挙では日本語の「わら」が最も明瞭で自然である。
