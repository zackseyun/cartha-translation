reference: 1 Corinthians 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: ja
  text: なぜなら、あなたがたは今なお肉に属する者だからです。あなたがたの間にねたみと争いがあるのですから、あなたがたは肉に属する者であり、人間的な仕方で歩んでいるのではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ただの人間のように生きている」とも訳せる。
    reason: κατὰ ἄνθρωπονとπεριπατεῖτεを合わせた、文脈上の含意を明示する別訳。
lexical_decisions:
- source_word: ἔτι
  choice: 今なお
  rationale: 状態が現在まで続いていることを表し、パウロの叱責の響きを自然な現代日本語で保つ。
- source_word: γὰρ
  choice: というのも／〜のですから
  rationale: 二つのγὰρの説明・根拠提示の働きを、それぞれ日本語として自然な形で示す。
- source_word: σαρκικοί
  choice: 肉に属する者
  rationale: σάρξとの語のつながりを保ちつつ、「肉的な者」よりも一般読者に分かりやすくし、「罪深い性質に支配された者」などの教理的な説明を本文に持ち込まない。
- source_word: ὅπου
  choice: あなたがたの間に〜がある
  rationale: 場所を示す基本的な意味を、日本語では「あなたがたの間に」という自然な構文で表す。
- source_word: ζῆλος
  choice: ねたみ
  rationale: 争いと並ぶ否定的文脈なので、肯定的な「熱心」ではなく、共同体内のねたみを指す語として訳す。
- source_word: ἔρις
  choice: 争い
  rationale: 口論だけに狭めず、不和や対立を広く含む簡潔な訳語。
- source_word: οὐχὶ
  choice: 〜のではありませんか
  rationale: 肯定の答えを予期する修辞疑問を、日本語で自然に表す。
- source_word: κατὰ ἄνθρωπον
  choice: 人間にすぎない者として
  rationale: 単なる人間的なあり方に従うという倫理的対比を示しつつ、特定の一個人に従うとの誤解を避ける。より説明的な訳は脚注に示す。
- source_word: περιπατεῖτε
  choice: 歩んでいる
  rationale: 生き方を「歩み」として表すパウロの比喩を、日本語でも理解可能な形で保つ。
theological_decisions:
- issue: σαρκικοίにおけるσάρξ関連語の訳し方
  choice: 肉に属する者
  alternative: この世的な者／罪深い者
  rationale: 信徒の行動が「肉」に特徴づけられているという叱責を保ち、本文が明示しない「罪の性質」などの体系的説明へ展開しない。
- issue: κατὰ ἄνθρωπονの倫理的含意
  choice: 人間にすぎない者として
  alternative: 人間的な仕方で／ただの人間のように
  rationale: 御霊によって形づくられた成熟と対照される、単に人間的な歩みを表す。本文では簡潔さと原文の緊張を保ち、平明な言い換えを脚注に置く。
translation_notes:
  register: 明瞭な現代標準語を用いながら、叱責を含む修辞疑問と「肉」「歩む」というパウロの比喩を保った。「肉的」「人に従って」のような不自然または誤解を招きやすい直訳は避けた。
