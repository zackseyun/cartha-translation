  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: ja
  text: ですから、植える者も水を注ぐ者も何ものでもありません。成長をもたらしてくださるのは、神です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から導かれる結論を、自然な現代日本語で明確に示す。
- source_word: ὁ φυτεύων
  choice: 植える者
  rationale: 名詞的分詞を簡潔に表し、後続の「水を注ぐ者」との並行を保つ。
- source_word: ἐστίν τι
  choice: 重要なのではなく
  rationale: 字義的には「何ものでもない」だが、ここでは働き手の存在価値そのものを否定するのではなく、成長の決定的主体ではないという対比を自然に表す。
- source_word: ὁ ποτίζων
  choice: 水を注ぐ者
  rationale: 栽培の文脈に即しつつ、「植える者」との修辞的な並行を保つ。
- source_word: ἀλλ’
  choice: ではなく
  rationale: 人間の働き手と神との強い対比を、日本語の「～ではなく、～こそ」で明瞭に表す。
- source_word: ὁ αὐξάνων
  choice: 成長させてくださる
  rationale: 使役的な意味を自然に示し、神が成長を生じさせる主体であることを保つ。敬語は神を指す日本語として自然なもの。
- source_word: θεός
  choice: 神こそが重要なのです
  rationale: 原文末尾の「神」の強調を「こそ」で再現し、前半で補った「重要」と対応させる。
theological_decisions:
- issue: οὔτε ... ἐστίν τι ... ἀλλ’ の対比
  choice: 人間の働き手は「重要なのではなく」、神こそが重要
  alternative: 植える者も水を注ぐ者も「何ものでもなく」、成長させる神だけが何ものかである
  rationale: 原文の強い修辞を保ちながら、奉仕者の人格的価値を全面否定するとの不要な誤解を避け、文脈上の焦点である成長の決定的主体を示す。
translation_notes:
  register: 明快で現代的かつ礼拝朗読にも耐える丁寧体。「こそ」により原文末尾の θεός の強調を再現した。
