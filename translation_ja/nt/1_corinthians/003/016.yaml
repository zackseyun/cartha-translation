id: 1CO.3.16
reference: 1 Corinthians 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: ja
  text: あなたがたは神の神殿[a]であり、神の霊があなたがた[b]のうちに[c]住んでおられることを、知らないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の聖所」。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがた」は複数形。パウロは共同体全体に語りかけている。
    reason: cultural_note
  - marker: c
    text: 別訳「あなたがたの間に」。
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: 知らないのですか
  rationale: 否定疑問によるパウロの修辞的な問いを保ちつつ、現代日本語として自然で品位ある表現とした。
- source_word: ναὸς θεοῦ
  choice: 神の神殿
  rationale: ναόςは神殿域全体ではなく、特に神の臨在する聖所・神殿を指す。共同体を神聖な場所にたとえる比喩を明確に保つため「神殿」とした。
- source_word: ἐστε
  choice: あなたがたは…であり
  rationale: 二人称複数を「あなたがた」で明示する。文脈上はコリントの共同体への呼びかけだが、原文にない「共に」などは本文へ補わない。
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: 神の霊
  rationale: 属格関係を簡潔かつ自然に表し、原文の「神の霊」という指示をそのまま保つ。
- source_word: οἰκεῖ
  choice: 住んでおられる
  rationale: οἰκέωの継続的な居住の意味と神殿の比喩を保つ。「おられる」は神の霊への敬意を示す自然な日本語であり、動詞自体へ新たな教義的意味を加えない。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちに
  rationale: ἐνの内在的な意味を保ちながら、複数の受取人の内または間という解釈の幅を残す。「あなたがたの間に」も文脈上可能なため脚注に示す。
theological_decisions:
- issue: この節が個々の信者を主に指すのか、教会共同体を主に指すのか
  choice: 本文では複数形の「あなたがた」を明示し、文脈上の共同体的な語りかけを保つが、「共に」などの限定語は加えない。
  alternative: 「あなたがたは共に神の神殿です」と共同体的意味を明示する、または「あなたがた一人一人は」と個人化する。
  rationale: ギリシア語は二人称複数であり、コリントの共同体に向けられている。しかし、「共に」や「一人一人」に相当する語はこの節にないため、いずれかへ狭めず原文の緊張を保つ。
- issue: ἐν ὑμῖνを内在として取るか、共同体のただ中にあることとして取るか
  choice: 本文は「あなたがたのうちに」とし、両方を許容しうる表現にする。
  alternative: 「あなたがたの間に」と訳し、共同体内の臨在を前面に出す。
  rationale: ἐν ὑμῖνは「あなたがたのうちに」と「あなたがたの間に」の双方が可能であり、複数形と神殿比喩の組み合わせにも解釈上の幅があるため、一方に決め切らない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、修辞疑問と神殿の比喩にふさわしい品位を保った。二人称複数は日本語本文でも明示し、共同体的文脈を見えやすくした。
