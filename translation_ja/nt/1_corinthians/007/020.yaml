  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: ja
  text: 一人ひとり、自分が召されたときの境遇にとどまりなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「境遇」と訳した語は字義的には「召し」とも訳せる。ギリシア語ではこの語と「召された」が同系の語であり、召しと召された時の境遇との両方を響かせている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: 一人ひとり
  rationale: 個々の信者への分配的な指示を、自然な現代日本語で明確に表す。
- source_word: κλήσει
  choice: 召し
  rationale: 文脈上は召された時の境遇や身分を含みうるが、ἐκλήθηとの語の響き合いを保ち、神の召しと生活上の境遇との緊張を訳文で解消しないため。
- source_word: ᾗ ἐκλήθη
  choice: 召されたその
  rationale: 受動形の行為者を明示せず、神的受動の含みを保つ。「その」により、関係節が直前の「召し」を指す構造を簡潔な日本語にする。
- source_word: ἐν ταύτῃ
  choice: その召しのうちに
  rationale: 指示語が先行する「召し」を受けることを明確にし、反復するἐνの空間的・状態的な比喩を「うちに」で保持する。
- source_word: μενέτω
  choice: とどまりなさい
  rationale: 現在命令形の継続的な勧告を、尊厳がありつつ現代の読者に分かりやすい命令表現で示す。
theological_decisions:
- issue: κλῆσιςが神の「召し」を指すのか、召された時の境遇・身分を指すのか
  choice: 本文では「召し」を保持し、文脈上の境遇という含みを脚注で示す。
  alternative: 「境遇」「状態」「身分」と訳す。
  rationale: 周辺文脈は割礼や奴隷身分などの生活状況を扱う一方、κλήσειとἐκλήθηの語源的反復は神の召しを響かせる。一方だけに限定せず、原文の修辞と神学的緊張を残す。
- issue: 文法上の男性単数の扱い
  choice: 性を表示しない日本語の「一人ひとり」と省略された主語で、代表的な単数を表す。
  alternative: 「彼は」など男性代名詞を補う。
  rationale: ギリシア語の男性単数は各信者を代表している。日本語では代名詞を補わなくても単数分配の意味が正確に伝わり、不必要な男性限定も生じない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「とどまりなさい」で使徒的勧告の力を保った。「召されたその召し」は日常表現よりやや凝縮されているが、原文の反復と意図的な曖昧さを伝えるために採用した。
