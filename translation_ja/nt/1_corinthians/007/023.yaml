  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: ja
  text: あなたがたは、代価を払って買い取られたのです。人間の奴隷[a]となってはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人々の奴隷」とも訳せます。「人間」は男性だけでなく、人間一般を指します。
    reason: ἀνθρώπωνは人間一般を指し、δοῦλοιはこの文脈では隷属・所有関係を含むため、本文では「奴隷」とした。
lexical_decisions:
- source_word: τιμῆς
  choice: 代価を払って
  rationale: ἀγοράζωとともに、買い取りのために支払われた代価を表す。具体的な金額や支払者を本文以上に特定せず、現代日本語として明瞭にした。
- source_word: ἠγοράσθητε
  choice: あなたがたは…買い取られた
  rationale: アオリスト受動態・二人称複数。単なる「買われた」より「買い取られた」のほうが、所有権と帰属が移る比喩を自然に伝える。
- source_word: μὴ γίνεσθε
  choice: …となってはいけません
  rationale: γίνομαιの「なる」という変化の意味を保ち、単なる状態の否定である「…であってはいけません」とはしなかった。現在命令形が継続を含み得る点を過度に限定せず、禁止として自然に訳した。
- source_word: δοῦλοι
  choice: 奴隷
  rationale: この節では、代価による買い取りと人間への隷属が対比されており、所有と拘束の強い意味が重要であるため、「僕」や「仕える者」ではなく「奴隷」とした。
- source_word: ἀνθρώπων
  choice: 人間の
  rationale: 複数属格で、δοῦλοιにかかる。男性だけでなく、主なる方と対照される人間一般を指すので、現代日本語では「人間の」とした。
theological_decisions:
- issue: δοῦλοι ἀνθρώπωνが表す隷属の強さと範囲
  choice: 人間の奴隷
  alternative: 人々の僕／人に仕える者
  rationale: 文脈上の要点は、代価を払って買い取られた者が、人間を究極の主人としてその支配下に入ってはならないという帰属と忠誠の対比にある。「奴隷」はその力を保ち、「人間」はἀνθρώπωνを男性に限定しない。なお、この命令をあらゆる社会的奉仕や雇用の禁止にまで拡張しない。
translation_notes:
  register: 明瞭な現代標準日本語。商取引の比喩と、神への帰属に対する人間への隷属という緊張を保った。「代価をもって」のような文語調は避け、「代価を払って」とした。
