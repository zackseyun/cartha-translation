revisions:
- from: 私がこのことを言うのは、あなたがた自身の益のためであって、あなたがたに束縛をかけるためではありません。むしろ、ふさわしく振る舞い、心を乱されずに主に専念できるようにするためです。
  to: これは、あなたがた自身の益のために言うのです。あなたがたに縄をかけるためではなく、ふさわしいことのため、また、心を乱されることなく主に専心することのためです。
  rationale: 原文の対比（「縄をかけるためではなく」）と、後半の二つの名詞的要素（「ふさわしいこと」と「妨げのない主への専心」）を保つよう改めた。「できるようにする」という補足を除き、本文が述べる目的を過不足なく表した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:22Z'
review_pass:
  verdict: revise
  source_fidelity: 「益」「主」「心を乱されずに」は本文の趣旨をよく伝えている。しかし、εὔσχημον はここでは「ふさわしく振る舞う」という動作よりも「ふさわしいこと／適切さ」を指し、また原文は「できるようにする」という使役・可能の内容を明示していない。βρόχον の比喩的な「縄（輪縄）」も、一般化した「束縛」より本文に近く保てる。
  naturalness: 敬体で明快であり、二文に分けた構成も自然である。修正版では「ふさわしいこと」と「主に専心すること」を並列させ、原文の名詞的並列を自然な現代日本語で再現する。
  terminology: 「主」は τῷ κυρίῳ の曖昧さを不必要に限定せず適切である。「心を乱されることなく」は ἀπερισπάστως の、気を散らされずにという含意を適切に表す。βρόχον はこの比喩を保つため「縄」とする。
  issues:
  - severity: medium
    issue: εὔσχημον を「ふさわしく振る舞い」と動作として限定している。
    rationale: εὔσχημον は文脈上「ふさわしいこと／適切さ」を表す名詞的用法であり、特定の振る舞いを命じる表現へ狭めないほうが原文に忠実である。
  - severity: medium
    issue: 「主に専念できるようにするため」が原文にない可能・使役の意味を加えている。
    rationale: 原文は、読者を拘束する目的ではなく、適切さと妨げのない主への専心のために述べる、という目的を示す。
  - severity: low
    issue: βρόχον の具体的比喩が「束縛」で抽象化されている。
    rationale: 「縄をかける」は日本語でも拘束の比喩として理解でき、原語の輪縄・縄のイメージと英語監査文の noose をよりよく反映する。
  revised_text: これは、あなたがた自身の益のために言うのです。あなたがたに縄をかけるためではなく、ふさわしいことのため、また、心を乱されることなく主に専心することのためです。
  revised_footnotes: []
