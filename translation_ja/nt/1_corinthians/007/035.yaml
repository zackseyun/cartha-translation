source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: ja
  text: これは、あなたがた自身の益のために言うのです。あなたがたに縄をかけるためではなく、ふさわしいことのため、また、心を乱されることなく主に専心することのためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: 益
  rationale: 文脈上、勧告が読者自身にもたらす利益・有益さを簡潔に表す。
- source_word: βρόχον
  choice: 束縛
  rationale: 字義的には縄・輪縄を指すが、ここでは自由を拘束するものの比喩。日本語で不自然な「首縄」を避けつつ、比喩の機能を伝える。
- source_word: εὔσχημον
  choice: ふさわしく振る舞い
  rationale: 品位、礼節、適切さを表す語を、この節の目的構文に自然に接続した。
- source_word: εὐπάρεδρον
  choice: 専念
  rationale: そばに座って仕えることから、主に変わらず付き従い専心する意味を表す。
- source_word: ἀπερισπάστως
  choice: 心を乱されずに
  rationale: 注意をそらされたり引き離されたりしない状態を自然な現代日本語で示す。
theological_decisions:
- issue: パウロの勧告の目的
  choice: 「できるようにするため」とし、利益・適切さ・主への専念を促す目的として訳す
  alternative: 独身を普遍的な拘束として命じるように訳す
  rationale: οὐχ ἵνα…ἀλλάによる対比は、拘束を課す意図を明確に否定し、読者の益と妨げのない主への専念を目指している。
- issue: τῷ κυρίῳ の指示対象
  choice: 「主」
  alternative: 「イエス」または「神」と明示する
  rationale: 原文の称号が持つ指示上の含みを保ち、本文以上に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。長いギリシャ語一文を二文に分け、否定と肯定の対比を読み取りやすくした。
