reference: 1 Corinthians 7:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: ja
  text: 処女たちについては[a]、私は主からの命令を受けていません。しかし、主のあわれみにより、信頼に足る者とされた私として[c]、自分の判断を述べます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「未婚の女性たち」。文脈の解釈によっては「処女である娘たち」。ギリシア語は「処女たち」。
    reason: lexical_alternative
  - marker: b
    text: または「自分の意見を示します」「自分の助言を与えます」。パウロはここで、熟慮した自分の判断を、主からの直接の「命令」と対比している。
    reason: alternative_reading
  - marker: c
    text: または「忠実な者とされた私として」。ギリシア語の語は「忠実な」とも「信頼できる」とも訳せる。ここでは、主のあわれみによって信頼に足る者とされた、という意味だと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ～については
  rationale: 新しい話題を導入するパウロの定型的な表現。明示的な時間語を補わず、日本語の主題提示によって話題の転換を自然に表した。
- source_word: τῶν παρθένων
  choice: 処女たち
  rationale: παρθένοςの基本義を保ち、未婚女性一般または処女である娘たちという文脈上の解釈を本文で一つに限定しないため。
- source_word: ἐπιταγὴν κυρίου
  choice: 主からの命令
  rationale: ἐπιταγήが表す命令・指令の意味と、その権威の源が主であることを明確に伝える。
- source_word: γνώμην δὲ δίδωμι
  choice: しかし、自分の判断を述べます
  rationale: γνώμηは熟慮した見解または判断を指す。直接の命令との対比を保ちつつ、日本語として自然な「判断を述べる」とした。
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: 主からあわれみを受けて
  rationale: 完了受動分詞の、主からすでにあわれみを受けた者であるという意味を明示した。
- source_word: πιστὸς εἶναι
  choice: 信頼に足る者とされた
  rationale: ここではパウロが自らの判断を示す資格と信頼性を述べていると考えられるため「信頼に足る」を本文に採った。ただし「忠実な」の意味も注で示した。
theological_decisions:
- issue: 主からの直接の命令とパウロ自身の判断との関係
  choice: 主からの直接の命令はないと述べながら、主のあわれみによって信頼に足る者とされた者として判断を示す、という対比を保った。
  alternative: 単なる私的意見として権威を持たないと読むこと、またはイエスの未知の命令を間接的に引用していると読むこと。
  rationale: ἐπιταγήとγνώμηの対比は、主イエスからの明示的な命令とパウロの熟慮した判断を区別する。一方、πιστόςへの言及はその判断を単なる無責任な私見にはしていないため、この緊張を解消せずに訳した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、使徒書簡にふさわしい落ち着いた文体とした。「処女たち」は現代日本語ではやや硬いが、原語の指示対象を狭めないため本文に残し、可能な解釈を注記した。
