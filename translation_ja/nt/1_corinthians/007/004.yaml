  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: ja
  text: 妻は自分の体に対する権限を持っておらず[a]、その権限を持つのは夫です。同じように、夫も自分の体に対する権限を持っておらず、その権限を持つのは妻です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の体に対して権限を行使する」。ギリシア語の動詞は、権限を持つことにも、それを行使することにも用いられます。ここでは夫婦双方について相互的に述べられています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: 妻
  rationale: 結婚と夫婦間の務めを扱う文脈であるため、一般的な「女」ではなく「妻」とした。
- source_word: ὁ ἀνήρ
  choice: 夫
  rationale: γυνήと対をなす結婚の文脈に従い、一般的な「男」ではなく「夫」とした。
- source_word: τοῦ ἰδίου σώματος
  choice: 自分の体に対する
  rationale: ἴδιοςの自己所有を示す強調を「自分の」で保ち、ἐξουσιάζειとの自然な日本語の結びつきのため「体に対する」とした。
- source_word: ἐξουσιάζει
  choice: 権限を持っている
  rationale: 権限を所有する意味と行使する意味の両方を含み得る語であり、本文では直接的かつ相互的な表現として「権限を持っている」を採用した。
- source_word: ἀλλά
  choice: その権限を持つのは…です
  rationale: 対照を明確にしつつ、日本語として自然に、権限の主体が配偶者であることを示した。
- source_word: ὁμοίως δὲ καὶ
  choice: 同じように、…も
  rationale: 後半が前半と完全に対応する相互的な並行関係を自然な現代日本語で保った。
theological_decisions:
- issue: 夫婦間の権限の性質
  choice: 夫と妻の双方について同じ構文を用い、相互的な権限として訳す。
  alternative: 「自分の体は自分だけのものではない」と所属関係に弱めて訳す、または「相手が体を支配する」と強めて訳す。
  rationale: 原文は、夫婦それぞれが自分の体に権限を持たず、相手が持つという均衡した並行表現である。一方的な上下関係や強制の意味を加えず、同時に単なる所属の比喩へ弱めないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「権限」を反復して原文の対称性と法的・関係的な力を保ち、「支配」など強圧的に響きやすい語は避けた。
