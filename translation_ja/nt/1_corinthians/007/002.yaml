id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: ja
  text: しかし、性的な不品行のために[a]、男性はそれぞれ自分の妻を持ち、女性もそれぞれ自分の夫を持ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は複数形で、直訳すると「性的不品行の数々のために」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: しかし、…があるので
  rationale: διά＋対格の原因を表す働きを「…ので」で示し、δέによる前節からの穏やかな対比・展開を「しかし」で表した。
- source_word: τὰς πορνείας
  choice: 性的不品行があるので
  rationale: πορνείαは広く性的に不道徳な行為を指す。日本語では抽象名詞の複数形が不自然になりやすいため、ギリシア語の複数が個々の行為・事例を含み得ることを脚注で明示した。
- source_word: ἕκαστος
  choice: 男はそれぞれ
  rationale: 後半の女性形ἑκάστηとの対句、および妻・夫の組み合わせから、男性を指すことを明示した。
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: 自分の妻
  rationale: γυνήは女性または妻を意味するが、ἄνδραとの婚姻上の対句なので「妻」が自然である。ἑαυτοῦの再帰的所有は「自分の」で保持した。
- source_word: ἐχέτω
  choice: 持ち…持ちなさい
  rationale: 三人称現在命令の指示を、日本語として自然な「持ちなさい」で表した。「結婚しなさい」や夫婦関係を指す別表現へ解釈的に限定しなかった。
- source_word: καὶ ἑκάστη
  choice: 女もそれぞれ
  rationale: 男性側との対応と付加を「も」で自然に表し、女性形の配分的な意味を「女もそれぞれ」とした。
- source_word: τὸν ἴδιον ἄνδρα
  choice: 自分の夫
  rationale: ἀνήρは男性または夫を意味するが、妻との婚姻上の対句なので「夫」とした。ἴδιονの固有・所有の強調は「自分の」で表した。
theological_decisions:
- issue: この節を性的な罪を避けるための結婚の勧めとするか、夫婦関係についての命令とするか
  choice: 原文どおり、性的不品行を理由として、男と女がそれぞれ自分の配偶者を「持つ」よう命じる表現にした。
  alternative: 「結婚しなさい」または「夫婦の務めを果たしなさい」と解釈して訳す。
  rationale: ギリシア語は結婚することや夫婦の務めを明示する動詞ではなく、ἐχέτω（持ちなさい）を用いる。広い文脈での含意を訳文だけで一つに決めず、原文の直接性と解釈上の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の力と男女の対称的な構文を保持した。「性的不品行」は日常語よりやや格調があるが、πορνείαの広い倫理的意味を簡潔に伝える聖書本文向けの表現である。
