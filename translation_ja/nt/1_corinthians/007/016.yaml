  source_fidelity: 原文の並行する二つの修辞疑問、呼格（「妻よ」「夫よ」）、γάρの理由づけ、そしてσώσεις（救う）を保っている。もっとも、「救うことになる」は未来形を機械的に表そうとして日本語ではやや決定的・不自然に響き、間接疑問における未確定性を十分自然には表せていない。
  naturalness: 「夫を救うかどうか、あなたにどうして分かるでしょうか」が明瞭で自然な現代標準日本語である。「あるいは」は、原文のἤによる第二の並行質問への移行を「また」より明確に示す。
  terminology: 婚姻文脈に即してγυνή／ἀνήρを「妻／夫」とし、σῴζωを解釈的に狭めず「救う」とするのは適切である。呼格の「妻よ」「夫よ」は品位ある聖書文体として許容される。
  issues:
  - severity: medium
    issue: 「救うことになる」が不自然で、やや結果の必然性を帯びる。
    rationale: σώσειςは未来直説法だが、εἰに導かれる間接疑問の中では予告や必然を表すものではない。日本語では「救うかどうか」とすることで、原文の将来的・未確定の問いを自然に保てる。
  - severity: low
    issue: 接続詞「また」はἤ（or）の反復をやや弱める。
    rationale: ここは二つの対称的な問いを「あるいは」でつなぐと、原文の談話上の対比・反復がより明確になる。
  - severity: low
    issue: 脚注の「救うことになる」は本文と同様に不自然である。
    rationale: 脚注では、未来形が間接疑問内にあることを説明しつつ、日本語として自然な可能性表現を代案として示すのがよい。
