id: 1CO.7.16
reference: 1 Corinthians 7:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: ja
  text: というのも、妻よ、あなたが夫を救うかどうか、あなたにどうして分かるでしょうか。[a] あるいは、夫よ、あなたが妻を救うかどうか、あなたにどうして分かるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より慣用的には、「あなたが夫を救えるかもしれないかどうか、どうして分かるでしょうか」とも訳せる。ギリシア語は間接疑問の中で未来形（直訳すれば「救うだろう」）を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: というのも、……どうして分かるでしょうか
  rationale: τί＋οἶδαを、字義的な「何を知っているか」ではなく、修辞疑問として自然な「どうして分かるか」とした。γάρの、直前の勧告を根拠づける働きは「というのも」で示した。
- source_word: γύναι
  choice: 妻よ
  rationale: γυνήは「女」と「妻」の両義を持つが、婚姻を扱う文脈では「妻」が明確である。呼格も保った。
- source_word: ἄνερ
  choice: 夫よ
  rationale: ἀνήρは「男」と「夫」の両義を持つが、ここでは婚姻関係にある相手への呼びかけなので「夫」とした。
- source_word: σώσεις
  choice: 救うことになる
  rationale: 未来直説法の形を反映しつつ、εἰによる間接疑問の中にあるため、確定的な予告とはせず「ことになるかどうか」と表した。
- source_word: τὸν ἄνδρα / τὴν γυναῖκα
  choice: 夫／妻
  rationale: 日本語では呼びかけによって当事者の配偶者であることが明らかなので、不自然な「あなたの夫／あなたの妻」を避けた。
- source_word: ἢ
  choice: また
  rationale: 二つの並行する修辞疑問を自然につなぐ語として「また」を選んだ。「それとも」では、二者択一の問いという誤解を招きやすい。
theological_decisions:
- issue: 婚姻の文脈における「救う」の意味
  choice: 「救う」をそのまま保持する
  alternative: 「信仰に導く」「結婚を守る」「霊的に助ける」
  rationale: σῴζωが持つ救済的な重みを保ち、信者である配偶者と未信者である配偶者との関係において、どのように救いに関わるかを翻訳で限定しないため。
- issue: 修辞疑問が示す確実性の方向
  choice: 肯定・否定のいずれにも断定せず、可能性を開いた表現にする
  alternative: 「救えるかもしれない」と肯定的可能性を強調する／「救えるとは限らない」と否定的不確実性を強調する
  rationale: τί οἶδας ... εἰ の問いは文脈上、肯定的にも否定的にも解され得るため、訳文ではその曖昧さを保持した。
translation_notes:
  register: 現代標準日本語の、明瞭で品位ある文体。原文の呼格「妻よ」「夫よ」と二つの並行疑問を保持した。未来形と間接疑問の緊張、および問いの肯定・否定両方向への解釈可能性を脚注と訳文で残した。
