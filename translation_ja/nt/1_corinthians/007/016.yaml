revisions:
- from: というのも、妻よ、あなたが夫を救うことになるかどうか、どうして分かるでしょうか。[a] また、夫よ、あなたが妻を救うことになるかどうか、どうして分かるでしょうか。
  to: というのも、妻よ、あなたが夫を救うかどうか、あなたにどうして分かるでしょうか。[a] あるいは、夫よ、あなたが妻を救うかどうか、あなたにどうして分かるでしょうか。
  rationale: 未来直説法を日本語の不自然な「救うことになる」で再現するのではなく、「救うかどうか」という未確定の間接疑問で表した。これにより、救いが起こることも起こらないことも問いの中で開かれたままであり、原文の曖昧さを保持する。「あるいは」はἤに対応させた。
