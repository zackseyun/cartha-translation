reference: 1 Corinthians 7:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: ja
  text: また、世を用いる人は、それを十分に用いない者のようにしなさい。この世のあり方は過ぎ去っていくからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρώμενοι (χράομαι)
  choice: 世を用いる
  rationale: 「使う、利用する」という基本義を簡潔に保ち、現在の社会的・物質的世界との関わりを表した。
- source_word: τὸν κόσμον
  choice: 世
  rationale: ここでは被造世界そのものを抽象的に指すより、現在の世界とその営みを指す。「世」は文脈に合い、後半の「この世」とも対応する。
- source_word: ὡς μὴ καταχρώμενοι
  choice: 使い尽くさない者のように
  rationale: χράομαιとの語の響きをできる限り残しつつ、強意を伴う καταχράομαι の「十分に使う、使い切る」という意味を表した。「乱用する」の可能性は脚注に残した。
- source_word: παράγει
  choice: 過ぎ去りつつある
  rationale: 現在形が示す進行中の過程と、この世の一時性を自然な日本語で表した。
- source_word: τὸ σχῆμα
  choice: 有り様
  rationale: 外面的な形、現状の様式・構成を表し、本質そのものを意味するとの誤解を避けるため。「姿」「形態」という別訳は脚注に示した。
- source_word: τοῦ κόσμου τούτου
  choice: この世の
  rationale: 指示詞 τούτου を明示し、過ぎ去るものが現在の世界秩序・様態であることを保った。
theological_decisions:
- issue: χρώμενοι と καταχρώμενοι の関係
  choice: 世に関わりながらも、それを使い尽くす者のようにはならないという勧告
  alternative: 世を乱用しないという道徳的警告、または世を全く用いない者のようにするという意味
  rationale: 二つの同根語による語遊びと強意を保ち、特定の道徳的な「乱用」だけに意味を限定しなかった。
- issue: σχῆμα の意味
  choice: この世の現在の、移ろいゆく有り様
  alternative: 単なる外見、または世界の本質
  rationale: 語は世界の本質ではなく、その現行の形・様態を指す。終末論的な一時性を示しつつ、被造世界そのものへの評価を訳文に付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「使い尽くす」は前半の「用いる」との対比を見えやすくし、「有り様」は σχῆμα を本質と断定せず、現在の形・様態として自然に伝える。すべての脚注記号を本文に配置した。
