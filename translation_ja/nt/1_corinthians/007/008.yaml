  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: ja
  text: 結婚していない人たち[a]と、夫を亡くした女性たちに、私は言います。彼らが私と同じように[b]結婚していないままでいるなら、それは彼らにとって良いことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「結婚していない男性たち」とも訳せます。ギリシア語は男性複数形ですが、男性形が男女を代表して用いられている可能性もあります。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「私もそうであるように」です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: 私は言います
  rationale: δέはここで弱い接続・対照を示すが、日本語で「しかし」「さて」を明示すると意味を強めるおそれがあるため、文脈に委ねた。
- source_word: τοῖς ἀγάμοις
  choice: 結婚していない人たち
  rationale: ἄγαμοςの基本義を明瞭な現代日本語で表した。形態は男性複数だが、文脈上、代表的用法の可能性があるため、性別を本文で限定せず脚注に残した。
- source_word: ταῖς χήραις
  choice: 夫を亡くした女性たち
  rationale: χήραが指す「寡婦」を、現代の一般読者に明確で自然な表現にした。
- source_word: καλὸν αὐτοῖς
  choice: その人たちにとって良いことです
  rationale: καλόνは比較級ではなく、良い・望ましいという評価を表す。αὐτοῖςの与格も明示した。
- source_word: ἐὰν μείνωσιν
  choice: そのままでいるのは
  rationale: μένωの「とどまる」という意味を、現在の未婚状態を保つこととして自然に表現した。条件構文は日本語では名詞化して勧告の内容を明瞭にした。
- source_word: ὡς κἀγώ
  choice: 私と同じように
  rationale: パウロ自身の現在の状態との類似を自然に表した。κἀγώに含まれるκαίの直訳的な「私も」は脚注に示した。
theological_decisions:
- issue: ἀγάμοιςが指す範囲
  choice: 本文では性別を限定せず「結婚していない人たち」とした。
  alternative: 「結婚していない男性たち」
  rationale: 男性複数形は男性だけを特定する可能性も、代表的に用いられる可能性もある。本文で一方に断定せず、形態上の可能性を脚注で保持した。
- issue: καλὸνの評価の強さ
  choice: 「良いこと」
  alternative: 「より良いこと」または「正しいこと」
  rationale: 原文は比較級ではなく、絶対的な道徳命令とも明示していないため、広い評価語のまま訳した。
- issue: ὡς κἀγώが示すパウロの状態
  choice: 「私と同じように」とし、文脈上、結婚していない状態を指す表現とした。
  alternative: パウロの婚姻歴や具体的身分を本文で特定する。
  rationale: 節はパウロの現在の状態との類似を述べるが、その婚姻歴までは明示しないため、本文でも特定しなかった。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「やもめ」「寡婦」は簡潔だが日常語として古風または専門的に響くため、「夫を亡くした女性たち」とした。原文の条件節は、日本語として自然になるよう「そのままでいるのは……良いことです」と構成した。
