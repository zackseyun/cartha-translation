source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: ja
  text: ほかの人たちに、私が言います。主ではなく、私が。ある兄弟に信者でない妻がいて、その妻が彼と一緒に暮らすことに同意しているなら、彼女と離婚してはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼女を捨ててはなりません」。ギリシア語の動詞はより字義的には「去る」「解放する」とも訳せますが、ここでは婚姻関係を終わらせることを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: そのほかの人々には
  rationale: λοιποίを、直前までに扱われていない残りの人々を指す表現として訳した。δέはここでは穏やかな話題転換であり、日本語では独立した接続語を置かなくても自然に表せる。
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: 主ではなく私が言います
  rationale: 明示されたἐγώの強調と、ὁ κύριοςとの対照を簡潔に保った。これが権威や霊感を否定するとの解釈は訳文に持ち込まない。
- source_word: ἀδελφὸς
  choice: 兄弟
  rationale: ここでは妻を持つ男性の信者を指す単数男性形なので、性別を保持して「兄弟」とした。
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: 信者でない妻がいて
  rationale: ἔχει γυναῖκαを婚姻関係を表す自然な日本語にし、ἄπιστονは夫婦間の不実ではなくキリストを信じていないことを示すため「信者でない」とした。
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: その妻が…同意しているなら
  rationale: αὕτηが妻を指すことを明示し、συνευδοκεῖの自発的な賛同・承諾を「同意している」で表した。
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: 彼と一緒に暮らすこと
  rationale: 共同の家庭生活を指すため、現代日本語として自然な「一緒に暮らす」とした。
- source_word: μὴ ἀφιέτω αὐτήν
  choice: 彼女と離婚してはなりません
  rationale: 婚姻の文脈ではἀφίημιが配偶者を去らせる、または婚姻関係を解消する意味を持つため、「離婚する」と明確にした。より字義的な選択肢は脚注に示した。
theological_decisions:
- issue: 「主ではなく私が言います」の意味
  choice: 主の直接の言葉とパウロ自身がここで与える指示との区別を、説明で解消せず本文にそのまま残す。
  alternative: 権威のない個人的意見であることを意味すると訳す。
  rationale: 本文は「私」と「主」を明確に対照させるが、この節自体はその対照が霊感や使徒的権威の否定を意味するとは述べていないため、訳文で断定しない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、使徒的勧告にふさわしい落ち着いた文体と「主ではなく私」という原文の緊張を保持した。
