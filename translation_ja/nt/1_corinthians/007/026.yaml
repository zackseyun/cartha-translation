id: 1CO.7.26
reference: 1 Corinthians 7:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: ja
  text: ですから、今ある苦難[a]のために、人がこのようにあること[b]はよいことだと、私は考えます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今ある必要のために」、または「差し迫った危機のために」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「このようにあること」。文脈上、「今の状態のままでいること」を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: 私は考えます
  rationale: パウロ自身の熟慮した判断を示す現在形として、絶対的な命令にせず自然な現代日本語で表した。
- source_word: οὖν
  choice: ですから
  rationale: 前の議論を受けた推論であることを、明瞭で自然な接続表現で示した。
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: こうしていることは…よい
  rationale: 後続の τὸ οὕτως εἶναι を内容として受ける構文と理解し、原文の「よい」の評価を保った。
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: 今ある苦難のために
  rationale: ἐνεστῶσαν の現在性を「今ある」で示し、ἀνάγκη は外から迫る困難・窮迫を指す文脈に即して「苦難」とした。別の語義は脚注に残した。
- source_word: ὅτι
  choice: （直接引用に相当する内容節）
  rationale: ここでは判断の内容を導く語と捉え、日本語では語順を組み替え、「…と私は考えます」という引用構文で自然に表した。
- source_word: καλὸν
  choice: よい
  rationale: 道徳的優越などを付加せず、原文の評価語を簡潔に再現した。
- source_word: ἀνθρώπῳ
  choice: 人にとって
  rationale: ἄνθρωπος はこの形では一般的な人を指し得るため、性別を不必要に限定しない「人」とした。
- source_word: τὸ οὕτως εἶναι
  choice: こうしていること
  rationale: 直訳の「このようにあること」に近い曖昧さを保ち、文脈上の具体的状態を本文で「今のまま」と断定しすぎないようにした。解釈的な言い換えは脚注に示した。
theological_decisions:
- issue: パウロの発言の性質
  choice: 現在の苦難を理由とする、パウロの状況的な判断として訳す
  alternative: 結婚に反対する普遍的・絶対的命令として読む
  rationale: 「私は考えます」と「今ある苦難のために」という文言をそのまま保ち、本文が明言しない普遍的禁止を持ち込まなかった。
- issue: 「こうしている」の具体的な指示対象
  choice: 本文では指示内容を明示しすぎず、原文の曖昧さを保つ
  alternative: 「今の身分のままでいる」または「未婚のままでいる」と明示する
  rationale: οὕτως は文脈を指すが、この一節だけでは具体的内容を語彙的に限定していないため、解釈は脚注に回した。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた文体を用いた。「こうしていること」により原文の指示表現を保持し、脚注で自然な文脈的理解を補った。
