  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: ja
  text: しかし、私はこれを、譲歩として[a]言っているのであって、命令として言っているのではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「許可として」「許しとして」。
    reason: συγγνώμηはこの文脈で、義務づける命令ではなく、認められた余地・許しを表しうる。
lexical_decisions:
- source_word: τοῦτο
  choice: こう
  rationale: 直前または当面の発言内容を指す指示語として自然であり、指示の向きを必要以上に限定しない。
- source_word: δὲ
  choice: ただし
  rationale: ここでの穏やかな対比・限定を示し、前の発言が命令ではないことへの移行を明確にする。
- source_word: λέγω
  choice: 私が言う
  rationale: 現在形の単純な発話を、明瞭で自然な現代日本語にした。
- source_word: κατὰ συγγνώμην
  choice: 譲歩として
  rationale: 義務として命じるのではなく、許容する趣旨で述べることを表し、後半の「命令として」との対照を保つ。
- source_word: οὐ κατ’ ἐπιταγήν
  choice: 命令としてではありません
  rationale: 権威ある指示ではないという明示的な否定を、前半と対応する形で表した。
theological_decisions:
- issue: パウロの発言を個人的な許可と見るか、拘束力の弱い神的命令と見るか
  choice: 本文どおり、譲歩として述べられたものであり、命令ではないと訳す。
  alternative: 使徒的権威を帯びた助言であることまで訳文で明示する。
  rationale: 原文は「譲歩」と「命令」を明確に対比する一方、パウロの使徒的権威全般についてここで説明してはいないため、その緊張を解消せずに保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた敬体を用いた。「譲歩」は後半の「命令」との対照を簡潔に保つ。
