source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: ja
  text: ですから、自分のもとにいる処女を結婚させる人は良いことをし、結婚させない人は、いっそう良いことをするでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ですから、処女である自分の婚約者と結婚する人は良いことをし、結婚しない人は、いっそう良いことをするでしょう」。また、「自分の処女である娘」と理解する解釈も広くあります。ここで使われているギリシア語の動詞は、より自然には「結婚させる」という意味です。本文の「自分のもとにいる処女」はその使役的な意味を保ちつつ、両者の具体的な関係を限定しないための表現です。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から結論を導く推論の働きを、自然な現代日本語で表した。
- source_word: γαμίζων
  choice: 結婚させる
  rationale: γαμίζω の使役的な意味「結婚させる／嫁がせる」を保ち、単に「結婚する」とはしなかった。
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: 自分の処女
  rationale: παρθένος の意味と ἑαυτοῦ の関係を直訳に近く保ち、娘、被後見人、婚約者のいずれかを本文で断定しない。日本語ではやや異例の表現だが、原文の解釈上の曖昧さを保持するために採用した。
- source_word: καλῶς ποιεῖ
  choice: 良いことをしており
  rationale: 行為への肯定的評価を表しつつ、絶対的な命令や道徳的義務には強めない。
- source_word: μὴ γαμίζων
  choice: 結婚させない人
  rationale: 前半と同じ使役的意味を一貫して保った。目的語は文脈上明らかなため、日本語では反復を避けた。
- source_word: κρεῖσσον ποιήσει
  choice: さらに良いことをすることになります
  rationale: κρεῖσσον の比較級を「さらに良い」で示し、最上級の「最善」とはしなかった。未来形 ποιήσει も自然な形で反映した。
theological_decisions:
- issue: 「自分の処女」の指示対象と γαμίζω の意味
  choice: 本文では「自分の処女を結婚させる」とし、使役的な意味を保ちながら、具体的な関係を断定しない。
  alternative: 「処女である自分の婚約者と結婚する」、または「自分の処女である娘を結婚させる」。
  rationale: 1コリント7:36–38は解釈上の難所である。γαμίζω は通常、使役的な「結婚させる」を支持するが、παρθένος が娘、被後見人、婚約者のいずれを指すかは議論がある。そのため本文は原文が直接示す範囲にとどめ、主要な別解を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、結論を述べる落ち着いた格調を保った。「自分の処女」は日常日本語として異例だが、解釈上争われる関係を本文で「娘」や「婚約者」に限定しないための意図的な形式対応であり、脚注で説明した。
