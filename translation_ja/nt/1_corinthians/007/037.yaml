id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: ja
  text: しかし、心の中で堅く決意し、強いられる事情がなく、自分の意志に関して自ら決定する権限をもち、また自分の心の中で、自分の処女を保つことを決めている人は、よいことをするでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の処女」は、自分の処女である娘を指すとも、自分の婚約者である処女を指すとも解釈されます。ギリシア語の指示対象には議論があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος
  choice: 心のうちで確固としており
  rationale: 完了形ἕστηκενとἑδραῖοςの組み合わせが表す、すでに定まった揺るがない決意を、自然で格調ある現代日本語で表した。
- source_word: μὴ ἔχων ἀνάγκην
  choice: やむを得ない事情もなく
  rationale: ἀνάγκηが含み得る必要・強制・制約の幅を保ち、単に内的欲求の有無へ狭めない表現とした。
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: 自分の意志を制する力があり
  rationale: ἐξουσίαの権限・支配力とθέλημαの意志を文脈に即して表現した。「自分の意志について権限を持つ」という不自然な直訳を避けつつ、自己決定が可能だという対比を保つ。
- source_word: τοῦτο κέκρικεν ἐν τῇ ἰδίᾳ καρδίᾳ
  choice: 自分の心のうちで…決めている
  rationale: κέκρικενの完了形が示す、すでになされ現在も維持されている決定を「決めている」で表した。
- source_word: τηρεῖν τὴν ἑαυτοῦ παρθένον
  choice: 自分の処女をそのままにしておこう
  rationale: τηρεῖνの「保つ、維持する」とπαρθένονの字義を残しつつ、日本語として行為の意味が通るよう「そのままにしておく」とした。対象が娘か婚約者かは本文で限定せず、注で示す。
- source_word: καλῶς ποιήσει
  choice: 立派に行うことになります
  rationale: その行為がよい、称賛に値するという慣用的意味を、文脈上の将来的帰結も含めて表した。
theological_decisions:
- issue: τὴν ἑαυτοῦ παρθένον（自分の処女）が指す人物
  choice: 本文では「自分の処女」として曖昧さを保持する
  alternative: 処女である自分の娘／婚約している処女
  rationale: ギリシア語だけでは、父または保護者が娘について決める場面か、男性が婚約者について決める場面かを確定できない。いずれかに限定すると解釈上の論争を本文で解決してしまうため、注に両案を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、心、処女など原文の主要な聖書的語彙を保持した。「自分の処女」は現代日本語では異例だが、指示対象についての原文の真正な曖昧さを維持するため本文に残し、注で説明した。
