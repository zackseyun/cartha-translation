source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: ja
  text: 結婚している人たちに、私は命じます――私ではなく、主が――。妻は夫と別れてはなりません[a]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夫と離婚してはなりません」とも訳せる。ギリシア語の動詞は婚姻関係における離別を表し、この文脈では離婚を含む可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: 結婚している人たちに
  rationale: γεγαμηκόσινの完了分詞は、結婚した状態にある人々を指す。δὲはここでは強い逆接ではなく、関連する新しい対象へ話題を移す働きがあるため、日本語では独立した接続語を加えず、自然な段落の流れに委ねた。
- source_word: παραγγέλλω
  choice: 私はこう命じます
  rationale: 権威ある指示を表す動詞であり、「命じます」がその力を簡潔に保つ。「こう」は後続する命令内容を自然に導く。
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: 私ではなく、主が命じるのです
  rationale: 原文の強調された対比を明確な現代日本語で保つ。パウロ自身の権威を否定するという解釈や、主の教えとの関係についての説明は本文に加えない。
- source_word: ὁ κύριος
  choice: 主
  rationale: この文脈では主イエスを指すのが自然であり、κύριοςの定着した訳語「主」を用いる。
- source_word: γυναῖκα
  choice: 妻は
  rationale: γυνήは「女」と「妻」の双方を意味し得るが、結婚についての文脈とἀνήρとの組み合わせから、ここでは「妻」が明確である。
- source_word: ἀπὸ ἀνδρὸς
  choice: 夫と
  rationale: ἀνήρはこの結婚の文脈では「夫」。χωρίζομαι ἀπόの離別関係は、日本語では「夫と別れる」とするのが自然である。
- source_word: μὴ χωρισθῆναι
  choice: 別れてはなりません
  rationale: παραγγέλλωに続いて命令内容を示す不定詞。「別れる」は婚姻上の離別を表しつつ、現代の法的な「離婚」に意味を狭めない。受動形は自動詞的な意味を帯びるため、自然な日本語では能動的な「別れる」とした。
theological_decisions:
- issue: 「私ではなく、主」の意味
  choice: 原文どおり、パウロと主を対比させる表現を保った。
  alternative: パウロが自分の言葉には権威がないと表明している、と本文で明示する。
  rationale: この句は主イエスがすでに与えた命令とパウロの指示を区別していると理解できるが、その含意を本文で解説せず、原文の神学的緊張を保持する。
- issue: 婚姻におけるχωρισθῆναιの範囲
  choice: 「別れて」と訳し、別居・離別を表す広さを保った。
  alternative: 「離婚して」と訳し、法的な婚姻解消に限定する。
  rationale: 直後の文脈も離別後の状態と和解を扱うため、ここでは原語の幅を残し、「離婚」の可能性は脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文末尾のダッシュは、命令内容が次節へ続くことを示すため「——」で保持した。
