id: 1CO.7.40
reference: 1 Corinthians 7:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: ja
  text: しかし、私の判断では、そのままでいるなら、彼女はもっと幸せです[a]。そして私も、神の霊を持っていると思います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もっと幸いです」。ギリシア語の比較級 μακαριωτέρα は、より大きな幸福だけでなく、より幸いな状態を表すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: もっと幸せです
  rationale: μακάριοςの比較級であり、ここでは結婚する場合とそのままでいる場合を比べる実際的な勧めなので、現代日本語として自然な「もっと幸せ」を採用した。「もっと幸い」は可能だが、宗教的祝福の意味を前面に出しすぎるおそれがあるため、脚注に示した。
- source_word: ἐὰν οὕτως μείνῃ
  choice: そのままでいるなら
  rationale: μένωの「とどまる、いる」と、直前の未婚またはやもめの状態を受けるοὕτωςの照応を自然に表し、本文以上に状態を限定しない。
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: 私の判断では
  rationale: γνώμηが表す熟慮に基づく判断を簡潔に伝える。「私の意見では」よりも軽く響かず、主の直接の命令とは区別されたパウロの判断であることも保つ。
- source_word: δοκῶ
  choice: 思います
  rationale: 控えめな言い方を保ちつつ、不確かさを過度に強めない自然な訳語。
- source_word: κἀγὼ
  choice: 私も
  rationale: καὶ ἐγώの融合形が持つ付加的な強調を、そのまま簡潔に表す。
- source_word: πνεῦμα θεοῦ
  choice: 神の霊
  rationale: パウロ書簡の用法と文脈に従い、一般的な精神性ではなく神の霊を指す表現として訳した。日本語では冠詞を補わずとも自然にその指示対象を表せる。
- source_word: ἔχειν
  choice: 持っている
  rationale: δοκῶに従属する不定詞の基本的な意味を、過度に硬い「所有する」ではなく自然な日本語で表した。
theological_decisions:
- issue: πνεῦμα θεοῦが聖霊を指すか、一般的な霊的性質を指すか
  choice: 「神の霊」とし、神の霊を指す表現として訳す
  alternative: 「神からの霊」または「神からの霊的洞察」
  rationale: パウロにおける通常の用法と、この助言の霊的正当性を述べる文脈に合う。一般的な心構えに弱めず、同時に「主からの直接命令」とまでは訳文に加えない。
- issue: δοκῶ … πνεῦμα θεοῦ ἔχεινにおける自己言及の強さ
  choice: 修辞的には控えめだが、神の霊を持つという実質的な主張として保つ
  alternative: 自分に神の霊があるかどうかについての不確かな推測、または反対者への明示的な皮肉
  rationale: 「思います」はδοκῶの控えめな調子を保つが、文脈上の確信を否定するほど弱くはない。皮肉の可能性を本文で断定する語も加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの牧会的助言にふさわしい落ち着いた敬体とした。「彼女」を明示してギリシア語の三人称女性単数を保ち、結婚しない状態という文脈上の内容を本文で過度に説明しないようにした。
