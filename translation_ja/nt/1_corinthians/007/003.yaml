  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: ja
  text: 夫は妻に対して負っている務め[a]を果たしなさい。妻も同じように夫に対して果たしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「負っているもの」または「義務」。この文脈では、夫婦が互いに負っている性的な務めを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ γυναικί / ἡ γυνή
  choice: 妻
  rationale: 結婚について述べる直近の文脈では、一般的な「女」ではなく「妻」を指す。
- source_word: ὁ ἀνήρ / τῷ ἀνδρί
  choice: 夫
  rationale: γυνήとの対応と婚姻の文脈から、一般的な「男」ではなく「夫」と訳す。
- source_word: τὴν ὀφειλήν
  choice: 夫婦としての務め
  rationale: 語義の中心は「負っているもの、果たすべき義務」であり、前後の文脈では夫婦間の性的・婚姻的な務めを指す。「夫婦としての務め」は文脈を明確にしつつ、原語以上に法的・身体的な意味へ限定しない。
- source_word: ἀποδιδότω
  choice: 果たしなさい
  rationale: 本来は「負っているものを返す、与える」の意。日本語では「務めを果たす」が自然であり、現在命令形の継続的な命令の力も表せる。
- source_word: ὁμοίως δὲ καί
  choice: も同じように
  rationale: 夫と妻が互いに同じ責任を負うという、二つの節の対称性と付加の意味を自然に表す。
theological_decisions:
- issue: ὀφειλήが指す夫婦間の義務をどの程度明示するか
  choice: 本文では「夫婦としての務め」とし、脚注で字義と文脈上の含意を示す。
  alternative: 「負っているもの」「義務」「夫婦の性的な務め」
  rationale: 周辺文脈は夫婦の性的関係を扱うが、名詞そのものはより広く「負っているもの、義務」を意味する。本文で過度に狭めず、同時に婚姻文脈を明確にし、夫婦双方に等しく向けられた命令を保つ。
- issue: 後半の省略された目的語を日本語で補うか
  choice: 「その務めを果たしなさい」と補う。
  alternative: 「妻も同じように夫に対してしなさい」
  rationale: ギリシア語では前半の内容が後半にも及ぶ。日本語では「その務め」を補う方が明瞭であり、新たな意味は加えない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、命令文としての重みと夫婦双方の対称性を保った。「夫婦としての務め」は平易で品位があり、露骨すぎず曖昧すぎない表現とした。
