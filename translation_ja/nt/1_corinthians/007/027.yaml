id: 1CO.7.27
reference: 1 Corinthians 7:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: ja
  text: 妻と結ばれているのですか。解かれることを求めてはいけません。[a] 妻から解かれているのですか。妻を求めてはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より解釈を加えれば、「結婚しているのですか。離婚を求めてはいけません。離婚しているのですか。妻を求めてはいけません」とも訳せる。ギリシア語は、より直訳的には「結ばれている」「解かれている」と述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: 結ばれている
  rationale: δέωの完了形が示す、結ばれた状態を保つ。「結婚している」と説明的に限定せず、後半の「解かれている」との対照も表す。
- source_word: γυναικί
  choice: 妻と
  rationale: 結婚について論じる文脈では γυνή は「女性」ではなく「妻」を指す。日本語では「妻に結ばれている」より「妻と結ばれている」が自然である。
- source_word: μὴ ζήτει
  choice: 求めてはいけません
  rationale: ζητέω の「求める」という意味と、否定命令の力を明瞭に伝える。
- source_word: λύσιν
  choice: 解かれること
  rationale: 「解くこと・解放」を意味する語であり、後続の λέλυσαι との語根上の対応を「解かれる」で再現する。「離婚」と限定しない。
- source_word: λέλυσαι
  choice: 解かれている
  rationale: λύω の完了形が示す、解かれた結果としての現在の状態を表し、δέδεσαι との対照を保つ。離婚、死別、その他の非婚状態のどれかに不用意に限定しない。
- source_word: ἀπὸ γυναικός
  choice: 妻から
  rationale: ἀπό の分離の意味を「から」で示し、婚姻文脈の γυνή を「妻」とする。
- source_word: γυναῖκα
  choice: 妻
  rationale: ここで求めないよう命じられているのは結婚相手であるため、「女性」より「妻」が文脈に適する。
theological_decisions:
- issue: 明示的な婚姻・離婚用語で訳すか、結ぶ・解くという比喩を残すか
  choice: 本文では「妻と結ばれている」「妻から解かれている」と訳し、原文の比喩と対照を保つ。
  alternative: 「結婚しているのですか。離婚を求めてはいけません。離婚しているのですか。妻を求めてはいけません。」
  rationale: ギリシア語は結婚・離婚を直接表す語ではなく、δέω と λύω に連なる「結ぶ／解く」の表現を用いる。本文でその緊張を保持することで、後半を離婚だけに限定せず、原文の幅を残す。
translation_notes:
  register: 現代標準日本語の丁寧体を用い、簡潔で格調ある勧告文とした。「結ばれている／解かれている」の対応により原文の比喩を見える形で残した。
