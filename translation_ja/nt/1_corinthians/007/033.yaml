  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: ja
  text: しかし、結婚している男は、この世の事柄[a]、すなわち、妻を喜ばせるにはどうすればよいかということに心を配ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「世の事柄」「この世の務め」。
    reason: τὰ τοῦ κόσμουの語義には、世に属する事柄や日常生活上の務めという幅があるため。
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: しかし、結婚している男は
  rationale: 冠詞付きアオリスト分詞を、直前の未婚の男との対比を保ちながら、現代日本語で自然な状態表現にした。男性単数も明示した。
- source_word: μεριμνᾷ
  choice: 心を配ります
  rationale: この動詞は不安だけでなく、気遣いや関心を表し得る。ここでは結婚生活上の配慮を述べており、必ずしも罪深い思い煩いとは限らないため、中立的な表現を選んだ。
- source_word: τὰ τοῦ κόσμου
  choice: この世の事柄
  rationale: 日常の世に属する事柄を指す構文として訳し、κόσμοςに道徳的悪という意味を不必要に加えなかった。
- source_word: πῶς ἀρέσῃ
  choice: どうすれば……喜んでもらえるか
  rationale: πῶςと接続法が示す、相手を喜ばせる方法についての関心を自然な日本語で表した。受益的な「もらえる」を用いて、妻の満足を図る意味を示した。
- source_word: τῇ γυναικί
  choice: 妻に
  rationale: 結婚の文脈なのでγυνήは「女」ではなく「妻」を意味する。日本語では所有代名詞を補わなくても当人の妻であることが明白である。
theological_decisions:
- issue: κόσμοςを道徳的に否定的な意味で訳すべきか
  choice: 中立的に「この世の事柄」とした。
  alternative: 「世俗的なこと」など、非難の含みを持つ表現にする。
  rationale: 文脈上、パウロは主への専心との対比で結婚生活に伴う実際的な配慮を述べているのであり、結婚や通常の責任を一律に悪と断じてはいない。原文の緊張を保つため、中立的に訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。「心を配ります」は過度に否定的な「思い煩います」を避けつつ、μεριμνᾷの関心・配慮の意味を表す。
