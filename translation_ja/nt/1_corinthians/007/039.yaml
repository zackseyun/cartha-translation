id: 1CO.7.39
reference: 1 Corinthians 7:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: ja
  text: 妻は、夫が生きている間は夫に結ばれています。しかし、夫が眠りに就いたなら[a]、自分が望む人と結婚する自由があります。ただし、主にあってのみです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「眠りに就く」は、死ぬことを表す一般的な婉曲表現です。別訳「死んだなら」。
    reason: lexical_alternative
  - marker: b
    text: 「主にあってのみ」は一般に、主に属する人、すなわち同じ信仰を持つ人とのみ結婚するという意味に理解されています。
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: 妻
  rationale: 夫との婚姻関係が明示されている文脈なので、一般的な「女」ではなく「妻」とした。
- source_word: δέδεται
  choice: 結ばれています
  rationale: 完了受動形が示す継続的な拘束状態を表す。「縛られています」より自然でありつつ、婚姻上の結びつきという法的・関係的な力を保つ。
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: 生きている間は
  rationale: 期間を表す句を、簡潔で自然な現代日本語にした。
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: 夫
  rationale: 婚姻の文脈におけるἀνήρなので「男」ではなく「夫」と訳した。日本語では所有表現を明示しなくても関係が明らかである。
- source_word: κοιμηθῇ
  choice: 眠りに就いたなら
  rationale: 死を表す婉曲表現である「眠る」という原文の比喩を本文に残し、意味は脚注で明示した。
- source_word: ἐλευθέρα ἐστὶν
  choice: 自由があります
  rationale: 以前の婚姻の拘束から解かれ、再婚を選べる状態を自然な日本語で表した。
- source_word: ᾧ θέλει γαμηθῆναι
  choice: 自分が望む人と結婚する
  rationale: 受動不定詞を日本語で不自然に直訳せず、相手を選んで再婚できる意味を明瞭に表した。「再婚」を補わなくても文脈上明らかである。
- source_word: μόνον ἐν κυρίῳ
  choice: ただし、主にあってのみです
  rationale: μόνονの制限を「ただし」で明確にしつつ、解釈が圧縮されたパウロ特有の句「主にあって」を展開せず保持した。
theological_decisions:
- issue: 再婚の指示における「主にあって」の意味
  choice: 本文では「ただし、主にあってのみです」と簡潔に訳す。
  alternative: 主に属する人とだけ結婚する／主への献身にかなう仕方でのみ結婚する
  rationale: ἐν κυρίῳは一般に同じ信仰を持つ者との結婚を指すと理解されるが、原文はより圧縮されており、献身にかなう結婚という広い含みも排除しきれない。本文では曖昧さを保持し、代表的理解を脚注に示す。
- issue: 死を表す婉曲表現
  choice: 「眠りに就いたなら」として比喩を本文に残す。
  alternative: 死んだなら
  rationale: κοιμηθῇの通常の指示対象は死だが、パウロが用いた「眠る」という表現の響きを保つため直訳寄りにし、平明な意味を脚注で補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「眠りに就く」と「主にあって」は原文の比喩と神学的に圧縮された表現を保持し、脚注で理解を助ける。
