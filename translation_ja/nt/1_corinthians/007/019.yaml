id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: ja
  text: 割礼を受けていることは何でもなく[a]、割礼を受けていないことも何でもありません。大切なのは、神の戒めを守ることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何の価値もありません」。後半も同じ。
    reason: οὐδέν ἐστιν は、直訳的には「何でもない」であり、文脈上「何の価値もない」「何の重要性もない」とも訳せるため。
lexical_decisions:
- source_word: ἡ περιτομή
  choice: 割礼を受けていること
  rationale: 単なる行為よりも割礼を受けた状態・身分を表す文脈なので、現代の一般読者にも分かる表現とした。
- source_word: οὐδέν ἐστιν
  choice: 何でもありません
  rationale: 二度繰り返されるギリシア語の率直な評価を保つ。「何の意味もない」とすると、あらゆる意味を全面的に否定する響きが強くなりうる。
- source_word: ἡ ἀκροβυστία
  choice: 割礼を受けていないこと
  rationale: 専門的な「無割礼」を避けつつ、περιτομήとの対照と状態を明確にした。
- source_word: ἀλλά
  choice: 大切なのは
  rationale: 日本語では対照の後半が名詞句だけでは不自然なため、何が重視されるかという対比を自然に明示した。
- source_word: τήρησις
  choice: 守ること
  rationale: 戒めを継続して遵守することを、自然かつ具体的な日本語で表す。
- source_word: ἐντολῶν θεοῦ
  choice: 神の戒め
  rationale: 複数形の具体性を保ち、「神が命じること」などと一般化せず、属格関係を自然な日本語で示した。
theological_decisions:
- issue: 割礼と無割礼に対するパウロの評価
  choice: 割礼を受けた状態も受けていない状態も、神の戒めを守ることとの対比において「何でもない」とする。
  alternative: 割礼にはあらゆる意味で一切の意義や道徳的価値がない、と全面的に断定する。
  rationale: 本文は両方の状態を同じく相対化し、神の戒めを守ることと対照させている。翻訳ではこの緊張を保ち、節の範囲を超える神学的結論を加えない。
translation_notes:
  register: 明瞭な現代標準日本語。礼拝朗読にも耐える丁寧で落ち着いた文体としつつ、「無割礼」のような一般読者に分かりにくい術語は避けた。
