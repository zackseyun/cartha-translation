  naturalness: 明瞭な現代標準日本語であり、用語と文体も本文に適している。「聖なる者であるために」とすることで、身と霊という二つの面における女性自身の聖さを自然に表せる。
  terminology: 「処女」は παρθένος の語彙的特異性を保持し、「主」「霊」「聖なる」は適切である。「結婚していない女性」と「結婚している女性」は平明で、対照も明確である。脚注は有効な構文上の別読みを適切に示している。
