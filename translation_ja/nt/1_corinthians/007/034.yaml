id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: ja
  text: そして、思いが分かれています。また、結婚していない女性、すなわち処女[a]は、身も霊も聖なる者であるために、主のことに心を配ります。しかし、結婚している女性は、どうすれば夫に喜ばれるかと、世のことに心を配ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「結婚していない女性と処女は、主のことに心を配ります」。ギリシア語は、「結婚していない女性」と「処女」を同じ人の説明ではなく、二つの区分として並べているとも読めます。
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: 思いが分かれています
  rationale: 完了受動形の結果的な状態と、関心が分かれる比喩を保った。ギリシア語では主語が明示されないため、日本語でも特定の人物を補わず、文脈に開かれた表現とした。
- source_word: γυνὴ ἡ ἄγαμος
  choice: 結婚していない女性
  rationale: γυνή はここでは既婚女性との対比に置かれた女性を指す。「未婚の女性」も可能だが、現代日本語で意味が直接伝わる表現を選んだ。
- source_word: παρθένος
  choice: 処女
  rationale: 語が持つ性的未経験という具体性を一般的な「若い女性」などに薄めず保持した。
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: 結婚していない女性、すなわち処女
  rationale: 単数動詞 μεριμνᾷ と圧縮された構文を踏まえ、同格的説明として自然な日本語にした。ただし、二つの区分を並列する読みも可能なので脚注に残した。
- source_word: μεριμνᾷ
  choice: 心を配ります
  rationale: この文脈では必ずしも否定的な不安ではなく、関心を向けて気遣うことを表すため、「思い煩う」ではなく中立的な表現を用いた。
- source_word: τὰ τοῦ κυρίου
  choice: 主のこと
  rationale: 「主に属する事柄」という意味を簡潔で自然な日本語にし、「世のこと」との対照を保った。
- source_word: ἵνα ᾖ ἁγία
  choice: 聖なる者となるために
  rationale: ἵνα の目的を明示し、ἁγία の聖別・聖性の語を言い換えで弱めなかった。
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: 身も霊も
  rationale: 二つの側面を示す καὶ…καὶ を「も…も」で表し、人間の構成について本文以上の体系的区分を持ち込まないようにした。
- source_word: ἡ δὲ γαμήσασα
  choice: 結婚している女性
  rationale: 結婚した状態にある女性を指す分詞を、現代日本語で自然に表した。
- source_word: τὰ τοῦ κόσμου
  choice: 世のこと
  rationale: 「主のこと」と対応させつつ、この箇所が要求しない強い否定的含意を「世俗的なこと」などによって加えないようにした。
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: どうすれば夫に喜ばれるか
  rationale: 婚姻の文脈により ἀνήρ を「夫」とし、関心の内容を示す間接疑問として自然に訳した。
theological_decisions:
- issue: 「結婚していない女性」と「処女」が同一範疇の説明か、別々の二範疇か
  choice: 「結婚していない女性、すなわち処女」と同格的に訳す
  alternative: 「結婚していない女性と処女」と並列的に訳す
  rationale: 圧縮されたギリシア語構文には両方の読みがあり得るが、単数の動詞は統一された主語として読むことを支持する。本文は明瞭な同格読みとし、並列読みを脚注に示して解釈上の余地を保持した。
- issue: μεμέρισται の明示されない主語
  choice: 「思いが分かれています」とし、人物の性別や指示対象を補わない
  alternative: 「彼女の思いは分かれています」または前節の既婚男性を受けて「彼の思いは分かれています」
  rationale: 提示されたギリシア語だけでは動詞の主語は形態上明示されず、節の区切り方や前文との接続が理解に影響する。特定の人物を補うと曖昧さを解消しすぎるため、日本語でも主語を限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「聖なる者」「霊」「主」など本文の神学的語彙は保持した。「女性」を用いて dignified な語調とし、対照構造は「主のこと／世のこと」「結婚していない／結婚している」で明確にした。
