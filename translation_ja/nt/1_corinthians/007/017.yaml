  to: ただ、各自、主から割り当てられた[a]ものに応じ、神に召されたあり方に応じて、そのように歩みなさい[b]。そして私は、すべての教会でこのように指示しています。
  rationale: 「主が割り当てられた」を「主から割り当てられたもの」に改め、原文における主の能動的な配分を明確にした。それに伴い、「各自」を文頭に置き、「神に召されたあり方に応じて」として、各人への召しと歩みとの関係を自然な日本語で表した。社会的境遇を固定する解釈は加えていない。脚注aも改訂本文の受け身表現に合わせて行為者を明示した。
