id: 1CO.7.17
reference: 1 Corinthians 7:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: ja
  text: ただ、各自、主から割り当てられた[a]ものに応じ、神に召されたあり方に応じて、そのように歩みなさい[b]。そして私は、すべての教会でこのように指示しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「分け与えられた」「持ち分として与えられた」とも訳せる。原語は、主が各人に何かを配分し、割り当てることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「歩む」は、その人の生き方や日々の行動を表す聖書でよく用いられる比喩。「生活しなさい」「生きなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: ただ
  rationale: ここでは厳密な条件を表すのではなく、前の議論を受けて原則を示す限定的・転換的な表現。「ただ」は簡潔で自然にその働きを表す。
- source_word: ἑκάστῳ / ἕκαστον
  choice: 一人一人
  rationale: 個々人への適用を強調する反復表現。日本語では冒頭に「一人一人」と置き、節全体にかかる形で分配的な意味を明確にした。
- source_word: ἐμέρισεν
  choice: 割り当てられた
  rationale: 主が各人に分け定めた境遇や持ち分を指し得る。「割り当てる」は特定の内容を狭く限定せず、この文脈で自然に神による配分を表す。神を主語とする敬意を示すため「られた」を用いた。
- source_word: ὁ κύριος
  choice: 主
  rationale: パウロ書簡における標準的な訳語を用いた。
- source_word: κέκληκεν
  choice: 召された
  rationale: 完了形が示す、すでになされた召しとその持続的な効力を文脈上保つ。「召す」は神の召命を表す定着した訳語である。
- source_word: ὁ θεός
  choice: 神
  rationale: θεόςの標準的で明瞭な訳語。
- source_word: οὕτως
  choice: そのように／このように
  rationale: 前半では各人への割り当てと召しに対応する生き方を「そのように」で示し、後半では同じ原則を諸教会に指示することを「このように」で自然に表した。
- source_word: περιπατείτω
  choice: 歩みなさい
  rationale: 生活の仕方を表す聖書的比喩を保持した。命令法三人称単数の勧告は、日本語で各人に向けた「歩みなさい」とした。
- source_word: διατάσσομαι
  choice: 指示しています
  rationale: 諸教会に共通する実践を権威をもって定める意味を保ちつつ、「命令する」ほど強圧的に響かない自然な表現とした。
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: すべての教会で
  rationale: 地域ごとのキリスト者共同体を指す通常の用法として「教会」を用い、πάσαιςの普遍的範囲も明示した。
theological_decisions:
- issue: 「主」と「神」という二つの呼称の関係
  choice: 「主が割り当てられた……神が召された」と両者を区別して保持する
  alternative: 同一の神的主体を指す文体上の言い換えとして一つの呼称に統一する
  rationale: 原文は並行する句で異なる二つの呼称を用いている。その関係を翻訳で断定せず、原文の区別と神学的な含みをそのまま残した。
- issue: περιπατείτωの倫理的比喩
  choice: 「歩みなさい」と比喩を保持する
  alternative: 「生活しなさい」「生きなさい」と意味を明示する
  rationale: 生き方を「歩む」と表す比喩は現代日本語でも理解でき、原文の表現を保てる。具体的な生活領域へ意味を狭めることも避けられる。
- issue: 召しと各人の境遇との関係
  choice: 「主が割り当てられたとおり、神が召されたとおり」と並行関係を保持する
  alternative: 「召された時の身分のままで」のように、召しが現在の社会的境遇を固定する意味だと明示する
  rationale: 文脈上は召された際の境遇が意識され得るが、この一節の語句自体はそれを完全には明示しない。訳文で社会的身分の固定という解釈を追加せず、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「主」「召す」「歩む」など、意味が広く理解できる聖書語彙を保持した。各人への適用は「一人一人」で明示し、全体を簡潔で品位ある勧告調に整えた。
