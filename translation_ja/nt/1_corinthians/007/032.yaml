id: 1CO.7.32
reference: 1 Corinthians 7:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: ja
  text: しかし、私は、あなたがたに思い煩わずにいてほしいのです。未婚の男性[a]は、主に関わること、すなわち、どうすれば主に喜ばれるかを心にかけます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は男性単数形で、「未婚の男性」と訳せる。もっとも、前後の文脈では、パウロは未婚と既婚の状態を男女双方について論じている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: しかし、私は……と願っています
  rationale: θέλωの意志・願望を自然な現代日本語で表し、δέは前節までとの緩やかな対照として「しかし」とした。
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: あなたがたに思い煩いがないように
  rationale: ἀμέριμνοςは無関心ではなく、不安や過度の気遣いから解放された状態を指すため、「思い煩いがない」とした。
- source_word: ὁ ἄγαμος
  choice: 結婚していない男性
  rationale: 冠詞付きの男性単数形を保持し、この直後に男性と女性の事例がそれぞれ扱われる文脈にも合わせた。
- source_word: μεριμνᾷ
  choice: 心にかけます
  rationale: 同じ語根のἀμέριμνοςとの意味上のつながりを保ちつつ、ここでは否定的な不安ではなく配慮・関心を表すため「心にかける」とした。
- source_word: τὰ τοῦ κυρίου
  choice: 主のこと
  rationale: 主に属する事柄、主に関わる務め全般を指す幅のある表現として、自然で簡潔な「主のこと」を用いた。
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: どうすれば主に喜ばれるか
  rationale: πῶςと接続法が表す、主を喜ばせる方法への志向を自然な日本語で示した。「主に喜ばれる」は日本語では「主を喜ばせる」と同趣旨であり、尊敬の対象への奉仕を自然に表す。
theological_decisions:
- issue: 未婚者を指す男性単数形と周辺文脈での男女双方への適用
  choice: 本文では「結婚していない男性」として男性単数を保持する
  alternative: 「結婚していない人」
  rationale: ギリシア語は男性単数であり、続く節では既婚男性と女性の事例が区別して述べられる。一方、段落全体では未婚・既婚の状態が男女双方について論じられるため、その広い文脈を脚注で示す。
- issue: ἀμέριμνοςとμεριμνάωに含まれる緊張
  choice: 前者を「思い煩いがない」、後者を「心にかける」と訳し分ける
  alternative: 両方を「心配（する）」で統一する
  rationale: 同じ語根による語遊びを完全には再現できないが、前者の望ましくない不安と、後者の主への積極的な配慮という文脈上の違いを保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「思い煩い」と「心にかける」により、同語根の否定的・肯定的な用法の違いを自然な日本語で表した。脚注記号[a]は該当する「結婚していない男性」の文に配置した。
