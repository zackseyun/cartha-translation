  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: ja
  text: あなたがたが書き送った事柄については、男が女に触れないのはよいことです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女に触れない」は、ここでは性的関係を持たないことを婉曲に表す表現と理解される。「女」は「妻」とも訳せる。
    reason: ἅπτεσθαιの文脈上の性的含意を示しつつ、本文では字義的表現を保つため。またγυνήが「女」と「妻」のいずれにもなり得る語義上の幅を示すため。
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: あなたがたが書いてきた事柄についてですが
  rationale: περὶ δέによる話題転換を、明示的な時間語を加えず、自然な日本語の接続で表した。ὧνは独立した「事柄」として訳し、ἐγράψατεは受取人たちが書き送った内容を指す表現とした。
- source_word: καλόν
  choice: よい
  rationale: 道徳的・実際的な評価のどちらにも開かれた簡潔な評価語として訳した。
- source_word: ἀνθρώπῳ
  choice: 男は
  rationale: 語自体は広く「人」を意味し得るが、後続するγυναικόςとの対比および性的含意のある文脈から、ここでは「男」が自然である。
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: 女に触れない
  rationale: 属格を取るἅπτομαιの字義を保ちつつ、性的関係を婉曲に指し得る表現であることは脚注で示した。γυνήは「女」と「妻」の双方を意味し得るため、本文ではより広い「女」を採った。
theological_decisions:
- issue: 「男は女に触れないのがよい」がパウロ自身の教えか、コリント側の文言の引用か
  choice: 引用符を付けず、本文の帰属を確定しない
  alternative: 「『男は女に触れないのがよい』とあります」のようにコリント側の主張として明示する
  rationale: ギリシア語本文には引用符や発話者を明示する標識がなく、この句の帰属には解釈上の議論があるため、原文の曖昧さを保持した。
- issue: 「触れる」の含意
  choice: 本文では字義的な表現を維持し、性的含意を脚注で説明する
  alternative: 本文で「性的関係を持たない」または「結婚しない」と意訳する
  rationale: ἅπτεσθαιはこの文脈で性的関係の婉曲表現と理解され得るが、「結婚しない」に限定すると意味を狭めるため避けた。
translation_notes:
  register: 明瞭な現代標準語を用い、口語的すぎない簡潔で品位ある文体とした。「についてですが」によってδέの話題転換を自然に示し、原文にない時間的な「今」を加えていない。
