  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: ja
  text: しかし、自制できないなら、結婚しなさい。燃えるよりは、結婚するほうがよいからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「燃える」。ギリシア語は何に燃えるかを明示していませんが、この文脈では性的な欲望に燃えることを指す可能性が高いと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: 自制できない
  rationale: 文脈上、特に性的欲望について自分を制することを表す。否定辞と合わせ、自然な現代日本語とした。
- source_word: γαμησάτωσαν
  choice: 結婚しなさい
  rationale: 三人称複数のアオリスト命令形の勧告的な命令の力を、明瞭な日本語で表した。
- source_word: κρεῖττον
  choice: ほうがよい
  rationale: 二つの選択を比較する述語的比較級を自然に表す。
- source_word: γαμῆσαι
  choice: 結婚する
  rationale: 原文の単純な不定詞を直接的に訳した。
- source_word: πυροῦσθαι
  choice: 情欲に燃える
  rationale: 直訳は「燃える」だが、結婚と自制を扱う直近の文脈では性的欲望に燃える意味が最も自然である。比喩は保持し、文脈上の意味を明示した。
- source_word: δὲ
  choice: しかし
  rationale: 前節からの穏やかな対比を示す接続として自然である。
theological_decisions:
- issue: πυροῦσθαι の意味
  choice: 性的な情欲に燃える
  alternative: 単に「燃える」、または裁きの火に焼かれる
  rationale: 自制、独身、結婚を論じる直近の文脈は性的欲望を強く示す。ただしギリシア語自体は何に燃えるかを明示しないため、脚注により字義的な曖昧さを保存した。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。命令形はパウロの勧告の力を保ち、「情欲に燃える」で原文の火の比喩も維持した。
