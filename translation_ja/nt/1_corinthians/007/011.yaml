reference: 1 Corinthians 7:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: ja
  text: しかし、たとえ妻が別れたとしても[a]、独身のままでいるか、夫と和解しなさい。また、夫は妻と離婚してはなりません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しかし、もし妻が別れたなら」とも訳せる。ギリシア語の表現は、ここで「たとえ」という譲歩の含みを持つことがある。
    reason: lexical_alternative
  - marker: b
    text: より字義的には「妻を手放してはなりません」とも訳せる。この婚姻の文脈では、妻を離縁することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: しかし、たとえ……としても
  rationale: 条件を示す ἐάν と、ここで譲歩の含みを持ちうる καί を自然な日本語で表した。単なる「もし」とする可能性は脚注に残した。
- source_word: χωρισθῇ
  choice: 妻が別れた
  rationale: χωρίζω は夫婦が離別することを表すが、法的な離婚まで明示するとは限らない。「離婚した」と限定せず、後半の ἀφιέναι との語の違いも保った。文脈上の女性主体を日本語で明示した。
- source_word: μενέτω
  choice: ……でいる
  rationale: μένω の継続の意味と三人称命令の力を、後続の「しなさい」と組み合わせて自然に表した。
- source_word: ἄγαμος
  choice: 結婚しないで
  rationale: ἄγαμος は「結婚していない」を意味する。「未婚」は一度も結婚していない意味に傾き、「独身」は現代的な身分表現に傾くため、ここでは新たに結婚しない状態を明瞭に表した。
- source_word: καταλλαγήτω
  choice: 和解しなさい
  rationale: 受動形の命令が示す関係の回復を、解釈を加えすぎずに表す一般的で明瞭な語を選んだ。
- source_word: τῷ ἀνδρί
  choice: 夫と
  rationale: 婚姻についての文脈なので、ἀνήρ は「男」ではなく「夫」を指す。日本語では和解の相手を「と」で示すのが自然である。
- source_word: ἄνδρα
  choice: 夫は
  rationale: 対になる後半の一般的な指示として、婚姻関係にある「夫」を主題として明示した。
- source_word: γυναῖκα
  choice: 妻と
  rationale: 婚姻の文脈で γυνή は「妻」を意味する。日本語では一般命題として所有代名詞を加えずとも関係が明らかである。
- source_word: μὴ ἀφιέναι
  choice: 妻と離婚してはなりません
  rationale: ἀφίημι は字義的には去らせる、手放すなどの意味を持つが、この婚姻文脈では妻を離縁することを指す。禁止の力を「してはなりません」で明確にした。より字義的な表現は脚注に示した。
theological_decisions:
- issue: χωρισθῇ と ἀφιέναι を同じ語で訳すか
  choice: 前者を「別れる」、後者を「離婚する」と訳し分ける
  alternative: 両方を「離婚する」、または両方を「別れる」と訳す
  rationale: パウロは異なる二つの動詞を用いている。前半を法的離婚に限定せず、後半の婚姻解消の意味は明瞭にすることで、本文にある区別と解釈上の幅を保った。
- issue: χωρισθῇ の女性主体を明示するか
  choice: 「妻が」と明示する
  alternative: 主語を省略して「別れたとしても」とする
  rationale: 動詞自体には名詞主語がないが、直前の文脈では妻への指示である。日本語でも主語を補うことで、後半の夫への指示との対比が明瞭になる。
- issue: ἄγαμος を再婚禁止として明示するか
  choice: 「結婚しないでいる」と訳す
  alternative: 「再婚せずにいる」または「独身のままでいる」と訳す
  rationale: 文脈上は別離後の新たな結婚を禁じる趣旨だが、原語そのものは「再婚」に限定した語ではない。「結婚しないで」は命令の実質を伝えつつ、原語以上の法的・教理的限定を避ける。
translation_notes:
  register: 明瞭な現代標準語を用い、命令は丁寧でありながら重みのある「しなさい」「してはなりません」で表した。前半の別離と後半の離婚を不用意に同一視せず、原文の語彙上の違いを保った。
