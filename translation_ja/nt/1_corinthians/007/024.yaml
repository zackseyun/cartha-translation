  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: ja
  text: 兄弟たち[b]、一人ひとり、神と共に[a]、自分が召されたその境遇にとどまりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の御前で」または「神の臨在のもとで」。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、女性を含む会衆全体への呼びかけ。
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: 一人ひとり
  rationale: 分配を表す単数形の意味を自然な現代日本語で明確にし、勧告が各人に及ぶことを示す。
- source_word: ἐν ᾧ ἐκλήθη, ἐν τούτῳ
  choice: 自分が召されたその境遇に
  rationale: 前置詞句と関係詞・指示詞の対応を保ちつつ、文脈上の身分や生活状況を指すことが伝わるよう「境遇」とした。
- source_word: ἐκλήθη
  choice: 召された
  rationale: 神の召しを含意するパウロ的用法に適した語を用いる一方、原文に明示されない行為者を訳文に補わず受動形を保つ。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を保つ。会衆全体への呼びかけで女性も含むことは脚注で明示する。
- source_word: μενέτω
  choice: とどまりなさい
  rationale: 現在の境遇に継続しているよう命じる命令の意味を、自然で格調ある日本語で表す。
- source_word: παρὰ θεῷ
  choice: 神と共に
  rationale: παρά＋与格の近接・関係性を簡潔に表す。「神の御前で」という理解も可能なため脚注に残す。
theological_decisions:
- issue: 「召された」の行為者として神を明示するか
  choice: 受動形の「召された」とし、「神に」を補わない
  alternative: 神に召された
  rationale: 文脈上は神の召しが強く示唆されるが、ギリシア語は行為者を明示していないため、その含みを保つ。
- issue: 混合会衆へのἀδελφοίの訳し方
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原文の文法的形を本文に保ちつつ、この呼称が女性を含む会衆全体に向けられていることを脚注で説明する。
- issue: παρὰ θεῷが示す神との関係
  choice: 神と共に
  alternative: 神の御前で
  rationale: 近接・関係を表す圧縮された表現として「神と共に」を採るが、神の臨在または神の前で生きる意味も排除できないため脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令形は尊厳を保つ「とどまりなさい」とした。語順は日本語として自然に整えながら、ἐν ᾧ…ἐν τούτῳの対応を「召されたその境遇」に反映した。
