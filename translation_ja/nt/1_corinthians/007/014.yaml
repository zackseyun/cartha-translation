id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: ja
  text: 信者でない夫は妻との関わりによって聖なるものとされており、信者でない妻はその兄弟との関わりによって聖なるものとされているからです。[a] そうでなければ、あなたがたの子どもたちは汚れているはずです。しかし今は、聖なるものです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その兄弟」は、信者仲間を指すパウロの通常の呼び方で、ここでは信者である夫を指すと考えられます。異訳「信者である夫との関わりによって」。
    reason: lexical_alternative
  - marker: b
    text: ここで「聖なるものとされている」「聖なるもの」とは、信者である配偶者との関係や家庭の中で聖別された状態にあることを表します。必ずしも本人が救われているという意味ではありません。
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: 聖なるものとされている
  rationale: 完了受動形が示す、すでに起きたことの結果として続いている状態を表す。「聖別されている」より一般読者に分かりやすく、個人的救いを自動的に意味するとの解釈も避ける。
- source_word: ἄπιστος
  choice: 信者でない
  rationale: この結婚の文脈では、不誠実という意味ではなく、信じていない配偶者を指す。現代日本語として自然である。
- source_word: ἐν
  choice: との関わりによって
  rationale: 字義的には「〜において」だが、ここでは信者である配偶者との結びつきにおける関係的・手段的意味を表す。単に「によって」として救済の主体を示すような誤解を招くのを避ける。
- source_word: ἀνήρ / γυνή
  choice: 夫／妻
  rationale: 直前から続く結婚の文脈に即して、一般的な「男／女」ではなく配偶者を表す語を選ぶ。
- source_word: ἀδελφῷ
  choice: その兄弟
  rationale: 底本の「兄弟」を保持し、第一の句との対称性を求めて「夫」に置き換えない。ここではパウロが信者仲間を呼ぶ用法で、信者である夫を指すと考えられることを脚注で説明する。
- source_word: ἐπεὶ ἄρα
  choice: そうでなければ
  rationale: 先の主張が成り立たない場合の帰結を導く推論の働きを、自然な日本語で示す。
- source_word: ἀκάθαρτα
  choice: 汚れている
  rationale: 儀礼的・契約的な含みを保つため、「不純」などの一般化された表現より「汚れている」を用いる。
- source_word: νῦν δὲ
  choice: しかし実際には
  rationale: ここでの νῦν は単なる時間的な「今」よりも、仮定に対する現実の状態を示すため、「実際には」とする。
- source_word: ἅγια
  choice: 聖なる者
  rationale: ἡγίασταιとの語彙的なつながりと神学的な緊張を保つ。「取り分けられている」と解釈的に言い換えない。
theological_decisions:
- issue: 信者でない配偶者が「聖なるものとされている」ことの意味
  choice: 結婚と家庭の中で信者である配偶者との関係に置かれた、聖別された状態を表すものとして訳し、個人的救いとは断定しない。
  alternative: 信者との結婚によって自動的に救われる、または単に婚姻関係や性的関係が正当であるという意味に限定する。
  rationale: 本文は配偶者と子どもの清さ・聖さを結びつけて論じるが、その状態を個人的な救済と明言してはいない。原文の「聖なる」語群を保ち、意味を一つの教理に固定しない。
- issue: ἀδελφῷ の指示対象
  choice: 本文では原語に即して「その兄弟」を保持し、脚注で信者である夫を指すと考えられることを示す。
  alternative: 対句の均整を優先して「信者である夫」または「夫」と本文で明示する。
  rationale: 原文は二つ目の句で ἀνήρ ではなく ἀδελφός を用いる。パウロの信仰共同体における呼称を透明に残しつつ、現代の読者に必要な説明を脚注で補う。
- issue: 子どもたちの「聖なる」状態
  choice: 原文どおり「聖なる者」とし、その性質や範囲を本文で詳しく規定しない。
  alternative: 子どもたちは救われている、または単に婚姻上の嫡出子である、と意味を限定する。
  rationale: 本文は「汚れている」と「聖なる」を対置するが、救済論上または社会法上の詳細な定義は与えていないため、真正な曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「聖なる」「汚れている」という原文の対照と神学的語調を保持した。「その兄弟」はやや異質に響くが、原文の語の変化を尊重し、脚注で補った。前半は完了受動の結果状態を「〜とされている」で表し、後半の現在形は、日本語の反実仮想として自然な「〜ことになります」にした。
