source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: ja
  text: しかし、もしある人が、自分の処女[a]に対してふさわしくない振る舞いをしていると思い、彼女が若さの盛りを過ぎていて、そのようになる必要があるなら、望むとおりにすればよい。罪を犯すことにはなりません。二人は結婚しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の婚約者」、または「自分の未婚の娘」とも訳せる。ギリシア語は、婚約者を指すのか、父または保護者のもとにいる娘を指すのか曖昧である。
    reason: 原文の句が、婚約者を指すのか、父または保護者のもとにいる娘を指すのか確定できないため。
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: ふさわしくない振る舞いをしている
  rationale: 礼を失した、体面を損なう、不適切な振る舞いを表す語であり、道徳的意味を過度に限定せず、現代日本語で自然に表した。
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: 自分の処女[a]に対して
  rationale: παρθένοςの基本義「処女」を保ち、αὐτοῦが婚約者との関係を指すのか、父または保護者と娘との関係を指すのかを本文で確定しない。日本語ではやや異例の表現となるため、脚注で主要な解釈を示す。
- source_word: ὑπέρακμος
  choice: 若さの盛りを過ぎていて
  rationale: 年若い盛り、または婚期の盛りを越えたという年齢上の含意を保ちつつ、特定の年齢や事情を補わない。
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: そうなる必要があるなら
  rationale: ὀφείλειの必要・義務の意味と、γίνεσθαιの広い意味を保ち、何が必要なのかを具体化しすぎない。
- source_word: ὃ θέλει ποιείτω
  choice: その人は望むとおりにしなさい
  rationale: 三人称命令の許可的な力を明確にし、現代日本語として自然に表した。
- source_word: οὐχ ἁμαρτάνει
  choice: 罪を犯すことにはなりません
  rationale: その選択が罪ではないという道徳的許容を、文脈に即した自然な日本語で示す。
- source_word: γαμείτωσαν
  choice: 二人は結婚しなさい
  rationale: 複数形の三人称命令が当事者二人の結婚を指すことを明示し、勧告より強い命令・許可の響きを保つ。
theological_decisions:
- issue: 「自分の処女」（παρθένον αὐτοῦ）が誰を指すか
  choice: 本文では「自分の処女」とし、ギリシア語の曖昧さを残す。
  alternative: 「自分の婚約者である処女」または「自分の処女である娘」
  rationale: この句は、男性とその婚約者の関係とも、父または保護者と未婚の娘の関係とも解されてきた。原文だけでは一方に確定できないため、本文で解釈を固定せず、脚注に主要な可能性を記す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の人間関係に関する曖昧さを本文に残したため、「自分の処女」は通常の日本語としてやや異例だが、脚注によって意味の可能性を説明した。
