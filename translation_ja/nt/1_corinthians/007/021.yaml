  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: ja
  text: 奴隷の身で召されたのですか。それを気に病んではなりません。しかし、もし自由の身になれるのであれば、むしろその機会を生かしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「むしろ今の境遇を生かしなさい」。ギリシア語の「むしろ生かしなさい」には目的語が明示されておらず、自由になる機会を指すとも、現在の境遇を指してそのままとどまるよう勧めるとも理解されてきた。
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: 奴隷の身で
  rationale: 社会的な隷属状態と解放の可能性が話題なので、結びつきの弱い「僕」ではなく「奴隷」を用いる。「身で」により、召された時点の境遇を自然な日本語で示す。
- source_word: ἐκλήθης
  choice: 召された
  rationale: 神による召しというパウロ的用法を保ちつつ、原文にない「神に」「信仰へ」を補わない。
- source_word: μή σοι μελέτω
  choice: それを気に病んではなりません
  rationale: 単なる関心ではなく、境遇を思い煩うことへの牧会的な勧告として表す。
- source_word: ἐλεύθερος γενέσθαι
  choice: 自由の身になれる
  rationale: 奴隷状態から自由身分への移行を、明瞭で自然な現代日本語で示す。
- source_word: μᾶλλον χρῆσαι
  choice: むしろその機会を生かしなさい
  rationale: χρῆσαιの目的語は明示されないが、本文では直前の自由になれる可能性を受ける読みを採る。「機会」は意味を明確にする補足であり、別解は脚注に残す。
theological_decisions:
- issue: μᾶλλον χρῆσαι の解釈上の曖昧さ
  choice: 自由になれる機会があるなら、それを生かすよう勧める。
  alternative: 現在の奴隷としての境遇をむしろ生かす、すなわちそのままとどまるよう勧める。
  rationale: 直前の「自由の身になれるのであれば」が、省略された目的語を最も自然に供給する。ただしギリシア語は目的語を明示せず、もう一つの解釈にも長い支持の歴史があるため、脚注で曖昧さを保持する。
translation_notes:
  register: 明瞭で品位ある現代標準語。奴隷制という具体的な社会的身分を婉曲化せず、命令は文脈に合う丁寧体で統一した。
