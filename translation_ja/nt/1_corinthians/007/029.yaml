source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: ja
  text: 兄弟たち[a]、私が言いたいのはこうです。定められた時は短くなっています。[b] 今後は、妻のいる人も、妻のいない人のようにあるべきです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は男性複数形の語の訳だが、ここでは女性を含む信者仲間全体への呼びかけであり得る。
    reason: cultural_note
  - marker: b
    text: 別訳「時は縮められています」。原文は、時が縮められた結果、今も短い状態にあることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: 私はこう言います
  rationale: 説明を導入するパウロの定型句を、簡潔で自然な現代日本語にした。「私が言いたいのはこういうことです」も可能だが、本文にない説明的な含みを強めすぎない表現を選んだ。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を保ちつつ、初期キリスト教共同体への呼びかけとして自然な表現にした。文脈上、男女を含む信者全体を指し得ることは脚注で示した。
- source_word: ὁ καιρός
  choice: 定められた時
  rationale: 単なる時間の長さではなく、決定的・時宜的な時を表すκαιρόςの質的な含みを明示した。
- source_word: συνεσταλμένος ἐστίν
  choice: 短くなっています
  rationale: 完了分詞と現在形による迂言的構文が示す、短くされた結果として現在そうなっている状態を自然な日本語で表した。行為者は本文に明示されないため、「短くされています」として受動の行為者を想起させる訳は避けた。
- source_word: τὸ λοιπὸν
  choice: これからは
  rationale: 残された時における今後の生き方へ話を進める時間的な働きを、明瞭な現代日本語で示した。
- source_word: ἵνα
  choice: ですから……していなさい
  rationale: 時が短くなっていることと、それに続く生活上の勧告とのつながりを表した。目的と結果のどちらかに限定しすぎないよう、日本語では文脈的な帰結として自然につないだ。
- source_word: οἱ ἔχοντες γυναῖκας
  choice: 妻のいる人
  rationale: ここでγυναῖκαςは一般的な「女性」ではなく「妻」を意味する。「妻を持つ人」より自然で、対象物のように響きにくい日本語を選んだ。
- source_word: ὡς μὴ ἔχοντες
  choice: いない者のように
  rationale: 比較表現の鋭さを保ち、妻が実際にいないという意味にはせず、「ように」と訳した。直前の「妻」を受けるため反復を避けた。
theological_decisions:
- issue: 結婚に関する勧告の牧会的・神学的意味
  choice: 「妻のいる人も、いない者のように」と直接的に訳し、結婚生活への執着を弱める等の解釈的説明を本文に加えない。
  alternative: 「結婚に心を奪われずに生きなさい」などと意味を説明して訳す。
  rationale: 本文は、時が短いという切迫感のもとで通常の社会的状況を相対化する、意図的に緊張を帯びた勧告である。婚姻上の義務の否定にも、単なる内面的態度にも訳文だけで限定せず、その緊張を保持した。
- issue: καιρόςの神学的含意
  choice: 「定められた時」とし、終末論的含意を感じさせながらも、具体的に何の時かは補わない。
  alternative: 「終わりの時」「主が来られるまでの時」と明示する。
  rationale: 近接文脈には切迫した終末論的方向性があるが、この節自体はその内容を明示していないため、訳文で特定しすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの切迫した勧告の格調と鋭さを保った。「妻を持つ」は不自然かつ所有物のように響くため避け、「妻のいる人」とした。命令的な力は「していなさい」で示しつつ、過度に古風な文語表現は用いていない。
