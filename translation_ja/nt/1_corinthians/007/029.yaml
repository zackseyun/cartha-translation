  naturalness: 全体は明瞭な現代日本語です。「私はこう言います」より「私が言いたいのはこうです」の方が、この談話導入句として自然です。「妻のいる人も、いない者のようにしていなさい」は、「いない」の対象が一瞬不明瞭であり、「していなさい」も何をするのかが曖昧です。
  terminology: 「兄弟たち」は原語の男性複数形を反映しており、脚注で混合集団への呼びかけであり得ることを示す処置も適切です。「定められた時」はκαιρόςの含意を過度に終末論的に特定せずに表せています。「妻」はこの文脈のγυναῖκαςに適切です。
