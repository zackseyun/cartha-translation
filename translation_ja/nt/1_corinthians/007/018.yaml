  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: ja
  text: 割礼を受けた状態で召された人がいるなら、割礼を受けていないように見せようとしてはいけません[a]。割礼を受けていない状態で召された人がいるなら、割礼を受けてはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「包皮を引き伸ばして覆おうとしてはいけません」。すなわち、割礼を受けていないように見せようとしてはいけない、という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: 割礼を受けた状態で
  rationale: 完了分詞が、割礼という行為の結果として続いている状態を表すため。日本語でも召された時点の状態が明確になる。
- source_word: ἐκλήθη / κέκληταί
  choice: 召された
  rationale: 文脈上、神による召しを指す可能性が高い。解釈を過度に限定する「回心した」とせず、原語の神学的含意を保つ。二つの動詞の時制・相の違いは、日本語では不自然な区別を設けず同じ表現にした。
- source_word: ἐπισπάσθω
  choice: 割礼の跡を元に戻そうとしてはいけません
  rationale: 割礼の外見的な跡を覆い隠し、未割礼の状態に見せようとすることを指す。直訳の意味を踏まえつつ、古代の処置を知らない現代の読者にも理解できるようにした。
- source_word: ἐν ἀκροβυστίᾳ
  choice: 割礼を受けていない状態で
  rationale: 召された時の未割礼という状態を表す。字義的な「包皮のうちに」ではなく、明瞭で自然な現代日本語とした。
- source_word: περιτεμνέσθω
  choice: 割礼を受けてはいけません
  rationale: μήを伴う現在命令形の禁止を、明確で自然な日本語で表した。
theological_decisions:
- issue: 二つの節における「召された」の意味
  choice: ある宗教的・社会的状態にある時に、神によってキリスト者としての歩みへ召されたこと
  alternative: 一般的な意味で呼ばれたこと
  rationale: 第一コリント7章の直近の文脈では、パウロは神の召しを受けた時の信者の状態について語っている。ただし「回心した」と意訳せず、「召された」として原文の表現と含みを残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。「状態で」を用いて二つの節の並行性を示し、古代の身体的処置に関する表現は本文で理解可能にしつつ、脚注に直訳を示した。
