id: 1CO.7.30
reference: 1 Corinthians 7:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: ja
  text: 泣いている人は泣いていないかのように[a]、喜んでいる人は喜んでいないかのように、買う人は所有していないかのように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「泣いていない者のように……喜んでいない者のように……所有していない者のように」。ギリシア語は「……していないように」という形を繰り返しており、これらの経験が実際にはないという意味ではなく、どのような姿勢で生きるかを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: 泣いている人
  rationale: 冠詞付き現在分詞を、人を表す実体的用法として訳した。「悲しむ人」よりも、涙を流す具体的な動作を直接に保っている。
- source_word: ὡς μὴ κλαίοντες
  choice: 泣いていないかのように
  rationale: ὡς＋μή＋分詞は、実際に泣いていることを否定するのではなく、どのような姿勢でいるかを表す。現代日本語として自然な「かのように」で、簡潔な反復も保った。
- source_word: χαίροντες
  choice: 喜んでいる人
  rationale: χαίρωの基本的な意味を取り、「泣いている人」と対応する現在進行的な表現にした。
- source_word: ὡς μὴ χαίροντες
  choice: 喜んでいないかのように
  rationale: 直前と同じ構文を同じ形で訳し、パウロの修辞的な並行関係を保った。
- source_word: ἀγοράζοντες
  choice: 買う人
  rationale: 日常的な商取引による取得を表すため、明快で一般的な「買う」を用いた。
- source_word: κατέχοντες
  choice: 所有している
  rationale: κατέχωには「つかむ」「保つ」「所有する」などの意味があるが、ここでは「買う」と対置されているため、買った物を自分の所有物として保持する意味を表す「所有する」が適切である。
- source_word: καὶ
  choice: （読点による並列）
  rationale: 反復されるκαὶは三つの句を累加的に結ぶ。日本語では各句を読点で連ねることで、冗長さを避けつつ原文のリズムと並列を保った。
theological_decisions:
- issue: 反復される「ὡς μὴ」の解釈上の力
  choice: 泣くこと、喜ぶこと、買うことの現実を否定せず、それらに究極的に縛られない生き方を示す表現として訳した。
  alternative: これらの行為自体を不適切とする禁欲的な命令、または終末論的文脈を離れた純粋に心理的な態度の指示と読むこと。
  rationale: ὡς μὴ＋分詞は絶対的な禁止や事実の否定ではなく、行動や生き方の様態を表す。直近の文脈には「今の危機」と「この世の有様は過ぎ去る」との言及があり、その緊張を本文で説明し切らずに保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「かのように」の反復によって原文の簡潔で格調ある並行構造を保った。この節は前節から続く構文の一部なので、原文にない命令語を補わず、末尾を体言的な連続のままにした。
