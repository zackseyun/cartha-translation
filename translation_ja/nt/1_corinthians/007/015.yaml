id: 1CO.7.15
reference: 1 Corinthians 7:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: ja
  text: しかし、信者でない者が別れるなら、そのまま別れさせなさい。そのような場合、兄弟であれ姉妹であれ、奴隷にされてはいません。[a] 神は私たちを平和のうちに召してくださったのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「拘束されてはいません」。原語は通常の「縛る」ではなく、「奴隷にする」を意味する動詞です。この自由が再婚まで含むかどうかを、この節は明言していません。
    reason: lexical_alternative
  - marker: b
    text: 異本では「私たち」を「あなたがた」とします。
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: 信者でないほう
  rationale: 名詞的に用いられた表現を保ちつつ、結婚の文脈で夫婦のうち信仰を持たない側を指すことが自然に分かる現代日本語とした。「配偶者」は文脈上正しいが、原文には明示されないため補わなかった。
- source_word: χωρίζεται / χωριζέσθω
  choice: 別れようとする／別れさせなさい
  rationale: 婚姻関係における離別を表すが、法的離婚か物理的別居かを限定しない。「別れる」を反復して語彙上のつながりを保ち、命令形は離別を強制する命令ではなく、それを妨げず容認する趣旨として表した。
- source_word: οὐ δεδούλωται
  choice: 奴隷のように縛られてはいません
  rationale: δουλόω の奴隷化という強い比喩を「奴隷のように」で明示しつつ、日本語として理解できる形にした。単に「拘束されていない」とすると原語の奴隷語彙が消えるため避けた。
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: 兄弟も姉妹も
  rationale: 信徒仲間を表す兄弟姉妹の語を保持し、男女双方を明示した。文脈上の「信者である夫または妻」へ説明的に置き換えることは避けた。
- source_word: ἐν τοῖς τοιούτοις
  choice: そのような場合
  rationale: 直前に述べた離別のような状況を指す慣用句として、明瞭で自然な日本語にした。
- source_word: ἐν δὲ εἰρήνῃ
  choice: 平和のうちに
  rationale: 神の召しが置かれている領域・あり方を示す表現として前置詞句を保った。「平和へ」と目的を明確化しすぎない。
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: 神は私たちを…召してくださった
  rationale: 完了形の、過去の召しが現在にも効力を持つ含みを日本語の完了表現で示し、SBLGNTのἡμᾶς「私たち」を採用した。
theological_decisions:
- issue: οὐ δεδούλωται が婚姻の解消や再婚についてどこまで意味するか
  choice: 奴隷語彙を保って訳し、その自由の範囲を本文で規定しない。
  alternative: 再婚を許可する法的意味で「婚姻に縛られていない」とする、または去る配偶者を引き止める義務だけがないと限定する。
  rationale: 節自体は信者がそのような場合に「奴隷とされていない」と述べるが、その帰結を明示していない。再婚の可否などを訳文で決着させず、神学的緊張を保持した。
- issue: ὁ ἄπιστος の指示対象
  choice: 「信者でないほう」とし、夫婦の一方であることは文脈に委ねる。
  alternative: 「信者でない配偶者」と明示する。
  rationale: 指示対象は文脈上、信仰を持たない配偶者だが、原文自体は「配偶者」という名詞を用いていないため、説明を本文へ取り込まなかった。
- issue: 「平和のうちに召した」と離別容認との論理関係
  choice: 接続詞δέを「しかし」等で一義的に解釈せず、独立した文として並べる。
  alternative: 「なぜなら神は…」として理由を明示する、または「むしろ平和へ」と強い対照にする。
  rationale: δέの関係と「平和」が離別の容認を支えるのか、婚姻維持への勧めにつながるのかには解釈上の幅があるため、訳文で論理を限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「別れさせなさい」は許容を表す命令であり、離婚を積極的に命じる意味にはしない。「奴隷のように縛られて」は原語の比喩を可視化しつつ、日本語としての理解可能性を確保した。
