  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: ja
  text: また、信者でない夫を持つ女性がいて、その夫が彼女と一緒に暮らすことを望んでいるなら、彼女は夫と別れてはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夫と離婚してはなりません」とも訳せます。ギリシア語の動詞は、より字義的には「去らせる」「手放す」を意味し得ますが、ここでは婚姻関係を終わらせることを指しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις ἔχει ἄνδρα ἄπιστον
  choice: 信者でない夫がいる女の人がいて
  rationale: γυνήは文脈上既婚女性を指すが、日本語で「妻に夫がいる」とすると不自然なため、「女の人」とし、ἄνδραを「夫」として婚姻関係を明示した。ἄπιστονは婚姻上の不誠実ではなくキリスト信仰を共有しないことを指すため、「信者でない」とした。
- source_word: οὗτος συνευδοκεῖ
  choice: その夫が…望んでいる
  rationale: οὗτοςの指示対象を「その夫」と明示した。συνευδοκεῖは同意と意欲を表し、ここでは共同生活を続ける意思を自然な日本語で示す「望んでいる」とした。
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: 彼女と一緒に暮らすこと
  rationale: 継続する共同生活を表す句として、現代日本語で明瞭な表現を選んだ。
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: 彼女は夫と別れてはなりません
  rationale: ἀφίημιは婚姻関係を終わらせる意味を帯びる一方、字義的には「去らせる／離れる」の幅がある。「離婚してはならない」と法的意味に限定せず、「別れてはならない」として文脈上の婚姻関係の解消を表した。
theological_decisions:
- issue: 異なる信仰を持つ夫婦に対するἀφιέτωの命令
  choice: 夫と別れてはなりません
  alternative: 夫と離婚してはなりません／夫を去らせてはなりません
  rationale: 婚姻を維持するよう命じる趣旨を明瞭にしつつ、ἀφίημιが法的離婚だけを明示するかについての語義的な余地を残した。特定の教派的離婚論は持ち込んでいない。
translation_notes:
  register: 明瞭で自然な現代標準日本語とし、命令の厳粛さを「てはなりません」で保った。「女の人」は一般読者に分かりやすく、「信者でない」は「不信仰な」が持ち得る道徳的含意を避ける。
