reference: 1 Corinthians 7:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: ja
  text: しかし、たとえあなたが結婚しても、罪を犯したことにはなりません。また、処女が結婚しても、罪を犯したことにはなりません。ただ、そのような人々は、肉において苦難を経験することになります[a]。私はあなたがたをそれから免れさせたいのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉において苦難を持つことになります」。結婚に伴う、この地上の身体的・生活上の困難を指すと考えられます。「肉」はここで特に「罪深い性質」を意味するとは限りません。
    reason: lexical_alternative
  - marker: b
    text: または「私はあなたがたを免れさせます」「私はあなたがたをいたわっているのです」。パウロは、このような苦難について警告する牧会的な意図を述べています。
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: あなたが結婚しても
  rationale: ἐάνを伴うアオリスト接続法の未来志向の条件を、自然な日本語の「たとえ…しても」で表した。καίの強意も反映している。
- source_word: ἥμαρτες / ἥμαρτεν
  choice: 罪を犯したことにはなりません
  rationale: 結婚という行為が罪を構成しないという道徳的判断を明確にしつつ、アオリストの趣旨を自然な現代日本語で伝える。
- source_word: ἡ παρθένος
  choice: 処女
  rationale: 語の明示する性的身分を一般的な「未婚の女性」に広げず、文脈上の曖昧さを保った。定冠詞は日本語では明示しない。
- source_word: θλῖψιν
  choice: 苦難
  rationale: 圧迫、苦しみ、困難を表す語。単なる「問題」より強さを保ちつつ、終末論的な専門語に限定しない表現を選んだ。
- source_word: τῇ σαρκὶ
  choice: 肉において
  rationale: σάρξを直ちに「罪深い性質」と解釈せず、身体を伴う地上の生活という含みを残すため、原語に近い表現を本文に置いた。
- source_word: οἱ τοιοῦτοι
  choice: そのような人々
  rationale: 直前に述べられた、結婚する人々を指す一般的な表現として訳した。
- source_word: φείδομαι
  choice: 私はあなたがたをそれから免れさせたいのです
  rationale: 「惜しむ、容赦する、免れさせる」という意味と、警告に込められた牧会的意図を自然な日本語で表した。「それから」は文脈上の苦難を指す補足である。
theological_decisions:
- issue: τῇ σαρκίにおけるσάρξの意味
  choice: 「肉において」と訳し、地上の身体的生活に伴う苦難として注で説明する
  alternative: 「この世の生活で」「身体上の」「罪深い性質において」
  rationale: ここでは人間の堕落した性質を論じているのではなく、結婚する人が現実の生活で直面する苦難を警告していると考えられる。ただし本文では比喩性を断定せず、パウロの語を保つ。
- issue: φείδομαιが示す時制・意図
  choice: 「免れさせたいのです」
  alternative: 「免れさせます」「容赦しています」
  rationale: 現在形そのものは単純に「惜しむ／免れさせる」とも訳せるが、文脈ではパウロが勧告によって読者を苦難から守ろうとする意図を述べている。断定的な成功より牧会的な願いを表す訳を採った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「処女」と「肉において」は原文の語義と解釈上の余地を保つため本文に残し、意味の見通しは脚注で補った。文末は敬体で統一した。
