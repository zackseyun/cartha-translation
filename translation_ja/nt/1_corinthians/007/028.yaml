  source_fidelity: 本文は条件節（「たとえ…しても」）、結婚は罪ではないという二つの並行した断言、結婚する者に予想される「肉における」苦難、そしてパウロが読者をその苦難から守ろうとする意図を、原文の順序と意味に即して伝えています。「肉において」はσάρξを性質論に狭めず、原文の余地を保っています。
  naturalness: 全体として明瞭で品位ある現代標準日本語です。「肉において」は日常語としてはやや硬いものの、本文で原語の表現を保ち、脚注で意味を補う方針のもとでは適切です。「罪を犯したことにはなりません」も、この行為が罪に当たらないことを自然に表しています。
  terminology: 「処女」はπαρθένοςの具体性を保ち、不要に「未婚女性」や「婚約者」に限定していません。「苦難」はθλῖψιςの強さを保ちつつ終末論用語に限定しない適切な選択です。脚注a・bはそれぞれ本文中の「肉において苦難」と「免れさせたい」に正しく対応しています。
