  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: ja
  text: しかし私は、すべての人が私のようであってほしいと願っています。けれども、一人ひとりが神から自分固有の賜物を与えられています。ある人にはこのように、別の人にはあのように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: 願っています
  rationale: 文脈上、命令や決定ではなく、パウロ自身の願望を表すため。「望みます」も可能だが、自然で穏やかな日本語とした。
- source_word: πάντας ἀνθρώπους
  choice: すべての人
  rationale: ἄνθρωπος の複数形はここでは人間一般を指す。文脈には男女双方が含まれるため、「すべての男」ではなく「すべての人」とした。
- source_word: ὡς καὶ ἐμαυτόν
  choice: 私のよう
  rationale: 具体的に何の状態を指すかは周辺文脈から理解されるが、原文自体の簡潔さと含みを保ち、本文では説明を加えない。
- source_word: ἴδιον χάρισμα
  choice: 自分固有の賜物
  rationale: ἴδιον の個別性と χάρισμα の神から与えられる恵みの賜物という含意を表す。
- source_word: ἔχει ... ἐκ θεοῦ
  choice: 神から……受けており
  rationale: 直訳的な「神から持っている」は日本語として不自然なため、由来を示す ἐκ θεοῦ を保ちながら自然に表現した。
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: ある人はこのように、別の人はあのように
  rationale: 異なる人に異なる賜物が与えられているという対照を、具体的内容を限定せずに保った。
theological_decisions:
- issue: 「私のよう」が指す状態
  choice: 本文では具体化しない
  alternative: 「独身である私のよう」または「節制できる私のよう」
  rationale: 7章の文脈から独身ないし結婚せずにいる状態が強く示唆されるが、この節の表現自体は明示していないため、解釈を本文へ織り込まない。
- issue: 「賜物」の違いの内容
  choice: 「このように／あのように」と曖昧さを維持する
  alternative: 独身の賜物と結婚の賜物を明記する
  rationale: 文脈上その対照が考えられるものの、原文は内容を明示せず οὕτως を反復しているため、神学的な限定を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、使徒書簡にふさわしい落ち着いた格調を保った。「しかし／けれども」で δὲ と ἀλλά の対比を自然に示した。
