reference: 1 Corinthians 7:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: ja
  text: 主にあって召された奴隷は、主に属する自由にされた者[a]だからです。同じように、自由の身で召された者は、キリストの奴隷です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「主の解放奴隷」。原語は、奴隷の身分から解放された人を指します。「主に属する」という関係と、主によって解放されたという含意の双方を含み得ます。
    reason: ἀπελεύθεροςの社会的・語彙的限定を示し、κυρίουの属格を解放の行為者だけに限定しないため。
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隷
  rationale: 社会的な隷属とキリストへの帰属を鋭く対照させるパウロの逆説を保つため、「僕」ではなく「奴隷」とした。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡での結びつき・領域を表す含意を過度に限定せず、日本語の聖書文体としても理解できる形にした。
- source_word: κληθεὶς
  choice: 召された
  rationale: 神による召しを示す受動形を保持した。
- source_word: ἀπελεύθερος
  choice: 自由にされた者
  rationale: 奴隷状態から解放された者を指す語であり、現代日本語では歴史的身分語の「解放奴隷」より自然で明瞭な表現を選んだ。
- source_word: κυρίου
  choice: 主によって自由にされた者
  rationale: 属格は、主に属する解放者という所有・関係の含みもあり得るが、日本語では解放の主体として自然に表現した。曖昧さは脚注で示した。
- source_word: ὁμοίως
  choice: 同じように
  rationale: 二つの身分の逆説的な対応関係を明確に示す。
- source_word: ἐλεύθερος
  choice: 自由の身で…者
  rationale: 奴隷ではない社会的身分を明示しつつ、代表的単数を不必要に男性限定しない自然な日本語とした。
- source_word: Χριστοῦ
  choice: キリストの
  rationale: 日本語で定着した称号表記「キリスト」を用い、属格の帰属関係を保った。
- source_word: κύριος
  choice: 主
  rationale: 単なる社会的主人を超える、イエスへの神学的称号として訳した。
theological_decisions:
- issue: 社会的身分と主への帰属をめぐる逆説
  choice: 「奴隷」と「自由にされた者」、また「自由の身」と「キリストの奴隷」の対照を維持する。
  alternative: δοῦλοςを「僕」「しもべ」として表現を和らげる。
  rationale: この節の論旨は、地上の身分が主との関係によって相対化されるという鋭い反転にあるため。
- issue: κυρίουを伴うἀπελεύθεροςの関係
  choice: 本文では「主によって自由にされた者」とする。
  alternative: 「主に属する、自由にされた者」「主の解放奴隷」。
  rationale: 属格は所有・帰属とも解放者の含意とも理解できる。本文では自然な因果関係を示しつつ、別の理解を脚注に残して曖昧さを保った。
- issue: Χριστόςの称号表現
  choice: キリスト
  alternative: メシア
  rationale: 日本語では「キリスト」がΧριστόςの称号として広く定着しており、明瞭で自然である。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「召された」「主にあって」は神学的含意を保つため簡潔で品位ある聖書語彙として用いた。「奴隷」は原文の身分上の対照を弱めないため保持した。
