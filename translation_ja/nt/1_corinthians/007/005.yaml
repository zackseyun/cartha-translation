  - severity: medium
    issue: 「その後また一緒になる場合は別です」が再会を例外の条件へ組み込み、勧めの統語を弱めている。
    rationale: πάλιν ἐπὶ τὸ αὐτὸ ἦτε は、祈りのための一時的な差し控えの後、再び共にあるよう求める句です。独立した「その後は…なりなさい」とするのが適切です。
  - severity: low
    issue: 脚注の「同じところにいる」は句を場所の一致として誤解させうる。
    rationale: ἐπὶ τὸ αὐτό はこの文脈で「再び一緒にいる／共にある」という慣用的表現であり、単に同一地点にいることを述べるものではありません。
  revised_text: 互いに相手を拒んではなりません。ただし、祈りに専念するために、双方の合意によってしばらくの間そうする場合は別です。その後は、再び一緒になりなさい[a]。それは、あなたがたの自制の欠如につけ込んで、サタンがあなたがたを誘惑することのないためです。
