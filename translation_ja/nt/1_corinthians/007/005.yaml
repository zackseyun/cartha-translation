id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: ja
  text: 互いに相手を拒んではなりません。ただし、祈りに専念するために、双方の合意によってしばらくの間そうする場合は別です。その後は、再び一緒になりなさい[a]。それは、あなたがたの自制の欠如につけ込んで、サタンがあなたがたを誘惑することのないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「再び一緒にいる」。ここでは、夫婦としての生活を再開することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: 拒んではなりません
  rationale: この文脈では、配偶者に与えるべきものを差し控えることを指す。「拒む」は現代日本語として自然で、金銭的な「だまし取る」という語感を避けつつ、夫婦間の相互的な義務を示す。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 相互性を簡潔かつ自然に表す。命令が夫婦の双方に向けられていることを保つ。
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: ただし、双方の同意の上で……場合は別です
  rationale: 限定的な例外と、夫婦双方の合意を明示する。μήτι ἄνの控えめな限定は、例外を条件付きで述べる日本語の構文に反映した。
- source_word: πρὸς καιρόν
  choice: しばらく
  rationale: 期間が限定されていることを、自然な現代日本語で示す。
- source_word: σχολάσητε τῇ προσευχῇ
  choice: 祈りに専念する
  rationale: σχολάζωがここで表す、他の事柄から自由になって特定の営みに身を向ける意味を明瞭に伝える。
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: その後また一緒になる
  rationale: 夫婦生活を再開する含意を保ちながら、原文と同じく慎みのある間接表現とした。
- source_word: πειράζῃ
  choice: 誘惑する
  rationale: サタンが主体であり、罪へ誘う意味なので、「試す」ではなく「誘惑する」が適切。
- source_word: Σατανᾶς
  choice: サタン
  rationale: 人格的存在を指す固有名として、標準的な日本語音写を用いた。
- source_word: ἀκρασίαν
  choice: 自制できない
  rationale: 自制力の欠如を、非難を過度に強めず、普通の読者に明瞭な現代日本語で表現する。
theological_decisions:
- issue: πάλιν ἐπὶ τὸ αὐτὸ ἦτεを性交の再開と明示するか、より間接的に訳すか
  choice: 「その後また一緒になる」とし、夫婦の性的結びつきの含意は文脈に委ねる
  alternative: 「その後また夫婦の交わりを持つ」
  rationale: この句は文脈上、夫婦の性的関係の再開を含むが、ギリシア語自体は慎みのある間接表現である。その表現上の抑制を保つ。
- issue: ὁ Σατανᾶςを固有名として扱うか、普通名詞的に「敵対者」とするか
  choice: 固有名「サタン」
  alternative: 「敵対者」
  rationale: ここではパウロが人格的な誘惑者を指しており、固有名としての音写が原文の指示対象を最も自然に保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい端正な敬体を用いた。性的文脈を不必要に露骨にせず、原文の相互性、期間の限定、祈りという目的、誘惑への警戒を保持した。
