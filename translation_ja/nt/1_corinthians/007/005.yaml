revisions:
- from: 互いに拒んではなりません。ただし、祈りに専念するため、双方の同意の上でしばらく離れ、その後また一緒になる場合は別です[a]。それは、あなたがたが自制できないために、サタンがあなたがたを誘惑することのないためです。
  to: 互いに相手を拒んではなりません。ただし、祈りに専念するために、双方の合意によってしばらくの間そうする場合は別です。その後は、再び一緒になりなさい[a]。それは、あなたがたの自制の欠如につけ込んで、サタンがあなたがたを誘惑することのないためです。
  rationale: 「離れ」を「そうする」、すなわち相手を拒むことを一時的に控えるという照応表現に置き換え、原文にない別居の含意を除きました。再び共にあることは例外の条件ではなく、その後の勧めとして独立させました。脚注も、場所ではなく夫婦として再び共にあることを示すよう修正しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:59Z'
review_pass:
  verdict: revise
  source_fidelity: 「しばらく離れ」は、相互の性的・夫婦的交わりを控えることをいう原文以上に、物理的に別居・離別する意味を加えうるため修正が必要です。また、πάλιν ἐπὶ τὸ αὐτὸ ἦτε は「場合は別です」という例外条件の一部ではなく、その後に再び共にあるよう求める文です。改訂はこの命令的な勧めと原文の慎みある間接表現を保ちます。
  naturalness: 改訂文は明瞭な現代標準日本語の敬体であり、夫婦間の文脈を不必要に露骨にせずに表します。「自制の欠如につけ込んで」は、διὰ τὴν ἀκρασίαν ὑμῶν の因果関係を自然に示します。
  terminology: 「サタン」は固有名として適切です。「祈りに専念する」「双方の合意によって」「自制の欠如」はそれぞれ σχολάσητε τῇ προσευχῇ、ἐκ συμφώνου、ἀκρασίαν を正確かつ現代的に表します。
