reference: 1 Corinthians 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: ja
  text: しかし、私たちは奥義[a]として、神の知恵、すなわち隠されていた知恵を語ります。この知恵を、神は諸時代に先立って[c]、私たちの栄光のためにあらかじめ定めておられました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「秘められたことのうちに」とも訳せる。「奥義」は、パウロにおいてしばしば、かつて隠されていたが今は明らかにされた神の計画を指す。
    reason: lexical_alternative
  - marker: b
    text: 「前もって決めておられた」または「予定しておられた」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳すると「諸時代より前に」。また「世界が始まる前に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: 私たちは……語ります
  rationale: 「語る」という基本義を保ち、正式な宣教を意味する語へ過度に強めないため。
- source_word: θεοῦ σοφίαν
  choice: 神の知恵
  rationale: 属格を自然な所有・起源の表現とし、この知恵が神に属し、神から出ることを保つため。
- source_word: ἐν μυστηρίῳ
  choice: 奥義のうちに
  rationale: パウロにおける、かつて隠され今や明らかにされた神の計画という含みを保ちつつ、前置詞句の曖昧さを性急に解消しないため。
- source_word: τὴν ἀποκεκρυμμένην
  choice: すなわち隠されていた知恵
  rationale: 女性単数の分詞が「知恵」を受けることを日本語で明示し、完了受動の継続的な含みを「隠されていた」で表すため。
- source_word: προώρισεν
  choice: あらかじめ定めておられた
  rationale: 神による事前の決定という動詞の強さを保ちながら、特定の教派的体系を訳語そのものに持ち込まないため。
- source_word: πρὸ τῶν αἰώνων
  choice: あらゆる時代に先立って
  rationale: αἰῶνεςの時間的・宇宙的な枠組みを保ち、単に「昔」と弱めないため。
- source_word: εἰς δόξαν ἡμῶν
  choice: 私たちの栄光のために
  rationale: 目的・帰結を示すεἰςとδόξαの重みを直接的に保ち、「栄光を与える」などの説明的補足を本文に加えないため。
theological_decisions:
- issue: パウロ書簡で教理的含意を持つ προώρισεν の訳し方
  choice: あらかじめ定めておられた
  alternative: 予定しておられた／前もって決めておられた
  rationale: 原語が示す神の事前の決定を明確にしつつ、「予定」という専門用語に伴う特定の教派的連想で本文の意味を狭めない。
- issue: ἐν μυστηρίῳ と「隠されていた知恵」の関係
  choice: 奥義のうちに神の知恵、すなわち隠されていた知恵を語る
  alternative: 奥義として神の知恵を語る／秘かに神の知恵を語る
  rationale: 前置詞句の機能には解釈上の幅があるため、「秘かに」と断定せず、神の隠されていた目的というパウロ的含意を残す。
translation_notes:
  register: 現代標準日本語の丁寧体を用い、平明さと礼節を両立させた。「奥義」は日常語ではないため脚注で説明し、本文ではパウロ的な専門性を保持した。ギリシャ語の長い一文は、日本語での理解を助けるため二文に分けた。
