revisions:
- from: しかし私たちは、奥義[a]のうちに神の知恵、すなわち隠されていた知恵を語ります。それは、神があらゆる時代に先立って[c]、私たちの栄光のためにあらかじめ定めておられた[b]知恵です。
  to: しかし、私たちは奥義[a]として、神の知恵、すなわち隠されていた知恵を語ります。この知恵を、神は諸時代に先立って[c]、私たちの栄光のためにあらかじめ定めておられました[b]。
  rationale: 意味内容と神学的な含意は維持したまま、「奥義のうちに」を自然で明瞭な「奥義として」に改めました。また、「あらゆる時代」を「諸時代」に改め、πρὸ τῶν αἰώνωνの表現を余計な普遍化なしに反映しました。二文構成、神の主語、隠された知恵との同格関係、および「私たちの栄光のために」という目的は保持しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:04Z'
