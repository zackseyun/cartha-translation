source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: ja
  text: というのも、私はあなたがたの間では、イエス・キリスト[a]、しかも十字架につけられたこの方のほかには、何も知るまいと決めたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア（油注がれた者）」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: 決めていた
  rationale: ここでのκρίνωは司法的な「裁く」ではなく、意志を定めることを表す。文脈上、コリントでの宣教に臨む以前からの決意を自然な日本語で示した。
- source_word: τι εἰδέναι
  choice: 何も知るまい
  rationale: οὐおよびεἰ μὴと結びついた限定表現を、「ほかは、何も知るまい」として日本語で明瞭に表した。「知る」は単なる知識ではなく、宣教上の関心と強調を含みうる原文の幅を保つ。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: パウロがコリントの信徒たちのもとにいて活動した状況を、原文に近く自然に示す。
- source_word: εἰ μὴ
  choice: ほかは
  rationale: 標準的な除外構文として、後続の「何も」と組み合わせて「〜のほかは何も」と訳した。
- source_word: Ἰησοῦν Χριστόν
  choice: イエス・キリスト
  rationale: 日本語では「イエス・キリスト」が定着した自然で格調ある表現であり、Χριστόςの称号性も保持する。「イエスはメシアである」という説明的な訳にして統語関係を変えることは避けた。
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: しかも十字架につけられたこの方
  rationale: καίを強調的な「しかも」とし、τοῦτονの指示と強調を「この方」で明示した。完了受動分詞は、十字架につけられた出来事と、その方をその姿において中心とする含意を簡潔に伝える。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: イエス・キリスト
  alternative: メシアであるイエス／イエス・メシア
  rationale: Χριστόςは「油注がれた者／メシア」という称号だが、日本語の「キリスト」もその称号として広く定着している。この箇所では人名に近い結合と称号性の双方があり、本文では自然な「イエス・キリスト」を採用し、語義を脚注で示した。
- issue: τοῦτον ἐσταυρωμένονの強調
  choice: しかも十字架につけられたこの方
  alternative: それも十字架につけられた方
  rationale: パウロの焦点が一般的なイエス理解ではなく、十字架につけられたイエスにあることを示しつつ、「この方」という原文の指示語を保持した。十字架の神学的意味を本文へ追加説明することは避けた。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った文体。「知るまい」はやや引き締まった意志表現だが、パウロの確定した決意に適する。脚注記号[a]は本文末に配置した。
