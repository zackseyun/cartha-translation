source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: ja
  text: また、私の語りも、私の宣べ伝えも、知恵を用いた説得的な言葉[a]によるものではなく、聖霊[b]と力による実証によるものでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「知恵による説得」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「霊」。
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: 語ること
  rationale: ここでは単なる一語や内容としての「言葉」よりも、パウロの語りを指す。「語ること」は自然な日本語で、続く κήρυγμα とも区別できる。
- source_word: κήρυγμα
  choice: 宣教
  rationale: 公に告げ知らせる行為またはその宣べ伝えを表し、λόγος の「語ること」と区別しつつ簡潔に訳した。
- source_word: πειθοῖ σοφίας
  choice: 知恵による説得
  rationale: 本文に明示されない「言葉」を補わず、属格 σοφίας と πειθοῖ の関係を自然に示す。写本上・語形上の難しさもあるため、別訳を脚注に残した。
- source_word: ἀποδείξει
  choice: 実証
  rationale: 単なる主張ではなく、明らかに示すことを表し、修辞的な説得との対照を保つ。
- source_word: πνεύματος
  choice: 御霊
  rationale: 文脈上は神の霊を指す可能性が高く、日本語聖書として尊厳のある「御霊」を採用した。ただし「霊」という理解も脚注に示した。
- source_word: δυνάμεως
  choice: 力
  rationale: δύναμις の基本的で明瞭な訳であり、「御霊」と並ぶ神的な働きの表現として自然である。
theological_decisions:
- issue: πνεύματος が神の御霊を指すか、より一般的な霊を指すか
  choice: 御霊
  alternative: 霊
  rationale: 直後を含む第一コリント2章の流れでは神の御霊が中心となるため「御霊」が最も自然である。一方、語形そのものには定冠詞がなく、別の理解を完全には排除せず脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの「語ること」と「宣教」の並行、また「説得」と「実証」の対照を保持した。「〜によった」を反復してギリシア語の ἐν ... ἀλλ’ ἐν ... の構造を自然な日本語で表した。
