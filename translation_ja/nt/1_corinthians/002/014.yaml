id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: ja
  text: しかし、生まれながらの人は、神の霊に属する事柄を受け入れません[a]。それらはその人には愚かなものだからです。また、それらを知ることもできません。それらは霊的に見分けられるものだからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生まれながらの人」は、「霊的でない人」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「見分けられる」は、「吟味される」または「判断される」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: 生まれながらの
  rationale: ψυχικός は文脈上 πνευματικός と対照され、神の霊による理解に対して、人間の生来のあり方にとどまる状態を表す。「生まれながらの」は「肉の」など別のパウロ用語との混同を避けつつ、その対照を自然な日本語で示す。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ここでは特定の男性ではなく代表的・一般的な人を指すため、現代日本語の「人」が適切である。
- source_word: δέχεται
  choice: 受け入れません
  rationale: 単に情報を受け取るだけでなく、それを真実または価値あるものとして認める含意を伝える。
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: 神の霊に属する事柄
  rationale: 属格表現の幅を保ち、神の霊から来るもの、また神の霊に関わるものを過度に限定しない。
- source_word: μωρία
  choice: 愚かなこと
  rationale: コリント書に繰り返される神の知恵と人間の判断との対照を、平明で品位ある日本語で保つ。
- source_word: γνῶναι
  choice: 知ること
  rationale: 原語 γινώσκω の基本的な語義を直接反映し、理解・認識のいずれか一方に狭めない。
- source_word: πνευματικῶς
  choice: 霊によって
  rationale: 副詞の手段・様態を自然な日本語で表す。ここでの「霊」は直前の「神の霊」を受けるが、ギリシア語が明示的に ἐν πνεύματι としていない点を踏まえ、神学的説明を付加しない。
- source_word: ἀνακρίνεται
  choice: 見分けられる
  rationale: 調べる、吟味する、判断するという語義範囲のうち、文脈上の正しい認識・評価を自然に表しつつ、他の可能性は脚注に残す。
theological_decisions:
- issue: ψυχικὸς ἄνθρωπος と霊的な識別との対照
  choice: 生まれながらの人
  alternative: 霊を持たない人／霊的でない人
  rationale: ギリシア語が示す「霊的」との対照を保ちながら、「聖霊を持たない」と明示して原文以上に神学的結論を先取りすることを避ける。
- issue: πνευματικῶς の担い手または様態
  choice: 霊によって
  alternative: 霊的に
  rationale: 日本語では「霊的に見分ける」が抽象的で不自然になりやすいため、「霊によって」とした。ただし直前の「神の霊」との連関を保ち、特定の教派的な聖霊論を付加しない。
- issue: ἀνακρίνεται の意味
  choice: 見分けられる
  alternative: 吟味される／判断される
  rationale: 受動形と語義の幅を保ちながら、ここで問題となる認識と評価の双方を含み得る表現を採った。代替訳を脚注に示して曖昧さを保存する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの論証にふさわしい品位を保った。「神の霊」「霊」を統一的に用い、「御霊」のような教会内に限定されやすい語は避けた。因果関係を読み取りやすくするため文を区切ったが、γάρ と ὅτι の論理関係は明示した。
