  naturalness: 現行文も理解可能だが、「その人には愚かなことだからです」はやや不自然で、何が愚かと見なされるのかが弱い。「その人には愚かなものだからです」とし、末文も「霊的に見分けられるものだからです」とすると、明瞭な現代標準日本語として自然である。
