  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: ja
  text: それは、あなたがたの信仰が人間の知恵ではなく、神の力に基づくためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: それは～ためでした
  rationale: 目的を表すἵνα節として、直前の文脈とのつながりと目的の意味を自然な現代日本語で示す。
- source_word: ἡ πίστις ὑμῶν
  choice: あなたがたの信仰
  rationale: πίστιςはここではコリントの信徒たちの信仰を指す。属格ὑμῶνも明示する。
- source_word: μὴ ᾖ ἐν
  choice: ～によるのではなく／～によるものとなる
  rationale: ἐνはここで信仰のよりどころ・基盤を表す。日本語では「～の中にある」より「～による」のほうが意味を明瞭かつ自然に伝える。
- source_word: σοφίᾳ ἀνθρώπων
  choice: 人間の知恵
  rationale: ἀνθρώπωνは男女を含む人間一般を指すため、「人間」と訳す。属格を自然な連体修飾として表す。
- source_word: δυνάμει θεοῦ
  choice: 神の力
  rationale: 前半との対照を保ち、信仰の基盤が神の力であることを簡潔に表す。
theological_decisions:
- issue: 信仰と知恵・力との関係を表すἐνの解釈
  choice: 「～による」とし、信仰の基盤・よりどころを示す
  alternative: 「～の中にある」「～に基づく」「～にかかっている」
  rationale: 原文のἐνが持つ比喩的な領域・基盤の含みを保ちつつ、特定の組織神学的説明を加えず、自然な日本語にした。
- issue: ἀνθρώπωνの性別表現
  choice: 「人間」
  alternative: 「人々」「人間たち」「男たち」
  rationale: この複数属格は人類一般を指し、男性だけを意味しない。日本語の「人間」が原意を正確かつ簡潔に伝える。
- issue: ἵνα節の目的性
  choice: 「～ためでした」
  alternative: 「～ように」「その結果～」
  rationale: 結果だけでなく、パウロの宣教の仕方に込められた目的を示す文脈なので、目的の力を明示した。
translation_notes:
  register: 明瞭で現代的かつ端正な標準語。「人間の知恵」と「神の力」の対照を平行に保った。節単独でも読めるよう「それは」を補ったが、内容上の説明は加えていない。
