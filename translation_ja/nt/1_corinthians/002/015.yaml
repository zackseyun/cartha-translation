id: 1CO.2.15
reference: 1 Corinthians 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: ja
  text: しかし、御霊に属する人[b]は、すべてを見極める[a]。その人自身は、だれにも見極められない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見極める」と訳した語は、二か所とも「吟味する」「判別する」「判断する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「御霊に属する人」に当たる原語は、男性単数形の形容詞が名詞として用いられたもので、御霊によって特徴づけられる人を一般的に指す。
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: 御霊に属する人
  rationale: 男性単数形の形容詞が名詞的に用いられているが、ここでは男性だけでなく、御霊によって特徴づけられる人を一般的に指す。直前の文脈にある神の御霊との対比を自然な日本語で示した。
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: 見極める／見極められない
  rationale: 吟味して判断するという語義を表しつつ、最終的な断罪を意味するとの限定を避けた。同じ動詞の能動態と受動態なので、日本語でも同じ語を反復した。
- source_word: τὰ πάντα
  choice: すべて
  rationale: ギリシア語の包括的で無限定な表現を保ち、本文中で『霊的な事柄』などに狭めなかった。
- source_word: αὐτὸς
  choice: その人自身
  rationale: 代名詞の強調を『自身』で明示し、性別を限定しない自然な日本語とした。
- source_word: ὑπ’ οὐδενὸς
  choice: だれにも…ない
  rationale: ギリシア語の絶対的な否定を、自然な日本語の否定構文で保った。
theological_decisions:
- issue: 御霊に属する人についての主張の範囲
  choice: 『すべて』と『だれにも…ない』という無限定な表現を保つ。
  alternative: 本文で『霊的な事柄をすべて』などと範囲を明示的に限定する。
  rationale: 節そのものは限定を付しておらず、解釈の枠組みは前後の文脈から与えられる。本文に限定を加えると、原文に残る神学的緊張を訳者が解消することになる。
- issue: πνευματικὸς の指示対象
  choice: 『御霊に属する人』とし、一般的な人を指す表現にする。
  alternative: 『霊的な男』または抽象的な『霊的な者』とする。
  rationale: 文脈上、神の御霊によって特徴づけられる人を指す。ギリシア語の文法上の男性形を、生物学的な男性への限定として訳出しない。
translation_notes:
  register: 明快で現代的な標準語を用いながら、対句と同一動詞の反復を保った。長い一文にせず二文に分け、主張の対照を読み取りやすくした。
