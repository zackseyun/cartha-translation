id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: ja
  text: しかし、私たちが受けたのは、この世の霊ではなく、神から来る霊です。それは、神が私たちに恵みとして与えてくださったもの[a]を、私たちが知る[b]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神が私たちに無償で与えてくださったもの」または「神が私たちに賜物として与えてくださったもの」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私たちが理解するため」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: 霊
  rationale: 二つの用例をともに「霊」とし、「この世の霊」と「神から来る霊」という原文の対照を保った。後者は文脈上、聖霊を指すと考えられるが、原文に「聖なる」に当たる語がないため、本文では「聖霊」と明示しなかった。
- source_word: κόσμου
  choice: この世
  rationale: ここでは被造世界そのものより、神に対立する現今の人間的秩序を指すため、自然な日本語の「この世」とした。
- source_word: ἐλάβομεν
  choice: 受けた
  rationale: 過去の受領を簡潔に表しつつ、その結果が現在も続くことは文脈から明らかである。
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: 神から来る
  rationale: ἐκが示す起源を自然に表し、霊が神を源とすることを明確にした。
- source_word: ἵνα εἰδῶμεν
  choice: 私たちが知るため
  rationale: 目的節を明示し、οἶδαの基本的な認識の意味を保った。「理解する」も文脈上可能であるため脚注に示した。
- source_word: χαρισθέντα
  choice: 恵みとして与えてくださった
  rationale: χαρίζομαιに含まれる、無償の恵みとして与えるという含意を表した。日本語として自然になるよう能動表現にし、与え手である神を明示した。
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: 神が私たちに恵みとして与えてくださったもの
  rationale: 中性複数の広い範囲を「もの」で保ち、特定の霊的賜物だけに限定しなかった。
theological_decisions:
- issue: πνεῦμα τὸ ἐκ τοῦ θεοῦが聖霊を特定しているか
  choice: 「神から来る霊」と訳す
  alternative: 「神から来る御霊」または「神からの聖霊」
  rationale: 文脈上は聖霊を指す可能性が高いが、ギリシア語本文は「聖なる」と明記していない。日本語には英語の大文字・小文字による区別もないため、起源を示す原文の表現を保ち、解釈を過度に確定しない訳とした。
translation_notes:
  register: 明快な現代標準日本語を用いた。「御霊」のような教会内で主に用いられる語を避けながら、文全体は聖書本文にふさわしい端正さを保った。原文の対照を見えやすくするため、「受けたのは、Aではなく、Bです」の構文を採用した。
source_grounding:
  english_pob_role: consult_only
