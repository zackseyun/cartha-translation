id: 1CO.2.13
reference: 1 Corinthians 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: ja
  text: これらのことを、私たちも語ります。人間の知恵に教えられたことばによってではなく、聖霊に教えられたことばによって、霊的なことを霊的なことばで説明するのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「霊的な人々に霊的なことを説明するのです」。原文の最初の「霊的な」（πνευματικοῖς）は、前の「ことば」を補って「霊的なことばで」と読むことも、「霊的な人々に」と読むこともできます。また、「説明する」と訳した語は、「結び合わせる」「比べ合わせる」とも訳せます。
    reason: 原文末尾のπνευματικοῖς πνευματικὰ συγκρίνοντεςには、文法上および語義上の複数の解釈があるため。
lexical_decisions:
- source_word: ἃ
  choice: このこと
  rationale: 直前までに述べられた、神から与えられた事柄を受ける自然な日本語とした。
- source_word: λαλοῦμεν
  choice: 私たちも語ります
  rationale: 口頭で告げる働きを保ちつつ、現代日本語として品位のある「語る」を用いた。καίは「も」で表した。
- source_word: ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: 人間の知恵に教えられたことばによって
  rationale: ἐνの手段的な働きを「によって」で示し、教えの源が人間の知恵であるという属格関係を保った。
- source_word: ἐν διδακτοῖς πνεύματος
  choice: 御霊に教えられたことばによって
  rationale: 前句のλόγοιςを補って対比を明瞭にし、文脈上のπνεῦμαを聖霊と理解して「御霊」とした。
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: 霊的なことを霊的なことばで説明する
  rationale: 直前の「ことば」との対比を踏まえ、πνευματικοῖςを省略された「ことば」にかかる中性複数と理解した。συγκρίνωの文脈的意味を「説明する」で表したが、男性複数として「霊的な人々に」と取る可能性は注で保持した。
theological_decisions:
- issue: πνεύματοςの指示対象
  choice: 聖霊（御霊）
  alternative: 一般的な霊、または霊的な源
  rationale: 第一コリント2章の直前の文脈では神の御霊が繰り返し人格的な働き手として語られ、人間の知恵と対照されているため。
- issue: πνευματικοῖςの性と指示対象
  choice: 中性複数として、補われる「霊的なことば」を指す
  alternative: 男性複数として「霊的な人々」を指す
  rationale: 直前から続く「教えられたことば」の対比に沿う読みを本文に採用した。ただし形態上は男性・中性の双方が可能で、神学的・解釈的な緊張を解消しないよう代案を注記した。
translation_notes:
  register: 明瞭な現代標準語を用い、「御霊」「語る」によって聖書本文としての品位を保った。「ことば」を反復して、人間の知恵に由来する表現と御霊に由来する表現との対照を明確にした。
