id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: ja
  text: 「だれが主の思いを知り、主を教えるでしょうか。」[a] しかし、私たちはメシアの思いを持っています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イザヤ40:13を踏まえた表現。
    reason: cross_reference
  - marker: b
    text: 「キリストの思い」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἔγνω
  choice: いったい、だれが……知り
  rationale: γάρの説明的なつながりと修辞疑問の力を、自然な現代日本語の「いったい」で表した。ἔγνωは文脈上、主の思いを知り尽くした者はいないという趣旨である。
- source_word: νοῦν κυρίου
  choice: 主の思い
  rationale: νοῦςの知性・考え・意向を含む幅を「思い」で保ち、イザヤ40:13との響きも維持した。
- source_word: ὃς συμβιβάσει αὐτόν
  choice: 主を教えることができるでしょうか
  rationale: 関係節が示す資格・可能性を日本語の修辞疑問として明瞭にした。αὐτόνの指示対象を曖昧な「その方」ではなく「主」と再示した。
- source_word: ἡμεῖς δὲ
  choice: しかし、私たちは
  rationale: 前半の人間の無資格と、信仰共同体についての宣言との強い対照を示した。
- source_word: νοῦν Χριστοῦ
  choice: メシアの思い
  rationale: 属格を自然に保ち、Χριστόςを称号として「メシア」と訳した。
- source_word: ἔχομεν
  choice: 持っています
  rationale: 現在形の直接的な宣言を、明快で自然な敬体の日本語で表した。
theological_decisions:
- issue: νοῦν ΧριστοῦにおけるΧριστοῦの訳
  choice: メシアの思い
  alternative: キリストの思い
  rationale: ここではΧριστόςの称号性を示すため「メシア」としたが、日本語で定着した「キリスト」も同じギリシア語を表す正当な訳語である。
- issue: 「私たち」の範囲
  choice: 本文では限定しない
  alternative: 使徒たち、または御霊を受けた信仰共同体に明示的に限定する
  rationale: ἡμεῖςが指す範囲には文脈上の議論があり、原文自体がこの一文で明示していないため、訳文で解釈を固定しない。
- issue: 「主」と「メシア」の関係
  choice: 前半のκύριοςを「主」、後半のΧριστόςを「メシア」と区別して訳す
  alternative: 両者が同一者を指すことを訳文で明示する
  rationale: パウロの引用と適用が生む神学的なつながりを保ちつつ、原文以上に指示関係を説明しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。引用部分は修辞疑問として自然に整え、神学的な指示関係や「私たち」の範囲は原文以上に限定しなかった。すべての脚注記号を本文中に配置した。
