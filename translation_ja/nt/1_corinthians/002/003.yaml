lexical_decisions:
- source_word: κἀγώ
  choice: 私も
  rationale: καίの文脈上のつながりと、パウロ自身への明示的な言及を簡潔に表す。
- source_word: ἐν ἀσθενείᾳ
  choice: 弱さのうちに
  rationale: ἀσθένειαの幅を狭めず、身体的・心理的な弱さのいずれにも限定しない。
- source_word: ἐν φόβῳ
  choice: 恐れながら
  rationale: φόβοςを単なる慎重さや畏敬に弱めず、自然な現代日本語で状態を表す。
- source_word: ἐν τρόμῳ πολλῷ
  choice: ひどく震えつつ
  rationale: τρόμοςの実質的な震えと、πολλῷによる強意を明瞭に伝える。
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: あなたがたのもとにいました
  rationale: コリントの人々の間にいた時のパウロの状態を表す読みを本文に採り、到来を示す可能性は脚注に残す。
theological_decisions:
- issue: 「恐れ」の対象と性質
  choice: 対象を補わず「恐れ」とする
  alternative: 神への畏れ／宣教上の不安
  rationale: 本文は恐れの対象を明示していないため、その神学的・心理的性質を訳文で限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、反復されるἐν句の重みを「弱さのうちに、恐れながら、ひどく震えつつ」で保った。文体は簡潔で dignified な聖書本文調とした。
