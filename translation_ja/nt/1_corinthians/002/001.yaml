id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: ja
  text: 兄弟たち[a]、私もあなたがたのところへ行ったとき、優れた話し方や知恵をもって、神の証し[b]をあなたがたに告げ知らせながら行ったのではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、会衆の女性を含む信者仲間全体を指すことがあります。
    reason: cultural_note
  - marker: b
    text: 写本によっては「神の奥義」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: 私も
  rationale: καίの接続・対応の力と、明示された一人称主語の軽い強調を自然な日本語で表す。
- source_word: ἐλθὼν πρὸς ὑμᾶς … ἦλθον
  choice: あなたがたのところに行ったとき…たのではありません
  rationale: 分詞を時の従属節として訳し、同語反復は日本語として自然になるよう主動詞側で宣教行為を中心に表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを本文で保持する。会衆の女性を含み得る用法は脚注で示す。
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: 優れた話術や知恵をもって
  rationale: ὑπεροχήが示す卓越性・人目を引く優秀さを保ち、λόγοςは文脈上、言葉そのものより雄弁な語り口を指すため「話術」とした。
- source_word: καταγγέλλων
  choice: 宣べ伝えた
  rationale: 公に告知する意味を自然で格調ある現代日本語で表す。主節との関係は、日本語では宣教行為を述語の中心に据えて明確にした。
- source_word: μαρτύριον
  choice: 証し
  rationale: SBLGNT本文のμαρτύριονに従い、証言・証しの意味を簡潔に保つ。異読は脚注に記す。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格をそのまま保ち、「神からの」「神についての」など一義的な解釈に限定しない。
theological_decisions:
- issue: μαρτύριονの本文異読
  choice: 神の証し
  alternative: 神の奥義
  rationale: 指定されたSBLGNT本文のμαρτύριονを採用する。μυστήριονという異読は意味に影響するため脚注に残す。
- issue: τοῦ θεοῦの属格の解釈
  choice: 神の
  alternative: 神からの／神についての
  rationale: 証しの源・内容・帰属のいずれかに限定せず、ギリシア語の神学的な含みを保持する。
translation_notes:
  register: 明快な現代標準語を用いながら、使徒的な呼びかけと宣教語彙の品位を保った。「優れた話術」は過度に古風な「言辞の卓越」を避けつつ、修辞的な印象の強さを表す。脚注記号[a][b]は対応箇所に配置した。
