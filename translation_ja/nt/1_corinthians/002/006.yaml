id: 1CO.2.6
reference: 1 Corinthians 2:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: ja
  text: しかし、成熟した人たちの間で、私たちは知恵を語ります。[a] それは、この時代の知恵でも、この時代の支配者たち[c]の知恵でもありません。その支配者たちは無力にされつつあります。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「完全な人たち」。ここでは、霊的に成熟した人たちを指すと思われる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「消え去りつつある」「廃されつつある」「効力を失いつつある」。
    reason: lexical_alternative
  - marker: c
    text: 「この時代の支配者たち」は、人間の権力者、霊的な諸力、またはその双方を指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: 知恵
  rationale: σοφίαの標準的で自然な訳。原文の反復を保つため、二度とも「知恵」とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の文脈との対照を、現代日本語で明確かつ自然に示す。
- source_word: λαλοῦμεν
  choice: 私たちは…語ります
  rationale: λαλέωの基本義である「語る」を採用し、「宣べ伝える」のような限定的な含意を加えない。
- source_word: ἐν τοῖς τελείοις
  choice: 成熟した人たちの間では
  rationale: ἐνを「間で」、τέλειοιを文脈上の成熟した人々として訳した。ただし「完全な人たち」という語義も注で残す。
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: この時代の知恵でも…ありません
  rationale: αἰώνをκόσμοςと混同せず「時代」とし、時間的かつ現世的な含みを保った。日本語の明瞭さのため「知恵」を補って反復した。
- source_word: ἀρχόντων
  choice: 支配者たち
  rationale: 人間の権力者、霊的諸力、またはその双方という可能性を狭めない、広い訳語を採用した。
- source_word: τῶν καταργουμένων
  choice: 無力にされつつある
  rationale: καταργέωの「効力・力を失わせる」という意味と、現在分詞の進行的な響きを表した。廃される、消え去る等の可能性は注に示す。
theological_decisions:
- issue: 「この時代の支配者たち」が指すもの
  choice: 「支配者たち」とだけ訳し、対象を特定しない
  alternative: 人間の政治的・宗教的支配者、霊的諸力、またはその双方
  rationale: ギリシア語自体は一つの解釈に限定していないため、本文では神学的な曖昧さを保持する。
- issue: τέλειοιの理解
  choice: 本文では「成熟した人たち」
  alternative: 「完全な人たち」
  rationale: この文脈では霊的成熟を指す可能性が高いが、語そのものが持つ「完全な」という意味を脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「です・ます」調を用い、対照構造を二文に分けて読みやすくした。原文の反復と、支配者の正体をめぐる曖昧さを保持した。
