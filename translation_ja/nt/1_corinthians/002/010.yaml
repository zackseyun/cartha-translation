id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: ja
  text: 神は、聖霊を通して、これらのことを私たちに明らかにされた[a]。聖霊はすべてのことを、神の深みさえも探るからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「これらのことを」に当たる目的語は明記されておらず、直前の文脈から補われる。
    reason: alternative_reading
  - marker: b
    text: 「神の奥深い事柄さえも」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: 明らかにしてくださった
  rationale: アオリストの完了した啓示行為を自然な日本語の過去形で表した。「してくださった」は、神から受け手への啓示であることを自然に示す。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 与格を啓示の受け手を示す間接目的語として訳した。
- source_word: '[ἀπεκάλυψεν の暗黙の目的語]'
  choice: これらのことを
  rationale: ギリシア語では目的語が省略されているが、直前の文脈を受けることが分かるよう最小限に補った。
- source_word: διὰ τοῦ πνεύματος
  choice: 御霊を通して
  rationale: 属格を伴う διά が示す手段・媒介を保った。
- source_word: πνεῦμα
  choice: 御霊
  rationale: 文脈上、神の啓示を伝え、神の深みを探る聖霊を指すため、日本語でその指示対象を自然に示す「御霊」とした。
- source_word: ἐραυνᾷ
  choice: 探る
  rationale: 調べ、探究するという能動的な意味を保ち、神についての御霊の知識を説明しすぎない表現とした。
- source_word: πάντα
  choice: すべてを
  rationale: 対象の包括的な広がりを簡潔に表した。
- source_word: καὶ
  choice: さえも
  rationale: 後続する「神の深み」を際立たせる強意的な用法として訳した。
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: 神の深み
  rationale: 「深さ」という比喩を解釈で置き換えず、原文の複数形を日本語で自然な集合的単数として表した。
theological_decisions:
- issue: πνεῦμα が聖霊を指すか、人間の霊を指すか
  choice: 二箇所とも聖霊を指す「御霊」
  alternative: 一般的な意味での人間の霊
  rationale: この御霊は神の啓示の媒介であり、神の深みにまで及ぶ探究を行うとされるため、文脈は聖霊を強く示している。
- issue: 御霊が「神の深みを探る」という表現を、御霊の無知を示さないよう言い換えるか
  choice: 比喩的緊張を保って「探る」とする
  alternative: 「知り尽くしている」などと説明的に訳す
  rationale: ἐραυνᾷ の能動的な探究の表現を保持し、神学的推論によって原文を言い換えないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、論証的で荘重な調子を保つため、文末は「である」調とした。「御霊」は聖霊を示す現代の聖書語として用い、「神の深み」という原文の比喩は保持した。
