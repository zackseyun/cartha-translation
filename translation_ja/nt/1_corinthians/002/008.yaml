  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: ja
  text: この時代の支配者[a]のだれ一人として、この知恵を知りませんでした。もし知っていたなら、栄光の主を十字架につけはしなかったでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この時代の支配者たち」は、人間の権力者、霊的な支配勢力、またはその両方を指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: この知恵を
  rationale: 女性単数の関係代名詞で、直前に述べられた神の知恵を受ける。日本語では指示内容を補って文を分けると自然で明確になる。
- source_word: ἀρχόντων
  choice: 支配者たち
  rationale: 統治権・支配力を持つ者を表し、人間の権力者とも霊的な諸勢力とも取り得る語の幅を保つ。
- source_word: τοῦ αἰῶνος τούτου
  choice: この時代の
  rationale: αἰώνの時間的・秩序的な意味を「時代」で表し、「世界」と限定しない。
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: 知りませんでした／知っていた
  rationale: γινώσκωを直接的に「知る」と訳し、二つの動詞の語彙的一貫性を保つ。後半は反実仮想として自然な日本語にした。
- source_word: κύριον τῆς δόξης
  choice: 栄光の主
  rationale: 属格構文を簡潔に保ち、称号としての荘重さと神学的な力を維持する。
- source_word: ἐσταύρωσαν
  choice: 十字架につけ
  rationale: ローマ時代の具体的な処刑方法を示す定着した訳語である。
theological_decisions:
- issue: 「この時代の支配者たち」の指示対象
  choice: 指示対象を限定せず「この時代の支配者たち」と訳す
  alternative: 人間の政治的・宗教的権力者、霊的な支配勢力、またはその両方
  rationale: ギリシア語は複数の解釈を許すため、本文ではその曖昧さを保持し、注で可能性を示す。
- issue: 「知る」の意味の強さ
  choice: 「知る」と訳す
  alternative: 「理解する」「見抜く」
  rationale: 文脈上は神の知恵の真意を認識する含みがあり得るが、γινώσκωの直接的な語義を保ち、その含意を訳語で過度に確定しない。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いた。「栄光の主」は原文の格調を保つ定着表現とし、全体は簡潔で荘重な調子に整えた。
