source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: ja
  text: 'しかし、次のように書かれているとおりです。


    「目が見たことのないもの、


    耳が聞いたことのないもの、


    人の心に思い浮かんだことのないもの[a]、


    それこそ、神がご自分を愛する人々のために備えたものです。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「人の心に上ったことのないもの」。すなわち、人が思い浮かべたことも、考えついたこともないもの。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の議論との対照を示す接続詞として、簡潔で自然な現代日本語にした。
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおりです
  rationale: 聖書引用の定型句と、書かれた内容が今も有効であるという完了形の含みを自然に表した。
- source_word: Ἃ ... ὅσα
  choice: もの……それこそ……ものです
  rationale: 前半で列挙された内容を後半のὅσαが受け直す構造を明示し、ギリシャ語の反復的・詩的な構文を読みやすく再現した。
- source_word: ὀφθαλμὸς / οὖς
  choice: 目／耳
  rationale: 単数形による一般的表現を、日本語で自然な身体部位名として保持した。
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: 人の心に思い浮かんだことのないもの
  rationale: 直訳的には「人の心に上らなかった」。日本語の「心に思い浮かぶ」はその比喩を生かしつつ、考えも想像もしなかったという意味を自然に伝える。「人」はἀνθρώπουの一般的人類を指す用法を過不足なく表す。
- source_word: ἡτοίμασεν
  choice: 備えてくださった
  rationale: 完了した行為を表す過去形とし、神を主語とする日本語として自然な敬意を添えた。原語にない追加の教理的意味は持ち込まない。
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: ご自分を愛する人々のために
  rationale: 現在分詞の継続的な性格を自然な連体表現で示し、αὐτόνの指示対象が神であることを日本語で明確にした。
theological_decisions:
- issue: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβηにおける「心」の意味
  choice: 人の心に思い浮かんだことのないもの
  alternative: 人の心に上ったことのないもの／だれも考えたことのないもの
  rationale: 「心」を「知性」だけに限定せず、聖書的な内面全体を指す語として残した。一方、「上る」の逐語訳は現代日本語では意味が伝わりにくいため、「思い浮かぶ」で比喩の趣旨を表した。
- issue: ἀνθρώπουの一般的用法
  choice: 人の心
  alternative: 人間の心／ある人の心
  rationale: 特定の男性ではなく人間一般を指す。日本語の「人」は性別を不必要に限定せず、原文の総称的意味を正確に伝える。
- issue: 神が備えたものの具体的内容
  choice: 原文どおり具体化しない
  alternative: 天国の祝福／救いの恵みなどと明示する
  rationale: この節自体は内容を具体的に限定していないため、特定の終末論的・教派的解釈を訳文に加えず、文脈に残された含みを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分は改行によって詩的な三重並行を示した。荘重さを保ちながら、古風で不自然な逐語表現は避けた。
