reference: 1 Corinthians 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: ja
  text: 人のことを知っているのは、その人の内にある霊のほかに、いったい誰でしょうか。同じように、神のことを知っている者は、神の霊のほかには誰もいません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人のこと」「神のこと」は、それぞれ「人に属する事柄」「神に属する事柄」とも訳せる。文脈上、特に内面的な事柄を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: 人／その人
  rationale: ここでは男性に限定されない一般的な人間を指す。日本語では「人」とし、個々の人を指す箇所では文脈上自然な「その人」を用いた。
- source_word: τὰ τοῦ ἀνθρώπου
  choice: その人の内にあること
  rationale: 直訳的な「その人のこと」では外面的な事柄にも聞こえうるため、文脈上の内面的な事柄を示しつつ、「考え」だけに狭めない表現とした。
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: 人の内にあるその人の霊
  rationale: 所有関係と τὸ ἐν αὐτῷ の位置的意味を明示し、神の霊との対比を保った。
- source_word: οὕτως καὶ
  choice: 同じように
  rationale: 人間についての前半と神についての後半との類比を、自然で明確な現代日本語で示す。
- source_word: ἔγνωκεν
  choice: 知りません
  rationale: 完了形はここで現在に至る確立した認識の欠如を表すため、日本語では自然な現在表現とした。時制形式を機械的に「知ったことがない」とすると、一般原理としての文意が弱まる。
- source_word: τὰ τοῦ θεοῦ
  choice: 神の内にあること
  rationale: 「神の考え」に限定せず、前半との並行を保ちながら神に属する内奥の事柄という広い意味を表した。
- source_word: πνεῦμα τοῦ θεοῦ
  choice: 神の霊
  rationale: 直前の文脈で神の深みを探り、啓示する方を指す。「神の霊」は日本語聖書として自然で、人格性を否定せず、原文以上の説明も加えない。
theological_decisions:
- issue: πνεῦμα τοῦ θεοῦ を人格的な神の御霊として訳すか、非人格的な力や性質として訳すか
  choice: 神の霊
  alternative: 神からの霊／神の精神
  rationale: 直近の文脈では、神の深みを探り、知る主体として語られている。「神の霊」はその指示対象を自然に保ち、三位一体について本文にない説明を付加しない。
- issue: τὰ τοῦ ἀνθρώπου と τὰ τοῦ θεοῦ の範囲
  choice: その人の内にあること／神の内にあること
  alternative: その人の考え／神の考え
  rationale: 属格を伴う中性複数表現は「考え」だけに限定されない。両句の広さと並行関係を保つため、内面的な事柄を広く指す訳とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の力を「いったい誰が」で表した。前後半の語句と構造の対応を保ちつつ、不自然な逐語訳を避けた。「霊」は人間の霊と神の霊の双方に用いて原文の対照を維持した。
