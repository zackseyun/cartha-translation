  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: ja
  text: あなたがたはキリストの体であり、一人一人がその体の部分です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア」とも訳せる。後半のἐκ μέρουςは字義的には「部分から」に近い表現で、ここでは、あなたがた一人一人がその体の部分であるという意味。
    reason: 称号Χριστόςの別訳と、文脈上分配的に用いられるἐκ μέρουςの意味を明瞭かつ正確に示すため。
lexical_decisions:
- source_word: Ὑμεῖς
  choice: あなたがた
  rationale: 明示された二人称複数代名詞。共同体全体への呼びかけを、現代日本語で自然に表す。
- source_word: δέ
  choice: 訳文では独立した接続語を置かない
  rationale: ここでは強い逆接ではなく、直前の体の比喩を読者に適用する談話上の移行を示す。日本語では文脈によって十分伝わるため、「しかし」などを補わない。
- source_word: σῶμα Χριστοῦ
  choice: キリストの体
  rationale: 属格を自然に表し、共同体をキリストの体とする比喩を保持する。日本語では「キリスト」が定着した称号表現である。
- source_word: μέλη
  choice: 部分
  rationale: 身体を構成する各部を指す。日本語の「肢体」は教会用語としては通じるが一般読者には古風なため、明瞭な「部分」を選ぶ。
- source_word: ἐκ μέρους
  choice: 一人一人は
  rationale: 文脈上の分配的な意味を自然な日本語で示す。各人が全体の中の一部分であるという趣旨を表し、「部分的に」という誤解を避ける。
theological_decisions:
- issue: Χριστοῦを称号としてどう訳すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςの称号性を認めつつ、日本語聖書と一般的な現代日本語で最も自然かつ明瞭な「キリスト」を本文に採用する。別訳「メシア」は注で示す。
- issue: ἐκ μέρουςの意味
  choice: 各人が全体の中の部分であるという分配的意味
  alternative: 部分的に／それぞれの立場で
  rationale: 直前までの一つの体と多くの部分という文脈に即し、共同体としての一体性と個々人の参与をともに保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「肢体」は避け、身体比喩と共同体的意味の双方が伝わる「部分」を用いた。
