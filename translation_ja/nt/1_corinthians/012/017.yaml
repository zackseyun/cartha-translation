  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: ja
  text: もし体全体が目だったら、聞く働きはどこにあるのでしょうか。もし全体が聞く働きだけだったら、嗅ぐ働きはどこにあるのでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: 体全体
  rationale: 全体性を明確にしつつ、パウロの身体の比喩を自然な現代日本語で保つ。
- source_word: ὀφθαλμός
  choice: 目
  rationale: 単数の身体部分としての比喩を、日本語で自然に表す。
- source_word: ποῦ
  choice: どこで…のでしょう
  rationale: 仮定に続く反語的な問いとして自然であり、「どこにあるのか」ではなく感覚機能がどこで営まれるかを表す。
- source_word: ἀκοή
  choice: 聞くこと／聞く
  rationale: 耳という器官ではなく聴覚・聴取の機能を指す原語を保ち、文脈に合わせて動詞的に自然化した。
- source_word: ὅλον
  choice: 全体
  rationale: 第二の条件節における「体」の省略を保持する。
- source_word: ὄσφρησις
  choice: 匂いを嗅ぐ
  rationale: 鼻という器官ではなく嗅覚の働きを指す原語を、明瞭な現代日本語で表す。
theological_decisions:
- issue: 身体器官そのものか、感覚機能か
  choice: ἀκοήとὄσφρησιςを、それぞれ「聞くこと」「匂いを嗅ぐ」と感覚機能として訳す。
  alternative: 「耳はどこにあるのでしょう」「鼻はどこにあるのでしょう」と器官名で訳す。
  rationale: ギリシア語は耳や鼻を表す解剖学的名称ではなく、聞く働きと嗅ぐ働きを表すため、機能的表現を保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語。反語の調子を「のでしょう」で穏やかに示し、原文の二つの仮定文の並行性と、第二節の「体」の省略を保持した。
