  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: ja
  text: 別の人には、同じ聖霊によって信仰が与えられ[a]、また別の人には、唯一の聖霊によって癒やしの賜物が与えられます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は、「信頼」または「忠実」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「賜物」と「癒やし」はどちらも複数形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ / ἄλλῳ
  choice: 別の人には／また別の人には
  rationale: いずれも前節から続く賜物の配分を表す与格である。両語の違いを不自然に強調せず、現代日本語で分配の流れが明瞭になるようにした。
- source_word: πίστις
  choice: 信仰
  rationale: パウロ書簡における通常の訳語を採用した。この文脈では御霊によって与えられる賜物としての信仰を指すが、その具体的性質を本文で限定しない。
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: 同じ御霊によって
  rationale: ἐνを手段・作用者の意味に取り、賜物をもたらす御霊の働きを自然な日本語で示した。αὐτῷは「同じ」として語句の反復を保った。
- source_word: χαρίσματα ἰαμάτων
  choice: 癒やしの賜物
  rationale: 直訳的には両名詞とも複数形だが、日本語では数を明示しない形が自然である。原文の複数形は脚注で明記した。
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: 一つの御霊によって
  rationale: ἑνίを「一つの」と訳し、多様な賜物に対する御霊の一性という原文の強調を、「同じ御霊」と平板化せずに残した。
- source_word: '[implied verb from context]'
  choice: 与えられ／与えられます
  rationale: ギリシア語では動詞が省略されているが、前節から続く配分の構文を日本語として完結させるため補った。
theological_decisions:
- issue: πίστιςが御霊の賜物として語られる文脈での意味
  choice: 信仰
  alternative: 信頼、真実
  rationale: 本文は特定の教派的な『信仰の賜物』の定義を加えず、語の基本的な幅を保つ。可能な別訳は脚注に示した。
- issue: πνεύματιの指示対象
  choice: 御霊
  alternative: 霊
  rationale: 第一コリント12章の文脈では、賜物を与える聖霊を指すことが明瞭である。「御霊」は神の霊を指す日本語として自然であり、文脈以上の説明は加えていない。
- issue: αὐτῷとἑνίの訳し分け
  choice: 同じ御霊／一つの御霊
  alternative: 両方を「同じ御霊」とする
  rationale: 原文の表現上の変化を保ち、多様性の中での同一性と一性という緊張を訳文で消さないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖霊」ではなく文脈上自然な「御霊」を用い、原文の「同じ」と「一つ」の違いを保持した。「癒やし」は一般読者に読みやすい交ぜ書きとした。
