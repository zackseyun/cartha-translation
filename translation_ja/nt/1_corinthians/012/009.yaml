revisions:
- from: 別の人には、同じ御霊によって信仰が与えられ[a]、また別の人には、一つの御霊によって癒やしの賜物が与えられます[b]。
  to: 別の人には、同じ聖霊によって信仰が与えられ[a]、また別の人には、唯一の聖霊によって癒やしの賜物が与えられます[b]。
  rationale: 本文の分配構文と「同じ聖霊／唯一の聖霊」という原文の語の変化を保った。「聖霊」は文脈上明白な指示対象を現代日本語で明確にし、「唯一の」はἑνὶの一性の強調を不自然さなく表す。脚注aはπίστιςの適切な語義上の代替案へ訂正し、脚注bは原文の二重複数を簡潔に明記した。
