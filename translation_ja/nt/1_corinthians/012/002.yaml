  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: ja
  text: あなたがたは知っています。異邦人[a]であったころ、どのように導かれていたとしても、ものを言えない偶像[b]へと連れて行かれていたことを。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民の一員」。ここでは、ユダヤ人ではない人々の意で、以前の偶像礼拝の生活を背景としている。
    reason: lexical_alternative
  - marker: b
    text: 直訳「声のない偶像」。別訳「ものを言わない偶像」。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「どのように導かれていたとしても、連れて行かれていました」。原文は二つの受動表現を重ね、以前の影響のもとで受け身に運ばれていた様子を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: あなたがたは知っています
  rationale: 現在形による、読者が共有している知識への直接的な訴えを、自然な現代日本語で表した。
- source_word: ἔθνη
  choice: 異邦人
  rationale: ここでは、コリントの信徒たちが以前ユダヤ人ではなく偶像礼拝の中にいたことを指す。単なる「諸国民」より文脈に明瞭で、「異教徒」ほど評価的な含みを加えない。
- source_word: πρὸς τὰ εἴδωλα
  choice: 偶像のもとへ
  rationale: πρόςと対格が示す方向・移動を保ちつつ、日本語として自然にした。
- source_word: τὰ ἄφωνα
  choice: ものを言えない
  rationale: 偶像に発話能力がないことを明確にし、周辺文脈にある霊による発言との対照を保った。「口のきけない」は現代では人に対して不適切に響きうるため避けた。
- source_word: ὡς ἂν ἤγεσθε
  choice: 導かれるがままに
  rationale: ὡς ἄνの不定・様態的な意味と、ἤγεσθεの未完了過去・受動の継続性を、簡潔で自然な表現にした。
- source_word: ἀπαγόμενοι
  choice: 連れて行かれていた
  rationale: 方向を伴う受動的な移動と、過去に継続していた状態を表す。直前の「導かれるがままに」と合わせ、原文に重なる二つの受動表現を日本語で保った。
theological_decisions:
- issue: ἔθνηが表す以前の身分
  choice: 「異邦人」とし、民族的・宗教的な含みを保つ
  alternative: 「異教徒」または「諸国民」
  rationale: パウロは彼らの回心以前を想起させているが、本文そのものより強い道徳的評価を訳語に持ち込まず、パウロ書簡での用法に沿った。
- issue: ものを言えない偶像と、文脈上の霊による発言との対照
  choice: 「ものを言えない偶像」と明示する
  alternative: 単に「偶像」とする、または「沈黙する偶像」とする
  rationale: ἄφωναの意味を省かず、偶像には語る能力がないという修辞的対照を説明の追加なしに保った。
- issue: かつて偶像へ向かわされた際の受動性
  choice: 「導かれるがままに連れて行かれていた」と二重の受動表現を保つ
  alternative: 「偶像に従っていた」と能動的にまとめる
  rationale: ἤγεσθεとἀπαγόμενοιが重ねて示す受動的・継続的な動きを保ちつつ、その力の正体について本文以上の神学的説明を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、回想を促す厳粛な調子を保った。文を二つに分けて長い従属構造を読みやすくし、後文末の「ことを」でοἴδατε ὅτιの内容節であることを示した。「導かれるがままに連れて行かれていた」はやや重なるが、原文の意図的な受動表現の重なりを保持するため採用した。
