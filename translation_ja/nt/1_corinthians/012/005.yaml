  text: καὶ διαιρέσεις διακονιῶν εἰσιν, καὶ ὁ αὐτὸς κύριος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: ja
  text: 奉仕にはさまざまなものがあり[a]、同じ主がおられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奉仕」：または「務め」または「仕える働き」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: さまざまなもの
  rationale: ここでは分裂ではなく、同一性の中にある種類の違いを表す。自然な現代日本語で文脈上の多様性を伝える。
- source_word: διακονιῶν
  choice: 奉仕
  rationale: 教会における務めや仕える働きを広く指しうる語であり、日本語では「奉仕」が簡潔で自然。「務め」も可能なので脚注に示す。
- source_word: ὁ αὐτὸς
  choice: 同じ
  rationale: 異なる奉仕の背後に同じ主がおられるという、4～6節の反復と一致の強調を保つ。
- source_word: κύριος
  choice: 主
  rationale: パウロ書簡における標準的な称号を保つ。ここではイエスを指す可能性が高いが、本文では明示的に補わない。
- source_word: καὶ
  choice: にも／が
  rationale: 前後の並行文との添加的な連結を「にも」で示し、節内の対照的なまとまりは自然な日本語として「が」で表した。
- source_word: εἰσιν
  choice: あります
  rationale: 存在を表す複数形を、無生物を主題とする自然な丁寧体の日本語で表現した。
theological_decisions:
- issue: 1コリント12:4～6の三項的表現における「主」の指示対象
  choice: 「主」という称号のまま訳し、本文中で指示対象を補足しない。
  alternative: 「主イエス」と明示する、または神への一般的呼称と理解する。
  rationale: 文脈上は聖霊、主、神という並行があり、「主」はイエスを指す可能性が高い。しかし原文自体は名を添えていないため、その含みと緊張を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語。前節との並行を「にも」で表し、文末は一般読者に読みやすい丁寧体とした。
