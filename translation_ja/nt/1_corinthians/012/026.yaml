id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: ja
  text: 一つの部分が苦しめば、すべての部分が共に苦しみ、一つの部分が尊ばれれば[a]、すべての部分が共に喜びます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「栄光を受ければ」。ここでは、一つの部分が重んじられ、ほかのすべての部分もその喜びを分かち合う、という意味と考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: …ば、…れば
  rationale: 二つの一般的な場合を並べる相関構文として、現代日本語で自然な条件表現を用いた。
- source_word: πάσχει
  choice: 苦しむ
  rationale: 苦痛や困難を経験するという広い意味を保ち、苦しみの種類を限定しない。
- source_word: ἓν μέλος / μέλος
  choice: 一つの部分
  rationale: 直前から続く身体の比喩を明瞭にし、日本語で自然に読めるよう「部分」とした。第二節にも「一つの」を補い、対句の自然さと指示対象の明確さを保った。
- source_word: συμπάσχει
  choice: 共に苦しむ
  rationale: 接頭辞 συν- が示す苦しみの共有を簡潔に表す。
- source_word: δοξάζεται
  choice: 尊ばれる
  rationale: この文脈では、身体の一部分が栄誉や重んじられる扱いを受けることを指すため。「栄光を受ける」という語義上の幅は脚注に残した。
- source_word: συγχαίρει
  choice: 共に喜ぶ
  rationale: 喜びを共有するという複合動詞の意味を自然な日本語で表す。
- source_word: πάντα τὰ μέλη
  choice: すべての部分
  rationale: 原文の反復と身体の比喩を両方の節で一貫して保つ。
theological_decisions:
- issue: 教会という身体の比喩における δοξάζεται の意味
  choice: 社会的に重んじられること（「尊ばれる」）
  alternative: 「栄光を受ける」
  rationale: 直近の文脈は身体の各部分の相互配慮と連帯を扱っているため、特定の終末論的・神学的意味に限定しない。原語が持つ「栄光」の語感は脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「肢体」より一般読者に分かりやすい「部分」を選び、身体の比喩は文脈によって維持した。
