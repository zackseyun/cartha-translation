  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: ja
  text: さて、兄弟たち、霊的な事柄については[a]、あなたがたに知らないままでいてほしくありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「霊的なもの」。この語は「霊の賜物」とも理解され得ますが、ギリシア語本文には「賜物」という語はありません。
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: さて、～についてですが
  rationale: περίの話題提示とδέの緩やかな話題転換を、自然な現代日本語で表した。時間を意味する「今」は加えていない。
- source_word: τῶν πνευματικῶν
  choice: 霊的なもの
  rationale: 実体化された形容詞の広さを保つ表現。文脈上は御霊による賜物が中心となるが、原文に「賜物」は明記されず、「霊的な人々」の可能性も文法上は残るため、本文では限定しなかった。
- source_word: ἀδελφοί
  choice: 兄弟たち[a]
  rationale: 男性複数呼格を形態に即して訳した。パウロが会衆全体への呼びかけとして用いており、女性も含むと考えられる点は脚注で示した。
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: あなたがたに知らずにいてほしくありません
  rationale: 否定を伴う意志表現とἀγνοεῖνの「知らないでいる」を保ちつつ、侮蔑的に響き得る「無知」を避けた。
theological_decisions:
- issue: τῶν πνευματικῶνの解釈
  choice: 本文では「霊的なもの」
  alternative: 「霊の賜物」または「霊的な人々」
  rationale: 12章の展開から「霊の賜物」は有力だが、ギリシア語自体は「賜物」を明記していない。真正な語彙的・神学的幅を本文で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。話題転換は「さて」で示し、原文の曖昧さを守るため「霊の賜物」と限定しなかった。
