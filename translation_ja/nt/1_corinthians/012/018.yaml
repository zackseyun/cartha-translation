  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: ja
  text: しかし実際には、神は、体の中に各部分を一つ一つ、ご自分が望まれたとおりに[a]配置されました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分が意図されたとおりに」または「みこころのままに」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「置かれました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし実際には
  rationale: 直前の仮定的な議論と、現実に神が定めた状態とを対比する表現。「しかし今は」では時間的意味に偏りうるため、談話上の転換と現実性を自然な日本語で示した。
- source_word: ὁ θεὸς
  choice: 神は
  rationale: 定冠詞付きの主語を、現代日本語として自然に訳した。
- source_word: ἔθετο
  choice: 配置なさいました
  rationale: τίθημιの基本的な「置く」という意味を保ちつつ、体の中で各部分に意図的な位置を与える文脈を表した。「なさいました」により、神を主語とする能動的な行為であることを明確にした。
- source_word: τὰ μέλη
  choice: 体の各部分
  rationale: 身体比喩における個々の構成部分を、一般読者に分かりやすく表現した。「肢体」は伝統的だが、現代の日常語としては硬く意味が取りにくい。
- source_word: ἓν ἕκαστον αὐτῶν
  choice: 一つ一つ
  rationale: 各部分の個別性を強調する分配的表現を簡潔に保持した。
- source_word: ἐν τῷ σώματι
  choice: 体の…部分を…配置
  rationale: 日本語では「体の各部分」として所属関係を先に示し、「配置する」と組み合わせることで、体の中に置かれたという意味を自然に伝えた。
- source_word: καθὼς ἠθέλησεν
  choice: ご自分が望まれたとおりに
  rationale: 神自身の意志・意向との一致を表す。神学用語的な「みこころのままに」へ狭めず、θέλωの意志的意味を明瞭に保った。
theological_decisions:
- issue: 体の各部分の配置における神の意図
  choice: 各部分は、神ご自身が望まれたとおりに意図的に配置されたと訳す。
  alternative: 各部分が単に体の中に置かれたと訳す。
  rationale: ἔθετοとκαθὼς ἠθέλησενの組み合わせは、多様な部分の存在と位置が偶然ではなく神の意向に沿うことを示す。ただし、この一節を越えた予定論的・教派的体系は訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用い、身体比喩には一般読者が理解しやすい「体の各部分」を採用した。神への敬意は「ご自分」「なさいました」で表しつつ、過度に古風な文体や教派特有の語彙を避けた。
