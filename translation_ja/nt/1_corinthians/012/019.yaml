id: 1CO.12.19
reference: 1 Corinthians 12:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: ja
  text: もしすべてが一つの部分であったなら、体はどこにあるのでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: もし
  rationale: 仮定条件を導く接続詞として、現代日本語で自然な「もし」を用いた。
- source_word: δὲ
  choice: —
  rationale: ここでは議論を緩やかに展開する接続辞であり、前後の対比は仮定文そのものから明らかなため、日本語では明示しないほうが自然である。
- source_word: ἦν
  choice: であったなら
  rationale: 未完了過去形を仮想的な条件として表し、現実とは異なる事態を想定する論証の響きを保った。
- source_word: τὰ πάντα
  choice: すべて
  rationale: 抽象的な万物ではなく、文脈上は体を構成する諸部分の全体を指すため、「すべて」とした。
- source_word: ἓν μέλος
  choice: 一つの部分
  rationale: μέλοςは身体の構成部分を指す。「肢体」は伝統的だが現代の日常語として分かりにくく、「一つの部分」が身体の比喩と構成員の含意を自然に保つ。
- source_word: ποῦ
  choice: どこにあるのでしょうか
  rationale: 仮定の帰結として体の成立が不可能になることを問う修辞疑問として訳した。「のでしょうか」により、断定を加えず問いの力を自然に示した。
- source_word: τὸ σῶμα
  choice: 体
  rationale: 定冠詞付きのσῶμαを文脈上すでに提示された体として訳した。日本語では「その体」と明示しなくても特定性が伝わる。
theological_decisions:
- issue: 体の比喩が指す範囲
  choice: 本文どおり単に「体」とし、多様な部分が一つの体を成すという修辞を保つ。
  alternative: 「キリストの体」または「教会」と明示する。
  rationale: 広い文脈では教会とキリストの体が念頭にあるが、この節自体はτὸ σῶμαとのみ述べる。訳文では神学的な指示対象を補わず、比喩の開かれた表現を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の格調を保った。「肢体」ではなく「部分」を選び、一般読者に理解しやすくした。
