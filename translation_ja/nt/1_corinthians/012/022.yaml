  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: ja
  text: それどころか、体の部分で、より弱いと思われるものが、はるかに必要なのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それどころか、体の部分で、より弱いと思われるものは、なおさら必要なのです」とも訳せます。ギリシア語は「はるかに／なおさら」という強い比較・強調を含みます。
    reason: lexical_alternative
  - marker: b
    text: 「必要」は「なくてはならない」または「不可欠」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: それどころか……こそ、はるかに
  rationale: ἀλλάの強い対照と πολλῷ μᾶλλον の明示的な強意をともに表す。「それどころか」で前節を反転させ、「こそ、はるかに」で反対の命題が強く真であることを自然な日本語で示した。
- source_word: τὰ δοκοῦντα
  choice: と思われるもの
  rationale: 実際の性質を断定せず、人の目にそう見える、またはそう評価されるという δοκέω の含みを保つ。
- source_word: μέλη τοῦ σώματος
  choice: 体の部分
  rationale: 身体の比喩を具体的に保ちつつ、現代日本語として自然にした。「肢体」も可能だが、一般読者にはやや古風で教会用語的に響く。
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: より弱い
  rationale: 比較級を明示し、何らかの絶対的な弱さではなく、相対的に弱いと見なされることを表した。ὑπάρχειν は日本語では別に訳出せず、「弱いと思われる」に統合した。
- source_word: ἀναγκαῖά ἐστιν
  choice: 必要なのです
  rationale: ἀναγκαῖος の基本的な必要性を過度に解釈せず表す。「不可欠」は文脈に合うが、より強い訳語なので脚注に示した。
theological_decisions:
- issue: 教会についての身体比喩
  choice: 「体の部分」という具体的な身体表現を維持する
  alternative: 「教会の一人一人」などと説明的に訳す
  rationale: 文脈上は教会共同体に適用されるが、この節自体は身体の諸部分について語っているため、比喩を解説的な言い換えで平板化しない。
- issue: 弱さの実在性と見かけ
  choice: 「弱いと思われる」として認識・評価の次元を保つ
  alternative: 実際に弱い部分と断定する
  rationale: δοκοῦντα と ὑπάρχειν の構文は「弱いと思われる」を表し、真の弱さを単純に断定してはいない。その曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「肢体」のような古風・教会用語的な語を避けた。前節との論理的対照と原文の強意を省略せず、「それどころか」「こそ、はるかに」で表現した。
