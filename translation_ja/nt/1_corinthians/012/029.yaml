  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: ja
  text: 皆が使徒というわけではないでしょうか。皆が預言者というわけではないでしょうか。皆が教師というわけではないでしょうか。皆が奇跡を行うというわけではないでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「皆が『力ある業』でしょうか」。ギリシア語のこの語は、ここでは奇跡的な働き、またはそのような働きを行う人を指す簡略な表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: ～でしょうか
  rationale: 否定の答えを予期する疑問を、文脈上「そうではない」という答えが明らかな日本語の反語的疑問として表した。各文に否定語を加えるより自然で、原文の反復も保てる。
- source_word: πάντες
  choice: 皆が
  rationale: 共同体の全員が同じ務めや働きを担うわけではないという強調を、簡潔かつ自然に表す。
- source_word: ἀπόστολοι
  choice: 使徒
  rationale: ここでは単なる使者ではなく、パウロが列挙する教会内の務めを指すため、定着した訳語を用いた。
- source_word: προφῆται
  choice: 預言者
  rationale: 預言する人々を指す標準的で明瞭な訳語。
- source_word: διδάσκαλοι
  choice: 教師
  rationale: 教える務めを担う人々を指す、現代日本語で明瞭な訳語。
- source_word: δυνάμεις
  choice: 奇跡を行う
  rationale: 原語は字義的には「力ある業／奇跡」という複数名詞だが、この並列ではそのような業を行うこと、または行う人を換喩的に指す。日本語では動詞表現が自然である。
theological_decisions:
- issue: 務めと賜物の列挙における δυνάμεις の表現
  choice: 皆が奇跡を行うのでしょうか
  alternative: 皆が力ある業を行う者でしょうか／皆に奇跡を行う力があるのでしょうか
  rationale: 人が字義どおり「力ある業そのもの」であるという不自然な意味を避けつつ、全員が同じ奇跡的な働きをするわけではないという文脈上の意味を示した。「力を持つ」として恒常的能力の有無に限定することも避けた。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。原文の四つの反語的疑問と「皆が」の反復を維持し、予期される否定の答えを説明句で明示せず読者に伝わる形にした。
