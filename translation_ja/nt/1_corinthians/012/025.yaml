  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: ja
  text: それは、体の中に分裂[a]がなく、むしろ各部分が互いに等しく気を配る[b]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「分裂」は「裂け目」とも訳せるギリシア語です。ここでは、体の内部の分断を指します。
    reason: lexical_alternative
  - marker: b
    text: または「互いを同じように気遣う」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ためです
  rationale: 目的・結果を示す接続詞。直前の文脈を受ける日本語として自然であり、目的の意味を保つ。
- source_word: σχίσμα
  choice: 分裂
  rationale: 裂け目や仲たがいを表す語で、ここでは体の内部の分断を指す。「分裂」は身体の比喩と教会共同体への適用の双方に通じる。
- source_word: σῶμα
  choice: 体
  rationale: パウロが用いる身体の比喩を直接保ち、現代日本語として自然である。
- source_word: τὰ μέλη
  choice: 各部分
  rationale: 身体を構成する肢体を指す。ここでは「各部分」とすることで身体の比喩を明瞭にしつつ、それぞれの構成員という含みも保つ。
- source_word: τὸ αὐτὸ ... μεριμνῶσι
  choice: 同じように気遣う
  rationale: τὸ αὐτόは気遣いの同一性・等しさを表しうる。日本語では「同じように気遣う」が自然で、相互に偏りなく配慮する意味を伝える。
- source_word: ὑπὲρ ἀλλήλων
  choice: 互いを
  rationale: ここでὑπέρは身代わりではなく、配慮が互いに向けられることを示す。動詞「気遣う」に合わせて自然な目的語として訳した。
theological_decisions:
- issue: σχίσμαを教会的文脈でどう訳すか
  choice: 分裂
  alternative: 分派、裂け目
  rationale: 後代の教会制度上の専門語を持ち込まず、本文にある身体内部の分断という像と共同体の不一致の双方を保つ。
- issue: τὸ αὐτόが示す相互配慮の性質
  choice: 同じように気遣う
  alternative: 同じ思いで気遣う
  rationale: 本文は必ずしも感情や見解の一致を述べるのではなく、構成部分が互いに向ける配慮の同等性を示すため、解釈を狭めない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「肢体」は教会用語としては定着しているが日常的な明瞭さに欠けるため、身体の比喩が伝わりやすい「各部分」を採用した。脚注記号は対応箇所を明確にするため文末に付した。
