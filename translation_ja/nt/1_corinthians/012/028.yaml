id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: ja
  text: 神は教会の中に、第一に使徒たち、第二に預言者たち、第三に教師たち、次に力あるわざ[a]、次に癒やしの賜物、援助する働き、導く働き[b]、さまざまな異言[c]を置かれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奇跡」または「力ある業」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「運営する働き」または「指導する働き」。この語には、舵を取って導くという語感があります。
    reason: lexical_alternative
  - marker: c
    text: 別訳「さまざまな言語」。ギリシャ語は「舌」と「言語」のどちらも意味し得ます。本文の「異言」は、この文脈でその性質を一つに決めない表現です。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: 置かれました
  rationale: 教会に人々と働きや賜物を神が配置されたことを表す。日本語では列挙される具体的な役割と抽象的な働きの双方を目的語に取ることができ、原文の一つの動詞による構造も保てる。
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: 教会の中に
  rationale: パウロ書簡における神の民の共同体を指す自然で一般的な表現。
- source_word: πρῶτον … δεύτερον … τρίτον
  choice: 第一に…第二に…第三に
  rationale: 原文の明示的な順序をそのまま示し、その順序の意味までは訳文で決めない。
- source_word: ἀποστόλους
  choice: 使徒たち
  rationale: この教会的な賜物と役割の一覧では、一般的な使者ではなく使徒として認識された人々を指す。
- source_word: προφήτας
  choice: 預言者たち
  rationale: 預言を語る人々を指す標準的で明瞭な訳語。
- source_word: διδασκάλους
  choice: 教師たち
  rationale: 教会内で教える人々を表す自然な訳語。
- source_word: δυνάμεις
  choice: 力ある働き
  rationale: 直訳的な「力」を保ちながら、この文脈で現れとしての力ある業を指すことが分かる表現とした。「奇跡」という意味は脚注に示す。
- source_word: χαρίσματα ἰαμάτων
  choice: さまざまな癒やしの賜物
  rationale: 両名詞が複数形であることを日本語として自然に反映し、癒やしに関わる賜物が一様とは限らないことを平板化しない。
- source_word: ἀντιλήμψεις
  choice: 援助する働き
  rationale: 人を支え、助ける行為または機能を指す複数名詞を、一覧の中で理解しやすく表す。
- source_word: κυβερνήσεις
  choice: 導く働き
  rationale: 舵取り、指導、運営という語感を持つ語を、特定の階層的職制に限定せず訳した。別の可能性を脚注に示す。
- source_word: γένη γλωσσῶν
  choice: さまざまな異言
  rationale: γένηの「種類」を「さまざまな」で表し、γλῶσσαιにはこの章の賜物の議論で定着した「異言」を用いる。「言語」の可能性は脚注で保持する。
theological_decisions:
- issue: 列挙の順序が恒久的な位階、時間的順序、機能上の重要性のいずれを示すか
  choice: 「第一に…第二に…第三に…次に…次に」と原文の順序だけを明示する。
  alternative: 権威の位階、出現の時間的順序、または相対的重要性として説明的に訳す。
  rationale: 本文は順序を示すが、その性質を明言していないため、解釈を訳文に加えない。
- issue: γλῶσσαιの具体的な意味
  choice: 本文では「異言」とする。
  alternative: 「言語」とする。
  rationale: この現象の性質を訳文だけで通常の人間言語に限定せず、パウロの議論で定着した表現を用いる一方、「言語」の語義は脚注に残す。
translation_notes:
  register: 現代標準日本語による、平明さと品位を両立した文体。人を表す前三項から働きや賜物を表す後半へ移る原文の構造を保ち、列挙の神学的な序列や異言の性質を説明で確定しない。
