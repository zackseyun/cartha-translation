id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: ja
  text: というのも、体は一つで、多くの部分を持ち、体のすべての部分は、多くありながら一つの体です。メシア[a]も同じです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」はギリシア語「クリストス」の称号としての意味を表したもの。別訳「キリスト」。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「メシアも同じように」である。原文は「メシアの体」や「教会」と補わず、簡潔に「メシア」と述べている。その意味は続く節で展開される。
    reason: cross_reference
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: というのも、…それと同じように
  rationale: γάρが前後の議論を説明的につなぐ働きを「というのも」で示し、καθάπερとοὕτως καίの対応を「…それと同じように」で自然な日本語にした。
- source_word: σῶμα
  choice: 体
  rationale: 比喩の中心語であり、現代日本語で明瞭かつ一貫して理解できる標準的な訳語。
- source_word: ἕν
  choice: 一つ
  rationale: 数的な一つであることと、多様な部分から成る統一性の両方を保つ。
- source_word: μέλη
  choice: 部分
  rationale: 人体を構成する諸部分を指す語として自然で分かりやすい。「肢体」は文語的・教会用語的に響きやすく、「手足」では範囲を狭めるため避けた。
- source_word: πολλὰ ὄντα
  choice: 多くありながら
  rationale: 分詞句の譲歩的な含みを保ち、多数性と一体性の対照を明確にする。
- source_word: ἕν ἐστιν σῶμα
  choice: 一つの体
  rationale: 多くの部分が一つの体を成すという原文の述語構造と比喩を簡潔に保つ。
- source_word: οὕτως καὶ
  choice: それと同じように、…もそうなのです
  rationale: 先行する体の比喩との対応を明示しつつ、原文の簡潔な比較結論を過度に説明しない。
- source_word: ὁ Χριστός
  choice: メシア
  rationale: Χριστόςを固有名のように処理せず、「油注がれた者」という称号として示す。日本語で定着した称号「メシア」を用いる。
theological_decisions:
- issue: ὁ Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは冠詞を伴う称号として、共同体的な体との関係を述べる神学的表現に置かれているため、称号性が伝わる「メシア」とした。
- issue: 「メシアもそうなのです」の解釈
  choice: 原文の圧縮された表現を保持する
  alternative: 「メシアの体も同じです」または「教会も同じです」と補う
  rationale: 原文は「メシアの体」や「教会」と明記せず、οὕτως καὶ ὁ Χριστόςと述べる。後続節が展開する意味を本文中で先取りせず、意図的な神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「肢体」のような文語的な教会用語を避けながら、議論の格調を保った。比較構文は日本語として読みやすい二文に分けたが、「というのも」と「それと同じように」によって原文の論理的・修辞的つながりを維持した。
