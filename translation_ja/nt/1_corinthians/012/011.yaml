  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: ja
  text: しかし、これらすべてを働かせているのは、一つであり、同じ御霊です。[a] 御霊は、ご自身の望むとおりに、一人一人に分け与えます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「働かせている」は、「生み出している」「実現している」とも訳せます。ギリシア語は、これらすべてを一つであり同じ御霊が働かせていることを表します。
    reason: lexical_alternative
  - marker: b
    text: 「望むとおりに」は、「選ぶとおりに」とも訳せます。ギリシア語の動詞は、意志すること、選ぶこと、望むことを表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: しかし、これらすべてを
  rationale: δέは直前の多様な賜物の列挙と、それらの源が一つであることとの軽い対照を示すため「しかし」とした。πάντα ταῦταの全体性を「これらすべて」で保った。
- source_word: ἐνεργεῖ
  choice: 働かせている
  rationale: 御霊が列挙された働きを実現し、生じさせる能動的作用を表す。日本語の「働く」だけでは自動詞的に読まれやすいため、目的語を取る「働かせる」とした。
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: 同一の一つの御霊
  rationale: 多様な働きの源がまさに同じ一つの御霊であるという、ἓνとαὐτόの重なった強調を保った。「御霊」はこのパウロ書簡の文脈で聖霊を指すことを自然に示す。
- source_word: διαιροῦν
  choice: 分け与えます
  rationale: 単に分割するのではなく、各人へ配分するという文脈上の意味を明確にした。分詞は主動詞と同じ御霊の継続的な働きを説明するため、日本語では独立した述語に展開した。
- source_word: ἰδίᾳ ἑκάστῳ
  choice: 一人一人にそれぞれを
  rationale: ἑκάστῳの個別的な受領者と、ἰδίᾳの各人ごとの配分を、重複感を抑えながら明示した。「それぞれを」は文脈上、異なる賜物・働きを指す。
- source_word: καθὼς βούλεται
  choice: 望むとおりに
  rationale: βούλομαιの意志・選択・願望にまたがる語義を狭めすぎず、御霊自身の意志に基づく配分を自然な現代日本語で示した。
theological_decisions:
- issue: πνεῦμαとβούλεταιが示す御霊の主体性
  choice: 二文目でも「御霊」を主語として明示し、「望む」と訳す
  alternative: 「その意志のままに」または主語を省いて「望まれるとおりに」とする
  rationale: πνεῦμαは文法上中性だが、βούλεταιは意志を御霊に帰している。日本語では代名詞の性を選ぶ必要がないため、本文が示す人格的・意志的な主体性を「御霊は、望むとおりに」で直接表し、それ以上の教義的説明は加えなかった。
- issue: 多様な賜物と単一の源
  choice: 「同一の一つの御霊」として二重の強調を保持する
  alternative: より自然だが強調の一部が弱まる「同じ御霊」
  rationale: τὸ ἓν καὶ τὸ αὐτόは、働きの多様性にもかかわらず源が一つで同一であることを強く示すため、多少改まった表現でも両要素を残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文にふさわしい端正さを保った。長いギリシア語一文は、御霊の作用と配分の関係を読み取りやすくするため二文に分けた。「同一の一つの」は通常より形式的だが、原文の重ねた強調を保持するため採用した。
