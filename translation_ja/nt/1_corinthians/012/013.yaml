id: 1CO.12.13
reference: 1 Corinthians 12:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: ja
  text: 実に、私たちは皆、一つの御霊のうちに、一つのからだに加えられるためにバプテスマを受けました[a]。ユダヤ人であってもギリシア人であっても、奴隷であっても自由人であっても、私たちは皆、一つの御霊を飲むようにされたのです[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一つの御霊によって」とも訳せる。ギリシア語のἐνは、領域（「のうちに」）にも手段・媒介（「によって」）にも取ることができる。
    reason: alternative_reading
  - marker: b
    text: 「私たちは皆、一つの御霊を飲む者とされた」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「一つの霊」とも訳せるが、文脈は聖霊を指すことを強く示している。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実に
  rationale: 前文を根拠づけつつ強調する接続表現として、現代日本語で自然かつ簡潔に表した。
- source_word: ἐν ἑνὶ πνεύματι
  choice: 一つの御霊のうちに
  rationale: ἐν が表し得る領域と手段・媒介の両義性を、本文では原文の形に近い「のうちに」で保った。
- source_word: ἡμεῖς πάντες
  choice: 私たちは皆
  rationale: 明示された代名詞と πάντες の集合的な強調を保った。
- source_word: εἰς ἓν σῶμα
  choice: 一つのからだとなるために
  rationale: εἰς の方向・結果としての共同体への組み入れを自然な日本語で示し、文脈上の「からだ」の比喩を保持した。
- source_word: ἐβαπτίσθημεν
  choice: バプテスマを受けました
  rationale: パウロ書簡の教会的文脈に定着した訳語を用い、浸礼という方式を本文に読み込まないようにした。
- source_word: Ἰουδαῖοι / Ἕλληνες
  choice: ユダヤ人／ギリシア人
  rationale: 民族・宗教的対比を原語どおりに表し、「異邦人」へ一般化しなかった。
- source_word: δοῦλοι / ἐλεύθεροι
  choice: 奴隷／自由人
  rationale: 法的・社会的身分の対照が明白なので、δοῦλοι を弱めず「奴隷」とした。
- source_word: ἐποτίσθημεν
  choice: 飲ませていただいた
  rationale: ποτίζω の受動態が示す「飲ませる／飲み物を与える」という意味を、日本語として自然な受け身で表した。
- source_word: ἓν πνεῦμα
  choice: 一つの御霊
  rationale: 直前との並行と聖霊の一致の働きを論じる文脈から聖霊を指すと判断したが、別解は脚注に残した。
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι が領域を表すか、手段・媒介を表すか
  choice: 一つの御霊のうちに
  alternative: 一つの御霊によって
  rationale: ギリシア語の前置詞 ἐν はこの箇所で複数のニュアンスを許すため、本文では形式に近い表現を採り、手段・媒介の読みを脚注に示した。
- issue: εἰς ἓν σῶμα の方向・結果
  choice: 一つのからだとなるために
  alternative: 一つのからだの中へ
  rationale: 教会という一つのからだへの組み入れを示す比喩を保ちつつ、不自然な直訳を避けた。
- issue: 二度目の ἓν πνεῦμα の指示対象
  choice: 一つの御霊
  alternative: 一つの霊
  rationale: 文脈は聖霊を強く示唆するが、共有された霊的現実と取る余地を脚注で保持した。
- issue: ἐποτίσθημεν と ἓν πνεῦμα の統語関係
  choice: 一つの御霊を飲ませていただいた
  alternative: 一つの御霊を飲むように与えられた
  rationale: 御霊への共通の参与を飲む比喩で表す主要な構文理解を採用し、別の日本語表現を脚注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「御霊」は聖霊を指すことを明確にしつつ聖書文体として自然。「からだ」はパウロの共同体的比喩を保つため、医学的な「身体」を避けて平仮名表記とした。
