  to: 実に、私たちは皆、一つの御霊のうちに、一つのからだに加えられるためにバプテスマを受けました[a]。ユダヤ人であってもギリシア人であっても、奴隷であっても自由人であっても、私たちは皆、一つの御霊を飲むようにされたのです[b][c]。
