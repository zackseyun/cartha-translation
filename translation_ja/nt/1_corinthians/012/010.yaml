source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: ja
  text: ある人には奇跡を行う働き[a]、ある人には預言、ある人には霊を見分けることがら、別の人にはさまざまな異言、またある人には異言の解釈[b]が与えられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「力の働き」。また、「力あるわざを行う働き」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「さまざまな言語」「言語の解釈」とも訳せる。ギリシア語は「異言」と「言語」のどちらも意味し得るため、本文では霊の賜物に関するパウロの議論の曖昧さを保つ「異言」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: 奇跡を行う働き
  rationale: ἐνεργήματαの「働き・作用」と、ここで奇跡的なわざを指すと考えられるδυνάμεωνを、現代日本語で自然に表した。直訳的な可能性は脚注に残した。
- source_word: προφητεία
  choice: 預言
  rationale: 霊の賜物として挙げられる語の標準的で簡潔な訳。内容を特定の形の発言に狭めない。
- source_word: διακρίσεις πνευμάτων
  choice: 霊を見分ける働き
  rationale: 複数形διακρίσειςの反復的・多様な働きを「働き」で示し、πνευμάτωνが何を指すかは限定せず、「霊」のまま保った。
- source_word: γένη γλωσσῶν
  choice: さまざまな異言
  rationale: γένηの種類の多様性を「さまざまな」で表し、γλῶσσαの現象を既成の解釈に限定しないよう「異言」とした。言語という訳の可能性は脚注に示した。
- source_word: ἑρμηνεία γλωσσῶν
  choice: 異言の解釈
  rationale: ἑρμηνείαを、内容を理解可能にする行為を広く表す「解釈」と訳した。「翻訳」だけに限定しない。
- source_word: ἄλλῳ / ἑτέρῳ
  choice: ある人には／別の人には／またある人には
  rationale: 与格による賜物の配分を自然な日本語で示した。ἄλλοςとἕτεροςの交替に過度な意味の差を持たせず、列挙の流れを明確にした。
theological_decisions:
- issue: δυνάμεωνが指すもの
  choice: 本文では「奇跡」とした。
  alternative: 「力」「力あるわざ」
  rationale: この賜物の列挙では奇跡的なわざを指す可能性が高い。一方、原語は字義的には「力」の複数形なので、その幅を脚注に残した。
- issue: γλωσσῶνの意味
  choice: 本文では「異言」とした。
  alternative: 「言語」
  rationale: 既知の人間言語か、それ以外の発話かを本文だけで決めず、パウロの議論にある語義上・神学上の緊張を保った。別訳は脚注に示した。
- issue: πνευμάτωνの指示対象
  choice: 限定せず「霊」とした。
  alternative: 「霊的な発言」「発言の背後にある霊」「人間の霊」「悪霊」
  rationale: ギリシア語はここで霊の種類や指示対象を明示していないため、解釈を本文へ持ち込まなかった。
translation_notes:
  register: 明快な現代標準日本語を用い、賜物の列挙としての簡潔さと品位を保った。文脈上補われる「が与えられます」を末尾に置き、各項目への反復を避けた。「諸霊」のような硬い表現は避けつつ、霊の指示対象は限定していない。
