source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: ja
  text: 一方、見栄えのよい部分には、必要がありません。しかし神は、体を組み合わせられ、足りない部分にいっそう大きな尊敬を与えられました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「体を混ぜ合わせられました」。ギリシア語の動詞は、異なる部分を結び合わせて、調和ある全体とすることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: 見栄えのよい部分
  rationale: 直前の「見栄えのしない部分」と対照をなし、外見上、人前に出しても差し支えない部分という意味を、現代日本語で自然に表す。
- source_word: χρείαν ἔχει
  choice: その必要がありません
  rationale: 「必要を持たない」という慣用表現。「その」は、直前に述べられた特別な配慮や覆いを文脈から受ける。
- source_word: συνεκέρασεν
  choice: 一つに組み合わせられました
  rationale: 諸部分を混ぜ合わせ、調和ある全体にする語義を表す。「組み合わせる」により、神の意図的な構成を示しつつ、機械的な印象を避ける。別訳は脚注に示す。
- source_word: σῶμα
  choice: 体
  rationale: パウロの中心的な身体比喩をそのまま保つ。
- source_word: τῷ ὑστεροῦντι
  choice: 劣っていた部分に
  rationale: 誉れや体面の点で不足していた部分を指し、本質的価値が低いと断定しないよう、文脈依存の表現とする。
- source_word: περισσοτέραν τιμήν
  choice: いっそう大きな誉れ
  rationale: 比較級の力を明確に保ち、τιμήの尊重・栄誉という意味を「誉れ」で表す。
- source_word: δοὺς
  choice: 与えて
  rationale: 神が体を組み合わせた方法またはそれに伴う行為として、自然な連用形で表す。
theological_decisions:
- issue: 体を組み合わせる神の行為の解釈
  choice: 神が、誉れの不足していた部分により大きな誉れを与えることによって、体を意図的に一つに構成されたと訳す。
  alternative: 神が身体の諸部分を単に混ぜ合わせた、または自然の人体だけを整えたと読む。
  rationale: 直接の文脈では人体の実情と教会をキリストの体とする比喩が重なっている。訳文は神の目的ある行為を示すが、その指示対象を教会だけに限定せず、比喩の重なりを保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「見栄え」「組み合わせる」は身体比喩を具体的に保ち、「誉れ」は文脈の尊重と栄誉を簡潔に表す。脚注記号[a]は該当する動詞句の直後に置いた。
