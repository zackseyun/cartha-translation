revisions:
- from: 一方、見栄えのよい部分には、その必要がありません。しかし神は、劣っていた部分にいっそう大きな誉れを与えて、体を一つに組み合わせられました。[a]
  to: 一方、見栄えのよい部分には、必要がありません。しかし神は、体を組み合わせられ、足りない部分にいっそう大きな尊敬を与えられました。[a]
  rationale: 原文の対照（見栄えのよい部分／不足している部分）と、神が体を構成しつつ後者により大きな尊敬を与えるという構文関係を保った。「足りない部分」は、不足の対象を限定せず、文脈から尊敬に関わる不足を読み取れるようにする。脚注はσυνεκέρασενに対応する箇所に維持し、代替訳をより原文に即して整えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:42Z'
review_pass:
  verdict: revise
  source_fidelity: 「劣っていた部分」はὑστεροῦντιをその部分の本質的な優劣として響かせうるため、ここで文脈上意図される「不足している部分」（特に誉れを欠く部分）をより直接的に表すのが適切です。また、συνεκέρασενは神が体を構成した行為であり、日本語では「体を一つに組み合わせられました」より「体を組み合わせられました」のほうが、諸部分を結び合わせる動作として明瞭です。
  naturalness: 現行の「見栄えのよい部分には、その必要がありません」は理解できますが、「その」が指す内容をこの一節だけでは補いすぎています。「必要がありません」とするほうが簡潔で自然です。「神は、体を組み合わせられ、…与えられました」は明瞭で、敬体の聖書本文として自然です。
  terminology: εὐσχήμοναは「見栄えのよい部分」で適切です。τιμήはこの対照の文脈では「誉れ」よりも、当該部分に払われる扱いをも含む「尊敬」が自然です。ὑστεροῦντιは「足りない部分」として、不足が何であるかを不当に本質化せず保持します。
  issues:
  - severity: medium
    issue: 「劣っていた部分」
    rationale: ὑστεροῦντιは「不足している／欠けているもの」であり、直後の「より大きな尊敬」との関係から不足は尊敬・体面に関わる。日本語の「劣っていた」は存在論的または人格的な低劣さを示しうる。
  - severity: low
    issue: 「その必要」および「体を一つに組み合わせられました」
    rationale: 「その」は明示されていない先行内容を強く補う。「一つに」は統一の含意としては可能だが、原文の直接の目的語は「体」であり、「体を組み合わせる」としたほうが簡潔で原文の比喩に沿う。
  revised_text: 一方、見栄えのよい部分には、必要がありません。しかし神は、体を組み合わせられ、足りない部分にいっそう大きな尊敬を与えられました。[a]
  revised_footnotes:
  - marker: a
    text: 別訳「体を混ぜ合わせられました」。ギリシア語の動詞は、異なる部分を結び合わせて、調和ある全体とすることを表します。
    reason: lexical_alternative
  revision_rationale: 原文の対照（見栄えのよい部分／不足している部分）と、神が体を構成しつつ後者により大きな尊敬を与えるという構文関係を保った。「足りない部分」は、不足の対象を限定せず、文脈から尊敬に関わる不足を読み取れるようにする。脚注はσυνεκέρασενに対応する箇所に維持し、代替訳をより原文に即して整えた。
