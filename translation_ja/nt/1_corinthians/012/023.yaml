source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: ja
  text: また、体の中で私たちがより尊くないと思う部分には、私たちはいっそう大きな敬意を払います。そして、私たちの、見せるのにふさわしくない部分は、いっそうの見栄えを備えています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「いっそうの品位」または「いっそうふさわしい外観」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: 私たちが……と思う部分
  rationale: δοκέωが客観的な価値ではなく、人間による評価を表すことを明示し、自然な現代日本語とした。
- source_word: ἀτιμότερα
  choice: あまり尊くない
  rationale: 比較級を文脈に即して穏やかに表し、τιμήとの「尊重されない／敬意を払う」という対比を保った。
- source_word: τοῦ σώματος
  choice: 体の中で
  rationale: 部分と全体の関係を自然な日本語で示し、段落全体を支える身体の比喩を保持した。
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: かえっていっそうの敬意を払います
  rationale: περιτίθημιの「上に置く」という像を日本語で不自然に直訳せず、敬意を付与する意味を明瞭にした。「かえって」は前半との逆説的対比を表す。
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: 人目にさらすのがふさわしくない部分
  rationale: ἀσχήμωνの社会的に見苦しい、または公に示すのに適さないという意味を表し、道徳的な「わいせつ」の含意を不必要に加えないようにした。
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: いっそうの品位が備わります
  rationale: εὐσχημοσύνηが示す、ふさわしく整った外観や慎みを「品位」で表した。ἔχειは日本語として自然になるよう「備わる」とした。
theological_decisions:
- issue: 身体の各部分と共同体の成員との比喩
  choice: 具体的な身体部分についての表現を保つ
  alternative: 社会的に弱い教会員への尊重として直接言い換える
  rationale: パウロは実際の身体への扱いを類比として用いて共同体について論じているため、適用を訳文に織り込まず、比喩そのものから読み取れるようにした。
- issue: ἀσχήμοναの意味合い
  choice: 公の場にさらすのにふさわしくない身体部分と理解する
  alternative: 道徳的に恥ずべき部分、または単に見栄えの悪い部分とする
  rationale: 直後のεὐσχημοσύνηとの対照と、身体を覆い整える慣習を踏まえつつ、性的・道徳的意味に限定しなかった。
translation_notes:
  register: 明瞭で品位ある現代標準語。身体の具体性を避けずに保ちながら、露骨または古風な語を避けた。二つの節を「また」「そして」で結び、朗読時にも論理の流れが分かるようにした。
