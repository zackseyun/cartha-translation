  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: ja
  text: 実際、体は一つの部分ではなく、多くの部分から成っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: 実際
  rationale: 前節の議論を受けて、その内容を説明・補強する接続表現。日本語では「というのも」も可能だが、単独の節として自然で簡潔な「実際」とした。
- source_word: τὸ σῶμα
  choice: 体
  rationale: パウロの身体の比喩をそのまま保つ。文脈上は教会を指すが、本文にない「キリストの体」とは展開しない。
- source_word: οὐκ ἔστιν
  choice: ではなく
  rationale: 否定された繋辞を、後続のἀλλάとの対照が明瞭になる自然な日本語で表した。
- source_word: ἓν μέλος
  choice: 一つの部分
  rationale: μέλοςは身体を構成する肢体・部分を指す。現代の一般読者に明瞭で、身体比喩も保てる「部分」を採用した。「一つの肢体」はより字義的だが、現代日本語では硬く不自然になりやすい。
- source_word: ἀλλὰ πολλά
  choice: 多くの部分から成っています
  rationale: πολλάはμέληを補う実質名詞的用法。日本語で「多くです」とすると不自然なため、含意される「部分」を補い、体の構成を自然に表現した。
theological_decisions:
- issue: 「体」の比喩的指示対象
  choice: 本文では単に「体」とし、比喩を保持する。
  alternative: 「キリストの体」または「教会」
  rationale: 広い文脈では教会がキリストの体として論じられているが、この節のギリシア語はτὸ σῶμαとのみ述べる。指示対象を本文中で明示せず、原文の比喩表現と文脈依存性を保った。
translation_notes:
  register: 明快で自然な現代標準日本語。「肢体」などの教会用語的で硬い語を避けつつ、身体の比喩と単数・複数の対照を保った。
