  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: ja
  text: ですから、あなたがたにお知らせします。神の霊によって語る人はだれも、「イエスは呪われている」[a]とは言いません。また、聖霊によらなければ、だれも「イエスは主である」[b]と言うことはできません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イエスは呪われよ」。ギリシア語の「アナテマ、イエス」は動詞のない強い表現であり、呪詛としても、呪われた状態の断定としても理解されうる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「主、イエス」。ここでは告白の内容として「イエスは主である」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: ですから
  rationale: 直前の議論を受けた推論・帰結を、現代日本語で自然かつ明確に示す。
- source_word: γνωρίζω ὑμῖν
  choice: あなたがたに知らせておきます
  rationale: 「知らせる」という使役的意味を保ちつつ、この後に重要な事柄を提示する日本語として自然にした。願望を明示する「知ってほしい」は避けた。
- source_word: ἐν πνεύματι θεοῦ
  choice: 神の霊によって
  rationale: ἐνはここで霊による発語の作用・働きを表すと理解し、手段・作用者を自然に示す「によって」とした。
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: イエスは呪われよ
  rationale: 動詞のない強い叫びを、呪詛的な力を保つ表現で訳した。断定の「呪われている」も可能なので注記する。
- source_word: δύναται εἰπεῖν
  choice: 言うことはできません
  rationale: 能力・可能性を表す δύναται を明示し、平明な現代日本語にした。
- source_word: Κύριος Ἰησοῦς
  choice: イエスは主である
  rationale: 発言内容を示す主格句として、補語関係を明示した告白文に訳した。語順をそのまま「主イエス」とすると称号または呼称に読まれやすいため避けた。
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: 聖霊によらなければ
  rationale: 唯一の例外・必要条件を自然な日本語で表し、聖霊の働きによることを保持した。
theological_decisions:
- issue: Κύριος Ἰησοῦς における κύριος の訳
  choice: 主
  alternative: 主人、師
  rationale: パウロの告白的文脈にある称号の通常の意味と高いキリスト論的含意を保ちながら、その含意を本文以上に限定しない。
- issue: 「聖霊によらなければ言うことはできない」が示す範囲
  choice: 本文どおり、イエスを主と告白することを聖霊の働きに結び付ける
  alternative: 単なる音声上の発言に限定する、または回心・再生についての体系的教理まで明示する
  rationale: 告白の真実性を含む文脈上の力を弱めず、同時に本文が明言しない詳細な教理体系を訳文へ持ち込まない。
- issue: Ἀνάθεμα Ἰησοῦς の発話の力
  choice: 呪詛的な願望として「イエスは呪われよ」
  alternative: 状態の断定として「イエスは呪われている」
  rationale: 動詞のないギリシア語は両様のニュアンスを許す。本文では強い呪詛表現を採り、断定的理解を脚注に残して曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い一文を二文に分けて論理を読み取りやすくした。「神の霊」と「聖霊」という原文の表現上の違いを保持した。
