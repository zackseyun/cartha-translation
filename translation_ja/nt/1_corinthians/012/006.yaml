  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: ja
  text: さまざまな働きがありますが、すべての人のうちにすべてのことを働かせておられるのは、同じ神です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「すべてのうちに」。ギリシア語では「人」に当たる名詞は明示されていません。文脈からは、神が働かれる共同体の一人一人を指すと理解することができます。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: さまざまなもの
  rationale: 文脈上、対立や分裂ではなく、同じ源から現れる働きの多様性を表すため、自然な現代日本語で訳した。
- source_word: ἐνεργημάτων
  choice: 働き
  rationale: 神の活動とその現れを指す語として訳し、後半の同根語 ἐνεργῶν との語彙的なつながりを「働き／働かせる」で保った。
- source_word: ὁ δὲ αὐτὸς θεός
  choice: 神は同じ方です
  rationale: δέ の穏やかな対比と、αὐτός が示す同一性の強調を、日本語として自然な述語文で表した。
- source_word: ὁ ἐνεργῶν
  choice: 働かせる
  rationale: 神が能動的に作用を生じさせることを表し、ἐνεργημάτων とのつながりも示した。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: ギリシア語の包括的な表現を保ち、「これらすべて」と文脈上の賜物だけに明示的に限定することを避けた。
- source_word: ἐν πᾶσιν
  choice: すべての人のうちに
  rationale: 名詞は明示されていないが、教会の一人一人のうちに神が働くという文脈上の指示対象を自然な日本語で補った。字義的な形は脚注に残した。
theological_decisions:
- issue: τὰ πάντα ἐν πᾶσιν における神の働きの範囲
  choice: 「すべてのものをすべての人のうちに働かせる」と広さを保って訳す
  alternative: 「これらすべてを、すべての人のうちに働かせる」または「すべてを、すべてのうちに働かせる」
  rationale: 直近の文脈は教会における賜物の現れだが、τὰ πάντα の範囲を訳文で必要以上に狭めず、同時に ἐν πᾶσιν の名詞省略も脚注で明示して、原文の幅と緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「働き／働かせる」により原文の同根語による連結を見える形で残した。
