  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: ja
  text: 賜物にはいろいろな種類がある[a]。しかし、御霊は同じである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「賜物にはさまざまな分配がある」または「賜物には違いがある」。ギリシア語は、教会の分裂ではなく、賜物に見られる多様性を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: さまざまな違い
  rationale: 複数の賜物に見られる区別や多様性を表す。教会内の分裂と誤解されやすい「分裂」は避け、文脈上の正当な多様性を自然な日本語で示した。
- source_word: δὲ ... δὲ
  choice: （前半は無表示）…しかし
  rationale: 最初の δέ は文脈上の展開を担うため日本語ではあえて明示せず、二つ目は賜物の多様性と御霊の同一性との対照を「しかし」で表した。
- source_word: χαρισμάτων
  choice: 賜物
  rationale: 恵みによって与えられる霊的な賜物を指す文脈に合い、現代日本語の聖書語としても簡潔で通じやすい。
- source_word: τὸ ... αὐτὸ
  choice: 同じ
  rationale: 多様な賜物の源である御霊が同一であることを、原文どおり簡潔に示す。
- source_word: πνεῦμα
  choice: 御霊
  rationale: 直前および後続の文脈では神の霊を指す。「御霊」はその指示対象を明確にしつつ、「聖霊」と説明的に言い換えすぎない。
theological_decisions:
- issue: πνεῦμα の指示対象
  choice: 神の御霊
  alternative: 人間の霊、霊的な力または原理
  rationale: 12章3–11節では、賜物を与え分ける主体として同じ御霊が繰り返し語られているため。本文では「御霊」とし、「聖霊」を補って原文以上に展開することは避けた。
- issue: Διαιρέσεις が表す多様性と分裂の関係
  choice: 賜物の種類・現れ方の違い
  alternative: 教会内の分裂
  rationale: この節は多様な賜物と同じ御霊を対照させており、派閥的分裂ではなく、多様性の中の一致を述べている。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「賜物」「御霊」は文脈上必要な聖書語として用い、文を二つに分けて多様性と同一性の対照を読み取りやすくした。
