  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: ja
  text: しかし、目が手に向かって、「私はあなたを必要としない」と言うことはできません。また、頭が足に向かって、「私はあなたがたを必要としない」と言うこともできません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: 言うことはできません
  rationale: 能力・可能性の否定を自然な現代日本語で表し、単なる不適切さではなく「できない」という意味を保つ。
- source_word: δὲ
  choice: しかし
  rationale: 直前の文脈に対する対照を明確にしつつ、現代標準語として自然で品位のある接続表現とした。
- source_word: ὁ ὀφθαλμός / τῇ χειρί / ἡ κεφαλή / τοῖς ποσίν
  choice: 目／手／頭／足
  rationale: 教会の相互依存を示す身体の比喩そのものが論旨を担うため、各身体部位を字義どおりに訳した。
- source_word: Χρείαν σου οὐκ ἔχω
  choice: 私にはあなたは必要ない
  rationale: χρείαの「必要」という名詞的概念を保ち、「用はない」のような原文以上に突き放す響きを避けた。
- source_word: ἢ πάλιν
  choice: また
  rationale: 第二の同様な例を導入する機能を、日本語で簡潔かつ自然に示した。
- source_word: ὑμῶν
  choice: あなたがた
  rationale: 二つの足に向けた複数形であることを日本語本文で明示し、単数の手に対するσουとの違いを保った。
theological_decisions:
- issue: 教会の相互依存を表す身体の比喩
  choice: 身体部位の比喩をそのまま保ち、本文中で教会員への適用を説明しない
  alternative: 「教会の一人一人」などの解釈を本文に補う
  rationale: パウロの神学的主張は身体の比喩を通して提示されているため、翻訳本文ではその比喩を保持し、解説を加えない。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用いた。原文では二つ目の「あなた」に当たるὑμῶνが複数形だが、日本語では「あなたがた」と本文で明示できるため、英語版の補足脚注は不要と判断した。
