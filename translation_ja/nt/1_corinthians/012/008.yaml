id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: ja
  text: というのも、ある人には聖霊を通して知恵の言葉[a]が与えられ、別の人には同じ聖霊に基づいて知識の言葉[b][c]が与えられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「知恵の言葉」は、「知恵を伝える言葉」または「知恵ある発言」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「知識の言葉」は、「知識を伝える言葉」または「知識ある発言」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「同じ聖霊によって」とも訳せます。原文では、前半の「聖霊を通して」とは異なる前置詞が使われており、同じ聖霊に即して、または同じ聖霊に基づいて与えられるという含みがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν
  choice: ある人には
  rationale: 不特定の共同体構成員への分配を表す与格と μὲν の対比を、自然な日本語で示す。
- source_word: διὰ τοῦ πνεύματος
  choice: 御霊を通して
  rationale: 属格を伴う διά の媒介・手段の意味を保ち、後半の κατά と訳し分ける。
- source_word: δίδοται
  choice: 与えられます
  rationale: 現在受動形を保ち、賜物が本人から生じるのではなく授けられることを示す。
- source_word: λόγος σοφίας
  choice: 知恵のことば
  rationale: λόγος の発言・ことば・伝達内容という幅を残しつつ、簡潔で品位ある表現とする。単なる一語に限定されない可能性は脚注で示す。
- source_word: ἄλλῳ δὲ
  choice: 別の人には
  rationale: 前半との分配的な対照を明瞭に表す。
- source_word: λόγος γνώσεως
  choice: 知識のことば
  rationale: λόγος σοφίας と並行する構造を同じ訳語で保ち、属格関係も自然に示す。
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: 同じ御霊に従って
  rationale: 対格を伴う κατά の基準・一致の意味を保ち、前半の「御霊を通して」と同一化しない。
theological_decisions:
- issue: πνεῦμα の指示対象
  choice: 御霊
  alternative: 人間の霊
  rationale: 第一コリント12章の直近の文脈では、さまざまな賜物を分け与える一つの神の霊を指す。「御霊」はこの文脈上の指示対象を自然に示す。
- issue: λόγος の訳し方
  choice: ことば
  alternative: メッセージ／発言
  rationale: 知恵または知識に関わる、表明されたことばという意味の広さを保つ。「ことば」が単独の語を意味するとは限らないことを脚注で補う。
- issue: διά と κατά の区別
  choice: 「通して」と「に従って」を訳し分ける
  alternative: 両方を「によって」と訳す
  rationale: 原文が異なる前置詞を用いる事実と、後半に基準・一致の含みがある可能性を保持し、同じ御霊が共通の源であるという文脈も損なわない。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、聖書本文にふさわしい簡潔さと品位を保った。「御霊」は文脈上の聖霊を示す一般的な聖書語として用いた。μὲν…δὲ の対比は「ある人には…別の人には」で自然に表現した。
