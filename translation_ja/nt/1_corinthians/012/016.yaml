id: 1CO.12.16
reference: 1 Corinthians 12:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: ja
  text: また、耳が「私は目ではないから、体に属していない」と言ったとしても、だからといって、体に属していないわけではありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は目ではないから、体の一部ではない」……「だからといって、体の一部でなくなるわけではありません」。ギリシア語では「体に属する」に当たる同じ表現が繰り返されています。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 直前の足の例に、耳の例を並べて加える接続として、現代日本語で自然な「また」を用いた。
- source_word: ἐὰν εἴπῃ
  choice: 言ったとしても
  rationale: ἐάν＋接続法が示す仮定を表しつつ、後半の反論へ自然につながる譲歩的な日本語にした。
- source_word: τὸ οὖς
  choice: 耳
  rationale: 身体部分を人格化する比喩を、そのまま明瞭に表した。
- source_word: Ὅτι οὐκ εἰμὶ ὀφθαλμός
  choice: 私は目ではないから
  rationale: ὅτιの因果的な働きを「から」で示し、耳が述べる不満の論理を保った。
- source_word: ἐκ τοῦ σώματος
  choice: 体に属していない
  rationale: この文脈のἐκは身体への所属・一員であることを表すため、日本語として自然な「体に属する」とした。前後で同じ表現を反復した。
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: だからといって、体に属していないわけではありません
  rationale: παρὰ τοῦτοによる根拠の否定と、原文の否定を重ねた反論を、意味を解消せず自然な日本語の「だからといって……わけではない」で表した。
theological_decisions:
- issue: キリストの体への所属をどの程度説明的に訳すか
  choice: 「体に属している」という所属表現を用い、原文の反復と論証を保つ
  alternative: 「体の一部ではない」「それで体の一部でなくなるわけではない」
  rationale: 「一部」は比喩の意味を明瞭にする一方、原文のἐκ τοῦ σώματοςを説明的に言い換える。本文では所属という幅を保ち、教会論的説明を付加しない。
translation_notes:
  register: 明瞭で現代的な標準語。身体の比喩にふさわしい平易さを保ちつつ、「言ったとしても」「だからといって……わけではありません」により原文の仮定と反論の構造を自然に再現した。
