id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: ja
  text: もし足が、「私は手ではないから、体の一部ではない」と言ったとしても、そのために体の一部でなくなるわけではありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: もし…言ったとしても
  rationale: ἐάν＋接続法が示す仮定を自然な現代日本語で表し、後半がその主張を否定する譲歩的な論理も明確にした。
- source_word: ὁ πούς
  choice: 足
  rationale: パウロの身体比喩を支える具体的な身体部位をそのまま保った。
- source_word: Ὅτι
  choice: …から
  rationale: 足の発言内容を導入しつつ、『手ではない』ことを理由とする因果関係を自然に示した。
- source_word: χείρ
  choice: 手
  rationale: 足との対比をなす身体部位を字義どおりに訳した。
- source_word: ἐκ τοῦ σώματος
  choice: 体の一部である
  rationale: ここでἐκは身体への所属を表す。日本語の『体からではない』は起源や離脱と誤解されやすいため、『体の一部』として意味を明瞭にし、反復も保った。
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν
  choice: そのために…でなくなるわけではありません
  rationale: 理由を退ける二重否定の力を、自然な日本語の強い否定として再現した。
theological_decisions:
- issue: 身体比喩における所属表現と二重否定の扱い
  choice: 『体の一部』を反復し、『でなくなるわけではありません』と結論する
  alternative: 『体に属していない……だからといって体に属していないことにはならないでしょうか』のように原文の否定と疑問形をより形式的に保つ
  rationale: 教会共同体への所属という比喩を先取りして教理的に説明せず、身体の一部であるという本文上の像だけを明確にした。ギリシア語の修辞疑問は否定を予期するため、日本語では断定的否定のほうが同じ伝達効果を自然に表す。
translation_notes:
  register: 明瞭で現代的な標準日本語。身体比喩の『足』『手』『体』を保持しつつ、原文の硬い二重否定は日本語として自然な否定文に整えた。
