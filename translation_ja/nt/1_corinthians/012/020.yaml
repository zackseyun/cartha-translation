lexical_decisions:
- source_word: νῦν δὲ
  choice: しかし実際には
  rationale: 直前の仮定的な叙述を受け、現在の実情を対照的に示す表現。単なる時間的な「今」ではなく、議論上の「実際には」を表す。
- source_word: πολλὰ ... μέλη
  choice: からだの部分は多くても
  rationale: μέληは、ここでは身体を構成する諸部分を指す。「からだの部分」とすることで、現代の読者にも比喩が明確に伝わり、制度的な意味に誤解されにくい。
- source_word: μὲν ... δὲ
  choice: …は多くても、…は一つ
  rationale: 複数の部分と一つのからだとの対照を、自然な日本語の譲歩・対比構文で表した。
- source_word: ἓν
  choice: 一つ
  rationale: 多くの部分との対照における、からだの一体性を保持する。
- source_word: σῶμα
  choice: からだ
  rationale: パウロが展開する身体の比喩をそのまま保ち、多様性の中の一致を表す。
theological_decisions:
- issue: 身体の比喩における μέλη の訳語
  choice: からだの部分
  alternative: 肢体
  rationale: 「からだの部分」は解剖学的な比喩を明瞭に伝える。「肢体」は伝統的で、共同体の構成員という含みも持ちうるが、現代日本語では硬く感じられるため脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、身体の比喩と簡潔な対照構造を保持した。「体」ではなく「からだ」と表記し、抽象的な組織体よりも身体像が自然に浮かぶようにした。
