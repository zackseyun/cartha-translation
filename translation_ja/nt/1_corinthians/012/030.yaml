  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: ja
  text: 皆が癒やしの賜物[a]を持っているわけではないでしょう？　皆が異言[b]を語るわけではないでしょう？　皆がそれを解き明かすわけではないでしょう？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「癒やしの数々の賜物」。ギリシア語では「賜物」も「癒やし」も複数形。
    reason: lexical_alternative
  - marker: b
    text: 「さまざまな言語」とも訳せる。この文脈では、一般に「異言」と呼ばれる賜物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: 皆が…わけではないでしょう
  rationale: μήで始まる三つの修辞疑問は、いずれも否定の答えを予期している。日本語ではこの形により、疑問の働きと『全員が同じ賜物を持つのではない』という強調を自然に表せる。
- source_word: χαρίσματα ἰαμάτων
  choice: 癒やしの賜物
  rationale: χάρισμαを文脈上自然な『賜物』とし、ἴαμαを『癒やし』とした。原文では両語が複数形であることを脚注で示しつつ、本文は不自然に硬くならない表現とした。
- source_word: γλώσσαις λαλοῦσιν
  choice: 異言を語る
  rationale: コリントの信徒への手紙一12―14章におけるカリスマ的発話を表す、日本語聖書で定着した簡潔な表現。γλῶσσαの基本的な意味が『言語』であることは脚注に残した。
- source_word: διερμηνεύουσιν
  choice: それを解き明かす
  rationale: 直前の異言を聞き手に理解できるように伝える働きを指すため、『翻訳する』に限定せず『解き明かす』とした。目的語はギリシア語では省略されているが、日本語で指示関係を明瞭にするため『それを』を補った。
theological_decisions:
- issue: μήを伴う修辞疑問の性質
  choice: 全員が各々の賜物を持つわけではないことを予期された否定として表す
  alternative: 答えの方向を示さない単純な疑問文にする
  rationale: 原文の統語法は否定の答えを予期しており、一つの体に賜物の多様性があるという文脈上の強調を保つ必要がある。
- issue: 『異言』の解き明かしの性質
  choice: 発話を理解可能にする行為として『解き明かす』とする
  alternative: 特定の自然言語間の『翻訳』に限定する
  rationale: διερμηνεύωはこの文脈で異言を会衆に理解できるようにすることを表すが、その現象の仕組み自体を本文以上に限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、『賜物』『異言』『解き明かす』という文脈上定着した用語を保持した。三文を並行させ、パウロの修辞的な反復を再現した。
