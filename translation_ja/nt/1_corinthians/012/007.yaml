id: 1CO.12.7
reference: 1 Corinthians 12:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: ja
  text: しかし、一人一人には、皆の益となるために、霊の現れが与えられています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「益となるために」または「すべての人の益のために」。
    reason: πρὸς τὸ συμφέρον は、誰にとっての益かを明示せず、一般に「有益なことのために」とも訳せるため。
lexical_decisions:
- source_word: ἑκάστῳ
  choice: 一人一人には
  rationale: 単数与格の配分的な意味を、自然な現代日本語で明確に表す。助詞「には」は、各人にそれぞれ与えられるという焦点を示す。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの多様性と同一の神についての説明を受けつつ、各人への個別的な授与へ視点を移す、穏やかな対照を表す。
- source_word: δίδοται
  choice: 与えられています
  rationale: 現在受動態を保ち、霊の現れが各人の所有物ではなく、与えられるものであることを示す。
- source_word: ἡ φανέρωσις
  choice: 現れ
  rationale: 見える形で明らかになることを表す語として、簡潔で自然な日本語を採用した。「顕現」より一般読者に理解しやすい。
- source_word: τοῦ πνεύματος
  choice: 霊の
  rationale: 直訳に近い表現を保つ。文脈上は聖霊を指すが、原文にない「聖」を本文へ補わず、前後の文脈に同定を委ねる。
- source_word: πρὸς τὸ συμφέρον
  choice: 皆の益となるために
  rationale: 字義的には「益となることのために」。身体と相互の働きを扱う章の文脈に即して共同体的な方向性を自然に表しつつ、より一般的な意味の可能性は脚注に残す。
theological_decisions:
- issue: 「霊」の指示対象
  choice: 文脈上、聖霊を指すものとして理解するが、本文は「霊」とする。
  alternative: 「聖霊の」と明示する、または一般的な霊と解する。
  rationale: 12章4節および8–11節では、賜物を与える同一の霊が繰り返し語られているため、指示対象は聖霊である。ただし、この節のギリシア語には「聖」に当たる語がないため、訳文では補わない。
- issue: συμφέρον の益の範囲
  choice: 共同体の益を前面に出して「皆の益」とする。
  alternative: 個人の益、または対象を限定しない一般的な「益」とする。
  rationale: 語自体は一般に「有益なこと」を意味し得るが、章全体の身体と相互奉仕の文脈は共同体的な益を強く示す。語彙上の広さは脚注で保持する。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、「顕現」「裨益」などの硬い専門語を避けた。全体は公的朗読にも耐える簡潔で品位ある文体とした。
