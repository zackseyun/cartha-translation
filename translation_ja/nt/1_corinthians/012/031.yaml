id: 1CO.12.31
reference: 1 Corinthians 12:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: ja
  text: しかし、より大きな賜物を熱心に求めなさい。[a] そのうえ私は、はるかに優れた道をあなたがたに示します。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、あなたがたは、より大きな賜物を熱心に求めています」。ギリシア語のζηλοῦτεは、この文脈では命令法にも直説法にも取ることができる。
    reason: alternative_reading
  - marker: b
    text: 「はるかに優れた」は、「この上なくまさった」とも訳せる。ギリシア語の表現は、並外れた卓越性を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: 熱心に求めなさい
  rationale: ζηλόωが表す強い願望や熱意を自然な現代日本語で表した。本文では文脈上適切な命令として訳し、直説法の可能性は脚注に残した。
- source_word: χαρίσματα
  choice: 賜物
  rationale: 文脈上、恵みによって与えられる働きや能力を指すため、教会用語として定着しつつ簡潔な「賜物」とした。「霊の」を補わず、原文の簡潔さを保った。
- source_word: μείζονα
  choice: より大きな
  rationale: 比較級の意味をそのまま保ち、何の点で大きいかを訳文で限定しなかった。
- source_word: καὶ ἔτι
  choice: そのうえ
  rationale: 前節までの勧めを受けながら、続く内容へ進み、さらに重要なものを提示する接続とした。
- source_word: καθ’ ὑπερβολὴν
  choice: はるかに優れた
  rationale: 度を越えて卓越するという表現の強さを、過度に直訳調にならない現代日本語で示した。
- source_word: ὁδὸν
  choice: 道
  rationale: 生き方や行動のあり方を指す比喩を保持し、続く愛についての教えへの導入を保った。
- source_word: δείκνυμι
  choice: 示します
  rationale: ギリシア語の現在形を尊重しつつ、直後にその道を提示する予告としても自然に読める丁寧な現在形とした。
theological_decisions:
- issue: ζηλοῦτεの法（命令法か直説法か）
  choice: 命令法として「熱心に求めなさい」
  alternative: 直説法として「あなたがたは熱心に求めています」
  rationale: 語形だけでは命令法と直説法の両方が可能である。本文では勧告が続く文脈に合う命令法を採用したが、解釈上の真正な曖昧さを脚注で明示した。
- issue: 「より大きな賜物」と「はるかに優れた道」の関係
  choice: 賜物の比較と、愛の道の卓越性を区別して表現
  alternative: 「最もすぐれた賜物を求めなさい」として愛を賜物の一つに含める
  rationale: 原文はμείζοναを複数のχαρίσματαに係らせ、その後にὁδόνを別に提示しているため、愛を単に一つの賜物と断定する訳を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「賜物」と「道」という文脈上重要な語を保持し、命令法と直説法の曖昧さは本文で一方を採りつつ脚注で明示した。
