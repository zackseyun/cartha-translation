source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: ja
  text: あなたがたのだれかが、ほかの人に対して訴え事があり、聖なる者たち[b]の前ではなく、不正な者たち[a]の前で裁いてもらおうなどと、あえてするのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不正な者たち」は、「正しくない者たち」とも訳せる。これを「信者でない者たち」と訳す場合もあるが、ギリシア語は道徳的評価を含む語を用いている。
    reason: lexical_alternative
  - marker: b
    text: 「聖なる者たち」とは、神のものとして聖別された民、すなわち信者たちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: 裁いてもらおうとする者がいるのですか
  rationale: 動詞の大胆さ・厚かましさを表す含意は、文全体を強い修辞疑問として訳すことで示した。「あえて」を明示する案も可能だが、現代日本語では硬くなりやすいため、驚きと非難を帯びた問いで機能を再現した。
- source_word: τις ὑμῶν
  choice: あなたがたのうちに…者
  rationale: 不定代名詞と部分属格を自然な日本語で表し、コリント共同体への直接的な問いかけを保持した。
- source_word: πρᾶγμα ἔχων
  choice: 訴え事があるとき
  rationale: πρᾶγμα の広い意味を保ちつつ、裁判の文脈を明確にする。「訴訟」ほど制度的に限定せず、「問題」ほど曖昧にしない表現とした。
- source_word: πρὸς τὸν ἕτερον
  choice: ほかの人に対して
  rationale: 共同体内の別の一人を指す関係・対立を自然に表し、「相手」よりも原文の一般性を保持した。
- source_word: κρίνεσθαι
  choice: 裁いてもらおうとする
  rationale: 受動不定詞の意味を日本語の受益的な受動表現で示し、第三者に事件の裁定を委ねる法廷的意味を伝えた。
- source_word: ἐπὶ τῶν ἀδίκων
  choice: 正しくない者たちの前で
  rationale: ἀδίκων の道徳的・神学的評価語を保ち、「信者でない者たち」と解釈的に置き換えなかった。ἐπί は司法的場面に即して「前で」とした。
- source_word: ἐπὶ τῶν ἁγίων
  choice: 聖なる者たちの前で
  rationale: ἁγίων の基本義とパウロ的用法を保つ。「聖徒」より現代の一般読者に明瞭で、同時に神に属する民という意味を維持する。
theological_decisions:
- issue: ἀδίκων と ἁγίων の対比
  choice: 正しくない者たち…聖なる者たち
  alternative: 信者でない者たち…信者たち
  rationale: 原文は信仰上の所属を直接述べず、評価を帯びた語を対置している。その緊張を解釈で平板化せず保持した。
- issue: ἔχων の代表的男性単数
  choice: 日本語では性別を明示しない「者」構文
  alternative: その人が訴え事を持っているなら
  rationale: 日本語では代名詞の性を補わずとも単数の代表者を自然に表せるため、原文にない性別強調を避けながら個々人への問いを保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、パウロの驚きと非難を帯びた修辞疑問を保った。「正しくない者たち」と「聖なる者たち」の対称性を前面に出すため語順を調整した。脚注記号は関連する対比表現を含む文末に配置した。
