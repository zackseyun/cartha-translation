id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: ja
  text: あなたがたの体はメシアの体の一部なのだと、知らないのですか。それなのに、私はメシアの体の一部を取って、娼婦の体の一部にするのでしょうか。決してそんなことはありません。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語Χριστόςは、「油注がれた者」という称号としても、名前に近い呼び方としても用いられる。
    reason: alternative_reading
  - marker: b
    text: 「決してそんなことはありません」は、「断じていけません」「とんでもありません」とも訳せる。ギリシア語μὴ γένοιτοは、そのような考えや帰結を強く退ける表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: 体
  rationale: 複数形は信者たちの現実の身体を指す。日本語では「あなたがたの体」によって複数性が明らかになるため、不自然な「体々」は避けた。
- source_word: μέλη
  choice: 体の一部
  rationale: 身体を構成する部分という比喩を明確に保つ。「肢体」は教会語としては定着しているが、現代の一般読者には硬く不透明になりやすい。
- source_word: Χριστοῦ
  choice: メシア
  rationale: Χριστόςの称号としての意味を示し、「油注がれた者」という背景を保つ。日本語では無冠詞でも自然である。
- source_word: ἄρας
  choice: 取って
  rationale: 後続のποιήσωと結びつき、想定された行為を「取って、…にする」と自然に表す。分離の意味を過度に明示しない。
- source_word: ποιήσω
  choice: …にする
  rationale: 目的語をある状態・関係へ移すという基本的な使役の力を、自然な日本語で保つ。
- source_word: πόρνης
  choice: 娼婦
  rationale: この文脈では売春をする女性を具体的に指す。「遊女」は古風であり、「不品行な女」は語義を広げすぎる。
- source_word: μὴ γένοιτο
  choice: 決してそんなことがあってはなりません
  rationale: 単なる否定ではなく、想定を強く退ける希求的な表現であることを示す。
- source_word: οὐκ οἴδατε
  choice: 知らないのですか
  rationale: 聞き手が当然知っているはずの事柄に訴える修辞疑問を、明瞭で品位ある現代日本語にした。
theological_decisions:
- issue: μέλη Χριστοῦにおける身体的比喩
  choice: メシアの体の一部
  alternative: メシアの肢体
  rationale: 信者の身体がメシアに属し、その構成部分であるという衝撃的な比喩を保つ一方、「肢体」という専門的な教会語に限定しない。
- issue: Χριστόςの称号性
  choice: メシア
  alternative: キリスト
  rationale: この箇所では信者が属する油注がれた者を指す称号として理解できるため、称号の意味が見える訳を本文に置く。ただし日本語で定着した「キリスト」も可能であることを注記する。
- issue: μὴ γένοιτοの拒絶の強さ
  choice: 決してそんなことがあってはなりません
  alternative: 断じていけません／決してそうではありません
  rationale: 命令というより、忌まわしい帰結が生じることへの強い拒絶である。その希求的な調子と修辞的強度を保った。
translation_notes:
  register: 明瞭で品位ある現代標準語。修辞疑問を保ち、μέληの反復も「体の一部」で再現した。脚注記号は該当する節末にまとめて置いた。
