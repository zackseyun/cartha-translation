  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: ja
  text: 神は主を復活させ、また、その力によって私たちをも復活させます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そして
  rationale: 強い逆接ではなく、前の議論を受けて続ける穏やかな接続として自然に表した。
- source_word: ὁ θεὸς
  choice: 神は
  rationale: 復活を行う主体として明示されている θεός の標準的な訳。
- source_word: τὸν κύριον
  choice: 主を
  rationale: ここではイエスを指す称号であり、κύριος の定訳として「主」を用いた。
- source_word: ἤγειρεν
  choice: 復活させ
  rationale: 神が主を死者の中から起こした過去の出来事を指すため、日本語で復活の意味が明確になるよう訳した。
- source_word: καὶ ἡμᾶς ἐξεγερεῖ
  choice: また……私たちをも復活させてくださいます
  rationale: 未来時制と、主の復活に対応する「私たちをも」という並行関係を保持した。敬語補助動詞は神の行為を自然で品位ある現代日本語にする。
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: その力によって
  rationale: 属格を伴う διά が表す手段を「によって」で明確に示した。「その」は直前の神を受ける。
theological_decisions:
- issue: 未来節が指す復活
  choice: 信者の将来の復活として読める「私たちをも復活させてくださいます」
  alternative: 一般的な神の擁護、または比喩的・霊的に起こすこと
  rationale: 直前から身体が論点となっており、「神は主を復活させ」との並行も、信者の将来の実際の復活を強く示す。本文には説明を加えず、原文の簡潔な対応関係を保った。
translation_notes:
  register: 明瞭で現代的かつ礼拝朗読にも耐える、簡潔で品位ある標準語。「復活させる」を二度用いることでギリシア語の二つの起こす動詞の意味上の並行を可視化しつつ、日本語で不自然な語彙差は設けなかった。
