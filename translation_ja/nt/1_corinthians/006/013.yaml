id: 1CO.6.13
reference: 1 Corinthians 6:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: ja
  text: 食べ物は腹のためにあり、腹は食べ物のためにある。[a][b] しかし神は、腹も食べ物も、いずれも終わらせます。[c] けれども、体は性的な不道徳のためではなく、主のためにあり、主は体のためにおられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くすれば「食べ物の数々は腹のためにあり、腹は食べ物の数々のためにある」。ギリシア語の「食べ物」は複数形です。
    reason: lexical_alternative
  - marker: b
    text: 多くの解釈者は、「食べ物は腹のためにあり、腹は食べ物のためにある」を、パウロが引用してから修正を加えたコリント人の標語と見ています。
    reason: alternative_reading
  - marker: c
    text: 「神は腹も食べ物も滅ぼされる」とも訳せます。この動詞には「廃する」「機能しないものにする」という意味もあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ βρώματα
  choice: 食べ物
  rationale: 原文は複数形だが、日本語では総称として単数・複数を区別しない「食べ物」が自然であり、格言的な表現にも適する。
- source_word: κοιλίᾳ / κοιλία
  choice: 腹
  rationale: ここでは食欲と消化に関わる身体器官を指す。「胃」よりも原語の身体的な広がりを保ちつつ、現代日本語で自然に理解できる。
- source_word: καταργήσει
  choice: 終わらせます
  rationale: 機能を失わせる、廃するという意味を持つ動詞である。物理的な消滅を断定する「滅ぼす」を避け、食べ物と腹の関係が一時的であることを表す。
- source_word: ταύτην καὶ ταῦτα
  choice: 腹も食べ物も、どちらも
  rationale: 女性単数代名詞は「腹」を、中性複数代名詞は「食べ物」を受ける。日本語では指示対象を明示して自然な文にした。
- source_word: τὸ σῶμα
  choice: 体
  rationale: 具体的な身体を指す標準的で明瞭な訳語。ここでの神学的含意を保ち、比喩的に言い換えない。
- source_word: πορνείᾳ
  choice: 淫らな行い
  rationale: 不正な性的行為を広く指す語であり、特定の一形態に限定しない。現代日本語で理解でき、文体の品位も保つ。
- source_word: κυρίῳ / κύριος
  choice: 主
  rationale: ここではイエスを指すパウロ書簡の神学的称号であり、標準的な「主」とした。
- source_word: δὲ
  choice: しかし／けれども
  rationale: 前半では神による終結への転換を、後半では食物と腹の関係と体の目的との強い対照を示すため、文脈に応じて二つの逆接表現を用いた。
theological_decisions:
- issue: 冒頭の句がコリント人の標語の引用か、パウロ自身の陳述か
  choice: 本文には引用であることを示す追加の導入句を置かず、原文どおり直接提示する
  alternative: 引用符だけでなく「あなたがたは言う」などを補い、コリント人の標語と明示する
  rationale: ギリシア語本文自体には引用を明示する標識がない。句読点上の引用符は日本語として読みやすくするが、話者を確定せず、解釈上の余地は脚注に残す。
- issue: καταργήσειが食べ物と腹について示す事柄
  choice: 両者を「終わらせる」とし、将来の廃止・機能停止を表す
  alternative: 「滅ぼす」「廃する」「無力にする」
  rationale: 食物と腹が物理的に完全消滅するという形而上学的主張に限定せず、その一時的な機能と関係が神によって終わるという語義を保つ。
- issue: 「主は体のため」の意味
  choice: 「主は体のためにおられます」と簡潔な相互関係を保つ
  alternative: 「主は体を顧みてくださいます」「主は体の益となります」
  rationale: 原文は前句と平行する簡潔で含蓄のある表現である。配慮、所有、益など一つの意味へ展開せず、神学的な緊張と広がりを残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、格調を保ちながら過度に古風な表現を避けた。冒頭は格言らしい簡潔さを保ち、後半の「体―主」の対応関係は説明的に膨らませず原文の平行性を反映した。
