translation:
  language: ja
  text: ところが、あなたがた自身が不正を行い、だまし取っています。しかも、それを兄弟たち[a]に対して行っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」、または「信仰の仲間たち」とも訳せる。ギリシア語は「兄弟たち」だが、広く同じ信仰を持つ仲間を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ところが
  rationale: 直前の内容との強い対照を示しつつ、現代日本語として自然に論旨を転換する。
- source_word: ὑμεῖς
  choice: あなたがた自身が
  rationale: 明示された代名詞の強調を保ち、問題を起こしているのがほかならぬ読者自身であることを表す。
- source_word: ἀδικεῖτε
  choice: 不正を行い
  rationale: 他者を不当に扱うという広い道徳的・法的意味を保ち、目的語を過度に限定しない。
- source_word: ἀποστερεῖτε
  choice: だまし取っています
  rationale: 人から当然受けるべきものを不正に奪う意味を、訴訟や財産上の争いという文脈に合う明瞭な日本語で表す。
- source_word: καὶ τοῦτο
  choice: それも
  rationale: 行為そのものに加え、その相手が仲間であることの重大さを強調するギリシア語の修辞的力を自然に伝える。
- source_word: ἀδελφούς
  choice: 兄弟たち
  rationale: 原語の男性複数形を本文に保つ。ただし、パウロの用法では信仰共同体の仲間全般を指し得るため、脚注でその範囲を明示する。
theological_decisions:
- issue: 混成の信仰共同体における ἀδελφούς の訳し方
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信仰の仲間たち
  rationale: 原語の形を本文に反映しながら、文脈上は男性だけでなく信者仲間全般を指し得ることを脚注で示し、解釈上の幅を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「ところが」と「それも」によって、パウロの強い対照と非難の力を保った。
