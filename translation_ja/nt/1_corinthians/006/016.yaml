id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: ja
  text: それとも、あなたがたは知らないのですか。娼婦と結びつく者は、彼女と一つの体です。「二人は一つの肉となる」と言われている[a]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼は言う」。引用は創世記2章24節から。
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の議論を受けて修辞的な問いを導く接続語として、自然な日本語で論証の流れを保つ。
- source_word: οὐκ οἴδατε
  choice: あなたがたは知らないのですか
  rationale: パウロに特徴的な修辞疑問を保ち、οἶδαの基本義にも沿う。
- source_word: ὁ κολλώμενος
  choice: 結び合う者
  rationale: κολλάομαιの『結びつく、密着する』という意味を、性的結合の文脈で自然に表す。中動態の関与性も『結び合う』によって示す。
- source_word: τῇ πόρνῃ
  choice: 娼婦と
  rationale: πόρνηの具体的な意味を保つ。冠詞は特定個人ではなく類型的用法と理解し、日本語では無標で訳す。
- source_word: ἓν σῶμά ἐστιν
  choice: 彼女と一つの体になる
  rationale: ギリシア語は直訳すれば『一つの体である』だが、日本語では関係の相手を明示し、文脈上の結果を自然に表した。
- source_word: Ἔσονται γάρ
  choice: となる…からです
  rationale: 未来形とεἰςの組み合わせが示す『～となる』という変化を表し、γάρの根拠提示も保持する。
- source_word: φησίν
  choice: と言われている
  rationale: 原文は字義的には『彼は言う』だが、主語を特定しない引用導入として日本語で自然にした。出典は脚注で示す。
- source_word: οἱ δύο
  choice: 二人
  rationale: 創世記引用の簡潔な表現をそのまま保つ。
- source_word: εἰς σάρκα μίαν
  choice: 一つの肉となる
  rationale: σάρξを『肉』と訳し、創世記2:24との語句上・神学上のつながりを保持する。ここで抽象的な『肉体』や『罪深い性質』にはしない。
theological_decisions:
- issue: 創世記2:24の引用が婚姻外の性的結合に持つ含意
  choice: 娼婦との性的結合にも現実の身体的な『一つの肉』の結合が生じるというパウロの論証を、そのまま訳文に反映する。
  alternative: 引用を婚姻だけに限定して理解する、またはこの節に明記されていない道徳的・婚姻論的結論を訳文へ補う。
  rationale: パウロ自身が創世記2:24を娼婦との結合に適用しているため、その緊張を保つ一方、本文を越える教理的説明は加えない。
- issue: φησίνの主語
  choice: 本文では主語を特定せず『と言われている』とし、脚注で創世記2:24からの引用だと示す。
  alternative: 『神が言われる』『聖書にある』など、ギリシア語本文に明記されていない主語を本文で補う。
  rationale: 原文の曖昧さを保ちつつ、現代日本語として不自然な『彼は言う』を避ける。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。「一つの体」と「一つの肉」の語の違いを保持し、パウロの論証構造が見えるようにした。
