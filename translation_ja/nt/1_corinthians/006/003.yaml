  text: οὐκ οἴδατε ὅτι ἀγγέλους κρινοῦμεν, μήτιγε βιωτικά;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: ja
  text: あなたがたは、私たちが天使たちを裁くことを知らないのですか。まして[a]、日常の事柄はなおさらではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まして、日常の事柄は言うまでもありません」または「日常の事柄については、なおのことです」。
    reason: μήτιγεは、より大きな事柄からより小さな事柄へと論を進める強意表現である。後半では「裁く」に当たる述語が省略されているため、日本語ではその省略を保つ表し方も可能である。
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: 知らないのですか
  rationale: パウロが繰り返し用いる修辞疑問の形を保ちつつ、現代日本語として自然にした。
- source_word: ὅτι
  choice: 〜のを
  rationale: 「知る」の内容を示す節として、日本語で自然につながるよう名詞節化した。
- source_word: ἀγγέλους
  choice: 御使いたち
  rationale: この終末的・司法的文脈では人間の使者ではなく天的存在を指す。「御使い」は聖書文体として明確で、過度に解釈を加えない。
- source_word: κρινοῦμεν
  choice: 私たちが…裁くことになる
  rationale: 未来直説法の将来的意味と、κρίνωの基本的な司法的意味を保った。「治める」などに狭めない。
- source_word: μήτιγε
  choice: それならなおさら
  rationale: より大きな事柄からより小さな事柄へ論を進める強意の修辞を、日本語で明瞭に表した。別の方向から表現できる語用論的幅は脚注に示す。
- source_word: βιωτικά
  choice: この世の生活に関する事柄
  rationale: 地上の日常生活に属する諸事を表す中性複数の実詞的用法を、周辺文脈の争い事に限定しすぎずに訳した。
theological_decisions:
- issue: 信者が「御使いたちを裁く」ことの性質
  choice: 「私たちが御使いたちを裁くことになる」と字義的に保持する
  alternative: 「御使いたちを治める」または「堕落した御使いたちを裁く」
  rationale: 本文は将来の行為を述べるが、その方法、範囲、対象が堕落した御使いだけかどうかを明示しないため、解釈を本文に持ち込まない。
- issue: 省略された後半の述語
  choice: 「裁けるはずではありませんか」を補う
  alternative: 「この世の生活に関する事柄は、なおさらです」
  rationale: ギリシア語では μήτιγε 以下が省略的で、前節の κρινοῦμεν に依存する。日本語で論旨を明確にするため述語を補ったが、裁きの具体的様態は限定していない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「御使い」は一般読者にも通じる聖書語として採用した。後半は原文の省略を自然な疑問文として補い、直前の司法的文脈を明示しつつ、争いの種類や御使いの範囲を限定していない。
