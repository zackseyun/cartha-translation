  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: ja
  text: それなのに、兄弟[b]が兄弟を相手取って訴訟を起こし、しかも不信者たちの前でそうしているのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不信者たちの前で」は、教会外の人々が担当する世俗の法廷を指すと考えられますが、ギリシア語は単に「不信者たちの前で」と述べています。
    reason: lexical_alternative
  - marker: b
    text: 繰り返される「兄弟」は、キリスト者共同体に属する信仰の仲間を指します。
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: それどころか
  rationale: 前節に示されたあるべき姿と現実との強い対照を表し、非難を込めた問いへの移行を自然な日本語で伝える。
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: 兄弟が兄弟を
  rationale: 同じ語の反復と、信仰共同体を家族として語るパウロの表現を保持する。ここでは男性信徒だけに限定せず、キリスト者仲間を代表的に指す。
- source_word: μετὰ
  choice: 相手取って
  rationale: κρίνεταιとの法的文脈では、単なる同伴ではなく訴訟当事者間の対立を示すため。
- source_word: κρίνεται
  choice: 裁判をし
  rationale: この文脈では法廷で争うことを意味する。中・受動態の形式を機械的に写さず、日本語で訴訟行為が明瞭になる表現とした。
- source_word: καὶ τοῦτο
  choice: しかも……している
  rationale: 訴訟そのものに加え、その場が信者でない人々の前であることへの驚きと非難を表す。
- source_word: ἐπὶ ἀπίστων
  choice: 信じていない人々の前で
  rationale: 法廷の裁判官を暗示し得るが、原文は単に「不信者たちの前で」と述べるため、範囲を狭めずに訳した。
theological_decisions:
- issue: ἀδελφόςが教会共同体の成員を代表的に指すこと
  choice: 兄弟
  alternative: 信仰の仲間／兄弟姉妹
  rationale: 原文の男性単数と反復を保ちつつ、文脈上はキリスト者仲間一般を指すことを脚注で明示する。
- issue: ἀπίστωνの指示範囲
  choice: 信じていない人々
  alternative: 信者でない裁判官たち／異教徒たち／教会外の人々
  rationale: 教会と信仰を持たない人々との対照を保ち、「裁判官」と限定するなど原文以上の特定を避ける。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの強い非難を反語的な疑問文で保持した。「兄弟」の反復を残して原文の修辞と共同体的な家族語彙を伝えた。
