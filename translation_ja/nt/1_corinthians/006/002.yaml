reference: 1 Corinthians 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: ja
  text: それとも、聖なる者たちが世を裁くことを、あなたがたは知らないのですか。世があなたがたによって[a]裁かれるのなら、あなたがたは、ごく小さな裁判事項を扱うには[b]ふさわしくないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのうちで」。ギリシア語は字義的には「あなたがたのうちで／あなたがたにおいて」だが、文脈上、聖なる者たちが世の裁きに参与することを指すと理解できる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「最も小さな法廷にふさわしくないのですか」。ギリシア語の語は、裁判事項のほか、法廷・裁判所を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の議論を受けて修辞的な問いを重ねる接続詞として、パウロの鋭い論旨を自然に示す。
- source_word: οὐκ οἴδατε
  choice: 知らないのですか
  rationale: パウロに特徴的な修辞疑問の形を保ちつつ、現代日本語として自然にした。
- source_word: οἱ ἅγιοι
  choice: 聖なる者たち
  rationale: 神のために聖別された信者たちを指す語であり、後代の列聖制度を連想させやすい「聖人たち」を避けた。
- source_word: τὸν κόσμον
  choice: 世
  rationale: 人間世界を含む広い世界を指す文脈に適し、聖書日本語として明瞭で簡潔である。
- source_word: κρινοῦσιν
  choice: 裁く
  rationale: 未来形の終末論的な裁きを示しつつ、その具体的な仕方は限定しない。
- source_word: ἐν ὑμῖν
  choice: あなたがたによって
  rationale: 字義的には「あなたがたのうちで／あなたがたにおいて」だが、文脈上は信者たちが世の裁きに参与する意味を自然に表す。別の読みは脚注に示した。
- source_word: κρίνεται
  choice: 裁かれる
  rationale: 受動態を保ち、条件節における未来志向の意味を日本語では自然な非過去形で表した。
- source_word: ἀνάξιοί ἐστε
  choice: 裁くことさえできないのですか
  rationale: 直訳的な「ふさわしくないのですか」よりも、この司法的文脈での「資格・力量がない」という修辞的非難を明瞭に伝える。
- source_word: κριτηρίων ἐλαχίστων
  choice: ごく小さな争い
  rationale: κριτήριονは裁判所・法廷のほか裁判事項も指し得る。ここでは信者間の訴訟を扱う能力が論点なので、ἐλαχίστωνと合わせて「ごく小さな争い」とした。場所としての読みは脚注に残した。
theological_decisions:
- issue: 「聖なる者たち」の範囲
  choice: 神の民である信者たち一般
  alternative: 特に聖性の高い一部の信者
  rationale: パウロ書簡で οἱ ἅγιοι は通常、特別な少数者ではなく、神に属する信者たちを集合的に指す。
- issue: 聖なる者たちが世を裁くという表現
  choice: 将来の裁きへの実際の参与を述べるが、その方法は特定しない
  alternative: 単なる比喩的な道徳評価、または独立した全面的司法権
  rationale: 本文は参与を明言する一方、その仕組みや権限の範囲までは説明していないため、曖昧さを保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。修辞疑問の鋭さを保ち、「聖人」の制度的含意を避けるため「聖なる者たち」とした。本文中の脚注記号は、対応する曖昧な句の直後に配置した。
