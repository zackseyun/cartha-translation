  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: ja
  text: あなたがたは代価をもって買い取られたのです[a]。だからこそ[b]、自分の体で神をあがめなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「代価によって買われた」。原文は、代価が支払われた購入の比喩を保っている。
    reason: lexical_alternative
  - marker: b
    text: 「だから」とも訳せる。この小辞は、前の理由を受けて命令を促し、強めている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: 買い取られた
  rationale: アオリスト受動形が示す「買う／購入する」という商取引の比喩を保ちつつ、現代日本語として自然にした。
- source_word: γὰρ
  choice: のです
  rationale: 直前の勧告の理由を示す説明的な働きを、日本語の文末表現によって自然に表した。
- source_word: τιμῆς
  choice: 代価をもって
  rationale: 購入のために支払われた代価を表す属格の用法を保ち、誰が支払ったかを訳文で不必要に明示しない表現とした。
- source_word: δοξάσατε
  choice: 神の栄光を現しなさい
  rationale: δοξάζω の命令を、普通の現代日本語で理解しやすく、かつ神学的な重みを保つ表現にした。
- source_word: δὴ
  choice: だからこそ
  rationale: 推論を示すとともに命令を強める小辞の働きを、日本語で自然に表した。
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: 自分の体で
  rationale: 複数の聞き手それぞれの身体を指す単数形を日本語として自然に表し、ἐν が許容する手段的な意味を文脈に即して訳した。
theological_decisions:
- issue: 商取引による贖いの比喩
  choice: 「代価をもって買い取られた」として購入の比喩を保持する
  alternative: 「犠牲を払って贖われた」
  rationale: 原文は市場での購入を表す語を用いているため、その像を保ち、特定の教理的説明を訳文に付加しない。
- issue: 身体を通した倫理
  choice: σῶμαを具体的に「体」と訳す
  alternative: 「自分自身」または「生活」
  rationale: 直近の文脈は身体に関わる性的行為を扱っており、具体的な「体」を維持することでパウロの論旨を保つ。
- issue: 神をあがめる命令
  choice: 「神の栄光を現しなさい」
  alternative: 「神をあがめなさい」
  rationale: いずれも可能だが、δοξάζω と「体で」の結びつきを明瞭にし、身体的行動を通して神の栄光が示されるという含意を自然な日本語で表した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令には威厳のある「なさい」形を採用した。商取引の比喩と身体性を保ちつつ、不自然な直訳調を避けた。
