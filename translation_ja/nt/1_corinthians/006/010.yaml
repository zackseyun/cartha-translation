id: 1CO.6.10
reference: 1 Corinthians 6:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: ja
  text: 盗む者、貪欲な者、酒に酔う者、人をののしる者、人から奪い取る者[a]は、神の国を受け継ぐことがありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人から奪い取る者」は、「ゆすり取る者」「搾取する者」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「受け継ぐ」とは、神の国にあずかることを意味する。
    reason: meaning_clarification
lexical_decisions:
- source_word: κλέπται
  choice: 盗む者
  rationale: 窃盗を特徴とする者を指す複数名詞。現代日本語で明確かつ自然に表した。
- source_word: πλεονέκται
  choice: 貪欲な者
  rationale: より多くを際限なく求める者、とりわけ物質的な強欲を特徴とする者を表す。「貪欲な者」は簡潔で一般にも理解しやすい。
- source_word: μέθυσοι
  choice: 酒におぼれる者
  rationale: 一度酔ったことのある人ではなく、飲酒による酩酊を生活上の特徴とする者を指す。「大酒飲み」よりも人格への侮蔑的響きを抑えつつ、継続的な性質を示す。
- source_word: λοίδοροι
  choice: 人をののしる者
  rationale: 虚偽の中傷だけに限定せず、侮辱的・罵倒的な言葉を浴びせる者を表す。
- source_word: ἅρπαγες
  choice: 人から奪い取る者
  rationale: 力や搾取によって他者のものを貪欲に取り上げる者を広く表す。物理的な強盗だけにも、詐欺だけにも意味を限定しない。
- source_word: βασιλείαν θεοῦ
  choice: 神の国
  rationale: 神の支配とその領域を表す定着した訳語で、パウロの神学的な響きを保つ。
- source_word: κληρονομήσουσιν
  choice: 受け継ぐことがありません
  rationale: 相続人として受け取るという終末論的・法的含意を保つ。「受け継がない」より、文脈上の否定を自然な現代日本語で表した。
theological_decisions:
- issue: 悪徳表の人物類型と御国の相続
  choice: 各名詞を、その行為や性質を特徴とする者として訳し、解釈的な「悔い改めない」を本文に加えない。
  alternative: 個々の一度限りの行為をした者への断定として訳す。
  rationale: 複数の人物名詞から成る悪徳表は、通常、それらの行為を特徴とする類型を指す。ただし原文自体は頻度や悔い改めを明記しないため、その神学的緊張を本文で解消しない。
- issue: κληρονομέωの比喩
  choice: 「神の国を受け継ぐ」として相続の比喩を保持する。
  alternative: 「神の国に入る」または「神の国の分け前を受ける」と説明的に訳す。
  rationale: 原文の相続人・嗣業という含意を保持し、意味の補足は脚注に置く。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、悪徳表の簡潔で厳粛な調子を保った。文脈上、この節は前節から続くため、冒頭の反復接続詞 οὔτε／οὐ は日本語では列挙そのものと文末の否定で自然に表した。すべての脚注記号を本文中に配置した。
