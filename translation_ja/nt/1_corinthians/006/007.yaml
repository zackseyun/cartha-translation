  to: 実際、あなたがたの間に訴訟[b]があること自体、すでにあなたがたにとって、まったくの敗北[a]です。なぜ、むしろ不当な扱いを受けないのですか。なぜ、むしろ奪われないのですか[c]。
  rationale: 「そもそも」は原文の μὲν οὖν の結論的・確認的な働きよりも話題を遡る響きがあるため、「実際」とした。主たる修正は後半の ἀποστερεῖσθε であり、「奪われる」に改めて、原語の受動的で広い損失・剥奪の意味と日本語としての自然さを確保した。脚注は代替となる「だまし取られる」を保持しつつ、本文の意味を狭めないよう調整した。
