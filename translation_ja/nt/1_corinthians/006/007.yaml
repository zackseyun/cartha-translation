  source_fidelity: 本文前半は、ἤδη（「すでに」）、ὅλως（「まったくの」）、ἥττημα（「敗北」）、および κρίματα μεθ’ ἑαυτῶν（共同体内部の「訴訟」）を適切に伝えている。二つの修辞疑問と μᾶλλον の比較的な促しも保持されている。ただし、ἀποστερεῖσθε に対する「だまし取られない」は日本語では人そのものがだまし取られるようにも読め、原語の「奪われる／不当に取り上げられる」という受動的被害の意味を不自然かつ狭くする。
  naturalness: 「なぜ、むしろ不当な扱いを受けないのですか」は聖書文脈の修辞疑問として理解可能である。「なぜ、むしろ奪われないのですか」と並行させれば、簡潔な現代標準日本語を保ちつつ、二つの問いの対照と反復がより明瞭になる。
