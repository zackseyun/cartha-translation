id: 1CO.6.7
reference: 1 Corinthians 6:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: ja
  text: 実際、あなたがたの間に訴訟[b]があること自体、すでにあなたがたにとって、まったくの敗北[a]です。なぜ、むしろ不当な扱いを受けないのですか。なぜ、むしろ奪われないのですか[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「敗北」は「損失」または「失敗」とも訳せる。ギリシア語 ἥττημα は、負けや損失を表す。ここではパウロの強い言い方を生かして「敗北」とした。
    reason: lexical_alternative
  - marker: b
    text: 「訴訟」は「法的な争い」とも訳せる。ギリシア語 κρίματα は、この文脈では法廷に持ち込まれた争いを指す。
    reason: lexical_alternative
  - marker: c
    text: 「奪われる」は「だまし取られる」または「必要なものを取り上げられる」とも訳せる。ギリシア語 ἀποστερεῖσθε は、奪われる、欺きによって失わされる、必要なものを取り上げられる、という意味を持ちうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: すでに
  rationale: 訴訟の結果を待つまでもなく、現時点ですでに敗北が生じているという時間的な含意を保つ。
- source_word: μὲν οὖν
  choice: そもそも
  rationale: 直前の叱責を受けて結論へ進む推論的・強調的な働きを、過度に重い接続表現にせず自然な日本語で示す。
- source_word: ὅλως
  choice: まったくの
  rationale: 共同体内に訴訟がある状況全体への強い評価を表し、ἥττημαを修飾する強意を保持する。
- source_word: ἥττημα
  choice: 敗北
  rationale: 法廷での勝敗にかかわらず、訴訟が存在すること自体を共同体の敗北とするパウロの強い修辞を伝える。
- source_word: ὑμῖν ἐστιν
  choice: あなたがたにとって…です
  rationale: 関係・観点を示す与格を明示し、原文にない「恥」などの評価語は加えない。
- source_word: ὅτι
  choice: …こと自体
  rationale: 敗北の内容・根拠が、彼らの間に訴訟があることだと示す。「自体」は、訴訟の結果ではなく存在そのものが問題だという文脈上の焦点を自然に表す。
- source_word: κρίματα
  choice: 訴訟
  rationale: 信徒同士の争いを法廷に持ち込む文脈に即し、抽象的な「裁き」ではなく具体的な法的案件を指す語を選ぶ。
- source_word: μεθ’ ἑαυτῶν
  choice: あなたがたの間に
  rationale: 共同体内部で互いに争っているという相互的な意味を自然な日本語で示す。
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: なぜ、むしろ…ないのですか
  rationale: 二度繰り返される修辞疑問と、別の道を優先するよう迫る比較の力を保つ。
- source_word: ἀδικεῖσθε
  choice: 不当な扱いを受ける
  rationale: 受動態と倫理的な不正の意味を明確にしつつ、現代日本語として自然にする。
- source_word: ἀποστερεῖσθε
  choice: だまし取られる
  rationale: 財産上または法的な文脈で、他者に欺かれて奪われるという鋭い意味を伝える。ただし「奪われる」という広い意味も脚注に残す。
theological_decisions:
- issue: 共同体内部の訴訟に対するパウロの評価
  choice: ἥττημαを「敗北」とし、訴訟の存在そのものがすでに共同体の敗北であるという評価を示す。
  alternative: 「損失」または「失敗」
  rationale: 原文の強い道徳的・修辞的評価を保ちながら、それを特定の教理上の分類や法廷制度全般への断定に拡張しない。
- issue: 不正を受けることへの修辞的勧告
  choice: 「なぜ、むしろ…受けないのですか」と訳し、パウロが共同体内の訴訟よりも損害を受ける道を提示していることをそのまま表す。
  alternative: 「不当な扱いを受けるほうを選ばないのですか」
  rationale: 「選ぶ」を補うと意志的決断が明示されるが、原文にはその動詞がないため、簡潔な受動表現を維持して解釈の幅を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叱責の強さと二つの修辞疑問の並行性を保持した。「まったくの敗北」は格調を損なわず日常的にも理解しやすい表現である。原文にない「恥」「罪」などの神学的評価語は補っていない。
