reference: 1 Corinthians 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: ja
  text: あなたがたを恥じ入らせるために、私はこう言う。いったい、あなたがたの中には、兄弟の間を裁くことのできる知恵ある者が、一人もいないのか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: あなたがたを恥じ入らせるために
  rationale: πρός＋対格がここでは目的を表すと理解し、パウロの厳しい叱責を保ちつつ、現代日本語として自然に訳した。単に「あなたがたの恥として」より意味が明確である。
- source_word: λέγω
  choice: 私はこう言う
  rationale: 現在形の直接的な発言を簡潔に表し、「こう」によって直前の目的句と後続の問いを自然につないだ。
- source_word: οὕτως
  choice: いったい
  rationale: 直訳的な「このように」ではなく、文脈上の憤りを帯びた修辞疑問の力を日本語で表した。
- source_word: οὐκ ἔνι ἐν ὑμῖν
  choice: あなたがたの中には……一人もいないのか
  rationale: 共同体内部に該当者が存在しないのかという問いを、否定の強調を保って自然な日本語にした。
- source_word: οὐδεὶς σοφὸς
  choice: 知恵ある者が、一人も
  rationale: σοφόςの性質を「知恵ある者」と表し、οὐδείςの全否定を「一人も」で明示した。日本語の「者」は性別を不必要に限定せず、混合共同体への呼びかけにも適合する。
- source_word: ὃς δυνήσεται
  choice: ……ことのできる
  rationale: 将来的能力を含む表現だが、日本語では「できる」が修辞疑問の中で自然に能力を表すため、冗長な「できるようになる」を避けた。
- source_word: διακρῖναι
  choice: 裁く
  rationale: 訴訟・紛争の文脈で、当事者間の判断を下す意味を簡潔に保持した。「仲裁する」より原語の司法的な幅を残す。
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: 兄弟同士の間を
  rationale: 伝承本文は字義的には「彼の兄弟の間を／彼の兄弟との間を」と省略を含む。前後の共同体内紛争という文脈から、第二の当事者を明示的に付加せず、日本語として通じる「兄弟同士の間」とした。
theological_decisions:
- issue: 混合共同体における男性単数形と家族的呼称
  choice: 知恵ある者……兄弟同士
  alternative: 知恵ある人……信者同士
  rationale: οὐδεὶς σοφόςとἀδελφόςの男性形を、日本語で男性だけに限定する必要はない。「者」は代表的単数の働きを保ち、「兄弟」は信仰共同体の家族的比喩を保持する。中立化した「信者」は意味を説明する一方、原文の比喩を失うため本文では採らない。
- issue: 「間を」の第二当事者が原文で省略されていること
  choice: 兄弟同士の間を
  alternative: 自分の兄弟との間を／兄弟と別の者との間を
  rationale: 原文の省略を過度に補わず、共同体内の当事者間という意味を自然に示す。「別の者」を加えると原文にない要素を明示しすぎる。
translation_notes:
  register: 明瞭で現代的ながら、使徒の叱責の厳しさを失わない格調ある文体とした。「恥じ入らせる」「裁く」により目的と法的文脈を明示し、修辞疑問は「いったい……一人もいないのか」で再現した。
