source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: ja
  text: それとも、不正な者たちが神の国を受け継がないことを、あなたがたは知らないのですか。惑わされてはいけません。性的に不品行な者たちも、偶像を礼拝する者たちも、姦淫をする者たちも、軟弱な男たち[a]も、男と寝る男たち[b]も、神の国を受け継ぐことはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軟弱な男たち」に当たるギリシア語は、直訳すれば「柔らかな者たち」。軟弱さ、女性的と見なされた振る舞い、道徳的な弱さを指すことがあり、この文脈では男娼、または男性間の性行為で受動側となる者を指す可能性もある。
    reason: lexical_alternative
  - marker: b
    text: 「男と寝る男たち」に当たるギリシア語は稀な語で、意味について議論がある。「男性と性行為をする男たち」や「男性との不当な性行為を行う者たち」などとも訳せる。ギリシア語訳レビ記の「男」と「寝る」という語句との関連を指摘する見方が多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: それとも
  rationale: 直前の議論を受けて鋭く問い返す接続を自然な日本語で保つ。
- source_word: οὐκ οἴδατε
  choice: 知らないのですか
  rationale: パウロに特徴的な修辞疑問を、原語に沿いつつ現代日本語として自然に表す。
- source_word: ἄδικοι
  choice: 正しくない者たち
  rationale: 単なる個々の加害行為に狭めず、倫理的に正しくない者という広い範囲を保つ。
- source_word: θεοῦ βασιλείαν
  choice: 神の国
  rationale: 聖書的な定型表現として明瞭であり、属格構文を自然に伝える。
- source_word: κληρονομήσουσιν
  choice: 受け継ぐことはありません
  rationale: 相続および終末論的含意を持つκληρονομέωを「受け継ぐ」で保持する。
- source_word: μὴ πλανᾶσθε
  choice: 惑わされてはいけません
  rationale: 受動形の警告を保ち、自他いずれによる誤りも排除しない。
- source_word: πόρνοι
  choice: 淫らな者
  rationale: 性的な不品行を広く指す語として、古風すぎず簡潔な表現を選ぶ。
- source_word: εἰδωλολάτραι
  choice: 偶像を礼拝する者
  rationale: 「偶像礼拝者」よりも一般読者に直ちに意味が伝わる表現とする。
- source_word: μοιχοὶ
  choice: 姦淫する者
  rationale: 婚姻関係を侵す性的行為という語の限定を保持する。
- source_word: μαλακοὶ
  choice: 柔弱な男たち[a]
  rationale: 字義的な「柔らかな者たち」に近い表現を本文に置き、文脈上想定される性的意味を断定せず脚注に示す。
- source_word: ἀρσενοκοῖται
  choice: 男と寝る男たち[b]
  rationale: 「男」と「寝床」を組み合わせた稀語の構成と、七十人訳レビ記との関連をうかがわせる記述的表現を採り、近代的な性的アイデンティティー概念を持ち込まない。
theological_decisions:
- issue: μαλακοὶとἀρσενοκοῖταιの解釈が争われていること
  choice: 本文では「柔弱な男たち」と「男と寝る男たち」を別々に訳し、語義上の不確かさを脚注に明記する。
  alternative: 両語を一組とみなし、「男性間の性行為で受動側となる者」と「能動側となる者」と訳す。
  rationale: 両語が男性間の性行為の二者を指すという解釈は有力だが、μαλακοίの意味範囲はより広く、ἀρσενοκοῖταιも稀語である。本文で役割分担まで断定せず、真正な語義上・神学上の緊張を残す。
- issue: ἄδικοιを行為者として訳すか、倫理的カテゴリーとして訳すか
  choice: 「正しくない者たち」
  alternative: 「不正を行う者たち」
  rationale: 原語は個別の行為だけでなく、人の倫理的状態・性質を表し得るため、その広さを保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の厳しさと終末論的警告の重みを保った。節後半は日本語として文を完結させるため「神の国を受け継ぐことはありません」を補って反復した。論争のある性倫理用語には現代のアイデンティティー分類を直接当てはめず、本文は比較的形式的に、脚注は説明的にした。
