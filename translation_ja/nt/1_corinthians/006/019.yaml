id: 1CO.6.19
reference: 1 Corinthians 6:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: ja
  text: それとも、あなたがたの体は、あなたがたの内におられる聖霊[a]の神殿であり、その聖霊を神から受けていることを、知らないのですか。あなたがたは自分自身のものではありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの内にある聖霊」。
    reason: 聖霊を修飾するἐν ὑμῖνは、日本語では人格的な「おられる」を明示しない形でも表現できるため。
  - marker: b
    text: ギリシア語では、「あなたがたの」は複数形ですが、「体」は単数形です。各人の体を指すとも、代表的・集合的に一つの体を指すとも理解できます。
    reason: 原文の数の組み合わせが持つ解釈上の幅を示すため。
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の議論を受けた鋭い修辞的な問いへの移行を保つ。
- source_word: οὐκ οἴδατε
  choice: 知らないのですか
  rationale: パウロに特徴的な修辞的定型を、現代日本語として自然に表した。
- source_word: τὸ σῶμα ὑμῶν
  choice: あなたがたの体
  rationale: σῶμα の身体という基本義を保ち、単数名詞と複数の所有者という原文の形を不必要に『一人一人の体』へ限定しない。
- source_word: ναὸς
  choice: 神殿
  rationale: 神聖な内殿・聖所を指す語の力を、一般読者にも明瞭な語で保つ。
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: あなたがたの内におられる聖霊の
  rationale: 属格が『神殿』を修飾する関係と、ἐν ὑμῖν の内住の意味を自然な日本語で示す。
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: その聖霊を神から受けている
  rationale: 関係代名詞の指示対象が聖霊であることを明示しつつ、ἔχετε の現在的な状態と ἀπὸ θεοῦ の起源を表す。
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: あなたがたは自分自身のものではありません
  rationale: 自分自身に属してはいないという再帰代名詞属格の簡潔な意味を保つ。
theological_decisions:
- issue: 関係代名詞 οὗ の指示対象と聖霊の人格的表現
  choice: οὗ は聖霊を指すものとして、『その聖霊を』と受ける。さらに『おられる』を用いる。
  alternative: 非人格的に『あなたがたの内にある聖霊』と表現する。
  rationale: 文法上の先行詞は ἁγίου πνεύματός である。日本語では関係代名詞がないため指示対象を反復し、原文の関係を明瞭にした。
- issue: 単数の『体』と複数の聞き手
  choice: 『あなたがたの体』として単数・複数の緊張を保つ。
  alternative: 『あなたがた一人一人の体』または『あなたがたの体々』とする。
  rationale: 原文は τὸ σῶμα が単数、ὑμῶν が複数であり、各人に配分して理解する可能性と代表的・集合的に理解する可能性を訳文で一方に限定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。修辞的な問いは『それとも……知らないのですか』で保ち、聖霊については自然で敬意ある人格表現を用いた。
