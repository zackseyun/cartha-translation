id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: ja
  text: この世の生活にかかわる裁判の場があるなら[a]、教会で軽んじられている人たち[b]を、裁く者として座に着かせるのですか。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「この世の生活にかかわる裁判所（または裁判案件）を持つなら」。日常の地上生活や民事上の事柄を指します。
    reason: lexical_alternative
  - marker: b
    text: 「教会でさげすまれている人たち」とも訳せます。教会内で取るに足りないと見なされる人々を指すとも、教会から見て立場のない外部の人々を指すとも理解できます。
    reason: alternative_reading
  - marker: c
    text: この節を皮肉を込めた命令として、「そのような人たちを裁く者として座に着かせなさい」と理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: この世の生活にかかわる事柄
  rationale: 日常の地上生活、とりわけ民事上・現世上の事柄を指す。「世俗的」のような道徳的含意を避け、意味領域を自然な現代日本語で示した。
- source_word: κριτήρια
  choice: 裁く場合
  rationale: この語は法廷・裁判、また裁判に付される案件を表し得る。ここでは動詞的に訳し、共同体内の紛争を裁定する場面を明確にした。
- source_word: ἐὰν ἔχητε
  choice: 場合
  rationale: 条件構文を日本語の「場合」で簡潔に表した。
- source_word: τοὺς ἐξουθενημένους
  choice: 軽んじられている人たち
  rationale: 「無価値な者として扱われる、侮られる」という受動的な意味を保つ。誰が誰を軽んじるのかは本文で限定せず、原文の解釈上の幅を残した。
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: 教会で
  rationale: 教会共同体の中での位置づけとも、教会から見た評価とも取れる簡潔な表現を選んだ。
- source_word: τούτους καθίζετε
  choice: 裁判官の席に着かせるのですか
  rationale: καθίζω の「座らせる」という像を残しつつ、司法的文脈から裁判官として座らせる意味を明示した。疑問形はSBLGNTの句読法と文脈上の叱責に従う。
theological_decisions:
- issue: 文を修辞疑問と命令のどちらに取るか
  choice: 「裁判官の席に着かせるのですか」と修辞疑問で訳す
  alternative: 「そのような人たちを裁判官の席に着かせなさい」という皮肉な命令として訳す
  rationale: ギリシア語の統語には両解釈の余地があるが、SBLGNTの疑問符と6章1―6節の叱責の流れに従って本文は疑問形とした。別解は脚注で明記した。
- issue: 「軽んじられている人たち」の正体
  choice: 本文では教会内の取るに足りないと見なされる人か、教会から見て立場のない外部者かを限定しない
  alternative: 教会外の世俗の裁判官、または教会内で身分の低い人々のいずれかに特定する
  rationale: ἐν τῇ ἐκκλησίᾳ の係り方と評価主体には曖昧さがあるため、特定の解釈や教派的理解を本文に持ち込まず、脚注で選択肢を示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。法的文脈を明確にしながら、「席に着かせる」という原文の具体的な比喩を保持した。解釈の難しい疑問形／命令形、および人物の同定は本文で過度に確定せず脚注で示した。
