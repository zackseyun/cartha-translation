reference: 1 Corinthians 6:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: ja
  text: 性的不品行から逃げなさい。人が犯すどの罪も体の外にあります[a]。しかし、性的不品行をする人は、自分自身の体に対して罪を犯すのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「体の外にある」が何を意味するかについては解釈が分かれる。本文は原文の表現をそのまま訳している。原文には「ほかの罪」という語はない。
    reason: この句の難しさと、「ほかの」を補わない原文の表現を示しつつ、本文の断言を特定の解釈によって限定しないため。
lexical_decisions:
- source_word: φεύγετε
  choice: 逃げなさい
  rationale: 現在命令形の切迫した継続的回避の命令を、簡潔で自然な現代日本語で表す。
- source_word: πορνείαν / πορνεύων
  choice: 性的不品行／性的不品行を行う人
  rationale: 不正な性的行為を広く指す語であり、「姦淫」や「淫行」より範囲を狭めず、現代の読者にも明瞭である。同じ語根の対応も保った。
- source_word: πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: 人が犯すどの罪も
  rationale: ἄνθρωποςの代表的・一般的意味を自然な日本語の「人」で示し、ἐὰνを伴う包括的な関係節を「どの罪も」で表した。
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: 体の外にあります
  rationale: 直訳的な空間表現を保ち、後半の「自分自身の体に対して」との対照を明確にした。
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: 自分自身の体に対して罪を犯す
  rationale: εἰςの方向性を日本語として自然な「に対して」で表し、ἴδιονの強調を「自分自身の」によって保持した。
theological_decisions:
- issue: 「どの罪も体の外にある」という難解な断言
  choice: 本文の断言をそのまま訳し、意味を限定しない
  alternative: コリントの人々の標語として引用符に入れる、または「ほかの罪」と補う
  rationale: ギリシア語本文には引用符も「ほかの」に当たる語もないため、議論のある神学的緊張を訳文で解消しない。
- issue: ἄνθρωποςの一般的用法
  choice: 人
  alternative: 男
  rationale: ここでは性別を特定するのでなく、人間一般を代表的に指す。現代日本語の「人」が原文の一般的意味を正確かつ自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語。命令の強さとパウロの対照構造を保ち、古風な「淫行」は避けた。
