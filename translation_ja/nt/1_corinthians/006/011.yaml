reference: 1 Corinthians 6:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: ja
  text: あなたがたの中にも、以前はそのような人たちがいました。しかし、あなたがたは主イエスの名において、また私たちの神の霊によって、洗われ[a]、聖なる者とされ、義と認められました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「洗われ」は、「自らを洗った」と訳すこともできます。ギリシア語は中動態ですが、続く「聖なる者とされ」「義と認められた」と同じく、神の救いの働きを表すと理解されることがあります。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: あなたがたの中にも、以前はそのような人たちがいました
  rationale: 直前の悪徳表に挙げられた種類の人々を指す。ταῦτα の指示性と過去の状態を、自然な現代日本語で表した。
- source_word: ἀπελούσασθε
  choice: あなたがたは自らを洗い
  rationale: 中動態の形を反映して再帰的に訳した。ただし、後続する二つの神的受動態との連なりから受動的に理解する余地を脚注に残した。
- source_word: ἡγιάσθητε
  choice: 聖なる者とされ
  rationale: 神的受動態を保ちつつ、「聖別された」より一般読者に明瞭な表現とした。
- source_word: ἐδικαιώθητε
  choice: 義と認められた
  rationale: δικαιόω の法廷的・宣言的な含意を、現代日本語として分かりやすく示した。
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの名において
  rationale: ἐν の手段・領域・権威に関する幅を狭めず、定着した自然な表現を用いた。
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: 私たちの神の霊によって
  rationale: ここでは一連の救いの働きにおける霊の作用を示す手段・行為主体の用法と判断した。日本語では固有名詞的な大文字小文字の区別がないため、原文どおり「神の霊」とした。
theological_decisions:
- issue: ἀπελούσασθε の態と行為主体
  choice: 中動態を「自らを洗い」と訳す
  alternative: 「洗われ」と受動的に訳す
  rationale: 語形の中動態を本文で可視化した。一方、続く「聖なる者とされ」「義と認められた」と並ぶ神の救済行為として受動的に理解する解釈も有力なので、脚注で保持した。
- issue: πνεύματι の指示対象と ἐν の用法
  choice: 「私たちの神の霊によって」とし、神の霊による働きを示す
  alternative: 「私たちの神の霊において」とし、領域的な意味を前面に出す
  rationale: 「私たちの神の霊」は文脈上、聖霊を指すのが自然であり、ἐν はここでは手段・行為主体を表す可能性が高い。ただし「において」という領域的理解も文法上可能である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しかし」を一度置き、原文で三度反復される ἀλλά の強い転換は、日本語では三つの述語を並列してリズムを保った。原文の語順に従い、最後の二つの ἐν 句を独立文として後置して強調した。
