  naturalness: 現行の末尾の「主イエスの名において、また、私たちの神の霊によってです。」は、何に係るかが文法的に宙に浮き、明瞭な現代標準日本語として不自然です。前置して三つの救済的述語に結び付けるよう改めます。
  terminology: 「主イエス」「神の霊」「聖なる者とされ」「義と認められた」は、本文の用語と文脈に適合しています。「義と認められた」は δικαιόω の宣言的・法廷的含意を自然に表します。
