  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: ja
  text: しかし、主に結びつく人は、主と一つの霊です。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主と結ばれる人」とも訳せます。ギリシア語の動詞は、自ら結びつくという意味にも、結ばれるという意味にも理解できます。
    reason: lexical_alternative
  - marker: b
    text: 「霊」を「御霊」と解する見方もありますが、ここでは、信者が主と霊において一つに結ばれることを指すと理解しています。
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος
  choice: 結び合わされる
  rationale: κολλάομαιは密接に付くこと、結ばれることを表す。直前の性的結合との対比を保ちつつ、受動的にも中動的にも理解できるギリシア語の含みを、日本語では自然な受身形で表した。
- source_word: τῷ κυρίῳ
  choice: 主と
  rationale: 与格はここで結合の相手を示す。κύριοςはパウロの用法に従い、復活したイエスを指す称号として「主」とした。
- source_word: ἓν πνεῦμα
  choice: 一つの霊
  rationale: ἓνは強い一致を表す「一つ」、πνεῦμαはこの文脈では信者と主との霊的結合を表すものとして「霊」とした。
- source_word: ὁ δὲ ... ἐστιν
  choice: しかし、…人は、…なります
  rationale: 冠詞付き分詞を一般的・代表的な「…人」と訳し、δέによる前節との対比を「しかし」で示した。ἐστινは日本語の述語として自然な「なります」とした。
theological_decisions:
- issue: 「一つの霊」が表す結合の性質
  choice: 信者と主との強く現実的な霊的結合を表しつつ、両者の区別は保つ。
  alternative: 存在論的な融合、または単なる思いや目的の一致と解する。
  rationale: 16節の「一つの体」と対応する強い結合表現であるが、信者と主が同一存在になるとは述べていない。「主と一つの霊」として関係的な一致を明示した。
- issue: πνεῦμαを「霊」とするか「御霊」とするか
  choice: 「霊」
  alternative: 「御霊」
  rationale: ギリシア語表記自体には大文字・小文字による区別がなく、ここでは信者が主と「一つの霊」になるという読みが文脈上もっとも自然である。ただし聖霊への言及と見る解釈の余地は注で示した。
- issue: ギリシア語に明示されない関係相手の扱い
  choice: 述語に「主と」を補って「主と一つの霊」とする。
  alternative: 「一つの霊になります」とだけ訳す。
  rationale: 原文では結合の相手が前半の「主」によって明らかだが、日本語では述語にも示すほうが関係が自然かつ明瞭になる。
translation_notes:
  register: 現代の一般読者に明瞭でありながら礼拝・朗読にも耐える、簡潔で品位ある文体。「結び合わされる」により結合の強さと原文の中動・受動の幅をできるだけ保った。
