source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: ja
  text: 「すべてのことが私には許されている。」[a]しかし、すべてのことが益となるわけではありません。[b]「すべてのことが私には許されている。」しかし私は、何ものにも支配されません。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引用符を付けず、「すべてのことが私には許されている。しかし……」とも訳せます。多くの解釈では、この句はパウロが引用して限定を加えたコリント人の標語と考えられています。
    reason: alternative_reading
  - marker: b
    text: 「益となる」は、「役に立つ」または「有益である」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「何ものにも支配されません」は、「何ものの力の下にも置かれません」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: 私には何をすることも許されている
  rationale: 直訳的な「すべてのことが私には許されている」より自然な現代日本語としつつ、πάνταの包括性と、繰り返される標語的な調子を保った。「合法である」より「許されている」が、この文脈での権利・自由の主張を明瞭に伝える。
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: しかし、すべてが益になるわけではありません
  rationale: συμφέρειの「有益である、役に立つ」という評価的意味を「益になる」で表した。「すべてが……わけではない」により、部分否定を自然かつ正確に示す。
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: しかし私は、何ものにも支配されません
  rationale: ἐξουσιασθήσομαιは権力の下に置かれる、制御されるという未来受動形。日本語では意志的な未来を含む「支配されません」とし、明示されたἐγώの対照的強調を「私は」で保った。
- source_word: ὑπό τινος
  choice: 何ものにも
  rationale: τινοςは人にも物にもなり得る不定表現だが、直近の行為や欲求を含む広い原則として、中立的で包括的な「何ものにも」とした。
theological_decisions:
- issue: Πάντα μοι ἔξεστινをコリント人の標語として引用符で示すか
  choice: 反復される句を引用符に入れ、標語として示す
  alternative: 引用符を付けず、パウロ自身の主張を後続句で限定したものとして訳す
  rationale: 多くはパウロがコリント人の標語を引用して修正していると理解するが、ギリシア語本文自体に引用符はなく、パウロ自身の言葉である可能性も残る。本文では修辞の流れを明確にするため引用符を用い、脚注で真正な解釈上の曖昧さを保持した。
- issue: ἐξουσιασθήσομαιの未来形のニュアンス
  choice: 「支配されません」と訳し、決意・拒否の含みを持たせる
  alternative: 「支配されることにはならない」と、予測的未来として訳す
  rationale: 文脈と明示的なἐγώは、単なる将来予測よりもパウロの強い拒否・決意を示すと考えられる。ただし日本語では過度に補わず、簡潔な否定形にとどめた。
translation_notes:
  register: 明瞭で現代的ながら、格調を保つ標準的な「です・ます」調。引用句は標語らしい簡潔さを優先し、パウロの応答との対照を明確にした。「何もの」はやや格調ある表現だが、人・物・欲望などを包括し、節の警句的な響きにも適する。
