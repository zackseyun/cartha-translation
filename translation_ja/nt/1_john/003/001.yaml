  to: 父が私たちにどのような愛を与えてくださったか、見てください[a]。私たちが神の子どもと呼ばれるためです。実際、私たちは神の子どもなのです[b]。このため、世は私たちを知りません[c]。世がその方を知らなかったからです[d]。
