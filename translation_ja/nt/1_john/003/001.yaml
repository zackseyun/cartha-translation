id: 1JN.3.1
reference: 1 John 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: ja
  text: 父が私たちにどのような愛を与えてくださったか、見てください[a]。私たちが神の子どもと呼ばれるためです。実際、私たちは神の子どもなのです[b]。このため、世は私たちを知りません[c]。世がその方を知らなかったからです[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どれほど大きな愛」とも訳せますが、ギリシア語は特に、その愛が「どのようなものか」という性質への驚きを表します。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本には「そして、私たちはそうである」に当たる語句がありません。
    reason: textual_variant
  - marker: c
    text: 「世は私たちを認めません」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: ギリシア語では「彼を」です。この節では父を指すのが最も自然ですが、ヨハネ文書の文脈からキリストを指すと理解する人もいます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: 見てください
  rationale: 複数への注意喚起を表す命令。古風な「見よ」を避け、現代の読者に自然でありながら、驚きをもって注目するよう促す力を保った。
- source_word: ποταπὴν ἀγάπην
  choice: どのような愛
  rationale: 愛の大きさだけでなく、その種類・性質への驚きを表すため、「どれほど大きな愛」と限定せず質的な問いを保った。
- source_word: δέδωκεν
  choice: 与えてくださった
  rationale: 完了形が示す、与えられた愛の現在に及ぶ結果を文脈上保つ。「くださった」は父から受けた恵みへの自然な敬意を示す。
- source_word: τέκνα θεοῦ
  choice: 神の子ども
  rationale: τέκναは性別を限定しないため「子ども」とし、「息子たち」などの過剰な特定を避けた。
- source_word: κληθῶμεν
  choice: 呼ばれる
  rationale: ἵνα節の目的・結果を自然な日本語で表し、単なる不確実な可能性とはしなかった。
- source_word: καὶ ἐσμέν
  choice: そして、私たちは実際に神の子どもなのです
  rationale: 単にそう呼ばれるだけでなく、現にそうであるとの強い肯定を、日本語で明瞭に伝えた。補った「神の子ども」は省略された補語を文脈から明示するもの。
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の事実を受ける理由・帰結のつながりを簡潔に示す。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書で神に背く人間世界を指し得るが、本文では解釈を狭めず、伝統的かつ自然な「世」を保持した。
- source_word: οὐ γινώσκει ἡμᾶς
  choice: 私たちを知りません
  rationale: γινώσκωの基本的な意味を保ち、後続の「知らなかった」との語の対応を明確にした。「認めない／見分けない」という可能なニュアンスは脚注に示した。
- source_word: οὐκ ἔγνω αὐτόν
  choice: 父を知らなかった
  rationale: 日本語では代名詞「彼」が不自然かつ指示対象を不透明にしやすいため、直近の明示的先行詞である「父」を本文に置いた。ただしキリストを指す理解も脚注に残した。
theological_decisions:
- issue: αὐτόνの指示対象
  choice: 本文では「父」
  alternative: キリストを指す
  rationale: この節で直近に明示された男性単数の先行詞は「父」であり、目下の統語と論理では父を指すのが最も自然である。一方、ヨハネ文書全体の文脈からキリストと理解する余地もあるため、脚注で緊張を保持した。
- issue: καὶ ἐσμένの採否
  choice: 本文に含める
  alternative: 一部写本に従って省く
  rationale: 指定されたSBLGNT本文に従い、神の子どもと呼ばれるだけでなく現にそうであるという肯定を訳出した。写本上の異読は脚注に記した。
- issue: ἵνα節の関係
  choice: 「それは……ためです」と目的・結果を表す
  alternative: 「そのため私たちは……と呼ばれます」と結果を前面に出す
  rationale: 父が愛を与えたことと、神の子どもと呼ばれることの目的・結果関係を保ちつつ、目的と結果のいずれか一方に過度に限定しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「見よ」のような古風な命令形を避けた。一方で、父の愛への驚きと「実際にそうである」という荘重な肯定は保った。「神の子供」ではなく、読みやすく柔らかな表記の「神の子ども」を採用した。
