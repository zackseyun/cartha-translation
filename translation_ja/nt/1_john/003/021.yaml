id: 1JN.3.21
reference: 1 John 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: ja
  text: 愛する人たちよ、私たちの心[a]が私たちを責めないなら、私たちは神の御前で確信[b]を持っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「心」は、内なる自己、または自分を道徳的に判断する意識を指します。「良心」に近い意味です。
    reason: cultural_note
  - marker: b
    text: 別訳「大胆さ」または「神の御前での確信をもった態度」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 愛する者たちよ
  rationale: 愛情を込めた複数への呼びかけであり、ヨハネ書簡に繰り返される「愛」の語彙的つながりを保つ。現代日本語でも dignified な呼称として理解できる。
- source_word: ἐὰν
  choice: なら
  rationale: 接続法を伴う条件を、自然な現代日本語の条件表現で示す。
- source_word: ἡ καρδία
  choice: 私たちの心
  rationale: καρδία の比喩を保持し、これを「良心」という狭い機能概念に限定しない。属格代名詞 ἡμῶν は原文の語順上 καταγινώσκῃ と結びつくが、日本語では主語の所有者と目的語がともに「私たち」であることを明示するのが自然である。
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: 私たちを責めない
  rationale: καταγινώσκω の不利な判断、非難、断罪の含みを保ちつつ、内なる心の働きについて自然な日本語にする。「罪に定めない」も可能だが、この文脈では司法的意味に限定されすぎるおそれがある。
- source_word: παρρησίαν
  choice: 確信
  rationale: 神との関係における自由で恐れのない態度を表す。「大胆さ」より対立的に響きにくく、「確信」は文脈に即して明瞭である。
- source_word: πρὸς τὸν θεόν
  choice: 神の御前で
  rationale: πρός が示す神に向かう関係性を、神の臨在における立場として自然かつ敬意ある日本語で表す。
theological_decisions:
- issue: καρδία が指す内面的機能
  choice: 心
  alternative: 良心
  rationale: 自らを責める内的・道徳的意識が機能しているが、原文の身体比喩を保持し、意味を「良心」だけに限定しない。注で機能的意味を説明する。
- issue: 神との関係における παρρησία
  choice: 神の御前で確信を持つ
  alternative: 神に対して大胆である／神の御前で確かな思いを持つ
  rationale: 神への開かれた、恐れのない近づきを表しつつ、無遠慮さや主観的な感情的確実性へ意味を固定しない。
- issue: καταγινώσκω の司法的強さ
  choice: 責める
  alternative: 罪に定める／非難する
  rationale: 内面による否定的判断という意味を明瞭にしながら、神による終末的な断罪と同一視することを避ける。語の強い含みは注で示す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「愛する者たちよ」は書簡の親愛を示す呼びかけとして保ち、「御前」は神への敬意を自然に表す。主節は日本語として完結するよう「持つことができます」とした。
