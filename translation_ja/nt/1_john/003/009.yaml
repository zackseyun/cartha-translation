id: 1JN.3.9
reference: 1 John 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: ja
  text: 神から生まれた者は皆、罪を犯し続けません[a]。神の種がその人のうちにとどまっている[b]からです。その人は罪を犯し続けることができません[c]。神から生まれたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「罪を行いません」または「罪を犯しません」。ここでは、罪を継続的・習慣的に行うことを指すと考えられます。
    reason: lexical_alternative
  - marker: b
    text: または「宿っています」。
    reason: lexical_alternative
  - marker: c
    text: より字義的には「罪を犯すことができません」。文脈上、ギリシア語の現在不定詞は「罪を犯し続ける」という意味を含むと考えられます。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: 神から生まれた者は皆
  rationale: πᾶςと名詞的に用いられた完了分詞による包括的な表現を保ちつつ、ἐκを出生の源を示す「から」とした。完了形が示す、生まれた結果として現在も続く状態は、日本語では文脈上自然に伝わる。
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: 罪を犯し続けません
  rationale: 字義的には「罪を行わない」だが、現在形と後続のἁμαρτάνεινとの並行から、継続的・習慣的な行為を表す可能性が高い。「犯し続けない」は、一度の罪も犯さないという意味に限定せず、継続する罪の実践を明確に表す。
- source_word: σπέρμα αὐτοῦ
  choice: 神の種
  rationale: σπέρμαの具体的な比喩「種」を残した。何を指すかは本文で特定されていないため、「神のことば」「神のいのち」「神の性質」などとは解釈しなかった。αὐτοῦの指示対象が神であることは日本語で明確にした。
- source_word: ἐν αὐτῷ μένει
  choice: その人のうちにとどまっている
  rationale: ヨハネ文書で重要なμένωの持続性を、現代日本語として自然な「とどまっている」で表した。
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: 罪を犯し続けることができません
  rationale: οὐ δύναταιの強い不能表現を保ちながら、現在不定詞ἁμαρτάνεινの継続的な含みを「犯し続ける」で示した。
- source_word: ὅτι ἐκ τοῦ θεοῦ γεγέννηται
  choice: 神から生まれたからです
  rationale: 完了形は神から生まれた結果が続いていることを示す。日本語では同じ表現を反復し、原文の理由づけと強調を保った。
theological_decisions:
- issue: この節が、一切の罪を犯せない絶対的な無罪状態を教えるのか、それとも新生と罪を継続的に行うこととの両立不能を述べるのか
  choice: 本文では、罪を継続的に犯すことが神から生まれた状態と両立しないという読みを示した。
  alternative: 「罪を犯さない」「罪を犯すことができない」と訳し、個々の罪を犯す絶対的不能を表す読み。
  rationale: ποιεῖとἁμαρτάνεινはいずれも現在形であり、文脈上、継続的・習慣的な行為を指す可能性が高い。ただし原文の強い表現を弱めすぎないよう、「できません」は保持し、より字義的な読みを脚注に示した。
- issue: 「神の種」が何を指すか
  choice: 「種」という比喩を本文に残し、指示対象を特定しなかった。
  alternative: 神のことば、神のいのち、神の性質などと明示する。
  rationale: σπέρμαの指示対象は本文自体が説明しておらず、特定の解釈を訳文に持ち込まないため。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語を用いた。原文は一文だが、日本語で論理関係を読み取りやすくするため四文に分けた。「神の種」という比喩と、「できません」という強い神学的緊張は保持した。
