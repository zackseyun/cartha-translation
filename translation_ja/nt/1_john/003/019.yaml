  rationale: 「真理に由来する者」は、ἐκが示す源泉・由来を「真理に属する」とするより直接に保ちつつ、現代日本語としての明瞭さを改善する。「納得させます」は文脈上、心を落ち着かせ確信させる含みを持ち得るが、本文ではその解釈に限定せず、代替を脚注に残す。
