  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: ja
  text: このことによって、私たちは自分たちが真理に由来する者である[a]ことを知り、神の御前で自分たちの心を納得させます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちが真理に属していること」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「自分たちの心を安心させます」。原文では「心」は単数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このことによって
  rationale: 手段または根拠を示す表現として、指示語の働きを保ちながら自然な現代日本語とした。
- source_word: γνωσόμεθα
  choice: 知ります
  rationale: 未来形の意味を文脈に即して表した。「知るようになる」とすることも可能だが、原文が必ずしも要求しない起動的な意味は加えなかった。
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: 真理から出た者である
  rationale: ἐκ が示す源・由来を保ち、ヨハネ文書に見られる「〜から出た」という表現とも調和させた。「真理に属する」は自然だが、所属という解釈をやや強めるため脚注に置いた。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: 神の御前で
  rationale: 直訳的には「彼の前で」だが、文脈上の指示対象を日本語で明確にし、臨在を表す自然で格調ある表現とした。
- source_word: πείσομεν
  choice: 納得させます
  rationale: πείθω の基本的な「説得する、納得させる」という意味を保ちつつ、心を目的語とする日本語として成立させた。文脈上の「安心させる」という理解も可能なので脚注に示した。
- source_word: τὴν καρδίαν ἡμῶν
  choice: 自分たちの心
  rationale: 原文の単数形を保ち、複数の主体に共有的・代表的に用いられる「心」を自然な日本語で表した。
theological_decisions:
- issue: ἐκ τῆς ἀληθείας の神学的含意
  choice: 真理から出た者である
  alternative: 真理に属している
  rationale: 源・由来を表す原文の比喩を残し、「神の民である」などの教理的な言い換えによって意味を限定しなかった。
- issue: πείσομεν と「心」の関係
  choice: 心を納得させます
  alternative: 心を安心させます
  rationale: 内面的な確信や平安を指す可能性を認めつつ、本文では動詞の語彙的な幅を残した。自己正当化や法廷的な意味を付加していない。
- issue: αὐτοῦ の指示対象
  choice: 神
  alternative: その方
  rationale: 直後の文脈で神が明示され、神の臨在の前での確信が論じられているため、日本語では指示対象を明示した。ただし原文自体は代名詞である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「真理」「神の御前」など本文の荘重さとヨハネ文書の語彙を保持した。「納得させる」はやや形式的だが、原語の曖昧さを「安心させる」に限定せず伝えるため採用した。
