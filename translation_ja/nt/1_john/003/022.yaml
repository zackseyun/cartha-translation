id: 1JN.3.22
reference: 1 John 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: ja
  text: また、私たちが願い求めるものは何でも、神から受けます。私たちが神の戒めを守り、神の御前で喜ばれることを行っているからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: ものは何でも
  rationale: 不定関係節の意味「何であれ」を、自然な現代日本語で表した。
- source_word: αἰτῶμεν
  choice: 私たちが願い求める
  rationale: 祈りにおける願いを表す文脈に即し、単なる質問を意味し得る「尋ねる」を避けた。
- source_word: λαμβάνομεν
  choice: 受けます
  rationale: 現在形の一般的な事実を表す用法として、簡潔に訳した。
- source_word: ἀπ’ αὐτοῦ
  choice: 神から
  rationale: ἀπόの源を示す働きを「から」で表した。αὐτοῦが指す神を、日本語で自然かつ明確に示した。
- source_word: ὅτι
  choice: からです
  rationale: 願ったものを受けることと戒めを守ることの間に、原文が明示する理由・原因の関係を保持した。
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: 神の戒め
  rationale: ヨハネ文書で重要なἐντολήの語彙的一貫性を保つため、「命令」ではなく「戒め」とした。
- source_word: τηροῦμεν
  choice: 守り
  rationale: τηρέωの「保つ・守る」という含みを保持し、説明的な「従う」に狭めなかった。
- source_word: τὰ ἀρεστὰ
  choice: 喜ばれること
  rationale: 実体詞的な中性複数を包括的に表し、具体的な行為を原文以上に限定しなかった。
- source_word: ἐνώπιον αὐτοῦ
  choice: 神の御前で
  rationale: 「前で／目の前で」という空間的・評価的な表現を保ちつつ、神についての自然で敬意ある日本語とした。
- source_word: ποιοῦμεν
  choice: 行っている
  rationale: ποιέωの基本義「行う」を保ち、現在形が示す継続的な姿勢を自然な日本語で表した。
theological_decisions:
- issue: 祈りが聞かれることと従順との関係
  choice: 「からです」により、原文の因果関係をそのまま示した。
  alternative: 単なる関連や同時性として弱めて訳す。
  rationale: ὅτιはここで理由を明示する。祈りを機械的な取引として説明することも、因果的な緊張を薄めることもせず、本文の表現を保持した。
- issue: αὐτοῦが指す方
  choice: 文脈上の指示対象を「神」と明示した。
  alternative: 「この方」または代名詞的に「その方」と訳す。
  rationale: 直前の文脈では神が祈りの相手であり、現代日本語では同じ人物を指す代名詞の反復が不自然になりやすいため、指示対象を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「戒め」「御前」など聖書本文にふさわしい品位ある語を残した。原文の因果関係と神学的緊張を説明で解消せず、そのまま提示した。
