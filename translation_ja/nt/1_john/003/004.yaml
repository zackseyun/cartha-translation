reference: 1 John 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: ja
  text: 罪を犯す者は皆、不法をも行います[a]。罪とは不法です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「罪を行う者は皆、不法をも行う」。ギリシア語の現在形は、この文脈では継続的またはその人に特徴的な行為を含意し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: …者は皆、…行います
  rationale: 冠詞付き現在分詞の一般的な指示を「…者は皆」で表し、後続の定動詞との並行も日本語として自然に示した。
- source_word: τὴν ἁμαρτίαν
  choice: 罪を犯す
  rationale: 「罪を行う」より現代日本語で自然な連語であり、ここでのἁμαρτίαを特定の一罪ではなく一般的な罪として表す。
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: 不法をも行います
  rationale: καίを「も」で示し、ποιεῖの行為性を保った。「不法を犯す」ではなく「行う」として、原文で繰り返されるποιέωも可能な範囲で反映した。
- source_word: ἀνομία
  choice: 不法
  rationale: νόμοςとの語彙的関係を保ちつつ、特定の法体系に限定しない簡潔な訳語。「律法違反」や「神の律法に背くこと」として解釈を狭めることを避けた。
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: 罪とは不法です
  rationale: 二つの名詞に冠詞がある定義的な文を、日本語で明確かつ簡潔な「AとはBです」の形にした。原文の鋭い同定を「罪は不法につながる」などと弱めていない。
theological_decisions:
- issue: 現在形のποιῶν／ποιεῖを、一回の行為として訳すか、継続的・特徴的な行為として訳すか
  choice: 本文は日本語の一般的表現「罪を犯す者は皆…行います」とし、現在形が継続的・特徴的行為を表し得ることを脚注で示す
  alternative: 「罪を犯し続ける者は皆」「罪を常習的に犯す者は皆」
  rationale: 文脈上、現在形には継続的または特徴的な行為の含みがあるが、「続ける」「常習的に」を本文に入れるとギリシア語の現在形が必ずその意味を明示するかのように強めるおそれがある。日本語本文の自然さと原文のアスペクト上の余地を両立させた。
- issue: ἀνομίαが指す「法」の範囲
  choice: 不法
  alternative: 律法違反／神の律法に背くこと／悪
  rationale: ヨハネの圧縮された定義をそのまま保ち、モーセ律法、社会法、あるいは一般的悪のいずれかへ説明的に限定しない。
translation_notes:
  register: 明快な現代標準日本語を用い、文末は丁寧体で統一した。「罪を犯す」は自然な日本語としつつ、「不法をも行います」で原文の動詞の反復を一部保持した。「罪とは不法です」は簡潔で格調ある定義文として訳した。
