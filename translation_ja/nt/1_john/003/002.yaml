id: 1JN.3.2
reference: 1 John 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: ja
  text: 愛する皆さん、今、私たちは神の子どもです。そして、私たちがどのような者となるのかは、まだ明らかにされていません。私たちは、キリストが明らかにされるなら[a]、キリストに似た者となることを知っています。ありのままのキリストを見るからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それが明らかにされるなら」とも訳せます。その場合、「それ」は私たちが将来どのような者となるかを指します。ギリシア語では主語が明示されていませんが、文脈はキリストを指す理解を支持します。「キリストが現れる時」と訳すこともあります。
    reason: 暗黙の主語についての別解と、条件表現・受動態をより解釈的に訳す可能性を示すため。
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 愛する者たち
  rationale: 呼びかけとしての温かさと、ἀγαπάω／ἀγάπηとの語彙的なつながりを保つ。現代日本語でも聖書本文にふさわしい、明瞭で dignified な表現。
- source_word: νῦν
  choice: 今
  rationale: 現在の神の子としての身分と、将来まだ明らかにされていない状態との対照を端的に示す。
- source_word: τέκνα θεοῦ
  choice: 神の子ども
  rationale: τέκναの性別を限定しない親子関係を表し、年齢よりも神との関係を示す。
- source_word: οὔπω ἐφανερώθη
  choice: まだ明らかにされていません
  rationale: φανερόωの受動態を保ち、未だ顕示されていないという現在の状態を自然な日本語で表す。
- source_word: τί ἐσόμεθα
  choice: 私たちがどのような者になるのか
  rationale: τίが指す将来の性質・状態を、日本語で誤解なく自然に表す。
- source_word: οἴδαμεν
  choice: 私たちは…知っています
  rationale: 完了形に由来する現在的意味を、通常の日本語の現在表現で示す。
- source_word: ἐὰν φανερωθῇ
  choice: キリストが現されるなら
  rationale: 主語が明示されていないことは脚注で示しつつ、後続のαὐτῷ／αὐτόνとの文脈からキリストを補う。ἐάνの条件的表現と受動態、また前半のἐφανερώθηとの語彙的反復を保つ。
- source_word: ὅμοιοι αὐτῷ
  choice: キリストに似た者
  rationale: ὅμοιοςが同一性ではなく類似・ likeness を表すことを明確にする。日本語では代名詞の連続による指示の曖昧さを避けるため「キリスト」を補う。
- source_word: ὀψόμεθα αὐτὸν
  choice: ありのままのキリストを見る
  rationale: 未来の直接的な見る行為を表す。目的語を「キリスト」と明示して日本語としての明瞭さを確保する。
- source_word: καθώς ἐστιν
  choice: ありのままの
  rationale: 「彼があるとおり」を直訳調にせず、キリストをその真実の姿のまま見るという比較・様態を自然な現代日本語で表す。
theological_decisions:
- issue: ἐὰν φανερωθῇの暗黙の主語
  choice: 本文ではキリストを主語として「キリストが現されるなら」とする。
  alternative: 「それが明らかにされるなら」とし、私たちの将来の状態を主語と取ることも文法上可能。また「キリストが現れる時」とする訳もある。
  rationale: 直後の「キリストに似た者」「キリストを見る」という文脈はキリストを指す理解を強く支持する。ただしギリシア語では主語が明示されていないため、別解を脚注に残す。ἐάνの条件性を「なら」で保持し、「時」と断定しない。
- issue: 信者が将来キリストに似ることの性質
  choice: 「キリストに似た者」とし、真実な類似を表しつつ同一性は示さない。
  alternative: 「キリストと同じようになる」「キリストそのもののようになる」などの強い意訳。
  rationale: ὅμοιοιは類似を意味し、同一の存在・本質になることまでは表さない。本文の力強い変容の約束を弱めず、原文以上の同一性も持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、親しさと荘重さを両立させた。「愛する者たち」は書簡の呼びかけとして簡潔に独立させた。代名詞だけでは日本語で指示対象が不鮮明になりやすいため、後半では「キリスト」を明示した。原文のφανερόωの反復は「明らかにされる／現される」で語根の関連と文脈上の自然さを両立させた。
