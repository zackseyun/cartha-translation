reference: 1 John 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: ja
  text: しかし、この世の財産を持っていながら、兄弟[a]が困っているのを目にし、その兄弟に対して心を閉ざす[b]なら、どうしてその人のうちに神の愛[c]がとどまっているでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」は、ここでは姉妹を含め、同じ信仰に属する人を代表的に指すことがあります。
    reason: lexical_alternative
  - marker: b
    text: 「心を閉ざす」は、直訳すると「その人から自分の内臓を閉ざす」。心からの憐れみを差し控えることを表す慣用表現です。
    reason: lexical_alternative
  - marker: c
    text: 「神の愛」は、神から来てその人のうちにある愛とも、その人の神への愛とも取れます。
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: この世の財産
  rationale: βίοςはここでは抽象的な「命」ではなく、困窮する兄弟を助けるために用いうる生活手段・物質的所有を指す。「この世の財産」は文脈上の意味を明確かつ自然に伝える。
- source_word: θεωρῇ
  choice: 目にし
  rationale: 単に視界に入るだけでなく、困窮の状態を実際に見て認識することを表す。現代日本語として自然な「目にする」を用いた。
- source_word: ἀδελφὸν αὐτοῦ
  choice: 兄弟
  rationale: 原文の男性単数形を保持した。ヨハネ文書では同じ信仰に属する者を代表的に指しうるが、その広がりは脚注で示す。
- source_word: χρείαν ἔχοντα
  choice: 困っている
  rationale: 直訳は「必要を抱えている」。ここでは生活上の不足・困窮を意味するため、平明で自然な表現とした。
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: その兄弟に対して心を閉ざす
  rationale: σπλάγχναは字義的には内臓だが、深い情愛や憐れみを表す慣用句。「心を閉ざす」は、必要を知りながら思いやりを差し控える意図的な拒絶を自然に伝える。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 神の愛
  rationale: 属格の曖昧さを保ち、神から来て人のうちにある愛とも、人が神に向ける愛とも読める表現とした。
- source_word: μένει ἐν αὐτῷ
  choice: その人のうちに…とどまっている
  rationale: μένωはヨハネ文書の重要語で、持続的な内在を表す。「とどまる」はその反復語彙と継続性を保持する。
theological_decisions:
- issue: 「神の愛」（ἡ ἀγάπη τοῦ θεοῦ）の属格の解釈
  choice: 「神の愛」と訳し、方向を確定しない
  alternative: 「神がその人を愛する愛」または「その人の神への愛」
  rationale: ギリシア語は起点を表す属格とも目的を表す属格とも解しうる。神から受ける愛と神を愛することが結びつくヨハネ的緊張を、本文で一方に限定しない。
- issue: ἀδελφὸνの性と指示範囲
  choice: 本文では「兄弟」
  alternative: 「兄弟姉妹」または「信仰の仲間」
  rationale: 男性単数という原文の形を保持しつつ、同じ信仰に属する男女を代表的に指しうることを脚注で補足する。
- issue: 修辞疑問 πῶς…μένει の力
  choice: 「どうして…とどまっているでしょうか」
  alternative: 「…とどまっているはずがあるでしょうか」
  rationale: 強い否定を含意する修辞疑問として自然に訳しながら、原文にない可能・不可能の助動表現を過度に加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。対照を示す「しかし」と、所有しながら拒む矛盾を表す「持っていながら」を用いた。原文の修辞疑問と「とどまる」というヨハネ文書の主要語を保持した。脚注記号は関連箇所に置き、属格の曖昧さに関する[c]は「神の愛」に関わることが分かるよう文末に配置した。
