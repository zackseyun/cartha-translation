id: 1JN.3.10
reference: 1 John 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: ja
  text: 神の子どもたちと悪魔の子どもたちとは、このことによって見分けられます。[a] 正しいことを行わない人は皆、神から出た者ではありません。[b] また、自分の兄弟を愛さない人も、神から出た者ではありません。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この点で」または「このことから」。ギリシア語は、この区別が何によって見分けられるか、その根拠や手がかりを示します。
    reason: lexical_alternative
  - marker: b
    text: 直訳「義を行わない人」。ここでの「義」は、神のみ心にかなう正しい行いを指します。「正義」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「兄弟」は、文脈上、姉妹を含む信仰の仲間を指すことがあります。ギリシア語本文は男性単数形です。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このことによって
  rationale: 何を根拠・手がかりとして区別が明らかになるかを示す表現。文脈を限定しすぎず、手段・根拠の含みを自然な日本語で保つ。
- source_word: φανερά ἐστιν
  choice: 違いが明らかになります
  rationale: 直訳的には「明らかである」だが、日本語では対置された二群について「違いが明らかになる」とすることで、識別可能になるという意味を自然に表す。
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: 神の子どもたちと悪魔の子どもたち
  rationale: ヨハネ文書の家族的・神学的比喩を弱めず、そのまま保持する。
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: 正しいことを行わない人は皆
  rationale: 現在分詞の特徴的・継続的な行為の含みを「行わない人」で表す。「義を行わない」より普通の読者に明瞭で、倫理的実践を指す文脈にも合う。
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: 神から出た者ではありません
  rationale: ἐκ の起源・由来の意味を保ち、単なる所属以上の「神に由来する者ではない」という表現にする。
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟を愛さない人
  rationale: 原文の男性単数形を本文で保持する。文脈上は信仰共同体の仲間を指し得ることを脚注で示す。
- source_word: καὶ
  choice: また、…もそうです
  rationale: 前節の否定述語「神から出た者ではありません」が後半にも省略されている構造を、自然な日本語で明示する。
theological_decisions:
- issue: 道徳的・霊的帰属を表す家族的表現
  choice: 神の子どもたちと悪魔の子どもたち
  alternative: 神に属する人々と悪魔に属する人々
  rationale: τέκνα の明示的な親子・家族の比喩はヨハネの神学に重要であり、一般的な所属表現へ置き換えない。
- issue: δικαιοσύνην の訳語
  choice: 正しいこと
  alternative: 義／正義
  rationale: ここでは神の性質にかなう正しい行いが焦点であり、社会的公正だけに限定される「正義」は避ける。「義を行う」という教会語的表現より理解しやすくする一方、別訳を脚注に残す。
- issue: ἀδελφός の性と範囲
  choice: 自分の兄弟
  alternative: 自分の兄弟姉妹／信仰の仲間
  rationale: 原文の男性単数形を保持しつつ、文脈上の代表的・共同体的な広がりを脚注で示し、本文で解釈を固定しない。
translation_notes:
  register: 現代の一般読者に明瞭な丁寧体を用い、ヨハネの家族的対比と「神から」の起源表現を保持した。「義を行う」は脚注に残し、本文では自然な「正しいことを行う」とした。
