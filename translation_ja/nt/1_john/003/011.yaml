base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: ja
  text: なぜなら、これはあなたがたが初めから聞いた知らせ、すなわち、互いに愛し合うべきだということだからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「互いに愛し合うためである」、または「互いに愛し合おう」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: というのは……だからです
  rationale: 直前の内容を説明する接続辞としての働きを、現代日本語で自然な説明表現にした。
- source_word: ἡ ἀγγελία
  choice: 知らせ
  rationale: 伝えられた内容を指す一般的で明快な語。文脈上の宣教的な響きを残しつつ、「告知」ほど硬くしない。
- source_word: ἣν ἠκούσατε ἀπ’ ἀρχῆς
  choice: あなたがたが初めから聞いている
  rationale: アオリストの過去の受領と、その教えが今も共有されている含みを自然な日本語で表した。より形式的には「初めから聞いた」とも訳せる。
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: 互いに愛し合うべきだということ
  rationale: ἵνα節を知らせの内容として取り、接続法の勧告的・規範的な力を「べき」で示した。「愛し合う」によりἀλλήλουςの相互性も自然に表す。
theological_decisions:
- issue: ἵνα ἀγαπῶμεν ἀλλήλους の機能
  choice: 知らせの内容として「互いに愛し合うべきだ」と訳す
  alternative: 目的として「互いに愛し合うためである」、または勧告として「互いに愛し合おう」
  rationale: この節では初めから聞いた知らせの倫理的内容を示す読みが文脈に最も適する。ただしἵναには目的・勧告に近い響きもあり得るため、脚注で保持する。
translation_notes:
  register: 明快で現代的な敬体。「というのは……だからです」で説明関係を示し、「互いに愛し合うべきだ」によって倫理的要請を簡潔かつ格調を損なわず表現した。
