id: 1JN.3.23
reference: 1 John 3:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: ja
  text: 神の命令とは、その御子、メシアであるイエスの名を信じ[a][b]、互いに愛し合うことです。これは、私たちに命令を与えたとおりです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その御子イエス・キリストの名を信じ」。「キリスト」はギリシア語Χριστός（油を注がれた者、メシア）の音訳です。
    reason: alternative_reading
  - marker: b
    text: または「その御子、メシアであるイエスの名に信頼し」。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語では直訳すると「（彼が）私たちに命令を与えたとおり」。動詞の主語は明示されていません。
    reason: source_clarity
lexical_decisions:
- source_word: ἐντολή
  choice: 命令
  rationale: 権威を伴う指示という意味を、現代日本語で明瞭かつ自然に表す。文頭では単数形を保ち、「命令とは」とした。
- source_word: ἵνα πιστεύσωμεν
  choice: 信じ
  rationale: ἵνα節は命令の内容を示す。日本語では「信じること」として、勧告的な接続法の力を不自然に説明しすぎず表した。
- source_word: πιστεύω τῷ ὀνόματι
  choice: 名を信じ
  rationale: ヨハネ文書に特徴的な表現を保ち、名によって示される方を信じるという意味を簡潔に伝える。「信頼する」という含みは脚注に示した。
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: その御子
  rationale: 神との固有の関係を表す文脈上の称号として、敬意と親族関係の双方を自然に示す「御子」を用いた。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示し、現代日本語で「イエス」が人名、「メシア」が称号であることが分かる形にした。慣用的な「イエス・キリスト」は脚注に示した。
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: 互いに愛し合う
  rationale: 相互性を自然な日本語で明確にし、ἀγαπάωの基本的意味を保った。
- source_word: καθὼς ἔδωκεν ἐντολὴν ἡμῖν
  choice: 私たちに命じられたとおり
  rationale: 日本語として不自然な「命令を与えた」を避けつつ、καθώςの対応関係と命令の権威を保った。ギリシア語で明示されていない主語も、日本語では省略した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシアであるイエス
  alternative: イエス・キリスト
  rationale: この句ではΧριστόςが御子イエスを示す称号として機能しているため、その意味を訳文上で明らかにした。一方、定着した音訳も正当な表現として脚注に残した。
- issue: πιστεύω τῷ ὀνόματιの意味
  choice: 名を信じる
  alternative: 名に信頼する
  rationale: 単なる名称への同意ではなく、その名によって示される人格と権威に向けられた信仰を表す。本文ではヨハネ的な語法を保ち、より説明的な訳を脚注に示した。
- issue: 末尾のἔδωκενの主語
  choice: 日本語でも主語を明示しない
  alternative: 神が私たちに命じられたとおり
  rationale: ギリシア語では動詞の主語が明示されず、文脈上は神を指す可能性が高いものの、主語を補って曖昧さを解消しすぎないようにした。
- issue: καθώς節が修飾する範囲
  choice: 互いに愛し合うことに結び付ける
  alternative: 信じることと愛し合うことの両方に結び付ける
  rationale: 語順上、καθώς節は直前の「互いに愛し合う」に最も自然に結び付く。ただし命令全体との関係も排除しない語順とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の命令を述べる箇所にふさわしい端正な調子を保った。「命令を与える」という直訳調は本文で避け、原文の形は脚注で示した。末尾の動詞の主語を補わず、原文に残る指示対象の余地を保持した。
