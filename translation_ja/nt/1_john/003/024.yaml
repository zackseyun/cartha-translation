  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: ja
  text: 神の戒めを守る人は、神のうちにとどまり、神もその人のうちにとどまっておられます。そして、神が私たちのうちにとどまっておられることは、神が私たちに与えてくださった御霊によって分かります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神が私たちに与えてくださった御霊を根拠として分かります」。原文の前置詞は、知る手段だけでなく、その根拠・源を表すこともできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: 守る
  rationale: 単なる服従だけでなく、大切に保ちつつ実行する意味を持つヨハネ文書の語法を自然な日本語で表します。
- source_word: ἐντολάς
  choice: 戒め
  rationale: ヨハネ文書の倫理的・契約的な重みを保ち、周辺文脈にもなじむ表現です。日本語では複数性を明示しなくても総体として理解できます。
- source_word: μένει
  choice: とどまる
  rationale: この節で三度繰り返されるヨハネ文書の重要語を同じ語で訳し、継続的な相互内住の関係を保ちます。
- source_word: ἐν αὐτῷ / ἐν ἡμῖν
  choice: その方のうちに／私たちのうちに
  rationale: ἐν の内在的・関係的な響きを弱めず、「うちに」で一貫して表します。
- source_word: ἐν τούτῳ γινώσκομεν
  choice: …ことは、…によって分かります
  rationale: 直訳調の「このことによって私たちは知ります」を避けつつ、後続する御霊が認識の根拠または手段である構造を明確にします。
- source_word: ἐκ τοῦ πνεύματος
  choice: 御霊によって
  rationale: ἐκ が示す根拠・源を、日本語として自然な手段表現で示します。源を強調する可能性は脚注に残します。
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: その方が私たちに与えてくださった
  rationale: アオリストの単純な授与を表しつつ、神からの賜物について自然で敬意ある日本語にします。
theological_decisions:
- issue: αὐτοῦ／αὐτῷ／αὐτός、および μένει ἐν ἡμῖν の主語の指示対象
  choice: 代名詞的な「その方」を保ち、文脈上は神を指すものとして訳す
  alternative: 「神」と明示する、または最後の主語をキリストと解する
  rationale: 直前の文脈では神の戒めと、神が与える御霊が中心であるため、第一義的な指示対象は神です。ただし原文は固有名詞に置き換えず代名詞を用いるため、日本語でもそれを保ち、ヨハネ文書における神とキリストの内住をめぐる表現上の緊張を解消しません。
- issue: πνεῦμα の指示対象
  choice: 聖霊を指す「御霊」
  alternative: 人間の「霊」または一般的な霊的原理
  rationale: 神が信者たちに与え、神の内住を知らせるものという文脈は聖霊を指します。「御霊」は説明語を加えず、その神的指示対象を自然に示します。
- issue: 相互内住の表現
  choice: 「その方のうちにとどまり、その方もその人のうちに」と対称的に訳す
  alternative: 交わりや結合などの説明語で意訳する
  rationale: 原文の簡潔で相互的な ἐν…μένει の構造を保ち、内住の性質を特定の教派的説明で限定しません。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「戒め」「御霊」「うちにとどまる」によって本文の品位とヨハネ特有の語彙を保持しました。敬語は神を指す「とどまっておられます」「与えてくださった」に限定し、全体を過度に古風にはしていません。
