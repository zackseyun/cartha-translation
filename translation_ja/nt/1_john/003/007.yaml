source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: ja
  text: 子どもたち、だれにも惑わされてはいけません。[a] 正しいこと[c]を行う人は、あの方[b]が正しい方であるのと同じように、正しい人です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれにも欺かれてはいけません」または「だれにも道を誤らされてはいけません」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 原文は「あの方」。キリストを指す可能性が高いが、神を指すと理解することもできる。
    reason: alternative_reading
  - marker: c
    text: 直訳的には「義」。ここでは、正しい人であることにかなった正しい行いを意味する。文脈によっては「公正」とも訳される語。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: 子どもたち
  rationale: 著者が共同体の人々に親愛を込めて呼びかける語。日本語では「子どもたち」が簡潔かつ自然であり、文脈によって親愛を表す呼びかけとして理解できる。原文にない「愛する」は補わない。
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: だれにも惑わされてはいけません
  rationale: μηδείςを伴う現在命令形の禁止を自然な現代日本語で表した。πλανάωには「惑わす」「道を誤らせる」「欺く」の幅があり、ここでは誤った教えによって倫理的・神学的に迷わせる意味を含む「惑わす」が適切。
- source_word: ὁ ποιῶν
  choice: 行い続ける人
  rationale: 冠詞付き現在分詞が表す継続的・特徴的な行為を示し、一回だけの行為と誤解されないよう「続ける」を用いた。
- source_word: τὴν δικαιοσύνην
  choice: 正しいこと
  rationale: この箇所ではδικαιοσύνηが、正しい者であることにかなう実際の行いを指す。「義」は語の結び付きを保ちやすい一方、一般読者には抽象的になりやすいため、本文では自然な「正しいこと」とした。
- source_word: δίκαιός ἐστιν
  choice: 正しい人です／正しい方である
  rationale: δίκαιοςの道徳的性質を明瞭な日本語で表現した。後半は神的な指示対象への敬意を示すため「方」としたが、原文の比較関係は維持している。
- source_word: καθὼς
  choice: のと同じです
  rationale: 比較と対応を示すκαθώςの力を、明瞭で自然な日本語にした。
- source_word: ἐκεῖνος
  choice: あの方
  rationale: 指示代名詞を固有名に置き換えず、キリストか神かという指示対象の余地を保つ。「あの方」は日本語として自然で、文脈上の敬意も表せる。
theological_decisions:
- issue: ἐκεῖνοςの指示対象
  choice: 本文では「あの方」とし、指示対象を明示しない
  alternative: 「キリスト」または「神」と明示する
  rationale: ヨハネ文書の用法と近接文脈からはキリストを指す可能性が高いが、神を指すとの理解もある。原文が固有名ではなく指示代名詞を用いているため、本文では曖昧さを保持し、注で説明する。
- issue: 正しい行いと正しい者であることの関係
  choice: 原文どおり「正しいことを行い続ける人は正しい人」と述べる
  alternative: 行いによって義と認められる、または義である証拠として行う、という因果関係を本文に補う
  rationale: 本文は行為と人物の正しさを結び付けるが、その論理関係を明示する接続表現はない。特定の義認論や聖化論を訳文に持ち込まず、原文の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的な呼びかけにふさわしい落ち着いた敬体とした。「者」「〜せよ」のような硬い文語調を避け、「人です」「いけません」で一般読者にも読みやすくした。
