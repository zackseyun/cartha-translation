id: 1JN.3.16
reference: 1 John 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: ja
  text: 私たちは、このことによって愛を知るようになりました[a]。あの方が私たちのためにご自分の命を捨てられたことです。そして私たちも、兄弟たち[b]のために自分の命を捨てるべきです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことにおいて」。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、この文脈では女性を含む信仰の仲間全体を指すと考えられます。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このことによります
  rationale: 後続のὅτι節が、愛を知る根拠・手段を説明している。自然な日本語でその働きを示しつつ、「このことにおいて」という可能性は脚注に残した。
- source_word: ἐγνώκαμεν
  choice: 知るようになった
  rationale: 完了形が表す、過去に認識して現在もその認識にあるという含みを、現代日本語で簡潔に表した。
- source_word: τὴν ἀγάπην
  choice: 愛
  rationale: 文脈上、キリストの自己犠牲によって明らかにされた愛そのものを指す。日本語では冠詞の有無を明示せず自然に訳した。
- source_word: ἐκεῖνος
  choice: あの方
  rationale: 指示代名詞の強調を保ち、文脈上の指示対象であるイエスを本文で説明的に補わない訳とした。敬意を伴う自然な日本語でもある。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 利益・代理を含み得るὑπέρの幅を保ち、特定の贖罪理論に限定しない表現とした。
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: ご自分の命を捨ててくださった
  rationale: ψυχήはこの慣用表現では「命」を指す。τίθημιとの結びつきをヨハネ文書で定着した「命を捨てる」で表し、任意の自己犠牲と受益性を自然な敬語で示した。
- source_word: ὀφείλομεν
  choice: べきです
  rationale: 道徳的な義務を表す。単なる推奨ではなく責務であることを、明快で過度に法律的でない日本語にした。
- source_word: τῶν ἀδελφῶν
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文に保った。共同体の女性を含む同信者一般を指し得ることは脚注で明示した。
- source_word: τὰς ψυχὰς θεῖναι
  choice: 命を捨てる
  rationale: 前半のψυχή／τίθημιと対応させ、同じ自己犠牲の表現を反復した。日本語では主語「私たち」により各自の命であることが自然に理解される。
theological_decisions:
- issue: ἐκεῖνοςの指示対象
  choice: 文脈上イエスを指す「あの方」とした
  alternative: 本文で「イエス」または「キリスト」と明示する
  rationale: イエスの自己犠牲が愛を定義しているが、原文は固有名ではなく指示代名詞を用いる。その形式と強調を保ち、文脈に指示対象を委ねた。
- issue: ἀδελφῶνの範囲
  choice: 本文は「兄弟たち」とし、同信者一般を含む可能性を脚注で示した
  alternative: 本文を「兄弟姉妹」または「信仰の仲間」とする
  rationale: 原文の文法的性を保ちながら、当時の代表的な男性複数形が女性を含み得る語用論的範囲も失わないようにした。
- issue: ὑπέρの神学的含意
  choice: 「私たちのために」とした
  alternative: 「私たちの身代わりに」または「私たちに代わって」とする
  rationale: 自己犠牲の代理的・受益的含意を保ちつつ、この前置詞だけから特定の贖罪理解へ狭めることを避けた。
- issue: キリストの行為と信徒の義務の関係
  choice: 「ですから」で倫理的帰結を自然に示した
  alternative: 接続語を置かず、原文のκαίを単純に「また」とする
  rationale: καίがここで先行する模範から信徒の責務へ進む流れを担うため、論理を過度に強めない範囲で自然な日本語の接続とした。
translation_notes:
  register: 明快な現代標準日本語を用い、荘重さを保ちながら古語的表現は避けた。「あの方」「ご自分」「くださった」により指示対象への敬意を自然に表した。二文に分けて、愛を知る根拠とそこから生じる義務を読み取りやすくした。
