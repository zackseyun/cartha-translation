- from: 私たちが愛を知るようになったのは、このことによります[a]。あの方が私たちのためにご自分の命を捨ててくださったことです。ですから、私たちも兄弟たち[b]のために命を捨てるべきです。
  to: 私たちは、このことによって愛を知るようになりました[a]。あの方が私たちのためにご自分の命を捨てられたことです。そして私たちも、兄弟たち[b]のために自分の命を捨てるべきです。
  rationale: ἐν τούτῳは「このことによって」として、後続の内容節が愛を知る根拠・手段を示す構文を自然に表しました。「知るようになりました」はἐγνώκαμενの完了形が示す到達した認識とその継続を表します。ἐκεῖνοςは原文どおり「あの方」とし、固有名を補いません。καίは「そして」として、自己犠牲の事実と信者の義務を原文の接続の強さで結びました。
