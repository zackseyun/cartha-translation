id: 1JN.3.20
reference: 1 John 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: ja
  text: もし私たちの心が私たちを責めるなら、神は私たちの心よりも大いなる方であり、すべてをご存じだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: だからです
  rationale: 第一のὅτιは前節の内容に根拠または説明を与える。日本語では文末に置くことで、その説明的な働きを自然に示した。
- source_word: ἐὰν καταγινώσκῃ
  choice: たとえ…責めるとしても
  rationale: ἐὰνと接続法は条件を表す。後続する神についての宣言が与える慰めとの対比を自然に伝えるため、譲歩的な含みを持つ「たとえ…としても」とした。「責める」は内面が非を認めてとがめる意味を保つ。
- source_word: ἡμῶν ἡ καρδία
  choice: 私たちの心が私たちを
  rationale: καρδίαを「良心」と限定せず「心」と訳し、人の内面全体を指し得る比喩の幅を保った。属格ἡμῶνは動詞の目的語としても働くため、「私たちを」を明示した。
- source_word: μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν
  choice: 神は私たちの心よりも大いなる方であり
  rationale: 比較の内容を知識・権威・憐れみのいずれか一つに狭めず、μείζωνの幅を保った。「大いなる方」は尊厳ある現代日本語として、単なる大きさ以上の卓越を表す。
- source_word: γινώσκει πάντα
  choice: すべてをご存じ
  rationale: πάνταの包括性を簡潔に保ち、神を主語とする自然で敬意ある日本語とした。
theological_decisions:
- issue: 「神は私たちの心よりも大いなる方」の意味
  choice: 神の大いなることを、知識・権威・憐れみの一つに限定しない。
  alternative: 神は自己断罪を覆す権威を持つ、または心より完全に事情を知る、または心より憐れみ深い、と明示する。
  rationale: 後半の「すべてをご存じ」は神の完全な知識を強く示唆するが、比較表現そのものはより広い。本文ではその神学的な幅と緊張を保った。
- issue: 条件節の語調
  choice: 自己断罪がある場合にも成り立つ慰めとして「たとえ…としても」と訳す。
  alternative: 中立的に「もし…なら」と訳す。
  rationale: ギリシア語の条件を保ちつつ、前後の文脈にある確信・慰めとの対比を日本語で自然に表す。神の判断の具体的内容までは補わない。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも適する品位を目指した。「大いなる方」「ご存じ」により尊厳を保ちつつ、「心」を残してヨハネの比喩を過度に解釈しないようにした。
