  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: ja
  text: 兄弟たち[a]、世があなたがたを憎むなら、驚いてはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は文法上は男性複数形ですが、ここでは女性を含む信者の共同体全体への呼びかけと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: 驚いてはいけません
  rationale: μήを伴う現在命令形の禁止を、現代日本語で自然かつ明確に表した。「不思議に思うな」よりも、この文脈での意外感を直接伝える。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを本文で保持した。ここでは女性を含む信仰共同体全体への呼びかけである可能性が高いため、その点を脚注で説明する。
- source_word: εἰ
  choice: もし…ても
  rationale: 条件を表す語としての曖昧さを保ち、「…するとき」や「…ので」と断定的に解釈しない形にした。日本語では後続の勧告に自然につながるよう譲歩条件で表現した。
- source_word: μισεῖ
  choice: 憎んでも
  rationale: 現在形が示す一般的・継続的な現実を、簡潔な現代日本語で表した。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書で神に背く人間世界を含意しうるが、解釈を本文に付加せず、神学的な広がりを保つ定訳的な表現とした。
theological_decisions:
- issue: ἀδελφοίの男性複数形による代表的呼びかけ
  choice: 本文では「兄弟たち」とし、共同体全体を指しうることを脚注で示す
  alternative: 「兄弟姉妹たち」または「きょうだいたち」
  rationale: 原文の文法上の男性形を保持しつつ、この呼びかけが女性を含む信者共同体全体に向けられている可能性を明示するため。
- issue: ヨハネ文書におけるκόσμοςの意味
  choice: 解釈的な語句を加えず「世」と訳す
  alternative: 「神に敵対する世」または「この世の体制」
  rationale: κόσμοςが持つ神学的含意を狭く限定せず、文脈から理解できる余地を残すため。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ敬体を用いた。「もし…ても」によって原文の条件表現を保持し、「世」はヨハネ文書の語感を損なわない簡潔な表現とした。
