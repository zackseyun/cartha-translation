id: 1JN.3.8
reference: 1 John 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: ja
  text: 罪を犯し続ける者[a]は、悪魔に属する者です[b]。悪魔は初めから罪を犯し続けているからです。神の御子が現されたのは[c]、悪魔のわざを打ち壊すためでした[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪を行う者」とも訳せます。ギリシア語の現在分詞は、ここでは継続的な、またはその人を特徴づける行為を示し得ます。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「悪魔からの者です」。ここで「から」は、道徳的・霊的な源や結びつきを表します。
    reason: alternative_reading
  - marker: c
    text: 「現れた」とも訳せます。ギリシア語には、姿を現すこととともに、その存在や使命が明らかにされるという含みがあります。
    reason: lexical_alternative
  - marker: d
    text: 「解体する」「無力にする」とも訳せます。原語は本来「解く、ほどく」を意味し、ここでは悪魔のわざを崩して効力を失わせることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: 罪を行い続ける者
  rationale: 現在分詞が示す継続的・特徴的な行為を自然な日本語で表し、一度だけの罪を指すと限定されることを避けた。
- source_word: ἐκ τοῦ διαβόλου
  choice: 悪魔から出た者です
  rationale: ἐκの源・由来という比喩を保ちつつ、悪魔から文字どおり生まれたという意味に限定しない表現とした。
- source_word: διάβολος
  choice: 悪魔
  rationale: この文脈ではサタンを指す定着した人格的呼称であり、現代日本語で最も明瞭である。
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: 初めから……からです
  rationale: ὅτιの理由を示す働きと、ἀπ’ ἀρχῆςの意図的に幅を残す時間表現を保持した。
- source_word: ἁμαρτάνει
  choice: 罪を犯し続けている
  rationale: 「初めから」と結びつく現在形の継続的・特徴的な意味を明確にした。
- source_word: εἰς τοῦτο
  choice: ……のは、……ためでした
  rationale: 後続するἵνα節を前方指示する目的表現として、日本語で自然な目的構文に組み替えた。
- source_word: ἐφανερώθη
  choice: 現された
  rationale: 受動形と、単なる視覚的出現を超えた顕現・開示の含みを保った。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の御子
  rationale: キリスト論的称号を、明瞭で尊厳ある標準的な聖書日本語として訳した。
- source_word: ἵνα λύσῃ
  choice: 打ち壊すため
  rationale: λύωの「解く、ほどく」から派生する、悪魔のわざを無力化し崩壊させる意味を、文脈に即して表した。
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: 悪魔のわざ
  rationale: 複数形を日本語の集合的表現で自然に示し、悪魔の活動とその結果を含み得る広さを保った。
theological_decisions:
- issue: ヨハネ書簡における現在時制の罪の表現
  choice: 継続的・特徴的な行為として「罪を行い続ける」「罪を犯し続けている」と訳す
  alternative: 一度でも罪を犯す行為についての絶対的な断定と読む
  rationale: 現在分詞と現在形の継続的な力を表し、1:8–2:2などで信者の罪を認める記述との神学的緊張を消さず、同時に不必要な矛盾も作らないため。
- issue: 「悪魔から」の意味
  choice: 道徳的・霊的な源や結びつきを示す比喩として保持する
  alternative: 悪魔からの文字どおりの出生・存在論的派生と読む
  rationale: ἐκはここでヨハネ的な倫理的・霊的由来を表す。訳文は源の比喩を保ち、その意味を教義的に過度に限定しない。
- issue: 神の御子が現された目的
  choice: 悪魔のわざを打ち壊すため
  alternative: 悪魔のわざを単に暴露するため
  rationale: ἵναと接続法は目的を表し、λύσῃはこの目的語とともに、単なる開示ではなく決定的な解体・無力化を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「御子」「わざ」によって尊厳ある聖書的文体を保った。原文の反復と因果関係を維持しつつ、日本語として自然な三文構成にした。
