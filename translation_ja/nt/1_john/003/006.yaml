id: 1JN.3.6
reference: 1 John 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: ja
  text: その方のうちにとどまっている者は皆、罪を犯さない[a]。罪を犯す者は皆、その方を見たこともなく、知ってもいない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を犯し続けない……罪を犯し続ける者」。ここで用いられているギリシア語の現在形と現在分詞は、継続的またはその人に特徴的な行為を表すと理解することもできる。
    reason: 現在形・現在分詞のアスペクトに関する解釈の幅を示し、絶対的な読みと継続的・習慣的な読みの双方を読者に知らせるため。
lexical_decisions:
- source_word: πᾶς ὁ
  choice: …者は皆
  rationale: 冠詞を伴う構文の総称的・普遍的な力を保ちつつ、現代日本語として自然にした。
- source_word: ἐν αὐτῷ μένων
  choice: その方のうちにとどまっている
  rationale: ヨハネ文書で重要な μένω の継続的な意味と、ἐν αὐτῷ の関係・結合を表す比喩を保った。
- source_word: οὐχ ἁμαρτάνει
  choice: 罪を犯さない
  rationale: ギリシア語の表現を本文では簡潔かつ形式的に訳し、現在形が継続的・習慣的行為を指し得ることは脚注で示した。
- source_word: ὁ ἁμαρτάνων
  choice: 罪を犯す者
  rationale: 前半との語彙上の対応を保った。現在分詞の継続的・特徴的な用法の可能性は脚注に委ねた。
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: その方を見たこともなく
  rationale: 完了形が示す、過去の経験の欠如に基づく現在の状態を自然な日本語で表した。「一度も」は明示されていないため加えなかった。
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: 知ってもいない
  rationale: οὐδέ による否定の連結を「も…ない」で示し、γινώσκω が持ち得る人格的・関係的な「知る」の含みを保った。
- source_word: αὐτῷ / αὐτόν
  choice: その方
  rationale: 原文が代名詞の指示対象を明示していないため、「神」「御子」「キリスト」と特定せず、敬意を伴う自然な日本語の指示表現とした。
theological_decisions:
- issue: この節が信者の絶対的な無罪性を教えているか
  choice: 本文では「罪を犯さない／罪を犯す」と訳し、現在形・現在分詞の継続的または習慣的な理解を脚注で示す。
  alternative: 本文で「罪を犯し続けない／罪を犯し続ける者」と明示する。
  rationale: ギリシア語の現在形だけで反復・継続を明示しすぎず、同時に第一ヨハネ1:8–2:2との緊張を踏まえた有力なアスペクト理解を読者に提示し、原文の解釈上の幅を保つため。
- issue: 「その方」が指す相手
  choice: 代名詞的な「その方」のままにする。
  alternative: 「神」または「御子／キリスト」と明示する。
  rationale: 原文自体がこの節では αὐτός を用いており、直近の文脈における指示対象を訳文で教理的に限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「その方のうちにとどまる」というヨハネ特有の比喩を保持した。「その方」は敬意を示しつつ指示対象を過度に特定しない表現である。
