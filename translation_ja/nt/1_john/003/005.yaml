source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: ja
  text: あなたがたは知っています。あの方が現れた[a]のは、罪を取り除く[b]ためであり、その方のうちに罪はありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「明らかにされた」「現された」。原語は受動形である。
    reason: lexical_alternative
  - marker: b
    text: 別訳「罪を運び去る」。原語の動詞には「取り去る」「運び去る」の意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: あなたがたは知っています
  rationale: 完了形に由来する形だが、コイネー・ギリシア語では現在の意味で用いられるため、自然な現代日本語で表した。
- source_word: ἐκεῖνος
  choice: あの方
  rationale: 字義的には「あの者」だが、ヨハネ文書では文脈上キリストを強く指し示す用法がある。「あの方」は指示性を保ちながら、自然で品位ある日本語となる。後半では同じ指示対象を「その方」とした。
- source_word: ἐφανερώθη
  choice: 現れた
  rationale: 受動形だが、ここではキリストが歴史の中に姿を現したことを指す。「現れた」が明快で自然であり、受動的な表現の可能性は脚注に残した。
- source_word: ἵνα
  choice: ため
  rationale: 目的を示す接続詞の働きを、「〜ため」として明示した。
- source_word: τὰς ἁμαρτίας
  choice: 罪
  rationale: 原文は複数形だが、日本語の「罪」は文脈により複数の罪を自然に包含できる。「数々の罪」などと過度に具体化せず、原文の意味を自然な日本語で伝えた。
- source_word: ἄρῃ
  choice: 取り除く
  rationale: この動詞には「持ち上げる」「運ぶ」「取り去る」などの意味がある。ここでは罪を除去する目的が中心なので「取り除く」とし、「担って運び去る」という可能性を脚注に示した。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 単数・無冠詞の語を簡潔に「罪」とし、その方に罪がまったく存在しないという表現を保った。
- source_word: ἐν αὐτῷ
  choice: その方のうちには
  rationale: ἐν＋与格の表現とヨハネ文書に特徴的な「〜のうちに」という言い回しを保ちつつ、現代日本語として理解できる形にした。
theological_decisions:
- issue: ἐκεῖνοςが指す人物
  choice: イエス・キリストを指す「あの方」
  alternative: 字義的な「あの者」または単なる「彼」
  rationale: 直前までの文脈と、「罪を取り除くために現れた」「その方のうちに罪はない」という記述から、指示対象はイエス・キリストである。「あの方」は名前を補わずに、そのキリスト論的指示を明瞭にする。
- issue: 罪を目的語とするαἴρωの意味
  choice: 罪を取り除く
  alternative: 罪を担う、または担って運び去る
  rationale: この節の直接的な強調は、キリストが現れた目的としての罪の除去にある。「取り除く」は特定の贖罪論に狭めず、原語の中心的意味を伝える。別の語義の可能性は脚注に残した。
- issue: 「その方のうちには罪がない」の範囲
  choice: 罪の不在をそのまま断定する
  alternative: 「罪深さがない」など説明的に言い換える
  rationale: 原文の簡潔で絶対的な表現を保持し、解釈的説明を本文に加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「あの方」「その方のうちには」によってヨハネ文書の指示性と表現上の響きを保った。文を二つの独立文に分けず、目的節と後半の断定が結び付く原文の構造を「〜ためであり」で反映した。
