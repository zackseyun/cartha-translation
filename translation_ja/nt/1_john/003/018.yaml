  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: ja
  text: 子どもたちよ、言葉でも口先でも愛するのではなく、行いと真実をもって愛しましょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τεκνία
  choice: 子どもたちよ
  rationale: 呼びかけの複数形で、著者が親愛を込めて共同体に語りかける表現。日本語では「幼い子どもたち」とすると実年齢を不必要に限定しやすいため、自然な呼びかけとして「子どもたちよ」とした。
- source_word: μὴ ἀγαπῶμεν
  choice: 愛するのではなく……愛しましょう
  rationale: μήを伴う一人称複数の現在接続法による勧告を、日本語の包括的な勧めとして表した。後半に「愛しましょう」を置き、対比全体を自然にまとめた。
- source_word: λόγῳ μηδὲ τῇ γλώσσῃ
  choice: 言葉や口先で
  rationale: λόγοςは言語表現、γλῶσσαは字義的には「舌」で、ここでは発言を指す。「口先」は具体的な身体イメージと、行動を伴わない言葉との対比を現代日本語で明確にする。
- source_word: ἐν ἔργῳ
  choice: 行いをもって
  rationale: ἔργονの具体的な行為・実践という意味を保ち、「言葉」との対比を明瞭にした。
- source_word: καὶ ἀληθείᾳ
  choice: と真実をもって
  rationale: ἀλήθειαを「誠実さ」だけに狭めず、「真実」と訳して、真正な愛と神の真理に即した愛というヨハネ文書上の含みを保った。
theological_decisions:
- issue: 「行いと真実をもって」におけるἀλήθειαの意味
  choice: 真実
  alternative: 誠実さ／真心
  rationale: 文脈上は愛の真正さを含むが、ἀλήθειαを主観的な誠実さだけに限定すると、ヨハネ文書における「真理」の広い神学的響きが失われるため。
translation_notes:
  register: 明快で現代的な標準日本語を用いつつ、呼びかけの親愛と勧告の厳粛さを保った。「口先」は日常的だが軽薄になりすぎず、言葉だけの愛と実践される愛との対照を自然に伝える。
