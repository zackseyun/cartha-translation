  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: ja
  text: この方にこの望みを置く[a]者は皆、この方が清いように、自分を清くします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この方にこの望みを置く」は、「この方にあってこの望みを持つ」とも訳せます。ギリシア語は、望みの向けられる対象またはその拠り所を表し得ます。文脈上、「この方」は御子キリストを指す可能性が高いですが、原文には固有名がありません。
    reason: lexical_alternative_and_referent_ambiguity
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: 持つ者は皆
  rationale: 冠詞付き現在分詞の一般的・継続的な意味を、自然な現代日本語で表す。文中では目的語との結びつきを明確にするため「この望みを置く者」とした。
- source_word: τὴν ἐλπίδα ταύτην
  choice: この望み
  rationale: 直前の文脈で語られた期待を指す指示表現を保つ。「望み」は単なる願望ではなく、約束に基づく確かな期待を表し得る。
- source_word: ἐπ’ αὐτῷ
  choice: この方に…置く
  rationale: ἐπί＋与格が示す、望みの向けられる対象または拠り所を自然に表す。「この方」は指示対象をキリストなどの固有名で補わず、代名詞性を保つ。
- source_word: ἁγνίζει ἑαυτὸν
  choice: 自分を清くします
  rationale: 再帰的な構造を保ちつつ、一般的な主語に自然に対応させる。ἁγνίζειとἁγνόςの語根上の連関を「清くする／清い」で再現する。
- source_word: καθὼς
  choice: …ように
  rationale: 比較を示す自然な現代日本語であり、「ちょうど…と同じように」ほど冗長にならない。
- source_word: ἐκεῖνος
  choice: この方
  rationale: 文脈上は御子・キリストを指す可能性が最も高いが、原文が固有の称号を用いない点を保つ。日本語の「彼」よりも格調と敬意があり、指示対象を過度に確定しない。
- source_word: ἁγνός
  choice: 清い
  rationale: 倫理的・宗教的な純潔を表し、「清くします」との語的対応も保てる。
theological_decisions:
- issue: αὐτῷとἐκεῖνοςの指示対象
  choice: 文脈上はともに御子・キリストを指すと考えられるが、本文では「この方」とする。
  alternative: 「キリストに」「キリストが」と明示する、または父なる神を指すと解する。
  rationale: 直前の「ありのままの御姿を見る」という文脈は御子を強く示唆する一方、ギリシア語本文は名を挿入せず代名詞を用いているため、その余地を残す。
- issue: ἑαυτὸνの一般的な男性単数形
  choice: 「自分を」と訳す。
  alternative: 「自らを」または性を明示した表現にする。
  rationale: 日本語の再帰表現「自分」は性を区別せず、単数的・一般的な主体の再帰関係を正確かつ自然に表す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「清くします／清い」により原文の語根上の対応を保った。敬意を示す「この方」を用いつつ、原文の代名詞が残す指示対象の曖昧さを固有名の挿入で解消しない。
