id: 1JN.3.15
reference: 1 John 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: ja
  text: 自分の兄弟[a]を憎む者は皆、人殺しです。あなたがたは、どんな人殺しにも永遠のいのちがその人のうちにとどまっていないことを知っています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟」は、文脈上、信仰を同じくする仲間を指すと考えられます。ギリシア語は男性単数形です。
    reason: cultural_note
  - marker: b
    text: 「とどまって」は「宿って」とも訳せます。「とどまる」はヨハネ文書で繰り返し用いられる重要な語です。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: 憎む者は皆
  rationale: 冠詞付き現在分詞が表す一般的・特徴的な行為を、自然な現代日本語で保持する。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟
  rationale: ギリシア語の男性単数形を保ちつつ、文脈上は信仰共同体の仲間を指す可能性が高いことを脚注で示す。
- source_word: ἀνθρωποκτόνος
  choice: 人殺し
  rationale: 人を殺す者という強い道徳的断定を、明瞭で一般的な日本語で表す。実際に殺人を犯した者だけを指すと狭く受け取られかねない「殺人犯」より、文脈に適する。
- source_word: οἴδατε
  choice: あなたがたは知っています
  rationale: 二人称複数を明示し、通常の叙述として自然に訳す。
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: どんな人殺しにも…ない
  rationale: 否定を伴う普遍表現を、日本語で曖昧さなく自然に表す。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: ヨハネ文書で定着した表現であり、終わりのない持続と神から与えられるいのちの質を保つ。
- source_word: ἐν αὐτῷ μένουσαν
  choice: その人のうちにとどまっていない
  rationale: 現在分詞の継続性と、ヨハネ文書の鍵語 μένω の「とどまる」という語感を保持する。
theological_decisions:
- issue: 「兄弟」の範囲
  choice: 本文では「自分の兄弟」とし、信仰共同体の仲間という文脈的含意を脚注に置く。
  alternative: 「信仰の仲間」「兄弟姉妹」
  rationale: 原文の男性単数を保ち、文脈的な範囲を本文で断定的に言い換えないため。
- issue: 憎む者を「人殺し」とする断定
  choice: 比喩を弱めず「人殺しです」と訳す。
  alternative: 「人殺しと同じです」
  rationale: 原文は「同じようなもの」と比較せず、述語名詞によって直接「人殺しである」と断定している。
- issue: μένω の訳し方
  choice: 「とどまっている」を本文に用いる。
  alternative: 「宿っている」「住んでいる」
  rationale: ヨハネ文書に反復される「とどまる」という主題との語彙的一貫性を保ち、継続の意味を示すため。
- issue: 永遠のいのちと人殺しの関係
  choice: 「どんな人殺しにも永遠のいのちがその人のうちにとどまっていない」と、原文の現在的状態として訳す。
  alternative: 「人殺しは永遠のいのちを持つことができない」
  rationale: 能力や将来の可能性についての断定に広げず、οὐκ ἔχει と μένουσαν が述べる現在の所有・内在の否定を保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい dignified な文体とした。「いのち」はヨハネ文書の神学的用法を意識して平仮名表記。「人殺しです」という原文の鋭い断定を弱めず、後半は日本語として自然な否定普遍表現にした。
