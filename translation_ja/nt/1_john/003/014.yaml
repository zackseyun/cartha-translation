id: 1JN.3.14
reference: 1 John 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: ja
  text: 私たちは、死から命へ移ったことを知っています。それは、兄弟たち[a]を愛しているからです。愛さない者は、死にとどまっています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せます。ギリシア語は「兄弟たち」ですが、ここでは信者共同体の人々全般を指している可能性があります。
    reason: 原語の男性複数形を本文に保ちつつ、文脈上あり得る包括的な指示範囲を示すため。
lexical_decisions:
- source_word: οἴδαμεν
  choice: 私たちは……知っています
  rationale: οἶδαは完了形の形を持ちながら現在の認識状態を表すため、現代日本語として自然な「知っています」とした。
- source_word: μεταβεβήκαμεν
  choice: 自分たちが……移った
  rationale: 完了した移行と、その結果として現在も新しい状態にあることを示す完了形。日本語では「移った」が自然にその到達済みの状態を含み、移動の比喩も保つ。主語を明確にするため「自分たちが」を補った。
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: 死から命へ
  rationale: ἐκ…εἰςが示す、ある領域から出て別の領域へ入る方向性を、簡潔な「から……へ」で表した。「死」と「命」は解釈的に限定せず原文の比喩を保持した。
- source_word: ἀγαπῶμεν
  choice: 愛している
  rationale: 現在形が表す継続的・特徴的な行為を、日本語の「愛している」で自然に示した。
- source_word: τοὺς ἀδελφούς
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文で保持した。文脈上は女性を含む信仰共同体の仲間全般を指す可能性が高いため、その点を脚注で示した。
- source_word: ὁ μὴ ἀγαπῶν
  choice: 愛さない者
  rationale: 冠詞付き現在分詞が表す一般的・特徴的な人物を、簡潔で自然な総称表現にした。目的語は原文でも明示されていないため補わなかった。
- source_word: μένει
  choice: とどまっています
  rationale: ヨハネ文書で重要な継続状態を表す語。古風な響きを避けつつ、単なる一時的滞在ではない持続性を「とどまっています」で表した。
- source_word: ἐν τῷ θανάτῳ
  choice: 死のうちに
  rationale: 死を一つの領域として描く比喩を、説明的に膨らませず「死のうちに」と表した。
theological_decisions:
- issue: ἀδελφοίの指示対象と性の含意
  choice: 本文では「兄弟たち」とし、共同体の女性を含み得ることを脚注で示す。
  alternative: 「兄弟姉妹」または「信仰の仲間」
  rationale: ギリシア語は文法上男性複数形だが、ヨハネ文書の文脈では信者共同体全般を指す可能性が高い。本文では語形を保持しつつ、包括的な指示範囲を脚注で明らかにした。
- issue: 「死」と「命」の性質
  choice: 「死」「命」を解釈的な修飾なしに保持する。
  alternative: 「霊的な死と永遠の命」または「死の領域と命の領域」
  rationale: 原文は深い神学的移行を述べるが、その性質を簡潔な対比と比喩のまま提示している。「霊的」「永遠」などを補わず、原文の広がりと緊張を保った。
translation_notes:
  register: 明瞭で現代的な敬体を用いた。「死から命へ」「死のうちに」という簡潔で格調のある対句的表現を保ち、神学的な比喩を説明で平板化しないようにした。
