  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: ja
  text: カインのようであってはなりません。彼は悪い者に属していて、自分の兄弟を残酷に殺しました。[a] なぜ彼を殺したのでしょうか。自分の行いが悪く、兄弟の行いが正しかったからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悪から出た者」とも訳せます。ギリシア語は抽象的な悪とも理解できますが、ヨハネ文書では人格的な「悪い者」を指すことがよくあります。
    reason: alternative_reading
  - marker: b
    text: 「惨殺した」「屠った」とも訳せます。ギリシア語の動詞は、単なる「殺した」よりも生々しく強い表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: カインのようであってはなりません
  rationale: 直前の愛の勧めを受けた否定的な比較として、補われる勧告の力を自然な現代日本語で表した。
- source_word: ἐκ τοῦ πονηροῦ
  choice: 悪い者から出た者
  rationale: ἐκ の起源・帰属の意味を「から出た」で保ち、ヨハネ文書で τοῦ πονηροῦ が人格的な「悪い者」を指すことの多い用法を反映した。抽象的な「悪から」の可能性は脚注に残した。
- source_word: ἔσφαξεν
  choice: 惨殺しました
  rationale: σφάζω の、単なる「殺す」より生々しく暴力的な響きを、過度に儀礼的な「屠る」を避けつつ表した。
- source_word: ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟
  rationale: 近親者を殺したという倫理的対照を明瞭にし、日本語として自然にした。
- source_word: χάριν τίνος
  choice: なぜ
  rationale: 理由を問う表現を簡潔で自然な現代日本語にした。
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: 自分の行いが悪く
  rationale: ἔργα を文脈に即して「行い」とし、πονηρά の倫理的な悪を明確に表した。
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: 兄弟の行いが正しかった
  rationale: 原文で省略される ἔργα を日本語では補い、二者の行いの倫理的対照を明瞭にした。δίκαια はここでは司法的な「公正」より「正しい」が自然である。
theological_decisions:
- issue: τοῦ πονηροῦ が人格的な「悪い者」か、抽象的な「悪」か
  choice: 人格的な「悪い者」
  alternative: 抽象的な「悪」
  rationale: 定冠詞を伴う πονηρός はヨハネ文書で人格的な悪しき者を指すことが多い。一方、形態上あり得る抽象的理解を排除しきらず、脚注で示した。
- issue: δίκαια の訳語
  choice: 正しかった
  alternative: 義であった／正義にかなっていた
  rationale: 行いの倫理的性質を平明に伝え、特定の教派的な義認理解を本文へ持ち込まないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「惨殺する」により σφάζω の強い暴力性を保持した。本文の脚注記号 [a] は、曖昧さのある「悪い者から出た者」の直後ではなく文末に置き、文の流れを妨げない形で対応させた。
