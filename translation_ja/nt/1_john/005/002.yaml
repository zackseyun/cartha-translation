source:
  edition: SBLGNT
  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: ja
  text: このことによって、私たちが神の子どもたちを愛していることが分かります。すなわち、私たちが神を愛し、その戒めを行う[a]ときです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その戒めを守る」または「その戒めに従う」とも訳せる。ここで用いられているギリシア語の動詞は、字義的には「行う」（ποιῶμεν）であり、「守る」に通常用いられる語（τηρέω）ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このことによって
  rationale: ヨハネ文書に特徴的な、何によって認識できるかを示す表現。指示語の働きを保ちつつ、現代日本語として明瞭にした。
- source_word: γινώσκομεν
  choice: 分かります
  rationale: 現在形の継続的・一般的な認識を、自然な現代日本語で表した。
- source_word: ἀγαπῶμεν
  choice: 愛している／愛し
  rationale: ἀγαπάωを一貫して「愛する」と訳し、最初の箇所では状態を自然に示すため「愛している」とした。
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: 神の子どもたち
  rationale: τέκναの包括的な家族関係を表し、「息子たち」に限定しない。
- source_word: ὅταν
  choice: とき
  rationale: 現在接続法を伴う時間的・条件的な含みを保つ。「するとき」として一般的な場合にも読める表現にした。
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: その戒めを行う
  rationale: ποιέωの基本的な「行う」を反映し、τηρέωに典型的な「守る」へ黙って置き換えないようにした。日本語としても理解可能である。
theological_decisions:
- issue: 神の子どもたちへの愛と、神への愛および戒めの実行との関係
  choice: 「このことによって……分かります。すなわち……ときです」とし、認識のしるし・基準として提示する
  alternative: 神への愛が他者愛を因果的に生み出す、または両者が相互に定義されると明示する
  rationale: 原文は簡潔な認識基準を述べるが、因果関係や厳密な定義までは明示しないため、その神学的な緊張を残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「神の子どもたち」は包括的で自然な表現とし、「戒めを行う」は原文の動詞の選択を意識的に保持した。脚注記号は対応箇所の文末に置いた。
