  naturalness: 「証し」「御子」「自分のうちに」は明瞭で品位ある現代標準日本語である。「神を偽り者としています」は意味を伝えるが、完了形πεποίηκενの結果としての評価をより自然に示すため、「神を偽り者としたことになります」とするのがよい。
