id: 1JN.5.10
reference: 1 John 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: ja
  text: 神の御子を信じる人は、その証しを自分のうちに持っています[a]。神を信じない人は、神を偽り者としたことになります[b]。神がご自分の御子についてなさった証しを信じていないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異読として「彼のうちに」と読むものがあります。その場合、文脈によっては「御子のうちに」と理解される可能性もあります。
    reason: textual_variant
  - marker: b
    text: 直訳は「神を偽り者にした」です。神の証しを退けることは、神を真実でない方として扱うことを意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: 神の御子を信じる人
  rationale: 実体詞的な現在分詞の一般的な単数を「信じる人」で表し、πιστεύω εἰς が示す御子への信頼を自然な現代日本語で訳した。υἱός は文脈上、神との固有の父子関係を示すため「御子」とした。
- source_word: τὴν μαρτυρίαν
  choice: その証し
  rationale: ヨハネ文書に特徴的な法廷的・証言的含意を保ちつつ、現代日本語として自然な「証し」を採用した。定冠詞は直前までの文脈で知られた神の証しを指すため「その」で示した。
- source_word: ἐν αὑτῷ
  choice: 自分のうちに
  rationale: SBLGNT の再帰代名詞を、直前の「信じる人」に自然に戻る表現として訳し、証しを内に持つという意味を保った。
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: 神を信じない人
  rationale: 与格を伴う πιστεύω は、神の存在を信じないという一般論より、神の言葉・証言を真実として受け入れないことを表す。日本語では「神を信じない」とし、後続の理由節が意味を限定するようにした。
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: 神を偽り者としています
  rationale: 直訳的な「彼を」は日本語では指示対象が曖昧になるため「神」と明示した。完了形の結果が現在に及ぶ含みを「としています」で表し、神を実際に偽り者へ変えるのではなく、偽り者として扱うという語用論的意味も保った。
- source_word: οὐ πεπίστευκεν
  choice: 信じていない
  rationale: 完了形が示す、信じなかった結果として現在も信じていない状態を自然な日本語の継続表現で示した。
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ
  choice: 神がご自分の御子についてなさった証し
  rationale: μαρτυρία／μαρτυρέω の同根語の反復は、日本語では「証し」と「なさった証し」にまとめて不自然さを避けた。「ご自分の」により αὐτοῦ が神を指すことを明確にした。
theological_decisions:
- issue: 「自分のうちにある証し」の所在
  choice: 証しは信じる人のうちにある
  alternative: 異読に従い、証しは御子のうちにあると理解する
  rationale: 本文の ἐν αὑτῷ は再帰形であり、直前の信じる人を受けるのが最も自然である。証しの具体的性質については周辺文脈から教理的説明を補わず、本文の表現にとどめた。
- issue: 「神を信じない」の意味
  choice: 神が御子についてなさった証しを真実として受け入れないこと
  alternative: 神の存在そのものを信じないという一般的な不信仰
  rationale: 後続の ὅτι 節が、不信を神の証しを信じないこととして説明しているため。ただし本文では説明を過剰に織り込まず、理由節によって意味を明らかにした。
- issue: 「神を偽り者とする」の力点
  choice: 神の証しを退けることは、神を偽り者として扱うことになる
  alternative: 人が神を実際に偽り者へ変える
  rationale: ποιέω の表現を保ちながら、文脈上の評価的・宣告的な意味を日本語の「偽り者とする」で表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「御子」「証し」は一般読者にも理解可能な範囲の聖書語彙として採用した。長い一文を三文に分け、因果関係は「からです」で明示した。脚注記号は本文の該当箇所に配置した。
