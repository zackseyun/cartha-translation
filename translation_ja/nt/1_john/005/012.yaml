  naturalness: 「御子を持つ者はいのちを持っている。神の御子を持たない者はいのちを持っていない。」は、明瞭な現代標準日本語であり、原文の簡潔で対照的な言い回しも保たれている。「持つ／持たない」と「持っている／持っていない」の組合せは文法的にも自然である。
  terminology: 「御子」「神の御子」「いのち」は、ヨハネ文書の文脈と聖書日本語の慣用に適合する。「御子」は第一節に「神の」を補わず、第二節で完全な称号を明示する点でも適切である。脚注は「いのち」のヨハネ的含意を説明しつつ、本文に解釈的な語を加えていない。
