id: 1JN.5.12
reference: 1 John 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: ja
  text: 御子を持つ者はいのち[a]を持っている。神の御子を持たない者はいのちを持っていない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「永遠のいのち」とも理解できる。ヨハネ文書では、ここでいう「いのち」は御子にあるいのちを指す。
    reason: 語義と文脈上の含意を示しつつ、原文にない「永遠の」を本文へ補わないため。
lexical_decisions:
- source_word: ὁ ἔχων
  choice: 持つ者
  rationale: 冠詞を伴う現在分詞を、御子を持つことによって特徴づけられる人を一般的に指す表現として訳した。簡潔で現代日本語として自然である。
- source_word: τὸν υἱόν
  choice: 御子
  rationale: 第一節では原文どおり「神の」を補わず、前後の文脈で神の御子を指すことが分かる形にした。
- source_word: ἔχει
  choice: 持っている
  rationale: ἔχωの基本的意味を保ちつつ、現在の状態を自然な日本語で表した。御子およびいのちとの関係的な所有という含みを、それ以上説明的に言い換えてはいない。
- source_word: τὴν ζωήν
  choice: いのち
  rationale: ヨハネ文書における深い神学的含意を保ちながら、この節に明記されていない「永遠の」を本文へ補わないため、「いのち」とした。
- source_word: ὁ μὴ ἔχων
  choice: 持たない者
  rationale: 否定された実詞的現在分詞を、第一文との対照と均衡が明確になるように訳した。
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: 神の御子
  rationale: 第二節の属格を明示し、原文にある完全な称号をそのまま表した。
- source_word: οὐκ ἔχει
  choice: 持っていない
  rationale: 定動詞の否定を現代日本語で自然に示し、肯定文の「持っている」との平行を保った。
theological_decisions:
- issue: ヨハネ文書における「いのち」の意味
  choice: 本文では ζωή を「いのち」と訳し、「永遠のいのち」と展開しない。
  alternative: 永遠のいのち
  rationale: 文脈上は御子にある永遠のいのちを指すが、この節自体には αἰώνιος がない。原文の簡潔さと含意を保ち、詳しい意味は脚注で示した。
- issue: 男性単数形の実詞的分詞が持つ一般的指示
  choice: 「持つ者」「持たない者」と訳す。
  alternative: 彼／その人
  rationale: 文法上は男性単数形だが、ここでは性別を限定せず一般的に人を指す。日本語の「者」は単数・複数や性別を不必要に限定せず、原文の一般的な力を保つ。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語とし、二つの文の対句構造を保った。「生命」よりも人格的・神学的な響きを自然に伝える「いのち」を用い、「御子」は聖書本文として品位がありながら一般読者にも通じる表記とした。
