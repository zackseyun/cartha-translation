id: 1JN.5.18
reference: 1 John 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: ja
  text: 私たちは知っています。神から生まれた者はだれも、罪を犯し続けることはありません[a]。むしろ、神から生まれた者がその人を守り[b]、悪しき者はその人に触れることがありません[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪を犯し続ける」は、継続的または習慣的に罪を行うことを指すと考えられます。信者が一度も罪を犯さないという意味を必ずしも示すものではありません（1ヨハネ1:8-10、2:1参照）。
    reason: cross_reference
  - marker: b
    text: 「神から生まれた者」は信者自身を指し、「自分を守る」という意味だとも解釈できます。一方、多くの解釈者は、ここで神から生まれた者とは御子イエスであり、御子が信者を守るという意味に理解します。
    reason: alternative_reading
  - marker: c
    text: ここで「触れる」は、危害を加えるために手をかける、または取りつくという意味を含むことがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 私たちは知っています
  rationale: 完了形に由来する οἶδα は現在の状態を表すため、現代日本語で自然な現在表現とした。
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: 神から生まれた者はだれも
  rationale: πᾶς ὁ と分詞の組み合わせが持つ個別包括的な意味を表し、完了受動分詞が示す、生まれた結果として今ある状態も自然に伝える。
- source_word: οὐχ ἁμαρτάνει
  choice: 罪を犯し続けることはありません
  rationale: 現在形の未完了的な力を踏まえ、継続的・習慣的に罪を行うことの否定として訳した。絶対的無罪を断定せず、手紙内の1:8-10、2:1との緊張を保つ。
- source_word: ἀλλ’
  choice: むしろ
  rationale: 前の節との強い対照を、明瞭で自然な日本語で示す。
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: 神から生まれた者
  rationale: この句が信者を指すのか、御子イエスを指すのかは文法上確定しないため、「御子」などを本文に補わず、ギリシア語の表現を保った。
- source_word: τηρεῖ αὐτόν
  choice: その人を守り
  rationale: τηρέω の保持・保護の意味を文脈に即して「守る」とし、αὐτόν は非再帰代名詞として「その人」と訳した。再帰的に理解する可能性は注記した。
- source_word: ὁ πονηρὸς
  choice: 悪い者
  rationale: 冠詞を伴うヨハネ文書の用法により、抽象的な悪ではなく人格的な悪者を指す表現として訳した。
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: その人に触れることがありません
  rationale: ἅπτομαι の基本義「触れる」を保持しつつ、危害を加えるために取りつく含みは脚注で明示した。
theological_decisions:
- issue: οὐχ ἁμαρτάνει の現在形が表す意味
  choice: 継続的・習慣的に罪を犯すことの否定
  alternative: 神から生まれた者は一度も罪を犯さないという絶対的な否定
  rationale: 現在形の未完了的側面と、信者の罪を認める1ヨハネ1:8-10および2:1との文脈的整合性を踏まえた。ただし本文の強い否定そのものは弱めない。
- issue: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ の指示対象
  choice: 本文では「神から生まれた者」とし、指示対象を確定しない
  alternative: 信者自身を指す／神の御子イエスを指す
  rationale: アオリスト受動分詞の句は両様に解され得る。本文で「イエス」や「御子」を補わず、脚注で主要な解釈を示して、本来の曖昧さと神学的緊張を保った。
- issue: τηρεῖ αὐτόν の主語と目的語の関係
  choice: 「神から生まれた者がその人を守る」と非再帰的に訳す
  alternative: 「神から生まれた者は自分自身を守る」と再帰的に理解する
  rationale: 底本は再帰代名詞ではなく αὐτόν を読むため、本文では形式に沿って非再帰的に訳した。ただし、主語を信者と見る場合の再帰的解釈を脚注に残した。
- issue: 悪い者が「触れない」の意味
  choice: 基本義の「触れる」を本文に保つ
  alternative: 「捕らえない」「害を加えない」と明示する
  rationale: ἅπτομαι には危害を及ぼすために手をかける含みがあり得るが、その結果まで本文で断定せず、語義上の含意を脚注に置いた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「知っています」「神から生まれた者」「悪い者」などヨハネ文書の簡潔で重みのある表現を保った。指示対象が争われる箇所では敬称や「御子」を本文に加えず、自然さを損なわない範囲で原文の曖昧さを維持した。
