source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: ja
  text: なぜなら、神への愛[a]とは、神の戒めを守ることだからです。また、神の戒めは重荷ではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の愛」とも訳せる。ギリシア語は、神に向けられる愛とも、神から来る愛とも理解し得るが、直前の文脈では「神を愛すること」が有力である。
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη γάρ ἐστιν
  choice: 神を愛するとは、…ことです
  rationale: 前節を受けるγάρの説明関係を日本語では定義文の流れに織り込み、αὕτηが後続のἵνα節を指す構造を自然に表した。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 神を愛する
  rationale: 直前の5章2節と、戒めを守ることによってこの愛を説明する文脈から、τοῦ θεοῦは愛の向かう対象を示す用法と判断した。ただし別解は脚注に示した。
- source_word: ἵνα
  choice: とは、…こと
  rationale: ここでは目的よりも、神への愛の内容・本質を説明する働きを持つため、現代日本語の定義表現とした。
- source_word: τὰς ἐντολὰς αὐτοῦ τηρῶμεν
  choice: 神の戒めを守る
  rationale: τηρέωのヨハネ文書における『戒めを守り行う』という意味を保ち、簡潔で定着した表現を用いた。
- source_word: βαρεῖαι οὐκ εἰσίν
  choice: 重荷ではありません
  rationale: βαρύςの比喩的意味、すなわち負担となり耐え難いことを、明瞭で自然な日本語で表した。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦの属格の意味
  choice: 神に向けられる愛（神を愛すること）
  alternative: 神から来る愛、または神が人を愛する愛
  rationale: 直前の節は神を愛することと戒めを行うことを結び付け、本節もその愛を戒めを守ることとして説明しているため、目的格的属格が文脈上もっとも自然である。ただしギリシア語句自体にある別の可能性を脚注で保存した。
translation_notes:
  register: 明瞭な現代標準語とし、定義の力を保ちながら過度に逐語的な語順を避けた。「戒め」「重荷」は聖書的な重みを保ちつつ一般読者にも理解しやすい語である。脚注記号[a]は、本文全体に関わる属格の別解を示すため文末に置いた。
