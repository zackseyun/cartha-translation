reference: 1 John 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἴδαμεν ὅτι ἐκ τοῦ θεοῦ ἐσμεν, καὶ ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: ja
  text: 私たちは、自分たちが神に属する者であること、また全世界が悪い者[b]の支配下にあることを知っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳すると、「全世界が悪い者のうちに横たわっています」となります。
    reason: lexical_alternative
  - marker: b
    text: 「悪い者」は「悪」とも理解できますが、ヨハネ文書の用法では、人格的な「悪い者」を指す可能性が高いと考えられます。
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: 私たちは……知っています
  rationale: 確かな認識を表す語であり、書簡における確信の調子を、現代日本語で自然に伝える。
- source_word: ἐκ τοῦ θεοῦ ἐσμεν
  choice: 自分たちが神から出た者であり
  rationale: ἐκ が示す源・由来を保ち、「神から生まれた」と具体化しすぎずに表現する。
- source_word: ὁ κόσμος ὅλος
  choice: 全世界
  rationale: ὅλος の包括性を簡潔に保ち、神に背く世界全体を指し得る κόσμος の広がりを限定しない。
- source_word: ἐν τῷ πονηρῷ
  choice: 悪い者の支配下にある
  rationale: ヨハネ文書では人格的な「悪い者」を指す可能性が高い。日本語では「悪い者のうちに」が不透明なため、文脈上の状態を自然に示す「支配下にある」としたが、より形式的な訳は脚注に残す。
- source_word: κεῖται
  choice: 支配下にある
  rationale: 字義的には「横たわっている」だが、ここでは置かれている状態を表す。本文では自然な日本語を優先し、原文の比喩は脚注に示す。
theological_decisions:
- issue: τῷ πονηρῷ が人格的な「悪い者」か抽象的な「悪」か
  choice: 人格的な「悪い者」
  alternative: 抽象的な「悪」
  rationale: 冠詞を伴う πονηρός は、ヨハネ文書の用法（1ヨハネ2:13–14、3:12、5:18参照）では人格的な存在を指す可能性が高い。ただし文法上あり得る抽象的理解も脚注で明示する。
- issue: ἐν τῷ πονηρῷ κεῖται の状態をどう表すか
  choice: 悪い者の支配下にある
  alternative: 悪い者のうちに横たわっている
  rationale: 本文では意味が通る現代日本語を用いながら、原文により近い空間的・比喩的表現を脚注に残し、解釈上の幅を隠さない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、「知っています」によって確信を保った。「神から出た者」は日常語よりやや格調があるが、原文の由来・所属の含みを保持するため採用した。本文は自然さを優先しつつ、原文の比喩と語義上の曖昧さを脚注で示した。
