id: 1JN.5.5
reference: 1 John 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: ja
  text: では、世に勝つ者とはだれでしょうか。イエスが神の御子であると信じる者ではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「世に勝つ者は、イエスが神の御子であると信じる者でなくて、だれでしょうか」。ギリシア語では、男性単数形の分詞が代表的な意味で用いられています。
    reason: 原文の構文と文法上の性を示し、本文の自然な日本語との違いを明らかにするため。
lexical_decisions:
- source_word: τίς δέ ἐστιν
  choice: では、…とはだれでしょうか
  rationale: δέの軽い接続を「では」で示し、修辞疑問として自然で格調ある現代日本語にした。
- source_word: ὁ νικῶν
  choice: 勝つ者
  rationale: 冠詞付き現在分詞の実質名詞的・代表的用法を保ち、継続的・特徴的な意味合いを簡潔に表した。
- source_word: τὸν κόσμον
  choice: 世に
  rationale: ヨハネ文書で神に敵対する秩序を含意しうるが、解釈を加えて「世の体制」などとはせず、伝統的かつ自然な「世」を用いた。日本語の慣用に従い「世に勝つ」とした。
- source_word: εἰ μὴ
  choice: …ではありませんか
  rationale: 排他的な修辞疑問の力を、日本語では肯定を促す「…ではありませんか」で自然に再現した。
- source_word: ὁ πιστεύων
  choice: 信じる者
  rationale: 冠詞付き現在分詞の動詞的な力と代表的用法を保った。
- source_word: ὅτι
  choice: …であると
  rationale: 原因ではなく、信じる内容を導く接続詞として訳した。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の御子
  rationale: 定冠詞を伴うキリスト論的称号としての重みを保ち、日本語で尊厳と自然さを備えた定着表現を選んだ。
theological_decisions:
- issue: ὁ νικῶν と ὁ πιστεύων の男性単数形の扱い
  choice: 勝つ者／信じる者
  alternative: 勝つ人／信じる人、または彼
  rationale: ギリシア語の男性単数分詞はここでは特定の男性に限定せず代表的に機能する。「者」は性別を不必要に限定せず、単数の代表性と文体上の格調を保つ。
- issue: ὁ υἱὸς τοῦ θεοῦ のキリスト論的称号
  choice: 神の御子
  alternative: 神の子
  rationale: イエスの身分に関する告白を拡張も縮減もせず称号として直接表す。「御子」は現代日本語でも理解可能で、この文脈の称号としての重みを伝える。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、修辞疑問の力と告白文としての尊厳を保った。「世界」ではなくヨハネ文書で定着した「世」、「神の子」ではなく称号性の明瞭な「神の御子」を採用した。
