id: 1JN.5.6
reference: 1 John 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: ja
  text: この方こそ、水と血を通して[a]来られた方、イエス・メシアです。水だけによってではなく、水と血とによって来られたのです。そして、証ししているのは御霊です。御霊が真理だからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「水と血を通して」という表現の意味については、イエスの洗礼と死、誕生と死、または洗礼と主の晩餐を指すなど、さまざまに解されています。本文はギリシア語の表現をそのまま保ち、いずれかに限定していません。
    reason: alternative_reading
  - marker: b
    text: 「御霊が真理であることを証ししている」とも訳せます。ギリシア語の接続詞は、証しの理由を示すとも、証しの内容を導くとも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: この方こそ……来られた方……です
  rationale: 指示代名詞の強調と、実体詞的なアオリスト分詞による歴史的な到来を、自然で格調ある現代日本語で表した。
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: 水と血を通って
  rationale: 属格を伴うδιάの経路・手段の幅を保つため「通って」とし、洗礼、誕生、死、礼典など特定の解釈に限定しない。
- source_word: Ἰησοῦς Χριστός
  choice: イエス・メシア
  rationale: ここではΧριστόςがイエスを同定する称号として働いているため、「メシア」とした。日本語として不自然な「イエス、メシア」や説明的な「メシアであるイエス」は避けた。
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: 水によってだけではなく、水と血とによって
  rationale: ἐνの手段的な働きを「によって」で表し、水だけでなく血も含むという対比を明確にした。後半の助詞を「水と血とによって」として、両要素への強調を自然な日本語で保持した。
- source_word: τὸ πνεῦμά
  choice: 御霊
  rationale: ヨハネ文書の文脈では神の証人である聖霊を指す。「御霊」は日本語でその指示対象を簡潔に示す。
- source_word: τὸ μαρτυροῦν
  choice: 証ししているのは
  rationale: 現在分詞の継続的な証言作用と、定冠詞を伴う「証しする者」という同定の力を自然に表した。
- source_word: ὅτι
  choice: だからです
  rationale: ここでは御霊が証しする根拠を示す原因用法と判断した。ただし内容を導く「ということです」の可能性は脚注に残した。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 述語名詞の同定的な意味を「御霊は真理」として保持し、単に「真実である」「信頼できる」と弱めなかった。
theological_decisions:
- issue: 「水と血」の意味
  choice: 本文では「水と血」のまま残し、特定しない
  alternative: イエスの洗礼と死、誕生と死、または洗礼と主の晩餐への言及と解する
  rationale: ギリシア語本文自体が説明しておらず、複数の有力な理解があるため、翻訳で論争を解決しない。
- issue: τὸ πνεῦμαの指示対象
  choice: 聖霊を指す「御霊」
  alternative: 一般的な霊、または人間の霊
  rationale: 第一ヨハネにおける神的証言の文脈は聖霊を強く示すが、本文に「聖」という語は補わなかった。
- issue: Χριστόςの訳
  choice: メシア
  alternative: キリスト
  rationale: この同格表現では姓のような固有名よりも称号としての働きが明瞭であるため、「メシア」とした。
- issue: ὅτιの機能
  choice: 原因を表す「なぜなら／だから」
  alternative: 証言内容を導く「……ということ」
  rationale: 御霊が証しする根拠を述べる読みが文脈上自然だが、統語的には内容節の可能性もあるため脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「この方こそ」「証し」「真理」により聖書本文にふさわしい品位を保った。「来られた」はイエスへの敬意を自然に示す尊敬表現。議論のある比喩を本文で説明せず、脚注で解釈の幅を示した。
