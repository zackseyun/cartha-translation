  terminology: 「永遠のいのち」はヨハネ文書の重要語を一貫して保ち、「神の御子」「名を信じる」も原文のキリスト論的・聖書的表現を不必要に解釈的に言い換えていない。「御子」はこの称号にふさわしい敬意を保つ。
