id: 1JN.5.13
reference: 1 John 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: ja
  text: 神の御子の名を信じているあなたがたに、私はこれらのことを書きました。それは、あなたがたが永遠のいのちを持っていることを知るためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の語順により近く訳すと、「私はあなたがたにこれらのことを書きました。それは、あなたがたが永遠のいのちを持っていることを知るためです。神の御子の名を信じる人たちに」となります。最後の句は「あなたがた」を説明するものと考えられます。
    reason: 原文では「神の御子の名を信じる人たちに」に当たる句が目的節の後にあり、その配置と統語上の曖昧さを示すため。
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞を保ち、この手紙の内容または直前までに述べた事柄を指す表現とした。
- source_word: ἔγραψα
  choice: 私は……書きました
  rationale: 完了した執筆行為を自然な現代日本語で表す。日本語では文脈上、書簡的アオリストをこの形で無理なく伝えられる。
- source_word: ἵνα εἰδῆτε
  choice: それは、……知るためです
  rationale: ἵνα の目的の意味を明示し、εἰδῆτε が示す確かな認識を自然に表した。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: ヨハネ文書で重要な定型表現を保ち、単なる無限の存続に限定せず、神にあるいのちという含意も残す。
- source_word: ἔχετε
  choice: 持っている
  rationale: 現在形による現時点での所有を明確にし、将来だけの希望に読み替えない。
- source_word: τοῖς πιστεύουσιν εἰς
  choice: 信じているあなたがたに
  rationale: この与格の分詞句を ὑμῖν と同格に取り、受取人を特定する自然な日本語とした。現在分詞の継続的な様相も「信じている」で表した。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: その方の人格、啓示された身分、権威を含む聖書的表現を言い換えずに残した。
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: 神の御子
  rationale: 称号の尊厳と親子関係を自然な現代日本語で表す、定着した訳語を用いた。
theological_decisions:
- issue: τοῖς πιστεύουσιν の位置と統語関係
  choice: ὑμῖν と同格に取り、「神の御子の名を信じているあなたがたに」とする
  alternative: 原語の語順に近く、目的節の後に「神の御子の名を信じる人たちに」と置く
  rationale: 同格として受取人を特定する理解が文意に適い、日本語としても明瞭である。一方、ギリシア語では句が目的節の後に置かれているため、その語順と曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら、書簡と聖書本文にふさわしい品位を保った。「生命」ではなく読みやすく定着した「いのち」を用い、「御子」で称号としての重みを表した。
