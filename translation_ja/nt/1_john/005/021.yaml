id: 1JN.5.21
reference: 1 John 5:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: ja
  text: 子どもたち[a]、偶像から自分自身を守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「愛する子どもたち」。ギリシア語は、ヨハネが親愛を込めた呼びかけに用いる指小語。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: 子どもたち
  rationale: 呼びかけに用いられた複数形の指小語で、ヨハネの親愛を込めた牧会的な語りかけである。現代日本語では「子どもたち」が自然に家族的な響きを保つ。親愛の含みは脚注で補う。
- source_word: φυλάξατε
  choice: 守りなさい
  rationale: アオリスト能動命令法二人称複数で、警戒して保護するよう求める。「守りなさい」は簡潔で自然であり、能動的な警戒の意味を伝える。
- source_word: ἑαυτὰ
  choice: 自分自身を
  rationale: 再帰代名詞の目的語としての働きを明確に保つ。
- source_word: ἀπὸ
  choice: から
  rationale: 分離・隔離を表す前置詞を直接的に訳し、偶像との距離を保つ意味を伝える。
- source_word: εἰδώλων
  choice: 偶像
  rationale: 礼拝の対象となる像、また偽りの礼拝対象を指す標準的で明確な訳語。「神に代わるもの」などと意味を拡張しない。
theological_decisions:
- issue: 「偶像」の範囲
  choice: 具体的に「偶像」と訳す
  alternative: 「神に代わるあらゆるもの」「偽りの礼拝」などと広く言い換える
  rationale: ギリシア語本文は偶像を直接名指ししている。広い適用は含意され得るが、翻訳本文では原文以上に範囲を拡張せず、真の神と偽りの礼拝との緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「幼子たち」は字義的な指小の響きを持つが、現代語では実年齢を強く連想させやすいため本文では避け、親愛のニュアンスを脚注に示した。
