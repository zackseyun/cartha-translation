reference: 1 John 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: ja
  text: また、私たちが何を願い求めても、神が私たちに耳を傾けてくださると分かっているなら、私たちは、神に願い求めたものを持っている[a]と分かります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「持っています」。ここで原文は「受け取ります」ではなく、現在形で「持っている」と述べています。
    reason: 原文の現在的な所有表現を示し、願いが実現する時期や仕方を訳文だけで限定しないため。
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: 私たちに耳を傾けてくださる
  rationale: 祈りを聞くという文脈を自然な日本語で表しつつ、「かなえてくださる」とはせず、聞くことと応答することを同一視しない。
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: 私たちが何を願い求めても
  rationale: 不定関係節の開かれた「何であれ」という意味を、日本語の「何を…ても」で明確に表す。時間を表す「願う時はいつでも」にはしない。
- source_word: αἰτώμεθα / ᾐτήκαμεν
  choice: 願い求めても／願い求めた
  rationale: 祈りにおける願いを表す動詞として自然であり、同じ語根の反復も保つ。完了形ᾐτήκαμενは、後半の「すでに持っている」との関係から完了した願いとして表した。
- source_word: ἔχομεν
  choice: すでに持っている
  rationale: 現在形の「持っている」を保持し、「受け取る」と言い換えて本文の論理を先取りしない。「すでに」は、願い求めたことの現在的な確かさを日本語で明瞭にする。
- source_word: τὰ αἰτήματα ἃ ᾐτήκαμεν ἀπ’ αὐτοῦ
  choice: 神に願い求めたもの
  rationale: αἴτημαをここでは願いそのものより「願い求めたもの」と理解し、ἀπόの相手・源のニュアンスを日本語の「神に」で自然に表す。αὐτοῦの指示対象は文脈上神であるため、曖昧になりやすい日本語の代名詞を避けた。
- source_word: οἴδαμεν
  choice: 分かっている／分かります
  rationale: ヨハネ文書に反復される確かな認識を表し、過度に抽象的な「知っている」より自然な現代日本語とした。
theological_decisions:
- issue: ἀκούειが単に祈りを聞くことか、願いをかなえることまで含むか
  choice: 私たちに耳を傾けてくださる
  alternative: 私たちの願いをかなえてくださる
  rationale: ギリシア語は「聞く」と述べ、そのことから願い求めたものを持っているとの確信を導く。「かなえる」とすると、この二段階の論理と神学的緊張を解消してしまう。
- issue: ἔχομενを所有として訳すか、受領として訳すか
  choice: すでに持っている
  alternative: すでに受け取っている
  rationale: 原文は「受け取る」ではなく現在形の「持つ」を用いるため、実現の時期や様態を説明せず、確信の表現をそのまま残す。
translation_notes:
  register: 明瞭な現代標準日本語。祈りの文脈にふさわしい敬意を「くださる」で表しながら、全体は簡潔で荘重な調子に整えた。前半の条件節と後半の確信という原文の反復構造を保った。
