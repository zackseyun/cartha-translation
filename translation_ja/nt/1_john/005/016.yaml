- from: だれかが、自分の兄弟[b]が死に至らない罪を犯しているのを見たなら、その人は願い求めなさい。そうすれば、神[c]はその兄弟に命を与えてくださいます。すなわち、死に至らない罪を犯している人々にです。死に至る罪があります[a]。その罪について願うようにと、私は言っているのではありません。
  to: だれかが自分の兄弟[b]が死に至らない罪を犯しているのを見たなら、その人は願い求めるべきです。すると、神[c]はその兄弟に命を与えてくださいます――死に至らない罪を犯している人々に。死に至る罪があります[a]。その罪について願うようにと、私は言っているのではありません。
  rationale: 安全な最小限の修正として、第三人称の主語「その人」に第二人称命令「願い求めなさい」が続く不整合を解消しました。「願い求めるべきです」は、未来直説法の勧告的用法を自然な現代日本語で表します。ほかの本文と脚注は、原文の曖昧さ、特に「死」と「命」の含意、および祈りに関する限定的な言い方を適切に保っているため維持しました。
