id: 1JN.5.16
reference: 1 John 5:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: ja
  text: だれかが自分の兄弟[b]が死に至らない罪を犯しているのを見たなら、その人は願い求めるべきです。すると、神[c]はその兄弟に命を与えてくださいます――死に至らない罪を犯している人々に。死に至る罪があります[a]。その罪について願うようにと、私は言っているのではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「死」が、肉体の死、霊的な死、あるいは最終的な滅びのどれを指すのか、ギリシア語本文は明示していません。
    reason: theological_ambiguity
  - marker: b
    text: 「兄弟」はギリシア語では単数男性形です。ここでは同じ信仰を持つ仲間を指すと考えられ、文脈上はより広くキリスト者の仲間を含み得ます。
    reason: cultural_note
  - marker: c
    text: ギリシア語は単に「その人に命を与える」と述べ、与える方を明示していません。祈りの文脈から、ここでは「神」を補っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: 兄弟
  rationale: 単数男性形を保ちつつ、ヨハネ文書で同じ信仰共同体に属する者を指す用法を踏まえた。文脈上の広がりは脚注で示す。
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: 罪を犯している
  rationale: 分詞と同語根の目的語による具体的な罪の行為を、自然な現代日本語で表した。現在分詞の継続的な様相も「している」によって残した。
- source_word: μὴ πρὸς θάνατον
  choice: 死に至らない
  rationale: πρός が示す方向・結果を簡潔に表し、「死」が肉体的、霊的、終末的なもののいずれかを限定しない。
- source_word: αἰτήσει
  choice: 願い求めなさい
  rationale: 未来直説法がこの文脈で持つ指示的な力を自然な勧告として表した。祈りの文脈も伝わる表現である。
- source_word: δώσει αὐτῷ ζωήν
  choice: 神はその兄弟に命を与えてくださいます
  rationale: ギリシア語では主語が明示されないが、祈りに応えて命を与える方は文脈上、神と理解される。「その兄弟」は αὐτῷ の指示対象を明確にしたもの。補足した主語は脚注で明示する。
- source_word: ζωήν
  choice: 命
  rationale: ヨハネ文書における豊かな含意を保ち、「霊的な命」「永遠の命」などと限定しなかった。
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: すなわち、死に至らない罪を犯している人々にです
  rationale: 複数形の分詞を反映し、直前の「命を与える」対象を説明する同格的な句として訳した。難しい統語関係を過度に解釈しない表現である。
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: 死に至る罪があります
  rationale: 冠詞のない ἁμαρτία を、日本語で不自然にならない範囲で簡潔に表し、特定の一つの行為か罪の類型かを断定しなかった。
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: その罪について願うようにと、私は言っているのではありません
  rationale: περὶ ἐκείνης の指示対象を明らかにしつつ、先の αἰτέω に対する ἐρωτάω の語の違いを「願い求める」と「願う」でわずかに表した。「願ってはならない」という禁止に強めず、勧めてはいないという原文の抑制を保った。
theological_decisions:
- issue: 「死に至る罪」における「死」の意味
  choice: 「死」の意味を限定せず、そのまま保持する
  alternative: 肉体的死、霊的死、永遠の滅び、終末の有罪判決のいずれかに特定する
  rationale: 本文は死の性質を定義しておらず、解釈上の重要な緊張を訳文で解消すべきではない。
- issue: 「命を与える」の主語
  choice: 文脈上理解される「神」を本文で補う
  alternative: 主語を曖昧にしたままにする、または願い求める人を主語と理解する
  rationale: ギリシア語の主語は省略されているが、祈りへの応答として命を与えるという文脈から神が最も自然である。補足であることは脚注に示した。
- issue: 死に至る罪についての願い
  choice: 著者は願うよう勧めてはいない、と訳す
  alternative: その罪について祈ることを明確に禁止している、と訳す
  rationale: οὐ ... λέγω ἵνα は積極的な禁止よりも、「そうするようにと言っているのではない」という限定的な表現であり、その慎重さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「死に至る」「命」「罪」という本文の簡潔で神学的に重い語を維持した。αἰτέω と ἐρωτάω はそれぞれ「願い求める」「願う」と訳し、重なりを保ちながら語の違いもわずかに示した。
