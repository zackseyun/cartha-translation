id: 1JN.5.1
reference: 1 John 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: ja
  text: イエスがメシア[a]であると信じる人は皆、神から生まれた者です。そして、生んだ方を愛する人は皆、その方から生まれた者をも愛します。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語の「クリストス」は、「油を注がれた者」を意味する称号です。
    reason: alternative_reading
  - marker: b
    text: 「生まれた」「生んだ」「生まれた」は、原文では同じ動詞の語形です。後半は直訳的には「生んだ方を愛する人は皆、その方から生まれた者をも愛します」となります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: 信じる人は皆
  rationale: 冠詞付き現在分詞の一般的・実名詞的な働きを、継続的な信仰も含みうる自然な現代日本語で表した。
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: イエスがメシアであると
  rationale: χριστόςはここでは称号であり、約束された油注がれた者という意味が伝わる「メシア」とした。
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: 神から生まれています
  rationale: 完了受動形が示す、神を源とする誕生とその持続する結果を表す。「神から」によりἐκを明示した。
- source_word: πᾶς ὁ ἀγαπῶν
  choice: 愛する人は皆
  rationale: 一般的・実名詞的な現在分詞を、第一節との並行を保つ自然な日本語にした。
- source_word: τὸν γεννήσαντα
  choice: 生んでくださった方
  rationale: γεννάωの能動形を保ちつつ、神を指すことにふさわしい敬意を示した。「父」と言い換えず、原文の動詞表現を維持した。
- source_word: ἀγαπᾷ καὶ
  choice: をも愛します
  rationale: καίが加える「その人をも」という意味を助詞「も」で自然に示した。
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: その方から生まれた人
  rationale: 同じγεννάωの完了受動分詞とἐξの起源の意味を明示し、前半の「神から生まれています」と語彙上の結び付きを保った。
theological_decisions:
- issue: γεννάωによる神からの誕生と、生む方・生まれた者の関係
  choice: 「神から生まれています」「生んでくださった方」「その方から生まれた人」と訳す
  alternative: 「神によって生まれた」「父」「神の子」と意訳する
  rationale: 原文で繰り返される同一動詞のつながりと、神を源とする誕生を保つ。「父」「神の子」という名詞への置換は避け、ここで「生まれた人」が個々の信者を指すのか共同体を指すのかを必要以上に限定しない。
- issue: イエスに対するὁ χριστόςという称号
  choice: メシア
  alternative: キリスト
  rationale: 固有名のように扱わず、「油注がれた者」という告白的称号であることを明瞭にする。別訳として慣用的な「キリスト」を注記した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「方」「くださった」により神への敬意を自然に示しつつ、過度に教会用語化しない。前後のγεννάωの反復を日本語でも「生まれる／生む」によって可視化した。
