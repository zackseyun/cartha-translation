source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: ja
  text: そして、これが証しです。神が私たちに永遠のいのちを与えてくださった[a]ということです。このいのちは、御子のうちにあります[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「与えてくださった」は「与えてくださいました」とも訳せる。ギリシア語のアオリストは、神の授与という完了した行為を述べている。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「彼の御子のうちに」。「御子を通して」と説明的に訳すこともあるが、本文は「うちに」という表現を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: 証し
  rationale: ヨハネ文書における、証言された内容を指す語として自然であり、法廷的・証言的な含みも保つ。
- source_word: ὅτι
  choice: ということです
  rationale: 先行する「証し」の内容を明確かつ自然な現代日本語で導入する。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: ヨハネ文書で定着した表現で、終わりのない持続と神から来るいのちの質の双方を保つ。
- source_word: ἔδωκεν
  choice: 与えてくださった
  rationale: アオリストの完了した行為を過去形で表しつつ、恩恵としての神の行為を自然な日本語の敬語で示す。現在に及ぶ結果は文脈と後半の現在形から読み取れる。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 与える行為の間接目的語をそのまま表し、指示対象を不必要に限定しない。
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: 御子のうちに
  rationale: 前置詞ἐνの「内に」というヨハネ的表現を保持し、「御子を通して」などの解釈的言い換えを避ける。
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: その証し……このいのち
  rationale: 二度の指示語を残して、証しの内容と直前に述べたいのちとの結び付きを示す。日本語では第一のαὕτηを「その」とすると前文との連続が自然になる。
theological_decisions:
- issue: ἔδωκενのアオリストと、永遠のいのちの現在的所有との関係
  choice: 本文では「与えてくださった」とし、完了した神の行為を明示する
  alternative: 「与えてくださっています」「与えてくださいました」
  rationale: ギリシア語のアオリストを過度に現在完了的に説明せず、後半の「あります」が現在的意義を伝える構造を保つ。
- issue: いのちが「御子のうちに」あるという表現
  choice: 「御子のうちに」を保持する
  alternative: 「御子を通して」「御子とともに」
  rationale: いのちと御子の関係を示す簡潔で含蓄あるἐνの表現を、特定の因果的・手段的解釈へ狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いのち」はヨハネ文書の神学的な用法を踏まえて平仮名とし、「御子」は神との固有の父子関係を表す慣用的な敬称として用いた。脚注記号は関連する文の直後に配置した。
