  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: ja
  text: すべての不義は罪です[a]。また、死に至らない罪もあります[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての悪い行いは罪です」または「すべての不正は罪です」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「死をもたらさない罪」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: 不義はすべて
  rationale: πᾶσαの包括的な範囲と、ἀδικίαの広い道徳的・神学的意味を保つ。「不正」だけでは社会的・法的意味に狭まりやすいため、「不義」を本文に採用した。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 二つの用例をともに、文脈上標準的で正確な「罪」と訳した。
- source_word: καὶ
  choice: しかし
  rationale: 語義上は単純な接続辞だが、前半の包括的断定に続いて、死との関係について区別を示すため、現代日本語で論理関係が自然に伝わる「しかし」とした。新たな教理的対立を加えるものではない。
- source_word: οὐ πρὸς θάνατον
  choice: 死に至らない
  rationale: πρόςが示す方向・帰結を簡潔な現代日本語で表し、前節との語句上のつながりも保った。
- source_word: θάνατον
  choice: 死
  rationale: 原文が死の種類を限定していないため、身体的死、霊的死、終末的滅びのいずれかに限定せず「死」とした。
theological_decisions:
- issue: 「死に至らない罪」における「死」の性質
  choice: 解釈的な限定語を加えず、単に「死」とする
  alternative: 身体的死、霊的死、または終末的な滅びと明示する
  rationale: ギリシア語本文はθάνατονとのみ記し、その性質を特定していない。解釈上の開放性と神学的緊張を保った。
- issue: ἀδικίαの道徳的・神学的範囲
  choice: 本文では「不義」
  alternative: 「悪い行い」または「不正」
  rationale: 単なる個々の悪行や社会的不正に限定せず、正しさに反するもの全般を指す広い意味を保つため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「不義」は日常語よりやや文語的だが、ヨハネ文書の道徳的・神学的射程を簡潔に保つ語として適切。文を二つに分け、普通の読者にも読みやすくした。
