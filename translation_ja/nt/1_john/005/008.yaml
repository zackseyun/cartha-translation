  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: ja
  text: 御霊と水と血、そしてこの三者は一致しています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「この三者は一つです」。ここでは、三者の証言が一致していることを表すギリシア語の言い回しです。
    reason: εἰς τὸ ἕν εἰσινの直訳に近い表現を示しつつ、証言という直近の文脈における慣用的な意味を説明するため。
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 定冠詞のある特定の「霊」を指し、直前の文脈では証しをする神の霊が最も自然であるため。「聖霊」と説明し切ることは避けつつ、単なる人間の霊とも受け取られにくい表現とした。
- source_word: τὸ ὕδωρ
  choice: 水
  rationale: 具体的な比喩をそのまま保ち、この節自体が明示しない指示対象を訳文で補わない。
- source_word: τὸ αἷμα
  choice: 血
  rationale: 原文の具体的な名詞を保ち、その意味を訳文の中で解釈し過ぎない。
- source_word: οἱ τρεῖς
  choice: この三者
  rationale: 直前に挙げられた御霊、水、血をまとめて指す実名詞的表現を、自然な日本語で明確に示す。
- source_word: εἰς τὸ ἕν εἰσιν
  choice: 一つのことにおいて一致しています
  rationale: εἰς τὸ ἕνの「一つ」への収束を残しながら、証言という文脈に即して三者の一致を表す。存在論的に同一であると断定する読みは避ける。
theological_decisions:
- issue: εἰς τὸ ἕν εἰσινが存在論的な一体性を示すのか、証言の一致を示すのか
  choice: 証言の文脈に沿い、「この三者は一つのことにおいて一致しています」とする
  alternative: 「この三者は一つです」または「この三者は一つへと向かっています」
  rationale: 直前の文脈では御霊、水、血が証しをするものとして扱われているため、一致・収束の意味が最も自然である。ただし原文の「一つ」を本文に残し、脚注でより逐語的な可能性も示して、曖昧さを完全には解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体とした。「水」と「血」の指示対象は説明せず、原文が保つ象徴的な余地を残した。
