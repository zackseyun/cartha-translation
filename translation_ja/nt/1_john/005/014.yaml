source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: ja
  text: そして、これが、私たちが神の前に抱く確信[a]です。すなわち、私たちが何かを神のみ心にかなって願うなら、神は私たちの願いを聞いてくださる、ということです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確信」は、「大胆さ」または「確かな信頼」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: 確信
  rationale: ヨハネ文書では、神の御前にためらわず近づける確かな思いを表す。この祈りの文脈では、現代日本語の「確信」が明瞭で自然である。
- source_word: πρὸς αὐτόν
  choice: 神の前で
  rationale: 人を目的語とする πρός の関係的・対面的な意味を、祈りにおける神の御前という自然な日本語で表した。代名詞の指示対象を日本語で明確にするため「神」とした。
- source_word: ὅτι
  choice: すなわち……ということ
  rationale: 理由ではなく、確信の内容を導く用法として訳した。
- source_word: ἐάν τι αἰτώμεθα
  choice: 何事でも……願うなら
  rationale: ἐάν と接続法が表す一般的条件と、τι の開かれた範囲を保った。祈りの文脈に自然な「願う」を用いた。
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: 神のみ心に従って
  rationale: κατά が示す規範・一致を「従って」で表した。θέλημα は日本語聖書として自然で神学的含意も保つ「み心」とした。
- source_word: ἀκούει ἡμῶν
  choice: 神は私たちの願いを聞いてくださる
  rationale: 祈りを聞き入れる方向性を持つ表現だが、願いが必ず即時に実現するとの意味まで加えないよう「聞いてくださる」とした。「願いを」は日本語で対象を自然に明示する補足である。
theological_decisions:
- issue: 祈りを神が「聞く」ことの意味
  choice: 「神は私たちの願いを聞いてくださる」とし、神が祈りに耳を傾けることを表した。
  alternative: 「神は私たちの願いをかなえてくださる」
  rationale: 本文の ἀκούει は「聞く」を意味し、この節だけで、すべての願いが直ちにそのまま実現するという強い意味まで訳文に持ち込むべきではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御心」ではなく読みやすい「み心」を採用し、祈りの対象が神であることを代名詞ではなく明示した。脚注標識は節末に置き、本文中の「確信」に関する注であることを示す。
