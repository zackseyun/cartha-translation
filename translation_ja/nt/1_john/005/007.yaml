  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: というのは……からです
  rationale: 直前の主張に根拠・説明を加える接続語として理解し、現代日本語で自然な説明表現とした。
- source_word: τρεῖς
  choice: 三者
  rationale: 証言する主体の数が三であることを表す。後続文脈には霊・水・血が挙げられるため、人だけを暗示する「三人」は避けた。
- source_word: εἰσιν
  choice: いる
  rationale: 証しする主体の存在を示す現在形として自然に訳した。
- source_word: οἱ μαρτυροῦντες
  choice: 証しする者
  rationale: 冠詞付き現在分詞の実体詞的用法を、動作の意味を保つ「証しする者」とした。「証人」よりも、証しをしているという原文の動詞性を明確に保つ。
theological_decisions:
- issue: ヨハネの手紙第一5章7節の本文形とコンマ・ヨハンネウム
  choice: SBLGNTの短い本文だけを訳す。
  alternative: 後代の写本伝承にある「天において、父、ことば、聖霊、この三者は一つである。また地上で証しするものが三つある……」という長い読みを本文に含める。
  rationale: 指定されたギリシア語本文には長い加筆がないため、本文はそのまま短い読みを採用する。歴史的に重要な異読は脚注で明示し、本文上の証拠と神学的含意を混同しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「三人」ではなく「三者」として、後続する霊・水・血を受けられる表現にした。節の先で文が続くため、句点ではなく読点で終える。
