revisions:
- from: 人の証言を受け入れるのであれば、神の証言はそれよりもまさっています。神がご自分の御子について証しされたこと、これが神の証言だからです。[a]
  to: 人の証言を受け入れるなら、神の証言はそれにまさっています。なぜなら、これが神の証言、すなわち、神がご自分の御子について証しされたということだからです。[a]
  rationale: 本文では最初のὅτιを「なぜなら」で因果的に表し、αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦを「これが神の証言」と訳した上で、二つ目のὅτιを「すなわち…ということ」として神の証言の内容を導くものとして明示した。因果的に読む可能性は脚注で保持した。
