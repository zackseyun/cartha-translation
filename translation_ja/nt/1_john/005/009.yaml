id: 1JN.5.9
reference: 1 John 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: ja
  text: 人の証言を受け入れるなら、神の証言はそれにまさっています。なぜなら、これが神の証言、すなわち、神がご自分の御子について証しされたということだからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最後の節は、「これが神の証言です。神がご自分の御子について証しされたからです」と、理由を示す文として理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: 証言
  rationale: 法廷的・証拠的な意味合いを自然な現代日本語で表し、節内の反復も保つため。
- source_word: ἀνθρώπων
  choice: 人
  rationale: ここでは性別を限定せず、人間の証言を神の証言と対比しているため。日本語の「人」はこの総称的用法を自然に表せる。
- source_word: λαμβάνομεν
  choice: 受け入れる
  rationale: 証言を単に受領するだけでなく、信頼できるものとして認める文脈上の意味を明瞭に表すため。
- source_word: μείζων
  choice: それよりもまさっています
  rationale: 神の証言が人の証言を上回るという比較を明示しつつ、「偉大」よりも証言の価値・権威に適した表現とした。
- source_word: μεμαρτύρηκεν
  choice: 証しされた
  rationale: 完了形が示す、すでになされた証しとその持続的な効力を、日本語で過度に説明せず表すため。名詞「証言」との語根上のつながりも「証し」によって保つ。
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: ご自分の御子について
  rationale: περί＋属格を「について」と自然に訳し、αὐτοῦの再帰的な指示を「ご自分の」で明確にした。「御子」は現代日本語の聖書的文体として理解可能で、固有の父子関係を示す。
theological_decisions:
- issue: 二つ目のὅτιの機能
  choice: 神の証言の内容を示す節（「神がご自分の御子について証しされたこと」）
  alternative: 理由を示す節（「神がご自分の御子について証しされたからです」）
  rationale: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦに続く二つ目のὅτιは、神の証言の内容を示すと取るのが構文上自然である。ただし、理由を示す可能性もあるため脚注に残した。
- issue: ἀνθρώπωνの総称的意味
  choice: 人
  alternative: 人々／人間
  rationale: 男性だけを指す文脈ではなく、人間の証言一般と神の証言との対比である。日本語の「人」は原文の総称性を簡潔かつ自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、証言をめぐる厳粛な論証にふさわしい格調を保った。「証言」の反復を残し、原文の強調を再現した。
