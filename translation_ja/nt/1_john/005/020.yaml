  terminology: 「神の御子」「イエス・メシア」「まことの神」「永遠のいのち」は適切です。Χριστόςを称号として「メシア」とする方針も保持します。「まことの方」はἀληθινόςの名詞的用法にふさわしく、同じ語根の反復を明確にします。
