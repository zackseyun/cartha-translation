id: 1JN.5.20
reference: 1 John 5:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: ja
  text: また、神の御子が来られ、私たちがまことの方を知ることができるように理解力を与えてくださったことを、私たちは知っています。そして私たちは、まことの方のうちに、すなわち、その方の御子イエス・メシアのうちにいます。この方[a]こそ、まことの神であり、永遠のいのちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この方」は直前の「その方の御子イエス・メシア」を指すと読むのが自然です。ただし、前にある「まことの方」、すなわち御父を指すと理解することもできます。
    reason: 指示代名詞οὗτόςの先行詞には解釈上の幅があるため。
lexical_decisions:
- source_word: οἴδαμεν
  choice: 私たちは知っています
  rationale: 完了形に由来する現在的・確定的な認識を、自然な現代日本語で表した。
- source_word: ἥκει
  choice: 来られ
  rationale: 到来がすでに実現し、その結果が現在にも及ぶことを文脈上保ちつつ、御子を指すため自然な敬意表現とした。
- source_word: δέδωκεν
  choice: 与えてくださった
  rationale: 与えられた賜物の効果が続いている完了形の含みを保ち、神の御子の行為にふさわしい自然な日本語とした。
- source_word: διάνοιαν
  choice: 理解する力
  rationale: 単なる『思い』ではなく、真実な方を認識するために与えられた理解能力を明確に表す。
- source_word: ἵνα γινώσκωμεν
  choice: 知ることができるように
  rationale: ἵνα＋接続法の目的を自然に示し、継続的に知るという可能性を過度に説明しない表現とした。
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: 真実な方
  rationale: 名詞的に用いられた形容詞を人格的な神への呼称として訳し、二度の反復も保持した。
- source_word: ἐσμὲν ἐν
  choice: 私たちは…のうちにいます
  rationale: 『結ばれている』などの解釈を加えず、ヨハネ文書に特徴的な『〜のうちにいる』という関係表現を保った。
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: その方の御子…のうちに
  rationale: 所有関係と前置詞ἐνの反復を明示した。
- source_word: Ἰησοῦ Χριστῷ
  choice: イエス・メシア
  rationale: Χριστόςを称号として『メシア』と訳し、日本語で固有名と称号が自然につながる形にした。
- source_word: οὗτός
  choice: この方
  rationale: 指示代名詞の指示性を保持し、直前の『イエス・メシア』を自然な先行詞として読める一方、脚注で別解も示せる表現とした。
- source_word: ὁ ἀληθινὸς θεὸς
  choice: まことの神
  rationale: 神についての定着した荘重な表現を用い、ἀληθινόςの『真の、真正な』という意味を表した。
- source_word: ζωὴ αἰώνιος
  choice: 永遠のいのち
  rationale: ヨハネ文書の主要語として定着した表現を用い、持続性と質の双方を含み得る語義を保った。
theological_decisions:
- issue: οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος のοὗτόςが指す対象
  choice: 本文では『この方』が最も近い人格的先行詞であるイエス・メシアを指すと自然に読める形にする。
  alternative: 『この方』が前節の『真実な方』、すなわち御父を指すと理解する。
  rationale: ギリシア語の指示代名詞は直近の『その方の御子イエス・メシア』を指すのが自然だが、統語上および解釈史上、御父を指すとの理解も存在する。本文で指示代名詞を明示し、脚注で別解を残すことで神学的緊張を解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文としての品位を保った。『御子』『来られ』『与えてくださった』で自然な敬意を示し、『〜のうちにいます』は原文の関係的表現を解釈的に言い換えず保持した。
