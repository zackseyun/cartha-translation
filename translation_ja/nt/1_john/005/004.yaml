reference: 1 John 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: ja
  text: なぜなら、神から生まれた者は皆[a]、世に打ち勝つからです。そして、この世に打ち勝った勝利は、私たちの信仰[b]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「神から生まれたものはすべて」。ギリシア語は中性単数形を用い、神から生まれた者たちを一つの類全体として表しています。
    reason: lexical_alternative
  - marker: b
    text: または「私たちの忠実さ」。ギリシア語は文脈によって「信仰」「信頼」「忠実さ」を意味し得ますが、ここでは「信仰」と訳しました。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の内容の根拠を示す接続詞であるため、日本語では文末の「からです」によって因果関係を自然に表した。
- source_word: πᾶν τὸ γεγεννημένον
  choice: 神から生まれた者は皆
  rationale: 文法上は中性単数だが、ヨハネ文書の文脈では神から生まれた人々を一つの類として包括的に指す。日本語では人格的な指示を明確にしつつ、「皆」で全体性を保った。形式上より直訳的な表現は脚注に残した。
- source_word: γεγεννημένον
  choice: 生まれた
  rationale: 完了受動分詞は、神によって生まれた出来事とその継続する結果を示す。「生まれた」はヨハネ文書の新生の表現として自然であり、日本語ではその結果状態も文脈上伝わる。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から
  rationale: ἐκ が示す起源を明確かつ自然に表し、霊的な誕生の源が神であることを保持した。
- source_word: νικᾷ
  choice: 打ち勝つ
  rationale: 単なる競争上の勝利ではなく、対抗する「世」に勝る意味を自然に表す。同節の同根語とのつながりも「勝」の語で保持した。
- source_word: τὸν κόσμον
  choice: 世
  rationale: ヨハネ文書で神に敵対する秩序を指し得る定着した聖書的表現として「世」を用い、本文では意味を説明的に限定しすぎないようにした。
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: 勝利とは
  rationale: 指示内容を後続の「私たちの信仰」で特定する構文を、日本語の提示表現「とは」で明瞭にした。νίκη は「勝利」と訳して同根語の反復を保った。
- source_word: ἡ νικήσασα
  choice: 世に打ち勝った
  rationale: アオリスト分詞が示す達成された勝利を過去形「打ち勝った」で表し、現在形の「打ち勝つ」との時制・相の違いを保った。
- source_word: ἡ πίστις ἡμῶν
  choice: 私たちの信仰
  rationale: πίστις のこの文脈での通常の意味を「信仰」とし、ἡμῶν の所有・共有の関係を「私たちの」で表した。語義上可能な「忠実さ」は脚注に示した。
theological_decisions:
- issue: πᾶν τὸ γεγεννημένον の指示対象
  choice: 神から生まれた者は皆
  alternative: 神から生まれたものはすべて
  rationale: 原文の中性単数による類全体の包括性を認めつつ、文脈上は神から生まれた人々を指すため、本文では自然な人格表現を採用した。文法形式により近い可能性は脚注で保持した。
- issue: πίστις の意味
  choice: 信仰
  alternative: 忠実さ
  rationale: この箇所では、信じる者が世に勝つこととの関連から「私たちの信仰」が最も自然である。ただし、πίστις は文脈によって「忠実さ」を意味し得るため、語義上の代案を排除せず脚注に示した。
- issue: νικᾷ と νικήσασα の時制・相
  choice: 現在の「打ち勝つ」と、達成を示す「打ち勝った」を区別
  alternative: 両方を現在的に訳す
  rationale: 原文は現在形とアオリスト分詞を用いており、継続的・一般的な勝利と、達成された勝利との緊張を持つ。これを日本語でも可能な限り保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての落ち着きと品位を保った。「世」「信仰」「勝利」など定着した語を採用しつつ、過度に古風な語尾や説明的な意訳は避けた。脚注記号は該当語句の直後に配置した。
