id: 1JN.2.12
reference: 1 John 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: ja
  text: 子どもたちよ[b]、私はあなたがたに書いています[a]。あなたがたの罪が、その方の名のゆえに[c]赦されているからです[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「書きます」。ギリシア語の現在形は、手紙を書いている最中を表す形にも、単純な現在形にも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「子どもたち」は、年齢を示すだけでなく、親愛のこもった呼びかけである。
    reason: lexical_clarification
  - marker: c
    text: 「その方」が神を指すのか、イエスを指すのかは、この節だけでは明示されていない。
    reason: alternative_reading
  - marker: d
    text: または「あなたがたの罪が、その方の名のゆえに赦されていると」。ギリシア語の接続詞は、ここでは書いている理由を示すと読むのが自然だが、書いている内容を導くとも読める。
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: 書いています
  rationale: 手紙を書いている現在の行為を自然な現代日本語で表す。ギリシア語現在形は単純現在とも理解できるため、別訳を脚注に示した。
- source_word: τεκνία
  choice: 子どもたちよ
  rationale: 年齢だけでなく、著者が読者に向ける家族的で慈愛に満ちた呼びかけを表す。文脈上、共同体全体への呼称であり得るため、「幼い子どもたち」とはしなかった。
- source_word: ὅτι
  choice: からです
  rationale: ここでは、罪が赦されていることを執筆の理由として示す読みが文脈に適する。内容を導く「と」も文法上可能なので脚注に残した。
- source_word: ἀφέωνται
  choice: 赦されている
  rationale: 完了受動形が示す、すでに行われた赦しとその結果が続いている状態を、日本語として自然に表す。
- source_word: αἱ ἁμαρτίαι
  choice: あなたがたの罪
  rationale: 与格ὑμῖνと赦しの構文が示す関係を、日本語で明確かつ自然に表した。
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: その方の名のゆえに
  rationale: διά＋対格が表す理由・根拠を「ゆえに」で示し、「名」が担う人格的・聖書的な重みを保持した。
- source_word: ὄνομα
  choice: 名
  rationale: 単なる評判に狭めず、その方自身と権威を指し示す聖書的表現を保った。
theological_decisions:
- issue: 「その方」（αὐτοῦ）が誰を指すか
  choice: 本文では「その方」とし、明示的に特定しない
  alternative: 神、またはイエス・キリスト
  rationale: この節だけでは指示対象が明記されず、前後の文脈に基づく理解も分かれ得る。本文の曖昧さを保ち、脚注で可能性を示した。
- issue: ὅτιの機能
  choice: 執筆理由を示す「から」
  alternative: 書いている内容を示す「と」
  rationale: 周辺の反復的な言い回しでは理由を示す読みが自然だが、内容節として読む文法的可能性も排除しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、呼びかけの温かさと書簡らしい品位を保った。「その方」によって原文の代名詞の曖昧さを維持し、「名のゆえに」で聖書的な表現を過度に言い換えずに残した。
