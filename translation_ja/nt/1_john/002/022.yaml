id: 1JN.2.22
reference: 1 John 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: ja
  text: イエスがメシア[a]ではないと否定する者以外に、偽り者がいったいだれでしょうか。この者が反キリスト[b]です。すなわち、父と子を否定する者です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語の ὁ χριστός はここでは名前ではなく称号として用いられているため、本文では「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: ギリシア語ではこの語に定冠詞が付いている。ヨハネの手紙ではこの語が、父と子を否定することによって特徴づけられる敵対者の類型を指す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: 偽り者
  rationale: 定冠詞を伴う名詞で、この文脈において特徴的・典型的な「偽り者」を指す。「うそつき」よりも、書簡の厳粛な調子に適した表現とした。
- source_word: ἀρνούμενος
  choice: 否定する者
  rationale: 名詞的に用いられた現在分詞であり、その人を特徴づける継続的な態度を自然な日本語で表す。
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: イエスがメシアではないと
  rationale: ὅτιを否定内容を導く接続表現として取り、οὐκをその内容に含めた。χριστόςはここでは称号として機能するため、「メシア」と訳した。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 固有名の一部ではなく、イエスについて認めるか否かが問われる称号なので、意味を伝える「メシア」を採用した。
- source_word: ὁ ἀντίχριστος
  choice: 反キリスト
  rationale: ヨハネ書簡で用いられる既知の術語として通用する訳語を採用した。日本語には冠詞がないため、指示語と強意の「この者こそ」によって特定・同定の力を表した。
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: 父と子
  rationale: ヨハネ文書における神的な父と子の関係を示す対句として、簡潔で直接的に訳した。
- source_word: οὗτός ἐστιν
  choice: この者こそ
  rationale: 直前に述べた人物を指して同定する指示語の力を保ち、日本語では「こそ」によって強調を自然に示した。
theological_decisions:
- issue: キリスト論的な告白・否定表現における Χριστός の訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味が前面に出ているため、「油注がれた者」という背景を持つメシア称号であることが伝わる訳を採用した。別訳も脚注に残した。
- issue: ἀντίχριστος が指す対象の範囲
  choice: 反キリスト
  alternative: キリストに敵対する者／反メシア
  rationale: 本文は特定の終末的人物だけを指すのか、父と子を否定する者の類型を指すのかをここで限定していない。定冠詞の存在は脚注で示しつつ、その神学的緊張を狭めない訳とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、修辞疑問と断定の厳粛さを保った。「いったいだれでしょう」と「この者こそ」によって原文の問いと同定の力を自然に表現した。脚注記号[a][b]は対応語の直後に置いた。
