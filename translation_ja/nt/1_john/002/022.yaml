revisions:
- from: 偽り者とは、イエスがメシア[a]ではないと否定する者でなくて、いったいだれでしょう。この者こそ反キリスト[b]、すなわち父と子を否定する者です。
  to: イエスがメシア[a]ではないと否定する者以外に、偽り者がいったいだれでしょうか。この者が反キリスト[b]です。すなわち、父と子を否定する者です。
  rationale: 原文の修辞疑問（τίς…εἰ μὴ…）を自然な現代日本語の「…以外に、…だれでしょうか」で表した。後半はοὗτός ἐστινの同定と、続く分詞句による説明を短い文と「すなわち」により明瞭にした。脚注bは定冠詞を日本語の指示語として固定せず、原文上の事実と語の用法可能性を保持するよう整えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:43:09Z'
