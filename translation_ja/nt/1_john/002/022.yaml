  naturalness: 「偽り者とは、…者でなくて、いったいだれでしょう」は、原文のεἰ μὴをなぞっているものの、現代標準日本語ではやや不自然である。「…者以外に、偽り者がいったいだれでしょうか」とすることで、修辞疑問の力を保ちつつ自然になる。
  terminology: 「メシア」はὁ χριστόςが称号として使われることをよく表しており、「反キリスト」「父と子」もヨハネ書簡の語法と日本語の聖書的用語として適切である。脚注bは定冠詞を「その」と機械的に確定しすぎず、ギリシア語に定冠詞がある事実として説明するのがよい。
