  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: ja
  text: 自分の兄弟を愛する人は光の中にとどまり、その人のうちには、つまずきとなるものがありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人にとって、つまずきとなるものはありません」。ギリシア語の句は、その人のうちにそれがないという意味にも、その人にとってそれがないという意味にも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: 愛する人
  rationale: 冠詞付き現在分詞の名詞的用法。継続的・一般的な意味を保ちつつ、現代日本語として自然にした。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟
  rationale: 原文の男性単数形を保った。「兄弟」は文脈上、信仰共同体の仲間を指し得るが、本文では解釈的な言い換えを避けた。
- source_word: ἐν τῷ φωτὶ
  choice: 光の中に
  rationale: ヨハネ文書の比喩的イメージをそのまま保つ、明瞭で定着した表現。
- source_word: μένει
  choice: とどまり
  rationale: ヨハネ文書で重要なμένωの持続的意味を保つ。「いる」より語義が明確で、「住む」より文脈に自然。
- source_word: σκάνδαλον
  choice: つまずきとなるもの
  rationale: 障害物、わな、つまずきの原因という比喩を、意味を狭めすぎず自然な日本語で表した。
- source_word: ἐν αὐτῷ
  choice: その人のうちには
  rationale: 男性単数代名詞を、直前の「愛する人」への指示として明示した。原文の前置詞句を直接的に反映する。
- source_word: οὐκ ἔστιν
  choice: ありません
  rationale: 存在を否定する構文として、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν の指示関係と意味
  choice: 愛する人のうちには、つまずきとなるものがない
  alternative: その人にとって、つまずきとなるものがない
  rationale: ἐν αὐτῷは「その人のうちに」とも、文脈上「その人にとって」とも理解され得る。本文では形に最も近い内在的な表現を採用し、本人がつまずかないという可能性は脚注に残して、原文の曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「兄弟」「光」「とどまる」「つまずき」というヨハネ文書の主要な語彙と比喩を維持した。
