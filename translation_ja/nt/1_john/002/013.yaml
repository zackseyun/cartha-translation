id: 1JN.2.13
reference: 1 John 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: ja
  text: 父たちよ、あなたがたに書きます。あなたがたが、初めからおられる方[a]を知っているからです。若者たちよ、あなたがたに書きます。あなたがたが、悪しき者に打ち勝ったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「初めからおられる方」は御子を指す可能性が高いが、より広く神を指すと取ることもできる。
    reason: 指示対象について原文が残している曖昧さを示すため。
lexical_decisions:
- source_word: γράφω
  choice: 書きます
  rationale: 手紙の現在という文脈に自然な日本語で、現在形の直接性と反復を保った。
- source_word: πατέρες
  choice: 父たちよ
  rationale: 比喩的に信仰上の成熟者を指す可能性はあるが、原語の呼びかけを解釈で「年長者」などに置き換えず、そのまま保った。
- source_word: ἐγνώκατε
  choice: 知っている
  rationale: 完了形が示す、すでに知り、その状態が続いていることを自然な現代日本語で表した。
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: 初めからおられる方
  rationale: 冠詞付き句の人格的な指示とヨハネ文書の表現を保ちつつ、御子か神かを本文で明示しなかった。
- source_word: νεανίσκοι
  choice: 若者たちよ
  rationale: 若い男性への呼びかけを、過度に説明的にならない自然な日本語で表した。
- source_word: νενικήκατε
  choice: 勝った
  rationale: 完了した勝利とその有効性を文脈から理解できる簡潔な日本語とし、ヨハネ文書での勝利の語感を保った。
- source_word: τὸν πονηρόν
  choice: 悪い者
  rationale: 男性単数の実体詞的用法に従って人格的な悪の敵対者として訳し、原文にない固有名「サタン」は補わなかった。
theological_decisions:
- issue: 「初めからおられる方」の指示対象
  choice: 本文では指示対象を明示しない
  alternative: 御子を明示する／より広く神を指すと解する
  rationale: ヨハネ文書の用法から御子を指す可能性が高いが、この節のギリシア語自体は名を挙げていないため、その神学的な含みを保持した。
- issue: 「悪い者」の意味
  choice: 人格的な悪の敵対者
  alternative: 抽象的な悪
  rationale: 男性単数の冠詞付き形容詞が実体詞として用いられており、人格的な指示対象が最も自然である。ただし原文以上に「サタン」と明示しなかった。
translation_notes:
  register: 明瞭で現代的ながら、呼びかけの荘重さを保つ文体とした。二度の「あなたがたに書きます」を省略せず、原文の並行構造を再現した。
