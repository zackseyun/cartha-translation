id: 1JN.2.14
reference: 1 John 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: ja
  text: 私はあなたがたに書きました、子どもたちよ。あなたがたが御父を知っているからです。[a] 私はあなたがたに書きました、父たちよ。あなたがたが初めからおられる方を知っているからです。[b] 私はあなたがたに書きました、若者たちよ。あなたがたが強く、神のことばがあなたがたのうちにとどまり、[c] 悪い者に勝っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「書きました」は、「書いた」とも訳せます。この表現はこの節で三度繰り返されています。
    reason: 時制・アスペクト上の別訳
  - marker: b
    text: 「初めからおられる方」は、ヨハネ文書の語法では先在する御子を指す可能性が高いですが、本文はその方を明示していません。
    reason: 指示対象の曖昧さ
  - marker: c
    text: 「とどまり」は、「宿っており」とも訳せます。
    reason: 語彙上の別訳
lexical_decisions:
- source_word: ἔγραψα
  choice: 私はあなたがたに書きました
  rationale: アオリストの書簡的用法と、三度繰り返される修辞的な型を自然な現代日本語で表した。単純過去とも現在完了的にも理解できるため、脚注で別訳を示した。
- source_word: παιδία
  choice: 子どもたちよ
  rationale: 親愛を込めた呼びかけとしての家族的比喩を保ちつつ、「小さい」など本文に必須でない意味を加えない。
- source_word: ἐγνώκατε
  choice: 知っている
  rationale: 完了形が示す、知るに至った結果として現在も続く確かな認識を、日本語として自然な状態表現で示した。
- source_word: τὸν πατέρα
  choice: 御父
  rationale: ヨハネ文書で神を指す称号であり、現代日本語の聖書的・敬語的表現として明瞭にした。
- source_word: πατέρες
  choice: 父たちよ
  rationale: 年齢や霊的成熟度だけに限定せず、原文の呼称と三群の対照を保持した。
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: 初めからおられる方
  rationale: 現在的な存在を表す句を尊敬表現で自然に訳し、キリストまたは御子と本文中で明示して曖昧さを解消することは避けた。
- source_word: νεανίσκοι
  choice: 若者たちよ
  rationale: 父たちとの年齢的対照を保つ自然な訳。ギリシア語は男性複数だが、日本語の「若者」は文脈上男性を含みつつ、過度に説明的にならない。
- source_word: ἰσχυροί
  choice: 強く
  rationale: 霊的・道徳的文脈に適した、直接的で自然な訳語。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 神からのメッセージ全般か、宣べ伝えられた福音かを限定せず、聖書で定着した表現を用いた。
- source_word: μένει
  choice: とどまり
  rationale: ヨハネ文書の重要語が持つ継続的な内住・持続の含みを保ち、現代日本語として自然にした。
- source_word: νενικήκατε
  choice: 勝っている
  rationale: 完了形が示す、すでに得た勝利とその継続的な効力を自然な日本語で表した。
- source_word: τὸν πονηρόν
  choice: 悪い者
  rationale: 冠詞付き男性形の人格的な指示を保ち、抽象的な「悪」とはしなかった。
theological_decisions:
- issue: 「初めからおられる方」の指示対象
  choice: 本文では「初めからおられる方」とし、明示しない
  alternative: 「キリスト」または「御子」と明示する／神一般を指すと解する
  rationale: ヨハネ文書の語法では先在する御子を指す可能性が高いが、この節自体は指示対象を名指ししていないため、その含みと曖昧さを保った。
- issue: 三つの呼びかけの性別と比喩性
  choice: 「子どもたち」「父たち」「若者たち」と訳す
  alternative: すべてを教会全体の霊的成熟段階を表す中性的な群として意訳する
  rationale: 原文の家族・年齢を用いた三つの呼称を保持し、それらが実年齢の区分か霊的成熟の比喩かを本文で決めつけない。
- issue: 悪い者の人格性
  choice: 「悪い者」と人格的に訳す
  alternative: 抽象的な「悪」と訳す
  rationale: τὸν πονηρόν は冠詞付き男性対格であり、この文脈では悪魔を指す人格的表現と取るのが最も自然である。ただし本文に「悪魔」を補わない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。呼びかけの反復を保ちつつ、日本語では理由節の長さを考慮して各文を「ので、私は…書きました」の語順に統一した。「御父」は神への称号として敬意を示し、「初めからおられる方」も自然な尊敬表現とした。すべての脚注記号を対応箇所の本文中に配置した。
