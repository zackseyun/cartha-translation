id: 1JN.2.6
reference: 1 John 2:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: ja
  text: 「その方のうちにとどまっている[a]」と言う者は、あの方[b]が歩まれた[c]とおりに、自らも歩むべきです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つながり続けている」とも訳せます。「とどまる」に当たるギリシア語μένωは、関係の中にあり続けることを表す、ヨハネ文書の重要な語です。
    reason: lexical_alternative
  - marker: b
    text: 「あの方」はイエスを指します。原文の指示代名詞ἐκεῖνοςの強調を保った表現です。
    reason: alternative_reading
  - marker: c
    text: ここで「歩む」とは、日々をどのように生きるかという生き方を表す聖書的な比喩です。つまり、イエスが生きられたように生きるべきだ、という意味です。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: 「……と言う者」
  rationale: 冠詞付き現在分詞の名詞的用法を、一般的・代表的な一人を指す自然な日本語で表した。
- source_word: ἐν αὐτῷ μένειν
  choice: 「その方のうちにとどまっている」
  rationale: μένωはヨハネ文書の重要語であり、関係の継続を含む。「とどまる」はその反復性を保ち、「うちに」によってἐνの結合・関係的な表現も残した。現在不定詞の継続的な含みは「とどまっている」で示した。
- source_word: ὀφείλει
  choice: 「べきです」
  rationale: ここで表される道徳的責務を、過度に法的にも絶対的にもせず、現代日本語として明確に示す。
- source_word: καθὼς
  choice: 「とおりに」
  rationale: 模範との対応・様態を自然かつ明確に表す。
- source_word: ἐκεῖνος
  choice: 「あの方」
  rationale: 単なる代名詞「彼」ではなく、指示代名詞の力を保つ。文脈上イエスを指すため、自然で敬意ある「方」を用いた。
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: 「歩まれた……歩む」
  rationale: 生活の仕方を表す聖書的な「歩む」という比喩を保持した。前者のアオリストと後者の現在不定詞の対照も、完了した模範と継続的責務として自然に伝わる。
- source_word: καὶ αὐτὸς
  choice: 「自らも」
  rationale: καίの付加的意味とαὐτόςによる主語の強調を、簡潔な日本語でともに表した。
theological_decisions:
- issue: αὐτῷとἐκεῖνοςの指示対象
  choice: 文脈上イエスを指すものとして「その方」「あの方」と訳す。
  alternative: 「彼のうちに」「彼が」とし、指示対象を文脈だけに委ねる。
  rationale: 直前の文脈ではイエス・キリストが念頭にあり、ἐκεῖνοςもその方を模範として示す。ただし原文にない固有名「イエス」を本文へ補わず、代名詞的表現を維持した。
- issue: キリストの歩みと信者の倫理的責務
  choice: 同じ動詞「歩む」を反復し、模範との対応を保つ。
  alternative: 「あの方が生きられたように、自分も生きる」と比喩を解消する。
  rationale: 原文は完全な同一性の説明ではなく、歩み方の対応を求めている。「歩む」という比喩を残すことで、その倫理的要求を弱めたり、具体的内容を訳者が限定したりすることを避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書的比喩「歩む」とヨハネ特有の「とどまる」を保持した。「歩まれた」は指示対象への自然な敬意を示す日本語であり、神性を示すための原文にない表記上の区別ではない。
