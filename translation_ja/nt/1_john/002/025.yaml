  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: ja
  text: そして、これが約束です。すなわち、その方ご自身が私たちに約束してくださった永遠のいのちです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その方ご自身」が父を指すか御子を指すかは、この節だけでは明示されていません。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὕτη ἐστὶν
  choice: そして、これこそ…です
  rationale: καίによる前文とのつながりと、指示代名詞αὕτηの提示的な強調を、自然な現代日本語で表した。
- source_word: ἡ ἐπαγγελία … ἐπηγγείλατο
  choice: 約束してくださったもの
  rationale: 同根の名詞と動詞による反復は日本語では直訳すると重くなるため、文全体を『約束してくださったもの』とまとめつつ、約束の内容を後続の同格句で明示した。敬語の『くださった』は、受益者が『私たち』であることを自然に示す。
- source_word: αὐτός
  choice: その方ご自身
  rationale: 強意的な代名詞の力を『ご自身』で保持しながら、父か御子かを本文で特定しないよう『その方』とした。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 約束の受け手を示す与格を、自然な間接目的語として訳した。
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: 永遠のいのち
  rationale: 前の『約束』の内容を示す同格の対格句。ヨハネ文書で定着した意味を保ち、現代の聖書語として明瞭な『永遠のいのち』とした。
theological_decisions:
- issue: αὐτός（その方ご自身）の指示対象
  choice: 父とも御子とも明示せず、『その方ご自身』とした。
  alternative: 『父ご自身』または『御子ご自身』と特定する。
  rationale: この節自体は指示対象を名詞で言い直しておらず、文脈上の解釈にも幅があるため、原文の曖昧さと神学的緊張を保持した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。『いのち』はヨハネ文書における神から与えられる生命という含みを保つため、ひらがな表記とした。原文の同格構造は『すなわち』で明示し、通常の読者にも約束の内容が分かるようにした。
