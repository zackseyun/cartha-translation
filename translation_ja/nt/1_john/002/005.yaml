  source_fidelity: 原文の不定的・一般的条件（ὃς δ’ ἂν…τηρῇ）を「しかし、だれでも…守るなら」と適切に表し、τηρέωの「守る」、λόγοςの「ことば」、完了受動形τετελείωταιの完成された結果状態を「全うされています」によってよく保持しています。二つのἐν τούτῳも、前者は人称的理解を本文に置き、後者は認識の根拠を示す「このことによって」としており、文脈と用法に合致します。
  naturalness: 全体として明瞭な現代標準日本語です。「その人のうちに、神の愛が真に全うされています」はやや文語的な響きを保ちますが、ヨハネ文書の格調と神学的語彙にふさわしく、不自然ではありません。
  terminology: 「ことばを守る」「神の愛」「全うされています」「その方のうちにいる」は、原文の反復・関係表現・属格の曖昧さを不必要に解釈せずに保っています。「神の愛」の両義性、および最初のἐν τούτῳの指示対象の幅も脚注で適切に扱われています。
