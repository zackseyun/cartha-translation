id: 1JN.2.5
reference: 1 John 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: ja
  text: しかし、だれでもその方のことばを守るなら、その人のうちに[a]、神の愛[b]が真に全うされています。このことによって、私たちは、自分たちがその方のうちにいることを知ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「この者のうちに」または「このことにおいて」。ことばを守る人を指すとも、ことばを守るという事実を指すとも取れます。
    reason: alternative_reading
  - marker: b
    text: 「神の愛」は、神が人を愛する愛とも、人が神を愛する愛とも取れます。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: しかし、だれでも…なら
  rationale: δέの穏やかな対比を「しかし」で示し、ἄνを伴う不定関係節の一般的条件を「だれでも…なら」で自然に表した。
- source_word: τηρῇ
  choice: 守る
  rationale: τηρέωが持つ「保つ、守る、従う」という幅を保ち、ヨハネ文書で「戒め」や「ことば」を守るという表現とのつながりも維持する。
- source_word: αὐτοῦ τὸν λόγον
  choice: その方のことば
  rationale: λόγοςの単数形とヨハネ的な語感を保つため「ことば」とし、αὐτοῦは敬意を含みつつ指示対象を過度に特定しない「その方」とした。
- source_word: ἀληθῶς
  choice: 真に
  rationale: 断定を強める副詞の働きを、現代日本語として明瞭で品位のある「真に」で表した。
- source_word: ἐν τούτῳ
  choice: その人のうちに
  rationale: 直前の「ことばを守る人」を指す人称的理解を自然な日本語で示した。ただし「このことにおいて」という事柄を指す可能性も脚注に残した。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 神の愛
  rationale: 属格の方向を限定せず、神からの愛と神に対する愛の双方を含み得る表現を本文に保持した。
- source_word: τετελείωται
  choice: 全うされています
  rationale: 完了受動形が示す、完成へ至らされ、その状態にあるという含みを表した。「全うする」はヨハネ文書における愛の完成・成就という語感も保つ。
- source_word: ἐν τούτῳ γινώσκομεν
  choice: このことによって…知ります
  rationale: 判断の根拠・しるしを導くヨハネ的定型句として、自然な日本語にした。
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: 自分たちがその方のうちにいること
  rationale: ἐν αὐτῷという重要な関係的表現を解釈的に「結ばれている」などと置き換えず、「その方のうちにいる」とした。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦにおける属格の意味
  choice: 神の愛
  alternative: 神が人を愛する愛／人が神を愛する愛
  rationale: ギリシア語は主格的属格と目的格的属格のいずれにも理解できる。本文では方向を決めず、両方の可能性を脚注で明示した。
- issue: 最初のἐν τούτῳの指示対象
  choice: その人のうちに
  alternative: このことにおいて／このことによって
  rationale: 直前の「だれでも」を受ける人称的解釈が文脈上自然であるため本文に採用したが、指示詞が「ことばを守ること」という事柄を指す可能性も排除せず脚注に示した。
- issue: τετελείωταιの完成概念
  choice: 全うされています
  alternative: 完成しています／目標に達しています
  rationale: 愛が完全無欠になったとの抽象的主張に狭めず、目的へと完成させられた状態を表す完了受動の含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨハネ文書に特徴的な「ことばを守る」「その方のうちにいる」「愛が全うされる」という表現を保持した。神またはキリストを指し得る代名詞は「その方」とし、本文だけで指示対象を過度に限定していない。
