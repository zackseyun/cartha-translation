id: 1JN.2.11
reference: 1 John 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: ja
  text: しかし、自分の兄弟[a]を憎む者は、闇の中にいて、闇の中を歩んでいます。そして、自分がどこへ行くのか分かりません。闇がその人の目を見えなくしたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」は、ここでは「兄弟または姉妹」、すなわちキリストを信じる共同体の仲間を指すと考えられます。ギリシア語は「兄弟」です。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: 憎む者
  rationale: 定冠詞を伴う現在分詞を名詞的に訳し、一時的な行為というより、その人を特徴づける継続的な姿勢を自然な日本語で表した。
- source_word: ἀδελφὸν
  choice: 自分の兄弟
  rationale: ギリシア語の男性単数形を本文で保った。「自分の」は αὐτοῦ の関係を自然に示す。共同体内の仲間を広く指し得る点は脚注で補足した。
- source_word: ἐν τῇ σκοτίᾳ
  choice: 闇の中に／闇の中を
  rationale: ヨハネ文書で道徳的・神学的な領域を表す「闇」の比喩と、原文における二度の反復を保持した。日本語の助詞は、それぞれ ἐστίν と περιπατεῖ に合わせた。
- source_word: περιπατεῖ
  choice: 歩んでいます
  rationale: 生活や行動を表す聖書的な「歩む」という比喩を保ちつつ、現代日本語として自然な形にした。
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: 自分がどこへ行くのか分かりません
  rationale: 進行方向が分からないという移動のイメージを保ち、自然な現代日本語にした。
- source_word: ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: その人の目を見えなくした
  rationale: アオリストの動作を過去形で示し、目という具体的な比喩を保った。「盲目にした」よりも平明で自然な表現を選んだ。
theological_decisions:
- issue: ヨハネ的な光と闇の対比における σκοτία の意味
  choice: 「闇」と比喩的に訳す
  alternative: 「悪」「罪の闇」と説明的に訳す
  rationale: 原文の象徴的な広がりと光との対比を保持し、特定の教理的説明へ狭めないため。
- issue: ἀδελφός の指示対象
  choice: 本文では「兄弟」を保持し、脚注で共同体内の男女を含み得ることを示す
  alternative: 本文を「兄弟姉妹」または「信仰の仲間」とする
  rationale: 原文の男性単数形を尊重しながら、文脈上の代表的・包括的な指示範囲を読者に明らかにするため。
- issue: 闇による盲目化の主体性
  choice: 「闇がその人の目を見えなくした」と、闇を文法上の主語として保つ
  alternative: 「闇のために目が見えなくなった」と因果的に言い換える
  rationale: 原文は ἡ σκοτία を主語として擬人的に描いているため、その強いイメージを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヨハネ特有の「闇」と「歩む」の比喩、および原文の反復を残した。脚注記号は節末に置き、本文全体に関わる「兄弟」の指示範囲を補足する。
