source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: ja
  text: 世[a]も、その欲望[b]も、過ぎ去りつつあります。しかし、神のみこころを行う人は、永遠にとどまります[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「世」は、単に物質的な世界というより、直前の文脈で描かれる、神に背く欲望や価値観を持つ人間世界を指します。
    reason: contextual_sense
  - marker: b
    text: 「欲望」は強い欲求を表し、ここでは否定的な意味です。性的な欲望だけに限られません。
    reason: lexical_alternative
  - marker: c
    text: 「とどまります」と訳したギリシア語は、ヨハネ文書で「つながっている」「住む」「とどまり続ける」などの意味にも用いられる重要な語です。
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: 世
  rationale: ヨハネ文書で定着した簡潔な訳語であり、直前の2章15–16節では、単なる被造世界ではなく、神に背く価値観と欲望に支配された人間世界を指す。訳文では原語の広がりを保つため「世」とした。
- source_word: παράγεται
  choice: 過ぎ去りつつあります
  rationale: 現在形が示す進行中の推移を表し、世が永続せず、現に過ぎ去りつつあるという対比を明確にする。
- source_word: ἐπιθυμία αὐτοῦ
  choice: 世の欲望
  rationale: ἐπιθυμίαは文脈上否定的な強い欲求を指すが、性的な意味だけには限定されない。「世の欲望」は属格代名詞αὐτοῦと直前のκόσμοςとの関係も自然な日本語で示す。
- source_word: ὁ δὲ ποιῶν
  choice: しかし、…行う人は
  rationale: 実質的に名詞として働く現在分詞を、継続的・特徴的に神のみこころを行う者を表す自然な現代日本語にした。δὲの対照は「しかし」で明示した。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 神のみこころ
  rationale: 「神の意志」よりも自然で尊厳ある聖書日本語であり、神が望み定められることというθέλημαの意味を伝える。
- source_word: μένει
  choice: とどまります
  rationale: ヨハネ文書で重要なμένωの継続性を保ち、「存在し続ける」より簡潔に、世が過ぎ去ることとの対照を表す。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: この文脈では終わりのない持続を表す慣用句であり、現代日本語として自然に訳した。
theological_decisions:
- issue: κόσμοςが指す範囲
  choice: 神に背く欲望と価値観を持つ、過ぎ去る「世」
  alternative: 物質的な被造世界そのもの
  rationale: 直前の2章15–16節が「世にあるもの」を欲望や誇りによって説明しているため、ここでも倫理的・神学的な意味が中心である。ただし訳語は原語の幅を狭めず「世」とした。
- issue: μένει εἰς τὸν αἰῶναの意味
  choice: 神のみこころを行う人が永遠に存続すること
  alternative: 永遠のいのちについての仕組みを明示した表現
  rationale: 原文は永続を力強く述べるが、その教理的な仕組みまでは説明していないため、「永遠にとどまります」として明示以上の内容を加えなかった。
- issue: 「神のみこころを行う」と永続との関係
  choice: 原文どおり対照と結び付きを述べる
  alternative: 行いを永遠の存続の功績的原因と明示する、または単なる結果と明示する
  rationale: 本文は両者を結び付けるが、因果関係の仕組みを詳述しない。訳文でもその神学的緊張を解消せず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと尊厳を保った。「みこころ」は一般読者にも理解可能な慣用的聖書語としてひらがな表記にし、「過ぎ去りつつあります」で原文現在形の進行性を示した。
