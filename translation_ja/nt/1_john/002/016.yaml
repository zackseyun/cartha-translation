id: 1JN.2.16
reference: 1 John 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: ja
  text: なぜなら、世にあるすべてのもの、すなわち肉の欲望[a][b]、目の欲望、生活上の高ぶり[c]は、御父から出たものではなく、世から出たものだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉の情欲」とも訳せます。ここで「欲望」と訳したギリシア語は、強い願い、渇望、情欲を意味し得ますが、性的な欲求だけを指すとは限りません。
    reason: lexical_alternative
  - marker: b
    text: 「罪深い人間性の欲望」と理解することもできます。ギリシア語の「肉」は、文脈によっては、罪に傾いた人間の性質を比喩的に指します。
    reason: alternative_reading
  - marker: c
    text: 「生活の見栄」または「財産や暮らし向きを誇ること」とも訳せます。地位、所有物、生活様式についての尊大さや虚勢を含み得る表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: だからです
  rationale: 前節の「世を愛してはならない」という命令の理由を示す接続語であるため、節末で因果関係を自然な日本語として表した。
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: 世にあるすべてのもの
  rationale: 中性単数の集合的表現を、包括性を保つ明瞭な現代日本語にした。
- source_word: κόσμος
  choice: 世
  rationale: 神に対立する人間世界の秩序という文脈上の含みを残しつつ、解釈を本文に付加せず、標準的な訳語を用いた。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 文脈上否定的な強い願望を表す。「情欲」より意味を性的欲求に限定せず、「欲求」より否定的な力を明確に伝える。
- source_word: σάρξ
  choice: 肉
  rationale: 比喩的に堕落した人間性を指す可能性を本文で一義的に確定せず、ヨハネ書簡の神学的な緊張を保った。
- source_word: ὀφθαλμοί
  choice: 目
  rationale: 原文の身体語彙と「肉の欲望」との並行構造をそのまま保った。
- source_word: ἀλαζονεία
  choice: 高ぶり
  rationale: 尊大さ、虚勢、誇示を含む否定的な語であるため、単に肯定的にもなり得る「誇り」より文脈に適した語を選んだ。
- source_word: βίος
  choice: 生活
  rationale: ここでは生命そのものよりも、暮らし方、暮らし向き、財産などを含み得る。簡潔で広がりのある「生活」とした。
- source_word: ἐκ τοῦ πατρός / ἐκ τοῦ κόσμου
  choice: 御父から出たもの／世から出たもの
  rationale: ἐκが示す源・由来を明確にし、原文の対照的な並行表現を保った。
- source_word: πατήρ
  choice: 御父
  rationale: 神を指す関係的な呼称として、敬意を伴う自然なキリスト教日本語を用いた。
theological_decisions:
- issue: 道徳的文脈におけるσάρξの解釈
  choice: 肉
  alternative: 罪深い人間性
  rationale: 原文の比喩を保持し、身体そのものと堕落した人間性との意味の緊張を本文で解消しないため。別の理解は脚注に示した。
- issue: κόσμοςの神学的意味
  choice: 世
  alternative: 神に逆らうこの世の秩序
  rationale: 文脈では御父に対立する秩序を指すが、その解釈を説明的な訳語として本文に織り込まず、原語の広がりを保った。
- issue: ἀλαζονεία τοῦ βίουの範囲
  choice: 生活上の高ぶり
  alternative: 財産や暮らし向きを誇ること
  rationale: 地位、所有物、生活様式に関する尊大さや虚勢を含み得るが、どれか一つに限定せず、原文の曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」で三項目が「世にあるすべてのもの」の説明であることを示し、「御父から／世から」の対照を反復して原文の構造を保った。
