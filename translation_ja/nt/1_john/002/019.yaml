source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: ja
  text: 彼らは私たちの中から[a]出て行きましたが、私たちに属する者ではありませんでした。もし私たちに属する者であったなら、私たちとともにとどまっていたはずです。しかし、それは、彼らについて、彼らの全員が私たちに属する者なのではないことが明らかにされるためでした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「私たちから」。ここでは、彼らが私たちの共同体の中から出て行ったことを表します。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼らが明らかにされるため」。また、「明らかにされる」は「明らかになる」「示される」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: 私たちの中から／私たちに属する者
  rationale: 最初の用例では共同体からの離脱を表すため「私たちの中から」とし、後続の用例では帰属・同一性の含みを自然な日本語で示すため「私たちに属する者」とした。同じギリシア語句の反復が持つ関連性は保ちつつ、日本語で意味が通るよう文脈に応じて訳し分けた。
- source_word: ἐξῆλθαν
  choice: 出て行きました
  rationale: 動詞そのものに「背教した」などの解釈を加えず、共同体から離れたという具体的な移動の比喩を保った。
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: 私たちに属する者ではありませんでした
  rationale: 単なる出身ではなく、共同体への実質的な帰属を表す文脈上の意味を明瞭にした。ただし「真の信者ではなかった」など、本文を越える教理的説明には踏み込んでいない。
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: 私たちとともにとどまっていたはずです
  rationale: 過去の事実に反する条件の帰結を「はずです」で自然に表し、ヨハネ文書で重要な μένω の語感を「とどまる」によって保った。
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: しかし、…ことが明らかになるために、こうなったのです
  rationale: φανερόω の受動形を「明らかになる」とし、主節が省略されたギリシア語を自然な日本語にするため「こうなったのです」を補った。目的と結果の両方を含み得る ἵνα の緊張は「ために」によって保持した。
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: 彼らが皆、私たちに属する者ではないこと
  rationale: πάντες を「皆」と明示し、離脱した者たちについて帰属の欠如が明らかになったという文脈を保った。否定と「皆」の作用域には表現上の余地があるため脚注で別の取り方も示した。
theological_decisions:
- issue: 「私たちに属する者」を、可視的教会と不可視的教会、あるいは救済の有無に関する後代の教理用語で限定するか
  choice: 共同体的・関係的な表現「私たちに属する者」を用いる
  alternative: 「本当の信者」「真に救われた者」「本当の教会員」などと明示する
  rationale: 本文は離脱と真正な帰属を区別しているが、後代の体系神学的区分を明示してはいない。そのため、神学的緊張を残し、特定教派の理解を訳文に持ち込まない。
- issue: ἵνα 節を神の目的としてのみ断定するか、出来事の結果として読む余地を残すか
  choice: 「明らかになるために」と訳し、目的を示しながら結果の含みも排除しない
  alternative: 「明らかになったのです」と結果だけを明示する
  rationale: ἵνα は基本的に目的を表すが、この文脈では結果的な顕現のニュアンスもあり得る。訳文で一方に狭く固定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。敬体で統一し、「とどまる」「明らかになる」など原文の主要語彙の反復と神学的含意を保った。補足語「こうなったのです」は、省略の多いギリシア語構文を日本語として完結させる最小限の補充である。
