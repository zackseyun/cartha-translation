id: 1JN.2.23
reference: 1 John 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: ja
  text: 御子を否定する者は皆、御父をも持っていません。御子を言い表す者は、御父をも持っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「御子を言い表す者は、御父をも持っています」がありません。
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: 否定する者は皆
  rationale: 冠詞付き現在分詞の一般的・包括的な意味を、自然な現代日本語で表した。継続的または典型的な態度を示し得る原文の幅も保っている。
- source_word: ἀρνούμενος
  choice: 否定する
  rationale: 告白をめぐる文脈で、御子の身分や真実を認めず退けることを表す。『拒絶する』『縁を切る』などの付加的な含みを避けた。
- source_word: τὸν υἱὸν
  choice: 御子
  rationale: 原文どおり『神の御子』と補わず、キリスト論的称号として簡潔に訳した。
- source_word: οὐδὲ
  choice: も…ない
  rationale: 御子を否定する者は御父をも持たない、という連動する否定を日本語として自然に示す。
- source_word: τὸν πατέρα ἔχει
  choice: 御父を持っている
  rationale: ヨハネ文書特有の『持つ』という強い表現を保ち、『交わりがある』『御父に属する』など一つの関係概念に限定しなかった。
- source_word: ὁ ὁμολογῶν
  choice: 言い表す者
  rationale: ὁμολογέωの、公に認めて表明するという告白的な意味を示す。単に内面的に『認める』より明示的で、現代日本語としても理解しやすい。
- source_word: καὶ
  choice: も
  rationale: 前半との対照において、御子を言い表す者が御父をも持つという対応関係を自然に表す。
theological_decisions:
- issue: 校訂本文で括弧が付された後半の節
  choice: 『御子を言い表す者は、御父をも持っています』を本文に含める
  alternative: 異読に従って後半の節を省く
  rationale: 提示されたSBLGNT本文は異読の存在を示しつつもこの節を収録しているため、本文で訳し、写本上の相違は脚注で明示した。
- issue: 『御父を持つ』の関係的意味
  choice: 原文の『持つ』という表現をそのまま保つ
  alternative: 『御父と交わりを持つ』または『御父に属する』と説明的に訳す
  rationale: 御子を告白することと御父を持つことの不可分性を保ち、その関係を特定の教理的説明へ狭めないため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。神学的称号として『御子』『御父』を対応させ、原文の反復と対照構造を保った。
