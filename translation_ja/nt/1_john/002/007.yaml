id: 1JN.2.7
reference: 1 John 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: ja
  text: 愛する皆さん、私はあなたがたに、新しい戒めを書いているのではなく、あなたがたが初めから持っていた古い戒めを書いています。その古い戒めとは、あなたがたが聞いたことば[a]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は、「知らせ」または「教え」とも訳せる。
    reason: λόγοςはここで読者が聞いた宣教・教えの内容を指し得る一方、「ことば」という語形とヨハネ文書での響きも持つため。
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 愛する皆さん
  rationale: 複数への親愛を込めた呼びかけ。語根の「愛する」と牧会的な温かさを保ちつつ、現代の一般読者にも自然な表現とした。
- source_word: ἐντολήν
  choice: 戒め
  rationale: ヨハネ文書で神学的な重みを持つ語であり、「命令」よりも聖書内の関連性を保ちやすい。
- source_word: καινήν
  choice: 新しい
  rationale: παλαιάνとの明確な対比をそのまま示す。
- source_word: γράφω
  choice: 書いています
  rationale: 手紙を現在書いている行為を表す現在形として、自然な日本語にした。
- source_word: παλαιάν / παλαιά
  choice: 古い
  rationale: 「新しい」との直接的な対比を保ち、以前から受けていた戒めであることを示す。
- source_word: εἴχετε
  choice: 持ってきた
  rationale: 過去から継続して所有してきたことを表す未完了過去の含みを、自然な日本語で示す。
- source_word: ἀπ’ ἀρχῆς
  choice: 初めから
  rationale: 何の初めかを限定せず、ヨハネ特有の表現が持つ広がりと曖昧さを保つ。
- source_word: λόγος
  choice: ことば
  rationale: 聞いた内容を指すと同時に、ヨハネ文書での語彙的な響きを保つ。「知らせ」や「教え」と理解する余地は脚注に示した。
- source_word: ἠκούσατε
  choice: 聞いた
  rationale: 過去にそのことばを受け聞いた出来事を、アオリストに即して簡潔に表す。
theological_decisions:
- issue: 「初めから」（ἀπ’ ἀρχῆς）が指す時点
  choice: 「初めから」とし、具体的な時点を限定しない
  alternative: 「信仰を持った初めから」または「福音が宣べ伝えられた初めから」
  rationale: 文脈上は読者が教えを受けた当初が考えられるが、本文自体は明示していないため、その幅を残した。
- issue: 古い戒めと、聞いた「ことば」との関係
  choice: 両者を本文どおり直接同定する
  alternative: 周辺文脈に基づいて「互いに愛するという教え」などと補足する
  rationale: ギリシア語本文は古い戒めを聞いたことばと等置しているが、その内容をこの節では明示していないため、説明を加えず緊張関係を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、親愛を込めた呼びかけと書簡らしい品位を保った。「あなたがた」は複数の宛先を明示し、「戒め」は聖書内の語彙的連関を保つため採用した。
