id: 1JN.2.2
reference: 1 John 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: ja
  text: この方ご自身が、私たちの罪のための贖いのいけにえです。私たちのためだけでなく、全世界のためでもあります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: この方ご自身
  rationale: 強意用法を「ご自身」で表し、直前の文脈で指し示されるイエスご本人の役割を強調した。「この方」は現代日本語として自然で、敬意も保つ。
- source_word: ἱλασμός
  choice: 贖いのいけにえ
  rationale: 罪を取り除くことと神との関係を回復するための犠牲という意味領域を、専門語だけに頼らず伝える。「なだめ」「償い」という解釈上の幅は脚注に残した。
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: 私たちの罪のための
  rationale: ἱλασμόςとの結びつきにおける περί を、簡潔で自然な「〜のため」とした。
- source_word: τῶν ἡμετέρων
  choice: 私たちの罪のためだけでなく
  rationale: ギリシア語では「私たちのもの」が省略表現として先行する「罪」を受けるため、日本語では意味を明確にするため「私たちの罪」を補った。
- source_word: ὅλου τοῦ κόσμου
  choice: 全世界の罪
  rationale: ὅλου の包括性を「全世界」で保ち、特定の集団に限定しなかった。「罪」は前節から補って自然な日本語とした。
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: 〜だけでなく、〜でもあります
  rationale: 否定と追加の対照構文を、明瞭で自然な現代日本語に再現した。
theological_decisions:
- issue: 「全世界」の範囲
  choice: 限定を加えず「全世界」と訳す。
  alternative: 「世界中の人々」「世界中の選ばれた者たち」などと解釈的に限定する。
  rationale: ギリシア語の包括的な表現をそのまま保ち、特定の教派的理解によって範囲を狭めないため。
- issue: ἱλασμός の贖罪用語
  choice: 本文では「贖いのいけにえ」とする。
  alternative: 「なだめの供え物」「償い」「罪を取り除くもの」とする。
  rationale: 犠牲を通した贖罪という中心的意味を分かりやすく示しつつ、神の怒りをなだめる側面か罪を除去する側面かという語義上・神学上の緊張は脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方ご自身」で強意を表し、後半では省略された「罪」を補って、日本語で指示対象が曖昧にならないようにした。
