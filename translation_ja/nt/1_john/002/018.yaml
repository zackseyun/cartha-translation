  to: 子どもたち、終わりの時です。あなたがたが反キリストが来ると聞いていたとおり、今や多くの反キリストが現れています[b]。このことから、私たちは終わりの時だと分かります。
  rationale: 原文にない冒頭の「今は」を除き、νῦν の強調を「今や」に保った。結論部では一人称複数を明示した。脚注aは、単数・無冠詞という原文上の観察を保ちつつ、その指示対象を特定の人物にも単なる類型にも決めない説明へ整えた。
