source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: ja
  text: 子どもたち、終わりの時です。あなたがたが反キリストが来ると聞いていたとおり、今や多くの反キリストが現れています[b]。このことから、私たちは終わりの時だと分かります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「生じています」「現れて、今も存在しています」。ギリシャ語の完了形は、多くの反キリストがすでに現れ、今もいることを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: 子どもたち
  rationale: 信徒に対する親愛を込めた呼びかけ。過度に幼さを強調せず、ヨハネ文書の家族的・牧会的な語調を保つ。
- source_word: ἐσχάτη ὥρα
  choice: 終わりの時
  rationale: 終末的な最終段階を示す時間表現。「一時間」という字義に狭めず、比喩的な時間性を自然な現代日本語で保つ。
- source_word: καθὼς
  choice: とおり
  rationale: 以前に聞いた内容と現在の事態との対応関係を明確に示す。
- source_word: ἠκούσατε
  choice: 聞いていた
  rationale: 読者が以前に教えとして聞いていたことを、日本語の文脈に自然な形で表す。
- source_word: ἀντίχριστος
  choice: 反キリスト
  rationale: ヨハネ文書に固有の語彙的つながりを保つ定着した訳語。日本語では冠詞の有無を明示できないため、単数形の指示範囲を本文で限定しない。
- source_word: ἔρχεται
  choice: 来る
  rationale: 現在形が持つ将来に向かう予期を、引用内容として自然に表す。
- source_word: καὶ νῦν
  choice: 今や
  rationale: 予期されていた単数の反キリストと、すでに現に存在する多数の反キリストとの対照を強調する。
- source_word: ἀντίχριστοι πολλοὶ
  choice: 多くの反キリスト
  rationale: 単数形と同じ訳語を保ち、意図的な単数・複数の対照を明瞭にする。
- source_word: γεγόνασιν
  choice: 現れています
  rationale: 完了形が示す、すでに出現して今も存在している結果状態を自然な日本語で伝える。
- source_word: ὅθεν
  choice: このことから
  rationale: 直前に述べた多数の反キリストの出現を、判断の根拠として明示する。
- source_word: γινώσκομεν
  choice: 分かります
  rationale: 証拠から認識するという文脈に合い、平明で自然な日本語となる。
theological_decisions:
- issue: 「終わりの時」の意味
  choice: 救済史の決定的な最終段階を示す終末的表現として、本文では「終わりの時」とする。
  alternative: 文字どおり差し迫った短い時点、または単なる危機の修辞表現と限定する。
  rationale: 反キリストへの言及は終末的含意を持つが、本文自体は詳細な終末論の時系列を定めていないため、その幅を残す。
- issue: 単数の「反キリスト」と複数の「反キリスト」の関係
  choice: 予期される単数形と、現在現れている複数形をそのまま併置する。
  alternative: 単数形を単なる類型に限定する、または明確に特定された一個人であると訳文に加える。
  rationale: 原文の意図的な緊張関係を保ち、特定の終末論体系によって調和させない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、牧会的な呼びかけと終末的な厳粛さを両立させた。「です・ます」調で読者への直接的な語りかけを保ち、単数と複数の「反キリスト」の語彙的連続性を維持した。
