id: 1JN.2.15
reference: 1 John 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: ja
  text: 世も、世にあるものも、愛してはなりません。だれかが世を愛しているなら、その人のうちに父の愛はありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父の愛」は、「父への愛」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: 愛してはなりません
  rationale: μήを伴う現在命令形を、継続中の行為の中止と限定せず、一般的な禁止として自然で格調ある現代日本語にした。
- source_word: τὸν κόσμον
  choice: 世
  rationale: κόσμοςの広がりを保ち、被造世界そのものと断定せず、文脈上、神に背く人間の秩序を指しうる聖書日本語として訳した。
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: 世にあるものも
  rationale: μηδέの付加的な否定を「も」で簡潔に表し、世とその中にあるものの双方を愛することへの禁止を保持した。
- source_word: ἐάν τις ἀγαπᾷ
  choice: だれかが世を愛しているなら
  rationale: 不定代名詞τιςの包括性を「だれか」で表し、現在接続法の継続的な様相を不自然にならない範囲で「愛している」とした。
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: 御父への愛
  rationale: 属格は形式上曖昧だが、世への愛との対比から、御父を対象とする愛が最も自然である。日本語の「御父の愛」は通常、御父が与える愛と強く読まれるため、本文では文脈上有力な意味を採り、別解を脚注に示した。
- source_word: ἐν αὐτῷ
  choice: その人のうちに
  rationale: ギリシア語の男性単数形は総称的であり、日本語では性を限定しない「その人」が自然かつ正確である。
theological_decisions:
- issue: ヨハネ倫理における「世」の意味
  choice: 解釈的な言い換えを加えず「世」とした。文脈上は神に背く秩序を指す。
  alternative: この世の秩序／世俗の体制
  rationale: 被造世界や人々への愛そのものを禁じると狭く断定せず、語の神学的な広がりと文脈による限定を保つため。
- issue: ἡ ἀγάπη τοῦ πατρὸς の属格
  choice: 御父への愛
  alternative: 御父の愛
  rationale: 世を愛することとの対比は、御父に向けられる愛という客観的属格の理解を強く支持する。ただし、御父から出る愛という主観的属格の可能性も文法上残るため、脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「世」「御父」「うちに」によって聖書本文としての簡潔さと品位を保った。総称的な男性形は、日本語として自然な「その人」で表した。
