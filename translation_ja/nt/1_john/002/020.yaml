  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: ja
  text: しかし、あなたがたは聖なる方から油注ぎを受けており、皆、知っています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の本文では、「そして、あなたがたはすべてのことを知っています」。SBLGNTの本文は「そして、あなたがたは皆、知っています」を支持する。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: しかし
  rationale: 通常は「そして」だが、直前に述べられた反キリスト者との対照を自然な日本語で示す。
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された代名詞の対照的な強調を、主題を立てる「は」によって表した。
- source_word: χρῖσμα ἔχετε
  choice: 油を注がれており
  rationale: 直訳的な「油注ぎを持っている」より自然な日本語にしつつ、χρῖσμαの油注ぎの比喩を保持した。聖霊と明示する解釈は本文に加えていない。
- source_word: ἀπὸ τοῦ ἁγίου
  choice: 聖なる方から
  rationale: 称号をそのまま訳し、父なる神か御子かを翻訳で特定しない。
- source_word: καὶ
  choice: そして／文脈上の接続
  rationale: 前半と後半を結ぶ接続辞。日本語では「おり」によって自然に接続したため、独立した「そして」は置かなかった。
- source_word: οἴδατε
  choice: 知っています
  rationale: 知識・認識を表す基本的で自然な現代日本語とした。目的語が本文にないことも保持した。
- source_word: πάντες
  choice: 皆
  rationale: SBLGNTの主格複数形として、「すべてのこと」ではなく、読者全員を指す語として訳した。
theological_decisions:
- issue: 「聖なる方」の指示対象
  choice: 「聖なる方」のまま保持した。
  alternative: 父なる神、または御子イエスと特定する。
  rationale: 本文は指示対象を明示しておらず、翻訳で一方に限定すると原文の神学的な余地を失うため。
- issue: χρῖσμαの意味
  choice: 「油を注がれて」と比喩を保持した。
  alternative: 「聖霊を受けて」「聖霊による油注ぎを受けて」と説明する。
  rationale: 文脈上、聖霊またはその働きを指す可能性は高いが、原文自体はχρῖσμαという油注ぎの表現を用いているため、解釈を本文に織り込まなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「油注ぎを持つ」という不自然な直訳を避け、受け身表現で比喩を保った。「皆、知っています」は目的語を補わず、原文の簡潔さと曖昧さを維持している。
