  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: ja
  text: 光の中にいると言いながら、自分の兄弟を憎んでいる人は、今なお闇の中にいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の兄弟姉妹」とも訳せます。ギリシア語は男性単数の「兄弟」ですが、この倫理的文脈では男女を含めて代表的に用いられている可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: 言いながら……人
  rationale: 定冠詞を伴う現在分詞を、ある特徴を持つ代表的な人を指す自然な日本語で表した。後続の分詞 μισῶν との同時的な対照も「ながら」で明確にした。
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: 光の中にいる
  rationale: ヨハネ文書に特徴的な光の比喩と、ある領域・状態の内にあるという表現を保った。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟
  rationale: 男性単数形を本文では字義に沿って訳し、信仰共同体における代表的・包括的用法の可能性は脚注に示した。「自分の」は主語との関係を自然に明示する。
- source_word: μισῶν
  choice: 憎んでいる
  rationale: 現在分詞が示す継続的・特徴的な態度を自然な現代日本語で表した。
- source_word: ἐν τῇ σκοτίᾳ ἐστὶν
  choice: 闇の中にいます
  rationale: 「光の中」との対照とヨハネ的な象徴表現を保持した。文体上、人物について述べるため丁寧な「います」を用いた。
- source_word: ἕως ἄρτι
  choice: 今なお
  rationale: 現在に至るまでその状態が続いているという時間的・継続的意味を、簡潔で自然な日本語にした。
theological_decisions:
- issue: ἀδελφός の代表的単数としての範囲
  choice: 兄弟
  alternative: 兄弟姉妹、または信仰の仲間
  rationale: 本文では男性単数という原文の形を保つ一方、この倫理的文脈では男女を含めて代表的に用いられ得ることを脚注で明示した。「信仰の仲間」は文脈上あり得るが、語義の範囲を本文で確定しすぎるため採用しなかった。
- issue: ἕως ἄρτι の時間的強調
  choice: 今なお
  alternative: 今に至るまで
  rationale: 単に現在の状態を述べるだけでなく、その状態が現在まで変わらず続いている含意を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、光と闇の厳粛な対照を保った。「と言いながら」によって、口での主張と実際の態度との食い違いを自然に示した。
