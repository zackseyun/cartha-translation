id: 1JN.2.8
reference: 1 John 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: ja
  text: また、私はあなたがたに新しい戒めを書いています。このことは、その方においても、あなたがたにおいても真実です[a]。闇は過ぎ去りつつあり、まことの光がすでに輝いているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことは、それにおいても、あなたがたにおいても真実です」。代名詞を人格的な「その方」ではなく、戒めを指す「それ」と取ることもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: また
  rationale: 前節の「古い戒め」と対照をなしつつ、別の意味では「新しい戒め」であると述べ直す展開を、簡潔で自然な接続語によって保った。
- source_word: ἐντολὴν καινὴν
  choice: 新しい戒め
  rationale: καινόςが表す質的な新しさを伝え、ヨハネ文書における定着した表現とのつながりも保つ。
- source_word: γράφω
  choice: 書いています
  rationale: 手紙を書いている現在の行為を表すギリシア語現在形を、現代日本語で自然に表現した。
- source_word: ὅ ἐστιν ἀληθές
  choice: このことは……真実です
  rationale: 中性関係代名詞が直前の戒めまたは命題全体を受ける構文を「このこと」で示し、ἀληθέςの「真実である／実在的である」という含みを過度に説明せず保った。
- source_word: ἐν αὐτῷ
  choice: その方において
  rationale: 文脈上キリストを指す可能性が最も高いため人格的な表現としたが、原文に固有名がないことを尊重して「キリスト」と明示せず、別解を脚注に残した。
- source_word: ἐν ὑμῖν
  choice: あなたがたにおいて
  rationale: 「あなたがたの内に」と「あなたがたの間で」の双方に開かれたἐνの関係性を、対応する簡潔な表現で保った。
- source_word: ἡ σκοτία παράγεται
  choice: 闇は過ぎ去りつつあり
  rationale: 闇が消え去る進行中の過程を、現在形の継続的な相を保って表した。
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: まことの光
  rationale: ヨハネ文書に特徴的な「真にその名に値する光」という表現を、自然で格調ある定訳的表現で伝えた。
- source_word: ἤδη φαίνει
  choice: すでに輝いている
  rationale: 光が今すでに輝いているという実現済みの側面と、現在続く状態の双方を表した。
theological_decisions:
- issue: αὐτῷの指示対象
  choice: 人格的な「その方」、文脈上はキリストを指すと理解する
  alternative: 戒めを指す「それ」
  rationale: 男性形の代名詞とヨハネ文書の文脈から人格的指示が有力だが、関係節全体の係り方には議論の余地があるため、本文で固有名を補わず、非人格的な解釈を脚注に明記した。
- issue: 光と闇の時間的関係
  choice: 闇が過ぎ去る途上にあり、まことの光はすでに輝いている
  alternative: 闇が完全に消滅し、光だけが存在している
  rationale: 二つの現在形とἤδηをそのまま反映し、現在の実現と未完了の推移が併存する終末論的緊張を解消しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「戒め」「まことの光」などヨハネ文書の主要語には簡潔で格調ある表現を採用した。「において」はやや改まった語だが、二つのἐν句の並行関係と解釈上の幅を保つために用いた。
