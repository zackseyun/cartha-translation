base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: ja
  text: 私たちが彼の戒めを守るなら、私たちはそれによって、彼を知るようになった[a]ことを知ることができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼を知った」。ギリシア語の完了形には、「彼を知るようになり、今も知っている」という意味合いがあると考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: それによって
  rationale: 何を根拠・しるしとして知るのかを示すヨハネ特有の表現。日本語では「それによって」が自然で、指示語の働きも保てる。
- source_word: γινώσκομεν
  choice: 分かります
  rationale: 現在の認識や確信を表す現在形。後続の内容を認識するという文脈に合わせ、自然な現代日本語とした。
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: 彼を知るようになったこと
  rationale: 完了形は、知るに至った出来事と、その結果が現在まで続くことを示しうる。「知るようになった」はこの起動的・結果的な意味合いを自然に表す。
- source_word: αὐτόν
  choice: 彼
  rationale: ギリシア語は代名詞のみを用いているため、「神」または「キリスト」と明示せず、原文の指示対象の余地を保つ。
- source_word: ἐὰν
  choice: なら
  rationale: 証拠または試金石となる条件を導く。現代日本語として簡潔で自然な条件表現。
- source_word: ἐντολάς
  choice: 戒め
  rationale: ヨハネ文書における道徳的・契約的な重みを保ちつつ、日本語の聖書文体として定着し、一般読者にも理解しやすい。
- source_word: τηρῶμεν
  choice: 守る
  rationale: 単なる外面的服従だけでなく、大切に保ち、実行するというτηρέωの意味領域を自然に伝える。
theological_decisions:
- issue: αὐτόν（「彼」）の指示対象
  choice: 本文では「彼」という代名詞を保ち、神またはイエス・キリストと特定しない。
  alternative: 「神」または「イエス／キリスト」と明示する。
  rationale: 原文は代名詞を用い、第一ヨハネの文脈では神を知ることと御子との関係が緊密に語られる。特定しすぎず、原文の神学的な緊張と指示の余地を保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、「戒め」「守る」によって聖書本文としての品位とヨハネ文書の語彙的つながりを保った。「彼」は原文どおり代名詞のままとし、指示対象を解釈で限定していない。
