id: 1JN.2.24
reference: 1 John 2:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: ja
  text: あなたがたは[a]、初めから聞いたことを、あなたがたのうちにとどまらせなさい。初めから聞いたことがあなたがたのうちにとどまるなら[b]、あなたがたも御子のうちに、また御父のうちにとどまります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたは」は原文で文頭に置かれ、前の節で語られた人々との対比が強調されています。
    reason: discourse_emphasis
  - marker: b
    text: 「とどまる」は、この節で繰り返される同じギリシア語の動詞を訳したものです。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 文頭に明示された代名詞の対比的な強調と主題提示を、日本語の「あなたがたは」で自然に表した。
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: 初めから聞いたこと
  rationale: 中性関係代名詞ὃを「こと」とし、「福音」や「教え」と限定せず、原文の広がりを保った。
- source_word: ἐν ὑμῖν μενέτω
  choice: 自分たちのうちにとどまらせなさい
  rationale: 三人称命令の働きを保ち、聞いたことが彼らの内に引き続き存在するよう求める表現とした。
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: あなたがたのうちにとどまるなら
  rationale: ἐάνを伴う条件節を明確に表し、同じ動詞μένωを一貫して「とどまる」と訳した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: καίの「も」と、明示された代名詞の強調を簡潔に保持した。
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: 御子のうちに、また御父のうちに
  rationale: 繰り返されるἐνを二度とも「のうちに」とし、御子と御父の並行関係を保った。
- source_word: μενεῖτε
  choice: とどまります
  rationale: 未来形を日本語の自然な叙述で表し、前二箇所と同じ訳語を用いた。
theological_decisions:
- issue: 末尾の条件付きの言明の性質
  choice: 「あなたがたも…とどまります」と、条件に結びついた未来の言明として訳す。
  alternative: 勧告として訳す、または後代の特定の堅忍論・保証論を明示する。
  rationale: 原文の条件構文と未来形をそのまま示し、救いの保証や堅忍をめぐる教派的な体系へ解消しないため。
- issue: 「初めから聞いたこと」の指示内容
  choice: 本文では「初めから聞いたこと」と一般的に保つ。
  alternative: 「福音」または「使徒たちの教え」と明示する。
  rationale: 文脈上は御子についての初めの使徒的な告知が考えられるが、原文は中性関係代名詞で表し、内容を明示していないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨハネ文書に特徴的な「うちにとどまる」という関係的表現と反復を保持した。「御子」「御父」により、自然で品位ある聖書語彙とした。
