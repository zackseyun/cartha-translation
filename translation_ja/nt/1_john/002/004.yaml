source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: ja
  text: 「私はその方を知るようになった」と言い、その方の戒めを守らない者は、偽り者であり、その人のうちに真理はありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λέγων
  choice: 「…」と言いながら…者
  rationale: 冠詞付き現在分詞の一般的・継続的な性格を自然な日本語で表し、後続の否定分詞との対照を明確にした。
- source_word: Ἔγνωκα
  choice: 知るようになった
  rationale: γινώσκωの完了形が示す、知るに至った結果として現在も続く関係を表す。「知っている」も可能だが、完了の相をよりよく反映する。
- source_word: αὐτὸν
  choice: この方を
  rationale: 直前の文脈の指示対象を代名詞的に保ち、神か、より特定してキリストかを本文で断定しない。敬意を含む自然な現代日本語とした。
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: その戒め
  rationale: ヨハネ文書におけるἐντολήの神的命令としての響きを保つ。「命令」より聖書的文脈に自然である。
- source_word: μὴ τηρῶν
  choice: 守らない
  rationale: τηρέωの「保つ・遵守する」という語感を保持し、現在分詞が表す継続的な不履行を文脈上自然に示す。
- source_word: ψεύστης
  choice: 偽り者
  rationale: 形容ではなく述語名詞による人格的・倫理的評価を保つ。「うそつき」よりも荘重で本文の調子に合う。
- source_word: ἐν τούτῳ
  choice: その人のうちに
  rationale: 直前に述べた者を指す指示代名詞の照応を明示する。「この者のうちに」より自然な現代日本語である。
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: 真理はありません
  rationale: ヨハネ文書における命題的・倫理的・霊的な広がりを狭めず、単純な否定存在文として訳した。
theological_decisions:
- issue: αὐτόν／αὐτοῦの指示対象
  choice: 「この方／その」とし、固有の指示対象を本文で明示しない
  alternative: 「神を／神の」または「キリストを／キリストの」
  rationale: 直前の文脈では神を指すのが自然だが、ヨハネ文書では父と御子への言及が密接であるため、原文の代名詞が持つ余地を保持した。
- issue: ヨハネ文書における「知る」の意味と完了形
  choice: 「知るようになった」
  alternative: 「知っている」
  rationale: 単なる知識に限定せず、知るに至った結果として続く関係を示す一方、神秘的結合などを訳文に付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、断定の強さと荘重さを保った。「言いながら」により、告白と行動の食い違いを自然に示した。脚注を必要とするほど理解を左右する異読はないため、本文のみとした。
