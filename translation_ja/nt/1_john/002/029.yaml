id: 1JN.2.29
reference: 1 John 2:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: ja
  text: あなたがたがその方[b]が正しい方であることを知っているなら、正しい行いをする者は皆、その方から[a]生まれた者であることも、あなたがたは知っています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方に由来して」。ギリシア語の表現は、出生の起源・出所を示します。
    reason: lexical_alternative
  - marker: b
    text: 「その方」が父なる神を指すのか御子を指すのかは、ギリシア語本文では明示されていません。
    reason: alternative_reading
  - marker: c
    text: または「知りなさい」。ギリシア語の語形は、直説法とも命令法とも取れます。
    reason: grammatical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: 知っているなら
  rationale: 条件を表すἐὰνと、οἶδαの完了形に由来しつつ現在の意味を持つεἰδῆτεを、自然な現代日本語の条件節として表した。
- source_word: δίκαιός
  choice: 正しい方
  rationale: 人格の道徳的・神学的な正しさを表す形容詞であり、後続のδικαιοσύνηとの語義上のつながりも保てる。日本語では人物を指すため「方」を補った。
- source_word: γινώσκετε
  choice: 分かります
  rationale: 先行するεἰδῆτεとの動詞の違いを、日本語でも「知っている」と「分かります」によって緩やかに示した。文脈上は直説法として本文に採用したが、命令法の可能性は脚注に残した。
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: 正しいことを行う者は皆
  rationale: 現在分詞が示す継続的・特徴的な行いを自然に表しつつ、δικαιοσύνηを抽象的で硬い「義」だけに限定せず、一般読者に明瞭な表現とした。
- source_word: ἐξ αὐτοῦ
  choice: その方から
  rationale: 起源を示すἐκ/ἐξを「から」と訳し、誕生の源を明確にした。代名詞の指示対象は本文で特定しない。
- source_word: γεγέννηται
  choice: 生まれた者である
  rationale: 完了受動形が表す、すでに生まれて現在もその状態にあることを、日本語として自然な述語で表した。
theological_decisions:
- issue: δίκαιός ἐστινおよびἐξ αὐτοῦの代名詞が指す方
  choice: 「その方」として、父なる神か御子かを特定しない
  alternative: 「神」または「御子」と明示する
  rationale: 直前の文脈では御子が語られる一方、「神から生まれる」というヨハネ文書の用法もあるため、この節だけでは指示対象を一義的に確定できない。原文の神学的な余地を保持した。
- issue: γινώσκετεの法
  choice: 直説法として「分かります」
  alternative: 命令法として「知りなさい／分かりなさい」
  rationale: 語形だけでは直説法と命令法の双方が可能だが、条件節に続く認識の言明として読むのが文脈上自然である。ただし文法上の別解は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「義を行う」は教会的には定着しているが一般読者には硬いため、「正しいことを行う」とした。人物を受ける代名詞には敬意と自然さを兼ねる「その方」を用い、指示対象の曖昧さを保った。
