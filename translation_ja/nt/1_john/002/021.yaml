id: 1JN.2.21
reference: 1 John 2:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: ja
  text: 私は、あなたがたが真理を知らないから書いたのではなく、真理を知っているから、また、どんな偽りも真理から出るものではないから、書いたのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: 書いた
  rationale: アオリストを自然な日本語の過去形で表した。手紙執筆という文脈は「あなたがたに書いた」から明らかであり、完了の意味を補う必要はない。
- source_word: οἴδατε
  choice: 知っている
  rationale: οἶδαの状態的な意味を自然に表し、否定節との明確な対照を保った。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: ヨハネ文書における神学的な広がりを保ちつつ、「福音」や「真実の教え」などと限定しない訳語を選んだ。日本語では抽象名詞に冠詞の有無を直接反映できない。
- source_word: πᾶν ψεῦδος
  choice: どんな偽りも
  rationale: πᾶνと後続の否定を、日本語の自然な全称否定として表した。「すべての偽りは……ない」という不自然さを避けつつ、一切の偽りを含む意味を保つ。
- source_word: ἐκ τῆς ἀληθείας
  choice: 真理から出る
  rationale: ἐκが示す源・由来を簡潔で自然な日本語にした。「真理に属する」と解釈を広げず、起源の関係を保持した。
theological_decisions:
- issue: 「真理」の内容
  choice: 「真理」とし、内容を説明的に限定しない
  alternative: 「真実の教え」「福音の真理」
  rationale: 文脈上は豊かな神学的含意があり得るが、この節自体はその内容を限定していないため、原文の幅を保った。
- issue: 偽りと真理との関係
  choice: 「どんな偽りも真理から出るものではない」
  alternative: 「偽りは真理に属さない」
  rationale: ἐκの源・由来という意味を保ち、所属や両立可能性について原文以上の説明を加えない。
- issue: 二つのὅτι節と後続のκαὶ ὅτιの関係
  choice: 執筆理由を「知っているから」と「どんな偽りも真理から出ないから」の二点として並べる
  alternative: 最後の節を、読者が知っている内容として従属させる
  rationale: ἀλλά以後のὅτι節とκαὶ ὅτι節の並列を自然に反映した。ただし日本語では「また」でつなぎ、論理関係を過度に説明しない。
translation_notes:
  register: 現代標準日本語による、明晰で品位ある書簡調。「私が……書いたのは、……からではなく、……からです」という焦点構文でギリシア語の対照を自然に再現し、末尾の理由節も「また」で明確につないだ。
