id: 1JN.2.27
reference: 1 John 2:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: ja
  text: また、あなたがたがその方から受けた油注ぎは、あなたがたのうちにとどまっています。[b] あなたがたには、だれかに教えてもらう必要がありません。むしろ、その方の油注ぎが、すべてについてあなたがたに教えているのです。それは真実であって、偽りではありません。それがあなたがたに教えたとおり、その方のうちにとどまりなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それがあなたがたに教えたとおり、あなたがたはその方のうちにとどまっています」。写本および文の取り方によっては、末尾を命令ではなく叙述として読むことができます。
    reason: textual_variant
  - marker: b
    text: 「とどまっています」と「とどまりなさい」には、原文で同じ動詞が使われています。別訳「宿っています」／「とどまり続けなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: 油注ぎ
  rationale: 油を注ぐという原語の比喩を保ちつつ、ここでそれを「聖霊」などと明示して解釈を限定しないため。
- source_word: ἀπ’ αὐτοῦ / αὐτοῦ
  choice: その方から／その方の
  rationale: 代名詞の指示対象を本文中で特定せず、前後の文脈に委ねるため。現代日本語として敬意と自然さのある「その方」を用いた。
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: あなたがたのうちにとどまっています／その方のうちにとどまりなさい
  rationale: ヨハネ文書で重要な μένω の反復を「とどまる」で一貫して示し、内在と継続の含意を保った。
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: あなたがたには、だれかに教えてもらう必要がありません
  rationale: 原文の強い表現を弱めたり、あらゆる人間の教師を否定する教理的説明へ広げたりせず、自然な日本語で示した。
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: 教えてもらう／教えます／教えた
  rationale: 同じ動詞の反復を「教える」で保った。最初だけ受益構文とし、日本語として自然に必要の有無を表した。
- source_word: περὶ πάντων
  choice: すべてのことについて
  rationale: 範囲を解釈によって狭めず、πάντων の広がりを明示した。
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: 真実であって、偽りではありません
  rationale: 真実と偽りの対照を簡潔かつ明瞭に保った。
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: それがあなたがたに教えたとおり
  rationale: 油注ぎを受ける中性代名詞の機能を日本語の「それ」で示し、後続の勧告との比較関係を保った。
theological_decisions:
- issue: 「油注ぎ」（χρῖσμα）の指示対象
  choice: 本文では「油注ぎ」とし、指示対象を明示しない
  alternative: 「聖霊」または「受けた福音の教え」と明示する
  rationale: 文脈上は聖霊またはその働きが強く示唆されるが、原文自体は比喩を用いているため、その神学的な含みと曖昧さを保った。
- issue: 「だれかに教えてもらう必要がありません」の射程
  choice: 原文どおり強い否定を保ち、説明的に限定しない
  alternative: あらゆる人間の教師を絶対的に否定する、または離反者の教師だけに限定する
  rationale: 本文だけでいずれかの教理的理解に固定せず、文脈による解釈の余地を残した。
- issue: 末尾の μένετε の法
  choice: 命令として「とどまりなさい」
  alternative: 直説法として「とどまっています」
  rationale: 文脈上、勧告として読むのが自然であるため本文では命令形としたが、形態・伝本文に関わる別の読みは脚注に残した。
- issue: 末尾の ἐν αὐτῷ の指示対象
  choice: 「その方のうちに」と人格的な指示対象を保つ
  alternative: 「その油注ぎのうちに」または指示対象を固有名で明示する
  rationale: 原文の男性単数代名詞を反映しつつ、それが誰を指すかは文脈に委ねた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨハネ文書特有の反復と真実・偽りの対照を保った。「油注ぎ」は日常語では説明を要しうるが、原文の神学的比喩を保持するため本文に残した。文体は会衆での朗読にも適する、平明で品位ある敬体とした。
