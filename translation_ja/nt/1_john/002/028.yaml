id: 1JN.2.28
reference: 1 John 2:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: ja
  text: そして今、子どもたちよ、この方のうちにとどまりなさい。そうすれば、この方が現されるとき[a]、私たちは確信をもって、その方が来られる時[b]に、この方から恥じて退くことがないでしょう[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この方が現されるなら」。ギリシア語は条件形の表現で、予期される将来の出来事を「～するとき」と表すこともできます。動詞は受動態です。
    reason: ἐὰν＋接続法の条件的・時間的な幅と、φανερωθῇの受動態を示すため。
  - marker: b
    text: 直訳的には「その方の παρουσία において」。παρουσίαは「到来」「来臨」、また「臨在」とも訳せます。ここではこの方の終末的な到来を指します。
    reason: παρουσίαの語義の幅と、この文脈での終末的・出来事的な意味を示すため。
  - marker: c
    text: または「この方の前で恥じることがないでしょう」。原文は、この方から恥じて退くことと、この方の前で恥じることの両方の理解を許します。
    reason: αἰσχυνθῶμεν ἀπ’ αὐτοῦの意味上・統語上の曖昧さを保つため。
lexical_decisions:
- source_word: τεκνία
  choice: 子どもたちよ
  rationale: 親愛を込めた呼びかけであると同時に、ヨハネ文書に特徴的な子どもの比喩を保つ。日本語では「幼い子どもたち」だと実年齢を強く示しすぎるため、自然な「子どもたちよ」とした。
- source_word: μένετε
  choice: とどまりなさい
  rationale: ヨハネ文書の重要語として、継続的で関係的な意味を保つ。「つながっていなさい」より比喩を説明しすぎず、「住み続けなさい」より自然である。
- source_word: ἐν αὐτῷ
  choice: この方のうちに
  rationale: 直前の文脈が指すキリストとの関係を示しつつ、「一つに結ばれて」のような解釈的補足を避けた。「彼」よりも日本語の聖書文体として明瞭で品位のある「この方」を用いた。
- source_word: φανερωθῇ
  choice: 現される
  rationale: 受動態を保ち、単に「現れる」として形態上の含みを消さないようにした。終末におけるキリストの顕現を文脈上示すが、本文ではそれ以上説明しない。
- source_word: σχῶμεν παρρησίαν
  choice: 確信を持ち
  rationale: 神の前で隠すことなく、恐れずに立てる確信を自然な現代日本語で表す。「大胆であり」は対抗的な響きを帯びやすく、「確信」がこの終末的文脈に適する。
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: 恥じてこの方から退く
  rationale: αἰσχύνομαιの恥と、ἀπόの「～から離れて」という方向性の双方を表した。単なる内面的な羞恥にも、退縮の含みを伴う理解にも配慮した表現である。
- source_word: παρουσίᾳ
  choice: 来臨
  rationale: この文脈ではキリストの終末的な到来を指す定着した表現である。語の「臨在」の側面も脚注で示し、出来事としての到来だけに意味を狭めないようにした。
theological_decisions:
- issue: 代名詞の指示対象と終末的顕現
  choice: 「この方」は文脈上、御子イエス・キリストを指し、その将来の顕現と来臨を語るものとして訳す。
  alternative: 神一般を指すものとして、御子との同定を明示しない。
  rationale: 直前の文脈は御子のうちにとどまることを中心としており、φανερωθῇとπαρουσίαもここではキリストの将来の顕現を自然に指す。ただし本文に「キリスト」という名を補わず、原文の代名詞表現を「この方」で保った。
- issue: 来臨時の恥のニュアンス
  choice: 恥のためにこの方から退く可能性を表す。
  alternative: 「この方の前で恥じる」とし、退くという空間的・関係的含みを表面化しない。
  rationale: αἰσχυνθῶμενとἀπ’ αὐτοῦの組み合わせは、御前での羞恥だけでなく、その方から退縮する含みを持ち得る。裁きや最終的断罪を本文に付加せず、警告の関係的な力を保った。
- issue: ἐὰνの条件性
  choice: 本文では自然な終末的時間表現として「現されるとき」とする。
  alternative: 「現されるなら」として条件形を直接表す。
  rationale: ἐὰν＋接続法は形式上条件的だが、この文脈では期待される将来の顕現を指し、日本語の「なら」は出来事自体への疑念を不必要に強める。条件形の直訳可能性は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、呼びかけの「子どもたちよ」、ヨハネ的な「うちにとどまる」、終末論的な「来臨」には聖書としての品位と用語上の連続性を持たせた。「この方」を反復して指示対象を明確にし、男性代名詞に依存しない自然な日本語とした。
