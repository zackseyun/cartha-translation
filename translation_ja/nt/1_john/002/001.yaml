id: 1JN.2.1
reference: 1 John 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: ja
  text: 私の子どもたちよ。あなたがたが罪を犯さないように、私はこれらのことを書いています。しかし、もしだれかが罪を犯すなら、私たちには御父のもとに弁護者[a]がおられます。義なる方、メシア[b]であるイエスです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「弁護者」と訳したギリシア語は παράκλητος（パラクレートス）。文脈によっては「助け主」「助言者」「慰め主」とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「イエス・キリスト」。ギリシア語 Χριστός（クリストス）は「メシア」という称号を意味する一方、「キリスト」のように名前に近い形でも用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: 私の子どもたちよ
  rationale: 親愛の情を帯びた呼びかけを、現代日本語で自然かつ尊厳ある形にした。「幼い子どもたち」は読者の実年齢を不必要に限定しかねないため避けた。
- source_word: ταῦτα γράφω ὑμῖν
  choice: 私はこれらのことを書いています
  rationale: 書簡を記している現在の行為を自然な日本語で表し、ταῦταも「これらのこと」として保持した。
- source_word: ἵνα μὴ ἁμάρτητε
  choice: あなたがたが罪を犯さないように
  rationale: ἵναと接続法が示す目的を明確に表し、罪を犯さないことへの勧めを弱めない一方、実現済みの完全無罪を意味させない。
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: しかし、もし誰かが罪を犯しても
  rationale: καίの文脈上の対照を「しかし」で示し、ἐάνによる現実的な条件を「もし……ても」と自然に表した。
- source_word: παράκλητον
  choice: 弁護者
  rationale: 御父のもとにいるイエスという文脈では、代理・執り成しを含む法廷的な意味が前面に出るため。「助け主」などのより広い語義は脚注に残した。
- source_word: πρὸς τὸν πατέρα
  choice: 御父のもとに
  rationale: 御父に向き合う近さと、その御前にいることを自然に表す。「御父」はヨハネ文書の神学的・関係的用法にふさわしい。
- source_word: Ἰησοῦν Χριστὸν
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を「メシア」で明示しつつ、日本語として自然な同格表現にした。伝統的な「イエス・キリスト」は脚注に示した。
- source_word: δίκαιον
  choice: 義なる方
  rationale: イエスを修飾する男性単数形容詞の称号的な力を保ち、単なる性質の説明に平板化しない表現とした。
theological_decisions:
- issue: ἵνα μὴ ἁμάρτητεと後続する条件節の緊張関係
  choice: 罪を犯さないことを執筆目的として明言しつつ、「もし誰かが罪を犯しても」を続ける
  alternative: 罪を全く犯さない状態がすでに実現しているとの断定に読む
  rationale: 本文は罪を避ける目的と、罪を犯した場合への備えを並置している。その緊張を解消せず、そのまま保持した。
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは「イエス」に添えられた称号として理解できるため、語義を明示する「メシア」を本文に採用した。ただし、名称化した伝統的表現も可能なので脚注に保持した。
- issue: παράκλητοςの役割
  choice: 弁護者
  alternative: 助け主、助言者、慰め主
  rationale: 御父のもとで信者のために働くという文脈は代理・弁護の意味を強く示すが、語の意味範囲を一義的に限定しないよう別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、親愛を込めた牧会的呼びかけには「私の子どもたちよ」を採用した。文を適度に分けて読みやすくしながら、御父、弁護者、義なる方という荘重な語調を保持した。提供された英語参照文では脚注記号と脚注内容の対応がずれていたため、内容に即して[a]を「弁護者」、[b]を「メシアであるイエス」に付した。
