  text: Ταῦτα ἔγραψα ὑμῖν περὶ τῶν πλανώντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/026.yaml
  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: ja
  text: 私は、あなたがたを惑わしている者たちについて、これらのことを書きました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたを迷わせている者たち」「あなたがたを惑わそうとしている者たち」。ギリシア語は、あなたがたを惑わす活動をしている者たちを指し、その企てが成功したかどうかまでは明示しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞で、直前までに記された一連の内容を指すため。
- source_word: ἔγραψα
  choice: 私は書きました
  rationale: アオリスト直説法の完了した執筆行為を、現代日本語で自然に表す。文脈上の現在的な意義は前後関係から伝わる。
- source_word: ὑμῖν
  choice: あなたがた
  rationale: 書簡の複数の受け手を明示する与格代名詞。日本語では「書きました」の対象として自然に配置した。
- source_word: περὶ
  choice: について
  rationale: 執筆の主題を示す前置詞を、明快で自然な現代日本語にした。
- source_word: τῶν πλανώντων ὑμᾶς
  choice: あなたがたを惑わそうとしている者たち
  rationale: πλανάωの「迷わせる、惑わす」という意味を保ちつつ、この働きかけが成功したとは限らない点を「惑わそうとしている」で表した。
theological_decisions:
- issue: πλανώντωνが、惑わしの成功を含意するか、惑わそうとする働きかけを表すか
  choice: 惑わそうとしている者たち
  alternative: 惑わしている者たち／迷わせている者たち
  rationale: 現在能動分詞は相手に対する継続的な働きかけを示すが、読者が実際に惑わされたとまでは必ずしも断定しない。その緊張を保つため、意図・試みを示す表現を本文に採用した。
translation_notes:
  register: 明快で現代的な標準日本語。書簡としての品位を保ちながら、「これらのこと」「者たち」により原文の複数性と指示関係を明示した。
