id: 1JN.1.5
reference: 1 John 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: ja
  text: 私たちがその方から聞いて、あなたがたに伝える知らせは、これです。神は光であり、神のうちには闇が少しもありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: 知らせ
  rationale: 受け取って伝える内容を表す語として自然であり、同根の動詞ἀναγγέλλομενとの響きを「告げ知らせる」とともに可能な範囲で保つ。
- source_word: ἀκηκόαμεν
  choice: 私たちが…聞き
  rationale: 完了形は、過去に聞いた内容を今も保持して伝えている含みを持つ。日本語では文脈と後続の現在形によってその継続的な効力を自然に示す。
- source_word: ἀπ’ αὐτοῦ
  choice: その方から
  rationale: 原文の代名詞を固有名詞や称号に置き換えず、文脈上の指示と敬意を自然な日本語で保つ。
- source_word: ἀναγγέλλομεν
  choice: 告げ知らせる
  rationale: 受け取った知らせを相手に伝達する意味を明確にし、ἀγγελίαとの語感上のつながりも保つ。
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: 神は光であり
  rationale: 無冠詞の述語名詞が示す性質的な比喩をそのまま保ち、「その光」や「聖なる光」などの説明を加えない。
- source_word: σκοτία
  choice: 闇
  rationale: ヨハネ文書における字義的・倫理的・霊的な広がりを保てる簡潔で定着した訳語。
- source_word: ἐν αὐτῷ
  choice: 神のうちには
  rationale: 日本語では代名詞より指示対象を明示した方が自然でありつつ、「うちに」という原文の比喩的・内在的な表現を保つ。
- source_word: οὐκ…οὐδεμία
  choice: 少しもありません
  rationale: 二重の否定が持つ強い全面否定を、明瞭で自然な現代日本語として表す。
theological_decisions:
- issue: 「神は光である」という比喩的述語
  choice: 「神は光であり」と比喩を直接保持する。
  alternative: 「神は聖なる光であり」「神は純粋な光であり」
  rationale: 原文は光の意味を一つの属性に限定していない。説明語を補わず、神の性質についての比喩が持つ神学的・文学的な広がりを保つ。
- issue: 「その方」の指示対象
  choice: 固有名詞や称号を補わず「その方」とする。
  alternative: 「イエスから」「御子から」
  rationale: 文脈から指示対象を理解できる一方、原文自体は代名詞なので、訳文で解釈を固定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「告げ知らせる知らせ」によって原文の同根語の反復を意図的に残した。「全く」よりも「少しも…ない」を用い、強い否定を自然な日本語で表現した。
