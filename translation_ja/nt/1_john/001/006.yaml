  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: ja
  text: もし私たちが神と交わりを持っていると言い、しかも闇の中を歩んでいるなら、私たちは偽りを言っており、真理を実践していません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳、「真理を行っていない」。これは、真理に従って行動することを表す表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: もし私たちが……と言いながら……なら
  rationale: 条件文の力を保ちつつ、後続する καί が主張と実際の歩みの食い違いを示すことを、自然な日本語の「と言いながら」で表した。
- source_word: κοινωνίαν ἔχομεν μετ’ αὐτοῦ
  choice: 神と交わりを持っている
  rationale: κοινωνία の関係的・参与的な意味を「交わり」で保った。αὐτοῦ は直訳すれば「その方」だが、日本語では指示が不自然になりやすいため、文脈上の指示対象である神を明示した。
- source_word: ἐν τῷ σκότει περιπατῶμεν
  choice: 闇の中を歩んでいる
  rationale: ヨハネ文書における倫理的・霊的領域としての「闇」と、生き方を表す「歩む」の比喩を保持した。
- source_word: ψευδόμεθα
  choice: 私たちは偽りを言っている
  rationale: 現在形の継続的な力を自然な日本語で示し、単に状態を表す「偽りである」よりも動詞の意味を明確にした。
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: 真理を行ってはいません
  rationale: ヨハネ的な「真理を行う」という意図的で具体的な表現を保持した。現代日本語ではやや特徴的だが理解可能であり、「真理に従って生きる」と解釈的に平板化しない。
theological_decisions:
- issue: 闇の倫理的・霊的比喩
  choice: 「闇の中を歩む」という比喩を保持する
  alternative: 「罪の中で生活する」「悪い生き方をする」
  rationale: 「闇」は悪、偽り、神からの隔たりを含み得るヨハネ文書の多義的な主題であり、一つの教理的説明に限定しないため。
- issue: 「真理を行う」の意味
  choice: 原文の行為的な慣用表現を本文に残す
  alternative: 「真理に従って生きてはいない」
  rationale: 真理を単なる認識や発言ではなく実践と結びつける原文の緊張を保つため。補足は脚注で示す。
translation_notes:
  register: 明快で現代的な標準日本語を用いつつ、「交わり」「闇の中を歩む」「真理を行う」という本文の重要な聖書的表現を保持した。「歩んでいる」は日常語の「歩いている」より、生き方を指す比喩として自然で荘重さもある。
