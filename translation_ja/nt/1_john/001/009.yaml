id: 1JN.1.9
reference: 1 John 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: ja
  text: もし私たちが私たちの罪を告白するなら、神は真実で正しい[a]方であり、私たちの罪を赦し、あらゆる不義から私たちを清めてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「公正な」。
    reason: δίκαιοςには、道徳的に「正しい」と司法的に「公正な」の両面があり得るため。
lexical_decisions:
- source_word: ἐὰν
  choice: もし…なら
  rationale: 第三種条件文の条件性を保ちつつ、現代日本語で自然に表した。反復を明示する「いつでも」は採らなかった。
- source_word: ὁμολογῶμεν
  choice: 私たちが…告白する
  rationale: 罪を言葉で認めるという文脈上の意味と倫理的な重みを、定着した訳語「告白する」で表した。
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: 自分の罪
  rationale: 主語「私たち」との帰属関係を日本語らしく示す。「罪」は複数形を必ずしも形態上区別しない日本語でも総称的・複数的に理解できる。
- source_word: πιστός
  choice: 真実で
  rationale: 神が信頼に値し、その言葉とご性質に忠実であることを表す。人物評として硬すぎる「忠実な」より、神の変わらない信実を自然に伝える。
- source_word: δίκαιος
  choice: 正しい
  rationale: 道徳的正しさと公正さの双方を含み得る語として、広い意味を保つ「正しい」を採用した。「公正な」も可能なので脚注に残した。
- source_word: ἵνα ἀφῇ…καὶ καθαρίσῃ
  choice: …ですから、…赦し、…清めてくださいます
  rationale: ἵνα節が神の真実さと正しさに結びついて赦しと清めを述べる関係を、自然な日本語で示した。目的・結果の区別を過度に教理化しない表現とした。
- source_word: ἀφῇ
  choice: 赦し
  rationale: 罪の文脈におけるἀφίημιの通常の意味を、明確で定着した日本語で表した。
- source_word: καθαρίσῃ
  choice: 清めてくださいます
  rationale: 道徳的汚れが取り除かれる比喩を保ち、神を主語とする日本語として敬意を自然に示した。
- source_word: ἀπὸ πάσης ἀδικίας
  choice: あらゆる不義から
  rationale: πάσηςの包括性を「あらゆる」で、ἀδικίαの広い道徳的・神学的意味を「不義」で保持した。
theological_decisions:
- issue: δίκαιοςと神の赦しとの関係
  choice: 正しい
  alternative: 公正な
  rationale: この節は赦しと清めを神のご性質に結びつける。「正しい」は道徳的正しさと司法的公正さをともに含み得るため、意味を狭めない。司法的含意を明瞭にする「公正な」も有力なので脚注で保持した。
- issue: 三人称単数の主語の明示
  choice: 神
  alternative: その方
  rationale: ギリシア語では主語が動詞に含まれるが、直前の文脈では神を指す。日本語で指示対象を明確にするため「神」と補ったが、新たな教理的内容は加えていない。
translation_notes:
  register: 明快な現代標準日本語を用い、「赦す」「不義」「清める」など本文の神学的・比喩的厚みを担う語は保持した。文体は平易だが礼拝朗読にも耐える品位を目指した。脚注記号[a]は該当語「正しい」の直後に置いた。
