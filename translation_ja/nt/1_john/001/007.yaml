id: 1JN.1.7
reference: 1 John 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: ja
  text: しかし、神ご自身が光の中におられるように、私たちも光の中を歩むなら、私たちは互いに[a]交わりを持ち、神の御子イエスの血が、あらゆる罪[b]から私たちを清めます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「互いに」は、最も自然には信者同士を指します。ただし、信者と神との交わりを指すと解する人もいます。
    reason: alternative_reading
  - marker: b
    text: 別訳「すべての罪から」。ギリシャ語は、個々の罪を念頭に置く「あらゆる罪」とも、罪を全体として捉える「すべての罪」とも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: しかし、…なら
  rationale: δέが前節の「闇の中を歩む」という主張との対照を示すため、「しかし」で逆接を表した。ἐάνを自然な条件表現「なら」で訳した。
- source_word: ἐν τῷ φωτὶ περιπατῶμεν
  choice: 私たちも光の中を歩む
  rationale: 「歩む」というヨハネ文書の倫理的比喩を保ち、「生活する」などと説明的に言い換えなかった。「も」は、神が光の中におられることとの対応を日本語で自然に示す。
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: 神ご自身が光の中におられるように
  rationale: 直前の文脈で指示対象が神であることを明示し、αὐτόςの強調を「ご自身」で表した。ὡςは同一性を過度に強めず、比較を示す「ように」とした。
- source_word: κοινωνίαν ἔχομεν μετ’ ἀλλήλων
  choice: 私たちは互いに交わりを持ち
  rationale: κοινωνίαを、共有と関係性の双方を表す定着した語「交わり」で訳した。ἀλλήλωνの相互性は「互いに」で保った。
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: 神の御子イエスの血
  rationale: 属格関係を自然な日本語で示しつつ、「血」を後続動詞の主語として保った。αὐτοῦの指示対象である神を明示した。
- source_word: καθαρίζει
  choice: 清めます
  rationale: 道徳的・祭儀的な含意をともに保持できる「清める」を採用した。現在形は、継続的または恒常的な働きを含み得る日本語の非過去形で表した。
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: あらゆる罪から
  rationale: πάσηςと単数形ἁμαρτίαςの分配的理解を自然に表した。集合的な「すべての罪から」も可能なため脚注に示した。
theological_decisions:
- issue: μετ’ ἀλλήλων（互いに）の関係者
  choice: 信者同士の相互の交わり
  alternative: 信者と神との交わり
  rationale: 相互代名詞ἀλλήλωνは、最も自然には複数の信者相互を指す。広い文脈には神との交わりも含まれるが、この句自体の別解は脚注に残し、本文で神学的緊張を解消しなかった。
- issue: καθαρίζειの現在時制の力
  choice: 日本語の非過去形「清めます」で、継続的・恒常的な働きを含ませる
  alternative: 「絶えず清め続けます」と明示する、または一回的な清めと解する
  rationale: ギリシャ語現在形は継続的または特徴的な働きを示し得るが、「清め続ける」とすると解釈を強めすぎる。単純な非過去形が原文の幅を最もよく保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「光の中を歩む」「交わり」「血が清める」という原文の比喩と神学的表現を保持した。敬語的な補助表現「清めてくださいます」は原文にない受益性を加えるため避けた。脚注記号は対応する語句の直後に置いた。
