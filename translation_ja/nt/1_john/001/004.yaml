  text: καὶ ταῦτα γράφομεν ⸀ἡμεῖς ἵνα ἡ χαρὰ ἡμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: ja
  text: そして、私たちがこれらのことを書いているのは、私たちの喜びが満たされるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちの喜び」ではなく「あなたがたの喜び」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の証言を受けて文をつなぐ標準的な接続表現。現代日本語として自然である。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示語を保ち、著者が書き記している内容全体を指す表現とした。
- source_word: γράφομεν ἡμεῖς
  choice: 私たちが…書いている
  rationale: 現在形の書簡的用法と、明示された主語代名詞ἡμεῖςを反映する。日本語では主格の「が」によって目的節との関係も明瞭にした。
- source_word: ἵνα
  choice: …ためです
  rationale: 目的を自然な現代日本語で示す。文脈上、結果の含みを排除しきらず、第一義的な目的表現とした。
- source_word: ἡ χαρὰ ἡμῶν
  choice: 私たちの喜び
  rationale: 提示されたSBLGNT本文のἡμῶνをそのまま訳した。「あなたがたの」は写本異読として脚注に示す。
- source_word: ᾖ πεπληρωμένη
  choice: 満ちあふれる
  rationale: εἰμίの接続法とπληρόωの完了受動分詞による、満たされた状態に至る意味を自然に表す。「完全になる」よりも喜びが満ちるという日本語の結びつきが自然である。
theological_decisions:
- issue: ἡ χαρὰ ἡμῶνの代名詞に関する本文異読
  choice: 私たちの喜び
  alternative: あなたがたの喜び
  rationale: 指定されたギリシア語本文はἡμῶν（私たちの）と読むため本文に採用した。一方、「あなたがたの」とする重要な写本伝承は、解釈上も意味のある異読なので脚注に保存した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、書簡としての落ち着いた格調を保った。「満ちあふれる」は喜びとの自然な連語を優先し、原文の完了的な充満の状態を簡潔に表現している。
