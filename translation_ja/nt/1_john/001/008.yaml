source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: ja
  text: もし私たちが、自分たちには罪がないと言うなら[a]、私たちは自分自身を欺いており、真理は私たちのうちにありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちには罪を持っていないと言うなら」。ここでの「罪」は、個々の罪というより、人のうちにある罪を指します。「自分たちには罪深さがない」とも解釈できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: もし、…と言うなら
  rationale: 第三種条件文を、現代日本語で自然な条件表現として訳した。仮定の性格を保ちつつ、不必要に文語的な形にはしない。
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: 自分には罪がない
  rationale: ἁμαρτίαν は無冠詞単数で、一つの罪過ではなく、人のうちにある罪を指す。日本語では「罪を持っていない」より「罪がない」が自然であり、10節の「罪を犯したことがない」との違いも保てる。
- source_word: ἑαυτοὺς πλανῶμεν
  choice: 私たちは自分自身を欺いている
  rationale: 再帰代名詞を明示し、自分を迷わせる、すなわち自己欺瞞であることを自然に表した。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: ヨハネ文書における、神から示された客観的真理と人の真実さの双方に響き得る簡潔な表現を保った。日本語では定冠詞を独立して表示しない。
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: 私たちのうちにありません
  rationale: ἐν の内面的・人格的な含みを保つ。「ありません」は前半の断言に対応する、明瞭で品位ある現代語。
theological_decisions:
- issue: 「罪がない」という主張の意味
  choice: 人のうちに罪が存在しないという主張として「自分には罪がない」と訳す。
  alternative: 「罪を犯したことがない」または「罪深さがない」
  rationale: 本文は ἁμαρτίαν ἔχομεν（罪を持つ）であり、罪を犯した行為そのものを述べる10節とは表現が異なる。「罪深さ」は説明的すぎるため脚注にとどめた。
- issue: 「真理は私たちのうちにない」の含意
  choice: 「真理は私たちのうちにありません」と簡潔に保つ。
  alternative: 「神の真理は私たちのうちにない」または「私たちは真実に生きていない」
  rationale: 原文は、神の啓示された真理と人の内なる真実さのどちらか一方に限定していないため、その神学的な広がりと緊張を維持した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「自分には」によって発言内容を日本語らしく示し、後半では「私たちは」を明示して共同体への包括的な警告を保った。文末は丁寧体で統一し、聖書本文としての品位を維持した。
