  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: ja
  text: 私たちが見、また聞いたものを、あなたがたにも告げ知らせます。それは、あなたがたも私たちとの交わり[a]を持つためです。そして実際、私たちの交わりは御父とその御子イエス・キリスト[b]との交わりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「交わり」は、「共有」「参与」「共にあずかること」とも訳せる語で、共に生き、関係を分かち合うことを含みます。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」はギリシア語で「油を注がれた者」を意味し、「メシア」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: 私たちが見、また聞いたもの
  rationale: 中性単数の関係代名詞ὃを人格化せず「もの」とし、二つの完了形は、過去の目撃と聴聞が現在の証言の基盤であることを文脈に委ねつつ、自然な日本語で表した。
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: あなたがたにも告げ知らせます
  rationale: ἀπαγγέλλωの報告・告知の意味を「告げ知らせる」で表し、καίは「にも」として明示した。
- source_word: ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: それは、あなたがたも私たちとの交わりを持つためです
  rationale: ἵναの目的を明示し、καὶ ὑμεῖςの「あなたがたも」を保持した。κοινωνίαは単なる親交より広い、共有・参与を伴う関係を示すため「交わり」とした。
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: そして実際、私たちの交わりは
  rationale: καίとδέが加える説明的・強調的な流れを「そして実際」で自然に表し、ἡ ἡμετέραを「私たちの」とした。
- source_word: μετὰ τοῦ πατρὸς
  choice: 御父と
  rationale: ヨハネ文書で神を指す称号的な「父」であるため、敬意と関係性を明確にする「御父」とした。
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ
  choice: その御子イエス・キリストと
  rationale: αὐτοῦの所属関係を「その」で保ち、Ἰησοῦ Χριστοῦは現代日本語で定着した形「イエス・キリスト」とした。Χριστόςの称号としての意味は脚注で示した。
theological_decisions:
- issue: κοινωνίαの意味範囲
  choice: 交わり
  alternative: 共有、参与、親しい結びつき
  rationale: 信徒同士の関係と、御父および御子との関係の双方に同じ語が用いられているため、社会的親交だけにも、特定の儀礼的意味だけにも限定しなかった。
- issue: Χριστόςの訳し方
  choice: キリスト
  alternative: メシア
  rationale: Ἰησοῦ Χριστοῦが称号として読める可能性を保ちながら、日本語で固有名に近く定着した自然な表記を本文に採用し、語義「メシア」は脚注に明記した。
- issue: 御父・御子との交わりの構文
  choice: 私たちの交わりは、御父と、その御子…との交わりです
  alternative: 私たちは御父とその御子に結ばれています
  rationale: 原文のκοινωνίαの反復を残し、共同体間の交わりと神との交わりの関係を説明的に解消せず、そのまま提示した。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、証言と神との関係を語る箇所にふさわしい格調を保った。「交わり」は教会用語として定着しているが意味幅が広いため、本文中の脚注で補った。すべての脚注記号を対応する語の直後に置いた。
