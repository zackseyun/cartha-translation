- from: そして、そのいのちが現されました[a]。私たちはそれを見て、証しし、あなたがたに告げ知らせます。すなわち、御父とともにあり、私たちに現された永遠のいのち[b]です——
  to: そして、そのいのちが明らかにされました[a]。私たちはそれを見、証言し、あなたがたに、御父とともにあり、私たちに明らかにされた永遠のいのちを告げ知らせます——
  rationale: 後半を「告げ知らせます」の目的語として再構成し、永遠のいのちを修飾する関係節をその直前に置きました。これにより、原文の統語関係、すなわち「私たちはあなたがたに［御父とともにあり、私たちに明らかにされた］永遠のいのちを告げ知らせる」を保ちます。「いのち」という原文の名詞表現を本文に維持し、人格的な文脈的指示は脚注にとどめました。
