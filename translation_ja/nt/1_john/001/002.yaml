id: 1JN.1.2
reference: 1 John 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: ja
  text: そして、そのいのちが明らかにされました[a]。私たちはそれを見、証言し、あなたがたに、御父とともにあり、私たちに明らかにされた永遠のいのちを告げ知らせます——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「現れました」「現されました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: そのいのち／永遠のいのち
  rationale: 定冠詞の指示性を「その」で表し、単なる抽象概念ではなく、文脈上特定されるいのちを指すことを示した。後半では日本語として自然な「永遠のいのち」とし、人格的な指示対象を本文で「御子」と言い換えず、原文の表現を保った。
- source_word: ἐφανερώθη
  choice: 現されました
  rationale: アオリスト受動態を反映し、以前は隠されていたものが明らかにされたという含みを保つ。「現れました」も可能なため脚注に示した。
- source_word: ἑωράκαμεν
  choice: 私たちはそれを見て
  rationale: 完了形が示す目撃経験を自然な現代日本語で表現した。日本語では英語の現在完了に相当する形を機械的に補わず、後続する現在形の証言行為とのつながりを保った。
- source_word: μαρτυροῦμεν
  choice: 証しし
  rationale: 目撃者として証言する意味を保ち、日本語の聖書文体として理解しやすい表現を選んだ。
- source_word: ἀπαγγέλλομεν
  choice: 告げ知らせます
  rationale: 単なる報告よりも、受け手に公に伝達する意味を表し、「証しする」との語義の違いも保った。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数の受け手を明示し、与格の間接目的語を自然に表した。
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: 永遠のいのち
  rationale: 限定された特定の「いのち」を指すことは前文との連続と構文で示しつつ、日本語として不自然な「その永遠のいのち」を避けた。
- source_word: ἥτις
  choice: すなわち、…永遠のいのちです
  rationale: 先行詞が文法上「いのち」であることを保ち、人格代名詞や「御子」に置き換えなかった。日本語では関係節を名詞の前に置き、説明的な関係を「すなわち」で自然に示した。
- source_word: ἦν πρὸς τὸν πατέρα
  choice: 御父とともにあり
  rationale: πρόςの関係的な近さを、ヨハネ文書の文脈に適した自然な日本語で表した。
- source_word: τὸν πατέρα
  choice: 御父
  rationale: 神を指す父という称号であることを、日本語で明確かつ敬意ある形にした。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 使徒的な目撃証言の受け手を明示する与格をそのまま表した。
theological_decisions:
- issue: 「いのち」を非人格的に訳すか、人格的な指示対象を本文で明示するか
  choice: 「そのいのち／永遠のいのち」を保持した
  alternative: 「その方が現されました」または「御子が現されました」
  rationale: 文脈上は御子を人格的に指すが、原文は明示的な人称代名詞や「御子」ではなく ζωή を用いる。ヨハネの表現が持つ人格性と概念性の重なりを解消せずに残した。
- issue: πρὸς τὸν πατέρα における先在と関係性をどこまで明示するか
  choice: 「御父とともにあり」
  alternative: 「御父のみもとにあり」または「御父の御前にあり」
  rationale: 御父との先在的な関係を示しつつ、「臨在」などの解釈的説明を本文に加えず、原文に即した簡潔な表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「御父」「証し」など、内容の荘重さとヨハネ文書の証言語彙を保つ語を用いた。原文が前後の文と連続するため冒頭の「そして」と末尾のダッシュを保持した。
