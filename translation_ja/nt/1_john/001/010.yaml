  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: ja
  text: もし私たちが「罪を犯してはいない」[a]と言うなら、その方を偽り者とし、その方のことば[b]は私たちのうちにありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を犯さなかった」。ギリシア語では完了形が用いられ、過去の行為が現在にも関わる言い方になっている。
    reason: lexical_alternative
  - marker: b
    text: 「ことば」は「知らせ」または「教え」とも訳せる。ギリシア語のλόγοςにはこれらの意味があり得るが、ヨハネ文書の表現を保つため「ことば」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: もし私たちが……と言うなら
  rationale: ἐάν＋接続法の条件を、解釈を加える「主張する」ではなく、自然な日本語の条件表現で保った。
- source_word: οὐχ ἡμαρτήκαμεν
  choice: 罪を犯してはいない
  rationale: 完了形が示す過去の行為と現在への関わりを意識しつつ、「一度も」と補って範囲を過度に限定することを避けた。
- source_word: ψεύστην ποιοῦμεν αὐτόν
  choice: その方を偽り者にしている
  rationale: ψεύστηςの名詞としての直接的な力と、ποιέω＋目的語＋補語の構文を保った。
- source_word: ὁ λόγος αὐτοῦ
  choice: その方のことば
  rationale: λόγοςが持ち得る「ことば」と「告げられた内容」の幅を残し、ヨハネ文書に特徴的な語法とのつながりも保った。
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: 私たちのうちにありません
  rationale: 内面的・関係的な表現をそのまま保ち、原文に明示されない「宿る」などの比喩を加えなかった。
theological_decisions:
- issue: αὐτόν／αὐτοῦの指示対象
  choice: 代名詞的に「その方」と訳し、文脈上は神を指すものとした。
  alternative: 本文で明示的に「神」とする。
  rationale: 直前までの文脈では神が指示対象だが、原文は固有の指示語を置かず代名詞を用いているため、本文ではそれを保った。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、告発の強さを弱めないよう「偽り者にしている」とした。「その方」により神への敬意を示しつつ、原文の代名詞表現を維持した。脚注[b]は内容に対応する「ことば」に付した。
