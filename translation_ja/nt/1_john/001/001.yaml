id: 1JN.1.1
reference: 1 John 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: ja
  text: 初めからあったもの、私たちが聞いたもの、私たちが自分の目で見たもの、私たちがじっと見つめ、私たちの手で触れたもの、いのちのことば[a]について――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのちのことば」は、御子ご自身を指すとも、御子についての、いのちについての知らせを指すとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: もの
  rationale: 反復される中性関係代名詞を「もの」と訳し、御子そのものだけに限定せず、御子について使徒たちが経験し証言する事柄全体を含み得る幅を保った。
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: 初めからあった
  rationale: 未完了過去ἦνとἀπ’ ἀρχῆςを簡潔に表し、ヨハネ文書に特徴的な「初め」の響きを保持した。
- source_word: ἀκηκόαμεν
  choice: 私たちが聞いた
  rationale: 日本語では完了形を機械的に補わず、過去の経験に基づく現在の証言という文脈によってギリシア語完了形の含意を伝える。
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: 私たちが自分の目で見た
  rationale: 「自分の目で」を明示し、目撃証言の具体性と強調を自然な日本語で保った。
- source_word: ἐθεασάμεθα
  choice: 私たちがじっと見
  rationale: 単に見る以上の、意識してよく見るというθεάομαιの含意を、現代日本語として明瞭な「じっと見る」で表した。
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: 自分の手で触れた
  rationale: ψηλαφάωが示す身体的な接触を明瞭に表し、「自分の手で」によって原文の強調を保持した。
- source_word: περὶ
  choice: について
  rationale: 証言の主題を導く語として、自然でありながら品位のある現代日本語を選んだ。
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: いのちのことば
  rationale: λόγοςの「ことば」と「知らせ・メッセージ」の幅、およびヨハネ1:1との響きを残すため、「ことば」とした。日本語には大文字・小文字の区別がないため、解釈上の可能性を脚注で示した。
theological_decisions:
- issue: 中性関係代名詞ὃの指示対象
  choice: 人格を明示する「方」ではなく「もの」と訳す
  alternative: 「初めからおられた方」と訳し、御子を直接の指示対象とする
  rationale: 文脈は明らかにキリスト論的だが、原文は中性関係代名詞を反復している。そのため、御子と御子に関する使徒的証言の双方を視野に入れ得る原文の広がりを保った。
- issue: τοῦ λόγου τῆς ζωῆςの人格的・宣教的含意
  choice: 本文を「いのちのことば」とし、両義性を保つ
  alternative: 「いのちを与える知らせ」として宣教内容に限定する、または「いのちのことば」を御子の称号としてのみ解する
  rationale: λόγοςは御子を人格的に指す響きと、御子について告げられる知らせという意味の双方を帯び得る。原文が残す神学的緊張を本文で一方に限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、書簡冒頭の荘重さと、次節へ続く未完結の構文を長音符で保持した。「もの」の反復は原文の修辞的な反復を意図的に残している。
