reference: 1 John 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: ja
  text: 愛とは、私たちが神を愛したということではなく、神が私たちを愛し、私たちの罪のための贖いのいけにえ[a]として御子を遣わされたことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なだめの供え物」、または「罪を取り除くいけにえ」とも訳せる。ギリシア語は、御子がいけにえとして罪を処理されたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: 愛とは、…ことです
  rationale: 後続内容を愛の決定的な現れとして示すヨハネ的表現を、明瞭で自然な現代日本語にした。
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: …ということではなく、…ことです
  rationale: 愛の定義を対照的に示すギリシア語の構文を保持した。
- source_word: ἠγαπήκαμεν
  choice: 愛した
  rationale: 完了形だが、日本語では「愛してきた」よりも文脈上自然であり、神の決定的な行為との対照も明確に保てる。
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: 神が私たちを愛し
  rationale: 強意的なαὐτόςによる「私たち」と神との対照を、主語「神」を明示して表した。
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: 御子を遣わされた
  rationale: ヨハネ文書に特徴的な派遣の語義と父子関係を、尊敬表現を用いた自然で品位ある日本語で示した。
- source_word: ἱλασμὸν
  choice: 贖いのいけにえ
  rationale: 罪を犠牲によって処理する意味を一般読者にも理解できる表現で示しつつ、怒りをなだめることか罪を除くことかという語義上の論争を本文で一方に限定しない。
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: 私たちの罪のための
  rationale: 犠牲に関する文脈でのπερίを、自然かつ文脈に即して「…のため」と訳した。
theological_decisions:
- issue: 贖罪の文脈におけるἱλασμόςの訳語
  choice: 贖いのいけにえ
  alternative: 罪を取り除くいけにえ／なだめの供え物
  rationale: 御子の犠牲が罪を有効に処理するという中心的意味と犠牲性を伝えながら、神の怒りの宥和と罪の除去のどちらかだけに意味を固定しない。語義の幅は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語。聖書文体としての品位を保ちながら、過度に専門的・古風な贖罪用語を避けた。「御子」「遣わされた」により敬意とヨハネ文書の派遣表現を保っている。
