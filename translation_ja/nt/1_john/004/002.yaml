id: 1JN.4.2
reference: 1 John 4:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: ja
  text: 神の霊は、次のことによって分かります。肉体をとって来られたメシアであるイエスを告白する霊はすべて、神から出ています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアであるイエス」は「イエス・キリスト」とも訳せます。「キリスト」はギリシア語の称号で、「メシア」を意味します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスが肉体をとって来られたメシアであると告白する霊」。ギリシア語では、「肉体をとって来られた」が「メシアであるイエス」を修飾しています。
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 次のことによって
  rationale: 後に続く判別基準を指す表現として、手段を表すἐνの働きを明確で自然な日本語にした。
- source_word: γινώσκετε
  choice: 分かります
  rationale: 文脈上、命令ではなく現在直説法として取り、神の霊を識別する基準が分かるという意味を表した。
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: 神の霊
  rationale: 定冠詞と文脈から、偽りの霊と対照される神ご自身の霊を指す表現として訳した。日本語では大文字・小文字による区別は生じない。
- source_word: πᾶν πνεῦμα
  choice: 霊はすべて
  rationale: 個々の霊的な主張や働きを例外なく判別の対象とする分配的な意味を保った。
- source_word: ὁμολογεῖ
  choice: 告白する
  rationale: 単なる認知にとどまらず、公に認めて言い表すというヨハネ文書での語感を保った。
- source_word: Ἰησοῦν Χριστόν
  choice: メシアであるイエス
  rationale: Χριστόςを姓のように扱わず、油注がれた者という称号の意味を明示しつつ、現代日本語として自然な語順にした。
- source_word: ἐν σαρκὶ
  choice: 肉体をもって
  rationale: イエスが現実の人間の肉体をもって来られたことを明確にし、「肉をまとって」のように肉体が外面的な覆いにすぎないとの誤解を招き得る表現を避けた。
- source_word: ἐληλυθότα
  choice: 来られた
  rationale: 完了分詞が示す、到来という出来事とその持続的な意義を、日本語では連体修飾によって簡潔に表した。
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: 神から出ています
  rationale: ἐκが表す源・由来を明確にし、現在形の継続的な判断も自然な日本語で示した。
theological_decisions:
- issue: τὸ πνεῦμα τοῦ θεοῦが神の聖霊を指すか、一般的に神からの霊を指すか
  choice: 「神の霊」とし、文脈上は神ご自身の霊を指すものとして訳した。
  alternative: 「神からの霊」
  rationale: 定冠詞付きの単数形と、直後の「すべての霊」との対照は、真の神の霊を偽りの霊から識別するという読みを支持する。ただし原文にない「聖」を本文へ補わなかった。
- issue: ἐν σαρκὶ ἐληλυθόταのキリスト論的意味
  choice: 「肉体をもって来られた」とし、現実の受肉を肯定した。
  alternative: 「人として来られた」
  rationale: 後代の教理用語を加えず、σάρξの具体性と、イエスの到来が現実の身体を伴ったことを保った。
- issue: ὁμολογεῖと対格句・分詞の関係
  choice: 肉体をもって来られたメシアであるイエスを告白する、という連体構造で訳した。
  alternative: イエスが肉体をもって来られたメシアであると告白する
  rationale: 原文ではἸησοῦν Χριστόνがὁμολογεῖの目的語で、完了分詞がそれを修飾する。本文はこの構造を優先しつつ、別の自然な日本語化を脚注で示した。
translation_notes:
  register: 明確な現代標準語を用い、礼節ある文体を保った。「分かります」は直説法の理解を自然に表し、「肉体をもって」は受肉の現実性を普通の読者にも明瞭に伝える。称号Χριστόςは意味を見失わないよう「メシア」とした。
