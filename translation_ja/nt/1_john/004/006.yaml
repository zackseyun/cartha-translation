id: 1JN.4.6
reference: 1 John 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: ja
  text: 私たちは神から出た者です。神を知っている人は、私たちの言うことに耳を傾けます[a]。神から出ていない人は、私たちの言うことに耳を傾けません。このことによって私たちは、真理の霊[b]と迷いの霊[c]を見分けるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの言うことを聞きます」。原語は単に聞くことも表しますが、ここでは証言を受け入れて聞く意味が含まれると考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「真理の霊」は、ヨハネ14:17、15:26、16:13にも見られる表現で、ここでも聖霊を指すと考えられます。ただし、より一般的に真理に属する霊を表す可能性もあります。
    reason: alternative_reading_and_cross_reference
  - marker: c
    text: 「迷い」は、誤り、惑わし、真理からの逸脱を意味します。
    reason: lexical_range
lexical_decisions:
- source_word: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν
  choice: 私たちは神から出た者です
  rationale: ἐκ の起源・由来を「神のもの」ではなく「神から出た者」として明示し、ヨハネ文書に特徴的な対比を保った。強調された代名詞 ἡμεῖς も「私たちは」で表した。
- source_word: ὁ γινώσκων τὸν θεόν
  choice: 神を知っている人
  rationale: 現在分詞の一般的・特徴的な意味を、現代日本語として自然な「知っている人」で表した。
- source_word: ἀκούει ἡμῶν
  choice: 私たちの言うことに耳を傾けます
  rationale: 属格を伴う ἀκούω はここで、単に音声を聞くことよりも、使徒的証言を受け入れて聞くことを示す。「従う」とまで強めず、応答的に聞く意味を表した。
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: 神から出ていない人
  rationale: 関係代名詞の一般的な類別の意味を自然な日本語で表し、前半と同じく ἐκ の起源を示した。
- source_word: ἐκ τούτου
  choice: こうして
  rationale: 直前に示された反応を判断の基準とする推論を、簡潔で自然な接続表現にした。
- source_word: γινώσκομεν
  choice: 見分けるのです
  rationale: 基本義は「知る」だが、二つの霊を識別する文脈では「見分ける」が自然であり、4:1から続く識別の働きを明瞭にする。
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理の霊
  rationale: ヨハネ文書で用いられる定着した表現を保った。日本語では大文字・小文字の区別がないため、指示対象の解釈は脚注で示した。
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: 迷いの霊
  rationale: πλάνη が含む真理からの逸脱、誤り、惑わしの幅を保つため「迷い」とした。「偽り」では語義を狭め、「惑わし」では能動的意味に限定しやすい。
theological_decisions:
- issue: 「真理の霊」が聖霊を指す固有的な呼称か、より一般的な霊的性質か
  choice: 本文を「真理の霊」とし、聖霊を指す可能性が高いことを脚注で説明する
  alternative: 一般的な「真理に属する霊」と理解する
  rationale: 霊を吟味する4:1–6の文脈と、ヨハネ14:17、15:26、16:13の用例から聖霊への言及が有力だが、日本語表記だけで曖昧さを消さないようにした。
- issue: ἀκούει ἡμῶν が単なる聴覚か、使徒的証言の受容か
  choice: 私たちの言うことに耳を傾けます
  alternative: 私たちの言うことを聞きます
  rationale: この節は教えへの反応によって霊を見分ける基準を述べているため、受容的に聞く意味が文脈に適する。ただし「従う」とはせず、服従の意味を過度に読み込まない。
- issue: τὸ πνεῦμα τῆς πλάνης が人格的な霊を指すか、誤りを生む傾向・影響を指すか
  choice: 迷いの霊
  alternative: 惑わしの霊／誤りの霊
  rationale: 原文は両句を平行させるが、第二の「霊」の人格性を明示的には確定しない。「迷いの霊」は霊的存在と影響・傾向の双方を排除せず、原文の幅を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「神から出た者」「真理の霊」など原文の神学的対比を保った。「耳を傾ける」は意味を明確にするが、「従う」ほど強くない表現である。結語は日本語として不自然な「霊を知る」を避け、文脈上の識別を示す「見分ける」とした。
