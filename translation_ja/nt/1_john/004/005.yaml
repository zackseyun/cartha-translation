  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: ja
  text: 彼らは世に属する者です。だから、世に属する者として語り、世は彼らの言うことに耳を傾けます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: 彼らは
  rationale: 直前の偽預言者たちを指し、次節の「私たち」との対比を自然な日本語で保つ。ギリシア語の強調を「彼ら自身」と明示すると日本語では過度になりうるため、主題提示の「は」で対比を表した。
- source_word: ἐκ τοῦ κόσμου εἰσίν
  choice: 世から出た者です
  rationale: ἐκ が表す源・由来を「世の者」だけに弱めず、「から出た」によって保持する。ここでの「世」は被造世界そのものではなく、神に背く人間の秩序を指す。
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 彼らの由来と発言との因果関係を、明瞭で現代的な日本語で示す。
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: 世から出たことを語り
  rationale: 直訳的な「世から語る」は日本語として意味が取りにくいため、発言の内容または源が世に由来するという原文の幅を保つ表現とした。主節の反復も「世から出た」で響かせた。
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: 世は彼らの言うことに耳を傾けます
  rationale: ἀκούει は単に音を聞くより、受け入れて聞く意味を持つため「耳を傾ける」とした。αὐτῶν は自然な日本語で「彼らの言うことに」と展開した。
theological_decisions:
- issue: κόσμος の意味
  choice: 「世」を、神に背を向けた人間の秩序という意味で本文に用いる
  alternative: 物理的な被造世界、または中立的な意味での全人類
  rationale: 文脈は「神から出た」者と「世から出た」者を対比しており、霊的・倫理的な由来と受容を問題にしている。ただし本文ではヨハネ文書の主要語である「世」を保ち、解釈的な複合語へ置き換えない。
- issue: ἐκ τοῦ κόσμου λαλοῦσιν の範囲
  choice: 「世から出たことを語り」とし、発言の内容と源の双方に開かれた表現にする
  alternative: 「世のことを語り」または「世を源として語り」
  rationale: ἐκ は源・由来を示すが、日本語の「世から語る」は不自然である。「世のことを」だけでは内容に限定し、「世を源として」では説明的すぎるため、原文の反復と含意を両立させた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、文末は「です・ます」で整えた。「世界」ではなく、ヨハネ文書で神学的含意を持つ伝統的かつ簡潔な「世」を採用した。原文の κόσμος の三度の反復をすべて「世」で保持した。
