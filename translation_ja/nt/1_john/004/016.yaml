id: 1JN.4.16
reference: 1 John 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: ja
  text: 私たちは、神が私たちのうちに持っておられる愛を知っており、それを信じています。[a] 神は愛です。愛のうちにとどまる人は神のうちにとどまり、神もその人のうちにとどまっておられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神が私たちの間に示しておられる愛」、または「神が私たちに対して抱いておられる愛」とも訳せます。ギリシア語の表現は、信じる者たちの内にある愛、または共同体の中に現される愛を指すことができます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: 知り
  rationale: 完了形が示す、知るに至った結果が現在も続いていることを、後続の「信じています」と合わせて自然な現代日本語で表した。
- source_word: πεπιστεύκαμεν
  choice: 信じています
  rationale: 完了形の継続的な確信を表すため、単なる過去の「信じた」ではなく現在の状態を示す表現とした。
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: 神が私たちのうちに抱いておられる
  rationale: ἐν ἡμῖν の場所的な意味を保ち、「私たちに対する」と一義的に解釈することを避けた。「うちに」は個々の信者の内にも共同体の中にも読める。
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: 神は愛です
  rationale: 述語名詞構文を簡潔かつ直接に訳した。
- source_word: μένω
  choice: とどまる
  rationale: ヨハネ文書で反復される語の、持続する関係と相互内在の響きを保ちつつ、現代日本語として自然な語を選んだ。
- source_word: αὐτῷ
  choice: その人
  rationale: 文法上の男性単数は一般的・代表的に用いられているため、日本語では先行する「人」を明確に指す自然な表現とした。
theological_decisions:
- issue: ἐν ἡμῖν の意味
  choice: 「私たちのうちに」として場所的な幅を保つ
  alternative: 「私たちに対して」または「私たちの間に」
  rationale: 原文は ἐν を用いており、内住と共同体における顕現の双方を含み得る。「うちに」はその緊張を保ち、「に対して」ほど受益的意味に限定しない。
- issue: 相互内在を示す μένω
  choice: 双方を「とどまる」で対応させる
  alternative: 後半を「おられる」だけで表す
  rationale: 人が神のうちに、神が人のうちにとどまるという原文の対応関係を明示するため、同じ動詞を保った。
translation_notes:
  register: 明快で格調ある現代標準日本語。ヨハネ文書の鍵語 μένω は一貫して「とどまる」とし、ἐν ἡμῖν の曖昧さは本文と脚注で保持した。
