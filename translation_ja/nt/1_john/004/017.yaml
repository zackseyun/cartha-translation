id: 1JN.4.17
reference: 1 John 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: ja
  text: このことによって[a]、愛は私たちの間で全うされています。これは、私たちが裁きの日に確信を持てるためです。なぜなら、あの方がそうであるように、私たちもこの世にあってそうであるからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この点で、愛は私たちの間で全うされています」。「私たちの間で」は「私たちと共に」とも訳せます。
    reason: ἐν τούτῳは手段・根拠だけでなく、領域や点を示すとも理解でき、μεθ’ ἡμῶνにも複数の自然な訳し方があるため。
  - marker: b
    text: 「あの方」は、おそらくイエス・キリストを指しますが、神を指すと理解することもできます。
    reason: ἐκεῖνοςの指示対象は文脈から推定されるものの、この節では明示されていないため。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このことによって
  rationale: 手段・根拠を示す「これによって」を本文に採用し、後続の内容との論理的なつながりを自然に示す。ただし「この点で／このことにおいて」という理解も可能なため脚注に残す。
- source_word: τετελείωται
  choice: 全うされています
  rationale: 完了受動形が表す、完成へもたらされ、その状態が続いていることを表現する。周辺文脈のτελειόωとのつながりも保つ。
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: 愛は私たちの間で
  rationale: μετά＋属格の基本的な「共に／間で」という関係を保ち、神の愛か人の愛かを一方に限定しない。「私たちにおいて」より自然な現代日本語とした。
- source_word: παρρησίαν
  choice: 確信
  rationale: 裁きの日に神の前で恐れずにいられる自由な確信を表す。日本語の「大胆さ」より文脈に自然である。
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: 裁きの日に
  rationale: 終末的な裁きの日を指す定型的で明瞭な表現。
- source_word: καθὼς ἐκεῖνός ἐστιν
  choice: あの方が今おられるように
  rationale: ἐκεῖνοςの指示性と敬意を「あの方」で示し、現在形ἐστινを「今おられる」として明確に保つ。指示対象は文脈上イエス・キリストである可能性が高いが、本文では固有名を補わない。
- source_word: καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ
  choice: 私たちもこの世にあって同じような者だからです
  rationale: καθώς…καίの対応を「ように…も同じような者」と自然に表し、存在を単なる所在ではなく比較関係として伝える。
theological_decisions:
- issue: ἐκεῖνος（あの方）の指示対象
  choice: 本文では「あの方」とし、キリストを明示しない
  alternative: 「キリスト」または「イエス」と明示する／神一般を指すと理解する
  rationale: 第一ヨハネにおける用法からキリストを指す可能性が高いが、ギリシア語本文自体は名を明示していないため、その含みを保存する。
- issue: 全うされる「愛」の方向
  choice: 「愛」とだけ訳し、神の愛・私たちの愛のいずれかに限定しない
  alternative: 「神の私たちへの愛」または「私たちの神への愛」と限定する
  rationale: ἡ ἀγάπηとμεθ’ ἡμῶνは愛の方向を一義的に定めない。信じる者との関わりの中で愛が目的に達するという緊張を保つ。
- issue: 「あの方が…私たちも」の類似の範囲
  choice: 「同じような者」とし、類似の具体的範囲を補足しない
  alternative: 道徳的完全、義認、神との関係など特定の教理に限定する
  rationale: 本文は比較を述べるが、その全面的同一性や特定の教理的意味を明示しないため、過剰な限定を避ける。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「全うされています」で完了受動の継続的結果を示し、「確信」でπαρρησίαの恐れのない態度を自然に表現した。原文の曖昧さがある箇所は本文で過度に説明せず脚注に示した。
