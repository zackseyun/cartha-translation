language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: ja
  text: そして私たちは、御父が御子を世の救い主として遣わされたことを見、そのことを証ししています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「御父が世の救い主である御子を遣わされた」。
    reason: σωτῆρα τοῦ κόσμουは「御子」と同格の対格であり、「として」ではなく同格的に表す訳の可能性を示すため。
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: そして私たちは
  rationale: 前文とのつながりを保ちつつ、明示された代名詞の穏やかな強調を自然な日本語で表した。
- source_word: τεθεάμεθα
  choice: 見て
  rationale: 完了形が示す、実際に見た経験とその現在まで続く意義を、後続の継続的な証言と自然に結び付けた。
- source_word: μαρτυροῦμεν
  choice: 証ししています
  rationale: 現在形の継続的な証言を表し、宗教文脈でも一般読者に理解できる語を用いた。
- source_word: ὅτι
  choice: そのことを
  rationale: ここでは理由ではなく証言の内容を導く。日本語では引用節全体を「のを見て、そのことを証ししています」と構成することで自然に示した。
- source_word: ὁ πατήρ
  choice: 御父
  rationale: ヨハネ文書における神の関係的称号として、御子との対応が明瞭な現代日本語の聖書語を採用した。
- source_word: ἀπέσταλκεν
  choice: 遣わされた
  rationale: 完了形の、完了した派遣と現在に及ぶ意義を文脈上保持する。「遣わす」は使命を伴う派遣を自然に表す。
- source_word: τὸν υἱόν
  choice: 御子
  rationale: 原文には所有代名詞を補わず、御父との関係を示す称号として訳した。
- source_word: σωτῆρα τοῦ κόσμου
  choice: 世の救い主として
  rationale: 同格的な対格を自然な日本語にし、御子が遣わされた役割を表した。直訳的な同格表現の可能性は脚注に残した。
- source_word: τοῦ κόσμου
  choice: 世の
  rationale: ヨハネ文書での広い範囲を狭めず、「世界の」より自然で格調ある表現とした。
theological_decisions:
- issue: 「世の救い主」の範囲
  choice: 原文どおり「世の救い主」とし、その範囲を限定しない。
  alternative: 特定の人々だけの救い主、または救いの可能性だけを与える方と解釈して訳す。
  rationale: 原文はκόσμοςを用いて広い範囲を直接述べており、特定の贖罪論や救済論を訳文に持ち込むべきではない。
- issue: 御父と御子の関係的称号
  choice: 「御父」「御子」と訳す。
  alternative: 「父なる神」「イエス・キリスト」など、本文にない名や説明を補う。
  rationale: この節は関係的称号そのものを用いているため、それを保持し、本文にない特定化を避けた。
- issue: σωτῆραの統語的関係
  choice: 「救い主として」と役割を明示する。
  alternative: 「御子、世の救い主を」と同格的に訳す。
  rationale: 原文の同格的対格は双方を許し得るが、「として」は日本語で自然であり、遣わされた御子の役割を明確にする。より直訳的な形を脚注で提示した。
translation_notes:
  register: 明瞭で現代的な標準語を基調としつつ、「御父」「御子」「救い主」「遣わす」「証し」により、ヨハネ文書にふさわしい簡潔で格調ある調子を保った。
