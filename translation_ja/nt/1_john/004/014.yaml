    issue: ὅτι節と二つの動詞の関係が本文でやや曖昧
    rationale: 原文は『私たちは見、また証しする、すなわち父が子を遣わされたことを』という構造です。現行の「…のを見て、そのことを」は意味を大きく損ないませんが、「見て」が単なる従属・順序表現にも読めます。内容節を「ことを」として明示し、等位関係を保つのがより忠実です。
  - severity: medium
    issue: 脚注の直訳例の格関係が不自然
    rationale: 「御父が御子、世の救い主を遣わされた」は、「御子」と「世の救い主」の同格関係および目的語の範囲が日本語として明瞭ではありません。『世の救い主である御子』とすれば、原文の同格的関係を自然に示せます。
  revised_text: そして私たちは、御父が御子を世の救い主として遣わされたことを見、そのことを証ししています。[a]
