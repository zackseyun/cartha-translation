source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: ja
  text: 愛する皆さん[a]、互いに愛し合いましょう。愛は神から来るものです。愛する人は皆、神から生まれており、神を知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「愛されている皆さん」。ギリシア語は直訳すると「愛された者たち」で、この節で繰り返される「愛」と同じ語族の言葉です。
    reason: 語義上の別訳と、原文におけるἀγαπ-語群の反復を示すため。
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 愛されている皆さん
  rationale: 受動的な意味を持つ呼びかけ「愛されている者たち」を、現代日本語として自然に表した。続くἀγαπάω／ἀγάπηとの語根上のつながりも「愛」によって保つ。
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: 互いに愛し合いましょう
  rationale: 一人称複数の勧奨的接続法を自然な呼びかけとして訳した。現在語幹が示し得る継続性は、「愛し続けましょう」と限定的に明示せず、文脈に委ねた。
- source_word: ὅτι
  choice: からです
  rationale: 勧めの根拠を示す原因・理由の接続を、明瞭な現代日本語で表した。
- source_word: ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν
  choice: 愛は神から出ている
  rationale: ἐκが示す源・起源を「神から」で保ち、「出ている」により、愛の源が神にあるという主張を自然に表した。
- source_word: πᾶς ὁ ἀγαπῶν
  choice: 愛する人は皆
  rationale: 冠詞付き分詞とπᾶςが表す一般的な範囲を、簡潔で自然な日本語にした。
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: 神から生まれており
  rationale: 完了受動形が示す、すでに生まれたこととその結果が現在まで続く意味を「生まれており」で表した。「神から」はἐκの起源の意味を明示する。
- source_word: γινώσκει τὸν θεόν
  choice: 神を知っています
  rationale: 現在形の継続的・関係的な知識を直接表し、「知るようになった」という明示されていない起動的意味は加えなかった。
theological_decisions:
- issue: 愛することと、神から生まれたことおよび神を知ることとの関係
  choice: 本文の三者の結びつきをそのまま述べ、愛する人は神から生まれており、神を知っていると訳す。
  alternative: 愛を、特定の救済論体系における新生の厳密な証明として説明的に訳す、または新生との関係を弱めて単なる倫理的勧告として訳す。
  rationale: ギリシア語本文が示す神学的な結びつきを保ちつつ、因果関係の詳細や救いの順序など、本文が明言しない体系的結論を訳文に持ち込まない。
- issue: ἀγαπ-語群の反復
  choice: 呼びかけ、勧め、名詞、分詞のすべてに「愛」を用いる。
  alternative: 冒頭を「親愛なる皆さん」などとし、その語彙的なつながりを弱める。
  rationale: この節を特徴づけるἀγαπ-語群の反復と、その文学的・神学的強調を日本語でも見える形にする。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体とした。「愛されている皆さん」は日常語としてやや特徴的だが、原文の受動的な呼びかけと「愛」の反復を保つために採用し、より自然な別訳を脚注に示した。
