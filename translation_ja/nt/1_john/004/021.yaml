  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: ja
  text: 私たちは神から、神を愛する者は自分の兄弟[a]をも愛するように、というこの戒めを受けています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の兄弟姉妹」とも訳せる。ギリシア語は男性単数の「兄弟」だが、ここでは仲間の信者を代表して指す表現として用いられ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: 戒め
  rationale: ヨハネ文書における道徳的・権威的な命令の重みを保ちつつ、現代日本語の聖書文体として自然な「戒め」とした。
- source_word: ἀπ’ αὐτοῦ
  choice: この方から
  rationale: ギリシア語の代名詞を「神」と明示的に置き換えず、直前の文脈にある神を指す談話の流れを保った。日本語で敬意を保つため「この方」とした。
- source_word: ἵνα
  choice: 〜という
  rationale: ここでは目的よりも戒めの内容を導く用法であるため、日本語で自然に内容を提示する「という」とした。
- source_word: ὁ ἀγαπῶν τὸν θεὸν
  choice: 神を愛する者
  rationale: 冠詞付き現在分詞の一般的・代表的な単数表現を、性別を不必要に限定しない自然な日本語で表した。
- source_word: ἀγαπᾷ
  choice: 愛しなさい
  rationale: ἵνα節内の接続法が戒めとして要求される行為を表すため、日本語では命令の内容として明確な「愛しなさい」とした。
- source_word: ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟
  rationale: 男性単数形を本文に保持した。「自分の」は主語との照応を日本語で明確にする。共同体内の男女を含み得る代表的用法は脚注で示した。
- source_word: καὶ
  choice: も
  rationale: 神への愛に兄弟への愛を加える添加の力を、日本語の係助詞「も」で自然に表した。
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: 愛する／愛しなさい
  rationale: ヨハネ文書の主題的一貫性を保つため、同じ語群を「愛する」で統一した。
theological_decisions:
- issue: ἀδελφὸν αὐτοῦ の性を伴う単数表現
  choice: 本文では「自分の兄弟」とし、代表的用法を脚注で説明する。
  alternative: 「自分の兄弟姉妹」または「仲間の信者」
  rationale: 原文の男性単数を本文に反映しつつ、文脈上は信仰共同体の女性を含み得ることを脚注で明示し、原文の形と実際の指示範囲の双方を保った。
- issue: ἀπ’ αὐτοῦ の指示対象
  choice: 代名詞性を保つ「この方から」
  alternative: 「神から」
  rationale: 文脈上の指示対象は神と理解されるが、原文は神を名詞で反復せず代名詞を用いるため、その談話上の形を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準日本語。「戒め」でヨハネ文書の語彙的一貫性を保ち、命令内容は「愛しなさい」と明確にした。脚注記号 [a] は該当語句の後ではなく文末に置き、節全体の可読性を優先した。
