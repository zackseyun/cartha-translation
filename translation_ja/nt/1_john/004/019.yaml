  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: ja
  text: 私たちが愛するのは、神がまず私たちを愛してくださったからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちが神を愛するのは、神がまず私たちを愛してくださったからです」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: 私たちが
  rationale: 明示された主語を訳し、神の先行する愛を受けた「私たち」との対照を自然な日本語で示す。
- source_word: ἀγαπῶμεν
  choice: 愛する
  rationale: 現在形の継続的・一般的な意味を自然に表し、原文どおり目的語を補わない。
- source_word: ὅτι
  choice: からです
  rationale: ここでは理由を示す接続詞として理解し、私たちの愛が神の先行する愛に基づくことを明確にする。
- source_word: αὐτὸς
  choice: 神が
  rationale: 文脈上の指示対象を自然な日本語で明示する。ギリシア語代名詞の強調は「まず」と主語配置によって十分に伝わる。
- source_word: πρῶτος
  choice: まず
  rationale: 神の愛が私たちの愛に時間的・論理的に先立つことを、自然かつ簡潔に表す。
- source_word: ἠγάπησεν
  choice: 愛してくださった
  rationale: アオリストの先行する決定的な行為を過去形で表す。「くださった」は、神から人への恩恵的な行為を現代日本語として自然に示すが、原語にない追加の対象や教理は導入しない。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 動詞ἠγάπησενの直接目的語をそのまま訳す。
theological_decisions:
- issue: 「私たちが愛する」の目的語を補うか
  choice: 目的語を補わず「私たちが愛する」とする
  alternative: 「私たちが神を愛する」または「私たちがこの方を愛する」
  rationale: SBLGNT本文のἀγαπῶμενには目的語がないため、その開かれた意味を保持する。神への愛と互いへの愛の双方を含み得る文脈上の広がりを、訳文で限定しない。異読は脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「愛する」の目的語を意図的に明示せず、原文の簡潔さと意味の広がりを保持した。
