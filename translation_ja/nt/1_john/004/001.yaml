id: 1JN.4.1
reference: 1 John 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: ja
  text: 愛する皆さん[a]、すべての霊を信じてはいけません。むしろ、それらの霊が神から出ているかどうかを吟味しなさい[b]。多くの偽預言者が世に出て来たからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「愛されている者たち」。親愛を込めた呼びかけで、「愛する者たち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 預言的な主張の背後にある霊的な源を吟味することを指す。続く文では、その人間の担い手が「偽預言者」と呼ばれている。
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 愛する者たち
  rationale: 呼びかけとしての複数形容詞で、著者の温かな愛情とἀγαπάω／ἀγάπηとの語彙的なつながりを保つ。現代日本語ではやや改まった表現だが、聖書本文として自然で荘重である。
- source_word: παντὶ πνεύματι
  choice: すべての霊
  rationale: 単数形による総称を自然な日本語で表した。単に人間の教師や発言へ置き換えず、預言的主張の背後にある霊的な源という本文の枠組みを保つ。
- source_word: πιστεύετε
  choice: 信じてはいけません
  rationale: μήを伴う現在命令形の一般的禁止を明確に表す。ここでは主張を真実として受け入れる意が中心なので「信頼する」より「信じる」が適切である。
- source_word: δοκιμάζετε
  choice: 吟味しなさい
  rationale: 真正さを試して見極める意味を表す。「試しなさい」より、霊的主張を慎重に検討する文脈に自然である。
- source_word: τὰ πνεύματα
  choice: その霊
  rationale: 日本語では直前の「すべての霊」を受けて集合的・個別的に「その霊」と表すと自然である。原文の霊的・超自然的な表現は保持する。
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: 神から出たものかどうか
  rationale: ἐκの起源・源泉の意味を「神から出た」で明示し、εἰによる間接疑問を「かどうか」で自然に表した。
- source_word: πολλοὶ ψευδοπροφῆται
  choice: 多くの偽預言者
  rationale: 語義を直接かつ慣用的に表す。霊と、それを通して語る人間の担い手との区別も保たれる。
- source_word: ἐξεληλύθασιν
  choice: 出て来た
  rationale: 完了形が示す、すでに世へ出て現在も活動しているという含みを文脈上自然に伝える。「現れた」と意訳せず、移動の比喩を保持する。
- source_word: εἰς τὸν κόσμον
  choice: 世に
  rationale: 「世の中へ」より簡潔で、ヨハネ文書におけるκόσμοςの広い神学的含意を不必要に限定しない。
theological_decisions:
- issue: 「霊」の指示対象
  choice: 預言者たちを通して働く霊、または預言的主張の霊的な源
  alternative: 単なる人間の教師、または抽象的な預言発言
  rationale: 本文は「霊」と「偽預言者」を区別しており、偽預言者を人間の担い手、その背後にある源を霊として理解できる。ただし本文だけで関係を過度に体系化せず、「霊」をそのまま訳して緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的勧告にふさわしい温かさと荘重さを保った。「愛する者たち」は日常会話より改まっているが、語彙的連関と呼びかけの重みを優先した。
