source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: ja
  text: だれでも、イエスが神の御子であると告白するなら、神はその人のうちにとどまり[a]、その人も神のうちにとどまる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「とどまる」は「とどまり続ける」とも訳せる。ギリシア語のメノーはヨハネ文書の重要語で、継続することや変わらず結びついていることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: だれでも……するなら
  rationale: 不定関係節の一般化する力を、現代日本語で自然な条件表現として示した。特定の人物ではなく、該当するすべての人を指す。
- source_word: ὁμολογήσῃ
  choice: 告白する
  rationale: 単なる内心の認識ではなく、イエスについての真理を公に認め表明する含みと、ヨハネ文書における神学的重みを保つ。
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: イエスが神の御子である
  rationale: 内容を導くὅτιを「が……である」という自然な引用内容の形で表し、中心的なキリスト論的称号を明確に保った。υἱόςは神との固有の関係を示す称号として、慣用的で尊厳ある「御子」とした。
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: 神はその人のうちにとどまり
  rationale: μένωの継続的・関係的な意味を保ちつつ、現代の読者にも明瞭な「とどまる」を用いた。αὐτῷの指示対象は告白する者なので、「その人」として性別を不必要に限定しない表現にした。
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: その人も神のうちにとどまっています
  rationale: 原文では動詞が省略されているが、日本語では補って相互的な構造を明瞭かつ自然にした。「も」によって対応関係を表した。
theological_decisions:
- issue: 神と人との相互内在
  choice: 「神はその人のうちにとどまり、その人も神のうちにとどまっています」と相互的な表現をそのまま保つ。
  alternative: 「神はその人のうちに住み、その人は神と結ばれています」などと説明的に言い換える。
  rationale: 本文は、イエスを神の御子と告白することと、神と告白者が互いのうちにとどまることを結びつけている。その関係を後代の体系的説明に置き換えず、原文の緊張と対称性を保持した。
- issue: ὁ υἱὸς τοῦ θεοῦというキリスト論的称号
  choice: 「神の御子」
  alternative: 「神の子」
  rationale: 「神の子」も字義的に可能だが、ここではイエスに固有の称号としての働きが明確であり、日本語聖書で定着した「御子」が尊厳と称号性を自然に伝える。本文以上の教理的説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、告白内容と相互内在の表現には聖書本文にふさわしい尊厳を保った。「だれでも」と「その人」により、原文の一般性を自然に示した。
