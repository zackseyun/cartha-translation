id: 1JN.4.13
reference: 1 John 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: ja
  text: このことによって[a]、私たちが神のうちにとどまり[b]、神も私たちのうちにとどまっておられることが分かります。神がご自分の霊を私たちに与えてくださったからです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「このことにおいて」。ここでは、何によってそれが分かるかという根拠を示しています。
    reason: lexical_alternative
  - marker: b
    text: 「とどまる」は、関係のうちに継続していることを表す、ヨハネ文書の重要な語です。
    reason: lexical_alternative
  - marker: c
    text: 直訳的には「ご自分の霊から与えてくださった」。「から」は、その源または分与を強調します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: このことによって
  rationale: ヨハネ文書で、何かを知る根拠やしるしを示す表現。直訳的な「このことにおいて」より自然な日本語で、手段・根拠の意味を表す。
- source_word: γινώσκομεν
  choice: 分かります
  rationale: 現在形が示す継続的な認識を、明瞭で自然な現代日本語にした。「知っています」も可能だが、この構文では「分かります」が根拠に基づく認識をよく伝える。
- source_word: ἐν αὐτῷ μένομεν
  choice: 神のうちにとどまり
  rationale: μένωの継続的・関係的な意味を「とどまる」で保持した。日本語では代名詞の連続が不自然で指示対象も曖昧になりやすいため、文脈上の指示対象である「神」を明示した。
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: 神も私たちのうちにとどまっておられる
  rationale: ギリシア語では前節の動詞が省略されているが、日本語では補うほうが自然で、相互にとどまるという並行関係も明確になる。敬語形は神を指す自然で品位ある日本語。
- source_word: ὅτι
  choice: からです
  rationale: 二つ目のὅτιを、知る根拠を示す説明として自然に表した。内容を示す「ということ」と取る余地もあるが、この文脈では理由・根拠の読みが適切。
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: ご自分の霊を
  rationale: 本文は自然な日本語を優先した。ἐκは厳密には「ご自分の霊から」を表し、源または分与の含みがあるため、その点を脚注で明示した。「霊」は文脈上、神の聖霊を指す。
- source_word: δέδωκεν ἡμῖν
  choice: 私たちに与えてくださった
  rationale: 完了形が示す、過去に与えられ現在も効力を持つ行為を日本語の完了表現で示した。「くださった」により、神から人への恵み深い授与を自然に表す。
theological_decisions:
- issue: αὐτόςおよびαὐτοῦの指示対象とπνεῦμαの意味
  choice: 指示対象を「神」と明示し、πνεῦμαを神の霊、すなわち聖霊として「ご自分の霊」と訳す。
  alternative: 代名詞的に「この方」「その方」とする、または「霊」を一般的な霊的性質と取る。
  rationale: 直前の文脈では神が主語であり、神と信者の相互内住を神が与えた霊が確証する。「神」を補うのは日本語で指示関係を明瞭にするためで、別の指示対象を導入するものではない。
- issue: 相互内住を表すμένω
  choice: 双方について「うちにとどまる」を用いる。
  alternative: 「つながっている」「住んでいる」と意訳する。
  rationale: ヨハネ文書の鍵語であるμένωの継続性と、神と信者の相互的な関係を保ち、特定の教派的説明を加えない。
- issue: ἐκ τοῦ πνεύματοςの源・分与の含み
  choice: 本文では「ご自分の霊を…与え」、直訳的な含みを脚注で示す。
  alternative: 「ご自分の霊から分け与えた」と本文で訳す。
  rationale: 後者はギリシア語のἐκを明示できる一方、霊が分割可能であるかのような不要な印象を日本語で生みうる。本文の自然さを保ちつつ、源・分与のニュアンスを脚注で保存する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神については自然な敬語を採用した。鍵語μένωは「とどまる」で統一し、ヨハネ的な相互内住の表現を保った。ギリシア語の代名詞は、日本語での明瞭さのため文脈上の指示対象「神」に置き換えた。
