  text: ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: ja
  text: 愛さない者は、神を知るようになっていません[a]。神は愛だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神を知りません」。ギリシア語のアオリストはこのように簡潔にも訳せますが、本文は、神を知るようになっていないという含みを表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: 愛さない者
  rationale: 冠詞を伴う現在分詞を、愛することを欠く人を一般的に指す表現として自然な日本語にした。現在分詞の継続的・特徴的な含みも保っている。
- source_word: ἀγαπῶν / ἀγάπη
  choice: 愛する / 愛
  rationale: 同根語のつながりが見えるよう、日本語でも「愛」を共通して用いた。
- source_word: οὐκ ἔγνω
  choice: 知るに至っていません
  rationale: アオリストが文脈上示しうる、神を知るようになっていないという結果的な状態を表した。単なる知的理解ではなく、関係的に神を知る意味も損なわない。
- source_word: ὅτι
  choice: だからです
  rationale: 前文の理由を導く因果関係を、現代日本語で明確かつ自然に示した。
- source_word: ὁ θεὸς ἀγάπη ἐστίν
  choice: 神は愛です
  rationale: 「神」を主題・主語、「愛」を述語として保ち、逆の「愛は神である」とはしなかった。
theological_decisions:
- issue: 「神は愛である」の力点
  choice: 神は愛だからです
  alternative: 神は愛する方だからです
  rationale: 抽象名詞を述語とする原文の重みを保ち、神の性質について述べる表現とした。神を愛と完全に同一視する逆方向の命題にはしていない。
- issue: 神を「知る」ことの時制・相
  choice: 神を知るに至っていません
  alternative: 神を知りません
  rationale: ἔγνωのアオリストを踏まえ、神を知るようになっていないという含みを本文に残した。同時に、ヨハネ文書における関係的な「知る」を、知的な「理解する」に狭めなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「神は愛」という簡潔で荘重な宣言を保持した。「知るに至っていません」は日常語よりやや改まった表現だが、原文の相の含みを過度な説明なしに伝えるため採用した。
