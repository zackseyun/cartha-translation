id: 1JN.4.18
reference: 1 John 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: ja
  text: 愛には恐れがありません。むしろ、完全な愛[a]は恐れを外へ追い出します。恐れには罰が伴うからです[b]。恐れている人は、愛のうちに完成されていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「完全な」は、「完成した」「十分に成熟した」、すなわち本来の満ちた状態に達した、という意味にも理解できます。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「恐れは罰を持っています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: 恐れ／恐れている人
  rationale: 裁きと罰を前にした恐れを表し、節内で繰り返される語のつながりも保つ。
- source_word: ἀγάπῃ / ἀγάπη
  choice: 愛
  rationale: ἀγάπηの標準的で自然な訳語であり、反復を一貫して示す。
- source_word: τελεία
  choice: 完全な
  rationale: 意図された満ちた状態に達した愛を表す。『成熟した』という意味合いもあり得るため脚注で示す。
- source_word: ἔξω βάλλει
  choice: 外へ追い出します
  rationale: ἔξωを明示しつつ、力強く排除する比喩を現代日本語で自然に表す。
- source_word: κόλασιν ἔχει
  choice: 罰が伴う
  rationale: 直訳は『罰を持つ』だが、日本語として自然で、恐れと罰の密接な結びつきを示しつつ、単なる罰の予期と断定して意味を狭めない。直訳は脚注に残す。
- source_word: οὐ τετελείωται
  choice: 完成されていません
  rationale: 完了受動の結果状態を保ち、τελείαとの語根上の結びつきを『完全な／完成されて』で可能な限り示す。
theological_decisions:
- issue: 『完全な愛』と『愛のうちに完成されていない』の関係
  choice: 『完全な愛』『愛のうちに完成されていません』と訳し、完成という共通概念を保つ。
  alternative: 『成熟した愛』『愛において成熟していません』
  rationale: 愛が意図された満ちた状態に至るという意味を保ち、罪のない完全性など特定の教理を読み込まない。
- issue: 恐れと罰の関係
  choice: 『恐れには罰が伴う』
  alternative: 『恐れは罰を持っている』『恐れは罰にかかわる』
  rationale: κόλασιν ἔχειの簡潔さと曖昧さを大きく損なわず、自然な日本語にする。恐れを罰への不安だけに限定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、文体の尊厳を保った。φόβος、ἀγάπη、τέλειος／τελειόωの反復と語彙上のつながりをできる限り可視化し、原文の神学的緊張を説明的な言い換えで解消しないようにした。
