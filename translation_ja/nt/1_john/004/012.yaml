id: 1JN.4.12
reference: 1 John 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: ja
  text: 誰も、これまでに神を見たことはありません。私たちが互いに愛し合うなら、神は私たちのうちにとどまり、神の愛[a]は私たちのうちで完全なものとなっています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神への私たちの愛」とも訳せます。ギリシア語の「神の愛」は、神が私たちに示す愛とも、私たちが神に向ける愛とも理解できますが、ここでは文脈上、前者と解しました。
    reason: alternative_reading
  - marker: b
    text: または「全うされています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: 見た者はいません
  rationale: θεάομαιの完了形を、πώποτεと否定語を含む日本語の自然な表現の中で訳した。「見たことのある者はいません」より簡潔で格調を保ちつつ、過去から現在に及ぶ経験の否定を伝える。
- source_word: πώποτε
  choice: いまだかつて
  rationale: 否定文と結びつく「かつて一度でも」の意味を、明瞭で品位のある現代日本語で表した。
- source_word: ἐὰν ἀγαπῶμεν
  choice: 愛し合うなら
  rationale: ἐάν＋現在接続法の条件を「なら」で保ち、ἀλλήλουςとの組み合わせを自然な相互表現にした。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 相互代名詞の意味を「愛し合う」と組み合わせて、重複感のない自然な日本語にした。
- source_word: μένει
  choice: とどまり
  rationale: ヨハネ文書で重要な継続的・関係的意味を持つμένωを、現代語として分かりやすい「とどまる」で一貫して表現できるようにした。
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: 神の愛
  rationale: 直前の主語が神であるため、代名詞を日本語では「神」と明示した。文脈上は神が示す愛を第一義としつつ、属格が「神への愛」を意味し得る曖昧さは脚注に残した。
- source_word: ἐν ἡμῖν
  choice: 私たちのうちに／私たちのうちで
  rationale: 神が内にとどまるという主題を保つため「うちに」とし、後半では日本語の格関係に合わせて「うちで」とした。「私たちの間に」という共同体的理解も可能だが、ここでは内住の含意を優先した。
- source_word: τετελειωμένη ἐστιν
  choice: 全うされています
  rationale: 完了受動分詞と現在形の迂言的構文が示す、完成されて現在もその状態にあることを表した。「全うする」はτελειόωとの語彙的つながりを保ち、単に道徳的な無欠陥を意味する「完全」より、目的・完成への到達を示しやすい。
theological_decisions:
- issue: ἡ ἀγάπη αὐτοῦ（神の愛）の属格の意味
  choice: 神が示す愛が私たちのうちで全うされる
  alternative: 私たちの神への愛が私たちのうちで全うされる
  rationale: 直前の4章10–11節では神の先行する愛が強調されているため、主語的属格として読むのが文脈上より自然である。ただし、ギリシア語の形だけでは「神への愛」という目的語的属格も排除できないため、脚注で保存した。
- issue: ἐν ἡμῖνの範囲
  choice: 私たちのうちに／うちで
  alternative: 私たちの間に／間で
  rationale: μένειと結びつくヨハネ的な内住の主題を優先した。ただし、信徒共同体の間で愛が現れるという含意まで否定する訳ではない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい品位を保った。「いまだかつて」「全うされています」はやや格調のある表現だが、一般読者にも理解可能であり、原文の普遍的否定と完成状態を簡潔に伝える。敬語的な「おられる」は補わず、原文にない待遇表現を避けた。
