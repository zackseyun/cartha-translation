  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: ja
  text: だれかが「私は神を愛している」と言いながら、自分の兄弟[a]を憎んでいるなら、その人は偽り者である。自分の兄弟を見たことがあるのに、その兄弟を愛さない人は、見たことのない神を愛することができないからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語は男性単数形の「兄弟」だが、ここでは男女を代表して用いられている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: もし…と言いながら、…人がいるなら
  rationale: ἐάνと接続法は一般的な条件を表す。「と言いながら」により、神への愛の主張と兄弟への憎しみが併存する条件構造を自然な日本語で明確にした。
- source_word: Ἀγαπῶ τὸν θεόν
  choice: 私は神を愛している
  rationale: 現在形の主張を自然に表し、後半で反復されるἀγαπάωとの語彙的なつながりを「愛する」で保った。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟
  rationale: αὐτοῦの指示を「自分の」で明確にし、男性単数形ἀδελφόςを本文では「兄弟」とした。文脈上、男女双方の信徒を代表し得ることは脚注に示した。
- source_word: μισῇ
  choice: 憎んでいる
  rationale: 現在接続法の継続的な状態を、条件節に自然な現代日本語で表した。
- source_word: ψεύστης ἐστίν
  choice: その人は偽り者である
  rationale: ψεύστηςは述語名詞であり、単に「偽っている」ではなく、本文の断定的な評価を保つため「偽り者」とした。
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: …愛さない人は、…からである
  rationale: 冠詞付き分詞の実質名詞的用法を「人」とし、γάρの説明的機能を文末の「からである」で自然に表した。
- source_word: ὃν ἑώρακεν
  choice: 自分が見たことのある
  rationale: 完了形ἑώρακενの既経験と現在との関係を「見たことのある」で表し、神についての「見たことのない」との対照を保った。
- source_word: οὐ δύναται ἀγαπᾶν
  choice: 愛することができない
  rationale: 能力・可能性を否定するδύναταιの強い主張を、そのまま「できない」で表した。
theological_decisions:
- issue: ἀδελφόςが文脈上、信仰共同体の男女を代表し得ること
  choice: 本文は「兄弟」、脚注で代表的用法を説明
  alternative: 兄弟姉妹／信仰の仲間
  rationale: ギリシア語の男性単数形を本文で保持しつつ、その文脈的な包摂性を排除しないよう脚注を付した。「信仰の仲間」は文脈説明を本文に取り込みすぎるため採用しなかった。
- issue: οὐ δύναται ἀγαπᾶνの強さ
  choice: 神を愛することができない
  alternative: 神を愛するのは難しい
  rationale: 本文は単なる困難ではなく不可能を述べるため、その強い道徳的・霊的主張を弱めなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、断定的で格調のある「である」体とした。原文の「見たことのある／見たことのない」という対照と、「愛する」の反復を保持した。
