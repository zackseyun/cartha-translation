  to: 神の愛は、このことによって私たちの間に[a]明らかにされました。すなわち、神がご自分のただひとりの御子[b]を世に遣わされたのは、私たちがその方によって生きるためです。
  rationale: 本文の意味は維持したまま、φᾰνερόωに対応する日本語をより明瞭な「明らかにされました」に整えた。また、μονογενήςについて出生行為を含意するように読まれ得る不自然な脚注表現を除き、伝統的訳語と語の中心的な含意を簡潔かつ正確に示した。
