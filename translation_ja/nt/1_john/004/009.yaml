id: 1JN.4.9
reference: 1 John 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: ja
  text: 神の愛は、このことによって私たちの間に[a]明らかにされました。すなわち、神がご自分のただひとりの御子[b]を世に遣わされたのは、私たちがその方によって生きるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの内に」とも訳せる。ギリシア語は、信じる者の内に現されたこと、または共同体の間に現されたことのどちらをも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「ひとり子」。ギリシア語μονογενήςは、御子が唯一無二であることを強調する。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このことによって
  rationale: 後続するὅτι節が、神の愛がどのように現されたかを具体的に説明するヨハネ文書の表現。日本語では「このことによって」が自然で、手段・現れ方の両面を保つ。
- source_word: ἐφανερώθη
  choice: 現されました
  rationale: φανερόωのアオリスト受動態。神の愛が目に見える形で明らかになったことを表す。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 神の愛
  rationale: 文脈上、神に属し、神から出る愛を指す主語的属格として自然に読める。
- source_word: ἐν ἡμῖν
  choice: 私たちの間に
  rationale: 共同体のただ中、または私たちとの関わりにおいて愛が現されたという意味を自然な日本語で示す。「私たちの内に」という可能性は脚注に残す。
- source_word: ὅτι
  choice: すなわち
  rationale: 先行する「このこと」の内容を説明する節を導く。日本語では説明関係を明確にするため「すなわち」とした。
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: ご自分のただひとりの御子
  rationale: μονογενήςはここで御子の唯一無二性を強調する。「ただひとりの」は現代日本語で明瞭であり、伝統的な「ひとり子」は脚注に示す。
- source_word: ἀπέσταλκεν
  choice: 遣わされた
  rationale: 完了形が示す、すでに成し遂げられ今も意義を持つ派遣を、日本語の文脈と敬意にかなう表現で示す。
- source_word: εἰς τὸν κόσμον
  choice: 世に
  rationale: 御子が遣わされた人間世界を指す、簡潔で定着した日本語表現。
- source_word: ἵνα ζήσωμεν
  choice: 私たちが…生きるため
  rationale: ἵναと接続法が表す目的を明確に伝える。「生きる」は御子によって与えられる命を表しつつ、その内容を訳文で過度に限定しない。
- source_word: δι’ αὐτοῦ
  choice: その方によって
  rationale: διά＋属格の手段・媒介を表す。「その方」は直前の御子を明瞭に受け、敬意ある自然な日本語となる。
theological_decisions:
- issue: μονογενήςが御子について表す意味
  choice: 本文では「ただひとりの御子」とし、御子の唯一無二性を示す。
  alternative: 伝統的な「ひとり子」または語源的理解を反映する「独り生まれの御子」。
  rationale: 語そのものは、ここでは御子の比類のない独自の関係を強調すると理解するのが自然である。後代の教理的定式を語義に直接持ち込まず、歴史的に定着した訳語は脚注に保存する。
- issue: ἐν ἡμῖνの範囲
  choice: 本文では「私たちの間に」とし、共同体の中で神の愛が現されたという意味を示す。
  alternative: 「私たちの内に」として、信じる者の内側に現されたことを表す読み。
  rationale: ギリシア語は共同体のただ中と人の内側の双方を表し得る。文脈上の共同的な現れを本文に採りつつ、内面的な読みも脚注で保持し、曖昧さを解消しすぎない。
- issue: 御子を遣わした目的と命の媒介
  choice: 「私たちがその方によって生きるため」と訳し、御子を命の媒介として示す。
  alternative: 「その方を通して命を得るため」。
  rationale: 原文の「生きる」を保ち、命の始まりだけでなく継続をも含み得る表現にする。訳文だけで霊的・終末的・現世的な含意の一つに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着きと品位を保った。「御子」「遣わされた」は教会用語として広く理解可能で、過度に古風にならない範囲で採用した。説明を補いすぎず、原文の簡潔な論理構造と神学的緊張を保っている。
