  source_fidelity: 本文は原文の主要な構文と意味をよく保っている。「このことによって」はἐν τούτῳを自然に表し、「私たちの間に」はἐν ἡμῖνの共同的な読みを採りつつ、脚注で「内に」という可能性を適切に保持している。神が御子を世に遣わし、私たちがその方を通して生きるという目的も正確である。
  naturalness: 本文は明瞭な現代標準日本語であり、聖書本文としても自然である。「現されました」も誤りではないが、「明らかにされました」のほうがφᾰνερόωの『公に明るみに出る』という意味を現代日本語でより明瞭に伝える。
  terminology: 「神の愛」「御子」「世」「遣わされた」「その方によって」は一貫しており、適切である。脚注bの「独り生まれの御子」「唯一生まれた御子」は、現代日本語として不自然で、μονογενήςの語義を出生行為へ不必要に限定しかねないため削除する。伝統的訳語としては「ひとり子」を示せば十分である。
