  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: ja
  text: 愛する者たちよ、神がこのように私たちを愛してくださったのなら[a]、私たちも互いに愛し合うべきです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神がこのように私たちを愛してくださったのですから」。ギリシア語は「もし」に当たる条件文を用いているが、文脈上、その条件は事実として前提されていると考えられる。
    reason: 条件文が前提された事実を示す可能性と、因果的な別訳を提示するため。
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 愛する者たちよ
  rationale: 複数への親愛を込めた呼びかけとして訳し、同節の「愛する」との語彙的な結びつきも保った。
- source_word: εἰ
  choice: のなら
  rationale: 文脈上は事実と認められている条件だが、ギリシア語の条件表現を因果表現に置き換えずに保った。
- source_word: οὕτως
  choice: このように
  rationale: 直前の文脈で示された神の愛し方を指しつつ、その愛の大きさも響かせる自然な表現。
- source_word: ὁ θεὸς
  choice: 神が
  rationale: 定冠詞を日本語で明示せず、主語として自然に訳した。
- source_word: ἠγάπησεν
  choice: 愛してくださった
  rationale: アオリストの出来事性を過去形で表し、神から私たちへ向けられた愛を自然で敬意ある現代日本語にした。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 一人称複数の目的語を明確に表した。
- source_word: καὶ ἡμεῖς
  choice: 私たちも
  rationale: 明示された代名詞の強調と、神の愛に応答する「も」の対応を自然に示した。
- source_word: ὀφείλομεν
  choice: べきです
  rationale: 負い目に由来する道徳的責務を表しつつ、単純な命令以上の勧告的な調子を保った。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 相互性を簡潔で自然な日本語で表した。
- source_word: ἀγαπᾶν
  choice: 愛し合う
  rationale: ἀλλήλουςとの組み合わせを自然な日本語にし、継続的・相互的な愛を表した。
theological_decisions:
- issue: εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς の条件節の効力
  choice: 「神がこのように私たちを愛してくださったのなら」と条件形を保持する。
  alternative: 「神がこのように私たちを愛してくださったのですから」と理由を明示する。
  rationale: 文脈では神が愛されたことが事実として前提されているが、原文は修辞的な条件文である。その形と神学的な緊張を保ち、理由節へ一義的に解消しなかった。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「愛する者たちよ」はヨハネの親愛に満ちた呼びかけと、節内で反復される「愛」の語彙的連関を保持する。「愛してくださった」は日本語として神の恩恵的な行為を自然に表すが、原文にない特定の教派的含意は加えていない。
