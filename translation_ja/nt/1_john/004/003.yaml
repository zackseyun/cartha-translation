id: 1JN.4.3
reference: 1 John 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: ja
  text: また、イエスを告白しない霊はどれも、神からのものではありません。[a] これが反キリストの霊です。[b] あなたがたが来ると聞いているその霊は、今すでに世にあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「イエス・キリストが肉体をもって来られたことを告白しない」とあります。
    reason: textual_variant
  - marker: b
    text: ギリシア語では「霊」が繰り返されず、直訳すると「これが反キリストのものです」となる省略表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: 霊はどれも
  rationale: 単数形を伴う πᾶν の配分的な意味を自然な日本語で表した。文脈は聖霊ではなく、吟味される個々の霊的な働きや主張を指す。
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: イエスを告白しない
  rationale: SBLGNTの短い本文をそのまま反映し、ὁμολογέω が含む公の承認・信仰告白の意味を保った。長い異読は脚注に示した。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から出たものではありません
  rationale: ἐκ が示す起源・由来を明確にしつつ、現代日本語として自然にした。
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: これが反キリストの霊です
  rationale: ギリシア語では後半の「霊」が省略されているが、直前の πνεῦμα から明白に補えるため、読みやすさを優先して明示した。原文の省略は脚注に記した。
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: あなたがたは、それが来ると聞いていました
  rationale: 関係代名詞 ὃ は中性であり、反キリストという人物を男性として直接指すと断定せず、直前の「反キリストの霊」を受ける「それ」とした。完了形は以前から聞いていた内容が現在にも関わることを表す。
- source_word: ἐν τῷ κόσμῳ ἐστὶν ἤδη
  choice: 今すでに世に存在しています
  rationale: ἤδη の実現済みの現在性を「今すでに」で表し、霊について不自然にならないよう ἐστίν を「存在しています」とした。
theological_decisions:
- issue: 否定されている信仰告白の本文形
  choice: 本文ではSBLGNTの短い読み「イエスを告白しない」を採用する。
  alternative: 「イエス・キリストが肉体をもって来られたことを告白しない」
  rationale: 原語の批判本文を優先し、2節の表現を3節へ補って調和させることを避けた。伝統的な長い異読は脚注で保持した。
- issue: τὸ τοῦ ἀντιχρίστου の省略表現
  choice: 本文では文脈上補われる「霊」を明示し、「反キリストの霊」とする。
  alternative: 「これは反キリストのものです」のように省略を形の上でも残す。
  rationale: 原文には πνεῦμα の反復がないものの、直前の語から補うのが自然であり、日本語で省略を直訳すると意味が不明瞭になる。脚注で原文の形を説明した。
- issue: 来るものの指示対象
  choice: 「それが来る」とし、反キリストの霊を受ける中性的な表現にする。
  alternative: 「彼が来る」として反キリスト本人を指すと解する。
  rationale: 原文の関係代名詞 ὃ は中性であるため、人物を指す男性的な解釈に限定せず、原文の曖昧さを保った。
translation_notes:
  register: 明瞭で品位のある現代標準日本語を用いた。「告白する」は日常語では複数の意味を持つが、ここでは信仰を公に認めるという原語の意味を保つため採用した。敬体で統一し、「反キリスト」は日本語聖書で広く理解される用語とした。
