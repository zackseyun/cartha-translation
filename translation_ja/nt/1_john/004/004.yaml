id: 1JN.4.4
reference: 1 John 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: ja
  text: 子どもたち、あなたがたは神からの者であり、すでに彼らに打ち勝っています。あなたがたのうちにおられる方は、世にいる者[a]よりも偉大だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼ら」とは、直前に述べられた者たち、特に偽預言者たちを指します。
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された代名詞の強調を、主題提示と語順によって自然な日本語で表した。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から出た者
  rationale: 神を源とし、神に属するというヨハネ文書特有の表現を保つ。「神からの者」より起源の意味が明瞭である。
- source_word: τεκνία
  choice: 子どもたち
  rationale: 著者の親愛を込めた呼びかけ。現代日本語で自然にしつつ、家族的な比喩を保った。
- source_word: νενικήκατε
  choice: 勝っています
  rationale: 完了形が示す、すでに得られ現在も有効な勝利を表す。「打ち勝ちました」より継続する結果が伝わりやすい。
- source_word: αὐτούς
  choice: 彼ら
  rationale: 直前の偽預言者たちを受ける代名詞を、本文では過度に特定せず保持した。
- source_word: ὅτι
  choice: だからです
  rationale: 前半の勝利の理由を明示する因果関係として訳した。
- source_word: μείζων
  choice: 偉大
  rationale: 力の強さだけに狭めず、比較語の広い意味を保った。
- source_word: ὁ ἐν ὑμῖν
  choice: あなたがたのうちにおられる方
  rationale: 人格的指示を表しながら、その方が神か御霊かを本文で明示しないギリシア語の含みを保った。
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: 世にいる者
  rationale: 前句との対照を保ちつつ、悪魔などの明示的な同定を本文に持ち込まなかった。
- source_word: κόσμῳ
  choice: 世
  rationale: ヨハネ文書で神に背く領域を含意し得るが、本文では基本的で簡潔な訳語を用いた。
theological_decisions:
- issue: 「あなたがたのうちにおられる方」と「世にいる者」の同定
  choice: 両者の指示対象を本文では明示しない。
  alternative: 前者を神または聖霊、後者を悪魔・悪しき者と明記する。
  rationale: 文脈上その理解が有力だが、ギリシア語は双方を暗示的に述べているため、修辞的な対照と神学的な含みをそのまま残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「子どもたち」で親愛の呼びかけを保ち、「偉大」によって比較を単なる力の強弱へ限定しない。脚注記号は関連箇所の直後に置いた。
