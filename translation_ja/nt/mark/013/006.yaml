  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: ja
  text: 多くの者が、わたしの名によって来て、「わたしがその者だ」と言い、多くの人を惑わします。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの者
  rationale: 形容詞が名詞的に用いられ、不特定多数の人々を指す。簡潔でありながら人物を明示する表現とした。
- source_word: ἐλεύσονται
  choice: やって来て
  rationale: ἔρχομαιの未来形。「来る」という基本的な意味を保ちつつ、警告の文脈で人々が登場することを自然な日本語で表した。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの名を根拠または権威として来るとの主張を表す。「名を名乗って」ほど意味を限定せず、ギリシア語の幅を残した。
- source_word: λέγοντες
  choice: と言い
  rationale: 付帯状況を表す分詞を、解釈を加えすぎない素直な発話表現で訳した。
- source_word: ὅτι Ἐγώ εἰμι
  choice: 「わたしがその者だ」
  rationale: ギリシア語には補語が明記されていないが、この文脈では話者が自分こそ該当する者だと主張する表現として自然に理解できる。日本語として意味が通るよう最小限の補いをし、原文の省略は脚注で示した。
- source_word: πολλοὺς
  choice: 多くの人
  rationale: 動詞の目的語であり、多数の人々を指す。冒頭との対応を保ちながら、目的語として自然な日本語にした。
- source_word: πλανήσουσιν
  choice: 惑わします
  rationale: 真理や正しい道から外れさせるというπλανάωの意味を、簡潔で聖書本文にふさわしい現代日本語で表した。
theological_decisions:
- issue: 偽って名乗る者たちの発言におけるἘγώ εἰμιの訳し方
  choice: わたしがその者だ
  alternative: わたしはいる／わたしである
  rationale: 直前の「わたしの名によって」と終末的警告の文脈から、イエスに属する身分や役割を自称する発言と読める。ただし原文は補語を明記しておらず、神学的含意を一つに限定しないため、その形式上の曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、警告としての重みを保つ丁寧体にした。「わたしの名によって」は慣用性と原文の意味の幅を両立させ、「惑わします」は比喩的・宗教的文脈にも自然な語として選んだ。
