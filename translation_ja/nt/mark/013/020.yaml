language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: ja
  text: もし主がその日々を短くしなかったなら、だれ一人救われなかったであろう。[a] しかし主は、選ばれた者たち――ご自分が選んだ者たち――のために、その日々を短くした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「すべての肉が救われることはなかったであろう」。ここで「肉」は人間を指す慣用的な表現。
    reason: πᾶσα σάρξの字義的表現と、人間一般を指す文脈上の慣用的意味を示すため。
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: 短くしてくださった
  rationale: 「短くする、切り詰める」の意味。災難の期間を短縮するという文脈を自然な現代日本語で表し、二度の用例を同じ表現で訳した。「くださった」は、選ばれた者たちのためになされた行為という受益性を日本語として自然に示す。
- source_word: κύριος
  choice: 主
  rationale: 文脈上、特定の神的主体を指すため、聖書日本語として定着し、かつ簡潔な「主」とした。
- source_word: τὰς ἡμέρας
  choice: その日々
  rationale: 直前に述べられた苦難の期間を指す。単なる暦日ではなく、既出の期間への照応を「その」で明示した。
- source_word: οὐκ ἂν ἐσώθη
  choice: 救われなかったであろう
  rationale: 反実仮想の結果を表す構文を「もし～なかったなら、～なかったであろう」で再現した。文脈上は生命の保全が前面にあるが、σῴζωの語義の広がりを狭めないため「救われる」を保持した。
- source_word: πᾶσα σάρξ
  choice: だれ一人
  rationale: 否定文中のπᾶσα σάρξは「いかなる肉なる者も」、すなわち「だれも」を意味する慣用句。日本語本文では誤解の少ない「だれ一人」とし、直訳を脚注に残した。
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: 選ばれた者たちのために
  rationale: διά＋対格の理由・利益を「～のために」で表した。ἐκλεκτοίは日本語で意味が明瞭な「選ばれた者たち」とし、特定の教派的選びの理解を加えない。
- source_word: οὓς ἐξελέξατο
  choice: ご自分が選んだ
  rationale: 関係節を自然に前置修飾へ移し、ἐκλέγομαιを「選ぶ」と透明に訳した。主語は直前の「主」であり、再帰的な関係を「ご自分が」で明確にした。
theological_decisions:
- issue: 「救われる」の文脈的意味
  choice: 本文では「救われる」を保ちつつ、直接の文脈では人命が保たれることを指すものとして訳す。
  alternative: 「生き残る」「命が助かる」と限定して訳す。
  rationale: 苦難の日々が短縮されなければ人が滅びるという文脈なので、身体的な生存が直接の意味である。ただし、訳語を「生き残る」に限定するとσῴζωの表現を狭めるため、「救われる」を採用した。
- issue: 「選ばれた者たち」の範囲と選びの性質
  choice: 神に選ばれた人々という本文の呼称をそのまま示し、その範囲や選びの仕方は規定しない。
  alternative: 特定の集団的選び、または個人の予定という教理を訳文で明示する。
  rationale: 本文は主が彼らを選んだことを述べるが、選びをめぐる広範な教理論争をここで解決してはいないため、曖昧さと神学的緊張を保持した。
- issue: 日々を短くした主体
  choice: 二度目の動詞にも「主」を補って明示する。
  alternative: ギリシア語どおり二度目の主語を省略する。
  rationale: ギリシア語では先行するκύριοςが二度目のἐκολόβωσενの主語として継続する。日本語では長い修飾句の後に主語を補うことで誤読を避け、意味を変更せず明瞭にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、終末に関する発言の荘重さを保った。「であろう」は反実仮想を明確にするためのやや格調ある表現。「選民」は教義用語として範囲を狭めたり共同体的含意を強めたりし得るため避け、「選ばれた者たち」とした。脚注標識[a]は対応する本文文末に配置した。
