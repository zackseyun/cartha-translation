source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: ja
  text: しかし、あなたがた自身、気をつけなさい。彼らはあなたがたを諸法廷に引き渡し、あなたがたは会堂で打たれます。また、あなたがたはわたしのゆえに総督たちや王たちの前に立たされます。それは彼らへの証しとなります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らに対する証しとなります」とも訳せます。また、文脈によっては「彼らに不利な証しとなります」という意味を含む可能性もあります。
    reason: εἰς μαρτύριον αὐτοῖς は、証しが「彼らへ」向けられることを示す一方、文脈上「彼らに対して／不利に」という含みを持つ可能性もあるため。
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: しかし、あなたがたは自分自身に気をつけなさい
  rationale: 現在命令形の継続的な警戒の呼びかけと、明示された代名詞・再帰代名詞による強調を保った。現代日本語として明瞭な警告表現である。
- source_word: παραδώσουσιν ὑμᾶς
  choice: 人々はあなたがたを……引き渡し
  rationale: 迫害の文脈で、権力機関の手に渡す司法的な含みを自然に表す。「裏切る」と限定しなかった。
- source_word: εἰς συνέδρια
  choice: 議会に
  rationale: 複数形はエルサレムの最高法院だけでなく地方の統治・司法機関も指し得るため、固有制度に限定しない「議会」とした。
- source_word: εἰς συναγωγὰς δαρήσεσθε
  choice: 会堂で打たれます
  rationale: συναγωγήを標準的な「会堂」とし、δέρωの受動形は道具を特定せず身体的暴力を示す「打たれる」とした。ギリシア語のεἰςは写本・構文上の難しさがあるが、自然な日本語では処罰の場として表した。
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: 総督や王たちの前に立たされ
  rationale: 受動形の強制的な出廷の含みを「立たされ」で表し、ἡγεμώνとβασιλεύςの区別を「総督」と「王」で保った。
- source_word: ἕνεκεν ἐμοῦ
  choice: わたしのために
  rationale: イエスとの結びつきが迫害の理由であることを、簡潔で格調を保つ日本語にした。「わたしのゆえに」も可能だが、現代語としての自然さを優先した。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 彼らへの証しとなります
  rationale: μαρτύριονの「証言・証し」と、αὐτοῖςに向けられる関係を保つ。「彼らに不利な証拠」と断定せず、より広い証言の意味を本文に置いた。
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖςにおける証しの方向と性格
  choice: 弟子たちが権力者の前に立つことが、彼らへの証しとなる
  alternative: 彼らを責め、彼らに不利となる証しである
  rationale: αὐτοῖςは証しが彼らに向けられることを自然に示すが、敵対的・断罪的な意味を必ずしも明示しない。本文では広い意味を保ち、可能な否定的含意を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令と迫害予告の厳粛さを保った。「会堂」「総督」「証し」は聖書文脈で定着しつつ一般読者にも理解可能な語である。脚注記号は、実際に異読・解釈上の幅がある「証し」の句の直後に置いた。
