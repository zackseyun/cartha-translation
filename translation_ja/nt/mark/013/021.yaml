id: MRK.13.21
reference: Mark 13:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: ja
  text: その時、もしだれかがあなたがたに、「見よ、メシア[a]がここにいる」とか、「見よ、あそこにいる」と言っても、信じてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。
    reason: χριστόςの伝統的な別訳を示し、称号の訳し方にある幅を保持するため。
lexical_decisions:
- source_word: καὶ τότε
  choice: その時
  rationale: 前の談話とのつながりと時間的な推移を、現代日本語で簡潔に示す。καίは日本語では独立した「そして」とせず、文脈の連続性に含ませた。
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: もしだれかがあなたがたに……と言っても
  rationale: 不特定の人物を条件的に示す構文を自然な日本語で表す。「と言っても」により、後続の禁止命令へ滑らかにつなげた。
- source_word: Ἴδε
  choice: 見よ
  rationale: 注意を強く促す間投詞としての力を保つ。現代語としてやや荘重だが、聖書本文の品位と警告の切迫感に適する。
- source_word: ὧδε
  choice: ここにいる
  rationale: 場所を示す「ここ」に、ギリシア語で省略されている存在表現を日本語の自然さのため補った。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 定冠詞を伴い、終末時の救済者という称号として用いられているため、固有名のような「キリスト」より称号性を明確に表す。
- source_word: ἐκεῖ
  choice: あそこにいる
  rationale: ὧδεとの近称・遠称の対比を「ここ／あそこ」で明瞭にし、前句から省略された存在表現を補った。
- source_word: μὴ πιστεύετε
  choice: 信じてはならない
  rationale: 継続的または一般的な禁止を、明確で dignified な現代日本語で表す。目的語は原文同様に限定せず、発言内容を信じないよう警告する余地を保った。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは偽の終末的救済者についての主張の中で称号として機能しているため、「メシア」とした。伝統的な音訳「キリスト」も可能であることを脚注に残した。
- issue: 「信じる」の対象
  choice: 目的語を明示しない
  alternative: その言葉を信じてはならない／その人を信じてはならない
  rationale: ギリシア語は目的語を明示しておらず、語られた主張と語り手のいずれか一方だけに限定しないため、日本語でも曖昧さを保持した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、警告の厳粛さを保つため「見よ」「信じてはならない」を用いた。「ここ／あそこ」の対照を自然に示し、原文の省略は必要最小限の存在表現で補った。
