  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: ja
  text: だから、目を覚ましていなさい。[a] 家の主人がいつ帰って来るのか、あなたがたには分からないからです。夕方か、真夜中か、鶏が鳴くころか[b]、朝方か。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見張っていなさい」。ここでは、油断せず警戒し続けるという意味。
    reason: lexical_alternative
  - marker: b
    text: 「鶏が鳴くころ」は、当時の夜の区分の一つを指す。
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 単に眠らないことだけでなく、警戒して備え続けることを命じる現在命令形。夜の時刻を列挙する文脈にも自然に合う。
- source_word: οὖν
  choice: だから
  rationale: 直前の教えから導かれる結論を、現代日本語で明確かつ自然に示す。
- source_word: οὐκ οἴδατε γὰρ πότε
  choice: いつ…のか、あなたがたには分からないからです
  rationale: 理由を表す γάρ と間接疑問を、日本語として自然な語順で忠実に表す。
- source_word: ὁ κύριος τῆς οἰκίας
  choice: 家の主人
  rationale: 家を治める者という比喩内の通常の意味を表しつつ、その背後にあるキリストへの含意を明示的に限定しない。
- source_word: ἔρχεται
  choice: 帰って来る
  rationale: 主人が家を離れて戻るという直前の文脈（13:34）を日本語で自然に示す。動詞自体は「来る」だが、ここでは帰還の含意が文脈上明白。
- source_word: ὀψὲ
  choice: 夕方
  rationale: ローマ式の夜の区分を並べる最初の時間帯として表す。
- source_word: μεσονύκτιον
  choice: 真夜中
  rationale: 時間帯の列挙として簡潔で標準的な訳。
- source_word: ἀλεκτοροφωνίας
  choice: 鶏が鳴くころ
  rationale: 字義的意味と夜の時間帯としての機能を、現代の一般読者に分かりやすく伝える。
- source_word: πρωΐ
  choice: 朝方
  rationale: 夜の最後の区分から朝に至る時間帯を自然に表し、「夕方」から続く列挙に合わせる。
theological_decisions:
- issue: 家の比喩の中で、間接的にイエスを指し得る κύριος をどう訳すか
  choice: 家の主人
  alternative: 家の主
  rationale: この句では称号としての「主」より、家に対する権威を持つ人物という比喩上の意味が前面にある。「主人」は日常的な像を保ちつつ、比喩のより深い指示対象を否定しない。
translation_notes:
  register: 明瞭な現代標準日本語。命令は厳粛さを保つ「〜なさい」とし、理由節は丁寧体で整えた。夜の四区分は専門語を避け、一般読者が時系列を直感的に理解できる表現にした。
