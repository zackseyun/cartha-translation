id: MRK.13.14
reference: Mark 13:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: ja
  text: しかし、「荒廃の忌まわしいもの」が立ってはならない所に立っているのをあなたがたが見たなら（読んでいる人は理解しなさい）[a]、その時、ユダヤにいる人々は山々へ逃げなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立っている」に当たるギリシャ語の分詞は男性形であり、「立ってはならない所に彼が立っている」という、背後に人物を想定する読み方も可能である。
    reason: alternative_reading
  - marker: b
    text: 「荒廃の忌まわしいもの」はダニエル書の表現を踏まえている（ダニエル9:27、11:31、12:11参照）。
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: しかし、……見たなら
  rationale: ὅταν の時を表す条件性を「見たなら」で示し、δέ は前節からの展開を示す穏やかな接続として「しかし」とした。
- source_word: ἴδητε
  choice: あなたがたが見た
  rationale: 二人称複数を明示し、時を表す条件節の中で自然な現代日本語にした。
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: 「荒廃の忌まわしいもの」
  rationale: ダニエル書を響かせる表現をできるだけ原文に近く保ち、それが物・行為・人物のいずれを指すか、また属格がどの関係を表すかを本文で限定しないようにした。
- source_word: ἑστηκότα
  choice: 立っている
  rationale: 完了分詞が表す、立てられた結果として現在そこにある状態と、原文の鮮明な表現を保った。
- source_word: ὅπου οὐ δεῖ
  choice: 立ってはならない所に
  rationale: δεῖ がここで示す不適切さ・あるべきでなさを、簡潔で自然な禁止表現によって表した。
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: 読む人は悟りなさい
  rationale: 挿入的な勧告として訳し、νοέω の単なる注意以上の理解・洞察を「悟る」で示した。
- source_word: τότε
  choice: その時
  rationale: しるしを見た後に取るべき行動を導く時間的な帰結を明示した。
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ユダヤにいる人々
  rationale: 地域名を保ちつつ、名詞化された句を明瞭な現代日本語にした。
- source_word: φευγέτωσαν
  choice: 逃げなさい
  rationale: 三人称複数の現在命令形が持つ切迫した指示を、強制的な説明文に変えず命令として表した。
- source_word: εἰς τὰ ὄρη
  choice: 山々へ
  rationale: 複数形を反映し、避難先としての山地を簡潔に表した。
theological_decisions:
- issue: ダニエル書を背景とする βδέλυγμα τῆς ἐρημώσεως の解釈
  choice: 「荒廃の忌まわしいもの」という原文に近い表現を保ち、歴史上の具体的な対象を特定しない。
  alternative: 「荒廃をもたらす冒瀆的なもの」「荒廃を招く忌まわしいもの」
  rationale: この句が物、行為、人物のいずれを指すかには解釈上の幅がある。本文で因果関係や歴史的対象を補わず、ダニエル書への暗示と神学的な緊張を保つためである。
- issue: 中性名詞 βδέλυγμα と男性形分詞 ἑστηκότα の不一致
  choice: 本文では明示された名詞に沿って「忌まわしいもの」とし、男性形が人物を示唆し得ることを脚注に残す。
  alternative: 「立ってはならない所に彼が立っている」
  rationale: 日本語では分詞の文法的性を本文にそのまま再現できず、「彼」とすると人物解釈に固定される。そこで本文の読みやすさを保ちながら、原文にある真の曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、終末論的な警告にふさわしい引き締まった格調を保った。「荒廃の忌まわしいもの」は日常語としての滑らかさよりも原文との対応と聖書間の響きを優先した。括弧内の勧告と二つの脚注記号を本文に明示した。
