  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: ja
  text: そのとき、人々は、人の子が大いなる力と栄光をもって雲とともに来るのを見る[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「雲の中で来る」。ギリシア語は「雲の中で」と読むが、「雲とともに来る」とも訳せる。この表現にはダニエル書7:13との響き合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: 人々は……見る
  rationale: 未来形の明瞭な意味を自然な現代日本語で表した。主語がギリシア語では三人称複数の動詞に含まれるため、文脈上不特定の「人々」を補った。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: ダニエル書7章とのつながりと、福音書で称号として用いられる表現を保つ、定着した訳語である。
- source_word: ἐρχόμενον
  choice: 来る
  rationale: 「人の子」を修飾する現在分詞。出来事を「到着」に限定せず、来臨の動きを簡潔に保った。
- source_word: ἐν νεφέλαις
  choice: 雲の中を
  rationale: ἐν の基本的な空間表現を保ちつつ、日本語として自然に「来る」と結び付けた。ダニエル書7:13を踏まえた「雲とともに」は脚注に残した。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 大いなる力を帯びて
  rationale: μετάが表す随伴と、πολλῆςが示す大きさを、荘重で自然な日本語として表現した。
- source_word: καὶ δόξης
  choice: 栄光
  rationale: 聖書における顕現の威光を示す定着した語を用い、「力」とともに「帯びて」に係る形にした。
theological_decisions:
- issue: 終末論的称号と雲のイメージ
  choice: 「人の子」と雲を伴う来臨の表現を、解釈的な説明を加えず保持する。
  alternative: 「人間なる者」などと動的に訳す、またはダニエル書7章への暗示を本文中で明示する。
  rationale: ダニエル書7:13への強い暗示を保ちながら、それを本文で説明し切らないことで、原文のキリスト論的・終末論的な含みと緊張を維持した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、終末論的宣言にふさわしい品位を保った。「大いなる」は一般的な「大きな」より荘重だが、聖書文として理解しやすい範囲にある。
