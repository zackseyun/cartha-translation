source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: ja
  text: 兄弟が兄弟を死に引き渡し[a]、父が子を死に引き渡す。子どもたちは親に立ち向かい、彼らを殺す[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「裏切る」。ギリシア語は「引き渡す」「委ねる」を意味し、この文脈では「裏切る」という含みもあり得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らを死に至らせる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: 引き渡す
  rationale: 権力者などの手に渡すという具体的な意味を保ちつつ、この文脈で含み得る「裏切る」という解釈に本文を限定しないため。
- source_word: ἀδελφὸς ἀδελφὸν
  choice: 兄弟が兄弟を
  rationale: 原文の単数形による代表的表現と、同じ語を反復する峻厳な響きを保つため。
- source_word: εἰς θάνατον
  choice: 死に
  rationale: 引き渡しの結果または目的が死であることを簡潔に示し、「死刑」のような司法的意味に限定しないため。
- source_word: πατὴρ τέκνον
  choice: 父が自分の子を
  rationale: πατήρの男性を明示し、性別を特定しないτέκνονは「子」とした。日本語として関係が自然に伝わるよう「自分の」を補った。省略された述語は前節から補った。
- source_word: ἐπαναστήσονται ἐπὶ
  choice: 逆らって立ち上がる
  rationale: 敵対して立ち上がるという動的で強い表現を保つため。
- source_word: γονεῖς
  choice: 親
  rationale: 複数形で父母を包括する語であり、日本語では総称として「親」が自然であるため。
- source_word: θανατώσουσιν αὐτούς
  choice: 彼らを死に至らせる
  rationale: θανατόωの使役的な形を映し、直接手を下す場合にも処刑へ追いやる場合にも限定しない表現とした。
theological_decisions:
- issue: 家族呼称における性の明示
  choice: ἀδελφόςとπατήρはそれぞれ「兄弟」「父」とし、τέκναとγονεῖςは「子どもたち」「親」とした。
  alternative: すべてを「きょうだい」「親」などに中性化する。
  rationale: 原文で男性形が用いられている箇所と、性別を限定しない語が用いられている箇所の違いを保ち、家族内の敵対という主旨を過不足なく示すため。
- issue: 家族による引き渡しと殺害の関係
  choice: 最初の二節では「死に引き渡す」、最後は「死に至らせる」と訳し、行為の仕方を特定しない。
  alternative: すべてを直接的な「殺す」と表現する。
  rationale: 原文は前半で引き渡しと死との結びつきを述べ、後半ではθανατόωを用いる。この語彙上の差と、直接殺害か権力への引き渡しかに関する余地を保つため。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、原文の反復と厳粛な調子を保った。「兄弟が兄弟を」は日常語としてやや鋭い反復だが、家族同士の敵対を際立たせる原文の修辞として維持した。
