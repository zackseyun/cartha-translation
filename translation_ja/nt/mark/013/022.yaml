- from: 偽メシアたちと偽預言者たちが現れ、しるしと不思議な業を行って、できることなら、選ばれた者たちを惑わそうとするからです。[a]
  to: というのも、偽メシアたちと偽預言者たちが現れ、しるしと不思議なことを行い、できることなら選ばれた者たちを惑わすためです。
  rationale: 目的を表す原文の構文を「惑わすために」と直接訳し、「～しようとする」が加えうる試行・未達成の含意を除いた。「というのも」と文末の「ためです」により γάρ の説明関係を自然に表し、未来の出来事を示す日本語の非過去形を用いた。注は本文の条件表現が可能・不可能の結論を決めないことを維持しつつ、「企て」より原文に近い「目的」とした。
