  source_fidelity: 「惑わそうとする」は、πρὸς τὸ ἀποπλανᾶν の目的構文を『試みる』という意味に寄せており、原文よりも企ての不成功を含意しうる。目的を表す「惑わすために」がより直接的である。また、未来の警告として文全体を明示するほうが明瞭である。
  naturalness: 現行文の「できることなら、選ばれた者たちを惑わそうとする」は理解できるが、読点による分断と「惑わそうとする」によりやや不自然である。「できることなら選ばれた者たちを惑わすために」とすると、現代標準語として自然で、原文の条件付き目的を保てる。
  terminology: 「偽メシアたち」「偽預言者たち」「選ばれた者たち」は適切である。「しるしと不思議な業」は許容されるが、τέρατα は「不思議なこと」とするほうが「しるし」と並列する対象を明確にし、余分な限定を避けられる。
  issues:
