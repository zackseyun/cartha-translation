  - severity: low
    issue: 未来の警告が日本語の文面では明示されていない。
    rationale: 日本語の非過去形は文脈次第で未来を表せるが、この節単体では「現れる」「行う」としておくほうが原文の未来形を明瞭に反映する。
  revised_text: というのも、偽メシアたちと偽預言者たちが現れ、しるしと不思議なことを行い、できることなら選ばれた者たちを惑わすためです。
