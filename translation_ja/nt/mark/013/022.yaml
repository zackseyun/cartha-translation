id: MRK.13.22
reference: Mark 13:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: ja
  text: というのも、偽メシアたちと偽預言者たちが現れ、しるしと不思議なことを行い、できることなら選ばれた者たちを惑わすためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: 現れ
  rationale: この文脈では、人々が登場し活動を始めることを表す。「起こされる」では外的・神的な働きかけを不必要に示唆するため、自然な「現れる」とした。
- source_word: γὰρ
  choice: からです
  rationale: 直前の警告の理由を説明する接続語であり、日本語では文末の「からです」が自然にその説明関係を示す。
- source_word: ψευδόχριστοι
  choice: 偽メシアたち
  rationale: Χριστόςが称号として持つ「メシア」の意味を明確にし、当時のユダヤ的背景にも適合する。
- source_word: ψευδοπροφῆται
  choice: 偽預言者たち
  rationale: 語義と聖書的用法を明瞭に伝える標準的な訳。
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: しるしと不思議な業を行って
  rationale: δώσουσινは字義的には「与える」だが、日本語では「しるしと不思議を与える」は不自然である。定型句の意味を保ちながら、自然な動作表現とした。
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: 惑わそうとする
  rationale: 目的を表す構文を意志的な企てとして自然に示す。「欺く」よりも、真理から迷わせるἀποπλανάωの含意を保つ。
- source_word: εἰ δυνατόν
  choice: できることなら
  rationale: 可能性について条件を付す簡潔な表現であり、それが実際に可能か不可能かを断定しない。
- source_word: τοὺς ἐκλεκτούς
  choice: 選ばれた者たち
  rationale: ἐκλεκτοίの受動的な「選ばれた」という意味を明瞭に伝えつつ、特定の教派的理解を付加しない。
theological_decisions:
- issue: ψευδόχριστοιに含まれるΧριστόςの称号としての訳
  choice: 偽メシアたち
  alternative: 偽キリストたち
  rationale: ここでは固有名のような「キリスト」より称号「メシア」の意味が前面に出るため。「偽キリストたち」という伝統的表現も注で示す。
- issue: εἰ δυνατόνが、選ばれた者を惑わすことの可否について含意するもの
  choice: できることなら
  alternative: もしできるものなら
  rationale: 原文は条件を述べるが、その実現が究極的に可能かどうかを明示しない。訳文でもその神学的緊張を解消しない。
- issue: εἰ δυνατόνの係り方
  choice: 「選ばれた者たち」の直前に置く
  alternative: 文末に置き、「選ばれた者たちを惑わそうとする、できることなら」とする
  rationale: ギリシア語の語順と修辞的な挿入をある程度保ちつつ、現代日本語として理解できる配置にした。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「しるしと不思議な業」は聖書的な対句を保ちながら、現代の読者にも理解しやすくした。文末の「からです」でγάρの説明的なつながりを示した。
