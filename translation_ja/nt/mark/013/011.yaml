review_pass:
  verdict: approve
  source_fidelity: 原文の構文と意味を適切に伝えている。「連れて行って引き渡す」はἄγωσινとπαραδιδόντεςの連続した行為を自然に表し、「前もって」はπρομεριμνᾶτεの事前性を保つ。「あなたがたに与えられること」は、与え手を明示しない受動態と不定性を維持している。結びの「話すのはあなたがたではなく、聖霊」は人間の発話と聖霊の究極的な働きの対照を原文どおり保っている。
  naturalness: 明瞭な現代標準日本語であり、命令の調子も本文の緊迫した文脈にふさわしい。「何を話そうかと前もって心配してはならない」および「その時に…話しなさい」は自然で理解しやすい。
  terminology: 「聖霊」は現代日本語の聖書文脈で標準的かつ適切な訳語である。「引き渡す」も当局等への引き渡しを含むπαραδίδωμιの文脈に合う。脚注を要する訳語上・本文上の曖昧さはない。
