id: MRK.13.11
reference: Mark 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: ja
  text: また、人々があなたがたを連れて行って引き渡すとき、何を話そうかと前もって心配してはならない。その時にあなたがたに与えられることを話しなさい。話すのはあなたがたではなく、聖霊だからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: また、…とき
  rationale: 前の文脈とのつながりを保ちつつ、将来起こる状況を自然な現代日本語で示す。
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: あなたがたを連れて行って引き渡す
  rationale: ἄγωσινを「連れて行く」、παραδιδόντεςを権力者側へ「引き渡す」と訳し、分詞の付帯状況を自然に表した。二つの動作を一つに溶かさず、原文の構造も残している。
- source_word: μὴ προμεριμνᾶτε
  choice: 前もって心配してはならない
  rationale: προ-の事前性と、μεριμνάωの思い煩い・不安の含意を、平明な表現でともに伝える。
- source_word: τί λαλήσητε
  choice: 何を話そうか
  rationale: 熟慮すべき発言内容を示す間接疑問として自然であり、λαλέωを後続箇所と同じ「話す」で統一した。
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: あなたがたに与えられること
  rationale: 行為者を明示しない受動態を保ち、神からの備えを暗示しながらも原文以上に説明しない。
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: その時に
  rationale: ὥραの時間的指示を、過度に文語的な「その時刻に」を避けて自然に表す。
- source_word: τοῦτο λαλεῖτε
  choice: （与えられる）ことを話しなさい
  rationale: τοῦτοが直前の内容を強く指す関係を日本語で明瞭にし、命令の直接性を保つ。
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ
  choice: 話すのはあなたがたではなく、…だからである
  rationale: ὑμεῖςの強調と「あなたがたではなく、聖霊」という対照焦点を自然な日本語の係り受けで再現する。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語の聖書・キリスト教文脈で定着した、明瞭で尊厳ある訳語。
theological_decisions:
- issue: 迫害下の発言における聖霊と弟子たちの働き
  choice: 弟子たちは命じられて実際に話す一方、その発言の究極的な主体は聖霊であるという対照をそのまま示す。
  alternative: 弟子たちを機械的な受動の器に限定する、または聖霊を一般的な宗教的感化に弱めて解する。
  rationale: 原文は、弟子たちへの「話しなさい」という命令と、「話すのはあなたがたではなく、聖霊」という強い対照を併置する。訳文では、この神的働きと人間の実際の発話との緊張を解消しない。
- issue: 「与えられる」の行為者
  choice: 受動表現を維持し、与える方を明示しない。
  alternative: 「神が与えてくださる」と明示する。
  rationale: 文脈上は神的供与が示唆され、後半で聖霊が名指されるが、δοθῇ自体の行為者は明示されていないため、訳でも補わない。
translation_notes:
  register: 明瞭な現代標準日本語。命令には「してはならない」「話しなさい」を用いて厳粛さを保ちつつ、文語的すぎる表現は避けた。日本語訳では語義上の代替を注で示す必要がないため、脚注は付していない。
