  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: ja
  text: また、星々は天[a]から落ち、天にある諸力[b]は揺り動かされる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「空」とも訳せる。ギリシア語のοὐρανόςは、文脈によって「天」または「空」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「天にある諸力」は、天上の力、宇宙的な諸力、または天の諸構造を指し得る。ギリシア語はそれ以上特定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: 星々
  rationale: 通常の天体としての意味を保ちつつ、複数形を自然な日本語で表した。
- source_word: ἔσονται ... πίπτοντες
  choice: 落ちて来て
  rationale: 未来のεἰμίと現在分詞による迂言表現の、進行的で生き生きとした動きを日本語で示す。「落ちる」だけよりも動作の展開が感じられ、後続の未来受動文にも自然につながる。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: οὐρανόςが持つ「天／空」の幅を残しつつ、黙示的・宇宙的な文脈にふさわしい「天」を本文に採用した。
- source_word: δυνάμεις
  choice: 諸力
  rationale: 天的存在、宇宙的な力、天の構造などのいずれかに限定せず、複数の「力」を簡潔に表す。
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: 天にある
  rationale: ギリシア語の複数形を日本語で機械的に「諸天」とせず、所在を自然に示した。「諸力」と合わせて宇宙的な広がりを保つ。
- source_word: σαλευθήσονται
  choice: 揺り動かされる
  rationale: 未来受動の意味を保ち、終末論的文脈での激しい動揺を明確に表す。
theological_decisions:
- issue: 「天にある諸力」の指示対象
  choice: 天的存在、宇宙的な力、天の構造のいずれとも断定せず、「天にある諸力」とした。
  alternative: 「天使たち」「天体」「天の秩序」など、特定の対象を明示する。
  rationale: δυνάμειςとその修飾句は意味の幅が広く、黙示的文脈も指示対象を一義的に確定しないため、本文の曖昧さを保持した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、黙示的場面の荘重さを保つ文体とした。「もろもろの力」より簡潔で格調のある「諸力」を用い、解釈を特定しすぎないようにした。
