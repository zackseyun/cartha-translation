id: MRK.13.27
reference: Mark 13:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: ja
  text: その時、彼は天使たちを遣わし、選ばれた者たち[a]を四方の風から[b]、地の果てから天の果てまで[c]集める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「選ばれた者たち」は、伝統的には「選民」と訳されることもある。
    reason: lexical_alternative
  - marker: b
    text: 「四方の風」は、あらゆる方向を意味する慣用表現。
    reason: cultural_note
  - marker: c
    text: 「地の果てから天の果てまで」は、「地の最も遠い果てから天の最も遠い果てまで」、あるいは解釈を加えて「天の端から端まで」と訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 終末についての語りの中で出来事の時と順序を示す。現代日本語として自然であり、「それから」よりも時点を明確に表す。
- source_word: ἀποστελεῖ
  choice: 遣わし
  rationale: 未来の行為を表すが、日本語では文末の非過去形「集める」と連動させることで予告を自然に示せる。「遣わす」は任務を帯びて送り出す意味を保つ。
- source_word: ἀγγέλους
  choice: 御使いたち
  rationale: 黙示的文脈では人間の使者ではなく天的存在を指す。「御使い」は聖書語として定着しつつ理解可能である。
- source_word: ἐπισυνάξει
  choice: 集める
  rationale: 各所にいる者たちを一つに集める意味を簡潔に表す。「集め集める」のような不自然な重複は避ける。
- source_word: ἐκλεκτούς
  choice: 選ばれた者たち
  rationale: 神に選ばれた者を指す形容詞の名詞的用法。「選民」など後代の体系的・集団的含意を帯びやすい語を避け、本文の意味を透明に示す。
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: 四方の風のもとから
  rationale: 全方向を指す慣用表現である一方、原文の「四つの風」という比喩的イメージも残す。直訳調の「四つの風から」より日本語として通じやすい。
- source_word: ἀπ’ ἄκρου γῆς
  choice: 地の果てから
  rationale: ἄκρονの「端・極限」を保ち、日本語の聖書的かつ理解可能な表現とする。
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: 天の果てまで
  rationale: 前句との並行を保ち、空間的全体性を表す。「天」を用いることで、「空」に限定するか神の住まいを指すかを訳文で決めすぎない。
- source_word: καὶ τότε ... καὶ
  choice: その時、彼は…遣わし、…集める
  rationale: 日本語では冒頭の接続詞を機械的に重ねず、「その時」で時系列を示し、連用形で二つの行為を自然に結ぶ。
theological_decisions:
- issue: ἐκλεκτούςの終末論的文脈での訳語
  choice: 選ばれた者たち
  alternative: 選民／選ばれた人々
  rationale: 選びの主体が神であるという含意を保ちながら、特定の後代の教理体系に結びつく専門用語化を避ける。また、原文に明示されない所有表現「彼の」を補わない。
- issue: 集める範囲を示す宇宙的イメージ
  choice: 四方の風のもとから、地の果てから天の果てまで
  alternative: あらゆる方角から／天の端から端まで
  rationale: 原文は「四つの風」という慣用句と、「地の果てから天の果てまで」という全範囲を示す表現を重ねている。意味を平板な説明に置き換えず、緊張を含む空間的イメージを保持する。
- issue: 三人称単数の主語
  choice: 彼は
  alternative: 人の子は／主語を省略
  rationale: ギリシア語では動詞語尾に主語が含まれ、直前の文脈では人の子を受けるが、この節自体に「人の子」という名詞はない。訳文では指示を明確にする最小限の代名詞を置き、名詞を説明的に補わない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「御使い」「地の果て」「天の果て」によって原文の黙示的で荘重な響きを保った。「彼」は前文脈の人の子を受ける。脚注記号は該当語句の直後に配置した。
