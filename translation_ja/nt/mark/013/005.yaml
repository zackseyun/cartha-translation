  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: ja
  text: そこでイエスは彼らに語り始められた。「だれにも惑わされないように、気をつけなさい。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれにもだまされないように、警戒しなさい。」
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 弱い接続を表し、直前の問いを受けてイエスが語り始める物語の流れを、過度な対立を加えず自然に示す。
- source_word: ἤρξατο λέγειν
  choice: 語り始められた
  rationale: マルコに多い叙述的表現を保ちつつ、現代日本語として自然にした。「答えた」は本文にないため補わない。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 文脈上は弟子たちを指すが、ギリシャ語本文どおり代名詞で表し、解釈的な名詞を加えない。
- source_word: Βλέπετε
  choice: 気をつけなさい
  rationale: 継続的な警戒を促す現在命令形の力を、明瞭で自然な日本語で表す。
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: だれにも惑わされないよう
  rationale: μή＋接続法による防止的警告を自然に表し、πλανάωが含む欺きと正しい道からそらす意味の両方を保持する。
theological_decisions:
- issue: πλανήσῃが示す警告の性質
  choice: 欺かれて正しい道からそれることへの警告
  alternative: 知的な欺瞞だけに限定された警告
  rationale: πλανάωは単に偽りを信じさせるだけでなく、迷わせ、道からそらす意味も持つ。「惑わす」はその広がりを保ち、特定の教理的解釈を加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスへの敬意を自然な尊敬表現で示した。警告部分は簡潔で直接的な命令調とし、古風な「用心せよ」「惑わす者に注意せよ」は避けた。
