source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: ja
  text: それらの日には、神が創造された世界の初めから今に至るまで、かつてなかったほどの苦難があり、今後も決して起こることはないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλῖψις
  choice: 苦難
  rationale: 激しい圧迫や苦しみを表す語であり、終末的文脈での重大さを保ちつつ、現代日本語として明瞭である。
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: かつてなかったほどの
  rationale: 比較表現の重なりが示す比類のなさを、自然な日本語で保持する。
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: 被造世界の初めから
  rationale: κτίσιςを単なる出来事としての「創造」ではなく、神が造ったもの全体を指しうる文脈として表し、後続の関係節とのつながりを明確にする。
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: 神が造られた
  rationale: 神が創造者であることを明示する原文の関係節を省略せず、日本語では敬意を表す慣用に従って主語敬語で表す。
- source_word: ἕως τοῦ νῦν
  choice: 今に至るまで
  rationale: 時間的な到達点を自然で格調ある現代日本語で示す。
- source_word: οὐ μὴ γένηται
  choice: 今後も決してない
  rationale: οὐ μήによる未来への強い否定を「決して」で表し、原文に明示されない「再び」を加えない。
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: それらの日には……苦難があり
  rationale: 直訳的な「日々が苦難となる」より自然でありながら、それらの日が未曾有の苦難の時となるという圧縮された述語構文の意味を保つ。
theological_decisions:
- issue: 「創造」の範囲
  choice: 「神が造られた被造世界」として、造られた秩序全体を指す表現を保持した。
  alternative: 「世界の初めから」または「天地創造の初めから」
  rationale: κτίσιςとκτίζωの語の連関、および神が創造者であるという明示を残し、地域的・契約史的な開始点へ狭めないため。
- issue: 将来の否定の強さ
  choice: 「今後も決してない」
  alternative: 「二度と起こらない」
  rationale: οὐ μήの強い未来否定を保持しつつ、原文にない「再び／二度と」を説明的に加えず、苦難を特定の終末体系へ結び付けないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、終末的言説にふさわしい厳粛さを保った。「被造世界」はやや書き言葉だが、κτίσιςと後続するκτίζωの語義的な結び付きを簡潔に示せる。原文の因果接続詞γάρは、前節への理由説明として文末の「からです」で表した。
