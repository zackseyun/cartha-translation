  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: ja
  text: 屋上[a]にいる者は、下に降りてはならない。また、家から何かを持ち出すために、中に入ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時の家の屋根は一般に平らで、人が過ごすことのできる場所でした。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: 屋上にいる者
  rationale: 冠詞付き句が名詞的に働き、その場所にいる人を指す。「者」は一般的な指示として簡潔で、命令の緊迫した調子にも合う。
- source_word: δώματος
  choice: 屋上
  rationale: 当時の家屋に一般的だった、平らで人が利用できる屋根部分を指す。「屋根」よりも、人がそこにいる情景を自然に伝える。
- source_word: μὴ καταβάτω
  choice: 下に降りてはならない
  rationale: 三人称命令法による禁止を、現代日本語で明確な禁止表現として訳した。屋上から下への移動を表すが、経路は限定しない。
- source_word: μηδὲ εἰσελθάτω
  choice: また、…中に入ってはならない
  rationale: μηδέが加える第二の禁止を「また」でつなぎ、εἰσέρχομαιの内側へ入る動きを「中に入る」と自然に表した。
- source_word: τι ἆραι
  choice: 何かを持ち出すために
  rationale: 不定代名詞τιを「何か」、不定詞ἆραιを目的として捉えた。家の中の物を取って外へ運ぶ文脈なので「持ち出す」が自然である。
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: 家から
  rationale: ἐκの内から外への方向は「持ち出す」によって表される。日本語では直前の人物自身の家であることが文脈上明らかであり、「彼の家」とすると不自然になりやすいため、簡潔に「家」とした。
theological_decisions:
- issue: 一般的な指示に用いられた男性単数形と所有表現
  choice: 「屋上にいる者」「家」とし、性別を明示しない
  alternative: 「屋上にいる男は」「彼の家から」
  rationale: ギリシア語の男性単数はここで代表的・一般的に用いられている。日本語の「者」と文脈依存の「家」は、指示対象を女性に限定せず、かつ単数の人物とその家との関係を自然に保つ。「男」や「彼」を補うと、原文の一般的効力を不必要に狭める。
translation_notes:
  register: 明瞭な現代標準日本語を用い、緊迫した禁止命令を「〜てはならない」で格調を保って表現した。二つの禁止を分けて読みやすくしつつ、後半の目的関係を明示した。
