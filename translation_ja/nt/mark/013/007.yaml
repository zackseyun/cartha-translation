source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: ja
  text: また、戦争や戦争の知らせ[a]を聞くとき、うろたえてはいけません。こうしたことは起こらなければなりませんが、まだ終わりではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「戦争のうわさ」。ギリシア語は、戦争について聞こえてくる報告、知らせ、またはうわさを指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: また、…ても
  rationale: ὅτανの将来における時の不定条件を、日本語では「…ても」で自然に表した。δέは強い逆接ではなく、文脈をつなぐ「また」とした。
- source_word: ἀκούσητε
  choice: 聞いても
  rationale: ὅτανに伴うアオリスト接続法を、将来に起こり得る事態として自然な現代日本語で表した。
- source_word: πολέμους
  choice: 戦争
  rationale: πόλεμοςの標準的で直接的な訳語。複数性は、日本語では無標の名詞でも文脈上十分に伝わる。
- source_word: ἀκοὰς πολέμων
  choice: 戦争の知らせ
  rationale: ἀκοήは聞こえてくる報告・知らせ・うわさを指し得る。「知らせ」は真偽未確認との含みを不必要に加えず、意味範囲を広く保つ。別訳を脚注に示した。
- source_word: μὴ θροεῖσθε
  choice: うろたえてはいけません
  rationale: θροέομαιが表す、動揺し平静を失うことへの禁止を、明瞭で自然な日本語にした。単なる恐怖よりも心理的動揺をよく表す。
- source_word: δεῖ γενέσθαι
  choice: それらは起こらなければなりません
  rationale: δεῖの必要性を「なければなりません」で保ち、γενέσθαιを「起こる」とした。省略された主語は直前の戦争とその知らせを受ける「それら」で補った。
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: しかし、まだ終わりではありません
  rationale: ἀλλάの対照とοὔπωの「まだ…ない」を明示し、τὸ τέλοςは終末論的意味を限定しすぎない「終わり」とした。
theological_decisions:
- issue: δεῖ γενέσθαιにおける終末論的な必然性
  choice: 「起こらなければなりません」として必要性を明示する
  alternative: 「起こることになっています」
  rationale: 本文は出来事の必要性を述べるが、その仕組みや終末の詳細な体系は説明しない。義務表現ではあるものの、ここでは事態の必然を表す自然な日本語として用い、特定の終末論や決定論を持ち込まない。
- issue: τὸ τέλοςの指示内容
  choice: 「終わり」
  alternative: 「世の終わり」
  rationale: 定冠詞付きのτέλοςは文脈上終末を指すが、「世の」を補うと原文以上に指示内容を限定し得るため、簡潔な「終わり」にとどめた。
translation_notes:
  register: 現代標準語による、明瞭で品位ある敬体。弟子たちへの直接的な警告として自然に響くようにしつつ、原文の必要性と「まだ終わりではない」という緊張を保持した。
