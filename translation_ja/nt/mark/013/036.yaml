  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: ja
  text: 突然来て、あなたがたが眠っているのを見つけることのないように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: 帰って来て
  rationale: 文脈上、旅に出た家の主人の帰還を指すため、日本語では単なる「来て」より「帰って来て」が自然で明確。
- source_word: ἐξαίφνης
  choice: 突然
  rationale: 予期しない急な到来を簡潔に表す。
- source_word: εὕρῃ
  choice: 見つける
  rationale: 到着時に弟子たちが眠っている状態を発見する、という原文の表現を保つ。
- source_word: καθεύδοντας
  choice: 眠っている
  rationale: 文字どおりの意味を保持し、文脈上あり得る霊的警戒の欠如という含意は本文で限定しない。
theological_decisions:
- issue: 眠りが文字どおりか比喩的か
  choice: 本文では「眠っている」と訳し、両方の含意を開いておく
  alternative: 「油断している」「霊的に眠っている」
  rationale: καθεύδω は直接には眠ることを意味するが、警戒を命じる文脈では比喩的含意も生じる。解釈を一方に限定しない。
- issue: 否定目的節 μὴ ... εὕρῃ の表現
  choice: 「見つけることがないようにしなさい」
  alternative: 「見つけることのないように」
  rationale: この節は前節の「目を覚ましていなさい」という命令に従属する。単独でも意味が通るよう命令を補いつつ、目的・懸念のニュアンスを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語。節単独での可読性を確保するため、直前の命令を「しなさい」と補った。荘重さを損なわず、過度に古風な言い回しは避けた。
