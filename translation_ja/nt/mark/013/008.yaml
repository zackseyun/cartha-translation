reference: Mark 13:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: ja
  text: というのも、民族が民族に対して、国が国に対して立ち上がる。各地で地震が起こり、飢饉も起こる。これらは産みの苦しみ[a]の始まりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陣痛」または「出産の苦しみ」とも訳せる。ギリシア語は、出産に伴う痛みを、後に続くものに先立つ苦難の比喩として用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: 敵対して立ち上がる
  rationale: 受動形をそのまま直訳せず、集団同士の衝突が起こるという文脈上の慣用的意味を自然な日本語で表した。
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: 民族は民族に
  rationale: ἔθνοςは「国民」「民」「民族」などを指し得るが、ここでは後続の政治的な「国」と区別しつつ、集団間の対立を表せる「民族」を選んだ。
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: 国は国に
  rationale: ここでは抽象的な王権ではなく政治的領域を指す。「王国」よりも現代日本語で広く自然な「国」とし、前半との並行を保った。
- source_word: σεισμοὶ
  choice: 地震
  rationale: この文脈での通常の意味を明瞭に訳した。
- source_word: κατὰ τόπους
  choice: 各地で
  rationale: 複数の場所に分布して起こるというκατάの配分的な意味を、簡潔で自然な日本語にした。
- source_word: λιμοί
  choice: 飢饉
  rationale: 単なる空腹や一時的な食糧不足ではなく、広範な飢えを意味する語として訳した。
- source_word: ἀρχὴ
  choice: 始まり
  rationale: これらの出来事が後に続くものの開始であって全体ではない、という意味を保った。
- source_word: ὠδίνων
  choice: 産みの苦しみ
  rationale: 出産に伴う痛みを用いた比喩を保ちつつ、現代の読者にも理解できる表現とした。
- source_word: ταῦτα
  choice: これらは
  rationale: 直前に列挙された複数の出来事を受ける指示語として自然に訳した。
theological_decisions:
- issue: ἀρχὴ ὠδίνωνの終末論的比喩
  choice: 「産みの苦しみの始まり」として、後に続くものに先立つ苦難という比喩を保持する
  alternative: 一般的な「苦難の始まり」として出産のイメージを明示しない
  rationale: 本文の出産比喩を平板な「苦難」に置き換えず、同時に特定の終末論体系を訳文へ持ち込まないため。
translation_notes:
  register: 明瞭な現代標準語を用い、「というのも」でγάρと前文との論理的つながりを示した。簡潔な並行表現と反復を保ち、荘重さを損なわないようにした。
