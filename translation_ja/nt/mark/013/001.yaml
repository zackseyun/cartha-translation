id: MRK.13.1
reference: Mark 13:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: ja
  text: イエスが神殿[a]から出て行かれるとき、弟子の一人が言った。「先生、ご覧ください。なんと見事な石、なんと見事な建物でしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、内陣だけでなく、神殿の境内や建造物群を含む区域全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: イエスが……出て行かれるとき
  rationale: 属格絶対と現在分詞が示す同時進行の動作を、自然な日本語で表した。文脈上の主語を「イエス」と明示した。
- source_word: τοῦ ἱεροῦ
  choice: 神殿
  rationale: ἱερόνは内陣だけでなく神殿境内・建造物群を含む語だが、本文では簡潔で一般的な「神殿」とし、範囲を脚注で明示した。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語はマルコに特徴的な歴史的現在だが、日本語で「言う」とすると不自然になりやすいため、物語として自然な過去形にした。
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: 弟子の一人
  rationale: 部分を表す属格を簡潔かつ自然に訳した。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとしての「教師」を、現代日本語で自然かつ敬意のある「先生」とした。
- source_word: ἴδε
  choice: ご覧ください
  rationale: 注意を促す命令を、弟子からイエスへの敬意を保つ自然な表現にした。
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: なんと見事な……なんと見事な……でしょう
  rationale: 対象の性質への驚きと称賛を示す感嘆表現として訳した。単なる大きさに限定しない。
- source_word: λίθοι
  choice: 石
  rationale: 神殿建築に用いられた石を、原文どおり簡潔に訳した。
- source_word: οἰκοδομαί
  choice: 建物
  rationale: 神殿域内の複数の建造物を指す一般的で明瞭な語を選んだ。
