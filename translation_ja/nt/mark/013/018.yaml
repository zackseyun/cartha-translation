  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: ja
  text: しかし、それが冬に起こらないように祈りなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈を踏まえて意味を明示すれば、「あなたがたの逃げる時が冬にならないように」とも訳せる。マルコのギリシア語は、並行するマタイ24章20節よりも省略の多い表現である。
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: 祈りなさい
  rationale: 現在命令法・二人称複数。日本語では単純な命令形が自然であり、「祈り続けなさい」として継続の意味を強く限定することは避けた。
- source_word: δὲ
  choice: しかし
  rationale: 前の警告を受ける緩やかな接続・対照を表す。文脈上、「しかし」が自然である。
- source_word: ἵνα μὴ
  choice: …ないように
  rationale: 否定を伴う祈りの内容を、現代日本語で自然に示す。
- source_word: γένηται
  choice: それが…起こる
  rationale: γίνομαι のアオリスト接続法。何が起こるのかを明示しないマルコの省略的な表現を、「それが」で保った。
- source_word: χειμῶνος
  choice: 冬に
  rationale: 時・季節を示す属格を、簡潔で自然な日本語にした。
theological_decisions:
- issue: γένηται の省略された主語・内容
  choice: 「それが冬に起こらないように」とし、出来事の内容を本文では明示しない。
  alternative: 「あなたがたの逃げる時が冬にならないように」
  rationale: マルコのギリシア語には、マタイ24章20節と異なり「あなたがたの逃走」に当たる語が明記されていない。並行箇所の表現を本文へ補わず、原文の簡潔さと曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「それが」によって前文を受けつつ、原文が明示していない「逃走」を本文に補わない。
