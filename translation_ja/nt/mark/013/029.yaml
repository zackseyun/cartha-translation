id: MRK.13.29
reference: Mark 13:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: ja
  text: 同じように、あなたがたも、これらのことが起こるのを見たなら、それ[a]が近く、戸口にまで来ていると知りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その方が近く」とも訳せる。ギリシア語では「近い」の主語が明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同じように、あなたがたも
  rationale: οὕτωςを直前のいちじくの木のたとえとの結びつきを示す「同じように」とし、καὶ ὑμεῖςの対応と強調を「あなたがたも」で自然に表した。
- source_word: ὅταν ἴδητε
  choice: 見たなら
  rationale: ὅτανとアオリスト接続法が示す将来の条件を、日本語で自然な「見たなら」とした。確実な時点を断定しすぎず、しるしを目にした場合という含みを保つ。
- source_word: ταῦτα γινόμενα
  choice: これらのことが起こるのを
  rationale: ταῦταの複数性を「これらのこと」で保持し、γινόμεναを出来事の生起を表す平明な「起こる」と訳した。
- source_word: γινώσκετε
  choice: 知りなさい
  rationale: 現在命令形の直接的な要請を「知りなさい」とし、しるしから結論を悟るよう促す力を保った。
- source_word: ὅτι ἐγγύς ἐστιν
  choice: それが近く
  rationale: ἐστινには明示された主語がないため、本文では特定の人物に限定しない「それ」を補った。主語の曖昧さは注で明示した。
- source_word: ἐπὶ θύραις
  choice: 戸口にまで来ている
  rationale: 直訳的な「戸口にある」より自然な日本語で、目前に迫っているという慣用的意味を表した。ギリシア語の複数形は、日本語では数を明示しない「戸口」によって不自然さを避けた。
theological_decisions:
- issue: ἐστιν（「近い」）の省略された主語
  choice: 本文では「それが近く」とし、迫る出来事ないし成就を特定しすぎない。
  alternative: 「その方が近く」とし、人、特に人の子を指すと理解する。
  rationale: ギリシア語本文は主語を明示していない。本文で指示対象を一つに決めず、人物を指す可能性を脚注に残すことで、原文の曖昧さと解釈上の緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら、命令の重みを保つ格調ある標準語とした。「戸口にまで来ている」は切迫した近さを自然な日本語で伝える。
