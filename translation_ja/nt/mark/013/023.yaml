  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: ja
  text: しかし、あなたがたは気をつけていなさい[a]。わたしは、あらかじめすべてのことをあなたがたに告げておきました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「警戒していなさい」「よく注意しなさい」。
    reason: lexical_alternative
  - marker: b
    text: または「わたしはすべてのことを前もってあなたがたに警告しておきました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: しかし、あなたがたは
  rationale: 明示された複数二人称代名詞の対照的な強調と、δὲの逆接的な働きを自然な日本語で保つ。
- source_word: βλέπετε
  choice: 気をつけていなさい
  rationale: 現在命令形が表す継続的な警戒を、現代日本語で自然かつ明瞭に表す。単なる視覚的な「見なさい」では、この文脈での警告の意味が弱い。
- source_word: προείρηκα
  choice: 前もって…話しました
  rationale: 「前もって言う」という複合動詞の意味を保ちつつ、完了形による、すでになされた発言が今も効力を持つ含みを文脈から伝える。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 発言の受け手を示す与格を明示する。
- source_word: πάντα
  choice: すべてのこと
  rationale: 指示内容を限定する語を補わず、原文の包括性と、それが文脈上何を指すかという幅を保つ。
theological_decisions:
- issue: イエスの警告と事前の告知が持つ範囲
  choice: 「すべてのこと」とし、イエスが関連事項を前もって告げたという包括的表現をそのまま保つ。
  alternative: 「これらのことをすべて」として直前の警告だけに明示的に限定する。
  rationale: πάντα自体には「これら」に相当する指示語がない。将来のあらゆる細部を網羅したとの解釈にも、直前の事項だけとの解釈にも翻訳で固定せず、文脈に残された範囲の曖昧さを保持する。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な警告にふさわしい丁寧で dignified な文体。「あなたがた」を明示して原文の対照的強調を保ち、「気をつけていなさい」で継続的警戒を表現した。
