  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: ja
  text: また、畑にいる者は、自分の上着[a]を取りに引き返してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「外衣」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: 畑にいる者
  rationale: 冠詞を伴う表現を、単数の一般的な人物を指す「者」として訳した。性別を不必要に限定せず、原文の単数形を保っている。
- source_word: ἀγρός
  choice: 畑
  rationale: この文脈では、農作業をする場所である「畑」が最も直接的で自然である。
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: 引き返してはならない
  rationale: 否定命令の切迫した禁止を明確に表し、「後ろへ向きを変えて戻る」という句全体の意味を自然な日本語にまとめた。
- source_word: ἆραι
  choice: 取りに
  rationale: 不定詞の目的を示す用法を保ち、置いてきた衣服を取りに戻る動作を簡潔に表した。
- source_word: ἱμάτιον
  choice: 上着
  rationale: 外側に着る衣を指す語であり、現代の一般読者に分かりやすい「上着」を本文に採用した。より形式的な「外衣」は脚注に示した。
- source_word: αὐτοῦ
  choice: 自分の
  rationale: 主語本人に属する衣服であることを自然な日本語で明示し、単数代名詞の指示を保った。
theological_decisions:
- issue: 一般的な人物を指す男性単数形
  choice: 「畑にいる者……自分の上着」と単数の一般表現で訳す
  alternative: 「畑にいる人々……自分たちの上着」と複数化する
  rationale: 原文の単数表現を保ちつつ、日本語では性別を不自然に限定せず、誰にでも当てはまる警告として表せるため。
translation_notes:
  register: 明快な現代標準語を用い、切迫した禁止命令を「〜てはならない」で荘重かつ自然に表現した。
