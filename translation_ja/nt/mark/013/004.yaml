  rationale: 原文の複数性、二つの問い、σημεῖονの「しるし」、およびμέλλῃ＋συντελεῖσθαιの切迫した完結という意味を保ったまま、「成し遂げられようとしている」を自然で意味の明瞭な「完了しようとしている」に改めた。脚注は本文の訳語に合わせ、μέλλωのニュアンスと代替訳の可能性を維持した。
