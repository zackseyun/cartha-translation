id: MRK.13.4
reference: Mark 13:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: ja
  text: 「私たちに教えてください。これらのことは、いつ起こるのですか。また、これらすべてが完了しようとしている[a]時には、どんなしるしがありますか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これらすべてが完了する時」。ギリシア語では μέλλῃ（「～しようとしている」）と不定詞が用いられており、出来事が差し迫っていることをより明確に表す場合がある。
    reason: μέλλῃ＋不定詞の切迫性を表す訳と、単純未来に近い訳の両方が可能であるため。
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: 私たちに教えてください
  rationale: 直訳的な「私たちに言ってください」よりも、情報を求める問いかけとして自然な現代日本語にしつつ、命令形による依頼の力を保った。
- source_word: πότε ταῦτα ἔσται
  choice: これらのことは、いつ起こるのですか
  rationale: ἔσται は字義的には「あるだろう」だが、予告された出来事を指す文脈では「起こる」が自然であり、ταῦτα の複数性も「これらのこと」で保持した。
- source_word: σημεῖον
  choice: しるし
  rationale: 出来事の到来を示す徴候・指標を表す標準的な聖書日本語として、平仮名の「しるし」を用いた。
- source_word: μέλλῃ
  choice: ようとしている
  rationale: 不定詞を伴う μέλλω の、行為が差し迫っているという前望的な含意を表した。単純未来に平板化しない表現である。
- source_word: συντελεῖσθαι
  choice: 成し遂げられ
  rationale: 受動不定詞の形と、すべての事柄が完結・成就に至る結果的な意味を保つ。「成就する」よりも預言成就の意味を過度に明示しない。
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: これらすべてが成し遂げられ
  rationale: πάντα を ταῦτα と結び付け、「これらすべて」として全体性と指示対象を明確にした。
theological_decisions:
- issue: μέλλῃ＋不定詞が持つ終末論的な切迫性
  choice: 「成し遂げられようとしている」とし、差し迫った動作の含みを保持する
  alternative: 「成し遂げられる」または「成し遂げられることになる」
  rationale: μέλλω が加える前望的・切迫的なニュアンスを訳文に残す一方、それが示す終末の時期について、本文を越えた特定の教理的結論は加えない。
- issue: συντελεῖσθαι の完結・成就の意味
  choice: 成し遂げられ
  alternative: 完了する／終わる／成就する
  rationale: 受動態と完結に至る意味を保ちつつ、「預言が成就する」または単なる「終わり」のどちらかに限定しない。
translation_notes:
  register: 弟子たちがイエスに丁寧に問いかける場面として、「教えてください」と「～のですか」を用いた。全体は明瞭な現代標準日本語としつつ、「しるし」「成し遂げられる」によって聖書本文としての落ち着きと尊厳を保った。
