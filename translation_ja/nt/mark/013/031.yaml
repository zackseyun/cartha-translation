  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ja
  text: 天と地は過ぎ去る。しかし、わたしのことばは決して過ぎ去らない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天と地
  rationale: 宇宙的な全体を表す定着した対句として、οὐρανός を「天」、γῆを「地」と訳した。単なる「空」や特定の「土地」には限定しない。
- source_word: παρελεύσονται
  choice: 過ぎ去る
  rationale: παρέρχομαι の、消滅の様態を必要以上に限定せず「過ぎ去る／終わりに至る」という終末論的な意味を自然に伝える。
- source_word: δὲ
  choice: しかし
  rationale: 天と地の移ろいやすさと、イエスのことばの永続性との明確な対照を示す。
- source_word: οἱ λόγοι μου
  choice: わたしのことば
  rationale: イエスが語った発言・宣言を直接的に表す。「ことば」は現代日本語の聖書文体として自然で、単数形でも集合的内容を表せる。
- source_word: οὐ μὴ παρελεύσονται
  choice: 決して過ぎ去らない
  rationale: 未来形を伴う οὐ μή の強い否定を「決して」で明示し、現代日本語として簡潔かつ荘重に表した。
theological_decisions:
- issue: イエスのことばについての強意否定
  choice: 「決して過ぎ去らない」と明示的に強調する
  alternative: 「過ぎ去ることはない」「絶対に過ぎ去らない」
  rationale: 被造世界が過ぎ去ることと、イエスのことばが永続することとの緊張と対照を保ち、οὐ μή の確実な否定を自然な日本語で聞き取れるようにした。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で格調を保ちつつ、古語的な言い回しは避けた。「天と地」「過ぎ去る」「決して」の反復によって原文の対照と修辞的な力を保持している。
