id: MRK.13.34
reference: Mark 13:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: ja
  text: それは、旅に出る人が、自分の家を後にし、奴隷たち[a]に権限を与え、それぞれに仕事を割り当て、門番には目を覚ましているよう命じるのと同じです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「召使いたち」とも訳せる。ギリシア語は「奴隷たち」で、主人の権威のもとにある者たちを指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: それは、…のと同じです
  rationale: 前後の勧告に結びつくたとえを導く語。ギリシア語で省略されている比較の枠組みを、自然な現代日本語として明示した。
- source_word: ἄνθρωπος ἀπόδημος
  choice: 旅に出る人
  rationale: 自分の土地や家を離れている人を表す。旅と不在の双方を簡潔に伝え、原文にない旅先の遠近は限定しない。
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: 自分の家を後にし
  rationale: 家を離れるという基本的な意味を保ちつつ、分詞を後続する動作へ自然につないだ。
- source_word: τοῖς δούλοις αὐτοῦ
  choice: 奴隷たち
  rationale: 家の主人の権威のもとにある身分関係がこのたとえで明確なため、δοῦλοςの社会的意味を弱めずに訳した。現代日本語でより穏当な「僕たち」は脚注に示す。
- source_word: τὴν ἐξουσίαν
  choice: 権限
  rationale: 主人から委ねられた、行動し管理する権利・権威を表す語として自然である。
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: それぞれに仕事を割り当て
  rationale: 原文は「それぞれに、その仕事を」という省略的な表現である。文脈上の分配を自然な日本語で表しつつ、ἔργονを「仕事」とした。
- source_word: τῷ θυρωρῷ
  choice: 門番
  rationale: 入口を守る者を指す。家屋の入口が扉か門かを過度に限定せず、日本語で定着した職務名を用いた。
- source_word: ἐνετείλατο
  choice: 命じる
  rationale: 権威をもって指示するという語の強さを保持した。
- source_word: ἵνα γρηγορῇ
  choice: 目を覚ましているよう
  rationale: γρηγορέωの字義的な「眠らずにいる」を保ち、この章全体に通じる警戒・注意の比喩も伝わる表現とした。
theological_decisions:
- issue: 家の主人との関係におけるδοῦλοςの訳語
  choice: 奴隷たち
  alternative: 僕たち／召使いたち
  rationale: この場面では、主人が家を離れる際、自らの権威のもとにある者たちへ権限と仕事を与える。身分上の拘束関係を原文どおり示すため「奴隷」とし、役務面を前面に出す伝統的な訳語は脚注に残した。
- issue: γρηγορέωに含まれる字義と比喩
  choice: 目を覚ましている
  alternative: 目を配る／警戒している
  rationale: 終末についての警戒を含意するが、イエスが用いた覚醒の比喩を解釈語だけに置き換えず、そのまま保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、たとえにおける主人の権威と命令の強さを保った。「奴隷」は歴史的身分を曖昧にしないため本文に置き、読者が理解しやすい代替表現を脚注に示した。
