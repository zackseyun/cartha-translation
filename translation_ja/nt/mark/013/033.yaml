  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: ja
  text: 気をつけ、目を覚ましていなさい。その時[a]がいつなのか、あなたがたは知らないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定められた時」または「時期」とも訳せる。ギリシア語の「カイロス」は、しばしば決定的な時、または定められた時を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: 気をつけて
  rationale: 視覚的に「見る」というより、警戒し注意するよう促す複数形の命令。続くἀγρυπνεῖτεとの違いも保てる自然な日本語とした。
- source_word: ἀγρυπνεῖτε
  choice: 目を覚ましていなさい
  rationale: 眠らずにいるという比喩を保ちつつ、継続的な警戒を表す命令として訳した。
- source_word: οὐκ οἴδατε
  choice: あなたがたは知らない
  rationale: 知ることの否定を補足なしに直接表し、複数の聞き手も明示した。
- source_word: γὰρ
  choice: からです
  rationale: 先行する二つの命令の理由を示す接続関係を、自然な日本語で表した。
- source_word: πότε
  choice: いつ
  rationale: 時を問う副詞の簡潔で自然な対応語。
- source_word: ὁ καιρός
  choice: その時
  rationale: 文脈上の決定的な時を指す定冠詞付きの表現として訳した。καιρόςにあり得る「定められた時」の含意は、本文で確定せず注に示した。
- source_word: ἐστιν
  choice: 来るのか
  rationale: 直訳は「いつその時であるか」だが、日本語では不自然なため、終末論的文脈でその時が到来することを自然に表現した。
theological_decisions:
- issue: 終末論的文脈におけるκαιρόςの含意
  choice: その時
  alternative: 定められた時／時期
  rationale: καιρόςは決定的または定められた時を示し得るが、本文では神による予定という含意を明示的に加えず、ギリシア語の幅を注で保持した。
translation_notes:
  register: 明快な現代標準語を用い、二つの命令を「気をつけて」と「目を覚ましていなさい」で区別した。丁寧な理由節により、簡潔さと荘重さを両立させた。
