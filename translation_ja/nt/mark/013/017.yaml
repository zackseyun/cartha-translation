  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: ja
  text: しかし、その時代には、妊娠している女たちと授乳している女たちには、災いだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: なんと災いなことか
  rationale: 預言的な嘆きと、迫る苦難への警告という感嘆の力を保つ。「災いだ」よりも、この文脈で当人たちが置かれる悲惨な境遇への嘆きを自然に表す。
- source_word: δὲ
  choice: だが
  rationale: 直前の避難命令を受けて、特に困難な立場にある人々へ話を展開する軽い転換を示す。強すぎる逆接にはしない。
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: 身重の女たち
  rationale: 字義的には「胎内に持つ女たち」だが、妊娠している女性を指す慣用句。「身重」は簡潔で自然かつ品位があり、女性複数の指示も明確にする。
- source_word: θηλαζούσαις
  choice: 乳飲み子を抱える女たち
  rationale: 授乳している女性を指す。「乳飲み子を抱える」は、授乳期の幼子を世話する状況を自然な日本語で示し、避難の困難さも伝える。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: その日々には
  rationale: 周辺文脈で語られる時期との結び付きを保つ、素直な時間表現。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、警告と嘆きの厳粛さを保った。「身重」は日常語として理解可能でありつつ聖書本文にふさわしい品位がある。「乳飲み子を抱える」は原語の授乳行為を狭く臨床的に表現せず、授乳期の母親の切迫した境遇を自然に伝える。
