id: MRK.13.32
reference: Mark 13:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: ja
  text: しかし、その日、またはその時については、だれも知りません。天にいる御使いたちも、子[a]も知らず、ただ父だけが知っておられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子も知らず」を、子の受肉における使命または人性に関する表現と理解する解釈もあります。本文はその説明を加えず、ギリシア語の表現をそのまま保っています。
    reason: キリスト論上の解釈を本文に持ち込まず、原文の緊張を保つため。
lexical_decisions:
- source_word: Περὶ δὲ
  choice: しかし、〜については
  rationale: περί＋属格の話題提示を「〜については」で表し、δέが示す前段からの緩やかな転換・対照を「しかし」で保った。
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: その日、またはその時
  rationale: ἢの選言を「または」と明示した。ὥραは特定の時点を指すため、現代日本語として自然な「時」とした。
- source_word: οὐδεὶς οἶδεν
  choice: だれも知りません
  rationale: οἶδαは形の上では完了形だが、ここでは現在の認識を表す。「だれも〜ない」によってοὐδείςの全面否定を自然に示した。
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: 天にいる御使いたちも（知らず）
  rationale: ἐν οὐρανῷを御使いたちの所在として訳した。οὐδέは先行する否定を受けるため、日本語では「も〜ない」でその累加的な強調を表した。
- source_word: οὐδὲ ὁ υἱός
  choice: 子も知らず
  rationale: ὁ υἱόςを称号として簡潔に「子」とし、οὐδέによる否定の連鎖をそのまま保った。本文には解釈上の限定を加えていない。
- source_word: εἰ μὴ ὁ πατήρ
  choice: ただ父だけが知っておられます
  rationale: 否定文に続くεἰ μήは唯一の例外を示す。「ただ〜だけ」で排他性を明確にし、日本語として必要な述語を補った。
theological_decisions:
- issue: 子がその日または時を知らないというキリスト論上の緊張
  choice: 「子も知らず」とギリシア語本文の明白な表現をそのまま訳す。
  alternative: 「人としての子も」などの限定を本文に加える。
  rationale: 原文にはοὐδὲ ὁ υἱόςとあり、限定句はない。受肉の使命または人性との関係で理解する解釈はあり得るが、本文でその解釈に決着をつけず、原文が持つ神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての品位を保った。「御使い」は一般読者にも通じる伝統的な聖書語として採用し、「父」には文脈に合う敬意表現「知っておられます」を用いた。
