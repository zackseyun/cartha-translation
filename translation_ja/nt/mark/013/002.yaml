reference: Mark 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: ja
  text: イエスは彼に言われた。「これらの壮大な建物[a]が見えるか。ここに、石が石の上に一つでも残され、それが崩されないままでいることは決してない。[b][c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらの壮大な神殿の建物」とも訳せる。文脈では神殿の建築群を指すが、ギリシア語は単に「建物」と言っている。
    reason: lexical_alternative
  - marker: b
    text: 「石が石の上に一つも残らない」は、完全な破壊を表す言い回し。
    reason: cultural_note
  - marker: c
    text: 「崩される」は「取り壊される」「破壊される」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: 見えるか
  rationale: 現在形の直説法を疑問として取り、目の前の建物へ注意を向ける問いを、現代日本語で自然に表した。命令形の「見よ」という意味は加えていない。
- source_word: μεγάλας οἰκοδομάς
  choice: 壮大な建物
  rationale: μεγάλαςが表し得る物理的な大きさと威容の双方を「壮大な」で伝え、οἰκοδομάςは文脈上神殿建築群を指すものの、原文どおり一般的な「建物」とした。日本語では複数性が文脈から明らかなため、名詞自体に複数標識を加えていない。
- source_word: οὐ μὴ ἀφεθῇ
  choice: 一つも残ることなく
  rationale: οὐ μήとアオリスト接続法による強い未来否定を、「一つも…なく」によって明確かつ自然に表した。
- source_word: ὧδε
  choice: ここでは
  rationale: 話者と聞き手が見ている場所を指す場所の副詞として、直接的に訳した。
- source_word: λίθος ἐπὶ λίθον
  choice: 石が石の上に
  rationale: 原文の具体的な像を保ちつつ、完全な破壊を表す慣用表現として自然な日本語にした。
- source_word: καταλυθῇ
  choice: 崩される
  rationale: 建造物を解体し、倒す意味を表す。受動態を保ち、行為者を原文以上に特定していない。
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: イエスは彼に言われた
  rationale: καίは日本語の談話では明示しなくても連続性が自然に伝わるため省き、εἶπεν αὐτῷは敬意を備えた標準的な聖書叙述として訳した。
theological_decisions:
- issue: 預言が指す建物の範囲
  choice: 本文では原文に従い「建物」とする
  alternative: 「神殿の建物」または「神殿の建築群」と明示する
  rationale: 直前の文脈から神殿域の建物を指すことは明らかだが、οἰκοδομάς自体には「神殿」という語がない。本文で解釈を付加せず、脚注で文脈上の指示対象を示した。
- issue: 破壊の徹底性
  choice: 「石が石の上に一つも残ることなく、ことごとく崩される」
  alternative: 「石が石の上に一つも残されない」
  rationale: 二度の強い否定（οὐ μή）と関係節の力を日本語で明瞭に伝える一方、破壊の歴史的・終末論的な射程については本文で限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。問いかけは簡潔にし、預言部分では原文の強い否定と石積みの具体的な像を保った。
