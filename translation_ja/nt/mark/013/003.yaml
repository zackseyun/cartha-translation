  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: ja
  text: イエスが神殿[a]の向かいにあるオリーブ山に座っているとき、ペテロ、ヤコブ、ヨハネ、アンデレが、ほかの人たちとは別にイエスに尋ねていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の「ヒエロン」は、神殿の建物内部（ナオス）に限らず、境内を含む神殿域を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: イエスが……座っておられると
  rationale: 属格独立構文と現在分詞が示す進行中の状況を、自然な現代日本語で表した。代名詞は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: オリーブ山に
  rationale: 位置を表すこの文脈の εἰς を日本語の自然な場所表現「に」で訳し、地名は一般的な「オリーブ山」とした。
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: 神殿の向かいにある
  rationale: κατέναντι の位置関係を明確に表した。ἱερόν は内陣だけでなく神殿域全体を指し得るため、本文では簡潔な「神殿」とし、注で語義を補った。
- source_word: ἐπηρώτα
  choice: 尋ねた
  rationale: 未完了過去の未完結的側面は認めつつ、日本語では複数主語による質問行為を「尋ねていた」より「尋ねた」とするほうが自然であり、次節へ続く発話の導入としても適切である。
- source_word: κατ’ ἰδίαν
  choice: ひそかに
  rationale: ほかの者たちから離れた私的な場で尋ねたことを、簡潔で自然に表した。
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: ペテロ、ヤコブ、ヨハネ、アンデレ
  rationale: 固有名詞は日本語聖書で広く認知された表記を用いた。ギリシア語の反復接続詞は、日本語で不自然にならないよう読点による列挙とした。
