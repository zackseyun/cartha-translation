source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: ja
  text: しかし、その苦難[a]の後のあの日々に、太陽は暗くなり、月はその光を放たなくなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「患難」「苦しみ」。
    reason: θλῖψιςは苦難・患難・苦しみ・圧迫などを表し得る。本文では黙示的文脈での重みと、特定の解釈体系に限定しない明瞭さを考慮して「苦難」と訳した。
lexical_decisions:
- source_word: Ἀλλὰ
  choice: しかし
  rationale: 先行する内容との強い対照と場面の転換を、簡潔で自然な現代日本語で示す。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: あの日々には
  rationale: 指示語を保ちつつ、終末論的な時を指す表現を自然な日本語にした。
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: その苦難の後
  rationale: μετάの時間的意味と指示語を明示する。θλῖψιςは文脈上重い困窮・圧迫を表すため、「苦難」とした。
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: 太陽は暗くなり
  rationale: 未来の出来事としての宇宙的異変を自然に表す。ギリシア語は未来受動形だが、日本語では「暗くされる」より「暗くなる」が自然で、意味も保持できる。
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: 月はその光を放たなくなる
  rationale: 字義的な「その光を与えない」よりも日本語として自然な「光を放つ」を用い、月が光を発しなくなるという像を保った。
theological_decisions:
- issue: 黙示的文脈における θλῖψις の訳語
  choice: 苦難
  alternative: 患難／苦しみ／圧迫
  rationale: 「苦難」は語の重大さと広がりを保ちながら、特定の終末論体系に結び付いた専門用語としてのみ読まれることを避ける。直前の文脈を指す「その」も保持した。
- issue: 宇宙的描写を比喩か字義かに限定する可能性
  choice: 描写をそのまま訳し、解釈を限定しない
  alternative: 政治的・象徴的意味を明示する／物理現象として明示する
  rationale: 本文自体は解釈を説明していないため、太陽と月についての表現を保持し、神学的緊張と曖昧さを残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その苦難の後、あの日々には」という語順により、ギリシア語本文の時間表現の順序をおおむね保ちつつ、日本語としての流れを整えた。
