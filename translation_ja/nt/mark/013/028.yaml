id: MRK.13.28
reference: Mark 13:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: ja
  text: いちじくの木から、このたとえを学びなさい。その枝がすでに柔らかくなり、葉を出すと、夏が近いことが分かります[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「分かります」は「知りなさい」とも訳せます。
    reason: γινώσκετεは形態上、直説法にも命令法にも解し得るため。
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: いちじくの木から
  rationale: ἀπό＋属格が学びの源を示す。δέは軽い接続であり、日本語では文脈上あえて明示しないのが自然。
- source_word: μάθετε
  choice: 学びなさい
  rationale: μανθάνωのアオリスト命令形で、教訓を受け取るよう促す直接的な命令。
- source_word: τὴν παραβολήν
  choice: このたとえ
  rationale: παραβολήの基本的な意味である比喩的な教えを、福音書で自然な「たとえ」として訳す。定冠詞は日本語の文脈指示として「この」で表した。
- source_word: ὅταν
  choice: …と
  rationale: 接続法を伴い、一般的・反復可能な時の条件を示すため、日本語の一般条件「…と」が適切。
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: その枝が柔らかくなって
  rationale: ἤδηは変化がその段階に達したことを示す。日本語では「柔らかくなって」という変化表現にその含意が自然に現れるため、不自然な「すでに」の明示を避けた。
- source_word: ἐκφύῃ τὰ φύλλα
  choice: 葉を出す
  rationale: 植物が芽吹いて葉を生じるという日常的な表現。
- source_word: γινώσκετε
  choice: 分かります
  rationale: ここでは命令形と同形になり得る形だが、一般的な観察の帰結を述べる直説法として理解し、読者が徴から認識することを表した。
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: 夏が近い
  rationale: θέροςは通常「夏」、ἐγγύςは時間的な近さを表す。簡潔で自然な日本語。
theological_decisions:
- issue: この文脈における παραβολή の意味
  choice: 本文では「たとえ」と訳す
  alternative: 教訓、例えによる説明
  rationale: イエスの教えに用いられる福音書の主要語との連続性を保ちつつ、ここでの簡潔な自然観察を過度に寓意化しない。
- issue: γινώσκετε の法の解釈
  choice: 直説法「分かります」
  alternative: 命令法「知りなさい」
  rationale: 形態上は直説法・命令法の双方が可能だが、ὅταν節に続く一般的な認識を述べる文脈では直説法が自然。形態上の可能性は脚注に示す。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある標準語。「いちじく」は広く定着した表記を採用し、植物の季節的変化を自然な日本語で表現した。脚注記号は該当文の末尾に置いた。
