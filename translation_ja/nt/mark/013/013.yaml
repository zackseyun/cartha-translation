id: MRK.13.13
reference: Mark 13:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ja
  text: あなたがたは、わたしの名のために、すべての人から憎まれます[a]。しかし、最後まで耐え抜く人は救われます[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの名のゆえに」。
    reason: lexical_alternative
  - marker: b
    text: 「耐え抜く」は、「忍耐し続ける」「堅く立ち続ける」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳では「最後まで耐え抜いた人、この人が救われます」。また、「救われます」は「助け出されます」とも訳せる。ギリシア語は救出と救いの両方を表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: 憎まれます
  rationale: ἔσεσθεとの迂言的な未来表現を、自然な現代日本語の受け身の未来として表した。
- source_word: ὑπὸ πάντων
  choice: すべての人から
  rationale: 無限定のπάντωνが持つ包括的で強い言い方を弱めずに保った。日本語では受け身の動作主を「から」で示すと自然である。
- source_word: διὰ τὸ ὄνομά μου
  choice: わたしの名のために
  rationale: διά＋対格が示す理由・原因を表しつつ、「名」がイエスの人格、権威、イエスへの帰属を指し得る聖書的表現を保持した。
- source_word: ὁ δὲ ὑπομείνας
  choice: しかし、…耐え抜く人
  rationale: ὑπομένωが圧迫のもとにとどまり続けることを表すため、「耐え抜く」とした。δέの対比は「しかし」で明示した。
- source_word: εἰς τέλος
  choice: 最後まで
  rationale: 試練の終わり、人生の終わり、終末のいずれとも限定せず、原文の終点に関する曖昧さを保つ自然な表現である。
- source_word: οὗτος
  choice: （日本語では独立して訳出せず）
  rationale: 原文では先行する分詞句を受けて強調する指示代名詞だが、「その人こそ」とすると日本語では強調が増し得るため、主題構文の「人は」により自然に機能を伝えた。脚注で直訳的構造を示す。
- source_word: σωθήσεται
  choice: 救われます
  rationale: σῴζωが持つ救出と終末的救いの幅を保ち、単なる一時的救出に狭めない表現とした。
theological_decisions:
- issue: 忍耐についての言葉におけるσωθήσεταιの意味
  choice: 救われます
  alternative: 助け出されます
  rationale: 迫害下での救出にも最終的な救いにも関わり得る語義を、特定の教派的な忍耐論へ限定せず保持するため。
- issue: πάντωνの範囲
  choice: すべての人から
  alternative: 皆から
  rationale: 原文の包括的で強い表現を限定せずに残し、それが文脈上の修辞的表現か数学的な全称かを訳文で決めないため。
- issue: οὗτοςの強調
  choice: 本文では自然な「人は」とし、脚注で直訳を示す
  alternative: その人こそ救われます
  rationale: 指示代名詞の再述的な強調を認めつつ、日本語で原文以上の排他的強調を加えないため。
translation_notes:
  register: 明瞭で現代的かつ礼節ある「です・ます」調。迫害の厳しさを和らげず、同時にギリシア語特有の再述構文は自然な日本語に整えた。
