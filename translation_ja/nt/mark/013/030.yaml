  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: ja
  text: まことに、あなたがたに言います。この世代は、これらのことがすべて起こるまでは、決して過ぎ去りません[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この民」または「この民族」とも訳せます。ギリシア語「ゲネア」にはより広い意味もあり得ますが、ここでは「世代」が最も自然です。
    reason: lexical_alternative
  - marker: b
    text: 「決して過ぎ去りません」は、ギリシア語の強い否定表現を訳したものです。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: 厳粛で権威ある発言を導く語。音写の「アーメン」よりも、現代日本語で機能が明瞭に伝わる。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の語りかけを保ちつつ、明快で自然な敬体とした。
- source_word: οὐ μὴ παρέλθῃ
  choice: 決して過ぎ去りません
  rationale: οὐ μήとアオリスト接続法による強い否定を「決して」で明示し、παρέρχομαιの基本的な比喩表現も保った。
- source_word: ἡ γενεὰ αὕτη
  choice: この世代
  rationale: 文脈上最も自然な通常の意味を採用し、終末論上の論争を解釈によって解消しない。
- source_word: μέχρις οὗ
  choice: までは
  rationale: 出来事が生じる時までの時間的限界を簡潔かつ自然に表す。
- source_word: ταῦτα πάντα
  choice: これらのことがすべて
  rationale: 指示詞の複数性とπάνταの包括性をともに明示する。
- source_word: γένηται
  choice: 起こる
  rationale: ここでは一連の出来事が生じることを指し、現代日本語として自然で明快。
theological_decisions:
- issue: 終末論的談話における「この世代」（ἡ γενεὰ αὕτη）の意味
  choice: 本文では「この世代」と直接的に訳す。
  alternative: 「この民」「この民族」、またはしるしを見る将来の世代と解する。
  rationale: ギリシア語の最も自然な表現を保ち、特定の終末論体系に沿って論争的な意味を本文中で確定しない。
translation_notes:
  register: 明瞭な現代標準日本語の敬体。厳粛さを保ちながら過度に古風な表現を避け、原文の強い否定と「この世代」をめぐる解釈上の緊張を保持した。
