  text: ⸀ὃ δὲ ὑμῖν λέγω πᾶσιν λέγω· γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: ja
  text: あなたがたに言うことを、わたしはすべての人に言います。目を覚ましていなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見張っていなさい」または「警戒していなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: こと
  rationale: 中性単数の関係代名詞が名詞的に用いられており、日本語では「言うこと」とすることで、広く前言を受ける意味を自然に表せる。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは弱い接続を示すが、日本語では文脈上接続語を置かないほうが自然であり、対立の意味を不必要に加えない。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 二人称複数で、まずその場の弟子たちに向けられていることを明示する。
- source_word: λέγω ... λέγω
  choice: 言うことを、わたしは…言います
  rationale: λέγωの反復を残し、弟子たちへの言葉がすべての人へ広げられる修辞的構造を保つ。
- source_word: πᾶσιν
  choice: すべての人に
  rationale: 簡潔で包括的な範囲を示す。日本語では「すべてに」より「すべての人に」が明瞭であり、指示対象を狭めない。
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 現在命令形の継続的な警戒を表し、文脈にある覚醒の比喩を保つ。「見張る」「警戒する」という意味合いも可能なので脚注に示す。
theological_decisions:
- issue: イエスの勧告が及ぶ範囲
  choice: 弟子たちに語られた言葉が、明示的にすべての人へ及ぶ訳とする。
  alternative: 物語上、その場にいる弟子たちだけへの勧告と読む。
  rationale: ギリシア語は「あなたがたに」と「すべての人に」を対置して範囲を広げているため、その普遍化を狭めずに表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令は尊厳を保ちつつ一般読者にも分かりやすい「目を覚ましていなさい」とした。原文のλέγωの反復と、「あなたがた」から「すべての人」への展開を保持した。
