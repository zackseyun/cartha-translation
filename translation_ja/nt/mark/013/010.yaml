id: MRK.13.10
reference: Mark 13:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: ja
  text: そして、まず、すべての民族に福音[a]が宣べ伝えられなければならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「福音」は、ギリシア語で「良い知らせ」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「すべての民族の間で」とも訳せる。ここで「民族」と訳した語は、文脈によっては「異邦人」を意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前の文脈との連続を自然に示し、逆接などの強い含みを加えない。
- source_word: εἰς πάντα τὰ ἔθνη
  choice: すべての民族に
  rationale: εἰςが示す宣教の方向・範囲を「に」で表し、ἔθνηの民族的かつ世界的な広がりを保つ。「異邦人」に限定する解釈は本文に持ち込まない。
- source_word: πρῶτον
  choice: まず
  rationale: 時間的な先行を簡潔で自然な現代日本語で示す。後続事象との厳密な時間関係までは補わない。
- source_word: δεῖ
  choice: なければならない
  rationale: 必要性を明確に表す一方、その必要性の源を本文以上に明示しない。
- source_word: κηρυχθῆναι
  choice: 宣べ伝えられ
  rationale: 公に告げ知らせるというκηρύσσωの意味を、聖書的な品位と現代日本語での理解しやすさを両立させて表す。受動態も保持する。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: 日本語で広く定着し、原語の「良い知らせ」を指す簡潔で自然な語。「良い知らせ」という意味は脚注で示す。
theological_decisions:
- issue: ἔθνηの範囲
  choice: すべての民族
  alternative: すべての異邦人／あらゆる国民の間で
  rationale: 世界的・民族横断的な広がりを保ちつつ、ユダヤ人と異邦人の対比だけに限定しない。前置詞句には「に」と「間で」の双方が可能なため、その幅を脚注で示す。
- issue: δεῖの力
  choice: なければならない
  alternative: 必要である
  rationale: 強い必要性を保つが、それを明示的に「神の定め」と説明するなど、本文にない神学的補足は加えない。
- issue: πρῶτονの位置と時間的含意
  choice: まず
  alternative: 先に
  rationale: 終末についての談話における先行性を示すが、出来事の全時系列を確定する表現にはしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「福音」「宣べ伝える」は日本語聖書で定着した語だが、一般読者にも意味が届くよう「福音」を脚注で説明した。原文の語順にある「まず」の強調を、読みにくくならない範囲で前方に置いた。
