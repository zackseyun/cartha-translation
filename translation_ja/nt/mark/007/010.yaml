  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ja
  text: というのも、モーセはこう言いました。「あなたの父と母を敬いなさい。」また、「父または母をののしる者は、必ず死ななければならない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「必ず死刑に処せられなければならない」。ギリシア語は直訳すると「死をもって死ね」に近い法的な定型表現。
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς γὰρ εἶπεν
  choice: モーセはこう言いました
  rationale: γάρは直前の主張を根拠づけるが、日本語では文脈上明白なため独立した「なぜなら」を置かず、「こう」によって引用導入を自然にした。εἶπενは丁寧体の語り口に合わせた。
- source_word: Τίμα
  choice: 敬いなさい
  rationale: 戒めとしての命令の重みを保ちつつ、現代日本語で自然な表現。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: あなたの父と母
  rationale: 二つの対象を明示し、十戒の定着した言い回しにも沿う。
- source_word: Ὁ κακολογῶν
  choice: ののしる者
  rationale: κακολογέωの「悪く言う、侮辱する、呪う」という幅を、強い言葉による冒瀆を表す自然な日本語で示した。「呪う」だけに限定しない。
- source_word: πατέρα ἢ μητέρα
  choice: 父や母
  rationale: 選言のἤを、日本語で包括的な禁止・法規に自然な「や」で表した。
- source_word: θανάτῳ τελευτάτω
  choice: 必ず死ななければならない
  rationale: 死を意味する同根的な法的定型句の強調と、三人称命令の義務的な力を表す。受動的な処刑を本文で明示しすぎない。
theological_decisions:
- issue: θανάτῳ τελευτάτωという法的刑罰定型句の解釈
  choice: 必ず死ななければならない
  alternative: 必ず死刑に処せられなければならない
  rationale: ギリシア語は文字どおりには「死によって死なせよ」に近い厳粛な定型句であり、死刑宣告を含意しうる。しかし、動作主と執行方法を明示しない原文の形を保つため、本文では「死ななければならない」とし、別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用内の戒めは簡潔な命令形とし、物語の引用導入は丁寧体で統一した。脚注記号[a]は該当する刑罰表現の直後に配置した。
