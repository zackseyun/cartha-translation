source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: ja
  text: また、イエスは彼らに言われた。「あなたがたは、自分たちの言い伝えを守るために、実にうまく神の戒めを退けている。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「実にうまく」は皮肉。直訳的には「あなたがたは、神の戒めを立派に退けて、自分たちの言い伝えを守っている」とも訳せるが、称賛しているのではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了時制だが、ここでは発言を導く談話上の表現として自然な現代日本語にした。「また」によって話が続いていることを示している。
- source_word: Καλῶς
  choice: 実にうまく
  rationale: 文脈上は称賛ではなく痛烈な皮肉である。「実にうまく」は、彼らが神の戒めを退ける仕組みを巧みに作っているという非難を、日本語で自然に伝える。
- source_word: ἀθετεῖτε
  choice: 退けている
  rationale: 権威あるものを認めず、脇へ押しやる意を明確に表す。「無効にする」より平易で、「破る」よりも意図的な拒絶をよく保つ。
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: 神の戒め
  rationale: 単数形と宗教的・権威的な重みを保ち、「自分たちの言い伝え」との対照を明瞭にした。
- source_word: ἵνα
  choice: ために
  rationale: 目的を表す接続詞の力を、自然な日本語の目的表現で保持した。
- source_word: παράδοσιν ὑμῶν
  choice: 自分たちの言い伝え
  rationale: 受け継がれた伝承を指す語を平易に表し、再帰的な「自分たちの」によって神の戒めとの対照を際立たせた。
- source_word: τηρήσητε
  choice: 守る
  rationale: 遵守・保持の意味を簡潔に表し、神の戒めを「退ける」こととの鋭い対照を保った。
theological_decisions:
- issue: イエスの言葉の調子
  choice: 称賛ではなく皮肉を込めた叱責として訳す
  alternative: 「あなたがたは立派に神の戒めを退けている」のように、表面上の称賛に近く訳す
  rationale: 前後の文脈では、人の言い伝えを優先して神の戒めを退ける行為が非難されている。καλῶς の肯定的な語感を残しつつ、「実にうまく」という日本語の皮肉でその緊張を伝えた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの厳しい皮肉と、「神の戒め」と「自分たちの言い伝え」との対照を保った。「イエス」はギリシア語本文では代名詞だが、日本語で発言者を明確にするため補った。
