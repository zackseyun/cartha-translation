  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: ja
  text: そしてイエスは彼らに言われた。「あなたがたも、そんなに分からないのですか。外から人の中に入るものは何であれ、その人を汚す[a]ことはできないと分からないのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚す」は、ここでは儀礼上、汚れたものにするという意味合いを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: 物語中の歴史的現在だが、日本語では過去形にして自然な叙述とした。主語のイエスは文脈上の指示対象を明確にするため補った。
- source_word: Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε
  choice: あなたがたも、そんなに物分かりが悪いのですか
  rationale: οὕτωςの驚きと叱責の調子、καὶ ὑμεῖςの「あなたがたも」を保ちつつ、ἀσύνετοιを現代日本語で理解しやすく表した。
- source_word: οὐ νοεῖτε
  choice: 分からないのですか
  rationale: 直前のἀσύνετοιとの意味上の反復を保ち、問いかけとして自然な日本語にした。
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον
  choice: 外から人の中に入るものは何であれ
  rationale: 冠詞付き分詞を「ものは何であれ」と総称的に訳し、ἔξωθενとεἰςの方向性を明示した。ἄνθρωπονは特定の男性ではなく一般の人を指すため「人」とした。
- source_word: οὐ δύναται αὐτὸν κοινῶσαι
  choice: その人を汚すことはできない
  rationale: 可能を表すοὐ δύναταιを明示し、αὐτόνの指示対象を「その人」とした。κοινόωはこの文脈で宗教的な清浄・不浄に関わるが、本文では簡潔な「汚す」を用いた。
theological_decisions:
- issue: κοινόωに含まれる清浄規定上の意味
  choice: 汚す
  alternative: 汚れたものにする／宗教上汚れた状態にする
  rationale: 単なる道徳的腐敗だけに限定せず、文脈上の儀礼的・宗教的な不浄を含み得る語として「汚す」を採用し、その含意を脚注で明示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの驚きを伴う叱責の調子を保った。文は次節へ論理的に続くが、本節単独でも疑問文として自然に読めるよう句読点を整えた。
