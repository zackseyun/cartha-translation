  to: しかし、あなたがたはこう言います。「もし人が父または母に、『私から得られるはずのものは何であれ、コルバン、すなわち贈り物です』と言えば、」
  rationale: 原文の語順と不定的な条件表現をよりよく反映するため、「私から得られるはずのものは何であれ」を引用内に保持した。「贈り物」は Δῶρον の基本義として本文に置き、神への献納という含意は脚注に限定した。引用文および条件文は12節へ続くため、節末を読点で閉じる。
