id: MRK.7.11
reference: Mark 7:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: ja
  text: しかし、あなたがたはこう言います。「もし人が父または母に、『私から得られるはずのものは何であれ、コルバン、すなわち贈り物です』と言えば、」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: しかし、あなたがたはこう言います
  rationale: δὲによる直前との対照を「しかし」で示し、λέγετεの現在形を一般的な言明として自然な現代日本語にした。
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: もし人が……と言えば
  rationale: ἐὰν＋アオリスト接続法の条件的・予想的用法を「もし……と言えば」で表した。ἄνθρωποςはここでは代表的・一般的な人を指すため「人」とした。
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: 父または母に
  rationale: 与格を発言の相手として表し、原文の二つの親族語と選言を簡潔に保った。
- source_word: Κορβᾶν
  choice: コルバン
  rationale: ギリシア語本文が保存するセム語由来の宗教用語を音写し、マルコ自身の説明を続ける構造を保った。
- source_word: ὅ ἐστιν Δῶρον
  choice: つまり神への供え物です
  rationale: δῶρονは一般には「贈り物」だが、ここではコルバンの説明として神に献げる物を指すため、現代日本語で誤解の少ない「神への供え物」とした。
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: あなたが私から受けられたはずの助けは
  rationale: 不定関係節の内容をコルバン宣言の対象として自然な日本語の語順に組み替えた。ὠφεληθῇςの「益を受ける、助けられる」という幅を「助け」で表し、親への扶養に限定しすぎないようにした。
theological_decisions:
- issue: コルバンという宣言と神への献納の関係
  choice: 「コルバン」を本文に残し、マルコの説明を「つまり神への供え物です」と訳す
  alternative: 本文で直接「神への供え物」とだけ訳す、または「贈り物」と訳す
  rationale: 原文が外来語を保存したうえで説明を添える形式を尊重する。神に献げられた物という文脈上の意味は明らかにする一方、誓願の法的効力や具体的制度について本文以上の説明を加えない。
- issue: 親が受けるはずだった利益の性質
  choice: 「受けられたはずの助け」とし、物質的扶養に限定しない
  alternative: 「受けるはずだった扶養」または「利益」
  rationale: ὠφελέωは広く益する・助けることを表す。文脈には親への物質的支援が含まれるが、訳文でその範囲を不必要に狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。11節は12節へ構文が続くため、閉じない読点で終えた。「コルバン」は歴史的用語として残し、説明を同じ発言内に置いた。
