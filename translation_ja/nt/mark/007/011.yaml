    rationale: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς は、親が話し手から得ることのできる益を不定的・展望的に指す。日本語では「得られるはずのものは何であれ」とするほうが時制・不定性を保てる。
  - severity: low
    issue: 本文の「神への供え物です」がマルコの語釈をやや具体化している
    rationale: Δῶρον の直接的な訳は「贈り物」である。神への献納というコルバンの文脈的含意は脚注で示せるため、本文では原文の簡潔さを保つ。
  revised_text: しかし、あなたがたはこう言います。「もし人が父または母に、『私から得られるはずのものは何であれ、コルバン、すなわち贈り物です』と言えば、」
  revised_footnotes:
