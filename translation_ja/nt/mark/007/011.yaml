  source_fidelity: 要改訂です。現行訳は「コルバン」と「あなたが私から受けられたはずの助け」の語順を入れ替えても意味は概ね伝わりますが、「受けられたはず」は過去の受益を示し得ます。ὠφεληθῇς はここでは親が話し手から得ることのできる益を展望する表現です。また、Δῶρον は本文ではまず「贈り物」であり、「神への」は文化的説明として脚注に置くのが、マルコ自身の簡潔な語釈により忠実です。
  naturalness: 「もし人が父または母に」と「こう言います」は明瞭な現代標準日本語です。「私から得られるはずのものは何であれ」とすることで、原文の不定性を保ちつつ自然に読めます。節が次節へ続くため、末尾の読点を維持します。
  terminology: Κορβᾶν は「コルバン」と音写し、ὅ ἐστιν Δῶρον は「すなわち贈り物です」と訳します。コルバンが神に献げられたものを指すという歴史的・文化的含意は脚注で簡潔に説明します。
