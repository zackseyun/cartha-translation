  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: ja
  text: 「それは、その人の心には入らず、腹に入り、便所へ出ていくからである。」――こうして、すべての食物を清めるのである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この句は、マルコによる説明として、「こうして、イエスはすべての食物を清いとされた（清いと宣言された）」という意味にも取れる。また、直前の消化・排泄の過程が、すべての食物を清める、すなわち体外へ排出することを述べた句と取ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: 心
  rationale: 内なる人と消化器官との対比を保つため、聖書的な身体表現をそのまま生かした。
- source_word: κοιλίαν
  choice: 腹
  rationale: 消化に関する文脈で自然かつ明瞭であり、「胃」ほど解剖学的に限定しない。
- source_word: ἀφεδρῶνα
  choice: 便所
  rationale: 排泄先を具体的かつ現代の読者に分かりやすく表す。「下水」は設備を過度に想定させる。
- source_word: καθαρίζων
  choice: 清める
  rationale: 解釈を加えた「清いと宣言する」ではなく、分詞の基本的な語義を保ち、構文上の曖昧さを注で示した。
- source_word: βρώματα
  choice: すべての食物
  rationale: ギリシア語の複数形が示す多様な食物を、日本語として自然な集合表現で訳した。
- source_word: αὐτοῦ
  choice: その人の
  rationale: 文脈上の一般的な人を指す三人称単数を、性別に依存しない自然な日本語で表した。
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: 入る／出ていく
  rationale: 摂取と排泄の移動の対照を簡潔に保持した。
theological_decisions:
- issue: καθαρίζων πάντα τὰ βρώματα の解釈
  choice: 「こうして、すべての食物を清めるのである」と直訳的に示す
  alternative: マルコの説明として「こうして、イエスはすべての食物を清いとされた」と明示する
  rationale: 男性単数分詞はイエスを暗黙の主語とするマルコの説明と理解されることが多い一方、消化・排泄の過程を述べる句と取る伝統的理解もある。本文では主語を補いすぎず、注で実質的な二通りの理解を明示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、発言部分と説明的な末尾句をダッシュで区切った。「便所」は具体的だが過度に俗語的ではなく、古代の排泄場所を現代日本語で自然に伝える。
