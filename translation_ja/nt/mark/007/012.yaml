translation:
  language: ja
  text: あなたがたは、彼に、自分の父または母のために、もはや何もさせません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父または母のために何かをすること」には、この文脈では実際的または金銭的な援助も含まれ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: もう～ない
  rationale: 以前は可能だった行為が今は許されないという時間的な変化を、自然な現代日本語で表す。
- source_word: ἀφίετε
  choice: させない
  rationale: ここでは「赦す」ではなく「許す」の意味。使役否定の形にすることで、後続の不定詞と合わせて自然に表現できる。
- source_word: αὐτὸν
  choice: （文脈上のその人に）
  rationale: 日本語では目的語を明示すると不自然になりやすいため省略したが、「させない」の主体とは別の、直前に述べられた人を指す構造は保持される。
- source_word: οὐδὲν ποιῆσαι
  choice: 何もさせない
  rationale: 許可を表す動詞に不定詞と否定代名詞が続く構造を、日本語の自然な全面否定として表した。
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: 父または母のために
  rationale: 与格の受益的な意味を「ために」で表し、原文の広い表現を保つ。日本語では文脈上本人の父母であることが明らかなため、「自分の」は補わない。
theological_decisions:
- issue: コルバンの文脈から、金銭的・実際的扶養の意味を本文に明示するか
  choice: 本文は「父または母のために、もう何もさせない」と広く訳す
  alternative: 「父または母を助けることを、もう何もさせない」または「父または母を扶養することを、もう許さない」
  rationale: 周囲の文脈は物質的援助を示唆するが、この節のギリシア語自体は広く「何かをする」と述べる。意味を狭めず、補足は脚注に置く。
translation_notes:
  register: 明瞭で現代的ながら、叙述としての品位を保った。「または」は原文の選言を明確にし、「のです」は前節から続くイエスの指摘・説明として自然につなぐ。脚注標識[a]を本文に付した。
