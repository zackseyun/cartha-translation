  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: ja
  text: ファリサイ派の人々とユダヤ人は皆、手を念入りに[a]洗わなければ、食事をしない。長老たちの伝承を守っているためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「念入りに」に当たるギリシア語の意味は難しく、直訳すれば「こぶしで」。ほかに「手首まで」「徹底して」とも考えられる。慣習に従った儀礼的な手洗いの仕方を指すらしい。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: からである
  rationale: 前後の文脈に対する説明的な挿入句であることを、自然な日本語の文末表現で示す。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: ユダヤ教内の集団名として、現代日本語で分かりやすい標準的な表現を用いる。
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: ユダヤ人は皆
  rationale: 原文の広い総称を弱めずに保つ。文脈上の一般化であり、一人残らずという統計的断定とは限らない。
- source_word: ἐὰν μὴ
  choice: なければ
  rationale: 否定条件を自然な日本語で表す。
- source_word: πυγμῇ
  choice: 念入りに
  rationale: 意味が難しい語で、儀礼的な手洗いの仕方または範囲を指す可能性が高い。本文では意味を過度に限定しない自然な表現とし、異訳を脚注に示す。
- source_word: νίψωνται τὰς χεῖρας
  choice: 手を洗う
  rationale: 身体の一部を洗うことを表すνίπτωと目的語「手」を明確かつ自然に訳す。
- source_word: οὐκ ἐσθίουσιν
  choice: 食事をしない
  rationale: 習慣的行為を示す現在形を日本語で自然に表す。
- source_word: κρατοῦντες
  choice: 守っている
  rationale: 受け継いだ慣行に固く従う意味を簡潔に表す。
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: 長老たちから受け継いだ言い伝え
  rationale: 伝承の由来と継承性が普通の読者にも明確になるように表す。
theological_decisions:
- issue: 「ユダヤ人は皆」の範囲と強さ
  choice: 原文どおり広い一般化として「ユダヤ人は皆」とする。
  alternative: 「多くのユダヤ人」または「ユダヤ地方の人々」
  rationale: πάντεςを省いたり弱めたりせず、Ἰουδαῖοιをこの箇所の民族宗教的な総称として訳す。ただし、修辞的な一般化を数学的な全称命題に変えない。
- issue: πυγμῇの意味
  choice: 本文を「念入りに」とし、字義的・技術的な可能性を脚注に残す。
  alternative: 「こぶしで」「手首まで」「徹底して」
  rationale: 語義は古くから議論があり、特定の儀礼手順を断定できない。逐語訳「こぶしで」は現代日本語では誤解を招きやすいため、本文の明瞭さと原文の不確かさを両立させる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。説明句の因果関係が自然に伝わるよう語順を整え、専門的な不確かさは脚注で明示した。
