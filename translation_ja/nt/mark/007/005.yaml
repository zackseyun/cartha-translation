  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: ja
  text: ファリサイ人と律法学者たちはイエスに尋ねた。「なぜ、あなたの弟子たちは長老たちの言い伝えに従って行動せず、汚れた手[a]でパンを食べるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れた手」とは、物理的に汚い手ではなく、儀礼上、清くないと見なされた手のこと。原語は文字どおりには「共通の手」だが、この文脈では儀礼的に俗なもの、すなわち汚れたものを指す。「長老たち」は教会の役職ではなく、ユダヤ人の先代の権威者たちを指す。
    reason: κοιναῖς χερσὶνの儀礼的意味を示し、τῶν πρεσβυτέρωνを教会の役職と誤解しないようにするため。
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: 尋ねた
  rationale: 物語における歴史的現在を、自然な現代日本語の過去形で表した。反復的な問いかけまでは明示しない。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: ユダヤ教の律法に通じた公的な専門家を指す文脈上、日本語読者に役割が伝わる定着した訳語を用いた。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う自然で簡潔な日本語表現。
- source_word: περιπατοῦσιν
  choice: 歩まず
  rationale: 生活態度を表す比喩的な「歩く」を保持し、直後の規範への従属との関係も伝わるようにした。
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: 昔の人々の言い伝えに従って
  rationale: κατάの規範に即する意味を「従って」で表し、πρεσβύτεροιはここで共同体役職としての「長老」より、先代の権威者・祖先的伝承者を指すため「昔の人々」とした。
- source_word: κοιναῖς χερσὶν
  choice: 汚れた手で
  rationale: κοινόςは物理的な汚れではなく儀礼上の汚れを意味する。本文は自然な「汚れた手」とし、その限定された意味を脚注で明示した。
- source_word: τὸν ἄρτον
  choice: パンを
  rationale: 食事全般を指し得るが、原文の具体的な「パン」を保持した。
theological_decisions:
- issue: κοινόςが示す汚れの性質
  choice: 本文を「汚れた手」とし、脚注で儀礼上の汚れと説明する
  alternative: 「清めていない手」「普通の手」
  rationale: 論争の焦点は衛生や道徳的悪ではなく、言い伝えに基づく儀礼的清浄にある。「清めていない」は行為を補いすぎ、「普通の」は日本語では意味が伝わりにくいため、本文と脚注を組み合わせて原語の緊張を保った。
- issue: τῶν πρεσβυτέρωνの指示対象
  choice: 昔の人々
  alternative: 長老たち
  rationale: 教会役職の長老と誤解されるのを避け、先代の宗教的権威者から伝えられた伝承という文脈を示した。ただし「祖先」と限定して血縁的意味を加えてはいない。
translation_notes:
  register: 明瞭で現代的かつ品位ある語調。問いの対立的な調子を保ちながら、過度に硬い文語や教派固有の用語を避けた。脚注記号[a]は本文の該当文末に置いた。
