- from: そこで、ファリサイ派の人々と律法学者たちはイエスに尋ねた。「なぜ、あなたの弟子たちは昔の人々の言い伝えに従って歩まず、汚れた手でパンを食べるのですか。」[a]
  to: ファリサイ人と律法学者たちはイエスに尋ねた。「なぜ、あなたの弟子たちは長老たちの言い伝えに従って行動せず、汚れた手[a]でパンを食べるのですか。」
  rationale: 本文では、伝承の権威者を指す「長老たち」を保持して原文の語を過度に一般化しないようにした。「歩く」というギリシア語の生活態度の比喩は、「言い伝えに従って行動する」として明瞭な現代日本語で表した。κοιναῖς は本文では自然な「汚れた手」とし、脚注で儀礼的意味と字義上の語感を示した。
