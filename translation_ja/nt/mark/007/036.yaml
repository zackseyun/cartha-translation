  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: ja
  text: そしてイエスは、だれにも話さないようにと彼らに固く命じた。しかし、命じれば命じるほど、彼らはいっそう盛んに言い広めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、どれほど命じても、彼らはいよいよ言い広めた。」
    reason: ὅσον … μᾶλλον περισσότερον の相関関係と強意は、日本語では複数の自然な表し方が可能なため。
lexical_decisions:
- source_word: διεστείλατο
  choice: 固く命じた
  rationale: διαστέλλομαι の中動態が表す強い指示を、現代日本語で自然かつ明確に表した。「厳しく言い渡した」も可能だが、ここでは命令としての力を端的に示す。
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: だれにも話さないように
  rationale: 命令の内容を表す節として自然な日本語にした。文脈上、起きたことを他者に伝えないという意味であり、「何も言わないように」より誤解が少ない。
- source_word: ὅσον ... διεστέλλετο
  choice: 命じれば命じるほど
  rationale: ὅσον と未完了時制による反復的・比例的な関係を、日本語の相関構文で表した。命令が繰り返された含みも保たれる。
- source_word: μᾶλλον περισσότερον
  choice: いっそう盛んに
  rationale: 重ねられた比較・強意を不自然に直訳せず、宣伝がますます広がった強調として表した。別の構文理解は脚注に示す。
- source_word: ἐκήρυσσον
  choice: 言い広めた
  rationale: κηρύσσω の公に告げ知らせる意味を、この場面に合う自然な日本語で表した。「宣べ伝えた」は宗教的・説教的な専門語に聞こえやすいため避けた。目的語はギリシア語で明示されていないので、日本語でも補わなかった。
theological_decisions:
- issue: イエスの沈黙命令と、いわゆるメシアの秘密
  choice: 沈黙を求める実際の強い命令として訳し、その理由は説明しない。
  alternative: 命令の厳しさをさらに強めて「厳しく警告した」と訳す、または沈黙を命じた動機を本文に織り込む。
  rationale: 本文は、イエスが明確に口止めしたことと、人々がそれに反していっそう言い広めたことの緊張を示すが、その命令の理由は述べていない。翻訳でもその緊張と未説明性を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「固く命じた」で命令の力を保ち、「言い広めた」で公然と告知する動作を一般読者に自然に伝えた。主語を明確にするため、文脈上の指示対象である「イエス」を補った。
