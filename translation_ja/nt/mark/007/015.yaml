  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: ja
  text: 人の外から人の中に入って来るもので、人を汚す[a]ことのできるものは何もない。むしろ、人から出て来るものが、人を汚すのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚す」は、清浄規定においては「汚れたものにする」という意味にも訳せる。ここでは、続く文脈にある道徳的な意味も含み得る表現とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: 何もない
  rationale: 絶対用法の中性単数で、外から入るもののうち例外はないことを自然な日本語で表す。
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: 人の外から
  rationale: 外部を起点とする意味を示し、後半の「人から出て来る」との対照を保つ。
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: 入って来るもの
  rationale: 分詞がοὐδένを限定する構造を、明瞭で自然な連体表現にする。文脈上、入る先が人であることは「人の外から」によって明らかである。
- source_word: δύναται
  choice: ことのできる
  rationale: 能力・可能性を表す語義を明示する。
- source_word: κοινῶσαι / κοινοῦντα
  choice: 汚す
  rationale: 清浄規定上の汚れと、続く文脈にある道徳的な汚れの双方を狭めずに表せる。
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: 人から出て来るもの
  rationale: 実体化された中性複数分詞を「もの」とし、前半の「外から入って来るもの」との修辞的対照を保つ。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 単なる逆接にとどまらない、前半を正して真の原因を示す対照を表す。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ここでは個々の人間を一般的・代表的に指すため、現代日本語で自然かつ包括的な「人」とする。
theological_decisions:
- issue: 清浄論争におけるκοινόωの意味
  choice: 汚す
  alternative: 汚れたものにする／清くないものにする
  rationale: 儀礼的な不浄だけに限定せず、直後に展開される内面的・道徳的な意味も保持する。
- issue: ἄνθρωποςの一般的用法
  choice: 人
  alternative: 人間／その人
  rationale: 性別を限定しない一般的な人間を指す語であり、日本語では「人」が簡潔で自然である。必要な箇所では「その人」として指示関係を明確にした。
- issue: 前半と後半の対照
  choice: 「外から入って来るもの」と「人から出て来るもの」を対応させる
  alternative: 食べ物と悪い思いを明示する
  rationale: 原文はこの節だけでは対象を明示せず、後続文脈で説明するため、翻訳で解釈語を補わず曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格言的な重みを保つため、後半は「それが人を汚すのである」とした。原文の外／内、入る／出るという対照をできるだけ保持した。
