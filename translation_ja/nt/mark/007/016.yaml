  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、シナイ写本とバチカン写本（ともに4世紀）を含む初期のギリシア語写本や初期コプト語訳にはありませんが、ビザンティン系多数本文、ラテン語伝承、およびシリア語写本の大半にはあります。マルコ4章9節、23節にある同じ表現が、後代に写字生によって加えられた可能性があります。
