lexical_decisions:
- source_word: ὦτα
  choice: 聞く耳
  rationale: 直訳的な「耳」を保ちながら、ἀκούεινとの結びつきと、受け止めて理解する姿勢を表す日本語の慣用表現とした。
- source_word: ἀκουέτω
  choice: 聞きなさい
  rationale: 三人称単数・現在命令形の勧告的な力を、現代日本語で自然かつ明確な命令表現として伝える。単なる音声知覚ではなく、注意して受け止める含意も文脈上保たれる。
- source_word: Εἴ τις
  choice: …のある者は
  rationale: 条件節「もしだれかが」を、日本語で簡潔かつ自然な一般条件として表現した。対象を限定せず、だれにでも向けられた呼びかけを保つ。
theological_decisions:
- issue: 「聞く」の比喩的含意
  choice: 本文では「聞きなさい」とし、理解・受容という含意を訳文で説明しすぎない
  alternative: 「悟りなさい」「心して聞きなさい」
  rationale: 原文は同じἀκούωを用い、身体的に聞くことと霊的に受け止めることの重なりを保っているため、その緊張を訳文でも残した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。格調を保ちつつ、性別を明示する代名詞を避け、一般的な呼びかけとして訳した。本文採用版の底本に従って節を掲げ、重要な本文上の異同は脚注で示した。
