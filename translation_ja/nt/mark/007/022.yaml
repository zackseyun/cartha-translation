  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: ja
  text: 姦淫、貪欲、さまざまな悪事、欺き、恥知らずなふるまい、よこしまな目[a]、中傷[b]、高慢、愚かさ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「悪い目」。ねたみ深い見方、物惜しみする心、または悪意ある見方を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: または「冒瀆」。このギリシア語は、人への中傷にも、神を冒瀆する言葉にも用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: 姦淫
  rationale: 複数形で個々の姦淫行為を指しうるが、日本語では抽象名詞の「姦淫」が自然で、悪徳の列挙にもよく合う。
- source_word: πλεονεξίαι
  choice: 貪欲
  rationale: より多くを得ようとする飽くことのない欲望、とりわけ所有や搾取に向かう欲を簡潔に表す。
- source_word: πονηρίαι
  choice: さまざまな悪事
  rationale: ギリシア語の複数形を反映しつつ、「悪さの数々」のような不自然さを避け、邪悪さの多様な現れを表した。
- source_word: δόλος
  choice: 欺き
  rationale: 意図的に人をだますことを、現代日本語で自然かつ簡潔に表す。
- source_word: ἀσέλγεια
  choice: 放縦
  rationale: 性的な含みを持つこともある、恥を顧みない無軌道で節度のない振る舞いを、性的意味だけに狭めず表す。
- source_word: ὀφθαλμὸς πονηρός
  choice: よこしまな目
  rationale: 直訳的な比喩を本文に残し、ねたみ深い、物惜しみする、または悪意ある見方という慣用的意味は脚注で示す。
- source_word: βλασφημία
  choice: 中傷
  rationale: 人を傷つける悪しき言葉という文脈上自然な意味を採った。ただし神への「冒瀆」も原語の可能な意味なので脚注に残す。
- source_word: ὑπερηφανία
  choice: 高慢
  rationale: 自分を他者より上に置く傲慢な自己高揚を、聖書の文体になじみながら現代でも通じる語で表す。
- source_word: ἀφροσύνη
  choice: 愚かさ
  rationale: 知能の低さではなく、道徳的・実践的な分別の欠如を表す。
theological_decisions:
- issue: βλασφημίαの対象が人か神か
  choice: 本文では「中傷」
  alternative: 「冒瀆」
  rationale: この悪徳表では対人的な悪しき言葉として読むことが自然だが、原語は神を汚す発言も表しうるため、神学的な幅を脚注で保持した。
- issue: ὀφθαλμὸς πονηρόςの慣用的意味
  choice: 本文では比喩を保って「よこしまな目」
  alternative: 「ねたみ」「物惜しみする目」「悪意ある見方」
  rationale: 比喩そのものを消さず、その文化的・慣用的な意味の幅を脚注で説明することで、一つの意味に限定しない。
translation_notes:
  register: 現代の一般読者に理解できる簡潔で格調ある悪徳表とした。日本語で不自然になる機械的な複数形は避けたが、πονηρίαιは「さまざまな悪事」として複数性を明示した。「放縦」はやや文語的だが、ἀσέλγειαを性的な罪だけに狭めず、恥知らずで節度のない行動という広がりを保つために採用した。提示された英語本文では脚注記号の位置と脚注内容が対応していなかったため、原語に即して[a]を「よこしまな目」、[b]を「中傷」に付した。
