id: MRK.7.32
reference: Mark 7:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: ja
  text: 人々は、耳が聞こえず、話すことにも不自由のある人[a]をイエスのもとに連れて来て、その人に手を置いてくださるよう懇願した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「耳の聞こえない人、また話すのが困難な人」。二つの表現は同じ一人の人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: 連れて来て
  rationale: マルコに多い歴史的現在を、日本語の自然な物語表現に合わせて過去の出来事として訳した。目的語が人なので「連れて来る」が適切。
- source_word: κωφόν
  choice: 耳が聞こえず
  rationale: ここでは後続の μογιλάλον が発話の障害を別に示すため、κωφός は聴覚の障害として訳し分けた。
- source_word: μογιλάλον
  choice: 話すことにも不自由のある
  rationale: 全く話せないことではなく、発話が困難であることを示す珍しい語なので、現代日本語で明瞭かつ過度に断定しない表現とした。
- source_word: παρακαλοῦσιν
  choice: 懇願した
  rationale: 癒やしを求める文脈での切実で強い願いを表し、単なる「頼んだ」より原文の強さを保つ。
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: その人に手を置いてくださるよう
  rationale: 依頼の内容を自然な日本語で示した。原文の単数形「手」は、日本語では数を明示しない「手を置く」で無理なく保持される。
theological_decisions:
- issue: その人の障害の性質
  choice: 耳が聞こえず、話すことにも不自由があった
  alternative: 耳が聞こえず、口もきけなかった
  rationale: κωφός と μογιλάλος は聴覚障害と発話困難をそれぞれ示す。μογιλάλος を完全な発話不能とするのは意味を強めすぎるため避けた。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「イエス」は直前の文脈で指示対象が明らかな代名詞 αὐτῷ を明示して、単独の節としても理解しやすくした。人を障害だけで呼ぶ表現を避けつつ、原文の二つの状態を区別した。
