base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: ja
  text: ところが、汚れた霊がついている幼い娘[a]を持つある女性が、イエスのことを聞くと、すぐにやって来て、イエスの足もとにひれ伏した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幼い娘」に当たるギリシア語は「娘」の指小形で、「小さな娘」または愛情を込めた言い方とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ところが
  rationale: 直前の文脈からの軽い逆接的転換を、自然な物語調で示す。
- source_word: εὐθὺς ἀκούσασα
  choice: 聞くと、すぐに
  rationale: 分詞と副詞の結びつきを保ち、聞いたことに続く即座の行動として日本語で自然に表した。
- source_word: γυνὴ
  choice: 一人の女
  rationale: 無冠詞の人物を新たに場面へ導入する表現として明確である。
- source_word: τὸ θυγάτριον αὐτῆς
  choice: 幼い娘
  rationale: 指小形が持ち得る幼さや愛情のニュアンスを簡潔に残し、親子関係も明示した。
- source_word: πνεῦμα ἀκάθαρτον
  choice: 汚れた霊
  rationale: マルコ福音書の用語を字義に沿って保ち、「悪霊」と解釈的に限定しない。
- source_word: ἐλθοῦσα
  choice: やって来て
  rationale: 場面の中心であるイエスのもとへ来たことを、現代日本語の自然な叙述で表す。
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: その足もとにひれ伏した
  rationale: 身体を低くして足もとに倒れ伏す、切実な嘆願と敬意を伴う動作を自然に表した。
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον の訳
  choice: 汚れた霊
  alternative: 悪霊／不浄な霊
  rationale: 原語の形容表現とマルコ固有の用語法を保つ。「悪霊」は指示対象を説明する訳として可能だが、原語の「汚れ」の含意を弱めるため本文には採らない。
- issue: εὐθὺς が何にかかるか
  choice: 聞いたことに続く来訪を「聞くと、すぐにやって来て」と表す
  alternative: 「すぐに聞いて」または文頭の「すぐに」
  rationale: 語順上は ἀκούσασα と近接する一方、文全体では聞いた直後の反応を示すとも理解できる。日本語では両者のつながりを保ちつつ、不自然な係り受けを避けた。
translation_notes:
  register: 明瞭な現代標準日本語。物語の緊迫感と敬意ある文体を保ち、「イエス」は文脈上の指示対象を日本語で明確にするため補った。脚注記号は該当文末に置いた。
