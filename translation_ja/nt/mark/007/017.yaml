id: MRK.7.17
reference: Mark 7:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: ja
  text: そして、イエスが群衆から離れて家に入ると、弟子たちはそのたとえ[a]についてイエスに尋ねた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その言葉」「その比喩」。ギリシア語は「パラボレー」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: マルコの叙述に見られる接続の流れを保ちつつ、現代日本語として自然にした。
- source_word: ὅτε
  choice: 入ると
  rationale: 時間的状況を表す接続詞を、日本語の自然な継起表現「～すると」に組み込んだ。
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: 家に入る
  rationale: οἶκονに定冠詞がないため「その家」と特定せず、「家」と訳した。動詞の「入る」という移動の意味も保持した。
- source_word: ἀπὸ τοῦ ὄχλου
  choice: 群衆から離れて
  rationale: 単なる起点だけでなく、群衆と離れた場所に移ったという文脈上の意味を自然に表した。
- source_word: ἐπηρώτων
  choice: 尋ねた
  rationale: 未完了過去は継続的な問いかけを含み得るが、日本語の物語文では単純形が自然であり、過度に反復性を加えないようにした。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちは
  rationale: 日本語では文脈上、イエスの弟子であることが明白なため、重い所有表現を避けた。
- source_word: τὴν παραβολήν
  choice: そのたとえ
  rationale: παραβολήの比喩的教えという広がりを保ち、直前の発言を指す定冠詞は「その」で表した。「たとえ話」よりも、短い比喩的な言葉にも適用できる「たとえ」を選んだ。
theological_decisions:
- issue: 直前の短い比喩的発言を指すπαραβολήの訳し方
  choice: そのたとえ
  alternative: その言葉／そのたとえ話
  rationale: 「言葉」では比喩性が薄れ、「たとえ話」では物語形式を強く示しすぎる可能性がある。「たとえ」はマルコが用いた教えの類型を保ちながら、形式を狭く限定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。イエスを主語として補い、後半の代名詞も「イエス」と明示して、普通の読者が指示対象を取り違えないようにした。文体は口語的になりすぎない簡潔な聖書叙述調とした。
