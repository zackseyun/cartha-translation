  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: ja
  text: しかし、彼らは、人間の戒めを教えとして教えながら、むなしくわたしを礼拝している。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάτην
  choice: むなしく
  rationale: 「何の益もなく」「無益に」という意味を簡潔に表し、預言の厳しい批判を保つ。
- source_word: δὲ
  choice: しかし
  rationale: 前節の「唇では敬うが、心は遠く離れている」という内容との対照を明確にする。
- source_word: σέβονταί με
  choice: わたしを礼拝している
  rationale: 神に向けられた敬虔・崇敬を表すため、現代日本語で明瞭な「礼拝する」とした。
- source_word: διδάσκοντες
  choice: 教えているからだ
  rationale: 現在分詞が、礼拝がむなしい理由またはそのあり方を示すと理解し、自然な日本語で関係を明示した。ただし、付帯状況として読む可能性を脚注に残した。
- source_word: διδασκαλίας
  choice: 教えとして
  rationale: 人間由来の戒めが権威ある教えとして提示されている関係を表す。
- source_word: ἐντάλματα ἀνθρώπων
  choice: 人が定めた戒め
  rationale: 属格が戒めの人間的起源を示すことを自然な日本語で明確にし、男女の別を不必要に示さない。
theological_decisions:
- issue: 人間由来の戒めと権威ある教えとの関係
  choice: 人が定めた戒めを、教えとして教えている
  alternative: 教えているのは、人が定めた戒めにすぎない
  rationale: 人間の戒めそのものが教えとして提示されているという圧縮されたギリシア語の関係を保ち、人間の権威を神の教えに並べることへの批判を明確にした。
- issue: 分詞 διδάσκοντες と「むなしい礼拝」の論理関係
  choice: 理由として「からだ」で結ぶ
  alternative: 付帯状況として「教えながら」と訳す
  rationale: 文脈上、人の戒めを教えとして教えることが礼拝をむなしくする理由を示すと読めるが、ギリシア語分詞自体は付帯状況・様態とも取り得るため、代案を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、旧約預言の引用にふさわしい簡潔で厳粛な調子を保った。「人が定めた」は「人間の」より自然に由来を示す。
