lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っていた
  rationale: 未完了時制が表す継続的な発言を保ちつつ、現代日本語として自然にした。
- source_word: δὲ
  choice: そして
  rationale: 強い対比ではなく、談話をつなぐ軽い接続を表す。
- source_word: ὅτι
  choice: 直接話法のかぎ括弧
  rationale: 発言内容を導くὅτιを、日本語で自然な直接話法として表した。
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: 人から出て来るもの
  rationale: 冠詞付き分詞句の実体詞的用法を自然に表し、ἐκの起点も明示した。
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: 人
  rationale: ここでのἄνθρωποςは一般的・代表的な人間を指すため、日本語では性別を限定しない「人」が正確で自然である。反復して原文の並行性も保った。
- source_word: ἐκεῖνο
  choice: それが
  rationale: 指示代名詞の強調を明示し、直前の「人から出て来るもの」を受ける形にした。
- source_word: κοινοῖ
  choice: 汚す
  rationale: 清浄・不浄の文脈における「不浄にする」という意味を、簡潔で自然な日本語で表した。儀礼的清浄の含意は脚注で補った。
theological_decisions:
- issue: κοινόωが表す清浄・不浄の概念
  choice: 汚す
  alternative: 汚れたものにする／不浄にする
  rationale: 本文では広く理解できる「汚す」を用いながら、この語が単なる物理的な汚れではなく、清浄・不浄に関わる語であることを脚注に残した。儀礼的不浄と道徳的汚れの関係を訳文で一方的に限定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「イエス」は直前の文脈から補った主語であり、継続する発言者を明確にする。「もの、それが」という構文でἐκεῖνοの強調と原文の修辞的反復を保った。
