id: MRK.7.35
reference: Mark 7:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: ja
  text: すると、彼の耳が開かれ[a]、舌の縛りが解けて[b]、はっきりと[c]話した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聴覚が開かれ」とも訳せる。ギリシア語は、耳だけでなく聞く能力を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼の舌の縛りが解けた」。つまり、話すことを妨げていたものが取り除かれた。
    reason: lexical_alternative
  - marker: c
    text: 「正しく」または「明瞭に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: 開かれ
  rationale: アオリスト受動態を反映し、いやしによって聞くことが可能になった瞬間を簡潔に表す。
- source_word: αὐτοῦ αἱ ἀκοαί
  choice: 彼の耳
  rationale: ἀκοαίは聴覚を指すこともあるが、複数形を用いたこのいやしの文脈では、具体的で自然な「耳」とした。
- source_word: ἐλύθη
  choice: 解けて
  rationale: λύωの受動態が表す、拘束が解かれたという意味と比喩を保つ。
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: 舌の縛り
  rationale: δεσμόςの「縛るもの、束縛」という具体的な比喩を保ち、臨床的な「言語障害」へ置き換えすぎないようにした。
- source_word: ἐλάλει
  choice: 話した
  rationale: 未完了過去形だが、いやしの結果として実際に話すようになったことを、文脈に即した自然な日本語で表した。
- source_word: ὀρθῶς
  choice: はっきりと
  rationale: この文脈では、正しく明瞭に発話できたことを表す。「正しく」だけでは道徳的・文法的な正しさと誤解されやすいため、「はっきりと」とした。
theological_decisions:
- issue: 発話のいやしを表す句を、字義的な比喩として残すか、障害の除去と説明的に訳すか
  choice: 「舌の縛りが解けて」として比喩を保つ
  alternative: 「言葉の障害が取り除かれ」または「舌が自由になり」
  rationale: 本文は奇跡的ないやしを述べるが、臨床用語ではなく、舌を拘束していたものが解けるという具体的な比喩を用いる。その緊張と描写を保ち、必要な説明は脚注に置いた。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、「耳が開かれ」「舌の縛りが解ける」という原文の身体的・比喩的な描写を保った。文末は物語叙述として簡潔にまとめた。
