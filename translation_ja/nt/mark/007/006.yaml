reference: Mark 7:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: ja
  text: 'しかし、イエスは彼らに言われた。「イザヤは、偽善者であるあなたがたについて、的確に預言した。こう書かれている。


    『この民は唇でわたしを敬うが、


    その心はわたしから遠く離れている。』」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  choice: そこでイエスは彼らに言われた
  rationale: δὲの穏やかな転換を「そこで」で表し、日本語では主語を明示して文脈上の話者を明確にした。「言われた」は福音書にふさわしい自然で敬意ある叙述。
- source_word: Καλῶς
  choice: まことによく
  rationale: 預言が聞き手に的確に当てはまるという評価を保ちつつ、「正しく」などに限定しすぎない表現とした。
- source_word: ἐπροφήτευσεν
  choice: 預言した
  rationale: 預言者イザヤによる発言であることを直接かつ標準的に表す。
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: あなたがた偽善者について
  rationale: τῶν ὑποκριτῶνがὑμῶνと同格で聞き手を直接指す構造を保ち、非難の強さを弱めない。
- source_word: ὡς γέγραπται ὅτι
  choice: こう書かれている
  rationale: 聖書引用を導入する定型句として、現代日本語で自然かつ簡潔に表した。
- source_word: Οὗτος ὁ λαὸς
  choice: この民
  rationale: 単数の集合名詞λαόςと預言的な語調を保つ。
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: 唇でわたしを敬う
  rationale: χείληの身体的比喩とτιμάωの「敬う」という意味を直接保持した。
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: その心は
  rationale: καρδίαの単数形と民全体の内面的態度を示す集合的表現を、日本語として自然な単数で保持した。
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: わたしから遠く離れている
  rationale: 距離の比喩を保ち、神との関係上の隔たりを説明的に限定せず表した。
theological_decisions:
- issue: イザヤ29章13節のことばを現在の聞き手に適用する直接的な非難
  choice: 「あなたがた偽善者について」「この民」と直接的に訳す
  alternative: 非難を一般化または婉曲化して訳す
  rationale: 本文はイエスがイザヤの預言を目の前の相手に明示的に適用しているため、その鋭さを保ち、追加の教理的説明は加えない。
- issue: 「唇」と「心」の対比
  choice: 外面的な敬意と内面の隔たりを示す比喩をそのまま保持する
  alternative: 「口先だけで敬うが、本心では離れている」と意味を解説して訳す
  rationale: 原文の身体的比喩と預言的表現を保ち、その神学的緊張を読者自身が受け取れるようにする。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用としての品位と預言的な強さを保った。「イエス」はギリシア語本文では代名詞だが、日本語で話者を明確にするため文脈に基づき補った。引用部は詩行として改行した。
