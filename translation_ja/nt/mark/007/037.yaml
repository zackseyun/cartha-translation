  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: ja
  text: 人々はこの上なく驚き[a]、こう言った。「この方は、何もかも見事になさった。耳の聞こえない人を聞こえるようにし、ものを言えない人を話せるようにされる[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「限度を超えるほど非常に驚き」。原文では強意の副詞によって驚きの大きさが強調されている。
    reason: lexical_alternative
  - marker: b
    text: イザヤ35:5–6を参照。そこでは神による回復の時に、耳の聞こえない人が聞き、ものを言えない人が喜び歌うと語られている。
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: この上なく
  rationale: 通常の程度をはるかに超える強い驚きを、誇張感を失わず自然な現代日本語で表す。
- source_word: ἐξεπλήσσοντο
  choice: 驚き
  rationale: 未完了過去が示す、人々が強い驚きの状態にあったことを、文脈に即した自然な叙述で表す。
- source_word: Καλῶς πάντα πεποίηκεν
  choice: 何もかも見事になさった
  rationale: πάνταの包括性と、καλῶςによる行為への高い評価を保つ。「見事に」は日本語として自然であり、イエスの働き全体への群衆の賛嘆を伝える。完了形は、成し遂げられた働きへの現在の評価として表した。
- source_word: τοὺς κωφοὺς ποιεῖ ἀκούειν
  choice: 耳の聞こえない人を聞こえるようにし
  rationale: ποιεῖ＋不定詞の使役的意味を明確にしつつ、名詞化した形容詞を人を指す自然で配慮ある日本語にした。
- source_word: ἀλάλους λαλεῖν
  choice: ものを言えない人を話せるようにされる
  rationale: ἄλαλοςの発話不能という意味とλαλεῖνの「話す」を明確に保ち、前半との並行も示す。
theological_decisions:
- issue: 「何もかも見事になさった」と創造物語を思わせる表現との響き
  choice: 本文では群衆の率直な評価として自然に訳し、創造物語への連想を明示しない。
  alternative: 「すべてを良くなさった」と形式的に訳し、創造物語的な響きをより強く残す。
  rationale: ギリシア語は聖書的な響きを持ちうるが、特定の引用を明示してはいないため、本文で解釈を確定しない。
- issue: イザヤ35章5–6節との関連
  choice: 耳の聞こえない人が聞き、ものを言えない人が話すという対応を本文にそのまま保ち、脚注で関連箇所を示す。
  alternative: 本文中で預言の成就であることを明示する。
  rationale: 語句の対応は強いが、この節自体は明示的に引用や成就を宣言していないため、本文に説明を加えない。
translation_notes:
  register: 明瞭で現代的ながら、群衆の強い賛嘆にふさわしい品位を保った。「この方」「なさった」「される」で敬意ある発話として整えたが、本文にない教理的称号は加えていない。障害を表す語は、簡潔さよりも現代日本語での明瞭さと人への配慮を優先し、「耳の聞こえない人」「ものを言えない人」とした。
