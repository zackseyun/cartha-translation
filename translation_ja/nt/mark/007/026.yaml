  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: ja
  text: この女はギリシア人[a]で、シリア・フェニキア系の出身[b]であった。そして、娘から悪霊を追い出すよう、イエスに願い続けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「異邦人」。原文は「ギリシア人」であり、この文脈では、ギリシア人であることとともに非ユダヤ人であることを示す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳「出自においてシリア・フェニキア人」。すなわち、シリア・フェニキア系の出身であった。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: ギリシア人
  rationale: 語の直接的な意味を保つ。文脈上は非ユダヤ人という含みもあるが、本文では文化的・民族的呼称を一般化せず、「ギリシア人」とした。
- source_word: Συροφοινίκισσα τῷ γένει
  choice: 生まれはシリア・フェニキア人
  rationale: τῷ γένειが示す出自・系統を、現代日本語で自然に表した。「人種」という現代的で生物学的に響きやすい語は避けた。
- source_word: ἠρώτα
  choice: 願い続けた
  rationale: 未完了過去形が示す継続的または反復的な願いを表す。単に「願った」とするより相をよく伝え、「懇願した」ほど感情の強さを付加しない。
- source_word: ἵνα ... ἐκβάλῃ
  choice: 追い出してくださるよう
  rationale: 依頼の内容を自然な日本語で示し、ἐκβάλλωの排除する動きを保った。敬語は、イエスに向けた願いとして日本語の文脈に必要な対人関係を自然に表す。
- source_word: τὸ δαιμόνιον
  choice: 悪霊
  rationale: 日本語の聖書・一般語として理解しやすく、本文の超自然的存在への言及を弱めずに表す。周辺文脈の別表現を機械的に持ち込んだものではない。
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: 娘から
  rationale: ἐκの起点・内部からの離脱を、日本語の悪霊追放の文脈で自然な「娘から」で表した。
- source_word: δὲ ... καὶ
  choice: この女は…であった。そして
  rationale: δέの軽い叙述上の移行を、日本語では不必要な「さて」などを加えず主題提示で表し、καίは次文の「そして」で明示した。
theological_decisions:
- issue: 女の民族的・文化的な同定
  choice: 「ギリシア人」と「生まれはシリア・フェニキア人」の二つの記述をともに残す。
  alternative: 「異邦人で、シリア・フェニキア出身」とする。
  rationale: 原文が示す文化的・宗教的背景と民族的・地理的出自の二層を一つにまとめず、物語の社会的・歴史的な具体性を保つ。
- issue: 娘の苦しみの性質
  choice: 「悪霊を追い出す」と訳す。
  alternative: 「邪悪な霊を取り除く」と意訳する。
  rationale: δαιμόνιονとἐκβάλλωを直接反映し、本文の超自然的主張を心理的・比喩的な現象へ置き換えない。
- issue: 継続する依頼
  choice: 「願い続けた」とする。
  alternative: 「願った」とする。
  rationale: 未完了過去形の継続・反復の含みを保ちつつ、本文以上の感情的切迫を加えない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。民族呼称は原文の二重の記述を維持し、「人種」のように現代では誤解を招きやすい語を避けた。「イエス」は代名詞αὐτόνの指示対象を文脈に即して明示した。
