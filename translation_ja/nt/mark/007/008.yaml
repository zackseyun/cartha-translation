  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: ja
  text: 神の戒めを捨てて、人間[a]の言い伝えを固く守っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人間」は、男性だけでなく人間一般を指す。原文では、神に由来するものと人間に由来するものとが対照されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες（ἀφίημι）
  choice: 捨てて
  rationale: アオリスト能動分詞。神の戒めを脇へ置く行為を簡潔かつ自然に表す。「放棄して」ほど解釈的に強めず、主動詞との緊密な関係も保つ。
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: 神の戒め
  rationale: ἐντολήの宗教的・規範的な響きを「戒め」で保ち、属格を神に由来する戒めとして自然に表す。
- source_word: κρατεῖτε
  choice: 固く守っています
  rationale: ここでのκρατέωは単に従うことではなく、しっかり保持して固執することを表す。「固く」によりその強さを伝え、二人称複数への直接的な叱責を丁寧体で自然に表す。
- source_word: τὴν παράδοσιν
  choice: 言い伝え
  rationale: 受け継がれた慣行・伝承を指すπαράδοσιςを、現代日本語で理解しやすく文脈に適した語で表す。「伝統」も可能だが、ここでは宗教的に伝承された規定という意味が伝わりやすい。
- source_word: τῶν ἀνθρώπων
  choice: 人間の
  rationale: ἄνθρωποςの複数属格は男性だけでなく人間一般を指し、神に由来するものとの対照をなす。「人々の」よりも神と人間との対比が明確になる。
theological_decisions:
- issue: 神の戒めと人間の言い伝えとの対照
  choice: 「神の戒め」と「人間の言い伝え」を明確に対置する。
  alternative: 「人々の伝統」とする。
  rationale: イエスの叱責の焦点は、神からの戒めを捨てて人間由来の伝承に固執することにある。この鋭い対照を保つ一方、あらゆる伝統一般への否定にまで意味を広げない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。直前から続く直接的な叱責として丁寧体を用い、「捨てて」と「固く守っています」の対照を際立たせた。
