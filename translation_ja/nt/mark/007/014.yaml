  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: ja
  text: それからイエスは、再び群衆を呼び寄せて言われた。「皆、わたしの言うことを聞いて、理解しなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せて
  rationale: 群衆を自分のもとに招き集める動作を、自然で明確な現代日本語で表した。
- source_word: πάλιν
  choice: 再び
  rationale: 本文に明示された反復を保持した。
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了形は発話場面の進行・開始を描くが、日本語で「言っておられた」とすると反復・継続を過度に強調しやすいため、自然な物語表現とした。敬語はイエスへの通常の叙述上の敬意を示す。
- source_word: Ἀκούσατέ μου πάντες
  choice: 皆、わたしの言うことを聞いて
  rationale: πάντεςを呼びかけの「皆」で保ち、属格 μουを日本語として自然な「わたしの言うこと」として示した。
- source_word: σύνετε
  choice: 理解しなさい
  rationale: 単に音を聞くだけでなく、意味を悟るよう求める命令を明確に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある口調。命令は強さを保ちつつ、不自然に古風な表現を避けた。
