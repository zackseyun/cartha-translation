    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: 内側
  rationale: 人を汚すものが外からではなく内から生じるという文脈上の対比を保つため、内的な源を示す語として訳した。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 直前の発言の理由を説明する接続関係を、現代日本語で自然に示した。
- source_word: καρδίας
  choice: 心
  rationale: 思考、意志、道徳性の中心を表す聖書的な比喩を、解釈的に言い換えず保持した。
- source_word: ἀνθρώπων
  choice: 人々
  rationale: 文法上は男性複数形だが、ここでは人間一般を指すため、性別を限定しない自然な日本語とした。
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: 邪悪な考え
  rationale: 内面の思考や企てを表す名詞と、その道徳的な悪を示す形容詞の意味を簡潔に表した。
- source_word: ἐκπορεύονται
  choice: 出て来る
  rationale: 心の中から外へ現れるという原文の動きを保ちつつ、読みやすい現代語にした。
- source_word: πορνεῖαι
  choice: 淫らな行い
  rationale: 不正な性的行為を広く指す複数名詞であり、一つの特定行為に狭めず、行為性も伝わる表現とした。
- source_word: κλοπαί
  choice: 盗み
  rationale: 盗む行為を指す複数名詞を、悪徳表で自然な日本語の名詞として訳した。
- source_word: φόνοι
  choice: 殺人
  rationale: 単なる殺害一般ではなく、不法で道徳的に非難される殺害を示す語義を保った。
theological_decisions:
- issue: ἀνθρώπωνが一般的な人間を指すこと
  choice: 「人々」と訳す
  alternative: 「男たち」または「人間」
  rationale: この男性複数形は性別を男性に限定せず、人間一般を指す。日本語では「人々」が意味と複数性を自然に伝える。
- issue: πορνεῖαιの範囲と複数性
  choice: 「淫らな行い」と訳し、注で語義を補う
  alternative: 「性的不道徳」または「姦淫」
  rationale: 原語は不正な性的行為を広く指し、特定の一種類だけに限定されない。日本語では複数形を直接表示しにくいため、行為を示す表現と注でその広がりを伝えた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「内側、すなわち人々の心から」によって原文の反復的な源泉表現を残した。節は悪徳表の途中で終わるため、原文どおり末尾に読点を置いた。
