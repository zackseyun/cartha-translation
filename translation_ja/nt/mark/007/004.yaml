source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: ja
  text: また、市場から戻ると、身を洗わなければ[a]食事をしない。このほかにも、受け継いで守っていることが数多くある。杯、水差し、銅の器、そして寝椅子[b]の洗いなどである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「身を浸さなければ」。ギリシア語は、しばしば「洗礼を施す」と訳される動詞の一形態だが、ここでは清浄の慣習における儀礼的な洗浄を指す。
    reason: lexical_alternative
  - marker: b
    text: 「そして寝椅子」を含まない写本もある。
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: 市場
  rationale: 公共の市場や広場を指す語であり、文脈上は人々の集まる市場を意味する。現代日本語では「市場」が簡潔で自然である。
- source_word: βαπτίσωνται
  choice: 身を洗う
  rationale: 中動態の形を反映して洗う対象が本人であることを示した。ここではキリスト教の洗礼ではなく、清浄規定に関わる洗浄を指すため、「洗礼を受ける」とはしない。浸すという含みの可能性は脚注に残した。
- source_word: παρέλαβον κρατεῖν
  choice: 受け継いで守っている
  rationale: παρέλαβονの「受け取った」とκρατεῖνの「固く守る」の両面を、伝承を受領して遵守するという自然な日本語で表した。「伝えている」とすると伝達する側へ焦点が移る。
- source_word: βαπτισμοὺς
  choice: 洗い清めること
  rationale: 器具に施す儀礼的な洗浄を指す。単なる日常的洗浄ともキリスト教の洗礼とも誤解されにくい表現を選んだ。
- source_word: ξεστῶν
  choice: 水差し
  rationale: 液体を入れる壺ないし容器を指す語であり、食器類の列挙では「水差し」が具体的で分かりやすい。
- source_word: χαλκίων
  choice: 銅の器
  rationale: 銅または銅合金で作られた器物を指す。「青銅の器」と限定せず、語根に即した広めの表現とした。
- source_word: κλινῶν
  choice: 食事用の寝椅子
  rationale: κλίνηは寝床または長椅子を意味するが、この清めと食事の文脈では、横になって食事をするための寝椅子と理解するのが自然である。本文採用の有無には写本差があるため脚注を付した。
- source_word: ἄλλα πολλά
  choice: このほかにも…ことが数多くある
  rationale: 原文の広い表現を保ち、「伝承」や「慣習」と明示的に限定しなかった。
theological_decisions:
- issue: 清浄規定の文脈における βαπτίσωνται / βαπτισμοὺς の意味
  choice: 「身を洗う」／「洗い清めること」と訳す。
  alternative: 「身を浸す」／「浸すこと」、または「洗礼を受ける」／「洗礼」
  rationale: この節はファリサイ派の清浄慣習を扱っており、キリスト教の洗礼を述べてはいない。「洗う」を軸にすることで文脈を明確にしつつ、動詞が本来持ち得る「浸す」という具体的な含みは脚注に残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。長いギリシア語の一文は、内容のつながりを保ちながら三文に分けて読みやすくした。「食事用の寝椅子」は古代の食事習慣を現代の読者に伝えるための最小限の明示化である。
