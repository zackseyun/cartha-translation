id: MRK.7.29
reference: Mark 7:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: ja
  text: そこでイエスは彼女に言われた。「そのことばのゆえに、行きなさい。悪霊はあなたの娘から出て行った。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: そこでイエスは彼女に言われた
  rationale: καίによる物語の継続を、現代日本語で自然な「そこで」とした。主語は文脈上イエスであり、日本語では補うことで話者を明確にできる。敬意ある聖書文体として「言われた」を用いた。
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: そのことばのゆえに
  rationale: διά＋対格の理由・根拠を「〜のゆえに」で保持し、λόγοςの単数形と直前の女性の返答を指す性質を「ことば」で表した。「そのように言ったので」よりも原文の表現を保つ。
- source_word: ὕπαγε
  choice: 行きなさい
  rationale: この現在命令形は女性を帰途につかせる表現であり、簡潔で自然な命令として訳した。
- source_word: ἐξελήλυθεν
  choice: 出て行った
  rationale: ἐξέρχομαιの退出という空間的イメージを保った。ギリシア語の完了形は、すでに退出し、その結果が続いていることを示すが、日本語では文脈上「出て行った」で自然に伝わる。
- source_word: ἐκ τῆς θυγατρός σου
  choice: あなたの娘から
  rationale: ἐκが示す退出元を「〜から」で明確に表した。
- source_word: τὸ δαιμόνιον
  choice: 悪霊
  rationale: δαιμόνιονが指す人格的な超自然的存在を、現代日本語の聖書語として広く理解される「悪霊」で表した。「汚れた霊」は別のギリシア語表現を持ち込むため避けた。
theological_decisions:
- issue: 悪霊追放の超自然的主張を弱めずに訳すこと
  choice: 悪霊はあなたの娘から出て行った
  alternative: 悪い力はあなたの娘を離れた
  rationale: 原文はδαιμόνιονを明示し、それが娘から退出したと述べる。病気や比喩的な悪影響へと言い換えず、原文の人格的な悪霊への言及を保持した。
- issue: 女性のことばと娘の解放との関係
  choice: そのことばのゆえに
  alternative: そのように言ったので
  rationale: διά＋対格が示す理由または根拠をそのまま示し、それが功績・信仰・機知のいずれを意味するかを訳文で限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ことば」は直前の女性の返答とのつながりを保ち、「のゆえに」はやや改まった表現だが、因果・根拠を簡潔に示す。脚注を必要とするほど重要な異読・語義上の曖昧さはないと判断した。
