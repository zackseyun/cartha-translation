  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: ja
  text: さて、エルサレムから来たファリサイ派の人々と律法学者たちのうちの数人が、イエスのもとに集まった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: 物語を次の場面へ進める接続詞。日本語では「そして」よりも「さて」が自然に場面転換を示す。
- source_word: συνάγονται πρὸς αὐτὸν
  choice: イエスのもとに集まった
  rationale: 「彼のほうへ集まる」という動きと関係を自然な日本語で表す。ギリシア語は歴史的現在だが、本文の物語叙述として自然な過去形を用いた。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 当時のユダヤ教内の集団名であることが一般読者にも分かる標準的な表現。
- source_word: τινες τῶν γραμματέων
  choice: 律法学者たちのうちの数人
  rationale: τινες と部分属格の組み合わせを保ち、律法学者全員ではなく、その一部であることを明示する。
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: エルサレムから来た
  rationale: 分詞が主動詞に先行する行為を示すことを、自然な連体修飾で表した。
