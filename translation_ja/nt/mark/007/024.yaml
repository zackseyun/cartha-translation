source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: ja
  text: イエスはそこから立って、ティルス地方[a]へ向かわれた。そして、ある家に入ると、だれにも知られたくないと思っておられた[b]が、隠れていることはできなかった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ティルスの領域へ」。ギリシア語は、境界線だけでなく、ティルスに属する地域や地方を指すことができる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「だれにも知られたくなかった」。ギリシア語では知られる内容が明示されておらず、イエスがそこにいること、またはその居場所を指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「人目を逃れることはできなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: そこを
  rationale: Ἐκεῖθενは直前の場所からの移動を示す。δέは軽い接続であり、日本語では明示せず自然な叙述とした。
- source_word: ἀναστὰς
  choice: 立ち
  rationale: 物語を進めるアオリスト分詞で、実際に立ち上がって次の行動に移るニュアンスを簡潔に表す。
- source_word: ἀπῆλθεν
  choice: 行かれた
  rationale: その場を離れて別の場所へ向かう意味を文脈上自然に表現した。主語イエスへの敬意を、現代日本語として過度にならない尊敬表現で示した。
- source_word: εἰς τὰ ὅρια Τύρου
  choice: ティルス地方へ
  rationale: ὅριαは境界線だけでなく領域・地方も意味し、ここではティルスに属する地域を指すと理解するのが自然である。
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: そして、ある家に入ると
  rationale: 分詞の時間的・継起的関係を自然に示し、冠詞のないοἰκίανを「ある家」とした。
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: だれにも知られたくないと思っておられた
  rationale: ギリシア語では「何を」知られたくないのかが明示されず、イエスの滞在または居場所が含意される。日本語でも対象を限定せず曖昧さを保った。
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: が、隠れていることはできなかった
  rationale: λανθάνωの「人目につかない、気づかれずにいる」という意味を平明な現代日本語で表し、意図との対照を「が」で示した。
