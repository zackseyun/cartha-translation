  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: ja
  text: イエスは彼女に言っておられた。「まず、子どもたちが満腹になるまで食べさせなさい。子どもたちのパンを取って、小さな犬たち[a]に投げ与えるのはよくない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家で飼われている犬たち」、または単に「犬たち」とも訳せる。ギリシア語は指小形を用いており、小さな犬または家庭内の犬を思わせるが、必ずしも年齢上の「子犬」を意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っておられた
  rationale: 未完了時制の継続的な側面を保ちつつ、文脈上のイエスへの敬意を自然な現代日本語で表した。
- source_word: Ἄφες
  choice: 食べさせなさい
  rationale: ἀφίημι の許容を表す命令の力は、後続する受動不定詞と合わせて「食べさせなさい」と自然に表現した。
- source_word: πρῶτον
  choice: まず
  rationale: 子どもたちへの優先を示しつつ、その後の他者への可能性を排除しない時間的・順序的含意を保持する。
- source_word: χορτασθῆναι
  choice: 十分食べさせなさい
  rationale: 満腹になるまで養われるという語感を、食卓とパンの比喩に合う自然な日本語で表した。
- source_word: τὰ τέκνα
  choice: 子どもたち
  rationale: 性別や年齢を不必要に限定せず、家庭の比喩をそのまま保つ。
- source_word: καλόν ἐστιν
  choice: よくない
  rationale: καλός の「良い、ふさわしい」という幅を保つ簡潔な表現で、「正しくない」ほど道徳判断に限定しない。
- source_word: λαβεῖν
  choice: 取って
  rationale: 基本義をそのまま表し、文脈にない「取り上げる」などの強意を加えない。
- source_word: ἄρτον
  choice: パン
  rationale: 具体的な食卓のイメージを維持する直接的な対応語。
- source_word: κυναρίοις
  choice: 小犬たち
  rationale: 指小形の語感を見える形で残し、野犬よりも小型または家で飼われる犬を想起させる。ただし「子犬」として年齢まで断定しない。
- source_word: βαλεῖν
  choice: 投げてやる
  rationale: βάλλω の具体的な「投げる」を保ち、与える相手を示す日本語として自然にした。
theological_decisions:
- issue: 「子どもたち」と「小犬たち」の比喩の指示対象
  choice: 本文では比喩をそのまま保持する。
  alternative: 「子どもたち」をイスラエル／ユダヤ人、「小犬たち」を異邦人と説明的に訳す。
  rationale: ギリシア語本文は指示対象を明示せず家庭の比喩として語るため、解釈を本文に織り込まず、文脈から生じる緊張を残した。
- issue: πρῶτον の順序的含意
  choice: 「まず」を明記する。
  alternative: 日本語の滑らかさを優先して省略する。
  rationale: 子どもたちへの優先を示す一方で、他者の恒久的排除までは意味しないという物語的・神学的緊張を保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「言っておられた」により未完了時制を反映しながら敬意を示した。比喩の鋭さを過度に和らげず、同時に κυνάριον の指小形も注記を伴って可視化した。
