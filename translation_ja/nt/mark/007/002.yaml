  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: ja
  text: そして、イエスの弟子たちのうち何人かが、汚れた手、すなわち洗っていない手でパンを食べているのを、彼らは見た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: 彼らは見た
  rationale: アオリスト分詞だが、文脈上の主語であるファリサイ派の人々と律法学者たちを補い、現代日本語として自然な定動詞で表した。観察したという意味を保つ。
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: イエスの弟子たちのうち何人かが
  rationale: τινάς と部分属格を自然な日本語で表した。αὐτοῦ は日本語で指示対象を明確にするため「イエスの」とした。
- source_word: ὅτι
  choice: 〜のを
  rationale: 見た内容を導く接続詞であり、日本語では引用節を「〜のを見た」とするのが自然である。理由を表す「ので」とはしない。
- source_word: κοιναῖς χερσίν
  choice: 汚れた手で
  rationale: κοινός の字義は「共通の、普通の」だが、ここではユダヤ教の儀礼的な汚れを指す。「普通の手」では現代日本語で意味が伝わらないため、文脈上の意味を明瞭に表した。直後の著者自身の説明が、衛生上の汚れだけでなく洗浄儀礼に関わる用法を示す。
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: すなわち洗っていない手で
  rationale: マルコによる説明をそのまま明瞭に表した。「手で」を繰り返して、先行表現との同格関係を分かりやすくした。
- source_word: ἐσθίουσιν
  choice: 食べている
  rationale: 観察時に進行中の行為として、物語中の現在形を日本語の継続表現で自然に訳した。
- source_word: τοὺς ἄρτους
  choice: パンを
  rationale: 複数形 ἄρτους はここでは食物としてのパンを指すため、日本語では個々の「パン々」や「パンの塊」ではなく、自然な総称として単数形相当の「パン」とした。
theological_decisions:
- issue: κοινός に含まれる清浄規定上の意味
  choice: 本文では「汚れた手」と訳し、直後の「洗っていない手」という著者の説明を保持する。
  alternative: 「普通の手」「清くない手」
  rationale: 「普通の手」は語源的な響きを残すが、日本語では儀礼的汚れを伝えない。「清くない手」は儀礼性を示し得るもののやや不自然である。「汚れた手」は自然で、ここで問題となる儀礼上の状態を表す。ただし単なる物理的な汚れと断定せず、マルコ自身の説明によって意味を限定する。
translation_notes:
  register: 明快で現代的な標準日本語を用いた。節末の原文のダッシュは文が次節へ続く構造を示すが、日本語版ではこの一節を独立して読めるよう句点とした。儀礼的清浄に関する専門語を避けつつ、意味を平板化しない表現を選んだ。
