id: MRK.7.13
reference: Mark 7:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: ja
  text: こうしてあなたがたは、自分たちが伝えてきた言い伝えによって、神のことばを無効にしています[a]。また、このようなことをほかにも数多く行っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神のことばを効力のないものにしています」または「神のことばを取り消しています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: 無効にしています
  rationale: 神のことばの権威や効力を失わせるという非難を明確に表し、現在分詞が前節から続ける行為を自然な現代日本語で示す。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: λόγοςを直接的に「ことば」とし、人の言い伝えとの対照を保つ。
- source_word: τῇ παραδόσει ὑμῶν
  choice: あなたがたは、自分たちが……言い伝えによって
  rationale: 与格の手段的用法を「によって」で表し、ὑμῶνは日本語として自然になるよう主語と連動させて「自分たちが」とした。
- source_word: παραδόσει
  choice: 言い伝え
  rationale: この文脈では受け継がれた慣行・教えを指す。「伝統」よりも、παραδίδωμιとの語義的なつながりを日本語で自然に示しやすい。
- source_word: ᾗ παρεδώκατε
  choice: 自分たちが伝えてきた
  rationale: 関係節が、その言い伝えを彼ら自身が伝承してきたものとして限定することを表す。完了的・継続的な含みを「伝えてきた」で示す。
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: このようなことをほかにも数多く
  rationale: 原文の重なりを不自然に逐語化せず、「このような」「ほかにも」「数多く」により類似性と多さの強調を保つ。
- source_word: ποιεῖτε
  choice: 行っています
  rationale: 現在形が表す継続的・習慣的な行為を自然に示す。
theological_decisions:
- issue: イエスが非難する「言い伝え」の性質
  choice: 原文どおり「自分たちが伝えてきた言い伝え」とし、神のことばとの対立を文脈に示させる。
  alternative: 「人間の言い伝え」と明示する。
  rationale: この節には「人間の」に当たる語がないため補わず、特定の言い伝えが神のことばを無効にしているという緊張をそのまま保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「言い伝え」と「伝えてきた」によって原文のπαράδοσις／παραδίδωμιの語の響き合いを可能な範囲で再現した。
