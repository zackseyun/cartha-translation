  source_fidelity: 原文の分詞ἀκυροῦντεςを「無効にしています」として前節から続く非難の現在的・継続的な性格を自然に表している。「神のことば」「自分たちが伝えてきた言い伝えによって」はτὸν λόγον τοῦ θεοῦ、τῇ παραδόσει ὑμῶν ᾗ παρεδώκατεを過不足なく反映する。「このようなことをほかにも数多く行っています」も、παρόμοια τοιαῦτα πολλὰ ποιεῖτεの類似性、多さ、習慣的行為を適切に表す。
