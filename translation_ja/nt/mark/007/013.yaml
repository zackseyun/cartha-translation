  terminology: 「神のことば」はλόγοςの文脈上適切であり、「言い伝え」はこの節のπαράδοσιςを中立的に示す。原文にない「人間の」を補わず、特定の伝承が神のことばを無効にするという本文の緊張を維持している。脚注[a]はἀκυροῦντεςに対応し、位置・内容とも適切である。
