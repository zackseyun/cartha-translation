  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: ja
  text: そしてイエスは、人目を避けて、その人を群衆から連れ出し、指をその人の両耳に入れた。それから、唾を吐き[b]、その人の舌に触れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ギリシア語本文は「唾を吐き、その人の舌に触れた」と述べるだけで、イエスがその人の舌に唾を付けたとは明記していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν
  choice: その人だけを群衆から連れ出し
  rationale: ἀπολαμβάνομαι の分離の意味と、κατ’ ἰδίαν の「人目を離れて／個別に」という意味を、自然な日本語で一体として表した。「その人だけを」により、群衆から離して個別にしたことを示す。
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: 両耳に指を入れた
  rationale: 直訳的な「彼の指を彼の耳に」は日本語では指示対象が曖昧になるため、文脈に即して所有代名詞を省いた。複数形の ὦτα は自然な日本語の「両耳」で表現した。
- source_word: πτύσας
  choice: それから、唾を吐き
  rationale: 先行または付随する動作を示すアオリスト分詞を自然な継起として訳した。唾をどこに付けたかは原文に明記されていないため補わない。
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: その人の舌に触れた
  rationale: ἅπτομαι と属格目的語を「触れる」と訳し、αὐτοῦ の指示対象が癒やされる人であることを明確にした。
theological_decisions:
- issue: イエスの癒やしの動作、とりわけ唾の扱い
  choice: 唾を吐いたことと舌に触れたことを順に述べ、唾を舌に付けたとは明記しない
  alternative: 「唾を付けて、その人の舌に触れた」など、唾液を舌に用いたと解釈して訳す
  rationale: ギリシア語は πτύσας（唾を吐いて）と ἥψατο τῆς γλώσσης（舌に触れた）を述べるが、唾を舌に付けたとは明示しない。動作の意味や治癒の仕組みも説明せず、本文の含みを保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「イエス」は直前文脈で主語が明らかでも、日本語で動作主を明確にするため補った。短い動作を文に分け、順序を読み取りやすくした。
