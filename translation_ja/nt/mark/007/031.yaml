source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: ja
  text: それから、イエスは再び、ティルス地方を出てシドンを通り[a]、デカポリス地方のただ中を通って[b]、ガリラヤ湖に来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シドンを経由して」とも訳せる。ギリシア語の表現は、シドンを通る、またはシドン経由で進むことを表しうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近く「デカポリスの諸地域の間を通って」とも訳せる。ギリシア語の表現には「間に／ただ中に」という意味があり、ここに記された経路は地理的に理解しにくい。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: 物語の中で移動が改めて始まることを、簡潔で自然な現代日本語で示す。
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: ティルス地方を出て
  rationale: アオリスト分詞が主動詞に先立つ動作を表すため、「出て」と順序を明確にした。ὅριαは境界線そのものではなく領域を指すので「地方」とした。
- source_word: ἦλθεν
  choice: 来られた
  rationale: ἔρχομαιの基本的な移動表現を保ちつつ、文脈上の主語であるイエスに対する現代日本語の聖書文体として自然な敬意を示した。
- source_word: διὰ Σιδῶνος
  choice: シドンを通り
  rationale: 属格を伴うδιάが示す、ある場所を通過する、または経由するという経路の意味を保った。
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: ガリラヤ湖に
  rationale: θάλασσαは字義的には「海」だが、日本語で定着した地名「ガリラヤ湖」を用いた。εἰςの到達点も「に」で明示した。
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: デカポリス地方のただ中を通って
  rationale: 珍しい空間表現ἀνὰ μέσονの「間・中央・ただ中」という力を平板化せず、移動経路として自然に表した。ὅριαは領域の意味で「地方」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地名は日本語聖書で広く定着した「ティルス」「シドン」「デカポリス」「ガリラヤ湖」を採用した。主語はギリシア語では省略されているが、日本語で節を単独に読んでも明確になるよう、文脈上の主語「イエス」を補った。
