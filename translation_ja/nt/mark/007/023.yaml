  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: ja
  text: これらの悪いものはすべて、内から出て来て、人を汚す。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: これらの悪いものはすべて
  rationale: 直前に列挙された数々の悪を具体的に受ける表現として、πάνταとταῦταの包括性・指示性を保ちつつ、現代日本語として自然にした。
- source_word: ἔσωθεν
  choice: 内から
  rationale: 人の外側ではなく内側を起源とするという、周辺文脈の対比を簡潔に保持する。
- source_word: ἐκπορεύεται
  choice: 出て来て
  rationale: 内から外へ現れる動きを自然な日本語で表す。ギリシア語では中性複数主語に対して動詞が単数形となっているが、日本語では数を明示する必要がない。
- source_word: κοινοῖ
  choice: 汚す
  rationale: 本段落の清浄・汚れの文脈における、宗教的かつ道徳的な汚れを簡潔に表す。「汚れたものにする」より自然である。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: ここでἄνθρωποςは特定の男性ではなく人一般を指す。日本語の「人」は単数・包括的な一般称として自然で、原文の意味を過不足なく伝える。
theological_decisions:
- issue: τὸν ἄνθρωπονが人間の汚れについて一般的に述べること
  choice: 人
  alternative: その人／人間
  rationale: 定冠詞付き単数形だが、文脈上は代表的・総称的用法である。日本語では「人」がこの一般性を自然に表し、性別を限定しない原意にも適う。「その人」は特定の人物を指すように響き、「人間」はやや抽象的である。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。前節から続くイエスの発言として閉じかぎ括弧を付した。清浄規定をめぐる文脈とのつながりを保ちながら、過度に専門的・教派的な語を避けた。
