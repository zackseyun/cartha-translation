  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: ja
  text: 彼女は家に帰ると、子どもが寝床に横たわっていて、悪霊が出て行っているのを見いだした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: 女が家に帰ってみると
  rationale: アオリスト分詞が主動詞に先立つ動作を表すため、自然な日本語で時間的な順序を示した。「彼女の家へ行く」は文脈上「家に帰る」とするのが明瞭であり、「みると」は続く εὗρεν（見いだした）につながる発見の場面を自然に表す。
- source_word: εὗρεν
  choice: みると
  rationale: ここでは帰宅して目の前の状態を見いだしたことを表すため、日本語の物語表現として「帰ってみると」に組み込んだ。
- source_word: παιδίον
  choice: 子ども
  rationale: 語そのものは性別を明示しないので、文脈上は娘であるものの、原文の語彙に沿って「子ども」とした。
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: 寝床に横たわっており
  rationale: βεβλημένον は完了受動分詞だが、この構文では寝床の上に置かれた結果として横たわっている状態を表す。暴力的に「投げ出された」とは限定せず、自然な結果状態として訳した。κλίνη はここでは「寝床」とした。
- source_word: δαιμόνιον
  choice: 悪霊
  rationale: 日本語聖書として一般読者に明瞭な語を用いた。直訳的な「悪鬼」より自然であり、文脈の超自然的な存在を明確にする。
- source_word: ἐξεληλυθός
  choice: 出て行っていた
  rationale: ἐξέρχομαι の完了分詞であり、出て行く行為が完了し、その結果として不在である状態を示す。「出て行っていた」はその完了結果を自然に保つ。
theological_decisions:
- issue: 悪霊が去った結果の描写
  choice: 悪霊は出て行っていた
  alternative: 悪霊はいなくなっていた
  rationale: 原文は単なる不在ではなく「出て行った」という動作を明示するため、それを保った。同時に完了形が示す、すでに退出して不在となっている結果状態も表した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、物語本文にふさわしい落ち着いた文体を採用した。「帰ってみると」によって分詞と主動詞の関係を自然に表し、原文の二つの結果状態を「横たわっており」「出て行っていた」と並べた。
