  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: ja
  text: しかし彼女は答えて言った。「主よ[a]、食卓の下の小犬[b]も、子どもたちのパンくずから食べます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「敬称」とも訳せる。ギリシア語のκύριεは、「主」という称号としても、相手への丁寧な呼びかけとしても用いられる。
    reason: alternative_reading
  - marker: b
    text: ギリシア語は指小形で、小さな犬、または家で飼われる犬を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει
  choice: 答えて言った
  rationale: アオリストと歴史的現在が連なる語りの表現を、自然な現代日本語の過去形で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの呼びかけとして「主」を本文に採用しつつ、敬称としての意味も脚注に残した。
- source_word: καὶ
  choice: も
  rationale: 小犬もまたパンくずにあずかる、という付加的な意味を自然に表した。
- source_word: κυνάρια
  choice: 小犬
  rationale: 指小形のニュアンスを保ち、一般的な「犬」よりも小型または家で飼われる犬を想起させる訳語とした。
- source_word: ὑποκάτω τῆς τραπέζης
  choice: 食卓の下
  rationale: 空間的関係を簡潔かつ自然に表した。
- source_word: ἐσθίουσιν
  choice: 食べます
  rationale: このたとえにおける習慣的・一般的な行為を現在形で表した。
- source_word: ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: 子どもたちのパンくずを
  rationale: ψιχίαの小さなくずという意味を「パンくず」で自然に表し、子どもたちとの属格関係を保持した。日本語では「食べる」の目的語として助詞「を」を用いた。
theological_decisions:
- issue: 女性がイエスをΚύριεと呼ぶ表現
  choice: 主よ
  alternative: 先生／旦那様
  rationale: κύριεは「主」という称号にも、丁寧な呼びかけにもなり得る。本文では伝統的かつ文脈上妥当な「主よ」を採用し、敬称として読める曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。女性の応答を導くδέは、直前の発言との対照を示す「しかし」とした。敬体は、女性がイエスに直接語る場面の丁寧さを自然に表すため用いた。
