  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: ja
  text: そして、天を仰いで[a]ため息をつき、その人に言った。「エッファタ。」すなわち、「開かれよ」という意味である。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エッファタ」はアラム語で、「開かれよ」という意味。
    reason: cultural_note
  - marker: b
    text: または「うめいた」。この動詞は、深いため息やうめきを表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: 天を仰いで
  rationale: 上方へ視線を向ける動作と、その向かう先である天を、自然で簡潔な現代日本語で表した。
- source_word: ἐστέναξεν
  choice: 深く息をつき
  rationale: στενάζωは「ため息をつく」と「うめく」の両方を表し得る。本文では過度に感情を限定せず、重い息遣いが伝わる表現を採用し、別訳を脚注に示した。
- source_word: λέγει αὐτῷ
  choice: その人に言われた
  rationale: 歴史的現在を日本語の物語として自然な過去表現にし、αὐτῷが癒やされる男性を指すことを明示した。イエスへの敬意を示す通常の文体として尊敬語を用いた。
- source_word: Εφφαθα
  choice: エッファタ
  rationale: マルコが保存したアラム語の発話を音写し、原文の質感を保った。意味は続く著者自身の説明で示す。
- source_word: Διανοίχθητι
  choice: 開かれよ
  rationale: アオリスト受動命令法単数の形を保つ、簡潔で荘重な命令表現とした。
theological_decisions:
- issue: αὐτῷの指示対象
  choice: その人に
  alternative: 耳や発話の機能に向けた命令として意訳する
  rationale: ギリシア語の与格は直前の男性を最も自然に指す。命令がその人の妨げられた機能に関わるとしても、本文では本人への呼びかけを保持した。
- issue: 「天」の意味合い
  choice: 天
  alternative: 空
  rationale: οὐρανόςには両義があるが、イエスが上を仰ぐ祈りに似た動作という文脈に適し、宗教的意味を不必要に狭めない「天」とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「言われた」「開かれよ」により語り口の荘重さを確保しつつ、文全体は普通の読者にも理解しやすくした。すべての脚注記号を対応箇所の本文中に配置した。
