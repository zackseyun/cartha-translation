  source_fidelity: 本文は概ねギリシア語に忠実である。ἀναβλέψας εἰς τὸν οὐρανόνは「天を仰いで」、ἐστέναξενは「ため息をつき」、λέγει αὐτῷは「その人に言った」とするのが自然である。エッファタに続くマルコ自身の説明も「すなわち、『開かれよ』という意味である」と訳せる。
  naturalness: 「深く息をつき」は意味として可能だが、本文の語に「深く」を加えるため、「ため息をつき」がより直接的で明瞭である。「これは、…という意味である」も不自然ではないが、「すなわち」を用いると原文のὅ ἐστινによく対応する。
  terminology: 「エッファタ」は日本語聖書で広く定着した音写であり適切である。「開かれよ」は受動命令の形を保つ。地の文の「言われた」は、原文には敬語の根拠がなく、現代標準語の叙述として「言った」に統一するのが望ましい。
  issues:
  - severity: low
    issue: 「深く息をつき」
    rationale: ἐστέναξενは「ため息をつく／うめく」を表すが、「深く」は原文で明示されない強調である。本文では「ため息をつき」とし、強いニュアンスの可能性は脚注で示すのが安全である。
  - severity: low
    issue: 「言われた」という尊敬語
    rationale: 原文のλέγειは通常の「言う」であり、本文の叙述に敬語を加える必要はない。明瞭な現代標準語として「言った」が中立的である。
  - severity: low
    issue: 脚注の配置と内容が英語監査記録と入れ替わっている
    rationale: 内容自体は両方有益だが、英語の監査記録では天を仰ぐ箇所にアラム語注、意味説明の箇所に「ため息／うめき」の語彙注が付されている。日本語でもこれに対応させると監査可能性が高い。
  revised_text: そして、天を仰いで[a]ため息をつき、その人に言った。「エッファタ。」すなわち、「開かれよ」という意味である。[b]
