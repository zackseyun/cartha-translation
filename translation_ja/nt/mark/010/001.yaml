  naturalness: 「そこを立って」は現代標準日本語では用いにくい。「そこを立ち去って」とするのが、分詞による先行動作と移動の文脈を自然に表す。「群衆が……集まって来た。イエスは……教えられた」と文を分ければ、原文の連続する叙述を因果関係なしに明瞭に再現できる。「彼らに教えられた」は現代日本語の格支配としても自然である。
  terminology: 「ユダヤ地方」「ヨルダン川」「群衆」は適切である。イエスへの自然な敬意を保つため「行かれた」「教えられた」を維持する。
