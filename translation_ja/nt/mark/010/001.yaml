  - severity: medium
    issue: 「集まって来たので」
    rationale: καίによる叙述の連結を、日本語訳が理由・結果の関係に変えている。群衆が集まった後に教えたことは示されるが、集まったことが教えの原因であるとは明示されない。
  - severity: low
    issue: 「彼らを教えられた」
    rationale: 意味は通じるが、現代標準日本語では人を教える場合は通常「彼らに教える」と言うため、格助詞を自然な形に整える。
