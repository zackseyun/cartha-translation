  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: ja
  text: イエスはそこを立ち去って、ユダヤ地方とヨルダン川の向こう側[a]へ行かれた。再び群衆がイエスのもとに集まって来た。イエスはいつものように、再び彼らに教えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「ヨルダン川の向こう側にあるユダヤ地方」。ギリシア語は、「ユダヤ地方」と「ヨルダン川の向こう側」を二つの地域として述べているとも、後者が前者を限定しているとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν ἀναστὰς
  choice: そこを立って
  rationale: 出発に先立って立ち上がる動作を表す分詞を、日本語で簡潔かつ自然に表現した。復活を意味するものではない。
- source_word: ἔρχεται
  choice: 行かれた
  rationale: ギリシア語は臨場感を与える歴史的現在だが、日本語の物語では過去形が自然である。前の場所から目的地へ移る文脈なので「来られた」ではなく「行かれた」とした。
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: ユダヤ地方
  rationale: ὅριαは境界線そのものだけでなく地域・領域を指し得るため、旅行の目的地として自然な訳を選んだ。
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: とヨルダン川の向こう側
  rationale: καίを並列として保ち、πέρανの地理的意味を明瞭に表した。同時に、全体を一つの地域と取る可能性は脚注に示した。
- source_word: συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν
  choice: 群衆が再びイエスのもとに集まって来た
  rationale: 動詞の字義には共に進む意味があるが、πρὸς αὐτόνを伴うこの文脈では、群衆がイエスのもとへ集まることを自然に表す。
- source_word: ὡς εἰώθει
  choice: いつものように
  rationale: 習慣的な行為を示す表現を、現代日本語で自然かつ簡潔に訳した。
- source_word: πάλιν ἐδίδασκεν αὐτούς
  choice: また彼らを教えられた
  rationale: 二度目のπάλινも保持し、未完了過去が文脈上示す反復的・習慣的な教えの働きを表した。
theological_decisions:
- issue: 歴史的現在 ἔρχεται
  choice: 日本語では過去形「行かれた」とした
  alternative: 歴史的現在を形式的に保って「行かれる」とする
  rationale: 時制の転換はマルコの語りの臨場感に関わるが、日本語では現在形にすると不自然になりやすい。出来事の時間関係を変えず、自然な物語文を優先した。
- issue: καὶ πέραν τοῦ Ἰορδάνου の地理的・統語的関係
  choice: 「ユダヤ地方とヨルダン川の向こう側」と並列的に訳した
  alternative: 「ヨルダン川の向こう側にあるユダヤ地方」と一つの地域として訳す
  rationale: ギリシア語の圧縮された構文は両方の理解を許す。本文では語順とκαίを反映し、別の係り受けは脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスへの敬意は日本語として自然な尊敬表現で示した。マルコ特有の二度の「再び／また」は残しつつ、文を適度に分けて読みやすくした。
