revisions:
- from: イエスはそこを立って、ユダヤ地方とヨルダン川の向こう側[a]へ行かれた。すると、群衆が再びイエスのもとに集まって来たので、イエスはいつものように、また彼らを教えられた。
  to: イエスはそこを立ち去って、ユダヤ地方とヨルダン川の向こう側[a]へ行かれた。再び群衆がイエスのもとに集まって来た。イエスはいつものように、再び彼らに教えられた。
  rationale: 移動の文脈におけるἀναστὰςを、復活の含意を持たず自然な日本語で示すため「そこを立ち去って」とした。原文のκαίの連続を因果関係へ変えないよう、「ので」を削除して文を分けた。地理句の係り受けの争点は本文で未決のまま保ち、脚注に代替理解を残した。
