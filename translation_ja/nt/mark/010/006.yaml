  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: ja
  text: しかし、創造の初めから、神は彼らを男と女に造られた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「男と女に彼らを造られた」とも訳せる。こちらはギリシア語の語順により近い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: しかし、創造の初めから
  rationale: ἀπόは時間的な起点、δέは直前の離婚についての譲歩との対比、κτίσεωςは創造を表すため、文脈に沿って自然に訳した。
- source_word: ἄρσεν καὶ θῆλυ
  choice: 男と女に
  rationale: 創世記引用における性の対語を保ち、「男性と女性」よりも簡潔で引用文として自然な表現にした。
- source_word: ἐποίησεν
  choice: 造られた
  rationale: ποιέωの基本義「造る」を保った。創世記の背景から「創造された」とも訳せるが、本文の動詞をκτίζωと同一視しない訳を採った。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 三人称複数の目的語を明示し、人類を男と女として造ったという原文の構造を保った。
- source_word: ἐποίησεν（黙示された主語）
  choice: 神は…造られた
  rationale: ギリシア語では三人称単数の主語が文脈上省略されている。日本語で神を指す代名詞を用いるより明瞭で自然なため、創世記引用から理解される主語を「神」と補った。
theological_decisions:
- issue: 創世記引用の性を表す語
  choice: 男と女
  alternative: 男と女の人／男性と女性
  rationale: ἄρσενとθῆλυの対を保ち、社会的役割や婚姻関係を本文以上に読み込まないため。
- issue: 省略された動詞の主語
  choice: 神は
  alternative: 主語を明示せず「彼らを男と女に造られた」
  rationale: 神が主語であることは創世記引用と文脈から明らかであり、現代日本語で誤解なく自然に読めるよう補った。
- issue: ποιέωの訳語
  choice: 造られた
  alternative: 創造された
  rationale: 創造の文脈は保ちつつ、本文が用いるποιέωの語義を直接反映し、κτίζωとの語彙上の違いを消さないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神に対する尊敬表現として「造られた」を用い、創世記引用の簡潔さを保った。
