id: MRK.10.39
reference: Mark 10:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: ja
  text: 彼らはイエスに言った。「できます。」しかし、イエスは彼らに言われた。「わたしが飲む杯を、あなたがたも飲むことになり、わたしが受けるバプテスマ[a]を、あなたがたも受けることになります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「杯」と「バプテスマ」は、イエスがこれから受ける苦難と定めを表す比喩であり、弟子たちもそれにあずかることになる。
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: できます
  rationale: 能力・可能を表す現在形を、簡潔で自然な応答として訳した。「私たちにはできます」も可能だが、文脈上主語は明らかである。
- source_word: ποτήριον
  choice: 杯
  rationale: 割り当てられた経験、とりわけ苦難や運命を表す聖書的比喩を、解釈に置き換えず保持した。
- source_word: πίνω / πίεσθε
  choice: わたしが飲む／あなたがたも飲むことになり
  rationale: 現在形と未来形の対照を日本語として自然に表しつつ、同じ動詞による対応関係を保った。
- source_word: βάπτισμα
  choice: バプテスマ
  rationale: 苦難に圧倒されるという比喩的意味を文脈に委ね、原語の宗教的・聖書的響きを保持した。「浸礼」では方式を限定し、「水に浸されること」では説明的になりすぎる。
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: わたしが受ける／あなたがたも受けることになります
  rationale: 日本語で「バプテスマ」と自然に結びつく「受ける」を用い、現在形と未来受動形の関係を示した。原語の名詞と動詞の語根反復は、日本語では同じ表現を反復することで可能な限り保った。
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: しかし、イエスは彼らに言われた
  rationale: δέが示す、弟子たちの自信ある返答とイエスの応答との穏やかな対照を「しかし」で表した。
theological_decisions:
- issue: 「杯」と「バプテスマ」の比喩
  choice: 両方の比喩を本文に残し、苦難や定めを直接意味する語に置き換えない。
  alternative: 「苦難」「死」「試練」などと解釈して本文に明示する。
  rationale: 原文は二つの比喩を並行させており、その聖書的な広がりと神学的緊張を保持する必要がある。意味の説明は脚注に委ねた。
- issue: ここでのバプテスマと儀礼的バプテスマとの関係
  choice: 「バプテスマ」と訳しつつ、文脈上はイエスが受けようとしている苦難を指す比喩として扱う。
  alternative: 儀礼との連想を避けるため「試練」または「圧倒される経験」と訳す。
  rationale: 原語はβάπτισμαであり、語そのものを保持するのが適切である一方、本文だけで特定の秘跡・礼典理解を断定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言には簡潔で重みのある調子を保った。「杯」と「バプテスマ」という中心的な比喩は訳文中に残した。
