reference: Mark 10:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ja
  text: しかし、イエスはこれを見て憤り、弟子たちに言われた。「子どもたちをわたしのところに来させなさい。妨げてはいけない。神の国は、このような者たちのものだからである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: しかし、イエスはこれを見て
  rationale: アオリスト分詞を、直前の弟子たちの行為を受ける状況節として自然な日本語にした。δὲ は文脈上の対照を「しかし」で示し、目的語は文脈から「これ」と補った。
- source_word: ἠγανάκτησεν
  choice: 憤り
  rationale: 強い不快と義憤を表す語であり、「怒った」よりも道徳的な憤りの含みを保つ。
- source_word: εἶπεν αὐτοῖς
  choice: 弟子たちに言われた
  rationale: αὐτοῖς の指示対象を直前の文脈に基づいて「弟子たち」と明示した。イエスの発言には現代の聖書文体として自然な敬語を用いた。
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: 子どもたちをわたしのところに来させなさい
  rationale: ἄφετε の許可・容認の命令を自然に表し、παιδία は過度な縮小辞を加えず「子どもたち」とした。
- source_word: μὴ κωλύετε αὐτά
  choice: 妨げてはいけない
  rationale: 継続的に妨害しないこと、または現在の妨害をやめることを命じる表現として、簡潔で明瞭な日本語にした。
- source_word: τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国は、このような者たちのものだからである
  rationale: 属格を伴うギリシア語の語順と意味を保ちつつ、日本語として自然に「もの」と表現した。τοιούτων の代表的な意味を「このような者たち」で保持した。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 確立した聖書語で、神の支配とその領域を含む原語の幅を不用意に一方へ限定しない。
theological_decisions:
- issue: 「このような者たち」と神の国との関係
  choice: 実際にそこにいた子どもだけに限定せず、子どものような者たちを代表的に指す表現とした。
  alternative: 「神の国は子どもたちのものである」と限定する、または「このような者たちから神の国は成る」と構成員の意味に固定する。
  rationale: τοιούτων は「この種の者たち」を意味するため、代表的な広がりを保つ必要がある。一方、子どもの無垢や自動的救済など、本文が明言しない教理は加えない。
- issue: 属格表現 τῶν ... ἐστὶν の解釈
  choice: 「もの」で所属・帰属を表しつつ、その関係の厳密な性質は限定しない。
  alternative: 「属している」「成り立っている」など、一つの関係に明確化する。
  rationale: 原文は字義的には「このような者たちのものである」であり、資格、帰属、享受などの含みを持ちうる。自然な日本語の範囲で曖昧さを保った。
translation_notes:
  register: 明瞭で現代的ながら、発話の厳粛さを保つ文体とした。イエスの発言には「言われた」を用い、命令は「来させなさい」「妨げてはいけない」として一般読者に分かりやすくした。注記を必要とするほどの本文異読や翻訳上の重大な代案はないため、脚注は付していない。
