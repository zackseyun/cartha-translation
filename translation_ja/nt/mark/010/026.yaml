  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: ja
  text: 彼らは非常に驚き、互いに[a]言った。「それでは、いったい誰が救われることができるのだろうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの間で」。直訳は「自分たちに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 彼らは
  rationale: 定冠詞は文脈上、弟子たちを指す。日本語では指示対象を過度に限定せず、自然に前文を受ける「彼らは」とした。δέはここでは強い逆接として明示しなくても文脈の展開が保たれる。
- source_word: περισσῶς
  choice: ますます
  rationale: 直前から驚きがさらに強まったことを表し、強意と文脈上の進展の双方を自然な日本語で伝える。
- source_word: ἐξεπλήσσοντο
  choice: 驚き
  rationale: 強い驚きを表す動詞。強さは「ますます」と合わせて示し、未完了過去の継続的な反応は日本語として自然な叙述にした。
- source_word: λέγοντες
  choice: 言った
  rationale: 主動詞と同時の発言を表す分詞を、日本語では動作を連ねる「驚き、…言った」とした。
- source_word: πρὸς ἑαυτούς
  choice: 互いに
  rationale: 複数の人物が自分たちの間で語る文脈なので、再帰表現の相互的な意味を自然に示す。「自分たちに」または「自分たちの間で」という理解も注で保持する。
- source_word: Καὶ
  choice: それでは
  rationale: 直前の教えから導かれる帰結を問う用法として、単なる接続の「そして」より自然に推論的な響きを伝える。
- source_word: τίς δύναται σωθῆναι
  choice: いったい誰が救われることができるのだろうか
  rationale: τίςの問いを「誰が」、δύναταιの可能・能力を「できる」、σωθῆναιの受動的な救いを「救われる」と明示した。「いったい」と「のだろうか」により、強い驚きを伴う修辞的な問いを自然に表す。
theological_decisions:
- issue: σωθῆναιが表す救いの範囲
  choice: 救われる
  alternative: 助け出される／救出される
  rationale: 周囲では神の国に入ることが論じられているため、単なる危険からの救出に狭めず、神による終末的・包括的な救いを担える語を用いた。ただし、誰がどのような仕方で救われるかという問い自体は説明で解消しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、会話の切迫感と救いに関する問いの重みを保つ、簡潔で品位ある叙述とした。
