  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: ja
  text: そして、子どもたちを腕に抱き、子どもたちに手を置いて、祝福された。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「祝福された」のギリシア語動詞は未完了過去形で、継続して、あるいは繰り返して祝福しておられたことを示唆する。また、この動詞は強意を含む形と理解されることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: 子どもたちを腕に抱き
  rationale: この動詞は単なる抱擁よりも、相手を腕の中に抱き入れる具体的な動作を表す。現代日本語として自然で、イエスの温かな身体的行為も保つ。
- source_word: κατευλόγει
  choice: 幾度も祝福された
  rationale: 未完了過去の継続・反復性と、強意的な複合動詞の含みを、過度に説明的にならない形で本文に反映した。尊敬表現の「された」は、ここでは受動ではなく主語イエスへの敬意を示す。
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: 手をその上に置いて
  rationale: 祝福に伴う具体的な動作を原文に沿って表す。「その上に」は複数の子どもたちを受ける代名詞表現であり、日本語で不自然な「彼らの上に」を避けた。
- source_word: αὐτὰ ... αὐτά
  choice: 子どもたち…その上に
  rationale: 直前の文脈上の指示対象を明確にするため、最初の代名詞は「子どもたち」と明示し、二度目は自然な指示表現とした。
- source_word: καὶ
  choice: そして
  rationale: 時間的・論理的意味を加えず、マルコの簡潔な叙述の接続を自然な現代日本語で示す。
theological_decisions:
- issue: 子どもたちに対するイエスの行為の性格
  choice: 腕に抱くこと、手を置くこと、祝福することを具体的な行為としてそのまま訳す。
  alternative: 「按手の祝福」など、後代の儀礼・教理上の術語でまとめる。
  rationale: 本文が描く親愛のこもった受け入れと祝福を保ちつつ、明記されていない秘跡的・儀礼的意味を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「子どもたち」を補って指示対象を明確にし、原文の動作順序と同時性を保った。敬語は聖書本文として自然な範囲に抑えた。
