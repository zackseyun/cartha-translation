  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: ja
  text: ペテロはイエスに言い始めた。「ご覧ください、私たちは何もかも捨てて、あなたに従ってきました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: 言い始めた
  rationale: 開始を表す動詞と不定詞の組み合わせを、自然な現代日本語で表した。
- source_word: ὁ Πέτρος
  choice: ペテロ
  rationale: 人名の標準的な日本語表記を用いた。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 代名詞の指示対象は文脈上イエスであり、日本語では明示したほうが自然で明確である。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 相手の注意を促す談話標識としての働きを、ペテロがイエスに語る場面にふさわしい丁寧さで表した。
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 明示された代名詞の強調を保持しつつ、自然な日本語とした。
- source_word: ἀφήκαμεν πάντα
  choice: 何もかも捨てて
  rationale: 全面性を表す πάντα を「何もかも」とし、ἀφίημι の離れる・手放す意味をこの弟子入りの文脈では「捨てる」で簡潔に表した。
- source_word: ἠκολουθήκαμέν σοι
  choice: あなたに従ってきました
  rationale: 完了形が示す、従い始めた行為の現在まで続く意義を「従ってきました」で自然に表した。
theological_decisions:
- issue: 弟子としての犠牲についてのペテロの主張
  choice: ペテロ自身の強い主張として、そのまま訳す。
  alternative: 主張を弱めたり、続くイエスの応答を先取りして意訳したりする。
  rationale: 本文はペテロの発言を記録しており、その正しさを語り手がここで評価してはいないため、解釈を加えず緊張を保った。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。イエスへの発話には丁寧体を用い、古風な「見よ」は避けた。
