base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: ja
  text: 彼らは答えた。「モーセは、離婚証書[a]を書き、妻と離婚することを許しました[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「離縁状」。ギリシア語は、離婚を正式に示す法的な文書を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「妻を去らせる」。ここでは離婚の意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 彼らは答えた
  rationale: 直前に質問された人々の応答であることを自然な日本語で示す。δέの継続・軽い対照は文脈で伝わるため、接続詞を明示しない。
- source_word: Ἐπέτρεψεν
  choice: 許しました
  rationale: ἐπιτρέπωの「許可する」という意味を保ち、命令ではなく容認であったという直後の文脈上の対比を明確にする。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で定着した人名表記。
- source_word: βιβλίον ἀποστασίου
  choice: 離婚証書
  rationale: 申命記24章を背景とする法的な離婚文書を、簡潔で現代的な日本語で表す。
- source_word: γράψαι
  choice: 書いて
  rationale: γράφωの基本義をそのまま表し、作成手続きについて過度に限定しない。
- source_word: καὶ ἀπολῦσαι
  choice: 妻を去らせる
  rationale: 離婚の文脈における「解放する、送り去る」という語の比喩を残す。目的語はギリシア語本文に明示されないが、文脈上の対象を自然な日本語にするため「妻」を補う。
theological_decisions:
- issue: モーセの離婚規定の性質
  choice: モーセは離婚を許した
  alternative: モーセは離婚証書を書くよう命じた
  rationale: Ἐπέτρεψενは明確に「許した」を意味する。命令と訳さず、心のかたくなさゆえの容認と創造時の意図との緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「離婚証書」で法的文書の性格を示し、「去らせる」に原文の表現を残した。
