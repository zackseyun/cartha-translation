  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: ja
  text: イエスは彼らを呼び寄せて、こう言われた。「あなたがたは知っている。異邦人[a]の支配者と見なされている人々[b]は彼らを横暴に支配し、その有力者たちは彼らに対して権力を振るっている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「異邦人を支配しているように見える人々」。
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せて
  rationale: 中動態の「自分のもとに呼ぶ」という意味を、現代日本語で自然かつ簡潔に表した。
- source_word: λέγει
  choice: こう言われた
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去表現にし、発言の導入を明確にするため「こう」を補った。
- source_word: Οἴδατε
  choice: あなたがたも知っているように
  rationale: 現在の確立した認識を示す οἶδα を自然に表す。「も」は、弟子たちに共有知識を確認する語調を示す。
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: 支配者と見なされている人々
  rationale: δοκέω の「そう見える」と「そう見なされる」の幅を踏まえ、ここでは社会的に支配者として認められている者たちを指す読みを本文に採った。別の構文理解は脚注に残した。
- source_word: τῶν ἐθνῶν
  choice: 異邦人
  rationale: ユダヤ的文脈で非ユダヤ諸民族を指す語感を表した。「諸国民」という語義も脚注に示した。
- source_word: κατακυριεύουσιν
  choice: 力ずくで支配し
  rationale: 単なる統治ではなく、相手を押さえつけて支配する強い含意を明確で自然な日本語にした。
- source_word: οἱ μεγάλοι αὐτῶν
  choice: その有力者たち
  rationale: 社会的に重要で権勢を持つ者を指し、特定の官職に限定しない表現とした。
- source_word: κατεξουσιάζουσιν
  choice: 権力を振るっている
  rationale: 権威・権力を相手の上に行使する意味と、その高圧的な語感を表しつつ、前句の「力ずくで支配」と表現を区別した。
theological_decisions:
- issue: τῶν ἐθνῶν の指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: マルコ福音書のユダヤ的文脈では非ユダヤ諸民族を指すと考えられるが、一般的な「諸国民」という語義も排除せず脚注に示した。
- issue: δοκοῦντες ἄρχειν の意味と構文
  choice: 異邦人の支配者と見なされている人々
  alternative: 異邦人を支配しているように見える人々
  rationale: 本文は、公に支配者と認められている者たちという自然な文脈理解を採る。ただし δοκέω の「見える」という意味と、ἄρχειν が τῶν ἐθνῶν を目的語的に取る可能性を脚注に残し、真の権威を否定する含意を断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言には自然で品位ある敬語を用いた。二つの強意的な支配表現は「力ずくで支配する」と「権力を振るう」と訳し、並行性を保ちながら語の違いも示した。
