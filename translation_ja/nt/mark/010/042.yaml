  naturalness: 現行訳はおおむね明瞭だが、「あなたがたも知っているように」は日本語では後続内容を共有知識の前置きとしてやや説明的にする。「あなたがたは知っている」は簡潔で自然である。「横暴に支配する」は、物理的暴力に限定せず、現代日本語として自然に支配の濫用を表せる。
  terminology: 「異邦人」はユダヤ的文脈における τῶν ἐθνῶν の訳として妥当であり、「諸国民」という脚注も適切である。「支配者と見なされている人々」は οἱ δοκοῦντες ἄρχειν の文脈上有力な理解を適切に表す。「有力者たち」も οἱ μεγάλοι を官職に限定しない訳としてよい。
