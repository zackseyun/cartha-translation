revisions:
- from: イエスは彼らを呼び寄せて、こう言われた。「あなたがたも知っているように、異邦人[a]の支配者と見なされている人々[b]は彼らを力ずくで支配し、その有力者たちは彼らに権力を振るっている。」
  to: イエスは彼らを呼び寄せて、こう言われた。「あなたがたは知っている。異邦人[a]の支配者と見なされている人々[b]は彼らを横暴に支配し、その有力者たちは彼らに対して権力を振るっている。」
  rationale: τῶν ἐθνῶν、δοκοῦντες ἄρχειν、および二つの支配動詞の並行関係は維持した。「横暴に支配し」により κατακυριεύουσιν の否定的な強意を、物理的強制に限定せず表した。「彼らに対して」は二度目の αὐτῶν が対象を表すことを日本語で明示する。脚注の位置と内容は原文の語義上の選択肢を適切に保持している。
