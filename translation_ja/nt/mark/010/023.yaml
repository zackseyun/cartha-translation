  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: ja
  text: イエスは周りを見回して、弟子たちに言われた。「財産を持つ人たちが神の国に入るのは、どんなに難しいことだろう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 周りを見回して
  rationale: 周囲の人々を見渡す動作を表すアオリスト中態分詞。日本語では主動詞に先立つ動作として自然に表現した。
- source_word: λέγει
  choice: 言われた
  rationale: マルコに特徴的な歴史的現在。日本語の物語として自然な過去形にしつつ、イエスへの敬意を示す標準的な表現とした。
- source_word: Πῶς δυσκόλως
  choice: なんと難しいことか
  rationale: 困難の大きさを強調する感嘆的表現を、自然な現代日本語で再現した。不可能とまでは訳していない。
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: 財産を持つ人たち
  rationale: 「金銭・財産を持っている者たち」という参与句の形を保ち、「富裕層」という固定的な社会階層名に狭めない表現とした。
- source_word: χρήματα
  choice: 財産
  rationale: 現金だけでなく物質的資産も含み得る語であり、文脈上「財産」が簡明で適切である。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: マルコ福音書の中心的表現として定着し、神の支配とその領域の含意を保持する標準訳。
- source_word: εἰσελεύσονται
  choice: 入る
  rationale: 未来形だが、日本語では「入るのは難しい」という一般的・将来的命題の構文で未来の含意が自然に伝わる。
theological_decisions:
- issue: 財産を持つ人が神の国に入ることを、不可能と訳すか、非常に困難と訳すか
  choice: 「なんと難しいことか」とし、深刻な困難を表す
  alternative: 事実上不可能であると意味を強めて訳す
  rationale: 原文の δυσκόλως は困難を表し、不可能そのものを明言しない。この節が持つ神学的緊張を解消せずに残した。
translation_notes:
  register: 明快で現代的な標準日本語を用い、発言部分には簡潔で格調ある感嘆表現を採用した。原文の叙述順序をおおむね保ちながら、日本語として自然な語順にした。
