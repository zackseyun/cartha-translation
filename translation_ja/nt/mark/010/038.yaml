  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: ja
  text: しかし、イエスは二人に言われた。「あなたがたは、自分が何を求めているのか分かっていない。わたしが飲む杯を飲むこと、または、わたしが受けているバプテスマを受けることが、あなたがたにできるか[a][b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「杯」は、ある人に割り当てられた分を表す聖書の比喩である。ここでは特に、イエスに迫る苦難を指す。
    reason: cross_reference
  - marker: b
    text: 原文は「または、わたしが受けているバプテスマを受けることが」と続く。「バプテスマ」と「バプテスマを受ける」に当たる同語族の語が繰り返されている。意味をくんで「わたしが経験することを経験する」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: しかし、イエスは二人に言われた
  rationale: δέはここで、直前の願いに対する訂正的な応答を示すため「しかし」とした。αὐτοῖςは文脈上ヤコブとヨハネを指すので、自然な日本語として「二人に」とした。
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: あなたがたは、自分が何を願っているのか分かっていない
  rationale: οἴδατεの「知っている」を文脈に即して自然な「分かっている」とし、αἰτεῖσθεは重大な求めを表す「願っている」と訳した。
- source_word: δύνασθε
  choice: できるか
  rationale: 能力・力量を問うδύναμαιを、明快で自然な現代日本語の「できるか」で表した。
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: わたしが飲む杯を飲み
  rationale: 「杯」の比喩を解釈語に置き換えず、原文の動詞の反復も保った。
- source_word: ἢ
  choice: （並列疑問として）…飲み、…受けることができるか
  rationale: ギリシア語本文のἢは二つの比喩的表現を結ぶ。日本語では一つの能力疑問の中に並列すると自然であり、別個の選択肢という誤解も避けられる。脚注で原文が「または」で結ぶことを明示した。
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: わたしが受けるバプテスマを受ける
  rationale: βάπτισμαは「バプテスマ」として比喩と聖書的連関を保持した。日本語で同語族の名詞・動詞をそのまま再現するのは不自然なため、「バプテスマを受ける」とし、原文の反復は可能な範囲で保った。
theological_decisions:
- issue: 「杯」と「バプテスマ」の比喩
  choice: 本文では二つの比喩を保ち、「苦難」「死」「神の怒り」などと明示しない
  alternative: 「わたしが受ける苦しみを受ける」などと解釈的に訳す
  rationale: 文脈上、イエスに迫る苦難を指すが、この節自体は意味を一つの教理的説明に限定していない。比喩とその緊張を保持する。
- issue: 二つの比喩を結ぶἢ
  choice: 日本語本文では一つの疑問文内の並列として表し、脚注で「または」を示す
  alternative: 「または」を本文に明示する
  rationale: SBLGNTの異読を尊重しつつ、日本語で「または」とすると杯とバプテスマが排他的な選択肢に見えやすい。原文情報は脚注で透明に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの厳粛な問いにふさわしい品位を保った。「杯」と「バプテスマ」は説明的に言い換えず、本文では象徴性を保持した。
