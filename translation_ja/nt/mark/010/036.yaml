  text: And he said to them, “What do you want me to do for you?”
translation:
  language: ja
  text: そこで、彼は彼らに言われた。「わたしに何をしてほしいのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: すると、イエスは
  rationale: 冠詞付きのδέは、主語を受け継ぎつつ物語を進める慣用的な表現。日本語では「すると」で自然な展開を示し、文脈上の主語イエスを明示した。
- source_word: εἶπεν αὐτοῖς
  choice: 二人に言われた
  rationale: εἶπενは基本義どおり「言った」。日本語の聖書本文として自然な敬意を示すため「言われた」とし、αὐτοῖςの複数は直前のヤコブとヨハネを指すので「二人に」とした。
- source_word: Τί θέλετε
  choice: 何を……ほしいのですか
  rationale: τίは「何を」、θέλωは望みを表す。後続のποιήσωと一体にして、現代日本語で自然な希望の問いとして訳した。
- source_word: ποιήσω ὑμῖν
  choice: してほしい
  rationale: ποιήσωはθέλετεに従い、話者自身が行うことを表す。ὑμῖνは受益の与格であり、日本語の「あなたがたのために」を硬く補わず、「してほしい」にその関係を自然に含ませた。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語。会話の直接性を保ちつつ、イエスの発話には一般的な敬語表現を用いた。直前の文脈に即して複数の相手を「二人」と明示した。
