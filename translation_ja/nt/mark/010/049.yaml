source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: ja
  text: イエスは立ち止まり、「あの人を呼びなさい」と言われた。そこで人々はその目の見えない人を呼び、「元気を出しなさい。立ちなさい。あの方があなたを呼んでおられる」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: 立ち止まり
  rationale: 形式上は「立って」だが、移動中のイエスが足を止めたという物語上の意味を、自然な現代日本語で表した。
- source_word: Φωνήσατε αὐτόν
  choice: あの人を呼びなさい
  rationale: φωνέω の「呼ぶ、呼び寄せる」という意味を直接的に表し、後続する同じ動詞との反復も保った。
- source_word: φωνοῦσι τὸν τυφλὸν
  choice: 人々はその目の見えない人を呼び
  rationale: 主語は文脈上その場の人々を指すため「人々」と補い、実体詞的な τυφλός は明確で自然な「目の見えない人」とした。
- source_word: Θάρσει
  choice: 元気を出しなさい
  rationale: 相手を励まし安心させる命令を、普通の日本語として自然でありながら軽すぎない表現にした。
- source_word: ἔγειρε
  choice: 立ちなさい
  rationale: 座っていたバルティマイに起き上がるよう促す命令として、簡潔に訳した。
- source_word: φωνεῖ σε
  choice: あの方があなたを呼んでおられる
  rationale: 現在形の切迫した呼びかけを表し、主語であるイエスを日本語で自然に示した。「あの方」により敬意を表すが、称号は付加していない。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、語りではイエスへの自然な敬意を「言われた」「呼んでおられる」で表した。命令文は簡潔に保ち、φωνέω の三度の用例を一貫して「呼ぶ」で訳した。
