  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: ja
  text: また、あなたがたの間で第一になりたい者は、すべての人の奴隷となるのです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は未来形で、「奴隷となる」と述べています。文脈上、これは教えとして規範的な力を持ちます。「奴隷」（ドゥーロス）は、前節の「仕える者」（ディアコノス）より強い語です。
    reason: 原文の未来形を示しつつ、その文脈上の規範的な含意と、前節との語彙上の対比を示すため。
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: なりたい者は
  rationale: 不定関係表現と接続法による一般条件を、日本語で自然な「〜たい者は」とし、θέλωの意志・願望を保った。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 空間的位置ではなく、弟子たちの集団内での順位・地位を表すため。
- source_word: πρῶτος
  choice: 第一
  rationale: 順位や卓越性における「第一」を直接表し、文脈の序列をめぐる教えを保つ。
- source_word: ἔσται
  choice: となりなさい
  rationale: 形態は未来形だが、この格言的な教えでは命令的な力を帯びる。日本語で単純未来の「なるだろう」とすると予測に聞こえやすいため、その実効的な勧告を明示した。
- source_word: πάντων
  choice: すべての人の
  rationale: δοῦλοςとの属格関係を「〜の」で表し、対象の普遍的範囲を明確にした。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 前節のδιάκονοςより強く、隷属と低い身分を示す語であるため、対比を弱めない「奴隷」とした。
theological_decisions:
- issue: 弟子としての自己低下を語る箇所でのδοῦλοςの訳
  choice: 奴隷
  alternative: 仕える者／僕
  rationale: 直前のδιάκονοςとの語彙上の段階差を保ち、すべての人に従属するという逆説的で厳しい響きを弱めないため。
- issue: ἔσταιの未来形と命令的含意
  choice: となりなさい
  alternative: となる／なるだろう
  rationale: 原文の未来形を機械的に予測表現へ移すより、文脈上の規範的・命令的な力を自然な日本語で伝えることを優先した。ただし形態上は未来形であることを脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語。教えとしての荘重さを保ちつつ、過度に文語的な表現は避けた。「奴隷」は強い語だが、原文が意図する身分の低さと前節からの強まりを保持するため採用した。
