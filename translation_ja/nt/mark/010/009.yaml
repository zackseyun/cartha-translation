  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: ja
  text: それゆえ、神が結び合わせたものを、人は引き離してはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ
  choice: ものを
  rationale: 中性単数の関係代名詞で、直前に述べられた夫婦の結びつきを一体として受ける。日本語の「もの」は、その集合的な指示を自然に保つ。
- source_word: οὖν
  choice: それゆえ
  rationale: 創造における神の意図についての直前の論述から結論を導く推論の接続を、明瞭で品位ある現代日本語で示す。
- source_word: ὁ θεὸς
  choice: 神が
  rationale: 定冠詞を伴う主語であり、日本語では通常「神」と表す。
- source_word: συνέζευξεν
  choice: 結び合わせた
  rationale: συζεύγνυμιのアオリスト能動直説法。「くびきを共にする」という語感を背景に持つが、婚姻の文脈では「結び合わせた」が自然で、神による完了した行為を明確に表す。
- source_word: ἄνθρωπος
  choice: 人は
  rationale: 無冠詞単数で人間一般を指す。「人」は現代日本語で性別を限定せず、単数による一般化の力も自然に保つ。
- source_word: μὴ χωριζέτω
  choice: 引き離してはならない
  rationale: μήを伴う現在能動命令法の禁止を明確に表す。「引き離す」は、神が結び合わせたこととの対照と婚姻関係を裂く意味を自然に伝える。
theological_decisions:
- issue: 婚姻についての言葉におけるἄνθρωποςの一般的用法
  choice: 「人」と訳し、すべての人間に及ぶ禁止として示す
  alternative: 「男」または「人間」
  rationale: ここでのἄνθρωποςは無冠詞単数で、人間一般を代表している。「人」は男性だけに限定する誤解を避けつつ、原文の一般的な単数表現を保つ。
- issue: 神の結び合わせる行為と人の分離行為の対照
  choice: 「結び合わせた」と「引き離してはならない」を対置する
  alternative: 「一つにした」と「離してはならない」
  rationale: 原文の動詞が示す結合と分離の緊張を明瞭に保ち、結婚についての含意を説明的に狭めすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「それゆえ」により論理的帰結を示し、「人は……してはならない」で命令の禁止の力を自然に表した。
