  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: ja
  text: そして、また家に入ると、弟子たちはこのことについてイエスに尋ねていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「また」は、「再び家に入ると」という意味にも、「弟子たちはこのことについて再びイエスに尋ねていた」という意味にも取れる。
    reason: source_ambiguity
lexical_decisions:
- source_word: Καὶ
  choice: また
  rationale: 直前の場面から次の場面へつなぐ標準的な接続として、自然な物語の流れを保つ。
- source_word: εἰς τὴν οἰκίαν
  choice: 家に入ると
  rationale: εἰς の方向性を保ちつつ、私的な家の中へ場面が移ったことを現代日本語で自然に示す。定冠詞だけでは特定の家を日本語で明示する根拠がないため、単に「家」とした。
- source_word: πάλιν
  choice: また
  rationale: 語順上は「家に」に結びつく可能性と「尋ねていた」に結びつく可能性があり、本文では自然な冒頭位置に置いて曖昧さを保つ。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 文脈上すでに知られているイエスの弟子たちを指す。日本語では所有表現を補わなくても明確である。
- source_word: περὶ τούτου
  choice: このことについて
  rationale: 直前の離婚に関する教えを指す表現を、過度に説明せず素直に訳す。
- source_word: ἐπηρώτων
  choice: 尋ねていた
  rationale: 未完了過去の継続的・反復的な側面を示し、「尋ね始めた」という起動の意味は本文に加えない。
- source_word: αὐτόν
  choice: イエスに
  rationale: 日本語の「彼に」では指示対象が不自然または曖昧になりやすいため、文脈上の指示対象であるイエスを明示する。
