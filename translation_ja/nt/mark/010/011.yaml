source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: ja
  text: そしてイエスは彼らに言われた。「自分の妻と離婚し、ほかの女性[a]と結婚する者は、その妻に対して姦淫を犯す。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「別の女性」（女性形）。文脈上、「別の妻」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語はマルコに特徴的な歴史的現在だが、現代日本語の物語として自然に読める過去形で表した。主語のイエスは文脈上明らかであり、日本語訳では明示した。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 与格代名詞を発言の相手として自然に訳した。
- source_word: Ὃς ἂν
  choice: …する者は
  rationale: 不定の一般条件を表す構文であり、特定の一人ではなく、該当する者すべてに当てはまる言い方とした。
- source_word: ἀπολύσῃ
  choice: 離婚し
  rationale: 婚姻関係を扱う文脈なので、一般的な「去らせる」ではなく法的・関係的意味の「離婚する」とした。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 自分の妻
  rationale: γυνήには「女性」と「妻」の両義があるが、所有表現と離婚の文脈から「妻」が適切である。
- source_word: γαμήσῃ ἄλλην
  choice: ほかの女性と結婚し
  rationale: ἄλληνは女性形で、別の女性または別の妻を指す。本文では明瞭で自然な「ほかの女性」とし、含意を脚注で示した。
- source_word: μοιχᾶται
  choice: 姦淫を犯す
  rationale: 婚姻上の不貞を指す動詞を、現代日本語で明確かつ厳粛な定型表現によって訳した。
- source_word: ἐπ’ αὐτήν
  choice: その妻に対して
  rationale: 行為が離婚された妻に向けられた罪・不正であるという前置詞句の力を保ち、指示対象も明確にした。
theological_decisions:
- issue: ἐπ’ αὐτήνが、妻に対してなされた不正を示す力をどう表すか
  choice: 「その妻に対して姦淫を犯す」とした。
  alternative: 単に「姦淫を犯す」、または「ほかの女性と姦淫する」とする。
  rationale: 原文にある前置詞句を省かず、夫の行為が最初の妻に対する背信でもあるという焦点を保った。
- issue: Ὃς ἂνの一般的条件を日本語でどう表すか
  choice: 性別を別途付け加えず「…する者は」とした。
  alternative: 「どんな男でも」または「夫が」とする。
  rationale: 直後の「自分の妻」により当面の対象は明らかであるため、原文にない強調を加えず、不定の一般条件を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、婚姻上の重大な背信を表す「姦淫」は保持した。「その妻に対して」により、原文の倫理的・関係的な方向性を明確にしている。
