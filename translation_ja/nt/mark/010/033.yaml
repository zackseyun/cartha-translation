source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: ja
  text: 「見なさい。私たちはエルサレムへ上って行きます。人の子は祭司長たちと律法学者たちに引き渡され[a]、彼らは人の子に死刑を宣告し、異邦人たち[b]に引き渡します」と。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「委ねられる」とも訳せる。原文では、この節の二つの箇所に同じ動詞が使われている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「諸国民」。ここではユダヤ人ではない人々を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 「……」と
  rationale: 前節から続き、イエスの発言内容を導く接続詞。日本語では引用を閉じる「と」によって自然に表した。
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 聞き手の注意を強く促す談話標識。古風すぎない明瞭な命令表現とした。
- source_word: ἀναβαίνομεν
  choice: 私たちは……上って行きます
  rationale: エルサレムへ向かう移動と現在進行中の旅を自然に示し、地理的な『上る』も保持した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称を字義に即して訳し、その聖書的・神学的響きを保った。
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: 引き渡され／引き渡します
  rationale: 同じ動詞の反復を同じ日本語で保ち、ある者の支配下へ渡される一連の動きを示した。『裏切られる』と限定して行為者や動機を過度に特定することを避けた。
- source_word: τοῖς ἀρχιερεῦσιν
  choice: 祭司長たち
  rationale: 単独の大祭司ではなく、指導的な祭司層を指す複数形として訳した。
- source_word: τοῖς γραμματεῦσιν
  choice: 律法学者たち
  rationale: 当時の聖書と律法の専門家を現代の一般読者に明瞭に伝える定着した表現を用いた。
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: 彼らは人の子に死刑を宣告し
  rationale: 法的な有罪判断と死の刑罰を自然な日本語で表した。代名詞の指示を明確にするため、αὐτόνを『人の子』とした。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人たち
  rationale: この受難予告では、ユダヤ人指導者から非ユダヤ人側へ引き渡される歴史的区別を表す。抽象的な『諸国民』より文脈に適する。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου の訳
  choice: 人の子
  alternative: 人間である者
  rationale: 伝統的かつ字義的な訳により、イエスの自己呼称とダニエル書を含む聖書的な含意を、説明的に狭めず保持した。
- issue: τοῖς ἔθνεσιν の指示対象
  choice: 異邦人たち
  alternative: 諸国民
  rationale: 直後の受難の経過における非ユダヤ人の統治者側への移送を示す一方、それ以上の教理的意味を本文に付加しない。
- issue: παραδίδωμι の意味範囲
  choice: 引き渡す
  alternative: 裏切る
  rationale: 本文は受け渡しの連鎖を強調しており、『裏切る』では動機や行為の性格を狭く確定しすぎるため、より広い原語の意味を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、受難予告にふさわしい端正さを保った。引用導入のὅτιは、日本語の語順に合わせて節末の「と」で表現した。「見なさい」は注意喚起の力を保ち、「人の子」「祭司長たち」「律法学者たち」は一般的で理解しやすい聖書用語として採用した。
