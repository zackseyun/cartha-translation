  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: ja
  text: イエスは彼に答えて言われた。「わたしがあなたのために何をしてほしいのか。」すると、その盲人はイエスに言った。「ラボニ[a]、目が見えるようになることです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ラボニ」はアラム語の呼びかけで、「私の先生」または「私の師」という意味。
    reason: 原語の音写を本文に残し、その意味を明らかにするため。
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 答えて
  rationale: 分詞の構造を保ちつつ、「答えて言われた」という自然で格調ある日本語にした。
- source_word: Τί σοι θέλεις ποιήσω
  choice: わたしに何をしてほしいのか
  rationale: θέλειςの意志・願望を「してほしい」で表し、σοιの受益の意味も文脈上自然に含ませた。
- source_word: ὁ τυφλὸς
  choice: その盲人
  rationale: 名詞的に用いられた形容詞を、特定の人物を指す自然な日本語として訳した。
- source_word: Ραββουνι
  choice: ラボニ
  rationale: ギリシア語本文がセム語系の呼びかけを音写しているため、日本語でも音写を保ち、意味は脚注で示した。
- source_word: ἵνα ἀναβλέψω
  choice: 目が見えるようになることです
  rationale: ἵναによる願いの内容を日本語の応答として表した。ἀναβλέπωはこの癒やしの文脈では視力を得ることを指すが、以前は見えていたと断定する「再び」は避けた。
theological_decisions:
- issue: Ραββουνιという呼称の扱い
  choice: 本文では「ラボニ」と音写し、脚注で意味を説明する
  alternative: 「私の先生」または「わが師」と本文中で訳す
  rationale: 原文が通常のギリシア語の称号に置き換えず音写形を残しているため、その歴史的・情感的な響きを本文でも保持した。
- issue: ἀναβλέψωが以前の視力回復を含意するか
  choice: 「目が見えるようになる」と訳す
  alternative: 「再び見えるようになる」と訳す
  rationale: この動詞は視力の回復を意味し得るが、物語はこの人物が以前見えていたとは明言していないため、不要な断定を避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、会話の荘重さを損なわない標準的な文体とした。「答えて言われた」は原文の分詞構造を反映し、「ラボニ」は原文の特色を保つため音写した。
