base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: ja
  text: しかし、彼はそのことばに顔を曇らせ、悲しみながら立ち去った。多くの財産を持っていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνάσας
  choice: 顔を曇らせ
  rationale: 目に見えて表情が暗くなるという語のニュアンスを、過度に解釈せず自然な現代日本語で表した。
- source_word: ἐπὶ τῷ λόγῳ
  choice: そのことばを聞いて
  rationale: この発言が反応の契機または原因となったことを自然に示す。λόγῳの単数も「そのことば」で保った。
- source_word: ἀπῆλθεν
  choice: 立ち去った
  rationale: その場から去る物語上の動きを、簡潔で自然な日本語で表す。
- source_word: λυπούμενος
  choice: 悲しみながら
  rationale: 去って行く間も続く悲しみを、現在分詞の継続的な含みを生かして表した。
- source_word: κτήματα πολλά
  choice: 多くの財産
  rationale: κτήματαを所有物・財産の意味に取り、πολλάの量的な意味を「多くの」で示した。
- source_word: ἦν γὰρ ἔχων
  choice: 持っていたからである
  rationale: 継続的な所有状態を、日本語として自然な過去の状態表現にした。
theological_decisions:
- issue: イエスのことばに対する彼の感情的反応の性質
  choice: 表情が曇り、悲しみつつ去ったと訳す
  alternative: 怒った、または単に失望したと明示する
  rationale: 本文が明示するのは目に見える暗い反応と悲しみであり、怒りや反抗などの道徳的評価までは加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「顔を曇らせ」により視覚的な反応を保ち、「悲しみながら」で感情の継続を示した。
