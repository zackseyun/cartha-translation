source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: ja
  text: そして、彼らは彼をあざけり、彼に唾を吐きかけ、むちで打ち、殺す。そして、三日の後に[a]、彼はよみがえる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「三日の後に」。ほかの箇所では、復活の時期は「三日目に」と表現されている。
    reason: マルコのμετὰ τρεῖς ἡμέραςを本文で直接訳したまま、並行箇所に異なる時期表現があることを中立的に示すため。
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: あざけり
  rationale: 相手を侮辱し、嘲笑する意味を、簡潔で品位ある現代日本語で表す。
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: 彼に唾をかけ
  rationale: 彼に向けられた屈辱行為であることを自然かつ明確に表す。
- source_word: μαστιγώσουσιν
  choice: むちで打ち
  rationale: 司法的な身体刑を、現代の一般読者にも分かる表現で伝える。
- source_word: ἀποκτενοῦσιν
  choice: 殺す
  rationale: 法的評価や道徳的評価を付け加えず、動詞の平明な意味を保つ。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 三日の後に
  rationale: 対格を伴うμετάの通常の意味である「後に」を直接反映し、「三日目に」へ調和させない。
- source_word: ἀναστήσεται
  choice: よみがえる
  rationale: 未来中動態形を自動詞的に訳し、「よみがえらされる」という受動の含みや、原文にない「再び」を加えない。
theological_decisions:
- issue: 復活を表す動詞の態
  choice: 彼はよみがえる
  alternative: 彼はよみがえらされる／彼は再びよみがえる
  rationale: ἀναστήσεταιは未来中動態であり、自動詞的な「よみがえる」が自然である。父がイエスをよみがえらせたとする他の新約本文との神学的関係をここで一方的に解消せず、この節固有の表現を保つ。
- issue: 復活の時期
  choice: 三日の後に
  alternative: 三日目に
  rationale: マルコのμετὰ τρεῖς ἡμέραςを直接訳し、並行箇所の「三日目に」へ本文を調和させない。一方、古代の包括的な日数計算では両表現が同じ時期を指しうることを注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難予告にふさわしい簡潔さと厳粛さを保った。反復されるκαίは文の流れを損なわない範囲で「そして」とし、目的語は曖昧にならないよう「彼」を明示した。
