  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ja
  text: しかし、先にいる多くの人が後になり、後にいる人が先になる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、多くの先の者が後になり、後の者が先になる。」
    reason: 「先にいる人」「後にいる人」を、原文の名詞的形容詞がもつ簡潔で対句的な表現として示すため。
lexical_decisions:
- source_word: πολλοὶ
  choice: 多く
  rationale: 形容詞の名詞的用法で、すべての人ではなく広い範囲の多数を指す。「多く」として簡潔さと開かれた範囲を保った。
- source_word: δὲ
  choice: しかし
  rationale: 前節の約束を受けつつ逆転の原則を導入する、穏やかな対照を明確に表した。
- source_word: ἔσονται
  choice: ～になる
  rationale: 単純未来の連結動詞である。日本語では身分・位置の逆転を自然に示す「なる」が適切である。
- source_word: πρῶτοι
  choice: 先の者
  rationale: 順序だけでなく地位や位置も含み得る語であり、対句の簡潔さと意味の幅を保つ。
- source_word: ἔσχατοι
  choice: 後
  rationale: πρῶτοιとの直接的な対照を保ち、地位・位置の逆転を特定の社会的分類に限定しない。
- source_word: οἱ ἔσχατοι
  choice: 後の者
  rationale: 冠詞付き形容詞の名詞的用法を明示し、第一節との均整を保った。
- source_word: καὶ
  choice: ～し
  rationale: 二つの節を並列して結び、日本語として自然な対句にした。
theological_decisions:
- issue: 逆転の言葉の性質
  choice: 終末的逆転を含み得る一般原則として訳し、具体的な対象を限定しない。
  alternative: 「先」と「後」を富者と貧者、弟子と部外者、または救われる者と救われない者に特定する。
  rationale: 本文自体は対象を限定せず、また「多く」と述べて全員に例外なく当てはまる規則ともしていないため、その簡潔さと神学的緊張を保った。
translation_notes:
  register: 明快で現代的な標準語を用いながら、格言的な対句と荘重さを保った。「最初／最後」よりも、人の地位や位置を自然に含められる「先／後」を採用した。
