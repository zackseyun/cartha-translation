base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: ja
  text: そこで、彼はイエスに言った。「先生、これらはみな、若い時から守ってきました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη αὐτῷ
  choice: すると、彼はイエスに言った
  rationale: δέはここでは強い対比ではなく、応答を導く軽い物語上の接続として「すると」とした。αὐτῷの指示対象は文脈上イエスであり、日本語で明確になるよう「イエスに」とした。ἔφηは通常の発話動詞として「言った」と訳した。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼格のδιδάσκαλοςは教える者への呼びかけ。「先生」は現代日本語で自然であり、「師」や「主君」などの含意を加えない。
- source_word: ταῦτα πάντα
  choice: そのすべて
  rationale: 直前に挙げられた戒め全体を指す。「そのすべて」は対象を自然に受けつつ、原文の指示性と包括性を保つ。
- source_word: ἐφυλαξάμην
  choice: 守ってきました
  rationale: φυλάσσωは戒めについて「守る、遵守する」の意。アオリストは若い時から現在までの歩みをまとめて述べており、日本語では「守ってきました」が自然にその継続的な射程を表す。
- source_word: ἐκ νεότητός μου
  choice: 若い時から
  rationale: ἐκと属格は時間的な起点を示す。νεότηςは「若さ、青年期」であり、「子どものころ」と限定せず、自然な現代日本語で表した。
theological_decisions:
- issue: 話者が戒めを完全に守ったという主張の評価
  choice: 主張をそのまま「守ってきました」と訳し、真偽や完全性への評価を加えない
  alternative: 「守ろうとしてきました」など、主張を弱めて訳す
  rationale: 原文は話者の断定的な自己申告を記しているが、語り手による評価はこの節には明示されない。解釈上の緊張を保持するため、努力の意味へ弱めたり皮肉を加えたりしない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。敬称「先生」と丁寧体「守ってきました」により、イエスへの直接話法としてふさわしい敬意を示した。本文に脚注はない。
