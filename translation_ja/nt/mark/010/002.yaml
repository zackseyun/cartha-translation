  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: ja
  text: そして彼らは、イエスを試そうとして、「夫が妻と離婚することは許されているか」と尋ねていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夫が妻と」は、直訳的には「男が妻を」とも訳せる。ἀνήρは「男／夫」、γυνήは「女／妻」の両義を持つが、ここでは婚姻に関する問いである。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: 尋ねていた
  rationale: 未完了過去の継続的・反復的な側面を自然な日本語で示す。単純な「尋ねた」より原文の時制を反映する。
- source_word: ἔξεστιν
  choice: 許されている
  rationale: 可能性ではなく、律法や規範のもとでの許可を問う語である。「合法である」より自然で、法的含意も保てる。
- source_word: ἀνδρὶ
  choice: 男が
  rationale: ἀνήρには「男」と「夫」の両義がある。本文では一般的な問いの形を保って「男」とし、婚姻上の意味は「妻」「離縁」によって明らかにする。
- source_word: γυναῖκα
  choice: 妻を
  rationale: γυνήは「女」と「妻」の両義を持つが、ἀπολῦσαιとの婚姻・法的文脈では「妻」が適切である。
- source_word: ἀπολῦσαι
  choice: 離縁する
  rationale: 字義的には「去らせる」「解放する」だが、この婚姻上の文脈では離婚を成立させる行為を指す。「離婚する」よりも、夫が妻を去らせる原文の他動詞構文を保つ。
- source_word: πειράζοντες
  choice: 試そうとして
  rationale: 単なる質問ではなく、相手を試す意図を伴う分詞。「誘惑する」や「罠にかける」と断定せず、敵対的な吟味の含みを保つ。
- source_word: Καὶ
  choice: そして
  rationale: 物語の流れをつなぐ単純な接続として自然に訳す。
theological_decisions:
- issue: 婚姻に関する法的な問いにおけるἀνδρὶの訳
  choice: 男が
  alternative: 夫が自分の妻を
  rationale: 「男」と「夫」の語義的な曖昧さを本文と注で保持する。「男が妻を離縁する」という日本語で一般的な男性主体の法的問いを示しつつ、夫婦関係を明示する読みも注記する。
- issue: πειράζοντεςが示す意図の強さ
  choice: 試そうとして
  alternative: 罠にかけようとして
  rationale: 文脈上は敵対的な試みだが、原語そのものを「罠」とまで具体化せず、解釈を過度に固定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「離縁」によって婚姻を解消する他動詞的な法的行為を簡潔に表した。未完了過去は「尋ねていた」で示した。注番号は対応する文全体の直後に置いた。
