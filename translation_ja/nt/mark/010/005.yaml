  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「あなたがたの心のかたくなさのために[b]、モーセはあなたがたのためにこの戒め[c]を書いたのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「あなたがたの心がかたくなだったために」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「命令」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前のモーセへの言及を受けてイエスが応答する際の、穏やかな対比を表す。
- source_word: Πρὸς
  choice: ～ために
  rationale: 対格を伴い、彼らの状態を考慮した原因・理由を示す。現代日本語では因果関係を自然に伝えられる。
- source_word: σκληροκαρδίαν
  choice: 心がかたくなだった
  rationale: 「心」の比喩を保ちながら、頑迷さを明瞭で自然な日本語で表す。
- source_word: ἔγραψεν
  choice: 彼は……書いた
  rationale: 主語は前節のモーセだが、ギリシア語では名を繰り返していないため、本文でも「彼」として談話の流れを保つ。
- source_word: ὑμῖν
  choice: あなたがたのために
  rationale: 与格が示す受益・対象を自然な日本語で表し、この規定が彼らに向けて書かれたことを伝える。
- source_word: ἐντολὴν ταύτην
  choice: この戒め
  rationale: 特定のモーセ律法上の規定を指す指示性と、権威ある命令という法的な響きを保つ。
theological_decisions:
- issue: 「書いた」の主語であるモーセを本文で明示するか
  choice: ギリシア語と同様に「彼」とし、注でモーセを指すことを示す
  alternative: 本文で「モーセは」と明示する
  rationale: 前節から指示対象は分かるが、この節自体は名を繰り返していない。原文にない強調を加えず、談話上のつながりを保つ。
- issue: σκληροκαρδίαの聖書的比喩をどう保つか
  choice: 「心がかたくなだった」と訳す
  alternative: 「頑固だった」「強情だった」
  rationale: 道徳的・内面的な頑迷さを示す「心」のイメージを残しつつ、特定の教理的解釈を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言には丁寧で威厳のある「言われた」「のです」を採用した。「心」の比喩とモーセを指す暗黙の主語を保持し、必要な情報は脚注で補った。
