  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: ja
  text: らくだが針の穴を通るほうが、金持ちが神の国に入るよりも容易である。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「針の穴」は、文字どおり縫い針の糸を通す穴を指す。ここを「針の穴」と呼ばれる小さな門とする説明は、本文そのものには示されていない。
    reason: lexical_alternative
  - marker: b
    text: 「らくだ」を「綱」とする説もあるが、ここで採用されているギリシア語本文は「らくだ」と読んでいる。
    reason: alternative_reading
  - marker: c
    text: 「金持ち」に当たるギリシア語は男性単数形だが、この言葉は代表的な意味で用いられている。
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: よりも容易である
  rationale: 比較級の「より容易である」を自然な日本語で表し、誇張された比較の力を保つ。
- source_word: κάμηλον
  choice: らくだ
  rationale: 本文のκάμηλοςは「らくだ」を意味する。異綴りに基づく「綱」という提案ではなく、写本本文の鮮烈な比喩をそのまま訳す。
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: 針の穴を
  rationale: 縫い針の糸を通す穴を指す。「針の穴」は明瞭で定着した現代日本語であり、διάの通過経路は助詞「を」で自然に表せる。
- source_word: διελθεῖν
  choice: 通る
  rationale: 「通り抜ける」の意味を簡潔かつ自然に表し、具体的な動作のイメージを保つ。
- source_word: πλούσιον
  choice: 金持ち
  rationale: 男性単数の形容詞が名詞的に用いられ、「富んでいる者」を指す。日本語の「金持ち」は性別を不必要に限定せず、代表的な一人を自然に表せる。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国に
  rationale: 福音書の中心語句βασιλεία τοῦ θεοῦを、明瞭で定着した「神の国」と訳す。
- source_word: εἰσελθεῖν
  choice: 入る
  rationale: εἰσέρχομαιの意味を、「神の国」と自然に結び付く簡潔な日本語で表す。
theological_decisions:
- issue: らくだと針の穴の比喩の解釈
  choice: らくだと実際の縫い針の穴という、極端な不可能性を示す比喩をそのまま残す。
  alternative: エルサレムにあったとされる「針の穴」という小門への言及と解する、または「らくだ」を「綱」とする。
  rationale: ギリシア語本文は、らくだと針の穴を用いた強烈な誇張表現を示している。後代の門の伝承や本文にない緩和的解釈を訳文に持ち込まず、神の国に入ることをめぐる発言の緊張を保持する。
- issue: πλούσιονの指示範囲
  choice: 「金持ち」と訳し、男性単数形であることは注で示す。
  alternative: 「金持ちの男」として文法上の性を日本語本文に明示する。
  rationale: ギリシア語は男性単数だが、この格言的発言には代表的な力がある。日本語の「金持ち」はその両面を自然に保ち、性別に関する解釈を不必要に狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格言的で厳粛な響きを保つため、文末は「容易である」とした。比喩を説明的に言い換えたり弱めたりせず、原文の簡潔さと衝撃を維持した。
