  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: ja
  text: そして、二人は一つの肉となる。だから、彼らはもはや二人ではなく、一つの肉である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται ... εἰς
  choice: …となる
  rationale: εἰμίとεἰςを伴う結果的な結合を、現代日本語で自然に表す。「…である」よりも、二人が一つになるという推移を明確に伝える。
- source_word: οἱ δύο
  choice: 二人
  rationale: 定冠詞を伴う数詞が示す二者を簡潔に表し、後半の「もはや二人ではなく」との対比を保つ。
- source_word: σάρκα μίαν / μία σάρξ
  choice: 一つの肉
  rationale: 創世記からの引用との語句上のつながりを保ち、「一つの体」「一人」などの解釈的な言い換えを避ける。
- source_word: ὥστε
  choice: だから
  rationale: 先行文から導かれる帰結を、明瞭で自然な現代日本語として示す。
- source_word: οὐκέτι
  choice: もはや…ではなく
  rationale: 以前の状態が終わったことを簡潔かつ荘重に表す。
- source_word: ἀλλά
  choice: ではなく
  rationale: 「二人」と「一つの肉」の強い対比を自然な日本語の構文で示す。
theological_decisions:
- issue: 「一つの肉」が表す結婚の結合の範囲
  choice: 「一つの肉」という聖書的表現をそのまま保持する。
  alternative: 「一つの体」「一人となる」「性的に結ばれる」
  rationale: この句は結婚における結合を豊かに含意するが、本文自体はその意味を一側面に限定していない。解釈を狭めず、創世記との相互本文性と神学的な広がりを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、引用と結論の荘重さを保った。「一つの肉」は日常語としてやや特異だが、原文の比喩と創世記引用を保持するため直訳的にした。
