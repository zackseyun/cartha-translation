source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: ja
  text: イエスが道へ出て行かれると[a]、一人の男が駆け寄り、イエスの前にひざまずいて尋ねた。「善い先生、永遠の命を受け継ぐために、私は何をすればよいのでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスが旅に出ようとしておられると」。このギリシア語表現は、道へ出ることとも、旅を始めることとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: イエスが道へ出ようとしておられると
  rationale: 属格独立構文を主たる出来事の背景として自然に表し、εἰς ὁδόνが持ち得る「道へ出る」と「旅に出る」の両義性を本文と注で保持した。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: προσδραμὼν
  choice: 駆け寄り
  rationale: 男が急いで近づく生き生きとした動作を、簡潔で自然な現代日本語で表した。
- source_word: εἷς
  choice: 一人の男
  rationale: 男性単数の実体的用法を反映し、物語に一人の人物を導入する表現とした。
- source_word: γονυπετήσας αὐτόν
  choice: その前にひざまずいて
  rationale: 敬意または切実な願いを示す姿勢を明確にしつつ、原文以上に激しい動作を加えない表現とした。
- source_word: ἐπηρώτα αὐτόν
  choice: 尋ねた
  rationale: 未完了過去の形を過度に説明的にせず、日本語の物語として自然な完結表現を用いた。
- source_word: Διδάσκαλε ἀγαθέ
  choice: 善い先生
  rationale: διδάσκαλοςを「先生」、ἀγαθόςを「善い」とし、次節につながる「善」の語義を保った。「主」など原文にない強い称号は加えていない。
- source_word: τί ποιήσω
  choice: 私は何をすればよいのでしょうか
  rationale: 必要な行為を問う熟慮的な問いを、丁寧で自然な日本語にした。「何をしなければならない」と断定的にしすぎるのを避けた。
- source_word: ἵνα ζωὴν αἰώνιον κληρονομήσω
  choice: 永遠の命を受け継ぐために
  rationale: ἵναの目的関係を「ために」で明示し、κληρονομέωの相続・継承の比喩を「受け継ぐ」で保持した。ζωὴν αἰώνιονは定着した明瞭な表現「永遠の命」とした。
theological_decisions:
- issue: イエスへの呼びかけ
  choice: 善い先生
  alternative: 善い師／善い主
  rationale: 原文はδιδάσκαλεでありκύριεではないため、「主」を持ち込まず、次節で問題となるἀγαθέの意味も明示的に残した。
- issue: κληρονομήσωの表現
  choice: 受け継ぐ
  alternative: 得る／手に入れる
  rationale: 単なる獲得ではなく相続・継承を表す原語の比喩を保持しつつ、それが行為による功績を意味するかどうかは訳文で決めつけない。
- issue: εἷςの性別表現
  choice: 一人の男
  alternative: ある人／一人の人
  rationale: 男性単数形と物語上の人物描写に沿い、性別情報を平板化しない訳とした。
translation_notes:
  register: 明瞭な現代標準語を用い、会話は敬意を示す自然な丁寧体とした。「善い先生」「永遠の命」「受け継ぐ」など、後続文脈で重要な語を保ちながら、古風すぎる表現や教派的な用語を避けた。
