  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: ja
  text: イエスは言われた。「まことに、あなたがたに言います。わたしのため、また福音のために、家、兄弟、姉妹、母、父、子ども、畑を後にした者で、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη ὁ Ἰησοῦς
  choice: イエスは言われた
  rationale: φημίはここで発言を導く単純な語。日本語では、人物を先に置く「イエスは言われた」が自然で、敬意も保てる。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: 共観福音書に特徴的な厳粛な導入句を、現代日本語として理解しやすく、かつ定型性が伝わる形にした。単数形のἀμήνを「まことに」とした。
- source_word: οὐδείς ἐστιν ὃς
  choice: …者で、
  rationale: 否定の結論は次節へ続くため、本節だけで「一人もいません」と完結させず、関係節を「者で、」として開いたまま保った。
- source_word: ἀφῆκεν
  choice: 後にした
  rationale: 文脈上、家族関係や所有物を弟子として離れることを表す。「捨てた」「見捨てた」ほど強く家族への責任放棄を含意せず、「離れた」よりも列挙される対象に一貫して自然。
- source_word: οἰκίαν
  choice: 家
  rationale: 住居または家屋を指す直接的で自然な訳。
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: 兄弟、姉妹
  rationale: 原文は男性きょうだいと女性きょうだいを別々に列挙しているため、その区別を保った。
- source_word: μητέρα ἢ πατέρα
  choice: 母、父
  rationale: 原文の語順と個別の家族関係を保持した。
- source_word: τέκνα
  choice: 子ども
  rationale: 性別を限定しない子孫・子を表すため、自然な包括語を用いた。
- source_word: ἀγρούς
  choice: 畑
  rationale: 耕作地を表す具体的な語として原語に近い。「農場」より解釈を加えず、「土地」より範囲を広げない。
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: わたしのため、また福音のために
  rationale: 二度繰り返されるἕνεκενの理由・目的を明示し、イエスと福音という二つの表現をともに保持した。
theological_decisions:
- issue: 家族や財産を離れる行為の強さ
  choice: 後にした
  alternative: 捨てた／見捨てた
  rationale: 弟子として払う犠牲の重みを保ちつつ、家族への道徳的責任を全面的に放棄するという、本文に明示されない意味を加えないため。
- issue: 否定構文が次節まで続くこと
  choice: 「…者で、」として文を未完のまま次節へつなぐ
  alternative: 「そのような者は一人もいません」と本節内で完結させる
  rationale: 原文のοὐδείς ἐστιν ὃςは次節のἐὰν μὴ λάβῃと一体となる構文であり、29節だけで否定を完結すると意味が反転または欠落するおそれがある。節末の統語的な張力を保存した。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの発言には自然な敬体を用い、厳粛さを保った。本節は原文どおり次節に続く未完の文なので、閉じ引用符を置かず読点で終えた。
