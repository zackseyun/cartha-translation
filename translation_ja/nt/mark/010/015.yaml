  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ja
  text: まことに、あなたがたに言います。神の国を子どものように[a]受け入れない者は、決してそこに入ることはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子どもとして」。この表現は、子どものような謙遜、信頼、依存などを示すとも考えられるが、ギリシア語本文はどの意味合いかを特定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: 厳粛で権威ある言明を導く語として、原語の機能を自然で格調ある現代日本語で表した。ここでは一度だけ用いられているため、重ねて訳さない。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 現在形の動詞と複数の与格代名詞を明確かつ自然に訳した。
- source_word: ὃς ἂν
  choice: …者は
  rationale: 関係代名詞とἄνによる不定・一般化の意味を、日本語の一般条件を表す言い方で示した。
- source_word: μὴ δέξηται
  choice: 受け入れない
  rationale: δέχομαιの受容する意味を保ち、神の国を自力で獲得するのではなく受け取るという比喩を伝える。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 共観福音書で定着した自然な表現であり、神の支配とその領域の両面を一方に限定しない。
- source_word: ὡς παιδίον
  choice: 子どものように
  rationale: ὡςの比較の働きを素直に表し、どのような子どもの性質が念頭にあるかは本文どおり特定しない。
- source_word: οὐ μὴ εἰσέλθῃ
  choice: 決して…入ることはありません
  rationale: οὐ μήとアオリスト接続法による強い否定を、古風にならない明確な日本語で表した。
- source_word: εἰς αὐτήν
  choice: そこに
  rationale: 代名詞の指示対象が直前の「神の国」であることを自然な日本語で明示し、εἰςの方向性も保った。
theological_decisions:
- issue: 神の国を「子どものように」受け入れることの意味
  choice: 比喩をそのまま残し、子どものどの性質を指すかは特定しない。
  alternative: 謙遜、信頼、または依存を明示して訳す。
  rationale: ギリシア語は比較を述べるだけで、その具体的な観点を限定していない。特定の解釈や教派的理解を本文に持ち込まず、原文の含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい格調を保った。「まことに」はやや改まった語だが、宗教的な音写語に頼らずἀμήνの機能を伝えるために採用した。
