  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: ja
  text: しかし、わたしの右または左に座ることは、わたしが与えることではない[a]。それは、備えられている人々のためのものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしが与えるものではない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: 座ること
  rationale: 冠詞付き不定詞の名詞的用法を、自然な現代日本語の「座ること」で表した。動作性も保たれる。
- source_word: ἐκ δεξιῶν μου ἢ ἐξ εὐωνύμων
  choice: わたしの右や左に
  rationale: 左右の位置を示す並列表現として簡潔かつ自然。「右の手」という語は原文に明示されていないため補わない。
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: わたしが与えることではない
  rationale: 権限または役割の帰属を否定する構文を直截に訳し、否定の範囲について原文以上の説明を加えない。
- source_word: ἀλλ’ οἷς
  choice: それは、…人々のためのものである
  rationale: ἀλλά以下の省略を日本語で補って対照を明確にした。「与えられる」と補うよりも、原文の簡潔さと受益者を示す与格的意味を保つ。
- source_word: ἡτοίμασται
  choice: そう定められている
  rationale: 完了受動の、すでになされた準備が現在も有効である含意を自然な日本語で表現した。文脈上は席が特定の人々のために備えられていることを示す。
theological_decisions:
- issue: イエスの発言を、権限の絶対的否定として訳すか、物語上の限定として訳すか
  choice: 「わたしが与えることではない」と限定説明を加えずに訳す
  alternative: 「父のみこころを離れて、わたしが与えるものではない」
  rationale: 原文は制限の理由や範囲を明示しない。父のみこころへの言及などを補うと神学的調和を本文に持ち込むため、原文の緊張を保つ。
- issue: ἡτοίμασται の行為者
  choice: 受動表現のまま、準備した主体を明示しない
  alternative: 「神が定めておられる」
  rationale: 原文は行為者を明記していない。神的受動と理解できる可能性はあるが、訳文では主体を補わず、真正な曖昧さを保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「しかし」で前節との対照を示し、原文の省略は二文に分けて自然に補った。脚注標識[a]は該当箇所に置いた。
