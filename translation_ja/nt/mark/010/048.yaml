base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ja
  text: 多くの人が、彼が黙るようにと何度も叱った。しかし彼は、なおいっそう叫び続けた。「ダビデの子[a]よ、私をあわれんでください！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ダビデの子」は王的・メシア的な称号。「メシア」と意味を表すこともできるが、ここではギリシャ語の表現をそのまま訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: 叱りつけた
  rationale: 未完了時制が示す継続的・反復的な動作は文脈から伝わるようにしつつ、彼を黙らせようとする強い制止の語感を保った。
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 実体詞的に用いられた形容詞を直接的に訳し、原文にない「群衆」という集合名詞は補わなかった。
- source_word: ἵνα σιωπήσῃ
  choice: 黙るようにと
  rationale: 叱りつけた目的を自然な現代日本語で示し、目的を表すἵναの働きを保った。
- source_word: πολλῷ μᾶλλον
  choice: なおいっそう
  rationale: 比較を強める表現を自然に訳し、原文が明示していない声量の増大までは付け加えなかった。
- source_word: ἔκραζεν
  choice: 叫び続けた
  rationale: 未完了時制による継続性と、κράζωの切迫した強い呼びかけを表した。
- source_word: Υἱὲ Δαυίδ
  choice: ダビデの子
  rationale: 王的・メシア的含意を持つ称号を「メシア」と解釈的に置き換えず、原文の表現をそのまま保った。
- source_word: ἐλέησόν με
  choice: 私をあわれんでください
  rationale: 切実な命令形の願いを、明瞭で尊厳のある現代日本語として表した。
theological_decisions:
- issue: 「ダビデの子」のメシア的意義
  choice: 称号を「ダビデの子」として保持する。
  alternative: 「メシア」と意訳する。
  rationale: ギリシャ語本文はΥἱὲ Δαυίδという称号そのものを用いているため、その王的・メシア的響きを読者が文脈から受け取れるよう、解釈で置き換えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、切迫した場面にふさわしい力強さと聖書本文としての品位を両立させた。「叫び続けた」により未完了時制の継続性を自然に示した。
