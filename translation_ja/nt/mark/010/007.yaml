  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: ja
  text: 『それゆえ、男は父と母を離れ、妻と結ばれる。[a]』[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「妻に固く結び付く」。ギリシア語の動詞は、密接な結び付きを強調し得る。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本は「そして妻に結ばれる」を欠く。
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: それゆえ
  rationale: 理由から導かれる帰結を示す表現として、簡潔で格調を保った現代日本語。
- source_word: καταλείψει
  choice: 離れ
  rationale: 親を見捨てるという否定的含意を不必要に加えず、親元を離れる意味を自然に表す。
- source_word: ἄνθρωπος
  choice: 男
  rationale: 語自体は広く「人」を意味し得るが、ここでは「その妻」と対になる結婚の文脈により男性を指す。
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: 父と母
  rationale: 日本語では所有者が文脈上明らかなため「自分の」を補わずとも、原文の意味が自然に伝わる。
- source_word: προσκολληθήσεται
  choice: 結び合わされる
  rationale: 受動形を保ちつつ、婚姻における密接な結合を自然に表す。「固く結ばれる」という訳も可能。
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: 妻と
  rationale: 結婚の文脈なので γυνή は「女性」ではなく「妻」。日本語では「結び合わされる」と自然に結び付く助詞「と」を用いる。
theological_decisions:
- issue: 結婚についての引用における性別を示す表現
  choice: 男……妻
  alternative: 人……配偶者
  rationale: 直近の文脈と「その妻」という表現が男女の婚姻関係を明示しているため、性別を中立化しない。
- issue: προσκολληθήσεται の受動表現
  choice: 結び合わされる
  alternative: 固く結ばれる／妻に寄り添う
  rationale: 原文の文法的受動態を保ち、誰が結び合わせるのかを本文で明示せず、原文にある神学的含みと曖昧さを保持する。
translation_notes:
  register: 引用文としてかぎ括弧を用いた。明瞭で現代的ながら、聖書本文にふさわしい簡潔で dignified な文体とした。
