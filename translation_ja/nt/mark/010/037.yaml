  source_fidelity: 原文の「彼らは」（直前の文脈ではヤコブとヨハネ）を「二人は」と明確化するのは適切です。願いを表す Δὸς ἡμῖν ἵνα ... καθίσωμεν は、「…座らせてください」により自然な日本語として忠実に表現されています。「あなたの右に、もう一人を左に」は、ἐκ δεξιῶν／ἐξ ἀριστερῶν の対置と、一人ずつ座ることを保っています。ἐν τῇ δόξῃ σου も「あなたの栄光の中で」と訳し、時・王国・即位などへ限定していません。
  naturalness: 明瞭で現代標準日本語として自然です。「二人はイエスに言った」と願いの直接話法のつながりも滑らかです。「あなたの栄光の中で」はやや直訳的な響きを持ちますが、日本語として不自然ではなく、原文の開かれた表現を保持するために有益です。
  terminology: 「イエス」「栄光」は一貫しており、神学的・教派的な補足はありません。「右に…左に」は原文どおり位置関係を表し、「地位」や「座」などの解釈的語を加えていません。
