  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: ja
  text: 二人はイエスに言った。「あなたの栄光の中で、私たちの一人をあなたの右に、もう一人を左に座らせてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 二人は
  rationale: 直訳は「彼らは」だが、直前の文脈で話者がヤコブとヨハネの二人であるため、現代日本語では自然かつ明確に「二人は」とした。
- source_word: Δὸς ἡμῖν ἵνα ... καθίσωμεν
  choice: 私たちの一人を…もう一人を…座らせてください
  rationale: 字義的には「私たちに、私たちが座ることを与えてください」だが、願いの内容を日本語で自然に表した。命令形の願いとしての強さも保っている。
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: あなたの右に…左に
  rationale: 座席上の位置を表す慣用的な日本語。原文は「右側」「左側」に相当し、「右の座」「左の座」などの補足は加えなかった。
- source_word: ἐν τῇ δόξῃ σου
  choice: あなたの栄光の中で
  rationale: ἐν の空間的・状況的な含みと「栄光」の神学的広がりを保ち、「栄光を受ける時」「王国」などと解釈的に限定しなかった。
theological_decisions:
- issue: 「あなたの栄光」の時点・性質
  choice: あなたの栄光の中で
  alternative: あなたが栄光をお受けになる時に／あなたの栄光の王国で
  rationale: 弟子たちが地上的な王権を想定した可能性と、物語が受難・復活を通して示す栄光との緊張を、訳文で一方に決めずに残した。
- issue: 左右の席の権威的含意
  choice: 右に…左に
  alternative: 右の座に…左の座に
  rationale: 高位や栄誉の含意は文脈から伝わるため、原文にない「座」「地位」などを補って解釈を固定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語。願いの大胆さを保ちながら、過度に古風な「賜わる」や説明的な言い換えを避けた。「イエス」はこの一節単独でも指示対象が明確になるよう文脈上の代名詞を実名化した。
