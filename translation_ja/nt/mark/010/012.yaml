  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: ja
  text: また、妻が夫と離婚し[a]、別の男と結婚するなら、姦淫を犯します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「離婚し」は、より字義的には「夫を去らせて（送り出して）」。この婚姻の文脈では、「離婚する」という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節の夫についての発言と並行する妻についての発言を結ぶ接続語として、自然な現代日本語にした。
- source_word: ἐὰν
  choice: なら
  rationale: 条件を示す語として、日本語の文脈に自然な「なら」を用いた。
- source_word: αὐτὴ
  choice: 妻が
  rationale: ギリシア語の明示的な女性主語を保ち、前節との対比と婚姻関係を明確にした。
- source_word: ἀπολύσασα
  choice: 離婚して
  rationale: 字義的には「去らせる、解放する」だが、この婚姻文脈では離婚を意味するため、現代日本語で明確に訳した。
- source_word: τὸν ἄνδρα αὐτῆς
  choice: 夫と
  rationale: ἀνήρは「男」と「夫」の両義を持つが、所有表現を伴う婚姻文脈なので「夫」が適切。「離婚する」の自然な格として「と」を用いた。
- source_word: γαμήσῃ ἄλλον
  choice: 別の男と結婚する
  rationale: ἄλλονは男性形であり、別の男性を指すことを明示して原文の性別の具体性を保った。
- source_word: μοιχᾶται
  choice: 姦淫を犯すことになります
  rationale: 現在形の一般的・帰結的な力を、条件文に続く自然で品位ある日本語として表した。
theological_decisions:
- issue: 発言の性別に特定された表現を保つか
  choice: 「妻が夫と離婚して別の男と結婚する」と明示する
  alternative: 「配偶者と離婚して別の人と結婚する」と中性化する
  rationale: 原文は女性主語、夫、別の男性を明示しており、前節の男性についての発言との意図的な並行関係を保つため。
- issue: ἀπολύωを字義どおりにするか婚姻上の用語で訳すか
  choice: 「離婚する」と訳す
  alternative: 「夫を去らせる」「夫を追い出す」
  rationale: この文脈は単なる別居や退去ではなく婚姻の解消を扱うため、「離婚する」が意味を正確かつ自然に伝える。
- issue: μοιχᾶταιの法的・道徳的断定をどう表すか
  choice: 「姦淫を犯すことになります」とする
  alternative: 「姦淫を犯します」「姦淫していることになります」
  rationale: 条件文の帰結としての断定を保ちつつ、日本語で不必要な継続相を加えない表現とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「姦淫」は日常語より硬いが、意味の精度と聖書文体を考慮して採用した。脚注記号[a]は、「離婚して」に関する注であることが分かる位置に置いた。
