  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: ja
  text: 十人はこれを聞くと、ヤコブとヨハネのことで[a]腹を立て始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤコブとヨハネに対して」、または「ヤコブとヨハネが原因で」とも訳せる。ギリシャ語の前置詞は、憤りの向けられた相手とも、そのきっかけとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （文脈上、独立した「そして」は置かず）
  rationale: 前後をつなぐ標準的な接続詞。日本語では「これを聞くと」という連続表現に流れを担わせる方が自然であり、接続関係は保たれる。
- source_word: ἀκούσαντες
  choice: これを聞くと
  rationale: 主動詞に先立つアオリスト分詞を自然な時の節で表した。目的語は直前の出来事を指すものとして文脈から補った。
- source_word: οἱ δέκα
  choice: 十人
  rationale: 原文は文字どおり「十人」であり、「ほかの十人」や「十人の弟子たち」とは明示していないため、その簡潔さを保った。
- source_word: ἤρξαντο
  choice: 始めた
  rationale: 不定詞とともに反応の開始を示す語であり、その起点を明示した。
- source_word: ἀγανακτεῖν
  choice: 腹を立て
  rationale: 強い不快感や憤りを表す。現代の一般読者に明瞭で自然な「腹を立てる」を選び、単なる軽い不満には弱めなかった。
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: ヤコブとヨハネのことで
  rationale: περίは憤りの対象とも契機とも取り得る。「のことで」はその両義性をある程度保つため、注で「に対して」「が原因で」の可能性を示した。
- source_word: Ἰακώβου
  choice: ヤコブ
  rationale: 日本語聖書で広く定着した人名表記。
- source_word: Ἰωάννου
  choice: ヨハネ
  rationale: 日本語聖書で広く定着した人名表記。
theological_decisions:
- issue: 十人の憤りが向けられた対象と、そのきっかけの関係
  choice: 「ヤコブとヨハネのことで」とし、方向と原因を断定しない
  alternative: 「ヤコブとヨハネに対して」または「ヤコブとヨハネが原因で」
  rationale: 原文の前置詞περίは、この文脈で憤りの対象または契機を示し得る。本文で一方だけに限定せず、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準語を用いた。「憤慨する」より日常的で理解しやすい「腹を立てる」を選びつつ、「始めた」によって原文の反応開始のニュアンスを保持した。
