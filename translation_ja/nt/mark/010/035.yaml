  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: ja
  text: ゼベダイの息子であるヤコブとヨハネがイエスに近寄って言った。「先生、私たちがお願いすることを、何でもしていただきたいのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: イエスに近寄って
  rationale: 複合動詞が表す、相手の方へ移動して近づく意味を自然な現代日本語で示した。歴史的現在は日本語の物語として自然な過去形相当の流れにした。
- source_word: Ἰάκωβος καὶ Ἰωάννης οἱ υἱοὶ Ζεβεδαίου
  choice: ゼベダイの息子ヤコブとヨハネ
  rationale: 同格による人物特定を保ちつつ、日本語として自然な語順にした。
- source_word: λέγοντες αὐτῷ
  choice: 言った
  rationale: ギリシア語の分詞を、日本語の物語文で自然な定動詞として訳した。相手は直前の「イエスに」で明らかなため、重複する「イエスに言った」とはしなかった。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 教える者への呼びかけとして、現代日本語で平明かつ自然な「先生」を用いた。「師」や「師匠」より日常的で、教育者という意味を明確に伝える。
- source_word: θέλομεν
  choice: していただきたいのです
  rationale: 直訳的な「私たちは望みます」より自然で、願いを本人に直接述べる場面の意志と要求を保つ。丁寧表現は呼びかけの関係に合うが、願いの大胆さを弱めすぎない形とした。
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: 私たちがお願いすることを、何でも
  rationale: 関係代名詞とἐάνが示す不定性を「何でも」で表した。αἰτέωはこの対人場面では「お願いする」が自然である。
- source_word: ποιήσῃς ἡμῖν
  choice: していただきたい
  rationale: ποιέωの広い意味を「する」で保ち、ἡμῖνの受益関係は日本語の授受表現「いただく」によって示した。「かなえる」は含意を明示しすぎるため避けた。
