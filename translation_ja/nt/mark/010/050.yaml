  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: ja
  text: 彼は上着[a]を脱ぎ捨て、跳び上がってイエスのもとに来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「外衣」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: 脱ぎ捨て
  rationale: 衣服を身から外して投げ捨てるような、決然とした素早い動作を自然な日本語で表す。単なる「脱いで」より原文の勢いを保つ。
- source_word: ἱμάτιον
  choice: 上着
  rationale: 当時、衣服の上にまとう外衣を指す語であり、現代の一般読者に明瞭な「上着」とした。
- source_word: ἀναπηδήσας
  choice: 跳び上がって
  rationale: 急に勢いよく立ち上がる動作を表し、人物の即座の反応を保つ。
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: イエスのもとに来た
  rationale: イエスへ向かう移動と到達を、自然で簡潔な日本語にした。
- source_word: δὲ
  choice: 彼は
  rationale: δέはここでは物語を進める弱い接続辞である。日本語では接続語を明示せず、主題提示によって流れを自然にした。
