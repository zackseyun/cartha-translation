source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: ja
  text: あなたは戒めを知っています。『殺人を犯してはならない[a]。姦淫してはならない。盗んではならない。偽証してはならない。不当に奪ってはならない[b]。父と母を敬いなさい。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「殺してはならない」とも訳せる。ここで用いられているギリシア語は、一般的な「殺す」よりも、特に不法に人を殺すこと、すなわち殺人を指す。
    reason: lexical_alternative
  - marker: b
    text: 「だまし取ってはならない」「搾取してはならない」とも訳せる。正当に他者のものである物や報酬を取り上げたり、与えずに差し控えたりすることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολάς
  choice: 戒め
  rationale: 十戒を明確に踏まえた文脈に合い、現代日本語でも聖書の命令を自然に表す。
- source_word: οἶδας
  choice: 知っているでしょう
  rationale: οἶδα は完了形に由来するが、ここでは現在の認識を表す。相手も承知している事柄を挙げる語調を日本語で自然に示した。
- source_word: Μὴ φονεύσῃς
  choice: 殺人を犯してはならない
  rationale: φονεύω は殺す行為全般よりも、不法に人を殺すこと、すなわち殺人を指すため、「殺してはならない」より意味を限定した。
- source_word: Μὴ μοιχεύσῃς
  choice: 姦淫してはならない
  rationale: 婚姻関係を破る性的行為を指す法的・倫理的な語であり、十戒の文体にも合う。
- source_word: Μὴ κλέψῃς
  choice: 盗んではならない
  rationale: κλέπτω の簡潔で直接的な対応表現。
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: 偽証してはならない
  rationale: 単なる虚言ではなく、偽りの証言をするという法廷・証言上の含みを保つ。
- source_word: Μὴ ἀποστερήσῃς
  choice: 不当に奪ってはならない
  rationale: 他者に正当に属するものを取り上げたり、与えるべきものを差し控えたりする意味を、「だまし取る」だけに狭めず表した。
- source_word: Τίμα
  choice: 敬いなさい
  rationale: 単なる礼儀や尊重以上に、親にふさわしい重きを置くという十戒の命令を表す定着した自然な表現。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: 父と母
  rationale: 二つの定冠詞と所有代名詞を、日本語で冗長にならない自然な対句として訳した。文脈上、自分の父母であることは明白。
theological_decisions:
- issue: 十戒の引用・言及の文体
  choice: 十戒として認識しやすい簡潔な命令形を用いつつ、各ギリシア語の意味範囲を保つ
  alternative: 伝統的な定型句を意味の差を示さずそのまま用いる、または現代的に大きく言い換える
  rationale: この一覧が十戒を踏まえていることを読者に伝えながら、φονεύω と ἀποστερέω の語義を過度に一般化したり狭めたりしないため。
- issue: ἀποστερέω の倫理的範囲
  choice: 不当に奪ってはならない
  alternative: だまし取ってはならない／搾取してはならない
  rationale: 欺きによる詐取だけでなく、正当に他者のものである物や報酬を取り上げる、または差し控える場合も含み得る曖昧さを保った。
translation_notes:
  register: 明瞭で格調のある現代標準語。十戒を想起させる「〜してはならない」を反復し、最後だけギリシア語の肯定命令に合わせて「敬いなさい」とした。引用符は、イエスが既知の戒めを列挙している構造を読み取りやすくするために用いた。
