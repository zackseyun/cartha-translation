  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: ja
  text: イエスは彼らに答えた。「モーセはあなたがたに何と命じましたか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 穏やかな接続を示し、直前の問いを受けてイエスが応答する場面の展開を、現代日本語で自然に表す。
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えた
  rationale: 逐語的には「答えて言った」だが、応答の意味を保ちながら、重複感のない自然な日本語にまとめた。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 応答の相手を示す与格を、自然な日本語の間接目的語として訳した。
- source_word: Τί
  choice: 何と
  rationale: 命令の内容を問う疑問代名詞であり、「何と命じましたか」が明快で自然である。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 命令を受けた者たちを明示する与格として訳した。
- source_word: ἐνετείλατο
  choice: 命じましたか
  rationale: 権威ある命令・規定を表す語であり、モーセ律法をめぐる文脈に適した「命じる」を採用した。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で広く定着している固有名表記を用いた。
theological_decisions:
- issue: イエスの返答におけるモーセの権威への言及
  choice: 原文どおり、命令の媒介者として「モーセ」を明記する。
  alternative: 「モーセの律法は」「神はモーセを通して」などと説明的に補う。
  rationale: ギリシア語本文はモーセを名指ししているが、「律法」や「神を通して」という説明は明記していないため、神学的な補足を加えず原文の表現を保った。
translation_notes:
  register: 明快で現代的な標準日本語を用いつつ、対話としての品位を保つため丁寧体の疑問文とした。主語「イエス」はこの節のギリシア語本文では代名詞的に省略されているが、直前の文脈における話者を日本語で明瞭にするため補った。
