  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ja
  text: 実に、人の子も、仕えられるためではなく、仕えるために、また多くの人のための贖いの代価として[a]自分の命を与えるために来たのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「多くの人の身代わりとなる贖いの代価として」。原文の前置詞には、交換または身代わりの意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 人の子も
  rationale: γάρの説明・根拠提示の働きは文末の「のです」で自然に表し、καίの強調・包含は「も」で示した。直訳調の接続句を避けつつ、直前の教えをイエス自身の模範によって根拠づける流れを保つ。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの定着した自己呼称であり、ダニエル書との響きも保つ標準的な訳語。
- source_word: οὐκ ἦλθεν
  choice: 来たのです
  rationale: 基本義を保ち、後続する目的の不定詞と結び付けた。「のです」によりγάρの説明的な力も日本語として自然に表した。
- source_word: διακονηθῆναι
  choice: 仕えられるため
  rationale: 受動態を明示し、後続の「仕える」と同じ語根を用いて対照を鮮明にした。
- source_word: ἀλλὰ διακονῆσαι
  choice: ではなく、仕えるために
  rationale: ἀλλάの強い対照を「ではなく」で示し、簡潔で現代的な表現とした。
- source_word: δοῦναι
  choice: 与える
  rationale: 動詞の基本的な意味をそのまま表し、原文に明示されない「引き渡す」などの限定的含意を加えない。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自分の命
  rationale: ここでψυχήは死に至るまで差し出される生命を指すため、「魂」ではなく文脈に即した「命」とした。再帰的な所有関係は「自分の」で自然に示した。
- source_word: λύτρον
  choice: 贖いの代価
  rationale: 解放のために支払われる代価という語義と神学的な重みを保つ。「身代金」よりも誘拐事件などへの連想が弱く、聖書文体としても明瞭である。
- source_word: ἀντὶ πολλῶν
  choice: 多くの人の身代わりとなる
  rationale: ἀντίが持つ交換・代理の力を、「ため」だけで弱めずに表した。一方、訳語による解釈の固定化を避けるため、より広い日本語表現を脚注に掲げた。
theological_decisions:
- issue: 贖いの言葉におけるἀντίの意味
  choice: 本文では「多くの人の身代わりとなる」とし、交換・代理の含意を明示する。
  alternative: 多くの人のための
  rationale: ἀντίの最も自然な語義は交換または身代わりを示す。ただし、この句が持つ射程を特定の贖罪理論に限定せず、一般的で自然な別訳を脚注に残して解釈上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの自己呼称「人の子」と「贖いの代価」という格調ある聖書語彙を保持した。「仕えられる／仕える」の反転を同じ語で示し、原文の修辞を聞き取りやすくした。
