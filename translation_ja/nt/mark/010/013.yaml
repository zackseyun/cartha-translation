source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: ja
  text: 人々は、イエスに触れていただこうと、子どもたち[a]を連れて来ていた。ところが、弟子たちはその人々を叱った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幼い子どもたち」とも訳せる。ギリシア語の παιδία は、幼い子を含め、広く子どもを指すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: 連れて来ていた
  rationale: 未完了時制が示す、過去における継続的または反復的な動作を自然な日本語で表した。ここでは、人をある方のもとへ連れて来るという意味である。
- source_word: παιδία
  choice: 子どもたち
  rationale: 幼い子を含み得る広い語であり、「子どもたち」が意味を狭めすぎない自然な訳である。
- source_word: ἵνα αὐτῶν ἅψηται
  choice: イエスに触れていただこうと
  rationale: ἵνα＋接続法の目的を表し、ἅπτομαιの直接的な意味である「触れる」を保った。並行箇所から「手を置く」を補わない。敬意を伴う日本語として「いただく」を用いた。
- source_word: ἐπετίμησαν
  choice: 叱った
  rationale: 強くたしなめ、非難する行為を、現代の一般読者に明瞭な日本語で表した。
- source_word: αὐτοῖς
  choice: その人々を
  rationale: 文脈上、子どもたちを連れて来ていた人々を指すと理解するのが最も自然である。
- source_word: δὲ
  choice: ところが
  rationale: 人々の行動と弟子たちの反応との対照を、自然な物語調で示した。
theological_decisions:
- issue: 弟子たちが叱った相手
  choice: 子どもたちを連れて来ていた人々
  alternative: 子どもたち
  rationale: αὐτοῖςだけなら形態上は複数の指示対象が可能だが、直前の「連れて来ていた」の主体を受けると見るのが文脈と物語の流れに最もよく合うため、「その人々」とした。
translation_notes:
  register: 明瞭で現代的かつ品位のある物語文。「みもと」などの古風な宗教語を避けつつ、イエスへの依頼の含みは「触れていただこうと」で自然に表した。
