id: MRK.10.27
reference: Mark 10:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: ja
  text: イエスは彼らを見つめて言われた。「人には不可能だが、神にはそうではない。神にはすべてのことが可能だからである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: 彼らを見つめて
  rationale: ἐμβλέπωの、意識を向けてじっと見るという意味を、自然な現代日本語で表した。
- source_word: Παρὰ ἀνθρώποις
  choice: 人には
  rationale: παρά＋与格が示す領域・側を、日本語として簡潔に表現した。ここでのἄνθρωποιは性別を限定しない人間一般を指す。
- source_word: ἀδύνατον
  choice: 不可能だ
  rationale: 補語のみの簡潔な原文を保ち、何が不可能かは直前の文脈に委ねた。
- source_word: ἀλλ’ οὐ παρὰ θεῷ
  choice: だが、神にはそうではない
  rationale: 原文がδύνατονを明示せず否定する構造を保ちつつ、日本語で意味が通るよう「そうではない」とした。
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: 神にはすべてのことが可能だからである
  rationale: γάρの理由説明を「だからである」で示し、πάνταの広い表現を保持した。
theological_decisions:
- issue: 「すべてのこと」の範囲
  choice: 限定語を補わず「すべてのこと」と訳す
  alternative: 「救いに関するすべてのこと」などと文脈上の範囲を明示する
  rationale: 直前の文脈は救いについてだが、本文自体のπάνταは限定を明示していないため、解釈上の範囲を訳文で狭めなかった。
- issue: 神における可能性の表現
  choice: 「神にはすべてのことが可能」
  alternative: 「神は何でもおできになる」
  rationale: 後者も自然だが、原文は「神のもとでは／神には」という並行構造を用いるため、「人には」との対照を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「人には／神には」という対照と、γάρによる理由説明を明示した。
