  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: ja
  text: しかし、弟子たちはイエスのことばに驚いていた。イエスは再び彼らに答えて言われた。「子どもたちよ、神の国に入るのは、なんと難しいことか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「子どもたちよ、富に頼る者が神の国に入るのは、なんと難しいことか」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: 驚いていた
  rationale: 未完了時制が示す持続的な反応を自然な現代日本語で表し、動詞の強さも保つ。
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: イエスのことばに
  rationale: ἐπί＋与格が驚きの対象・根拠を示すため、「ことばに」と簡潔に訳した。指示対象を明瞭にするため、代名詞は「イエス」とした。
- source_word: πάλιν
  choice: もう一度
  rationale: イエスが再び語るという談話の流れを、自然な日本語で明示する。
- source_word: ἀποκριθεὶς λέγει
  choice: そこでイエスは…彼らに言われた
  rationale: 直訳的な「答えて言った」は現代日本語では重いため、文脈への応答性を「そこで」で示し、発話を「言われた」とした。
- source_word: Τέκνα
  choice: 子どもたちよ
  rationale: 親愛を込めた呼びかけを保ちつつ、原文にない所有表現「わたしの」を加えない。
- source_word: πῶς δύσκολόν ἐστιν
  choice: なんと難しいことか
  rationale: πῶςの感嘆的な強調とδύσκολονの意味を、格調を保った自然な日本語で表す。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: 神の国に入るのは
  rationale: 不定詞句の内容を日本語の主題として自然に提示し、「神の国に入る」という定着した明瞭な表現を用いる。
theological_decisions:
- issue: 「富に頼る者が」という長い読みを本文に含めるか
  choice: SBLGNTの短い読み「神の国に入るのは、なんと難しいことか」を本文とする。
  alternative: 「子どもたちよ、富に頼る者が神の国に入るのは、なんと難しいことか。」
  rationale: 指定された原語本文を優先し、意味を富への信頼に限定する説明的な異読を本文へ取り込まない。解釈に関わる重要な異読なので脚注に残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「子どもたちよ」で親愛を込めた呼びかけを保ち、「なんと難しいことか」で原文の感嘆と神学的緊張を弱めずに表した。
