source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ja
  text: イエスは彼をじっと見つめ、彼を愛して言われた。「あなたに欠けていることが一つある。行って、持っているものをすべて[a]売り、貧しい人々に与えなさい。そうすれば、あなたは天に宝を得るでしょう。そして、来て、わたしに従いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「持っているものは何でも」。ギリシア語のὅσα ἔχειςは「持っているものは何でも」または「持っているものをすべて」と訳せる。文脈上、彼の所有物全体が視野に入っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: 彼をじっと見つめ
  rationale: ἐμβλέπωは相手に目を向けて注意深く見ることを表す。「じっと見つめる」は、過度な感情を加えず、視線の明確さを自然な日本語で伝える。
- source_word: ἠγάπησεν αὐτόν
  choice: 愛を抱いて
  rationale: 動詞が明言するイエスの真実な愛を保つ。「愛して」とすることも可能だが、直後の発話とのつながりが自然になるよう「愛を抱いて」とした。
- source_word: Ἕν σε ὑστερεῖ
  choice: あなたに欠けていることが一つある
  rationale: 中性単数ἕνを「ことが一つ」と補い、ὑστερεῖの不足を日本語として明瞭に表した。
- source_word: ὅσα ἔχεις
  choice: 持っているものをすべて
  rationale: ὅσαは「持っているものは何でも／すべて」を表し得る。文脈上、所有物全体が範囲に入るため「すべて」としたが、語句の別訳は脚注に示した。
- source_word: δὸς τοῖς πτωχοῖς
  choice: 貧しい人々に与えなさい
  rationale: 実体詞的なτοῖς πτωχοῖςを、現代日本語で人物を明確にする「貧しい人々」と訳した。
- source_word: ἕξεις θησαυρὸν ἐν οὐρανῷ
  choice: 天に宝を持つことになる
  rationale: 未来形ἕξειςを保ち、場所を表すἐν οὐρανῷを「天に」とした。「宝」は単数だが、日本語では不定冠詞に相当する表現を加える必要がない。
- source_word: δεῦρο ἀκολούθει μοι
  choice: それから、来て、わたしに従いなさい
  rationale: δεῦροの招きを「来て」、現在命令形ἀκολούθειの継続的な弟子としての召しを自然な「従いなさい」で表した。「それから」は一連の命令の順序を明瞭にする。
theological_decisions:
- issue: イエスがこの人を愛したことの意味
  choice: 「愛を抱いて」と、真実な愛として直接表現する。
  alternative: 単なる親切な態度とする、または特定の組織神学上の選びの愛と限定する。
  rationale: ἠγάπησεν αὐτόνは愛を明言する。これを弱めたり、本文が明示しない教理的限定を加えたりせず、厳しい命令との緊張をそのまま保つ。
- issue: 所有物についての命令の範囲
  choice: 「持っているものをすべて」として包括的な範囲を示す。
  alternative: 一般的な施しの勧めに弱める、または語句を「持っているものは何でも」と訳す。
  rationale: ὅσα ἔχειςは形式上別様にも訳せるが、文脈では彼の所有物全体を指す。命令の強さを保ちつつ、別訳を脚注で示す。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。命令は率直に保ち、イエスの愛と厳しい要求との緊張を解消しない。
