  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: ja
  text: しかし、あなたがたの間では、そうではありません[a]。むしろ、あなたがたの間で偉くなりたいと思う者は、あなたがたに仕える者となります[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「しかし、あなたがたの間では、そのようではありません」。ギリシア語は直説法で「そうではない」と述べていますが、文脈上、弟子たちに求められるあり方を示す規範的な響きがあります。
    reason: lexical_alternative
  - marker: b
    text: 「となります」という未来形は、ここでは「ならなければなりません」という規範的な意味を帯びることもあります。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: しかし、あなたがたの間では、そうであってはなりません
  rationale: 直訳的な「そうではない」よりも、この文脈で共同体のあり方を対照的に示す規範的な力を自然な日本語で表す。δέは「しかし」で受け、οὕτωςは直前に述べられた支配のあり方を指す。
- source_word: ἀλλ’
  choice: むしろ
  rationale: 異邦人の支配者たちのあり方と、弟子たちに求められるあり方との強い対照・訂正を簡潔に示す。
- source_word: ὃς ἂν θέλῃ
  choice: …なりたいと思う者は
  rationale: ἄνを伴う接続法による一般的・不定の条件と、θέλωの意志・願望を自然に表す。
- source_word: μέγας γενέσθαι
  choice: 偉くなりたい
  rationale: γενέσθαιの変化・到達の意味を「なる」で保ち、μέγαςを文脈上の地位や重要性を含む「偉い」とした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で／間では
  rationale: 共同体内部の関係を示す表現として自然であり、二度の用例を意味上対応させた。
- source_word: ἔσται ὑμῶν διάκονος
  choice: あなたがたに仕える者となります
  rationale: διάκονοςを後代の教会職制を連想させる語ではなく、実際に奉仕する者として表した。ἔσταιの未来形は「となります」で保持しつつ、文脈上の規範的な含みは脚注で示す。属格ὑμῶνは日本語では奉仕の対象を示す「あなたがたに」とした。
theological_decisions:
- issue: ἔσταιの未来形が持つ規範的な力
  choice: 本文では「となります」と未来形を保つ
  alternative: 「ならなければなりません」「仕える者でありなさい」
  rationale: 未来直説法を直接の命令形に置き換えず、イエスの教えとしての規範的な含みを脚注で明示することで、文法形式と文脈上の力の双方を保つ。
- issue: διάκονοςの意味
  choice: 仕える者
  alternative: 僕、奉仕者、執事
  rationale: ここでは教会の職名ではなく、共同体の中で他者に仕える役割を指す。「仕える者」は行為の意味を明確にし、制度的・身分的な含意を過度に持ち込まない。
- issue: οὐχ οὕτως…ἐστινの叙述と規範性
  choice: そうであってはなりません
  alternative: そうではありません／そのようではありません
  rationale: 文脈では単なる現状説明より、異邦人の支配様式を弟子共同体に禁じる対照的教えとして機能する。ただし、より形式的な叙述訳も可能なため脚注に残す。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、イエスの厳粛な教えにふさわしい品位を保った。「偉くなる」と「仕える者となる」の逆説的な対照が聞き手に明確に伝わる語順とした。
