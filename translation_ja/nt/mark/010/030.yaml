source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: ja
  text: 今この時に、百倍を受け、すなわち、迫害とともに、家、兄弟、姉妹、母親たち[a]、子ども、畑を受け、来るべき時代には永遠のいのちを受けない者はいません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本では「母親」（単数）。
    reason: textual_variant
lexical_decisions:
- source_word: λάβῃ
  choice: 受ける
  rationale: 約束として与えられるものを受領する文脈なので、「手に入れる」よりも「受ける」が自然で原語に忠実である。
- source_word: ἑκατονταπλασίονα
  choice: 百倍
  rationale: 百倍の量・規模の報いを表す語の数量的な力を、簡潔で自然な現代日本語で保持する。
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: 今この時に
  rationale: 現在の時と来るべき時代との対照を明示しつつ、原文の重ねた時間表現を保つ。
- source_word: οἰκίας
  choice: 家
  rationale: 具体的な複数の住居を指す。日本語では無標の名詞でも複数を表せるため、自然な「家」とした。
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: 兄弟、姉妹
  rationale: 原文が男性と女性のきょうだいを別々に列挙しているため、その区別を保つ。
- source_word: μητέρας
  choice: 母親たち
  rationale: SBLGNT本文の複数形を明示するため「たち」を付けた。本文異読の単数形は脚注に示す。
- source_word: τέκνα
  choice: 子ども
  rationale: 性別を限定しない広い語であり、「息子や娘」と具体化せずその包括性を保つ。
- source_word: ἀγρούς
  choice: 畑
  rationale: 耕作地を指す具体的な語として、現代日本語で自然な「畑」を用いる。
- source_word: μετὰ διωγμῶν
  choice: 迫害とともに
  rationale: 現在の豊かな報いと苦難が併存するという原文の緊張を明確に保つ。
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: 来るべき時代には
  rationale: αἰώνを物理的な「世界」ではなく時代として訳し、終末論的な時間の対照を保持する。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: 原語の慣用的・終末論的な意味を自然かつ定着した日本語で表す。
theological_decisions:
- issue: 現在に約束される報いの性質
  choice: 家族関係や家、畑という現実的な列挙をそのまま訳し、「迫害とともに」も明示する。
  alternative: 純粋に霊的な祝福へ弱める、または苦難を伴わない物質的繁栄として読む。
  rationale: 原文は豊かな現在の報いと迫害を並置しており、どちらか一方へ解消すべきではない。
- issue: 百倍が列挙全体にかかる構文
  choice: 「家…畑を、迫害とともに百倍受け」として、百倍を列挙されたもの全体の受領に結びつける。
  alternative: 特定の最後の項目だけが百倍になると解する。
  rationale: ἑκατονταπλασίοναはλάβῃの目的語補語として、後続の列挙全体を数量的に特徴づけるのが自然である。
- issue: 来るべき時代と永遠のいのち
  choice: 現在の時代との対照を保ち、来るべき時代に受けるものとして永遠のいのちを訳す。
  alternative: 「来るべき世界」として場所的意味を前面に出す。
  rationale: αἰώνの時間的・終末論的意味を保持し、本文が示す時代の対照を明瞭にする。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「母親たち」は通常より明示的だが、SBLGNTの複数形と単数形異読の差を読者に伝えるため採用した。本節は前節から続く従属的な構文だが、単節でも読めるよう「者はいません」で完結させた。
