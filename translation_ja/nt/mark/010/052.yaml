  naturalness: 明瞭で現代標準日本語として自然である。「言われた」はイエスへの適切な敬意を保ち、「すると」「すぐに」はマルコの速い叙述を滑らかに伝える。「ついて行った」は未完了形の継続的含意を逐語的には明示しないが、日本語の叙述として不自然に進行・反復を加える必要はなく、文脈上十分に許容される。
  terminology: 「信仰」「救った」は主要語として一貫し、σῴζωの救いと癒やしにまたがる含意を本文で狭めていない。脚注a・bはそれぞれ適切な代替的理解を示す。脚注cも本文の「道」の物理的意味を第一に置いた上で、可能な響きを慎重に述べており、断定的な教理的解釈を加えていない。
