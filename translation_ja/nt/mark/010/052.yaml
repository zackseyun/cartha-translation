  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: ja
  text: イエスは彼に言われた。「行きなさい。あなたの信仰[a]があなたを救った[b]。」すると、彼はすぐに見えるようになり、道を行くイエスについて行った[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は、ここでは「信頼」とも表せる。
    reason: alternative_reading
  - marker: b
    text: 「救った」と訳したギリシア語は、「癒やした」「健康を回復させた」という意味にもなる。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「道で彼について行った」。「道」は具体的な道路を指すと同時に、「歩むべき道」という響きを持つ可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: 行きなさい
  rationale: 簡潔な出発の命令として、原文にない所有のニュアンスを加えず、自然で明瞭な日本語にした。
- source_word: πίστις
  choice: 信仰
  rationale: この文脈ではイエスに対する信頼を指すが、聖書の主要語としてのつながりを保つため「信仰」とした。「信頼」も可能なので脚注に示した。
- source_word: σέσωκέν
  choice: 救った
  rationale: σῴζωは救済だけでなく、癒やす、健康を回復させるという意味も持つ。直後に視力の回復が語られる一方、イエスの宣言が持つより広い含みを狭めないため「救った」とした。
- source_word: εὐθύς
  choice: すぐに
  rationale: マルコの物語に特徴的な即時性とテンポを、現代日本語で自然に表した。
- source_word: ἀνέβλεψεν
  choice: 見えるようになり
  rationale: 盲人の視力が回復した文脈上の意味を、誤解のない自然な日本語で表した。
- source_word: ἠκολούθει
  choice: ついて行った
  rationale: 未完了過去は継続的な追随を示しうるが、日本語では進行表現を明示しなくても文脈上その継続性が伝わるため、自然な叙述とした。
- source_word: ἐν τῇ ὁδῷ
  choice: 道を行く
  rationale: 具体的な道路上の移動を保ちつつ、「道」が持ちうる弟子としての歩みの響きも排除しない表現とした。
- source_word: καὶ ὁ Ἰησοῦς
  choice: イエスは
  rationale: 日本語では文頭の接続詞を機械的に置かずとも物語の連続性が明らかなため、省略して自然な語りにした。
theological_decisions:
- issue: イエスの宣言における σῴζω の意味
  choice: 「あなたを救った」と広く訳す
  alternative: 「あなたを癒やした」「あなたを元気にした」
  rationale: 直後の出来事は身体的な癒やしだが、ギリシア語は癒やしと救いの双方を表しうる。本文では意味を身体的回復だけに限定せず、その語義上・神学上の重なりを保った。
- issue: πίστις の意味合い
  choice: 「信仰」
  alternative: 「信頼」
  rationale: ここではイエスに身を委ねる信頼が中心だが、原語の主要概念とのつながりを保つため本文では「信仰」とし、日常語に近い代案を脚注で示した。
- issue: ἐν τῇ ὁδῷ における具体的な道と弟子道の響き
  choice: 「道」を本文に残す
  alternative: 「道中」「途中」
  rationale: 物理的な道路が第一義だが、マルコ福音書における「道」はイエスに従う歩みをも響かせうるため、その可能性を消さない訳語を選んだ。
translation_notes:
  register: 明瞭で現代的ながら、イエスの発言には敬意と重みを保つ文体とした。「言われた」で自然な敬意を示し、宣言部分は簡潔にした。叙述では「すると」「すぐに」によってマルコらしい素早い展開を表した。
