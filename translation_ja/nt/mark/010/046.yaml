source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: ja
  text: 彼らはエリコに来た。そして、イエスが弟子たちやかなりの群衆とともにエリコを出て行くとき、ティマイの子であるバルティマイという、目の見えない物乞いが道端に座っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: 来た
  rationale: ギリシア語は物語を生き生きと語る歴史的現在形だが、現代日本語の自然な物語文として過去形で表した。
- source_word: ἐκπορευομένου αὐτοῦ
  choice: イエスが…出て行くとき
  rationale: 属格独立分詞が示す同時進行を「…とき」で表し、移動のイメージを保った。代名詞は日本語で指示対象が明確になるよう「イエス」とした。
- source_word: ὄχλου ἱκανοῦ
  choice: かなりの群衆
  rationale: ἱκανός がここで示す相当な規模を、誇張せず自然な現代日本語で表した。
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: ティマイの息子バルティマイという
  rationale: 人名と、それを説明する「ティマイの息子」の両方を残し、日本語として明瞭な語順にした。
- source_word: τυφλὸς προσαίτης
  choice: 目の見えない物乞い
  rationale: 二つの語をともに明示し、意味を簡潔かつ分かりやすく伝えた。
- source_word: παρὰ τὴν ὁδόν
  choice: 道端に
  rationale: 道路の傍らという位置を、自然で簡潔な日本語で表した。
- source_word: Ἰεριχώ
  choice: エリコ
  rationale: 日本語聖書で広く定着している地名表記を用いた。
theological_decisions:
- issue: バルティマイの人物同定
  choice: 「ティマイの息子」と「バルティマイ」の両方を本文に残す。
  alternative: 説明句か個人名の一方だけを記す。
  rationale: 原文はセム語系の名とその説明をともに提示しており、その重複を省かず保持することで、マルコの叙述上の細部を伝える。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述体。「一行」で複数主語を自然に受け、後半では代名詞の指示対象を明確にするため「イエス」を補った。本文中の脚注記号は対応する脚注と一致させた。
