source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: ja
  text: しかし、イエスは彼に言った。「なぜ、わたしを善いと言うのですか。[a] 善い者は、神おひとりのほかには、だれもいません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、より字義的に「何のために、わたしを善いと言うのですか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: すると
  rationale: 前の発言を受けた応答への移行を自然に示す。強い逆接ではないため、「しかし」より文脈に適している。
- source_word: εἶπεν αὐτῷ
  choice: 彼に言った
  rationale: λέγωと間接目的語を、解釈を加えず現代日本語で明瞭に表した。
- source_word: Τί
  choice: なぜ
  rationale: 形式上は「何」だが、ここでは動詞とともに理由を問う用法であり、日本語では「なぜ」が自然である。より字義的な形は脚注に示した。
- source_word: με λέγεις ἀγαθόν
  choice: わたしを善いと言う
  rationale: 目的語と述語補語の関係を保ち、「善いと呼ぶ」より自然な日本語にした。
- source_word: ἀγαθόν / ἀγαθὸς
  choice: 善い
  rationale: 二つの用例を同じ語で訳して反復と修辞的なつながりを保った。「道徳的に」などの限定は加えていない。
- source_word: οὐδεὶς
  choice: 善い方は…神だけ
  rationale: 日本語では後続の例外表現と合わせ、「神以外には誰も」を自然な肯定的焦点構文で表した。
- source_word: εἰ μὴ εἷς
  choice: ただひとり…だけ
  rationale: 例外と唯一性の強調を日本語として明瞭に示した。
- source_word: ὁ θεός
  choice: 神
  rationale: 定冠詞を機械的に移さず、日本語で固有の指示として自然に訳した。
theological_decisions:
- issue: 善さについてのイエスの発言がキリスト論に持ちうる含意
  choice: 発言をそのまま訳し、イエスがご自身の神性を否定しているとも、ここで明示的に主張しているとも限定しない。
  alternative: 神性の否定または明示的主張のいずれかを訳文に織り込む。
  rationale: 本文は相手がイエスを「善い」と言ったことを問い返しているが、その問いの含意を一方向に解消してはいない。訳文でもこの神学的緊張を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、直接話法には簡潔で品位ある調子を保った。「善い」を反復し、原文の語彙的結びつきを見える形にした。
