  rationale: 後半を否定＋例外の構文に改め、οὐδείς、εἰ μὴ εἷς、および ἀγαθός の反復を明瞭に反映しました。「神おひとり」によって唯一性を保ち、発言の神学的含意は解釈せずに残しています。
