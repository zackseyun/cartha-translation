  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: ja
  text: 彼らはエルサレムへ上る道を進んでいた。イエスは彼らの先を進んでおられた。彼らは驚き惑っており、後に従う人々は恐れていた。そしてイエスは、再び十二人を脇へ連れて行き、ご自分の身にこれから起こることを彼らに話し始められた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: 途上にあった
  rationale: 具体的な旅の場面を保ちつつ、現代日本語として自然に表現する。「道にいた」よりも移動中であることが明瞭。
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: エルサレムへ上る
  rationale: エルサレムの標高と巡礼表現の双方を反映する伝統的かつ自然な言い方。
- source_word: προάγων αὐτούς
  choice: 彼らの先頭を進んでおられた
  rationale: イエスが一行の前を進んでいた位置関係を明示し、「導いていた」という解釈を加えない。
- source_word: ἐθαμβοῦντο
  choice: 驚き惑い
  rationale: 単なる驚きより強い、圧倒され困惑する反応を表しつつ、恐怖そのものとは区別する。未完了過去の継続的状態は文脈上自然に伝わる。
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: 後に従う人々
  rationale: 参与者の範囲を『弟子たち』などに限定せず、分詞表現の曖昧さを保持する。
- source_word: ἐφοβοῦντο
  choice: 恐れていた
  rationale: 継続していた恐れを簡潔かつ直接的に表す。
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: 十二人をそばに呼び
  rationale: παραλαμβάνω の『伴って行く、引き寄せる』という意味を文脈に即して自然に表す。私的な指導の場面は示すが、原文にない移動先を補わない。
- source_word: πάλιν
  choice: 再び
  rationale: 同様の受難予告が繰り返されることを明確に示す。
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: 話し始められた
  rationale: 開始相を保ち、間接目的語は『十二人をそばに呼び』という直前の表現から自然に理解できる。
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: これからご自分の身に起こること
  rationale: 差し迫った出来事を示しつつ、『定められた』など運命・必然性を原文以上に強めない。
theological_decisions:
- issue: 二つの集団の感情的反応の区別
  choice: ἐθαμβοῦντο を「驚き惑い」、ἐφοβοῦντο を「恐れていた」と訳し分ける。
  alternative: 両方を広く「驚いていた」または「恐れていた」とする。
  rationale: 原文は異なる二つの動詞を用い、先行する一行と後に従う人々の反応を区別しているように読めるため、その物語上の緊張を保持する。
- issue: οἱ δὲ ἀκολουθοῦντες が指す集団
  choice: 「後に従う人々」とし、十二人や群衆に限定しない。
  alternative: 「弟子たち」または「群衆」と特定する。
  rationale: 原文の分詞句だけでは集団の厳密な範囲が確定しないため、曖昧さを保つ。
translation_notes:
  register: 明快な現代標準日本語を用い、物語文として自然でありながら品位を保った。「おられた」「ご自分」「話し始められた」によりイエスへの敬意を自然に示す。原文に対応しない冒頭の時間副詞は加えていない。脚注を要するほど重要な異読・訳語上の曖昧さは本文内で自然に保持した。
