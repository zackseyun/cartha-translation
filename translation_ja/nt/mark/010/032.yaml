    rationale: καὶ παραλαβών はここで因果関係を明示していない。「そこで」は前文の恐れ・驚きから行動が生じたとの含意を加えるため、「そして」等が適切。
  - severity: medium
    issue: 「十二人をそばに呼び」
    rationale: παραλαβών はこの文脈で十二人を取り分けて伴う動作を表す。「呼ぶ」だけでは、連れ出して私的に語る含意が弱く、語彙的にも狭すぎる。
