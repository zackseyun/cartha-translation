revisions:
- from: 一行がエルサレムへ上る途上にあったとき、イエスは彼らの先頭を進んでおられた。彼らは驚き惑い、後に従う人々は恐れていた。そこでイエスは、再び十二人をそばに呼び、これからご自分の身に起こることを話し始められた。
  to: 彼らはエルサレムへ上る道を進んでいた。イエスは彼らの先を進んでおられた。彼らは驚き惑っており、後に従う人々は恐れていた。そしてイエスは、再び十二人を脇へ連れて行き、ご自分の身にこれから起こることを彼らに話し始められた。
  rationale: 原文の接続関係を不必要に因果化しないよう「そこで」を「そして」に改めた。また、παραλαμβάνω の文脈上の意味を「脇へ連れて行き」として明示した。これにより、十二人に改めて私的な受難予告を語り始める場面が、原文により忠実になる。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:32:04Z'
review_pass:
  verdict: revise
  source_fidelity: 「そこで」は原文の単純な接続詞 καί を因果・結果的に強めるため避けるべきです。また、παραλαβών は単に「呼ぶ」よりも、十二人を他の者から分けて伴う／脇へ連れて行く動作を表すため、その点を本文に反映します。その他は、前を進むイエス、驚きと恐れの区別、後に従う者の指示範囲の曖昧さ、これから起こる出来事という表現を適切に保っています。
  naturalness: 改訂文は明快な現代標準日本語として自然であり、物語の進行も滑らかです。「脇へ連れて行き」は私的に語る場面を自然に示しつつ、「呼び」より原文の動作に近い表現です。
  terminology: 「エルサレムへ上る」「十二人」「イエス」「ご自分の身に起こること」は適切です。イエスへの敬意を示す敬語も一貫しています。
