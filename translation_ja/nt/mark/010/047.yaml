reference: Mark 10:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: ja
  text: そして、ナザレ人イエス[a]だと聞くと、彼は叫び始めて言った。「ダビデの子イエスよ、私をあわれんでください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ナザレのイエス」。ギリシア語は直訳すると「ナザレ人イエス」で、出身地を明示する表現というより、イエスに付された呼び名を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 聞くと
  rationale: アオリスト分詞を主動詞に先立つ時を表すものとして訳し、出来事の順序を自然な現代日本語で示した。
- source_word: Ναζαρηνός
  choice: ナザレ人
  rationale: 地名句に言い換えず、イエスに付された形容詞的・呼称的な表現を保った。日本語では「ナザレ人」が簡潔で定着した表現である。
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: 叫び始めて言った
  rationale: ἄρχομαιによる動作の開始と、κράζειν、λέγεινの両方を保ち、マルコ特有の重ねた表現を不必要に一語へまとめなかった。
- source_word: κράζειν
  choice: 叫び
  rationale: 怒りとは限らない、大声で切迫した訴えを表す語として選んだ。
- source_word: Υἱὲ Δαυὶδ
  choice: ダビデの子
  rationale: 字義的な形と、王的・メシア的な称号としての響きの双方を保った。
- source_word: ἐλέησόν με
  choice: 私をあわれんでください
  rationale: 命令形による切実な嘆願を、明瞭で品位ある現代日本語として表した。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 人名について日本語聖書で定着した音写を用いた。
theological_decisions:
- issue: 「ダビデの子」のメシア的含意
  choice: 呼びかけの称号として「ダビデの子」を本文に保持する。
  alternative: 「ダビデの子孫」と説明的に訳す。
  rationale: マルコの物語では王的・メシア的な響きを帯びるため、単なる系譜上の説明へ狭めず、原文の称号形を保った。
- issue: Ναζαρηνόςの訳し方
  choice: 「ナザレ人イエス」と訳す。
  alternative: 「ナザレのイエス」と訳す。
  rationale: 原文は明示的な出身地句ではなく、形容詞的・異名的なΝαζαρηνόςを用いる。その形の違いを脚注とともに保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、呼びかけには「よ」、嘆願には「あわれんでください」を用いて、切迫感と品位を保った。「叫び始めて言った」はやや重なる表現だが、原文の二つの不定詞とマルコの語り口を反映するため保持した。
