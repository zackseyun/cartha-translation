  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: ja
  text: 彼は去って行き、イエスが自分のためにしてくださったことのすべてを、デカポリス地方で宣べ伝え始めた。†そして、皆が驚いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 立ち去り
  rationale: 場面から離れて行ったことを簡潔に表す。文語的すぎず、移動の意味を保つ。
- source_word: ἤρξατο κηρύσσειν
  choice: 宣べ伝え始めた
  rationale: ἤρξατο＋不定詞の開始相を明示する。κηρύσσεινは正式な説教に限定せず、公に知らせる行為として自然で格調ある表現にした。
- source_word: ἐν τῇ Δεκαπόλει
  choice: デカポリス地方で
  rationale: ἐνの基本的な場所の意味を保つ。「地方」を補い、デカポリスが地域名であることを現代の読者に自然に伝える。
- source_word: ὅσα
  choice: ことのすべてを
  rationale: ὅσαが指す事柄の総体を自然な日本語で表す。程度を示す「どれほどのことを」も可能だが、ここでは行為内容の包括性を前面に出した。
- source_word: ἐποίησεν αὐτῷ
  choice: 自分のためにしてくださった
  rationale: 与格αὐτῷを受益者として表し、直前の人物を指す再帰的な「自分」を用いた。日本語として自然な敬語により、イエスの恩恵的な行為を表す。
- source_word: πάντες
  choice: 皆が
  rationale: 人々全体を表すπάντεςを、補足を加えず自然な現代日本語にした。
- source_word: ἐθαύμαζον
  choice: 驚いた
  rationale: 驚嘆を表す自然な語を採用した。ギリシア語の未完了過去が示し得る継続的・反復的な様相は、文脈上日本語の単純過去でも十分に伝わる。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した人名表記を用いる。
theological_decisions:
- issue: 男の宣言とイエスの身分との関係
  choice: イエスが彼のために行ったことを男が宣べ伝えたという叙述を、そのまま訳す。
  alternative: イエスの神的権威を明示する解釈的な言い換え。
  rationale: 本文はイエスの力を示唆するが、ここで教理的結論を明言してはいないため、物語の主張を越える説明を加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「宣べ伝える」によって公的な告知の響きを保った。地名は「デカポリス地方」とし、本文だけで地域名だと把握しやすくした。不要な脚注は設けず、ὅσαは本文で自然かつ直接的に処理した。
