revisions:
- from: そこで彼は立ち去り、イエスが自分のためにしてくださったことのすべてを、デカポリス地方で宣べ伝え始めた。すると、皆が驚いた。
  to: 彼は去って行き、イエスが自分のためにしてくださったことのすべてを、デカポリス地方で宣べ伝え始めた。†そして、皆が驚いた。
  rationale: 接続詞を原文のκαίにより近い中立的な表現へ改め、ὅσαの語義上の幅を脚注で示した。その他の語句は、原文への忠実さと自然な現代日本語の両面から維持できる。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:39Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は全体としてギリシア語に忠実である。ἀπῆλθεν、開始相をもつἤρξατο κηρύσσειν、場所を示すἐν τῇ Δεκαπόλει、ならびに群衆の驚きを適切に伝えている。ただし、冒頭の「そこで」と後半の「すると」は、いずれも単純接続のκαί以上の推論・結果の関係を示しうるため、より中立的な接続に改めるのが安全である。ὅσαは「すべて」と訳せる一方、「どれほど多く」の含みもあり、脚注で代案を示す。
  naturalness: 「去って行き」「そして、皆が驚いた」は、明瞭な現代標準語として自然であり、原文の連続する叙述を過度に説明しない。「宣べ伝え始めた」はやや聖書的な語感をもつが、公的に告知するκηρύσσωを表す定着した自然な表現である。
  terminology: 「イエス」「デカポリス」「宣べ伝える」は適切である。「してくださった」は日本語の敬意表現であり、原文に明示されない神学的主張を付加せず、聖書翻訳の標準的な敬語として許容できる。
  issues:
  - severity: low
    issue: 「そこで」「すると」がκαίの接続関係をやや具体化している。
    rationale: καίはここでは基本的に叙述をつなぐ語であり、推論を示す「そこで」や結果を強める「すると」を必ずしも要求しない。中立的な「そして」により、原文の関係を限定しない。
  - severity: low
    issue: ὅσαの「どれほど」の可能性が本文・脚注ともに示されていない。
    rationale: 「すべて」は有力で自然な訳だが、ὅσαは文脈上、イエスがしてくださったことの大きさ・多さを表すこともある。英語POBの監査記録にもこの訳し分けが注記されているため、日本語でも脚注で保持する。
  revised_text: 彼は去って行き、イエスが自分のためにしてくださったことのすべてを、デカポリス地方で宣べ伝え始めた。†そして、皆が驚いた。
  revised_footnotes:
  - marker: †
    text: 「イエスが自分のためにしてくださったことをどれほど多く」とも訳せる。
    reason: ὅσαは、行為の全体を指す「すべて」のほか、その大きさや多さを表すようにも理解できる。
  revision_rationale: 接続詞を原文のκαίにより近い中立的な表現へ改め、ὅσαの語義上の幅を脚注で示した。その他の語句は、原文への忠実さと自然な現代日本語の両面から維持できる。
