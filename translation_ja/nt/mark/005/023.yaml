  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: ja
  text: そして、イエスに切に願って言った。「私の幼い娘が死にかけています。どうか来て、娘に両手を置いてください。娘が癒やされ[a]、生きられるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救われ」または「助け出され」とも訳せる。ギリシア語の動詞は「救う」「助け出す」「癒やす」を意味し得るが、ここでは身体の癒やしの文脈で用いられている。
    reason: σωθῇ の広い語義を示しつつ、この箇所で文脈上もっとも自然な身体的治癒の意味を本文に反映するため。
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: イエスに切に願って
  rationale: παρακαλέω はこの場面では必死な嘆願を表し、πολλά がその強さを増している。「切に願って」は、反復と強意のどちらにも限定しすぎず、自然な現代日本語で緊迫感を伝える。文脈上の指示対象を明確にするため αὐτόν を「イエスに」とした。
- source_word: θυγάτριόν μου
  choice: 私の幼い娘
  rationale: 指小形 θυγάτριον に含まれ得る年少さと愛情の響きを、「幼い娘」で簡潔に保った。
- source_word: ἐσχάτως ἔχει
  choice: 死にかけています
  rationale: 極限・最期の状態にあるという慣用的意味を、切迫した状況が明瞭に伝わる自然な日本語にした。
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: どうか来て、娘に両手を置いてください
  rationale: 分詞 ἐλθών を依頼の流れに沿って「来て」とし、複数形 τὰς χεῖρας を「両手」として明示した。「どうか」と丁寧な依頼形により父親の嘆願を自然に表した。
- source_word: σωθῇ
  choice: 救われ
  rationale: σῴζω はこの文脈で身体的な癒やしを指し得るが、「救う」という広い語義も持つ。本文では「救われ」として語彙的な広がりを保ち、文脈上有力な「癒やされる」を脚注に示した。
- source_word: ζήσῃ
  choice: 生きる
  rationale: ζάω の直接的な意味を保ち、救い・癒やしの結果として命が保たれることを表した。
theological_decisions:
- issue: 癒やしの文脈における σωθῇ の訳
  choice: 救われ
  alternative: 癒やされ／元気になる
  rationale: 直近の文脈は身体的癒やしを強く示すが、原語 σῴζω には救助・救い・癒やしにまたがる意味領域がある。本文で「救われ」を用いてその広がりを保ち、医療的・身体的意味を脚注で明示することで、原文の含みを一義化しないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、嘆願の切迫感と発話の品位を保った。「幼い娘」「死にかけています」は一般読者に直ちに理解できる表現である。目的を表す二つの ἵνα は、日本語として過度に重くならないよう、依頼とその目的を続けて示した。
