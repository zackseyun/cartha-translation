  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: ja
  text: そして彼らは海の向こう岸、ゲラサ人の地方[a]に着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「ガダラ人」、また別の写本では「ゲルゲサ人」とある。
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: マルコ福音書に特徴的な並列的な物語の流れを保ちつつ、現代日本語で自然な接続とした。
- source_word: ἦλθον
  choice: 一行は…着いた
  rationale: 複数形は直前の文脈におけるイエスと同行者たちを指す。「彼ら」より指示対象が分かりやすい「一行」を用い、到達を表す文脈では「着いた」とした。
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: 湖の向こう岸
  rationale: πέραν の対岸への方向を「向こう岸」で表した。θάλασσα は字義的には「海」だが、ここで指すガリラヤ湖は日本語で通常「湖」と呼ばれるため、地理的に明瞭で自然な表現を選んだ。
- source_word: εἰς τὴν χώραν
  choice: 地方
  rationale: χώρα はここでは近代的な国家ではなく地域・領域を指すため、「地方」とした。
- source_word: Γερασηνῶν
  choice: ゲラサ人
  rationale: SBLGNTの本文に従い、地名に由来する住民名を日本語で音写した。属格複数の関係は「ゲラサ人の地方」と表した。
theological_decisions:
- issue: 悪霊に取りつかれた人の物語における地名の異読と地理上の問題
  choice: ゲラサ人
  alternative: ガダラ人、ゲルゲサ人
  rationale: 本文はSBLGNTのΓερασηνῶνに従う。一方、写本には重要な地名異読があるため、本文で一つに統合せず脚注に保存した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文の簡潔な物語進行を保ち、地名の本文異読は脚注で明示した。
