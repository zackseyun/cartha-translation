source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: ja
  text: 多くの医者のもとでひどく苦しみ[a]、持っていたものをすべて使い果たした[b]が、何の益も得られず、かえって悪くなっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「多くの医者によって」または「多くの医者の手で」。ギリシア語は、医者たちを苦しみの行為者として示すとも、彼女がその治療を受けていたことを強調するとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼女のもとにあるものすべて」。すなわち、彼女が持っていたもの全部。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: ひどく苦しみ
  rationale: πάσχωの経験的な「苦しむ」という意味と、πολλάの程度の強さを自然な現代日本語で表した。アオリスト分詞は、続く出来事に先立つ事情として連用形でつないだ。
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: 多くの医者のもとで
  rationale: 属格を伴うὑπόが示す行為者・原因の含みを保ちつつ、治療を受ける立場にあったことを日本語として自然に表した。医者自身の加害を必要以上に断定しないため、別訳を脚注に示した。
- source_word: δαπανήσασα
  choice: 使い果たした
  rationale: 単独では「費やした」だが、目的語τὰ παρ’ αὐτῆς πάνταが全財産を指すため、「すべて」と組み合わせて全額を費やした結果を明瞭にした。
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: 持っていたものをすべて
  rationale: 直訳的には「彼女のもとにあるものすべて」。所有または自由にできる資産の総体を、普通の日本語で過不足なく表した。
- source_word: μηδὲν ὠφεληθεῖσα
  choice: 何の益もなく
  rationale: ὠφελέωの受動形が示す「少しも助け・利益を受けなかった」という意味を簡潔に表し、治療が効かなかったことを文脈から理解できる形にした。
- source_word: ἀλλὰ μᾶλλον
  choice: かえってますます
  rationale: ἀλλάの強い逆接と、μᾶλλονの比較・増進の力を併せて表し、無益だっただけでなく反対に悪化したという段階的対照を保った。
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: 悪くなっていた
  rationale: 字義的な「より悪い状態へ至る」を自然な日本語にした。分詞が表す、それまでに進行・成立していた悪化を文脈に即して表した。
