  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: ja
  text: 彼はいつも、夜も昼も、墓場や山々で叫び続け、石で自分の体を傷つけていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: いつも、夜も昼も
  rationale: διά παντόςの継続性とνυκτὸς καὶ ἡμέραςの時間的広がりを、自然な現代日本語で表す。
- source_word: μνήμασιν
  choice: 墓場
  rationale: 岩を掘った墓を含む埋葬場所を指す。文脈上、複数の墓がある区域として日本語では「墓場」が自然。
- source_word: ὄρεσιν
  choice: 山々
  rationale: ὄροςの基本的な意味を保ち、複数形も反映する。
- source_word: ἦν κράζων
  choice: 叫び続け
  rationale: 未完了過去のεἰμίと現在分詞による、過去に継続していた動作を表す。
- source_word: κατακόπτων ἑαυτὸν
  choice: 自分の体を傷つけていた
  rationale: 激しく打つ、切りつけるという語義を踏まえつつ、石による自傷を明瞭で過度に生々しくない日本語で表す。
- source_word: λίθοις
  choice: 石で
  rationale: 道具を示す与格を簡潔に表す。
theological_decisions: []
