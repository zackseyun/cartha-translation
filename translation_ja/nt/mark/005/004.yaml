  naturalness: 現行の「というのも……からである」は因果標識が重なり、また「砕いてしまい」は原文にない完了・遺憾の含みを帯びうる。改訂案では、現代標準日本語として自然な文の流れに整える。
  terminology: πέδαιを「足かせ」、ἁλύσειςを「鎖」として一貫して区別する。「制圧する」はこの文脈のδαμάσαιに適切であり、脚注で「飼いならす」の語義を示す。
  issues:
