source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: ja
  text: というのも、この人は何度も足かせと鎖で縛られていたが、鎖を引きちぎり、足かせを砕いていたので、彼を制圧するだけの力を持つ者は、だれもいなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: というのも、この人は……からである
  rationale: διάと冠詞付き不定詞の構文が前節の内容の理由を示すため、日本語でも因果関係を明示した。
- source_word: πολλάκις
  choice: 何度も
  rationale: 拘束が繰り返し試みられたことを、自然で明瞭な現代日本語で表す。
- source_word: πέδαις
  choice: 足かせ
  rationale: πέδηは特に足を拘束する器具を指すため、一般的な鎖と区別した。
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: 鎖
  rationale: 鎖を意味する語であり、πέδαι（足かせ）との区別を保った。
- source_word: δεδέσθαι
  choice: つながれた
  rationale: 拘束された状態を表す完了不定詞を、文脈に合う自然な受け身で訳した。
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: 鎖を引きちぎり
  rationale: 本人を動作主として明示し、διασπάωの力ずくで引き裂く意味を保った。
- source_word: τὰς πέδας συντετρῖφθαι
  choice: 足かせを砕いてしまい
  rationale: συντρίβωの強い破壊の意味を伝え、完了した結果を「しまい」で自然に示した。
- source_word: οὐδεὶς ἴσχυεν
  choice: できるほど力のある者は、だれもいなかった
  rationale: 単なる可能性だけでなく、ἰσχύωが含む力・強さのニュアンスを保持した。
- source_word: δαμάσαι
  choice: 抑え込む
  rationale: この文脈では、力によって制圧し支配下に置く意味が自然である。「飼いならす」という語義を本文に採ると、人を動物扱いする含みが日本語で強くなりすぎるため、脚注で代替語義を示した。
theological_decisions:
- issue: 男の異常な力の原因
  choice: 拘束を繰り返し破った事実と、だれにも抑え込めなかったことだけを叙述する
  alternative: 悪霊の力によるものだと、この節の訳文自体で明示する
  rationale: この節のギリシア語は驚異的な力と拘束の失敗を描写するが、その原因を節内で明文化してはいない。周囲の物語とのつながりを保ちつつ、訳文に説明を付加しなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「足かせ」と「鎖」を区別し、原文の二種類の拘束具を保持した。節頭の因果構文は「というのも……からである」として、前節を受ける文であることを示した。
