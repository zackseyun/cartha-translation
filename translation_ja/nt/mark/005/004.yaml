revisions:
- from: というのも、この人は何度も足かせと鎖でつながれたが、鎖を引きちぎり、足かせを砕いてしまい、彼を抑え込む[a]ことのできるほど力のある者は、だれもいなかったからである。
  to: というのも、この人は何度も足かせと鎖で縛られていたが、鎖を引きちぎり、足かせを砕いていたので、彼を制圧するだけの力を持つ者は、だれもいなかった。
  rationale: 前節を受ける理由節であることは「というのも」で示し、重複する「からである」を除いた。「砕いてしまい」を原文の完了した破壊を中立的に表す「砕いていた」に改めた。また、「制圧するだけの力を持つ者」として、ἰσχύωの強さ・能力の含意を明瞭にした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:25:22Z'
