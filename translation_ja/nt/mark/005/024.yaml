  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: ja
  text: イエスは彼と一緒に出かけた。そして、大勢の群衆がイエスについて行き、イエスに押し迫っていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスを押し囲んでいた」「イエスに押しつけるようにしていた」。ギリシア語の動詞は、群衆がイエスの周りに密集し、身体的に圧迫していたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 出かけた
  rationale: 文脈では、イエスがヤイロの求めに応じてその場から彼と共に進み始めたことを表す。「立ち去った」よりも、目的地へ向かう自然な動きを明確に伝える。
- source_word: μετ’ αὐτοῦ
  choice: 彼と一緒に
  rationale: 属格を伴う μετά の同伴の意味を、明瞭で自然な現代日本語にした。「彼」は直前の文脈にいるヤイロを指す。
- source_word: ἠκολούθει
  choice: 後について行き
  rationale: 未完了過去が示す継続的な追随を、移動中の動作として自然に表現した。
- source_word: ὄχλος πολύς
  choice: 大勢の群衆
  rationale: πολύς が群衆の人数の多さを表すため、「大勢の群衆」とした。一般読者に分かりやすく、場面の規模も伝わる。
- source_word: συνέθλιβον
  choice: 周りから押し迫っていた
  rationale: 群衆がイエスの周囲で密集し、身体的に圧迫していた継続的状況を表す。実際に押しつぶして傷つけたとまでは断定せず、動詞の強い圧迫感を保った。
- source_word: αὐτόν
  choice: イエスに
  rationale: 原文は代名詞だが、日本語では直前にも複数の男性人物がいるため、指示対象がイエスであることを明示して混乱を避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の流れを自然にするため冒頭の καί は「そこで」とし、二つの未完了過去が示す継続的な群衆の動きを「ついて行き」「押し迫っていた」で表した。
