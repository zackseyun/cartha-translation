base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: ja
  text: そして、遠くからイエスを見ると、走り寄って、その前にひれ伏した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「彼を礼拝した」「彼に敬意を示してひれ伏した」。ギリシア語の動詞は、文脈により、礼拝することも、敬意を示してひれ伏すことも意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδὼν
  choice: そして、…を見ると
  rationale: 冒頭のκαίによるマルコ特有の連続的な語りを「そして」で保ち、アオリスト分詞ἰδώνは主動詞に先立つ動作として自然な現代日本語の「見ると」で表した。
- source_word: ἀπὸ μακρόθεν
  choice: 遠くから
  rationale: 空間的な隔たりを簡潔で自然な現代日本語で表す。
- source_word: ἔδραμεν
  choice: 走り寄って
  rationale: τρέχωの「走る」を保持しつつ、イエスのもとへ向かう文脈上の方向を日本語として自然に示す。過度な勢いを加える「駆けつける」などは避けた。
- source_word: προσεκύνησεν αὐτόν
  choice: その前にひれ伏した
  rationale: προσκυνέωが表し得る礼拝、敬意、平伏の幅を一義的に決めず、まず目に見える身体動作として訳した。より明示的な語義は脚注に示す。
- source_word: τὸν Ἰησοῦν
  choice: イエス
  rationale: 固有名詞として標準的に音写した。
theological_decisions:
- issue: προσεκύνησενをイエスへの明示的な「礼拝」と訳すか
  choice: 本文では「その前にひれ伏した」とした。
  alternative: 「彼を礼拝した」「彼に敬意を表した」
  rationale: προσκυνέωは文脈により礼拝にも、服従・敬意を示す平伏にもなり得る。この場面で神学的意味を訳文だけで確定せず、身体動作を本文に置き、語義の幅を脚注で保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、マルコの簡潔で連続的な叙述を保った。「ひれ伏した」は品位のある一般的な表現で、原語の身体的動作と意味上の余地を両立させる。
