  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: ja
  text: 一行は会堂司の家に着いた。イエスは、騒ぎ[a]と、泣いたり大声で叫んだりしている人々をご覧になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「騒動」とも訳せる。ギリシア語は、騒がしく混乱した状態や騒乱を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: 着いた
  rationale: 物語の歴史的現在を、日本語として自然な過去形で表した。家への到着という文脈も明確になる。
- source_word: οἶκον
  choice: 家
  rationale: 場所を率直に示し、「家庭」などの余分な含意を加えない。
- source_word: ἀρχισυναγώγου
  choice: 会堂司
  rationale: 会堂を指導・管理する役職を表す、簡潔で定着した日本語表現。
- source_word: θεωρεῖ
  choice: ご覧になった
  rationale: 文脈上の主語であるイエスを明示し、自然で敬意ある叙述とした。単なる一瞥より、目の前の光景を認める意味にも合う。
- source_word: θόρυβον
  choice: 騒ぎ
  rationale: 単なる物音ではなく、騒がしく混乱した状況を表す。日本語として平明で、文脈にも適する。
- source_word: κλαίοντας
  choice: 人々が泣き
  rationale: 実質的に人々を指す分詞を明示し、泣く動作を簡潔に保った。
- source_word: ἀλαλάζοντας πολλά
  choice: 大声で泣き叫んでいる
  rationale: 弔いの場における激しい叫び声を表し、副詞的な πολλά の強意を「大声で」によって自然に伝えた。
