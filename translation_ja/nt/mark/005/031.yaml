  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: ja
  text: 弟子たちはイエスに言っていた。「ご覧のとおり、群衆があなたに押し迫っている[a]のに、『だれがわたしに触れたのか』とおっしゃるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆があなたを圧迫している」。ギリシア語の分詞は、群衆がイエスの周りに密集し、身体的に押し合う様子を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が示す継続的または反復的な発言を保ちつつ、現代日本語の物語文として自然にした。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: イエスに従い、教えを受ける者たちを表す定着した明瞭な訳語である。文脈上明らかな所有関係は日本語では明示しなかった。
- source_word: Βλέπεις
  choice: ご覧になりながら
  rationale: 弟子たちがイエスの目の前の明白な状況を指摘していることを表し、後続の発言との対照が自然に伝わる形にした。
- source_word: τὸν ὄχλον
  choice: 群衆
  rationale: 多数の人々が集まった場面を簡潔かつ格調を損なわずに表す標準的な訳語である。
- source_word: συνθλίβοντά σε
  choice: あなたに押し迫っている
  rationale: 群衆がイエスの周囲から物理的に圧迫している状況を、過度に『押しつぶす』と強めず自然な日本語で表した。
- source_word: καὶ λέγεις
  choice: 『…』とおっしゃるのですか
  rationale: 弟子たちの驚きと問い返す調子を、日本語の直接話法として自然に示した。
- source_word: Τίς μου ἥψατο
  choice: 誰がわたしに触れたのか
  rationale: ἅπτομαιの基本的な意味である具体的な接触を保持し、特定の直前の行為を問うアオリストを自然な過去の含意で表した。
- source_word: μου
  choice: わたしに
  rationale: ἅπτομαιが取る属格を、日本語では接触の相手を示す助詞『に』で自然に表した。
