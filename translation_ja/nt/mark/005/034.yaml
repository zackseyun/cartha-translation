reference: Mark 5:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: ja
  text: しかし、イエスは彼女に言った。「娘よ、あなたの信仰があなたを救った[a]。平安のうちに行きなさい。そして、その苦しみとは無縁で、健やかでいなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救った」は、「癒やした」または「健康にした」とも訳せる。ギリシア語の動詞は、救出、救い、治癒のいずれをも表し得る。
    reason: alternative_reading
  - marker: b
    text: 別訳「完全でありなさい」または「健康でありなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: 娘よ
  rationale: 呼びかけの形を保ち、所有を表す語を補わずに、親愛と家族的な響きを伝える。
- source_word: πίστις
  choice: 信仰
  rationale: ここでは、女性がイエスを信頼して近づいたことを指す。「信頼」も可能だが、重要語としての一貫性を保つため「信仰」とした。
- source_word: σέσωκέν σε
  choice: あなたを救った
  rationale: σῴζωには救済と治癒の両方の意味領域がある。直後に身体が健やかであることへの言及が別にあるため、「救った」として両者を同一視せず、完了形の結果が続く含みも自然な日本語の文脈に委ねた。
- source_word: ὕπαγε εἰς εἰρήνην
  choice: 平安のうちに行きなさい
  rationale: 出発を命じる表現と、平安な状態へ、または平安のうちに進むという意味を、自然で格調ある日本語にした。
- source_word: ἴσθι ὑγιὴς
  choice: 健やかでいなさい
  rationale: ἴσθιは状態の継続を命じ、ὑγιήςは健康で損なわれていない状態を表すため、単なる治癒の出来事ではなく、健全な状態にあることを示した。
- source_word: ἀπὸ τῆς μάστιγός σου
  choice: その苦しみから解放され
  rationale: μάστιξの字義は「むち」だが、ここでは女性を苦しめた病苦を比喩的に指す。ἀπόが示す分離も含めて自然に表現した。
theological_decisions:
- issue: σῴζωが救いと治癒の双方を含み得ること
  choice: あなたを救った
  alternative: あなたを癒やした／あなたを健康にした
  rationale: 身体的治癒だけに限定せず、救いと回復が重なり合う原文の意味の幅を保った。別の表現で続く身体的な健やかさとの緊張も残した。
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼
  rationale: この場面ではイエスへの信頼を指すが、神学的な重要語としての広がりと本文間の一貫性を保つため「信仰」とした。
- issue: ἴσθι ὑγιήςの状態性
  choice: 健やかでいなさい
  alternative: 癒やされていなさい／完全でありなさい
  rationale: 治癒の瞬間よりも、健全な状態にあり続けることを直接表す命令として訳した。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの呼びかけには簡潔で親愛のこもった格調を持たせた。「病気」と限定せず「苦しみ」とすることで、μάστιξの強い比喩性を保った。
