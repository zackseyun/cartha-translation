  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: ja
  text: 人々はイエスをあざ笑っていた。[a] しかしイエスは、皆を外に出してから、その子の父と母、そしてイエスと一緒にいた人たち[b]を連れて、その子のいた所に入って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「嘲笑していた」とも訳せる。ギリシア語の動詞は、相手をばかにして笑うことを表す。
    reason: lexical_alternative
  - marker: b
    text: イエスに同行していた弟子たち、すなわちペトロ、ヤコブ、ヨハネを指す（5:37参照）。
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων αὐτοῦ
  choice: イエスをあざ笑っていた
  rationale: 未完了時制の継続的な響きを「ていた」で表した。καταγελάω は単なる笑いではなく嘲笑を表すため、「あざ笑う」が自然で正確である。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: ἐκβαλὼν πάντας
  choice: 皆を外に出すと
  rationale: 分詞が後続の主要動作に先立つことを「すると」で示した。「追い出す」も可能だが、悪霊追放を不必要に連想させず、ここでの退去の動作を自然に表すため「外に出す」とした。
- source_word: παραλαμβάνει
  choice: 伴い
  rationale: 選ばれた者たちを連れて行く意味を、現代日本語として簡潔な「伴う」で表した。日本語では歴史的現在を機械的に再現すると不自然になりやすいため、文全体を過去の敬体的叙述に整えた。
- source_word: παιδίου / παιδίον
  choice: 子
  rationale: 文脈上は娘だが、この節のギリシア語 παιδίον は中性的に「子ども」を指す。「その子」として原文の語彙上の一般性を保った。
- source_word: τοὺς μετ’ αὐτοῦ
  choice: ご自分と一緒にいた人たち
  rationale: 直訳的な関係表現を保ち、本文では弟子たちと明示しすぎないようにした。指示対象は脚注で説明する。
- source_word: εἰσπορεύεται
  choice: 入って行かれた
  rationale: その子のいる場所への移動を自然に表した。イエスに対する節度ある尊敬表現として「行かれた」を用いた。
- source_word: ὅπου ἦν τὸ παιδίον
  choice: その子のいる所
  rationale: 原文は子が横たわっていたとは明示せず、所在だけを述べるため、「寝ている所」などの補足を避けた。
theological_decisions:
- issue: 物語における歴史的現在
  choice: 自然な日本語の過去叙述として「伴い、入って行かれた」とする
  alternative: 「伴い、その子のいる所に入って行く」と歴史的現在を保持する
  rationale: マルコの歴史的現在がもつ生き生きした語り口は認識しつつ、日本語で時制を混在させる不自然さを避けた。動作の連続性は接続構造によって保持した。
- issue: τοὺς μετ’ αὐτοῦ の指示対象
  choice: 本文では「ご自分と一緒にいた人たち」とし、脚注で弟子たちを指すと説明する
  alternative: 本文で「同行していた弟子たち」と明示する
  rationale: 直前の5章37節からペトロ、ヤコブ、ヨハネを指すと理解できるが、この節自体の表現は一般的であるため、本文では原文の含みを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語としての品位を保った。「イエス」は主語を明確にするため補い、敬語は過度にならない範囲で尊敬表現を用いた。脚注記号[a]、[b]は対応箇所の直後に置いた。
