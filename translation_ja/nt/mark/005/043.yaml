base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: ja
  text: そして、彼はこのことをだれにも知られないようにと、彼らに厳しく命じた[a]。また、その娘に何か食べる物を与えるようにと言った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「彼らに多く命じた」。ここで「多く」は命令の強さを表し、「繰り返し厳命した」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼女に食べるためのものが与えられるようにと言った」。意味は、彼女に何か食べる物を与えるようにということ。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: 彼らに厳しく命じた
  rationale: διαστέλλομαιの強い指示・戒めの意味と、πολλάによる強意を、自然な現代日本語でまとめて表した。αὐτοῖςは間接目的語として「彼らに」とした。
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: このことをだれにも知られないようにと
  rationale: ἵναと接続法が示す命令の目的・内容を保ち、γνοῖの「知るに至る／知る」を日本語として自然に表した。「このこと」はτοῦτοに対応する。
- source_word: εἶπεν
  choice: 言った
  rationale: 文脈上は指示の力を持つが、原語の一般的な動詞「言う」を過度に強めず、そのまま保った。
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: その娘に何か食べさせるように
  rationale: 字義的には「彼女に、食べるために与えられること」。日本語では受け身を直写するより、「何か食べさせる」とする方が自然で、食物という省略された目的語も文脈から明確である。αὐτῇの指示対象は文脈上の娘なので「その娘」と明示した。
theological_decisions:
- issue: イエスの命令の範囲と、いわゆるメシアの秘密
  choice: 出来事をだれにも知られないようにとの強い命令として訳し、理由は説明しない
  alternative: マルコ福音書全体の「秘密」の主題を訳文中で説明する、または命令の対象・期間を限定する
  rationale: 本文は命令の強さと、だれにも知られないことだけを述べている。背景となる神学的意図や適用範囲を訳文で補わず、緊張をそのまま残した。
translation_notes:
  register: 明快で現代的ながら品位のある常体。「厳しく命じた」で原文の強意を示し、後半は日本語として自然な「食べさせる」を採用した。節頭のκαίは物語の連続を示す「そして」、後半のκαίは「また」とした。
