id: MRK.5.10
reference: Mark 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: ja
  text: そして彼は、彼らをその地方の外へ送り出さないでほしいと、イエスに何度も懇願した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλει
  choice: 懇願した
  rationale: 悪霊追放の文脈にある切迫した願いを表すため、単なる「頼んだ」より強い「懇願した」とした。
- source_word: πολλὰ
  choice: 何度も
  rationale: παρεκάλειを修飾する副詞的対格であり、願いが繰り返されたことを自然な現代日本語で表した。強さを表す「しきりに」も可能だが、反復の意味を明確にした。
- source_word: ἵνα μὴ
  choice: ないでほしいと
  rationale: 懇願の内容を示す否定表現として、日本語で自然な引用内容の形にした。
- source_word: αὐτὰ
  choice: 彼らを
  rationale: ギリシア語は中性複数形で、複数の汚れた霊・悪霊を指す。人格的な存在であるため、日本語では「彼ら」とした。
- source_word: ἀποστείλῃ
  choice: 送り出す
  rationale: 「外へ遣わす／送り出す」という基本義を保った。「追い出す」では動詞自体に明示されない強制の含みが強くなるため避けた。
- source_word: ἔξω τῆς χώρας
  choice: その地方の外へ
  rationale: χώραはここでは近代的な国家ではなく、周辺の地域・領域を指す。「その地方」により文脈上の地理的範囲を明確にした。
- source_word: αὐτόν
  choice: イエスに
  rationale: 逐語的には「彼に」だが、日本語では同一文中の複数の代名詞が曖昧になりやすいため、文脈上の指示対象であるイエスを明示した。
theological_decisions:
- issue: 単数の話者と複数の悪霊を指す代名詞の数の揺れ
  choice: 単数の「彼」が、複数の「彼ら」のために懇願する形を保った。
  alternative: 話者と悪霊を集合的に表現し、単複のずれをならす。
  rationale: 原文は単数の話者（παρεκάλει）と複数の目的語（αὐτά）を併存させ、代表して語る者と多数の悪霊との緊張を残しているため、訳文でも調和させずに保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「懇願した」で場面の切迫感と文体上の品位を保った。「そして」はκαίに対応し、前後の物語との連続性を示す。
