  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: ja
  text: 彼女はこう言っていたからである。「その方の衣服にさえ触れれば、私は癒やされる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「救われる」。この動詞は「救われる」「癒やされる」「治る」のいずれをも意味し得るが、ここでは文脈上、身体の癒やしを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っていた
  rationale: 未完了時制の継続的・反復的な側面を保つ。発言が声に出されたか心中のものかは本文だけでは確定しないため、どちらにも取り得る表現とした。
- source_word: γὰρ
  choice: というのも……からである
  rationale: 直前の行動の理由を説明する接続関係を、現代日本語で明確かつ自然に示す。
- source_word: ὅτι
  choice: こう言っていた……「」
  rationale: 発言内容を導く標識として直接話法で表した。
- source_word: ἐὰν ἅψωμαι
  choice: 触れ……すれば
  rationale: 接続法を伴う条件節を自然な日本語の仮定条件で表現した。ἅπτωの中動態はこの文脈では「触れる」が適切である。
- source_word: κἂν
  choice: さえ
  rationale: 「たとえ……だけでも」という最小限を強調する意味を、簡潔で自然な日本語にした。
- source_word: τῶν ἱματίων αὐτοῦ
  choice: あの方の衣
  rationale: 複数形ἱμάτιαは衣服を広く指す。日本語では集合的に「衣」とすることで、特定の一着に限定せず、物語にふさわしい品位も保つ。「あの方」は女性がイエスについて語る自然な指示表現である。
- source_word: σωθήσομαι
  choice: 私は癒やされる
  rationale: 出血からの身体的回復が直接の文脈なので「癒やされる」とした。ただし語形はσῴζωで、「救われる」「健やかになる」という意味領域も持つため脚注に残した。
theological_decisions:
- issue: 癒やしの物語における σωθήσομαι（σῴζω）の訳
  choice: 私は癒やされる
  alternative: 私は救われる／私は健やかになる
  rationale: 直接の指示対象は女性の身体的な病の回復であり、本文では「癒やされる」が最も明瞭である。一方、σῴζωが救いと癒やしの双方を表し得る神学的・語義的な重なりは解消せず、脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書物語としての品位を保った。「衣」は現代語ではやや格調があるが理解可能であり、ἱμάτιαを特定の外套に狭めない。
