  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: ja
  text: すぐに、イエスは、自分から力が出て行ったことを自分の内で気づき、群衆の中で振り向いて、「だれがわたしの衣服に触れたのか」と言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: するとすぐに
  rationale: マルコの物語を進める即時性を保ちつつ、前後のつながりが自然に伝わる現代日本語とした。
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: 内に悟り
  rationale: 外から観察して知ったのではなく、イエスご自身の内で明確に認識したことを簡潔に表す。
- source_word: τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν
  choice: ご自分から力が出て行ったこと
  rationale: δύναμιςを解釈的に「癒やす力」と限定せず「力」とし、出て行ったという本文の率直な叙述を保った。完了した出来事として認識した関係も「出て行ったこと」で示した。
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: 群衆の中で振り向いて
  rationale: 群衆のただ中にいる位置関係と、身体を向け直す動作を自然に表した。
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了過去形だが、この発話が反復されたと明示する必要はないため、日本語の自然な会話導入とした。イエスへの敬意を表す通常の聖書文体として尊敬表現を用いた。
- source_word: Τίς μου ἥψατο τῶν ἱματίων;
  choice: だれがわたしの衣服に触れたのか
  rationale: ἱμάτιαの複数かつ一般的な衣類の意味を「衣服」で表し、「上着」など特定の一着には限定しなかった。日本語では所有関係を「わたしの衣服」と自然に示した。
theological_decisions:
- issue: イエスから力が出て行ったという叙述
  choice: 奇跡に関わる実効的な「力」がイエスから出たという本文をそのまま保持した。
  alternative: 「癒やす力」と補足する、または単なる主観的感覚として弱める。
  rationale: 本文は力が出て行ったことと、それをイエスが内に悟ったことを率直に述べるが、その仕組みは説明していない。訳文も限定や教理的説明を加えず、その緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、場面の厳粛さにふさわしい品位を保った。「着物」より意味の広い「衣服」を採用し、過度に古風な「衣」や口語的な「服」を避けた。提示された英語版の脚注標識[a]と脚注文「Or “my garments.”」は対応関係が破綻しており、原文上ここに必要な異読・語義注でもないため、日本語稿には採用しなかった。
