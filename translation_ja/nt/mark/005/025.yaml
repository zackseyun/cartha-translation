  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: ja
  text: そして、十二年間、出血が続いていた女の人がいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「血の流出があった女の人」。
    reason: 「出血」と訳したギリシア語表現（直訳的には「血の流出」）の語彙的な代案を示すため。
lexical_decisions:
- source_word: καὶ
  choice: そこに
  rationale: 物語に新しい人物を導入する接続表現。単純な「そして」より自然な日本語としつつ、マルコの叙述の連続性を保つ。
- source_word: γυνὴ
  choice: 女の人
  rationale: 無冠詞で新たに登場する人物を示す。現代日本語で明瞭かつ自然な表現。
- source_word: οὖσα
  choice: 苦しんでいた
  rationale: 字義的には「ある、いる」だが、病状を表すἐν句と期間表現を伴い、継続してその状態にあったことを示す。文脈上の苦痛も自然に伝える。
- source_word: ἐν ῥύσει αἵματος
  choice: 血が流れ出る病に
  rationale: ἐνはここでは状態を表す。「出血」だけでは一時的にも聞こえるため、持続的な病状であることを明瞭にした。
- source_word: ῥύσει
  choice: 流れ出る
  rationale: ῥύσιςの「流出、流れること」という具体的な像を、理解しやすい現代日本語で表す。
- source_word: αἵματος
  choice: 血が
  rationale: ῥύσιςの内容を示す属格であり、日本語では主語を用いた節として自然に表現する。
- source_word: δώδεκα ἔτη
  choice: 十二年もの間
  rationale: 期間の対格。長期にわたる状態であることを日本語として自然に示す。「もの」は原文の明示的強調ではないが、十二年という長さの叙述上の重みを自然に伝える。
