  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: ja
  text: それを見た人たちは、悪霊につかれていた人の身に何がどのように起こったか、また豚についても、人々に詳しく話した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσαντο
  choice: 詳しく話した
  rationale: 出来事を順に語る、詳しく報告するという動詞の意味を、自然な現代日本語で表した。単なる「言った」より叙述の含みを保つ。
- source_word: οἱ ἰδόντες
  choice: それを見ていた人たち
  rationale: 定冠詞付き分詞が指す目撃者を、名詞化しすぎず自然に表現した。「それ」は直前までの出来事を受ける。
- source_word: πῶς ἐγένετο
  choice: どのようなことが起こったか
  rationale: πῶςの「どのように」という意味を保ちつつ、日本語として、この人に生じた出来事の経緯を指す自然な表現とした。
- source_word: τῷ δαιμονιζομένῳ
  choice: 悪霊につかれていた人
  rationale: 悪霊による支配・憑依を表す文脈上の意味を明確にしつつ、現代日本語で理解しやすい表現とした。性別は周辺文脈では男性だが、この句自体の文法形だけに依存して「男」を補わず「人」とした。
- source_word: περὶ τῶν χοίρων
  choice: 豚のことについて
  rationale: περί＋属格の話題提示を「〜について」で保ち、χοῖροιを現代の一般的な語「豚」と訳した。
theological_decisions:
- issue: δαιμονιζομένῳが示す悪霊による状態
  choice: 悪霊につかれていた人
  alternative: 悪霊に取りつかれた人／悪霊に支配されていた人
  rationale: 物語が悪霊の実在的な働きを描く点を弱めず、同時に原語がその状態の仕組みや程度を厳密に定義していないため、「完全に所有された」などの説明は加えなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。καίの連続は「また」で示し、報告の二つの対象（その人に起きたことと豚のこと）を明確にした。本文に脚注は設けていないため、脚注マーカーもない。
