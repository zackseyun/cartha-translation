  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: ja
  text: するとすぐに、彼女の出血の源[a]は涸れ、彼女は自分の体で、その病苦[b]から癒やされたことが分かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼女の血の泉が涸れた」。原文は、泉や水源を表す語を用いている。
    reason: lexical_alternative
  - marker: b
    text: 「病苦」に当たる原語は、もともと「鞭、むち打ち」を意味し、ここでは彼女をひどく苦しめていた病を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコ福音書に特徴的な即時性を、自然で明快な現代日本語で表す。
- source_word: ἐξηράνθη
  choice: 涸れ
  rationale: 単に「止まり」とせず、「乾く、涸れる」という原語の鮮明な比喩を保つ。
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: 彼女の出血の源
  rationale: πηγήの「泉、源」という像を残しつつ、ここで指す出血を現代日本語で明瞭に示す。
- source_word: ἔγνω τῷ σώματι
  choice: 自分の体で悟った
  rationale: ἔγνωの認識の意味を「悟った」で保ち、与格τῷ σώματιを身体による直接的な認知として「体で」と訳す。
- source_word: ἴαται
  choice: 癒やされた
  rationale: 完了した治癒とその持続する結果を文脈に即して表す。「悟った」との時間関係から自然な日本語では過去形とする。
- source_word: ἀπὸ τῆς μάστιγος
  choice: その病苦から
  rationale: μάστιξの字義は「鞭、むち打ち」だが、ここでは彼女を苦しめる重い病を比喩的に指す。「病苦」は病と苦痛の双方を簡潔に伝える。
theological_decisions:
- issue: 治癒の客観性と本人の身体的認知
  choice: 出血が直ちに止まった事実と、本人が体で治癒を悟ったことの両方を表す。
  alternative: 主観的に「治ったと感じた」とだけ訳す。
  rationale: 原文は出血源が涸れたという客観的描写と、彼女の身体を通した認識を併記しているため、どちらも弱めず、治癒の仕組みについては説明を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「出血の源は涸れ」で原文の身体的かつ鮮明な像を残し、「自分の体で悟った」で単なる感覚以上の認識を表した。
