id: MRK.5.13
reference: Mark 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: ja
  text: イエスは彼らに許可を与えた。すると、汚れた霊たちは出て行って豚に入り、豚の群れは――およそ二千匹――急な斜面[a]を駆け下って海[b]へなだれ込み、海で溺れ死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「崖」または「絶壁」とも訳せる。ギリシア語は急な斜面や切り立った場所を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「海」。ここではガリラヤ湖を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: 彼らに許可された
  rationale: ἐπιτρέπωの「許す、許可する」を保ち、敬意を表す日本語の語り口として主語イエスに尊敬表現を用いた。目的内容は文脈に委ね、原文同様に補わない。
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: 汚れた霊ども
  rationale: マルコに特徴的な表現を保持し、人格的な霊的存在として描く原文を弱めない。「ども」は複数性を自然に示すためで、蔑称として強調する意図はない。
- source_word: ἐξελθόντα ... εἰσῆλθον εἰς τοὺς χοίρους
  choice: 出て行って豚に入り
  rationale: 分詞と定動詞が示す連続動作を、簡潔で自然な日本語にした。
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: 豚の群れは…駆け下って…なだれ込んだ
  rationale: ὁρμάωが表す突然の激しい移動を自然に伝える。「なだれ込んだ」は水への突入を示すが、統制不能な暴走以上の原因は付加しない。
- source_word: κατὰ τοῦ κρημνοῦ
  choice: 険しい斜面
  rationale: κρημνόςは急斜面、崖、絶壁を指し得る。「険しい斜面」は垂直の絶壁と断定せず、危険な下りを明確にする。
- source_word: εἰς τὴν θάλασσαν
  choice: 湖へ
  rationale: θάλασσαの語義は「海」だが、指示対象がガリラヤ湖であるため、現代日本語で誤解のない地理的表現を本文に採用し、直訳は注記した。
- source_word: ὡς δισχίλιοι
  choice: その数はおよそ二千匹
  rationale: ὡςの概数を「およそ」で示す。男性複数形は豚を数えているため、日本語の助数詞「匹」を用いた。
- source_word: ἐπνίγοντο
  choice: 溺れ死んだ
  rationale: 未完了過去の中動・受動形が描く水中での死を、自然な自動詞表現で示した。「溺れていた」だけでは死亡の結果が曖昧になり得る。
theological_decisions:
- issue: 「彼ら」の指示対象
  choice: 汚れた霊どもを指すものとして保持
  alternative: 「霊どもに」と本文で明示する
  rationale: 直前の文脈では悪霊たちが許可を求めており、指示対象は明らかである。ただし原文の代名詞を不必要に名詞へ置換せず、本文では「彼ら」とした。
- issue: 「汚れた霊」の存在論的表現
  choice: 人格的な霊として訳す
  alternative: 「悪の力」など非人格的に言い換える
  rationale: πνεύματαはこの物語で願い、出て行き、入る主体として描かれる。原文の描写を保持し、それ以上の悪霊論は加えない。
- issue: イエスを主語として明示すること
  choice: 「イエスは」とする
  alternative: 「彼は」または主語省略
  rationale: ギリシア語では動詞の主語が直前の文脈からイエスと分かる。単独の節としても明瞭な日本語にするため名を補ったが、解釈上の新情報ではない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書叙述にふさわしい端正さを保った。「許可された」はイエスへの敬意を示す慣用的な尊敬表現。「海」は日本語では外洋と誤解されやすいため本文を「湖」とし、原語の形を脚注に保存した。
