  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: ja
  text: そこには、山の近く[a]で餌を食べている豚の大きな群れがいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
