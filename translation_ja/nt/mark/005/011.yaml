    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: そこには……いた
  rationale: ἦνとἐκεῖの存在・場所の意味を、現代日本語で自然な存在構文にした。δέは弱い接続であり、この一節だけでは明示的な接続語を加えず、文脈上の移行に委ねた。
- source_word: πρὸς τῷ ὄρει
  choice: 山の近く
  rationale: 与格を伴うπρόςが表す、山に近接した場所という意味を自然に表した。「山のそば」も可能なので脚注に示した。
- source_word: ἀγέλη χοίρων μεγάλη
  choice: 豚の大きな群れ
  rationale: ἀγέληは動物の「群れ」、χοίρωνは現代日本語で通常「豚」、μεγάληは群れの規模が大きいことを示す。
- source_word: βοσκομένη
  choice: 餌を食べている
  rationale: 群れがその場で食べている継続中の状態を表す。「草を食べている」と限定せず、語の広い意味を保った。
