  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: ja
  text: そしてイエスは彼に尋ねていた。「おまえの名は何か。」彼はイエスに言う。「私の名はレギオン[a]。私たちは大勢いるからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レギオン」は、ギリシア語に取り入れられたラテン語の軍事用語で、ローマ軍の大部隊を指す。ここでは悪霊が名として名乗り、数が多いことを暗示している。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: 尋ねていた
  rationale: 未完了過去の継続的または反復的な様相を保ち、単純な「尋ねた」に平板化しないため。
- source_word: Τί ὄνομά σοι
  choice: おまえの名は何か
  rationale: ὄνομαと与格代名詞による慣用表現を、直接的で自然な現代日本語の問いとして表した。文脈上、イエスから汚れた霊への呼びかけなので「おまえ」とした。
- source_word: λέγει αὐτῷ
  choice: 彼はイエスに言う
  rationale: 歴史的現在を「言う」で残し、マルコの生き生きとした語り口を保った。日本語では代名詞だけだと指示対象が曖昧になるため、αὐτῷを文脈に即して「イエスに」と明示した。
- source_word: Λεγιὼν
  choice: レギオン
  rationale: ギリシア語に取り入れられたラテン語の軍事用語であり、ここでは話者が名として提示する呼称なので、翻訳せず音写した。
- source_word: ὄνομά μοι
  choice: 私の名は
  rationale: 与格代名詞を伴う名詞文を、自然な日本語の自己名乗りとして訳した。
- source_word: ὅτι πολλοί ἐσμεν
  choice: 私たちは大勢だからだ
  rationale: ὅτιの理由説明と一人称複数を明確に保った。「多い」より、人を数える表現として自然な「大勢」を用いた。
theological_decisions:
- issue: 話者の自己言及が単数から複数へ移ること
  choice: 「私の名はレギオン」と「私たちは大勢」をともにそのまま残す
  alternative: 「私たちの名はレギオン」などとして単数・複数の緊張をならす
  rationale: 原文は単数の自己名乗りと複数の理由説明を意図的に並べている。ひとりの男を通して語る悪霊の多数性に関わる緊張を、解消せず保持した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、聖書本文としての簡潔さと品位を保った。未完了過去と歴史的現在の対照を「尋ねていた」「言う」で表現した。
