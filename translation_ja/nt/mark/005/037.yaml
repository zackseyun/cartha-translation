review_pass:
  verdict: revise
  source_fidelity: 原文は「だれにも、彼と共に同行することを許さなかった」という全面的な禁止と三人のみの例外を述べています。現行の「ご自分について来る」は文脈上は通じますが、「同行する／一緒に行く」よりも弟子として「従う」という含意を帯び得るため、μετ’ αὐτοῦ συνακολουθῆσαιの同行の意味をより直接に表すのが安全です。
  naturalness: 現行文は概ね自然です。ただし「ヤコブの兄弟ヨハネ」はやや圧縮された名詞句なので、「ヤコブの兄弟であるヨハネ」とすると、ヨハネを特定する原文の同格的説明が明瞭になります。
  terminology: ペトロ、ヤコブ、ヨハネの表記は一貫しており問題ありません。「兄弟」は原文ἀδελφόςの年齢を特定しない表現として適切です。イエスへの「お許しにならなかった」も本文の格調に合っています。
  issues:
  - severity: low
    issue: 「ご自分について来ること」
    rationale: 「ついて来る」は「従う」とも受け取られ得ます。原文はμετ’ αὐτοῦ（彼と共に）とσυνακολουθῆσαι（同行する）の組合せなので、「イエスと一緒に行く」として同行の意味を明示する方が原文に近く、曖昧さを増やしません。
  - severity: low
    issue: 「ヤコブの兄弟ヨハネ」
    rationale: 意味は正しいものの、説明句であることを明瞭にするため「ヤコブの兄弟であるヨハネ」とします。
  revised_text: イエスは、ペトロとヤコブと、ヤコブの兄弟であるヨハネのほかには、だれにもイエスと一緒に行くことをお許しにならなかった。
