  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: ja
  text: イエスは、ペトロとヤコブと、ヤコブの兄弟であるヨハネのほかには、だれにもイエスと一緒に行くことをお許しにならなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: お許しにならなかった
  rationale: 不定詞を伴うこの用法は「許す」を意味する。主語であるイエスにふさわしい自然な敬語とし、否定を含めて表現した。
- source_word: οὐδένα
  choice: だれも…なかった
  rationale: 全面的な否定を、現代日本語で自然な呼応表現にした。
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: ご自分について来ること
  rationale: συνακολουθέωの「一緒について行く、同行する」という意味とμετ’ αὐτοῦを、日本語で重複感なく表した。場面上、イエスについて先へ進むことを指す。
- source_word: εἰ μὴ
  choice: …のほかには
  rationale: ここでは条件ではなく例外を導くため、明確な例外表現とした。
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: ペトロとヤコブと…ヨハネ
  rationale: 固有名を一般的な聖書表記で音写し、反復されるκαίを不自然にならない範囲で「と」により反映した。
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: ヤコブの兄弟ヨハネ
  rationale: ヨハネを特定する同格句として、原文の関係を明瞭に保った。「兄弟」は年長・年少を原文以上に特定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で格調のある現代標準日本語。イエスへの叙述には自然な尊敬表現を用いた。原文が示さない兄弟間の年齢差は補わず、「兄弟」とした。
