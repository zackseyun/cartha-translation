  to: イエスは、ペトロとヤコブと、ヤコブの兄弟であるヨハネのほかには、だれにもイエスと一緒に行くことをお許しにならなかった。
  rationale: 例外となる三人、全面否定、ヨハネがヤコブの兄弟であることを保ったまま、「同行する」という原文の具体的な意味を明確にしました。
