  to: しかし、イエスは彼が同行するのをお許しにならず、彼に言われた。「家に帰り、あなたの身近な人たちに、主[b]があなたのためにしてくださったすべてのこと、また、あなたにあわれみを示してくださったことを知らせなさい。」
