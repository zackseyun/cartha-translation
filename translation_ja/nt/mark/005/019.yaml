source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: ja
  text: しかし、イエスは彼が同行するのをお許しにならず、彼に言われた。「家に帰り、あなたの身近な人たちに、主[b]があなたのためにしてくださったすべてのこと、また、あなたにあわれみを示してくださったことを知らせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ここでの「主」を特に神と理解する見方がある一方、神のあわれみとイエス自身の行為との結びつきが意図されていると見ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: イエスはそれを許さず
  rationale: ἀφίημιはここでは「許す」の意。日本語では目的内容を「それ」と受け、主語の曖昧さを避けるため、文脈上の主語「イエス」を明示した。
- source_word: λέγει αὐτῷ
  choice: 彼に言った
  rationale: ギリシア語は歴史的現在だが、自然な日本語の物語文として過去形にした。
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: 自分の家に……帰り
  rationale: ὕπαγεは目的地へ行く命令であり、直前まで家を離れていた文脈を踏まえて「帰り」とした。οἶκοςはここでは生活の場としての家を指す。
- source_word: πρὸς τοὺς σούς
  choice: 自分の者たちのところへ
  rationale: 直訳に近い幅のある表現を保ち、家族だけに限定しなかった。補足は脚注に示した。
- source_word: ἀπάγγειλον αὐτοῖς
  choice: 彼らに知らせなさい
  rationale: ἀπαγγέλλωは、起こったことを伝え知らせる意。「報告しなさい」より自然で、単なる発話以上の伝達の意味も保つ。
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: 主があなたのためにどれほど大きなことをしてくださり
  rationale: ὅσαは行われた事柄とその大きさの双方を含みうるため、「どれほど大きなこと」とした。σοιは動詞にかかる受益の与格として「あなたのために」と訳した。
- source_word: ἠλέησέν σε
  choice: あなたをあわれんでくださったか
  rationale: ἐλεάωの「あわれみを示す」という意味を、主の恵み深い行為を表す自然で格調ある日本語にした。
theological_decisions:
- issue: イエスが「主のなさったこと」を語るよう命じる箇所での κύριος の指示対象
  choice: 主
  alternative: 神／主人
  rationale: κύριοςを「主」と訳し、神を特に指すとする理解と、神のあわれみとイエス自身の権威ある行為との結びつきをマルコが保っているとする理解の間の緊張を解消しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の重みと「あわれみ」という聖書的語感を保った。「自分の者たち」はやや直訳的だが、対象を家族だけに狭めないため本文に残し、脚注で意味範囲を補った。
