  naturalness: 「ヤイロという名の人」は意味は明瞭だが、「人」が重なってやや不自然である。「ヤイロという人」とするのが現代標準日本語として簡潔で自然である。また、後半の「その足もと」は直前の主語ヤイロに一瞬結び付く余地があるので、「イエスの足もと」と明示すると指示関係が明瞭になる。
  terminology: 「会堂の指導者」はἀρχισυνάγωγοςを平明に表す妥当な訳語であり、「会堂司」のような専門用語を必須としない。「ヤイロ」も日本語聖書で広く通用する表記である。
