  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: ja
  text: そこへ、会堂の指導者の一人で、ヤイロという人がやって来た。彼はイエスを見ると、イエスの足もとにひれ伏した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「やって来る……ひれ伏す」と現在形が用いられ、場面が生き生きと描かれている。
    reason: historical_present
lexical_decisions:
- source_word: ἔρχεται
  choice: やって来た
  rationale: 物語を生き生きと描く歴史的現在形だが、現代日本語の自然な物語文として過去形で表した。
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: 会堂の指導者の一人
  rationale: 部分を表す構文を保ち、会堂の運営に責任を持つ役職を、一般の読者に分かりやすい表現にした。
- source_word: ὀνόματι Ἰάϊρος
  choice: ヤイロという名の人
  rationale: 名前を示すギリシア語の慣用表現を、明瞭で自然な日本語にした。
- source_word: ἰδὼν αὐτόν
  choice: 彼はイエスを見ると
  rationale: アオリスト分詞が示す時間的なつながりを自然に表し、代名詞の指示対象を日本語で明確にした。
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: その足もとにひれ伏した
  rationale: イエスの前に身を伏せる具体的な動作を表し、礼拝という意味までは訳文に加えなかった。
theological_decisions:
- issue: イエスの前で取った姿勢の意味
  choice: その足もとにひれ伏した
  alternative: イエスを礼拝した
  rationale: 本文は身体動作を述べており、敬意、切迫した願い、礼拝のいずれかに意味を限定していないため、その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。会堂の役職名には専門的な「会堂司」ではなく、理解しやすい「会堂の指導者」を用いた。
