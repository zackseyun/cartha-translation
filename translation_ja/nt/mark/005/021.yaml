  source_fidelity: 原文の属格独立構文が示す渡航後の場面転換を「渡ると」で自然に表し、「舟で」「再び」「向こう岸へ」も各要素を過不足なく反映している。「大勢の群衆がイエスのもとに集まって来た」は、ὄχλος πολὺς とἐπ’ αὐτόνのイエスへの収集・接近を適切に伝える。結びの「イエスは海辺におられた」も、ἦν παρὰ τὴν θάλασσανの継続的な位置を自然に訳している。
