id: MRK.5.21
reference: Mark 5:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: ja
  text: イエスが舟で再び向こう岸[a]へ渡ると、大勢の群衆がイエスのもとに集まって来た。イエスは海辺におられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ガリラヤ湖のこと。福音書では、湖であるこの水域を慣例的に「海」と呼んでいる。
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: 渡ると
  rationale: 属格独立構文のアオリスト分詞が示す先行する状況を、自然な現代日本語の時間表現で示した。群衆が集まるより先に渡航が完了したという順序も文脈上明らかである。
- source_word: ἐν τῷ πλοίῳ
  choice: 舟で
  rationale: 移動手段を表す自然な日本語とした。「船」も可能だが、ガリラヤ湖で用いられる比較的小型の舟を想起しやすい表記を選んだ。
- source_word: πάλιν
  choice: 再び
  rationale: 反復を明示する副詞の意味を簡潔に保持した。
- source_word: εἰς τὸ πέραν
  choice: 向こう岸へ
  rationale: 湖を渡って反対側の岸へ行くという文脈上の意味を、明瞭で自然な日本語にした。
- source_word: συνήχθη
  choice: 集まって来た
  rationale: 受動形だが、この文脈では群衆が一か所へ集結する出来事を表す。「来た」を添え、イエスのもとへ向かう動きを自然に示した。
- source_word: ὄχλος πολὺς
  choice: 大勢の群衆
  rationale: 群衆の規模が大きいことを、一般読者に分かりやすい現代日本語で表した。
- source_word: ἐπ’ αὐτόν
  choice: イエスのもとに
  rationale: ἐπί＋対格が示すイエスへの接近・集結を自然に表現した。「周りに」も可能だが、原文は必ずしも包囲する配置まで限定しない。
- source_word: παρὰ τὴν θάλασσαν
  choice: 海辺に
  rationale: παρά＋対格による水辺に沿った位置を簡潔に示した。
- source_word: θάλασσαν
  choice: 海
  rationale: ガリラヤ湖を指すが、原語の通常の呼称「海」を本文に保持し、地理的説明は脚注に置いた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文としての簡潔さと品位を保った。「おられた」はイエスについて日本語として自然な敬意を示すが、原文にない教派的解釈を付加するものではない。
