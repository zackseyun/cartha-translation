  terminology: 「イエス」「舟」「海辺」は本文脈にふさわしい。原語どおり本文を「海」とし、ガリラヤ湖であることを脚注で説明する処理は適切である。「おられた」は日本語の通常の敬意表現の範囲であり、教派的解釈を加えていない。
