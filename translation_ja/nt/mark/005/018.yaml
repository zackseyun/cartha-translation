  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: ja
  text: イエスが舟に乗り込まれるところで、悪霊に取りつかれていた人が、イエスと一緒にいたいと、しきりに願った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: イエスが舟に乗ろうとされると
  rationale: 属格独立構文の現在分詞が示す、主動詞と同時進行の動作を自然な日本語で表した。代名詞の指示対象を明確にするため「イエス」とした。
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖上の小型船という文脈に適し、現代の聖書文体でも自然な「舟」を採用した。
- source_word: παρεκάλει
  choice: しきりに願った
  rationale: 未完了過去の継続・反復的な側面と、切実に願う παρακαλέω の語感を表す。
- source_word: ὁ δαιμονισθείς
  choice: 悪霊につかれていた人
  rationale: 実体詞的なアオリスト受動分詞が、すでに解放された人物の以前の状態を指すことを「つかれていた」で示した。「人」を補って自然な日本語にした。
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: イエスと一緒にいさせてほしいと
  rationale: ἵνα＋接続法が願いの内容を示す構造を保ちつつ、μετά の人格的・同行的な「共にいる」という意味を自然な依頼表現にした。代名詞の重なりによる曖昧さを避けるため「イエス」と明示した。
theological_decisions:
- issue: δαιμονισθείς が表す悪霊による支配・苦しみの訳し方
  choice: 悪霊につかれていた
  alternative: 悪霊に取りつかれていた／悪霊の支配下にあった
  rationale: 福音書の物語が悪霊を現実の人格的な力として描くことを保持し、単なる病気や比喩へ還元しない。一方、現代日本語として広く理解できる慣用表現を用いた。
translation_notes:
  register: 明快な現代標準語を基調にしながら、福音書にふさわしい落ち着いた品位を保った。「しきりに」により未完了過去の継続性を示し、過度に古風な「懇願した」は避けた。
