  text: καὶ περιεβλέπετο ἰδεῖν τὴν τοῦτο ποιήσασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/032.yaml
  text: And he kept looking around to see the one who had done this[a].
translation:
  language: ja
  text: イエスは、このことをした人を見ようと、あたりを見回しておられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の「した人」は女性形で、この人物が女性であることを示している。
    reason: 原文の文法的性が日本語本文では表れないため。
lexical_decisions:
- source_word: καὶ
  choice: （文脈上、独立した接続語を置かない）
  rationale: 日本語では前後の叙述の連続性が明らかであり、「そして」を明示しないほうが自然である。推論や時間的前進を新たに加えない。
- source_word: περιεβλέπετο
  choice: あたりを見回しておられた
  rationale: 未完了過去の継続的な動作を「見回しておられた」で表した。中動態はここでは周囲を見渡す動作を自然に描く。イエスへの敬意を保つため尊敬表現を用いた。
- source_word: ἰδεῖν
  choice: 見ようと
  rationale: 不定詞が示す目的を、自然な日本語の「〜ようと」で表した。「見つけようと」では探索の結果まで強く含意するため避けた。
- source_word: τὴν τοῦτο ποιήσασαν
  choice: このことをした人
  rationale: 冠詞を伴う女性形分詞を名詞化して訳した。日本語の「人」は文法上性を示さないため、原文で指示対象が女性であることは脚注で明示する。
- source_word: τοῦτο
  choice: このこと
  rationale: 直前の出来事を指す指示語として、文脈に即した自然な表現である。
theological_decisions: []
