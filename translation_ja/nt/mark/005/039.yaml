  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: ja
  text: 中に入ると、イエスは彼らに言う。「なぜ騒ぎ立てて泣いているのか。その子は死んだのではなく、眠っているのだ。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その子は死ななかった。眠っている」。この「眠っている」は、これから生き返らされることを踏まえ、死を眠りにたとえた表現とも取れる。
    reason: 語法上の別訳と、意図的に残された比喩的可能性を示すため。
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 中に入ると
  rationale: アオリスト分詞が主動詞に先立つ行為を表すことを、自然な現代日本語で示す。厳密な時間間隔までは付加しない。
- source_word: λέγει
  choice: 言う
  rationale: マルコに特徴的な歴史的現在を保ち、場面の生き生きとした語り口を伝える。
- source_word: Τί
  choice: なぜ
  rationale: 現在形の動詞を伴う問いかけでは、理由を問うと同時にたしなめる語調を自然に表す。
- source_word: θορυβεῖσθε
  choice: 騒ぎ立てて
  rationale: 大きな物音を伴う騒動に加わっている様子を、簡潔で自然な日本語にする。
- source_word: κλαίετε
  choice: 泣いている
  rationale: 過度に儀礼的な哀哭と限定せず、原語の基本的な意味を明瞭に表す。
- source_word: τὸ παιδίον
  choice: その子
  rationale: 文脈上は少女だが、この節の原語は性別を明示しない「子ども」であるため、その一般性を保つ。
- source_word: οὐκ ἀπέθανεν
  choice: 死んだのではなく
  rationale: 死ぬという出来事を否定する原文の強い表現を保ち、「死んでいない」という状態表現への置き換えを避ける。
- source_word: καθεύδει
  choice: 眠っているのだ
  rationale: 現在の継続的な眠りを表し、死を眠りとして語る可能性のある比喩を解釈で消さない。
theological_decisions:
- issue: イエスの言葉を死の文字どおりの否定と取るか、死を眠りと呼ぶ比喩と取るか
  choice: 「死んだのではなく、眠っているのだ」と本文にそのまま置き、緊張を保つ。
  alternative: 「永久に死んだのではない」「これから生き返らせるので、眠っているにすぎない」などと意味を補う。
  rationale: ギリシャ語は説明を加えず、死と眠りを対照させている。文字どおりの否定、比喩、やがて起こる蘇生を見越した発言のいずれかに翻訳段階で限定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、歴史的現在の「言う」によってマルコの鮮明な語り口を保った。「イエス」は日本語で主語を明確にするため文脈から補った。発言は簡潔で威厳ある調子とし、教派的な解釈を加えていない。
