  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: ja
  text: この人は墓場を住みかとしていた[a]。もはや誰も、鎖を使ってさえ、彼を縛ることができなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より形式的には「墓々の間に住みかを持っていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: 住みかとしていた
  rationale: 直訳的な「住居を持っていた」という構文の意味を保ちつつ、継続的にそこに住んでいたことを自然な現代日本語で表す。
- source_word: ἐν τοῖς μνήμασιν
  choice: 墓場を
  rationale: μνῆμαは墓・埋葬所を指す。複数の墓がある一帯という場面に合う自然な表現として「墓場」を用いた。より形式的には「墓々の間に」とも訳せるため、脚注で示す。
- source_word: οὐδὲ ἁλύσει
  choice: 鎖を使ってさえ
  rationale: ἅλυσιςの単数形を「鎖」とし、οὐδέの強意を「さえ」で表した。手段を示す与格は自然な日本語として「使って」とした。
- source_word: οὐκέτι
  choice: もはや
  rationale: 以前は可能だった状態が今は続いていないことを示す語義を簡潔に表す。
- source_word: οὐδεὶς ἐδύνατο
  choice: 誰も……できなかった
  rationale: 過去における継続的な不可能を、自然な否定構文で表した。
- source_word: δῆσαι
  choice: 縛る
  rationale: 鎖による身体的拘束という文脈に即し、解釈を加えすぎない基本義を採用した。
