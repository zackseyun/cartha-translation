  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: ja
  text: 彼らはイエスに懇願して言った。「私たちを豚たちの中へ送って、そこに入らせてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: 懇願した
  rationale: 単なる「頼んだ」よりも切迫した強い願いを表し、この文脈における動詞の語感を自然な現代日本語で伝える。
- source_word: αὐτὸν
  choice: イエスに
  rationale: 代名詞の指示対象を日本語で明確にし、自然な文脈接続とした。
- source_word: λέγοντες
  choice: 「……」
  rationale: 分詞が願いの内容を導入しているため、日本語では直接話法をそのまま続け、冗長な「こう言って」を避けた。
- source_word: Πέμψον
  choice: 送って
  rationale: 許可の含意を読み込みすぎず、πέμπω の明示的な「送る」という意味を保持した。後続の依頼表現と合わせて自然な日本語にした。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 一人称複数対格を明瞭に訳した。
- source_word: εἰς τοὺς χοίρους
  choice: 豚の中へ
  rationale: χοῖρος を現代日本語で一般的な「豚」とし、εἰς の方向性を「中へ」で表した。
- source_word: ἵνα
  choice: ……入らせてください
  rationale: 目的を表す節を、日本語の依頼文として自然な「送って、入らせてください」という連結で示した。
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: 彼らの中に入らせてください
  rationale: εἰσέρχομαι の「中に入る」を保持した。αὐτούς が直前の豚を受ける一方、文法上は男性複数であることを反映して「彼ら」とした。
theological_decisions:
- issue: 話者たちがイエスに願う行為の性質
  choice: 話者たちはイエスの権威のもとで、豚の中に入ることを切実に願っているものとして訳した。
  alternative: 単に移動先を求めたという弱い表現にする。
  rationale: 「懇願した」と命令形「送って」によって、本文が描く従属関係を保ちつつ、本文を越えた教理的説明は加えない。
- issue: ἵνα 節における使役・許可の表現
  choice: 「入らせてください」とし、送ることによって入ることが可能になるという願いを表した。
  alternative: 「私たちが入るためです」と目的節を形式的に独立させる。
  rationale: 日本語として自然にしながら、彼らが自力で当然に入れるのではなく、イエスへの願いとして述べている関係を保持する。
translation_notes:
  register: 明快で現代的な標準日本語。語りは簡潔かつ品位を保ち、悪霊たちの切迫した願いとイエスへの従属が本文どおり伝わるようにした。
