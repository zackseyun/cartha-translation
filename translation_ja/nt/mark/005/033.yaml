source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: ja
  text: しかし、その女は、恐れて震えながら、自分の身に起こったことを知って、来て、イエスの前にひれ伏し、すべてをありのままに話した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節のイエスの問いと群衆の反応を受け、女の応答へ移る際の穏やかな対照を示す。
- source_word: ἡ γυνὴ
  choice: その女
  rationale: 物語ですでに登場している特定の女を指すため。現代日本語では「その女」が明確で自然。
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: 恐れて震えながら
  rationale: 二つの分詞が表す恐れと身体的な震えを、動的な状態として保つ。
- source_word: εἰδυῖα ὃ γέγονεν αὐτῇ
  choice: 自分の身に起こったことを知り
  rationale: 分詞の関係を明示的に因果へ限定せず、「彼女に起こったこと」を自然な日本語で表す。
- source_word: ἦλθεν
  choice: 進み出て
  rationale: 単なる到来を文脈に即して自然に表しつつ、イエスへ近づいたこと以上の意味は加えない。
- source_word: προσέπεσεν αὐτῷ
  choice: イエスの前にひれ伏し
  rationale: 相手の前に身を伏せる動作を自然に示す。「礼拝した」とはせず、敬意、恐れ、懇願のいずれともなり得る含みを保つ。
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: すべてをありのままに話した
  rationale: 何も隠さず事実の全体を語ったという意味を、明瞭で慣用的な日本語にする。
theological_decisions:
- issue: προσέπεσεν αὐτῷ におけるイエスの前での姿勢
  choice: イエスの前にひれ伏し
  alternative: イエスの前に倒れ伏し／イエスの足もとにひれ伏し
  rationale: 動詞は敬意、恐れ、懇願などを伴って相手の前に身を伏せることを表し得る。「礼拝」と断定せず、また本文に明記されない「足もと」も補わないことで、動作と神学的含みの幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として流れる一文にした。「御前」などの古風な宗教語は避けつつ、「ひれ伏す」によって場面の厳粛さを保った。
