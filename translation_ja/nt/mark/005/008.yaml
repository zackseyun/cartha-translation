  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: ja
  text: イエスが彼[a]に、「汚れた霊よ、その人から出て行け」と言っておられたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その霊に」。ギリシア語の代名詞は、ここでは「彼に」とも「それに」とも取りうる。命令自体は汚れた霊に向けられている。
    reason: 原語の代名詞の指示対象に形態上の曖昧さがあるため。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っておられた
  rationale: 未完了時制が示す過去の継続的・反復的な発言を自然な日本語で表した。単純な「言われた」よりも、この命令が先行する出来事の背景であることを伝える。
- source_word: γὰρ
  choice: からである
  rationale: 前節の出来事の理由を説明する接続関係を、日本語の文末表現によって自然に示した。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 与格代名詞は文脈上、悪霊に取りつかれた男性を指すと理解した。ただし形態上は中性単数とも同形であり、「その霊に」と取る余地を脚注に残した。
- source_word: Ἔξελθε
  choice: 出て行け
  rationale: アオリスト命令形の直接的な命令を簡潔に表した。「出て来い」も可能だが、日本語では人の内から離れる動きを「出て行け」が自然に示す。
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: 汚れた霊よ
  rationale: 定冠詞を伴う主格形だが、命令に続く呼びかけとして機能しているため、呼格助詞「よ」を用いた。「悪霊」と意訳せず、ἀκάθαρτον の「汚れた」を保持した。
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: この人から
  rationale: ἐκ が表す内部から外への移動を、動詞「出て行け」と組み合わせて自然に表した。定冠詞付きの特定の男性を、場面に即して「この人」とした。
theological_decisions:
- issue: 悪霊追放の文脈における πνεῦμα ἀκάθαρτον の訳
  choice: 汚れた霊
  alternative: 悪霊
  rationale: 原文は明示的に「汚れた霊」と述べており、福音書に特徴的な汚れの含意を保つため直訳に近い表現を採用した。「悪霊」は意味を狭める解釈的な訳となる。
- issue: αὐτῷ の指示対象
  choice: 取りつかれた人（彼）
  alternative: 汚れた霊（その霊）
  rationale: 物語上、イエスが男性に向かって語り、その内にいる霊に命じている構図として読むのが自然である。ただし代名詞の形だけでは男性・中性を区別できないため、別解を脚注で明示した。
translation_notes:
  register: 明快で現代的な標準語を用いながら、イエスの継続的な発言には「言っておられた」を用いて落ち着いた尊厳を保った。直接命令は「汚れた霊よ、この人から出て行け」と簡潔かつ力強くした。
