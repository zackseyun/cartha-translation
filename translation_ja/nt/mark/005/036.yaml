id: MRK.5.36
reference: Mark 5:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: ja
  text: しかし、イエスは話されていることを耳にして[a]、会堂の指導者に言われた。「恐れることはない。ただ信じなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「話されたことを意に介さず」とも訳せる。ギリシア語の動詞には、「耳にする」という意味のほか、「聞き流す」「意に介さない」という意味もある。
    reason: alternative_reading
  - marker: b
    text: 「ただ信頼しなさい」または「ただ信仰を持ちなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: 耳にすると
  rationale: この文脈では、ヤイロに告げられた知らせをイエスが聞き、それに応じて語りかけるという物語の流れを自然に表す。「無視して」の意味も可能なので脚注に残す。
- source_word: τὸν λόγον λαλούμενον
  choice: 話されていること
  rationale: 直訳的な「話されている言葉」より自然な現代日本語としつつ、直前に告げられた内容を過度に具体化しない。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語はマルコに多い歴史的現在だが、日本語では過去形が自然である。イエスへの敬意を示す一般的な尊敬表現を用いる。
- source_word: ἀρχισυναγώγῳ
  choice: 会堂の指導者
  rationale: 当時の会堂を統括・指導した役職を、専門語に偏らない明瞭な現代日本語で表す。
- source_word: Μὴ φοβοῦ
  choice: 恐れることはない
  rationale: 禁止・励ましの力を保ちながら、悲報を受けた相手への語りかけとして自然で格調ある表現にする。
- source_word: μόνον
  choice: ただ
  rationale: イエスが求める応答を一つに限定する語の働きを、自然な日本語で明確に示す。
- source_word: πίστευε
  choice: 信じなさい
  rationale: 現在命令形の継続的含意を排除はしない簡潔な訳。「信頼しなさい」「信仰を持ちなさい」という語義上の選択肢は脚注に示す。
theological_decisions:
- issue: παρακούσας の意味
  choice: イエスが告げられていることを耳にした
  alternative: イエスが告げられたことを意に介さなかった
  rationale: 両義が語彙上可能だが、直後にその知らせを受けて会堂の指導者へ語りかける構文と物語の流れには「耳にした」がよく合う。解釈上の違いは脚注で保持する。
- issue: πίστευε の訳語
  choice: 信じなさい
  alternative: 信頼しなさい／信仰を持ちなさい
  rationale: 動詞 πιστεύω の最も直接的で自然な対応語を本文に置く一方、信頼や信仰という含みを一つに限定せず脚注に残す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、イエスの発言には簡潔で dignified な調子を保った。「会堂司」のような専門的な役職名は避け、「会堂の指導者」とした。
