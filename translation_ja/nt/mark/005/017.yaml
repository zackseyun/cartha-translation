  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: ja
  text: そして、人々はイエスに、自分たちの地方から出て行ってほしいと懇願し始めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの領域から立ち去るよう、イエスに強く頼み始めた。」
    reason: παρακαλεῖνとὅριαには、それぞれ「強く頼む／促す」「領域／地域」という訳の幅があるため。
lexical_decisions:
- source_word: καὶ
  choice: そこで
  rationale: 直前の出来事を受けた物語の進展を、現代日本語で自然に示す。単なる並列の「そして」も可能だが、この文脈では結果的なつながりが感じられる。
- source_word: ἤρξαντο
  choice: し始めた
  rationale: 不定詞を伴う開始の意味を明確に保つ。
- source_word: παρακαλεῖν
  choice: 懇願し
  rationale: 出来事を目撃した人々がイエスに立ち去るよう強く願う文脈上の切迫感を表す。「頼み」や「促し」も可能。
- source_word: αὐτὸν
  choice: イエスに
  rationale: 代名詞の指示対象を日本語で明確にし、自然な文にする。
- source_word: ἀπελθεῖν
  choice: 出て行ってほしいと
  rationale: 依頼内容を表す不定詞を、日本語の懇願表現に自然に組み込む。「立ち去ってほしい」も可能。
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: 自分たちの地方から
  rationale: ὅριαは字義的には境界だが、複数形のこの用法では境界内の地域・領域を指すため、「地方」とした。
