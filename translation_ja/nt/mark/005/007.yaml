reference: Mark 5:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: ja
  text: そして、彼は大声で叫んで言った。「いと高き神の子、イエスよ、私とあなたに何の関わりがあるのですか。[a] 神にかけて、あなたにお願いします。[b] 私を苦しめないでください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「私とあなたに何があるのですか」。相手との関わりを拒み、距離や対立を表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 「神にかけて厳かに求めます」、または「神の御前であなたに誓わせます」とも訳せる。原語には、誓いをもって厳粛に要求する響きがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: 大声で叫んで
  rationale: アオリスト分詞と与格表現を、主動詞に先立つ激しい叫びとして自然な現代日本語で表した。
- source_word: λέγει
  choice: 言った
  rationale: マルコに多い歴史的現在だが、日本語の物語文として不自然にならないよう過去形に整えた。出来事の意味は変わらない。
- source_word: Τί ἐμοὶ καὶ σοί
  choice: 私とあなたに何の関わりがあるのですか
  rationale: 距離、拒絶、対立を示すセム語的慣用句を、鋭さを保ちながら理解しやすい日本語にした。
- source_word: Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: いと高き神の子イエスよ
  rationale: 呼格を明示し、神への称号「いと高き」とイエスへの「神の子」という呼びかけをともに保持した。
- source_word: ὁρκίζω σε τὸν θεόν
  choice: 神にかけてお願いします
  rationale: 神を引き合いに出す厳粛な懇願・誓約要求の力を、古すぎない日本語で示した。 oath-like な含意は脚注に残した。
- source_word: μή με βασανίσῃς
  choice: 私を苦しめないでください
  rationale: βασανίζωの強い苦痛を示しつつ、文脈で拷問の具体的方法まで限定しない自然な表現とした。
theological_decisions:
- issue: 悪霊によるイエスの身分の認識
  choice: いと高き神の子イエスよ
  alternative: いと高き方である神の子イエスよ
  rationale: 悪霊がイエスの高い身分を認める本文の明示的な告白を弱めず、同時に後代の教理用語を付加しない。
- issue: 悪霊が神を引き合いに出してイエスに訴える表現
  choice: 神にかけてお願いします
  alternative: 神に誓って命じます／神の御前であなたに誓わせます
  rationale: 単なる依頼へ弱め切らず、悪霊が神の名によってイエスに厳粛に訴えるという緊張を保持する。ただし日本語で過度に権威的な命令と断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、呼びかけの「いと高き」と神を引き合いに出す厳粛な訴えには聖書本文にふさわしい品位を保った。物語の歴史的現在は日本語として自然な過去形にした。
