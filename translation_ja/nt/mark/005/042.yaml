id: MRK.5.42
reference: Mark 5:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: ja
  text: そしてすぐに、少女は起き上がり、歩き始めた[a]。彼女は十二歳だったのである。彼らはすぐに、非常に驚いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立ち上がった」とも訳せる。ギリシア語の動詞は「起き上がる」「立ち上がる」などの意味で用いられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くすれば、「大きな驚きで驚いた」となる。ギリシア語では同根の語を重ねて、驚きの強さを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐ
  rationale: マルコに特徴的な物語の速度感を保ちつつ、現代日本語で明快な表現とした。本文に二度ある語をどちらも訳出した。
- source_word: ἀνέστη
  choice: 起き上がり
  rationale: ここでは少女が実際に身を起こしたことを自然に表す。動詞自体に必要以上の復活用語を持ち込まず、文脈上の生命回復も妨げない。
- source_word: τὸ κοράσιον
  choice: 少女
  rationale: 若い女の子を指す自然で簡潔な語。直後に十二歳と明記されるため、年齢を重ねて説明しない。
- source_word: περιεπάτει
  choice: 歩き始めた
  rationale: 未完了過去形が描く継続的な歩行を、起き上がった直後の動作として自然な日本語で表した。
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: 十二歳だったのである
  rationale: γάρの説明的な働きを保ち、年齢を現代日本語の標準的な言い方で示した。
- source_word: ἐξέστησαν
  choice: 驚きに包まれた
  rationale: 通常の驚きを超えて圧倒された状態を表し、後続する同根名詞との強意表現を自然な日本語にした。
- source_word: ἐκστάσει μεγάλῃ
  choice: 非常な驚き
  rationale: 強烈な驚愕を明瞭に伝える。「恍惚」など現代日本語で誤解を招きやすい語は避けた。
theological_decisions:
- issue: ἀνέστηにあり得る復活の含意
  choice: 身体動作として「起き上がり」と訳す
  alternative: 「よみがえり」または「立ち上がり」
  rationale: 文脈では少女が死から命へ戻されたことは明らかだが、この動詞そのものは単に起き上がることも意味する。本文が要求する以上に復活の専門用語へ限定しない。
- issue: ἐξέστησαν ἐκστάσει μεγάλῃの同根語反復
  choice: 「非常な驚きに包まれた」と自然に強意を表す
  alternative: 「大きな驚きで驚いた」と形式的に反復する
  rationale: 原文の強烈さは保持しながら、不自然な日本語の重複は脚注で示した。
translation_notes:
  register: 明快で品位ある現代標準日本語。マルコの素早い語り口を保つため「すぐ」を二度訳出し、過度に文語的・教派的な語彙は避けた。
