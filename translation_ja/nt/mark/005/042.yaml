revisions:
- from: するとすぐ、少女は起き上がり、歩き始めた[a]。十二歳だったのである。そして人々はすぐに、非常な驚きに包まれた[b]。
  to: そしてすぐに、少女は起き上がり、歩き始めた[a]。彼女は十二歳だったのである。彼らはすぐに、非常に驚いた[b]。
  rationale: 接続を原文の叙述的な流れに合わせて「そしてすぐに」とし、主語を原文どおり特定しない「彼ら」に改めた。強い驚きは自然な現代日本語で「非常に驚いた」と訳し、原文の同根語反復による強意は脚注に保持した。
  reviewer_model: gpt-5.6-terra
