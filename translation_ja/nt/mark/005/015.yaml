revisions:
- from: 人々はイエスのもとに来て、悪霊に取りつかれていた人が、服を着て正気に戻り、座っているのを見た。「レギオン」[a]に取りつかれていた、あの人である。すると、人々は恐ろしくなった。
  to: 人々はイエスのもとに来て、悪霊に取りつかれていた人、すなわち「レギオン」に取りつかれていたあの人が、座っていて、服を着ており、正気であるのを見た[a]。すると、人々は恐れを抱いた。
  rationale: 原文の同格構造を自然な日本語の「すなわち」で保持した。「座っていて、服を着ており、正気である」は、三つの分詞による並列した状態描写を順序どおりに反映し、「正気に戻り」に含まれていた回復過程の明示を避ける。「レギオン」の曖昧な呼称性は脚注に保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:43Z'
