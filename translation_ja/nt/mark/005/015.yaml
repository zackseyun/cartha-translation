  naturalness: 現行の「『レギオン』に取りつかれていた、あの人である」は説明的な独立文としてやや不自然です。原文の同格表現を一文内の「すなわち」で自然に処理できます。また「恐ろしくなった」より「恐れを抱いた」のほうが落ち着いた標準的な叙述です。
