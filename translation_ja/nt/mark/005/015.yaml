id: MRK.5.15
reference: Mark 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: ja
  text: 人々はイエスのもとに来て、悪霊に取りつかれていた人、すなわち「レギオン」に取りつかれていたあの人が、座っていて、服を着ており、正気であるのを見た[a]。すると、人々は恐れを抱いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レギオン」はローマの「軍団」を表す語で、ここでは先に悪霊たちが名乗った呼び名を指す。普通名詞として「軍団」と訳すこともできる。
    reason: 固有の呼び名とも普通名詞とも受け取れる原語の語感と、文脈上の含意を示すため。
lexical_decisions:
- source_word: ἔρχονται
  choice: 来て
  rationale: 歴史的現在を、日本語の自然な物語叙述に合わせて過去の出来事として表した。後続する動作とのつながりも保っている。
- source_word: θεωροῦσιν
  choice: 見た
  rationale: 注意を向けて目にしたという意味を、過度に硬くせず自然に表した。歴史的現在は日本語の物語の流れに合わせた。
- source_word: δαιμονιζόμενον
  choice: 悪霊に取りつかれていた人
  rationale: 文脈上特定されている人物を指す名詞的分詞であり、超自然的な苦しみという本文の主張を弱めず、現代日本語で明瞭に表した。
- source_word: καθήμενον
  choice: 座っている
  rationale: 人々が目にした、その人の目に見える状態を素直に表した。
- source_word: ἱματισμένον
  choice: 服を着て
  rationale: 以前の裸の状態との対照を簡潔に示し、衣服を身に着けた回復後の姿を自然な日本語で表した。
- source_word: σωφρονοῦντα
  choice: 正気に戻り
  rationale: 健全に考え、自制できる状態を表す語である。文脈上は以前の状態からの回復が明らかなため、「戻り」とした。単なる医学的診断には限定していない。
- source_word: ἐσχηκότα
  choice: 取りつかれていた
  rationale: 完了分詞が示す、過去の状態によってこの人物を特定する働きを日本語の継続過去で自然に表した。現在も取りつかれているとは読ませない。
- source_word: λεγιῶνα
  choice: 「レギオン」
  rationale: 直前の文脈で悪霊たちが自ら名乗った呼び名を指すため、固有の呼称として括弧付きで表した。同時に、この語が一般名詞として「軍団」を意味することは脚注に残した。
- source_word: ἐφοβήθησαν
  choice: 恐ろしくなった
  rationale: アオリストの反応・状態への移行を自然に表し、その光景を見た結果として恐れが生じたことを示した。
theological_decisions:
- issue: 悪霊による支配の描写
  choice: 悪霊に取りつかれていた人
  alternative: 悪霊に苦しめられていた人
  rationale: 本文は単なる苦痛や病気ではなく、悪霊に支配されていた状態を描いているため、その超自然的主張を曖昧にしない表現を採った。
- issue: λεγιώνを呼び名として扱うか、普通名詞として扱うか
  choice: 「レギオン」
  alternative: 軍団／一軍団
  rationale: この箇所は5章9節の自己呼称を受けて人物を特定しているため、呼び名として示した。ただし元来の軍事用語としての意味と、多数の悪霊を示唆する語感は脚注で明示した。
- issue: ἐσχηκόταが示す時制的関係
  choice: 取りつかれていた
  alternative: 取りつかれている
  rationale: この人物はすでに解放され、服を着て正気な状態にある。完了分詞による過去の特徴づけを保ち、悪霊の支配がなお続いているかのような読みを避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着きを保った。長いギリシア語文を三文に分け、二文目の同格的説明によって「レギオンに取りつかれていた人」という再特定を保持した。
