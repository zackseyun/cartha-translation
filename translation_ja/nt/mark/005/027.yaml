  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: ja
  text: イエスのことを聞いた女は、群衆の中でイエスの後ろから近づき、その衣に触れた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣」は「上着」または「衣服」とも訳せる。ギリシア語は広く衣を指し、特に外衣を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα περὶ τοῦ Ἰησοῦ
  choice: イエスのことを聞いたこの女は
  rationale: 女性単数のアオリスト分詞を、前節の女性を明示しつつ、主動詞に先立つ出来事として自然な現代日本語で表した。περί＋属格は「～のこと」とした。
- source_word: ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν
  choice: 群衆の中を通って後ろから近づき
  rationale: 接近の動きを日本語として明瞭に表した。「後ろから」はイエスの背後から近づいたことを示すが、原文にない様態を過度に加えないよう簡潔にした。
- source_word: ἥψατο
  choice: 触れた
  rationale: この文脈での中動態アオリストは、つかみ続けたことを含意させず、単純な接触を表す「触れた」が適切。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: イエスの衣
  rationale: ἱμάτιονは衣服、とりわけ外衣を指し得る。「衣」は単数性と語義の広さを保ち、「上着」など特定の現代的衣類に限定しない。所有者は日本語で明瞭にするため「イエス」とした。
