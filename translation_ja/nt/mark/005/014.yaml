  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: ja
  text: 豚の群れの世話をしていた人たちは逃げ出し、町と周辺の農村地域に知らせた。人々は、何が起こったのかを見に来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βόσκοντες αὐτούς
  choice: 豚の群れを飼っていた者たち
  rationale: βόσκοντεςは家畜の世話や放牧を表す。日本語では「飼っていた」が自然であり、αὐτούςの指示対象が前節の豚であることを明示して、代名詞による不自然さを避けた。
- source_word: ἔφυγον
  choice: 逃げ出し
  rationale: 突然その場から逃れたという物語上の動きを、自然な日本語で表した。
- source_word: ἀπήγγειλαν
  choice: 知らせた
  rationale: 出来事を伝達したという意味を、簡潔で一般的な語で表した。目的語は文脈から補わずとも明らかである。
- source_word: εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς
  choice: 町や周辺の農村に
  rationale: εἰςは伝達の及ぶ先として「に」とし、町と対比される複数形ἀγρούςは、単なる耕作地より周辺の農村地域を指すと判断した。字義的な別訳は脚注に示した。
- source_word: ἦλθον ἰδεῖν
  choice: 人々は…見に来た
  rationale: ギリシア語の複数主語は文脈上、知らせを受けた町や農村の人々を指す。日本語では「彼ら」よりも「人々」が自然で、主体の取り違えも防げる。ἰδεῖνは目的を表すため「見に」とした。
- source_word: τί ἐστιν τὸ γεγονός
  choice: 何が起こったのか
  rationale: 完了分詞によって成立した出来事を問う表現を、自然な現代日本語で訳した。
