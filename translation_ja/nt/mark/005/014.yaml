review_pass:
  verdict: revise
  source_fidelity: 全体として出来事の順序と内容をよく伝えている。ただし、βόσκοντεςは豚を所有して「飼育していた」ことよりも、群れの世話・放牧をしていた者を指すため、「世話をしていた」のほうが広く正確である。また、後半のκαίを「そこで」とするのは、原文の単純な接続に因果・結果のニュアンスを加えうる。
  naturalness: 明瞭な現代標準日本語である。「畑々」は現代日本語の脚注として不自然なので、「畑（農地）」または「野」に改めるのがよい。
  terminology: 固有名詞・神学用語はこの節にはない。「町」と「周辺の農村地域」は、πόλιςとἀγροίの対比を自然に表す。
  issues:
  - severity: low
    issue: 「飼っていた者たち」
    rationale: βόσκοντεςは群れを世話する・放牧する者を表す。所有や恒常的飼育を含みうる「飼っていた」より、「世話をしていた人たち」が文脈に即して広い。
  - severity: low
    issue: 「そこで人々は」
    rationale: καίは基本的に単純な「そして」であり、「そこで」は出来事からの結果という関係をやや明示する。日本語では接続詞を置かず文を分ければ、原文の関係を過度に限定しない。
  - severity: low
    issue: 脚注の「直訳『畑々』」
    rationale: 「畑々」は不自然で、ἀγρούςの標準的な字義的選択肢を明瞭に示さない。「畑（農地）」とするほうが自然かつ正確である。
  revised_text: 豚の群れの世話をしていた人たちは逃げ出し、町と周辺の農村地域に知らせた。人々は、何が起こったのかを見に来た。
  revised_footnotes:
