id: MRK.5.41
reference: Mark 5:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: ja
  text: そして、子どもの手を取って、その子に言った。「タリタ、クム。」これは訳すと、「少女よ、あなたに言う。起きなさい」という意味である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: 子どもの手を取って
  rationale: κρατέωと属格の組み合わせが表す、手をしっかり取る動作を、文脈に合う自然な現代日本語で表した。「つかんで」ほど強い響きは持たせない。
- source_word: λέγει αὐτῇ
  choice: その子に言われた
  rationale: λέγειは歴史的現在だが、日本語の物語文では過去形が自然である。敬意を表すため尊敬語を用いたが、原文にない意味は加えていない。
- source_word: Ταλιθα κουμ
  choice: タリタ、クム
  rationale: ギリシア語本文が保存するアラム語の発話を音写し、続くマルコ自身の訳も残した。κουμに即して「クム」とした。
- source_word: μεθερμηνευόμενον
  choice: これは訳すと……という意味である
  rationale: アラム語表現を翻訳して説明する機能を、明瞭で自然な日本語にした。
- source_word: Τὸ κοράσιον
  choice: 少女よ
  rationale: κοράσιονは若い女の子を指す指小語である。「少女よ」は性別と呼びかけを明示しつつ、過度に幼い響きを避ける。
- source_word: σοὶ λέγω
  choice: あなたに言う
  rationale: 原文で明示された強調的な句を、省略せず簡潔に保持した。
- source_word: ἔγειρε
  choice: 起きなさい
  rationale: ἐγείρωの命令形は、眠りから起きることにも立ち上がることにも関わり得る。「起きなさい」はこの文脈で自然で、両者の響きをある程度保つ。
theological_decisions:
- issue: イエスのアラム語の保持
  choice: 「タリタ、クム」を本文に音写し、マルコによる訳を直後に置く。
  alternative: 訳語だけを記す、または伝統的な異綴りを用いる。
  rationale: 原文自体がアラム語の発話とその訳の両方を保存しているため、その物語的な質感を保持した。
- issue: ἔγειρεの意味範囲
  choice: 「起きなさい」
  alternative: 「立ちなさい」
  rationale: 死から生への回復という文脈を踏まえつつ、語が持ち得る「目を覚ます」と「立ち上がる」の重なりを一方に限定しすぎない訳とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、直接話法には簡潔で威厳のある調子を保った。マルコの歴史的現在は、日本語として不自然にならないよう過去形に整えた。固有のアラム語表現はカタカナで示した。
