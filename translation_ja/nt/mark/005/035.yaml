id: MRK.5.35
reference: Mark 5:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: ja
  text: イエスがまだ話しておられるうちに、会堂長の家から[a]人々が来て、こう言った。「あなたの娘は亡くなりました。なぜ、これ以上先生を煩わせる[b]のですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「会堂長から」。ここでは文脈上、会堂長の家、またはその家の者たちから、という意味。
    reason: 原文に明示されていない「家」を文脈に基づいて補ったことを示すため。
  - marker: b
    text: または「困らせる」「邪魔をする」。
    reason: σκύλλωがこの文脈で持つ、負担をかける、困らせるという語義の幅を示すため。
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: イエスがまだ話しておられるうちに
  rationale: 属格独立構文による同時進行と、ἔτι の「まだ」を自然な現代日本語で表した。文脈上の指示対象を明確にするため、代名詞を「イエス」とした。
- source_word: ἔρχονται
  choice: 人々が来て
  rationale: 物語中の歴史的現在を、日本語の語りとして自然な形で表した。複数の動詞形に合わせて「人々」を補った。
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: 会堂長の家から
  rationale: 直訳は「会堂長から」だが、会堂長本人はイエスと共にいるため、文脈上はその家または家の者たちのもとを指す。日本語で誤解なく伝わるよう「家」を補い、直訳は脚注に示した。
- source_word: λέγοντες ὅτι
  choice: こう言った
  rationale: 分詞による直接話法の導入を、簡潔で自然な日本語の叙述にした。
- source_word: Ἡ θυγάτηρ σου
  choice: あなたの娘
  rationale: 二人称所有表現を明示的に訳し、原文の直接的な言い方を保った。
- source_word: ἀπέθανεν
  choice: 亡くなりました
  rationale: 完了した死を告げるアオリストを、知らせを伝える場面にふさわしい、明瞭で品位ある日本語にした。
- source_word: τί ἔτι
  choice: なぜ、これ以上
  rationale: 行為をなお続ける理由を問う慣用的な表現として、ἔτι の「もはや／これ以上」の意味を明確にした。
- source_word: σκύλλεις
  choice: 煩わせる
  rationale: この文脈では、相手に負担をかけて困らせる意味。「煩わせる」は厳粛な場面に合い、「悩ませる」や「邪魔する」ほど意味を狭めない。
- source_word: τὸν διδάσκαλον
  choice: 先生
  rationale: διδάσκαλος の基本義を訳した。日本語では定冠詞に相当する形を無理に加えず、話者たちが用いた称号として自然に表した。
theological_decisions:
- issue: 「先生」が指す人物と称号の扱い
  choice: διδάσκαλον を「先生」とし、イエスの名に置き換えない。
  alternative: 「イエス」または「主」
  rationale: 原文は名前や信仰告白的な称号ではなく「教師」を意味する語を用いている。話者の視点と原文の称号を保ち、キリスト論的な含意を訳文で拡張しない。
- issue: 死の知らせの断定性
  choice: 「亡くなりました」と明確に訳す。
  alternative: 「死んだようです」など不確実性を加える。
  rationale: ἀπέθανεν は死を事実として告げており、この時点で話者たちが抱く絶望と、その後の展開との緊張をそのまま保つ。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。会堂長への知らせとして丁寧体を用いる一方、過度に古風な表現は避けた。「あなたの娘」は原文の直接性を保ち、「お嬢さん」のような話者側の敬語的解釈は加えていない。
