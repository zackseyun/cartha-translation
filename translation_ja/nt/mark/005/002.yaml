  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: ja
  text: イエスが舟から降りると、すぐに、墓場から、汚れた霊を持つ一人の男が出て来て、イエスを出迎えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: イエスが舟から降りると
  rationale: 属格独立構文のアオリスト分詞を自然な時の節として訳した。日本語では主語を「イエス」と明示し、「舟から降りる」で退出の動作を簡潔に表す。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコ特有の切迫した物語進行を、明瞭で現代的な語で保つ。
- source_word: ὑπήντησεν αὐτῷ
  choice: イエスを迎えた
  rationale: ὑπαντάωの「会いに出る、出迎える」という方向性を表す。「出会った」よりも、男がイエスの方へ来た動きを示しやすい。
- source_word: ἐκ τῶν μνημείων
  choice: 墓場から出て来て
  rationale: 複数の墓のある場所から男が来たという情景を、自然な日本語で表した。「出て来て」はἐκが示す起点とὑπαντάωの移動を明示する。
- source_word: ἄνθρωπος
  choice: 一人の男
  rationale: 文脈上、特定の男性を指すため、性別と単数性を自然に示した。
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: 汚れた霊につかれた
  rationale: 直訳的な「汚れた霊のうちにある」は現代日本語では意味が伝わりにくいため、この状態を自然に示す表現を採用した。ただし、ギリシア語の形を脚注に示し、解釈の度合いを明らかにする。
theological_decisions:
- issue: 悪霊による苦しみを表す表現
  choice: 汚れた霊につかれた
  alternative: 汚れた霊のうちにある／汚れた霊と共にいる
  rationale: 本文のἐνは字義的には「中に」を表し得るが、日本語でそのまま訳すと不明瞭になる。「つかれた」は文脈上の状態を分かりやすく伝える一方、「悪霊に完全に所有された」などの体系化された説明までは加えない。字義的な形は脚注で保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、福音書の物語にふさわしい簡潔で品位ある文体とした。「墓場」は複数の墓がある場所を自然に表し、「すぐに」によってマルコの生き生きとした展開を保った。
