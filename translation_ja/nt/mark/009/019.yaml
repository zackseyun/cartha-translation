id: MRK.9.19
reference: Mark 9:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: ja
  text: すると、イエスは彼らに答えて言われた。「ああ、信仰のない世代よ[a]。いつまでわたしはあなたがたと共にいなければならないのか。いつまであなたがたのことを我慢しなければならないのか[b]。その子をわたしのところに連れて来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼しない世代」または「不忠実な世代」とも訳せる。ギリシア語は、信じないことと忠実でないことのどちらも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「いつまであなたがたに耐えなければならないのか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: 彼らに答えて言われた
  rationale: 応答を導入する分詞とマルコ特有の歴史的現在を、日本語の自然な物語文として表した。「答えて」により応答であることを保ち、敬意を含む「言われた」を用いた。
- source_word: γενεὰ ἄπιστος
  choice: 信仰のない世代
  rationale: γενεάを「世代」、ἄπιστοςを文脈上の神への信頼の欠如を表す「信仰のない」とした。ἄπιστοςが持ち得る「不忠実な」の意味は脚注に残した。
- source_word: ἕως πότε
  choice: いつまで
  rationale: 継続期間を問う反語的表現として、自然で直接的な日本語を選んだ。
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: あなたがたと共にいなければならないのか
  rationale: πρόςがここで表す、相手との継続的な同在関係を「共にいる」で表した。問いの嘆きと切迫感を日本語で保つため「なければならないのか」とした。
- source_word: ἀνέξομαι ὑμῶν
  choice: あなたがたのことを我慢しなければならないのか
  rationale: 耐える、容赦するという動詞の力を、現代日本語で明瞭な「我慢する」によって表し、イエスの嘆きと苛立ちを弱めないようにした。より字義的な表現は脚注に示した。
- source_word: φέρετε αὐτὸν πρός με
  choice: その子をわたしのところに連れて来なさい
  rationale: 文脈上の指示対象が少年であるためαὐτόνを「その子」とし、命令形の直接性を「連れて来なさい」で保った。
theological_decisions:
- issue: ἄπιστοςが表す非信仰と不忠実の幅
  choice: 信仰のない
  alternative: 不忠実な／信頼しない
  rationale: 直前の文脈では神の力を信頼できないことへの叱責が中心だが、この語は忠実さの欠如も表し得る。本文では最も理解しやすい意味を採り、より広い含意を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの言葉には簡潔で威厳のある調子を保った。「ああ」と二つの反語的疑問によって原文の嘆きと強い叱責を再現した。
