id: MRK.9.50
reference: Mark 9:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: ja
  text: 塩は良いものです。しかし、塩が塩気を失ったなら、何によってそれに味をつけるのでしょうか。自分のうちに塩を持ち[a]、互いに平和に過ごしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分のうちに塩を持ちなさい」という比喩の意味は本文では明示されていません。清さ、知恵、契約への忠実さ、周囲を保つ働きなどを指すと理解することができます。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: 良いものです
  rationale: 塩を広く肯定的に評価する簡潔な表現であり、有用性などに意味を限定しない。
- source_word: ἅλας / ἅλα
  choice: 塩
  rationale: 前半と命令文で一貫して「塩」とし、比喩を解釈的に言い換えず保持した。
- source_word: ἄναλον γένηται
  choice: 塩気を失ったなら
  rationale: 字義的には「塩気のないものになる」。現代日本語として自然で、塩との語のつながりも明瞭に保つ。
- source_word: ἐν τίνι
  choice: 何によって
  rationale: 味つけの手段を問う表現として、原文の前置詞句を明確に反映する。
- source_word: ἀρτύσετε
  choice: 味をつけるのでしょうか
  rationale: 料理上の比喩を保ちつつ、日本語で自然な修辞疑問とした。
- source_word: ἔχετε
  choice: 持ち
  rationale: 命令の力を保ち、「自分のうちに塩を持つ」という原文の比喩をそのまま伝える。後続命令と「〜し、〜なさい」で結んだ。
- source_word: ἐν ἑαυτοῖς
  choice: 自分のうちに
  rationale: 再帰表現の内面的な響きを保持する。「自分たちの間に」として共同体的意味に限定しない。
- source_word: εἰρηνεύετε
  choice: 平和に過ごしなさい
  rationale: 継続的な状態・営みを命じる動詞を、明瞭な現代日本語で表した。
- source_word: ἐν ἀλλήλοις
  choice: 互いに
  rationale: 相互的な関係を簡潔かつ自然に示す。
theological_decisions:
- issue: 命令文における「塩」の比喩的意味
  choice: 「自分のうちに塩を持ち」と比喩を保持する
  alternative: 清さ、知恵、契約への忠実さ、または良い影響力など、特定の意味に言い換える
  rationale: 本文は塩が何を指すか明示していないため、一つの解釈に限定せず、真正な曖昧さを残した。
- issue: 最後の平和に関する命令
  choice: 「互いに平和に過ごしなさい」
  alternative: 「互いに平和でありなさい」
  rationale: εἰρηνεύετε の継続的な倫理的命令を自然な日本語で示し、教派固有の意味を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。短い格言的な調子と修辞疑問を保ち、塩の比喩は解釈せず本文に残した。
