source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: ja
  text: また、もしあなたの目があなたをつまずかせるなら、それを投げ捨てなさい。片目で神の国に入るほうが、両目のままでゲヘナ[a]に投げ込まれるより、あなたにとってよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地獄」とも訳される。ギリシア語は「ゲヘナ」。ヒンノムの谷に由来し、終末の裁きを指して用いられた語。
    reason: γέενναの歴史的背景と一般的な訳語を示し、本文の音写を補足するため。
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: つまずかせる
  rationale: 罪や離反に陥らせるという文脈上の意味を含みつつ、ギリシア語の「つまずき」の比喩を保つ自然な表現。
- source_word: ἔκβαλε
  choice: 投げ捨てなさい
  rationale: ἐκβάλλωの強い命令を保ち、「えぐり出す」など原文に明示されない動作を加えない。目的語が目なので、日本語では排除の意味が明確な「投げ捨てる」とした。
- source_word: καλόν ... ἢ
  choice: …より、…ほうが、あなたにとってよい
  rationale: 直訳的な「よい」を保ちながら、ἢによる比較構文を明瞭で自然な日本語にする。
- source_word: μονόφθαλμον
  choice: 片目で
  rationale: 「一つ目の者として」より自然で、身体的な対照を簡潔に保つ。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 語義に忠実で、日本語の聖書語彙としても明瞭な定訳。
- source_word: βληθῆναι
  choice: 投げ込まれる
  rationale: 受動態と動作の強さを保ち、場所を表すεἰςとの結びつきを自然に示す。
- source_word: γέενναν
  choice: ゲヘナ
  rationale: 一般化された「地獄」に置き換えず、ヒンノムの谷を背景とする終末的裁きの固有の用語を保持する。
theological_decisions:
- issue: 裁きの文脈におけるγέενναの訳
  choice: ゲヘナ
  alternative: 地獄
  rationale: 原文は死者の世界や刑罰一般を表す語ではなくγέενναを用いるため、その歴史的・終末論的な特定性を本文に残す。「地獄」は読者の理解を助ける説明として脚注に示す。
- issue: σκανδαλίζῃの意味範囲
  choice: つまずかせる
  alternative: 罪を犯させる
  rationale: 文脈上、罪への誘惑を含むが、原語の比喩と意味の広がりを狭めないため「つまずかせる」とする。
translation_notes:
  register: 明瞭で現代的かつ厳粛な標準日本語。命令と対比の鋭さを保ち、専門語「ゲヘナ」には簡潔な脚注を付した。
