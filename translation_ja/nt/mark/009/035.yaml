  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: ja
  text: そこでイエスは座り、十二人を呼び寄せて言われた。「だれでも第一になりたいなら、すべての人の最後の者となり、すべての人に仕える者となる。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: 座り
  rationale: 教師が腰を下ろして教える場面を、簡潔で自然な日本語にした。
- source_word: ἐφώνησεν
  choice: 呼び寄せて
  rationale: 単に声をかけるだけでなく、十二人を自分のもとへ呼ぶ文脈を表す。
- source_word: λέγει
  choice: 言われた
  rationale: 歴史的現在を日本語の自然な物語時制で訳した。直説法現在の臨場感は文脈全体で保たれるため、ここで不自然な「言われる」は避けた。
- source_word: πρῶτος
  choice: 第一
  rationale: 地位や重要性において先頭であることを示す原語の簡潔さを保った。
- source_word: ἔσχατος
  choice: 最後
  rationale: πρῶτοςとの対照を明確に保つ。
- source_word: διάκονος
  choice: 仕える者
  rationale: この文脈では役職名ではなく、他者に奉仕する者という一般的意味で用いられている。
theological_decisions:
- issue: ἔσται の解釈
  choice: 「最後となり、…仕える者となりなさい」と勧告として訳す
  alternative: 「最後となり、…仕える者となる」と結果・必然を述べる
  rationale: 未来形ἔσταιは格言的宣言にも命令的含意にも読める。文脈上、弟子たちの地位争いへの教えとして規範的力が強いため、日本語では自然な勧告形とした。ただし、原文の未来形が持つ宣言的響きも認められる。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。イエスへの敬語は日本語聖書として自然な「言われた」にとどめ、過度な尊敬表現は避けた。
