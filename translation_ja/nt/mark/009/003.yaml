source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: ja
  text: その衣服は輝いて、非常に白くなった。地上のどんな布さらし職人にも、これほど白くすることはできないほどであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱμάτια
  choice: 衣服
  rationale: 衣類一般を指す語であり、現代日本語として自然で、特定の形の服を想定しない。
- source_word: ἐγένετο
  choice: なった
  rationale: 変貌の場面で生じた状態の変化を明確に表す。
- source_word: στίλβοντα
  choice: きらきらと輝き
  rationale: 明るくきらめく視覚的な性質を表し、神学的説明を付加しない。
- source_word: λευκὰ λίαν
  choice: 真っ白
  rationale: λευκάの白さとλίανの強い程度を、簡潔で自然な現代日本語で表す。
- source_word: γναφεύς
  choice: 布さらし職人
  rationale: 布を洗浄・加工して白くする職人を指す。単なる現代の洗濯業者より原語の職能に近く、文脈上の白さとの結びつきも明瞭である。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上の
  rationale: 人間の地上的な能力との比較を簡潔に保つ。
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: これほど白くすることはできない
  rationale: 能力の否定と、οὕτωςが示す白さの程度を自然な日本語で明示する。
theological_decisions:
- issue: 変貌による目に見える効果の描写
  choice: 衣服が超人的なほど輝き白くなったという視覚的描写にとどめる。
  alternative: 「栄光に輝いた」など、栄光についての説明を訳文に加える。
  rationale: 本文は衣服の外観を描写しており、その意味を明示的な神学用語で説明してはいないため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「布さらし職人」はやや歴史的な職名だが、原語の職能と白くする行為を正確に伝える。比較構文は日本語として自然になるよう再構成した。
