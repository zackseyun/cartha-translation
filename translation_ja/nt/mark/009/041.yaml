  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: ja
  text: だれでも、あなたがたがメシアに属する者であるということで[a]、あなたがたに水一杯を飲ませてくれるなら、まことに、あなたがたに言います。その人は自分の報いを決して失うことはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたがたがメシアの者であるという名において」。ギリシア語のこの句は、「メシアの名のために」と理解することもできる。
    reason: ἐν ὀνόματι ὅτι χριστοῦ ἐστεの「名」を含む直訳的・別統語的理解を示しつつ、本文では自然な因果的理解を採用するため。
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: だれかが……なら
  rationale: 不定関係構文を自然な現代日本語の条件表現で示した。γάρは前節とのつながりを示すが、日本語では文脈上明らかなため独立した「なぜなら」を置かず、流れの中に含ませた。
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: あなたがたに一杯の水を飲ませてくれる
  rationale: ποτίζωの「飲ませる、飲み物を与える」を簡潔に表し、ποτήριον ὕδατοςは日本語として自然な「一杯の水」とした。受益表現「くれる」により、弟子たちへの小さな親切という文脈を明確にした。
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: あなたがたがメシアの者だという、その名のゆえに
  rationale: 「名」を明示するἐν ὀνόματιと、所属を表すχριστοῦ ἐστεの双方を保ちつつ、日本語として理解できる形にした。ὅτιを理由と取る自然な解釈は脚注に示した。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの厳粛な宣言句の重みを保ちながら、現代の標準的な敬体で表した。
- source_word: οὐ μὴ ἀπολέσῃ
  choice: 決して……失いません
  rationale: οὐ μήと接続法による強い否定を「決して」で明確に表した。
- source_word: τὸν μισθὸν αὐτοῦ
  choice: 自分の報い
  rationale: μισθόςはこの文脈では賃金よりも行為に対する「報い」が適切である。再帰的な所有関係を自然な日本語の「自分の」で示した。
theological_decisions:
- issue: Χριστόςを所有・所属構文でどう訳すか
  choice: メシアの者
  alternative: キリストのもの
  rationale: χριστοῦ ἐστεはイエスへの所属を示す。Χριστόςを称号として「メシア」と訳し、「者」によって所属関係を自然に表した。
- issue: ἐν ὀνόματι ὅτιの統語的関係
  choice: その名のゆえに
  alternative: メシアの者だから
  rationale: 本文ではὀνόματιを明示して原文の特徴と曖昧さを保った。一方、ὅτιを因果的に理解して「あなたがたがメシアの者だから」とする読みも十分可能なので脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語の敬体。イエスの宣言句には「まことに」を用いて dignified な調子を保った。原文の「名」を本文に残し、より自然な因果的解釈を脚注で提示した。
