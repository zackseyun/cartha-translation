id: MRK.9.27
reference: Mark 9:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: ja
  text: しかし、イエスは少年の手をつかんで起こした[a]。すると、少年は立ち上がった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「起き上がらせた」とも訳せる。このギリシア語の動詞は、眠りから起こす場合や、死者を起こす文脈でも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 「起き上がった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前に人々が少年を死んだと思ったことと、続くイエスの行動との穏やかな対照を示す。
- source_word: κρατήσας
  choice: つかんで
  rationale: 少年の手を実際にしっかり取る具体的な動作を、過度に荒々しくせず自然な現代日本語で表す。
- source_word: τῆς χειρὸς αὐτοῦ
  choice: 少年の手を
  rationale: χείρが指す身体部位を「腕」などに広げず、κρατέωとの関係を自然な日本語にした。文脈上の指示対象を明確にするため「彼」ではなく「少年」とした。
- source_word: ἤγειρεν
  choice: 起こした
  rationale: 地に伏していた少年を起き上がらせたという文脈上の意味を明確にしつつ、目覚めや死者を起こす場面にも用いられる語の響きをある程度保つ。
- source_word: ἀνέστη
  choice: 立ち上がった
  rationale: イエスに起こされた結果、少年が起立したことを、古風にならない明瞭な現代日本語で表す。
theological_decisions:
- issue: ἤγειρενとἀνέστηが持ち得る復活語彙との響き
  choice: 本文では通常の身体動作として「起こした」「立ち上がった」と訳し、語彙上の広がりは注で示す。
  alternative: 「よみがえらせた」「よみがえった」など、復活の意味を前面に出す。
  rationale: 直前に人々は少年が死んだと思ったが、本文は少年の死と復活を明言していない。そこで文脈上の通常義を優先しながら、ἐγείρωの意味の広がりを注記して、復活を暗示する可能性を排除もしなければ断定もしない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「しかし」で直前との対照を保ち、「すると」で二つの動作の結果関係を自然に示した。敬語的な動詞形は主語や態の曖昧さを招き得るため用いず、簡潔で品位ある叙述とした。
