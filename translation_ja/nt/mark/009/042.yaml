id: MRK.9.42
reference: Mark 9:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: ja
  text: 'また、わたしを信じるこの小さい者たちの一人をつまずかせる者は、ろばが回す大きなひき臼[a]を首にかけられて、海に投げ込まれるほうが、その人にとってよい。


    [a] 直訳「ろばのひき臼」。人が手で回す小型のひき臼ではなく、ろばに回させる大型のもの。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ろばのひき臼」。人が手で回す小型のひき臼ではなく、ろばに回させる大型のもの。
    reason: 語句の直訳と、古代のひき臼の種類を説明するため。
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: つまずかせる
  rationale: 罪を犯させる、信仰から離れさせるという含みを持つが、原文の比喩と意味の幅を保つため「つまずかせる」とした。
- source_word: μικρῶν τούτων
  choice: この小さい者たち
  rationale: 年少の子どもだけでなく、弱く取るに足りないと見なされる信者をも指し得るため、対象を子どもに限定しない表現とした。
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: わたしを信じる
  rationale: イエスを信仰・信頼の対象とすることを表す自然で直接的な訳。
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: その人にとってよい
  rationale: μᾶλλονの比較の力は「海に投げ込まれるほうが」によって表し、厳しい警告として自然な日本語にした。
- source_word: μύλος ὀνικός
  choice: ろばが回す大きなひき臼
  rationale: 手回しの小型臼ではなく、ろばに回させる大型のひき臼を指す。本文では意味を明示し、直訳を脚注に残した。
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: 首にかけられて
  rationale: 首の周りに石臼を置かれた状態を、明瞭で自然な受動表現にした。
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: 海に投げ込まれる
  rationale: 完了形が描く結果を含んだ鮮烈な受動表現を、現代日本語で自然に伝える。
theological_decisions:
- issue: 「この小さい者たち」が指す対象
  choice: 弱く小さいと見なされる、イエスを信じる者たちを広く含み得る訳
  alternative: 子どもだけを指す訳、または謙遜な弟子一般と明示する訳
  rationale: 「わたしを信じる」という限定は単なる年齢区分を越える可能性を示す。子どもを排除せず、同時に子どもだけにも限定しない原文の幅を保った。
- issue: σκανδαλίζωが示す害の性質
  choice: 「つまずかせる」として比喩と意味の幅を保持
  alternative: 「罪を犯させる」または「信仰を捨てさせる」と限定する訳
  rationale: 文脈上、罪や信仰からの離反を含み得るが、どちらか一方に狭めず、原文の神学的な緊張を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「小さい者たち」と「つまずかせる」によって原文の比喩と指示対象の幅を保ち、石臼についてのみ理解に必要な補足を脚注に置いた。
