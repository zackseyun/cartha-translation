  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: ja
  text: しかし、弟子たちは黙っていた。道中、だれのほうが偉いかについて、互いに言い争っていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσιώπων
  choice: 黙ったままだった
  rationale: 未完了時制が示す継続的な沈黙を、自然な現代日本語で表した。
- source_word: διελέχθησαν
  choice: 言い争っていた
  rationale: 語自体には「話し合う・論じる」の幅があるが、互いの地位を競う文脈では、対立を伴う「言い争う」が適切である。前の道中で起きたことが現在の沈黙の理由となっている関係も、日本語の文脈で明確にした。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 相互的なやり取りを簡潔で自然な日本語にした。
- source_word: ἐν τῇ ὁδῷ
  choice: 道中
  rationale: 移動中の出来事であることを、簡潔かつ明瞭に伝える。
- source_word: τίς μείζων
  choice: だれのほうが偉いか
  rationale: 比較級 μείζων の「より偉い」という形を保ち、日本語で比較の意味が自然に伝わるよう「だれのほうが」とした。
- source_word: οἱ δὲ
  choice: しかし、弟子たちは
  rationale: δέ が直前のイエスの問いに対する対照を示すため「しかし」とし、文脈上の指示対象を明確にするため「弟子たち」を補った。
- source_word: γὰρ
  choice: からである
  rationale: 彼らが沈黙した理由を示す因果関係を明確に表した。
theological_decisions:
- issue: 比較級 μείζων を比較表現のまま訳すか、最上級的に訳すか
  choice: だれのほうが偉いか
  alternative: だれが一番偉いか
  rationale: 弟子たち全体の中での順位を争う意味から最上級的な表現も可能だが、ギリシア語本文は比較級であるため、その形と含みを本文に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、語調は聖書本文にふさわしく整えた。「黙ったままだった」で継続性を表し、「だれのほうが偉いか」によって原文の比較級を保持した。
