id: MRK.9.1
reference: Mark 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: ja
  text: また、イエスは彼らに言っておられた。「よく言っておく。ここに立っている人々の中には、神の国が力をもって到来したのを見るまでは、決して死を味わわない者たちがいる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の国が力をもって到来した」が何を指すかについては、イエスの変貌、復活と高挙、ペンテコステ、エルサレムへの裁き、神の国の最終的完成などの理解がある。本文自体は、どの出来事を指すかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っておられた
  rationale: 未完了過去の継続的な側面を保ちつつ、直前の教えに続く語りとして自然な敬体ではない叙述表現にした。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: よく言っておく
  rationale: 共観福音書に特徴的な厳粛な導入句として、現代日本語で理解しやすく重みのある定型表現を採った。
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: ここに立っている人々の中には…者たちがいる
  rationale: τινες と属格句の部分集合の意味を明示し、ἑστηκότων の状態的な意味も「立っている」で保持した。
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: 決して死を味わわない
  rationale: οὐ μή の強い否定を「決して」で表し、「死を味わう」という原文の比喩を保持した。
- source_word: ἕως ἂν ἴδωσιν
  choice: 見るまでは
  rationale: 将来の時点を示す ἕως ἄν と接続法を、日本語の自然な時間表現で訳した。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 福音書で定着した訳語であり、神の支配と終末的な国の双方の含みを保てる。
- source_word: ἐληλυθυῖαν
  choice: 到来した
  rationale: 完了分詞が示す到来の完了とその結果状態を簡潔に表した。「来た」より荘重で、神の国について自然である。
- source_word: ἐν δυνάμει
  choice: 力をもって
  rationale: 現れた神的な力を示しつつ、その具体的な様態や出来事を限定しない。
theological_decisions:
- issue: 「神の国が力をもって到来した」が指す出来事
  choice: 出来事を特定せず、原文どおり「神の国が力をもって到来した」と訳す
  alternative: 変貌、復活・高挙、ペンテコステ、エルサレムへの裁き、または神の国の最終的完成を明示する
  rationale: ギリシア語本文はどの出来事かを明示していないため、主要な解釈のいずれにも翻訳上限定せず、神学的な緊張と曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい厳粛さを保った。「死を味わう」は日常的ではないが、理解可能な聖書的比喩として意図的に残した。
