  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: ja
  text: もしあなたの手があなたをつまずかせる[a]なら、それを切り落としなさい。両手を持ったままゲヘナ[b]へ、消すことのできない火の中へ行くより、片手を失って命に入るほうが、あなたにとってよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪を犯させる」とも訳せる。ギリシア語の動詞には、つまずかせる、陥らせる、罪を犯させるという意味がある。
    reason: lexical_alternative
  - marker: b
    text: ゲヘナは、神の裁きと結び付けられた地名のギリシア語形。伝統的には「地獄」と訳される。
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: つまずかせる
  rationale: 転ぶ原因となる比喩を保ちつつ、罪を犯させる、または信仰から離れさせるという文脈上の広がりを一つに限定しないため。
- source_word: ἀπόκοψον
  choice: 切り落としなさい
  rationale: 強いアオリスト命令形と、手を切断するという衝撃的で具体的な表現を弱めずに伝えるため。
- source_word: καλόν
  choice: よい
  rationale: 語義を保ちながら、ἢを伴う比較構文を「……より……ほうがよい」という自然な日本語で表した。
- source_word: κυλλόν
  choice: 片手を失って
  rationale: この形容詞は身体の一部を失って不自由になった状態を表す。直前の「手を切り落とす」とのつながりを日本語で明確かつ自然に示した。
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: 命に入る
  rationale: 終末論的な含みを持つ定型的表現を説明しすぎず、原文の「入る」という動きを保った。
- source_word: ἀπελθεῖν
  choice: 行く
  rationale: 日本語では「ゲヘナへ行く」が自然であり、方向を示す「へ」によって原語の移動のニュアンスも伝わる。
- source_word: γέενναν
  choice: ゲヘナ
  rationale: 後代の広い神学用語へ置き換えず、ユダヤ的な裁きのイメージを伴う固有の名称を保持した。
- source_word: ἄσβεστον
  choice: 消えることのない
  rationale: 火が消えない、または消されないという原語の意味を、明瞭で自然な現代日本語にした。
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: 両手がそろったまま
  rationale: 二本の手を保有している状態と片手を失った状態との対照を、日本語として自然に示した。
theological_decisions:
- issue: 裁きの表現における γέεννα の訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: 特定のユダヤ的地名・裁きのイメージを保持し、「地獄」という後代の包括的な神学概念にただちに同一化しないため。一般的な訳語は脚注に示した。
- issue: 手を切り落とすという警告の強さ
  choice: 具体的な身体表現をそのまま保持する
  alternative: 罪を避けるよう一般化して言い換える
  rationale: 原文の衝撃的な修辞は、罪と裁きの深刻さを伝える中心的要素であるため、解釈的に和らげなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令と終末的警告の厳粛さを保った。「片手を失って」は現代日本語として配慮ある表現であり、直前の切断の比喩とのつながりも明確にする。
