  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ja
  text: そこでは、彼らの虫は死なず、火は消されない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、最古級のギリシャ語写本（4世紀のシナイ写本とバチカン写本を含む）および初期のコプト語訳にはない。一方、5世紀のアレクサンドリア写本、ラテン語伝統、後代のビザンティン系多数写本にはある。48節と同一の句を、写字生が後にここへ加えた可能性が高い。
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: 彼らを食う虫
  rationale: 腐敗したものを食う虫・うじを指す。単に「虫」とするより、この比喩の恐ろしさとイザヤ書66章24節の文脈が自然に伝わり、特定の虫の種類に限定しない。
- source_word: τελευτᾷ
  choice: 死なず
  rationale: 生物である虫を主語とするため、「終わらない」より「死なない」が自然で正確。ギリシャ語現在形の継続的な描写を保つ。
- source_word: σβέννυται
  choice: 消されない
  rationale: 現在受動形を反映し、火が消えることではなく、消し止められないことを表す。「消えない」も自然だが、原文の受動態を保った。
theological_decisions:
- issue: αὐτῶν（彼らの）と虫の関係
  choice: 彼らを食う虫
  alternative: 彼らの虫
  rationale: 「彼らの虫」という原文の所有表現を、腐敗物を食う虫という比喩が現代日本語で明瞭になるよう関係表現にした。終末の刑罰の性質や期間について、本文を越えた教理的説明は加えていない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「食う」は虫の捕食について簡潔で自然であり、句の厳しいイメージを保つ。本文採用版の読みに従って訳しつつ、重要な本文異同は脚注で明示した。
