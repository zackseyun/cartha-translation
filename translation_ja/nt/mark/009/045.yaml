id: MRK.9.45
reference: Mark 9:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: ja
  text: また、もしあなたの足があなたをつまずかせるなら、その足を切り捨てなさい。両足があるままゲヘナ[a]に投げ込まれるよりも、足が不自由なまま、いのちに入るほうがよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地獄」とも訳される。ギリシア語は「ゲヘナ」で、ヒノムの谷と、そこに結びつく神の裁きのイメージを呼び起こす。
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: つまずかせる
  rationale: 罪や離反に至らせる意味を含む比喩を、解釈で狭めず日本語でも保つ。文脈上、単なる身体的転倒ではないことも読み取れる。
- source_word: ἀπόκοψον
  choice: 切り捨てなさい
  rationale: 強く具体的なアオリスト命令の響きを弱めず、身体の一部を切り離す表現として自然である。
- source_word: καλόν ἐστίν ... ἢ
  choice: …より、…ほうがよい
  rationale: ἢを伴う比較構文なので、直訳的な「よい」だけでなく比較の意味を明確に表す。
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: いのちに入る
  rationale: 終末的ないのちへの参与を表す原文の比喩を保持し、「永遠の」を補わない。
- source_word: χωλὸν
  choice: 足が不自由でも
  rationale: 歩行に支障がある状態を明確かつ現代日本語として配慮ある表現で示す。対格補語の状態は「でも」で比較構文に自然につなぐ。
- source_word: βληθῆναι
  choice: 投げ込まれる
  rationale: 受動形と、ゲヘナの中へ放り込まれる強い動きを自然な日本語で表す。
- source_word: γέενναν
  choice: ゲヘナ
  rationale: 一般化した「地獄」ではなく、ヒノムの谷と神の裁きの連想を持つ固有のギリシア語表現を保持する。
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: 両足がそろったまま
  rationale: 二本の足を保持している状態と、足が不自由な状態との対照を自然な日本語で表す。
theological_decisions:
- issue: 裁きの文脈における γέεννα の訳
  choice: ゲヘナ
  alternative: 地獄
  rationale: 最終的な裁きのイメージを伴うが、原文は一般的な死後世界の名称ではなくγέενναを用いている。その歴史的・聖書的な固有性を本文に残し、伝統的な理解は脚注で示す。
- issue: 身体切断命令の修辞的性格
  choice: 原文どおり直接的な命令として訳す
  alternative: 罪の原因を取り除きなさい、と説明的に意訳する
  rationale: 誇張的な警告と理解されうるが、本文自体は具体的な身体表現を用いているため、その緊張と強烈さを翻訳段階で解消しない。
translation_notes:
  register: 明瞭で現代的ながら、警告の厳粛さと命令の強さを保つ。「いのち」は単なる生存ではなく終末的な含意を保つため、説明的に展開しない。
