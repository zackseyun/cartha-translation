  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ καὶ τὸ πῦρ οὐ σβέννυται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: ja
  text: そこでは、彼らの虫は死なず[a]、火は消されない。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの蛆は終わることがない」。
    reason: lexical_alternative
  - marker: b
    text: この表現はイザヤ書66章24節を踏まえている。
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: そこでは
  rationale: 場所を示す関係副詞。前の文を受ける日本語として自然であり、場所の意味を明確に保つ。
- source_word: ὁ σκώληξ αὐτῶν
  choice: 彼らの蛆
  rationale: σκώληξ は虫、特に腐敗物を食う蛆を指し得る。裁きの具体的な光景を保ちつつ、αὐτῶν の所有関係も訳出した。
- source_word: οὐ τελευτᾷ
  choice: 死なず
  rationale: τελευτάω には「終わる」「死ぬ」の意味があるが、生物である蛆を主語とするため「死なず」が簡潔で自然。現在形の継続的な描写も保つ。
- source_word: τὸ πῦρ
  choice: 火
  rationale: 具体的な名詞をそのまま訳し、比喩か字義かを訳文で決めつけない。
- source_word: οὐ σβέννυται
  choice: 消されない
  rationale: 受動態を保ち、火が消し止められない状態を表す。「消えない」より原文の受動表現に近い。
theological_decisions:
- issue: 裁きの描写の性質
  choice: 蛆と火という具体的な像をそのまま残し、その意味を特定の終末論に限定しない。
  alternative: 永続的な意識ある苦痛、不可逆的な滅び、または恥辱と汚れの比喩のいずれかとして明示する。
  rationale: 本文はイザヤ書66章24節を響かせる鮮烈な裁きの像を示すが、この一節だけでは、その像をめぐる教理上の議論を一つに決定する必要はない。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。前後の文に続く従属的な一節であることを「そこでは」で示し、厳粛な裁きの描写を婉曲化せずに保った。
