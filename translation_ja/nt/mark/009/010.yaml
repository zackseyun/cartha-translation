  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: ja
  text: 彼らはその言葉[a]を自分たちの間だけにとどめ、死者の中からよみがえるとはどういうことかを話し合った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その話」「その発言」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: その言葉
  rationale: 直前にイエスが語った命令・発言を指す。日本語では「その言葉」が自然であり、λόγος の指示内容を過度に限定しない。「その話」とも訳せるため脚注に示した。
- source_word: ἐκράτησαν
  choice: とどめ
  rationale: κρατέω の「保つ、保持する」という意味を、πρὸς ἑαυτούς と合わせて、自分たちの範囲外に漏らさず保持したこととして表した。
- source_word: πρὸς ἑαυτούς
  choice: 自分たちの間に
  rationale: 弟子たちの内輪にとどめたことを明確にし、「自分たちだけの胸にしまう」といった個人的・内面的な意味への限定を避けた。
- source_word: συζητοῦντες
  choice: 互いに論じ合った
  rationale: 共同で問い、検討する動作を表す。単なる穏やかな会話とも激しい口論とも決めつけず、多少の議論を含み得る表現とした。
- source_word: τί ἐστιν
  choice: とはどういうことか
  rationale: 字義的には「何であるか」だが、ここでは弟子たちが表現の意味を問い合っているので、自然な現代日本語にした。
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: 死者の中からよみがえる
  rationale: ἐκ νεκρῶν の「死者たちの中から」という表現を保ちつつ、ἀναστῆναι の復活の意味を一般読者に明瞭な「よみがえる」で表した。
theological_decisions:
- issue: 弟子たちが論じた復活表現
  choice: 死者の中からよみがえる
  alternative: 死者の中から立ち上がる／死者の中から復活する
  rationale: 「死者の中から」という原文の言い回しを残し、弟子たちがその意味を理解できず論じていたという緊張を解消しない。「よみがえる」は復活を自然かつ明瞭に示すが、後代の教理的説明は加えない。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての品位を保つ文体。「論じ合った」は συζητοῦντες の共同的な検討を表し、争いの強さを不必要に加えない。原文の語順に機械的には従わず、日本語として自然な流れに整えた。
