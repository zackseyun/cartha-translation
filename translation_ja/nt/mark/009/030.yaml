base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: ja
  text: 一行はそこを出て、ガリラヤを通っていた。イエスは、だれにも知られたくなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 何を知られたくなかったのかは、原文では明示されていない。文脈上、イエスがそこにいること、または一行の通行や旅程を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: 一行はそこを立ち
  rationale: καίによる物語の連続、ἐκεῖθενの起点、ἐξελθόντεςの出発を、現代日本語として自然な一まとまりで表した。複数主語は文脈上イエスと弟子たちなので「一行」とした。
- source_word: παρεπορεύοντο
  choice: 通って進んでいた
  rationale: 未完了過去が表す継続中の移動を「進んでいた」で示し、単なる到着ではなく地域を通過していたことを保った。
- source_word: διὰ τῆς Γαλιλαίας
  choice: ガリラヤを通って
  rationale: 属格を伴うδιάの、地域内を通過する経路の意味を自然な日本語で表した。
- source_word: οὐκ ἤθελεν
  choice: 知られたくなかった
  rationale: θέλωの意志・願望を明瞭な現代語で表現した。後続節を日本語では受け身に組み替え、意図された非周知を自然に示した。
- source_word: ἵνα τις γνοῖ
  choice: そのことをだれにも知られたくなかった
  rationale: 「だれかが知ることを望まなかった」という防止の意図を自然な日本語にした。原文で「知る」の目的語が明示されない点は、「そのこと」という指示表現と注で保持した。
theological_decisions:
- issue: ἤθελενの省略された主語
  choice: 「イエス」と明示する
  alternative: 主語を省略して前文の「一行」に連続させる
  rationale: 単数動詞の主語は文脈上イエスである。日本語で主語を省くと、一行全体が望まなかったとの誤解を招きうるため明示した。
- issue: γνοῖの省略された目的語
  choice: 本文では「そのこと」とし、具体的内容を注で限定しない
  alternative: 「自分たちがそこにいること」または「通行経路」を本文に補う
  rationale: ギリシア語は何を知られたくなかったかを明示せず、イエスの所在・通行・旅程などが文脈上考えられる。本文で一つに確定せず、原文の余地を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「一行」によって複数の旅人を自然に示し、後半では単数主語を「イエス」と明示した。未完了過去の継続性と、γνοῖの目的語に残る曖昧さを保った。
