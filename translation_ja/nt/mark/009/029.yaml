  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: ja
  text: イエスは彼らに言われた。「このたぐいは、祈りによる以外には、どんな手段によっても出て行くことはできない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後代の写本の中には、「祈りと断食」と読むものもある。
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: このたぐい
  rationale: γένοςはここで種類・部類を指す。文脈上は汚れた霊を意味するが、ギリシア語本文に「霊」は明示されていないため、補わず簡潔さを保った。
- source_word: ἐν οὐδενὶ
  choice: 何によっても
  rationale: 手段を表す慣用的な表現であり、後続する例外条件と自然につながる現代日本語とした。
- source_word: δύναται ἐξελθεῖν
  choice: 出て行かせることはできない
  rationale: 形式上は「出て行くことができない」だが、悪霊を追い出す手段について弟子たちが尋ねた直前の文脈を踏まえ、使役的な意味が自然に伝わる表現とした。
- source_word: εἰ μὴ
  choice: …によらなければ
  rationale: 否定文の中で唯一の例外・必要条件を示すため、日本語として自然な条件表現を採用した。
- source_word: ἐν προσευχῇ
  choice: 祈りによらなければ
  rationale: ἐνはここで手段を表す。「祈りによって」を、日本語の否定条件構文に合わせて自然に表現した。
theological_decisions:
- issue: 「断食と」を本文に含めるか
  choice: 本文は「祈り」のみとする
  alternative: 「祈りと断食によらなければ」
  rationale: 指定されたSBLGNT本文はπροσευχῇ（「祈り」）だけを読む。「と断食」を加える読みは後代の写本伝承に見られるため、本文には採用せず、異読として脚注に残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「このたぐい」として原文の簡潔さと指示対象の含みを保ち、文脈に即して悪霊の退出を使役的に表現した。
