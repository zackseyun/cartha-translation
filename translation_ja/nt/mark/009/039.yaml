id: MRK.9.39
reference: Mark 9:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: ja
  text: しかし、イエスは言われた。「その人を止めてはいけません。わたしの名によって力あるわざ[a]を行い、すぐにわたしを悪く言う[b]ことのできる人はいないからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奇跡」または「力のわざ」。ギリシア語は「力、力あるわざ」（δύναμις）。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ののしる」または「中傷する」。ギリシア語は「悪く言う」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: 止めてはいけません
  rationale: μήを伴う現在命令形を、直前の文脈でその人の働きを阻止しようとしていたことに即して、自然な現代日本語の禁止表現とした。
- source_word: δύναμιν
  choice: 力あるわざ
  rationale: δύναμιςの「力」と、その力の現れとしての非凡な行為という福音書での用法をともに伝え、「奇跡」と狭く限定しない表現とした。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの名を唱え、その権威に基づいて行うという文脈に合い、日本語として明瞭な表現である。
- source_word: ταχὺ
  choice: すぐに
  rationale: 話し方の速さではなく、時間的な近さを表す副詞として訳した。
- source_word: κακολογῆσαί
  choice: 悪く言う
  rationale: 人を悪く語る、ののしるという語義を広く保ち、「中傷する」や「呪う」などに意味を限定しない。
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: 人はいないからです
  rationale: 理由を示すγάρと、「そのような人は誰もいない」というギリシア語の構造を自然な日本語で表した。
- source_word: δυνήσεται
  choice: ことのできる
  rationale: 未来形に含まれる可能・能力の意味を明示し、単なる行為の予告とはしなかった。
theological_decisions:
- issue: イエスの名によって行われる行為の性質
  choice: 「力あるわざ」と訳す。
  alternative: 「奇跡」または「力のわざ」
  rationale: 原文はδύναμιςであり、神的な力の現れとしての非凡な行為を指し得る。「奇跡」に限定せず、語の意味の幅と「力」とのつながりを保った。
- issue: その人とイエスとの関係についての含意
  choice: イエスの名によって力あるわざを行う者が、すぐにイエスを悪く言うことはできない、という範囲にとどめる。
  alternative: その人が完全な弟子である、または単なる便乗者であると示唆する。
  rationale: 本文はその人の弟子としての身分や動機を確定していないため、いずれの方向にも神学的判断を加えなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの発言には丁寧で威厳のある「です・ます」調を採用した。「その人」により男性単数のαὐτόνを文脈に即して示した。
