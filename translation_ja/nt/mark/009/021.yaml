  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: ja
  text: イエスはその父親に尋ねた。「この子にこのようなことが起こるようになってから、どれくらいになりますか。」父親は答えた。「幼い時からです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 単純に問いかける動作を表す。現代日本語として自然であり、原文にない詰問の響きを加えない。
- source_word: τὸν πατέρα αὐτοῦ
  choice: その父親に
  rationale: αὐτοῦは文脈上、苦しんでいる子を指す。「その父親」とすることで、簡潔さを保ちながら指示対象を自然に示す。
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: どれくらいになりますか
  rationale: ある状態が始まってから現在までの期間を問うギリシア語の慣用表現を、自然な現代日本語で表す。
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: この子にこういうことが起こるようになってから
  rationale: 完了形γέγονενが示す、過去に始まり現在まで続く状態を表現する。「こういうこと」は直前に描かれた症状を指すτοῦτοの指示性を保つ。
- source_word: ὁ δὲ εἶπεν
  choice: 父親は答えた
  rationale: δέはここでは会話の進行を示す。問いへの応答であることを日本語として自然に表し、強い対比は加えない。
- source_word: Ἐκ παιδιόθεν
  choice: 幼い時からです
  rationale: παιδιόθενは単なる広い意味の「子どもの頃」よりも、幼少期からという含みを持つ。ἐκとともに起点を示すため「幼い時から」とした。
theological_decisions: []
