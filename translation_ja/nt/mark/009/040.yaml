  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: ja
  text: わたしたちに反対しない人は、わたしたちの味方だからです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしたちのために」「わたしたちの側に」。ギリシャ語の表現は「わたしたちのために」または「わたしたちの側に」という意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 人は
  rationale: 関係代名詞が一般的・実質的に用いられているため、不特定の人を指す自然な現代日本語とした。
- source_word: γὰρ
  choice: だからです
  rationale: 直前の発言の理由を示す説明的な接続を、日本語では文末の「だからです」で自然に表した。
- source_word: οὐκ ἔστιν
  choice: 反対しない
  rationale: 否定された現在形の連辞を、後続する「καθ’ ἡμῶν」と合わせて簡潔に表した。
- source_word: καθ’ ἡμῶν
  choice: わたしたちに反対
  rationale: 属格を伴う κατά が示す敵対・反対の意味を明確にした。
- source_word: ὑπὲρ ἡμῶν
  choice: わたしたちの味方
  rationale: 属格を伴う ὑπέρ は「～のために」「～の側に」を表し得る。ここでは「反対」との対照と簡潔な並行性を保つため「味方」とした。
- source_word: ἐστιν
  choice: です
  rationale: 対句を完成する単純な連辞として、丁寧で明瞭な文体に合わせた。
theological_decisions:
- issue: 「わたしたちに反対しない／わたしたちの味方」が示す連帯の範囲
  choice: 原文の一人称複数をそのまま保ち、「わたしたちに反対しない人」「わたしたちの味方」とした。
  alternative: 「神に反対しない人は神の味方」「わたしたちの働きに反対しない人は味方」など、対象や活動範囲を補って明示する。
  rationale: ギリシャ語は一人称複数で述べるだけで、その範囲を明示していない。神や宣教活動への言及を補わず、文脈に残された解釈上の幅を保持した。
translation_notes:
  register: 明瞭で自然な現代標準日本語。直前の発言を説明する γάρ は文末の「だからです」で表し、簡潔な格言調と「反対／味方」の対照を保った。
