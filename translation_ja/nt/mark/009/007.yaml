  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: ja
  text: すると、雲が現れて彼らを覆い、雲の中から声がした。「これはわたしの愛する子。彼の言うことを聞きなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の言うことを聞きなさい」または「彼に耳を傾けなさい」。単に声を耳にするだけでなく、注意深く聞いて受け止めることを含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: 雲が現れて
  rationale: γίνομαιの出来事の生起を表す働きを自然な現代日本語で示す。「雲ができた」と成因を限定せず、突然そこに現れたという文脈に合う。
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: 彼らを覆い
  rationale: ἐπισκιάζωの、影を落として覆う、包むという意味を簡潔に表す。神の臨在という含意は説明として付加しない。
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: 雲の中から声がした
  rationale: ἐκの起点を「中から」で具体的に示し、φωνήを発話内容を伴う「声」とする。日本語として自然にするため「声がした」としたが、「語った」という動詞までは補わない。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: わたしの愛する子
  rationale: 定冠詞を伴うἀγαπητόςの深い愛の意味を、自然で格調を保つ表現にした。「最愛の」など、程度を過度に限定する語は避ける。
- source_word: ἀκούετε αὐτοῦ
  choice: 彼の言うことを聞きなさい
  rationale: 属格を伴うἀκούωの命令は、単なる聴覚ではなく、相手に注意を向けて聞き入れることを求める。日本語では「彼の言うことを聞く」がその応答的な力を自然に伝え、「従え」と狭く断定することも避けられる。
theological_decisions:
- issue: 神の宣言によるイエスの身分
  choice: 「これはわたしの愛する子」と、天からの直接の宣言として訳す。
  alternative: 「これはわたしの子、愛する者」
  rationale: ギリシア語はイエスを神の子として明確に宣言している。本文のキリスト論的な力を保ちつつ、本文にない教理的説明は加えない。
- issue: ἀκούετε αὐτοῦの命令の幅
  choice: 「彼の言うことを聞きなさい」
  alternative: 「彼に聞き従いなさい」
  rationale: 命令には注意深く聞いて受け止める含みがあるが、明示的に「服従する」という別の動詞が使われているわけではない。「聞きなさい」は、聴取と応答の両方を含み得る原文の幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、天上の宣言には簡潔で dignified な調子を保った。「すると」で場面の進行を示し、原文の二度のἐγένετοは、日本語で不自然な反復を避けつつ「現れて」「声がした」とそれぞれの生起を表した。
