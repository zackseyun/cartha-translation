  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: ja
  text: 群衆の中の一人がイエスに答えた。「先生、口のきけない霊を持つ息子を、あなたのところに連れて来ました。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ものを言えなくする霊が取りついている息子を」。ギリシア語は直訳すると「口のきけない霊を持つ息子を」。
    reason: ἔχονταは「持つ」という分詞であり、ἄλαλονは「霊」を直接修飾する。本文はこの構文を保ち、文脈に基づく使役的・憑依的な理解を別訳として示す。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 福音書の応答場面に一般的な動詞を、自然で簡潔な日本語にした。
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: 群衆の中の一人
  rationale: 部分を表す表現と不定の単数を保ち、原文に明示されない「男」は補わない。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして現代日本語で自然であり、教える者という語義を伝える。
- source_word: ἤνεγκα
  choice: 連れて来ました
  rationale: 人である息子を目的語とする日本語として自然にアオリストを表した。
- source_word: τὸν υἱόν μου
  choice: 息子を
  rationale: 年齢を推定する「少年」「子ども」ではなく、原文が示す親子関係を保った。
- source_word: πρὸς σέ
  choice: あなたのところに
  rationale: 移動の到達先を表す πρός を、文脈に合う自然な日本語にした。
- source_word: ἔχοντα
  choice: 取りつかれた
  rationale: 息子を修飾する分詞を、日本語で悪霊憑依の文脈が自然に伝わる連体表現とした。ただし所有を直訳する別案も脚注に示した。
- source_word: πνεῦμα ἄλαλον
  choice: ものを言えなくする霊
  rationale: ἄλαλον が霊自体を「口のきけない」と述べる可能性を残しつつ、直後の文脈で息子が話せない状態を引き起こす霊であることを自然に表した。
theological_decisions:
- issue: 悪霊払いの文脈における πνεῦμα の意味
  choice: 霊
  alternative: 悪霊／悪い霊
  rationale: 文脈上は悪霊が含意されるが、この節のギリシア語は単に「霊」としているため、本文で「悪」を補わなかった。
- issue: ἄλαλον が霊自身の性質か、息子への作用か
  choice: ものを言えなくする霊
  alternative: 口のきけない霊／ものを言えない霊
  rationale: 語形上は πνεῦμα を直接修飾するが、9:18、9:25から息子への作用が文脈上明らかである。本文は自然な日本語を優先し、より形式的な読みを脚注に残した。
translation_notes:
  register: 明快な現代標準日本語。父親からイエスへの呼びかけには、尊敬を含みつつ過度に荘重でない「先生」を用いた。「すると」で καί の物語上の接続を表した。
