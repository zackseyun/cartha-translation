  to: 群衆の中の一人がイエスに答えた。「先生、口のきけない霊を持つ息子を、あなたのところに連れて来ました。[a]」
  rationale: 本文を、ἔχοντα πνεῦμα ἄλαλονの構文に対応する「口のきけない霊を持つ息子」と改めた。これにより、霊の性質とその息子への作用との間にある原文上・文脈上の緊張を、どちらか一方に決めつけずに保つ。脚注は、自然な文脈的理解を示しつつ、本文の構文を説明するものに整理した。
