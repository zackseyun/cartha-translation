  naturalness: 「口のきけない霊を持つ息子」はやや聖書的な言い回しですが、明快な現代標準日本語として理解可能であり、原文の曖昧さと構文をよりよく保ちます。「すると」は日本語として自然ですが、καίはここでは単純な接続であるため、省いて簡潔にします。
  terminology: Διδάσκαλεの「先生」、υἱόςの「息子」、πνεῦμαの「霊」は適切です。「悪霊」を補わない方針も原文に忠実です。
