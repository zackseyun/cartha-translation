  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: ja
  text: 彼らはカファルナウムに着いた。イエスは家にいたとき、弟子たちに尋ねた。「途中で何を話し合っていたのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「途中で何を議論していたのか」または「途中で何を言い争っていたのか」とも訳せる。この動詞は、話し合い、議論、論争を指し得る。次の節によれば、話題はだれが一番偉いかということだった。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: 一行は…着いた
  rationale: 複数主語によるカファルナウムへの到着を、自然な日本語で明示した。文脈上はイエスと弟子たちの一行を指す。
- source_word: Καφαρναούμ
  choice: カファルナウム
  rationale: 現代日本語の聖書で広く用いられる地名表記を採用した。
- source_word: ἐν τῇ οἰκίᾳ γενόμενος
  choice: 家の中に入ると
  rationale: 定冠詞付きの具体的な家という場所を保ちつつ、時間的な分詞を自然な日本語にした。「自宅」とは限定しない。
- source_word: ἐπηρώτα
  choice: 尋ねた
  rationale: 未完了過去の継続的・反復的な含みはあり得るが、この場面では日本語の単純過去が最も自然であり、問いかけの行為を過不足なく表す。
- source_word: ἐν τῇ ὁδῷ
  choice: 途中で
  rationale: 旅程中を表す日本語として自然で簡潔。「道で」よりも移動の最中という意味が明瞭である。
- source_word: διελογίζεσθε
  choice: 話し合っていた
  rationale: この動詞が表し得る相談・議論・言い争いの幅を保ち、次節の内容から「言い争っていた」と先取りして断定することを避けた。
theological_decisions:
- issue: 複数形ἦλθονから単数形γενόμενος／ἐπηρώταへの主語の移行
  choice: 到着の主体を「一行」、家で尋ねる主体を「イエス」と明示する
  alternative: 「彼らは…着いた。彼は…尋ねた」と代名詞で訳す
  rationale: ギリシア語の自然な主語移行を日本語で明瞭にし、単数主語がイエスであることを文脈どおり示した。教理的な補足は加えていない。
- issue: διελογίζεσθεの対立的含意
  choice: 本文では「話し合っていた」とし、語義の幅を脚注で示す
  alternative: 本文を「言い争っていた」とする
  rationale: 次節は弟子たちの間に優劣をめぐる対立があったことを示すが、本節の動詞自体は話し合い、議論、論争のいずれも表し得るため、曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「一行」と「イエス」を補って主語を自然にし、「家」は自宅と断定しない。問いは簡潔な常体とし、原文の直接話法を維持した。
