  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: ja
  text: 「このような子どもの一人を、わたしの名のゆえに受け入れる人は、わたしを受け入れるのである。[a] また、わたしを受け入れる人は、わたしではなく、わたしを遣わされた方を受け入れるのである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け入れる」は、「迎え入れる」とも訳せる。原文では、子ども、イエス、イエスを遣わされた方について、同じ動詞が繰り返されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: ～する人は
  rationale: 不定関係節による一般条件を、現代日本語で自然な「～する人は」とした。
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: このような子どもの一人
  rationale: ἓν と複数属格の部分表現を「一人」で保ち、τοιούτων の性質・類型を示す力を「このような」で表した。「この子どもたちの一人」として指示性を強めることは避けた。
- source_word: δέξηται / δέχεται / δέχηται
  choice: 受け入れる
  rationale: δέχομαι の「迎え入れる／受け入れる」という意味を表し、子ども、イエス、遣わした方を目的語とする全ての箇所で同じ語を反復した。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: わたしの名のゆえに
  rationale: ここではイエスの名を理由・根拠として迎える意味が前面にあるため、「名によって」より明確な「名のゆえに」とした。名がその人格と権威を指す含意も保たれる。
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: わたしではなく、～を受け入れる
  rationale: οὐκ…ἀλλά の明瞭な対照を保持し、「わたしだけでなく」と説明的に言い換えず、原文の神学的緊張を残した。
- source_word: τὸν ἀποστείλαντά με
  choice: わたしを遣わされた方
  rationale: 冠詞付きアオリスト分詞を敬意ある実体詞句で訳した。受け身の「遣わされた」ではなく、尊敬表現「遣わされた」であり、神を指す「方」とした。
theological_decisions:
- issue: 「わたしではなく、わたしを遣わされた方」という終結部の対照
  choice: 原文どおり「わたしではなく」と訳し、イエスを受け入れることが遣わした方を受け入れることへ及ぶという対照を保持した。
  alternative: 「わたしだけでなく、わたしを遣わされた方をも」と補足的に訳す。
  rationale: 原文は οὐκ…ἀλλά と明言する。論理を説明して排他的に見える表現を解消せず、文脈の同一視と修辞的対照を併存させる。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、イエスの発言にふさわしい簡潔で格調ある文体を採用した。「のである」により一般的な宣言の調子を保ち、各節の反復構造を明確にした。
