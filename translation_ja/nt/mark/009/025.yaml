source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: ja
  text: イエスは、群衆が急いで集まって来るのを見ると[a]、その汚れた霊を叱りつけて、それに言われた。「口のきけない、耳の聞こえない霊よ。わたしがおまえに命じる。この人から出て行け。二度とこの人の中に入るな。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆が走り寄って来るのを見ると」。ギリシア語の動詞には、人々が急いで一か所に集まるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: しかしイエスは、…のを見ると
  rationale: アオリスト分詞の状況・時間的関係を自然な日本語の「見ると」で表し、δέの穏やかな場面転換を「しかし」で示した。
- source_word: ἐπισυντρέχει ὄχλος
  choice: 群衆が急いで集まって来る
  rationale: ἐπισυντρέχωが表す、人々が走り寄るように速やかに合流する動きを、明瞭で自然な現代日本語で表した。字義的な別訳は脚注に残した。
- source_word: ἐπετίμησεν
  choice: 叱りつけ
  rationale: 福音書で悪霊などに対するイエスの権威ある叱責を表す語であり、その強さと用法を保つ。
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: その汚れた霊
  rationale: ἀκάθαρτοςの宗教的・道徳的な汚れの含意と、福音書における悪霊追放の定型的表現を保った。文脈上既知の霊なので「その」を添えた。
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: ものを言えなくし、耳を聞こえなくする霊よ
  rationale: 形態上は「口の利けない、耳の聞こえない霊」だが、この霊自身の障害を述べるとの誤解を避け、直前までの物語で少年に生じさせる作用を呼びかけとして自然に示した。二つの特性は区別して保持した。
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: わたしがおまえに命じる
  rationale: 明示されたἐγώの強調を主格の「わたしが」で表し、ἐπιτάσσωの権威ある命令の力を保った。
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: この人から出て行け
  rationale: 悪霊追放の直接的な命令として自然であり、αὐτοῦの男性単数指示対象を明確にした。
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: 二度とこの人の中に入るな
  rationale: μηκέτιと禁止の接続法が示す、今後の再侵入を断固として禁じる意味を簡潔に表した。
theological_decisions:
- issue: 悪霊を表す用語とイエスの権威
  choice: πνεῦμα ἀκάθαρτονを「汚れた霊」とし、ἐπετίμησενとἐπιτάσσωをそれぞれ「叱りつけ」「命じる」と強い権威表現で訳す
  alternative: 「悪霊」「不浄の霊」、または「厳しく言った」のように弱める訳
  rationale: 本文は人格的に呼びかけられ、イエスの命令に服する霊を描く。病気だけを指す表現に弱めず、同時に本文を越えた悪霊論も加えない。
- issue: ἄλαλον καὶ κωφὸνが誰の状態を表すか
  choice: 「ものを言えなくし、耳を聞こえなくする霊」と、少年に及ぼす作用として訳す
  alternative: 「口の利けない、耳の聞こえない霊」と、霊自身の性質として形式的に訳す
  rationale: ギリシア語は霊を「口が利けず耳が聞こえない」と形容する形式を取るが、物語上は少年の症状を生じさせる霊への呼称である。日本語で霊自身が聞けないとの不自然な含意を避けつつ、二つの形容の意味を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発話には威厳と直接的な権威を持たせた。「おまえ」は霊への厳しい呼びかけとして選び、通常の対人会話より強い調子を示す。脚注記号[a]は該当句の直後に置いた。
