source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: ja
  text: 六日後[a]、イエスはペトロ、ヤコブ、ヨハネだけを連れて、高い山に連れて上られた。そこで彼らの目の前で、その姿が変わった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「六日たって」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らの目の前で変容した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: 六日の後
  rationale: 時間的な後続を表す原文の語順と表現を保った。「六日たって」も自然な訳として脚注に示す。
- source_word: παραλαμβάνει
  choice: 連れて
  rationale: 三人を同行させる意味を自然な日本語で表した。マルコの歴史的現在は、日本語では不自然になるため過去の物語表現にした。
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: 高い山へ上って行かれた
  rationale: 上方への移動を表す動詞と、山を目的地とする前置詞句を合わせ、自然に訳した。イエスが三人を伴って登る意味は「連れて」に含めた。
- source_word: κατ’ ἰδίαν μόνους
  choice: だけを
  rationale: 二つの表現が強調する、ほかの者を伴わず三人だけを連れたという意味を、重複感のない現代日本語で表した。
- source_word: μετεμορφώθη
  choice: その姿が変わった
  rationale: 受動形が示す変化を明瞭に表しつつ、変化の原因や性質を本文以上に規定しない。「変容した」は伝統的な別訳として脚注に残す。
- source_word: ἔμπροσθεν αὐτῶν
  choice: 彼らの目の前で
  rationale: 三人がその出来事を目撃したという位置・臨場性を自然な日本語で表した。
theological_decisions:
- issue: キリスト論的文脈における μετεμορφώθη の訳
  choice: その姿が変わった
  alternative: 変容した
  rationale: 原語が述べる可視的な変化を保ち、栄光の現れ方や変化の原因について本文にない説明を加えない。伝統的な用語「変容」は脚注で提示する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。κατ’ ἰδίαν μόνους の重なりは「三人だけ」という排他性で自然に表現した。敬語はイエスの動作に限定し、変容の叙述では原文の受動的な含みを保つため「その姿が変わった」とした。
