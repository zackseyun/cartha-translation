  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: ja
  text: すべての人は、火で塩を加えられるからである。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての人は、火によって塩で処理される」。この表現は、裁き、清め、またはささげ物を連想させる可能性がある。レビ記2章13節参照。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「また、すべてのささげ物は塩で塩を加えられる」と付け加えている。
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: すべての人
  rationale: 単数男性主格の実質名詞的用法であり、文脈では人々を指すと考えるのが最も自然。「すべてのもの」より明確で、対象の普遍性も保つ。
- source_word: γὰρ
  choice: からである
  rationale: 直前の警告を理由づける説明的な接続を明示する。
- source_word: πυρὶ
  choice: 火によって
  rationale: 与格の手段的な意味を自然な日本語で表す。「火で」も可能だが、「によって」は火が作用するという比喩を明瞭にする一方、解釈自体は限定しない。
- source_word: ἁλισθήσεται
  choice: 塩味をつけられる
  rationale: ἁλίζωの未来受動形。「塩を振られる」より語義に即し、「味つけされる」より塩との結びつきが明白。火と塩を組み合わせた原文の意外な比喩を保持する。
theological_decisions:
- issue: 「火によって塩味をつけられる」という比喩の解釈
  choice: 裁き、清め、供え物、弟子としての試練のいずれか一つに限定せず、比喩をそのまま残す。
  alternative: 「すべての人は火で裁かれる」「火によって清められる」「供え物のように聖別される」などと解釈して訳す。
  rationale: ギリシア語は簡潔で多義的であり、文脈から複数の含意が考えられる。訳文で一つの神学的解釈に決めない。
- issue: 後代の写本にある付加句
  choice: 本文には入れず、脚注で示す。
  alternative: 「また、すべての供え物は塩によって塩味をつけられる」を本文に含める。
  rationale: SBLGNT本文はこの句を採用しておらず、写本上の異読として扱うのが適切。
translation_notes:
  register: 現代標準語による、簡潔で格調を保った訳。「塩味をつけられる」は日常的に理解可能でありながら、原文の受動形と印象的な比喩を保持する。
