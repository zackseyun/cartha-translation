  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: ja
  text: しかし、弟子たちはそのことば[a]を理解しておらず、イエスに尋ねるのを恐れていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その発言」。ギリシャ語のῥῆμαは、語られたことば、発言、またはその内容を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: しかし、弟子たちは
  rationale: δέは直前のイエスの受難予告と弟子たちの無理解との対照を示すため「しかし」とした。原文の定冠詞が指す者たちは文脈上弟子たちなので、日本語では明示した。
- source_word: ἠγνόουν
  choice: 理解できず
  rationale: ἀγνοέωはここでは、直前に語られた内容を理解していなかったことを表す。未完了過去の継続的な状態は、後続の「恐れていた」と組み合わせた自然な日本語で示した。
- source_word: τὸ ῥῆμα
  choice: そのことば
  rationale: ῥῆμαは直前にイエスが語った発言ないしその内容を指す。「ことば」は発話と内容の両方を含み、原語の幅を保てる。
- source_word: ἐφοβοῦντο
  choice: 恐れていた
  rationale: φοβέομαιの未完了過去が表す持続的な恐れを、自然な現代日本語で表した。
- source_word: αὐτὸν
  choice: イエスに
  rationale: 代名詞の指示対象はイエスである。日本語では「あの方に」などより固有名を補うほうが明瞭で自然である。ἐπερωτῆσαιの相手なので助詞「に」で表した。
- source_word: ἐπερωτῆσαι
  choice: 尋ねる
  rationale: ἐπερωτάωは質問する、問い尋ねる意。「尋ねる」は、理解できない事柄についてイエスに問うという文脈に自然に合う。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「弟子たち」と「イエス」は文脈上の指示対象を明確にするため補った。「ことば」は平仮名を用い、単一の語ではなく発言内容を指すことが伝わるようにした。
