source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: ja
  text: ヨハネがイエスに言った。「先生、あなたの名によって悪霊を追い出している人を見ましたが、その人は私たちに従っていなかったので、やめさせようとしました[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「やめさせていました」。ギリシア語の未完了過去は、繰り返しまたは継続して制止していたことも、制止しようとしたことも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: ヨハネがイエスに言った
  rationale: ἔφηは物語中の通常の発話動詞として「言った」とした。αὐτῷの指示対象は文脈上イエスであり、日本語では固有名を補うほうが明瞭で自然である。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: διδάσκαλοςの呼格であり、現代日本語で自然かつ直接的な呼称「先生」とした。「師」も可能だが、一般読者にはやや文語的である。
- source_word: εἴδομέν τινα
  choice: 人を見ました
  rationale: τιναは不特定の人物を指す。日本語では「ある人」も可能だが、この構文では「人を見ました」が自然で、性別を不要に明示しない。
- source_word: ἐν τῷ ὀνόματί σου
  choice: あなたの名によって
  rationale: イエスの名を根拠または権威として行うことを表す句。「あなたの名によって」は聖書的な表現を保ちながら現代日本語でも理解できる。
- source_word: ἐκβάλλοντα δαιμόνια
  choice: 悪霊を追い出している
  rationale: ἐκβάλλωはここでは悪霊を人から退去させる行為を指す。「追い出す」は明瞭で福音書の文脈に適する。δαιμόνιαは現代日本語で一般的な「悪霊」とした。
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: やめさせようとしました
  rationale: 未完了過去ἐκωλύομενは、継続的に制止していたこと、または制止を試みたことのいずれも表しうる。本文では自然な「やめさせようとしました」を採り、別の可能性を脚注に示した。
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: その人は私たちに従っていなかったので
  rationale: ἡμῖνを明示的に「私たちに」と訳し、弟子たちの集団への追随を問題にしたヨハネの言い方を保持した。「私たちの仲間ではなかった」と意訳すると「従う」という語義が弱まる。
theological_decisions:
- issue: 最後の節における追随の対象
  choice: 「私たちに従っていなかった」と訳す
  alternative: 「あなたに従っていなかった」または「私たちの仲間ではなかった」
  rationale: ギリシア語は明確にἡμῖν（私たちに）とする。これを保持することで、ヨハネが弟子集団への帰属を基準にしているという物語上の緊張を、解釈で解消せずに残す。
- issue: ἐκωλύομενの未完了過去の含意
  choice: 試みを表す「やめさせようとしました」を本文に置く
  alternative: 継続を表す「やめさせていました」
  rationale: 未完了過去は反復・継続または未遂的な試みを表しうるため、一義的に断定しない。日本語本文では文脈に自然な試みの訳を採用し、継続的制止の可能性を脚注で保存する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら軽すぎない調子にした。「イエス」は日本語で代名詞の指示対象を明確にするために補った。ヨハネの「私たちに」という集団中心の表現は意図的に保持した。
