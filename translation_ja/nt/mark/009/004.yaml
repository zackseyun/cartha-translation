id: MRK.9.4
reference: Mark 9:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: ja
  text: すると、エリヤがモーセとともに彼らの前に現れ、二人はイエスと語り合っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: 現れ
  rationale: 受動形だが、ここでは「姿を現した」という意味で自然に用いられている。突然の顕現を明確かつ簡潔に表す。
- source_word: αὐτοῖς
  choice: 彼らの前に
  rationale: 現れを目にした者たちを示す与格。「彼らに現れ」より自然な現代日本語で、意味も保たれる。
- source_word: Ἠλίας σὺν Μωϋσεῖ
  choice: エリヤがモーセとともに
  rationale: 人物名は日本語聖書で広く定着した表記を用い、σὺν の同伴の意味と原文の語順を保った。
- source_word: ἦσαν συλλαλοῦντες
  choice: 語り合っていた
  rationale: 継続中の相互的な会話を表す迂言的未完了の意味を、自然で品位ある日本語で示す。
- source_word: τῷ Ἰησοῦ
  choice: イエスと
  rationale: συλλαλέω は相手との会話を表すため、与格を日本語では相互性を示す「と」で訳すのが自然である。
- source_word: ἦσαν
  choice: 二人は
  rationale: 複数主語がエリヤとモーセを指すことを日本語で明確にし、不自然な主語省略を避ける。
theological_decisions:
- issue: 変貌の場面におけるエリヤとモーセの現れの性質
  choice: エリヤとモーセが現れ、イエスと語り合ったという物語の叙述をそのまま訳す。
  alternative: 単なる主観的幻、または象徴的表現であると限定して訳す。
  rationale: 原文は出来事の存在論的性質を説明せず、二人が現れてイエスと会話したと叙述している。翻訳ではそれを弱めたり、逆に本文を越えた教理的説明を加えたりしない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、場面の荘厳さに合う「語り合っていた」を選んだ。「すると」で物語の進行を自然に示し、原文の二つの節を一文として保った。
