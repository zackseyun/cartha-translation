  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: ja
  text: イエスが家に入られた後、弟子たちは人目を避けてイエスに尋ねていた。「なぜ私たちは、それを[a]追い出すことができなかったのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その子を」。この代名詞を霊ではなく少年を指すと理解する場合。ギリシア語では中性単数であり、より自然には霊を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ εἰς οἶκον
  choice: イエスが家に入られると
  rationale: 属格独立構文のアオリスト分詞が示す時間的背景を、自然な日本語の「～すると」で表した。οἶκον は物語上の既知の場所として「家」とした。主語は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちは
  rationale: μαθηταί の福音書における師弟関係を、定着した現代日本語「弟子」で表した。所有関係は文脈上明らかなため重複を避けた。
- source_word: κατ’ ἰδίαν ἐπηρώτων αὐτόν
  choice: ひそかにイエスに尋ねていた
  rationale: κατ’ ἰδίαν の、ほかの人々から離れた私的な状況を「ひそかに」で表した。未完了過去 ἐπηρώτων の継続的な相を「尋ねていた」に反映した。目的語は日本語で明確になるよう「イエス」とした。
- source_word: Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν
  choice: なぜ、私たちは……ことができなかったのですか
  rationale: 疑問文中の ὅτι を理由を問う「なぜ」とし、ἠδυνήθημεν の能力・可能の意味を「できなかった」で自然に表した。明示された ἡμεῖς は「私たちは」として保持した。
- source_word: ἐκβαλεῖν αὐτό
  choice: それを追い出す
  rationale: ἐκβάλλω の悪霊追放の文脈に合う「追い出す」を採用した。中性単数代名詞 αὐτό は、直前の汚れた霊を指す可能性がより自然であるため「それ」とし、指示対象の別解は脚注に残した。
theological_decisions:
- issue: 末尾の中性単数代名詞 αὐτό の指示対象
  choice: 汚れた霊を指すものとして「それ」と訳す。
  alternative: 苦しんでいた少年を指すものとして「その子」と訳す。
  rationale: ギリシア語の代名詞は中性であり、男性の少年よりも中性で表される霊を指すほうが文法上自然である。ただし文脈上、少年を指す可能性を完全には排除せず、脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語を用いた。イエスへの言及には穏当な敬意表現「入られる」を用い、弟子たちの問いは自然な丁寧体とした。脚注記号は、実際に異読が関係する代名詞「それを」の直後に置いた。
