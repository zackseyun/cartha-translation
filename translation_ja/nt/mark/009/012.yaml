source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: ja
  text: イエスは彼らに言われた。「確かに、エリヤが先に来て、すべてを回復する。そして、人の子について、多くの苦しみを受け、さげすまれる[a]と書かれているのは、どういうことか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「軽んじられる」または「取るに足りない者と見なされる」。原語には、無価値な者として扱うという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: 彼らに言われた
  rationale: 標準的な発話表現。日本語の福音書として自然で品位ある敬語を用いた。
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: 確かに、エリヤが先に来て
  rationale: μένの肯定的な力を「確かに」で表し、分詞は主動詞に先立つ動作として自然な日本語にした。
- source_word: ἀποκαθιστάνει πάντα
  choice: すべてを回復する
  rationale: 現在形の一般的・生き生きとした言明を保ち、πάνταの広い指示範囲を限定しなかった。
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子について……と書かれているのは、どういうことか
  rationale: γέγραπταιを聖書引用の定型表現「書かれている」で表し、ἐπίを「について」とした。疑問の力を自然な現代日本語で保持した。
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書における確立した重要な称号を解釈的に言い換えず、そのまま訳した。
- source_word: πολλὰ πάθῃ
  choice: 多くの苦しみを受け
  rationale: 中性複数πολλάの複数性と苦難の広がりを、日本語として自然に表した。
- source_word: ἐξουδενηθῇ
  choice: さげすまれる
  rationale: 価値のない者と見なして軽蔑するという語義と受動態を、簡潔で明瞭な日本語で表した。
theological_decisions:
- issue: エリヤによる回復と人の子の苦難を結ぶ問いの力
  choice: 二つを並置する修辞的な問いとして保持する
  alternative: 「しかし、それならなぜ」と対比を明示したり、教理的説明へ言い換えたりする
  rationale: 原文のπῶςによる問いを保ち、回復と苦難の関係にある緊張を訳文で解消しないため。
- issue: 「人の子」の指示対象
  choice: 称号「人の子」をそのまま残す
  alternative: 「メシア」または「このわたし」などと説明的に訳す
  rationale: 文脈上イエスを指すとしても、原文の称号が持つ意味の広がりを解釈によって狭めないため。
- issue: ἵνα節の機能
  choice: 「……と書かれている」の内容として訳す
  alternative: 狭義の目的を示す「……するために」と訳す
  rationale: ここでは人の子について聖書に記された苦難と侮蔑の内容・定めを示すと理解するのが自然であり、目的表現に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、福音書の語りにふさわしい品位を保った。「それなら」は前半と問いの論理的なつながりを示すが、対立関係を過度に決めつけない。
