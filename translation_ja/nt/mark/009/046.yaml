lexical_decisions:
- source_word: ὅπου
  choice: そこでは
  rationale: 直前に述べられた場所を受ける関係副詞の意味を、自然な現代日本語で表した。
- source_word: ὁ σκώληξ αὐτῶν
  choice: 彼らのうじ
  rationale: σκώληξは腐敗物を食う虫、特にうじを指し得る。イザヤ書66章24節に由来する生々しい比喩を保ち、αὐτῶνも「彼らの」と明示した。
- source_word: οὐ τελευτᾷ
  choice: 死なず
  rationale: τελευτάωは「終わる」「死ぬ」を意味する。この文脈では、うじについて述べる自然な表現として「死なない」を採用し、継続する現在形を表した。
- source_word: τὸ πῦρ οὐ σβέννυται
  choice: 火は消えない
  rationale: σβέννυμιの受動形が表す「消されない／消えることがない」という意味を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 「うじ」と「火」の表現を比喩か字義どおりか確定するか
  choice: 原文の具体的なイメージをそのまま残し、解釈を本文で限定しない
  alternative: 終わりのない刑罰などの解釈を説明的に訳し込む
  rationale: この句はイザヤ書66章24節を踏まえた裁きの描写だが、原文自体はその比喩性や具体的様態を説明していないため、神学的な緊張と解釈の余地を保持した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語としつつ、イザヤ書を背景とする厳粛で生々しい裁きの表現を保った。「うじ」は日常的に理解でき、σκώληξの文脈上の具体性も伝える。
