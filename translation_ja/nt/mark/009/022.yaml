source:
  edition: SBLGNT
  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: ja
  text: その霊は何度も、彼を火の中にも水の中にも投げ込んで、彼を滅ぼそうとしてきました。しかし、もし何かできることがおありなら、私たちをあわれんで、助けてください。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλάκις
  choice: 何度も
  rationale: 繰り返し起きたことを示す副詞を、自然で明瞭な現代日本語で表した。
- source_word: ἔβαλεν
  choice: 投げ込んで
  rationale: 反復された過去の行為を文脈上示すアオリスト。日本語では「何度も」と組み合わせることで反復性を明確にした。主語は前節から続く「その霊」として補った。
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: 火の中にも水の中にも
  rationale: 前置詞の反復と「…にも…にも」という強調を保った。ὕδατα は複数形だが、日本語では自然な集合・物質名詞「水」で十分に表せる。
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: 滅ぼそうとしました
  rationale: ἵνα と接続法が示す目的・意図を「…ようとした」で表し、ἀπόλλυμι を「殺す」に限定せず「滅ぼす」とした。
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: しかし、もし何かおできになるなら
  rationale: τι を「何か」と明示し、父親がイエスの能力について示すためらいを和らげずに残した。敬語は嘆願の場面に自然なものとした。
- source_word: βοήθησον ἡμῖν
  choice: 私たちを…お助けください
  rationale: 即時の助力を求める命令形を、直接的で自然な丁寧表現にした。与格 ἡμῖν は日本語の「私たちを助ける」で表した。
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: 私たちをあわれんで
  rationale: 深い同情を表す分詞を、後続の命令に伴う自然な連用形で表した。「あわれむ」は威厳を保ちつつ現代日本語でも理解できる。
theological_decisions:
- issue: 父親の願いに含まれる、イエスの能力への不確かさ
  choice: 「もし何かおできになるなら」と条件をそのまま訳す
  alternative: 「もしおできになるなら」または確信を込めた願いに言い換える
  rationale: 原文の εἴ τι δύνῃ は父親のためらいを明確に表す。次節との緊張を先取りして解消しない。
- issue: 「あわれんで」と「助けて」の統語関係
  choice: 「私たちをあわれんで、お助けください」
  alternative: 「私たちにあわれみをかけてください」
  rationale: σπλαγχνισθείς の分詞と βοήθησον の命令形を区別し、深い同情に動かされて助けるという原文の流れを保った。
translation_notes:
  register: 明瞭な現代標準日本語。父親からイエスへの切迫した嘆願として丁寧語を用いたが、過度に古風な表現は避けた。「滅ぼす」「あわれむ」により聖書本文としての品位と原語の意味幅を保った。
