  - severity: low
    issue: 「もし何かおできになるなら」の語順と目的語
    rationale: 原文の「何か（を）できるなら」をより明瞭かつ自然にするため、「もし何かできることがおありなら」とする。
  revised_text: その霊は何度も、彼を火の中にも水の中にも投げ込んで、彼を滅ぼそうとしてきました。しかし、もし何かできることがおありなら、私たちをあわれんで、助けてください。
