  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: ja
  text: そして彼らはイエスにこう尋ねていた。「なぜ律法学者たちは、まずエリヤが来なければならないと言うのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どういうわけで律法学者たちは、まずエリヤが来なければならないと言うのですか。」
    reason: Ὅτιはこの疑問文で「なぜ」とも「どういうわけで」とも表せるため。
lexical_decisions:
- source_word: ἐπηρώτων
  choice: 尋ねていた
  rationale: 未完了過去の継続的な側面を表しつつ、質問するという意味を自然な現代日本語で示す。
- source_word: λέγοντες
  choice: こう
  rationale: 後に続く問いの内容を導く分詞を、日本語として不自然な「言いながら」を避け、「こう尋ねていた」と自然に表した。
- source_word: Ὅτι
  choice: なぜ
  rationale: 疑問を導くこの文脈での慣用的な働きを明確に示す。ただし「どういうわけで」という理解も可能なため脚注に残した。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 当時、聖書と律法の解釈・教授に携わった人々を、現代の一般読者に分かりやすく示す。
- source_word: Ἠλίαν
  choice: エリヤ
  rationale: 日本語聖書で定着している固有名詞の表記を用いた。
- source_word: δεῖ
  choice: 来なければならない
  rationale: 必要性を表す δεῖ の強さを保つ。神的・聖書的必然性の具体的な根拠までは本文に付加しない。
- source_word: ἐλθεῖν
  choice: 来る
  rationale: 預言的文脈でも自然で直接的な訳語である。
- source_word: πρῶτον
  choice: まず
  rationale: 時間的な先行を自然な日本語で示す。
theological_decisions:
- issue: Ὅτι が導く問いの力点
  choice: 律法学者の教えについて問う「なぜ」と訳す
  alternative: 「どういうわけで律法学者たちは……と言うのですか」
  rationale: 直接疑問として明瞭な日本語にしながら、理由を問うのか、教えが成り立つ事情を問うのかという含みを脚注で保持した。
- issue: エリヤが来ることの性質
  choice: 「まずエリヤが来なければならない」とのみ訳す
  alternative: 「エリヤが再び来なければならない」または「メシアより先にエリヤが来なければならない」
  rationale: 原文に明記されていない「再び」や比較対象を補わず、文脈上の神学的緊張と簡潔さを保った。
translation_notes:
  register: 明瞭で現代的ながら品位のある語調とした。人物は文脈上の指示対象を明らかにするため「イエス」と表し、律法学者の発言内容にはかぎ括弧を用いた。未完了過去は「尋ねていた」で反映した。
