source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: ja
  text: しかし、あなたがたに言っておく。エリヤもすでに来ている[a]。彼らは彼に、自分たちの思うままのことをした。彼について書かれているとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、エリヤはバプテスマのヨハネとして、またその働きにおいて、すでに来ていたということ。マルコ9:11–12参照。マタイ11:14、17:12–13も比較。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 弟子たちの期待に対する対照を明確に示し、現代日本語として自然である。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言っておく
  rationale: 直接的な告知の重みを保ちつつ、日本語の発話として自然にした。
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: エリヤもすでに来た
  rationale: καίを「も」、完了形ἐλήλυθενの完了と現在的意義を「すでに来た」で表した。
- source_word: ἐποίησαν αὐτῷ ὅσα ἤθελον
  choice: 人々は彼にしたい放題のことをした
  rationale: 不特定の複数主語を「人々」で補い、ὅσα ἤθελονの無制限で苛酷な含意を「したい放題のこと」で自然に表した。
- source_word: καθὼς γέγραπται ἐπ’ αὐτόν
  choice: 彼について書かれているとおり
  rationale: 聖書への言及を示す定型表現を保ち、ἐπίを文脈上自然な「について」とした。
theological_decisions:
- issue: この言葉におけるエリヤの正体
  choice: 本文では「エリヤ」のままとし、解釈的な同定を加えない。
  alternative: 本文中でバプテスマのヨハネを指すと明示する。
  rationale: 文脈上ヨハネとの結びつきは強いが、この節自体は明示的に「エリヤ」と述べるため、その同定は脚注に置き、本文の神学的緊張を保った。
- issue: ἐπ’ αὐτόνの意味
  choice: 「彼について」
  alternative: 「彼に対して」または「彼に不利なこととして」
  rationale: γράφωを伴う聖書言及の文脈では「彼について」が最も自然だが、前置詞句には別の理解の余地もわずかに残る。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの断定的で厳粛な口調を保った。「したい放題」は口語性があるが、ここではὅσα ἤθελονの苛酷さと無制限さを普通の読者に端的に伝える表現として採用した。
