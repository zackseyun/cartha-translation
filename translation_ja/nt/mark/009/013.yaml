revisions:
- from: しかし、あなたがたに言っておく。エリヤもすでに来た[a]。そして彼について書かれているとおり、人々は彼にしたい放題のことをした。
  to: しかし、あなたがたに言っておく。エリヤもすでに来ている[a]。彼らは彼に、自分たちの思うままのことをした。彼について書かれているとおりである。
  rationale: 語順を原文に近づけつつ、ἐλήλυθενの完了形を「すでに来ている」で表した。ἐποίησαν αὐτῷ ὅσα ἤθελονは、原文の非特定の複数主語と無制限な加害の含意を保って、「彼らは彼に、自分たちの思うままのことをした」とした。καθὼς γέγραπται ἐπ’ αὐτόνは「彼について書かれているとおりである」とし、書かれている内容と彼らの行為との対応を明瞭にした。
