    issue: 不特定の複数主語に「人々」を補っている。
    rationale: ἐποίησανの主語は明示されず、「彼ら」はその非特定性をより直接に保つ。「人々」でも大意は変わらないが、不要な補足である。
  - severity: medium
    issue: 「したい放題のことをした」がやや口語的で不自然である。
    rationale: ὅσα ἤθελονは「彼らが望んだことを何でも」の意味であり、「自分たちの思うままのことをした」が自然かつ十分に強い。
  - severity: low
    issue: 脚注の「バプテスマのヨハネの働きにおいて」は同定の表現として不明瞭である。
    rationale: 英語注の『in the person and ministry of John the Baptist』に対応させ、ヨハネその人とその働きの双方を示す表現にする。
