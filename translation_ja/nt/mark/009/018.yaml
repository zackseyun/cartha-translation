revisions:
- from: 霊は、どこででもこの子に取りつくと、地面に投げ倒します。すると、この子は泡を吹き、歯ぎしりをし、体がこわばります。[a] それで、あなたの弟子たちにこの霊を追い出してくださるよう頼みましたが、できませんでした。」
  to: その霊がどこでこの子を捕らえても、この子を投げ倒します。すると、この子は泡を吹き、歯ぎしりをし、体がこわばります。[a] そこで、あなたの弟子たちに、それを追い出すように言いましたが、弟子たちにはできませんでした。」
  rationale: 文脈上明らかな霊を「その霊」として示しつつ、原文の中立的な発話動詞εἶπαを「言いました」と訳した。ῥήσσειから明示されない場所の補足を除き、αὐτόは直前の霊を受ける「それ」として保持した。ξηραίνεταιの係争のあるニュアンスは、本文の文脈的訳と脚注の代替訳によって透明に示している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:01:55Z'
