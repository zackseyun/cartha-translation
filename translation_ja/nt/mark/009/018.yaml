id: MRK.9.18
reference: Mark 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: ja
  text: その霊がどこでこの子を捕らえても、この子を投げ倒します。すると、この子は泡を吹き、歯ぎしりをし、体がこわばります。[a] そこで、あなたの弟子たちに、それを追い出すように言いましたが、弟子たちにはできませんでした。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衰弱する」「やせ衰える」、または直訳的に「干からびる」とも訳せる。
    reason: ξηραίνεταιは基本的に「乾く、枯れる」を意味する。この箇所で「体がこわばる」を指すのか、衰弱・消耗を指すのかには解釈上の幅があるため。
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: どこででも……と
  rationale: 不定の場所と反復的な条件を表すため、現代日本語として自然な形にした。
- source_word: καταλάβῃ
  choice: 取りつく
  rationale: 敵対する霊が少年を捕らえて支配する文脈を自然に示し、後半の悪霊追放ともつながる。
- source_word: ῥήσσει
  choice: 地面に投げ倒します
  rationale: 身体を引き裂くという誤解を避けつつ、激しく倒す動作を明瞭に表した。
- source_word: ἀφρίζει
  choice: 泡を吹き
  rationale: 日本語では症状を自然に表す定型的な言い方であり、原文の「泡立つ」の意味を明瞭に伝える。
- source_word: τρίζει τοὺς ὀδόντας
  choice: 歯ぎしりをし
  rationale: 歯をこすり合わせる身体症状を簡潔かつ自然に表す。
- source_word: ξηραίνεται
  choice: 体がこわばります
  rationale: 症状の連続という文脈に合う理解を本文に採用したが、語の基本義である「乾く、枯れる」に由来する別解を脚注に残した。
- source_word: εἶπα
  choice: 頼みました
  rationale: ἵνα節を伴う発話を、弟子たちに追放を求めたという文脈に即して自然な日本語にした。命令したとまでは限定しない。
- source_word: ἐκβάλωσιν
  choice: 追い出して
  rationale: 霊・悪霊を人から排除する文脈で、日本語として明瞭な表現を選んだ。
- source_word: οὐκ ἴσχυσαν
  choice: できませんでした
  rationale: 力または能力が足りず実行できなかったことを、理由を過度に特定せず表す。
theological_decisions:
- issue: ἐκβάλωσινの目的語αὐτόが指すもの
  choice: 「この霊」と明示する
  alternative: 代名詞的に「それ」とする、または苦しみそのものを指すと取る
  rationale: 直前から少年を捕らえて作用する霊が話題であり、「追い出す」という動詞も悪霊追放を示す。日本語では単なる「それ」が曖昧になりすぎるため、文脈上の指示対象を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、父親がイエスに状況を訴える直接話法として丁寧語にした。症状は簡潔で生々しさを保ち、係争のあるξηραίνεταιの意味は本文と脚注で透明に示した。
