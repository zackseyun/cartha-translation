  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: ja
  text: 彼らが山を下っていたとき、イエスは弟子たちに、人の子が死者の中からよみがえる時までは[a]、自分たちが見たことを誰にも話してはならない、と命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「人の子が死者の中からよみがえる時を除いては」。この表現は文脈上、「よみがえる時までは」という意味に理解できる。
    reason: 原文のεἰ μὴ ὅτανが持つ例外表現と、その時間的な意味の両方を示すため。
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: 一行が山を下っていたとき
  rationale: 属格絶対と現在分詞が示す同時進行の動作を、自然な現代日本語で表した。「一行」はイエスと弟子たちを受ける。
- source_word: διεστείλατο αὐτοῖς
  choice: イエスは弟子たちに……命じた
  rationale: 動詞の持つ明確な指示・命令の強さを「命じた」で保った。日本語では主語と対象を補うことで指示関係を明瞭にした。
- source_word: ἵνα μηδενὶ … διηγήσωνται
  choice: 誰にも話してはならないと
  rationale: 命令内容を示すἵνα節とμηδενίの否定を、日本語の禁止表現として自然に訳した。διηγέομαιには詳しく語る含みもあるが、ここでは「話す」が簡潔で文脈に合う。
- source_word: ἃ εἶδον
  choice: 自分たちが見たこと
  rationale: 中性複数の関係代名詞を集合的な「こと」で表し、すでに見た出来事であることを保持した。
- source_word: εἰ μὴ ὅταν
  choice: ……時までは
  rationale: 字義的には「……時を除いては」だが、禁止が将来の時点まで続くという文脈上の機能を、誤解の少ない自然な日本語で示した。字義的な形は脚注に残した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着し、ダニエル書への響きも保持できる訳語を用いた。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 単に死の状態からではなく、死者たちの中から起こされるというἐκと複数形νεκρῶνの像を明示した。
- source_word: ἀναστῇ
  choice: よみがえる
  rationale: 未来のある時点で成立する出来事を表すアオリスト接続法を、従属節内の自然な非過去形で訳した。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουの称号性
  choice: 人の子
  alternative: 人間である者／人間の子
  rationale: 一般的な人間を指す表現へ平板化せず、イエスの自己呼称と旧約聖書への含意を保った。
- issue: εἰ μὴ ὅτανの時間的・例外的な力
  choice: よみがえる時までは
  alternative: よみがえる時を除いては
  rationale: 原文の形式は例外を示すが、ここでの実際の命令は復活までの沈黙を求めるものと自然に理解される。本文では明瞭な時間的制限を示し、原文の例外構文は脚注で開示して、曖昧さを消してしまわないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「よみがえる」は一般読者に通じる表記とし、「復活する」と解釈語に置き換えなかった。英語資料の脚注位置には内容との不一致があるため、原文に即して時間表現の直後に脚注[a]を置いた。
