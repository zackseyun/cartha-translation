revisions:
- from: それは、イエスが弟子たちを教え、こう語っておられたからである。「人の子は人々の手に引き渡されようとしている。人々は彼を殺す。しかし、殺された後、三日たってから[a]、彼は復活する。」
  to: それは、イエスが弟子たちを教え、弟子たちにこう語っておられたからである。「人の子は人々の手に引き渡されようとしている。人々は彼を殺す。そして、殺された後、三日たってから[a]、彼は復活する。」
  rationale: 原文にない逆接「しかし」を等位接続の「そして」に改め、殺害と復活の関係を解釈的に強調しないようにした。また、「弟子たちに」を補って、ἔλεγεν αὐτοῖς を明示した。それ以外の主要な語法・時間表現・受動態の曖昧さは原案を維持した。
