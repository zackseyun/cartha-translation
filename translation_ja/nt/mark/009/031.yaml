id: MRK.9.31
reference: Mark 9:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: ja
  text: それは、イエスが弟子たちを教え、弟子たちにこう語っておられたからである。「人の子は人々の手に引き渡されようとしている。人々は彼を殺す。そして、殺された後、三日たってから[a]、彼は復活する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「三日の後」。「三日目に」と表現される箇所もあるが、ここでギリシア語は「三日たってから」と述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: 教え……ておられた
  rationale: 未完了過去の継続的・反復的な背景動作を、自然な現代日本語で表した。
- source_word: γὰρ
  choice: それは……からである
  rationale: 直前の文脈に対する説明の機能を明示しつつ、因果関係を過度に限定しない。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 弟子たち
  rationale: 福音書における標準的で自然な訳語であり、師弟関係を保つ。所有代名詞は日本語では文脈上明らかなため省略した。
- source_word: ἔλεγεν αὐτοῖς
  choice: こう語っておられた
  rationale: 未完了過去の継続性を保ち、後続する直接話法へ自然につないだ。
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 定着した聖書用語であり、自己呼称としての含意とダニエル書との響きを解釈的に言い換えず保持する。
- source_word: παραδίδοται
  choice: 引き渡されようとしている
  rationale: 現在受動態が示す切迫・進行のニュアンスを表し、裏切り、逮捕、神の許容のいずれか一つに意味を狭めない。
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: 人々の手に
  rationale: 支配下に渡されることを表す具体的な『手に』の比喩を保ち、日本語として自然にした。
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: 人々は彼を殺す
  rationale: 複数の人間主体を文脈から補い、未来の出来事を日本語の非過去形で率直に表した。
- source_word: ἀποκτανθεὶς
  choice: 殺された後
  rationale: アオリスト受動分詞が主動詞に先行する出来事を示すことを、自然かつ明確に表した。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 三日たってから
  rationale: μετά＋対格の『三日の後』という時間的順序を保持し、『三日目に』へ調和させない。
- source_word: ἀναστήσεται
  choice: 復活する
  rationale: 未来中動態の自動詞的な『起き上がる』を、復活の文脈で明瞭な定訳により表し、受動態にはしなかった。
theological_decisions:
- issue: παραδίδοται の受動態と主体
  choice: 引き渡されようとしている
  alternative: 裏切られる／引き渡される
  rationale: ギリシア語は引き渡す主体を明示せず、人間の裏切りや逮捕と神の許容との緊張を残しているため、主体や原因を補わない。
- issue: Ὁ υἱὸς τοῦ ἀνθρώπου と ἀνθρώπων の対照
  choice: 「人の子」と「人々」
  alternative: 「人の子」と「人間」／「人間の手」
  rationale: 原文の語の反復と対照を可能な範囲で保ちつつ、現代日本語で人間の複数主体を自然に示す。性別を限定する根拠は原文にない。
- issue: 復活までの時間表現
  choice: 三日たってから
  alternative: 三日目に／三日のうちに
  rationale: この箇所の μετὰ τρεῖς ἡμέρας をそのまま訳し、他箇所の『三日目に』という表現へ暗黙に調和させない。
- issue: ἀναστήσεται の態
  choice: 復活する
  alternative: 復活させられる
  rationale: ここでは未来中動態の自動詞的表現を尊重し、他箇所に見られる神的受動の表現へ置き換えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスへの敬意は地の文の「おられた」で表し、引用内では簡潔で厳粛な予告の調子を保った。「しかし」は原文の連続する καί の最後を、日本語で死と復活の転換が明瞭になるよう文脈的に訳した。
