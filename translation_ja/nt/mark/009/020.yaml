source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: ja
  text: そこで人々は、その子をイエスのもとに連れて来た。霊はイエスを見ると、すぐにその子を激しくけいれんさせた。その子は地面に倒れ、泡を吹きながら転げ回った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: その子をイエスのもとに連れて来た
  rationale: 代名詞が連続する原文の指示対象を文脈に即して明示し、自然な日本語にした。φέρωはここでは運搬の仕方よりも、少年をイエスのところへ連れて来ることを表す。
- source_word: ἰδὼν αὐτὸν τὸ πνεῦμα
  choice: 霊はイエスを見ると
  rationale: アオリスト分詞を時間的に訳した。目的語の指示対象をイエスと明示して、日本語での曖昧な代名詞の連続を避けた。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: この節自体は単に「霊」としており、「汚れた」や「悪霊」を補わず、原文の表現を保った。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な即時性を、現代日本語で自然に伝える。
- source_word: συνεσπάραξεν αὐτόν
  choice: その子を激しくけいれんさせた
  rationale: 動詞が表す激しい発作性のけいれんを明確にし、目的語が少年であることを示した。
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: その子は地面に倒れ
  rationale: 後続動作へつながる分詞の流れを自然な連用形で表し、倒れた主体が少年であることを明示した。
- source_word: ἐκυλίετο
  choice: 転げ回った
  rationale: 未完了過去が描く継続的な回転運動を、簡潔で自然な日本語で表した。
- source_word: ἀφρίζων
  choice: 泡を吹きながら
  rationale: 同時進行の状態を自然に表現した。「口から」は文脈上想定できるが原文に明記されないため補わなかった。
theological_decisions:
- issue: τὸ πνεῦμα の同定
  choice: 本文では「霊」と訳す
  alternative: 「汚れた霊」または「悪霊」
  rationale: 広い文脈では汚れた霊であることが分かるが、この節の原文は単に τὸ πνεῦμα とするため、解釈的な語を加えなかった。
translation_notes:
  register: 明快な現代標準日本語を用い、物語として自然でありながら簡潔で dignified な調子を保った。日本語では代名詞の反復が指示対象を不明瞭にするため、「その子」「イエス」と明示した。原文にない説明的要素は加えていない。
