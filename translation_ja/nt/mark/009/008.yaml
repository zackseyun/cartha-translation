  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: ja
  text: すると突然、弟子たちが辺りを見回すと、もはや自分たちと一緒にいるイエスのほかには、だれも見えなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: すると突然
  rationale: 出来事の急な転換を表す副詞を、文脈の流れに自然な現代日本語で表した。
- source_word: περιβλεψάμενοι
  choice: 弟子たちが辺りを見回すと
  rationale: 周囲を見渡す動作を明確にし、分詞の主語が弟子たちであることを日本語で補った。
- source_word: οὐκέτι οὐδένα εἶδον
  choice: もはや…だれも見えなかった
  rationale: οὐκέτιの『もはや』とοὐδέναの全面否定を保ちつつ、日本語として自然にした。
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: 自分たちと一緒にいるイエスのほかには
  rationale: 例外を示すἀλλά、μόνονの『ただ一人』という限定、およびμεθ’ ἑαυτῶνの同行・同席関係を一まとまりとして明確に表した。
theological_decisions:
- issue: イエスだけが残ったことの限定表現
  choice: イエスのほかには、だれも見えなかった
  alternative: ただイエスだけが自分たちと一緒にいるのが見えた
  rationale: 原文の否定＋例外の構造を保ち、モーセとエリヤが見えなくなったという叙述を、解釈的な意味づけを加えずに示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。原文の語順を無理に写さず、突然の転換、見回す動作、イエスだけが彼らと共にいたという要素をすべて保持した。
