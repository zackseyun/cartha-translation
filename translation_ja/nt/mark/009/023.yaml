  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: ja
  text: イエスは彼に言われた。「『できるなら』とは？[a] 信じる者[b]には、すべてが可能である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: さらに字義的には「『できるなら』とは？」。イエスは前節の父親の言葉を繰り返し、それを問い返している。
    reason: lexical_alternative
  - marker: b
    text: 「信じる者」は、「信仰を持つ者」または「信頼する者」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: 「できるなら」と言うのか
  rationale: 中性冠詞 Τὸ は、前節で父親が口にした条件句を引用して取り上げる働きをする。日本語では、引用を明示しつつイエスの鋭い問い返しを自然に表すため、「『できるなら』と言うのか」とした。
- source_word: δύνῃ
  choice: できる
  rationale: δύναμαι の基本義「能力がある、できる」を、直接話法にふさわしい現代日本語で表した。
- source_word: πάντα
  choice: すべて
  rationale: 中性複数形が指す包括的な範囲と、原文の簡潔で強い響きを保った。
- source_word: δυνατὰ
  choice: 可能である
  rationale: この述語的用法では「可能である」の意。πάντα との語根上の響きは日本語では再現しにくいが、意味を明確に伝える表現を選んだ。
- source_word: τῷ πιστεύοντι
  choice: 信じる者には
  rationale: 現在分詞を一般化して用いた表現であり、固定的な呼称よりも「信じる者」とすることで、その分詞的な性格を保った。与格は、何者にとって可能なのかを示す「には」で表した。
- source_word: πιστεύοντι
  choice: 信じる
  rationale: πιστεύω の基本的な訳語を採用した。「信仰を持つ」「信頼する」も文脈上可能なので脚注に示した。
theological_decisions:
- issue: 「すべてが可能である」の範囲
  choice: 原文どおり、限定句を補わず絶対的に響く表現を保つ。
  alternative: 「神によって、信じる者にはすべてが可能である」または「神の力を信じる者には、すべてが可能である」と文脈上の限定を補う。
  rationale: 原文はここで「神によって」などの限定を明記していない。人間の信仰を自律的な力とする意味に狭めることも、説明を加えて意味を限定することも避け、簡潔な断言が持つ神学的緊張を残した。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの発言には簡潔で格調ある「可能である」を採用した。「言うのか」によって問い返しの鋭さを示すが、父親への侮蔑的な響きは避けた。
