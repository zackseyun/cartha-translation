  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: ja
  text: すぐに、その子[a]の父親は叫んで言った。「信じます。私の不信仰を取り除くために、助けてください[b]！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子」は、文脈上「少年」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「私の不信仰を助けてください」。「不信仰」は「信仰の欠け」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: すぐに
  rationale: 父親が間を置かず応答したことと、マルコに特徴的な切迫感を、自然な現代日本語で表す。
- source_word: κράξας
  choice: 叫んで
  rationale: 大きな声を上げる動作と、父親の切実さを簡潔に伝える。
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: その子の父親
  rationale: παιδίονの基本的な意味を保ちつつ、日本語として自然な連体表現にした。文脈上は男の子だが、語そのものを不必要に限定しない。
- source_word: ἔλεγεν
  choice: 言った
  rationale: 未完了過去の形を、日本語で直接話法を導入する最も自然な表現にした。継続や反復を文脈以上に強調しない。
- source_word: Πιστεύω
  choice: 信じます
  rationale: 直後のἀπιστίαとの語義上の対照を保ち、父親の信仰告白を率直に表す。
- source_word: βοήθει
  choice: お助けください
  rationale: 現在命令形による切実な願いを、敬意と緊迫感のある自然な祈願表現で示す。
- source_word: μου τῇ ἀπιστίᾳ
  choice: 不信仰な私を
  rationale: 直訳の「私の不信仰を助けてください」は日本語では不信仰を助長する意味にも誤解されうるため、与格が示す助けの対象を自然に表した。「信じます」と「不信仰」の逆説は維持した。
theological_decisions:
- issue: Πιστεύωとἀπιστίᾳの間にある緊張の表現
  choice: 「信じます。不信仰な私をお助けください」とし、信仰と不信仰を同時に告白する逆説を残す。
  alternative: 「信じます。足りない信仰を補ってください」
  rationale: 代案は意味を説明して緊張を和らげてしまう。本文の神学的な逆説を解消せず、そのまま読者に聞かせる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、父親の切迫した叫びにふさわしい簡潔で格調ある調子とした。「信じます」と「不信仰」の対照を明確に響かせた。
