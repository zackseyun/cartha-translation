  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: ja
  text: そしてイエスは彼らに尋ねた。「互いに何を論じ合っているのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「互いに何を言い争っているのですか」。この動詞は、文脈により議論や論争を意味することがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 直接話法を導く通常の質問を表すため、現代日本語として自然で、強すぎる含意のない「尋ねた」とした。
- source_word: αὐτούς
  choice: 彼らに
  rationale: この節の代名詞が指す複数の人々を、それ以上限定せずに保った。
- source_word: Τί
  choice: 何を
  rationale: 問いは議論の理由よりも、その内容や論題を尋ねている。
- source_word: συζητεῖτε
  choice: 論じ合っている
  rationale: この語が持つ、話し合い・議論・論争に及ぶ意味幅を保ちつつ、文脈に合う自然な表現とした。対立的な含みの可能性は脚注に示した。
- source_word: πρὸς αὑτούς
  choice: 互いに
  rationale: 写本本文の再帰・相互的な表現を、日本語で自然な相互表現にした。
- source_word: καὶ
  choice: そして
  rationale: 前の叙述との単純な接続を示し、不要な時間的意味を加えない。
