  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: ja
  text: 汚れた霊は叫び声を上げ、少年に激しいけいれんを起こさせて[a]、出て行った。少年は死んだ人のようになった[b]ので、大勢の人が、「死んだ」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「少年を激しいけいれんに陥らせて」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語本文は「彼は死んだ人のようになった」。見ていた人々には死んだように見えたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: 叫び声を上げ
  rationale: アオリスト分詞の動作を、主動詞「出て行った」に先立つ出来事として自然な日本語で表した。叫びの調子を「悲鳴」などと限定しない。
- source_word: πολλὰ σπαράξας
  choice: 少年を激しくけいれんさせて
  rationale: 悪霊追放の文脈でσπαράσσωは、文字どおり「引き裂く」よりも激しいけいれんを引き起こすことを指す。πολλάの強意を「激しく」で表し、文脈上の目的語「少年」を補った。
- source_word: ἐξῆλθεν
  choice: 出て行った
  rationale: 文脈上の主語である汚れた霊を明示し、少年から出たことを自然に表現した。
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: 死人のようになった
  rationale: ὡσεὶの比較を保ち、実際に死亡したと断定せず、死んだように見える状態になったことを表した。
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: ので、大勢の人が…と言った
  rationale: 結果を示すὥστε構文を自然な因果・結果表現にした。τοὺς πολλούςは、必ずしも過半数と断定せず「大勢の人」とした。
- source_word: ὅτι ἀπέθανεν
  choice: 「死んだ」
  rationale: 群衆の判断を直接話法で簡潔に表した。アオリストは、死が起きたと彼らが結論したことを示す日本語の「死んだ」が自然である。
theological_decisions:
- issue: 少年が実際に死んだのか、死んだように見えただけなのか
  choice: 語り手は「死人のようになった」と述べ、実際の死を断定しない。
  alternative: 少年が一時的に実際に死亡した、または実際に死んだ可能性を積極的に残す。
  rationale: 比較を表すὡσεὶと、群衆による「死んだ」という発言を区別した。これにより、見た目と群衆の判断を示しつつ、本文にない蘇生の主張を持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。主語が曖昧になりやすい日本語を避けるため「汚れた霊」「少年」を文脈から補った。「けいれん」は一般読者に読みやすいよう平仮名表記とした。
