  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: ja
  text: 彼らが弟子たちのところに来ると、大勢の群衆が弟子たちの周りにいて、律法学者たちが弟子たちと議論しているのを見た。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「議論している」は、「論じ合っている」または「言い争っている」とも訳せる。ギリシア語は討議と論争のどちらも表し得るが、ここでは対立を伴う議論と思われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: 弟子たちのところに来ると
  rationale: アオリスト分詞を主動詞に先立つ時を表す節として訳し、πρόςの人物への接近を自然な現代日本語で示した。
- source_word: εἶδον
  choice: 見えた
  rationale: 見る主体は複数の「彼ら」だが、日本語では情景全体を目的内容として「〜のが見えた」とすることで、原文の叙述順序と自然さを両立させた。
- source_word: ὄχλον πολὺν
  choice: 大勢の群衆
  rationale: πολύςが群衆の人数の多さを表すため、量的意味が明確な表現を選んだ。
- source_word: περὶ αὐτούς
  choice: 弟子たちの周りには
  rationale: περίの空間的意味を表した。代名詞の指示対象を「弟子たち」と明示し、日本語での曖昧さを避けた。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 当時のユダヤ社会で聖書と律法に通じた専門家を指す語として、現代日本語の聖書読者に分かりやすい定着した訳語を用いた。
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: 弟子たちと議論している
  rationale: συζητέωは討議から論争までを含み得る。文脈上は対立を伴う可能性が高いが、「言い争う」と断定せず、幅を保つ「議論する」とした。πρὸς αὐτούςの相手は文脈上、弟子たちと明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「彼ら」は直前の文脈にいるイエスと同行者たちを受ける原文の複数形を保持した。情景が一読で把握できるよう、二つのαὐτούςはいずれも「弟子たち」と明示した。
