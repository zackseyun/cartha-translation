  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ja
  text: ペトロはイエスに答えて言った。「ラビ、私たちがここにいるのは良いことです。三つの仮小屋[a]を造りましょう。あなたのために一つ、モーセのために一つ、エリヤのために一つ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「幕屋」「天幕」。ギリシア語は一時的な小屋や天幕を指し得るが、この節自体は祭りや聖所との関連を明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: そこで…言った
  rationale: 物語で応答を導く慣用的な分詞であり、直前に明示的な質問がないため、日本語では文脈への反応を示す「そこで」によって自然に表した。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として自然な過去形を用いた。
- source_word: Ῥαββί
  choice: ラビ
  rationale: 敬意を伴う呼びかけであり、セム語的背景と原語の称号を保つ。「先生」とすることも可能だが、ここでは音写がより透明である。
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: 私たちがここにいるのは良いことです
  rationale: 評価を表す非人称的な構文と「良い」という基本的意味を、明瞭で自然な日本語にした。
- source_word: ποιήσωμεν
  choice: 造りましょう
  rationale: 一人称複数の勧奨的な接続法を反映した。「建てましょう」よりも動詞 ποιέω の広い基本義に近い。
- source_word: σκηνάς
  choice: 仮小屋
  rationale: 一時的な小屋・幕屋・天幕を指し得る語である。「仮小屋」は一時的な構造物という基本像を明瞭に伝え、祭りや聖所との結び付きを本文で断定しない。
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: あなたのために一つ、モーセのために一つ、エリヤのために一つ
  rationale: μίαν の三度の反復と、各人に一つずつという並行構造を保った。
theological_decisions:
- issue: σκηνάς が持ち得る祭儀的・祭りの含意
  choice: 本文では比較的中立的な「仮小屋」とする
  alternative: 「幕屋」「天幕」「小屋」
  rationale: この節自体は仮庵の祭りや聖所の幕屋との関係を明示していないため、その連想を本文で確定せず、語義上可能な別訳を脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「ラビ」は歴史的・文化的背景を保つため音写し、ペトロの丁寧な呼びかけに合わせて発言を丁寧体とした。
