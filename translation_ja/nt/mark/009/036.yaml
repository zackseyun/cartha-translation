lexical_decisions:
- source_word: λαβὼν παιδίον
  choice: 一人の子どもを連れて来て
  rationale: λαβώνはここでは子どもをその場へ伴う動作を表す。「取って」では日本語として不自然なため、「連れて来て」とした。παιδίονは年少者を指すが、指小的な意味を強調せず「子ども」と訳した。
- source_word: ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν
  choice: 彼らの真ん中に立たせ
  rationale: ἔστησενはἵστημιの使役的用法で、「立つようにさせた」の意。単に「置いた」とせず、具体的な姿勢と空間的中心を保った。
- source_word: ἐναγκαλισάμενος αὐτό
  choice: その子を腕に抱き寄せて
  rationale: ἐναγκαλίζομαιは腕の中に抱く、または抱きしめることを表す。「腕に抱き寄せて」は身体的な動作を自然な日本語で示しつつ、抱擁の含みも保つ。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: イエスへの敬意を示す現代日本語の聖書文体として主体敬語を用いた。原文の単純な発話動詞の意味は付加せずに保っている。
