  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: ja
  text: そして、一人の子どもを連れて来て、彼らの真ん中に立たせ、その子を腕に抱いて[a]、彼らに言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
