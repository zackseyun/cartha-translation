  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: ja
  text: するとすぐに、群衆は皆、イエスを見ると非常に驚き[a]、駆け寄って挨拶した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「驚愕し」または「動揺し」とも訳せる。ギリシア語の動詞は、文脈により、強い驚き、驚愕、あるいは恐れを伴う動揺を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: するとすぐ
  rationale: マルコに特徴的な、出来事が直ちに展開する勢いを保ちつつ、物語のつながりを自然な現代日本語で示した。
- source_word: πᾶς ὁ ὄχλος
  choice: 群衆は皆
  rationale: 集合体としての群衆全体を指す表現であり、日本語として自然な形で包括性を保った。
- source_word: ἰδόντες αὐτόν
  choice: イエスを見ると
  rationale: アオリスト分詞を、主動作を引き起こした時を表すものとして訳した。文脈上の指示対象を明確にするため「イエス」とした。
- source_word: ἐξεθαμβήθησαν
  choice: 非常に驚き
  rationale: 強い驚き、驚愕、場合によっては動揺や恐れを含み得る語である。ここでは反応の強さを示しながら、その原因や性質を限定しすぎない表現を選んだ。
- source_word: προστρέχοντες
  choice: 駆け寄って
  rationale: 相手に向かって走り近づく動きを、簡潔で生き生きした日本語にした。
- source_word: ἠσπάζοντο αὐτόν
  choice: 挨拶した
  rationale: 歓迎や挨拶を表す一般的な語義を、解釈を加えず中立的に訳した。
theological_decisions:
- issue: イエスを見た群衆の反応（ἐξεθαμβήθησαν）の性質
  choice: 強い驚きとして訳し、その原因は明示しない
  alternative: 恐れ動揺した／モーセを思わせる輝く姿のため驚いた
  rationale: 本文は群衆がイエスを見て強い反応を示したことだけを述べ、その原因を説明していない。超自然的な輝きなどの推測を本文に持ち込まず、語が持つ感情の強さと幅は脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、マルコの物語の速い展開を保った。「イエス」を補って指示対象を明確にしつつ、群衆が驚いた理由については本文以上の説明を加えていない。
