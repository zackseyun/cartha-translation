  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: ja
  text: というのも、彼は何と答えればよいのか[a]分からなかった。彼らがひどくおびえていた[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何と言えばよいのか」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼らはひどくおびえるようになった」。原文は恐怖の状態に入ったことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 分からなかった
  rationale: οἶδαはここで知識・認識を表す。否定形を現代日本語として自然に表し、「分からなかった」とした。
- source_word: τί ἀποκριθῇ
  choice: 何と答えればよいのか
  rationale: ἀποκρίνομαιの「答える、返答する」という語義と、τίを伴う間接的な熟慮疑問の意味を明確に表した。
- source_word: ἔκφοβοι
  choice: ひどくおびえていた
  rationale: ἔκφοβοςが表す強い恐怖を、一般の読者に自然で明瞭な日本語で表した。
- source_word: ἐγένοντο
  choice: おびえていた
  rationale: 日本語では恐怖の状態として表すのが自然である。γίνομαιが状態への移行を示し得る点は脚注に残した。
- source_word: γὰρ ... γὰρ
  choice: のである……からである
  rationale: 最初のγάρが直前の発言を説明し、二つ目のγάρがその理由を示すという二重の説明関係を、日本語の自然な文末表現で保持した。
theological_decisions:
- issue: 複数形の節の主語
  choice: 彼ら
  alternative: 彼
  rationale: ἔκφοβοιとἐγένοντοはいずれも複数形であり、文脈上ペトロと同行者たちを指すのが最も自然である。単数に限定する解釈は採らなかった。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「のである」と「からである」によって、原文で繰り返されるγάρの説明関係を過度に硬くならない形で示した。
