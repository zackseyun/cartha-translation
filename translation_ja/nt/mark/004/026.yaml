  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: ja
  text: また、イエスは言われた。「神の国は、ある人が地面に種をまく場合のようなものである。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「神の国はこのようである。すなわち、ある人が地面に種をまく場合のように」。比較の描写は次の節へ続く。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了過去は継続・反復を含み得るが、ここではたとえを導入する物語上の発話として、現代日本語で自然な「言われた」とした。「また」により前後の教えとの連続も示した。
- source_word: Οὕτως
  choice: こうである
  rationale: 後に続くたとえのあり方を指し示す表現。簡潔で自然な日本語を用いた。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配とその領域の両方を含み得る定着した訳語であり、原文の意味の幅を保つ。
- source_word: ὡς ἄνθρωπος
  choice: ある人が
  rationale: ὡςが導く比較を日本語の構文全体で表した。ἄνθρωποςはこのたとえでは代表的な一人の人を指すため、性別を必要以上に限定せず「ある人」とした。
- source_word: βάλῃ τὸν σπόρον
  choice: 種をまき
  rationale: βάλλωの基本像は「投げる」だが、農耕の文脈では種を地面に散らす行為を表すため、日本語では「種をまく」が正確で自然。「まき」と連用形にして、比較が次節へ続く原文の流れを保った。
- source_word: ἐπὶ τῆς γῆς
  choice: 地面に
  rationale: ここでγῆは宇宙的な「地」ではなく、種をまく地面・土を指す。「地面に」は現代日本語で明瞭。
theological_decisions:
- issue: 神の国の比較が次節まで続く圧縮された構文
  choice: 「ある人が地面に種をまき、」と未完のまま次節へつなぐ
  alternative: 「神の国は、ある人が地面に種をまくようなものである」とこの節だけで文を完結させる
  rationale: 原文のὡς以下は27節の行動へ連続する。節単独で説明を完結させず、連用形で原文の開かれた流れと緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスへの敬意は「言われた」で表した。過度に古風な語法を避けつつ、たとえの簡潔で格調ある調子を保った。
