  text: καὶ ἔλεγεν· ⸂Ὃς ἔχει⸃ ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: ja
  text: また言われた。「聞く耳のある人[a]は、聞きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本には「聞く耳のある人は」に当たる語句がない。
    reason: SBLGNTで⸂Ὃς ἔχει⸃が角括弧に置かれており、この語句を欠く写本異読があるため。
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前の発言に続く単純な接続を表す。文脈上、発言の追加を自然な現代日本語で示し、明示されていない強い時間的順序は加えない。
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了過去形だが、ここでは発言を導入する定型的な用法であり、日本語では単純過去が自然である。反復を明示する「繰り返し言われた」は文脈以上に意味を限定する可能性がある。敬語ではなく、イエスへの叙述上の敬意を表す尊敬表現を用いた。
- source_word: Ὃς ἔχει
  choice: ある人は
  rationale: 男性単数形の関係構文は男性に限定せず、一般的な人を指す。「人」を用いてその包括的な意味を自然に表した。
- source_word: ὦτα ἀκούειν
  choice: 聞く耳
  rationale: 直訳的には「聞くための耳」だが、日本語の慣用的な「聞く耳」は、耳を持つという比喩と、単に音を聞くだけでなく受け止める含意を簡潔に伝える。
- source_word: ἀκουέτω
  choice: 聞きなさい
  rationale: 三人称単数現在命令形の勧告・命令の力を、日本語の直接的な命令表現で示す。ἀκούεινとの語根の反復も「聞く」で保った。
theological_decisions:
- issue: ことわざ的な呼びかけにおける男性単数形
  choice: 性別を限定しない「人」として訳す
  alternative: 「耳を持つ者は」と形式的に訳す
  rationale: ギリシア語の男性単数はここでは特定の男性ではなく、聞く者一般を指す。日本語の「人」は単数・複数や性別を不必要に限定せず、原文の一般的な呼びかけを保つ。
- issue: 「聞く」の意味の幅
  choice: 解釈を説明せず「聞きなさい」とする
  alternative: 「よく悟りなさい」「従いなさい」と意味を明示する
  rationale: 文脈上は注意深く受け止めることが含意されるが、原文はἀκούωを反復しており、「悟る」「従う」のどちらか一方に限定していない。その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聞く耳」は一般読者に自然な表現であり、原文の語の反復も保持する。発言者は文脈上イエスなので「言われた」とした。
