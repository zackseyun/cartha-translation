source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: ja
  text: そして、まかれると、芽を出し、園のどの草よりも大きくなって、大きな枝を伸ばす。その結果、空の鳥たち[a]がその陰に宿ることができる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天の鳥たち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「巣を作る」とも訳せる。この表現は、大木に鳥が住まいを得るという旧約聖書の描写（例えば、エゼキエル書17章23節、ダニエル書4章12節）を響かせている可能性がある。
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: まかれると
  rationale: アオリスト受動接続法とὅτανによる不定時の時節を、自然な日本語の「まかれると」で表した。受動態と、たとえ全体の「種をまく」という語彙的つながりを保っている。
- source_word: ἀναβαίνει
  choice: 芽を出し
  rationale: 農作物が地から上に現れることを指すため、直訳的な「上って」よりも、現代日本語で自然な「芽を出し」とした。
- source_word: γίνεται
  choice: 大きくなって
  rationale: 結果として新たな状態に至る発展的な意味を、日本語の文脈に合わせて「大きくなって」と表した。
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: 園のどの草よりも大きく
  rationale: λάχαναは園で栽培される草本や野菜を指す。「野菜」では現代的な食用作物に狭まりやすいため「園の草」とし、比較級を「どの…よりも大きく」で直接反映した。
- source_word: ποιεῖ κλάδους μεγάλους
  choice: 大きな枝を伸ばす
  rationale: 枝を生じさせるという意味を、植物について自然な日本語となる「枝を伸ばす」で表した。
- source_word: ὥστε δύνασθαι
  choice: そのため、…ことができる
  rationale: ὥστεと不定詞が示す結果を、「そのため」で明示し、δύνασθαιの可能の意味も「できる」で保持した。
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: その陰に
  rationale: 鳥が身を寄せる場所としてのσκιάを、簡潔で自然な「陰」とした。ὑπόと対格が示す位置・方向は、この文脈では日本語の「に」で自然に表せる。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥たち
  rationale: οὐρανόςをこの自然界の情景に即して「空」と訳した。「天の鳥」という形式的な別訳も可能なため注記した。
- source_word: κατασκηνοῦν
  choice: 巣を作る
  rationale: この動詞は宿る、住み着くという意味を持つが、主語が鳥であるため「巣を作る」が情景を自然に伝える。より広い居住の意味と旧約的響きは注で保持した。
theological_decisions:
- issue: 大きな木の枝に鳥が宿るという旧約聖書的イメージ
  choice: 本文では鳥が陰に巣を作る情景をそのまま訳し、象徴的意味を明示しない。
  alternative: 「宿る」または「住み着く」とより形式的に訳し、エゼキエル書17章23節やダニエル書4章12節との語像上の響きを前面に残す。
  rationale: この表現は諸国や生き物が大木に保護を得る旧約聖書の描写を想起させる可能性があるが、ギリシア語本文はその意味を解説していない。したがって本文に特定の象徴解釈を持ち込まず、可能な背景を注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、たとえとしての簡潔さと品位を保った。「園の草」はλάχαναの範囲を「野菜」に狭めず、からし種が園で育つ草本であるという対比を伝える。「巣を作る」は鳥の情景として自然だが、原語の広い意味と聖書間の響きは脚注に残した。
