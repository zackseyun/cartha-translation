  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: ja
  text: 土はひとりでに実を結ぶ。まず芽が出て、次に穂が出て、やがて穂の中に穀粒が十分に実る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: ひとりでに
  rationale: 土が目に見える人の働きによらず作物を生じさせることを、機械的な響きを避けつつ自然な現代日本語で表す。
- source_word: ἡ γῆ
  choice: 土
  rationale: 農耕の文脈における耕地の土を指すため、広義の「地」より具体的で自然である。
- source_word: καρποφορεῖ
  choice: 実を結ぶ
  rationale: 作物や実を生じさせる農耕の比喩を保ち、聖書的な響きもある自然な表現である。
- source_word: πρῶτον χόρτον
  choice: 初めに芽
  rationale: χόρτοςは穀物が最初に見せる緑の成長段階を指す。「茎」では発育段階をやや先取りするため、現代日本語で分かりやすい「芽」とした。
- source_word: εἶτα στάχυν
  choice: 次に穂
  rationale: στάχυςは穀物の穂を意味し、日本語では「穂」が簡潔で明瞭である。
- source_word: πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: そして穂の中に実った穀粒ができる
  rationale: 語順どおりの「満ちた穀粒」は不自然なため、穂の中で粒が十分に形成された状態を「実った穀粒」で表した。「熟した」として収穫時の成熟まで限定することは避けた。
theological_decisions: []
translation_notes:
  register: 簡潔な成長の順序と農耕の情景を保ち、普通の読者に明瞭な現代標準日本語とした。原文の三段階を「芽、穂、穂の中の穀粒」として示している。
