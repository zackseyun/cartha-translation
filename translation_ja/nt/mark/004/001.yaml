  to: イエスは再び、海のほとりで教え始められた。すると、非常に大きな群衆がイエスのもとに集まって来た[a]。そのため、イエスは舟に乗り、海上に腰を下ろされた[b]。群衆は皆、海のほとりの陸地にいた。
