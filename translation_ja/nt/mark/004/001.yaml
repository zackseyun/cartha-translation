  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: ja
  text: イエスは再び、海のほとりで教え始められた。すると、非常に大きな群衆がイエスのもとに集まって来た[a]。そのため、イエスは舟に乗り、海上に腰を下ろされた[b]。群衆は皆、海のほとりの陸地にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「集まって来る」。マルコは、過去の出来事を生き生きと語るために現在形をしばしば用いる。
    reason: lexical_alternative
  - marker: b
    text: すなわち、イエスは舟の中で水上におられ、群衆は陸地にいた。
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: イエスが教える活動を繰り返されたことを、簡潔で自然な現代日本語で示す。
- source_word: ἤρξατο διδάσκειν
  choice: 教え始められた
  rationale: 開始を表す構文を保ちつつ、イエスを主語とする文脈にふさわしい自然で丁寧な叙述とした。
- source_word: παρὰ τὴν θάλασσαν
  choice: 湖のほとりで
  rationale: θάλασσαを直訳すれば「海」だが、ここではガリラヤ湖を指すため、日本語読者に誤解のない地理的な呼称を採用した。παράの沿岸・水辺の位置関係は「ほとり」で表した。
- source_word: συνάγεται
  choice: 集まって来た
  rationale: マルコに特徴的な歴史的現在を、日本語で不自然にならない生き生きとした動きとして表現した。時制上の別訳可能性は脚注に示した。
- source_word: ὄχλος πλεῖστος
  choice: 非常に大勢の群衆
  rationale: πλεῖστοςの強意を「非常に大勢」で保ち、自然な日本語とした。
- source_word: πρὸς αὐτόν
  choice: イエスのもとに
  rationale: 移動の方向を表すπρόςを「もとに」で示し、代名詞の指示対象を日本語で明確にした。
- source_word: ὥστε
  choice: そのため
  rationale: 群衆の多さが後続の行動を招いたという結果関係を自然に示す。
- source_word: εἰς πλοῖον ἐμβάντα
  choice: 舟に乗り
  rationale: 分詞による従属的な動作を連用形で表し、主動詞「腰を下ろされた」との関係を保った。
- source_word: καθῆσθαι
  choice: 腰を下ろされた
  rationale: 教えるため舟内に座ったことを、現代日本語で自然かつ品位ある表現にした。
- source_word: ἐν τῇ θαλάσσῃ
  choice: 湖上で
  rationale: 舟に乗って水上にいるという意味を簡潔に表す。文字どおり水中にいるとの誤解を避け、説明を脚注に補った。
- source_word: πᾶς ὁ ὄχλος
  choice: 群衆は皆
  rationale: 集合全体を指す意味を自然な日本語で保持した。
- source_word: ἐπὶ τῆς γῆς
  choice: 陸地に
  rationale: イエスが湖上の舟にいることとの対照を明確に保った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語調とした。ギリシャ語の歴史的現在は本文では自然な過去表現とし、現在形の可能性を脚注に残した。「湖上」は日本語として自然だが、舟の中にいたことが曖昧にならないよう脚注を付した。
