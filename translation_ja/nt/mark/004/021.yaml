source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: ja
  text: また、イエスは彼らに言っておられた。「ランプが来るのは、計量用の容器[a]の下や寝台の下に置かれるためだろうか。ランプ台の上に置かれるためではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「計量用の容器」：原語のモディオスは、古代の容量単位、またはその量を量り入れる容器を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἔλεγεν αὐτοῖς
  choice: また、イエスは彼らに言っておられた
  rationale: 未完了過去の継続的・反復的な語りの側面を「言っておられた」で示した。日本語では主語を補わないと不自然になりやすいため、文脈上の話者である「イエス」を明示した。Καί は談話を続ける「また」とした。
- source_word: Μήτι
  choice: …ためだろうか
  rationale: 否定の答えを予期する修辞疑問として自然な日本語にし、続く「…ためではないか」との対照を保った。
- source_word: ἔρχεται ὁ λύχνος
  choice: ともしびが来るのは
  rationale: 「ともしびが来る」という擬人化された能動表現を保った。冠詞付き名詞は格言的な総称なので、日本語では単に「ともしび」とした。
- source_word: λύχνος
  choice: ともしび
  rationale: 抽象的な光ではなく携帯できる油皿・油ランプを指す。聖書的な格調を保ちつつ一般にも理解される語を選んだ。
- source_word: μόδιον
  choice: 升
  rationale: 穀物などを量る容器を指すため、日本語で簡潔に対応する「升」とした。ただし古代の特定の容量単位との完全な同一視を避けるため注を付けた。
- source_word: κλίνην
  choice: 寝台
  rationale: 寝床または横になる長椅子を意味し得るが、家庭内の具体的な像として「寝台」が明確で格調にも合う。
- source_word: λυχνίαν
  choice: 燭台
  rationale: ともしびを載せる専用の台を指すため「燭台」とした。
- source_word: ἵνα ... τεθῇ
  choice: …に置かれるため
  rationale: ἵνα の目的の意味と、τίθημι の受動態を簡潔な現代日本語で保持した。
theological_decisions:
- issue: 「ともしびが来る」という擬人化を保つか、自然化して「ともしびを持って来る」とするか
  choice: 「ともしびが来るのは」として能動的な擬人化を保つ
  alternative: 「ともしびは持って来られるのか」
  rationale: 原文の格言的で鮮明な表現を尊重し、解釈によって受動表現へ置き換えないため。
- issue: ὁ λύχνος の定冠詞を個別の特定物として訳すか、格言的総称として訳すか
  choice: 冠詞を訳出せず「ともしび」とする
  alternative: 「そのともしび」
  rationale: この発言は一般的な原則を述べる格言であり、日本語では無標の名詞が自然に総称を表すため。
- issue: 二つの修辞疑問が示す目的の対比
  choice: 「…ためだろうか。…ためではないか」として疑問形を保持する
  alternative: 「…ためではなく、…ためである」と平叙文にする
  rationale: イエスの問いかけの力と、聞き手に答えを促す原文の修辞性を保持するため。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「ともしび」「寝台」「燭台」によって簡潔で品位ある聖書本文の調子を保った。原文の擬人化と二重の修辞疑問は、過度に説明的にせずそのまま生かした。
