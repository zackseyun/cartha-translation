  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: ja
  text: 群衆を後にして、彼らは舟におられたイエスを、そのままお連れした[a]。ほかの舟もイエスと一緒だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らは、舟におられたイエスをお連れした」とも訳せる。原文は、イエスがすでに舟におられたことを際立たせるとも、特に準備をせず、そのままお連れしたことを示すとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες τὸν ὄχλον
  choice: 群衆を後にして
  rationale: 群衆のもとを離れて次の行動に移ったことを、正式に解散させたと限定せず、自然な現代日本語で表した。
- source_word: παραλαμβάνουσιν αὐτόν
  choice: 彼らは…イエスを…お連れした
  rationale: παραλαμβάνωの「自分たちと一緒に連れて行く」という意味を表す。歴史的現在は、日本語の物語として自然な過去形にした。
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: 舟におられたイエスをそのまま
  rationale: イエスがすでに舟にいたことと、「そのまま」連れて行ったことの双方を簡潔に示した。句の係り方や、準備を加えずに連れて行ったという含みは一義的に決めず、脚注で保った。
- source_word: ἄλλα πλοῖα
  choice: ほかの舟
  rationale: 原文に「小さい」に当たる形容語はないため補わず、πλοῖαを文脈に合う「舟」とした。
- source_word: ἦν μετ’ αὐτοῦ
  choice: イエスについて来ていた
  rationale: 舟について「イエスと一緒にいた」とするより自然であり、ほかの舟がイエスの舟に同行していたという控えめな叙述を表す。
