  naturalness: 「何とも思われないのですか」は日本語として可能だが、この文脈では μέλει σοι の「気にかける」の意味がやや間接的になる。「気にかけてくださらないのですか」は現代標準語として自然で、弟子たちの切迫した非難も明瞭である。
  terminology: Διδάσκαλε を「先生」とすること、αὐτός の強調を「イエスご自身」で示すことは適切である。「船尾」も正確である。脚注は προσκεφάλαιον の語義の幅を適切に示している。
