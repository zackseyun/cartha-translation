source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: ja
  text: イエスご自身は船尾で、枕[a]をして眠っておられた。弟子たちはイエスを起こして言った。「先生、私たちが死にそうなのを、気にかけてくださらないのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「クッション」とも訳せる。ギリシャ語は、頭を支える枕やクッションを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: イエスご自身は…おられた
  rationale: 明示された代名詞 αὐτός の強調・対照の働きを「ご自身」で保ち、文脈上の指示対象を日本語で明確にするため「イエス」とした。
- source_word: ἐν τῇ πρύμνῃ
  choice: 船尾で
  rationale: πρύμνα は舟の後部、すなわち船尾を具体的に指す。「船尾」は簡潔で正確な現代日本語である。
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: 枕をして
  rationale: προσκεφάλαιον は頭を支える枕またはクッションを指す。「枕をして」は、身体全体が枕の上にあったかのような誤解を避けつつ、自然な日本語で表す。語の幅は脚注に残した。
- source_word: καθεύδων
  choice: 眠っておられた
  rationale: 分詞が表す継続中の状態を自然に表現した。イエスへの通常の丁寧さを保ちながら、過度に荘重な敬語は避けた。
- source_word: ἐγείρουσιν
  choice: 起こして
  rationale: 歴史的現在を、日本語の物語として自然な過去の流れで表した。
- source_word: λέγουσιν
  choice: 言った
  rationale: 歴史的現在を日本語の物語文に合う形で訳した。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: διδάσκαλος の基本義である教える者への呼びかけを、現代日本語で自然な「先生」とした。
- source_word: οὐ μέλει σοι
  choice: 何とも思われないのですか
  rationale: 相手が気にかけていないと責める鋭い問いを自然な日本語で保った。「ご心配ではないのですか」よりも非難の力が明確である。
- source_word: ἀπολλύμεθα
  choice: 私たちが死にかけている
  rationale: この場面での差し迫った死と破滅を、進行中の危機として明瞭に表した。「滅びつつある」より日常的で切迫感のある表現である。
theological_decisions:
- issue: 弟子たちの問いの非難と切迫感
  choice: 「私たちが死にかけているのに、何とも思われないのですか」
  alternative: 「私たちが死にそうなのを心配してくださらないのですか」
  rationale: 原文は単なる助けの要請ではなく、イエスが気にかけていないかのように問い詰める鋭さを持つ。その緊張を和らげず、同時にイエスの動機や弟子たちの信仰について解釈を付け加えないようにした。
translation_notes:
  register: 明快な現代標準語を用い、物語として自然な流れと場面の切迫感を保った。「ところが」で前景との対照を示し、「イエスご自身」で原文の強調を表した。会話は丁寧さを保ちながらも、弟子たちの切迫した非難が弱まらない表現とした。
