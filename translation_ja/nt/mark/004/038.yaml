  to: イエスご自身は船尾で、枕[a]をして眠っておられた。弟子たちはイエスを起こして言った。「先生、私たちが死にそうなのを、気にかけてくださらないのですか。」
  rationale: 原文にない逆接を取り除き、弟子たちの問いを μέλει の基本的意味である「気にかける」として明確にした。イエスへの敬意を示す文体、原文の強調、船尾と枕の具体性、危機の切迫感は維持した。
