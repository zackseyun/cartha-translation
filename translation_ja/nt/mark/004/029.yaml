  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: ja
  text: しかし、作物が刈り入れ時になると[a]、その人はすぐに鎌を入れる。刈り入れの時が来たからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「作物が引き渡すと」または「作物が自らを差し出すと」。ギリシア語では作物を主語にした珍しい能動表現で、「実ると」「熟すと」という意味に理解できる。
    reason: παραδοῖの珍しい語法と、可能な字義的・文脈的訳を示すため。
lexical_decisions:
- source_word: ὅταν δὲ
  choice: しかし、…になると
  rationale: ὅτανの不定時を自然な条件・時の表現「…になると」で表し、δέは軽い転換を示す「しかし」とした。
- source_word: παραδοῖ ὁ καρπός
  choice: 作物が刈り入れ時になる
  rationale: παραδοῖは通常「引き渡す」を意味するが、ここでは作物を主語とする珍しい能動表現で、収穫できる状態になることを指す。本文では自然で明確な日本語とし、直訳的な含みは脚注に残した。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 行為の即時性を、現代日本語で明瞭に表す。
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: 鎌を入れる
  rationale: 字義的には「鎌を送り出す」だが、刈り入れを始めることを表す農耕上の表現であり、日本語では「鎌を入れる」が自然で、比喩も保てる。
- source_word: ὅτι παρέστηκεν ὁ θερισμός
  choice: 刈り入れの時が来たからである
  rationale: ὅτιの理由を明示し、παρέστηκενの完了形が示す「到来して今そこにある」状態を「来た」で表した。θερισμόςは文脈上、収穫行為そのものだけでなくその時の到来を指すため、「刈り入れの時」とした。
theological_decisions:
- issue: 神の国のたとえにおける作物の成熟と刈り入れ
  choice: 農耕の比喩をそのまま保ち、作物が収穫可能になることだけを示す
  alternative: 刈り入れを終末の裁き、宣教、完成など特定の神学的出来事として明示する
  rationale: 本文は比喩の指示対象をこの節で限定していないため、特定の教理的解釈を訳文に持ち込まず、意図された神学的緊張を保つ。
translation_notes:
  register: 明快な現代標準語を用いながら、たとえにふさわしい簡潔で落ち着いた文体とした。「その人」を補って、鎌を入れる主体が直前の農夫であることを日本語で明瞭にした。
