source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: ja
  text: ほかの種は良い土に落ち、実をつけ、伸び育ち、三十倍、六十倍、百倍の実を結んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一つは三十、一つは六十、一つは百」。播いた種に対する収穫の倍率を表す。
    reason: idiom_clarification
lexical_decisions:
- source_word: ἄλλα
  choice: ほかの種
  rationale: 中性複数形の形容詞が名詞的に用いられており、文脈上は先に述べられた種を指す。現代日本語で意味が明確になるよう「種」を補った。
- source_word: γῆν τὴν καλήν
  choice: 良い土
  rationale: 種まきの文脈なので、地理的な「土地」ではなく、作物が育つ土壌を表す「土」とした。
- source_word: ἐδίδου καρπὸν
  choice: 実を結んだ
  rationale: 未完了過去が示す継続的な結実を、日本語として自然な農耕表現で示した。後続の分詞と動詞を含む一連の生長過程として訳した。
- source_word: ἀναβαίνοντα
  choice: 芽を出して
  rationale: 植物が地上へ伸び出ることを表す農耕文脈の分詞であり、自然で具体的な日本語とした。
- source_word: αὐξανόμενα
  choice: 成長し
  rationale: ἀναβαίνονταと区別し、芽生えた後に大きく育っていく継続的な増大を表した。
- source_word: ἔφερεν
  choice: もたらした
  rationale: 収穫量を表す数詞を目的内容として受けるため、「三十倍…の実をもたらした」とし、結実の結果を自然に表した。
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: 三十倍、六十倍、百倍
  rationale: 播いた種に対する収穫の倍率を示す慣用表現として明瞭に訳した。原文の反復は日本語では読点による列挙で自然に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。植物の生長順序が分かるよう「芽を出して成長し、実を結んだ」とした。脚注標識は節末に置き、倍率表現の原文上の形を説明した。
