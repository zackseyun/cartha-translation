  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: ja
  text: 種をまいている間に、その一部は道端に落ち[a]、鳥が来てそれを食べ尽くした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「道のそばに落ち」。ギリシア語は、道に沿った所、または道の脇を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: 種をまいていると
  rationale: ἐγένετο ἐν＋冠詞付き不定詞の時間的な物語表現を、動作の最中に起きたことを示す自然な日本語で表した。「すると」の流れも含みつつ、冗長な「そのことが起こった」を避ける。
- source_word: ὃ μὲν
  choice: ある種は
  rationale: 中性関係代名詞と μέν の配分的用法を、まかれた種の一部を指す「ある種は」で自然に表した。
- source_word: ἔπεσεν
  choice: 落ち
  rationale: πίπτω の基本的な意味を文脈に即して直接訳した。
- source_word: παρὰ τὴν ὁδόν
  choice: 道端に
  rationale: παρά＋対格が示す道の傍らという位置を、畑の小道にも合う自然な日本語で表した。境界上か脇かを過度に限定しないため注を付した。
- source_word: τὰ πετεινὰ
  choice: 鳥
  rationale: 本文には「空の」などの修飾語がないため、簡潔に「鳥」とした。日本語では総称として冠詞相当の表現を要しない。
- source_word: κατέφαγεν
  choice: 食べ尽くした
  rationale: κατεσθίω の強意的なニュアンスを、「食べた」よりも強い「食べ尽くした」で表した。
- source_word: αὐτό
  choice: （「食べ尽くした」の目的語として省略）
  rationale: 直前の「ある種」を指す。日本語では目的語を繰り返さなくても明瞭であり、「それを」を省くほうが自然である。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭で、朗読にも適する簡潔かつ品位ある語調とした。「道端」は農地を通る小道の傍らを自然に想起させる。
