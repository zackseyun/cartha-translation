  source_fidelity: 「道端に」「鳥が来て食べ尽くした」は、παρὰ τὴν ὁδόν、τὰ πετεινὰ καὶ κατέφαγεν αὐτόをよく伝えている。「種をまいていると」も時間的構文の趣旨をおおむね反映する。ただし「ある種」は日本語では通常「ある種類の種」という意味に取られやすく、ὃ μὲνが指す「まかれた種の一部」という配分的意味を曖昧にしてしまう。
  naturalness: 全体は簡潔で自然であるが、「ある種」は現代標準日本語で数量・部分を表すには不自然または誤解を招きやすい。「種の一部は」とすることで、朗読にも自然で意味が明瞭になる。
  terminology: 「種」「道端」「鳥」は平明で適切である。「食べ尽くした」はκατέφαγενの強い語感を無理なく表す。
