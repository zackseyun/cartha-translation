source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: ja
  text: そして、彼らは自分の内に根がなく、しばらくしか続かない。ことばが原因で苦難や迫害が起こると、すぐにつまずく。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「離れていく」とも訳せる。ギリシア語の動詞には、「つまずかされる」「憤慨する」という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: 自分の内に根がなく
  rationale: 種と土のたとえにおける農耕の比喩と再帰的な意味を保ち、「深い」「堅い」など原文にない限定を加えない。
- source_word: πρόσκαιροί
  choice: しばらく続くだけである
  rationale: 一定期間しか持続しないという意味を、現代日本語で自然かつ明確に表す。
- source_word: εἶτα
  choice: その後
  rationale: 先行する状態に続いて起こる展開を自然に示す。
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: 苦難や迫害が起こると
  rationale: 属格独立構文を時の条件として表し、θλῖψιςの圧迫・苦しみとδιωγμόςの迫害を区別して訳す。
- source_word: διὰ τὸν λόγον
  choice: みことばのために
  rationale: たとえ全体で繰り返されるλόγοςとの用語上のつながりを保ち、それが原因であることを示す。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な切迫感を、自然な現代日本語で保つ。
- source_word: σκανδαλίζονται
  choice: つまずく
  rationale: 語の比喩を保ちつつ、離反だけに意味を固定せず、気分を害する、つまずかされる、離れてしまうという意味の幅を注で示す。
theological_decisions:
- issue: 弟子としての歩みと離反の文脈におけるσκανδαλίζονταιの訳
  choice: つまずく
  alternative: 離れてしまう／つまずかされる／気分を害する
  rationale: 文脈上は圧迫による離反を含み得るが、動詞自体の比喩と受動・中動の幅を残し、最終的救済について本文以上の教理的結論を加えない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御言葉」より読みやすく、聖書用語として定着した「みことば」を採用した。前後の論理を「また」「その後」で明示しつつ、簡潔な文調を保った。
