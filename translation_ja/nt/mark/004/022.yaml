  naturalness: 「というのも、明らかにされるためでなく隠されているものは何もなく」は、現代日本語では「ためでなければ」を用いるほうが明瞭である。「というのも」で始める場合、文末の「からである」は不要であり、二文に分けると格言的な並行も自然に保てる。
  terminology: 「隠されている」「明らかにされる」「秘められるようになった」「表に現れる」は、意図的な秘密に狭めず、原文の受動性と並行をおおむね適切に表す。「秘められるようになった」によりἐγένετοの状態変化も反映できる。
