id: MRK.4.22
reference: Mark 4:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: ja
  text: というのも、明らかにされるためでなければ、隠されているものは何もない。また、表に現れるためでなければ、秘められるようになったものは何もない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「明らかにされることなく隠されているものは何もなく、表に現れることなく秘められるようになったものは何もない」とも訳せる。ギリシア語の二つのἵνα節は、目的とも結果とも受け取ることができる。
    reason: alternative_reading
lexical_decisions:
- source_word: κρυπτόν
  choice: 隠されているもの
  rationale: 「隠れた、隠された」という基本義を保ち、後続する「明らかにされる」と自然な対照をなす。意図的な秘密に限定しない。
- source_word: ἐὰν μὴ ἵνα
  choice: ～ためでなく…ものは何もない
  rationale: 例外を表す構文とἵναの目的的な響きを、否定構文を保ちながら日本語で表した。結果の含みもあり得るため脚注を付した。
- source_word: φανερωθῇ
  choice: 明らかにされる
  rationale: 受動態を保ち、見えるようになることと知られるようになることの双方を含み得る自然な表現とした。
- source_word: ἀπόκρυφον
  choice: 秘められたもの
  rationale: κρυπτόνとの並行関係を保ちつつ単純な反復を避け、見えない所に置かれたものという含みを表す。
- source_word: ἐγένετο ἀπόκρυφον
  choice: 秘められたもの
  rationale: 日本語では状態変化を逐語的に「秘められるようになった」とすると不自然になるため、完了した状態を自然に表した。
- source_word: ἔλθῃ εἰς φανερόν
  choice: 表に現れる
  rationale: 「見える所へ来る」という移動の比喩を、明瞭で現代的な日本語にした。
- source_word: γάρ
  choice: というのも…からである
  rationale: 前節の発言を説明する接続関係を明示した。
theological_decisions:
- issue: 二つのἵνα節における目的と結果の含み
  choice: 本文では「～ため」として目的の響きを保つ
  alternative: 「明らかになることなく…隠されているものは何もない」のように結果として訳す
  rationale: ἵναは通常目的を示すが、コイネー・ギリシア語では結果に近い含みも持ち得る。本文で目的の響きを示し、脚注で結果として読む可能性を残すことで、隠されたものが最終的には明らかになるという言葉の緊張を過度に説明しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格言としての簡潔さと重みを保った。「というのも…からである」により前節との説明関係を示した。
