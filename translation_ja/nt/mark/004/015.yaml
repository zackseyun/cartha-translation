base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: ja
  text: 道端にいる人たち、すなわち、ことばがまかれる所にいる人たちとは、こういう人たちである。彼らが聞くと、すぐにサタンが来て、彼らに[a]まかれたことばを取り去る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの内に」。原文は「彼らへ／彼らの内へ」という方向を表す語を用いる。異本には、この句を欠くものもある。
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν
  choice: 道端にまかれたものとは、こういう人たちである
  rationale: 直訳的な「道端にいる者たち」では比喩とのつながりが不明瞭になるため、直前の種まきのたとえを受けて「まかれたもの」を補った。「こういう人たち」で、イエスが種の落ちた場所を人々に対応させていることを自然な日本語で示した。
- source_word: σπείρεται ὁ λόγος
  choice: ことばがまかれ
  rationale: 受動の種まきの比喩と、λόγοςの反復を保った。「みことば」として神のことばであることを明示せず、原文どおり簡潔な「ことば」とした。
- source_word: ὅταν ἀκούσωσιν
  choice: 彼らがそれを聞くと
  rationale: 一般的・反復的な時間関係を表すὅταν＋接続法を、現代日本語で自然な「聞くと」とした。「それを」は、聞く対象が直前の「ことば」であることを明確にする補足である。
- source_word: εὐθὺς ἔρχεται ὁ Σατανᾶς
  choice: すぐにサタンが来て
  rationale: マルコに特徴的なεὐθύςの即時性を「すぐに」で保ち、ὁ Σατανᾶςは人格的な存在を指す通常の固有名として「サタン」とした。
- source_word: αἴρει
  choice: 奪い去る
  rationale: ここでは、まかれたことばを取り除く動作を表す。「取り去る」も可能だが、敵対者であるサタンの行為と文脈上の喪失を自然に伝える「奪い去る」を選んだ。
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: 彼らの内にまかれたことば
  rationale: 分詞が「ことば」を修飾する構造を保った。εἰς αὐτούςは内的受容を示し得るため本文では「彼らの内に」とし、方向性を前面に出す別訳は脚注に示した。
theological_decisions:
- issue: たとえの説明におけるサタンの人格的行為
  choice: 人格的な存在である「サタン」が来て、ことばを奪い去ると訳す
  alternative: 「敵対するもの」など、非人格的にも読める表現にする
  rationale: 定冠詞を伴うὁ Σατανᾶςは、ここでは人格的な悪しき存在を自然に指す。抽象的な悪や心理作用へ還元せず、原文の表現をそのまま保った。
- issue: ことばがまかれる場所を示すεἰς αὐτούς
  choice: 「彼らの内に」として内的な受容を表し得る訳を本文に置く
  alternative: 「彼らに」として方向・到達を中心に訳す
  rationale: 前置詞εἰςには方向性がある一方、この文脈では人の内への受容も示唆し得る。本文と脚注によって両方の可能性を残し、受容の深さについて本文以上の神学的判断を加えないようにした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、たとえの種まきの比喩と「ことば」の反復を保持した。「である」と「奪い去る」により、説明文として簡潔で品位ある調子に整えた。
