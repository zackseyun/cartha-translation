  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: ja
  text: というのも、持っている人には、さらに与えられ[a]、持っていない人からは、持っているものまで取り上げられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「その人には与えられる」とあるだけで、何が与えられるかは明示されていません。「さらに」は前後の対照から補っています。
    reason: 原文で省略された目的語と、訳文で補った増加の意味を明示するため。
lexical_decisions:
- source_word: ὃς
  choice: 人
  rationale: 不定関係代名詞の一般的・格言的な意味を、現代日本語で自然に表す。性別を限定する意図はない。
- source_word: γὰρ
  choice: からです
  rationale: 直前の教えを根拠づけて説明する接続の働きを、文末表現によって明確にした。
- source_word: ἔχει
  choice: 持っている
  rationale: 何を持っているかを特定しない原文の簡潔さと曖昧さを保つ。
- source_word: δοθήσεται αὐτῷ
  choice: さらに与えられ
  rationale: 原文には与えられる物が明示されていないが、対照構造が示す増加の意味を「さらに」で自然に表した。受動態も保持した。
- source_word: οὐκ ἔχει
  choice: 持っていない
  rationale: 単純な所有の否定として、明快で自然な現代日本語にした。
- source_word: καὶ ὃ ἔχει
  choice: 持っているものまで
  rationale: καὶ の強意的な含みを「まで」で表し、現に持っているものさえ失うという逆説を保持した。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 取り上げられる
  rationale: 本人から除き去られることを表す未来受動の意味を、日本語で自然に伝える。
theological_decisions:
- issue: δοθήσεται の明示されない目的語
  choice: 「さらに与えられ」とし、増加を副詞で示す
  alternative: 「与えられ」とだけ訳す
  rationale: ギリシア語は目的語を明示しないが、格言の対照関係は、持つ人にいっそう与えられることを示す。「何が」与えられるかは特定せず、文脈上の曖昧さを保った。
- issue: 「持っている」ものの指示内容
  choice: 内容を特定せず「持っている」と訳す
  alternative: 理解、信仰、神の国の知識などを補う
  rationale: 原文は対象を明示していないため、文脈から一つの神学的解釈に限定しない。
- issue: 一般的な男性単数表現
  choice: 性別を限定しない一般名詞「人」を用いる
  alternative: 「彼」と男性代名詞で表す
  rationale: ギリシア語の男性単数形はここでは一般的・代表的な用法であり、日本語の「人」がその範囲を正確かつ自然に表す。
translation_notes:
  register: 明快で格調を保った現代標準日本語。格言的な簡潔さを維持しつつ、γὰρ の説明的なつながりを「からです」で示した。
