  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: ja
  text: また、別の者たちは、茨の中にまかれた者たち[a]である。この人たちは、ことば[b]を聞いた人たちである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「茨の中へまかれた者たち」。
    reason: εἰςは形式上「…の中へ」という方向を表すが、農耕の文脈では「…の中に」とも自然に表現できるため。
  - marker: b
    text: 別訳「メッセージ」。
    reason: λόγοςはここで、聞かれる「ことば」または伝えられる「メッセージ」を指しうるため。
lexical_decisions:
- source_word: ἄλλοι
  choice: 別の人たち
  rationale: 形容詞の名詞的用法を、先に説明された人々との対比が明確になる自然な日本語で表した。
- source_word: εἰς τὰς ἀκάνθας
  choice: 茨の中に
  rationale: εἰς の方向性を「中に」で保ちつつ、茨が生えている場所に種がまかれる農耕上の情景を自然に表した。
- source_word: ἀκάνθας
  choice: 茨
  rationale: とげのある植物を指す語として、たとえの伝統的なイメージを保つ簡潔で一般的な訳語を選んだ。
- source_word: σπειρόμενοι
  choice: まかれたもの
  rationale: 受動の種まきの比喩を保持した。文脈上は人々を指すが、あえて「もの」として種との比喩的同一視を残した。
- source_word: οὗτοί εἰσιν
  choice: これは、…人たちである
  rationale: 説明を再開する指示・同定の構文を明示し、前文の比喩的な集団を受ける自然な日本語とした。
- source_word: οἱ ... ἀκούσαντες
  choice: 聞いた人たち
  rationale: アオリスト分詞が示す、後続の出来事に先立つ聞く行為を簡潔に表した。日本語では完了を過度に補わずとも順序が伝わる。
- source_word: τὸν λόγον
  choice: みことば
  rationale: このたとえにおける宣べ伝えられた神のことばを指す用法を、現代日本語の聖書語として理解可能な表現で訳した。「知らせ」という意味も注で示した。
theological_decisions:
- issue: 人々を種と同一視するたとえの表現
  choice: 「茨の中にまかれたもの」として比喩を保持する
  alternative: 「茨の中に種をまかれた土地のような人たち」と説明的に訳す
  rationale: 原文は人々を、まかれる種になぞらえる表現をそのまま続けている。土地と人との対応を補って曖昧さを解消せず、たとえの文学的緊張を保った。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、たとえの厳粛さと反復構造を保った。「まかれたもの」はやや非日常的だが、原文が人と種を重ねる比喩を意図的に保持するため採用した。
