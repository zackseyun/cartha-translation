  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: ja
  text: また、別の種が茨の中に落ちた。すると茨が伸びてきて、それをふさいだ。実を結ばなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: 別の種
  rationale: 中性単数形は直前の文脈にある「種」を省略して指す。日本語では指示対象を明確にするため「種」を補った。
- source_word: ἔπεσεν
  choice: 落ちた
  rationale: πίπτωのアオリストを素直に訳した。「蒔かれた」とすると、実際に用いられている動詞以上の解釈を持ち込むことになる。
- source_word: εἰς τὰς ἀκάνθας
  choice: 茨の中に
  rationale: εἰςの方向性を「中に」で保ちつつ、茨の生えている場所に種が落ちた情景を自然な日本語で表した。
- source_word: ἀνέβησαν
  choice: 伸びてきて
  rationale: 植物が地上へ伸び出て成長する意味を、現代日本語として自然に表す。「生えてきて」も可能だが、すでにその場所にあった茨が成長した可能性を狭めない。
- source_word: συνέπνιξαν
  choice: ふさぎ
  rationale: 茨が種の成長を圧迫して妨げる比喩を表す。日本語の植物描写では「ふさぐ」が自然であり、「絞め殺す」ほど過度に字義的ではない。
- source_word: αὐτό
  choice: それを
  rationale: 単数代名詞の指示を保ち、直前に補った「種」を受ける自然な表現とした。
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: 実を結ばなかった
  rationale: 字義的には「実を与えなかった」だが、日本語では植物について「実を結ぶ」が自然で、結実しなかったという結果を正確に伝える。
theological_decisions: []
