  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: ja
  text: そして、太陽が昇ると、焼けて、根がなかったので、枯れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から続く単純な接続を自然な現代日本語で示す。
- source_word: ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: 太陽が昇ると
  rationale: 時間関係を表すὅτεを「と」で自然に示し、ἀνατέλλωと太陽の組み合わせを「昇る」と訳した。
- source_word: ἐκαυματίσθη
  choice: 焼けつき
  rationale: 太陽の熱によって植物が損なわれる受動的な意味を簡潔に表す。
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: 根がなかったので
  rationale: διάを伴う冠詞付き不定詞の原因を「ので」で示し、単数のῥίζανを「根」とした。
- source_word: ἐξηράνθη
  choice: 枯れてしまった
  rationale: 植物が乾いて枯れる結果を自然に表す。「しまった」は結果の完結を示すが、過度な強調にならない口語的表現である。
