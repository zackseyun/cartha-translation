id: MRK.4.11
reference: Mark 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: ja
  text: そして、彼らに言われた。「あなたがたには神の国の奥義が与えられている。しかし、外の人々には、すべてがたとえで示される。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: 奥義
  rationale: 人間には隠されていたが神によって明かされる真理を指す語であり、単なる不可解な「謎」ではないため。現代日本語での理解しやすさを保ちつつ、聖書的な含意を残す。
- source_word: τοῖς ἔξω
  choice: 外の人々
  rationale: 弟子たちの集まりの外にいる者たち、という空間的・共同体的な対比を簡潔に保持する。
- source_word: ἐν παραβολαῖς
  choice: たとえで
  rationale: イエスの比喩的な教えを表す定着した自然な訳語。複数形は日本語では無標で表現できる。
- source_word: τὰ πάντα γίνεται
  choice: すべてが…示される
  rationale: 直訳的な「すべてが…生じる」では日本語として不自然であるため、教えが彼らに届く様態を表す文脈上の意味を自然に示す。「語られる」と限定しすぎず、γίνεται の幅を残す。
- source_word: δέδοται
  choice: 与えられている
  rationale: 完了形の、すでに与えられ現在もその状態にあるという含意を保持する。
theological_decisions:
- issue: 神の国の奥義を受ける主体と授与の受動態
  choice: 「あなたがたには…与えられている」
  alternative: 「あなたがたは…知ることを許されている」
  rationale: 原文は知識や許可を明示せず、「奥義」そのものが与えられたと述べるため、その受動表現を保つ。行為者が神であるという含意も、原文同様に明示しない。
- issue: 外の人々とたとえの関係
  choice: 「外の人々には、すべてがたとえで示される」
  alternative: 「外の人々にとっては、すべてがたとえとなる」
  rationale: 与格と ἐν παραβολαῖς の構造を保ち、たとえが啓示か隠蔽かという後続節で展開される緊張を、この節だけで一方に決めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「言われた」は反復的な未完了過去を日本語で過度に説明せず自然に表現した。「奥義」はやや聖書語的だが、μυστήριον の啓示的含意を「秘密」や「謎」より適切に伝える。
