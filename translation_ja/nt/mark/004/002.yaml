base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: ja
  text: そして、イエスはたとえを用いて多くのことを[a]教えていて、その教えの中で彼らにこう語っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「多くを」。ギリシア語の πολλά は「多くのこと」または、より簡潔に「多く」と訳すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: 教え
  rationale: 未完了時制が示す継続的な教授を文全体の「語っていた」と合わせて自然な日本語で表した。
- source_word: ἐν παραβολαῖς
  choice: たとえを用いて
  rationale: 手段・様態を示すἐν＋与格を、現代日本語で明瞭かつ自然に表した。
- source_word: πολλά
  choice: 多くのことを
  rationale: 中性複数形の広がりを保ち、「多く」を副詞的に曖昧化せず、教えられた内容として表した。
- source_word: ἔλεγεν
  choice: こう語っていた
  rationale: 未完了時制の継続性を保ちつつ、次節から始まる直接話法への導入として自然にした。
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: その教えの中で
  rationale: διδαχήを「教え」とし、ギリシア語の構文と、続く発言がイエスの教授に属することを保持した。
- source_word: καὶ
  choice: そして
  rationale: マルコに特徴的な並列的な物語の接続を保持した。
- source_word: αὐτοὺς / αὐτοῖς
  choice: （彼らを）／彼らに
  rationale: 最初の代名詞は日本語では「多くのことを教え」により自然に省略し、後者は発話の相手を明示するため「彼らに」と訳した。
