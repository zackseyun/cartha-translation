  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: ja
  text: 彼は、たとえを用いずに彼らに語ることはなかったが、自分の弟子たちだけのところでは、すべてを解き明かしていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてを説明していた」または「すべてを解釈していた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: たとえを用いずに
  rationale: 「たとえなしに」より自然な現代日本語としつつ、たとえを介して語ったという具体的な意味を保った。
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: 彼らに語ることはなかった
  rationale: 未完了過去の反復的・習慣的な意味を、日本語の「ことはなかった」で表した。文脈上の「彼ら」を明示したままにした。
- source_word: κατ’ ἰδίαν
  choice: ひそかに
  rationale: 公の場での語りとの対照を自然かつ簡潔に示す。「個別に」よりも、この文脈での私的な場面を伝えやすい。
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: 自分の弟子たちには
  rationale: ἰδίοις の「自分自身の」という強調を「自分の」で保持し、対照を示す与格を「には」で表した。
- source_word: ἐπέλυεν
  choice: 解き明かしていた
  rationale: 「説明する」「解釈する」の双方を含みうる語であり、教えやたとえの意味を明らかにする文脈に適した、自然で品位ある表現とした。未完了過去も「していた」で反映した。
- source_word: πάντα
  choice: すべて
  rationale: 原文は対象を限定していないため、「すべてのたとえ」などと狭めず、包括的な表現を保った。
theological_decisions:
- issue: イエスがひそかに解き明かした内容の範囲
  choice: 「すべて」とし、範囲を限定しない
  alternative: 「すべてのたとえ」「語ったことをすべて」
  rationale: 文脈からたとえや教えが念頭にある可能性は高いが、原文の πάντα 自体は対象を明示しない。翻訳でその範囲を狭めず、原文の包括性と曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙述としての品位を保った。「しかし」と「けれども」により、公のたとえによる語りと弟子たちへの私的な解説との二重の対照を示した。
