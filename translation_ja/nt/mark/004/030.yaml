  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: ja
  text: イエスは言っておられた。「神の国を何にたとえようか。あるいは、どのようなたとえでそれを示そうか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「どのたとえの中にそれを置こうか」。ギリシャ語のἐν τίνι παραβολῇ θῶμενは、たとえを表現の手段として「どのようなたとえによってそれを示そうか」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἔλεγεν
  choice: また、イエスは言われた
  rationale: καίは談話の継続を示す「また」とし、未完了過去ἔλεγενは日本語の自然な物語表現として「言われた」とした。文脈上の主語イエスを補い、敬意を保った。
- source_word: Πῶς ὁμοιώσωμεν
  choice: 何にたとえようか
  rationale: 一人称複数の勧誘・熟慮を表す接続法を、日本語で自然な修辞的問い「たとえようか」とした。「何に」は比較の対象を尋ねる文脈上の意味を明確にする。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 福音書で定着した表現であり、神の支配と国のイメージの双方を保持する。
- source_word: ἢ
  choice: 。
  rationale: 二つの問いは同じ内容を言い換える並行表現であるため、日本語では不自然な「あるいは」を避け、独立した問いとして続けた。代替関係は並置によって保たれる。
- source_word: ἐν τίνι παραβολῇ
  choice: どのようなたとえで
  rationale: ἐν＋与格が持ちうる手段の意味を「で」で表した。「たとえ」は共観福音書のπαραβολήに対する明瞭で定着した訳語である。
- source_word: αὐτὴν ... θῶμεν
  choice: それを示そうか
  rationale: τίθημιの基本義は「置く」だが、この構文では神の国をたとえによって提示・表現する意味であるため、現代日本語として自然な「示す」を採用した。代名詞「それ」は神の国を受ける。
theological_decisions:
- issue: 「神の国」の意味範囲
  choice: 神の国
  alternative: 神の支配
  rationale: 「支配」と限定せず、βασιλείαが持つ統治と領域の両方の含みを残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「何にたとえようか／どのようなたとえでそれを示そうか」という並行する問いを保ちつつ、逐語的で不自然な表現を避けた。
