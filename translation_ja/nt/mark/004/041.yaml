source:
  edition: SBLGNT
  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: ja
  text: 弟子たちは非常に恐れ、互いに言った。「いったい、この方はどなたなのだろう。風も海も、この方に従うとは。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: 非常に恐れ
  rationale: 動詞と同根の目的語を重ねる強意表現を、現代日本語として自然な「非常に恐れ」で表した。単なる驚きではなく、強い恐れであることを保つ。
- source_word: ἔλεγον
  choice: 言った
  rationale: 未完了過去形は継続・反復を含み得るが、ここでは日本語の物語文として自然な過去形を用いた。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 弟子たちの間で交わされた相互の発言を簡潔かつ自然に表す。
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: いったい、この方は何者なのだろう
  rationale: ἄραが示す、直前の出来事を受けた推論と驚きを「いったい」「なのだろう」で表した。οὗτόςは文脈上イエスを指すため、敬意ある自然な日本語として「この方」とした。
- source_word: ὅτι
  choice: ～とは
  rationale: 問いの根拠となる驚くべき事実を、日本語で自然に受ける引用的・感嘆的な「とは」で表した。
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: 風も湖も
  rationale: 最初のκαίの「～さえ」という強調と、二つの主語の並列を、日本語の「も……も」で自然に表現した。θάλασσαはこの物語の舞台であるガリラヤ湖を指すため「湖」とした。
- source_word: ὑπακούει αὐτῷ
  choice: この方に従う
  rationale: ὑπακούωが表す命令への服従を「従う」で保持し、風と湖に及ぶイエスの権威を説明的に膨らませず伝える。
theological_decisions:
- issue: 被造世界に対するイエスの権威
  choice: 弟子たちの問いと、風と湖がイエスに従うという表現をそのまま保つ
  alternative: イエスの神的身分を明示する説明を訳文に加える
  rationale: 本文は並外れた権威を強く示唆するが、結論を明文化せず弟子たちの問いとして提示している。その神学的緊張を保持する。
- issue: 弟子たちの恐れの対象
  choice: 目的語を補わず「非常に恐れ」とする
  alternative: 「イエスを非常に恐れた」または「嵐を非常に恐れた」とする
  rationale: ギリシア語は恐れの対象を明示していないため、文脈から一つに限定しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「何者なのだろう」により弟子たちの驚きと問いを自然に表し、原文にない教理的説明は加えていない。
