source:
  edition: SBLGNT
  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: ja
  text: その人が夜も昼も眠ったり起きたりしているうちに、種は芽を出して伸びていく[a]。どのようにしてそうなるのか、本人は知らない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「伸びていく」は、「成長していく」または「丈が高くなっていく」とも訳せる。原語の二つ目の動詞には、長くなる、丈が増すという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「本人がどのようにしてかを知らない」。ここでは「どのようにしてそうなるのか、本人は知らない」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ καὶ ἐγείρηται
  choice: 眠ったり起きたりしている
  rationale: 現在接続法が連なる一般的・反復的な動作を、自然な現代日本語で表した。「起きる」はここでは目を覚まして起床する意味であり、復活を示唆しない。
- source_word: νύκτα καὶ ἡμέραν
  choice: 夜も昼も
  rationale: 時の継続的な巡りを表す対句を、語順を保ちながら自然な日本語にした。
- source_word: ὁ σπόρος
  choice: 種
  rationale: 定冠詞により、たとえの中ですでにまかれた種を指す。日本語では文脈上、定性を特に標示する必要がない。
- source_word: βλαστᾷ
  choice: 芽を出して
  rationale: 植物の成長が始まることを明瞭かつ日常的に表す。
- source_word: μηκύνηται
  choice: 伸びていく
  rationale: 単に成長するだけでなく、長くなる・丈が増すという動詞の具体的な含みを、自然な日本語で保った。
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: どのようにしてそうなるのか、本人は知らない
  rationale: 直訳では不自然になるὡςを、成長の仕方を知らないという文脈上の意味として表した。αὐτόςの強調は「本人」で保持した。
theological_decisions:
- issue: 種が成長する主体と仕組み
  choice: 種が芽を出して伸びる一方、その仕組みを人は知らないという叙述にとどめる。
  alternative: 神が種を成長させると明示する、または単なる自然現象として限定する。
  rationale: 本文は成長の仕組みを人の視点から未説明のまま残しており、この節だけで神的働きを明記することも、純粋に自然的な過程へ限定することもしていないため。
translation_notes:
  register: 明瞭で現代的な標準語を用い、たとえ話にふさわしい簡潔で落ち着いた調子とした。「眠ったり起きたり」で日々の反復を表し、「伸びていく」でμηκύνηταιの具体性と日本語としての自然さを両立させた。
