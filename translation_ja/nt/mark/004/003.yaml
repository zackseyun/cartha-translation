lexical_decisions:
- source_word: Ἀκούετε
  choice: よく聞きなさい
  rationale: 現在能動命令法二人称複数。聞き手全体に注意深く聞くよう促す命令として、現代日本語で自然かつ明確に表した。
- source_word: ἰδού
  choice: 見なさい
  rationale: 後続の情景へ注意を向けさせる談話標識。単なる視覚動作ではなく、語りに注目させる強い呼びかけを保った。
- source_word: ἐξῆλθεν
  choice: 出て行った
  rationale: 外へ向かう移動を表すアオリスト能動直説法。文脈上自然な日本語とした。
- source_word: ὁ σπείρων
  choice: 種をまく人
  rationale: 冠詞付き現在分詞の名詞的用法。役割名の「種まく人」も可能だが、一般の読者に明快な表現を選んだ。
- source_word: σπεῖραι
  choice: 種まきに
  rationale: 移動の目的を示すアオリスト能動不定詞。「種をまくために」より簡潔で、直前の表現との反復も自然に保つ。
