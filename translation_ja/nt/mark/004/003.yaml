    issue: 「よく聞きなさい」 adds an intensifying nuance not explicit in Ἀκούετε.
    rationale: The imperative itself is an attention-command, but the adverb 「よく」 specifically adds “carefully/well.” 「聞きなさい」 is sufficient and more closely matched to the source.
  - severity: low
    issue: The main text’s 「見なさい」 is formally possible for ἰδού but somewhat stiff as a transition into a narrated parable scene.
    rationale: In this context ἰδού functions primarily as a discourse particle drawing attention to what follows. 「さあ」 communicates this function more naturally in modern Japanese; a footnote can retain the lexical alternative.
  - severity: low
    issue: 「種まきに」 is natural but does not represent the infinitival purpose as explicitly as the available Japanese construction does.
    rationale: 「種をまくために」 makes the purpose relation of σπεῖραι fully clear and preserves the source’s verbal repetition.
