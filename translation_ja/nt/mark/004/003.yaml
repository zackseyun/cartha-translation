  verdict: revise
  source_fidelity: Ἀκούετε is a plural imperative calling for attention; 「聞きなさい」 conveys this without adding the intensifier 「よく」. ἰδού is a marked attention-drawing particle, for which 「さあ」 is a natural modern Japanese discourse equivalent here; the footnote preserves 「見なさい」 as the more formally lexical alternative. ἐξῆλθεν σπεῖραι is accurately represented by 「種をまくために出て行った」, retaining both outward movement and purpose.
  naturalness: 「聞きなさい。さあ、…」 is clear modern standard Japanese and maintains the twofold summons to attention. 「種をまく人が種をまくために」 necessarily repeats the verb, as does the Greek, but is idiomatic and transparent.
  terminology: 「種をまく人」 is an accessible rendering of the substantival participle ὁ σπείρων. No theological terminology is at issue.
  issues:
