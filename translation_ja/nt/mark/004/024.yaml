id: MRK.4.24
reference: Mark 4:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: ja
  text: イエスは彼らにこう言っていた。「何を聞くかに注意しなさい。あなたがたが量るその尺度で、あなたがたにも量られます[a]。さらに、あなたがたに加えられます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたが用いる量りで、あなたがたにも量られます。」
    reason: ギリシア語は「尺度」とそれに対応する「量る」という語を反復している。「尺度」は比喩の基準を明瞭にする訳であり、「量り」は語の反復をより直接的に保つ訳である。
  - marker: b
    text: 「加えられる」とは、イエスの教えを受け入れる人の理解がさらに増すことだと解することもできます。ただし、何が加えられるかは原文に明記されていません。
    reason: 直近の「聞く」という文脈に基づく有力な解釈を示す一方、本文が残す対象の曖昧さを保持するため。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っていた
  rationale: 未完了時制が表す継続的・反復的な語りの側面を、自然な現代日本語で保った。
- source_word: Βλέπετε
  choice: よく注意しなさい
  rationale: 字義は「見なさい」だが、ここでは注意を促す命令として機能するため。
- source_word: τί ἀκούετε
  choice: 何を聞くか
  rationale: τίを素直に「何を」と訳し、「どのように聞くか」とするルカ8章18節の表現に同化させなかった。
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: あなたがたが量るその量りで
  rationale: μέτρονとμετρέωの語根の反復と、量る基準・手段を表す比喩を日本語でも保った。
- source_word: μετρηθήσεται ὑμῖν
  choice: あなたがたにも量られます
  rationale: 未来受動の相互応報的な形を保ち、行為者を明示しない原文の余地も残した。
- source_word: καὶ προστεθήσεται ὑμῖν
  choice: さらに、あなたがたに加えられます
  rationale: 何が加えられるかを原文同様に明示せず、προστίθημιの「加える」という意味を保った。「さらに」により追加の趣旨を自然に示した。
theological_decisions:
- issue: 応報的な量りの言葉をどう解するか
  choice: 聞く姿勢への応答という直近の文脈を保ちつつ、何が量られ、何が加えられるかは特定しない。
  alternative: 裁き、寛大さ、霊的理解の増加のいずれか一つに限定する。
  rationale: 直前の「何を聞くか」により、イエスの教えを受け入れる姿勢との関連が示唆されるが、本文の比喩そのものは適用範囲を明示していないため、神学的な緊張と曖昧さを残した。
- issue: 受動表現の行為者
  choice: 「量られます」「加えられます」とし、行為者を明示しない。
  alternative: 神が量り、神が加える、と明示する。
  rationale: 神的受動の可能性はあるが、ギリシア語本文は行為者を明記していないため、訳文でも補わなかった。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。命令は「注意しなさい」として率直にし、比喩の語の反復は多少の硬さを許して保持した。敬体を用い、イエスの発言として自然に読める調子に整えた。
