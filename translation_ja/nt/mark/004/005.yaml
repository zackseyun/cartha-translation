  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: ja
  text: また、別の種は岩地[a]に落ちた。そこには土があまりなく、土が浅かったので、すぐに芽を出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「石地」とも訳せる。ギリシア語は、岩の多い地面に土が薄く載っているような場所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: 別の種
  rationale: 中性単数の形容詞が名詞的に用いられ、直前の文脈にある種を指す。日本語では「種」を補うことで省略された内容が自然に伝わる。
- source_word: πετρῶδες
  choice: 岩地
  rationale: 薄い土の下に岩盤があるような岩の多い土地を表す。「石だらけの所」よりも、続く土の浅さとの因果関係を保ちやすい。
- source_word: γῆν πολλήν
  choice: 土があまりなく
  rationale: γῆはここでは耕作に関わる「土」を指す。否定を伴う自然な現代日本語として量の少なさを表した。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 発芽の速やかさを簡潔で自然な現代日本語で表す。
- source_word: ἐξανέτειλεν
  choice: 芽を出した
  rationale: 農耕の文脈で、種が発芽して地上に現れることを明確に表す。
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: 土が深くなかったので
  rationale: διάと冠詞付き不定詞による原因を、日本語の理由節で自然に表現し、土の層が浅いという像を保持する。
- source_word: ὅπου
  choice: そこには
  rationale: 場所を示す関係副詞を、前文の「岩地」を受ける自然な日本語の指示表現にした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。農耕の情景と、土が浅いために早く発芽したという因果関係が普通の読者にも伝わるようにした。
