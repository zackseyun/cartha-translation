  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: ja
  text: イエスは目を覚ますと、風を叱りつけ、海[b]に向かって言われた。「黙れ。静まれ[a]。」すると、風はやみ、大きな凪が訪れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「静まれ」に当たるギリシア語は、字義的には「口を封じられよ」または「口輪をはめられよ」。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「海」はガリラヤ湖のこと。ギリシア語本文は「海」と呼んでいる。
    reason: cultural_note
lexical_decisions:
- source_word: διεγερθεὶς
  choice: 目を覚ますと
  rationale: アオリスト受動分詞の時間的関係を自然な日本語で表した。直前の節では弟子たちがイエスを起こしているが、ここでは行為者を明示せず、「起きる／目を覚ます」という文脈上の意味を保った。
- source_word: ἐπετίμησεν
  choice: 叱りつけ
  rationale: マルコ福音書で権威ある強い制止を表す語であり、風への厳しい命令という力を保つ。
- source_word: τῷ ἀνέμῳ
  choice: 風を
  rationale: 語義どおり「風」とし、文脈から「嵐」を補わない。
- source_word: τῇ θαλάσσῃ
  choice: 海に
  rationale: θάλασσαの通常の語義を保持した。地理的にはガリラヤ湖だが、本文を「湖」と限定せず、注で説明する。
- source_word: Σιώπα
  choice: 黙れ
  rationale: 直截で強い現在命令形を、簡潔で自然な命令として訳した。
- source_word: πεφίμωσο
  choice: 静まれ
  rationale: 字義的には「口を封じられよ／くつわをはめられよ」だが、海に向けた命令として自然に通じる表現を本文に置き、鮮烈な比喩は注で示した。
- source_word: ἐκόπασεν
  choice: やみ
  rationale: 風が収まる、止むというκοπάζωの意味を、日本語で風と自然に結びつく動詞で表した。
- source_word: ἐγένετο γαλήνη μεγάλη
  choice: すっかり凪になった
  rationale: 結果として生じた「大きな静けさ」を、海面が完全に静まった状態として自然に表現した。「すっかり」はμεγάληの強意を担う。
theological_decisions:
- issue: 海への二つの命令を、伝統的な定型句にするか、ギリシア語の命令形を直接反映するか
  choice: 「黙れ。静まれ」と二つの命令として訳す
  alternative: 「安かれ、静まれ」または「黙れ。口を封じられよ」
  rationale: 原文には「平安」を意味する名詞はなく、沈黙と口を封じることを命じる二つの命令形がある。本文では自然な日本語を優先しつつ、その構造を保ち、字義的な比喩を注に残した。
- issue: θάλασσαを地理に合わせて「湖」とするか、原文どおり「海」とするか
  choice: 本文では「海」
  alternative: 「湖」または「ガリラヤ湖」
  rationale: 原文の語を保持し、イエスが海を制するという物語表現を狭めない。地理的情報は注で補った。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの命令の短さと威厳を保った。「凪」は日常的に理解でき、海が静まった結果を簡潔に示す。敬意を表すため発話導入を「言われた」としたが、命令そのものは原文の鋭さを保つ常体とした。
