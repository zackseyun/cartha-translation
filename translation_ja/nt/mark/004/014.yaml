  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: ja
  text: 種を蒔く人は、ことば[a]を蒔く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「知らせ」または「メッセージ」。ギリシア語λόγοςは、文脈により「ことば」や「知らせ」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: 種を蒔く人
  rationale: 冠詞付き現在分詞を実体詞的に取り、蒔く行為によって特徴づけられる人を表す。「農夫」よりも原文の行為そのものに焦点を保ち、日本語として自然にした。
- source_word: τὸν λόγον
  choice: ことば
  rationale: λόγοςは文脈により「ことば」「知らせ」「メッセージ」などを意味し得る。ここでは原文の簡潔さを保ち、神のことばや福音と明示して解釈を狭めない。
- source_word: σπείρει
  choice: 蒔く
  rationale: 現在直説法を、たとえの一般的な説明に合う日本語の非過去形で表した。「種を蒔く人」と「蒔く」の反復により、原文の語根の反復を可能な限り保った。
theological_decisions:
- issue: たとえの説明における「ことば」の指示対象
  choice: 「ことば」と一般的に訳し、指示対象を本文で補足しない。
  alternative: 「知らせ」「神のことば」「福音」
  rationale: ギリシア語本文はτὸν λόγονとのみ記す。文脈上は宣べ伝えられる神からの知らせが含意されるが、本文にない限定を加えず、原文の含みを保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「播く」ではなく常用的な表記「蒔く」を用い、たとえの農耕イメージと原文の反復を保った。
