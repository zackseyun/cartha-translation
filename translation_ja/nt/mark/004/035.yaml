lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: マルコ特有の歴史的現在だが、日本語では物語の時制に合わせて過去形にするほうが自然であり、出来事の意味は保たれる。主語は文脈からイエス、対象は弟子たちと明示した。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日の
  rationale: 時間を示す句を、現代日本語で自然な連体表現として訳した。
- source_word: ὀψίας γενομένης
  choice: 夕方になって
  rationale: 属格独立構文の時間的関係を、簡潔で自然な日本語にした。
- source_word: Διέλθωμεν
  choice: 渡ろう
  rationale: 一人称複数の勧奨的接続法を、「渡ろう」と訳し、話し手が同行する意志と促しを保った。
- source_word: εἰς τὸ πέραν
  choice: 向こう岸へ
  rationale: 湖の反対側を指す文脈に即し、日本語で簡潔かつ明確な表現を選んだ。
