source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: ja
  text: そして彼らに言われる。「このたとえが分からないのですか。それなら、どうしてすべてのたとえを理解できるでしょうか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より形式的には、「このたとえを知らないのですか。では、どうしてすべてのたとえを知るでしょうか」。原文の二つの動詞はいずれも「知る」と訳せますが、ここではたとえの意味を理解することを表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われる
  rationale: マルコに特徴的な歴史的現在を保ちつつ、イエスに対する自然で品位ある日本語の敬語表現とした。
- source_word: αὐτοῖς
  choice: 弟子たちに
  rationale: 直訳は「彼らに」だが、直前の文脈（4:10）で質問している人々を指すため、日本語で指示対象を明確にした。
- source_word: οἴδατε
  choice: 分からない
  rationale: 基本義は「知っている」だが、ここではたとえの意味を把握することが問題なので、自然な日本語の「分かる」とした。
- source_word: παραβολὴν
  choice: たとえ
  rationale: イエスの比喩的な教えを表す日本語聖書で定着した、一般読者にも理解しやすい語を選んだ。
- source_word: πῶς
  choice: それで、どうして
  rationale: καί と πῶς が第一の問いから第二の問いへの論理的帰結を示すため、そのつながりを自然な日本語で明示した。
- source_word: πάσας τὰς παραβολὰς
  choice: すべてのたとえ
  rationale: 複数形と πᾶς を素直に反映し、イエスのたとえによる教え全般を指す表現とした。
- source_word: γνώσεσθε
  choice: 理解できるでしょうか
  rationale: ここでは単に知ることではなく意味を悟ることを表す。未来形の問いと修辞的な響きを「できるでしょうか」で表した。
theological_decisions:
- issue: οἴδατε と γνώσεσθε の関係
  choice: 前者を「分かる」、後者を「理解する」とし、どちらも文脈上の理解・把握を表すものとして訳した。
  alternative: 両方を「知る」と形式的に訳す。
  rationale: 二つの異なるギリシア語動詞を日本語でもわずかに訳し分けながら、この節がたとえの意味の理解を問題にしていることを明確にした。知識と霊的理解の関係について特定の教理的解釈は加えていない。
- issue: 第二の問いの接続関係
  choice: 「それで、どうして」とし、第一の問いを受けた帰結として表した。
  alternative: καί を形式的に「そして」と訳す。
  rationale: ギリシア語の接続詞が持ちうる推論的な働きを、日本語で自然に示した。ただし断定を強めず、原文どおり問いの形を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら品位を保った。歴史的現在は「言われる」で保持した。修辞疑問の厳しさを弱めず、過度に古風な表現は避けた。
