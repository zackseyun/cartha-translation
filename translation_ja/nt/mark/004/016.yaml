  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: ja
  text: 同じように、岩地にまかれた人たちも、みことばを聞くと、すぐに喜んで受け入れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: 同じように
  rationale: 直前の種のたとえの説明との対応関係を示す副詞として、自然で明瞭な表現を用いた。
- source_word: ἐπὶ τὰ πετρώδη
  choice: 岩地に
  rationale: 土の下に岩盤がある、石の多い場所という農耕上の情景を簡潔に表し、「岩地」という直前のたとえと対応する語を保った。
- source_word: σπειρόμενοι
  choice: 種をまかれたもの
  rationale: 受動分詞の比喩を保持し、人々を指すことが文末で明らかになる形にした。
- source_word: τὸν λόγον
  choice: みことば
  rationale: この文脈の宣べ伝えられた神のことばを指す反復語として、日本語聖書で自然な表現を選んだ。単なる一般的な「話」にはしなかった。
- source_word: εὐθύς
  choice: すぐに
  rationale: マルコに特徴的な即時性を、現代日本語として自然に伝える。
- source_word: μετὰ χαρᾶς
  choice: 喜んで
  rationale: 喜びを伴う受容という仕方を、簡潔で自然な日本語で表した。
- source_word: λαμβάνουσιν αὐτόν
  choice: 受け入れる
  rationale: 単に物理的に受け取るのではなく、聞いたことばを歓迎して受容する意味を表しつつ、持続的な信仰まで読み込まない表現とした。
theological_decisions:
- issue: 「種をまかれたもの」が何を指すか
  choice: 「岩地に種をまかれたもの」というたとえの表現を保ち、後半で「人たち」と明示する。
  alternative: 「心が岩地のような人たち」と説明的に言い換える。
  rationale: 原文は種まきの比喩を保ちながら人々を指しているため、心の状態という解釈を本文へ付加せず、比喩と指示対象の緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語。たとえの農耕的イメージとマルコの簡潔な語り口を保ち、文末は前後の説明に合う dignified な常体とした。
