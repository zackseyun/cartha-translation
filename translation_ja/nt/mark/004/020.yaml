source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: ja
  text: また、良い土に蒔かれた者たちは、ことばを聞き、受け入れ[a]、三十倍、六十倍、百倍の実を結ぶ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け止める」または「歓迎する」とも訳せる。
    reason: παραδέχονται は、ことばを好意的に受け入れることを表し、「受け止める」「歓迎する」も文脈上可能である。
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: 人たち
  rationale: 直前までに説明されたほかの群と対照させつつ、良い土に対応する人々を自然な日本語で指す。
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: 良い土にまかれたもの
  rationale: 受動形と種まきの比喩を保つ。「土」はこの農耕の文脈で γῆ を明瞭に表す。
- source_word: ἀκούουσιν τὸν λόγον
  choice: ことばを聞いて
  rationale: λόγος を文脈内で繰り返される「ことば」とし、宣べ伝えられた内容という意味を過度に説明しない。
- source_word: παραδέχονται
  choice: 受け入れ
  rationale: 好意的に受容する意味を簡潔に表し、「聞く―受け入れる―実を結ぶ」という流れを保つ。
- source_word: καρποφοροῦσιν
  choice: 実を結ぶ
  rationale: 農耕の比喩と、その比喩的含意の双方を保つ自然な表現。
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: 三十倍、六十倍、百倍の実を結ぶ
  rationale: 収穫量の倍率を明示し、日本語として自然に読める形にする。三段階の増加は原文どおり保持する。
theological_decisions:
- issue: 良い土に当たる人々の、ことばへの応答の性質
  choice: ことばを聞いて受け入れ、実を結ぶという積極的な応答をそのまま述べる。
  alternative: この描写を、最終的な堅忍を必然とする教理、または単なる初期反応に限定する説明として訳文に織り込む。
  rationale: 本文は聞くこと、受け入れること、実を結ぶことを述べるが、堅忍や背教をめぐる後代の教理体系までは明示していないため、その緊張を解消しない。
translation_notes:
  register: 現代の一般読者に明瞭で、同時にたとえの品位と農耕イメージを保つ文体。「みことば」として意味を宗教語に狭めず、原文に対応する「ことば」を用いた。
