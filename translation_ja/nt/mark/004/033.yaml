  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: ja
  text: イエスは、このようなたとえを数多く用いて、彼らが聞くことのできる程度に応じて、彼らにことば[a]を語っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は「メッセージ」または「教え」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「彼らが聞けるだけ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις παραβολαῖς πολλαῖς
  choice: このようなたとえを数多く用いて
  rationale: 直前までのたとえと同種のものを数多く用いたことを、自然な現代日本語で表した。「用いて」は手段を表す与格を明確にする。
- source_word: ἐλάλει αὐτοῖς
  choice: 彼らに…語っていた
  rationale: 未完了過去の継続的・反復的な様相を「語っていた」で保ち、αὐτοῖςを間接目的語として訳した。
- source_word: τὸν λόγον
  choice: みことば
  rationale: イエスが告げる内容を指すマルコ福音書の聖書的表現を保つ。「メッセージ」「教え」も文脈上可能なため脚注に示した。
- source_word: καθὼς ἠδύναντο ἀκούειν
  choice: 彼らが聞くことのできる程度に
  rationale: καθὼςの程度・対応の意味と、δύναμαιの能力を明示する。ἀκούεινは理解まで断定せず、語義の表面に沿って「聞く」とした。
theological_decisions:
- issue: τὸν λόγονが指す内容
  choice: みことば
  alternative: メッセージ／教え
  rationale: 宣教・教示の内容を指すが、特定の教理概念に狭めず、原文のλόγοςとマルコにおける響きを保った。
- issue: ἀκούεινに理解の意味を含めるか
  choice: 聞く
  alternative: 理解する／受け入れる
  rationale: 文脈上は受容や理解を含み得るが、原文はἀκούεινを用いているため、その含みを解釈によって確定しない。
- issue: 聞く能力に応じた語り方の表現
  choice: 聞くことのできる程度に
  alternative: 聞けるだけ／理解できる程度に
  rationale: 群衆の能力に応じて語ったという対応関係を示しつつ、「理解できる」と強めることは避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御言葉」ではなく読みやすい「みことば」を採用した。脚注記号は該当語句の直後に置き、程度を示す句と動詞の関係が自然に伝わる語順とした。
