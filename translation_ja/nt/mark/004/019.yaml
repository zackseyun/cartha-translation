  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: ja
  text: この時代[a]の思い煩い、富の欺き、そのほかのものへの欲望が入り込んで、ことばをふさいで、ことばは実を結ばなくなる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この世の思い煩い」とも訳せる。ギリシア語は基本的には「時代」を意味し、そこから現在の世界秩序を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「そして、実を結ばないものとなる」といい、名詞主語を改めて述べない。直前の「ことば」を受ける理解がもっとも自然であるが、文脈から「聞く人」または「種・植物」が実を結ばなくなると理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι τοῦ αἰῶνος
  choice: この時代の思い煩い
  rationale: μέριμναの負担となる心配の意味を「思い煩い」で表し、αἰώνの基本的な時間的含意を「時代」で保った。「この」は、文脈上の現在の時代・秩序を自然な日本語で示す。
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: 富の惑わし
  rationale: ἀπάτηは欺きや惑わしを意味し、ここでは富が人を誤った方向へ誘う性質を表す。「富の惑わし」は簡潔で、属格表現の余韻も保つ。
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: そのほかのものへの欲望
  rationale: περὶ τὰ λοιπάが示す広い対象を限定せず、「そのほかのものへの」とした。ἐπιθυμίαιは文脈上、ことばと競合する欲求なので「欲望」と訳した。
- source_word: εἰσπορευόμεναι
  choice: 入り込んで
  rationale: 外から侵入してくる動きを表す分詞の生き生きした像を保つ。日本語では列挙された三つの要素すべてを主語として自然に受ける。
- source_word: συμπνίγουσιν
  choice: 押しふさぎ
  rationale: 植物がほかの植物を窒息させる比喩を保ちつつ、日本語でことばに対して理解しやすい表現とした。「締め殺す」ほど過度に強くせず、単なる「妨げる」より原語の像を残す。
- source_word: τὸν λόγον
  choice: ことば
  rationale: このたとえでは宣べ伝えられた神のことば・知らせを指す。「ことば」はマルコ4章内の反復と聖書的な響きを保ち、現代日本語でも理解できる。
- source_word: ἄκαρπος γίνεται
  choice: 実を結ばなくなる
  rationale: 直訳的な「実を結ばないものとなる」より自然でありながら、γίνεταιの変化・結果とἄκαρποςの結実の比喩を保持する。
theological_decisions:
- issue: 末尾の単数の動詞・形容詞が何を指すか
  choice: 本文では最も近い単数の先行語である「ことば」を主語として明示した。
  alternative: 聞く人が実を結ばなくなる、または種・植物が実を結ばなくなる。
  rationale: ギリシア語は主語を明示せず「実を結ばないものとなる」と述べるが、最も近い単数の名詞はτὸν λόγονである。種としてのことばがふさがれて実を結ばなくなるというたとえの像にも合う。他の理解も可能なので脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、たとえの農耕的な像と「ことば」の反復を保った。「この時代」はやや聖書的だが難解ではなく、αἰώνの時間的含意を「この世」だけに狭めない。
