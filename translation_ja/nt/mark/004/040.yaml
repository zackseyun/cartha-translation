lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の出来事にイエスの発言を結びつける標準的な接続表現。
- source_word: εἶπεν αὐτοῖς
  choice: イエスは弟子たちに言われた
  rationale: 日本語では主語と対象を文脈に即して補うと明瞭になる。敬意を保ちつつ、直接話法を自然に導入した。
- source_word: Τί
  choice: なぜ
  rationale: 形容詞と連結動詞を伴うこの用法は、理由を問う叱責として機能する。
- source_word: δειλοί
  choice: そんなにおびえている
  rationale: 嵐の中での恐怖という文脈を自然に表しつつ、δειλόςの否定的な叱責の力を保持する。より強い「臆病」は脚注に示す。
- source_word: οὔπω
  choice: まだ…ない
  rationale: οὔπωの時間的意味「まだない／いまだにない」を日本語の疑問文で自然に表す。
- source_word: ἔχετε πίστιν
  choice: 信仰がない
  rationale: 「信仰を持っていない」より自然な日本語。πίστιςの基本的・神学的な語感を保つため「信仰」とし、文脈上可能な「信頼」は脚注に示す。
theological_decisions:
- issue: πίστιςを、イエスへの信頼が問題となる文脈でどう訳すか
  choice: 信仰
  alternative: 信頼
  rationale: この文脈では「信頼」も十分可能だが、ギリシャ語は対象を明示せずπίστιςという名詞を用いているため、本文では意味を狭めない「信仰」を採用し、文脈的な別訳を脚注に残した。
- issue: οὔπωを含む問いの修辞的含意
  choice: まだ信仰がないのですか
  alternative: いまだに信仰がないのですか
  rationale: 時間的・修辞的な緊張を保持しつつ、本文では過度に解釈を加えない自然な表現とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、イエスの叱責の厳しさと弟子たちへの問いかけの自然さを両立させた。「ですか」を用いて威厳を保ち、「おびえている」で場面に即した恐怖を表した。
