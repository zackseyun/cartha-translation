  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: ja
  text: イエスは弟子たちに言われた。「なぜ恐れているのですか。まだ信仰がないのですか。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なぜ臆病なのですか」とも訳せる。
