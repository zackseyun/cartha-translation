lexical_decisions:
- source_word: εἴ τις
  choice: 人は
  rationale: 条件文を逐語的にすると日本語では不自然に重くなるため、一般的な呼びかけを表す主題構文とした。「だれでも」に相当する開かれた範囲は「人」によって保っている。
- source_word: ἔχει ὦτα ἀκούειν
  choice: 聞く耳がある
  rationale: 直訳的な「聞くための耳を持つ」より自然でありつつ、耳と聞くことの結びつき、および受け入れて聞く含意を保つ。
- source_word: ἀκουέτω
  choice: 聞きなさい
  rationale: 三人称単数の現在命令形。日本語では性別を示さずに一般的な命令として自然に表現でき、ἀκούεινとの語の反復も保てる。
theological_decisions:
- issue: 命令の一般的な単数対象
  choice: 聞きなさい
  alternative: その人は聞きなさい
  rationale: ギリシア語は不定代名詞の単数と三人称単数命令形を用いる。日本語の主題と命令形は性別を持ち込まず、個々の聞き手への一般的な呼びかけを自然に保持する。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。慣用的な「聞く耳」を用い、同根動詞の反復と、単なる聴覚以上の受容的な聞き方を伝える。
