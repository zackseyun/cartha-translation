  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: ja
  text: それは、一粒のからし種[a]のようなものです。それは地にまかれると、地にあるどの種よりも小さいのですが—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「からしの一粒」。
    reason: κόκκοςは「種」とも「粒」とも訳せるため。
lexical_decisions:
- source_word: ὡς
  choice: それは…のようなものです
  rationale: 前節の神の国についての問いを受ける省略表現を、日本語として自然になるよう補いながら、比較の意味を保った。
- source_word: κόκκῳ σινάπεως
  choice: からし種一粒
  rationale: κόκκοςは「粒」「種」を意味する。日本語では植物の種を表す「からし種」に「一粒」を添え、個々の小さな粒という像を明確にした。
- source_word: ὅταν σπαρῇ
  choice: まかれると
  rationale: 不定の時を表す一般的な条件・時の関係を、簡潔で自然な日本語にした。受動態も保持した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地に
  rationale: 農耕の文脈のγῆを「地」とし、種をまく場合に自然な助詞「に」を用いた。世界全体という意味にはしなかった。
- source_word: μικρότερον ὂν
  choice: 小さいのですが
  rationale: 比較級の意味を後続の「どの種よりも」と組み合わせて保持した。分詞構文は、次節へ文が続くことを示す接続表現として自然に訳した。
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: 地にあるどの種よりも
  rationale: 比較の属格を「どの…よりも」で表し、後半にもある「地」の限定を省略せず保持した。
theological_decisions:
- issue: からし種の大きさを比較級で述べるか最上級で述べるか
  choice: 地にあるどの種よりも小さい
  alternative: 地にあるすべての種の中で最も小さい
  rationale: 原文のμικρότερονは比較級であるため、形の上でも「よりも小さい」と訳した。実質的には広い比較を表すが、明示的な最上級へ言い換えず、たとえの緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話にふさわしい簡潔で品位ある調子とした。文末のダッシュは、原文が次節へ続くことを示す。
