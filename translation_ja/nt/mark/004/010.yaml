  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: ja
  text: さて、イエスが人々を離れておられたとき[a]、イエスの周りにいた人たちが、十二人とともに、たとえ話の数々についてイエスにお尋ねしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ひとりでおられたとき」。この表現は、イエスが全く一人だったというより、群衆を離れた私的な場面を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: さて、…とき
  rationale: καίによる物語の続​​きを、現代日本語で自然な接続を示す「さて」で表し、ὅτεの時間関係を「とき」で保持した。
- source_word: ἐγένετο κατὰ μόνας
  choice: ひとりになられた
  rationale: κατὰ μόναςは「ひとりで」「人目を離れて」という私的な状況を表す慣用句。「ひとりになられた」は簡潔で原文に近いが、直後に従う者たちが登場するため、私的な場面を指し得ることを脚注で示した。
- source_word: ἠρώτων
  choice: 尋ねていた
  rationale: 未完了過去の継続的・反復的な様相を、日本語の「ていた」で表した。
- source_word: οἱ περὶ αὐτὸν
  choice: イエスの周りにいた人たち
  rationale: 十二人だけに限定せず、イエスを取り巻いて従っていたより広い一群を指し得る表現として訳した。
- source_word: σὺν τοῖς δώδεκα
  choice: 十二人とともに
  rationale: σύνの同伴の意味を明示し、「周りにいた人たち」と「十二人」との原文上の区別を保った。
- source_word: τὰς παραβολάς
  choice: たとえの数々
  rationale: 本文の複数形を明確に反映し、直前の一つのたとえだけに意味を狭めなかった。
theological_decisions:
- issue: 質問した人々の範囲
  choice: イエスの周りにいたより広い一群が、十二人とともに尋ねた
  alternative: 十二人だけが尋ねた／十二人とは別の内輪の一群が尋ねた
  rationale: οἱ περὶ αὐτὸν σὺν τοῖς δώδεκαは、イエスの周りにいた者たちと十二人を区別しつつ、両者が一緒に尋ねたと読むのが自然である。訳文でもこの構文上の緊張を解消せず保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスへの言及には一般的な聖書文体として穏やかな敬語を用いた。「たとえの数々」でギリシア語の複数形を可視化し、「周りにいた人たち」と「十二人」の区別を保った。
