  text: καὶ γίνεται λαῖλαψ ⸂μεγάλη ἀνέμου⸃, ⸂καὶ τὰ⸃ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον, ὥστε ⸂ἤδη γεμίζεσθαι τὸ πλοῖον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: ja
  text: すると、激しい暴風[a]が起こり、波が次々と舟の中に打ち込んできた[b]ので、舟はすでに水で満たされつつあった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「大きな風の嵐」。「激しい風の嵐」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「波が繰り返し舟の中に打ち寄せていた」とも訳せる。ギリシア語の未完了過去は、波が何度も打ち込む様子を表す。
    reason: lexical_alternative
  - marker: c
    text: より直訳的には「舟はすでに満たされつつあった」。ギリシア語の現在不定詞は、舟が満たされる過程にあったことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: 起こり
  rationale: マルコの生き生きとした歴史的現在を、自然な日本語の過去の物語表現で示し、嵐の発生を伝える。
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: 激しい突風
  rationale: λαῖλαψの急激で荒々しい風雨・スコールの性格と、μεγάληおよびἀνέμουの強い風という要素を、簡潔で自然な日本語にした。
- source_word: κύματα
  choice: 波
  rationale: κῦμαの標準的で自然な訳語。
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: 次々と舟の中に打ち込んできた
  rationale: 未完了過去が表す反復・継続を「次々と」で示し、波が舟を打つだけでなく中へ入り込む方向性も保った。
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖で用いられた比較的小型の船を表す、聖書本文として自然で過度に大型船を連想させない語。
- source_word: ὥστε
  choice: ので
  rationale: 波が打ち込んだ結果として舟が満ちつつあったという結果関係を、自然な日本語で表す。
- source_word: ἤδη
  choice: すでに
  rationale: 浸水がその時点までにかなり進んでいたことを直接示す。
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: 舟はすでに水でいっぱいになりかけていた
  rationale: 現在不定詞の進行的な結果を表し、まだ完全に満杯になったとは断定しない。「水で」は文脈上明白な内容を日本語で自然に補った。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語の切迫感と反復する波の動きを保持した。「船」より場面に合う「舟」を採用し、全体を平易だが品位ある文体に整えた。
