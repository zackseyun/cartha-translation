  naturalness: 「見てはいても」「聞いてはいても」は明瞭で自然である。一方、引用符と文末の「ためである」によって、この節単独では原文にない説明的な引用文となっている。簡潔な「〜ように」で並行構造を保つ方が自然である。
  terminology: 「見抜く」はἴδωσινを最初の「見る」と区別する適切な選択であり、「理解する」「立ち返る」「赦される」も維持できる。「赦されることがないように」は神的受動と、赦しの対象が省略されている原文の形を過度に補わない。
