id: MRK.4.12
reference: Mark 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: ja
  text: 彼らが、見てはいても見抜かず[a]、聞いてはいても理解せず[c]、立ち返って赦されることがないように[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見ても悟らない」。
    reason: lexical_alternative
  - marker: b
    text: 「立ち返る」は、「向きを変える」、また文脈上は「悔い改める」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: イエスはイザヤ書6章9～10節を踏まえており、神の裁きと、人々が応答しないこととの緊張をそのまま残している。
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: ためである
  rationale: 目的・結果の両面を帯びうる接続詞。文脈上の厳しい響きを弱めず、日本語として引用につながる形にした。
- source_word: βλέποντες βλέπωσι
  choice: 見てはいても
  rationale: 同語反復の逆説的な力を、自然な現代日本語の譲歩表現で伝える。
- source_word: ἴδωσιν
  choice: 見抜く
  rationale: βλέπωとの違いを示し、単に目に映ることではなく、意味を認識することを表す。
- source_word: ἀκούοντες ἀκούωσι
  choice: 聞いてはいても
  rationale: 見る節との並行性と、聞く行為が理解に至らない逆説を保つ。
- source_word: συνιῶσιν
  choice: 理解する
  rationale: 知的・霊的に意味を把握することを、明瞭な標準語で表す。
- source_word: μήποτε
  choice: そうでなければ……かもしれない
  rationale: 回避される可能性を示す否定的な目的・懸念の力を、日本語で理解しやすく保つ。
- source_word: ἐπιστρέψωσιν
  choice: 立ち返る
  rationale: 方向転換の比喩と預言書的な悔い改めの含意をともに残す。
- source_word: ἀφεθῇ αὐτοῖς
  choice: 赦される
  rationale: 行為者を明示しない神的受動を保ち、単数受動の省略された対象を日本語では自然に表現する。
theological_decisions:
- issue: イザヤ書引用における目的・結果と、たとえが回心を妨げるかのような含意
  choice: 「ためである」「そうでなければ」を用い、目的的な厳しい表現を保持する。
  alternative: 「その結果」として単なる結果に限定する、または人々の不応答だけを説明する。
  rationale: ギリシア語のἵναとμήποτεが生む、神の裁きと人間の不応答との緊張を解消しないため。
- issue: ἐπιστρέψωσινと悔い改めの関係
  choice: 「立ち返る」
  alternative: 「悔い改める」または「向きを変える」
  rationale: 預言書的な回心の含意を伝えつつ、語を明示的な神学用語だけに狭めないため。
translation_notes:
  register: 明瞭で格調ある現代標準語。原文の並行構造と神学的緊張を保ちつつ、直訳的な不自然さを避けた。脚注標識は該当箇所に配置した。
