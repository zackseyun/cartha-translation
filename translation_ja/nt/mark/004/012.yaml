revisions:
- from: それは、「見てはいても見抜くことがなく[a]、聞いてはいても理解することがない」ためである[c]。そうでなければ、彼らは立ち返り、赦されるかもしれない[b]。
  to: 彼らが、見てはいても見抜かず[a]、聞いてはいても理解せず[c]、立ち返って赦されることがないように[b]。
  rationale: ἵνα以下を一貫して「〜ように」と訳し、見る／見抜く、聞く／理解するの並行と対照を保った。μήποτεは「そうでなければ」「かもしれない」と緩和せず、「立ち返って赦されることがないように」として、原文の難しい目的的表現と神学的緊張を保持した。本文にない引用符は除いた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:37:05Z'
