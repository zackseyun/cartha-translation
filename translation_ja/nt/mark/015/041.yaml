  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: ja
  text: この女たちは、イエスがガリラヤにおられたとき、イエスに従い、仕えていた[a]。このほかにも、イエスと一緒にエルサレムへ上って行った[b]多くの女たちがいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「世話をしていた」とも訳せる。ギリシア語の動詞は、実際的な奉仕や支援を表すことがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「イエスと一緒にエルサレムへ上った」。エルサレムへ向かうことを「上る」と表す聖書の慣用表現を反映している。
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: この女たちは
  rationale: 前節で名を挙げられた女たちを受ける関係代名詞。日本語では指示表現を用いることで、前節とのつながりを明確かつ自然にした。
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: イエスがガリラヤにおられた時
  rationale: 時を示す従属節を素直に訳した。主語は文脈上のイエスであり、敬意を保つ自然な現代日本語とした。
- source_word: ἠκολούθουν
  choice: いつも従って
  rationale: 未完了過去が示す継続的・習慣的な行為を「いつも」で表した。単発ではなく、ガリラヤで継続して従っていたことを伝える。
- source_word: διηκόνουν αὐτῷ
  choice: 仕えていた
  rationale: 実際的な世話や支援を含み得る広い奉仕を簡潔に表す。後代の教会職制を読み込まず、行為の内容を過度に限定しない。
- source_word: ἄλλαι πολλαὶ
  choice: このほかにも…多くの女たち
  rationale: 女性複数形の文脈を明示し、既出の女たちとは別に多数いたことを自然な日本語で示した。
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: イエスと一緒に…上って来た
  rationale: συναναβαίνωの同行と上行の意味を保持した。分詞の行為は現在の場面に先行しており、「上って来た」がその関係を自然に示す。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムへ
  rationale: 目的地を示すεἰςを、都市への移動を表す自然な日本語で訳した。
theological_decisions:
- issue: διηκόνουνが表す女たちの奉仕の性質
  choice: 仕えていた
  alternative: 世話をしていた／奉仕していた
  rationale: 実際的な世話や支援を含む可能性を保ちつつ、家事的行為だけにも、制度化された教会職にも限定しない訳語を選んだ。
- issue: ἠκολούθουνが含み得る弟子としての含意
  choice: いつも従って
  alternative: ついて行き／従い続け
  rationale: イエスへの継続的な随行を示しつつ、この一語だけで正式な身分や役職を断定しない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節との照応を「この女たちは」で示し、未完了過去の習慣性を「いつも」で表現した。敬称的な「おられた」は物語文として自然な範囲にとどめた。
