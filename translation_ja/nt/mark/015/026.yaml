base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: ja
  text: また、彼に対する罪状の掲示には、「ユダヤ人の王」と記されていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々の王」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: 罪状書き
  rationale: 十字架上に掲げられた、処刑理由を示す書面を指す。単なる「銘」より文脈上の機能が明確で、続く属格「彼の罪状」との重複も自然な日本語にまとめられる。
- source_word: αἰτία
  choice: 罪状
  rationale: 司法的文脈で、告発または処刑の根拠として掲示された罪名を表す。「罪状」は簡潔で現代日本語として自然である。
- source_word: ἐπιγεγραμμένη
  choice: 記されていた
  rationale: ἦνとの迂言的な完了表現が示す、書かれた状態の継続を自然に表す。
- source_word: βασιλεὺς
  choice: 王
  rationale: 掲示された罪状の文言にある王権の称号を、簡潔かつ格式を保って訳す。
- source_word: Ἰουδαίων
  choice: ユダヤ人
  rationale: 受難物語における定型的な称号「ユダヤ人の王」を保持する。語が文脈によって「ユダヤ地方の人々」を指し得ることは脚注で示す。
theological_decisions:
- issue: 十字架の称号におけるἸουδαίωνの訳
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: ここではローマ側が掲げた罪状・称号として民族集団を指す定型表現であり、「ユダヤ人の王」が最も自然で広く理解される。地理的な意味の可能性は排除せず、脚注に残す。
translation_notes:
  register: 明瞭な現代標準語を用い、掲示文の簡潔さと荘重さを保った。「罪状書きには」と統合することで、原文のἐπιγραφήとαἰτίαの関係を自然な日本語で表現した。
