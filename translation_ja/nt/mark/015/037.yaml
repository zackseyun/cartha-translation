  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: ja
  text: しかし、イエスは大声で叫び、息を引き取られた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「息を吐き出した」。すなわち、「死なれた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 弱い接続辞だが、直前の場面から死の瞬間への厳粛な展開を自然に示す。文脈によっては「そして」とも訳せる。
- source_word: ἀφεὶς φωνὴν μεγάλην
  choice: 大声で叫び
  rationale: ἀφίημιとφωνήの組み合わせは声を発することを表し、μεγάληはここでは声量・強さを示す。「大声を上げて」も可能だが、「大声で叫び」が明瞭で自然。
- source_word: ἐξέπνευσεν
  choice: 息を引き取られた
  rationale: 字義的な「息を吐き出す」という身体的イメージをある程度保ちつつ、死を表す現代日本語の自然で厳粛な慣用表現とした。単なる「死なれた」や、他福音書の表現に寄せる「霊をお渡しになった」は採らない。
- source_word: ὁ δὲ Ἰησοῦς
  choice: しかし、イエスは
  rationale: 固有名詞に付く冠詞は日本語では明示せず、接続辞と主語を自然な語順で表した。
theological_decisions:
- issue: イエスの死の表現に本文以上の神学的含意を加えないこと
  choice: 息を引き取られた
  alternative: 死なれた／霊をお渡しになった
  rationale: ἐκπνέωが表す呼吸と死のイメージを保つ一方、「霊をお渡しになった」のように他の福音書の語法や付加的な解釈を持ち込まない。尊敬表現は日本語の文体上、イエスへの自然な敬意を示すもので、死の自発性などを追加するものではない。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で厳粛な叙述を保ち、「逝去された」のような過度に婉曲・儀礼的な表現は避けた。
