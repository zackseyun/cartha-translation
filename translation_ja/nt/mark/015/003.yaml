  text: And the chief priests were accusing him of many things[a].
translation:
  language: ja
  text: 祭司長たちは、イエスを多くのことで訴えていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「多くのことで彼を訴えていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: （訳出せず）
  rationale: 前節からの単純な接続を示す語だが、日本語では明示しないほうが自然に物語が続く。
- source_word: κατηγόρουν
  choice: 訴え続けていた
  rationale: 未完了過去の継続的・反復的な動作を示し、祭司長たちが訴えを重ねていたことを表す。
- source_word: αὐτοῦ
  choice: イエスを
  rationale: 指示対象を明確にするため固有名で補い、日本語では「訴える」の目的語として表した。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数の指導的祭司権威を指す定着した訳語であり、「大祭司たち」として単独職の複数在任を連想させることを避ける。
- source_word: πολλά
  choice: さまざまなことで
  rationale: 訴えの対象となった事柄が多岐にわたることを示し、「罪状」と限定して原文以上に法廷的な意味を加えない。
