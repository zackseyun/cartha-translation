  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: ja
  text: 兵士たちは、田舎[b]から来て通りかかった、アレクサンドロとルフォの父であるキレネ人シモンを、イエスの十字架[c]を担がせるために無理に徴用した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「徴用した」は、強制的な奉仕に就かせることを表す。
    reason: cultural_note
  - marker: b
    text: 「田舎」は「畑」「農地」または「田園地帯」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「横木」と理解されることもあるが、ギリシア語本文は単に「十字架」としている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: 無理やり駆り出し
  rationale: 強制的な奉仕や徴用を表す語であり、単に頼んだのではないことを、現代日本語で自然かつ明確に示す。
- source_word: παράγοντά τινα
  choice: 通りかかった…シモン
  rationale: παράγονταの「通り過ぎる、通りかかる」という偶然的な状況を自然な日本語で表す。τιναの不定性は、初出の人物を導入する構文によって十分に伝わるため、「ある人」を重ねない。
- source_word: Σίμωνα Κυρηναῖον
  choice: キレネ人シモン
  rationale: 地名に由来する人物の呼称として、日本語聖書文体でも一般読者にも理解しやすい形を採用する。
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: 田舎から来て
  rationale: ἀγρόςには「畑」「農地」「田舎」の幅がある。ここでは市街地の外から来たという自然な読みを本文に置き、語義の幅は脚注で保持する。
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: すなわちアレクサンドロとルフォの父
  rationale: シモンを二人の息子との関係で特定する同格表現を明示的かつ自然に訳す。
- source_word: ἵνα ἄρῃ
  choice: 担がせた
  rationale: 強制を表す主動詞との関係を日本語の使役表現で自然に示し、目的の意味を保持する。ἄρῃはこの文脈では十字架を担うことを指す。
- source_word: σταυρὸν
  choice: 十字架
  rationale: 原文はより限定的な「横木」ではなくσταυρόςとするため、標準的で過度に限定しない「十字架」と訳す。
- source_word: αὐτοῦ
  choice: イエスの
  rationale: 日本語で「彼の」とするとシモンを指すように誤解されやすいため、直前までの文脈上の指示対象であるイエスを明示する。
theological_decisions:
- issue: シモンに課された行為の強制性
  choice: シモンは強制的に駆り出された
  alternative: シモンは単に頼まれた、または自発的に協力した
  rationale: ἀγγαρεύωは公権力による強制奉仕・徴発を表すため、その強制性を本文で明確にする。
- issue: シモンが担いだ物の具体性
  choice: 十字架
  alternative: 十字架の横木
  rationale: 歴史的再構成では横木と理解されることがあるが、原文のσταυρός自体はそこまで限定していないため、「十字架」とする。
- issue: 動作主体の明示
  choice: 兵士たちは
  alternative: 彼らは
  rationale: ギリシア語の動詞に主語名詞はないが、直前の文脈では兵士たちが明白な主体である。日本語の独立した節として分かりやすくするため明示し、新たな解釈は加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、受難記事にふさわしい簡潔で dignified な調子を保った。「無理やり駆り出し」で強制性を平易に示し、「すなわち」で同格関係を明瞭にした。
