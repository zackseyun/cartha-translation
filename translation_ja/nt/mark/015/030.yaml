  text: Save yourself[a], coming down from the cross!
translation:
  language: ja
  text: 十字架から降りて、自分を救ってみろ！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「十字架から降りることで、自分を救ってみろ！」または「自分を救え。十字架から降りて来い！」
    reason: καταβάςとσῶσονの関係には、手段・付随動作・並列的命令としての理解がありうるため。
lexical_decisions:
- source_word: σῶσον
  choice: 救ってみろ
  rationale: アオリスト命令法二人称単数。嘲りとしての命令なので、「救え」より自然に挑発の響きを表す「救ってみろ」とした。「救う」という救済語彙とのつながりも保つ。
- source_word: σεαυτόν
  choice: 自分を
  rationale: 再帰代名詞の対格で、σῶσονの直接目的語。自分自身に向けられた嘲りを明確に表す。
- source_word: καταβάς
  choice: 降りて
  rationale: καταβαίνωのアオリスト能動分詞。命令に伴う行為を表す圧縮された構文として、日本語では連用形「降りて」が自然である。手段、先行、並列命令のいずれかに限定せず、原文の関係の幅を保つ。
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: 十字架から
  rationale: 十字架から離れる方向を示す標準的な訳。受難記事の文脈に即してσταυρόςを「十字架」とする。
theological_decisions:
- issue: 分詞καταβάςと命令σῶσονの関係
  choice: 「十字架から降りて、自分を救ってみろ」とし、連用形で二つの動作を結ぶ。
  alternative: 「十字架から降りることで、自分を救ってみろ」／「自分を救え。十字架から降りて来い」
  rationale: ギリシア語は命令法にアオリスト分詞を続けた圧縮表現で、分詞は手段、付随動作、あるいは命令に近い働きとして理解しうる。「降りて」は自然な現代日本語でありながら、その関係を一義的に決めすぎず、嘲る者たちの挑戦を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。受難場面の尊厳を損なわない範囲で、原文の直接的な嘲りと挑発を「救ってみろ」によって表した。脚注記号は該当文末に置いた。
