  source_fidelity: ギリシア語の移動表現（φέρουσιν／ἐπὶ＋対格）、地名「ゴルゴタ」、およびその翻訳的説明を適切に反映している。「連れて行った」は、担い運んだことを必要以上に含意せず、物語の歴史的現在を自然な日本語の過去形で表している。αὐτόνを「イエス」と明示するのも文脈上妥当である。
