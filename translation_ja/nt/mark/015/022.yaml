  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: ja
  text: 人々はイエスをゴルゴタという場所へ連れて行った。訳すと「頭蓋骨の場所」である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: 連れて行った
  rationale: 目的地への移動を表す文脈であり、身体を担いで運んだとまでは限定しない。歴史的現在は、日本語の物語として自然な過去形で表した。
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: ゴルゴタという場所へ
  rationale: ἐπί＋対格が示す目的地への移動と、τόπονおよび固有名の双方を保ちつつ、同格関係を現代日本語で自然に表した。
- source_word: Γολγοθᾶν
  choice: ゴルゴタ
  rationale: 地名として慣用的な音写を用いた。
- source_word: μεθερμηνευόμενον
  choice: 訳すと
  rationale: 別の言語の表現に置き換えて説明する分詞の意味を、簡潔で自然な日本語にした。単なる語義説明よりも翻訳行為を明示している。
- source_word: Κρανίου Τόπος
  choice: 頭蓋骨の場所
  rationale: 属格構文を保ち、κρανίονを明瞭な現代語の「頭蓋骨」とした。日本語には冠詞がないため、英語の「a/the」に相当する区別は加えなかった。
- source_word: αὐτόν
  choice: イエスを
  rationale: 日本語で「彼を」とする曖昧さを避け、直前までの文脈上の指示対象を自然に明示した。新たな情報は加えていない。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、歴史的現在は自然な物語過去にした。「されこうべ」のような古風な語を避け、「頭蓋骨」として意味を直接伝えた。
