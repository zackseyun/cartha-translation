  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: ja
  text: また、女性たちも遠くから見ていた。その中には、マグダラのマリア、小ヤコブ[a]とヨセ[b]の母マリア、そしてサロメがいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小」は、年齢、体格、地位などを示す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 原文の名は「ヨセ」で、「ヨセフ」とは異なる形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: また、…も…いた
  rationale: δέとκαίの付加的な働きを、現代日本語の自然な物語文として表した。未完了時制は、続く「見守っていた」によって継続的な場面描写として示した。
- source_word: γυναῖκες
  choice: 女たち
  rationale: 文脈上、十字架刑を見ていた複数の女性を指すため、明快で一般的な表現を用いた。
- source_word: ἀπὸ μακρόθεν
  choice: 遠くから
  rationale: 空間的な隔たりを簡潔かつ自然に表し、意味を過度に限定しない。
- source_word: θεωροῦσαι
  choice: 見守っていた
  rationale: 継続して目を向けていたことを表す現在分詞を、文脈に即した自然な日本語にした。「見物する」という傍観的な響きは避けた。
- source_word: ἐν αἷς
  choice: その中には
  rationale: 先に述べた女たちの集団に属する人物を列挙する構文を自然に表した。
- source_word: Μαρία ἡ Μαγδαληνή
  choice: マグダラのマリア
  rationale: 日本語聖書で広く理解される地名由来の呼称を採用した。
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: 小ヤコブとヨセの母マリア
  rationale: μήτηρが二つの属格名を受ける関係を明示しつつ、日本語として簡潔にした。τοῦ μικροῦの意味の幅は脚注で保持した。
- source_word: Ἰακώβου
  choice: ヤコブ
  rationale: ギリシア語名Ἰάκωβοςに対応する、日本語新約聖書で定着した形を用いた。
- source_word: τοῦ μικροῦ
  choice: 小
  rationale: 年齢・体格・立場のいずれを指すか本文だけでは確定できないため、「年下」と断定せず、識別的な呼称として簡潔に訳し、曖昧さを脚注で説明した。
- source_word: Ἰωσῆτος
  choice: ヨセ
  rationale: Ἰωσῆςの属格形であり、Ἰωσήφ（ヨセフ）と同一表記にせず、原文の名前の形の違いを保持した。
- source_word: Σαλώμη
  choice: サロメ
  rationale: 日本語で定着した音写を用いた。
theological_decisions:
- issue: τοῦ μικροῦによるヤコブの識別
  choice: 本文では「小ヤコブ」とし、何を基準とする呼称かは断定しない
  alternative: 「年下のヤコブ」「小さいヤコブ」「小ヤコブ」
  rationale: μικρόςは年齢、体格、相対的重要性などを表し得る。本文はその基準を説明していないため、「年下」と解釈を固定せず、原文の曖昧さを保った。
- issue: Ἰωσῆτοςの固有名表記
  choice: ヨセ
  alternative: ヨセフ
  rationale: 本文のギリシア語はἸωσῆςの属格形で、通常のἸωσήφとは形が異なる。人物同定を不必要に調和させず、原文上の区別を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、物語として自然でありながら荘重さを保った。「見守っていた」は継続的な注視を示す。固有名は日本語読者に定着した形を基本としつつ、原文にあるヨセとヨセフの形の違いは保持した。
