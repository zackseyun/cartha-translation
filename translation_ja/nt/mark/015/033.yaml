  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: ja
  text: さて、第六時になると[a]、暗闇が全地[b]を覆い、第九時まで続いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時の時刻の数え方では、第六時から第九時までは、およそ正午から午後三時まで。
    reason: cultural_note
  - marker: b
    text: 「全世界」とも訳せる。ギリシア語の語は「地、地方」も「地上、世界」も意味しうる。
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ γενομένης ὥρας ἕκτης
  choice: さて、昼の十二時になると
  rationale: καίは物語の進行を示す自然な接続として「さて」とした。ユダヤ式の「第六時」は現代の一般読者に直ちに理解できる「昼の十二時」とし、時刻換算であることを脚注で明示した。属格独立構文の時間的意味は「なると」で表した。
- source_word: σκότος
  choice: 暗く
  rationale: σκότοςは「暗闇」を意味するが、ἐγένετοとの組み合わせを日本語で自然に表すため「暗くなり」とした。
- source_word: ἐγένετο
  choice: なり
  rationale: 出来事の生起を表すἐγένετοを、自然な日本語の「暗くなり」で表現した。
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: 全地が
  rationale: γῆには「地、地方」と「大地、地上」の幅がある。「全地」はその範囲を断定しすぎず、簡潔で聖書本文にふさわしい表現である。別訳を脚注に残した。
- source_word: ἕως ὥρας ἐνάτης
  choice: 午後三時まで続いた
  rationale: 「第九時」を現代時刻の午後三時に換算し、暗さがその時まで継続したことを日本語として明瞭に表した。
theological_decisions:
- issue: 十字架刑の際の暗闇におけるγῆの範囲
  choice: 全地
  alternative: 全世界／地上全体
  rationale: γῆの語義だけでは地域的な「地」と世界全体の「地上」のどちらかに確定できないため、本文では範囲を過度に限定も拡大もしない「全地」とし、別の理解を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔でありながら受難記事にふさわしい威厳を保った。古代の時刻表現は本文で現代時刻に換算し、原文表現を脚注に示した。
