  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: ja
  text: アリマタヤ出身のヨセフが来た。彼は名望のある議員で、自らも神の国を待ち望んでいた。勇気を出してピラトのもとへ入り、イエスの遺体を求めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: やって来た
  rationale: 先行するアオリスト分詞を、ヨセフの登場を示す自然な日本語の独立節として表した。
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: アリマタヤ出身の
  rationale: ἀπόが示す出身地を、現代日本語で明瞭に表した。
- source_word: εὐσχήμων
  choice: 人々から重んじられていた
  rationale: 社会的な名望や尊敬を表しつつ、「高位の」など本文以上に地位を限定する訳を避けた。
- source_word: βουλευτής
  choice: 議員
  rationale: 会議体の一員を指す語として簡潔に訳し、本文に明記されない「最高法院」を補わなかった。
- source_word: ὃς καὶ αὐτὸς
  choice: 自らも
  rationale: καὶ αὐτόςの強調を簡潔で自然な日本語に保持した。
- source_word: ἦν προσδεχόμενος
  choice: 待ち望んでいた
  rationale: 継続的で期待を伴う姿勢を、日本語として自然に表した。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 福音書で中心的な表現を標準的かつ直接的に訳した。
- source_word: τολμήσας
  choice: 勇気を出して
  rationale: 危険を承知で踏み切るという分詞の力を、後続動作との関係が明確な表現で示した。
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: ピラトのもとに入った
  rationale: εἰσῆλθενの「入る」とπρόςの方向性を保ち、ピラトの面前へ入ったことを自然に表した。
- source_word: ᾐτήσατο
  choice: 引き渡してほしいと願い出た
  rationale: 遺体の受け渡しを正式に求める文脈を明瞭にした。補った内容は脚注で示した。
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: イエスの遺体
  rationale: 死後の身体を指す文脈に即して「遺体」とした。
theological_decisions:
- issue: βουλευτήςが属する会議体
  choice: 本文では「議員」とし、最高法院とは特定しない
  alternative: 最高法院の議員
  rationale: 文脈上はユダヤの最高法院が有力だが、ギリシア語自体は会議体の名称を明記していないため。
- issue: τολμήσαςの力
  choice: 「勇気を出して」と明示する
  alternative: 「大胆にも」または「思い切って」
  rationale: ピラトへの申し出に踏み切る勇気を強調しつつ、不遜さを連想させうる表現を避けた。
- issue: σῶμαの訳
  choice: 遺体
  alternative: 体
  rationale: イエスの死後という直接の文脈を明瞭にするが、身体性を弱める神学的な言い換えは行っていない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ギリシア語の分詞が担う出来事の順序と、ヨセフの勇気への強調を保つため、短い独立節と連続する叙述に整えた。
