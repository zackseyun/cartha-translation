  source_fidelity: 「引き渡してほしいと願い出た」は、文脈上あり得る含意を本文に明示しており、αἰτέω（求める／願い出る）と「遺体を」の簡潔な表現より具体化されている。脚注で直訳を示していても、本文は補足なしに原文の表現を保つのが適切である。
  naturalness: 全体として明瞭な現代日本語だが、「ピラトのもとに入り」より「ピラトのもとへ入り」のほうが方向性を自然に表す。「議員」は現代の選挙による議員を連想し得るため、この文脈では「名望のある議員」として社会的評価の語義を明確にする。
  terminology: 「神の国」「ピラト」「イエスの遺体」は適切である。「名望のある議員」はεὐσχήμων βουλευτήςの尊敬される社会的地位と会議体の構成員という意味を保ち、会議体を最高法院と特定しない。
