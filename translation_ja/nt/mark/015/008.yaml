  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: ja
  text: 群衆は進み出て、ピラトが彼らのためにいつもしていたとおりにしてくれるよう、願い始めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆は上って来て、彼が彼らのためにいつもしていたとおりにしてくれるよう、願い始めた。」
    reason: ἀναβὰςの字義的な「上って」と、καθὼς ἐποίει αὐτοῖςの比較表現をより直訳的に示す。
lexical_decisions:
- source_word: ἀναβὰς
  choice: 上って来ると
  rationale: ἀναβαίνω のアオリスト分詞が表す先行動作を自然な日本語で示し、群衆がピラトのもとへ進み出た動きを保った。
- source_word: ὁ ὄχλος
  choice: 群衆
  rationale: 物語の場面に集まった多数の人々を指す、自然で標準的な訳語。
- source_word: ἤρξατο αἰτεῖσθαι
  choice: 願い始めた
  rationale: ἄρχομαι と不定詞の組み合わせを「始めた」とし、αἰτέω の要求・懇願の含みを文脈に即して「願う」で表した。
- source_word: καθὼς
  choice: いつものように
  rationale: 「ちょうど〜のように」という比較の働きと、後続する未完了過去が示す慣例性を、自然な日本語でまとめて表した。
- source_word: ἐποίει
  choice: してほしい
  rationale: 未完了過去の習慣的な行為を「いつものように」と合わせて示した。願いの内容を自然に表すため、原文で文脈上補われる「してほしい」という形にした。
- source_word: αὐτοῖς
  choice: （文脈に含意）
  rationale: 群衆自身のために行うという受益の意味は「してほしい」に文脈上含まれる。日本語で「彼らのために」を加えると、話者である群衆から不自然に距離を置いた表現になるため明示しなかった。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙事文としての品位を保った。「ピラト」は原文では代名詞も明示されていないが、日本語で願いの相手を明確にするため、直前の文脈から補った。
