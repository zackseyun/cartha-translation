  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: ja
  text: 兵士たちはイエスを中庭の中、すなわち総督官邸へ連れて行き、部隊全員を呼び集めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部隊」はローマ軍の軍事単位（コホート）を指す。ここでは、ローマの権威のもとに集められた兵士たちを意味する。
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ στρατιῶται
  choice: 兵士たちは
  rationale: δέはここでは強い対比より物語の進行を示すため、日本語では無理に接続語を加えず、自然な叙述とした。στρατιῶταιは一般的な「兵士」と訳した。
- source_word: ἀπήγαγον αὐτὸν
  choice: イエスを…連れて行き
  rationale: ἀπάγωの移動させる意味を自然な日本語で表した。代名詞は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: ἔσω τῆς αὐλῆς
  choice: 中庭の内側
  rationale: ἔσω＋属格の「内側へ」という空間的意味を保ち、αὐλήを「中庭」とした。
- source_word: ὅ ἐστιν πραιτώριον
  choice: すなわち総督官邸
  rationale: ローマの行政・軍事用語πραιτώριονを、現代の一般読者に伝わる機能的な訳語で示した。関係代名詞の説明句は「すなわち」で自然に表した。
- source_word: συγκαλοῦσιν
  choice: 呼び集めた
  rationale: 複合語の「共に呼び寄せる」という意味を反映した。ギリシア語は歴史的現在だが、日本語の自然な物語時制に合わせて過去形とした。
- source_word: ὅλην τὴν σπεῖραν
  choice: 全部隊
  rationale: σπεῖραはローマ軍の「歩兵隊（コホルス）」を指し得るが、ここでは実際の定員全員を必ず意味するとは限らないため、本文では自然な「全部隊」とし、歴史的背景を注で補った。
