base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: ja
  text: そして、イエスとともに二人の強盗[a]を十字架につける。一人はイエスの右に、もう一人は左に。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「盗賊」。政治的な含意をもつ語と理解する場合は、「反乱者」と訳す可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: イエスとともに
  rationale: σύν＋与格は随伴を表す。日本語では代名詞「彼」よりも指示対象の「イエス」を明示するほうが自然で、意味も変えない。
- source_word: σταυροῦσιν
  choice: 十字架につける
  rationale: 現在・能動・直説法三人称複数。マルコの歴史的現在の生き生きとした叙述を保つため、現在形で訳す。主語は動詞語尾に含まれるが、文脈上の執行者を一般的な「人々」で表した。
- source_word: δύο λῃστάς
  choice: 二人の強盗
  rationale: λῃστήςは強盗、盗賊、略奪者を指し、場合によっては政治的な反乱者の含みも持ち得る。本文では広く通用する「強盗」とし、より限定的な可能性は脚注に残す。
- source_word: ἕνα ἐκ δεξιῶν
  choice: 一人をイエスの右に
  rationale: ἐκ δεξιῶνはこの位置関係では右側を意味する。「右に」が明快で自然な日本語である。
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: もう一人を左に
  rationale: εὐώνυμοςはここでは右と対になる左側を示す。αὐτοῦは並行する左右双方に関係するため、前半で「イエスの」を明示し、後半では自然な日本語として省略した。
theological_decisions:
- issue: 十字架刑の記事における λῃσταί の訳語
  choice: 強盗
  alternative: 盗賊、または政治的含意を認めるなら反乱者
  rationale: この語は暴力的な強盗や盗賊を表し、文脈によっては反乱活動と重なることもある。しかし、この節だけでは政治的な「反乱者」に限定できないため、本文は広い意味の「強盗」とし、別の可能性を脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。マルコの歴史的現在を現在形で保った。「一人を……もう一人を……」により原文の対句的な配置を自然に表現した。
