  text: καὶ ἤρξαντο ἀσπάζεσθαι αὐτόν· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: ja
  text: そして彼らはイエスに敬礼し[a]始めた。「ユダヤ人の王[b]よ、万歳！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「挨拶し」。ギリシア語の動詞は普通の挨拶にも使われるが、ここでは王への正式な礼を装った嘲弄の意味を帯びている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ユダヤ地方の人々の王」。この語は「ユダヤ人」と「ユダヤ地方の人」のどちらも指し得るが、受難物語におけるこの称号では「ユダヤ人」が標準的な理解である。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: マルコの簡潔な叙述の連続を保ちつつ、現代日本語として自然な接続とした。
- source_word: ἤρξαντο
  choice: 始めた
  rationale: 不定詞を伴う開始の意味をそのまま明示し、場面の進行を保った。
- source_word: ἀσπάζεσθαι
  choice: 敬礼し
  rationale: 通常は「挨拶する」を意味し得るが、ここでは兵士たちが王への礼を装ってあざける行為なので、「敬礼する」が形式的で演技的な含みをよく伝える。
- source_word: Χαῖρε
  choice: 万歳
  rationale: この語は挨拶として用いられる命令形だが、ここでは王への嘲弄的な歓呼であるため、日本語では「万歳」が王的な称揚を装う調子を自然に表す。
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: ユダヤ人の王よ
  rationale: 呼格を「王よ」で表し、受難物語で定着した称号「ユダヤ人の王」を採用した。Ἰουδαῖοςには地域的な「ユダヤ地方の人」という幅もあるため、脚注で示した。
- source_word: αὐτόν
  choice: イエスに
  rationale: 日本語で指示対象を明確にし、単独の節としても読みやすくするため、文脈上の指示対象を固有名で表した。
theological_decisions:
- issue: イエスへの嘲弄的な王礼を、王としての含意を弱めずに表すこと
  choice: 「敬礼」と「ユダヤ人の王よ、万歳！」を用い、王への正式な礼をまねた嘲弄として訳す
  alternative: 「ごきげんよう、ユダヤ人の王よ！」と訳す
  rationale: 兵士たちはイエスの王権を認めて礼をしているのではなく、それを演じてあざけっている。「万歳」はその王的な歓呼と皮肉を伝える一方、本文にない神学的説明は加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、兵士たちの形式的な王礼と嘲弄の調子を保持した。「王よ」で呼びかけを明示し、全体は簡潔で荘重な聖書本文の文体とした。
