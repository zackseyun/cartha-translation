base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: ja
  text: そして人々はイエスに、没薬を混ぜたぶどう酒を差し出していた[a]が、イエスはそれを受け取らなかった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「与えていた」。文脈によっては「与えようとしていた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では、関係代名詞を用いてイエスを受け直し、「しかし彼は受け取らなかった」と続ける。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: 差し出した
  rationale: 未完了過去は進行中または試みられた行為を表し得るが、この文脈では、飲み物を与えようとしたことを自然な現代日本語で示す「差し出した」が適切である。字義的な「与えていた」より明瞭であり、実際に受け取ったとの誤解も避けられる。
- source_word: ἐσμυρνισμένον οἶνον
  choice: 没薬を混ぜたぶどう酒
  rationale: σμυρνίζωの分詞が示す、没薬を加えて調製したぶどう酒を、内容物を明示する自然な日本語で表した。
- source_word: ὃς δὲ
  choice: しかし、イエスは
  rationale: ὃςは形式上は関係代名詞だが、ここではイエスを受け直す表現として機能する。δέの穏やかな逆接を「しかし」で示し、日本語では指示対象を明確にするため「イエスは」とした。
- source_word: οὐκ ἔλαβεν
  choice: それを受け取らなかった
  rationale: λαμβάνωの基本的な意味である「取る／受け取る」のうち、差し出された飲み物に応じなかったことを自然に表す「受け取らなかった」を選び、省略された目的語を「それ」と補った。
theological_decisions:
- issue: イエスが飲み物を拒んだ理由
  choice: 拒否の事実だけを記し、理由は本文に加えない。
  alternative: 苦痛を和らげる麻酔性の飲み物を拒んだ、または慣例的な飲み物を別の理由で断った、と説明する。
  rationale: ギリシア語本文は、没薬を混ぜたぶどう酒が差し出され、イエスが受け取らなかったことだけを述べる。拒否の目的や飲み物の効能を翻訳本文に持ち込まず、解釈上の余地を保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「ワイン」より聖書本文として落ち着きのある「ぶどう酒」、「ミルラ」より一般的な聖書用語である「没薬」を採用した。
