source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: ja
  text: 朝早く、祭司長たちはすぐに、長老たち、律法学者たち、および最高法院全体[a]と協議を行った。それからイエスを縛り、連行して、ピラトに引き渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「最高法院」は「サンヘドリン」とも呼ばれる、ユダヤ人の最高議会を指す。
    reason: συνέδριονの歴史的指示対象と、広く知られた別称を中立的に示すため。
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐ
  rationale: マルコに特徴的な、出来事が間を置かず進む切迫感を自然な現代日本語で表した。
- source_word: πρωῒ
  choice: 朝早くなると
  rationale: 早朝という時を明確にしつつ、εὐθὺςとのつながりを自然に表した。
- source_word: συμβούλιον ποιήσαντες
  choice: 協議を行った
  rationale: 直訳的な「協議を作る」を避け、正式に相談・審議したという慣用句の意味を保った。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 当時の祭司階級の指導者たちを指す標準的な訳語であり、複数の現職大祭司を意味するとの誤解を避ける。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: 年齢だけでなく、共同体における公的な指導者という役割を表す。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 単なる筆記者ではなく、律法の解釈と教育に携わった者たちであることが現代の読者に明確になる。
- source_word: ὅλον τὸ συνέδριον
  choice: 最高法院全体
  rationale: ユダヤの統治・司法機関を指す歴史的な用語として、意味の分かる日本語を本文に用いた。慣用的な音写は脚注に示した。
- source_word: δήσαντες
  choice: 縛って
  rationale: 連行に先立ってイエスを拘束したという動作を簡潔かつ直接的に表した。
- source_word: ἀπήνεγκαν
  choice: 連れ出し
  rationale: 拘束下でその場から移送したことを自然に表し、物理的に担いだとの不要な含みを避けた。
- source_word: παρέδωκαν
  choice: 引き渡した
  rationale: ローマ総督の権限下へ身柄を正式に移したという司法・拘束上の意味を保った。
- source_word: Πιλάτῳ
  choice: ピラト
  rationale: 日本語聖書と歴史叙述で定着している人名表記を用いた。
theological_decisions:
- issue: συνέδριονが指す機関
  choice: 本文では「最高法院」と訳した。
  alternative: 「サンヘドリン」または「議会」
  rationale: 特定の教派的解釈を加えず、ユダヤの統治・司法機関であることを一般読者に伝えるため。「全体」は原文のὅλονに従って保持した。
- issue: 受難物語におけるπαρέδωκανの含意
  choice: 司法的・拘束上の移管として「引き渡した」とした。
  alternative: 「渡した」「売り渡した」
  rationale: この節が直接述べるローマ当局への身柄の移管を表しつつ、「売り渡す」のような金銭的または神学的含意を本文へ持ち込まないため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、受難記事にふさわしい簡潔で厳粛な調子を保った。原文の連続する分詞構文は、日本語で動作の順序が明確になるよう二文に分けた。
