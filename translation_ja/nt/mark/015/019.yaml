source:
  edition: SBLGNT
  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: ja
  text: そして彼らは、葦でイエスの頭を何度も打ち、彼につばを吐きかけ、ひざまずいて彼にひれ伏していた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「彼を拝んでいた」。ギリシア語の動詞は、「ひれ伏す」「敬意を表す」「礼拝する」という意味になり得る。ここでは兵士たちが、王に対する敬礼を嘲弄として演じている。
    reason: προσκυνέωの語義の幅と、この文脈における嘲弄的な用法を示すため。
lexical_decisions:
- source_word: ἔτυπτον
  choice: 何度もたたき
  rationale: 未完了過去形が示す反復的・継続的な動作を自然な日本語で表した。「打ち続け」も可能だが、継続だけでなく反復も明確にするため「何度も」とした。
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: イエスの頭
  rationale: 属格代名詞による所有を自然な日本語にした。単独の節としても指示対象が明確になるよう「彼の頭」ではなく「イエスの頭」とした。
- source_word: καλάμῳ
  choice: 葦で
  rationale: κάλαμοςの基本義を保ち、受難物語に登場する葦とのつながりも維持した。「杖」とすると材質と物語上の連続性が弱まる。
- source_word: ἐνέπτυον αὐτῷ
  choice: つばを吐きかけ
  rationale: 与格を伴う表現の意味を自然に伝えた。前の「何度も」が一連の反復的な虐待にも及ぶ文脈となり、未完了過去形の継続性を保っている。
- source_word: τιθέντες τὰ γόνατα
  choice: ひざまずいて
  rationale: 字義的には「ひざを置いて」だが、これはひざまずく動作を表す慣用表現であるため、明瞭で自然な訳とした。
- source_word: προσεκύνουν αὐτῷ
  choice: 彼を拝んでいた
  rationale: προσκυνέωが表し得る礼拝・拝礼・ひれ伏す行為の幅を残しつつ、未完了過去形の継続性を表した。兵士たちの行為が嘲弄であることは文脈と脚注で明らかにし、本文では語の神学的含みを消し去らないようにした。
theological_decisions:
- issue: 嘲弄の文脈における προσκυνέω の訳
  choice: 拝んでいた
  alternative: 彼にひれ伏していた／彼に敬意を表していた
  rationale: この動作は兵士たちによる王への敬礼の嘲弄であり、真摯な礼拝ではない。しかし、原語は文脈により「ひれ伏す」「敬意を表す」「礼拝する」を意味し得るため、本文では「拝む」を用いて語義上の緊張を残し、意図が嘲弄であることを脚注で説明した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、受難記事にふさわしい簡潔で格調ある調子を保った。反復的な虐待は「何度も」と未完了形「拝んでいた」で表現した。
