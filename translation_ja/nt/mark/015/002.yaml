  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: ja
  text: ピラトはイエスに尋ねた。「あなたはユダヤ人の王なのか。」イエスは答えた[a]。「あなたがそう言っている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたが言っている」。この短い返答は、問いの表現をピラト自身に返す言い方であり、明示的な全面肯定とも明示的な否定とも言い切れない含みを残している。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 単に質問したことを自然に表し、「尋問した」のように司法的な強さを原文以上に加えない。
- source_word: Σὺ εἶ
  choice: あなたは…なのか
  rationale: 明示された代名詞の焦点を「あなたは」で示し、直接疑問として自然な日本語にした。
- source_word: βασιλεὺς
  choice: 王
  rationale: 王権を表す通常の意味を保ち、ピラトの前に持ち出された政治的訴えの性格を明確にする。
- source_word: Ἰουδαίων
  choice: ユダヤ人
  rationale: 「ユダヤ人の王」という受難物語における定着した政治的称号に合う。「ユダヤ地方の人々」も語義上考えられるが、この文脈では不自然。
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: イエスは答えた
  rationale: 分詞と歴史的現在を、日本語の物語として自然な過去形にまとめた。話者を明示して指示対象の曖昧さを避ける。
- source_word: Σὺ λέγεις
  choice: あなたがそう言っています
  rationale: 直訳的な「あなたが言う」を自然な日本語にしつつ、全面的な肯定とも否定とも断定しない簡潔で含みのある応答を保つ。
theological_decisions:
- issue: イエスの返答 Σὺ λέγεις の含意
  choice: 「あなたがそう言っています」
  alternative: 「そのとおりだ」／「あなたが言う」
  rationale: 原文には明示的な「はい」がなく、ピラトの表現をそのまま相手に返すような抑制と曖昧さがある。無条件の肯定にも否定にも解消しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「おまえ」などの攻撃的な二人称は避け、法廷場面でも過度に古風な表現を用いなかった。原文にない敬称は加えず、ピラトの問いとイエスの簡潔な応答の緊張感を保った。
