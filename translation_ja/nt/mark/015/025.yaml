lexical_decisions:
- source_word: Ἦν
  choice: であった
  rationale: 未完了過去形の時刻を示す用法を、文脈設定として自然な日本語で表した。
- source_word: δὲ
  choice: そして
  rationale: 強い逆接ではなく、物語を進める緩やかな接続を示すため。「さて」も可能だが、本文では簡潔な接続とした。
- source_word: ὥρα τρίτη
  choice: 第三時
  rationale: 古代の時刻表現を本文に保持し、現代時刻への換算は脚注に委ねた。
- source_word: ἐσταύρωσαν
  choice: 十字架につけた
  rationale: 十字架刑に処する行為を表す、日本語聖書文体として明確で自然な表現。
- source_word: αὐτόν
  choice: イエスを
  rationale: 原文は代名詞「彼を」だが、日本語では行為者の複数代名詞と目的語の代名詞が連続すると指示関係がやや捉えにくいため、文脈上の指示対象を明示した。
theological_decisions:
- issue: 時刻表現と受難記事の年代順との関係
  choice: 本文では「第三時」を保持する。
  alternative: 「午前九時ごろ」と訳す。
  rationale: 原文の古代的な時刻表示をそのまま伝え、現代時刻への換算や他の記事との調和を本文で決着させないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「第三時」は原文の文化的表現を保つために用い、脚注で補足した。
