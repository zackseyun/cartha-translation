source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: ja
  text: 彼らはイエスをあざけった後、紫の衣[a]を脱がせ、イエス自身の服を着せた。それから、イエスを十字架につけるために、外へ連れ出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「紫のもの」。文脈上、紫色の衣服を指す。「紫の上着」とも訳せる。
    reason: 原語は衣服の種類を明示していないため。
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: あざけった
  rationale: 侮辱を込めて嘲笑する行為を表す。現代の一般読者に明瞭で、場面の厳粛さにも合う。
- source_word: τὴν πορφύραν
  choice: 紫の衣
  rationale: ギリシア語は字義的には「紫のもの」とだけ述べ、文脈上、衣服を指す。「衣」で補いながら、長衣や外套とまでは特定しない。
- source_word: ἐξέδυσαν αὐτόν
  choice: 脱がせ
  rationale: 本人が脱いだのではなく、彼らがイエスから衣を取り去ったという他動的な動作を自然に表す。
- source_word: τὰ ἱμάτια τὰ ἴδια
  choice: イエス自身の服
  rationale: ἱμάτιαを現代的な「服」とし、τὰ ἴδιαの「本人のもの」という強調を明示する。
- source_word: ἐξάγουσιν
  choice: 外へ連れ出した
  rationale: 物語中の歴史的現在形だが、日本語では前後に合わせた過去形が自然である。「連れ出した」は拘束下で外へ移動させる動作を的確に表す。
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: イエスを十字架につけるために
  rationale: ἵνα節の目的を自然な日本語で明示し、σταυρόωの具体的な処刑方法を保つ。
theological_decisions:
- issue: 十字架刑前のイエスの屈辱についての物語描写
  choice: あざけり、紫の衣を脱がせ、本人の服を着せ、十字架刑のために連れ出す一連の行為を、解釈的な加筆なしに直接描く。
  alternative: 王権への嘲弄や贖罪的意味を本文中で説明的に補う。
  rationale: 原文はここで出来事を簡潔に叙述しているため、含意を教理的説明へ展開せず、屈辱の様子が行為そのものから伝わる訳とする。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「あざける」「十字架につける」など聖書叙述にふさわしい dignity を保った。歴史的現在は日本語の自然な物語時制に合わせて過去形とした。
