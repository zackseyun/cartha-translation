source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: ja
  text: そして第九時に[a]、イエスは大声で叫ばれた。「エロイ、エロイ、レマ、サバクタニ」。これは訳すと、「わが神、わが神、なぜ私をお見捨てになったのですか」[b][c]という意味である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「第九時」は、現在の時刻では午後三時ごろ。
    reason: historical_context
  - marker: b
    text: この言葉は詩篇22篇1節を響かせている。
    reason: cross_reference
  - marker: c
    text: または「何のために私をお見捨てになったのですか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: 第九時ごろ
  rationale: 原文の時刻表現を保ちつつ、与格句の時間的意味を自然な日本語で表した。当時の数え方では午後三時ごろに当たることを脚注で補う。
- source_word: ἐβόησεν … φωνῇ μεγάλῃ
  choice: 大声で叫ばれた
  rationale: 動詞と様態句を一体として自然に訳し、声を張り上げた強さを保持した。イエスへの通常の敬意を示すため主体敬語を用いたが、発言内容は弱めていない。
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: エロイ、エロイ、レマ、サバクタニ
  rationale: マルコがセム語の言葉を残した後で訳を示す構成をそのまま保った。レマはSBLGNTのλεμάに従い、異読ラマは脚注に示した。
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: これは訳すと、…という意味である
  rationale: セム語句に続く説明的な翻訳であることが、現代日本語で明瞭に伝わる表現とした。
- source_word: εἰς τί
  choice: なぜ
  rationale: 字義的には目的・理由を問う形だが、この文脈では理由を問う日本語の「なぜ」が最も自然であり、詩篇の響きも保つ。「何のために」という可能性は脚注に示した。
- source_word: ἐγκατέλιπές με
  choice: 私をお見捨てになったのですか
  rationale: ἐγκαταλείπωの見捨てる・置き去りにする意味と、詩篇22篇1節を思わせる厳粛な響きを保持した。完了した行為を問うアオリストを自然な日本語の過去形で表した。
theological_decisions:
- issue: イエスの叫びと詩篇22篇1節との関係
  choice: 見捨てられたことを問う直接的な叫びとして訳し、詩篇との関連は脚注で示す
  alternative: 本文で詩篇の引用であることや、この叫びの神学的意味を説明する
  rationale: 本文は叫びそのものとその翻訳を提示しており、父と子の関係についての解釈を付加していない。したがって、その深刻さと聖書的響きを保ちながら、神学的緊張を説明で解消しない。
- issue: セム語の発言の扱い
  choice: 音写を本文に残し、その直後に日本語訳を置く
  alternative: 音写を省いて日本語の意味だけを記す、またはマタイの「エリ、エリ」に合わせる
  rationale: マルコ自身が発言を音写してから翻訳しているため、その二段構成を保ち、他の福音書への調和を避けた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、受難記事にふさわしい厳粛さを保った。「わが神」は日常語の「私の神」より詩篇引用の響きを伝えやすく、過度に古風にならない範囲で採用した。
