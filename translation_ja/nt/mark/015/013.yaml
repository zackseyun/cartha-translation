  yaml_path: translation/nt/mark/015/013.yaml
  text: But they cried out again, “Crucify him!”
translation:
  language: ja
  text: しかし、人々は再び叫んだ。「十字架につけろ！」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: 人々は
  rationale: 定冠詞が名詞的に用いられ、直前から話題となっている集団を指す。日本語では文脈上「彼らは」も可能だが、「人々は」とすることで指示対象を自然に示しつつ、「群衆」と限定しすぎることを避けた。
- source_word: δὲ
  choice: しかし
  rationale: ピラトの直前の問いに対する対照的な応答を示す。弱い逆接を自然な現代日本語で表した。
- source_word: πάλιν
  choice: 再び
  rationale: 叫びが繰り返されたことを簡潔かつ明確に表す。
- source_word: ἔκραξαν
  choice: 叫んだ
  rationale: κράζωの大声で叫ぶという意味を、簡潔で自然な日本語にした。
- source_word: Σταύρωσον
  choice: 十字架につけろ
  rationale: 二人称単数の能動命令形で、ピラトに向けた直接的で激しい要求である。使役的な「十字架につけさせろ」ではなく、原文の直接命令を保った。
- source_word: αὐτόν
  choice: （日本語では省略）
  rationale: イエスを指す直接目的語だが、日本語では文脈から明白であり、「彼を」を加えるより、省略したほうが叫びとして自然で力強い。
theological_decisions: []
