lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: マルコの物語をつなぐ接続詞。日本語では単純な「そして」よりも、場面の進行を自然に示す「さて」が適切。
- source_word: ἤδη ὀψίας γενομένης
  choice: すでに夕方になっていた
  rationale: 属格絶対構文の時間的背景とἤδηの「すでに」を保ち、後続節につながる自然な現代日本語とした。
- source_word: ἐπεὶ
  choice: ので
  rationale: ここでは後続する行動の事情・理由を示す。文末を次節へ開いたまま、因果関係を自然に表す。
- source_word: παρασκευή
  choice: 備えの日
  rationale: 一般的な準備ではなく、安息日に先立つ特定の日を指す慣用的な暦表現。説明句を伴うため、過度に意訳せず訳した。
- source_word: ὅ ἐστιν
  choice: すなわち
  rationale: 読者に語義を説明する定型句として、明瞭で品位ある現代日本語。
- source_word: προσάββατον
  choice: 安息日の前日
  rationale: 語の平明な意味を直接示し、「金曜日」と限定する解釈を本文へ持ち込まない。
