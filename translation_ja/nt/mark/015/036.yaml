  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: ja
  text: すると、一人が走って来て、スポンジに酸味のあるぶどう酒を含ませ、それを葦に取り付け、イエスに飲ませていた。そして言った。「そのままにしておけ[a]。エリヤがイエスを降ろしに来るかどうか、見てみよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「待て」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: 駆け寄り
  rationale: アオリスト分詞が物語上の最初の動作を示す。「走って」よりも、イエスのもとへ急いで近づく場面を自然な日本語で表す。
- source_word: τις καὶ
  choice: ある人が
  rationale: τιςは特定されていない一人を指す。καίはこの語順では日本語に独立して訳す必要がなく、「ある人が」で自然に表せる。
- source_word: γεμίσας σπόγγον ὄξους
  choice: 酸いぶどう酒を海綿に含ませ
  rationale: ὄξοςは酸味のある安価なぶどう酒を指し、現代日本語の調味料としての「酢」という誤解を避ける。「海綿に含ませ」は液体を吸わせる動作を自然に表す。
- source_word: περιθεὶς καλάμῳ
  choice: それを葦の棒に付けて
  rationale: κάλαμοςの「葦」を保ちつつ、道具として用いることが分かるよう「葦の棒」とした。περιτίθημιの取り付ける動作を「付けて」で表す。
- source_word: ἐπότιζεν αὐτόν
  choice: イエスに飲ませようとしながら
  rationale: 未完了過去の継続的・試行的な相を反映し、単に飲ませ終えたと断定しない。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: Ἄφετε
  choice: そのままにしておけ
  rationale: ἀφίημιの命令形が持つ「手を出さずにおく、放っておく」という意味を保つ。文脈上「待て」とも理解できるため、脚注で代案を示す。
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: エリヤが…来るかどうか、見てみよう
  rationale: 勧奨の接続法とεἰ節を自然に表し、ἔρχεταιの現在形が帯びる切迫感を「来る」で保つ。
- source_word: καθελεῖν αὐτόν
  choice: 降ろしに
  rationale: 十字架という高い所からイエスを下ろすことを指す。日本語では目的語が文脈上明らかなため省略して自然にした。
theological_decisions:
- issue: Ἄφετεが誰に何をやめるよう命じる表現か
  choice: 「そのままにしておけ」とし、イエスに手を出さず成り行きを見る命令として訳す
  alternative: 「待て」とし、周囲の人々に一時中断を求める表現として訳す
  rationale: ἀφίημιの基本的な意味を本文に残しつつ、文脈上可能な慣用的理解を脚注に示して曖昧さを保存する。
- issue: ἐπότιζενの未完了過去の含意
  choice: 「飲ませようとしながら」として試行・進行中の動作を表す
  alternative: 「飲ませた」として完結した出来事として自然に訳す
  rationale: 原文の未完了相を尊重し、実際に飲み終えたかどうかを本文で不必要に確定しない。
translation_notes:
  register: 明瞭で現代的ながら、受難記事にふさわしい節度ある文体とした。「海綿」「葦の棒」は場面を具体的に伝え、「酸いぶどう酒」はὄξοςを現代の調味用の酢と誤解させない表現である。
