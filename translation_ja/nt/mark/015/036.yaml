revisions:
- from: すると、ある人が駆け寄り、酸いぶどう酒を海綿に含ませ、それを葦の棒に付けて、イエスに飲ませようとしながら言った。「そのままにしておけ[a]。エリヤが降ろしに来るかどうか、見てみよう。」
  to: すると、一人が走って来て、スポンジに酸味のあるぶどう酒を含ませ、それを葦に取り付け、イエスに飲ませていた。そして言った。「そのままにしておけ[a]。エリヤがイエスを降ろしに来るかどうか、見てみよう。」
  rationale: 原文の動作連鎖とἐπότιζενの未完了相を保つため、「走って来て」「飲ませていた」とした。「そのままにしておけ」はἌφετεの基本義を保ち、慣用的に可能な「待て」は脚注で示す。καθελεῖνの目的語は原文にあるため、日本語でも「イエスを」を明示した。
