  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: ja
  text: イエスの正面に立っていた百人隊長は、イエスがこのように息を引き取ったのを見て、言った。「本当に、この人は神の子であった。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の子」は、不定的に「神に属する者」または質的に「神的な者」と理解することもできる。しかし、マルコ福音書の文脈では、「神の子」という称号としての意味を持つ可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: 見て
  rationale: アオリスト分詞を主節に先立つ状況として自然に表した。δέの弱い接続は、日本語では文脈と「が」で担わせた。
- source_word: κεντυρίων
  choice: 百人隊長
  rationale: ローマ軍の役職を表す、日本語聖書で定着し一般にも理解可能な訳語。
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: イエスの正面に立っていた
  rationale: παρεστηκώςの継続した立位と、ἐξ ἐναντίαςの向かい合う位置関係を明瞭に表す。代名詞は日本語で参照先が曖昧になるのを避けるため「イエス」とした。
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: イエスがこのように息を引き取られたのを
  rationale: ἐκπνέωの呼吸と死のイメージを自然な日本語「息を引き取る」で保ち、οὕτωςも「このように」と明示した。尊敬表現は日本語の自然で品位ある叙述に適う。
- source_word: Ἀληθῶς
  choice: 本当に
  rationale: 発言の確信を示す副詞として、現代の読者に明快で荘重さも失わない。
- source_word: οὗτος ὁ ἄνθρωπος
  choice: この方
  rationale: 直訳「この人」より発話として自然であり、イエスを指す表現として品位を保つ。性別は文脈上明らかで、原文の指示性を維持する。
- source_word: υἱὸς θεοῦ
  choice: 神の子
  rationale: 冠詞のないギリシア語が持ちうる質的・不定的な含みを過度に限定せず、同時にマルコ福音書における称号としての響きを保つ。日本語では冠詞がないため「神の子」が自然。
- source_word: ἦν
  choice: であった
  rationale: 未完了過去形の時制をそのまま過去として表し、発言の荘重な調子を保つ。
theological_decisions:
- issue: 百人隊長の言葉における υἱὸς θεοῦ の意味
  choice: 神の子
  alternative: 神の子の一人／神的な者
  rationale: 無冠詞表現は質的または不定的に理解できる一方、マルコ福音書全体では重要なキリスト論的称号として響く。本文では日本語として自然で両面を担いうる「神の子」を採り、別解を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、十字架場面にふさわしい品位を保った。「百人隊長」「息を引き取る」は広く理解される定着表現。主語の連続による曖昧さを避けるため、代名詞の一部を「イエス」と明示した。
