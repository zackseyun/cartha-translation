  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: ja
  text: 祭りのたびに、ピラトは、人々が願い出る囚人を一人釈放していた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: 祭りのたびに
  rationale: κατά＋対格を習慣的な時を表す句と捉え、未完了過去形の反復的用法と合わせて「祭りのたびに」とした。δέは軽い接続であり、日本語では明示しないほうが自然である。文脈上の祭りは過越祭だが、本文のἑορτή自体は一般に「祭り」を意味するため、限定を加えなかった。
- source_word: ἀπέλυεν
  choice: 釈放していた
  rationale: 未完了過去形が示す過去の習慣的行為を「していた」で表した。「釈放する」は司法的文脈に適する。
- source_word: αὐτοῖς
  choice: 人々に対する行為として文全体に反映
  rationale: 受益者を示す与格である。日本語で「人々のために」を加えると不自然かつ重くなるため、「人々が願い出る囚人を釈放する」という構文の中で受益関係を自然に伝えた。
- source_word: ἕνα δέσμιον
  choice: 囚人を一人
  rationale: ἕναの数を明示し、司法的拘束下にある者を表すδέσμιονを自然な現代日本語の「囚人」とした。
- source_word: ὃν παρῃτοῦντο
  choice: 人々が願い出る
  rationale: παραιτέομαιの「求める、願い出る」という意味を、権力者に囚人の釈放を求める場面に合う「願い出る」で表した。主節の習慣性に従い、連体節は現在形で自然に表現した。
theological_decisions: []
