  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: ja
  text: というのも、祭司長たちがねたみ[a]のためにイエスを引き渡していたことを、ピラトは知っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ねたみに駆られて」または「嫉妬のために」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: 知っていた
  rationale: 未完了過去が表すピラトの継続的または確立した認識を、自然な日本語で示す。
- source_word: γὰρ
  choice: というのも……からである
  rationale: 前節の内容に理由を添える説明的な接続を明確に表す。
- source_word: ὅτι
  choice: ……ことを
  rationale: ピラトが認識していた内容を導く補文として自然に訳す。
- source_word: διὰ φθόνον
  choice: ねたみのために
  rationale: 対格を伴う διά の原因・動機の意味を保ち、φθόνοςを現代日本語で明瞭に表す。
- source_word: παραδεδώκεισαν
  choice: 引き渡した
  rationale: 司法的な文脈に合う訳語を用いる。ギリシア語の過去完了が示す先行性は、日本語では文脈と「ことを」によって十分伝わる。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 指示対象を明確にして、単独節としても読みやすくする。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 福音書における指導的な祭司権威者たちを指す標準的で自然な訳語。
theological_decisions:
- issue: 祭司長たちに帰される動機
  choice: 彼らがイエスを引き渡した動機を「ねたみ」とする
  alternative: 「嫉妬」とする
  rationale: 本文はピラトの認識としてその動機を述べている。解釈を強めず、φθόνοςの通常の意味範囲をそのまま保つ。
translation_notes:
  register: 明瞭で現代的ながら品位ある文体。「というのも……からである」により γάρ の説明的機能を保ち、主語の「ピラト」と目的語の「イエス」を補って単独でも理解しやすくした。
