  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: ja
  text: 「メシア、イスラエルの王よ、今、十字架から降りてみろ。そうすれば、見て信じよう。」一緒に十字架につけられていた者たちも、イエスをののしっていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「侮辱していた」「あざけっていた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名のような用法ではなく、王として油を注がれた者を指す称号であり、嘲りの文脈でもその意味が前面に出ているため。
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: イスラエルの王
  rationale: 属格を伴う称号を簡潔かつ自然に表し、王権をめぐる嘲りを保つため。
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: 今、十字架から降りてみろ
  rationale: 三人称命令の挑発的な力を、現代日本語で自然な嘲りの命令として表した。「今」により切迫した挑戦も保持した。
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: そうすれば、見て信じよう
  rationale: ἵνα節がこの文脈で表す、条件めいた目的・結果の嘲弄的な言い回しを自然に伝え、「見る」と「信じる」の連結を保った。
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: 一緒に十字架につけられていた者たち
  rationale: 共に磔刑にされた者たちを指す完了受動分詞の状態的な意味を、過度な補足なしに明確に表した。
- source_word: ὠνείδιζον αὐτόν
  choice: イエスをののしっていた
  rationale: 未完了過去の継続性を「ていた」で表し、ὀνειδίζωの強い非難・侮辱の意味を一般読者に明瞭な語で示した。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: καί
  choice: も
  rationale: 先に述べられた嘲りに加えて、共に十字架につけられた者たちも同じ行為をしたことを示す。
theological_decisions:
- issue: 嘲りの文脈における Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: Χριστός はここでイスラエルの王と同格に置かれ、王的・油注がれた者という称号として機能している。「メシア」はこの文脈上の意味を明確に保つ。
- issue: 見れば信じるという発言の性格
  choice: 話者の嘲弄的な挑戦としてそのまま訳す
  alternative: 真摯な信仰の約束として明確化する
  rationale: 本文は話者の内心を説明せず、文脈が皮肉を示すにとどまるため、訳文で神学的・心理的説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、処刑場面にふさわしい厳粛さを保った。引用内の「降りてみろ」は、原文の三人称命令が帯びる挑発と嘲りを自然な日本語で表す。脚注記号は対応箇所に配置した。
