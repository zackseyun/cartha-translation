source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: ja
  text: しかし、ピラトは、イエスがすでに死んでいたことに驚いた。そして百人隊長を呼び寄せ、死んでからしばらくたっていたのか[a]と尋ねた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すでに死んでいたのか」。
    reason: πάλαιは、この文脈では絶対的な「ずっと前」ではなく、死後ある程度の時間が経過していることを指し得る。
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: 驚き
  rationale: θαυμάζωがここで表す、予想より早い死へのピラトの驚きを、自然な現代日本語で表した。
- source_word: εἰ ἤδη τέθνηκεν
  choice: もう死んだのか
  rationale: εἰによる間接疑問を保ち、ἤδηを「もう」、完了形τέθνηκενを死の成立とその結果の状態が意識される表現にした。
- source_word: προσκαλεσάμενος
  choice: 呼び寄せて
  rationale: 百人隊長を自分のもとへ呼んだ後で尋ねたという、分詞の先行・付帯的な動作を自然に示した。
- source_word: κεντυρίωνα
  choice: 百人隊長
  rationale: ローマ軍の役職を表す、日本語聖書および一般的な歴史用語として定着した訳語を用いた。
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 質問して事実を確認するという文脈に合い、平明さと品位を兼ねる。
- source_word: εἰ πάλαι ἀπέθανεν
  choice: 死んでからすでにしばらくたっているのか
  rationale: πάλαιの相対的な時間幅を明示し、単に死亡済みかどうかではなく、死後ある程度の時間が経過していたかを確認した意味を伝える。
theological_decisions:
- issue: 二つの間接疑問における死亡時点と死後の状態
  choice: 最初を「もう死んだのか」、後を「死んでからすでにしばらくたっているのか」と訳し分けた。
  alternative: 最初を「すでに死んでいたことに驚き」、後を「すでに死んだのか」とする。
  rationale: 原文のεἰをいずれも間接疑問として保ち、ἤδηとπάλαιの違いも示す。これにより、ピラトが報告に驚いたことと、百人隊長に死亡時点を確認したことを区別できる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。人物名を明示して主語の取り違えを避けつつ、叙事文として簡潔で品位ある調子を保った。
