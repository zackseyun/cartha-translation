  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: ja
  text: そして、神殿の垂れ幕[a][b]が、上から下まで二つに裂けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神殿の幕」。
    reason: lexical_alternative
  - marker: b
    text: 「神殿」と訳したギリシア語は、より限定的に神殿内部の聖所を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 直前の出来事に続いて起こったことを示す物語上の接続として、現代日本語で自然に表した。厳密な時間的意味を過度に加えない。
- source_word: καταπέτασμα
  choice: 垂れ幕
  rationale: 神殿内に掛けられた幕を具体的かつ自然に示す。「幕」も可能だが、「垂れ幕」は吊り下げられた物であることが明瞭。
- source_word: ναοῦ
  choice: 神殿
  rationale: ναόςは神殿域全体よりも聖所を指し得るが、本文では読みやすく一般的な「神殿」とし、その限定的な意味は脚注で示す。
- source_word: ἐσχίσθη
  choice: 裂けた
  rationale: アオリスト受動形が示す、幕が裂かれた出来事を、日本語では自然な自動詞で簡潔に表した。行為者は補わない。
- source_word: εἰς δύο
  choice: 真っ二つに
  rationale: 二つに分かれたことを簡潔で自然な日本語として表す。「二つに」よりも裂け方が明瞭である。
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: 上から下まで
  rationale: 裂けた方向と全範囲を、原文どおり簡潔に示す。
theological_decisions:
- issue: 神殿の垂れ幕が裂けたことの象徴的意味
  choice: 出来事のみを描写し、その象徴的意味を本文で説明しない。
  alternative: 神への道が開かれたこと、または神殿制度への裁きを示す出来事として訳文に明示する。
  rationale: この節自体は出来事を報告するだけで、その意味を明言していないため、神学的な緊張と解釈の余地を保つ。
- issue: 裂いた行為者
  choice: 「裂けた」とし、行為者を明示しない。
  alternative: 「神によって裂かれた」などとする。
  rationale: ギリシア語は受動形だが行為者を明記していないため、訳文でも補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔でありながら聖書本文にふさわしい品位を保った。「すると」は物語の連続性を自然に示し、「真っ二つに裂けた」は出来事を鮮明に伝える。脚注記号は対象語の直後に置いた。
