source:
  edition: SBLGNT
  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: ja
  text: 通りかかった人々は、頭を振りながらイエスを罵り、こう言った。「ああ、神殿[a]を取り壊し、三日で建てる[b]者よ、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より限定的には「聖所」。
    reason: lexical_alternative
  - marker: b
    text: または「三日で建て直す」。ギリシア語の動詞自体は単に「建てる」だが、取り壊すという文脈から建て直すことが含意され得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: 通りかかった人々
  rationale: 場を通り過ぎる人々を表す分詞。日本語では自然な叙述として「通りかかった人々」とした。
- source_word: ἐβλασφήμουν
  choice: 罵り
  rationale: ここでは敵意ある人々がイエスに浴びせる侮辱的な言葉を指すため、宗教的な専門語に狭めず「罵る」とした。未完了の継続性は文脈と接続表現によって自然に示される。
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: 頭を振りながら
  rationale: 嘲りを表す慣用的なしぐさとして、現代日本語で明瞭な表現を用いた。
- source_word: Οὐὰ
  choice: ああ
  rationale: この文脈では嘲りの間投詞。日本語で侮蔑的な呼びかけとしても読める「ああ」を採り、過度に口語的な「やい」は避けた。
- source_word: ὁ καταλύων
  choice: 取り壊し…者よ
  rationale: 冠詞付き分詞は直接の呼びかけとして機能する。「取り壊す」は建造物について自然であり、原文の非完結的な分詞形を後続の「建てる」と並行させた。
- source_word: ναὸν
  choice: 神殿
  rationale: 一般読者に明瞭な標準訳。「聖所」という、より限定的な語義は脚注に残した。
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: 三日で建てる
  rationale: οἰκοδομέω自体は単に「建てる」であるため直訳を本文に置いた。文脈上可能な「建て直す」は脚注で示した。
theological_decisions:
- issue: 神殿についての発言が何を指すか
  choice: 嘲る人々の非難・引喩として、そのまま訳す
  alternative: 神殿がイエスの体を指すことを本文で明示する
  rationale: マルコは十字架刑の場で人々が口にした嘲りとして描いている。この節自体が述べないヨハネ福音書の解釈を本文に持ち込まず、物語上および神学上の緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら、受難物語にふさわしい格調を保った。「者よ」は直接の嘲弄的呼びかけを示す。節末は次節へ続くため読点で閉じた。
