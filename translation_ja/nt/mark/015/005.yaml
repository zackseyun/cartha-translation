  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: ja
  text: しかし、イエスはもはや何も答えなかったので、ピラトは驚いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の告発や問いかけに対するイエスの沈黙との穏やかな対照を示す。
- source_word: οὐκέτι
  choice: もはや
  rationale: それ以前には答えていたが、今は答えなくなったという時間的な意味を保つ。
- source_word: οὐδὲν
  choice: 何も
  rationale: 否定述語と組み合わせ、応答が一切なかったことを自然な現代日本語で表す。
- source_word: ἀπεκρίθη
  choice: お答えにならなかった
  rationale: 司法的な問答の文脈に合う「答える」を用い、イエスへの自然な敬意を敬語で示す。
- source_word: ὥστε
  choice: ので
  rationale: イエスの沈黙がピラトの驚きという結果を生んだ関係を、簡潔で自然な日本語にする。
- source_word: θαυμάζειν
  choice: 驚いた
  rationale: ここではピラトが意外に感じた反応を表し、過度に古風な「感嘆した」を避ける。
- source_word: Πιλᾶτον
  choice: ピラト
  rationale: 人名の慣用的な日本語音写を用いる。
