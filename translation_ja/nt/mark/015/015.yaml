id: MRK.15.15
reference: Mark 15:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: ja
  text: そこでピラトは、群衆を満足させようとして[a]、群衆にバラバを釈放した。そして、イエスをむち打ちにした後、十字架につけられるために引き渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆の要求に応えようとして」「群衆を喜ばせようとして」。直訳は「群衆にとって十分なことをしようとして」。
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: ～ようとして
  rationale: ピラトの意志・意図を示す分詞。現代日本語として自然に、後続する行為の動機を表す。
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: 群衆の要求に応えようとして
  rationale: 直訳は「群衆にとって十分なことをする」。文脈では群衆の求めを満たして宥めることを指すため、「要求に応える」とした。単なる好感獲得に狭めない。
- source_word: ἀπέλυσεν
  choice: 釈放した
  rationale: 司法・拘禁の文脈における囚人の解放を明確に表す。
- source_word: αὐτοῖς
  choice: 彼らのために
  rationale: 群衆の要求に応じた釈放という受益・関与を自然な日本語で表す。
- source_word: παρέδωκεν
  choice: 引き渡した
  rationale: イエスを他者の権力下に渡す受難物語の重要な語感を保持する。
- source_word: φραγελλώσας
  choice: イエスをむちで打たせたうえで
  rationale: アオリスト分詞が主動詞に先立つ行為を示すことを明示し、総督ピラトが刑の執行を命じたという文脈上の使役性も自然に表す。
- source_word: ἵνα σταυρωθῇ
  choice: 十字架につけるために
  rationale: 引き渡しの目的を明確にし、受動形の内容を日本語の慣用表現で伝える。
- source_word: Βαραββᾶν
  choice: バラバ
  rationale: 日本語聖書で広く定着した固有名表記を用いる。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 日本語で定着した固有名表記を用いる。
theological_decisions:
- issue: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι に示されるピラトの動機
  choice: 群衆の要求に応える
  alternative: 群衆を喜ばせる／群衆を満足させる
  rationale: 政治的な迎合と要求への対応という文脈を伝えつつ、原文にない道徳的評価を付け加えない。「喜ばせる」では軽く響く可能性があり、「満足させる」よりも具体的な状況に合う。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「一方」を用いて、バラバの釈放とイエスの引き渡しの対照を読み取りやすくした。刑罰は一般読者に分かりやすい「むちで打つ」と表現した。
