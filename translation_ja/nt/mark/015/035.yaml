id: MRK.15.35
reference: Mark 15:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: ja
  text: その場に立っていた人々のうち何人かが、それを聞いて、こう言っていた。「ほら、エリヤを呼んでいる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「エリヤを呼び求めている」。
    reason: φωνεῖは、名を呼ぶことだけでなく、来てもらおうと呼ぶ意味にも理解できるため。
lexical_decisions:
- source_word: καί
  choice: （文脈に溶け込ませ、独立した訳語を置かない）
  rationale: 前節からの叙述の連続は日本語の文脈ですでに明らかであり、「そして」を機械的に置くより自然な物語文となる。時間的・因果的な意味は加えていない。
- source_word: τινες
  choice: 何人か
  rationale: その場にいた人々のうち、特定されていない一部を明確かつ自然に表す。
- source_word: τῶν παρεστηκότων
  choice: その場に立っていた人々のうち
  rationale: 実際にその場に立って居合わせた人々という具体的な空間的意味と、部分を表す属格の関係を保つ。
- source_word: ἀκούσαντες
  choice: それを聞いて
  rationale: 主動詞に先立つ行為を自然な日本語で示す。「それ」は直前のイエスの叫びを文脈から補う。
- source_word: ἔλεγον
  choice: こう言っていた
  rationale: 未完了過去の継続的・反復的な側面を保ちつつ、続く直接話法へ自然につなぐ。
- source_word: Ἴδε
  choice: ほら
  rationale: 相手の注意を引く命令表現を、現代の自然な直接話法で表す。
- source_word: Ἠλίαν
  choice: エリヤ
  rationale: 日本語聖書で広く定着している預言者名の表記。
- source_word: φωνεῖ
  choice: 呼んでいる
  rationale: 現在時制を進行中の発話として表し、目的語エリヤとの構文を簡潔に保つ。助けを求めているとまでは本文で明示しない。
theological_decisions:
- issue: 居合わせた人々がイエスの叫びをエリヤへの呼びかけと受け取ったことを、説明的に明示するか
  choice: 発言をそのまま「エリヤを呼んでいる」と訳す
  alternative: 「彼らは、イエスがエリヤに助けを求めていると思った」
  rationale: ギリシア語は人々の発言を報告しているのであり、語り手による説明を加えてはいない。誤解の性質は文脈に委ね、本文では解釈を過度に限定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、直接話法には口頭で自然な「ほら」を採用した。全体の語調は簡潔でありながら、受難物語にふさわしい落ち着きを保っている。
