  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: ja
  text: そして彼らはイエスに紫の衣[a]を着せ、茨で冠を編んで、それをかぶせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「紫色のものを着せ」。ギリシア語の「紫」は紫色の布または衣服を指し得るが、この節では衣の種類を明記していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: 着せ
  rationale: 人に衣服を身につけさせることを表す動詞であり、日本語では簡潔で自然な「着せ」が使役的な意味を保つ。
- source_word: πορφύραν
  choice: 紫の衣
  rationale: この語は紫色の布または衣服を指し得る。日本語で「紫を着せる」とすると不自然または詩的に響くため、文脈上含意される衣服を「衣」で補い、脚注で原文の幅を示した。
- source_word: πλέξαντες
  choice: 編んで
  rationale: アオリスト分詞は、冠を編む行為がそれをかぶせることに先立つことを示す。「編んで」は日本語でその順序を自然に表す。
- source_word: ἀκάνθινον
  choice: 茨で
  rationale: 茨から作られたことを表す形容詞の意味を、自然な材料表現で示した。
- source_word: στέφανον
  choice: 冠
  rationale: 花輪や勝利の冠も指し得る語だが、この場面では紫の衣とともに王権を嘲る道具であるため、「冠」が文脈上の意味を最もよく伝える。
- source_word: περιτιθέασιν αὐτῷ
  choice: それをかぶせた
  rationale: 原文は彼にその周りへ置く・載せる意である。日本語の「かぶせた」は冠を人に載せる動作を自然に表し、原文に明記されない「頭に」は加えない。
theological_decisions:
- issue: イエスを王に見立てて辱める描写
  choice: στέφανοςを「冠」と訳す
  alternative: 花輪、輪飾り
  rationale: 紫の衣と茨の冠は兵士たちによる王権の嘲弄を形作る。「冠」はその物語上の含みを保つ一方、それ以上の教理的解釈を本文に加えない。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述とした。「イエス」は日本語で代名詞の連続を避けるため文脈上の指示対象を明示した。ギリシア語の歴史的現在は、日本語の物語として自然な過去形で表した。
