  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: ja
  text: そして[a]、「彼は律法に背く者たちとともに数えられた」と言う聖書のことばが成就した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、シナイ写本とバチカン写本（ともに4世紀）を含む現存する最古級のギリシア語写本や、初期のコプト語訳にはありません。一方、ビザンティン系の多数の写本とラテン語の伝承には保存されています。ルカ22章37節にあるイザヤ53章12節の引用に合わせるため、後代の写字生が加えた可能性が高いと考えられます。
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω（ἐπληρώθη）
  choice: 成就した
  rationale: 預言として記された聖書のことばが実現したことを表す受動形であり、日本語の聖書文体でも自然かつ正確である。
- source_word: ἄνομος（ἀνόμων）
  choice: 律法に背く者たち
  rationale: 字義的な「律法のない者／律法に反する者」という意味を明確な現代日本語で表し、単に一般的な犯罪者に限定しない。
- source_word: λογίζομαι（ἐλογίσθη）
  choice: 数えられた
  rationale: ある集団の一員と見なされ、その中に加えられるという受動の意味を保つ。
- source_word: γραφή
  choice: 聖書のことば
  rationale: ここでは権威ある聖書の一節を指すため、「聖書」だけでなく、引用される具体的なことばであることも自然に示す。
- source_word: καί
  choice: こうして
  rationale: 節頭の接続詞を、直前の出来事を預言の成就としてまとめる自然な日本語にした。引用文冒頭の καί は、独立した日本語引用では冗長になるため明示しない。
theological_decisions:
- issue: ἀνόμων の指す範囲
  choice: 律法に背く者たち
  alternative: 犯罪者たち
  rationale: イザヤ53章12節を背景とする語の宗教的・倫理的な幅を保ち、十字架刑を受けた者だけを意味するように狭めない。
- issue: 預言成就の表現における行為主体
  choice: 「成就した」という日本語の自動詞形
  alternative: 「神によって成就された」
  rationale: ギリシア語の受動形が神の働きを含意し得る一方、本文は行為主体を明示していないため、神を補って曖昧さを解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用としての品位を保った。「律法に背く者たち」は意味を説明しすぎず、一般読者にも理解できる表現とした。脚注記号[a]は本文中に置き、この節全体に関する本文批評上の情報を示している。
