  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: ja
  text: しかし、ピラトは再びイエスに尋ねた。「何も答えないのか。見なさい。どれほど多くのことであなたを告発しているか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ Πιλᾶτος
  choice: すると、ピラトは
  rationale: δὲは物語の展開を示しつつ、直前のイエスの沈黙を受ける軽い対照も含む。「すると」は日本語の叙述として自然で、強すぎる逆接を避ける。
- source_word: πάλιν ἐπηρώτα αὐτόν
  choice: 再びイエスに尋ねた
  rationale: πάλινは「再び」。未完了過去ἐπηρώταは継続的・反復的な問いかけを表し得るが、この短い叙述では自然な日本語の「尋ねた」で十分に表せる。代名詞は指示対象を明確にするため「イエス」とした。
- source_word: λέγων
  choice: （直接話法への移行）
  rationale: ギリシア語では発言を導く分詞だが、日本語では引用符を用いることで自然に表せるため、「言って」と重ねなかった。
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: 何も答えないのか。
  rationale: οὐκ…οὐδένの否定と、イエスの沈黙を問いただす力を簡潔な現代日本語で保持した。
- source_word: ἴδε
  choice: 見なさい
  rationale: 注意を向けさせる命令形。威厳を保った現代語として「見なさい」を選んだ。
- source_word: πόσα σου κατηγοροῦσιν
  choice: あの者たちがあなたをどれほど多くのことで訴えていることか
  rationale: πόσαの文字どおりの「どれほど多くのこと」を保持し、κατηγορέωの法的文脈を「訴える」で示した。現在形は進行中の告発として「訴えている」とした。主語は動詞の三人称複数に基づき、文脈上の告発者を「あの者たち」と明示した。
