id: MRK.15.12
reference: Mark 15:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: ja
  text: ピラトは再び彼らに答えた。「それでは、あなたがたが『ユダヤ人の王』と呼んでいる者を、私にどうしてほしいのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの言う『ユダヤ人の王』を、私にどうしてほしいのか。」
    reason: ὃν λέγετεの自然な別表現。いずれも、その称号が群衆の言い方として提示されている点を保つ。
lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: ピラトが続く応酬の中でもう一度発言したことを、簡潔で自然な日本語で示す。
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: 答えた
  rationale: 分詞と未完了過去の組み合わせを逐語的に「答えて言っていた」とせず、物語文として自然な発話導入にした。
- source_word: Τί οὖν
  choice: それでは、…どう
  rationale: οὖνが直前の群衆の要求を受けた推論・展開を示すため、「それでは」で論理的なつながりを保った。
- source_word: θέλετε ποιήσω
  choice: 私にどうしてほしいのか
  rationale: θέλωとアオリスト接続法による意向の問いを、明快で現代的な日本語にした。
- source_word: ὃν λέγετε
  choice: あなたがたが…と呼んでいる者
  rationale: イエスについての呼称が群衆側のものだという修辞的距離を保ち、λέγετεを文脈に即して「呼んでいる」と訳した。
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: 『ユダヤ人の王』
  rationale: 受難物語における政治的・告発的な称号として訳し、かぎ括弧によって呼称であることを明瞭にした。
theological_decisions:
- issue: ピラトの言葉がイエスの王権を認めているのか、群衆の呼称を反映しているのか
  choice: 「あなたがたが『ユダヤ人の王』と呼んでいる者」
  alternative: 「あなたがたの言う『ユダヤ人の王』」
  rationale: 関係節ὃν λέγετεは「あなたがた」がそう言うことを前面に出している。ピラト自身による告白とも否定とも断定せず、原文の修辞的距離と神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、裁判場面にふさわしい簡潔で重みのある調子とした。「どうしてほしいのか」は口語的すぎず、ピラトが群衆に処置を問う直接性を伝える。
