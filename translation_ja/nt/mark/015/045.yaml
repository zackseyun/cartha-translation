  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: ja
  text: そして、百人隊長から聞いて、遺体をヨセフに渡すことを許可した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς ἀπὸ τοῦ κεντυρίωνος
  choice: 百人隊長から確かめると
  rationale: γνοὺςはアオリスト分詞で、後続する行為に先立つ事情を示す。直前の問いかけを受け、百人隊長から事実を確認したという文脈を自然な日本語で表した。ἀπό＋属格が情報源を示すことも保持している。
- source_word: κεντυρίωνος
  choice: 百人隊長
  rationale: ローマ軍の役職を表す、日本語聖書および一般的な歴史用語として定着した訳語。
- source_word: ἐδωρήσατο
  choice: 引き渡した
  rationale: ここではピラトがヨセフの求めを認め、遺体の引き取りを正式に許したことを表す。単なる「与えた」より文脈に自然であり、権限に基づく交付の含みを伝える。
- source_word: πτῶμα
  choice: 遺体
  rationale: 語義は死体・亡骸を指す。「遺体」は死が明示され、かつ現代日本語の叙述として自然で尊厳のある表現である。
- source_word: τῷ Ἰωσήφ
  choice: ヨセフに
  rationale: 与格の間接目的語として、引き渡しを受ける人物を明確に表した。
