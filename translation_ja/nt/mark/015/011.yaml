  text: οἱ δὲ ἀρχιερεῖς ἀνέσεισαν τὸν ὄχλον ἵνα μᾶλλον τὸν Βαραββᾶν ἀπολύσῃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: ja
  text: しかし、祭司長たちは、むしろバラバを釈放してもらうよう群衆をあおった[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆を扇動した」。ギリシア語の動詞は、集団を駆り立て、望む行動へ向かわせることを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「むしろ」は、文脈上暗示される別の者よりも、バラバを選んで釈放するよう求めたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: しかし
  rationale: δέは弱い対比または物語の展開を示す。直前のピラトの問いかけに対し、祭司長たちが群衆を動かしたことを対比的に示すため、「しかし」とした。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: エルサレムの祭司指導者層を指す福音書の標準的な訳語として、自然で定着している。
- source_word: ἀνέσεισαν
  choice: あおった
  rationale: 集団を望む行動へ駆り立てる、扇動するという意味を、現代日本語で明瞭かつ自然に表す。
- source_word: τὸν ὄχλον
  choice: 群衆
  rationale: ὄχλοςが指す、その場に集まった人々の集団を簡潔に表す。
- source_word: ἵνα
  choice: ～してもらうよう
  rationale: 祭司長たちが群衆をあおった目的を示すἵνα節を、日本語として自然な目的表現にした。
- source_word: μᾶλλον
  choice: むしろ
  rationale: 文脈上暗示される別の選択肢よりバラバを優先する比較的な意味を保ち、本文にない「イエスではなく」を補わない。
- source_word: τὸν Βαραββᾶν
  choice: バラバ
  rationale: 人名の慣用的な日本語音写を用いた。
- source_word: ἀπολύσῃ
  choice: 釈放してもらう
  rationale: ἵναに続くアオリスト接続法で、暗黙の主語はピラト。群衆側がピラトに釈放を求めるという関係を自然な日本語で示す。
- source_word: αὐτοῖς
  choice: ～してもらう
  rationale: 群衆が釈放の受益者であることを、日本語の受益表現「もらう」によって自然に含意させた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、福音書の受難物語にふさわしい簡潔で品位ある語調とした。「あおった」は現代語として自然だが口語に傾きすぎず、扇動の意味を明確に伝える。「むしろ」によって原文の比較対象が明示されていない点を保持した。
