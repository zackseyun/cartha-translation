  naturalness: 「マグダラのマリアとヨセの母マリアは、イエスが納められた場所を見ていた」は明快で自然な現代標準日本語である。「見ていた」は未完了過去の持続を過不足なく表し、「納められた」は埋葬文脈にふさわしく、過度に解釈的ではない。
  terminology: 固有名詞は日本語聖書で通用する形であり、「ヨセの母」は直前の文脈（15:40）に照らして妥当な明示化である。脚注は、ギリシア語の表現自体が関係語を明示していないことを適切に留保している。
