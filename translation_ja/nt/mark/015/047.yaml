  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: ja
  text: マグダラのマリアとヨセの母マリアは、イエスが納められた場所を見ていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ヨセのマリア」。ギリシア語は、このマリアをヨセとの関係によって特定しているが、ここでは関係を表す語を明記していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （訳出せず、文脈上の自然なつながりで表現）
  rationale: ここでは強い対比ではなく、埋葬の記事を穏やかに続ける接続辞である。日本語では接続語を置かないほうが自然に連続性を示せる。
- source_word: Μαρία ἡ Μαγδαληνή
  choice: マグダラのマリア
  rationale: 日本語聖書で広く定着した、地名に基づく自然な呼称。定冠詞を伴う付加語は、複数のマリアのうち誰かを特定している。
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: ヨセの母マリア
  rationale: 属格はヨセとの関係によってこのマリアを特定している。直前の15章40節を踏まえると母子関係が自然だが、原文自体は関係語を明示しないため脚注でその点を示した。
- source_word: ἐθεώρουν
  choice: 見ていた
  rationale: 未完了過去の継続的な動作を、自然な現代日本語で表す。「見届けていた」では目的や完遂の含みを加えかねないため避けた。
- source_word: ποῦ
  choice: 場所
  rationale: 「どこに」に当たる場所の意味を、「納められた場所」という自然な連体修飾構文で表した。
- source_word: τέθειται
  choice: 納められた
  rationale: τίθημι の完了受動形が示す、置かれた結果としてそこにある状態を、埋葬の文脈に適した日本語で表した。単なる「置かれた」より自然であり、「葬られた」ほど広い埋葬行為全体を意味しない。
theological_decisions:
- issue: 受動動詞で省略された対象
  choice: 「イエス」を明示
  alternative: 主語を補わず「納められた場所」とする、または「遺体が納められた場所」とする
  rationale: ギリシア語では文脈上明白な対象が省略されているが、日本語では「イエス」を補うことで指示対象が明瞭になる。「遺体」とすると、原文にない物体化した表現を加えるため避けた。
- issue: ἡ Ἰωσῆτος が示す関係
  choice: 本文では「ヨセの母」とする
  alternative: 字義的に「ヨセのマリア」とする
  rationale: 15章40節の同一人物の特定とマルコの用法から母子関係が最も自然である。ただし属格そのものは「母」を明示しないので、原文の余地を脚注に残した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。埋葬場面に合う「納められた」を用い、未完了過去の継続性は「見ていた」で簡潔に保持した。
