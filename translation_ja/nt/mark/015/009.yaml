  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: ja
  text: しかし、ピラトは彼らに答えた。「私があなたがたにユダヤ人の王を釈放することを望むのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の群衆の要求に対するピラトの応答という、穏やかな対比と物語の転換を示す。
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: 彼らに答えて言った
  rationale: 応答の意味と分詞 λέγων を保ちつつ、聖書物語として自然で明瞭な日本語にした。
- source_word: Θέλετε
  choice: してほしいのか
  rationale: ここでは群衆の意向を尋ねている。後続の一人称接続法 ἀπολύσω と合わせ、自然な日本語で「私が釈放することを望むか」という意味を表す。
- source_word: ἀπολύσω ὑμῖν
  choice: 釈放してほしい
  rationale: 司法・拘禁の文脈に即して ἀπολύω を「釈放する」とし、ὑμῖν は群衆のために行うこととして日本語の依頼・希望構文に織り込んだ。
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: 受難物語における政治的かつ皮肉を帯びた定型的称号として、現代日本語で定着した表現を用いた。
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων の称号
  choice: ユダヤ人の王
  alternative: ユダヤ地方の人々の王／ユダヤ人たちの王
  rationale: Ἰουδαῖοι には民族的・地域的な意味の幅があるが、ここではローマ総督の発言中の定型的な政治称号であるため、「ユダヤ人の王」が文脈にも日本語の慣用にも最も適する。称号に含まれる物語上の皮肉や神学的緊張は説明で解消しない。
translation_notes:
  register: 明瞭で現代的ながら、受難物語にふさわしい簡潔で厳かな文体。「答えて言った」は原文の構造を適度に映す。
