source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: ja
  text: そして、彼らはイエスを十字架につけ、その衣服を分け合った。だれが何を取るかを決めるため、くじを引いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυροῦσιν
  choice: 十字架につけ
  rationale: マルコの歴史的現在は日本語で字義的に現在形にすると不自然になりやすいため、文脈上自然な叙述形で訳した。動作の直接性は保っている。
- source_word: διαμερίζονται
  choice: 分け合った
  rationale: 衣服を複数の者の間で分配するという中動態の文脈的意味を、自然な現代日本語で表した。
- source_word: ἱμάτια
  choice: 衣服
  rationale: 個々の衣類を含み得る複数形を、明瞭で品位のある一般語で表した。
- source_word: βάλλοντες κλῆρον
  choice: くじを引いた
  rationale: 割り当てをくじで決める慣用表現であり、字義的な『くじを投げる』より現代日本語として自然である。
- source_word: ἐπ’ αὐτὰ
  choice: （衣服の割り当てについて）
  rationale: 訳文では後続の『だれが何を取るか』に含意させた。指示対象が衣服であることは直前の文脈から明瞭である。
- source_word: τίς τί ἄρῃ
  choice: だれが何を取るかを決めるため
  rationale: 二つの疑問代名詞の配分的な力を保ち、くじの目的・結果を自然な日本語で明示した。
theological_decisions:
- issue: 受難叙述における歴史的現在
  choice: 日本語では自然な完了的叙述『十字架につけ』『分け合った』で表す
  alternative: 『十字架につける』『分け合う』と現在形を維持する
  rationale: ギリシア語の歴史的現在の生彩は認めつつ、日本語の物語で現在形を機械的に保持して生じる不自然さを避けた。出来事の内容や神学的含意は変更していない。
translation_notes:
  register: 明瞭な現代標準日本語。受難記事にふさわしい簡潔で落ち着いた調子を保ち、古風な『御衣』『籤』などは避けた。
