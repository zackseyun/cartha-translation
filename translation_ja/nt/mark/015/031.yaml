  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: ja
  text: 同じように、祭司長たちも律法学者たちとともに、あざけりながら互いにこう言っていた。「ほかの人々は救ったのに、自分自身は救えない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: 同じように
  rationale: 直前に描かれた人々のあざけりと並行することを明確にし、比較の力を自然な現代日本語で保つ。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 単数の大祭司職が複数存在したという意味ではなく、指導的な祭司層を指す定着した訳語。
- source_word: ἐμπαίζοντες
  choice: あざけりながら
  rationale: 侮蔑を込めて嘲弄する意味を、簡潔で品位ある現代日本語で表す。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 相互的なやり取りを示す。ここでは互いをあざけったというより、互いに言葉を交わしつつイエスをあざけったと理解できるため、注で構文上の幅を示す。
- source_word: μετὰ τῶν γραμματέων
  choice: 律法学者たちと一緒になって
  rationale: 律法学者たちも祭司長たちの嘲弄に加わっていたことを自然に示す。γραμματεύς はこの文脈でユダヤ教律法の専門家を指すため「律法学者」とする。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制の継続的または反復的な発言を、過度に限定せずに表す。
- source_word: Ἄλλους
  choice: ほかの人々
  rationale: イエスが救い、あるいは助けた人々を指す不定複数を明瞭に表す。
- source_word: ἔσωσεν ... σῶσαι
  choice: 救った……救えない
  rationale: 同じ語根の反復を保ち、身体的な救助とより広い救いの双方を響かせる皮肉を保存する。
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: 自分自身は救えない
  rationale: 能力を否定する嘲りを自然に表し、「自分自身」で再帰代名詞の強調を保つ。
theological_decisions:
- issue: σῴζωを二つの節で一貫して訳すこと
  choice: 救った……救えない
  alternative: 助けた……助けられない／救い出した……救い出せない
  rationale: ギリシア語の反復と、嘲る者たちの言葉に含まれる救助・癒やし・救済の重層的な皮肉を保ち、意味を一つに狭めない。
- issue: πρὸς ἀλλήλους と μετὰ τῶν γραμματέων の関係
  choice: 祭司長たちも律法学者たちと一緒になって、互いにあざけりながら言っていた
  alternative: 祭司長たちは律法学者たちとともに、互いに語り合いながらあざけって言っていた
  rationale: 祭司長たちと律法学者たちが共同で嘲弄したことと、発言が相互的なやり取りの中でなされたことを本文で簡潔に示しつつ、係り受けの曖昧さは注に残す。
translation_notes:
  register: 明瞭で現代的かつ朗読に耐える文体。「祭司長」「律法学者」は一般的な聖書用語として保持し、「救った／救えない」の反復によって原文の皮肉と神学的緊張を残した。
