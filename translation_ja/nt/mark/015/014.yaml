  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: ja
  text: しかし、ピラトは彼らに言っていた。「なぜだ。この人がどんな悪いことをしたというのか。」ところが彼らは、ますます激しく叫んだ。「十字架につけろ！」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言った
  rationale: 未完了過去は継続・反復を示し得るが、この短い応答では日本語の自然な物語表現を優先した。「言い続けた」とすると反復を必要以上に強めるため避けた。
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: いったい、この人がどんな悪いことをしたというのか
  rationale: γάρが示す理由を問い返す調子を「いったい」で自然に表し、κακόνの道徳的・法的な重みを「悪いこと」として明確に保った。
- source_word: περισσῶς
  choice: ますます激しく
  rationale: 群衆の叫びが一層強まったことを、現代日本語で自然かつ力強く表した。
- source_word: ἔκραξαν
  choice: 叫んだ
  rationale: 公然と大声を上げる κράζω の強さを簡潔に表した。
- source_word: Σταύρωσον αὐτόν
  choice: 十字架につけろ
  rationale: 単数命令形の直接的で切迫した要求を、群衆の荒々しい口調に合う命令表現で訳した。目的語は日本語では文脈上明白なため省略した。
- source_word: δὲ
  choice: しかし／ところが
  rationale: 前後の対照を明示しつつ、同語の機械的反復を避けて自然な談話の流れを作った。
- source_word: Πιλᾶτος
  choice: ピラト
  rationale: 日本語聖書で広く認知されている標準的な音写を用いた。
theological_decisions:
- issue: ピラトの問いにおける κακόν の道徳的・法的な強さ
  choice: 「悪いこと」
  alternative: 「罪」「どんな悪事」
  rationale: 「罪」は法的有罪または神学的罪責を原文以上に確定しかねず、「悪事」はやや硬く重大犯罪に限定して響く可能性がある。「悪いこと」は原語の幅を保ち、問いの道徳的重みも弱めない。
- issue: 群衆の命令の対象と執行主体
  choice: 「十字架につけろ」
  alternative: 「この人を十字架につけろ」「十字架につけさせろ」
  rationale: 原文はピラトに対する直接命令だが、ピラト自身が物理的に執行することまでは意味しない。日本語の直接命令は、権限者に処刑を要求する含みを自然に保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語。物語文は簡潔で dignified な調子を保ち、ピラトの問いは冷静な反問、群衆の言葉は荒々しい直接命令として対照させた。注記を要するほどの訳語上の不可避な曖昧さはないため、脚注は付していない。
