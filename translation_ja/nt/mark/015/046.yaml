source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: ja
  text: ヨセフは亜麻布[a]を買い、イエスを十字架から降ろしてその亜麻布で包み、岩を掘って造られた墓に納めた。それから、石を墓の入り口[b]に転がし寄せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「亜麻の布」または、文脈上「葬布」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「墓の戸に向かって」とも訳せる。ギリシア語のθύραは「戸」または「入り口」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: 亜麻布／その亜麻布
  rationale: σινδώνは亜麻製の布を指し、ここでは遺体を包むために用いられている。「亜麻布」は素材を保ちつつ、本文が明示しない専用の葬布という限定を避ける。二度目は定冠詞を「その」に反映した。
- source_word: καθελὼν αὐτόν
  choice: イエスを十字架から降ろして
  rationale: καθαιρέωは文脈上、イエスの遺体を十字架から降ろすことを表す。日本語では対象を「イエス」、降ろす場所を「十字架から」と明示するのが自然であり、文脈に基づく補足である。
- source_word: ἐνείλησεν
  choice: 包み
  rationale: 動詞は布で包む、くるむことを表す。「包む」は現代日本語で自然で、縛るなど本文にない細部を加えない。
- source_word: ἔθηκεν
  choice: 納めた
  rationale: τίθημιは置くことを表すが、埋葬の文脈では「墓に納める」が自然で品位のある日本語となる。
- source_word: μνημείῳ / μνημείου
  choice: 墓／墓の
  rationale: ここでは岩に掘られた埋葬施設を指す。「墓」は簡潔で標準的な訳語である。
- source_word: λελατομημένον ἐκ πέτρας
  choice: 岩を掘って造られた
  rationale: 完了受動分詞が示す、岩を掘削して造られた状態を自然な日本語で表す。πέτραは加工済みの石材より岩盤・岩を指すため「岩」とした。
- source_word: προσεκύλισεν λίθον
  choice: 石を転がして置いた
  rationale: 動詞には対象へ転がし寄せる方向性がある。後続の「入り口に」と合わせ、墓を閉じる位置へ石を転がしたことを自然に示す。
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: 墓の入り口に
  rationale: θύραには「戸」と「入り口」の両義がある。岩窟墓の開口部を指す文脈では「入り口」が現代の読者に明瞭であるが、語の別の可能性は脚注に残した。
- source_word: ἀγοράσας
  choice: 買い
  rationale: アオリスト分詞が後続動作に先立つ行為を示す。日本語では連用形「買い」で行為の順序を簡潔かつ自然に表せる。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述とした。主語「ヨセフ」と対象「イエス」、および「十字架から」は直前の文脈から補い、代名詞が不自然になりやすい日本語で指示関係を明確にした。
