  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: ja
  text: バラバと呼ばれる男が、反乱の際に殺人を犯した反乱者たちとともに、縛られていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「反乱者」は「暴動を起こした者たち」、「反乱」は「蜂起」とも訳せる。ギリシア語では、反乱に関わる者と反乱そのものに同じ語根の語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: 〜いた
  rationale: δέは弱い接続辞であり、日本語では文脈上あえて接続語を加えず、ἦνを状態の継続を表す「いた」に反映した。
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: バラバと呼ばれる男
  rationale: 冠詞付き分詞の記述的な指定を、軽蔑的な含みを加えず自然な現代日本語で表した。固有名は「バラバ」と音写した。
- source_word: μετὰ τῶν στασιαστῶν
  choice: 反乱者たちとともに
  rationale: στασιασταίは反乱・蜂起に加わった者を指す。「反乱者」は後続の同根語στάσιςとの語彙的な連関も示せる。
- source_word: δεδεμένος
  choice: 縛られていた
  rationale: δέωの完了受動分詞が表す、拘束された状態を直接的に訳した。「投獄されていた」より原文に近い。
- source_word: οἵτινες
  choice: 〜たち
  rationale: 先行する反乱者たちを説明する関係節として日本語の連体修飾に組み込んだ。
- source_word: ἐν τῇ στάσει
  choice: 反乱の際に
  rationale: στάσιςを政治的な反乱・蜂起の意味に取り、殺人がその反乱中に行われたことを自然に示した。
- source_word: φόνον πεποιήκεισαν
  choice: 人を殺した
  rationale: φόνος ποιεῖνは殺人を犯すことを意味する。日本語では「殺人を犯した」も可能だが、無冠詞のφόνονについて被害者の数や法的分類を過度に限定せず、明快な「人を殺した」とした。過去完了的な先行性は文脈と連体節によって十分伝わる。
