  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: ja
  text: 二人も去って行き、残りの人たち[a]に知らせた。しかし、その人たちも二人の話を信じなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ほかの人たち」とも訳せる。
    reason: λοιπόςは「残っている者たち」と「ほかの者たち」のどちらの表現でも訳し得るため。
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: そこで二人も
  rationale: καίとἐκεῖνοιの融合形で、「その者たちも」の意。直前の文脈で指される二人を日本語で自然に明示し、καίの付加的な意味を「も」で表した。
- source_word: ἀπελθόντες
  choice: 出かけて
  rationale: 主動詞に先立つ移動を表すアオリスト分詞。「立ち去って」よりも、この場面で報告に向かう動きを自然に伝える。
- source_word: ἀπήγγειλαν
  choice: 知らせた
  rationale: ἀπαγγέλλωは、受けた情報や経験をほかの者に報告することを表す。目的語はギリシア語同様、文脈に委ねた。
- source_word: τοῖς λοιποῖς
  choice: 残りの人たち
  rationale: λοιπόςがここでは、その二人以外の残った仲間たちを指すため。「ほかの人たち」という意味も脚注に示した。
- source_word: οὐδὲ
  choice: しかし、その人たちも…なかった
  rationale: 先行する不信に続く「この場合も信じなかった」という付加的否定を「も…なかった」で表し、文脈上の対照を「しかし」で自然につないだ。
- source_word: ἐκείνοις
  choice: 二人の言うことを
  rationale: 原文は「彼らを」に相当する与格だが、ここでは二人の証言を信じないという意味。日本語で人物そのものへの一般的な不信と誤解されないよう、文脈上の対象を明確にした。
- source_word: ἐπίστευσαν
  choice: 信じなかった
  rationale: この文脈のπιστεύωは、二人の報告を真実として受け入れなかったことを表すため、平明な「信じなかった」とした。
theological_decisions:
- issue: 証言を受け入れる文脈でのπιστεύωの訳
  choice: 二人の言うことを信じなかった
  alternative: 二人を信頼しなかった
  rationale: ここでは人格的な信頼や教理的な信仰一般ではなく、伝えられた証言を受け入れなかったことが焦点であるため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書物語にふさわしい落ち着きを保った。「彼ら」の連続による指示対象の混乱を避け、文脈で明らかな二つの集団を「二人」「その人たち」と表した。
