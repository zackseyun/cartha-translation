  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: ja
  text: その後、田園地帯へ向かって歩いていた彼らのうちの二人に、イエスは別の姿で[a]現れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「違った外見で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: その後
  rationale: μετά＋対格による時間的順序と、δέの叙述を進める働きを、自然で簡潔な現代日本語で表す。
- source_word: δυσὶν ἐξ αὐτῶν
  choice: 彼らのうちの二人に
  rationale: 二人がより大きな集団の中から選ばれた者であることを、自然な日本語で保持する。
- source_word: περιπατοῦσιν
  choice: 歩いていたとき
  rationale: 現在分詞が示す、主動詞と同時進行の継続的な動作を表す。
- source_word: ἐφανερώθη
  choice: 現れた
  rationale: 復活後の顕現という文脈で、φανερόωの受動形が持つ慣用的な意味を明瞭かつ自然に訳す。
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: 別の姿で
  rationale: ἑτέραが示す相違と、μορφήが表す姿・形を簡潔に保持し、その相違の性質は説明しすぎない。
- source_word: πορευομένοις εἰς ἀγρόν
  choice: 田舎へ向かって
  rationale: πορεύομαιの目的を伴う移動を「向かって」で表し、περιπατέωとの不自然な重複を避ける。ἀγρόςはこの文脈では個別の畑より田園・田舎を指す可能性が高い。
theological_decisions:
- issue: ἐν ἑτέρᾳ μορφῇが述べる復活後の顕現の性質
  choice: 「別の姿で」と記述的に訳し、どのように異なっていたかは説明しない。
  alternative: 「違った外見で」または「別の形で」
  rationale: 本文はイエスが別のμορφήで現れたと述べるが、それが身体的変化、見え方、認識の問題のいずれかを特定していないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「その後」は逐語的な「これらのことの後」より自然であり、叙述の順序を十分に保つ。主語「イエス」はギリシア語では省略されているが、文脈上の指示対象を日本語で明確にするため補った。
