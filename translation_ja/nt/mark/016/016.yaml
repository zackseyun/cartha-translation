id: MRK.16.16
reference: Mark 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: ja
  text: 信じて洗礼を受けた者は救われる。しかし、信じなかった者は罪に定められる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: 信じた者
  rationale: 定冠詞を伴うアオリスト分詞の名詞的用法を、代表単数の「者」で表した。本文では後続の分詞と自然につなげて「信じて」とした。
- source_word: βαπτισθεὶς
  choice: 洗礼を受けた
  rationale: アオリスト受動分詞の受動態を明示し、未来の「救われる」に先立つ行為として自然な日本語で表した。
- source_word: σωθήσεται
  choice: 救われる
  rationale: 未来受動形を保ち、この文脈における救済の意味を、余分な教理的説明を加えずに表した。日本語では文脈上、未来の帰結として自然に理解できるため「だろう」は加えなかった。
- source_word: ὁ δὲ ἀπιστήσας
  choice: しかし、信じなかった者
  rationale: δέの対照を「しかし」で示し、ἀπιστέωを前半の「信じる」と対応する否定表現で訳した。名詞的分詞の代表単数は「者」で保った。
- source_word: κατακριθήσεται
  choice: 罪に定められる
  rationale: 未来受動形と、不利な裁きを受けて有罪とされる意味を、聖書本文にふさわしい明瞭で定着した日本語で表した。
- source_word: καὶ
  choice: て
  rationale: 二つの分詞を結ぶ単純な並列を、日本語として自然な連用接続「信じて洗礼を受けた」で表した。
theological_decisions:
- issue: 信仰・洗礼と救いとの関係
  choice: 信じることと洗礼を受けることの両方を、救われる者について本文が述べるとおり並べた。
  alternative: 洗礼を救いの手段として明示する訳、または洗礼を付随的なものとして弱める訳。
  rationale: ギリシャ語は二つの分詞をκαὶで結んで救われる者を描写する一方、後半で罪に定められるのは「信じなかった者」であり、「洗礼を受けなかった者」とは明記しない。この緊張を解消せず、そのまま訳文に残した。
- issue: 男性単数の名詞的分詞
  choice: 「者」という代表単数で訳した。
  alternative: 「人々」のような複数表現、または男性だけを指すと受け取られ得る表現。
  rationale: 原文の単数構文を保ちつつ、日本語で性別を限定しない一般的な用法として自然に表した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての簡潔さと品位を保った。「信じて洗礼を受けた」は、二つのアオリスト分詞を重くなりすぎない日本語で表す。「罪に定められる」は「有罪とされる」よりやや聖書的な語調だが、現代の読者にも理解できる。
