base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: ja
  text: 彼女は行って、イエスと共にいた人たちにそのことを知らせた[a]。その人たちは悲しみ、泣いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「告げた」「報告した」とも訳せる。
    reason: ἀπαγγέλλωには、知らせる、告げる、報告するという意味範囲があるため。
lexical_decisions:
- source_word: ἐκείνη
  choice: 彼女
  rationale: 直前のマグダラのマリアを指す指示代名詞。日本語では文脈上「彼女」が自然であり、「その女」のような不要な距離感を避ける。
- source_word: πορευθεῖσα
  choice: 出かけて行き
  rationale: 主動詞に先立つ移動を表すアオリスト分詞。「行き」だけよりも、その場を離れて知らせに向かった動作を明瞭に表す。
- source_word: ἀπήγγειλεν
  choice: そのことを知らせた
  rationale: 伝言・報告を届ける意味。目的語はギリシア語本文では明示されないため、「そのこと」は直前の復活したイエスとの出会いを文脈から補った表現である。
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: かつてイエスと一緒にいた人たちに
  rationale: 過去にイエスと共にいた一団を指す。「彼と」では日本語で指示対象が曖昧になりやすいため、文脈上の指示対象であるイエスを明示した。
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: 悲しみ嘆き、泣いていた
  rationale: πενθέωの喪失を悼む深い悲しみと、κλαίωの実際に泣く行為の両方を保つ。現在分詞が表す、その知らせを受けた人々の継続中の状態を「ていた」で示した。
