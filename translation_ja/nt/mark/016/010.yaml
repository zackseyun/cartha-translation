  terminology: 「イエスと共にいた人たち」は τοῖς μετ’ αὐτοῦ γενομένοις を自然に表す。「悲しみ」は πενθοῦσι、「泣いていた」は κλαίουσιν に対応し、両者の区別も保たれる。脚注の「告げた」は ἀπήγγειλεν の可能な訳語だが、「報告した」も同じ語の意味範囲に含まれるため、脚注で併記する。
