source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: ja
  text: そこで、主イエスは彼らに語った後、天に上げられ、神の右に座られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: こうして
  rationale: 推論を伴うまとめと場面の移行を示す連語。現代日本語では「こうして」が文脈を受けた帰結を自然かつ簡潔に表す。
- source_word: κύριος Ἰησοῦς
  choice: 主イエス
  rationale: κύριοςを新約聖書で定着した称号「主」とし、人名Ἰησοῦςと自然に結び付ける。ギリシア語の冠詞は日本語では明示しない。
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: 彼らに語った後
  rationale: μετά＋冠詞付き不定詞の時間的前後関係を明確にし、αὐτοῖςを「彼らに」、λαλέωを文体にふさわしい「語る」で表す。
- source_word: ἀνελήμφθη
  choice: 上げられ
  rationale: アオリスト受動態を受動表現で保ち、動作主体を本文以上に特定しない。目的地は続く「天に」が示す。
- source_word: εἰς τὸν οὐρανόν
  choice: 天に
  rationale: 方向・到達点を表すεἰςを、日本語として自然な「天に」で表現する。「天の中へ」は不自然で過度に空間化するため避ける。
- source_word: ἐκάθισεν
  choice: 座られた
  rationale: 座に着いた完結的な行為を表す。主イエスを主語とする文として自然な敬意を示しつつ、原文にない説明を加えない。
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: 神の右に
  rationale: ἐκ δεξιῶνは位置を示す聖書的慣用句。「神の右」は簡潔で定着した日本語であり、栄誉ある位置という含意を説明として本文に加えない。
theological_decisions:
- issue: 昇天と高挙の表現
  choice: 天に上げられ、神の右に座られた
  alternative: 天に迎え上げられ、神の右の座に着かれた
  rationale: 原文の受動態と二つの動作を直接保つ。「迎え」や「座」という補足語を加えず、誰が上げたかも本文以上には明示しない。
- issue: κύριοςのキリスト論的称号
  choice: 主イエス
  alternative: 主人イエス
  rationale: 「主」はκύριοςの神学的重みと新約聖書における定着した称号性を保つ。「主人」では社会的な意味に狭まりうる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で格調ある叙述とした。「座られた」は現代日本語の敬語として自然である一方、過度に古風な語法を避けている。
