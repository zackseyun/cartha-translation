  terminology: μνημεῖονは「墓」、τρόμοςは「震え」、ἔκστασιςは単なる平静な驚きより強い「驚愕」とする。κήρυγμαは脚注で「宣言」より「宣教」とするほうが定着した意味に適うが、特定教派的な含意は加えない。
