source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: ja
  text: 彼女たちは墓から出て、逃げ去った。[a] 震えと驚愕が彼女たちを襲っていたからである。そして、だれにも何も言わなかった。彼女たちは恐れていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は、いわゆる「短い結末」を加えている。「彼女たちは、命じられていたことをすべて、ペテロの周りにいた人々に手短に知らせた。その後、イエスご自身も彼女たちを通して、東から西に至るまで、永遠の救いの聖なる、朽ちることのない宣教を送り出された。アーメン。」
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: 出ると
  rationale: 女性たちを指すアオリスト分詞を、主動詞「逃げ去った」に先立つ動作として自然な日本語で表した。
- source_word: ἔφυγον
  choice: 逃げ去った
  rationale: φεύγωの切迫した動きを明確に示し、「立ち去った」より強い語感を保った。
- source_word: μνημείου
  choice: 墓
  rationale: 復活物語の文脈における岩窟墓を指す一般的で明瞭な訳語を用いた。
- source_word: εἶχεν αὐτὰς
  choice: 捕らえられていた
  rationale: 震えと驚きが彼女たちを支配していたという感情表現の強さと、未完了過去の継続性を表した。
- source_word: τρόμος
  choice: 震え
  rationale: 恐怖による身体的な震えを具体的に示し、後段の「恐ろしかった」との不必要な重複を避けた。
- source_word: ἔκστασις
  choice: 驚き
  rationale: この文脈では我を忘れるほどの衝撃・驚愕を表す。現代日本語で誤解を招きやすい「恍惚」は避けた。
- source_word: οὐδενὶ οὐδὲν
  choice: だれにも何も
  rationale: 二重の全面否定を、自然で強調の明瞭な日本語として保持した。
- source_word: ἐφοβοῦντο
  choice: 恐ろしかった
  rationale: 恐怖が続いていた状態を自然な日本語で表し、理由を示す文としてマルコの唐突な結末を保った。
- source_word: γάρ
  choice: からである
  rationale: 二つのγάρはいずれも直前の行動の理由を示すため、因果関係を明瞭にしつつ、最後の説明的で唐突な終わり方を保持した。
theological_decisions:
- issue: マルコ16章8節後の「短い結末」の扱い
  choice: 本文には含めず、異文として脚注に収録する。
  alternative: 短い結末を本文に含める、または複数の結末を本文に併記する。
  rationale: SBLGNTでは当該部分が二重角括弧に入れられ、本文としての確実性に重大な疑義が示されている。主要本文を訳しつつ、写本上の異文は透明性のため脚注に全文掲載した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、叙事の緊迫感と、最後のγάρで終わる原文の唐突さを残した。「逃げ去った」「捕らえられていた」はやや格調を保ちつつ一般読者にも理解しやすい表現である。
