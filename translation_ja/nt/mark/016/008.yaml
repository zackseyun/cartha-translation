revisions:
- from: 彼女たちは墓から出ると、そこから逃げ去った。[a] 震えと驚きに捕らえられていたからである。そして、だれにも何も言わなかった。恐ろしかったからである。
  to: 彼女たちは墓から出て、逃げ去った。[a] 震えと驚愕が彼女たちを襲っていたからである。そして、だれにも何も言わなかった。彼女たちは恐れていたからである。
  rationale: 本文冒頭の場所表現の重複を除き、ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείουの順序と切迫感を保った。「驚愕」と「襲っていた」により、ἔκστασιςおよびεἶχεν αὐτὰςの強い表現を明瞭にした。結びは「恐れていたからである」として、ἐφοβοῦντοの継続的な恐れと原文の説明的で急な終止を保持した。脚注は異文の地位を明示しつつ、κήρυγμαを「宣教」とした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:32:07Z'
