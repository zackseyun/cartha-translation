  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: ja
  text: すると、彼は彼女たちに言った。「うろたえないでください。あなたがたは、十字架につけられたナザレのイエス[a]を捜しているのですね。イエスはよみがえられました[b]。ここにはいません。ご覧なさい。ここが、彼を置いた場所です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ナザレ人」または「ナザレの者」。ギリシア語は、ナザレに由来する呼称を用いている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「よみがえりました」または「復活しました」。ギリシア語の動詞は受動態で、「よみがえられました」と訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: ひどく驚かないでください
  rationale: 単なる意外さではなく、強い驚きと動揺を表す。現代日本語として自然で、墓での遭遇による強い反応を伝える。
- source_word: Ναζαρηνὸν
  choice: ナザレ人
  rationale: ナザレに由来する形容詞的な呼称を、説明句に言い換えすぎず簡潔に保つ。
- source_word: ἐσταυρωμένον
  choice: 十字架につけられた
  rationale: 完了分詞が示す、すでに起きた出来事に基づくイエスの特定を自然な日本語で表す。
- source_word: ἠγέρθη
  choice: よみがえらされました
  rationale: アオリスト受動態を保ち、復活がイエスに対してなされた出来事として語られていることを明示する。行為者は原文同様に明記しない。
- source_word: ὧδε
  choice: ここには
  rationale: 場所を指す副詞を簡潔で自然な日本語にした。否定文の焦点を自然に示すため係助詞「は」を添えた。
- source_word: ἴδε
  choice: ご覧なさい
  rationale: 聞き手の注意をその場所へ強く向ける命令を、現代的で品位ある表現にした。
- source_word: τόπος
  choice: 場所
  rationale: 墓の中の具体的な位置を指しつつ、原語の一般的な語義を保つ。
- source_word: ἔθηκαν
  choice: 納めた
  rationale: 埋葬の文脈で遺体を置いたことを自然かつ丁重に表す。主語が明示されていないため「人々」を補った。
- source_word: ζητεῖτε
  choice: 捜しているのでしょう
  rationale: 現在形の継続的な動作を表し、文脈上、相手の目的を確認する発言として自然な日本語にした。
- source_word: λέγει αὐταῖς
  choice: 彼女たちに言った
  rationale: 原文は歴史的現在だが、日本語の物語文で不自然な時制の切り替えを避け、出来事の叙述として自然な過去形にした。
theological_decisions:
- issue: 復活表現の態と行為者
  choice: イエスはよみがえらされました
  alternative: イエスはよみがえりました／復活しました
  rationale: ἠγέρθηの受動態を本文で保ちつつ、明示されていない行為者を「神」と補わない。これにより復活の主張と原文の含みをともに保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、天使的な使者の告知にふさわしい簡潔さと品位を保った。「よみがえらされました」は日常語としてやや marked だが、原文の受動態と神学的含意を安易に解消しないため採用した。
