review_pass:
  verdict: revise
  source_fidelity: 「弟子たち」「出て行き、至る所で宣べ伝えた」は文脈と原文に適合する。「主も」はδέの弱い接続を不必要に「も」で強調しうるため、「主は」とするのがより中立的である。また、βεβαιοῦντοςは主が能動的に「確証した」のであり、「確かなものとされた」は不自然な敬語的受動表現で、統語上も曖昧になる。「後に伴うしるし」は現代日本語として不自然である。
  naturalness: 「主は彼らと共に働き、伴うしるしによって、そのことばを確証された」とすれば、明瞭な現代標準語でありながら本文にふさわしい品位を保てる。「宣べ伝えた」と「しるし」はこの文脈では定着した理解可能な語である。
  terminology: κύριοςは「主」、λόγοςは「ことば」、σημεῖαは「しるし」として一貫している。「確証する」はβεβαιόωの『確認・確立する』という働きを明瞭に表す。本文は、しるしが具体的にことば・宣教・宣教者のどれに伴うかを限定しない。
  issues:
  - severity: medium
    issue: 「確かなものとされた」
    rationale: 原文の主語は主であり、βεβαιοῦντοςは能動的に『確証している』ことを表す。この訳は敬語的な受動形となっており、主が行為者であることが不明瞭である。
  - severity: medium
    issue: 「後に伴うしるし」
    rationale: ἐπακολουθούντωνは『後に続く／伴う』の含みを持つが、日本語の「後に伴う」は不自然である。「伴うしるし」で自然に訳し、修飾関係を過度に特定しない。
  - severity: low
    issue: 「主も」
    rationale: 原文のδέはここでは穏やかな叙述の接続であり、「も」は弟子たちとの並列・追加をやや強く示す。「主は」の方が中立的で自然である。
  - severity: low
    issue: 写本注の表現
    rationale: 「最古級の重要な写本の一部」はやや曖昧である。「最も古い重要な写本のいくつか」とすると、長い結びが欠ける写本と異なる結びを持つ写本があるという本文伝承上の状況を平明に伝えられる。
