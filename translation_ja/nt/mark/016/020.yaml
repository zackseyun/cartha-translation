  to: 弟子たちは出て行き、至る所で宣べ伝えた。主は彼らと共に働き、伴うしるしによって、そのことば[a]を確証された。[b]
  rationale: 主が宣教者たちと共に働き、しるしを通して宣べ伝えられたことばを確証するという属格独立構文の内容を、自然な能動文で表した。「伴うしるし」はἐπακολουθούντωνの『後に続く／伴う』という幅を保ち、対象を本文で補足しない。写本注は与えられたSBLGNT本文を訳すことを妨げず、長い結びに関する重要な本文伝承上の問題を簡潔に示す。
