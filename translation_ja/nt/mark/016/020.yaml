  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: ja
  text: 弟子たちは出て行き、至る所で宣べ伝えた。主は彼らと共に働き、伴うしるしによって、そのことば[a]を確証された。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は、ここでは宣べ伝えられた知らせ、すなわちメッセージを指す。
    reason: lexical_alternative
  - marker: b
    text: マルコ16:9–20は、最も古い重要な写本のいくつかにはなく、結び方の異なる写本もある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: 弟子たちは
  rationale: 指示代名詞は直前までの弟子たちを指す。日本語では単なる「彼ら」より指示対象を自然に明示できる。
- source_word: ἐξελθόντες ἐκήρυξαν
  choice: 出て行き、宣べ伝えた
  rationale: アオリスト分詞を主動詞に伴う先行動作として自然に表し、κηρύσσωの公的な告知の意味を「宣べ伝える」で保った。
- source_word: πανταχοῦ
  choice: 至る所で
  rationale: 場所を限定しない「どこでも、あらゆる所で」という意味を、簡潔で品位ある日本語にした。
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: 主も彼らと共に働き
  rationale: 属格独立構文の同時的・付帯的な働きを自然な接続で表し、συνεργέωの共同して働く意味を保持した。
- source_word: τὸν λόγον
  choice: そのことば
  rationale: λόγοςの伝統的かつ原語に近い表現を採りつつ、「その」によって宣べ伝えられた内容を指すことを示した。意味上は「メッセージ」も可能なので脚注に示した。
- source_word: βεβαιοῦντος
  choice: 確かなものとされた
  rationale: しるしによって宣教内容の真実性・確実性を裏づける意味を表す。主を主語として敬語的な「された」を用いた。
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: 後に伴うしるしによって
  rationale: διά＋属格の手段を「によって」で示し、ἐπακολουθέωが持つ「後に続く」と「伴う」の両面を、不自然にならない範囲で残した。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文では「主」とし、文脈上は復活したイエスを指す
  alternative: 神一般を指すと理解する
  rationale: 直前の16:19でイエスが「主」と呼ばれているため、その指示が自然に継続する。ただし本文に「イエス」を補わず、原文の称号を保持した。
- issue: しるしの機能
  choice: しるしは宣べ伝えられたことばを確証する手段として描かれる
  alternative: しるしは単に宣教者たちの後に続いたと理解する
  rationale: βεβαιοῦντοςとδιά句の構文上の結びつきは、しるしによる確証を示す。この節を越えて、しるしの継続期間や規範性については判断を加えない。
- issue: マルコ16章末尾の本文伝承
  choice: 与えられたSBLGNT本文を訳し、長い結末に関する写本上の問題を脚注で示す
  alternative: 本文伝承の注記を置かない
  rationale: 16:9–20は重要な写本差異を伴うため、読者に本文史上の情報を簡潔に知らせることが適切である。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、聖書本文にふさわしい品位を保った。「宣べ伝える」「しるし」は一般読者にも理解可能な定着表現として用いた。原文の「後に続く／伴う」という含みを保持し、しるしがことばに伴うのか宣教者に伴うのかを本文で過度に限定していない。
