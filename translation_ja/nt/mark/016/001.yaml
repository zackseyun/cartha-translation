  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: ja
  text: 安息日が終わってから、マグダラのマリア、ヤコブの母マリア[a]、サロメは、イエスのもとへ行って、その体に塗るために香料を買った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では字義的に「ヤコブの〔者〕」。ヤコブとの関係によって区別されたマリアを指し、伝統的にヤコブの母と理解されている。
    reason: 原文の省略表現と、本文で補った親族関係を示すため。
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: 安息日が終わると
  rationale: 属格独立構文が主動作に先立つ時を示すため、自然な現代日本語で時間関係を明確にした。
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: マグダラのマリア
  rationale: 日本語で広く定着している地名由来の呼称を用いた。
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: ヤコブの母マリア
  rationale: ギリシア語は字義的には「ヤコブの〔者〕」という省略表現である。文脈上一般に母を指すと理解されるため本文では自然に補い、原文の省略は脚注に示した。
- source_word: Σαλώμη
  choice: サロメ
  rationale: 日本語で定着した人名表記を用いた。
- source_word: ἠγόρασαν
  choice: 買った
  rationale: 単純な物語叙述に合う、平明で直接的な訳語である。
- source_word: ἀρώματα
  choice: 香料
  rationale: 埋葬の処置に用いる芳香性の物質を指す。「香料」は「香水」より具体的な物質を広く含み、この文脈に自然である。
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: 行ってイエスに塗るため
  rationale: ἵναの目的と、ἐλθοῦσαιに示される移動後の動作順序を自然な日本語で表した。日本語では話者の位置を基準に「行って」とするのが自然であり、αὐτόνは文脈上の指示対象を明確にするため「イエス」とした。
- source_word: ἀλείψωσιν
  choice: 塗る
  rationale: 香料や香油を身体に塗り付ける行為を直接表す。宗教儀礼としての含意を過度に加えうる「油を注ぐ」は避けた。
theological_decisions:
- issue: Μαρία ἡ τοῦ Ἰακώβου における関係語の補充
  choice: ヤコブの母マリア
  alternative: ヤコブのマリア
  rationale: 原文は関係を明示しない省略表現だが、マルコ福音書の人物同定の文脈では母を指すとの理解が最も自然である。ただし原文に「母」という語自体はないため脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。葬りの場面にふさわしい語を用いつつ、専門的・典礼的な表現に偏らないようにした。
