source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: ja
  text: 彼らも、イエスが生きておられ[a]、彼女に見られた[b]と聞いたが、信じなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「生きている」。ギリシア語は現在形である。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼女に目撃された」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: 彼らも
  rationale: καίとἐκεῖνοιの結合で、直前に言及された人々を指しつつ、物語のつながりと付加のニュアンスを示す。「彼らも」は簡潔で自然。
- source_word: ἀκούσαντες
  choice: 聞いたが
  rationale: アオリスト分詞を時間的に捉え、主動詞との逆接的な文脈関係を日本語で自然に示した。逆接は語の辞書的意味ではなく、聞いてなお信じなかったという文脈から生じる。
- source_word: ὅτι
  choice: と
  rationale: 聞いた内容を導く接続表現として、現代日本語の引用・内容節に自然な「と」を用いた。
- source_word: ζῇ
  choice: 生きておられ
  rationale: 現在形による継続的な生を保ち、イエスへの敬意を自然な日本語で表す。「復活した」とはせず、原文の表現を保持した。
- source_word: καὶ
  choice: 、
  rationale: 二つの伝聞内容を並列している。日本語では「生きておられ、彼女に…」という連用的接続が自然で、並列関係も明確。
- source_word: ἐθεάθη
  choice: 目撃された
  rationale: θεάομαιのアオリスト受動を受動のまま表し、単に一瞥したのでなく実際に見たという含意を簡潔に伝える。「現れた」として主体的顕現に意味を寄せることは避けた。
- source_word: ὑπ’ αὐτῆς
  choice: 彼女に
  rationale: 行為者を示すὑπό句を日本語の受動文に自然な「彼女に」で表した。文脈上の人物名を補わず、代名詞を保持した。
- source_word: ἠπίστησαν
  choice: 信じなかった
  rationale: 報告を信じなかったことを、解釈的な強意を加えず直接的な現代日本語で表した。
theological_decisions:
- issue: 復活後の生を表す現在形 ζῇ
  choice: 生きておられ
  alternative: 生き返っておられ／生きている
  rationale: 原文は「復活した」に相当する動詞ではなく、現在形で「生きている」と述べる。継続する生を保ちつつ、日本語として自然な敬意表現を用いた。
- issue: ἐθεάθη の受動表現
  choice: 彼女に目撃された
  alternative: 彼女に姿を現された／彼女に見られた
  rationale: 受動形を保持して、彼女が実際に見たという原文の視点を伝えた。「姿を現された」は顕現の主体性を明示しすぎる可能性があり、「見られた」は偶然または評価の意味にも取れうる。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。イエスについては「生きておられ」と敬意を示す一方、過度に宗派的・古語的な表現を避けた。脚注記号は該当語句の直後に置いた。
