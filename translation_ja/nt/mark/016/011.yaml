  naturalness: 「彼らも、…聞いたが、信じなかった」は明瞭で自然である。「彼女に目撃された」は意味を取り違えてはいないが、現代標準日本語では「彼女に見られた」のほうが自然で、余分な含みもない。
  terminology: 「イエスが生きておられ」は、原文の現在形を保ち、本文の叙述にふさわしい敬意も表している。「復活された」「姿を現された」など、原文にない解釈的表現を加えない点も適切である。
