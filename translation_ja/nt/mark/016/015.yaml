  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: ja
  text: そして彼は彼らに言った。「全世界へ出て行き、すべての被造物に[a]良い知らせ[b]を告げ知らせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「創造全体に」。ギリシア語は、個々の被造物を指すとも、創造全体を一つのまとまりとして指すとも理解できます。
    reason: alternative_reading
  - marker: b
    text: または「福音」。ギリシア語の εὐαγγέλιον は「良い知らせ」を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: 出て行き
  rationale: 主命令に先立つアオリスト分詞で、ここでは付帯状況として命令の力を帯びる。日本語では「出て行き」として、宣教への派遣の力を自然に表した。
- source_word: εἰς τὸν κόσμον ἅπαντα
  choice: 全世界に
  rationale: εἰς の方向性と、ἅπαντα が示す全体性を簡潔に保つ。「世界中に」よりも原文の普遍的な範囲が明瞭である。
- source_word: κηρύξατε
  choice: 宣べ伝えなさい
  rationale: 公に告げ知らせる κηρύσσω の意味を表す、現代日本語の聖書文体として定着した表現。「説教しなさい」より教会内の行為に限定されにくい。
- source_word: τὸ εὐαγγέλιον
  choice: 良い知らせ
  rationale: εὐαγγέλιον の語義を一般読者にも直接伝える表現とした。伝統的な訳語「福音」は脚注に残した。
- source_word: πάσῃ τῇ κτίσει
  choice: 造られたものすべてに
  rationale: κτίσις が持つ「創造されたもの／被造物」の幅を保ち、個々への分配的な読みと創造全体を指す集合的な読みの双方を排除しない自然な表現とした。
- source_word: εἶπεν αὐτοῖς
  choice: 彼は彼らに言った
  rationale: 主語が文脈から補われることを「彼」で示し、λέγω と与格 αὐτοῖς を過度な解釈を加えずに訳した。
theological_decisions:
- issue: πάσῃ τῇ κτίσει が示す宣教の範囲
  choice: 造られたものすべてに
  alternative: あらゆる被造物に／すべての造られたものに
  rationale: 原文は、個々の被造物を指す分配的な理解と、創造全体を指す集合的・宇宙的な理解の両方を許す。人間だけを意味する「すべての人に」へ狭めず、その広がりと緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令の力と公的な宣言の響きを保った。「被造物」は本文ではやや専門的に響くため、より平明な「造られたものすべて」を採用し、伝統的表現は脚注に示した。
