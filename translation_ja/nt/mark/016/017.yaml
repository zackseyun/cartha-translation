  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: ja
  text: 信じた人々には、次のようなしるしが伴う。彼らはわたしの名によって悪霊を追い出し、新しいことば[a]を語る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「新しい言語」とも訳せる。原語は「舌」のほか「言語」を意味し、ここでどのような発話を指すかは明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: しるし
  rationale: 単なる奇跡ではなく、何かを示し証しする出来事という語の含みを保つ。
- source_word: τοῖς πιστεύσασιν
  choice: 信じた人々
  rationale: アオリスト分詞が示す、信仰に入った人々という側面を自然な日本語で表しつつ、一般的な指示として読める形にした。
- source_word: ταῦτα
  choice: 次のような
  rationale: 後続する列挙を指す前方照応を、日本語として明瞭に表した。
- source_word: παρακολουθήσει
  choice: 伴う
  rationale: 時間的に後から『従う』というより、信じた人々に付随するという意味を表す。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの名と権威に基づく行為を示す、日本語として自然な表現。
- source_word: δαιμόνια
  choice: 悪霊
  rationale: 日本語聖書で広く理解される語であり、超自然的な邪悪な霊的存在を指す文脈に適する。
- source_word: ἐκβαλοῦσιν
  choice: 追い出し
  rationale: 排除・駆逐の力を自然に伝え、悪霊追放の文脈にも適する。
- source_word: γλώσσαις
  choice: 異言
  rationale: 現象を特定の人間言語または恍惚的発話に限定せず、原語がこの文脈で持つ解釈上の幅を保つ。
- source_word: λαλήσουσιν
  choice: 語る
  rationale: λαλέωの通常の意味を、簡潔で品位ある現代日本語にした。
- source_word: καιναῖς
  choice: 新しい
  rationale: 種類・性質における新しさの詳細を限定せず、原語を直接的に表す。
theological_decisions:
- issue: 「新しい異言」が指す現象
  choice: 本文では「異言」とし、人間の諸言語か、通常とは異なる霊的発話かを限定しない。
  alternative: 「新しい言語」
  rationale: γλῶσσαには舌・言語の意味があり、この節だけでは現象の性質を厳密に定められないため、特定の教派的理解に解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、簡潔ながら聖書本文としての品位を保った。「しるし」「異言」は文脈上重要な用語として保持した。
