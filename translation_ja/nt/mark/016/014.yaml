id: MRK.16.14
reference: Mark 16:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: ja
  text: その後[a]、イエスは、食事の席で横になっていた十一人に現れ[b]、彼らの不信仰と心のかたくなさを責めた。よみがえらされたイエスを見た人たちを、彼らが信じなかったからである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「後になって」。
    reason: lexical_alternative
  - marker: b
    text: 当時は食事の際、寝台などに横になる習慣があった。
    reason: cultural_note
  - marker: c
    text: 「よみがえったイエスを見た人たち」とも訳せる。ギリシア語は、より直訳的には「よみがえらされた彼を見た人たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: その後
  rationale: 後に起こった出来事であることを示す時間副詞として、自然で明瞭な現代日本語を用いた。
- source_word: ἀνακειμένοις
  choice: 食事の席で横になっていたとき
  rationale: 古代の食事時の姿勢を表す分詞の意味を保ち、現代の読者にも場面が分かるよう食事の席であることを明示した。
- source_word: τοῖς ἕνδεκα
  choice: 十一人
  rationale: ユダを失った後の使徒の一団を指す定着した簡潔な表現とした。
- source_word: ἐφανερώθη
  choice: 現れ
  rationale: 復活後の顕現という文脈で、受動形の意味を日本語として自然に表す。
- source_word: ὠνείδισεν
  choice: 責めた
  rationale: 強い非難を表しつつ、古風すぎない明瞭な語を選んだ。
- source_word: ἀπιστίαν
  choice: 不信仰
  rationale: 証言を信じなかったことを直接指す名詞であり、原語の宗教的・倫理的な重みも保つ。
- source_word: σκληροκαρδίαν
  choice: 心のかたくなさ
  rationale: 内面の頑迷さを示す聖書的な心の比喩を保持した。
- source_word: θεασαμένοις
  choice: 見た人々
  rationale: 復活したイエスの目撃者を指す分詞を、簡潔で直接的に訳した。
- source_word: ἐγηγερμένον
  choice: よみがえらされたイエス
  rationale: 完了受動分詞の受動性と、よみがえった状態が続いている含意を可能な限り保った。
- source_word: οὐκ ἐπίστευσαν
  choice: 信じなかった
  rationale: この顕現以前に目撃者の証言を受け入れなかった事実を、文脈上明瞭に表した。
theological_decisions:
- issue: ἐγηγερμένονにおける復活の表現
  choice: よみがえらされたイエス
  alternative: 復活したイエス／よみがえったイエス
  rationale: 原語の完了受動分詞を保ち、能動・自動詞的な表現へ一方的に解消しないようにした。行為者は本文どおり明示しない。
- issue: σκληροκαρδίαの比喩性
  choice: 心のかたくなさ
  alternative: 頑固さ
  rationale: 単なる性格上の頑固さに狭めず、霊的な抵抗を含みうる原文の「心」の比喩を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体とした。「心のかたくなさ」という比喩と、復活を表す受動形は平板化せず保持した。
