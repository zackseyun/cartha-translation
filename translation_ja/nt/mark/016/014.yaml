  to: その後[a]、イエスは、食事の席で横になっていた十一人に現れ[b]、彼らの不信仰と心のかたくなさを責めた。よみがえらされたイエスを見た人たちを、彼らが信じなかったからである[c]。
  rationale: 原文の構文により近づけるため、イエスが「十一人に現れた」ことを明確にし、「見た人々の言うこと」という補足を除いて、目撃者自身を信じなかったという表現に改めた。復活表現の受動性、心の比喩、食事時の姿勢に関する注は保持した。
