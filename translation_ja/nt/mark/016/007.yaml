  to: しかし、行って、あの方の弟子たちとペテロ[a]に伝えなさい。『あの方はあなたがたより先にガリラヤへ[b]行かれます。そこであなたがたは、あの方があなたがたに言われたとおりに、あの方を見るでしょう。』
