id: MRK.16.7
reference: Mark 16:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: ja
  text: しかし、行って、あの方の弟子たちとペテロ[a]に伝えなさい。『あの方はあなたがたより先にガリラヤへ[b]行かれます。そこであなたがたは、あの方があなたがたに言われたとおりに、あの方を見るでしょう。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ペテロは「あの方の弟子たち」とは別に名を挙げられている。これは、否認したペテロの回復を示唆している可能性があるが、ギリシア語は「特にペテロ」と明記してはいない。
    reason: alternative_reading
  - marker: b
    text: 「ガリラヤに入って行かれます」とも訳せる。ここで用いられているギリシア語の前置詞は、文脈により目的地への移動と、その中へ入る動きのどちらも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の文脈との強い対照と、命令への転換を簡潔に示す。
- source_word: ὑπάγετε
  choice: 行って
  rationale: 複数への現在命令を、後続する「伝えなさい」と自然につながる現代日本語で表した。
- source_word: εἴπατε
  choice: 伝えなさい
  rationale: 与格で示された相手に続く内容を告げる命令なので、「言いなさい」より自然な「伝えなさい」とした。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: あの方の弟子たち
  rationale: αὐτοῦの所有関係を明示しつつ、直前に指し示されたイエスを敬意ある自然な日本語で受けた。
- source_word: καὶ τῷ Πέτρῳ
  choice: とペテロ
  rationale: καίによる単純な並列を保ち、「特に」や「ペテロを含む」などの解釈を本文に加えなかった。
- source_word: ὅτι
  choice: 直接引用
  rationale: 告げるべき内容を導く接続詞を、日本語で明瞭かつ自然な直接話法として表した。
- source_word: Προάγει ὑμᾶς
  choice: あなたがたより先に…行かれます
  rationale: προάγωの先行する動きを保ち、主語であるイエスへの敬意を自然な敬語で表した。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ
  rationale: 目的地への方向を示すεἰςを、現代日本語で自然な「へ」と訳した。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 直前のガリラヤを指す場所の副詞として自然に表した。
- source_word: αὐτὸν ὄψεσθε
  choice: あなたがたはあの方を見ます
  rationale: 未来の視認・対面を表す語を過度に解釈せず、基本義の「見る」で訳した。
- source_word: καθὼς εἶπεν ὑμῖν
  choice: あの方があなたがたに言われたとおりです
  rationale: 以前の発言との一致を示すκαθώςを「とおり」とし、内容を補わずに保持した。
theological_decisions:
- issue: 「弟子たち」の後にペテロが別に挙げられていること
  choice: 「弟子たちとペテロ」と単純な並列を保つ
  alternative: 「弟子たち、特にペテロ」または「ペテロを含む弟子たち」
  rationale: ペテロの別記には否認後の回復を示唆する物語的・牧会的意義があり得るが、ギリシア語自体は「特に」や「含む」と明言していないため、その緊張を解消しない。
- issue: αὐτὸν ὄψεσθεが示す対面の性質
  choice: 「あの方を見ます」
  alternative: 「あの方に会います」
  rationale: 復活したイエスとの対面を含意し得るが、ὁράωの直接的な視覚表現を保ち、本文で「会う」と解釈的に限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、天使がイエスを指す表現には「あの方」、動詞には「行かれます」「言われた」を用いて節度ある敬意を示した。命令文は簡潔にし、直接引用によって伝言内容を明瞭に区切った。
