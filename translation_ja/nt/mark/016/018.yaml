  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: ja
  text: 彼らは蛇を手に取り、たとえ何か死に至るものを飲んでも、決して害を受けない。病人に手を置き、病人たちはよくなる。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 初期の写本の中には、マルコ16章9–20節を含まないものがある。本節は「マルコによる福音書の長い結び」に含まれる。
    reason: textual_variant
  - marker: b
    text: 直訳すると「よい状態になる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: 蛇
  rationale: 現代日本語で自然かつ明確な語であり、原語の複数形は総称的な「蛇」で十分に表せる。
- source_word: ἀροῦσιν
  choice: つかみ
  rationale: αἴρωには「持ち上げる、取り上げる」の意味があるが、蛇を物理的に手にする動作として「つかむ」が自然である。意図的に扱うか偶発的に拾うかは限定しない。
- source_word: κἂν
  choice: たとえ…ても
  rationale: καὶ ἐάνの条件に含まれる譲歩的な力を、後続する強い否定と調和する自然な日本語で表す。
- source_word: θανάσιμόν τι
  choice: 何か命にかかわるもの
  rationale: 「毒」に限定せず、死をもたらし得るもの全般を指す原語の広さを保つ。
- source_word: οὐ μὴ αὐτοὺς βλάψῃ
  choice: 決して害を受けない
  rationale: οὐ μήの強い否定を「決して」で示し、βλάπτωは身体的な損傷に限定しない「害」で訳す。
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: 病人に手を置く
  rationale: 手を人の上に置く動作を、日本語の聖書文体としても一般的な「手を置く」で簡潔に表す。
- source_word: καλῶς ἕξουσιν
  choice: その人たちはよくなる
  rationale: 字義的には「よい状態になる／よい状態でいる」。病人について述べる文脈に即しつつ、「癒やされる」と受動的な作用を明示せず自然に訳す。
theological_decisions:
- issue: 約束された保護と病人の回復の性質
  choice: 信じる者たちに伴う出来事として、本文どおり直接的に訳す。
  alternative: すべての時代の全信者に常に当てはまる規範、使徒時代だけのしるし、または象徴表現であると訳文で限定する。
  rationale: ギリシア語本文は将来の行為と結果を率直に述べている。継続説、終焉説、象徴説のいずれも訳文に持ち込まず、解釈上の緊張を保つ。
- issue: マルコ16章9–20節の本文批評上の位置
  choice: 提示されたSBLGNT本文を訳し、長い結びを欠く初期写本があることを脚注で明示する。
  alternative: 本節を省く、または本文自体を括弧に入れる。
  rationale: 指定された原文を翻訳する一方、重要な写本上の問題について読者に透明性を確保する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、断定の強さと聖書本文としての品位を保った。「命にかかわるもの」により対象を毒物だけに狭めず、「よくなる」によりκαλῶς ἕξουσινの表現を過度に神学化しないようにした。
