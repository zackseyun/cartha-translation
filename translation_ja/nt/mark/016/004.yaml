  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: ja
  text: 彼女たちは目を上げると、石がすでに転がされているのを見た[a]。その石は非常に大きかったのだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「石がすでに転がされ、その状態にあるのに気づいた」。ギリシア語の完了形は、石がすでに転がされ、その結果として転がされた状態にあったことを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: 目を上げると
  rationale: 女性たちが墓の方へ視線を上げた動作を自然な現代日本語で表し、アオリスト分詞の先行・付帯的な関係を保った。
- source_word: θεωροῦσιν
  choice: 見えた
  rationale: 視覚によって石の状態を認めたことを、主語を不自然に繰り返さず明瞭に表した。歴史的現在は日本語の物語として自然な過去形にした。
- source_word: ὅτι
  choice: のが
  rationale: 知覚内容を示すὅτι節を、日本語では「〜のが見えた」という自然な構文で表した。
- source_word: ἀποκεκύλισται
  choice: すでに転がしてあった
  rationale: 完了受動の、石が転がされた結果その状態にあったという意味を「すでに」と「〜てあった」で表した。行為者は明示していない。
- source_word: ὁ λίθος
  choice: 石
  rationale: 文脈上、墓をふさいでいた特定の石であることが明らかなため、説明を加えず簡潔に訳した。
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: その石は非常に大きかった
  rationale: γάρの説明的関係を文脈と文の連続で示し、σφόδραの強意を「非常に」で保持した。
- source_word: καὶ
  choice: そして
  rationale: 前節から物語が続くことを示す単純な接続として訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「転がしてあった」は日本語では行為者を特定せず、完了受動の結果状態を自然に伝える。γάρは独立した第二文で説明関係を保った。
