- from: さて、イエスは週の初めの日の朝早くに復活し[a]、まずマグダラのマリアに現れた。このマリアから、イエスは七つの悪霊を追い出しておられた。
  to: 週の初めの日の早朝、イエスは復活した後[a]、最初にマグダラのマリアに現れた。このマリアから、イエスは七つの悪霊を追い出していた。
  rationale: 時間表現を「週の初めの日の早朝」として自然に配置し、復活が顕現に先行することを「復活した後」で明示した。「最初に」により出現の順序を保持した。敬語を除き、先行する追放行為を「追い出していた」とした。脚注記号は、二重角括弧で示される長い結末の本文批評上の問題を本文の読者に示すため保持した。
