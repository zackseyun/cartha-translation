  source_fidelity: 本文は主要な意味を正確に伝えている。ただし、Ἀναστὰς の主動詞に先行する時間関係は、「復活し」よりも「復活した後」のほうが現代日本語で明瞭に表せる。ἐκβεβλήκει は顕現より前に完了した行為であり、「追い出していた」が適切である。
  naturalness: 「さて」はδὲに対応し得るものの、この箇所ではなくても自然であり、英語監査記録の整理とも整合するため省く。「追い出しておられた」は敬語が原文にないため、明瞭な現代標準日本語として「追い出していた」に改める。
  terminology: 「復活」「マグダラのマリア」「悪霊」は適切である。「最初に」はπρῶτονの出現順序を「まず」より明確に示す。脚注は二重角括弧で示されるマルコ16:9–20全体の本文批評上の問題を適切に説明している。
