  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: ja
  text: 週の初めの日の早朝、イエスは復活した後[a]、最初にマグダラのマリアに現れた。このマリアから、イエスは七つの悪霊を追い出していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 9〜20節は、マルコによる福音書の一部の初期写本にはなく、これを含む写本にも異同が見られます。
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: 復活し
  rationale: ἀνίστημιのアオリスト分詞。主動詞「現れた」に先立つ出来事を表すが、日本語では文脈上順序が明瞭なため、自然な連用形とした。復活の文脈も明示できる。
- source_word: δὲ
  choice: さて
  rationale: 弱い接続を表す語であり、強い逆接を避けつつ談話の展開を示す。
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: 週の初めの日の朝早くに
  rationale: πρωῒは早朝、πρώτῃ σαββάτουは当時の慣用表現で週の第一日を指す。現代日本語として明瞭にまとめた。
- source_word: ἐφάνη
  choice: 現れた
  rationale: 復活後の顕現を表す文脈で、受動・中動形を日本語の自然な自動詞で表した。
- source_word: πρῶτον
  choice: まず
  rationale: 顕現の順序を示す副詞として、自然な日本語を選んだ。
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: マグダラのマリアに
  rationale: 地名に由来する呼称を、日本語聖書で広く理解される形で音写した。与格は顕現の相手として「に」で表した。
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: このマリアから、イエスは…追い出しておられた
  rationale: παράと属格による起点を「から」で表し、過去完了形による先行事実を「追い出しておられた」とした。主語を補って日本語の照応を明瞭にした。
- source_word: ἑπτὰ δαιμόνια
  choice: 七つの悪霊
  rationale: δαιμόνιονは福音書の悪霊追放の文脈で人格的な邪悪な霊的存在を指す。「悪霊」は現代日本語で理解しやすく、単なる抽象的な悪と誤解されにくい。
theological_decisions:
- issue: マルコ16章9節が長い結末に属することの本文批評上の位置づけ
  choice: 提示されたギリシア語本文を翻訳し、16章9〜20節が一部の初期写本にないことを脚注で明記する。
  alternative: 16章8節で本文を終え、9〜20節を翻訳本文から除外する。
  rationale: SBLGNTの提示本文は当該節を二重角括弧に入れて収録している。本文を訳しつつ重要な写本上の問題を読者に開示することで、証拠上の緊張を解消せず保持する。
- issue: Ἀναστὰςの時間的関係
  choice: 「復活し」と訳し、復活が顕現に先行することを自然な日本語の語順で示す。
  alternative: 「復活した後」と明示する。
  rationale: アオリスト分詞は主動詞に先行する時間関係として理解できるが、日本語では出来事の順序を並べるだけで十分明瞭であり、過度な説明を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。「イエス」を後半で補い、先行詞と動作主の混同を避けた。脚注記号[a]は本文中の「復活し」の直後に置いた。
