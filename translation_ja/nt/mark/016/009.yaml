    rationale: アオリスト分詞はここで顕現に先立つ復活を示すため、「復活した後」とするのが安全で明瞭である。
  - severity: low
    issue: 「追い出しておられた」に原文にない敬語が加わっている
    rationale: 叙述文の文体を保ちつつ、πλεーパーフェクトの先行した行為を「追い出していた」と表すことができる。
  - severity: low
    issue: 「さて」は必須ではない
    rationale: δέは弱い接続詞であり、日本語では無標で自然に訳せる。英語監査記録でも先頭の談話標識は除去されている。
