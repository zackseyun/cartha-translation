  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: ja
  text: そして、週の初めの日の非常に早く、日が昇ったとき、彼女たちは墓へ来る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「来る」はギリシア語の現在形。過去の出来事を生き生きと語る歴史的現在である。
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: 朝早く
  rationale: λίανによる強調を含む表現。日本語では「朝早く」が自然であり、文脈上も十分に早い時刻を示す。
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: 週の初めの日
  rationale: 字義的には「安息日（複数）の第一」に近いが、当時の慣用句として週の第一日を指すため、意味を明確に伝える。
- source_word: ἔρχονται
  choice: 来る
  rationale: マルコが用いる歴史的現在を保ち、叙述の生き生きとした調子を残す。
- source_word: ἐπὶ τὸ μνημεῖον
  choice: 墓へ
  rationale: 埋葬場所への移動を自然な現代日本語で表す。
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: 日が昇ったころ
  rationale: 属格独立構文が示す到着時の時間的状況を表し、「後」と断定して時間関係を必要以上に強めない。
