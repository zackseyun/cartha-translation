source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: ja
  text: 墓の中に入ると、女たちは右側に、白い長衣をまとった若者[a]が座っているのを見て、ひどく驚いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈および並行記事から、天使であると考えられる。マルコはここで「若者」と記している。
    reason: 本文の語義を保ちながら、人物の正体に関する文脈上の理解を示すため。
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: 墓の中に入ると
  rationale: 女性複数を受けるアオリスト分詞を時間的に解し、主動詞との関係を自然な現代日本語で表した。
- source_word: μνημεῖον
  choice: 墓
  rationale: 埋葬場所を指し、復活記事の文脈で簡潔かつ明瞭な訳語である。
- source_word: νεανίσκον
  choice: 若者
  rationale: 語そのものは若い男性を指し、この節では明示されていない「天使」という解釈を本文に持ち込まない。
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: 右側に……座っている
  rationale: 墓の内部での位置と姿勢を、自然な日本語の語順で表した。
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: 白い長衣をまとった
  rationale: 完了分詞の着衣状態と、στολήが示す丈のある衣を簡潔で品位ある表現にした。
- source_word: ἐξεθαμβήθησαν
  choice: ひどく驚いた
  rationale: 単なる驚きより強い衝撃を表す動詞であり、「ひどく」によってその強さを示しつつ、恐怖と断定しすぎないようにした。
theological_decisions:
- issue: νεανίσκοςの正体
  choice: 本文では「若者」と訳す。
  alternative: 「天使」と訳す。
  rationale: 白い衣や並行記事から天使的な使者と理解できるが、マルコ本文はνεανίσκος（若者）と記すため、その叙述を保ち、正体の判断は文脈に委ねた。
translation_notes:
  register: 明瞭な現代標準日本語。物語として自然な語順を用いながら、原文の人物描写と強い驚きの度合いを保持した。
