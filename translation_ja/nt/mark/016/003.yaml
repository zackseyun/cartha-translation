id: MRK.16.3
reference: Mark 16:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: ja
  text: 女たちは互いに言っていた。「だれが私たちのために、墓の入り口から石を転がしてどけてくれるでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的な側面を保ち、道中で交わされていた会話を自然な日本語で表す。
- source_word: πρὸς ἑαυτάς
  choice: 互いに
  rationale: 字義的には「自分たちに」だが、女性たちが相互に話している文脈上の相互的意味を簡潔に表す。
- source_word: Τίς
  choice: だれが
  rationale: 行為をしてくれる人物を問う疑問代名詞として、自然で直接的な訳語。
- source_word: ἀποκυλίσει
  choice: 転がしてどけてくれる
  rationale: 石を転がしてその位置から取り除く具体的な動作を示し、未来形と受益の含みも自然に表す。
- source_word: ἡμῖν
  choice: 私たちのために
  rationale: 利益・受益を表す与格として、女性たちに代わって行う意味を明示する。
- source_word: τὸν λίθον
  choice: 石を
  rationale: 定冠詞付きの、墓を塞ぐ既知の石を指す。原文に明記されない「大きな」は加えない。
- source_word: ἐκ τῆς θύρας
  choice: 入り口から
  rationale: θύραには「戸」「入り口」の両義があるが、墓の開口部という文脈では「入り口」が明瞭で自然。ἐκの起点・離隔も「から」で保つ。
- source_word: τοῦ μνημείου
  choice: 墓の
  rationale: 埋葬場所を指す文脈であり、現代日本語では「墓」が簡潔で自然。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、未完了過去の継続性と、石を転がして入り口から除く具体的な情景を保持した。会話文は丁寧すぎず、聖書本文として品位のある表現にした。英語資料の脚注は本文の位置と内容が整合していないため採用せず、ギリシア語本文に基づいて訳した。
