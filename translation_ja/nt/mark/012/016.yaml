  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: ja
  text: 彼らはそれを持って来た。そこでイエスは彼らに言われた。「これはだれの肖像と、だれの銘文ですか。」彼らはイエスに答えた。「カイサルのものです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν
  choice: それを持って来た
  rationale: 目的語は直前の文脈にあるデナリ銀貨を指す。日本語では「それを」とすることで自然に補い、貨幣の名称を本文に重ねて明示することを避けた。
- source_word: λέγει
  choice: 言われた
  rationale: マルコ特有の歴史的現在だが、日本語では物語の時制を自然に保つ過去形とし、主語のイエスを補った。敬語は現代日本語の聖書文体として自然な範囲にとどめた。
- source_word: Τίνος
  choice: だれの
  rationale: 所有・帰属を問う属格を、自然で明確な日本語にした。
- source_word: εἰκών
  choice: 肖像
  rationale: 貨幣上の人物像を指す文脈では「肖像」が正確で分かりやすい。「像」よりも人物の表象であることが明瞭になる。
- source_word: ἐπιγραφή
  choice: 銘
  rationale: 貨幣に刻まれた文字を簡潔に表す。「碑文」より貨幣の文脈に合い、「銘文」より簡潔で一般読者にも理解可能。
- source_word: Καίσαρος
  choice: 皇帝のものです
  rationale: Καῖσαρ はここではローマ皇帝を指す称号として機能する。属格だけの返答を、日本語で自然な「皇帝のもの」とした。
theological_decisions:
- issue: Καῖσαρ の訳語
  choice: 皇帝
  alternative: カエサル
  rationale: 固有名というよりローマ支配者の称号として理解される箇所であり、現代の一般読者に意味が直ちに伝わる「皇帝」を採用した。特定の皇帝名を補わず、原文の範囲を保った。
translation_notes:
  register: 明快な現代標準日本語による、簡潔で品位ある物語文。原文の問いが「肖像」と「銘」の両方の帰属を尋ねる構造を「だれの肖像と銘か」で保持した。
