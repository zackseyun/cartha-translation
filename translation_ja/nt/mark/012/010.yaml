source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: ja
  text: 'あなたがたは、聖書のこの箇所さえ読んだことがないのですか。


    『建てる者たちが退けた石、

    それが隅の要石[a]となった。』'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「隅の頭」。「隅の親石」とも訳せる。建物の隅で主要な役割を担う石を指すが、礎石か上部の石かについては解釈が分かれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: さえ……ない
  rationale: 単なる否定ではなく、「この箇所すら読んでいないのか」という強い反問を自然な日本語で表す。
- source_word: τὴν γραφὴν ταύτην
  choice: 聖書のこの箇所
  rationale: 新約聖書における γραφή の聖なる文書という意味を保ちつつ、ここでは特定の引用箇所を指すことを明確にする。
- source_word: ἀνέγνωτε
  choice: 読んだことがないのですか
  rationale: アオリストの反問を、これまで聖書を読んで知っているはずだという含みが伝わる現代日本語にする。
- source_word: Λίθον
  choice: 石
  rationale: 詩篇からの引用における特定の比喩的な石を、文脈上自然な形で表す。
- source_word: ἀπεδοκίμασαν
  choice: 退けた
  rationale: 吟味した上で不適格として拒む語感を、簡潔で格調を保つ日本語で表す。
- source_word: οἱ οἰκοδομοῦντες
  choice: 家を建てる者たち
  rationale: 実体詞的な現在分詞を明瞭に訳し、建築の比喩を保持する。
- source_word: οὗτος ἐγενήθη
  choice: それが……となった
  rationale: 退けられたその石こそが新たな地位を得たという対照と、結果としての状態を表す。
- source_word: εἰς κεφαλὴν γωνίας
  choice: 隅の要石
  rationale: 直訳的な「隅の頭」が示す、建物の隅で主要な役割を担う石という意味を、現代の読者に理解できる表現にする。具体的に礎石か頂部の石かは本文で断定しない。
theological_decisions:
- issue: 詩篇118篇22節の石の比喩のメシア的適用
  choice: 石、建てる者たち、隅の要石という比喩をそのまま保つ。
  alternative: 本文中で石をメシアまたはイエスと明示する。
  rationale: 文脈上この引用はイエスに適用されるが、原文は比喩によって語っているため、翻訳本文で解釈を付加しない。
- issue: κεφαλὴ γωνίας が指す建築部位
  choice: 「隅の要石」とし、主要な石であることを示しつつ位置を限定しない。
  alternative: 「礎の隅石」または「頂石」として特定の建築部位に限定する。
  rationale: この表現は字義的には「隅の頭」であり、基礎の隅石か上部を結ぶ石かについて解釈の幅があるため、その曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用としての簡潔さと格調を保った。「さえ」によって反問の鋭さを示し、引用は改行して詩的な形を見やすくした。
