reference: Mark 12:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: ja
  text: さらに別のしもべを送ると、彼らはそのしもべも殺した。このほかにも大勢のしもべを送ったが、彼らはある者を打ちたたき、ある者を殺した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: 別のしもべ
  rationale: ἄλλονは、主人が続けて遣わした別の一人を指す。目的語の「しもべ」は直前の文脈から明らかなため、日本語では補って自然にした。
- source_word: ἀπέστειλεν
  choice: 送ると／送ったが
  rationale: 単純に「送る・遣わす」を表す。現代の平明な物語文として「送る」を用い、前後の関係に応じて接続表現を整えた。
- source_word: κἀκεῖνον
  choice: そのしもべも
  rationale: καίとἐκεῖνονの結合による追加の意味と指示性を、「そのしもべも」で明示した。
- source_word: ἀπέκτειναν / ἀποκτέννοντες
  choice: 殺した
  rationale: いずれも殺害を直接表すため、婉曲化せず「殺した」と訳した。
- source_word: πολλοὺς ἄλλους
  choice: このほかにも大勢のしもべ
  rationale: さらに遣わされた多数の者を指す。日本語で対象を明確にするため、文脈上省略されている「しもべ」を補った。
- source_word: οὓς μὲν ... οὓς δὲ
  choice: ある者を……ある者を……
  rationale: 多数のしもべが二通りの扱いを受けたことを示す配分構文を、自然な日本語の対応表現で再現した。
- source_word: δέροντες
  choice: 打ちたたき
  rationale: 殴打を表すが、司法的なむち打ちに限定されないため、広い意味を保つ「打ちたたく」とした。
theological_decisions:
- issue: 分詞による要約的・配分的表現
  choice: 「彼らはある者を打ちたたき、ある者を殺した」と定動詞で表現する
  alternative: 「ある者を打ちたたき、ある者を殺しながら」のように分詞形を逐語的に反映する
  rationale: δέροντεςとἀποκτέννοντεςは、多数のしもべに対する反復的な扱いを配分して要約している。日本語では定動詞にすることで、その対比を明確かつ自然に保てる。
- issue: πολλοὺς ἄλλουςに省略された動作の補足
  choice: 「このほかにも大勢のしもべを送った」と、ἀπέστειλενを意味上補う
  alternative: 「そしてほかの大勢を、ある者は……」と圧縮構文をそのまま残す
  rationale: ギリシア語では直前の「送った」が省略されているが、日本語でそのままにすると不自然で係り受けも曖昧になる。文脈上確実な動作だけを補い、内容は追加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。たとえ話の簡潔な進行と暴力の強まりを保ち、過度に古風な「遣わす」や婉曲的な「死なせる」は避けた。
