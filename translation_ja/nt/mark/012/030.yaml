source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: ja
  text: あなたの神である主を、心を尽くし、魂[a]を尽くし、思い[b]を尽くし、力[c]を尽くして愛しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魂」は「いのち」とも訳せる（ψυχῆς）。
    reason: lexical_alternative
  - marker: b
    text: 「思い」は「知性」とも訳せる（διανοίας）。
    reason: lexical_alternative
  - marker: c
    text: 「力」は「強さ」とも訳せる（ἰσχύος）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: 愛しなさい
  rationale: 未来直説法が戒めの引用において命令の力を持つため、現代日本語で明確かつ dignified な命令表現とした。
- source_word: κύριον τὸν θεόν σου
  choice: あなたの神である主
  rationale: κύριοςを「主」、θεόςを「神」とし、契約的な定型句の関係を自然な日本語で保った。
- source_word: ἐξ ὅλης
  choice: 〜を尽くし／〜を尽くして
  rationale: 字義的な「すべてから」ではなく、各能力・側面の全体をもって愛するというギリシア語の慣用的意味を、日本語の「尽くす」で表した。
- source_word: καρδίας
  choice: 心
  rationale: 感情だけでなく意志を含む内面の中心を指しうる定着した訳語であり、説明的に狭めない。
- source_word: ψυχῆς
  choice: 魂
  rationale: ψυχήの「魂・いのち・自己」という意味の幅を踏まえつつ、列挙された語どうしの区別を保つ伝統的で理解可能な訳語を採用した。
- source_word: διανοίας
  choice: 思い
  rationale: 思考・理解の働きを表す語として自然であり、「心」と区別しながら、知的能力だけに狭く限定しない。
- source_word: ἰσχύος
  choice: 力
  rationale: 強さ・力量を意味する一般的で明瞭な対応語である。
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: そして、…尽くし、…尽くし、…尽くし、…尽くして
  rationale: 冒頭の接続と「尽くし」の反復によって、原文の累積的で強調的な構造を日本語として自然に再現した。
theological_decisions:
- issue: 戒めの引用におけるκύριοςの訳
  choice: 主
  alternative: 主なる方／主人
  rationale: ギリシア語本文のκύριοςに即して「主」とし、背景にある神名との関係を表記上で断定的に補わない。
- issue: 人間の諸側面を表す四つの語
  choice: 心／魂／思い／力
  alternative: 心／いのち／知性／全力
  rationale: 全人格的な献身へ一括して意訳せず、原文が並べる四語の区別と、その相互関係に残る幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書の戒めにふさわしい端正さを保った。「〜を尽くし」の反復により、ὅληςの全体性とκαίの累積的なリズムを過度に逐語的にならず伝えている。
