revisions:
- from: 彼らはやって来て、イエスに言った。「先生、私たちは、あなたが真実な方で、誰にも気兼ねなさらないことを知っています。人をうわべで見ず[a]、真実に神の道を教えておられるからです。皇帝に人頭税[b]を納めることは律法にかなっているでしょうか、いないでしょうか。納めるべきでしょうか、納めるべきでないでしょうか。」
  to: 彼らはやって来て、イエスに言った。「先生、私たちは、あなたが真実な方で、誰にも気兼ねなさらないことを知っています。人をえこひいきせず[a]、真実に神の道を教えておられるからです。カエサルに人頭税[b]を納めることは、許されているでしょうか、いないでしょうか。納めましょうか、それとも納めないでおきましょうか。」
  rationale: 本文が明示する意味を保ちながら、ἔξεστινを特定の律法体系に限定しない「許されている」に改めた。カエサルという原文の政治的称号を本文に保存し、人への偏りを表す慣用句は明瞭な日本語にして脚注で字義を示した。
