id: MRK.12.14
reference: Mark 12:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: ja
  text: 彼らはやって来て、イエスに言った。「先生、私たちは、あなたが真実な方で、誰にも気兼ねなさらないことを知っています。人をえこひいきせず[a]、真実に神の道を教えておられるからです。カエサルに人頭税[b]を納めることは、許されているでしょうか、いないでしょうか。納めましょうか、それとも納めないでおきましょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「人々の顔を見ない」。人の外見や社会的地位に左右されず、えこひいきしないという意味。
    reason: lexical_alternative
  - marker: b
    text: 「カエサル」はローマ皇帝を指す称号。人頭税はローマが課した人口登録に関係する税を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 福音書における呼びかけとして自然であり、教える者という役割を明確に表す。
- source_word: ἀληθὴς
  choice: 真実な方
  rationale: 人物について、偽りなく真実を語る性質を表す述語として、現代日本語で自然かつ尊敬表現にもなじむ。
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: 誰にも気兼ねなさらない
  rationale: 他人の地位や反応に左右されないという文脈上の意味を自然に示し、「誰のことも気にかけない」という冷淡さの誤解を避ける。
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: 人をうわべで見ず
  rationale: 「人の顔を見る」という原文の比喩を日本語の理解可能な表現にしつつ、外見や地位によって人を扱わないという含意を保つ。
- source_word: ἐπ’ ἀληθείας
  choice: 真実に
  rationale: 教え方が真実に即していることを、原文に近い簡潔な副詞句で示す。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 神の道
  rationale: 神に従う生き方と教えを指す聖書的な「道」の比喩を保持する。
- source_word: ἔξεστιν
  choice: 律法にかなっている
  rationale: 単なる行政上の許可ではなく、神の律法の観点から許されるかを問う論争的・宗教的な響きを表す。
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: 皇帝に人頭税を納める
  rationale: κῆνσοςをローマの住民税・人頭税として歴史的に特定し、δοῦναιは税について自然な「納める」とした。Καίσαρはここでは称号として機能するため「皇帝」とした。
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: 納めるべきでしょうか、納めるべきでないでしょうか
  rationale: 動詞の反復と二者択一の圧力を保ち、問いの罠としての鋭さを日本語で明示する。
theological_decisions:
- issue: 人の顔を見るという慣用句の訳し方
  choice: 本文を「人をうわべで見ず」とし、脚注で「えこひいきせず／地位や外見に左右されず」という意味を示す。
  alternative: 「人を分け隔てせず」または直訳的に「人の顔を見ず」
  rationale: 直訳だけでは現代日本語で意味が不透明になり、単に外見を見ないとの誤解も生じる。「うわべ」は原文の顔のイメージをある程度残し、脚注で社会的地位に左右されない含意を透明にする。
- issue: ἔξεστινの法的・神学的射程
  choice: 「律法にかなっている」と訳す。
  alternative: 「許されている」または「差し支えない」
  rationale: 質問はローマ法上の納税義務の有無ではなく、神の民としてそれを行うことが許されるかを問う罠である。ただし、どの律法解釈が正しいかまでは本文に付加しない。
- issue: Καίσαρの表記
  choice: 「皇帝」と訳す。
  alternative: 「カエサル」または「皇帝カエサル」
  rationale: この箇所では個人名というよりローマ皇帝の称号・権威を指すため、一般読者に即時理解できる「皇帝」が適切である。特定の皇帝名を本文に補わない。
translation_notes:
  register: 現代標準日本語の丁寧な直接話法を用いた。話者たちの表面的な敬意と巧妙なお世辞が伝わるよう尊敬語を保ちつつ、過度に古風な語法は避けた。「律法にかなう」「神の道」によって論争の宗教的な重みを維持した。
