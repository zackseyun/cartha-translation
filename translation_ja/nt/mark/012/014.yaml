  terminology: Διδάσκαλεを「先生」、κῆνσοςを「人頭税」、τὴν ὁδὸν τοῦ θεοῦを「神の道」とするのは適切である。Καίσαρは本文では「カエサル」とし、脚注でローマ皇帝を指す称号であることを説明する。
