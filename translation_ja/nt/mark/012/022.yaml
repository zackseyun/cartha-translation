  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: ja
  text: 七人とも、子孫を残しませんでした。最後に、その女も死にました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: 七人とも
  rationale: 冠詞付きの数詞は、直前の文脈にある七人の兄弟を指す。日本語では「七人とも」とすることで、七人全員について述べていることが簡潔かつ自然に伝わる。
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: 子孫を残しませんでした
  rationale: 直訳は「種を残さなかった」だが、ここでσπέρμαは後に残す子孫を意味する。「子孫を残す」は原文の比喩を不自然に持ち込まず、その意味を明瞭に表す。
- source_word: ἔσχατον πάντων
  choice: 最後に
  rationale: 一連の出来事の最終段階を示す慣用的な副詞句であり、「最後に」が自然で明確である。
- source_word: καὶ ἡ γυνὴ
  choice: その女も
  rationale: 定冠詞はすでに登場した女を指し、καίは彼女も死者の列に加わったことを示す。「その女も」で両方を自然に表す。
- source_word: ἀπέθανεν
  choice: 死にました
  rationale: 動詞の直接的な意味を保ち、婉曲表現にせず明快に訳す。
