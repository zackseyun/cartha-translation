language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: ja
  text: 「先生、モーセは私たちのためにこう書きました。『ある人の兄弟が死んで妻を残し、子を残さなかったなら[a]、その人の兄弟がその妻を迎え、亡くなった兄弟のために子孫をもうけなければならない[b]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 申命記25章5節参照。ここでモーセの律法として引用されている規定である。
    reason: cross_reference
  - marker: b
    text: 直訳すると「兄弟のために種を起こす」。亡くなった兄弟のために子孫をもうけることを指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 先生
  rationale: イエスへの呼びかけとして、現代日本語で自然かつ標準的であり、文脈にない支配者の含意を加えない。
- source_word: ἔγραψεν ἡμῖν
  choice: 私たちのためにこう書きました
  rationale: 与格ἡμῖνを、この律法がイスラエルに与えられたことを示す利益・関係の与格として表した。「こう」は後続する内容節を自然に導く。
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ある人の兄弟が死んで
  rationale: τινοςの不定性を「ある人の」で保ち、ἀδελφόςの男性親族語を明示した。
- source_word: καταλίπῃ γυναῖκα
  choice: 妻を残し
  rationale: 死亡時に妻を後に残す意味を簡潔に表す。文脈上「妻」であることは明確なため、所有者を補いすぎない。
- source_word: μὴ ἀφῇ τέκνον
  choice: 子を残さなかったなら
  rationale: 単数形τέκνονを集合的・一般的な「子」で表し、直前の「残す」との並行も保った。
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: その兄弟がその妻を迎え
  rationale: レビラト婚という法的婚姻文脈でのλαμβάνωを、日本語として不自然な「取る」ではなく、婚姻を含意する「迎える」で表した。
- source_word: ἐξαναστήσῃ σπέρμα
  choice: 子孫をもうける
  rationale: 字義的には「種を起こす」だが、ここでは亡兄の家系を継ぐ子をもうけるという慣用表現であるため、明瞭な現代日本語にした。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 亡くなった兄弟のために
  rationale: 与格の利益・関係を「ために」で表し、先行条件から明らかな死亡者を日本語で曖昧にならないよう「亡くなった兄弟」とした。
theological_decisions:
- issue: レビラト婚の法的慣用句をどこまで明示するか
  choice: 「その妻を迎え、亡くなった兄弟のために子孫をもうける」
  alternative: 「その妻をめとり、兄弟のために子孫を立てる」
  rationale: 原文の婚姻的・家系的意味を保ちつつ、古風で不透明な直訳を避けた。「妻を迎える」は婚姻を示すが、本文にない制度説明までは加えない。
- issue: 親族語と婚姻関係の性別表現
  choice: 「兄弟」「妻」を保持する
  alternative: 「きょうだい」「配偶者」と中性化する
  rationale: 原文はἀδελφόςとγυνήを用い、男性の兄弟とその妻を扱う律法を述べているため、その性別を保った。
- issue: σπέρμαの家系的含意
  choice: 「子孫」と訳し、脚注で字義を示す
  alternative: 本文を「種」または「子」とする
  rationale: 「子孫」はレビラト婚における家系継承の意味を自然に伝える一方、字義的表現は脚注に残して原文との対応を確認できるようにした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。律法の引用として自然に読めるよう「こう書きました」と引用符を用いた。「めとる」「種を起こす」のような古風または不透明な表現は本文では避け、必要な字義情報を脚注に置いた。
