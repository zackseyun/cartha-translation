  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: ja
  text: 七人の兄弟がいました。最初の兄弟は妻を迎え、子[a]を残さずに死にました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「種」。ここでは子、または子孫を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: 七人の兄弟がいました
  rationale: 存在を表す構文を自然な現代日本語にしつつ、レビラト婚をめぐる文脈に即して、男性のきょうだいであることを「兄弟」で明示した。
- source_word: ὁ πρῶτος
  choice: 最初の者
  rationale: 兄弟の中での順序を表す。「長男」は年齢や出生順を必要以上に明示するため避けた。
- source_word: ἔλαβεν γυναῖκα
  choice: 妻を迎えました
  rationale: 結婚することを表すギリシア語の慣用句を、自然で品位ある日本語にした。
- source_word: ἀποθνῄσκων
  choice: 死にました
  rationale: 分詞と主動詞の関係を日本語で自然に表し、「子を残さずに死にました」と一続きの出来事として訳した。
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: 子を残さずに
  rationale: 死後に子を残さなかったという意味を簡潔に表した。σπέρμαの字義は「種」だが、ここでは子・子孫を指す慣用的用法である。
