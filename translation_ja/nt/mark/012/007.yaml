  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: ja
  text: しかし、その農夫たちは互いに言った[a]。「これは相続人だ。さあ、彼を殺そう。そうすれば、相続財産は私たちのものになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの間で言った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: しかし、その農夫たちは
  rationale: δέの穏やかな逆接を「しかし」で示し、ἐκεῖνοιの指示性を「その」で保った。γεωργοίはぶどう園を任されて耕す者を指すが、文脈上その関係は明らかなため、自然な日本語の「農夫」とした。
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: 互いに言った
  rationale: 集団内で言葉を交わしたことを自然に表し、単なる内心の独白と取られにくくした。
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: これは跡取りだ
  rationale: κληρονόμοςは相続権を持つ者を表す。家族・財産承継の文脈で一般読者に自然な「跡取り」を選び、直後のκληρονομίαとの語のつながりは文脈で保持した。
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: さあ、彼を殺そう
  rationale: δεῦτεの呼びかけを「さあ」で、勧奨の接続法を「殺そう」で簡潔に表した。「殺害しよう」は不必要に硬く、「処刑しよう」は司法的意味を加えるため避けた。
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: そうすれば、相続財産は私たちのものになる
  rationale: ここでκαίは彼らが期待する結果を導くため、日本語では「そうすれば」とするのが自然である。前置されたἡμῶνの所有の意味を「私たちのもの」で明瞭に表した。
theological_decisions:
- issue: γεωργοίが示すぶどう園所有者との関係
  choice: 農夫たち
  alternative: 小作人たち／ぶどう園の農夫たち
  rationale: 彼らが所有者からぶどう園を任された者であることは前後の文脈で示される。「小作人」は制度的・歴史的な含みが強くなり得るため、本文では広く自然な「農夫」を用い、寓意的な同定を訳語に持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位のある物語調。「跡取り」と「相続財産」により、人物と財産の関係を自然な日本語で区別した。
