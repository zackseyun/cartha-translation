  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: ja
  text: 彼らはそのしもべを捕らえて打ちたたき、何も持たせずに帰した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「空のまま帰した」。しもべは受け取るべきものを何も得ずに帰された、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: 捕らえて
  rationale: 文脈上、ぶどう園の農夫たちがしもべを拘束して暴行する動作を表す。「捕らえる」は「つかむ」より自然で、「逮捕する」ほど制度的な意味を加えない。アオリスト分詞の先行動作は「〜て」で表した。
- source_word: ἔδειραν
  choice: 打ちたたき
  rationale: δέρωはここで殴打する、ひどく打つ意。「むち打つ」では刑罰の具体的手段を過度に限定するため避けた。
- source_word: ἀπέστειλαν
  choice: 帰した
  rationale: ἀποστέλλωは送り出す意だが、主人から遣わされたしもべを何も与えず戻したという場面なので、自然な日本語では「帰した」が明確である。
- source_word: κενόν
  choice: 何も持たせずに
  rationale: κενόςの字義は「空の」だが、ここでは求めた収穫を何も受け取らないまま送り返されたことを示す。「手ぶらで」も可能だが、口語性を抑えた自然な表現を採った。
- source_word: καὶ ... καὶ
  choice: 〜て…、〜て
  rationale: 反復するκαίが結ぶ一連の動作を、日本語の自然な連用形で順次表し、簡潔な物語の進行を保った。
