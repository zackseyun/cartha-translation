source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: ja
  text: そして、時期が来ると、ぶどう園の農夫たち[a]のもとへ一人の奴隷[b]を遣わした。ぶどう園の実の一部を農夫たちから受け取るためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ぶどう園を耕す人たち」、または「小作人たち」とも訳せる。ギリシア語は土地を耕す人を指し、ここではぶどう園が舞台となっている。
    reason: lexical_alternative
  - marker: b
    text: 「しもべ」とも訳せる。ギリシア語δοῦλοςは、主人に属する奴隷を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: 権限を持つ者が使者を送るという文脈に合い、ἀποστέλλωの意味を自然で格調ある現代日本語で表す。
- source_word: γεωργούς / γεωργῶν
  choice: ぶどう園の農夫たち
  rationale: γεωργόςは土地を耕す者を指す。ここではぶどう園が舞台なので、「農夫」に「ぶどう園の」を添えて文脈上の具体性を保った。「小作人」は社会的関係を推測させるため本文では採らない。
- source_word: τῷ καιρῷ
  choice: 時期が来ると
  rationale: καιρόςが示す、ふさわしい時期・定まった時期を自然に表す。収穫期が想定されるが、原文に明記されていないため「収穫の時」とは限定しない。
- source_word: δοῦλον
  choice: 奴隷
  rationale: δοῦλοςが表す主人への隷属という社会的身分を明確にする。「僕」「使用人」より原語に近いが、文脈によって可能な「しもべ」は脚注に残す。
- source_word: ἵνα ... λάβῃ
  choice: 受け取るためであった
  rationale: ἵνα節の目的を明瞭な日本語で表し、受領が遣わした目的であったことを保つ。
- source_word: παρὰ τῶν γεωργῶν
  choice: 農夫たちから
  rationale: 属格を伴うπαράが示す出所を、そのまま自然な日本語で表す。
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: ぶどう園の実の一部
  rationale: ἀπό＋属格の部分的な意味を「一部」で明示する。「取り分」は文脈には合うが、原文に直接ない所有権・契約上の含意を加えうるため避ける。
- source_word: ἀμπελῶνος
  choice: ぶどう園
  rationale: ἀμπελώνの標準的で明瞭な訳語。
