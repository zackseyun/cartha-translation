  text: また、会堂では上席を、宴会では上座を好む。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: 上席
  rationale: 会堂における地位や名誉の高い席を指す。現代日本語で簡潔かつ自然に社会的な優位を表す。
- source_word: συναγωγαῖς
  choice: 会堂
  rationale: この文脈ではユダヤ人の集会所を指すため、新約聖書の文脈で一般的な「会堂」とした。
- source_word: πρωτοκλισίας
  choice: 上座
  rationale: 古代の食事で最も名誉ある寝台・位置を指す。「上座」は食事の席における序列と名誉を自然な日本語で伝える。
- source_word: δείπνοις
  choice: 宴会
  rationale: 単なる夕食にもなり得る語だが、ここでは公的な名誉と席次が問題なので「宴会」が文脈に合う。
- source_word: καὶ ... καὶ
  choice: また、…では…を、…では…を
  rationale: 日本語として不自然な接続の反復は避けつつ、二つの場面を並列して名誉を求める様子を保った。
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: 会堂では…宴会では
  rationale: 場所・場面を示すἐνを、日本語の対照的な「では」で自然に表現した。
