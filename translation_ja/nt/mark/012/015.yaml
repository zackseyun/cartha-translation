id: MRK.12.15
reference: Mark 12:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: ja
  text: しかし、イエスは彼らの偽善を見抜いて、こう言われた。「なぜわたしを試すのか。[a] デナリ銀貨[b]を持って来なさい。見てみよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なぜわたしを誘惑するのか」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: デナリはローマの銀貨で、一般的な一日分の賃金に相当した。
    reason: cultural_note
lexical_decisions:
- source_word: εἰδὼς
  choice: 見抜いて
  rationale: 単なる知識ではなく、相手が隠している偽善をイエスが認識していたことを、文脈に即した自然な日本語で表す。
- source_word: ὑπόκρισιν
  choice: 偽善
  rationale: 表向きの誠実さの裏に罠を仕掛ける態度を示す語であり、原語の道徳的な強さを保つ標準的な訳語。
- source_word: Τί με πειράζετε
  choice: なぜわたしを試すのか
  rationale: Τί はここでは理由を問う働きをし、πειράζετε は敵意ある試みを表す。「誘惑する」に限定せず、罠にかけようとする文脈を保つ。
- source_word: φέρετέ μοι
  choice: 持って来なさい
  rationale: 話者のところへ物を持参するよう求める命令を、明快で自然な日本語にした。
- source_word: δηνάριον
  choice: デナリ銀貨
  rationale: 歴史的な貨幣名を保持しつつ、「銀貨」を添えて現代の一般読者にも直ちに分かるようにした。
- source_word: ἵνα ἴδω
  choice: 見てみよう
  rationale: 見ることを目的とする節を、簡潔で自然な日本語として表現した。目的語は直前の銀貨から明らかなので明示しない。
theological_decisions:
- issue: πειράζετε に含まれる非難の性格
  choice: 敵意をもって試すこととして訳す
  alternative: わたしを誘惑する
  rationale: この文脈では、罪へ誘うという狭い意味より、イエスを陥れようとして試す意味が中心である。ただし「誘惑する」という語義の可能性は脚注に残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。直接話法ではイエスの鋭い問いを簡潔に保ち、歴史的な貨幣名には説明的な普通名詞と脚注を添えた。英語資料では脚注記号と脚注内容の位置が対応していないため、日本語では内容に合う箇所へ配置した。
