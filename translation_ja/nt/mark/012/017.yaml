  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「皇帝のものを皇帝に、神のものを神に返しなさい。」[a] すると彼らはイエスに大いに驚いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「返しなさい」は、「支払いなさい」「しかるべきものを渡しなさい」とも訳せる。原語には、当然渡すべきものを返す、支払う、与えるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: 返しなさい
  rationale: ἀποδίδωμιのアオリスト命令形が持つ「返す」「しかるべき相手に渡す」という意味を簡潔に表す。納税だけに限定せず、帰属するものをその相手に与える含みを保つ。
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: 皇帝のものは皇帝に
  rationale: 属格による帰属と与格の受け手を自然な日本語で表し、後半との簡潔な対句を保つ。「カエサル」ではなく、文脈上の称号として一般読者に明瞭な「皇帝」とした。
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: 神のものは神に
  rationale: 前半と同じ構文で訳し、意図的な並行関係を保持する。何が神に属するかを訳文で限定しない。
- source_word: ἐξεθαύμαζον
  choice: 驚嘆していた
  rationale: 接頭辞によって強められた驚きを「驚嘆」で表し、未完了形の継続的・描写的な側面を「していた」で示す。
- source_word: ἐπ’ αὐτῷ
  choice: イエスに
  rationale: 驚きの対象を示すἐπί＋与格を直接的に訳す。驚きの理由を「その答え」と限定せず、原文の余地を残す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の敵対的な問いかけに対する応答の軽い対照を示す。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: 発話導入を忠実に表しつつ、イエスへの自然で品位ある敬語として主語敬語を用いる。
theological_decisions:
- issue: 皇帝への義務と神への義務の関係
  choice: 二つの並行句をそのまま訳し、両者の範囲や優先関係を説明しない。
  alternative: 国家権力への積極的服従、または皇帝の要求の限定を訳文で明示する。
  rationale: 本文は皇帝に属するものと神に属するものを区別して述べるが、包括的な政教関係論は提示していない。対句と神学的緊張を保ち、後代の立場を持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で格調ある発話にした。「皇帝のものは皇帝に、神のものは神に」という対句のリズムを優先した。脚注記号は該当命令文の末尾に置いた。
