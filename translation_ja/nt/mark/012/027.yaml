id: MRK.12.27
reference: Mark 12:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: ja
  text: 神は死んだ者たちの神ではなく、生きている者たちの神です。あなたがたは大きな思い違いをしています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: 神
  rationale: 文脈ではアブラハム、イサク、ヤコブの神を指すため、不定の「ある神」ではなく、固有の神を表す「神」とした。日本語では後半にも「神」を補うことで、属格の対比と述語関係が明瞭になる。
- source_word: νεκρῶν
  choice: 死んだ者たち
  rationale: 属格複数の形容詞的名詞用法を人々の集団として自然に表し、「生きている者たち」との対照を保った。
- source_word: ἀλλὰ ζώντων
  choice: 生きている者たちの神です
  rationale: 現在分詞の名詞用法を「生きている者たち」と訳し、νεκρῶνとの簡潔な対照を維持した。日本語として関係を明確にするため「神」を補った。
- source_word: πολὺ
  choice: 大きな
  rationale: πλανᾶσθεを強める副詞的用法を、「大きな思い違い」という自然な現代日本語で表した。
- source_word: πλανᾶσθε
  choice: 思い違いをしています
  rationale: 中動・受動形が持ちうる「迷う」「欺かれる」という幅を踏まえつつ、この文脈では誤った理解への叱責として自然で、外部からの欺きに限定しない表現を選んだ。
- source_word: οὐκ ἔστιν
  choice: ではなく
  rationale: 直前の文脈から主語は神であり、日本語では「神は……の神ではなく」と明示するのが自然である。
theological_decisions:
- issue: イエスの論証における、神の前で生きていることと復活との含意
  choice: 「死んだ者たち」と「生きている者たち」の対照をそのまま訳し、復活や中間状態について説明的に言い換えない。
  alternative: 「神にとっては皆が生きている」などの解釈的説明を本文に加える。
  rationale: この発言は復活をめぐる論証の一部だが、本節自体の簡潔な対照を保つことで、原文の神学的な含意と緊張を解消せずに伝えられる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの厳粛な反論にふさわしい品位を保った。「大きな思い違いをしています」は強い叱責を伝えるが、過度に口語的または攻撃的にならない。
