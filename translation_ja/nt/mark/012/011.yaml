  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: ja
  text: これは主によることで[a]、私たちの目には驚くべきことである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これは主から生じたこと」とも訳せる。ギリシア語の表現は、源・起源を主に示すが、主による働きという含みも持ち得る。
    reason: lexical_alternative
  - marker: b
    text: 詩篇118篇23節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: 主から出た
  rationale: παρά＋属格が示す源・起源を自然な日本語で表した。「主によって」も可能だが、本文では起源のニュアンスをより直接に保った。
- source_word: ἐγένετο αὕτη
  choice: これは……出たことで
  rationale: γίνομαιの広い意味を、この詩篇引用の文脈では「生じた・実現した」こととして表現した。αὕτηの指示対象は前節の出来事であり、「石」と補わず「これ」とした。
- source_word: κυρίου
  choice: 主
  rationale: ギリシア語κύριοςを新約本文として一貫して「主」と訳した。引用元のヘブライ語には神名があるが、それを本文へ逆輸入して「主なる神」などとはしなかった。
- source_word: θαυμαστὴ
  choice: 驚くべきことである
  rationale: θαυμαστόςが表す、驚嘆に値する不思議さを、現代の明瞭で品位ある日本語にした。
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: 私たちの目には
  rationale: 「私たちにとって」という意味の慣用表現だが、原文と詩篇引用の視覚的な比喩を保った。
theological_decisions:
- issue: 神を指す詩篇引用中のκύριοςの訳語
  choice: 主
  alternative: 主なる神／神名を示す表記
  rationale: 引用元の詩篇では神名が用いられているが、マルコのギリシア語本文はκύριοςであるため、「主」と訳して新約本文の形を尊重した。
- issue: παρὰ κυρίουにおける起源と行為主体の含み
  choice: 主から出た
  alternative: 主によってなされた
  rationale: 原文は起源と行為主体の双方を含み得る。本文では起源を前面に出し、もう一方の可能性を脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、詩篇引用にふさわしい簡潔で格調ある言い回しと「私たちの目には」という原文の比喩を保った。節末は引用文自体の内容を表す平叙文とした。ギリシア語写本上の疑問符は、12章10節から始まる「読んだことがないのか」という問い全体を閉じるものと理解できる。
