source:
  edition: SBLGNT
  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: ja
  text: また、やもめたちの家々を食い尽くし、見せかけのために長い祈りをする。このような者たちは、より厳しい裁きを受ける[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「口実として」または「人に見せるために」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「より大きな裁き」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: 食い尽くし
  rationale: 他人の財産を貪欲に奪うことを表す比喩。「搾取する」と説明的にせず、原文の鮮烈な『食べ尽くす』という像と道徳的な強さを保った。
- source_word: τὰς οἰκίας
  choice: 家
  rationale: 原文の具体的な表現を維持した。文脈上は家屋だけでなく、家産や暮らし全体を含み得るが、本文では解釈を限定しすぎない。
- source_word: τῶν χηρῶν
  choice: やもめたちの
  rationale: 属格複数を自然な所有表現で訳し、社会的に弱い立場に置かれた被害者を明示した。
- source_word: προφάσει
  choice: 見せかけのために
  rationale: 口実、偽装、外面的な体裁を示す語。現代日本語で偽善的な動機が明瞭に伝わりつつ、脚注に『口実として』という形式的に近い訳を残した。
- source_word: μακρὰ
  choice: 長い
  rationale: 祈りの時間的な長さを表す副詞的用法。日本語では『長い祈りをする』として自然に表現した。
- source_word: προσευχόμενοι
  choice: 祈りをする
  rationale: 分詞を先行する分詞と並列的な叙述として自然な日本語にした。
- source_word: λήμψονται
  choice: 受ける
  rationale: 未来形の意味は日本語の文脈で表される。裁きの文脈にふさわしい、簡潔で荘重な表現。
- source_word: περισσότερον
  choice: より重い
  rationale: 直訳的な『より大きな』よりも、判決の厳しさの程度を自然に示す。比較の基準を本文以上に特定しない。
- source_word: κρίμα
  choice: 有罪判決
  rationale: 単なる審査ではなく、処罰を伴う不利な裁きを示す文脈的含意を表した。ただし、より広い『裁き』も可能なので脚注に保持した。
theological_decisions:
- issue: 宗教的偽善への警告における κρίμα の意味
  choice: 有罪判決
  alternative: 裁き
  rationale: この箇所は単なる評価ではなく、悪に対する不利で処罰的な裁きを警告しているため。ただし、終末の裁きに関する詳細を補わず、語の幅を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、警告の荘重さと原文の『食い尽くす』という強い比喩を保持した。前節から続く関係節的な断片だが、単独節としても読めるよう『また』で接続し、『このような者たち』で οὗτοι の強調を表した。
