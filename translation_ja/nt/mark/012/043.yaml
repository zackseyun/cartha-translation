source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: ja
  text: イエスは弟子たちを呼び寄せて、彼らに言われた。「確かに、あなたがたに言います。この貧しいやもめは、献金箱[a]に入れているすべての人よりも多く入れた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「宝物庫」。このギリシア語は、神殿の献金を納める箱、または宝物庫の区域を指す。
    reason: 語義の幅と歴史的背景を示すため。
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せて
  rationale: 中動態の分詞が表す、弟子たちを自分のもとへ呼ぶ動作を、簡潔で自然な日本語にした。
- source_word: μαθητὰς
  choice: 弟子たち
  rationale: イエスに従い教えを受ける者たちを表す、新約聖書で定着した訳語。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: よくあなたがたに言っておく
  rationale: 発言の確かさと厳粛さを示す定型句を、現代の読者に理解しやすい荘重な日本語で表した。
- source_word: χήρα
  choice: やもめ
  rationale: 夫を亡くした女性を指す語。聖書文体として定着しつつ、現代日本語でも意味が通る。
- source_word: πτωχὴ
  choice: 貧しい
  rationale: 窮乏の程度を本文以上に強めず、基本的な意味をそのまま表した。
- source_word: πλεῖον πάντων
  choice: すべての人よりも多く
  rationale: 他の献金者全員との比較を保ち、何をもって「多い」とするかは本文中で説明し足さなかった。
- source_word: ἔβαλεν / τῶν βαλλόντων
  choice: 入れた／入れている
  rationale: 献金の場面に適した日本語を用い、アオリストによる完了した行為と現在分詞による進行中の行為の対照を表した。
- source_word: γαζοφυλάκιον
  choice: 献金箱
  rationale: この場面で金銭を入れる神殿の設備を現代の読者に明確に伝える。語が神殿の宝物庫やその区域を指し得ることは脚注に示した。
theological_decisions:
- issue: やもめの献金に対する評価
  choice: 「すべての人よりも多く」と直訳的な比較を保つ
  alternative: 金額ではなく犠牲の大きさにおいて最も多く献げた、と本文で明示する
  rationale: 次節は富の中から献げた者たちと、乏しさの中から献げたやもめを対比するが、本節自体は比較の尺度を明示しない。解釈を本文へ織り込まず、量的表現と文脈上の評価との緊張を残した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、イエスの厳粛な宣言には「よくあなたがたに言っておく」を用いて品位を保った。「やもめ」は文脈にふさわしい定着語として採用した。
