source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: ja
  text: 彼らはイエスを捕らえようとしていたが、群衆を恐れた。イエスが自分たちに向けてこのたとえを語ったと分かったからである。彼らはイエスを残して、去って行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτουν
  choice: 捕らえようとした
  rationale: 未完了過去が示す継続的な企て、または未遂の行動を、自然な現代日本語で表す。
- source_word: κρατῆσαι
  choice: 捕らえる
  rationale: 直接的な語義を保ち、ギリシア語に明示されていない正式な法的手続きとしての「逮捕する」は避ける。
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: 群衆を恐れた
  rationale: 目的語を伴う表現を簡潔かつ自然に訳した。
- source_word: ἔγνωσαν
  choice: 分かった
  rationale: 文脈上の認識を明瞭に表し、「知っていた」よりも日本語の出来事の流れに自然である。
- source_word: πρὸς αὐτοὺς
  choice: 自分たちに向けて
  rationale: 「彼らに対して／彼らを念頭に置いて」という方向性を保ちつつ、「非難して」とまで意味を限定しない。敵対的な含みは文脈に委ねる。
- source_word: τὴν παραβολὴν
  choice: このたとえ
  rationale: 直前に語られた特定のたとえを指すことを、自然な日本語で明示する。
- source_word: εἶπεν
  choice: 語った
  rationale: たとえを述べる行為にふさわしい自然な表現。日本語では時制を過去完了にずらさずとも前後関係が明確である。
- source_word: ἀφέντες αὐτὸν
  choice: イエスをそのままにして
  rationale: その場では捕らえる企てを断念し、彼に手を出さずに去ったという文脈上の意味を表す。
- source_word: ἀπῆλθον
  choice: 立ち去った
  rationale: 物語上の移動を、簡潔で品位ある現代日本語で表す。
theological_decisions:
- issue: πρὸς αὐτούς が表す、たとえと指導者たちとの関係
  choice: 自分たちに向けて
  alternative: 自分たちを非難して／自分たちのことを指して
  rationale: 敵対的な文脈は明白だが、前置詞句自体は「～に向けて」「～に関して」「～に対して」の幅を持つため、非難という解釈を本文で過度に固定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「彼ら」が誰を指すかは前後の文脈に依存する一方、同一節内の対象を明確にするため、αὐτόν は「イエス」とした。語調は簡潔で叙事的な品位を保つ。
