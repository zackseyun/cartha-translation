  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: ja
  text: そこで、律法学者はイエスに言った。「先生、そのとおりです。神は唯一であり、神のほかにはほかの神はいないと、あなたはまことに言われました。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すれば「一である」で、「神」という語はここでは繰り返されていない。主語は直前の文脈から補われる。
    reason: 原文の省略された主語を示しつつ、本文が文脈に基づき「神」を補っていることを明示するため。
lexical_decisions:
- source_word: γραμματεύς
  choice: 律法学者
  rationale: 福音書の文脈で、律法を専門に研究し教えた公認の学者を指す。現代日本語では「律法学者」が簡潔で分かりやすい。
- source_word: Καλῶς
  choice: そのとおりです
  rationale: 直前の答えを正しいものとして認める応答。字義的な「よく」より、現代の対話として自然に賛意を表す。
- source_word: διδάσκαλε
  choice: 先生
  rationale: 呼びかけとしての「教師」より自然であり、διδάσκαλοςの敬意を込めた呼称を表す。
- source_word: ἐπ’ ἀληθείας
  choice: 真実を
  rationale: 発言内容が真実であるとの評価を表す副詞的表現。「真実を語る」として自然な日本語にした。
- source_word: εἶπες
  choice: 語られました
  rationale: 直前のイエスの発言を指す。対話の敬意を日本語として自然に示しつつ、単純過去の意味を保つ。
- source_word: ὅτι
  choice: 〜と
  rationale: 理由ではなく、語った内容を導く接続詞として訳した。
- source_word: εἷς ἐστιν
  choice: 神は唯一であり
  rationale: ギリシア語では主語が省略されているが、直前の文脈から指示対象は神である。日本語の「彼は一つ」は不自然で曖昧すぎるため、文脈上の主語を補い、数的・排他的な唯一性を「唯一」で表した。省略については脚注で明示する。
- source_word: οὐκ ἔστιν ἄλλος
  choice: だれもいない
  rationale: 神以外の他者が存在しないという意味を、日本語で自然に表現する。
- source_word: πλὴν αὐτοῦ
  choice: 神のほかには
  rationale: 例外・排他を示すπλήν＋属格を自然に表し、指示対象を文脈に沿って明示した。
theological_decisions:
- issue: εἷς ἐστινの省略された主語
  choice: 本文では「神は唯一」と文脈上の主語を補い、脚注で原文の省略を示す。
  alternative: 「彼は一つである」または「一人である」と形式的に省略を保つ。
  rationale: 直前の最大の戒めとシェマの引用により、主語が神であることは明白である。日本語で代名詞や無主語のまま再現すると不自然または誤解を招くため、意味を明示する一方、原文の簡潔さは脚注で読者に知らせる。
- issue: 神の唯一性を表すεἷς
  choice: 「唯一」と訳す。
  alternative: 「一つ」または「ひとり」と訳す。
  rationale: ここでは神の数的唯一性と、ほかに神はいないという排他性が並行して述べられる。「唯一」は現代日本語でこの意味を明確に表し、後続節との結びつきも自然である。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、宗教的対話にふさわしい品位を保った。「イエス」は代名詞の指示先を自然に明確化するため補った。
