  to: そこで、律法学者はイエスに言った。「先生、そのとおりです。神は唯一であり、神のほかにはほかの神はいないと、あなたはまことに言われました。[a]」
  rationale: 本文は、原文の省略された主語を日本語として明示する方針を維持する。後半を「神のほかにはほかの神はいない」と改め、原文の「ほかの者はいない」という排他的表現を、直前の神への言及に即して明確にした。「まことに言われました」はἐπ’ ἀληθείας εἶπεςの真実性を自然に表す。脚注は、原文に明示的な代名詞がない点と「神」が文脈から補われる点を正確に述べる。
