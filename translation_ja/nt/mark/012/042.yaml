  text: καὶ ἐλθοῦσα μία χήρα πτωχὴ ἔβαλεν λεπτὰ δύο, ὅ ἐστιν κοδράντης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: ja
  text: そこへ、貧しいやもめが一人やって来て、レプタ銅貨二枚[a]、すなわち一コドラントを入れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: レプタはごく小額の銅貨で、二レプタがローマの一コドラントに相当した。
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: やって来て
  rationale: アオリスト分詞を日本語の自然な連用表現とし、主動詞「入れた」へ滑らかにつないだ。
- source_word: μία
  choice: 一人
  rationale: 人数の対比を強調するというより、一人の人物を物語に導入する用法。日本語では「やもめが一人」が自然である。
- source_word: χήρα πτωχὴ
  choice: 貧しいやもめ
  rationale: 語順を自然な日本語に整えつつ、χήραとπτωχήの基本的意味を保った。「困窮した」では程度を限定しすぎるため避けた。
- source_word: ἔβαλεν
  choice: 入れた
  rationale: 献金箱に貨幣を納める文脈を、現代日本語で簡潔かつ自然に表す。「投げ入れた」は動作の勢いを不必要に示唆しうる。
- source_word: λεπτὰ δύο
  choice: レプタ銅貨二枚
  rationale: 歴史的な貨幣名を保持しながら、「銅貨」を補って現代の読者にも物であることを明確にした。
- source_word: ὅ ἐστιν κοδράντης
  choice: すなわち一コドラント
  rationale: 二レプタの換算額を示す説明句として自然に訳し、ローマ貨幣の固有名を保持した。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。「やもめ」は聖書文脈で広く理解される簡潔な語として採用し、歴史的貨幣名には本文内の換算句と脚注を添えた。
