id: MRK.12.35
reference: Mark 12:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: ja
  text: イエスは神殿で教えながら、こう言われた。「律法学者たちは、どうしてメシア[a]をダビデの子だと言うのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語はクリストスで、ここではメシアを指す称号として用いられている。
    reason: 称号χριστόςの伝統的な別訳を示し、語の意味を明確にするため。
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἔλεγεν
  choice: こう言われた
  rationale: ἀποκριθεὶςは応答を示すが、直前に明示的な質問がないため、日本語で「答えて言われた」と重ねると不自然になる。応答的な発言を導く表現として「こう言われた」にまとめ、ἔλεγενの発話導入機能も自然に表した。
- source_word: διδάσκων ἐν τῷ ἱερῷ
  choice: 神殿で教えながら
  rationale: 現在分詞が示す同時的な状況を簡潔に表した。ἱερόνは内陣だけでなく神殿域を指すが、文脈上は標準的な「神殿」で十分である。
- source_word: Πῶς λέγουσιν
  choice: どうして…と言うのか
  rationale: Πῶςの基本的な問いの形を保ちつつ、律法学者の主張の根拠を問う修辞的な響きを自然な日本語で表した。「どうして」には理由を問う意味と異議を含む意味の双方があり、問いの緊張を保てる。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: 当時、律法の解釈と教授に携わったγραμματεῖςの役割が現代の一般読者に伝わる、福音書で定着した明瞭な訳語を用いた。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名に近い用法ではなく、ユダヤ的期待の中の称号として用いられているため、「メシア」とした。
- source_word: υἱὸς Δαυίδ
  choice: ダビデの子
  rationale: 血統上の子孫とメシア的称号の両方を含みうる聖書的表現を保ち、解釈を一方に限定しない。
theological_decisions:
- issue: χριστόςを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所はダビデとの関係をめぐるユダヤ的なメシア論争であり、称号としての意味が前面に出ている。「キリスト」も伝統的な訳語なので脚注に示した。
- issue: 「ダビデの子」の意味範囲
  choice: 直訳的な称号「ダビデの子」を保持
  alternative: ダビデの子孫
  rationale: 「子孫」と説明的に限定せず、血統表現であると同時にメシア的称号でもある原文の含みを残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には「言われた」を用いて落ち着いた尊敬表現とした。問いは過度に説明せず、原文の簡潔さと修辞的な緊張を保った。
