  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: ja
  text: イエスは彼らに言われた[a]。「あなたがたが思い違いをしているのは、聖書も神の力も知らないからではありませんか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたが迷っているのは、聖書も神の力も知らないからではありませんか。」
    reason: πλανᾶσθεには「思い違いをしている」のほか、「迷っている」と訳し得る幅があるため。
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは彼らに言われた
  rationale: φημίの基本的な発話導入の意味を自然な敬体で表し、文脈にない「答えた」などの含みを加えない。
- source_word: Οὐ διὰ τοῦτο
  choice: このためではありませんか
  rationale: οὐを伴う修辞疑問と、διά＋対格の理由・原因を保つ。
- source_word: πλανᾶσθε
  choice: 思い違いをしている
  rationale: ここでは復活についての誤認を指すため自然でありつつ、「欺かれている」と原因を特定せず、語の持つ誤り・迷いの幅を残す。
- source_word: μὴ εἰδότες
  choice: 知らないからです
  rationale: 分詞が誤りの理由を示すことを、現代日本語で明瞭な理由節として表す。
- source_word: τὰς γραφὰς
  choice: 聖書
  rationale: ユダヤ教および初期キリスト教の文脈における権威ある聖なる文書群を指す標準的な訳語。
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: 神の力も
  rationale: μηδέを先行する否定と呼応する「も」で表し、δύναμις τοῦ θεοῦを簡潔かつ正確に訳す。
theological_decisions:
- issue: πλανᾶσθεが表す誤りの性質
  choice: 思い違いをしている
  alternative: 惑わされている／迷っている
  rationale: 知的な誤解だけにも、外部からの欺きだけにも限定せず、聖書と神の力を知らないことに由来する誤りへの叱責として訳す。
translation_notes:
  register: 明瞭で現代的な標準日本語。イエスへの敬意を示す「言われた」と、聞き手に対する丁寧な問いかけを用いた。修辞疑問と、それに続く理由説明を二文に分け、自然さと論理関係を両立させた。
