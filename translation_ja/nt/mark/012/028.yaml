source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: ja
  text: 律法学者の一人が近寄って来て、彼らが議論しているのを聞き、イエスが彼らに的確に答えたのを見て、イエスに尋ねた。「すべての戒めのうち、第一[a]のものはどれですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「最も重要なものはどれですか」または「最も大切なものはどれですか」。
    reason: πρώτηは「第一の」のほか、順位や重要性における「最も重要な」「最も大切な」の意味にもなりうるため。
lexical_decisions:
- source_word: γραμματέων
  choice: 律法学者
  rationale: 福音書の文脈では、ユダヤ教の律法に通じた公認の専門家を指す。「律法学者」は現代日本語で役割を明確に伝える定着した訳語である。
- source_word: προσελθὼν
  choice: 近寄って来て
  rationale: イエスのもとへ近づく動きを、自然な日本語で表す。
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: 彼らが議論しているのを聞き
  rationale: συζητέωは論じ合うことを表す。敵意を過度に含ませず、公の場での応酬にふさわしい「議論」とした。
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: イエスが彼らに見事に答えたのを見て
  rationale: 主語を「イエス」と明示して日本語での指示関係を明確にした。καλῶςは、答えの適切さを自然に示す「見事に」とした。
- source_word: ἐπηρώτησεν αὐτόν
  choice: イエスに尋ねた
  rationale: 指示対象を明確にしつつ、一般的で品位のある「尋ねた」を用いた。
- source_word: Ποία
  choice: どれですか
  rationale: 複数の戒めの中から一つを特定する問いとして自然な表現である。
- source_word: ἐντολή
  choice: 戒め
  rationale: モーセの律法に属する命令を指す聖書的文脈に適し、日本語聖書で定着した語である。
- source_word: πρώτη πάντων
  choice: すべての戒めのうち、第一のもの
  rationale: πρώτηの「第一」という表現を保ち、順序と重要性の両方を含みうる原文の幅を残した。
theological_decisions:
- issue: πρώτηが示す第一性の意味
  choice: 「第一のもの」と訳す
  alternative: 「最も重要なもの」「最も大切なもの」「最上位のもの」
  rationale: πρώτηは順序上の最初と、順位・重要性における第一の双方を表しうる。本文では直訳性のある「第一」を保ち、文脈がその意味を示すようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話は丁寧な問いとして表現した。「律法学者」「戒め」「第一」は聖書的な品位を保ちながら一般読者にも理解しやすい語である。
