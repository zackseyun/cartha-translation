id: MRK.12.9
reference: Mark 12:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: ja
  text: ぶどう園の主人はどうするでしょうか。やって来て、その農夫たちを滅ぼし、ぶどう園をほかの人たちに与えるでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ποιήσει
  choice: どうするでしょうか
  rationale: 未来形を含む修辞的な問いを、意味を補わず自然な現代日本語で表した。
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ぶどう園の主人
  rationale: ここでのκύριοςはたとえ話の中の所有者を指す。「主」では神学的称号との混同を招きやすく、「主人」が所有・管理する立場を自然に示す。
- source_word: ἐλεύσεται
  choice: やって来て
  rationale: 所有者が現場に来て介入するというἔρχομαιの動きを、文脈に即した自然な表現で保った。
- source_word: ἀπολέσει
  choice: 滅ぼし
  rationale: ἀπόλλυμιの厳しい裁きを保ちつつ、「殺し」よりも原語の意味の幅を残す。
- source_word: τοὺς γεωργούς
  choice: その農夫たち
  rationale: γεωργόςの基本的な農耕者という意味を明確に表す。文脈上は借り受けて耕作する者たちだが、本文では過度に限定しなかった。
- source_word: δώσει τὸν ἀμπελῶνα ἄλλοις
  choice: ぶどう園をほかの人たちに与えるでしょう
  rationale: δίδωμιを「与える」と直接的に訳し、ἄλλοιςの指示対象を原文どおり限定しない形にした。
theological_decisions:
- issue: たとえ話の非神的な指示対象に用いられたκύριος
  choice: 主人
  alternative: 主／所有者
  rationale: 直接の指示対象はぶどう園を所有する人物である。「主人」は物語内の関係を自然に示し、「主」という神学的称号を本文に先取りして持ち込まない。「所有者」も正確だが、日本語のたとえ話としてはやや説明的で硬い。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。問いと答えの簡潔で厳しい調子を維持し、神学的含意は語彙上の過剰な明示によって解消しない。
