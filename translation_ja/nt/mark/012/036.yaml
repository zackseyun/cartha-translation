source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: ja
  text: 'ダビデ自身が、聖霊によって[a]、こう言いました。


    「主は私の主に言われた。


    『私の右に座っていなさい。私があなたの敵をあなたの足の下に置くまで。』」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊にあって」。この引用は詩編110:1から。ヘブライ語本文では、最初の「主」は神の名（YHWH。伝統的に「主」と訳される）を表し、二番目の「主」はダビデが「私の主」と呼ぶ者を指す。
    reason: ギリシア語ἐνの別訳を示すとともに、引用元と、ギリシア語の同じκύριοςという訳語だけでは見えにくいヘブライ語本文の区別を説明する。
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: ダビデ自身が
  rationale: αὐτόςの強意を自然な現代日本語で保ち、語ったのがダビデ本人であることを強調する。
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: 聖霊によって
  rationale: ἐνと与格は領域・状態を表す「聖霊にあって」とも、媒介を表す「聖霊によって」とも理解できる。本文では日本語として明瞭な「によって」を採用し、別訳を脚注に示す。
- source_word: κύριος / τῷ κυρίῳ μου
  choice: 主／私の主
  rationale: 引用中のκύριοςの反復を保つ。最初と二番目の指示対象の違いは、マルコのギリシア語本文にない区別を本文へ持ち込まず、脚注でヘブライ語詩編の背景を説明する。
- source_word: Κάθου
  choice: 座っていなさい
  rationale: 現在命令形が持つ継続的な着座の意味を、王の即位を思わせる文脈に合う自然な日本語で表す。
- source_word: ἐκ δεξιῶν μου
  choice: 私の右に
  rationale: この句は位置を示す慣用表現であり、日本語では「私の右に」が明瞭で自然。「右の座に」など本文にない名詞は補わない。
- source_word: ἕως ἂν θῶ
  choice: 私が…置くまで
  rationale: 将来の到達点を示すἕως ἂνと接続法の意味を素直に表す。
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: あなたの足の下に
  rationale: マルコ本文の表現を保ち、詩編の伝統的な「足台」を補わず、敵の服従を示す比喩をそのまま訳す。
theological_decisions:
- issue: ダビデが聖霊のうちに語ったことを示す表現
  choice: 聖霊によって
  alternative: 聖霊にあって
  rationale: 聖霊がダビデの発言に関与したことを明瞭にしつつ、ギリシア語のἐνが許す別の捉え方も脚注に残し、霊感の様態を必要以上に限定しない。
- issue: 詩編110:1の主キリスト論的な引用
  choice: 主は私の主に言われた
  alternative: 主なる神は私の主に言われた
  rationale: ギリシア語では両方ともκύριοςであるため、本文では同じ「主」を用いる。ヘブライ語引用元で最初の語が神名を表すことは脚注で明示し、イエスの論証にある二者の区別を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。導入は引用へ自然につながる「こう言っています」とし、詩的引用は改行して示した。「右手」は身体部位との誤解を避けるため「右」とした。
