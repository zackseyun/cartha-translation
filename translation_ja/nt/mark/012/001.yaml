  to: それからイエスは、たとえを用いて彼らに語り始めた。「ある人がぶどう園を植え、その周りに垣を巡らせ[a]、ぶどう搾りの受け槽を掘り[b]、塔を建てた。そして、そのぶどう園を農夫たちに貸し出し[c]、旅に出た。」[d]
