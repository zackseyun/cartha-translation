id: MRK.12.1
reference: Mark 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: ja
  text: それからイエスは、たとえを用いて彼らに語り始めた。「ある人がぶどう園を植え、その周りに垣を巡らせ[a]、ぶどう搾りの受け槽を掘り[b]、塔を建てた。そして、そのぶどう園を農夫たちに貸し出し[c]、旅に出た。」[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「垣」は、柵、生け垣、その他の囲いを指すことができる。
    reason: lexical_alternative
  - marker: b
    text: 「受け槽」は、ぶどう搾りで搾った果汁が流れ込む下側の槽、または穴を指す。別訳「ぶどう搾り場の穴を掘り」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「小作人たちに貸した」。ここでいう農夫たちは、所有者からぶどう園を借りて耕す人々である。
    reason: lexical_alternative
  - marker: d
    text: ぶどう園を植え、囲いを設け、搾り場と塔を備える描写は、イザヤ書5章1～2節を思わせる。
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο αὐτοῖς ἐν παραβολαῖς λαλεῖν
  choice: たとえで彼らに語り始めた
  rationale: 開始を表すἤρξατοと不定詞λαλεῖνを「語り始めた」とし、ἐν παραβολαῖςは日本語として自然な「たとえで」とした。複数形は、ここから続くたとえによる語り方を示すものとして無理に「幾つものたとえ」とはしない。
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: ある人がぶどう園を造り
  rationale: ἄνθρωποςは物語に登場する一人の所有者なので、自然な導入表現「ある人」とした。ぶどう園は個々の木を植えるだけでなく園を開設することを表すため、日本語では「ぶどう園を造る」が明瞭で自然である。
- source_word: περιέθηκεν φραγμόν
  choice: その周りに垣を巡らし
  rationale: φραγμόςは柵、生け垣などを含む囲いを指す。「垣」は材質を限定せず、ぶどう園を囲う境界を簡潔に表せる。
- source_word: ὤρυξεν ὑπολήνιον
  choice: ぶどう搾りの受け槽を掘り
  rationale: ὑπολήνιονは搾った果汁が流れ込む下側の槽を指す。「受け槽」により、単なる搾り場全体ではないことを保ちつつ、現代の読者にも機能が伝わるようにした。
- source_word: ᾠκοδόμησεν πύργον
  choice: 塔を建てた
  rationale: πύργοςを直接的に「塔」と訳した。見張りなどの用途は文脈上想定できるが、本文には明記されていないため訳文に加えない。
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: そのぶどう園を農夫たちに貸し出し
  rationale: ἐξέδετοが賃貸関係を明示するため、「貸し出し」と訳した。γεωργοί自体は耕作者・農夫を意味するので、社会身分を強く響かせる「小作人」ではなく「農夫たち」とし、賃借関係は動詞で明確にした。
- source_word: ἀπεδήμησεν
  choice: 旅に出た
  rationale: 一定期間よそへ出かける意味を自然な日本語で表した。「遠い国へ行った」とすると距離を原文以上に限定するため避けた。
theological_decisions:
- issue: イザヤ書5章1–2節との響き
  choice: ぶどう園、垣、受け槽、塔という具体的な連続を保持する
  alternative: 旧約との関連が分かるよう本文中で説明を加える
  rationale: 語彙と配置を保つことで暗示は伝わるが、イエスがここで各要素の意味を明示してはいない。解釈を本文へ織り込まず、関連は脚注に示した。
- issue: γεωργοῖςの賃借関係
  choice: 農夫たちに貸し出し
  alternative: 小作人たちに貸した
  rationale: 所有者と耕作者の区別はたとえの展開に重要なので「貸し出し」で明示した。一方、「小作人」は特定の歴史的・社会的制度を連想させやすいため避けた。
- issue: ἄνθρωποςの表現
  choice: ある人
  alternative: ある男／ある地主
  rationale: 原語は物語中の一人の人物を導入するが、「地主」という身分語は直接明記されていない。「ある人」は曖昧さを保ち、後続の所有・賃貸行為から立場が自然に分かる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ぶどう搾りの受け槽」のように馴染みの薄い古代農業設備は本文で簡潔に機能を示し、詳細を脚注へ回した。文脈上の主語を明らかにするため「イエス」を補い、二度目のαὐτόは日本語で指示対象が明確になるよう「そのぶどう園」とした。
