  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: ja
  text: イエスは答えた。「第一の戒めはこれです。『聞け、イスラエルよ。主、私たちの神、主は一つである。』[a][b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主、私たちの神は、唯一の主である」、または「主は私たちの神、主のみである」。このギリシア語は申命記6章4節を反映しており、神が一つであること、主だけであること、またはその両方を強調し得る。
    reason: alternative_reading
  - marker: b
    text: これは「シェマ」（申命記6章4節）の引用。「主」は、七十人訳ギリシア語聖書で神名YHWHの代用として用いられた κύριος の訳語である。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 対話における応答を表す標準的で自然な訳。
- source_word: Πρώτη
  choice: 第一のもの
  rationale: 女性形の形容詞が名詞的に用いられ、文脈上「戒め」を指す。原文が明示していない名詞を補いすぎず、日本語として意味が通る形にした。
- source_word: Ἄκουε
  choice: 聞け
  rationale: 申命記6章4節のシェマの冒頭を保ち、単なる聴覚ではなく、注意して聞き従うよう呼びかける荘重な命令として訳した。
- source_word: Ἰσραήλ
  choice: イスラエルよ
  rationale: 呼格的な呼びかけを、現代日本語で明確かつ格調ある形にした。
- source_word: κύριος
  choice: 主
  rationale: 新約ギリシア語の称号を標準的に訳した。この引用では七十人訳が神名YHWHに用いた語でもあり、その背景は脚注で示す。
- source_word: ὁ θεὸς ἡμῶν
  choice: 私たちの神
  rationale: 所有関係を明確で自然な現代日本語にした。
- source_word: εἷς
  choice: 唯一
  rationale: 神の一性と排他的告白の両方を含み得る文脈で、日本語として自然な述語表現を選んだ。ただし別の統語的理解は脚注に残した。
theological_decisions:
- issue: シェマ末尾の統語と、神の一性・唯一性の緊張
  choice: 主は私たちの神、主は唯一である
  alternative: 「主、私たちの神は、唯一の主である」または「主は私たちの神、ただ主のみ」
  rationale: ギリシア語の語順に近い告白形式を保ちつつ、日本語として理解可能にした。神が一つであることと、主だけを神とする排他的忠誠のどちらか一方に限定せず、代案を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、シェマの公的・告白的な響きを「聞け」「イスラエルよ」で保った。「唯一」は自然な日本語だが、原文の統語上の幅を狭めないよう脚注で主要な別訳を併記した。
