base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: ja
  text: 彼らはその息子を捕らえ[a]、殺し、ぶどう園の外へ投げ出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 並行するたとえから「ぶどう園の外へ投げ出して殺した」という順序を予想する読者もいるが、ここでマルコのギリシア語本文は「殺し、ぶどう園の外へ投げ出した」と記している。
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: 捕らえ
  rationale: アオリスト分詞で、後続する動作に先立つ行為を示す。文脈には敵意があるため「捕らえ」が自然だが、語自体に必要以上の暴力性を持たせない表現とした。
- source_word: ἀπέκτειναν
  choice: 殺し
  rationale: ἀποκτείνωの直接的な意味を、明瞭で現代的な日本語で表した。
- source_word: ἐξέβαλον
  choice: 投げ捨てた
  rationale: ἐκβάλλωの強い排除の動作を表し、殺害後に遺体をぶどう園の外へ放り出すという文脈にも自然に合う。
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ぶどう園の外へ
  rationale: ἐξέβαλονとともに外への移動を示すため、方向を明確にする「外へ」とした。
- source_word: ἀμπελῶνος
  choice: ぶどう園
  rationale: ἀμπελώνの標準的で分かりやすい訳語。
- source_word: αὐτόν
  choice: その息子を
  rationale: 代名詞の指示対象は直前の文脈にあるぶどう園の主人の愛する息子であり、日本語では対象を明示すると単独節として理解しやすい。
theological_decisions:
- issue: 殺害とぶどう園外への投棄の順序
  choice: ギリシア語本文どおり、捕らえ、殺し、その後ぶどう園の外へ投げ捨てたという順序を保つ。
  alternative: 並行するたとえの伝承に合わせ、先にぶどう園の外へ出してから殺したとする。
  rationale: SBLGNTのマルコ12章8節は、殺害の後にぶどう園の外へ投げ捨てたという順序で記す。並行箇所との調和を図らず、本文の緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえの簡潔で厳しい語調を保った。「投げ捨てた」は殺害後の排除を自然に表す。
