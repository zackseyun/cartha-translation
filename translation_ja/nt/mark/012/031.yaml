id: MRK.12.31
reference: Mark 12:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: ja
  text: 第二はこれです。「あなたの隣人を自分自身のように愛しなさい。」これらにまさる戒めは、ほかにありません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「これらより大きなほかの戒めはない」。「これら」は文脈上、二つの戒めを合わせて指す。
    reason: 語句の直訳と複数指示語の指示対象を明示するため。
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: 第二はこれです
  rationale: 省略されている「戒め」を文脈から補わずとも日本語で意味が通じ、第一の戒めとのつながりと「第二」への強調を保てる。
- source_word: Ἀγαπήσεις
  choice: 愛しなさい
  rationale: 未来形が聖書引用の中で命令として機能しているため、現代日本語で自然かつ明確な命令表現とした。
- source_word: τὸν πλησίον σου
  choice: あなたの隣人
  rationale: レビ記19章18節とのつながりを保ち、倫理的・聖書的文脈に定着した πλησίον の訳語を用いた。
- source_word: ὡς σεαυτόν
  choice: 自分自身のように
  rationale: 比較の簡潔さを保ち、「自分を愛するように」という原文にない動詞の補足を避けた。
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: これらにまさる戒めは、ほかにありません
  rationale: 比較級 μείζων、複数形 τούτων、ほかの戒めの不存在を自然な日本語で保持した。「これら」として指示対象を本文中で明示しすぎず、原文の表現を保った。
- source_word: ἐντολή
  choice: 戒め
  rationale: 律法について語る聖書的・契約的な文体に適し、「命令」よりもこの文脈で定着している。
theological_decisions:
- issue: 末尾の τούτων（「これら」）の指示対象
  choice: 文脈上、第一と第二の二つの戒めを合わせて指す複数表現として保持する
  alternative: 直前の第二の戒めだけを一般化して指すと解する
  rationale: 複数形は文脈で語られた二つの戒めを自然に指す。ただし本文では「この二つ」と解釈的に言い換えず、「これら」として原文の指示表現を残し、注で文脈上の指示対象を示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、聖書引用にふさわしい品位を保った。「です／ありません」により、この箇所の発話として自然な丁寧さを出している。
