  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: ja
  text: 彼にはまだ一人、愛する息子がいた。彼は最後にその息子を彼らのもとへ送って、こう言った。「私の息子を敬ってくれるだろう。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「敬ってくれる」は、「その人の前で恥じ入る」または「敬意を示す」とも訳せる。ここでは文脈により「敬う」の意味に取った。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: 彼にはまだ一人……がいた
  rationale: 残っているただ一人をなお所有していたという流れを、自然な日本語で表す。
- source_word: υἱὸν ἀγαπητόν
  choice: 愛する息子
  rationale: ἀγαπητόςの愛情の重みと、マルコ福音書における「愛する子」との響きを保ちつつ、現代日本語として自然にした。
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: 彼は最後にその息子を彼らのもとへ送り出し
  rationale: ἔσχατονの順序上・物語上の頂点を「最後に」で明確にし、ἀποστέλλωは文脈に合う「送り出す」とした。
- source_word: λέγων ὅτι
  choice: こう言った
  rationale: 後続する発言を、自然な日本語の直接話法で導入した。
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: 私の息子なら敬ってくれるだろう
  rationale: ἐντρέπομαιはここでは相手に敬意を示す意味が文脈に適する。「なら」は息子であることに基づく期待を自然に示し、「だろう」は話者の期待を保つ。
theological_decisions:
- issue: 「愛する息子」のキリスト論的な響き
  choice: 本文では「愛する息子」とし、解釈的説明を加えない。
  alternative: 最愛の息子
  rationale: イエスを「愛する子」と呼ぶマルコ福音書内の響きを保持する一方、たとえの意味を本文で過度に解説しない。
- issue: 主人の期待の確実性
  choice: 「敬ってくれるだろう」
  alternative: 「敬うはずだ」
  rationale: 未来形の期待を示しつつ、主人が結果を絶対視していると過度に強めない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、たとえ話としての簡潔さと荘重さを保った。「愛する息子」は教会的な定型表現に寄せすぎず、原文のキリスト論的な響きを残している。
