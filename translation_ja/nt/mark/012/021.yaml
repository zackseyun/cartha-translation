  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: ja
  text: 二人目も彼女を妻に迎え[a]、子孫を残さずに死んだ。三人目も同じようにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼女を取った」。ここでは「彼女を妻にした」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 二番目の者
  rationale: 定冠詞を伴う序数詞が名詞的に用いられている。「兄弟」は文脈上明らかだが、この節には明記されていないため補わない。
- source_word: ἔλαβεν αὐτήν
  choice: 彼女を妻に迎え
  rationale: λαμβάνω の基本義は「取る、受け取る」だが、ここでは兄弟の妻を迎える結婚の文脈なので、現代日本語で自然に意味が伝わる表現とした。原語のより直訳的な形は脚注に示す。
- source_word: ἀπέθανεν
  choice: 死んだ
  rationale: 婉曲表現を避け、簡潔な物語文として直接的に訳す。
- source_word: μὴ καταλιπὼν
  choice: 残さずに
  rationale: 否定を伴うアオリスト分詞を、死に伴う状況として自然な日本語で表す。
- source_word: σπέρμα
  choice: 子孫
  rationale: 本節では文字どおりの「種」ではなく、レビラト婚によって残される子・跡継ぎを指す。単数の「子」に限定せず、原語の幅を保つ。
- source_word: ὁ τρίτος ὡσαύτως
  choice: 三番目も同様だった
  rationale: 原文の省略的で簡潔な表現を保ち、先行する行為と結果が同じだったことを示す。
