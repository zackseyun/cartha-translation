source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: ja
  text: さて、死者がよみがえることについては、モーセの書の柴の箇所で[a]、神がモーセにどのように語られたか、あなたがたは読んだことがないのですか。神はこう言われました。「わたしはアブラハムの神、イサクの神、そしてヤコブの神である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「柴のところで」。このギリシア語表現は、柴の出来事によって聖書の箇所を示していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: さて、死者が……ことについては
  rationale: περί＋属格が話題を示し、δέは強い対立ではなく話題の展開を表すため、自然な接続の「さて」と主題提示の「については」で表した。
- source_word: ὅτι ἐγείρονται
  choice: よみがえる
  rationale: 文脈上、死者の復活を指す。ギリシア語は受動・中動形だが、日本語で「よみがえらされる」とすると不自然で解釈を過度に固定するため、自然な自動詞表現を採用した。復活を引き起こす主体は明示せず、原文の含みを保った。
- source_word: οὐκ ἀνέγνωτε
  choice: 読んだことがないのですか
  rationale: 聖書を読んだ経験に訴える修辞疑問として、現代日本語で自然かつ明瞭に表した。
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: モーセの書で
  rationale: βίβλοςは書物または巻物を表し得るが、ここではモーセに帰される聖書文書を指すため、「モーセの書」が簡潔で自然である。
- source_word: ἐπὶ τοῦ βάτου
  choice: 「柴」の箇所で
  rationale: 柴の出来事によって聖書の一節を特定する引用慣用句として理解し、「箇所」を補って現代の読者に機能を明確にした。字義的な別訳は脚注に残した。
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: 神がモーセにどのように語られたか。神はこう言われました
  rationale: αὐτῷの指示対象を日本語で明確にするため「モーセ」とし、λέγωνが導く直接引用を自然な二文に分けた。神に対する敬意を表す標準的な「語られた／言われました」を用いた。
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: わたしはアブラハムの神、イサクの神、そしてヤコブの神である
  rationale: ἐγώと現在の同定表現を「わたしは……である」と明示し、「神」の反復も保って、引用の修辞的・論証的な力を維持した。
theological_decisions:
- issue: ὅτι ἐγείρονταιにおける復活の受動表現
  choice: 死者がよみがえる
  alternative: 死者がよみがえらされる
  rationale: 原語の形は受動・中動形で、神が復活を起こす含みと調和するが、日本語の明示的な使役受動は不自然で、原文以上に行為者を前景化する。「よみがえる」は復活という論点を明確にしつつ、行為者を限定しない。
- issue: 神の自己同定における現在性と反復
  choice: わたしはアブラハムの神、イサクの神、そしてヤコブの神である
  alternative: わたしはアブラハム、イサク、ヤコブの神である
  rationale: 「神」を三度表す原文の反復を維持し、「である」によって現在の自己同定を明確にした。これは次節へ続くイエスの論証に重要であるため、簡略化しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの問いと聖書引用にふさわしい品位を保った。「柴」は出エジプト記の出来事を指す伝統的で簡潔な語として残し、「箇所」を補って意味を明確にした。引用内は荘重さを保つため常体の「である」とした。
