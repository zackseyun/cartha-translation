source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: ja
  text: そこで彼らは、イエスを言葉によってわなにかけるために、ファリサイ派の者たちとヘロデ党の者たちを何人か、イエスのもとに遣わした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「イエスの発言によって彼を陥れるため」。ギリシア語の「わなにかける」は狩猟の比喩であり、最後の句は、イエス自身の発言を利用して彼を捕らえようとしたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: 遣わした
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形にした。派遣する行為を簡潔に保っている。
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: ファリサイ派とヘロデ党の者たちを何人か
  rationale: τιναςと属格による部分表現を「何人か」で示し、両集団から選ばれた者たちであることを自然な日本語で表した。
- source_word: Φαρισαίων
  choice: ファリサイ派
  rationale: 現代日本語の聖書用語として通用し、集団名であることも明瞭な表記を採用した。
- source_word: Ἡρῳδιανῶν
  choice: ヘロデ党
  rationale: ヘロデ家を支持する集団を指す名称として、一般読者にも理解しやすい慣用表記を採用した。
- source_word: ἵνα
  choice: ～ように
  rationale: 目的を表す従属節として自然な現代日本語にした。文脈上、意図された結果ではなく敵対者の目的を示す。
- source_word: ἀγρεύσωσιν
  choice: わなにかかる
  rationale: 狩猟で獲物を捕らえる比喩を保ちつつ、人を陥れる意図が自然に伝わる表現にした。
- source_word: λόγῳ
  choice: 言葉によって
  rationale: 手段を示す与格を「によって」で表し、単数形λόγῳの「言葉」を保った。誰の言葉かは本文で明示せず、原文の簡潔さと曖昧さを残した。
theological_decisions:
- issue: ギリシア語の複数動詞で主語が省略されていること
  choice: 彼ら
  alternative: 祭司長、律法学者、長老たち／当局者たち
  rationale: この節自体は主語を改めて特定していないため、前の文脈から具体的な集団名を本文へ補わず、代名詞にとどめた。
- issue: λόγῳが誰の発言を指すか
  choice: 「言葉によって」として明示しない
  alternative: 「イエスの言ったことで」
  rationale: 文脈上はイエスの返答を利用して陥れる意味だが、ギリシア語は所有者を明示していないため、本文では補足しすぎず、脚注で説明した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。歴史的現在は日本語の物語として自然な過去形で表し、主語とλόγῳの指示対象について原文以上の特定を避けた。脚注記号[a]は本文に明示した。
