revisions:
- from: すると彼らは、イエスが言葉によってわなにかかるように、ファリサイ派とヘロデ党の者たちを何人か、イエスのもとに遣わした。[a]
  to: そこで彼らは、イエスを言葉によってわなにかけるために、ファリサイ派の者たちとヘロデ党の者たちを何人か、イエスのもとに遣わした。[a]
  rationale: ἀγρεύωはここでαὐτόν（イエスを）を目的語に取るため、本文を「イエスを…わなにかけるために」とし、敵対者が言葉を手段としてイエスを陥れようとする目的を正確に表した。歴史的現在は、日本語の物語文として自然な過去形「遣わした」に保った。λόγῳの話者は本文で限定せず、文脈上の理解は脚注にのみ示した。
