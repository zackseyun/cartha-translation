  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: ja
  text: さて、復活はないと言っているサドカイ派の人々がイエスのもとに来て、こう尋ね始めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: サドカイ派の人々
  rationale: 当時の宗教的集団を、現代日本語で自然かつ明確に示す。
- source_word: ἀνάστασιν
  choice: 復活
  rationale: 死者が再び生きることを指す新約聖書の基本的な用語として定着しており、文脈にも適合する。
- source_word: ἐπηρώτων
  choice: 尋ね始めた
  rationale: 未完了過去形が表し得る開始的・継続的なニュアンスを反映し、後続する質問の導入として自然にした。
theological_decisions:
- issue: 復活を否定する発言の帰属
  choice: サドカイ派の人々自身が『復活はない』と主張していることを明示した。
  alternative: 『復活はないとされているサドカイ派』のように外部からの説明とも読める表現。
  rationale: οἵτινες λέγουσιν は彼ら自身の継続的な主張を表すため、その帰属を曖昧にしない。
- issue: ἀνάστασις の範囲
  choice: 限定語を補わず『復活』とした。
  alternative: 『死者の復活』。
  rationale: 意味上は死者の復活だが、原文にない限定を本文へ加えず、簡潔さと原文の表現を保つ。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文としての落ち着きと品位を保った。後続節へ続く導入文として、末尾は『こう尋ね始めた』とした。
