base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: ja
  text: 復活の際、彼らがよみがえるとき[a]、その女は彼らのうち誰の妻になるのでしょうか。七人とも彼女を妻としていたのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らが再びよみがえるとき」とも訳せる。ギリシア語は単に「彼らがよみがえるとき」と言っており、「再び」は明示されていないが、復活の文脈から補われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: 復活の時
  rationale: 定冠詞を伴うἀνάστασιςは、サドカイ派との論争で問題となっている終末の復活を指す。「復活の時」は日本語として自然で、原文の前置詞句も保つ。
- source_word: ὅταν ἀναστῶσιν
  choice: 彼らがよみがえるとき
  rationale: ὅτανとアオリスト接続法による未来の時を表す節。「よみがえる」は復活の文脈に即しつつ、原文に明示されない「再び」を本文へ加えない。
- source_word: τίνος αὐτῶν
  choice: 彼らのうち誰の
  rationale: 疑問代名詞の属格と部分を表すαὐτῶνを、自然な日本語で明確に表す。
- source_word: ἔσται γυνή
  choice: 妻になるのでしょうか
  rationale: 未来形と述語名詞の関係を、日本語の問いとして自然に表現する。γυνήはこの婚姻文脈では「女」一般でなく「妻」を意味する。
- source_word: οἱ γὰρ ἑπτὰ
  choice: 七人とも……のですから
  rationale: γάρの説明的な働きを「のですから」で示す。「とも」により、先行文脈で特定された七人全員を簡潔に表す。
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: 彼女を妻としていた
  rationale: ἔχω＋目的語＋γυνήの婚姻関係を表す構文を、単なる結婚の出来事ではなく妻として持った関係に重心を置いて訳す。
theological_decisions:
- issue: サドカイ派との論争における復活表現
  choice: 復活の時、彼らがよみがえるとき
  alternative: 死者の中から復活し、再び生きるとき
  rationale: 将来の復活を明確にしながらも、この節のギリシア語にない「死者の中から」や「再び」を本文に補わない。原文にある名詞と動詞の反復も保持する。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で品位ある標準語。「その女」は直前まで語られている女性を指す問いの言い回しとして用い、「のでしょうか」で論争中の質問として自然に整えた。
