id: MRK.12.34
reference: Mark 12:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: ja
  text: イエスは、その人が賢明に答えたのを見て、こう言われた。「あなたは神の国から遠くない[a]。」それからはもう、だれもあえてイエスに質問しようとはしなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたは神の国に近い」とも訳せる。ギリシャ語は近さを表しているが、神の国にすでに入ったことまでは明言していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν αὐτὸν ὅτι
  choice: その人が……答えたのを見て
  rationale: 分詞構文の観察と、それに基づく発言の流れを、現代日本語として自然に表した。αὐτόνは直前の律法学者を指すため、「その人」とした。
- source_word: νουνεχῶς
  choice: 賢明に
  rationale: 理解力と思慮をもって適切に答えたという肯定的な意味を、簡潔で自然な日本語で表す。
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: あなたは……から遠くない
  rationale: 原文の空間的な比喩と否定表現を保ち、「近い」と言い切る以上に、神の国への加入や到達を明示しない形にした。
- source_word: βασιλείας τοῦ θεοῦ
  choice: 神の国
  rationale: 「神の支配」と「神の統治領域」の両方を含みうる、福音書で定着した自然な訳語を用いた。
- source_word: οὐκέτι
  choice: それからはもう
  rationale: この時点以後、質問を続ける者がいなかったという時間的な意味を明確にした。
- source_word: ἐτόλμα … ἐπερωτῆσαι
  choice: あえて……質問しようとはしなかった
  rationale: τόλμαの「思い切ってする」と、ἐπερωτάωの「問いを向ける」という意味を保ちつつ、試すような文脈を過度に強めない自然な表現とした。
theological_decisions:
- issue: 律法学者と神の国との関係
  choice: 「神の国から遠くない」とし、近接は示すが、すでに神の国に入っているとは明言しない。
  alternative: 「神の国に近い」
  rationale: ギリシャ語は距離の近さを述べる一方、所属や入国を明示していない。イエスの評価と、なお残る含みとの緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話部分には簡潔で dignified な調子を保った。「質問」は文脈上の問いかけを表すが、「尋問」のような過度に敵対的な語感は避けた。
