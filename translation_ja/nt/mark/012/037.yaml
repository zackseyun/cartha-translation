  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: ja
  text: ダビデ自身がキリストを『主』と呼んでいる。では、どうしてキリストがダビデの子[b]なのか。[a] 大勢の群衆は、イエスの話を喜んで聞いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「どこから、キリストはダビデの子なのか」。ここでは、そのように呼べる根拠を問う表現。
    reason: lexical_alternative
  - marker: b
    text: ここでの「子」は、「ダビデの子」というメシアの称号を響かせており、広く「子孫」という意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: ダビデ自身が
  rationale: 強意用法のαὐτόςを「自身」とし、ダビデ本人がそう呼んでいるという議論上の強調を保った。
- source_word: λέγει αὐτὸν κύριον
  choice: この方を『主』と呼んでいる
  rationale: λέγωの述語的構文を自然な日本語の「～を…と呼ぶ」で表し、κύριοςの称号としての重みを「主」に保った。指示対象は直前の文脈にあるメシアであり、日本語では敬意を帯びた「この方」が自然である。
- source_word: καὶ πόθεν αὐτοῦ ἐστιν υἱός
  choice: それなら、どうしてこの方がダビデの子なのか
  rationale: πόθενの字義は「どこから」だが、ここでは論理的な根拠を問うため「どうして」とした。代名詞の連続による曖昧さを避けるため、αὐτοῦを「ダビデ」と明示した。
- source_word: υἱός
  choice: 子
  rationale: 「子孫」と説明的に置き換えず、「ダビデの子」というメシア的呼称と問いの緊張を保った。
- source_word: ὁ πολὺς ὄχλος
  choice: 大勢の群衆
  rationale: πολύςが群衆の人数の多さを表すことを、現代日本語で自然に示した。
- source_word: ἤκουεν αὐτοῦ ἡδέως
  choice: イエスの話を喜んで聞いていた
  rationale: 未完了過去の継続性を「聞いていた」で示し、ἡδέωςを「喜んで」とした。日本語で「彼の話」の指示が曖昧になるのを避け、話者を「イエス」と明示した。
theological_decisions:
- issue: ダビデがメシアを「主」と呼ぶことのキリスト論的含意
  choice: 「主」という称号と修辞的な問いをそのまま保つ
  alternative: 「メシアを主と呼ぶ」または「どのような意味で子なのか」と説明を加える
  rationale: 本文はメシアが単なるダビデの子孫以上である可能性を示すが、その関係をここで教理的に解き明かしてはいない。翻訳もその緊張を保持する。
- issue: メシア的文脈におけるυἱός
  choice: 子
  alternative: 子孫
  rationale: 意味上は子孫を含み得るが、「ダビデの子」という称号との響きと、イエスの問いの言葉遣いを保つため「子」とした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「この方」を用いて指示対象を明確にしつつ、説明を本文へ過度に持ち込まないようにした。脚注記号は問いの直後に置き、関連する二つの語義上の注を示した。
