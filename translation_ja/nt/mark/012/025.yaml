  rationale: γάρ の説明的な力を文頭の「というのも」と文末の「からです」で示した。ἀναστῶσιν の能動的表現は「復活するとき」とし、婚姻に関する二動詞は「結婚する／嫁に出される」によって能動・受動の差を保った。「ようだからです」により、御使いとの比較を訳出しつつ、人々が御使いそのものになるという含意を避けた。
