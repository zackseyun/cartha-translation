id: MRK.12.25
reference: Mark 12:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: ja
  text: というのも、死者の中から復活するとき、人々は結婚することも、嫁に出されることもなく、天にいる御使いたちのようだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: するとき……からです
  rationale: ὅτανの時を表す意味と、γάρが前の議論に理由を与える説明的な働きを、自然な日本語の語順で示した。
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: 死者の中から復活するとき
  rationale: ἐκ νεκρῶνを「死者の中から」として起点を明示し、能動形ἀναστῶσινは日本語で自然な「復活する」とした。
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: めとることも嫁ぐこともなく
  rationale: 二つの動詞の区別とοὔτε…οὔτεの並列否定を保った。「めとる／嫁ぐ」は婚姻に入る双方の立場を簡潔に表す。
- source_word: ἀλλ’ εἰσὶν
  choice: ……のようになる
  rationale: 復活後の状態への移行を日本語として自然に示す。「なる」は人が御使いそのものへ変わるという意味ではなく、後続のὡςによる類似を述べる。
- source_word: ὡς ἄγγελοι
  choice: 御使いたちのように
  rationale: ὡςを比較として訳し、復活した人々と御使いとの同一視を避けた。「御使い」は聖書文体として明瞭で尊厳ある語。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天にいる
  rationale: ギリシア語は複数形だが、日本語では「天」が自然であり、御使いたちの所在を明確にした。
theological_decisions:
- issue: 復活した人々と御使いたちとの比較の性質
  choice: 復活した人々は御使いたちのようになる
  alternative: 復活した人々が御使いになる
  rationale: 比較辞ὡςは類似を表し、存在上の同一化を表さないため、「ように」でその区別を保持した。
- issue: 御使いとの類似が及ぶ範囲
  choice: 文脈上、婚姻しない点での類似を示しつつ、訳文では比較の範囲を説明的に限定しない
  alternative: 「結婚しないという点で」と訳文に補う
  rationale: 直前の婚姻への言及から比較点は明らかだが、原文にない限定句を本文へ加えず、原文の簡潔さを保った。
translation_notes:
  register: 明瞭で尊厳ある現代標準日本語。「めとる」「嫁ぐ」はやや聖書的な響きを持つが、γαμοῦσινとγαμίζονταιの区別を簡潔に保つため採用した。脚注を必要とする重大な異読・訳語上の曖昧さはない。
