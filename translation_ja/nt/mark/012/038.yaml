  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: ja
  text: また、イエスは教えの中でこう語っていた。「長い衣をまとって歩き回り[b]、市場で挨拶を受けることを望む律法学者たちに気をつけなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「律法学者たちを警戒しなさい」「律法学者たちに用心しなさい」。
    reason: lexical_alternative
  - marker: b
    text: 「長い衣」は、地位や公の名誉を誇示することと結びついた、人目を引く外衣を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: 教えの中で
  rationale: 発言がなされた場面・領域を示す前置詞句の形を保ちつつ、自然な日本語とした。
- source_word: ἔλεγεν
  choice: 語っていた
  rationale: 未完了過去の継続的な側面を表し、単発の「言った」に限定しない訳とした。
- source_word: Βλέπετε ἀπὸ
  choice: 気をつけなさい
  rationale: 特定の人々を警戒するよう求める命令の意味を、明瞭で自然な現代日本語で表した。別訳の幅は脚注に示した。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 福音書の文脈におけるユダヤ教律法の専門家という役割が、一般読者にも伝わる標準的な訳語を採用した。
- source_word: τῶν θελόντων
  choice: 望む
  rationale: 彼らに特徴的な意志や欲求を表す分詞の意味を、弱めず簡潔に表した。
- source_word: ἐν στολαῖς περιπατεῖν
  choice: 長い衣を着て歩き回り
  rationale: στολήが指す丈の長い外衣と、περιπατεῖνの歩き回る動作をともに明示した。社会的含意は脚注に置いた。
- source_word: ἀσπασμοὺς
  choice: 挨拶を受けること
  rationale: 文法上は「望む」に続く目的語であり、文脈上は公の場で敬意を示す挨拶を受けることを指すため、日本語では「受ける」を補った。
- source_word: ἐν ταῖς ἀγοραῖς
  choice: 広場で
  rationale: ἀγοράは市場であると同時に人々が集う公共空間を指すため、この場面の公然性が伝わる「広場」とした。
theological_decisions:
- issue: 律法学者に対する警告の範囲
  choice: 長い衣や公の挨拶を望む者たちという限定がそのままかかる訳
  alternative: 律法学者全体への一律の断罪と読む訳
  rationale: 定冠詞付きの「律法学者たち」は、続く分詞句「望む者たち」によって特徴づけられている。読点で非限定的説明にせず、原文が持つ範囲の緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、警告の厳粛さを保った。「イエス」は前節からの話者を日本語で明確にするため補った。節が次節へ続くことを踏まえ、引用符は閉じていない。
