  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: ja
  text: イエスは献金箱[a]の向かいに座って、群衆がそこへ銅貨をどのように入れているかを見ておられた。多くの裕福な人々が、たくさん入れていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿の宝物庫」または「献金を入れる箱」とも訳せる。ギリシア語は、神殿の宝物庫そのもの、またはそこに設けられた献金用の容器を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: 座り
  rationale: アオリスト分詞の場面設定を、主動詞に先立つ自然な日本語の連用形で表した。
- source_word: κατέναντι
  choice: 向かいに
  rationale: 対象と正面に向き合う位置関係を簡潔かつ自然に示す。
- source_word: γαζοφυλάκιον
  choice: 神殿の献金箱
  rationale: 文脈上、献金を入れる設備を指すことを明確にしつつ、語が神殿の宝物庫やそれに付属する容器を指し得る幅は脚注に残した。
- source_word: ἐθεώρει
  choice: 見ておられた
  rationale: 未完了時制の継続的な観察を表し、イエスを主語とする日本語叙述として自然な敬意を保った。
- source_word: πῶς
  choice: どのように
  rationale: 単に献金した事実ではなく、その仕方に観察の焦点があるという原文の含みを保持した。
- source_word: ὁ ὄχλος
  choice: 群衆
  rationale: 集合的な人々を指す原語に対応する、明瞭で一般的な現代日本語とした。
- source_word: βάλλει / ἔβαλλον
  choice: 入れる／入れていた
  rationale: 字義的な「投げる」ではなく、金銭を容器に納める文脈に即した自然な表現とし、後者では未完了時制の継続性を示した。
- source_word: χαλκόν
  choice: お金
  rationale: 字義的には銅または銅貨だが、ここでは貨幣一般として機能するため、過度に材質を限定せず自然に表した。
- source_word: πολλοὶ πλούσιοι
  choice: 多くの金持ち
  rationale: 性別を不必要に限定せず、富裕な人々を指す簡潔な現代語とした。
- source_word: πολλά
  choice: たくさん
  rationale: 金銭について量が多いことを表す慣用的な用法を、自然な日本語で示した。
