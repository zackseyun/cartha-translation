id: MRK.12.33
reference: Mark 12:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: ja
  text: また、心のすべて、理解力のすべて、力のすべてをもって神を愛すること、そして隣人を自分自身のように愛することは、あらゆる全焼のいけにえ[a]と犠牲よりもまさっています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全焼のいけにえ」とは、祭壇の上で全部を焼き尽くしてささげるいけにえを指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: 愛すること
  rationale: 冠詞付き不定詞の動作性を保ち、並行する二つの愛の行為を自然な日本語の名詞節で表した。
- source_word: αὐτόν
  choice: その方を
  rationale: 文脈上は神を指すが、原文どおり代名詞として訳し、指示対象を本文中で明示的に補わないようにした。
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: 心のすべてをもって
  rationale: 心を余すところなく傾けるという全体性を、明瞭で自然な日本語で表した。
- source_word: συνέσεως
  choice: 理解力
  rationale: 単なる思考器官ではなく、理解し見分ける能力を表す語義を保った。
- source_word: ἰσχύος
  choice: 力
  rationale: 人が持つ力や能力の総体を示す、簡潔で一般的な訳語を選んだ。
- source_word: πλησίον
  choice: 隣人
  rationale: 単数形の一般的・代表的用法を、日本語で広く理解される倫理的語彙によって表した。
- source_word: ὡς ἑαυτόν
  choice: 自分自身のように
  rationale: 特定の聞き手への直接命令に変えず、原文の一般的な再帰表現を保った。
- source_word: περισσότερόν ἐστιν
  choice: よりもまさっています
  rationale: 比較による明白な優越を示しつつ、犠牲制度の廃止など本文にない結論は加えなかった。
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: あらゆる全焼のいけにえと犠牲
  rationale: πάντωνの包括性を「あらゆる」で表し、ὁλοκαυτώματαが祭壇上で全部焼かれる供え物を指すことを「全焼のいけにえ」で区別した。
theological_decisions:
- issue: 愛の戒めと犠牲祭儀との関係
  choice: 神への全き愛と隣人愛は、あらゆる全焼のいけにえと犠牲よりもまさると訳す。
  alternative: 犠牲祭儀そのものを無効または廃止すると明示する。
  rationale: περισσότερόν ἐστινは優越を明確に示すが、この節自体は犠牲制度の廃止まで明言していないため、比較の強さと神学的緊張の両方を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい端正さを保った。「心のすべて、理解力のすべて、力のすべて」という反復により、原文の三重の全体性を再現した。
