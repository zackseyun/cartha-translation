  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: ja
  text: 彼は再び、彼らのもとへ別の僕[a]を遣わした。彼らはその僕の頭を打ち[b]、辱めた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「別の奴隷」。ギリシア語の「ドゥーロス」は、文脈により「僕」とも「奴隷」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: ここで使われる珍しい動詞は、頭部に暴力を加えることを指す。「頭に傷を負わせた」とも訳し得るが、「首をはねた」という意味ではないと考えられる。
    reason: lexical_alternative
  - marker: c
    text: または「恥ずべき扱いをした」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: たとえの中で繰り返される行動を簡潔に示す、自然な現代日本語。
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: 彼らのところへ……遣わした
  rationale: 派遣する行為とその相手を自然に表し、「遣わす」は物語の品位を保つ。
- source_word: ἄλλον δοῦλον
  choice: 別の僕
  rationale: δοῦλοςが示す主人への従属関係を保ちつつ、たとえの文脈で自然に読める表現。法的身分を明示する「奴隷」も可能なので脚注に残す。
- source_word: κἀκεῖνον
  choice: すると彼らは、その僕を
  rationale: καίとἐκεῖνονの継続・指示の力を、日本語では主語を補い「その僕」と受けることで明確にした。
- source_word: ἐκεφαλίωσαν
  choice: その僕の頭を打ち
  rationale: 頭部に向けられた暴力を表す珍しい動詞。斬首とは断定せず、自然で明瞭な表現とした。
- source_word: ἠτίμασαν
  choice: 辱めた
  rationale: 相手を不名誉に扱う意味を簡潔かつ品位ある日本語で表す。「恥ずべき扱いをした」という理解も脚注に示す。
theological_decisions: []
