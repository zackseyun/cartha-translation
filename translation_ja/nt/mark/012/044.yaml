id: MRK.12.44
reference: Mark 12:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: ja
  text: 皆、自分たちの余りの中から献金したのに対し、このやもめは乏しさの中から、持っていたものをすべて、すなわち生活のための全財産[a]を献金したのだからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼女の生活のすべて」。ここでは、生きていくための資産・生活手段のすべてを指す。
    reason: βίοςは字義的には「生活」を表すが、この献金の文脈では生活を支える資産・生計手段を意味することを示すため。
lexical_decisions:
- source_word: πάντες γὰρ
  choice: 彼らは皆……したのだから
  rationale: πάντεςの総括性を「皆」で保ち、γάρは文末の「のだから」によって、直前のイエスの評価を根拠づける説明として自然な日本語で示した。
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: 有り余る中から
  rationale: 必要を超えて余っているものから出したという意味を、過度に説明的にせず明瞭に表した。
- source_word: ἔβαλον / ἔβαλεν
  choice: 献金した
  rationale: βάλλωの基本義は「入れる、投げ入れる」だが、献金箱への拠出という文脈を現代日本語で自然に伝えるため「献金した」とした。
- source_word: αὕτη δὲ
  choice: しかし、この女は
  rationale: δέの強い対照を「しかし」で示し、指示代名詞αὕτηは文脈上のやもめを指すものとして「この女」と訳した。
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: 乏しい中から
  rationale: ὑστέρησιςが表す欠乏・窮乏を、簡潔で自然な「乏しい中から」とした。
- source_word: πάντα ὅσα εἶχεν
  choice: 持っていたものをすべて
  rationale: 所有していたものの全体を指す包括性をそのまま保った。
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: 生活の糧を全部
  rationale: この文脈のβίοςは生物学的な命よりも、生計・生活手段を指す。「生活の糧」はその意味を明確にしつつ、直前の「すべて」と重なる原文の強調も「全部」で保つ。
theological_decisions:
- issue: ὅλον τὸν βίον αὐτῆςにおけるβίοςの意味
  choice: 生計を支えるもの（「生活の糧」）
  alternative: 彼女の生活のすべて／彼女の全生涯
  rationale: 金銭を献げる場面ではβίοςは生活手段・生計を意味しうるため、彼女がその時点で命そのものを差し出したと断定せず、経済的な全面性を表した。一方、原語の字面が持つ広がりは脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を用い、対照と反復による原文の強調を保った。「献金した」は文脈に即した自然な表現であり、「生活の糧」は日常的でありながら尊厳ある語調を保つ。
