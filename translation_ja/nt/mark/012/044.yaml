revisions:
- from: 彼らは皆、有り余る中から献金した。しかし、この女は乏しい中から、持っていたものをすべて、生活の糧を全部[a]献金したのだから。
  to: 皆、自分たちの余りの中から献金したのに対し、このやもめは乏しさの中から、持っていたものをすべて、すなわち生活のための全財産[a]を献金したのだからである。
  rationale: 原文の説明的なγάρは「のだからである」で、対照のδέは「のに対し」で表した。「持っていたものをすべて」と「彼女の全生計」の反復的な強調は、「すべて、すなわち生活のための全財産」として保った。脚注はβίοςの字義的な幅を示しつつ、本文では文脈上の経済的意味を自然に表す。
