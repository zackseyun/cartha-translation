id: MRK.1.9
reference: Mark 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: ja
  text: そのころ、イエスはガリラヤのナザレから来て、ヨルダン川でヨハネから洗礼を受けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨルダン川に入って」とも訳せる。ギリシア語の前置詞は、より字義的にはこのように訳すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: そのころ
  rationale: 物語を進める定型的な導入句を、現代日本語で簡潔かつ自然に表した。「その日々に、こうして起こった」のような逐語訳は不自然になるため避けた。
- source_word: ἦλθεν
  choice: 来て
  rationale: 基本的な移動を表す動詞の意味を保ち、後続する出来事と自然につないだ。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: ガリラヤのナザレから
  rationale: 属格による地域の特定を、日本語の自然な地名表現で示した。
- source_word: ἐβαπτίσθη
  choice: 洗礼を受けた
  rationale: 受動形を自然な日本語で表し、儀式の方式を本文以上に限定しない訳語を採用した。
- source_word: εἰς τὸν Ἰορδάνην
  choice: ヨルダン川で
  rationale: 洗礼が行われた場所として自然に理解できる日本語にした。εἰς の方向性をより明示する訳は脚注に残した。ギリシア語では単に「ヨルダン」だが、日本語では河川名であることを明確にする「川」が定着しており自然である。
- source_word: ὑπὸ Ἰωάννου
  choice: ヨハネから
  rationale: 受動文における行為者を示す。日本語では「ヨハネによって」よりも「ヨハネから洗礼を受けた」が自然である。
theological_decisions:
- issue: 教派的な含意を伴いうる βαπτίζω の訳し方
  choice: 洗礼を受けた
  alternative: 浸された
  rationale: この節は洗礼の出来事を述べるが、その方式を訳語によって限定する必要はない。「洗礼」は原文の叙述に忠実で、特定の教派的理解を持ち込まない。
- issue: εἰς τὸν Ἰορδάνην の場所・方向表現
  choice: ヨルダン川で
  alternative: ヨルダン川に入って
  rationale: 本文では洗礼の場所を自然に示しつつ、前置詞 εἰς が持ちうる方向性は脚注で明示し、原文の含みを失わないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、福音書の簡潔な物語調を保った。「そのころ」によって導入句を自然に処理し、過度に古風な「その日々に、こうして起こった」は避けた。
