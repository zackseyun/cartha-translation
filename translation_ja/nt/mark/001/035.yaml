  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: ja
  text: 朝早く、まだ真っ暗なうちに、イエスは起きて外へ出て行き、人里離れた場所へ向かった。そして、そこで祈っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: 朝早く、まだ暗いうちに
  rationale: 三語を一まとまりの時間表現として自然な現代日本語にし、早朝であることと、なお暗かったことの両方を保持した。
- source_word: ἀναστὰς
  choice: 起きて
  rationale: 主動詞に先立つ付帯的な動作を、簡潔で自然な連用形によって表した。
- source_word: ἐξῆλθεν καὶ ἀπῆλθεν
  choice: 外へ出て行き、…向かった
  rationale: まずその場から外へ出て、次いで目的地へ移動したという二段階の叙述を保ちつつ、日本語として不自然な重複を避けた。
- source_word: εἰς ἔρημον τόπον
  choice: 人里離れた場所へ
  rationale: ἔρημοςが示す、人が住まず寂れた、あるいは荒野のような場所という幅を、日本語で過度に地理的な『荒野』へ限定せずに表した。
- source_word: κἀκεῖ
  choice: そして、そこで
  rationale: καὶ ἐκεῖの物語上の連結と場所の指示を明確に表した。
- source_word: προσηύχετο
  choice: 祈っていた
  rationale: 未完了過去の継続的・進行的な相を、日本語の『ていた』で反映した。
theological_decisions:
- issue: イエスの祈りに対する物語上の強調
  choice: イエスが人里離れた場所へ行って祈っていたという出来事を、そのまま叙述する。
  alternative: 弟子としての模範や、祈りにおけるイエスの依存というキリスト論的含意を訳文に織り込む。
  rationale: 原文は早朝に出て行って祈るイエスの行動を叙述しているが、その神学的意味を明示してはいないため、解釈を本文に付加しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、簡潔ながら品位ある物語文とした。主語は文脈上の人物を明確にするため『イエス』と補った。注記を必要とするほど意味を限定する表現は避け、『人里離れた場所』によってἔρημοςの語義の幅を本文内で確保した。
