review_pass:
  verdict: revise
  source_fidelity: 本文は行動の順序（起きる、出る、離れて行く、そこで祈る）と、προσηύχετο の継続的な過去を適切に伝えている。εἰς ἔρημον τόπον を「人里離れた場所」とするのも、地理的に「荒野」と限定せず語義の幅を保つ自然な訳である。ただし、「朝早く、まだ暗いうちに」では λίαν の強い程度が十分に明示されないため、「まだ真っ暗なうちに」として補うのが安全である。
  naturalness: 「朝早く、まだ真っ暗なうちに」は明瞭で自然な現代標準日本語であり、早朝でありながら夜の暗さがなお濃いという原文の重なった時間表現を滑らかに表せる。「そこで祈っていた」も物語文として自然である。
  terminology: 「イエス」は本文脈上適切な固有名である。「人里離れた場所」はἔρημος τόποςの「人のいない／へんぴな／荒野的な場所」という幅を保ち、教派的・解釈的な含意を加えない。注記は必須ではない。
  issues:
