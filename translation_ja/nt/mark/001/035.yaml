    issue: λίανの強調が本文で弱い
    rationale: 「朝早く」と「まだ暗いうちに」は πρωῒ とἔννυχαを伝えるが、λίαν（非常に、たいへん）の強調を明確には表していない。「まだ真っ暗なうちに」に改めることで、夜がなお十分に続いているという強調を自然に反映できる。
