  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: ja
  text: すると、汚れた霊はその人を激しくけいれんさせ、大声で叫んで、その人から出て行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: 激しくけいれんさせ
  rationale: このアオリスト分詞は、霊が出て行く際にその人を激しくけいれんさせたことを表す。日本語では「引き裂く」よりも、この文脈での身体的な発作を自然かつ明確に伝える。
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: 汚れた霊
  rationale: 福音書で悪霊的存在を指す定型的な表現。「汚れた」はἀκάθαρτοςの宗教的・道徳的な含みを保ち、本文にない説明を加えない。
- source_word: φωνῆσαν
  choice: 叫んで
  rationale: 大きな声を発する動作を自然な現代日本語で表し、感情の種類までは限定しない。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 声の大きさを表す様態の与格を、簡潔で自然な日本語にした。
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: その人から出て行った
  rationale: 霊が人から離れるという空間的・人格的な描写を明確に保つ。
- source_word: καὶ ... καὶ
  choice: すると、…て、…た
  rationale: マルコの連続的な語りを保ちつつ、ギリシア語の分詞と等位接続を自然な日本語の動作連鎖として表した。
theological_decisions:
- issue: 取りついている存在の性質
  choice: 人格的に行動する「汚れた霊」として訳す
  alternative: 非人格的な悪の力として表現する
  rationale: 本文ではこの霊が人をけいれんさせ、叫び、その人から出て行く主体として描かれている。その人格的な行為性を保ちつつ、本文を越える教理的説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「けいれん」は常用的に読める表記を優先し、「痙攣」は避けた。動作の順序と勢いを自然な一文で示した。
