source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: ja
  text: ヨハネはこう宣べ伝えていた。「私より力のある方が、私の後から来られる。私は、かがんでその方のサンダルのひもを解くにもふさわしくない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ふさわしくない」は、「その資格がない」または「それに足りない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: 告げていた
  rationale: 未完了時制の継続・反復の含みを「ていた」で表し、κηρύσσωの公に告知する意味を、現代の一般読者に分かりやすい語で示した。
- source_word: λέγων
  choice: こう
  rationale: 引用を導く分詞を、日本語では自然な「こう告げていた」という形に統合した。
- source_word: Ἔρχεται
  choice: 来られる
  rationale: 現在形が伝える到来の切迫感を保ちつつ、文脈上の人物への自然な敬意を表した。未来だけに限定せず、「来つつある／来る」という現在的な響きを残す。
- source_word: ὁ ἰσχυρότερός μου
  choice: 私より力のある方
  rationale: 冠詞付き比較級の実名詞的用法を自然な日本語で表し、ἰσχυρόςの基本的な「強い、力がある」という意味を保った。
- source_word: ὀπίσω μου
  choice: 私の後から
  rationale: 空間的な「後ろから」と時間的・継承的な「後に」の双方を許す表現を選んだ。
- source_word: ἱκανὸς
  choice: ふさわしくない
  rationale: 単なる能力不足ではなく、来る方に対する自分の立場の低さを表す文脈上の意味を自然に伝える。語の幅は脚注に残した。
- source_word: κύψας λῦσαι
  choice: かがんで…解く
  rationale: アオリスト分詞が示す、身を低くしてから解くという付随・先行動作を、自然な動作の連続として表した。
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: その方のサンダルのひも
  rationale: 古代の履物を「サンダル」、それを留める革ひもを現代日本語で分かりやすく「ひも」とした。
theological_decisions:
- issue: ヨハネが表す自己卑下の程度
  choice: 解くにもふさわしくない
  alternative: 解く資格がない／解くに足りない
  rationale: ἱκανόςには「十分な、適任の、資格のある」という幅がある。ここでは履物のひもを解く低い奉仕さえ自分にはふさわしくないという身分上の対比を表し、単なる身体的能力不足とはしなかった。
- issue: 「私の後から」の関係
  choice: 時間的・空間的な含みを残す
  alternative: 私の後に活動を始める／私の後ろを歩いて来る
  rationale: ὀπίσω μουを一方の意味だけに限定せず、ヨハネの後に来ることと、後方から近づく像の両方を許す日本語にした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「宣べ伝える」より一般的な「告げる」を選びつつ、公の宣言という調子を保った。主語は直前の文脈で明らかなヨハネを補い、単独の節としても理解しやすくした。
