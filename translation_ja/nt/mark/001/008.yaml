id: MRK.1.8
reference: Mark 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: ja
  text: 私はあなたがたに水でバプテスマを授けました。しかし、あの方はあなたがたに聖霊によって[a]バプテスマを授けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊の中で」。ギリシア語の前置詞は、手段・媒介とも領域とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: 私は
  rationale: 明示された一人称代名詞を訳出し、後半の「あの方は」との強調された対比を保った。
- source_word: ἐβάπτισα
  choice: バプテスマを授けました
  rationale: 儀礼的・聖書的な意味を保ちつつ、浸礼という方式だけに限定しない標準的な表現とした。アオリストは文脈に即して過去形で表した。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: 複数の二人称であることを明示し、日本語の「バプテスマを授ける」という構文に合わせて対象を「に」で示した。
- source_word: ὕδατι
  choice: 水で
  rationale: 与格の手段的用法を、簡潔で自然な現代日本語にした。「水の中で」として方式を限定することは避けた。
- source_word: αὐτὸς
  choice: あの方は
  rationale: 先に告げられた来るべき方を指すことを自然に示し、「私は」との対比も保った。日本語として過度に重い「あの方ご自身は」は避けた。
- source_word: δὲ
  choice: しかし
  rationale: ヨハネの行う水のバプテスマと、来る方が行う聖霊によるバプテスマとの明確な対比を表した。
- source_word: βαπτίσει
  choice: バプテスマを授けます
  rationale: 前半と語彙上の対応を保ち、未来の行為であることを非過去形によって自然に表した。
- source_word: ἐν
  choice: によって
  rationale: ἐν＋与格がここで表し得る手段・媒介を自然な日本語で示した。ただし領域を表す「中で」の可能性もあるため脚注に残した。
- source_word: πνεύματι ἁγίῳ
  choice: 聖霊
  rationale: マルコの文脈では神の聖霊を指すのが最も自然であり、日本語の標準的な聖書用語を用いた。
theological_decisions:
- issue: πνεύματι ἁγίῳが神の聖霊を指すのか、非人格的な聖なる力を指すのか
  choice: 聖霊
  alternative: 聖なる霊
  rationale: ヨハネの水によるバプテスマと、より力ある来る方の働きとの対比では、神の聖霊を指すと読むのが最も自然である。ただし本文がここで聖霊についてそれ以上の説明をしていない点は補わなかった。
- issue: ἐν πνεύματι ἁγίῳのἐνをどう表すか
  choice: 聖霊によって
  alternative: 聖霊の中で
  rationale: 手段・媒介として読む自然な日本語を本文に採用した一方、領域を示す読みもギリシア語上可能なので脚注で明示し、解釈上の幅を保持した。
translation_notes:
  register: 明瞭で現代的ながら礼節ある文体とした。「あなたがた」で複数を明示し、前半と後半の対比を二文に分けて読みやすくした。「バプテスマ」は教会的伝統を特定の施行方式に狭めず、原語の儀礼的・相互参照的な力を保つ語として採用した。
