  terminology: 「バプテスマを授ける」は儀礼語として標準的で、浸すという方式に意味を狭めない。「聖霊」は当該文脈に即した標準的な神学用語である。脚注はἐνの「によって」と「中で」の両可能性を適切に保持しており、本文の訳語選択を過度に教義化していない。
