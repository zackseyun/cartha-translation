  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: ja
  text: すると、たちまち重い皮膚病はその人から去り、彼は清められた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清くされた」とも訳せる。この動詞には、身体が回復したことだけでなく、祭儀上の汚れから清められたという意味合いもある。
    reason: 語義の別訳と祭儀的含意を示すため。
lexical_decisions:
- source_word: εὐθὺς
  choice: たちまち
  rationale: 出来事が直ちに起こったことを簡潔に表し、マルコ特有の切迫感を保つ。
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: その人から去り
  rationale: 病を主語とする原文の構文と、「彼から離れ去った」という意味を自然な日本語で保つ。
- source_word: λέπρα
  choice: 重い皮膚病
  rationale: 聖書時代の λέπρα は現代医学のハンセン病だけに限定されないため、その範囲を不当に狭めず、一般読者にも理解できる表現とした。
- source_word: ἐκαθαρίσθη
  choice: 彼は清められた
  rationale: 身体的な回復だけでなく、汚れから清い状態へ移されたという祭儀的含意も保つ。受動態も維持した。
theological_decisions:
- issue: ἐκαθαρίσθη における身体的治癒と祭儀的清めの関係
  choice: 「彼は清められた」と訳し、両方の響きを残す。
  alternative: 「彼は治った」または「彼は清くされた」
  rationale: 「治った」では身体的回復に意味が限定されやすい。原文は皮膚病の消失と清めを並べて述べているため、祭儀的な清さへの回復も含み得る表現を選んだ。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、叙述の簡潔さと尊厳を保った。「重い皮膚病」は古代の病名を現代のハンセン病に限定しないための表現である。
