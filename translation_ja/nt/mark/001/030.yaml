  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: ja
  text: シモンのしゅうとめは熱があって横になっていた。すぐに、イエスに彼女のことを伝えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「伝える」は現在形で、出来事を生き生きと語る歴史的現在が用いられている。
    reason: 原文の時制上の特徴を示しつつ、本文では自然な日本語の過去形を用いるため。
lexical_decisions:
- source_word: πενθερὰ
  choice: しゅうとめ
  rationale: 文脈上、シモンの妻の母を指す標準的な親族名称。現代日本語で自然な「しゅうとめ」とした。
- source_word: κατέκειτο
  choice: 横になっていた
  rationale: 未完了形が表す継続状態を保ちつつ、「寝たきり」のように病状を強めすぎない表現とした。
- source_word: πυρέσσουσα
  choice: 熱を出して
  rationale: 発熱している状態を表す分詞を、明快で自然な現代日本語にした。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 行動の速やかさを示すマルコ特有の語調を、簡潔で自然な表現で保った。
- source_word: λέγουσιν
  choice: 伝えた
  rationale: ギリシア語は臨場感を与える歴史的現在だが、日本語本文では前文との時制の流れを自然にするため過去形とし、原文の形は脚注に示した。
- source_word: περὶ αὐτῆς
  choice: 彼女のことを
  rationale: 「彼女について／彼女に関して」の意味を、会話的になりすぎない自然な日本語で表した。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 直訳は「彼に」だが、文脈上の指示対象を日本語で明確にするため固有名を補った。
- source_word: δὲ
  choice: （訳出せず）
  rationale: ここでは物語を緩やかに進める接続辞であり、二文の自然な連続によって機能が十分に伝わるため、独立した接続語を置かなかった。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。病状を必要以上に重く表現せず、物語の迅速な展開を保った。「姑」ではなく、読みやすく関係を明確にするため平仮名の「しゅうとめ」を用いた。
