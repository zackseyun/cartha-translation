reference: Mark 1:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: ja
  text: こう言った。「私たちとあなたに何の関係があるのですか[a]、ナザレ人イエスよ[b]。私たちを滅ぼしに来たのですか。私はあなたが何者か知っています。神の聖なる方です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「私たちとあなたに何があるのか」。互いの関与を拒むことや敵対的な隔たりを表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ナザレのイエスよ」。ギリシア語は「ナザレ人イエスよ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ἡμῖν καὶ σοί
  choice: 私たちとあなたに何の関係があるのですか
  rationale: 直訳的には「私たちにとって、またあなたにとって何か」というセム語的な慣用句で、関与の拒絶や敵対的な隔たりを表す。現代日本語として自然であり、その対立的な響きを保つ表現とした。
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: ナザレ人イエスよ
  rationale: Ναζαρηνέ は呼格の形容的呼称「ナザレ人」であるため、地名句に言い換えず、ギリシア語の形を比較的明瞭に保った。呼びかけは「よ」で示した。
- source_word: ἦλθες
  choice: 来たのですか
  rationale: アオリストの問いを、到来の目的を問う自然な日本語で表した。
- source_word: ἀπολέσαι
  choice: 滅ぼしに
  rationale: この悪霊追放の文脈では、破滅させる、滅ぼすという強い意味が適切である。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 一人称複数をそのまま保持し、話者が自らを複数として語る本文上の緊張を解消しない。
- source_word: οἶδά σε τίς εἶ
  choice: 私はあなたが何者か知っています
  rationale: 相手の正体を認識しているという宣言を、自然かつ明確な現代日本語で表した。
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: 神の聖なる方
  rationale: 定冠詞を伴う称号的表現を「聖なる方」とし、属格 τοῦ θεοῦ を「神の」として保持した。
theological_decisions:
- issue: 悪霊によるキリスト論的称号の告白
  choice: 神の聖なる方
  alternative: 神に属する聖者／神の聖者
  rationale: 称号としての力を保ちながら、それを後代の教理用語へ拡張せず、ギリシア語の属格関係に残る幅も不必要に限定しない。
- issue: 話者の単数と目的語の複数
  choice: 「私は」と「私たち」をともに保持
  alternative: 複数を悪霊一般などと説明的に補う
  rationale: 本文は単数の「私は」と複数の「私たち」を併置しているため、その緊張を説明で解消せずそのまま訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、悪霊の切迫した問いかけに合う丁寧体とした。「ナザレ人イエスよ」「神の聖なる方」は威厳と称号性を保つ。発話導入の λέγων は前節から続く分詞なので「こう言った」と簡潔に訳した。
