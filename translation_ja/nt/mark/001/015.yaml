id: MRK.1.15
reference: Mark 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: ja
  text: そして、こう言われた。「定めの時は満ち、神の国[a]は近づいた。悔い改めて、福音[b]を信じなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の支配」。
    reason: lexical_alternative
  - marker: b
    text: 「福音」は「良い知らせ」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: 満ち
  rationale: 完了形が示す、定められた時が満ちて今に至っているという結果を、簡潔で自然な日本語で表す。
- source_word: ὁ καιρὸς
  choice: 定めの時
  rationale: 単なる時間一般ではなく、決定的な時機・定められた時を指す文脈上の意味を明確にする。
- source_word: ἤγγικεν
  choice: 近づいた
  rationale: 完了形による到来・接近と現在の近さを保ちつつ、実際に到来したのか目前まで来たのかを過度に限定しない。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 領域と神の王的支配の双方を含み得る定着した表現であり、語の幅を保つ。
- source_word: μετανοεῖτε
  choice: 悔い改めて
  rationale: 考えだけでなく生き方の転換を求める命令を、現代日本語で広く理解される聖書的表現によって伝える。
- source_word: πιστεύετε
  choice: 信じなさい
  rationale: 命令の力を明確に表し、πίστις語群の基本的意味を過度な言い換えなしに保つ。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 福音を
  rationale: πιστεύωに続くἐνを日本語として自然な目的語構文で表す。「福音」は本文の宣教的・正典的な響きを保ち、平易な意味は脚注で示す。
- source_word: λέγων
  choice: こう言われた
  rationale: 前節から続く分詞を自然な日本語の叙述にし、発言の導入であることを明確にする。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦの意味の幅
  choice: 神の国
  alternative: 神の支配
  rationale: 場所・領域だけにも、支配の働きだけにも狭めず、原語が持つ神の王権とその現れの幅を保つ。
- issue: εὐαγγέλιονの訳語
  choice: 福音
  alternative: 良い知らせ
  rationale: 自然で定着した日本語を本文に置きつつ、その語義を脚注で明示して、教会用語に不慣れな読者にも理解できるようにする。
- issue: μετανοεῖτε καὶ πιστεύετεの現在命令形
  choice: 悔い改めて、福音を信じなさい
  alternative: 悔い改め続け、信じ続けなさい
  rationale: 現在語幹の継続性を明示的に補わず、宣告に伴う切迫した命令を自然な日本語で表して、アスペクトを過剰解釈しない。
- issue: ἤγγικενの到来と近接の緊張
  choice: 近づいた
  alternative: 近くに来ている
  rationale: 神の国がすでに接近したという完了的な面を示しながら、その実現のあり方を訳文で一義的に決めない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、宣教の言葉にふさわしい簡潔さと威厳を保った。「定めの時」でκαιρόςの決定的時機を示し、「神の国」「福音」は定着した表現として本文に残し、意味上の幅や平易な言い換えを脚注で補った。
