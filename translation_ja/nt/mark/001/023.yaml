  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: ja
  text: するとすぐに、彼らの会堂には、汚れた霊につかれた[a]男がいて、叫び声を上げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「汚れた霊のうちにいた」。また、「汚れた霊に取りつかれた」と訳すこともできる。
    reason: 原文のἐνによる表現の字義と、より解釈的な訳の可能性を示すため。
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な素早い物語展開を、現代日本語で自然かつ簡潔に表す。
- source_word: συναγωγῇ αὐτῶν
  choice: 彼らの会堂
  rationale: συναγωγήはこの文脈ではユダヤ人の会堂を指す。αὐτῶνも省略せず「彼らの」とした。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 日本語では性別を明示せずとも自然に特定の人物を指せるため、「人」とした。
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: 汚れた霊につかれた
  rationale: ギリシア語の直訳は「汚れた霊のうちに」だが、日本語で意味が通じる慣用的表現を採用した。ただし「取りつかれた」ほど状態を強く規定しない形とした。
- source_word: ἀκαθάρτῳ
  choice: 汚れた
  rationale: 儀礼的・道徳的な含意を保ち、福音書で定着した表現にも合う。
- source_word: ἀνέκραξεν
  choice: 叫び声を上げた
  rationale: 大声で叫ぶ動作を自然な日本語で示し、感情の種類までは限定しない。
theological_decisions:
- issue: ἐν πνεύματι ἀκαθάρτῳにおける悪霊的苦しみの表現
  choice: 汚れた霊につかれた
  alternative: 汚れた霊のうちにいた／汚れた霊に取りつかれた
  rationale: 原文の前置詞句は字義どおりには「汚れた霊のうちに」だが、そのままでは日本語として不自然である。「つかれた」は霊との密接な関係を明確にしつつ、「取りつかれた」よりも解釈を強く固定しない。字義的表現は脚注に残した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、会堂・汚れた霊という聖書固有の語彙を保持した。「するとすぐに」で前節との連続とマルコの速度感を表した。
