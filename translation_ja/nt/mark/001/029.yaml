  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: ja
  text: そしてすぐに、一行は会堂を出て、ヤコブとヨハネを伴い、シモンとアンデレの家に入った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコ福音書に特徴的な、物語を速やかに進める副詞。現代日本語として自然で、即時性も保つ。
- source_word: ἐκ τῆς συναγωγῆς ἐξελθόντες
  choice: 会堂を出て
  rationale: ἐκと退出を表す分詞の意味を、重複を避けながら自然な日本語で表した。後続の主動詞に先立つ行為であることも保持する。
- source_word: ἦλθον εἰς τὴν οἰκίαν
  choice: 家に入った
  rationale: ἔρχομαιは文脈により「来る／行く」を表し、εἰςは内部への移動を示す。日本語では語り手の視点を不自然に固定せず、到着先の内部へ入ったことを明確にする「家に入った」が自然である。
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: シモンとアンデレの
  rationale: 属格が、その家とシモンおよびアンデレとの帰属関係を示すため。人名は日本語聖書で一般的な表記に従った。
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: ヤコブとヨハネを伴い
  rationale: μετά＋属格による同行を明確に表す。原文では主語となる一行と同行した二人を区別している。
- source_word: ἐξελθόντες ἦλθον
  choice: 一行は…出て…入った
  rationale: ギリシア語の複数主語は直前の文脈から補われる。日本語で主語不明瞭になるのを避けつつ、原文が個々の名をここで列挙しない点を保つため「一行」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「会堂」は συναγωγή の一般的な聖書用語として用いた。原文の動作順序と、ヤコブおよびヨハネが同行者として明示される構造を保った。
