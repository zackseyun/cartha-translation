  source_fidelity: Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ χριστοῦ is represented faithfully as a terse, title-like nominal expression. 「始まり」 appropriately renders Ἀρχή without supplying a finite verb. 「良い知らせ」 accurately renders εὐαγγέλιον, and 「メシアであるイエス」 conveys χριστοῦ as a title rather than treating it merely as a surname. The Japanese 「イエスの」 retains the Greek genitive's open relationship to the good news and does not prematurely restrict it to ‘about Jesus.’
