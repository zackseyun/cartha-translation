base_translation:
  language: en
  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: ja
  text: メシアであるイエス[b]の良い知らせ[a]の始まり。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「福音」。ギリシア語 εὐαγγέλιον は「良い知らせ」を意味し、伝統的に「福音」と訳される。
    reason: lexical_alternative
  - marker: b
    text: または「イエス・キリスト」。ギリシア語 Χριστός は、称号として用いられる場合「メシア」を意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: 始まり
  rationale: 無冠詞の名詞による表題的な書き出しを、文として補いすぎず自然な日本語で表した。「初め」も可能だが、ここでは出来事や宣教の開始を明瞭に伝える「始まり」とした。
- source_word: εὐαγγελίου
  choice: 良い知らせ
  rationale: 語の意味を現代の一般読者に直接伝える訳語。「福音」は伝統的な訳語として脚注に残した。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 人名として、日本語聖書で定着した表記を用いた。
- source_word: χριστοῦ
  choice: メシアである
  rationale: Χριστόςを姓のように扱わず、イエスの称号として訳した。日本語として自然にイエスを修飾するため「メシアである」とした。
theological_decisions:
- issue: Χριστοῦを称号として訳すか、伝統的な「キリスト」を用いるか
  choice: メシアであるイエス
  alternative: イエス・キリスト
  rationale: この箇所のΧριστόςはイエスをメシアとして示す称号と理解できるため、その意味を明示した。一方、伝統的な表現も脚注に示した。
- issue: 属格Ἰησοῦ χριστοῦとεὐαγγελίουの関係
  choice: 「メシアであるイエスの良い知らせ」とし、属格の幅を保つ
  alternative: 「メシアであるイエスについての良い知らせ」
  rationale: 「についての」と限定すると、良い知らせの内容を表す属格に解釈を固定する。原文は起源・所属・内容などの含みを持ちうるため、日本語でも「イエスの」として曖昧さを保った。
translation_notes:
  register: 簡潔で表題的な原文の形を保ちつつ、現代の一般読者に分かる語彙を用いた。「メシアであるイエス」は称号の意味を明確にし、「イエスの良い知らせ」は属格の解釈を不必要に限定しない。
