  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: ja
  text: ヨハネは、らくだの毛でできた衣を身にまとい、腰には革の帯を締めていた[a]。また、いなごと野蜜を食べていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この服装は列王記第二1章8節に記されたエリヤの姿を思い起こさせ、マルコがヨハネを先駆けとなる預言者として描いていることを示唆している。
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: 身にまとい
  rationale: 完了分詞が表す、衣を身に着けた状態を自然な現代日本語で示す。後続の「締めていた」と合わせ、継続的な姿の描写として訳した。
- source_word: τρίχας καμήλου
  choice: らくだの毛でできた衣
  rationale: 原文は直訳すれば「らくだの毛を着て」であり、毛皮ではなく、らくだの毛を素材とする衣を指す。日本語では衣を補うことで意味を明確にした。
- source_word: ζώνην δερματίνην
  choice: 革の帯
  rationale: ζώνηは腰に巻く帯、δερματίνηは革製であることを表す。「革の帯」は簡潔で自然。
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: 腰には……締めていた
  rationale: ὀσφύςの身体部位を現代日本語の「腰」で表し、περίの巻き付ける位置関係を「締める」という自然な表現に組み込んだ。
- source_word: ἔσθων
  choice: 食べていた
  rationale: 現在分詞による継続的・習慣的な描写を「食べていた」で保持した。
- source_word: ἀκρίδας
  choice: いなご
  rationale: 通常の語義である食用にもなる昆虫を指す。植物などを意味する根拠はない。
- source_word: μέλι ἄγριον
  choice: 野蜜
  rationale: 野生の蜂から採れる、あるいは野で見つかる蜂蜜を指す簡潔で定着した日本語表現。
- source_word: καὶ ἦν
  choice: ヨハネは……身にまとい
  rationale: καίは文脈をつなぐが、日本語では文頭の接続詞を明示せずとも連続性が自然に伝わる。ἦνと完了分詞による状態描写は「身にまとい……締めていた」で表した。
theological_decisions:
- issue: ヨハネの服装とエリヤの預言者的イメージとの関係
  choice: 本文はヨハネの姿と食物を描写するにとどめ、エリヤとの結び付きを明示しない。
  alternative: 本文中でヨハネをエリヤになぞらえて説明する。
  rationale: 服装は列王記第二1章8節のエリヤを想起させるが、マルコ1章6節自体はその同一視や対応関係を明言していない。そのため相互参照上の意義は脚注に置く。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「らくだ」は読みやすさを優先して平仮名とし、「野蜜」は聖書的文脈にもなじむ簡潔な語を採用した。原文の二つのκαίは、日本語として過度に接続詞を重ねないよう文を分け、二文目を「また」でつないだ。
