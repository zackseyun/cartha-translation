  rationale: 本文の意味は保持したまま、「雇い人たちとともに」により原文の関係を読み取りやすくした。脚注はὀπίσω αὐτοῦの空間的・弟子としての両義性を保ちつつ、「直訳」の不正確な方向づけを避け、ἀπῆλθονを含む表現として自然で正確な代替訳に改めた。
