    rationale: 誤りではないが、「雇い人たちとともに舟に残して」とすると、「雇い人たち」と「舟」がともに父ゼベダイに関わる原文の構造を自然に明示できる。
  revised_text: するとイエスはすぐに二人を呼ばれた。二人は父ゼベダイを雇い人たちとともに舟に残して、イエスの後について行った[a]。
