  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: ja
  text: するとイエスはすぐに二人を呼ばれた。二人は父ゼベダイを雇い人たちとともに舟に残して、イエスの後について行った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼の後を行った」「彼に従って行った」とも訳せる。この表現は、実際にイエスの後を進んだことと、弟子として従い始めたことの両方を含みうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコ福音書に特徴的な切迫感を示す語であり、時間的な即時性を自然な現代日本語で表す。
- source_word: ἐκάλεσεν
  choice: 呼ばれた
  rationale: 文脈上の主語であるイエスへの敬意を自然に示しつつ、命令や招待に意味を限定せず、καλέωの基本的な意味を保つ。
- source_word: ἀφέντες
  choice: 残し
  rationale: 主動詞に先立つ付帯的な行為を簡潔に表し、「見捨てた」という原文以上に強い含意を避ける。
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: 父ゼベダイ
  rationale: 日本語では「二人の父ゼベダイ」より自然であり、二人との関係と固有名を明確に示す。
- source_word: πλοίῳ
  choice: 舟
  rationale: ガリラヤ湖で用いられた漁船という文脈に合う、簡潔で自然な語。
- source_word: μισθωτῶν
  choice: 雇い人たち
  rationale: 賃金を受けて働く者を指す語義を保ち、「従業員」のような現代的な企業用語を避ける。
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: イエスの後について行った
  rationale: その場を離れてイエスの後ろを進む動作と、弟子として従い始める含意の双方を日本語で自然に保つ。代名詞を反復するより、指示対象の「イエス」を明示する方が日本語として明瞭である。
theological_decisions:
- issue: ὀπίσω αὐτοῦにおける弟子として従う含意
  choice: イエスの後について行った
  alternative: イエスに従った／イエスの後ろへ行った
  rationale: 「従った」だけでは弟子入りの意味に寄りすぎ、「後ろへ行った」だけでは物理的移動に寄りすぎる。「後について行った」は、実際に後ろを進む動作と弟子として従うことの両方を響かせ、原文の含みを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「すると」で物語の連続性を示し、「すぐに」でマルコ特有の速度感を保った。イエスについては自然な敬語として「呼ばれた」を用いたが、弟子たちの動作は平叙体で簡潔に表した。
