- from: すると、イエスは彼らに言った。「ほかの所へ、近くの町々[a]にも行こう。そこでも宣べ伝えるためだ。私はそのために出て来たのだから[b]。」
  to: イエスは彼らに言った。「近くのほかの町々[a]へ行こう。そこでも宣べ伝えるためだ。わたしはそのために出て来たのだから[b]。」
  rationale: 行き先を「近くのほかの町々へ」と一続きにして、ἀλλαχοῦとεἰς τὰς ἐχομένας κωμοπόλειςの関係を明瞭にした。「そこでも」によりκαὶ ἐκεῖを宣教行為に正しく結び付けた。ἐξῆλθονの解釈上の幅は、本文と脚注の双方で維持した。
