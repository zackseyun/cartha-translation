  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: ja
  text: イエスは彼らに言った。「近くのほかの町々[a]へ行こう。そこでも宣べ伝えるためだ。わたしはそのために出て来たのだから[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「町々」に当たるギリシア語は、村と町の中間ほどの小規模な集落を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「そのために出て来た」は、イエスが今いた場所を出たことを指すとも、より広く、宣べ伝えるために出て来たという目的を指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: 行こう
  rationale: 一人称複数の勧奨的接続法であり、同行者への呼びかけを自然な現代日本語で表す。
- source_word: ἀλλαχοῦ
  choice: ほかの所へ
  rationale: 現在いる場所とは別の場所への移動を、簡明で自然に表す。
- source_word: τὰς ἐχομένας
  choice: 近くの
  rationale: 場所について「隣接する、近隣の」を意味する慣用的用法。現代日本語として分かりやすい表現を採用した。
- source_word: κωμοπόλεις
  choice: 町々
  rationale: 村と町の中間ほどの小規模な集落を指し得る語。本文では自然な「町々」とし、規模の含意は脚注で示す。
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: そこでも宣べ伝えるためだ
  rationale: ἵναの目的を明示し、καὶ ἐκεῖの「そこでも」を保持する。κηρύσσωは公に告げ知らせる行為として「宣べ伝える」とした。
- source_word: εἰς τοῦτο
  choice: そのために
  rationale: 直前の宣教という目的を受ける表現として自然であり、説明の力を保つ。
- source_word: ἐξῆλθον
  choice: 出て来た
  rationale: 字義的な移動表現を保ち、現在の場所から出たことか、より広い宣教のために出て来たことかを本文で限定しない。
- source_word: λέγει αὐτοῖς
  choice: 彼らに言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語文として自然な過去形にした。主語のイエスは文脈上の指示対象を明確にするため補った。
theological_decisions:
- issue: ἐξῆλθονの指す範囲
  choice: 「出て来た」と一般的に訳し、どこから出たのかを限定しない。
  alternative: 「この場所を出た」または「この使命のために世に来た」
  rationale: この句は、その場や祈っていた場所から出たことを指すとも、宣教のために出て来たというより広い目的を指すとも理解できる。特定の神学的解釈に狭めず、原文の含みを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、会話には簡潔で dignified な調子を保った。「宣べ伝える」は聖書文脈で定着した語だが、一般読者にも意味が通じる表現である。
