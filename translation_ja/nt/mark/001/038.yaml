    issue: 行き先に付された「も」と目的地の並列的な構文
    rationale: 本文の「ほかの所へ、近くの町々にも行こう」は、καὶ ἐκεῖが本来修飾する「そこで宣べ伝える」を、町々への移動にもかけるように響かせる。また「ほかの所」と「近くの町々」を別々の行き先として読みうる。
  - severity: low
    issue: 「すると」の補足
    rationale: καὶは通常の接続であり、「すると」は結果的・展開的なニュアンスを足しうるため、省略がより中立的である。
