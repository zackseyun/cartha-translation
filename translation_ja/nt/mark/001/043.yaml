  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: ja
  text: そして、イエスはその人を厳しく戒め[a]、すぐに彼を追い出した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「厳しく言いつけ」「叱りつけ」。このギリシア語には、強い憤りや厳しい叱責の意味合いもあり得る。
