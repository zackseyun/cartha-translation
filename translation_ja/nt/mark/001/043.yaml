    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: 厳しく戒めると
  rationale: この分詞には、強い感情を伴う厳しい言いつけ、警告、叱責という幅がある。次節の命令につながる文脈を踏まえ、指示の強さを自然な現代日本語で表しつつ、本人への非難と断定しない「厳しく戒める」を採用した。
- source_word: αὐτῷ
  choice: その人を
  rationale: 癒やされた人を指す与格代名詞。「戒める」の対象として自然な日本語にした。
- source_word: εὐθύς
  choice: すぐに
  rationale: マルコ福音書に特徴的な即時性と物語の速い展開を、明快な現代語で保持した。
- source_word: ἐξέβαλεν
  choice: 立ち去らせた
  rationale: ἐκβάλλω の強い「外へ出す、追い出す」という語感を完全に中和せず、同時にこの文脈で不自然に悪霊追放を連想させない表現とした。より強い訳語は脚注に示した。
- source_word: αὐτόν
  choice: （その人を）
  rationale: 同じ癒やされた人を指す対格代名詞。日本語では直前に対象を明示しているため、後半では省略して自然な文にした。
- source_word: καὶ
  choice: そして
  rationale: 物語を継続する単純な接続を保ち、現代日本語として自然にした。
theological_decisions:
- issue: 癒やされた人に対するイエスの態度の強さ
  choice: イエスがその人に厳しい言いつけを与え、強い調子で立ち去らせたことを表すが、その人への敵意や罪深い怒りとは断定しない。
  alternative: 感情的な含みを弱めて、単に固く命じて送り出したと訳す。または、その人自身を叱責して追い出したと訳す。
  rationale: ἐμβριμησάμενος と ἐξέβαλεν はともに強い語だが、その強さの性質には解釈の余地がある。本文と脚注で緊張を残し、神学的評価を付加しない。
translation_notes:
  register: 明快で品位ある現代標準日本語。二つの強いギリシア語の語感を本文と脚注で保持しながら、イエスの感情や動機を過度に確定しない。
