  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: ja
  text: そして、イエスはガリラヤ全域を巡り[a]、人々の会堂で宣べ伝え、悪霊を追い出された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして、イエスはガリラヤ全域に行き、人々の会堂で宣べ伝え、悪霊を追い出された」。ギリシア語の動詞は「来た」とも訳せるが、ここでは文脈上、地域を巡る移動を表すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: 巡り
  rationale: ἔρχομαιのアオリストは字義的には「来た／行った」だが、地域を示す句と二つの現在分詞を伴う文脈では、ガリラヤ各地を移動して回ったことを表す。「巡り」はその継続的・遍歴的な動きを自然な日本語で伝える。別訳の余地は脚注に残した。
- source_word: κηρύσσων
  choice: 宣べ伝え
  rationale: κηρύσσωは公に告げ知らせることを表す。会堂での活動という文脈に適し、単なる教説の説明よりも公的な宣言の性格を保つ表現とした。
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: 人々の会堂で
  rationale: εἰςは字義的には方向を示し得るが、ここでは活動の場所・範囲として自然に「で」とした。αὐτῶνは日本語で曖昧な「彼らの」とするより、ガリラヤ各地の人々を指す「人々の」として明示した。
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: ガリラヤ全域を
  rationale: 第二のεἰςとὅληνは、移動がガリラヤ地方全体に及んだことを示す。「全域を」により地域的な広がりを簡潔に保持した。
- source_word: τὰ δαιμόνια
  choice: 悪霊
  rationale: δαιμόνιαは人格的な霊的存在を指す語で、日本語聖書として直接的かつ一般読者にも明瞭な「悪霊」とした。ギリシア語の定冠詞は、一般的な活動を述べる日本語では個別化せず自然に表した。
- source_word: ἐκβάλλων
  choice: 追い出しておられた
  rationale: ἐκβάλλωはこの文脈で悪霊を強制的に退去させることを表す。「追い出す」は明瞭で自然であり、現在分詞が示す随伴的・反復的な活動を「しておられた」で表した。
theological_decisions:
- issue: τὰ δαιμόνιαが指す存在の性質
  choice: 人格的な霊的存在を指す「悪霊」と訳す
  alternative: 「鬼」「悪い霊」
  rationale: 本文はイエスが追い出す対象としてδαιμόνιαを描く。「悪霊」は原語に対応し、本文以上の体系的な悪霊論を付加せず、その人格的・霊的な性格を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、聖書本文としての品位を保った。「こうして」で直前の展開との接続を示し、イエスへの敬意は自然な敬語「おられた」で表した。
