  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: ja
  text: そして、怒りを覚えたイエスは[a]、手を伸ばしてその人に触れ、「わたしはそう望む。清くなれ」と言われた。
  philosophy: optimal-equivalence
