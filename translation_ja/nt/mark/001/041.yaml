lexical_decisions:
- source_word: ὀργισθεὶς
  choice: 怒りを覚えた
  rationale: SBLGNT本文のὀργισθείςをそのまま反映し、イエスが怒りを抱いたことを自然な現代日本語で表す。怒りの対象や理由は原文が明示しないため補わない。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 手を伸ばして
  rationale: 具体的な身体動作を保ちつつ、後続の接触へ自然につながる日本語とした。
- source_word: ἥψατο
  choice: その人に触れ
  rationale: この構文でのἅπτομαιの通常の意味「触れる」を採用し、病人への直接の身体的接触を明確にした。
- source_word: λέγει αὐτῷ
  choice: 「……」と言われた
  rationale: 歴史的現在を日本語の物語として自然な過去表現にし、主語であるイエスへの敬意を穏当な尊敬語で示した。
- source_word: Θέλω
  choice: わたしはそう願う
  rationale: 直前の願いに応じる意志・望みを表す。「そう」を用いて文脈上の内容を受けつつ、単なる未来表現にはしなかった。
- source_word: καθαρίσθητι
  choice: 清くなれ
  rationale: 病の癒やしと儀礼的な清めの双方を含み得るκαθαρίζωの幅を保つため、「治れ」ではなく「清くなれ」とした。
theological_decisions:
- issue: イエスの感情を表す分詞の異読
  choice: SBLGNT本文のὀργισθείςを「怒りを覚えた」と本文で訳す
  alternative: 「深くあわれみ」または「かわいそうに思い」
  rationale: 指定された原語本文を優先し、感情の対象を推測で補わない。イエスの姿をめぐる重要な本文差であるため、異読は脚注で明示する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。地の文ではイエスに穏当な尊敬語を用いた。命令は原文の簡潔さと力を保つため「清くなれ」とした。
