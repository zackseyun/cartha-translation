source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: ja
  text: イエスはその人に言われた。「気をつけて、だれにも何も話さないようにしなさい。ただ、行って自分を祭司に見せ、あなたの清めのためにモーセが命じたものを、彼らへの証しとして献げなさい。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らへの証し」は、祭司たち、またはほかの人々に示される証拠を意味し得る。「彼らに対する証し」、すなわち彼らを責める証しという、より厳しい意味に取る見方もある。
    reason: 「彼ら」の指示対象と「証し」の方向性について原文に残る複数の可能性を示すため。
lexical_decisions:
- source_word: Ὅρα
  choice: 気をつけて
  rationale: 直後の禁止を強く念押しする警告・勧告の命令形であり、単なる「見なさい」より文脈上の働きを自然に表す。
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: だれにも何も話さないようにしなさい
  rationale: 二重の否定語が示す包括的な禁止を、相手と内容の双方を明示して保った。
- source_word: ἀλλὰ
  choice: ただ
  rationale: してはならないことから、代わりにすべきことへ移る対照・訂正の働きを自然な日本語で示す。
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: 自分を祭司に見せ
  rationale: 再帰代名詞と動詞の直接的な意味を保ちつつ、律法に基づく祭司の確認という背景にも適合する。
- source_word: προσένεγκε
  choice: 献げなさい
  rationale: モーセが命じた清めの供え物という祭儀的文脈を示すため、一般的な「持って行く」ではなく「献げる」とした。
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: あなたの清めのために
  rationale: 清めに関係する祭儀的な目的を簡潔に表し、「清め」と「きよめ」の表記では現代標準語として読みやすい漢字表記を採用した。
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: モーセが命じたもの
  rationale: 中性複数の関係代名詞が指す規定・供え物を、日本語で不自然にならない集合的な「もの」で表した。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 彼らへの証しとするため
  rationale: 目的を示す εἰς と、証拠・証言の幅を持つ μαρτύριον を保ち、「彼ら」が祭司たちか、より広い人々か、また敵対的含意があるかを本文で限定しない。
theological_decisions:
- issue: 「彼らへの証し」の指示対象と意味合い
  choice: 指示対象を「彼ら」のまま保ち、供え物と祭司による確認が証しとなるという広い表現にした。
  alternative: 「祭司たちへの証拠」または「彼らに対する証し」
  rationale: 原文は「彼ら」が誰かを明示せず、「反対する証し」という敵対的意味も明記していないため、祭司たち、共同体、またはより広い関係者という可能性と、証拠的・対決的な含みの緊張を解消しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令の厳粛さと祭儀的文脈にふさわしい品位を保った。「言われた」はイエスの発話を自然に導入し、「祭司」「献げる」「証し」は聖書的背景を保ちつつ一般読者にも理解できる語を選んだ。脚注記号[a]は、それが説明する末尾の句の直後に置いた。
