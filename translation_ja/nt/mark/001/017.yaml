  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: ja
  text: イエスは彼らに言われた。「わたしについて来なさい。あなたがたを、人をとる漁師にしよう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: わたしについて来なさい
  rationale: 直訳的な「わたしの後ろに来なさい」が表す弟子として従う招きを、現代日本語で自然かつ簡潔に伝える。
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: あなたがたを…にしよう
  rationale: 「あなたがたが…になるようにする」という使役と将来の約束を、自然な日本語で保持する。
- source_word: ἁλιεῖς ἀνθρώπων
  choice: 人をとる漁師
  rationale: 漁の比喩を保ちつつ、ἀνθρώπωνを性別を限定しない総称的な「人」として訳す。日本語では伝統的で理解しやすい表現でもある。
theological_decisions:
- issue: 弟子への召命におけるイエスの働き
  choice: あなたがたを、人をとる漁師にしよう
  alternative: あなたがたは、人をとる漁師になるだろう
  rationale: ποιήσωの使役的意味を保ち、弟子たちをその務めに形作る主体がイエスであることを明示する。
- issue: ἀνθρώπωνの範囲
  choice: 人
  alternative: 男たち／人々
  rationale: ここでの複数属格は人間一般を指すため、性別を限定せず、比喩にも自然に結びつく「人」を採用する。
translation_notes:
  register: 明快で格調を保った現代標準日本語。命令は権威ある招きを示す「来なさい」とし、漁師への呼びかけに対応する漁の比喩をそのまま残した。
