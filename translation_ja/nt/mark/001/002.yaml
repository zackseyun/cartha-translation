id: MRK.1.2
reference: Mark 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: ja
  text: 預言者イザヤの書[a]にこう書かれているとおりである。「見よ、わたしはあなたに先立ってわたしの使者を遣わす。彼はあなたの道を整える。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本には「預言者イザヤの書に」ではなく「預言者たちの書に」とある。
    reason: textual_variant
  - marker: b
    text: この引用は、マラキ書3章1節とイザヤ書40章3節に関連する文言を組み合わせている。
    reason: cross_reference
lexical_decisions:
- source_word: Καθὼς
  choice: 〜とおりである
  rationale: 後に続く引用との対応を示す比較表現。日本語では引用句を受けて「こう書かれているとおりである」とするのが明瞭で自然。
- source_word: γέγραπται
  choice: 書かれている
  rationale: 完了受動形が表す、書かれて現在もその効力を保つ状態を、聖書引用の自然な日本語で表した。
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: 預言者イザヤの書に
  rationale: 日本語では人物そのものの中に書かれているとは言わないため、預言書を指すことを明示しつつ、イザヤを引用元として名指す本文を保持した。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す預言的で荘重な呼びかけを保つ、簡潔で定着した訳語。
- source_word: ἀποστέλλω
  choice: 遣わす
  rationale: 現在形を簡潔な非過去形で表し、預言的宣言の直接性を保った。「遣わす」は使者の派遣にふさわしい格調もある。
- source_word: τὸν ἄγγελόν μου
  choice: わたしの使者
  rationale: 文脈では先駆者を指し、ἄγγελος の基本義である知らせを携える者を表す。「天使」と限定しない。
- source_word: πρὸ προσώπου σου
  choice: あなたの前に
  rationale: 直訳は「あなたの顔の前に」だが、これは「あなたに先立って／あなたの前に」を意味する慣用句。「あなたの前に」は身体的な不自然さを避けながら位置的・先行的意味を保つ。
- source_word: κατασκευάσει
  choice: 整える
  rationale: 道を通れるように準備するという意味を、後続する「道」と自然に結び付く日本語で表した。
- source_word: τὴν ὁδόν σου
  choice: あなたの道
  rationale: 道という比喩的イメージと、その人のための道筋という意味の両方を保持した。
theological_decisions:
- issue: 引用はマラキ3:1とイザヤ40:3に関連する文言を組み合わせている一方、本文はイザヤだけを名指す。
  choice: 本文ではSBLGNTに従い「預言者イザヤの書に」を保持する。
  alternative: 「預言者たちの書に」
  rationale: 複合引用であることを理由に本文を調和させず、原文の緊張をそのまま残した。異読と引用背景は脚注で示す。
- issue: πρὸ προσώπου σου の身体語をどこまで明示するか。
  choice: あなたの前に
  alternative: あなたの顔の前に／あなたに先立って
  rationale: ギリシア語の慣用的意味を自然な現代日本語で伝えつつ、「前」という空間的イメージを保った。
translation_notes:
  register: 明瞭な現代標準語を基調とし、「見よ」「遣わす」によって聖書引用にふさわしい適度な荘重さを保った。πρὸ προσώπου σου は不自然な逐語訳を避けて「あなたの前に」とした。脚注記号は本文末尾に置き、引用全体の出典・本文上の問題に関係することを示した。
