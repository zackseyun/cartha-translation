  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: ja
  text: 夕方になり、日が沈むと、人々は病気の人や悪霊につかれた人を、皆イエスのもとに連れて来ていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悪霊につかれた人」は、「悪霊に支配されていた人」とも訳せる。
    reason: δαιμονιζομένουςは悪霊の力のもとにある状態を表すが、その具体的なあり方をこの語だけで細かく規定することはできないため。
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 夕方になり
  rationale: 属格独立構文による時間の移行を、簡潔で自然な現代日本語で表した。
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: 日が沈んだころ
  rationale: ὅτεの時間的意味を保ちつつ、直前の「夕方になり」と不自然に重ならない表現にした。日没後と断定する「日が沈んでから」よりも、原文の「その時」の幅を残している。
- source_word: ἔφερον
  choice: 次々と連れて来た
  rationale: 未完了過去が描く継続的・反復的な動きを、日本語では「次々と」によって自然に表した。目的語が人なので「連れて来た」とした。
- source_word: πρὸς αὐτὸν
  choice: イエスのもとに
  rationale: 原文は代名詞だが、日本語の「彼のもとに」は文脈上ぎこちないため、指示対象を明示した。πρόςの方向性は「もとに」で表した。
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: 病気の人を皆
  rationale: κακῶς ἔχεινは直訳すれば「具合が悪い」だが、ここでは病む人々を指す慣用表現である。πάνταςの包括性を「皆」で保持した。
- source_word: τοὺς δαιμονιζομένους
  choice: 悪霊につかれた人
  rationale: 悪霊の現実的な働きへの言及を弱めず、同時にその状態の仕組みを原文以上に細かく規定しない、一般に理解しやすい表現を選んだ。
theological_decisions:
- issue: δαιμονιζομένουςが示す悪霊との関係
  choice: 悪霊につかれた人
  alternative: 悪霊の支配下にあった人／悪霊に苦しめられていた人
  rationale: 本文が病気の人とは別に悪霊の働きを受ける人々を挙げている点を保持した。「苦しめられていた」だけでは語の強さを弱める可能性があり、「完全に所有された」のような説明は原文を越えるため避けた。
- issue: ἔφερονの未完了過去の描写性
  choice: 次々と連れて来た
  alternative: 連れて来ていた／連れて来た
  rationale: 一回限りの動作に平板化せず、人々が継続して運び込まれる場面を自然な日本語で示した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての落ち着きを保つ文体とした。「日が沈んだころ」は原文の時間表現の重なりを残し、「次々と」で未完了過去の場面進行を示した。
