source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: ja
  text: イエスは、さまざまな病気にかかっていた多くの人を癒やされ、多くの悪霊を追い出された。そして、悪霊たちが話すことをお許しにならなかった。彼らがイエスを知っていたからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼が何者であるかを知っていた」。ギリシア語は直訳すると「彼を知っていた」。
    reason: 「知っていた」の目的語は原文では単純な代名詞だが、文脈上、身元を見抜いていたという意味にも取れるため。
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: 癒やし
  rationale: 治療して健康を回復させることを表す。イエスの働きを述べる文脈で自然かつ定着した訳語である。
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: 病気にかかっていた多くの人
  rationale: κακῶς ἔχω は「具合が悪い、病気である」という慣用表現なので、逐語的にせず現代日本語で自然に表した。
- source_word: ποικίλαις νόσοις
  choice: さまざまな病気に
  rationale: ποικίλος が示す種類の多様さを「さまざまな」で、νόσος を「病気」で明瞭に表した。
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: 多くの悪霊を追い出された
  rationale: δαιμόνιον は新約聖書の文脈に即して一般に理解しやすい「悪霊」とし、ἐκβάλλω の強制的な排除を「追い出す」で表した。
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: 話すことをお許しにならなかった
  rationale: 未完了過去形が示す、その場で継続して許さなかった様子を自然な日本語で表した。「話す」は λαλεῖν の通常の意味に対応する。
- source_word: ὅτι
  choice: からである
  rationale: ここでは、悪霊に話すことを許さなかった理由を示す因果の接続と解した。
- source_word: ᾔδεισαν αὐτόν
  choice: 彼らがイエスを知っていた
  rationale: ギリシア語の目的語は単に αὐτόν（彼を）であり、何を知っていたかを明示的に補わず、簡潔さと含みを保った。日本語で指示対象を明確にするため「イエス」とした。
theological_decisions:
- issue: 悪霊たちの認識内容を、キリスト論的な告白として明示するか
  choice: 彼らがイエスを知っていた
  alternative: 彼が何者であるかを知っていた／彼がメシアまたは神の子であると知っていた
  rationale: 本文は「彼を知っていた」とだけ述べている。周辺箇所から具体的な称号を補わず、悪霊たちの認識の内容に残る神学的な含みを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。敬語はイエスの行為に限って用い、過度に古風な文体を避けた。
