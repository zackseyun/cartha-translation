id: MRK.1.13
reference: Mark 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: ja
  text: そして、イエスは四十日間、荒野にいて、サタンから誘惑を受けていた[a]。また、野獣とともにいて、天使たちがイエスに仕えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「サタンによって試されていた」。ギリシア語の動詞は「誘惑する」と「試す」のどちらも意味し得るが、ここではサタンが行為者として明記されているため、本文では「誘惑を受けていた」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: 荒野
  rationale: 人里離れた荒涼とした場所を表し、聖書における荒野の響きも保つ自然な訳。砂地の砂漠に限定しない。
- source_word: τεσσεράκοντα ἡμέρας
  choice: 四十日間
  rationale: 期間を示す対格を直接表現し、聖書的な象徴性は本文で説明せず暗示のまま残した。
- source_word: πειραζόμενος
  choice: 誘惑を受けていた
  rationale: πειράζωには「誘惑する」と「試す」の両義があるが、行為者がサタンであるため、本文では敵対的な働きを自然に示す「誘惑を受ける」を採用した。継続的な意味も「受けていた」で表した。
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: サタンから
  rationale: 行為者を示す表現。「サタン」は日本語で定着した固有名・称号であり、「から」によって誘惑の発信源を自然に示した。
- source_word: μετὰ τῶν θηρίων
  choice: 野獣とともに
  rationale: 飼い慣らされていない動物を指す語を、簡潔で格調を損なわない現代語で表した。μετάの「ともに」を保持した。
- source_word: οἱ ἄγγελοι
  choice: 天使たち
  rationale: 語自体は「使者」も意味し得るが、サタンと荒野での誘惑という文脈では天的存在を指すため、「天使」とした。複数形も明示した。
- source_word: διηκόνουν αὐτῷ
  choice: イエスに仕えていた
  rationale: διακονέωの奉仕する意味と未完了過去の継続性を、「仕えていた」で表した。日本語で指示対象が明確になるよう、代名詞ではなく名を補った。
- source_word: καὶ ... καὶ ... καὶ
  choice: そして……また……
  rationale: マルコ特有の並列的な語り口をできるだけ残しつつ、日本語として過度に単調にならない接続に整えた。
theological_decisions:
- issue: πειραζόμενοςの意味とサタンの関係
  choice: 誘惑を受けていた
  alternative: 試されていた
  rationale: この動詞には「誘惑される」と「試される」の両方の意味がある。サタンが行為者として明記されるため本文では「誘惑」を採用するが、出来事が試練でもあるという含みを排除しないよう、別訳を脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、荘重さを保ちながら古風な敬語表現は避けた。原文の継続的な動作と並列的な文体を反映し、固有名を補うことで単独の節としても指示対象が分かるようにした。
