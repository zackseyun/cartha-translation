source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: ja
  text: バプテスマを授けるヨハネ[a]が荒野に現れ、罪の赦しのための悔い改めのバプテスマを宣べ伝えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「バプテスマのヨハネ」。ギリシャ語は直訳すると「バプテスマを授けるヨハネ」。
    reason: 定冠詞付き分詞ὁ βαπτίζωνについて、定着した日本語の称号と、役割を明示する訳の両方を示すため。
lexical_decisions:
- source_word: ἐγένετο
  choice: 現れ
  rationale: マルコの物語で人物を場面に登場させる慣用的な働きを、自然な現代日本語で表した。「生じた」のような逐語訳は避けた。
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: バプテスマを授けるヨハネ
  rationale: 定冠詞付き分詞がヨハネを、その活動によって特徴づけていることを明示した。日本語で定着した称号「バプテスマのヨハネ」は脚注に示した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野に
  rationale: 人里離れた地域を指すとともに聖書的な響きを保ち、砂地の砂漠に限定しない訳語を選んだ。
- source_word: κηρύσσων
  choice: 宣べ伝えた
  rationale: 公に告げ知らせるκηρύσσωの布告的な力を保ちつつ、聖書本文として自然で理解しやすい表現とした。
- source_word: βάπτισμα μετανοίας
  choice: 悔い改めのバプテスマ
  rationale: 属格の結びつきを保ち、悔い改めによって特徴づけられるバプテスマとして訳した。「悔い改め」は単なる意見変更ではなく、生き方と心の向きを改める道徳的・霊的意味を伝える。
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: 罪の赦しのための
  rationale: εἰςが示す目的・結果の幅を「ための」で保ち、バプテスマが赦しに対して道具的か象徴的かを訳文で決めないようにした。ἁμαρτιῶνは日本語では自然な集合表現「罪」とした。
theological_decisions:
- issue: バプテスマ、悔い改め、罪の赦しの関係
  choice: 「罪の赦しのための悔い改めのバプテスマ」とし、三者の関係を原文に沿って簡潔に示した。
  alternative: 「罪が赦されるために悔い改めを表すバプテスマ」または「悔い改めによって罪の赦しをもたらすバプテスマ」
  rationale: 原文はこれらを密接に結びつけるが、バプテスマが赦しをもたらす手段なのか、象徴または宣言なのかを明示しない。後代の教理的論争を訳文で解決せず、その緊張を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「洗礼」ではなく「バプテスマ」を用い、原語の語彙的対応と日本語聖書での認知度を両立させた。「宣べ伝えた」はやや聖書的だが、一般読者にも意味が通じる範囲の表現である。
