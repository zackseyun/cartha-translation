  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: ja
  text: 人々は皆驚き、互いに話し合って言った。「これはいったい何だ。権威ある新しい教えだ！ この人は汚れた霊たちにさえ命じ、彼らはこの人に従う。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: 驚き
  rationale: 強い驚きに打たれた反応を表す。日本語では文脈上「驚き」が自然で、必要以上の強調も避けられる。
- source_word: ἅπαντες
  choice: 皆
  rationale: その場の人々全体に反応が及んだことを簡潔に示す。
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: 互いに論じ合って
  rationale: ὥστεの結果関係は前後の連続で自然に表し、συζητεῖνの相互的な議論・話し合いという意味を「互いに論じ合って」で示す。敵対的な口論とは限定しない。
- source_word: Τί ἐστιν τοῦτο;
  choice: これはいったい何だ
  rationale: 驚きを帯びた直接的な問いを保ち、「いったい」で場面の強さを自然に表す。
- source_word: διδαχὴ καινή
  choice: 新しい教え
  rationale: διδαχήを一般の読者に明瞭な「教え」とし、専門的に響きやすい「教義」は避ける。
- source_word: κατ’ ἐξουσίαν
  choice: 権威ある
  rationale: 権威を伴う教えという自然な日本語にしつつ、句の係り方に構文上の余地があることは脚注で保持する。
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: 汚れた霊たち
  rationale: ἀκάθαρτοςの宗教的・道徳的含意を保つ定着した表現。複数形も明示する。
- source_word: ἐπιτάσσει
  choice: 命じる
  rationale: 権威をもって指図する動作を簡潔かつ直接的に表す。
- source_word: ὑπακούουσιν αὐτῷ
  choice: 彼らは従う
  rationale: 命令に対する服従を明確に表す。複数の霊を受けて「彼ら」とする。
theological_decisions:
- issue: 「権威をもって／権威ある」（κατ’ ἐξουσίαν）の構文上の係り先
  choice: 「権威ある新しい教えではないか」とし、まず「新しい教え」と結び付けて読む。
  alternative: 「これは何だ。新しい教えだ。権威をもって汚れた霊たちにまで命じる」として、後続の命令により強く結び付ける。または問い全体を「これは何だ。この権威ある新しい教えは」とする。
  rationale: 語順上は「新しい教え」と結び付きやすい一方、句読法は原文に明示されず、後続の命令にも権威の主題が響く。本文を自然に整え、別の区切り方は脚注で明示して曖昧さを保存する。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「この方」は、群衆がイエスを指して語る場面にふさわしい敬意を帯びた自然な指示表現。会話の驚きは「いったい」と「ではないか」で表した。
