    rationale: 「これはいったい何だ。この権威ある新しい教えは。」は日本語として文が完結せず、英語監査記録の代替句読法も明瞭に示していない。
  revised_text: 人々は皆驚き、互いに話し合って言った。「これはいったい何だ。権威ある新しい教えだ！ この人は汚れた霊たちにさえ命じ、彼らはこの人に従う。」
