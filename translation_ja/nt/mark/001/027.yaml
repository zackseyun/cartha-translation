    issue: 「権威ある新しい教えではないか」
    rationale: διδαχὴ καινή κατ’ ἐξουσίανは文脈上、驚嘆・評価として述べられており、「ではないか」という確認を求める修辞疑問は原文にない語用論的要素を加える。
  - severity: medium
    issue: 「この方が汚れた霊たちに命じると、彼らは従う」
    rationale: 原文はἐπιτάσσειとὑπακούουσινをκαίで接続する。「〜と」は条件または反復的な時間関係を示しうるため、並列した現在の叙述として訳す方が近い。
  - severity: low
