  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: ja
  text: さらに少し進むと、イエスはゼベダイの子ヤコブと、その兄弟ヨハネを目にした。二人は舟の中で網を繕っていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「網を直していた」または「網を整えていた」とも訳せる。ギリシア語の動詞は、物を正しい状態に整えることや、傷んだ物を元どおりにすることを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: そこから少し進むと
  rationale: アオリスト分詞の時間的・状況的な働きを自然な日本語で表し、短い距離をさらに進んだことを示す。
- source_word: εἶδεν
  choice: 目にした
  rationale: 単純な知覚を表す。日本語の物語文として自然であり、原文にない強調を加えない。
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: ゼベダイの子ヤコブ
  rationale: 属格による親子関係の同定を、簡潔で明瞭な日本語にした。
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: その兄弟ヨハネ
  rationale: αὐτοῦは自然にはヤコブを指すため、その関係を保った。日本語の「兄弟」は年長・年少を特定しないので、原文にない情報を加えない。
- source_word: ἐν τῷ πλοίῳ
  choice: 舟の中で
  rationale: 定冠詞のある特定の舟を指す表現を保ち、漁の場面に適した「舟」を用いた。
- source_word: καταρτίζοντας
  choice: 繕っていた
  rationale: 網を適切な状態に整える、または傷みを直すという文脈上もっとも自然な意味を表す。ただし語には「整える」「準備する」まで含み得るため脚注で幅を示した。
- source_word: τὰ δίκτυα
  choice: 網
  rationale: 漁網を指す集合的な日本語として自然である。原文には所有代名詞がないため「自分たちの」は補わない。
- source_word: καὶ αὐτούς ... καταρτίζοντας
  choice: 二人は……繕っていた
  rationale: 知覚動詞の目的語と分詞からなる構文を、意味を保ったまま自然な日本語の独立文に組み替えた。
