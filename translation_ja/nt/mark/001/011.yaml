source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: ja
  text: そして、天から[a]声がした。「あなたはわたしの愛する子。わたしはあなたを喜んでいる。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は複数形で、「天々から」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「わたしはあなたを喜んだ」「わたしはあなたにあって喜んだ」、または「わたしはあなたに満足している」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: 声がした
  rationale: 出来事の発生を表す自然な現代日本語。直訳的な「声が生じた」より明瞭で、物語の展開を保つ。
- source_word: ἐκ τῶν οὐρανῶν
  choice: 天々から
  rationale: 原文の複数形を保持した。「天から」のほうが一般的だが、原語優先のため本文では複数性が分かる表現を採用する。
- source_word: Σὺ εἶ
  choice: あなたは
  rationale: 明示された二人称代名詞による直接的な呼びかけを自然に伝える。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: わたしの愛する子
  rationale: 子としての関係と深い愛情を簡潔かつ荘重に表す。「愛する」は現代日本語として自然であり、原文のキリスト論的な重みを弱めない。
- source_word: ἐν σοὶ
  choice: あなたを
  rationale: 日本語では「あなたにあって」より自然で、εὐδοκέωの対象を明確に示す。ただし、前置詞ἐνをより形式的に反映する訳は脚注に示す。
- source_word: εὐδόκησα
  choice: 喜んでいる
  rationale: アオリストの形を機械的な過去に限定せず、この宣言における神の喜びと承認の現在的な効力を自然な日本語で表す。完了的・過去的な理解の可能性は脚注に残す。
theological_decisions:
- issue: イエスへの神の宣言が持つ子としての身分と愛をどう表すか
  choice: わたしの愛する子
  alternative: わたしの子、愛する者
  rationale: 原文の「子」と「愛される者」の両要素を保ちつつ、後代の教理用語を加えず、自然な直接話法とした。
- issue: οὐρανῶνの複数形を日本語で保持するか
  choice: 天々から
  alternative: 天から
  rationale: やや非日常的ではあるが理解可能な「天々」により原文の複数形を可視化し、一般的な単数表現は脚注に示した。
- issue: εὐδόκησαの時制・相とἐν σοὶの関係をどう訳すか
  choice: わたしはあなたを喜んでいる
  alternative: わたしはあなたを喜びとした／わたしはあなたに満足している
  rationale: 神の継続的な喜びと承認を自然に伝える一方、アオリストを完了的・過去的に取る余地やἐνを「あなたにあって」とする余地を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、神の直接の宣言にふさわしい簡潔で荘重な調子を保った。「天々」は原文の複数形を意図的に残した表現である。脚注記号は対応箇所が分かるよう、「天々から」の直後に[a]、「喜んでいる」の直後に[b]を置くのが望ましい。
