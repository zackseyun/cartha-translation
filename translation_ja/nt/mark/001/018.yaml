  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: ja
  text: そして、彼らはすぐに[a]網を置いて、彼に従った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「直ちに」とも訳せる。
    reason: εὐθὺςの即時性を表す、より文語的な訳語の選択肢を示すため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: マルコの簡潔な物語の流れを保つ、自然な接続表現とした。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 行動の即時性を、現代の読者に分かりやすい自然な日本語で表した。
- source_word: ἀφέντες
  choice: 残し
  rationale: 主動詞に先立つ行為を表すアオリスト分詞。「捨てて」では放棄の意味を強めすぎるため、文脈に合う「残し」とした。
- source_word: τὰ δίκτυα
  choice: 網
  rationale: 定冠詞付きの複数形だが、日本語では漁具としての「網」が自然であり、所有を明示する「自分たちの」は補わなかった。
- source_word: ἠκολούθησαν
  choice: 従った
  rationale: 実際について行く意味と、弟子として従う含みの両方を保てる標準的な訳語とした。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 直前の文脈で指示対象がイエスであることは明らかだが、原文の代名詞を固有名に置き換えずに訳した。
theological_decisions:
- issue: ἠκολούθησανに含まれる弟子としての意味
  choice: 「彼に従った」と訳し、弟子となったという説明を加えない。
  alternative: 「彼の弟子となった」「彼について行った」
  rationale: 原語は実際の追随と弟子としての従属をともに含み得る。「従った」はその重なりを保ち、文脈から神学的意味が現れるようにする。
translation_notes:
  register: 明快で簡潔な現代標準日本語。マルコ特有の速い物語展開を保ちつつ、「捨てる」のような感情的に強い表現や、弟子化を説明的に補う言い換えを避けた。
