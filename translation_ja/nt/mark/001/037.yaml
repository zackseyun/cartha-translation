  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: ja
  text: そして彼らはイエスを見つけ、彼に言った。「みんながあなたを捜しています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたを求めています」。ギリシア語は「求める」「捜す」のどちらにも訳せるが、ここでは人々がイエスを見つけようとしている文脈である。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: マルコの語りをつなぐ基本的な接続の働きを、自然な現代日本語で表した。
- source_word: εὗρον αὐτόν
  choice: 一行はイエスを見つけると
  rationale: εὗρονは捜した末に見つけたという完了した出来事を表す。主語は直前の文脈にあるシモンとその仲間たちであり、日本語では「一行」と補うことで自然にした。αὐτόνは文脈上イエスを指すため、固有名で明確にした。
- source_word: λέγουσιν αὐτῷ
  choice: 彼に言った
  rationale: λέγουσινは歴史的現在だが、日本語の物語として自然な過去形にした。αὐτῷの相手を「彼に」で示した。
- source_word: ὅτι
  choice: 「…」
  rationale: ここでは発言内容を導くため、日本語では直接話法のかぎ括弧で自然に表した。
- source_word: Πάντες
  choice: みんなが
  rationale: 周囲の人々を集合的に指す語であり、文脈を越えた絶対的普遍性を不必要に強めない、自然な口語表現を選んだ。
- source_word: ζητοῦσίν σε
  choice: あなたを捜しています
  rationale: この場面では人々がイエスの居場所を突き止めようとしているため、物理的な探索を自然に表す「捜しています」を本文に採用した。ただし「求めています」という幅も注で残した。
