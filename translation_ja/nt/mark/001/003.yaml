  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: ja
  text: '荒野で叫ぶ者の声がする。


    「主[b]の道を整えよ。


    その方の道筋をまっすぐにせよ。」[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の句読法に従い、イザヤ書からの引用を「叫ぶ者の声がする。『荒野で主の道を整えよ……』」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 「主」はギリシア語キュリオスの訳。ここで引用されているイザヤ書40章3節のヘブライ語では、神の名YHWHを指す。
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: 声がする
  rationale: 「声」とし、日本語では引用を自然に導入するため「声がする」とした。
- source_word: βοῶντος
  choice: 叫ぶ者
  rationale: 属格分詞が「声」にかかる構造を保ち、力強く告げ知らせる響きを「叫ぶ」で表した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: マルコにおけるヨハネの活動場所とイザヤ引用の背景に合い、「砂漠」より広い意味を持つ「荒野」を採用した。
- source_word: Ἑτοιμάσατε
  choice: 整えよ
  rationale: 道を通行できるよう備えるという文脈に自然で、命令の直接性を保つ。
- source_word: τὴν ὁδὸν
  choice: 道
  rationale: 実際の道と比喩的な備えの双方を表せる語を用いた。
- source_word: κυρίου
  choice: 主の
  rationale: ギリシア語κύριοςを「主」と訳し、属格の形を「主の道」として保った。
- source_word: εὐθείας
  choice: まっすぐに
  rationale: ここでは道筋が曲がっていないことを表し、倫理的な「正しい」とはしなかった。
- source_word: ποιεῖτε
  choice: せよ
  rationale: 形容詞εὐθείαςと合わせて「まっすぐにせよ」とし、現在命令の継続的含意を過度に明示しなかった。
- source_word: τὰς τρίβους αὐτοῦ
  choice: その方の通る道
  rationale: τρίβοςの複数の道筋という像を日本語で自然に示し、αὐτοῦの指示対象への敬意も保った。
theological_decisions:
- issue: ヘブライ語ではYHWHを指すイザヤ引用中のκύριοςの訳
  choice: 主
  alternative: 主なる神／ヤハウェ
  rationale: 本文はギリシア語κύριοςに即して「主」とし、イザヤ40章3節のヘブライ語では神の固有名YHWHであることを脚注で示した。マルコ本文に別の表現を持ち込まず、引用の神学的背景も保持する。
- issue: 「荒野で」の係り先
  choice: 「叫ぶ者」に係る
  alternative: 「主の道を整えよ」に係る
  rationale: マルコのギリシア語の語順と直近の統語関係に従い、「荒野で叫ぶ者」とした。一方、イザヤ引用の句読法による別の区切り方は脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準語。命令形「整えよ」「せよ」は引用された預言の力強さを保ちつつ、古語に偏りすぎない。脚注記号は対応箇所にすべて掲げた。
