source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: ja
  text: 人々はその教えに驚いていた。というのも、イエスは律法学者たちのようにではなく、権威を持つ者として[a]彼らに教えていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「権威をもって」。
    reason: ὡς ἐξουσίαν ἔχων は、構造に即して「権威を持つ者として」とも、より慣用的に「権威をもって」とも訳せるため。
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: 驚いた
  rationale: 強い驚きを表す語。未完了過去の継続的な反応は、後半の「教えていた」と文脈によって示しつつ、日本語の物語文として自然にした。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: その教えに
  rationale: ここでの διδαχή は教えの内容や教え方を含み得るため、現代日本語で明瞭かつ意味を狭めすぎない「教え」とした。
- source_word: ἦν γὰρ διδάσκων
  choice: 教えていたからである
  rationale: ἦν と現在分詞による継続的な動作を「教えていた」で表し、γάρ の理由説明を「からである」で明示した。
- source_word: ὡς ἐξουσίαν ἔχων
  choice: 権威ある者として
  rationale: ὡς の比較構造と、ἐξουσία を持つ者として教えるという表現を保ちつつ、自然な日本語にした。「権威をもって」は脚注に示した。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 当時のユダヤ社会で律法の解釈と教授に携わった専門家を、現代の一般読者に明瞭な慣用訳で表した。単なる筆写者という誤解を避ける。
theological_decisions:
- issue: 律法学者たちと対照されるイエスの権威の性質
  choice: 「権威ある者として」と記述し、その権威の由来や本質は説明しない。
  alternative: 「神からの権威をもって」または「神の権威をもって」と解釈的に補う。
  rationale: 本文はイエスの教え方を律法学者たちと対照するが、この一文では権威の由来や神学的本質を明示していないため、その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。理由節では継続相を示し、比較の焦点がイエスの教え方にあることを自然な語順で表した。
