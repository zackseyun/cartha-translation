id: MRK.1.28
reference: Mark 1:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: ja
  text: そして、イエスについての知らせは、すぐにガリラヤ周辺の全域にくまなく広まった[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「知らせ」は、「話」または「評判」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ガリラヤ周辺の全地域へ、至る所に広まった」。
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 広まった
  rationale: 原義の「出て行った」が、ここでは知らせの伝播を表すため、現代日本語で自然な「広まった」とした。
- source_word: ἀκοὴ
  choice: 知らせ
  rationale: ここでは「聞かれる事柄」、すなわちイエスについて伝わる知らせを指す。「評判」よりも、名声という含みを加えずに出来事の伝聞を表せる。
- source_word: αὐτοῦ
  choice: イエスについての
  rationale: ἀκοήに伴う属格を、知らせの内容を示すものとして自然な日本語にした。文脈上の指示対象を明確にするため「イエス」とした。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコが繰り返し用いる即時性を、明瞭で自然な現代日本語で表した。
- source_word: πανταχοῦ
  choice: くまなく
  rationale: 「至る所に」という全面的な広がりを、後続する地域表現と滑らかにつなぐ副詞として訳した。
- source_word: περίχωρον
  choice: 周辺
  rationale: ある場所を取り巻く地域を指す語であり、農村部などに限定せず地理的な広がりを保つ。
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: ガリラヤ周辺の全域に
  rationale: εἰςが示す伝播の方向・到達と、ὅληνの包括性を自然な日本語で表した。「ガリラヤ周辺」は、ガリラヤに属する周辺地域とも、ガリラヤを取り巻く地域とも取り得る原文の関係を過度に限定しない。
theological_decisions:
- issue: ἀκοὴ αὐτοῦの意味
  choice: イエスについての知らせ
  alternative: イエスの評判
  rationale: 文脈はイエスについて聞かれたことが急速に伝わる様子を描く。「評判」も可能だが、名声や評価という意味を強めず、伝わる内容に焦点を置いた。
- issue: τῆς Γαλιλαίαςとπερίχωρονの関係
  choice: ガリラヤ周辺
  alternative: ガリラヤ地方の周辺地域
  rationale: 属格が示す地理的関係を簡潔に保ち、その地域がガリラヤ内部の周辺部なのか、ガリラヤを取り巻く地域なのかを訳文だけで断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「全域にくまなく」は、ὅληνとπανταχοῦの重なった強調を不自然な逐語調にせず保持する。
