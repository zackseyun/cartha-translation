revisions:
- from: ところが、その人は出て行くと、このことを大いに言い広め、その話を広く伝え始めた。そのため、イエスはもはや公然と町に入ることができず、町の外の人里離れた所にとどまっておられた。それでも、人々は方々からイエスのもとにやって来た。
  to: ところが、その人は出て行くと、このことを盛んに告げ知らせ、その話を広く伝え始めた。そのため、イエスはもはや公然と町に入ることができず、町の外の人里離れた所にとどまっておられた。そして、人々は方々からイエスのもとにやって来た。
  rationale: 原文の開始動詞が二つの不定詞を支配する構文を、日本語でも「告げ知らせ、その話を…伝え始めた」として保持した。「大いに言い広め」は後続のδιαφημίζεινと意味が重なりやすいため、κηρύσσεινの公的な告知の語感を「盛んに告げ知らせ」として区別した。末尾はκαίの広い接続機能を保つため、「それでも」を「そして」に改めた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:22:18Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として、癒やされた人が知らせを広めた結果、イエスが公然と町へ入れず、外の寂しい場所にいたという因果関係をよく保っている。ただし原文のἤρξατοはκηρύσσεινとδιαφημίζεινの両方にかかるため、現行の日本語では「言い広め」はすでに行われ、その後に「伝え始めた」ようにも読める。また、末尾のκαίは単純な接続であり、「それでも」は原文に明示されない譲歩を加える。
  naturalness: 現行文は明快で自然である。修正文では「始めた」の係り先を明確にし、最後を「そして」として、現代標準日本語の流れを保ちながら接続関係を過度に限定しない。
  terminology: 「公然と」「人里離れた所」「方々から」は原文のφανερῶς、ἐρήμοις τόποις、πάντοθενを自然に反映している。「イエス」の明示と「とどまっておられた」という叙述上の敬意も適切である。
  issues:
  - severity: medium
    issue: 「伝え始めた」の係り先
    rationale: ἤρξατοは「盛んに告げ知らせること」と「その知らせを広めること」の双方を導く。現行の「言い広め、その話を広く伝え始めた」は、日本語では開始が後者だけにかかるように読める。
  - severity: low
    issue: 「それでも」の追加的な譲歩
    rationale: καὶ ἤρχοντοは「そして／また、人々が来ていた」と事実を続ける表現である。「それでも」は文脈上あり得る含意を接続詞として明示するため、より中立な接続にする。
  revised_text: ところが、その人は出て行くと、このことを盛んに告げ知らせ、その話を広く伝え始めた。そのため、イエスはもはや公然と町に入ることができず、町の外の人里離れた所にとどまっておられた。そして、人々は方々からイエスのもとにやって来た。
  revised_footnotes: []
