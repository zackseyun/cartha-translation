id: MRK.1.45
reference: Mark 1:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: ja
  text: ところが、その人は出て行くと、このことを盛んに告げ知らせ、その話を広く伝え始めた。そのため、イエスはもはや公然と町に入ることができず、町の外の人里離れた所にとどまっておられた。そして、人々は方々からイエスのもとにやって来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: このことを大いに言い広め
  rationale: κηρύσσεινは公に告げ知らせる行為を表し、πολλάはここでは発言内容の「多くのこと」よりも、盛んに、広範に行う様子として自然に表した。直前の出来事を補って「このこと」とした。
- source_word: διαφημίζειν τὸν λόγον
  choice: その話を広く伝え
  rationale: διαφημίζωの「広く知らせる」と、λόγοςの文脈上の「話・知らせ」を区別しつつ、日本語で重複が不自然にならないようにした。
- source_word: φανερῶς
  choice: 公然と
  rationale: 人目につかずに入ることとの対比を保ち、「堂々と」などの評価的含意を避けた。
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: 町の外の人里離れた所に
  rationale: ἐρήμοιςは必ずしも砂漠ではなく、人の住まない寂しい場所を指す。直前のἔξωも明示した。
- source_word: πάντοθεν
  choice: 方々から
  rationale: 全方向・各地から来るという意味を、自然で簡潔な現代日本語で表した。
theological_decisions:
- issue: αὐτόνの指示対象
  choice: イエス
  alternative: 彼
  rationale: 直前の「その人」と混同しやすいため、文脈上の指示対象であるイエスを明示した。これは解釈の付加ではなく、日本語の指示関係を明確にするためである。
- issue: ἦνの表現
  choice: とどまっておられた
  alternative: いた
  rationale: 継続的に町外の場所に身を置いていた状況を表す。「おられた」は福音書本文にふさわしい自然な敬意を示すが、特定の教理的主張を加えない。
- issue: καίの談話上の機能
  choice: それでも
  alternative: そして
  rationale: イエスが人里離れた場所にいたにもかかわらず人々が来た、という文脈上の対照を自然に示した。原文のκαίが許容する談話的関係を明示している。
translation_notes:
  register: 明快な現代標準日本語を用い、物語としての品位を保った。「その人」で癒やされた人物を受け、「イエス」を明示して主語の混同を避けた。原文の因果関係と、町に入れず外にいたこと、それでも人々が集まったという展開を保持した。
