source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: ja
  text: ユダヤ地方全体の人々と、エルサレムの住民は皆、ヨハネのもとへ出て行っていた。そして、ヨルダン川で彼から洗礼を受けながら、自分たちの罪を告白していた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: 次々に出て行き
  rationale: 未完了過去の継続・反復的な動きを自然な現代日本語で表す。「出て行っていた」よりも、大勢が相次いで赴く場面を明瞭に伝える。
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: ユダヤ地方全体
  rationale: χώραを地理的な「地方」とし、πᾶσαの包括的な修辞を「全体」で保持する。個々人の例外なき全称と断定する表現にはしない。
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: エルサレムの住民は皆
  rationale: Ἱεροσολυμῖταιを自然な日本語で「エルサレムの住民」とし、πάντεςの集合的な強調を「皆」で表す。
- source_word: ἐβαπτίζοντο
  choice: 洗礼を受けていた
  rationale: 未完了過去の反復・継続と受動態を保持する。日本語のキリスト教用語として広く通用する「洗礼」を用い、方式を限定する語は加えない。
- source_word: ὑπ’ αὐτοῦ
  choice: 彼から
  rationale: 行為者を示す代名詞を保ち、文脈上の指示対象であるヨハネの名を本文に補わない。
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: ヨルダン川で
  rationale: ποταμόςを「川」と明示し、洗礼が行われた場所を自然な助詞「で」で示す。
- source_word: ἐξομολογούμενοι
  choice: 告白して
  rationale: 洗礼と同時に伴う行為を連用形で表し、罪を公に認め言い表す意味を簡潔に伝える。
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: 自分たちの罪を
  rationale: 主語と同一集団を指す所有を「自分たち」で明確にし、複数形は日本語として自然な集合名詞「罪」で表す。
theological_decisions:
- issue: ユダヤ地方とエルサレムについて用いられる「すべて」の範囲
  choice: 「全体」「皆」を訳出しつつ、物語上の集合的・修辞的な包括表現として読める形にする
  alternative: 「ユダヤとエルサレムから大勢の人々」と緩和して訳す
  rationale: 原文のπᾶσαとπάντεςによる強い包括表現を保持すべきである。一方、「地方全体」「住民は皆」という通常の日本語は、数学的に例外が一人もないとの解釈を不要に強制しない。
- issue: 洗礼の方式と神学的意味
  choice: 「洗礼を受けていた」とし、方式や後代の神学的意味を特定しない
  alternative: 「浸されていた」または「清めを受けていた」
  rationale: この節は行為を報告しているが、その方式や教派的な意義を明示してはいない。定着した訳語「洗礼」は、解釈を過度に付加せずに語義を伝える。
- issue: 分詞ἐξομολογούμενοιと洗礼の関係
  choice: 「罪を告白して、…洗礼を受けていた」と、告白が洗礼に伴う行為であることを示す
  alternative: 告白を洗礼の原因・条件として明示する
  rationale: 分詞は付随する行為を表すが、因果関係や制度的条件まで明記してはいないため、それを訳文で補わない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある叙述調。「バプテスマ」ではなく一般読者にも理解しやすい「洗礼」を採用した。原文の二つの未完了過去は、「次々に」と「受けていた」により、継続・反復する場面として表した。
