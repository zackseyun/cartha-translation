  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: ja
  text: イエスがガリラヤ湖のほとりを通って行かれる途中、シモンとその兄弟アンデレが湖に網を打っていたのをご覧になった。二人は漁師だったのである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ παράγων
  choice: 通っておられると
  rationale: 現在分詞が主動詞「ご覧になった」と同時進行の動作を表すため、「通っておられると」として継続性と自然な物語の流れを保った。文脈上の主語イエスを日本語で明示した。
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: ガリラヤ湖のほとりを
  rationale: παρά＋対格の沿って進む意味を「ほとりを」で表した。θάλασσαは原義上「海」だが、この地理的対象は湖であり、現代日本語で定着した「ガリラヤ湖」を採用した。
- source_word: εἶδεν
  choice: ご覧になった
  rationale: 単純に見ることを表す。福音書におけるイエスへの自然で節度ある敬語として尊敬表現を用い、特別な洞察や選びの含意は付加しなかった。
- source_word: Σίμωνα καὶ Ἀνδρέαν τὸν ἀδελφὸν Σίμωνος
  choice: シモンと、その兄弟アンデレ
  rationale: 同格表現によりアンデレをシモンの兄弟と特定している。兄・弟の別を原文は示さないため「兄弟」とし、その曖昧さを保持した。
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: 湖で網を投げている
  rationale: ἀμφιβάλλωは漁網を投げることを具体的に表すため「網」を補った。ἐνは形式上「中で／に」だが、日本語では漁の場を示す「湖で」が自然で、動作の進行は「投げている」で保持した。
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: 二人は漁師だったのである
  rationale: γάρの説明的な働きを「のである」で表し、直前の行動の背景を示した。主語は自然な日本語になるよう「二人」とした。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、福音書の叙述にふさわしい落ち着いた格調を保った。イエスの動作には過度でない尊敬語を用いた。原文が兄弟の年長・年少を特定しないため、「兄」「弟」ではなく「兄弟」とした。
