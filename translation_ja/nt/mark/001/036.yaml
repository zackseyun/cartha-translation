  yaml_path: translation/nt/mark/001/036.yaml
  text: And Simon and those with him pursued him,[a]
translation:
  language: ja
  text: シモンとその仲間たちは、イエスの後を追った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イエスを捜し回った」。原語の動詞は、熱心に後を追って捜し求めることを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν
  choice: 捜し回った
  rationale: この動詞には、後を追って熱心に捜すという強い含みがある。文脈上は敵対的な追跡ではないため、「追跡した」より自然でありながら、単なる「捜した」より原語の勢いを保つ「捜し回った」とした。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 代名詞は直前の文脈でイエスを指す。日本語では「彼を」より指示対象を明示するほうが自然で分かりやすい。
- source_word: Σίμων
  choice: シモン
  rationale: 人名は日本語聖書で一般的な音写に従った。
- source_word: οἱ μετ’ αὐτοῦ
  choice: その仲間たち
  rationale: 直訳は「彼とともにいた者たち」。ここではシモンと行動をともにしていた人々を自然に表しつつ、弟子など本文にない限定を加えない。
- source_word: καὶ
  choice: （独立した接続語なし）
  rationale: 物語をつなぐ接続詞だが、日本語では主語から始めるほうが自然である。前後の連続性は語順と文脈によって十分に伝わる。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準語を用い、簡潔なマルコの物語調を保った。「捜し回った」によって、原語が持つ積極的で切迫した探索のニュアンスを自然な日本語で表した。
