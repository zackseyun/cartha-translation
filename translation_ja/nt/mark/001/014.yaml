source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: ja
  text: ヨハネが引き渡された[a]後、イエスはガリラヤに来て、神の福音[b]を宣べ伝えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨハネが逮捕された後」。原文をより直訳すると「引き渡された後」であり、マルコ福音書で後にイエスの受難を語る際にも響く表現である。
    reason: lexical_alternative
  - marker: b
    text: 「福音」は「良い知らせ」の意。「神の」は、神から来る知らせ、神に属する知らせ、または神を中心とする知らせという意味を含み得る。
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: 引き渡された後
  rationale: μετά＋冠詞付き不定詞の時間的意味を「後」とし、παραδίδωμιは単なる「逮捕」より広い「引き渡す」で訳した。これにより、マルコ福音書における後の受難叙述との語彙的な響きも保たれる。
- source_word: Ἰωάννην
  choice: ヨハネ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ἦλθεν
  choice: 来て
  rationale: ἔρχομαιの基本的な移動の意味を自然な現代日本語で表した。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤに
  rationale: εἰςの方向性を、日本語で自然な到着先の助詞「に」によって表した。「ガリラヤへ」も可能だが、後続する宣教活動へのつながりには「に来て」が自然である。
- source_word: κηρύσσων
  choice: 宣べ伝えた
  rationale: κηρύσσωの公に告げ知らせる意味を、聖書語として定着しつつ理解可能な表現で示した。ギリシア語の現在分詞は、主動詞と並行する付帯的な活動として日本語の述語に展開した。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: εὐαγγέλιονの「良い知らせ」を意味する、日本語で定着した簡潔な語を採用した。一般読者の理解を補うため脚注に言い換えを示した。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格の幅を限定せず、「神から来る」「神に属する」「神を中心とする」などの可能性を保つ表現とした。
theological_decisions:
- issue: マルコ福音書で繰り返される受難語彙との関連における παραδοθῆναι の訳
  choice: 引き渡された
  alternative: 逮捕された
  rationale: 「逮捕された」は文脈上あり得るが、原語が直接述べる以上に司法的状況を特定する。「引き渡された」は敵対的な支配下への移送を示しつつ、後にイエスについて用いられる同じ動詞との物語的・神学的な響きを保つ。
- issue: τὸ εὐαγγέλιον τοῦ θεοῦ における属格の意味
  choice: 神の福音
  alternative: 神からの福音／神についての福音
  rationale: ギリシア語の属格は、起源・所有・内容または中心を一つに限定していない。「神の」とすることで、その真正な多義性を本文に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宣べ伝える」「福音」は定着した聖書語だが、一般読者にも意味が通じるよう「福音」を脚注で説明した。「引き渡された」はやや不自然さを残してでも原語の反復と受難への響きを保持している。
