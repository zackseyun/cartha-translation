  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: ja
  text: 彼らはカペナウムに入った[a]。安息日に、イエスはすぐに会堂で教えた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らはカペナウムに入る」。マルコは臨場感のある叙述で、過去の出来事に現在形をしばしば用いる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「教えていた」または「教え始めた」。ギリシア語の未完了過去は、動作の継続または開始を含意し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: 入った
  rationale: マルコが生き生きとした叙述で用いる歴史的現在。現代日本語の自然な物語文として過去形にしつつ、εἰςを伴う移動の意味を保った。
- source_word: Καφαρναούμ
  choice: カペナウム
  rationale: 日本語聖書で広く定着している地名表記を採用した。
- source_word: εὐθύς
  choice: すぐ
  rationale: 迅速さを明確に表し、マルコの叙述の勢いを自然な現代日本語で保つ。
- source_word: τοῖς σάββασιν
  choice: 安息日になると
  rationale: ギリシア語では複数形だが、ここでは一つの安息日を指す慣用的な時の表現と理解した。文脈上の時間的推移も自然に示す。
- source_word: ἐδίδασκεν
  choice: 教えた
  rationale: 未完了過去が表し得る継続または開始の含みを本文で一方に限定せず、自然な日本語の叙述とした。相の可能性は脚注で示した。
- source_word: συναγωγήν
  choice: 会堂
  rationale: このユダヤ教の文脈では一般的な集会ではなく地域のシナゴーグを指すため、日本語で定着した「会堂」とした。
- source_word: implicit subject of ἐδίδασκεν
  choice: イエス
  rationale: ギリシア語では動詞の三人称単数形に主語が含まれる。直前までの文脈上の主語を日本語で明示し、複数主語「彼ら」との混同を避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼ら」で原文の複数主語を保ち、後半では文脈上の単数主語「イエス」を明示した。未完了過去の相は本文で過度に限定せず、脚注で真正な曖昧さを保持した。
