source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: ja
  text: すると、皮膚病を患っている人[a]がイエスのもとに来て、イエスに懇願し、ひざまずいて言った。「あなたがお望みなら、あなたには私を清くする[c]ことがおできです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「皮膚病の人」。ここで用いられている語は、現代医学でいうハンセン病だけでなく、さまざまな皮膚疾患を指し得る。
    reason: lexical_alternative
  - marker: c
    text: 別訳「私を清める」。この語は、身体的な回復だけでなく、汚れからの清めをも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: 重い皮膚病を患う人
  rationale: 古代の λεπρός は、現代医学でいうハンセン病だけに限定できず、種々の深刻な皮膚疾患を指し得る。病名で人を呼ぶ表現を避けつつ、患っている状態を明確にした。
- source_word: παρακαλῶν
  choice: 懇願して
  rationale: この場面では、切実に願い求める行為を表す。「懇願して」は、強い願いを自然かつ簡潔に伝える。
- source_word: γονυπετῶν
  choice: ひざまずき
  rationale: ひざをつく姿勢を直接表す分詞であり、簡潔で自然な日本語とした。
- source_word: Ἐὰν θέλῃς
  choice: あなたがお望みなら
  rationale: 単なる未来ではなく、イエスの意志・意思を条件として問う表現である。敬意ある直接話法として自然に訳した。
- source_word: δύνασαί
  choice: ことがおできです
  rationale: 能力・力があることを明示する δύναμαι の意味を保ち、話者からイエスへの敬意も表した。
- source_word: καθαρίσαι
  choice: 私を清くする
  rationale: 通常の治癒動詞ではなく「清める」を意味する語であり、身体的回復と汚れからの清めの双方を含み得る表現を保った。
- source_word: ἔρχεται
  choice: 来て
  rationale: マルコの歴史的現在を、日本語の物語として不自然にならない連用表現で生かした。
theological_decisions:
- issue: 皮膚病に関する「清め」の性質
  choice: 私を清くする
  alternative: 私を治す／私を清める
  rationale: 本文は一般的な「治す」という動詞ではなく καθαρίζω を用いる。「清くする」とすることで、身体的回復と儀礼上の汚れからの回復が重なる可能性を、どちらか一方に限定せず残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、イエスへの直接の呼びかけには自然な敬意を持たせた。古代の病名を現代の特定疾患に狭めず、人物を病名だけで規定しない表現とした。
