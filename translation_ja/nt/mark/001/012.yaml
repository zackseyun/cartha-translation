  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: ja
  text: そしてすぐに、霊はイエスを荒野へ追いやった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「荒野へ押し出した」または「荒野へ送り出した」。ギリシア語の動詞は力強い語で、マルコは悪霊を「追い出す」場面でも同じ動詞をしばしば用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 単純な接続を保ち、マルコ特有の連続的な物語運びを自然な現代日本語で表す。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 出来事が間を置かず進む切迫感を、明瞭で自然な現代語として表す。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 直前の洗礼の記事で言及された神の霊を指す。原文どおり「聖」を補わず、文脈上の特定性を保つ。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 日本語では代名詞「彼を」より指示対象を明示するほうが自然であり、指示対象であるイエスを補う。
- source_word: ἐκβάλλει
  choice: 追いやった
  rationale: 単なる「導いた」「遣わした」より強い動きを示し、ἐκβάλλωの力強さを保つ。日本語の物語文としては歴史的現在を過去形で表す。
- source_word: εἰς τὴν ἔρημον
  choice: 荒野へ
  rationale: 人里離れた荒涼とした場所を表し、聖書文脈における試練の場という含意も過度に説明せず保持する。方向を示すεἰςは自然な助詞「へ」で表す。
theological_decisions:
- issue: 御霊がイエスに及ぼす働きの強さ
  choice: 「追いやった」とし、強い動作を保った。
  alternative: 「導いた」「遣わした」
  rationale: ἐκβάλλωは力強い語であり、ここで弱めると、荒野での試練が神の霊の主導によって始まるという本文の緊張が薄れる。他福音書の表現に合わせず、マルコの語法を保持する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「御霊」は神の霊を示す聖書語として用いるが、「聖霊」と明示して原文以上に限定することは避けた。「追いやった」は強制性を消さず、現代の一般読者にも理解できる表現。
