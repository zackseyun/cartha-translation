  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: ja
  text: イエスはその霊を厳しく戒めて言った。「黙れ[a]。この人から出て行け！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「口輪をかけられよ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: 厳しく戒めて
  rationale: 権威をもって鋭く叱責する意味を表す。「戒めた」だけより語気を明確にしつつ、単なる命令とはせず原語の叱責のニュアンスを保った。
- source_word: αὐτῷ
  choice: その霊を
  rationale: 直前の文脈と「この人から出て行け」という命令から、指示対象は汚れた霊である。日本語では代名詞より名詞を補うほうが自然で、霊と苦しめられている人との区別も明確になる。
- source_word: λέγων
  choice: 言った
  rationale: 叱責の内容を導く分詞を、自然な現代日本語の連用表現「戒めて言った」で表した。
- source_word: Φιμώθητι
  choice: 黙れ
  rationale: 文字どおりには口輪をはめて沈黙させる表現だが、ここでは強い沈黙命令。「黙れ」は簡潔で鋭い命令形を自然に伝える。比喩的な直訳は脚注に残した。
- source_word: ἔξελθε
  choice: 出て行け
  rationale: 悪霊追放の文脈で、内部から外へ出るよう命じる動きを自然な日本語で表す。
- source_word: ἐξ αὐτοῦ
  choice: この人から
  rationale: ἐξ は内部から外への離脱を示す。「彼から」では指示対象が紛らわしいため、イエスが霊に対して、その宿る人から出るよう命じていることを自然に明示した。
theological_decisions:
- issue: イエスが戒めた相手
  choice: 汚れた霊を直接戒めた
  alternative: 文法上の直近の対象を、汚れた霊につかれた人と取る
  rationale: 直前の文脈は汚れた霊を発話主体として示し、続く「この人から出て行け」によって、話しかけられている相手が霊であることが明らかになる。人と霊を区別する一方、それ以上の教理的説明は加えない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。命令は原文の短さと強さを保つため「黙れ」「出て行け」とした。「そこで」は καί の文脈上の継起を自然に示す。
