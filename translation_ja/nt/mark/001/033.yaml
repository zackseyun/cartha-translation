  text: And the whole city was gathered at the door[a].
translation:
  language: ja
  text: 町中の人が戸口に集まっていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「戸口の方へ」。ギリシア語の前置詞は方向を表すこともできますが、ここでは人々が家の入口に集まっている状態を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ... ἐπισυνηγμένη
  choice: 集まっていた
  rationale: 未完了過去のἦνと完了受動分詞の組み合わせは、その時点で人々が集まった状態にあった情景を描く。「集まっていた」はこの継続的な状態を自然な現代日本語で表す。
- source_word: ὅλη ἡ πόλις
  choice: 町中の人
  rationale: 直訳は「町全体」だが、実際に集まるのは住民であるため、日本語では「町中の人」が自然である。誇張を含みうる原文の生き生きした総称表現も保っている。
- source_word: πρὸς τὴν θύραν
  choice: 戸口に
  rationale: πρός＋対格は方向または位置関係を表しうる。ここでは集まった状態が描かれているため、「戸口に」が自然であり、家の入口のところという文脈にも合う。
- source_word: θύραν
  choice: 戸口
  rationale: θύραは「戸」「扉」「入口」を意味する。この場面では扉そのものより家の入口付近を指すため、「戸口」が簡潔で自然である。
theological_decisions: []
