id: MRK.1.10
reference: Mark 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: ja
  text: そしてすぐに、水から上がって来ると、イエスは、天が引き裂かれ[a]、霊が鳩のようにイエスの上に[b]降って来るのを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天が二つに裂け」。この動詞は、単に「開く」よりも強い表現である。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスの中に」。ギリシア語のεἰςには「中へ」という意味もあるが、ここでは霊が降るという表現に合う「上に」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコ特有の切迫した物語の運びを、自然な現代日本語で表す。
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: 水から上がって来ると
  rationale: 現在分詞が主動詞と同時進行であることを示し、ἐκの起点・離脱の意味も自然に表す。
- source_word: εἶδεν
  choice: 見た
  rationale: 知覚を表す単純なアオリストを、簡潔にそのまま訳す。
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: 天が引き裂かれ
  rationale: σχίζωの強い、劇的な像を保ち、単なる「開く」より強い表現にする。日本語では「天」が集合的・聖書的な表現として自然である。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: 文脈上は神の霊を指すが、原文が明示的に「聖霊」としていないため、過剰な補足を避ける。
- source_word: ὡς περιστερὰν
  choice: 鳩のように
  rationale: 姿・動きなど比較のどの点を指すかを限定せず、ὡςの曖昧さを保つ。
- source_word: καταβαῖνον
  choice: 降って来る
  rationale: 自然な現代日本語で下降の動きを明確に表す。
- source_word: εἰς αὐτόν
  choice: ご自分の上に
  rationale: εἰςには「中へ」の可能性もあるが、霊が降るという文脈では「上に」が自然な慣用的理解である。「ご自分」は見た主体であるイエスを明確に指す。
theological_decisions:
- issue: 「霊」が何を指すか
  choice: 神の霊を指すものとして「霊」と訳す
  alternative: 「聖霊」または「神の霊」
  rationale: 洗礼の文脈では神の霊であることは明らかだが、ギリシア語本文はτὸ πνεῦμαであり、「聖」や「神の」を明示していないため、原文の表現を保つ。
- issue: 鳩との比較の意味
  choice: 「鳩のように」とし、比較の具体的な点を特定しない
  alternative: 「鳩の姿を取って」または「鳩のような動きで」
  rationale: ὡς περιστερὰνは比較を示すものの、姿、動き、その他のどれを指すかは明示しないため、その余地を残す。
- issue: εἰς αὐτόνの方向性
  choice: 「ご自分の上に」
  alternative: 「ご自分の中に」
  rationale: εἰςの語義上「中に」も可能だが、霊の下降を述べるこの構文では「上に」が最も自然である。ただし語義上の別の可能性は脚注に残す。
translation_notes:
  register: 明快で自然な現代標準日本語を用いつつ、「天」「霊」によって本文の品位と聖書的響きを保った。「引き裂かれ」は原文の力強い像を維持し、「鳩のように」は解釈を限定しない。
