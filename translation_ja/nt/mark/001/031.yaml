id: MRK.1.31
reference: Mark 1:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: ja
  text: イエスはそばに行き、彼女の手を取って起こした。すると熱が引き、彼女は一同をもてなした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一同をもてなし始めた」。ギリシア語の未完了過去は、彼女がもてなしていたことを描写するとも、癒やされた直後にもてなし始めたことを示すとも取れる。
    reason: 時制・相に基づく訳語の選択肢
lexical_decisions:
- source_word: προσελθὼν
  choice: そばに行き
  rationale: アオリスト分詞が、主動詞に先立ってイエスが彼女に近づいたことを表す。日本語では動作の順序を自然に示す。
- source_word: ἤγειρεν αὐτὴν
  choice: 彼女を起こした
  rationale: ἐγείρω の「起こす、立ち上がらせる」という力を保ちつつ、この場面では寝床から起こす行為として自然に表した。
- source_word: κρατήσας τῆς χειρός
  choice: 彼女の手を取って
  rationale: κρατέω は「しっかりつかむ、取る」の意。属格の「手」は、この文脈では日本語の「手を取る」が自然である。
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: 熱が引き
  rationale: 直訳的には「熱が彼女を離れた」。日本語では病状の消失を「熱が引く」と表すのが明瞭で自然である。
- source_word: διηκόνει αὐτοῖς
  choice: 一同をもてなした
  rationale: διακονέω はここでは食事などの世話をすることを指すと考えられ、「仕える」より家庭の場面に自然な「もてなす」とした。αὐτοῖς の複数も「一同」で明示した。
theological_decisions:
- issue: ἐγείρω が復活を表す語とも重なる可能性
  choice: 起こした
  alternative: 助け起こした
  rationale: この場面の直接的な意味は病床から起こすことだが、弱めた言い換えを避け、マルコが用いた動詞の力を保った。復活への明示的な意味づけは加えていない。
- issue: διηκόνει の未完了過去の相
  choice: もてなした
  alternative: もてなし始めた
  rationale: 未完了過去は継続する奉仕を描写し得るが、癒やしの直後に始まったことを示す起動的な読みも文脈上可能である。本文では明示されていない「始めた」を加えず、別訳を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、簡潔ながら品位のある叙述とした。「もてなす」は家庭内の具体的な奉仕を自然に伝え、教会用語的な響きを避ける。
