  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: ja
  text: ヨハネの弟子たちはそのことを聞くと、やって来て彼の遺体を引き取り、墓に納めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: そのことを聞くと
  rationale: アオリスト分詞の時間的な働きを自然な現代日本語で表し、知らせを聞いた後に行動したという順序を保った。目的語は原文では明示されないため、「そのこと」は直前の出来事を受ける最小限の補足である。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ヨハネの弟子たち
  rationale: 直前まで処刑を語られている洗礼者ヨハネが代名詞の指示対象である。日本語では単に「彼の弟子たち」とすると指示が曖昧になりやすいため、文脈上の対象を明示した。
- source_word: ἦλθον
  choice: やって来て
  rationale: 場面に到着したことを表すἔρχομαιを、物語として自然な日本語にした。
- source_word: ἦραν
  choice: 引き取り
  rationale: αἴρωには持ち上げる、取り去るという幅がある。埋葬のために遺体を受け取って運んだ行為を、日本語で簡潔かつ自然に表した。
- source_word: τὸ πτῶμα αὐτοῦ
  choice: 彼の遺体
  rationale: πτῶμαは死体を明確に指す。「遺体」は意味を損なわず、埋葬の文脈にふさわしい現代日本語の敬意と品位を備える。
- source_word: ἔθηκαν
  choice: 納めた
  rationale: τίθημιは置くという意味だが、墓への埋葬を表す日本語として「墓に納めた」が自然で品位がある。
- source_word: ἐν μνημείῳ
  choice: 墓に
  rationale: μνημεῖονはここでは遺体を安置する埋葬所を指す。日本語の「墓」はその意味を簡潔に伝える。
theological_decisions:
- issue: 「彼の弟子たち」の指示対象
  choice: 洗礼者ヨハネの弟子たち
  alternative: イエスの弟子たち
  rationale: 直近の物語はヨハネの処刑について述べており、弟子たちはヨハネの遺体を引き取って埋葬する。指示対象は文脈上ヨハネである。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔な物語調と埋葬場面にふさわしい品位を保った。「遺体」「納めた」により、πτῶμαの死体という意味と葬送の文脈を自然に表現した。
