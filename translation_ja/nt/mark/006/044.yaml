  text: καὶ ἦσαν οἱ φαγόντες ⸂τοὺς ἄρτους⸃ πεντακισχίλιοι ἄνδρες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: ja
  text: パンを食べた男たちは五千人だった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「男たち」で、一般的な「人々」を表す語ではなく、成人男性を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: であった
  rationale: 未完了過去形の連結動詞で、食べた者たちの総数を述べている。日本語では文脈上「であった」が簡潔で自然であり、「数えられた」のような原文にない意味を加えない。
- source_word: οἱ φαγόντες
  choice: 食べた人たち
  rationale: 冠詞付きアオリスト分詞が、食べるという行為をした集団を指す。「食べた人たち」は完了した行為を自然に表し、過去完了の意味を過度に持ち込まない。
- source_word: τοὺς ἄρτους
  choice: パン
  rationale: ἄρτος の複数形は個々の「パン」を指し得るが、日本語の「パン」は通常、単複を形で区別せず、この給食物語に出る具体的なパンを自然に指す。「パンの塊」などとすると不自然である。
- source_word: πεντακισχίλιοι
  choice: 五千人
  rationale: 基数をそのまま明確に表した。日本語では人数を示す助数詞「人」を添えるのが自然である。
- source_word: ἄνδρες
  choice: 男
  rationale: ἀνήρ は一般的な「人々」ではなく、成人男性を指す性別限定的な語である。「男が五千人」として、その限定を本文に保持した。
theological_decisions:
- issue: 人数に用いられた性別限定語
  choice: ἄνδρες を本文で「男」と訳す。
  alternative: 「人」または「人々」
  rationale: 原文は一般的な人を表す語ではなく、男性を特定する ἀνήρ を用いている。五千人が群衆全体の総数だったと決めつけず、数えられた対象の性別上の限定を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「パンを食べた人たちは」で原文の語順と焦点をおおむね保ちつつ、「男が五千人であった」と自然な日本語で人数を示した。「パン」は日本語では単複を明示しないため、英語版の bread/loaves の別を注記せずとも原文の指示内容を過不足なく表せる。
