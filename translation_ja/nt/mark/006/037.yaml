source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: ja
  text: しかし、イエスは彼らに答えて言った。「あなたがた自身で、人々に食べる物を与えなさい。」すると彼らはイエスに言った。「私たちが出かけて行って、二百デナリオンでパン[a]を買い、人々に食べさせるのですか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二百デナリオンでパン数個を買い」。ギリシア語の「アルトス」は、食物としての「パン」を指すことも、個々のパンを指すこともできる。
    reason: lexical_alternative
  - marker: b
    text: 一デナリオンは、労働者や兵士の一日分の賃金に相当する標準的な額だった。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えて言った
  rationale: 応答を表す分詞と発言動詞の組み合わせを保ちつつ、日本語の聖書物語として自然で明瞭な表現にした。
- source_word: Δότε
  choice: 与えなさい
  rationale: δίδωμι の直接的な命令を保ち、「用意しなさい」などの説明的な訳を避けた。
- source_word: ὑμεῖς
  choice: あなたがた自身で
  rationale: 明示された代名詞の強調を日本語で示し、群衆に食べ物を与える主体が弟子たちであることを伝えた。
- source_word: φαγεῖν
  choice: 食べる物
  rationale: 「与える」に続く目的を、直訳調になりすぎない現代日本語で表した。
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: 私たちが出かけて行って、…買い…のですか
  rationale: 分詞を主動詞に従属する連続動作として訳し、接続法の熟慮・反問的な問いを自然な疑問表現で示した。
- source_word: δηναρίων διακοσίων
  choice: 二百デナリオン分
  rationale: 属格が示す価格を「分」で明確にし、貨幣名は原語に即して音写した。
- source_word: ἄρτους
  choice: パン
  rationale: 集合的にも個々のパンにも用いられる語なので、本文では自然な「パン」とし、個数を意識した別訳を脚注に残した。
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: それを彼らに与えて食べさせる
  rationale: イエスの命令にある「与える」との語の反復を残しながら、目的を自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準語。弟子たちの問いに含まれる驚きや反問の響きは断定的に解消せず、「…のですか」で保持した。脚注記号は、それぞれ説明対象である「パン」と文末の貨幣額を含む問いに付した。
