revisions:
- from: しかし、イエスは彼らに答えて言った。「あなたがた自身で、あの人たちに食べる物を与えなさい。」すると彼らはイエスに言った。「私たちが出かけて行って、二百デナリオン分のパン[a]を買い、それを彼らに与えて食べさせるのですか。」[b]
  to: しかし、イエスは彼らに答えて言った。「あなたがた自身で、人々に食べる物を与えなさい。」すると彼らはイエスに言った。「私たちが出かけて行って、二百デナリオンでパン[a]を買い、人々に食べさせるのですか。」[b]
  rationale: 原文にない「あの」を除き、群衆を「人々」として明示した。後半は「与える」と「食べる」の関係を日本語として自然に「人々に食べさせる」と表し、弟子たちの質問としての響きを保った。脚注aは現代日本語として自然な語彙的可能性の説明に改めた。
