  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: ja
  text: しかし、ほかの人々は「エリヤだ」と言っていた。また、ほかの人々は「預言者たちの一人のような預言者だ」[a]と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（可能性は低い）「預言者たちの一人のような『その預言者』だ」。ギリシア語では「預言者」に冠詞がなく、続いて「預言者たちの一人のような」とあるため、ここでは一般的な意味の「預言者」と読むほうが自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: しかし、ほかの人々は／またほかの人々は
  rationale: ἄλλοιは別の人々の見方を示し、δέは穏やかな対比と話の継続を表す。最初は「しかし」、次は「また」として、意見が並列される流れを自然な日本語で示した。
- source_word: ἔλεγον
  choice: 言い／言っていた
  rationale: 未完了過去形は、そのような発言が当時続いていた、または繰り返されていたことを示す。日本語では文末の「言っていた」にその継続性を担わせた。
- source_word: ὅτι Ἠλίας ἐστίν
  choice: 「エリヤだ」
  rationale: ὅτι以下を直接話法で自然に訳した。Ἠλίαςは日本語聖書で一般的な固有名「エリヤ」とした。
- source_word: προφήτης
  choice: 預言者
  rationale: 無冠詞であり、後続の「預言者たちの一人のような」が一般的な預言者としての理解を支える。日本語では不定冠詞がないため、限定的な称号と誤解されにくい語順と注で示した。
- source_word: ὡς εἷς τῶν προφητῶν
  choice: 昔の預言者たちの一人のような
  rationale: ὡςの比較とεἷς τῶν προφητῶνの「預言者たちの一人」を保った。「昔の」は、文脈上、過去の預言者たちとの比較であることを現代日本語で明瞭にする補足である。
theological_decisions:
- issue: προφήτηςを一般的な「預言者」と取るか、終末論的称号「その預言者」と取るか
  choice: 一般的な「預言者」
  alternative: 特定の「その預言者」
  rationale: ギリシア語に冠詞がなく、直後に「預言者たちの一人のような」と続くため、一般的な預言者としての同定がより自然である。ただし、特定の終末論的人物を指す可能性を完全には排除せず、脚注に示した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語とした。群衆の複数の見方を示す対比と、未完了過去形の継続的な発言を保った。脚注記号[a]は、議論の対象である「預言者だ」の直後に置いた。
