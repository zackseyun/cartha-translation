source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: ja
  text: さて、使徒たちはイエスのもとに集まり、自分たちが行ったことも教えたことも、すべてイエスに報告した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: 集まり
  rationale: 物語中の歴史的現在として理解し、日本語では自然な過去の叙述にした。複数の者が一か所に集う意味を保っている。
- source_word: οἱ ἀπόστολοι
  choice: 使徒たち
  rationale: 派遣されて戻って来た十二人の役割を示す定着した呼称であり、単なる一般的な「使者たち」より文脈に適している。
- source_word: πρὸς τὸν Ἰησοῦν
  choice: イエスのもとに
  rationale: 対格を伴う πρός が示す、イエスのところへ向かって集まる動きを自然な日本語で表した。
- source_word: ἀπήγγειλαν αὐτῷ
  choice: イエスに報告した
  rationale: 派遣先から戻った者たちが活動内容を伝える場面なので、「告げた」より「報告した」が文脈上明確である。代名詞は指示対象を明瞭にするため「イエス」とした。
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: 自分たちが行ったことも教えたことも、すべて
  rationale: 二つの ὅσα 節の並行関係と πάντα の包括性を、「ことも……ことも、すべて」という自然な形で保持した。
theological_decisions:
- issue: 弟子たちを ἀπόστολοι と呼ぶ物語上の位置づけ
  choice: 役割を示す呼称として「使徒たち」
  alternative: 使者たち／遣わされた者たち
  rationale: 直前に派遣され、今戻った一団を指す文脈で、マルコが用いる役割上の呼称を訳文でも保持する。後代の制度的含意を本文に付加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた語調を保った。「さて」で場面の再開を示し、原文の二つの報告内容を並行的に表現した。
