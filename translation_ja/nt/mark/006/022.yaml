  to: ヘロディアの娘[a]が入って来て踊り、ヘロデと食卓を共にしていた人々[b]を喜ばせた。王はその少女に言った。「望むものは何でも、わたしに求めなさい。そうすれば、それをあなたに与えよう。」
  rationale: 原文の分詞 ἀρεσάσης を「喜ばせた」と訳し、踊った娘がヘロデと宴席の同席者を喜ばせたという統語関係を明示した。βασιλεύς の「王」、κοράσιον の「少女」、および自由な要求と将来の約束という発話内容は維持した。異読脚注を本文批評的に正確な表現へ整え、食卓の同席者に対応する文化注を適切なアンカーに付した。
