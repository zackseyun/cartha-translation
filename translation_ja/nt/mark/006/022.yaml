  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: ja
  text: ヘロディアの娘[a]が入って来て踊り、ヘロデと食卓を共にしていた人々[b]を喜ばせた。王はその少女に言った。「望むものは何でも、わたしに求めなさい。そうすれば、それをあなたに与えよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本伝承には、「彼の娘ヘロディア」と読むものもある。ここでは「ヘロディアの娘」と読むギリシア語本文に従った。
    reason: textual_variant
  - marker: b
    text: 直訳すると「彼と共に食卓で横になっていた人々」。古代の宴会では、食事客が横になって食卓を囲む習慣があった。
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: 入って来て
  rationale: 属格絶対構文の時間的な流れを、宴席の場へ入って来る動きが自然に伝わる現代日本語で表した。
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: ヘロディアの娘
  rationale: 採用本文の属格構文を、ヘロディアを母とする娘という最も自然な理解で簡潔に訳した。異読に関わる曖昧さは脚注に示した。
- source_word: ὀρχησαμένης
  choice: 踊ると
  rationale: アオリスト分詞を後続の反応へつながる自然な時間表現とし、動作自体には余分な含意を加えなかった。
- source_word: ἀρεσάσης
  choice: 喜んだ
  rationale: ἀρέσκωの「喜ばせる、気に入る」の意味を、日本語で主語と反応が明確になるように表した。「魅了した」などの強い含意は避けた。
- source_word: τοῖς συνανακειμένοις
  choice: 共に食卓に着いていた人々
  rationale: 古代の宴席で共に横になって食事をしていた客を指すが、日本語では姿勢を過度に前景化せず、同席して食事をしていたことを明瞭にした。
- source_word: εἶπεν ὁ βασιλεὺς
  choice: 王はその少女に言った
  rationale: マルコ本文の βασιλεύς を歴史上の正式称号に置き換えず、「王」と訳した。
- source_word: τῷ κορασίῳ
  choice: その少女に
  rationale: κοράσιονを、古風な「乙女」ではなく、年若い女性を表す自然で品位ある「少女」とした。
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: 欲しいものは何でも私に願いなさい
  rationale: 無限定の願いを許す表現を保ちつつ、命令形を威圧的にしすぎない自然な日本語にした。
- source_word: καὶ δώσω σοι
  choice: そうすれば、与えよう
  rationale: 先行する願いの内容を目的語として自然に補い、王の約束を簡潔に表した。
theological_decisions:
- issue: ヘロデ・アンティパスに対する βασιλεύς の訳語
  choice: 王
  alternative: 領主／四分領主
  rationale: 史的により厳密な外部称号で本文を修正せず、マルコの物語上の呼称をそのまま保持した。
- issue: 娘の帰属を示す本文異読
  choice: ヘロディアの娘
  alternative: 彼の娘ヘロディア
  rationale: SBLGNTの採用本文は「ヘロディア自身の娘」という読みを支持する。別の写本・伝承に関わる読みは本文へ混入させず、脚注で知らせた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、語りには簡潔で品位ある調子を保った。古代宴席の姿勢を逐語的に「横になっていた」とせず、「共に食卓に着いていた」として文化的状況を自然に伝えた。英語資料の脚注bは内容上 τοῖς συνανακειμένοις の文化注に見える一方、英語本文ではマーカー位置が願いの句に付いているため、日本語では誤った対応を再現せず、本文異読の脚注だけを正しく配置した。
