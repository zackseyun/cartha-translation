source:
  edition: SBLGNT
  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: ja
  text: しかし、ヘロディアはヨハネを恨み、彼を殺したいと思っていたが、できなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨハネに恨みを抱き続けていた」とも訳せる。ギリシア語の慣用表現は、敵意が続いていたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の文との対照と展開を示す接続辞として、文脈上の逆接を自然に表す。
- source_word: Ἡρῳδιὰς
  choice: ヘロディア
  rationale: 人名を現代日本語で一般的な聖書表記に従って音写した。
- source_word: ἐνεῖχεν αὐτῷ
  choice: ヨハネを恨み
  rationale: この語句は継続的な敵意や恨みを表す慣用表現である。不完了過去の持続性は、後続の「思っていた」と文脈全体によって伝わる。代名詞の指示対象は日本語で明確にするため「ヨハネ」とした。
- source_word: ἤθελεν
  choice: 殺したいと思っていた
  rationale: θέλω の意志・願望と、不完了過去が示す継続的な思いを自然な現代日本語で表した。
- source_word: αὐτὸν ἀποκτεῖναι
  choice: 彼を殺したい
  rationale: ἀποκτείνω の直接的な意味を保ち、「処刑する」や「殺害する」が加えうる法的・文体的含意を避けた。
- source_word: καὶ οὐκ ἠδύνατο
  choice: が、できなかった
  rationale: 形式上の καὶ はここでは意図と不可能との対照を結ぶため、日本語では逆接の「が」が自然である。何ができなかったかは直前から明白なので反復を避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた文体を保った。主語・目的語の混同を避けるため、最初の αὐτῷ は「ヨハネ」、次の αὐτόν は「彼」と訳し分けた。脚注記号は本文末に置き、節全体、とりわけ継続的な恨みの表現に対応させた。
