  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: ja
  text: そして彼女に誓って言った。「あなたが私に願うものは何でも、私の国の半分までなら与えよう。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の国の半分まで」は、王の非常に気前のよい申し出を表す、誇張的な言い方。
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: 誓った
  rationale: 単なる約束ではなく、誓いを立てたことを表すアオリスト直説法の力を、自然で簡潔な現代日本語で示す。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: 文脈上、踊った少女を指す女性単数与格を、そのまま相手を示す「彼女に」と訳す。
- source_word: Ὅ τι ἐάν
  choice: ものは何でも
  rationale: 不定の関係表現が示す、求める対象を限定しない広がりを自然な日本語で保つ。
- source_word: με αἰτήσῃς
  choice: あなたが私に願う
  rationale: αἰτέωの「求める、願い求める」という意味を、王への申し出という場面に合う表現で訳す。「私に」を明示して原文のμεを反映する。
- source_word: δώσω σοι
  choice: 与えよう
  rationale: 未来形の約束・意志の力を、直接話法として自然で威厳のある言い方にする。受益者は直前の「あなたが」により明白なので、日本語では重複を避ける。
- source_word: ἕως ἡμίσους
  choice: 半分まででも
  rationale: ἕωςが時間ではなく量的な限度を示すことを「まで」で表し、「でも」によって途方もない範囲に及ぶ申し出の語感を伝える。
- source_word: τῆς βασιλείας μου
  choice: 私の国
  rationale: βασιλείαには支配、王権、領域の意味があり得るが、この宮廷的な誓いでは、分け与え得る領域としての「国」が最も自然である。
theological_decisions:
- issue: ヘロデの発言におけるβασιλείαの意味
  choice: 国
  alternative: 支配、王権、領土
  rationale: 語そのものには統治や王権の意味もあるが、「半分まで」という数量表現と慣用的な王の申し出を踏まえ、領域を指す「国」とした。神学的な専門用語としての意味を持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、誓いの厳粛さと宮廷的な発言の威厳を保った。「何でも」と「半分まででも」により、原文の開放的な条件と誇張された上限を自然に表現した。英語相談訳の脚注記号と脚注内容にずれがあるため、日本語版では文化的説明を該当句の後に配置した。
