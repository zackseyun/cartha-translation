id: MRK.6.3
reference: Mark 6:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: ja
  text: 「この人は大工ではないか。マリアの息子で、ヤコブ、ヨセ、ユダ、シモンの兄弟[a]ではないか。この人の姉妹たち[a]も、ここで私たちと一緒にいるではないか。」そして、人々はイエスにつまずいた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」「姉妹たち」は、親族、または継きょうだいを指すと理解するキリスト教の伝統もある。ギリシア語では通常、兄弟・姉妹を意味するが、ここでの具体的な関係については異なる理解がある。
    reason: alternative_reading
  - marker: b
    text: または「人々はイエスを受け入れなかった」「人々はイエスに反感を抱いた」。原文は、イエスが彼らにとって「つまずき」となったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: 大工
  rationale: 木工に限らない職人・建築作業者を指し得る語だが、この箇所では伝統的かつ自然な「大工」が村人の認識を明瞭に伝える。
- source_word: υἱὸς τῆς Μαρίας
  choice: マリアの息子
  rationale: 母の名によってイエスを特定する、原文の目立つ表現を解釈で弱めず、そのまま保つ。
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: 兄弟／姉妹たち
  rationale: 通常の語義を本文に採用し、実のきょうだい、義理のきょうだい、より広い親族のいずれかという伝統上の論争は脚注で示す。日本語の「兄弟」はここでは性別を含む一般的なきょうだいではなく、列挙された男性たちとの関係を表す。
- source_word: Ἰωσῆτος
  choice: ヨセ
  rationale: この箇所のギリシア語形を尊重し、「ヨセフ」に統一せず、別の形として音写する。
- source_word: ὧδε πρὸς ἡμᾶς
  choice: ここで私たちと一緒にいる
  rationale: 話者たちと同じ土地・共同体にいるという社会的な近さを、自然な現代日本語で表す。
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: イエスにつまずいた
  rationale: 語の比喩的イメージを保ちつつ、イエスを受け入れられず反発したことを表す。「腹を立てた」より広い含みを残す。代名詞は日本語で対象が明確になるよう「イエス」とした。
theological_decisions:
- issue: イエスの「兄弟」「姉妹」の身分関係
  choice: 本文では通常の語義である「兄弟」「姉妹たち」と訳し、具体的な血縁関係を確定しない。
  alternative: 「親族」「近親者」と訳す、または義理のきょうだいと解する。
  rationale: ἀδελφός と ἀδελφή は通常、兄弟・姉妹を意味するが、この箇所については実のきょうだい、義理のきょうだい、近親者という理解が歴史的に存在する。本文で教理上の論争を決着させず、脚注に代案を示す。
- issue: 「マリアの息子」の社会的含意
  choice: 原文どおり直接訳し、侮蔑的含意の有無を本文で説明しない。
  alternative: 父ではなく母で呼ぶことを侮蔑的な言い方と明示する。
  rationale: 文脈上、社会的なとげを帯びる可能性はあるが、原文はその含意を明言していないため、解釈を付加しない。
- issue: ἐσκανδαλίζοντο の意味
  choice: 「イエスにつまずいた」とし、拒絶や反発を含む比喩を保つ。
  alternative: 「イエスに腹を立てた」「イエスを受け入れなかった」。
  rationale: この動詞は文字どおりの転倒ではなく、イエスが彼らにとって受容を妨げる存在となったことを示す。日本語の聖書的用法として理解可能な「つまずく」が原語の緊張を最もよく保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、村人たちの重ねた修辞疑問を保った。「この人」を反復して、彼らの驚きと見下すような調子を過度に解説せず再現した。固有名は一般的な日本語聖書表記に従いつつ、Ἰωσῆτος は「ヨセ」とした。
