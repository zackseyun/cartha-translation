  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: ja
  text: そして、イエスが弟子たちのいる舟に乗り込むと、風はやんだ。弟子たちは心の中で、この上なく驚きに圧倒されていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「自分たちの内で、非常に、度を越して驚いていた」。ギリシア語は強意表現を重ね、驚きの激しさを表している。「非常に驚いていた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: 弟子たちのところへ舟に乗り込むと
  rationale: ἀναβαίνωの基本像は「上る」だが、εἰς τὸ πλοῖονを伴うここでは舟に入る動作を表す。「乗り込む」は自然な現代日本語であり、πρὸς αὐτούςの「彼らのところへ」という方向・接近も保持する。主語のイエスとαὐτούςの指示対象である弟子たちは、日本語で明確にした。
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: 風はやんだ
  rationale: κοπάζωは風などが弱まり、収まることを表す。「やんだ」は簡明で自然であり、完全な停止か沈静化かを必要以上に細かく規定しない。
- source_word: λίαν ἐκ περισσοῦ
  choice: ただただ
  rationale: 二重に重ねられた強意を、現代日本語で不自然にならない強い反復表現によって示す。強意の積み重ね自体は脚注で補う。
- source_word: ἐν ἑαυτοῖς
  choice: 心の中で
  rationale: 直訳的な「自分たちの内で」より自然で、反応が内面的なものであることを示す。
- source_word: ἐξίσταντο
  choice: 驚きに圧倒されていた
  rationale: ἐξίστημιの未完了過去・中動態的用法が表す、平静を失うほどの強烈な驚きを自然な日本語で伝える。単なる「驚いていた」より語の強さを保つ。
theological_decisions:
- issue: イエスの行為に対する弟子たちの反応の強さ
  choice: 「心の中で、ただただ驚きに圧倒されていた」
  alternative: 「自分たちの内で、この上なく非常に驚いていた」／「我を忘れるほど驚いていた」
  rationale: 物語が強調する圧倒的な驚きを保持しつつ、その原因や弟子たちの信仰状態について本文以上の神学的説明を加えない。「我を忘れる」は強さを伝えるが、自己統制の喪失を断定しすぎる可能性があるため本文では避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、福音書本文にふさわしい簡潔で品位ある語調とした。冒頭の接続詞を「そして」として連続する出来事を示し、未完了過去ἐξίσταντοは継続的な状態を「圧倒されていた」で表した。
