  source_fidelity: 「弟子たち」は文脈上のαὐτούςを適切に明示し、「風はやんだ」もἐκόπασενをよく表している。しかし、「弟子たちのところへ舟に乗り込むと」は、日本語では「弟子たちのところへ」が「舟に乗り込む」の目的地としてやや不自然である。πρὸς αὐτούς εἰς τὸ πλοῖονは、彼らがいる舟にイエスが入ったこととして表すのが明確である。また、λίαν ἐκ περισσοῦの重畳された強意は「ただただ」だけでは十分に反映されない。
  naturalness: 「彼らのいる舟に乗り込むと」は明瞭で自然な現代標準日本語である。「心の中で、この上なく驚きに圧倒されていた」は、内面的・圧倒的な驚きを自然に表しつつ、本文の簡潔さを保つ。
  terminology: 「イエス」「弟子たち」「舟」は福音書の現代日本語訳として標準的である。「驚きに圧倒されていた」はἐξίσταντοの強い驚愕を表せる。脚注の「我を忘れるほど」は日本語では自己統制の喪失をやや具体的に含意しうるため、本文の語義範囲を越えない代案に改める。
