  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: ja
  text: そして、そこで彼はどんな力あるわざも行うことができなかった[a]。ただ、数人の病人に手を置いて癒やしただけであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どんな奇跡も行うことができなかった」「どんな力のわざも行うことができなかった」。ギリシア語では「力」という語が用いられており、マルコでは奇跡的なわざを表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: 行うことができなかった
  rationale: 否定された δύναμαι の明白な不能表現を保ち、「行おうとしなかった」などと弱めない。日本語として自然な「できなかった」とした。
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: 何一つ力あるわざを行う
  rationale: ποιέω の「行う」と、マルコで奇跡的な行為を指す δύναμις の「力」との結びつきを保つ。「奇跡を行う」も可能だが、原語の力という要素を明示するため「力あるわざ」とした。
- source_word: εἰ μὴ
  choice: ただ…だけであった
  rationale: 先行する全面否定に対する例外を、自然な現代日本語で明確に示す。
- source_word: ὀλίγοις ἀρρώστοις
  choice: 少数の病人
  rationale: ὀλίγοις の限定を落とさず、簡潔で自然に表現した。
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: 手を置いて
  rationale: 按手の身体的動作をそのまま簡潔に表す。文脈上、複数の病人それぞれに手を置いたことは自然に理解できるため、日本語では慣用的な単数形「手」とした。
- source_word: ἐθεράπευσεν
  choice: 癒やした
  rationale: 治療・回復を表す θεραπεύω を、聖書本文として自然かつ現代的な「癒やす」で訳した。
theological_decisions:
- issue: οὐκ ἐδύνατο がイエスの能力の制約を示すように読める点
  choice: 「行うことができなかった」と明白な不能表現を保持する
  alternative: 「行わなかった」「行おうとはされなかった」
  rationale: 原文は否定を伴う δύναμαι によって不能を明言している。神学的緊張を翻訳で解消せず、この節の表現をそのまま保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「力あるわざ」により δύναμις の語感を残し、脚注で「奇跡」という自然な代案と原文の直訳を示した。「癒やす」は現代の一般的表記に従い、送り仮名を付けた。
