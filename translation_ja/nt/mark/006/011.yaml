  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: ja
  text: また、どこであれ、そこで人々があなたがたを迎え入れず、あなたがたの言うことに耳を傾けないなら、そこを出て行くとき、彼らへの証しとして[a]、あなたがたの足の下の塵を払い落としなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らに不利な証しとして」とも訳せる。ギリシア語は字義的には「彼らへの証しとして」だが、この文脈では、使者とその知らせを拒む人々への警告という意味を帯びている。
    reason: alternative_reading
  - marker: b
    text: 足の塵を払い落とすことは、拒絶した人々との関係を断ち、その人々に警告することを示す象徴的な行為だった。
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: どこであれ
  rationale: 不定・一般化を表す構文を、明瞭で自然な現代日本語で表した。「どの場所でも」より滑らかであり、後続する「そこ」との対応も明確である。
- source_word: μὴ δέξηται ὑμᾶς
  choice: 人々があなたがたを迎え入れず
  rationale: δέχομαι がここで含む使者の受け入れ、特に歓待の含意を「迎え入れる」で自然に表した。ギリシア語では場所が文法上の主語だが、日本語ではその場所の人々を補うほうが意味が明瞭である。
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: あなたがたの言うことに耳を傾けない
  rationale: 単に音を聞くことではなく、使者の語ることを受け止めようとしない意味を表す。「聞き従わない」ほど服従の意味を強くせず、ἀκούω の幅を保った。
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: そこを出て行くとき
  rationale: 分詞の時間的・付帯的な関係を自然に表し、行為の順序も保持した。
- source_word: ἐκτινάξατε
  choice: 払い落としなさい
  rationale: 足に付いた塵を振るい落とす動作を、自然な日本語で表した。
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: 足の裏の塵
  rationale: 直訳的な「あなたがたの足の下にある塵」は日本語として重いため、位置関係を簡潔かつ明確に表した。複数所有者は文脈から明白なので省略した。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 彼らへの証しとして
  rationale: αὐτοῖς の与格をまず「彼らへの」と形式的に保ち、証しが不利な意味を帯びる可能性は脚注で示した。本文で「彼らに対する証拠」と断定せず、原文の曖昧さを保持した。
theological_decisions:
- issue: 塵を払い落とす行為における証しの方向性
  choice: 彼らへの証しとして
  alternative: 彼らに不利な証しとして／彼らに対する証しとして
  rationale: εἰς μαρτύριον αὐτοῖς は字義的には「彼らへの（または彼らのための）証し」と表せる。拒絶の文脈から警告や不利な証言の含意は強いが、与格そのものは「反対して」を明示しないため、本文では曖昧さを残し、文脈上の含意を脚注で説明した。
- issue: 塵を払い落とす行為の意味
  choice: 拒絶に際する訣別と警告を示す象徴的行為
  alternative: 単なる旅の習慣的動作
  rationale: 命令が「証し」と明示的に結び付けられているため、単なる清掃動作ではなく象徴的行為である。ただし、本文には解釈説明を加えず脚注に置いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「迎え入れる」と「耳を傾ける」により、歓待の拒絶と知らせの拒絶を区別した。原文の曖昧さを尊重して本文は「彼らへの証し」とし、不利な証しという文脈的含意は脚注に置いた。
