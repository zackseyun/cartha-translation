  naturalness: 全体として明瞭な現代標準日本語である。「王のもとに入って行き」「願い出た」は文脈に自然であり、引用文も強い要求として自然に響く。
  terminology: 「バプテスマを授けるヨハネ」はβαπτιστήςの記述的な意味を自然に表す。「首」は切り離されたheadを指す文脈に適切である。脚注の「バプテスマのヨハネ」は日本語で伝統的な呼称としては不正確なので、「洗礼者ヨハネ」を代替訳として示すにとどめる。
