revisions:
- from: すると彼女はすぐに、急いで王のところに入って行き、こう願い求めた。「今すぐ、バプテスマを授けるヨハネ[a]の首を大皿に載せて、私にください。」
  to: そして彼女はすぐに、急いで王のもとに入って行き、こう願い出た。「私は、今すぐ、バプテスマを授けるヨハネ[a]の首を大皿に載せて、私にくださるよう望みます。」
  rationale: καὶを中立的な「そして」とし、Θέλωを「私は…望みます」で明示した。εὐθύςとἐξαυτῆςはそれぞれ「すぐに」と「今すぐ」で保持している。脚注はβαπτιστήςに対する自然な日本語の代替訳だけを示すよう整理した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:01:02Z'
