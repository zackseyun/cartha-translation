id: MRK.6.25
reference: Mark 6:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: ja
  text: そして彼女はすぐに、急いで王のもとに入って行き、こう願い出た。「私は、今すぐ、バプテスマを授けるヨハネ[a]の首を大皿に載せて、私にくださるよう望みます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「洗礼者ヨハネ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: 入って行き
  rationale: 王のいる宴席または王の前へ入る動きを表すアオリスト分詞。日本語の物語として自然に動作を示した。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコ特有の即時性を、明瞭な現代日本語で保持した。
- source_word: μετὰ σπουδῆς
  choice: 急いで
  rationale: 素早く切迫して行動する様子を表し、肯定的な熱意までは読み込まない表現とした。
- source_word: βασιλέα
  choice: 王
  rationale: ヘロデ・アンティパスの史実上の称号ではなく、本文のβασιλεύςをそのまま訳した。
- source_word: ᾐτήσατο
  choice: 願い求めた
  rationale: αἰτέωの要求・依頼の意味を示しつつ、引用文自体の強い口調を不必要に上乗せしない。
- source_word: Θέλω ἵνα ... δῷς μοι
  choice: 私にください
  rationale: 直訳的な「私は望みます」よりも、話者の意志と要求内容を自然で直接的な日本語の依頼表現にまとめた。
- source_word: ἐξαυτῆς
  choice: 今すぐ
  rationale: 前半のεὐθύςとは別に、要求された行為にも即時性があることを保持した。
- source_word: ἐπὶ πίνακι
  choice: 大皿に載せて
  rationale: πίναξは宴席で用いる平たい大皿・盛り皿を指す。「盆」より食器としての意味が明確である。
- source_word: τὴν κεφαλὴν
  choice: 首
  rationale: 日本語では切り離された人のheadを通常「首」と表現する。本文の生々しい具体性を弱めていない。
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: バプテスマを授けるヨハネ
  rationale: βαπτιστήςの行為者としての記述的意味を明示し、固有の教派名のように受け取られることを避けた。
theological_decisions:
- issue: Ἰωάννου τοῦ βαπτιστοῦの称号の訳し方
  choice: バプテスマを授けるヨハネ
  alternative: 洗礼者ヨハネ／バプテスマのヨハネ
  rationale: βαπτιστήςはヨハネがバプテスマを授ける者であることを表す記述的称号である。本文ではその意味を明示し、広く知られた別表現を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、宴席の王に対する要求の切迫感と、二つの即時性を示す語（εὐθύς、ἐξαυτῆς）をそれぞれ訳出した。引用文は少女の率直で強い要求が伝わる自然な敬語表現とした。
