id: MRK.6.4
reference: Mark 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: ja
  text: イエスは彼らにこう言っておられた。「預言者が敬われないのは、自分の郷里[a]、親族[b]の間、そして自分の家族[c]の中だけである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「故郷」「出身地」とも訳せる。ここではナザレというイエスの出身地を指す。
    reason: lexical_alternative
  - marker: b
    text: 同じ血縁集団に属する人々、すなわち「身内」を指す。
    reason: lexical_alternative
  - marker: c
    text: 原語は建物としての「家」を指すことも、その家に属する人々を指すこともある。ここでは「家族」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っておられた
  rationale: 未完了過去の継続的な側面を示しつつ、現代日本語の物語として自然で、イエスへの敬意も保つ。
- source_word: προφήτης
  choice: 預言者
  rationale: 新約聖書における標準的で明確な訳語。
- source_word: ἄτιμος
  choice: 敬われない
  rationale: 名誉を受けないという意味を自然な日本語で表し、この格言の名誉と不名誉の対照を保つ。
- source_word: εἰ μὴ
  choice: だけである
  rationale: 否定文に続く例外を表す構文を、日本語では「敬われないのは……だけ」と自然に表現した。
- source_word: πατρίδι
  choice: 郷里
  rationale: ここでは広い意味の国土ではなく、ナザレという出身地を指すため。「故郷」も可能だが、「郷里」は出身地の意味を明確に伝える。
- source_word: συγγενεῦσιν
  choice: 親族
  rationale: 同じ血縁集団に属する人々を指し、後続の「家族」と区別できる自然な現代語。
- source_word: οἰκίᾳ
  choice: 家族
  rationale: 語義には建物としての家と、その家に属する人々の双方がある。ここでは「郷里」「親族」に続く身近な人的範囲として理解し、「家族」とした。
- source_word: καὶ ... καὶ ... καὶ
  choice: 郷里、親族の間、そして家族の中
  rationale: 三つの範囲が累加される構造を保ちながら、過度に不自然な反復を避けた明瞭な日本語とした。
theological_decisions:
- issue: 預言者についての格言とイエス自身との関係
  choice: イエスが一般的な格言を語り、それが文脈上イエス自身に当てはまる形をそのまま保つ。
  alternative: イエスがご自分を拒絶されるメシアまたは預言者と明示的に宣言していると補って訳す。
  rationale: 本文はイエスへの適用を文脈によって示すが、この節自体は「預言者」についての格言として述べているため、翻訳で解釈を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「言っておられた」で未完了過去の側面を反映し、格言部分は日本語として自然な「敬われないのは……だけである」の形にした。「郷里」「親族」「家族」と、身近な社会的範囲が次第に狭まる流れを示した。
