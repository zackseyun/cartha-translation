  terminology: 「正しく聖なる人」「恐れ」「保護していた」は、δίκαιος、ἅγιος、ἐφοβεῖτο、συνετήρειに対応する適切な用語です。「大いに当惑した」はπολλὰ ἠπόρειの程度と困惑の意味を保ちます。
