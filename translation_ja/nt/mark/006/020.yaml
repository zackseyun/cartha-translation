source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: ja
  text: ヘロデは、ヨハネが正しく聖なる人であることを知って、ヨハネを恐れ、保護していた。ヨハネの話を聞くと、大いに当惑した[a]が、喜んで耳を傾けていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「大いに当惑した」の代わりに「多くのことを行った」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: 恐れていた
  rationale: 未完了過去が表す継続的な態度を保ち、単なる「尊敬」に弱めない。文脈上、畏れや敬意を伴う可能性も残す。
- source_word: εἰδὼς
  choice: 知っており
  rationale: 分詞の因果的なつながりを後続の「からである」で自然に示しつつ、ヘロデの認識を明確にする。
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: 正しく聖なる人
  rationale: δίκαιοςの道徳的正しさとἅγιοςの聖性を、現代日本語で簡潔かつ荘重に表す。
- source_word: συνετήρει
  choice: 保護していた
  rationale: この文脈では、ヨハネを危害から守ったという意味が最も自然であり、「留め置いた」などの曖昧さを避ける。
- source_word: ἀκούσας αὐτοῦ
  choice: ヨハネの話を聞くと
  rationale: 人を目的とするἀκούωの慣用を、日本語では発言内容を聞く意味として自然に表し、分詞の時間的関係も示す。
- source_word: πολλὰ ἠπόρει
  choice: ひどく思い悩んだ
  rationale: ἠπόρειの「途方に暮れる、当惑する」という意味を、ヨハネの言葉に内面的葛藤を覚えた文脈に即して表す。πολλὰは程度を強める語として訳す。
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: それでも喜んで耳を傾けていた
  rationale: ἡδέωςの喜びや進んで聞く態度を表し、思い悩みながらも聞き続けた逆説的な緊張を「それでも」で自然に示す。
theological_decisions:
- issue: ヨハネの話を聞いた後のヘロデの反応に関する本文異同
  choice: SBLGNTのἠπόρειに従い、「ひどく思い悩んだ」とする。
  alternative: ἐποίειに従い、「多くのことを行った」とする。
  rationale: 批判本文の読みは、ヘロデがヨハネの言葉に困惑しながらも喜んで聞いたという緊張を保つ。意味を大きく変える異読は脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、継続を表す未完了過去は「〜ていた」で示した。「正しく聖なる」は平易さと聖書的な格調を両立させ、ヘロデの恐れ、保護、葛藤、喜びという原文の緊張を解消せずに保った。
