  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: ja
  text: 安息日になると、イエスは会堂で教え始めた。聞いていた多くの人々は驚き、「この人は、こうしたことをどこから得たのか。この人に与えられた知恵とは、いったい何なのか。また、この人の手を通して行われる、このような力あるわざ[a]は何なのか」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「力あるわざ」は「奇跡」または「力の現れ」とも訳せる。ギリシア語の複数形 δυνάμεις は、奇跡的な行為や力の現れを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: 安息日になると
  rationale: 属格独立構文の時間的意味を保ちつつ、現代日本語の物語文として自然に表現した。
- source_word: ἤρξατο διδάσκειν
  choice: 教え始めた
  rationale: ἄρχομαι＋不定詞の開始相を簡潔かつ正確に表す。
- source_word: συναγωγῇ
  choice: 会堂
  rationale: このユダヤ教の文脈では集会そのものより、その集会が行われるシナゴーグを指す。日本語聖書で定着した「会堂」を採用した。
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: 聞いていた多くの人々
  rationale: 分詞の継続的な聴聞の場面と、οἱ πολλοίの「多くの人々」という意味を自然に伝える。
- source_word: ἐξεπλήσσοντο
  choice: 驚き
  rationale: 強い驚きを表す語であり、文脈上はイエスの教えとわざに圧倒された反応を示す。日本語では過度に誇張せず「驚き」とした。
- source_word: Πόθεν τούτῳ ταῦτα
  choice: この人は、こうしたことをどこから得たのか
  rationale: πόθενの出所を問う意味を「どこから得た」で示し、τούτῳの距離を置く響きを「この人」で伝えた。
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: この人に与えられたこの知恵は何なのか
  rationale: 受動分詞δοθεῖσαを明示し、問いまたは驚嘆として読める原文の緊張を保った。
- source_word: δυνάμεις
  choice: 力あるわざ
  rationale: 複数形はこの文脈で奇跡的な行為を指すが、抽象的な「力」と具体的な「奇跡」の両方の含みを残すため「力あるわざ」とした。
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: その手を通して行われる
  rationale: διά＋属格の媒介・手段と「手」という原文の比喩を保持し、γινόμεναιを受動的な日本語で自然に表現した。
theological_decisions:
- issue: δυνάμειςが指すもの
  choice: 「力あるわざ」と訳し、奇跡的行為を示しながら「力」の語感も残した。
  alternative: 「奇跡」または「力」
  rationale: マルコでは複数形δυνάμειςがしばしば奇跡的な行為を表すが、「奇跡」と断定すると原語の力の側面が薄れるため、意味の幅を保持した。
- issue: τούτῳの語調
  choice: 「この人」
  alternative: 「彼」または「この者」
  rationale: 話し手たちがイエスと距離を置く調子を示しつつ、「この者」ほど古風または露骨に侮蔑的にしない表現を選んだ。
- issue: 知恵と力あるわざの由来
  choice: 群衆の問いをそのまま問いとして訳した。
  alternative: 神から与えられたものだと訳文で明示する。
  rationale: δοθεῖσαは知恵が「与えられた」ことを示すが、与え手は明記されない。訳文ではその曖昧さを保ち、神学的な補足を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、会堂での公的な教えと群衆の驚きを描く聖書物語としての品位を保った。「イエス」は直前の文脈から明らかな主語を日本語で自然に補った。脚注記号は対象語である「力あるわざ」の直後に置いた。
