  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: ja
  text: イエスは彼らの不信仰に驚いておられた。[a] そして、周辺の村々を巡り歩きながら、教えておられた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの不信仰を不思議に思っておられた」。
    reason: lexical_alternative
  - marker: b
    text: または「村々を巡回しながら」。κύκλῳは、周辺の村々を指すとも、巡回する仕方を指すとも取れる。
    reason: lexical_and_syntactical_ambiguity
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: 驚いておられた
  rationale: θαυμάζωの「驚く、感嘆する」という意味と、未完了過去が表す継続的な様相を、自然で品位ある現代日本語で表した。
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: 彼らの不信仰に
  rationale: 対格を伴うδιάが示す原因を、日本語では「不信仰に驚く」と自然に表現した。ἀπιστίαは単なる信仰の弱さよりも、信じないことを指すため「不信仰」とした。
- source_word: περιῆγεν
  choice: 巡り歩きながら
  rationale: περιάγωの未完了過去が示す、場所から場所へ継続して移動する様子を表した。後続の分詞との同時性も「ながら」で自然に示した。
- source_word: τὰς κώμας
  choice: 村々
  rationale: κώμηは町より小さい村落を指すため、明快な「村々」とした。
- source_word: κύκλῳ
  choice: 周辺の
  rationale: 副詞的なκύκλῳは、周囲の地域または巡回する動きを示す。本文では自然な「周辺の」とし、巡回の含意は「巡り歩く」と合わせて表した。
- source_word: διδάσκων
  choice: 教えておられた
  rationale: 現在分詞が主動詞と同時進行の行為を表すため、「巡り歩きながら、教えておられた」とした。
theological_decisions:
- issue: イエスが不信仰に驚いたという叙述を、無知や不適切な意味での意外性と解されないよう弱めるか
  choice: イエスは彼らの不信仰に驚いておられた
  alternative: イエスは彼らの不信仰を不思議に思われた
  rationale: 原文はイエスが驚いたことを率直に述べている。教理的説明を補って緊張を解消せず、物語の力をそのまま保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体とした。イエスへの敬意は「おられた」で示したが、原文にない教理的説明は加えていない。二つの未完了過去の継続性を「驚いておられた」「教えておられた」で表し、διδάσκωνの同時性を「ながら」で明示した。
