  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: ja
  text: しかし、ヘロデはそれを聞くと、「私が首をはねたヨハネ、この人が生き返らされた[b]のだ」と言っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「こう言った」とも訳せる。ギリシア語の未完了過去は、「繰り返し言っていた」という含みを持つこともある。
    reason: lexical_alternative
  - marker: b
    text: 「生き返った」とも訳せる。ギリシア語は受動形で、直訳すれば「生き返らされた」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: それを聞くと
  rationale: アオリスト分詞を主動詞に対する時の関係として自然な日本語にした。目的語は直前のうわさを受けて補った。
- source_word: δὲ
  choice: しかし
  rationale: 物語がヘロデの反応へ移る際の緩やかな対比・展開を示す。
- source_word: ἔλεγεν
  choice: こう言っていた
  rationale: 未完了過去の継続・反復の可能性を保ちつつ、現代日本語として自然にした。
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: 私が首をはねたヨハネだ
  rationale: 前置された関係代名詞の強調を、独立した断定文として自然に再現し、動詞の具体的意味も保った。
- source_word: οὗτος
  choice: 彼が
  rationale: 直前のヨハネを強く指し示す語。日本語では主語を明示して「彼が」とすることで焦点を保ち、不自然な「この者」を避けた。
- source_word: ἠγέρθη
  choice: 生き返らされた
  rationale: 死者について用いられた受動形を明示し、単なる能動的な「生き返った」へ平板化しないようにした。
theological_decisions:
- issue: ἠγέρθη の復活表現と受動態
  choice: 生き返らされた
  alternative: 生き返った／よみがえらされた
  rationale: ギリシア語の受動態を保持し、誰によって起こされたかは本文どおり明示しない。「よみがえる」より一般読者に直接理解しやすい表現を採った。
- issue: ヘロデの発言におけるヨハネの同定の強調
  choice: 「私が首をはねたヨハネだ。彼が…」
  alternative: 「私が首をはねたヨハネが…」
  rationale: ὃν と οὗτοςによる重ねた指示と強調を、二文に分けて保った。
translation_notes:
  register: 明快で現代的な標準日本語。ヘロデの動揺を感じさせる原文の強調構文を二つの短文で表し、宗派固有の用語を避けつつ、受動態の神学的余地を保った。
