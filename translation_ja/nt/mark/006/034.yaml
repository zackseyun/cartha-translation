    rationale: ἐξελθώνは字義的には「出る」であるが、直前の舟での移動というマルコの文脈では舟を降りて陸に出ることを指す。日本語の「舟から上がる」は舟に上がる意味にもなりうる。
  - severity: low
    issue: 「そこで」が因果関係をやや強めている。
    rationale: 原文はκαίで次の行為をつなぐ。憐れみと教えとの関連は文脈上明らかだが、「そして」として原文の接続の開放性を保つ方がよい。
  - severity: low
    issue: 脚注の「忠実に導く者」は解釈的限定である。
    rationale: 羊飼いの比喩は指導者を欠く民という聖書的用法を想起させるが、「忠実に」という性質を本文・脚注で明示する必要はない。
  revised_text: イエスは舟を降りると、大勢の群衆を見て、彼らを深くあわれに思われた。彼らが羊飼いのいない羊[a]のようであったからである。そして、彼らに多くのことを教え始められた。
