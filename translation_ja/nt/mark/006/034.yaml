  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: ja
  text: イエスは舟を降りると、大勢の群衆を見て、彼らを深くあわれに思われた。彼らが羊飼いのいない羊[a]のようであったからである。そして、彼らに多くのことを教え始められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊飼いのいない羊」という比喩は、導き手を欠いた民を羊にたとえる聖書の表現を想起させる。民数記27章17節、列王記第一22章17節、エゼキエル書34章5節参照。
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 舟から上がると
  rationale: 字義は「出ると」だが、直前の舟での移動という文脈から、舟を降りて陸に上がることを自然な日本語で示した。
- source_word: εἶδεν πολὺν ὄχλον
  choice: 大勢の群衆をご覧になり
  rationale: εἶδενは単純に「見た」、πολὺν ὄχλονは規模の大きな群衆を表す。主語イエスに合わせ、現代日本語として自然な敬語を用いた。
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: 彼らを深くあわれまれた
  rationale: ἐσπλαγχνίσθηが表す内奥からの強い同情を「深くあわれむ」で伝え、ἐπ’ αὐτούςをその対象として自然に表した。
- source_word: ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: 彼らが羊飼いのいない羊のようだったからである
  rationale: ὅτιの理由関係と羊・羊飼いの比喩を、説明的に展開せずそのまま保持した。
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: そこで、彼らに多くのことを教え始められた
  rationale: 開始を表すἤρξατοと、教えの内容の多さを示すπολλάを明示した。「そこで」は、あわれみを受けて始まる行為の自然な接続を表す。
theological_decisions:
- issue: 羊飼いのいない羊という牧者的比喩
  choice: 比喩を本文にそのまま残し、旧約聖書における背景は脚注で示す
  alternative: 「導く者のいない民」のように意味を説明して訳す
  rationale: この表現は神の民と指導者をめぐる聖書的な牧者像を想起させるが、本文で意味を一つに限定せず、原文の比喩と含意を保つため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの動作には日本語聖書として自然な敬語を用いた。「あわれむ」はやや格調を保ちつつ一般読者にも理解でき、原語の深い感情を伝える。英語資料の脚注aは本文語句との対応に不整合があるため採用せず、原語と文脈に基づく脚注のみを付した。
