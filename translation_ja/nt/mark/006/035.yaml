  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: ja
  text: すでにかなり遅い時刻になったころ、弟子たちはイエスのもとに来て、こう言った。「ここは人里離れた場所ですし、時刻ももうかなり遅くなっています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: すでに／もう
  rationale: 時がすでに進んでいることを示す。同じ語を、地の文では「すでに」、会話では自然な「もう」と訳した。
- source_word: ὥρας πολλῆς γενομένης
  choice: かなり遅い時刻になったので
  rationale: 属格独立構文を自然な時・理由の節として表現した。πολλῆς は時刻が相当に遅いことを表す。
- source_word: προσελθόντες αὐτῷ
  choice: イエスのもとに来て
  rationale: προσέρχομαι の接近する動作を自然に表した。代名詞 αὐτῷ の指示対象を明確にするため「イエス」とした。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちは
  rationale: 文脈上イエスの弟子であることが明白で、日本語では所有表現を省くほうが自然である。
- source_word: ἔλεγον
  choice: こう言った
  rationale: 未完了過去の進行的側面を日本語で不自然な「言っていた」とせず、後続する直接話法を導く自然な叙述とした。反復までは読み込まない。
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ここは人里離れた場所です
  rationale: ἔρημος はこの文脈で無人ないし人里から離れた場所を指す。「荒れ果てた」という含意を避けた。
- source_word: καὶ ἤδη ὥρα πολλή
  choice: もうずいぶん遅い時刻です
  rationale: 時刻がすでに相当に遅いという強調を、明瞭で自然な現代日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文で繰り返される時刻の遅さを本文でも保持した。英語POBの脚注は本文中の対応位置が逆転しているように見えるため踏襲せず、ギリシア語本文から直接判断した。
