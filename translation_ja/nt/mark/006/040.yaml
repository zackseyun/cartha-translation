lexical_decisions:
- source_word: ἀνέπεσαν
  choice: 席に着いた
  rationale: 食事のために身を横たえる、または定められた場所に着くことを表す動詞。古代の食事姿勢を逐語的に「横になった」とすると、日本語では寝たようにも聞こえるため、食事の場面に自然な「席に着いた」とした。
- source_word: πρασιαὶ πρασιαὶ
  choice: 組になって
  rationale: πρασιάは文字どおりには畑の畝や区画を指し、反復形はここで、人々が整然と区分された組ごとに並んだ様子を表す。本文では自然な日本語で意味を伝え、原語の比喩的な像は脚注に残した。
- source_word: κατὰ ἑκατὸν
  choice: 百人ずつ
  rationale: κατάと数詞の組み合わせが示す配分を、日本語の自然な分配表現「百人ずつ」で表した。
- source_word: κατὰ πεντήκοντα
  choice: 五十人ずつ
  rationale: 前句と並行する分配表現として「五十人ずつ」とし、原文の簡潔な対句を保った。
