language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: ja
  text: イエスが村でも町でも田舎でも、どこに入って行かれても、人々は病人たちを広場に寝かせ、せめて衣の裾[a]にでも触れられるようにと、イエスに願った。そして、触れた者は皆、癒やされた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣の端」または「衣の房」とも訳せる。ギリシア語は衣の縁や裾を指し、ユダヤ人の衣につけられた房を連想させることもある。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「救われた」。ここでは病気から癒やされ、健やかにされたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: どこに入って行かれても
  rationale: ὅπου ἄνの不特定・一般化の意味と、未完了過去が示す反復的な行動を自然な日本語で表す。
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: 村でも町でも田舎でも
  rationale: κώμη、πόλις、ἀγρόςの対照を保ちつつ、ἀγροίはここでは個々の畑より農村地帯・田舎を指すと判断した。
- source_word: ἐν ταῖς ἀγοραῖς
  choice: 広場に
  rationale: ἀγοράは市場または公共の広場を指す。この場面では病人を置く公共空間として「広場」が明瞭である。
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: 病人たちを広場に寝かせ
  rationale: τίθημιは置くことを意味するが、病人については「寝かせる」が自然。文全体の反復性は「どこに…ても」で十分に示される。
- source_word: παρεκάλουν αὐτόν
  choice: 願った
  rationale: 切実な懇願を表す。現代日本語で過度に誇張せず、文脈に合う自然で格調ある表現とした。
- source_word: ἵνα κἂν ... ἅψωνται
  choice: せめて…にでも触れさせてほしい
  rationale: κἄνが示す最小限の願い（せめて、少なくとも）を明確に表す。
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: 衣の裾
  rationale: κράσπεδονは衣の端、裾、房を指し得る。本文では過度に特定せず「裾」とし、ユダヤ的背景を含む「房」の可能性は注記する。
- source_word: ὅσοι ἂν ἥψαντο αὐτοῦ
  choice: 触れた者は皆
  rationale: 文法上は「彼に触れた」だが、直前の衣の裾が具体的な接触対象として示されているため、日本語では目的語を省略して曖昧さを保持する。
- source_word: ἐσῴζοντο
  choice: 癒やされた
  rationale: σῴζωの基本的な意味領域には救済と回復が含まれるが、病人の文脈では身体的に癒やされたことを指す。受動の結果を自然に表した。
theological_decisions:
- issue: ἐσῴζοντο（σῴζω）の訳
  choice: 癒やされた
  alternative: 救われた／健やかにされた
  rationale: 語には「救う」という広い神学的含意があり得るが、直接の文脈は病人の身体的回復である。「癒やされた」は文脈上の意味を明瞭にしつつ、脚注で原語の広がりを示す。
- issue: ἥψαντο αὐτοῦの接触対象
  choice: 触れた
  alternative: イエスに触れた／その裾に触れた
  rationale: ギリシア語は文法上「彼に触れた」と読める一方、直前には衣の裾への接触が述べられる。日本語で目的語を補わず、両者の重なりと曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスへの敬意は尊敬語「入って行かれても」で自然に示した。反復的な場面要約は「どこに…ても」で表し、未完了過去を機械的な進行形にはしなかった。
