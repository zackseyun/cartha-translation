  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: ja
  text: イエスは彼らに、旅には杖一本だけを持ち、パンも、袋[a]も、帯に銅貨[b]を入れないように命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旅の食糧などを入れる携帯用の袋。
    reason: lexical_alternative
  - marker: b
    text: 直訳「銅」。ここでは帯に入れて携帯する銅製の硬貨、すなわち金銭を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: 命じられた
  rationale: 権威をもって指示する語であり、この文脈では「命じる」がその力を明確に保つ。主語がイエスであることを日本語で補い、敬意を表す語調にした。
- source_word: μηδὲν αἴρωσιν
  choice: 何も持って行かないよう
  rationale: 旅行の携行品についての禁止なので、現代日本語として自然な「持って行く」を用いた。
- source_word: εἰς ὁδὸν
  choice: 旅には
  rationale: 直訳的な「道のために」ではなく、旅支度を指す自然で簡潔な表現とした。
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: 杖一本のほか
  rationale: μόνονの限定を「一本のほか」によって自然に表し、携行を許された唯一の品が杖であることを明確にした。
- source_word: ἄρτον
  choice: パン
  rationale: 具体的な「パン」を一般的な「食べ物」に広げず、そのまま保持した。
- source_word: πήραν
  choice: 袋
  rationale: 旅の食糧などを入れる携帯用の袋を指すが、本文では簡潔な「袋」とし、具体的な意味は脚注に示した。
- source_word: ζώνην
  choice: 帯
  rationale: 衣服を腰で締め、金銭を携帯することもできた帯を指す。聖書時代の服装に合う簡潔な訳語である。
- source_word: χαλκόν
  choice: 銅貨
  rationale: 文字どおりには「銅」だが、この文脈では銅製の貨幣を指す換喩である。日本語本文では意味が通る「銅貨」とし、字義は脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。列挙される禁止事項は反復を避けつつ、原文の強い限定と命令の調子を保持した。英語相談層の脚注記号には内容とのずれがあるため、原文の語順と語義に基づき、[a]をπήρα、[b]をχαλκόνに正しく対応させた。
