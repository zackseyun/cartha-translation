  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/042.yaml
  text: And they all ate and were satisfied.
translation:
  language: ja
  text: そして、皆が食べて満腹になった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: 食べて
  rationale: ἐσθίωのアオリストで、普通に「食べる」を意味する。後続のἐχορτάσθησανが満ち足りた結果を表すため、ここで「十分に食べた」と重ねない。
- source_word: πάντες
  choice: 皆が
  rationale: 文脈上、群衆全体を指す実詞的用法。日本語では「皆が」として、例外なく全員であることを自然に示す。
- source_word: ἐχορτάσθησαν
  choice: 満腹になった
  rationale: χορτάζωの受動形で、十分に食べて満たされたことを表す。食事の文脈に即した明瞭で自然な現代日本語として「満腹になった」とした。
- source_word: καὶ ... καὶ
  choice: そして、…て…
  rationale: 反復されるκαίは二つの出来事を単純に連結する。文頭を「そして」で受け、後半は日本語として自然な連用形で結び、マルコの簡潔な叙述の流れを保った。
theological_decisions: []
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。原文の並列的な語り口を保ちつつ、日本語として不自然な「そして」の反復は避けた。
