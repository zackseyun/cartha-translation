  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: ja
  text: 彼らを帰らせてください。周辺の農村地帯や村々に行って、自分たちの食べる物を買えるように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλυσον αὐτούς
  choice: 彼らを解散させてください
  rationale: ἀπολύωのアオリスト命令形は、ここでは群衆をその場から去らせることを指す。「解散させる」は指示の力を保ちつつ、現代日本語で自然に群衆を帰す意味を表す。
- source_word: ἵνα
  choice: そうすれば
  rationale: 目的と想定される結果の双方を含み得る接続を、文脈に即して自然に表す。目的だけに狭く限定しない。
- source_word: ἀπελθόντες
  choice: 行き
  rationale: アオリスト分詞の先行・付帯的な動作を、日本語では連用形で自然に表し、買う前に周辺へ出向く流れを保つ。
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: 周りの農村や村々
  rationale: κύκλῳは「周りの」、ἀγροίは畑だけでなく農地・田園地帯を含むため「農村」、κῶμαιは比較的小規模な集落として「村々」とした。「や」は、二種の場所を一まとまりとして自然に列挙する。
- source_word: ἀγοράσωσιν ἑαυτοῖς
  choice: 自分たちで…買うことができます
  rationale: ἀγοράζωを「買う」、利益の与格である再帰代名詞を「自分たちで」と表し、自分たちの必要を自ら満たす含みを自然な日本語で保持する。接続法は目的節内の見込み・可能性として表現した。
- source_word: τί φάγωσιν
  choice: 食べる物
  rationale: 不定のτίを、文脈上の食物を指す自然な日本語「食べる物」で表す。写本上の語順差は日本語訳の意味に影響しない。
