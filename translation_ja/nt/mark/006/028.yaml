  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: ja
  text: そして彼は、その首を大皿[a]に載せて持って来て少女に渡し、少女はそれを自分の母親に渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「盆」または「皿」。ギリシア語のπίναξは、料理を載せる皿・大皿・盆を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: 持って来て
  rationale: 宴席へ切り落とされた首を物理的に運んで来たことを、自然な現代日本語で表す。
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: その首
  rationale: 文脈上、洗礼者ヨハネの首を指す。「その」は直前までの文脈を受け、日本語として不自然な性別代名詞を避ける。
- source_word: ἐπὶ πίνακι
  choice: 大皿に載せて
  rationale: πίναξは料理を盛る皿・大皿・盆を指し得る。宴席の文脈では「大皿」が自然で、「載せて」により位置関係を明確にする。
- source_word: ἔδωκεν
  choice: 渡し／渡した
  rationale: 二度のδίδωμιを同じ動詞「渡す」で再現し、受け渡しの連鎖と原文の反復を保つ。
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: 少女
  rationale: κοράσιονが示す若い女性を、古風にならない簡潔な語で表す。
- source_word: τῇ μητρὶ αὐτῆς
  choice: 母親に
  rationale: 少女の母親であることは直前の主語から明らかであり、日本語として自然に表す。
theological_decisions: []
translation_notes:
  register: 簡潔な物語調を保ち、原文で繰り返される「渡す」を維持した。主語はギリシア語では省略されているが、直前の文脈を受けて「兵士」と補い、現代日本語で明瞭にした。
