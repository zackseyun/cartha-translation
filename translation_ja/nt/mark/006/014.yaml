id: MRK.6.14
reference: Mark 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: ja
  text: さて、ヘロデ王もこのことを耳にした。イエスの名が広く知られるようになっていたからである。人々は、「バプテスマを授けるヨハネ[a]が死者の中からよみがえらされた[b]。だから、さまざまな力[c]が彼のうちに働いているのだ」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、伝統的な呼び方では「バプテスマのヨハネ」。
    reason: lexical_alternative
  - marker: b
    text: 「死者の中からよみがえった」とも訳せる。ギリシア語の動詞は受動形で、直訳は「よみがえらされた」。
    reason: alternative_reading
  - marker: c
    text: 「奇跡を行う力」または「力ある業」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ヘロデ王
  rationale: 日本語で自然な称号と固有名の語順を用い、βασιλεύςを「王」と明示した。
- source_word: ἤκουσεν
  choice: このことを耳にした
  rationale: 目的語は直前までのイエスの活動と評判を指すため、「このこと」を補って自然な日本語にした。
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: イエスの名が広く知られるようになっていたからである
  rationale: αὐτοῦの指示対象を日本語で明確にし、ὄνομαを「名」と保ちながら、φανερὸν ἐγένετοを自然に表現した。
- source_word: ἔλεγον
  choice: 人々は…と言っていた
  rationale: 主語のない三人称複数を、不特定多数を表す自然な日本語にした。
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: バプテスマを授けていたヨハネ
  rationale: 冠詞付き現在分詞の動作性を保ち、伝統的称号だけに固定しなかった。物語上すでに殺されているため、日本語では「授けていた」とした。
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: 死者の中からよみがえらされた
  rationale: 完了受動形を保持し、復活後の現在の状態も含む表現とした。
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 先行する復活の主張を、後続する力の働きの理由として明快に結んだ。
- source_word: ἐνεργοῦσιν αἱ δυνάμεις
  choice: あのような力が…働いている
  rationale: 複数形δυνάμειςが奇跡的な力や力ある業を指し得る曖昧さを「力」で保ち、ἐνεργοῦσινの継続的活動を「働いている」とした。
- source_word: ἐν αὐτῷ
  choice: 彼のうちに
  rationale: 「彼を通して」と道具的に限定せず、ἐνの直接的表現と内在的な働きの含みを保持した。
theological_decisions:
- issue: 復活文脈におけるἐγήγερταιの態
  choice: よみがえらされた
  alternative: よみがえった
  rationale: ギリシア語の受動形を保ち、行為者を本文にない形で特定せず、能動・自動詞的表現への変更を避けた。
- issue: Ἰωάννης ὁ βαπτίζωνの呼称
  choice: バプテスマを授けていたヨハネ
  alternative: バプテスマのヨハネ
  rationale: 分詞の動作性を本文で示しつつ、日本語で定着した呼称を脚注に残した。
- issue: αἱ δυνάμειςの意味範囲
  choice: あのような力
  alternative: 奇跡を行う力／力ある業
  rationale: 力そのものとも奇跡的な業とも理解できる語義上の幅を、一方に決めずに保った。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保った。「さて」で場面の進展を示し、引用部は口語的すぎない自然な発話とした。すべての脚注記号を対応箇所に置いた。
