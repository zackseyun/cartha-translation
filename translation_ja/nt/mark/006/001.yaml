  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: ja
  text: イエスはそこを出て、ご自分の故郷に行かれた。そして、弟子たちはイエスに従った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、「故郷に行かれ、弟子たちが従う」とも訳せる。ギリシア語はここで現在形を用い、物語に臨場感を与えている。
    reason: ἔρχεταιとἀκολουθοῦσινの歴史的現在を反映する代替訳であることを明確に示すため。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出て
  rationale: ἐξέρχομαιの移動のイメージを保ちつつ、直前の場所から立ち去ることを自然な日本語で表す。
- source_word: ἐκεῖθεν
  choice: そこを
  rationale: 出発点を示すἐκεῖθενを、動詞「出る」と自然に結びつく簡潔な日本語にした。
- source_word: ἔρχεται
  choice: 行かれた
  rationale: ギリシア語は臨場感を与える歴史的現在形だが、現代日本語の物語として自然な過去形にした。話者の位置を前提とする「来られた」より、前の場所から故郷へ移動する流れに合う「行かれた」を選んだ。
- source_word: πατρίδα
  choice: 故郷
  rationale: 文脈ではイエスの郷里を指す。「母国」では範囲が広すぎ、「故郷」が自然で適切である。
- source_word: ἀκολουθοῦσιν
  choice: 従った
  rationale: 単なる同行だけでなく、福音書における弟子として従う含意を保つ。歴史的現在形は自然な日本語の過去形で表した。
- source_word: μαθηταὶ
  choice: 弟子たち
  rationale: 教えを受け、師に従う関係を表す定着した訳語である。
theological_decisions:
- issue: ἔρχεταιとἀκολουθοῦσινの歴史的現在
  choice: 本文では過去形「行かれた」「従った」とする
  alternative: 現在形「行かれる」「従う」として語りの臨場感を直接再現する
  rationale: これは教理上ではなく物語文体上の判断である。現代日本語では突然の現在形が不自然になりやすいため、本文は過去形とし、原文の時制による臨場感は脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語。イエスへの敬意は動詞の敬語で示すが、過度に古風または荘重にはしない。「イエス」を補って代名詞の指示先を明確にし、二文に分けて読みやすくした。
