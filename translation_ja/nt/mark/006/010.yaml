  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: ja
  text: そして彼らにこう言っていた。「どこであれ、一軒の家に入ったなら、そこから去るまで、そこにとどまりなさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「そこから出るまで」。文脈上は、その家のある滞在地を去るまで、同じ家にとどまることを指すと考えられるが、「そこ」の範囲は原文で明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: こう言っていた
  rationale: 未完了時制の継続的・反復的な語りの側面を保ちつつ、現代日本語の物語として自然にした。
- source_word: Ὅπου ἐὰν
  choice: どこであれ
  rationale: 不定関係の意味「どこであっても」を簡潔で格調ある日本語で表した。
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: ある家に入ったなら
  rationale: 家の中への進入と条件的な指示を自然に表す。「ある」は不特定の単数名詞を示す。
- source_word: ἐκεῖ μένετε
  choice: そこにとどまりなさい
  rationale: 同じ家に滞在し続けるようにとの命令を明確にする。「泊まりなさい」より原語の広い意味を保つ。
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: その土地を出るまでは
  rationale: 宣教先を離れるまで同じ家に滞在するという文脈上の意味を自然に示した。ただしἐκεῖθεν自体は直訳すれば「そこから」であり、範囲には曖昧さがあるため脚注で示した。
theological_decisions:
- issue: ἐκεῖθενが指す範囲
  choice: その土地を出るまで
  alternative: そこから出るまで（家を出るまでとも取り得る）
  rationale: 宣教旅行中の宿泊についての指示という文脈では、より良い宿へ移らず、滞在地を去るまで同じ家にいる意味が自然である。一方、ギリシア語そのものは場所の範囲を明示しないため、脚注で直訳的な別訳を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの指示にふさわしい簡潔で品位ある文体とした。未完了時制は「言っていた」で表し、語義上の曖昧さは本文で過度に説明せず脚注に保った。
