  source_fidelity: 本文は、ἐπέταξενの命令、αὐτοῖς（弟子たち）とπάντας（皆）の統語上の区別、反復されたσυμπόσιαの配分的意味、青草の場所を適切に表している。「座らせる」はἀνακλῖναιの食事時の「身を横たえる／寄りかかる」姿勢を現代日本語としてやや広くした表現だが、脚注がその含意を補っており、本文として許容できる。
