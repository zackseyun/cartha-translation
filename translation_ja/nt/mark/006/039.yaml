  text: καὶ ἐπέταξεν αὐτοῖς ⸀ἀνακλῖναι πάντας συμπόσια συμπόσια ἐπὶ τῷ χλωρῷ χόρτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: ja
  text: そこでイエスは弟子たちに、皆を組ごとに[a]青々とした草の上に座らせる[b]よう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「食事の組、食事の組に」。同じギリシア語を繰り返し、幾つもの組に分けることを表している。
    reason: lexical_alternative
  - marker: b
    text: 当時の食事の姿勢を踏まえると、「食事のために身を横たえさせる」とも訳せる。
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: ἐπέταξεν
  choice: 命じた
  rationale: 権威をもって指示する動詞の強さを保ち、「言った」よりも原文に忠実な表現とした。
- source_word: αὐτοῖς
  choice: 弟子たちに
  rationale: 代名詞そのものは「彼らに」だが、文脈上の指示対象は弟子たちである。日本語では役割関係を明瞭にし、πάντας（皆）との混同を避けるため、指示対象を明示した。
- source_word: ἀνακλῖναι
  choice: 座らせる
  rationale: 食事のために身を横たえる姿勢を表すが、現代日本語で「横たわらせる」とすると休息や臥床の意味に受け取られやすい。食事の場面として自然な「座らせる」を本文に置き、姿勢の含意は脚注に示した。
- source_word: πάντας
  choice: 皆を
  rationale: 命令を受ける弟子たちとは別に、座らされる群衆全体を指す対格であるため、「皆を」として統語上の区別を明確にした。
- source_word: συμπόσια συμπόσια
  choice: 組ごとに
  rationale: 同じ語の反復による配分的な意味を、簡潔で自然な日本語によって表した。単に「組になって」より、複数のまとまりに整然と分けるニュアンスが伝わる。
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: 青々とした草の上に
  rationale: χλωρόςの「緑の、生き生きした」という情景的な意味と、χόρτοςの「草」を自然な現代日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「弟子たちに」と「皆を」を分け、命令を受けた者と座らされる者を原文の統語に沿って区別した。
