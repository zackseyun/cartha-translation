  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: ja
  text: 王は深く心を痛めたが、自分の誓いと、食卓に着いていた人々[a]のことを考えて、彼女を拒もうとはしなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「食卓で横になっていた人々」。当時、正式な宴席では横になって食事をした。
    reason: lexical_alternative
  - marker: b
    text: または「彼女の願いを退ける」。ここでは、彼女の要求を拒む、すなわち先にした誓いに反することをしない、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: 深く心を痛めたが
  rationale: 強い悲しみを表しつつ、後続する決断との暗黙の譲歩的な対照を自然な日本語で示す。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: マルコがヘロデを指して用いる語を、そのまま標準的に訳す。
- source_word: διὰ τοὺς ὅρκους
  choice: 誓ったこと…の手前
  rationale: διάの理由・動機を示し、複数形のὅρκουςは文脈上、一連の誓言を自然な日本語で表す。
- source_word: τοὺς ἀνακειμένους
  choice: 食卓に着いていた人々
  rationale: 食事のために横になっていた人々を指すが、日本語で古代の姿勢を不自然に強調せず、会食の場に同席した人々という意味を伝える。
- source_word: οὐκ ἠθέλησεν
  choice: 望まなかった
  rationale: 不可能ではなく意志を表すθέλωの意味を保持する。
- source_word: ἀθετῆσαι αὐτήν
  choice: 彼女の願いを退ける
  rationale: 代名詞の目的語を日本語で明確にし、この文脈で彼女の求めを拒絶して、誓いを無効にすることを指す意味を表す。
theological_decisions: []
