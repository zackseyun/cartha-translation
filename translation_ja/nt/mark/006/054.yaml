  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: ja
  text: 一行が舟から降りると[a]、人々はすぐにイエスだと分かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「彼らが舟から降りると、すぐに彼を認めて」。原文では「認めて」の主語が明示されていないが、文脈上、その土地の人々を指す。
    reason: 原文の属格独立構文と、省略された主語に伴う曖昧さを示すため。
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: 一行が……上がると
  rationale: 属格独立構文を自然な時の節で表した。舟から陸へ出る場面なので、日本語では「舟から上がる」が明瞭である。αὐτῶνはイエスと弟子たちを指すため「一行」とした。
- source_word: πλοίου
  choice: 舟
  rationale: ガリラヤ湖で用いられる小型の舟を指す文脈に合い、福音書の叙述として自然である。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な即時性を、明快な現代日本語で保った。
- source_word: ἐπιγνόντες
  choice: 気づいた
  rationale: ここでは、目にした人物がイエスだと認知する意味。「イエスだと気づいた」は日本語として自然で、単なる知識ではなく認知を表す。
- source_word: αὐτὸν
  choice: イエスだと
  rationale: 代名詞の指示対象は文脈上イエスである。日本語で「彼に気づいた」とすると意味が不自然になりやすいため、指示対象を明示した。
- source_word: implicit subject of ἐπιγνόντες
  choice: 人々
  rationale: 分詞の主語は本文中に名詞として明示されていないが、属格独立構文のαὐτῶνとは統語上別であり、次節からその土地の人々を指すと分かる。日本語で意味を明瞭にするため補った。
theological_decisions:
- issue: イエスに気づいた者の特定
  choice: その土地の人々を指す「人々」を本文で補う
  alternative: 主語を「彼ら」として曖昧さを残す
  rationale: これは教理上ではなく統語・文脈上の判断である。ἐπιγνόντεςは主格複数で、属格独立構文中のαὐτῶνをそのまま主語とはしにくい。次節では周辺の人々が地域中を走り回るため、彼らがイエスを認めたと理解するのが自然。ただし、原文で主語名詞が省略されていることは脚注で示した。
translation_notes:
  register: 明快で現代的かつ品位ある叙述。「ボート」より聖書物語の湖上の小舟に適する「舟」を用い、「直ちに」より一般読者に自然な「すぐに」を採用した。
