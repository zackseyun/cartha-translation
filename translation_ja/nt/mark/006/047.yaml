  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: ja
  text: 夕方になると、舟は海の真ん中にあり、イエスだけが陸地[a]におられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陸地」は「岸」とも訳せる。ギリシア語は「陸地」といい、舟が海にあったこととの対照を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: 夕方になると
  rationale: 属格独立構文が示す時の状況を、現代日本語で自然かつ簡潔に表した。文脈上、夕方への移行が完了した時点を示す。
- source_word: τὸ πλοῖον
  choice: 舟
  rationale: ガリラヤ湖で用いられた比較的小型の舟を指すため、「船」よりも「舟」が文脈に適している。
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: 湖の真ん中に
  rationale: 位置が岸から離れた水域の中央部であることを明瞭に表す。日本語では固有の地理的文脈に即して「湖」とするのが自然で、指示対象の誤解を避けられる。
- source_word: τῆς θαλάσσης
  choice: 湖
  rationale: θάλασσαの基本義は「海」だが、ここではガリラヤ湖を指す。現代日本語で地理的対象を明確に伝えるため「湖」と訳した。
- source_word: αὐτὸς μόνος
  choice: イエスだけが
  rationale: αὐτόςの指示対象を日本語で明確にし、μόνοςの排他的・孤独な状態を「だけ」で自然に表した。
- source_word: ἐπὶ τῆς γῆς
  choice: 陸に
  rationale: 舟が水上にあることとの対照を簡潔に保つ。「岸に」より原文のγῆに直接対応する。
