  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: ja
  text: イエスは五つのパンと二匹の魚を取り、天を仰いで祝福し[a]、パンを裂いた。そして、人々の前に置くために、弟子たちにパンを渡し続けた。また、二匹の魚も皆に分けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「感謝をささげ」とも訳せる。ギリシャ語の動詞は直訳すると「祝福した」だが、食事の文脈では感謝をささげる意味合いを持つことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: 取り
  rationale: アオリスト分詞が後続する動作に先立つ行為を示すため、日本語では自然な連用形で一連の動作を表した。
- source_word: ἄρτους
  choice: パン
  rationale: 数えられた個々のパンを指すが、現代日本語では「五つのパン」が自然であり、具体性も保てる。
- source_word: ἰχθύας
  choice: 魚
  rationale: 具体的な食物としての魚を表し、助数詞「匹」で複数を明示した。
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: 天を仰いで
  rationale: 上方へ目を向ける動作とοὐρανόςの宗教的含意を、簡潔で格調ある日本語で表した。
- source_word: εὐλόγησεν
  choice: 祝福し
  rationale: 原文には明示された目的語がないため、「食物を祝福した」「祝福の祈りをささげた」のいずれかに限定せず、動詞そのものを保った。食事の文脈では感謝をささげる意味合いもあり得るため脚注を付した。
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: パンを裂いた
  rationale: 明示された目的語を保持し、分配に先立ってパンを裂く具体的動作を表した。
- source_word: ἐδίδου
  choice: 渡し続けた
  rationale: 未完了過去の継続・反復的な側面を示し、分配が進む間イエスが弟子たちにパンを渡していたことを表した。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: 文脈上イエスの弟子であることが明白なため、日本語で不自然になりやすい所有表現を省きつつ指示対象を保った。
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: 人々に配らせるため
  rationale: ἵναの目的を明示し、食事の場面で「前に置く、供する」を意味するπαρατίθημιを自然な現代日本語で表した。αὐτοῖςの指示対象は群衆であるため「人々」とした。
- source_word: ἐμέρισεν πᾶσιν
  choice: 皆に分けた
  rationale: 分割・分配を表す動詞と、そこにいた全員を指す与格を簡潔に再現した。
theological_decisions:
- issue: 食事の文脈におけるεὐλόγησενの訳し方
  choice: 祝福し
  alternative: 感謝をささげ／祝福の祈りをささげ
  rationale: 原語はεὐχαριστέωではなくεὐλογέωであり、目的語も明示されていない。「祝福し」とすることで語彙上の透明性と、祝福の対象・行為をめぐる原文の含みを保った。食事の祝福が感謝の意味を帯びる可能性は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「天を仰ぐ」「パンを裂く」など原文の具体的な描写と聖書本文にふさわしい品位を保った。εὐλόγησενは目的語を補わず、原文の曖昧さを残した。
