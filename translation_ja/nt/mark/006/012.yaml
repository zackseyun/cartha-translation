  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: ja
  text: そして、弟子たちは出て行き、人々に悔い改めるように宣べ伝えた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らが悔い改めるように」。ここでの「彼ら」は、弟子たちの宣べ伝えることを聞いた人々を指す。
    reason: 原文では三人称複数の主語が明示されておらず、より直訳的な表現とその指示対象を示すため。
lexical_decisions:
- source_word: Καὶ
  choice: そこで
  rationale: 直前の派遣命令を受けて弟子たちが行動したという自然な物語のつながりを示す。単純な接続を保ちつつ、日本語では「そして」より文脈に適する。
- source_word: ἐξελθόντες
  choice: 出て行き
  rationale: アオリスト能動分詞で、主動詞に先立つ、または密接に伴う行為を表す。日本語では連用形にして物語の流れを自然にした。
- source_word: ἐκήρυξαν
  choice: 宣べ伝えた
  rationale: κηρύσσωの公に告げ知らせる意味を表し、福音書の文体にもふさわしい。単なる私的な教示ではなく、公的な宣言の響きを保つ。
- source_word: ἵνα
  choice: よう
  rationale: ここでは宣言の内容または求められる応答を導く。日本語の「人々に～するよう宣べ伝えた」で自然に表現できる。
- source_word: μετανοῶσιν
  choice: 悔い改める
  rationale: μετανοέωは単なる考え直しに限らず、神に向き直る心と生き方の転換を含む。「悔い改める」は簡潔で定着した訳語であり、語の神学的重みも保つ。
theological_decisions:
- issue: μετανοῶσινの省略された主語を日本語でどう示すか
  choice: 人々に悔い改めるよう
  alternative: 彼らが悔い改めるよう
  rationale: ギリシャ語の三人称複数は宣教を聞く者たちを指すが、日本語で「彼ら」とすると弟子たちを指すようにも読める。「人々に」と補うことで、教理的内容を加えず対象を明確にする。
- issue: μετανοέωの意味範囲
  choice: 悔い改める
  alternative: 考えを改める
  rationale: 「考えを改める」では知的変化に狭めるおそれがある。「悔い改める」は、心と生き方の方向転換を含み得る原語の緊張と福音書文脈での重みを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「宣べ伝える」「悔い改める」はやや改まった定着語だが、原語の公的宣言と神への方向転換という含意を簡潔に伝えるため採用した。
