- from: イエスは、弟子たちが向かい風のため、舟をこぐのに苦しんでいるのを見た。夜の第四の見張り時ごろ[a]、イエスは湖の上を歩いて[b]彼らのところへ来られた。そして、彼らのそばを通り過ぎようとされた[c]。
