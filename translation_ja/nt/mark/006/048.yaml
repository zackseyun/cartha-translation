source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: ja
  text: イエスは、弟子たちが向かい風のため舟をこぐのに苦闘しているのを見て、夜の第四の見張りの番ごろ[a]、海の上を歩いて[b]彼らのところへ来られた。そして、彼らのそばを通り過ぎようとされた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夜の第四の見張りの番」は、ローマ式の時刻区分では、およそ午前三時から六時まで。
    reason: cultural_note
  - marker: b
    text: 原語は「海」。ここではガリラヤ湖を指す。
    reason: lexical_alternative
  - marker: c
    text: 「彼らのそばを通り過ぎようとされた」は、単に彼らの先へ行こうとされたという意味とも取れる。一方、神が「通り過ぎる」ことによって御自身を現す旧約聖書の場面（出エジプト記33章19、22節、34章6節、列王記第一19章11節）を響かせている可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: 見た
  rationale: アオリスト分詞の時間的関係を、日本語として自然な主節の流れの中で表した。
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: 舟をこぐのに苦しんでいる
  rationale: βασανίζωの強い苦痛・難儀の含みを「苦しんでいる」で保ちつつ、ἐλαύνεινが文脈上、舟をこぐことを指すと明示した。
- source_word: ἐναντίος αὐτοῖς
  choice: 向かい風
  rationale: 直訳的な「彼らに逆らっていた」よりも、風についての自然で明瞭な日本語とした。
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: 夜の第四の見張り時ごろ
  rationale: 古代の時刻区分を本文に残し、現代の時刻の目安は脚注に示した。
- source_word: ἔρχεται
  choice: 来られた
  rationale: ギリシア語は臨場感のある歴史的現在だが、日本語では物語の時制を自然に保つ過去形とし、イエスへの通常の敬意を表した。
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: 湖の上を歩いて
  rationale: θάλασσαはこの文脈ではガリラヤ湖を指すため「湖」とし、ἐπίの表現を「上を」で保持した。
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: 彼らのそばを通り過ぎようとされた
  rationale: 意図を表すἤθελενと「通り過ぎる」を表すπαρελθεῖνを率直に訳し、単なる通過か神顕現を響かせる表現かを本文で決めつけないようにした。
theological_decisions:
- issue: 「彼らのそばを通り過ぎようとされた」の意味
  choice: 字義的で解釈を限定しない表現を本文に置く
  alternative: 単に彼らを追い越そうとされた／神が通り過ぎて御自身を現す旧約の神顕現を意図された
  rationale: ギリシア語自体は目的を説明していないため、神顕現の可能性を脚注で示しつつ、本文では神学的な緊張と曖昧さを残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙事の自然さと原文の神学的含意の両方を保った。「第四の見張り時」は文化的異質性を残して脚注で説明し、「通り過ぎようとされた」は解釈を本文に織り込まず保持した。
