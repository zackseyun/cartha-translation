  text: ⸂περιέδραμον ὅλην τὴν χώραν ἐκείνην καὶ⸃ ἤρξαντο ἐπὶ τοῖς κραβάττοις τοὺς κακῶς ἔχοντας περιφέρειν ὅπου ἤκουον ⸀ὅτι ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: ja
  text: 彼らはその地方一帯を駆け回り、イエスがおられると聞いた所へ、病人たちを寝床[a]に載せて運び始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「敷物」「簡素な寝台」。ギリシア語は、持ち運べる簡素な寝具を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: 駆け回り
  rationale: 地域全体を急いで動き回るという複合動詞の意味を、自然な現代日本語で表す。
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: その地方一帯
  rationale: χώραを現代的な国家ではなく周辺地域として捉え、ὅληνの全域性も「一帯」で示す。
- source_word: ἤρξαντο ... περιφέρειν
  choice: 運び始めた
  rationale: ἤρξαντοの開始の意味を保ちつつ、病人を各所から移動させる具体的な動作を明瞭に表す。
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: 寝床に載せて
  rationale: κράβαττοςは持ち運べる簡素な寝具を指す。「寝床」は特定の形状に限定せず、現代の読者にも理解しやすい。
- source_word: τοὺς κακῶς ἔχοντας
  choice: 病人たち
  rationale: 「具合の悪い者たち」という慣用表現を、簡潔で自然な日本語にする。
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: イエスがおられると聞いた所へ
  rationale: 文脈上の省略された主語を「イエス」と明示し、ὅπουがここでは移動先を表すことを「所へ」で示す。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、「駆け回り」によって人々の切迫した動きを保った。「彼ら」は直前の文脈にいる人々を受け、「イエス」は日本語で主語が曖昧にならないよう文脈上の指示対象を明示した。
