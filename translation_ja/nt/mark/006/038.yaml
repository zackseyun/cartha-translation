base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたはパンをいくつ持っていますか。行って、見てきなさい。」彼らは確かめて言った。「五つです。それに、魚二匹です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: パン
  rationale: 文脈上、数えて分けられるパンを指す。「パン」は現代日本語で自然であり、具体的な形状を本文以上に限定しない。
- source_word: ὑπάγετε ἴδετε
  choice: 行って、見てきなさい
  rationale: 二つの命令の動きを保ちつつ、実際に確認して戻るという文脈を自然な日本語で表す。
- source_word: γνόντες
  choice: 確かめて
  rationale: 単に目で見るだけでなく、調べて数量を把握したことを簡潔に表す。
- source_word: ἰχθύας
  choice: 魚
  rationale: 一般的な「魚」を意味し、種類や調理状態を原文以上に特定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語。イエスへの敬意を自然に示すため「言われた」を用い、弟子たちの返答は日本語の会話として自然になるよう「五つです。それに、魚が二匹あります」とした。原文の歴史的現在は、物語叙述として自然な過去形で訳した。
