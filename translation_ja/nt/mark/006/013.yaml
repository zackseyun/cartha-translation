id: MRK.6.13
reference: Mark 6:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: ja
  text: そして、多くの悪霊を追い出し、多くの病人に油を塗って、癒やしていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαιμόνια πολλὰ
  choice: 多くの悪霊
  rationale: δαιμόνιονを直接的で現代日本語として自然な「悪霊」とし、πολλάの数量的意味を「多くの」で保持した。「汚れた霊」は近接文脈の別表現を持ち込むため避けた。
- source_word: ἐξέβαλλον
  choice: 追い出し
  rationale: 悪霊を退去させる意味を自然に表す。未完了過去の継続・反復性は、文末の「癒やしていた」と連なる一連の行為として文全体で示した。
- source_word: ἤλειφον ἐλαίῳ
  choice: 油を塗って
  rationale: ἀλείφωの「塗る、油を塗る」という具体的動作を明瞭に表現した。ἔλαιονは当時通常オリーブ油を指し得るが、本文は種類を明示しないため「油」とした。
- source_word: πολλοὺς ἀρρώστους
  choice: 多くの病人
  rationale: 実体詞的なἄρρωστοςとπολλούςを、簡潔で自然な現代日本語にした。
- source_word: ἐθεράπευον
  choice: 癒やしていた
  rationale: θεραπεύωの治癒の意味と、未完了過去が示す継続的・反復的な活動を保持した。
- source_word: καὶ
  choice: そして／連用形による並列
  rationale: 反復するκαίの単純な並列関係を保持しつつ、日本語として過度に「そして」を重ねない自然な文に整えた。
theological_decisions:
- issue: 油を塗ることと癒やしとの関係
  choice: 歴史的に行われた二つの動作として記述し、油の働きの仕組みは規定しない。
  alternative: 油自体が癒やしをもたらしたと読む、または油は何の役割もない純粋な象徴だったと読む。
  rationale: 本文は弟子たちが病人に油を塗り、癒やしたと報告するが、その神学的機序や後代の儀礼的効力を説明していないため、解釈を付加せず叙述のまま残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「油を塗る」は具体的で一般読者に理解しやすい表現。「癒やしていた」によって、宣教旅行中に繰り返された行為という未完了過去のニュアンスを表した。
