base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: ja
  text: 皆がイエスを見て、取り乱したからである。だが、イエスはすぐに彼らに語りかけて言われた。「勇気を出しなさい。わたしだ。恐れてはならない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: 取り乱した
  rationale: 強い動揺や混乱を表す受動形を、文脈に即した自然な現代日本語で表した。
- source_word: Θαρσεῖτε
  choice: 勇気を出しなさい
  rationale: 恐怖の中にいる弟子たちへの励ましという命令の力を明確に保った。
- source_word: ἐγώ εἰμι
  choice: わたしはある
  rationale: 単なる自己同定としての「わたしだ」に限定せず、ギリシア語の明示的な表現と、その神学的含意の可能性を保持した。
- source_word: μὴ φοβεῖσθε
  choice: 恐れてはならない
  rationale: 現在命令形による恐れをやめるよう促す言葉を、簡潔で品位ある日本語にした。
theological_decisions:
- issue: ἐγώ εἰμι の解釈
  choice: わたしはある
  alternative: わたしだ
  rationale: この句は文脈上の自己同定とも読める一方、神的自己啓示を響かせる可能性もある。訳文で一方に確定せず、原文の神学的緊張を残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言は簡潔で荘重な調子とした。「わたしはある」は通常の会話表現としては異質だが、原文の曖昧さと神学的含意を保持するため意図的に採用した。
