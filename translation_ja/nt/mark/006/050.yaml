    rationale: ἐγώ εἰμιは字義上「私は～である／私はある」と対応し得るが、補語なしのこの用法は文脈上「わたしだ」「私だ」という自己同定として自然に機能する。日本語の「わたしはある」は存在論的な意味を前景化しており、原文がこの文脈で必ずしも確定しない神学的解釈を本文に固定しかねない。
  revised_text: 皆がイエスを見て、取り乱したからである。だが、イエスはすぐに彼らに語りかけて言われた。「勇気を出しなさい。わたしだ。恐れてはならない。」
  revised_footnotes:
