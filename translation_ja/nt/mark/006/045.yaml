source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: ja
  text: すぐに、イエスは弟子たちに舟に乗って、向こう岸、ベトサイダの方へ先に行くよう強いた。その間に、ご自身で群衆を解散させた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐ
  rationale: マルコに特徴的な物語の速度感を、自然な現代日本語で表す。
- source_word: ἠνάγκασεν
  choice: 行かせた
  rationale: 文脈上、イエスが弟子たちに強くそうさせたことを示す。日本語では使役表現が自然だが、原語の強制性がやや薄くなるため、必要なら「無理に行かせた」も考えられる。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 弟子たち
  rationale: 福音書における定着した訳語で、師弟関係を明確に表す。所有代名詞は文脈上イエスの弟子であることが明白なので省略した。
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: 舟に乗せ
  rationale: 舟の中へ入る動作を、簡潔で自然な日本語にした。
- source_word: προάγειν
  choice: 先に行かせた
  rationale: イエスより先行するという関係的意味を明示する。
- source_word: εἰς τὸ πέραν πρὸς Βηθσαϊδάν
  choice: 向こう岸のベトサイダの方へ
  rationale: εἰς τὸ πέρανを「向こう岸」、πρόςを方向性のある「方へ」とし、到着を断定しない原文のニュアンスを保つ。
- source_word: ἕως
  choice: その間に
  rationale: 直訳的な「まで」では日本語の時制関係が不自然になりやすいため、弟子たちの先行とイエスの群衆解散が対応する時間関係を自然に表した。
- source_word: αὐτὸς
  choice: ご自分で
  rationale: 明示された代名詞の強調を保ち、イエス自身が群衆への対応を担うことを示す。
- source_word: ἀπολύει
  choice: 解散させようとされた
  rationale: 現在形を伴うἕως節を、主動詞との時間関係に即して日本語化した。「群衆を解散させる」は文脈に自然である。
- source_word: τὸν ὄχλον
  choice: 群衆
  rationale: 福音書の叙述で自然かつ一般的な現代日本語。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、聖書本文として品位のある叙述。「イエス」はギリシア語本文の主語が省略されているものの、直前の文脈から明白なため、日本語で主語を補った。
