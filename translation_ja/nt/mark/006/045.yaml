  naturalness: 修正文は明瞭な現代標準日本語であり、「向こう岸、ベトサイダの方へ」は目的地を過度に確定せず、εἰς τὸ πέρανとπρὸς Βηθσαϊδάνの両方を自然に反映する。
  terminology: 「弟子たち」「舟」「群衆」は福音書本文として定着し、現代語としても自然である。「ご自身で」はαὐτόςの強調を保つ。
