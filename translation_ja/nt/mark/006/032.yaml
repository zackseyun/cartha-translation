  text: καὶ ἀπῆλθον ⸂ἐν τῷ πλοίῳ εἰς ἔρημον τόπον⸃ κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: ja
  text: そして彼らは、舟に乗って、人里離れた場所へ[a]、自分たちだけで向かった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人けのない場所へ」または「荒野へ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「人目を避けて」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: マルコの叙述をつなぐ単純な接続を、自然な現代日本語で表す。因果関係を付加しない。
- source_word: ἀπῆλθον
  choice: 向かった
  rationale: 直前の場所を離れて目的地へ移動したことを、行き先を示す εἰς と自然に結び付けて表す。
- source_word: ἐν τῷ πλοίῳ
  choice: 舟に乗り
  rationale: ガリラヤ湖で用いられる舟を指す表現として「舟」を採り、移動手段として自然な日本語にした。
- source_word: εἰς ἔρημον τόπον
  choice: 人里離れた場所へ
  rationale: ἔρημος τόπος の中心的な意味である、人の住まない、または人けのない場所を表す。「荒野」として特定の地形に限定しない。
- source_word: κατ’ ἰδίαν
  choice: 自分たちだけで
  rationale: 複数の主語が他の人々から離れて行動する意味を明示し、「ひそかに」という意図までは加えない。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準語。「一行」はギリシア語の複数動詞が指すイエスと弟子たちを日本語で滑らかに受ける表現であり、固有の神学的解釈は加えていない。脚注標識は該当表現の直後ではなく節末にまとめ、本文の可読性を保った。
