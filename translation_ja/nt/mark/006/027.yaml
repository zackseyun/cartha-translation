  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: ja
  text: すると、王はただちに護衛兵[a]を遣わし、ヨハネの首を持って来るよう命じた。護衛兵は行って、牢の中でヨハネの首をはねた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「処刑人」とも訳せる。ギリシア語はラテン語に由来する語で、支配者の護衛に属する兵士を指し、この文脈では処刑を執行している。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な迅速さを、自然な現代日本語で明確に表す。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 歴史上の称号に合わせて修正せず、本文が用いる βασιλεύς という物語上の呼称を保持する。
- source_word: σπεκουλάτορα
  choice: 親衛兵
  rationale: 支配者の護衛に属する者を指すラテン語由来の語であり、この場面では処刑を執行する。役職そのものを訳文に置き、文脈上の役割は脚注で明示する。
- source_word: ἐπέταξεν ἐνέγκαι
  choice: 持って来るよう命じた
  rationale: 命令の強さと不定詞構文の関係を、明瞭で自然な日本語にする。
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: ヨハネの首
  rationale: 代名詞の指示対象を日本語で明確にする。κεφαλή はこの文脈では『首』が自然である。
- source_word: ἀπεκεφάλισεν
  choice: 首をはねた
  rationale: 斬首を表す動詞を、明快で過度に専門的でない日本語で訳す。
- source_word: ἐν τῇ φυλακῇ
  choice: 牢獄の中で
  rationale: 既に定まった拘禁場所を具体的に示すギリシア語の表現を保持する。
