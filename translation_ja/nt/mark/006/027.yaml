  - severity: low
    issue: 「するとすぐに」「牢獄の中で」は少し不自然または冗長に響く。
    rationale: 前者は接続表現と即時性表現が密着し、後者は「牢獄」と「中」が重なる。句読点と「ただちに」「牢」の採用で、意味を変えずに現代日本語として整えられる。
