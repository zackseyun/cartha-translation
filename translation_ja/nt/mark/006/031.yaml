  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「あなたがたは、自分たちだけで人里離れた所へ行き、少し休みなさい。」来る人も行く人も多く、彼らには食事をする暇さえなかったからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食事をする機会さえなかった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として自然な過去形にした。主語は文脈上イエスなので明示した。
- source_word: Δεῦτε
  choice: 行き
  rationale: 話し手と弟子たちが群衆から離れて別の場所へ移るよう促す招きであり、日本語では後続する目的地と合わせて「行き」が自然である。
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: あなたがたは、自分たちだけで
  rationale: 強意代名詞と「別に、ひそかに」の句を重ねた原文の強調を、弟子たちだけで離れるという意味が伝わる形で表した。
- source_word: ἔρημον τόπον
  choice: 人里離れた所
  rationale: 必ずしも砂漠ではなく、人の住まない、または人けのない場所を指すため、現代日本語で誤解の少ない表現を選んだ。
- source_word: ἀναπαύσασθε ὀλίγον
  choice: 少し休みなさい
  rationale: 働きをやめて短い間休息するよう命じる意味を、簡潔で自然な日本語にした。
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: 出入りする人が多く
  rationale: 継続的に人々がやって来ては去る状況を、日本語で簡潔に表した。
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: 食事をする暇さえなかった
  rationale: εὐκαιρέωの「機会・余裕がある」という意味と、οὐδέの「さえ」を自然に表した。「暇」は単なる時計上の時間だけでなく、食べる余裕がないことを示す。
