source:
  edition: SBLGNT
  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: ja
  text: 彼女は外に出て、母親に言った。「何を願いましょうか。」母親は言った。「洗礼を授けるヨハネの首を。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: 外に出て
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、自然な日本語の連用形で「外に出た後、言った」という順序を表した。
- source_word: Τί αἰτήσωμαι
  choice: 何を願いましょうか
  rationale: 審議的なアオリスト中動態接続法のニュアンスを、母に尋ねる自然で簡潔な問いとして表した。「求めましょうか」より、この場面で王に願い出る内容に適する。
- source_word: μητρὶ αὐτῆς
  choice: 母親に
  rationale: 日本語では主語がすでに明らかなため、所有代名詞を明示せずとも「彼女の母親」の意味が自然に伝わる。
- source_word: κεφαλήν
  choice: 首
  rationale: 切り取られた人の head を求める文脈では、日本語の慣用として「首」が最も自然かつ具体的であり、残酷さを婉曲化しない。
- source_word: τοῦ βαπτίζοντος
  choice: 洗礼を授ける
  rationale: 実体詞的な現在分詞を、ヨハネをその特徴的な働きによって特定する表現として意味に即して訳した。教派名を連想させうる表現を避けた。
theological_decisions:
- issue: ヨハネの呼称 βαπτίζων の訳し方
  choice: 洗礼を授けるヨハネ
  alternative: バプテスマのヨハネ／洗礼者ヨハネ
  rationale: 分詞が表す活動をそのまま明確にし、後代の教派名との不要な連想を避けた。「洗礼者ヨハネ」は簡潔だが、現代の日常語としてはやや称号的・文語的である。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。原文の短く直接的な対話と、依頼内容の衝撃を保った。
