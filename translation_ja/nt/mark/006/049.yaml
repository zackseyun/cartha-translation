  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: ja
  text: しかし弟子たちは、イエスが海の上を歩いているのを見て、幽霊[a]だと思い、叫び声を上げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幻影」または「亡霊」。ギリシア語は幽霊のように現れるものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: しかし弟子たちは
  rationale: δέの穏やかな逆接を「しかし」で表し、実質的に用いられた冠詞が指す直前の弟子たちを明示した。
- source_word: ἰδόντες αὐτὸν
  choice: イエスが…のを見て
  rationale: アオリスト分詞の時間的関係を自然な日本語で表した。代名詞の指示対象は文脈上イエスなので固有名で明示した。
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: 湖の上を歩いておられる
  rationale: ἐπί＋属格を水面上の動作として訳した。θάλασσαはこの文脈ではガリラヤ湖を指すため、現代日本語で自然な「湖」とした。敬意を含む自然な叙述として「歩いておられる」を用いた。
- source_word: ἔδοξαν ὅτι φάντασμά ἐστιν
  choice: 幽霊だと思い
  rationale: δοκέωの誤認を「思う」で表し、φάντασμαは一般読者に最も明瞭な「幽霊」とした。ギリシア語の間接話法の現在形は、日本語では時制を過度に固定せず「だ」と自然に表せる。
- source_word: καὶ ἀνέκραξαν
  choice: 叫び声を上げた
  rationale: ἀνακράζωの大声で叫ぶ意味を保ちつつ、恐怖の具体的な声色までは訳文に加えなかった。
theological_decisions:
- issue: 水上でのイエスの動作
  choice: 湖の上を歩いておられる
  alternative: 湖のほとりを歩いておられる
  rationale: 物語の状況とἐπὶ τῆς θαλάσσηςの自然な意味から、水面上を歩くことを指す。奇跡性を弱めたり、逆に原文以上に説明したりしない。
- issue: φάντασμαの性質
  choice: 幽霊
  alternative: 幻影／亡霊
  rationale: 原語は幽霊のような出現・幻影を指し、その実体について厳密な分類をしていない。本文には明瞭な「幽霊」を置き、脚注で語義の幅を保った。
translation_notes:
  register: 明快で現代的な標準日本語を用い、物語文として自然でありながら品位を保った。「海」も形式上可能だが、日本語では地理的対象に即した「湖」が明瞭。脚注記号[a]は該当語の直後に置いた。
