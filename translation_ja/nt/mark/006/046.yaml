id: MRK.6.46
reference: Mark 6:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: ja
  text: そして、彼らに別れを告げてから[a]、イエスは祈るために山へ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らに暇を告げてから」。
    reason: ἀποταξάμενος は、別れの挨拶をすること、またはその場を辞する旨を告げることを表しうる。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 物語の流れを自然につなぐ単純な接続として訳した。「すると」ほど強い時間的含意を加えない。
- source_word: ἀποταξάμενος αὐτοῖς
  choice: 彼らに別れを告げてから
  rationale: 中動態の分詞は、ここでは人々に別れを告げる、または暇を告げる意味。与格の αὐτοῖς を「彼らに」と明示し、先行動作であることを「てから」で表した。
- source_word: ἀπῆλθεν
  choice: 行った
  rationale: その場を離れて目的地へ向かったことを、現代日本語として自然に表した。前の句ですでに別離が示されるため、「立ち去った」と重ねる必要はない。
- source_word: εἰς τὸ ὄρος
  choice: 山へ
  rationale: ὄρος の基本的な意味を採用した。ギリシア語の定冠詞は、日本語では文脈上特定された場所として自然に理解できるため、余分な限定語を加えない。
- source_word: προσεύξασθαι
  choice: 祈るために
  rationale: 移動の目的を示す不定詞として、その目的関係を明確かつ自然に訳した。
theological_decisions:
- issue: 「山」の指示と意味
  choice: 象徴的説明を加えず、単に「山」と訳す。
  alternative: 「ある山」と一般化する、または特別な啓示の場所として解釈を加える。
  rationale: 本文は具体的な場所を指しているが、その象徴的・神学的意味を説明してはいない。日本語で不自然な定性表示を加えず、物語上の具体性を保った。
- issue: 省略された主語
  choice: 文脈上の主語を「イエス」と明示する。
  alternative: 主語を省略して「祈るために山へ行った」とする。
  rationale: ギリシア語では動詞に主語が含まれるが、独立した節として読む日本語では明示したほうが分かりやすい。これは新たな解釈ではなく、文脈上明白な主語の補充である。
translation_notes:
  register: 明快な現代標準語を用い、簡潔な物語調にした。イエスへの敬語表現は本文の文法に含まれないため用いず、神学的・教派的含意を加えていない。
