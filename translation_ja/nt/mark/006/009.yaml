    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ただし
  rationale: 直前の旅支度に関する禁止と対照をなし、ここでは許される履物を示すため、自然な逆接・限定表現とした。
- source_word: ὑποδεδεμένους
  choice: 履き
  rationale: ὑποδέομαιの完了分詞で、サンダルを足に着けた状態を表す。日本語では「サンダルは履き」が簡潔で自然であり、文脈上の命令的な働きも伝わる。
- source_word: σανδάλια
  choice: サンダル
  rationale: 当時の履物を指す語の標準的で分かりやすい訳語。
- source_word: μὴ ἐνδύσησθε
  choice: 着てはならない
  rationale: μήを伴うアオリスト中態接続法による禁止。「身に着けてはならない」の意味を自然な現代日本語で表した。動作に焦点を当てれば「着込んではならない」とも表せる。
- source_word: δύο
  choice: 二枚
  rationale: 衣類を数える日本語として、単純な数詞「二」を助数詞とともに明示した。
- source_word: χιτῶνας
  choice: 肌着
  rationale: χιτώνは体に直接着る基本的な衣を指す。「シャツ」は時代錯誤になりやすく、「衣」だけでは広すぎるため、現代の読者に機能が伝わる「肌着」を選んだ。
