  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: ja
  text: 多くの人が彼らが行くのを見て、彼らだと分かった。そして、人々はあらゆる町[b]から歩いて[a]そこへ駆け集まり、彼らより先に着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「歩いて」は「陸路で」とも訳せる。舟で進む彼らとの対照が示されている。
    reason: lexical_alternative
  - marker: b
    text: 「町」は「町々」または「都市」とも訳せる。原語は文脈によって町にも都市にも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 見て
  rationale: 物語の流れに沿って、視覚的に目にしたことを簡潔に表す。
- source_word: ὑπάγοντας
  choice: 出て行くのを
  rationale: 直前の文脈にある舟での移動を繰り返さず、ある場所から去って行く動きを自然な日本語で示す。
- source_word: ἐπέγνωσαν
  choice: それと気づいた
  rationale: 彼らが誰であるか、またはその動きを見分けたという文脈上の意味を保ちつつ、目的語が明示されない原文の曖昧さを残す。
- source_word: πολλοί
  choice: 多くの人
  rationale: 名詞的に用いられた形容詞を、現代日本語で明瞭に表す。
- source_word: πεζῇ
  choice: 歩いて
  rationale: 舟での移動との対照を自然に示す。「陸路で」という広めの意味も可能なため脚注に示す。
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: あらゆる町から
  rationale: πᾶςの包括性を保ち、ガリラヤ地方の文脈に適した「町」を採用する。「町々から」も自然だが、原文の「すべて」をより明示した。
- source_word: συνέδραμον
  choice: 駆け集まり
  rationale: 走る動作と、各地から一か所へ集まる複合語の含意を一語で自然に表す。
- source_word: ἐκεῖ
  choice: そこへ
  rationale: 移動の到達点を示すため、日本語では方向を表す助詞「へ」を添える。
- source_word: προῆλθον αὐτούς
  choice: 彼らより先に着いた
  rationale: この文脈での『先行する』を到着順として明瞭にし、比較対象のαὐτούςを「彼ら」と訳す。
