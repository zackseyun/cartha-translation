translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ところが」で、静かな場所へ退こうとした直前の意図との対照を表した。脚注記号は対応箇所が分かるよう、文末にまとめず「歩いて[a]」「町[b]」の直後に置くのが望ましい。
