  text: καὶ ἦραν ⸂κλάσματα δώδεκα κοφίνων πληρώματα⸃ καὶ ἀπὸ τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/043.yaml
  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: ja
  text: そして彼らは、パンのかけらを十二かごいっぱいと、魚の分も拾い集めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には、「パンのかけらを、十二のかごの満ちた分と、魚からの分も」。ギリシア語は「かけら」「十二のかご」「満たされた量（中身）」を組み合わせ、末尾に「魚からの分も」と付け加えている。
    reason: 「十二かごいっぱい」の表現がもつ構造と、「魚の分も」という原文の省略的・部分的な付加を示すため。
lexical_decisions:
- source_word: ἦραν
  choice: 拾い集めた
  rationale: 食事の後に残ったものを回収する場面なので、αἴρωの具体的な動作を現代日本語で自然に表した。後半にも動詞を補い、魚についても同じ収集動作が及ぶことを明確にした。
- source_word: κλάσματα
  choice: パンのかけら
  rationale: κλάσμαは「割られた一片、かけら」を意味する。直前の文脈でパンを指すことが明らかなため、日本語では「パン」を補って対象を自然に示した。
- source_word: δώδεκα κοφίνων πληρώματα
  choice: 十二のかごいっぱいに
  rationale: 「十二」「かご」「満たす量・中身」を組み合わせたギリシア語表現を、十二個のかごが満ちる量だったという意味が伝わる自然な日本語にした。
- source_word: κόφινος
  choice: かご
  rationale: 容器の種類や大きさを本文以上に限定せず、一般読者に明瞭な語を選んだ。
- source_word: πληρώματα
  choice: いっぱいに
  rationale: かごを満たす量、または満杯の中身という意味を、収集の結果として自然に表現した。
- source_word: ἀπὸ τῶν ἰχθύων
  choice: 魚の残りも
  rationale: ἀπόの出所・部分を表す用法を、食後に魚から残った部分も回収したという文脈に即して表した。「も」によりパンだけでなく魚にも及ぶことを示した。
theological_decisions: []
translation_notes:
  register: 明瞭で落ち着いた現代標準語。原文の反復省略は、日本語で意味が曖昧にならないよう後半に「拾い集めた」を補った。
