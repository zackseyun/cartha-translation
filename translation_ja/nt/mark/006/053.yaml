base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: ja
  text: そして彼らは湖を渡り、ゲネサレの地に着き[a]、舟を岸につないだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「陸地に来て」。舟で渡ったのち陸に着いたことを指す。
    reason: lexical_alternative
  - marker: b
    text: または「舟を停泊させた」「上陸した」。原語は、舟を岸に寄せて係留することを表す航海用語。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: こうして
  rationale: 物語の流れを自然につなぐ接続表現。単なる「そして」より、直前の湖上の出来事から次の場面への移行を明瞭にするが、新たな因果関係は加えない。
- source_word: διαπεράσαντες
  choice: 湖を渡り
  rationale: アオリスト分詞が主動詞に先立つ行為を表す。目的語の「湖」は文脈から補い、現代日本語で自然な航行表現とした。
- source_word: ἐπὶ τὴν γῆν ἦλθον εἰς Γεννησαρὲτ
  choice: 陸地に着いて、ゲネサレに入り
  rationale: γῆの基本的な「陸地」を保ちつつ、ἦλθονの到着とεἰς Γεννησαρέτの方向・到達を日本語として整理した。写本上注意される語順を過度に解釈せず、ゲネサレを到着地域として示す。
- source_word: Γεννησαρὲτ
  choice: ゲネサレ
  rationale: 地名を現代日本語で一般的な聖書表記に従って音写した。
- source_word: προσωρμίσθησαν
  choice: 舟を岸につないだ
  rationale: 舟を岸へ寄せて係留するという航海上の意味を、普通の読者に分かりやすい能動的な日本語で表した。文法上は受動形だが、ギリシア語では一行が舟を係留したという意味になる。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、簡潔で品位ある物語調とした。「一行」と「湖」は文脈上の補足。「舟を岸につないだ」は専門的な「係留した」より理解しやすく、原語の航海的な含意も保持する。すべての脚注標識を本文に明示した。
