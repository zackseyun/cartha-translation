  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: ja
  text: そして、好都合な日が来た[a]。すなわち、ヘロデが自分の誕生日に、高官たち、軍の司令官たち、またガリラヤの有力者たちのために宴会を催した日である[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「折よい日が来た」「好機の日が訪れた」。ギリシャ語は、都合のよい、あるいは機会にかなった日を意味する。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「ヘロデが自分の誕生日に……夕食を設けた時」。ここでは正式な宴会を催したという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ところが
  rationale: 物語の接続を保ちつつ、直前まで機会をうかがっていたヘロディアとの関係を自然に示す。単なる順接の「そして」より、この場面の転換に適する。
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: 好都合な日が来た
  rationale: 属格独立構文を状況設定として訳した。εὔκαιροςは「都合がよい」「機会にかなう」の意で、待ち望んだ機会が到来したという不穏な含みを保つ。誰にとって好都合かは本文が明示しないため補わない。
- source_word: ὅτε
  choice: 日である
  rationale: その『好都合な日』がどのような日だったかを後続文で特定する関係を、日本語で重い「その時」の反復を避けて表した。
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: 自分の誕生日に
  rationale: γενέσιαは誕生日の祝い・行事を指す。現代日本語で自然かつ簡潔に訳した。
- source_word: δεῖπνον ἐποίησεν
  choice: 宴会を催した
  rationale: 字義的には『夕食を作った』だが、主催して正式な食事会を開く慣用表現なので、列挙される高位の客にも合う「宴会を催した」とした。
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: 重臣たち
  rationale: μεγιστᾶνεςは支配者の周囲にいる高位者・有力者を指す。ヘロデ配下の高官という関係を簡潔に示す。
- source_word: τοῖς χιλιάρχοις
  choice: 軍の司令官たち
  rationale: 字義的な『千人隊長』に限定せず、高位の軍指揮官という機能を明瞭に表す。
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: ガリラヤの有力者たち
  rationale: πρῶτοιは地域の第一級の人々、すなわち社会的に有力な者を指す。自然な現代日本語とした。
- source_word: Ἡρῴδης
  choice: ヘロデ
  rationale: 日本語聖書で定着した人名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。マルコの物語的な転換と、ヘロディアにとって機会が到来したという不穏な含みを維持した。原文末尾の継続的な読点は、日本語では節内で完結する二文に整えた。
