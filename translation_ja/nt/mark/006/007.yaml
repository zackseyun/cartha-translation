  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: ja
  text: イエスは十二人を呼び寄せ、二人ずつ[a]遣わし始め、彼らに汚れた霊に対する権威[b]を与えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人一組で」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「汚れた霊に対する力」。
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: 呼び寄せ
  rationale: 中動態が含みうる「自分のもとに呼ぶ」という方向性を自然な日本語で表した。マルコ特有の歴史的現在は、後続の過去時制との滑らかなつながりを優先し、文全体を過去の叙述として訳した。
- source_word: τοὺς δώδεκα
  choice: 十二人
  rationale: 文脈上、イエスが選んだ特定の十二人を指す。日本語では「十二人」が簡潔で自然であり、称号性は定冠詞に相当する文脈によって保たれる。
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: 遣わし始め
  rationale: 開始を示す構文をそのまま保ち、使命を帯びて送り出す意味に適した「遣わす」を用いた。
- source_word: δύο δύο
  choice: 二人ずつ
  rationale: 反復による分配の意味を、自然で明瞭な日本語で表した。
- source_word: ἐδίδου
  choice: 授けておられた
  rationale: 未完了過去の継続的・同時進行的な側面を「ておられた」で表した。敬語は日本語聖書の品位を保ちつつ、過度に古風にならない形とした。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる能力や力ではなく、行使を認められた権限という意味を保つため「権威」とした。
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: 汚れた霊
  rationale: マルコの用語を解釈的に「悪霊」へ狭めず、原文の表現を保った。
theological_decisions:
- issue: ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων が示す授与の性質
  choice: 汚れた霊を制する権威
  alternative: 汚れた霊に対する力
  rationale: ἐξουσίαは生の能力だけでなく、委ねられた権限を表しうるため「権威」とした。「制する」は属格が示す支配・対抗の関係を日本語で明確にするが、具体的な行為を追補しすぎない表現である。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある叙述とした。歴史的現在は日本語で不自然な時制転換を避けるため過去として整えた。「遣わす」「汚れた霊」「権威」は原文の宣教的・霊的語彙を保つ。
