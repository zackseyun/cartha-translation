source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: ja
  text: というのも、ヨハネはヘロデに、「あなたが自分の兄弟の妻を自分の妻にしていることは、あなたには許されない[a]」と言い続けていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたが自分の兄弟の妻を自分の妻にしていることは、あなたには適法ではない」。
    reason: 原語は「許されている」「適法である」を表す語であり、文脈上はその否定として婚姻関係の禁止を述べる。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言い続けていた
  rationale: 未完了時制が表す、過去における継続的または反復的な発言を自然な日本語で示す。
- source_word: γὰρ
  choice: というのも……からである
  rationale: 前文の事情を説明する接続関係を明確にしつつ、日本語として自然な説明構文にした。
- source_word: Ἡρῴδῃ
  choice: ヘロデに
  rationale: 人名の標準的な日本語表記を用い、与格を発言の相手として訳した。
- source_word: Οὐκ ἔξεστίν σοι
  choice: あなたが……ことは、律法で許されていない
  rationale: 許可・適法性を表す表現であり、この文脈では道徳的・法的な禁止を示す。背景にある律法上の力を伝えつつ、具体的な律法条文までは補わない。
- source_word: ἔχειν
  choice: 自分のものとしている
  rationale: 字義は「持つ」だが、婚姻関係について日本語で単に「妻を持つ」とすると不自然になりやすい。「自分のものとしている」は現在の関係を表し、原文の非婉曲的な告発の響きも保つ。
- source_word: γυναῖκα
  choice: 妻
  rationale: 「女」と「妻」の両義があるが、「兄弟の」という属格によって婚姻上の意味が明白である。
- source_word: τοῦ ἀδελφοῦ σου
  choice: 自分の兄弟の
  rationale: 二人称所有を、主語「あなた」と同一指示であることが自然に伝わる再帰表現にした。ἀδελφός自体は兄か弟かを特定しないため「兄弟」とした。
theological_decisions:
- issue: ヨハネの非難の法的・道徳的性格
  choice: 「律法で許されていない」
  alternative: 「許されていない」または「正しくない」
  rationale: ἔξεστινの許可・適法性の意味と、レビ記の婚姻規定を背景とする可能性を反映する。「正しくない」ほど弱めず、どの条文かを本文に付加することもしない。
- issue: ἀδελφόςの年長・年少
  choice: 「兄弟」
  alternative: 「兄」または「弟」
  rationale: 原文は年長・年少を明示しないため、日本語訳でも曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ威厳のある文体。「というのも……からである」で説明関係を示し、「言い続けていた」で未完了時制を反映した。「兄弟」として原文が特定しない兄・弟の別を保持した。
