  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: ja
  text: なぜなら、彼らはパンについて理解しておらず[b]、しかし彼らの心はかたくなになっていた[a]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの心が鈍くなっていた」。原語には、硬くなって感覚を失うという比喩がある。
    reason: lexical_alternative
  - marker: b
    text: または「彼らは、パンが意味することを悟っていなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ συνῆκαν
  choice: それは、…理解しておらず…からである
  rationale: γάρの説明的な働きを日本語の「それは…からである」で明確にし、συνίημιは認識と意味の把握の双方を含みうる「理解する」とした。
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: あのパンのことを
  rationale: 直前の給食の出来事で用いられた特定のパンを「あのパン」で指し示し、ἐπί＋与格の「…について」という関係を自然な日本語で表した。パンが持つ意味を理解できなかったという含みは脚注で示した。
- source_word: αὐτῶν ἡ καρδία
  choice: 彼らの心
  rationale: ギリシア語の単数形の集合的表現を保ちつつ、日本語として自然な「彼らの心」とした。καρδίαは理解や態度を含む内面全体を指す。
- source_word: πεπωρωμένη
  choice: かたくなになっていた
  rationale: πωρόωの硬化の比喩と霊的な無感覚を保つため、聖書文脈でも理解しやすい表現を選んだ。完了受動分詞と未完了過去ἦνが示す継続した状態を「なっていた」で表した。
- source_word: ἀλλ’ ἦν
  choice: …なっていた
  rationale: ἀλλάの対照は、日本語では前節の否定的な並列「理解しておらず」と後節の説明によって自然に伝わるため、硬い「しかし」は置かなかった。ἦνの過去の継続状態は「いた」で示した。
theological_decisions:
- issue: πεπωρωμένηが表す弟子たちの状態とその原因
  choice: 彼らの心がかたくなになっていた
  alternative: 彼らの心が鈍くなっていた／たこができたようになっていた
  rationale: 本文は弟子たちの霊的・認識的な無感覚を述べるが、誰がその状態を引き起こしたかは明示しない。受動形を原因の特定に利用せず、原文の神学的緊張を残した。
- issue: 単数形καρδίαの集合性
  choice: 彼らの心
  alternative: 彼らの心々／彼ら一人一人の心
  rationale: 原文の単数形を反映し、弟子たちに共通する内面の状態として表した。「一人一人」は原文以上の明示となるため避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。直前の文脈への応答として「あのパン」を用い、説明的なγάρは「それは…からである」で自然に接続した。脚注記号は該当語句の直後に配置した。
