source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: ja
  text: というのも、ヘロデ自身が人を遣わしてヨハネを捕らえ、牢に入れ、縛ったのである。それは、彼が自分の兄弟フィリポの妻であるヘロディアと結婚したためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: 実は、ヘロデ自身が
  rationale: γάρは直前の叙述を説明する働きがあるため、現代日本語の物語として自然な「実は」で表した。αὐτόςの強調は「自身」で保持した。
- source_word: ἀποστείλας ἐκράτησεν
  choice: 人を遣わして…捕らえ
  rationale: ἀποστείλαςには明示された目的語がないが、支配者ヘロデが配下を遣わして逮捕させたという使役的な行為主体性を、日本語で誤解なく表した。
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: 牢につないでいた
  rationale: δέωの具体的な「縛る、つなぐ」を保ちつつ、φυλακήを自然な「牢」とした。過去の措置が物語時点で継続していたことも日本語の「ていた」で示した。
- source_word: διὰ Ἡρῳδιάδα
  choice: ヘロディアを…ため
  rationale: διά＋対格の原因・理由を、後続のὅτι節と合わせて日本語の因果表現に組み替えた。
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: 自分の兄弟フィリポの妻ヘロディア
  rationale: γυνήを文脈どおり「妻」とし、αὐτοῦがヘロデを指すことを明瞭にするため「自分の兄弟」とした。
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: （ヘロディアを）めとったためである
  rationale: γαμέωの婚姻の意味を、文脈に合う簡潔で品位ある日本語「めとる」で表した。ギリシア語のアオリストを過度に時制化せず、投獄の理由として提示した。
theological_decisions:
- issue: ヘロデの婚姻に対する道徳的評価
  choice: この節では婚姻と投獄の因果関係だけを記し、違法・不倫などの評価語を加えない
  alternative: 「不法に妻とした」など、周辺文脈の評価を本文に織り込む
  rationale: この文自体はヘロデがヘロディアをめとったことを投獄の理由として叙述しており、その違法性は次節で明示されるため。
- issue: ヘロデが自ら逮捕したのか、配下にさせたのか
  choice: 「人を遣わして…捕らえ」とし、ヘロデを命令・実行の責任主体として表す
  alternative: 「遣わし、ヨハネを捕らえ」と形式的に並べ、実行者を曖昧に保つ
  rationale: ἀποστείλαςの目的語省略を日本語でそのまま再現すると不自然で、ヘロデ自身が出向いたとの誤解も生じる。王が人を遣わして拘束を実行したという語用論的含意を明確にした。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、聖書叙述にふさわしい品位を保った。「牢につなぐ」「めとる」はやや格調があるが、一般読者にも理解可能で、原文の具体性と簡潔さを保つ。
