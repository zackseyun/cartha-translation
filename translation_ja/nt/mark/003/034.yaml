  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: ja
  text: そして、イエスは自分の周りに輪になって座っている人々を見回して、言われた。「見なさい。わたしの母と兄弟たちです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「きょうだいたち」とも訳せる。ギリシア語は「兄弟たち」であるが、ここで指される周囲の人々には女性も含まれていた可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 見回して
  rationale: 周囲の人々へ意識的に視線を巡らせる動作を、自然な現代日本語で表す。アオリスト分詞の先行・付帯的な動作も保つ。
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: 自分の周りに輪になって座っている人々
  rationale: περὶ αὐτόν（自分の周りに）、κύκλῳ（輪になって／ぐるりと）、καθημένους（座っている）の空間的要素を明示する。
- source_word: λέγει
  choice: 言われた
  rationale: 原文はマルコ特有の歴史的現在だが、日本語では過去の物語として自然な「言われた」を用いる。敬意を示しつつ、過度に古風な文体を避ける。
- source_word: Ἴδε
  choice: 見なさい
  rationale: 注意を向けさせる指示語の力を保ち、「見よ」より現代的で明瞭な表現とする。
- source_word: μήτηρ
  choice: 母
  rationale: 標準的な語義をそのまま訳す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 文法的に男性複数形である原文を本文に保つ。周囲の集団に女性も含まれ得るため、より広い意味の可能性は脚注で示す。
theological_decisions:
- issue: 女性を含み得る弟子の集団に対する男性複数形 ἀδελφοί
  choice: 兄弟たち
  alternative: きょうだいたち
  rationale: 本文では原文の性を伴う親族語を保ちつつ、この場の集団全体を指して女性を含む可能性を脚注で明示し、意味を一方に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「見なさい」で Ἴδε の注意喚起を保ち、「ここに……がいる」によって眼前の人々を指し示す日本語として自然に表現した。脚注記号[a]は該当文末に置いた。
