  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: ja
  text: また、彼らが悪霊を追い出す[a]権威を持つようにするためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「追い払う」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 先行する任命の目的を示す不定詞句に、もう一つの目的を並列的に加える接続語として、現代日本語で自然な「また」とした。
- source_word: ἔχειν
  choice: 持たせる
  rationale: 原文は「持つこと」を表す不定詞だが、直前のイエスによる任命という統語的文脈を日本語で明確かつ自然に示すため、使役的な「持たせる」とした。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる能力や力ではなく、委ねられた権限を表す語であるため、「力」ではなく「権威」とした。
- source_word: ἐκβάλλειν
  choice: 追い出す
  rationale: 外へ放逐する意味を保ち、悪霊払いの文脈でも一般読者に明瞭な表現である。別訳「追放する」も可能。
- source_word: τὰ δαιμόνια
  choice: 悪霊
  rationale: δαιμόνιαを具体的に訳し、近接箇所の別表現「汚れた霊」を持ち込まず、現代日本語の聖書文体で通用する「悪霊」とした。
theological_decisions:
- issue: 弟子たちに与えられるἐξουσίαの性質
  choice: 権威
  alternative: 力
  rationale: イエスの任命によって委ねられる正当な権限という含意を保つ。「力」も可能だが、超自然的能力そのものに意味を狭めるおそれがある。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。単独節として提示されても意味が通るよう、直前の任命を受ける「ためであった」を補った。脚注記号は本文中に明示した。
