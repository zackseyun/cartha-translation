  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: ja
  text: また、もし一つの国が内部で分裂するなら、その国は立ち行かない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 直前から続く並行的な例を自然に結び、論証の継続を示す。
- source_word: ἐὰν
  choice: もし～なら
  rationale: 接続法を伴う条件を明確な現代日本語で表し、一般原則としての響きも保つ。
- source_word: βασιλεία
  choice: 国
  rationale: ここでは統治という抽象概念より、内部で分裂し得る共同体・領域としての王国を指す。日本語では「国」が自然で明瞭である。
- source_word: ἐφ’ ἑαυτὴν
  choice: 内輪で
  rationale: 自らに敵対する内部対立を日本語らしく表す。単なる区分ではなく、同じ国の内部での対立であることを示す。
- source_word: μερισθῇ
  choice: 分裂する
  rationale: 受動形の意味を日本語の自動詞で自然に表し、分裂を引き起こす主体は特定しない。
- source_word: οὐ δύναται
  choice: ～ない
  rationale: 後続の「立ち行く」と合わせ、「存続することができない」という不可能性を簡潔に示す。
- source_word: σταθῆναι
  choice: 立ち行く
  rationale: 「立つ」という比喩を背景に残しながら、国が存続できないという文脈上の意味を明瞭な現代日本語で表す。
- source_word: ἡ βασιλεία ἐκείνη
  choice: その国
  rationale: 名詞の反復と指示語によるギリシア語の強調を、自然な日本語で保持する。
theological_decisions:
- issue: この言葉の性格
  choice: イエスの反論の中で示される一般原則として訳し、本文以上の政治的・教理的主張を加えない。
  alternative: 広範な社会政治上の格言として意味を拡張する。
  rationale: この節は直前後の議論を支える類比であり、簡潔な格言性を保つ一方、適用範囲を訳文で広げるべきではない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「内輪で分裂する」は内部対立を自然に示し、「立ち行かない」は国が存続できないという意味と原文の「立つ」比喩の双方を伝える。
