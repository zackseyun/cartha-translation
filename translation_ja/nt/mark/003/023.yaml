  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: ja
  text: そして、イエスは彼らを呼び寄せ、たとえを用いて彼らに話された。「どうしてサタンがサタンを追い出せるだろうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: アオリスト中動態分詞が示す、彼らを自分のもとへ呼んだ上で語るという流れを、簡潔で自然な日本語で表した。
- source_word: ἐν παραβολαῖς
  choice: たとえを用いて
  rationale: 複数形は、ここから続く複数の比喩的な例や比較を含みうる。日本語では「たとえで」より「たとえを用いて」が明瞭で自然であり、文学形式を過度に限定しない。
- source_word: ἔλεγεν
  choice: 話された
  rationale: 未完了過去は継続的な発話を示しうるが、日本語の物語では単純な過去形が自然で、後続する談話の開始も十分に示せる。敬意を保つため尊敬表現とした。
- source_word: Πῶς δύναται
  choice: どうして…追い出せるだろうか
  rationale: 可能性を問う修辞疑問の力を自然な現代日本語で示し、不可能性を説明として付け加えずに保った。
- source_word: Σατανᾶς
  choice: サタン
  rationale: 固有名・称号として一般的な音写を用い、主格と対格を同じ表記で示した。
- source_word: ἐκβάλλειν
  choice: 追い出す
  rationale: マルコ福音書の悪霊追放の文脈に合う、明瞭で一般的な現代日本語。古風な「追放する」や硬い「排除する」を避けた。
theological_decisions:
- issue: サタンが自らに敵対して行動するという問いの力
  choice: 「どうしてサタンがサタンを追い出せるだろうか」と、不可能性を示唆する修辞疑問として訳す。
  alternative: 「サタンがサタンを追い出すことがどうしてできるのか」
  rationale: 原文は可能性を問うことで告発の矛盾を指摘している。本文には、その論理を説明する解釈や教理的結論を付加しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「そこで」は直前の告発を受けた展開を自然に示す。「話された」はイエスへの敬意を保ちつつ、過度に古風な文体を避ける。
