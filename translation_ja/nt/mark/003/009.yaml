  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: ja
  text: そこでイエスは弟子たちに、群衆に備えて小舟をイエスのために待機させておくよう言われた。群衆がイエスを押しつぶさないためである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「押し迫らないため」とも訳せる。ギリシア語の動詞は、圧迫する、押し迫る、押しつぶすという意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 言われた
  rationale: 弟子たちへの指示を表す文脈に合い、現代日本語として自然な敬意も保つ。
- source_word: μαθηταῖς
  choice: 弟子たち
  rationale: 福音書における教師に従う者という関係を明確に伝える標準的な訳語。
- source_word: πλοιάριον
  choice: 小舟
  rationale: 指小形の語感を簡潔かつ自然に反映する。
- source_word: προσκαρτερῇ αὐτῷ
  choice: 用意しておく
  rationale: イエスのために舟を継続して待機させ、すぐ使える状態にするという文脈上の意味を自然に表す。
- source_word: διὰ τὸν ὄχλον
  choice: 群衆のために
  rationale: διά＋対格の理由・原因を示す。「群衆のため」という日本語が目的にも読める可能性はあるが、直後の説明により原因の意味が明らかになる。
- source_word: θλίβωσιν
  choice: 押しつぶされない
  rationale: 群衆の圧力で圧迫されるという動詞の強さを保ちつつ、受動表現で自然な日本語にした。
