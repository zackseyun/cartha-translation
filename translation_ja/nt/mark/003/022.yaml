  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: ja
  text: エルサレムから下って来た律法学者たちは、こう言い続けていた。「彼はベルゼブル[b]に取りつかれている[a]。また、悪霊たちの支配者[c]の力で、悪霊たちを追い出している。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼はベルゼブルを持っている」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「ベルゼブル」。伝統的には「ベルゼブブ」とも訳される。
    reason: alternative_reading
  - marker: c
    text: または「悪霊たちの君主」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: 律法学者
  rationale: 福音書の文脈で、単なる筆記者ではなく、ユダヤの律法に通じた公認の専門家を指すことが現代日本語で明確に伝わる。
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: エルサレムから下って来た
  rationale: エルサレムからの移動を「下る」と表す原文の方向感覚を保ちつつ、自然な連体修飾とした。
- source_word: ἔλεγον
  choice: 言い続けていた
  rationale: 未完了過去の継続・反復の側面を、日本語で自然に示す。
- source_word: Βεελζεβοὺλ
  choice: ベルゼブル
  rationale: SBLGNTのギリシア語形を直接反映する音写。伝統的な「ベルゼブブ」は脚注に残した。
- source_word: ἔχει
  choice: 彼には……がいる
  rationale: 原文の「持っている」に近い簡潔な言い方を保ちながら、日本語として理解可能な形にした。憑依という解釈を本文で完全に言い切らず、明示的な意味は脚注に示した。
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: 悪霊どもの支配者の力で
  rationale: ここでのἐνを手段・力の源として理解し、その告発内容が自然な日本語で伝わるようにした。「支配者」はἄρχωνの権威を明瞭に表す。
- source_word: δαιμονίων / δαιμόνια
  choice: 悪霊ども
  rationale: δαιμόνιονを、別表現である「汚れた霊」と混同せず、一般読者に明確な現代日本語で訳した。
- source_word: ἐκβάλλει
  choice: 追い出している
  rationale: 悪霊を強制的に退去させる意味を、自然で明瞭な現代日本語で表す。
theological_decisions:
- issue: 「Βεελζεβοὺλ ἔχει」という告発の訳し方
  choice: 彼にはベルゼブルがいる
  alternative: 彼はベルゼブルに取りつかれている
  rationale: 原文の簡潔でやや含みのある言い方を本文に残し、悪霊による憑依・支配を明示する解釈は脚注に置くことで、原文の曖昧さと告発の神学的緊張を保った。
- issue: ἄρχωνの訳し方
  choice: 支配者
  alternative: 君主
  rationale: 権威を持つ者という意味を現代の一般読者に明確に伝える。「君主」も可能だが、政治的称号の響きが強いため脚注に示した。
- issue: 道具・力を表すἐνの訳し方
  choice: 支配者の力で
  alternative: 支配者によって
  rationale: イエスが悪霊の支配者の権威ないし力を用いている、という告発を明瞭にする。「によって」では行為主体と手段の関係が曖昧になりやすい。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「律法学者」「悪霊」など一般的な聖書語彙を用いつつ、古風すぎる表現は避けた。未完了過去は「言い続けていた」で表し、二つの告発が継続的になされていたことを示した。
