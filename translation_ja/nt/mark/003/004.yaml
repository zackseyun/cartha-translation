  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: ja
  text: そして彼らに言われた。「安息日に、善を行うことと悪を行うことのどちらが許されているのか。命を救うことと殺すことのどちらが許されているのか。」しかし、彼らは黙っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: 許されている
  rationale: 安息日規定をめぐり、律法上・慣習上何が許容されるかを問う語。現代日本語では「許されている」が自然で、法的・倫理的含意も保てる。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: 形は複数だが、コイネー・ギリシア語で安息日を指す慣用的表現。場面は特定の安息日なので、日本語では自然な単数相当で訳す。
- source_word: ἀγαθοποιῆσαι
  choice: 善を行うこと
  rationale: 善い行為、有益な行為をするという意味を簡潔に表し、後続の対句も保つ。
- source_word: κακοποιῆσαι
  choice: 悪を行うこと
  rationale: 「害を加える」も可能だが、語の倫理的幅を狭めず、ἀγαθοποιῆσαιとの明瞭な対照を再現する。直後の「救う／殺す」が具体的含意を示す。
- source_word: ψυχὴν σῶσαι
  choice: 命を救うこと
  rationale: ψυχήはここでは非物質的な「魂」ではなく、人の生命を指す。日本語の「命を救う」が文脈に最も自然。
- source_word: ἀποκτεῖναι
  choice: 殺すこと
  rationale: 基本義をそのまま訳す。「殺人を犯す」では原文に明示されない法的評価を加え、「死刑にする」では意味を限定しすぎる。
- source_word: ἐσιώπων
  choice: 黙っていた
  rationale: 未完了過去が表す、その問いに応じず沈黙を続けた様子を自然な日本語で示す。
theological_decisions:
- issue: 安息日における許可を問う法的・倫理的対照
  choice: 「許されているのは、善を行うことか、悪を行うことか」
  alternative: 「してよいのは、善いことか、害を加えることか」
  rationale: 問いを単なる行為選択ではなく、安息日規定のもとで何が許されるかという論争として示す。また「善／悪」という原語の対照を保ち、直後の「命を救う／殺す」によってその実際的な意味を読者に示す。
- issue: ψυχήの人間理解に関わる訳語
  choice: 命
  alternative: 魂
  rationale: 殺すこととの対照では生命を指すため、「魂」と訳して身体と別の実体に限定する神学的読みを持ち込まない。
- issue: 複数形τοῖς σάββασινの扱い
  choice: 安息日に
  alternative: 安息日々に
  rationale: 複数形は慣用的であり、文脈上はこの安息日の出来事を指す。日本語で不自然な複数表現を残さず、意味を明瞭にする。
translation_notes:
  register: 明快で現代的だが、聖書本文としての品位を保つ文体。「言われた」でイエスへの敬意を自然に示し、問いの二組の対句は句点で区切って修辞的な力を保った。原文上説明を要するほどの異読・曖昧さは本文で自然に処理できるため、脚注は付していない。
