base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: ja
  text: そして、イスカリオテのユダ[a]。このユダはイエスをも裏切った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「このユダはイエスをも引き渡した」とも訳せる。ギリシア語の動詞は「引き渡す」という意味だが、ここではユダの行為が持つ意味を踏まえて「裏切った」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 使徒の名簿の最後の人物を前項につなぐ接続詞として、現代日本語で自然な「そして」とした。
- source_word: Ἰούδαν
  choice: ユダ
  rationale: 人名を日本語聖書で定着した形に音写した。
- source_word: Ἰσκαριώθ
  choice: イスカリオテ
  rationale: 語源には不確かさがある固有の呼称なので、推測的に訳さず、慣用的な形で音写した。
- source_word: ὃς
  choice: このユダが
  rationale: 関係代名詞による説明節を、指示対象が明瞭で自然な日本語の独立文に組み替えた。
- source_word: καὶ
  choice: （独立した語としては訳出しない）
  rationale: ここではユダをその行為によってさらに特定する働きがある。「このユダが」という明示と文脈にその機能を含ませ、「また」を機械的に加えて不自然になることを避けた。
- source_word: παρέδωκεν
  choice: 裏切った
  rationale: 基本的には「引き渡す」を意味し得るが、ここではユダがイエスに対して行った行為を指すため、文脈上の背信の意味を自然に伝える「裏切った」とした。字義的な別訳は脚注に示した。
- source_word: αὐτόν
  choice: イエスを
  rationale: 代名詞の指示対象を日本語で明確にするため、「彼を」ではなく「イエスを」とした。
theological_decisions:
- issue: ユダの行為を表す παραδίδωμι の訳し方
  choice: 裏切った
  alternative: 引き渡した／引き渡すことになった
  rationale: 動詞そのものは必ずしも背信を明示せず「引き渡す」を意味し得るが、福音書のこの文脈ではユダの背信行為を指す。「裏切った」はその文脈的・道徳的意味を伝えつつ、語の幅は脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシア語では名簿に続く一文だが、日本語として読みやすくするため、ユダの説明を独立文にした。節単独でも指示対象が明確になるよう αὐτόν を「イエス」と明示した。
