  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: ja
  text: そして、ご自分のことを公にしないようにと、彼らを何度も厳しく戒められた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分を明らかにしないように」「ご自分のことを知らせないように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: 何度も
  rationale: ἐπετίμαを修飾する中性複数の副詞的用法として、警告が繰り返されたことを自然な現代日本語で表す。強さを示す「厳しく」は動詞側で表現した。
- source_word: ἐπετίμα
  choice: 厳しく戒められた
  rationale: 汚れた霊に対する強い制止・命令の語感を保ちつつ、文脈に合う自然で品位ある表現とした。「叱った」よりも命令的な制止を示しやすい。
- source_word: αὐτοῖς
  choice: 彼らを
  rationale: 直前の文脈にある汚れた霊たちを指す複数代名詞。日本語では「戒める」の対象として「を」で表した。
- source_word: ἵνα μὴ
  choice: しないようにと
  rationale: 警告・命令の内容を示す否定構文として、目的と内容の両面を無理なく保つ自然な日本語にした。
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: ご自分のことを公にしない
  rationale: φανερὸν ποιέωの「明らかにする、公然と知らせる」という意味を表す。「正体」や「神の子」と限定せず、原文が残す対象内容の幅を保持した。再帰的にイエスを指すため、主語との関係が明瞭な「ご自分のこと」とした。
theological_decisions:
- issue: 汚れた霊に対するイエスの命令の内容
  choice: イエスのことを公にしないよう禁じたと訳し、それ以上の内容を特定しない。
  alternative: イエスが神の子であることを明かさないよう命じた、または単に沈黙を命じたと明示する。
  rationale: 直前の文脈は身元の告白を示唆するが、この節自体は「彼を明らかにする」ことの禁止だけを述べる。そのため、キリスト論的内容やいわゆる秘密の主題を本文に補わない。
translation_notes:
  register: 明快な現代標準日本語を用い、尊敬表現「戒められた」と再帰表現「ご自分」によってイエスへの自然な敬意を示した。「公にする」は原文の顕在化・公表の含みを簡潔に伝える。
