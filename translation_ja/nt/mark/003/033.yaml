  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: ja
  text: イエスは彼らに答えて言われた[a]。「わたしの母、またわたしの兄弟とは、だれのことですか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くすれば「彼らに答えて言う」。ギリシア語は「答えて」という分詞に、物語を生き生きと描く歴史的現在の「言う」を続けている。
    reason: lexical_alternative
  - marker: b
    text: 原文は語順と形を直訳すると、「だれがわたしの母、あるいはわたしの兄弟なのか」に近い。動詞は最初の「母」に合わせて単数形になっている。
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: 彼らに答えて言われた
  rationale: 分詞「答えて」と歴史的現在「言う」から成る語りを、現代日本語の自然な物語文として表した。「彼らに」により応答の相手も明示した。
- source_word: μήτηρ
  choice: 母
  rationale: 標準的で品位のある親族呼称であり、原語の意味を直接伝える。
- source_word: ἢ
  choice: また
  rationale: 原文では選言の接続詞だが、母と兄弟を並べてその正体を問う日本語として自然になるよう「また」とした。原文の形は脚注で示した。
- source_word: ἀδελφοί
  choice: 兄弟
  rationale: 文脈上、直前に告げられたイエスの男性のきょうだいたちを指すため、男性複数形を広げず「兄弟」とした。
- source_word: Τίς ἐστιν
  choice: だれのことですか
  rationale: 複数の親族表現をまとめて問う日本語として自然であり、問いの焦点である人物の同定を明確に伝える。
theological_decisions:
- issue: ἀδελφοίの親族表現
  choice: 兄弟
  alternative: きょうだい／兄弟姉妹
  rationale: 男性複数形と直前の具体的な家族への言及を保ち、性別を解釈的に拡張しない。一方、親族関係の厳密な性質については本文で説明を加えず、特定の教派的理解を持ち込まない。
- issue: 母と兄弟を結ぶἢ
  choice: また
  alternative: あるいは／それとも
  rationale: 原文のἢを日本語で機械的に「あるいは」とすると、母か兄弟かの二者択一を尋ねるように響きやすい。「また」は両者を一つの問いにまとめる機能を自然に表しつつ、原文の構文は脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語。イエスの発話には品位を保った「わたし」と丁寧な問いの形を用いた。本文では日本語としての自然さを優先し、マルコ特有の分詞＋歴史的現在、および単数動詞とἢを伴う構文上の緊張は脚注に保存した。
