source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: ja
  text: それから、イエスは山に登り、ご自身が望む者たちを呼び寄せた。彼らはイエスのもとへ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: 登り
  rationale: 歴史的現在だが、日本語の物語として自然な過去時制で表した。上方への移動という意味を明確に保っている。
- source_word: εἰς τὸ ὄρος
  choice: 山に
  rationale: ἀναβαίνειと合わせて「山に登る」とするのが自然であり、山上へ向かう動きを簡潔に表す。
- source_word: προσκαλεῖται
  choice: 呼び寄せた
  rationale: 単に「呼んだ」よりも、自分のもとへ来るように呼ぶという中動態の関与と文脈上の方向性を自然に表す。
- source_word: οὓς ἤθελεν αὐτός
  choice: ご自身が望む者たち
  rationale: 明示されたαὐτόςの強調を「ご自身が」で保持しつつ、θέλωを現代日本語で自然な「望む」とした。
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: 彼らはイエスのもとへ行った
  rationale: ἀπέρχομαιの移動を「行った」で表し、πρὸς αὐτόνの到達方向を「イエスのもとへ」で明示した。「来た」も文脈上可能だが、原語の動詞により近い表現を採った。
theological_decisions:
- issue: イエス自身の選択に置かれた強調
  choice: 「ご自身が望む者たち」としてαὐτόςの強調を保持した。
  alternative: 「望む者たち」
  rationale: 本文はイエス自身の意思と主導性を強調しているが、それを特定の選びの教理へ広げず、節に明記された範囲にとどめた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、荘重さを保ちながら過度に文語的にはしなかった。「ご自身」は敬意表現であると同時に、原文の明示的な主語強調を自然に伝える。
