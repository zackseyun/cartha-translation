id: MRK.3.35
reference: Mark 3:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: ja
  text: というのも、神のみこころを行う人はだれでも、その人こそ[a]、わたしの兄弟であり、姉妹であり、母なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「この人こそ」。ギリシャ語では指示語によってこの人が強調されている。別訳「その人が」。
    reason: 指示代名詞οὗτοςの強調と直訳を示すため。
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: 行う人はだれでも
  rationale: 関係代名詞にἄνとアオリスト接続法が伴う不定一般条件を、現代日本語で自然な「人はだれでも」と表した。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の発言の理由・説明を導く接続詞としての働きを、文脈に自然につながる表現で保持した。
- source_word: ποιήσῃ
  choice: 行う
  rationale: ここでは神の意志を実行することを指すため、簡潔で定着した「行う」とした。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 神のみこころ
  rationale: 「神の意志」も可能だが、神の望みと意図を人格的かつ尊厳ある日本語で表す定着表現を採用した。
- source_word: οὗτος
  choice: その人こそ
  rationale: 指示代名詞の明示性と強調を保ちつつ、日本語で性別を不必要に限定しない自然な表現とした。
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: わたしの兄弟であり、姉妹であり、母
  rationale: 三つの具体的な親族名称を一般化せず、反復されるκαίの累加的な響きも「であり」の反復で表した。
- source_word: ἐστίν
  choice: なのです
  rationale: 単純な繋辞を、説明を結ぶ文脈に合う丁寧で明瞭な断定として訳した。
theological_decisions:
- issue: 男女双方の親族名称を伴う単数主語の表現
  choice: その人こそ
  alternative: 彼こそ
  rationale: ギリシャ語の導入部は文法上男性単数だが、述語には兄弟だけでなく姉妹と母も明記される。「彼」として男性に限定して聞こえる可能性を避け、単数性と指示・強調は保持した。
- issue: イエスが用いる家族表現の性質
  choice: 兄弟、姉妹、母という具体的名称を保持
  alternative: 家族の一員
  rationale: 神のみこころを行うことを中心に家族的な結びつきを語り直す比喩と修辞の力を保つため、包括的な一語へ一般化しなかった。
- issue: τὸ θέλημα τοῦ θεοῦの訳語
  choice: 神のみこころ
  alternative: 神の意志
  rationale: どちらも語義上可能だが、文脈では神が望まれることを実行する意味であり、「みこころ」は意味を狭めず、日本語聖書として自然である。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「というのも」で前節との説明関係を示した。「兄弟であり、姉妹であり、母」と反復して、原文の累加的で印象的な家族表現を保った。
