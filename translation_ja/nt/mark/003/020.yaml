base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: ja
  text: イエスはある家に入られた。[a] すると、群衆が再び集まって来て、イエスたちは食事をすることさえできなかった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家に帰られた」とも訳せる。ギリシア語は字義的には「家の中へ」だが、この表現が帰宅する意味で用いられる場合もある。
    reason: lexical_alternative
  - marker: b
    text: 直訳「パンを食べることさえ」。ここでは、食事をすることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 入られた
  rationale: マルコの歴史的現在を、日本語の物語として自然な過去形で表した。主語は文脈上イエスであり、敬意を示す自然な表現とした。
- source_word: εἰς οἶκον
  choice: ある家に
  rationale: 冠詞も所有表現もないため、「自分の家」や特定の「その家」と断定せず、不定性を保った。「家へ」よりも、ἔρχεταιとの組み合わせで意図される入室を自然に表した。
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: 群衆が再び集まって来た
  rationale: 群衆が一か所に集まる意味を、明瞭で現代的な日本語にした。πάλινは「再び」と明示した。
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: ため、イエスたちは……できなかった
  rationale: ὥστε＋不定詞の結果を「ため……できなかった」で表した。複数代名詞αὐτούςはイエスと同行者たちを指すので、日本語で指示対象が明瞭になるよう「イエスたち」とした。
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: 食事をすることさえ
  rationale: ἄρτον φαγεῖνは字義的には「パンを食べる」だが、ここでは食事を取ることを表す慣用句である。本文は自然な意味を示し、字義は脚注に残した。
