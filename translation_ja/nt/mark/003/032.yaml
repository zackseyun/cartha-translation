  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: ja
  text: イエスの周りには大勢の人が座っていた。そして人々はイエスに言った。「ご覧ください。あなたの母と兄弟たちが外であなたを捜しています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたを求めています」。ギリシア語の動詞は「求める」「捜す」のどちらの意味にもなり得る。ここでは、イエスを見つけようとしていることを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: 座っていた
  rationale: 未完了過去が示す進行中の場面を、自然な日本語の継続表現で示した。
- source_word: περὶ αὐτὸν ὄχλος
  choice: 大勢の人がイエスの周りに
  rationale: περί＋対格の空間的な意味を保ち、群衆がイエスを囲んで座っている情景を明瞭にした。日本語では「群衆」より「大勢の人」が平明で自然である。
- source_word: λέγουσιν
  choice: 人々がイエスに言った
  rationale: 歴史的現在を日本語の物語に自然な過去形で訳した。主語は直前の大勢の人々を受ける形で明示した。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 相手の注意を促す談話標識として、古風すぎず、かつ品位のある現代語を選んだ。
- source_word: μήτηρ
  choice: お母上
  rationale: 母を指す通常の親族名称。本人に向かってその母を述べる日本語として、自然な敬意を表す形にした。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 文法上の男性複数をそのまま示し、親族関係について本文以上の解釈を加えなかった。
- source_word: ἔξω
  choice: 外で
  rationale: 場所を表す単純な副詞として文脈に即して訳した。
- source_word: ζητοῦσίν σε
  choice: あなたを捜しています
  rationale: ζητέωの「求める／捜す」という意味領域のうち、この場面では居場所を捜して会おうとしていることを自然に表す。別訳の可能性は脚注に残した。
theological_decisions:
- issue: 「兄弟たち」の親族関係
  choice: ἀδελφοίを「兄弟たち」と訳し、説明を加えない。
  alternative: 「近親者たち」または「きょうだいたち」
  rationale: 本文は通常の男性複数の親族語を用いるだけで、その関係について神学的説明をしていないため、特定の教派的理解を持ち込まず語義を直接保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の品位を保った。「イエス」を補って代名詞の指示を明確にし、ἰδούは会話に適した丁寧な注意喚起として訳した。脚注記号は語義上の対象である「捜しています」の直後に置いた。
