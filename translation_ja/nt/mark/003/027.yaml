source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: ja
  text: 'しかし、だれも、まずその強い者[b]を縛らないかぎり、その強い者の家に入って、その持ち物[a]を奪い取ることはできない。そうして初めて、その人はその家を略奪する。


    [a] 「家財」または「所有物」とも訳せる。直訳では「器、物」。


    [b] 「強い者」は、サタンを打ち負かすことを語るイエスの比喩の一部である。本文では解釈を明示せず、原文の比喩を保った。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家財」または「所有物」とも訳せる。直訳では「器、物」。
    reason: lexical_alternative
  - marker: b
    text: 「強い者」は、サタンを打ち負かすことを語るイエスの比喩の一部である。本文では解釈を明示せず、原文の比喩を保った。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の非難と、それに対するイエスの反論との対照を自然な現代日本語で示す。
- source_word: οὐδεὶς δύναται
  choice: だれも……できない
  rationale: 否定の不定代名詞と可能を表す動詞を、日本語の自然な呼応表現で再現する。
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν
  choice: その強い者の家に入って
  rationale: アオリスト分詞を、日本語で自然に先行・付帯動作を表す「入って」とした。
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: その強い者
  rationale: 名詞的に用いられた形容詞を訳し、比喩の反復を保つ。「強者」よりも平明で具体的な表現である。
- source_word: τὰ σκεύη αὐτοῦ
  choice: その持ち物
  rationale: σκεύηは字義的には器具や物を指すが、家を襲う文脈では家財・所有物全般を意味するため、広く分かりやすい「持ち物」とした。
- source_word: διαρπάσαι / διαρπάσει
  choice: 奪い取る／略奪できる
  rationale: この動詞が表す強制的に奪う意味を保つ。前半は目的語との自然な結びつきから「奪い取る」、後半は家全体を荒らす像を示すため「略奪」とした。
- source_word: ἐὰν μὴ πρῶτον
  choice: まず……ないかぎり
  rationale: 略奪に先立って強い者を縛ることが必要条件である点を明確に表す。
- source_word: δήσῃ
  choice: 縛らない
  rationale: δέωの具体的な拘束の像を、平明で直接的な日本語によって保つ。
- source_word: καὶ τότε
  choice: そうして初めて
  rationale: 強い者を縛った後に初めて略奪が可能になるという、時間的順序と帰結を自然に示す。
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: その家を略奪できる
  rationale: 「家」という比喩を反復しつつ、先行する必要条件を受けた帰結として日本語で自然に表現する。
theological_decisions:
- issue: イエスの議論における「強い者」の比喩的意味
  choice: 本文では「強い者」という比喩をそのまま保つ。
  alternative: 本文中で「強い者」をサタンと明示する。
  rationale: 文脈上はサタンを打ち負かすことを指すが、ギリシア語本文は具体的な比喩として提示している。翻訳本文で解釈に置き換えず、脚注で文脈的意味を示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「強者」のような硬い語を避けて「強い者」とし、家への侵入、拘束、略奪という具体的な比喩の流れを保った。
