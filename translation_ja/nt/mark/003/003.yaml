  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: ja
  text: そしてイエスは、手の萎えた人に言われる。「立って、真ん中に出なさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言われる
  rationale: マルコの生き生きとした歴史的現在を保ちつつ、イエスへの自然で品位ある敬語表現とした。
- source_word: τῷ ἀνθρώπῳ
  choice: 人に
  rationale: 文脈上は男性だが、日本語の「人」は性別を不必要に強調せず、個人を自然に指せる。
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: 手の萎えた
  rationale: 身体の状態を簡潔に表し、ξηράνの「乾いた、萎えた」という像を過度な医学的説明なしに保つ。
- source_word: Ἔγειρε
  choice: 立って
  rationale: ここでは横たわった者を起こすというより、その場から立つよう促す命令として自然に表した。
- source_word: εἰς τὸ μέσον
  choice: 真ん中に出なさい
  rationale: εἰςの移動方向とτὸ μέσονの中央・人々の間という空間的意味を、現代日本語で自然な命令として表す。
