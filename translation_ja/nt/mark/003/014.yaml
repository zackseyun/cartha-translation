    text: 「宣教する」とも訳せる。
    reason: lexical_alternative
  revision_rationale: 二つのἵνα節を、ともに「任命した」ことの目的として日本語でも対称的に表した。第一節は「自分と共にいる」としてμετ’ αὐτοῦの関係的な意味を保ち、第二節は「遣わして宣べ伝えさせる」としてἀποστέλλῃ αὐτούς κηρύσσεινの派遣と目的を自然に示した。異読および語彙別訳の脚注内容は維持し、bの位置のみ対応語へ移した。
