review_pass:
  verdict: revise
  source_fidelity: 「十二人を任命した」は、この文脈でのἐποίησενを適切に表し、本文にない「使徒」を補っていない点もよい。ただし、二つのἵνα節はいずれも任命の目的であり、現行の「彼らを自分のそばに置き」は、彼らがイエスと共にいるという目的を、イエスが物理的に置く行為のように言い換えている。目的節として明示するほうが原文に忠実である。
  naturalness: 現行文の「彼らを自分のそばに置き、また、…遣わすためであった」は、並列する目的の構文としてやや不均衡である。「彼らが自分と共にいるため、また…ため」とそろえると、明瞭で自然な現代標準日本語になる。
  terminology: 「任命した」「遣わして」「宣べ伝えさせる」は、使命への選任・派遣・公的宣言という文脈を過不足なく表す。「宣べ伝える」は格調を保ちつつ通用する用語である。異読の「使徒」は本文に入れず脚注にとどめる。
  issues:
  - severity: medium
    issue: 第一の目的節が「彼らを自分のそばに置き」と訳されている。
    rationale: ἵνα ὦσιν μετ’ αὐτοῦは直訳すれば「彼らが彼と共にいるため」であり、彼らの継続的な同伴・関係を目的として述べる。現行の「置き」は意味を狭め、第二の目的節との統語的な並列も弱める。
  - severity: low
    issue: 脚注bのアンカーが節末にあり、κήρυσσεινとの対応がやや見えにくい。
    rationale: 脚注は「宣べ伝えさせる」に直置きすると、語彙上の別訳であることが明確になる。
  revised_text: そして、イエスは十二人を任命した[a]。彼らが自分と共にいるため、また彼らを遣わして宣べ伝えさせる[b]ためであった。
  revised_footnotes:
