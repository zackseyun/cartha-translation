  text: καὶ ἐποίησεν ⸀δώδεκα, ἵνα ὦσιν μετ’ αὐτοῦ καὶ ἵνα ἀποστέλλῃ αὐτοὺς κηρύσσειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: ja
  text: そして、イエスは十二人を任命した[a]。彼らが自分と共にいるため、また彼らを遣わして宣べ伝えさせる[b]ためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、ここに「彼らを使徒とも名づけた」とある。
    reason: textual_variant
  - marker: b
    text: 「宣教する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: 任命した
  rationale: 字義的には「作った」だが、ここでは十二人を一つの務めのために立てる意味。「任命した」は文脈上の制度的・使命的な含みを自然に表す。
- source_word: δώδεκα
  choice: 十二人
  rationale: ギリシア語は名詞を伴わず「十二」とするが、日本語では人を指すことを明確にするため「十二人」とした。「十二人の使徒」とはせず、本文にない称号を補わない。
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: 彼らを自分のそばに置き
  rationale: ἵνα＋接続法の目的を、後続の目的節と並列になる自然な日本語で表した。「そばに」は単なる位置だけでなく、共にいる関係も保つ。
- source_word: ἀποστέλλῃ
  choice: 彼らを遣わす
  rationale: 派遣・委任の含みを持つ「送る」を、福音書の文脈にふさわしい「遣わす」で表した。ただし、ここから称号「使徒」を本文に持ち込んではいない。
- source_word: κηρύσσειν
  choice: 宣べ伝える
  rationale: 公に告げ知らせる行為を表す。現代日本語の聖書文体として理解可能で、単に説教を行うことだけに狭めない。別訳「宣教する」を脚注に示す。
theological_decisions:
- issue: 本文に使徒という称号を補うか
  choice: 本文には「使徒」を加えず、「十二人を任命した」とする。
  alternative: 「十二人を任命し、彼らを使徒と名づけた」とする異読。
  rationale: 提示されたSBLGNT本文は「十二人を任命した」とだけ読み、「彼らを使徒とも名づけた」に相当する句を含まない。底本文を優先し、異読は脚注で明示する。
- issue: 二つのἵνα節の目的関係
  choice: 「自分のそばに置き」と「遣わす」を並列の目的として表す。
  alternative: 第二の目的を第一に従属させ、「共にいさせ、やがて遣わす」と解釈的に訳す。
  rationale: 原文は二つのἵναをκαίで結び、共に任命の目的として提示する。時間的な順序を過度に補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宣べ伝える」は聖書語として定着しているが意味も推測しやすい。「彼らがイエスと共にいるため」とする直訳調を避け、二つの目的が自然に並ぶようにした。
