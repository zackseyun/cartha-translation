revisions:
- from: そしてイエスは十二人を任命した[a]。彼らを自分のそばに置き、また、宣べ伝えるために彼らを遣わすためであった[b]。
  to: そして、イエスは十二人を任命した[a]。彼らが自分と共にいるため、また彼らを遣わして宣べ伝えさせる[b]ためであった。
  rationale: 二つのἵνα節を、ともに「任命した」ことの目的として日本語でも対称的に表した。第一節は「自分と共にいる」としてμετ’ αὐτοῦの関係的な意味を保ち、第二節は「遣わして宣べ伝えさせる」としてἀποστέλλῃ αὐτούς κηρύσσεινの派遣と目的を自然に示した。異読および語彙別訳の脚注内容は維持し、bの位置のみ対応語へ移した。
