  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: ja
  text: イエスは多くの人を癒やされたので、苦しみ[a]を抱える人々は皆、イエスに触れるために、彼に押し寄せていた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「苦しみ」は、「病」または「重い患い」とも訳せる。原語は文字どおりには「むち」を意味し、ここでは人を苦しめる患いや苦痛を指す。
    reason: lexical_alternative
  - marker: b
    text: 「彼の上に倒れかかった」とも訳せる。ギリシア語は、人々が勢いよくイエスに押し寄せる様子を強く表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς γὰρ ἐθεράπευσεν
  choice: 多くの人を癒やしておられたので
  rationale: γάρの説明的な働きを「ので」で自然に示した。アオリストは、群衆の行動の背景となるそれまでの癒やしを文脈に即して表した。
- source_word: ὥστε ἐπιπίπτειν αὐτῷ
  choice: 彼に押し迫った
  rationale: ὥστεの結果を日本語の文脈で示し、ἐπιπίπτωの、群衆が勢いよく殺到する強さを「押し迫る」で表した。直訳的な「上に倒れかかる」ほど不自然にはしなかった。
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: イエスに触れようとして
  rationale: ἵναの目的を「ようとして」で示し、ἅπτομαιの身体的に触れる意味を明確かつ自然に訳した。代名詞が連続して指示対象が曖昧にならないよう、ここでは「イエス」とした。
- source_word: ὅσοι εἶχον μάστιγας
  choice: 苦しみを抱える人は皆
  rationale: ὅσοιの包括性を「皆」で表した。μάστιξは文字どおりには「むち」だが、ここでは重い病苦・災厄を指す比喩であり、医学的な「病気」に限定せず「苦しみ」とした。
theological_decisions:
- issue: μάστιγαςが指す苦しみの性質
  choice: 苦しみ
  alternative: 病／災厄／むち打ちのような苦痛
  rationale: 癒やしの文脈にあるが、語自体は臨床的な病気だけに限定されず、苛烈な苦痛を比喩的に表す。広さと切実さを保つため「苦しみ」とした。
- issue: ἐπιπίπτεινの群衆場面での強さ
  choice: 押し迫った
  alternative: 倒れかかった／殺到した
  rationale: 人々がイエスに触れようと勢いよく迫る身体的な圧力を保ちつつ、「倒れかかった」の偶発的な響きや「殺到した」の過度な意訳を避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着きと尊厳を保った。「イエス」は直前文脈の指示対象を明確にするため補った。脚注記号は対応箇所を含む文末に置いた。
