id: MRK.3.8
reference: Mark 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: ja
  text: また、エルサレム、イドマヤ、ヨルダン川の向こう側[a]、ティルスとシドンの周辺[b]からも、大勢の人々が、イエスの行っていたこと[c]を聞いて、そのもとに来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨルダン川の向こうの地域」とも訳せる。ギリシア語は、ヨルダン川を隔てた反対側の地方を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳「ティルスとシドンの周り」。両都市そのものだけでなく、その周辺地域を指す。
    reason: lexical_alternative
  - marker: c
    text: 「イエスの行っていたすべてのこと」とも訳せる。ギリシア語の関係代名詞には包括的な意味合いがあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: エルサレムから
  rationale: ἀπό＋属格が出所を示すため、地名を現代日本語で定着した形にして「から」と訳した。
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: イドマヤから
  rationale: 地域名Ἰδουμαίαを日本語の聖書地名として一般的な「イドマヤ」とし、ἀπόの起点を「から」で表した。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ヨルダン川の向こう側
  rationale: πέραν＋属格の、川を越えた側またはその地域という空間的意味を自然な日本語で保持した。
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: ティルスとシドンの周辺
  rationale: περί＋対格はここでは両都市そのものに限らず、その周囲の地域を指すため「周辺」とした。
- source_word: πλῆθος πολύ
  choice: 大勢の人々
  rationale: 非常に多数の群衆を意味する表現を、明瞭で自然な現代日本語にした。
- source_word: ἀκούοντες
  choice: 聞いて
  rationale: 現在分詞と主動詞との連結を保ちつつ、時間的・因果的関係を必要以上に限定しない訳とした。
- source_word: ὅσα ἐποίει
  choice: イエスの行っていたこと
  rationale: ὅσαの包括性を残し、未完了過去ἐποίειの継続的な活動を「行っていた」で表した。文脈上の主語を日本語で明確にするため「イエス」を補った。
- source_word: ἦλθον πρὸς αὐτόν
  choice: そのもとに来た
  rationale: πρός＋対格が人への接近を示すので「もとに来た」とし、直前の「イエス」との重複を避けてαὐτόνを「その」と受けた。
- source_word: καὶ … καὶ … καὶ
  choice: また…も
  rationale: 地名列挙の累加性を、日本語として不自然な接続詞の反復を避けながら「また」と係助詞「も」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地名の累積を一続きの起点句としてまとめ、マルコの列挙感は「また」と「も」で保持した。敬語によって原文にない神学的含意を加えないよう、「なさっていた」ではなく「行っていた」とした。
