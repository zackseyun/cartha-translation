source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: ja
  text: イエスの身近な人たち[a]は、このことを聞くと、イエスをつかまえようとして出て行った。彼らは、「イエスは正気を失っている[b]」と言っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスの家族」または「イエスの身内」とも訳せる。ギリシア語は慣用的な表現で、イエスの家に属する人々や、身近な仲間を指す可能性がある。
    reason: alternative_reading
  - marker: b
    text: 別訳「我を失っている」「気が変になっている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: イエスの身近な人たち
  rationale: 直訳的な「彼のもとからの者たち」では意味が不明瞭になる慣用表現。文脈上は家族である可能性が高いが、原文自体は明示的な親族名称を用いていないため、「身近な人たち」として曖昧さを保った。
- source_word: ἀκούσαντες
  choice: このことを聞くと
  rationale: アオリスト分詞の時間的関係を自然な現代日本語で表した。「このこと」は直前の状況を受けるが、何を聞いたかを原文以上に限定しない。
- source_word: ἐξῆλθον
  choice: 出て行った
  rationale: 移動を表す基本的な意味を保ち、出発地点や到着地点を原文以上に特定しない表現とした。
- source_word: κρατῆσαι
  choice: 取り押さえようと
  rationale: 力を伴ってつかむ意味を明確にしつつ、法的な逮捕とは限定しない。「連れ戻す」「制止する」は目的を補いすぎるため避けた。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的または反復的な含みを自然に示した。主語は直前の複数の人々を受ける形にした。
- source_word: ἐξέστη
  choice: 正気を失っている
  rationale: 精神的に正常な状態から外れているとの非難を、現代の読者に明瞭で過度に俗悪でない日本語で表した。完了形が示す現在の状態も「失っている」で表現した。
theological_decisions:
- issue: οἱ παρ’ αὐτοῦが指す人々の身元
  choice: 本文では「イエスの身近な人たち」とし、家族に限定しない
  alternative: イエスの家族／イエスの身内／イエスの仲間
  rationale: 後続文脈から家族を指す可能性は高いが、この節のギリシア語は明示的な親族語ではない。家族がイエスを正気でないと判断したという神学的・物語的緊張を一つの解釈で固定せず、注で可能性を示した。
- issue: ἔλεγονの発言主体
  choice: 直前の「イエスの身近な人たち」を受けて「彼らは」とした
  alternative: 不特定の人々がそう言っていた／そう言われていた
  rationale: ギリシア語の複数動詞は直前の複数主語を自然に継続させる。ただし日本語では主語が見失われやすいため「彼らは」を補った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、物語文としての品位を保った。「取り押さえる」は動作の強さを残し、「正気を失っている」は非難の内容を明確にする。すべての注記号を本文中に配置した。
