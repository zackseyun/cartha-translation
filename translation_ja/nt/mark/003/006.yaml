  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: ja
  text: ファリサイ派の人々は、外へ出るとすぐに、ヘロデ党の人々とともに、イエスを滅ぼす[a]にはどうすればよいかを協議し始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この文脈では、「殺すこと」または「死に至らせること」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: 外に出ると
  rationale: アオリスト分詞を、直後の行動へ自然につながる日本語の継起表現とした。直前の会堂から出たという動きも保っている。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な物語の切迫感を、明快で自然な現代日本語で表した。
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ヘロデ党の人々とともに
  rationale: μετά＋属格の協同・連携を表す。「ヘロデ党」はヘロデ家を支持する勢力を指す慣用的な名称だが、普通名詞との混同を避けるため「人々」を補った。
- source_word: συμβούλιον ἐδίδουν
  choice: 相談を始めた
  rationale: この句は「協議する、策を練る」という慣用句である。未完了過去の開始・継続の含みを「始めた」で示しつつ、目的の悪意は後続句に語らせた。
- source_word: κατ’ αὐτοῦ
  choice: 彼に対する
  rationale: κατά＋属格の敵対的な方向性を保持した。指示対象を明瞭にするため本文では先に「イエス」と明示した。
- source_word: ὅπως
  choice: どう…かと
  rationale: 接続法を伴い、相談の目的・内容を導く。日本語では「どう…かと」が協議内容と意図の双方を自然に伝える。
- source_word: ἀπολέσωσιν
  choice: 滅ぼそう
  rationale: ἀπόλλυμιの「滅ぼす、破滅させる、殺す」という幅を保った。文脈上は殺害を意図するが、本文では語義を不必要に狭めず、明示的な訳を脚注に示した。
theological_decisions:
- issue: 指導者たちの意図を本文で明示的に殺害と訳すか
  choice: 本文では広い意味を持つ「滅ぼす」を採用する。
  alternative: 「殺す」「死なせる」
  rationale: 文脈上、意図は明らかに殺害へ向かっているが、ἀπόλλυμι自体にはより広い語義がある。その緊張を本文に残し、文脈上の具体的意味は脚注で明示する。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「ファリサイ派」「ヘロデ党」は一般読者にも比較的理解しやすい標準的名称を用いた。語順は原文の敵対的協議と目的の関係を保ちつつ、日本語として読みやすく整えた。
