  to: ファリサイ派の人々は、外へ出るとすぐに、ヘロデ党の人々とともに、イエスを滅ぼす[a]にはどうすればよいかを協議し始めた。
  rationale: 原文の語順を不自然に模倣せず、συμβούλιον ἐδίδουνを「協議し始めた」、ὅπως αὐτὸν ἀπολέσωσινを「イエスを滅ぼすにはどうすればよいか」と訳した。これにより、ファリサイ派とヘロデ党の人々がイエスに敵対して、その排除の方法を協議したという原文の意味を明瞭に保つ。「滅ぼす」は本文で維持し、文脈上の殺害の意味は適切な脚注で示した。
