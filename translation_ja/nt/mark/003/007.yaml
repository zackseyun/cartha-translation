lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: 退かれた
  rationale: 反対や圧力を避けてその場から離れる含みを保ちつつ、現代日本語として自然にした。文脈上の行動を表すので、「撤退した」ほど軍事的にはしない。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちとともに
  rationale: μαθητήςは学ぶ者・従う者を指すが、福音書の文脈では定着した「弟子」が関係性と召命の両面をよく表す。
- source_word: πρὸς τὴν θάλασσαν
  choice: 湖のほうへ
  rationale: πρόςは到着点にも方向にもなりうるため「ほうへ」とした。θάλασσαは字義的には「海」だが、ここではガリラヤ湖を指すことが明らかで、日本語の地理名称として自然な「湖」を本文に用いた。
- source_word: πολὺ πλῆθος
  choice: 大勢の群衆
  rationale: 人数の多さを強調する表現を、平明で自然な現代日本語にした。
- source_word: ἠκολούθησεν
  choice: イエスについて行った
  rationale: ここでは群衆が地理的にイエスの後について行く意味。「従った」だけでは信仰的帰依を強く示しすぎる可能性があるため、移動を明確にした。
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: ガリラヤから来た
  rationale: 群衆の出身・来訪元を自然な日本語で明示した。
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: また、ユダヤからも、
  rationale: 列挙が次節へ続く未完の構文を保つため、読点で終えた。
