source:
  edition: SBLGNT
  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: ja
  text: そして彼らは、イエスが安息日にその人を癒やすかどうか、じっと見張っていた。イエスを訴えるためであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετήρουν
  choice: じっと見張っていた
  rationale: 未完了時制の継続性と、文脈にある敵対的で注意深い監視のニュアンスを自然な日本語で表す。
- source_word: εἰ
  choice: …かどうか
  rationale: 観察の対象を示す間接疑問として、原文の意味を明確かつ自然に伝える。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: ギリシャ語は複数形だが、コイネー・ギリシャ語では一日の安息日を指す慣用的用法があり、日本語では単数相当の表現が自然である。
- source_word: θεραπεύσει
  choice: 癒やす
  rationale: 間接疑問中の未来直説法。日本語では時制を過度に明示せず、「癒やすかどうか」とするのが自然で、行為の未実現性も文脈から明らかである。
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: イエスを訴えるため
  rationale: ἵναと接続法の目的を明示する。「訴える」は告発の意味を保ちつつ、本文が明示しない正式な訴訟手続きまでは含意しない。
- source_word: αὐτόν / αὐτοῦ
  choice: その人／イエス
  rationale: 同一節内の二つの男性単数代名詞が別々の人物を指すため、日本語での指示対象の混同を避けるよう明示した。
theological_decisions:
- issue: 監視していた人々の意図
  choice: 癒やしを口実にイエスを訴えるための敵対的監視として訳す
  alternative: 正式に告発する、または起訴するためと強く法廷的に訳す
  rationale: κατηγορέωには法廷的用法もあるが、本文は訴える目的を述べるにとどまり、正式な法的手続きを特定していない。
- issue: 安息日の複数形
  choice: 日本語本文では「安息日に」と訳す
  alternative: 「安息日々に」など複数形を形式的に反映する
  rationale: τοῖς σάββασινの複数形は安息日一日を指す慣用表現として理解でき、ここで不自然な複数表現を用いると、複数回の出来事という原文にない含みを生じさせる。
translation_notes:
  register: 明瞭で現代的ながら聖書本文にふさわしい品位を保った。「彼」を重ねず「イエス」「その人」として指示対象を明確にし、継続的かつ敵対的な観察は「じっと見張っていた」で表した。
