lexical_decisions:
- source_word: ὅτι
  choice: からである
  rationale: 直前の発言の理由を示す接続詞として、因果関係が明確になる自然な日本語にした。
- source_word: ἔλεγον
  choice: 言い続けていた
  rationale: 未完了過去形が示す継続的または反復的な発言を表す。
- source_word: Πνεῦμα ἀκάθαρτον
  choice: 汚れた霊
  rationale: 福音書で悪霊を指す定型的な表現であり、ἀκάθαρτοςとの語彙的対応も保つ。
- source_word: ἔχει
  choice: つかれている
  rationale: 原語は字義的には「持っている」だが、日本語の「汚れた霊を持っている」は不自然で意味も伝わりにくい。文脈上の含意を自然に表す一方、字義的表現は脚注に残した。
theological_decisions:
- issue: イエスに対する非難の性質
  choice: 「汚れた霊につかれている」という直接的な非難として訳す
  alternative: 「汚れた霊を持っている」
  rationale: 日本語では「霊につかれている」がこの告発を自然かつ明瞭に伝える。ただし、原文のἔχειが単に「持っている」を意味することも脚注で明示し、解釈上の幅を隠さない。
translation_notes:
  register: 明瞭で現代的かつ荘重な文体。「あの人」は、敵対者がイエスについて語る引用として自然であり、原文にない固有名を補わない。
