source:
  edition: SBLGNT
  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: ja
  text: そして十二人を任命し、シモンにペテロ[a]という名をつけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ペテロ」は「岩」という意味。
    reason: 人名として音写したギリシア語 Πέτρος の語義を示すため。
lexical_decisions:
- source_word: ἐποίησεν
  choice: 任命し
  rationale: 直訳は「造った／した」だが、ここでは十二人を一つの定まった集団として立てる行為を表すため、現代日本語で自然な「任命した」とした。後代の教会制度を過度に持ち込まない表現でもある。
- source_word: τοὺς δώδεκα
  choice: 十二人
  rationale: イエスが選び立てた特定の十二人を指す。日本語では文脈上「十二人」でそのまとまりが自然に伝わる。
- source_word: ἐπέθηκεν ὄνομα
  choice: 名をつけた
  rationale: 字義的には「名を置いた」という命名の慣用句であり、「名をつけた」が明瞭で自然な日本語である。
- source_word: Σίμωνι
  choice: シモン
  rationale: 人名として、日本語聖書で広く通用する形に音写した。
- source_word: Πέτρον
  choice: ペテロ
  rationale: ここでは授けられた人名として機能するため「ペテロ」と音写し、語義は脚注に示した。
theological_decisions:
- issue: イエスが十二人に対して行ったことの表現
  choice: 十二人を任命し
  alternative: 十二人を立て／十二人を造り
  rationale: ἐποίησεν は広い意味を持つが、この文脈では十二人を特定の集団として定めたことを表す。「任命」はその公的な設定を明瞭にしつつ、後代の特定の教職制度までは含意しない。
- issue: Πέτρος の扱い
  choice: ペテロ
  alternative: 岩
  rationale: 本文ではシモンに授けられた固有名として音写し、その名の意味は脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、簡潔ながら尊厳のある叙述とした。脚注記号は意味を説明する対象である「ペテロ」の直後に置いた。
