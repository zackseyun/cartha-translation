id: MRK.3.11
reference: Mark 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: ja
  text: 汚れた霊どもは、イエスを見るたびに、その前に倒れ伏し[a]、「あなたこそ神の子です」と叫んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その前に身を投げ出した」。ギリシャ語の動詞は、服従や懇願を示して相手の前に倒れ伏すことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: 汚れた霊ども
  rationale: 福音書で定着した表現を用い、ἀκάθαρταが持つ宗教的・道徳的な「汚れ」の含みを、より解釈的な「悪霊」に置き換えず保持した。
- source_word: ὅταν
  choice: 見るたびに
  rationale: 後続する未完了過去形とともに反復を表すため、その都度同じ反応が起きたことを自然な日本語で示した。
- source_word: ἐθεώρουν
  choice: 見る
  rationale: 文脈上は視認することを表しており、「見つめる」など観察のニュアンスを過度に強めない簡潔な訳とした。
- source_word: προσέπιπτον αὐτῷ
  choice: その前に倒れ伏し
  rationale: 相手の前に身を伏せる身体動作を明示しつつ、それが礼拝だったのか、服従や懇願だったのかを訳文だけで決めないようにした。
- source_word: ἔκραζον
  choice: 叫んだ
  rationale: κράζωの強い発声を、現代日本語で自然かつ簡潔に表した。
- source_word: λέγοντα
  choice: 直接引用として表現
  rationale: 日本語では「言って叫んだ」と重ねず、叫んだ内容を直接引用することで分詞の働きを自然に表した。
- source_word: Σὺ εἶ
  choice: あなたこそ…です
  rationale: 明示された代名詞Σύの強調を、日本語として不自然にならない範囲で「こそ」によって表した。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 称号としての意味とキリスト論的な重みを保つ、明確で定着した表現を採用した。
theological_decisions:
- issue: 汚れた霊がイエスの前に身を伏せた行為を礼拝と訳すか
  choice: 「その前に倒れ伏し」として身体動作を訳した。
  alternative: 「イエスを礼拝し」または「イエスにひれ伏し」
  rationale: προσπίπτωは服従、懇願、畏敬などを伴って人の前に倒れ伏すことを表し得るが、この節自体はその行為を明示的に礼拝とは呼んでいない。そのため、神学的意味を先取りせず、動作を中心に訳した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「悪霊」ではなく「汚れた霊」を用いて原語の表現を保ち、反復の意味は「見るたびに」で明示した。
