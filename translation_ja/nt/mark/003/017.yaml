id: MRK.3.17
reference: Mark 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: ja
  text: また、ゼベダイの子ヤコブと、ヤコブの兄弟ヨハネ。（イエスはこの二人に「ボアネルゲ」という名をつけた[a]。これは「雷の子ら」という意味である。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「名」に当たる語が複数形。二人に与えられた一つの共通の呼び名を集合的に表していると考えられる。
    reason: 原文の複数形と、自然な日本語本文で用いた単数形との違いを示すため。
lexical_decisions:
- source_word: Ἰάκωβον
  choice: ヤコブ
  rationale: Ἰάκωβοςに対応する、日本語聖書で定着した人名表記。英語の伝統形Jamesを経由せず、ギリシア語名に即した。
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: ゼベダイの子
  rationale: 冠詞と属格による父子関係の特定を、自然で簡潔な日本語にした。
- source_word: Ἰωάννην
  choice: ヨハネ
  rationale: Ἰωάννηςに対応する、日本語で定着した人名表記。
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: ヤコブの兄弟
  rationale: 実の兄弟関係を示しつつ、原文が明示しない兄・弟の別を決めない表現とした。
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: この二人に…名をつけた
  rationale: ἐπιτίθημιとὄνομαの慣用的な意味を自然な日本語で表現した。主語は直前の文脈からイエスであるため、日本語で明確に補った。ギリシア語のὀνόματαは複数形だが、後続する共通の呼び名は一つなので本文では単数の「名」とし、形態上の情報を注記した。
- source_word: Βοανηργές
  choice: ボアネルゲ
  rationale: 本文が異言語の呼び名そのものとその意味の両方を保存しているため、呼び名は音写した。日本語で定着した表記を採用した。
- source_word: ὅ ἐστιν
  choice: これは…という意味である
  rationale: 後続句が呼び名の意味を説明する機能を、明瞭な現代日本語で示した。
- source_word: Υἱοὶ Βροντῆς
  choice: 雷の子ら
  rationale: 比喩的で印象的な呼び名を直訳し、複数形Υἱοίを「子ら」で保持した。
theological_decisions:
- issue: ヤコブとヨハネに与えられた呼び名の提示方法
  choice: 「ボアネルゲ」を音写し、その意味を「雷の子ら」と訳す
  alternative: 音写を省いて「雷の子ら」だけを示す
  rationale: 原文自身が異言語の呼び名とその解釈を併記しているため、両方を残して物語上の情報と原文の質感を保った。
- issue: ἀδελφόςにおける年長・年少関係
  choice: 「兄弟」として年長・年少を特定しない
  alternative: 「兄」または「弟」とする
  rationale: この節の原文は兄・弟の別を示していないため、文脈上の推測で限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準語。人名は日本語聖書で広く定着した表記を用いた。括弧は原文の挿入的説明に対応する。節単独でも代名詞の指示対象が分かるよう、ἐπέθηκενの省略主語を「イエス」と明示した。
