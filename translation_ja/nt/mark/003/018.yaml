  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: ja
  text: また、アンデレ、フィリポ、バルトロマイ、マタイ、トマス、アルファイの子ヤコブ、タダイ、それに熱心者のシモン[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「カナナイオス」。アラム語に由来する語のギリシア語形で、「熱心な者」を意味すると考えられる。別訳「熱心党のシモン」。
    reason: 原語の音写形と意味の幅を示し、「カナン人」という民族名との誤解を避けるため。
lexical_decisions:
- source_word: καὶ
  choice: また／読点／それに
  rationale: ギリシア語の並列的な名簿構造を保ちつつ、同じ接続詞を機械的に反復しない自然な現代日本語とした。冒頭の καὶ は前節からの継続を示す「また」とした。
- source_word: Ἀνδρέαν, Φίλιππον, Βαρθολομαῖον, Μαθθαῖον, Θωμᾶν, Θαδδαῖον
  choice: アンデレ、フィリポ、バルトロマイ、マタイ、トマス、タダイ
  rationale: 各人名を、現代日本語の聖書で広く理解される慣用的な表記で音写した。
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: アルファイの子ヤコブ
  rationale: 定冠詞と属格による人物の特定を、父子関係が明確になる自然な日本語で表した。
- source_word: Σίμωνα τὸν Καναναῖον
  choice: 熱心者シモン[a]
  rationale: Καναναῖος はカナン地方出身という民族・地理的呼称ではなく、アラム語系の語に由来し「熱心な者」を意味すると考えられる。固有の政治党派への所属まで本文で断定しないため、「熱心党の」ではなく「熱心者」とした。原語の形と別訳は脚注に示した。
theological_decisions:
- issue: シモンに付された Καναναῖος の意味
  choice: 民族名とはせず、「熱心者」と訳す。
  alternative: 「カナナイ人シモン」または「熱心党のシモン」
  rationale: ルカ6:15の並行箇所は ζηλωτής を用いており、「熱心な者」という理解を支持する。ただし、後代に知られる組織的な政治党派への所属まで原文が明示するとは限らないため、「熱心者」として歴史的・神学的な過剰確定を避けた。
translation_notes:
  register: 簡潔な名簿としての調子を保ち、現代の一般読者に明瞭で品位ある表現とした。人名は日本語聖書で定着した形を用い、列挙は読点を中心に自然に整えた。
