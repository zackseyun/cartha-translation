base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: ja
  text: さて、イエスの母と兄弟たちが来た。彼らは外に立ったまま、使いをイエスのところに送って、イエスを呼んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: 物語を次の場面へ進める接続辞。現代日本語で自然に場面転換を示す。
- source_word: ἔρχονται
  choice: 来た
  rationale: 物語に用いられた歴史的現在を、日本語では自然な過去形で表した。
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: イエスの母と兄弟たち
  rationale: 代名詞の指示対象を明確にしつつ、ἀδελφοίを解釈的に親族や実弟と限定せず「兄弟たち」と訳した。
- source_word: ἔξω στήκοντες
  choice: 外に立ち
  rationale: 場所と継続的な姿勢を簡潔に保った。
- source_word: ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν
  choice: 人を遣わしてイエスを呼んだ
  rationale: 目的語が明示されないἀπέστειλανは文脈上、人を遣わしたことを表すと理解し、καλοῦντεςの目的・付帯状況を自然な日本語に統合した。
theological_decisions:
- issue: 「兄弟たち」の関係
  choice: 「兄弟たち」と訳し、関係をそれ以上限定しない
  alternative: 実の弟たち／親族たち
  rationale: ἀδελφοίの通常の語義を保ちながら、生物学的兄弟か広い親族かという伝統上の論点を本文で決着させない。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「イエス」を補って指示対象を明確にし、語順は自然な日本語に整えた。
