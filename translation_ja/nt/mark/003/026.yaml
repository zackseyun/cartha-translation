  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: ja
  text: もしサタンが自分自身に逆らって立ち上がり、分裂したなら、立ち続けることはできず、終わりを迎えるのです。〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σατανᾶς
  choice: サタン
  rationale: 固有名として、現代日本語の聖書用語で広く定着している音写を用いた。
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: 自分自身に逆らって立ち上がり
  rationale: ἀνέστη の「立ち上がる」という表現を保ちつつ、ἐφ’ ἑαυτόν が文脈上示す敵対の方向を「逆らって」で自然に表した。
- source_word: ἐμερίσθη
  choice: 内部分裂した
  rationale: 受動形が表す、内部で分かれた状態を簡潔で明瞭な日本語にした。単なる物理的な分割ではなく、サタンの支配の内部対立を示す。
- source_word: οὐ δύναται στῆναι
  choice: 立ち続けることはできず
  rationale: στῆναι の「立つ」を残しながら、この文脈での存続・持続の意味を「立ち続ける」と表した。
- source_word: ἀλλὰ τέλος ἔχει
  choice: 終わりを迎えます
  rationale: 直訳的には「終わりを持つ」だが、日本語では不自然なため、存続できず終結に至るという慣用的な意味を、時点を過度に限定せず表した。
theological_decisions:
- issue: サタンの終わりについての発言の範囲
  choice: サタンが内部分裂したなら存続できず、終結するという論理的帰結として訳す
  alternative: この節だけでサタンの最終的・終末論的敗北がすでに完了したとの絶対的宣言として訳す
  rationale: この節は、イエスがサタンの力で悪霊を追い出しているという非難への反証の一部である。τέλος ἔχει の力を保ちつつ、直近の論証を越えた教理的内容を訳文に加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、条件文の論理と「立ち上がる／立ち続ける」の修辞的なつながりを保った。文体は自然でありながら、聖書本文にふさわしい落ち着いた格調を維持した。
