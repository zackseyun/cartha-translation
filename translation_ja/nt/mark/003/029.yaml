language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: ja
  text: しかし、聖霊を冒涜する者は、いつまでも赦しを得ることがなく[a]、むしろ永遠の罪について責任を負う[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「時代に至るまで赦しを持たない」。否定文中のこの表現は、ここでは「いつまでも赦しを得ない」「永遠に赦しがない」の意味。
    reason: lexical_alternative
  - marker: b
    text: 別訳「永遠の罪を負う」「永遠の罪に問われる」。
    reason: lexical_alternative
  - marker: c
    text: 写本によっては「永遠の罪」の代わりに「永遠の裁き」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: しかし、…者は
  rationale: ὃςとἄνによる不定関係節を日本語で自然な一般条件として表し、δέの対照的な働きを「しかし」で示した。
- source_word: βλασφημήσῃ
  choice: 冒瀆する
  rationale: 一般条件としてのアオリスト接続法を現在形で表し、宗教的・神学的な重みを保った。常用漢字外の「瀆」を含むが、語として定着した「冒瀆」は文脈に最も的確である。
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊を
  rationale: εἰςはここで冒瀆の対象を示すため、日本語では目的語の「を」が最も自然で明確である。
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: いつまでも赦しを得ることがなく
  rationale: 否定文中のεἰς τὸν αἰῶναを「いつまでも」とし、ἄφεσιςを「赦し」、ἔχειを自然な日本語の「得る」で表した。原文の継続的・永続的な否定を保つ。
- source_word: ἀλλὰ
  choice: （…なく）、
  rationale: 強い対照は「ことがなく、…」という日本語の連結で自然に表れるため、独立した「むしろ」は置かなかった。後半が前半の帰結的対照として明瞭になる。
- source_word: ἔνοχός ἐστιν
  choice: 罪に問われる
  rationale: 属格を伴うἔνοχοςの法廷的な「責任を負う／有罪となる」という含みを、現代日本語で自然な「罪に問われる」とした。「罪を犯している」と断定的に平板化せず、責任・拘束のニュアンスを残した。
- source_word: αἰωνίου ἁμαρτήματος
  choice: 永遠の罪
  rationale: SBLGNT本文のἁμάρτημαを直接訳し、αἰώνιοςを「永遠の」とした。異読の「裁き／刑罰」は本文に混入せず脚注で示す。
theological_decisions:
- issue: 赦されない行為の性質
  choice: 「聖霊を冒瀆する」とのみ訳し、解釈的な限定を加えない。
  alternative: 聖霊の証しを意図的かつ持続的に拒むこと、または聖霊の働きを悪霊の力とみなすこと、と説明的に訳す。
  rationale: 直前の文脈は理解に重要だが、この節自体の表現を保ち、特定の教理的説明を訳文へ持ち込まない。
- issue: 節末の本文異読
  choice: SBLGNTの「永遠の罪」を本文に採用する。
  alternative: 「永遠の裁き」または「永遠の刑罰」。
  rationale: 提示されたギリシア語本文はαἰωνίου ἁμαρτήματοςであるため本文ではこれに従い、異読は脚注に留める。
- issue: ἔνοχοςと属格の関係
  choice: 「永遠の罪に問われる」とし、法廷的責任の含みを保つ。
  alternative: 「永遠の罪を犯している」または「永遠の罪の責任を負う」。
  rationale: ἔνοχοςは「有罪である」と「責任を負う／拘束される」の幅を持つ。「罪に問われる」はその緊張を比較的自然に保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「赦し」「聖霊」は一般的な聖書語彙として保持した。「冒瀆」は難字を含むが、対象への重大な宗教的侮辱を正確に表す定着語であり、平板な「悪く言う」より原語の重みを伝える。脚注記号[a][b][c]はすべて本文に配置した。
