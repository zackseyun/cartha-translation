  to: イエスは怒りをもって彼らを見回し、彼らの心のかたくなさを悲しみながら、その人に言われた。「手を伸ばしなさい。」彼は手を伸ばした。すると、その手は元どおりになった。
  rationale: 「その心」を「彼らの心」に改め、原文の複数所有者を明確にした。ギリシア語の「心」は単数だが、日本語では「彼らの心」が集団的な用法として自然であり、意味を複数の心へ過度に分解しない。後半は原文のκαίによる出来事の連鎖を明瞭にするため、条件節ではなく連続文に整えた。
