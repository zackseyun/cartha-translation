  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: ja
  text: イエスは怒りをもって彼らを見回し、彼らの心のかたくなさを悲しみながら、その人に言われた。「手を伸ばしなさい。」彼は手を伸ばした。すると、その手は元どおりになった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 見回し
  rationale: 周囲の人々へ順に視線を向ける動作を、簡潔で自然な日本語で表す。アオリスト分詞の主動詞に先立つ関係は、文脈と語順から明瞭である。
- source_word: μετ’ ὀργῆς
  choice: 怒りをもって
  rationale: 怒りが視線に伴っていたことを明確にし、ὀργήの力を和らげずに保つ。
- source_word: συλλυπούμενος
  choice: 悲しみながら
  rationale: 痛みと悲しみを覚える意味を自然に表し、怒りと悲しみが同時に存在する原文の緊張を保つ。
- source_word: ἐπὶ τῇ πωρώσει
  choice: かたくなさを
  rationale: 悲しみの理由を示すἐπίと、鈍化・硬化を表す比喩を、聖書文脈でも一般読者に理解しやすい表現で伝える。
- source_word: τῆς καρδίας αὐτῶν
  choice: その心の
  rationale: 単数形καρδίαςと複数属格αὐτῶνの集合的表現を日本語の自然な集合単数で保持する。
- source_word: λέγει
  choice: 言われた
  rationale: マルコの歴史的現在を、日本語の物語として不自然にならない過去形で表す。敬語はイエスの発話を指す日本語聖書の端正な語調に適う。
- source_word: τῷ ἀνθρώπῳ
  choice: その人に
  rationale: 直前の文脈で特定されている男性を指す。日本語では「その人」が自然であり、性別を不必要に強調しない。
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: 手を伸ばしなさい
  rationale: 命令の直接性とἐκτείνωの動作を、明瞭で自然な命令表現で伝える。
- source_word: ἐξέτεινεν
  choice: 手を伸ばすと
  rationale: 命令と応答の語の反復を保ちつつ、後続する回復との時間的連続を自然な日本語で示す。
- source_word: ἀπεκατεστάθη
  choice: 元どおりになった
  rationale: 以前の正常な状態への回復というἀποκαθίστημιの意味を、「癒やされた」と狭めず明瞭に表す。
theological_decisions:
- issue: イエスの怒りと悲しみ
  choice: 「怒り」と「悲しみ」の両方を明示する
  alternative: 怒りを「憤り」などに弱める、または悲しみだけを強調する
  rationale: 本文は二つの感情を併置しているため、どちらも和らげたり調和的に説明したりせず、その神学的・道徳的緊張を保持する。
- issue: 「心」の単数形と複数の所有者
  choice: 「その心のかたくなさ」
  alternative: 「彼らの心々のかたくなさ」または「彼ら一人一人の心のかたくなさ」
  rationale: 原文のκαρδίαςは単数で集合的に用いられている。日本語の「その心」も集団に共有された内面的態度を自然に表し、個々人への分解を本文以上に強調しない。
translation_notes:
  register: 現代標準日本語による、明瞭で端正な物語文。「怒りをもって」は原文の強さを保ち、「かたくなさ」は心の硬化という比喩を維持する。歴史的現在は日本語の自然な叙述を優先して過去形とした。
