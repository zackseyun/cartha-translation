base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: ja
  text: イエスは再び会堂に入った。そこには、片手が萎えた人がいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「片手が縮んだ人」または「片手が干からびた人」とも訳せる。原語は、手が乾いて萎縮し、その状態が続いていることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （文脈上、独立した接続語としては訳出しない）
  rationale: 物語をつなぐ接続詞だが、日本語では節冒頭に「そして」を置かずとも連続性が自然に伝わる。
- source_word: εἰσῆλθεν πάλιν
  choice: 再び……入られた
  rationale: εἰσῆλθενの移動とπάλινの反復を簡潔に表す。主語は直前の文脈に基づき「イエス」と明示し、敬意を表す自然な叙述にした。
- source_word: εἰς συναγωγήν
  choice: 会堂に
  rationale: 冠詞のないσυναγωγήνは不特定の会堂とも読めるが、日本語では通常、冠詞性を明示せず「会堂に」と自然に訳せるため、本文では特定・不特定を決めすぎない。
- source_word: ἦν ἐκεῖ ἄνθρωπος
  choice: そこに……人がいた
  rationale: 存在を表すἦνと場所を示すἐκεῖを、自然な現代日本語の存在構文で表した。ἄνθρωποςはここでは性別を不必要に補わず「人」とした。
- source_word: ἐξηραμμένην ἔχων τὴν χεῖρα
  choice: 片手の萎えた
  rationale: ξηραίνωの完了受動分詞が示す、手が乾いて機能を失った持続的状態を「萎えた」で表す。日本語では「その手」より、患部が一方の手であることを自然に示す「片手」とした。
theological_decisions:
- issue: 主語の明示
  choice: イエス
  alternative: 彼
  rationale: ギリシア語本文では三人称単数の動詞だけだが、直前の文脈の主語はイエスである。日本語で「彼」とするより人物名を補う方が明瞭で、解釈上の新たな含意を加えない。
- issue: 会堂の特定性
  choice: 日本語本文では特定・不特定を明示しない「会堂に」
  alternative: ある会堂に／その会堂に
  rationale: ギリシア語は無冠詞だが、必ずしも不特定性を確定しない。日本語の無標の表現により、特定の会堂かどうかという曖昧さを保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、簡潔で品位ある物語調とした。「会堂」は新約聖書の文脈で一般に理解される語として保持した。
