  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: ja
  text: また、もし家が内部で分裂するなら、その家は立ち続けることができない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家」は「家の者から成る集団（家族・家政）」とも訳せる。ここでは、「立ち続ける」という表現に合わせて「家」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: 家
  rationale: 第一義の「家」を採用し、「立つ」という建物の比喩とのつながりを保つ。「家族・家の者」という意味もあり得るため脚注に示す。
- source_word: ἐφ’ ἑαυτὴν
  choice: 内輪で
  rationale: 自らに敵対して内部対立するという慣用的意味を、現代日本語で自然に表す。
- source_word: μερισθῇ
  choice: 分裂するなら
  rationale: ἐὰνを伴うアオリスト受動接続法の一般的条件を表し、内部が分かれるという意味を明確にする。
- source_word: οὐ δυνήσεται
  choice: できない
  rationale: 未来の能力・可能性の否定を、日本語の条件文に自然な形で表す。
- source_word: σταθῆναι
  choice: 立ち続けること
  rationale: 建物が立つ具体的比喩を保ちつつ、存続する・持ちこたえるという含意も伝える。
- source_word: ἡ οἰκία ἐκείνη
  choice: その家
  rationale: 指示語ἐκείνηの強調を自然な日本語の「その」で保持する。
- source_word: καὶ ἐὰν
  choice: また、もし
  rationale: 前節から論を続けるκαίと、条件を導くἐὰνの双方を表す。
