  source_fidelity: 「人の子ら」は τοῖς υἱοῖς τῶν ἀνθρώπων の字面的形を保とうとしているが、現代日本語では「人の子（＝人の子／人の子ら）」という別の定着した語感や、特定の人物を連想させる曖昧さを生み、この箇所の人類一般という意味を本文だけでは明確に伝えない。本文は自然な包括表現の「人々」とし、原語の文字どおりの形と一般的人類という意味は脚注で示すのが、意味の忠実さと明瞭さを最もよく両立する。
