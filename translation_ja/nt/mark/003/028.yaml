  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: ja
  text: まことに、あなたがたに言う。人々[a]には、あらゆる罪と、彼らが口にするあらゆる冒瀆も赦される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「人の子ら」。ギリシア語のこの表現は、男性だけでなく人類一般、すなわち「人間」または「人々」を指す。
    reason: 原文のセム語的・代表的男性表現の字面的形を示しつつ、本文で採用した自然な包括的意味を明確にするため。
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言う
  rationale: 共観福音書に特徴的な厳粛な導入句として、音写の「アーメン」ではなく、意味を明瞭に伝える現代日本語にした。直接の呼びかけも保持した。
- source_word: πάντα
  choice: あらゆる
  rationale: 後続する「罪」と「冒瀆」を包括する語であり、物一般を指す「すべてのもの」とはせず、範囲の広さを自然に示した。
- source_word: ἀφεθήσεται
  choice: 赦される
  rationale: 罪を文脈とするἀφίημιの未来受動形であり、神による赦しを簡潔に表す定訳的かつ自然な表現を採った。
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: 人の子らには
  rationale: 原文のセム語的で代表的な男性複数表現を本文に残し、与格は「には」で表した。現代日本語での包括的な意味は脚注で明示した。
- source_word: τὰ ἁμαρτήματα
  choice: 罪
  rationale: ここでは抽象的な罪性よりも罪となる行為を指すが、日本語では複数形を明示せず「罪」とするのが自然である。
- source_word: αἱ βλασφημίαι ὅσα ἐὰν βλασφημήσωσιν
  choice: 口にするどのような冒瀆の言葉も
  rationale: 冒瀆という発言行為と、ἐάνを伴う不定的で開かれた範囲をともに表した。「冒瀆」だけよりも、発話について述べていることが明瞭になる。
theological_decisions:
- issue: 聖霊に対する冒瀆についての次節の警告と、本節の赦しの範囲との関係
  choice: 本節自体は赦しの広さを全面的に述べる文として訳す
  alternative: 次節の例外を本節に先取りして限定を加える
  rationale: 原文はまず包括的な赦しを宣言し、その後で警告を述べる。本節に明示されていない限定を補わず、文脈が生む神学的緊張を保持した。
- issue: τοῖς υἱοῖς τῶν ἀνθρώπων の代表的男性表現
  choice: 本文では「人の子ら」とし、包括的意味を脚注で説明する
  alternative: 「人々」または「人間」と本文で意訳する
  rationale: 原文の比喩的・セム語的な形を保持しつつ、男性だけを意味しないことを脚注によって明確にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい格調を保った。「冒瀆」は文脈上の宗教的・神学的な重みを保持するために採用し、「言葉」を添えて発話行為であることを自然に示した。
