  naturalness: 明瞭な現代標準日本語であり、発話の文体も自然である。「群衆と弟子たちを呼び集め」とすると、両者が呼び集められ、共に語りかけられたことがより明快になる。
  terminology: 「十字架」「弟子たち」「従う」は適切である。「自分を捨てる」は、この文脈の自己を退けるという強い表現として自然に用いられる。「担う」は十字架の具体的な像を保つ。
