source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: ja
  text: それからイエスは、群衆と弟子たちを呼び集め、彼らに言われた。「わたしの後について来たいと思う者はだれでも[a]、自分を捨て、自分の十字架を担い[b]、わたしに従いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もしだれかが、わたしの後について来たいと思うなら」。
    reason: lexical_alternative
  - marker: b
    text: 「自分の十字架を担う」は、単に重荷に耐えるという意味に言い換えず、原文の十字架の像をそのまま保った表現。
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: 人々を自分のもとに招集する意味を自然な現代日本語で表した。アオリスト分詞の主動詞に先立つ動作は、「呼び寄せ、……言われた」という順序で保持した。
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: 群衆を弟子たちと一緒に
  rationale: 目的語である「群衆」と、同伴を表す「弟子たちと一緒に」の両方を保持し、群衆と弟子たちがともに話を聞く場面を示した。
- source_word: Εἴ τις θέλει ὀπίσω μου ἐλθεῖν
  choice: わたしの後について来たいと思う者はだれでも
  rationale: 一般に開かれた条件を自然な日本語で表しつつ、「後について来る」という弟子道の比喩を残した。後続のἀκολουθείτωは別に「従いなさい」と訳した。
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: 自分を捨て
  rationale: 単に欲望を我慢するという狭い意味ではなく、自己を退ける要求を表す、日本語聖書として明瞭で重みのある表現を選んだ。
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: 自分の十字架を負い
  rationale: 十字架という具体的な像と個人ごとの所有関係を保った。「負う」は日本語で十字架を担う行為を自然に示す。
- source_word: ἀκολουθείτω μοι
  choice: わたしに従いなさい
  rationale: 現在命令形の継続的な含みを、弟子として従うことを命じる自然な日本語で表した。継続性を説明的に付加しすぎないようにした。
theological_decisions:
- issue: 弟子となることへの招きと命令の力
  choice: 「……者はだれでも」と広く招き、その後を「自分を捨て……従いなさい」という命令で表した。
  alternative: 「もしだれかが……なら、その人は……しなければならない」と訳す。
  rationale: ギリシア語の条件節と三人称命令形が併せ持つ、開かれた招きと拘束力ある要求を保持した。特定の教派的な弟子論は加えていない。
- issue: σταυρόςの意味
  choice: 比喩を説明語に置き換えず、「十字架」と文字どおり訳した。
  alternative: 「重荷」「苦難」「処刑の道具」などと意訳する。
  rationale: この像はローマの十字架という歴史的現実に根差しており、「苦労」一般へと弱めたり、殉教だけに限定したりしないためである。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言には簡潔で重みのある文体を採用した。「それから」「言われた」により物語の流れと敬意を保ちつつ、古風すぎる語法は避けた。
