  source_fidelity: 原文のεὐθὺς（「すぐに」）、ἐμβὰς（舟に乗るという先行動作）、μετὰ τῶν μαθητῶν αὐτοῦ（弟子たちとの同伴）、ἦλθεν εἰς（目的地への移動）、およびτὰ μέρη Δαλμανουθά（ダルマヌタの地域一帯）を適切に反映している。文脈上明白な主語「イエス」を補うことも、この一節を独立して読めるようにする自然で安全な補いである。
  naturalness: 「そしてすぐに、イエスは弟子たちとともに舟に乗り、ダルマヌタ地方へ行った。」は明瞭な現代標準語であり、物語文としても自然である。「舟」と「とともに」は過度に古風ではなく、本文の品位にも適している。
  terminology: 「舟」はガリラヤ湖の文脈にふさわしく、「弟子たち」「ダルマヌタ地方」も安定した自然な用語である。地名は適切に音写されている。脚注はτὰ μέρηの複数形と、本文で集合的に「地方」と訳した判断を正確に説明している。
