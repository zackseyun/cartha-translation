  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: ja
  text: そしてすぐに、イエスは弟子たちとともに舟に乗り、ダルマヌタ地方[a]へ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ダルマヌタの諸地方」。ギリシア語では「部分、地方」を意味する語が複数形で用いられており、「ダルマヌタ一帯」とも訳せる。
    reason: 原文の複数表現と訳語の選択肢を示すため。
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐに
  rationale: 時間的な即時性と、マルコ福音書に特徴的な物語のテンポを、自然な現代日本語で表す。
- source_word: ἐμβὰς
  choice: 舟に乗り
  rationale: アオリスト分詞が主動詞に先立つ動作を示すため、順接の連用形で自然に表した。
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖周辺の文脈に適した小型の船を指す日本語として、「船」よりも「舟」が自然である。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちとともに
  rationale: μετά＋属格の同伴の意味を明確に保ち、格調を損なわない現代日本語とした。
- source_word: ἦλθεν
  choice: 行った
  rationale: 目的地への移動を外側から描く物語文脈なので、日本語では「来た」より「行った」が自然である。
- source_word: τὰ μέρη
  choice: 地方
  rationale: 原文は複数形だが、地域一帯を表す慣用的な表現であるため、本文では自然な単数的集合表現「地方」とした。複数形の字義は脚注で示す。
- source_word: Δαλμανουθά
  choice: ダルマヌタ
  rationale: 地名として原語の音を日本語で慣用的に音写した。
- source_word: implicit subject of ἦλθεν
  choice: イエスは
  rationale: ギリシア語では文脈から明らかな主語が動詞に含まれているが、この一節だけでも自然かつ明瞭に読めるよう、先行文脈上の主語を明示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、「とともに」によって簡潔で品位ある語調を保った。語順は原文の「すぐに」「舟に乗る」「目的地へ行く」という展開を維持している。
