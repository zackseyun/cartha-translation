base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: ja
  text: また、弟子たちは小魚を少し持っていた。イエスはそれらを祝福し、その小魚も人々の前に出すように言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: 小魚
  rationale: 指小辞のニュアンスを保ちつつ、現代日本語として自然にした。
- source_word: ὀλίγα
  choice: 少し
  rationale: 数の限られていることを、不可自然な直訳を避けて簡潔に表した。
- source_word: εὐλογήσας
  choice: 祝福し
  rationale: εὐλογέω の基本的意味を保ち、「感謝をささげ」と限定的に解釈しなかった。
- source_word: αὐτά
  choice: それらを
  rationale: 複数形の代名詞が直前の小魚を指すことを明示した。
- source_word: καὶ ταῦτα
  choice: これも
  rationale: καί の追加の意味と、ταῦτα の指示性を自然な日本語で表した。
- source_word: παρατιθέναι
  choice: 人々に配るように
  rationale: 食事の文脈における「前に置く、供する」の意味を、弟子たちが群衆に配るという自然な日本語で表した。
- source_word: εἶπεν
  choice: 言われた
  rationale: 動詞の基本義「言う」を保ちつつ、イエスへの敬意を示す標準的な文体とした。
theological_decisions:
- issue: εἶχον と παρατιθέναι の省略された主体・対象
  choice: 「弟子たちは」「人々に」を文脈から補った
  alternative: 主体と対象を明示せず「彼らは」「これも配るように」とする
  rationale: ギリシア語では文脈上、魚を持ち、配るよう命じられたのは弟子たちであり、配る相手は群衆である。日本語で指示関係を明瞭にするため補ったが、新たな神学的含意は加えていない。
translation_notes:
  register: 明快で現代的な標準日本語を用い、物語文として簡潔かつ品位のある調子に整えた。「小さい魚」より自然な「小魚」を採用し、命令内容は食事配布の文脈に即して「配るように」とした。
