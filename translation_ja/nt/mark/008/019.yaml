source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: ja
  text: 「わたしが五つのパンを五千人のために裂いたとき、かけらでいっぱいの籠を、あなたがたはいくつ拾い集めましたか。」弟子たちはイエスに言った。「十二です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε
  choice: ～たとき
  rationale: 過去の給食の出来事を振り返る時を示す節として、自然で直接的な日本語にした。
- source_word: τοὺς πέντε ἄρτους
  choice: 五つのパン
  rationale: ἄρτοςはここでは数えられるパンを指す。「五つのパン」は現代日本語で自然であり、文脈上、個々のパンであることも明確。
- source_word: ἔκλασα
  choice: 裂いた
  rationale: κλάωのパンを割る動作を具体的に保つ。「裂いた」は聖書的文脈にもなじみつつ、現代日本語で理解できる。
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: 五千人のために
  rationale: εἰςの方向・対象を自然に表す。男性だけと明示する語を補わず、原文の群衆の慣用的呼称を「五千人」とした。
- source_word: κοφίνους
  choice: 籠
  rationale: κόφινοςは籠を指す。別種の籠との細かな区別を本文へ持ち込まず、簡潔な一般語を用いた。
- source_word: κλασμάτων πλήρεις
  choice: パンのかけらでいっぱいになった
  rationale: κλάσμαが裂かれたパンの残りの断片を指すことを明確にし、語順は自然な日本語に整えた。
- source_word: ἤρατε
  choice: 拾い集めましたか
  rationale: αἴρωはこの場面では残ったかけらを回収する行為。「拾い集める」が文脈を自然かつ明確に伝える。
- source_word: λέγουσιν αὐτῷ
  choice: 弟子たちは言った
  rationale: ギリシア語は字義的には「彼らは彼に言う」。日本語の物語では過去形が自然で、発言者は直前の文脈から弟子たちと明らかなため明示した。
- source_word: Δώδεκα
  choice: 十二です
  rationale: 質問への簡潔な数の答えを保ち、日本語の直接話法として自然になるよう丁寧体にした。
theological_decisions:
- issue: πεντακισχιλίουςの指示範囲
  choice: 五千人
  alternative: 五千人の男たち
  rationale: 男性複数形ではあるが、この節では給食を受けた群衆の定型的な呼称として機能する。本文に「男」を補うと原文以上に限定する可能性があるため、曖昧さを保つ「五千人」とした。
- issue: 応答者の明示
  choice: 弟子たちは言った
  alternative: 彼らはイエスに言った
  rationale: 原文の代名詞の指示対象は文脈上弟子たちである。日本語で不自然な代名詞の連続を避けるため指示対象を明示したが、発言内容や神学的含意は加えていない。
translation_notes:
  register: イエスの問いは「わたし／あなたがた」と丁寧体を組み合わせ、威厳を保ちながら現代の一般読者に明快な語り口とした。籠は常用的な字形を用い、簡潔で朗読しやすい文に整えた。
