  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: ja
  text: 自分のいのちを救おうとする者は、それを失い、わたしと福音のために自分のいのちを失う者は、それを救うからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのち」は「魂」とも訳せる。ここで用いられているギリシア語は、文脈により「いのち」「自己」「魂」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: いのち
  rationale: 文脈は弟子としてイエスに従う際の生死を含む自己の全存在を指している。「いのち」は、地上の命を保とうとして失い、イエスと福音のために失って救うという逆説を自然に伝える。語の広がりを示すため「魂」の可能性は脚注に残す。
- source_word: σῶσαι / σώσει
  choice: 救おうとする／救う
  rationale: 同じ動詞を「救う」で統一し、ἀπόλλυμιとの対照と、単なる延命を超え得る神学的な含みを保つ。
- source_word: ἀπολέσει
  choice: 失う
  rationale: ψυχήを目的語とするこの文脈では「失う」が自然であり、対句の逆説を明瞭にする。「滅ぼす」はここでは他動的で強すぎる。
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: わたしと福音のために
  rationale: ἕνεκενが並列された「わたし」と「福音」の双方にかかる構造を簡潔で自然な日本語にした。原因・動機の意味も保持する。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: マルコ福音書の主要語としての文学的・神学的つながりを保ち、日本語の聖書用語としても広く定着している。
- source_word: ὃς ... ὃς
  choice: …者は…者は
  rationale: 不特定の誰にでも当てはまる格言的な構文を、自然で簡潔な日本語の「者」で表した。
- source_word: θέλῃ
  choice: …しようとする
  rationale: 意志・志向を表し、この文脈では「望む」より行動への企てを自然に伝える。
- source_word: αὐτοῦ / αὐτήν
  choice: 自分の／それを
  rationale: 日本語では再帰的所有を「自分の」で明確にし、後続の対格代名詞は直前の「いのち」を受ける「それを」とした。性別を不必要に明示しない日本語本来の表現である。
theological_decisions:
- issue: イエスの逆説的な教えにおけるψυχήの人間論的意味
  choice: 本文では「いのち」と訳す
  alternative: 「魂」と訳す
  rationale: 直前の文脈は自己否定と弟子として従うことを扱い、ここでは肉体と切り離された部分としての「魂」より、人の命・自己全体を表す「いのち」が適切である。ただし語義の幅と伝統的理解を排除しないよう脚注に「魂」を示す。
- issue: 「失う」と「救う」の終末論的含意
  choice: 時制や対象を説明的に限定せず、原文の逆説をそのまま保つ
  alternative: 「今の命を失う者は永遠の命を得る」などと明示する
  rationale: 原文は現世と終末、身体的生命と自己全体の含みを緊張のうちに置いており、訳文で一方に限定しない。
- issue: ἕνεκενの適用範囲
  choice: 「わたしと福音」の双方に「ために」をかける
  alternative: 「わたしのため、また福音のために」と反復する
  rationale: ギリシア語では一つの前置詞的表現が並列された二項を支配する。日本語では一度だけ「ために」を置くほうが自然で、意味も失われない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格言的で厳粛な調子を保った。「いのち」は「命」よりも自己全体を含む聖書的な響きを持たせるため、ひらがな表記とした。原文冒頭のγάρは、直前の自己否定と十字架を負う命令の理由を示すため、文末の「からである」で表した。
