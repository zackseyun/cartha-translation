  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: ja
  text: そして、彼は目を上げて言った。「人々が見えます。というのも、木のように見える人々が歩いているのが見えるからです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: 目が見えるようになると
  rationale: この文脈では、単に「見上げる」よりも視力の回復を表す用法と判断した。直前の癒やしの行為と、その後の「見える」という発言に自然につながる。
- source_word: τοὺς ἀνθρώπους
  choice: 人々
  rationale: 複数形をそのまま自然な現代日本語で表した。
- source_word: ὅτι
  choice: （独立した次の文として表現）
  rationale: ここでは知覚内容を導く用法、または理由を示す用法の余地がある。日本語では「人々が見えます。木のようなものが歩いているのが見えます」とし、見え方の説明として自然に伝えつつ、因果関係を過度に固定しない。
- source_word: ὡς δένδρα
  choice: 木のようなものが
  rationale: 視力がまだ不完全なため、人々が木に似た姿に見えているという比喩を保持した。「もの」を補い、日本語で人々を木そのものと断定する不自然さを避けた。
- source_word: περιπατοῦντας
  choice: 歩いている
  rationale: 現在分詞の継続的な動作を自然な日本語で表した。
theological_decisions:
- issue: 段階的な癒やしにおける最初の視覚状態
  choice: 視力が回復し始めたものの、まだ不鮮明であることが伝わる表現
  alternative: 「見上げると」と訳して身体動作を前面に出す
  rationale: ἀναβλέπωには両義があるが、癒やしの文脈と、木のように見えるという不完全な視覚の報告から、視力回復の意味が適切である。癒やしの神学的理由までは本文に加えない。
translation_notes:
  register: 明快で自然な現代標準日本語。病者本人の率直な報告として丁寧体を用い、原文の不完全で混乱した見え方を保った。
