  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: ja
  text: 「また、七つのパンを四千人に分けたとき、パン切れでいっぱいの大きな籠[a]を、いくつ拾い集めましたか。」弟子たちはイエスに、「七つです」と答えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語スピュリスは大きな籠を指し、マルコ8章19節で使われる、より小さな籠を指す語とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: また、…とき
  rationale: 直前の五千人の給食に続く第二の出来事を示すため、καίの付加・接続の働きとὅτεの時を表す意味を自然な日本語で示した。
- source_word: τοὺς ἑπτὰ
  choice: 七つ
  rationale: 原文は名詞を補わない省略表現で、文脈上は七つのパンを指す。日本語でも文脈から理解できるため、原文の省略を保った。
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: 四千人のために
  rationale: 給食の対象となった人々との関係を表すεἰςを、自然かつ簡潔に訳した。
- source_word: πόσων σπυρίδων
  choice: 大きな籠を、いくつ
  rationale: σπυρίςは8章19節のκόφινοςとは異なる大型の籠を指すため、その語彙上の区別を本文に明示した。
- source_word: πληρώματα κλασμάτων
  choice: パン切れでいっぱいになった
  rationale: πληρώματαの満ちた量と、κλάσματαがパンを裂いた残りの断片であることを、明瞭で自然な日本語にした。
- source_word: ἤρατε
  choice: 拾い集めましたか
  rationale: 残ったパン切れを回収した場面なので、単なる『持ち上げる』ではなく文脈に即した表現を選んだ。
- source_word: καὶ λέγουσιν αὐτῷ
  choice: 弟子たちはイエスに、…と答えた
  rationale: 歴史的現在を自然な日本語の過去形で表し、発話者と受け手を文脈に基づいて明示した。質問への応答なので『言った』より『答えた』が自然である。
- source_word: Ἑπτά
  choice: 七つです
  rationale: 籠の数を答える簡潔な返答として、現代日本語の会話に自然な丁寧形を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。イエスの問いは丁寧体、弟子たちの返答も丁寧体とし、自然さと品位を保った。原文で省略されている『パン』はτοὺς ἑπτὰには補わず、κλασμάτωνでは意味の明瞭化のため『パン切れ』とした。
