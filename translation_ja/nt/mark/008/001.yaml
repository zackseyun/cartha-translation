  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: ja
  text: そのころ、再び大勢の群衆がいて、彼らには食べる物が何もなかったので、イエスは弟子たちを呼び寄せ、彼らに言われる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「彼らに言う」と現在形になっている。マルコは、過去の出来事を生き生きと語るために、このような現在形をしばしば用いる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: そのころ
  rationale: 物語上の時を示す慣用句を、現代日本語で自然かつ簡潔に表した。期間を必要以上に限定しない。
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: 再び大勢の群衆が集まっていて
  rationale: πάλινの反復と、属格独立構文が示す背景状況を自然な日本語にした。ὄντοςは単に存在を示すが、文脈上、群衆がその場にいることを「集まっていて」と表現した。
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: 食べる物が何もなかったので
  rationale: 群衆に食べる物がないという意味を明確にし、後続の主文に対する事情・理由として自然につないだ。
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: 弟子たちを呼び寄せ
  rationale: προσκαλέομαιの、自分のところへ呼ぶという含みを「呼び寄せ」で簡潔に表した。所有代名詞は原文にないため付加しなかった。
- source_word: λέγει αὐτοῖς
  choice: 彼らに言われる
  rationale: マルコが用いる歴史的現在を保ちつつ、イエスへの敬意を示す自然な聖書日本語とした。
theological_decisions:
- issue: マルコに特徴的な歴史的現在
  choice: 現在形の「言われる」を保持する
  alternative: 過去形の「言われた」に整える
  rationale: 教理上の相違ではないが、原文の生き生きとした語り口を伝えるため、λέγειの現在形を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、叙述には落ち着いた品位を保った。文末は次節の直接話法へ続くため、句点の後に脚注標識を置いた。
