  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: ja
  text: 「この群衆がかわいそうだ。というのは、もう三日間もわたしのもとにとどまっていて、食べる物が何もないからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον
  choice: 群衆がかわいそうだ
  rationale: σπλαγχνίζομαι は内から湧く深いあわれみを表す。現代日本語では「かわいそうだ」が自然で、感情を過度に説明せず、ἐπὶ τὸν ὄχλον が示すあわれみの対象も明確にできる。
- source_word: ὅτι
  choice: のに
  rationale: 原文ではあわれみの理由を導く。日本語では、群衆が長く同行していながら食物を持たない窮状を自然につなぐ「のに」によって因果関係を文脈的に表した。単純な「なぜなら」より発話として自然である。
- source_word: ἤδη ἡμέραι τρεῖς
  choice: もう三日も
  rationale: ἤδη の「すでに／もう」と三日という継続期間を表す。「も」は期間の長さに対する含みを自然に示すが、原文以上の具体的情報は加えない。
- source_word: προσμένουσίν μοι
  choice: 私と一緒にいる
  rationale: προσμένω と与格 μοι は、彼らがイエスのもとにとどまり続けていることを示す。完了的な継続は「もう三日も」で十分に表されるため、自然な現在表現とした。
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: 食べる物が何もない
  rationale: 食べるための物を持っていないという慣用的構文を、明快で自然な日本語にした。
theological_decisions: []
translation_notes:
  register: イエスの直接話法として、簡潔で現代的ながら品位のある常体を用いた。「憐れに思う」も可能だが、一般読者に即時に伝わる「かわいそうだ」を採用した。
