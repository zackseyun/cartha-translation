id: MRK.8.38
reference: Mark 8:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: ja
  text: というのも、だれでも、姦淫を行うこの罪深い世代の中で、わたしとわたしのことばを恥じるなら、人の子も、ご自分の父の栄光を帯びて聖なる天使たちとともに来るとき、その人を恥じるからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: 恥じる／恥じる
  rationale: 人物やそのことばを恥とする意を直接表し、現在の人間の応答と将来の人の子の応答との対応を保つ。「拒む」「見捨てる」では原語以上に意味を強める。
- source_word: λόγους
  choice: ことば
  rationale: 複数形の内容を集合的に自然な日本語で表しつつ、イエスが語ったことばという個人的・言語的な強調を保つ。「教え」や「福音」と限定しない。
- source_word: γενεᾷ
  choice: 世代
  rationale: 同時代の人々とその道徳的状況を含む標準的な訳語。「時代」だけでは人々への言及が弱くなる。
- source_word: μοιχαλίδι
  choice: 姦淫を犯す
  rationale: 預言者的な姦淫の比喩を本文に具体的に残す。日本語として不自然な「姦淫の世代」を避け、脚注で神への不忠実という含意を示す。
- source_word: ἁμαρτωλῷ
  choice: 罪深い
  rationale: 形容詞の意味を率直に表し、「邪悪な」のような不要な強調を加えない。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 確立した称号を保持し、単なる「わたし」や「メシア」に置き換えず、終末論的・聖書間の響きを残す。
- source_word: δόξῃ
  choice: 栄光
  rationale: 神的な誉れと輝きを表す標準的な聖書語であり、原文の神学的重みを保つ。
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: 聖なる天使たちとともに
  rationale: 冠詞を伴う形容詞的構文を自然に表す。原文にない所有表現「ご自分の天使たち」は加えない。
- source_word: ὃς γὰρ ἐὰν
  choice: というのも、…者を…からである
  rationale: 一般的条件の意味を「…者」で表し、γάρが前文への理由・説明を導く働きも保持する。
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: この…世代の中で
  rationale: 恥じる行為が現れる社会的・道徳的環境を示すἐνの働きを明確にする。
theological_decisions:
- issue: 「姦淫を犯す」の比喩的な力
  choice: 預言者的な姦淫の比喩を本文に残し、脚注で神への不忠実という含意を示す。
  alternative: 「神に不忠実な」と本文で明示する。
  rationale: μοιχαλίδιは具体的な姦淫の語を用いており、契約上・霊的な不忠実を想起させる。本文で比喩を解消すると、旧約預言との響きが失われる。
- issue: 「人の子」の指示対象
  choice: 自己言及的で終末論的な称号「人の子」をそのまま保つ。
  alternative: 「わたし」または「メシア」とする。
  rationale: 原文は独自のキリスト論的称号を用いる。「わたし」などに置き換えると、その含意と表現上の緊張が平板になる。
- issue: αὐτόνの表現
  choice: 関係節の先行詞を「者」、目的語を「その者」と重ねず、自然な日本語の構文で同一人物への応答を表す。
  alternative: 「その人を」と明示する。
  rationale: ギリシア語は一般条件を単数男性形で表すが、日本語の「者」は性別を不必要に限定せず、個々人を指す単数的・代表的な力を保てる。
- issue: τοῦ πατρὸς αὐτοῦの所有関係
  choice: 「ご自分の父」として、人の子と父との関係を明示する。
  alternative: 単に「父」とする。
  rationale: αὐτοῦの所有関係を訳出し、日本語では敬意を保ちながら指示対象を明確にする。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「人の子」「栄光」など神学的に重要な聖書語は保持した。「御使い」より一般読者に明確な「天使」を用いた。文頭のγάρは「というのも」、文末は「からである」として前節との説明関係を示した。
