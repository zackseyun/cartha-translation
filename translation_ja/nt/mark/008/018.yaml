base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: ja
  text: 目がありながら、見ないのですか。耳がありながら、聞かないのですか。また、覚えていないのですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: 目がありながら
  rationale: 分詞構文の譲歩的・修辞的な働きを、自然な現代日本語で保った。
- source_word: βλέπετε
  choice: 見えないのですか
  rationale: 基本義である「見る」を保ちつつ、目があることとの対照が自然に響く自発的表現とした。文脈上は霊的な知覚も含意しうる。
- source_word: ὦτα ἔχοντες
  choice: 耳がありながら
  rationale: 前半との並行構造を保ち、同じ譲歩表現で訳した。
- source_word: ἀκούετε
  choice: 聞こえないのですか
  rationale: 基本義の「聞く」を保ち、耳があることとの修辞的対照を自然な日本語で表した。理解や従順という含意は文脈に委ねた。
- source_word: μνημονεύετε
  choice: 思い出さないのですか
  rationale: 以前の出来事を想起しないことへの叱責として、明瞭で自然な表現を選んだ。
- source_word: καὶ
  choice: それでも
  rationale: 最後の問いを先行する二問に累加しつつ、弟子たちの鈍さを問う流れが日本語で明瞭になるようにした。
- source_word: οὐ / οὐκ
  choice: ない
  rationale: 各節の否定を、日本語の修辞疑問として自然な「～ないのですか」で表した。
theological_decisions:
- issue: 「見る」「聞く」の感覚的意味と比喩的意味
  choice: 本文では具体的な動詞「見る」「聞く」を保ち、霊的な知覚の鈍さは文脈に含意させる。
  alternative: 「悟る」「理解する」と訳して比喩的意味を明示する。
  rationale: ギリシア語は通常の感覚動詞を用いており、そのまま訳すことで預言書を思わせる修辞性と、字義・比喩の重なりを保てる。
translation_notes:
  register: 明瞭で現代的な敬体。イエスの厳しい修辞疑問を保ちながら、過度に古風または教派的な表現を避けた。
