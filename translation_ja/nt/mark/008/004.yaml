id: MRK.8.4
reference: Mark 8:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: ja
  text: 弟子たちはイエスに答えた。「こんな人里離れた所で、いったいどこからパンを得て、この人たちを満腹させることができるでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 答えた
  rationale: 物語における応答を表す標準的な訳で、自然かつ直接的である。
- source_word: ὅτι
  choice: 「」
  rationale: 応答動詞の後で直接話法を導くため、日本語では語として訳さず、かぎ括弧で示すのが自然である。
- source_word: Πόθεν
  choice: いったいどこから
  rationale: 供給源を問う「どこから」という原義を保ち、「いったい」で困難さをにじませる。単に「どうやって」として方法の問いに限定しない。
- source_word: τούτους
  choice: この人たち
  rationale: 群衆を指す男性複数代名詞を、性別を不必要に限定せず明示する。
- source_word: δυνήσεταί τις
  choice: できるでしょうか
  rationale: 不定代名詞τιςは日本語では非人称的な可能表現に自然に含め、未来的・見込み上の可能性を「でしょうか」で表す。
- source_word: ὧδε
  choice: こんな…所で
  rationale: 場所を示す「ここで」を、ἐπ’ ἐρημίαςと一体にして自然な現代日本語にした。
- source_word: χορτάσαι
  choice: 満腹させる
  rationale: 単に食べ物を与えるだけでなく、十分に食べさせて満たす意味を明確に保つ。
- source_word: ἄρτων
  choice: パンを得て
  rationale: ἄρτοςの具体的な食物を「パン」として保つ。日本語で供給源を問う文として自然にするため、「どこからパンを得て」と構成した。
- source_word: ἐπ’ ἐρημίας
  choice: 人里離れた所で
  rationale: 人の住まない、物資を得にくい場所という文脈上の意味を、現代日本語で明瞭に表す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保った。Πόθενの供給源への問いとχορτάσαιの十分に食べさせる含意を両立させた。原文のτιςは日本語で明示すると不自然になりやすいため、可能表現に含めた。
