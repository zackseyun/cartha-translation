id: MRK.8.33
reference: Mark 8:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: ja
  text: しかし、イエスは振り向いて弟子たちを見ると、ペテロを厳しく叱って言われた。「サタン、わたしの後ろに下がれ。あなたは神のことに心を向けず、人間のことに心を向けているからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: 振り向いて
  rationale: 文脈上の身体的な向き直りを、自然な現代日本語で表した。
- source_word: ἰδὼν
  choice: 弟子たちを見ると
  rationale: 二つの分詞による動作の流れを保ちつつ、後続の叱責へつながる状況として自然に表した。
- source_word: μαθητὰς
  choice: 弟子たち
  rationale: 福音書における μαθητής の定着した訳語であり、イエスに学び従う者という意味を保つ。
- source_word: ἐπετίμησεν
  choice: 厳しく叱って
  rationale: 強い言葉による叱責を表す語の力を、一般読者に明瞭な表現で示した。
- source_word: καὶ λέγει
  choice: 言われた
  rationale: 歴史的現在を、日本語の物語として自然な過去の叙述に整え、敬意を示す語形とした。
- source_word: Ὕπαγε ὀπίσω μου
  choice: わたしの後ろに下がれ
  rationale: 単に立ち去るというより、イエスの前ではなく後ろの位置へ退くよう命じる表現の具体性を保った。
- source_word: Σατανᾶ
  choice: サタン
  rationale: 呼びかけの固有名・称号として音写し、「敵対者」だけに意味を限定しなかった。
- source_word: φρονεῖς
  choice: 心を向けている
  rationale: 単なる思考ではなく、関心、志向、価値判断を含む語義を自然な日本語で表した。
- source_word: τὰ τοῦ θεοῦ
  choice: 神のこと
  rationale: 広い意味を持つ属格表現を過度に「計画」「利益」などへ限定せず、その開かれた意味を保った。
- source_word: τὰ τῶν ἀνθρώπων
  choice: 人間のこと
  rationale: ἀνθρώπων はここで人類一般を指すため、性別を限定せず、神との対比も明瞭な「人間」とした。
theological_decisions:
- issue: ペテロに対する「サタン」という呼びかけの指示対象
  choice: イエスがペテロを叱り、その本人に「サタン」と鋭く呼びかける形をそのまま訳した。
  alternative: ペテロの背後にいるサタンだけへの呼びかけ、または非人格的な「敵対者」の意味に限定する。
  rationale: ἐπετίμησεν Πέτρῳ により叱責の直接の対象はペテロである。彼が文字どおりサタンであるとの説明は加えず、発言がサタン的な反対と重なるという本文の緊張を保った。
- issue: 神のことと人間のことの対比
  choice: 「神のこと」「人間のこと」と広く訳した。
  alternative: 「神の利益」「人間の計画」など、特定の意味に絞る。
  rationale: 二つの中性複数表現は広い含意を持つため、神学的な内容を訳文で狭く規定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叱責の強さと荘重さを保った。「わたしの後ろに下がれ」は命令の空間的比喩を残し、「心を向ける」によって φρονεῖς の思考以上の志向性を表した。日本語の「人間」はもともと男女を含むため、英語版のジェンダーに関する注は不要と判断した。
