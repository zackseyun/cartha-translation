  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: ja
  text: それからイエスはもう一度、彼の目に両手を置かれた[a]。すると彼は、はっきり見えるようになり、元どおりになり、すべてのものをくっきりと見ていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本には本文と異なる表現を読み、「そして彼はじっと見つめ、元どおりになり、すべてのものがはっきり見えた」などと訳せるものがあります。
    reason: textual_variant
  - marker: b
    text: 「そして、すべてのものがはっきり見えるようになった」とも訳せます。最後の句では、継続する状態を表し得る未完了過去形の動詞と、明瞭な見え方を示す副詞が用いられています。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: それから……もう一度
  rationale: εἶταの時間的な進行と、πάλινの反復の双方を自然な日本語で表し、二段階の癒やしの順序を保った。
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 彼の目に両手を置かれた
  rationale: 「手を置く」という具体的な動作を保ち、複数形τὰς χεῖραςも「両手」として明示した。主語は文脈上イエスなので、現代日本語として分かりやすく補った。
- source_word: διέβλεψεν
  choice: はっきり見えるようになり
  rationale: διαβλέπωがここで示す明瞭な視力の回復を表す。「見つめた」とはせず、部分的に見えていた状態から明瞭に見える状態への進展を伝えた。
- source_word: ἀπεκατέστη
  choice: 元どおりになって
  rationale: ἀποκαθίστημιの「本来の、または以前の状態に回復する」という意味を、過度に医学的・神学的に限定せず自然に表した。
- source_word: ἐνέβλεπεν
  choice: 見えていた
  rationale: 未完了過去の継続的・結果状態的な含みを、「見た」ではなく「見えていた」で表した。
- source_word: τηλαυγῶς
  choice: くっきりと
  rationale: 明瞭な視認を示す副詞として自然な日本語を選び、直前の「はっきり」との単調な重複を避けた。遠方を見る含みは確定的でないため本文には加えなかった。
- source_word: ἅπαντα
  choice: すべてのもの
  rationale: 中性複数の包括性を保ち、見える対象全体を自然に表した。
theological_decisions:
- issue: 二段階で進む癒やしの物語的描写
  choice: 「もう一度」「見えるようになり」「元どおりになって」「見えていた」という進行を保つ
  alternative: すべてを単純な完了動作としてまとめ、「完全に見えるようになった」と一文で平板化する
  rationale: ギリシア語は複数の動詞を連ね、最後に未完了過去ἐνέβλεπενを用いる。癒やしが段階的に進み、その結果として見え続けていたという描写を、解釈で単純化せず保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、敬意ある物語文としてイエスの動作には尊敬表現「置かれた」を採用した。逐語調になりすぎない範囲で、三つの動詞の連続と最後の未完了過去のニュアンスを保持した。
