  source_fidelity: 本文は二度目に手を置く行為、明瞭な視覚、回復、そして最後の未完了過去による継続的な視覚をおおむね保っています。しかし、ἐνέβλεπενは能動態であり、「すべてのものが…見えていた」より「すべてのものを…見ていた」とするほうが原文の主語と動作を明確に反映します。
  naturalness: 「すべてのものがくっきりと見えていた」は日本語として理解できますが、前半の主語「彼は」から外れ、対象が主語となるため、原文の能動的な叙述が弱まります。「すべてのものをくっきりと見ていた」は明快な現代標準日本語です。
  terminology: 「両手を置かれた」「元どおりになって」は適切です。「元どおりになり」と接続を整え、最後を能動表現に改めます。写本注は、単なる語順の相違ではなく本文と異なる読みであることを明示します。
