  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: ja
  text: 人々はおよそ四千人であった。そして、イエスは彼らを帰らせた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「解散させた」。
    reason: ἀπολύωは、この文脈では人々を帰らせることとも、集まりを解散させることとも表現できるため。
lexical_decisions:
- source_word: ἦσαν
  choice: 人々は…であった
  rationale: ここでは群衆の人数を述べる存在表現であり、日本語では「人々は…であった」とするのが自然である。
- source_word: δὲ
  choice: （独立には訳出しない）
  rationale: 弱い接続を示す語であり、文脈上、日本語で明示しなくても流れが自然に保たれる。
- source_word: ὡς
  choice: およそ
  rationale: 数がおおよそのものであることを明確かつ簡潔に示す。
- source_word: τετρακισχίλιοι
  choice: 四千人
  rationale: 群衆の人数を表すため、日本語では助数詞「人」を添える。
- source_word: καὶ
  choice: それから
  rationale: 人数についての叙述から、群衆を帰らせる次の行為への自然な移行を示す。
- source_word: ἀπέλυσεν
  choice: 帰らせた
  rationale: この文脈では、集まっていた群衆を解散させて帰途につかせる意味。現代日本語として自然な「帰らせた」を本文に採用する。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 直前の群衆を受ける複数代名詞として訳す。
