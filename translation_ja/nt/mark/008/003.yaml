  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: ja
  text: もし空腹のまま家に帰らせたら、途中で力尽きてしまうだろう。中には遠くから来ている人もいる。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσω
  choice: 帰らせたら
  rationale: 群衆を解散させ、それぞれの家へ向かわせる文脈を、自然な現代日本語で表した。
- source_word: νήστεις
  choice: 空腹のまま
  rationale: 意図的・宗教的な断食ではなく、食べ物を口にしていない状態を指すため。
- source_word: εἰς οἶκον αὐτῶν
  choice: 家に
  rationale: 各人が自分の家へ帰るという配分的な意味は、日本語では文脈上自然に伝わる。
- source_word: ἐκλυθήσονται
  choice: 力尽きてしまう
  rationale: 道中で衰弱し、動けなくなるほど疲弊する意味を、倒れることに限定しすぎず明確に表す。
- source_word: ἐν τῇ ὁδῷ
  choice: 途中で
  rationale: 帰途・道中を表す自然で簡潔な日本語。
- source_word: καί τινες αὐτῶν
  choice: 中には…人もいる
  rationale: 群衆の一部を取り出すギリシア語の意味を、日本語らしく表した。
- source_word: ἀπὸ μακρόθεν
  choice: 遠くから
  rationale: 彼らが旅して来た距離の大きさを自然に示す。
- source_word: ἥκασιν
  choice: 来ている
  rationale: 遠方から来て今ここにいるという完了形の結果状態を保つ。
theological_decisions: []
