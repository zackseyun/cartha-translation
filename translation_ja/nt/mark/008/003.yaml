  register: 明瞭で現代的な標準日本語。イエスの懸念が自然に伝わるようにしつつ、ἐκλυθήσονταιを身体的な失神や転倒だけに狭めず「力尽きる」とした。引用末尾の節であるため閉じかぎ括弧を付した。
