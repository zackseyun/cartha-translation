reference: Mark 8:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: ja
  text: そこでイエスは、群衆に地面に身を横たえるよう命じた[a]。それから、七つのパンを取り、感謝をささげてから、それを裂き、弟子たちが群衆の前に置くために、弟子たちに渡し続けた[b]。弟子たちはそれを群衆の前に置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地面に座るように」とも訳せる。原語は、食事のために身を横たえる、または寄りかかる姿勢をより具体的に表す。
    reason: lexical_alternative
  - marker: b
    text: 「群衆に配るために」とも訳せる。原語は直訳すると「（それを）群衆の前に置く」で、食物を給仕することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: 命じた
  rationale: 権威をもって指示する意味を保つため。「指示した」も可能だが、原語の命令性をより明確に表した。歴史的現在は、自然な日本語の物語文として過去形にした。
- source_word: ἀναπεσεῖν
  choice: 座る
  rationale: 食事のために身を横たえる動作を指すが、現代日本語本文では「座る」が最も自然で理解しやすい。食事時の姿勢という具体的な含みは脚注に残した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地面に
  rationale: ここでのγῆは群衆が腰を下ろす地表を指すため、文脈に即して自然な「地面」とした。
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: 七つのパンを取り
  rationale: ἄρτοιはこの給食物語ではパンのまとまりを指す。「七つのパン」は日本語として明瞭で、原文の数も保つ。
- source_word: εὐχαριστήσας
  choice: 感謝をささげた後
  rationale: 食物を前にした感謝を表す。感謝の相手を原文は明示していないため、「神に」を補わず、宗教的文脈にもふさわしい自然な表現とした。
- source_word: ἔκλασεν
  choice: それを裂いて
  rationale: 目的語は直前のパンから明らかなので「それ」を補った。パンを分ける動作には「割る」より「裂く」が聖書物語の文脈で自然かつ具体的である。
- source_word: ἐδίδου
  choice: 次々に渡し
  rationale: 未完了過去が示しうる継続・反復的な授受を「次々に」で表した。単に「渡した」とするより、配るために繰り返し渡した動作が伝わる。
- source_word: ἵνα παρατιθῶσιν
  choice: 群衆に配らせた
  rationale: 直訳は食物を人々の前に置くことだが、この場面では給仕する、配るという意味になる。本文では自然な日本語を採り、具体的な直訳は脚注に示した。
- source_word: παρέθηκαν
  choice: 弟子たちはそれを群衆に配った
  rationale: 同じπαρατίθημιの語幹を、直前と一貫して「配る」と訳した。アオリストの完結した物語動作を簡潔な過去形で表した。
- source_word: ὄχλος
  choice: 群衆
  rationale: 多数の人々の集まりを指す語として、現代の聖書文体にも一般読者にも自然である。
theological_decisions:
- issue: 感謝の祈りと聖餐的な響き
  choice: 「感謝をささげた後」と訳し、聖餐を明示する用語は加えない
  alternative: 「神に感謝の祈りをささげた後」または聖餐を連想させる表現
  rationale: この語は後のキリスト教の聖餐実践を響かせる可能性がある一方、本文自体は通常の食事に際する感謝としても読める。原文にない対象や教理的説明を加えず、その響きと曖昧さを保った。
- issue: パンが増えた過程の表現
  choice: 未完了過去を「次々に渡し」と訳すにとどめる
  alternative: パンが超自然的に増え続けたことを訳文で明示する
  rationale: 文脈は奇跡的な給食を物語るが、この節のἐδίδου自体は継続・反復する授受を表し、その仕組みを説明してはいない。訳文では本文が述べる範囲を越えないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、物語文として簡潔で品位のある調子にした。イエスに対する過度な敬語は避け、原文の権威性は「命じた」で示した。継続的な動作は「次々に」で自然に表し、語義上の具体性が本文で薄れる箇所は脚注で補った。
