  text: And they were discussing with one another that they had no bread[a].
translation:
  language: ja
  text: そして弟子たちは、「自分たちにはパンがない」と互いに話し合っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「パン〔複数〕を持っていない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: 話し合っていた
  rationale: 未完了過去が表す継続中のやり取りを自然な現代日本語で示す。「論じ合っていた」も可能だが、この場面ではやや硬く、議論の対立性を強く感じさせるため避けた。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 相互のやり取りを表す慣用句を、簡潔で自然な日本語にした。
- source_word: ὅτι
  choice: 「自分たちにはパンがない」と
  rationale: 話し合いの内容を導く接続詞と理解し、日本語では引用の形で明確かつ自然に表した。ただし原因を示す読みも文法上可能なので脚注に残した。
- source_word: ἄρτους
  choice: パン
  rationale: 日本語の「パン」は個数を明示しなくても自然に用いられる。原語が複数形であり、直前の文脈ではパンの個数が問題となっていることを脚注で示した。
- source_word: οὐκ ἔχουσιν
  choice: 自分たちにはパンがない
  rationale: 原文では現在形だが、過去の物語中の間接的な発言内容として、現代日本語では「ない」が自然である。主語は弟子たち自身であるため「自分たちには」とした。
theological_decisions:
- issue: ὅτι の内容用法と原因用法
  choice: 話し合いの内容として「パンがない」と訳す
  alternative: 「パンがなかったので、互いに話し合っていた」
  rationale: ὅτι は内容にも原因にも用いられる。文脈上は、弟子たちが交わした話の内容を示す読みが自然だが、原因を示す可能性も排除せず脚注に示した。特定の神学的解釈に寄せず、原文の統語的な幅を保持する。
translation_notes:
  register: 明瞭で自然な現代標準語を用いながら、物語文としての落ち着いた格調を保った。「そして」で καί を反映し、未完了過去の継続性は「話し合っていた」で示した。
