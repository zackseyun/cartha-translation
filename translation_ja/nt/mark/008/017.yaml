  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: ja
  text: イエスはそれに気づいて、彼らに言われた。「パンがないことをなぜ話し合っているのですか。まだ分からず、理解もしないのですか。あなたがたの心はかたくなになっているのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: それに気づいて
  rationale: アオリスト分詞は、弟子たちの話し合いをイエスが察知したことを示す。目的語は直前の文脈から補い、「それに」で自然に表した。
- source_word: διαλογίζεσθε
  choice: 論じ合っている
  rationale: 複数の弟子たちが互いに話し、考えを巡らせている文脈を表す。単なる発話より熟慮・議論の含みを保つ。
- source_word: ἄρτους
  choice: パン
  rationale: 原語は複数形だが、日本語では個数を明示しない「パン」がこの文脈で自然であり、不足している食物を正確に示す。
- source_word: νοεῖτε
  choice: 悟らず
  rationale: 知的・霊的に認識する意味を表し、後続の συνίετε「理解する」との修辞的な並行と差異を保つ。
- source_word: συνίετε
  choice: 理解できない
  rationale: 物事の意味やつながりを理解することを表す。νοεῖτε と同一語にせず、二つの動詞の重なりを残した。
- source_word: πεπωρωμένην
  choice: かたくなになっている
  rationale: 完了受動分詞が示す、硬化して感受性を失った現在の状態を自然な日本語で表す。
- source_word: καρδίαν
  choice: 心
  rationale: 感情だけでなく、理解力や応答性を含む内なる人を指す原語の比喩を保持する。
theological_decisions:
- issue: 弟子たちの心の状態を問う最後の疑問文
  choice: あなたがたの心はかたくなになっているのですか
  alternative: あなたがたは心をかたくなにしているのですか
  rationale: 原文の ἔχετε＋目的語＋完了受動分詞は直訳的には「心をかたくされた状態で持っているか」だが、日本語で自然に状態を問う形とした。受動・結果状態の含みを保ち、弟子たち自身が意図的に心を固くしたと断定する表現は避けた。
translation_notes:
  register: 現代の一般読者に明瞭な、敬意と緊張感のある文体。イエスの問いを丁寧形で統一しつつ、叱責の鋭さを保った。「心」は聖書的比喩として維持した。
