  terminology: 「心」「かたくなになっている」は、καρδίαおよびπεπωρωμένηνの比喩と、受動的な結果状態を自然に伝えています。原文の単数「心」は日本語では複数の聞き手に対しても集合的に「あなたがたの心」とすることが可能であり、変更不要です。
