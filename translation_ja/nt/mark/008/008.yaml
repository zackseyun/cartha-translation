  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: ja
  text: 人々は食べて満腹した。そして、残ったパン切れを七つの籠[a]に集めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「籠」と訳したギリシア語はσπυρίςで、比較的大きな籠を指すと考えられる。五千人に食べ物を与えた場面（6:43）で使われている「籠」（κόφινος）とは別の語。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: 食べて
  rationale: アオリストの平明な叙述として、強意を加えず自然な日本語にした。
- source_word: ἐχορτάσθησαν
  choice: 満腹した
  rationale: 十分に食べて満たされたことを表す。受動形を機械的に再現するより、現代日本語で自然かつ簡潔である。
- source_word: ἦραν
  choice: 集めると
  rationale: αἴρωの「取り上げる」という基本義を、残ったパン切れを回収する文脈に即して自然に表した。後続する数量結果とのつながりも明瞭になる。
- source_word: περισσεύματα κλασμάτων
  choice: 余ったパン切れ
  rationale: περισσεύματαは余り、κλάσματαは割かれた食物、とりわけ文脈上パンの切れを指す。属格関係を自然な日本語の一語句にまとめた。
- source_word: ἑπτὰ σπυρίδας
  choice: 大きな籠七つ分
  rationale: σπυρίςは籠を指し、マルコ6:43のκόφινοςとは別語で、比較的大きな籠だった可能性がある。「七つ分」により、集めた残り物の量を数えるギリシア語の表現を自然に伝えた。
theological_decisions: []
