  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: ja
  text: 弟子たちはイエスに答えた。「『バプテスマのヨハネだ』と言う人もいれば、『エリヤだ』と言う人もいます。また、『預言者の一人だ』と言う人もいます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 弟子たちは
  rationale: 冠詞付きの表現が前の文脈の弟子たちを指すため、日本語では指示対象を明示した。δέの弱い接続・展開の働きは、自然な文脈の流れに委ねた。
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: 答えた
  rationale: 直訳的には「彼に言って、言った」に近い重複表現だが、日本語では不自然になる。直前の問いへの応答なので「答えた」とし、発話内容を直接話法で続けた。
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: バプテスマのヨハネ
  rationale: 歴史的人物の日本語聖書で広く通用する呼称を用いた。「洗礼者ヨハネ」も可能だが、原語の行為者的な称号と慣用性を両立する表現を選んだ。
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: …と言う人もいれば、…と言う人もいます。また、…と言う人もいます
  rationale: 異なる人々による複数の見解の分配を、現代日本語で明瞭に表した。最後のδέは強い逆接とは限らないため「しかし」ではなく「また」とした。
- source_word: Ἠλίαν
  choice: エリヤ
  rationale: 日本語で定着している旧約の預言者名を用いた。
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: 預言者の一人だと言う人もいます
  rationale: 原文では後続節に「あなたは」に当たる述語要素が省略されている。日本語では各見解の報告として自然に理解できるよう「だと言う人」を補ったが、「イエスは」を明示せず簡潔さを保った。
- source_word: προφητῶν
  choice: 預言者
  rationale: イスラエルの預言者たちを指す標準的な訳語を用いた。
theological_decisions:
- issue: 人々によるイエスの同定の列挙
  choice: 三つの見解を「…だと言う人も」の反復で示す
  alternative: 「バプテスマのヨハネ、ほかの人々はエリヤ、またほかの人々は預言者の一人」と原文の省略をそのまま残す
  rationale: 原文の焦点は、イエスについて民衆の見方が分かれていたことにある。日本語では述語を完全に省くと不自然で意味が取りにくいため、最小限の補いで各見解を明瞭にした。特定の見解を是認・否定する表現は加えていない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。原文の簡潔な列挙を保ちつつ、日本語として必要な述語を補った。注記を要するほどの重大な異読・語義上の曖昧さはないため、脚注は付していない。
