  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: ja
  text: 人[b]が全世界を手に入れても、自分のいのち[a]を失うなら、何の益があるだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魂」または「自分自身」とも訳せる。ギリシア語の「プシュケー」は、文脈により「いのち」「魂」「自分自身」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「人」は、ここでは特定の男性ではなく、人間一般を指す。
    reason: cultural_note
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖ
  choice: 何の益があるだろうか
  rationale: γάρが直前の教えを受ける説明的なつながりは文脈に委ねつつ、τίとὠφελεῖによる修辞疑問を、自然で格調ある現代日本語で表した。
- source_word: ἄνθρωπον
  choice: 人が
  rationale: ἄνθρωποςはここでは特定の男性ではなく一般的人間を指すため、日本語で自然かつ包括的な「人」とした。
- source_word: κερδῆσαι τὸν κόσμον ὅλον
  choice: 全世界を手に入れても
  rationale: κερδαίνωの獲得の意味とκόσμος ὅλοςの包括性を保ち、「得る」よりも具体的で一般読者に明瞭な表現とした。
- source_word: ζημιωθῆναι
  choice: 失うなら
  rationale: 受動形が表す損失を簡潔に示し、「手に入れる」との対照を明確にした。「損なう」も可能だが、ψυχήを「いのち」とする本文では「失う」が文脈上自然である。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自分のいのち
  rationale: マルコ8:35–37の文脈ではψυχήは失い、また救おうとする「いのち」を第一に指す。ただし「魂」または「自分自身」という含みもあり得るため脚注に残した。
theological_decisions:
- issue: 弟子として従うことについての教えにおけるψυχήの訳
  choice: いのち
  alternative: 魂／自分自身
  rationale: 直前の8:35との連続性を保ち、人間論を狭く確定しないため本文を「いのち」とした。一方、語の意味領域とこの言葉の究極的重みを損なわないよう、他の可能性を脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の力と「手に入れる／失う」という対照を保った。「いのち」は漢字の「命」よりも聖書本文として柔らかく、身体的生命だけに限定されにくい表記として採用した。
