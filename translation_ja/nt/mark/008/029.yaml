base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: ja
  text: イエスは弟子たちに尋ねていた。「では、あなたがたは、わたしを何者だと言うのか。」ペトロがイエスに答えた。「あなたはメシア[a]です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。ギリシア語ὁ χριστόςは「油を注がれた者」を意味する称号で、「メシア」はセム語系の表現、「キリスト」はこのギリシア語に由来する表現。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς ἐπηρώτα αὐτούς
  choice: そこで、イエスは弟子たちにさらに尋ねた
  rationale: 直前の問いに続く場面であることと、未完了過去ἐπηρώταの継続的な流れを「さらに尋ねた」で自然に表した。日本語では「彼は彼らに」が不明瞭になりやすいため、文脈上の指示対象を「イエス」「弟子たち」と明示した。
- source_word: Ὑμεῖς δὲ
  choice: では、あなたがたは
  rationale: 明示されたὙμεῖςの強調と、他の人々の見方との対比を、「では」と主題提示の「あなたがたは」で表した。
- source_word: τίνα με λέγετε εἶναι
  choice: わたしを何者だと言うのか
  rationale: 対格＋不定詞の構文を、意味を保った自然な現代日本語の間接叙述として訳した。「何者」は単なる名前ではなく身分・正体を問う含みを伝える。
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: ペトロが答えた
  rationale: 分詞と歴史的現在を日本語の物語文として簡潔な過去形にまとめ、応答であることを明示した。
- source_word: Σὺ εἶ ὁ χριστός
  choice: あなたはメシアです
  rationale: 明示された主語Σὺを「あなたは」で表し、χριστόςは固有名ではなく称号として、ユダヤ的背景を伝える「メシア」と訳した。
theological_decisions:
- issue: 称号χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでχριστόςは称号として機能しているため、意味とヘブライ的背景が伝わる「メシア」を本文に置いた。伝統的で広く知られた「キリスト」は脚注に残し、同一称号の別表現であることを示した。
translation_notes:
  register: 明瞭で現代的ながら、告白場面にふさわしい簡潔で品位ある文体とした。問いの対比を「では、あなたがたは」で保ち、ペトロの答えは余計な解釈を加えず端的に訳した。
