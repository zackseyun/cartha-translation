source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: ja
  text: イエスは盲人の手を取って村の外へ連れ出した。そして、その目につばを吐きかけ[a]、彼に両手を置いて、「何か見えますか」と尋ねた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼の目の中に唾を吐きかけて」。
    reason: εἰςの「中へ」という方向性を、本文の自然な「目につばを吐きかけ」に対する、より字義的な別訳として示す。
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: 盲人の手を取って
  rationale: 属格を伴うἐπιλαμβάνομαιは、ここでは相手の手をつかんで導く具体的な動作を表す。「手を取って」は自然な日本語で、その動作を明確に伝える。τυφλόςは名詞的用法なので「盲人」とした。
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: 村の外へ連れ出した
  rationale: ἐκφέρωの外へ移す意味と、手を取って導く文脈の両方を「連れ出した」で表した。κώμηは比較的小規模な集落を指すため「村」とした。
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: その目につばを吐きかけ
  rationale: 治癒の身体的で印象的な動作を弱めずに示した。εἰςは字義的には「中へ」という方向性を持つが、日本語本文では自然な「目に」とし、より直訳的な表現を脚注に残した。
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: 両手を彼に当てて
  rationale: 複数形τὰς χεῖραςを「両手」として明示し、ἐπιτίθημιの物理的な接触を「当てる」で表した。後代の儀礼的意味を付加しない表現である。
- source_word: ἐπηρώτα αὐτόν
  choice: 尋ねた
  rationale: 未完了過去形だが、ここでは直接の質問を導く通常の物語表現として、自然な日本語の完結した動詞で訳した。
- source_word: Εἴ τι βλέπεις;
  choice: 何か見えますか
  rationale: τιの不定性を「何か」で保ち、視覚が少しでも得られたかを問う自然な質問とした。「見える」の能力・知覚の含みを保ちつつ、本文にない説明は加えていない。
theological_decisions:
- issue: 治癒行為の身体性をどの程度明示するか
  choice: 目につばを吐きかけ、両手を当てるという具体的な動作をそのまま示す
  alternative: 現代読者への配慮から、つばに関する描写を婉曲化または省略する
  rationale: 本文は治癒の過程を具体的かつ印象的に描いているため、その身体性を弱めたり取り除いたりしない。
- issue: 両手を当てる行為の儀礼的含意
  choice: 治癒の場面における身体的接触として訳す
  alternative: 按手など、後代の教会儀礼を明示する語で訳す
  rationale: 文脈はイエスの治癒行為を描写しており、特定の制度的・秘跡的意味を本文以上に読み込まない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書本文としての落ち着いた語調を保った。治癒行為の生々しさは婉曲化せず、「何か見えますか」は普通の読者に自然に伝わる丁寧な問いとした。
