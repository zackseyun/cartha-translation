id: MRK.8.37
reference: Mark 8:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: ja
  text: そもそも、人は自分のいのち[a]と引き換えに、何を差し出せるだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「魂」または「自分自身」。ギリシア語は、文脈により「いのち」「自分自身」「魂」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: そもそも、何を
  rationale: τίの疑問を「何を」で表し、γάρが直前の発言を受けて理由を示す働きは、修辞疑問に自然な「そもそも」で伝えた。
- source_word: δοῖ
  choice: 差し出せるだろうか
  rationale: δίδωμιのアオリスト接続法による修辞的な問いである。単なる行為としての「与える」より、代価として提供する意味が明確な「差し出す」を用い、可能性を問う力を「できるだろうか」で表した。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ここでは特定の男性ではなく、人間一般を代表する単数形なので、現代日本語で自然かつ包括的な「人」とした。
- source_word: ἀντάλλαγμα
  choice: と引き換えに
  rationale: 何かの代わりに差し出す交換物・代価を指す。日本語では「と引き換えに」が自然にその関係を表す。
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: 自分のいのち
  rationale: ψυχήは文脈により「いのち」「自分自身」「魂」を意味し得る。8章35–37節では失い、また救う対象として人の存在全体を含むため、本文では文脈上明瞭な「いのち」とし、「魂」の可能性を脚注に残した。
theological_decisions:
- issue: 救いに関する文脈でのψυχήの訳語
  choice: いのち
  alternative: 魂、または自分自身
  rationale: 直前の文脈との連続性を保ちつつ、ψυχήを単なる生物学的生命に限定しないよう平仮名の「いのち」を用いた。ただし、人の内面的・全人的存在を指し得る語義上の緊張を保つため、別訳を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、修辞疑問の厳粛さを保った。「そもそも」で前節との説明的なつながりを示し、「いのち」は全人的な含みを感じさせる表記とした。
