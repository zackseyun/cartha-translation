  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: ja
  text: そしてイエスは、その人を自分の家へ帰し、こう言った。「村にさえ入ってはいけない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本には、「村のだれにも話してはいけない」ともあります。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 帰し
  rationale: ここでは、イエスがその人を立ち去らせて自宅へ向かわせることを表す。目的地が「自分の家」と明示されているため、現代日本語では「帰し」が自然である。
- source_word: εἰς οἶκον αὐτοῦ
  choice: 自分の家に
  rationale: 直訳的には「彼の家へ」だが、日本語では主語の取り違えを避けつつ、その人自身の家が目的地であることを自然に示すため「自分の家に」とした。
- source_word: λέγων
  choice: こう言った
  rationale: 分詞による付帯的な発言を、自然な日本語の叙述として主節に続けた。
- source_word: Μηδὲ
  choice: 入ってはいけない
  rationale: 否定命令として明確に訳した。μηδέには「…さえも」の強調を認め得るが、日本語で「村にさえ入るな」とすると不自然な比較や含意を招きやすいため、文脈上の絶対的な禁止を簡潔に表した。
- source_word: κώμην
  choice: 村
  rationale: κώμηは通常、小規模な集落を指すため「村」が直接的で文脈にも適する。
- source_word: εἰσέλθῃς
  choice: 入ってはいけない
  rationale: μηδέに続くアオリスト接続法の禁止を、明瞭で現代的な日本語の禁止表現にした。
theological_decisions:
- issue: 村についてのイエスの禁止命令の範囲
  choice: 村に入ることだけを禁じる本文として訳す。
  alternative: 一部の写本にある「村のだれにも話してはいけない」という追加句も本文に含める。
  rationale: SBLGNTの本文は村に入ることへの禁止のみを含むため、長い異読を本文へ取り込まず、脚注で知らせる。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「イエス」はギリシア語本文では代名詞で省略されているが、単独節として主語を明瞭にするため補った。
