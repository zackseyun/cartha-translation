id: MRK.8.12
reference: Mark 8:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: ja
  text: そして、イエスは心の奥で深くため息をつき、言われた。「なぜ、この時代の人々はしるしを求めるのか。はっきり言っておく。この時代の人々には、決してしるしは与えられない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「もし、この時代の人々にしるしが与えられるなら」。これは、しるしが決して与えられないことを表す誓言的な言い回し。
    reason: 原文の誓言的なεἰ構文と、その強い否定の意味を示すため。
lexical_decisions:
- source_word: ἀναστενάξας
  choice: 深くため息をつき
  rationale: 接頭辞ἀνα-を伴う強い嘆息を、過度に劇的にせず自然な現代日本語で表した。
- source_word: τῷ πνεύματι αὐτοῦ
  choice: 霊のうちで
  rationale: 単なる心理的な「心の中で」に平板化せず、ギリシア語のπνεῦμαという人間論的表現を保った。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、日本語で「言われる」とするとこの一節だけ不自然になりやすいため、自然な物語時制を採用した。
- source_word: Τί
  choice: なぜ
  rationale: 動詞を伴うτίはここで理由を問う用法であり、日本語では「なぜ」が自然で正確である。
- source_word: γενεὰ
  choice: この時代の人々
  rationale: γενεάの時間的・集団的な意味を保ちつつ、「世代」よりもこの文脈で誤解の少ない自然な日本語とした。
- source_word: ζητεῖ
  choice: 求める
  rationale: 語の基本的意味を保ち、「要求する」のように対立的な含みを不必要に強めない。
- source_word: σημεῖον
  choice: しるし
  rationale: 奇跡に限定する説明語を加えず、認証の働きを持つσημεῖονの神学的幅を保った。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言う
  rationale: イエスの厳粛な宣言定式の力を、明瞭で格調ある現代日本語で表した。
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: この時代の人々には、決してしるしは与えられない
  rationale: εἰを用いる省略された誓言表現の強い否定を明示した。「決して」により誓言的な強調も伝えた。
theological_decisions:
- issue: ἀμὴν λέγω ὑμῖνに続くεἰ節の誓言的表現
  choice: 強い否定として「決してしるしは与えられない」と訳す。
  alternative: 「もし、この時代の人々にしるしが与えられるなら」と形式的に訳す。
  rationale: 原文は帰結部を省いたセム語的な誓言表現で、機能上は強い否定である。本文では意味を明瞭にし、原文の形式は脚注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「イエス」はギリシア語本文では代名詞に含意される主語を文脈上明示した。「しるし」は教会的に定着した語だが平仮名表記とし、一般読者にも読みやすくした。
