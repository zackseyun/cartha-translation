  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: ja
  text: そして、彼らをあとにして、再び舟に乗り[a]、向こう岸へ行かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「再び舟に乗り」に当たる語句には、写本上の異読がある。
    reason: textual_variant
lexical_decisions:
- source_word: ἀφεὶς
  choice: 残し
  rationale: ἀφίημιのアオリスト分詞で、ここではその場にいる人々を後にして立ち去ることを表す。「残し」は分詞のつながりを簡潔に保つ。
- source_word: αὐτοὺς
  choice: 彼らを
  rationale: 直前の文脈にいるファリサイ派の人々を指す代名詞として、そのまま訳した。
- source_word: πάλιν
  choice: 再び
  rationale: πάλινの基本的な反復の意味を保持した。日本語では「再び舟に乗って」が自然であり、「舟に戻って」と限定して曖昧さを解消する必要がない。
- source_word: ἐμβὰς
  choice: 舟に乗って
  rationale: ἐμβαίνωの分詞で、文脈上、乗り込む対象は舟である。日本語では対象を補って「舟に乗って」とするのが明瞭で自然。
- source_word: ἀπῆλθεν
  choice: 去って行かれた
  rationale: ἀπέρχομαιの出発・離去の意味を明示しつつ、イエスを主語とする日本語の聖書本文にふさわしい自然な敬体ではない尊敬表現とした。
- source_word: εἰς τὸ πέραν
  choice: 向こう岸へ
  rationale: 湖の反対側を指すマルコの地理的表現として、簡潔で一般的な日本語を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔な物語調と品位を保った。ギリシア語の語順に概ね沿いながら、日本語として自然になるよう連用形で動作をつないだ。πάλινは「再び」と訳して原文の語彙的幅を保ったため、英語版にある代替訳注は不要と判断した。
