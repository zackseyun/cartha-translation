source:
  edition: SBLGNT
  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: ja
  text: イエスはこのことを率直に[a]話しておられた。するとペトロはイエスをわきへ連れて行き、いさめ始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「はっきりと」または「大胆に」。ギリシア語は、隠さず率直に語ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: 率直に
  rationale: 隠さず、はっきりと語るという語感を自然な現代日本語で表す。「大胆に」も可能だが、ここでは勇気よりも明白で率直な語り方が中心である。
- source_word: τὸν λόγον
  choice: このことを
  rationale: 直前の受難予告の内容を指す談話上の働きを明確にする。直訳的な「その言葉を」より、現代日本語では文脈を自然に受ける。
- source_word: ἐλάλει
  choice: 話しておられた
  rationale: 未完了過去の継続的な側面を表す。イエスへの敬意を保ちつつ、過度に古風でない表現とした。
- source_word: προσλαβόμενος
  choice: わきへ連れて行き
  rationale: 文脈上、ペトロがイエスを人々から離して個人的に話そうとした含意を、日本語として自然に明示する。
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: いさめ始めた
  rationale: 開始を表す構文を保持する。「叱り始めた」よりも、相手の言動を強く制止・非難する意味を品位ある自然な日本語で表す。
theological_decisions:
- issue: 受難予告に関連する παρρησίᾳ の力点
  choice: 「率直に」とし、イエスが隠さず明白に語ったことを示す。
  alternative: 「はっきりと」または「大胆に」
  rationale: ペトロの直接的な反応との物語上の対照を保ちながら、勇敢さなど本文以上の神学的含意を持ち込まない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「ペトロ」「イエス」を明示して代名詞の曖昧さを避け、継続相と開始相を保持した。
