  verdict: approve
  source_fidelity: 原文の未完了過去ἐλάλειは「話しておられた」によって継続的な語りとして適切に表されている。παρρησίᾳは「率直に」で、隠さず明白に語るというこの文脈での中心的意味をよく伝える。τὸν λόγονを「このことを」とするのも、直前の受難予告を受ける自然で明確な訳である。προσλαβόμενοςは文脈に即して「わきへ連れて行き」と訳され、ἤρξατο ἐπιτιμᾶνも開始相を保った「いさめ始めた」となっている。
  naturalness: 明瞭で品位のある現代標準日本語であり、叙述の流れも自然である。「すると」はギリシア語のκαίをやや展開する接続だが、ペトロの反応へ移る日本語として不自然でも、本文の意味を変更するほど因果関係を強めてもいない。
  terminology: 固有名は「イエス」「ペトロ」で一貫している。「率直に」と脚注の「はっきりと」「大胆に」はπαρρησίᾳの有力な語義の幅を適切に示す。「いさめる」は日本語聖書で定着した、ここでの強い制止・反駁を表し得る語である。
