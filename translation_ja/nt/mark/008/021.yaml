source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: ja
  text: そして彼は彼らに言った[a]。「まだ分からないのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「言っていた」。未完了過去形で、継続または反復を表す可能性がある。
    reason: 動詞の相を本文の自然さのため明示しなかったことを示す。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な叙述のつながりを示し、文脈にない強い時間的意味を加えない自然な接続とした。
- source_word: ἔλεγεν
  choice: 言った
  rationale: 未完了過去形だが、日本語で「言っていた」とするとこの一回の問いかけが不自然に継続している印象を与えうるため、本文では自然な叙述形とした。継続・反復の可能性は脚注に示した。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: この節には対象を特定する名詞がないため、文脈から「弟子たち」を補わず代名詞のまま訳した。
- source_word: Οὔπω
  choice: まだ…ない
  rationale: 「まだ今に至るまでない」という οὔπω の意味を、現代日本語の疑問文で自然に表す。
- source_word: συνίετε
  choice: 分からない
  rationale: ここでは知的な理解・把握を意味する。「悟らない」より日常的で明確な現代語であり、特別な宗教的含意を加えない。
theological_decisions:
- issue: 理解の対象を「これ」「このこと」などと補うか
  choice: 目的語を補わず「まだ分からないのか」とする
  alternative: 「このことがまだ分からないのか」
  rationale: ギリシア語では理解の対象が明示されていない。問いの開かれた叱責的な力を保ち、特定の対象に狭めないため。
- issue: 問いの語調
  choice: 「まだ分からないのか」
  alternative: 「まだ分からないのですか」
  rationale: 文脈上の厳しい問いかけを保ちつつ、過度に粗野な表現や解釈的な強調を避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。叙述は簡潔にし、イエスの問いが持つ叱責の調子を「まだ」と終助的な「のか」で保った。
