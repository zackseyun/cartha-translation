  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: ja
  text: 弟子たちはパン[a]を持って行くのを忘れ、舟には一つのパンのほかは持っていなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文ではここは複数形で、直訳すれば「複数のパン（パンの塊）」となる。ここでは食料としてのパン全般を指す可能性がある。後半の「一つのパン」は単数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: 忘れ
  rationale: アオリスト形は、弟子たちがパンを携えるのを忘れたという先行する出来事を示す。日本語では文脈上、単純な「忘れ」で自然に表せる。
- source_word: λαβεῖν
  choice: 持って来るのを
  rationale: 舟に食料として携えて来る場面なので、「取る」より「持って来る」が自然で、移動に伴う携行の意味を明確にする。
- source_word: ἄρτους
  choice: パン
  rationale: 複数形だが、ここでは個々のパンを数えるだけでなく、食料としてのパンを集合的に指し得るため、自然な日本語の「パン」とした。
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: 一つのパンのほかは
  rationale: εἰ μήはここでは条件ではなく除外を表す。「一つ」は単数の数えられるパンであることを保つ。
- source_word: οὐκ εἶχον
  choice: 何も持っていなかった
  rationale: 直前の除外句と組み合わせ、「一つのパン以外は何もなかった」という原文の構造を自然な日本語で示す。
- source_word: μεθ’ ἑαυτῶν
  choice: 持っていなかった
  rationale: 「自分たちとともに」は日本語では携行を表す「持っている」に含めるのが自然である。
- source_word: ἐν τῷ πλοίῳ
  choice: 舟の中には
  rationale: ἐνの位置的意味を保ち、場面を明確にする。「舟」は福音書の語調に合う平明で品位ある表現。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、原文の除外構文と、複数形から単数形への対比を保った。「一斤」は現代日本語では重量・包装単位を連想させるため避け、「一つのパン」とした。
