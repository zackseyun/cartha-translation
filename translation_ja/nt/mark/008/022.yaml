  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: ja
  text: 彼らはベトサイダに来た。彼らは目の見えない男性をイエスのもとに連れて来て、その男性に触れるようイエスに懇願した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: 来た
  rationale: 物語中の歴史的現在であり、現代日本語の自然な叙述に合わせて過去形とした。主語は直前から続くイエスと弟子たちを自然に指す「一行」とした。
- source_word: εἰς Βηθσαϊδάν
  choice: ベトサイダに
  rationale: εἰς は到達先を示すため、日本語では「に」が自然である。地名は慣用的に音写した。
- source_word: φέρουσιν
  choice: 連れて来て
  rationale: 歴史的現在を過去の出来事として訳した。対象が人なので「連れて来る」が自然であり、運搬方法を特定する「運んで来る」は避けた。
- source_word: τυφλὸν
  choice: 目の見えない人
  rationale: 男性単数の実体詞的形容詞だが、日本語では文脈上性別を明示する必要がなく、現代の自然で配慮ある表現を用いた。
- source_word: παρακαλοῦσιν
  choice: 懇願した
  rationale: 単なる依頼ではなく切実な願いを表す語義を、格調を保ちつつ明確に伝える。
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: その人に触れてくださるよう
  rationale: ἵνα と接続法が表す依頼内容を日本語の「よう」で自然に示した。敬語は、人々がイエスに願う発話上の関係を自然に表す。
- source_word: καὶ
  choice: すると／て
  rationale: マルコの並列的な進行を保ちながら、日本語で同じ接続詞を機械的に反復せず、出来事の連続が明瞭になる形にした。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。物語のテンポと原文の簡潔さを保ち、「懇願した」で願いの切実さを表した。「一行」はギリシア語の複数動詞に含まれる主語を日本語で自然に補ったもの。
