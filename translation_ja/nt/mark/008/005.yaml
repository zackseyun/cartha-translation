  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: ja
  text: そしてイエスは彼らに尋ねた。「パンをいくつ持っていますか。」彼らは「七つです」と答えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: マルコの簡潔な物語の流れを保つ標準的な接続表現。時間的な意味を不必要に加えない。
- source_word: ἠρώτα αὐτούς
  choice: イエスは彼らに尋ねた
  rationale: 未完了過去は継続・反復も表し得るが、ここでは物語上の一回の問いとして自然に訳す。主語は文脈上イエスであり、日本語では明示したほうが分かりやすい。αὐτούς は問いかけの相手を示すため「彼らに」とした。
- source_word: Πόσους ἔχετε ἄρτους
  choice: パンはいくつありますか
  rationale: ἄρτους は数えられるパンを指す。現代日本語では「パンをいくつ持っていますか」よりも、所持・手元にある数量を自然に問う「パンはいくつありますか」が明快。
- source_word: οἱ δὲ εἶπαν
  choice: 彼らは…と答えた
  rationale: δέ は応答への移行として日本語の文の切り替えに含めた。εἶπαν の字義は「言った」だが、質問への返答なので「答えた」が自然で、意味を変えない。
- source_word: Ἑπτά
  choice: 七つです
  rationale: 数量をそのまま示し、日本語の直接話法として自然になるよう丁寧な述語を補った。
