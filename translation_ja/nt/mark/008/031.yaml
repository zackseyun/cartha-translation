id: MRK.8.31
reference: Mark 8:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: ja
  text: そしてイエスは、人の子は多くの苦しみを受け、長老たち、祭司長たち、律法学者たちから退けられ、殺され、三日の後に[a]復活しなければならない、と弟子たちに教え始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「三日目に」と訳す伝統もある。ギリシア語本文は直訳すると「三日の後に」であり、本訳はマルコの表現をそのまま保った。
    reason: 「三日の後に」と並行箇所の「三日目に」との表現上の違いを示すため。
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: 教え始めた
  rationale: 開始を表すἤρξατοと不定詞の組み合わせを、自然な現代日本語で明確に表す。
- source_word: δεῖ
  choice: しなければならない
  rationale: 受難、拒絶、死、復活に伴う強い必然性を保ちつつ、その必然性の仕組みを本文以上に限定しない。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書における称号として定着した訳語を用い、ダニエル書との響きと表現上の含みを保つ。
- source_word: πολλὰ παθεῖν
  choice: 多くの苦しみを受け
  rationale: πολλάの幅を具体的かつ自然に表し、単に苦痛の程度だけに狭めない。
- source_word: ἀποδοκιμασθῆναι
  choice: 退けられ
  rationale: 指導者たちによる判断の末の拒絶という意味を、簡潔で格調ある日本語で表す。
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: 長老たちから
  rationale: 単なる高齢者ではなく、ユダヤ社会の公的指導層を指す歴史的名称を保つ。
- source_word: τῶν ἀρχιερέων
  choice: 祭司長たち
  rationale: 複数形が大祭司職の複数保持者ではなく、祭司上層部を指すことを標準的な聖書用語で表す。
- source_word: τῶν γραμματέων
  choice: 律法学者たち
  rationale: 当時の役割を現代の一般読者に明瞭に伝える。単なる筆記者との誤解を避ける。
- source_word: ἀποκτανθῆναι
  choice: 殺され
  rationale: 受動形を保ち、直接的で自然な表現とする。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 三日の後に
  rationale: μετάと対格の通常の意味をそのまま反映し、並行箇所の「三日目に」へ調和させない。
- source_word: ἀναστῆναι
  choice: 復活し
  rationale: 能動・自動詞的な形を保ちながら、死から立ち上がる意味を現代日本語で明確に伝える。
theological_decisions:
- issue: δεῖが示す受難予告の必然性
  choice: しなければならない
  alternative: そうなることになっている／必要がある
  rationale: 神的な必然性を示唆する強さを保つ一方、その根拠や機序を訳文で過度に説明しない。
- issue: μετὰ τρεῖς ἡμέραςの時間表現
  choice: 三日の後に
  alternative: 三日目に／三日で
  rationale: マルコ本文の表現を優先し、他の福音書の表現に合わせて調和させない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。長い不定詞連鎖は日本語として自然な連用形でつなぎ、主節末の「教え始めた」まで論理関係を保った。主語の曖昧さを避けるため「イエス」、目的語の指示対象を明確にするため「弟子たち」とした。脚注記号は対象となる時間表現の直後ではなく文末に置いたが、本文中に明示した。
