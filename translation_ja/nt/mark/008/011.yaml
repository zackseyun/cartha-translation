source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: ja
  text: ファリサイ人が出て来て、イエスと議論を始めた。彼らはイエスを試そうとして、天からのしるし[a]を求めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「空からのしるし」。ここでは、神に由来するしるしという意味である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出て来て
  rationale: 場面に姿を現す動きを自然な現代日本語で表し、どこから出たかは原文同様に特定しない。
- source_word: ἤρξαντο συζητεῖν
  choice: 議論を始めた
  rationale: ἤρξαντο の開始相を明示し、敵対的な試みという文脈に合う συζητεῖν の論争的含意も保つ。
- source_word: αὐτῷ
  choice: イエスと
  rationale: 日本語では「彼と」より指示対象を明示するほうが自然である。名の補足は意味を変えず、読みやすさを高める。
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: イエスに……求めた
  rationale: παρά＋属格の要求元を、日本語で自然な「人に物を求める」の構文によって表す。
- source_word: σημεῖον
  choice: しるし
  rationale: 単なる奇跡ではなく、権威や神的承認を示す証拠という含みを保つため、「奇跡」ではなく「しるし」とする。
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: 天からの
  rationale: 神的起源を示す可能性の高い表現を直訳的に保ちつつ、「空から」という字義的可能性は脚注に示す。
- source_word: πειράζοντες αὐτόν
  choice: イエスを試そうとして
  rationale: 罪へ誘惑する意味に限定せず、敵対的に真価や反応を試す意図を表す。目的・動機を示す分詞として自然に訳す。
theological_decisions:
- issue: 「天からのしるし」の意味
  choice: 神的な起源または承認を持つしるしを第一義としつつ、本文では「天からの」として含みを保つ
  alternative: 空から現れるしるし
  rationale: 福音書のユダヤ的・神学的文脈では神に由来するしるしが自然だが、ἀπὸ τοῦ οὐρανοῦ 自体の語義的幅を本文で狭めすぎない。
- issue: πειράζοντες の意図
  choice: 試そうとして
  alternative: 誘惑しようとして
  rationale: この場面は罪への誘引よりも、要求によってイエスを試し、陥れようとする敵対的な吟味を表すため。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「ファリサイ派の人々」は一般読者に人物集団であることが伝わる形とし、文を二つに分けて分詞関係と敵対的意図を読み取りやすくした。脚注記号[a]は該当句の直後に置いた。
