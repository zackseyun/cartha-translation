  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: ja
  text: そしてイエスは、イエスについてだれにも話さないよう、弟子たちに厳しく命じた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弟子たちを厳しく戒めた」または「弟子たちに厳重に言い渡した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: 厳しく命じた
  rationale: この語はしばしば「叱る」を意味するが、ここでは弟子たちに口外を禁じる強い命令を表す。「厳しく命じた」は、叱責と断定しすぎず、その強い語調を自然な現代日本語で伝える。
- source_word: αὐτοῖς
  choice: 弟子たちに
  rationale: 代名詞の指示対象は直前の文脈にいる弟子たちであり、日本語では明示したほうが分かりやすい。
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: だれにも話さないよう
  rationale: 命令を表す動詞に続くἵνα＋接続法を、日本語の自然な禁止命令の内容節として訳した。μηδενὶの「だれにも」と否定を保持している。
- source_word: περὶ αὐτοῦ
  choice: 自分のことを
  rationale: περί＋属格の「彼について」を表す。主語であるイエス自身を指すため、日本語では「自分のことを」が自然である。
theological_decisions:
- issue: イエスが口外を禁じた命令の強さと、いわゆるメシアの秘密
  choice: 強い禁止命令として訳すが、その理由についての理論は本文に加えない。
  alternative: 「彼らを叱った」と語義をより字義的に出す。
  rationale: 本文は強い口止めを明確にする一方、その神学的理由をここでは説明していない。「厳しく命じた」は命令の強さを保ちつつ、弟子たちが叱責された理由を補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」と「弟子たち」はギリシア語では代名詞だが、単独の節としても指示関係が明確になるよう補った。
