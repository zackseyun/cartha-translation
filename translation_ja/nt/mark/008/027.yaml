id: MRK.8.27
reference: Mark 8:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: ja
  text: それから、イエスは弟子たちとともにフィリポ・カイサリアの村々へ出て行かれた。道の途中で、弟子たちに尋ねておられた。「人々[a]は、わたしのことを何者だと言っているか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では男性形の語が用いられているが、ここでは男性に限らず、人々一般を指す。
    reason: ἄνθρωποιの文法上の形と、この文脈における包括的・一般的な指示を明示するため。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出て行かれた
  rationale: 移動の開始を表すἐξέρχομαιの基本的な意味を保ちつつ、現代日本語として自然にした。
- source_word: κώμας
  choice: 村々
  rationale: κώμηは大きな都市ではなく、通常は村や小規模な集落を指すため。複数形も明示した。
- source_word: Καισαρείας τῆς Φιλίππου
  choice: フィリポ・カイサリア
  rationale: 地名として日本語で通用する標準的な音写を用いた。
- source_word: ἐν τῇ ὁδῷ
  choice: 道の途中
  rationale: 直訳的な「道で」の意味を保ちながら、移動中の場面を自然な現代日本語で表した。
- source_word: ἐπηρώτα
  choice: 尋ねられた
  rationale: 未完了過去の背景的な動作を文脈に即して自然に表現した。「尋ねておられた」では反復を必要以上に強く感じさせる可能性があるため避けた。
- source_word: λέγων αὐτοῖς
  choice: こう尋ねられた
  rationale: 分詞の機能を日本語の引用導入「こう」にまとめ、原文の発話導入を保ちながら不自然な「尋ねて、彼らに言われた」を避けた。
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: 人々は、わたしのことを何者だと言っているか
  rationale: τίνα … εἶναιが問う身元・正体を「何者」として明確にし、λέγουσινの現在時制を「言っている」で表した。ἄνθρωποιは性別を限定しない「人々」とした。
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: 弟子たち／弟子たちに
  rationale: 同一文中の日本語では最初の「イエスは弟子たちとともに」によって所属関係が明白なので、「彼の」を反復せず自然に表した。
theological_decisions:
- issue: イエスの問いにおける一般的なἄνθρωποι
  choice: 人々
  alternative: 男たち／人間たち
  rationale: 文法上は男性複数形だが、この文脈では世間一般の人々を包括的に指す。男性だけに限定する神学的含意を持ち込まないため「人々」とした。
translation_notes:
  register: 明快な現代標準日本語を用い、物語文としての品位を保った。イエスの動作には日本語として慣用的な敬意表現を用いたが、語義や神学的内容は追加していない。
