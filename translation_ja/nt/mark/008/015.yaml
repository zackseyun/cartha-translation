source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: ja
  text: イエスは彼らに繰り返しこう戒めていた。「よく注意しなさい。ファリサイ派の人々のパン種[a]とヘロデのパン種に気をつけなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「パン種」は、パン生地を発酵させて膨らませるものを指す。ここでは、全体に広がる影響の比喩として用いられている。
    reason: lexical_alternative
  - marker: b
    text: この「パン種」は、ファリサイ派の人々やヘロデに結びつく否定的な影響を指すと考えられるが、この節ではその内容は明示されていない。関連する用例については、マタイ16:6、12、ルカ12:1を参照。
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: 繰り返しこう戒めていた
  rationale: 未完了過去の継続・反復の含みを表しつつ、この文脈での強い注意を自然な現代日本語で伝える。「命じていた」よりも警告の調子に適している。
- source_word: λέγων
  choice: こう
  rationale: 後続する直接話法の内容を導く分詞を、日本語で不自然にならないよう「こう」に統合した。
- source_word: Ὁρᾶτε, βλέπετε
  choice: よく注意し、警戒しなさい
  rationale: ほぼ同義の二つの命令による強調を、二つの関連した警告表現で保持した。単なる視覚動作ではなく、危険への注意を促す用法である。
- source_word: ἀπὸ
  choice: に気をつけなさい
  rationale: 警戒の対象から身を遠ざける意味を、日本語の自然な警告表現で示した。
- source_word: ζύμης
  choice: パン種
  rationale: パン生地に浸透して全体を膨らませる発酵種を指す語であり、影響が広がるという比喩を本文で説明し切らずに保持できる。
- source_word: τῶν Φαρισαίων
  choice: ファリサイ派の人々
  rationale: 当時の宗教的集団を指す名称として、現代の一般読者にも分かりやすい標準的な表現を用いた。
- source_word: Ἡρῴδου
  choice: ヘロデ
  rationale: 本文はヘロデ本人の名をファリサイ派と並列しており、「ヘロデ一派」などと解釈的に拡張しない。
theological_decisions:
- issue: 「パン種」の比喩が具体的に何を指すか
  choice: 本文では「パン種」という比喩をそのまま残す
  alternative: 教え、偽善、腐敗させる影響などと明示する
  rationale: 否定的に働いて広がる影響が示唆されるが、マルコ8:15自体はその内容を一つに特定していないため、本文では解釈の余地を保った。
- issue: 「ヘロデ」の指示範囲
  choice: ヘロデ
  alternative: ヘロデ一派、ヘロデ家、ヘロデ的な影響
  rationale: 原文が人名を直接用いているため、そのまま訳し、関連する集団や政治的影響に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「よく注意し、警戒しなさい」で原文の二重の命令を残し、「繰り返し……戒めていた」で未完了過去の継続・反復性を表した。比喩は本文中で解き明かさず、脚注で必要最小限の背景を補った。
