source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: ja
  text: イエスは彼らに言われた。「花婿が彼らと一緒にいる間、婚礼の客[a]が断食できるでしょうか。花婿が彼らと一緒にいるかぎり、断食できません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「婚礼の部屋の子ら」。婚礼の祝いに加わる人々を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: 断食できるでしょうか
  rationale: μήを伴う疑問文は否定の答えを予期する修辞疑問である。日本語では文脈上、「できるでしょうか」が自然に「できない」という答えを促す。
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: 婚礼に集う人たち
  rationale: 直訳は「婚礼の部屋の子ら」だが、婚礼の祝いに参与する人々を指す慣用句である。「花婿の付き添い人」より範囲を狭めず、現代日本語で意味が通る表現とした。
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: 花婿
  rationale: 婚礼の比喩を保ち、聖書的な響きも維持する明瞭な現代日本語である。
- source_word: ἐν ᾧ ... ἐστιν
  choice: …が一緒にいる間
  rationale: ここでは空間より時間の意味が中心であり、「間」がその時間的関係を自然に表す。
- source_word: μετ’ αὐτῶν
  choice: 一緒にいる
  rationale: μετά＋属格の同伴の意味を、自然な日本語で直接表した。
- source_word: ὅσον χρόνον
  choice: …かぎり
  rationale: 継続期間を示す表現であり、日本語の「かぎり」が時間的な持続を簡潔に伝える。
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: 花婿が一緒にいる
  rationale: ἔχουσινは字義的には「持っている」だが、日本語で「花婿を一緒に持っている」とすると不自然である。同伴・臨在という意味を明瞭に伝えるため自然な構文にした。
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: そこでイエスは彼らに言われた
  rationale: καίはここで談話を進める接続として「そこで」とし、イエスの発言を現代の聖書文体として自然かつ敬意ある形で表した。
theological_decisions:
- issue: イエスを花婿として示す比喩的含意
  choice: 「花婿」という比喩をそのまま保持し、その神学的意味を本文で説明しない
  alternative: イエスがメシア的な花婿であることを明示する解釈的訳
  rationale: 本文はイエス自身を花婿の位置に置くが、その含意を説明する語句は加えていない。比喩と神学的緊張を保ち、解釈を一つに限定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いつつ、イエスの発言には品位ある敬体ではなく聖書叙述に適した常体を採用した。「婚礼に集う」は日常的な「結婚式の客」よりやや格調を保ちながら、古風になりすぎない表現である。
