revisions:
- from: だれも、縮ませていない布切れを古い衣に縫い付けたりはしない。[a] そんなことをすれば、継ぎ当てがその衣を引き裂く。新しい布が古い衣を引き裂き、裂け目はもっとひどくなる。[b]
  to: だれも、まだ縮んでいない布切れを古い衣に縫い付けたりはしない。[a] そうでなければ、新しい継ぎ当てが古い衣から取れてしまい、裂け目はいっそうひどくなる。[b]
  rationale: 本文後半を、原文の難しい構文を過度に単純化せず、文脈上もっとも自然な結果――新しい、未収縮の継ぎ当てが古い衣から取れること――として訳した。これにより、現行訳の重複を除き、χɛῖρον σχίσμα γίνεταιの結果も明瞭にした。脚注bは逐語訳の限界を明示しつつ、採用した理解を正確な日本語で説明するよう改めた。
  reviewer_model: gpt-5.6-terra
