source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: ja
  text: だれも、まだ縮んでいない布切れを古い衣に縫い付けたりはしない。[a] そうでなければ、新しい継ぎ当てが古い衣から取れてしまい、裂け目はいっそうひどくなる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「まだ縮絨していない布切れ」とも訳せる。ギリシャ語は、縮絨などの加工がまだ施されておらず、使用すると縮む布を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「その継ぎ当てがそれから取ってしまう、新しいものが古いものから」となる。原文は圧縮された難しい表現で、ここでは新しい継ぎ当てが古い衣から取れ、その結果、裂け目がさらにひどくなるという意味に理解した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: 継ぎ当て
  rationale: 破れを覆うために当てる布を指すため、衣服の修繕という文脈に自然な「継ぎ当て」とした。
- source_word: ῥάκους ἀγνάφου
  choice: 縮ませていない布切れ
  rationale: ἄγναφοςは縮絨などの加工をまだ施していない布を表す。現代の読者に、後で縮む布という実際上の意味が伝わる表現を採った。
- source_word: ἐπιράπτει
  choice: 縫い付ける
  rationale: 布を縫って取り付ける具体的な動作を自然な日本語で表す。
- source_word: ἱμάτιον παλαιόν
  choice: 古い衣
  rationale: ἱμάτιονを特定の種類の外套に限定せず、格調を保ちつつ広く衣服を指す表現とした。
- source_word: εἰ δὲ μή
  choice: そんなことをすれば
  rationale: 直訳的な「そうでなければ」では日本語で論理関係が不明瞭になりやすいため、禁じられた行為をした場合の帰結として明示した。
- source_word: αἴρει
  choice: 引き裂く
  rationale: 基本義は「取る、取り去る」だが、この文脈では新しい継ぎ当てが古い衣を引っ張って裂け目を悪化させる結果を表すため、「引き裂く」とした。
- source_word: τὸ πλήρωμα
  choice: 継ぎ当て
  rationale: 裂け目を満たすもの、すなわち当て布を指す文脈上の意味を明確にした。
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: 新しい布が古い衣を
  rationale: 簡潔で圧縮されたギリシャ語の対比を、日本語で意味関係が分かるよう補いつつ、「新しい／古い」の対照を保持した。
- source_word: χεῖρον σχίσμα γίνεται
  choice: 裂け目はもっとひどくなる
  rationale: 比較級χεῖρονと結果を表すγίνεταιを、自然で明瞭な日本語にした。
