  terminology: ἐπίβλημαには「継ぎ当て」、ἐπιράπτειには「縫い付ける」、ἱμάτιονには限定しない「衣」を用いるのが適切である。ἀγνάφουは「まだ縮んでいない布」とし、脚注で縮絨・縮み加工前の布という語義を補う。
