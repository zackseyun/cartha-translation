source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: ja
  text: しかし、花婿が彼らから取り去られる日々が来る。そうなれば、その日には[a]彼らは断食する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 採用本文は「その日には」と単数形に読む。写本には「それらの日々に」と複数形に読む異読もある。
    reason: 原文で採用した単数形を示すとともに、この句の写本上の異同を明示するため。
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: しかし、…日々が来る
  rationale: δέによる直前との対照を「しかし」で示し、複数形ἡμέραιを「日々」として保持した。日本語としてやや際立つ表現だが、後半の単数形「その日」との対比を消さないためである。
- source_word: ὅταν
  choice: …時
  rationale: アオリスト接続法ἀπαρθῇとともに将来の出来事を指すため、反復を示す「いつでも」ではなく、文脈に自然な「…時」とした。
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: 彼らから取り去られる
  rationale: 受動態と分離の意味を保ち、行為者や取り去られる具体的な仕方は補わなかった。「取り去られる」は、単なる移動以上の突然で厳粛な響きを伝える。
- source_word: ὁ νυμφίος
  choice: 花婿
  rationale: 婚礼の比喩と聖書的な響きを保つ、現代日本語で明瞭な訳語である。
- source_word: καὶ τότε
  choice: その時
  rationale: 花婿が取り去られた後に断食が続くという時間的順序を明示した。
- source_word: νηστεύσουσιν
  choice: 彼らは断食する
  rationale: 宗教的実践を表す定着した語「断食」を用い、未来の出来事は文脈と「日々が来る」によって明らかなため、自然な日本語の非過去形とした。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日には
  rationale: 原文の単数形を保持し、ἐνと与格が表す時を自然な日本語で示した。係助詞「は」により、その時にこそ断食するという対照も伝わる。
theological_decisions:
- issue: 花婿がイエスを指す比喩
  choice: 「花婿」という比喩をそのまま残し、本文中でイエスと明示しない。
  alternative: 「わたしが彼らから取り去られる時」と言い換える。
  rationale: 文脈上はイエスの自己言及と理解できるが、原文は明示的な自己同定ではなく婚礼の比喩を用いている。その文学的・神学的な力を保持した。
- issue: 花婿が取り去られる出来事の性質と行為者
  choice: 受動態の「取り去られる」とし、行為者や具体的な死に方を特定しない。
  alternative: 「死によって取り去られる」または「無理やり連れ去られる」と説明する。
  rationale: この言葉はイエスの死を予告すると理解されるが、この節自体は行為者も手段も明記していない。原文が残す含みと緊張を解消しないようにした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「日々が来る」は通常の日本語より形式的だが、原文の複数形と後半の単数形の対比を保持するために採用した。
