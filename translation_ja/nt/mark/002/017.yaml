  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: ja
  text: イエスはこれを聞いて、彼らに言われた。「丈夫な人[a]に医者は必要ない。医者を必要とするのは病人である。私が来たのは、正しい人[b]を招くためではなく、罪人を招くためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「丈夫な人」は「健康な人」とも訳せる。ギリシア語は、力がある、健やかである人を指す。
    reason: lexical_alternative
  - marker: b
    text: 「正しい人」は、この文脈では「正しいと見なされている人」または「自分を正しいと思っている人」という皮肉を含む可能性がある。ただし、ギリシア語本文は単に「正しい人」と述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: これを聞いて
  rationale: アオリスト分詞を主動詞に先立つ状況として自然に表した。目的語はギリシア語では省略されているが、日本語では直前の批判の言葉を指す「これ」を補うと明瞭である。
- source_word: λέγει
  choice: 言われた
  rationale: マルコ特有の歴史的現在だが、日本語の物語文では過去形が自然である。敬語はイエスを指す日本語聖書として品位を保つためのもので、発言内容を強めるものではない。
- source_word: οἱ ἰσχύοντες
  choice: 丈夫な人
  rationale: 語の基本的な含意である「力がある、健壮である」を保ちつつ、医者との対比が自然に伝わる表現とした。「健康な人」と限定しすぎない。
- source_word: χρείαν ἔχουσιν ἰατροῦ
  choice: 医者はいらない
  rationale: 「医者を必要としない」という慣用的意味を、ことわざ的な簡潔さを保つ現代日本語で表した。
- source_word: οἱ κακῶς ἔχοντες
  choice: 病人
  rationale: 直訳的には「具合の悪い人々」だが、医療の比喩における通常の意味を簡潔に表した。
- source_word: οὐκ ἦλθον καλέσαι
  choice: 私が来たのは、…招くためではなく
  rationale: イエスの来臨・使命を示す構文を保ち、καλέω は召命にも招きにも開かれた「招く」とした。
- source_word: δικαίους
  choice: 正しい人
  rationale: 形容詞の名詞的用法をそのまま表し、文脈上の皮肉や自称という解釈を本文に付加しなかった。
- source_word: ἁμαρτωλούς
  choice: 罪人
  rationale: 福音書における道徳的・宗教的呼称を簡潔かつ伝統的に表す標準的な訳語である。
theological_decisions:
- issue: 「正しい人」が文字どおりか、皮肉を含むか
  choice: 本文では単に「正しい人」とした
  alternative: 「自分を正しいと思っている人」「正しいと見なされている人」
  rationale: 文脈上は皮肉に読める可能性があるが、ギリシア語本文自体は δικαίους とだけ述べる。解釈上の緊張を残すため、限定は脚注に置いた。
- issue: καλέσαι の目的・含意
  choice: 「招く」とした
  alternative: 「呼ぶ」「召す」
  rationale: 弟子としての召しを含み得る一方、本文は悔い改め等の目的語を明示していない。「招く」は対人的な呼びかけを自然に表し、目的を補わない。
- issue: 歴史的現在 λέγει の扱い
  choice: 日本語本文では過去形「言われた」
  alternative: 「言われる」
  rationale: 原文の鮮明な語り口は認めつつ、単独節の現代日本語では過去形が自然で、出来事の意味を変えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの格言的な対比が簡潔に響くよう整えた。過度に古風な「医者を必要とするのは」「義人」「召す」は避けつつ、「罪人」は福音書の宗教的・社会的含意を保つため維持した。脚注記号は対応箇所の直後に置いた。
