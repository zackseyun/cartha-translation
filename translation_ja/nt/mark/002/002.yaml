source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: ja
  text: 大勢の人が集まったので、もはや人の入る余地はなく、戸口のあたりにさえ余地がなかった。イエスは彼らに、ことば[a]を話していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メッセージ」。ギリシア語は「ことば」。
    reason: λόγος はここでイエスが語る内容、すなわち「メッセージ」を指すこともあり得るが、本文では原語の表現に近い「ことば」を保つ。
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: 大勢の人が集まり
  rationale: 受動形が表す、人々が一か所に集まった結果を、現代日本語として自然に表現した。「大勢の人」により、実質的に名詞として用いられた πολλοί を明示した。
- source_word: ὥστε μηκέτι χωρεῖν
  choice: もう場所がないほどになった
  rationale: ὥστε の結果関係と、μηκέτι が示す、それまであった空間が尽きた意味を自然な日本語で表した。
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: 戸口の辺りにさえ
  rationale: 扉へ通じる場所、または扉の近辺を指すギリシア語の慣用表現を簡潔に訳し、μηδέ の強調を「さえ」で保持した。
- source_word: ἐλάλει
  choice: 語っていた
  rationale: 未完了過去の継続的な動作を「ていた」で表した。「宣教していた」ほど解釈を加えず、λαλέω の基本的な意味を保った。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 集まった人々を指す代名詞を、原文どおり過度に限定せずに訳した。
- source_word: τὸν λόγον
  choice: ことば
  rationale: 定冠詞を伴う λόγος の表現を保ちつつ、「神のことば」と原文にない限定を加えることを避けた。文脈上「教え」または「知らせ」を意味し得るため、脚注で自然な代案を示した。
theological_decisions:
- issue: イエスが語った τὸν λόγον の意味
  choice: ことば
  alternative: 教え、知らせ、神のことば
  rationale: 原文は単に「そのことば」と述べ、内容や出所を明示していない。「ことば」と訳すことで原文の表現と神学的な含みを保持し、「神のことば」という補足は本文に持ち込まなかった。
- issue: ἐλάλει の主語の表し方
  choice: イエス
  alternative: 彼
  rationale: ギリシア語では動詞の形から三人称単数の主語が分かり、文脈上イエスを指す。日本語で「彼」とすると不自然または指示が曖昧になり得るため、指示対象を名前で明示したが、新たな解釈は加えていない。
translation_notes:
  register: 明快な現代標準語を用い、叙述は簡潔で落ち着いた調子にした。イエスへの敬語は加えず、本文の語調を中立に保った。「戸口の辺り」は家の内外いずれかに限定しすぎず、原文の空間的な幅を残している。
