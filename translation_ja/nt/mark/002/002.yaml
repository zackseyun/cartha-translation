  naturalness: 「もはや、人の入る余地はなく、戸口のあたりにさえ余地がなかった」とすると、現代標準語として自然であり、混雑の結果を明快に表せる。「ことばを語っていた」も不自然ではないが、「ことばを話していた」のほうが平明である。
  terminology: 「ことば」は λόγος の語形を保つ慎重な訳であり適切である。「神のことば」と限定しない点も原文に忠実である。脚注の代案は「教え」よりも、原文の語義幅を保つ「メッセージ」が安全である。
