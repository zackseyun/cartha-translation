  source_fidelity: 本文は、Τί…λαλεῖ を文脈上の非難を込めた「なぜ…言うのか」と適切に訳し、οὗτος の距離を置く語感も「この人」で過度に強めずに表している。「神を冒瀆している」は βλασφημεῖ の現在の告発として自然であり、原文で文脈上明らかな対象を日本語で明示しても意味の付加には当たらない。後半も「神おひとりのほかに、いったいだれが罪を赦すことができるのか」で、εἰ μὴ εἷς ὁ θεός の排他性と反語的な問いをよく保つ。
