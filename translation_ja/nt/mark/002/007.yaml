id: MRK.2.7
reference: Mark 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: ja
  text: 「この人は、なぜこんなことを言うのか。[a] 神を冒瀆している。神おひとりのほかに、いったいだれが罪を赦すことができるのか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「この人は、何をこのように語るのか」となるが、このギリシア語の言い回しは「なぜこの人はこんなことを言うのか」という意味。
    reason: lexical_alternative
  - marker: b
    text: 別訳「唯一の神のほかに」。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... λαλεῖ
  choice: なぜ……言うのか
  rationale: Τί はこの構文では発言内容を問う「何を」ではなく、そのように語る理由を非難がましく問う用法であるため、自然な現代日本語で「なぜ」とした。
- source_word: οὗτος
  choice: この人
  rationale: イエスを距離を置いて指す語感を保ちつつ、「こいつ」など、原文以上に侮蔑を強める表現は避けた。
- source_word: οὕτως
  choice: こんなことを
  rationale: イエスの発言の仕方と内容の双方に対する反発を、文脈に即した自然な日本語で表した。より形式的には「このように」とも訳せる。
- source_word: βλασφημεῖ
  choice: 神を冒瀆している
  rationale: 現在形の直近の行為に対する告発を表し、日本語で冒瀆の対象を明確にして神学的な重みを保った。
- source_word: τίς δύναται
  choice: いったいだれが……できるのか
  rationale: 能力だけでなく権限への強い反語的な問いを、自然な日本語の疑問表現で示した。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 罪を赦す
  rationale: この文脈の ἀφίημι は罪の赦免を意味するため、確立した自然な日本語表現を用いた。
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: 神おひとりのほかに
  rationale: 例外と排他性を表す構文を自然に訳した。εἷς ὁ θεός を「唯一の神」と取る可能性は脚注に残した。
theological_decisions:
- issue: οὗτος に侮蔑の度合いをどこまで込めるか
  choice: この人
  alternative: この者／こいつ
  rationale: 律法学者たちの敵対的な距離感は保つが、原文に明示されない強い侮蔑は加えない。
- issue: βλασφημεῖ の告発をどう表すか
  choice: 神を冒瀆している
  alternative: これは神への冒瀆だ／冒瀆の言葉を語っている
  rationale: 律法学者たちがイエスの言葉を神への冒瀆と判定していることを明確にしつつ、その告発が正しいかどうかという物語上・キリスト論上の緊張は訳文自体で解消しない。
- issue: εἷς ὁ θεός の統語的な幅
  choice: 神おひとりのほかに
  alternative: 唯一の神のほかに
  rationale: 中心的な意味である、罪を赦せるのは神だけだという排他性を本文で示し、「唯一の神」と読む可能性も脚注で保持した。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える品位を保った。「冒瀆」は神学的意味を損なわない標準的な語として用い、常用外の字にはせず一般的な表記とした。反語の強さは「いったい」で自然に示した。
