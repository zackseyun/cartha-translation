  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: ja
  text: しかし、人の子が地上で罪を赦す権威を持っていることを、あなたがたが知るために――イエスは麻痺のある人に言われた――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: しかし、…ことを、あなたがたが知るために
  rationale: δέの軽い対比と、ἵνα＋接続法が示す目的を自然な現代日本語で保った。文は次節へ続くため、ダッシュと閉じ引用符で中断を示した。
- source_word: ἐξουσίαν ἔχει
  choice: 権威を持っている
  rationale: 単なる能力ではなく、罪を赦す正当な権限・権威を表すため。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した表現を用い、人間性を示す慣用的含意とダニエル書7章への響きの両方を保持した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 権威が行使される領域を表す自然な日本語であり、天上との潜在的対照も保つ。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 罪を赦す
  rationale: この文脈でのἀφίημιの標準的意味である罪の赦免を、明瞭かつ簡潔に表す。
- source_word: λέγει τῷ παραλυτικῷ
  choice: そう言って、イエスは体の麻痺した人に言われた
  rationale: ギリシア語の歴史的現在は、日本語の物語として自然な過去形にした。主語を「イエス」と補って引用の話者を明確にし、παραλυτικόςは現代の読者に分かりやすく表した。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουの訳
  choice: 人の子
  alternative: 人間である者
  rationale: 伝統的かつ原文に近い称号を保持し、人間性、メシア的権威、ダニエル書7章との関連のどれか一つに意味を限定しない。
- issue: 罪を赦すことに関するἐξουσίαの意味
  choice: 権威
  alternative: 力／権利
  rationale: ここで問題となるのは行為を遂行する能力だけでなく、その正当な権限であるため、「権威」が文脈上の神学的主張を最もよく保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文では文が次節へ続くため、長いダッシュで発言の中断を示した。「人の子」は説明的に言い換えず、称号の曖昧さと神学的緊張を保持した。
