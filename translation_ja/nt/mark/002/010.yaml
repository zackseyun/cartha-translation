  naturalness: 「体の麻痺した人」は現代標準日本語としてやや不自然であり、「麻痺のある人」のほうが自然で、原語が特定の麻痺の程度を詳述していないことも保てる。また、前節から継続する発話であることを示すための閉じ引用符（」）が、この節単独の表記では対応する開き引用符を欠いている。
  terminology: 「人の子」「権威」「罪を赦す」「地上」はいずれも適切である。「人の子」は称号として保持され、解釈的な言い換えを避けている。
