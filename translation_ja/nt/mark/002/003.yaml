base_translation:
  language: en
  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: ja
  text: そして人々は、体が麻痺した人を四人で担いで、イエスのもとに連れて来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 直前の物語を受けて次の出来事を導く接続語。マルコの連続的な語り口を保ちつつ、現代日本語の物語として自然にした。
- source_word: ἔρχονται
  choice: 人々が…連れて来た
  rationale: 主語が明示されない複数形の歴史的現在。日本語では過去形で自然に表し、φέροντεςと合わせて「連れて来た」とした。
- source_word: φέροντες πρὸς αὐτὸν
  choice: イエスのもとに連れて来た
  rationale: 「彼のところへ運んで来る」の意。指示対象を明確にするため、文脈上の「あの方」ではなく「イエス」とした。
- source_word: παραλυτικὸν
  choice: 体の麻痺した人
  rationale: 実体詞的に用いられた形容詞。病状を示しながら、その人を病名だけで呼ぶ表現を避けた。
- source_word: αἰρόμενον
  choice: 担がれた
  rationale: 受動分詞で、その人が他者に持ち上げられ運ばれていたことを表す。「運ばれた」より身体を支えて運ぶ動作が明瞭な「担がれた」を選んだ。
- source_word: ὑπὸ τεσσάρων
  choice: 四人に
  rationale: 原文は単に「四人によって」と述べる。日本語でも人数だけで自然に理解できるため、「男たち」などを補わなかった。
