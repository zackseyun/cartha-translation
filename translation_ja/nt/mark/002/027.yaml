  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: ja
  text: また、イエスは彼らに言われた。「安息日は人[a]のために設けられたのであって、人が安息日のためにあるのではない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「人」は、男性に限らず、人間一般を代表している。別訳「人間」。
    reason: 原文の単数形ἄνθρωποςが人間一般を指す代表的用法であることを明確にするため。
lexical_decisions:
- source_word: ἔλεγεν
  choice: こう言われた
  rationale: 未完了時制には継続・反復の含みがあり得るが、この格言を導入する日本語としては「こう言われた」が自然である。敬意を示す「言われた」を用い、発言内容への導入を明確にした。
- source_word: τὸ σάββατον
  choice: 安息日
  rationale: 定冠詞付きの単数形で、安息日という日・制度を指す。現代日本語の聖書用語として定着している「安息日」が簡潔で明確である。
- source_word: διὰ τὸν ἄνθρωπον
  choice: 人のために
  rationale: 対格を伴うδιάは目的・益を表す。単数形ἄνθρωποςはここでは人間一般を代表しているため、修辞上の単数と対句を保てる「人」とした。
- source_word: ἐγένετο
  choice: 生じた
  rationale: γίνομαιの「生じる、存在するようになる」という意味を保ち、「定められた」「造られた」のように行為者や制定・創造の様態を必要以上に特定しない。後半の省略された動詞も補って同じ語で訳し、原文の対称性を示した。
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: 人が安息日のために生じたのではない
  rationale: 原文の省略を日本語では動詞を補って明示し、前半との鋭い対比と語順上の対応を保った。
theological_decisions:
- issue: 一般的・代表的用法の単数形ἄνθρωπος
  choice: 本文では「人」とし、人間一般を表すことを注で明示する
  alternative: 「人類」または「人間」
  rationale: この格言は安息日とすべての人間との関係を述べる一方、原文は代表的な単数形を二度用いて対句を作る。「人」は日本語で性別を限定せず、単数形の修辞も保てる。
- issue: ἐγένετοが示す安息日の起源・成立
  choice: 「生じた」
  alternative: 「設けられた」「造られた」「ある」
  rationale: 「設けられた」「造られた」は神の制定・創造をより明示し、「ある」は起源の含みを弱める。「生じた」は成立を表しつつ、その仕方や行為者を本文以上に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格言らしい簡潔さと前後半の対称性を保った。「生じた」は日常語の「できた」より格調があり、原文の成立・起源の含みも保持する。
