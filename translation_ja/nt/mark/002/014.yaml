  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: ja
  text: イエスは通りがかる途中、アルパヨの子レビが収税所[a]に座っているのを見て、「わたしについて来なさい」と言われた。するとレビは立ち上がり、イエスに従った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「料金徴収所」とも訳せる。原語は、税金や関税、通行税などを徴収する場所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: 通りがかりに
  rationale: 現在分詞の同時進行的な背景を、簡潔で自然な現代日本語で表した。
- source_word: εἶδεν
  choice: 見て
  rationale: ὁράωの基本義を保ち、「目に留めた」などの解釈的な含みを加えない。
- source_word: Λευὶν
  choice: レビ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: τὸν τοῦ Ἁλφαίου
  choice: アルパヨの子
  rationale: 属格による親子関係を日本語で明示した。Ἁλφαῖοςは原語の音に沿って「アルパヨ」とした。
- source_word: καθήμενον
  choice: 座っている
  rationale: レビがその時に置かれていた姿勢を自然かつ直接的に表した。
- source_word: ἐπὶ τὸ τελώνιον
  choice: 収税所
  rationale: 税や関税・通行税などを徴収する場所を指す語として、範囲を不必要に狭めず簡潔に表した。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として不自然な時制の揺れを避け、敬意を含む過去形で表した。
- source_word: Ἀκολούθει μοι
  choice: わたしについて来なさい
  rationale: 命令の直接性と、イエスに付き従う行為を自然な日本語で保持した。
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: 主動詞に先立つ動作の順序を保ち、自然な接続形で表した。
- source_word: ἠκολούθησεν αὐτῷ
  choice: イエスに従った
  rationale: 命令との語の連続性を保ちつつ、代名詞の指示対象を日本語で明確にした。
theological_decisions:
- issue: マルコの歴史的現在 λέγει の扱い
  choice: 日本語の物語時制に合わせて「言われた」とする
  alternative: 歴史的現在を形式的に保ち、「言われる」または「言う」とする
  rationale: 歴史的現在は物語を生き生きと示す用法であり、時間的な現在を主張するものではない。現代日本語では周囲の過去叙述に合わせるほうが明瞭で自然であり、意味上・神学上の内容も損なわない。
- issue: ἀκολουθέω の意味合い
  choice: 命令を「ついて来なさい」、応答を「従った」と訳し、実際の同行と弟子として従う含みを残す
  alternative: 両方を「ついて行く」として身体的移動を前面に出す、または「弟子になった」と解釈的に明示する
  rationale: この文脈では同行と弟子としての服従が重なり得るため、「弟子になった」と限定せず、原文の含みを保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。イエスへの敬意は「言われた」で自然に示し、会話は過度に古風にしない。
