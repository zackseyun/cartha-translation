  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: ja
  text: イエスは再び海辺へ出て行かれた。群衆全体がイエスのもとに来ていた[a]。そしてイエスは彼らを教えておられた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「来ていた」に当たるギリシア語の動詞は未完了過去形で、過去に継続していた、または繰り返されていた動作を表すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「教えておられた」に当たるギリシア語の動詞は未完了過去形で、過去に継続していた、または繰り返されていた動作を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出て行かれた
  rationale: 場所を明示せず「出て行く」というアオリストの基本的な意味を自然な日本語で表した。主語がイエスなので、現代の聖書文体として自然な尊敬表現を用いた。
- source_word: πάλιν
  choice: 再び
  rationale: 反復を端的に示し、格調を保ちながら現代日本語でも明瞭である。
- source_word: παρὰ τὴν θάλασσαν
  choice: 湖のほとりへ
  rationale: 文脈上の「海」はガリラヤ湖を指すため、日本語読者に自然な「湖」とした。παρά＋対格が示す岸辺への移動を「ほとりへ」で表した。
- source_word: πᾶς ὁ ὄχλος
  choice: 群衆は皆
  rationale: 単数の集合名詞を伴う表現を、意味を損なわず自然な日本語にした。
- source_word: ἤρχετο
  choice: 集まって来た
  rationale: ἔρχομαιの「来る」に、群衆がイエスのもとへ向かう文脈上自然な「集まる」を添えた。未完了過去の継続的な様相は脚注で示した。
- source_word: πρὸς αὐτόν
  choice: イエスのもとに
  rationale: 人への方向を示すπρόςを自然に表し、代名詞の指示対象を明確にした。
- source_word: ἐδίδασκεν
  choice: 教えておられた
  rationale: 未完了過去の継続的行為を「〜ておられた」で表し、イエスを主語とする自然な敬意も保った。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 直前の群衆を受ける目的語として明瞭に訳した。
