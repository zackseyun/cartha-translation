base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: ja
  text: 「体がまひした人に、『あなたの罪は赦されている[a]』と言うのと、『起き上がり、自分の寝床を持ち上げて、歩きなさい』と言うのと、どちらが易しいか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの罪は赦された」とも訳せる。ギリシア語の動詞は、赦しの結果として現在その状態にあることを強調しているとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: どちらが易しいか
  rationale: 二つの発言を比較する問いなので、比較の意味を保ちつつ自然な現代日本語とした。
- source_word: εἰπεῖν
  choice: と言う
  rationale: どちらの節でも直接話法を導いており、簡潔で対応の明確な訳とした。
- source_word: τῷ παραλυτικῷ
  choice: 体のまひした人に
  rationale: 病状を明確に伝えつつ、人を病名だけで呼ぶ表現を避けた。
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: あなたの罪は赦されている
  rationale: 現在形の受動表現が示し得る、赦しの結果としての現在の状態を自然な日本語で表した。行為者や時点は補わない。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: この文脈で標準的な訳語であり、原文にない負債などの比喩を加えない。
- source_word: Ἔγειρε
  choice: 起きて
  rationale: 横たわっている人に立ち上がるよう命じる、自然で明快な表現とした。
- source_word: ἆρον
  choice: 担ぎ
  rationale: 寝床を持ち上げて運ぶ動作を簡潔に表す。後続の「歩きなさい」と自然に連なる。
- source_word: τὸν κράβαττόν σου
  choice: 寝床
  rationale: 持ち運べる簡素な寝具を指す語である。「ベッド」ほど大型の家具を連想させず、「敷物」より用途が明確である。
- source_word: περιπάτει
  choice: 歩きなさい
  rationale: 命令の意味を明瞭に示し、継続性を不自然に強調しない。
theological_decisions:
- issue: 罪の赦しの宣言の訳し方
  choice: あなたの罪は赦されている
  alternative: あなたの罪は赦された
  rationale: 受動態の宣言を保ち、赦す主体を明示的に補わない。現在の赦された状態に焦点を置きつつ、完了した出来事としての理解も脚注に残し、イエスの権威をめぐる物語上の緊張を説明で解消しない。
