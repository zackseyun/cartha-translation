source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: ja
  text: あるとき、イエスはその人の家[a]で食卓に着いておられた。多くの徴税人や罪人たちも、イエスや弟子たちと食卓を共にしていた。彼らは大勢いて、イエスに従っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レビの家」とも考えられるが、「イエスの家」と理解する人もいる。ギリシア語は単に「彼の家」とだけ記している。
    reason: 代名詞αὐτοῦの指示対象に関する曖昧さを保存するため。
lexical_decisions:
- source_word: γίνεται
  choice: 〜ときのことである
  rationale: マルコに特徴的な歴史的現在による場面展開を、現代日本語の自然な物語表現で示す。
- source_word: κατακεῖσθαι
  choice: 食卓に着いておられた
  rationale: 当時の食事時の横臥姿勢を逐語的に「横になって」とせず、食事の場面であることが明確な自然な日本語にした。
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: その人の家で
  rationale: αὐτοῦの指示対象をレビまたはイエスと断定せず、ギリシア語の曖昧さを保つ。日本語の「彼の家」は指示が不自然になりやすいため「その人の家」とした。
- source_word: τελῶναι
  choice: 徴税人
  rationale: ローマ支配下の税収請負に関わる者を指す語として、現代日本語で明確かつ一般的な表現。
- source_word: ἁμαρτωλοὶ
  choice: 罪人たち
  rationale: 本文の直接的な呼称を保ち、社会的・宗教的にそう見なされた人々という解釈を本文へ付加しない。
- source_word: συνανέκειντο
  choice: 一緒に食卓に着いていた
  rationale: 食事の姿勢そのものよりも、イエスおよび弟子たちと食事を共にしたという複合動詞の含意を自然に伝える。
- source_word: μαθηταῖς
  choice: 弟子たち
  rationale: 教育的・関係的な意味を保つ、新約聖書で定着した明瞭な訳語。
- source_word: ἦσαν γὰρ πολλοὶ
  choice: このような人々が大勢いて、〜からである
  rationale: γάρの説明的機能を「からである」で示しつつ、主語が徴税人や罪人たちを指すことを自然な日本語で表した。
- source_word: ἠκολούθουν αὐτῷ
  choice: イエスに従っていた
  rationale: 未完了過去の継続的・背景的な動作を「従っていた」で表し、代名詞の指示対象は日本語で明確になるよう「イエス」とした。
theological_decisions:
- issue: 「その人の家」（ἐν τῇ οἰκίᾳ αὐτοῦ）の所有者
  choice: 本文では「その人の家」とし、所有者を特定しない
  alternative: 「レビの家」または「イエスの家」
  rationale: 直前の文脈からレビの家と理解するのが一般的だが、ギリシア語の代名詞自体は所有者を明示せず、イエスの家と取る余地もある。本文で一方に決めず、脚注で両解を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、食事場面には自然な「食卓に着く」を採用した。敬意表現はイエスに限定して「おられた」とし、過度に古風または教派的な語調を避けた。
