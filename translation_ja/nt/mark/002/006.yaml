  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: ja
  text: ところが、律法学者たちのうちの何人かがそこに座っていて、心の中でこう考えていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν δέ
  choice: ところが、…いた
  rationale: δέは場面をつなぎながら、直前の出来事に対する別の集団の内面的反応へ視点を移す。現代日本語では「ところが」が穏やかな対照を自然に示す。
- source_word: τινες τῶν γραμματέων
  choice: 律法学者たちのうちの何人か
  rationale: τινεςと部分属格の組み合わせを明示し、律法学者全員ではなく、その一部を指すことを保った。γραμματεύςは福音書の文脈に即して「律法学者」とした。
- source_word: ἐκεῖ καθήμενοι
  choice: そこに座っていて
  rationale: 場所を表すἐκεῖと、継続中の姿勢を表す分詞καθήμενοιを、自然な日本語の場面描写として訳した。
- source_word: διαλογιζόμενοι
  choice: 考えていた
  rationale: ここでは口に出す前の内面的な思案を表す。日本語の「論じていた」では外的な議論と誤解されやすいため、「考えていた」が文脈上明瞭である。
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: 心の中で
  rationale: 内的な思考の場としての「心」という聖書的表現を保ちつつ、日本語として自然な「心の中で」とした。
theological_decisions:
- issue: καρδίαιςにおける人間理解の慣用表現
  choice: 心の中で
  alternative: 自分たちの内で／頭の中で
  rationale: 原文は心を内面的な思考や熟慮の場として表す。「頭の中で」と限定せず「心」を残すことで、現代的な心情と知性の二分法を持ち込まず、原文の概念世界を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、福音書の叙述にふさわしい落ち着いた文体とした。次節に思考内容が続くため、文末はコロンではなく「こう考えていた。」とし、後続内容へのつながりを示した。
