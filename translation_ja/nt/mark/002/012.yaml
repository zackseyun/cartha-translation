id: MRK.2.12
reference: Mark 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: ja
  text: すると、その人は起き上がり、すぐに寝床を取り上げ、皆の前で出て行った。そのため、一同は驚き、神をあがめて、「こんなことは今まで見たことがない」と言った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「このようなことは、今まで一度も見たことがない」。これまで経験したことのない出来事だった、という意味。
    reason: ギリシア語の簡潔な慣用表現について、字義的な形と文脈上の意味を示すため。
lexical_decisions:
- source_word: ἠγέρθη
  choice: 起き上がり
  rationale: この文脈では、中風の人がイエスの命令に応じて身体を起こしたことを自然に表す。受動形の可能性はあるが、「起こされた」とすると、ここでは前面に出ていない復活の含みを強く感じさせるため避けた。
- source_word: εὐθύς
  choice: すぐに
  rationale: マルコに特徴的な動作の即時性を、明快な現代日本語で保つ。
- source_word: ἄρας
  choice: 取り上げ
  rationale: 寝床を持ち上げて携える動作を自然に表す。
- source_word: κράβαττον
  choice: 寝床
  rationale: 簡素な敷物や寝台を指す語であり、「ベッド」ほど大型の家具を連想させず、「担架」と限定しすぎない表現を選んだ。
- source_word: ἔμπροσθεν πάντων
  choice: 皆の前を通って
  rationale: 奇跡が全員の目の前で公然と示されたことに加え、その人が群衆の前を通って退出したという動きを自然に示す。
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: そのため、一同は驚き
  rationale: 結果を表す構文と、ἐξίστημιが示す強い驚きを簡潔で自然な日本語にした。
- source_word: δοξάζειν τὸν θεόν
  choice: 神をあがめて
  rationale: 神に栄光を帰す応答を、現代の聖書文体として自然かつ格調ある形で表す。
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: こんなことは今まで見たことがない
  rationale: 直訳的には「このようには決して見たことがない」だが、前例のない出来事を目撃したというギリシア語の慣用的な意味を自然に伝える。
theological_decisions:
- issue: ἠγέρθηにあり得る復活との語彙的連想
  choice: 直近の治癒物語に即して「起き上がり」と訳す
  alternative: 「起こされ」「立ち上がり」
  rationale: ἐγείρωは他の箇所で復活を表し得るが、ここでは癒やされた人が命令どおり身体を起こすことが直接の意味である。復活への連想を訳文で不必要に強めない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語の即時性と公然性を保った。「寝床」は簡素な敷物または寝台の幅を残し、「神をあがめる」は礼拝的な応答を自然で格調ある表現にした。脚注記号は説明対象である結びの発言の直後に置いた。
