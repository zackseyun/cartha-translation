  to: すると、その人は起き上がり、すぐに寝床を取り上げ、皆の前で出て行った。そのため、一同は驚き、神をあがめて、「こんなことは今まで見たことがない」と言った。[a]
  rationale: ἔμπροσθεν πάντων の公然性を「皆の前で」により過不足なく表し、「皆の前を通って」が含み得る余分な移動描写を避けた。脚注も、原文の強い否定と前例のなさを自然な日本語で示すよう整えた。その他の語彙選択、文体、脚注位置は維持できる。
