  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: ja
  text: 群衆のために、その人をイエスのもとへ連れて行くことができなかったので、彼らはイエスがおられた所の屋根をはがし、穴を開けて、麻痺した人が横たわっていた敷物をつり降ろした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「敷物」は、簡素な寝床または床敷きを指す語。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι προσενέγκαι αὐτῷ διὰ τὸν ὄχλον
  choice: 群衆に阻まれて、その人をイエスのもとへ運んで行くことができなかったので
  rationale: 分詞句の理由・状況を自然な日本語で示す。「その人」と「イエス」を明示し、二つの代名詞の別々の指示対象を保持する。διάの原因性は「群衆に阻まれて」で表した。
- source_word: ἀπεστέγασαν τὴν στέγην ὅπου ἦν
  choice: イエスのおられる辺りの屋根をはがし
  rationale: 珍しい動詞ἀποστεγάζωの、屋根の覆いを取り除く動作を「屋根をはがす」と簡潔に表す。ὅπου ἦνの指示対象は文脈上イエスであり、日本語では明示する方が明瞭。「辺り」は真上と断定しすぎず位置関係を示す。
- source_word: ἐξορύξαντες
  choice: 穴を開けて
  rationale: 字義的には掘り抜く動作を表すが、屋根の材質を特定せず、結果を含めて自然に表現した。
- source_word: χαλῶσι
  choice: つり降ろした
  rationale: 下方へ降ろす動作を明瞭に表す。ギリシア語の歴史的現在は、日本語の物語叙述では過去形にする方が自然である。
- source_word: κράβαττον
  choice: 敷物
  rationale: 簡素な寝具または寝床を指し、大型の「ベッド」や運搬専用の「担架」と限定しない語を選んだ。
- source_word: ὁ παραλυτικὸς
  choice: 体の麻痺した人
  rationale: 名詞的形容詞を、現代日本語で人を状態だけの呼称に還元しにくい表現にした。麻痺の範囲は原文が特定しないため「体の」とした。
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: 体の麻痺した人が横たわっている
  rationale: ὅπουは直訳すれば「そこに」だが、文脈上は敷物とその上に横たわる人との関係を自然に表す修飾節とした。
theological_decisions:
- issue: αὐτῷおよびὅπου ἦνの指示対象
  choice: いずれも文脈上のイエスを明示する
  alternative: 「その方のもとへ」「おられる所の」と代名詞的に訳す
  rationale: 日本語では代名詞を重ねると指示関係が不鮮明になる。前節の文脈に基づく指示対象を明示するだけで、解釈上の新情報は加えていない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた語調を保った。「屋根をはがし、穴を開けて」は原文の二段階の動作を保持している。
