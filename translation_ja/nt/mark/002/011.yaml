base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: ja
  text: 「あなたに言う。起き上がり、敷物を担いで、自分の家に帰りなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: あなたに言う
  rationale: 文頭の与格代名詞による直接的な呼びかけを保ちつつ、現代日本語で簡潔かつ権威ある言い方とした。
- source_word: ἔγειρε
  choice: 起き上がり
  rationale: 麻痺していた人への具体的な命令として自然であり、「立て」よりも原語の起きる動作を広く表せる。後続命令と滑らかにつなぐため連用形にした。
- source_word: ἆρον
  choice: 持って
  rationale: 寝床を地面から取り上げ、そのまま運ぶ動作を文脈上自然に伝える。「取り上げて」より簡潔で日常的な表現とした。
- source_word: κράβαττόν
  choice: 寝床
  rationale: 簡素で携帯できる敷物・寝台を指す語。「ベッド」では大きな家具を連想させやすく、「床」では意味が曖昧になるため、「寝床」を選んだ。
- source_word: ὕπαγε
  choice: 帰りなさい
  rationale: 単独では「行きなさい」だが、目的地が本人の家なので、日本語では「自分の家に帰りなさい」が自然である。方向と帰宅の意味を一体として表した。
- source_word: εἰς τὸν οἶκόν σου
  choice: 自分の家に
  rationale: 直訳的な「あなたの家に」より、主語自身の家を指す日本語として自然な再帰表現を用い、οἶκοςの具体性も保った。
theological_decisions:
- issue: イエスの癒やしの命令が持つ調子と力
  choice: 「あなたに言う」で始まる、本人に向けた直接的で権威ある三つの命令として訳す。
  alternative: 「あなたに命じる」または文語的な「あなたに言う。起きよ、床を取り上げ、家に帰れ」。
  rationale: λέγωは「命じる」と明示してはいないため、その含意を訳文に足さず、命令形の連続そのものに権威を示させた。また、古風な命令形を避け、現代の読者に明瞭な表現とした。
translation_notes:
  register: 明瞭な現代標準日本語。発話の荘重さは簡潔な「あなたに言う」で保ち、命令は威圧的に響きすぎない「なさい」形で統一した。原文上、注記を必要とする本文異読や不可欠な語義上の曖昧さはないため、脚注は付していない。
