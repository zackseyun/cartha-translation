id: MRK.2.26
reference: Mark 2:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: ja
  text: アビアタルが大祭司であったころ[a]、ダビデがどのようにして神の家に入り、祭司たちのほかには食べることを許されていない供えのパン[b]を食べ、一緒にいた者たちにも与えたか、読んだことがないのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アビアタルの大祭司在任中に」。この句はより広く、大祭司アビアタルに関連する時代、または彼に関する物語の箇所を指すとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「供えのパン」は、聖所で神の前に供え置かれた、聖別されたパンを指す。
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: 〜たではないか
  rationale: 直前から続く、ダビデの行為を思い起こさせる修辞疑問として、現代日本語で自然に表した。
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: 神の家に入り
  rationale: 原文の空間表現と神聖な場という含意を簡潔に保った。
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: アビアタルが大祭司であったころ
  rationale: ἐπί＋属格の時間的用法を自然に訳しつつ、旧約並行記事との関係について原文以上に限定的な年代主張をしない。
- source_word: ἄρτους τῆς προθέσεως
  choice: 供えのパン
  rationale: 神の前に供え置かれた聖別されたパンを指す祭儀用語として、簡明で現代の読者に理解しやすい表現を選んだ。
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: 祭司たちのほかは食べることを許されていない
  rationale: ἔξεστινの許可・合法性を明示し、祭司だけに認められた例外を自然な日本語で表した。
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: 一緒にいた者たちにも与えた
  rationale: 省略された目的語は文脈上明白なので補わず、καίの追加の意味を「にも」で表した。
theological_decisions:
- issue: アビアタルを伴う時間句とサムエル記第一21章との関係
  choice: 本文では「アビアタルが大祭司であったころ」と訳す。
  alternative: 「アビアタルの大祭司在任中に」または「大祭司アビアタルに関する箇所で」
  rationale: ギリシア語は比較的広い時間的・叙述的関連を許しうる。本文で問題を断定的に解消せず、別の理解を脚注に残して原文の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。直前の文脈から続く修辞疑問として文末を整え、祭儀用語には説明脚注を付した。
