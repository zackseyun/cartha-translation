  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: ja
  text: そして、ファリサイ人たちはイエスに言っていた。「見てください。なぜ彼らは安息日に、してはならないことをしているのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見てください。彼らは安息日に、許されないどんなことをしているのですか。」ギリシア語の τί は「何」とも読めるが、ここでは文脈上「なぜ」の意味である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 物語の流れを自然につなぎ、明示されていない強い時間的意味は加えない。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 現代日本語で集団名として分かりやすい慣用的な表現。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的な側面を保つ。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 日本語では代名詞の「彼に」より指示対象を明示するほうが自然である。文脈上、指示対象はイエス。
- source_word: Ἴδε
  choice: 見てください
  rationale: 注意を促す命令を、尊敬語に寄りすぎない自然な対話表現で訳す。
- source_word: τί
  choice: なぜ
  rationale: 形式上は「何」とも読めるが、非難を表すこの文脈では理由を問う「なぜ」が自然。別解は脚注に示す。
- source_word: ποιοῦσιν
  choice: しているのですか
  rationale: 直接話法内の現在形と、詰問する調子を自然な日本語で表す。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: 複数形は安息日を指す慣用的用法であり、日本語では単数相当で訳すのが自然。
- source_word: ὃ οὐκ ἔξεστιν
  choice: してはならないこと
  rationale: 許可されていない、または適法でないという宗教的・法的な非難を明瞭に表しつつ、その根拠を特定しない。
theological_decisions:
- issue: ファリサイ派の異議の根拠
  choice: 「してはならない」と訳し、何に基づく禁止かは特定しない。
  alternative: 「律法に反する」または「違法である」
  rationale: 原文は行為が許されないと述べるだけで、聖書の律法、ファリサイ派の伝承、その他の解釈のいずれに基づくかを明示していないため。
- issue: τί の統語的な曖昧さ
  choice: 本文では文脈上自然な「なぜ」とする。
  alternative: 「安息日にしてはならない何を、彼らはしているのですか」
  rationale: τί は「何」とも解し得るため、その真正な曖昧さを脚注で保存する。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての品位を保つ文体。「言っていた」で未完了過去を反映し、問いは自然な丁寧体とした。脚注記号[a]は該当する発言文の末尾に置いた。
