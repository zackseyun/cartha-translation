source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: ja
  text: 数日たって、イエスが再びカファルナウムに入ると、家にいる[a]ということが知れ渡った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「家の中にいる」。原文は、それがイエス自身の家であるかどうかを明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 入ると
  rationale: 主動詞に先立つアオリスト分詞を時間的に捉え、出来事の順序を保ちながら自然な現代日本語にした。
- source_word: πάλιν
  choice: 再び
  rationale: 帰還・反復を示す標準的な副詞の意味を簡潔に表す。
- source_word: Καφαρναούμ
  choice: カファルナウム
  rationale: 原語の地名を、日本語聖書で広く通用する形で音写した。
- source_word: δι’ ἡμερῶν
  choice: 数日たって
  rationale: 何日かの間隔があったことを示す慣用表現。期間を不必要に特定せず、自然な日本語で表した。
- source_word: ἠκούσθη
  choice: 知れ渡った
  rationale: 直訳的な「聞かれた」よりも、知らせが人々に伝わったという非人称受動の報告表現を自然に伝える。
- source_word: ἐν οἴκῳ
  choice: 家にいる
  rationale: 「自宅にいる」とも「ある家の中にいる」とも取り得るため、所有者を明示しない「家にいる」とし、より直訳的な読みを脚注で示した。
- source_word: ἐστίν
  choice: いる
  rationale: 原文の間接話法内の現在形を保った。日本語では過去の伝聞を導く文脈でも自然に読める。
theological_decisions:
- issue: ἐν οἴκῳが「自宅に」を意味するのか、単に「家の中に」を意味するのか
  choice: 家にいる
  alternative: 家の中にいる／自宅にいる
  rationale: 文脈上はカファルナウムでの拠点を指す可能性があるが、原文は家の所有者を特定しない。本文では曖昧さを保ち、脚注で直訳的な選択肢を示した。
translation_notes:
  register: 明快な現代標準語を用いた。「イエス」を補って主語を明確にしつつ、敬語を重ねず簡潔で品位ある物語文とした。
