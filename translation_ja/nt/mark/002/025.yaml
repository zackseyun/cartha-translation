  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: ja
  text: イエスは彼らに言われた。「ダビデが必要に迫られ、彼自身も、彼と一緒にいた人たちも空腹だったとき、何をしたか、あなたがたは一度も読んだことがないのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: 食べ物に事欠いて
  rationale: 直訳は「必要があった」だが、直後の「空腹になった」と文脈上密接に結びついているため、必要の具体的内容を自然な日本語で示した。
- source_word: ἐπείνασεν
  choice: 空腹になった
  rationale: アオリストの出来事として、ダビデが飢えたことを明確に表す。
- source_word: οἱ μετ’ αὐτοῦ
  choice: 供の者たち
  rationale: ダビデと行動を共にしていた一行を簡潔で自然に表す。
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: 一度も読んだことがないのですか
  rationale: 否定疑問の修辞的な強さを保ちつつ、現代日本語として自然にした。
theological_decisions:
- issue: 「必要があった」の内容
  choice: 食べ物に事欠いて
  alternative: 必要に迫られ
  rationale: 空腹との並列を踏まえ、ここでの欠乏が食物に関わることを明示した。ただし、より広い意味の困窮を表す読みも可能である。
- issue: 主語「彼」の明示
  choice: イエスは
  alternative: 彼は
  rationale: 日本語では談話上の主語を明示した方が分かりやすく、文脈上イエスを指すことに疑義がない。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。イエスの問いかけの鋭さを保ちながら、過度に古風な聖書語は避けた。
