reference: Mark 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: ja
  text: すると、すぐにイエスは、彼らが内心でそのように考えていることをご自分の霊で悟り、彼らに言われた。「なぜあなたがたは、心の中でこのようなことを考えているのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: するとすぐに
  rationale: マルコ福音書に特徴的な、出来事が直ちに展開する生き生きとした語り口を、自然な現代日本語で表した。
- source_word: ἐπιγνοὺς
  choice: 悟り
  rationale: 明確に認識する、気づくという意味を表しつつ、イエスが知った仕方を必要以上に限定しない表現とした。
- source_word: τῷ πνεύματι αὐτοῦ
  choice: ご自分の霊で
  rationale: 与格が領域または手段を表す可能性を保ち、イエスの内なる霊を指すのか、霊的な知覚の仕方を指すのかを訳文で決めつけないようにした。
- source_word: οὕτως
  choice: そのように
  rationale: 彼らの考え方を指す副詞の働きを、明瞭で自然な日本語で表した。
- source_word: διαλογίζονται / διαλογίζεσθε
  choice: 考えている／考えているのか
  rationale: この文脈では口頭の議論ではなく内面的な思考や論議を表すため、「論じる」ではなく「考える」とした。
- source_word: ἐν ἑαυτοῖς
  choice: 自分たちの内で
  rationale: 互いに話し合っていたのではなく、各自の内面で考えていたことを示しつつ、原文の表現を保った。
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: なぜ、あなたがたは……そのようなことを考えているのか
  rationale: τί は字義的には「何」だが、この疑問文では理由を問う「なぜ」が自然である。ταῦτα は直前の内容を受ける「そのようなこと」とした。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 心の中で
  rationale: 聖書における「心」が思考や意図を含む内なる人を指すことを保ち、単に「頭の中」とはしなかった。
theological_decisions:
- issue: 「ご自分の霊で悟り」におけるイエスの認識の性質
  choice: 彼らの内面的な考えをイエスが悟ったことを明示しつつ、その認識の仕方は限定しない。
  alternative: 神としての全知を直接述べる表現、聖霊による認識と明示する表現、または人間的な洞察だけを述べる表現。
  rationale: 本文はイエスが彼らの内なる思考を知ったことを明確にする一方、τῷ πνεύματι αὐτοῦ だけでは、その仕方を神的全知、聖霊による知覚、あるいは内面的な洞察のいずれかに限定できない。原文の神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叙述には聖書本文としての品位を保った。「ご自分」「言われた」によりイエスへの自然な敬意を示し、過度に古風な語法は避けた。
