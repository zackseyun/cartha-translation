  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: ja
  text: ですから、人の子は安息日の主でもあるのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ですから、人の子は安息日の主でさえあるのです」とも訳せる。ギリシア語の接続詞は「も」と訳せるが、ここでは「さえ」という強意を表し、人の子の権威が安息日にまで及ぶことを強調している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す接続詞。現代日本語として自然で、推論の流れを明確に保つ。
- source_word: κύριος
  choice: 主
  rationale: ここでは権威と支配権を表す。キリスト論的な響きを弱めず、定着した訳語を用いる。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの特徴的な自称として定着しており、一般的な『人間』などと解釈して置き換えず、その含意と曖昧さを保つ。
- source_word: καὶ
  choice: でも
  rationale: ここでは付加・強意の用法と捉え、『安息日についても主である』という権威の及ぶ範囲を自然な日本語で示す。文脈によっては『さえ』とも訳せるため、脚注で示す。
- source_word: σαββάτου
  choice: 安息日
  rationale: ユダヤ教の安息日を指す定着した自然な訳語。属格は『安息日の主』として表す。
theological_decisions:
- issue: 人の子が安息日に対して持つ権威という主張のキリスト論的な強さ
  choice: 『安息日の主』とし、主権を直接的に表す
  alternative: 『安息日について権威を持つ』
  rationale: κύριος は単に限定的な許可や権限を持つというより、『主』であることを表す。本文を越えた教理的説明は加えず、原文の強い主張を保つ。
- issue: 『人の子』の指示対象
  choice: イエスの称号として『人の子』を保持する
  alternative: 『人間』『人である者』
  rationale: マルコ福音書ではイエスの自己指示として機能しつつ、より広い人間的意味やダニエル書との響きを帯びうる。訳文で一つの解釈に限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準語。結論を示す ὥστε を『ですから』、叙述の ἐστιν を『あるのです』として、直前の発言を受ける自然な口調にした。伝統的な聖書用語『人の子』『安息日』『主』は保持した。
