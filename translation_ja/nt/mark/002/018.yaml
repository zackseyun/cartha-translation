  to: ヨハネの弟子たちとファリサイ派の人々は断食をしていた。そして、彼のもとに来て尋ねた[a]。「ヨハネの弟子たちとファリサイ派の弟子たちは断食をするのに、なぜあなたの弟子たちは断食をしないのですか。」
  rationale: 原文の暗黙の主語を日本語の主語省略で保持し、質問における二集団の明示的な並列を「と」に改めた。「すると」を中立的な「そして」に置き換え、原文の単純な接続を過度に解釈しないようにした。脚注アンカーは維持し、本文と脚注の説明を整合させた。
