source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: ja
  text: ヨハネの弟子たちとファリサイ派の人々は断食をしていた。そして、彼のもとに来て尋ねた[a]。「ヨハネの弟子たちとファリサイ派の弟子たちは断食をするのに、なぜあなたの弟子たちは断食をしないのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らが来て、彼に言った」。ギリシア語では「来て」「言った」の主語が明示されておらず、だれが尋ねたのかは断定できない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: 断食をしていた
  rationale: 未完了過去のεἰμίと現在分詞による迂言形が表す、過去に継続していた行為を自然な現代日本語で示す。
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ヨハネの弟子たち
  rationale: 属格が示す所属・師弟関係を簡潔かつ自然に表す。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 現代日本語の一般読者にも集団名だと分かりやすく、単なる固有名の音写より自然である。
- source_word: ἔρχονται καὶ λέγουσιν αὐτῷ
  choice: すると、人々がイエスのもとに来て尋ねた
  rationale: マルコ特有の歴史的現在を日本語の自然な物語時制で訳した。「言った」は後続する疑問文の発話機能に合わせて「尋ねた」とした。主語は原文で明示されないため不特定の「人々」とし、脚注で曖昧さを示す。代名詞は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う表現の簡潔で自然な対応語。
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: ファリサイ派の弟子たち
  rationale: 属格による関係を保ちつつ、日本語として明瞭に表す。
- source_word: νηστεύουσιν
  choice: 断食をする
  rationale: この現在形は、その時点だけでなく慣行を述べる可能性があるため、習慣的行為にも読める非進行形を用いる。
- source_word: οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν
  choice: あなたの弟子たちは断食をしない
  rationale: δέの対照は、日本語では前節の「のに」によって自然に示した。所有関係と否定を明確に保つ。
theological_decisions:
- issue: 「来て言う」の暗黙の主語が誰か
  choice: 本文では不特定の「人々」を補い、脚注で原文の主語が明示されていないことを示す
  alternative: 直前のヨハネの弟子たちとファリサイ派の人々を主語とみなし、「彼らが」と訳す
  rationale: ギリシア語ではἔρχονταιとλέγουσινの主語が明記されず、直前の二集団を指す可能性はあるものの断定できない。日本語に必要な主語を最小限補いながら、原文の曖昧さを脚注に保存する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話は丁寧だが過度に改まらない調子とした。「ファリサイ派の人々」で集団名を分かりやすくし、歴史的現在は日本語の物語として自然な過去形にした。
