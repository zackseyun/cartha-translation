  source_fidelity: 冒頭の「ヨハネの弟子たちとファリサイ派の人々は断食をしていた」は、ἦσαν ... νηστεύοντες の継続的な過去の状況をよく表している。質問中の二集団は καὶ（そして／と）で並列されているため、「や」ではなく「と」とする必要がある。また、ἔρχονται καὶ λέγουσιν の主語は原文で明示されないので、「人々」を補わず日本語で主語を省略するほうが、脚注の説明とも整合し、曖昧さを保てる。
  naturalness: 「そして、彼のもとに来て尋ねた」は、物語文として自然であり、主語を置かない日本語の性質を利用して原文の不定性を保てる。「すると」は不必要に強い場面展開・帰結を示し得るため、「そして」がより穏当である。会話文は明瞭で自然である。
  terminology: 「ヨハネ」「ファリサイ派」「弟子たち」「断食」は明瞭で標準的である。「ファリサイ派の人々」は Φαρισαῖοι を集団名として適切に表す。神学的用語に不当な解釈の付加はない。
