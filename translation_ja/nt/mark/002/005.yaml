source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: ja
  text: イエスは彼らの信仰を見て、体がまひしている人に言われた。「子よ、あなたの罪は赦されている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: 見て
  rationale: アオリスト分詞の主動詞とのつながりを保ち、自然な日本語で先行する状況を表す。
- source_word: πίστιν
  choice: 信仰
  rationale: ここでは、人々がその人をイエスのもとへ連れて来た行動に表れた信頼を指す。「信仰」は新約聖書における標準的で明瞭な訳語である。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 複数属格をそのまま保ち、まひした人を含むか否かを本文以上に限定しない。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシャ語は物語を生き生きと語る歴史的現在だが、現代日本語の自然な物語時制として過去形を用いる。敬語はイエスに対する日本語聖書らしい品位を保つ。
- source_word: παραλυτικῷ
  choice: 体のまひした人
  rationale: 名詞的に用いられた形容詞を、現代の一般読者に分かりやすく、人物を病状だけで呼ぶことを避けた表現にする。
- source_word: Τέκνον
  choice: 子よ
  rationale: 性別を明示しないτέκνονの親愛を込めた呼びかけを、簡潔で品位ある日本語にする。「わが子よ」よりも原文にない所有表現を加えない。
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: あなたの罪は赦されている
  rationale: 現在受動形を、赦しが現在の現実として成立していることを表す日本語にした。受動の背後にある行為者は原文同様に明示しない。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: 日本語では「罪」が集合的に複数の罪を自然に含みうるため、意味を損なわず標準的な表現とする。
theological_decisions:
- issue: イエスによる赦しの宣言の性質
  choice: 「あなたの罪は赦されている」と直接的に宣言する
  alternative: 「あなたの罪は赦された」／「あなたの罪は赦されつつある」
  rationale: 現在受動形が示す赦しの現実を保ちつつ、その機序、時点、暗黙の行為者について本文を越えた説明を加えない。
- issue: 「彼ら」の範囲
  choice: 「彼ら」と訳し、範囲を限定しない
  alternative: 運んで来た人々だけを指すと明示する／まひした人も含むと明示する
  rationale: αὐτῶνが誰を含むかはこの節だけでは明示されないため、その曖昧さを保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で尊厳ある物語調とした。歴史的現在は日本語として自然な過去形にし、呼びかけの温かさと赦しの宣言の力を保った。
