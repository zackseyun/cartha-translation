  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: ja
  text: ファリサイ派の律法学者たちは、イエスが罪人や徴税人たちと一緒に食事をしているのを見て、弟子たちに言った。「なぜ彼は、徴税人や罪人たちと一緒に食事をするのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραμματεῖς
  choice: 律法学者
  rationale: 福音書の文脈で、聖書本文と律法の解釈に通じた公認の専門家を指す語として、現代日本語で自然かつ標準的である。
- source_word: τῶν Φαρισαίων
  choice: ファリサイ派の
  rationale: 属格が示す所属・結びつきを簡潔に保ち、彼らがファリサイ派に属する、または同派と結びついた律法学者であることを表す。
- source_word: ἰδόντες
  choice: 見て
  rationale: アオリスト分詞の時・状況を示す働きを、自然な日本語の連用形で表した。
- source_word: ὅτι ἐσθίει
  choice: 食事をしているのを
  rationale: 未完了過去が描く進行中の場面を「している」で表し、「食べる」よりも共同の食卓という文脈が自然に伝わる「食事をする」を選んだ。
- source_word: μετά
  choice: と一緒に
  rationale: 連れ立って食卓を共にするという関係を、過度な解釈を加えず自然な日本語で示す。
- source_word: ἁμαρτωλῶν
  choice: 罪人たち
  rationale: 当時の社会的・宗教的なレッテルの強さを和らげず、直接的に訳した。
- source_word: τελωνῶν
  choice: 徴税人たち
  rationale: 税や通行税などを徴収した、社会的に忌避されがちな人々を指す定着した訳語である。
- source_word: ἔλεγον
  choice: 言った
  rationale: 日本語では進行・反復を明示する「言っていた」がこの一回の問いを不自然に響かせ得るため、物語の流れに沿う自然な過去形とした。未完了の側面は文脈上の発言場面に含ませた。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: 教師に学び従う者を表す定着した訳語であり、単なる「従う者」より関係を正確に示す。
- source_word: Ὅτι
  choice: なぜ
  rationale: ここでは非難を含む疑問を導く用法であり、現代日本語では「なぜ」が最も自然である。
- source_word: ἐσθίει
  choice: 食事をするのか
  rationale: 現在形の未完結的な意味を保ち、目の前の行為だけでなく、そのような人々との食卓交わりへの一般的な異議としても読める表現にした。
theological_decisions:
- issue: 食卓を共にすることの社会的・宗教的意味
  choice: 本文では「一緒に食事をする」と訳し、交わりの意味を説明として付加しない。
  alternative: 「食卓を共にする」「親しく食事をする」と訳して交わりの含意を前面に出す。
  rationale: 原文は通常の「食べる」という動詞と「共に」を用いる。共同の食事が持つ社会的・宗教的緊張は物語そのものから伝わるため、本文で解釈を過度に強めない。
- issue: 「罪人」という呼称
  choice: 評価語をそのまま「罪人たち」とする。
  alternative: 「罪深い人々」「罪人と見なされた人々」と説明的に訳す。
  rationale: 語り手の定義か相手側の社会的呼称かを訳文で決めつけず、原文にある緊張と曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「ファリサイ派」「律法学者」「徴税人」は一般読者にも理解可能な標準的用語とした。原文の語順どおり、前半では「罪人や徴税人」、引用内では「徴税人や罪人」と順序を入れ替えている。
