  source_fidelity: SBLGNTの構文と語順上の対比を適切に反映している。「ファリサイ派の律法学者たち」はοἱ γραμματεῖς τῶν Φαρισαίωνの所属関係を過剰に限定せずに示し、前半の「罪人や徴税人」と引用内の「徴税人や罪人」の順序の違いも保持している。「食事をしているのを見て」と「食事をするのか」は、それぞれの未完了相および現在形の文脈に自然に対応する。
  naturalness: 明瞭で自然な現代標準日本語であり、聖書本文にふさわしい落ち着いた文体である。「一緒に食事をする」はμετά＋属格とἐσθίωがこの場面で示す共同の食事を自然に表す一方、「親しく」などの解釈的な要素を加えていない。
  terminology: 「ファリサイ派」「律法学者」「弟子」「徴税人」「罪人」は福音書文脈の標準的で理解可能な用語である。「罪人たち」は原文の社会的・宗教的な呼称の力を不必要に緩和せず、誰の最終的評価であるかも訳文で決めつけていない。
