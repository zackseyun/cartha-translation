id: MRK.2.23
reference: Mark 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: ja
  text: さて、ある安息日に、イエスが穀物畑[a]の中を通っておられると、弟子たちは穂を摘みながら進み始めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「種をまいた畑」。穀物の種類は原文で特定されていない。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「道を作ることを始めた」。ここでは、穂を摘みながら畑の中を進むことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: さて、…と
  rationale: 出来事を導入する物語上の定型表現を、現代日本語で自然な場面転換として表した。
- source_word: ἐν τοῖς σάββασιν
  choice: ある安息日に
  rationale: 複数形はコイネー・ギリシア語で一回の安息日を指し得る。物語中の特定の日だが初出なので「ある」を補った。
- source_word: παραπορεύεσθαι
  choice: 中を通っておられる
  rationale: 継続中の移動を表す構文を反映し、麦畑を通過している場面を自然に描いた。
- source_word: διὰ τῶν σπορίμων
  choice: 麦畑の中を
  rationale: σπόριμα は種をまいた畑、特に穀物畑を指す。日本語では文脈に即した「麦畑」が明瞭だが、穀類の種類は原文で特定されないため脚注を付した。
- source_word: ἤρξαντο
  choice: 始めた
  rationale: 補語的不定詞を伴う開始の意味をそのまま表した。
- source_word: ὁδὸν ποιεῖν
  choice: 進み
  rationale: 直訳は「道を作る」だが、ここでは穂を摘みつつ畑の中を進むことを表す慣用句と判断した。不要な道路造成の含意を避けた。
- source_word: τίλλοντες
  choice: 摘みながら
  rationale: 穂を手で摘み取る動作と、進行と同時に行われる分詞の働きを表した。
- source_word: τοὺς στάχυας
  choice: 穂
  rationale: 穀物の穂を指す。直前の「麦畑」により対象が明らかなため、簡潔で自然な語を選んだ。
- source_word: αὐτὸν
  choice: イエスが
  rationale: ギリシア語では代名詞だが、日本語で節の主語を明確にし、前後の文脈で指示対象となるイエスを明示した。
theological_decisions:
- issue: 安息日の表現
  choice: ある安息日に
  alternative: 安息日ごとに／安息日の間に
  rationale: 複数形 σάββασιν はここでは慣用的に一回の安息日を表すと理解した。反復行為とは断定しない。
- issue: ὁδὸν ποιεῖν と安息日論争の関係
  choice: 進み始めた
  alternative: 道を作り始めた
  rationale: 文脈上は穂を摘みながら進むことを指すとみられる。「道を作る」とすると、弟子たちの行為を原文以上の労働として描く可能性があるため避けた。ただし直訳上の形は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として自然でありながら品位ある調子にした。「おられる」はイエスへの敬意を示す通常の日本語表現で、原文にない神学的主張を加える意図はない。
