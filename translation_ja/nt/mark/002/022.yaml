reference: Mark 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: ja
  text: また、新しいぶどう酒を古い革袋に入れる人はいない。そんなことをすれば、ぶどう酒が革袋を破り、ぶどう酒も革袋もだめになる[a]。新しいぶどう酒は新しい革袋に入れるものだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「失われる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: 入れる
  rationale: 液体を容器に移す場面で自然な現代日本語。原語は広い意味を持つため、「注ぐ」と限定しすぎない。
- source_word: οἶνον νέον
  choice: 新しいぶどう酒
  rationale: 作られて間もない、発酵中のぶどう酒を指す比喩を明瞭に保つ。
- source_word: ἀσκούς
  choice: 革袋
  rationale: 動物の皮で作られた液体用の袋を指す。日本語では「革袋」が簡潔で、当時の容器のイメージも保てる。
- source_word: παλαιούς
  choice: 古い
  rationale: 原語の直接的な対比を保ち、「使い古した」と解釈を加えすぎない。
- source_word: ῥήξει
  choice: 破り
  rationale: 発酵による圧力で革袋が裂ける結果を自然に表す。主語がぶどう酒なので、「ぶどう酒が革袋を破る」とした。
- source_word: ἀπόλλυται
  choice: だめになる
  rationale: ぶどう酒が失われ、革袋も使えなくなるという文脈上の損失を、一般読者に明瞭な表現で伝える。「失われる」という訳の余地は脚注に残した。
- source_word: καινούς
  choice: 新しい
  rationale: παλαιούς（古い）との対比を自然に示す。νέονとκαινούςの語感の違いを日本語本文で不自然に強調せず、革袋が古びていないことを文脈に委ねた。
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: 新しいぶどう酒は新しい革袋に入れるものだ
  rationale: 原文の動詞省略を、日本語の一般原則を表す「ものだ」で補い、命令として強めずにことわざ的な簡潔さを保った。
theological_decisions:
- issue: 末尾の動詞を欠く句の性格
  choice: 一般的な原則として「入れるものだ」と訳す
  alternative: 「新しいぶどう酒は新しい革袋に」／「新しい革袋に入れなければならない」
  rationale: ギリシア語には明示的な動詞も命令・義務表現もない。日本語として意味を完結させつつ、明示されていない命令の力を持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用い、比喩の文化的背景を残すため「革袋」とした。口語的すぎない一方、一般読者にも直ちに理解できる文体を目指した。
