lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節で若者が捕らえられたことと、そこから逃れたこととの軽い対照を自然に示す。
- source_word: καταλιπὼν
  choice: 脱ぎ捨て
  rationale: 直訳的には「残して」だが、捕らえられた亜麻布をその場に残して逃げる動作を、日本語で簡潔かつ自然に表す。
- source_word: σινδόνα
  choice: 亜麻布
  rationale: 布、敷布、衣のいずれとも取り得る語なので、形状や用途を限定せず、素材を保つ訳語とした。
- source_word: γυμνὸς
  choice: 裸で
  rationale: 文脈では身にまとっていた亜麻布を残して逃げるため、第一義の「裸で」が最も自然。ただし語自体は文脈により「十分に着衣していない」の意にもなり得る。
- source_word: ἔφυγεν
  choice: 逃げて行った
  rationale: 逃走の動作と物語上の進行を、明瞭で自然な現代日本語にする。
