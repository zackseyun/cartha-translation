review_pass:
  verdict: revise
  source_fidelity: 時の表現「今日」と「この夜」、鶏が二度鳴くこと、三度の否認はいずれも保持されている。「わたしを知らないと言う」はこの文脈での否認を具体的に表し得るが、ἀπαρνήσῃ がイエスを否認するという述語であることを、日本語でもより直接に示すほうが原文に忠実である。
  naturalness: 全体として明瞭で自然である。ただし「すると」は単なる接続詞 καί に因果・展開の色合いを少し与え、「まさに今夜」も不自然ではないが、「この夜」とするほうが原文の指示表現を過度に言い換えず、簡潔である。
  terminology: 「よく言っておく」は厳粛な Ἀμὴν λέγω σοι を自然な現代日本語で伝える。「否認する」はやや硬いが、この文脈では『知らないと言う』よりも ἀπαρνέομαι の直接の目的語「わたし」を保てるため、本文には適切である。
  issues:
  - severity: low
    issue: 「すると」が καί の接続以上の含意を帯びる可能性
    rationale: καί はここでは基本的な物語の接続であり、因果や結果を示す必要はない。「イエスは彼に言われた」とすれば余分な関係を示さず自然である。
  - severity: medium
    issue: 「わたしを知らないと言う」は否認の内容を具体化している
    rationale: 後続場面とは整合するが、この節の ἀπαρνήσῃ は直接には『わたしを否認する』である。本文では目的語との関係を保つ「わたしを三度否認する」がより直接的で、特定の発話内容を補わない。
  revised_text: イエスは彼に言われた。「よく言っておく。あなたは今日、この夜、鶏が二度鳴く前に、わたしを三度否認する。」
