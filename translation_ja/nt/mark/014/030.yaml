  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: ja
  text: イエスは彼に言われた。「よく言っておく。あなたは今日、この夜、鶏が二度鳴く前に、わたしを三度否認する。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、日本語で「言われる」とすると場面によっては不自然になるため、自然で格調ある物語文として過去形にした。尊敬表現により主語がイエスであることも明瞭にした。
- source_word: Ἀμὴν λέγω σοι
  choice: よく言っておく
  rationale: 発言冒頭の厳粛な確言を、現代日本語で自然かつ重みのある定型表現として示した。「アーメン」はここでは発話機能が伝わりにくい。
- source_word: σὺ
  choice: あなたは
  rationale: 明示された代名詞の強調を、主題提示の「あなたは」で保持した。
- source_word: σήμερον ταύτῃ τῇ νυκτὶ
  choice: 今日、まさに今夜
  rationale: 原文にある二つの時の表現をともに残し、ταύτῃ の切迫した強調を「まさに」で表した。
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: 鶏が二度鳴く前に
  rationale: 日本語として自然な節に組み替えつつ、マルコに特徴的な「二度」を明記した。ἀλέκτωρ は文脈上、雄鶏だが、日本語では鳴き声を述べる「鶏」で通常十分明確である。
- source_word: τρίς με ἀπαρνήσῃ
  choice: 三度わたしを知らないと言う
  rationale: ἀπαρνέομαι はこの場面では、イエスとの関係・面識を否認することを指す。「否認する」より平明で、後続するペトロの実際の発言とも結びつく表現を選んだ。
theological_decisions:
- issue: σήμερον と ταύτῃ τῇ νυκτί の併記
  choice: 「今日、まさに今夜」と両方を訳す
  alternative: 「今夜」と一つにまとめる
  rationale: 切迫性を強める原文の重なりを省略せず、解釈によって平板化しないため。
- issue: マルコの歴史的現在 λέγει
  choice: 自然な日本語物語文として「言われた」
  alternative: 形式を直接映して「言われる」
  rationale: 歴史的現在の生彩は認めつつも、日本語の単独節では現在形が不自然になりやすい。出来事の時制を誤解させず、語りの明瞭さを優先した。
- issue: ἀπαρνήσῃ の意味範囲
  choice: 「わたしを知らないと言う」
  alternative: 「わたしを否認する」「わたしとの関係を否定する」
  rationale: 抽象的・教義的な含意を加えず、この受難物語で具体化される否認行為を平明に表した。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの厳粛な予告にふさわしい品位を保ちながら、文語的な「まことに」や専門的な「否認する」を避けた。
