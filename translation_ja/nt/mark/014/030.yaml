revisions:
- from: すると、イエスは彼に言われた。「よく言っておく。あなたは今日、まさに今夜、鶏が二度鳴く前に、三度わたしを知らないと言う。」
  to: イエスは彼に言われた。「よく言っておく。あなたは今日、この夜、鶏が二度鳴く前に、わたしを三度否認する。」
  rationale: 接続の「すると」を除き、ταύτῃ τῇ νυκτί を「この夜」として原文の指示性を簡潔に保った。また、ἀπαρνήσῃ を「否認する」として、イエスを否認するという原文の述語・目的語関係を直接訳した。数詞と時間表現の強調はすべて保持している。
