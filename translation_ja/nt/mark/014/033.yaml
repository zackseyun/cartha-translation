  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: ja
  text: そしてイエスは、ペトロとヤコブとヨハネを伴い、激しく動揺し[a]、苦悩するようになられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「非常に驚き、動揺し」。この動詞は、この文脈では強い驚愕、衝撃、または苦痛を伴う動揺を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: 伴い
  rationale: 選んだ三人を自分と一緒に連れて行く意味を、簡潔で自然な日本語で表した。ギリシア語の歴史的現在は、前後の日本語の物語時制になじむ形で訳した。
- source_word: μετ’ αὐτοῦ
  choice: （「伴い」に含めた）
  rationale: 「ご自分と一緒に」という関係は、日本語の「伴う」に明確に含まれるため、重複を避けた。
- source_word: ἤρξατο
  choice: 始められた
  rationale: 二つの不定詞にかかる起動相を明示し、感情状態への移行を保った。
- source_word: ἐκθαμβεῖσθαι
  choice: 激しく動揺し
  rationale: 文脈上、単なる驚きではなく、強い衝撃、恐れ、苦しみを伴う動揺を示す。意味を一方向に限定しすぎない表現を選んだ。
- source_word: ἀδημονεῖν
  choice: 苦悩し
  rationale: 切迫した内面的な苦しみを表し、前の動詞と区別しながら二重の感情表現を保持した。
- source_word: καὶ ... καὶ
  choice: そして／と／し
  rationale: 日本語として不自然にならない範囲で、マルコの累加的な叙述と並列関係を保った。
theological_decisions:
- issue: ゲツセマネにおけるイエスの感情状態
  choice: 「激しく動揺し、苦悩し始められた」として、現実の強烈な感情的苦しみを率直に示す。
  alternative: 「驚き、心を騒がせ始められた」と弱める、または「恐怖に打ちのめされ、もだえ始められた」と強く解釈する。
  rationale: 本文が示すイエスの真の人間的苦悩を弱めず、同時に感情の原因や性質について本文を越えた神学的説明を加えないため。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、受難場面にふさわしい荘重さを保った。イエスへの敬意は「始められた」で自然に示し、過度な敬語は避けた。固有名は現代日本語の聖書で広く通用する「ペトロ、ヤコブ、ヨハネ」とした。
