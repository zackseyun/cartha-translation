  to: そしてイエスは、ペトロとヤコブとヨハネを伴い、激しく動揺し[a]、苦悩するようになられた。
  rationale: 「苦悩するようになられた」として、ギリシア語の「始める」が前後二つの不定詞、すなわち激しい動揺と苦悩の双方にかかることを明確にした。本文の二重の感情表現、イエスへの自然な敬意、ならびに原因を説明しない本文の慎みは維持した。脚注は、第一動詞の語義上の幅を保ちつつ、恐怖への限定を避けるよう調整した。
