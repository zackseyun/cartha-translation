review_pass:
  verdict: revise
  source_fidelity: 本文の主要要素は適切に反映されている。παραλαμβάνει と μετ’ αὐτοῦ は「ペトロとヤコブとヨハネを伴い」によって自然に表され、ἐκθαμβεῖσθαι と ἀδημονεῖν の区別も「激しく動揺し、苦悩し」で保たれている。ただし現行の「激しく動揺し、苦悩し始められた」は、日本語の統語上「始められた」が主として後者の「苦悩し」に בלבדかかるように読める。ギリシア語のἤρξατοは二つの不定詞に及ぶため、両方の状態への移行が分かる表現にするのが安全である。
  naturalness: 全体として明瞭で、受難場面にふさわしい節度ある現代標準語である。「伴い」はやや文語寄りだが不自然ではなく、選ばれた三人をイエスが伴うという方向性も文脈上明確である。「苦悩するようになられた」により、二つの感情表現に対する起動相を日本語として無理なく表せる。
  terminology: 「イエス」「ペトロ」「ヤコブ」「ヨハネ」は一貫した聖書的固有名表記として適切である。「激しく動揺」「苦悩」は、第一動詞を単なる驚きに矮小化せず、第二動詞の切迫した内的苦痛とも混同しない。脚注の代案は「おののき」よりも、語の驚愕・衝撃の含みを過度に恐怖へ限定しない表現が望ましい。
  issues:
  - severity: medium
    issue: 「始められた」の係り受けが二つの感情動詞に明確に及ばない。
    rationale: ἤρξατοはἐκθαμβεῖσθαιとἀδημονεῖνの双方を支配する。現行の「激しく動揺し、苦悩し始められた」は、日本語では「苦悩し始められた」のみが起動相を帯びる読みになりやすい。
  - severity: low
    issue: 脚注の「ひどくおののき」は第一動詞の可能な意味を恐怖・震えにやや狭く寄せる。
    rationale: この語は当文脈で強い驚愕、衝撃、動揺を含み得る。代案はその幅を保つほうが、本文の慎重な訳語とも整合する。
