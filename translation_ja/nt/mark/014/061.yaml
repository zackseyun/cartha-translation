id: MRK.14.61
reference: Mark 14:61
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: ja
  text: しかし、イエスは黙ったまま、何も答えなかった。大祭司は再びイエスに問いただして言った。「あなたはメシア[a]、ほむべき方[b]の子なのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語のΧριστός（クリストス）は、ここではユダヤ的な文脈における称号なので「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: 「ほむべき方」は、神を指すユダヤ人の敬虔な婉曲表現。
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: 黙ったまま
  rationale: 未完了過去が示す継続的な沈黙を、自然な現代日本語で表す。
- source_word: ἀπεκρίνατο οὐδέν
  choice: 何も答えなかった
  rationale: οὐδένによる全面的な否定を明確かつ自然に伝える。
- source_word: πάλιν
  choice: 再び
  rationale: 大祭司が質問を繰り返したことを簡潔に示す。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 当時のユダヤ教の最高祭司職を示す定着した訳語。
- source_word: ἐπηρώτα
  choice: 問いただして
  rationale: 裁判的な場面での追及を表しつつ、単なる「尋ねた」より文脈に適合させる。未完了過去の継続性は「再び」と文脈によっても示される。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、日本語では過去時制の叙述の中で「言った」とする方が自然であり、出来事の意味を変えない。
- source_word: χριστός
  choice: メシア
  rationale: ユダヤの裁判という文脈で称号として用いられているため、ヘブライ的な意味を明確に保つ。
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: ほむべき方の子
  rationale: 神を直接名指しすることを避けた敬虔な婉曲表現を、明示的に「神」と置き換えずに保つ。
theological_decisions:
- issue: χριστόςという直接的な称号の訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、ユダヤ的な待望を背景とする称号であるため。「キリスト」という別訳は脚注に示す。
- issue: τοῦ εὐλογητοῦの訳
  choice: ほむべき方
  alternative: 神
  rationale: 神を指す敬虔な婉曲表現そのものを保持し、原文にない明示化を本文では避ける。
- issue: Σὺ εἶの疑問の調子
  choice: あなたは……なのか
  alternative: あなたが……なのか
  rationale: 主語代名詞の明示を保ちつつ、強調の度合いを過度に確定しない自然な問いとした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。法廷的な場面に合わせてἐπηρώταを「問いただして」とし、イエスの継続的な沈黙は「黙ったまま」で表した。英語相談層では脚注記号の位置と内容にずれが見られるため、原語上の対象に従い、メシアに[a]、ほむべき方に関する注を文末の[b]として配置した。
