source:
  edition: SBLGNT
  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: ja
  text: イエスはやって来て、弟子たちが眠っているのを見つけ、ペテロに言った。「シモン、眠っているのか。一時間も目を覚ましていることができなかったのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一時間も見張っていることができなかったのか」。「目を覚まして警戒している」という意味にも取れる。
    reason: γρηγορέωはこの文脈で眠らずにいることを指すと同時に、警戒して見張る含みも持つため。
lexical_decisions:
- source_word: ἔρχεται
  choice: 戻って来て
  rationale: 歴史的現在の生き生きとした語り口を意識しつつ、直前の祈りの場から弟子たちの所へ来る文脈を自然な日本語で示した。
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: 弟子たちが眠っているのを見つけ
  rationale: καθεύδοντας の継続的な動作を「眠っている」で保ち、εὑρίσκει を「見つけ」とした。代名詞は日本語で指示対象を明確にするため「弟子たち」とした。
- source_word: λέγει τῷ Πέτρῳ
  choice: ペテロに言った
  rationale: 日本語の物語として自然になるよう過去形を用いた。マルコの歴史的現在の機能は、逐語的な現在形より流れのよい叙述を優先して表した。
- source_word: Σίμων
  choice: シモン
  rationale: 語りでは「ペテロ」、呼びかけでは本人の名「シモン」という原文の区別を保持した。
- source_word: καθεύδεις
  choice: 眠っているのか
  rationale: 現在の状態を問い、同時に叱責する直接的な表現とした。
- source_word: οὐκ ἴσχυσας
  choice: できなかったのか
  rationale: ここでの ἰσχύω は身体的な強さそのものより能力・可能性を表すため、自然な日本語の「できなかった」で訳した。
- source_word: μίαν ὥραν
  choice: 一時間も
  rationale: 時間の幅を示す対格を「一時間」とし、否定疑問に伴う驚きと叱責を自然に伝える「も」を加えた。
- source_word: γρηγορῆσαι
  choice: 目を覚ましている
  rationale: 眠っていることとの直接的対比を明確にした。「見張っている」「目を覚まして警戒している」という含みもあり、脚注で示した。
theological_decisions:
- issue: マルコの歴史的現在の表現
  choice: 日本語本文では物語上自然な過去志向の連用表現と過去形を用いた。
  alternative: 「戻って来る」「見つける」「言う」と現在形を連ねる。
  rationale: ギリシア語の歴史的現在は語りに臨場感を与えるが、日本語で一律に現在形にすると不自然で翻訳調になりやすい。出来事の順序と鮮明さを保ちながら、現代標準日本語の自然な叙述を選んだ。
- issue: γρηγορέω の文脈上の意味
  choice: 「目を覚ましている」
  alternative: 「見張っている」「目を覚まして警戒している」
  rationale: 直前の「眠っている」との対比から、第一義的には覚醒していることを前面に出した。ただし祈りと警戒という広い含意を排除しないよう、語義上可能な別訳を脚注に残した。
translation_notes:
  register: 明快で現代的ながら、受難物語にふさわしい落ち着いた文体とした。イエスの問いが持つ驚きと叱責は「一時間も……できなかったのか」で自然に表現した。
