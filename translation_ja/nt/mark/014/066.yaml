  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: ja
  text: さて、ペトロが下の中庭にいたとき、大祭司の女の召使いの一人がやって来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: ペトロが……いると
  rationale: 属格独立構文の継続的な場面設定を、自然な日本語の時間・状況節として表した。
- source_word: κάτω
  choice: 下の
  rationale: 大祭司邸内の位置関係を示す語であり、中庭が別の場所より低い位置にあることを簡潔に伝える。
- source_word: ἐν τῇ αὐλῇ
  choice: 中庭に
  rationale: ここでのαὐλήは大祭司の邸宅内にある開放的な中庭を指す。
- source_word: ἔρχεται
  choice: やって来た
  rationale: ギリシア語の歴史的現在を、現代日本語の物語として自然な過去形で訳した。単なる存在ではなく接近・登場の動きを伝える。
- source_word: μία τῶν παιδισκῶν
  choice: 仕える女の一人
  rationale: παιδίσκηは若い女性の奉公人または女奴隷を指し得る。本文では法的身分を断定せず、大祭司の家に属して仕える人物であることを自然に示した。
- source_word: τοῦ ἀρχιερέως
  choice: 大祭司に
  rationale: 属格が示す家政上の所属関係を、日本語では「大祭司に仕える」と明示して自然に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語としての品位を保った。「さて」で場面転換を示し、語順は原文の進行に沿いつつ日本語として自然に整えた。παιδίσκηの奉公人／奴隷という語義上の幅は、「仕える女」として法的身分を限定せず保持した。
