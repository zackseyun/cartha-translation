source:
  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: ja
  text: しかし、ペテロは再び否定した。しばらくすると、そばに立っていた人々がまたペテロに言った。「確かに、あなたは彼らの仲間だ。あなたもガリラヤ人だし、話し方も似ている[a][b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「話し方」は「なまり」または「話しぶり」とも訳せる。ギリシア語のλαλιάは、話し方、方言、なまりなどを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「話し方も似ている」に当たる部分がない。
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: 再び否定した
  rationale: 未完了形には継続・反復の含みがあるが、πάλιν（再び）と文脈がその反復性を十分に示すため、自然な日本語として「再び否定した」とした。目的語は原文どおり明示しない。
- source_word: μετὰ μικρὸν
  choice: しばらくすると
  rationale: 短い時間が経過したことを表す慣用句。時間的な意味を保ちつつ、現代日本語として自然に表現した。
- source_word: οἱ παρεστῶτες
  choice: そばに立っていた人々
  rationale: その場に居合わせ、近くに立っていたという分詞の空間的な含みを保った。
- source_word: ἔλεγον
  choice: 言った
  rationale: 未完了形は継続・反復を示し得るが、日本語では直前の「また」によって反復性が伝わるため、過度に説明的な「言い続けた」は避けた。
- source_word: Ἀληθῶς
  choice: 確かに
  rationale: 話者たちの強い確信を、自然で明瞭な直接話法として表した。
- source_word: ἐξ αὐτῶν εἶ
  choice: あなたはあの者たちの仲間だ
  rationale: イエスとその一行に属する者だという意味を、自然な日本語で明確にした。「一人だ」より所属関係が伝わりやすい。
- source_word: καὶ γὰρ Γαλιλαῖος εἶ
  choice: あなたもガリラヤ人だし
  rationale: γάρの理由提示とκαίの「も」を保ち、前の断定を支える根拠として自然につないだ。
- source_word: ἡ λαλιά σου ὁμοιάζει
  choice: 話し方も似ている
  rationale: λαλιάを特定の「なまり」に限定せず、話しぶり・方言・発音を含み得る「話し方」とした。比較対象が原文で明示されないため、日本語でも補わず「似ている」とした。
