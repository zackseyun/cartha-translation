  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: ja
  text: そしてイエスは弟子のうち二人を遣わして、こう言われる。「町へ行きなさい。すると、水がめ[a]を運んでいる男があなたがたに出会う。その人について行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「水がめ」は、「水を入れた土製の器」とも訳せる。
    reason: κεράμιονは土製の容器を指し得るため、その材質を明示する訳の可能性を示す。
lexical_decisions:
- source_word: ἀποστέλλει
  choice: 遣わし
  rationale: マルコ特有の歴史的現在による生き生きした叙述を踏まえつつ、日本語では前後を自然につなぐ連用形で表現した。
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: 弟子のうち二人
  rationale: 部分を表す属格を明確にし、μαθητήςを文脈に即した標準的な「弟子」とした。
- source_word: λέγει αὐτοῖς
  choice: こう言われる
  rationale: 歴史的現在を現在形で保ち、イエスへの自然な敬意を示す尊敬表現とした。「こう」は後続する直接話法を自然に導く。
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: 都の中へ行きなさい
  rationale: 命令の力を保ち、εἰςの内部への移動を「中へ」で示した。定冠詞付きのπόλιςは文脈上エルサレムを指すが、固有名を補わず「都」とした。
- source_word: ἀπαντήσει ὑμῖν
  choice: あなたがたに出会う
  rationale: 未来形を、日本語で予告の流れが自然になる「すると」と非過去形の組み合わせで表した。主体が男であるというギリシア語の構文を保持した。
- source_word: ἄνθρωπος
  choice: 男
  rationale: ここでは特定の男性を指すため、「人」ではなく「男」とした。
- source_word: κεράμιον ὕδατος
  choice: 水がめ
  rationale: 水を入れた容器という意味を簡潔で自然な日本語にした。κεράμιονが土製の容器を指し得る点は脚注に示した。
- source_word: βαστάζων
  choice: 運んでいる
  rationale: 男がその時している動作を、自然な継続表現で示した。
- source_word: ἀκολουθήσατε αὐτῷ
  choice: その人について行きなさい
  rationale: 命令を明確に保ち、代名詞の指示対象を日本語で自然に示した。
