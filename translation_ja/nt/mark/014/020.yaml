  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「十二人の一人、わたしと一緒に皿に浸している者です。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」は「鉢」とも訳せる。ギリシア語は、食事に用いる皿または鉢を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 強い対比ではなく、問いに対するイエスの応答へと話を進める軽い接続を、自然な日本語で示す。
- source_word: εἶπεν αὐτοῖς
  choice: イエスは彼らに言われた
  rationale: 主語は文脈上イエスであり、日本語では明示した方が明瞭である。敬意を表す自然な叙述として「言われた」とした。
- source_word: Εἷς τῶν δώδεκα
  choice: 十二人の一人
  rationale: 裏切る者がイエスに選ばれた十二人の内にいるという原文の特定を簡潔に保つ。
- source_word: ὁ ἐμβαπτόμενος
  choice: 浸している者
  rationale: 現在分詞が表す同時的・進行中の動作と、その人物を特定する冠詞の働きを保つ。何を浸すかは原文に明示されないため補わない。
- source_word: μετ’ ἐμοῦ
  choice: わたしと一緒に
  rationale: 属格を伴う μετά の同伴の意味を、明瞭で自然な日本語にする。
- source_word: εἰς τὸ τρύβλιον
  choice: 鉢に
  rationale: εἰς が示す方向性は日本語の「に」で自然に表し、τρύβλιον は食卓で食物を入れる容器として「鉢」と訳す。
theological_decisions:
- issue: イエスの答えが裏切る者をどの程度特定しているか
  choice: 「わたしと一緒に鉢に浸している者」と、原文どおりの描写にとどめる
  alternative: 特定の一人を指すように「今、同じ鉢に手を入れている者」などと明確化する
  rationale: 同席者が同じ器を用いる状況では表現の特定性に余地があるため、原文にない「今」「手」などを加えず、緊張と曖昧さを保存する。
translation_notes:
  register: 明瞭で現代的かつ dignified な標準語。食卓の容器を表す語には「鉢」を採用し、別訳を脚注に示した。原文が省略している浸す対象は補わない。
