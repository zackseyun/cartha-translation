  source_fidelity: 本文は、十二人の一人を、イエスとともに食器へ浸している者として示すギリシア語の同格的な表現を、おおむね忠実に伝えている。「浸している」は現在分詞の描写性を保ち、原文にない浸す対象を補わない点も適切である。ただし、τρύβλιον の食卓用の器を現代日本語で「鉢」とするのはやや不自然で、場面に即して「皿」とするほうが明瞭である。
  naturalness: 「十二人の一人で、…者です」は意味は通るが、「で」が後続の名詞句とのつながりをやや不自然にする。「十二人の一人、…者です」とすると、原文の名詞句による同定を保ちながら自然な現代標準語になる。脚注記号は引用符の外に置く。
  terminology: イエスへの敬語として「言われた」は本文の品位に合い、過度な神学的含意を加えない。「皿」はτρύβλιονの有力な通常訳であり、「鉢」を脚注の代替訳として示すことで語義の幅を保持できる。
