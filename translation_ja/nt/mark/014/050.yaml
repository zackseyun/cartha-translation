    issue: 「すると」がκαὶに因果的・展開的なニュアンスを加える。
    rationale: καὶはここでは前文につながる単純な等位接続であり、「そして」がより直接的である。
  - severity: medium
    issue: 「見捨てて」はἀφέντεςの意味をやや強く限定する。
    rationale: 弟子たちが危機の中でイエスを置いて逃げたことは文脈上明らかだが、語そのものは「残して／離れて」であり、永続的・道徳的な見捨てを含意しうる表現は避けるのが安全である。
  revised_text: そして、皆はイエスを残して逃げた。
