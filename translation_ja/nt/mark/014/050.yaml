review_pass:
  verdict: revise
  source_fidelity: ἀφέντες is a participle meaning ‘leaving [him]’; in this context it conveys desertion, but 「見捨てて」 can suggest a more interpretive or enduring repudiation than the concise Greek wording requires. καὶ is a simple connective and is better represented by 「そして」 than 「すると」, which adds a stronger consequential/temporal transition.
  naturalness: 「そして、皆はイエスを残して逃げた。」 is concise, natural modern Japanese and retains the urgent narrative movement. 「皆は」 clearly carries the totality of πάντες.
  terminology: 「イエス」 is contextually appropriate for αὐτόν. 「残して」 faithfully expresses leaving him behind without importing a theological claim about permanent abandonment.
  issues:
