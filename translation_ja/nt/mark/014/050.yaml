  text: καὶ ἀφέντες αὐτὸν ⸂ἔφυγον πάντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: ja
  text: そして、皆はイエスを残して逃げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 直前の逮捕場面に続いて起きた行動を示す接続詞として、物語の流れを自然に伝える。因果関係を強く加えない。
- source_word: ἀφέντες
  choice: 見捨てて
  rationale: ここでは単にその場を離れるだけでなく、危機の中でイエスを置き去りにする意味を持つ。日本語では「見捨てて」が文脈上の重みを簡潔に伝える。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 代名詞の指示対象は文脈上イエスである。日本語では固有名を補うことで、短い独立節としても明瞭になる。
- source_word: ἔφυγον
  choice: 逃げた
  rationale: 危険を避けて逃走することを表すアオリストであり、「逃げた」が簡潔で自然な対応となる。
- source_word: πάντες
  choice: 皆は
  rationale: 同行者全員が逃げたという総体性を明確に保つ。「皆は」を動作主として示すことで、ギリシア語の強調を自然な日本語にする。
theological_decisions:
- issue: 弟子たちの離反の範囲
  choice: 皆はイエスを見捨てて逃げた
  alternative: 皆はイエスを残して逃げた
  rationale: πάντεςが示す全員性と、ἀφέντεςが文脈上持つ放棄の重みを保つ。ただし、その後も永続的にイエスを捨てたという意味までは付加しない。
translation_notes:
  register: 簡潔で緊迫した叙述を保ち、現代の一般読者に明瞭でありながら、受難物語にふさわしい重みのある文体とした。
