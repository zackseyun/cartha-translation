id: MRK.14.9
reference: Mark 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: ja
  text: まことに、あなたがたに言います。世界中のどこでこの福音[a]が宣べ伝えられても、この女性がしたことも、彼女を記念して[b]語られます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「良い知らせ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼女の記念として」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: 厳粛で権威ある言明を導く語。現代日本語で意味を明瞭に伝えつつ、品位を保つ。
- source_word: δὲ
  choice: 訳文では明示しない
  rationale: 弱い接続辞であり、この箇所では日本語の文の流れによって談話上の働きが十分に表される。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけを保ち、自然で明瞭な現代日本語とした。
- source_word: ὅπου ἐὰν
  choice: どこででも……所では
  rationale: 場所についての不定かつ包括的な意味を表す。後続する受動表現と自然につながる日本語にした。
- source_word: κηρυχθῇ
  choice: 宣べ伝えられる
  rationale: 公に告知するというκηρύσσωの意味を保ち、キリスト教文脈でも一般読者に理解可能な表現とした。
- source_word: τὸ εὐαγγέλιον
  choice: この福音
  rationale: 定冠詞を文脈指示的な「この」で表し、εὐαγγέλιονの定着した日本語訳「福音」を採用した。「良い知らせ」という意味は脚注に示す。
- source_word: εἰς ὅλον τὸν κόσμον
  choice: 世界中
  rationale: 全世界に及ぶ広がりを、簡潔で自然な現代日本語で表す。
- source_word: καὶ
  choice: も
  rationale: 福音の宣教に加えて、この人の行為も語られるという添加の意味を明示する。
- source_word: ὃ ἐποίησεν αὕτη
  choice: この人がしたこと
  rationale: 女性を指す指示代名詞αὕτηを、直前の文脈に即した自然な日本語で表す。「この女」より尊重ある中立的な語感を保つ。
- source_word: λαληθήσεται
  choice: 語られます
  rationale: その行為が後に口頭で伝えられることを表す未来受動を、自然な日本語の受身で再現する。
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: 彼女を記念して
  rationale: 彼女を覚えるための記念という目的・結果を自然に表す。「彼女の記念として」という名詞的な訳も可能なため脚注に残す。
theological_decisions:
- issue: εὐαγγέλιονを伝統的な宗教用語で訳すか、意味を展開して訳すか
  choice: 福音
  alternative: 良い知らせ
  rationale: 「福音」は現代日本語でも定着しており、世界的に宣べ伝えられるイエスのメッセージという文脈を簡潔に表す。一方、語の基本的意味を透明にするため「良い知らせ」を脚注に示す。
- issue: εἰς μνημόσυνον αὐτῆςの機能
  choice: 彼女を記念して
  alternative: 彼女の記念として
  rationale: 目的・結果の含みを自然な日本語で表した。名詞構文を保つ訳も可能であり、原文が両者の細かな違いを明確に限定しないため脚注に示す。
- issue: αὕτηが指す人物の表し方
  choice: この人
  alternative: この女性／彼女
  rationale: 文脈上女性を指すことは明白だが、原語は名詞「女」を明示せず女性形の指示代名詞を用いる。「この人」は指示性を保ちながら自然で尊重ある日本語となる。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「まことに」で厳粛さを保ち、「宣べ伝える」は公的告知という原語の働きと日本語聖書表現としての理解しやすさを両立させた。脚注記号[a]、[b]は該当語句の直後に置いた。
