  source_fidelity: 原文の未来受動（λαληθήσεται）、添加のκαί（「も」）、および女性形指示詞αὕτηを明示する必要がある。現行の「この人」は文脈から女性と分かるものの、原文が示す女性性を日本語で不必要に弱めている。また「世界中どこででも、この福音が宣べ伝えられる所では」は、「どこででも」と「所では」が重なり、日本語として不自然である。
  naturalness: 「世界中のどこでこの福音が宣べ伝えられても」とすることで、ὅπου ἐάνの包括的不定性と「全世界」の範囲を、重複なく明瞭な現代標準日本語で表せる。
  terminology: 「福音」「宣べ伝えられる」「まことに」は、この文脈にふさわしい格調を保ちつつ定着した日本語である。「良い知らせ」と「彼女の記念として」の脚注も、語彙上の代替訳として適切である。
  issues:
