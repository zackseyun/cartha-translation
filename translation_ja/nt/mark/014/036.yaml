id: MRK.14.36
reference: Mark 14:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: ja
  text: そしてイエスはこう言っておられた。[a]「アッバ、父よ、[b]あなたには何でもおできになります。この杯をわたしから取り去ってください。[c]しかし、わたしが望むことではなく、あなたが望まれることを。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「こう言われた」。ギリシア語の未完了過去は、言葉が続けて、あるいは繰り返し語られたことを示し得る。
    reason: lexical_alternative
  - marker: b
    text: 「アッバ」は「父」を意味するアラム語の呼びかけで、ここではそれに続けてギリシア語の「父よ」が併記されている。
    reason: cultural_note
  - marker: c
    text: 「杯」は、イエスに定められた苦しみを表す聖書的な比喩。マルコ10:38参照。
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: こう言っておられた
  rationale: 未完了過去の継続的・反復的な側面を保ちつつ、祈りの場面にふさわしい自然な現代日本語とした。「言われた」も文脈上可能。
- source_word: Αββα ὁ πατήρ
  choice: アッバ、父よ
  rationale: 本文が保持するアラム語の呼びかけ「アッバ」と、それに続くギリシア語「父」をともに残した。原文に明示されない所有表現「わたしの」は加えていない。
- source_word: πάντα δυνατά σοι
  choice: あなたには何でもおできになります
  rationale: 神への直接の祈りとして自然な敬語を用いながら、πάντα の包括性と δυνατά の可能・能力の意味を表した。
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: この杯をわたしから取り去ってください
  rationale: 命令形を祈願として自然に表現し、「杯」という聖書的比喩は解釈語に置き換えず保持した。
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: しかし、わたしが望むことではなく、あなたが望まれることを
  rationale: 後半で省略された θέλω を日本語で補い、対照を明確にした。文末の動詞は原文同様に明示せず、祈りの緊張と簡潔さを保った。
theological_decisions:
- issue: 神への呼びかけにアラム語形とギリシア語形の双方を残すこと
  choice: アッバ、父よ
  alternative: アッバ、わたしの父よ
  rationale: 原文は二つの呼称を併置しているため双方を保持する。「わたしの」は明示されていないので加えず、親密さの度合いを訳文で過度に規定しない。
- issue: 「杯」の比喩的意味
  choice: この杯
  alternative: この苦しみ
  rationale: 文脈上はイエスに定められた苦しみを指すが、原文の比喩と聖書内の響きを保持し、意味を一義的に説明へ置き換えない。
- issue: イエスの望みと父の望みの対照
  choice: わたしが望むことではなく、あなたが望まれることを
  alternative: わたしの思いではなく、みこころのままに
  rationale: θέλω を両節で同じ語根の表現により対応させ、原文にない宗教的定型句へ言い換えず、二つの意志の対照を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神への呼びかけには自然な敬語を用いた。「アッバ」は音写して原文の二言語併記を保持し、「杯」は説明的に置換せず比喩のまま残した。
