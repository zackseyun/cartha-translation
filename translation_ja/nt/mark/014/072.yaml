  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: ja
  text: すると、すぐに鶏が二度目に鳴いた。ペトロは、イエスが自分に言われたことを思い出した。「鶏が二度鳴く前に、あなたは三度、わたしを知らないと言う。」そして彼は泣き崩れ、泣き続けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そのことを思って泣いた」とも訳せる。ここで用いられたギリシア語の分詞は難解であり、心を向けること、身を投げ出すこと、顔を覆うことなど、さまざまに解釈されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: すぐ
  rationale: マルコに特徴的な切迫した時間表現を、自然な現代日本語で保つ。
- source_word: ἐκ δευτέρου
  choice: 二度目に
  rationale: 明示された回数を保ちつつ、日本語として簡潔に表現する。
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: 鶏が鳴いた
  rationale: 雄鶏の鳴き声を指す文脈では、日本語の聖書文体でも日常語でも「鶏が鳴く」が自然である。
- source_word: ἀνεμνήσθη
  choice: 思い出した
  rationale: 受動形ながら文脈上は中動・デポーネント的に、過去に語られた内容を想起したことを表す。
- source_word: τὸ ῥῆμα ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: イエスが自分に言われたこと
  rationale: 「ことば」を機械的に残さず、後続する引用内容との関係が明瞭になる自然な日本語とした。敬意を示すため「言われた」を用いる。
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: 鶏が二度鳴く前に
  rationale: πρίν＋不定詞の時間関係と「二度」を正確かつ自然に表す。
- source_word: τρίς με ἀπαρνήσῃ
  choice: あなたは三度、わたしを知らないと言う
  rationale: ἀπαρνέομαι の対人的な否認を、この場面で実際にペトロが行った「知らないと言う」という自然な日本語で具体的に表す。
- source_word: ἐπιβαλὼν ἔκλαιεν
  choice: 彼は泣き崩れた
  rationale: 難解な分詞を感情の崩れとして慣用的に表し、未完了過去の継続的な泣きを一続きの自然な表現にした。ただし分詞の解釈は不確実なので脚注を付す。
theological_decisions:
- issue: ἐπιβαλών が示すペトロの反応
  choice: 「泣き崩れた」として、強い感情的反応を表す。
  alternative: 「そのことを思って泣いた」「身を投げ出して泣いた」「顔を覆って泣いた」など。
  rationale: この語は語義・構文とも難解で、内面的な思い直しとも身体的動作とも解される。本文では文脈上の感情的な力を自然に伝えつつ、特定の身ぶりや悔い改めの内実を断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ペトロ」は一般的な現代の固有名表記とし、イエスの発言は自然で直接的な引用にした。難解な結末の分詞については本文の読みやすさと原文の不確実性を両立させるため脚注で透明性を確保した。
