  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: ja
  text: しかし、ペトロはイエスに言った。「たとえ皆がつまずいても[a]、私はつまずきません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つまずかされる」または「離反する」とも訳せる。ギリシア語の動詞は、つまずくこと、つまずかされること、また文脈によっては離反することを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前のイエスの予告に対するペトロの反論を示す対比として、現代日本語で明確かつ自然である。
- source_word: ἔφη αὐτῷ
  choice: イエスに言った
  rationale: ἔφηは通常の発話動詞として「言った」とし、αὐτῷの指示対象は文脈上イエスであるため、日本語で曖昧にならないよう固有名で示した。
- source_word: Εἰ καὶ
  choice: たとえ～ても
  rationale: 極端な場合を認めつつ自分については否定する譲歩条件を、自然な日本語で表す。
- source_word: πάντες
  choice: 皆が
  rationale: 文脈上、弟子たち全員を広く指す語の範囲を簡潔に保つ。
- source_word: σκανδαλισθήσονται
  choice: つまずいても
  rationale: σκανδαλίζωの比喩を保ち、信仰上の動揺、離反、見捨てる行為まで含み得る原語の幅を一語で狭く確定しないようにした。日本語では受動形を直訳すると不自然になりやすいため、自動詞で表した。
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: 私はつまずきません
  rationale: 省略された動詞を補い、ἐγώの強調と他の弟子たちとの対比を「私は」で明確にした。
theological_decisions:
- issue: 弟子たちの失敗という文脈における σκανδαλισθήσονται の意味
  choice: つまずく
  alternative: 離れていく／見捨てる
  rationale: この語は単なる一時的な失敗より重い離反を指し得るが、最終的な背教と断定する必要はない。「つまずく」は原語の比喩と神学的な幅を保ち、文脈上の深刻さは脚注で補える。
translation_notes:
  register: 明快な現代標準語を用いながら、発話には簡潔で dignified な調子を保った。原語の比喩と意味の幅を本文と脚注で保持した。
