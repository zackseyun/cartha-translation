  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: ja
  text: そして、ペトロが暖を取っているのを見て、彼をじっと見つめ、言った。「あなたも、ナザレ人イエスと一緒にいましたね。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: 火に当たっている
  rationale: 直訳的な「暖まっている」よりも、この場面で火のそばにいて暖を取る動作を自然な現代日本語で表す。
- source_word: ἐμβλέψασα αὐτῷ
  choice: 彼をじっと見て
  rationale: 単に見るのではなく、相手を注意深く見つめる語感を保つ。
- source_word: τοῦ Ναζαρηνοῦ … τοῦ Ἰησοῦ
  choice: あのナザレ人イエス
  rationale: 本文の語順には異読上の複雑さがあるが、イエスをナザレ出身者として特定する意味を明瞭かつ自然に表す。
- source_word: ἦσθα
  choice: 一緒にいましたね
  rationale: 未完了過去の状態を過去形で示し、対面での指摘・追及にふさわしい終助詞を用いる。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語の歴史的現在を、日本語の物語文として自然な過去形で訳す。
theological_decisions:
- issue: 「ナザレ人」と「イエス」の関係
  choice: 「ナザレ人イエス」と一つの呼称として訳す
  alternative: 「ナザレ人、あのイエス」と語順をより逐語的に再現する
  rationale: 写本上の語順差はあるものの、いずれも同じ人物を指す同格表現であり、特定の神学的解釈を加えず自然に示せる。
translation_notes:
  register: 明瞭で現代的な標準日本語。物語としての自然さを優先しつつ、「じっと見て」「ナザレ人」という原文の識別的な表現を保持した。
