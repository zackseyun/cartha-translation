lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 単純な物語上の連結を保ち、前の出来事に続く動作として自然な現代日本語にした。
- source_word: ὑμνήσαντες
  choice: 賛美の歌を歌ってから
  rationale: ὑμνέωの賛美歌を歌う意味と、アオリスト分詞が主動詞に先立つ動作を示すことの双方を自然に表した。「一同は」はギリシア語の複数主語を日本語で明確にするために補った。
- source_word: ἐξῆλθον
  choice: 出て行った
  rationale: ἐξέρχομαιの基本的な移動表現を、過度に格調を加えずそのまま保った。
- source_word: εἰς
  choice: へ
  rationale: 目的地への移動を表す日本語として自然である。
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: オリーブ山
  rationale: この地名の明瞭で一般的な日本語表記を用いた。ὄροςの地理的名称としての用法を反映している。
