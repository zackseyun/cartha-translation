  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: ja
  text: しかし、ペトロはそれを否定して言った。「あなたが何を言っているのか、私は知らないし、分かりもしない。」そして、外の前庭へ出た。そして、鶏が鳴いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「そして、鶏が鳴いた」を欠いている。
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: それを否定して
  rationale: この中動態は、直前の女中の言い分を否認することを表す。日本語では目的語を補うほうが自然であり、「イエスを否定した」として本文に明示されていない目的語を限定することは避けた。
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: 私は知らないし、分かりもしない
  rationale: 二つの動詞による強い否認を保ちつつ、現代日本語として自然にした。後半の「も」によって畳みかける調子を表した。
- source_word: σὺ τί λέγεις
  choice: あなたが何を言っているのか
  rationale: 語順を日本語に整えながら、λέγειςの直接的な意味を保ち、「何のことか」のような意訳で曖昧さを増減させないようにした。
- source_word: ἐξῆλθεν ἔξω
  choice: 外へ出て
  rationale: 動詞と副詞の重なりを、日本語で不自然な反復にせず、外への移動を明確に表した。
- source_word: προαύλιον
  choice: 前庭
  rationale: 中庭そのものではなく、その手前にある区域を指す空間的な含みを簡潔に表した。
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: 鶏が鳴いた
  rationale: 鶏の鳴き声を表す日本語の自然な定型表現であり、冠詞のない名詞にも無理なく対応する。
theological_decisions:
- issue: καὶ ἀλέκτωρ ἐφώνησεν の本文採用
  choice: 「すると、鶏が鳴いた」を本文に含める
  alternative: この句を本文から省く
  rationale: 指定されたSBLGNT本文はこの句を異読記号付きで収録しているため本文で訳し、写本上の不確かさは脚注に明示した。
translation_notes:
  register: 明快な現代標準日本語を用い、叙事文として簡潔で品位のある調子にした。ペトロの二重の否認表現と、前庭への移動という空間的な推移を保っている。
