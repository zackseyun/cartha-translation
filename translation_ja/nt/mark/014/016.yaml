  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: ja
  text: 弟子たちは出て行き、都に入り、イエスが彼らに言われたとおりであるのを見いだした。そして、過越の食事[a]を用意した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「過越の祭り」。ギリシア語の「パスカ」は、過越の祭り全般を指すことも、この文脈のように過越の食事を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出て行って
  rationale: それまでいた場所から外へ出て行くことを表す。後続する「町に入り」との動きの連続も自然に示せる。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 福音書におけるイエスに従い教えを受ける者たちの標準的な呼称として、「弟子」が明瞭で定着している。
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: 町に入り
  rationale: 直訳的には「その町へ来た／入った」。日本語では、先行する「出て行って」からの移動を自然に表し、εἰςの方向性も示す「町に入り」とした。
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: イエスが彼らに言われたとおりであることを確かめた
  rationale: 目的語が明示されていないため、場所や事情が先の指示どおりだったことを見いだしたという文脈上の意味を自然な日本語で表した。「確かめた」は、実際に行ってそのとおりだと分かったというεὗρονの意味を伝える。
- source_word: ἡτοίμασαν
  choice: 用意をした
  rationale: 食事や祭りに必要なものを整えるという文脈に合う、平明で自然な表現。
- source_word: τὸ πάσχα
  choice: 過越の祭り
  rationale: πάσχαが過越全般を指す可能性を本文で保ちつつ、この文脈では食事を指し得ることを脚注で明示する。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある物語文とした。原文の接続詞の連続は、日本語の流れを整えるため二文に分けた。「イエス」は原文では代名詞だが、単独節としての明瞭さを保つため指示対象を明示した。
