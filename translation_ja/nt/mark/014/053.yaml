  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: ja
  text: 人々はイエスを大祭司のもとへ連れて行った。そして、祭司長たち、長老たち、律法学者たちが皆、集まった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「集まる」と現在形になっている。過去の出来事を生き生きと語る歴史的現在である。
    reason: 原文の時制上の特徴を示すため。
lexical_decisions:
- source_word: ἀπήγαγον（ἀπάγω）
  choice: 連れて行った
  rationale: 拘束下にあるイエスを大祭司のもとへ移送したことを自然な現代日本語で表す。「引いて行った」ほど移動の仕方を限定しない。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 単数形で、ここでは祭司職の最高位にある人物を指す。後に出る複数形の「祭司長たち」と区別した。
- source_word: συνέρχονται（συνέρχομαι）
  choice: 集まって来た
  rationale: 複数の指導者層が一か所に参集した動きを表す。ギリシア語は過去の叙述中の現在形だが、日本語本文では自然な物語の時制に整え、その生き生きとした用法は脚注で示した。
- source_word: πάντες
  choice: 皆
  rationale: 参集した指導者たち全体を指す包括性を簡潔に保持する。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形は大祭司一人ではなく、祭司階級の有力者たちを指す慣用的な表現である。
- source_word: πρεσβύτεροι
  choice: 長老たち
  rationale: 単なる高齢者ではなく、共同体の公的な指導者たちを指す制度的呼称として訳した。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 文書と律法の専門家である当時の宗教指導者を、現代の一般読者に分かりやすい定着した呼称で表した。「書記官」ではこの文脈での役割が伝わりにくい。
theological_decisions:
- issue: 過去の物語中に用いられた現在形 συνέρχονται
  choice: 本文では「集まって来た」と過去形で訳す
  alternative: 「集まって来る」と現在形を保つ
  rationale: これは教理上の解釈ではなく物語時制の問題である。日本語の自然な過去叙述を優先しつつ、原文の歴史的現在は脚注で明示して、原文の生き生きとした表現を失わせないようにした。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、福音書の叙述にふさわしい落ち着いた文体とした。「すると」により二つの出来事の連続を自然に示し、「そこに」は大祭司のもとへの参集であることを明確にする補足として用いた。
