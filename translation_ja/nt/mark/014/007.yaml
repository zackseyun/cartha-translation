id: MRK.14.7
reference: Mark 14:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: ja
  text: というのも、貧しい人々はいつもあなたがたと一緒にいて、望むときにはいつでも、その人たちに良いことをすることができます[a]。しかし、わたしはいつもあなたがたと一緒にいるわけではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「良いことをする」は、その人たちの益となるように行動するという意味で、単に好意を抱くことではありません。別訳「その人たちを助けることができます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的な存在と機会を表し、後半の同語との対比も自然に保つ。
- source_word: γὰρ
  choice: （訳出せず）
  rationale: 前文への説明的接続だが、単独節として自然な現代日本語にするため明示せず、文脈上の説明関係は語順によって保った。
- source_word: τοὺς πτωχούς
  choice: 貧しい人々
  rationale: 実質名詞化した形容詞を、階層を指す「貧しい人」より自然で明確な複数表現にした。
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: あなたがたと一緒にいて
  rationale: 直訳的な「持っている」は日本語では不自然なため、継続する身近な存在を表す自然な表現とした。
- source_word: ὅταν θέλητε
  choice: 望むときにはいつでも
  rationale: ὅταν＋接続法の不定時条件を明確に表し、意志という語義も保持する。
- source_word: δύνασθε
  choice: してあげられます
  rationale: 能力・可能を表す。受益者を伴う自然な日本語として可能形にした。
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: その人たちに良いことをしてあげる
  rationale: εὖ ποιέωの受益的意味を保ち、「援助する」だけに狭めない。「してあげる」は恩着せがましさではなく、与格の受益関係を自然に示す。
- source_word: ἐμὲ δὲ
  choice: しかし、わたしは
  rationale: 貧しい人々との明確な対比を現代日本語で自然に示す。
- source_word: οὐ πάντοτε ἔχετε
  choice: いつもあなたがたと一緒にいるわけではありません
  rationale: 現在形と「いつも」の限定否定を保ち、未来形へ解釈的に変えない。「いつも一緒にいるわけではない」は「決して一緒にいない」という全面否定を避ける。
theological_decisions:
- issue: イエスが貧しい人々への配慮を軽視しているとの誤解
  choice: 貧しい人々に善を行う継続的な機会と、イエスが共にいる時間の限定性との対比として訳す。
  alternative: イエスへの献身を優先して、貧しい人々への配慮を退けていると読む。
  rationale: 「望むときにはいつでも、その人たちに良いことをしてあげられる」という句は、貧しい人々への善行を明確に肯定している。対比は時間的・状況的なものであり、慈善の義務を否定するとは本文にない。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。「あなたがた」で複数を明示し、前後の πάντοτε をともに「いつも」として対比を保持した。
