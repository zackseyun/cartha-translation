  text: また、何人かが立ち上がり、イエスに不利な偽りの証言をし、こう言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: すると
  rationale: 物語の次の動作を導く接続語。日本語では単純な「そして」よりも、場面の展開を自然に示す。
- source_word: τινες
  choice: 何人かが
  rationale: 人物を特定しない複数の不定表現を、明瞭で自然な現代日本語で表す。
- source_word: ἀναστάντες
  choice: 立ち上がり
  rationale: 法廷的な場面で証言するために立った動作を表し、後続の動詞に自然につなげる。
- source_word: ἐψευδομαρτύρουν
  choice: 偽証をして
  rationale: 虚偽の証言をするという法的意味を簡潔に表す。未完了過去の継続・反復性は文脈上理解できるため、不自然な迂言を避けた。
- source_word: κατ’ αὐτοῦ
  choice: イエスに不利な
  rationale: κατά＋属格の敵対的・法廷的な方向性を明示する。代名詞を「イエス」として指示対象を明瞭にした。
- source_word: λέγοντες
  choice: こう言った
  rationale: 次節に続く証言内容を導く分詞。日本語では文末を整え、引用への導入を明確にする。
