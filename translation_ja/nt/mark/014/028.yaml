  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: ja
  text: しかし、わたしがよみがえった後[a]、あなたがたより先にガリラヤへ行きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「わたしが起こされた後」。原文は「起こす」という動詞の受動形を用いる、復活を表す一般的な表現です。
    reason: 本文を自然な現代日本語にしつつ、ギリシア語の受動態と「起こす」という語彙的表現を示すため。
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の弟子たちの離散の予告と、その後の再会の約束との対照を明確かつ自然に示す。
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: わたしがよみがえらされた後
  rationale: μετάと冠詞付き不定詞による時間関係を「後」で表し、アオリスト受動不定詞の受動態と復活の意味を保つ。
- source_word: προάξω ὑμᾶς
  choice: あなたがたより先に…行きます
  rationale: προάγωの「先に行く」という方向的意味と、ὑμᾶςが複数の弟子たちを指すことを自然な現代日本語で示す。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ
  rationale: 目的地への移動を表すεἰςを、日本語として自然な方向助詞「へ」で訳す。
theological_decisions:
- issue: ἐγερθῆναί μεにおける復活の受動表現
  choice: わたしがよみがえらされた後
  alternative: わたしがよみがえった後
  rationale: 原文の受動態を保ち、誰が起こすのかを本文で補わない。日本語ではやや珍しいが理解可能で、復活表現に含まれる神学的含意と文法上の緊張を保持する。
translation_notes:
  register: 明快で現代的ながら、イエスの言葉として品位を保つ敬体。「よみがえらされた」は原文の受動態を意図的に保持している。
