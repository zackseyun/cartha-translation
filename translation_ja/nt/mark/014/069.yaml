  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: ja
  text: そして、その女の召使いはペトロを見て、そばにいた人たちに再び言い始めた。「この人は彼らの仲間です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: 召使いの女
  rationale: 若い女性の召使いを指す語。奴隷身分の可能性はあるが、この箇所では身分制度そのものが焦点ではないため、現代日本語で自然な「召使いの女」とした。
- source_word: ἰδοῦσα αὐτόν
  choice: ペトロを見て
  rationale: アオリスト分詞の状況・契機を自然な接続形で表した。代名詞が誰を指すかは文脈上明白なので、日本語での読みやすさのため「ペトロ」と明示した。
- source_word: ἤρξατο πάλιν λέγειν
  choice: 再び言い始めた
  rationale: ἤρξατοの開始相とπάλινの反復をともに保持し、日本語として自然な語順にした。
- source_word: τοῖς παρεστῶσιν
  choice: そばに立っていた人々に
  rationale: その場に居合わせ、近くに立つ人々という分詞の空間的な含みを保った。
- source_word: Οὗτος
  choice: この人
  rationale: ペトロを指し示す男性単数の指示語を、余分な侮蔑的ニュアンスを加えず自然に表した。
- source_word: ἐξ αὐτῶν ἐστιν
  choice: あの者たちの仲間です
  rationale: 直訳的には「彼らの中からの者」であり、イエスに属する一団の一人だという意味。「仲間」は集団への帰属を自然に伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法廷的・宗教的な語調を過度に加えず、緊迫した物語の流れを保った。「あの者たち」は話者がその場にいない一団を指す自然な表現である。
