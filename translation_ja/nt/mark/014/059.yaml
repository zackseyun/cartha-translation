  text: καὶ οὐδὲ οὕτως ἴση ἦν ἡ μαρτυρία αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: ja
  text: しかも、このようにしても、彼らの証言は一致しなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「等しくなかった」。または「合っていなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: しかし、…でも…なかった
  rationale: 直前の証言内容を受けつつ、οὐδὲの強い否定を自然な現代日本語で表す。「しかし」は文脈上の逆接を明確にし、「この点でも」で「それにもかかわらず一致しない」という強調を伝える。
- source_word: οὕτως
  choice: この点でも
  rationale: 直前に述べられた証言の仕方・内容を指す。直訳的な「このようにして」より、この法廷的文脈では自然で明瞭。
- source_word: ἴση
  choice: 一致しなかった
  rationale: 字義は「等しい」だが、複数人の証言について、その内容が合致していないことを意味する。日本語の法廷的文脈にも適する。
- source_word: ἡ μαρτυρία αὐτῶν
  choice: 彼らの証言
  rationale: μαρτυρίαはこの司法的場面では「証言」。αὐτῶνを自然な所有表現「彼らの」とする。
- source_word: ἦν
  choice: …なかった
  rationale: εἰμίの未完了過去を、物語文として自然な過去の否定形で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で dignified な現代標準日本語。証言相互の不一致という法廷的意味を自然に伝えつつ、ἴσηの字義を脚注に残した。
