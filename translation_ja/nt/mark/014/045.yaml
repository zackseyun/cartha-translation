  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: ja
  text: ユダが来るとすぐ、イエスに近寄り、「ラビ！」と言い、イエスに熱烈に口づけをした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何度も口づけをした」とも訳せる。ギリシア語の動詞は、単に「口づけをした」よりも強い表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: やって来ると
  rationale: アオリスト分詞を時間的に取り、到着に続く行動を自然な現代日本語で示した。文脈上の主語ユダを明示した。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な迅速な物語展開を、明快で自然な日本語で表した。
- source_word: προσελθὼν αὐτῷ
  choice: イエスに近寄って
  rationale: 身体的に相手へ近づく動作を表し、日本語で指示対象が曖昧にならないよう「イエス」を明示した。
- source_word: λέγει
  choice: 言い
  rationale: 歴史的現在を日本語の物語に自然な連用形で訳し、後続動作につないだ。
- source_word: Ῥαββί
  choice: 先生
  rationale: 当時の呼びかけとしての意味を一般読者に直接伝える自然な日本語を選んだ。文化的形態を残す「ラビ」も可能である。
- source_word: κατεφίλησεν
  choice: 強く口づけした
  rationale: 単純な「口づけした」より強意的であり得る複合動詞の含みを示しつつ、反復だけに意味を限定しなかった。
theological_decisions:
- issue: ユダの呼びかけ Ῥαββί
  choice: 先生
  alternative: ラビ
  rationale: 称号の意味を明瞭に伝え、裏切りの場面にある皮肉は説明で付加せず本文そのものに委ねた。
- issue: καταφιλέω の強意または反復性
  choice: 強く口づけした
  alternative: 何度も口づけした／口づけした
  rationale: 語が単純な φιλέω より強い動作を示し得ることを本文に反映しながら、反復か熱意かという語義上の幅を脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語。地の文は簡潔にし、「口づけ」は場面の厳粛さに合う品位を保つ語として用いた。
