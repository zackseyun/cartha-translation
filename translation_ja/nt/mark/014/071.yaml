base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: ja
  text: しかしペトロは、呪いをかけたり[a]、誓いを立てたりし始めた。「あなたがたが話しているこの人を、私は知らない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「呪った」。自分自身に呪いを招くことを言う可能性もある。ギリシア語は、呪いが誰に向けられたものかを明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: しかしペトロは
  rationale: δέの穏やかな対比と物語の展開を「しかし」で表した。日本語では主語を明確にするため、文脈上の指示対象であるペトロの名を補った。
- source_word: ἤρξατο
  choice: 始めた
  rationale: 二つの不定詞を伴う起動相の意味を、自然な日本語で表した。
- source_word: ἀναθεματίζειν
  choice: 呪いをかけて
  rationale: 単なる悪態ではなく、呪いを発する・招来する意味を示しつつ、ギリシア語が明示しない呪いの対象は特定しなかった。
- source_word: ὀμνύναι
  choice: 誓い
  rationale: 卑語としての「ののしる」ではなく、誓約・宣誓をするという意味を簡潔に表した。
- source_word: ὅτι
  choice: 「…」
  rationale: 誓いと否認の内容を導くὅτιを、現代日本語で自然な直接話法として訳した。
- source_word: Οὐκ οἶδα
  choice: 私は知らない
  rationale: 関係を否認する文脈上の含意を保ちながら、οἶδαの基本的で率直な意味を採った。
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: その人
  rationale: 日本語では相手方が話題にしている人物を指す「その人」が自然であり、軽蔑的な響きを不必要に加えない。
- source_word: ὃν λέγετε
  choice: あなたがたの言っている
  rationale: 関係節を自然な連体修飾にし、聞き手たちが言及している人物という意味を明確にした。
theological_decisions:
- issue: ἀναθεματίζεινにおける呪いの対象と自己呪詛の可能性
  choice: 呪いを発したことは訳すが、その対象は特定しない。
  alternative: 「自分に呪いをかけて」または単に「のろって」
  rationale: 誓いの文脈では自己呪詛を指す可能性があるが、原文には再帰代名詞も明示的な目的語もない。イエスを呪ったとも自分を呪ったとも断定せず、原文の曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、受難物語にふさわしい簡潔で厳粛な調子を保った。「悪態をつく」とはせず、呪詛と宣誓の意味を区別した。
