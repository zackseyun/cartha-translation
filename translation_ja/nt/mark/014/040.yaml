  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: ja
  text: イエスは再び来て、彼らが眠っているのを見つけた。彼らの目が重くなっていたからである[a]。イエスに何と答えればよいのか、彼らには分からなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼らの目は重くされていた」。眠気のために目が重くなり、開けていられない様子を表す。
    reason: καταβαρυνόμενοιの「重くされる」という受動的な比喩表現を補足するため。
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: 再び戻って来ると
  rationale: πάλινの反復と、文脈上イエスが弟子たちの所へ戻って来た動作を、自然な現代日本語で表した。アオリスト分詞が主動詞に先立つことも「来ると」で示した。
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: イエスは彼らが眠っているのを見つけた
  rationale: καθεύδονταςの継続中の動作を「眠っている」で保った。日本語では主語を明示したほうが分かりやすいため「イエス」を補った。
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: 彼らのまぶたは重くなっており
  rationale: 直訳的な「目が重くされていた」より自然で、眠気によって目を開けていられないギリシア語の身体的イメージを保つ。「まぶた」は日本語でこの感覚を自然に表す換喩である。
- source_word: οὐκ ᾔδεισαν
  choice: 彼らには分からなかった
  rationale: ここでは、返答すべき内容を知らないという意味を自然な日本語で表した。
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: イエスに何と答えればよいのか
  rationale: 間接疑問と接続法が示す「何と答えるべきか分からない」という含みを表した。代名詞の指示先を明確にするため「イエス」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「彼ら」を維持しつつ、指示対象が曖昧になりやすい箇所では「イエス」を補った。接続詞γάρは独立した「というのも」ではなく、前文を説明する自然な因果の流れとして表現した。
