  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: ja
  text: わたしは毎日、神殿の境内であなたがたと一緒にいて教えていたのに、あなたがたはわたしを捕らえなかった。だが、これは聖書のことばが実現するためである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「だが、聖書のことばが実現するため」。ギリシア語では、この節に結び付く主節の動詞が省略されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 毎日
  rationale: 日ごとの反復を表す自然で明瞭な日本語。
- source_word: ἤμην πρὸς ὑμᾶς
  choice: あなたがたと一緒にいて
  rationale: 人を目的語とする πρός がここで表す、相手のもとに公然と居合わせた関係を自然に伝える。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内で
  rationale: ἱερόν は内陣そのものではなく神殿域全体を指すため、「境内」を添えて範囲を明確にした。
- source_word: διδάσκων
  choice: 教えていた
  rationale: 継続的な活動を表す現在分詞を、前の未完了過去と一体の自然な日本語にした。
- source_word: οὐκ ἐκρατήσατέ με
  choice: わたしを捕らえなかった
  rationale: κρατέω の物理的な拘束と逮捕の文脈をともに保ち、法的専門語に狭めない。
- source_word: ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί
  choice: だが、これは聖書のことばが実現するためである
  rationale: 省略された主節を最小限補って日本語として成立させつつ、ἵνα の目的・結果の含みと受動形を保った。
- source_word: αἱ γραφαί
  choice: 聖書のことば
  rationale: イスラエルの権威ある聖なる文書を指す複数形を、現代日本語で自然に示す。
theological_decisions:
- issue: 省略された目的節と聖書の成就
  choice: だが、これは聖書のことばが実現するためである
  alternative: だが、聖書のことばが実現するためである
  rationale: ギリシア語は ἀλλ’ ἵνα の後に結び付く主節を明示しない。日本語で意味を通すため「これは」を補うが、出来事と聖書の実現との関係を、それ以上決定論的に説明しない。
- issue: πληρωθῶσιν の様態
  choice: 実現する
  alternative: 成就する
  rationale: 受動形の意味を日本語では自然な自動詞表現で伝え、聖書に記されたことが現実となる意味を明瞭にした。
translation_notes:
  register: イエスの公然とした継続的な活動と、逮捕する側への対照的な指摘が明瞭になるよう、現代標準日本語の格調ある口調とした。「神殿の境内」により、内陣ではなく神殿域を指すことを本文で示した。
