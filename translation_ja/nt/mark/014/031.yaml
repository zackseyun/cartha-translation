revisions:
- from: しかしペトロは、ますます強く言い張った[a]。「たとえあなたと一緒に死ななければならなくても[b]、あなたとの関係を決して否定しません[c]。」ほかの者たちも皆、同じことを言っていた。
  to: しかしペトロは、いっそう強く言い張り続けた[a]。 「たとえあなたと一緒に死ななければならないとしても[b]、あなたを決して否認しません[c]。」皆も同じように言っていた。
  rationale: 原文の直接目的語「あなた」を保ち、説明的な「関係」を本文から除いた。πάντεςの包括性を「皆」で保持し、二つの未完了過去が示す発言の継続性を「言い張り続けた」「言っていた」で表した。条件節は、必要性と極限的な仮定を自然な日本語で維持している。
