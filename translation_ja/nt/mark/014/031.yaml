  naturalness: 全体として自然で明瞭だが、「あなたとの関係を決して否定しません」は説明調でやや不自然である。「あなたを決して否認しません」は現代標準語として通じ、原文の簡潔さも保つ。
  terminology: ἀπαρνέομαιには、文脈上の「否認する」を用いる。「否む」より現代的で、「関係を否定する」より原文に忠実である。ペトロは固有名として「ペトロ」でよい。
