id: MRK.14.31
reference: Mark 14:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: ja
  text: しかしペトロは、いっそう強く言い張り続けた[a]。 「たとえあなたと一緒に死ななければならないとしても[b]、あなたを決して否認しません[c]。」皆も同じように言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この上なく強い口調で言い続けた」。
    reason: ἐκπερισσῶςは非常に強い程度を、ἐλάλειは継続または反復する発言を表す。
  - marker: b
    text: 直訳「もし私があなたと一緒に死ななければならないなら」。
    reason: ギリシア語は必要・必然を表す条件文であり、本文では自然な日本語の譲歩表現で示した。
  - marker: c
    text: ギリシア語では強い否定が用いられている。別訳「絶対にあなたを否認しません」。
    reason: οὐ μήによる強い否定を示す。ここでの「否認する」は、相手を認めない、または相手とのつながりを否定する意である。
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: ますます強く言い張った
  rationale: ἐκπερισσῶςの強い程度と、未完了過去ἐλάλειの継続・反復性を、文脈に即した自然な日本語で表した。直前の発言を受けて抗弁がさらに強まったことを示す。
- source_word: Ἐὰν δέῃ με
  choice: たとえ…死ななければならなくても
  rationale: δέῃが表す必要・必然を保持しつつ、この文脈で条件が譲歩的に働くことを自然な日本語にした。
- source_word: συναποθανεῖν σοι
  choice: あなたと一緒に死ぬ
  rationale: συν-の共同性を明示し、単なる『あなたのために死ぬ』とはしなかった。
- source_word: οὐ μή
  choice: 決して…ません
  rationale: 強い否定を、現代日本語で明確かつ品位ある形にした。
- source_word: ἀπαρνήσομαι
  choice: あなたとの関係を…否定しません
  rationale: この動詞がここで意味する、相手を知らない者・関係のない者として扱うことを明瞭に表した。単なる命題の『否定』と誤解されないよう目的語との関係を補った。
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: ほかの者たちも皆、同じことを言っていた
  rationale: ὡσαύτωςが指す発言内容を『同じこと』と明示し、ἔλεγονの未完了過去を『言っていた』で表した。文脈上、πάντεςはペトロ以外の弟子たちを含むため『ほかの者たちも皆』とした。
theological_decisions:
- issue: ペトロの誓言における否定の強さ
  choice: 『決して…ません』と訳し、οὐ μήの強い自己確信を保持した。
  alternative: 『絶対に…しません』『決してあなたを否みません』
  rationale: 後の失敗との物語上の緊張を説明で解消せず、ペトロ自身の断固たる誓言としてそのまま示した。
- issue: ἀπαρνέομαιの対象
  choice: 『あなたとの関係を否定する』
  alternative: 『あなたを否む』『あなたを知らないと言う』
  rationale: 弟子としての関係を否定する意味を明確にしながら、後の具体的な発言だけに意味を狭めすぎないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話は丁寧体でペトロの真剣さを表した。『言い張った』『決して』によって強調を伝えつつ、過度に古風な『否む』は避けた。
