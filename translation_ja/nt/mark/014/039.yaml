lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: 反復を示す副詞。簡潔で自然に、先の祈りが繰り返されたことを表す。
- source_word: ἀπελθὼν
  choice: 離れて行き
  rationale: 主動詞に先立つ移動を示すアオリスト分詞。弟子たちのもとから退いたという文脈を自然な日本語で表した。
- source_word: προσηύξατο
  choice: 祈られた
  rationale: 祈る行為を表すアオリスト中動態。日本語では中動態を特別に訳し分けず、イエスへの自然な敬意を込めた表現とした。
- source_word: τὸν αὐτὸν λόγον
  choice: 同じことば
  rationale: λόγος はここで先の祈りの発言内容を指す。「同じことば」は原文の単数形との対応を保ちつつ、祈りの内容全体を指し得る日本語である。
- source_word: εἰπών
  choice: 口にして
  rationale: 祈りの際に同じ内容を述べたことを表す分詞。「言って」よりも祈りの発話であることが自然に伝わるようにした。
