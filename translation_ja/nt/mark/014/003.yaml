source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: ja
  text: イエスがベタニアで、皮膚病のシモンの家において横になっておられたとき、一人の女が、非常に高価な純粋な[a]ナルドの香油が入ったアラバスターの壺を持って来た。女は壺を割り、その香油をイエスの頭に注いだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「純粋な」は「本物の」とも訳せる。この原語（πιστικῆς）の意味については議論がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: イエスが…食事の席で横になっておられたとき
  rationale: 属格独立構文が示す背景状況を「…とき」で自然に表し、κατάκειμαιの当時の食事姿勢も「横になって」で保持した。「食事の席」は文脈上の姿勢を明瞭にする。
- source_word: Βηθανίᾳ
  choice: ベタニア
  rationale: 日本語で定着している地名表記。
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: 皮膚病のシモンの家
  rationale: λεπρόςを現代の読者に理解可能な表現で示しつつ、「以前患っていた」など原文にない限定を加えず、シモンに付された呼称を保持する。
- source_word: γυνὴ
  choice: 一人の女
  rationale: マルコのこの箇所では身元が示されていないため、不定の人物として訳した。
- source_word: ἀλάβαστρον
  choice: アラバスター製の壺
  rationale: 香油を入れるアラバスター容器を指す。素材・容器の双方を明確にし、二度目は自然な日本語として単に「壺」とした。
- source_word: μύρου
  choice: 香油
  rationale: 芳香のある油または軟膏を表す語であり、聖書の歴史的文脈にも現代日本語にも適する。
- source_word: νάρδου
  choice: ナルド
  rationale: 特定の芳香物質の名称を一般化せず、定着した音写で保持した。
- source_word: πιστικῆς
  choice: 純粋な
  rationale: 語義に議論があるが、真正・純正という理解を簡潔に表す。別訳可能性は脚注に明示した。
- source_word: πολυτελοῦς
  choice: 非常に高価な
  rationale: 高い価格・価値を表し、続く人々の反応につながる経済的意味を明瞭にする。
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: 女は壺を割り
  rationale: 分詞が主動詞に先行する動作を示すため、自然な継起動作として訳した。「砕いた」ほど破壊の程度を強調しない。
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: その香油をイエスの頭に注いだ
  rationale: 注ぎかける動作と対象を明確にし、代名詞の指示内容も日本語で自然になるよう補った。
theological_decisions:
- issue: 「皮膚病のシモン」という呼称を、治癒後であったとの推測によって和らげるか
  choice: 原文どおり、シモンを皮膚病と結び付ける呼称を本文に残す
  alternative: 以前皮膚病だったシモン
  rationale: 原文は過去の病歴や治癒を明記していない。「以前」を補うことはもっともらしい推測ではあっても、本文を越えるため避けた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「おられた」でイエスへの自然な敬意を示しつつ、全体は過度に古風な文体にしていない。「皮膚病」は、現代では不適切かつ医学的にも狭すぎる伝統的表現を避けるために選んだ。
