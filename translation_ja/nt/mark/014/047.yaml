  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: ja
  text: しかし、そばに立っていた者の一人が剣を抜いて、大祭司の奴隷[a]を打ち、彼の耳を切り落とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しもべ」。ギリシア語はδοῦλος（ドゥーロス）で、奴隷、または従属する者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: しかし、…者の一人
  rationale: δέの穏やかな対照を「しかし」で示し、εἷς…τιςの不特定性を自然な日本語の「者の一人」で保った。
- source_word: τῶν παρεστηκότων
  choice: そばに立っていた者
  rationale: παρίστημιの空間的な意味と完了分詞が表すその場に立っていた状態を明確に伝える。
- source_word: σπασάμενος τὴν μάχαιραν
  choice: 剣を抜き
  rationale: 武器を引き抜くという文脈上の意味を自然に表し、分詞を後続動作につながる連用形とした。μάχαιραはここでは一般的で明瞭な「剣」とした。
- source_word: ἔπαισεν
  choice: 切りつけて
  rationale: 基本義は「打つ」だが、剣による一撃で耳を切り落とした文脈では「切りつける」が自然であり、手段と結果の関係を明瞭にする。
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: 大祭司の奴隷
  rationale: 所有・従属関係を示すδοῦλοςの社会的身分を弱めずに表した。ἀρχιερεύςは定着した「大祭司」とした。
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: その耳を切り落とした
  rationale: 暴力的な文脈でἀφαιρέωの結果を自然に表現した。ὠτάριονの指小的形態は日本語では通常反映せず、「耳」とした。左右は本文にないため補わない。
theological_decisions:
- issue: 物語中の社会的身分を表すδοῦλοςの訳語
  choice: 奴隷
  alternative: しもべ／召使い
  rationale: 本文にある所有・従属の社会的現実を婉曲化しないため「奴隷」とした。ただし日本語で伝統的に用いられる「しもべ」という訳の可能性を脚注で示した。
translation_notes:
  register: 現代の標準的な日本語で、簡潔かつ緊迫した叙述とした。「切りつけて」と「切り落とした」により原文の行為と結果の連続を自然に表現し、人物の不特定性と耳の左右についての沈黙を保持した。
