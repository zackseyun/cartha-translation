  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: ja
  text: そして、杯を取り、感謝をささげてから、それを彼らに渡した。彼らは皆、その杯から飲んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: 取り
  rationale: アオリスト分詞を、後続する「渡された」に先立つ動作として自然な日本語の連用形で表した。
- source_word: ποτήριον
  choice: 杯
  rationale: 食事と受難物語の荘重な文脈に合い、飲み物を入れる器を指す語として定着した自然な訳語。ギリシア語では無冠詞なので、本文だけで特定性を過度に明示せず、注で異なる捉え方を示した。
- source_word: εὐχαριστήσας
  choice: 感謝をささげてから
  rationale: 感謝するという語義と、主動詞に先立つアオリスト分詞の時間関係を明確に示す。後代の典礼用語を持ち込まない。
- source_word: ἔδωκεν αὐτοῖς
  choice: 彼らに渡された
  rationale: 杯を手渡す場面なので、日本語では「与えた」より「渡した」が自然。主語は直前の文脈にあるイエスであり、敬意を含む叙述として「渡された」とした。
- source_word: ἔπιον ἐξ αὐτοῦ πάντες
  choice: 皆がその杯から飲んだ
  rationale: πάντεςの包括性を「皆」で保ち、ἐξ αὐτοῦの指示対象が杯であることを日本語で明確にした。
theological_decisions:
- issue: εὐχαριστήσαςの聖餐的含意
  choice: 感謝をささげてから
  alternative: 祝福してから／感謝の祈りを唱えてから
  rationale: 動詞は直接には「感謝する」を意味する。後代の聖餐用語や、杯そのものを祝福したとの解釈を本文に読み込まず、原文の意味を保った。
- issue: ποτήριονの特定性
  choice: 本文では「杯」とし、注で「一つの杯」の可能性を示す
  alternative: その杯／一つの杯
  rationale: ギリシア語は無冠詞だが、食事の文脈では特定の杯を指し得る。日本語の「杯」は冠詞を要求しないため、本文で曖昧さを保ち、注で原文上の事情を説明した。
translation_notes:
  register: 明瞭で現代的ながら、受難物語にふさわしい品位を保った。「感謝をささげる」は宗派固有の典礼語を避けつつ、祈りとしての感謝を自然に表す。
