  terminology: 「杯」「感謝をささげて」は、ποτήριον と εὐχαριστήσας を自然かつ節度をもって表している。聖餐に関する後代の典礼的解釈を持ち込んでいない。注は日本語に冠詞がない点を踏まえ、「一つの杯」ではなく「その杯」という訳の可能性として示すほうが正確である。
