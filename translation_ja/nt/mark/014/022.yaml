source:
  edition: SBLGNT
  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: ja
  text: 彼らが食事をしている間に、イエスはパンを取り、祝福を唱え、それを裂いて、彼らに与えた。そして言われた。「取りなさい。これはわたしの体です[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これはわたしの体を表す」「これはわたしの体を意味する」。ギリシア語は直訳すると「これはわたしの体である」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: 一同が食事をしていると
  rationale: 属格独立構文と現在分詞が示す、主節と同時進行する動作を自然な現代日本語で表した。
- source_word: λαβὼν ἄρτον
  choice: パンを取り
  rationale: ἄρτον は無冠詞であり、食事の文脈に即して過度に形状を限定せず「パン」とした。
- source_word: εὐλογήσας
  choice: 祝福して
  rationale: 食事に際してパンの上に祝福を唱える行為を簡潔に表し、「感謝した」との同化を避けた。
- source_word: ἔκλασεν
  choice: 裂き
  rationale: パンを分けるために裂く動作として、聖書日本語でも自然で簡潔な語を選んだ。
- source_word: ἔδωκεν αὐτοῖς
  choice: 彼らに与えて
  rationale: 目的語は直前のパンから明らかなため、日本語では繰り返さず自然な連続動作として表した。
- source_word: Λάβετε
  choice: 取りなさい
  rationale: アオリスト命令形を直接的な勧めとして訳し、原文に明示されない目的語を補わなかった。
- source_word: τοῦτό ἐστιν
  choice: これは…です
  rationale: 通常の繋辞構文をそのまま訳し、「意味する」「表す」という解釈を本文に持ち込まなかった。
- source_word: τὸ σῶμά μου
  choice: わたしの体
  rationale: σῶμα の基本義を明瞭に訳し、比喩か実体かという解釈を訳文で決着させなかった。
theological_decisions:
- issue: 主の晩餐における「これはわたしの体」の解釈
  choice: 「これはわたしの体です」と直接訳す
  alternative: 「これはわたしの体を表します」または「これはわたしの体を意味します」
  rationale: ギリシア語は通常の繋辞 ἐστιν を用いている。聖餐理解をめぐる神学的緊張を保ち、特定の教派的解釈を本文で確定しないため。
translation_notes:
  register: 明瞭で現代的ながら、場面の重みを損なわない丁寧で簡潔な文体とした。「イエス」は原文で主語が省略されているが、前文脈の主語を日本語で明確にするため補った。
