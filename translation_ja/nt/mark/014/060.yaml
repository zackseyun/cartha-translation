id: MRK.14.60
reference: Mark 14:60
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: ja
  text: そこで大祭司は立ち上がって中央に進み[a]、イエスに尋ねた。「何も答えないのか。この者たちは、あなたに不利な何を証言しているのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「中央へ」。大祭司が会衆の前の中央の位置に出たことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: 立ち上がって
  rationale: 大祭司が座った姿勢から立つという物理的な動作と、物語の動きを自然な現代日本語で表す。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: この審理を主導するユダヤ人の大祭司を指す標準的な訳語。
- source_word: εἰς μέσον
  choice: 中央に進み
  rationale: εἰς が示す方向性を反映し、大祭司が会衆の中央の位置へ出たことを自然に表す。
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 司法的な場面での問いかけだが、「尋問した」として語気を不必要に強めず、ἐπερωτάω の基本的な意味を保つ。
- source_word: ἀποκρίνῃ οὐδέν
  choice: 何も答えないのか
  rationale: 否定を伴う直接的で詰問的な問いを、簡潔で自然な日本語にする。
- source_word: οὗτοί
  choice: この者たち
  rationale: その場にいる特定の証人たちを指す指示語として訳す。ギリシア語は男性複数形だが、日本語で不自然に性別を明示しない。
- source_word: καταμαρτυροῦσιν
  choice: あなたに不利な……証言をしている
  rationale: καταμαρτυρέω の法廷的な意味と現在進行中の証言を保ち、単に「訴える」と意訳しすぎない。
theological_decisions:
- issue: οὗτοίの男性複数形の扱い
  choice: この者たち
  alternative: この男たち
  rationale: 原文の文法上は男性複数形で、文脈上はその場の証人を指す。しかし現代日本語では「この男たち」とすると性別が過度に強調されるため、指示対象の特定性を保つ「この者たち」とした。
- issue: τίが問う内容
  choice: あなたに不利な何を証言しているのか
  alternative: あなたに不利な証言をしているが、どうなのか
  rationale: τίを証言の内容についての問いとして直接残し、大祭司がイエスに反応を求めているという解釈だけに限定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。大祭司の問いの鋭さは「何も答えないのか」で保ちつつ、古風な言い回しや過度に芝居がかった語調は避けた。
