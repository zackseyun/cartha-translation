  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: ja
  text: 実際、多くの者が彼に不利な偽証をしていたし、それらの証言は互いに一致しなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「偽証をしていた」は、より直訳的には「偽りの証言をしていた」とも訳せる。「互いに一致しなかった」は直訳的には「等しくなかった」で、ここでは証言どうしが合致しなかったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの者
  rationale: 形容詞の名詞的用法で、多数の人を指す。「証人」は動詞から推測できるものの明示されていないため、本文では補わない。
- source_word: γὰρ
  choice: が
  rationale: 前後の叙述との説明的なつながりは、日本語では逆接を含む文全体の流れの中で自然に表した。直訳的な「というのは」はこの一節だけでは重くなる。
- source_word: ἐψευδομαρτύρουν
  choice: 偽証をしていた
  rationale: 法廷的な意味を保つ「偽証」を用い、未完了過去の継続・反復的な様相を「していた」で表した。
- source_word: κατ’ αὐτοῦ
  choice: イエスに不利な
  rationale: κατά＋属格の敵対的・法廷的方向性を自然な現代日本語で示した。代名詞の指示対象を明確にするため「イエス」とした。
- source_word: ἴσαι
  choice: 互いに一致しなかった
  rationale: 字義は「等しい」だが、複数の証言については、内容が符合しないことを意味する。「互いに一致する」が日本語の法廷文脈で明瞭。
- source_word: αἱ μαρτυρίαι οὐκ ἦσαν
  choice: その証言は…なかった
  rationale: 定冠詞は直前の偽証を受けるため「その」とし、単純な否定過去を「なかった」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語。「偽証」によって裁判・証言の場面を保ち、「していた」でギリシア語未完了過去の継続性を表した。本文中に脚注記号[a]を明記した。
