  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: ja
  text: 祭司長たちと最高法院[a]全体は、イエスを死刑にするため、イエスに不利な証言を探し求めていたが、見つからなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「最高法院」は、一般に「サンヘドリン」とも呼ばれるユダヤの最高評議会。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: δέは穏やかな接続辞であり、文脈上、日本語では明示しなくても叙述の進行が自然に伝わる。ἀρχιερεῖςはエルサレムの祭司指導者層を指す標準的な「祭司長たち」とした。
- source_word: ὅλον τὸ συνέδριον
  choice: 最高法院全体
  rationale: συνέδριονはこの文脈ではユダヤの最高評議機関を指す。「最高法院」は日本語聖書で定着し、単なる一般的な会議体との混同を避けられる。ὅλονは「全体」で保持した。
- source_word: ἐζήτουν
  choice: 探し求めていた
  rationale: 未完了過去の継続的な動作を「〜ていた」で表し、意図的に探していたことを「探し求める」で示した。
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: イエスに不利な証言
  rationale: κατά＋属格の敵対的・不利な方向性を自然な法廷用語で示した。μαρτυρίαは証人そのものではなく証言内容なので「証言」とした。
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: イエスを死刑にするため
  rationale: εἰς＋冠詞付き不定詞の目的を「〜ため」で明示した。法的審理の文脈に合わせ、θανατόωを単なる「殺す」より司法的な「死刑にする」と訳した。
- source_word: καὶ οὐχ ηὕρισκον
  choice: が、見つからなかった
  rationale: καίは形式上「そして」だが、探したにもかかわらず得られなかったという意味関係を、自然な日本語の逆接「が」で表した。ηὕρισκονの未完了過去は、直前の継続的探索を受ける文脈上、「見つからなかった」で簡潔に表現した。省略された目的語は日本語でも自然に補われる。
theological_decisions:
- issue: συνέδριονの歴史的同定
  choice: 本文で「最高法院」と訳す
  alternative: 「最高法院（サンヘドリン）」または「議会」
  rationale: 特定の教派的解釈ではなく、当時のユダヤ統治評議会を示す歴史・語彙上の判断である。「最高法院」は役割を明確にし、脚注で「サンヘドリン」という別称を示す。
- issue: 死刑を求める意図と証言の性質
  choice: 「イエスを死刑にするため、イエスに不利な証言を探し求めていた」
  alternative: 「イエスを殺すため、証言を探していた」
  rationale: 原文が示す目的を保持しつつ、裁判場面の司法的性格を自然な日本語で表した。証言が虚偽だったとはこの節だけでは明示されないため、「偽証」とは訳さない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述調。法廷文脈を保ちながら、原文にない「偽証」などの評価は加えない。脚注記号[a]は該当文末に置いた。
