  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: ja
  text: 「この香油[a]は、三百デナリ[b]を超える額で売られ、その代金を貧しい人たちに与えることができたのに。」そして彼らは、彼女を厳しく責めた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「香油」は、香料を加えた油または軟膏を指す。
    reason: lexical_alternative
  - marker: b
    text: デナリは当時のローマの銀貨。
    reason: historical_context
  - marker: c
    text: 別訳「彼女を激しく非難した」。ギリシア語の動詞は、強い不快感を伴う厳しい叱責を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: 香油
  rationale: 香料を加えた油や軟膏を指す。文脈に合い、現代日本語の聖書表現としても明瞭である。
- source_word: πραθῆναι
  choice: 売り
  rationale: πιπράσκωのアオリスト受動不定詞。日本語では後続の「その代金を」と合わせ、潜在的に可能だった行為を自然に表した。
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: 三百デナリ以上で
  rationale: ἐπάνωと金額の属格は、その額を超えることを表す。「以上」は自然な日本語だが、厳密には三百を上回る額を意味する。
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: その代金を貧しい人たちに施す
  rationale: 文法上は「貧しい人たちに与える」だが、売却後に与えられるのは代金であることを日本語で明示した。「施す」は慈善として与える文脈を簡潔に伝える。
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: 彼女を厳しく責めた
  rationale: 動詞は強い不快感を伴う厳しい叱責を示す。単なる不満より強い対人的な言動を表すため、「厳しく責めた」とした。
- source_word: γὰρ
  choice: この香油は…できたのに
  rationale: 前節の非難の理由を示す接続。日本語では独立した「なぜなら」を置かず、理由を述べる発言として自然に表した。
- source_word: ἠδύνατο
  choice: できたのに
  rationale: 実現しなかった可能性を述べる未完了過去形。文脈上の悔恨・非難の含みを日本語の「できたのに」で表した。
theological_decisions: []
