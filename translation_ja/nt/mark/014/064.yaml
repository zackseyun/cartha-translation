  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: ja
  text: 「あなたがたは、この冒瀆の言葉を聞いた。どう判断するか。」すると、全員がイエスを死に値する者と定めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死刑に処すべき者と定めた」または「死の責めを負う者とした」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: 聞いた
  rationale: 直前に耳にした発言を指すアオリストとして、自然な現代日本語の過去形にした。
- source_word: τῆς βλασφημίας
  choice: この冒瀆の言葉を
  rationale: ἀκούωが属格を取る構文を自然な目的格で表し、定冠詞が指す直前の具体的な発言を「この」で示した。「冒瀆」だけより、聞かれた発言であることが明確になる。
- source_word: τί ὑμῖν φαίνεται
  choice: どう判断するか
  rationale: 字義的には「あなたがたにはどう見えるか」だが、裁判的な文脈では意見または判決を求める問いであるため、簡潔で自然な表現にした。
- source_word: οἱ δὲ πάντες
  choice: すると、全員が
  rationale: δέによる展開を「すると」でつなぎ、πάντεςが強調する全員一致を明示した。
- source_word: κατέκριναν
  choice: 定めた
  rationale: 司法的に不利な判決を下す意味。後続の「死に値する者」と合わせることで、「有罪とした」と重複せず判決行為を表す。
- source_word: ἔνοχον εἶναι θανάτου
  choice: 死に値する者と
  rationale: 死刑に相当する、または死の責めを負うとの判定を、明瞭で格調ある現代日本語にした。構文上あり得る「死刑に処すべき者」「死の責めを負う者」は脚注に残した。
theological_decisions:
- issue: 裁判の場におけるβλασφημίαの提示
  choice: この冒瀆の言葉
  alternative: 神を冒瀆する言葉
  rationale: これは最高法院側の告発として語られており、その告発が正当だと語り手が認定しているわけではない。「神を」を補わず、法的・神学的な重みと緊張を保った。
- issue: ἔνοχον εἶναι θανάτουの判決的意味
  choice: 死に値する者
  alternative: 死刑に処すべき者／死の責めを負う者
  rationale: 死刑相当との判断を表しつつ、実際の刑執行までをこの動詞句に読み込まない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、裁判場面にふさわしい簡潔で厳粛な調子を保った。「冒瀆」は宗教的・法的な重みを残し、「どう判断するか」は日本語として自然に評決を求める問いを表す。
