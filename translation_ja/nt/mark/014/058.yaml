source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: ja
  text: 「私たちは、彼がこう言うのを聞きました。『私は、人の手で造られた[b]この神殿を壊し、人の手によらない別の神殿を三日のうちに[a]建てる。』」と証言した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「三日のうちに」は、「三日で」とも訳せる。ギリシア語表現は、行為がその期間内に行われることを自然に示す。
    reason: lexical_alternative
  - marker: b
    text: 「人の手で造られた」と「人の手によらない」は、ギリシア語の二語の対照を保った表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος
  choice: 私たちは、この人がこう言うのを聞きました
  rationale: 明示された主語Ἡμεῖςの強調を保ちつつ、属格分詞構文を自然な現代日本語で表した。文脈上の話者への言及は「この人」とした。
- source_word: καταλύσω
  choice: 壊し
  rationale: 建造物を取り壊す意味を、簡潔で自然な語で表した。
- source_word: τὸν ναὸν τοῦτον
  choice: この神殿
  rationale: ναόςを一般読者に明瞭な「神殿」とし、指示語τοῦτονも保持した。
- source_word: χειροποίητον / ἀχειροποίητον
  choice: 人の手で造られた／人の手によらない
  rationale: 二語の意図的な対照を平行表現で保持しつつ、「手作り」のような軽い響きを避けた。
- source_word: διὰ τριῶν ἡμερῶν
  choice: 三日のうちに
  rationale: διά＋属格が示す期間の幅を明示し、その期間内に行為がなされるという自然な理解を表した。
- source_word: ἄλλον
  choice: 別の神殿
  rationale: 日本語では名詞を補うことで対象を明確にし、「別の」という対照を保持した。
- source_word: οἰκοδομήσω
  choice: 建てる
  rationale: 原語は「再建する」と限定していないため、基本義をそのまま訳した。
theological_decisions:
- issue: 発言が敵対的証言の中で引用されていること
  choice: 引用を閉じた後に「と証言した」として、証人の申し立てであることを明示した
  alternative: イエス自身の発言として説明を加える、または証言の歪曲を訳文中で断定する
  rationale: 本文は証人たちが聞いたと主張する内容を報告している。ほかの箇所との調和や証言の評価を訳文に持ち込まない。
- issue: 「人の手で造られた／人の手によらない」の神学的含意
  choice: 原語の対照をそのまま保持した
  alternative: 「人間が造った／神が造る」などと解釈的に明示する
  rationale: 対照には神学的な響きがあり得るが、行為者や対象の意味を本文以上に確定しない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある証言口調とした。節単独でも構文が完結するよう「と証言した」を補い、二つの脚注記号は対応箇所の近くに置くべきところ、節末にまとめて付した。
