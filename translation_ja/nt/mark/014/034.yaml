id: MRK.14.34
reference: Mark 14:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: ja
  text: そして、イエスは弟子たちに言われた。「私の魂は、死ぬほど深い悲しみに沈んでいる[a][b]。ここにとどまり、目を覚ましていなさい[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悲しみに打ちひしがれている」または「悲しみに圧倒されている」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「死に至るまで」。「死に至るほど」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「見張っていなさい」とも訳せる。この命令には、実際に眠らずにいることと、警戒していることの両方が含まれ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は臨場感を与える歴史的現在だが、現代日本語の物語として自然で、かつ敬意を保つ過去形で表した。
- source_word: Περίλυπός
  choice: 深い悲しみに沈んでいる
  rationale: 非常に強い悲嘆や苦悩を表す語であり、その重さを保ちながら自然な現代日本語とした。
- source_word: ἡ ψυχή μου
  choice: 私の魂
  rationale: ここではイエスの内面、さらに全存在に及ぶ苦悩を指す。「心」だけに狭めず、原語の伝統的かつ人間論的な含みを残した。
- source_word: ἕως θανάτου
  choice: 死ぬほど
  rationale: 直訳的には「死に至るまで」。悲しみの極度を表す日本語として自然であり、死との切迫した結びつきも保持する。
- source_word: μείνατε ὧδε
  choice: ここにとどまり
  rationale: その場所に居続けるよう命じる簡潔な表現として訳した。
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 直近の文脈にある実際の睡眠との対照を明確にしつつ、警戒して見張るという含みも脚注で保持した。
theological_decisions:
- issue: イエスの発言における ψυχή の訳
  choice: 魂
  alternative: 心／私自身
  rationale: イエスの真の人間的苦悩を率直に示しつつ、語を単なる感情や身体的生命だけに限定しないため。後代の教理的説明は本文に持ち込まない。
- issue: ἕως θανάτου が表す範囲
  choice: 死ぬほど
  alternative: 死に至るまで
  rationale: 悲しみが死に達するほど極端だという意味を自然に表す一方、実際の死との関係を一義的に断定せず、直訳を脚注に示した。
- issue: γρηγορεῖτε の命令の力
  choice: 目を覚ましていなさい
  alternative: 見張っていなさい／目を覚まし、警戒していなさい
  rationale: 身体的に眠らないことと、警戒していることの両方があり得る。本文では場面に即した訳を選び、意味の広がりを脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの言葉には厳粛さを保った。「私」を採用して一般読者への分かりやすさを優先し、叙述上の敬意は「言われた」で示した。
