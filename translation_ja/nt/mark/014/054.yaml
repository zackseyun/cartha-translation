  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: ja
  text: ペトロは、遠くからイエスについて行き、大祭司の屋敷の中庭の中まで入った。そして、役人たちと一緒に座って、火[a]に当たっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「光に向かって」または「光のそばで」。ここでは中庭の火、あるいはその火の光を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: 遠く離れて
  rationale: ペトロが距離を置きながら従ったという空間的・物語的意味を、自然な現代日本語で表す。
- source_word: ἠκολούθησεν αὐτῷ
  choice: イエスの後について行き
  rationale: 代名詞の指示対象を日本語で明確にしつつ、アオリストの物語上の動作を素直に表す。
- source_word: ἕως ἔσω εἰς τὴν αὐλήν
  choice: 屋敷の中庭にまで入った
  rationale: ἕως ἔσω εἰς が示す、内側にまで進んだことを明示する。αὐλήは文脈上、大祭司の住居に付属する中庭を指すため、「屋敷の中庭」とした。
- source_word: τοῦ ἀρχιερέως
  choice: 大祭司の
  rationale: 受難物語におけるἀρχιερεύςの標準的で明確な訳語。
- source_word: ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν
  choice: 下役たちと一緒に座り
  rationale: 迂言的未完了の継続的な場面描写を自然に表す。ὑπηρέταιはこの場の公的な従者・下役であり、役割を「兵士」や「警備員」に限定しない訳とした。
- source_word: θερμαινόμενος
  choice: 当たっていた
  rationale: 火などで体を暖めている継続的な動作を、日本語の慣用表現で示す。
- source_word: πρὸς τὸ φῶς
  choice: 火に
  rationale: φῶςの字義は「光」だが、暖を取る対象であることから文脈上は火を指す。本文では自然な「火に当たる」とし、字義を脚注に残す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「屋敷」は原文に独立した語としてはないが、「大祭司の中庭」という不自然さを避け、αὐλήが住居の中庭を指す文脈を簡潔に示した。原文の長い接続構造は、読みやすさのため二文に分けた。
