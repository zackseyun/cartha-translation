revisions:
- from: 過越の祭りと除酵祭まで、あと二日であった[a]。祭司長たちと律法学者たちは、どうすれば策略を用いてイエスを捕らえ[c]、殺すことができるかと探っていた[b]。
  to: 過越の祭りと除酵祭[b]まで、あと二日であった[a]。祭司長たちと律法学者たちは、イエスをだまして捕らえ[c]、殺すにはどうすればよいかを探っていた。
  rationale: 文化注bを説明対象である「除酵祭」に移した。δόλῳを「だまして」として欺瞞の意味を明確にし、後半を整えて、彼らが捕縛と殺害の方法を継続して探っていたという原文の意味を自然に表した。脚注aは「二日の後」を自然な日本語の「二日後」に修正した。
