id: MRK.14.1
reference: Mark 14:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: ja
  text: 過越の祭りと除酵祭[b]まで、あと二日であった[a]。祭司長たちと律法学者たちは、イエスをだまして捕らえ[c]、殺すにはどうすればよいかを探っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「二日後」であり、過越の祭りと除酵祭が間近に迫っていたことを表す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では字義的に「種なしのもの（パン）」だが、ここでは除酵祭を指す慣用表現。
    reason: cultural_note
  - marker: c
    text: 「取り押さえ」「捕まえ」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: 〜まで、あと二日であった
  rationale: δέの穏やかな叙述の移行は日本語の文脈に委ね、不要な「さて」を加えない。Ἦνは祭りが間近であることを述べる構文の一部として自然に表現した。
- source_word: τὸ πάσχα
  choice: 過越の祭り
  rationale: ユダヤの祭りを指す文脈での標準的で明瞭な訳語。
- source_word: τὰ ἄζυμα
  choice: 除酵祭
  rationale: 字義的には「種なしパン（のもの）」だが、ここでは祭りを指す慣用表現なので、現代日本語で定着した祭名を用いた。
- source_word: μετὰ δύο ἡμέρας
  choice: 〜まで、あと二日
  rationale: 字義的な「二日の後」を、目前に迫った祭りまでの時間を示す自然な日本語にした。
- source_word: ἐζήτουν
  choice: 探っていた
  rationale: 未完了過去の継続的な企てを表し、単に捜索していたとの誤解を避ける。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 一人の大祭司ではなく、祭司階級の指導者たちを指す標準訳。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: 当時の律法の専門家という役割が現代の読者に明瞭に伝わる訳語。
- source_word: πῶς
  choice: どうすれば
  rationale: 企ての手段を検討していることを自然な日本語で表す。
- source_word: ἐν δόλῳ
  choice: 策略を用いて
  rationale: δόλοςの欺き、たくらみという倫理的含意を保ち、「ひそかに」だけに狭めない。
- source_word: κρατήσαντες
  choice: 捕らえ
  rationale: 敵対的に身柄を押さえる文脈を自然に表す。「逮捕する」よりも、公的な法手続きだったとの含みを抑える。
- source_word: ἀποκτείνωσιν
  choice: 殺す
  rationale: 原語の直接的な意味と調子を保つ。
theological_decisions:
- issue: 過越の祭りと除酵祭の関係
  choice: 「過越の祭りと除酵祭」と二つの名称を区別して訳す
  alternative: 一つの祭期を表す単一名称としてまとめる
  rationale: マルコは両者を明示的に並べているため、密接な関係を認めつつも名称上の区別を保った。
- issue: 指導者たちの計画の性質
  choice: ἐν δόλῳを「策略を用いて」と明示する
  alternative: 「ひそかに」「人目を避けて」
  rationale: 原語は秘密性だけでなく欺きやたくらみを含むため、その倫理的な力を保持した。
- issue: κρατήσαντεςの権力的含意
  choice: 「捕らえ」
  alternative: 「逮捕し」「取り押さえ」
  rationale: 身柄を押さえる意味を保ちつつ、正規の司法手続きであると決めつけない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祭名には一般的な聖書用語を用い、文の継続性と陰謀の進行を自然に表した。脚注記号は対応する語句の直後に配置した。
