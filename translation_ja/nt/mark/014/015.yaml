  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: ja
  text: その人自身が、しつらえが整い、用意のできた広い二階の部屋[a]を、あなたがたに見せます。そこで、わたしたちのために準備をしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しつらえが整い、用意のできた広い階上の部屋」。ἐστρωμένονは、単に家具が置かれているというだけでなく、部屋が食事などのために整えられていることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: その人自身が
  rationale: 強意代名詞の強調を保ちつつ、直前の文脈で示された人物を自然な日本語で指す。
- source_word: δείξει
  choice: 見せてくれます
  rationale: 未来直説法を表し、与格ὑμῖνを日本語の受益表現に自然に組み込む。
- source_word: ἀνάγαιον
  choice: 二階の部屋
  rationale: 家屋の上階にある部屋を指す語であり、現代日本語で明瞭に伝わる。
- source_word: μέγα
  choice: 広い
  rationale: 部屋については「大きな」より「広い」が自然で、規模の大きさを適切に表す。
- source_word: ἐστρωμένον
  choice: 整えられ
  rationale: 敷物や食事用の寝椅子などが配置された状態を含み得るが、家具だけに限定せず、部屋が整えられた意味を保つ。
- source_word: ἕτοιμον
  choice: 用意のできた
  rationale: ἐστρωμένονとの意味の重なりを避けながら、使用可能な準備済みの状態を表す。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 場所を受けて次の命令へ自然につなぐ。
- source_word: ἑτοιμάσατε
  choice: 準備をしなさい
  rationale: 複数へのアオリスト命令の直接性を保ち、過越の食事の準備という文脈にも適する。
- source_word: ἡμῖν
  choice: わたしたちのために
  rationale: 指示対象を説明的に拡張せず、与格の意味をそのまま表す。
