id: MRK.14.27
reference: Mark 14:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: ja
  text: イエスは弟子たちに言われた。「あなたがたは皆、つまずく[a]。『わたしは羊飼いを打つ。すると、羊たちは散らされる』と書かれているからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「皆、つまずかされる」。文脈上は、イエスを見捨てて離れてしまうことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、現代日本語の自然な物語時制に合わせて過去形とした。敬意を示すため尊敬表現を用いた。
- source_word: σκανδαλισθήσεσθε
  choice: つまずく
  rationale: 語の比喩を保ちつつ、文脈上はイエスを見捨てる弟子たちの失敗を表す。受動形の含みは脚注に残した。
- source_word: γέγραπται
  choice: 書かれている
  rationale: 完了受動形が示す、書かれた言葉が今も効力を持つという含みを自然な日本語で保った。
- source_word: Πατάξω
  choice: わたしは…打つ
  rationale: 暴力的な動作の強さを保ちながら、古風すぎない簡潔な表現とした。
- source_word: ποιμένα
  choice: 羊飼い
  rationale: 預言の牧者と群れの比喩を直接保った。
- source_word: τὰ πρόβατα
  choice: 羊たち
  rationale: 複数の羊から成る群れが散る情景を明確にした。
- source_word: διασκορπισθήσονται
  choice: 散らされる
  rationale: 未来受動形と、羊飼いが打たれた結果として群れが離散するイメージを保持した。
theological_decisions:
- issue: σκανδαλισθήσεσθεが表す弟子たちの反応
  choice: つまずく
  alternative: 離反する／つまずかされる
  rationale: 「離反する」だけに限定せず、ギリシア語のつまずきの比喩と、弟子たちが逃げ去る文脈との緊張を保った。受動的に理解できる形態上の可能性も脚注で示した。
- issue: 羊飼いを打つ主体
  choice: 一人称の「わたし」をそのまま保持
  alternative: 神を明示する
  rationale: 引用文の一人称主体を保持し、本文にない説明的な神名を補わなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。マルコの歴史的現在は日本語として自然な過去形にし、聖書引用は簡潔な韻律を意識した。
