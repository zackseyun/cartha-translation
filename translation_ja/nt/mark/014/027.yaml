  source_fidelity: 本文はギリシア語本文を正確に反映している。πάντεςは「皆」、σκανδαλισθήσεσθεは比喩を保つ「つまずく」、γέγραπταιは「書かれている」とされている。引用内の未来形「わたしは…打つ」と未来受動形「散らされる」も保持され、一人称の主体を不必要に特定していない。
  naturalness: 明瞭で自然な現代標準日本語である。「イエスは弟子たちに言われた」と引用導入、また「すると」による引用内の流れはいずれも読みやすい。「つまずく」はここでは比喩として通用し、脚注が文脈上の含意を補っている。
  terminology: 「羊飼い」「羊たち」「つまずく」は定着した聖書的表現でありつつ過度に古風ではない。脚注は受動形に由来する「つまずかされる」という可能性を適切に示し、本文を教義的に「離反する」へ限定していない。
