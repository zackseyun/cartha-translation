  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: ja
  text: というのも、彼らは、「祭りの間はやめておこう。民衆の間で[a]騒ぎが起こるといけない」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「民衆から」。ギリシア語の属格 τοῦ λαοῦ は、騒ぎが民衆の間で起こること、または民衆から起こることのいずれをも指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が示す継続的・反復的な発言を、自然な現代日本語で表す。
- source_word: γάρ
  choice: （訳出せず）
  rationale: 前節への説明的なつながりは文脈上明らかであり、日本語で「というのも」を加えると発話との接続が重くなるため、自然さを優先して明示しない。
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: 祭りの間はやめておこう
  rationale: 動詞を省いた簡潔な否定表現を、日本語の相談・決定の発話として自然に補った。「祭り」は文脈上、過越の祭りと種なしパンの祭りの期間を指す。
- source_word: μήποτε
  choice: 起こるといけない
  rationale: 恐れている結果を避けようとする意味を、現代日本語の自然な警戒表現で示す。
- source_word: ἔσται θόρυβος
  choice: 騒ぎが起こる
  rationale: 将来起こり得る公の騒動を表す。θόρυβοςを「暴動」とすると規模を限定しすぎるため、「騒ぎ」とした。
- source_word: τοῦ λαοῦ
  choice: 民衆の間で
  rationale: 属格は、騒ぎの発生源を民衆と見ることも、民衆の中で起こると見ることもできる。本文では自然な場所・参与の意味を採り、「民衆の間で」とした。
