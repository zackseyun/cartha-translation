  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: ja
  text: しかし、イエスは言われた。「彼女をそのままにしておきなさい。なぜ彼女を困らせるのですか。彼女は私に対して[b]美しい行い[a]をしたのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「良い行い」または「立派な行い」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「私のうちで」または「私において」。ここでは、イエスに関係してなされた行為を表す。「私のために」「私の上に」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν
  choice: しかし、イエスは言われた
  rationale: δέが示す、女性を非難する者たちへの応答という穏やかな対照を「しかし」で表した。イエスへの敬意を保つ自然な現代日本語として「言われた」とした。
- source_word: Ἄφετε αὐτήν
  choice: 彼女をそのままにしておきなさい
  rationale: アオリスト命令形が求める、干渉をやめるようにとの即時的な命令を表す。「放っておきなさい」よりも、彼女を守る語調が明瞭で、誤って無関心の意味に取られにくい。
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: なぜ彼女を困らせるのですか
  rationale: 直訳的には「なぜ彼女に苦労を与えるのか」だが、κόπους παρέχεινは面倒や苦痛を与えることを表すため、簡潔で自然な日本語とした。
- source_word: καλὸν ἔργον
  choice: 美しい行い
  rationale: καλόςが持つ「良い」「美しい」「立派な」という意味の幅のうち、この献身的で時宜にかなった行為への称賛を「美しい行い」で表した。「良い行い」も可能であるため脚注に示した。
- source_word: ἠργάσατο
  choice: してくれた
  rationale: 単なる遂行だけでなく、イエスに向けられた行為であることが日本語で自然に伝わる表現。「行いを行った」という重複を避けた。
- source_word: ἐν ἐμοί
  choice: 私に
  rationale: 字義的には「私のうちに」だが、ここではイエスを対象としてなされた行為を指す。文脈上「私のために」または「私に対して」も可能だが、目的の意味を過度に限定しない簡潔な「私に」とした。
theological_decisions:
- issue: καλὸν ἔργονによる女性の行為の評価
  choice: 「美しい行い」と訳す
  alternative: 「良い行い」「立派な行い」
  rationale: イエスによる明確な称賛と、その行為の美しさ・ふさわしさを保ちつつ、功徳や特定の教理的評価を付加しない。
- issue: ἐν ἐμοίの関係的・対象的な意味
  choice: 「私に」と訳す
  alternative: 「私のために」「私に対して」「私の上に」
  rationale: 行為がイエスに向けられたことを示しながら、その目的や物理的位置を本文以上に限定しない。「私の上に」は直前の油注ぎを明示するが、この節自体の評価的な表現より狭いため採らなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの命令には強さと女性を守る調子を保った。会話文は過度に古風にも口語的にもせず、「ですか」「のです」によって自然で品位ある響きとした。
