  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: ja
  text: イエスを裏切る者は、前もって彼らと合図[a]を取り決め、「私が口づけをする[b]者が、その人だ。その人を捕らえ、確実に連れて行け[c]」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しるし」とも訳せる。ここでは、相手を見分けるために前もって取り決めた合図を指す。
    reason: lexical_alternative
  - marker: b
    text: 口づけは当時一般的な挨拶であり、ここではユダがイエスを見分けさせる合図として用いた。
    reason: cultural_note
  - marker: c
    text: 「逃さないように連れて行け」という意味合い。「安全に連れて行け」とも訳せるが、ここではイエスの身の安全よりも、確実に拘束して連行することを指すと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: 前もって…決めて…と言っていた
  rationale: 過去完了の意味を、日本語では「前もって」と「言っていた」によって自然に示し、逮捕の場面以前に合図が取り決められていたことを表す。
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: イエスを裏切る者
  rationale: 文脈上の指示対象を「イエス」と明示し、παραδίδωμιのこの場面での背信的な意味を自然な日本語で表す。
- source_word: σύσσημον
  choice: 合図
  rationale: 単なる「しるし」ではなく、識別のために取り決めた合図を指す語である。
- source_word: Ὃν ἂν φιλήσω
  choice: 私が口づけする者
  rationale: 不定関係節の識別機能を保ちつつ、簡潔で格調ある現代日本語とする。
- source_word: φιλήσω
  choice: 口づけする
  rationale: 動作そのものを訳し、挨拶としての文化的意味は脚注に委ねる。
- source_word: αὐτός ἐστιν
  choice: その人だ
  rationale: αὐτόςの強調を、対象を特定する自然な日本語で表す。
- source_word: κρατήσατε
  choice: 捕らえ
  rationale: 強く取り押さえる意味を保ちつつ、逮捕場面に自然な表現とする。
- source_word: ἀπάγετε
  choice: 連れて行け
  rationale: その場所から引いて行く動作を明瞭に表す。
- source_word: ἀσφαλῶς
  choice: 確実に
  rationale: イエスの安全への配慮ではなく、逃さず確保したまま連行する意味合いを保持する。
