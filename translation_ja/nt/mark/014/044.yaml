  source_fidelity: 主要な意味は原文に忠実である。δεδώκειの先行性は「前もって」「言っていた」で概ね表され、σύσσημονを「合図」、κρατήσατεを「捕らえ」、ἀπάγετε ἀσφαλῶςを「確実に連れて行け」とする選択も文脈に適合する。ただし「彼らに合図を決めて」は、原文の『彼らに合図を与えて（その内容を）言っていた』という構文関係をやや不自然にし、合図の取り決めの相手も曖昧にする。
  naturalness: 「前もって彼らと合図を取り決め」とすれば、現代標準日本語として滑らかで、合意された識別の合図というσύσσημονの含意も明確になる。「口づけをする」は「口づけする」より自然な散文表現である。文化注のアンカーは「口づけ」の直後に置くのが適切である。
  terminology: 「裏切る者」「合図」「捕らえ」「連れて行け」は一貫して明瞭である。「確実に」は逮捕者が逃げないよう確保する含意を保ち、「安全に」という別の可能性は脚注で適切に示されている。
