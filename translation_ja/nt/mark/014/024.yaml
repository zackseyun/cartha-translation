id: MRK.14.24
reference: Mark 14:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: ja
  text: そして彼らに言われた。「これは、多くの人のために[c]注ぎ出される[b]、わたしの契約の血[a]である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「新しい契約のわたしの血」と読む。並行箇所にも「新しい契約」という表現がある。ここで採用したマルコのギリシア語本文は「わたしの契約の血」と読む。
    reason: textual_variant
  - marker: b
    text: 別訳「注ぎ出されつつある」。伝統的訳では「流される」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「多くの人に代わって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: これは……である
  rationale: ギリシア語の連結表現を直接訳し、「意味する」「象徴する」など、本文だけでは確定できない解釈を加えないため。
- source_word: τὸ αἷμά μου
  choice: わたしの……血
  rationale: 契約と犠牲のイメージを保つため、「死」などと意訳せず「血」をそのまま用いた。
- source_word: τῆς διαθήκης
  choice: 契約の
  rationale: 出エジプト記24章8節を想起させる文脈に即し、遺言ではなく「契約」とした。底本に「新しい」に当たる語はない。
- source_word: ἐκχυννόμενον
  choice: 注ぎ出される
  rationale: 現在受動分詞の形と、血が注がれる犠牲的イメージを保つ表現。「流される」も可能だが、原語の基本像がやや見えにくくなる。
- source_word: ὑπὲρ πολλῶν
  choice: 多くの人のために
  rationale: ὑπέρの利益・代理を表す含みを自然な日本語で示しつつ、「すべての人」と言い換えず、原文の「多くの人」を保持した。
theological_decisions:
- issue: διαθήκηを「契約」と「遺言」のどちらに訳すか
  choice: 契約
  alternative: 遺言
  rationale: 最後の晩餐における血の言及は、契約締結の血を語る出エジプト記24章8節との結びつきが明確であり、「契約」が文脈上適切である。
- issue: 「契約」の前に「新しい」を補うか
  choice: 補わず「契約の」とする
  alternative: 「新しい契約の」とする
  rationale: SBLGNTのこの本文には「新しい」に当たるκαινῆςがないため、並行箇所や神学的期待によってマルコ本文を調和させない。異読は脚注に示した。
- issue: ὑπὲρ πολλῶνが贖いの範囲について持つ含意
  choice: 多くの人のために
  alternative: すべての人のために／多くの人に代わって
  rationale: 「多くの人」という本文の表現を保ち、より広い教理上の議論を訳文の中で一方的に解決しない。「ために」は利益・代理の両方の含みを許す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、直接話法には簡潔で荘重な調子を保った。日本語として修飾関係が明確になるよう、主節を「血であり」と続けた。脚注記号は対応する語句の直後に置いた。
