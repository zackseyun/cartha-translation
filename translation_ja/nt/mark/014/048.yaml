  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: ja
  text: イエスは彼らに答えて言われた。「あなたがたは、まるで強盗[a]にでも対するかのように、剣やこん棒を持って、わたしを捕らえに来たのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「山賊」「無法者」または「反乱者」とも訳せる。ギリシア語は、単なる盗人ではなく、暴力的な略奪者や反乱者を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 答えて言われた
  rationale: 発言を導くギリシア語の定型表現を、簡潔で格調ある日本語として保った。「答えて」は直前の発言だけでなく、相手の行動に応じることも表し得る。
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: まるで強盗にでも向かうように
  rationale: 武装して危険な犯罪者に立ち向かうかのようにイエスを扱った、という修辞疑問の非難の響きを自然な日本語で表した。助詞「でも」は例示と意外性を伝える。
- source_word: λῃστὴν
  choice: 強盗
  rationale: 暴力を伴う略奪者を明瞭に表す一般的な訳語。山賊や反乱者を指し得る広い語義は脚注に残した。
- source_word: ἐξήλθατε
  choice: 来たのか
  rationale: 逮捕する一団がイエスのいる所へ出向いて来たことを、現在の場面を基準とする自然な日本語で表した。
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: 剣やこん棒を持って
  rationale: μάχαιρα は剣または大型の刃物、ξύλον はこの文脈では打撃用の木の棒を指す。武装の様子が明確になる表現を選んだ。
- source_word: συλλαβεῖν με
  choice: わたしを捕らえに
  rationale: 目的を表す不定詞をそのまま目的表現とし、拘束・逮捕の意味を持つ συλλαμβάνω を文脈に合う「捕らえる」で訳した。
theological_decisions:
- issue: λῃστής が示す犯罪者像の幅
  choice: 本文では「強盗」とし、より広い意味を脚注で示す
  alternative: 「山賊」「無法者」「反乱者」
  rationale: この語は単なる窃盗犯ではなく、武装した略奪者や反乱者を指す場合がある。本文で一つに限定しすぎず、読みやすい代表語を置いた上で歴史的・政治的な含意の可能性を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、イエスの修辞的な問いと物語の格調を保った。「こん棒」は読みやすさを優先して平仮名交じりとした。
