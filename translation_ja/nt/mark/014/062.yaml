id: MRK.14.62
reference: Mark 14:62
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: ja
  text: イエスは言われた。「わたしです[a]。そしてあなたがたは、人の子が『力』の右に座り[b]、天の雲とともに来るのを見ることになる[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしがそれです」とも訳せる。ギリシア語は直訳すると、単に「わたしはある」。
    reason: alternative_reading
  - marker: b
    text: ここで「力」は、神を敬って直接名指しせずに言い表す表現。
    reason: cultural_note
  - marker: c
    text: 詩編110:1、ダニエル書7:13参照。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: わたしです
  rationale: 述語を補わない簡潔な肯定として訳し、大祭司の問いへの直接の答えであると同時に、原文の荘重さと含みを保った。
- source_word: ὄψεσθε
  choice: あなたがたは……見ることになる
  rationale: 複数の聞き手に向けた未来の予告を、現代日本語で明確かつ自然に表した。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの特徴的な自称とダニエル書7章との関連を保つ、定着した聖書用語を用いた。
- source_word: ἐκ δεξιῶν
  choice: 右に
  rationale: 最高の栄誉と権威の座を示す原文の慣用表現を簡潔に保持した。
- source_word: τῆς δυνάμεως
  choice: 『力』
  rationale: 神を直接名指ししない原文の敬虔な婉曲表現を残し、かぎ括弧によって通常の抽象名詞とは異なる指示的用法であることを示した。
- source_word: καθήμενον
  choice: 座り
  rationale: 王座に着いている姿を表す文脈を保ちつつ、後続の「来る」と並行する自然な日本語にした。
- source_word: ἐρχόμενον
  choice: 来る
  rationale: ダニエル書に響く終末論的な表現を、解釈的に言い換えずそのまま保った。
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: 天の雲とともに
  rationale: 黙示的な響きを持つ原文とダニエル書7章13節への関連を忠実に伝える。
- source_word: καὶ ... καὶ
  choice: そして……座り、……来る
  rationale: 冒頭の接続を明示し、二つの動作を連用形で結んで、原文の累加的な流れを自然な日本語で表した。
theological_decisions:
- issue: Ἐγώ εἰμιを単純な肯定として訳すか、指示対象を補って訳すか
  choice: 本文では「わたしです」とした
  alternative: 「そのとおりです」「わたしがそれです」
  rationale: ギリシア語には明示的な述語がない。「わたしです」は直前の問いへの肯定として通じる一方、表現のより深い響きを限定せず、原文の曖昧さと神学的緊張を保つ。
- issue: τῆς δυνάμεωςが指す方をどこまで明示するか
  choice: 本文では「『力』」とした
  alternative: 「神」「力ある方」
  rationale: 原文は神を直接名指しせず、「力」という敬虔な婉曲表現を用いる。本文ではそれを保持し、意味は脚注で説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁判場面にふさわしい簡潔さと荘重さを保った。「『力』」は日常語としては異例だが、原文の敬虔な婉曲表現を意図的に保持し、脚注で補った。
