  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: ja
  text: 夕方になると、イエスは十二人とともに来られる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （独立した「そして」は置かず、「〜なると」で文脈を接続）
  rationale: 物語の継起は「夕方になると」で自然に表される。機械的に「そして」を加えるより、現代日本語として明瞭でありながら接続の働きを保つ。
- source_word: ὀψίας γενομένης
  choice: 夕方になると
  rationale: 属格独立構文の時間的意味を、簡潔で自然な現代日本語にした。「夕方になった時」と同じ内容を表す。
- source_word: ἔρχεται
  choice: 来られる
  rationale: ギリシア語の歴史的現在を現在形で保ち、マルコの生き生きとした物語運びを伝える。主語は文脈上イエスであり、日本語では明示した。敬語は現代の聖書文体として自然な尊敬表現である。
- source_word: μετὰ τῶν δώδεκα
  choice: 十二人とともに
  rationale: μετά＋属格の同伴を「とともに」で表した。「十二人」は、文脈上イエスが選んだ十二人の一団を指し、ここではユダも含まれる。
theological_decisions:
- issue: 「十二人」の指示対象
  choice: イエスが選んだ十二人の一団を、説明語を加えず「十二人」と訳す
  alternative: 十二弟子／十二使徒
  rationale: 本文は実質的に「十二」を名詞として用いている。「弟子」や「使徒」を補うと意味を限定するため、簡潔さと原文の表現を保った。この時点の物語ではユダもその一団に含まれる。
- issue: 歴史的現在の扱い
  choice: 現在形「来られる」を保つ
  alternative: 過去形「来られた」
  rationale: ἔρχεται は現在形であり、マルコの叙述に特徴的な歴史的現在として場面の臨場感を生む。日本語でも理解可能なため、過去形へ平準化しなかった。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で品位ある物語文とし、原文の歴史的現在を保持した。「十二人」は固有の集団名に近いが、日本語には英語の大文字・小文字の対立がないため、注は設けない。
