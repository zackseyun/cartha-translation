  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: ja
  text: よく言っておく。わたしはもう決して[a]、ぶどうからできたもの[b]を、神の国でそれを新しく[c]飲む日まで飲まない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もう二度と飲まない」。ギリシア語では強い否定表現が使われている。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「ぶどうの実り」。ここでは食事の際に杯から飲む、ぶどうからできた飲み物を指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「新たに」または「再び」。この語は、神の国における質的な新しさを含む可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: よく言っておく
  rationale: イエスの厳粛な宣言を示す定型句として、現代日本語で明瞭かつ重みのある表現とした。「アーメン、あなたがたに言う」より一般読者に意味が伝わりやすい。
- source_word: οὐκέτι οὐ μὴ πίω
  choice: もう決して…飲まない
  rationale: οὐκέτιの「もはや」と、οὐ μήによる強い将来否定の両方を自然な日本語で表した。
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: ぶどうの実からできたもの
  rationale: 原文は直接「ぶどう酒」とは言わず、ぶどうの産物を指すため、その言い回しを保ちながら日本語として意味が通るようにした。
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: その日まで
  rationale: 指示語の強調を保った簡潔な時間表現。
- source_word: ὅταν αὐτὸ πίνω
  choice: それを…飲む
  rationale: αὐτόを直前のぶどうの産物に受ける代名詞として訳し、ὅταν以下の未来の出来事を日本語の連体節で自然に表した。
- source_word: καινὸν
  choice: 新しいものとして
  rationale: 「再び」だけに限定せず、質的・終末論的な新しさを含み得る形容詞の力を保った。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神の国で
  rationale: 新約聖書の中心的表現を簡潔に保ち、出来事の場を示すἐνを「で」とした。
theological_decisions:
- issue: καινὸνの意味
  choice: 「新しいものとして」と訳し、質的な新しさを保持した。
  alternative: 「新たに」「再び」
  rationale: καινόςは「再び飲む」という反復だけでなく、新しい性質・状態を示し得る。本文ではその新しさのあり方を限定せず、脚注で別訳を示した。
- issue: 「ぶどうの実からできたもの」の指示対象
  choice: 原文の迂言的表現を保った。
  alternative: 「ぶどう酒」
  rationale: 食事の杯の中身を指すことは文脈上明らかだが、原文自体がより広い表現を用いるため、特定化しすぎないようにした。
- issue: 強い否定の終末論的含意
  choice: 「もう決して…飲まない」とし、「その日まで」という期限と併記した。
  alternative: 「二度と飲まない」
  rationale: 強い否定と、神の国で飲む将来への期待との緊張を消さず、文の時間的構造をそのまま示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳粛な宣言にふさわしい格調を保った。「よく言っておく」は定型的だが理解しやすく、文末の強い否定も自然に響く。
