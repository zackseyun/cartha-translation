  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: ja
  text: 彼女は、自分にできることをした。[a] 葬りに備えて、前もってわたしの体に香油を塗ったのだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳すれば、「彼女は持っていたものをした」。
    reason: ὃ ἔσχεν ἐποίησεν の語面を示し、本文の慣用的な訳し方を補足するため。
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: 彼女は自分にできることをした
  rationale: 直訳的には「彼女は持っていたものを行った」だが、この句は能力や手段の限りを尽くしたことを表す慣用的な言い方と理解できる。自然な現代日本語でその意味を伝えつつ、直訳は脚注に残した。
- source_word: προέλαβεν
  choice: 前もって
  rationale: 後に行われる埋葬に先立って行動したという時間的な先行を表す。移動の意味を加えず、μυρίσαιと自然に結び付けた。
- source_word: μυρίσαι
  choice: 香油を塗ってくれた
  rationale: 香料・香油を体に施すことを指す。文脈上、直前に注がれた香油を明示する「香油を塗る」が、現代日本語で具体的かつ自然である。「くれた」はイエスがその行為を肯定的に受け止めている語調を表すが、行為内容自体は変えない。
- source_word: τὸ σῶμά μου
  choice: わたしの体
  rationale: 所有関係を含め、原文を直接的に訳した。
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: 葬りのため
  rationale: 埋葬に向けた目的を表す。過度に専門的な語を避け、聖書文体として自然な「葬り」を採用した。
theological_decisions:
- issue: この節では明示されない女性の主語を文脈から補うか
  choice: 「彼女は」と明示する
  alternative: 主語を省略して「自分にできることをした」とする
  rationale: ギリシア語の動詞は三人称単数で、直前の文脈が女性を主語として明確にしている。日本語では後半の主語を省略しつつ、冒頭で「彼女」を補うことで読みやすさと文脈上の明確さを保った。
- issue: προέλαβενを移動または意図として解釈するか
  choice: 行為の時間的先行として「前もって」と訳す
  alternative: 「先に来て」または「先を見越して」と訳す
  rationale: 原文が直接示すのは香油を塗る行為が埋葬に先立ったこと。移動や女性自身の予見を明示せず、神学的・心理的含意を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「香油を塗る」で具体的な行為を伝え、「葬り」は一般読者にも理解しやすい聖書的な語調を保つ。
