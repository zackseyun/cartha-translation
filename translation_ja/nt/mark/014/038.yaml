  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ja
  text: 誘惑に陥らないように、目を覚まして祈っていなさい[a]。心は進んでいても、肉体は弱いのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」は「試み」または「試練」とも訳せる。
    reason: πειρασμόςの語義には、悪への誘惑だけでなく、試み・試練も含まれるため。
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 複数への現在命令。ゲツセマネの文脈では、文字どおり眠らずにいることと警戒することの両方を自然に伝える。
- source_word: προσεύχεσθε
  choice: 祈っていなさい
  rationale: 現在命令の継続的な響きを、現代日本語で明瞭に表す。
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: 誘惑に陥らないためです
  rationale: 直訳的には「誘惑の中に入らないため」。日本語では「誘惑に陥る」が自然であり、ἵνα μήの目的・防止の意味も保つ。
- source_word: πειρασμόν
  choice: 誘惑
  rationale: 文脈に適した主要な意味。ただし「試み」「試練」の可能性もあるため脚注に残す。
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: 心は進んでいても
  rationale: πνεῦμαはここでは肉との対比における人間の内面・意志を指すと読むのが自然。「心」は現代日本語でその意味を明瞭に伝え、πρόθυμονの意欲や用意がある状態を「進んでいる」で表す。
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: 肉体は弱い
  rationale: ここでのσάρξは罪深い性質という教理的意味に限定せず、人間の身体的な脆弱さを指す。「肉」より自然な「肉体」を用い、対比を保つ。
theological_decisions:
- issue: πνεῦμαの指示対象
  choice: 人間の心・内なる意志
  alternative: 聖霊
  rationale: 眠り込む弟子たちへの語りかけと肉体との対比から、人間の内面の意欲を指す可能性が高い。聖霊を明示する解釈は本文以上に限定的になるため避けた。
- issue: σάρξの意味
  choice: 人間の肉体的な弱さ
  alternative: 罪深い性質／肉
  rationale: この箇所の焦点は、内面の意欲に反する人間の脆弱さであり、罪の性質という教理的概念に狭めない。「肉体」は意味を自然に伝える。
translation_notes:
  register: 明瞭で現代的かつ格調を保った標準日本語。二つの現在命令は「〜ていなさい」で継続性を表し、後半は簡潔な対句として整えた。
