  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: ja
  text: すると、大祭司は自分の衣服[a]を引き裂いて言った[b]。「これ以上、私たちに証人が必要だろうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣服」は複数形。より具体的には「下衣（チュニック）」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では歴史的現在形で「言う」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: この審理を主宰する単数の職務者を指す、確立した明確な訳語。
- source_word: διαρρήξας
  choice: 引き裂いて
  rationale: 衣服を裂く実際の動作を表し、その激しさを保ちつつ現代日本語として自然である。
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: 自分の衣服
  rationale: χιτώνの複数形を過度に祭儀的な装束へ限定せず、文脈に即して自然に表す。「自分の」は主語である大祭司自身の衣服であることを明確にする。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去形にした。時制上の特徴は注で示す。
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: これ以上、私たちに……必要だろうか
  rationale: ἔτιの「なお、さらに」と、答えが否定であることを見込む修辞疑問の力を、自然な日本語で保つ。
- source_word: μαρτύρων
  choice: 証人
  rationale: 審理において証言する人々を指す標準的な訳語。日本語では「必要」の対象として助詞「が」を用いるのが自然である。
theological_decisions:
- issue: 大祭司が衣服を引き裂いた行為の意味
  choice: 行為を文字どおりに描写し、その意味を本文で説明しない
  alternative: 冒瀆と受け取ったことへの憤り、悲嘆、または告発の表現だと明示する
  rationale: この節自体は行為と発言を記すだけで、身ぶりの意味を明言していないため、解釈を本文へ付加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、裁判場面にふさわしい端正さを保った。修辞疑問は説明的に言い換えず、原文の緊張を維持した。
