  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: ja
  text: 立ちなさい。行こう。見なさい、わたしを裏切る者[a]が近づいて来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裏切る者」は、より直訳すれば「引き渡す者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: 立ちなさい
  rationale: 二人称複数の命令形。直前まで眠っていた弟子たちに、起き上がって行動するよう促す文脈なので、「目を覚ましなさい」ではなく「立ちなさい」とした。
- source_word: ἄγωμεν
  choice: 行こう
  rationale: 一人称複数の勧奨的接続法。簡潔で自然な現代日本語として、共に進むよう促す力を表した。
- source_word: ἰδού
  choice: 見なさい
  rationale: 後続の出来事へ注意を向けさせる間投詞。「見よ」より現代的でありながら、呼びかけの力を保つ。
- source_word: ὁ παραδιδούς με
  choice: わたしを裏切る者
  rationale: 定冠詞を伴う現在分詞を実体詞的に訳した。受難物語におけるユダの行為の文脈では「裏切る」が自然だが、原語の基本的な像である「引き渡す」は脚注に残した。
- source_word: ἤγγικεν
  choice: 近づいて来た
  rationale: 完了形が示す、接近がすでに起こり、その結果が目前にあるという含みを自然な日本語で表した。「到着した」と断定せず、原文の接近の語義を保った。
theological_decisions:
- issue: 受難文脈における παραδίδωμι の訳し方
  choice: 裏切る
  alternative: 引き渡す
  rationale: ユダとの関係における背信を文脈に即して伝えるため本文では「裏切る」とした。一方、「引き渡す」という原語の法的・行為的な幅を失わないよう脚注で示し、神学的含意を一方に限定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、短い命令と勧奨の切迫感を保った。「見なさい」はやや改まった語調だが、ἰδούの注意喚起を明示しつつ、古風な「見よ」を避けるために採用した。
