id: MRK.14.65
reference: Mark 14:65
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: ja
  text: そして、何人かがイエスにつばを吐きかけたり、顔を覆ったり[a]、拳で殴ったり、「預言せよ」と言ったりし始めた。また、役人たちはイエスに打撃を加えた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「目隠しをし」とも訳せる。原文は直訳すると「彼の顔を覆い」。
    reason: lexical_alternative
  - marker: b
    text: 原文は字義的には「役人たちは打撃をもって彼を受けた」という特異な表現。「役人たちは彼を打った」とも訳せる。「打撃」は平手打ちを含む場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: 何人かが…始めた
  rationale: 不特定の複数者と、行為の開始を表す構文を、自然な現代日本語で保った。
- source_word: ἐμπτύειν αὐτῷ
  choice: イエスにつばを吐きかけ
  rationale: 与格を伴う動詞が表す、相手に直接つばを吐く侮辱行為を明確にした。
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: 顔を覆い
  rationale: 原文の「彼の顔を覆う」という表現を直に訳し、その目的を「目隠し」と断定しなかった。
- source_word: κολαφίζειν αὐτόν
  choice: こぶしで殴って
  rationale: κολαφίζωが通常表す、こぶしによる打撃の具体性を伝えた。
- source_word: Προφήτευσον
  choice: 預言せよ
  rationale: 説明を加えず、嘲りとして発せられた簡潔な命令形を保った。
- source_word: οἱ ὑπηρέται
  choice: 下役たち
  rationale: この司法的場面に仕える配下の者たちを指す語として、家庭の僕ではなく公的な従者・役人という位置づけを表した。
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: イエスを平手で打った
  rationale: 字義どおりには「打撃をもって彼を受けた」という特異な言い回しだが、文脈上の動作を明瞭で自然な日本語にした。ῥάπισμαは平手打ちを含む打撃を表しうる。
theological_decisions:
- issue: 嘲りの命令 Προφήτευσον とイエスの身分との関係
  choice: 「預言せよ」とだけ訳す
  alternative: 「誰が殴ったか言い当ててみろ」「預言者であることを示せ」
  rationale: マルコ本文は命令の内容を補足していないため、並行箇所から説明を取り込まず、簡潔な嘲りと物語上の含みをそのまま残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、受難記事にふさわしい簡潔で重みのある調子と、原文の反復的な暴力描写を保った。「イエス」は節内の指示対象を日本語で明確にするため補った。
