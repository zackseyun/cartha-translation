  source_fidelity: 原文の主要な要素を正確に伝えている。「ある青年」はνεανίσκος τιςの不特定ながら個別的な導入を表し、「イエスについて来ていた」はσυνηκολούθειの未完了過去の継続を自然に反映する。「裸の体に亜麻布一枚をまとっただけで」は、σινδόναとἐπὶ γυμνοῦ（下に何も着けず裸身の上に）の関係を過度に限定せず明瞭に表す。「人々が彼を捕らえると、」もκρατοῦσινの生き生きした現在形と、次節へ続く叙述を適切に処理している。
  naturalness: 明快で現代標準語として自然な物語文である。「亜麻布一枚をまとっただけで」は簡潔であり、当該場面に不要な扇情性を加えていない。節末の「捕らえると、」は次節の出来事へ自然につながる。
  terminology: 「青年」「亜麻布」「捕らえる」はいずれも文脈と語義に適合する。「捕らえる」はκρατέωを法的な「逮捕」に狭めず、力ずくで取り押さえる意味を保つ。固有名「イエス」の補足も先行文脈に照らして明瞭である。
