  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: ja
  text: すると、ある青年が、裸の体に亜麻布一枚をまとっただけで、イエスについて来ていた。人々が彼を捕らえると、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκος τις
  choice: ある青年
  rationale: νεανίσκοςは「青年」、τιςは不特定ながら一人の人物を取り立てて導入するため、「ある青年」とした。
- source_word: συνηκολούθει αὐτῷ
  choice: イエスについて来ていた
  rationale: 未完了過去の継続性を「来ていた」で表した。αὐτῷの指示対象は文脈上イエスであり、日本語では固有名を補うほうが明瞭である。
- source_word: περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ
  choice: 裸の体に亜麻布一枚をまとっただけで
  rationale: περιβεβλημένοςは身にまとうこと、σινδώνは亜麻布を指す。ἐπὶ γυμνοῦは下に何も着ていない状態を示すため、「裸の体に……一枚をまとっただけ」と自然に表現した。布の具体的な形状は限定していない。
- source_word: κρατοῦσιν αὐτόν
  choice: 人々が彼を捕らえると
  rationale: κρατοῦσινは歴史的現在だが、日本語の連続した物語として自然な「捕らえると」とした。「逮捕する」ほど法的意味を限定せず、力ずくで押さえる意味を保つ。主語は直前の逮捕者たちを受けて「人々」と補った。
