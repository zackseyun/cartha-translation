  yaml_path: translation/nt/mark/014/046.yaml
  text: Then they laid hands on him and seized him[a][b].
translation:
  language: ja
  text: すると人々はイエスに手をかけ、捕らえた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: すると人々は
  rationale: οἱは文脈上、捕らえる側の人々を指し、δέは強い逆接ではなく物語の展開を示す。自然な日本語の叙述として「すると」とした。
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: イエスに手をかけ
  rationale: 直訳的には「彼に両手を置いた」だが、ここでは敵対的に手をかける慣用表現である。「手をかける」は、続く「捕らえた」と不自然に重複せず、身柄を押さえる動作を表す。代名詞の指示を明確にするため「イエス」とした。
- source_word: ἐκράτησαν αὐτόν
  choice: 捕らえた
  rationale: κρατέωはここで力ずくで確保し拘束することを表す。「逮捕した」ほど法的・手続き的な含みを前面に出さず、場面に即して「捕らえた」とした。
