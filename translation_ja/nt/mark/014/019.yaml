  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: ja
  text: 弟子たちは悲しみ始め、一人ずつイエスに、「まさか、私ではないでしょうか」と言い始めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「私ではないでしょうか」。ギリシア語の疑問は、否定の答え（「いいえ、そうではない」）を予期しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: 始め
  rationale: 補語となる二つの不定詞とともに、悲しみと言葉が起こり始めたことを示す。日本語では「悲しみ始め」と自然に表した。
- source_word: λυπεῖσθαι
  choice: 悲しみ
  rationale: 悲しみや苦悩に陥ることを表す。この厳粛な文脈では、平明で重みのある「悲しむ」が適切である。
- source_word: καὶ λέγειν αὐτῷ
  choice: イエスに…と言った
  rationale: λέγειν は一般的な「言う」であり、疑問の内容でも「尋ねた」と限定しない。αὐτῷ の指示対象を日本語で明瞭にするため「イエスに」とした。
- source_word: εἷς κατὰ εἷς
  choice: 一人ずつ
  rationale: 各人が順に応答したことを簡潔で自然な日本語で表す。
- source_word: Μήτι ἐγώ;
  choice: まさか、私ではないでしょう
  rationale: μήτι が否定の答えを予期する疑問を導くことを「まさか」と「ではないでしょう」で表し、原文の省略的な形も保った。
theological_decisions:
- issue: 弟子たちの問いが予期する答え
  choice: 否定の答えを予期する問いとして「まさか、私ではないでしょう」と訳す
  alternative: 「私ですか」
  rationale: μήτι は話者が「いや、あなたではない」という答えを期待していることを示す。単なる「私ですか」では、弟子たちの動揺と否認を求める響きが弱まる。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、厳粛さを保った。「まさか」によって μήτι の否定期待を自然に示し、過度な説明的補足は本文に加えていない。
