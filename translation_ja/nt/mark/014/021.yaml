id: MRK.14.21
reference: Mark 14:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: ja
  text: 人の子は、人の子について書かれているとおりに去って行きます。しかし、その人によって人の子は裏切られます[a]。その人には災いがあります。その人は、生まれなかったほうがよかったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「引き渡されます」。
    reason: παραδίδοται は文脈上「裏切られる」と訳せる一方、基本的には「引き渡される」の意味も持つため。
lexical_decisions:
- source_word: ὅτι
  choice: 訳文では明示しない
  rationale: 直前の発言を説明する接続語だが、日本語では文脈上自然に連続するため、あえて「なぜなら」を置かなくても説明の働きが保たれる。
- source_word: ὁ μὲν ... δὲ
  choice: …ます。しかし、…
  rationale: μένを独立には訳さず、δέを「しかし」で表し、定められた道筋と裏切る者への災いとの対照を自然な日本語で保持した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの定着した自己呼称を保持し、ダニエル書を含む聖書的響きを損なわない。
- source_word: ὑπάγει
  choice: 去って行きます
  rationale: 単なる空間的移動に限定せず、死へ向かうことを暗示する文脈上の含みを保ちながら、動詞自体を過度に説明しない表現とした。
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: 自分について書かれているとおりに
  rationale: καθώςの一致・対応と、γέγραπταιの現在まで効力を持つ「書かれている」という意味を明瞭に表した。
- source_word: οὐαὶ
  choice: 災いです
  rationale: 預言的な警告と断罪の厳粛さを保ちつつ、現代日本語として理解しやすい定型表現を採用した。
- source_word: δι’ οὗ ... παραδίδοται
  choice: 人の子を裏切る
  rationale: 受動構文を自然な日本語の能動構文に組み替え、文脈上のユダの背信を明確に伝えた。παραδίδωμιの字義的な「引き渡す」より、ここでは道徳的含意を伴う「裏切る」が適切である。
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: 生まれなかったほうがよかったのです
  rationale: 現実に反する条件を表す慣用的評価として、自然で厳粛な現代日本語にした。
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: その人
  rationale: 特定の男性を指すことは文脈で明らかであり、日本語では「その人」が自然で、指示語の反復も保持できる。
theological_decisions:
- issue: 受難文脈における παραδίδοται の訳
  choice: 裏切る
  alternative: 引き渡す
  rationale: 目前の文脈ではユダの背信が焦点なので「裏切る」が明瞭である。一方、この語には権力者へ「引き渡す」という字義と受難物語全体にわたる語彙的連関もあるが、本文の自然さを優先した。
- issue: 神の定めと人間の責任の緊張関係
  choice: 「書かれているとおり」と「その人は災い」を並置する
  alternative: どちらか一方を因果的に説明する
  rationale: 人の子の歩みが聖書に記されたとおりであることと、裏切る者が責任を負うことを、原文同様に併置した。決定論にも免責にも解消していない。
- issue: 「生まれなかったほうがよかった」の評価対象
  choice: 裏切るその人自身にとってよかった
  alternative: 一般的・非人称的な評価
  rationale: καλὸν αὐτῷの与格を「その人にとって」と理解し、日本語の慣用表現でその含意を示した。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な宣告にふさわしい丁寧体を用いた。「人の子」は聖書で定着した呼称として保持し、「去って行く」は死を露骨に補わず原文の含みを残した。
