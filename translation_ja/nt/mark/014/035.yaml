  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: ja
  text: そして、少し先へ進み[a]、地に倒れ伏して、できることなら、その時が自分のもとから過ぎ去るようにと祈っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「少し前へ進み」。
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: 少し先へ進み
  rationale: προέρχομαιとμικρόνの組み合わせが表す、ほかの者たちより少し先へ移動する動作を、自然で明瞭な日本語にした。
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: 地にひれ伏して
  rationale: 未完了過去の叙述的・始動的な用法を文脈に即して表した。「ひれ伏す」は地面に身を伏せる動作を自然に伝えるが、礼拝の姿勢だけに限定しない。
- source_word: προσηύχετο
  choice: 祈っていた
  rationale: 未完了過去が示す継続的な祈りを保持した。
- source_word: ἵνα
  choice: ようにと
  rationale: ここでは祈りの内容を導入するため、日本語で自然な「ようにと」とした。目的と内容の含みを過度に限定しない。
- source_word: εἰ δυνατόν ἐστιν
  choice: できることなら
  rationale: 直訳的な「もし可能であるなら」の条件性を保ちながら、祈りの中の切実で控えめな願いとして自然な現代日本語にした。
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: その時が自分から過ぎ去る
  rationale: παρέρχομαιの「過ぎ去る」と、定冠詞を伴うὥραの文脈上特定された「時」を保った。受難の定められた時という含意を説明的に言い換えない。
theological_decisions:
- issue: 「その時」（ἡ ὥρα）の意味
  choice: 「その時」という本文の比喩的・神学的表現を保持する
  alternative: 「苦しみの時」「死の時」と明示する
  rationale: イエスに迫る受難と死を指す文脈的含意はあるが、本文自体は単にἡ ὥραと述べているため、説明を訳文に織り込まず、表現の重みと緊張を残した。
- issue: εἰ δυνατόν ἐστινが表す可能性
  choice: 「できることなら」と条件をそのまま残す
  alternative: 神の能力または御心について明示的に解釈する
  rationale: この節だけでは可能性の性質を限定していないため、神学的に解消せず、祈りの条件表現を保持した。
translation_notes:
  register: 明瞭で現代的かつ荘重な叙述。「地にひれ伏して」は身体を地面へ伏せる動作を自然に表し、「祈っていた」で継続相を示した。
