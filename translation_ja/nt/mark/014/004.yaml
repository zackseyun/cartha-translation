  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: ja
  text: ところが、何人かは仲間内で[a]憤慨し、「なぜ、この香油[b]がこのように無駄になったのか」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「互いに」または「自分たちの内で」とも訳せる。ギリシア語の表現は、仲間内で不満を言い合うこと、または内心で憤ることを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「香料」または「香りのよい軟膏」とも訳せる。ギリシア語の「ミュロン」は、香りのある油や軟膏を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: ところが、…が…ていた
  rationale: δέは物語を進めつつ、女性の行為に対する反発との対照を示すため、自然な現代日本語の「ところが」で表した。
- source_word: τινες
  choice: 何人か
  rationale: 人物を特定しない複数の不定代名詞であることを簡潔に保つ。
- source_word: ἀγανακτοῦντες
  choice: 腹を立てて
  rationale: 単なる不快感より強い憤りを示す語。引用の発言へ自然につながる現代日本語とした。
- source_word: πρὸς ἑαυτούς
  choice: 互いに
  rationale: 文脈上は集団内で不満を言い合う意味に取れる。ただし、自分の内で憤る意味もあり得るため脚注に残した。
- source_word: Εἰς τί
  choice: なぜ
  rationale: 目的や結果を問う慣用表現を、明瞭で自然な問いとして訳した。
- source_word: ἡ ἀπώλεια αὕτη
  choice: こんなに無駄にした
  rationale: 直訳的には「この損失／浪費」だが、香油を注いだ行為を非難する発話として自然な日本語にした。
- source_word: τοῦ μύρου
  choice: この香油を
  rationale: μύρονは香りのある油または軟膏を指す。「香油」は聖書文脈で通用し、物質の油性と芳香性を簡潔に表す。
- source_word: γέγονεν
  choice: …したのか
  rationale: 完了した出来事とその現時点での結果を問う趣旨を、日本語の自然な非難の疑問文で表した。
