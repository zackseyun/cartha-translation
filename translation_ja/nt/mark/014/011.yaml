  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: ja
  text: 祭司長たちはそれを聞いて喜び、ユダに金銭[a]を与えると約束した。ユダは、好都合な時にイエスを裏切る[b]にはどうすればよいかを探り始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「銀」。このギリシア語は、銀そのものを指すことも、一般に金銭を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: または「引き渡す」。このギリシア語動詞は「引き渡す」「手渡す」という意味を持つが、ここではユダの背信的な行為という文脈から「裏切る」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: 祭司長たちはそれを聞いて
  rationale: 冠詞付き分詞の時間的な意味を自然な日本語で表した。「祭司長たち」と「それ」は直前の文脈から明らかな指示対象を補い、単独の節としても理解しやすくした。
- source_word: ἐχάρησαν
  choice: 喜び
  rationale: χαίρωの明確な喜びの反応を簡潔に保ち、「うれしく思った」よりも原文の動作性をよく伝える。
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: ユダに金を与えると約束した
  rationale: ἐπαγγέλλομαιの約束・確約の意味を保った。ἀργύριονはこの文脈では支払いに用いる金銭を指すため「金」とし、文字どおりの「銀」は脚注に残した。
- source_word: ἐζήτει
  choice: 探し始めた
  rationale: 未完了過去が表し得る開始と継続のニュアンスを、物語の展開に即して表現した。
- source_word: εὐκαίρως
  choice: よい機会を見計らって
  rationale: 都合のよい、適切な機会をうかがう戦略的な含みを自然な日本語で表し、具体的事情は付加していない。
- source_word: παραδοῖ
  choice: 裏切る
  rationale: 語そのものは「引き渡す」も意味するが、ユダが敵対者に協力する文脈では「裏切る」が行為の性質を自然に伝える。より字義的な選択肢は脚注に示した。
theological_decisions:
- issue: ユダの行為における παραδίδωμι の訳し方
  choice: 裏切る
  alternative: 引き渡す
  rationale: この場面は中立的な移送ではなく、ユダがイエスの敵対者に協力する行為を描くため、「裏切る」が文脈上の意味を適切に伝える。ただし、この動詞のより広い語義を失わないよう「引き渡す」を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての落ち着きと品位を保った。日本語で代名詞が連続して指示対象が不明瞭になるのを避けるため、直前の文脈で明らかな「祭司長たち」「ユダ」「イエス」を明示した。
