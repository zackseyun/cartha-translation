  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: ja
  text: そして、イスカリオテのユダは、十二人の一人であり、イエスを彼らに引き渡す[a]ため、祭司長たちのもとへ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスを彼らに裏切って引き渡す」とも訳せる。ギリシア語の動詞は「引き渡す」という意味だが、ユダの場合、その行為は裏切りに当たる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 前の叙述を受ける単純な接続を、自然な現代日本語で表した。
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: イスカリオテのユダ
  rationale: 日本語聖書で広く通用する人名表記を用いた。
- source_word: ὁ εἷς τῶν δώδεκα
  choice: 十二人の一人
  rationale: 「十二人」がイエスによって選ばれた特定の弟子集団を指すことを、簡潔かつ自然に表した。
- source_word: ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς
  choice: 祭司長たちのもとへ行った
  rationale: 移動を表す単純なアオリストを自然に訳し、複数形ἀρχιερεῖςはエルサレムの祭司指導者層を指す標準的な「祭司長たち」とした。
- source_word: ἵνα
  choice: ため
  rationale: 後続する行為がユダの目的であったことを明確に示した。
- source_word: αὐτὸν
  choice: イエスを
  rationale: ギリシア語では男性代名詞だが、日本語の「彼を」では指示対象が不自然または曖昧になりうるため、文脈上の指示対象であるイエスを明示した。
- source_word: παραδοῖ αὐτοῖς
  choice: 彼らに引き渡す
  rationale: παραδίδωμιの広い語義を保ち、裏切りという含意を本文だけで狭く確定しないようにした。「彼ら」は直前の祭司長たちを指す。
theological_decisions:
- issue: 裏切りの文脈におけるπαραδοῖの訳し方
  choice: 彼らに引き渡す
  alternative: 彼らに売り渡す／彼らを裏切って引き渡す
  rationale: ユダの行為は裏切りだが、παραδίδωμι自体は受難物語全体で「引き渡す」というより広い意味を担う。本文ではその語義と神学的緊張を保ち、裏切りの含意は脚注で示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。語順は日本語として自然に整えつつ、ユダが十二人の一人であること、訪問先、目的をすべて保持した。
