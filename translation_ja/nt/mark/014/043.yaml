id: MRK.14.43
reference: Mark 14:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: ja
  text: するとすぐに[a]、イエスがまだ話しておられるうちに、十二人の一人であるユダがやって来た。彼と一緒に、剣やこん棒[c]を手にした群衆[b]も、祭司長たち、律法学者たち、長老たちのもとから[d]やって来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「やって来た」は、ギリシア語では臨場感を出す歴史的現在形（直訳「やって来る」）になっている。
    reason: historical_present
  - marker: b
    text: 文脈上は敵対的な一団だが、ギリシア語自体は「群衆」を意味する。「暴徒」とも訳し得る。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「木（木製の物）」だが、ここでは武器としての棒、すなわち「こん棒」を指す。
    reason: lexical_alternative
  - marker: d
    text: 「のもとから」は、この群衆の出所または背後の権威を示す。「に遣わされて」とも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: するとすぐに
  rationale: 時間的な即時性と、マルコの物語に特徴的な急展開を、自然な現代日本語で示す。
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: イエスがまだ話しておられるうちに
  rationale: 属格絶対構文の同時性とἔτιの「まだ」を保つ。主語は文脈上明白なイエスとして補い、敬意を含む自然な叙述にした。
- source_word: παραγίνεται
  choice: やって来た
  rationale: その場に到来する意味を自然に表す。ギリシア語の歴史的現在は、日本語の物語として自然な過去形で訳した。
- source_word: Ἰούδας
  choice: ユダ
  rationale: 日本語聖書で広く定着した音写を用いた。
- source_word: εἷς τῶν δώδεκα
  choice: 十二人の一人
  rationale: 「十二人」がイエスの特別な弟子の一団を指す簡潔な呼称であることを保ち、「弟子」を補わない。
- source_word: ὄχλος
  choice: 群衆
  rationale: 語そのものは中立的に「群衆」を意味するため、敵意を先取りする「暴徒」は避け、武器の描写に敵対性を担わせた。
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: 剣やこん棒を手にした
  rationale: μετάの随伴・携行を自然な日本語で表し、ξύλαは文脈上武器としての木製の棒を指すため「こん棒」とした。
- source_word: ἀρχιερέων
  choice: 祭司長たち
  rationale: 複数形は複数の現職大祭司ではなく、祭司階級の指導者層を指すため、定着した訳語を用いた。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 単なる筆写者ではなく、ユダヤ教の律法に通じた専門家・教師という当時の役割が普通の読者に伝わる定着訳を選んだ。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: 共同体の公認された指導者を表す直接的で定着した訳語を用いた。
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: 祭司長たち、律法学者たち、長老たちのもとから
  rationale: παρά＋属格が示す出所・背後の権威を保ち、「遣わされた」と明示して原文以上に派遣の仕組みを確定しない。
theological_decisions:
- issue: παραγίνεταιの歴史的現在
  choice: 日本語の物語として過去形「やって来た」とする
  alternative: 現在形「やって来る」としてギリシア語の生々しさを形式的に再現する
  rationale: 歴史的現在の臨場感は認めつつ、明瞭で自然な現代日本語の物語時制を優先した。
- issue: 指導者たちとの関係を示すπαράの意味
  choice: 「祭司長たち、律法学者たち、長老たちのもとから」として出所・権威とのつながりを示す
  alternative: 「祭司長たち、律法学者たち、長老たちに遣わされて」と訳す
  rationale: 群衆が指導者層を出所ないし後ろ盾として来たことは示すが、前置詞だけでは派遣行為の具体的な形まで明言されていないため、その曖昧さを保った。
- issue: εἷς τῶν δώδεκαの含意
  choice: 「十二人の一人」と簡潔に訳す
  alternative: 「十二弟子の一人」と説明を加える
  rationale: ユダが最も近い弟子の一団に属していたという原文の緊張を保ちつつ、原文にない名詞を補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。場面の急迫感を「するとすぐに」で示し、過度に古風な語順は避けた。「話しておられる」はイエスへの自然な敬意を表すが、文体全体は平易に保った。脚注記号は該当箇所にすべて配置した。
