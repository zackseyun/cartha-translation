id: MRK.14.18
reference: Mark 14:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: ja
  text: 一同が横になって食事をしているとき[a]、イエスは言われた。「まことに、あなたがたに言う[c]。あなたがたのうちの一人、わたしと一緒に食べている者が、わたしを裏切る[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時、正式な食事では、食卓の周りに身を横たえるのが一般的だった。
    reason: cultural_note
  - marker: b
    text: 別訳「引き渡す」。ギリシア語の動詞は「引き渡す」「渡す」を意味し得るが、ここではイエスの仲間による背信的な引き渡しを指す。
    reason: lexical_alternative
  - marker: c
    text: より直訳すると「アーメン、わたしはあなたがたに言う」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: 横になって
  rationale: 古代の正式な食事で一般的だった、身を横たえて食卓につく姿勢を具体的に保った。現代の読者には補足が必要なため、文化注を付した。
- source_word: ἐσθιόντων / ὁ ἐσθίων
  choice: 食事をしている／食べている者
  rationale: 動詞の基本義を自然な現代日本語で表した。後半の冠詞付き分詞は「食べている者」とし、「あなたがたのうちの一人」をさらに特定する構造を保った。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言う
  rationale: イエスの厳粛な導入句としての力を保ちつつ、明瞭で格調ある現代日本語とした。「アーメン」という音写は脚注に示した。
- source_word: εἷς ἐξ ὑμῶν
  choice: あなたがたのうちの一人
  rationale: 部分を表す属格的表現を、日本語で明確かつ自然に訳した。
- source_word: παραδώσει
  choice: 裏切る
  rationale: 語そのものは「引き渡す」を意味し得るが、ここでは共に食事をする仲間がイエスを敵対者に渡す行為を指すため、関係上の背信を自然に伝える「裏切る」とした。字義的な訳は脚注に残した。
- source_word: μετ’ ἐμοῦ
  choice: わたしと一緒に
  rationale: 単純な同伴を、自然で明瞭な日本語で表した。
theological_decisions:
- issue: 受難の文脈における παραδώσει の訳
  choice: 裏切る
  alternative: 引き渡す
  rationale: 原語は必ずしも常に「裏切る」を意味しないが、この節では食卓を共にする親しい仲間による背信的な引き渡しが問題となっている。「裏切る」はその文脈的な力を伝え、同時に脚注で原語の幅を明示する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの厳粛な宣言には簡潔で格調ある表現を用いた。古代の食事姿勢は本文で保持し、文化的背景を脚注で補った。
