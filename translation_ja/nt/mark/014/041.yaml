  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ja
  text: そして、三度目に来て、彼らに言われた。「まだ眠って休んでいるのか。[a] もうよい。[b] 時が来た。見よ、人の子は罪人たちの手に引き渡されつつある。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: また、「これからも眠って、休んでいなさい」とも訳せる。ギリシア語は、皮肉を込めた許可・命令とも、叱責を表す問いとも解釈できる。
    reason: alternative_reading
  - marker: b
    text: 「もうよい」は解釈の難しい表現。ほかに「もう十分だ」「十分だ」などの訳があり、ここでは可能性が低いものの、商取引の表現として「支払いは済んだ」と理解する説もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: 三度目に戻って来ると
  rationale: 歴史的現在の生き生きとした叙述を自然な日本語の物語表現にし、文脈上その場へ戻ったことを明確にした。
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: まだ眠って休んでいるのか
  rationale: 直説法の形は皮肉な許可・命令とも修辞疑問とも取り得る。本文では直後の切迫した展開に自然につながる修辞疑問とし、別解を脚注に残した。
- source_word: ἀπέχει
  choice: もうよい
  rationale: 難解な表現であり、「もう十分だ」という区切りの意味を簡潔で自然な日本語にした。
- source_word: ἦλθεν ἡ ὥρα
  choice: 時が来た
  rationale: ὥρα は直訳すれば「時刻」だが、ここでは定められた決定的な時を表すため「時」とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す語の力を、簡潔で格調を保つ定訳で表した。
- source_word: παραδίδοται
  choice: 引き渡されようとしている
  rationale: 現在形の進行・切迫性を示しつつ、「裏切られる」と狭く限定せず、引き渡し全体を表した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した表現を保った。
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: 罪人たちの手に
  rationale: 他者の支配下へ渡されるという具体的な比喩を保持した。
theological_decisions:
- issue: Καθεύδετε…ἀναπαύεσθε の発話の力
  choice: 叱責を含む修辞疑問「まだ眠って休んでいるのか」
  alternative: 皮肉な許可・命令「このまま眠って、休んでいなさい」
  rationale: 古い写本の句読法では決定できず、ギリシア語は双方に解し得る。本文では文脈上自然な疑問形を採り、真正な曖昧さを脚注に示した。
- issue: ἀπέχει の意味
  choice: もうよい
  alternative: 「もう十分だ」「十分だ」、または商取引的な「支払いは済んだ」
  rationale: 文脈に最も適する区切りの意味を採用し、議論のある語であることを脚注で示した。
- issue: παραδίδοται の意味範囲
  choice: 引き渡されようとしている
  alternative: 裏切られる
  rationale: ユダの裏切りだけに限定せず、受難物語における「引き渡す」の広い意味と受動形を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「見よ」「人の子」など聖書本文にふさわしい簡潔な格調を保った。イエスへの敬意を示す自然な日本語として「言われた」を用いた。
