  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: ja
  text: 彼らは、ゲツセマネという場所に来た。イエスは弟子たちに言った。[a]「わたしが祈り終えるまで、ここに座っていなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、ここにある「来た」と「言った」はどちらも現在形である。物語を生き生きと描く用法である。
    reason: 原文の歴史的現在形を、日本語本文では自然な過去形で訳したことを示すため。
lexical_decisions:
- source_word: ἔρχονται
  choice: 来た
  rationale: 物語中の歴史的現在形だが、現代日本語の自然な物語叙述に合わせて過去形とした。原文の時制形は注に示した。
- source_word: χωρίον
  choice: 場所
  rationale: 土地、地所なども意味し得るが、文脈が要求する以上に場所の性格を限定しない、自然で広い訳語を選んだ。
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: ゲツセマネという
  rationale: 固有名を慣用的に音写し、ギリシア語の「その名は」に対応する内容を自然な現代日本語で表した。
- source_word: λέγει
  choice: 言った
  rationale: これも物語を生き生きと描く歴史的現在形である。日本語では前文との自然な時制の統一を優先して過去形とし、原文の形は注記した。
- source_word: μαθηταῖς
  choice: 弟子たち
  rationale: 教師に従って学ぶ者という福音書での関係を保つ、定着した訳語である。
- source_word: Καθίσατε ὧδε
  choice: ここに座っていなさい
  rationale: 単に着座を命じるだけでなく、その場にとどまることが文脈上含意されるため、自然な日本語の命令表現とした。
- source_word: ἕως προσεύξωμαι
  choice: わたしが祈っている間
  rationale: ἕωςとアオリスト接続法は祈りが済むまでの時間的範囲を示す。「わたしが祈るまで」では日本語で祈り始める前までとも受け取られ得るため、弟子たちが座っている期間を自然に表した。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語を用いた。「彼ら」より自然な集団表現として「一行」を選び、文脈上の発話者は「イエス」と明示した。命令は威圧的になりすぎない、師から弟子への落ち着いた言い方にした。
