  to: 彼がどの家に入って行っても、その家の主人にこう言いなさい。『先生がこう言っておられます。「わたしが弟子たちと一緒に過越の食事をするための客間は、どこですか。」』
  rationale: 不定的な「どこに入って行っても」の意味を、日本語では文脈上明らかな「家」を補って「どの家に入って行っても」と表しました。直接話法の入れ子は外側を『』、内側を「」で統一しました。「わたしが弟子たちと一緒に過越の食事をするための客間」として、客間を求める目的と、μου（わたしの）を明瞭かつ自然に保持しています。
