source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: ja
  text: 彼がどの家に入って行っても、その家の主人にこう言いなさい。『先生がこう言っておられます。「わたしが弟子たちと一緒に過越の食事をするための客間は、どこですか。」』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: その人が入って行く家で
  rationale: ὅπου＋ἐάν＋接続法の不定関係の意味を保ちつつ、日本語では直前の文脈にある家への入場を自然に示すため「入って行く家で」とした。
- source_word: εἴπατε
  choice: こう言いなさい
  rationale: 二人の弟子に向けたアオリスト命令形であり、後続する直接話法を自然に導く。
- source_word: οἰκοδεσπότῃ
  choice: その家の主人
  rationale: 家または世帯を取り仕切る者を指す。現代日本語として自然で、社会的な権限も適度に表す。
- source_word: Ὁ διδάσκαλος
  choice: 先生
  rationale: イエスを指す、相手にも通じる呼称としての通常の語義を表す。「師」より平明で、「主」のような別の称号を持ち込まない。
- source_word: κατάλυμά μου
  choice: わたしの客間
  rationale: κατάλυμαは宿泊場所も意味し得るが、この文脈では個人宅の客間と考えるのが自然である。μουを省かず「わたしの」とした。
- source_word: τὸ πάσχα
  choice: 過越の食事
  rationale: πάσχαは祭りまたは食事を指し得るが、ἐσθίωの目的語であるため、ここでは何を食べるかが明確になる自然な日本語とした。
- source_word: μετὰ τῶν μαθητῶν μου
  choice: 弟子たちと一緒に
  rationale: μετάの共同の意味と、μαθηταίが表すイエスの弟子たちとの関係を明瞭に示す。
- source_word: φάγω
  choice: 食事をするための
  rationale: 接続法が、求めている場所の目的・予定された行為を示す点を、日本語の目的表現で自然に伝える。
theological_decisions:
- issue: イエスの自己呼称 διδάσκαλος の訳
  choice: 先生
  alternative: 教師／師
  rationale: 語の通常の意味と、ここで相手に通じる呼称として用いられていることを表す。原文以上に強い権威的・キリスト論的称号を持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語。直接話法の入れ子をかぎ括弧と二重かぎ括弧で示した。「その人」は直前の文脈に登場する人物を受ける。
