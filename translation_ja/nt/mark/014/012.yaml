source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: ja
  text: 種なしパンの祭りの第一日、過越の小羊が屠られていた時[a]、弟子たちはイエスに言った。「過越の食事をなさるために、私たちがどこへ行って準備することをお望みですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「過越を屠っていた時」。ここで「過越」は、犠牲として屠られる過越の小羊を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: 種なしパンの祭りの第一日
  rationale: 属格表現を自然な日本語にした。「祭り」は原文に明示されないが、日本語で「種なしパンの第一日」とすると食物自体の第一日とも受け取られやすいため、祭期を指すことを明確にした。
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: 過越の小羊を屠る日
  rationale: θύωと共に用いられるπάσχαは犠牲となる過越の小羊を指す。未完了過去ἔθυονは、この定例の祭儀が行われる時を示すため、日本語では文脈に即して「屠る日」とした。
- source_word: λέγουσιν
  choice: 言った
  rationale: 物語上の歴史的現在を、現代日本語の自然な過去時制で表した。
- source_word: Ποῦ θέλεις
  choice: どこへ…しましょうか
  rationale: 直訳的な「どこを望みますか」ではなく、イエスの意向を尋ねる弟子たちの問いとして自然に表現した。
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: 私たちはどこへ行って準備しましょうか
  rationale: 先行する分詞と主動詞の順序を「行って準備する」で保ち、間接的な伺いのニュアンスを「しましょうか」で示した。
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: 過越の食事をなさるために
  rationale: ἵναの目的関係を「ために」で表した。ここでπάσχαは食べる対象として過越の食事を指すため、その意味を明示した。φάγῃςは敬意を含む自然な発話として「なさる」とした。
theological_decisions:
- issue: 一節内の二つのπάσχαが指すもの
  choice: 第一の用例は「過越の小羊」、第二の用例は「過越の食事」
  alternative: 両方を単に「過越」とする
  rationale: 第一の用例はθύω「屠る、犠牲として献げる」と結びつくため犠牲獣を、第二はἐσθίω「食べる」と結びつくため食事を指す。動詞との結びつきによる文脈的な区別であり、教理的調和ではない。
- issue: 「種なしパンの祭りの第一日」と過越の小羊を屠る時の暦上の関係
  choice: 原文の並置を保ち、暦上の厳密な区分を本文で説明しない
  alternative: ユダヤ暦上の呼称に合わせて日付を解釈的に言い換える
  rationale: 原文自身が用いる一般的な祭期表現を尊重し、共観福音書間または暦法上の問題を翻訳で解消しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体とした。「屠る」は祭儀的な殺しを正確に表すため採用。「過越」は日本語聖書で定着した語を用い、初出でも「祭」を重ねず簡潔にした。
