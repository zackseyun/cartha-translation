  text: οἱ δὲ εἶπαν αὐτοῖς καθὼς ⸀εἶπεν ὁ Ἰησοῦς· καὶ ἀφῆκαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: ja
  text: 弟子たちは、イエスが言われたとおりに彼らに答えた。すると彼らは、弟子たちが行くのを許した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼らを行かせた」。ギリシア語の動詞は「許す」「解放する」「去らせる」などを意味し、ここでは、その場にいた人々が弟子たちをもはや引き止めなかったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 弟子たちは
  rationale: 定冠詞の名詞的用法は文脈上、子ろばを解いていた弟子たちを指す。日本語では指示対象を明示し、δέは文脈の自然な流れの中で無理に訳出しない。
- source_word: εἶπαν αὐτοῖς
  choice: 彼らに答えた
  rationale: 直訳は「彼らに言った」だが、直前の問いかけへの返答であるため、現代日本語では「答えた」が自然であり、発話の機能を正確に伝える。
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: イエスが言われたとおりに
  rationale: καθώςが示す一致・対応を「とおりに」で保持する。イエスの先行する指示を指すことは文脈と日本語の時制で明らかなため、過去完了に相当する表現を加えない。
- source_word: ἀφῆκαν αὐτούς
  choice: 彼らは、弟子たちが行くのを許した
  rationale: ἀφίημιは「放す、去らせる、許す」など幅広い。ここでは、その場の人々が弟子たちを妨げず、子ろばを連れて行くことを認めたという文脈上の意味を自然な日本語で表す。代名詞の連続による曖昧さを避けるため、目的語を「弟子たち」と明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、物語文にふさわしい落ち着いた格調を保った。「子ろばを連れて」は本文に補わず、注で文脈を説明した。
