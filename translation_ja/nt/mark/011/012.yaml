  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: ja
  text: 翌日、彼らがベタニアを出たとき、イエスは空腹を覚えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （独立した「そして」は置かず、「翌日」で物語を自然に継続）
  rationale: καίは物語を継続する接続辞。日本語では節冒頭の「翌日」だけで連続性が明瞭であり、「そして翌日」とするとやや不自然になるため、機能を自然な叙述の流れで表した。
- source_word: τῇ ἐπαύριον
  choice: 翌日
  rationale: 冠詞を伴うἐπαύριονは時を表す副詞的表現で、直前の日に続く次の日を簡潔かつ自然に示す。
- source_word: ἐξελθόντων αὐτῶν
  choice: 彼らが…出たとき
  rationale: 属格独立構文の複数主語と時間的関係を保持する。アオリスト分詞は主動詞に先行する出来事を示し得るが、日本語の「出たとき」で自然に表せる。
- source_word: ἀπὸ Βηθανίας
  choice: ベタニアを
  rationale: ἀπόは場所から離れる移動を示す。日本語では移動動詞「出る」とともに起点を「ベタニアを」と表すのが自然である。
- source_word: ἐπείνασεν
  choice: 空腹を覚えた
  rationale: πεινάωのアオリストを、単なる継続状態に限定せず、空腹になったことを自然な現代日本語で表す。「空腹になった」よりも叙述として滑らかで、「飢えた」ほど強い窮乏を含意しない。
theological_decisions:
- issue: ἐπείνασενの省略された単数主語
  choice: 文脈上の主語を「イエス」と明示する
  alternative: 「彼は空腹を覚えた」とする
  rationale: ギリシア語では主語名が省略されているが、文脈上イエスを指す。日本語では「彼ら」に続けて「彼」とすると指示が曖昧になりやすいため、意味を加えずに指示対象を明示した。イエスの現実の空腹という本文の叙述は、そのまま保持した。
translation_notes:
  register: 明快な現代標準日本語。簡潔なマルコの叙述調を保ちつつ、日本語で不自然な逐語的接続は避けた。固有名は一般的な聖書表記「ベタニア」を用いた。
