  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: ja
  text: すると、そこに立っていた人たちの何人かが彼らに言っていた。「子ろば[a]をほどいて、何をしているのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシャ語πῶλοςは若い動物を指すことがあるが、ここでは若いろばを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: 何人か
  rationale: その場にいた人々のうち、特定されていない一部を指す不定複数の意味を、自然な現代日本語で表した。
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: そこに立っていた人たち
  rationale: 定冠詞を伴う完了分詞の実質的な名詞用法と、場所を示すἐκεῖを明確に反映した。「居合わせた人たち」よりも原文の表現に近い。
- source_word: ἔλεγον
  choice: 言った
  rationale: 未完了過去の背景的な発話を、日本語の物語文として自然に表した。「言い続けた」では反復を強く読み込みすぎるため避けた。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 話しかけられた複数の弟子たちを指す与格代名詞を、間接目的語として明示した。
- source_word: Τί ποιεῖτε
  choice: 何をしているのか
  rationale: 行為について直接問う現在形を自然に表し、原文に明示されない「なぜ」や「ここで」は補わなかった。
- source_word: λύοντες
  choice: ほどいて
  rationale: つながれている動物の綱を解くという文脈に最も自然な表現。「緩める」や「解放する」より具体的である。
- source_word: τὸν πῶλον
  choice: 子ろば
  rationale: πῶλος自体は若い動物を表し得るが、この文脈ではろばを指す。日本語で「子馬」とすると馬に限定して受け取られやすいため、「子ろば」とした上で語義の幅を注記した。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、会話には簡潔ながらも品位のある言い回しを選んだ。接続のκαίは物語の進行を示す「すると」とした。
