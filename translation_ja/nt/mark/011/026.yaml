lexical_decisions:
- source_word: ἀφίημι
  choice: 赦す
  rationale: 人が他者の罪責を免じることと、父なる神が過ちを赦すことの双方を自然かつ一貫して表す。
- source_word: παράπτωμα
  choice: 過ち
  rationale: 正しい道からの逸脱や違反を表す語であり、一般的な「罪」より原語の語感をある程度保ちながら、現代日本語として明瞭である。
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: 天におられるあなたがたの父
  rationale: 後置された修飾句を自然な日本語の連体修飾にし、父が天におられるという原文の内容を明示する。
theological_decisions:
- issue: 人の赦しと父なる神の赦しとの関係
  choice: 原文どおり条件文と対応表現を保ち、「赦さないなら」「父も…赦してくださらない」と訳す。
  alternative: 教理的説明を加えて条件の意味を限定する。
  rationale: 本文が示す緊張を解釈によって弱めたり、救済論上の特定の体系に合わせて補足したりしないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「赦してくださらない」によって父なる神への敬意を自然に示しつつ、原文の否定と警告の強さを保った。
