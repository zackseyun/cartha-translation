  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: ja
  text: 彼らは互いに相談していた。「何と言おうか。『天からだ[a]』と言えば、彼は『それなら、なぜ彼を信じなかったのか』と言うだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天から」は、「神から」または「神に由来する」という意味で用いられる、ユダヤ教の敬虔な言い方。
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο πρὸς ἑαυτοὺς
  choice: 互いに論じ合って
  rationale: 未完了過去が示す継続的な思案と、πρὸς ἑαυτούς の集団内での相互的な相談を、自然な現代日本語で表す。
- source_word: Τί εἴπωμεν;
  choice: 何と言おうか
  rationale: 審議的なアオリスト接続法の「どう答えるべきか」という含みを、簡潔で自然な自問として表す。
- source_word: Ἐξ οὐρανοῦ
  choice: 天からだ
  rationale: 原文の「天から」を保持し、神的起源を指すユダヤ的な婉曲表現を本文で説明的に言い換えない。
- source_word: ἐρεῖ
  choice: 彼は……と言うだろう
  rationale: 未来形をそのまま予想される応答として表し、文脈上の「彼」がイエスを指すことを保つ。
- source_word: Διὰ τί οὖν
  choice: それなら、なぜ
  rationale: οὖν の推論的なつながりを、自然な日本語の条件帰結として明確にする。
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: 彼を信じなかったのか
  rationale: πιστεύω＋与格がここではヨハネ本人とその証言を信じることを指すため、「彼を信じる」と訳す。
theological_decisions:
- issue: ヨハネの権威についての「天から」の意味
  choice: 本文では「天からだ」を保持する
  alternative: 「神からだ」
  rationale: 神に由来することを示す婉曲表現だが、原文の語形と修辞的な響きを保ち、解釈は注で補う。
translation_notes:
  register: 明瞭で現代的かつ品位ある口語調。祭司長たちの相談場面にふさわしく、冗長な説明を本文へ持ち込まない。
