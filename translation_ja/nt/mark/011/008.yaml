  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: ja
  text: 多くの人が自分の上着を道に敷き、ほかの人々は野から切り取った葉の付いた枝[a]を敷いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「枝」とも訳せる。ギリシア語は、切り取った葉や枝などのまとまりを広く指し、特にしゅろの枝のような特定の種類の枝を意味するわけではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 数量を表す形容詞を自然な現代日本語で表し、原文にない強調は加えない。
- source_word: ἱμάτια
  choice: 上着
  rationale: この場面では道に敷く外衣を指す。「衣」より日常的で、「外套」ほど衣服の形を限定しない。
- source_word: ἔστρωσαν εἰς τὴν ὁδόν
  choice: 道に敷き
  rationale: εἰς はこの動詞との組み合わせで、道の表面に置いて広げる動作を表すため、「道に敷く」が簡潔で自然。
- source_word: ἄλλοι δὲ
  choice: ほかの人々は
  rationale: δέ の穏やかな対比を、日本語の主題提示によって自然に表す。
- source_word: στιβάδας
  choice: 葉の茂った枝
  rationale: 切った葉や枝などのまとまりを指す語であり、文脈に即して具体化しつつ、ヨハネ福音書の「なつめやし」を持ち込まない。語義の幅は脚注で示す。
- source_word: κόψαντες ἐκ τῶν ἀγρῶν
  choice: 野から切ってきた
  rationale: 分詞が主動作に先立つことを「切ってきた」で自然に示す。ἀγροί は耕作地だけでなく野や田野も指し得るため、この植生を採る場面では「野」が明瞭。
