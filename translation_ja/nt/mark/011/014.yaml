  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: ja
  text: イエスはその木に向かって言われた[a]。「今後、いつまでも、だれもおまえから実を食べませんように。」弟子たちはそれを聞いていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「答えて、その木に言われた」。ギリシア語の「答える」は、先に発言が記されていない場合にも物語上の慣用表現として使われる。
    reason: lexical_alternative
  - marker: b
    text: 「弟子たちはそれを聞いた」とも訳せる。ギリシア語の動詞は未完了過去形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῇ
  choice: そこでイエスはその木に向かって言われた
  rationale: ἀποκριθείς は直訳すれば「答えて」だが、先行する発言がない場面でも用いられるギリシア語の物語的慣用句である。本文では自然な日本語を優先して「そこで」とし、脚注に直訳を示した。主語「イエス」は文脈から補い、女性形代名詞 αὐτῇ は文法上「いちじくの木」を受けるため「その木に」とした。
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: もう二度と、いつまでも
  rationale: Μηκέτι の「もはや〜ない」と εἰς τὸν αἰῶνα の永続性をともに保ち、宣告の強い否定を日本語で明瞭に表した。
- source_word: ἐκ σοῦ
  choice: おまえから
  rationale: 木への二人称の直接的な呼びかけを保持した。無生物への厳粛な宣告として「おまえ」を用いた。
- source_word: μηδεὶς καρπὸν φάγοι
  choice: 実を食べる者がないように
  rationale: φάγοι はアオリスト希求法で、単なる未来予測ではなく願望・呪詛的宣告を表す。「〜者がないように」により、その意志的な力を保った。καρπός はいちじくの木について自然な「実」とした。
- source_word: ἤκουον οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちはそれを聞いていた
  rationale: 未完了過去 ἤκουον の継続的・進行的な側面を「聞いていた」で表した。「それを」は日本語として目的語を明示する補足である。
theological_decisions:
- issue: いちじくの木への宣告の性質
  choice: 「実を食べる者がないように」と希求・呪詛的な宣告として訳す
  alternative: 「もう誰も実を食べることはない」と未来の予告として訳す
  rationale: φάγοι は未来直説法ではなく希求法であるため、イエスが木の将来を単に予測するのではなく、裁きとして宣告しているという原文の力を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、イエスの宣告の厳粛さを保持した。「もう二度と、いつまでも」はやや重ねた表現だが、Μηκέτι と εἰς τὸν αἰῶνα の双方の強調を伝えるため採用した。
