source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: ja
  text: そして二人に言われた。「向こうの村へ行きなさい。そこに入るとすぐ、まだだれも乗ったことのない[a]子ろばがつながれているのを見つけます。それを解いて、連れて来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は一般に「若い動物」を意味し得ますが、ここではイエスが乗る子ろばを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: 行きなさい
  rationale: 移動を命じる命令形を、明快で自然な現代日本語にした。
- source_word: κώμην τὴν κατέναντι ὑμῶν
  choice: 向こうの村
  rationale: κώμηを「村」、κατέναντιを現在地から見て向かい側にあることを示す自然な「向こう」とした。
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: そこに入るとすぐ
  rationale: 分詞構文とεὐθύςの時間的関係を自然に表し、入村後すぐ見つかるという意味を保った。
- source_word: πῶλον
  choice: 子ろば
  rationale: 語自体は若い動物を指し得るが、この場面ではイエスが乗るろばの子を指すため、文脈上明確な「子ろば」とした。語の広い意味は脚注で示した。
- source_word: δεδεμένον
  choice: つながれている
  rationale: 完了受動分詞が表す、ひもなどでつながれた状態を自然な日本語で示した。
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: まだだれも乗ったことのない
  rationale: 動物についてκαθίζωは「乗る」が自然であり、οὔπωの「まだ」を保持した。ἀνθρώπωνが人間を明示する点は日本語では「だれも」に含まれるため、直訳は脚注に示した。
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: それを解いて、連れて来なさい
  rationale: つながれた動物を解くことには「解く」、動物をこちらへ移動させることには自然な「連れて来る」を用いた。
theological_decisions: []
translation_notes:
  register: 命令の場面にふさわしい簡潔さと品位を保ちつつ、一般の読者に分かりやすい現代標準日本語とした。「向こうの村」「連れて来なさい」など、過度に文語的でない自然な表現を採用した。
