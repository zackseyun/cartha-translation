id: MRK.11.9
reference: Mark 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: ja
  text: '前を行く人々も、後に従う人々も、こう叫び続けていた。[a]

    「ホサナ！[b]

    主の名によって来られる方に、祝福があるように！」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この歓呼は詩篇118:26を踏まえている。
    reason: cross_reference
  - marker: b
    text: 「ホサナ」はヘブライ語・アラム語に由来する典礼的な叫びで、もともとは「どうかお救いください」「今、お救いください」という意味だが、ここでは賛美の歓呼としても用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: 前を行く人々
  rationale: 実体詞的な現在分詞として、行列の前方を進んでいる人々を自然な現代日本語で表し、進行中の動作を保った。
- source_word: οἱ ἀκολουθοῦντες
  choice: 後に従う人々
  rationale: 前半との並行を保ちつつ、イエスの後方からついて行く群衆を明確に示した。
- source_word: ἔκραζον
  choice: 叫び続けていた
  rationale: 未完了過去の継続的・反復的な響きを表し、公の場で繰り返される歓呼を示した。
- source_word: Ὡσαννά
  choice: ホサナ
  rationale: 一世紀には嘆願であると同時に典礼的な歓呼として機能していたため、音写を本文に残し、原義を脚注で示した。
- source_word: Εὐλογημένος
  choice: 祝福があるように
  rationale: 詩篇118:26の祝福の定型句としての力を保ち、日本語では自然な歓呼となるよう願望表現で訳した。
- source_word: ὁ ἐρχόμενος
  choice: 来られる方
  rationale: 冠詞付き現在分詞の実体詞的用法を簡潔に表し、本文にない「メシア」や「王」を加えず、敬意を含む自然な日本語とした。
- source_word: ἐν ὀνόματι κυρίου
  choice: 主の名によって
  rationale: 主の権威と代表性のもとに来るという聖書的慣用句を保ち、詩篇への言及も維持した。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの標準的な聖書用語として「主」を採用した。
theological_decisions:
- issue: 歓呼の中のメシア的同定を訳文で明示するか
  choice: 「主の名によって来られる方」という引用的表現を保つ。
  alternative: 「主の名によって来られるメシア」または「王」と明示する。
  rationale: 文脈上はメシア的意義があるが、ギリシア語本文にはその称号が明記されていない。詩篇の表現を保つことで、神学的含意を損なわず、解釈を本文へ付加することを避けた。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。行列の前後にいる二群の並行関係と、未完了過去の継続性を保った。脚注記号は該当表現の直後に置き、すべて本文中に表示した。
