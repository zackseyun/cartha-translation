source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: ja
  text: 祭司長たちと律法学者たちはこのことを聞き、どうすればイエスを滅ぼせるか[a]を図っていた。彼らがイエスを恐れていたのは、群衆全体がイエスの教えに驚嘆していたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「殺す」または「死に至らせる」とも訳せる。ギリシア語の動詞は広く「滅ぼす」を意味し得るが、この文脈では殺害の意図が示唆されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: このことを聞き
  rationale: ギリシア語には明示的な目的語がないが、日本語では直前の神殿での出来事を指す「このこと」を補うと自然であり、内容を過度に限定しない。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: エルサレムの祭司指導者層を表す、福音書で定着した明確な訳語。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 単なる筆記者ではなく、ユダヤ教の律法に通じた専門家集団を指す文脈上の意味を、現代日本語で明瞭に表す。
- source_word: ἐζήτουν
  choice: その方法を探っていた
  rationale: 未完了過去が示す継続的・企図的な動きを表し、πῶςと合わせて自然な日本語にした。
- source_word: πῶς αὐτὸν ἀπολέσωσιν
  choice: どうすればイエスを滅ぼせるか
  rationale: πῶςの手段を問う含みと、ἀπόλλυμιの広い「滅ぼす」という語義を保つ。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: ἐφοβοῦντο
  choice: 恐れていた
  rationale: 未完了過去の継続的な恐れを簡潔に表す。恐れの具体的理由は後続節に委ねた。
- source_word: πᾶς ὁ ὄχλος
  choice: 群衆が皆
  rationale: 群衆全体に広く及ぶ反応を表す強調を、自然な日本語で保持する。
- source_word: ἐξεπλήσσετο
  choice: 驚嘆していた
  rationale: 強い驚きと未完了過去の持続的状態を表すため、「驚いていた」よりやや強い「驚嘆していた」を選んだ。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: イエスの教えに
  rationale: 驚嘆の対象・契機を自然に示す。「その教え」よりも、日本語で指示対象が明確になるよう固有名を補った。
theological_decisions:
- issue: ἀπολέσωσινが表す指導者たちの意図の範囲
  choice: 「滅ぼせる」と訳し、語の広がりを本文に残す。
  alternative: 「殺せる」「死刑にできる」「亡き者にできる」
  rationale: 文脈上は殺害の意図が強く示唆されるが、ἀπόλλυμι自体はより広く「滅ぼす」を意味し得る。本文では原語の幅を保ち、致死的な意味になり得ることを脚注で示す。
- issue: 二つのγάρによる理由説明の連鎖
  choice: 「からである。というのも……からである」とし、指導者たちの恐れと群衆の反応の因果関係を保持する。
  alternative: 語順を組み替えて「群衆が皆……ので、彼らは……」と一文にまとめる。
  rationale: 原文は、企ての背景に恐れがあり、その恐れの背景に群衆の驚嘆があるという説明を段階的に提示するため、その修辞的な連鎖を残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文にふさわしい落ち着いた格調を保った。「祭司長」「律法学者」は一般読者にも比較的通じる定着語を採用し、原文の二段階の理由説明と未完了過去の継続性を反映した。
