  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: ja
  text: 彼らは再びエルサレムに来た。イエスが神殿の境内[a]を歩いていると、祭司長たち、律法学者たち、長老たちがイエスのもとに来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神殿で」または「神殿域で」。ギリシア語は内側の聖所そのものではなく、庭などを含む神殿の区域全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: 来た
  rationale: 物語を生き生きと進める歴史的現在形だが、現代日本語の自然な叙述に合わせて過去形とした。主語は文脈上イエスと弟子たちなので「一行」と明示した。
- source_word: πάλιν
  choice: 再び
  rationale: エルサレムへの到着が繰り返されたことを、簡潔で品位ある現代語で表す。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 日本語で定着している地名表記。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内
  rationale: ἱερόνは内陣そのものではなく、庭を含む神殿域全体を指すため、「神殿」だけより空間的な意味を明確にした。
- source_word: περιπατοῦντος αὐτοῦ
  choice: イエスが…歩いていると
  rationale: 属格独立構文が示す継続中の背景動作を、自然な日本語で表した。指示対象を明瞭にするため「イエス」とした。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: この複数形は祭司階級の指導者たちを指す定訳であり、単独の大祭司という意味を避ける。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 単なる筆写者ではなく、律法の専門家としての役割を現代の一般読者に明確に伝える定着した訳語。
- source_word: πρεσβύτεροι
  choice: 長老たち
  rationale: 年長者一般ではなく、公認された共同体指導者を指す制度的な用法を保つ。
- source_word: πρὸς αὐτόν
  choice: イエスのもとに
  rationale: イエスに向かって近づいた動きを自然な日本語で表し、代名詞の曖昧さを避けた。
theological_decisions:
- issue: ἱερόνが指す範囲
  choice: 神殿の境内
  alternative: 神殿／神殿域
  rationale: 内陣を指すναόςとは区別し、公開の場である庭などを含む広い神殿域を示す。これは教理的限定ではなく、場面を正確に伝える語彙・空間上の判断である。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、福音書の叙述にふさわしい簡潔さと品位を保った。歴史的現在は日本語の物語として自然な過去形で訳し、指示対象は必要な箇所で固有名詞に置き換えた。
