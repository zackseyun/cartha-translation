  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: ja
  text: ペトロは思い出して、イエスに言った。「ラビ、ご覧ください。あなたが呪ったいちじくの木が枯れています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「干からびています」。ギリシア語の動詞は、乾くことにも枯れることにも使われる。完了形は、その結果が今も続いていることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: 思い出して
  rationale: アオリスト受動分詞だが、ここでは「思い出す」という自動詞的な意味。日本語では主動詞につながる「思い出して」が自然で、発言に先立つ想起も示せる。
- source_word: λέγει
  choice: 言った
  rationale: 原文はマルコに特徴的な歴史的現在。日本語の物語では過去形の「言った」が自然であり、場面の流れを明瞭にする。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 原文は代名詞だが、日本語で「彼に」とすると指示対象が不自然または曖昧になりやすいため、文脈上の指示対象を明示した。
- source_word: Ῥαββί
  choice: ラビ
  rationale: ギリシア語本文でも音写された呼称であり、ユダヤ的背景と直接呼びかけの形を保つ。
- source_word: ἴδε
  choice: ご覧ください
  rationale: 注意を促す命令。ペトロがイエスに呼びかけている文脈に合わせ、自然な敬語とした。
- source_word: συκῆ
  choice: いちじくの木
  rationale: ここでは果実ではなく樹木を指すため、明確に「いちじくの木」とした。
- source_word: κατηράσω
  choice: あなたが呪われた
  rationale: 二人称単数アオリスト中動態。イエスへの敬意を反映した尊敬表現で、過去の行為を直接示す。
- source_word: ἐξήρανται
  choice: 枯れています
  rationale: 完了形が示す、枯れた出来事と現在も続く結果状態の双方を自然な日本語で表す。「干からびています」も語義上可能。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準語を用い、直接話法ではペトロからイエスへの敬意を自然な敬語で表した。「ラビ」は音写のまま残し、歴史的・文化的背景を保持した。
