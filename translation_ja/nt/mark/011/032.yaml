  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: ja
  text: 「しかし、『人からだ』と言おうか？」[a]――彼らは群衆を恐れていた。だれもが、ヨハネは本当に預言者だったと認めていたからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「しかし、『人からだ』と言えば」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「だれもがヨハネを、確かに預言者だと見なしていたからである」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 彼らの思案におけるもう一方の選択肢を示す逆接として、簡潔で自然な「しかし」とした。
- source_word: εἴπωμεν
  choice: 言おうか
  rationale: アオリスト接続法がこの文脈で表す思案・自問の響きを、現代日本語の「言おうか」で自然に表した。条件的に「言えば」とも訳せるため、脚注に残した。
- source_word: Ἐξ ἀνθρώπων
  choice: 人からだ
  rationale: ヨハネのバプテスマの由来について、神ではなく人に由来するという対比を、原文の「～から」に沿って簡潔に表した。
- source_word: ἐφοβοῦντο
  choice: 恐れていた
  rationale: 未完了過去の継続的・状況的な恐れを、自然な日本語で表した。
- source_word: τὸν ὄχλον
  choice: 群衆
  rationale: その場に集まった人々を指すマルコの一般的な用法に合い、簡潔で明瞭である。
- source_word: ἅπαντες
  choice: だれもが
  rationale: 全員に及ぶ分配的な意味を、自然な現代日本語で明確にした。
- source_word: γὰρ
  choice: からである
  rationale: 彼らが群衆を恐れた理由を示す説明関係を明示した。
- source_word: εἶχον
  choice: 認めていた
  rationale: ここでのἔχωは、ヨハネについて一定の見方・評価を抱く意味であり、「認めていた」が文脈上自然である。
- source_word: ὄντως ὅτι
  choice: 本当に
  rationale: 群衆がヨハネを真正の預言者と確信していたことを示す強調を保った。構文上の別表現は脚注に示した。
- source_word: προφήτης ἦν
  choice: 預言者だった
  rationale: ヨハネに対する群衆の認識内容として、過去時制を保ちつつ自然に表した。
theological_decisions:
- issue: Ἐξ ἀνθρώπωνが示すヨハネのバプテスマの由来
  choice: 人からだ
  alternative: 人間に由来する
  rationale: 神的な由来と人間的な由来との対比を保ち、特定の教理的説明を加えず、原文の比喩的な起点表現「～から」に即した。
- issue: ὄντως ὅτι προφήτης ἦνにおける預言者認識の帰属
  choice: だれもが、ヨハネは本当に預言者だったと認めていた
  alternative: だれもがヨハネを、確かに預言者だと見なしていた
  rationale: これは語り手が独立して新たな断定を加える文ではなく、群衆の確信を報告する文である。その帰属とὄντωςの強意をともに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、思案の言葉には自然な自問表現を、叙述部分には簡潔で格調を損なわない文体を採用した。原文の中断気味の deliberative な流れは、引用の直後にダッシュを置いて叙述へ移ることで示した。
