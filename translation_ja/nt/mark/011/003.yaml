source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: ja
  text: もしだれかがあなたがたに、「なぜこんなことをするのですか」と言ったら、「主[a]がそれを必要としておられます。そして、すぐにここへ送り返されます[b]」と言いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主」は「主人」とも訳せる。ギリシア語κύριοςには両方の意味があるが、ここでは福音書の文脈に従って「主」と訳した。
    reason: alternative_reading
  - marker: b
    text: 「送り返されます」のギリシア語は現在形で、直訳すれば「すぐにここへ送り返します」。文脈上、未来を表す現在形として理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: もしだれかがあなたがたに……と言ったら
  rationale: ἐάνと接続法による、将来に起こり得る開かれた条件を、自然な現代日本語で表した。
- source_word: Τί ποιεῖτε τοῦτο;
  choice: なぜこんなことをするのか
  rationale: τίは字義的には「何」だが、ここでは行為を問いただす慣用的な問いであり、「なぜ」が文脈上自然である。「こんなこと」により、目の前の行為を指すτοῦτοを表した。
- source_word: εἴπατε
  choice: 言いなさい
  rationale: 二人以上に向けたアオリスト命令形。日本語では単複を明示せず、直接的な命令として訳した。
- source_word: Ὁ κύριος αὐτοῦ χρείαν ἔχει
  choice: 主がお入り用なのです
  rationale: κύριοςを福音書の文脈に従って「主」とし、χρείαν ἔχειを、 dignifiedかつ現在も通じる「お入り用」とした。対象は直前の子ろばであり、日本語では目的語を省いても明瞭である。
- source_word: εὐθὺς
  choice: すぐに
  rationale: マルコに特徴的な即時性を、自然で明快な日本語で保持した。
- source_word: ἀποστέλλει
  choice: 返してくださいます
  rationale: 形は現在時制だが、条件が満たされた後の動作を示す未来的現在として理解した。主語は問いかけた者と取り、「くださいます」は弟子たちの返答として自然な敬意を表す。
- source_word: πάλιν ὧδε
  choice: またここへ
  rationale: πάλινの「再び／戻って」とὧδεの「ここへ」を保持した。「返す」と組み合わせることで帰還の意味が明確になる。
theological_decisions:
- issue: κύριοςの指示対象と称号としての力
  choice: 「主」
  alternative: 「主人」
  rationale: この語は一般に「主人」も意味し得るが、ここでは命令を与えているイエスを指す称号として読むのがマルコ福音書の文脈に合う。訳文は「主」としつつ、語義上の可能性を脚注に残した。
- issue: ἀποστέλλειの主語
  choice: 問いかけた者が子ろばを返す
  alternative: 主が子ろばをすぐここへ返す／遣わす
  rationale: ギリシア語では動詞の主語が明示されない。直近の単数人物τιςを主語とする理解が自然だが、統語上の曖昧さを脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、直接話法には落ち着いた品位を持たせた。「お入り用」はやや丁寧だが一般読者にも理解可能で、「必要です」より原文のχρείαν ἔχειの調子を保つ。脚注記号は該当文末にまとめて置いた。
