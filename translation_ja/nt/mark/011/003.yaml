  rationale: 主語を「主」と明示して、ὁ κύριος … ἀποστέλλειという原文の構文を保った。αὐτόν（子ろば）を「それ」として補い、πάλινを「送り返す」に織り込んだ。脚注bから不適切な主語の曖昧さを除き、現在形が文脈上未来を表す点だけを注記した。
