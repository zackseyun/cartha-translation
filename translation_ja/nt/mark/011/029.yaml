source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「あなたがたに一つ尋ねよう。わたしに答えなさい。そうすれば、わたしがどのような権威によってこれらのことをしているのか、あなたがたに言おう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 直前の問いを受けてイエスが応答に転じる流れを、現代日本語で自然に示す。強い逆接に限定しない。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: 発話の相手を明示しつつ、福音書の叙述にふさわしい自然で敬意ある表現とした。
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: わたしもあなたがたに一つ尋ねよう
  rationale: 未来形による対抗質問の提示を「尋ねよう」で表し、文脈上の応答関係を自然に示すため「も」を補った。
- source_word: ἕνα λόγον
  choice: 一つ
  rationale: λόγοςは字義的には「言葉」だが、ここでは尋ねる一件・一問を指す。「尋ねる」の目的語として日本語では「一つ」が簡潔で自然である。
- source_word: ἀποκρίθητέ μοι
  choice: 答えなさい
  rationale: アオリスト命令形の直接的な要求を明確に保つ。日本語では相手が明らかなため「わたしに」は省略した。
- source_word: καὶ ἐρῶ ὑμῖν
  choice: そうすれば、わたしも……あなたがたに言おう
  rationale: 並列接続καίが文脈上帯びる条件的な帰結を自然な日本語で示し、イエス側の応答との対応を「も」で表した。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: 行為の根拠・資格を問う句として自然であり、ἐξουσίαの制度的・神学的含意を狭めない。
- source_word: ταῦτα ποιῶ
  choice: これらのことをしている
  rationale: 現在形の継続的・現下的な意味合いを自然な日本語で表した。
theological_decisions:
- issue: ἐξουσίαの意味
  choice: 権威
  alternative: 権利／力
  rationale: 文脈はイエスの行為を行う正当な根拠や資格をめぐる論争である。「権威」は単なる能力に限定せず、その含意を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で dignified な調子を保った。原文の連続するκαίは、日本語として不自然な直列を避け、「答えなさい。そうすれば」と論理関係を明示した。
