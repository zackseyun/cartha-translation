  text: 二人は出かけて行き、通りに面した戸口の外で、つながれている子馬を見つけ、それを解いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθον
  choice: 出かけて行き
  rationale: イエスが指示を与えた場所から離れて目的地へ向かったことを、自然な日本語で表した。
- source_word: εὗρον
  choice: 見つけ
  rationale: 物語文脈における εὑρίσκω の基本的な意味を、平明な現代日本語で表した。
- source_word: πῶλον
  choice: 子ろば
  rationale: 語自体は若い動物を指し得るが、この場面では乗用の若いろばを指す。日本語で意味が明確になり、文脈にも適合する表現とした。
- source_word: δεδεμένον
  choice: つながれている
  rationale: 完了受動分詞が示す、すでにつながれた状態が続いていることを自然に表した。
- source_word: πρὸς θύραν
  choice: 戸口のそばで
  rationale: πρός がここで示す戸口への近接を、具体的で自然な位置表現にした。
- source_word: ἔξω ἐπὶ τοῦ ἀμφόδου
  choice: 外の通りにある
  rationale: 動物が屋外の通りまたは路地に位置していたことを簡潔に表した。修飾関係には幅があるため脚注で別訳を示した。
- source_word: λύουσιν αὐτόν
  choice: それを解いた
  rationale: 歴史的現在を日本語の物語として自然な過去形で表し、ひもなどでつながれた状態を解く具体的な動作を示した。
