  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: ja
  text: また、だれにも神殿の境内[a]を通って物[b]を運ぶことを許さなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神殿域」。ギリシア語は内側の聖所だけでなく、庭などを含む神殿の区域全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 「物」は、器、容器、道具などを指しうる広い語。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: 許さなかった
  rationale: 未完了過去形は、その場で継続的・反復的に制止していたことを示しうる。日本語では文脈上「許さなかった」が自然であり、その継続性も損なわない。
- source_word: ἵνα τις διενέγκῃ
  choice: だれにも…運ぶことを
  rationale: ἤφιενに続くἵνα＋接続法は、許可されなかった行為を表す。「だれにも…ことを許さなかった」という自然な日本語の構文にした。
- source_word: διενέγκῃ
  choice: 通って…運ぶ
  rationale: 物をある区域の中から向こうへ運ぶ意味。経路の方向性は「通って」で明示した。
- source_word: σκεῦος
  choice: 物
  rationale: 器、容器、道具などを含みうる広い語で、具体的な品を限定しない「物」が現代日本語では最も自然である。
- source_word: διὰ τοῦ ἱεροῦ
  choice: 神殿の境内を通って
  rationale: ἱερόνは内陣そのもの（ναός）ではなく、建物や庭を含む神殿域全体を指す。「神殿の境内」はこの区別を明確かつ自然に伝える。
theological_decisions:
- issue: エルサレム神殿に関するἱερόνの範囲
  choice: 神殿の境内
  alternative: 神殿／神殿域
  rationale: 内陣への立ち入りではなく、より広い神殿域を通行する行為が問題となっていることを示すため。教理的解釈を付加せず、語の空間的範囲を反映した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「また」で前節からの継続を示し、「だれにも」を用いて自然な否定構文とした。
