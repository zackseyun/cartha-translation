  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: ja
  text: 朝早く、彼らが通りかかると、そのいちじくの木が根から枯れているのを見た。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「根から干からびている」とも訳せる。
    reason: ἐξηραμμένηνは「干からびている」「乾ききっている」とも表せるため。
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: 彼らがそこを通りかかると
  rationale: 現在分詞が主動詞と同時の背景動作を表すため、自然な日本語の従属節で表した。「そこ」は直前の物語で通った場所を受ける最小限の補いである。
- source_word: πρωῒ
  choice: 朝早く
  rationale: 早朝という時間を簡潔で自然な現代日本語で表す。
- source_word: εἶδον
  choice: 見た
  rationale: 知覚を表すアオリストを、解釈を加えず直接的に訳した。
- source_word: τὴν συκῆν
  choice: あのいちじくの木
  rationale: 定冠詞は物語ですでに登場した特定の木を指すため、日本語では「あの」で既知性を自然に示した。
- source_word: ἐξηραμμένην
  choice: 枯れている
  rationale: 完了受動分詞が、先に起きた作用の結果として木が枯れた状態にあることを示すため、「枯れている」とした。
- source_word: ἐκ ῥιζῶν
  choice: 根から
  rationale: 枯死が根にまで及び、根を起点としていることを簡潔に保持する。日本語では複数形を明示しないのが自然である。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語としつつ、物語文としての簡潔さと品位を保った。接続詞 Καί は日本語で文頭に逐語的な「そして」を置かず、時間句から始めることで自然な連続性を示した。
