reference: Mark 11:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: ja
  text: 彼らはイエスにこう言った。「何の権威によって、こうしたことをしているのですか。それとも、だれがあなたに、こうしたことをするこの権威を与えたのですか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「それとも、だれがあなたにこの権威を与えたのですか。あなたがこうしたことをするために。」
    reason: ἵνα＋接続法は、権威が与えられた目的、または意図された結果を明示して、「あなたがこうしたことをする」と表すことができるため。
lexical_decisions:
- source_word: ἔλεγον
  choice: こう言った
  rationale: 未完了過去の継続的な側面は文脈上認めつつ、日本語の直接話法として不自然な「言っていた」を避け、自然に発言を導入した。
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: ἐν＋与格がここで示す行為の根拠・資格を、現代日本語で自然に表した。「どんな権限で」も可能だが、神学的含意を限定しない「権威」を採った。
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: 権威
  rationale: 正当な資格、委任された権利、行使する力を含み得る語であり、神殿でイエスの正当性を問う文脈に適する。
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: こうしたことをしている／こうしたことをする
  rationale: 複数形ταῦταを、直前までの複数の行為や教えを指し得る「こうしたこと」で保持した。
- source_word: ἢ
  choice: それとも
  rationale: 第二の問いが第一の問いを別の角度から言い換える選択的・代案的な接続であることを明確にした。
- source_word: τίς σοι ἔδωκεν
  choice: だれがあなたに…与えたのですか
  rationale: 授与者を問うアオリストを自然な日本語の過去表現で訳した。
- source_word: ἵνα ταῦτα ποιῇς
  choice: こうしたことをする
  rationale: 権威を与えた目的または意図された結果を、日本語では名詞「権威」を修飾する形で簡潔かつ自然に表した。
theological_decisions:
- issue: イエスの権威の由来
  choice: 問いを中立的な権威への異議として訳し、その由来を本文中で特定しない
  alternative: 「神からの権威」など、文脈上想定される由来を明示する
  rationale: この節は指導者たちの問いを記すのみで、その答えを語り手が明示してはいないため、神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的な敬体の直接話法を用いた。「何の権威によって」は威厳を保ちつつ一般読者にも理解できる表現である。「こうしたこと」によりταῦταの複数性を保持した。
