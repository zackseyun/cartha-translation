id: MRK.11.13
reference: Mark 11:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: ja
  text: そして、葉をつけたいちじくの木を遠くからご覧になり、何か見つかるかもしれないと思って、その木へ行かれた。しかし、そばまで来ると、葉のほかには何も見つからなかった。いちじくの季節ではなかったからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いちじくの時ではなかった」。
    reason: καιρόςは文脈上「季節」と訳せる一方、「時」とも訳せる。原文にない農業上の説明を加えず、語彙上の代案を示す。
lexical_decisions:
- source_word: ἰδὼν
  choice: ご覧になり
  rationale: 時間的・状況的な分詞を自然な連用形で表し、文脈上の主語であるイエスにふさわしい敬意を保った。
- source_word: συκῆν
  choice: いちじくの木
  rationale: 現代日本語で明確かつ標準的な名称である。
- source_word: ἀπὸ μακρόθεν
  choice: 遠くから
  rationale: 見る位置の隔たりを簡潔で自然な日本語にした。
- source_word: ἔχουσαν φύλλα
  choice: 葉をつけた
  rationale: 直訳調の「葉を持つ」を避け、木に葉が生じている状態を自然に表した。
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: 何か見つかるかもしれないと思って、その木へ行かれた
  rationale: εἰ ἄρα の期待を伴う不確かさを「かもしれない」で保ち、τι を「実」と限定せず「何か」と訳した。目的を日本語として自然な形で示している。
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: そばまで来ると
  rationale: 木に近づいたことと、それに続く発見との時間的関係を簡潔に表した。
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: 葉のほかには何も見つからなかった
  rationale: εἰ μὴ の除外を明確に保ちながら、自然な日本語にした。
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: いちじくの季節ではなかったからである
  rationale: καιρός を文脈に即して「季節」とし、γάρ の説明的な働きを「からである」で明示した。
theological_decisions:
- issue: 実を求めたことと、いちじくの季節ではなかったという説明との緊張
  choice: 「いちじくの季節ではなかったからである」と直接訳す
  alternative: 農業上の事情を補って、実が期待できた理由または期待できなかった理由を説明する
  rationale: 本文自体が示す緊張を解消する説明は加えず、語り手の説明をそのまま残した。
- issue: τι が指すもの
  choice: 「何か」と訳す
  alternative: 文脈から「何か実を」と明示する
  rationale: 果実を指す可能性は高いが、原文は一般的な不定代名詞を用いるため、その表現上の幅を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、物語文として落ち着いた格調を保った。主語の反復は避けつつ、イエスの行為には一般的な敬語表現を用いた。
