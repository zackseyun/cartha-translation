source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: ja
  text: 彼らはイエスに答えて言った。「分かりません。」するとイエスは彼らに言った。「わたしも、何の権威によってこれらのことをしているのか、あなたがたには言いません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: 答えて
  rationale: 応答を導く分詞であり、日本語では「答えて言った」として発話とのつながりを自然に示した。
- source_word: λέγουσιν / λέγει / λέγω
  choice: 言った／言った／言いません
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として自然な過去形を用いた。最後は間接疑問を受けるため「言いません」とした。
- source_word: Οὐκ οἴδαμεν
  choice: 分かりません
  rationale: 現在の認識の欠如を表す自然な日本語。祭司長たちの返答として丁寧体を保った。
- source_word: Οὐδὲ ἐγὼ
  choice: それなら、わたしも……言いません
  rationale: 相手が答えないことに対応する否定の対称性を「わたしも」と「それなら」で自然に表した。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: ἐνがここで示す根拠・資格を「によって」で表し、権威の由来を問う文脈を保持した。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数を保ち、イエスの神殿での行動や教えをまとめて指す表現とした。
- source_word: ποιῶ
  choice: している
  rationale: 現在形が示す継続中の活動を、日本語では「している」と自然に表した。
theological_decisions:
- issue: イエスの返答における相互対応（Οὐδὲ ἐγώ）
  choice: 「それなら、わたしも……言いません」
  alternative: 「わたしも……言いません」
  rationale: 単なる情報非開示ではなく、相手の返答拒否に対応する発言であることを文脈上自然に示す。ただし、理由や神学的意味は付加していない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話は丁寧体、地の文は簡潔な物語体とした。「答えて言った」は原文の分詞構造をある程度映す、聖書本文として品位のある表現。
