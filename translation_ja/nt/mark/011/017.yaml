source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: ja
  text: そしてイエスは教え、彼らにこう言われた。「こう書かれているではないか。『わたしの家は、すべての国々のための祈りの家と呼ばれる』[a]。ところが、あなたがたはそれを強盗の巣にしてしまった」[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての民のための祈りの家」とも訳せる。イザヤ56章7節からの引用であり、神の家がイスラエル以外の諸国民をも含むことを示している。
    reason: lexical_alternative
  - marker: b
    text: 「強盗の巣」はエレミヤ7章11節を踏まえた表現。「強盗」に当たるギリシア語は、文脈によっては「盗賊」や「山賊」を意味することもある。
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: 教えながら、彼らにこう言われた
  rationale: 二つの未完了過去が表す継続的な教えと発言を、自然な現代日本語で表した。
- source_word: Οὐ γέγραπται
  choice: こう書かれているではないか
  rationale: 完了受動の結果状態と、聖書の権威に訴える否定疑問の力を保つ。
- source_word: Ὁ οἶκός μου οἶκος προσευχῆς
  choice: わたしの家は、祈りの家
  rationale: イザヤ56章7節との語句上の響きを保ち、「家」という比喩的・聖なる表現を維持した。
- source_word: κληθήσεται
  choice: 呼ばれる
  rationale: 未来受動を引用文脈に沿って自然に表した。日本語では文脈上、予言的な未来の意味が十分伝わる。
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: すべての国々のための
  rationale: 与格を受益・対象の「ための」と取り、ἔθνηを「国々」として普遍的範囲とイザヤ書とのつながりを保った。
- source_word: ὑμεῖς δὲ
  choice: ところが、あなたがたは
  rationale: 強意代名詞と前文との鋭い対照を明示した。
- source_word: πεποιήκατε
  choice: してしまった
  rationale: 完了形が示す、行為によって現在その状態に至っているという含みを自然な日本語で表した。
- source_word: σπήλαιον λῃστῶν
  choice: 強盗どもの巣
  rationale: エレミヤ7章11節への反響を保ちつつ、隠れ場所・ねぐらを指す比喩を日本語の定着した表現で示した。
theological_decisions:
- issue: 預言の引用が示す普遍的範囲
  choice: すべての国々のための
  alternative: すべての民のための／すべての国々によって
  rationale: 神の家がイスラエルを越えて諸国民に開かれているというイザヤ書の射程を保ちつつ、与格の解釈可能性を脚注で示した。
- issue: λῃστῶνが示す非難の性質
  choice: 強盗ども
  alternative: 盗賊ども／山賊ども／反乱者たち
  rationale: エレミヤ7章11節への言及が中心であり、本文だけでは政治的反乱者という限定まで要求されないため、過度に特定しない訳を選んだ。
translation_notes:
  register: 明快で現代的だが、聖書引用としての格調を保つ文体。「言われた」でイエスへの自然な敬意を示しつつ、引用の対照と告発の鋭さを弱めないようにした。
