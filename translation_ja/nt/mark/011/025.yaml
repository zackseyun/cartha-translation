revisions:
- from: また、立って祈っているとき、だれかに対して何かわだかまりがあるなら、その人を赦しなさい。天におられるあなたがたの父[a]も、あなたがたの過ち[b]を赦してくださるためです。
  to: また、立って祈るときはいつでも、だれかに対して何かわだかまりがあるなら、天におられるあなたがたの父[a]もあなたがたの過ち[b]を赦してくださるように、その人を赦しなさい。
  rationale: 「ときはいつでも」によりὅτανの反復的用法を表した。ἵνα節は「父も…赦してくださるように」として命令に直接かけ、本文が示す人間の赦しと父の赦しの目的的な結び付きを、解釈的に弱めずに明示した。原文の語順は目的節を後置するが、日本語では目的節を先行させる方が係り受けが明瞭であり、意味は変更していない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:35:17Z'
review_pass:
  verdict: revise
  source_fidelity: 「立って祈る」という姿勢と同時性、対人の包括的なわだかまり、父による赦しとの結び付きは概ねよく反映されている。ただし、ὅταν の習慣的・反復的な「いつでも」の含意を明示し、ἵνα 以下が人を赦す命令の目的を表すことが日本語の係り方から明瞭になるよう整えるのが安全である。
  naturalness: 「立って祈るときはいつでも」「何かわだかまりがあるなら」は明瞭な現代標準語として自然である。目的節を命令の前に置くことで、「父が赦してくださるために」という関係を無理なく表せる。
  terminology: 「赦す」は対人の赦しと父の赦しの対応を適切に保つ。「過ち」は παράπτωμα の広い意味を平明に伝えるが、脚注では「罪過」も代案として示し、道徳的な単なる失敗に狭められないようにする。父なる神への「くださる」は現代日本語の敬意表現として適切である。
  issues:
  - severity: medium
    issue: ὅταν の反復的・習慣的な含意が訳文で明示されていない。
    rationale: 「立って祈っているとき」でも一般的場面は表せるが、「ときはいつでも」を加えると「whenever」に当たる反復性が明確になる。
  - severity: medium
    issue: 「赦しなさい。…赦してくださるためです」は、目的節が直前の父の赦しを説明するようにも読め、父の赦しが人を赦す命令の目的である係り方がやや不明瞭である。
    rationale: ἵνα ... ἀφῇ は、人を赦すことが父の赦しに結び付くことを示す。目的節を命令に先行させることで、この関係を明瞭に保てる。
  - severity: low
    issue: 脚注bの代案が「背き」「違反」のみである。
    rationale: παραπτώματα の「罪過／過失」の語感も脚注に含めると、「過ち」の意味域をより適切に補える。
