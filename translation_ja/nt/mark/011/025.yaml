id: MRK.11.25
reference: Mark 11:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: ja
  text: また、立って祈るときはいつでも、だれかに対して何かわだかまりがあるなら、天におられるあなたがたの父[a]もあなたがたの過ち[b]を赦してくださるように、その人を赦しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「諸天におられるあなたがたの父」。ギリシア語の「天」は複数形。
    reason: lexical_alternative
  - marker: b
    text: 「罪過」「違反」または「背き」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: 立って
  rationale: 祈りの際の具体的な姿勢を示す語を省略せず、習慣的・反復的な場面を自然な日本語で表した。
- source_word: προσευχόμενοι
  choice: 祈っているとき
  rationale: στήκετεと同時に行われる動作を示す現在分詞であるため、「立って祈っているとき」として同時性を明確にした。
- source_word: ἀφίετε
  choice: 赦しなさい
  rationale: 対人関係における負い目やわだかまりを手放すという文脈では、「赦す」が明瞭で自然であり、後半の神による赦しとの語の対応も保てる。
- source_word: εἴ τι ἔχετε κατά τινος
  choice: だれかに対して何かわだかまりがあるなら
  rationale: τιとτινοςの不特定で包括的な意味を保ちつつ、κατά τινοςが表す対人的な不満や訴えを、現代日本語として理解しやすく表現した。
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: 天におられるあなたがたの父
  rationale: 自然で尊厳ある日本語を優先した。原文の「天」が複数形であることは脚注に示した。
- source_word: ἀφῇ
  choice: 赦してくださる
  rationale: ἵναに導かれる接続法の目的を「ためです」で表し、καίによる「父も」という対応を保持した。敬語は父なる神を指す日本語として自然である。
- source_word: παραπτώματα
  choice: 過ち
  rationale: 踏み外し、違反、背きという意味幅を持つ語であり、一般読者に明瞭な「過ち」を採用した。より強い選択肢は脚注に示した。
theological_decisions:
- issue: 人が他者を赦すことと父から赦されることとの関係
  choice: 「赦しなさい。……父も……赦してくださるためです」と目的関係をそのまま示した。
  alternative: 人を赦すことは、すでに神から赦されていることの単なる証拠である、と説明的に言い換える。
  rationale: ἵνα ... ἀφῇは、他者を赦す命令と父による赦しを明確に結び付けている。より広い教理体系によってこの緊張を弱めず、本文の表現を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祈りの姿勢、赦しの命令、父による赦しとの目的関係を省略しなかった。「わだかまり」は対人的な含意を自然に伝え、「過ち」は宗派固有の用語を避けて広く理解できる表現とした。
