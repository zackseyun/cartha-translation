base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: ja
  text: 祝福あれ、私たちの父ダビデの来る王国に！ いと高き所にホサナ！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ホサナ」は、もともと「どうか救ってください」または「今、救ってください」という願いを表す語とも取れるが、ここでは礼拝における賛美の歓声として用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: 祝福されよ
  rationale: 述語的な形容詞による歓呼を、祈願・賛美の響きを保つ簡潔な日本語で表した。「ほめたたえられよ」よりも、原語の祝福宣言としての幅を保てる。
- source_word: ἡ ἐρχομένη βασιλεία
  choice: 来ようとしている王国
  rationale: 現在分詞の到来しつつあるという力を保ち、「来るべき王国」のように固定化された終末論的表現へ狭めないようにした。
- source_word: βασιλεία
  choice: 王国
  rationale: ダビデ王朝を背景とする具体的な王的支配の到来を自然に表す。「支配」も可能だが、この歓呼では「王国」が文脈に適する。
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: 私たちの父ダビデの
  rationale: 属格が「王国」を修飾する構造と、祖先への敬称としての「父」をそのまま保った。
- source_word: Ὡσαννὰ
  choice: ホサナ
  rationale: 新約時代には典礼的な歓呼として定着しているため音写し、元来の救いを求める意味は脚注で示した。
- source_word: ἐν τοῖς ὑψίστοις
  choice: いと高き所に
  rationale: 最高の天的領域を指し得る慣用句を、伝統的でありながら理解可能な表現で簡潔に訳した。「天のいと高き所に」と明示することは解釈を加えるため避けた。
theological_decisions:
- issue: ダビデの王国についての歓呼の性質
  choice: 「私たちの父ダビデの、来ようとしている王国」と直接的に訳す。
  alternative: 「私たちの父ダビデの、来ようとしているメシア王国」
  rationale: 文脈にはメシア待望が強く示唆されるが、ギリシア語本文は「メシア王国」と明記しない。解釈的な教理語を本文へ補わず、ダビデとの関連が持つ含意と緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、群衆の典礼的な歓呼にふさわしい簡潔で格調ある調子と感嘆符を保った。属格関係の誤読を避けるため「ダビデの」の後に読点を置いた。
