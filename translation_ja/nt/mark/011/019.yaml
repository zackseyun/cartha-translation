  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: ja
  text: 夕方になるたびに、彼らは町の外へ出て行った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本では、動詞は単数形で「彼は町の外へ出て行った」となっている。
    reason: SBLGNT本文は複数形ἐξεπορεύοντο（「彼らは出て行った」）を採るが、単数形ἐξεπορεύετο（「彼は出て行った」）とする本文異読がある。動詞の数の違いは、文脈上想定される主語の範囲に影響するため。
lexical_decisions:
- source_word: ὅταν
  choice: ～たびに
  rationale: 接続詞ὅτανと未完了過去ἐξεπορεύοντοの組み合わせが表す反復・習慣的な動作を、自然な現代日本語で伝える。
- source_word: ὀψὲ ἐγένετο
  choice: 夕方になる
  rationale: 「遅い時刻になる／夕方になる」という時間表現を、簡潔で自然な日本語にした。
- source_word: ἐξεπορεύοντο
  choice: 出て行った
  rationale: 未完了過去の習慣的意味は「～たびに」によって明示されているため、動詞自体は自然な過去形とした。
- source_word: ἔξω τῆς πόλεως
  choice: 都の外へ
  rationale: 移動を表す動詞に合わせて、ἔξω＋属格の「都市の外へ」という方向を表した。
- source_word: πόλεως
  choice: 都
  rationale: 原文は固有名「エルサレム」ではなく「都市」とするが、文脈上のエルサレムを指す日本語として「都」が自然で格調も保てる。
- source_word: ἐξεπορεύοντο（主語）
  choice: イエスたちは
  rationale: ギリシア語の動詞は三人称複数で主語を明記しない。日本語では単に「彼ら」とすると指示対象が曖昧になりやすいため、文脈上の集団を「イエスたち」と表した。ただし本文伝承には単数形の異読があるため注記した。
