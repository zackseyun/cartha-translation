  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: ja
  text: 一行がエルサレムに近づき、オリーブ山の方、ベテパゲとベタニアのあたりまで来たとき[a]、イエスは弟子のうち二人を遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「エルサレムに近づき、ベテパゲとベタニアへ、オリーブ山の方へ」。ギリシア語の場所を示す句の正確な結び付きと地理的関係には解釈の幅がある。
    reason: 原文の空間表現にある統語的・地理的曖昧さを保持するため。
lexical_decisions:
- source_word: ἐγγίζουσιν εἰς Ἱεροσόλυμα
  choice: エルサレムに近づき
  rationale: ἐγγίζωの接近の意味とεἰςが示す目標地点を、自然な現代日本語で表した。ギリシア語は物語的現在だが、続く出来事との流れに合わせて過去の叙述として理解できる連用形にした。
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: ベテパゲとベタニアまで来た
  rationale: 二つの地名を接近の途上で到達した場所として表し、εἰςの方向・到達点の含みを保った。
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: オリーブ山の近くにある
  rationale: πρόςの空間的関係をここでは近接として取り、ベテパゲとベタニアの位置を自然に示した。
- source_word: ἀποστέλλει
  choice: 遣わした
  rationale: マルコに多い物語的現在を、日本語の通常の物語叙述に合わせて過去形で訳した。「遣わす」は任務を与えて送り出す意味を保つ。
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: 弟子のうち二人
  rationale: 部分属格を明確かつ自然に表した。
- source_word: Βηθφαγὴ
  choice: ベテパゲ
  rationale: 日本語聖書で広く通用する地名表記を採用した。
- source_word: Βηθανίαν
  choice: ベタニア
  rationale: 日本語で定着した地名表記を採用した。
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: オリーブ山
  rationale: 地名として明瞭で、属格の内容も伝わる定着した訳語を用いた。
theological_decisions:
- issue: ἀποστέλλειの物語的現在
  choice: 遣わした
  alternative: 遣わす
  rationale: 神学的含意を加えず、日本語の自然な過去叙述を優先した。現在形を用いるマルコの生き生きした文体は代案として認められるが、この一節単独では過去形が明瞭である。
- issue: 場所を示す前置詞句の関係
  choice: ベテパゲとベタニアまで来た／オリーブ山の近くにある
  alternative: ベテパゲとベタニアに向かい／オリーブ山の方へ
  rationale: εἰςとπρόςには方向性もあり得るが、文脈上はエルサレム接近時の所在を示す読みを本文に採用し、特定の地理的再構成を過度に断定しない形にした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「一行」で複数主語を自然に受け、主語「イエス」はギリシア語では代名詞的に省略されているものの、日本語で指示対象を明確にするため補った。
