  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: ja
  text: イエスは彼らに答えて言われた。「神を信じなさい。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「神の信仰を持ちなさい」。この属格は、「神への信仰」のほか、「神の真実（信実）」または「神から与えられる信仰」と理解されることもある。
    reason: πίστιν θεοῦ の属格が、神を信仰の対象とするのか、神に属する信仰・真実、あるいは神に由来する信仰を表すのか、文法上の曖昧さがあるため。
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 答えて
  rationale: 応答して語ることを示す分詞。日本語でも後続の「言われた」と組み合わせることで、自然かつ原文の談話機能を保てる。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として自然な過去形にした。敬意を表す通常の聖書文体として尊敬語を用いた。
- source_word: Ἔχετε
  choice: 信じなさい
  rationale: 直訳的な「持ちなさい」よりも、「信仰」と神への方向性を一つの自然な日本語表現にまとめた。現在命令形が表し得る継続性を過度に明示せず、簡潔な勧告として訳した。
- source_word: πίστιν
  choice: 信じる
  rationale: この文脈では、神に向けられた信頼・信仰を表す。「信仰を持ちなさい」も可能だが、「神を信じなさい」のほうが現代日本語として明快で自然である。
- source_word: θεοῦ
  choice: 神を
  rationale: πίστιν θεοῦ の属格を、文脈上もっとも自然な目的語的属格、すなわち「神への信仰」と解した。ただし原文の属格には別の理解も可能なため、脚注で曖昧さを保持した。
theological_decisions:
- issue: πίστιν θεοῦ における属格の曖昧さ
  choice: 目的語的属格として「神を信じなさい」
  alternative: より字義的には「神の信仰を持ちなさい」。また「神の真実」「神から与えられる信仰」と理解する余地もある。
  rationale: 枯れたいちじくの木を受けた弟子たちへの勧告であり、続く11章23–24節も信じて祈ることを扱うため、神を信頼するよう命じる解釈が文脈に最もよく合う。しかしギリシア語の属格だけでは関係を一義的に確定できないので、別の可能性を脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「そこで」は応答が直前の出来事を受けることを示す。主文は自然な日本語を優先し、原文の属格が持つ真正な曖昧さは脚注で明示した。
