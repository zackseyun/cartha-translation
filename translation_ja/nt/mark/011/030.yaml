  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: ja
  text: ヨハネのバプテスマは、天からのものだったのか、それとも人からのものだったのか。わたしに答えなさい。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神からのもの」。ギリシア語は「天から」とあり、神に由来すること、または神の権威によることを示すユダヤ的な表現です。
    reason: lexical_alternative
  - marker: b
    text: 「人からのもの」とは、人間に由来するもの、すなわち単に人間の権威によるものという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: ヨハネのバプテスマ
  rationale: 属格を自然な連体修飾で表し、ヨハネが行った、また彼に結び付くバプテスマを指す原文の簡潔さを保った。「洗礼」も可能だが、教派的な含意を抑えつつ語を識別できる「バプテスマ」を採用した。
- source_word: ἐξ οὐρανοῦ
  choice: 天からのもの
  rationale: 原文の「天から」をそのまま保ち、神に由来することや神的権威を示すユダヤ的表現を本文で説明的に言い換えなかった。日本語では「もの」を補うことで、由来を問う対比を自然にした。
- source_word: ἐξ ἀνθρώπων
  choice: 人からのもの
  rationale: ἀνθρώπωνはここで性別を限定せず、人間に由来することを示す。「人々」よりも「人」のほうが「天」との起源・権威の対比を簡潔に表せる。
- source_word: ἀποκρίθητέ μοι
  choice: わたしに答えなさい
  rationale: アオリスト命令形の直接的な要求を、明瞭で威厳ある現代日本語として表した。
- source_word: ἦν ἢ
  choice: …だったのか、それとも…だったのか
  rationale: 原文の未完了過去ἦνを反映し、ヨハネの活動時のバプテスマの由来を問う形にした。「来たのか」と原因・起源を補って解釈することは避けた。
theological_decisions:
- issue: 「天から」の意味
  choice: 本文では「天から」を保持する
  alternative: 「神から」と明示する
  rationale: この表現は神的な起源または権威を含意するが、原文の婉曲表現と修辞的緊張を保つため、本文では解釈を確定させず、脚注で含意を示した。
- issue: 「人から」の範囲
  choice: 性別を限定しない一般的な「人」とする
  alternative: 「人々から」または「人間に由来するもの」とする
  rationale: ἀνθρώπωνはここでは男性だけでなく人間的な起源・権威を指すため、「人」として「天」との簡潔な対比を保った。
translation_notes:
  register: 明瞭で現代的ながら、イエスの問いの厳粛さと直接性を保つ文体。「なのか」よりも「だったのか」を用いてἦνの過去時制を反映した。脚注記号は対応する対句の解説として節末にまとめた。
