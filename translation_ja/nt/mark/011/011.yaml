    rationale: 原文はエルサレムと神殿域への到達を重ねて述べるが、日本語では「入った」の連続が硬い。「エルサレムに入り、神殿の境内へ進んだ」とすれば、二つの目的地と移動の方向性を保ちながら自然になる。
