  naturalness: 「エルサレムに入り、神殿の境内に入った」は同じ動詞の反復によりやや不自然である。また「時刻も遅くなっていた」より「遅い時刻になっていた」のほうが明瞭で自然である。
  terminology: 「神殿の境内」はἱερόν（内陣に限られない神殿域）を適切に表す。「十二人」は本文で原文の簡潔さを保ち、脚注で指示対象を示している。固有名詞の「エルサレム」「ベタニア」も標準的である。
