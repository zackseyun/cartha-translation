id: MRK.11.11
reference: Mark 11:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: ja
  text: そしてイエスはエルサレムに入り、神殿の境内[a]へ進んだ。すべてを見回してから、すでに遅い時刻になっていたので、十二人[b]と一緒にベタニアへ出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」とも訳せる。ギリシア語は内陣だけでなく、境内を含む神殿域全体を指す。
    reason: lexical_alternative
  - marker: b
    text: イエスの十二人の弟子を指す。
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 入った
  rationale: アオリスト直説法の単純な移動を自然な現代日本語で表した。主語は文脈上イエスであり、日本語で明確にした。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 日本語聖書および一般用法で定着した地名表記。
- source_word: τὸ ἱερόν
  choice: 神殿の境内
  rationale: 内陣そのものを指す ναός ではなく、境内を含む神殿域全体を指す語であるため、空間的な意味を明確にした。
- source_word: περιβλεψάμενος πάντα
  choice: すべてを見回した
  rationale: 周囲をぐるりと見渡す動作と、観察対象の包括性を簡潔に表した。後続の時刻説明との関係を自然に示すため独立節とした。
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: もう時刻も遅くなっていたので
  rationale: 属格独立構文の時間的状況と、退出の背景・理由となる含みを保った。原文に「日」は明示されないため補わなかった。
- source_word: ἐξῆλθεν
  choice: 出て行った
  rationale: ἐξέρχομαι の外へ向かう方向性を保ちつつ、日本語の物語文として自然にした。
- source_word: Βηθανίαν
  choice: ベタニア
  rationale: 日本語聖書で定着した地名表記。
- source_word: μετὰ τῶν δώδεκα
  choice: 十二人と一緒に
  rationale: 定冠詞付きの数詞が文脈上イエスの十二人の弟子を指すことを保ち、本文では原文どおり役職名を補わなかった。
theological_decisions:
- issue: τὸ ἱερόν の指示範囲
  choice: 神殿の境内
  alternative: 神殿
  rationale: ἱερόν は通常、内陣に限定されない神殿域を指す。イエスが入り、全体を見回す場面の空間的意味を明確にし、ναός との区別を保った。
- issue: 「十二人」の指示対象
  choice: 本文では「十二人」とし、脚注で十二人の弟子と説明
  alternative: 十二弟子
  rationale: 原文は単に「十二人」と述べるため、その表現を保ちつつ、現代の読者に指示対象が明確になるよう脚注を付した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の動きを簡潔に示し、ἱερόν の空間的範囲は本文と脚注で明確化した。「十二人」は原文の簡潔さを保った。
