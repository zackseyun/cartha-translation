- from: そしてイエスはエルサレムに入り、神殿の境内[a]に入った。すべてを見回したが、もう時刻も遅くなっていたので、十二人[b]と一緒にベタニアへ出て行った。
  to: そしてイエスはエルサレムに入り、神殿の境内[a]へ進んだ。すべてを見回してから、すでに遅い時刻になっていたので、十二人[b]と一緒にベタニアへ出て行った。
  rationale: 逆接的な接続を除き、分詞が示す先行・随伴行為を「見回してから」で表した。また、同一動詞の不自然な反復を避けつつ、エルサレムに入った後に神殿域へ向かったという原文の移動描写を保った。脚注アンカーと脚注内容は適切であり、変更不要である。
