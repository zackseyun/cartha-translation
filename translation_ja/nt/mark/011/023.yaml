  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: ja
  text: まことに、あなたがたに言います。だれでも、この山に向かって、『持ち上げられ、海に投げ込まれよ』と言い、心の中で疑わず[a]、自分の言っていることが起こっている[b]と信じるなら、その人にはそのとおりになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「心の中でためらわず」「心が二つに分かれず」。ギリシア語の動詞には、疑うことのほか、内面で揺れる、分かれるという含みがあります。
    reason: lexical_alternative
  - marker: b
    text: または「自分の言っていることが起こる」。ギリシア語では、後の未来形「なります」に先立って現在形（「起こっている／起こる」）が使われています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスが厳粛に言明する導入句として、ἀμήνの強い確言と複数の聞き手への直接的な語りかけを、自然で格調ある現代日本語で示した。
- source_word: ὃς ἂν εἴπῃ
  choice: だれでも…と言い
  rationale: 関係代名詞とἄνを伴う接続法が表す不定・一般的条件を「だれでも」で表した。
- source_word: τῷ ὄρει τούτῳ
  choice: この山に向かって
  rationale: 指示詞の臨場感を保ち、発話の対象である与格を自然な日本語にした。
- source_word: Ἄρθητι
  choice: 持ち上げられて
  rationale: αἴρωの受動命令形を保ち、山が元の場所から上げられる具体的な像を示した。「取り除かれよ」よりも、続く「投げ込まれよ」との動作的な連続が明瞭である。
- source_word: βλήθητι εἰς τὴν θάλασσαν
  choice: 海に投げ込まれよ
  rationale: 受動命令形と方向を表すεἰςを明確に保ち、誇張的で鮮明な像を自然な日本語で再現した。
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心の中で疑わず
  rationale: この文脈でのδιακρίνωの内面的な疑い・ためらいを明瞭に表しつつ、καρδίαを「心」として保持した。内的分裂の含意は脚注に示した。
- source_word: ἀλλὰ πιστεύῃ
  choice: …と信じるなら
  rationale: 対照を日本語の条件構文の流れに組み込み、πιστεύωを基本的な「信じる」で訳した。
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: 自分の言っていることが起こっていると
  rationale: γίνεταιの現在時制を安易に未来へ置き換えず、「起こっている」として保持した。λαλεῖの主語との対応は「自分の」で明示した。別の自然な時制理解は脚注に残した。
- source_word: ἔσται αὐτῷ
  choice: その人にはそのとおりになります
  rationale: 将来の結果を表すἔσταιと与格αὐτῷを保ちながら、結果の仕組みを過度に特定しない日本語とした。
theological_decisions:
- issue: 信仰に結び付けられた発言についての約束の性質
  choice: 疑わず信じることに結び付いた条件的な約束として、本文の強さをそのまま訳す。
  alternative: 単なる比喩に弱める、または無制限の願望実現の保証として明示する。
  rationale: 原文は山が海へ移されるという鮮烈な表現を用いるが、この節自体には後代の体系的な限定も、無制限性を説明する付加もない。翻訳でその緊張を解消しない。
- issue: αὐτοῦ／αὐτῷの代表的単数
  choice: 「自分」「その人」と単数の指示を保つ。
  alternative: 複数・包括表現へ一般化する。
  rationale: ギリシア語の男性単数は一般的な代表者を指す。日本語では不自然な性別指定を加えず、単数性と一般性をともに保った。
- issue: γίνεταιの現在時制
  choice: 「起こっている」と現在の相を本文に保持する。
  alternative: 文脈上の将来的成就を前面に出して「起こる」とする。
  rationale: 後続の未来形ἔσταιとの時制上の張力は原文に存在するため、本文では現在形の特色を残し、可能な別訳を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な言明にふさわしい品位を保った。命令の引用には「よ」を用いて力強さを示した。脚注記号[a][b]は該当箇所の直後に置いた。
