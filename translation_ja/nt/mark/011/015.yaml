  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: ja
  text: 彼らはエルサレムに着いた。イエスは神殿[a]に入ると、神殿で売る人々と買う人々を追い出し始め、両替人の台や、鳩を売る人々の腰掛けをひっくり返した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神殿の境内」「神殿域」。原語は内側の聖所だけでなく、より広い神殿の敷地全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: 着いた
  rationale: 歴史的現在を、日本語の自然な物語叙述に合わせて過去形で表した。単なる移動より到着の意味が文脈に適する。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 日本語で定着している地名表記。
- source_word: εἰσελθὼν
  choice: 入ると
  rationale: 主動作に先立つ分詞の関係を簡潔で自然な日本語にした。厳密な時間間隔までは付加しない。
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: 神殿
  rationale: ἱερόνは内陣に限定されず神殿域全体を指す。本文では簡潔な定訳を用い、空間的範囲を脚注で明示する。
- source_word: ἤρξατο ἐκβάλλειν
  choice: 追い出し始め
  rationale: 開始を表す構文と、ἐκβάλλωの強い排除の動作をともに保持した。
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: 売り買いしている人々
  rationale: 売る者と買う者の双方を含めつつ、日本語で冗長にならない自然な並列表現とした。
- source_word: κολλυβιστῶν
  choice: 両替人
  rationale: 神殿域で貨幣を交換する者を指す、明瞭で定着した訳語。
- source_word: τραπέζας
  choice: 台
  rationale: 両替業務に使う卓を自然に示し、「机」より場面に適した語を選んだ。
- source_word: καθέδρας
  choice: 腰掛け
  rationale: 形状を椅子や長椅子に限定せず、座るための物を自然に表す。
- source_word: περιστερὰς
  choice: 鳩
  rationale: 犠牲に用いられる鳥を指す文脈に合う、日本語の標準的な訳語。
- source_word: κατέστρεψεν
  choice: ひっくり返した
  rationale: 台と腰掛けを転倒させる力強い動作を、現代日本語で明瞭かつ具体的に表した。
theological_decisions:
- issue: 神殿清めの記事におけるἱερόνの範囲
  choice: 本文では「神殿」とし、神殿域全体を指すことを脚注で説明する。
  alternative: 神殿の境内／神殿域
  rationale: 原語は聖所・内陣そのものではなく、境内を含む広い神殿複合施設を指す。親しみやすい本文表現を保ちながら、誤解を脚注で防ぐ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「一行」で複数主語からイエス個人への移行を自然に示し、動作の力強さと原文の開始相を保持した。
