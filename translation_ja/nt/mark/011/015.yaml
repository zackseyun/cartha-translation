revisions:
- from: 一行はエルサレムに着いた。イエスは神殿[a]に入ると、神殿の中で売り買いしている人々を追い出し始め、両替人の台や、鳩を売る人々の腰掛けをひっくり返した。
  to: 彼らはエルサレムに着いた。イエスは神殿[a]に入ると、神殿で売る人々と買う人々を追い出し始め、両替人の台や、鳩を売る人々の腰掛けをひっくり返した。
  rationale: 原文の複数主語を「彼らは」と直接に表し、売る者と買う者を明確に区別した。また、ἱερόνの広い範囲を本文で不必要に建物内部へ限定しないよう「神殿で」とした。開始相を示す「追い出し始め」、両替人、鳩、台、腰掛け、転倒の動作、およびἱερόνについての脚注は保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:34:56Z'
