  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: ja
  text: 彼らは子ろばをイエスのもとに連れて来て、自分たちの上着をその上に掛けた。イエスはそれに乗った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: 子ろば
  rationale: 語自体は若い家畜を指し得るが、直前の文脈（マルコ11:2）で示されるろば科の動物として自然かつ明確に訳した。
- source_word: ἐπιβάλλουσιν
  choice: 掛けた
  rationale: 衣を動物の背に載せる動作を現代日本語で自然に表す。原語の動作性は保ちつつ、「投げつけた」という不必要に激しい含意を避けた。
- source_word: ἱμάτια
  choice: 上着
  rationale: 外衣を指す文脈に即し、一般読者に明瞭な語を選んだ。
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: それに乗られた
  rationale: 直訳的な「その上に座った」より、乗用動物にまたがる意味を自然な日本語で示した。
