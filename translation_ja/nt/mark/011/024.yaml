  terminology: 「信じなさい」「受けた」は適切である。「すでに」はアオリストを機械的に完了時制化するのではなく、この文脈の逆説的な完了の含みを日本語で伝えるため許容される。「あなたがたのものとなります」は、願いが実現するという含意を保ちつつ、原文の与格表現をより直接的に反映する。
