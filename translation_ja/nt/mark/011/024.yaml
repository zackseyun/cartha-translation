  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: ja
  text: だから、あなたがたに言います。祈り求めるものは何でも、すでに受けた[a]と信じなさい。そうすれば、それはあなたがたのものとなります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本には「受ける」とあります。ここでは、「受けた」とする本文に従っています。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 直前の信仰についての教えを受ける因果・推論のつながりを、自然な現代日本語で示す。
- source_word: πάντα ὅσα προσεύχεσθε καὶ αἰτεῖσθε
  choice: 祈り求めるものは何でも
  rationale: 二つの動詞を日本語として自然な複合表現にしつつ、祈りの中で願い求めることと、πάντα ὅσα の包括性を保つ。
- source_word: πιστεύετε
  choice: 信じなさい
  rationale: 後続する内容節を受ける命令として、明確で標準的な訳語を採用する。
- source_word: ἐλάβετε
  choice: すでに受けた
  rationale: アオリストの完了した行為という際立った時間的感覚を示し、後続の未来表現との緊張を保つ。
- source_word: ἔσται ὑμῖν
  choice: そのとおりになります
  rationale: 直訳的な『あなたがたのものになる』より自然で、祈り求めたことが実現するという文意を表す。所有に限定せず、願いの内容が事柄である場合にも対応する。
theological_decisions:
- issue: 祈りが聞かれることと信仰の時間的関係
  choice: 『すでに受けたと信じなさい。そうすれば、そのとおりになります』として、完了した受領と将来の実現の逆説的な順序を保持する。
  alternative: 『受けると信じなさい』
  rationale: 採用本文の ἐλάβετε はアオリストであり、現在形に平準化せず、特定の祈祷論へ解消することなく原文の神学的緊張を残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。『祈り求める』は聖書文体として広く理解でき、二つのギリシア語動詞を簡潔に反映する。
