  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: ja
  text: 神が、罪を犯した御使いたちを容赦せず、タルタロスに投げ込み[a]、暗黒の鎖につなぎ、裁きのために保たれるように引き渡したのなら[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地獄に投げ込み」。ギリシア語の動詞は、特にタルタロスへ投げ込むことを意味するため、本文ではその語を残した。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「暗黒の鎖」ではなく「暗黒の穴」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: 容赦せず
  rationale: 裁きの文脈における「罰を差し控える、助命する」という意味を、簡潔で自然な現代日本語で表す。
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: 罪を犯した御使いたち
  rationale: アオリスト分詞が示す罪の出来事を自然な連体節で表し、「罪ある」という恒常的性質への一般化を避ける。
- source_word: ταρταρώσας
  choice: タルタロスに投げ込み
  rationale: ταρταρόωが固有に喚起するタルタロスへの投下という表象を保ち、より一般的で後代の含意を帯びやすい「地獄」に置き換えない。
- source_word: σειραῖς ζόφου
  choice: 暗黒の鎖につないで
  rationale: σειράを「鎖」、ζόφοςを重く陰鬱な闇を表す「暗黒」とし、与格の機能は拘束の手段として自然に表現する一方、比喩か実体かは断定しない。
- source_word: παρέδωκεν
  choice: 引き渡し
  rationale: 拘禁と将来の裁きが続く司法的文脈に即して、監 custody へ渡す意味を表す。
- source_word: εἰς κρίσιν
  choice: 裁きに備えて
  rationale: 将来の裁きに向けた拘束という方向性を表し、「有罪判決」まで意味を狭めない。
- source_word: τηρουμένους
  choice: 拘束しておかれた
  rationale: 現在受動分詞の継続的な保留・拘禁の状態を、日本語の「ておく」を用いて表す。
- source_word: Εἰ γὰρ
  choice: 神が……されたのなら
  rationale: 後続節へ続く修辞的条件文を保つ。単独節として不自然な「というのは」を避けつつ、本節が文の前件であることを示す。
theological_decisions:
- issue: ταρταρώσαςを後代の地獄概念で一般化するか
  choice: タルタロスに投げ込み
  alternative: 地獄に投げ込み
  rationale: 希少なギリシア語動詞が示す固有の表象を保持し、本文が明示しない後代の教理的同一視を持ち込まない。
- issue: 「暗黒の鎖」と拘束の関係
  choice: 暗黒の鎖につないで引き渡し、裁きに備えて拘束しておかれた
  alternative: 暗黒の鎖の中へ引き渡し、裁きまで保たれた
  rationale: 圧縮されたギリシア語構文の拘束・引き渡し・将来の裁きという要素をすべて残し、鎖が文字どおりか比喩的かは決定しない。
- issue: Εἰで始まる前件の扱い
  choice: ……されたのなら、
  alternative: 実際、神は……されたのですから、
  rationale: 修辞的には事実を前提とする条件文であっても、原文の条件形式を消さず、次節以降へ続く構文を保持する。
translation_notes:
  register: 明快な現代標準語を用いながら、裁きの場面にふさわしい荘重さを保った。「御使い」は聖書文体として広く理解される語を採用し、「タルタロス」は脚注で説明する。節末は後続する条件文の帰結へつながるため読点で閉じた。
