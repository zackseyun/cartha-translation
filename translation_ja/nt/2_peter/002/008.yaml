id: 2PE.2.8
reference: 2 Peter 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: ja
  text: というのも、その正しい人は彼らの間に住みながら、日々、見聞きする彼らの不法な行いによって、自分の正しい魂を苦しめていたからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: 見聞きして
  rationale: 二つの与格が表す視覚・聴覚による経験を、現代日本語で自然な「見聞きして」とした。文頭に置かれた原文の強調は語順では再現しにくいため、脚注で構文上の幅を示す。
- source_word: ὁ δίκαιος
  choice: その正しい人
  rationale: 定冠詞付き形容詞の名詞的用法で、前節のロトを指す。「その」により前方照応を明確にした。
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: 彼らの間に住み
  rationale: 彼らのただ中に継続して居住していたことを、簡潔で自然な日本語で表した。
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: 日々
  rationale: 反復し継続する意味を、明瞭かつ簡潔に表す。
- source_word: ψυχὴν δικαίαν
  choice: 自分の正しい魂
  rationale: ψυχήを内なる自己・いのちを指す語として、解釈を狭めず「魂」と訳した。主語との再帰関係を示すため「自分の」を補った。また、原文における「正しい」の反復を保持した。
- source_word: ἀνόμοις ἔργοις
  choice: 彼らの不法な行い
  rationale: 道徳的・法的含意を持つἄνομοςを「不法な」とし、ἔργαを自然な「行い」とした。「彼らの」は文脈から補った。
- source_word: ἐβασάνιζεν
  choice: 苦しめていた
  rationale: 未完了過去の継続性と能動態を保つ。「悩んでいた」より強い苦痛を示しつつ、「責めさいなんでいた」ほど意図的な自己処罰を連想させない表現とした。
theological_decisions:
- issue: ψυχήが示す人間理解
  choice: 「魂」と訳すが、身体から切り離された実体についての教理的断定とはしない
  alternative: 「心」「内なる自分」
  rationale: ここではロトの内面的・道徳的苦悩が焦点であり、人間の構成について体系的に述べてはいない。語の直接性と伝統的な聖書語彙を保ちながら、特定の人間論を持ち込まない。
- issue: ἐβασάνιζενの能動態と再帰的意味
  choice: 「自分の正しい魂を苦しめていた」と能動的に訳す
  alternative: 「正しい魂を苦しめられていた」
  rationale: 原文の能動態と目的語を保持する一方、ロトが意図的に自己を罰したとは断定しない。苦しみの原因は周囲の不法な行いを見聞きすることにある。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「正しい」の反復と「魂」という原文上重要な語を保持した。「見聞きして」によって日本語としての自然さを確保し、原文の二つの与格句の関係と能動態に伴う曖昧さは脚注で示した。
