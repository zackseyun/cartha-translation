id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: ja
  text: 彼らはまっすぐな道を捨て、ボソル[a]の子バラムの道に従って迷い出ました。バラムは不義の報酬を愛したのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ボソル」はギリシア語本文の形です。旧約聖書では、バラムは通常「ベオルの子」と呼ばれています。
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: 捨て
  rationale: 主動詞に先立つ離脱を示すアオリスト分詞。単なる「離れ」よりも、正しい道を意図的に放棄した含意を自然に表す。
- source_word: εὐθεῖαν ὁδὸν
  choice: まっすぐな道
  rationale: 「道」という具体的な比喩と、εὐθύςの「まっすぐな」という像を保つ。「正しい道」より原文の比喩に近い。
- source_word: ἐπλανήθησαν
  choice: 迷い出ました
  rationale: 外部の行為者を明示せず、道を外れて誤った方向へ進んだという道徳的・宗教的意味を表す。
- source_word: ἐξακολουθήσαντες
  choice: 従って
  rationale: バラムの道を追随したことを表す。日本語では分詞を独立した完了表現にせず、主動詞との密接な関係を自然に示す。
- source_word: τῇ ὁδῷ τοῦ Βαλαὰμ
  choice: バラムの道
  rationale: 前半の「道」と対応させ、道徳的な歩みという比喩を保持する。
- source_word: τοῦ Βοσὸρ
  choice: ボソルの子
  rationale: ギリシア語本文の固有名Βοσόρを音写し、反復する属格を父子関係として自然な日本語にする。
- source_word: μισθὸν ἀδικίας
  choice: 不義の報酬
  rationale: 不正な行いによって得る対価という意味を保ちつつ、現代日本語として通じる聖書的表現とした。
- source_word: ἠγάπησεν
  choice: 愛した
  rationale: ἀγαπάωを解釈的に弱めず直接反映し、利益への強い執着を表す。
theological_decisions:
- issue: εὐθεῖαν ὁδὸν／τῇ ὁδῷの道の比喩
  choice: 「まっすぐな道」「バラムの道」と訳し、道の比喩を保持する。
  alternative: 「正しい生き方」「バラムの行い」
  rationale: 原文が対照させる二つの「道」を残し、倫理的内容を説明しすぎないため。
- issue: ἐξακολουθήσαντεςとἐπλανήθησανの関係
  choice: 「バラムの道に従って迷い出ました」とし、追随と迷いの密接な関係を示す。
  alternative: 「迷い出て、バラムの道に従いました」
  rationale: アオリスト分詞の厳密な時間・論理関係には幅があるが、後者を単純な後続行為として固定せず、自然な日本語で両行為を結び付ける。
- issue: Βοσόρの同定
  choice: 本文ではギリシア語形に基づき「ボソル」とする。
  alternative: 「ベオル」
  rationale: 原語本文を優先しつつ、旧約で一般的な名は脚注で示して読者の照合を助ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「まっすぐな道」「不義の報酬」「愛した」により原文の道徳的比喩と厳粛さを保った。脚注記号は、説明対象である「ボソル」と節全体の読みを妨げないよう文末に置いた。
