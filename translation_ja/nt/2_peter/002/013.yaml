  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: ja
  text: 彼らは、不義を行った報いとして、害を受けるのです[a]。昼間から享楽にふけることを快楽とみなしています。彼らは、しみや傷のような者です。あなたがたと食事を共にしながら、自分たちの欺きにふけっています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不義の報いを受ける」。
    reason: ἀδικούμενοιは文脈上、害・損失を被るという応報の意味を帯び、μισθὸν ἀδικίαςは不義に対する報いを指す。
  - marker: b
    text: 写本によっては「欺き」の代わりに「愛餐」とあり、「あなたがたと食事を共にしながら、自分たちの愛餐にふけっています」となる。
    reason: SBLGNT本文のἀπάταις（欺き）に対し、ἀγάπαις（愛餐）という重要な異読があるため。
lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: 不義の報酬として害を受けます
  rationale: ἀδικέωとἀδικίαの語の響きを「害」と「不義」で可能な限り示しつつ、分詞を文脈上の応報として表した。単に他者から不当に扱われるという意味に限定しない。
- source_word: ἡδονὴν ἡγούμενοι
  choice: 楽しみと考えている
  rationale: ἡγέομαιの「～と見なす」と、ἡδονήの「楽しみ、快楽」を、自然な現代日本語で表した。
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: 昼間からぜいたくにふけること
  rationale: τρυφήが示す放縦なぜいたくと、ἐν ἡμέρᾳが暗示する公然たる厚かましさを保持した。「昼間から」により日本語でその含みを自然に示した。
- source_word: σπίλοι καὶ μῶμοι
  choice: しみであり、傷です
  rationale: 道徳的な汚れや欠陥を示す対句的比喩を保った。日本語として理解しやすく、純潔との対照も残る。
- source_word: ἐντρυφῶντες
  choice: ふけっています
  rationale: 自制なく楽しみ、ぜいたくに浸る継続的な態度を表す。前半のτρυφήとの語義的なつながりも保つ。
- source_word: ἐν ταῖς ἀπάταις αὐτῶν
  choice: 自分たちの欺きに
  rationale: SBLGNT本文のἀπάταιςを採り、偽りや欺瞞を表した。再帰的な所有関係は「自分たちの」で明確にした。
- source_word: συνευωχούμενοι ὑμῖν
  choice: あなたがたと宴席を共にしながら
  rationale: 共に食事や宴をする意味と、同時進行を示す分詞の働きを保った。食事の種類は本文で限定していない。
theological_decisions:
- issue: ἀδικούμενοιの解釈
  choice: 応報として「害を受けます」
  alternative: 「不当に扱われます」または「報いを受けます」
  rationale: 受動形だけなら「不当に扱われる」も可能だが、μισθὸν ἀδικίαςとの結び付きと裁きの文脈は、自らの不義に対する損害・罰を受ける意味を支持する。「報いを受ける」だけではἀδικέωの害の要素が薄れるため本文では採らなかった。
- issue: ἀπάταις / ἀγάπαιςの異読
  choice: SBLGNTのἀπάταιςを「欺き」と訳す
  alternative: ἀγάπαιςを「愛餐」と訳す
  rationale: 指定された原文はἀπάταιςであり、偽教師の欺瞞という文脈にも合う。一方、共同体の食事を指し得るἀγάπαιςは解釈上重要な異読なので脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、裁きの厳粛さにふさわしい品位を保った。「しみ」「傷」の比喩は平易さを優先して漢字にせず、「宴席を共にする」は共同の食事という社会的場面を過度に宗教儀礼化しない表現とした。
