id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: ja
  text: というのも、主であり救い主であるイエス・キリストを知ることによってこの世の汚れから逃れた人たちが、再びそれらに絡み取られ、それらに打ち負かされるなら、その人たちにとって後の状態は初めの状態より悪くなっているからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: 逃れたのに
  rationale: アオリスト分詞の先行する出来事を表しつつ、後続の再転落との強い対照を自然な日本語で示す。
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: この世の汚れ
  rationale: μίασμαの道徳的・宗教的な汚染の意味を「汚れ」で保ち、κόσμοςは文脈上の領域を明瞭にするため「この世」とした。
- source_word: ἐν ἐπιγνώσει
  choice: 知ることによって
  rationale: ἐνの手段的用法を示す。ἐπίγνωσιςにあり得る十分・深い認識という含みを過度に限定せず、救済論上の結論も加えない。
- source_word: τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: 主であり救い主であるイエス・キリスト
  rationale: 二つの称号が同じ人物イエスにかかることを自然に示す。日本語では「キリスト」が称号由来の定着した標準表記であり、尊厳ある現代語として採用した。
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: 再びそれらに絡み取られて
  rationale: τούτοιςが先の「汚れ」を受ける指示を保ち、ἐμπλέκωの罠に巻き込まれる像を「絡み取られる」で伝える。
- source_word: ἡττῶνται
  choice: 負ける
  rationale: 打ち負かされ、支配される意味を簡明に表す。受動的意味は「絡み取られて」との連続でも明らかである。
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: 後の状態は、初めの状態よりも悪くなっている
  rationale: 字義的な「最後のもの／初めのもの」を、ここで比較される状態として明示し、終末論的な意味を不必要に持ち込まない。完了形の結果状態も「なっている」で表した。
theological_decisions:
- issue: ἐπίγνωσιςが背教者の救済経験について何を意味するか
  choice: 「知ること」と訳し、その知識の救済論的性質を規定しない。
  alternative: 「救いに至る深い知識」または「外面的な知識」と限定する。
  rationale: 語そのものは、真の新生を伴う知識か単なる外面的認識かという論争を決着させないため、本文の緊張を保持する。
- issue: Χριστοῦの日本語表記
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号に由来するが、「イエス・キリスト」は現代日本語で自然かつ標準的であり、固有名詞化の度合いを本文以上に判定せずに原語を指し示せる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語条件文を日本語の論理順序に沿ってまとめ、「というのも……なら、……からです」で直前の文脈への理由提示を表した。原文にない「私たちの」は加えていない。
