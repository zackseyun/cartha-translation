source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: ja
  text: また、古代の世界を容赦せず、不敬虔な者たちの世界に洪水をもたらしたとき、義[b]を告げ知らせる者であったノアを八人目として[a]守ったのなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「八人目のノア」。この圧縮されたギリシア語表現は、「八人のうちの一人であるノア」、すなわちノアがほかの七人とともに守られたという意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「義」は「正義」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: 古代の世界
  rationale: 洪水以前の昔の世界を指す。時間的な隔たりを保ちつつ、現代日本語として明瞭である。
- source_word: οὐκ ἐφείσατο
  choice: 容赦せず
  rationale: 裁きの文脈における「見逃す、罰を免れさせる」という意味を簡潔に表す。
- source_word: ὄγδοον Νῶε
  choice: ノアを八人目として
  rationale: 圧縮されたギリシア語の序数表現を残す。ノアがほかの七人とともに守られたという理解は脚注で明示する。
- source_word: δικαιοσύνης κήρυκα
  choice: 義を告げ知らせる者
  rationale: κήρυξの公に告知する者という意味を自然な日本語で表し、δικαιοσύνηは文脈上の基本訳である「義」とした。
- source_word: ἐφύλαξεν
  choice: 守られた
  rationale: 洪水による裁きの中で無事に保ったことを表す。文脈上の神を主語とする敬意を込めた言い方である。
- source_word: κατακλυσμὸν
  choice: 洪水
  rationale: ノアの時代の大洪水を指す一般的で明瞭な訳語である。
- source_word: κόσμῳ ἀσεβῶν
  choice: 不敬虔な者たちの世界に
  rationale: 属格を、その世界を構成し特徴づける人々として表した。
- source_word: ἐπάξας
  choice: もたらしたとき
  rationale: 分詞と主動詞との時間的関係を、過度に限定せず自然な従属節で示す。
theological_decisions:
- issue: δικαιοσύνηの訳
  choice: 義
  alternative: 正義
  rationale: ノアが告げ知らせた神の正しい道や正しいあり方を広く含められる「義」を本文に採用し、司法的な含みを強調する「正義」は脚注に残した。
- issue: ὄγδοον Νῶεの解釈
  choice: ノアを八人目として
  alternative: 八人のうちの一人であるノアを
  rationale: 原文の序数表現を本文に保ちつつ、それがノアとほかの七人、計八人の保護を意味し得ることを脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後に続く条件文の一部であることを示すため、「また」と文末の「なら」を保持した。神という主語は原文同様に明示せず、敬語形で文脈上の主語を示した。
