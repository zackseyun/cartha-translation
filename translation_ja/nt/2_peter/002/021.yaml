id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: ja
  text: なぜなら、義の道[a]を知らなかったほうが、それを知った後で、彼らに伝えられた[c]聖なる戒めから引き返す[b]よりも、彼らにとってよかったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義にかなう生き方」とも訳せる。直訳は「義の道」。δικαιοσύνηは「正義」と訳すこともできるが、ここでは神の前で正しいことを指す「義」が文脈に合う。
    reason: lexical_alternative
  - marker: b
    text: 「後戻りする」、または「背を向ける」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「受け渡された」または「伝承された」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: なぜなら、……彼らにとってよかったからです
  rationale: γάρの説明・根拠を示す働きを「なぜなら……からです」で明示した。κρεῖττονとἦνは、過去の反実的な比較を自然な日本語の「よかった」で表した。
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: 知らなかった／それを知った後で
  rationale: 同じ動詞ἐπιγινώσκωの反復を「知る」で保った。「十分に知る」とすると接頭辞の意味を過度に強調するおそれがあるため避けた。二度目の目的語は文脈上「義の道」なので「それ」と補った。
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: 義の道
  rationale: ὁδόςの比喩的な「道、生き方」とδικαιοσύνηの倫理的・宗教的な「義」を簡潔に保持した。「正義」は可能だが、この文脈では社会的公正に意味を狭めるおそれがある。
- source_word: ὑποστρέψαι ἐκ
  choice: ……から引き返す
  rationale: ὑποστρέφωが表す逆方向への動きと、ἐκが示す離脱の両方を保った。「背を向ける」よりも原文の「戻る」方向性が明確である。
- source_word: παραδοθείσης αὐτοῖς
  choice: 自分たちに伝えられた
  rationale: παραδίδωμιの受動形を自然な日本語で表した。「委ねられた」は管理責任の含みを加えやすく、「受け継がれた」は伝承の歴史を強調しやすいため避けた。
- source_word: ἁγίας ἐντολῆς
  choice: 聖なる戒め
  rationale: 形容詞ἁγίαςの宗教的・道徳的重みと、単数形ἐντολῆςをそのまま保った。
theological_decisions:
- issue: この節を、救いを失う背教または最初から信仰がなかったことのどちらかに決着させるか
  choice: 「義の道を知った」ことと「聖なる戒めから引き返す」ことを原文どおり述べ、教理上の結論は訳文に加えない。
  alternative: 「救いから脱落した」または「表面的に触れただけだった」と解釈を補う。
  rationale: 原文は実際の認識とそこからの逆行を述べるが、救済論上の論争を直接には解決していない。したがって、その緊張を保った。
translation_notes:
  register: 明瞭で現代的ながらも聖書本文にふさわしい落ち着いた文体とした。長い比較構文は日本語で理解しやすい順序に組み替えたが、「知らなかったほう」と「知った後で引き返すよりも」の対比、原文の単数の「戒め」、および説明を示すγάρは保持した。
