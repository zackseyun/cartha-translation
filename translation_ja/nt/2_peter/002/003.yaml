  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: ja
  text: 彼らは貪欲に駆られ、作り上げた言葉であなたがたを食い物にします[a]。彼らに対する裁きは、はるか昔から、決して滞ることがなく、彼らの滅びも眠っていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたを商売の対象にします」。ギリシア語は、人々を利益のための商品同然に扱うことを表す商業上の比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: 貪欲に駆られ
  rationale: 偽教師たちの行動を支配する貪欲さと、その動機を自然な現代日本語で表す。
- source_word: πλαστοῖς λόγοις
  choice: 作り上げた言葉で
  rationale: πλαστόςの「こしらえた、捏造した」という意味を保ち、意図的に作られた教えや主張を示す。
- source_word: ἐμπορεύσονται
  choice: 食い物にします
  rationale: 人を利益のための商品同然に扱う商業的比喩を、明瞭で慣用的な日本語に移す。より字義的な意味は脚注に示す。
- source_word: κρίμα
  choice: 裁き
  rationale: 判決とそれに伴う処罰の両面を含み得る広さを保つ。
- source_word: ἔκπαλαι
  choice: 昔からの
  rationale: その裁きがはるか以前から定まっているという時間的意味を簡潔に表す。
- source_word: οὐκ ἀργεῖ
  choice: 働きを止めておらず
  rationale: ἀργέωの「怠ける、活動しない」という意味を保ちつつ、裁きが無力でも休止中でもないことを自然に表す。
- source_word: ἀπώλεια
  choice: 滅び
  rationale: 破滅を明確に伝えながら、その仕組みや最終的性質を本文以上に限定しない。
- source_word: οὐ νυστάζει
  choice: 眠っていません
  rationale: 滅びを擬人化する原文の鮮明な表現を保持する。
theological_decisions:
- issue: 告げられている処罰の性質
  choice: 偽教師たちに対する確実な裁きと滅びとして、そのまま訳す。
  alternative: 「滅び」を消滅、または最終的裁きとは別の一時的破綻に限定して解釈する。
  rationale: この節は裁きの確実性を告げるが、処罰の仕組みや期間までは定義していないため、特定の教理体系に決め込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「裁き」と「滅び」の厳粛さ、および後半の擬人表現を保持した。「食い物にする」は口語性があるものの、搾取と商業的比喩を一般読者に端的に伝える慣用表現として採用した。
