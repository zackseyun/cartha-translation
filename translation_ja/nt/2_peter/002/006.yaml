id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: ja
  text: また、ソドムとゴモラの町々を灰にして滅びに定め[a]、後に不敬虔な者となる人々[b]への例としたのであれば、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「町々を灰にし、破滅の宣告を下して」。
    reason: καταστροφῇ と κατέκρινεν の関係、および司法的な語感を別の形で示す。
  - marker: b
    text: 別訳「将来の不敬虔な者たち」。
    reason: μελλόντων ἀσεβέσιν を、将来の人々を指す表現として取ることもできる。
lexical_decisions:
- source_word: τεφρώσας
  choice: 灰にして
  rationale: 単に焼くことではなく、灰にするという結果まで含む語義を、簡潔で自然な日本語で表した。
- source_word: καταστροφῇ κατέκρινεν
  choice: 滅びに定め
  rationale: κατέκρινεν の司法的な「有罪とする、宣告する」という力と、与格 καταστροφῇ が示す宣告の結果を合わせて表した。
- source_word: ὑπόδειγμα
  choice: 例
  rationale: 文脈上は警告となる例だが、訳文では語そのものの幅を保ち、警告の意味を過度に明示しなかった。
- source_word: μελλόντων ἀσεβέσιν
  choice: 後に不敬虔な者となる人々
  rationale: μέλλω の将来性と、実体詞的な ἀσεβέσιν の人格的指示を保った。
- source_word: τεθεικώς
  choice: 例とされた
  rationale: τίθημι の「据える、定める」と完了分詞の結果状態を、日本語として自然な受身表現で示した。
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: ソドムとゴモラの町々
  rationale: 原文の複数形 πόλεις と固有名詞の属格構文を保った。
theological_decisions:
- issue: 文脈から補われる行為者
  choice: 日本語では主語を明示しない
  alternative: 神は／主は
  rationale: 原文でもこの節内には主語の名詞や称号がなく、前後の文脈から理解される。日本語の主語省略により、その連続性を自然に保った。
- issue: ἀσεβέσιν の意味
  choice: 不敬虔な者となる人々
  alternative: 神を敬わない者たち／不信心な者たち
  rationale: 神への畏敬を欠くという宗教的・倫理的含意を保ちつつ、特定の教派的解釈を加えない表現とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい端正な文体とした。前後に続く条件節の一部なので、末尾は「のであれば、」として統語的な連続性を保った。「不敬虔」は日常語よりやや文語的だが、ἀσεβής の宗教的・倫理的含意を簡潔に伝える標準的な語として採用した。
