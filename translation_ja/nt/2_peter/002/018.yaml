id: 2PE.2.18
reference: 2 Peter 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: ja
  text: 彼らは、むなしい大言壮語を口にし、肉の欲望と放縦によって[a]、誤りの中で生きる者たちからかろうじて逃れつつある人々[b]を誘惑するからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「肉の欲望、すなわち放縦によって」。原文では「肉の欲望」と「放縦」の関係を、並列とも説明的な同格とも取れます。
    reason: syntactical_ambiguity
  - marker: b
    text: 「かろうじて」の語は、「つい最近」とも理解できます。その場合は「誤りの中で生きる者たちから、つい最近逃れつつある人々」となります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: むなしい大言壮語
  rationale: ὑπέρογκαは度を越して大げさな発言を、ματαιότητοςはその内容の空虚さを表す。「むなしい大言壮語」は両方の要素を簡潔で自然な日本語にする。
- source_word: φθεγγόμενοι
  choice: 口にし
  rationale: 発言することを表す分詞。文脈上、「口にし」が現代日本語として自然で、後続する誘惑の手段・あり方も示せる。
- source_word: δελεάζουσιν
  choice: 誘惑する
  rationale: 餌でおびき寄せるように誘う語であり、ここでは道徳的な誘惑を明確に表す。
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: 肉の欲望によって
  rationale: ἐνを手段として訳し、σάρξの比喩を「肉」として保持する。「罪深い性質」などの解釈的な言い換えは避ける。
- source_word: ἀσελγείαις
  choice: 放縦
  rationale: 節度を捨てたみだらな振る舞いを指す。「放縦」は性的・道徳的な無節制を含みつつ、語義を過度に限定しない。
- source_word: ὀλίγως
  choice: かろうじて
  rationale: 逃れつつある人々の危うい状態を表す主要な理解を本文に採用する。ただし「つい最近」の時間的意味も可能なので脚注に示す。
- source_word: ἀποφεύγοντας
  choice: 逃れつつある
  rationale: 現在分詞の進行中の意味を保ち、逃避が完了したと断定しない。
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: 迷いの中で生きる者たち
  rationale: ἀναστρέφομαιが生活態度・生き方を表すことを自然に示し、πλάνηを「迷い」と訳して誤りや惑わしを含む幅を残す。
theological_decisions:
- issue: 道徳的文脈におけるσάρξ
  choice: 「肉」と訳し、原文の比喩を保持する。
  alternative: 「罪深い性質」または「肉的な」
  rationale: 文脈は欲望による道徳的誘惑を語るが、「罪深い性質」とすると体系的な解釈を加えすぎる。「肉の欲望」は原語の神学的緊張を残す。
- issue: 誘惑される人々の状態
  choice: 迷いの中で生きる者たちから「かろうじて逃れつつある」人々とする。
  alternative: すでに完全に逃れた人々、または迷いそのものから逃れつつある人々
  rationale: 構文上、逃れる相手は「迷いの中で生きる者たち」と取るのが自然である。現在分詞とὀλίγωςを反映し、その逃避が完了しているか、救済論的に何を意味するかは断定しない。
- issue: ἐπιθυμίαις σαρκὸςとἀσελγείαιςの関係
  choice: 「肉の欲望と放縦によって」と並列的に訳す。
  alternative: 「肉の欲望、すなわち放縦によって」または「放縦の中で肉の欲望によって」
  rationale: 接続詞のない二つの与格の関係には、並列・同格・状況説明の余地がある。本文は読みやすい並列形とし、別の統語的理解を脚注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「大言壮語」「放縦」によって原文の厳粛で非難的な調子を保った。「逃れつつある」として進行中の状態を明示し、救いの完成を本文で決めつけない。
