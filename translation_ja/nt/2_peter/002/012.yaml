id: 2PE.2.12
reference: 2 Peter 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: ja
  text: しかし、この者たちは、捕らえられ、滅ぼされるために生まれた、本能に従う理性のない動物[a]のように、自分たちが知らない事柄について冒瀆の言葉を語り[b]、自分たちの滅びの中で、自らも滅ぼされます[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「理性のない動物」は、「物事をわきまえない動物」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「冒瀆の言葉を語り」は、「悪しざまに言い」または「そしり」とも訳せる。ギリシア語は、その対象をここでは明示していない。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は、「滅び」と「滅ぼされる」に当たる同根語を繰り返している。これらの語には「腐敗」「朽ちる」という含みもある。
    reason: wordplay_and_ambiguity
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: 理性のない動物
  rationale: ἄλογα はここでは、単に言葉を話さないというより、理性的判断を欠くことを表す。「理性のない動物」は比較の厳しさを保ちつつ、現代日本語として明瞭である。
- source_word: γεγεννημένα φυσικὰ
  choice: 本能のままに生きる……生まれた
  rationale: 圧縮されたギリシア語表現を、「生まれた」で γεγεννημένα の誕生の像を保ち、「本能のままに生きる」で φυσικά の、生来の性質・衝動に従う意味を自然な日本語で表した。
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: 捕らえられ、滅ぼされるために
  rationale: εἰς の目的・結果の含みを「ために」で示し、ἅλωσις と φθορά を動物が捕獲されて滅ぼされる比喩として明確にした。
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: 自分たちが知らない事柄を
  rationale: 中性複数の関係代名詞を「事柄」とし、対象を本文以上に限定しない。「知らない」は知識不足と理解不足の両方を自然に含みうる。
- source_word: βλασφημοῦντες
  choice: 冒瀆し
  rationale: この語は悪しざまに言う、そしるという意味も持つが、ここでは強い不敬な発言を表す語として「冒瀆」を採用し、その対象は特定しなかった。
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: その滅びの中で、自らも滅ぼされる
  rationale: φθορά と同根の φθαρήσονται の反復を「滅び／滅ぼされる」で再現した。「も」は καί を反映し、動物の運命との対応を示す。
theological_decisions:
- issue: βλασφημοῦντες の対象と強さ
  choice: 「冒瀆する」と訳し、何を冒瀆するのかは特定しない。
  alternative: 「悪しざまに言う」「そしる」
  rationale: 語の強い不敬の含みを保ちながら、対象が天的存在か聖なる事柄かなどを本文だけで決めないため。
- issue: φθορά／φθαρήσονται の意味
  choice: 裁きによる「滅び／滅ぼされる」と訳す。
  alternative: 「腐敗／朽ちる」「破滅／滅びる」
  rationale: 直前の捕獲されて滅ぼされる動物の像に最もよく合う一方、同根語の反復も保持できる。ただし語自体には腐敗・朽敗の意味もあるため、脚注で含みを示した。
- issue: 動物との比較が示す範囲
  choice: 「この者たち」を動物そのものと同一視せず、「動物のようです」と比較として訳す。
  alternative: 「この者たちは……動物であり」
  rationale: ὡς の比較を明示し、比喩を必要以上に実体化しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、警告の厳粛さにふさわしい文体とした。「です／ます」調で一般読者への読みやすさを確保し、「冒瀆」「滅び」など本文の強い語調は弱めなかった。
