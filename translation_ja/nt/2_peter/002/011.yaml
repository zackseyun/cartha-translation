id: 2PE.2.11
reference: 2 Peter 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: ja
  text: それに対して、御使いたちは、力と権能においてさらに強大であるにもかかわらず、彼らに対する侮辱的な裁きを下しません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: それに対して
  rationale: 厳密な場所を示す「そこでは」よりも、前節の者たちの振る舞いと御使いたちを対比する文脈上の働きを、自然な現代日本語で表した。
- source_word: ἄγγελοι
  choice: 御使いたち
  rationale: ここでは人間の使者ではなく、天的存在を指す。聖書本文として明瞭で品位のある日本語を選んだ。
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: 力と権能において
  rationale: 近接する二語の重なりを保ちつつ、御使いたちが勝っている点を示す与格の働きを「において」で表した。
- source_word: μείζονες ὄντες
  choice: 彼らより勝っているのに
  rationale: 文脈上の譲歩的な意味を「のに」で示した。比較対象は後続の αὐτῶν と結び付けて自然に表したが、その正体は明示していない。
- source_word: οὐ φέρουσιν
  choice: 下しません
  rationale: κρίσιν との結び付きから、裁き・判定を持ち出す、または言い渡す意味。日本語では「裁きを下す」が自然である。
- source_word: κατ’ αὐτῶν
  choice: 彼らを
  rationale: 前節の「栄光ある者たち」を受ける可能性が高いが、原文同様、指示対象を「彼ら」とだけ表して特定を避けた。
- source_word: βλάσφημον
  choice: ののしるような
  rationale: 神への冒瀆だけに限定せず、侮辱的・中傷的・罵倒的な言葉という幅を、分かりやすい現代日本語で表した。
- source_word: κρίσιν
  choice: 裁き
  rationale: 告発や断罪を含み得る司法的な判断を広く表し、形容語との緊張を保持した。
theological_decisions:
- issue: αὐτῶν の指示対象
  choice: 本文では「彼ら」とし、明示的に特定しない。
  alternative: 堕落した天使、人間の高位者、または天上の栄光ある存在一般と特定する。
  rationale: 直前の「栄光ある者たち」を受けると考えられるが、その正体をこの節は明示していないため、教理的な特定を持ち込まない。
- issue: 「主の前で」に当たる句の本文採否
  choice: 本文に入れ、脚注で写本差を示す。
  alternative: SBLGNT本文どおり省き、「彼らをののしるような裁きを下しません」とする。
  rationale: SBLGNTの装置記号が示す重要な異読を読者に伝えるため。ただし指定されたSBLGNT本文にはこの句がないので、脚注で明確にし、原文証拠上の緊張を隠さない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「御使い」「権能」「裁き」によって聖書本文としての品位を保った。「彼ら」の指示対象は曖昧なまま残した。
