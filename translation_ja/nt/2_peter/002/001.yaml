id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: ja
  text: しかし、民の中には偽預言者も現れました。同じように、あなたがたの中にも偽教師が現れるでしょう。彼らは、滅びをもたらす異端[a]をひそかに持ち込み、自分たちを買い取った主人[b]さえ否んで、自らに速やかな滅びを招くでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「滅びをもたらす分派」。ギリシア語は党派や分派を指すこともありますが、ここでは滅びに至らせる教えや運動を指すと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「自分たちを贖った主」。ギリシア語は直訳すると「自分たちを買い取った主人」であり、買い取りの比喩を用いています。その意味や範囲をめぐる神学上の議論は、本文では決着させていません。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: 現れました
  rationale: 偽預言者が過去に民の中に出現したことを表すアオリストを、自然な現代日本語で示す。
- source_word: ψευδοπροφῆται
  choice: 偽預言者
  rationale: 複合名詞の意味を直接かつ明瞭に訳す。
- source_word: ἐν τῷ λαῷ
  choice: 民の中に
  rationale: 旧約の契約共同体が文脈上想定されるが、本文では原文どおり「民」とし、「イスラエル」と明示して限定しない。
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: 同じように、あなたがたの中にも……現れ
  rationale: 過去の偽預言者と、読者の共同体に将来現れる偽教師との対応関係を自然に示す。
- source_word: ψευδοδιδάσκαλοι
  choice: 偽教師
  rationale: 「偽預言者」との並行を保ちながら、語を直接訳す。
- source_word: παρεισάξουσιν
  choice: ひそかに持ち込みます
  rationale: 気づかれないように入り込ませるという動詞の含意と未来の行為を表す。
- source_word: αἱρέσεις ἀπωλείας
  choice: 滅びをもたらす異端
  rationale: 属格を結果的な意味に取り、誤った教えや運動が滅びに至らせることを示す。「分派」という語義の可能性は脚注に残す。
- source_word: τὸν ... δεσπότην
  choice: 主人
  rationale: δεσπότηςをκύριοςと区別し、支配権と所有関係を表す称号として訳す。
- source_word: ἀγοράσαντα αὐτοὺς
  choice: 自分たちを買い取った
  rationale: ἀγοράζωの購買の比喩を保持し、「贖った」として神学的解釈を本文に織り込まない。
- source_word: ἀρνούμενοι
  choice: 否み
  rationale: 主人との関係を拒絶するという強い意味を簡潔に表す。
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: 自らに速やかな滅びを招く
  rationale: 再帰的な意味と、滅びが急速に及ぶことを原文に沿って表す。
theological_decisions:
- issue: αἱρέσειςの文脈上の意味
  choice: 異端
  alternative: 分派、党派
  rationale: この箇所では、ひそかに持ち込まれ、主人を否むものと結びついているため、破壊的な教えが前景にある。ただし、語が集団・分派を指し得る曖昧さは脚注で保持する。
- issue: τὸν ἀγοράσαντα αὐτοὺς δεσπότηνの意味と神学的射程
  choice: 自分たちを買い取った主人
  alternative: 彼らを贖った主
  rationale: 原文の購買の比喩と、偽教師たちについて「買い取った」と述べる神学的緊張をそのまま残し、その範囲や性質を翻訳で決着させない。
- issue: δεσπότηςとκύριοςの区別
  choice: 主人
  alternative: 主、主権者
  rationale: ここで用いられるδεσπότηςを通常のκύριοςと同一の日本語にせず、権威と所有のニュアンスを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「異端」は一般読者にも通じるが語義の幅を脚注で補い、「主人」「買い取った」によって原文の語彙的区別と神学的緊張を保持した。
