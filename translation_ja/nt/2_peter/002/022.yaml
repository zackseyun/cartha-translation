source:
  edition: SBLGNT
  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: ja
  text: 彼らには、真実のことわざが言うとおりのことが起こりました。「犬は自分の吐いた物に戻る」[a]。また、「身を洗った雌豚は、泥の中でまた転げ回る」[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「犬は自分の吐いた物に戻る」は、箴言26章11節を踏まえた表現です。原文は直訳すると、「犬、自分の吐いた物に戻ったもの」となる省略を含む言い方です。
    reason: cross_reference
  - marker: b
    text: 原文では後半の有限動詞が省略されており、直訳すると「また、身を洗った雌豚、泥の中で転げ回ることへ」となります。ここでは格言として自然な形にするため、「また転げ回る」を補いました。
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: 彼らの身には…ことが起こっています
  rationale: 完了形が表す、すでに起きて現在も当てはまる状態を自然な現代日本語で示し、与格 αὐτοῖς を「彼らの身には」と表した。
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: あの真実なことわざのとおりのこと
  rationale: 省略を含むギリシア語を過度に字義化せず、ことわざの内容が彼らにおいて現実となったという意味を明らかにした。指示性を「あの」で表した。
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: 犬は自分の吐いた物に戻る
  rationale: 箴言26章11節を響かせる一般的な格言として自然に表し、ἴδιον の「自分の」を保持した。分詞構文の形式より、格言としての意味を優先した。
- source_word: Ὗς λουσαμένη
  choice: 体を洗った雌豚
  rationale: Ὗς の女性形を「雌豚」で保ち、λουσαμένη は中動・受動の厳密な判別を訳文で不要に固定せず、状態を表す「体を洗った」とした。
- source_word: εἰς κυλισμὸν βορβόρου
  choice: 泥の中を転げ回るために戻る
  rationale: κυλισμός の転がる・転げ回る像と βόρβορος の泥を具体的に保持した。原文で省略された動詞は、前句との並行関係に基づき補った。
theological_decisions:
- issue: 省略されたことわざの構文と、その適用範囲
  choice: ことわざに語られた内容が彼らの身に現実となったことを述べる
  alternative: 「真実なことわざの言葉が彼らに起こった」と形式的に訳す
  rationale: 原文の警告と再帰の比喩を保持しつつ、救済論などの教理的結論を本文以上に付け加えないため。
- issue: λουσαμένη の態
  choice: 「体を洗った」と訳し、自洗か他者による洗浄かを断定しない
  alternative: 「洗ってもらった」または「自分の体を洗った」
  rationale: 中動・受動の形が許す曖昧さを保ち、洗いの主体について神学的含意を持ち込まないため。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。格言の生々しい像は弱めず、「嘔吐物」より一般読者に自然な「吐いた物」、「泥沼」より原語の物質的な泥を示す「泥」を採用した。すべての脚注標識を本文中に配置した。
