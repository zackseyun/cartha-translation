  to: 彼らには、真実のことわざが言うとおりのことが起こりました。「犬は自分の吐いた物に戻る」[a]。また、「身を洗った雌豚は、泥の中でまた転げ回る」[b]。
  rationale: 冒頭を「真実のことわざが言うとおりのこと」として、τὸ τῆς ἀληθοῦς παροιμίας の省略的な構文を自然に表しました。「身を洗った」は λουσαμένη の中動態を反映します。後半は原文に有限動詞がないことを脚注で示しつつ、「ために」という目的の含意を除き、格言として自然な「泥の中でまた転げ回る」としました。
