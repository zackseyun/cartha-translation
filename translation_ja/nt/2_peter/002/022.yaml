    rationale: εἰς κυλισμὸν βορβόρου は「泥の中で転げ回ることへ」という省略的表現で、「ために」という目的・意図を明示していません。補われる動きは「また転げ回る」とするほうが自然で、解釈の付加も避けられます。
  - severity: low
