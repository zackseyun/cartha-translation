id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: ja
  text: しかし彼は、自分の不法な行いについて戒めを受けました。ものを言えない荷を運ぶ動物[a]が、人間の声で語り[b]、預言者の狂気を押しとどめたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「荷を負う動物」。民数記22章28～30節に登場するバラムのろばを指す。
    reason: cross_reference
  - marker: b
    text: または「人の声で」。ここでは、話すことのできない動物と人間との対比が示されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: とがめ
  rationale: 非難や叱責による是正を表す語であり、文脈に即した自然な日本語として「とがめる」を用いた。
- source_word: ἰδίας παρανομίας
  choice: 自分の不法な行い
  rationale: ἰδίαςによる本人の責任を明示し、παρανομίαの「法に背く行為」という強さを保った。
- source_word: ὑποζύγιον
  choice: 物を運ぶ動物
  rationale: 原文はロバを意味する固有的な語ではなく、くびきの下で荷を担う動物を指すため、広い意味を本文に残した。
- source_word: ἄφωνον
  choice: ものを言えない
  rationale: 単に音がないというより、言葉を話せない動物と人間の声との対比が明瞭になる自然な表現を選んだ。
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: 人間の声で
  rationale: 動物と人間の対比を示す句であり、性別を限定しない「人間」が適切である。
- source_word: φθεγξάμενον
  choice: 語り
  rationale: 文脈では明瞭な発話を意味するため、「音を出す」ではなく「語る」とした。
- source_word: ἐκώλυσεν
  choice: 押しとどめた
  rationale: 行為や進行を妨げて制止する意味を、過不足なく自然に表す。
- source_word: παραφρονίαν
  choice: 狂気
  rationale: 単なる愚かさより強い、不合理で常軌を逸した状態を表す原語の語勢を保持した。
- source_word: τοῦ προφήτου
  choice: その預言者の
  rationale: 属格の関係を自然に示し、直前まで念頭に置かれているバラムを預言者として指す原文を保った。
theological_decisions:
- issue: ὑποζύγιονを民数記22章の背景から「ろば」と特定するか
  choice: 本文では「物を運ぶ動物」とし、脚注でろばと明示する
  alternative: 本文を「ろば」と訳す
  rationale: 言及されているのは明らかにバラムのろばだが、ギリシア語本文はより一般的な語を用いているため、その語義範囲を本文で保持した。
- issue: ἐν ἀνθρώπου φωνῇのἀνθρώπουを性別限定的に訳すか
  choice: 「人間の声で」とする
  alternative: 「男の声で」とする
  rationale: ここでの対比は動物と人間との間にあり、男女の対比ではないため、「人間」が原意に即している。
- issue: παραφρονίανの強い表現を弱めるか
  choice: 「狂気」とする
  alternative: 「愚かさ」とする
  rationale: 原語は単なる判断ミスや愚行よりも強い不合理性を表すため、その神学的・修辞的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい端正さを保った。「ものを言えない動物」と「人間の声」の逆説的な対比、および「狂気」という原文の強い評価を維持した。
