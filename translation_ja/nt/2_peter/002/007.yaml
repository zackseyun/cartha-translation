id: 2PE.2.7
reference: 2 Peter 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: ja
  text: そして、不法な者たちの恥知らずな行いに苦しめられていた正しいロトを救い出されました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から続く一連の出来事を自然に結ぶ接続表現。
- source_word: δίκαιον
  choice: 正しい
  rationale: ロトに対する本文自身の道徳的評価を、そのまま明確に表す。現代日本語として「義なる」より自然である。
- source_word: Λὼτ
  choice: ロト
  rationale: 日本語聖書で定着している人名表記。
- source_word: καταπονούμενον
  choice: 苦しめられていた
  rationale: 現在受動分詞が示す継続的な圧迫と苦痛を、過度に限定せず自然な日本語で表す。
- source_word: ὑπὸ τῆς τῶν ἀθέσμων ... ἀναστροφῆς
  choice: 不法な者たちの…行いに
  rationale: 苦痛の原因を示すὑπόと、生活態度・振る舞いを表すἀναστροφήの構造を簡潔に保つ。
- source_word: τῶν ἀθέσμων
  choice: 不法な者たち
  rationale: 正しい秩序や規範を無視する者という道徳的・法的含意を保つ。
- source_word: ἐν ἀσελγείᾳ
  choice: 恥知らずな
  rationale: ἀσέλγειαが含む、抑制を捨てた厚顔で放縦な性質を示す。「好色な」では性的意味に狭めすぎるため避ける。
- source_word: ἐρρύσατο
  choice: 救い出されました
  rationale: 危険や苦境から救出するという動詞の力を明確に表す。主語は前文脈の神であり、敬語形で自然につなぐ。
theological_decisions:
- issue: 創世記の物語を踏まえたロトの道徳的評価
  choice: 「正しいロト」と明記する
  alternative: ロトへの評価を弱める、または省く
  rationale: 本文はδίκαιονによってロトを明示的に正しい者と評価しているため、他箇所との調和を図ってこの評価を弱めない。
- issue: ἀσέλγειαの意味範囲
  choice: 「恥知らずな」とし、放縦と厚顔さを表す
  alternative: 「好色な」「みだらな」として性的放縦に限定する
  rationale: 語は性的非行を含み得るが、それだけに限定されない。本文の幅と道徳的な強さを保つ。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書本文としての品位を保った。文は前後に続く構文の一部だが、日本語として読める形に整えた。敬体は「救い出されました」にのみ現れ、主語である神への敬意と周辺文脈への接続を想定している。
