id: 2PE.2.17
reference: 2 Peter 2:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: ja
  text: この者たちは、水のない泉、暴風に吹き流される霧[a]です。彼らのためには、暗黒の闇が取っておかれています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「暴風に吹き流される雲」とも訳されます。ギリシア語は、より厳密には「霧」または「靄」を意味します。
    reason: lexical_alternative
  - marker: b
    text: 「彼らのために、闇の暗黒が保たれています」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: 水のない泉
  rationale: πηγήは通常、掘った井戸ではなく泉や水源を指し、ἄνυδροςは「水のない」の意。水を与えるはずの泉に水がないという比喩の皮肉を保った。
- source_word: ὁμίχλαι
  choice: 霧
  rationale: ὁμίχληは主に霧や靄を表す。「雲」より原語に近く、つかみどころがなく流される像にも合う。日本語では集合的な「霧」が自然である。
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: 暴風に吹き流される
  rationale: λαῖλαψは激しい風を伴う嵐、ἐλαύνωは駆り立てる、押し流すことを表す。受動の力を保ちつつ、霧との自然な結び付きを考えて「吹き流される」とした。
- source_word: οἷς
  choice: 彼らのためには
  rationale: 関係代名詞は、直前の女性複数形の比喩ではなく、冒頭の「この者たち」、すなわち人々を指す。日本語でも人的指示を明示した。
- source_word: ὁ ζόφος τοῦ σκότους
  choice: 闇の暗黒
  rationale: ζόφοςとσκότοςという二つの暗さを表す語を残し、重く不吉な裁きの像を保った。単に「深い闇」として一語化せず、原文の強意的な二語構造を反映した。
- source_word: τετήρηται
  choice: 取っておかれています
  rationale: τηρέωの完了受動形で、すでに確保され、その状態が続いていることを示す。日本語でその継続的な結果を自然に表した。
theological_decisions:
- issue: 末尾の受動表現における裁きの主体
  choice: 主体を補わず、「取っておかれています」と受動形で訳す。
  alternative: 「神が取っておられます」と主体を明示する。
  rationale: 文脈上は神の裁きが含意されるが、ギリシア語本文は行為者を明記していないため、翻訳でも補わない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、裁きの場面にふさわしい重みを保った。「この者たち」で指示対象を明確にし、「水のない泉」と「暴風に吹き流される霧」という並列的な比喩を簡潔に示した。すべての注記記号を本文中に配置した。
