  source_fidelity: 本文は、ἐλευθερίαν（自由）、ἐπαγγελλόμενοι（約束しながら）、αὐτοὶ δοῦλοι（彼ら自身は奴隷）、φθορᾶς（腐敗）、および後半の一般原則をおおむね正確に伝えています。δοῦλοι／δεδούλωταιの強い隷属の対照も適切です。後半の「奴隷にもされている」は助詞「に」が欠け、日本語として統語的に不完全です。
  naturalness: 「そのものの奴隷にもされている」は不自然であり、「そのものの奴隷にもされている」ではなく「そのものの奴隷にもされている」とするには「奴隷に」の形が必要です。最小限の補正により、明瞭な現代標準日本語になります。
  terminology: 「自由」「奴隷」「腐敗」はいずれも適切です。「腐敗」はφθοράの道徳的・破滅的な含意を完全に限定せず、脚注もその意味の幅を適切に補っています。
