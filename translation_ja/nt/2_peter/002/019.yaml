    rationale: 「奴隷にされる」が必要な構文です。補正によりδεδούλωταιの受動的な隷属状態を保ちつつ、日本語として正しい文になります。
  revised_text: 彼らに自由を約束しながら、彼ら自身は腐敗[a]の奴隷です。人は何かに打ち負かされると、そのものの奴隷にもされているからです。
