  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: ja
  text: 彼らに自由を約束しながら、彼ら自身は腐敗[a]の奴隷です。人は何かに打ち負かされると、そのものの奴隷にもされているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「腐敗」は、「滅び」または「朽ち果てること」とも訳せる。原語は、道徳的な腐敗と破滅の両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: 自由
  rationale: 「自由」が現代日本語で最も自然であり、後半の「奴隷」との鮮明な対照も保つ。
- source_word: ἐπαγγελλόμενοι
  choice: 約束しながら
  rationale: 分詞の「約束する」という意味と、約束している最中の彼ら自身の状態との対照を表す。
- source_word: δοῦλοι
  choice: 奴隷
  rationale: 単なる奉仕者ではなく支配下に置かれた身分を指す。約束する「自由」と実際の隷属との皮肉を明確にする。
- source_word: φθορᾶς
  choice: 腐敗
  rationale: 道徳的な堕落と破滅・朽廃に至る性質の双方を含み得る語であり、本文では簡潔な「腐敗」とした。意味の幅は脚注に示す。
- source_word: ᾧ γάρ τις ἥττηται
  choice: 人は何かに打ち負かされると
  rationale: 不定代名詞 τιςによる一般原則と、完了受動形ἥττηταιの「打ち負かされ、その状態にある」という意味を自然な日本語で表す。
- source_word: τούτῳ καὶ δεδούλωται
  choice: そのものの奴隷にもされている
  rationale: 与格τούτῳが示す支配者との関係、καίの「も」、完了受動形が示す継続的な隷属状態を保つ。
theological_decisions:
- issue: 自由を約束する者たち自身がφθοράに隷属しているという対照
  choice: 「自由」と「腐敗の奴隷」を直接対照させる
  alternative: 「解放」と「腐敗に仕える者」
  rationale: δοῦλοιとδεδούλωταιの隷属表現を弱めず、偽りの自由と現実の支配という本文の緊張を保つ。
- issue: φθοράの意味領域
  choice: 本文を「腐敗」とし、破滅・朽廃の含意を脚注で示す
  alternative: 本文を「滅び」または「堕落」とする
  rationale: 一つの意味に限定せず、道徳的腐敗とその破滅的帰結の両方を読み得る原語の幅を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「奴隷」という強い語を保って原文の対照を再現した。「彼ら自身」によりαὐτοίの強調を示し、後半は一般原則として自然に読める形にした。
