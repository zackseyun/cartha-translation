id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: ja
  text: 主は、敬虔な人々を試練[a]から救い出し、一方、不義な者たちを処罰を受ける状態で裁きの日まで留めておくすべをご存じです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」とも訳せる。ギリシア語は、罪への誘惑と、試練・試みのどちらも意味し得る。ここでは、直前に語られた救出の例から「試練」とした。
    reason: lexical_alternative
  - marker: b
    text: 別訳「不義な者たちを、裁きの日に罰するために留めておく」。ギリシア語の分詞は、現在続いている処罰を表すとも、来るべき裁きに伴う処罰を表すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: 方法をご存じです
  rationale: 不定詞を伴う οἶδα の実際的な知識・能力を表す用法を、自然な現代日本語で示した。単なる知識ではなく、「どのように救い、留めるかを知っている」という意味を伝える。
- source_word: κύριος
  choice: 主
  rationale: 神を指す称号として、簡潔で定着した訳語を用いた。
- source_word: εὐσεβεῖς
  choice: 敬虔な人々
  rationale: 名詞的に用いられた形容詞であり、神への敬いと信心を特徴とする人々を指す。「敬虔な者たち」よりも一般読者に自然な表現とした。
- source_word: ἐκ πειρασμοῦ
  choice: 試練から
  rationale: πειρασμός には誘惑と試練・試みの両義があるが、直前のノアとロトが災いの中から救われた文脈には「試練」がよく合う。別義は脚注に残した。
- source_word: ῥύεσθαι
  choice: 救い出し
  rationale: 危険や苦境から助け出す意味を明確にし、文脈に即した自然な動詞とした。
- source_word: ἀδίκους
  choice: 不義な者たち
  rationale: 道徳的・法廷的な含意を保ち、「悪人」より原語の義／不義の対照を明確にした。
- source_word: κολαζομένους
  choice: 罰のもとに置いたまま
  rationale: 現在分詞が示し得る継続的な処罰状態を日本語で表した。同時に、終末の裁きに伴う処罰と取る可能性は脚注に示した。
- source_word: εἰς ἡμέραν κρίσεως
  choice: 裁きの日まで
  rationale: τηρεῖν と結びつく将来への時間的到達点として自然に訳した。「裁きの日のために」という目的・保留のニュアンスもあり得るため、関連する構文上の別解を脚注に残した。
- source_word: τηρεῖν
  choice: 留めておく
  rationale: 守る、保持する、拘束・保留するという広い意味のうち、この裁きの文脈に適する表現を選んだ。
theological_decisions:
- issue: πειρασμός の意味
  choice: 試練
  alternative: 誘惑
  rationale: 直前の文脈は、ノアとロトが破滅的な状況や圧迫から救い出された例を扱うため、「誘惑」に限定せず「試練」とした。ただし原語の真正な語義上の幅は脚注で保持した。
- issue: κολαζομένους の時間的・構文的な力
  choice: 不義な者たちが裁きの日まで罰のもとに置かれている状態
  alternative: 不義な者たちを、裁きの日に罰するために留めておく
  rationale: 現在分詞の継続的な響きを本文に反映したが、分詞を将来の裁きに伴う処罰として理解する構文上の可能性もある。中間状態について本文以上の体系を押しつけず、脚注で緊張を保った。
translation_notes:
  register: 明瞭で現代的かつ敬意ある標準日本語。「ご存じです」により主に対する自然な敬語を用いた。「敬虔」「不義」「裁き」は聖書的概念を保ちつつ、文全体は一般読者にも追いやすい語順にした。
