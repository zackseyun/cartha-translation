source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: ja
  text: 彼らは、姦婦で満ちた目をしており[a]、罪を犯すことをやめません[b]。心の定まらない人々を誘い込み、貪欲に鍛えられた心を持っています。彼らは呪いの子らです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一人の姦婦で満ちた（目）」。「姦淫で満ちている」または「姦淫の欲望で満ちている」という意味にも理解できます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「罪をやめることができません」または「絶えず罪を犯しています」。
    reason: lexical_alternative
  - marker: c
    text: 「呪いの子ら」は、呪いによって特徴づけられ、呪いを受ける者たちを表す慣用的な言い方です。別訳「呪われた者たち」。
    reason: idiom_explanation
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: 姦婦で満ちており
  rationale: 原文の「一人の姦婦で満ちている」という具体的で鋭い比喩を保った。日本語では異例な表現なので、意味を脚注で補った。
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: 罪を犯すことをやめません
  rationale: 「罪から休むことがない／罪をやめられない」という継続的な意味を、現代日本語で明瞭に表した。「罪に飽くことがない」と欲望の意味に限定しなかった。
- source_word: δελεάζοντες
  choice: 誘い込み
  rationale: 餌でおびき寄せるような捕食的含意を持つ動詞であり、「誘い込む」は誘惑と罠の両面を自然に伝える。
- source_word: ψυχὰς ἀστηρίκτους
  choice: 心の定まらない人々
  rationale: ψυχήをここでは人そのものと理解し、ἀστήρικτοςの「堅く据えられていない、不安定な」を自然な日本語で表した。
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: 貪欲に鍛えられた心
  rationale: γεγυμνασμένηνの訓練・鍛錬の比喩を保ち、πλεονεξίαは現代の読者に明瞭な「貪欲」とした。
- source_word: κατάρας τέκνα
  choice: 呪いの子ら
  rationale: 属格を伴う「子ら」という原文の強い慣用表現を保持し、単に「呪われた者たち」と平板化しなかった。
theological_decisions:
- issue: μοιχαλίδοςの性的比喩をどの程度具体的に残すか
  choice: 本文で「姦婦」という単数の具体像を保持する
  alternative: 「姦淫で満ちている」または「情欲に満ちている」
  rationale: 原文の鮮烈な告発を弱めず、同時に慣用的な意味は脚注で示すことで、具体像と理解しやすさを両立させた。
- issue: ἀκαταπαύστους ἁμαρτίαςを欲望の飽くことなさとして訳すか、罪をやめないこととして訳すか
  choice: 「罪を犯すことをやめません」
  alternative: 「罪に飽くことがありません」
  rationale: 語形が第一に表す「休まず、やめない」という継続性を優先し、欲望や飽満の概念を本文に加えなかった。
- issue: κατάρας τέκναの慣用表現を保持するか
  choice: 「呪いの子ら」として保持する
  alternative: 「呪われた者たち」または「呪いの下にある者たち」
  rationale: 原文の修辞的な力と、呪いによって特徴づけられた者という含みを保持した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、ペトロの畳みかける厳しい告発と、目・訓練・子らという原文の比喩を保った。「姦婦で満ちる」「呪いの子ら」は意図的に異質感を残し、脚注で意味を明確にした。
