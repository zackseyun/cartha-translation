source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: ja
  text: そして、多くの人が彼らの恥知らずな行い[a]に従い、彼らのゆえに、真理の道[b]はそしられることになります[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「みだらな行い」「放縦」とも訳せる。ギリシア語は、しばしば性的な含みを伴う、節度を失った恥知らずな振る舞いを表す。
    reason: lexical_alternative
  - marker: b
    text: 「真理に属する道」の意。ここでは、真理にかなう信仰と生き方を指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「悪く言われる」「冒瀆される」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 数量を表す一般的な語として自然であり、原文の重みを保つ。
- source_word: ἐξακολουθήσουσιν
  choice: 従うようになり
  rationale: 人の後についてその歩みや行動を倣う意味を表し、未来の予告として文脈に自然につながる。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 文脈上、偽教師たちを指す複数属格代名詞であり、後続する行いとの所属関係を明確に示す。
- source_word: ταῖς ἀσελγείαις
  choice: 恥知らずな行い
  rationale: 性的な含みを持ち得る、節度を失った厚顔無恥な振る舞い全般を表す。複数形の具体性も「行い」によって自然に反映する。
- source_word: δι’ οὓς
  choice: その人たちのために
  rationale: διάと対格が示す原因を表す。「その人たち」は直前の、偽教師に従う多くの人を指すという自然な統語的理解を保つ。
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: 真理の道
  rationale: 属格構文と「道」の比喩を保ちつつ、キリスト者の信仰と生き方を指す表現として自然な日本語にする。
- source_word: βλασφημηθήσεται
  choice: 悪く言われることになります
  rationale: 対象が「真理の道」であるため、冒瀆的にそしる、ののしる、評判を傷つけるという幅を持つ受動形を、明瞭な現代日本語で表す。
theological_decisions:
- issue: 「真理の道」の指示内容と力点
  choice: キリスト者の真の信仰と生き方を指す初期キリスト教的表現として、「真理の道」と訳す。
  alternative: 「真理に至る道」または「真の道」
  rationale: 原文の属格と道の比喩を保ち、教理内容だけ、または生活様式だけに限定しない。
- issue: ἀσέλγειαの道徳的範囲
  choice: 「恥知らずな行い」
  alternative: 「みだらな行い」「放縦」
  rationale: 性的放縦の含みを排除せず、それより広い、節度を失った厚顔無恥な行動も含める。
- issue: δι’ οὓςの指示対象
  choice: 直前の「多くの人」を指すものとして「その人たち」とする。
  alternative: 偽教師たちを含めて「彼ら」とする。
  rationale: 関係代名詞の直近の先行詞は「多くの人」である。ただし文脈上は偽教師たちの悪影響も背景にあるため、脚注で断定を加えず原文の連関を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ἀσέλγειαを性的意味だけに狭めず、βλασφημέωも宗教用語の「冒瀆」に固定せず本文では一般読者に分かる表現とし、原語の幅は脚注に残した。
