id: 2PE.3.3
reference: 2 Peter 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: ja
  text: まず、このことを知っておきなさい。終わりの日々には、あざけりながらあざける者たちが現れ[a]、自分自身の欲望のままに歩むのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あざけりをもって、あざける者たちが現れ」。ギリシア語は同語根の語を重ねて強調している。
    reason: lexical_alternative
  - marker: b
    text: 「欲望」は「強い欲求」とも訳せる。この語は性的な欲望だけでなく、より広く強い願望や衝動を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: まず、このことを知っておきなさい
  rationale: 分詞句は文脈上、読者への勧告として自然に伝わるよう命令形で表現した。「まず」により πρῶτον の優先性を保っている。
- source_word: ἐλεύσονται
  choice: 現れ
  rationale: 単に移動して「来る」というより、終わりの日々にそのような者たちが出現するという文脈を、自然な現代日本語で表した。
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: 終わりの日々には
  rationale: 終末論的な時を示す定型的表現を保ちつつ、特定の終末論体系には限定しない。
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: あざけりながらあざける者たち
  rationale: 同語根による強調を、日本語でも「あざけり／あざける」によって可視化した。やや反復的だが、原文の修辞を保つ。
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: 自分自身の欲望のままに
  rationale: ἰδίας αὐτῶν の強調を「自分自身の」で表し、κατά の規範・支配に従う含意を「のままに」で自然に示した。ἐπιθυμίαι は性的意味に狭めず、否定的な強い欲求を表す「欲望」とした。
- source_word: πορευόμενοι
  choice: 歩む
  rationale: 生活態度を表す比喩を保持し、聖書的な語感を残しながら現代日本語でも理解できる表現とした。
theological_decisions:
- issue: ἐπ’ ἐσχάτων τῶν ἡμερῶν の終末論的範囲
  choice: 終わりの日々には
  alternative: 日々の終わりに／末の日々には
  rationale: 時期の具体的な開始点や長さを定めず、原文の終末論的警告をそのまま保持する。
- issue: ἐπιθυμίαι の道徳的意味範囲
  choice: 欲望
  alternative: 欲情／さまざまな欲求
  rationale: 文脈上の否定的評価を伝えつつ、性的欲求だけに限定しない広い意味を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の同語根反復と「歩む」という生活比喩を保持し、終末論の詳細や欲望の対象を本文以上に限定しない。
