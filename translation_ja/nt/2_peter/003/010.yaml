id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: ja
  text: しかし、主の日は盗人のようにやって来ます。その日、天は轟音とともに過ぎ去り、諸要素[a]は焼かれて崩壊し、地とそこにある業は、見いだされます[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸要素」（στοιχεῖα）は、「天体」とも訳せます。この文脈では、宇宙を構成するものをより具体的に指している可能性があります。
    reason: lexical_alternative
  - marker: b
    text: 「見いだされます」は、「あらわにされます」または「明るみに出されます」という意味だと理解することもできます。
    reason: alternative_reading
  - marker: c
    text: 多くの写本では、「見いだされます」の代わりに「焼き尽くされます」となっています。
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: やって来ます
  rationale: 未来形の到来を自然な現代日本語で表し、終末における「主の日」の到来を示す。
- source_word: ἡμέρα κυρίου
  choice: 主の日
  rationale: 預言書および使徒的文書に見られる終末論的な定型表現を保つ。週ごとの礼拝日を指す表現とはしない。
- source_word: κλέπτης
  choice: 盗人
  rationale: 予期しない到来を強調する聖書的比喩を、簡潔で品位ある語で保持する。
- source_word: ἐν ᾗ
  choice: その日
  rationale: 直前の「主の日」を受け、その日に起こる出来事を日本語として明瞭につなぐ。
- source_word: οἱ οὐρανοὶ
  choice: 天
  rationale: 宇宙的な裁きの文脈に合う日本語の集合的表現であり、複数形の範囲を単一の場所に限定しない。
- source_word: ῥοιζηδόν
  choice: 轟音とともに
  rationale: 勢いよく響く、うなりを伴う音という語感を、鮮明かつ自然に表す。
- source_word: παρελεύσονται
  choice: 過ぎ去り
  rationale: 終末論的文脈での消滅を含む「過ぎ去る」という聖書的表現を保つ。
- source_word: στοιχεῖα
  choice: 諸要素
  rationale: 宇宙の構成要素とも天体とも解し得るため、指示対象を狭く断定しない訳語を選ぶ。
- source_word: καυσούμενα
  choice: 焼かれて
  rationale: 火による過程を示しつつ、動作主を補わず、受動的な表現を保持する。
- source_word: λυθήσεται
  choice: 崩壊し
  rationale: 結合が解かれ、ばらばらになるという意味を、この宇宙的文脈で分かりやすく表す。「滅ぼされる」として含意を断定しない。
- source_word: γῆ
  choice: 地
  rationale: 天との対比による宇宙的範囲を保ち、局地的な「土地」に限定しない。
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: その中にある業
  rationale: 人の行為・成果を含み得るἔργαの幅を残し、「そこで行われたすべて」などと説明的に限定しない。
- source_word: εὑρεθήσεται
  choice: 見いだされます
  rationale: 本文の難しい受動形を最も直接的に訳し、「あらわになる」などの解釈を本文に織り込まない。
theological_decisions:
- issue: 最後の節 καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται の意味
  choice: 「地と、その中にある業とは、見いだされます」を本文に置く。
  alternative: 「あらわにされます」または「焼き尽くされます」
  rationale: 提示されたギリシア語本文のεὑρεθήσεταιは最も直接には「見いだされる」を意味する。本文上・解釈上の難しさを滑らかに解消せず、別解と異読は脚注に示す。
- issue: στοιχεῖαの指示対象
  choice: 「諸要素」とし、対象を特定しない。
  alternative: 「天体」または「宇宙の基本的な構成要素」
  rationale: この語は文脈上、宇宙の構成要素または天体を指し得る。本文が一義的に特定しないため、広い意味を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、終末的な場面にふさわしい品位と重みを保った。「盗人」「主の日」「過ぎ去る」などの聖書的表現は理解可能な範囲で維持し、難解な最終節は意図的に平滑化せず脚注で補った。
