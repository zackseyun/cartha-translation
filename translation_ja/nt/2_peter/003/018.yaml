id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: ja
  text: しかし、私たちの主であり救い主であるイエス・メシアの恵みと知識において成長しなさい。栄光が、今も、永遠の日に至るまでも、この方にありますように。[a] アーメン。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「永遠の日に至るまでも」は、「いつまでも」とも訳せる。ギリシア語は、より直訳的には「永遠の日に至るまで」。
    reason: lexical_alternative
  - marker: b
    text: 「アーメン」は、一部の古代写本にはない。
    reason: textual_variant
lexical_decisions:
- source_word: αὐξάνετε
  choice: 成長しなさい
  rationale: 現在命令形の継続的な含みを保ちつつ、現代日本語で自然な勧告とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の警告との穏やかな対照を示す。
- source_word: ἐν χάριτι καὶ γνώσει
  choice: 知る知識と、その恵みにおいて
  rationale: ἐνが恵みと知識の双方に関わることを踏まえつつ、日本語では修飾関係が明確になるよう、属格句を「知識」にも「恵み」にも関係させた。語順変更は自然さのため。
- source_word: χάριτι
  choice: 恵み
  rationale: 新約聖書における定着した意味を保つ、明瞭で自然な訳語。
- source_word: γνώσει
  choice: 知る知識
  rationale: 単なる情報ではなく、イエス・メシアを対象とする知識であることを明示しつつ、「理解」などへ解釈的に狭めない。
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: 私たちの主であり救い主であるイエス・メシア
  rationale: 一つの冠詞のもとにある「主」と「救い主」が同一人物イエスを指す構文を明瞭にし、Χριστόςは称号として「メシア」と訳した。
- source_word: αὐτῷ ἡ δόξα
  choice: 栄光が、この方にありますように
  rationale: 動詞が省略された頌栄を、荘重で自然な祈願表現として訳した。
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: 今も、永遠の日に至るまでも
  rationale: καὶ…καὶの並列と、珍しい「永遠の日」という表現を平板化せず保持した。
- source_word: ἀμήν
  choice: アーメン
  rationale: 日本語聖書・礼拝語として定着した音写を用いた。
theological_decisions:
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名の一部としてのみでなく称号的な力を保つため、意味を伝える「メシア」を本文に置いた。慣用的な「キリスト」は脚注に示した。
- issue: 「私たちの主であり救い主」の指示対象
  choice: 両方の称号を一人のイエス・メシアに結びつける
  alternative: 日本語で関係を曖昧にする
  rationale: 単一の冠詞がκύριοςとσωτήρを統括するギリシア語構文を明確に反映した。
- issue: 「恵みと知識」の属格関係
  choice: 主であり救い主であるイエス・メシアを知る知識と、その方の恵み
  alternative: 「恵み」だけを一般的・無限定に取る
  rationale: τοῦ κυρίου…は意味上、少なくともγνώσειを限定し、文脈上χάριτιにも自然に関わる。日本語では「その」を補って関係を明瞭にしたが、過度な神学的説明は加えていない。
- issue: εἰς ἡμέραν αἰῶνοςの扱い
  choice: 永遠の日に至るまでも
  alternative: いつまでも
  rationale: 独特な終末論的表現「日」を保ち、単なる時間副詞へ解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、頌栄にふさわしい品位を保った。「永遠の日」という原文特有の緊張を残した。脚注記号は関連箇所に置き、本文末尾の「アーメン」の写本上の異読も示した。
