id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: ja
  text: また、私たちの主の忍耐を救いと考えなさい[a]。私たちの愛する兄弟パウロも、彼に与えられた知恵に従って、あなたがたにそのように書きました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忍耐」は「寛容」とも訳せる。主がすぐに裁きを行われないのは無関心だからではなく、人々の救いのためであるという意味。
    reason: lexical_alternative
  - marker: b
    text: 「彼に与えられた知恵」は神から与えられた知恵を示唆すると考えられるが、ギリシア語では与えた方が明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: 忍耐
  rationale: 裁きを直ちに行わず、長く耐え忍ぶことを表す。直前の文脈にある主の到来の遅れと自然につながる、明瞭で標準的な訳語。
- source_word: σωτηρίαν
  choice: 救い
  rationale: 終末的な文脈における神の救済目的を表し、新約聖書での神学的な重みも保つ。
- source_word: ἡγεῖσθε
  choice: …と考えなさい
  rationale: 命令形の『…と見なす、考える』という意味を、σωτηρίανとの補語関係が明確になる自然な日本語で表した。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主の
  rationale: κύριοςの称号としての意味と文脈上のキリストへの言及を保つ。
- source_word: ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος
  choice: 私たちの愛する兄弟パウロ
  rationale: 著者の親愛と、同じ信仰共同体に属する者としての呼称を、現代の自然で品位ある日本語にした。
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: 与えられた知恵に従って
  rationale: κατάの一致・規範の意味を『に従って』で示し、受動形の行為者を本文で補わないことで原文の含みを保った。
- source_word: ἔγραψεν ὑμῖν
  choice: あなたがたに書いた
  rationale: アオリストを素直な過去表現とし、与格の宛先も明示した。
- source_word: καθὼς καὶ
  choice: …も…とおりです
  rationale: 比較の『とおり』と添加の『も』をともに示し、パウロの記述との対応を明確にした。
theological_decisions:
- issue: 「与えられた知恵」の行為者
  choice: 本文では「神から」を補わず、「与えられた」という受動表現を保つ。
  alternative: 神から与えられた知恵に従って
  rationale: 神が与え手である可能性は高いが、ギリシア語は行為者を明示していないため、その含みを脚注で説明する。
- issue: 主の遅延と救いの関係
  choice: 「主の忍耐を救いと考えなさい」と直接的な叙述関係を保つ。
  alternative: 主の忍耐を救いの機会と考えなさい
  rationale: 『機会』や『目的』を本文に補わず、主の忍耐を救いとして捉える原文の簡潔さと神学的緊張を維持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令の重みと書簡にふさわしい品位を保った。「忍耐を救いと考えなさい」はやや凝縮された表現だが、原文の直接的な述語関係を解釈的に拡張せず残している。
