revisions:
- from: また、私たちの主の忍耐を救いと考えなさい[a]。それは、私たちの愛する兄弟パウロも、与えられた知恵に従って、あなたがたに書いたとおりです[b]。
  to: また、私たちの主の忍耐を救いと考えなさい[a]。私たちの愛する兄弟パウロも、彼に与えられた知恵に従って、あなたがたにそのように書きました[b]。
  rationale: 後半を独立した平叙文として再構成し、「も」によってκαίの添加を、「そのように」によってκαθὼςの比較を表した。「そのように」は日本語で比較の対象を明示するための最小限の補いであり、主の忍耐を救いとみなす内容についてパウロも書いた、という原文の省略された関係を表す。また、「彼に」を補ってαὐτῷを反映した。脚注a・bの内容とアンカーは維持し、bの引用句のみ本文に合わせて修正した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:42:51Z'
