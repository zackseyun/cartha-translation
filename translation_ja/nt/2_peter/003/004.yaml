review_pass:
  verdict: approve
  source_fidelity: 原文の構文と意味を適切に反映している。λέγοντες は前節に続く「あざける者たち」の発言として「そして、こう言います」と自然に処理されている。ἐπαγγελία τῆς παρουσίας αὐτοῦ は「あの方が来られるという約束」として、将来の到来に関する約束という意味を明確に伝える。ἀφ’ ἧς以下も、「父祖たちが眠りに就いて以来」から「創造の初めから」まで、過去から現在まで一様に継続しているという嘲る者たちの主張を忠実に表している。
  naturalness: 明瞭な現代標準日本語であり、引用部の修辞疑問「どこにあるのか」と反語的な結び「ではないか」は文脈にふさわしい。「父祖たち」「眠りに就く」はやや格調を保つが、不自然でも難解でもなく、聖書翻訳として適切である。
  terminology: 「約束」「父祖たち」「創造」「眠りに就く」はいずれも原文に対応し、神学的解釈を過度に加えていない。「来られる」は παρουσία のこの文脈での到来の意味を自然に表す。脚注aは「到来」「臨在」という語義上の幅を示しつつ文脈上の指示対象を説明しており、脚注bも死の婉曲表現を簡潔かつ正確に説明している。
