id: 2PE.3.4
reference: 2 Peter 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: ja
  text: そして、こう言います。「あの方が来られるという約束[a]は、どこにあるのか。父祖たちが眠りに就いて[b]以来、すべては創造の初めからずっと同じまま続いているではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その方の来臨の約束」。原語「パルーシア」は「到来」「臨在」とも訳せるが、ここではキリストが将来来られることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「眠りに就く」は、死ぬことを表すギリシア語の婉曲表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: そして、こう言います
  rationale: 前節の「あざける者たち」を説明する現在分詞の流れを保ちつつ、現代日本語として自然な形にした。
- source_word: ἐπαγγελία
  choice: 約束
  rationale: 将来の来臨について与えられた保証を指す標準的で明瞭な訳語である。
- source_word: παρουσίας
  choice: 来られる
  rationale: ここではキリストの将来の到来を指すため、静的な「存在」ではなく、一般の読者にも分かりやすい動的な表現とした。
- source_word: ἀφ’ ἧς
  choice: 以来
  rationale: 過去のある時点から現在までの経過を表すギリシア語の時間的意味を簡潔に伝える。
- source_word: οἱ πατέρες
  choice: 父祖たち
  rationale: 所有代名詞を補わず、先立つ世代や祖先を指し得る原文の表現を保った。
- source_word: ἐκοιμήθησαν
  choice: 眠りに就いて
  rationale: 死を表す原文の婉曲的な比喩を保持し、脚注で意味を明示した。
- source_word: πάντα
  choice: すべて
  rationale: 被造世界全般に及ぶ、あざける者たちの包括的な主張を表す。
- source_word: οὕτως διαμένει
  choice: ずっと同じまま続いている
  rationale: 同一の状態が継続しているという意味を、自然な現代日本語で表した。
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: 創造の初めから
  rationale: 原文の属格構文を簡潔かつ明瞭に反映する。
theological_decisions:
- issue: 終末論的文脈における παρουσία の意味
  choice: あの方が来られる
  alternative: あの方の来臨／到来／存在
  rationale: 文脈はキリストの将来の帰還が実現しないという嘲りであるため、到来の意味を自然に伝えた。一方、原語が「到来」とそれに伴う「臨在」の含みを持ち得ることは脚注に残した。
- issue: ἐκοιμήθησαν による死の婉曲表現
  choice: 眠りに就いて
  alternative: 死んで
  rationale: 原文が直接「死ぬ」と言わず睡眠の比喩を用いているため、その表現上の特徴を保った。特定の死後観を訳文に付加せず、慣用的に死を意味することを脚注で説明した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あの方」は直前の文脈で指示対象が明らかな αὐτοῦ を自然に表し、訳文だけで固有名を補わないようにした。嘲る者たちの修辞疑問と、世界は変わらず続くという主張の語調を「どこにあるのか」「ではないか」で示した。
