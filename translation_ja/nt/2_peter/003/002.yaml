  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: ja
  text: 聖なる預言者たちが前もって語った言葉[b]と、あなたがたの使徒たちを通して伝えられた、主であり救い主である方の戒め[a]を、思い起こしてもらうためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの使徒たちの、主であり救い主である方の戒め」。原文では属格が重なっており、語句の関係を複数の仕方で表すことができます。
    reason: alternative_reading
  - marker: b
    text: または「以前に語られた言葉」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: 思い起こしてもらうためです
  rationale: 受動形の不定詞だが意味上は「思い起こす」。前節の目的を表す構文とのつながりを保ち、現代日本語として自然な形にした。
- source_word: προειρημένων ῥημάτων
  choice: 前もって語った言葉
  rationale: προλέγωを狭く「予言する」と限定せず、時間的に先立って語られたことを表す。ῥήματαは明快な「言葉」とした。
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: 聖なる預言者たちが
  rationale: 行為者を示すὑπό句を、日本語では自然な能動構文で表現し、「聖なる」という修飾を保持した。
- source_word: ἐντολῆς
  choice: 戒め
  rationale: 単数形と権威ある命令という意味を保持し、聖書本文にふさわしく一般読者にも通じる語を選んだ。
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: あなたがたの使徒たちが伝えた
  rationale: ὑμῶνをἀποστόλωνに結びつけ、読者たちに遣わされた、または彼らと関係する使徒たちという意味を表した。「伝えた」は戒めを媒介した関係を自然な日本語にする補足である。
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: 主であり救い主である方からの
  rationale: この属格を戒めの源に結びつけ、一人の方を指すまとまりとして表現した。原文にない「私たちの」は補わなかった。
theological_decisions:
- issue: τῶν ἀποστόλων ὑμῶνにおけるὑμῶνの関係
  choice: 「あなたがたの」が「使徒たち」を修飾する
  alternative: 「使徒たちによってあなたがたに与えられた戒め」
  rationale: 語順上、ὑμῶνはἀποστόλωνと結びつくのが自然であり、読者と関係のある使徒たちを指すと理解した。
- issue: τοῦ κυρίου καὶ σωτῆροςの統語的関係
  choice: 戒めは主であり救い主である方に由来し、使徒たちが伝えた
  alternative: 使徒たちが主であり救い主である方に属する、と取ることも文法上考えられる
  rationale: ἐντολῆςに結びつけると、預言者の言葉と、主に由来して使徒が伝えた戒めとの並行関係が明瞭になる。ただし属格の連続による曖昧さは注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く目的表現として訳し、主文から独立した命令文にはしなかった。原文の語順を機械的に再現せず、預言者と使徒の証言の並行関係、および「主であり救い主」の一体性を自然に示した。
