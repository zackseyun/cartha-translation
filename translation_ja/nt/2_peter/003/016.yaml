id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: ja
  text: また彼は、すべての手紙の中で、これらのことについて語っています。それらの手紙には、理解しにくいことがいくつかあります。無知で不安定な人たちは、ほかの聖書[a]と同じように、それらをねじ曲げて[b]、自らの滅びに至っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「残りの聖書」。原語は「ほかの」とも「残りの」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ゆがめて」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: 手紙
  rationale: 現代日本語で自然な書簡の呼称とし、「書簡」より一般読者に分かりやすくした。
- source_word: λαλῶν
  choice: 語っています
  rationale: 手紙という媒体の中で伝えることを指すが、原語の「語る」を保ち、「書いています」と限定しすぎないようにした。
- source_word: περὶ τούτων
  choice: これらのことについて
  rationale: 直前までに論じられた事柄を指す指示表現をそのまま保持した。
- source_word: δυσνόητά τινα
  choice: 理解しにくい箇所も
  rationale: τιναの不定性を「も」で自然に表し、手紙の内容中の事項を日本語では「箇所」と表現した。
- source_word: ἀμαθεῖς
  choice: 無知
  rationale: 教えを受けていないことも含み得るが、知識・理解の欠如を広く表す簡潔な語を選んだ。
- source_word: ἀστήρικτοι
  choice: 不安定な
  rationale: 信仰や理解が堅く定まっていない状態を、解釈を付加せず表した。
- source_word: στρεβλοῦσιν
  choice: ねじ曲げて
  rationale: 本来の形を無理に曲げる原語の具体的な比喩を、自然で明瞭な日本語で保った。
- source_word: τὰς λοιπὰς γραφὰς
  choice: ほかの聖書
  rationale: γραφαίを聖なる文書として「聖書」と訳し、λοιπάςが持つ「残りの／ほかの」の幅のうち自然な日本語を採用した。パウロの手紙と他の聖書文書との並置も保持される。
- source_word: ἀπώλειαν
  choice: 滅び
  rationale: 深刻な破滅を示しつつ、その性質について本文以上の神学的限定を加えない定着した日本語とした。
theological_decisions:
- issue: τὰς λοιπὰς γραφὰςが示すパウロ書簡と聖書の関係
  choice: 「ほかの聖書」と訳し、パウロの手紙が他の聖書文書と並べられている自然な含意を保持した。
  alternative: 「ほかの文書」または「残りの聖書」
  rationale: 新約における複数形γραφαίは通常、聖なる文書を指すため、一般的な「文書」には弱めない。一方、「ほかの」は日本語として自然であり、本文を越えた体系的教理の説明は加えない。
- issue: πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειανの因果表現
  choice: 「自らの滅びを招いています」
  alternative: 「自らの滅びに至らせています」または「自らの滅びのために」
  rationale: 前置詞句が示す結果・帰結を自然な日本語で表し、滅びの具体的性質は特定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文にふさわしい落ち着いた調子を保った。「無知で不安定な人たち」「自らの滅び」など、原文の厳しい語調は弱めていない。
