- from: また、彼はどの手紙でも、これらのことについて語っています。その手紙の中には理解しにくい箇所もあり、無知で不安定な人たちは、ほかの聖書[a]と同じように、それらをねじ曲げて[b]、自らの滅びを招いています。
  to: また彼は、すべての手紙の中で、これらのことについて語っています。それらの手紙には、理解しにくいことがいくつかあります。無知で不安定な人たちは、ほかの聖書[a]と同じように、それらをねじ曲げて[b]、自らの滅びに至っています。
  rationale: 本文の意味を変えず、原文にある「すべての手紙」と「それらの手紙」という複数の対応を明確にした。「理解しにくいことがいくつか」でδυσνόητά τιναをより直接に反映した。「自らの滅びに至っています」はπρὸς τὴν ἰδίαν αὐτῶν ἀπώλειανが示す帰結を、余分な神学的限定なしに表す。脚注アンカーは対象語に保持した。
