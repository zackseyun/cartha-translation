source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: ja
  text: しかし、今ある天と地は、同じことばによって蓄えられ、裁きと神を敬わない人々[a]の滅びの日まで、火のために保たれています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「神を敬わない人間たち」。原語はここで、男女を含む人間一般を指し得る。
    reason: 原語ἄνθρωποιの代表的・包括的用法を示し、包括的な本文訳「人々」を補足するため。
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: しかし、今ある天と地は
  rationale: 前節のかつての世界との対比をδὲで示し、νῦνを現在存在する被造世界として自然な現代日本語で表した。οὐρανοίの複数形は、日本語の慣用上「天」とした。
- source_word: τῷ αὐτῷ λόγῳ
  choice: 同じみことばによって
  rationale: 前文脈にある神の有効なことばを指す。与格を手段として訳し、αὐτῷの照応性を「同じ」で保持した。「みことば」は文脈上、神の語りかけを指すことを明確にする。
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: 蓄えられており
  rationale: 迂言的完了形が示す、すでになされた行為の結果として現在も続く状態を表した。「取っておかれ」も可能だが、後続のτηρούμενοιとの語義の重複を避けた。
- source_word: πυρὶ τηρούμενοι
  choice: 火のために……保たれています
  rationale: τηρέωを「保つ」、πυρίを目的・帰着点として「火のために」と訳した。原文に冠詞がないため「その火」とは限定しない。
- source_word: εἰς ἡμέραν κρίσεως καὶ ἀπωλείας
  choice: 裁かれ、滅ぼされる日まで
  rationale: εἰςの時間的終点を「日まで」で表した。属格のκρίσεωςとἀπωλείαςは、後続する「神を敬わない人々」に関わる出来事として日本語で明瞭にしたが、宇宙そのものの消滅か刷新かという問題は決定していない。
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: 神を敬わない人々
  rationale: ἀσεβήςを、単なる不信心というラベルではなく神への畏敬を欠く意味が伝わる表現とした。ἄνθρωποιはここで人間一般を表し得るため、性別を限定しない「人々」とした。
theological_decisions:
- issue: 来るべき火と天地の行く末
  choice: 現在の天と地が将来の火のために保たれていることを述べるが、それが完全な消滅か、火を通した刷新かは確定しない。
  alternative: 宇宙の完全な消滅、または被造世界の浄化と刷新と明示する。
  rationale: 原文は天地が「火のために保たれている」と述べる一方、「滅び」の属格は直接には神を敬わない人々にかかる。この節だけでは天地の最終的形態を断定できないため、神学的緊張を保持した。
- issue: κρίσεως καὶ ἀπωλείαςとτῶν ἀσεβῶν ἀνθρώπωνの関係
  choice: 神を敬わない人々が裁きと滅びを受ける日として訳す。
  alternative: 「裁きの日」と「神を敬わない人々の滅び」を並列的に名詞句のまま訳す。
  rationale: 二つの属格名詞はいずれも「日」を規定し、最後の属格句は少なくともἀπωλείαςに、自然には裁きの出来事全体にも関係する。日本語として明瞭にしつつ、滅びの性質や範囲は説明的に限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「みことば」は聖書文体として一般読者にも理解可能な範囲で用いた。「滅ぼされる」はἀπώλειαの強さを保つが、永遠の刑罰の様態や存在消滅をこの語だけで断定しない。
