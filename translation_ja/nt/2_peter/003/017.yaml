id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: ja
  text: ですから、愛する皆さん、あなたがたはこのことを前もって知っているのですから、無法な者たちの誤りに引きずられて、自分たち自身の確かな立場[a]から落ちる[b]ことがないように、自らを守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確かな立場」は、「安定」または「揺るがなさ」とも訳せる。ギリシア語στηριγμόςは、堅さ、安定、確固たる状態を表す。
    reason: lexical_alternative
  - marker: b
    text: 「落ちる」は「離れ落ちる」とも訳せるが、本文では、この警告をギリシア語が明示する以上に特定の神学的意味へ限定しない表現にした。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: ですから、…あなたがたは
  rationale: οὖνの推論的なつながりと、明示されたὑμεῖςの強調を、自然な現代日本語の語順で保った。
- source_word: ἀγαπητοί
  choice: 愛する人たち
  rationale: 牧会的な愛情を込めた呼びかけを、現代の一般読者に明瞭で、書簡としての品位もある表現にした。
- source_word: προγινώσκοντες
  choice: このことを前もって知っているのですから
  rationale: 事前の知識または警告を受けているという時間的意味を保ち、分詞の状況的・理由的な働きを自然に表した。「このこと」は文脈から補った。
- source_word: φυλάσσεσθε
  choice: 自らを守りなさい
  rationale: 現在中動態命令の継続的な警戒と再帰的な意味を保った。
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: 無法な者たちの迷いに
  rationale: ἀθέσμωνを道徳的規範を顧みない「無法な者たち」、πλάνηを誤りと惑わしの両面を含み得る「迷い」とした。与格はσυναπαχθέντεςとの結びつきを「に」で自然に表した。
- source_word: συναπαχθέντες
  choice: 巻き込まれて
  rationale: 他者とともに引きずられていく受動的な含意と、複合動詞の「一緒に」のニュアンスを簡潔に表した。
- source_word: ἐκπέσητε
  choice: 外れることのないよう
  rationale: 「外へ落ちる／ある状態から離れる」という比喩を保ちつつ、救済の喪失や背教と断定する神学的限定を避けた。
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: 自分たちの堅固な立場
  rationale: ἰδίουの所有的強調を「自分たちの」で保ち、στηριγμόςの堅さ・安定・確固たる位置という意味を日本語で自然な「堅固な立場」とした。
theological_decisions:
- issue: ἐκπέσητεが救いの喪失・背教を意味するのか、より一般的に堅固な状態から外れることを意味するのか
  choice: 「自分たちの堅固な立場から外れる」と中立的に訳した。
  alternative: 「自分たちの堅忍から脱落する」「信仰の確かな立場を失う」
  rationale: 本文は誤りに巻き込まれ、確固たる状態から離れる危険を強く警告するが、その結果を特定の救済論的結論に限定してはいないため、警告の力と神学的緊張の双方を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、牧会的な温かさと警告の厳粛さを両立させた。脚注記号は対応箇所が密接に関連するため、節末に[a][b]として置いた。
