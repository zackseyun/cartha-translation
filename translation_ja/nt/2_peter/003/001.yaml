id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: ja
  text: 愛する皆さん、これは、私があなたがたに書いている二通目の手紙です。この二通の手紙で[a]、私は思い起こさせることによって、あなたがたの純粋な思い[b]を呼び覚ましています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「それらの中で」。ギリシア語は複数形で、最も自然には二通の手紙を指します。
    reason: alternative_reading
  - marker: b
    text: 「あなたがたの誠実な心」または「あなたがたの混じりけのない理解」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 愛する皆さん
  rationale: 呼びかけの複数形。親愛の情を保ちつつ、現代日本語として自然で、共同体への丁重な呼びかけとなる。
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: 私は今、この第二の手紙をあなたがたに書いています
  rationale: ギリシア語の強調点を保ちながら、日本語として自然な語順に整えた。ἤδη は文脈上「今」とした。
- source_word: γράφω
  choice: 書いています
  rationale: 書簡執筆時の現在形を、自然な日本語の進行表現で示す。
- source_word: ἐν αἷς
  choice: これら二通の手紙の中で
  rationale: 女性複数の関係代名詞が、直前に示された二通の手紙を受けることを明示した。
- source_word: διεγείρω
  choice: 呼び覚まそうとしている
  rationale: 眠りや不活発な状態から起こし、注意を新たにさせる比喩的意味を表す。
- source_word: ἐν ὑπομνήσει
  choice: 思い起こさせることにより
  rationale: 想起を促すことが手段であるという前置詞句の働きを明確に表した。
- source_word: εἰλικρινῆ διάνοιαν
  choice: 純真な思い
  rationale: εἰλικρινής の純粋さ・偽りのなさと、διάνοια の思考・理解・心の働きを、過度に限定せず自然な日本語で表す。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: διάνοιαν を修飾する複数二人称属格を、標準的な所有表現で訳した。
theological_decisions:
- issue: 複数形の関係代名詞 ἐν αἷς の指示対象
  choice: 著者が受取人に書いた二通の手紙を指す
  alternative: 現在の手紙だけを、緩やかな複数表現によって指す
  rationale: 文法上もっとも自然なのは、直前に言及された第二の手紙と、それによって含意される第一の手紙の双方を受ける読みである。ただし注で原文が単に複数形であることも示す。
- issue: εἰλικρινῆ διάνοιαν の意味範囲
  choice: 純真な思い
  alternative: 誠実な心／純粋な理解力
  rationale: 道徳的な誠実さと、混じりけのない思考の双方が含まれ得るため、一方に狭く決めず「純真な思い」とした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、書簡としての品位と親愛の調子を保った。「純真な思い」は日常語として理解でき、原語の道徳的・知的な幅も残す。
