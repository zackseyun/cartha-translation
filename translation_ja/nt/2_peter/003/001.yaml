  to: 愛する皆さん、これは、私があなたがたに書いている二通目の手紙です。この二通の手紙で[a]、私は思い起こさせることによって、あなたがたの純粋な思い[b]を呼び覚ましています。
  rationale: 原文の現在形、二通目であること、複数形の関係代名詞を保持したまま、明快な現代標準日本語として文を整えました。「純真」を「純粋」に改め、語の含意をより適切に保ちました。脚注bは対応語句の直後に移し、代替訳も本文訳と重複しないよう調整しました。
