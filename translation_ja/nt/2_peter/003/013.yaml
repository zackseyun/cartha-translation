id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: ja
  text: しかし、私たちは、神の約束に従って、義[a]の宿る新しい天と新しい地を待ち望んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。
    reason: δικαιοσύνηには「義」と「正義」の両方の語義があり、この文脈でも後者の含みを排除できないため。
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: 新しい天と新しい地
  rationale: καινόςが示す質的な新しさを保ち、イザヤ書65:17、66:22などに通じる聖書的・宇宙的な表現を自然な日本語で伝える。「新しくされた」とすると、形容詞自体を越えて刷新という解釈を加えるため避けた。
- source_word: δὲ
  choice: しかし
  rationale: 直前に語られた現在の天と地の滅びとの穏やかな対比を明確にする。
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: 神の約束に従って
  rationale: κατά＋対格が表す基準・一致を「に従って」で示した。αὐτοῦの指示対象は文脈上神であり、日本語で曖昧な代名詞を用いるより「神」と明示するほうが自然である。
- source_word: προσδοκῶμεν
  choice: 待ち望んでいます
  rationale: 現在形が示す継続的な期待を表し、単なる受動的な待機ではなく、将来に向けた希望を伴う期待も伝える。
- source_word: ἐν οἷς
  choice: 義の宿る
  rationale: 複数の関係代名詞は「新しい天と新しい地」を一体として指す。日本語では連体修飾にすることで、関係を簡潔かつ自然に示せる。
- source_word: δικαιοσύνη
  choice: 義
  rationale: 神の前で正しいこと、正しい状態、正義を含み得る広い聖書的意味を保つ。「正義」という語義も脚注に残した。
- source_word: κατοικεῖ
  choice: 宿る
  rationale: κατοικέωの定住・恒久的な居住の含意を、簡潔で品位ある日本語として表す。
theological_decisions:
- issue: 終末論的文脈における δικαιοσύνη の訳語
  choice: 義
  alternative: 正義
  rationale: 新しい創造を特徴づける、神の前で正しいあり方という広い意味を「義」で保った。一方、秩序や公正という側面を示す「正義」も有意な語義なので脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「新しい天と新しい地」「義」「宿る」という聖書的で品位ある表現を保持した。敬体で統一し、一般の読者にも理解しやすい語順とした。
