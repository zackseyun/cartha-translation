id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: ja
  text: 神の日の到来を待ち望み、またそれを早めつつ[a]、その日のゆえに、天は火に焼かれて解体され、もろもろの要素は焼かれて[b]溶けていきます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の日の到来を熱心に待ち望み」とも訳せる。ここで用いられているギリシア語の動詞には、「早める」と「熱心に待ち望む」の両方の意味があり得る。
    reason: alternative_reading
  - marker: b
    text: 「要素」は、世界を形作る基本的な要素を指すとも、天体を指すとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: 待ち望み
  rationale: 単なる待機ではなく、期待をもって待つ継続的な姿勢を、自然な現代日本語で表す。
- source_word: σπεύδοντας
  choice: 早めながら
  rationale: 目的語「到来」を取る語法に即して、到来を早めるという意味を本文に採用する。ただし「熱心に待ち望む」の可能性も脚注に残す。
- source_word: παρουσίαν
  choice: 到来
  rationale: 終末論的文脈での到着・現れを明瞭に示しつつ、「再臨」などの解釈的な専門語を避ける。
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: 神の日
  rationale: 原文の珍しい表現を保ち、より一般的な「主の日」と同一化しない。
- source_word: δι’ ἣν
  choice: その日のために
  rationale: διά＋対格の原因・契機を表す用法として、その日ゆえに続く宇宙的変動が生じることを示す。
- source_word: οὐρανοὶ
  choice: 天
  rationale: 日本語では集合的・宇宙的領域を自然に表せるため、ギリシア語の複数形を不自然に直訳せず「天」とする。
- source_word: πυρούμενοι
  choice: 燃え上がって
  rationale: 火にさらされ燃える受動的な事態を、日本語として自然な動態表現で示す。
- source_word: λυθήσονται
  choice: 崩れ去り
  rationale: 結合が解かれて解体する意味を表し、形而上学的な消滅を断定する「滅びる」は避ける。
- source_word: στοιχεῖα
  choice: もろもろの構成要素
  rationale: 世界を構成する基本要素という広い意味を保ち、天体を指す可能性を脚注で示す。
- source_word: καυσούμενα
  choice: 焼けて
  rationale: 熱や火によって焼かれる受動的含意を、簡潔で自然な日本語にする。
- source_word: τήκεται
  choice: 溶けていきます
  rationale: 熱によって溶解する意味を保ち、周囲の未来的文脈に合う日本語の叙述とする。
theological_decisions:
- issue: σπεύδοντας τὴν παρουσίαν の意味
  choice: その到来を早める
  alternative: その到来を熱心に待ち望む
  rationale: 目的語を伴う「早める」という素直な読みを本文に置きつつ、語義上可能で神学的にも重要な別解を脚注に明記して緊張を保つ。
- issue: στοιχεῖα の指示対象
  choice: もろもろの構成要素
  alternative: 天体
  rationale: 特定の古代宇宙論に限定せず、原語の広さを本文に残し、主要な別解を脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「待ち望む」「到来」「崩れ去る」により終末的な文脈を自然に表現しつつ、教派的専門語は避けた。節が前節から続く分詞構文であることを踏まえ、「その日を迎えるのです」を補って日本語の文として整えた。
