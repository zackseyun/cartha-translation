id: 2PE.3.5
reference: 2 Peter 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: ja
  text: というのも、彼らは次のことを故意に見過ごしています。すなわち、天は遠い昔から存在し、地は神のことばによって、水から、また水を通して成り立った[a]ということです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「成り立っている」とも訳せる。ギリシア語の完了形は、地が形成され、その結果として存立していることを示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: 彼らは、次のことを故意に見過ごしています
  rationale: λανθάνειの「気づかない・認識しない」とθέλονταςの意志的要素を合わせ、単なる無知ではなく、自ら進んで認めない含意を自然な現代日本語で表した。
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: 天は遠い昔から存在し
  rationale: οὐρανοίはギリシア語では複数形だが、日本語では宇宙的な「天」を通常単数形で自然に表せる。ἔκπαλαιの時間的意味は「遠い昔から」とした。
- source_word: γῆ
  choice: 地
  rationale: 無冠詞であることを日本語の不定表現で不自然に強調せず、被造世界としての陸地・大地の意味幅を保つ「地」を選んだ。
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: 水から、また水を通して
  rationale: ἐκとδιάの区別を保ち、それぞれ起源を示す「から」と、媒介または空間的関係を含み得る「通して」で訳した。
- source_word: συνεστῶσα
  choice: 成り立った
  rationale: 形成・成立・構成という意味を含む完了分詞を、創造の結果として成立している含意も持ち得る「成り立った」で表した。
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: 神のことばによって
  rationale: 与格の手段性を「によって」で示し、λόγοςを単に「命令」と限定せず、原文の表現を保った。
theological_decisions:
- issue: λόγοςが人格的なロゴスを明示するか
  choice: 神のことばによって
  alternative: 神の命令によって
  rationale: 文脈上は創造を実現する神の発語を指すが、人格的な「ことば」というキリスト論的称号を明示してはいない。「ことば」と訳すことで、原文以上に限定せず、可能な響きも消さない。
- issue: ἐξ ὕδατος καὶ δι’ ὕδατοςにおけるδιάの意味
  choice: 水から、また水を通して
  alternative: 水から、また水によって
  rationale: διάは手段を表し得るが、この宇宙論的表現には位置・媒介・構成に関する解釈の幅があるため、「によって」と断定せず「通して」として曖昧さを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「神のことば」「天」「地」に聖書本文としての品位を持たせた。文頭のγάρは前節との理由関係を示すが、単独節として日本語が不自然にならないよう明示的な「というのは」を置かず、内容提示の「すなわち」で論理関係を整えた。
