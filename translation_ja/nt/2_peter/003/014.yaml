source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: ja
  text: ですから、愛する人たち、これらのことを待ち望んでいるあなたがたは、平和のうちに、しみも傷もない者として彼によって[a]見いだされるよう、力を尽くしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼の前で、しみも傷もない者と認められる」。ギリシア語の与格は、「彼によって」という行為者を表すとも、「彼の前で」という関係・臨在を表すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: ですから
  rationale: 直前に述べられた主の日と新しい天と新しい地を受けて結論を導く接続詞。現代日本語として自然に推論関係を示す。
- source_word: ἀγαπητοί
  choice: 愛する人たち
  rationale: 複数の読者への愛情のこもった呼びかけ。親密さと書簡的な品位を保つ。
- source_word: ταῦτα
  choice: このこと
  rationale: 直前に述べられた終末的な事柄を指すが、その内容を訳文で限定せず、指示表現の簡潔さを保つ。
- source_word: προσδοκῶντες
  choice: 待ち望んでいる
  rationale: 継続的な期待を表す現在分詞。単なる待機ではなく期待を伴うことを自然に示す。
- source_word: σπουδάσατε
  choice: 力を尽くしなさい
  rationale: 熱心に努力するよう求めるアオリスト命令形の強さを、明瞭な現代日本語で表す。
- source_word: ἄσπιλοι
  choice: しみもない
  rationale: 道徳的な清さを『しみ』の比喩で表す語なので、その像を保持する。
- source_word: ἀμώμητοι
  choice: 傷もない
  rationale: ἄσπιλοιと並び、非難される欠陥がないことを表す。『しみも傷もない』という対句で両語の重なりと像を保つ。
- source_word: αὐτῷ
  choice: 彼に
  rationale: εὑρεθῆναιとの構文を行為者として取り、『彼によって見いだされる』の自然な省略形とした。指示対象を『神』『主』と明示せず原文どおり代名詞にとどめ、与格を臨在・基準の意味に取る可能性は脚注に残す。
- source_word: εὑρεθῆναι
  choice: 見いだされる
  rationale: 受動不定詞を受動表現として保ち、来臨時にその状態であると認められる意味を伝える。
- source_word: ἐν εἰρήνῃ
  choice: 平和のうちに
  rationale: 平安、和解された状態、共同体的平和のいずれにも限定せず、前置詞句の幅を保持する。
theological_decisions:
- issue: 終末的文脈における αὐτῷ の機能と指示対象
  choice: 本文では『彼に見いだされる』とし、与格を受動文の行為者として表したうえで、指示対象を明示しない。
  alternative: 『彼の前で、しみも傷もない者と認められる』
  rationale: 文脈上は来るべき日に裁定する神的な方が想定されるが、原節は固有の称号を繰り返していない。また与格は行為者だけでなく、関係・臨在の意味にも理解できるため、その真正な曖昧さを脚注で示す。
- issue: ἐν εἰρήνῃ が示す平和の範囲
  choice: 『平和のうちに』とし、対象や種類を特定しない。
  alternative: 『彼との平和のうちに』または『心安らかに』
  rationale: 原文は平和の相手や内面的状態を明示していないため、神との和解、内的平安、共同体的平和のいずれかに限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、書簡の勧告にふさわしい落ち着いた品位を保った。「愛する人たち」は温かい呼びかけとして訳し、「力を尽くしなさい」で命令の真剣さを表した。
