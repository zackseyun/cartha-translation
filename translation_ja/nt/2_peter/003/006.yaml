lexical_decisions:
- source_word: δι’ ὧν
  choice: それらによって
  rationale: διάの属格による手段・媒介の意味と、関係代名詞が複数形であることを保つ。何を指すかは前節とのつながりに委ね、本文で限定しない。
- source_word: ὁ τότε κόσμος
  choice: 当時の世界
  rationale: τότεによる過去と現在との時間的対比を自然な現代日本語で示す。κόσμοςは単なる地球というより、その時代に存在した世界全体を指し得る。
- source_word: ὕδατι κατακλυσθεὶς
  choice: 水に覆われ
  rationale: 水を手段として洪水にのみ込まれたことを簡潔に表す。分詞の従属関係を「覆われ」で保ち、原文にない説明を加えない。
- source_word: ἀπώλετο
  choice: 滅びました
  rationale: 中動態・自動詞的な『滅びる』という意味を反映し、完全な消滅という形而上学的含意を不必要に持ち込まない。
theological_decisions:
- issue: 洪水による裁きの性質
  choice: 滅びました
  alternative: 滅ぼされました
  rationale: 原文は当時の世界に対する破局的な裁きを述べるが、絶対的な消滅まで断定しない。自動詞的な表現によって厳しさと解釈上の幅をともに保つ。
- issue: δι’ ὧνの指示対象
  choice: それらによって
  alternative: これらを通して
  rationale: 複数形の関係代名詞が前節の何を受けるかには解釈の余地があるため、『神のことばと水』などと本文で明示せず、原文の曖昧さを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の簡潔さと因果関係を保ちつつ、複数形の指示対象とἀπώλετοの態に関する曖昧さを脚注で示した。
