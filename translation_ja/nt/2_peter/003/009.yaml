id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: ja
  text: 主は、約束の実現が遅いのではありません[a]。ある人たちがそう考えるように遅いのではなく、あなたがたに対して忍耐しておられます[b][c]。だれかが滅びることを望まず、すべての人が悔い改めに至ることを望んでおられるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「約束を果たすのが遅いのではありません」。
    reason: lexical_alternative
  - marker: b
    text: または「あなたがたに対して辛抱しておられます」。
    reason: lexical_alternative
  - marker: c
    text: 「だれか」と「すべての人」が指す範囲については、特に手紙の読者を指すのか、より広く人類を指すのかで解釈が分かれます。ギリシア語本文はその範囲を明示的に限定していません。
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 神的・キリスト論的称号として、現代日本語の聖書文体で自然かつ簡潔に表した。
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: 約束の実現が遅いのではありません
  rationale: βραδύνει は「遅れる、遅い」を表す。属格 τῆς ἐπαγγελίας は約束との関係を示し、日本語では「約束の実現」と補うことで意味を自然にした。ただし原文に「実現する」という動詞が明示されない点は脚注に示した。
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: 遅いと考える人たちもいますが
  rationale: ἡγέομαι の「見なす、考える」を平明に訳し、βραδύνει／βραδύτητα の語の反復を「遅い」で保った。
- source_word: μακροθυμεῖ
  choice: 忍耐しておられます
  rationale: 長く耐えて性急に裁かない態度を表す語であり、文脈にふさわしい重みと自然さを備えた「忍耐する」を採用した。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに対して
  rationale: εἰς の方向性を保ち、主の忍耐が読者へ向けられていることを明確にした。
- source_word: μὴ βουλόμενός
  choice: 望まず
  rationale: βούλομαι の意志・願望を表しつつ、後代の神学的な意志区分を持ち込まない表現とした。後半では日本語として述語を補った。
- source_word: τινας ἀπολέσθαι
  choice: だれかが滅びること
  rationale: τινας を不定の「だれか」、ἀπολέσθαι を重みのある標準的表現「滅びる」とした。
- source_word: πάντας
  choice: すべての人
  rationale: 日本語では単独の「すべて」より指示対象が自然に伝わるため「人」を補ったが、その範囲は限定していない。
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: 悔い改めに至る
  rationale: χωρέω の到達・移行の含意を「至る」で表し、μετάνοια は標準的で意味の定着した「悔い改め」とした。
theological_decisions:
- issue: 「あなたがた」「だれか」「すべての人」の範囲
  choice: 対象を原文以上に限定せず、「あなたがたに対して……だれか……すべての人」と訳す
  alternative: 「だれか」と「すべての人」を手紙の読者・選ばれた者だけ、または全人類と明示的に解釈する
  rationale: ギリシア語は範囲を明示的に限定していないため、後代の教理論争によって狭めたり広げたりせず、その緊張を保持した。脚注でも解釈上の相違を知らせた。
- issue: βούλομαι が表す神の意志の性質
  choice: 「望む」と訳す
  alternative: 「定める」「意図する」または専門的な神学用語で訳す
  rationale: 語が表す意志・願望をそのまま伝え、神の意志に関する体系神学的区分を本文へ導入しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬体で統一した。「遅い」の反復によって原文の修辞を保ちつつ、長い一文を読みやすく区切った。本文中の脚注記号は、内容に対応する箇所へすべて配置した。
