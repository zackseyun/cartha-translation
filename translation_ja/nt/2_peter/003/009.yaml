  terminology: 「主」「忍耐しておられます」「滅びる」「悔い改め」は、文脈と現代日本語の聖書翻訳として適切です。「望む」は βουλόμενος の意志・願望を、神学的に過度に限定せず表せています。「すべての人」は πάντας の自然な補足であり、範囲を教理的に限定していません。
