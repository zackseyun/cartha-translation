id: 2PE.3.8
reference: 2 Peter 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: ja
  text: しかし、愛する人たち、この一つのことを見落としてはなりません[a]。主のもとでは、一日は千年のようであり[b][c]、千年は一日のようです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この一つのことを知らずにいてはなりません」。
    reason: lexical_alternative
  - marker: b
    text: ここで「よう」と訳した語は比較を表しており、一日と千年を文字どおり同一とする表現ではありません。
    reason: cultural_note
  - marker: c
    text: 詩篇90篇4節を反映しています。
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: しかし、この一つのこと
  rationale: Ἓν と τοῦτοが示す「一つの特定の事柄」という強調を保ち、δὲの展開・対比を自然な日本語の「しかし」で表した。
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: 見落としてはなりません
  rationale: λανθάνωの「気づかれずにいる、注意を逃れる」という意味と禁止命令の力を、明瞭で自然な現代日本語で表した。
- source_word: ἀγαπητοί
  choice: 愛する人たち
  rationale: 共同体の仲間に対する親愛を保ちつつ、現代の一般読者にも分かりやすい呼びかけとした。
- source_word: παρὰ κυρίῳ
  choice: 主のもとでは
  rationale: παρά＋与格が表し得る近接・臨在・観点を過度に限定せず、「主にとっては」よりも原文の幅を残す表現とした。
- source_word: μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη
  choice: 主のもとでは、一日は千年のようであり
  rationale: ὡςを同一性ではなく比較として明示し、語順と対照構造を自然な日本語で保った。
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: 千年は一日のようです
  rationale: 前半との釣り合いを保ち、補われる連結動詞を日本語で明示して読みやすくした。
- source_word: χίλια ἔτη
  choice: 千年
  rationale: 数量表現をそのまま訳し、象徴的意味や換算規則を訳文に持ち込まなかった。
theological_decisions:
- issue: 時間に関する比較の性質
  choice: 「ようである」と訳し、主と時間との関係についての類比として示す。
  alternative: 一日と千年を文字どおり等しいものとする、または終末の年代計算の換算式として表す。
  rationale: 二度用いられるὡςは同一性ではなく比較を示す。訳文ではこの類比を保ち、特定の預言的年代体系を読み込まない。
- issue: παρὰ κυρίῳが示す関係
  choice: 「主のもとでは」とし、主の臨在と観点の双方を含み得る表現にする。
  alternative: 「主にとっては」または「主の目には」として観点だけに限定する。
  rationale: παρά＋与格には近接・臨在と評価上の観点が重なり得るため、一方に狭く決めない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒書簡にふさわしい落ち着きと品位を保った。「愛する人たち」は親愛の呼びかけを堅苦しくせず伝え、「主のもとでは」は原文の関係的・視点的な幅を残している。
