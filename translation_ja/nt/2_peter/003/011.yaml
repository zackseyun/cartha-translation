source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: ja
  text: このように、これらすべてのものが解かれていくのですから[a]、あなたがたは、聖なる生き方と敬虔さにおいて、どのような者であるべきでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「滅ぼされる」。ギリシア語は、より直訳的には「解かれる」「分解される」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: これらすべてのもの
  rationale: 直前に述べられた被造世界の諸要素を指す属格句。「もの」を補い、現代日本語として自然にした。
- source_word: οὕτως
  choice: このように
  rationale: λυομένωνの様態を示す副詞として、その働きを明確に保った。
- source_word: λυομένων
  choice: 解体されていく
  rationale: λύωの「解く、ばらばらにする」という語感と現在受動分詞の進行的な表現を保ちつつ、終末における現秩序の崩壊を過度に解釈せず表した。
- source_word: ποταποὺς
  choice: どのような者
  rationale: 人の種類・性質を問う修辞疑問として、倫理的な重みを保つ自然な日本語とした。
- source_word: δεῖ
  choice: べき
  rationale: 文脈上の道徳的必要性を簡潔に表し、「ねばならない」ほど命令的に響かせない表現とした。
- source_word: ὑπάρχειν
  choice: ある
  rationale: δεῖおよび対格主語ὑμᾶςとの構文に従い、「どのような者であるべきか」と自然に訳した。
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: 聖い生き方において
  rationale: ἀναστροφήが表す生活態度・行状を「生き方」とし、複数形は日本語で自然な集合的単数にした。
- source_word: εὐσεβείαις
  choice: 敬虔さ
  rationale: 神への畏敬と、それが生活に現れる信心深さを表す語として、簡潔で定着した訳語を用いた。
theological_decisions:
- issue: 終末における世界の運命の描写
  choice: λυομένωνを「解体されていく」と訳した。
  alternative: 「滅ぼされる」「崩れ去る」
  rationale: ギリシア語は文字どおりには「解かれる、ばらばらにされる」と述べるため、「滅ぼされる」と意味を強めず、現秩序がほどかれる語感を残した。また現在分詞の形を「ていく」で反映した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の厳粛さを保った。「聖い」は倫理的・神への献身という聖書的含意を維持し、「敬虔さ」はやや格調を保ちながら一般読者にも理解できる語として選んだ。
