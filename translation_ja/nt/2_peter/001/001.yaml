reference: 2 Peter 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: ja
  text: メシアであるイエスの奴隷であり使徒であるシメオン・ペテロから、私たちの神であり救い主であるイエス・メシアの義によって[b]、私たちと等しく尊い信仰[a]を授かった人々へ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちと同等の身分を持つ信仰」。この形容詞は、価値、名誉、または特権が等しいことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「義のうちに」。文脈により、「義を通して」「義に基づいて」とも理解できる。前置詞は領域または手段を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: シメオン・ペテロ
  rationale: 底本のΣυμεώνを「シモン」ではなく「シメオン」と音写し、Πέτροςは日本語で定着した「ペテロ」とした。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 単なる奉仕者ではなく、主人に全面的に属する者という語義を保つため、「僕」や「しもべ」ではなく「奴隷」とした。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 遣わされて権威ある務めを担う者を指す、定着した正確な訳語である。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστόςを単なる固有名の一部としてではなく、「メシア」という称号として明示した。
- source_word: τοῖς ... λαχοῦσιν
  choice: 授かった人々
  rationale: 信仰が自力で獲得されたのではなく、割り当てられ、受けたものであるという含みを自然な日本語で表した。
- source_word: ἰσότιμον ... πίστιν
  choice: 私たちと等しく尊い信仰
  rationale: ἰσότιμοςが表す価値・尊さ・特権の平等を簡潔に表し、使徒たちの信仰と受取人の信仰が同等であることを保った。
- source_word: πίστιν
  choice: 信仰
  rationale: この文脈では信じる者たちが共有する信仰を指すため、標準的な「信仰」とした。
- source_word: ἐν δικαιοσύνῃ
  choice: 義によって
  rationale: ἐνは領域または手段を表し得るが、ここでは信仰を授かる根拠・手段として自然に読める「によって」を本文に採用し、別の可能性を注に残した。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: 神の正しさを指す神学的・聖書的用語として簡潔で定着している。
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: 私たちの神また救い主であるメシア、イエス
  rationale: 単一の冠詞のもとで二つの単数の人格名詞がκαίで結ばれる構文に従い、イエスを「神」と「救い主」の双方として示す一人称的な読みを採用した。
theological_decisions:
- issue: 「私たちの神また救い主であるイエス」が一人を指すか、「私たちの神」と「救い主イエス」という二者を指すか
  choice: 一人を指し、イエスが「私たちの神また救い主」と呼ばれている。
  alternative: 「私たちの神」と「救い主であるイエス」という二者を指す。
  rationale: τοῦという一つの冠詞が、καίで結ばれた二つの単数の人格名詞θεοῦとσωτῆροςを支配し、その後にἸησοῦ Χριστοῦが続くため、コイネー・ギリシア語では単一の指示対象が最も自然である。ただし神学的に重要な別解なので脚注に明記した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、書簡の冒頭にふさわしい簡潔で格調ある調子とした。「奴隷」は現代日本語では強い語だが、δοῦλοςの全面的な帰属という意味を弱めないため採用した。「メシアであるイエス」によってΧριστόςの称号性を明示した。
