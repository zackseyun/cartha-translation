reference: 2 Peter 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: ja
  text: というのも、このようにして、私たちの主であり救い主である、メシアであるイエスの永遠の王国に入ることが、あなたがたに豊かに備えられるからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「入ること」は「入場」とも訳せる。ギリシア語εἴσοδοςは、入る行為または入場を意味する。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「イエス・キリスト」。ギリシア語Χριστόςは、ここでは称号として「メシア」と訳している。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: このようにして、…のです
  rationale: οὕτωςは直前に述べられた歩み方を受け、「このようにして」とした。γάρの説明的なつながりは、現代日本語で自然な文末の「のです」によって表した。
- source_word: πλουσίως ἐπιχορηγηθήσεται
  choice: 豊かに与えられる
  rationale: πλουσίωςの潤沢さを「豊かに」で保ち、未来受動形は「与えられる」として、入ることが備えられるという受動性を維持した。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数二人称の与格を明示し、受益者を自然な日本語で示した。
- source_word: ἡ εἴσοδος
  choice: 入ること
  rationale: 場所としての入口ではなく、王国へ入ること・入場を表す文脈なので、平明な動作名詞句とした。別訳の可能性は脚注に示した。
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: 永遠の王国に
  rationale: αἰώνιοςを「永遠の」、βασιλείαを統治と領域の両義を保ち得る標準的な「王国」とした。εἰςは日本語の移動先を表す「に」で訳した。
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: 私たちの主であり救い主である
  rationale: 一つの冠詞のもとに二つの称号が並ぶ構文を、一人の人物に属する二称号として明瞭に表した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を「メシア」で示した。日本語では「イエス・メシア」が称号を伴う名として自然であり、伝統的表記は脚注に付した。
theological_decisions:
- issue: 「私たちの主であり救い主」の指示対象
  choice: 二つの称号はいずれも一人の人物、イエス・メシアを指す。
  alternative: 二つの称号を別々の指示対象に結び付ける読み。
  rationale: τοῦという単一の冠詞が、καίで結ばれた単数の二称号κύριοςとσωτήρを支配し、その後にἸησοῦ Χριστοῦが続くため、ギリシア語統語論上、一人の指示対象を表す読みが強い。
translation_notes:
  register: 現代標準日本語による、平明でありながら礼拝・朗読にも耐える格調を目指した。ギリシア語の未来受動と豊かさのニュアンスを保ちつつ、説明を示すγάρは不自然な文頭接続詞を避けて「のです」で表現した。
