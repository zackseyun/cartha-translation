  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: ja
  text: 神と私たちの主イエスを知ることにおいて、恵みと平安があなたがたにますます増し加えられますように。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神と私たちの主イエスを知ることを通して」。ギリシア語の前置詞は、領域（「〜において」）または手段（「〜を通して」「〜によって」）を表し得る。
    reason: alternative_reading
  - marker: b
    text: 「知ること」に当たるギリシア語は、「より深く知ること」や「より十分に知ること」という意味合いを持つことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: 書簡の祝福の定型表現であり、神からの好意という神学的な含意も自然に保つ。
- source_word: εἰρήνη
  choice: 平安
  rationale: 挨拶における伝統的かつ自然な訳語で、セム語的背景を含む豊かな意味を保持する。
- source_word: πληθυνθείη
  choice: ますます豊かに与えられますように
  rationale: アオリスト受動態希求法による願い・祝福を自然な現代日本語で表し、受動の意味も保つ。
- source_word: ἐν
  choice: において
  rationale: 領域を示す「〜において」を本文に採用し、手段を示す「〜を通して」の可能性は脚注に残す。
- source_word: ἐπιγνώσει
  choice: 知ること
  rationale: 単なる情報ではなく神とイエスを認識する関係的な意味にも対応する自然な表現。より強い「深く知ること」の含みは脚注に示す。
- source_word: τοῦ θεοῦ
  choice: 神
  rationale: ἐπιγνώσειに従属する属格として、「神を知ること」と自然に表す。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 固有名の標準的な日本語表記。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριοςのキリスト論的な称号としての重みと新約聖書の標準的用法を保つ。
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: 神と、私たちの主イエスを知ること
  rationale: 神とイエスの双方がἐπίγνωσιςの対象であることを明確にしつつ、原文の並列構造を保つ。読点は二者の区切りを読みやすくする。
theological_decisions:
- issue: ἐπίγνωσιςの強意的な含み
  choice: 知ること
  alternative: 深く知ること／十分な知識
  rationale: この語はより十分で深い認識を示し得るが、本文で強意を確定せず、自然な訳を採用して可能性を脚注に保存する。
- issue: ἐνとἐπιγνώσειの関係
  choice: 知ることにおいて
  alternative: 知ることを通して／知ることによって
  rationale: ギリシア語のἐνは領域と手段のいずれも表し得る。本文では形式に近い領域の表現を採り、手段の解釈を脚注に示して曖昧さを保持する。
- issue: 祝福文における受動態
  choice: 豊かに与えられますように
  alternative: 増し加わりますように
  rationale: 与え手を明示しない神的受動の可能性を保ちつつ、日本語として祝福の願いを自然に表す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。書簡の祝福として自然な「恵みと平安」「〜ますように」を用いた。「増し加えられる」の硬さを避けつつ、πληθυνθείηの受動性を「豊かに与えられる」で保持した。
