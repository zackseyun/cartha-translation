id: 2PE.1.17
reference: 2 Peter 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: ja
  text: というのも、イエスが父なる神から栄誉と栄光を受けたとき、荘厳な栄光から、このような声がイエスに届いたからです。「これはわたしの子、わたしの愛する者[a]。わたしはこの者を喜んだ[b]」——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これはわたしの愛する子」。ギリシア語はより字義的には、「これはわたしの子、わたしの愛する者」と二つを並べています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「わたしはこの者を喜んでいる」「わたしはこの者に満足している」。ギリシア語は字義的には過去形で、「わたしはこの者を喜んだ」に近い表現です。
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν
  choice: 受けたとき
  rationale: アオリスト分詞の時間的関係を自然な現代日本語で表し、文脈上の主語であるイエスを明示した。
- source_word: παρὰ θεοῦ πατρὸς
  choice: 父なる神から
  rationale: 属格を伴う παρά の起点・源の意味を「から」で表し、θεοῦ πατρὸς の二要素を自然な定型表現で保持した。
- source_word: τιμὴν καὶ δόξαν
  choice: 誉れと栄光
  rationale: 二つの名詞を区別して保持した。「誉れ」は高い文体を保ちつつ現代日本語でも理解できる。
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: 声がイエスに届いた
  rationale: φέρω の受動表現を日本語として不自然な「運ばれた」とせず、声がその人に至ったことを「届いた」で明瞭に表した。
- source_word: τοιᾶσδε
  choice: このような
  rationale: 直後の引用を先取りして指す語の働きを保った。
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: 荘厳な栄光から
  rationale: ὑπό がここで示し得る声の源を自然に表し、神を指す婉曲的で畏敬に満ちた表現を維持した。
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: これはわたしの子、わたしの愛する者
  rationale: 「わたしの子」と「わたしの愛する者」の同格構造、および μου の反復を保持した。
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: わたしはこの者を喜びとした
  rationale: εὐδόκησα のアオリストを過去形で残し、εἰς ὃν を日本語として理解可能な目的語表現にした。現在的な満足へ一義的に解消せず、原文の時制と慣用表現の緊張を脚注で示した。
theological_decisions:
- issue: τῆς μεγαλοπρεποῦς δόξης の神的婉曲表現
  choice: 荘厳な栄光
  alternative: 威光に満ちた栄光／大いなる栄光
  rationale: 神の栄光ある臨在を指す可能性の高い表現を、単に「神」と言い換えず、その婉曲性と畏敬の響きを保った。
- issue: 父の宣言における同格表現
  choice: これはわたしの子、わたしの愛する者
  alternative: これはわたしの愛する子
  rationale: ὁ υἱός μου と ὁ ἀγαπητός μου を一つの名詞句に畳まず、原文の反復と強調を保持した。
- issue: εὐδόκησα の時制と意味
  choice: わたしはこの者を喜びとした
  alternative: わたしはこの者を喜んでいる／この者を心から喜ぶ
  rationale: アオリストの形を反映しつつ、神の評価を過去だけに限定する解釈は脚注によって避けた。福音書の並行表現との響きも保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神的宣言にふさわしい端正で荘重な調子を保った。「荘厳な栄光」「誉れ」は文脈上の格調を支えるが、難解な古語は避けた。節末のダッシュは文が次節へ続くことを示すため保持した。
