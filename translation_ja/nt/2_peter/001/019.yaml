id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: ja
  text: こうして私たちには、いっそう確かな預言の言葉があります[a]。暗い所で輝くともしびに目を向けるように、この言葉に心を留めるのはよいことです。日が明け、明けの星[b]があなたがたの心のうちに昇るまで。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちには、より確かな預言の言葉があります」とも訳せます。ギリシア語は、預言の言葉が使徒たちの目撃証言によって確証されたという意味にも、預言の言葉そのものの確かさを強調する意味にも理解できます。
    reason: alternative_reading
  - marker: b
    text: 「明けの星」はメシアを示すイメージを響かせている可能性があります。黙示録22章16節参照。
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: いっそう確かな
  rationale: 比較級の意味を明示しつつ、それが使徒の証言によって確かにされたという意味か、預言の言葉自体の確かさを強調するのかを本文で決め切らない表現とした。
- source_word: τὸν προφητικὸν λόγον
  choice: 預言の言葉
  rationale: 形容詞的な「預言の」と「言葉」の両要素を保ち、現代日本語として自然で格調のある表現とした。
- source_word: ᾧ ... προσέχοντες
  choice: この言葉に心を留める
  rationale: 注意を向け続けるという προσέχω の意味を、分かりやすく自然な日本語で表した。
- source_word: λύχνῳ φαίνοντι
  choice: 輝くともしび
  rationale: 継続して光を放つ比喩を簡潔に保った。「ともしび」は聖書的な格調を持ちながら現代の読者にも理解できる。
- source_word: ἐν αὐχμηρῷ τόπῳ
  choice: 暗い所で
  rationale: αὐχμηρός の薄暗い、陰鬱な性質を、ともしびとの対照が明瞭になる自然な日本語で表した。
- source_word: ἕως οὗ ἡμέρα διαυγάσῃ
  choice: 夜が明け…まで
  rationale: 直訳的な「日が明ける」より自然な日本語で、光が差して昼になる夜明けの比喩を保持した。
- source_word: φωσφόρος
  choice: 明けの明星
  rationale: 文脈上の朝の星を表す、日本語で定着した格調ある表現。後代の別の連想を避け、天体の比喩を保つ。
- source_word: ἀνατείλῃ
  choice: 昇る
  rationale: 星のイメージに最も自然に対応し、現れるという意味も文脈上伝える。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: あなたがたの心のうちに
  rationale: 内なる人を指す聖書的な「心」を保ち、感情だけに限定する説明を本文へ加えなかった。
theological_decisions:
- issue: βεβαιότερον と使徒の目撃証言・預言との関係
  choice: 「いっそう確かな」とし、比較級を保ちながら、確かにされた原因を本文で明示しない。
  alternative: 「いっそう確かなものとされた」または「さらに確実な預言の言葉」
  rationale: ギリシア語は、先行する使徒の目撃証言によって預言が確証されたとも、預言の言葉の確かな性質を強調しているとも理解できる。日本語本文ではこの曖昧さと神学的緊張を保った。
- issue: 「明けの明星」の指示対象
  choice: 比喩をそのまま訳し、本文ではキリストと明示しない。
  alternative: メシア／キリスト、または終末的な啓明を明示する。
  rationale: メシア的な響きはあり得るが、この節自体は指示対象を明言していないため、解釈を本文に持ち込まなかった。
- issue: 「あなたがたの心のうちに」が修飾する出来事
  choice: 語順に従い、「明けの明星が…心のうちに昇る」に結び付けた。
  alternative: 夜明けと明星の双方を内面的出来事として広く理解する。
  rationale: 原文の統語と語順を自然に反映しつつ、終末的出来事か内面的照明かという含意を説明的に限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「預言の言葉」「ともしび」「明けの明星」で尊厳と聖書的な比喩を保った。長いギリシア語文は二文に分け、普通の読者が論理関係を追いやすくした。脚注記号は対応箇所にすべて明示した。
