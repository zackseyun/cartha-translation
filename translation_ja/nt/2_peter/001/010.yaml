  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: ja
  text: ですから、兄弟たち[a]、あなたがたの召しと選びを確かなものにするよう、いっそう努めなさい。これらのことを行うなら、決してつまずくことはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、信じる共同体全体を含めて呼びかけている場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の勧めを受けた論理的帰結を、明瞭で自然な現代日本語で示す。
- source_word: μᾶλλον
  choice: いっそう
  rationale: 命令を強める比較の力を簡潔に保つ。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文に反映しつつ、共同体全体を含み得る用法は脚注で示す。
- source_word: σπουδάσατε
  choice: 励みなさい
  rationale: 熱心に努めるよう求める命令を、自然で品位ある勧告表現にする。
- source_word: βεβαίαν
  choice: 確かなもの
  rationale: 堅固で確証された状態を表し、特定の教理体系へ意味を狭めない。
- source_word: κλῆσιν
  choice: 召し
  rationale: 神からの呼びかけを表す新約聖書上の語として、簡潔で定着した訳語を用いる。
- source_word: ἐκλογὴν
  choice: 選び
  rationale: 神が選ぶことを表しつつ、一般の読者にも理解しやすく、過度に術語的でない訳語とする。
- source_word: ποιεῖσθαι
  choice: ものとする
  rationale: 召しと選びを確固たるものにするという使役的な意味を保ち、それらを人が新たに生じさせるとの解釈には限定しない。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 前段で挙げられた徳と実践を指す指示表現を明示する。
- source_word: ποιοῦντες
  choice: 行っているなら
  rationale: 継続的な実践と文脈上の条件的な関係を自然な日本語で表す。
- source_word: οὐ μὴ ... ποτε
  choice: 決して…ことはありません
  rationale: 強い否定を自然な日本語で再現する。
- source_word: πταίσητέ
  choice: つまずく
  rationale: 原文の比喩を保ち、無罪性や最終的背教のいずれかへ意味を不必要に限定しない。
theological_decisions:
- issue: 「召しと選びとを確かなものとする」の意味
  choice: 信仰に伴う徳を実践することによって、神の召しと選びを確固たるものとして確認するよう促す表現
  alternative: 人間の努力が神の召しや選びそのものを成立させる、またはその地位を獲得するという読み
  rationale: ποιεῖσθαι と βεβαίαν の組み合わせは確立・確認の意味を持つが、その仕方を特定の教派的枠組みに固定しない。「確かなものとする」は原文の緊張を保つ。
- issue: 「決してつまずくことはありません」の範囲
  choice: これらを実践する者がつまずかないという強い約束を、比喩のまま表す
  alternative: 一切の罪を犯さないとの絶対的保証、または最終的背教だけに限定した保証
  rationale: πταίω の比喩的な幅を保持し、文脈以上に無罪性や特定の堅忍論へ狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、勧告としての品位を保った。「召し」「選び」は聖書的な連続性を保ちつつ理解可能な表現とし、文の論理関係と強い否定を自然に示した。
