review_pass:
  verdict: revise
  source_fidelity: 全体として原文の論理関係と譲歩の意味をよく伝えています。しかし、ἐστηριγμένους（完了受動分詞）は「堅く立てられて」より「堅く据えられている」とするほうが、日本語として自然に、真理の中で確立された状態という意味を正確に表せます。また脚注記号は、対応する句「今ある真理」の直後に置く必要があります。
  naturalness: 原案は理解可能ですが、「真理に堅く立てられて」は現代日本語ではやや不自然です。「真理に堅く据えられている」は品位を保ちつつ明瞭です。「いつも」より「いつでも」は、この文脈での話者の継続的な意向・用意を自然に表します。
  terminology: 「真理」は適切です。「今ある真理」はπαρούσῃの解釈上の含みを狭めずに保っています。脚注の「今あなたがたが持っている真理に」は有効な代替訳です。
  issues:
