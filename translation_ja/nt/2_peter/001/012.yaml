  rationale: 譲歩節を先行させる日本語の構文は維持しました。「堅く据えられている」により、ἐστηριγμένουςの完了受動的な確立状態を自然な現代標準日本語で表しました。「いつでも」は、μελλήσωとἀείが示す、繰り返し思い起こさせようとする意向を自然に表します。脚注アンカーを「今ある真理」の直後へ移しました。
