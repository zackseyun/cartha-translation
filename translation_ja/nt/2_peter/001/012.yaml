  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: ja
  text: ですから、あなたがたはこれらのことを知っており、今ある真理[a]に堅く据えられてはいますが、私はいつでも、これらのことをあなたがたに思い起こさせるつもりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今あなたがたが持っている真理に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の議論から結論を導く推論の接続詞。現代日本語で論理的なつながりを自然に示す。
- source_word: μελλήσω ἀεὶ ... ὑπομιμνῄσκειν
  choice: 私はいつも……思い起こさせようと思います
  rationale: μέλλωの未来形が表す継続的な意志・意向を、ἀείの「いつも」とともに自然に表した。「間もなく」という切迫性には限定しない。
- source_word: περὶ τούτων
  choice: これらのことを
  rationale: 想起を促す内容を示す。日本語では「これらのことについて思い起こさせる」よりも目的語として表すほうが自然で明瞭。
- source_word: καίπερ εἰδότας
  choice: 知っており……ではいますが
  rationale: 譲歩の意味を保ちつつ、日本語の文構造に合わせて後続の分詞とまとめた。
- source_word: ἐστηριγμένους
  choice: 堅く立てられて
  rationale: 完了受動分詞の、すでに確立され現在もその状態にあるという意味と受動態を保つ。「確立されて」より平明で、στηρίζωの比喩も伝える。
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: 今ある真理に
  rationale: παρούσῃの「現在ある／そこにある」という意味を簡潔に示し、特定の時代区分を表す専門的な教理用語にはしない。
theological_decisions:
- issue: 「今ある真理」の意味
  choice: 今ある真理に
  alternative: 今あなたがたが持っている真理に／あなたがたの間にある真理に
  rationale: 原文は、その真理が読者に現在与えられている、保持されている、または彼らのもとにあるという複数の理解を許す。本文では簡潔な表現を採り、脚注で主要な別訳を示して、特定の神学体系に限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ギリシア語の譲歩構文を日本語として自然な順序に組み替えた。脚注記号[a]は、該当する「今ある真理」の直後ではなく文末に置いたため参照範囲がやや広く見えるが、刊行本文では句の直後に置くのが望ましい。
