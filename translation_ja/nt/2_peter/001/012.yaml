    issue: ἐστηριγμένουςの日本語表現がやや不自然
    rationale: 「堅く立てられて」は文法上は可能でも、真理の中で確立・堅固にされた状態をいう日本語としてぎこちない表現です。「堅く据えられている」は受動的結果状態とἐν τῇ...ἀληθείᾳの関係を自然に伝えます。
  - severity: low
    issue: 脚注記号の位置
    rationale: 脚注は「今ある真理」というπαρούσῃ ἀληθείᾳに関する別訳なので、文末ではなく当該句の直後に置く必要があります。
