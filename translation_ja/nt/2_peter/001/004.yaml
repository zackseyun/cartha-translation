revisions:
- from: これらを通して、尊く、この上なく大きな約束が私たちに与えられました。それは、これらの約束を通して、あなたがたが神の本性にあずかる者となり[a]、欲望によって世にある腐敗を免れるためです。[b]
  to: これらを通して、尊くこの上なく大きな約束が私たちに与えられました。それは、これらの約束を通して、あなたがたが神の本性にあずかる者となり[a]、欲望による、世にある腐敗を免れるためです。[b]
  rationale: 「欲望によって」が「免れる」に係るという日本語上の誤読を防ぐため、欲望が腐敗に関わることを明示した。後半の分詞は、日本語では主目的節に並べて表し、厳密な時間順序を固定していない。脚注記号はそれぞれ「神の本性にあずかる者」と節末の欲望に関する注記に正しく対応している。
