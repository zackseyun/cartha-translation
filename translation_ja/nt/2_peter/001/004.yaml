  timestamp: '2026-07-19T02:42:06Z'
review_pass:
  verdict: revise
  source_fidelity: 本文後半の「欲望によって世にある腐敗を免れる」は、日本語では「欲望を手段として腐敗を免れる」と読まれ得る。しかしギリシア語のἐν ἐπιθυμίᾳはφθορᾶς（腐敗）に関わり、欲望が腐敗の原因・領域であることを示す。これを「欲望による、世にある腐敗」として修正する必要がある。δι’ ὧνの先行詞を「これら」と保留し、διὰ τούτωνを直前の約束に結びつける処理、またθείας κοινωνοὶ φύσεωςを「神の本性にあずかる者」とする処理は、原文に忠実である。
  naturalness: 修正版は、欲望と腐敗との関係を誤解なく示しつつ、明瞭な現代標準日本語として自然である。「尊く、この上なく大きな」は意味を保つが、読点を除いた「尊くこの上なく大きな」のほうが一続きの修飾として読みやすい。
  terminology: 「約束」「神の本性」「あずかる者」「腐敗」はこの文脈に適切である。「神の本性にあずかる」は、参与の強い表現を保持しながら、本質的な神格化を訳文自体で断定しない。「欲望」は文脈上の否定性を保ち、性的意味に狭まりやすい「情欲」を避ける点でも適切である。
  issues:
  - severity: high
    issue: 「欲望によって」の係り先が不適切である。
    rationale: 現行文は「欲望によって……腐敗を免れる」となり、欲望が逃避の手段であるかのような逆の意味になり得る。原文では欲望は世にある腐敗に結びつくため、「欲望による、世にある腐敗」とする。
  - severity: low
    issue: 「尊く、この上なく大きな」の読点。
    rationale: 二つの形容を対等に示す意図は理解できるが、読点なしのほうが現代日本語では自然である。
  revised_text: これらを通して、尊くこの上なく大きな約束が私たちに与えられました。それは、これらの約束を通して、あなたがたが神の本性にあずかる者となり[a]、欲望による、世にある腐敗を免れるためです。[b]
  revised_footnotes:
