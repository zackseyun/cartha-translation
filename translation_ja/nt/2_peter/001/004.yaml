id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: ja
  text: これらを通して、尊くこの上なく大きな約束が私たちに与えられました。それは、これらの約束を通して、あなたがたが神の本性にあずかる者となり[a]、欲望による、世にある腐敗を免れるためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の本性を共有する者」とも訳せる。この表現は神から来るものにあずかることを語っており、人が本質において神になるという意味ではない。
    reason: lexical_alternative
  - marker: b
    text: 「欲望の中にある」とも訳せる。原語は一般的な願望を指すこともあるが、ここでは世にある腐敗と結びついており、否定的な意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: これらを通して
  rationale: 属格を伴うδιάの媒介・手段の意味を表す。関係代名詞の先行内容を特定しすぎず、前節とのつながりを保つ。
- source_word: τίμια καὶ μέγιστα
  choice: 尊く、この上なく大きな
  rationale: τίμιαの価値・尊さと、μέγισταの最上級的な強意を、自然で格調ある現代日本語で示す。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 授与の受け手を示す与格を素直に訳す。
- source_word: ἐπαγγέλματα
  choice: 約束
  rationale: 神による確かな約束を表す、この文脈で標準的かつ明瞭な訳語。
- source_word: δεδώρηται
  choice: 与えられました
  rationale: 完了形の、すでに授けられ現在も効力を持つ含意を文脈に委ねつつ、受動形で自然に表す。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を明確に示し、長い日本語文でも論理関係が分かる構文とする。
- source_word: διὰ τούτων
  choice: これらの約束を通して
  rationale: 指示語が直前の約束を受けることを日本語で明瞭にし、διάの媒介的意味を保持する。
- source_word: γένησθε
  choice: ……者となり
  rationale: γίνομαιの『なる』という変化の含意を保つ。
- source_word: θείας κοινωνοὶ φύσεως
  choice: 神の本性にあずかる者
  rationale: κοινωνόςの参与・共有の意味を『あずかる』で表し、強い表現を弱めず、存在の本質における神格化とも断定しない。
- source_word: ἀποφυγόντες
  choice: 免れる
  rationale: 分詞が示す脱出を、目的節の中で自然な日本語に統合する。参与との時間的・論理的関係を過度に限定しない。
- source_word: φθορᾶς
  choice: 腐敗
  rationale: この箇所の倫理的・霊的な損壊を表しつつ、語の持つ滅び・朽ちの含みも残す。
- source_word: ἐν τῷ κόσμῳ
  choice: 世にある
  rationale: φθοράを修飾する位置関係を簡潔に再現する。
- source_word: ἐν ἐπιθυμίᾳ
  choice: 欲望によって
  rationale: ἐνの手段・領域的な関係を『によって』で示す。ἐπιθυμία自体は一般に『願望』も意味し得るため本文では語義を狭めすぎず、文脈上の否定的意味は『腐敗』との結びつきで伝える。
theological_decisions:
- issue: θείας κοινωνοὶ φύσεωςにおける参与
  choice: 神の本性にあずかる者
  alternative: 神の性質を共有する者／神の本性に参与する者
  rationale: 神から来るものへの現実的な参与を示す本文の強さを保ちながら、信者が本質的に神そのものになるという解釈も、特定の後代教理による限定も訳文に持ち込まない。
- issue: ἐπιθυμίαの倫理的含意
  choice: 欲望
  alternative: 悪い欲望／情欲
  rationale: 文脈上は明らかに否定的だが、原語そのものは常に悪を意味するわけではない。『情欲』の性的な狭さや、『悪い』という説明的付加を避け、腐敗との結びつきによって負の意味を伝える。
- issue: ἀποφυγόντεςと目的節の関係
  choice: あずかる者となり、……免れるため
  alternative: ……免れた者として、神の本性にあずかる者となるため
  rationale: ギリシア語のアオリスト分詞は先行的にも付随的にも理解され得る。日本語本文では両者を目的の内容として並べ、厳密な時間順序を教理的に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「尊く、この上なく大きな」で二つの形容表現の力を残し、「あずかる」は一般読者にも理解でき、かつ神学的緊張を保持する語として選んだ。脚注記号[a]は該当句の直後、[b]は節末に置いた。
