id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: ja
  text: 私たちがあなたがたに、私たちの主イエス・キリストの力と来臨[a]を知らせたのは、巧妙に作り上げられた作り話に従ったからではなく、その方の威厳を目撃した者となったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「来臨」と訳したギリシア語は、「臨在」または「到来」とも訳せる。新約聖書ではしばしば、メシアであるイエスが来られることを指す。
    reason: alternative_reading
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: 巧妙に作り上げられた作り話
  rationale: 完了受動分詞が、話が巧みに考案・捏造されたものであることを示す。「作り話」は現代日本語で自然に否定的含意を伝える。
- source_word: ἐξακολουθήσαντες
  choice: 従ったから
  rationale: 後続の対比とともに、知らせたことの根拠を否定する分詞として自然な日本語にした。
- source_word: ἐγνωρίσαμεν
  choice: 知らせた
  rationale: γνωρίζωの「知らせる、明らかにする」という意味と、与格ὑμῖνを簡潔に表す。
- source_word: δύναμιν
  choice: 力
  rationale: δύναμιςの基本的な意味を直接的かつ自然に表す。
- source_word: παρουσίαν
  choice: 来臨
  rationale: ここでは主イエスの終末的な到来を指す可能性が高い。「来臨」は聖書文体として定着している一方、語義上の幅は脚注に残した。
- source_word: κυρίου
  choice: 主
  rationale: イエスに対する称号としてのκύριοςを、標準的な聖書用語で表す。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: 日本語では「イエス・キリスト」がΧριστόςの称号的背景を保ちつつ広く理解される定着表現であり、「イエス・メシア」より自然である。
- source_word: ἐπόπται
  choice: 自分の目で見た者
  rationale: 単なる証人ではなく、直接目撃した者という証拠的な力を平明な現代日本語で表す。
- source_word: γενηθέντες
  choice: 者なのです
  rationale: 前半の否定に対するἀλλάの強い対比を、日本語では独立文と説明的終止で明確にした。
- source_word: μεγαλειότητος
  choice: 威光
  rationale: μεγαλειότηςが示す荘厳な偉大さを、変貌の場面にも適する簡潔で格調ある語で表す。
- source_word: ἐκείνου
  choice: あの方の
  rationale: 直前の主イエスを指す強意的な指示を残しつつ、敬意を伴う自然な日本語にした。
theological_decisions:
- issue: キリスト論的文脈におけるπαρουσία
  choice: 来臨
  alternative: 臨在、到来
  rationale: 新約のイエスに関する用法では終末的な到来を指すことが多く、ここでも「力」と結ばれてその理解が有力である。ただし語そのものは臨在や到着も意味し得るため、脚注で曖昧さを保持した。
- issue: Χριστόςを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは「油注がれた者」という称号だが、現代日本語では「イエス・キリスト」が最も自然で広く理解される。「メシア」という意味を脚注で明示し、称号性を保った。
- issue: 目撃の対象と来臨との関係
  choice: 本文では関係を説明せず、原文の並置を保持
  alternative: 変貌の出来事が来臨の先取りだったと明示する
  rationale: 文脈上は変貌への言及が有力だが、この一節自体はその解釈を明言していないため、本文に説明を加えなかった。
translation_notes:
  register: 平明な現代標準日本語を基調としつつ、「来臨」「威光」で聖書本文にふさわしい格調を保った。長いギリシア語の一文は二文に分け、否定と目撃証言の対比を明瞭にした。脚注記号[a]は該当語の直後に置いた。
