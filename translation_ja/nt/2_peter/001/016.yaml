    rationale: οὐ … ἀλλάは、「巧妙に作られた物語に従ったのではなく、目撃者となったことによって知らせた」という対照を形成する。現訳第二文は事実の説明として読め、知らせた行為との結び付きが明示されない。
  - severity: low
    issue: 「作り話に従ったから」という連語がやや不自然である。
    rationale: 「作り話に従う」は理解できるが、日本語では「物語に従って知らせる」よりも、対比を伴う「物語に従ったのではなく」が自然である。
