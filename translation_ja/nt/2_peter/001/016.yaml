revisions:
- from: 私たちがあなたがたに、私たちの主イエス・キリストの力と来臨[a]を知らせたのは、巧妙に作り上げられた作り話に従ったからではありません。私たちは、あの方の威光を自分の目で見た者なのです。
  to: 私たちがあなたがたに、私たちの主イエス・キリストの力と来臨[a]を知らせたのは、巧妙に作り上げられた作り話に従ったからではなく、その方の威厳を目撃した者となったからです。
