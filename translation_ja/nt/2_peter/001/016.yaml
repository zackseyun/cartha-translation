  source_fidelity: 原文の主張と対比は概ね正確に伝わっている。ただし、「…知らせたのは、…従ったからではありません。私たちは…者なのです」という二文構成では、ἀλλά以下が「知らせた」ことの積極的な根拠・対照である関係がやや弱まる。原文の対比を一文で明示するのが安全である。
  naturalness: 「巧妙に作り上げられた作り話」は自然で、否定的評価を伴うμῦθοιを適切に表す。一方、「作り話に従ったから」はやや不自然であり、全体を一文にして「…に従ったのではなく、…となったからです」とすると、平明な現代標準日本語としても流れがよい。
  terminology: 「主イエス・キリスト」「力」「来臨」は適切である。「威光」も可能だが、明瞭な現代語としては「威厳」がより直接的にμεγαλειότης（majesty）を表す。παρουσίαの語義の幅を示す脚注も妥当である。
