    issue: ἡμεῖςの強調の表現が重複的
    rationale: 「私たちは」と「自分たち自身で」を併用すると、日本語では不必要な重なりとなる。明示代名詞の強調は「私たち自身が」として主語に集約するのが自然である。
  - severity: low
    issue: αὐτῷの訳語「あの方」
    rationale: 文脈上の指示対象はイエスであるが、ギリシア語は単なる代名詞である。「あの方」は敬称的なニュアンスを足すため、現代標準日本語では「彼」の方が形式上より中立的である。
  - severity: low
    issue: 脚注の別訳が冗長
    rationale: 脚注はἐνεχθεῖσανの語彙的代案を示すものなので、「天から運ばれて来た」と簡潔に示せば十分であり、本文全体の一部を繰り返す必要はない。
