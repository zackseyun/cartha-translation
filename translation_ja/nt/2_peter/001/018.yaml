  to: 私たち自身が、彼とともに聖なる山にいたとき、天からもたらされたこの声を聞いたのです。[a]
  rationale: 語順を整え、「私たち自身が」によってἡμεῖςの強調を自然に保持した。「彼とともに」はαὐτῷの代名詞性を保ちつつ、過度な敬称を避ける。「天からもたらされた」はἐνεχθεῖσανの受動性を維持し、「聖なる山」は原文どおり固有名を補わない。脚注は英語監査記録の語彙的代案に対応させて簡潔化した。
