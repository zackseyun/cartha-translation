reference: 2 Peter 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: ja
  text: 私たち自身が、彼とともに聖なる山にいたとき、天からもたらされたこの声を聞いたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天から運ばれて来た」。
    reason: ἐνεχθεῖσανは「運ばれた」とも訳せるため。
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: この声
  rationale: 直前の神の発言を指すため、「音」よりも発話を明確に表す「声」が適切である。指示語も保持した。
- source_word: ἡμεῖς
  choice: 私たちは…自分たち自身で
  rationale: 動詞の人称に加えて明示された代名詞の強調と、目撃証言としての力点を日本語で表した。
- source_word: ἠκούσαμεν
  choice: 聞きました
  rationale: 天からの声を聞いた出来事を表すアオリスト直説法であり、継続的に耳を傾けたという意味には限定しない。
- source_word: ἐξ οὐρανοῦ
  choice: 天から
  rationale: 起点を自然かつ簡潔に示す日本語である。
- source_word: ἐνεχθεῖσαν
  choice: もたらされた
  rationale: φέρωの受動分詞として、声が天から伝えられたという受動性を保つ。「運ばれた」より声との結びつきが自然である。
- source_word: σὺν αὐτῷ ὄντες
  choice: あの方とともに…いたとき
  rationale: 分詞構文の時間的関係を自然に表した。αὐτόςの指示対象は文脈上イエスだが、本文に固有名を補わず代名詞を保持した。
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: 聖なる山に
  rationale: 日本語では山上にいることを「山にいた」と自然に表せる。ἅγιοςは聖別された性格を示す「聖なる」とした。
theological_decisions:
- issue: 「聖なる山」が指す山
  choice: イエスの変貌が起きた山を描写的に「聖なる山」とし、固有名は示さない。
  alternative: タボル山またはヘルモン山と明示する。
  rationale: ギリシア語本文は山を「聖なる」と呼ぶだけで名称を記していないため、伝統的な比定を訳文に持ち込まない。
- issue: 天からの声の伝達を表す受動表現
  choice: 「天からもたらされた」とし、声が伝えられたという本文の受動性を保つ。
  alternative: 単に「天から聞こえた」として伝達の表現を平易化する。
  rationale: ἐνεχθεῖσανの語義を落とさず、行為者を本文以上に特定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「聖なる山」「天から」に聖書本文としての品位を保った。敬体で統一し、明示代名詞ἡμεῖςの強調は「自分たち自身で」で表現した。
