  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: ja
  text: 何よりもまず、このことを知っておきなさい。聖書のどの預言も、自分自身の解釈から生じるものではありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分自身の解釈」は直訳的な表現。原文は「自分自身」が誰を指すかを明記していないため、預言者自身の解釈とも、各人の解釈とも理解されます。「解釈」は「説明」または「解明」と理解することもできます。
    reason: ἰδίαςの指示対象とἐπίλυσιςの意味に関する原文の解釈上の幅を保つため。
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: 何よりもまず、このことを知っておきなさい
  rationale: 分詞句を日本語で自然な勧告として表現し、πρῶτονの優先性を明確にした。
- source_word: πᾶσα προφητεία γραφῆς
  choice: 聖書のどの預言も
  rationale: πᾶσαを否定辞と結びつけ、「一つとして……ない」という全称否定の意味が自然に伝わるようにした。γραφήはここでは聖なる書物を指すため「聖書」とした。
- source_word: ἰδίας ἐπιλύσεως
  choice: 預言者自身の解釈
  rationale: ἰδίαςが誰を指すかは文法上明示されないが、次節の「人の意志」「神から語った」との対比を踏まえ、預言を語った者自身を補った。ただし別解を脚注に示した。
- source_word: οὐ γίνεται
  choice: 生じるものではありません
  rationale: γίνεταιの生成・起源を表す含みを保ち、単に「解釈してはならない」という読者への禁止にしなかった。
theological_decisions:
- issue: ἰδίας（自身の）の指示対象
  choice: 預言者自身
  alternative: 聖書を読む各人自身／その預言そのもの
  rationale: 21節が預言の起源を人間の意志ではなく聖霊に置くため、預言者自身の解釈・説明から預言が生じたのではない、という流れが有力である。ただし原文は主体を明記していないため、脚注で曖昧さを保存した。
- issue: ἐπίλυσιςの意味
  choice: 解釈
  alternative: 説明／解明
  rationale: 通常の語義を採用したが、文脈上は読者による聖書解釈の規則よりも預言の由来を論じている可能性が高いので、「生じる」と組み合わせてその緊張を保った。
translation_notes:
  register: 現代標準日本語による、平明で品位ある文体。「知っておきなさい」で読者への働きかけを自然にし、「生じる」によって21節へ続く預言の起源という論旨を保持した。
