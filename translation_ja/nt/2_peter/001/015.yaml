  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: ja
  text: そして私は、私が世を去った後にも[a]、あなたがたがいつでもこれらのことを思い起こせるよう、力を尽くします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「私の出発の後」。ここでは私の死を婉曲に指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: 力を尽くします
  rationale: 将来形が表す真剣で熱心な努力を、自然で品位ある現代日本語で伝える。
- source_word: δὲ
  choice: そして
  rationale: 強い逆接ではなく、前節からの話の継続を示す接続として訳した。
- source_word: καὶ
  choice: …よう
  rationale: ここでは不定詞構文と結びつき、ペトロの努力の目的・結果を示す流れを日本語で自然に表した。
- source_word: ἑκάστοτε
  choice: いつでも
  rationale: 必要となるそれぞれの機会に、という継続的・反復的な意味を簡潔に表す。
- source_word: ἔχειν ὑμᾶς
  choice: あなたがたが…思い起こせる
  rationale: ἔχεινが表し得る能力・機会の意味を、日本語の可能表現によって自然に示す。
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: 私が世を去った後にも
  rationale: ἔξοδοςの「退出・旅立ち」という婉曲的比喩を保ちつつ、ここで死を指すことが普通の日本語読者にも理解できる表現とした。「にも」は、その後も想起できるという文脈上の継続を示す。
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: これらのことを思い起こせる
  rationale: 「記憶を行う」という直訳を避け、意識的に心に呼び戻すという慣用句の意味を自然に伝える。
- source_word: τούτων
  choice: これらのこと
  rationale: 直前までに強調された事柄を指す指示語の範囲を限定せず、そのまま保つ。
theological_decisions:
- issue: ペトロの迫る最期を指すἔξοδοςの意味
  choice: 世を去る
  alternative: 死ぬ／旅立つ／出て行く
  rationale: 死を指すことを明瞭にしながら、原語の婉曲的な「退出・旅立ち」の比喩を完全には消さない。「死んだ後」は明示的だが比喩を失い、「旅立った後」は日本語では意味が曖昧になり得る。脚注で直訳的意味と文脈上の意味を示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、使徒の死への言及には原文に対応する穏やかで品位ある婉曲表現を採用した。語順は日本語として読みやすく整えつつ、努力、その目的、死後、随時の想起という原文の要素を保持した。
