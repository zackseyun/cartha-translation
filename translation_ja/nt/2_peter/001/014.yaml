reference: 2 Peter 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: ja
  text: 私は、自分の幕屋を脱ぐ時が近いことを知っています。私たちの主イエス・キリストが私に明らかにしてくださったとおりです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の幕屋を脱ぐ」とは、ペトロが自分の迫る死を、一時的な住まいである幕屋を脱ぐことにたとえた表現。別訳「私の幕屋を取り去ること」。
    reason: lexical_alternative
  - marker: b
    text: 「近い」は「まもなく来る」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: 私は知っているからです
  rationale: 完了分詞の継続的な認識を表しつつ、前節で述べた行動の理由として自然につなぐ。
- source_word: ταχινή
  choice: 間近に迫っている
  rationale: 出来事が近いことを表す述語形容詞として、現代日本語で自然に切迫感を伝える。「まもなく」の可能性は脚注に残す。
- source_word: ἀπόθεσις
  choice: 脱ぎ捨てる時
  rationale: 衣服などを脱いで置くという語の比喩を保つ一方、日本語では出来事の時期について述べていることを自然に示す。
- source_word: σκηνώματός
  choice: 私の幕屋
  rationale: 身体を一時的な住まいにたとえる比喩を保持する。「体」と明示して比喩を解消しない。
- source_word: καθὼς καὶ
  choice: とおり
  rationale: 主イエスが示した内容との一致を簡潔で自然な日本語で表す。
- source_word: ὁ κύριος ἡμῶν
  choice: 私たちの主
  rationale: 共同体的な所有表現と、イエスに対するκύριοςの称号性をそのまま保つ。
- source_word: Ἰησοῦς Χριστὸς
  choice: イエス・キリスト
  rationale: 日本語で定着した尊称を用いる。キリストは固有の姓ではなく「メシア」を意味する称号である。
- source_word: ἐδήλωσέν μοι
  choice: 私に明らかにしてくださった
  rationale: 「明らかにする、知らせる」という意味を保ち、主を主語とする日本語として敬意を自然に表す。
theological_decisions:
- issue: ペトロの迫る死を表す比喩
  choice: 私の幕屋を脱ぎ捨てる時
  alternative: 私が死ぬ時／私が世を去る時
  rationale: 原文は死を直接言わず、身体的な生を一時的な幕屋にたとえているため、その比喩と神学的含意を残す。
- issue: ταχινήが示す時間的ニュアンス
  choice: 間近に迫っている
  alternative: まもなく来る／急に訪れる
  rationale: 文脈上は死の近さを示すと取るのが自然だが、「すぐに」という時間的な読みも可能なので脚注で示す。
- issue: Χριστόςの称号性
  choice: イエス・キリスト
  alternative: メシアであるイエス
  rationale: 日本語の自然で荘重な聖書文体を保ちながら、語が「メシア」という称号であることを脚注で明示する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、使徒書簡にふさわしい品位を保った。「幕屋」は日常語ではやや文語的だが、原文の一時的な住まいという比喩を保持するため採用した。
