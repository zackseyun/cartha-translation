id: 2PE.1.5
reference: 2 Peter 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: ja
  text: まさにこの理由から、あらゆる努力を傾け、あなたがたの信仰[a]に徳[b]を、徳に知識を加えなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」（πίστις）は、「信頼」または「誠実」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「徳」（ἀρετή）は、「道徳的な卓越性」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「加えなさい」と訳した語には、「十分に供給しなさい」「備えなさい」という含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: まさにこの理由から
  rationale: 直前の内容を受ける強調された移行句として、「このことそのものをも」のような逐語訳を避けつつ、理由を強く示す働きを自然な日本語で表した。
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: あらゆる努力を傾け
  rationale: 分詞を命令に伴う行為として表し、全力で熱心に取り組むという意味を、明瞭で現代的な表現にした。
- source_word: ἐπιχορηγήσατε
  choice: 加えなさい
  rationale: 一連の資質を次々に備える文脈を自然な日本語で示した。原語にある「十分に供給する、備える」という含みは脚注に残した。
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: あなたがたの信仰に
  rationale: 反復されるἐν＋与格の連鎖を、日本語で理解しやすい「～に…を」の形にし、資質同士の結びつきと進展を保った。
- source_word: πίστει
  choice: 信仰
  rationale: この文脈での中心的かつ簡潔な訳語。語義範囲に含まれる「信頼」「誠実」は脚注で示した。
- source_word: ἀρετήν
  choice: 徳
  rationale: 人格上・道徳上の優れた性質を表す簡潔で定着した訳語を選んだ。「道徳的な卓越性」という説明的な訳も脚注に示した。
- source_word: γνῶσιν
  choice: 知識
  rationale: γνῶσιςの基本的な意味を保ち、「識別力」などの解釈的な限定を加えなかった。
theological_decisions:
- issue: 徳目表におけるπίστιςの意味
  choice: 信仰
  alternative: 信頼、または誠実
  rationale: ここでは神への信仰を指すと読むのが最も自然だが、πίστιςには信頼や誠実という語義もあり得るため、本文で一義的に狭めず脚注に代案を残した。
- issue: ἐνによる徳目間の関係
  choice: 「信仰に徳を、徳に知識を加える」という連鎖
  alternative: 「信仰のうちに徳を、徳のうちに知識を備える」
  rationale: 原文は各資質の論理的関係を厳密には説明せず、ἐνを反復している。日本語として明瞭な追加の表現を採用しつつ、単なる機械的な段階や功績の体系だと断定する説明は加えなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、勧告としての格調を保った。「徳」はやや文語的だが現代でも理解可能で、短い徳目の連鎖に適する。読点と省略構文によって原文の連続性を保ちつつ、日本語として自然に読める形にした。
