  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: ja
  text: 敬虔には兄弟姉妹への親愛[a]を、兄弟姉妹への親愛には愛を加えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「兄弟への愛情」。このギリシャ語は兄弟姉妹への親愛を表し、キリスト教の文脈では特に信仰を同じくする仲間への親愛を指すことがある。
    reason: 語の基本義を示すとともに、文脈上の共同体的用法を本文に限定的に持ち込まず注で説明するため。
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: 敬虔
  rationale: 神への畏敬が生活や行いに表れることを指す語であり、「敬虔」は神に向かう面と倫理的な面の両方を簡潔に保つ。
- source_word: φιλαδελφίαν
  choice: 信仰の仲間への愛情
  rationale: 語義上は兄弟姉妹に対する親愛を表し、初期キリスト教の用法では特に信仰を同じくする者同士の愛情を指す。続くἀγάπηとの違いが見えるよう、ここでは「愛」ではなく「愛情」とした。
- source_word: ἀγάπην
  choice: 愛
  rationale: より広い意味を持つ語を簡潔に「愛」と訳し、φιλαδελφίαに続く徳目の展開を過度に限定しない。
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: …には…を加えなさい
  rationale: この節は前節から続く徳目の連鎖であり、ギリシャ語では動詞が省略されている。日本語では文脈上の命令「加えなさい」を補い、反復構造を保った。
- source_word: δέ
  choice: （「…には」の反復で接続を表現）
  rationale: ここでのδέは強い逆接ではなく、徳目を累加する緩やかな接続である。日本語では反復構文によって自然に表した。
theological_decisions:
- issue: φιλαδελφίαとἀγάπηの区別
  choice: 「信仰の仲間への愛情」と「愛」と訳し分ける
  alternative: 両者をそれぞれ「兄弟愛」と「愛」とする
  rationale: 原文は関連しながらも異なる二語を続けて用いている。「愛情」と「愛」を使い分けることで、信仰共同体内の親愛から、より広い愛へと進む表現を、範囲を断定しすぎずに保つ。
translation_notes:
  register: 明瞭で現代的な標準語を用いた。「敬虔」は聖書語として定着しているが現在も理解可能であり、文体の品位も保つ。原文で省略された動詞は前文脈に基づいて「加えなさい」と補った。
