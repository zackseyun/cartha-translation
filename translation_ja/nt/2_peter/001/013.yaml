id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: ja
  text: しかし、私がこの幕屋[a]にいるかぎり、思い起こさせることであなたがたを奮い立たせるのが適切だと考えています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幕屋」は「住まい」または「体」とも訳せる。ギリシア語では「幕屋」を意味し、ここではペトロがこの世で生きている間の死すべき体を比喩的に指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: 正しい
  rationale: ἡγοῦμαιとともに、道徳的・実際的にふさわしいとの判断を表す。「正しい」は現代日本語で自然であり、適切さの含みも保つ。
- source_word: δὲ
  choice: しかし
  rationale: 前節を受けた穏やかな対比・展開を示す。文脈上「しかし」が自然である。
- source_word: ἡγοῦμαι
  choice: 考えています
  rationale: 単なる思いつきでなく、熟慮した判断を表す。日本語として過度に硬くならない形にした。
- source_word: ἐφ’ ὅσον
  choice: …間は
  rationale: εἰμίと結びついて時間的に「…である限り」「…している間」を意味する。ここでは自然な「間は」とした。
- source_word: σκηνώματι
  choice: 幕屋
  rationale: 一時的な住まいである幕屋・天幕を指し、ここでは現在の死すべき身体的生を比喩的に表す。次節の「脱ぐ」とのつながりを保つため比喩を残した。
- source_word: διεγείρειν
  choice: 奮い立たせる
  rationale: 目覚めさせる、奮起させるという意味。ここでは読者を霊的・道徳的に促す文脈に自然である。
- source_word: ἐν ὑπομνήσει
  choice: 思い起こさせることによって
  rationale: 想起を促すことが、奮い立たせる手段であることを明示する。原文の手段・様態の関係を自然な日本語で表した。
theological_decisions:
- issue: 「この幕屋」が指すもの
  choice: 本文では「この幕屋」と比喩を直接保ち、注で身体的生を指すことを説明する。
  alternative: 「この体」「この住まい」と解釈的に訳す。
  rationale: 原文の移ろいやすい住まいという比喩と、次節でそれを脱ぐというイメージを保持しつつ、特定の教理的解釈を本文に加えないため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。比喩は保持しつつ、古風になりすぎない語順と表現にした。脚注記号は節末に置き、「幕屋」の比喩全体への説明であることを示した。
