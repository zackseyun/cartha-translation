id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: ja
  text: 神の力が、命と神を敬って生きることに関わるすべてのものを、ご自身の栄光と卓越性によって私たちを召してくださった方を知ることを通して、私たちに与えてくださったように、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς
  choice: このように
  rationale: 後に続く勧めとのつながりを保ちつつ、「なぜなら」として因果関係を過度に限定しない。
- source_word: θείας δυνάμεως αὐτοῦ
  choice: その方の神としての力
  rationale: θεῖοςが示す神的性質と、αὐτοῦの所有関係を自然な現代日本語で表した。
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: 命と、神を敬って生きるために必要なすべてのもの
  rationale: τὰ πρὸςの「～に関わる／～のための」という意味を明確にし、εὐσέβειαを一般読者にも分かる表現にした。「必要な」は、この句が示す目的・必要との関係を自然に表す。
- source_word: δεδωρημένης
  choice: 与えてくださいました
  rationale: 恵みとして授けられ、現在にも結果が及ぶ完了形の含みを、敬意を伴う自然な表現で示した。
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: 知ることを通して
  rationale: 手段を表すδιάを「通して」で保ち、ἐπίγνωσιςを過度に専門用語化せず人格的な認識として表した。
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: 私たちを召してくださった方
  rationale: 実体詞的分詞の人格性と、召しという聖書的概念を明瞭に保った。
- source_word: ἰδίᾳ
  choice: ご自身の
  rationale: 単なる所有以上に、本人固有のものであるという強調を反映した。
- source_word: δόξῃ
  choice: 栄光
  rationale: 神の威光と顕現された尊厳を表す標準的で重みのある訳語。
- source_word: ἀρετῇ
  choice: 卓越性
  rationale: ここでは人間の道徳的な「徳」に狭めず、神に属する優れた性質を広く表す。
- source_word: ζωὴν
  choice: 命
  rationale: 修飾語を補わず、現在と終末の双方に開かれた原語の広がりを保った。
- source_word: εὐσέβειαν
  choice: 神を敬って生きる
  rationale: 神に向かう敬虔さと、それが生活に現れる倫理的側面を、現代の一般読者に分かる形で表した。
theological_decisions:
- issue: ἰδίᾳ δόξῃ καὶ ἀρετῇ の与格が表す関係
  choice: ご自身の栄光と卓越性によって
  alternative: ご自身の栄光と卓越性へと
  rationale: SBLGNT本文の与格は、召しの手段を表すと理解するのが自然である。ただし、召しの目標を表すと取る余地もあるため、本文で一方に決着させず脚注に代案を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神への敬意と本文の荘重さを保った。εὐσέβειαは教会用語の「敬虔」だけに頼らず、「神を敬って生きる」として意味を明示した。節頭のὩςは、後続文との接続を残すため「このように」とした。
