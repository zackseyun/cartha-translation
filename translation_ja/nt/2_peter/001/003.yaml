revisions:
- from: このように、その方の神としての力は、ご自身の栄光と卓越性によって[a]私たちを召してくださった方を知ることを通して、命と、神を敬って生きるために必要なすべてのものを、私たちに与えてくださいました。
  to: 神の力が、命と神を敬って生きることに関わるすべてのものを、ご自身の栄光と卓越性によって私たちを召してくださった方を知ることを通して、私たちに与えてくださったように、
  rationale: 節頭のὩςが次節へ続く構文であることを、日本語でも末尾の「〜ように、」によって示した。本文の語順は、神の力が授与したもの、それが与えられる手段（召した方を知ること）、および召しの手段として理解した与格句を明示するよう整えた。脚注は、与格句を目標・方向として理解する可能性を保持している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:42:48Z'
review_pass:
  verdict: revise
  source_fidelity: 要修正です。Ὡςは前節・後節との論理的接続を示す「〜であるように／〜なので」であり、「このように」は指示語的な意味を加えています。また、τὰ πρὸς ζωὴν καὶ εὐσέβειανは「命と敬虔に関わるすべてのもの」であって、「必要な」は原文に明示されません。
  naturalness: 修正文は、節頭の従属的な接続を「〜であるように」として保ちつつ、明瞭な現代標準日本語に整えています。「神としての力」は不自然で意味もぼやけるため、「神の力」とします。
  terminology: θείας δύναμιςは「神の力」、ἐπίγνωσιςは文脈上「知ること」、εὐσέβειαは明瞭さを優先して「神を敬って生きること」、δόξα／ἀρετήは「栄光と卓越性」とします。「召す」は本文の語彙として維持します。与格句の手段的理解と代案は脚注で保持します。
  issues:
  - severity: medium
    issue: Ὡςを「このように」と訳している。
    rationale: Ὡςはここで指示語的な「このように」ではなく、続く勧めに連なる比較的・根拠提示的な接続詞である。「〜であるように」とすることで、その接続機能を保てる。
  - severity: medium
    issue: τὰ πρὸς ζωὴν καὶ εὐσέβειανに「必要な」を補っている。
    rationale: この句は「命と敬虔に関わる／そのためのすべてのもの」を意味する。文脈上の含意として必要性を読み得ても、原文にない限定を本文に加えないほうがよい。
  - severity: low
    issue: θείας δυνάμεωςを「その方の神としての力」としている。
    rationale: 現代日本語として不自然で、「神であるための力」のようにも響く。θεῖοςはここでは自然に「神の」と訳せる。
  revised_text: 神の力が、命と神を敬って生きることに関わるすべてのものを、ご自身の栄光と卓越性によって私たちを召してくださった方を知ることを通して、私たちに与えてくださったように、
  revised_footnotes:
