id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: ja
  text: これらのものがあなたがたに備わり、しかも増し加わっているなら、それらは、私たちの主イエス・キリストを知ることにおいて、あなたがたを役に立たない者にも、実を結ばない者にもさせません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア（油を注がれた者）」という称号。また「知ること」は「深く知ること」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: これらのもの
  rationale: 直前の5–7節に列挙された徳を指す指示語として、解釈を加えすぎず照応関係を保つ。
- source_word: ὑμῖν ὑπάρχοντα
  choice: あなたがたに備わり
  rationale: 与格とὑπάρχωの組み合わせが示す、読者のうちに存在すること・読者が有していることを自然な日本語で表す。
- source_word: πλεονάζοντα
  choice: 増し加わっている
  rationale: 豊かにあるという状態と増大する動きの双方を含み得る語であり、文脈上の成長の含意を保つ。
- source_word: ἀργούς
  choice: 役に立たない者
  rationale: 単なる怠惰よりも、働きや効果を生まないという文脈上の意味を明瞭にする。
- source_word: ἀκάρπους
  choice: 実を結ばない者
  rationale: 原文の結実の比喩を、現代日本語として自然な形で保持する。
- source_word: καθίστησιν
  choice: なりません
  rationale: 二つの否定語とともに、これらのものが読者を無効・不実な者にはしないという結果を自然に表す。
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: …を知ることにおいて
  rationale: εἰςが示す関係・領域を断定的に目的だけへ狭めず、日本語で理解しやすく表す。
- source_word: ἐπίγνωσιν
  choice: 知ること
  rationale: 認識・知識を抽象名詞の硬さを避けて表しつつ、人格的な対象を知る意味を保つ。より強い『深く知ること』の含意は脚注に示す。
- source_word: κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριοςをキリスト論的称号として標準的に訳す。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語聖書と一般的な現代日本語で定着した称号形を用いる。キリストが『メシア』を意味することは脚注で明示する。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστόςの訳し方
  choice: イエス・キリスト
  alternative: メシアであるイエス／イエス・メシア
  rationale: Χριστόςの称号的意味を認めつつ、日本語では『イエス・キリスト』が自然で広く理解される定着表現である。称号の意味を失わせないため脚注を付す。
- issue: ἐπίγνωσιςの意味の強さ
  choice: 知ること
  alternative: 深く知ること／十分な知識
  rationale: 語がより十分な認識を含み得る一方、この箇所だけで強意を必須と断定せず、本文では広い語義を保ち脚注で可能性を示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。前節までとの照応を保ち、ἀργόςとἄκαρποςの並行を「役に立たない者」「実を結ばない者」で再現した。脚注記号[a]は本文末に配置した。
