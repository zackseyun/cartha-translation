id: 2PE.1.21
reference: 2 Peter 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: ja
  text: 預言は決して、人の意志によってもたらされた[a]のではありません。むしろ、人々は聖霊に運ばれながら[b]、神から語ったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「生み出された」。ギリシア語は受動態で、後半の「運ばれながら」と同じ動詞に由来する。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖霊に動かされて」。直訳に近い「運ばれながら」は、聖霊が能動的に導くことを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: 人の意志によって
  rationale: 属格の単数形を自然な日本語の総称表現「人」で示し、預言の起源が人間の意志にはないことを保った。
- source_word: ἠνέχθη
  choice: もたらされた
  rationale: φέρωのアオリスト受動態を受動表現で訳し、後半の同語源の分詞とのつながりもできる限り保った。
- source_word: προφητεία
  choice: 預言
  rationale: 預言による啓示または発言を指す、簡潔で定着した訳語を用いた。
- source_word: οὐ ... ποτέ
  choice: 決して…のではありません
  rationale: 強い全面否定を、明瞭で自然な現代日本語にした。
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: 聖霊に
  rationale: ὑπό＋属格が示す動作主を、日本語の受動表現に自然に組み込んだ。
- source_word: φερόμενοι
  choice: 運ばれながら
  rationale: ἠνέχθηと同じφέρωの具体的な比喩を保ち、聖霊の能動的な導きを表した。「動かされて」も可能だが、語の対応が弱くなる。
- source_word: ἐλάλησαν
  choice: 語った
  rationale: λαλέωの基本的意味を、文脈にふさわしい平明で品位ある語で表した。
- source_word: ἀπὸ θεοῦ
  choice: 神から
  rationale: ἀπόが示す源・起源を保ち、聖霊を動作主として示すὑπόとの区別を明確にした。
- source_word: ἄνθρωποι
  choice: 人々
  rationale: 性別を不必要に限定せず、人間である語り手たちを指す自然な総称表現とした。
theological_decisions:
- issue: 預言における神の働きと人間の働きの関係
  choice: 人々が実際に語る一方、そのことばの源は神であり、彼らは聖霊に運ばれていたと表現した。
  alternative: 聖霊による機械的な口述、または人間の意志と神の働きとの共同起源として表現する。
  rationale: 本文は「人々が語った」という人間の行為と、「神から」「聖霊に運ばれながら」という神的な源および働きの両方を述べる。どちらか一方へ還元せず、原文の緊張関係を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「神から語った」は日常語ではやや凝縮された表現だが、神がことばの源であるという原文のἀπόを解釈で言い換えずに残すため採用した。
