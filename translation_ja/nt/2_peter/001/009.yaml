source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: ja
  text: というのも、これらのもの[a]を備えていない人は、盲目で、近くのものしか見えず[b]、以前の自分の罪が清められたことを忘れているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらの性質」とも訳せます。前の節までに挙げられた徳を指します。
    reason: lexical_alternative
  - marker: b
    text: 「近視である」、または「目を細めて見る」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: というのも、これらのものを備えていない人は
  rationale: γάρの説明・理由を示す働きを「というのも」で表した。πάρεστινの否定は、前節までに挙げられた徳がその人のうちにないことを指すため、「備えていない」とした。ταῦταは解釈を狭めず「これらのもの」と訳した。
- source_word: τυφλός ἐστιν
  choice: 目が見えず
  rationale: 視覚を用いた比喩を保ちながら、現代日本語で自然な述語表現とした。
- source_word: μυωπάζων
  choice: 近くのものしか見えない
  rationale: 近視、または近くのものだけを見るという語義を、分かりやすい動的表現で示した。直前の「目が見えず」との緊張関係は原文どおり残した。
- source_word: λήθην λαβὼν
  choice: 忘れている
  rationale: 字義的には「忘却を受けた」だが、ギリシア語の慣用的意味を自然な日本語で表した。
- source_word: τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: 以前の自分の罪が清められたこと
  rationale: καθαρισμόςを「清め」と理解し、πάλαιが過去の罪を指すことを明示した。αὐτοῦは一般的な単数の人物を受けるため、性別を不要に限定しない「自分の」とした。
theological_decisions:
- issue: 「目が見えない」と「近くのものしか見えない」の関係
  choice: 両方の視覚的表現を並べ、原文の緊張を保持する
  alternative: 「霊的に盲目で、近視眼的である」と解釈的に説明する
  rationale: τυφλόςとμυωπάζωνの組み合わせには、後者が前者を限定するのか強めるのかという解釈上の幅がある。本文では特定の神学的説明を加えず、原文の比喩を保った。
- issue: 罪の清めの表現
  choice: 以前の自分の罪が清められたこと
  alternative: 以前の自分の罪から清められたこと
  rationale: 属格構文は「罪の清め」とも「罪からの清め」とも表現できる。本文では日本語として平明で、清めが過去の罪に関わることを明確にしたが、清めの時や手段は補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説明調になりすぎない品位ある文体とした。「というのも……からです」によりγάρの論理関係を示しつつ、一節として自然に読める形にした。
