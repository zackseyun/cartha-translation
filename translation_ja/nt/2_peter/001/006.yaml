id: 2PE.1.6
reference: 2 Peter 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: ja
  text: また、知識には自制を、自制には忍耐[a]を、忍耐には敬虔を加えなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忍耐」は、「堅忍」「耐え抜く力」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では動詞が省略され、前の節から続く徳目の連鎖になっている。ここでは「加えなさい」を補った。
    reason: source_structure
lexical_decisions:
- source_word: γνώσει
  choice: 知識
  rationale: γνῶσιςの基本的な意味を直接に表し、前節から続く徳目の連鎖にも自然に適合する。
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: 自制
  rationale: 欲望や衝動を抑える力を指す語であり、現代日本語として明瞭で簡潔である。
- source_word: ὑπομονήν / ὑπομονῇ
  choice: 忍耐
  rationale: 困難のもとにとどまり、揺るがず耐え抜くことを表す。一般読者に理解しやすく、徳目として自然な訳語である。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 神への畏敬と、それが生活に現れる姿勢を表す。新約聖書の徳目として簡潔かつ荘重である。
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: また、…には…を…加えなさい
  rationale: ギリシア語は前節の動詞を省略しているため、前節から補われる『加える』を明示しつつ、徳目同士の連鎖構造を保つ。
- source_word: δέ
  choice: また
  rationale: ここでは対照ではなく、徳目を順に付け加える接続を示す。
theological_decisions:
- issue: 徳目の連鎖における省略構文
  choice: 前節から『加えなさい』を補い、圧縮された列挙の構造を保つ。
  alternative: 『知識のうちに自制を、自制のうちに忍耐を』のように前置詞を直訳する。
  rationale: 原文は前節から続く省略構文であり、日本語では動詞を補わないと文意が不明瞭になる。『加えなさい』は前節のπαρεισενέγκαντες／ἐπιχορηγήσατεに基づく補足で、各徳目の関係を過度に解釈しない。
- issue: εὐσέβειαの意味範囲
  choice: 敬虔
  alternative: 信心、神を敬う生き方
  rationale: 神への畏敬と実生活に表れる信仰姿勢の双方を含み得る語として、伝統性と現代的な理解可能性の均衡を取る。
translation_notes:
  register: 明瞭な現代標準日本語を用い、徳目表にふさわしい簡潔で dignified な調子と反復構造を保った。「敬虔」はやや文語的だが、εὐσέβειαの宗教的・倫理的含意を簡潔に担う語として採用した。
