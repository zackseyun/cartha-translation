- issue: ἀληθεύωνが表すパウロの行為
  choice: 彼らに真実を語ったことが、自分を彼らの敵にしたのかと問う
  alternative: 彼らに対して誠実に振る舞ったことが、自分を敵にしたのかと問う
  rationale: 直前からの訴えと叱責の文脈では、真実を言葉で伝える意味が適切である。ただし動詞には「真実に即して語る」という幅があるため、脚注で示す。
