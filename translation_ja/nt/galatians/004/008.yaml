  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: ja
  text: しかし、かつて[a]神を知らなかったあなたがたは、本質的には神ではないものに奴隷として仕えていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、その当時、神を知らずにいたあなたがたは」。
    reason: τότε μὲνと分詞句の関係を、より逐語的な語順で示す別訳。
lexical_decisions:
- source_word: Ἀλλὰ
  choice: しかし
  rationale: 前段との対比を明確に示し、現代日本語として自然で格調も保てる。
- source_word: τότε μὲν
  choice: かつて
  rationale: ガラテヤの人々の過去の状態を指す。μένが次節の現在との対比を準備していることも、日本語の「かつて」で自然に伝わる。
- source_word: οὐκ εἰδότες θεὸν
  choice: 神を知らなかった
  rationale: 分詞を過去の状態として表し、単なる知識ではなく神を知ることを含み得る原文の簡潔さを保った。
- source_word: ἐδουλεύσατε
  choice: 奴隷として仕えていました
  rationale: δουλεύωが持つ隷属の意味を「仕える」だけに弱めず、ガラテヤ書の奴隷状態と自由という主題を保ちながら自然な日本語にした。
- source_word: τοῖς φύσει μὴ οὖσι θεοῖς
  choice: 本来は神ではないものに
  rationale: φύσειによる実質・本性についての否定を「本来は」で示す。「偶像」や「悪霊」と特定せず、原文が指示対象を明示しない点を保持した。
theological_decisions:
- issue: 以前に仕えていた対象の正体
  choice: 本来は神ではないもの
  alternative: 実際には神でないもの／神と呼ばれていても本質上は神でない存在
  rationale: パウロはそれらがφύσει、すなわち本来のあり方において神ではないと否定するが、偶像なのか霊的存在なのかをここでは特定していない。その緊張を解消せずに残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「奴隷として仕える」によって原文の隷属の強さを保持した。「もの」は指示対象を不必要に人格的または非人格的と限定しないために採用した。
