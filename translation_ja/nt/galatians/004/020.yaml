  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: ja
  text: しかし、今すぐあなたがたのもとにいて、話し方を変えることができたらよいのにと思います[a]。あなたがたのことで当惑しているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私の声を変える」。ここでは、語調や語り方を変えるという意味だと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: できることなら…たいのです
  rationale: 未完了過去形が文脈上、現在の実現していない願いを婉曲に表すため、その含みを自然な現代日本語で示した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の訴えから、対面できない現状への軽い対照と話題の展開を示す。
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: あなたがたのもとに行き
  rationale: 字義は「あなたがたのところに居合わせる」だが、離れた場所から相手のもとへ赴いて共にいるという文脈を自然に表した。
- source_word: ἄρτι
  choice: 今すぐ
  rationale: 単なる「今」よりも強い即時性を表す。
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: 話し方を変えたい
  rationale: φωνήの字義は「声」だが、ここでは対面なら相手の反応に応じて語調や語り方を変えるという文脈的意味が中心である。字義的可能性は脚注に残した。
- source_word: ὅτι
  choice: …からです
  rationale: パウロが対面して話し方を変えたい理由を明示する。
- source_word: ἀποροῦμαι
  choice: どうしたらよいか分からずにいる
  rationale: 困惑し、打つ手や判断に窮している状態を、明快な現代日本語で表した。
- source_word: ἐν ὑμῖν
  choice: あなたがたのことで
  rationale: 人物に関する困惑の対象・関連を示す表現として自然であり、字義的な「あなたがたの中で」という不自然さを避けた。
theological_decisions:
- issue: φωνήの文脈上の意味
  choice: 実際の声質だけでなく、語調や語り方を指すものとして訳す。
  alternative: 「声を変える」と字義的に訳す。
  rationale: 前後は牧会的な戒めと心配の文脈であり、対面なら手紙とは違う仕方で語れるという意味が自然である。ただし原語の字義を脚注で明示し、解釈の幅を保持した。
- issue: ἀποροῦμαιが示す困惑
  choice: ガラテヤの人々にどう対処すべきか分からない状態として表す。
  alternative: 単に彼らについて疑念を抱いている、または彼らを見限っていると解する。
  rationale: この動詞は当惑・行き詰まりを示すが、見限りや断罪までは含意しない。牧会的な緊張を保ちつつ過剰解釈を避けた。
translation_notes:
  register: 明快で自然な現代標準日本語を用いながら、パウロの切迫した牧会的願いと困惑を、丁寧で威厳ある文体で表現した。
