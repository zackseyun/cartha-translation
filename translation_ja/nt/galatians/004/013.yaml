id: GAL.4.13
reference: Galatians 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: ja
  text: しかし、あなたがたが知っているように、私は初め、肉体の病気のためにあなたがたに福音を告げ知らせました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「肉体の弱さのために」。ギリシア語は直訳すると「肉の弱さ／病気のために」。
    reason: ἀσθένεια は「病気」と「弱さ」のどちらも意味し得るため。
lexical_decisions:
- source_word: οἴδατε
  choice: あなたがたが知っているとおり
  rationale: 現在の意味を持つ οἶδα を自然な日本語で表し、ガラテヤの人々がすでに知っている事実に訴える語調を保つ。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの論述から、自身の過去の受け入れられ方へ移る際の穏やかな対比を示す。
- source_word: ὅτι
  choice: 〜とおり
  rationale: 彼らが知っている内容を導入する ὅτι を、日本語として自然な引用構文にした。
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: 肉体の病気がきっかけで
  rationale: διά＋対格の原因・契機を示す働きを「きっかけで」と表し、ἀσθένεια の文脈上有力な意味である病気を採用した。σάρξ はここでは倫理的な意味ではなく身体を指すため「肉体」とした。病気か広義の弱さかという語義上の幅は脚注に残した。
- source_word: εὐηγγελισάμην
  choice: 福音を告げ知らせた
  rationale: 福音宣教を意味する動詞の力を保ちつつ、現代日本語で理解しやすい表現とした。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 与格の間接目的語を明確に表す。
- source_word: τὸ πρότερον
  choice: 初めに
  rationale: 以前の最初の宣教機会を指す可能性を自然に表す一方、「最初の訪問」と本文以上に限定しない。
theological_decisions:
- issue: ἀσθένειαν τῆς σαρκὸς における σάρξ と ἀσθένεια の意味
  choice: 肉体の病気
  alternative: 肉体の弱さ
  rationale: この文脈では道徳的な「罪深い性質」ではなく、パウロの身体上の不調を指す。ἀσθένεια は病気とも弱さとも取れるため、本文では文脈上有力な「病気」を選び、別訳を脚注で示した。
- issue: διά＋対格が示す関係
  choice: 病気が宣教のきっかけになった
  alternative: 病気のただ中で、または病気にもかかわらず宣教した
  rationale: διά＋対格は通常、原因・理由を示す。ただし日本語の「病気のために」は宣教が妨げられた意味にも読めるため、「きっかけでした」として、病気が宣教に至る事情となったことを明確にした。
translation_notes:
  register: 明瞭な現代標準日本語。使徒の回想にふさわしい落ち着いた語調を保ち、「福音」は一般的な聖書用語として用い、動詞「告げ知らせた」で意味を補った。
