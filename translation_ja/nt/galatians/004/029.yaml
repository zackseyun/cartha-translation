id: GAL.4.29
reference: Galatians 4:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: ja
  text: しかし、当時、肉に従って生まれた者[a]が、御霊に従って生まれた者[b]を迫害したように、今もそうです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉に従って生まれた者」は、「通常の人間的な仕方で生まれた者」と理解することもできる。直訳は「肉に従って生まれた者」。
    reason: lexical_alternative
  - marker: b
    text: 原文後半には「生まれた」に当たる語は明記されていないが、前半から補われる。「御霊による者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の説明との対照を示す、簡潔で自然な逆接とした。
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: あの時…したように、今も同じです
  rationale: 過去と現在を対応させる相関構文を、明瞭な現代日本語で表した。
- source_word: ὁ κατὰ σάρκα γεννηθεὶς
  choice: 肉によって生まれた者
  rationale: σάρξとの語彙的つながりを保ちつつ、誕生に関する表現として訳した。ここでの「肉」は罪深い性質と限定せず、人間的・通常の出生を指し得る。
- source_word: ἐδίωκε
  choice: 迫害した
  rationale: 敵対的な圧迫を表す文脈上の意味を明確にし、未完了過去は比較される過去の事実として自然に表した。
- source_word: τὸν κατὰ πνεῦμα
  choice: 御霊による者
  rationale: 原文では後半に「生まれた」が明記されていないため、それを本文で補わず、省略を保った。「御霊による」はκατάの幅を不必要に道具的用法だけへ限定しない。
- source_word: πνεῦμα
  choice: 御霊
  rationale: ガラテヤ書の文脈では神の霊を指すと判断し、現代の聖書文体として通用する「御霊」を用いた。
- source_word: νῦν
  choice: 今
  rationale: 古い出来事とパウロの現在を結ぶ単純な時間表現として訳した。
theological_decisions:
- issue: κατὰ σάρκαの意味
  choice: 「肉によって」と訳し、通常の人間的な出生を指す文脈を注で示す
  alternative: 「人間の力によって生まれた」「罪深い性質によって生まれた」
  rationale: 直前の4章23節以来のイシュマエルとイサクの対比は、自然な出生と約束に基づく出生を扱う。「肉」というパウロの用語を残しながら、罪性だけを意味するとの読み込みを避けた。
- issue: πνεῦμαの指示対象
  choice: 神の御霊
  alternative: 人間の霊、霊的な原理
  rationale: 約束による子と信者の現在の身分を論じるガラテヤ書の文脈では、神の御霊を指す可能性が最も高い。ただしκατὰ πνεῦμα自体の関係性は「御霊による」として広さを残した。
- issue: 後半にγεννηθείςを補うか
  choice: 本文では「生まれた」を補わず、「御霊による者」とする
  alternative: 「御霊によって生まれた者」
  rationale: 原文の後半は「御霊による者」とだけ述べ、前半の分詞を省略している。日本語でも理解可能なため省略を保ち、補足可能性を脚注で説明した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御霊」は神の霊を示す伝統的だが現在も理解可能な表記。「今も同じです」により原文末尾の省略構文を自然な日本語にした。脚注記号は該当表現の直後または文末に置いた。
