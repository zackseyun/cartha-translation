  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: ja
  text: 私の子どもたちよ、あなたがたのうちに[b]メシア[a]が形づくられるまで、私はあなたがたのために再び産みの苦しみをしています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語 Χριστός は称号を表す。
    reason: alternative_reading
  - marker: b
    text: 「あなたがたの間に」とも訳せる。共同体全体における形成という意味が前面に出る。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「私は再び陣痛に苦しんでいます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: 私の子どもたち
  rationale: 親愛の情を帯びた呼びかけを、意味を過度に強めず自然な現代日本語で表した。「幼子たち」では年齢や小ささを必要以上に含ませるため採らない。
- source_word: οὓς
  choice: あなたがたのために
  rationale: 形式上は関係代名詞の対格だが、出産の比喩を日本語として自然に保つため、苦しみの対象を「あなたがたのために」と明示した。
- source_word: πάλιν
  choice: 再び
  rationale: 同じ苦しみが繰り返されていることを端的に示す。
- source_word: ὠδίνω
  choice: 産みの苦しみを味わっています
  rationale: 出産・陣痛の鮮明な母性的比喩を保ちつつ、現代日本語として理解しやすくした。
- source_word: μέχρις οὗ
  choice: まで
  rationale: 継続する苦しみの時間的な終点を自然に示す。
- source_word: μορφωθῇ
  choice: 形づくられる
  rationale: 受動態を保ち、メシアが信徒たちのうちに形を取るという比喩を説明的に解消しない。
- source_word: Χριστὸς
  choice: メシア
  rationale: Χριστόςの称号としての意味を表す。「キリスト」は日本語で定着した代替表現として脚注に示す。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちに
  rationale: 内面的な形成を自然に表しながら、複数の聞き手から成る共同体の中で、という含みも残せる表現を選んだ。
theological_decisions:
- issue: 「メシアがあなたがたのうちに形づくられる」の意味
  choice: 個々の信徒の内面と共同体の双方を排除しない比喩として保持する
  alternative: 「あなたがたの間に」と訳して共同体的意味を前面に出す、または回心・新生の教理用語で説明する
  rationale: ἐν ὑμῖνは「あなたがたのうちに」と「あなたがたの間に」の双方を許し得る。本文では比喩と曖昧さを保ち、特定の教理的仕組みに限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。パウロの母性的な出産比喩を保ち、「形づくられる」を教理的な説明に置き換えない。
