  terminology: 「メシア」は Χριστός の称号性を反映しており、脚注で「キリスト」を代替訳として示す処置も適切である。「あなたがたのうちに」は内面的・共同体的な含みを不当に限定せず、脚注の「あなたがたの間に」という代替も妥当である。
