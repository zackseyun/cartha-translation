  source_fidelity: 本文は、τέκνα μου の親愛を込めた呼びかけ、πάλιν（再び）、ὠδίνω の出産の比喩、μέχρις οὗ（〜まで）、μορφωθῇ の受動的表現、および ἐν ὑμῖν の「うちに」を適切に保っている。「産みの苦しみを味わっています」は意味を通すが、ὠδίνω の現在形の切迫した苦しみの比喩をやや弱め、また日本語として少し説明的である。
