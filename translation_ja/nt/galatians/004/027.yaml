  - severity: medium
    issue: τῆς ἐρήμουを「見捨てられた女」と本文で限定している。
    rationale: この語はこの比喩で「荒れ果てた」「荒廃した」、文脈により「見捨てられた」とも理解できる。本文はより基本的で広い表現を用い、代替的な理解は注に置くのが安全である。
  - severity: low
    issue: 「産みの苦しみを知らない」は原文の現在分詞より「経験したことがない」という含みを強めうる。
    rationale: ὠδίνουσαは「産みの苦しみをしていない／味わわない」者を指す。本文では継続的状態として読める表現に改める。
