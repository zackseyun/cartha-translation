revisions:
- from: こう書かれているからです。「喜べ、子を産まない不妊の女よ。[a] 産みの苦しみを知らない女よ、声を張り上げて叫べ。[b] 夫のいる女の子どもより、見捨てられた女[c]の子どものほうが多いからだ。」
  to: こう書かれているからです。「喜べ、子を産めない女よ、子を産まない女よ。[a] ほとばしり出て、叫べ。産みの苦しみを味わわない女よ。[b] 荒れ果てた女[c]の子どものほうが、夫のいる女の子どもより多いからだ。」
  rationale: 二つの命令（ῥῆξον、βόησον）をそれぞれ訳出し、荒廃・孤絶を表すἐρήμουの比喩を特定の「見捨てられた」という解釈に本文で固定しないようにした。比較、夫という語、聖書引用の導入、および引用の詩的・預言的調子は維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:04Z'
review_pass:
  verdict: revise
  source_fidelity: 改訂が必要です。現行訳の「声を張り上げて叫べ」は、ῥῆξον（ほとばしり出る／突き破って出る）とβόησον（叫ぶ）の二つの命令を一つにまとめており、前者の語義が失われています。また、τῆς ἐρήμουを本文で「見捨てられた女」とするのは可能な解釈ではあるものの、「荒れ果てた／荒廃した」という基本的で意図的に幅のある比喩を本文段階で狭めています。
  naturalness: 「こう書かれているからです」は明瞭な現代日本語であり、引用の調子も保っています。「子を産まない不妊の女」は理解可能ですが、「不妊」と「子を産まない」の重なりを原文の詩的反復としてより自然に表すため、「子を産めない女よ、子を産まない女よ」としました。「ほとばしり出て、叫べ」は二つの動詞を区別しつつ、預言的引用として自然です。
  terminology: 「夫のいる女」はἀνήρのこの文脈での「夫」を正しく反映しています。「荒れ果てた女」はἐρήμοςの中心義を保ち、注で「見捨てられた／見放された」という文脈上の可能性を示します。本文にサラや上なるエルサレムの解釈を持ち込まない方針も適切です。
  issues:
