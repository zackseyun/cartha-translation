language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: ja
  text: こう書かれているからです。「喜べ、子を産めない女よ、子を産まない女よ。[a] ほとばしり出て、叫べ。産みの苦しみを味わわない女よ。[b] 荒れ果てた女[c]の子どものほうが、夫のいる女の子どもより多いからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イザヤ書54章1節からの引用。
    reason: cross_reference
  - marker: b
    text: 「ほとばしり出て、叫べ」は、「歓声を上げ、大声で叫べ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「荒れ果てた女」に当たる語は、この比喩的文脈で「見捨てられた女」「見放された女」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 聖書引用を導入する完了受動形。書かれた言葉が今も効力を持つという含みを保ちつつ、現代日本語で自然な定型表現とした。
- source_word: Εὐφράνθητι
  choice: 喜べ
  rationale: 喜びを命じる命令形。預言書の引用にふさわしい簡潔で格調ある表現。
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: 子を産まない不妊の女
  rationale: 実体詞的な形容詞と現在分詞による呼びかけを、日本語として過度に重複させず、継続する子のない状態が分かるように訳した。
- source_word: ῥῆξον καὶ βόησον
  choice: 声を張り上げて叫べ
  rationale: 突然声を放つことと大声で叫ぶことを一続きの自然な日本語で表した。
- source_word: ἡ οὐκ ὠδίνουσα
  choice: 産みの苦しみを知らない女
  rationale: ὠδίνωが指す陣痛・出産の苦痛を保ち、比喩的な預言の調子にもなじむ表現とした。
- source_word: τῆς ἐρήμου
  choice: 見捨てられた女
  rationale: この人物比喩では荒野そのものより、孤立し捨て置かれた状態を指す。『荒れ果てた女』『夫に捨てられた女』と限定しすぎず、原語の幅を保った。
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: 子どものほうが多い
  rationale: 比較の構造を明示し、通常の現代日本語の語順に整えた。
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: 夫のいる女
  rationale: ἀνήρを文脈に即して『夫』とし、『結婚している女』より原文の対照構造を直接的に保った。
theological_decisions:
- issue: ガラテヤ4章の比喩的議論に置かれたイザヤ書54章1節の引用
  choice: 引用された預言的イメージをそのまま訳し、この一節の文言にサラや上なるエルサレムという同定を加えない。
  alternative: 前後の議論を訳文に織り込み、『見捨てられた女』が誰を指すかを明示する。
  rationale: この節は明示的な聖書引用であり、その解釈上の同定は周囲の議論に委ねるべきである。引用自体が持つ曖昧さと緊張を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書引用としての簡潔さと格調を保った。『石女』のような古風で侮蔑的に響き得る語は避け、『不妊の女』とした。
