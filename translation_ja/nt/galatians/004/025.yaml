id: GAL.4.25
reference: Galatians 4:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: ja
  text: ハガルとは、アラビアにあるシナイ山のことです[a]。そして、今のエルサレムに対応しています。エルサレムは、その子どもたちとともに奴隷の身だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このハガルは、アラビアにあるシナイ山です」。ギリシア語では「ハガル」の前に冠詞があり、文の組み立てが難解です。
    reason: 統語上難しいτὸ δὲ Ἁγὰρについて、冠詞をより明示的に反映する訳の可能性を示すため。
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: ハガルとは
  rationale: δέは文脈を受ける軽い接続として独立した「さて」を補わず、統語上難しい中性冠詞τὸは、主題を示す自然な日本語の「とは」で控えめに反映した。
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: アラビアにあるシナイ山のことです
  rationale: 直訳的な同定を保ちつつ、所在地を表すἐν τῇ Ἀραβίᾳを日本語として自然に「アラビアにある」とした。「表す」と解釈的に弱めてはいない。
- source_word: συστοιχεῖ
  choice: 対応しています
  rationale: 同じ列・系列に属するという比喩的意味を、パウロの対比構造を保てる明瞭な現代日本語で表した。
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: 今のエルサレム
  rationale: νῦνの時間的限定を明示し、次節の「上にあるエルサレム」との対照を保った。
- source_word: δουλεύει
  choice: 奴隷の身です
  rationale: 奉仕一般ではなく隷属状態を指すため、自由との対比が明確な「奴隷の身」とした。
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: その子どもたちとともに
  rationale: μετάの共同・同伴の意味と、寓意的な家族関係を自然に保持した。
theological_decisions:
- issue: ハガルとシナイ山の寓意的同定
  choice: 「ハガルとは、…シナイ山のことです」と直接的に同定する
  alternative: 「ハガルはシナイ山を表しています」と解釈的に訳す
  rationale: 原文はἐστίνによる直接的な等置を用いるため、寓意であることを訳文内で説明して修辞的な強さを弱めない。
- issue: δουλεύειの主語
  choice: 直前の「今のエルサレム」を明示的に受けて「エルサレムは」とする
  alternative: 女性単数主語の曖昧さを保ち「彼女は」とする
  rationale: 文法上、最も近い女性単数名詞Ἰερουσαλήμが自然な主語であり、日本語で「彼女」とすると都市の擬人化が過度に目立ち、ハガルを指すとも誤読されやすい。子どもたちを持つ都市という原文の擬人化は内容上保持される。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い一文を三文に分けて論理関係を読み取りやすくし、「だからです」でγάρの理由関係を明示した。固有名詞は一般的な表記「ハガル」「シナイ山」「エルサレム」を採用した。
