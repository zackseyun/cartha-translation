  source_fidelity: 原文の直接的な同定（Ἁγὰρ…Σινᾶ ὄρος ἐστίν）を「ハガルとは、…シナイ山のことです」と自然な日本語で保っている。「今のエルサレム」はτῇ νῦν Ἰερουσαλήμの時間的限定を適切に表し、「対応しています」はσυστοιχεῖの比喩的な対応関係を過度に解釈せずに訳している。最後の主語を「エルサレム」と明示する処理も、直前のἸερουσαλήμを受ける文脈に即しており、「その子どもたちとともに奴隷の身」はδουλεύει μετὰ τῶν τέκνων αὐτῆςを忠実に表す。
  naturalness: 明瞭な現代標準日本語であり、三文への分割も論理を損なわない。「ハガルとは」「奴隷の身だからです」は、この文脈の説明的・論証的な文体に自然である。
  terminology: 固有名詞の「ハガル」「アラビア」「シナイ山」「エルサレム」は標準的である。「奴隷の身」は、δουλεύειが示す隷属と直後の文脈における自由との対照を適切に保つ。脚注は冠詞を含む難しい統語を簡潔かつ正確に説明している。
