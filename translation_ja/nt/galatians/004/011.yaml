  terminology: 「あなたがた」「労苦してきた」は本文脈にふさわしい、明瞭でやや格調を保つ現代語である。「あなたがたのために」はεἰς ὑμᾶςの、相手へ向けられた労苦を自然に伝えるため維持できる。
