  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: ja
  text: あなたがたのことが心配です。もしかすると、私があなたがたのために無駄に労苦してきたのではないかと恐れています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: あなたがたのことが心配です
  rationale: φοβοῦμαιは現在の懸念を表し、対格ὑμᾶςは恐怖の対象というより、ガラテヤの人々を案じる気持ちの向かう先を示す。現代日本語では「あなたがたのことが心配です」が自然で明瞭。
- source_word: μή πως
  choice: もしかすると…のではないかと
  rationale: 恐れている内容と、確定していない可能性への危惧を自然な日本語で表す。
- source_word: εἰκῇ
  choice: 無駄になってしまった
  rationale: 努力が結果を結ばないという意味を表す。「なってしまった」により、パウロの危惧を示すが、事実として確定はしない。
- source_word: κεκοπίακα
  choice: 労苦してきた
  rationale: 完了形が示す、これまで費やした骨折りと現在に及ぶ関連性を表す。単なる「働いた」よりもκοπιάωの労苦の含みを保つ。
- source_word: εἰς ὑμᾶς
  choice: あなたがたのために
  rationale: 労苦が彼らに向けられたことを自然に表す。「あなたがたの間で」も可能だが、εἰςの方向性と彼らに注いだ努力をより明確にする。
theological_decisions:
- issue: パウロの懸念の性質
  choice: ガラテヤの人々に注いだ宣教的・牧会的労苦が実を結ばずに終わるのではないかという危惧
  alternative: 単なる個人的な不安、または彼ら自身を恐れているという理解
  rationale: φοβοῦμαι…μή πως…εἰκῇ κεκοπίακαという構文は、彼らの状態を案じ、費やした労苦が無益になる可能性を恐れる内容を示す。ただし、無益になったと断定はしない。
translation_notes:
  register: 明瞭な現代標準語。原文の一文を日本語では二文に分け、現在の心配とその具体的内容を自然に示した。口語的すぎない「労苦してきた」を用いて、簡潔さと品位を保った。
