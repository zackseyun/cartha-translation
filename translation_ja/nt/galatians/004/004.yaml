  to: しかし、時が満ちたとき[a]、神はご自分の御子を遣わしました[b]。御子は女から生まれ[c]、律法の下に生まれました[d]。
  rationale: 二つのγενόμενονの並行を、日本語でも「生まれました」の反復によって保ちました。これにより、御子が女性から生まれ、モーセの律法の管轄下に置かれた民の一員として生まれたことを、原文以上に説明的にせず表せます。脚注の順序・アンカーは本文中のa、b、c、dと一致しています。
