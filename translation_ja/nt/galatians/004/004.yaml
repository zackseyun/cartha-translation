  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: ja
  text: しかし、時が満ちたとき[a]、神はご自分の御子を遣わしました[b]。御子は女から生まれ[c]、律法の下に生まれました[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「定めの時が満了したとき」または「時が完成したとき」。
    reason: lexical_alternative
  - marker: b
    text: 原語は「遣わす」を強めた形です。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「女から」。御子が現実に人として生まれたことを強調する表現です。
    reason: lexical_alternative
  - marker: d
    text: すなわち、モーセの律法の管轄の下に生まれたということです。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: しかし、〜とき
  rationale: δέを穏やかな展開・対比を示す「しかし」で、ὅτεを時を示す「〜とき」で表した。前節からの流れを保ちつつ、強すぎる対立にはしていない。
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: 時が満ちた
  rationale: 直訳的な「時の満ち満ちた状態が来た」ではなく、定められた時が完成点に達したことを自然な現代日本語で表した。
- source_word: ἐξαπέστειλεν
  choice: 遣わしました
  rationale: 神から使命を帯びて送られる文脈に適した「遣わす」を採用した。接頭辞ἐξ-の『外へ送り出す』含意は注で補った。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ご自分の御子
  rationale: αὐτοῦの所有関係を明示し、文脈上キリストを指すυἱόςを、日本語の聖書文体として自然で尊厳のある「御子」とした。
- source_word: γενόμενον ἐκ γυναικός
  choice: 女から生まれ
  rationale: この構文のγίνομαιは出生を表すため「生まれ」とし、ἐκの起源・出所の意味を「から」で保った。
- source_word: γενόμενον ὑπὸ νόμον
  choice: 律法の下にある者となりました
  rationale: 二つ目のγενόμενονを機械的に「生まれ」と反復せず、「〜の下に置かれた状態に入る」という意味を自然に表した。ὑπόの支配・管轄の含意は「下に」で保持した。
theological_decisions:
- issue: γενόμενον ἐκ γυναικόςが示す御子の人間性
  choice: 「女から生まれ」と訳し、現実の人間としての出生を表す。
  alternative: 「女から出て」「女によって生じ」
  rationale: 「生まれ」はこの句の慣用的意味を明確にする一方、先に御子が神から遣わされたという記述との緊張を解消せず、そのまま残す。
- issue: ὑπὸ νόμονのνόμοςの指示対象
  choice: 本文では簡潔に「律法」とし、注でモーセの律法の管轄を指すと説明する。
  alternative: 本文で「モーセの律法」と明示する、または一般的な法の意味に取る。
  rationale: ガラテヤ書の文脈ではモーセの律法が強く示唆されるが、原文自体の簡潔さを保つため、限定は注に置いた。
- issue: 二度のγενόμενονの関係
  choice: 「生まれ」と「ある者となりました」と訳し、並行する二句を保持する。
  alternative: 両方を「生まれ」と反復する。
  rationale: 原文の並行性を残しながら、後半を「律法の下に生まれた」とする日本語の不自然さを避け、御子が律法の管轄下に入ったことを明瞭にした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬体で読みやすく整えた。「御子」「律法」は一般的な聖書用語として保持したが、過度に古風な語順や文末表現は避けた。
