  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: ja
  text: というのは、こう書かれているからです。アブラハムには二人の息子があり、一人は奴隷の女から、もう一人は自由な女から生まれました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 聖書の記述を導入する完了受動の定型表現を、現在も有効な書かれた権威を保つ自然な日本語で表した。
- source_word: γὰρ
  choice: というのは、…からです
  rationale: 直前の議論に根拠を示す接続機能を、現代日本語で明確にした。
- source_word: Ἀβραὰμ δύο υἱοὺς ἔσχεν
  choice: アブラハムには二人の息子があり
  rationale: υἱούςを性別に即して「息子」とし、ἔσχενは親子関係を過度に解釈せず「あり」とした。
- source_word: ἕνα ... καὶ ἕνα
  choice: 一人は…もう一人は
  rationale: 二者を対照するギリシア語の均衡ある構造を、自然な日本語で再現した。
- source_word: ἐκ
  choice: …から生まれました
  rationale: 母系の出自を表すἐκを、日本語で誤解なく自然に示した。
- source_word: παιδίσκης
  choice: 奴隷の女
  rationale: 女性の隷属身分を表し、後続する自由との対照を明確に保った。「女奴隷」よりもἐλευθέραςとの並行が伝わりやすい。
- source_word: ἐλευθέρας
  choice: 自由な女
  rationale: 身分上自由な女性を表す実体詞的形容詞であり、「奴隷の女」との対照を保った。
theological_decisions:
- issue: パウロの議論の中心となる隷属身分と自由身分の対照
  choice: 「奴隷の女／自由な女」と訳す
  alternative: 「女中／自由な女」「仕える女／自由な女」
  rationale: 周辺文脈の奴隷と自由の対照を明示しつつ、本文以上の制度的・神学的説明は加えないため。
translation_notes:
  register: 明瞭で品位ある現代標準語。「というのは、こう書かれているからです」で根拠提示を自然にし、後半は原文の対照構造を保った。
