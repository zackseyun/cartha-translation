  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: ja
  text: しかし、父が定めた時[b]までは、後見人と財産管理人[a]の管理のもとに置かれています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「管理人」とも訳せます。ギリシア語は、家や財産の運営を任された人を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「父の定めた時まで」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前節の「すべてのものの主人」と、未成年の間の実際の境遇とを対比する逆接として、自然で明瞭な表現です。
- source_word: ὑπὸ
  choice: の監督下に
  rationale: 後見人や管理人の権限・監督のもとに置かれていることを表します。日本語では単なる「下に」より意味が明確です。
- source_word: ἐπιτρόπους
  choice: 後見人
  rationale: 未成年の相続人を保護し監督する者を指す語として、法的・日常的に理解しやすい訳語です。
- source_word: οἰκονόμους
  choice: 財産管理人
  rationale: 家や財産の運営を委ねられた者という文脈上の役割を明確にし、「後見人」との違いも保ちます。
- source_word: ἄχρι τῆς προθεσμίας
  choice: 定めた時までは
  rationale: προθεσμίαが示す、あらかじめ指定された期限・時点を自然な現代日本語で表します。
- source_word: τοῦ πατρός
  choice: 父が
  rationale: 属格を、その時を定める主体として理解しています。文脈上の父子関係は明白なので「その父」より簡潔で自然です。
theological_decisions:
- issue: τοῦ πατρός の属格の理解
  choice: 時を定める主体として「父が定めた」と訳す
  alternative: 「父の定めた時」または、形式的に「父の時」
  rationale: 未成年の相続人を扱う比喩では、父が監督期間の終点を定めるという理解が最も自然です。ただし、神学的含意を本文以上に展開してはいません。
- issue: ὑπὸ ... ἐπιτρόπους ... καὶ οἰκονόμους の関係
  choice: 二種類の役割をまとめて「監督下にある」と表す
  alternative: 「後見人と管理人に従属している」
  rationale: 権威への服従だけでなく、未成年者の保護と財産管理を含む配置を表すため、「監督下」が文脈に適します。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語です。前節から続く未成年の相続人が主語であるため、日本語では代名詞を明示せず、「あります」で自然につなげています。
