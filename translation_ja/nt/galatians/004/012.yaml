id: GAL.4.12
reference: Galatians 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: ja
  text: 私のようになってください。私もあなたがたのようになったのですから[a]。兄弟たち[b]、お願いします。あなたがたは私を少しも不当に扱いませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私もあなたがたのようであるのですから」。ギリシャ語では二つ目の動詞が省略されており、「なった」とも「である」とも補うことができます。
    reason: alternative_reading
  - marker: b
    text: ここで「兄弟たち」は信仰者の共同体への呼びかけで、女性も含むと考えられます。
    reason: cultural_note
lexical_decisions:
- source_word: Γίνεσθε
  choice: なってください
  rationale: γίνομαι の現在命令形が表す、ある状態へ移るよう求める意味を明確にし、単なる「ありなさい」とはしなかった。複数への命令は、現代日本語で自然な丁寧形にした。
- source_word: ὡς ἐγώ
  choice: 私のように
  rationale: ὡς による比較を、簡潔で自然な日本語として表した。
- source_word: ὅτι
  choice: のですから
  rationale: 前の勧めの理由を示す接続として理解し、日本語では理由を表す節末表現にした。
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: 私もあなたがたのようになった
  rationale: ギリシャ語にはこの節の二つ目の定動詞がなく省略表現である。文脈上、パウロがガラテヤ人と同じ立場になったことを指す読みを本文に採りつつ、現在状態を指す可能性を脚注に残した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数呼格の形を保った。共同体全体への呼びかけであり、女性も含むと考えられることを脚注で説明した。
- source_word: δέομαι ὑμῶν
  choice: お願いします
  rationale: 切実な願いを表す δέομαι を、古風にならず真剣さのある現代日本語で表した。
- source_word: οὐδέν με ἠδικήσατε
  choice: あなたがたは私に何も悪いことをしませんでした
  rationale: οὐδέν の全面否定と με の対象を明示し、アオリストを自然な過去形で訳した。
theological_decisions:
- issue: κἀγὼ ὡς ὑμεῖς に省略された動詞の時制・意味
  choice: 私もあなたがたのようになった
  alternative: 私もあなたがたのようである
  rationale: 原文は動詞を明示しないため両義性がある。文脈上の過去の同化を本文に採用したが、現在の状態を述べる読みも脚注で保持した。
- issue: ἀδελφοί の包括範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原語の男性複数形を本文に反映しながら、この呼称が信仰共同体全体を指し、女性も含むと考えられることを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用い、敬意と切実さを保った。日本語として自然になるよう呼びかけと「お願いします」を冒頭に置いたが、勧め、理由、嘆願、過去の扱いという原文の要素はすべて保持した。
