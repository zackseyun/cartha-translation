id: GAL.4.3
reference: Galatians 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: ja
  text: 同じように、私たちも、まだ幼かった時には、この世のもろもろの原理[a]の下で奴隷にされていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この世を支配するもろもろの霊」。ギリシア語は、この世の基本的な原理や諸要素を指すことも、宇宙的な霊の力を指すこともあり得る。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同じように
  rationale: 直前の、相続人が後見人や管理人の下に置かれるたとえとの類比を、自然な現代日本語で示す。
- source_word: ἡμεῖς
  choice: 私たちも
  rationale: ギリシア語の明示的な一人称複数と καί の付加的な力を保つ。
- source_word: ὅτε ἦμεν νήπιοι
  choice: まだ幼かった時には
  rationale: 直前の相続人の比喩を受け、実年齢の乳児に限定せず、未成熟で保護・管理下にある状態を表す。
- source_word: ὑπὸ τὰ στοιχεῖα τοῦ κόσμου
  choice: この世のもろもろの原理の下で
  rationale: ὑπό の支配・従属の比喩と τοῦ κόσμου の属格を保つ。στοιχεῖα の複数性と意味の幅を示すため「もろもろの原理」とし、霊的諸力という可能性は脚注に残す。
- source_word: ἤμεθα δεδουλωμένοι
  choice: 奴隷にされていました
  rationale: 迂言的な受動表現の継続状態と、δουλόω の強い隷属語彙を明確に伝える。
theological_decisions:
- issue: τὰ στοιχεῖα τοῦ κόσμου の意味
  choice: 本文では「この世のもろもろの原理」
  alternative: 「この世を支配するもろもろの霊」または「世界の基本的な諸要素」
  rationale: この語句は、初歩的原理・構成要素とも宇宙的な霊的諸力とも解し得る。本文では直前の未成年の相続人という文脈に合う非人格的な訳を採りつつ、語の真正な曖昧さを脚注で明示する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「奴隷にされていました」によって原文の強い隷属表現を弱めず、「まだ幼かった」で直前の相続人の比喩とのつながりを自然に示した。
