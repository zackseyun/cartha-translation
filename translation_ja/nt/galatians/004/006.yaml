id: GAL.4.6
reference: Galatians 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: ja
  text: そして、あなたがたが息子[a]の身分にあるので、神は御子の霊を私たちの心に遣わされました。その霊は、「アッバ[b]、父よ」と叫んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「息子」と呼ばれているのは男性だけではなく、キリストにある信者すべてです。この語は、子として迎えられ、相続人となるというパウロの議論を保っています。
    reason: cultural_note
  - marker: b
    text: 「アッバ」は「父」を意味するアラム語の呼びかけです。原文でもアラム語の形がそのまま残されています。なお、「私たちの心」の代わりに「あなたがたの心」とする写本もあります。
    reason: lexical_and_textual_note
lexical_decisions:
- source_word: ὅτι δέ
  choice: であるからこそ
  rationale: ὅτιの理由・根拠を示す働きを明確にし、δέの穏やかな接続は日本語の文脈に自然に織り込んだ。強調的な「こそ」は、身分が御霊派遣の根拠であるという論理を読み取りやすくする。
- source_word: υἱοί
  choice: 息子
  rationale: 直前から続く養子、子としての身分、相続人という議論を保つため、「子ども」と一般化せず「息子」とした。ただし対象は男性に限られないことを脚注で明示する。
- source_word: ἐξαπέστειλεν
  choice: 遣わされました
  rationale: 完了した神の行為を表すアオリストを自然な日本語で表現した。「遣わす」は神からの派遣という含意に適し、尊敬表現も現代の聖書文体として自然である。
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: 御子の霊
  rationale: 属格関係を簡潔に保ち、神の子を指す日本語として定着した敬称「御子」を用いた。
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: 私たちの心に
  rationale: 本文のἡμῶνを採用し、καρδίαの聖書的な人間理解を過度に解釈せず「心」とした。異読「あなたがたの心」は脚注に示す。
- source_word: κρᾶζον
  choice: 叫んでいます
  rationale: 中性単数分詞がπνεῦμαに一致するため、叫ぶ主体を「その霊」と明示した。現在分詞の継続的・生動的な響きを「叫んでいます」で表した。
- source_word: Αββα ὁ πατήρ
  choice: アッバ、父よ
  rationale: ギリシア語本文に保持されたアラム語形を音写し、続くὁ πατήρは呼びかけとして「父よ」と訳した。
theological_decisions:
- issue: υἱοίの養子・相続文脈での訳
  choice: 息子
  alternative: 子どもたち／神の子
  rationale: ガラテヤ3–4章の議論は、当時の法的・社会的背景における息子の相続資格と結びつく。「息子」はその比喩的・法的連続性を保つ一方、信者全員を含むことを脚注で補う。
- issue: 「心」に付く所有代名詞の本文異読
  choice: 私たちの心
  alternative: あなたがたの心
  rationale: 提示されたSBLGNTのἡμῶνに従う。よく知られた異読ὑμῶνは本文を置き換えず脚注で開示する。
- issue: 叫ぶ主体
  choice: 御子の霊が叫ぶ
  alternative: 信者が御霊によって叫ぶ
  rationale: κρᾶζονは文法上τὸ πνεῦμαに一致するため、御霊を明示的な主体とする。御霊を通して信者が父を呼ぶという含意は排除しない。
- issue: 「アッバ」の保持
  choice: アッバ、父よ
  alternative: 父よ、父よ／お父さん
  rationale: 本文がアラム語形をギリシア語訳と並置している特徴を保存する。「お父さん」は親密さを一義的に強めすぎる可能性があるため採らない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「御子」「遣わす」「父よ」によって聖書本文としての品位を保った。原文の一文を二文に分け、分詞の主体を明示して理解しやすくした。脚注記号は本文中にすべて配置した。
