id: GAL.4.9
reference: Galatians 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: ja
  text: しかし今、あなたがたは神を知るようになりました。いや、むしろ神に知られたのです。それなのに、どうして再び、その力のない、貧しい諸要素[a]に立ち返って、もう一度初めからそれらの奴隷になろうとするのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸要素」と訳した語は、「基礎的な原理」「初歩的な事柄」、または「元素に関わる霊的存在」を指す可能性がある。
    reason: στοιχεῖαの語義には議論があり、本文だけで一つに確定しないため。
lexical_decisions:
- source_word: γνόντες θεόν
  choice: 神を知るようになりました
  rationale: アオリスト分詞の到達的な意味を「知るようになった」で表し、神について知識を得ただけでなく、神を知るに至ったことを示す。日本語として明瞭にするため独立文にしたが、後続の問いとの論理的関係は「それなのに」で保持した。
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: いや、むしろ神に知られたのです
  rationale: μᾶλλον δέの訂正・深化の力を「いや、むしろ」で明示し、受動態も保って、彼らが神を知ったことより神に知られたことを前面に出す。
- source_word: πῶς
  choice: どうして
  rationale: 単なる方法の質問ではなく、パウロの驚きと非難を帯びた修辞疑問として自然な現代日本語にした。
- source_word: ἐπιστρέφετε πάλιν
  choice: 再び…立ち返って
  rationale: 現在形が示す進行中または目前の方向転換と、πάλινの反復を表す。「逆戻り」よりも原語の基本的な移行の比喩を保つ。
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: あの力のない貧しい諸要素
  rationale: ἀσθενῆとπτωχὰをそれぞれ「力のない」「貧しい」とし、στοιχεῖαは意味を一つに限定しない「諸要素」とした。指示的な定冠詞は、既出の概念を指す「あの」で自然に表した。
- source_word: πάλιν ἄνωθεν
  choice: もう一度初めから
  rationale: 二つの副詞が示す反復と再出発の強調を、意味を落とさず自然な日本語で表した。
- source_word: δουλεύειν θέλετε
  choice: 奴隷になろうとする
  rationale: δουλεύεινの隷属の比喩を弱めず「奴隷」とし、θέλετεの意志・志向は「なろうとする」で表した。
theological_decisions:
- issue: ガラテヤ4章9節におけるστοιχεῖαの意味
  choice: 諸要素
  alternative: 基礎的な原理、初歩的な事柄、元素的な霊的存在
  rationale: この語は宗教的な初歩・基本原理とも宇宙的な霊的勢力とも解され得る。本文では特定の解釈に限定せず、語義の幅を脚注で示した。
- issue: 「神に知られた」の力点
  choice: 神に知られたことを、神を知ったことへの訂正・深化として明示する
  alternative: 神との相互的な関係だけを強調する
  rationale: μᾶλλον δέは実質的な言い直しを示すため、受動表現を保持した。ただし、そこから特定の組織神学的体系までは読み込まない。
translation_notes:
  register: 明瞭で現代的ながら、使徒的な叱責の重みを保つ文体とした。長いギリシア語の一文は日本語の可読性のため三文に分け、「それなのに」によって分詞句と主たる修辞疑問の逆接関係を明示した。
