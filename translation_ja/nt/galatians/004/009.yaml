  to: しかし今、あなたがたは神を知るようになりました。いや、むしろ神に知られたのです。それなのに、どうして再び、その力のない、貧しい諸要素[a]に立ち返って、もう一度初めからそれらの奴隷になろうとするのですか。
  rationale: 本文の意味を変えずに、定冠詞の自然な日本語での扱いを「あの」から「その」へ調整した。また、並列形容詞を読点で明瞭にし、脚注の代替語義を現代日本語としてより理解しやすくした。
