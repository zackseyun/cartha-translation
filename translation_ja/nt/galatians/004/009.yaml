  naturalness: 明瞭な現代標準日本語であり、文を分けたことも読みやすい。「それなのに」は前半の分詞句と後半の非難を適切につなぐ。「その力のない、貧しい諸要素」と読点を置くと、二つの形容が並列であることがより明瞭になる。
