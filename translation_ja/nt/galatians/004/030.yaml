id: GAL.4.30
reference: Galatians 4:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: ja
  text: しかし、聖書は何と言っていますか。「女奴隷[a]とその息子を追い出しなさい。[b]女奴隷の息子が、自由の身の女の息子と共に相続することは、決してないからです。」[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女奴隷」は、「奴隷の女」または「女性の召使い」とも訳せるギリシア語です。ここでは奴隷と自由の対照が中心なので、奴隷身分を明示しました。
    reason: lexical_alternative
  - marker: b
    text: 創世記21章10節を踏まえた引用です。
    reason: cross_reference
  - marker: c
    text: ギリシア語では否定が強調されており、「決して相続しない」または「断じて相続しない」という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前の議論との対照を示す接続詞として、現代日本語で自然かつ明確に訳した。
- source_word: τί λέγει ἡ γραφή
  choice: 聖書は何と言っていますか
  rationale: 現在時制と、聖書を語る主体として扱う引用導入句の性格を保った。日本語では「聖書」が定着した名称なので、ギリシア語の定冠詞を別に明示しない。
- source_word: Ἔκβαλε
  choice: 追い出しなさい
  rationale: ἐκβάλλωの強い排除の意味と命令形を、自然な現代日本語で保持した。「去らせなさい」よりも原文の鋭さが明瞭である。
- source_word: παιδίσκην
  choice: 女奴隷
  rationale: この箇所では奴隷状態と自由の対照が議論の中心であるため、単なる「女中」や「召使い」ではなく、身分を明示する語を選んだ。
- source_word: υἱὸν αὐτῆς
  choice: その息子
  rationale: 所有関係を簡潔にそのまま表した。
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: 相続することは、決してないからです
  rationale: οὐ μήと未来形による強い否定を「決してない」で表し、理由を示すγάρも保持した。
- source_word: κληρονομήσει
  choice: 相続する
  rationale: 家族・相続の文脈に適した標準的な訳語であり、解釈を不必要に付加しない。
- source_word: μετὰ τοῦ υἱοῦ
  choice: 息子と共に
  rationale: 相続への共同参加を示すμετά＋属格を簡潔に表した。
- source_word: τῆς ἐλευθέρας
  choice: 自由の身の女
  rationale: 名詞的に用いられた形容詞に「女」を補い、奴隷身分ではないことを自然な日本語で明示した。
theological_decisions:
- issue: パウロのハガルとサラをめぐる議論におけるπαιδίσκηの訳
  choice: 女奴隷
  alternative: はしため／女中／召使いの女
  rationale: 周辺文脈の奴隷と自由の対照を明確に保つ一方、特定の教派的解釈は加えない。
- issue: οὐ γὰρ μὴ κληρονομήσειによる排除の強さ
  choice: 相続することは、決してない
  alternative: 相続しない／断じて相続しない
  rationale: οὐ μήの強意を明示しつつ、「断じて」よりも現代の一般読者に自然な表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用としての品位と命令の鋭さを保った。「女奴隷」と「自由の身の女」を対応させ、本文の奴隷／自由という対照を見える形にした。
