  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: ja
  text: 兄弟たち[a]、あなたがたはイサクと同じように、約束の子どもたちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」と訳した語は男性複数形ですが、会衆全体への代表的な呼びかけとして、女性も含んでいると考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 二人称複数代名詞を明示し、呼びかけの対象であるガラテヤの信徒たちを自然な現代日本語で示した。
- source_word: δέ
  choice: 無訳（文脈上の移行として反映）
  rationale: ここでは弱い移行または対照を示す接続辞であり、日本語で「しかし」「さて」などを加えると意味を強めすぎる可能性があるため、文の切り替わりによって機能を表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形による呼びかけを保持した。会衆の男女を含む代表的用法であることは脚注で明示した。
- source_word: κατὰ Ἰσαὰκ
  choice: イサクと同じように
  rationale: κατάがここで示す対応・類比を、直訳調の「イサクに従って」ではなく自然かつ正確に表した。
- source_word: ἐπαγγελίας
  choice: 約束の
  rationale: 属格を保ち、パウロの特徴的な表現と神学的含意を過度に言い換えずに伝えた。
- source_word: τέκνα
  choice: 子どもたち
  rationale: 性別を限定しない複数名詞であり、血統だけでなく子としての身分を表すため「子どもたち」とした。
- source_word: ἐστέ
  choice: です
  rationale: 二人称複数現在形の連結動詞を、呼びかけを含む文に適した丁寧で明瞭な文体で表した。
theological_decisions:
- issue: 信徒とイサクとの対応関係
  choice: 「イサクと同じように、約束の子どもたち」とし、イサクを類比の型、信徒の身分を述語として示した。
  alternative: 「イサクのような、約束による子どもたち」
  rationale: ギリシア語の構造は、イサクとの対応と「約束の子ども」という身分を区別している。両者を保つことで、約束の成就によって生まれたイサクとの類比を示しつつ、本文以上の教理的説明を加えないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、呼びかけと「約束の子どもたち」というパウロの表現を保持した。過度に硬い直訳や説明的な言い換えは避けた。
