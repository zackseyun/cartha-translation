  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: ja
  text: しかし、上にあるエルサレムは自由であり、私たちの母です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異読により「私たちすべての母です」とする写本もあります。
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の「今のエルサレム」との対比を明確に示す。
- source_word: ἄνω
  choice: 上にある
  rationale: 地上のエルサレムとの空間的・超越的な対照を保ち、「天の」と解釈を限定しすぎない。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 日本語で定着した固有名詞の表記を用いる。
- source_word: ἐλευθέρα
  choice: 自由であり
  rationale: 周辺文脈の奴隷と自由の対比を保ち、原文に明示されない「女」を補わない。
- source_word: ἥτις
  choice: 私たちの母です
  rationale: 関係代名詞を日本語として自然な継続表現にしつつ、エルサレムの母としての擬人化を伝える。
- source_word: μήτηρ ἡμῶν
  choice: 私たちの母
  rationale: 所有関係と母の比喩を明瞭かつ自然に表す。
theological_decisions:
- issue: 「上にあるエルサレム」の擬人化とἥτιςの表現
  choice: 「私たちの母です」として、母なる存在としての擬人化を自然な日本語で示す。
  alternative: 「それは私たちの母です」または「この方が私たちの母です」
  rationale: 原文の女性形関係代名詞はエルサレムを母として扱うが、日本語には文法上の性がない。「彼女」とすると現代日本語では不自然になりやすいため、明示的な代名詞を置かずに比喩を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「上にある」は原文の空間的比喩を維持し、「自由であり」は後半へ滑らかにつなぐ。本文中の脚注記号は対応箇所である節末に置いた。
