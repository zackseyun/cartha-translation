id: GAL.4.18
reference: Galatians 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: ja
  text: しかし、良い目的で熱心に求められることは、いつでも良いことです[b][a]。それは、私があなたがたと一緒にいるときだけに限りません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「良いことに熱心であるのは」または「良いことに熱意を示すのは」。ギリシア語の不定詞 ζηλοῦσθαι には別の理解も可能だが、受動の意味は、前節で人々がガラテヤの人々を熱心に求めていることとの対比によく合う。
    reason: alternative_reading
  - marker: b
    text: 直訳「良い事柄において」。良い動機で、または良い目的のために、という意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: 良いことです
  rationale: 不定詞句全体を受ける述語形容詞。日本語では「良いことです」と補って自然に表した。
- source_word: δὲ
  choice: しかし
  rationale: 前節の悪い動機による働きかけと対比する逆接を明確にした。
- source_word: ζηλοῦσθαι
  choice: 熱心に求められる
  rationale: 現在受動不定詞として理解し、前節で他者がガラテヤの人々に熱心に働きかける文脈との連続性を保った。「求められる」に「熱心に」を添えてζηλόωの熱意を表した。
- source_word: ἐν καλῷ
  choice: 良い目的で
  rationale: 直訳は「良いことのうちに」だが、ここでは働きかけの良い動機・目的を指すと考え、自然な日本語にした。
- source_word: πάντοτε
  choice: いつでも
  rationale: 後半の「時だけではありません」と対応する継続的な時間表現。
- source_word: καὶ μὴ μόνον
  choice: だけではありません
  rationale: 日本語では後続の時間句を「だけではない」と結んで限定の否定を自然に表した。
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: 私があなたがたと一緒にいる時
  rationale: ἐνを伴う冠詞付き不定詞の時間的用法を、明瞭な現代日本語で表した。
theological_decisions:
- issue: ζηλοῦσθαιの態と意味上の主語
  choice: 受動態として、ガラテヤの人々が他者から熱心に求められること
  alternative: 中動態的に「熱心である／熱意を示すこと」
  rationale: 直前の17節では他者がガラテヤの人々に熱心に働きかけることが問題とされており、18節をその肯定的な対照と読むと文脈がよくつながる。ただしギリシア語には別解の余地があるため脚注で保持した。
- issue: ἐν καλῷが示す範囲
  choice: 良い目的で
  alternative: 良い事柄において／良い仕方で
  rationale: 悪い動機との文脈的対比を自然に示す一方、原文の簡潔な表現が複数の理解を許すことを脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「熱心に求められる」はやや特徴的な表現だが、原文の受動態とζηλόωの反復を保つため採用した。脚注記号は修飾対象に近づけ、語句の順に[b][a]とした。
