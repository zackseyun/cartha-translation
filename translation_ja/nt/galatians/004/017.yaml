  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: ja
  text: 彼らはあなたがたを熱心に求めています[a]が、それは正しいことではありません。むしろ、あなたがたを締め出して[b]、あなたがたが彼らを熱心に求めるようにしたいのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らはあなたがたの歓心を得ようとしています」とも訳せる。ギリシア語の動詞には、強く求める、熱心に関心を寄せるという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「除外して」とも訳せる。何から締め出すのかは原文に明記されていない。文脈上、パウロたちから引き離し、自分たちを求めさせることを指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε
  choice: 熱心に求めています／熱心に求める
  rationale: ζηλόωが表す強い関心や切望を自然な現代日本語で表し、同じ動詞を用いた原文の対称性も保つ。「慕う」や「歓心を買う」ほど意味を限定しない。
- source_word: οὐ καλῶς
  choice: しかし、良い意図からではありません
  rationale: 相手の熱心さが善いものではないという道徳的評価を明確にする。原文は仕方と動機のどちらにも取り得るため、脚注で別訳を示す。
- source_word: ἐκκλεῖσαι
  choice: 締め出し
  rationale: 「外に閉め出す、除外する」という語の具体的な響きを保ちつつ、何から締め出すのかは本文で補わない。
- source_word: θέλουσιν
  choice: したいのです
  rationale: 意志を表す一般的な動詞として、明快で自然な日本語にした。
- source_word: ἵνα
  choice: ように
  rationale: 彼らの企図する目的を自然な日本語の目的表現で示す。
theological_decisions:
- issue: ἐκκλεῖσαι ὑμᾶςで、何から締め出すのか
  choice: 本文では対象を補わず、「あなたがたを締め出し」とする
  alternative: パウロやその仲間から引き離す／神の祝福や共同体から除外する
  rationale: 直近の文脈ではパウロとの関係を断って忠誠を自分たちへ向けさせる意味が有力だが、原文は締め出す対象を明示していないため、本文では特定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「熱心に求める」を反復して原文の修辞的な対称性を再現し、敵対者の一見好意的だが操作的な働きかけを表した。
