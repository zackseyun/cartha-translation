id: GAL.4.31
reference: Galatians 4:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: ja
  text: ですから、兄弟たち[a]、私たちは女奴隷[b]の子どもではなく、自由の身の女の子どもです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹の皆さん」とも訳せる。ギリシア語は「兄弟たち」だが、男女を含む集団への呼びかけとして用いられることがある。
    reason: lexical_alternative
  - marker: b
    text: 「奴隷の女」とも訳せる。このギリシア語は女性の奴隷または召使いを指し、ここではパウロの比喩におけるハガルとサラの対比（ガラテヤ4:21–31）を背景としている。
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: ですから
  rationale: 直前の比喩的議論から導かれる結論を示す。現代日本語として自然で、推論の力を保つ。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを保持する。文脈上は女性を含む共同体全体への代表的な呼称となり得るため、その点を脚注で示す。
- source_word: οὐκ ἐσμὲν
  choice: 私たちは…ではなく
  rationale: 現在形の単純な否定として訳し、原文にない「もはや」などの時間的意味を加えない。
- source_word: παιδίσκης
  choice: 奴隷の女
  rationale: 女性の奴隷を指す語であり、ここではハガルとサラをめぐる奴隷と自由の対比が中心なので、その身分を明確に表す。
- source_word: τέκνα
  choice: 子ども
  rationale: 性別を限定しない「子ども、子孫」の意味を自然な日本語で表す。
- source_word: ἀλλὰ
  choice: ではなく
  rationale: 「奴隷の女」と「自由な女」に属する二つのあり方を明確に対比する日本語表現。
- source_word: τῆς ἐλευθέρας
  choice: 自由な女
  rationale: 女性形の冠詞と形容詞が名詞的に用いられ、文脈上サラを指すため、女性の指示対象を明示する。
theological_decisions:
- issue: ハガルとサラの比喩的対比をどこまで明示するか
  choice: 本文で「奴隷の女」と「自由な女」と訳す
  alternative: 「仕え女」と「自由の女」、または「女奴隷」と「自由な女」
  rationale: 4:21–31における奴隷状態と自由の鋭い対比を保ちつつ、本文を越えた教理的説明は加えない。
- issue: 混合した読者集団に対するἀδελφοίの訳し方
  choice: 本文では「兄弟たち」とし、女性を含み得ることを脚注で示す
  alternative: 「兄弟姉妹の皆さん」または「きょうだいたち」
  rationale: 原文の男性形の家族呼称を保持しながら、その代表的用法による広い指示範囲も読者に知らせる。
translation_notes:
  register: 明快で現代的かつ品位ある標準日本語。「奴隷の女」はやや硬いが、直前の文脈と対句を明瞭にし、「自由な女」と形をそろえた。
