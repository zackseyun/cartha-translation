id: GAL.4.14
reference: Galatians 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: ja
  text: そして、私の肉体の状態があなたがたにとって試練となったにもかかわらず[a]、あなたがたは私を軽蔑することも、唾棄することもなく[b]、かえって神の御使いのように、メシア・イエスのように[c]迎えてくれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「私の肉体における、あなたがたの試練」。この句は写本と文の係り受けに難しさがあります。
    reason: alternative_reading
  - marker: b
    text: 直訳は「唾を吐くこともなく」。強い嫌悪や拒絶を表す言い方です。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は「キリスト・イエス」。ここではΧριστόςが称号として用いられているため、「メシア・イエス」と訳しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου
  choice: 私の肉体の状態があなたがたにとって試練となった
  rationale: 本文のὑμῶνを保ちつつ、パウロの肉体に関わる事情がガラテヤの人々にとって試練となった、という文脈上自然な関係を明示した。原句には本文批評上・統語上の難しさがあるため、別の直訳可能性を脚注に残した。
- source_word: ἐξουθενήσατε
  choice: 軽蔑する
  rationale: 相手を取るに足りないものと見なし、見下す意味を簡潔で自然な現代日本語で表す。
- source_word: ἐξεπτύσατε
  choice: 唾棄する
  rationale: 字義的な『唾を吐く』という嫌悪・拒絶の像を保ちながら、日本語で人を強く嫌って退ける意味を表す。字義は脚注で補足した。
- source_word: ἐδέξασθέ με
  choice: 私を……迎えてくれました
  rationale: 単なる受領ではなく、パウロを好意的に受け入れたことを自然に表現する。
- source_word: ἄγγελον θεοῦ
  choice: 神の御使い
  rationale: ἄγγελοςには『使者』の可能性もあるが、続くメシア・イエスとの高い比較表現に合わせ、通常の『御使い』を採用した。
- source_word: Χριστὸν Ἰησοῦν
  choice: メシア・イエス
  rationale: ここではΧριστόςの称号性が明瞭であるため、『キリスト』という名称化した音訳より、称号の意味を示す『メシア』とした。
theological_decisions:
- issue: 「神の御使いのように、メシア・イエスのように」という比較の意味
  choice: ガラテヤの人々がパウロを非常な敬意をもって迎えた仕方を表す比較
  alternative: 二つ目の比較が一つ目を修辞的にさらに強めていると理解する
  rationale: 二つのὡςはいずれも迎え方を示しており、パウロをメシア・イエスと同一視する表現ではない。強い比較表現自体は弱めずに訳した。
- issue: σάρξの意味
  choice: 物理的な肉体、または肉体の状態
  alternative: 罪深い性質
  rationale: 直前・直後の文脈では、パウロの病気や身体的弱さに関係する事情が問題であり、道徳的な『罪の性質』を指す根拠はない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文にふさわしい品位を保った。「唾棄する」はやや改まった語だが、原語の生々しい比喩と拒絶の強さを短く保てるため採用し、脚注で説明した。
