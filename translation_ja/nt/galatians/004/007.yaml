id: GAL.4.7
reference: Galatians 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: ja
  text: ですから、あなたはもはや奴隷ではなく、子です[a]。そして、子であるなら、神を通して相続人でもあります[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は「息子」。当時の養子縁組と相続の論理を背景とする表現だが、この身分は男女を含むすべての信者に当てはまる。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「キリストを通して神の相続人」（または「メシアを通して神の相続人」）とする。
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前までの議論から導かれる結論を示す接続語として、推論の力を自然な現代日本語で表す。
- source_word: οὐκέτι
  choice: もはや～ではなく
  rationale: 以前とは身分が変わったことを示す時間的否定を明確に保つ。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 隷属状態と子としての身分との強い対比が論旨の中心なので、「僕」や「仕える者」より原語の拘束的な意味を明瞭に伝える。
- source_word: υἱός
  choice: 子
  rationale: 日本語の「息子」は男性に限定する響きが強い一方、ここでパウロが述べる身分はすべての信者に及ぶ。「子」は養子・相続の文脈を保ちつつ、適用範囲を不必要に狭めない。原語が男性単数形であることは脚注に示す。
- source_word: κληρονόμος
  choice: 相続人
  rationale: 受け継ぐ法的身分を表し、周辺文脈の養子・相続の論理に適合する標準的な訳語である。
- source_word: διὰ θεοῦ
  choice: 神によって
  rationale: 属格を伴う διά が行為・成立の媒介者を表すため、日本語では「神を通して」より「神によって」が自然であり、神によって相続人とされたという関係を保つ。
theological_decisions:
- issue: υἱόςの性別を伴う子の身分
  choice: 子
  alternative: 息子
  rationale: 原語は男性単数の「息子」だが、この箇所の子としての身分と相続権は男女を含む信者に適用される。日本語本文では自然で包括的な「子」とし、原語と古代の相続論理は脚注で明示して、神学的含意を失わせない。
- issue: 節末の本文異読
  choice: 神によって相続人
  alternative: キリストによって神の相続人／メシアによって神の相続人
  rationale: 採用されたSBLGNT本文 διὰ θεοῦ に従う。キリストまたはメシアを含む読みは本文に混入せず、重要な写本異読として脚注に保存する。
- issue: διὰ θεοῦの解釈
  choice: 神によって
  alternative: 神を通して
  rationale: 日本語では手段・媒介を示す「神によって」が自然だが、相続人となることの究極的な根拠を神に置く原文の神学的緊張は保たれる。
translation_notes:
  register: 明快な現代標準日本語を用い、推論を示す「ですから」と丁寧体で格調を保った。「奴隷」と「子」、「子」と「相続人」の対比と連鎖を簡潔に再現した。
