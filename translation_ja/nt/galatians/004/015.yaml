id: GAL.4.15
reference: Galatians 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: ja
  text: では、あなたがたの幸い[a]は、いったいどうなったのですか。実際、私はあなたがたに証言します。もしできたなら、あなたがたは自分の目をえぐり出して[b]、私に与えてくれたことでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幸い」は、「幸いな状態」または「幸いだと認めること」とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「自分の目をえぐり出して」。彼らの以前の献身を強調する誇張表現と考えられるが、パウロの身体的な状態をほのめかすと見る解釈もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: では……いったいどうなったのですか
  rationale: 直訳的な「どこにあるのか」が文脈上、以前の態度が今どうなったかを問う修辞疑問であることを、自然な現代日本語で表した。
- source_word: μακαρισμὸς ὑμῶν
  choice: あなたがたの幸い
  rationale: μακαρισμόςが表し得る、幸いな状態と幸いだと認めることの両面を過度に限定せず、簡潔で格調ある語を選んだ。
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: 実際、私はあなたがたに証言します
  rationale: γάρの説明的な働きを「実際」で示し、μαρτυρέωの厳粛な証言の響きを保った。与格ὑμῖνはまず「あなたがたに」と訳した。
- source_word: εἰ δυνατὸν
  choice: もしできたなら
  rationale: 簡潔なギリシア語の条件表現を保ちつつ、過去の事態について実現しなかった可能性を自然に示した。
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: 自分の目をえぐり出して
  rationale: ἐξορύσσωの生々しく強い像を弱めず、目を明示する原文をそのまま保った。
- source_word: ἐδώκατέ μοι
  choice: 私に与えてくれたことでしょう
  rationale: 条件文の反実的な含みを日本語の「ことでしょう」で表し、与える対象は直前の「目」から自然に理解できるため代名詞を加えなかった。
theological_decisions:
- issue: 「目をえぐり出す」という表現を文字どおり訳すか、献身一般を表す慣用表現に弱めるか
  choice: 具体的な「自分の目をえぐり出して」を本文に残す。
  alternative: 「どんなものでも私に与えてくれた」などと一般化する。
  rationale: 原文は「目」と強い動詞ἐξορύσσωを明記している。誇張表現である可能性やパウロの身体的状態への示唆の可能性はあるが、本文ではどちらにも決めず、具体的な像を保持した。
- issue: μακαρισμόςを感情、状態、または宣言のいずれに限定するか
  choice: 「幸い」として意味の幅を保つ。
  alternative: 「喜び」「祝福されているという思い」「自らを幸いとすること」
  rationale: 語は幸いな状態にも、それを幸いと認めることにも関わり得るため、文脈上の一つの解釈に固定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、修辞疑問と厳粛な証言の調子を保った。「えぐり出す」という強い像は原文どおり残し、解釈上の可能性は脚注に示した。
