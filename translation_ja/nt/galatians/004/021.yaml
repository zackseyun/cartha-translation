  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: ja
  text: 律法の下にいたいと願っている人たちよ、私に言ってください。あなたがたは律法を聞かないのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたは律法に耳を傾けないのですか」。ギリシア語の動詞には「聞く」と「耳を傾ける」の両方の意味がある。ここでの「律法」は、特にパウロが次に取り上げる聖書の記述を指すと思われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: 私に答えてください
  rationale: 直訳的な「私に言いなさい」より自然な現代日本語で、複数の聞き手に応答を迫る現在命令形の力を表す。
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: 律法の下にいたいと願う人たちよ
  rationale: 冠詞付き分詞句による直接の呼びかけを保ち、ὑπὸ νόμον というパウロ独特の法的・契約的表現を「律法の下に」で再現する。
- source_word: νόμον / τὸν νόμον
  choice: 律法／律法
  rationale: 二つの νόμος を同じ語で訳し、律法の支配下にあることと、次に引用される律法の記述との語の響き合いを保つ。日本語の「律法」は文脈上モーセ律法を示しつつ、その二重の働きを許容する。
- source_word: οὐκ ἀκούετε
  choice: 言うことを聞かないのですか
  rationale: ἀκούω の「聞く」と「耳を傾ける・従って聞く」の幅を自然な日本語で示す。単なる聴覚ではなく、律法が語る内容への注意を促す文脈に適する。
theological_decisions:
- issue: 「律法」が指すもの
  choice: 二回とも「律法」とし、第一の用法はその支配領域、第二の用法は次節以下で引用される聖書本文を含意できるようにした。
  alternative: 第二の用法を「律法の書」と明示する。
  rationale: νόμος の同語反復による修辞を保ち、契約的な律法と聖書としての律法という緊張を訳文で一義的に解消しないため。
- issue: ἀκούω の含意
  choice: 「言うことを聞く」とし、聞き取ることと注意深く受け止めることの両方を含ませた。
  alternative: 「聞こえないのですか」または「耳を傾けないのですか」。
  rationale: 前者は聴覚的意味に狭まり、後者は意志的な傾聴に限定されやすい。本文の語義的幅を保つ表現を選んだ。
translation_notes:
  register: 明瞭で現代的かつ品位ある呼びかけにした。「あなたがた」を補って修辞疑問の相手を明確にし、「言うことを聞く」という自然な表現で原文の語義的幅を残した。
