  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: ja
  text: しかし、女奴隷からの子は肉によって[a]生まれ、自由の身の女からの子は約束によって生まれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉によって」は、ここでは「普通の人間的な方法で」「人間の力によって」とも訳せます。罪深い性質を指すのではなく、通常の人間的な出生を指します。後半の「約束によって」は、「約束を通して」とも訳せ、神の約束によって実現した誕生を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: 女奴隷
  rationale: ハガルとサラの身分上の対比が議論の中心にあるため、婉曲的な「女中」ではなく、隷属状態を明確に示す語を選んだ。
- source_word: κατὰ σάρκα
  choice: 肉によって
  rationale: ここでは通常の人間的な生殖を指すが、パウロの重要語「肉」を本文に残し、約束との緊張を保持した。罪深い性質という意味には限定しない。
- source_word: γεγέννηται
  choice: 生まれました
  rationale: 完了受動形の結果的意味を文脈上自然な日本語で表した。日本語では「生まれていました」より、対照を述べる「生まれました」が明快である。
- source_word: ἐλευθέρα
  choice: 自由の女
  rationale: 名詞的な形容詞であり、女奴隷との法的・社会的身分の対比を保つ。「自由な女」も可能だが、身分を示す表現として「自由の女」を採用した。
- source_word: δι’ ἐπαγγελίας
  choice: 約束によって
  rationale: 前置詞 διά の媒介・根拠の含みを保ち、その誕生が神の約束によるものであることを簡潔に示す。原文に冠詞がないため「その約束」とはしなかった。
- source_word: ὁ μὲν ... ὁ δὲ
  choice: …子は…、…子は…
  rationale: 省略されている指示対象を「子」と補い、二人の息子の対照を自然な日本語で明示した。
theological_decisions:
- issue: κατὰ σάρκα と δι’ ἐπαγγελίας の対比
  choice: 「肉によって」と「約束によって」の対比を本文に保持する。
  alternative: 「普通の人間的な方法で」と「神の約束の結果として」と意訳する。
  rationale: 文脈は自然な身体的出生そのものを罪とするのではなく、通常の人間的手段による誕生と、神の約束によって実現した誕生を対比している。解釈を本文で狭めず、注で説明する。
translation_notes:
  register: 現代標準語の明快さを優先しつつ、「肉」「約束」というパウロの主要語を保持した。「女奴隷」は現代の読者にも身分差が明確に伝わる語であり、全体は簡潔で dignified な叙述調とした。
