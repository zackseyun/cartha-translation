id: GAL.4.24
reference: Galatians 4:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: ja
  text: これらのことは寓意的に語られています[a]。この二人の女性は二つの契約です。一つはシナイ山から出る契約で、奴隷の身となる子どもを産みます[b]。それはハガルです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのことは寓意的に解釈されます」または「これらのことは一つの寓意です」。ギリシア語の表現は、パウロが直前の物語を寓意的に用いていることを示します。
    reason: lexical_alternative
  - marker: b
    text: 直訳「奴隷状態へと産みます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: これらのこと
  rationale: 直前のサラとハガルに関する物語全体を受ける中性複数の関係代名詞。日本語では指示表現にして、前文とのつながりを自然に示した。
- source_word: ἀλληγορούμενα
  choice: 寓意として語られています
  rationale: 現在受動分詞とἐστινの迂言的表現を反映し、物語が寓意的に用いられていることを示す。単に『寓話である』とはせず、歴史性の有無を本文以上に断定しない。
- source_word: αὗται
  choice: この女たち
  rationale: 女性複数形の指示代名詞が直前の二人の女を指すため、指示対象を明示した。
- source_word: διαθῆκαι
  choice: 契約
  rationale: シナイ山との関連を含むパウロの文脈では、救済史的な『契約』が最も適切である。
- source_word: μία μὲν ἀπὸ ὄρους Σινᾶ
  choice: 一つはシナイ山からの契約で
  rationale: μένが次節の対比を導くことを『一つは』で示し、ἀπόの起点・由来を『から』で保った。
- source_word: εἰς δουλείαν γεννῶσα
  choice: 奴隷の身となる子どもを産みます
  rationale: 母が子を産む比喩と、εἰςが示す結果・方向を自然な日本語で表した。δουλείαの強い拘束性は『奴隷の身』で保持した。
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: それがハガルです
  rationale: 女性単数の関係代名詞による契約とハガルとの同定を、明瞭で自然な日本語にした。
theological_decisions:
- issue: サラとハガルの物語に対するパウロの扱い
  choice: 物語が『寓意として語られている』と訳す
  alternative: 『これらは一つの寓意です』、または歴史的事実ではないと明示する
  rationale: ἀλληγορούμεναは寓意的な語り方・用い方を表し得るが、人物の歴史性を否定するとは本文に明記されていないため、その緊張を残した。
- issue: 二人の女と二つの契約の関係
  choice: 『この女たちは二つの契約』と同定表現を保つ
  alternative: 『二つの契約を表しています』
  rationale: 原文のεἰσινは直接的な同定であり、『表す』と説明的に弱めず、比喩の力を保持した。
- issue: δουλείαの訳語
  choice: 奴隷の身
  alternative: 束縛、隷属状態
  rationale: 二つの契約の対比において拘束された状態が中心であり、『奴隷』が原語の強さを最も明瞭に伝える。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた標準語。『寓意』はやや専門的だが原語の重要概念を正確に保ち、脚注で補足した。文を適度に分けつつ、次節へ続くμένの対比を『一つは』で残した。
