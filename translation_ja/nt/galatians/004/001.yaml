id: GAL.4.1
reference: Galatians 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: ja
  text: 私が言いたいのはこうです。相続人は、子どもである間は[a]、すべてのものの主人であっても、奴隷[b]と少しも変わりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「未成年者である間は」とも訳せる。ギリシア語νήπιοςは幼い子どもを指すことも、まだ十分に成熟していない者を指すこともある。この文脈では、相続に関してまだ自らの権限を行使できない者という含みがある。
    reason: lexical_alternative
  - marker: b
    text: 「僕」または「召使い」とも訳される語。ここでは、束縛された身分にある者との比較を明確にするため、「奴隷」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: つまり
  rationale: 直前の議論を説明する談話標識として自然な現代日本語にした。δὲの弱い接続を保ちつつ、強い逆接や時間的な「今」を加えない。
- source_word: ἐφ’ ὅσον χρόνον
  choice: …である間は
  rationale: 一定の状態が続く期間を示す慣用句であり、日本語では「間は」が簡潔で自然。
- source_word: ὁ κληρονόμος
  choice: 相続人
  rationale: 財産を受け継ぐ者を指す標準的な日本語で、法的なたとえにも適する。
- source_word: νήπιός
  choice: 子ども
  rationale: 幼い子または未成年者を表し得る。本文では平易な「子ども」とし、相続上まだ成人していない含意を脚注で示す。
- source_word: οὐδὲν διαφέρει
  choice: 何ら変わりがありません
  rationale: 実際上の違いが全くないという強い否定を、明瞭で自然な日本語で表す。
- source_word: δούλου
  choice: 奴隷
  rationale: 束縛され他者の権威の下にある身分が比較の要点であるため、「僕」や「召使い」より原語の力を明確に伝える。
- source_word: κύριος πάντων ὤν
  choice: すべてのものの主人であっても
  rationale: κύριοςはここでは神的称号ではなく所有権を持つ者を指す。「であっても」により、分詞句に含まれる譲歩的な関係を自然に示す。
theological_decisions:
- issue: δοῦλοςの訳語
  choice: 奴隷
  alternative: 僕、召使い
  rationale: 相続人が名目上は全財産の主人でも、未成年の間は自由や実権の点で隷属身分の者と変わらない、というパウロの対比を弱めないため。
- issue: κύριος πάντωνの範囲
  choice: すべてのものの主人
  alternative: 全財産の所有者
  rationale: 文脈上は相続財産を念頭に置くが、原文のπάντωνは「すべてのもの」とだけ述べる。本文ではその広がりを保ち、文脈による理解に委ねる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の一文構造を大きく崩さず、日本語として自然になるよう譲歩句を前に置いた。
