id: GAL.4.10
reference: Galatians 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/010.yaml
  text: You are carefully observing days and months and seasons and years.
translation:
  language: ja
  text: あなたがたは、日や月や季節や年を事細かに守っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたは、日や月や定められた時や年を守っています」。ここで列挙されているのは、暦に基づく種々の遵守です。「季節」と訳した語は「定められた時」とも訳せます。
    reason: καιρούςの語義上の別訳と、列挙全体の暦的な文脈を示すため。
lexical_decisions:
- source_word: ἡμέρας
  choice: 日
  rationale: ἡμέραの対格複数を簡潔に訳した。文脈上は暦に基づく宗教的な日を指すが、原文自体に「特別な」などの修飾はないため補わない。
- source_word: παρατηρεῖσθε
  choice: 事細かに守っています
  rationale: 現在形の継続性と、注意深く遵守するという動詞の含みを自然な日本語で表した。「守る」はここで暦上の規定を実践する意味に適する。
- source_word: μῆνας
  choice: 月
  rationale: μήνの対格複数を、暦の区分として素直に訳した。
- source_word: καιρούς
  choice: 季節
  rationale: 定められた時期を指し得るκαιρόςを、特定の祭りに限定せず時間的区分として表した。別訳「定められた時」も可能。
- source_word: ἐνιαυτούς
  choice: 年
  rationale: ἐνιαυτόςの対格複数を直截に訳し、日・月・季節・年という累積的な列挙を保った。
- source_word: καὶ
  choice: や
  rationale: 反復される接続を、日本語として自然な列挙の「や」で表しつつ、項目が積み重なる調子を保った。
theological_decisions:
- issue: 暦の遵守をユダヤ教または宗教上のものと明示するか
  choice: 本文では「日・月・季節・年」という時間表現にとどめる。
  alternative: 「特別な日」「宗教上の日」「祭りの時期」などと明示する。
  rationale: 文脈は宗教的・暦的遵守を示すが、ギリシア語の各名詞そのものにはその修飾がない。特定の制度に限定せず、原文の簡潔さと解釈上の幅を保つ。
- issue: παρατηρεῖσθεの注意深さを明示するか
  choice: 「事細かに守っています」として、細部に注意して遵守する含みを表す。
  alternative: 「守っています」または「重んじています」。
  rationale: παρατηρέωには注意深く観察・遵守する語感があり、この文脈では単なる認識ではなく暦を厳密に守る行為を表す。ただし批判の理由までは訳文に加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体。「あなたがた」で複数二人称を明示した。原文の簡潔な列挙を保ち、宗派的な用語や祭りの特定は避けた。
