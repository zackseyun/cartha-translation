  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: ja
  text: それは、律法の下にある人々を贖い出し、私たちが子としての身分[a]を受けるためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「養子として迎え入れられること」。ギリシア語は文字どおりには「子（息子）として置くこと」を表す語で、家族の一員としての完全な地位と相続権を強調する。ここには女性も男性も含め、信じる者すべてが含まれる。
    reason: 語義上の別訳と、原語に含まれる子としての法的・相続上の地位、および包括的な指示対象を説明するため。
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: それは…し、…するためでした
  rationale: 二つの目的節を、日本語として自然な一続きの目的表現にまとめつつ、両者の目的性を保った。
- source_word: τοὺς ὑπὸ νόμον
  choice: 律法の下にある人々
  rationale: 文脈上、主としてモーセの律法の支配下にある人々を指す。「律法に従う」ではなく「下にある」として、原文の比喩と拘束の含みを保った。
- source_word: ἐξαγοράσῃ
  choice: 贖い出し
  rationale: 代価を払って解放するという商取引的・解放的な意味を保ち、聖書用語として定着した「贖う」に方向性を示す「出す」を添えた。
- source_word: τὴν υἱοθεσίαν
  choice: 子としての身分
  rationale: 養子に迎える行為だけでなく、家族の一員として承認され相続にあずかる身分を表す語であるため。男性だけを指すとの誤解を避けつつ、「子」としての法的・家族的地位を保った。
- source_word: ἀπολάβωμεν
  choice: 私たちが…受ける
  rationale: ここでは「受け戻す」よりも、授けられる身分を受領する意味が自然である。
theological_decisions:
- issue: υἱοθεσίαの性別を伴う子の身分
  choice: 子としての身分
  alternative: 養子とされること／息子としての身分
  rationale: 古代の相続権を背景とする「息子の身分」の含意を注で示しながら、本文では女性を含む信者全体が対象であることを自然に伝える。
- issue: 「律法の下にある人々」の指示対象
  choice: 解釈を本文で限定せず「律法の下にある人々」と訳す
  alternative: モーセの律法の下にある人々／広く律法の支配下にある人々
  rationale: 文脈は主としてモーセの律法を示唆するが、本文では原文の簡潔さと解釈上の余地を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「贖い出す」は原語の解放の方向性を示し、「子としての身分」は現代の読者に理解しやすく、注で法的・相続的背景を補う。
