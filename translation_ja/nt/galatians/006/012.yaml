id: GAL.6.12
reference: Galatians 6:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: ja
  text: 肉に関わることで体裁をよく見せようとする者たちは皆[a]、あなたがたに割礼を受けるよう強いています。それはただ、自分たちがメシア[b]の十字架のゆえに[c]迫害されないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「外面的なことでよく見せようとする者たちは皆」。ここで「肉」は、特に割礼のような身体的・外面的な事柄を指します。
    reason: lexical_alternative
  - marker: b
    text: 伝統的訳「キリスト」。
    reason: alternative_rendering
  - marker: c
    text: または「メシアの十字架に関して迫害されないため」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: 者たちは皆
  rationale: ある特徴を持つ人々を包括的に指す表現として、ギリシア語の範囲を自然な現代日本語で示す。
- source_word: θέλουσιν εὐπροσωπῆσαι
  choice: 自分をよく見せようとする
  rationale: 外面的に好印象を与えようとする意志を表す。単なる外見ではなく、人前で体面を整えるという批判的含意も保つ。
- source_word: ἐν σαρκί
  choice: 肉において
  rationale: 割礼という身体的・外面的なしるしを念頭に置きつつ、パウロの「肉」という語が持つ広がりと神学的緊張を解釈で狭めずに残す。
- source_word: οὗτοι
  choice: 者たちは
  rationale: 直前に述べた人々こそが強いているという指示的な強調を、主題として改めて示す。
- source_word: ἀναγκάζουσιν
  choice: 強いています
  rationale: 継続的な圧力や強制を簡潔に表す。単に勧めているのではないことを明確にする。
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: あなたがたに割礼を受けるよう
  rationale: 受動不定詞の意味を保ち、ガラテヤ書で争点となっている具体的行為を明示する。
- source_word: μόνον ἵνα
  choice: それはただ、…ためです
  rationale: パウロが彼らの動機をただ一つに限定していることと、目的を表す構文を自然な日本語で伝える。
- source_word: τῷ σταυρῷ
  choice: 十字架のゆえに
  rationale: 迫害の原因・理由を示す与格として理解し、日本語で関係を明瞭にする。より曖昧な「十字架に関して」も文法上考えられるため注で示す。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: ここでは固有名のような用法よりも称号としての意味が生きているため、「油注がれた者」という称号性を伝える「メシア」とする。
- source_word: μὴ διώκωνται
  choice: 迫害されないためです
  rationale: ἵναに続く受動接続法が表す、迫害を免れようとする目的を明確に訳す。
theological_decisions:
- issue: ἐν σαρκίの意味
  choice: 肉において
  alternative: 外面的なことで／外見上
  rationale: 文脈では割礼という身体的・外面的なしるしを指す可能性が高いが、「肉」を完全に言い換えるとパウロ特有の語の響きと神学的含意が失われるため、本文では直訳的表現を保ち、文脈上の意味を注で補う。
- issue: τῷ σταυρῷ τοῦ ΧριστοῦにおけるΧριστοῦ
  choice: メシアの十字架
  alternative: キリストの十字架
  rationale: Χριστόςの称号としての意味を可視化するため「メシア」と訳す一方、日本語キリスト教で定着した伝統的表現を注記する。
- issue: τῷ σταυρῷと迫害の関係
  choice: 十字架のゆえに迫害される
  alternative: 十字架に関して迫害される
  rationale: 与格を原因・理由として取るのが文脈上自然だが、原文の簡潔な与格が持つ関係性を過度に一義化しないよう、より形式的な代案も注に残す。
translation_notes:
  register: 明瞭で現代的ながら品位のある文体とした。「肉において」は日常語としてやや異質だが、パウロの用語とその多義性を保つため本文に残し、注で平易な意味を示した。強制の継続性は「強いています」で表し、文を二つに分けて動機の説明を読み取りやすくした。
