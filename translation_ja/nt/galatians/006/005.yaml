  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: ja
  text: 各自が自分の荷を担うことになるからです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「各自が自分の重荷を担うことになる」。ここで「荷」と訳したギリシア語は φορτίον であり、2節の「重荷」に用いられている βάρη とは異なる語です。
    reason: 語彙上の別訳を示すとともに、直近の文脈における φορτίον と βάρη の語彙上の違いを明示するため。
lexical_decisions:
- source_word: ἕκαστος
  choice: 一人一人が
  rationale: 個々の人をそれぞれ指す配分的な単数の意味を、自然な現代日本語で明確に表す。
- source_word: γὰρ
  choice: からです
  rationale: 直前の文脈に理由・説明を加える接続関係を、日本語の文末表現で自然に示す。
- source_word: τὸ ἴδιον
  choice: 自分自身の
  rationale: 各人に固有のもの、本人に属するものという強調を保つ。日本語では性別を不必要に限定せず、原文の配分的な意味を表現できる。
- source_word: φορτίον
  choice: 荷
  rationale: 運ぶべき荷・負担を表す語。6章2節の βάρη（「重荷」）との語彙上の違いを見える形で保つため、「重荷」ではなく「荷」とした。
- source_word: βαστάσει
  choice: 負うことになる
  rationale: 未来能動直説法を反映しつつ、日本語として自然に、各人がその荷を担うことを表す。「負う」は荷と責任の双方を含み得る原文の幅を保つ。
theological_decisions:
- issue: 6章2節との関係
  choice: 6章2節の「重荷」と本節の「荷」の語彙上の違いを保ち、互いに担う責任と各人が負うものとの緊張をそのまま残す。
  alternative: 両節をともに「重荷」と訳す、または本節を終末の裁きにおける個人の責任と明示的に解釈して訳す。
  rationale: 原文は直近の文脈で βάρη と φορτίον という別の名詞を用いている。本節だけで「荷」が具体的に何を指すかを限定せず、教理的な調和や終末論的解釈を本文に持ち込まない。
translation_notes:
  register: 明快で現代的な標準日本語。「一人一人」「自分自身」で個別性を示し、「荷を負う」という簡潔で品位ある表現を用いた。説明を表す γὰρ は文末の「からです」で自然に反映した。
