  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: ja
  text: これからは、だれも私に面倒をかけないでください。私はこの身に、イエスのしるし[a]を帯びているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「焼き印」とも訳せる。この語は、帰属先や忠誠を示すために身体につけられた印を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: これからは
  rationale: 今後を指す慣用的な時間表現として、現代日本語で自然かつ明確に訳した。
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: だれも私を煩わせないでください
  rationale: κόπους παρέχειν はここで「苦労・迷惑をかける、悩ませる」という慣用的意味を持つ。三人称命令の禁止を、日本語として自然な依頼・命令表現で示した。
- source_word: τὰ στίγματα
  choice: しるし
  rationale: 身体につけられた刻印や焼き印を指し得るが、迫害による傷跡だけに限定せず、所属や忠誠を示す含意も保持できる中立的な語を本文に採用した。具体的な語義は脚注に残した。
- source_word: τοῦ Ἰησοῦ
  choice: イエスの
  rationale: 属格が表す関係を特定しすぎず、「イエスに属する」「イエスのための」などの含意を保持した。
- source_word: ἐν τῷ σώματί μου
  choice: この身に
  rationale: 身体にあるしるしという位置関係を自然な日本語で表しつつ、結びの言葉にふさわしい簡潔で荘重な調子を保った。
- source_word: βαστάζω
  choice: 帯びている
  rationale: 身体にしるしを負い、持ち続けている意味を自然に表す。「負っている」も可能だが、苦痛だけに意味を狭めにくい表現を選んだ。
theological_decisions:
- issue: パウロの στίγματα の性質
  choice: 本文では「イエスのしるし」と中立的に訳した。
  alternative: 迫害による文字どおりの傷跡、イエスへの所属を示す焼き印、または使徒的苦難とイエスとの一体性を示す比喩と限定する。
  rationale: この語は身体上の苦難の跡とイエスへの所属の双方を想起させ得るが、本文だけでは一つに限定できないため、解釈上・神学上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの結びの戒めにある厳粛さを保った。「この身に」「帯びている」により品位を持たせつつ、古風になりすぎないようにした。
