  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: ja
  text: というのも、割礼を受けている人々自身も律法を守ってはいません。それなのに、彼らがあなたがたが割礼を受けることを望んでいるのは、あなたがたの肉体について誇るためなのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: というのも、…も…ません
  rationale: γάρの理由説明を「というのも」で前節につなぎ、οὐδέの「…さえ／も…ない」という強調を自然な日本語で表した。
- source_word: οἱ περιτεμνόμενοι
  choice: 割礼を受けている人々
  rationale: 冠詞付き現在分詞の実体詞的用法を保ち、単に「割礼を主張する人々」と解釈的に言い換えることを避けた。現在形の相も「受けている」で可能な限り保持した。
- source_word: αὐτοὶ
  choice: 自身も
  rationale: 当人たち自身さえ律法を守らない、という主語への強調を表した。
- source_word: νόμον φυλάσσουσιν
  choice: 律法を守ってはいません
  rationale: φυλάσσωの遵守の意味を、パウロの文脈で自然かつ一般的な「律法を守る」で表した。
- source_word: ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι
  choice: それなのに、彼らがあなたがたに割礼を受けさせたがる
  rationale: 対比を「それなのに」で明確にし、θέλωと目的語＋受動不定詞の構造を、日本語として自然な使役表現で訳した。
- source_word: ἵνα
  choice: …ため
  rationale: 後続内容が彼らの目的であることを明瞭に示した。
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: あなたがたの肉体のことで
  rationale: 直訳的な「肉において」は日本語では意味が不透明になりやすい。割礼という身体上のしるしを誇りの根拠とする文脈を保ち、「肉体のことで」とした。
- source_word: καυχήσωνται
  choice: 誇る
  rationale: καυχάομαιのパウロ書簡での通常の意味と、この箇所の否定的な含みを、過度に口語的でない「誇る」で表した。
theological_decisions:
- issue: この文脈におけるσάρξの意味
  choice: 割礼を受ける物理的な肉体
  alternative: 罪深い性質
  rationale: 直前の割礼への言及から、ここでは身体に刻まれる割礼のしるしが念頭にある。「罪深い性質」とすると、この文脈にない神学的意味を持ち込むことになる。
- issue: περιτεμνόμενοιの指す集団
  choice: 割礼を受けている人々
  alternative: 割礼を推進する人々
  rationale: 文脈上は割礼を求める者たちだが、分詞自体は彼らを割礼との関係によって描写する。「推進する人々」とすると文脈的推論を本文に織り込みすぎる。
- issue: νόμονにおける冠詞の欠如
  choice: 律法
  alternative: 律法全般／一つの法
  rationale: ガラテヤ書の議論ではモーセ律法を指すのが自然であり、日本語では定冠詞の有無を形態的に再現できないため、慣用的に「律法」とした。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った訳。論証のつながり、主語の強調、割礼を求める者たちの目的を自然な語順で示した。「肉体」はこの箇所のσάρξの文字どおりの身体的意味を明確にする。
