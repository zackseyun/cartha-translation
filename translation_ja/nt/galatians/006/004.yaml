  source_fidelity: 原文のδέ、各人への命令（δοκιμαζέτω ἕκαστος）、自分自身の行い（τὸ ἔργον ἑαυτοῦ）、その後の帰結（καὶ τότε）、および「自分自身についてだけであって、ほかの人についてではない」という対照（εἰς ἑαυτὸν μόνον…οὐκ εἰς τὸν ἕτερον）を適切に伝えている。「誇る理由」はκαύχημαの根拠・内容の意味を自然に表し、脚注で行為としての意味も保持している。
