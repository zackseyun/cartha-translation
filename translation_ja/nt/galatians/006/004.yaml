id: GAL.6.4
reference: Galatians 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: ja
  text: しかし、一人一人が自分の行いを吟味しなさい。そうすれば、その人は、ほかの人[b]についてではなく、自分自身についてだけ、誇る理由[a]を持つことになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誇る根拠」、または単に「誇り」とも訳せます。ギリシア語は、誇る行為そのものと、その根拠や内容のどちらをも指し得ます。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「もう一人の者」。ここでは自分と対照される、ほかの人を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔργον ἑαυτοῦ
  choice: 自分の行い
  rationale: ἔργονはここでは個々の一行為に限定されず、その人の実践や振る舞いを広く指す。「行い」は文脈上の倫理的な意味を自然に伝える。
- source_word: δοκιμαζέτω
  choice: 吟味しなさい
  rationale: 質や真価を確かめるために調べるという語義を表し、良い結果が出ることを前提としない。三人称命令は日本語で自然な直接命令として表した。
- source_word: ἕκαστος
  choice: 一人一人
  rationale: 各人に個別の自己点検を求める分配的な意味を明確にする。
- source_word: καὶ τότε
  choice: そうすれば、その人は
  rationale: 自分の行いを吟味した後に生じる結果を、自然な日本語の条件・帰結関係として示す。
- source_word: εἰς ἑαυτὸν μόνον
  choice: 自分自身についてだけ
  rationale: εἰςの関係・方向性とμόνονの限定を保ち、他者ではなく自己に関する評価だという対照を示す。
- source_word: καύχημα
  choice: 誇る理由
  rationale: 誇る行為だけでなく、その根拠や事柄を指し得る語であるため、本文では文脈に自然な「誇る理由」とし、語義の幅は脚注に残した。
- source_word: τὸν ἕτερον
  choice: ほかの人
  rationale: 自己と対照される別の人物を指すことを、現代日本語で明確に表す。
- source_word: δέ
  choice: しかし
  rationale: 直前の文脈に対する穏やかな対照と転換を示す。
theological_decisions:
- issue: パウロ書簡におけるκαύχημαの意味
  choice: 「誇る理由」と訳し、自己満足や高慢と断定しない。
  alternative: 「誇り」「誇ること」「誇る根拠」
  rationale: 語が誇る行為またはその根拠・内容を指し得るという幅を保ちつつ、他者との比較ではないという本文の焦点を示す。これが神の前で正当な確信なのか、限定的な自己評価なのかは訳文で決め切らない。
- issue: 単数の一般的人称表現
  choice: 「一人一人」「その人」「自分自身」とした。
  alternative: 男性代名詞に相当する表現を用いる。
  rationale: ギリシア語の形は男性単数だが一般的・分配的用法であり、日本語には性を示さず単数性と個別性を正確に保つ自然な表現がある。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、命令と論理的対照を端正に表した。「自分自身についてだけ」はやや改まった表現だが、εἰς句の反復と神学的な曖昧さを過度に「比較」と解釈しないために採用した。
