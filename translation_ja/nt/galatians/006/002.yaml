id: GAL.6.2
reference: Galatians 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: ja
  text: 互いの重荷を担いなさい。そうすることで、キリスト[a]の律法を全うすることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」とも訳せる。
    reason: Χριστόςの称号としての意味を示す別訳。
lexical_decisions:
- source_word: ἀλλήλων
  choice: 互いの
  rationale: 共同体の各人が相互に関わることを表す相互代名詞の意味を、自然で簡潔な日本語で保つ。
- source_word: τὰ βάρη
  choice: 重荷
  rationale: 文字どおりの重さを背景にしつつ、ここでは人が負う困難や圧迫を比喩的に指すため、「重荷」が文脈に最も適する。
- source_word: βαστάζετε
  choice: 担いなさい
  rationale: 現在命令形複数の継続的な勧告を命令表現で示し、「重荷」と自然に結び付く動詞を選んだ。単に同情するのでなく、実際に引き受けて支える含みも保つ。
- source_word: καὶ οὕτως
  choice: そうすることで
  rationale: 前の命令を、続く結果へ明確に結び付ける。現代日本語として自然であり、手段・様態の関係を表す。
- source_word: ἀναπληρώσετε
  choice: 全うすることになります
  rationale: 未来直説法を命令形に変えず、前の命令に従うことから生じる結果として表現する。「律法」との自然な連語として「全うする」を用いる。
- source_word: τὸν νόμον
  choice: 律法
  rationale: νόμοςの通常の意味と、パウロ書簡における律法をめぐる語彙的・神学的響きを保つ。「原則」などに言い換えない。
- source_word: τοῦ Χριστοῦ
  choice: キリストの
  rationale: 日本語で定着した称号「キリスト」を用い、属格が律法の帰属・特徴を示し得る曖昧さを保つ。
theological_decisions:
- issue: τὸν νόμον τοῦ Χριστοῦの属格関係
  choice: キリストの律法
  alternative: キリストが与えた律法／キリストによって特徴づけられる律法
  rationale: 原文は属格の具体的関係を限定していないため、「の」によって帰属、起源、特徴づけなどの可能性を保ち、解釈を本文へ持ち込まない。
- issue: Χριστοῦの訳語
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、「キリスト」は現代日本語の聖書・一般語法で広く定着している。原義を明示する「メシア」は脚注に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の重みと倫理的勧告にふさわしい格調を保った。二文に分け、命令とその結果の関係を読み取りやすくした。
