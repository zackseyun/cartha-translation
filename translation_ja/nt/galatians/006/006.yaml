  text: Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: ja
  text: みことばについて教えを受けている人は、教える人と、すべての良いものを分かち合いなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「教える人に、すべての良いものを分け与えなさい」とも訳せる。物質的な支援も含むと思われる。
    reason: κοινωνέω と ἐν πᾶσιν ἀγαθοῖς の構文は、相互的な共有とも、教える人への実際的な分与とも表現できるため。
lexical_decisions:
- source_word: Κοινωνείτω
  choice: 分かち合いなさい
  rationale: 現在命令形の継続的な勧告を自然な日本語で表す。ここでは単なる交わりだけでなく、実際的・物質的な支援を含み得るが、それだけに限定しない。
- source_word: δὲ
  choice: 訳出しない
  rationale: 弱い移行を示す接続詞であり、この一節だけの自然な日本語では明示しなくても流れを損なわない。強い対比を加えないため省略した。
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: みことばの教えを受ける人
  rationale: κατηχέω の継続的な教授・教導の意味を表し、後代の専門語的な『求道者』は避ける。λόγος はキリスト教の知らせ・教えを指すが、パウロ書簡で親しまれた表現を保つため『みことば』とした。
- source_word: τῷ κατηχοῦντι
  choice: 教える人と
  rationale: 与格を κοινωνέω の共有相手として取り、前半の『教えを受ける人』と対応させた。
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: すべての良いものを
  rationale: 直訳的な『すべての良いものにおいて』は日本語では不自然なため、共有される内容として自然に表した。物質的・実際的支援を含む可能性を保ちつつ、金銭だけに狭めない。
theological_decisions:
- issue: 命じられている分かち合いの性質
  choice: 教えを受ける人が、教える人とあらゆる良いものを分かち合うこと。物質的支援を含む可能性が高いが、それに限定しない。
  alternative: 一般的または霊的な交わりだけを指し、物質的支援は含まない。
  rationale: κοινωνέω、共有相手を示す与格、ἐν πᾶσιν ἀγαθοῖς の組み合わせは実際的な分与を強く示唆する。しかし原文自体は『金銭』と限定していないため、広がりを本文に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。『みことば』は聖書本文として自然な語感を保ち、『分かち合う』によって物質的支援を含みつつ意味を金銭に限定しない。
