review_pass:
  verdict: revise
  source_fidelity: 「思い違いをしてはいけません」は能動的な誤解・判断ミスを主に表し、受動態 μὴ πλανᾶσθε（「惑わされる／欺かれるな」）の警告を十分に保てていません。また、「侮られるような方ではありません」は原文の簡潔で断定的な受動表現を説明的・婉曲的に弱めています。後半の趣旨と農耕比喩は概ね保たれていますが、「何であれ」と「それを」により不定関係節と指示語の対応をより明示できます。
  naturalness: 改訂文は明快な現代標準日本語の敬体であり、格言的な力と警告の厳粛さを自然に表します。「惑わされてはいけません」「神は侮られることはありません」は日本語としても自然です。
  terminology: θεόςは「神」、μυκτηρίζεταιは「侮られる」、σπείρῃ／θερίσειは「蒔く／刈り取る」とし、重要な比喩と神学的含意を過度に説明せず保持します。ἄνθρωποςの総称性は「人」で自然に表されます。
  issues:
