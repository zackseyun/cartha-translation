  - severity: medium
    issue: οὐ μυκτηρίζεταιが「侮られるような方ではありません」と婉曲に訳されている。
    rationale: 「ような方ではありません」は原文にない性格説明へと表現を移し、断定的な格言の力を弱める。「神は侮られることはありません」は受動態と簡潔さをよりよく保つ。
  - severity: low
    issue: 後半で不定関係節と指示語の対応がやや弱い。
    rationale: 「何であれ蒔いたものを、それを」とすることで、ὃ γὰρ ἐὰν … τοῦτο καὶ の『何を蒔いても、それを』という対応を自然に明示できる。
  revised_text: 惑わされてはいけません。神は侮られることはありません。人は何であれ蒔いたものを、それを刈り取るのです。
