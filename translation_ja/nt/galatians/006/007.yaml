  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: ja
  text: 惑わされてはいけません。神は侮られることはありません。人は何であれ蒔いたものを、それを刈り取るのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: 思い違いをしてはいけません
  rationale: 受動形は「惑わされてはならない」とも訳せるが、中動・受動の形が自己欺瞞も含み得る警告として用いられるため、現代日本語で自然かつ直接的な「思い違いをしてはいけません」とした。
- source_word: θεὸς
  choice: 神
  rationale: ここでは唯一の神を指す標準的な訳語。
- source_word: οὐ μυκτηρίζεται
  choice: 侮られるような方ではありません
  rationale: μυκτηρίζωは鼻であしらう、嘲る、侮るという意味を持つ。単に言葉で嘲笑することより広い軽蔑の含意を保ちつつ、神を欺いて結果を免れることはできないという文脈に自然な表現とした。
- source_word: ὃ γὰρ ἐὰν σπείρῃ ἄνθρωπος
  choice: 人は自分が蒔いたものを
  rationale: 不定関係節による一般原則を、日本語で自然な総称の「人」で表した。蒔くという農耕の比喩は保持した。
- source_word: τοῦτο καὶ θερίσει
  choice: そのとおり刈り取ることになる
  rationale: τοῦτοの指示性とκαίの対応・強調を「そのとおり」で示し、蒔いたものと刈り取るものの厳密な対応を保った。未来形は一般原則としての帰結を「ことになる」で表した。
theological_decisions:
- issue: ἄνθρωποςの総称的単数
  choice: 人
  alternative: 一人の男／人間
  rationale: ἄνθρωποςは文法上単数だが、ここでは男女を問わない人間一般を代表する。日本語の「人」は単数・総称の両方を自然に表し、原文にない性別の限定を生じさせない。
- issue: 神は「侮られない」の意味合い
  choice: 侮られるような方ではありません
  alternative: 神を侮ることはできません／神は嘲られません
  rationale: 原文の受動形を尊重しつつ、神に対する人間の嘲りが外面的に起こり得ないという意味ではなく、神を軽んじて結果を免れることはできないという格言的な力を表した。
translation_notes:
  register: 明快で現代的な敬体。警告の厳粛さと、蒔く・刈り取るという簡潔な比喩を保った。原文上説明を要する異読や、日本語本文で保持できない重要な語義差がないため脚注は付していない。
