revisions:
- from: 思い違いをしてはいけません。神は侮られるような方ではありません。人は自分が蒔いたものを、そのとおり刈り取ることになるのです。
  to: 惑わされてはいけません。神は侮られることはありません。人は何であれ蒔いたものを、それを刈り取るのです。
  rationale: 受動命令の警告を「惑わされてはいけません」に、神が嘲り・軽蔑の対象として扱われてもそのように扱い通すことはできないという断定を「神は侮られることはありません」に改めました。後半は「何であれ蒔いたものを、それを刈り取る」として、原文の一般条件と蒔くもの・刈り取るものの対応を保持しました。本文上、脚注を必要とする異読・語義の未解決な曖昧さはありません。
