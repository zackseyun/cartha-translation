id: GAL.6.16
reference: Galatians 6:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: ja
  text: この基準に従って歩むすべての人の上に、平安とあわれみがありますように。そして、神のイスラエルの上にも。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この基準に沿って進むすべての人」とも訳せる。この動詞には、基準に沿って歩む、歩調を合わせるという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「神のイスラエル」が、キリストを信じるユダヤ人、教会全体、あるいはより広く神の民を指すのかについては、解釈が分かれている。本文はギリシア語の表現を保ち、その意味を一つに限定していない。
    reason: alternative_reading
  - marker: c
    text: 最後の「そして」は、別の集団を加える意味（「そして神のイスラエルの上にも」）とも、同じ集団を言い換える意味（「すなわち神のイスラエルの上に」）とも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: すべての人
  rationale: 不定関係代名詞の包括的な意味を、現代日本語で自然に表した。
- source_word: κανόνι
  choice: 基準
  rationale: ここでは行動を律する規範を指す。「規則」よりも広い意味を保ち、現代日本語として自然である。
- source_word: στοιχήσουσιν
  choice: 従って歩む
  rationale: 規範に沿って進むという動詞の比喩を残しつつ、意味が伝わる表現とした。未来形は格言的・将来的な適用範囲を持つが、日本語では「歩む」が自然である。
- source_word: εἰρήνη ... καὶ ἔλεος
  choice: 平安とあわれみ
  rationale: 祝福の祈願として定着した意味を保った。「あわれみ」は神の慈悲を表す、明瞭で品位ある語である。
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: 人の上に……そして……上にも
  rationale: 前置詞ἐπίの反復と祝福が注がれるイメージを保った。後半の「も」は添加の自然な日本語だが、同一集団の言い換えである可能性も脚注で保持する。
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: 神のイスラエル
  rationale: 属格構造を透明に訳し、その指示対象を本文で限定しない。
theological_decisions:
- issue: 「神のイスラエル」の指示対象
  choice: 「神のイスラエル」と直訳し、対象を特定しない
  alternative: 信仰を持つユダヤ人、教会全体、またはユダヤ人と異邦人を含む神の民と明示する
  rationale: ギリシア語だけでは論争のある指示対象を一つに確定できないため、神学的緊張を保持した。
- issue: 最後のκαίの働き
  choice: 「そして……にも」と訳す
  alternative: 「すなわち神のイスラエルの上に」と同格的に訳す
  rationale: καίは別の集団を加えるとも、先の集団を言い換えるとも解され得る。本文では通常の接続表現を用い、脚注で両方の可能性を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祝福の文にふさわしい品位を保った。「従って歩む」でパウロの歩行比喩を残し、「神のイスラエル」と最後の接続詞に関する解釈上の曖昧さは本文で解消せず、脚注に示した。
