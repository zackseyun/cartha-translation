id: GAL.6.8
reference: Galatians 6:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: ja
  text: 自分の肉[a]に種を蒔く者は、その肉から腐敗[b]を刈り取り、霊[c]に種を蒔く者は、その霊から永遠のいのちを刈り取るからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉」は文字どおりの肉体を指すこともありますが、パウロの倫理的な「肉」と「霊」の対照では、神の霊に逆らう堕落した人間のあり方を指し得ます。「自分の罪深い性質」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「朽廃」または「破滅」とも訳せます。原語は腐敗、朽廃、破滅を表し得ます。
    reason: lexical_alternative
  - marker: c
    text: ここでは神の霊、すなわち聖霊を指すと考えられます。「霊」を人間の霊と解することも文法上は可能ですが、ガラテヤ書における「肉」と「霊」の対照は通常、神の霊を指します。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の勧告に根拠を示す接続詞であるため、文末表現によって日本語として自然に理由・説明の働きを表した。
- source_word: ὁ σπείρων
  choice: 種を蒔く者
  rationale: 冠詞付き現在分詞の一般的・格言的な意味を保ち、農耕の比喩も明示した。
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: 自分の肉に
  rationale: ἑαυτοῦの再帰的な強調を「自分の」で示し、σάρξはパウロ特有の倫理的含意を説明語に置き換えず「肉」とした。
- source_word: ἐκ τῆς σαρκὸς
  choice: その肉から
  rationale: ἐκの源・起点を「から」で表し、前に出た「肉」との照応を「その」で明確にした。
- source_word: θερίσει
  choice: 刈り取る
  rationale: 未来の結果を表す文脈で日本語の非過去形を用い、「種を蒔く」と対になる収穫の比喩を保った。
- source_word: φθοράν
  choice: 滅び
  rationale: 腐敗、朽廃、破滅を含み得る語であり、ここでは終末論的な結果も含められる自然な表現として「滅び」を選び、別の語義は脚注に示した。
- source_word: ὁ δὲ σπείρων
  choice: 霊に種を蒔く者は
  rationale: δέの対照は二つの節の並列によって自然に表し、同じ構文を繰り返して原文の均衡を保った。
- source_word: εἰς τὸ πνεῦμα
  choice: 霊に
  rationale: ガラテヤ書の肉と霊の対照では神の霊を指す可能性が高い。日本語には大文字による区別がないため「霊」とし、指示対象を脚注で示した。
- source_word: ἐκ τοῦ πνεύματος
  choice: その霊から
  rationale: ἐκの源を「から」で表し、第一節の「その肉から」との平行関係を保った。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: 確立した聖書的表現として自然であり、終わりのない命と来るべき時代の命という含意を過度に限定しない。
theological_decisions:
- issue: パウロの倫理的対照におけるσάρξの訳
  choice: 肉
  alternative: 罪深い性質
  rationale: 文脈上は神の霊に逆らう堕落した人間の志向を含むが、「罪深い性質」と説明的に確定せず、パウロの語彙と身体的意味との緊張を残した。
- issue: πνεῦμαの指示対象
  choice: 霊（脚注で神の霊、すなわち聖霊と説明）
  alternative: 人間の霊
  rationale: ガラテヤ書に繰り返される肉と霊の対照から、神の霊を指すのが最も自然である。ただし日本語では大文字・小文字を区別できないため、本文を「霊」とし脚注で解釈を明示した。
- issue: φθοράが示す結果の範囲
  choice: 滅び
  alternative: 腐敗／朽ちること
  rationale: 単なる肉体的腐朽にも消滅だけにも限定せず、破滅的・終末論的結果を表せる語を選び、語の幅を脚注で保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「肉」「霊」「永遠のいのち」というパウロの主要語彙を保持した。「種を蒔く／刈り取る」の比喩と二節の対照的な構造を自然な日本語で再現し、ὅτιの説明的な働きは文末の「からです」で示した。
