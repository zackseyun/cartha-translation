  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: ja
  text: 善を行うことにくじけないようにしましょう。力尽きなければ[a]、ふさわしい時に刈り取ることになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「力尽きることなく」とも訳せます。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: 善を行うことに
  rationale: 冠詞付き中性形 τὸ καλόν と ποιέω の組み合わせを、継続的な善い行いを表す自然な日本語にした。分詞の進行的・付帯的な関係も「ことに」で勧告へ結び付けた。
- source_word: μὴ ἐγκακῶμεν
  choice: 疲れ果てないようにしましょう
  rationale: 単なる身体的疲労ではなく、善を行い続ける意欲を失うことを戒める表現。後半の ἐκλυόμενοι と区別しつつ、関連する忍耐の主題を保った。
- source_word: καιρῷ ... ἰδίῳ
  choice: ふさわしい時に
  rationale: καιρός の機にかなった時という意味と、ἴδιος のその事柄に固有の・適切なという含みを、時を特定しすぎずに表した。
- source_word: θερίσομεν
  choice: 刈り取ることになる
  rationale: 直前の種まきと収穫の比喩を保つため「刈り取る」とした。未来形は確かな将来の帰結として表現した。
- source_word: μὴ ἐκλυόμενοι
  choice: あきらめなければ
  rationale: 分詞の条件的な働きを明示し、力尽きて放棄するという意味を自然な日本語で表した。前半の ἐγκακῶμεν と同じ語にせず、修辞的な違いを保った。
theological_decisions:
- issue: 二つの忍耐表現（ἐγκακῶμεν / ἐκλυόμενοι）の関係
  choice: 「疲れ果てない」／「あきらめなければ」と関連させつつ訳し分ける
  alternative: 「落胆しない」／「力尽きずに」
  rationale: 二語を同一視せず、前者を善行への意欲の衰え、後者を最終的な断念として表した。収穫の約束が忍耐に結び付く本文の緊張をそのまま保ち、救済論上の体系へ踏み込まない。
- issue: μὴ ἐκλυόμενοι の統語的な力
  choice: 条件的に「あきらめなければ」と訳す
  alternative: 様態として「あきらめることなく」と訳す
  rationale: 条件的理解は文脈に自然だが、原文の分詞は明示的な条件節ではなく様態とも取れるため、その曖昧さを脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、勧告と農耕比喩の品位を保つ文体。「しましょう」で一人称複数の勧告を自然に表し、「刈り取る」で文脈上の比喩を維持した。
