source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: ja
  text: ですから、機会がある間は[a]、すべての人に良いことをしましょう。信仰を同じくする家族には、特にそうしましょう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「時のある間」。ギリシア語の「カイロス」は、単なる時間一般ではなく、ふさわしい時や好機を表します。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「信仰に属する家の者たち」。信仰を共有する共同体を一つの家族として描く表現です。ここでの「信仰」は、共有された「その信仰」を指すとも理解できます。
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ですから
  rationale: 二つの推論を示す小辞が、直前までの議論から結論を導く働きをする。現代日本語として自然で、論理的なつながりも明確に示す。
- source_word: ὡς καιρὸν ἔχομεν
  choice: 機会のあるかぎり
  rationale: καιρός は単なる時間の経過ではなく、行動にふさわしい時や機会を表す。「あるかぎり」により、機会が与えられている間、継続して行う含みも伝える。
- source_word: ἐργαζώμεθα
  choice: 行いましょう
  rationale: 現在接続法による勧奨を、共同体への継続的な呼びかけとして自然に表す。
- source_word: τὸ ἀγαθὸν
  choice: 善
  rationale: 冠詞付き中性形容詞の名詞的用法を簡潔に表し、道徳的に良いことを行う意味を保つ。
- source_word: πρὸς πάντας
  choice: すべての人に
  rationale: 行為が向けられる対象として全員を指す。日本語では「すべての人に」が自然であり、普遍的な範囲を明確にする。
- source_word: μάλιστα δὲ
  choice: とりわけ
  rationale: 全員という範囲を限定せず、その中で特別な優先を示す語として訳した。
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: 信仰の家族
  rationale: οἰκεῖοι の家や家族に属する者という比喩を、自然な日本語で保つ。信じる共同体を家族として描く表現であり、制度的な所属を過度に付加しない。
- source_word: πίστεως
  choice: 信仰
  rationale: πίστις の基本的な意味を保つ。この属格は、その家族を特徴づける信仰、または共有された「その信仰」を指し得るため、本文では広く「信仰」とした。
theological_decisions:
- issue: 善を行う対象の普遍性と信仰共同体への優先
  choice: すべての人に善を行い、その中でも信仰を共有する者たちを特に重んじる
  alternative: 対象を信者だけに限定する、または信者への特別な優先を認めない
  rationale: πρὸς πάντας が普遍的な対象を示し、μάλιστα がその範囲内での特別な優先を加える。両方を保ち、一方で他方を打ち消さないようにした。
- issue: τῆς πίστεως の意味
  choice: 共同体を特徴づける「信仰」
  alternative: 共有された信仰告白としての「その信仰」
  rationale: 属格は、信仰によって結ばれた家族という意味にも、共有された「その信仰」に属する家族という意味にも理解できる。本文で「信仰」と訳し、後者の可能性を注で残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、勧奨の調子を「行いましょう」で表した。「信仰の家族」は原文の家族・家の比喩を保ちながら、一般読者にも理解しやすい表現とした。後半の反復される πρὸς を「対してそうしましょう」と補って、すべての人への善行と信仰共同体への特別な優先との関係を明確にした。
