id: GAL.6.14
reference: Galatians 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: ja
  text: しかし、この私には、私たちの主イエス・キリストの十字架以外に、誇りとするものが決してあってはなりません。その十字架によって[a]、世は私に対して十字架につけられ、私も世に対して十字架につけられたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この方によって」。ギリシア語の関係代名詞は、「十字架」を指すとも、「主イエス・キリスト」を指すとも取り得ます。
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: 決して～とは思いません
  rationale: 強い拒絶を表す願望法。直訳的な「そうなってはならない」より、話者自身にかかる ἐμοὶ と不定詞 καυχᾶσθαι を自然な現代日本語で一体的に表す。
- source_word: καυχᾶσθαι
  choice: 誇る
  rationale: 文脈上、割礼などを誇ることとの対比を保つ、パウロ書簡に適した明瞭な訳語。
- source_word: εἰ μὴ
  choice: ～以外のものを
  rationale: 誇りの唯一の根拠を示す除外表現として自然な日本語にした。
- source_word: σταυρῷ
  choice: 十字架
  rationale: 受難およびパウロの神学的文脈における標準的で明瞭な訳語。
- source_word: κυρίου
  choice: 主
  rationale: 新約聖書の κύριος に対する定着した訳語であり、告白的な称号としても文脈に適う。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語では「イエス・キリスト」が Χριστός の称号的背景を含みつつ、普通の読者に最も自然で定着した表現である。
- source_word: δι’ οὗ
  choice: その十字架によって
  rationale: 最も近い先行詞 σταυρῷ を受ける道具的用法と判断し、日本語で指示対象を明示した。関係代名詞の形だけでは、十字架とキリストのどちらも文法上可能なため、別解を脚注に残す。
- source_word: κόσμος
  choice: 世
  rationale: 神に背く秩序を含み得る広い語義を解釈的に狭めず、聖書日本語として自然な「世」で保った。
- source_word: ἐσταύρωται
  choice: 十字架につけられた
  rationale: 完了受動の成立済みで持続する結果を文脈上自然に表し、十字架の比喩を保持する。
- source_word: κἀγὼ κόσμῳ
  choice: 私も世に対して十字架につけられた
  rationale: ギリシア語で省略される動詞を日本語では補い、相互的な並行関係を明瞭にした。
theological_decisions:
- issue: Χριστοῦ の称号性
  choice: イエス・キリスト
  alternative: メシアであるイエス
  rationale: Χριστός は「油注がれた者／メシア」という称号に由来するが、日本語の固有の聖書用語として「キリスト」が広く理解される。称号性を完全に消す意図ではなく、不自然な表現を避けた。
- issue: δι’ οὗ の先行詞
  choice: 十字架を先行詞として「その十字架によって」
  alternative: 主イエス・キリストを先行詞として「この方によって」
  rationale: σταυρῷ が最も近い先行詞であり、十字架を手段とする読みが文脈的にも直接的である。ただし οὗ は男性単数属格で、σταυρός と Χριστός のいずれとも形態上一致するため、人物を指す可能性を脚注で保持した。
- issue: 世界との相互的な断絶の比喩
  choice: 「世は私に対して…私も世に対して」と両方向を保つ
  alternative: 世に対する死として意訳する
  rationale: 十字架につけられるという強い比喩と、与格による相互関係を解釈的に平板化せず保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「誇ろうとは思いません」で強い個人的拒絶を自然に示し、後半では十字架の比喩と対称的構造を明示した。
