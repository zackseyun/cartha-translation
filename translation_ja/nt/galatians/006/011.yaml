  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: ja
  text: わたしが自分の手であなたがたにどれほど大きな字で書いたか、見てください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしが自分の手であなたがたにどれほど長い手紙を書いたか、見てください。」
    reason: πηλίκοις γράμμασινを文字の大きさではなく、手紙の長さと解する可能性があるため。
lexical_decisions:
- source_word: Ἴδετε
  choice: 見てください
  rationale: 注意を促すアオリスト命令形。複数の読者への直接的な呼びかけを、明瞭で自然な現代日本語にした。
- source_word: πηλίκοις
  choice: どれほど大きな
  rationale: 大きさ・程度を問う語であり、γράμμασινと結びついて文字の物理的な大きさを指す可能性が最も高い。感嘆的な含みも保つ。
- source_word: γράμμασιν
  choice: 字で
  rationale: ここでは書簡そのものより、書かれた文字・筆跡を指すと解した。「文字で」より「大きな字で」が自然な日本語である。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: ἔγραψαの間接目的語として、ガラテヤの諸教会の読者に宛てて書いたことを明示する。
- source_word: ἔγραψα
  choice: 書いた
  rationale: アオリストを自然な日本語の過去形で表した。文脈上、現在読まれている手紙への言及は十分明らかである。
- source_word: τῇ ἐμῇ χειρί
  choice: 自分の手で
  rationale: 道具・手段を示す与格とἐμῇの強調を自然に表し、パウロ本人が筆を執ったことを伝える。
theological_decisions:
- issue: πηλίκοις γράμμασινの解釈
  choice: 文字の物理的な大きさを指す
  alternative: 手紙の長さを指す（「どれほど長い手紙を」）
  rationale: γράμματαは文字・書かれた字を表すのが自然であり、直後の「自分の手で」ともよく結びつく。ただし、手紙の長さを指す解釈にも歴史的根拠があるため、脚注で保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「見てください」により直接的な注意喚起を保ち、「どれほど大きな字で」で原文の語順と感嘆的な強調を自然に反映した。
