  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: ja
  text: というのも、何者でもないのに自分は何者かだと思う人は、自分を欺いている[a]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分を惑わしている」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: というのも、…からです
  rationale: γάρの説明的な働きを自然な日本語の理由表現で示しつつ、εἰによる条件は「…人は」という一般的な条件構文に反映した。
- source_word: δοκεῖ
  choice: 思う
  rationale: 外見上そう見えるというより、本人の自己評価を指すため、明瞭で自然な「思う」とした。
- source_word: τις
  choice: 人
  rationale: 不定代名詞の一般的・代表的な意味を、性別を限定しない自然な日本語で表した。
- source_word: εἶναί τι
  choice: 自分は何者かである
  rationale: 自己を重要な存在とみなす含意を持つが、「何者か」として、μηδένとの簡潔な対照と原文の含みを保った。
- source_word: μηδὲν ὤν
  choice: 何者でもないのに
  rationale: 分詞句の状況的・譲歩的関係を自然な日本語にした。「何者でもない」は直後の「何者か」との対照を保持する。
- source_word: φρεναπατᾷ
  choice: 欺いている
  rationale: 思いを惑わせる、自分を欺くという意味を、標準的で明瞭な日本語で表した。
- source_word: ἑαυτόν
  choice: 自分を
  rationale: 主語へ戻る再帰代名詞を、日本語で性別を付さず自然に表した。
theological_decisions:
- issue: 人間の無価値についての断定範囲
  choice: 「何者でもない」と原文の強い対照を保持する
  alternative: 「取るに足りない者なのに」または「実際以上に自分を重要だと思うなら」
  rationale: 本文はτιとμηδένを鋭く対照させている。人間存在一般の絶対的無価値という教義命題へ広げず、文脈上の自己過大評価への警告として読める表現を保った。
- issue: 一般的な人物への言及
  choice: 性別を限定しない「人」「自分」
  alternative: 「彼」「自分自身」
  rationale: ギリシア語の不定代名詞と再帰代名詞は代表的単数であり、日本語では性別を明示せず単数の一般性を自然に保持できる。
translation_notes:
  register: 明瞭な現代標準語とし、パウロの簡潔で鋭い「何者か／何者でもない」という対照を保持した。節末の「からです」で前節への説明的つながりを示した。
