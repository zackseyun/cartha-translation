id: GAL.6.1
reference: Galatians 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: ja
  text: 兄弟たち[a]、たとえだれかが何かの過ちに捕らえられたとしても[b]、霊的なあなたがたは、柔和な態度で、そのような人を立ち直らせなさい。あなた自身も誘惑されないように、自分をよく見守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は男性複数形の語の訳だが、ここでは女性を含む信者仲間全体への呼びかけとなり得る。「兄弟姉妹たち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「何かの過ちを犯しているところを見つかった」、または「何かの過ちに不意に捕らえられた」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 兄弟たち[a]
  rationale: 呼格の男性複数形を明示しつつ、文脈上は男女を含む信者仲間への呼びかけとなり得ることを脚注で示す。
- source_word: ἐὰν καὶ
  choice: たとえ～としても
  rationale: 条件に伴う譲歩の意味を、自然な現代日本語で表す。
- source_word: προλημφθῇ
  choice: 陥ってしまった[b]
  rationale: 罪過に不意に捕らえられる、または先に追いつかれる含みを自然に表し、発見されるという意味に限定しない。別の可能性は脚注に残す。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ἄνθρωποςはここでは個々の人間を一般的に指すため、日本語で自然かつ原文に即した「人」とする。
- source_word: ἔν τινι παραπτώματι
  choice: 何かの過ちに
  rationale: τινιを「何かの」、παράπτωμαの道徳的な踏み外しを「過ち」で表す。
- source_word: οἱ πνευματικοὶ
  choice: 霊に導かれているあなたがた
  rationale: 単に人格的に『霊的』というより、ガラテヤ書の文脈で神の霊によって歩む者を指す可能性を明瞭に表す。ただし成熟者だけに限定しない。
- source_word: καταρτίζετε
  choice: 立ち直らせなさい
  rationale: 命令法を明示し、損なわれた状態を正しく整え、回復させる語義を自然な日本語で伝える。
- source_word: ἐν πνεύματι πραΰτητος
  choice: 柔和な心で
  rationale: 人の態度・心を指す読みを自然に表しながら、直前の『霊』と御霊の実としての柔和さとの響きを保つ。
- source_word: σκοπῶν σεαυτόν
  choice: 自分に注意を払いなさい
  rationale: 単数形への移行を保ち、回復に当たる一人ひとりが自分を見張るよう求める意味を明確にする。
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: 自分自身も誘惑されないよう
  rationale: 道徳的文脈に合う『誘惑される』を採り、καὶ σὺの強調と共有された弱さを「自分自身も」で表す。
theological_decisions:
- issue: οἱ πνευματικοὶにおける『霊的な人々』の意味
  choice: 霊に導かれているあなたがた
  alternative: 霊的なあなたがた
  rationale: ガラテヤ5章の文脈は御霊によって歩むことを強調するため、神の霊との関係を示す。ただし、特別な階級や完全な者を意味するとはしない。
- issue: προλημφθῇが表す、過ちとの関係
  choice: 過ちに陥ってしまった
  alternative: 過ちを犯しているところを見つかった／過ちに不意に捕らえられた
  rationale: 動詞は過ちに先を越される、不意に捕らえられる、または現行犯で見つかるという幅を持つ。本文は本人が過ちに捕らわれた含みを採り、脚注で曖昧さを保存する。
- issue: ἐν πνεύματι πραΰτητοςのπνεῦμα
  choice: 柔和な心で
  alternative: 柔和の霊によって／柔和な態度で
  rationale: 直接には回復する者の柔和な気質・態度を指す可能性が高いが、聖霊が生み出す柔和さとの神学的な響きを排除しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令の力を「立ち直らせなさい」で明示し、後半は単数形の自己警戒を自然に伝える。「ただし」で回復者自身への警告への転換を示した。
