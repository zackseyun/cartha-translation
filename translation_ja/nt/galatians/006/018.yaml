id: GAL.6.18
reference: Galatians 6:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: ja
  text: 兄弟たち[b]、私たちの主イエス・キリスト[a]の恵みが、あなたがたの霊とともにありますように。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「油を注がれた者」を意味する称号で、「メシア」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここで「兄弟たち」は信仰者の共同体全体への呼びかけで、女性も含み得る。別訳「兄弟姉妹の皆さん」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの祝祷で定着した語であり、神の惜しみない好意と賜物という含みを簡潔に保つ。
- source_word: κυρίου
  choice: 主
  rationale: 初期キリスト教の告白的な用法に合い、日本語でも尊厳と親しみのある標準的な訳語である。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 固有名「イエス」と称号 Χριστός を、日本語で広く理解されている形で表した。称号の意味と別訳は脚注で明示する。
- source_word: μετὰ τοῦ πνεύματος ὑμῶν
  choice: あなたがたの霊とともにありますように
  rationale: 動詞のないギリシャ語の祝祷表現を自然な願望文として補い、複数の受け手に属する単数形の「霊」という原文の表現を保った。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを直接に訳しつつ、会衆全体を指し得ることを脚注で示す。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な結語として日本語に定着した音写を用いる。
theological_decisions:
- issue: Χριστός を称号としてどう表すか
  choice: 本文では「キリスト」とし、称号の意味を脚注で示す
  alternative: メシア
  rationale: Χριστός の称号性を失わせない一方、日本語読者に最も広く通用する「イエス・キリスト」という形を本文に保った。
- issue: ἀδελφοί が会衆全体を指す可能性
  choice: 本文は「兄弟たち」
  alternative: 兄弟姉妹の皆さん
  rationale: 原文の文法上の男性複数形を保ちつつ、男女を含む信仰共同体への呼びかけとなり得ることを脚注で明らかにした。
- issue: πνεύματος ὑμῶν の単数形
  choice: あなたがたの霊
  alternative: あなたがた
  rationale: 単なる代名詞に平板化せず、複数の受け手に対して「霊」が単数で置かれている原文の緊張と共同体的な響きを保った。
translation_notes:
  register: 明瞭な現代標準語による、簡潔で尊厳のある祝祷文。「ありますように」でギリシャ語の省略された願望を自然に補い、呼びかけを文頭に移して日本語としての読みやすさを確保した。
