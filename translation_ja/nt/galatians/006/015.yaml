source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: ja
  text: というのも、割礼を受けていることも、受けていないことも、何の価値もないからです。重要なのは、新しい創造[a]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「新しく造られたもの」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ … οὔτε
  choice: …かどうかは、何の意味もありません
  rationale: 前後二つの身分を一組として否定する構文を、現代日本語で自然かつ明瞭に表した。γάρは前節との説明的連結を担うが、日本語では独立した「なぜなら」を置かず、文脈上のつながりに委ねた。
- source_word: περιτομή … ἀκροβυστία
  choice: 割礼を受けているかどうか
  rationale: 身体的状態だけでなく、割礼によって示される宗教的・共同体的身分の対照を簡潔に伝える。
- source_word: τί ἐστιν
  choice: 何の意味もありません
  rationale: 直訳的な「何ものでもない」が表す、決定的意義や価値がないという慣用的意味を自然な日本語にした。
- source_word: ἀλλὰ
  choice: 大切なのは
  rationale: 省略された述語を補いつつ、前二項と真に重要なものとの強い対照を明示した。
- source_word: καινὴ κτίσις
  choice: 新しい創造
  rationale: κτίσιςが持つ「創造」と「被造物」の幅を踏まえ、ここでは個人だけに限定せず、パウロ的な刷新の広がりを保つ「創造」を採用した。
theological_decisions:
- issue: 割礼・無割礼と新しい創造との対照
  choice: 割礼の有無はいずれも決定的意義を持たず、新しい創造こそが重要だと訳す
  alternative: 両者を単なる社会的身分の違いとしてのみ読む、または双方を同等の救いの道と読む
  rationale: 原文は割礼と無割礼の双方を否定し、ἀλλάによって「新しい創造」を対置する。救済論的含意を過度に説明せず、原文の緊張と簡潔さを保った。
- issue: καινὴ κτίσιςの範囲
  choice: 「新しい創造」とし、個人かより広い創造的刷新かを限定しない
  alternative: 「新しく造られた人」として個人に限定する
  rationale: κτίσιςには「創造」と「被造物」の両義があり、文脈上は前者がより適切だが、本文以上に範囲を狭めないため。
translation_notes:
  register: 簡潔で格調を保ちながら、一般読者に理解しやすい現代標準日本語とした。「無割礼」という専門語を避け、「割礼を受けているかどうか」と自然に表現した。
