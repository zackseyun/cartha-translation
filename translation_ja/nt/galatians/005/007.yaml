lexical_decisions:
- source_word: Ἐτρέχετε
  choice: 走っていました
  rationale: 未完了過去の継続的な動作を表し、パウロの競走の比喩を、原文にない「競走」を補わずに保つ。
- source_word: καλῶς
  choice: よく
  rationale: 走り方または信仰上の歩みが順調であったことを、簡潔で自然な現代日本語で表す。
- source_word: τίς
  choice: だれが
  rationale: 妨害した主体を人として問う疑問代名詞をそのまま表す。
- source_word: ἐνέκοψεν
  choice: 妨げ
  rationale: 進行を阻む意味を明確に表しつつ、直前の「走っていました」によって競走中の妨害という含みも残る。
- source_word: τῇ ἀληθείᾳ
  choice: 真理に
  rationale: πείθεσθαιの与格補語として訳し、文脈上の福音の真理を指す表現を保つ。
- source_word: μὴ πείθεσθαι
  choice: 従わないようにした
  rationale: πείθομαιがここで持ち得る「従う」の意味を本文に採り、妨害の結果を自然な日本語で示す。別の可能性である「真理を信じ受け入れないようにした」は脚注に残す。
theological_decisions:
- issue: πείθεσθαιとτῇ ἀληθείᾳの意味関係
  choice: 真理に従わないようにした
  alternative: 真理を信じ受け入れないようにした
  rationale: 文脈は福音の真理に対するガラテヤ人の応答と離反を扱っているため、「従う」は実践的応答をよく表す。ただしπείθομαιには「説得される、信じ受け入れる」という意味もあり得るので、その語義上の緊張を脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「走る」という比喩を保持し、原文に明示されない「競走」は補わない。修辞疑問の力を自然に示すため「それなのに」を用いた。
