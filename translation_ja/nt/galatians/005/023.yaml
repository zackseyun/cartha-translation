id: GAL.5.23
reference: Galatians 5:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πραΰτης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: ja
  text: 柔和、自制です。このようなもの[a]に反対する律法[b]はありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このような人々」。ただし、ここでは御霊の実として列挙された性質を指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: ここでの「律法」はモーセ律法を念頭に置いているとも考えられるが、原文には定冠詞がなく、より広く「法」を指す余地もある。
    reason: theological_ambiguity
lexical_decisions:
- source_word: πραΰτης
  choice: 柔和
  rationale: 穏やかで謙遜な、他者に対して厳しく当たらない姿勢を表す。現代日本語のキリスト教文脈でも通用し、単なる弱さを意味しない「柔和」が簡潔で適切である。
- source_word: ἐγκράτεια
  choice: 自制
  rationale: 欲望や衝動を抑え、自分を治めることを指す。現代日本語として自然で、倫理的な意味を明確に伝える。
- source_word: κατὰ τῶν τοιούτων
  choice: このようなものに反対する
  rationale: τοιούτωνは文法上、人にも事柄にもなり得るが、直前まで列挙された御霊の実の諸性質を受けると理解するのが文脈上最も自然である。「反対する」はκατάの対立的な関係を保つ。
- source_word: νόμος
  choice: 律法
  rationale: ガラテヤ書の文脈を踏まえ、日本語聖書でνόμοςを表す標準的な語を用いた。ギリシア語には定冠詞がないため、モーセ律法だけに限定せず、より一般的な法の原則も響く表現としている。
theological_decisions:
- issue: νόμοςの範囲
  choice: 本文では「律法」とし、特定の律法だけに限定しない。
  alternative: モーセ律法を特に指す「その律法」と解する。
  rationale: ガラテヤ書全体ではモーセ律法が重要な背景にある一方、ここではνόμοςが無冠詞であり、こうした徳に反対する法はないという格言的で広い響きがある。その両方を排除しないようにした。
- issue: τοιούτωνが指すもの
  choice: 列挙された諸性質を指す「このようなもの」。
  alternative: それらの性質を示す人々を指す「このような人々」。
  rationale: 文法上はどちらも可能だが、直前の「御霊の実」とその諸性質を受ける中性の理解が文脈上有力である。別解は脚注に残した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語としつつ、徳目には品位ある定着語「柔和」「自制」を用いた。前節から続く列挙であることを示すため「です」でいったん文を結び、後半の格言的な宣言を独立させた。
