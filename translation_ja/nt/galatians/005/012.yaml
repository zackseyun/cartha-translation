review_pass:
  verdict: revise
  source_fidelity: ἀποκόψονται is a sharp cutting word in the circumcision controversy and most naturally alludes to self-mutilation/castration, while its precise object remains unstated. The draft's 「自分の体まで」 introduces an unnecessary explicit object and makes 「まで」 attach awkwardly to 「体」 rather than clearly marking the rhetorical escalation conveyed by καί.
  naturalness: 「自分の体まで切り取ってしまえば」 is understandable but somewhat unnatural in modern Japanese and can suggest removing an unspecified body part. 「自らの身を切り取ってしまえば」 is more concise and idiomatic enough for the deliberately jarring rhetoric.
  terminology: 「あなたがたをかき乱す者たち」 adequately renders οἱ ἀναστατοῦντες. The proposed wording preserves the cutting imagery without doctrinally or lexically requiring the main text to specify castration; the note supplies the likely contextual sense and the alternative 'cut off' sense.
  issues:
  - severity: medium
    issue: 本文の「自分の体まで」は原文にない対象を明示し、「まで」の修辞的な係り先も不自然である。
    rationale: 原文は目的語を明示せず、καίが願いを強める。本文では「いっそのこと」で強調を表し、身体的含意は文脈説明を伴う脚注で示すほうが、原文の表現上の幅を保てる。
  - severity: low
    issue: 脚注aの「直訳では『自らを切り離してしまえば』」は、中態と語義の可能性を反映するが、本文の切断語とのつながりをより明確にできる。
    rationale: 『自らの身を切り取る』という本文に対して、別の可能な理解として『自らを切り離す』を示すよう整えると、去勢という文脈上有力な含意と語義上の曖昧さの双方が明瞭になる。
