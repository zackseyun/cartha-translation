  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: ja
  text: あなたがたをかき乱す者たち[b]は、いっそのこと、自らの身を切り取ってしまえばよいのに[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自らを切り離してしまえば」。割礼をめぐる文脈では、割礼よりさらに進んで自分の体を傷つけること、特に去勢することを指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたを悩ませている者たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: ～してしまえばよいのに
  rationale: 実現を願う強い願望を表す語。現代日本語として自然な「～すればよいのに」により、パウロの鋭い願いを保った。
- source_word: καὶ
  choice: いっそのこと、～まで
  rationale: 単なる並列ではなく、割礼からさらに進むという修辞的な強調を表すため、「いっそのこと」と「まで」で段階の高まりを示した。
- source_word: ἀποκόψονται
  choice: 自分の体まで切り取ってしまえば
  rationale: 基本義である「切り取る、切り離す」と、中態による自己への動作を表した。割礼をめぐる文脈で去勢をほのめかす強烈な語遊びを保ちつつ、本文では行為を去勢だけに限定しすぎない表現とした。
- source_word: οἱ ἀναστατοῦντες
  choice: かき乱す者たち
  rationale: 共同体に動揺と混乱を引き起こす継続的な働きを、明瞭で自然な現代日本語にした。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: ガラテヤの信徒たちを集合的に指す二人称複数を明示した。
theological_decisions:
- issue: 割礼との関連におけるパウロの修辞的な願い
  choice: 割礼を唱える者たちがさらに進んで自分の体を切り取ればよい、という鋭い皮肉ないし誇張として訳す
  alternative: 共同体から自ら離脱すればよい、という意味に取る
  rationale: 直前から続く割礼論争により、「切る」という語の身体的な語遊びが最も文脈に即している。ただし「切り離す」という一般的意味も語義上あり得るため、脚注で示した。
- issue: ἀποκόψονταιが示す身体行為の具体性
  choice: 本文では「自分の体まで切り取る」とし、去勢の可能性を脚注で説明する
  alternative: 本文で明確に「去勢する」と訳す
  rationale: 文脈上は去勢を指す可能性が高いが、語そのものはより広く「切り取る、切り離す」を意味する。本文で過度に限定せず、原文の衝撃と解釈上の幅を両立させた。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、パウロの鋭い皮肉と身体的な比喩の衝撃を弱めないようにした。「自分の体まで切り取る」は露骨すぎる俗語を避けながら、原文の切断をめぐる語遊びを伝える表現である。
