  text: この説得[a]は、あなたがたを召しておられる方から出たものではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この影響は、あなたがたを召しておられる方から出たものではありません。」
    reason: πεισμονήは「説得」のほか、説得によって及ぼされる「影響」を指す可能性もあるため。
lexical_decisions:
- source_word: πεισμονὴ
  choice: 説得
  rationale: まれな名詞で、説得する働き、または説得されて受け入れた状態やその影響を表し得ます。文脈上、ガラテヤの人々が惑わす者たちの主張に動かされていることを指しますが、意味を狭く決めすぎないよう、抽象名詞の「説得」としました。
- source_word: ἐκ
  choice: から出たもの
  rationale: 源や由来を示します。日本語として自然にしつつ、この説得がその方に由来しないという否定を明確に表します。
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: あなたがたを召しておられる方
  rationale: 現在分詞の名詞的用法を保ち、継続的な働きを「召しておられる」で表しました。指示対象を本文で明示的に「神」とは補いません。
- source_word: οὐκ
  choice: ではありません
  rationale: 由来を明確に否定する表現として、現代の丁寧で格調ある文体に整えました。
theological_decisions:
- issue: 「あなたがたを召しておられる方」の指示対象
  choice: 本文では原文どおり「方」とし、「神」を補わない
  alternative: 「あなたがたを召しておられる神」
  rationale: ガラテヤ書の文脈では神を指すと考えるのが自然ですが、ギリシア語本文は「神」という名詞を明記せず、名詞的な現在分詞で表しています。そのため、指示対象を読者が文脈から理解できる形で保ちました。
translation_notes:
  register: 明瞭な現代標準日本語を用い、丁寧さと聖書本文としての品位を両立させました。「召しておられる」は神学的な召しを示す慣用を保ちながら、原文の現在分詞の継続的な響きを伝えます。
