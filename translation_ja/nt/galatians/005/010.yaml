id: GAL.5.10
reference: Galatians 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: ja
  text: 私は主にあって、あなたがたがほかの考えを持つことはないと確信しています。[a] しかし、あなたがたを動揺させている者は、だれであろうと[b]、裁きを負うことになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたは別の見方をすることはないでしょう」とも訳せる。ギリシャ語の動詞は、一般的に考えることだけでなく、特定の見解や心構えを持つことも表す。
    reason: lexical_alternative
  - marker: b
    text: 「その人がだれであっても」、または「どのような者であっても」の意。
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: 確信しています
  rationale: 完了形が表す、現在まで続く確かな信頼の状態を、自然な現代日本語で示した。
- source_word: εἰς ὑμᾶς
  choice: あなたがたについて
  rationale: 確信がガラテヤの人々とその応答に向けられていることを表しつつ、「あなたがたを信頼する」と意味を限定しすぎないようにした。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロに特徴的な表現を保ち、確信の基盤または領域が主にあることを示した。
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: ほかの考えを持たないでしょう
  rationale: φρονέωが表す思考・見解・心構えの幅を保ちながら、日本語として明瞭にした。別の見方を採用しないという意味も脚注で示した。
- source_word: ὁ ταράσσων ὑμᾶς
  choice: あなたがたを動揺させている者
  rationale: 共同体をかき乱し、不安定にしている継続的な働きを自然に表した。
- source_word: βαστάσει τὸ κρίμα
  choice: その裁きを負うことになります
  rationale: βαστάζωの「負う」という比喩を保ち、κρίμαを判決・処罰・有罪宣告のいずれかに狭めなかった。
- source_word: ὅστις ἐὰν ᾖ
  choice: だれであろうと
  rationale: その人物の身元や立場にかかわらないという不定・譲歩的な力を簡潔に表した。
theological_decisions:
- issue: ガラテヤの人々に対するパウロの確信の性質
  choice: 彼らの今後の考えについて、主に根ざした確信を表す
  alternative: 全員の無条件の堅忍を断定する、または単なる個人的な楽観を述べる
  rationale: 本文は個人的な確信と「主にあって」という神学的な基盤の双方を述べるが、結果の仕組みまでは説明していないため、その緊張を保った。
- issue: τὸ κρίμαの性質
  choice: 具体的な形を限定しない「裁き」
  alternative: 永遠の断罪、または教会内の懲戒だけを指すと限定する
  rationale: κρίμαは裁定、その結果、処罰を含み得るが、この節だけでは裁きの厳密な性質を特定できないため、包括的な訳語を用いた。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「主にあって」はパウロ書簡の神学的・関係的な表現として保持し、「裁きを負う」は原文の比喩と意味の幅を残した。
