reference: Galatians 5:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: ja
  text: というのも、肉[a]は聖霊[b]に逆らうことを欲し、聖霊は肉に逆らうことを欲しているからです。この二つは互いに対立しているので、あなたがたは自分の望むことを行えないのです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉」は単なる肉体ではなく、ここでは神に逆らう人間の傾向を含むパウロ特有の表現。「罪深い性質」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 原文は「霊」とも訳せるが、文脈上は聖霊を指すと考えられる。
    reason: alternative_reading
  - marker: c
    text: 直訳に近くは「あなたがたが望むことを何でも行わないように」。この節は、肉と聖霊の対立の結果、望むことを思いどおりには行えないという意味にも取れる。
    reason: purpose_result_ambiguity
lexical_decisions:
- source_word: σάρξ
  choice: 肉
  rationale: パウロの比喩的・神学的な語彙を保つため、「罪深い性質」と意訳せず「肉」とした。ここでは単なる身体ではなく、神に逆らう人間の傾向を含む倫理的な意味で用いられている。
- source_word: ἐπιθυμεῖ
  choice: 欲する
  rationale: 強い志向や欲求を表しつつ、性的な意味に限定されない語として選んだ。敵対する方向は「～に逆らうこと」で明示した。
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: 御霊に逆らうこと／肉に逆らうこと
  rationale: κατά＋属格の敵対的な方向を自然な日本語で示し、「欲する」の内容として補った。
- source_word: πνεῦμα
  choice: 御霊
  rationale: ガラテヤ5章の前後で、信者を導く神の霊と肉が対比されているため、聖霊を指す可能性が最も高い。ただし人間の霊と取る余地は脚注に残した。
- source_word: ἀλλήλοις ἀντίκειται
  choice: 互いに対立している
  rationale: 双方が相手に逆らう相互的な敵対関係を簡潔かつ自然に表した。
- source_word: ἵνα μὴ
  choice: ～ので、…行えない
  rationale: ここでは肉と御霊の対立がもたらす実際上の結果として読んだ。目的を表す可能性もあるため脚注で示した。
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: 自分の望むことを行えない
  rationale: 不定関係節の意味を明瞭な現代日本語にし、ποιέωは過度な習慣性を加えず「行う」と訳した。
theological_decisions:
- issue: パウロの倫理的文脈におけるσάρξの意味
  choice: 本文では「肉」とし、パウロの比喩を保持する。
  alternative: 罪深い性質
  rationale: 倫理的には神に逆らう人間の傾向を指すが、「罪深い性質」とすると一つの解釈に限定されやすい。「肉」は身体そのものだけを意味しないことを脚注で説明した。
- issue: πνεῦμαの指示対象
  choice: 聖霊を指すものとして「御霊」と訳す。
  alternative: 人間の「霊」
  rationale: ガラテヤ5章全体では、肉に従う生き方と神の御霊に導かれる生き方が対比されている。ただし原文自体に大文字・小文字による区別はないため、別解を脚注に残した。
- issue: ἵνα μὴ節の目的・結果のニュアンス
  choice: 対立の結果として「行えない」と訳す。
  alternative: 「行わないように」と目的として訳す。
  rationale: 文脈上、二つの力の対立が人の行動を妨げる実際的な帰結を述べる読みが自然である一方、ἵναは目的を表し得るため、その緊張を脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「肉」と「御霊」という聖書的な主要語を保持しつつ、文の構造は一般読者に理解しやすい形に整えた。
