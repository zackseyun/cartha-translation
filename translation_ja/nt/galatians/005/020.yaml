lexical_decisions:
- source_word: εἰδωλολατρία
  choice: 偶像礼拝
  rationale: 偶像を礼拝し仕える行為を指す、明確で一般的な現代日本語。
- source_word: φαρμακεία
  choice: 魔術
  rationale: この悪徳表では薬一般ではなく、薬物や呪文に結び付いた魔術的行為を指す。「魔術」は文化的に狭すぎず、簡潔である。
- source_word: ἔχθραι
  choice: 敵意
  rationale: 複数形が表す敵対的な態度やその現れを、日本語では集合的な「敵意」で自然に表現できる。
- source_word: ἔρις
  choice: 争い
  rationale: 対人関係における口論や対立を含む語であり、悪徳表に適した簡潔な表現。
- source_word: ζῆλος
  choice: ねたみ
  rationale: 否定的文脈なので、積極的な「熱心」ではなく、競争心を伴う嫉妬の意味を採る。
- source_word: θυμοί
  choice: 怒りの爆発
  rationale: 複数形は繰り返される激しい怒りの噴出を示すため、単なる「怒り」より動的な表現とした。
- source_word: ἐριθεῖαι
  choice: 利己的な野心
  rationale: 自分の利益や地位を求める党派的な自己追求という動機と行動の双方を伝える。
- source_word: διχοστασίαι
  choice: 仲間割れ
  rationale: 共同体の中で人々が対立して分かれることを、普通の読者に分かりやすい自然な日本語で示す。
- source_word: αἱρέσεις
  choice: 派閥
  rationale: ここでは後代の教理上の「異端」より、共同体を分裂させる党派・集団という社会的意味が中心である。
theological_decisions:
- issue: αἱρέσεις の訳語
  choice: 派閥
  alternative: 分派、宗派、異端
  rationale: 周囲には対人・共同体的な悪徳が並ぶため、分裂を生む党派という意味を優先する。「異端」では後代の教会用語を読み込むおそれがあるが、その語義の発展は脚注で示す。
translation_notes:
  register: 簡潔な悪徳表のリズムを保ちつつ、現代の一般読者に明瞭で dignified な標準日本語とした。節が次節へ続くため末尾を読点とした。脚注記号は該当語の直後に置いた。
