  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: ja
  text: 見なさい。私、パウロが、あなたがたに言います。もしあなたがたが割礼を受けるなら[a]、メシア[b]はあなたがたにとって何の益にもなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「割礼を施されるなら」または「自ら割礼を受けるなら」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「キリストス」。ここでは称号として「メシア」と訳した。慣用的には「キリスト」とも訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 見なさい
  rationale: 注意を強く促す語として、パウロの警告の切迫した調子を保つ簡潔な表現とした。
- source_word: ἐγὼ Παῦλος
  choice: 私パウロが
  rationale: 明示された一人称代名詞と固有名の両方を残し、パウロ自身が責任をもって断言する強調を表した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 与格の対象を明示し、直接的な発言として自然な現代日本語にした。
- source_word: ἐὰν περιτέμνησθε
  choice: もしあなたがたが割礼を受けるなら
  rationale: 受動形が表す、割礼を施されることを簡潔に示した。文脈上の目的や動機は本文に補わず、解釈の余地を保った。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここではイエスの称号としての機能が有意であるため、「キリスト」という音写的な慣用形ではなく、称号の意味を伝える「メシア」とした。
- source_word: οὐδὲν ὠφελήσει
  choice: 何の益ももたらしません
  rationale: 未来の帰結と利益の全面的な否定を、明瞭で自然な日本語で表した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この警告では称号としての意味が働いているため「メシア」とした。ただし、本文以上の救済論的説明は加えていない。
- issue: 割礼に関する警告の射程
  choice: 割礼を受ける場合、メシアが何の益ももたらさないという本文の警告をそのまま示す
  alternative: 医療的・民族的慣行を含む、あらゆる割礼そのものへの普遍的非難と明示する
  rationale: ガラテヤ書の文脈は義と認められるための律法遵守として割礼を求める問題に関わるが、その限定説明を節本文へ挿入せず、原文の簡潔さと神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「見なさい」で警告への注意を促し、「私パウロが」で原文の自己強調を保持した。脚注記号は対応する「割礼を受けるなら」と「メシア」の直後に置いた。
