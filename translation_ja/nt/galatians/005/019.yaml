    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: 明らかです
  rationale: 目に見えてはっきりしている、明白であるという意味を、自然な現代日本語で表した。
- source_word: δέ
  choice: 訳文では明示しない
  rationale: 前文からの緩やかな移行・対照を示すが、この一節だけで「さて」「しかし」を補うと強調しすぎるため、日本語では文脈に委ねた。
- source_word: τὰ ἔργα
  choice: 行い
  rationale: 具体的な行為や振る舞いを指す。「業」より現代の一般読者に明瞭であり、後続の「御霊の実」との複数対単数の対照も保つ。
- source_word: τῆς σαρκός
  choice: 肉の
  rationale: パウロの肉と御霊の対照、および比喩の神学的緊張を保つため、解釈的な「罪深い性質」に置き換えない。
- source_word: ἅτινά ἐστιν
  choice: すなわち
  rationale: 先行する「肉の行い」の内容を、後続の列挙によって具体化する機能を自然に示す。
- source_word: πορνεία
  choice: 性的不道徳
  rationale: 不正な性的行為を広く指す語であり、狭すぎる「姦淫」や古風な表現を避けた。
- source_word: ἀκαθαρσία
  choice: 汚れ
  rationale: この文脈での道徳的・性的な不純さを、簡潔で聖書的な響きを保つ語で表した。
- source_word: ἀσέλγεια
  choice: 放縦
  rationale: 恥を顧みない奔放な自己放任、とりわけ性的な節度の欠如を含む意味を簡潔に表す。
theological_decisions:
- issue: パウロの倫理的文脈における σάρξ の訳
  choice: 肉
  alternative: 罪深い性質
  rationale: 「罪深い性質」はこの文脈の意味を説明し得るが、σάρξ を一つの解釈に固定する。本文では「肉」として、パウロの比喩と「御霊」との対照を保持し、説明を脚注に置いた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御霊」との対照を見据えて「肉」を保持した。脚注記号は、脚注が説明する「肉」の直後に置くのが最も明瞭だが、本文では文末に配置して列挙の流れを妨げない形とした。
