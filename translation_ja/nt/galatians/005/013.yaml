revisions:
- from: 兄弟たち、あなたがたは自由へと召されたのです。ただ、その自由を肉の欲望につけ込む機会としてはなりません[a]。むしろ、愛によって互いに仕えなさい[b]。
  to: 兄弟たち[a]、あなたがたは自由へと召されたのです。ただし、その自由を肉[b]のための機会として用いてはいけません。むしろ、愛によって互いに仕えなさい[c]。
  rationale: 「肉」を本文に保持し、ἀφορμήの比喩を「肉のための機会」として明確にしました。これにより、自由を肉に仕えるための足掛かりにしないという原文の警告を保ちつつ、現代標準日本語として自然な文に整えています。ἀδελφοίの包括的な宛先、およびδουλεύετεの強い奉仕の語感は脚注で明示しました。
