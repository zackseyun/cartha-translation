id: GAL.5.13
reference: Galatians 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: ja
  text: 兄弟たち[a]、あなたがたは自由へと召されたのです。ただし、その自由を肉[b]のための機会として用いてはいけません。むしろ、愛によって互いに仕えなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」と訳した男性複数形は、この手紙では女性を含む信仰共同体全体に呼びかける語です。
    reason: lexical_alternative
  - marker: b
    text: 「肉」は単に身体を指すのではなく、ここでは神に逆らう自己中心的で罪へ傾く人間のあり方・衝動を指します。別訳「自由を肉のための足掛かりとして用いてはいけません」。
    reason: alternative_reading
  - marker: c
    text: 「仕える」と訳した語は「奴隷」と同系の語で、他者のために自分を差し出して仕えるという強い意味を帯びています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: あなたがた
  rationale: 明示された二人称複数代名詞を訳出する。日本語では「あなたがた」により複数の共同体への呼びかけが明確になる。
- source_word: γὰρ
  choice: のです
  rationale: 直前の議論を根拠づける説明的接続を、自然な現代日本語の説明調で示す。単独の「なぜなら」より文脈に滑らかにつながる。
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: 自由へと
  rationale: 召しの目的または到達する状態を表す句として、自由へ召されたという方向性を保つ。
- source_word: ἐκλήθητε
  choice: 召された
  rationale: パウロ書簡における神の召しを示す受動形を保ちつつ、特定の教理体系を付加しない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を形式上保つ。この呼称が女性を含む信仰共同体全体に向けられていることは文脈上理解されるが、必要以上の説明的言い換えは本文に加えない。
- source_word: μόνον
  choice: ただ
  rationale: 自由についての主張に重要な制限を加える働きを、自然な逆接的限定として表す。
- source_word: μὴ...εἰς ἀφορμὴν
  choice: つけ込む機会としてはなりません
  rationale: ἀφορμήの「足掛かり・機会」という意味を保ち、自由が肉の欲望に利用される契機となることへの警告を自然な日本語で表す。
- source_word: σάρξ
  choice: 肉の欲望
  rationale: 単なる身体ではなく、神に逆らう自己中心的な人間の衝動を指す文脈的意味を示す。ただし「罪の性質」と固定せず、肉というパウロ的表現も残す。
- source_word: διὰ τῆς ἀγάπης
  choice: 愛によって
  rationale: διά＋属格の手段的意味を明確にし、ἀγάπηを一貫して「愛」と訳す。
- source_word: δουλεύετε
  choice: 仕えなさい
  rationale: 奴隷として奉仕する語感を背景に持つが、相互的な勧告として自然な日本語を採用する。強い奴隷的含意は脚注で補う。
- source_word: ἀλλήλοις
  choice: 互いに
  rationale: 相互代名詞の意味を簡潔で自然な日本語で表す。
theological_decisions:
- issue: ἀδελφοίが男女を含む共同体への呼称であること
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 文法上の男性複数形を保ちつつ、宛先が信徒共同体全体であるという文脈を否定しない。「兄弟姉妹たち」も意味上は可能だが、本文では原語の形を優先した。
- issue: 倫理的文脈におけるσάρξの意味
  choice: 肉の欲望
  alternative: 肉／罪深い性質
  rationale: ここでの「肉」は身体そのものに限定されず、自己中心的で罪へ傾く衝動を指す。「肉」だけでは現代日本語で身体と誤解されやすいため「欲望」を補うが、「罪深い性質」と実体化して意味を固定することは避けた。
- issue: δουλεύετεの奴隷奉仕の比喩
  choice: 互いに仕えなさい
  alternative: 互いの奴隷となりなさい
  rationale: 自由と奴隷奉仕の逆説は重要だが、「奴隷となる」は日本語では制度的隷属を前面に出しすぎる可能性がある。本文は自然な勧告とし、原語の強い語感を脚注に残した。
translation_notes:
  register: 明瞭で現代的だが、勧告としての品位を保つ文体。「召された」「仕えなさい」により聖書本文としての格調を維持する。自由と奉仕の逆説、および「肉」の神学的緊張を過度に解消しないよう配慮した。
