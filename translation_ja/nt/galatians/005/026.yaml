  text: μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: ja
  text: うぬぼれた者となり、互いに挑発し合い、互いにねたみ合うことのないようにしましょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「うぬぼれた」と訳した語には、空しい栄誉を求めること、また根拠なく自分を重要だと思うこと、という含みがある。
    reason: κενόδοξοι の「空しい栄誉」と根拠のない自己重要感という語義を補足するため。
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: 〜ことのないようにしましょう
  rationale: μήを伴う一人称複数・現在接続法の勧告的な禁止を、共同体への自然な呼びかけとして表す。「なるな」よりも包括的で、γίνομαιの「そのような者になる」という推移の意味も保つ。
- source_word: κενόδοξοι
  choice: うぬぼれた者
  rationale: κενόδοξοςは、実質のない栄誉や根拠のない自己評価を追い求める態度を指す。現代日本語で理解しやすい「うぬぼれた」を採り、語の含意は脚注で補う。
- source_word: ἀλλήλους / ἀλλήλοις
  choice: 互いに
  rationale: 相互代名詞の反復を、それぞれの分詞に付けて自然に再現する。
- source_word: προκαλούμενοι
  choice: 挑み合い
  rationale: προκαλέομαιには、相手を競争や対立へ挑発する意味がある。単なる苛立たせる行為に狭めず、相互的な対抗意識を表す。
- source_word: φθονοῦντες
  choice: ねたみ合う
  rationale: φθονέωの、他者の優位や所有をねたむ意味を平明に表す。前句との相互的な並行も保つ。
theological_decisions:
- issue: 二つの分詞と主たる勧告との関係
  choice: 「うぬぼれた者となり」に続く行動の描写として、「互いに挑み合い、互いにねたみ合う」と並べる。
  alternative: 「互いに挑み合い、ねたみ合うことによって、うぬぼれた者とならない」と手段・原因を明示する。
  rationale: ギリシア語ではκενόδοξοιがγινώμεθαの補語であり、二つの分詞はそれに伴う振る舞いを描くと読むのが自然。ただし厳密な論理関係は明示されていないため、日本語でも接続関係を限定しすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、共同体全体への勧告として穏やかさと品位を保った。「挑み合い」は競争的・対立的な含意を残し、「ねたみ合う」と並行させた。脚注記号[a]は本文中に明示した。
