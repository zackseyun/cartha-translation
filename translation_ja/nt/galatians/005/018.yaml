  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: ja
  text: しかし、霊に導かれているなら[a]、あなたがたは律法の下にはいません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「霊に導かれるなら」。ギリシア語の現在形は、継続的に導かれていることを含意し得ます。
    reason: lexical_alternative
  - marker: b
    text: 「律法の下」とは、律法の権威または管轄の下にあることを指します。5章23節参照。
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: なら
  rationale: 条件節を自然な現代日本語で表す。文脈上、単なる仮定だけでなく、実際にそうである場合を述べる用法も含み得る。
- source_word: δὲ
  choice: しかし
  rationale: 肉と御霊をめぐる直前の議論との穏やかな対照を明示する。
- source_word: πνεύματι
  choice: 御霊に
  rationale: ガラテヤ5章の肉との対比から神の霊を指す。日本語の聖書文体として明確かつ簡潔に表した。
- source_word: ἄγεσθε
  choice: 導かれている
  rationale: 現在受動形の継続的な含みと、御霊が動作主である受動の意味を自然に保持する。
- source_word: οὐκ ἐστὲ
  choice: あなたがたは…いません
  rationale: 二人称複数と否定された状態を明確に表す。
- source_word: ὑπὸ νόμον
  choice: 律法の下には
  rationale: 律法の権威・支配領域の下にあるというパウロの比喩的表現を保ちつつ、モーセ律法を指す文脈を「律法」で示す。
theological_decisions:
- issue: πνεύματι の指示対象
  choice: 神の霊を指す「御霊」
  alternative: 人間の霊を指す「霊」
  rationale: ガラテヤ5:16–25では肉と神の霊との対比が一貫しており、ここでも神の霊が信者を導く主体と読むのが文脈に最も即している。
- issue: ὑπὸ νόμον の意味
  choice: 律法の権威・管轄の下にない
  alternative: 法一般の下にない
  rationale: ガラテヤ書における用法と文脈はモーセ律法を統治的な枠組みとして念頭に置く。ただし本文では説明を加えすぎず、原文の比喩を保持した。
translation_notes:
  register: 明瞭で現代的ながら尊厳のある標準日本語。「御霊」と「律法」は文脈上の神学的指示対象を簡潔に示す語として採用し、原文の条件構文と受動表現を保った。
