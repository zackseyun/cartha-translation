lexical_decisions:
- source_word: μικρὰ
  choice: わずかな
  rationale: 量の少なさを表し、短い格言として自然な日本語になる。
- source_word: ζύμη
  choice: パン種
  rationale: 古代の発酵種を指す語として適切で、聖書における比喩的な響きも保てる。「酵母」よりも対象を狭く限定しない。
- source_word: ὅλον
  choice: 全体
  rationale: 発酵の作用が練られたものの全体に及ぶという総体性を明確に表す。
- source_word: φύραμα
  choice: こねた粉
  rationale: 混ぜてこねた粉の塊を意味する。現代の読者に具体的なパン作りの像が伝わり、「塊」だけの場合より明瞭である。
- source_word: ζυμοῖ
  choice: 発酵させます
  rationale: パン種が生地を発酵させる働きを、現代日本語で直接かつ明瞭に表す。
theological_decisions:
- issue: 格言の比喩的な力
  choice: パン種とこねた粉という具体的な像を保ち、文脈上の適用を本文に補わない。
  alternative: 「わずかな誤った教えが共同体全体に広がります」のように意味を明示する。
  rationale: この節自体は解釈ではなく格言を述べているため、その簡潔な修辞的効果と適用上の含みを保持する。
translation_notes:
  register: 明瞭で現代的ながら、格言らしい簡潔さと品位を保った。「です・ます」調で前後の叙述にもなじみやすくした。
