id: GAL.5.22
reference: Galatians 5:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: ja
  text: しかし、霊の実は、愛、喜び、平和、忍耐、親切、善良、信仰[a]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忠実さ」。このギリシア語は、「信仰」や「信頼」のほか、「忠実さ」を意味することもある。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の「肉の行い」（5:19–21）との対照を、自然な現代日本語で明確に示す。
- source_word: καρπὸς
  choice: 実
  rationale: パウロの比喩を保ち、単数形によって、列挙される徳が霊の働きによる一つの結実として示されていることを伝える。
- source_word: τοῦ πνεύματός
  choice: 霊の
  rationale: 文脈上は神の霊を指すが、原文の簡潔な属格表現を保ち、訳文で説明を加えすぎない。
- source_word: ἀγάπη
  choice: 愛
  rationale: 現代日本語で広く通用し、語の意味を簡潔に表す。
- source_word: χαρά
  choice: 喜び
  rationale: 徳目の列挙にふさわしい、明瞭で自然な対応語。
- source_word: εἰρήνη
  choice: 平和
  rationale: 内面的な安らぎにも対人関係の平和にも限定せず、原語の幅を保つ。
- source_word: μακροθυμία
  choice: 忍耐
  rationale: 怒りを遅くし、長く耐える態度を、一般読者に分かりやすい現代語で表す。
- source_word: χρηστότης
  choice: 親切
  rationale: 人に対する慈しみ深く思いやりのある態度を自然に表す。
- source_word: ἀγαθωσύνη
  choice: 善良
  rationale: 善を志向し行う広い道徳的性質を表し、直前の「親切」とも区別できる。
- source_word: πίστις
  choice: 信仰
  rationale: 語の中心的かつ伝統的な訳語を本文に置く。ただし、この徳目一覧では「真実」「忠実」の意味も十分に可能なため、脚注で保持する。
theological_decisions:
- issue: πνεῦμα の指示対象
  choice: 神の霊（聖霊）
  alternative: 人間の霊
  rationale: 直前から続く「肉」と「霊」の対比、およびガラテヤ書全体の議論から、ここでは信じる者のうちに働く神の霊を指すと判断した。ただし本文は原文どおり簡潔に「霊」とした。
- issue: 徳目一覧における πίστις の意味
  choice: 信仰
  alternative: 真実、忠実
  rationale: πίστις は信仰・信頼・真実さを表し得る。本文では基本的な訳語「信仰」を採用する一方、徳目の文脈で有力な人格的特質としての「真実／忠実」を脚注に示し、意味を一つに固定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。徳目を簡潔な名詞でそろえ、原文の単数「実」と列挙のリズムを保持した。
