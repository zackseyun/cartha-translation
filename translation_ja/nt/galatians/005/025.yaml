  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: ja
  text: もし私たちが御霊によって生きているのなら、私たちはまた、御霊に歩調を合わせて進もう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: もし〜のなら
  rationale: 条件文の形を保ち、文脈から「〜なのだから」と断定的に言い換えることを避けた。
- source_word: ζῶμεν
  choice: 生きている
  rationale: 現在形の継続的な意味を自然な日本語で表し、単なる生物学的生存ではなく、御霊に由来する命という文脈上の意味を保った。
- source_word: πνεύματι
  choice: 御霊によって／御霊に
  rationale: 前半では命の源・働き手を示す「によって」、後半では歩みの基準や同伴を自然に示す「に」とした。同一語の反復は「御霊」を繰り返して保持した。
- source_word: καὶ
  choice: （勧告の対応関係として表現）
  rationale: 日本語では「も」を機械的に置くより、条件節に対応する勧告の並行構造によって「また」の意味を自然に伝えられる。
- source_word: στοιχῶμεν
  choice: 歩調を合わせて進もう
  rationale: 勧告の接続法を「〜よう」で表し、στοιχέωの「列に従う、歩調を合わせる」という具体的な含意を、「歩む」だけより明確に訳した。
theological_decisions:
- issue: πνεύματι の指示対象
  choice: 聖霊を指す「御霊」
  alternative: 人間の霊
  rationale: ガラテヤ5章における肉と御霊の対比、および直前の文脈から、ここでは聖霊を指す可能性がきわめて高い。「御霊」は本文にない説明語を加えずに、この文脈上の指示対象を示す。
- issue: εἰ の論理的な力
  choice: 条件形「もし〜のなら」
  alternative: 理由・前提を表す「〜なのだから」
  rationale: 文脈上は共有された現実を前提とする可能性があるが、ギリシア語の条件構文を保持し、確定的な理由節へ解消しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある勧告文。「歩調を合わせて進もう」は現代の読者に理解しやすく、στοιχέω固有の整列・同調の比喩も保つ。「御霊」は聖書文体として定着している一方、過度に古風ではない。
