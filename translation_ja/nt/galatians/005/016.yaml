id: GAL.5.16
reference: Galatians 5:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: ja
  text: しかし、私は言います。聖霊によって歩みなさい。そうすれば、肉[a]の欲望を決して行いに移すことはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉」は、ここでは聖霊に逆らう、罪に傾いた人間のあり方を指します。「罪深い性質」とも訳せます。
    reason: パウロのσάρξという語を本文に残しつつ、この文脈での比喩的・道徳的意味と別訳を示すため。
lexical_decisions:
- source_word: Λέγω δέ
  choice: しかし、私は言います
  rationale: δέによる穏やかな対照と話の転換を示しつつ、直前の勧めとのつながりを保った。
- source_word: πνεύματι
  choice: 御霊によって
  rationale: 与格を手段・領域の意味に取り、文脈上の指示対象である聖霊を明確にした。
- source_word: περιπατεῖτε
  choice: 歩みなさい
  rationale: 生き方を表すパウロの比喩を保持し、現代日本語でも理解できる表現とした。
- source_word: ἐπιθυμίαν
  choice: 欲望
  rationale: ここでは「肉」に規定された否定的な願望を指すため、「願い」より文脈に適し、「情欲」ほど意味を限定しない語を選んだ。
- source_word: σαρκὸς
  choice: 肉
  rationale: パウロ固有の用語と御霊との対立を保持し、「罪深い性質」という解釈に本文で固定しないようにした。
- source_word: οὐ μὴ τελέσητε
  choice: 決して実行することはありません
  rationale: οὐ μήの強い否定を「決して」で示し、τελέωを欲望を行動に移す意味で自然に表した。
theological_decisions:
- issue: πνεύματιの指示対象
  choice: 聖霊（「御霊」）
  alternative: 人間の霊、または一般的な霊的原理
  rationale: ガラテヤ5章の直近の文脈では、肉と対立し信者の歩みを導く主体は聖霊であると読むのが最も自然である。
- issue: σάρξの訳し方
  choice: 肉
  alternative: 罪深い性質
  rationale: 道徳的に否定的な意味は文脈にあるが、パウロの表現と神学的緊張を保ち、特定の解釈に狭めないため直訳を本文に置いた。
- issue: 命令と結果の関係
  choice: 「歩みなさい。そうすれば……ありません」
  alternative: 「歩みなさい。そして……してはなりません」
  rationale: οὐ μὴ＋アオリスト接続法は強い否定であり、第二の命令ではなく、御霊によって歩むことに伴う確かな結果として訳した。
translation_notes:
  register: 明瞭で現代的かつ品位ある勧告調。聖書的な「歩む」「肉」「御霊」は重要な比喩・用語として保持し、脚注で「肉」の意味を補った。
