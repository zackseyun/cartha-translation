source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: ja
  text: 自由のために、メシアは私たちを自由にしてくださいました[a]。ですから、しっかり立って、再び奴隷状態のくびきの下に身を置いてはなりません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自由のうちに、メシアは私たちを自由にしてくださいました」。文頭の与格句は簡潔に圧縮されており、互いに近い複数の意味に理解できます。
    reason: alternative_reading
  - marker: b
    text: 「再び奴隷状態のくびきに捕らわれてはなりません」とも訳せます。この動詞には、何かの支配下に置かれる、またはそれに巻き込まれるという意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: 自由のために
  rationale: 文頭の与格を目的・結果を表す句として訳し、パウロの簡潔で力強い表現を保った。別解の「自由のうちに」も注記した。
- source_word: Χριστὸς
  choice: メシア
  rationale: 固有名のように音写せず、「油注がれた者」という称号としての意味とユダヤ的背景を伝える。
- source_word: ἠλευθέρωσεν
  choice: 自由にしてくださいました
  rationale: ἐλευθερίαとの語根の反復を「自由／自由にする」で再現しつつ、現代日本語として自然にした。
- source_word: στήκετε
  choice: しっかり立ち
  rationale: 継続的な堅忍を命じる現在命令形の力を、自然で簡潔な勧告として表した。
- source_word: οὖν
  choice: ですから
  rationale: 前の宣言から導かれる結論であることを明示し、現代日本語の自然な論理接続とした。
- source_word: ζυγῷ δουλείας
  choice: 奴隷のくびき
  rationale: ζυγόςの比喩を「くびき」で保持し、δουλείαの強い隷属の意味を「奴隷」で表した。
- source_word: ἐνέχεσθε
  choice: つながれてはなりません
  rationale: 何かに拘束され、その支配下に置かれる意味を、くびきの比喩と自然に結び付く表現で訳した。巻き込まれる・捕らわれるという含みは注記した。
- source_word: πάλιν
  choice: 再び
  rationale: 以前の隷属状態へ戻ることを示す副詞を直接的に訳した。
theological_decisions:
- issue: Χριστόςを称号として訳すか、教会用語として音写するか
  choice: メシア
  alternative: キリスト
  rationale: この語が担う称号としての意味を訳出し、特定の教派的解釈を加えずにユダヤ的なメシア文脈を保った。
- issue: δουλείαの強さをどう表すか
  choice: 奴隷
  alternative: 束縛
  rationale: 自由との鋭い対照と、所有・支配下に置かれる強い意味を保持するため、「束縛」より具体的な「奴隷」を選んだ。
- issue: 文頭の与格τῇ ἐλευθερίᾳの解釈
  choice: 目的または結果を示す「自由のために」
  alternative: 状態・領域を示す「自由のうちに」
  rationale: 圧縮されたギリシャ語は複数の近接した理解を許すため、本文では修辞的強調に適した読みを採り、別解を脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、勧告にふさわしい威厳を保った。「くびき」は一般語としてやや文語的だが、原文の中心的比喩を保持するため採用した。敬体で統一し、「しっかり立ち」により過度に古風な表現を避けた。
