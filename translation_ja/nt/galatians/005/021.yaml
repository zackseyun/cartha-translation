  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: ja
  text: ねたみ、泥酔、酒宴[a]、その他これらに類することです。これらについて、以前にも警告したように、私はあなたがたにあらかじめ警告します。このようなことを行う者は、神の国を受け継ぐことはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「酒宴」は、飲酒を伴うことの多い、騒々しく節度を失った宴や遊興を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: ねたみ
  rationale: 他人の幸福や優位を快く思わない心を表す複数名詞。現代日本語の悪徳表として自然で明確な「ねたみ」とした。
- source_word: μέθαι
  choice: 泥酔
  rationale: 酩酊や酒に酔った状態・行為を指す複数名詞。「泥酔」は単なる飲酒ではなく、非難されている酩酊の意味を簡潔に伝える。
- source_word: κῶμοι
  choice: 酒宴[a]
  rationale: 飲酒を伴うことの多い、騒々しく節度を欠いた宴や遊興を指す。「酒宴」は文脈に合い、現代日本語として簡潔だが、語義が単なる宴会より強いことを脚注で補った。
- source_word: τὰ ὅμοια τούτοις
  choice: そのほかこれらに類すること
  rationale: 列挙された悪徳に限定せず、同類の行為へ範囲を広げる開放的な表現を保った。
- source_word: ἃ προλέγω ὑμῖν καθὼς προεῖπον
  choice: 私は以前にも警告したように、今もあなたがたに警告します
  rationale: προλέγω の「前もって言う」と文脈上の「警告する」の両面のうち、勧告的な力を自然な日本語で示した。現在の警告と過去の警告の対照も明示した。
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: このようなことを常習的に行う者
  rationale: 現在分詞が示す特徴的・継続的な実践を「常習的に」で表し、単発の行為と断定的に同一視することを避けた。
- source_word: βασιλείαν θεοῦ οὐ κληρονομήσουσιν
  choice: 神の国を受け継ぐことがありません
  rationale: 相続を表す動詞と終末的な未来の警告を保ちつつ、明瞭で格調ある日本語にした。
theological_decisions:
- issue: 警告の対象が単発の行為か、生活を特徴づける継続的実践か
  choice: 「このようなことを常習的に行う者」と訳す
  alternative: 「このようなことを行う者」
  rationale: 現在分詞 πράσσοντες はこの悪徳を特徴的に実践する者を自然に示す。「常習的に」は継続性を伝えるが、救済論上の仕組みや個々の失敗について本文以上の結論は加えない。
- issue: 「神の国を受け継がない」という警告の性質
  choice: 未来の否定的宣言としてそのまま保持する
  alternative: 「神の国にあずかれない」
  rationale: κληρονομέω の相続比喩と警告の強さを保持し、教派的な条件説明を本文に付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、悪徳表と終末的警告には簡潔で厳粛な調子を保った。「今も」を補って、現在の προλέγω と過去の προεῖπον の関係を日本語で明確にした。
