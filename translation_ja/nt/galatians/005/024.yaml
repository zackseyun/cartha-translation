  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: ja
  text: 一方、メシアに属する人たちは、肉をその情念と欲望とともに十字架につけました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストに属する人たち」。
    reason: alternative_reading
  - marker: b
    text: ここで「肉」とは、御霊に対立する人間の性向を指す比喩的表現である。「罪深い性質」と訳すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: しかし、メシアに属する人たちは
  rationale: 属格を伴う冠詞付き表現は、メシアに帰属する人々を指す。δὲは直前との穏やかな対照を示すため「しかし」とした。Χριστόςはここでは称号として「メシア」と訳した。
- source_word: τὴν σάρκα
  choice: 肉を
  rationale: 御霊に逆らう人間の性向を指す比喩的用法だが、パウロ特有の語彙と神学的緊張を保つため「罪深い性質」と説明的に置き換えず、「肉」とした。
- source_word: ἐσταύρωσαν
  choice: 十字架につけたのです
  rationale: 十字架を明示する動詞の比喩を弱めず、アオリストが表す決定的な行為を自然な日本語の過去形で示した。
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: その情欲や欲望とともに
  rationale: σύνの随伴関係を「とともに」で表した。παθήματαはこの倫理的文脈では肉に伴う衝動的な情念を指すため「情欲」、ἐπιθυμίαιはより広く強い欲求を指すため「欲望」とした。接続詞καίは自然な列挙として「や」で表現した。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: イエスの油注がれた者としての称号性を明示するため「メシア」としたが、文脈によっては固有名に近い「キリスト」も可能である。
- issue: 倫理的対照におけるσάρξ
  choice: 肉
  alternative: 罪深い性質
  rationale: ここでは御霊に対立する堕落した人間性を指すが、解釈を本文に織り込まず、パウロの比喩と意味の広がりを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。δὲの対照を「しかし」で示し、文末の「のです」により前節との論理的なつながりを自然にした。
