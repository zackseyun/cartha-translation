- from: しかし、兄弟たち[a]、もし私が今なお割礼を宣べ伝えているのなら、なぜ今なお迫害されているのでしょうか。そうであれば、十字架がつまずきとなること[b]は取り除かれているはずです。
  to: しかし、兄弟たち[a]、もし私が今なお割礼を宣べ伝えているのなら、なぜ今なお迫害されているのでしょうか。それなら、十字架のつまずき[b]は、なくなっていることになります。
  rationale: 本文後半を、原文の名詞句「十字架のつまずき」として訳し直した。「なくなっていることになります」は、完了受動形が示す結果状態と、ἄραが導く反語的な帰結を表す。前半と脚注aは変更不要である。
