id: GAL.5.11
reference: Galatians 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: ja
  text: しかし、兄弟たち[a]、もし私が今なお割礼を宣べ伝えているのなら、なぜ今なお迫害されているのでしょうか。それなら、十字架のつまずき[b]は、なくなっていることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語の「兄弟たち」は、男女を含む一団への呼びかけにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「十字架が引き起こす反感」「十字架という障害」。原語は、人をつまずかせ、拒絶を招くものを表す。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを直接的に訳した。文脈上、男女を含む共同体全体への呼びかけとなり得ることは脚注で示す。
- source_word: περιτομήν
  choice: 割礼
  rationale: ユダヤ教的な契約のしるしである行為と、その要求を指す標準的な訳語。
- source_word: ἔτι
  choice: 今なお
  rationale: 二度の用例を同じ表現で訳し、パウロの宣教内容と現在の迫害をめぐる時間的・論理的な対照を保った。
- source_word: κηρύσσω
  choice: 宣べ伝えている
  rationale: 公に告げ知らせる継続的な行為を表す現在形に対応し、書簡の文体にもふさわしい自然な表現とした。
- source_word: διώκομαι
  choice: 迫害されている
  rationale: 現在受動形を明示し、敵対者から宗教的な迫害を受けている意味を保った。
- source_word: ἄρα
  choice: そうであれば
  rationale: 先行する仮定から導かれる帰結を、自然な現代日本語で明確に示す。
- source_word: κατήργηται
  choice: 取り除かれているはずです
  rationale: 完了受動形の結果状態を表しつつ、反実的含意を持つ論理的帰結として日本語に自然にした。「はずです」は語そのものではなく文全体の推論関係を表す。
- source_word: σκάνδαλον
  choice: つまずきとなること
  rationale: 拒絶や離反を引き起こすものという比喩を保つ。「不快感」だけに限定せず、原語の神学的緊張を残した。
- source_word: σταυροῦ
  choice: 十字架
  rationale: パウロ書簡における標準的で簡潔な訳語を用いた。
theological_decisions:
- issue: 混合された聴衆への呼びかけとしてのἀδελφοί
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原語の男性複数形を本文に反映しつつ、女性を含む共同体全体を指し得る語用について脚注で補った。
- issue: σκάνδαλον τοῦ σταυροῦの意味
  choice: 十字架がつまずきとなること
  alternative: 十字架が人の反感を買うこと
  rationale: 十字架が拒絶や離反を引き起こすという原語の比喩を保持し、単なる感情的な不快さへ狭めないようにした。
- issue: 条件文とἄραによる帰結
  choice: 取り除かれているはずです
  alternative: 取り除かれたことになります
  rationale: パウロが割礼を宣べ伝えているという仮定から生じる、現実と食い違う帰結を明瞭にした。ただし、十字架そのものが無効になるという意味にはしなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの鋭い反語的な問いと推論を保持した。「宣べ伝える」「十字架」「割礼」は聖書文体として定着した語であり、一般読者にも理解可能な荘重さを保つ。
