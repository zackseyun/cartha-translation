  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: ja
  text: しかし、互いにかみつき、食い尽くし合っているなら、互いに滅ぼされてしまわないよう、気をつけなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、…なら
  rationale: 条件を表す εἰ と、直前の勧めとの対照・展開を示す δέ を、自然な現代日本語で表した。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 共同体内部で行為が相互に及ぶことを明確に示す。
- source_word: δάκνετε
  choice: かみつき
  rationale: 動物的な攻撃を表す比喩を弱めず、原語の字義的な像を保った。
- source_word: κατεσθίετε
  choice: 食い尽くしている
  rationale: 単に食べる以上の激しさを持つ語であり、「食い尽くす」によって継続的・特徴的な相互攻撃と捕食の比喩を自然に表した。
- source_word: βλέπετε
  choice: 気をつけなさい
  rationale: 警戒を命じる現在命令形を、明瞭で切迫感のある現代日本語にした。
- source_word: μὴ
  choice: …ないよう
  rationale: 後続する接続法とともに、起こり得る否定的結果への警告を自然な日本語で表した。
- source_word: ὑπ’ ἀλλήλων
  choice: 互いに
  rationale: 受動文の行為者が共同体の構成員同士であるという相互性を保持した。
- source_word: ἀναλωθῆτε
  choice: 滅ぼされない
  rationale: 「使い尽くされる／消耗させられる」から「滅ぼされる」に至る意味範囲のうち、ここでは共同体の破滅という警告を明確にしつつ、直前の「食い尽くす」と同じ日本語を重ねて二つのギリシア語の区別を消すことを避けた。
theological_decisions:
- issue: キリスト者共同体内の比喩的暴力
  choice: 「かみつき」「食い尽くす」という動物的・捕食的な比喩を保持する。
  alternative: 「傷つけ合い、滅ぼし合う」など一般的な争いの表現に和らげる。
  rationale: パウロの意図的に鮮烈な修辞と、共同体が自らを破滅させる危険への切迫した警告を保つため。
translation_notes:
  register: 明瞭な現代標準日本語。共同体への厳粛な警告にふさわしい品位を保ちつつ、原文の生々しい捕食の比喩を自然な表現で再現した。
