base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: ja
  text: 律法によって義と認められようとしているあなたがたは、キリストから切り離されたのです[a]。あなたがたは恵みから落ちたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストから離された」「キリストとの関係を失った」。原文の動詞は、この文脈ではキリストからの分離を表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε ἀπὸ Χριστοῦ
  choice: キリストから切り離され
  rationale: καταργέωの受動態とἀπόが、この文脈ではキリストとの関係からの分離を鋭く表す。「無効にされた」より文脈に合い、「疎遠になった」より原文の強さを保つ。
- source_word: οἵτινες
  choice: あなたがたは
  rationale: ガラテヤの読者のうち、律法による義認を求める者たちを直接指す働きを、後続する修飾節とともに自然な日本語で示す。
- source_word: ἐν νόμῳ
  choice: 律法によって
  rationale: ἐνを手段・根拠として捉え、パウロの議論に即して「律法によって」とした。無冠詞だが、日本語ではこの文脈のνόμοςを「律法」とするのが明確で自然。
- source_word: δικαιοῦσθε
  choice: 義と認められようとしている
  rationale: 形態上は現在受動で「義と認められている」とも訳せるが、文脈では律法を根拠に義認を得ようとする企てを指す。受動の義認概念を保ちつつ、その文脈的な志向を示した。
- source_word: τῆς χάριτος ἐξεπέσατε
  choice: 恵みから落ちてしまった
  rationale: ἐκπίπτωと属格が表す「〜から落ちる」という比喩を保持する。「離れた」より原文の厳しい警告を伝え、完了的な結果も「てしまった」で自然に示す。
theological_decisions:
- issue: この警告が救いの喪失を断定するのか、それとも恵みという原理からの逸脱を述べるのか
  choice: 「キリストから切り離され、恵みから落ちてしまった」と直接的な警告を保持する。
  alternative: 「キリストと疎遠になり、恵みの道を捨てた」のように弱めたり解釈的に言い換えたりする。
  rationale: 原文の関係的・比喩的な強さをそのまま示しつつ、それが体系神学上どのような最終状態を意味するかは翻訳で決着させない。
- issue: δικαιοῦσθεを実現した義認として訳すか、義認を求める企てとして訳すか
  choice: 「義と認められようとしている」
  alternative: 「義と認められている」または「義とされる」
  rationale: 現在受動の形式的な可能性を注で示しながら、直前から続く割礼と律法遵守によって義を得ようとする者への論難という文脈を本文に反映する。
translation_notes:
  register: 明瞭で現代的ながら、警告の厳粛さを保つ文体。「メシア」ではなく、日本語で定着した称号「キリスト」を用いた。
