id: GAL.5.14
reference: Galatians 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: ja
  text: 律法全体は、次の一つの言葉において成就しているからです。「あなたの隣人を自分自身のように愛しなさい。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一つの言明」または「一つの戒め」とも訳せる。ギリシア語は直訳すると「一つの言葉において」で、ここでは一つの語ではなく、一つの言明や戒めを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「成就した」または「満たされている」とも訳せる。解釈的には「要約されている」という意味を含み得るが、ギリシア語の動詞はより直接には「成就する」「満たす」を意味し、この戒めにおいて律法の意図が完成に至ることを示し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: からです
  rationale: γάρは直前の勧告の根拠を示す。日本語では文末の「からです」が自然に説明関係を表す。
- source_word: πᾶς νόμος
  choice: 律法全体
  rationale: 定冠詞付き単数のνόμοςとπᾶςの包括性を保ち、律法を一つの全体として示す。
- source_word: ἐν ἑνὶ λόγῳ
  choice: 一つのことばのうちに
  rationale: λόγοςはここで単一の語彙ではなく、引用される一つの言明・戒めを指す。「ことば」は引用とのつながりを保ちつつ、注で意味範囲を明示できる。
- source_word: πεπλήρωται
  choice: 成就している
  rationale: 完了受動形が表す、成就した結果として現在成立している状態を保つ。「要約されている」と解釈的に弱めない。
- source_word: ἐν τῷ
  choice: 次の…のうちに
  rationale: 成就がどの言明において成り立つかを導入する構文として、後続の引用へ自然につなげる。
- source_word: Ἀγαπήσεις
  choice: 愛しなさい
  rationale: 未来直説法だが、レビ記19章18節の戒めの引用として命令の力を持つ。現代日本語で明瞭な命令形にする。
- source_word: τὸν πλησίον σου
  choice: あなたの隣人
  rationale: 倫理的文脈とレビ記の引用における確立した意味を保つ。
- source_word: ὡς σεαυτόν
  choice: 自分自身のように
  rationale: 比較を明確に表し、再帰代名詞の強意も自然な日本語で保持する。
theological_decisions:
- issue: 律法と隣人愛の戒めとの関係
  choice: 律法全体は隣人愛の戒めのうちに成就している
  alternative: 律法全体はこの戒めに要約されている
  rationale: πληρόωは単なる要約よりも成就・完成を直接表す。律法の廃止などの教理的結論は付加せず、「律法」も原文どおり限定しない。
- issue: 完了受動形の時間的・結果的含意
  choice: 成就している
  alternative: 成就した／満たされている
  rationale: πεπλήρωταιの完了形が示す、完了した行為の現在的な結果状態を日本語で表す一方、誰が成就させるかは原文同様に明示しない。
translation_notes:
  register: 明瞭で現代的ながら聖書引用にふさわしい格調を保った。「成就」はやや文語的だが、πληρόωの神学的・意味的な強さを保つため採用した。引用文は普通の読者に分かりやすい「愛しなさい」とした。
