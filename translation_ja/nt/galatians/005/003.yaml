id: GAL.5.3
reference: Galatians 5:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: ja
  text: 割礼を受ける[a]すべての人に、私は改めて証言します。その人は律法全体を守る義務を負っています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「割礼を施される」または「自ら割礼を受ける」とも訳せる。ギリシア語の分詞は、割礼を受けることに身を委ねる意味を含み得る。
    reason: alternative_reading
  - marker: b
    text: 直訳すると「律法全体を行う債務者です」。ここでの「債務者」は、律法全体を行う義務の下にある人を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: 証言します
  rationale: 個人的かつ厳粛に言明する語の力を保ちつつ、現代日本語として明瞭にした。「警告します」では文脈上の含意を本文に取り込みすぎる。
- source_word: δὲ πάλιν
  choice: 改めて
  rationale: δέの緩やかな接続とπάλινの反復・再強調を、日本語で不自然な接続詞を加えずに表した。
- source_word: παντὶ ἀνθρώπῳ
  choice: すべての人に
  rationale: 単数による一人一人への適用を保ち、ἀνθρώπῳの包括的な意味を自然な現代日本語で表した。
- source_word: περιτεμνομένῳ
  choice: 割礼を受ける
  rationale: この論争の中で割礼を受けようとする人を指す文脈に合い、受動・中動的な幅を過度に限定しない。
- source_word: ὀφειλέτης ἐστὶν
  choice: 義務を負っています
  rationale: 字義上の「債務者である」が示す拘束的な義務を、金銭的負債との誤解を避けながら明確に伝える。
- source_word: ὅλον τὸν νόμον
  choice: 律法全体
  rationale: 律法の一部分ではなく、その全体に対する義務であるという強調を保持した。
- source_word: ποιῆσαι
  choice: 守る
  rationale: νόμοςを目的語とする文脈では「律法を守る」が自然であり、要求される実践・遵守を明確に表す。
theological_decisions:
- issue: 割礼と律法全体への義務の関係
  choice: ガラテヤで問題となっている割礼を受ける人は、律法全体を守る義務を負うと訳す。
  alternative: 生まれた時に割礼を受けたユダヤ人を含め、割礼を受けている男性一般への言及と読む。
  rationale: 現在分詞περιτεμνομένῳは直前の5章2節と論争の文脈では、宗教的要件として割礼を受けようとする者を念頭に置くと考えられる。ただし、その動機を本文に明示的に付け加えず、分詞の近接した訳の幅を注で示した。
- issue: ὀφειλέτηςの比喩的・法的含意
  choice: 本文では「義務を負っています」として、律法全体への拘束を表す。
  alternative: 「律法全体を行う債務者です」と字義的に訳す。
  rationale: 「債務者」は現代日本語では金銭債務を強く連想させるため、ここでの義務という意味を本文で明示し、字義は注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「証言します」で厳粛な言明の調子を残し、「義務を負っています」で法的・拘束的な意味を自然に表した。
