id: GAL.5.6
reference: Galatians 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: ja
  text: というのも、メシアであるイエスにあっては[a]、割礼を受けていることも受けていないことも何の効力もなく、愛を通して働く[c]信仰[b]こそが効力を持つからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエスにあっては」。ギリシア語の「キリスト」は称号であり、「メシア」を意味します。
    reason: alternative_reading
  - marker: b
    text: 「信仰」は、文脈によって「信頼」または「忠実さ」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 別訳「愛を通して活動している」「愛を通して現れる」「愛によって効力を持つ」。ギリシア語の形は中動態にも受動態にも解することができます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ Χριστῷ Ἰησοῦ
  choice: というのも、メシアであるイエスにあっては
  rationale: γάρは前の論述の根拠を示すため「というのも」とした。ἐνはパウロに特徴的なキリストとの結びつきを保つ「にあって」とし、Χριστόςは称号としての意味が伝わる「メシアである」とした。
- source_word: οὔτε περιτομή ... οὔτε ἀκροβυστία
  choice: 割礼を受けていることも、受けていないことも
  rationale: 対を成す身分・状態の対比を、現代日本語で明瞭に表した。「無割礼」よりも一般読者に理解しやすい表現を選んだ。
- source_word: τι ἰσχύει
  choice: 何の効力もなく
  rationale: ἰσχύειはここで単なる物理的な強さではなく、意義や効力を持つことを表す。直後の対照を自然に示せる「効力」を用いた。
- source_word: ἀλλὰ πίστις
  choice: 効力を持つのは……信仰
  rationale: ギリシア語では対照節の動詞が省略されているため、先行するἰσχύειを補って日本語として明瞭にした。πίστιςは基本訳「信仰」とした。
- source_word: δι’ ἀγάπης
  choice: 愛を通して
  rationale: 属格を伴うδιάの手段・媒介の意味を保ち、信仰と愛の関係を過度に限定しない表現とした。
- source_word: ἐνεργουμένη
  choice: 働く
  rationale: 現在中動・受動分詞の、活動し効力を現すという動的な意味を簡潔に保った。中動・受動の解釈を一方に固定しすぎないよう、別訳を注記した。
theological_decisions:
- issue: Χριστόςを称号として訳すか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςが持つ「油注がれた者」という称号性を読者に伝えつつ、日本語として自然な形にした。慣用的な「キリスト・イエス」も注に残した。
- issue: πίστιςの意味範囲
  choice: 信仰
  alternative: 信頼／真実
  rationale: 本文では一般的で文脈にも適する「信仰」を採用したが、語が持ち得る信頼や真実・忠実さの含みを排除せず、注に示した。
- issue: ἐνεργουμένηの態と意味
  choice: 働く
  alternative: 活動している／現れる／効力を持つ
  rationale: 中動態的にも受動態的にも理解し得る形を、本文で教理的に一方へ確定しないよう簡潔に訳し、可能なニュアンスを注で保存した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。パウロの論理を示すためγάρを「というのも……だからです」と受け、原文で省略された対照節の動詞を「効力を持つのは」と補った。専門的な「無割礼」は避けたが、割礼の有無という並行関係は保持した。
