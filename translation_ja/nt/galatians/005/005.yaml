  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: ja
  text: 私たちは、御霊によって[a]、信仰に基づいて、義の希望を[b]切に待ち望んでいるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御霊にあって」とも訳せる。ギリシア語の与格は、手段と領域のどちらをも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「義の希望」。これは「待ち望まれる義」を指すとも、「義に伴う希望」または「義が生み出す希望」を指すとも理解し得る。また、「義」は「正義」とも訳し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 明示された一人称複数代名詞を訳出する。直前の「律法によって義と認められようとする人々」との対比も自然に示す。
- source_word: γὰρ
  choice: からです
  rationale: 前節の主張を根拠づける説明接続詞。日本語では文末表現にして論理の流れを自然に保つ。
- source_word: πνεύματι
  choice: 御霊によって
  rationale: 与格は手段または領域を表し得るが、文脈上は聖霊を指す可能性が高い。本文では手段の意味を採り、領域の可能性は脚注に残す。
- source_word: ἐκ πίστεως
  choice: 信仰に基づき
  rationale: ἐκの起点・根拠の意味を保ちつつ、「信仰から」より自然な現代日本語とする。
- source_word: ἐλπίδα δικαιοσύνης
  choice: 義という望みが実現するのを
  rationale: 直訳的な「義の望み」が日本語では意味を取りにくいため、義が待望の内容である可能性を自然に表す。同時に属格句の解釈上の幅を脚注で示す。
- source_word: ἀπεκδεχόμεθα
  choice: 切に待ち望んでいる
  rationale: 強い期待をもって待つという動詞の含意を、自然で格調ある日本語で表す。
theological_decisions:
- issue: πνεύματι の指示対象と与格の機能
  choice: 聖霊を指し、手段として「御霊によって」
  alternative: 人間の霊／「御霊のうちに」という領域的理解
  rationale: ガラテヤ書5章における律法・肉との対比から聖霊が最も自然である。ただし与格には領域的理解も可能なため脚注で保持する。
- issue: ἐλπίδα δικαιοσύνης の属格関係
  choice: 義を待望の内容と捉え、「義という望みが実現するのを」
  alternative: 「義に伴う望み」または「義が生み出す望み」
  rationale: 終末的に実現する義を待ち望む意味が文脈上有力だが、ギリシア語の属格は関係を明示しないため、別解を脚注に残す。
- issue: δικαιοσύνη の訳語
  choice: 義
  alternative: 正義
  rationale: パウロの義認論的文脈では「義」が標準的であり、神との正しい関係を含む語として適切である。「正義」の意味合いも語彙上可能なので脚注で示す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロの議論にふさわしい簡潔で格調ある文体とした。「御霊」は聖霊を示す聖書語として一般読者にも通じる表記。「切に待ち望む」でἀπεκδέχομαιの強い期待を表現した。
