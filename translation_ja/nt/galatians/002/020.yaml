id: GAL.2.20
reference: Galatians 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: ja
  text: もはや生きているのは私ではなく、キリストが私のうちに生きておられます。今この肉体にあって送っている生を、私は、私を愛し、私のためにご自身を引き渡してくださった神の御子を信じる信仰によって生きています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、「神の御子の忠実さによって生きています」。
    reason: 「神の御子を信じる信仰」とも「神の御子の忠実さ」とも取り得るギリシア語の属格構文の曖昧さを示すため。
lexical_decisions:
- source_word: Χριστός
  choice: キリスト
  rationale: 日本語で定着した称号として訳し、固有名だけに狭めず、原語との直接的な対応も保った。
- source_word: ὃ δὲ νῦν ζῶ
  choice: 今、この肉体で生きている命
  rationale: ギリシア語の中性関係代名詞による省略的表現を、日本語で自然に理解できるよう「命」を補った。
- source_word: σάρξ
  choice: 肉体
  rationale: ここでは罪深い性質と断定せず、現在の身体を伴う地上の生を指す文脈なので、現代日本語で明瞭な「肉体」とした。
- source_word: πίστις
  choice: 信仰
  rationale: 基本的な語義を本文に採用した。ただし、後続する属格との関係には議論があるため、別解を脚注に残した。
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: 神の御子を信じる信仰によって
  rationale: 属格を目的語的に解する読みを、自然で分かりやすい日本語にした。御子の真実・忠実を指す主語的属格の可能性は脚注に示した。
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: 私のためにご自分を引き渡してくださった
  rationale: παραδίδωμι の「引き渡す」という意味と、自発的な自己犠牲の含意を保ちつつ、自然で敬意ある日本語にした。
theological_decisions:
- issue: τῇ τοῦ υἱοῦ τοῦ θεοῦ における πίστις と属格の関係
  choice: 神の御子を信じる信仰によって
  alternative: 神の御子の真実によって
  rationale: 目的語的属格と主語的属格の双方が文法上可能である。本文では一般読者に最も直接的な目的語的解釈を採り、御子ご自身の真実・忠実を表す可能性を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの対照構造と荘重さを保った。「生きておられます」「くださった」により、キリストへの自然な敬意を表した。
