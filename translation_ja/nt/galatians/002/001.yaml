lexical_decisions:
- source_word: Ἔπειτα
  choice: それから
  rationale: パウロの回想の時間的な続きと出来事の順序を、自然な現代日本語で示す。
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: 十四年たって
  rationale: 属格を伴うδιάが表す経過期間を、日本語として自然に表現する。十四年の起算点は本文だけでは明示されないため、補わない。
- source_word: πάλιν
  choice: 再び
  rationale: エルサレムへの訪問が繰り返されたことを簡潔に保持する。
- source_word: ἀνέβην
  choice: 上りました
  rationale: エルサレムへ向かう移動に用いられる原文の『上る』という表現を保持しつつ、自然な敬体にする。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムに
  rationale: 目的地を示すεἰςを、現代日本語の自然な目的地表現で訳す。
- source_word: μετὰ Βαρναβᾶ
  choice: バルナバと一緒で
  rationale: バルナバが同行したことを明確かつ平易に示す。
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: テトスも連れて行きました
  rationale: 主動詞に伴う分詞の付随動作と、καίの付加的な意味を、読みやすい独立節で表す。
