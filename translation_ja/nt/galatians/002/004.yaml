reference: Galatians 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: ja
  text: しかし、ひそかに入り込ませられた偽兄弟たち[a]のために——すなわち、私たちがメシア・イエス[b]にあって持っている自由を偵察し、私たちを奴隷にしようとして忍び込んできた者たちのために——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「偽兄弟たち」は、パウロの家族的な呼び方を保った表現。信者仲間を装っていた人々を指す。
    reason: cultural_note
  - marker: b
    text: 「キリスト・イエス」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: ひそかに連れ込まれた
  rationale: 外部から人知れず入り込ませられたという受動的・隠密的な含みを保ち、後続のπαρεισῆλθονと訳し分けた。
- source_word: ψευδαδέλφους
  choice: 偽兄弟たち
  rationale: パウロの家族的な呼称と強い批判的語調を保つ。信者仲間を装う人々を指すが、本文では説明的に言い換えない。
- source_word: παρεισῆλθον
  choice: 忍び込んできた
  rationale: 人目を避けて共同体に入り込んだという動作を、現代日本語で自然に表した。
- source_word: κατασκοπῆσαι
  choice: 探り出し
  rationale: 単なる観察ではなく、敵対的に内情を偵察する含みを保つ。
- source_word: ἐλευθερίαν
  choice: 自由
  rationale: 語の一般的意味と、文脈における神学的・社会的な力を簡潔に保つ。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστόςの称号性を「メシア」で示し、ἐνの結合・領域を表す定着した表現「にあって」を用いた。
- source_word: καταδουλώσουσιν
  choice: 奴隷にしようとして
  rationale: 人を奴隷状態へ従属させるという強い意味を明示し、ἵναの目的も自然な日本語で表した。
theological_decisions:
- issue: Χριστῷを称号として訳すか、慣用的な名称として訳すか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: この箇所でも「油注がれた者」という称号の意味が聞き取れるため「メシア」とした。ただし、日本語で定着した「キリスト」も可能なので脚注に示した。
- issue: 「偽兄弟たち」の共同体内での身分
  choice: 信者仲間を装う人々であることを脚注で説明し、本文では「偽兄弟たち」とする
  alternative: 偽信者たち
  rationale: 本文だけから彼らの最終的な信仰上の身分を断定せず、ἀδελφοίの家族的比喩とパウロの論争的な表現を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文が前後の節にまたがる未完の構文であることを、文末のダッシュと挿入部で保った。「ひそかに連れ込まれた」と「忍び込んできた」を訳し分け、原文の反復と差異を反映した。
