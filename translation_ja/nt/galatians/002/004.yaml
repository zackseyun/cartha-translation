revisions:
- from: しかし、ひそかに連れ込まれた偽兄弟たち[a]のために——彼らは、私たちがメシア・イエス[b]にあって持つ自由を探り出し、私たちを奴隷にしようとして忍び込んできたのですが——
  to: しかし、ひそかに入り込ませられた偽兄弟たち[a]のために——すなわち、私たちがメシア・イエス[b]にあって持っている自由を偵察し、私たちを奴隷にしようとして忍び込んできた者たちのために——
  rationale: 原文の διὰ δὲ… による前節から続く理由句と、次節へ続く未完結の構文を、両側のダッシュで保った。「すなわち」を用いて、偽兄弟たちを説明する関係節であることを明瞭にした。παρεισάκτους と παρεισῆλθον は、それぞれ「ひそかに入り込ませられた」と「忍び込んできた」として区別し、κατασκοπῆσαι は「偵察し」とした。脚注のアンカーと内容は対応しており、構造上の問題はない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:07Z'
review_pass:
  verdict: revise
  source_fidelity: 主な語義と構文上の関係は概ね保たれている。「偽兄弟たち」「メシア・イエスにあって持つ自由」「奴隷にする」という対応も適切である。ただし、παρεισάκτους は「ひそかに連れ込まれた」よりも、共同体へ秘密裏に入り込ませられた者という含みを明示するほうがよい。また κατασκοπῆσαι は単に「探り出す」より、敵対的・隠密の調査を示す「偵察する」が明確である。原文が次節へ続く未完結の構文である点は、末尾のダッシュで保持した。
  naturalness: 現行文の「偽兄弟たちのために——彼らは、…忍び込んできたのですが——」は、挿入句としての関係がややつかみにくく、「のですが」も日本語では不自然に宙づりになる。関係節を「すなわち」で受け、原文同様に次節へ開いたダッシュで終える形にすると、明瞭な現代標準日本語になる。
  terminology: 「偽兄弟たち」は ψευδαδέλφους の家族的比喩と論争的な強さを保っている。「メシア・イエス」は Χριστῷ Ἰησοῦ の称号性を可視化する訳として可能であり、代案の「キリスト・イエス」を脚注に置くのも適切である。「奴隷にする」は καταδουλόω の強い従属化を弱めない。
  issues:
  - severity: medium
    issue: παρεισάκτους の訳語が、秘密裏に共同体へ入り込ませられたという含みを十分に明示していない。
    rationale: 「ひそかに連れ込まれた」でも大筋は通るが、何らかの場所へ単に連れて来られた印象にもなりうる。「ひそかに入り込ませられた」は、後続の παρεισῆλθον（自ら忍び込んできた）と区別しつつ、文脈上の侵入の含みを明確にする。
  - severity: medium
    issue: 現行の挿入句の日本語構文が不自然である。
    rationale: 「のために——彼らは…のですが——」は、原文の未完結さを保とうとしているが、日本語として係り受けが不安定になる。関係節を「すなわち」で導入し、末尾のダッシュで次節への継続を示すほうが自然である。
  - severity: low
    issue: κατασκοπῆσαι の「探り出し」は隠密の偵察という語調をやや弱める。
    rationale: 「偵察する」は、この語の敵対的・秘密の調査という含みをより直接的に表す。
  revised_text: しかし、ひそかに入り込ませられた偽兄弟たち[a]のために——すなわち、私たちがメシア・イエス[b]にあって持っている自由を偵察し、私たちを奴隷にしようとして忍び込んできた者たちのために——
  revised_footnotes:
