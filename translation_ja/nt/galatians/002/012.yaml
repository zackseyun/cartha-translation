id: GAL.2.12
reference: Galatians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: ja
  text: というのも、ヤコブのもとから何人かが来る前、彼は異邦人たちといつも一緒に食事をしていた。ところが、その人たちが来ると、割礼を受けた者たち[a]を恐れて、身を引き、彼らから離れるようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「割礼派の者たち」。原文は直訳すると「割礼からの者たち」で、組織化された一派を指すかどうかは明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν
  choice: というのも、……が来る前
  rationale: πρόを伴う冠詞付き不定詞の時間的意味を自然な日本語で示し、γάρは前文への説明を表す「というのも」とした。
- source_word: τινας ἀπὸ Ἰακώβου
  choice: ヤコブのもとから何人か
  rationale: τιναςの不定性を保ちつつ、ἀπόが表す出所・関係を訳した。ヤコブが正式に派遣したとは断定しない。
- source_word: μετὰ τῶν ἐθνῶν
  choice: 異邦人たちと
  rationale: パウロ書簡でのἔθνηの通常の用法に従った。「信者」は原文にないため補わない。
- source_word: συνήσθιεν
  choice: いつも一緒に食事をしていた
  rationale: 未完了過去が示す習慣的・継続的な行為と、συν-の「共に」の意味を明確に表した。
- source_word: ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν
  choice: 身を引き、彼らから離れるようになった
  rationale: 二つの未完了過去が描く進行的な後退と自己分離を自然に表現した。「彼らから」は食事を共にしていた異邦人たちを文脈上明示する補足。
- source_word: φοβούμενος
  choice: 恐れて
  rationale: 分詞の因果的ニュアンスを簡潔に保持した。
- source_word: τοὺς ἐκ περιτομῆς
  choice: 割礼を受けた者たち
  rationale: 直訳調の「割礼からの者たち」を避けつつ、原文が明示しない「派」「一派」を本文には加えなかった。
theological_decisions:
- issue: ἀπὸ Ἰακώβουがヤコブ自身の派遣・承認を意味するか
  choice: ヤコブのもとから
  alternative: ヤコブに遣わされて／ヤコブの仲間の中から
  rationale: 原文は出所または関係を示すが、正式な派遣や彼らの態度に対するヤコブの承認までは明記していないため、その緊張を残した。
- issue: τοὺς ἐκ περιτομῆςが組織化された党派を指すか
  choice: 割礼を受けた者たち
  alternative: 割礼派の者たち
  rationale: 原文は割礼との関係によって集団を特定するが、明示的に「派」とは呼ばないため、本文ではより限定の少ない表現を採用した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。習慣を表す未完了過去は「いつも……していた」、その後の進行的な離反は「……ようになった」で表した。
