id: GAL.2.3
reference: Galatians 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Τίτος ὁ σὺν ἐμοί, Ἕλλην ὤν, ἠναγκάσθη περιτμηθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: ja
  text: しかし、私と一緒にいたテトスでさえ、ギリシア人であったにもかかわらず[a]、割礼を受けるよう強いられませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ギリシア人でしたが」。原文の分詞句は、直訳すれば「ギリシア人であり」とも訳せます。ここで「ギリシア人」は、文脈上、割礼を受けていない異邦人であったことを含意しますが、原文は明確に「ギリシア人」と記しています。
    reason: 分詞句の譲歩的解釈と、Ἕλληνの文化的含意を説明するため。
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の文脈との対比を示す接続詞として、簡潔で自然な現代日本語にした。
- source_word: οὐδὲ
  choice: でさえ……ませんでした
  rationale: テトスに焦点を当てた強い否定を、日本語の「さえ」と否定表現の組み合わせで再現した。
- source_word: Τίτος
  choice: テトス
  rationale: 新約聖書の人名として一般的な日本語表記を採用した。
- source_word: ὁ σὺν ἐμοί
  choice: 私と一緒にいた
  rationale: 冠詞付き前置詞句によるテトスの説明を、意味を足さず自然な関係節で表した。
- source_word: Ἕλλην ὤν
  choice: ギリシア人であったにもかかわらず
  rationale: 分詞句が文脈上持つ譲歩的な意味を明確にしつつ、Ἕλληνの具体的な語義を保持した。
- source_word: Ἕλλην
  choice: ギリシア人
  rationale: より広い解釈語である「異邦人」に置き換えず、原文の民族的・文化的呼称をそのまま訳した。
- source_word: ἠναγκάσθη
  choice: 強いられませんでした
  rationale: 外部からの圧力や強制を表す受動態を、明瞭で格調を保った現代日本語で訳した。
- source_word: περιτμηθῆναι
  choice: 割礼を受けるよう
  rationale: 受動不定詞を日本語として自然に表し、行為の内容を直接かつ明確に伝えた。
theological_decisions:
- issue: Ἕλληνを民族的呼称として訳すか、宗教的区分を示す解釈語で訳すか
  choice: ギリシア人
  alternative: 異邦人
  rationale: この箇所はテトスを明示的にἝλληνと呼んでいる。文脈上は無割礼の異邦人であることを含意するが、本文では一般化せず原語の具体性を保持した。
- issue: Ἕλλην ὤνの分詞句の論理関係
  choice: 譲歩として「であったにもかかわらず」
  alternative: 付帯的・説明的に「ギリシア人であり」
  rationale: 割礼を要求され得る背景と、実際には強いられなかったこととの対照から、譲歩的関係が最も自然である。ただし分詞そのものは接続関係を明示しないため、別訳を注記した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの対比と否定の強調を保った。「強制される」よりも自然で簡潔な「強いられる」を選び、「ギリシア人」を本文に残して原文の具体性を尊重した。
