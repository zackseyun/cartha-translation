id: GAL.2.17
reference: Galatians 2:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: ja
  text: しかし、メシアにあって義と認められることを求める中で、私たち自身も罪人であると見いだされたなら、メシアは罪に仕える者なのでしょうか。決してそうではありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: 求めている
  rationale: 主動詞と同時進行する状況を示す現在分詞として自然に表現した。
- source_word: δικαιωθῆναι
  choice: 義と認められる
  rationale: 受動態と法廷的な含意を保ちつつ、現代日本語で理解しやすい表現とした。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςの称号性を「メシア」で示し、ἐνの結合・領域を示す幅を「にあって」で保持した。
- source_word: εὑρέθημεν
  choice: 見いだされた
  rationale: 受動形と、結果としてその状態にあると判明したという修辞的な力を保った。
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: 私たち自身も、罪人である
  rationale: καίを「も」、αὐτοίの強調を「自身」で明示し、ἁμαρτωλοίを述語として訳した。
- source_word: ἁμαρτίας διάκονος
  choice: 罪に仕える者
  rationale: 属格の関係を過度に限定せず、διάκονοςの奉仕・従事の意味を自然な日本語で表した。
- source_word: μὴ γένοιτο
  choice: 決してそうではありません
  rationale: パウロの強い否定を、 dignifiedで明瞭な現代日本語として表現した。
theological_decisions:
- issue: メシアが罪を生じさせるという意味に訳すか
  choice: メシアは罪に仕える者なのでしょうか
  alternative: メシアは罪を助長する者なのでしょうか
  rationale: 原文は帰結を問う修辞疑問であり、メシアが罪の原因だと断定してはいない。「仕える者」はδιάκονοςを保ち、直後の強い否定へ至る神学的緊張を解消しない。
- issue: ἐν Χριστῷの関係を限定するか
  choice: メシアにあって
  alternative: メシアによって
  rationale: ἐνを手段だけに限定せず、メシアとの結びつき・領域・手段を含み得る原文の幅を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの論証にふさわしい端正な調子を保った。「メシア」は称号として統一し、修辞疑問と強い否定を明確にした。
