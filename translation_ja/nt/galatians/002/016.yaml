revisions:
- from: しかし、人は律法の行いによってではなく、イエス・メシアを信じる信仰を通して義とされるのだと知って、私たちもメシア・イエスを信じました。それは、律法の行いによってではなく、メシアを信じる信仰によって義とされるためです。[a][b] 律法の行いによっては、いかなる肉なる者も義とされないからです。[c]
  to: しかし、人は律法の行いによって義とされるのではなく、ただイエス・メシアへの信仰を通して義とされることを知って、私たちもメシア・イエスを信じました。それは、律法の行いによってではなく、メシアへの信仰によって義とされるためです。[a][b] なぜなら、律法の行いによっては、だれ一人として義とされないからです。[c]
  rationale: 本文の目的格的な読みと脚注の主格的代案は維持した。その上で、「ただ」によりἐὰν μὴ の限定を明確にし、「だれ一人として」によりπᾶσα σάρξの慣用的意味を自然な現代日本語で示した。脚注cは原文の比喩的な「肉」を保存する。脚注aは第一のπίστεως Ἰησοῦ Χριστοῦ句、脚注bは第二のπίστεως Χριστοῦ句に対応するため、各句の直後へ置くことが必要である。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:29Z'
