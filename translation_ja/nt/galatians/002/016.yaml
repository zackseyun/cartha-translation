id: GAL.2.16
reference: Galatians 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: ja
  text: しかし、人は律法の行いによって義とされるのではなく、ただイエス・メシアへの信仰を通して義とされることを知って、私たちもメシア・イエスを信じました。それは、律法の行いによってではなく、メシアへの信仰によって義とされるためです。[a][b] なぜなら、律法の行いによっては、だれ一人として義とされないからです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・メシアの真実（忠実さ）を通して」とも訳せる。ここで「信仰」と訳した語を、メシアご自身の真実または忠実さを指すと解することができる。
    reason: alternative_reading
  - marker: b
    text: 「メシアの真実（忠実さ）によって」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: 直訳「すべての肉」。ここでは、人間一般を指す聖書的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: 義とされる
  rationale: 法廷的・関係的な含意を持つパウロの反復語を、節全体で一貫して訳した。「義と認められる」も可能だが、原文の受動態を簡潔に保つ。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ここでは個々の人間を一般的に指す単数形であり、現代日本語では「人」が自然で過不足がない。
- source_word: ἐξ ἔργων νόμου
  choice: 律法の行いによって
  rationale: 「善い行い」一般へ広げず、パウロ特有の語句と律法との明示的な結び付きを保った。
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを信じる信仰を通して
  rationale: 属格を目的格的に解する読みを本文に採用し、日本語として意味が明瞭になるよう「を信じる」を補った。メシアの真実・忠実さを指す可能性は脚注に残した。
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: 私たちもメシア・イエスを信じました
  rationale: πιστεύω＋εἰςを自然な日本語で表し、καὶ ἡμεῖςの強調を「私たちも」で保持した。
- source_word: ἐκ πίστεως Χριστοῦ
  choice: メシアを信じる信仰によって
  rationale: 前半の属格構文と同じ解釈を本文で一貫させつつ、別解は脚注に明記した。
- source_word: Χριστός
  choice: メシア
  rationale: 称号としての意味を訳出し、単なる固有名詞化を避けた。日本語の複合表記では「イエス・メシア」「メシア・イエス」とした。
- source_word: πᾶσα σάρξ
  choice: いかなる肉なる者も
  rationale: 「だれも」より原文の聖書的な「肉」の比喩を残しつつ、日本語で人間を指すことが伝わる形にした。
- source_word: εἰδότες δὲ
  choice: しかし、…知って
  rationale: 前文との軽い対照と分詞による論理的つながりを保持した。
- source_word: ἐὰν μὴ
  choice: …ではなく、…を通して
  rationale: この構文は単純な例外を示すとも、対照的な排除を示すとも読める。文脈上の主要な対照を自然な日本語で表した。
theological_decisions:
- issue: πίστις Ἰησοῦ Χριστοῦ / πίστις Χριστοῦ の属格
  choice: 目的格的属格：「イエス・メシアを信じる信仰」「メシアを信じる信仰」
  alternative: 主格的属格：「イエス・メシアの真実（忠実さ）」「メシアの真実（忠実さ）」
  rationale: 文法上・釈義上の論争を解消し切らず、本文では直後の「メシア・イエスを信じました」と自然につながる目的格的理解を採り、主格的理解を脚注で保存した。
- issue: ἐὰν μὴ の機能
  choice: 律法の行いと信仰を対照する「…ではなく、…を通して」
  alternative: 「…によるのでなければ」のような厳密な例外構文
  rationale: 後続する「律法の行いによってではなく」との平行関係を重視した。ただし、ギリシア語自体の例外的な形は翻訳上完全には再現できない。
- issue: 義認表現の受動態
  choice: 「義とされる」
  alternative: 「義と認められる」「正しい者と宣告される」
  rationale: 神を明示しない原文の神的受動態を保ち、行為者を本文中で補わないことで原文の表現と神学的余地を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの法廷的な「義とされる」、称号「メシア」、および「肉」という聖書的語感を保持した。長いギリシア語一文は可読性のため三文に分けたが、理由を示す最後の節との論理関係は維持した。脚注記号は関連する二つの属格構文と「肉」の表現の直後に配置した。
