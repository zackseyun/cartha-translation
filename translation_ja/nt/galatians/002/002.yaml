id: GAL.2.2
reference: Galatians 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: ja
  text: 私は啓示に従って上って行き[a]、異邦人の間で宣べ伝えている福音を彼らに示しました。しかし、重んじられている人たち[b]には内々に示しました。ひょっとして、私が今無駄に走っている、あるいはすでに無駄に走ったのではないかと思ったからです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「啓示があったため、上って行き」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「重んじられていると思われる人たち」。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「ひょっとして、私は無駄に走っている、あるいは無駄に走ったのではないかと思って」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: 上って行き
  rationale: 目的地は文脈上エルサレムだが、この節には明記されていないため補わず、ἀναβαίνωの基本的な移動表現を保った。
- source_word: κατὰ ἀποκάλυψιν
  choice: 啓示に従って
  rationale: κατάが示しうる基準・契機を簡潔に表し、啓示が旅を促したという意味を伝える。原因を明示する訳も可能なので脚注に残した。
- source_word: ἀνεθέμην
  choice: 示しました
  rationale: 検討のため他者の前に提示する意味を自然な日本語で表す。「伺いを立てた」のような従属や正式な承認申請までは含意させない。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡の文脈に定着した、簡潔で品位ある訳語。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 異邦人の間で
  rationale: ここでのἔθνηは地政学的な諸国民よりも、ユダヤ人ではない人々を指す。
- source_word: κατ’ ἰδίαν
  choice: 個別に
  rationale: 一般の場とは区別された私的な提示を、現代日本語で簡潔に表す。
- source_word: τοῖς δοκοῦσιν
  choice: 重んじられている人たち
  rationale: 社会的・共同体的に重要と見なされる人々という意味を保ち、パウロ自身がその評価を全面的に承認しているか皮肉を込めているかを決めつけない。
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: 私が今走っていることも、これまで走ってきたことも、無駄にならないため
  rationale: τρέχωの現在とἔδραμονのアオリストの対比を、現在の働きとそれまでの働きとして表した。走るという比喩も保持した。
theological_decisions:
- issue: パウロが福音を個別に示したことは、使徒たちによる教理上の承認を求めたことを意味するか
  choice: 「示しました」とし、検討のため提示したことは表すが、権威への服従や正式な承認申請とは断定しない。
  alternative: 「承認を求めて提出しました」または、評価の余地を含まない単なる「知らせました」
  rationale: ἀνατίθημιと文末の懸念は何らかの協議を示唆するが、正式な従属関係までは語っていないため、本文の緊張を保った。
- issue: 「無駄に走る」という懸念の時制とニュアンス
  choice: 現在および過去の働きが無駄にならないという目的・懸念として訳す。
  alternative: 「ひょっとすると、私は無駄に走っている、あるいは走ってきたのではないかと考えて」
  rationale: μή πωςを伴う構文は懸念を表しうる。日本語本文では文脈に自然な目的表現とし、自己疑念をより直接に表す可能性を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「走る」というパウロの比喩を保持した。「上って行く」は目的地を不必要に補わず、「重んじられている」はδοκέωに残る評価上の含みを保つ。本文中の脚注記号は対応箇所にすべて配置した。
