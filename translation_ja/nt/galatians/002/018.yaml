  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: ja
  text: というのも、もし私がいったん取り壊したものを再び建てるなら、自分を違反者として示すことになるからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分が違反者であることを立証する。」
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: もし……なら
  rationale: γάρは直前の議論を受けるが、日本語では独立した「なぜなら」を加えると重くなるため、文脈上の説明的つながりを保ちつつ条件を自然に表した。
- source_word: ἃ κατέλυσα ταῦτα
  choice: いったん取り壊したもの
  rationale: 関係代名詞と指示語の対応を自然な日本語にし、καταλύωとοἰκοδομέωの建築比喩を保った。「いったん」は再建との時間的・論理的対照を明確にする。
- source_word: πάλιν οἰκοδομῶ
  choice: 再び建てる
  rationale: πάλινと現在形οἰκοδομῶを直接かつ自然に表し、取り壊す／建てるという対照を維持した。
- source_word: παραβάτην
  choice: 違反者
  rationale: 道徳的・法的な境界を踏み越える者という語義を保ちつつ、「律法違反者」と限定して本文の曖昧さを狭めることを避けた。
- source_word: ἐμαυτὸν συνιστάνω
  choice: 私は自分が……であることを示すことになります
  rationale: 再帰代名詞の自己告発的な力と、συνίστημιの「示す・立証する」を自然な現代日本語で表した。「証明する」より断定の度合いを上げすぎない。
theological_decisions:
- issue: 「取り壊したもの」が具体的に何を指すか
  choice: 本文では対象を特定せず「もの」とする
  alternative: 「律法」「律法による生き方」などと明示する
  rationale: ギリシア語本文は複数の関係代名詞で対象を示すだけであり、具体的内容は文脈から解釈される。翻訳本文で一つに固定せず、原文の含みを保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「取り壊す／建てる」という原文の建築比喩を保持し、神学的対象を本文で補足して限定することは避けた。
