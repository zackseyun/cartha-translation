reference: Galatians 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: ja
  text: そして、私に与えられた恵みを認めたヤコブとケファとヨハネ、すなわち柱と見なされていた人たちは、私とバルナバに交わりの右手を差し出しました[a]。それは、私たちが異邦人のもとへ、彼らが割礼を受けた人々[b]のもとへ行くためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「交わりの右手（複数）を与えました」。三人がそれぞれ右手を差し出し、協力と連帯を確認したことを表す慣用表現です。
    reason: 原文の慣用表現および複数形が表す具体的動作を説明するため。
  - marker: b
    text: 直訳すると「割礼」。ここではユダヤ人を指します。なお、「行く」は文脈から補っています。
    reason: 換喩的表現と原文で省略された動詞を説明するため。
lexical_decisions:
- source_word: γνόντες
  choice: 認めた
  rationale: 単なる認知だけでなく、パウロに与えられた恵みを理解して公に承認した含意を、後続の行為との関係も含めて自然に表す。
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: 私に与えられた恵み
  rationale: 神の好意と、それによる使徒的召命・務めの両方を含み得る「恵み」という広い表現を保つ。
- source_word: Κηφᾶς
  choice: ケファ
  rationale: 原文の固有名Κηφᾶςをそのまま音写し、ペトロへの置換を避ける。
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: 柱と見なされていた人たち
  rationale: 共同体における公的評価を示しつつ、「自称」などの否定的含意を加えない。
- source_word: δεξιὰς ... κοινωνίας
  choice: 交わりのしるしとして右手を差し出しました
  rationale: 複数の人物が右手を差し出す具体的動作と、協力・連帯を確認する慣用的意味の双方を自然な日本語で示す。
- source_word: τὰ ἔθνη
  choice: 異邦人
  rationale: ここでは地政学的な「諸国民」より、ユダヤ人ではない人々を指す文脈上の意味が明確である。
- source_word: τὴν περιτομήν
  choice: 割礼を受けた人々
  rationale: 字義は「割礼」だが、ここではユダヤ人を指す換喩であり、対象となる人々として自然に訳す。
theological_decisions:
- issue: κοινωνίαを「交わり」とするか「協力関係」とするか
  choice: 交わり
  alternative: 協力関係
  rationale: 宣教上の協力を含むが、それだけに狭めず、参与・連帯・共有という語の幅を保つ。具体的な合意の意味は「しるしとして右手を差し出した」で補う。
- issue: ἵνα以下を厳密な目的として訳すか、合意内容として訳すか
  choice: 行くためでした
  alternative: 行くことになりました
  rationale: ἵναの目的・結果的な方向性を保つ。ただし動詞「行く」は原文では省略され、文脈から補われているため、その点を脚注で明示する。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた敬体。神学用語として定着した「恵み」「異邦人」は保持し、δεξιὰς κοινωνίαςは不自然な逐語訳を避けながら脚注で字義を示した。
