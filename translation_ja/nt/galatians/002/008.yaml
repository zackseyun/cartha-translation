id: GAL.2.8
reference: Galatians 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: ja
  text: というのも、割礼を受けた人々に対する使徒としての務め[a]のためにペトロを通して働かれた方は、異邦人[b]のためにも、私を通して働かれたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「割礼の使徒職のために」。ここで「割礼」は、割礼を受けたユダヤ人を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「諸国民」。ここではユダヤ人以外の人々を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: 働かれた
  rationale: 同じ語根を同じ表現で訳し、ペトロとパウロの働きに見られる神の作用を並行的に示す。作用の具体的なあり方を「力を与えた」などと限定しすぎない。
- source_word: Πέτρῳ / ἐμοὶ
  choice: ペトロを通して／私を通して
  rationale: 文脈上、与格を手段・媒介の意味に取り、使徒としての働きが二人を通してなされたことを表す。
- source_word: εἰς ἀποστολὴν
  choice: 使徒の務めのために
  rationale: ἀποστολήの使徒職・使徒的使命という意味を、現代日本語で自然に伝える。
- source_word: τῆς περιτομῆς
  choice: 割礼を受けた人々への
  rationale: 「割礼」を換喩として用い、ユダヤ人を指す原文の表現を明瞭にする一方、「ユダヤ人」と言い換え切らず、割礼という対比語を保持する。
- source_word: τὰ ἔθνη
  choice: 異邦人
  rationale: ここでは「割礼を受けた人々」と対照される非ユダヤ人を指すため、「異邦人」が文脈に最も適する。
theological_decisions:
- issue: 働いた主体を「神」と明示するか
  choice: 働かれた方
  alternative: 神は／その方は
  rationale: 原文は冠詞付き分詞「働いた方」であり、文脈上は神を指すが、本文にない名詞を補わず原文の含みを保つ。敬語により神的主体であることを自然に示す。
- issue: ペトロとパウロに対する働きの性質
  choice: 二人を「通して働かれた」と並行的に訳す
  alternative: 二人に力を与えられた／二人の内に働かれた
  rationale: 同一動詞の反復を保ち、神の働きが具体的にどのように作用したかを一つの教理的説明に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の理由節、動詞の反復、ペトロとパウロの並行関係を維持しつつ、「使徒職」を一般読者に分かりやすい「使徒の務め」とした。
