lexical_decisions:
- source_word: Ἡμεῖς
  choice: 私たちは
  rationale: 明示された代名詞を訳出し、文脈上の軽い強調を保った。
- source_word: φύσει
  choice: 生まれながらの
  rationale: ここでは内面的な性質ではなく、生来の民族的出自を表すため、自然な現代日本語で訳した。
- source_word: Ἰουδαῖοι
