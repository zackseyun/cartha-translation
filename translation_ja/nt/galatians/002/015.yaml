  rationale: パウロ書簡で慣用的な語をそのまま保ち、この箇所の簡潔で鋭い対比を弱めないようにした。
theological_decisions:
- issue: この節が、異邦人に対するユダヤ人の道徳的優越をパウロ自身が肯定しているように響く可能性
