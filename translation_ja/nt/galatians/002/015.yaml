  alternative: 「異邦人のように罪人と見なされている者ではない」と解釈的に訳す。
  rationale: 原文はこの対比を簡潔かつ直接的に述べる。続く文脈がその意味を展開するため、この一節だけに解釈上の限定を織り込まない。
