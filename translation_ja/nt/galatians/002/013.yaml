  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: ja
  text: ほかのユダヤ人たちも彼と共に偽善的に振る舞い、その結果、バルナバまでが彼らの偽善に巻き込まれました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: 彼と一緒に偽善的に振る舞い
  rationale: 共同参加を表す σύν- の力と、実際の態度を偽る行動を表す動詞の意味を、自然な現代日本語で示した。
- source_word: αὐτῷ
  choice: 彼と一緒に
  rationale: 与格が示すペトロとの行動上の連帯を明示した。
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: ほかのユダヤ人たち
  rationale: 文脈上、ペトロ以外のユダヤ人信徒たちを指すため、「残りの」より自然な「ほかの」を選んだ。Ἰουδαῖοι は地域住民だけでなく民族的・宗教的集団を指す。
- source_word: ὥστε
  choice: その結果
  rationale: 先行する集団的行動がバルナバにも及んだという結果関係を明確にした。
- source_word: συναπήχθη
  choice: 引きずられてしまいました
  rationale: 他者の影響によって共に連れ去られる受動的な含意を保ちつつ、社会的圧力に屈した深刻さを自然に表した。
- source_word: ὑποκρίσει
  choice: 偽善
  rationale: 見せかけや不誠実な振る舞いを指す標準的な訳語であり、パウロの強い批判を保つ。
theological_decisions:
- issue: バルナバの関与の度合い
  choice: 彼らの偽善に引きずられてしまいました
  alternative: 彼らの偽善によって連れ去られました
  rationale: バルナバ自身の責任を消さず、同時に συναπήχθη の受動態が示す集団的影響も保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。前節から続く叙述に合わせて丁寧体を用いた。「偽善」を反復し、原文の強調を保持した。
