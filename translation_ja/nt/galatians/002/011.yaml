source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: ja
  text: しかし、ケファ[a]がアンティオキアに来たとき、私は彼に面と向かって反対しました。彼は非難を受けるべき状態にあったからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ケファは、ペテロのアラム語名です。
    reason: cross_reference
  - marker: b
    text: 別訳「彼が明らかに誤っていたからです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: しかし、…来たとき
  rationale: δέの穏やかな対照とὅτεの時を示す働きを、自然な現代日本語で表しました。
- source_word: Κηφᾶς
  choice: ケファ
  rationale: 原文の人名形Κηφᾶςを音写し、「ペテロ」への置き換えは注に回しました。
- source_word: εἰς Ἀντιόχειαν
  choice: アンティオキアに
  rationale: 都市への移動を示す日本語として自然です。
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: 面と向かって彼に
  rationale: 直接本人と対峙したという原文の鮮明な慣用表現を保ちました。
- source_word: ἀντέστην
  choice: 反対しました
  rationale: 公然と立ち向かったことを、過度に攻撃的にせず明瞭に伝えます。
- source_word: κατεγνωσμένος ἦν
  choice: 責められるべき状態にあった
  rationale: 完了受動分詞と未完了過去による結果状態を表しつつ、誰が断罪したかを不必要に特定しません。
theological_decisions:
- issue: Κηφᾶςの名の表記と人物同定
  choice: 本文では「ケファ」を保持する
  alternative: 読者になじみのある「ペテロ」と訳す
  rationale: 原文の人名形を尊重し、ペテロとの同定は注で示します。
- issue: κατεγνωσμένος ἦνの意味
  choice: 「責められるべき状態にあった」
  alternative: 「明らかに間違っていた」または「有罪とされていた」
  rationale: 受動形と結果状態の含みを保ち、「間違い」という解釈や法廷的な有罪宣告に狭く限定することを避けました。
translation_notes:
  register: 明瞭で品位ある現代標準日本語です。敬体を用い、「面と向かって」で原文の直接対決の力を保ちました。注記記号は対応箇所が分かるよう、本文末尾ではなく関連表現に付すのが望ましいです。
