revisions:
- from: この人たちには、私たちはほんの一時も屈して従うことはしませんでした。[a] それは、福音の真理があなたがたのために保たれるためです。[b]
  to: この人たちには、私たちはほんの一時も[a]服従して譲歩することはしませんでした。それは、福音の真理があなたがたのもとにとどまり続けるためです。[b]
  rationale: 「とどまり続ける」によりδιαμείνῃの継続・存続の意味を直接に表し、「あなたがたのもとに」によりπρὸς ὑμᾶςの方向・関係を本文で保持した。「服従して譲歩する」は、服従という仕方で譲歩しなかったというギリシア語の表現を、過度な神学的限定なしに明示する。脚注aは該当語句の直後に移した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:24Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の「この人たちには」「ほんの一時も」「屈して従うことはしませんでした」は、οἷς、οὐδὲ πρὸς ὥραν、εἴξαμεν τῇ ὑποταγῇをおおむね忠実に伝えている。ただし、διαμείνῃは「保たれる」よりも「とどまり続ける／存続する」が直接的であり、受動的な保存行為を不必要に含意しない。またπρὸς ὑμᾶςについては、「あなたがたのもとに」を本文に置くほうが方向・関係の曖昧さを保ち、「あなたがたのために」は脚注に残すのが適切である。
  naturalness: 「福音の真理があなたがたのために保たれるためです」は、「ため」が重なり、また「保たれる」がやや硬く解釈的に響く。「福音の真理があなたがたのもとにとどまり続けるためです」は明瞭で現代標準日本語として自然である。
  terminology: 「福音の真理」はパウロ書簡の定着した重要表現として適切である。「服従して譲歩する」は、譲歩（εἴξαμεν）と服従（τῇ ὑποταγῇ）の両要素を保ちつつ、原案の「屈して従う」よりも構文関係を明示する。
  issues:
  - severity: medium
    issue: διαμείνῃを「保たれる」としている
    rationale: διαμένωはここで「とどまる、続く」の意味であり、「保たれる」は保存する主体や保護行為を補う。文脈上の含意としてはあり得るが、本文ではより直接的な「とどまり続ける」が望ましい。
  - severity: medium
    issue: πρὸς ὑμᾶςを本文で「あなたがたのために」と限定している
    rationale: 益・関係を示す理解は可能だが、πρόςはここで「あなたがたのもとに／あなたがたと共に」の方向・関係も表し得る。本文では限定を避け、益の理解を脚注に置く。
  - severity: low
    issue: 脚注aのアンカーが節末にある
    rationale: 脚注は「ほんの一時も」に直接関わるため、その語句の直後に置くと参照先が明確になる。
  revised_text: この人たちには、私たちはほんの一時も[a]服従して譲歩することはしませんでした。それは、福音の真理があなたがたのもとにとどまり続けるためです。[b]
  revised_footnotes:
