source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: ja
  text: この人たちには、私たちはほんの一時も[a]服従して譲歩することはしませんでした。それは、福音の真理があなたがたのもとにとどまり続けるためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「一時間さえも」。ここでは「ほんの少しの間も」という意味の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「福音の真理があなたがたのためにとどまり続けるためです」。
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: この人たちには
  rationale: 直前に述べられた人々を指す関係代名詞の与格を、文脈上の指示関係が明瞭になる自然な日本語で表した。
- source_word: οὐδὲ πρὸς ὥραν
  choice: ほんの一時も
  rationale: 字義的には「一時間さえも」だが、短い間すらなかったことを表す慣用句なので、現代日本語でその強意を自然に伝えた。
- source_word: εἴξαμεν τῇ ὑποταγῇ
  choice: 屈して従うことはしませんでした
  rationale: εἴξαμενの「譲る・屈する」と、τῇ ὑποταγῇの服従の意味を区別しつつ、一続きの自然な日本語にした。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 後続節がパウロたちの拒絶の目的を示すことを明確にした。
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: 福音の真理
  rationale: パウロ書簡の重要な表現を簡潔かつ定着した日本語で保持した。
- source_word: διαμείνῃ
  choice: 保たれる
  rationale: 単に存在し続けるだけでなく、損なわれず存続するという文脈上の含意を自然に表した。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのために
  rationale: ガラテヤの読者に向けて、またその益となるように福音の真理が保たれるという方向・関係を表した。「あなたがたのもとに」も可能なので注記した。
theological_decisions:
- issue: 反対者に対するパウロたちの拒絶の範囲
  choice: 彼らに少しも屈して従わなかったという広い表現を維持した。
  alternative: 個人的な服従の拒否、または制度的譲歩の拒否に限定して解する。
  rationale: 原文は服従という仕方で譲歩しなかったと述べるが、その拒絶を個人的または制度的なものだけに限定していないため、特定の教理的枠組みに狭めなかった。
- issue: πρὸς ὑμᾶςが示す関係
  choice: あなたがたのために
  alternative: あなたがたのもとに／あなたがたの間に
  rationale: 読者の益を表す理解を本文に採ったが、方向・所在を示す理解も文法上可能であるため脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒書簡にふさわしい落ち着いた格調を保った。「屈して従う」により、譲歩と服従という原文の二要素を過度に重くならない形で表現した。
