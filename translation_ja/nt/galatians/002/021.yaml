source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: ja
  text: 私は神の恵みを無効にしません。というのも、もし義が律法によって得られるのなら、メシアは無駄に[a]死んだことになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「無駄に」は、「何の意味もなく」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: 無にしません
  rationale: 単なる拒絶ではなく、神の恵みを無効なものとして扱うという文脈上の強い意味を自然な日本語で表す。
- source_word: χάριν
  choice: 恵み
  rationale: 神から無償で与えられる好意を表すパウロ書簡の標準的な訳語であり、現代日本語でも理解しやすい。
- source_word: διὰ νόμου
  choice: 律法によって得られる
  rationale: ギリシア語では動詞が省略されているため、「義」との関係を日本語として明瞭にしつつ、律法が手段であるという構文を保つ。
- source_word: δικαιοσύνη
  choice: 義
  rationale: 神の前で正しいとされることを含み得るパウロ的な語義を、説明的に限定せず簡潔に保つ。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここでは固有名のような呼称よりも、「油注がれた者」という称号として機能していることを示す。
- source_word: δωρεὰν
  choice: 無駄に
  rationale: この条件文では「理由なく」よりも、死が無意味・無益になるという帰結を表す語義が文脈に適する。
theological_decisions:
- issue: 律法と義の関係
  choice: 「もし義が律法によって得られるのなら」とし、仮定として表現する。
  alternative: 「もし律法によって義とされるのなら」
  rationale: δικαιοσύνηを「義とされる」という出来事に狭めず、原文の名詞表現が持つ幅と神学的緊張を保つ。
- issue: メシアの死に対する δωρεὰν の含意
  choice: 「無駄に死んだことになる」
  alternative: 「理由もなく死んだことになる」
  rationale: 文脈は死の原因の欠如より、その必要性と意義が失われるという反実仮想的な帰結を強調している。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「私は」で話者を明示し、「からです」を文末に置いて、原文の γάρ が示す理由説明を自然に表した。
