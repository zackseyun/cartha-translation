  source_fidelity: 原文の論理と語義を忠実に反映している。ὀρθοποδοῦσινの比喩を「まっすぐ歩む」として保ち、πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίουを「福音の真理に沿って」と、行動の規準・一致の意味で自然に表している。Κηφᾷは「ケファ」と音写され、πῶς ἀναγκάζειςも能力の問いへ変えず「どうして…強いるのですか」と直接的に訳されている。Ἰουδαΐζεινも文脈に即して「ユダヤ人のように生活する」とされ、後代的な専門用語の含意を不必要に持ち込んでいない。
