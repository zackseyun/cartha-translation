id: GAL.2.14
reference: Galatians 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: ja
  text: しかし、彼らが福音の真理に沿ってまっすぐ歩んでいない[a]のを見たとき、私は皆の前でケファに言いました。「あなたはユダヤ人でありながら、ユダヤ人のようにではなく、異邦人のように生活しているのに、どうして異邦人たちにユダヤ人のように生活することを強いるのですか。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「福音の真理に向かって、まっすぐ歩んでいない」。
    reason: lexical_alternative
  - marker: b
    text: 「ユダヤ人のように生活する」は、伝統的には「ユダヤ化する」とも訳されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: まっすぐ歩んでいない
  rationale: 語が持つ「まっすぐ歩く」という比喩を保ちつつ、行動が福音の真理に適合していないことを自然な日本語で表す。
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: 福音の真理に沿って
  rationale: πρόςはここで単なる方向ではなく、福音の真理を規準とする適合・一致を示すため、「に沿って」とした。
- source_word: Κηφᾷ
  choice: ケファ
  rationale: 原文が用いるアラム語名のギリシア語形を尊重し、「ペトロ」に置き換えず音写した。
- source_word: ἐθνικῶς
  choice: 異邦人のように
  rationale: 生活様式を表す副詞であり、対照されるἸουδαϊκῶςと並行する自然な表現とした。
- source_word: Ἰουδαϊκῶς
  choice: ユダヤ人のように
  rationale: ἐθνικῶςとの対照を明確に保ち、民族的・宗教的生活様式を表す。
- source_word: ἀναγκάζεις
  choice: 強いる
  rationale: 単なる勧めではない圧力・強制の意味を、簡潔で格調ある現代日本語で保持する。
- source_word: Ἰουδαΐζειν
  choice: ユダヤ人のように生活する
  rationale: 後代の専門的・論争的含意を持ち込みにくくしながら、ユダヤ的生活様式を採るという文脈上の意味を明瞭に示す。
theological_decisions:
- issue: Ἰουδαΐζεινを後代の教理論争に寄せずにどう訳すか
  choice: ユダヤ人のように生活する
  alternative: ユダヤ化する／ユダヤ人の慣習に従う
  rationale: 直近の文脈は食卓交わりと民族的境界をめぐる行動であるため、特定の後代的神学体系に限定せず、生活様式を表す訳を採った。
- issue: πῶςを能力の問いとして解釈するか、行動の矛盾を問う表現として訳すか
  choice: どうして……強いるのですか
  alternative: どうして……強いることができるのですか
  rationale: 原文には能力を示す助動的要素がなく、ケファの行動の仕方と矛盾を直接問いただしているため、「できる」を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの公然とした叱責の直接性を保った。「歩む」という聖書的比喩は原語に根拠があり、日本語でも理解可能なため維持した。
