  terminology: 「福音」「ケファ」「ユダヤ人」「異邦人」は一貫しており、固有名と民族・生活様式の対照が明確である。「まっすぐ歩む」は原語に根拠のある比喩として日本語でも理解可能である。脚注a・bはいずれも本文の語彙選択を適切に補足し、アンカー位置にも問題はない。
