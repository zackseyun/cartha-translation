  naturalness: 「ひとかどの者」「重立った人たち」は意味を伝えますが、現代標準日本語としてはやや古風です。「ひとかどの人物と見なされていた人たち」と、その照応としての「その人たち」に改めます。挿入句をダッシュで保ちつつ、文法的に完結した文にします。
  terminology: 「神は人を分け隔てなさいません」は πρόσωπον … οὐ λαμβάνει の慣用的意味を正確かつ自然に表します。「何も付け加えませんでした」は、οὐδὲν προσανέθεντοの目的語を補い過ぎず、脚注で「さらに課さなかった」という可能性を示すことができます。
