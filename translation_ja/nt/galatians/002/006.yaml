source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: ja
  text: しかし、ひとかどの人物と見なされていた人たちについて言えば[a]――彼らがかつてどのような人たちであったとしても、それは私には関係ありません。神は人を分け隔てなさいません[b]――実際、その人たちは私に何も付け加えませんでした[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「重要人物と見なされていた人たち」。原文には、彼らの評判を認めながらも一定の距離を置く響きがあります。
    reason: lexical_alternative
  - marker: b
    text: 直訳「神は人の顔を受け取らない」。人の外面的な地位や評判によって扱いを変えない、という意味の慣用表現です。
    reason: cultural_note
  - marker: c
    text: 別訳「私に何もさらに課しませんでした」。何を付け加えなかったのかは原文に明記されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: ひとかどの者と思われていた人たち／その重立った人たち
  rationale: 周囲から認められた地位や評判を表しつつ、パウロがその権威を絶対視していない距離感も保つ。前半は「何かある者」という原文の含みを自然な日本語で表し、後半は同じ人々を簡潔に指す。
- source_word: ὁποῖοί ποτε ἦσαν
  choice: 彼らがかつてどのような人たちであったにせよ
  rationale: ποτεの時間的な含みを「かつて」で示し、以前の身分や立場がパウロの判断に影響しないという趣旨を保つ。
- source_word: οὐδέν μοι διαφέρει
  choice: 私には何の違いもありません
  rationale: 地位や経歴がパウロにとって問題にならないという慣用的意味を、明瞭で過度に攻撃的でない日本語にする。
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: 神は人を分け隔てなさいません
  rationale: 直訳では「神は人の顔を受け取らない」だが、聖書的慣用句の意味である不偏不党を自然な現代日本語で伝える。
- source_word: ἐμοὶ γὰρ
  choice: 実際、…私に
  rationale: ἐμοίを明示し、γάρがここで前言をパウロ自身の経験によって裏づける働きを「実際」で自然に表す。
- source_word: οὐδὲν προσανέθεντο
  choice: 私に何も付け加えませんでした
  rationale: 彼らがパウロの福音や使命に何かを追加したのではないという基本的意味を保持しつつ、「何もさらに課さなかった」という可能な含みは脚注に残す。
theological_decisions:
- issue: エルサレムの指導者たちに対するパウロの語調
  choice: 彼らの地位を認めつつ、その地位が福音の真実性やパウロの使命を決定するものではないという距離感を保つ。
  alternative: 「偉そうに見えた人たち」のように強い皮肉を込める、または「公認の指導者たち」のように肯定的な肩書きに限定する。
  rationale: δοκέωは評判や公的評価を示し得るが、文脈には修辞的な距離もある。侮蔑にも全面的承認にも固定しない表現が原文の緊張をよく保つ。
- issue: οὐδὲν προσανέθεντοが福音への追加を指すか、要求の付加を指すか
  choice: 本文では広く「何も付け加えませんでした」とし、対象を限定しない。
  alternative: 「私に何も新たに課しませんでした」と訳し、追加要求の意味に限定する。
  rationale: 動詞は情報や貢献の追加とも、要求の付加とも理解できる。原文が目的語を明示しないため、本文では曖昧さを保ち、別訳を脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、挿入句をダッシュで示して原文の中断を伴う修辞構造を保持した。「ひとかどの者」「重立った人たち」は、俗語や露骨な侮蔑を避けつつ、評判ある人物という意味とパウロの距離感を表す。
