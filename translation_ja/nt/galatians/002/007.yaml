source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: ja
  text: ところが、むしろ彼らは、私に割礼を受けていない人々のための福音が委ねられていることを、ペテロに割礼を受けている人々のための福音が委ねられているのと同じように見て、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「無割礼の福音……割礼の福音」。ここでは、それぞれの人々のために委ねられた福音という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: ところが、それどころか
  rationale: ἀλλάの強い逆接とτοὐναντίονの「反対に」という強調を、前節との対照が明確になる自然な現代日本語で表した。
- source_word: ἰδόντες
  choice: 認めました
  rationale: 字義的には「見て」だが、ここでは事実を見て取って認識したことを示す。日本語では主文につないで「認めました」とするのが明瞭である。
- source_word: πεπίστευμαι
  choice: 私が委ねられている
  rationale: πιστεύωの完了受動形で、福音宣教の任務を託された継続的な状態を示すため、「委ねられている」とした。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡における定着した神学的用語を保ちつつ、現代日本語として簡潔に表した。
- source_word: τῆς ἀκροβυστίας
  choice: 割礼を受けていない人々のための
  rationale: 原文の割礼に基づく呼称を保持し、属格が示す宣教対象を自然な日本語で明示した。「異邦人」と意訳して民族的範囲を確定しすぎることを避けた。
- source_word: καθὼς
  choice: ちょうど……のと同じです
  rationale: パウロとペテロに託された務めの対応関係を明確に表した。
- source_word: Πέτρος
  choice: ペテロ
  rationale: 日本語聖書で広く定着した人名表記を採用した。
- source_word: τῆς περιτομῆς
  choice: 割礼を受けている人々のための
  rationale: τῆς ἀκροβυστίαςとの対句を保ち、契約的・民族的指標である割礼という原文の表現を維持した。
- source_word: Πέτρος τῆς περιτομῆς（省略）
  choice: 福音をペテロが委ねられている
  rationale: ギリシア語では先行句の「福音を委ねられている」が省略されるが、日本語で比較関係を明瞭にするため補った。
theological_decisions:
- issue: ἀκροβυστία／περιτομήを民族名で訳すか、原文の契約的指標を保つか
  choice: 「割礼を受けていない人々」／「割礼を受けている人々」
  alternative: 「異邦人」／「ユダヤ人」、または「無割礼」／「割礼」
  rationale: 原文が用いる割礼の有無による呼称を保つことで、単なる民族名への置換を避け、パウロの表現が持つ契約的・社会的含意を残した。
- issue: 二種類の福音を意味するように読める属格表現の扱い
  choice: 同じ福音が異なる対象への宣教として委ねられたことが伝わるよう「人々のための福音」と訳す
  alternative: 字義的に「無割礼の福音」／「割礼の福音」とする
  rationale: 文脈と対称構文は福音の内容の相違より委ねられた対象の相違を示す。ただし原文の字義形は脚注で提示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「ところが、それどころか」で強い対照を表し、割礼に基づく原文の呼称は説明的ながら自然な形で保持した。脚注記号[a]は該当する対句全体の後に置いた。
