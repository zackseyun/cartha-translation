  text: μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: ja
  text: ただ、私たちが貧しい人々を心に留めることだけを求められました。これはまさに、私もそのことを行おうと熱心に努めたことです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: ただ
  rationale: 合意に添えられた唯一の要請を示す。現代日本語では「ただ」が簡潔で自然。
- source_word: τῶν πτωχῶν
  choice: 貧しい人々
  rationale: πτωχόςの通常の意味をそのまま表し、実際的な援助を必要とする人々を指す表現として明瞭。
- source_word: ἵνα μνημονεύωμεν
  choice: 心に留めてほしい
  rationale: ἵνα節が唯一の要請の内容を示すため、「とのことでした」と組み合わせて依頼として自然に表現した。「心に留める」は記憶だけでなく継続的な配慮を含み得る一方、具体的行為を過度に補わない。
- source_word: ὃ
  choice: これは
  rationale: 関係代名詞は直前の要請全体を受ける。日本語では文を分けて「これは」と受けるのが明瞭で自然。
- source_word: ἐσπούδασα
  choice: 熱心に行おうとしていた
  rationale: σπουδάζωが示す真剣な意欲と実行への努めを表す。単なる感情的な願望に弱めない。
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: まさに、私自身も…行おうとしていたこと
  rationale: αὐτὸ τοῦτοの強調を「まさに」で再現し、ποιῆσαιの実行性を「行う」で保持した。文脈上の主語の対照を自然に示すため「私自身も」とした。
theological_decisions:
- issue: 「貧しい人々を覚える」の含意
  choice: 「心に留める」とし、配慮の含みを保ちながら援助と明示しない
  alternative: 「貧しい人々を援助する」
  rationale: μνημονεύωの語義を越えて具体的行為に限定せず、それでも文脈上の実際的な関心を自然に感じさせるため。
- issue: 一人称複数から単数への移行
  choice: 要請では主語を明示せず、応答では「私自身も」とする
  alternative: 「私たちが…私が」
  rationale: ギリシア語のμνημονεύωμενは複数、ἐσπούδασαは単数。この移行を日本語で不自然にならない形で保った。
translation_notes:
  register: 明快な現代標準日本語。簡潔さと品位を保ち、原文の唯一の要請という焦点、複数形から単数形への移行、αὐτὸ τοῦτοの強調を自然な日本語で再現した。
