  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: ja
  text: というのも、私は律法によって律法に対して死にました。それは、神に対して生きるためです。私はメシアとともに十字架につけられています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: というのも
  rationale: 直前の主張を根拠づける説明の接続を、現代日本語で自然に示す。
- source_word: διὰ νόμου
  choice: 律法によって
  rationale: 属格を伴う διά の手段的な意味を保つ。文脈上の νόμος はモーセの律法を指すため、「律法」とした。
- source_word: νόμῳ
  choice: 律法に対して
  rationale: 与格が表す関係の断絶を、日本語で過度に説明せず簡潔に表す。
- source_word: ἀπέθανον
  choice: 死にました
  rationale: アオリストが示す決定的な出来事を単純な過去として表した。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 目的を明確かつ自然な日本語で示す。
- source_word: θεῷ ζήσω
  choice: 神に対して生きる
  rationale: 「神のために」と用途的に狭めず、与格の関係的・方向的な含みを保つ。
- source_word: Χριστῷ
  choice: メシア
  rationale: ここでは称号としての意味を保ち、「メシア」と訳す。
- source_word: συνεσταύρωμαι
  choice: ともに十字架につけられたのです
  rationale: 共同行為を表す σύν と受動態を明示し、完了形の結果が現在に及ぶ含みを文脈上自然な「のです」で受ける。
theological_decisions:
- issue: 律法によって律法に対して死んだ、という表現を解釈的に補うか
  choice: 簡潔な「律法によって律法に対して死にました」を維持する。
  alternative: 「律法の宣告によって律法の支配に対して死にました」などと展開する。
  rationale: 原文は意図的に簡潔で神学的緊張を含む。律法のどの働きを指すかを本文で限定せず、原文の曖昧さを保つ。
- issue: συνεσταύρωμαι の完了形をどう表すか
  choice: 「十字架につけられたのです」とし、過去の出来事を述べつつ現在とのつながりを文脈に残す。
  alternative: 「十字架につけられています」として継続状態を前面に出す。
  rationale: 後者は十字架刑そのものが継続中であるかのようにも響くため避け、完了形を日本語として自然に表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの簡潔で論証的な調子を保った。「律法によって律法に対して」という反復も、原文の緊張を損なわないよう維持した。
