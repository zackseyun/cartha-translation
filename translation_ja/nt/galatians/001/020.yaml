  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: ja
  text: 私があなたがたに書いていることについては、見よ、神の御前で、私は偽っていません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ δὲ γράφω ὑμῖν
  choice: あなたがたに書いているこのことについて
  rationale: ἃは直訳すれば複数形の「事柄」だが、ここではパウロが今書いている内容をまとめて指すため、自然な日本語として「このこと」とした。δέは強い逆接ではなく軽い移行であり、独立した接続語を置かず「について」の構文に吸収した。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を促し、続く神の御前での厳粛な断言を強調する語。現代日本語ではやや文語的だが、聖書本文として明瞭であり、原文の明示的な強調を保持する。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の御前で
  rationale: 神の臨在と神に対する責任を意識した厳粛な訴えを簡潔に表す。原文以上に正式な誓いとは断定しない。
- source_word: ὅτι οὐ ψεύδομαι
  choice: 言います。私は偽りを言っていません
  rationale: ὅτιが導く断言内容を、日本語では「言います」と文を区切って自然に示した。ψεύδομαιは現在形の直接的な否定として訳した。
theological_decisions:
- issue: 神を前にしたパウロの主張の強さ
  choice: 「神の御前で言います」として、神に対する責任を伴う厳粛な断言を表した。
  alternative: 単なる強調として「本当に」などと意訳する、または正式な誓約表現にする。
  rationale: ἐνώπιον τοῦ θεοῦには神の臨在のもとで真実を主張する力があるが、原文は明示的な誓いの定型句までは用いていないため、その緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、ἰδοὺの厳粛な強調を保つため「見よ」を用いた。「御前」は神の臨在と法廷的な響きを簡潔に伝える、品位ある聖書語として採用した。
