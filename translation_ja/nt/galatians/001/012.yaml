source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: ja
  text: というのも、私はそれを人間から受けたのでも、人に教えられたのでもなく、イエス・キリストの啓示[a]によって受けたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・キリストから与えられた啓示によって」とも、「イエス・キリストについての啓示によって」とも理解できます。
    reason: 原文の属格が、啓示の源を示すのか、啓示の内容・対象を示すのか、文法的に両義的であるため。
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: 人間から
  rationale: 単数形のἄνθρωποςを総称的に捉え、特定の一人ではなく、人間を源とする伝達全般を否定する意味を自然な日本語で表した。
- source_word: παρέλαβον
  choice: 受けた
  rationale: 教えや伝承を受け取るという文脈に適した基本的な意味を保ち、福音が人間から伝えられたものではないという対比を明確にした。
- source_word: ἐδιδάχθην
  choice: 人に教えられた
  rationale: 受動態をそのまま保ちつつ、日本語では教える主体を補うことで、人間による教授と啓示との対比を自然に示した。
- source_word: δι’ ἀποκαλύψεως
  choice: 啓示によって
  rationale: διάが示す手段を「によって」で表し、ἀποκάλυψιςの宗教的・神学的意味を一般的な訳語「啓示」で保持した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリストの
  rationale: 属格を「の」と訳し、啓示の発信者を指す可能性と、啓示の内容・対象を指す可能性の双方を本文で保持した。Χριστόςは日本語で定着した称号表現「キリスト」とした。
theological_decisions:
- issue: ἀποκαλύψεως Ἰησοῦ Χριστοῦにおける属格の意味
  choice: 「イエス・キリストの啓示」として属格の曖昧さを保持
  alternative: 「イエス・キリストからの啓示」または「イエス・キリストについての啓示」
  rationale: ギリシア語は、イエス・キリストが啓示を与える主体・源である読みと、イエス・キリストが啓示の内容・対象である読みの両方を許す。日本語の「の」も同様の幅を持つため、本文では一方に限定せず、脚注で両義を明示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、議論の論理を示す「というのも」と丁寧体で品位を保った。末尾の「受けた」はギリシア語で省略されている動詞を日本語として自然になるよう補った。
