id: GAL.1.18
reference: Galatians 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: ja
  text: それから三年後、私はケファ[b]を訪ねるために[a]エルサレムへ上り、彼のもとに十五日間滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「訪ねる」と訳したギリシア語には、直接会って個人的に知り合う、という意味合いもあり得る。
    reason: lexical_alternative
  - marker: b
    text: ケファは、ペトロのアラム語名。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔπειτα
  choice: それから
  rationale: パウロが述べる出来事の順序を示す語として、自然な現代日本語で物語の流れを保つ。
- source_word: μετὰ ἔτη τρία
  choice: 三年後
  rationale: 経過した期間を簡潔かつ自然に表し、「三年の後」という原文の時間表現を保持する。
- source_word: ἀνῆλθον
  choice: 上り
  rationale: エルサレムへの移動に用いられる「上る」という方向性を、日本語でも不自然にならない形で残す。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 日本語で定着している標準的な地名表記。
- source_word: ἱστορῆσαι
  choice: 訪ねるために
  rationale: 個人的に会う訪問を自然に表す。単なる訪問以上に「直接会って知り合う」という含みもあり得るため、その語義は脚注に示す。
- source_word: Κηφᾶν
  choice: ケファ
  rationale: 原文が用いるアラム語系の名を保ち、「ペトロ」へ同化させない。人物の同定は脚注で示す。
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: 彼のもとに滞在した
  rationale: ケファと共に一定期間とどまったことを、明瞭で自然な日本語にする。宿泊場所について原文以上に限定しないよう「家に泊まった」とはしない。
- source_word: ἡμέρας δεκαπέντε
  choice: 十五日間
  rationale: 対格が表す継続期間を、日本語で明示的かつ自然に表現する。
theological_decisions:
- issue: ケファとペトロの名の扱い
  choice: 本文では原文どおり「ケファ」とし、脚注でペトロのアラム語名であることを示す。
  alternative: 本文を「ペトロ」とする。
  rationale: 人物の同一性を読者に知らせつつ、パウロがこの箇所で実際に選んだ名を保持し、他の呼称へ調和させない。
translation_notes:
  register: 明瞭で自然な現代標準日本語の常体を用いた。文章の品位を保ちながら、過度に文語的な表現を避けた。
