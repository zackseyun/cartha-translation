  text: しかし私は、ユダヤにあるメシアに属する諸教会には、顔を知られていませんでした。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「顔について知られていませんでした」。または「直接には知られていませんでした」「面識がありませんでした」。
