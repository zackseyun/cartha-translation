    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節からの穏やかな対比と話の展開を示す。
- source_word: ἤμην … ἀγνοούμενος
  choice: 知られていませんでした
  rationale: 未完了形と現在分詞の迂言的構文を、当時継続していた状態として自然な日本語で表した。
- source_word: τῷ προσώπῳ
  choice: 顔を
  rationale: 個人的・対面的な面識がなかったという慣用的意味を保ちつつ、原文の「顔」の像も残した。
- source_word: ταῖς ἐκκλησίαις
  choice: 諸教会
  rationale: 複数のキリスト者共同体を指すため、現代日本語で定着した「教会」を用いた。
- source_word: τῆς Ἰουδαίας
  choice: ユダヤにある
  rationale: 諸教会の所在地を示す属格を自然な日本語にした。
- source_word: ταῖς ἐν Χριστῷ
  choice: メシアに結ばれた
  rationale: ἐν Χριστῷが諸教会とメシアとの所属・結合関係を示すことを、理解しやすい日本語で表した。Χριστόςの称号性は「メシア」で保った。
theological_decisions:
- issue: ἐν Χριστῷの訳し方
  choice: メシアに結ばれた
  alternative: メシアにある／キリストにある
  rationale: 直訳的な「メシアにある」が持つ関係性を明示しつつ、単なる所在地のように誤解されないよう「結ばれた」とした。特定の結合様式までは限定しない。
- issue: Χριστόςの称号性
  choice: メシア
  alternative: キリスト
  rationale: ここでは共同体を特徴づける称号としての響きが保たれているため、「油注がれた者」という称号性を示す「メシア」を採用した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「顔を知られていませんでした」により原文の身体的比喩を残し、「メシアに結ばれた」でἐν Χριστῷの関係的意味を自然に示した。
