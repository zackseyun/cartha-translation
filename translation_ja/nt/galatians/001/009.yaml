revisions:
- from: 以前にも言ったとおり、今もう一度言います。あなたがたが受け入れた福音とは異なる福音を、だれかがあなたがたに告げ知らせるなら、その者は呪われよ。[a]
  to: 私たちが以前に言ったとおり、今、私はもう一度言います。あなたがたが受け取った福音に反する福音を、だれかがあなたがたに告げ知らせるなら、その者は呪われよ。[a]
  rationale: 原文にある「私たちが以前に言った」と「今、私は言う」の数の違いを反映し、παρ’ ὃを文脈上の対立を表す「反する」とした。また、παρελάβετεを「受け取った」として、伝承された福音の受領という語義を保った。脚注のアンカーはἀνάθεμα ἔστωに対応しており、そのまま維持できる。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:14Z'
review_pass:
  verdict: revise
  source_fidelity: 冒頭のὡς προειρήκαμενは複数形（「私たちが前に言った」）であり、続くλέγωは単数形（「私は言う」）です。草案はこの数の対比を省略しています。また、παρ’ ὃはこの文脈では単に「異なる」よりも、受け取った内容からの逸脱・対立を表す「反する」が適切です。παρελάβετεには「受け入れた」より「受け取った」のほうが、伝承・福音を受領する語として原文により近く、信仰上の応答を余分に含意しません。
  naturalness: 改訂文は明快な現代標準語を保ちます。「呪われよ」は厳粛な宣告として自然であり、ἀνάθεμα ἔστωの強さを保てます。前半を「私たち」「私は」と明示しても、日本語として不自然ではありません。
  terminology: 「福音」「受け取った」「呪われよ」は、本文の語調と新約文脈に適しています。「反する福音」は、παρ’ ὃの敵対的・逸脱的な力を「異なる福音」より明瞭に伝えます。
  issues:
  - severity: medium
    issue: 原文の複数形から単数形への移行が訳文で失われている。
    rationale: ὡς προειρήκαμενは「私たちが前に言った」であるのに対し、ἄρτι πάλιν λέγωは「今、私は再び言う」です。この文法上の対比は訳文でも保持でき、曖昧にする必要はありません。
  - severity: medium
    issue: 「とは異なる福音」はπαρ’ ὃの対立・逸脱の力を弱めうる。
    rationale: παράはこの警告の文脈で、受け取った福音に対する単なる相違ではなく、それに反する逸脱を示す。「反する福音」がより忠実です。
  - severity: low
    issue: 「受け入れた」はπαρελάβετεに信仰的な受容の含みを加えうる。
    rationale: παραλαμβάνωはここでは伝えられた福音を「受け取る」ことを指すため、「受け取った」がより直接的で、原文の表現を保てます。
  revised_text: 私たちが以前に言ったとおり、今、私はもう一度言います。あなたがたが受け取った福音に反する福音を、だれかがあなたがたに告げ知らせるなら、その者は呪われよ。[a]
  revised_footnotes:
