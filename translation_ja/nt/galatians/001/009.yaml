id: GAL.1.9
reference: Galatians 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: ja
  text: 私たちが以前に言ったとおり、今、私はもう一度言います。あなたがたが受け取った福音に反する福音を、だれかがあなたがたに告げ知らせるなら、その者は呪われよ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その者は呪いのもとにあれ」。ギリシア語は「アナテマであれ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: 以前にも言ったとおり
  rationale: すでに述べた事柄を指す表現であり、その発言が今も効力を持つ文脈を、自然な現代日本語で表した。
- source_word: ἄρτι πάλιν λέγω
  choice: 今もう一度言います
  rationale: ἄρτιの現在性とπάλινの反復をともに明確に保った。
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: だれかがあなたがたに告げ知らせるなら
  rationale: 動詞εὐαγγελίζομαιの『良い知らせを告げる』という宣教的な動作を表し、目的語の内容は後続する『異なる福音』によって明示した。
- source_word: παρ’ ὃ
  choice: とは異なる
  rationale: παράが示す、受け取った福音からの逸脱を明瞭に表しつつ、『反する』『それを越える』という含みを一方に限定しすぎない表現とした。
- source_word: παρελάβετε
  choice: 受け入れた
  rationale: 伝えられた福音を受領したことを表す。日本語では単なる物品の受け取りと誤解されにくく、メッセージの受容として自然である。
- source_word: ἀνάθεμα ἔστω
  choice: その者は呪われよ
  rationale: 神学的な主体を本文以上に補わず、厳粛な呪いの宣告という強い力を簡潔に保持した。
theological_decisions:
- issue: ἀνάθεμα ἔστωにおける断罪の力と呪いの主体
  choice: その者は呪われよ
  alternative: その者は神の呪いを受けよ／その者はアナテマとなれ
  rationale: 原文の厳しい宣告を弱めずに伝える一方、原文がここで明示していない『神の』を本文へ補わず、一般読者に不透明な音写も避けた。
- issue: παρ’ ὃが表す福音からの逸脱
  choice: あなたがたが受け入れた福音とは異なる福音
  alternative: 受け入れた福音に反する福音／受け入れた福音を越える福音
  rationale: 受領した福音を規準とする逸脱を示しながら、『反する』か『越える』かに意味を狭めすぎないようにした。
translation_notes:
  register: 明快な現代標準語を用いながら、パウロの反復と厳粛な警告の調子を保った。「言う」には丁寧体を用い、宣告部分は簡潔で強い文語的命令形「呪われよ」とした。
