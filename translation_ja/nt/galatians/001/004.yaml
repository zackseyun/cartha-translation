base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: ja
  text: 私たちの罪のためにご自身をささげられた方。私たちを今の悪い時代[a]から救い出すために、私たちの神であり父である方のみこころに従って。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今の悪い世界」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δόντος ἑαυτὸν
  choice: ご自分を献げ
  rationale: δίδωμιの基本義「与える」と自発性を保ちつつ、再帰代名詞を伴う犠牲的文脈に自然な日本語とした。「引き渡す」ほど受動的な含みを加えない。
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: 私たちの罪のために
  rationale: ὑπέρの代理的・贖罪的な重みを保ちながら、贖罪の仕組みを本文以上に限定しない。ἁμαρτιῶνの複数形は、日本語で集合的に自然な「罪」とした。
- source_word: ὅπως ἐξέληται ἡμᾶς
  choice: 私たちを救い出してくださった
  rationale: ἐξαιρέωが表す、支配的・危険な状況から取り出す意味を「救い出す」で明示した。ὅπωςを伴う目的は、日本語では前後の動作の連なりによって自然に示した。敬意を表す補助動詞は文脈に即した日本語上の処理である。
- source_word: ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: 今の悪い時代から
  rationale: αἰώνの時間的・宇宙論的な意味を「時代」で表し、物理的な「世界」に限定しない。ἐνεστῶτοςは自然な「今の」、πονηροῦは平明な「悪い」とした。
- source_word: κατὰ τὸ θέλημα
  choice: みこころに従って
  rationale: 神の意志・目的との一致を示すκατάを自然で格調ある日本語にした。「御旨」より現代の一般読者に理解しやすい。
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: 私たちの神であり父である方
  rationale: 一人の方が「神」と「父」の双方であるというギリシア語の単一指示対象を明確にしつつ、両称号を保持した。
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶνが示す贖罪の意味をどこまで特定するか
  choice: 私たちの罪のために
  alternative: 私たちの罪に代わって／私たちの罪のゆえに
  rationale: 贖罪的・代理的な含意を失わず、特定の贖罪論や因果関係だけに狭めない。
- issue: αἰώνを「時代」とするか「世界」とするか
  choice: 今の悪い時代
  alternative: 今の悪い世界
  rationale: αἰώνの第一義的な時間的・宇宙論的側面を優先した。「世界」も文脈上可能な伝統的表現なので脚注に残した。
- issue: ὅπωςの目的表現を日本語でどう示すか
  choice: 「ご自分を献げ、…救い出してくださった」と動作の目的的連関を自然に表す
  alternative: 「…救い出すために、ご自分を献げ」
  rationale: 原文順序を比較的保ちながら日本語として読みやすくした。ただし目的関係をより明示する訳も可能である。
translation_notes:
  register: 現代標準日本語による、平明でありながら礼拝朗読にも耐える文体。「献げる」「みこころ」で尊厳を保ち、過度に古風な語を避けた。前後の節と続く属格関係の断片だが、提示された一節単独でも読めるよう二文目を補足的に整えた。
