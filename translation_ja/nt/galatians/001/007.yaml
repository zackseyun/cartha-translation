id: GAL.1.7
reference: Galatians 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: ja
  text: それは別の福音ではありません。ただ、あなたがたをかき乱し、メシア[a]の福音をゆがめようとしている者たちがいるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」はギリシア語「クリストス」に当たり、一般に「キリスト」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: 別の福音
  rationale: ἄλλοには名詞が明示されていないが、直前の1章6節から「福音」が補われる。日本語で指示対象を明確にするため「別の福音」とした。
- source_word: εἰ μή
  choice: ただ
  rationale: ここでは厳密な条件ではなく、先の否定に説明的な限定を加える。現代日本語として自然な「ただ」で表した。
- source_word: ταράσσοντες
  choice: かき乱し
  rationale: 単に心配させるだけでなく、共同体を動揺・混乱させる含みを保つ表現とした。
- source_word: θέλοντες
  choice: ようとしている
  rationale: 意図を表す現在分詞の力を、行為への企てを自然に示す「ようとしている」で表した。
- source_word: μεταστρέψαι
  choice: ゆがめる
  rationale: 福音を別物へ変質させる否定的な意味を、明瞭で現代的な「ゆがめる」で表した。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡における確立した用語であり、文脈上の専門的な意味を保つ。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは属格句の中でも称号としての意味が保たれているため、「メシア」とした。一般的な訳語「キリスト」は脚注に示した。
theological_decisions:
- issue: Χριστοῦを称号として訳すか、固有名に近い形で訳すか
  choice: メシア
  alternative: キリスト
  rationale: 「福音」との属格関係は、メシアに属する福音、またはメシアについての福音という幅を持つ。称号の背景を明示しつつ、この属格の曖昧さは解消しない訳とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「それ」は前節の「福音」を受ける。「ただ」によって、パウロが別の福音の存在を認めているのではなく、人々が福音をゆがめようとしているという説明的限定を自然に示した。
