  source_fidelity: 原文のὃ οὐκ ἔστιν ἄλλοを、前節から補われる「福音」を明示して「それは別の福音ではありません」としたのは適切です。εἰ μήの説明的・例外的な働きも「ただ」で自然に表され、ταράσσοντες、θέλοντες、μεταστρέψαιもそれぞれ「かき乱し」「ゆがめようとしている」「ゆがめる」によって十分に反映されています。τοῦ Χριστοῦは「メシアの」とし、属格が持つ「メシアに属する／メシアに関する」という幅を不必要に限定していません。
