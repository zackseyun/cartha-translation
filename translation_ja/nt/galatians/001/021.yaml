lexical_decisions:
- source_word: ἔπειτα
  choice: その後
  rationale: パウロの叙述における時間的な順序を、自然な現代日本語で示す。
- source_word: ἦλθον
  choice: 行きました
  rationale: 字義的には「来ました」とも訳せるが、直前の場所から別の地域への移動を語る日本語の叙述では「行きました」が自然である。
- source_word: εἰς
  choice: に
  rationale: 目的地への方向を表す。日本語では「諸地方に行く」が自然であり、到達・進入の意味も文脈上保たれる。
- source_word: κλίματα
  choice: 諸地方
  rationale: 単一の都市ではなく、複数の地理的区域を指す中性複数形であることを表す。
- source_word: Συρίας
  choice: シリア
  rationale: 地名の標準的な日本語表記。
- source_word: Κιλικίας
  choice: キリキア
  rationale: 地名の標準的な日本語表記。
