id: GAL.1.13
reference: Galatians 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: ja
  text: あなたがたは、私が以前、ユダヤ教の中で送っていた生活ぶり[a]について聞いたことがあります。私は度を越して[b]神の教会を迫害し、荒らし回っていました[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「以前の私の行状」または「以前の私の生き方」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「並外れたほどに」または「甚だしく」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「滅ぼしていた」または「滅ぼそうとしていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: かつて…どのように生きていたか
  rationale: ἀναστροφήは行動の一面だけでなく生活態度・生き方全般を表し、ποτεはそれが以前のことであると示す。現代日本語として自然な形で両者を表した。
- source_word: ἐν τῷ Ἰουδαϊσμῷ
  choice: ユダヤ教の中で
  rationale: Ἰουδαϊσμόςはここで、パウロが以前属して実践していたユダヤ教的な宗教生活を指す。「の中で」により、単なる知識ではなく、その枠内での生活であったことを示した。
- source_word: καθ’ ὑπερβολὴν
  choice: 度を越して
  rationale: 迫害の程度が並外れていたことを強く表す句であり、明快で自然な日本語を選んだ。
- source_word: ἐδίωκον
  choice: 迫害し
  rationale: 未完了過去形が示す継続的・反復的な過去の行為は、後続する「していた」によって文全体として表した。
- source_word: τὴν ἐκκλησίαν τοῦ θεοῦ
  choice: 神の教会
  rationale: ἐκκλησίαは神に属するキリスト信仰者の共同体を指す。日本語で定着し、文脈に適した「教会」とした。
- source_word: ἐπόρθουν
  choice: 滅ぼそうとしていた
  rationale: この動詞は荒廃させる、壊滅させるという強い意味を持つ。対象である共同体を実際に完全消滅させたとは必ずしも断定せず、継続的にその壊滅を図っていたことを自然に表した。
theological_decisions:
- issue: ἐκκλησίαを「教会」とするか「集会」とするか
  choice: 神の教会
  alternative: 神の集会
  rationale: ここではパウロが迫害した神に属する信仰共同体を指す。「教会」は現代日本語でその指示対象を最も明瞭に伝え、特定の制度的教会観を余分に付け加えるものではない。
- issue: ἐπόρθουνを達成された破壊とするか、破壊の企てとするか
  choice: 滅ぼそうとしていた
  alternative: 荒らし回っていた／滅ぼしていた
  rationale: 語の強烈さを保ちつつ、未完了過去形と現実には共同体が存続したことに適合する表現を採った。ただし「荒廃させていた」という結果的ニュアンスも語義上可能なため脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、告白の厳粛さと原文の強い語調を保った。「あなたがたは…聞いています」は既知の事実を示す完了的な意味合いを自然に表し、「のです」で後半が聞いた内容の説明であることを明示した。
