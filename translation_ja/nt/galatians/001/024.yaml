  text: καὶ ἐδόξαζον ἐν ἐμοὶ τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: ja
  text: そして人々は、私のことで神をあがめていました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私にあって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前から続く語りを自然につなぐ、標準的な接続表現。
- source_word: ἐδόξαζον
  choice: あがめていました
  rationale: δοξάζωの「栄光を帰する、たたえる」という意味を表し、未完了過去の継続的・反復的なニュアンスも自然に伝える。
- source_word: ἐν ἐμοὶ
  choice: 私のことで
  rationale: ここでは、パウロに関して起きたことを理由として神をあがめた、という因果的・関連的意味を自然な日本語で表す。字義的な「私にあって」は脚注に残す。
- source_word: τὸν θεόν
  choice: 神を
  rationale: ἐδόξαζονの直接目的語であり、標準的かつ文脈に即した訳。
theological_decisions:
- issue: ἐν ἐμοὶの意味
  choice: 因果的・関連的な「私のことで」
  alternative: 字義的・領域的な「私にあって」
  rationale: 直前の文脈では、諸教会がパウロの回心と宣教について聞き、それに応答して神をあがめている。「私のことで」はこの関係を明瞭に伝えつつ、原文のより字義的な可能性を脚注で保持する。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「あがめていました」により未完了過去の継続性を表現した。
