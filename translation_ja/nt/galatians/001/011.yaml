source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: ja
  text: 兄弟たち[a]、あなたがたに知らせます。私が告げ知らせた福音は、人間に由来するものではありません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ここでは信仰共同体の女性を含む呼びかけであり得る。別訳「兄弟姉妹たち」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「人間に従ったものではありません」。この句は「人間の基準によるものではない」という意味にも取り得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω γὰρ ὑμῖν
  choice: あなたがたに知っておいてほしいのです
  rationale: Γνωρίζω ὑμῖνは直訳すれば「あなたがたに知らせます」だが、ここでは重要な説明を導入する定型的な表現。「知っておいてほしい」は現代日本語として自然にその談話機能を伝え、文末の「のです」でγάρの説明的なつながりも表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 語の男性複数形を保った簡潔で定着した呼びかけ。パウロの共同体への呼びかけでは女性を含み得るため、その点を脚注に示した。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡における定着した用語であり、「良い知らせ」よりもここでの神学的・宣教的な意味を簡潔に伝える。
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: 私が告げ知らせた
  rationale: 受動分詞句を自然な日本語の能動表現に組み替えつつ、パウロ自身が公に福音を宣べ伝えたという意味を保持した。
- source_word: κατὰ ἄνθρωπον
  choice: 人間に由来するもの
  rationale: 直訳は「人間に従った／人間による」だが、次節で人から受けたのでも教えられたのでもないと説明されるため、ここでは起源を表す意味が文脈に最もよく合う。
theological_decisions:
- issue: κατὰ ἄνθρωπονが福音の起源を指すのか、人間的な基準・性質を指すのか
  choice: 人間に由来するものではありません
  alternative: 人間の基準によるものではありません／直訳「人間に従ったものではありません」
  rationale: 直後の1章12節が「人から受けたのでも、教えられたのでもない」と出所を否定しているため、起源を示す解釈を本文に採用した。ただし前置詞句には基準・性質を表す可能性もあるので脚注に残した。
- issue: ἀδελφοίの指示範囲
  choice: 本文では「兄弟たち」
  alternative: 「兄弟姉妹たち」
  rationale: 原語の文法上の形を本文に保ちながら、共同体全体、したがって女性をも含む呼びかけであり得ることを脚注で明示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、パウロの改まった説明口調を保った。「告げ知らせた」は「宣べ伝えた」より一般読者に理解しやすく、同時に公的な宣言の響きを残す。
