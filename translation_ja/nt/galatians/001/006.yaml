source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: ja
  text: あなたがたが、キリストの恵みのうちに招いてくださった方から、こんなにも早く別の福音へと移っていくことに、私は驚いています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリストの恵みによって」。前置詞は、領域または手段を表し得る。
    reason: alternative_reading
  - marker: b
    text: 「別の福音」は、「異なる福音」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: 私は驚いています
  rationale: パウロの驚きと憂慮を、明瞭で自然な現代日本語で表す。
- source_word: οὕτως ταχέως
  choice: こんなにも早く
  rationale: 移行の速さに対する強い驚きを自然に保持する。
- source_word: μετατίθεσθε
  choice: 離れ、…移っていく
  rationale: 現在形の進行的な離反と、ある方から別の福音へ向かう動きをともに表す。
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: あなたがたを…招いてくださった方
  rationale: 過去になされた召しを示しつつ、原文が明示しない召し手の特定を避ける。
- source_word: ἐν χάριτι Χριστοῦ
  choice: キリストの恵みのうちに
  rationale: ἐνの領域を表す可能性を保ち、属格関係を明示しすぎずに訳す。手段を表す可能性は脚注に示す。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: 日本語聖書で定着した称号表現であり、現代の一般読者にも通じる。
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: 別の福音へ
  rationale: εἰςの方向性とἕτερονの相違を簡潔に保持する。
theological_decisions:
- issue: 「招いてくださった方」の同定
  choice: 本文では神ともキリストとも明示しない
  alternative: 「神」または「キリスト」を補う
  rationale: ギリシャ語本文では召し手が明示されていないため、解釈上の特定を本文に持ち込まない。
- issue: ἐν χάριτι Χριστοῦにおけるἐνの意味
  choice: 「キリストの恵みのうちに」
  alternative: 「キリストの恵みによって」
  rationale: 領域と手段の両方が可能であるため、本文では比較的形式に近い表現を採り、代案を脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語。パウロの厳しい驚きを保ちながら、過度に古風な「召す」「離反する」は避けた。「招いてくださった方」に敬語を用い、暗黙の神的召し手への自然な敬意を示すが、その方を本文中で特定しない。
