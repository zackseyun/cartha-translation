reference: Galatians 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: ja
  text: しかし、ほかの使徒にはだれ一人会わず、ただ主の兄弟ヤコブには会いました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の区切り方では、「ほかの使徒にはだれ一人会いませんでした。ただ、主の兄弟ヤコブには会いました」とも読めます。この読みでは、ヤコブを「使徒」に含めないと理解されることもあります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: ほかの
  rationale: 属格複数「使徒たちの」とともに、「その中のほかの一人」を表すため、自然な日本語として「ほかの」とした。
- source_word: δέ
  choice: しかし
  rationale: 直前の叙述との穏やかな対比を示す接続として「しかし」が適切である。
- source_word: ἀποστόλων
  choice: 使徒
  rationale: パウロ書簡の文脈で認められた使徒を指すため、定着した訳語「使徒」を用いた。
- source_word: οὐκ εἶδον
  choice: だれにも会わず
  rationale: 人物に会ったことを述べる文脈では、日本語の「会う」が自然であり、否定の範囲も明確になる。
- source_word: εἰ μὴ
  choice: ただ…だけ
  rationale: 条件ではなく例外を導く用法であるため、日本語として自然な限定・例外表現にした。
- source_word: Ἰάκωβον
  choice: ヤコブ
  rationale: 日本語聖書で定着している人名表記を採用した。
- source_word: ἀδελφὸν
  choice: 兄弟
  rationale: 語の通常かつ直接的な親族上の意味を保ち、より広い「親族」などには弱めなかった。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: κύριοςを称号として「主」と訳し、自然な属格表現にした。
theological_decisions:
- issue: ヤコブが「使徒」に数えられているか
  choice: 本文は、ほかの使徒には会わず、例外としてヤコブに会ったという最も自然な統語関係を示す。
  alternative: ペトロ以外の使徒には会わず、使徒とは限らないヤコブには会った、と理解することもある。
  rationale: ギリシア語のεἰ μήは通常、直前の「ほかの使徒にはだれにも会わなかった」に対する例外を導く。ただし、ヤコブを使徒に分類しない解釈の余地も脚注で保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体ではなく丁寧体の文脈に調和する表現。「見る」の直訳より、人物との面会を表す自然な「会う」を採用した。原文の例外構文と、その解釈上の曖昧さを本文と脚注で保持した。
