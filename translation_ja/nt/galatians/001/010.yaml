id: GAL.1.10
reference: Galatians 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: ja
  text: というのも、今私は人を説得しようとしているのでしょうか。それとも神を説得しようとしているのでしょうか。[a] あるいは、私は人を喜ばせようとしているのでしょうか。もし今なお人を喜ばせているとしたら、私はメシアの奴隷ではないだろう。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今、私が得ようとしているのは、人の承認でしょうか、それとも神の承認でしょうか」。
    reason: lexical_alternative
  - marker: b
    text: 「奴隷」は「しもべ」とも訳せる。ここでは、メシアに全面的に属して仕える者という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: 今
  rationale: パウロの現在の立場を示し、以前のあり方との対比を含ませる、簡潔で自然な訳語。
- source_word: γὰρ
  choice: いったい
  rationale: 直前の議論を受ける接続的・説明的な働きを、独立した日本語の節として自然な修辞疑問の強調に反映した。
- source_word: πείθω
  choice: 説得しようとしている
  rationale: 「説得する、納得させる」という基本義を保つ。神を説得するという表現が生む意図的な修辞的緊張は本文に残し、「承認を得る」の可能性は脚注に示す。
- source_word: ἀνθρώπους
  choice: 人
  rationale: 男性だけでなく人間一般を指すため、包括的な「人」とした。
- source_word: θεόν
  choice: 神
  rationale: 修辞疑問において「人」と対照される直接目的語として標準的に訳した。
- source_word: ζητῶ
  choice: しようとしている
  rationale: 現在時制の継続的な志向を、現代日本語として自然に表す。
- source_word: ἀρέσκειν / ἤρεσκον
  choice: 人に喜ばれようとしている／人を喜ばせている
  rationale: ἀρέσκωの「喜ばせる、気に入られる」という対人的意味を保ち、同じ語根の反復も日本語でできる限り示した。
- source_word: εἰ ἔτι
  choice: もし私が今なお
  rationale: 反実仮想的な条件と、以前から続く状態を示すἔτιの意味を表す。
- source_word: Χριστοῦ
  choice: メシアの
  rationale: Χριστόςの称号としての意味を明示し、単なる固有名のように扱わない。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 人の歓心を買うことと対照される、メシアへの全面的な帰属と拘束を強く表す語として、δοῦλοςの力を保持する。
theological_decisions:
- issue: πείθωの修辞的意味
  choice: 本文では「説得しようとしている」
  alternative: 「承認を得ようとしている」「味方につけようとしている」
  rationale: 「神を説得する」は異例だが、原文の語彙と修辞的な衝撃を保つ。文脈上の「承認を得る」という理解も排除せず脚注に示した。
- issue: Χριστοῦ δοῦλοςの訳
  choice: メシアの奴隷
  alternative: キリストのしもべ／メシアに仕える者
  rationale: Χριστόςの称号性と、δοῦλοςが表す所有・全面的忠誠の強さの双方を保持する。より穏当な「しもべ」は可能だが、原語の社会的・関係的な力を弱める。
- issue: 条件文の反実仮想性
  choice: 「もし……なら、……ではないでしょう」
  alternative: 「もし……していたなら、……ではなかったでしょう」
  rationale: 過去だけの仮定ではなく、現在の身分と忠誠をめぐる反実仮想として自然な日本語にした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、連続する修辞疑問の勢いを保った。「いったい」で冒頭の問いを自然に導き、「でしょうか」を反復して厳粛さと読みやすさを両立させた。「奴隷」は強い語だが、本文の忠誠と帰属の対比に必要なため保持し、脚注で説明した。
