  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: ja
  text: ただ、「かつて私たちを迫害していた者が、以前は滅ぼそうとしていたその信仰を、今は宣べ伝えている」と聞いているだけでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: ただ…だけでした
  rationale: 彼らの知識がこの報告を聞くことに限られていた、という限定を自然な日本語で示す。
- source_word: ἀκούοντες ἦσαν
  choice: 聞いていただけでした
  rationale: 迂言的未完了形が表す継続的・反復的な伝聞を、日本語の文脈に自然な過去継続の表現で示す。
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: 以前、私たちを迫害していた者
  rationale: 冠詞付き分詞を人物を特定する描写として訳し、ποτεを「以前」で表す。
- source_word: νῦν εὐαγγελίζεται
  choice: 今は福音として告げ知らせている
  rationale: εὐαγγελίζεταιの福音宣教を表す語感を保ちつつ、目的語「信仰」と自然につなげる。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: 定冠詞付きのπίστιςはここでは主観的な信頼行為より、信じられ宣べ伝えられるキリスト教信仰・その内容を指すと考えられるため、原語の表現を保つ。
- source_word: ἣν ποτε ἐπόρθει
  choice: かつて滅ぼそうとしていた
  rationale: πορθέωの破壊・荒廃させる意味と敵対的意図を、明瞭で自然な日本語にする。
theological_decisions:
- issue: τὴν πίστινの意味
  choice: パウロが今宣べ伝えているキリスト教信仰、またはその信仰内容
  alternative: 信じるという行為、または「福音」
  rationale: 迫害していた対象と現在宣べ伝える対象が対照されており、定冠詞も伴うため、内面的な信頼行為より客観的な信仰内容を指す可能性が高い。ただし訳文は「信仰」として原文の幅を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、「告げ知らせる」でεὐαγγελίζεταιの宣教的含意を表した。引用内の時間対照「以前／今」「かつて」を保持し、簡潔ながら格調ある文体とした。
