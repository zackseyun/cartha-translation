lexical_decisions:
- source_word: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: また、私とともにいるすべての兄弟たちから
  rationale: καὶは前節の差出人パウロに共同差出人を加える接続として「また」とした。ἀδελφοίは文法上の男性複数を保って「兄弟たち」とし、σὺν ἐμοίは自然な日本語で「私とともにいる」とした。日本語の書簡形式を明確にするため、与格の宛先と対になる「から」を補った。
- source_word: ἐκκλησίαις
  choice: 諸教会
  rationale: 複数形を明示しつつ、パウロ書簡における信徒共同体の標準的な呼称として「諸教会」とした。
- source_word: τῆς Γαλατίας
  choice: ガラテヤの
  rationale: 属格を素直に「ガラテヤの」と表し、地域に属する複数の教会を指す構造を保った。
theological_decisions:
- issue: ἀδελφοίが指す範囲
  choice: 本文では「兄弟たち」
  alternative: 「兄弟姉妹たち」または「信徒たち」
  rationale: 原語の男性複数形を本文で保持する。一方、初期キリスト教共同体で男女双方を含み得る語用上の可能性はあるが、この節の実際の構成員は特定できないため、本文で範囲を断定しない。
translation_notes:
  register: 前節から続く書簡の差出人・宛先表現として、明快で格調を保った現代標準日本語を用いた。「諸教会」により複数形を簡潔に示した。
