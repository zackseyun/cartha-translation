  text: to whom be the glory forever and ever. Amen.
translation:
  language: ja
  text: この方に、世々限りなく栄光がありますように。アーメン。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: この方に
  rationale: 関係代名詞は直前の「私たちの神であり父である方」を受ける。日本語では指示内容を明確にしつつ自然な頌栄となる「この方に」とした。
- source_word: δόξα
  choice: 栄光
  rationale: 頌栄における語の意味と聖書語としての定着を保ち、「賛美」「誉れ」より原語の意味範囲を広く伝える。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 終わりのない持続を表す定型的な強意表現を、荘重さを保ちながら日本語として簡潔に表す。
- source_word: ἀμήν
  choice: アーメン
  rationale: 頌栄を締めくくる厳粛な同意・確証の語として、聖書で定着した音訳を用いる。
theological_decisions:
- issue: 動詞のない頌栄句の表現
  choice: 栄光が…ありますように
  alternative: 栄光は…のものです／栄光が…ある
  rationale: ギリシア語には定動詞がなく、帰属の断定とも祈願とも理解できる。日本語では伝統的な頌栄の祈願的な響きを自然に表しつつ、神に栄光が帰される意味を保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、頌栄にふさわしい簡潔さと品位を保った。「世々限りなく」はやや文語的だが、一般に理解可能で、原文の定型表現の荘重さをよく伝える。
