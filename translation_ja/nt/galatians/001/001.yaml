id: GAL.1.1
reference: Galatians 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: ja
  text: 使徒パウロは、人々を起源とするのでも、一人の人を介するのでもなく、メシアであるイエス[a]と、このイエスを死者の中から復活させた父なる神とによって任命されました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエス・キリスト」。
    reason: Χριστόςは「メシア」という称号としても、定着した「キリスト」という形でも訳せるため。
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: パウロの委任された職務を示す定着した称号であり、単なる「使者」よりも原文の公的・神学的な重みを保つ。
- source_word: ἀπ’ ἀνθρώπων
  choice: 人々から
  rationale: 属格を伴うἀπόが示す起源を表し、後続する単数の「一人の人」との対照も保つ。
- source_word: δι’ ἀνθρώπου
  choice: 一人の人を通して
  rationale: 属格を伴うδιάが示す媒介・手段を表し、直前の複数形との修辞的な対照が分かるよう単数性を明示する。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: メシアであるイエスによって
  rationale: διάの媒介・作用の意味を保ち、Χριστόςを称号として明確に表す。日本語として自然になるよう「メシアであるイエス」とした。
- source_word: θεοῦ πατρὸς
  choice: 父なる神
  rationale: 日本語聖書で定着し、かつ現代語として簡潔な称号表現である。イエスと父なる神が同じδιάに支配される並列構造は「とによって」で示した。
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: このイエスを死者の中から復活させた
  rationale: 分詞句が父なる神を修飾する構造を保つ。日本語で代名詞の指示が曖昧にならないようαὐτόνの指示対象を「このイエス」と明示し、ἐκ νεκρῶνは「死者の中から」と訳した。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστοῦの訳
  choice: メシアであるイエス
  alternative: イエス・キリスト
  rationale: ここではΧριστόςの称号性を読者に伝えるため「メシア」を本文に置いた。ただし、日本語で定着した音訳も正当な訳であるため脚注に示した。
- issue: 使徒職の起源と媒介を表す省略構文
  choice: 使徒とされた者です
  alternative: 使徒パウロ――人々からでも、一人の人を通してでもなく……
  rationale: 原文は「使徒」に否定句とδιά句を直接続ける圧縮された構文である。日本語で関係を明瞭にするため、委任の意味を文脈上補って述語化したが、人間ではなくイエスと父なる神によるという対照は保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、書簡冒頭にふさわしい荘重さを保った。原文の複数「人々」と単数「人」の対照、またイエスと父なる神を並列する構造が伝わるようにした。
