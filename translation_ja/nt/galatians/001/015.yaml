  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: ja
  text: しかし、母の胎内にいた時から私を取り分け、恵みによって召してくださった方が、よしとされたとき、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「生まれたときから」。エレミヤ1章5節、イザヤ49章1節にある預言者の召命を述べる表現を参照。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: しかし、…時
  rationale: ὅτεの時を示す働きと、δέの穏やかな対照・展開を保つ。文が次節へ続くため、日本語でも未完の従属節として表した。
- source_word: εὐδόκησεν
  choice: 御心にかなって
  rationale: 神の好意ある意志・喜びを表す語義を保ち、単なる「決定した」に狭めない。後続する不定詞の内容へ自然につなぐ。
- source_word: ὁ ἀφορίσας με
  choice: 私を取り分け…くださった方
  rationale: 冠詞付き分詞を「方」として実体詞的に訳し、特定の予定論的用語を持ち込まず、神が目的のために別にしたという意味を保つ。
- source_word: ἐκ κοιλίας μητρός μου
  choice: 母の胎にいる時から
  rationale: 母の胎という具体的な比喩を残しつつ、ἐκが示す起点を自然な現代日本語で表す。「生まれた時から」という理解の可能性は注で示す。
- source_word: καλέσας
  choice: 召してくださった
  rationale: パウロ書簡における神の召しの含意を保つ。「くださった」により、主語が神であることにふさわしい自然で敬意ある日本語とした。
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: 恵みによって
  rationale: διά＋属格が示す媒介・手段を簡潔に表す。αὐτοῦは文脈上主語の神を指し、日本語では「その」を省く方が自然で誤解がない。
theological_decisions:
- issue: ἀφορίσαςを予定・選び・任命などの特定教理に寄せて訳すか
  choice: 取り分け
  alternative: 選び／任命し／分け
  rationale: 預言者的召命を思わせる表現だが、語そのものが特定の体系的教理を確定するわけではないため、目的のために別にするという幅を保った。
- issue: ἐκ κοιλίας μητρός μουが胎内からか出生時からか
  choice: 母の胎にいる時から
  alternative: 生まれた時から
  rationale: 本文ではギリシア語の具体的な胎のイメージを保ち、出生を起点とする慣用的理解も排除しないよう脚注に示した。
- issue: εὐδόκησενに神の主権的決定と喜びのどちらを前面に出すか
  choice: 御心にかなって
  alternative: よしとされた／お決めになった
  rationale: 神の意志と喜びの双方を含み得る語の緊張を保ち、単なる決定へ平板化しない表現を選んだ。
translation_notes:
  register: 明瞭で現代的ながら、神について「方」「召してくださった」「御心」を用いて品位を保った。原文は16節へ続くため、本節も読点で終えて構文上の未完性を示す。
