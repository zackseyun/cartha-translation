id: GAL.1.8
reference: Galatians 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: ja
  text: しかし、たとえ私たちであれ、天からの御使いであれ、私たちがあなたがたに告げ知らせたことに反する[a]福音を告げ知らせるなら、その者は呪われよ。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「反する」は、「異なる」または「それを越える」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「呪われよ」は、「呪いの下にあれ」または「アナテマであれ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: しかし、たとえ…であれ
  rationale: ἀλλάの強い逆接とκαίの強調を保ちつつ、ἐάνによる仮定を自然な現代日本語で表す。
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: 私たちであれ、天からの御使いであれ
  rationale: パウロが自分たち自身をも例外としない強調と、天的な使者との対比を明確にする。ἄγγελοςは文脈上、天的存在を指すため「御使い」とした。
- source_word: εὐαγγελίζηται
  choice: 福音を告げ知らせる
  rationale: 動詞の「良い知らせを告げる」という働きを自然に表し、直後の内容が既に知らされた福音との対比であることも明確にする。
- source_word: παρ’ ὃ
  choice: …に反する
  rationale: παράには「異なる」「越える」の含みもあり得るが、この警告の論争的文脈では、先に告げられた福音からの逸脱を示す「反する」が最も明瞭である。別訳は脚注に残す。
- source_word: εὐηγγελισάμεθα
  choice: 告げ知らせた
  rationale: 同根の動詞とのつながりを保ちながら、日本語で過度に重くならない表現とする。目的語「福音」は文脈上補って明示した。
- source_word: ἀνάθεμα ἔστω
  choice: その者はのろわれよ
  rationale: 厳粛な呪い・断罪の宣告を簡潔に保つ。「破門されよ」のような後代の教会制度上の意味に限定しない。
theological_decisions:
- issue: ἀνάθεμα ἔστωの呪いの性格
  choice: その者はのろわれよ
  alternative: その者は神ののろいの下にあれ／その者はアナテマとなれ
  rationale: 実質的な呪いの宣告という強さを保ちつつ、それを破門という特定の教会的処分に狭めない。「神の」は本文に明示されていないため本文には補わない。
- issue: παρ’ ὃが示す逸脱の範囲
  choice: 私たちが告げ知らせた福音に反する福音
  alternative: 私たちが告げ知らせた福音とは異なる福音／それを越える福音
  rationale: 文脈上の対立的な力を本文で表しつつ、語が持ち得る「異なる」「越える」という幅は脚注で示して、曖昧さを完全には消さない。
translation_notes:
  register: 明瞭で厳粛な現代標準語。「御使い」は聖書語として広く理解される語を用い、「のろわれよ」で原文の強い警告を弱めない。脚注記号は対応箇所の直後に置いた。
