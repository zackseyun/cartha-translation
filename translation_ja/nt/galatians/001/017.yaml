source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: ja
  text: また、私より先に使徒となっていた人たちのもとへエルサレムに上ることもせず、むしろアラビアへ去り、再びダマスコに戻りました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: また、…こともせず
  rationale: 直前の否定を受け継ぎながら、この行動も行わなかったことを自然な日本語で示す。
- source_word: ἀνῆλθον εἰς Ἱεροσόλυμα
  choice: エルサレムへ上る
  rationale: エルサレムへの移動に慣用される「上る」を保ち、目的地への移動を明確にする。
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: 私より先に使徒となっていた人たちに会うために
  rationale: πρόの時間的な意味を「私より先に」で示す。移動を表す文脈でのπρόςは人を訪ねる意味を持つため、「会うために」と自然に表現したが、権威上の優劣は含めない。
- source_word: ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν
  choice: アラビアへ行き
  rationale: エルサレムへ行かなかったこととの対照を語順で明確にし、ἀπῆλθονの移動を簡潔で自然に表す。
- source_word: καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν
  choice: それから再びダマスコに戻りました
  rationale: πάλινとὑπέστρεψαの帰還の意味を保ち、出来事の順序が明瞭になるよう「それから」を用いる。
- source_word: Ἱεροσόλυμα / Ἀραβίαν / Δαμασκόν
  choice: エルサレム／アラビア／ダマスコ
  rationale: 現代日本語の聖書・一般表記として通用する地名表記を採用する。
theological_decisions:
- issue: 「私より先」の意味
  choice: パウロより以前に使徒となっていたという時間的先行
  alternative: パウロより権威や地位が上であること
  rationale: πρὸ ἐμοῦはこの文脈では時間的先行を最も自然に表す。使徒間の権威上の序列は本文が明言していないため訳に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、旅行を述べる文としての簡潔さと書簡にふさわしい品位を保った。前後の文脈とつながるため丁寧体で統一した。
