  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: ja
  text: 私はユダヤ教[a]において、私の民の同年代の多くの者よりも進んでおり、父祖から伝わる伝統に対してはるかに熱心でした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ教」は、「ユダヤ人の宗教」または、より広く「ユダヤ人としての生き方」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: 進んでおり
  rationale: 未完了過去の継続的な進展と、後続する比較の意味を保つ。文脈上「秀でる」の含みはあるが、原語以上に評価的にならない表現とした。
- source_word: Ἰουδαϊσμῷ
  choice: ユダヤ教
  rationale: 当時の宗教的・生活的体系を簡潔に示す標準的な訳語。意味範囲が宗教だけに限られない可能性は脚注で示した。
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: 同年代の多くの者よりも
  rationale: ὑπέρの比較と、συνηλικιώταςが示す年齢上の同輩という意味を自然な現代日本語で表す。
- source_word: ἐν τῷ γένει μου
  choice: 同胞の中の
  rationale: γένοςの民族的・共同体的な帰属を示しつつ、「人種」のような現代的誤解を避ける。
- source_word: περισσοτέρως
  choice: はるかに
  rationale: 熱心さの程度を強める比較的な力を明確に表す。
- source_word: ζηλωτὴς ὑπάρχων
  choice: 熱心でした
  rationale: 分詞構文を日本語として自然に主節へつなぎ、ζηλωτήςの強い献身・熱意を、政治的な「熱心党員」という含みを持ち込まずに表す。
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: 先祖から受け継いだ伝承に対して
  rationale: πατρικόςが示す先祖由来の性格と、παράδοσιςが示す受け渡された伝承の意味を明示的かつ自然に表す。
