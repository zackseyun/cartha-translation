  source_fidelity: 本文は、χάρις／εἰρήνηを「恵みと平安」、ἀπόを「から」とし、祝福の省略動詞を「ありますように」で自然に補っている。θεοῦ πατρὸς καὶ κυρίου ἡμῶν Ἰησοῦ Χριστοῦは「父なる神と、私たちの主イエス・キリスト」と適切に表している。ἡμῶνの係り方には構文上の検討余地があるため、本文はそれを不必要に拡張せず、「私たちの主」に明示する現行訳でよい。
  naturalness: 端正で明瞭な現代日本語であり、書簡冒頭の祝福として「恵みと平安があなたがたにありますように」は自然である。「父なる神」もこの文脈では理解しやすく、過度に古風ではない。
  terminology: 「恵み」「平安」「主」「イエス・キリスト」は日本語聖書の用語として安定している。「キリスト」が称号として「メシア」を意味することを脚注で示す方針も妥当である。ただし、現行脚注の「主であるメシア、イエス」は原文のἸησοῦ Χριστοῦだけの別訳としては不適切にκύριοςを取り込み、また日本語としても不自然である。
