  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: ja
  text: 父なる神と、私たちの主イエス・キリストから、恵みと平安があなたがたにありますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア」の意。別訳「メシアであるイエス」。
    reason: Χριστόςが称号として「メシア」を意味することと、Ἰησοῦ Χριστοῦの自然な明示的訳を示すため。
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: 書簡の祝福の挨拶として自然であり、神の好意というパウロ書簡での神学的な響きも保つ。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数二人称の与格を明示し、祝福の向かう相手を自然な日本語で示す。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在だけでなく、ユダヤ的挨拶を背景とする全人的な安寧も含み得る、聖書日本語として定着した語。
- source_word: ἀπό
  choice: から
  rationale: 恵みと平安の源を示す前置詞の意味を直接表す。
- source_word: θεοῦ πατρὸς
  choice: 父なる神
  rationale: 原文の語順と、この箇所ではἡμῶνがκυρίουの後に置かれている構文を尊重し、「私たちの」を神にまで無理に掛けず、自然で荘重な日本語にした。
- source_word: κυρίου ἡμῶν
  choice: 私たちの主
  rationale: ἡμῶνが直後の「主」に掛かる構造を明確にし、κύριοςのキリスト論的称号としての力を保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語で広く定着した自然な呼称を採用しつつ、Χριστόςが本来「メシア」という称号であることを脚注で明示する。
theological_decisions:
- issue: Χριστόςを翻訳した称号として示すか、定着した「キリスト」を用いるか
  choice: イエス・キリスト
  alternative: メシアであるイエス
  rationale: 「キリスト」は日本語の固有名の一部のようにも受け取られ得るが、本文として最も自然で広く理解される。称号としての意味を失わないよう脚注で「メシア」を示した。
- issue: ἡμῶνを「父」にも掛けて「私たちの父なる神」とするか
  choice: 父なる神と、私たちの主
  alternative: 私たちの父である神と、主
  rationale: 提示されたSBLGNT本文ではἡμῶνがκυρίουの後に位置するため、まず「私たちの主」に掛ける読みを採用した。英語相談層の解釈をそのまま優先せず、原文の構文を反映した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的な祝福にふさわしい端正な文体とした。「ありますように」で、原文に動詞が省略された祝福の表現を日本語として自然に補った。
