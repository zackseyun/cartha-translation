revisions:
- from: 御子を私のうちに現してくださり[a]、私が異邦人の間で御子を福音として告げ知らせるようにされたとき、私はすぐには血肉に相談せず[b]、
  to: 御子を私のうちに[a]現し、私が異邦人の間で御子について福音を告げ知らせるためにそうしてくださったとき、私はすぐには血肉に相談せず[b]、
  rationale: 「私のうちに」は ἐν ἐμοὶ の基本義を本文に保ち、脚注で「私に」「私を通して」という主要な可能性を示します。「御子について福音を告げ知らせる」は、福音宣教を表す動詞と御子を内容・対象とする構文を、御子と福音を同一視せずに自然な日本語で伝えます。「ために」により ἵνα の目的を保持しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:18Z'
