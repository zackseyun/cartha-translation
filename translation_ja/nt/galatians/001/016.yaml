id: GAL.1.16
reference: Galatians 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: ja
  text: 御子を私のうちに[a]現し、私が異邦人の間で御子について福音を告げ知らせるためにそうしてくださったとき、私はすぐには血肉に相談せず[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私に」または「私を通して」。
    reason: alternative_reading
  - marker: b
    text: 「血肉」は、人間を意味する慣用表現。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: 現してくださり
  rationale: 神が御子を啓示するという意味を保ちつつ、直前の節から続く構文に自然につながる表現とした。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 御子
  rationale: 神の子としての称号を、現代日本語の聖書文体で簡潔かつ敬意をもって表す。
- source_word: ἐν ἐμοὶ
  choice: 私のうちに
  rationale: ἐν の基本的な意味を保ち、内的啓示、パウロへの啓示、パウロを通しての啓示という解釈上の幅を本文で狭めない。
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: 私が…御子を福音として告げ知らせるように
  rationale: εὐαγγελίζωμαι の『福音を告げ知らせる』という意味と、αὐτόν が御子自身を直接目的語とする際立った言い方の双方を表す。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 異邦人の間で
  rationale: パウロ書簡の文脈では、ユダヤ人以外の人々を指す用法が最も自然である。
- source_word: εὐθέως
  choice: すぐには
  rationale: 否定辞と結び付け、自然な日本語で『直ちにはしなかった』という意味を表す。
- source_word: οὐ προσανεθέμην
  choice: 相談せず
  rationale: προσανατίθημι の中動態がここで表す、他者に諮る、意見を求めるという意味を明瞭に伝える。
- source_word: σαρκὶ καὶ αἵματι
  choice: 血肉に
  rationale: 原文の比喩的な慣用句を保持し、その意味を脚注で明らかにする。
theological_decisions:
- issue: 御子の啓示に関する ἐν ἐμοὶ の意味
  choice: 本文では『私のうちに』として曖昧さを保持する
  alternative: 『私に』または『私を通して』
  rationale: この句はパウロの内面における啓示、パウロに対する啓示、またはパウロを通した啓示と理解できるため、いずれか一つに限定せず、主要な別訳を脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、使徒書簡にふさわしい端正さを保った。節は前後の文に続く断片であるため、末尾を読点とした。
