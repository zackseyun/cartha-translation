lexical_decisions:
- source_word: τοσαῦτα
  choice: あれほど多くの
  rationale: 中性複数が示す、彼らが経験した数々の事柄を自然な日本語で表し、その多さを保つ。
- source_word: ἐπάθετε
  choice: 苦しみを受けた
  rationale: πάσχωには広く「経験する」の意味もあるが、ここでは信仰に伴う困難を指す可能性が高いため「苦しみを受けた」とした。語義上の幅は脚注に残す。
- source_word: εἰκῇ
  choice: 無駄だった
  rationale: 目的や成果が失われるという空しさを、現代日本語で明瞭に表す。反復も保持した。
- source_word: εἴ γε
  choice: もし……のならですが
  rationale: 断定を避けて条件付きで言い直す、パウロの修辞的な留保を表す。
- source_word: καὶ
  choice: 本当に
  rationale: 二度目のεἰκῇを強める働きを、日本語として自然な強調表現で示す。
theological_decisions:
- issue: 苦難が実際に無駄になったかどうか
  choice: 「もし本当に無駄だったのならですが」と条件的な留保を保つ
  alternative: 「本当に無駄になったとすれば」と、より断定に近く訳す
  rationale: εἴ γε καὶ εἰκῇは、無駄であったと確定せず、その可能性を修辞的に持ち出す表現であるため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、問いかけと末尾の留保による緊張を保った。「ですが」で文を閉じることにより、原文の省略的で含みのある言い方を自然に再現した。
