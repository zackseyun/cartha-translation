  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: ja
  text: あなたがたがあれほど多くの苦しみを受けた[a]のは、無駄だったのでしょうか。もしそれが本当に無駄だったのなら。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたがあれほど多くのことを経験したのは、無駄だったのでしょうか」とも訳せる。
