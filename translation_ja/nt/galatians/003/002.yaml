id: GAL.3.2
reference: Galatians 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: ja
  text: あなたがたに、ただ一つ尋ねたいことがあります。あなたがたが聖霊を受けたのは、律法の行いによるのですか。それとも、信仰をもって聞くこと[a][b]によるのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰の知らせを聞くこと」。この句は、「知らせを信仰をもって聞くこと」とも理解できます。
    reason: alternative_reading
  - marker: b
    text: ここで「信仰」と訳した語を「忠実」と理解する可能性も論じられますが、この文脈では可能性は低いと考えられます。ギリシア語の表現は簡潔で、関係が明示されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: ただ一つ
  rationale: 語頭の強調を保ちながら、パウロの鋭い問いかけを自然な現代日本語で表した。
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: あなたがたから聞きたいことがあります
  rationale: 直訳的な「学びたい」よりも、この問いの文脈に合う自然な日本語としつつ、情報を相手から得たいという意味を保った。複数形のὑμῶνは「あなたがた」と明示した。
- source_word: ἐξ ἔργων νόμου
  choice: 律法の行いによる
  rationale: パウロ特有の圧縮された表現を説明的に広げず、「律法が命じる行い」などに限定もしない形で保った。ἐκはここでは手段・根拠を示す「による」とした。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 文脈上は神から与えられる聖霊を指すため、人格的・神的な指示対象を示す「御霊」とした。ただし原文にない「聖」を補わなかった。
- source_word: ἐλάβετε
  choice: 受けた
  rationale: アオリストを、過去の受領を指す自然な日本語の過去形で表した。
- source_word: ἐξ ἀκοῆς πίστεως
  choice: 信仰をもって聞いたことによる
  rationale: ἔργα νόμουとの対照を手段・契機として表し、πίστιςを「信仰」と訳した。属格関係とἀκοήの意味には幅があるため、別解を脚注に残した。
- source_word: πίστεως
  choice: 信仰
  rationale: この文脈で最も自然な意味を採用した。「信実」の可能性は低いが、圧縮されたギリシア語表現に関する語義上の別案として脚注に示した。
theological_decisions:
- issue: τὸ πνεῦμαの指示対象
  choice: 信じる者に与えられる神の御霊
  alternative: 一般的な霊的体験または霊的な力
  rationale: ガラテヤ3章の直近の文脈は、ガラテヤの人々が神の霊を受けた経験を扱っているため、人格的な神の御霊を指す理解が最も妥当である。
- issue: ἀκοῆς πίστεωςの関係
  choice: 信仰をもって聞くこと
  alternative: 信仰についての知らせを聞くこと、または信仰から生じる聞くこと
  rationale: 属格構文が圧縮されており、聞く行為と信仰の関係を一義的に確定しすぎない必要がある。本文では文脈に最も自然な手段・態度の読みを採り、他の可能性は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。修辞的な対照を「律法の行いによるのですか。それとも」で明確にしつつ、原文の神学的緊張と属格構文の曖昧さは脚注で保持した。
