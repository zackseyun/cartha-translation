id: GAL.3.1
reference: Galatians 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: ja
  text: ああ、物分かりの悪いガラテヤの人たち。あなたがたの目の前で、十字架につけられたメシアであるイエス[b]が公然と示されたのに、いったい誰があなたがたに魔法をかけたのですか。[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誰があなたがたを惑わせたのですか」とも訳せる。原語は文字どおりには、魔法や呪いをかけることを思わせる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「イエス・キリスト」。ここでは「キリスト」を称号として、その意味を表す「メシア」と訳した。
    reason: lexical_alternative
  - marker: c
    text: 「はっきりと示された」または「十字架につけられた者として公に掲示された」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: 物分かりの悪い
  rationale: 理解せず考えの鈍いことへの厳しい叱責を、現代日本語で自然に表す。「愚かな」よりも、この文脈での理解力の欠如に焦点を当てる。
- source_word: Γαλάται
  choice: ガラテヤの人たち
  rationale: 地域・民族への呼びかけを、普通の読者に分かりやすい日本語で示す。
- source_word: ἐβάσκανεν
  choice: 魔法をかけた
  rationale: 有害な魔力や呪いを思わせる原語の鮮烈な比喩を保つ。単なる「惑わせた」よりパウロの修辞的な鋭さが伝わる。
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: あなたがたの目の前には
  rationale: 直接かつ明白に示されたという視覚的な表現を自然な日本語で保つ。
- source_word: Ἰησοῦς Χριστός
  choice: メシアであるイエス
  rationale: Χριστόςを姓のように扱わず、「油注がれた者」という称号の意味を日本語でも聞き取れる形にする。
- source_word: προεγράφη
  choice: 公然と描き出された
  rationale: 人々の前に掲示するように明白かつ鮮明に示す語感を表す一方、動詞の解釈上の幅は脚注に残す。
- source_word: ἐσταυρωμένος
  choice: 十字架につけられた
  rationale: 完了受動分詞が示す、十字架につけられた状態のイエスが提示されたという構文を保つ。
theological_decisions:
- issue: Ἰησοῦς ΧριστόςにおけるΧριστόςの訳し方
  choice: メシアであるイエス
  alternative: イエス・キリスト
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語として自然な語順にした。伝統的な音訳も脚注に示す。
- issue: ἐβάσκανενの比喩をどこまで保持するか
  choice: 魔法をかけた
  alternative: 惑わせた／だました
  rationale: パウロの問いにある呪術的で衝撃的な比喩を弱めず、実際の呪術が起きたと断定するのではなく修辞的表現として読める形にした。
- issue: προεγράφηの意味の幅
  choice: 公然と描き出された
  alternative: はっきりと示された／公に掲示された
  rationale: 公開性と鮮明な提示の双方を主文で表し、掲示・描写という解釈上の幅を脚注で保持した。
translation_notes:
  register: 厳しい叱責と修辞的な問いの力を保ちながら、現代の一般読者に通じる明快で品位ある文体とした。ギリシア語では全体が一つの問いとして組み立てられているが、日本語では呼びかけと問いを区切り、後半を「ではありませんか」として問いの一体性を保った。
