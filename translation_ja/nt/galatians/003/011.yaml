source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: ja
  text: 律法によっては、だれも神の前で義と認められないことは明らかです。なぜなら、「正しい人は信仰によって生きる」[a]とあるからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正しい人は忠実さによって生きる」。
    reason: lexical_alternative
  - marker: b
    text: ハバクク書2章4節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: ～ことは
  rationale: δὲの穏やかな論旨の展開は、日本語では独立した接続語を補わず、文脈と構文によって自然に表した。最初のὅτιは内容節を導くものとして「～ことは」に反映した。
- source_word: ἐν νόμῳ
  choice: 律法によっては
  rationale: ここでは義と認められるための手段を表す。日本語として自然な「律法によって」を用い、否定の焦点を示す「は」を添えた。
- source_word: οὐδεὶς
  choice: だれも～ない
  rationale: 普遍的な否定を明確で自然な現代日本語で表した。
- source_word: δικαιοῦται
  choice: 義と認められない
  rationale: 神の裁きの場における法廷的な意味を保ちつつ、一般読者にも理解しやすい表現とした。
- source_word: παρὰ τῷ θεῷ
  choice: 神の前で
  rationale: 神との関係、特に神の判断における立場を簡潔に表す。
- source_word: δῆλον
  choice: 明らかです
  rationale: 議論上の明白さを示す述語を、明瞭で品位ある現代日本語にした。
- source_word: Ὁ δίκαιος
  choice: 正しい人
  rationale: 形容詞の名詞的用法を自然な日本語にし、神の前で正しい者という含意を保った。
- source_word: ἐκ πίστεως
  choice: 信仰によって
  rationale: πίστιςの通常の訳として「信仰」を採用し、手段・根拠を示すἐκを文脈に即して「によって」とした。語義上可能な「真実／忠実」は脚注に残した。
- source_word: ζήσεται
  choice: 生きる
  rationale: ギリシア語の未来形は、格言的な引用として日本語では非過去形「生きる」が自然であり、将来的帰結も文脈上保持される。
theological_decisions:
- issue: Ὁ δίκαιος ἐκ πίστεως ζήσεται におけるἐκ πίστεωςの係り方とπίστιςの意味
  choice: 「正しい人は信仰によって生きる」
  alternative: 「信仰によって正しいとされる人は生きる」／「正しい人は真実によって生きる」
  rationale: 語順に沿う最も直接的な読みを本文に置いた。ただし、ἐκ πίστεωςを「正しい人」に結び付ける統語的可能性や、πίστιςを「真実・忠実」と取る語義的可能性を断定的に排除しない。後者は脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。パウロの法廷的語彙には定着した「義と認める」を用い、引用文は簡潔な格言調とした。脚注記号は、語義の別訳を引用直後に、出典注を文末に配置した。
