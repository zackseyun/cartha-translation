id: GAL.3.5
reference: Galatians 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: ja
  text: それでは、あなたがたに聖霊を与え、あなたがたの間で[a]奇跡を行っておられる方は、律法の行いによってそうされるのでしょうか。それとも、信仰をもって聞くことによって[b]でしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたのうちで」。
    reason: lexical_alternative
  - marker: b
    text: または「信仰の聞きによって」、あるいは「信仰をもって聞かれるメッセージによって」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: 豊かに与え
  rationale: 継続して十分に供給するという語感を、自然な現代日本語で表す。単なる一回的な「与える」より原語の含みを保つ。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 文脈上、神の霊を指す定冠的な用法である。「聖霊」と補わず、原文どおり「御霊」とした。
- source_word: ἐνεργῶν δυνάμεις
  choice: 力あるわざを行っておられる
  rationale: δυνάμεις は奇跡を指し得るが、語義を狭めすぎず、神の力の現れという原語の表現を保持する。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: ガラテヤの共同体における目に見える力ある働きという文脈に自然である。「あなたがたのうちで」も可能なので脚注に残す。
- source_word: ἐξ ἔργων νόμου
  choice: 律法の行いによって
  rationale: パウロの対比表現を簡潔に保ち、ἐκ の根拠・手段を日本語の「によって」で自然に表す。
- source_word: ἀκοῆς πίστεως
  choice: 信仰をもって聞くことによって
  rationale: 属格句の曖昧さを完全には解消できないが、律法の行いとの対比を自然に伝える。別の構文理解は脚注に保存する。
theological_decisions:
- issue: ἀκοῆς πίστεως の圧縮された属格構文
  choice: 信仰をもって聞くことによって
  alternative: 信仰について聞くことによって／信仰をもって聞いた知らせによって
  rationale: 聞く行為が信仰を伴うという理解が文脈上自然だが、「信仰について聞く」または「信仰をもって聞かれた知らせ」という理解も文法上可能なため、脚注で明示した。
- issue: δυνάμεις が指すもの
  choice: 力あるわざ
  alternative: 奇跡
  rationale: 文脈上は奇跡的な働きが有力だが、「力あるわざ」は原語の語感と範囲を保ち、意味を不必要に限定しない。
translation_notes:
  register: 明快で現代的ながら礼拝・聖書朗読にも耐える丁寧な文体。修辞疑問を「のでしょうか」で表し、神を指す分詞句には敬語を用いた。
