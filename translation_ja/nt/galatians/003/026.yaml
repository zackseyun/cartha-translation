id: GAL.3.26
reference: Galatians 3:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: ja
  text: というのも、あなたがたは皆、メシア・イエス[b]への信仰を通して、神の子[a]だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は男性複数形で、直訳すれば「神の息子たち」。ここでは男女を含む、神の子としての身分と相続の意味を表す。
    reason: lexical_alternative
  - marker: b
    text: 「メシア・イエス」は伝統的には「キリスト・イエス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 皆
  rationale: 二人称複数の「あなたがた」を受け、宛先となる人々全体を強調する簡潔で自然な表現。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の内容を根拠づける接続語として、γάρの説明的な働きを明確に示す。
- source_word: υἱοὶ θεοῦ
  choice: 神の子
  rationale: 日本語の「子」は性別を限定せずに対象全体を含み得る一方、υἱοίが示す父子関係と身分・相続の含意も保てる。「息子たち」は原語の文法的性を明示するが、現代日本語では女性を不自然に排除する印象が強い。
- source_word: διὰ τῆς πίστεως
  choice: 信仰を通して
  rationale: 属格を伴うδιάの手段・媒介の意味を保ち、πίστιςを文脈に即して「信仰」と訳す。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: ἐνを単に信仰の対象へ還元せず、パウロに特徴的なメシアとの結びつきの含みを残す。Χριστόςは称号として「メシア」と訳し、Ἰησοῦは固有名として「イエス」とする。
theological_decisions:
- issue: υἱοίの性別表現と子としての身分
  choice: 神の子
  alternative: 神の息子たち
  rationale: 原語は男性複数形だが、この呼称は文脈上、信仰者全体の子としての身分を述べる。日本語の「神の子」は男女双方を自然に含みつつ、子としての身分と相続の含意を保持する。脚注で原語の形を明示する。
- issue: ἐν Χριστῷ Ἰησοῦの係り方
  choice: メシア・イエスにある信仰
  alternative: メシア・イエスを信じる信仰
  rationale: ἐν句をπίστιςに結びつけて信仰の対象を明示する理解は可能だが、「にある」とすることで、信仰の対象とメシアとの結合という表現上の緊張を狭く限定せずに残す。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςは「油を注がれた者」という称号であり、ここではその意味内容を伝える「メシア」と訳す。日本語で定着した伝統的表記は脚注に示す。
translation_notes:
  register: 現代の標準的な日本語で、説明的接続「というのも」を用いて前節との論理関係を明示した。「メシア・イエスにある」はやや凝縮された表現だが、原文のἐνが持つ結合の含みと係り方の余地を保つために採用した。
