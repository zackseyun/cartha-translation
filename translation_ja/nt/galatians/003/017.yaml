id: GAL.3.17
reference: Galatians 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: ja
  text: 私が言っているのは、こういうことです。神によってあらかじめ確定された契約を、四百三十年後に成立した律法が無効にして[a]、約束を効力のないものにすることはありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「取り消す」。
    reason: ἀκυρόωには、法的効力を失わせる、取り消すという意味がある。
  - marker: b
    text: 「約束を効力のないものにすること」は、目的を表して「約束を効力のないものにするために」とも、結果を表して「約束を効力のないものにする結果となるように」とも訳せる。
    reason: εἰς τό＋不定詞が持ち得る目的・結果の幅を示すため。
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: 私が言っているのは、こういうことです
  rationale: パウロが直前の論点を説明する導入句として、現在の発話の力を保ちつつ、明示されていない時間副詞を加えず自然な現代日本語にした。
- source_word: διαθήκην
  choice: 契約
  rationale: この文脈では、神がアブラハムに与えた約束を伴う契約を指す。「遺言」よりも、議論の契約的・救済史的な性格を適切に表す。
- source_word: προκεκυρωμένην
  choice: 前もって確定された
  rationale: προ-の先行性と完了分詞が示す、すでに確立され有効である状態を表した。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 神によって
  rationale: 受動構文の行為者をそのまま明示し、原文にない強調を加えていない。
- source_word: ὁ ... γεγονὼς νόμος
  choice: 成立した律法
  rationale: 律法が歴史上後から生じたことを簡潔に表し、単なる移動を連想させる「来た」を避けた。
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: 四百三十年後に
  rationale: 契約の確定と律法の成立との時間的隔たりを明瞭に示す。
- source_word: οὐκ ἀκυροῖ
  choice: 無効にし…ことはありません
  rationale: 契約の法的効力を取り消さないというἀκυρόωの意味を、現代日本語で明確に表した。
- source_word: εἰς τὸ καταργῆσαι
  choice: それによって…効力のないものにする
  rationale: 先の行為が約束を無力化する結果に至るという関係を表しつつ、目的・結果の含みを過度に限定しない表現とした。
- source_word: τὴν ἐπαγγελίαν
  choice: 約束
  rationale: アブラハムに対する神の約束を指す文脈上の標準的で明瞭な訳語である。
theological_decisions:
- issue: διαθήκηが指すもの
  choice: 契約
  alternative: 遺言、法的処分
  rationale: 周辺文脈は神がアブラハムに与えた約束を中心としているため、「契約」がパウロの議論を最もよく保つ。ただし、語が他の文脈で「遺言」を意味し得ることを否定するものではない。
- issue: εἰς τὸ καταργῆσαιの目的・結果関係
  choice: それによって…効力のないものにする
  alternative: 約束を無効にするために、約束を無効にする結果となるように
  rationale: εἰς τό＋不定詞には目的または結果の含みがあり得るため、一方だけに断定せず、律法が契約を無効化すれば約束も無力化されるという論理的関係を保った。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。法的な比喩を保つため「契約」「確定」「無効」「効力」を用いた。文頭のδὲは日本語で不自然な時間表現を加えず、説明を導く構文全体で表した。
