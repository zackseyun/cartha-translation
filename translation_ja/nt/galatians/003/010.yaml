id: GAL.3.10
reference: Galatians 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: ja
  text: 律法の行いによる者は皆、呪いの下にあります。[a]「律法の書に記されているすべてのことを守って実行し続けない者は皆、呪われている」と書かれているからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「律法の行いに頼る者は皆」。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「律法の書に記されているすべてのことにとどまり続けて、それらを行うことをしない者は皆、呪われている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: 律法の行いによる者は皆、…からです
  rationale: ὅσοι の包括的な複数範囲を「皆」で示し、γάρの説明・根拠提示の働きを文末の「からです」で自然な日本語にした。
- source_word: ἐξ ἔργων νόμου
  choice: 律法の行いによる者
  rationale: ἐξ の特徴づけを比較的直訳的な「による」で保ち、「律法の行いに頼る者」と解釈を一義化しない。現代日本語としての理解を助ける代案は脚注に示した。
- source_word: ὑπὸ κατάραν
  choice: 呪いの下にあります
  rationale: 支配・拘束のもとにある状態を、日本語の聖書的文体として明瞭な「呪いの下に」で表した。ギリシア語に定冠詞がないため、特定の一つの呪いと過度に限定していない。
- source_word: γέγραπται
  choice: 書かれている
  rationale: 完了受動の結果状態と、聖書引用の定型的な権威づけを自然な日本語で保持した。
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: …者は皆、呪われている
  rationale: πᾶς の普遍的範囲を「皆」で明示し、Ἐπικατάρατος を明瞭で格調ある「呪われている」とした。
- source_word: οὐκ ἐμμένει
  choice: 守り続けない
  rationale: ἐμμένω の継続的にとどまり従う意味を、律法の規定を目的語とする自然な日本語で表した。単なる一時的実行ではなく持続的遵守を示す。
- source_word: πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: 律法の書に記されているすべてのことを
  rationale: πᾶσιν の包括性を「すべて」で保持し、βιβλίον はこの引用表現に自然な「書」とした。
- source_word: τοῦ ποιῆσαι αὐτά
  choice: それらを行うために
  rationale: 目的・志向を示す属格不定詞の形を「ために」で保ち、ποιέω の具体的な実践を「行う」で表した。
theological_decisions:
- issue: ἐξ ἔργων νόμου の解釈
  choice: 本文では「律法の行いによる者」と比較的形式対応的に訳した。
  alternative: 「律法の行いに頼る者」
  rationale: この句が、依拠、帰属、特徴づけのいずれを前面に出すかは神学的に重要である。本文で「頼る」と断定せず原文の緊張を残し、自然な解釈的代案を脚注に置いた。
- issue: 律法の要求の包括性と継続性
  choice: 「すべてのことを…守り続けない」とした。
  alternative: 「すべてのことにとどまらない」
  rationale: πᾶσιν と ἐμμένει の包括性・持続性をともに保持しつつ、日本語で律法への遵守を明瞭に表した。これにより要求の範囲を弱めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用にふさわしい端正さを保った。「律法の行い」はパウロ書簡の重要語句として維持し、本文では解釈を過度に限定しない。引用文は日本語として読みやすい語順に整えつつ、原文の「すべて」「継続」「実行」の各要素を残した。
