id: GAL.3.18
reference: Galatians 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: ja
  text: 相続が律法によるものなら、それはもはや約束によるものではありません。しかし神は、約束を通して、アブラハムに相続を恵みとしてお与えになったのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし神は、約束によって、アブラハムに相続を授けられたのです」。
    reason: κεχάρισταιの恵みの含意を本文で明示しない訳と、διάを手段として簡潔に表す訳の可能性を示すため。
lexical_decisions:
- source_word: κληρονομία
  choice: 相続
  rationale: 相続人として受け取るものを指すパウロの用法に合い、律法と約束の対比を明確に保つ。
- source_word: ἐκ νόμου
  choice: 律法による
  rationale: ἐκが示す根拠・源を自然な日本語で表し、続く「約束による」との対応を保つ。文脈上、モーセの律法が念頭にあるため「律法」とした。
- source_word: ἐξ ἐπαγγελίας
  choice: 約束による
  rationale: 相続の根拠・源が約束であることを表し、「律法による」と並行させた。
- source_word: οὐκέτι
  choice: もはや……ではありません
  rationale: 律法を根拠とするなら約束を根拠とはしない、という排他的な論旨を明確に表す。
- source_word: δι’ ἐπαγγελίας
  choice: 約束を通して
  rationale: διάの媒介・手段の意味を保ちつつ、現代日本語として自然にした。
- source_word: κεχάρισται
  choice: 恵みとしてお与えになった
  rationale: χαρίζομαιに含まれる無償の好意のニュアンスを「恵みとして」で表し、完了形が指す、すでになされた贈与とその有効性を文脈上自然に伝える。
- source_word: τῷ Ἀβραὰμ
  choice: アブラハムに
  rationale: 与える行為の受け手を示す与格を、そのまま自然に表した。
- source_word: ὁ θεός
  choice: 神は
  rationale: 原文の明示的な主語を保持した。
theological_decisions:
- issue: χαρίζομαιの恵みの含意を明示するか
  choice: 「恵みとしてお与えになった」とした。
  alternative: 「授けられた」または「お与えになった」
  rationale: 律法と約束を対比する議論の中で、この動詞に本来含まれる無償の好意を保持するため。ただし、特定の教派的な恩恵論を付加しない表現にとどめた。
- issue: 相続の根拠を示すἐκの曖昧さ
  choice: 「律法による」「約束による」と並行して訳した。
  alternative: 「律法から来る」「約束から来る」
  rationale: 源・根拠の両面を厳密に一方へ限定せず、日本語でパウロの対比を自然に保持した。
translation_notes:
  register: 明快な現代標準日本語の丁寧体を用いた。「相続」を後半で補って、代名詞「それ」が何を指すかを明瞭にした。神の行為には自然な敬語を用いながら、過度に古風または教派的な語調を避けた。
