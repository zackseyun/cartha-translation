  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: ja
  text: こうして、律法は私たちをメシアへ[b]導く養育係[a]となりました。それは、私たちが信仰によって義と認められるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「養育係」は、古代の家庭で子どもを監督し、付き添った者を指します。主として教室で教える教師のことではありません。
    reason: lexical_alternative
  - marker: b
    text: 「メシアへ」は、字義的には「メシアに向かって」。文脈上、「メシアが来るまで」と理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: こうして
  rationale: 前節までの議論から結論を導く推論的な接続を、自然な現代日本語で示す。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 文脈上、モーセの律法を指す定着した聖書用語として簡潔かつ明確である。
- source_word: παιδαγωγὸς
  choice: 養育係
  rationale: 古代の家庭で未成年者を監督し、付き添った者を指し、主として学校教師を意味する語ではないため。
- source_word: ἡμῶν
  choice: 私たちを…導く
  rationale: 属格の関係を日本語として自然に展開し、律法が『私たちの養育係』である意味を表す。
- source_word: γέγονεν
  choice: となりました
  rationale: 完了形の結果的状態を日本語で自然に表す。
- source_word: εἰς Χριστόν
  choice: メシアのもとへ導く
  rationale: εἰςの方向・目標の意味を明示しつつ、律法の役割がメシアを目指すことを表す。時間的な『メシアが来るまで』という理解も脚注に残す。
- source_word: Χριστόν
  choice: メシア
  rationale: 固有名のような『キリスト』ではなく、称号としての意味を明確にする。
- source_word: ἵνα
  choice: それは…ためです
  rationale: 目的を導く接続を、明瞭で自然な日本語にする。
- source_word: ἐκ πίστεως
  choice: 信仰によって
  rationale: パウロの用法における手段または根拠を自然に表す。
- source_word: δικαιωθῶμεν
  choice: 義と認められる
  rationale: 受動態と法廷的な語感を保ちながら、一般読者にも理解しやすくする。
theological_decisions:
- issue: εἰς Χριστόνと律法の役割の関係
  choice: メシアのもとへ導く
  alternative: メシアが来るまで
  rationale: εἰςの方向・目標の意味を本文で比較的直接に表しつつ、直後の時間的文脈から生じる終点の理解を脚注に保存し、一方に限定しない。
- issue: δικαιόωの表現
  choice: 義と認められる
  alternative: 義とされる
  rationale: 神学的な法廷性を保持しながら、現代日本語として意味を明瞭にする。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。専門的な神学用語を増やさず、「律法」「メシア」「信仰」「義と認める」という主要概念を一貫して保った。脚注記号は該当語句と節末に配置した。
