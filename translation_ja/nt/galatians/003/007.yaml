  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: ja
  text: ですから、信仰に基づく者たちこそ、アブラハムの子なのだと知りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: 知りなさい
  rationale: 形態上は直説法とも命令法とも取り得るが、文脈上は結論を認識するよう促す命令として自然に訳した。
- source_word: ἄρα
  choice: ですから
  rationale: 直前のアブラハムの信仰を受けた推論・帰結を明確に示す。
- source_word: οἱ ἐκ πίστεως
  choice: 信仰に基づく者たち
  rationale: ἐκ の起源・基盤を示す表現を保ち、「信仰を持つ者」より原文の構造に近く、特定の教派的説明を加えない。
- source_word: οὗτοι
  choice: こそ
  rationale: 前置された主語を受け直して強調する指示語の機能を、自然な日本語の係助詞で表した。
- source_word: υἱοί
  choice: 子
  rationale: アブラハムとの比喩的・契約的な帰属を表す文脈であり、現代日本語では包括的に理解できる「子」が自然。原語の男性複数形を過度に限定的な「息子たち」としない。
theological_decisions:
- issue: 「信仰に基づく者」とアブラハムの子であることの関係
  choice: 「者たちこそ、アブラハムの子」と断定的に訳す
  alternative: 「者たちはアブラハムの子である」
  rationale: οὗτοι の再指示による強調を保ちつつ、血統ではなく信仰に基づく者をアブラハムの子とする本文の主張を説明的に拡張せず表した。
- issue: Γινώσκετε の法の曖昧さ
  choice: 命令法として「知りなさい」
  alternative: 直説法として「あなたがたは知っている」
  rationale: 綴りだけでは両義的だが、ἄρα で導かれる議論上の勧告として命令法が適切。ただし別解が文法上可能であることは翻訳判断として認識する。
translation_notes:
  register: 明快な現代標準日本語。議論の帰結を示す「ですから」と、οὗτοι の強調を表す「こそ」を用い、簡潔ながら dignified な調子を保った。
