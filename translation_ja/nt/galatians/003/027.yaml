base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: ja
  text: というのも、あなたがたのうち、キリストへとバプテスマを受けた人は皆、キリストを身にまとったのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「キリストを着た」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: あなたがたは皆
  rationale: 直訳的な「〜した者はだれでも」より自然な日本語としつつ、ガラテヤの読者への直接の語りかけと、該当者全体を指す相関的な意味を保つ。
- source_word: γὰρ
  choice: 実際
  rationale: 前節の主張を根拠づけて説明する接続を示す。「なぜなら」も可能だが、この一文では「実際」が自然である。
- source_word: εἰς
  choice: へと
  rationale: キリストとの結合・キリストへの帰属を示す方向性を保ちながら、後代の教理的説明を訳文に加えない。
- source_word: Χριστόν
  choice: キリスト
  rationale: 日本語で定着した称号「キリスト」を用いる。語源的には「油を注がれた者」、すなわちメシアを意味する。
- source_word: ἐβαπτίσθητε
  choice: バプテスマを受けた
  rationale: 受動形を保ち、浸礼など特定の施行方式を訳語によって断定しない。
- source_word: ἐνεδύσασθε
  choice: 身にまとった
  rationale: 衣服を着る比喩を明瞭に保ち、キリストとの結合・新しい身分を説明的に限定しない。
theological_decisions:
- issue: バプテスマの表現が、特定の秘跡論や施行方式を含意するように訳されるか
  choice: キリストへとバプテスマを受けた
  alternative: キリストの中へ浸された／キリストに結ばれるバプテスマを受けた
  rationale: 原文の εἰς が示す方向性と結合の含みを保つ一方、バプテスマの効力や方式をめぐる後代の教理論争を訳文で決着させない。
- issue: 「キリストを着る」という比喩を説明的な教理表現に置き換えるか
  choice: キリストを身にまとった
  alternative: キリストと一つになった／キリストの者となった
  rationale: 原文の衣服の比喩をそのまま生かし、その意味を結合、義認、新しい身分などの一解釈に限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。「バプテスマ」と「キリスト」は一般的な聖書用語として保持し、文体には簡潔さと尊厳を持たせた。
