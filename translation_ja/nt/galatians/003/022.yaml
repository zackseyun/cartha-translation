id: GAL.3.22
reference: Galatians 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: ja
  text: しかし、聖書は、イエス・メシアへの信仰による約束が信じる人々に与えられるようにと、すべてを罪の下に閉じ込めた。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエス・メシアの忠実さによる約束が、信じる人々に与えられるようにと」。原文の表現は、「イエス・メシアへの信仰」とも「イエス・メシアの忠実さ」とも理解され得る。
    reason: alternative_reading
  - marker: b
    text: 直訳「すべてのものを」。人々だけでなく、万物を含み得る包括的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: 閉じ込めました
  rationale: 包囲して逃れられない状態に置く比喩を、現代日本語で明瞭に表す。文脈上の拘束の力を保ちつつ、「投獄した」ほど対象を人間だけに限定しない。
- source_word: ἡ γραφή
  choice: 聖書
  rationale: 単数形で擬人化された、神のことばとしての聖書の統一的な証言を自然な日本語で示す。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的な範囲を保ち、人間だけを指すと断定しない。
- source_word: ὑπὸ ἁμαρτίαν
  choice: 罪のもとに
  rationale: 罪への従属を示す比喩を、説明的な「罪の支配のもとに」と膨らませずに保持する。
- source_word: ἡ ἐπαγγελία
  choice: 約束のもの
  rationale: 日本語で単に「約束が与えられる」とする不自然さを避けつつ、約束された内容を過度に特定しない。
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを信じる信仰による
  rationale: 属格を目的的に解し、イエス・メシアへの信仰を表す。主観的属格の可能性は脚注に残す。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここではイエスに伴う称号として機能しているため、その称号的意味を明示する。
- source_word: δοθῇ
  choice: 与えられるためでした
  rationale: ἵναに続く受動態接続法の目的を、自然な日本語で表す。
- source_word: τοῖς πιστεύουσιν
  choice: 信じる人々
  rationale: 分詞が示す能動的な信仰の応答を保持し、単なる固定的呼称にしない。
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ の属格構文
  choice: 目的的属格として「イエス・メシアを信じる信仰」
  alternative: 主観的属格として「イエス・メシアの真実（忠実さ）」
  rationale: パウロ書簡で議論のある構文である。本文では一般的な目的的属格の読みを採用し、別の有力な読みを脚注で明示して神学的緊張を保持する。
- issue: ἡ ἐπαγγελία の指示内容
  choice: 「約束のもの」とし、内容を特定しない
  alternative: 「約束された賜物」
  rationale: 文脈上、約束の成就・内容が与えられることを指すが、原文は単に「約束」と述べているため、「賜物」などを本文に補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の擬人法と拘束の比喩、τὰ πάνταの包括性を維持した。「約束のもの」は日本語の自然さを確保しながら内容を特定しすぎない表現。脚注記号は対応箇所に置いた。
