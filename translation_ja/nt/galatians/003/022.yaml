- from: しかし、聖書はすべてのものを罪のもとに閉じ込めました[b]。それは、イエス・メシアを信じる信仰による約束のものが、信じる人々に与えられるためでした[a]。
  to: しかし、聖書は、イエス・メシアへの信仰による約束が信じる人々に与えられるようにと、すべてを罪の下に閉じ込めた。[a][b]
  rationale: 「約束」を原文どおりに保ち、「罪の下に」で拘束・従属の比喩を自然に再現した。本文は目的的属格の読みを採りつつ、脚注で主観的属格の有力な代案を明示している。τὰ πάνταの広い範囲も、本文と脚注の組合せで保持した。
