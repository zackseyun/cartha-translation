id: GAL.3.14
reference: Galatians 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: ja
  text: それは、アブラハムの祝福がメシア・イエスにあって異邦人たち[a]に及び、私たちが信仰によって御霊の約束[b]を受けるためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「諸国民に」。
    reason: lexical_alternative
  - marker: b
    text: 「約束された御霊」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: それは…ためでした
  rationale: 二つのἵναが示す目的を一続きの自然な日本語で表し、双方が直前の出来事の目的であることを保った。
- source_word: εἰς τὰ ἔθνη
  choice: 異邦人たちに
  rationale: ガラテヤ書のユダヤ人と異邦人の対比では、地政学的な「諸国民」よりも「異邦人」が文脈に合う。複数性を「たち」で示した。
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: アブラハムの祝福
  rationale: アブラハムに結び付いた祝福を表す属格を簡潔に保持した。
- source_word: γένηται
  choice: 及び
  rationale: γίνομαιの意味をこの構文に即して、祝福が異邦人へも届くことを自然な日本語で表した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστόςの称号性を「メシア」で示し、ἐνの結合・領域を伝統的かつ明瞭な「にあって」で保持した。
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: 御霊の約束
  rationale: 属格を解釈で一義化せず、原文にある「約束」と「御霊」の関係の余地を残した。
- source_word: λάβωμεν
  choice: 私たちが…受ける
  rationale: 一人称複数を明示し、ἵνα節の目的表現の中で自然な日本語にした。
- source_word: διὰ τῆς πίστεως
  choice: 信仰によって
  rationale: 手段を表すδιάを「によって」、πίστιςを文脈上標準的な「信仰」と訳した。
theological_decisions:
- issue: Χριστῷを称号として訳すか、慣用的な名称として訳すか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: アブラハムの約束と祝福を論じる文脈では称号としての力が保たれているため、意味を明示する「メシア」とした。
- issue: τοῦ πνεύματοςの属格の理解
  choice: 御霊の約束
  alternative: 約束された御霊
  rationale: 原文の属格表現を保ち、それが御霊を内容とする約束であるとの有力な理解を本文で確定しすぎないようにした。代案は脚注に示した。
translation_notes:
  register: 現代標準日本語。聖書文体としての品位を保ちつつ、「及ぶ」「にあって」を用いて簡潔にした。「御霊」は聖霊を指す文脈上の敬意ある表記。
