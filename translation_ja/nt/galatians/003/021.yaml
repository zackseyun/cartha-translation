id: GAL.3.21
reference: Galatians 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: ja
  text: それでは、律法は神の約束に反するものなのでしょうか。決してそうではありません。もし命を与えることのできる律法が与えられていたなら、義[a]は確かに律法から生じたはずです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。
    reason: δικαιοσύνη の語義上可能な別訳を保持するため。
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: この節では律法一般を仮定する言い方がなされつつ、文脈上モーセの律法も視野に入っている。「律法」はその両面を保てる定着した訳語である。
- source_word: κατὰ
  choice: 反する
  rationale: 属格を伴い、対立・反対を表す。日本語の修辞疑問として自然で明確な表現を選んだ。
- source_word: ἐπαγγελιῶν
  choice: 約束
  rationale: ギリシア語では複数形だが、日本語の「約束」は無標の形で複数の約束を自然に包括できる。文脈上、神が与えた諸約束を指す。
- source_word: μὴ γένοιτο
  choice: 決してそうではありません
  rationale: パウロの強い否定を、現代日本語で明瞭かつ品位ある形にした。
- source_word: ἐδόθη
  choice: 与えられていたなら
  rationale: 反実仮想的な条件文に合わせ、受動の意味と過去の仮定を自然な日本語で表した。
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: 命を与えることのできる
  rationale: 能力を表す分詞と「生かす／命を与える」の意味を一続きの自然な修飾句として訳した。
- source_word: ὄντως
  choice: 確かに
  rationale: 帰結を強調する副詞の働きを、自然で格調を保った日本語で示す。
- source_word: ἐκ νόμου
  choice: 律法から生じた
  rationale: ἐκの起源・源泉の含意を「から」で保持し、日本語として必要な述語「生じた」を補った。
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロ書簡の文脈で、神の前での正しさを含む多義性を保つ定着した訳語である。「正義」の可能性は脚注に残した。
theological_decisions:
- issue: パウロの議論における δικαιοσύνη の意味
  choice: 義
  alternative: 正義
  rationale: ここでは律法と約束との関係において、神の前での正しさが主眼と考えられるため「義」とした。ただし、公正・正義という語義の広がりを排除せず、脚注で別訳を示した。
- issue: 律法が神の約束に反するかという問い
  choice: 強い否定をそのまま保持
  alternative: 律法と約束の関係を説明的に調和させる訳
  rationale: 原文は緊張を修辞疑問と μὴ γένοιτο によって提示しており、その神学的緊張を訳文内で先回りして解消しない。
translation_notes:
  register: 明快な現代標準日本語を用い、修辞疑問と強い否定を保った。「なのでしょうか」は問いの流れを自然にしつつ、全体は礼拝・公読にも耐える品位を意図した。
