source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: ja
  text: メシア[a]は、私たちのために[b]呪いとなることによって、私たちを律法の呪いから贖い出した。「木[d]に掛けられている者は皆、呪われている」と書かれているからである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。
    reason: lexical_alternative
  - marker: b
    text: 「私たちのために」は、「私たちに代わって」または「私たちの身代わりとして」という意味を含む可能性もある。
    reason: lexical_alternative
  - marker: c
    text: 別訳「というのも、こう書かれているからである」。
    reason: translation_alternative
  - marker: d
    text: 「木」に当たるギリシア語は、文字どおりには「木」または「木材」を意味する。ここでは聖書引用の表現を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: メシア
  rationale: 称号としての意味を明確にし、音写の「キリスト」は脚注に残した。
- source_word: ἐξηγόρασεν
  choice: 贖い出した
  rationale: 代価を払って解放するという語の商取引上の背景と、パウロ書簡における救済的な力の双方を保つ。
- source_word: κατάρα
  choice: 呪い
  rationale: 契約的・法的な重みを解釈的に弱めず、同じ語を本文中の二箇所で一貫して訳した。
- source_word: νόμου
  choice: 律法
  rationale: 文脈上モーセの律法が念頭にあり、日本語の聖書用語として明瞭である。
- source_word: γενόμενος
  choice: 呪いとなることによって
  rationale: 分詞を手段として自然に表しつつ、メシア自身が「呪いとなった」という衝撃的な述語表現を保った。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 恩恵・代理・身代わりを含み得るὑπέρの幅を保ち、本文で特定の贖罪論に狭めない。
- source_word: ὅτι γέγραπται
  choice: と書かれているからである
  rationale: ὅτιの説明的・因果的なつながりを明示した。「というのも」とする訳も可能なため脚注に示した。
- source_word: Ἐπικατάρατος
  choice: 呪われている
  rationale: 引用文として自然な日本語にしながら、強い否定的宣告を保った。
- source_word: κρεμάμενος
  choice: 掛けられている者
  rationale: 分詞の状態的な意味と受動的含意を表し、一般的な宣言として訳した。
- source_word: ξύλου
  choice: 木
  rationale: 語の基本義を保ち、申命記の引用との結び付きを明瞭にした。
theological_decisions:
- issue: ὑπὲρ ἡμῶνが贖罪について示す範囲
  choice: 私たちのために
  alternative: 私たちに代わって／私たちの身代わりとして
  rationale: この句は恩恵と代理を明確に示すが、前置詞ὑπέρだけで身代わりの様態を一義的に規定しないため、広がりを保つ表現を本文に採用した。
- issue: γενόμενος κατάραの述語的表現
  choice: 呪いとなる
  alternative: 呪われた者となる
  rationale: 原文は形容詞ではなく名詞κατάραを用いるため、パウロの強い言い方を和らげずに再現した。
translation_notes:
  register: 明瞭な現代標準日本語の常体を用い、礼拝朗読にも耐える簡潔で重みのある文体とした。原文にない敬語や説明語は加えず、「呪いとなる」という神学的緊張をそのまま保った。
