  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: ja
  text: しかし、信仰が来た今、私たちはもはや養育係の管理下にはいません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「養育係」は、古代の家庭で未成年者を監督し、付き添う者を指す。主に教室で教える教師のことではない。
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: 来た今
  rationale: アオリスト分詞を伴う属格独立構文を自然な時の節として訳し、到来が現状を変えたことを示す。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの律法の監督下にあった時期と、現在との穏やかな対比を表す。
- source_word: πίστεως
  choice: 信仰
  rationale: 文脈上、信仰の到来による救済史的な転換を指す。定冠詞を伴うため「その信仰」も可能だが、日本語本文では不自然に限定せず、曖昧さを保つ。
- source_word: οὐκέτι
  choice: もはや…ません
  rationale: それまで続いていた状態が終わったことを明確に表す。
- source_word: ὑπὸ
  choice: …のもとに
  rationale: 監督・管理下に置かれるという比喩を自然な日本語で保持する。
- source_word: παιδαγωγόν
  choice: 養育係
  rationale: παιδαγωγόςは主として教室の教師ではなく、未成年者を監督し導く家内の係を指すため。
- source_word: ἐσμεν
  choice: 私たちは…いません
  rationale: 現在形を自然な日本語の述語として表す。
theological_decisions:
- issue: 「信仰が来た」の意味
  choice: 本文を「信仰が来た今」とし、パウロが語る救済史上の転換を表した。
  alternative: 「その信仰が来た今」として、メシアによって始まった信仰の時代をより明示する。
  rationale: πίστιςには冠詞があるものの、文脈によって特定される用法とも理解できる。本文で一方に決め切らず、「信仰」という自然な訳で神学的な幅を保つ。
- issue: παιδαγωγόςの制度的意味
  choice: 「養育係」と訳し、未成年者を監督する役割を示した。
  alternative: 「後見人」「監督者」
  rationale: 直前の比喩では律法がキリストに至るまで人を監督する役割を担う。教師という意味に狭めず、古代家庭における監督・付添いの機能を伝える。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「養育係」は古代の役割を比較的自然に伝え、教師との誤解は脚注で防いだ。原文の冠詞による「その信仰」という可能性は、本文の「信仰」に包摂されるため、冗長な別訳注は設けなかった。
