id: GAL.3.19
reference: Galatians 3:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: ja
  text: では、律法は何のためでしょうか。律法は、違反のゆえに[a]付け加えられ、約束を受けた子孫[b]が来る時までのものでした。律法は、天使たちを通して、仲介者の手を通して定められたのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「違反のゆえに」は、違反に対処するため、違反を明らかにするため、あるいは違反を抑えるため、などの意味に理解できます。ギリシア語はそれ以上限定していません。
    reason: alternative_reading
  - marker: b
    text: 直訳は「種」。ここでは「子孫」または「末裔」の意味です。
    reason: lexical_alternative
  - marker: c
    text: または「取り決められた」「制定された」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: それでは、律法は何のためにあるのでしょうか
  rationale: 省略を含む問いを、議論の流れに沿って律法の目的を問う自然な現代日本語にした。
- source_word: τῶν παραβάσεων χάριν
  choice: 違反のゆえに
  rationale: 理由と目的の双方を帯び得る簡潔な原文を保ち、律法が違反を抑制・明示・増加させるなどの解釈に限定しない。
- source_word: προσετέθη
  choice: 付け加えられた
  rationale: 律法が先行する約束に追加されたという受動形の意味を素直に表す。
- source_word: ἄχρις οὗ ἔλθῃ
  choice: 来る時まで
  rationale: 律法が付加された時点から将来の到来を終点として示す構文を自然に表した。
- source_word: τὸ σπέρμα
  choice: 子孫
  rationale: 日本語では「種」より人を指すことが明瞭であり、文脈上のアブラハムの子孫を自然に示す。単数に焦点を当てる議論は単数形の「子孫」で保持される。
- source_word: ᾧ ἐπήγγελται
  choice: 約束を受けた
  rationale: 関係代名詞の与格と完了受動の結果的意味を簡潔に表す。約束の主体を本文以上に明示しない。
- source_word: διαταγεὶς
  choice: 定められた
  rationale: 律法が正式に取り決められた、制定されたという意味を、過度に教会用語化せず表す。
- source_word: δι’ ἀγγέλων
  choice: 御使いたちを通し
  rationale: διά＋属格の媒介・手段を保持する。
- source_word: ἐν χειρὶ μεσίτου
  choice: 仲介者の手によって
  rationale: 原文の具体的な「手」の表現を残しつつ、媒介による働きを日本語として理解できる形にした。
theological_decisions:
- issue: 「違反のゆえに」の意味
  choice: 目的を限定せず「違反のゆえに」とした
  alternative: 違反を抑えるために／違反を明らかにするために／違反を増し加えるために
  rationale: χάριν の短い表現だけでは具体的機能が特定されないため、神学的緊張を保持する。
- issue: σπέρμα の訳語
  choice: 子孫
  alternative: 種／末裔／一人の子孫
  rationale: 人を指す日本語として自然でありつつ、集合的にも単数的にも用い得る原語の余地を残す。「一人の」を本文に補って解釈を先取りしない。
- issue: ᾧ ἐπήγγελται の統語
  choice: 約束を受けた子孫
  alternative: 約束された子孫／その子孫に約束がなされた
  rationale: 与格を約束の受領者として読み、約束された対象そのものが子孫だと断定する曖昧さを避ける。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ敬体。「律法」「御使い」「仲介者」を用い、原文の媒介構造と曖昧さを保持した。
