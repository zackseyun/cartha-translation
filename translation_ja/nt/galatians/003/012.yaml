    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: 文脈上モーセの律法が視野にあり、日本語では「律法」が自然かつ定着した訳語である。
- source_word: ἐκ πίστεως
  choice: 信仰から出たもの
  rationale: ἐκの起点・源を表す響きを保ち、「信仰に基づく」などと解釈を狭めすぎないようにした。
- source_word: ἀλλά
  choice: むしろ
  rationale: 直前の否定と引用される対照命題との鋭い対比を自然に示す。
- source_word: ὁ ποιήσας αὐτά
  choice: これらを行う者
  rationale: 一般的な単数の主体と、律法の規定を指す代名詞を明示しすぎずに保持した。
- source_word: ζήσεται ἐν αὐτοῖς
  choice: これらによって生きる
  rationale: ἐνを手段・基盤の意味に取り、レビ記引用の文脈に即して自然な日本語とした。より字義的な「これらのうちにあって」は脚注に残した。
theological_decisions:
- issue: 律法と信仰の対比
  choice: 律法は信仰から出たものではありません
  alternative: 律法は信仰に基づくものではありません
  rationale: パウロの対立を弱めず、同時に律法と信仰の関係を説明的な「原理」などで確定しないよう、ἐκの表現を比較的直接に残した。
translation_notes:
  register: 明快な現代標準日本語を用い、引用には聖書的な格調を保った。「とあります」を補い、引用であることを日本語として自然に示した。
