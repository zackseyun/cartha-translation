base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: ja
  text: しかし、律法は信仰によるものではありません。むしろ、「これらを行う者は、これらによって生きる[a]」とあります。[b]
  philosophy: optimal-equivalence
  footnotes:
