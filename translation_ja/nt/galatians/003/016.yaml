id: GAL.3.16
reference: Galatians 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: ja
  text: 約束は、アブラハムとその子孫[a]に告げられました。多くの者を指して「また、あなたの子孫たち[b]に」とは言わず、一人を指して「また、あなたの子孫に」と言っています。その子孫とはメシア[c]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節の「子孫」は、直訳すると「種」。ギリシア語では集合的な意味を持ち得る単数名詞で、パウロの議論の中心になっています。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「種子たち」に当たる複数形。パウロは語の単数形を強調しています。
    reason: lexical_alternative
  - marker: c
    text: 別訳「キリスト」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: 告げられました
  rationale: 受動態の「言われた」という意味を保ちつつ、神の約束が伝えられたことを現代日本語で自然かつ格調を損なわずに表す。
- source_word: ἐπαγγελίαι
  choice: 約束
  rationale: 神が与えた複数の約束を指す標準的な訳語。日本語では文脈上、無理に「約束の数々」としなくても複数性を含意できる。
- source_word: σπέρμα / σπέρματι
  choice: 子孫
  rationale: 人の系譜についての集合的単数を自然な日本語で表す。「種」より明瞭でありながら、パウロの議論に必要な単数的な指示を文脈で保てる。
- source_word: τοῖς σπέρμασιν
  choice: 子孫たち
  rationale: 通常は不自然になり得る複数化をあえて見える形にし、パウロが強調する単数形と複数形の対比を保つ。
- source_word: ὡς ἐπὶ πολλῶν / ὡς ἐφ’ ἑνός
  choice: 多くの者を指して／一人を指して
  rationale: 前置詞句の機能を自然に表し、複数と単数の対照を明確にする。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは約束された子孫を油注がれた方と同定する称号として機能しているため、称号の意味が伝わる「メシア」とする。
theological_decisions:
- issue: Χριστόςを同定文でどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: 固有名のような用法よりも称号としての働きが明瞭であり、約束された子孫がメシアであるという同定を保つ。
- issue: σπέρμαの集合的単数とメシアへの同定
  choice: 本文では「子孫」を用い、単複の対比を「子孫たち」で明示する
  alternative: 全箇所を「種」と訳す
  rationale: 原語の集合名詞が持つ幅とパウロの単数形への注目をともに保ちつつ、現代日本語の読者に意味が直ちに伝わるようにする。原語上の特徴は脚注で補う。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬体で統一した。「また」を引用内に残して原文の καί を反映し、「子孫たち」という意図的に目立つ表現によってパウロの文法的対比を読者に見える形で示した。
