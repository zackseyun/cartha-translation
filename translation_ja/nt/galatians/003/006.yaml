  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: ja
  text: ちょうどアブラハムが神を信じ、それが彼に義[a]と認められたように、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。
    reason: δικαιοσύνηの語義には「義」と「正義」の両面があるため。
lexical_decisions:
- source_word: καθὼς
  choice: ちょうど～ように
  rationale: 比較を導く語の働きを保ち、次節へ続くパウロの論証を自然な日本語で示す。
- source_word: Ἀβραὰμ
  choice: アブラハム
  rationale: 日本語聖書で定着している人名表記。
- source_word: ἐπίστευσεν τῷ θεῷ
  choice: 神を信じ
  rationale: πιστεύωに人を示す与格が伴う構文を「神を信じる」と訳し、単に神の存在を信じるという意味に限定せず、神の言葉を真実として受け入れた含みを保つ。
- source_word: ἐλογίσθη αὐτῷ
  choice: それが彼に…認められた
  rationale: 受動形と与格を反映する。「それ」は何が認定されたかを明示しすぎず、原文にある照応上の余地を保つ。
- source_word: εἰς δικαιοσύνην
  choice: 義と
  rationale: パウロの議論と創世記引用に定着した訳語であり、神との正しい関係・正しい身分という文脈に適する。「正義」の可能性は脚注に残す。
theological_decisions:
- issue: パウロ書簡におけるδικαιοσύνηの訳語
  choice: 義
  alternative: 正義
  rationale: この箇所では、アブラハムに認められた身分を論じる文脈に「義」が最も適する。ただし、δικαιοσύνηが持つ公正・正義の意味領域を排除しないため、別訳を脚注で示す。
- issue: 何がアブラハムに義と認められたか
  choice: 「それ」を主語として残す
  alternative: 「その信仰が」または「アブラハムが義と認められた」
  rationale: 原文の受動表現には明示された主語がなく、直前の信じたことを受けると理解できる。「信仰」と補ったり、アブラハム自身が義とされたと直接言い換えたりせず、原文の表現上の余地を保つ。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った訳。「ように、」で終えることにより、原文が次節へ構文上続くことを示した。
