id: GAL.3.15
reference: Galatians 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: ja
  text: 兄弟たち[a]、人間の例を借りて言います。人が正式に定めた契約[b]でさえ、だれもそれを無効にしたり、何かを付け加えたりはしません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は男性複数形ですが、パウロは女性を含む信者たち全体に呼びかけていると考えられます。
    reason: cultural_note
  - marker: b
    text: 「契約」は「遺言」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを本文では具体的に保ちつつ、当時の共同体全体への呼びかけである可能性を脚注で示す。
- source_word: κατὰ ἄνθρωπον λέγω
  choice: 人間の例を借りて言います
  rationale: 直訳的な「人間に従って言う」ではなく、人間社会の事例を用いて論じるという慣用的な意味を、自然な現代日本語で表した。
- source_word: ὅμως
  choice: でさえ
  rationale: 通常の人間の場合にもその原則が成り立つ、という論証の強調を表す。
- source_word: ἀνθρώπου
  choice: 人が
  rationale: 属格単数の具体性を保ち、契約を正式に定める主体として自然に表現した。性別を強調する文脈ではないため、日本語では無標の「人」とした。
- source_word: κεκυρωμένην
  choice: 正式に定めた
  rationale: 完了受動分詞が示す、確定され効力を持つ状態を、過度に専門的にならない法的表現で伝えた。
- source_word: διαθήκην
  choice: 契約
  rationale: この章のアブラハムへの約束と神の契約という文脈に最もよく合う。「遺言」という語義も脚注に残す。
- source_word: ἀθετεῖ
  choice: 無効にしたり
  rationale: 法的効力を取り消す、または退ける意味を明確な現代日本語で表した。
- source_word: ἐπιδιατάσσεται
  choice: 何かを付け加えたり
  rationale: 後から条項や規定を追加する意味を、文脈から理解できる簡潔な表現にした。
theological_decisions:
- issue: διαθήκηを「契約」とするか「遺言」とするか
  choice: 契約
  alternative: 遺言
  rationale: ガラテヤ3章ではアブラハムへの約束と神の契約が議論の中心であり、「契約」が文脈上の連続性を最もよく保つ。ただし、人間社会の法的類比として「遺言」の意味に取る可能性もあるため、脚注で示した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。法的な比喩の趣旨を保ちながら、専門用語に偏らない表現とした。「兄弟たち」は原文の形を保ち、対象範囲を脚注で補足した。
