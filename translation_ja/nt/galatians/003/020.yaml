  text: A mediator is not of one[b][a], but God is one.
translation:
  language: ja
  text: 仲介者は、一人だけに関わるものではありません[a]。しかし、神はおひとりです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「仲介者は一者のものではない」。この句は、「一人だけのために働くのではない」または「一方だけのためにいるのではない」という意味とも取れます。
    reason: alternative_reading
  - marker: b
    text: 「神はおひとりです」は、イスラエルの唯一神信仰の告白を思わせると考えられます。申命記6章4節参照。
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: 仲介者
  rationale: 当事者の間に立つ者を表す、現代日本語で明確かつ法的・契約的含意も保てる訳語。
- source_word: ἑνὸς
  choice: 一人だけのもの
  rationale: 属格「一者の／一人の」の簡潔さと曖昧さをできるだけ残しつつ、日本語として理解可能にした。「一方だけのため」と断定して当事者関係を過度に明示することは避けた。
- source_word: οὐκ ἔστιν
  choice: ではありません
  rationale: 原文の存在・帰属をめぐる圧縮された言い方を、説明的に広げず直接表した。
- source_word: δὲ
  choice: しかし
  rationale: 第一の δέ は日本語では明示せず、第二の δέ は二つの命題の対照を示す「しかし」とした。
- source_word: ὁ θεὸς εἷς ἐστιν
  choice: 神はおひとりです
  rationale: 神の唯一性を自然で荘重な日本語にし、申命記6章4節を思わせる告白的響きも保った。
theological_decisions:
- issue: 前半の圧縮され多義的な論旨
  choice: 「仲介者は、一人だけのものではありません」
  alternative: 「仲介者は一方だけのためにいるのではありません」
  rationale: 仲介には通常複数の側が関わるという含意は伝えつつ、それが誰を指すか、また律法・モーセ・キリスト・契約とどう結びつくかを本文で決めつけないため。
- issue: 「神は一人」の告白的意味
  choice: 「神はおひとりです」
  alternative: 「神は唯一です」
  rationale: εἷς の「一」を保持し、神の唯一性を述べる聖書的告白との響きを残す。「唯一です」より原文の述語表現に近い。
translation_notes:
  register: 明瞭な現代標準語を用い、敬体で荘重さを保った。難解な前半は解釈的な言い換えを本文に持ち込まず、脚注で主要な理解を示した。
