id: GAL.3.28
reference: Galatians 3:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: ja
  text: ユダヤ人もギリシア人もなく、奴隷も自由人もなく、男と女もありません[a]。あなたがたは皆、メシア・イエスにあって一つだからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、前の二組が「〜も〜も」に当たる語で結ばれるのに対し、ここは「男と女」と結ばれています。この表現は創世記1章27節を響かせている可能性があります。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では「キリスト・イエスにあって」。ここでは「キリスト」を称号として「メシア」と訳しました。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: 〜もなく／〜もありません
  rationale: 存在を否定する反復表現を自然な日本語にしつつ、原文の強調された並行構造を保つ。
- source_word: Ἰουδαῖος
  choice: ユダヤ人
  rationale: Ἕλληνとの対比では民族的・宗教的意味が中心であり、現代日本語で最も明瞭な表現。
- source_word: Ἕλλην
  choice: ギリシア人
  rationale: 原文の具体的な呼称を保ち、より広い意味の「異邦人」へ一般化しない。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 自由人と対置された拘束された身分を明確に表す。
- source_word: ἐλεύθερος
  choice: 自由人
  rationale: 奴隷と対照をなす社会的身分を簡潔かつ自然に示す。
- source_word: ἄρσεν καὶ θῆλυ
  choice: 男と女
  rationale: 日本語として自然でありながら、καίを「と」として保ち、創世記1章27節への響きを残す。
- source_word: πάντες γὰρ ὑμεῖς
  choice: あなたがたは皆、〜だからです
  rationale: 二人称複数と全体性を明示し、γάρの理由提示を自然な文末で表す。
- source_word: εἷς ἐστε
  choice: 一つです
  rationale: 共同体的な一致を述べる簡潔な単数述語を、解釈的に「一人」や「一致している」と拡張せずに保つ。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστόςの称号性を「メシア」で示し、ἐνの結合・領域の含意を聖書文体として自然な「にあって」で表す。
theological_decisions:
- issue: ἄρσεν καὶ θῆλυの接続をどう訳すか
  choice: 男と女
  alternative: 男も女もない
  rationale: 前二組のοὐδέと異なり、ここではκαίが用いられている。創世記1章27節を想起させる可能性と原文上の差異を保つ。
- issue: εἷς ἐστεを解釈的に補うか
  choice: あなたがたは皆、一つ
  alternative: あなたがたは皆、一人の人／一致している
  rationale: メシアにある一致を肯定しつつ、被造物としてのあらゆる区別の消滅など、本文が明言しない内容を加えない。
- issue: Χριστόςを称号として訳すか
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスのメシアとしての立場を示す称号の力を明示する一方、日本語で定着した「キリスト」という選択肢も脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「にあって」は日常語より聖書的だが、ἐν Χριστῷの関係的・領域的含意を過度に説明せず伝えるため採用した。列挙の反復と結論の因果関係を保持した。
