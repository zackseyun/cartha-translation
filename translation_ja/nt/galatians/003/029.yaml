id: GAL.3.29
reference: Galatians 3:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: ja
  text: もしあなたがたがメシアのもの[a]であるなら、あなたがたはアブラハムの子孫[b]であり、約束に従って相続人なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストのもの」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「種」。ギリシア語では単数形で、この章の前半にあるパウロの言い回しを受けています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: メシアのもの
  rationale: Χριστόςを称号として「メシア」とし、属格が表す帰属を現代日本語で自然な「メシアのもの」と表した。
- source_word: σπέρμα
  choice: 子孫
  rationale: 字義的には単数形の「種」だが、ここでは集合的にアブラハムの子孫を指す。本文では自然で明瞭な「子孫」とし、単数形と同章前半との語のつながりは脚注で示した。
- source_word: κληρονόμοι
  choice: 相続人
  rationale: 家族関係と約束に基づく受け継ぎを表す、自然で定着した訳語である。
- source_word: κατ’ ἐπαγγελίαν
  choice: 約束に従って
  rationale: 約束との対応関係を示しつつ、それが根拠・基準・仕方のどれであるかを本文で過度に限定しない。ギリシア語に定冠詞がないため「その約束」とはしなかった。
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: もしあなたがたが…であるなら、あなたがたは…なのです
  rationale: δέを日本語では明示せず軽い接続として扱い、条件とそこから導かれる帰結を自然な構文で明確にした。
theological_decisions:
- issue: σπέρμαの単数形と、ガラテヤ3章前半の「種」をめぐる議論とのつながりをどう保つか
  choice: 本文は「子孫」とし、脚注で原語が単数形の「種」であることを示す
  alternative: 本文で「種」と訳す
  rationale: 「種」をそのまま用いると現代日本語では意味が取りにくい一方、単数形はパウロの議論にとって重要である。本文の明瞭さと原語上の連関を、本文と脚注の組み合わせでともに保った。
- issue: Χριστόςを称号として訳すか、慣用的な固有名のように訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所のΧριστόςを称号として読めることを明確にしつつ、別訳「キリスト」を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「メシアのもの」は帰属を自然に表し、「相続人なのです」は条件からの帰結を明確にする。脚注記号は対応する語句の直後に置いた。
