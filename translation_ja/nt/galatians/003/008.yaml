- from: 聖書は、神が信仰によって諸国の民を義とされることを前もって見抜き、アブラハムに、「あなたにあって、すべての国々の民が祝福される」と、前もって福音を告げました。
  to: 聖書は、神が信仰によって諸国民を義とされることをあらかじめ見通し、アブラハムに、「あなたにあって、すべての諸国民が祝福される」と、あらかじめ福音を告げた。
  rationale: 原文の構文、時制関係、擬人化、およびἔθνηの二度の反復を保持したまま、「見抜き」を予見として中立的な「あらかじめ見通し」に改め、諸国民の訳語を統一した。本文中に脚注アンカーはなく、日本語本文の理解に必須の補足もないため、脚注は設けない。
