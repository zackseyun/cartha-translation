    issue: 「前もって見抜き」
    rationale: 「見抜く」には見破る・看破する語感があり、予見を表すπροϊδοῦσαには「あらかじめ見通す」のほうが中立的で自然である。
  - severity: low
    issue: ἔθνηの反復に訳語の揺れがある
    rationale: 「諸国の民」と「国々の民」は意味を損なわないが、同一語の反復と論証上の結びつきを明確にするため、「諸国民」で統一する。
  revised_text: 聖書は、神が信仰によって諸国民を義とされることをあらかじめ見通し、アブラハムに、「あなたにあって、すべての諸国民が祝福される」と、あらかじめ福音を告げた。
