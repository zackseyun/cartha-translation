id: GAL.3.8
reference: Galatians 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: ja
  text: 聖書は、神が信仰によって諸国民を義とされることをあらかじめ見通し、アブラハムに、「あなたにあって、すべての諸国民が祝福される」と、あらかじめ福音を告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προϊδοῦσα
  choice: 前もって見抜き
  rationale: 先立って認識したことを表すアオリスト分詞の時間的な意味を保ちつつ、擬人化された「聖書」を主語とする自然な日本語にした。
- source_word: ἡ γραφή
  choice: 聖書
  rationale: 一般的な「書かれたもの」ではなく、パウロが権威ある聖書を人格化して語る定型的な用法として訳した。日本語では定冠詞を明示しない。
- source_word: ἐκ πίστεως
  choice: 信仰によって
  rationale: 根拠または手段を表す表現として、意味を限定しすぎない標準的な訳語を用いた。
- source_word: δικαιοῖ
  choice: 義とされる
  rationale: 神を動作主とする法廷的な含意を簡潔に保つため、「正しい者と認める」などの説明的言い換えを避けた。
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: 諸国の民……すべての国々の民
  rationale: ἔθνηが持つ「諸国民」と「異邦人」の意味領域を日本語である程度保ち、本文とアブラハムへの約束との語彙的なつながりも示した。
- source_word: προευηγγελίσατο
  choice: 前もって福音を告げました
  rationale: 「前もって」とεὐαγγελ-の「福音／良い知らせ」の双方を明示し、単なる予告に弱めない訳とした。
- source_word: τῷ Ἀβραὰμ
  choice: アブラハムに
  rationale: 与格の間接目的語を自然な日本語で表した。
- source_word: Ἐνευλογηθήσονται
  choice: 祝福される
  rationale: 未来受動の約束を直接的に表し、祝福の仕方や主体を本文以上に説明しない。
- source_word: ἐν σοὶ
  choice: あなたにあって
  rationale: 「あなたによって」と手段に限定せず、アブラハムとの代表的・契約的な結びつきを含み得るἐνの曖昧さを保った。
theological_decisions:
- issue: ἔθνηを「異邦人」とするか「諸国の民」とするか
  choice: 二箇所とも「諸国の民／国々の民」とする
  alternative: 最初を「異邦人」、引用内を「諸国民」とする
  rationale: パウロの文脈では「異邦人」も十分可能だが、同じギリシア語の反復と、信仰による義認がアブラハムへの諸国民の約束に結びつく構造を見える形で保つため。
- issue: ἐν σοὶの関係性
  choice: 「あなたにあって」として関係・領域を含む表現を保つ
  alternative: 「あなたによって」として手段的に訳す
  rationale: 前置詞ἐνはこの引用で手段だけに限定できず、アブラハムとの結びつきのうちに祝福されるという読みも可能なため、解釈を一つに決めない。
translation_notes:
  register: 明瞭で現代的だが礼拝・朗読にも耐える格調を保った。「見抜き」は擬人法を自然にし、「前もって福音を告げました」は原文の語形成を透明にする。英語資料の脚注マーカーは本文との対応にずれがあるため採用せず、必要な語義の幅は「諸国の民」という本文表現で保持した。
