  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: ja
  text: あなたがたは、これほど愚かなのですか。聖霊によって[a]始めたのに、今は肉によって[b]完成されていくのですか。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖霊のうちに」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「人間的な努力によって」とも、「罪深い性質によって」とも理解されうる。
    reason: lexical_alternative
  - marker: c
    text: 「完成しようとしている」「完成される」とも訳せる。原文の形には中動態・受動態の両方の含みがありうる。
    reason: grammatical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: これほど
  rationale: 修辞疑問の中で程度を表し、パウロの強い驚きと叱責を自然な現代日本語で示す。
- source_word: ἀνόητοί
  choice: 愚かな
  rationale: 理解や判断を欠いているという意味を保ちつつ、不必要に侮蔑的な語を避ける。
- source_word: ἐναρξάμενοι
  choice: 始めたのに
  rationale: 主動詞に先立つ行為を示す分詞を、開始時と現在との鋭い対照が伝わる形にする。
- source_word: πνεύματι
  choice: 御霊によって
  rationale: 直前の文脈では神の霊を指す可能性が最も高い。与格は道具・手段と取るのが自然だが、領域を示す可能性は脚注に残す。
- source_word: νῦν
  choice: 今は
  rationale: 開始時との時間的対照を簡潔かつ明瞭に示す。
- source_word: σαρκὶ
  choice: 肉によって
  rationale: πνεύματιとの対句を保ち、パウロのσάρξが持つ人間的手段や罪深い性質などの重層的含意を本文で一つに限定しない。
- source_word: ἐπιτελεῖσθε
  choice: 完成されようとしている
  rationale: 現在形の進行性と中動・受動の曖昧さをある程度保ち、始めから完成へという修辞的対照を表す。自分たちで成し遂げようとする含みも文脈上あり得るため脚注に示す。
theological_decisions:
- issue: πνεύματιの指示対象
  choice: 聖霊（本文では「御霊」）
  alternative: 人間の霊、または霊的原理
  rationale: ガラテヤ3章の直近の文脈は、信仰によって受けた御霊と御霊の働きを扱っているため、神の霊を指すと読むのが最も自然である。
- issue: 御霊と対照されるσάρξの意味
  choice: 肉
  alternative: 人間的な努力、罪深い性質
  rationale: 神の働きと人間的・肉的手段との対照がある一方、パウロのσάρξには重層的な意味があるため、解釈を一つに狭めず原語に対応する「肉」を保持する。
- issue: ἐπιτελεῖσθεの態
  choice: 完成されようとしている
  alternative: 完成しようとしている、仕上げられている
  rationale: 形態上、中動態と受動態の区別が確定しにくい。本文は受動的表現を採りつつ、「ようとしている」により現在の企てを表し、別の態の理解を脚注に残す。
translation_notes:
  register: 明快で格調のある現代標準日本語。修辞疑問を二文で保ち、「御霊」と「肉」の対照を原文どおり前面に出した。「これほど愚かなのですか」は強い叱責を保ちながら、過度に口語的・侮蔑的にならない表現である。
