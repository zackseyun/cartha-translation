id: GAL.3.23
reference: Galatians 3:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: ja
  text: しかし、信仰が来る前には[a]、私たちは律法の下で守られ[b]、後に明らかにされる信仰に至るまで閉じ込められていました[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その信仰が来る前」とも訳せる。ギリシャ語の「信仰」には定冠詞があり、キリストによって始まる信仰の時代を指している可能性がある。また、この語は文脈によって「信頼」や「忠実さ」を意味することもある。
    reason: alternative_reading
  - marker: b
    text: 「監視下に置かれていた」または「拘束されていた」とも訳せる。原語には、守ることと監護・拘束することの両方の含みがある。
    reason: lexical_alternative
  - marker: c
    text: 「閉ざされていました」または「牢に入れられていました」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ δὲ ἐλθεῖν
  choice: しかし、……が到来する前には
  rationale: πρό＋冠詞付き不定詞の時間的意味を明確にし、δέの穏やかな対比も「しかし」で表した。「到来する」は、単に個人が信じ始めることではなく、救済史上の局面が訪れる含みを保つ。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: 文脈上は「信仰」が最も自然である。定冠詞を機械的に「その」とせず、キリストと結びついた信仰の時代という含みは語順と「到来する」によって保った。
- source_word: ὑπὸ νόμον
  choice: 律法の下で
  rationale: モーセの律法の支配・管理の下にあることを表す、パウロ書簡の定型的表現を自然な日本語で維持した。
- source_word: ἐφρουρούμεθα
  choice: 見張られ
  rationale: 未完了過去受動の継続的な状態を文末の「いました」で表した。「見張る」は保護と監視・拘束の両面をある程度残し、直後の συγκλειόμενοι の制限的意味とも調和する。
- source_word: συγκλειόμενοι
  choice: 閉じ込められていました
  rationale: 周囲を閉ざされ、拘束される意味を明瞭に表す。分詞の付随的・継続的な働きを、日本語では述語として自然に組み込んだ。
- source_word: εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: やがて明らかにされる信仰の時まで
  rationale: εἰς のここでの時間的・目標指向的な力を「時まで」で表し、μέλλουσαν の将来性と ἀποκαλυφθῆναι の受動的な啓示の意味を保持した。
theological_decisions:
- issue: πίστις が個人の信仰を指すのか、キリストによって始まる救済史上の「信仰」の現実・時代を指すのか
  choice: 本文では「信仰」とし、「到来する」「信仰の時まで」という表現で救済史的含みも残した。
  alternative: 「その信仰」「信仰の時代」、または「真実」「忠実」
  rationale: 定冠詞付き πίστις の反復と文脈は、単なる個人の心理的行為を超えた局面を示唆するが、本文で「信仰の時代」と断定すると解釈を固定しすぎるため、曖昧さを保持した。
- issue: 律法の働きが保護的か拘束的か
  choice: 「見張られ」と「閉じ込められていました」を併置した。
  alternative: 「守られ」「拘禁され」
  rationale: φρουρέω には守備・監視の幅があり、συγκλείω は拘束を強く示す。どちらか一面だけに限定せず、原文の緊張を残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文としての落ち着きと品位を保つ文体とした。「到来する」「明らかにされる」で救済史的な展開を示しつつ、専門用語や教派的な説明は本文に持ち込んでいない。
