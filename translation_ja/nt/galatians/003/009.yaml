id: GAL.3.9
reference: Galatians 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: ja
  text: ですから、信仰による人々は、信仰の人アブラハム[a]とともに祝福を受けるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忠実なアブラハム」または「信じたアブラハム」。
    reason: πιστός は、信じる者であることにも忠実であることにも理解できるため。
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から結論を導く推論の働きを、自然で明瞭な現代日本語で表す。
- source_word: οἱ ἐκ πίστεως
  choice: 信仰による人々
  rationale: ἐκ πίστεως の起点・基盤を示す表現と、人々を特徴づける力を保ちつつ、日本語として理解しやすくした。
- source_word: πίστεως
  choice: 信仰
  rationale: この文脈では、アブラハムのように信じることによって特徴づけられる人々を指すため、「信仰」とした。
- source_word: εὐλογοῦνται
  choice: 祝福を受ける
  rationale: 神から与えられる祝福という受動の意味を明確にし、現在形の一般的・継続的な効力を自然に表す。
- source_word: σὺν
  choice: とともに
  rationale: アブラハムと同じ祝福にあずかる共同性を、過度に説明せず表す。
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: 信仰の人アブラハム
  rationale: πιστός がこの文脈で「信じる者」と「忠実な者」の双方を含み得ることを踏まえ、信仰を中心とする議論に沿う自然な本文表現とし、別の含意は脚注に残した。
theological_decisions:
- issue: アブラハムにかかる πιστός を、信じる者と忠実な者のどちらに重点を置いて訳すか
  choice: 信仰の人アブラハム
  alternative: 忠実なアブラハム／信じたアブラハム
  rationale: ガラテヤ3章の直近の論旨はアブラハムが信じたことを中心とするが、πιστός には「忠実な」の意味もある。本文では文脈上の信仰との連関を示し、語義の幅を脚注で保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「信仰による人々」は原文の οἱ ἐκ πίστεως の特徴づけを保ち、「祝福を受ける」で受動の意味を自然に示した。
