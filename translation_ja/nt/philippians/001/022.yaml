  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: ja
  text: しかし、肉体にあって[a]生き続けることが、私にとって実りある働き[b]となるのであれば――何を選ぶのか、私には分かりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉にあって」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「働きの実」。または「実り豊かな働き」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: 生き続けること
  rationale: 冠詞付き不定詞が、現在の地上での生が続くことを指す文脈なので、継続性を自然な日本語で示した。
- source_word: ἐν σαρκί
  choice: 肉にあって
  rationale: ここでのσάρξは罪深い性質ではなく、死と対比された地上の身体的生を指す。パウロ特有の語感を保つため「肉」を本文に残した。
- source_word: καρπὸς ἔργου
  choice: 実りある働き
  rationale: 直訳的には「働きの実」である圧縮された表現を、καρπόςとἔργονの両要素を保ちながら明瞭な日本語にした。
- source_word: αἱρήσομαι
  choice: 選ぶか
  rationale: 二つの可能性のいずれを選ぶのかという意味。日本語では未来時制を明示せずとも文脈上十分である。
- source_word: οὐ γνωρίζω
  choice: 私には分かりません
  rationale: γνωρίζωには「知らせる」の語義もあるが、この文脈では話者自身の判断のつかなさを表す。
theological_decisions:
- issue: この節におけるσάρξの意味
  choice: 身体を伴う地上の生（「肉にあって」）
  alternative: 罪深い性質
  rationale: 文脈は、地上で生き続けることと、世を去ってキリストと共にいることを対比しているため、道徳的腐敗ではなく身体的存在を指す。
- issue: 条件節と後続句の統語的な緊張
  choice: ダッシュを用い、「のであれば――どちらを選ぶか」と訳す
  alternative: 「それなら」などの帰結表現を補い、滑らかな条件文にする
  rationale: ギリシア語は圧縮され、文のつながりに不連続さがある。「それなら」を補って論理関係を確定せず、原文のためらいと統語的緊張を残した。
translation_notes:
  register: 現代の一般読者に通じる丁寧で格調ある文体。「肉にあって」はパウロの用語感を保持しつつ、脚注で身体的生という意味を補う。原文の圧縮された構文とためらいはダッシュで表現した。
