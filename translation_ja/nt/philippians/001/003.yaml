lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: 感謝しています
  rationale: 現在・能動・直説法一人称単数。継続的な感謝を自然な現代日本語で表す。
- source_word: τῷ θεῷ μου
  choice: 私の神に
  rationale: εὐχαριστέωが取る与格を日本語の助詞「に」で表し、所有代名詞も保持する。
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: 思い起こすたびに
  rationale: ἐπί＋与格が示す感謝の機会・時を、「たびに」で自然に表す。πάσῃの反復・分配的な意味も伝わる。
- source_word: μνείᾳ
  choice: 思い起こす
  rationale: ここでは「言及」よりも「想起」の意味が文脈に適合する。日本語では名詞形より動詞形のほうが明瞭で自然。
- source_word: ὑμῶν
  choice: あなたがたのことを
  rationale: 複数二人称を明示し、想起の対象を自然な日本語で示す。
