id: PHP.1.8
reference: Philippians 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: ja
  text: 実に、私がメシアであるイエス[b]の深い愛情[a]をもって、あなたがたすべてをどれほど慕っているかについては、神が私の証人です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「深い慈しみ」。原語は字義的には「内臓」を指し、心の奥底からの情愛や憐れみを表します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「キリスト・イエス」。
    reason: alternative_rendering
lexical_decisions:
- source_word: μάρτυς
  choice: 証人
  rationale: 「神が私の証人です」という厳粛な訴えとして、パウロの真実さを神が保証するという原文の慣用表現を明瞭に保つ。
- source_word: γάρ
  choice: 実に
  rationale: 直前の言葉を受けてその真実さを強く裏づける接続辞として、日本語では「実に」が自然である。単純な理由提示に限定せず、文脈上の説明・確証の働きを表す。
- source_word: ὡς
  choice: どれほど
  rationale: 慕う思いの内容だけでなく、その強さを示す用法を自然な日本語で表す。
- source_word: ἐπιποθῶ
  choice: 慕っている
  rationale: 離れた相手に会いたいと切望する、強く親愛に満ちた思いを、現代日本語で自然かつ品位ある形で示す。
- source_word: πάντας ὑμᾶς
  choice: あなたがたすべて
  rationale: πάνταςの包括的な強調を省かずに表す。
- source_word: σπλάγχνοις
  choice: 深い愛情
  rationale: 字義的には内臓を指し、そこから心の奥底の情愛や慈しみを意味する語である。「深い愛情」は身体部位の不自然な直訳を避けつつ、感情の深さを保つ。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を「メシア」で明示しつつ、日本語で人物を自然に指す形とした。伝統的な「キリスト・イエス」は脚注に示す。
theological_decisions:
- issue: パウロ書簡のΧριστοῦ ἸησοῦにおけるΧριστόςの表現
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: この結合が固有名に近い響きを持つ可能性を認めつつ、Χριστόςの称号としての意味を本文で可視化する。伝統的で名称化した表現も脚注に残し、解釈上の幅を隠さない。
- issue: 「メシアであるイエスの深い愛情」の関係
  choice: 所有・源泉のどちらにも限定しない表現
  alternative: メシアであるイエスが抱くのと同じ深い愛情
  rationale: ἐν σπλάγχνοις Χριστοῦ Ἰησοῦは、イエスに属する愛情、イエスから来る愛情、またはイエスの愛情に参与することを含みうる。本文では一つに限定して補足説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神を証人として呼ぶ厳粛さと、パウロの強い親愛の情を保った。「メシア・イエス」という硬い連結を避け、「メシアであるイエス」として称号の意味を明確にした。
