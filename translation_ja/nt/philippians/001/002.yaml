id: PHP.1.2
reference: Philippians 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: ja
  text: 私たちの父である神と、主イエス・キリスト[a]から、あなたがたに恵みと平安がありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア（油注がれた者）」の意。
    reason: Χριστόςが定着した呼称としても称号としても読めることを示すため。
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの挨拶における標準的な語であり、神の好意と賜物という含みを簡潔に保つ。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数形の与格を明示し、祝福を受ける相手を自然な日本語で表す。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在を超えた健やかさを含む聖書的な挨拶として、自然で定着している。
- source_word: ἀπὸ
  choice: から
  rationale: 恵みと平安の源を示す前置詞を直接的に訳す。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 私たちの父である神
  rationale: πατρὸς ἡμῶνをθεοῦと同格に取り、『神、すなわち私たちの父』という関係を明瞭かつ自然に表す。
- source_word: κυρίου
  choice: 主
  rationale: イエスに対する称号としてのキュリオスの敬意とキリスト論的な重みを保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語で広く定着した固有名・称号の形を採りつつ、Χριστόςの語義上の別訳を脚注で示す。
theological_decisions:
- issue: Χριστοῦが称号『メシア』か、名前に近い定着形『キリスト』か
  choice: キリスト
  alternative: メシア
  rationale: この定型的な書簡挨拶ではΧριστόςは名前に近い用法とも称号とも理解できる。本文では現代日本語で定着した『キリスト』を用い、称号としての語義を脚注に残す。
- issue: ἀπόが神と主イエス・キリストの双方を恵みと平安の源として結ぶこと
  choice: 『神と、主イエス・キリストから』と並列する
  alternative: 神だけを直接の源と見なし、主イエス・キリストとの関係を弱く訳す
  rationale: 単一のἀπόがκαίで結ばれた二者を支配するギリシア語の自然な構造を保ち、両者を恵みと平安の源として提示する。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。原文で省略されている挨拶の願望表現を、日本語として完結させるため『ありますように』で補った。
