source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: ja
  text: 私はこう祈っています。あなたがたの愛が、知識とあらゆる識別力[a]において、ますます豊かになりますように。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あらゆる洞察力」または「あらゆる道徳的感受性」。
    reason: lexical_alternative
  - marker: b
    text: 「知識とあらゆる識別力を伴って、ますます豊かになりますように」とも訳せる。ギリシア語の前置詞は、密接に伴う関係を表すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο προσεύχομαι
  choice: 私はこう祈っています
  rationale: καίは直前の文脈とのつながりを担うが、日本語では独立した「そして」を置かずとも自然に継続が伝わる。τοῦτοは後続のἵνα節を指すため「こう」とし、現在形は継続する祈りを自然な「祈っています」で表した。
- source_word: ἵνα
  choice: ～ますように
  rationale: 祈りの内容と願いを導く用法を、日本語の祈願表現で自然に示した。
- source_word: ἡ ἀγάπη ὑμῶν
  choice: あなたがたの愛
  rationale: 属格ὑμῶνをそのまま保ち、愛の対象を本文が明示していない点も維持した。
- source_word: ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ
  choice: ますます豊かになります
  rationale: 反復された比較表現による継続的な増大と、περισσεύωの豊かに満ちる含意を、明快で自然な日本語にした。
- source_word: ἐν ἐπιγνώσει
  choice: 知識…のうちに
  rationale: ἐνの領域・関連を表す可能性を保持した。ἐπίγνωσιςを「深い知識」と強めることは避け、簡潔に「知識」とした。
- source_word: πάσῃ αἰσθήσει
  choice: あらゆる識別力
  rationale: αἴσθησιςはここで単なる感覚より、実践的・道徳的に見分ける力を指す。「あらゆる」はπάσῃの広がりを表す。
theological_decisions:
- issue: 愛と知識・識別力との関係
  choice: 「知識とあらゆる識別力のうちに」
  alternative: 「知識とあらゆる識別力を伴って」
  rationale: ἐνが領域・範囲を示すのか、密接な随伴を示すのかには幅があるため、本文では形式を比較的保ち、随伴の可能性を脚注で示した。
translation_notes:
  register: 明快な現代標準語を用いながら、祈りにふさわしい落ち着いた文体とした。「識別力」は日常語よりやや改まった語だが、文脈上の実践的・道徳的判断力を簡潔かつ正確に伝える。脚注記号は、それぞれ対応する語句・文末に配置した。
