    issue: τολμᾶνとἀφόβωςの訳し分け
    rationale: 「勇気をもって、恐れることなく」は、両者をともに恐れ・勇気の語で表すため、τολμᾶνの「あえて行う／大胆に踏み出す」という動詞的なニュアンスが薄れます。「あえてことばを語る」とすることで、ἀφόβωςの「恐れることなく」と区別できます。
  revised_text: そして、兄弟たち[a]の大多数は、私の鎖のゆえに主にあって確信を得て、いっそう恐れることなく、あえてことばを語るようになりました。
