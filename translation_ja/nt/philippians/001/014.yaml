id: PHP.1.14
reference: Philippians 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: ja
  text: そして、兄弟たち[a]の大多数は、私の鎖のゆえに主にあって確信を得て、いっそう恐れることなく、あえてことばを語るようになりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ここでは、女性を含む信者仲間を広く指している可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς πλείονας
  choice: 大多数は
  rationale: 定冠詞と部分属格「兄弟たちの」を伴うため、単なる比較の「より多く」ではなく、「大多数」「大半」の意味を表す。
- source_word: τῶν ἀδελφῶν
  choice: 兄弟たち[a]
  rationale: ギリシア語の男性複数形を本文で保ちつつ、この呼称が女性を含む信者仲間を広く指し得ることを脚注で明示した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロに特徴的な表現を保ち、確信が置かれる領域または基盤を示す曖昧さを残した。
- source_word: πεποιθότας
  choice: 確信を深め
  rationale: 完了分詞が示す、確信に至って今もその状態にあるという結果的・継続的な意味を、自然な日本語で表した。
- source_word: τοῖς δεσμοῖς μου
  choice: 私の鎖のゆえに
  rationale: δεσμοίの具体的な「鎖」という比喩的・換喩的表現を残し、文脈上の原因を「ゆえに」で示した。
- source_word: περισσοτέρως
  choice: ますます
  rationale: 比較の強まりを簡潔で自然な日本語にした。
- source_word: τολμᾶν
  choice: 勇気をもって……語るようになりました
  rationale: 危険を承知で行動する大胆さを表す動詞の意味を保ち、後続する不定詞との関係を自然な日本語にした。
- source_word: ἀφόβως
  choice: 恐れることなく
  rationale: 単なる大胆さではなく、恐れの不在を明示する副詞の意味を直接表した。
- source_word: τὸν λόγον
  choice: ことば
  rationale: 文脈上は福音の宣教内容を指すと考えられるが、原文にない「神の」や「福音の」を本文に補わず、λόγοςの表現を保った。
- source_word: λαλεῖν
  choice: 語る
  rationale: 一般的な発話を表す動詞なので、「宣べ伝える」など原語より強い宣教用語を避けた。
theological_decisions:
- issue: ἀδελφοίの指示範囲
  choice: 本文は「兄弟たち」とし、脚注で女性を含む可能性を示す
  alternative: 「兄弟姉妹たち」または「信者たち」
  rationale: 原文の文法上の男性複数形を保持しながら、初期キリスト教共同体への呼びかけとして男女双方を含み得る語用論的範囲も隠さないため。
- issue: 確信と「主にあって」の関係
  choice: 「主にあって確信を深め」として結び付ける
  alternative: 「主によって確信を深め」
  rationale: ἐν κυρίῳを手段に限定せず、確信の領域・基盤を表すパウロ的表現として保持した。
- issue: τοῖς δεσμοῖς μουの意味関係
  choice: 「私の鎖のゆえに」と原因として訳す
  alternative: 「私の鎖によって」または「私が鎖につながれているのを見て」
  rationale: 与格は文脈上、彼らが確信を深めた契機・原因を示すと理解できるが、観察行為など原文にない要素は加えなかった。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。「主にあって」「鎖」「ことば」は原文の神学的・具体的表現を保つためやや聖書的な語感を残し、文全体は普通の読者にも理解しやすい語順に整えた。
