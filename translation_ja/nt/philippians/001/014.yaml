  rationale: τολμᾶνを「あえて」、ἀφόβωςを「恐れることなく」と訳し分け、原文の二重の強調を保持しました。「確信を得て」は完了分詞が示す、確信に至りその状態にあることを自然な日本語で表します。脚注アンカーおよび脚注内容は適切なため維持しました。
