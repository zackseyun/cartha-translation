id: PHP.1.29
reference: Philippians 1:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: ja
  text: というのも、あなたがたには、メシア[a]のために、彼を信じる[b]ことだけでなく、彼のために[c]苦しむことも、恵みとして与えられたのです。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語 Χριστός は「油を注がれた者」を意味する称号。
    reason: lexical_alternative
  - marker: b
    text: または「彼に信頼する」。
    reason: lexical_alternative
  - marker: c
    text: または「彼のゆえに」。
    reason: lexical_alternative
  - marker: d
    text: 「メシアのために」は、信じることと苦しむことの両方を含む全体にかかるとも理解できる。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: というのも
  rationale: 直前の内容に理由・説明を加える接続語として、現代日本語で自然に読める形にした。
- source_word: ἐχαρίσθη
  choice: 恵みとして与えられた
  rationale: 単に許可されたという意味ではなく、無償で恵み深く授けられたという χαρίζομαι の含意を保つ。
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: メシアのために
  rationale: ὑπέρ が表す、メシアとの関係、そのゆえ・ためという意味を簡潔に示す。Χριστός はここでは称号として「メシア」とした。
- source_word: πιστεύειν εἰς αὐτόν
  choice: 彼を信じる
  rationale: 人物に信を置くことを表す構文を、明瞭で一般的な日本語にした。
- source_word: πάσχειν
  choice: 苦しむ
  rationale: 動詞の直接的な意味を弱めず、簡潔に保つ。
- source_word: ὑπὲρ αὐτοῦ
  choice: 彼のために
  rationale: 彼のゆえに、また彼のために苦しむという ὑπέρ の意味を自然な日本語で表す。
theological_decisions:
- issue: 信じることと苦しむことの双方が恵みとして与えられたという表現
  choice: 二つをともに「恵みとして与えられた」の範囲に置く
  alternative: 苦しみは単に許された、または信仰だけが賜物であるように訳す
  rationale: ギリシア語では οὐ μόνον ... ἀλλὰ καί によって二つの不定詞句がともに ἐχαρίσθη にかかるため、その神学的緊張を弱めずに保持した。
- issue: τὸ ὑπὲρ Χριστοῦ の統語的な係り方
  choice: 本文では「メシアのために」とし、信じることと苦しむことを含む賜物全体に関係する配置にする
  alternative: 後半の「苦しむこと」だけにかかるように読む
  rationale: 冠詞付き句が後続する二つの不定詞句を導く見出し的・総括的な働きを持つ可能性を反映しつつ、日本語ではその関係を過度に断定せず脚注で補った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「恵みとして与えられた」により原文の恩恵的な語感を明示し、信仰と苦難の双方が授けられたという逆説をそのまま残した。
