id: PHP.1.6
reference: Philippians 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: ja
  text: 私は、まさにこのことを確信しています。あなたがたの間で良い働きを始められた方は、メシア・イエスの日までに、それを成し遂げてくださいます。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたのうちに」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「キリスト・イエス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς αὐτὸ τοῦτο
  choice: 私は、まさにこのことを確信しています
  rationale: 周囲の文脈に結びつく分詞を、日本語では自然な独立文として表し、αὐτὸ τοῦτο の強意も「まさにこのこと」で保持した。
- source_word: ὁ ἐναρξάμενος
  choice: 始められた方
  rationale: 定冠詞付き分詞の人格的な主語を保ちつつ、神を指すことを本文で説明的に補わない表現とした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: ὑμῖν は複数であり、フィリピの共同体への呼びかけであるため、共同体的な含みを自然に表した。ただし「あなたがたのうちに」も可能なので脚注に示した。
- source_word: ἔργον ἀγαθὸν
  choice: 良い働き
  rationale: 語義を過度に特定せず、簡潔に原文を反映した。
- source_word: ἐπιτελέσει
  choice: それを成し遂げてくださいます
  rationale: 開始された働きを最後まで完成させる意味を明瞭にし、暗黙の主語が神であることにふさわしい敬語を用いた。
- source_word: ἄχρι ἡμέρας
  choice: その日までに
  rationale: 終点までの継続と、その時までに完成へ至ることの双方を自然な日本語で表した。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστός の称号としての意味を「メシア」で示し、固有名との結びつきを中黒で明確にした。
theological_decisions:
- issue: 神の良い働きの範囲を個人的と取るか共同体的と取るか
  choice: 本文では「あなたがたの間で」とし、共同体的な読みを前面に出す
  alternative: 「あなたがたのうちに」として、各人の内面または共同体内部のどちらにも読めるようにする
  rationale: 複数代名詞と書簡の共同体的文脈を尊重しつつ、個人的適用を否定しないよう代案を脚注に残した。
- issue: ἄχρι ἡμέρας が完成の過程の終点か完成期限か
  choice: 「その日までに」として、完成がその日までに実現する含みを表す
  alternative: 「その日まで」とし、継続の終点をより形式的に示す
  rationale: ἄχρι の終点の意味を保ちながら、日本語で「成し遂げる」がその日まで延々続いて止まるという誤解を避けた。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準語を用いた。「方」「くださいます」により、本文が暗に神を主語としていることに適した敬意を表しつつ、「神」と明示する説明的補足は避けた。
