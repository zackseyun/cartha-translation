  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: ja
  text: しかし、私はこの二つの間で板挟みになっています。世を去って[a]キリストと共にいたいという願いを持っているのです。そのほうが、はるかに良いのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「去ること」。文脈上、死ぬことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέχομαι
  choice: 板挟みになっています
  rationale: 二つの選択肢によって両側から圧迫され、身動きが取りにくい状態を、自然な現代日本語で表す。単なる心理的な迷いに限定しない。
- source_word: ἐκ τῶν δύο
  choice: この二つの間で
  rationale: 直訳的には「二つから」だが、文脈では前節までに示された二つの選択肢の間で圧迫されていることを指す。
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: 願いがある
  rationale: ἐπιθυμίαという名詞を反映しつつ、日本語として過度に硬くならない表現にした。
- source_word: ἀναλῦσαι
  choice: 世を去って
  rationale: 語の基本的な比喩表現である「去る」を保ち、文脈上の死を自然に示す。「死ぬ」と明示して原文以上に限定することは避ける。
- source_word: σὺν Χριστῷ εἶναι
  choice: キリストと共にいたい
  rationale: σύνの共同・同伴の意味と、εἶναιの単純な存在表現をそのまま保つ。Χριστόςは日本語で定着した称号「キリスト」とする。
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: そのほうが、はるかに良いのです
  rationale: 重ねられた比較の強調を「はるかに良い」で自然に表し、比較対象を「そのほう」で明確にする。
theological_decisions:
- issue: 死後にキリストと共にいることの含意
  choice: 世を去ってキリストと共にいたい
  alternative: 死んですぐ天国へ行き、キリストと共にいたい
  rationale: 原文が明言する「去ること」と「キリストと共にいること」だけを訳し、その時期や場所について本文にない教理的説明を加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロが二つの選択肢に圧迫されている緊張と、「去る」という婉曲的表現を保持した。「板挟み」は口語的すぎず、一般読者にも直ちに理解できる表現である。
