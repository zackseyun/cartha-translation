  source_fidelity: 「板挟みになっています」は、二つの選択肢から圧迫されている συνέχομαι ἐκ τῶν δύο を明快に表している。「世を去って」「キリストと共にいる」「はるかに良い」も、死後の場所や時期を教理的に補わず、原文の表現と強調をよく保っている。ただし、τὴν ἐπιθυμίαν ἔχων は主節に伴う分詞であり、「願いがあるからです」と因果関係を明示するより、「願いを持っているのです」とするほうが構文上の関係を過度に限定しない。
  naturalness: 全体として自然な現代標準日本語である。「世を去ってキリストと共にいたいという願いを持っているのです」とすれば、因果を強めず、文の流れも自然になる。
  terminology: 「キリスト」は日本語で定着した Χριστός の訳語として適切である。「世を去る」は ἀναλῦσαι の婉曲表現を保つ。「板挟み」はやや日常的だが、ここでは二つの相反する方向からの圧迫を分かりやすく伝えており、本文の登録に適する。
