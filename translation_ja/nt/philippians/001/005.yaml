translation:
  language: ja
  text: あなたがたが最初の日から今に至るまで、福音のために協力してきたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「福音に共にあずかってきた」。ギリシア語の表現は、福音に関する共同の参与を指すとも、福音を目的とした協力を指すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: あなたがたが…共にあずかってきたからです
  rationale: ἐπί＋与格の原因・根拠を「からです」で表し、κοινωνίαを単なる親しい交わりではなく、ピリピの信徒たちによる継続的な共同参加として自然な日本語にした。名詞句を動詞表現にすることで意味を明確にしている。
- source_word: εἰς τὸ εὐαγγέλιον
  choice: 福音に
  rationale: εἰςが示し得る福音との関わり・参加の領域を簡潔に表した。ただし、目的を示す「福音のために」も可能なので脚注に残した。
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: 初めの日から
  rationale: ピリピの信徒たちの参加が始まった時点を、原文に即して端的に表す。
- source_word: ἄχρι τοῦ νῦν
  choice: 今に至るまで
  rationale: 開始時点からパウロの現在まで継続していることを、格調を保ちつつ現代日本語で自然に示す。
theological_decisions:
- issue: κοινωνίαとεἰς τὸ εὐαγγέλιονの関係
  choice: 福音に共にあずかる
  alternative: 福音のために協力する
  rationale: 本文では福音を共有し、それに参与するという幅を保った。宣教への金銭的・実際的支援は文脈上含まれ得るが、「働く」「献金する」などに限定せず、目的の読みは脚注で明示した。
translation_notes:
  register: 明快で現代的な標準語を用いながら、「今に至るまで」で聖書本文にふさわしい落ち着いた格調を保った。前後の文に続く理由節として「からです」とした。
