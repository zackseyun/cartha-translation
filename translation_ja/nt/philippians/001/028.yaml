source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: ja
  text: また、反対する者たちに、少しもひるむことなく[a]。このことは、彼らにとっては滅びのしるし[b]、あなたがたにとっては救いのしるしです。そして、これは神からのことです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「おびえてはなりません」「威圧されてはなりません」。
    reason: lexical_alternative
  - marker: b
    text: 「しるし」は「証拠」または「徴候」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「これは神からのことです」の「これ」は、特に「あなたがたの救い」を指すとも、ここまで述べられたしるし全体を指すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: おびえてはなりません
  rationale: この動詞は、驚かされて恐れること、また威圧されることを表す。文脈上、反対者を前にしてひるまないよう求める表現として、現代日本語で自然な「おびえる」を採った。
- source_word: ἐν μηδενί
  choice: どんなことでも
  rationale: 字義的には「何一つにおいても」であり、恐れの理由や局面を一切限定しない強い否定を保つ。
- source_word: ὑπὸ τῶν ἀντικειμένων
  choice: 反対する者たちに
  rationale: 現在分詞の継続的な対立の含みを、人物を明示する自然な日本語で表した。受動的な動詞との関係も助詞「に」で示した。
- source_word: ἔνδειξις
  choice: しるし
  rationale: 証拠・徴候・表示を意味する語である。「しるし」は、恐れない態度が霊的な現実を指し示すという意味を、断定しすぎず簡潔に伝える。
- source_word: ἀπωλείας
  choice: 滅び
  rationale: 破滅や終局的な喪失を表す語で、ここでは裁きの含意を保ちながら、原文以上にその様態を限定しない。
- source_word: σωτηρίας
  choice: 救い
  rationale: パウロ書簡における神の救済という神学的な重みを保ち、日本語聖書として自然な語を用いた。
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: そして、これは神から出たことです
  rationale: 指示語「これ」を明示しつつ、「神から」という起源を自然な日本語で表した。何を指すかは本文で狭く限定していない。
theological_decisions:
- issue: τοῦτο（「これ」）の指示対象
  choice: 「これは神から出たことです」とし、指示対象を本文では限定しない。
  alternative: 「これ」を特に「あなたがたの救い」のみ、または恐れない態度が示すしるし全体に結び付ける。
  rationale: ギリシア語では指示対象に幅があり、救いだけを指すとも、直前のしるし全体を指すとも理解できるため、その神学的な曖昧さを保持した。
- issue: ἔνδειξιςに対する滅びと救いの関係
  choice: 日本語では双方に「しるし」を補い、「彼らにとっては滅びのしるし、あなたがたにとっては救いのしるし」とした。
  alternative: 後半を「しかし、あなたがたの救いです」として、救いそのものと読む。
  rationale: 原文では一つのἔνδειξιςが属格のἀπωλείαςとσωτηρίαςの双方を支配する構造が自然である。補語を反復して関係を明瞭にしつつ、救いを単なる心理的な解放にはしなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の厳粛さとパウロ書簡らしい神学的語彙を保った。「おびえてはなりません」は前節から続く分詞を、日本語の文として自立させるため禁止・勧告の形にした。「滅び」「救い」「神」は簡潔で格調を損なわない一般的な聖書語彙である。
