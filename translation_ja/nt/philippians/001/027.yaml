revisions:
- from: ただ、メシアの福音にふさわしく生活しなさい。[a] そうすれば、私が行ってあなたがたに会うにしても、離れているにしても、あなたがたについて、あなたがたが一つの霊のうちに堅く立ち、心を一つにして、福音の信仰のために共に戦っている、と聞くことができるでしょう。[b][c][d]
  to: ただ一つ、メシアの福音にふさわしく生活しなさい。[a] 私が行ってあなたがたに会う場合でも、離れている場合でも、あなたがたが一つの霊にあって堅く立ち、心を一つにして、福音への信仰のために共に奮闘していると、私が聞けるようにしなさい。[b][c][d]
  rationale: 目的を表すἵναを「私が聞けるようにしなさい」と訳し、パウロが望む報告内容を自然な日本語で示しました。「一つの霊」の聖霊か共同の精神かという曖昧さは本文と脚注で保ちました。さらに、συναθλοῦντες の共同の努力という比喩には「共に奮闘している」を用い、πίστει τοῦ εὐαγγελίου の属格関係は本文で最も自然な読みを採りつつ脚注で代案を示しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:46Z'
