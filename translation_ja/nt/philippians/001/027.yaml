id: PHP.1.27
reference: Philippians 1:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: ja
  text: ただ一つ、メシアの福音にふさわしく生活しなさい。[a] 私が行ってあなたがたに会う場合でも、離れている場合でも、あなたがたが一つの霊にあって堅く立ち、心を一つにして、福音への信仰のために共に奮闘していると、私が聞けるようにしなさい。[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生活しなさい」に当たるギリシア語には、「市民として生活しなさい」という含みがあります。
    reason: lexical_alternative
  - marker: b
    text: 「一つの霊」は、「一つの御霊」、すなわち聖霊を指すとも理解できます。
    reason: alternative_reading
  - marker: c
    text: 「心を一つにして」は、直訳では「一つの魂で」です。
    reason: lexical_alternative
  - marker: d
    text: 「福音への信仰のために」は、直訳に近くは「福音の信仰のために」です。「福音のために、信仰をもって共に奮闘している」と理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: ただ
  rationale: 文頭の限定と強調を簡潔に表し、この勧めを何より重視するよう促す働きを保つ。
- source_word: ἀξίως
  choice: ふさわしく
  rationale: 行動の仕方を修飾する副詞として、倫理的な適合性を自然な現代日本語で示す。
- source_word: πολιτεύεσθε
  choice: 生活しなさい
  rationale: 文脈上の中心義である共同体としての生き方を明瞭に表す。市民として暮らす含みは脚注で保持する。
- source_word: εὐαγγελίου
  choice: 福音
  rationale: パウロ書簡の用語として定着し、神学的な重みも保つ標準的表現。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは称号としての性格が明確なため、Χριστόςの原義を表す「メシア」とした。
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: あなたがたについて…と聞くことができる
  rationale: ギリシア語の慣用表現を自然な日本語にし、ἵναに続く期待・目的の流れも示す。
- source_word: στήκετε
  choice: 堅く立ち
  rationale: 単なる立位ではなく、揺るがず持ちこたえる意味を表す。
- source_word: ἐν ἑνὶ πνεύματι
  choice: 一つの霊のうちに
  rationale: 共同体の一致を指す可能性を保ちながら、聖霊を指す可能性も排除しない直訳寄りの表現。
- source_word: μιᾷ ψυχῇ
  choice: 心を一つにして
  rationale: ψυχήの共同の意志・思いという文脈的意味を、現代日本語で自然に表す。
- source_word: συναθλοῦντες
  choice: 共に戦っている
  rationale: 接頭辞συν-の共同性と、ἀθλέωに由来する競技・奮闘の比喩を簡潔に保持する。
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: 福音の信仰のために
  rationale: 属格構文の曖昧さを本文で過度に解消せず、「福音を信じる信仰」の可能性を脚注に示す。
theological_decisions:
- issue: πνεύματιが聖霊を指すか、信徒たちの共有する霊・精神を指すか
  choice: 一つの霊のうちに
  alternative: 一つの御霊のうちに
  rationale: 直後の「心を一つにして」との並行から共同の精神を指す可能性が高いが、聖霊への言及である可能性も残るため、本文では曖昧さを保ち脚注で明示する。
- issue: τῇ πίστει τοῦ εὐαγγελίουの属格関係
  choice: 福音の信仰のために
  alternative: 福音を信じる信仰のために／福音のために信仰をもって
  rationale: 「福音に関わる信仰」または「福音を信じる信仰」など複数の理解が可能なので、本文では形式を保ち、脚注で主要な代案を示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令の切迫感を保ちつつ、過度に古風な語法は避けた。「一つの霊」「福音の信仰」は原文の神学的・統語的曖昧さを残すため、やや形式対応的な表現とし、脚注で補った。
