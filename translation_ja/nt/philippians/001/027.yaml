  naturalness: 「一つの霊のうちに」および「福音の信仰のために」は現代日本語としてやや不自然です。「一つの霊にあって」とし、「福音への信仰のために」とすることで、本文を明瞭にしつつ、脚注で属格構文の別理解を保持できます。
  terminology: 「メシア」「福音」は適切です。「御霊」は解釈の一可能性として脚注に置くのが妥当です。
