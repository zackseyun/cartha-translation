    text: 別訳「信仰の喜び」または「信仰から生じる喜び」。
    reason: 属格 τῆς πίστεως が表す関係には複数の理解が可能であるため。
  revision_rationale: 原文の名詞句を「進展と…喜び」として保持し、「得る」という付加的な意味を除いた。μενῶ と παραμενῶ は「とどまり」と「共にとどまり続ける」で区別し、πᾶσιν ὑμῖν の「皆」を明示した。属格の曖昧さは本文と脚注の組合せで保持した。
