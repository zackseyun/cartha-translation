id: PHP.1.25
reference: Philippians 1:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: ja
  text: そして、このことを確信して、私は、あなたがた皆の進展と信仰における喜び[a]のために、とどまり、あなたがた皆と共にとどまり続けることを知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰の喜び」または「信仰から生じる喜び」。
    reason: 属格 τῆς πίστεως が表す関係には複数の理解が可能であるため。
lexical_decisions:
- source_word: πεποιθὼς
  choice: 確信している
  rationale: 完了分詞が表す、確信に至ってその状態にあるという継続的な意味を、自然な現代日本語で示した。
- source_word: μενῶ
  choice: とどまって
  rationale: 未来形の「とどまる」を表し、続く παραμενῶ との語義上の違いを残した。
- source_word: παραμενῶ
  choice: あなたがた皆と共に居続ける
  rationale: 単に生き長らえるだけでなく、彼らのそばにとどまり続けるという複合動詞のニュアンスを明示した。
- source_word: πᾶσιν ὑμῖν
  choice: あなたがた皆と共に
  rationale: πᾶσιν を「皆」として明示し、与格が示す彼らとの関係的な同在を自然に表した。
- source_word: προκοπὴν
  choice: 前進し
  rationale: 前へ進むこと、進展を意味する語を、目的を表す日本語の節の中で自然に訳した。
- source_word: χαρὰν τῆς πίστεως
  choice: 信仰にある喜び
  rationale: 属格の関係を一つに限定せず、信仰と密接に結び付いた喜びとして自然に表現した。別の理解は脚注に残した。
- source_word: πίστεως
  choice: 信仰
  rationale: この文脈では、フィリピの信徒たちの信じる歩みを指す「信仰」が最も適切である。
theological_decisions:
- issue: χαρὰν τῆς πίστεως における属格の意味
  choice: 信仰にある喜び
  alternative: 信仰の喜び／信仰から生じる喜び
  rationale: 属格は、信仰に属する喜びとも、信仰から生じる喜びとも理解できる。本文では自然さを保ちつつ関係を限定しすぎず、より明示的な解釈を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「とどまって」と「共に居続ける」で二つの動詞を区別しつつ、不自然な直訳調を避けた。
