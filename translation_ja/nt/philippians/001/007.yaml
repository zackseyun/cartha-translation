  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: ja
  text: あなたがたすべてについて、私がこのように考えるのは当然です。私はあなたがたを心に留めているからです。[a] 私が鎖につながれているときにも、福音の弁明と確証においても、あなたがたは皆、私とともに恵みにあずかっているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたが私を心に留めているからです」。ギリシア語のこの部分は、どちらの意味にも取ることができます。
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: 当然のこと
  rationale: ここでは法的な「正しい」よりも、パウロが抱く思いが正当でふさわしいことを表す。現代日本語として自然で、倫理的な含みも保つ。
- source_word: φρονεῖν
  choice: このように考える
  rationale: 単なる思考だけでなく心構えや思いを含み得る語だが、直前の文脈を受ける指示表現とともに簡潔に訳した。
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: あなたがたすべてについて
  rationale: φρονεῖνと結びつき、彼らを代表するというより、彼らに関して抱く思いを表す。
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: 私はあなたがたを心に留めているからです
  rationale: 二つの対格を伴う不定詞構文には曖昧さがある。本文では直前のパウロの思いとのつながりが自然な読みを採用し、逆の読みを脚注に残した。
- source_word: δεσμοῖς
  choice: 鎖につながれている時
  rationale: 投獄という状況を示しつつ、δεσμοίの具体的な鎖のイメージを保った。
- source_word: ἀπολογίᾳ
  choice: 弁明し
  rationale: 福音に対する公的・場合によっては法的な弁護を表す。「弁明」は原語の性格を保ちながら日本語として通じる。
- source_word: βεβαιώσει
  choice: 確かなものとして示す
  rationale: 福音の真実性や確かさを立証し、確立する意味を自然な現代日本語で表した。
- source_word: συγκοινωνούς
  choice: 私とともに…あずかっている
  rationale: 共同参加を表す語であり、「仲間」だけに弱めず、属格τῆς χάριτοςとの関係を自然に示した。
- source_word: χάριτος
  choice: 恵み
  rationale: 神から与えられる恵みを示す主要な神学語として、標準的な訳語を用いた。文脈上、その恵みに伴う務めや苦難への共同参加も含み得る。
theological_decisions:
- issue: 「心に留める」節の統語的曖昧さ
  choice: 私はあなたがたを心に留めている
  alternative: あなたがたが私を心に留めている
  rationale: μεとὑμᾶςがともに対格で、どちらを不定詞ἔχεινの意味上の主語・目的語と取るかに曖昧さがある。本文はパウロの愛情を述べる直前の流れに合う読みを採り、成立する別解を脚注で明示した。
- issue: 「恵みにあずかる」の範囲
  choice: 限定せず「恵みにあずかっている」と訳す
  alternative: 宣教の務め、投獄、苦難に限定して説明する
  rationale: 文脈はパウロの投獄と福音の弁明・確証への参与を示すが、χάρις自体の範囲を訳文で一義的に限定せず、原文の神学的な広がりを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語文を日本語では区切りつつ、理由関係と「鎖」「福音の弁明・確証」「恵みへの共同参加」の流れを維持した。
