  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: ja
  text: それは、私が再びあなたがたのもとに行くことによって、メシアであるイエスにあってあなたがたが誇る理由が、私のゆえにますます増し加わるためです。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの誇り」または「あなたがたの誇ること」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「メシアであるイエスにあって」は、「誇る理由」ではなく「ますます増し加わる」に結び付けて理解することもできる。
    reason: syntactic_ambiguity
  - marker: c
    text: 「私のゆえに」は直訳では「私にあって」。また、「行くこと」は「訪れ」または「到来」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためです
  rationale: 前節の内容から生じる目的または結果を示す接続を、日本語として自然な形で表した。
- source_word: τὸ καύχημα ὑμῶν
  choice: あなたがたの誇り
  rationale: καύχημα は「誇ること」と「誇る理由・根拠」の両方を含み得る。「誇り」は日本語でその幅をある程度保てる。
- source_word: περισσεύῃ
  choice: ますます豊かになる
  rationale: 「増し加わる、満ちあふれる」という意味と、ἵνα に続く接続法の目的・期待の含みを文全体で表した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにある
  rationale: Χριστός の称号としての意味を「メシア」で示し、ἐν の結び付きを直訳に近い「にある」で保った。
- source_word: ἐν ἐμοὶ
  choice: 私のゆえに
  rationale: 直訳は「私にあって」だが、ここではパウロが彼らの誇りの契機・理由となる意味と解した。直訳の可能性は脚注に残した。
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: 私が再びあなたがたのもとに行くことによって
  rationale: παρουσία はここではパウロが再訪して彼らと共にいることを指す。「行くこと」は日本語で自然だが、「臨在・同席」という語義も脚注に示した。
theological_decisions:
- issue: Χριστός の訳し方
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστός の称号としての意味を読者に明示しつつ、日本語として不自然な「メシア・イエス」を避けた。
- issue: 誇りの位置付け
  choice: メシアであるイエスにあるあなたがたの誇り
  alternative: あなたがたの誇りが、メシアであるイエスにあって豊かになる
  rationale: ἐν Χριστῷ Ἰησοῦ を καύχημα と結び付ける自然なパウロ的表現として訳したが、ギリシア語の語順上は περισσεύῃ に結び付ける読みも文法的に可能であるため脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える文体とした。「誇り」は否定的な自慢に限定せず、喜びに満ちた誇りや誇る根拠を含む語として用いた。「メシアであるイエス」は称号の意味を保ちながら一般読者にも理解しやすい表現である。
