  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: ja
  text: 一方、ほかの人たちは利己的な野心からメシア[a]を宣べ伝えています。純粋な動機からではなく、私が獄中にいる間に私を苦しめようと考えているのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: alternative_reading
  - marker: b
    text: 直訳「私の鎖に苦しみを起こそうと考えている」。「鎖」はここでは投獄状態を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: 利己的な野心
  rationale: 自己追求的・党派的な対抗心を表す語であり、単なる「利己心」よりも野心と競争心を含む表現とした。
- source_word: Χριστόν
  choice: メシア
  rationale: ここでは宣べ伝える内容として、イエスの称号としての意味が前面に出ている。
- source_word: καταγγέλλουσιν
  choice: 宣べ伝えており
  rationale: 公に告げ知らせる意味を保ちつつ、現代日本語の聖書文体として自然な表現とした。
- source_word: οὐχ ἁγνῶς
  choice: 純粋な動機からではありません
  rationale: ἁγνῶςはここで行為の仕方より動機の純粋さを指すため、その含意を明示した。
- source_word: οἰόμενοι
  choice: 考えている
  rationale: 彼らの意図または思惑を自然に表す。
- source_word: θλῖψιν ἐγείρειν
  choice: さらに苦しめよう
  rationale: 直訳的な「苦難を起こす」ではなく、パウロの苦悩を増し加えようとする敵対的意図を自然な日本語で示した。
- source_word: τοῖς δεσμοῖς μου
  choice: 獄中につながれている私を
  rationale: δεσμοίの文字どおりの「鎖」を残しながら、それが投獄を指すことも本文で理解できるようにした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名のような用法よりも、宣教される者の称号としての用法が明瞭である。ただし日本語で定着した「キリスト」も可能なため脚注に示した。
- issue: θλῖψιν ἐγείρεινとτοῖς δεσμοῖς μουの関係
  choice: 獄中につながれている私をさらに苦しめよう
  alternative: 私の鎖に苦難を引き起こそう
  rationale: ギリシア語の構文には直訳上の硬さがあるため、投獄中のパウロに苦悩を加える意図として訳した。「さらに」は苦難を増すという文脈的含意を表す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「宣べ伝える」は教会外の読者にもおおむね理解可能な定着表現として用いた。動機の対照が分かるよう二文に分け、原文の敵対的意図と投獄の具体性を保った。
