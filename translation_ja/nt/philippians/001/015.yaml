base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: ja
  text: ある人たちはねたみと対抗心からメシアを宣べ伝え、ほかの人たちは善意から宣べ伝えています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: ある人たちは……ほかの人たちは
  rationale: 二つの集団を対比する不定代名詞と μέν … δέ の構造を、自然な現代日本語で明確に表す。
- source_word: διὰ φθόνον
  choice: ねたみから
  rationale: διά＋対格が表す動機・原因を簡潔に示す。
- source_word: ἔριν
  choice: 対抗心
  rationale: ここでは単なる争いそのものより、他者と張り合う競争的な動機を指すため、「対抗心」が文脈に適する。
- source_word: δι’ εὐδοκίαν
  choice: 好意から
  rationale: ねたみと対抗心に対置される善意ある動機を、意味を過度に限定せず自然に表す。
- source_word: τὸν Χριστόν
  choice: メシア
  rationale: 定冠詞を伴う Χριστός はここで称号として理解できるため、称号の意味を明示する「メシア」とする。
- source_word: κηρύσσουσιν
  choice: 宣べ伝えています
  rationale: 公に告げ知らせる κηρύσσω の意味を保ちつつ、聖書文体として自然で理解しやすい表現とする。
