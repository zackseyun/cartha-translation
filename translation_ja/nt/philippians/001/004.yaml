  source_fidelity: 「いつも」「あなたがたすべてのために」「喜びをもって」は、それぞれ πάντοτε、ὑπὲρ πάντων ὑμῶν、μετὰ χαρᾶςを正確に反映している。「祈るたびに」はἐν πάσῃ δεήσει μου（私のあらゆる祈り／願いにおいて）を自然な日本語に移したものであり、主語「私」も動詞形と文脈から無理なく補われる。末尾の「祈っています」はτὴν δέησιν ποιούμενοςの継続的な祈りを適切に表す。
