  text: πάντοτε ἐν πάσῃ δεήσει μου ὑπὲρ πάντων ὑμῶν, μετὰ χαρᾶς τὴν δέησιν ποιούμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/004.yaml
  text: always in every prayer of mine for all of you, praying with joy,
translation:
  language: ja
  text: いつも、あなたがたすべてのために祈るたびに、喜びをもって祈っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的・反復的な祈りを示す自然な現代日本語。
- source_word: ἐν πάσῃ δεήσει μου
  choice: 祈るたびに
  rationale: 直訳的な「私のすべての願いにおいて」の意味を、祈りの各機会を表す自然な日本語で伝える。δέησιςの嘆願的含意は文脈上「祈る」で十分に保持される。
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: あなたがたすべてのために
  rationale: ὑπέρの代祷的な「〜のために」と、πάντωνの包括性を明示する。
- source_word: μετὰ χαρᾶς
  choice: 喜びをもって
  rationale: 原文の前置詞句を、格調を保ちつつ明瞭に訳す。
- source_word: τὴν δέησιν ποιούμενος
  choice: 祈っています
  rationale: 字義は「願いをしている」だが、日本語では「祈る」が自然。分詞は主節（1:3以下）に付随する継続的行為として表す。
theological_decisions:
- issue: πάντων ὑμῶνの包括性
  choice: 「あなたがたすべて」と明示する
  alternative: 「あなたがた」とする
  rationale: フィリピ教会の全員を含むという本文の強調を省略しないため。
- issue: δέησιςの訳し分け
  choice: 「祈る」と訳す
  alternative: 「願い求める」「嘆願する」と訳す
  rationale: 嘆願の含意はあるが、ここでは日本語として自然な祈りの表現を優先し、特定の祈祷観を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語。原文の反復（δέησις…δέησιν）は、日本語で過度に硬くならないよう「祈るたびに…祈っています」と再現した。文脈上、1:3から続く一文の一部だが、提示節単独でも理解できる形にした。
