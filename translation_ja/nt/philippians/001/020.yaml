id: PHP.1.20
reference: Philippians 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: ja
  text: 私の切なる期待と希望にかなうとおり、私は何事においても恥を受けることはなく[a]、かえって、いつものように今も、十分な大胆さをもって、メシアは私の体において[b]、生きることによっても死ぬことによっても、あがめられるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私は何事においても恥じることはない」とも訳せる。
    reason: αἰσχυνθήσομαιは「恥を受ける」と「恥じる」のどちらにも理解し得るため。
  - marker: b
    text: 「私の体を通して」とも訳せる。
    reason: ἐν τῷ σώματί μουは、領域・場を示す「体において」のほか、手段を強調する訳も可能なため。
lexical_decisions:
- source_word: κατὰ
  choice: 〜のとおり
  rationale: 期待と希望に合致することを示す用法を、自然な日本語で表した。
- source_word: ἀποκαραδοκίαν
  choice: 切なる期待
  rationale: 身を乗り出すような強い待望を含む語の強意と将来への志向を簡潔に保った。
- source_word: ἐλπίδα
  choice: 希望
  rationale: パウロ書簡で一般的な、確信を伴う将来への希望を表す。
- source_word: ἐν οὐδενὶ
  choice: 何事においても〜なく
  rationale: いかなる点や状況でも例外がないという全面的な否定を表した。
- source_word: αἰσχυνθήσομαι
  choice: 恥を受けることなく
  rationale: 公に面目を失わされる受動的な含みを優先しつつ、文脈に合う自然な日本語とした。主体が恥じる意味も可能なため脚注に残した。
- source_word: παρρησίᾳ
  choice: 大胆さ
  rationale: 公然と恐れずに証しする姿勢を表す語として選んだ。πάσῃの強意は「あらん限りの」で示した。
- source_word: μεγαλυνθήσεται
  choice: あがめられるでしょう
  rationale: メシアが偉大な方として公に示され、尊ばれるという受動態の意味を、聖書的で理解しやすい表現にした。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここでは単なる固有名というより称号としての意味がなお認められるため、その意味を表に出した。
- source_word: ἐν τῷ σώματί μου
  choice: 私の体において
  rationale: パウロの生死を含む身体的な証しの場を示す表現を保った。手段を表す可能性は脚注に残した。
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: 生きることによっても死ぬことによっても
  rationale: διάと属格が示す手段・経路を保ち、生と死の均整ある対句を自然な日本語にした。
theological_decisions:
- issue: Χριστόςをパウロ書簡のこの箇所でどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この文ではイエスの称号としての意味がなお響いていると判断し、「油注がれた者」という称号性を伝える「メシア」を採用した。ただし「キリスト」も伝統的で可能な訳である。
- issue: 生または死によってメシアがあがめられる主体的関係
  choice: 受動態を保ち、メシアがあがめられるとした
  alternative: 私がメシアをあがめる
  rationale: 原文はμεγαλυνθήσεται Χριστόςという受動構文であり、パウロの行為だけに限定せず、彼の身体においてメシアの偉大さが示されるという緊張を保った。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で dignified な文体とした。「あらん限りの」はやや格調を保ちながらπάσῃの強意を自然に伝える。英語相談層の脚注は標識と内容の対応に不整合があるため、そのまま転写せず、ギリシャ語本文に実在する語義上の曖昧さに基づいて脚注を配置した。
