    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: 知ってほしいのです
  rationale: 「知ることを望む」という語順を自然な現代日本語の伝達表現にしつつ、パウロ自身の意向を保った。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは穏やかな話題転換を示すが、日本語では呼びかけと文脈によって十分に伝わり、明示すると不自然になりやすい。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文に保った。この呼びかけが信仰共同体全体を含み得ることは脚注で示した。
- source_word: τὰ κατ’ ἐμὲ
  choice: 私の身に起きたこと
  rationale: パウロをめぐる出来事や現在の境遇を指す幅のある表現を、明快で自然な日本語にした。
- source_word: μᾶλλον
  choice: かえって
  rationale: 予想に反して、パウロの境遇が福音の妨げではなく前進に結びついたという逆説的な成り行きを表す。
- source_word: εἰς προκοπὴν
  choice: 前進につながった
  rationale: ある結果へ至ったことを表す前置詞句を自然に訳し、福音が進展したという意味を保持した。
- source_word: τοῦ εὐαγγελίου
  choice: 福音
  rationale: 日本語で定着した簡潔で品位ある訳語を採用した。「良い知らせ」という語義的な別訳は脚注に示した。
- source_word: ἐλήλυθεν
  choice: つながった
  rationale: 完了形が示す、過去の出来事から生じて現在に及ぶ結果を、結果状態を含意する日本語で表した。
