id: PHP.1.1
reference: Philippians 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: ja
  text: パウロとテモテ、メシアであるイエス[a]の奴隷たち[b]から、監督者たち[c]と執事たちと共にピリピにいる、メシアであるイエスにあるすべての聖なる者たちへ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。ギリシア語「クリストス」は「油を注がれた者」、すなわち「メシア」という称号です。
    reason: alternative_reading
  - marker: b
    text: 文脈により「仕える者たち」または「僕たち」とも訳せます。原語は主人に属する奴隷を指す語です。
    reason: lexical_alternative
  - marker: c
    text: 「司教たち」とも訳せます。ここでの語が後代の司教職とどの程度同じ制度を指すかは、本文だけでは確定できません。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隷
  rationale: 所有と服従を伴う身分を表す語の強さを保つ。「僕」や「仕える者」より原語の拘束性が明瞭である。
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を訳しつつ、現代日本語で人名と誤認されにくい形にした。
- source_word: ἁγίοις
  choice: 聖なる者たち
  rationale: 神のために聖別された共同体という意味を保ち、「聖人」が帯びうる後代的・限定的な含意を避ける。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにある
  rationale: 場所だけでなく結びつきも示しうるパウロ特有のἐν表現を、解釈的に言い換えず保持する。
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: ピリピにいて
  rationale: 分詞句の所在を自然な日本語で明示する。
- source_word: σὺν
  choice: も含みます
  rationale: 監督者と執事が宛先に伴って含まれる関係を、自然な日本語で表す。
- source_word: ἐπισκόποις
  choice: 監督者たち
  rationale: 語の基本的意味を透明に示し、後代の教会制度を自動的に読み込ませる「司教」を本文では避ける。
- source_word: διακόνοις
  choice: 執事たち
  rationale: 監督者と並ぶ文脈では、一般的な奉仕者というより共同体内の認められた務めを指す可能性が高いため、定着した呼称を用いる。
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: すべての聖なる者たちへ
  rationale: πᾶσινの包括性と書簡の宛先表現を簡潔に保つ。
theological_decisions:
- issue: Χριστόςをパウロの書簡冒頭でどう訳すか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςが本来持つ油注がれた者という称号性を見える形で残す。ただし伝統的な「キリスト」も広く定着しているため脚注に示す。
- issue: δοῦλοιの身分的な強さ
  choice: 奴隷
  alternative: 仕える者／僕
  rationale: 献身的奉仕だけでなく、主に属して服従する身分を表す原語の緊張を弱めない。
- issue: ἐπίσκοποιとδιάκονοιが制度化された職名かどうか
  choice: 監督者たち／執事たち
  alternative: 司教たち／奉仕者たち
  rationale: 共同体内の役割らしさを示しながらも、後代の特定の教会制度と完全に同一視しない表現を選ぶ。
translation_notes:
  register: 現代の一般読者に理解できる明瞭で品位ある書簡調。原文には明示されない「私たち」などを補わず、冒頭の差出人と宛先を日本語の助詞で整理した。「奴隷」は強い語だが、原語の社会的・神学的緊張を保つため採用した。
