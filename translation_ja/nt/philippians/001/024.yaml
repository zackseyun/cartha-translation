  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: ja
  text: しかし、肉体をもって生き続けることのほうが、あなたがたのためには必要です[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「肉体にとどまり続けること」。
    reason: 「肉体をもって生き続けること」と訳したἐπιμένειν ἐν τῇ σαρκίの、より直訳的な表現を示す。ここでの「肉体」は、罪深い性質ではなく、身体をもつ地上の生を指す。
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: とどまること
  rationale: 定冠詞付き不定詞を名詞的に訳した。文脈上は地上で生き続けることを指すが、原文の簡潔さを保った。
- source_word: δὲ
  choice: しかし
  rationale: 前節の「世を去ってキリストと共にいる」こととの対照を明確に示す。
- source_word: ἐν τῇ σαρκὶ
  choice: 肉体に
  rationale: ここでのσάρξは罪深い性質ではなく、身体をもって地上で生きる状態を指す。「肉に」より自然な現代日本語とした。
- source_word: ἀναγκαιότερον
  choice: 必要です
  rationale: 比較級の比較対象は前節の、パウロ自身にとって望ましい「世を去ること」。日本語では「あなたがたのためには」と「ほうが」によって比較を保ちつつ、自然な述語とした。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのためには
  rationale: διά＋対格がここで表す、フィリピの信徒たちにとっての必要・益を自然に示す。助詞「は」で比較の観点も明確にした。
theological_decisions:
- issue: この節におけるσάρξの意味
  choice: 身体をもって地上で生きること（「肉体に」）
  alternative: 道徳的な意味での「罪深い性質の中に」、または説明的な「この世で生き続ける」
  rationale: 文脈では、キリストと共にいるために世を去ることと、フィリピの信徒たちのために現在の身体的生命を続けることが対比されている。道徳的意味は文脈に根拠がなく、「この世で生き続ける」だけではσάρξの身体性が見えにくい。
- issue: ἀναγκαιότερονの比較の力
  choice: 「ことのほうが……必要です」と比較を表す
  alternative: 「どうしても必要です」と絶対的な必要性として訳す
  rationale: 原文は比較級であり、前節で述べたパウロ自身にとっての望ましさとの緊張を残す必要がある。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「肉」では道徳的意味に誤解されやすいため「肉体」とし、原文の比較級は「ことのほうが」で保持した。
