translation:
  language: ja
  text: あなたがたは、以前私の身に見、今私について聞いているのと同じ戦いを経験しています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: 戦い
  rationale: 敵対や苦難の中で続ける真剣な闘争を表す。文脈に合い、現代日本語でも自然である。
- source_word: ἔχοντες
  choice: しています
  rationale: 直訳的な「持っている」よりも、日本語では「戦いをしている」とするのが自然で、現在進行中の状態を保てる。
- source_word: οἷον εἴδετε ἐν ἐμοὶ
  choice: かつて私について目にし
  rationale: ἐν ἐμοίを、彼の身に起きた戦いを見たという意味で「私について」と訳した。εἴδετεの過去とνῦνの対比を「かつて」で明示した。
- source_word: καὶ νῦν ἀκούετε ἐν ἐμοί
  choice: 今も私について耳にしている
  rationale: νῦνを「今も」とし、以前見た戦いが現在も続いている含意を自然に示す一方、原文にない目的語を補いすぎない。ἐν ἐμοίとの反復も保った。
theological_decisions:
- issue: 「同じ戦い」が指す範囲
  choice: 具体的内容を限定せず「同じ戦い」とした
  alternative: 福音のための迫害、投獄、あるいは信仰上の苦闘と明示する
  rationale: 直前の文脈は福音のための苦しみを示唆するが、この節自体はἀγώνの内容を一つに限定していないため、解釈上の幅を残した。
- issue: 現在も戦いが続くという含意
  choice: 「今も」で表した
  alternative: 「今、私について耳にしている」と時点だけを示す
  rationale: 対照は、過去に目撃したことと現在耳にしていることの間にある。「今も」は継続の含意を自然に伝えるが、「まだ持っている」など原文にない述語は補わなかった。
translation_notes:
  register: 明快で現代的な標準日本語。前節から続く分詞構文だが、単独の節として読めるよう主節化した。威厳を保ちつつ、不自然な直訳調を避けた。
