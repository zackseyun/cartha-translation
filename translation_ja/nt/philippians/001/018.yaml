id: PHP.1.18
reference: Philippians 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: ja
  text: それでは、どうなのか。ともかく、あらゆる仕方で、見せかけからであれ、真心からであれ[b]、メシア[a]が宣べ伝えられています。私はそのことを喜んでいます。そればかりか、これからも喜びます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。ギリシア語「クリストス」は「油を注がれた者」、すなわち「メシア」を意味します。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「口実によってであれ、真実によってであれ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: それでは、どうなのか
  rationale: パウロの短い修辞的な問いを、結論への転換として簡潔な現代日本語で表した。文脈上の含意を「何が問題なのか」と明示しすぎない。
- source_word: πλὴν ὅτι
  choice: ともかく
  rationale: 動機の相違を越えて肝要な点へ焦点を絞る表現として、自然な日本語を選んだ。
- source_word: παντὶ τρόπῳ
  choice: どのような仕方でも
  rationale: 「あらゆる仕方で」という分配的な意味を保ちつつ、後続する二つの対照を受けられる表現とした。
- source_word: προφάσει
  choice: 見せかけから
  rationale: 外に示す口実や不誠実さを表しながら、「悪意」など文脈上の動機を本文へ過度に持ち込まない。
- source_word: ἀληθείᾳ
  choice: 真心から
  rationale: προφάσειとの対照を自然な日本語で示す。「真理」を教理的内容として指すのではなく、偽りのない動機を指す文脈的用法と判断した。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここでは宣べ伝えられる称号として機能しているため、称号の意味を示す「メシア」とした。伝統的な「キリスト」は脚注に残した。
- source_word: καταγγέλλεται
  choice: 宣べ伝えられています
  rationale: 公に告知する意味、受動態、現在の継続的な様相を日本語で表した。
- source_word: ἐν τούτῳ χαίρω
  choice: 私はそのことを喜んでいます
  rationale: 喜びの根拠を直前の「メシアが宣べ伝えられている」事実に結びつけ、χαίρωの現在形を保った。
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: そればかりか、これからも喜びます
  rationale: ἀλλὰ καίの追加・強調とχαρήσομαιの未来を自然に表した。「喜び続ける」と継続相を断定するのは避けた。
theological_decisions:
- issue: Χριστόςを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名のように用いられるよりも、宣べ伝えられる者の称号として前面に出ている。意味を明示する「メシア」を本文に置き、教会用語として定着した「キリスト」を脚注に示した。
- issue: ἀληθείᾳが教理的な「真理」か、誠実な動機か
  choice: 真心から
  alternative: 真実によって／真実から
  rationale: εἴτε προφάσει εἴτε ἀληθείᾳという対句は、宣教内容より宣教者のあり方・動機を対照している。ただし具体的な善意の内容までは補わない。
translation_notes:
  register: 明瞭な現代標準語を用い、修辞的な問いと喜びの宣言には簡潔で dignified な調子を保った。「宣べ伝える」は聖書語として広く理解され、καταγγέλλωの公的告知の含意にも適する。
