id: PHP.1.10
reference: Philippians 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: ja
  text: 何がより優れているかを吟味し[a]、メシアの日に向けて[b]、純真で非難されるところのない者となるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何が大切かを吟味し」「優れたものを吟味し」。直訳に近くは「異なるものを吟味し」。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「キリストの日に向けて」。
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: 吟味し
  rationale: 試して確かめ、価値を認めるという評価の過程を表せる自然な現代日本語。単に知的に区別するだけでなく、検証に基づく判断という含みを保つ。
- source_word: τὰ διαφέροντα
  choice: 何がより優れているか
  rationale: 字義的には「異なるもの」だが、文脈では比較して優れたもの、重要なものを見定める意味が有力。「より」によって比較の含みを示しつつ、別の解釈は脚注に残す。
- source_word: εἰλικρινεῖς
  choice: 純真
  rationale: 道徳的な純粋さと偽りのない誠実さの両面を簡潔に表す。
- source_word: ἀπρόσκοποι
  choice: 非難されるところのない
  rationale: 終末の日を見据えた倫理的文脈に合う自然な表現。語には「つまずかない」「つまずきを与えない」という含みもあるが、ここでは対句全体として潔白なあり方を表すと判断した。
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: メシアの日に向けて
  rationale: εἰς の目標・方向性を「に向けて」で表し、Χριστόςが称号として働くため「メシア」とした。
theological_decisions:
- issue: 終末論的表現 εἰς ἡμέραν Χριστοῦ における Χριστοῦ の訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは「その日」を特徴づける称号的用法が明瞭なので、称号の意味を伝える「メシア」を本文に置く。日本語聖書で伝統的な「キリスト」は脚注に残す。
- issue: ἀπρόσκοποι の意味上の幅
  choice: 非難されるところのない
  alternative: つまずかない／人をつまずかせない
  rationale: 語は受動的にも能動的にも理解し得る。本文では εἰλικρινεῖς と並ぶ終末的な潔白さを自然に表すが、いずれかの方向だけに教理的意味を限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く目的節であることを「ためです」で示した。「吟味」は日常語として理解可能でありながら、試して価値を判断する原文の含みを保持する。
