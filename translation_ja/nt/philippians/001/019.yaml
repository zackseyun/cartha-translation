- from: というのも、私は知っているからです。このことが、あなたがたの祈りと、イエス・メシアの霊が与えてくださる助けによって、私の救い[a]に至ることを。
  to: というのも、私は、このことがあなたがたの祈りと、イエス・メシアの霊[b]の豊かな支えによって、私の救い[a]に至ることを知っているからです。
  rationale: 主節とὅτι節を一文に再結合して原文の構文と自然な日本語を回復した。「救い」は原語の解釈上の幅を保つ。ἐπιχορηγίας τοῦ πνεύματοςについては、本文の「霊の豊かな支え」によって一方の属格解釈を教義的・文法的に確定せず、対応する脚注bで両解釈を明示した。
