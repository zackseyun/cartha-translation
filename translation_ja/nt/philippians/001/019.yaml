review_pass:
  verdict: revise
  source_fidelity: 本文は主要語をおおむね適切に反映しているが、現行の「私は知っているからです。このことが…ことを」は、ὅτι節（「…ことを知っている」）を統語的に切り離しており、日本語として成立しない。また「霊が与えてくださる助け」はἐπιχορηγίας τοῦ πνεύματοςを一つの属格解釈に限定するため、本文では関係をより開いた形にするのが望ましい。
  naturalness: 現行文は「というのも」と「からです」が重なり、さらに「ことを」が文末に取り残されるため不自然である。理由節を一文にまとめれば、明瞭な現代標準日本語として自然になる。
  terminology: 「救い」はσωτηρίανの幅を保ち、「イエス・メシア」はΧριστοῦを称号として訳す方針に適合する。「霊の豊かな支え」はἐπιχορηγίαの供給・支援の含意を自然に表しつつ、霊が供給者か、霊が供給されるものかという属格関係を本文で確定しない。
  issues:
  - severity: high
    issue: ὅτι節に相当する「このことが…至ることを」が主節「私は知っている」と結び付かず、文として不完結である。
    rationale: οἶδα γὰρ ὅτι以下は「私は…ことを知っている」という一続きの構文である。現訳は「からです。」で主節を閉じた後に目的節を置くため、原文の統語関係も自然な日本語も損なう。
  - severity: medium
    issue: 「霊が与えてくださる助け」はἐπιχορηγίας τοῦ πνεύματοςを主語的属格として本文で固定している。
    rationale: この属格関係には、霊から来る供給と、霊そのものの供給という両方向の理解が論じられる。本文は「霊の豊かな支え」として開いた表現にし、注で両可能性を示すのが安全である。
  - severity: medium
    issue: 脚注aがσωτηρίανとπνεύματοςの両方を扱う一方、本文には「霊」の箇所に対応する脚注アンカーがない。
    rationale: 異なる原語上の論点は別アンカー・別脚注にする必要がある。救いの語義幅は「救い[a]」、属格関係は「霊[b]」にそれぞれ対応させる。
  revised_text: というのも、私は、このことがあなたがたの祈りと、イエス・メシアの霊[b]の豊かな支えによって、私の救い[a]に至ることを知っているからです。
