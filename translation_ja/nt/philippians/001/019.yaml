id: PHP.1.19
reference: Philippians 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: ja
  text: というのも、私は、このことがあなたがたの祈りと、イエス・メシアの霊[b]の豊かな支えによって、私の救い[a]に至ることを知っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救い」は、「解放」または「正しさが明らかになること」とも理解できる。
    reason: σωτηρίανは投獄という文脈では解放や正当性の証明を指しうる一方、より広い救いの含みも保つ。
  - marker: b
    text: 「イエス・メシアの霊の豊かな支え」は、「イエス・メシアの霊からの豊かな支え」とも、「イエス・メシアの霊が豊かに与えられること」とも理解できる。
    reason: ἐπιχορηγίας τοῦ πνεύματοςの属格関係には、霊が供給者である理解と、霊が供給されるものという理解の両方がありうる。
lexical_decisions:
- source_word: οἶδα
  choice: 私は知っている
  rationale: 完了形ながら現在の意味を持ち、パウロの確信を自然な現代日本語で表す。
- source_word: τοῦτό
  choice: このこと
  rationale: 直前まで述べられた状況全体を指す単数指示語の広がりを保ち、内容を限定しすぎない。
- source_word: ἀποβήσεται εἰς
  choice: 〜に至る
  rationale: 結果を表す構文を、日本語として自然で格調のある形にした。
- source_word: σωτηρίαν
  choice: 救い
  rationale: 投獄からの解放、正しさの証明、より広い救済という語義上・文脈上の幅を、日本語で最もよく保持する。
- source_word: δεήσεως
  choice: 祈り
  rationale: 切なる願いを含むが、現代日本語で明瞭かつ自然な訳語である。
- source_word: ἐπιχορηγίας
  choice: 与えてくださる助け
  rationale: 供給・支援という意味を自然に表し、属格を『霊が与える』という主語的な関係として示す一方、その解釈は注記する。
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: イエス・メシアの霊
  rationale: 属格の基本的な形を保ち、Χριστόςを称号として『メシア』と訳した。
theological_decisions:
- issue: σωτηρίανが指す救いの性質
  choice: 本文では『救い』として意味の広がりを保持する
  alternative: 『解放』または『正しさが明らかになること』
  rationale: 投獄という文脈では現状からの解放や正当性の証明が想定されうるが、この語にはより広い救済の響きもあるため、一つに限定しない。
- issue: ἐπιχορηγίας τοῦ πνεύματοςの属格関係
  choice: 霊が助けを与えるという主語的属格として表現する
  alternative: 霊そのものが与えられるという目的語的属格
  rationale: どちらも文法的に論じうる。本文では文脈上自然な『霊による助け』を採りつつ、別解を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、書簡にふさわしい dignified な調子を保った。文頭のγάρは『というのも』、文末の理由提示は『からです』で表した。Χριστόςは固有名化した『キリスト』ではなく称号として『メシア』とした。
