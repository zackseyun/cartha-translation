reference: Philippians 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: ja
  text: メシアであるイエス[b]を通して結ばれる義の実[a]に満たされ、神の栄光と賛美のためにあることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義の実」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「イエス・キリスト」。「メシア」は「キリスト」に当たる称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: 満たされ
  rationale: 完了受動分詞が表す、満たされた結果としての継続的な状態を保ちつつ、前節から続く祈りの文として自然な日本語にした。
- source_word: καρπὸν
  choice: 実
  rationale: 倫理的・霊的な結果を植物の実にたとえる比喩を保つ。「実り」も可能だが、「義の実」という簡潔で格調ある表現を選んだ。
- source_word: δικαιοσύνης
  choice: 義
  rationale: δικαιοσύνηの法的・倫理的・関係的な含みを狭めずに伝える標準的な訳語。「正義」という可能性は脚注に残した。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: メシアであるイエスを通して結ばれる
  rationale: 属格を伴うδιάの手段・媒介の意味を「を通して」で表し、その句が義の実の成立に関わるという文脈上自然な理解を、読みやすい日本語で示した。
- source_word: Χριστοῦ
  choice: メシア
  rationale: Χριστόςの称号としての意味を明示するため「メシア」とし、日本語として自然になるよう「メシアであるイエス」とした。
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: 神の栄光と賛美となる
  rationale: εἰςが示す目的または結果を「となる」で自然に表した。「神に栄光と賛美をもたらすため」と限定せず、目的と結果の両方の余地を残した。
theological_decisions:
- issue: 「義の実」の属格関係
  choice: 「義」によって特徴づけられる、または「義」から成る実という幅を残す表現
  alternative: 義と認められる実／義が生み出す実
  rationale: καρπὸν δικαιοσύνηςの属格は複数の解釈が可能であるため、「義の実」と直截に訳し、倫理的成果だけに限定しなかった。
- issue: διὰ Ἰησοῦ Χριστοῦの係り先
  choice: 義の実がメシアであるイエスを通して結ばれるという理解
  alternative: メシアであるイエスを通して満たされるという理解
  rationale: 語順と文脈から実の源または媒介を示す理解が自然だが、ギリシア語では係り方に一定の余地がある。本文は主要な理解を示しつつ、キリストを媒介とする点を中心に据えた。
- issue: εἰς δόξαν καὶ ἔπαινον θεοῦの目的・結果
  choice: 神の栄光と賛美となる
  alternative: 神の栄光と賛美のために
  rationale: εἰςの目的と結果の両義性を不必要に解消しないよう、「となる」を用いた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら礼拝・朗読にも耐える、簡潔で品位ある文体とした。前節から続く分詞構文なので、末尾を「ことです」として祈りの内容につないだ。
