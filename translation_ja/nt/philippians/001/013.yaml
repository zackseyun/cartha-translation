    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: そのため
  rationale: 直前の内容から生じた結果を示す接続表現として、自然な現代日本語で結果的な力を保つ。
- source_word: τοὺς δεσμούς μου
  choice: 私の鎖
  rationale: δεσμοίの具体的な比喩性を保ち、パウロの投獄状態を指す表現として訳した。単に「投獄」とせず、原文の像を残す。
- source_word: φανεροὺς ... γενέσθαι
  choice: 知れ渡りました
  rationale: 「明らかなものとなる」という結果的な構文を、広く認知されるようになったという文脈に即して自然に表す。
- source_word: ἐν Χριστῷ
  choice: メシアにあってのものである
  rationale: 前置詞句を「鎖」に結び付けつつ、「メシアのため」と因果関係だけに限定せず、原文の領域・関係・理由の含みを残す。
- source_word: Χριστῷ
  choice: メシア
  rationale: Χριστόςを称号として訳し、その語義を明示する。
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: 親衛隊全体
  rationale: この文脈で有力な集団的指示を本文に採用する。ただし、建物・官邸を指す可能性は脚注に残す。
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: そのほかのすべての人々
  rationale: 親衛隊を越えて認知が広がったことを示す包括的な表現を、原文に近く訳す。
theological_decisions:
- issue: パウロの鎖とἐν Χριστῷの関係
  choice: 「私の鎖がメシアにあってのものであること」とし、鎖がメシアとの関係に規定されていることを表す。
  alternative: 「私がメシアのために鎖につながれていること」とし、投獄の理由を前面に出す。
  rationale: 文脈上は投獄理由が知られたとの理解が有力だが、ἐν Χριστῷは結合・領域の含みも持ちうるため、本文では曖昧さをある程度保ち、より明示的な因果的訳を脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「鎖」という具体像と、ἐν Χριστῷの神学的・統語的な幅を保持した。脚注記号は該当箇所に配置した。
