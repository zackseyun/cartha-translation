lexical_decisions:
- source_word: ἐμοὶ
  choice: 私にとって
  rationale: 与格の人称代名詞が示すパウロ自身の立場を、自然な現代日本語で明示する。
- source_word: γὰρ
  choice: 訳文では明示しない
  rationale: 前文を受ける説明の接続辞だが、単独の節として日本語にすると「というのは」などは不自然になりやすい。文脈上の説明関係は語順と内容から保たれる。
- source_word: τὸ ζῆν
  choice: 生きること
  rationale: 冠詞付き不定詞の名詞的用法を表し、「死ぬこと」との簡潔な対句を保つ。
- source_word: Χριστὸς
  choice: キリスト
  rationale: パウロ書簡で称号性と固有名詞性を併せ持つ語として、日本語で定着した「キリスト」を用いる。称号としての意味は脚注で示す。
- source_word: τὸ ἀποθανεῖν
  choice: 死ぬこと
  rationale: 冠詞付き不定詞を自然な名詞節で表し、「生きること」との均衡を保つ。
- source_word: κέρδος
  choice: 益
  rationale: 利益・有利を表す語を、商業的に響きすぎず、簡潔で品位ある日本語にする。
theological_decisions:
- issue: 「生きることはキリスト」の圧縮された述語関係
  choice: 生きることはキリストであり
  alternative: 生きることはキリストのため／キリストによるもの
  rationale: 原文は補語 Χριστός と連結辞が省略された簡潔な表現であり、その意味を目的・原因・内容のいずれかに限定せず、原文の神学的な豊かさと緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。原文の簡潔で印象的な対句を保ちつつ、「私にとって」で個人的な視点を自然に表した。脚注記号は節末に置き、本文全体の読みやすさを損なわないようにした。
