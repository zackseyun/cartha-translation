id: PHP.1.16
reference: Philippians 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: ja
  text: 一方の人たちは、私が福音を弁護するために定められていることを知り、愛からキリストを宣べ伝えています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「一方の人たちは愛から」。宣べ伝える行為は前後の文脈から補っています。
    reason: 原文の省略表現を明示するため。
  - marker: b
    text: 「定められている」は「置かれている」とも訳せます。
    reason: κεῖμαι が持つ、置かれた状態と定められた役割の両方の含みを示すため。
lexical_decisions:
- source_word: οἱ μὲν
  choice: 一方の人たちは
  rationale: 次節の対照表現 οἱ δέ と対応するため、「一方の人たちは」とし、対比を明確にした。
- source_word: ἐξ ἀγάπης
  choice: 愛から
  rationale: ἐξ は動機・源を表し、ἀγάπη の基本的な意味を保って簡潔に表現した。
- source_word: εἰδότες
  choice: 知り
  rationale: 付帯状況を表す分詞として、彼らが愛から宣べ伝える根拠を自然な日本語で示した。
- source_word: εἰς ἀπολογίαν
  choice: 弁明するために
  rationale: ἀπολογία が持つ、非難や告発に対して論証し擁護する意味と、εἰς の目的的な含みを表した。
- source_word: τοῦ εὐαγγελίου
  choice: 福音を
  rationale: 目的語的属格として自然な日本語にし、キリストについての良い知らせを指す定着した語「福音」を用いた。
- source_word: κεῖμαι
  choice: 定められている
  rationale: 単なる身体的位置ではなく、パウロが福音を弁明する役割に据えられているという文脈上の意味を表しつつ、行為者を明示しなかった。
theological_decisions:
- issue: κεῖμαι が神による任命を明示するか
  choice: 定められている
  alternative: ここに置かれている
  rationale: 文脈上はパウロの境遇と使命が一定の目的に向けて据えられていることを示すが、ギリシア語は行為者を明示しないため、日本語でも誰が定めたかは補わなかった。
- issue: 省略された宣教行為の補足
  choice: キリストを宣べ伝えています
  alternative: そうしています
  rationale: 原文は前節から動作を補う省略表現である。単独の節として理解できるよう前節の「キリストを宣べ伝える」を補ったが、脚注で省略を明示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、礼拝・朗読にも耐える簡潔で品位ある文体とした。「福音」「弁明」は文脈上重要な用語として保持し、省略の補足と κεῖμαι の幅は脚注で示した。
