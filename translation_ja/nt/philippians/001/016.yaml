    rationale: κεῖμαιは置かれている状態を含み得るものの、この節単独には場所を指す語がない。「置かれている」とすることで、代替訳としての幅を示しつつ余分な場所指定を避けられる。
  revised_text: 一方の人たちは、私が福音を弁護するために定められていることを知り、愛からキリストを宣べ伝えています。[a][b]
