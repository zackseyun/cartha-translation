  source_fidelity: 「いつも主にあって喜びなさい。もう一度言います。喜びなさい。」は、Χαίρετε（現在命令法・複数）、ἐν κυρίῳ（主との関係・領域）、πάντοτε（常に）、πάλιν（再び）、ἐρῶ（未来「言います」）、反復されたχαίρετεを過不足なく反映している。「主にあって」は因果・手段へ狭めず、原文の解釈上の幅を保っている。
