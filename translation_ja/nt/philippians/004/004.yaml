  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χαίρετε
  choice: 喜びなさい
  rationale: 現在能動命令法二人称複数。現代日本語で命令の力を明瞭に保ち、パウロの勧告として自然で品位のある表現とした。二度の出現を同じ訳語でそろえ、反復の強調を保持した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: ἐνが表す領域・関係性を狭く限定せず、主との結びつきのうちに喜ぶという幅を保つ、日本語聖書文体として明瞭な表現。単なる「主のゆえに」へ因果的に限定しない。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的・包括的な意味を、普通の現代日本語で簡潔に表す。
- source_word: πάλιν
  choice: もう一度
  rationale: 先の命令を強調して繰り返す働きを自然な日本語で示す。
- source_word: ἐρῶ
  choice: 言います
  rationale: 未来形の意志・予告を日本語の非過去形で自然に表現する。「言いましょう」も可能だが、現代語として直接的で明瞭な「言います」を採用した。
- source_word: χαίρετε
  choice: 喜びなさい
  rationale: 最初の命令と同じ訳語を用い、修辞的な反復と強調を保持した。
theological_decisions:
- issue: 「主にあって」（ἐν κυρίῳ）の意味
  choice: 主との関係・結びつきの領域において喜ぶという幅を保つ。
  alternative: 「主のおかげで」と因果的に訳す、または「主によって」と手段・力の源を前面に出す。
  rationale: パウロ書簡のἐν κυρίῳは、しばしば領域または関係的な位置を示す。「主にあって」は、因果・手段の含意を排除せず、いずれか一つに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、短い勧告の荘重さと反復の力を保持した。「主にあって」はやや聖書的な表現だが、神学的な幅を保ち、日本語のキリスト教文脈で十分理解可能である。
