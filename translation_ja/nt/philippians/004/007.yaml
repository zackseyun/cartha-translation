id: PHP.4.7
reference: Philippians 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: ja
  text: そして、あらゆる理解を超える神の平安が、メシア・イエスにあって、あなたがたの心と思いを守ります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ εἰρήνη τοῦ θεοῦ
  choice: 神の平安
  rationale: 属格を解釈的に「神からの」と限定せず、そのまま保った。「平安」は単なる静けさ以上の、神に由来する全人的な安寧を表し得る自然な聖書語である。
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: あらゆる理解を超える
  rationale: ὑπερέχω の「上回る、超える」と、ここでの νοῦς の理解・把握能力という意味を、明瞭で自然な日本語にした。「人間の」を補わず、原文の範囲を保った。
- source_word: φρουρήσει
  choice: 守ります
  rationale: 見張って防護するという語の含みを簡潔に伝える。未来形は日本語の文脈に即して「守ります」とした。
- source_word: τὰς καρδίας ὑμῶν
  choice: あなたがたの心
  rationale: καρδία が指す感情だけでなく内的人格の中心を、日本語の「心」で自然に表した。複数形は集合的な日本語として単数形にした。
- source_word: τὰ νοήματα ὑμῶν
  choice: あなたがたの思い
  rationale: νόημα は思考、考え、心の働きを指すため、「心」と区別しつつ自然に対句を作る「思い」とした。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστός の称号としての意味を「メシア」で明示し、ἐν の結合・領域の含みを伝統的かつ簡潔な「にあって」で保持した。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ が何に係るか
  choice: 「守ります」に続け、守りが成り立つ領域・結合として表現
  alternative: 文頭または「あなたがた」に密接に結び付ける
  rationale: 語順上は文末にあり、神の平安による守り全体を限定すると自然に読めるが、ギリシア語にある結合範囲の柔軟さを過度に説明しない訳とした。
- issue: Χριστῷ の訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでも称号の意味が失われていないため翻訳語を用いた。ただし固有名のように定着した読みもあり得る。
translation_notes:
  register: 現代標準日本語による、簡潔で格調を保った訳。「そうすれば」は前節との論理的連続を示す καί の文脈的機能を表す。本文だけを単独で読む場合は「そして」も可能だが、4:6からの流れでは「そうすれば」が自然である。
