  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: ja
  text: 私は、私を強くしてくださる方によって、どんなことでもできます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私はすべてのことに力がある」または「私はすべてのことができる」。直前の文脈では、満腹と空腹、豊かさと乏しさを含むさまざまな境遇が語られている。
    reason: lexical_alternative
  - marker: b
    text: 原文は「私を強くしてくださる方」と述べ、この節ではその方を明示的に「キリスト」とは呼んでいない。文脈からはキリストを指すと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: どんな状況にも
  rationale: 語そのものは広く「すべてのこと」を意味し得るが、直前では満腹と空腹、豊かさと乏しさなど、さまざまな境遇が語られている。その文脈上の意味を自然な日本語で示しつつ、より広い訳の可能性は脚注に残した。
- source_word: ἰσχύω
  choice: 対処できます
  rationale: この動詞は「力がある」「できる」という能力を表す。文脈では何事でも成し遂げるという無制限な能力ではなく、あらゆる境遇を切り抜ける力を指すため、「対処できます」とした。
- source_word: ἐν
  choice: によって
  rationale: 字義的には「中で」だが、ここでは力を与える方との関係を、手段・力の源として自然に表す「によって」が適切である。
- source_word: τῷ ἐνδυναμοῦντί με
  choice: 私を強くしてくださる方
  rationale: 冠詞付き現在分詞を「方」として名詞化し、継続的に力を与える働きを表した。原文にこの節では明記されていない「キリスト」を本文へ補わず、敬意のある自然な表現とした。
theological_decisions:
- issue: 「私を強くしてくださる方」が誰を指すか
  choice: 本文では「私を強くしてくださる方」とし、固有名を補わない。
  alternative: 「私を強くしてくださるキリストによって」
  rationale: 文脈からはキリストを指すと考えられるが、この節のギリシア語本文自体はその名を明記していないため、指示対象を本文で確定的に補わない。
- issue: πάντα ἰσχύω が表す能力の範囲
  choice: 文脈に即して「あらゆる状況に対処できる」と訳す。
  alternative: 「何でもできます」または「すべてのことができます」
  rationale: 直前の文脈は、豊かさや乏しさを含むあらゆる境遇に置かれることを扱っている。「何でもできる」では無制限の達成能力と誤解されやすいため、文脈上の能力を明確にした。ただし原語の広さは脚注で示す。
translation_notes:
  register: 明快な現代標準語を用いた。「くださる方」によって敬意と品位を保ちつつ、伝統的な訳語が招きやすい無制限な成功能力という誤解を避け、直前の境遇の文脈を明確にした。
