source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: ja
  text: 最後に、兄弟たち[a]、真実なこと、尊ぶべきこと、正しいこと、純粋なこと、愛すべきこと、評判のよいことは何であれ、また、何か徳と呼べるものがあり、何か称賛に値するものがあるなら、そのようなことを心に留めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語の「兄弟たち」は、信仰共同体全体への呼びかけとして用いられることがある。
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: 最後に
  rationale: 結びの勧告へ移る談話標識として、簡潔で自然な日本語にした。「なお」「そのほかに」も可能だが、ここでは手紙の終結部を示す働きを重視した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文で明示しつつ、共同体全体への呼びかけになり得ることは脚注で示した。
- source_word: ὅσα
  choice: 何であれ
  rationale: 列挙される各性質に当てはまるものすべてを指す分配的な表現として訳した。日本語では列挙の末尾に置くことで、不自然な反復を避けつつ原文の包括性を保った。
- source_word: ἀληθῆ
  choice: 真実なこと
  rationale: 真理にかなうこと、偽りのないことを広く表せる簡潔な訳語とした。
- source_word: σεμνά
  choice: 尊ぶべきこと
  rationale: 重みと品位があり、敬意に値するものを指す語義を、現代日本語で明瞭に表した。
- source_word: δίκαια
  choice: 正しいこと
  rationale: この倫理的列挙では、公正で正道にかなうという広い意味を自然に伝える。
- source_word: ἁγνά
  choice: 純真なこと
  rationale: 道徳的・内面的な清さを表し、「純潔」だけに狭めない訳とした。
- source_word: προσφιλῆ
  choice: 愛すべきこと
  rationale: 愛情を呼び起こす、好ましいものという語義を簡潔に表した。
- source_word: εὔφημα
  choice: 評判のよいこと
  rationale: よく語られること、好ましく受け止められることという含みを保ち、後続の「称賛」と同語反復にならないようにした。
- source_word: εἴ τις ἀρετὴ
  choice: 何か徳と呼べるものがあり
  rationale: ἀρετήの「徳、優れた性質」を名詞として保ち、条件節の形も維持した。
- source_word: εἴ τις ἔπαινος
  choice: 何か称賛に値するものがあるなら
  rationale: 称賛そのもの、また称賛されるにふさわしいものという文脈上の働きを自然な日本語で示した。
- source_word: ταῦτα λογίζεσθε
  choice: そのようなことを心に留めなさい
  rationale: 単に思い浮かべるのでなく、意識して考慮し続ける命令の力を、明瞭で品位ある表現にした。
theological_decisions:
- issue: ἀδελφοίが指す範囲
  choice: 本文は「兄弟たち」とし、共同体全体を指し得ることを脚注で説明する
  alternative: 本文を「兄弟姉妹たち」とする
  rationale: 原文の文法上の形を見える形で保ちながら、パウロの呼びかけが女性を含む信仰共同体全体に及び得るという語用論的情報も失わないため。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある勧告調とした。原文の連続的な徳目の列挙を保ちながら、日本語として過度に硬くならないよう「何であれ」を列挙の末尾にまとめた。
