  text: ὅτι καὶ ἐν Θεσσαλονίκῃ καὶ ἅπαξ καὶ δὶς εἰς τὴν χρείαν μοι ἐπέμψατε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: ja
  text: なぜなら、私がテサロニケにいた時でさえ、あなたがたは私の必要のために、一度ならず二度までも送ってくださいました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の必要のために、一度だけでなく繰り返し送ってくださいました」。
    reason: 「一度ならず二度までも」は、καὶ ἅπαξ καὶ δὶςの反復的な表現を保つ訳であり、より慣用的には「一度だけでなく繰り返し」とも表せるため。
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 前の文の内容を理由づける接続表現として、現代日本語で自然かつ明確にした。
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: テサロニケにいた時でさえ
  rationale: ἐν の場所的意味を保ちつつ、日本語ではパウロがそこにいた時を指すことが明確になるようにした。καὶ の強調は「でさえ」で表した。
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: 一度ならず二度までも
  rationale: 一度だけでなく二度送ったという反復と強調を、自然な日本語で保持した。
- source_word: εἰς τὴν χρείαν μοι
  choice: 私の必要のために
  rationale: χρεία の単数形と、援助がパウロの必要に向けられたことを、補足的な目的語を加えずに表した。
- source_word: ἐπέμψατε
  choice: 送ってくれた
  rationale: 原文で目的語が明示されていないため、日本語でも何を送ったかを限定せず、「くれた」によってパウロへの行為であることを自然に示した。
