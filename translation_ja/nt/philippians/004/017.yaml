  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: ja
  text: 贈り物を求めているのではありません。むしろ、あなたがたの勘定に増し加わっていく実り[a]を求めているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの勘定に豊かに積み上がる実り」。
    reason: πλεονάζονταは「増える」「豊かになる」「あふれる」を意味し得る。また、会計の比喩をより強く表す訳の可能性を示す。
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: 求めている
  rationale: 能動的に求めることを表す語であり、二度の反復を同じ表現で保って対比を明確にした。
- source_word: τὸ δόμα
  choice: 贈り物
  rationale: ピリピの信徒たちが贈ったものを指すため、簡潔で直接的な訳とした。原文に明示されない「そのもの」を補わなかった。
- source_word: τὸν καρπὸν
  choice: 実り
  rationale: 結果や収益を含意する比喩を保ちつつ、現代日本語として自然な「実り」とした。
- source_word: τὸν πλεονάζοντα
  choice: 加えられていく
  rationale: 増加・充満を表す分詞の継続的な意味を示し、続く勘定の比喩にも自然につながる表現とした。
- source_word: εἰς λόγον ὑμῶν
  choice: あなたがたの勘定に
  rationale: 4章15節以来の商取引・会計の比喩を保つ。単なる「利益」として意味を平板化しない。
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: …のではありません。むしろ…
  rationale: 否定による釈明と、それに続く強い対比を自然な現代日本語で表した。
theological_decisions:
- issue: 「実り」と「勘定」の比喩の重なり
  choice: 両方の比喩を残した
  alternative: 「あなたがたの益が増すこと」のように意訳する
  rationale: 原文は農業的な「実り」と会計的な「勘定」を意図的に併置しているため、その緊張を解消しなかった。
- issue: 何が、また誰によって勘定に加えられるか
  choice: 明示しなかった
  alternative: 「神があなたがたの勘定に加えてくださる実り」
  rationale: 文脈上は神からの報いが含意され得るが、この節の原文は行為者や報いの具体的内容を明示していない。
translation_notes:
  register: 明快で dignified な現代標準日本語。パウロの釈明と対比を二文で読みやすく示し、「実り」と「勘定」という異なる比喩の併置を保持した。
