reference: Philippians 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: ja
  text: はい、真の協力者よ[a]、あなたにもお願いします。この二人を助けてください。二人は、クレメンスとほかの私の同労者たちとともに、福音のために私と並んで奮闘した人たちです[b]。その人たちの名は命の書に記されています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「真のくびき仲間よ」。固有名として「シュジュゴスよ」と解する見方もあります。
    reason: alternative_reading
  - marker: b
    text: 「福音において私とともに奮闘した」、または「福音の働きにおいて私とともに力を尽くした」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: そうです
  rationale: 直前の勧めを受けて訴えを続ける、肯定的で直接的な移行を自然な日本語で表す。
- source_word: ἐρωτῶ
  choice: お願いします
  rationale: 基本義の「求める、頼む」を、個人的な依頼として自然かつ丁重に表す。
- source_word: γνήσιε σύζυγε
  choice: 真実な仲間よ
  rationale: σύζυγοςを固有名ではなく、忠実で真正な協力者への呼びかけと理解する。比喩的な「くびきを共にする者」と固有名の可能性は脚注に残す。
- source_word: συλλαμβάνου
  choice: 助けてください
  rationale: 一緒に手を貸すという能動的な援助を、明快で自然な命令・依頼表現にする。
- source_word: αὐταῖς
  choice: この二人を
  rationale: 文脈上、前節のユウオディアとスンティケを指す女性複数形であるため、代名詞の指示対象を明確にする。
- source_word: συνήθλησάν μοι
  choice: 私と並んで奮闘した
  rationale: συναθλέωの競技・闘争の比喩と、パウロと肩を並べた協働の意味を保つ。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 福音のために
  rationale: 福音に関わる働きの中での奮闘という意味を、日本語で自然に表す。ギリシア語の圧縮された表現が許す「福音の働きにおいて」は脚注で示す。
- source_word: συνεργῶν
  choice: 同労者たち
  rationale: パウロ書簡で定着した協働者の表現を、簡潔で品位ある日本語にする。
- source_word: βίβλῳ ζωῆς
  choice: 命の書
  rationale: 聖書における定型的な表現を、そのまま明瞭に訳す。
theological_decisions:
- issue: γνήσιε σύζυγε の解釈
  choice: 名の示されていない男性の協力者への描写的呼びかけ「真実な仲間よ」
  alternative: 「真実なくびき仲間よ」、または固有名「シュジュゴスよ」
  rationale: γνήσιεを伴う呼格は普通名詞として自然に読めるが、σύζυγοςが固有名である可能性も完全には排除できないため、脚注で保持する。
- issue: ὧν の先行詞の範囲
  choice: この二人、クレメンス、ほかの同労者を含む一同を「彼ら」と受ける
  alternative: 直近の「ほかの私の同労者たち」だけを指す
  rationale: 関係代名詞の複数形は文法上直近の同労者たちに結びつき得るが、談話上は列挙された福音の協働者全体を包摂する読みが自然である。ただし範囲には多少の曖昧さがある。
translation_notes:
  register: 明快な現代標準語を用いながら、「同労者」「命の書」など定着した聖書語彙を保持した。「この二人」で前節の女性二人を明示し、全体を朗読にも適する簡潔で品位ある調子に整えた。
