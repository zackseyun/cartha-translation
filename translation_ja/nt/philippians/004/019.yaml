id: PHP.4.19
reference: Philippians 4:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: ja
  text: そして、私の神は、メシア・イエスにあって[a]、ご自分の豊かさに応じて[b]、栄光のうちに[c][d]、あなたがたの必要をすべて満たしてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエスにあって」。
    reason: lexical_alternative
  - marker: b
    text: 「豊かさに応じて」は、神の備えが単にその豊かさから出るだけでなく、その豊かさを尺度としていることを表す。
    reason: alternative_reading
  - marker: c
    text: 「栄光のうちに」は、「栄光に満ちて」と副詞的に理解することもできる。
    reason: alternative_reading
  - marker: d
    text: 原文では「栄光のうちに」と「メシア・イエスにあって」の関係に幅があり、「メシア・イエスにある栄光のうちに」と取ることもできる。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: そして、私の神は
  rationale: δέはここでは強い対立よりも前文を受ける緩やかな接続を表すため、「しかし」ではなく「そして」とした。「私の神」という個人的な言い方も保持した。
- source_word: πληρώσει
  choice: 満たしてくださいます
  rationale: この文脈のπληρόωは、不足しているものを供給して必要を満たすことを表す。日本語では「満たす」が原語の像と意味を自然に伝え、神を主語とする文にふさわしい敬意も添えた。
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: あなたがたの必要をすべて
  rationale: χρείαを「必要」とし、πᾶσανの包括的・分配的な力を「すべて」で表した。複数のὑμῶνは「あなたがた」とした。
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: ご自分の豊かさに応じて
  rationale: 対格を伴うκατάは、単なる供給源ではなく基準・尺度を示す。「豊かさの中から」よりも「豊かさに応じて」がその含意を保つ。写本本文の中性形τὸ πλοῦτοςも意味上は「豊かさ」と訳せる。
- source_word: ἐν δόξῃ
  choice: 栄光のうちに
  rationale: ἐνの具体的な関係は文法上確定しにくいため、副詞的な「栄光に満ちて」と決めず、前置詞句の開放性を保った。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστόςを称号として「メシア」と訳し、ἐν Χριστῷというパウロ特有の結びつきは、自然でありながら関係性の幅を保つ「にあって」とした。
theological_decisions:
- issue: ἐν Χριστῷ ἸησοῦにおけるΧριστόςの訳し方
  choice: メシア・イエスにあって
  alternative: キリスト・イエスにあって
  rationale: ここでΧριστόςは称号としての意味をなお保っているため、意味を訳した「メシア」を本文に置いた。日本語で伝統的な「キリスト」も脚注に残した。
- issue: ἐν δόξῃとἐν Χριστῷ Ἰησοῦの係り受け
  choice: 二つの句を並べ、厳密な係り先を本文で確定しない
  alternative: 「メシア・イエスにある栄光のうちに」と一まとまりにする
  rationale: ギリシア語では両方のἐν句の関係に解釈の余地がある。本文では読点を用いて読みやすくしつつ、脚注で別の係り受けを示した。
- issue: 神の供給の尺度
  choice: ご自分の豊かさに応じて
  alternative: ご自分の豊かさの中から
  rationale: κατάは神の豊かさを供給の単なる出所ではなく、その尺度・基準として示すと読むのが文脈上適切である。
translation_notes:
  register: 現代の一般読者に通じる、明瞭で品位ある文体とした。「賜る」などの古風な語は避け、「満たしてくださいます」で約束の確かさと敬意を表した。原文末尾の二つのἐν句は日本語として読みやすい位置に置きつつ、その係り受けを断定しないよう脚注で補った。
