id: PHP.4.18
reference: Philippians 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: ja
  text: さて、私はすべてを受け取っており、十分すぎるほどあります。エパフロディトからあなたがたからの贈り物を受け取って、満たされています。それは、芳しい香り、受け入れられるいけにえ、神に喜ばれるものです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέχω
  choice: 受け取り
  rationale: 物質的支援の文脈で、受領して手元に十分あるという意味を自然に表す。商取引上の「全額受領」の含みは本文で限定せず、脚注に残す。
- source_word: πάντα
  choice: すべてを
  rationale: ピリピの信徒たちが送ったものを包括的に指す表現として、簡潔で自然である。
- source_word: περισσεύω
  choice: 有り余るほどです
  rationale: 必要を超える豊かさを現代日本語で明確に伝え、続く充足の表現との重なりも保つ。
- source_word: πεπλήρωμαι
  choice: 満ち足りています
  rationale: 完了形が示す、贈り物を受け取った結果として現在十分に満たされている状態を表す。
- source_word: δεξάμενος
  choice: 受け取って
  rationale: パウロが満ち足りている理由・経緯を示す分詞を、自然な接続で表す。
- source_word: παρὰ Ἐπαφροδίτου
  choice: エパフロディトから
  rationale: 贈り物を直接届けた人物を明示する。続く「あなたがたからの」により、贈り主との区別も保たれる。
- source_word: τὰ παρ’ ὑμῶν
  choice: あなたがたからの贈り物
  rationale: 原文の名詞化表現がこの文脈で指すものを明瞭にしつつ、贈り物の起源がピリピの信徒たちであることを保つ。
- source_word: ὀσμὴν εὐωδίας
  choice: 芳しい香り
  rationale: 旧約聖書の供え物を想起させる祭儀的表現を、格調を保った自然な日本語で再現する。
- source_word: θυσίαν δεκτήν
  choice: 神に受け入れられ…いけにえ
  rationale: 贈り物を礼拝のいけにえとして描く比喩と、それが受け入れられるという評価を保持する。
- source_word: εὐάρεστον τῷ θεῷ
  choice: 神に…喜ばれる
  rationale: 神がそのいけにえを喜ばしく思うという意味を、前の形容と滑らかに並べて表す。
theological_decisions:
- issue: ピリピの信徒たちの金銭的贈り物に対する犠牲・供え物の比喩
  choice: 「芳しい香り、神に受け入れられ、喜ばれるいけにえ」として祭儀的比喩を保持する。
  alternative: 単なる感謝の言葉に平板化する、または「神が喜んで受け入れる供え物」と一つの説明句にまとめる。
  rationale: パウロは贈り物を神への礼拝として意図的に描いているため、「香り」「いけにえ」「神の喜び」という要素を残す。これ以上の特定の教理的説明は加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、犠牲祭儀の比喩には「芳しい」「いけにえ」を用いて聖書的な格調を保った。「有り余るほどです」と「満ち足りています」により、原文のπερισσεύωとπεπλήρωμαιの強調の連続を自然に再現した。
