  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: ja
  text: 私は、乏しい境遇に置かれることも、豊かに暮らすことも心得ています。どんな場合にも、どんなことにも、満腹することにも飢えることにも、豊かであることにも不足することにも対処する秘訣を身につけました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「私は秘儀に入れられました」。パウロは、秘儀への加入を表す語を、秘訣を学び取ったことの比喩として用いています。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: 知っています
  rationale: 後続の不定詞とともに、単なる知識ではなく、経験を通して身につけた実際的な心得を表す。日本語では各対句を受ける「ことも知っています」が自然である。
- source_word: ταπεινοῦσθαι
  choice: 乏しい境遇に置かれる
  rationale: 受動・中動的な形が示す、状況的に低くされる意味を保ちつつ、内面的な謙遜だけに限定しない。文脈上、欠乏や低い生活状態を表す。
- source_word: περισσεύειν
  choice: 豊かに暮らす／豊かである
  rationale: 必要を超えて有するという広い意味を、繁栄だけに限定せず自然な日本語で表した。前半では生活状態として、後半では対句の並行性を意識して訳し分けた。
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: どのような境遇でも、あらゆることにおいて
  rationale: 二つの包括的表現を区別して残し、状況と事柄の双方を包み込む修辞的な広がりを表した。
- source_word: μεμύημαι
  choice: 対処する秘訣を身につけました
  rationale: 本来は秘儀への加入・伝授を連想させる語だが、ここではあらゆる状態に生きる心得を習得したという比喩。「秘訣を身につけた」で完了形の結果的状態も自然に示す。字義的含意は脚注に残した。
- source_word: χορτάζεσθαι
  choice: 満腹する
  rationale: πεινᾶνとの食物に関する明確な対比を保ち、十分に食べて満たされる意味を簡潔に表す。
- source_word: πεινᾶν
  choice: 飢える
  rationale: 満腹との直接的な対照を、簡潔で格調を損なわない現代日本語で示す。
- source_word: ὑστερεῖσθαι
  choice: 不足する
  rationale: 金銭だけでなく、必要なものを欠く状態を広く表し、「豊かである」と対照させた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いつつ、対句の反復と包括的な響きを保持した。「対処する」は原文に明示されない補足だが、μεμύημαιに含まれる実践的習得を日本語で自然に伝えるために用いた。脚注記号[a]は、その説明対象である「秘訣を身につけました」の直後に置いた。
