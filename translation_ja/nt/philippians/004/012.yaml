- from: 私は、乏しい境遇に置かれることも知っており、豊かに暮らすことも知っています。どのような境遇でも、あらゆることにおいて、満腹することにも飢えることにも、豊かであることにも不足することにも対処する秘訣を身につけました。[a]
  to: 私は、乏しい境遇に置かれることも、豊かに暮らすことも心得ています。どんな場合にも、どんなことにも、満腹することにも飢えることにも、豊かであることにも不足することにも対処する秘訣を身につけました。[a]
