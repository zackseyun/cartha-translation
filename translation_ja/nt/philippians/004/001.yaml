id: PHP.4.1
reference: Philippians 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: ja
  text: ですから、私の愛する、慕ってやまない兄弟たち[a]、私の喜び、私の冠[b]である皆さん、このように主にあって堅く立ちなさい。愛する皆さん。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」はギリシア語の男性形を訳したもの。ここでは男性だけでなく、会衆の信徒全体への呼びかけである。
    reason: cultural_note
  - marker: b
    text: 「冠」は、王の冠というより、競技などの勝者に授けられる冠、すなわち花輪を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論を受けた帰結を示す接続語として、現代日本語で自然かつ明確に訳した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数呼格を形の上でも反映した。文脈上は会衆全体への呼びかけであることを脚注で補った。
- source_word: ἀγαπητοὶ / ἀγαπητοί
  choice: 愛する
  rationale: パウロの深い愛情を表し、原文の冒頭と末尾にある反復も保持した。
- source_word: ἐπιπόθητοι
  choice: 慕ってやまない
  rationale: 相手に会いたいと切望する強い思いを、自然で品位ある現代日本語で表した。
- source_word: χαρά
  choice: 喜び
  rationale: ピリピの信徒たち自身がパウロの喜びであるという比喩的な述語をそのまま保った。
- source_word: στέφανος
  choice: 冠
  rationale: 簡潔で定着した訳語を採用し、王冠ではなく勝者に授けられる冠・花輪のイメージであることを脚注に示した。
- source_word: οὕτως
  choice: このように
  rationale: 直前の勧めを受けて、どのように堅く立つかを示す指示的な働きを明示した。
- source_word: στήκετε
  choice: 堅く立ちなさい
  rationale: 揺るがず持ちこたえるよう命じる現在命令の継続的な含みを、明快な日本語で表した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 場所的・関係的な意味の双方を含みうるパウロ特有の表現を、過度に解釈せず保持した。
theological_decisions:
- issue: ἀδελφοίの指示範囲
  choice: 本文では男性形に即して「兄弟たち」とし、会衆全体を指す文脈的範囲を脚注で示す。
  alternative: 「兄弟姉妹たち」または「信徒の皆さん」と訳す。
  rationale: 原文の文法上の形を保ちつつ、呼びかけが男性だけに限定されないことも読者に明示するため。
- issue: ἐν κυρίῳの関係的含意
  choice: 「主にあって」と訳す。
  alternative: 「主との結びつきの中で」と説明的に訳す。
  rationale: キリストとの結合、主を拠り所とすること、主の領域にあることなどの含みを一つに限定せず、原文の神学的な幅を保つため。
- issue: οὕτωςの指示方向
  choice: 「このように」と訳し、主として直前の勧めを受ける表現として残す。
  alternative: 「そういうわけで」と接続表現に吸収する、または後続内容だけを指すものとして解釈する。
  rationale: οὕτωςの様態を示す働きを明示しつつ、その参照範囲を過度に限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、呼びかけの重なりと愛情の強さを保った。「私の喜び、私の冠」という並行表現、および文末の「愛する皆さん」を残し、原文の修辞的な温かさを再現した。
