  rationale: 語自体は自己のうちに足りるという含みを持ち得るが、ここでは様々な境遇の中で身につけた充足の状態が中心である。後続文脈との緊張を保ち、自律的な自己依存を過度に示唆しない訳を本文に置き、語義上の別案を注記した。
