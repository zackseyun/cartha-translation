id: PHP.4.15
reference: Philippians 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: ja
  text: フィリピの皆さん、あなたがた自身も知っているとおり、福音宣教の初め、私がマケドニアを離れた時、与えることと受け取ること[a]に関して私と関わりを持った教会は、あなたがた以外にはありませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「与えることと受け取ることの勘定に関して」とも訳せる。
    reason: λόγος には「事柄」だけでなく、会計上の「勘定、収支」という含みもありうるため。
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: あなたがた自身も知っているとおり
  rationale: οἶδαの現在的な状態を自然な日本語の「知っている」で表し、καίと明示された代名詞の強調を「自身も」に反映した。δὲは強い逆接ではなく談話を進めるため、日本語では独立した接続詞を置かず自然につないだ。
- source_word: Φιλιππήσιοι
  choice: フィリピの皆さん
  rationale: 呼格による直接の呼びかけを、現代の読者にも自然で敬意ある表現にした。
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: 福音が伝えられ始めたころ
  rationale: 直訳的な「福音の初め」が指す、福音宣教の初期という文脈上の意味を明瞭にしつつ、過度に限定しない表現とした。
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: 私がマケドニアを離れた時
  rationale: 移動の起点を示すἀπόを保ち、ἐξέρχομαιを自然な現代日本語で表した。
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: 私と交わりを持った教会は……ありませんでした
  rationale: κοινωνέωが表す共同参加を「交わりを持つ」で保ち、続く金銭的文脈によってその具体的内容が分かるようにした。単なる送金に狭めない訳である。
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: 与えることと受け取ることにおいて
  rationale: δόσιςとλῆμψιςの対句を保ち、λόγοςの「事柄・勘定」の両義性を本文では過度に決めず、会計上の含みを脚注に示した。
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: あなたがただけでした
  rationale: 例外と排他性を、日本語として簡潔かつ強調の伝わる形で表した。
theological_decisions:
- issue: 「与えることと受け取ること」が誰の授受を指すか
  choice: 授受の主体や方向を本文で補わない
  alternative: 「あなたがたが与え、私が受けること」と明示する
  rationale: ギリシア語は会計・相互関係を思わせる定型的な対句であり、当該節だけでは各語の主体を明記していないため、その緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。呼びかけは「フィリピの皆さん」とし、金融取引だけに狭めず共同参加を表す「交わり」を残した。脚注記号[a]は該当句を含む文の末尾に配置した。
