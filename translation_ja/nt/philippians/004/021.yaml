  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: ja
  text: メシア・イエスにある[a]聖なる者一人一人に、よろしく伝えてください。私と共にいる兄弟たち[b]が、あなたがたによろしく伝えています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳されます。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、文脈によっては、女性を含む信仰の仲間全体を指すことがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡の結びで、相手を通して第三者へ挨拶を伝えるよう求める命令を、現代日本語で自然に表した。
- source_word: πάντα ἅγιον
  choice: 聖なる者一人一人
  rationale: 単数形を伴う πᾶς の分配的な意味を「一人一人」で示し、ἅγιος の『神のために聖別された者』という意味を、専門用語だけに頼らず表した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: Χριστόςを称号として「メシア」と訳し、ἐν の結びつき・領域を表す表現は、パウロ書簡で定着した自然な日本語「にある」で保持した。
- source_word: ἀσπάζονται ὑμᾶς
  choice: あなたがたによろしくと言っています
  rationale: 書簡末尾の挨拶として、ギリシア語の現在形を日本語で直接的かつ自然な伝言表現にした。
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: 私と共にいる兄弟たち
  rationale: σὺν ἐμοὶ を簡潔に「私と共にいる」とし、文法上男性複数の ἀδελφοί は本文で「兄弟たち」と保った。文脈上の包括的可能性は脚注に示した。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: メシア
  alternative: キリスト
  rationale: 語源的・称号的意味を明示し、固有名詞の一部としてのみ受け取られることを避けた。伝統的な別訳は脚注に示した。
- issue: ἀδελφοίが指す集団の範囲
  choice: 本文では「兄弟たち」
  alternative: 「兄弟姉妹たち」または「信仰の仲間たち」
  rationale: 原文の文法上の男性複数を保持しつつ、混成集団を含み得るという語用論上の幅を脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、書簡の結びにふさわしい丁寧さを保った。「聖徒」という教会用語よりも意味の見えやすい「聖なる者」を採用し、πάντα の分配性を「一人一人」で明示した。
