id: PHP.4.9
reference: Philippians 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: ja
  text: あなたがたが学び、受け、聞き、また私自身に見たこと[a]、それを実践しなさい[b]。そして、平和の神があなたがたとともにいてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私自身に見たこと」は、「私の模範に見たこと」または「私の生き方に見たこと」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「それを行いなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: こと
  rationale: 中性複数の関係代名詞が示す内容を、日本語では一連の動詞を受ける「こと」で自然にまとめ、後の「それ」と対応させた。
- source_word: ἐμάθετε
  choice: 学び
  rationale: ピリピの信徒が学んだ事柄を指すアオリスト。「学んだ」も可能だが、並列を簡潔に保つため連用形とした。
- source_word: παρελάβετε
  choice: 受け
  rationale: 教えや伝承を受領した意味を保ちつつ、「伝承」と限定しすぎない表現とした。
- source_word: ἠκούσατε
  choice: 聞き
  rationale: 原文の動詞列を保つ簡潔で直接的な訳。
- source_word: εἴδετε ἐν ἐμοί
  choice: 私のうちに見た
  rationale: ἐν ἐμοίを解釈的に「私の模範に」と置き換えず、パウロ自身に見て取ったという表現の幅を残した。
- source_word: ταῦτα πράσσετε
  choice: それを実践しなさい
  rationale: 現在命令形が示す継続的・習慣的な実行を、自然な日本語の「実践する」で表した。
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: 平和の神
  rationale: 属格を説明的に展開せず、パウロの定型的な表現を簡潔に保持した。
- source_word: ἔσται μεθ’ ὑμῶν
  choice: あなたがたとともにいてくださいます
  rationale: 神の臨在についての将来的な確言を、日本語で約束として自然に伝える敬意ある表現とした。
theological_decisions:
- issue: 実践と神の臨在との関係
  choice: 命令と約束を「そして」で並べ、明示的な条件文にはしない。
  alternative: 「そうすれば、平和の神が……」と条件・帰結の形で訳す。
  rationale: 原文はκαίで二つの節を結んでおり、明示的な条件構文ではない。勧告に続く約束という力を保ちながら、機械的な因果関係を付加しない。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある勧告調。原文の動詞の並列を保ちつつ、日本語として読みやすい語順にした。
