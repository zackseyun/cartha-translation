id: PHP.4.20
reference: Philippians 4:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: ja
  text: 私たちの神であり父である方に、栄光が世々限りなくありますように[a]。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「世々の世に至るまで」。また、原文には「ありますように」に当たる動詞はなく、「栄光があります」とも取れます。
    reason: 語句の直訳と、動詞のない原文が持つ解釈上の幅を示すため。
lexical_decisions:
- source_word: δὲ
  choice: 無訳（文脈上の緩やかな接続として処理）
  rationale: ここでは強い対比ではなく、結びの頌栄へ移る緩やかな接続を示す。日本語で「しかし」「さて」などを明示すると原文以上の意味を帯びやすいため、自然な独立文として表した。
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: 私たちの神であり父である方に
  rationale: θεῷ と πατρὶ を同一の方を指す一体的な表現として訳し、「私たちの」が両方にかかる意味を自然な日本語で示した。
- source_word: ἡ δόξα
  choice: 栄光が…ありますように
  rationale: 原文は動詞のない頌栄表現である。日本語では祈願的な「ありますように」を補い、神に栄光を帰する頌栄の働きを明確にした。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 直訳的には「世々の世に至るまで」だが、終わりのない持続を表す定型句として、格調と分かりやすさを兼ねる「世々限りなく」を採用した。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な同意と確証を表す定着した音写として保持した。
theological_decisions:
- issue: 動詞のない頌栄句に補う意味
  choice: 栄光が…ありますように
  alternative: 栄光があります／栄光は…のものです
  rationale: ギリシア語は動詞を明示せず、「ある」という宣言とも「あるように」という祈願とも取り得る。本文では頌栄として自然な祈願形を採りつつ、その文法上の幅を脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、結びの頌栄にふさわしい格調を保った。「神であり父である方」として同一指示を明確にし、過度に古風な語順や表現は避けた。
