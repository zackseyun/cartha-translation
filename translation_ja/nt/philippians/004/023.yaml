id: PHP.4.23
reference: Philippians 4:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: ja
  text: 主イエス・キリストの恵みが、あなたがたの霊とともにありますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本には「あなたがたすべてとともに」とするものもあります。
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの祝祷で定着した語であり、神から無償で与えられる好意と恩恵という意味を保つ。
- source_word: κυρίου
  choice: 主
  rationale: イエスに対する称号としてのκύριοςを、現代日本語の聖書語として自然かつ簡潔に表す。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: Χριστόςには「メシア」という称号の由来があるが、この定型的な結びでは固有名に近い結合としても機能するため、日本語で広く理解される「イエス・キリスト」とした。
- source_word: μετὰ
  choice: とともに
  rationale: 属格を伴い、恵みが受取人の霊に伴うことを表す。祝祷にふさわしい自然で格調ある表現。
- source_word: πνεύματος
  choice: 霊
  rationale: ここでは聖霊と明示されず、受取人たちの内なる存在を集合的な単数で指すと読むのが自然である。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: 二人称複数を明示し、単数形の「霊」が共同体全体に関わることを保つ。
theological_decisions:
- issue: πνεύματοςが人間の霊か聖霊か
  choice: 人間の霊を指すものとして「霊」
  alternative: 「御霊」または「聖霊」
  rationale: ὑμῶνによって「あなたがたの霊」とされており、聖霊を明示する語形ではない。大文字・小文字を区別しないギリシア語本文の曖昧さを不必要に教義化せず、日本語では中立的な「霊」とする。
- issue: Χριστοῦを「キリスト」とするか「メシア」とするか
  choice: キリスト
  alternative: メシア
  rationale: このパウロ的祝祷句ではἸησοῦ Χριστοῦが一体化した呼称として強く機能する。「メシア」という称号性も語源上は残るが、日本語の定型的呼称として明瞭な「イエス・キリスト」を採用する。
- issue: 動詞のない祝祷句の補い方
  choice: 「ありますように」
  alternative: 「あるように」または「ともにある」
  rationale: ギリシア語は動詞を省略した祝祷である。日本語では祈願の力を自然に示すため「ありますように」を補う。
translation_notes:
  register: 明瞭な現代標準語を用い、結びの祝祷としての簡潔さと品位を保った。「御霊」のように聖霊を確定する表記は避けた。SBLGNTの本文は「あなたがたの霊とともに」。脚注では主要な異読として「あなたがたすべてとともに」を示した。
