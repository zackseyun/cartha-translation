  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: ja
  text: 私はエボディアに勧め、シンティケにも勧めます。主にあって、同じ思いでいてください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主にあって、同じ心を持ってください」。また、「主にあって一致してください」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: エボディア
  rationale: 人名は意味を訳さず、ギリシア語の発音に基づく日本語で一般的な音写とした。
- source_word: παρακαλῶ
  choice: 勧めます
  rationale: この文脈での個人的で真剣な呼びかけを、過度に強圧的にせず表す。パウロが二人それぞれに同じ動詞を用いているため、日本語でも「勧め」を繰り返した。
- source_word: Συντύχην
  choice: シンティケ
  rationale: 人名は意味を訳さず、ギリシア語の発音に基づく日本語で一般的な音写とした。
- source_word: τὸ αὐτὸ φρονεῖν
  choice: 同じ思いでいてください
  rationale: τὸ αὐτόの「同じ」と、φρονέωが示す思考・態度・志向の幅を保ちつつ、現代日本語として自然な勧告にした。単なる個別事項への「同意」より広い意味を残している。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 一致が単なる人間関係上の妥協ではなく、主との関係の中に位置づけられていることを示す定着した簡潔な表現を採用した。
theological_decisions:
- issue: τὸ αὐτὸ φρονεῖν が求める一致の性質
  choice: 「同じ思いでいる」とし、思考・態度・志向を含み得る幅を保つ
  alternative: 「主にあって意見を一致させる」
  rationale: 原文は具体的な争点についての完全な意見一致だけに限定しておらず、フィリピ書で繰り返される共同体的な心構えも含み得るため、狭く断定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語を用いた。二人を対等に扱う原文の反復を保ち、「主にあって」は聖書的な関係性の表現として簡潔に残した。
