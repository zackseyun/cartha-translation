  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: ja
  text: 何も思い煩ってはいけません。[a] むしろ、どんなことでも、感謝をもって祈りと願い[b]をささげ、あなたがたの願い事を神に[c]知っていただくようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「何も心配してはいけません」。
    reason: lexical_alternative
  - marker: b
    text: または「願い求め」。
    reason: lexical_alternative
  - marker: c
    text: または「神の前に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: 何も思い煩ってはいけません
  rationale: μηδὲνを否定命令と合わせて「何も」とし、μεριμνάωが表す不安を伴う心配を、現代日本語で自然かつ荘重な「思い煩う」で表した。
- source_word: ἐν παντὶ
  choice: どんなことでも
  rationale: 状況や事柄を限定しない包括性を、普通の読者に明瞭な日本語で表した。
- source_word: τῇ προσευχῇ καὶ τῇ δεήσει
  choice: 祈りと願いにより
  rationale: 一般的な祈りを表すπροσευχήと、具体的な必要を願い求めるδέησιςとの区別を、二つの名詞を用いて保持した。
- source_word: μετ’ εὐχαριστίας
  choice: 感謝をもって
  rationale: εὐχαριστίαの名詞的な重みを保ちつつ、祈りと願いに感謝が伴うことを自然な日本語で示した。
- source_word: τὰ αἰτήματα ὑμῶν
  choice: あなたがたの求め
  rationale: αἴτημαが指す、具体的に求めている事柄を簡潔に表し、直前の「願い」との不必要な重複を避けた。
- source_word: γνωριζέσθω
  choice: 知っていただきなさい
  rationale: 受動命令の形を日本語で無理なく反映し、求めを神へ申し述べるよう促す命令の力を保った。
- source_word: πρὸς τὸν θεόν
  choice: 神に
  rationale: γνωρίζωとの結び付きにおけるπρόςの直接的な方向性を簡潔に表した。「神の前に」という理解も脚注に残した。
theological_decisions:
- issue: 神に求めを「知らせる」という表現と神の全知との関係
  choice: 原文のγνωριζέσθωを「知っていただきなさい」と訳し、表現上の緊張を保持した。
  alternative: 「神に申し上げなさい」と意訳する。
  rationale: この節は神が情報を欠いているかどうかを論じるのではなく、求めを祈りのうちに神へ差し出すよう命じている。神学的な説明を本文へ付加せず、原文の言い方を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令の真剣さと祈りの文脈にふさわしい品位を保った。「思い煩う」は日常語の「心配する」よりやや荘重だが、現代の一般読者にも理解可能であり、μεριμνάωの強い不安の含意をよく伝える。
