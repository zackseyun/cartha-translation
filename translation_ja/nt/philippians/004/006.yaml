review_pass:
  verdict: revise
  source_fidelity: 冒頭の「何も思い煩ってはいけません」と、包括的な「どんなことでも」、祈り・願い・感謝・願い事・神という主要要素は原文に忠実です。ただし、「祈りと願いにより」は日本語としてやや不自然であり、γνωριζέσθω の受動命令に対する「神に知っていただきなさい」は意味は通るものの、神に対する敬語として不必要に重く、明瞭さを損ねます。
  naturalness: 「感謝をもって祈りと願いをささげ」は自然な現代標準語で、μετὰ εὐχαριστίας が祈りと願いに伴うことも明確です。「願い事」は「あなたがたの求め」より日常的で、具体的な αἰτήματα をよく表します。「神に知っていただくようにしなさい」は、日本語で受動命令の趣旨を無理なく表します。
  terminology: 「思い煩う」は μεριμνάω の不安を伴う心配を適切に伝えます。「祈り」と「願い」は προσευχή と δέησις の区別を保っています。δέησις の補足は語義説明よりも、訳語の代替案として示すほうが監査用脚注として簡潔です。
  issues:
  - severity: medium
    issue: γνωριζέσθω を「神に知っていただきなさい」としている。
    rationale: この表現は文法的には可能ですが、「知っていただく」が神への待遇表現として響き、原文の『あなたがたの願い事が神に知られるようにせよ』という受動命令の構文と焦点をやや曖昧にします。
  - severity: low
    issue: 「祈りと願いにより」がやや硬く不自然である。
    rationale: 原文の手段・随伴関係は、「感謝をもって祈りと願いをささげ」という日本語で、より自然かつ明瞭に表せます。
  - severity: low
    issue: 脚注bが英語監査記録の lexical_alternative と対応せず、説明文になっている。
    rationale: 「願い求め」という代替訳を示せば、δέησις の切実な願いという語感を保ちつつ、脚注の役割を明確にできます。
  revised_text: 何も思い煩ってはいけません。[a] むしろ、どんなことでも、感謝をもって祈りと願い[b]をささげ、あなたがたの願い事を神に[c]知っていただくようにしなさい。
