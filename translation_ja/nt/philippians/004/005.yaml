source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: ja
  text: あなたがたの寛容な態度が、すべての人に知られるようにしなさい。[a] 主は近いのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「柔和さ」「忍耐強い寛容さ」「道理をわきまえた態度」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「主は近い」は、主がすぐそばにおられること、主が間もなく来られること、またはその両方を意味する可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: 寛容な態度
  rationale: 単なる気質の柔和さに限らず、相手を思いやり、譲歩し、厳格に権利を主張しない振る舞いを表せる、自然で広がりのある日本語とした。
- source_word: γνωσθήτω
  choice: 知られるようにしなさい
  rationale: 受動命令の意味を保ちながら、当人たちの態度が万人に明らかになるよう求める表現として、現代日本語で自然に訳した。
- source_word: πᾶσιν ἀνθρώποις
  choice: すべての人に
  rationale: 性別を限定しない包括的な対象を、明快な現代日本語で表した。
- source_word: κύριος
  choice: 主
  rationale: 称号としての神学的な重みを保つ、定着した訳語を用いた。
- source_word: ἐγγύς
  choice: 近い
  rationale: 主がすぐそばにおられるという空間的・臨在的意味と、主の到来が間近だという時間的意味の双方を許す原文の曖昧さを保った。
theological_decisions:
- issue: ὁ κύριος ἐγγύς の意味
  choice: 主は近いのです
  alternative: 主は近くにおられます／主が来られる時は間近です
  rationale: ギリシア語は、主の臨在が近いことと、主の到来が近いことのどちらにも理解でき、両方を響かせている可能性もある。本文では一方に限定しなかった。
translation_notes:
  register: 明快で格調を保った現代標準日本語。ἐπιεικέςは抽象名詞だけでなく実際の振る舞いを指すことが伝わるよう「寛容な態度」とし、ἐγγύςは解釈を限定しない簡潔な「近い」で訳した。
