id: PHP.4.10
reference: Philippians 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: ja
  text: 私は主にあって大いに喜びました。今になって再び、あなたがたの私への心遣いが花開いたからです[a]。実際、あなたがたは私を気遣ってくれていましたが[b]、その機会がなかったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたが私への心遣いを再び示してくれた」。直訳では、「私のために心を向けること」が「再び花開いた」という意味です。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたは私のことを思ってくれていました」。このギリシア語動詞には、考える、心を向ける、気遣う、という意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: 私は喜びました
  rationale: アオリストの単純な出来事として、パウロ自身の喜びを明瞭かつ自然に表す。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 喜びの領域または根拠を示すパウロ特有の表現を、定着した日本語の聖書語法で保つ。
- source_word: μεγάλως
  choice: 大いに
  rationale: 喜びの強さを示す副詞の強調を、簡潔で品位ある日本語にする。
- source_word: ἤδη ποτὲ
  choice: 今ついに
  rationale: 時を経て再び状況が整ったことを示しつつ、相手への非難を不必要に含ませない。
- source_word: ἀνεθάλετε
  choice: 再び花開いた
  rationale: ἀναθάλλωの『再び芽吹く、花開く』という比喩を保ち、途絶えていたように見えた心遣いが再び表れたことを伝える。
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: あなたがたの私への心遣い
  rationale: φρονέωを単なる思考ではなく、パウロに向けられた配慮・関心として文脈的に表す。
- source_word: ἐφ’ ᾧ
  choice: 実際
  rationale: 直前の表現を補足し、彼らの心遣い自体は続いていたと明確にする説明的なつながりを自然に示す。
- source_word: ἐφρονεῖτε
  choice: 私を気遣ってくれていました
  rationale: 先行するφρονεῖνとの意味上の対応を保ちながら、継続していた配慮を自然な日本語で表す。
- source_word: ἠκαιρεῖσθε
  choice: その機会がなかった
  rationale: 意欲ではなく、適切な機会が欠けていたことを示す。
theological_decisions:
- issue: 『再び花開いた』と、継続していた心遣いとの緊張
  choice: 比喩を本文に残し、後半で心遣いは存在していたと明示する
  alternative: 『心遣いを新たに示してくれた』と解釈的に平準化する
  rationale: 本文は、外面的には心遣いが再び花開いた一方、内面的な配慮は続いていたという緊張を保っているため、それを解消しない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「主にあって」でパウロ書簡の神学的表現を保った。「再び花開いた」は原文の生きた比喩を伝えるため本文に採用し、脚注で意味中心の別訳を示した。
