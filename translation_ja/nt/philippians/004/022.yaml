base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: ja
  text: すべての聖徒が、あなたがたによろしくと言っています。中でも特に、カエサルの家に属する人々がそうです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「カエサルの家に属する人々」とは、皇帝の家政や宮廷に関係する人々を指し、必ずしもカエサルの家族だけを意味するわけではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: よろしくと言っています
  rationale: 書簡の結びに用いられる挨拶の動詞であり、現代日本語の手紙として自然な表現にした。直接相手に会って挨拶するというより、挨拶を伝える文脈にも適する。
- source_word: πάντες οἱ ἅγιοι
  choice: すべての聖徒
  rationale: ἅγιοιはパウロ書簡で信徒共同体を指す定着した呼称である。「神の民」などと説明的に言い換えず、原語の聖性を表す語を保持した。
- source_word: μάλιστα δὲ
  choice: 中でも
  rationale: 全体の中で一群を特に取り上げる意味を、自然で明瞭な現代日本語で表した。
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: カエサルの家に属する人々
  rationale: ἐκがここで示す、皇帝の家政・宮廷に関係する集団への所属を表しつつ、血縁の家族だけに限定しない訳とした。
- source_word: Καίσαρος
  choice: カエサル
  rationale: 原文の歴史的な称号・名を保ち、解釈的な「皇帝」への置換を本文では避けた。
theological_decisions:
- issue: パウロ書簡における「聖徒」の意味
  choice: 信徒共同体を指す呼称として「聖徒」と訳す
  alternative: 「神の民」「信者たち」「聖なる者たち」
  rationale: ここで特別に聖性の高い一部の人々だけを指すとは限定せず、同時に説明的な言い換えによって原語の神学的含意を解消しないため。
- issue: 「カエサルの家」の範囲
  choice: 皇帝家政・宮廷に属する人々を含み得る表現とする
  alternative: カエサルの血縁家族だけを指す
  rationale: οἰκίαはこの文脈で血縁の家族に限定されず、奴隷、解放奴隷、役人など皇帝の家政に関係する人々を指し得るため。ただし個々の身分は本文から確定しない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「聖徒」と「カエサル」は原文の主要語を保つために用い、後半は日本語で主語の重点が明確になるよう「中でも」を用いた。
