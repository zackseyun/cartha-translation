id: PHP.2.19
reference: Philippians 2:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: ja
  text: しかし私は、主イエスにあって、テモテを近いうちにあなたがたのもとへ遣わしたいと願っています。あなたがたの様子を知って、私も励まされるためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: 願っています
  rationale: 現在の希望・期待を表す。日本語では、派遣を意図する文脈に自然な「遣わしたいと願っています」とした。
- source_word: δὲ
  choice: しかし
  rationale: 前段からの穏やかな転換を示す。文脈上のつながりを明示するため「しかし」とした。
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: 主イエスにあって
  rationale: パウロの希望が主イエスとの関係と依存のうちにあることを保ち、ἐνを解釈的に言い換えすぎない表現とした。
- source_word: Τιμόθεον
  choice: テモテ
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: ταχέως
  choice: 近いうちに
  rationale: ここでは動作の速さより、派遣の時期が間近であることを表す。
- source_word: πέμψαι ὑμῖν
  choice: あなたがたのもとへ遣わす
  rationale: 派遣を表すπέμπωには「遣わす」を用い、与格ὑμῖνは目的地を自然に示す「あなたがたのもとへ」とした。
- source_word: ἵνα
  choice: そうすれば
  rationale: テモテ派遣によって期待される結果・目的を、自然な現代日本語で示した。
- source_word: κἀγὼ
  choice: 私も
  rationale: καίを含む融合形の付加的な強調を簡潔に保持した。
- source_word: εὐψυχῶ
  choice: 元気づけられる
  rationale: 「良い心持ちになる、意気が上がる」という語義を、明瞭で自然な日本語にした。
- source_word: γνοὺς
  choice: 知って
  rationale: アオリスト分詞の先行・契機を日本語の接続形で自然に表した。
- source_word: τὰ περὶ ὑμῶν
  choice: あなたがたの様子
  rationale: 直訳的な「あなたがたに関する事柄」が指す近況・状態を、過度に限定せず自然に表した。
theological_decisions:
- issue: ἐν κυρίῳ Ἰησοῦの関係的・神学的含意
  choice: 主イエスにあって
  alternative: 主イエスによって／主イエスにより頼んで
  rationale: 希望の実現手段だけに限定せず、パウロ特有の「主との結びつきのうちに」という含みを保持した。
- issue: κύριοςの称号
  choice: 主
  alternative: 主人
  rationale: 新約におけるイエスの称号として定着し、キリスト論的含意を保つ「主」を用いた。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、書簡としての品位を保った。「主イエスにあって」は一般会話より聖書的な表現だが、原文の関係的含意を保つため採用した。
