  naturalness: 全体として明瞭な現代標準日本語である。「私も励まされるためです」と目的を明示する形にすると、書簡として自然で、原文の構文関係もより明確になる。
  terminology: 「主」はκύριοςの称号として適切であり、「主イエスにあって」も原文のἐνの関係的含意を保っている。「テモテ」は定着した日本語表記である。
