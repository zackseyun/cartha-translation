id: PHP.2.30
reference: Philippians 2:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: ja
  text: というのも、彼はあなたがたの私への奉仕に欠けていた分[b]を補うため、メシア[a]の働きのために命を危険にさらして死に瀕したからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。ギリシア語は「メシア／キリストの働き」。
    reason: alternative_reading
  - marker: b
    text: 「欠けていた分」とは、あなたがたに意欲がなかったという意味ではなく、離れていたために直接行えなかった奉仕を指す。
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: メシアの働きのために
  rationale: διά＋対格が表す理由・目的の含みを、自然な日本語の「〜のために」で表した。「働き」はἔργονを広く保ち、Χριστοῦは称号として「メシア」と訳した。
- source_word: μέχρι θανάτου ἤγγισεν
  choice: 死に瀕した
  rationale: 直訳的な「死に近づいた」がこの文脈で意味する、死の間際に至った状態を、簡潔で自然な現代日本語にした。
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: 命を危険にさらして
  rationale: 分詞が表す、自らの地上の命を危険にさらす行為を明確にした。ψυχήはここでは非物質的な「魂」ではなく「命」を指す。
- source_word: ἵνα ἀναπληρώσῃ
  choice: 補うためでした
  rationale: ἵνα節の目的を明示し、ἀναπληρόωの「不足分を満たす」という意味を自然に表した。
- source_word: τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας
  choice: あなたがたの私への奉仕に欠けていた分
  rationale: λειτουργίαを文脈に即して「奉仕」とし、ὑστέρημαを道徳的非難にせず、実際に満たされていなかった分として表した。
theological_decisions:
- issue: Χριστοῦをパウロ書簡の称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςの称号としての意味を読者に直接伝えるため「メシア」とした。一方、日本語で定着した「キリスト」も可能なので脚注に示した。
- issue: 「欠けていた分」がフィリピの信徒への非難を意味するか
  choice: 奉仕のうち実際に届けられなかった分として訳す
  alternative: あなたがたの奉仕の不足
  rationale: ὑστέρημαの語義は不足を表すが、文脈上、彼らの不熱心を責めるというより、離れていたため本人たちが直接果たせなかった奉仕をエパフロディトが担ったことを指す。本文では曖昧さを保ち、文脈説明を脚注に置いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも」で前節との理由関係を示し、長い一文を二文に分けて読みやすくした。「死に瀕した」「命を危険にさらして」は原文の強さを保ちつつ自然な表現とした。
