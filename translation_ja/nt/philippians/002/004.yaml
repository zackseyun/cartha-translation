  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: ja
  text: あなたがたは一人ひとり、自分のことだけでなく、ほかの人のことにも目を向けなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「それぞれ、自分自身の事柄だけに目を向けるのではなく、ほかの人たちの事柄にも目を向けて」となる。
    reason: 「自分のこと」「ほかの人のこと」は、所有物に限られない広いギリシア語表現を自然な日本語にしたものであり、原文の配分的な表現と、「自分のことだけでなく他者のことにも」という構文を示すため。
lexical_decisions:
- source_word: σκοποῦντες
  choice: 目を向けなさい
  rationale: ここでは、ある事柄に注意と関心を向けることを表す。文脈上の勧告の力を自然な日本語の命令形で示した。
- source_word: τὰ ἑαυτῶν
  choice: 自分のこと
  rationale: 中性複数形の表現は所有物だけでなく、自分に関わる事柄や利害を広く指すため、「自分のこと」とした。
- source_word: ἕκαστοι
  choice: あなたがたは一人ひとり
  rationale: 共同体の各人に個別に呼びかける配分的な意味を明確に伝える。
- source_word: ἀλλὰ καὶ
  choice: だけでなく、…にも
  rationale: 対比と追加の両方を保ち、自分のことを一切顧みてはならないという意味にならないようにした。
- source_word: τὰ ἑτέρων
  choice: ほかの人のこと
  rationale: 他者の所有物に限定せず、その事情、必要、益などを広く含む表現として自然である。
theological_decisions:
- issue: 分詞 σκοποῦντες の勧告としての表現
  choice: 「目を向けなさい」と命令形で訳す
  alternative: 「目を向けつつ」と分詞的に訳す
  rationale: ギリシア語は分詞形だが、直前から続く勧告の文脈に従属している。単独節として明瞭な現代日本語にするため勧告の力を明示しつつ、内容自体は補わなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用い、「一人ひとり」で個別性を示した。「自分のことだけでなく」によって、自分自身への配慮を全面否定せず、他者への配慮を加える原文の緊張を保った。
