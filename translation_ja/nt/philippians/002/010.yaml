  text: ἵνα ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/010.yaml
  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: ja
  text: それは、イエスの名において[a]、天にいる者、地にいる者、地の下にいる者が皆[b]、ひざをかがめ、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの名によって」。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「天にいる者、地にいる者、地の下にいる者の、すべてのひざ」。ここでは日本語として自然になるよう、「者が皆、ひざをかがめ」と表現した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは、～ためです
  rationale: 直前の節から続く目的・結果を示す接続を保つ。日本語本文では後続する2:11まで文が続くため、ここでは「それは」で導き、終止を避けた。
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: イエスの名によって
  rationale: ἐν の基本的な幅を保ち、「名が告げられる時に」という解釈へ限定しない表現とした。「イエスの名のもとに」も可能だが、現代日本語としてやや不自然である。
- source_word: πᾶν γόνυ
  choice: 皆、ひざを
  rationale: 「すべてのひざ」という直訳調を避けつつ、普遍性と、ひざをかがめるという身体的な敬意の像をともに保った。
- source_word: κάμψῃ
  choice: かがめ
  rationale: γόνυ と結びつく慣用的な動作を自然な日本語で表し、服従・礼拝の身振りを保持する。ἵνα に従属するため、次節へ続く連用形とした。
- source_word: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: 天にあるもの、地にあるもの、地の下にあるもの
  rationale: 三つの実体化された形容詞を、それぞれの領域に属する存在を指す表現として訳し、具体的に天使・人間・死者または悪霊とは特定しない。
theological_decisions:
- issue: ἐν τῷ ὀνόματι Ἰησοῦ の意味
  choice: 「イエスの名によって」とし、その名に伴う権威・臨在のもとでの行為という幅を残す。
  alternative: 「イエスの名を聞いて」または「イエスの名において」
  rationale: ギリシア語は「名を聞いた時」と明記しておらず、時間的契機だけに限定しない。「名において」も可能だが、現代日本語では代理・資格の意味に狭く受け取られやすい。
- issue: 天・地・地の下という三分表現の対象
  choice: 全被造世界に及ぶ普遍的な範囲を保ち、各領域の存在者を特定しない。
  alternative: 天使、人間、死者、または悪霊などを明示する。
  rationale: 本文は各群の正体を明示していないため、宇宙的な広がりを示しつつ解釈上の過剰な限定を避けた。
- issue: κάμψῃ のニュアンス
  choice: 「ひざをかがめ」として、普遍的な敬意・服従の身振りを表す。
  alternative: 自発的な礼拝または強制された服従のいずれかに限定する。
  rationale: 本文の動詞だけでは各存在者の内面的な自発性までは確定できないため、その緊張を残した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。2:9から2:11まで続く統語構造を踏まえ、本節を句点で閉じず、次節の「告白する」へ接続できる形にした。
