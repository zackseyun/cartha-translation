  naturalness: 明瞭な現代標準日本語であり、理由を示す「からです」も前節とのγάρのつながりにふさわしい。関係節を「…くれる人が、ほかにいない」と組み替えた構文も読みやすい。
  terminology: 「同じ思い」「真心から」「気遣う」はいずれもこの文脈に適した非教派的で自然な語である。脚注aは字義的な選択肢を、脚注bはτὰ περὶ ὑμῶνの広い対象範囲を適切に補っている。
