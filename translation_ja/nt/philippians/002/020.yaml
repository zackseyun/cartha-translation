  text: οὐδένα γὰρ ἔχω ἰσόψυχον ὅστις γνησίως τὰ περὶ ὑμῶν μεριμνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/020.yaml
  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: ja
  text: 私には、私と同じ思いで[a]、あなたがたのことを真心から気遣ってくれる[b]人が、ほかにいないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「魂が等しく」。または「心を同じくして」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたに関わる事柄を真心から心にかけてくれる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: からです
  rationale: 前節でテモテを遣わしたいと述べた理由を示す説明の働きを、自然な日本語の文末表現で示した。
- source_word: οὐδένα … ἔχω
  choice: 人が、ほかにいない
  rationale: テモテ以外には該当する者がいないという文脈を、現代日本語で誤解なく表した。
- source_word: ἰσόψυχον
  choice: 私と同じ思いで
  rationale: 字義的には「魂が等しい」を意味する語を、パウロと同じ内的姿勢を持つという文脈に即して、明瞭かつ自然に表した。
- source_word: ὅστις
  choice: 人が
  rationale: 先行する「誰もいない」と、それに続く人物の性質を示す関係節を、自然な日本語の連体修飾に組み替えた。
- source_word: γνησίως
  choice: 真心から
  rationale: 見せかけではない真正で誠実な配慮を、平明で品位ある日本語で表した。
- source_word: τὰ περὶ ὑμῶν
  choice: あなたがたのこと
  rationale: ピリピの信徒たちに関わる事情や必要全般を指す幅を保ち、「福祉」など特定の意味に狭めなかった。
- source_word: μεριμνήσει
  choice: 気遣ってくれる
  rationale: ここでは否定的な不安ではなく、相手を思う積極的な配慮を表すため、「気遣う」とした。未来形の意味は、これから遣わされる人物について述べる文脈と「くれる」によって自然に伝わる。
theological_decisions:
- issue: ἰσόψυχονが誰との同心を表すか
  choice: 「私と同じ思いで」とし、パウロとの同心を明示した
  alternative: 「彼のような人」「心を同じくする人」
  rationale: 一人称主語の「私は持っていない」に伴う語であり、文脈上はテモテがパウロと同じ真実な配慮を抱くことを指す。ただし語そのものの比喩的な字義は脚注に残した。
- issue: μεριμνάωの肯定的・否定的含意
  choice: 肯定的な配慮として「気遣う」
  alternative: 「心配する」「思い煩う」
  rationale: 本節ではピリピの信徒への牧会的な関心が称賛されており、否定的な不安を意味しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説明を過度に加えず、パウロの温かな確信とテモテへの評価が伝わる品位ある語調とした。
