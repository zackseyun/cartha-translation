id: PHP.2.12
reference: Philippians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: ja
  text: ですから、私の愛する人たち、あなたがたがいつも従ってきたように、私がいる時だけでなく、今、私がいない時にはなおさら、恐れとおののきをもって[a]、自分たち自身の救いを成し遂げなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恐れとおののき」は、深い畏れ、厳粛さ、謙虚さを伴う態度を表す言い回しです。
    reason: lexical_alternative
  - marker: b
    text: 「成し遂げなさい」は、救いに関して実際に行い、完成へと進めるよう求める表現です。自分の功績によって救いを獲得することだけを意味する表現ではありません。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥστε
  choice: ですから
  rationale: 直前のキリストについての叙述と勧めを受ける推論的な接続を、自然な現代日本語で示す。
- source_word: ἀγαπητοί μου
  choice: 私の愛する人たち
  rationale: パウロの温かい呼びかけを保ちつつ、現代の一般読者にも明瞭な表現とした。
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: あなたがたがいつも従ってきたように
  rationale: これまで一貫して示された従順が現在の勧めにつながることを、「従ってきた」で自然に表した。従順の相手は原文で明示されていないため補わない。
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: 私がいる時／私がいない今
  rationale: 名詞的な対比を、日本語では分かりやすい節にして明確に再現した。
- source_word: πολλῷ μᾶλλον
  choice: 今はなおさら
  rationale: 不在である現在において一層そうすべきだという強調を簡潔に示す。
- source_word: μετὰ φόβου καὶ τρόμου
  choice: 恐れとおののきをもって
  rationale: 定型句の厳粛さと感情的な重みを弱めずに保つ。「畏敬」だけに限定して原文の緊張を解消しない。
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: 自分自身の救い
  rationale: σωτηρίαの神学的な重みを「救い」で保ち、再帰代名詞の強調を「自分自身」で表す。命令の対象は複数の共同体であり、孤立した個人主義までは含意させない。
- source_word: κατεργάζεσθε
  choice: 成し遂げていきなさい
  rationale: 救いを生活の中で実際に全うしていく継続的な責任を自然に表す一方、「獲得しなさい」とは訳さず、救いを功績で買い取る意味を持ち込まない。
theological_decisions:
- issue: 「自分自身の救いを成し遂げる」の意味
  choice: 救いを実際の歩みの中で全うしていくよう命じる表現として訳す。
  alternative: 人間の努力によって救いそのものを獲得するよう命じていると読む。
  rationale: κατεργάζεσθεには、物事を実行し、結果まで進める意味がある。続く13節では神が彼らの内に働くとされるため、功績による救済と断定せず、同時に命令の強さも弱めない。
- issue: 「恐れとおののき」の性質
  choice: 神の前での畏れを伴う、厳粛で謙虚な姿勢を表す定型句として保持する。
  alternative: ただの恐怖、または感情的な重みのない礼儀的敬意と限定して訳す。
  rationale: φόβοςとτρόμοςの強い語感を残しつつ、その対象や心理状態を本文以上に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの牧会的な温かさと命令の厳粛さを保った。「恐れとおののき」という聖書的な定型表現は、過度に平板化せず本文に残した。
