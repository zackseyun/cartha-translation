  text: τὸ δὲ αὐτὸ καὶ ὑμεῖς χαίρετε καὶ συγχαίρετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/018.yaml
  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: ja
  text: 同じように、あなたがたも喜び、私と共に喜んでください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同様に、あなたがたも喜び、私と喜びを分かち合ってください。」
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: 同じように
  rationale: τὸ αὐτόはここでは副詞的に働き、直前のパウロ自身の喜びに対応するよう読者にも喜びを求めている。「同じように」は、その照応を自然な現代日本語で表す。δέは強い逆接ではなく、文脈を受けて話を進めるため、独立した接続語にはしなかった。
- source_word: χαίρετε
  choice: 喜び
  rationale: 現在能動命令法二人称複数。ピリピ書に繰り返される「喜び」の語彙を保ち、継続的な勧めとして自然に表した。
- source_word: συγχαίρετέ
  choice: 共に喜んでください
  rationale: σύνを含む複合動詞が示す、他者と喜びを分かち合う意味を明示した。日本語で二つの命令を自然につなぐため、後半に丁寧な命令表現を置いた。
- source_word: μοι
  choice: 私と
  rationale: 与格は、喜びを共にする相手としてパウロを示すため、「私と」と訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の二つの命令「喜べ」「共に喜べ」を区別しつつ、日本語として過度に硬くならないよう「喜び、…喜んでください」とした。脚注標識は節末に置いた。
