source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: ja
  text: 何事も、利己的な野心からも、むなしい虚栄からも行ってはなりません。むしろ、へりくだる心をもって、互いを自分よりも優れた者[a]と考えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「互いを自分よりも上の者と見なしなさい」または「互いを自分よりも重要な者と考えなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: 何事も……してはなりません
  rationale: 否定を前面に置くギリシア語の勧告を、自然で明確な現代日本語の禁止表現にした。
- source_word: κατ’ ἐριθείαν
  choice: 利己的な野心から
  rationale: ἐριθείαが表す党派的な対抗心や自己追求を含みつつ、動機を示すκατάのニュアンスを「から」で表した。
- source_word: κατὰ κενοδοξίαν
  choice: むなしい虚栄から
  rationale: 「空虚な栄光」という語義を反映し、実質のない自己顕示を明瞭に伝える表現とした。
- source_word: τῇ ταπεινοφροσύνῃ
  choice: へりくだって
  rationale: 態度・仕方を示す与格を、一般読者に自然で、かつ尊厳ある表現で訳した。
- source_word: ἀλλήλους ἡγούμενοι
  choice: 互いを……と考えなさい
  rationale: ἡγέομαιの認識・評価の意味と、ἀλλήλουςの相互性を明確に表した。ギリシア語では分詞だが、日本語では主節の勧告として整えた。
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: 自分より優れた者
  rationale: ὑπερέχωの比較的な「上にある、優っている」という意味を保持し、「重要」と限定せず原文の幅を残した。
theological_decisions:
- issue: ὑπερέχονταςが示す比較の性質
  choice: 自分より優れた者
  alternative: 自分より大切な者／自分より重要な者
  rationale: 原文は価値、地位、能力のいずれかに明示的に限定していないため、「大切・重要」と解釈を狭めず、比較の緊張を保った。脚注で別訳を示した。
translation_notes:
  register: 明瞭な現代標準語による丁寧体。命令的な勧告の力を保ちつつ、教派特有の用語を避けた。「虚栄」はやや格調があるが現代語として通用し、κενοδοξίαの「空虚な栄光」を簡潔に伝える。
