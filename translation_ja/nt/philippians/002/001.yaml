  terminology: Χριστόςを「メシア」とする方針は保持されている。「霊の交わり」はκοινωνία πνεύματοςの簡潔さと属格関係の曖昧さを保つ。注記は「霊への参与」および人間の霊・心と理解する可能性を読者に示しており、本文で解釈を固定していない。
