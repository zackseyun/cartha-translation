id: PHP.2.1
reference: Philippians 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: ja
  text: ですから、メシアにあって励ましが少しでもあり、愛から来る慰めが少しでもあり、霊の交わり[a]が少しでもあり、深い愛情と思いやりが少しでもあるなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「霊への参与」、または「霊によって生じる交わり」。可能性は低いが、「心の交わり」とも訳せる。
    reason: πνεύματος が聖霊か人間の霊・心か、また κοινωνία との属格関係が何を示すかに解釈の幅があるため。
lexical_decisions:
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論を受ける推論的なつながりを、明瞭で自然な現代日本語で示す。
- source_word: παράκλησις
  choice: 励まし
  rationale: この文脈では、慰めつつ力づける働きを表す。「勧告」ほど命令的に狭めず、続く παραμύθιον の「慰め」とも区別できる。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστός の称号としての意味を保ち、ἐν の結びつきも日本語の聖書文体として自然な「にあって」で表す。
- source_word: παραμύθιον
  choice: 慰め
  rationale: 慰めとなる言葉や慰安を指す語であり、παράκλησις の「励まし」と意味上の重なりを認めつつ区別する。
- source_word: ἀγάπης
  choice: 愛から来る
  rationale: 属格を源泉として理解する有力な意味を、現代日本語で明瞭に表す。
- source_word: κοινωνία πνεύματος
  choice: 霊の交わり
  rationale: κοινωνία の共同性を「交わり」で表し、属格が示す関係を本文ではあえて圧縮したままにして、原文の曖昧さを保つ。
- source_word: σπλάγχνα
  choice: 深い愛情
  rationale: 字義的には内臓を指すが、ここでは心の奥からの情愛を表す慣用語なので、解剖学的な響きを避けて感情の深さを示す。
- source_word: οἰκτιρμοί
  choice: 思いやり
  rationale: 他者の苦しみに心を寄せる憐れみを、普通の現代日本語で自然に表し、「深い愛情」と意味を重ねすぎないようにした。
- source_word: εἴ τις / εἴ τι
  choice: 少しでもあり……あるなら
  rationale: 四つの条件を一つの流れとして示し、後続節へ続く条件文であることを明確にする。「少しでも」はここでの修辞的な any の力を自然に伝える。
theological_decisions:
- issue: πνεύματος が聖霊を指すか、また κοινωνία との属格関係をどう表すか
  choice: 霊の交わり
  alternative: 「霊への参与」、または「霊によって生じる交わり」。可能性は低いが「心の交わり」もあり得る。
  rationale: パウロの用法とキリスト者に与えられた恵みを列挙する文脈からは聖霊への言及が最も有力である。しかし、属格が参与の対象、交わりの源、あるいは別の関係を示すかは原文だけでは完全に確定できないため、本文の「霊の交わり」で簡潔さと曖昧さを保ち、別解を注記する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「メシアにあって」「霊の交わり」によって簡潔で品位ある聖書文体を保った。原文で反復される条件句は「少しでもあり」を繰り返して修辞的な積み重ねを再現し、この節が次節へ続く未完の条件節であるため読点で結んだ。
