  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: ja
  text: 自らを低くし、死に至るまで従順になられました。しかも、十字架の死に至るまで従順であられました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「死に至るまで従順となり、しかも十字架の死に至るまで」。後半は、死のうちでも十字架による死を強調しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν ἑαυτὸν
  choice: 自らを低くし
  rationale: 動詞と再帰代名詞を一体として自然な現代日本語にしつつ、主体的な自己卑下を明示する。「へりくだり」も可能だが、文脈上の下降をより直接に表すため「自らを低くし」とした。
- source_word: γενόμενος ὑπήκοος
  choice: 従順になられました
  rationale: 分詞の「～となって」を日本語として自然に表し、自己を低くしたことの具体的な現れが従順であったというつながりを保った。敬語はキリストを指す日本語本文として節度ある尊敬表現を用いた。
- source_word: μέχρι θανάτου
  choice: 死に至るまで
  rationale: μέχρι の到達限界を明確にし、従順が死そのものにまで及んだ意味を簡潔に保つ。
- source_word: θανάτου δὲ σταυροῦ
  choice: しかも、十字架の死にまで至ったのです
  rationale: 圧縮された属格表現を自然な日本語に展開し、δέ がもたらす修辞的な強調と、十字架刑という死の具体的形態を示した。
theological_decisions:
- issue: θανάτου δὲ σταυροῦ の修辞的な力
  choice: 「しかも、十字架の死にまで」と段階を強める表現にする
  alternative: 「すなわち十字架の死に至るまで」と同格的に表す
  rationale: δέ を単なる説明ではなく強調的な展開と理解し、死一般から十字架の死へと頂点に達する原文の緊張を保つ。ただし、十字架の神学的意味を本文に補足しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の簡潔さとクライマックスを保ちながら、日本語で意味が途切れないよう二文に分けた。脚注記号は強調句の後に配置した。
