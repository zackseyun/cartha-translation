  text: ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/006.yaml
  text: who[a], though he was in the form of God, did not consider equality with God something to be grasped[c][b],
translation:
  language: ja
  text: この方は、神のかたちでありながら[a]、神との平等[c]を、自分の利益のために利用するもの[b]とは考えませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神のかたちで存在しておられ」。ὑπάρχωνは、「ありながら」という譲歩とも、存在状態を述べる表現とも取れます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「つかみ取るもの」または「手放さず保持するもの」。ἁρπαγμόςの意味については解釈が分かれます。
    reason: alternative_reading
  - marker: c
    text: 直訳「神と等しくあること」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: この方は
  rationale: 直前のキリストを受ける関係代名詞。単独の節としても自然に読めるよう、指示を補って「この方は」とした。
- source_word: ἐν μορφῇ θεοῦ
  choice: 神のかたちで
  rationale: μορφήを抽象的な「本性」と言い換えず、「かたち」として保つことで、原文の表現とその高いキリスト論的含意を残した。
- source_word: ὑπάρχων
  choice: ありながら
  rationale: 7節の自己放棄との対照を表す譲歩の働きを自然な日本語で明示した。ただし、単に存在状態を述べる分詞とも取れるため、別訳を脚注に残した。
- source_word: ἁρπαγμὸν
  choice: 自分の利益のために利用すべきもの
  rationale: 文脈が獲得よりも自己を与える行為を対照的に描くため、自己利益のために用いる対象という理解を採った。語義には「つかみ取るもの」「手放さず保持するもの」という有力な異説があるため、脚注で明示した。
- source_word: ἡγήσατο
  choice: 考えませんでした
  rationale: 価値判断を表すἡγέομαιを、現代日本語で自然かつ原意に近く表した。
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: 神との平等
  rationale: 冠詞付き不定詞句を簡潔で自然な名詞句にした。直訳的な形は脚注に示した。
theological_decisions:
- issue: ἐν μορφῇ θεοῦのキリスト論的含意
  choice: 「神のかたちで」とし、パウロの語そのものを保つ。
  alternative: 「神の本性を持って」「神であって」
  rationale: 本文は高いキリスト論を示すが、後代の教理用語で意味を先取りせず、原文の表現が持つ幅を維持した。
- issue: ἁρπαγμόςと神との平等の関係
  choice: 「自分の利益のために利用すべきもの」を本文に置く。
  alternative: 「つかみ取るべきもの」「手放さず保持すべきもの」
  rationale: 直後の自己放棄との対照から、既にある地位を自己利益のために用いないという理解を採った。一方、獲得または保持を指す解釈も語義上可能なので、脚注に残して解釈上の緊張を解消しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「この方」「神のかたち」で荘重さを保った。語順は日本語として自然に整えつつ、譲歩、神との平等、ἁρπαγμόςをめぐる解釈上の論点を本文と脚注に保持した。
