id: PHP.2.13
reference: Philippians 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: ja
  text: なぜなら、神が、ご自分のよいお心のために、あなたがたのうちに、志すことも行うことも生じるように働いておられるからです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「志すことそのものも、行うことそのものも」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ご自分のよいお心に従って」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: だからです
  rationale: 直前の勧めの根拠を示す接続の働きを、現代日本語で自然な文末表現として保った。
- source_word: ὁ ἐνεργῶν
  choice: 働き、…生じさせておられる方
  rationale: 冠詞付き現在分詞の実質名詞的用法と継続的な働きを表しつつ、後続する二つの冠詞付き不定詞との統語関係を明瞭にした。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちで
  rationale: 複数形を明示し、各人の内面とも共同体の中とも取り得る原文の幅を残した。
- source_word: τὸ θέλειν
  choice: 志すこと
  rationale: 単なる感情的な願望に狭めず、意志・意欲の意味を、一般読者にも自然な表現で示した。
- source_word: τὸ ἐνεργεῖν
  choice: 行うこと
  rationale: 意志と対になる実際の行為を簡潔に表した。「働くこと」も可能だが、日本語では神の「働き」と人の行為との関係が不自然に曖昧になりやすいため避けた。
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: ご自分の喜びのために
  rationale: ὑπέρ＋属格の目的・利益の意味を優先し、εὐδοκίαを神の喜び・よしとされることとして表した。所有者が神であることは文脈上補った。
theological_decisions:
- issue: 神の働きと人間の意志・行為
  choice: 神が「志すことも行うことも」人々のうちに生じさせるという二重の表現をそのまま保った。
  alternative: 神が願望だけを与える、または行為を可能にする能力だけを与える、と限定して訳す。
  rationale: 本文は意志と行為の双方に及ぶ神の働きを述べる一方、人間が志し行うという表現も残しているため、その緊張関係を特定の教派的説明で解消しなかった。
- issue: εὐδοκίαの所有者とὑπέρの関係
  choice: 「ご自分の喜びのために」
  alternative: 「ご自分の喜びに従って」
  rationale: 所有代名詞は原文に明記されないが、主語である神を指すと理解するのが自然である。ὑπέρは第一に目的を表す訳とし、「従って」という解釈は脚注に残した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「神こそ」でθεόςの前置による焦点を示し、「あなたがた」により複数を保持した。「み心」は教会語として意味を先取りしやすいため本文では用いず、「ご自分の喜び」とした。
