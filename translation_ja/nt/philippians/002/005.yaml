  yaml_path: translation/nt/philippians/002/005.yaml
  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: ja
  text: あなたがたの間でこの思いを抱きなさい。[a]それは、メシアであるイエスにもあったものです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアであるイエスにあって、あなたがたの間でもこの思いを抱きなさい。」原文は簡潔で、「イエスにあった思い」を模範とする意味にも、メシアとの結びつきにおいて信徒が抱く思いを指す意味にも取れる。
    reason: 関係節の動詞が省略された構文について、本文が採る模範的理解とは別の参与的・結合的理解を、意味を決めつけずに示すため。
  - marker: b
    text: ギリシア語は「キリスト」。ここでは称号としての意味を明確にするため「メシア」と訳した。
    reason: Χριστός の称号としての語義と、一般的な音訳「キリスト」の両方を示すため。
lexical_decisions:
- source_word: τοῦτο
  choice: この思い
  rationale: 指示語は後に続くイエスのへりくだりを指す。日本語では動詞 φρονεῖτε の意味を補って「この思い」とすることで、簡潔さを保ちつつ自然にした。
- source_word: φρονεῖτε
  choice: 抱きなさい
  rationale: 単なる知的思考ではなく、態度や心構えを持つことを表す現在命令形であるため、「思いを抱きなさい」と訳した。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 複数形であり、2章1～4節の共同体的文脈にも合うため、個々人の内面だけでなく信徒相互の間にあるべき思いを表した。
- source_word: ὃ καὶ ἐν Χριστῷ Ἰησοῦ
  choice: それは、メシアであるイエスにもあった思いです
  rationale: 省略を含む圧縮されたギリシア語を、直後に描かれるイエスの自己卑下を模範とする読みで自然な日本語にした。ただし、メシアとの結びつきにおいて信徒が持つ思いとする解釈も脚注に残した。
- source_word: Χριστῷ
  choice: メシアである
  rationale: Χριστός はここで称号として機能するため、その称号性が明瞭な「メシア」とした。「メシア・イエス」より自然な日本語となるよう「メシアであるイエス」と表現した。
theological_decisions:
- issue: 関係節が、イエスに実際にあった模範的な思いを指すのか、それともメシアとの結びつきにおいて信徒が抱く思いを指すのか
  choice: 本文では「それは、メシアであるイエスにもあった思いです」とし、模範としての読みを採用した。
  alternative: 「メシアであるイエスにあって、あなたがたも抱いているこの思いを、互いの間で抱きなさい」とも訳せる。
  rationale: 直後の6～8節がイエスの自己卑下を描くため、模範として読むのが文脈上自然である。一方、原文は動詞が省略された簡潔な構文であり、ἐν Χριστῷ をパウロに特徴的な参与・結合の表現と取る余地があるため、別訳を排除しなかった。
- issue: Χριστός を日本語でどう表すか
  choice: メシア
  alternative: キリスト
  rationale: 固有名の一部としてではなく称号としての働きを明示するため「メシア」とした。伝統的な音訳「キリスト」は脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、勧告としての厳かさを保つ文体とした。「あなたがたの間で」によって共同体的な方向性を示し、「この思いを抱きなさい」で原文の簡潔な命令を自然な日本語にした。
