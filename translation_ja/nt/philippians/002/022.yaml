- from: しかし、テモテが試練を経て確かな者であることを、あなたがたは知っています。彼は、子が父と共に仕えるように[a]、私と共に福音のために仕えてきました。
  to: しかし、テモテが試練を経て確かさを示したことを、あなたがたは知っています。彼は、子が父と共に仕えるように[a]、私と共に福音のために仕えました。
  rationale: δοκιμήの「試みを経て実証された」意味を保つため、人物を抽象的に「確かな者」とするよりも、「確かさを示したこと」としました。父子の比喩については、本文ではパウロとテモテの共同奉仕という自然な読みを維持しつつ、注でπατρίの関係表現が一義的でないことを示しました。
