id: PHP.2.22
reference: Philippians 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: ja
  text: しかし、テモテが試練を経て確かさを示したことを、あなたがたは知っています。彼は、子が父と共に仕えるように[a]、私と共に福音のために仕えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「父に対する子のように」とも訳せます。この父子の比喩は、後半の「仕えました」と結びつきます。本文は、子が父と共に仕える姿として理解しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節との緩やかな対照を示しつつ、現代日本語として自然につなぐ。
- source_word: τὴν δοκιμὴν αὐτοῦ
  choice: テモテが試練を経て確かな者であること
  rationale: δοκιμήが表す、試されて真正さや価値が実証された状態を明確に伝える。文脈上の指示対象であるテモテを明示した。
- source_word: γινώσκετε
  choice: あなたがたは知っています
  rationale: 現在形が示す、読者がすでに持っている継続的な認識を平明に表す。
- source_word: ὅτι
  choice: （次文による内容説明）
  rationale: 彼らが知っている事柄の内容を導入する語として、自然な日本語では文を分けて表した。
- source_word: ὡς πατρὶ τέκνον
  choice: 子が父と共に仕えるように
  rationale: τέκνονを性別限定的な「息子」とせず「子」とし、ὡςの比喩を保持する。ギリシア語には「仕える」に相当する動詞がこの句内に明示されないため注を付した。
- source_word: σὺν ἐμοὶ
  choice: 私と共に
  rationale: パウロとの共同奉仕を簡潔かつ忠実に表す。
- source_word: ἐδούλευσεν
  choice: 仕えてきました
  rationale: δουλεύωの奉仕の意味を文脈に即して表し、過去の実績が現在の評価につながることを自然な日本語で示す。
- source_word: εἰς τὸ εὐαγγέλιον
  choice: 福音のために
  rationale: 福音を目標・目的とする奉仕という方向性を自然に表す。
theological_decisions:
- issue: 父子の比喩と共同奉仕者としての関係
  choice: 「子が父と共に仕えるように、私と共に」とし、比喩と実際の共同奉仕を区別した。
  alternative: 「父に仕える子のように、私に仕えた」
  rationale: 本文はσὺν ἐμοί（私と共に）と言い、テモテがパウロに仕えたとは明記しない。父子の比喩を保ちながら、福音への共同奉仕を損なわないようにした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「試練を経て確かな者」はδοκιμήの試験済みの真正さを説明的に表し、「子」はτέκνονの非性別限定的な語感を保つ。
