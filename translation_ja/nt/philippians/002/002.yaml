id: PHP.2.2
reference: Philippians 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: ja
  text: あなたがたは、同じ思いを抱き、同じ愛を持ち、心を一つにし[a]、一つのことを思って[b]、私の喜びを満たしてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一つの魂であり」。または「心を合わせ」。
    reason: lexical_alternative
  - marker: b
    text: または「一つの思いを抱いて」「一つの目的に心を向けて」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: 私の喜びを満たしてください
  rationale: πληρόωの「満たす」という比喩を保ちつつ、命令形を現代日本語の丁寧で品位ある勧告として表した。
- source_word: ἵνα
  choice: 前置された一連の表現と「〜て」でつなぐ
  rationale: ここでは命令の内容ないし、それによって喜びが満たされるあり方を導く。日本語では従属内容を先に置くことで、目的・手段の関係を自然に示した。
- source_word: τὸ αὐτὸ φρονῆτε
  choice: 同じ思いを抱き
  rationale: φρονέωは単なる知的思考以上に、考え方や志向を含みうる。「思いを抱く」はその幅を保ちながら自然な日本語となる。
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: 同じ愛を持ち
  rationale: ἀγάπηを基本的な訳語「愛」で表し、反復される「同じ」を明示した。
- source_word: σύμψυχοι
  choice: 心を一つにし
  rationale: 字義的には「魂を共にする／一つの魂である」に近いが、「心を一つにする」は内面的な一致という像を自然な現代日本語で伝える。
- source_word: τὸ ἓν φρονοῦντες
  choice: 一つのことを思って
  rationale: 前半と同じφρονέωに「思う」系の語を用い、原文の反復と結束への強調を保った。「一つのこと」は共通の目的とも一つの思いとも理解しうる余地を残す。
theological_decisions:
- issue: 二度のφρονέωが示す一致をどの程度具体化するか
  choice: 「同じ思いを抱き……一つのことを思って」と訳し、反復と変化を保つ
  alternative: 「同じ考えを持ち……一つの目的に心を向けて」として目的の一致を明示する
  rationale: 原文は共同体の一致を強く求める一方、その一致を特定の制度的・教理的画一性に限定してはいない。したがって、具体的な対象や形態を訳文で補わない。
- issue: σύμψυχοιのψυχήを「魂」と明示するか
  choice: 本文では自然な「心を一つにし」とし、字義的な像は脚注に示す
  alternative: 「魂を一つにし」または「一つの魂となり」
  rationale: 「魂」は原語の形を直接反映するが、日本語では身体と対置された実体についての主張と受け取られやすい。本文では共同の内面的姿勢を表し、原語の像も脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語。パウロの勧告にふさわしい丁寧さと品位を保ちつつ、過度に文語的な表現は避けた。原文で重なる一致の表現と、二度用いられるφρονέωの響きを可能な限り再現した。
