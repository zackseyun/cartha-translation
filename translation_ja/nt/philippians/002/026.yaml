  text: ἐπειδὴ ἐπιποθῶν ἦν πάντας ⸀ὑμᾶς, καὶ ἀδημονῶν διότι ἠκούσατε ὅτι ἠσθένησεν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: ja
  text: 彼はあなたがた皆を切に慕っており、また、自分が病気になったことをあなたがたが聞いたため、深く心を痛めていたからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ
  choice: からです
  rationale: 前節でエパフロディトを送り返す必要があると判断した理由を示す因果関係を、日本語として自然に文末で表した。
- source_word: ἐπιποθῶν ἦν
  choice: 会いたいと切に願っており
  rationale: 現在分詞と未完了過去の迂言形が表す、過去に継続していた強い思慕を表現した。「会いたい」は人を対象とする longing の文脈上の意味を明確にする。
- source_word: πάντας ὑμᾶς
  choice: あなたがた皆
  rationale: πάντας の包括的な強調を保ち、共同体の全員を指すことが明瞭になるようにした。
- source_word: ἀδημονῶν
  choice: ひどく心を痛めていた
  rationale: 軽い心配ではなく、強い精神的苦悩を表す語の強度を、現代日本語で自然に伝えた。
- source_word: διότι
  choice: ので
  rationale: 彼が心を痛めていた理由を導く直接的な因果表現とした。
- source_word: ἠκούσατε
  choice: あなたがたが聞いた
  rationale: 二人称複数のアオリストを率直に訳し、知らせがフィリピの人々に届いたことを表した。
- source_word: ὅτι ἠσθένησεν
  choice: 自分が病気になったこと
  rationale: ἀσθενέω の身体的な病気という意味と、アオリストが示し得る発病のニュアンスを「病気になった」で表した。主語がエパフロディトであることは日本語の再帰表現「自分」で明確にした。
theological_decisions: []
