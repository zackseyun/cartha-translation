  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: ja
  text: 私はそれゆえ、あなたがたが再び彼に会って喜び、私自身も悲しみが少なくなるようにと、いっそう熱心に彼を遣わしました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: なおさら熱心に
  rationale: 比較級の強意を「なおさら」で示し、σπουδαίωςの熱意・真剣さを自然な現代日本語の「熱心に」で表した。文脈上、単なる速度や緊急性に限定しない。
- source_word: οὖν
  choice: それで
  rationale: 前節までの事情を受けた推論・展開を、明瞭で自然な接続として表した。
- source_word: ἔπεμψα
  choice: 送りました
  rationale: アオリスト直説法を素直な過去形で訳した。書簡送付と使者派遣が重なる可能性はあるが、日本語では原文の時制表現に沿った。
- source_word: ἵνα
  choice: ためです
  rationale: 二つの接続法を支配する目的を明示し、文末で目的節として自然にまとめた。
- source_word: ἰδόντες αὐτὸν πάλιν
  choice: 彼と再会して
  rationale: 直訳は「彼を再び見て」だが、人物との再度の対面を自然かつ簡潔に表す「再会して」を採用した。
- source_word: χαρῆτε
  choice: 喜び
  rationale: 目的節内のアオリスト接続法。パウロ書簡で反復される「喜ぶ」という動詞的表現を保持した。
- source_word: κἀγὼ
  choice: 私も
  rationale: καὶ ἐγώの融合形が示す付加を「も」で自然に表し、受け手の喜びとパウロ自身の状態を並置した。
- source_word: ἀλυπότερος
  choice: 悲しみが少なくなる
  rationale: 比較級「より悲しみの少ない」を自然な日本語にした。λύπηの中核的な悲しみ・心痛を保ち、「不安」だけに限定しなかった。
- source_word: ὦ
  choice: なる
  rationale: εἰμίの現在接続法を、目的を表す「ためです」に従属する状態変化として自然に表現した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。敬体で品位を保ちつつ、「彼と再会して」で逐語性より自然な理解を優先した。「悲しみが少なくなる」は比較級を保持し、パウロの悲しみが完全になくなるとは訳していない。
