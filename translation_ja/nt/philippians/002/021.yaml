  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: ja
  text: 皆、自分のことを求め、イエス・キリストのことを求めてはいないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πάντες
  choice: 皆
  rationale: 定冠詞を伴う複数形が名詞的に用いられ、文脈上念頭にある人々をひとまとめに指す。「皆」はその総括的な強調を自然な日本語で保つ。
- source_word: γὰρ
  choice: からです
  rationale: 直前の発言の理由を示す接続関係を、日本語では文末の説明表現によって自然に表した。
- source_word: τὰ ἑαυτῶν
  choice: 自分のこと
  rationale: 中性複数形の慣用表現で、自分に属する事柄や自分自身の関心事を広く指す。「自分の利益」では経済的・功利的な意味に狭まりやすいため、広がりを保つ表現とした。
- source_word: ζητοῦσιν
  choice: 求め
  rationale: 探し求める、重んじて追求するという語義を簡潔に表し、前後二項の対照を維持する。
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: イエス・キリストのこと
  rationale: 省略された中性複数の「もの／事柄」を補って理解させつつ、前半の「自分のこと」と対称にした。Χριστόςは日本語で定着した称号表現「キリスト」とした。
theological_decisions:
- issue: τὰ ἑαυτῶν と τὰ Ἰησοῦ Χριστοῦ の対照
  choice: 「自分のこと」と「イエス・キリストのこと」
  alternative: 「自分の利益」と「イエス・キリストの利益」
  rationale: 原文は両方とも中性複数で意味範囲が広く、単に利得だけでなく関心、務め、目的などを含み得る。日本語でもその幅と対照を保ち、特定の神学的内容に限定しなかった。
- issue: Χριστοῦの訳し方
  choice: キリスト
  alternative: メシア
  rationale: 「イエス・キリスト」は現代日本語の聖書語法として自然であり、「キリスト」は称号に由来する語であることも保つ。ここで「メシア」と言い換えると、一般読者には別称のように響く可能性がある。
translation_notes:
  register: 明快な現代標準日本語。理由を表すγάρを文末の「からです」で示し、簡潔で落ち着いた説明調とした。原文の反復と道徳的対照を保つため、「求め」と「こと」を両項で対応させた。
