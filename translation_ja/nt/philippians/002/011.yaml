reference: Philippians 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: ja
  text: また、すべての舌が「メシア[a]であるイエスは主である」と言い表し、それが父なる神の栄光となるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的な表記では「キリスト」。ギリシア語の「クリストス」は「油を注がれた者」という称号で、ヘブライ語由来の「メシア」に当たる。
    reason: 称号としての意味と伝統的表記の両方を示すため。
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: すべての舌
  rationale: 普遍性と、イザヤ書45章23節を思わせる身体的な比喩の両方を保つため。日本語でも文脈上、すべての者による告白を指すと理解できる。
- source_word: ἐξομολογήσηται
  choice: 言い表し
  rationale: 公に認めて宣言するという動詞の力を、宗教用語に限定されすぎない自然な日本語で表す。「告白し」も可能だが、現代日本語では罪や個人的秘密の告白を連想させやすい。
- source_word: κύριος
  choice: 主
  rationale: 新約聖書における称号としての意味と、聖書的な普遍的礼拝の響きを保つ標準的な訳語。
- source_word: Ἰησοῦς Χριστός
  choice: メシアであるイエス
  rationale: Χριστόςがここで称号として働いていることを明示しつつ、告白の中心が『イエスは主である』ことにあるというギリシア語の構造を自然な日本語で保つ。
- source_word: εἰς δόξαν θεοῦ πατρός
  choice: 父なる神の栄光となるためです
  rationale: εἰςの方向・帰結を保ち、この告白が父なる神の栄光に至ることを表す。10節から続く目的節として自然に結ぶ。
theological_decisions:
- issue: Χριστόςを告白定式の中でどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名の一部としてだけでなく称号としての意味が生きているため、「メシア」を本文に置く。ただし、日本語で定着した伝統的表記「キリスト」も脚注に残す。
- issue: κύριος Ἰησοῦς Χριστόςの統語関係
  choice: 「メシアであるイエスは主である」
  alternative: 「イエス・キリストは主である」
  rationale: κύριοςを述語、Ἰησοῦς Χριστόςを主語と捉える基本的な構造を明瞭にしつつ、Χριστόςの称号性を示す。
- issue: εἰς δόξανの関係
  choice: 父なる神の栄光となるため
  alternative: 父なる神に栄光を帰すため
  rationale: 後者は人間が神に栄光を帰するという行為を補いかねない。原文の簡潔な結果・方向性を保つため、「栄光となる」を採用する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。10節から続く目的表現を「ためです」で受ける。「すべての舌」は意図的に原文の比喩を保持した。
