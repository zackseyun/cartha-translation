  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: ja
  text: また私は、主にあって、私自身も間もなくそちらへ行くことを確信しています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθα
  choice: 確信しています
  rationale: 完了形が表す、すでに成立して現在も続く確かな心の状態を、自然な現代日本語で示す。
- source_word: δὲ
  choice: そして
  rationale: 前節からの穏やかな継続を示す接続語として訳し、強い逆接にはしない。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロに特徴的な表現を保ち、確信が単なる自己判断ではなく主を基盤または領域としていることを示す。
- source_word: ὅτι
  choice: 〜と
  rationale: 確信の内容を導く日本語として自然に表す。
- source_word: καὶ αὐτὸς
  choice: 私自身も
  rationale: καίの追加の意味と、αὐτόςによるパウロ本人への強調をともに保持する。
- source_word: ταχέως
  choice: 間もなく
  rationale: 移動の速さではなく、実現する時期が近いことを表す文脈に合う。
- source_word: ἐλεύσομαι
  choice: そちらへ行くことになる
  rationale: ギリシア語は『来る』だが、宛先であるフィリピの人々に向かう移動を日本語の自然な直示法で『そちらへ行く』と表す。未来の予期も『ことになる』で保持する。
- source_word: κυρίῳ
  choice: 主
  rationale: パウロ書簡の κύριος に対する標準的で文脈に適した訳語。
theological_decisions:
- issue: パウロの確信と『主』との関係
  choice: 主にあって確信しています
  alternative: 主に信頼して、〜と思っています
  rationale: 確信が主との関係の中にあり、主を根拠とすることを保つ一方、直接の啓示による絶対的予告だとは言い切らない。
translation_notes:
  register: 明瞭で現代的な敬体を用いつつ、『主にあって』というパウロ的表現を保持した。『私自身も』により、テモテに加えてパウロ本人も行くという追加と強調を簡潔に示した。
