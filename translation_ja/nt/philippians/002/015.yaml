    rationale: ἵναの目的を保ちつつ、「あなたがたが……となるためです」とすれば、前節との接続を前提とする日本語としてより自然である。
  revised_text: あなたがたが、非難されるところがなく、純真で、曲がってゆがんだ世代[a]のただ中で傷のない神の子どもとなるためです。その人々の間で、あなたがたは世の中で光のように輝いています[c]。
