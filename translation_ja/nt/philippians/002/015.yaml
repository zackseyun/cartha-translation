reference: Philippians 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: ja
  text: あなたがたが、非難されるところがなく、純真で、曲がってゆがんだ世代[a]のただ中で傷のない神の子どもとなるためです。その人々の間で、あなたがたは世の中で光のように輝いています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「曲がってゆがんだ世代」は、申命記32章5節を踏まえ、神の子どもたちと不正な世代とを対比している可能性があります。
    reason: cross_reference
  - marker: c
    text: 別訳「光のように現れています」。また、「光」は「光体」または「天体」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: それは、あなたがたが……となるためです
  rationale: ἵναの目的・結果の含みと、γίνομαιの「なる」という動的な意味を保ちつつ、前節から続く目的節として自然な日本語にした。
- source_word: ἄμεμπτοι καὶ ἀκέραιοι
  choice: 非難されるところのない純真な者
  rationale: ἄμεμπτοιの非難すべき点がないことと、ἀκέραιοιの混じりけのなさ・道徳的純真さを区別して表した。
- source_word: τέκνα θεοῦ ἄμωμα
  choice: 傷のない神の子ども
  rationale: τέκναを性別を限定しない「子ども」とし、ἄμωμαは先のἄμεμπτοιと訳し分けて、傷や欠陥がないという比喩を残した。
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: 曲がってゆがんだ世代のただ中で
  rationale: 二つの形容語による強い倫理的評価と、周囲に取り囲まれている位置関係を明瞭に表した。
- source_word: ἐν οἷς
  choice: その人々の間で
  rationale: 先行する「世代」を、その世代に属する人々として受けるギリシア語の男性複数関係代名詞の働きを自然な日本語で示した。
- source_word: φαίνεσθε
  choice: 輝いています
  rationale: φωστῆρεςとの結びつきから発光の意味を本文に採用したが、「現れている／見える」の意味も可能なので脚注に残した。
- source_word: φωστῆρες ἐν κόσμῳ
  choice: 世の光
  rationale: φωστῆρεςを一般読者に分かりやすい「光」とし、κόσμοςはこの文脈で人間の世界を指す「世」とした。天体を示唆する訳語の可能性は脚注に示した。
theological_decisions:
- issue: 「傷のない」と「神の子ども」の関係、および申命記32章5節との響き合い
  choice: 「傷のない神の子ども」として直接結びつけ、申命記への示唆は脚注に置く
  alternative: 「傷のない」を節全体に広くかける、または申命記との対照を本文で明示する
  rationale: 語順上、ἄμωμαはτέκνα θεοῦを直接修飾するのが自然である。一方、申命記32章5節との対照は有力だが、本文に明示すると原文以上に解釈を固定するため脚注にとどめた。
- issue: φαίνεσθεの意味
  choice: 「輝いています」
  alternative: 「光として現れています」または「光のように見えます」
  rationale: 光を表すφωστῆρεςとの組み合わせでは「輝く」が文脈に最も適するが、「現れる」という語義上の曖昧さも真正な選択肢として脚注に保持した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位のある文体。長いギリシア語の目的節を二文に分けて読みやすくしつつ、第二文も目的節の内容として理解できる流れを保った。「純真」「傷のない」を使い分け、原文の二つの形容表現を平板化しないようにした。
