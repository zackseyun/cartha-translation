revisions:
- from: それは、あなたがたが非難されるところのない純真な者となり、曲がってゆがんだ世代[a]のただ中で、傷のない神の子どもとなるためです。その人々の間で、あなたがたは世の光[b]のように輝いています[c]。
  to: あなたがたが、非難されるところがなく、純真で、曲がってゆがんだ世代[a]のただ中で傷のない神の子どもとなるためです。その人々の間で、あなたがたは世の中で光のように輝いています[c]。
  rationale: 本文では、目的を表すἵναと「なる」を表すγένησθεを保ちつつ、単独でも読める現代標準日本語に整えました。「世の中で」をφαίνεσθε／「光のように」に係る場所の句として明示し、ἐν κόσμῳの機能を保持しました。脚注は、原文にない「世の」という限定を除き、脚注アンカーを実際の語句に対応させました。
