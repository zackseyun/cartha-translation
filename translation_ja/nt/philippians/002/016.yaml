id: PHP.2.16
reference: Philippians 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: ja
  text: いのちのことばをしっかりと保ってください[a]。そうすれば、メシアの日[b]に、私はあなたがたを誇ることができます。私は無駄に走ったのでも、無駄に労苦したのでもなかったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いのちのことばを掲げて」または「いのちのことばを差し出して」。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「キリストの日」。
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: いのちのことば
  rationale: λόγοςの「ことば」と「知らせ」の幅を残しつつ、簡潔な属格表現と、いのちを与えることば／いのちについてのことばという両面を保つ。
- source_word: ἐπέχοντες
  choice: しっかりと保ちなさい
  rationale: 直前の勧めの流れを受け、堅く保持する意味を本文に採った。差し出す・掲げるという可能性は脚注に残した。
- source_word: καύχημα ἐμοὶ
  choice: あなたがたは私の誇りとなります
  rationale: 日本語として自然に、ピリピの信徒たちがパウロにとって誇る根拠となる結果を表した。
- source_word: ἡμέραν Χριστοῦ
  choice: メシアの日
  rationale: Χριστόςの称号としての終末論的・王的な響きを保つ。伝統的な「キリストの日」は脚注に示した。
- source_word: οὐκ εἰς κενὸν
  choice: 無駄ではなかった
  rationale: 目的や実りを欠くことを表す慣用句として、明快な現代日本語にした。二度の反復は「ことも…ことも」によって保持した。
- source_word: ἔδραμον
  choice: 走った
  rationale: 使徒としての働きを競走にたとえる比喩をそのまま保った。
- source_word: ἐκοπίασα
  choice: 苦労した
  rationale: 疲労を伴う骨折りを自然な日本語で表し、「走った」と区別した。
theological_decisions:
- issue: 終末論的な句におけるΧριστοῦの訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは単なる固有名というより称号として働いているため、「メシア」とした。ただし日本語で定着した伝統訳も脚注に残した。
- issue: パウロの誇りの性質
  choice: あなたがたは私の誇りとなります
  alternative: 私が誇るためです
  rationale: καύχημαは誇りの根拠・対象を指し得る。ピリピの信徒たちがパウロの誇りとなるという関係を示しつつ、その誇りが自己功績だけを意味するとは限定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。ギリシア語分詞は直前から続く勧めとして命令形で表し、後半の目的・結果関係は「そうすれば」で明示した。二つの比喩的な労苦表現と「無駄」の並行を保った。
