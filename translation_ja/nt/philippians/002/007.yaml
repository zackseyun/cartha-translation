  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: ja
  text: しかし、かえってご自分を空にし[a]、奴隷の姿を取り、人間と同じあり方になられた[b]。そして、外見において人として認められ、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分を無にして」。直訳的には「ご自分を空にして」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「人間の類似のうちにある者となった」。ここで「同じあり方」は、真に人間であったことを否定する表現ではない。
    reason: source_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし、かえって
  rationale: 直前の内容との強い対照を示す。日本語では「しかし、かえって」とすることで、単なる逆接だけでなく方向の転換も自然に表せる。
- source_word: ἑαυτὸν ἐκένωσεν
  choice: ご自分を空しくし
  rationale: κενόωの「空にする」という比喩を保持する。「ご自分」は再帰性を明確にしつつ、キリストを指す文脈にふさわしい自然な敬語表現である。
- source_word: μορφὴν δούλου λαβών
  choice: 奴隷の姿を取り
  rationale: μορφήを「姿」として前節との対応を保ち、δοῦλοςは従属身分の強さが重要なため「奴隷」と訳す。分詞λαβώνは、自己を空しくするあり方を説明する「取り」とした。
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: 人間と同じ姿になられた
  rationale: γενόμενοςの「～になる」を直接表し、ὁμοίωμαは同一性を言い切らず類似を示す「同じ姿」とした。ἀνθρώπωνは性別を限定しない総称として「人間」と訳す。
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: 外見において人として認められ
  rationale: σχῆμαを外から認知される様態として「外見」と訳し、先のμορφή「姿」と区別する。εὑρεθείςは直訳的な「見いだされ」より、観察による認知を自然に表す「認められ」とした。文は次節へ続くため読点で結ぶ。
theological_decisions:
- issue: 「ご自分を空しくした」のキリスト論的意味
  choice: 比喩をそのまま保持し、後続する分詞句にその具体的なあり方を語らせる。
  alternative: 「ご自分を無にした」と訳す、または神的属性を放棄したと説明的に訳す。
  rationale: 本文は何を手放したかを明記せず、奴隷の姿を取って人間と同じ姿になったことによって「空しくした」ことを描く。特定のケノーシス論を訳文に持ち込まず、原文の緊張を保つ。
- issue: ὁμοίωμα（同じ姿）とキリストの人間性
  choice: 類似を示す原語の表現を保持するが、単なる見せかけとは訳さない。
  alternative: 「人間のように見えただけ」とする、または原文以上に「完全に人間となった」と明示する。
  rationale: 「同じ姿」という表現を残すことで原文に忠実でありつつ、真の人間性を否定する意味を訳文に加えない。後続の「人として認められ」と相まって、本文固有の表現上の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、賛歌的な文脈にふさわしい品位を保った。「奴隷」は歴史的・社会的な従属身分の強さを薄めない語として採用した。節末は文法的に次節へ続くため、完結させず読点で終えた。
