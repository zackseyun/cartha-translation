revisions:
- from: しかし私は、エパフロディトをあなたがたのもとに遣わす必要があると考えました。彼は、私の兄弟、同労者、戦友であり、また、あなたがたの使者[a]として私の必要に仕えてくれた人[b]です。
  to: しかし私は、私の兄弟、同労者、戦友であり、あなたがたの使者[a]、また私の必要に仕える者[b]であるエパフロディトを、あなたがたのもとに遣わす必要があると考えました。
  rationale: 「仕えてくれた人」を、時制を限定しない「私の必要に仕える者」に改めました。また、エパフロディトにかかる五つの呼称と「遣わす」という判断の関係が明瞭になるよう、一文に再構成しました。ἀπόστολονを「使者」とする本文と、「使徒」という語義の可能性を示す脚注は維持しています。
