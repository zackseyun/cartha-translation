id: PHP.2.25
reference: Philippians 2:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: ja
  text: しかし私は、私の兄弟、同労者、戦友であり、あなたがたの使者[a]、また私の必要に仕える者[b]であるエパフロディトを、あなたがたのもとに遣わす必要があると考えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「使徒」。ここでは、あなたがたから遣わされた者という意味。
    reason: alternative_reading
  - marker: b
    text: または「私の必要の奉仕者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: 必要がある
  rationale: ἡγησάμηνとともに、パウロが必要だと判断したことを自然な現代日本語で表す。
- source_word: ἡγησάμην
  choice: 考えました
  rationale: 単なる思いつきではなく判断・評価を表す文脈だが、「必要があると考えました」でその意味が明瞭になる。
- source_word: πέμψαι
  choice: 遣わす
  rationale: 本文自体には「送り返す」の「返す」に当たる要素がないため、文脈による補足を避けて単に「遣わす」とした。
- source_word: ἀδελφὸν
  choice: 兄弟
  rationale: 信仰を共にする者への家族的呼称を直接保つ。
- source_word: συνεργὸν
  choice: 同労者
  rationale: 共に働く者というパウロ書簡の用法を、簡潔で品位ある慣用的な聖書日本語で表す。
- source_word: συστρατιώτην
  choice: 戦友
  rationale: 共に戦う兵士という軍事的比喩を自然な日本語で保持する。
- source_word: ἀπόστολον
  choice: 使者
  rationale: ここではピリピの信徒たちから派遣された代表者を指すと考えられ、正式な使徒職を不用意に含意しない。
- source_word: λειτουργὸν τῆς χρείας μου
  choice: 私の必要に仕えてくれた人
  rationale: パウロの必要のために奉仕したという関係を明瞭にしつつ、現代の教会職名を連想させる「奉仕者」「教役者」に限定しない。
theological_decisions:
- issue: ἀπόστολονを正式な称号「使徒」と訳すか、広義の派遣された者「使者」と訳すか
  choice: 使者
  alternative: 使徒
  rationale: ὑμῶν（あなたがたの）が付き、ピリピの教会から遣わされた代表者という文脈上の意味が前面にあるため。ただし語そのものは「使徒」とも訳せるので脚注に残した。
- issue: λειτουργόνに祭儀的・職制的な意味を持たせるか
  choice: 仕えてくれた人
  alternative: 奉仕者
  rationale: 語の持つ公的で尊い奉仕の響きを完全には限定せず、ここではパウロの実際的な必要への奉仕という文脈を優先した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、兄弟・同労者・戦友という三つの並列呼称と軍事的比喩を保持した。長いギリシア語文は日本語で理解しやすい二文に分けたが、論理関係と各称号の帰属は変えていない。
