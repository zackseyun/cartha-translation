id: PHP.2.27
reference: Philippians 2:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: ja
  text: 実際、彼は病気になり、死に瀕するほどでした[a]。しかし、神は彼を憐れんでくださいました。彼だけでなく、私をも憐れんでくださったのです。それは、私が悲しみの上にさらに悲しみを抱えずに済むためでした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死にかけていました」「死に近い状態でした」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「悲しみの上に悲しみを持つ」。悲しみがさらに重なることを表す。
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: 病気になり
  rationale: 文脈はエパフロディトの身体的な病を指す。アオリストの出来事性を自然な現代日本語で表し、一般的な「弱さ」とは訳さない。
- source_word: παραπλήσιον θανάτῳ
  choice: 死に瀕するほどでした
  rationale: 死に非常に近い状態だったことを明確にしつつ、実際に死んだとは述べない原文の程度表現を保つ。
- source_word: ἠλέησεν
  choice: あわれんでくださいました
  rationale: 神が憐れみを示したという語の神学的な重みを保ち、敬語によって神に対する自然で品位ある日本語とする。
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: しかも、彼だけでなく私をもあわれんでくださった
  rationale: 直前の「あわれむ」を補って日本語で対象関係を明瞭にし、彼だけでなくパウロにも及んだという対比を保持する。
- source_word: ἵνα μὴ
  choice: それは、私が……ずに済むためでした
  rationale: 避けられた結果を含む目的の意味を、自然な現代日本語で表す。
- source_word: λύπην ἐπὶ λύπην
  choice: 悲しみに悲しみを重ねる
  rationale: 同じ名詞の反復と累積的な強調を残し、悲しみがさらに加わるという意味を明瞭にする。
- source_word: σχῶ
  choice: 重ねずに済む
  rationale: ἔχωの「持つ、経験する」という広い意味を、直前の累積表現と結びつく自然な日本語にした。
theological_decisions:
- issue: 神の「あわれみ」が具体的に何を指すか
  choice: 回復や癒やしと明示せず、「あわれんでくださいました」と訳す
  alternative: 「神は彼を癒やしてくださいました」
  rationale: 文脈上は病からの回復が念頭にあるが、原文は「癒やした」ではなく「憐れんだ」と述べるため、その神学的表現を解釈で置き換えない。
- issue: ἵνα節が表す関係
  choice: 「ためでした」として目的・意図の含みを保つ
  alternative: 「その結果、私は……ずに済みました」
  rationale: ἵνα μήの目的的な力を保持し、単なる結果に限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「あわれむ」や反復表現を残して原文の品位と修辞を保った。神を主語とする箇所では自然な敬語を用いた。
