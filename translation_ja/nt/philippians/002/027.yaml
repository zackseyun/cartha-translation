revisions:
- from: 実際、彼は病気になり、死に瀕するほどでした[a]。しかし、神は彼をあわれんでくださいました。しかも、彼だけでなく私をもあわれんでくださったのです。それは、私が悲しみに悲しみを重ねずに済むためでした[b]。
  to: 実際、彼は病気になり、死に瀕するほどでした[a]。しかし、神は彼を憐れんでくださいました。彼だけでなく、私をも憐れんでくださったのです。それは、私が悲しみの上にさらに悲しみを抱えずに済むためでした[b]。
