reference: Philippians 2:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: ja
  text: しかし、たとえ私が、あなたがたの信仰[c]に伴ういけにえと奉仕[b]の上に、注ぎの供え物として注ぎ出されている[a]としても、私は喜び、あなたがた皆と共に喜びます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「注ぎ出されている」。犠牲に液体を注ぐ「注ぎの供え物」のイメージです。
    reason: lexical_alternative
  - marker: b
    text: 「奉仕」は「務め」とも訳せます。原文の語は、この文脈では礼拝・祭儀に仕える響きを帯びています。
    reason: lexical_alternative
  - marker: c
    text: 「信仰」は「忠実さ」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: 注ぎの供え物として注ぎ出されている
  rationale: 受動形と現在時制を保ちつつ、犠牲祭儀で液体を注ぐ比喩を現代日本語で明示した。
- source_word: ἐπὶ
  choice: の上に
  rationale: 与格を伴うἐπίの空間的・付加的な像を保持し、パウロの献げ物が彼らのいけにえに加えられるという比喩を過度に説明しない。
- source_word: θυσίᾳ
  choice: いけにえ
  rationale: 祭儀的な意味を自然な聖書日本語で保ち、単なる一般的な「奉仕」へ平板化しない。
- source_word: λειτουργίᾳ
  choice: それを献げる務め
  rationale: 一般的な奉仕の意味と礼拝・祭儀の含みをともに伝える。θυσίᾳとの結びつきを「それを献げる」で自然に示した。
- source_word: πίστεως
  choice: 信仰
  rationale: 属格の意味関係を断定せず、πίστιςの基本的な意味を採用した。「忠実さ」の可能性は脚注に残した。
- source_word: χαίρω
  choice: 私は喜び
  rationale: ピリピ書に反復される喜びの語彙と現在の宣言を明瞭に保った。
- source_word: συγχαίρω
  choice: あなたがた一同と共に喜びます
  rationale: σύνの共同性を直接表し、ここでは「祝福する」より文脈に適う相互の喜びとして訳した。
- source_word: πᾶσιν ὑμῖν
  choice: あなたがた一同と
  rationale: 共同体全員を明示する強調を自然な日本語で保持した。
theological_decisions:
- issue: パウロの死の可能性を表す祭儀的比喩
  choice: パウロ自身が、フィリピの信徒たちの信仰といういけにえと、それを献げる務めの上に注がれる供え物として描かれる。
  alternative: パウロの働きが彼らの奉仕に単に伴うものとして描かれる。
  rationale: σπένδομαι、θυσία、λειτουργίαが連なっているため、犠牲と礼拝のイメージを保持した。ただし、この一節だけで実際の死が確定しているとは訳文で断定しない。
- issue: τῆς πίστεως ὑμῶνの属格関係
  choice: 「あなたがたの信仰といういけにえ」と理解できる形にした。
  alternative: 「あなたがたの信仰から生じるいけにえと奉仕」または「あなたがたの忠実さに関するいけにえと奉仕」。
  rationale: 属格の圧縮された表現には複数の関係がありうるため、「という」で同格的理解を示しつつ、脚注で語義上の別案を提示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「いけにえ」「注ぎの供え物」によって原文の祭儀的語彙を保持した。「祭司の務め」とは限定せず、λειτουργίαの礼拝的含意と一般的な奉仕性の双方を残した。脚注記号は該当語の直後に配置した。
