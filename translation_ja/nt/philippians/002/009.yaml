  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: ja
  text: それゆえ、神もまた彼をこの上なく高く高め、あらゆる名にまさる名[b]を恵み深くお与えになった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵み深くお与えになった」は、「授けた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「名」は、呼び名だけでなく、身分、地位、称号をも表し得る。この節だけでは、どの名を指すかはまだ明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: それゆえ、神もまた
  rationale: διόの推論的な意味を「それゆえ」で、καίの付加的な意味を「もまた」で保ち、自然な日本語の語順にした。
- source_word: ὑπερύψωσεν
  choice: この上なく高く上げ
  rationale: 複合動詞の強意を明確に示しつつ、「最高の地位に就けた」などと意味を限定しすぎない表現とした。
- source_word: ἐχαρίσατο
  choice: 恵みとしてお与えになった
  rationale: 単なる授与だけでなく、語に含まれる恵み深く惜しみなく与える含意を表した。神を主語とする自然で丁重な現代日本語として尊敬表現を用いた。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 原文どおり「名」を本文に残し、「称号」や「地位」と断定しないことで意味の広がりを保った。
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: あらゆる名にまさる名
  rationale: ὑπέρの比較的な意味とπᾶνの包括性を、明瞭で自然な日本語で表した。
theological_decisions:
- issue: 「名」が何を指すか
  choice: 本文では特定せず、「名」のまま保持した。
  alternative: 「イエス」という名、または続く節で明らかになる神的称号「主」を指すと明示する。
  rationale: この節自体はその名を明示していないため、後続節に基づく解釈を本文へ先取りせず、原文の開かれた表現を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、礼拝朗読にも耐える端正な文体とした。「彼」は原文の代名詞に対応させ、「この方」などの指示・敬称的な要素は加えていない。
