  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: ja
  text: 彼らの行き着く先は滅びであり、彼らの神は腹[a]であり、彼らの栄光は自分たちの恥にあります。彼らは地上のことに心を向けています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「腹」は、食欲や肉体的な欲望を指す比喩とも考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: 行き着く先
  rationale: 単なる時間的な「終わり」に限定せず、最終的な結末という文脈上の意味を、自然な現代日本語で表す。
- source_word: ἀπώλεια
  choice: 滅び
  rationale: 破滅と終末的な厳しさを簡潔に保ち、聖書語としても現代の読者に理解できる。
- source_word: κοιλία
  choice: 腹
  rationale: 欲望や食欲を指しうる具体的な身体比喩を、抽象化せずに保持する。
- source_word: δόξα
  choice: 栄光
  rationale: 恥との逆説的な対照を保つため、直接的な対応語を用いる。
- source_word: αἰσχύνη
  choice: 恥
  rationale: 不名誉と道徳的な恥辱の両面を簡潔に表す。
- source_word: τὰ ἐπίγεια
  choice: 地上のこと
  rationale: 中性複数の広がりを保ちつつ、自然な日本語にする。
- source_word: φρονοῦντες
  choice: 心を向けています
  rationale: 一時的に考えることではなく、継続的な関心・思考の方向性を表す。
- source_word: ὧν ... ὧν
  choice: 彼らの……彼らの
  rationale: 前節の人々を受ける反復を、日本語として明確で自然な所有表現にする。
theological_decisions:
- issue: 「彼らの神は腹」の比喩的意味
  choice: 本文では具体的な比喩「腹」を保持する。
  alternative: 「彼らの神は欲望である」または「彼らの神は食欲である」
  rationale: 原文は、肉体的欲求への隷属を鮮烈な身体比喩で表している。単一の抽象的意味に限定せず、パウロの修辞的な緊張を残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「滅び」「神」「栄光」「恥」という原文の厳粛で逆説的な語調を保持した。末尾の分詞句は、継続的な心の方向を自然に伝える独立文とした。
