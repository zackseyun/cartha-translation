source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: ja
  text: この方は、万物をもご自分に従わせることのできる、その働く力[c]によって、私たちの卑しい体[a]を造り変え、ご自分の栄光の体[b]と同じ姿にしてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちの卑しさの体」。ここでの「卑しい」は、道徳的な卑劣さではなく、現在の低くされた状態を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「ご自分の栄光の体」。栄光によって特徴づけられた体、という意味。
    reason: lexical_alternative
  - marker: c
    text: 別訳「彼が万物をもご自分に従わせることができる、その力の働きに応じて」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: 造り変え
  rationale: 外形や状態を実質的に変える未来の行為を表す。現代日本語として自然であり、単なる軽微な「変化」より強い意味を保つ。
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: 私たちの卑しい体
  rationale: 直訳的には「私たちの卑しさの体」だが、日本語では不自然なため、現在の低くされた状態を表す「卑しい体」とした。道徳的に卑劣という意味ではないことを脚注で明確にする。
- source_word: σύμμορφον
  choice: 同じ姿にして
  rationale: 与格の「ご自分の栄光の体」と形を同じくする結果を自然な日本語で示し、強い対応関係を保つ。
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: ご自分の栄光の体
  rationale: 属格表現をあえて残し、キリストの体が栄光によって特徴づけられていることを表す。「栄光に輝く体」も可能だが、原文の神学的な響きを狭めない。
- source_word: κατὰ τὴν ἐνέργειαν
  choice: その働く力によって
  rationale: ἐνέργεια が表す、現実に作用する有効な力を「働く力」として表現した。κατά の基準・対応の含みもあり得るが、文脈上は手段として自然に理解できる。
- source_word: τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι αὑτῷ τὰ πάντα
  choice: 万物をもご自分に従わせることのできる
  rationale: キリストの能力と、その対象が万物に及ぶことを保つ。καί はここでは強意的に「も」とした。再帰代名詞は「ご自分に」と訳した。
theological_decisions:
- issue: 現在の身体的な低さと将来の栄光との関係
  choice: 信じる者の現在の卑しい体が、キリストの栄光の体と同じ姿へ将来造り変えられると訳す。
  alternative: 「復活させる」など、復活の仕組みを明示する訳。
  rationale: 原文は身体の将来的変容とキリストの体への同形化を明言するが、この箇所自体ではその仕組みを詳述しないため、復活という解釈語を本文に補わない。
- issue: キリストが万物をご自分に従わせる力
  choice: 同じ有効な働きが身体の変容と万物の服従の双方に関わることを保つ。
  alternative: 力を一般的な全能性として言い換える。
  rationale: 原文の ἐνέργεια と δύνασθαι の結びつきを保持し、特定の体系的説明を付加しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。主語の「この方」は前節から続く関係代名詞 ὃς を受ける。「してくださいます」はキリストの将来の恵み深い行為を自然に示す敬語表現。脚注記号は対応箇所の情報をまとめて文末に配置した。
