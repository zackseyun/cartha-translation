  to: 私は、すでにそれを得た[a]とか、すでに完全にされた[b]とかいうのではありません。むしろ私は、キリスト[c]が私を捕らえたその目的を、自分も何とか捕らえようとして[d]、追い求めています。
  rationale: 受動的な完了状態をより自然かつ直接に表すため「完全な者にされた」を「完全にされた」に改めた。否定節を簡潔に整え、また「私を」を補って、キリストがパウロを捕らえたという原文の一人称受動を明瞭にした。目的を示す本文上の理解、καταλαμβάνωの反復、統語上の代替的理解は保持している。
