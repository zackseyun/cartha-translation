source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: ja
  text: 私は、すでにそれを得た[a]とか、すでに完全にされた[b]とかいうのではありません。むしろ私は、キリスト[c]が私を捕らえたその目的を、自分も何とか捕らえようとして[d]、追い求めています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手に入れた」「到達した」とも訳せる。ギリシア語では目的語が明示されておらず、ここでは文脈に基づいて「それを」を補った。
    reason: lexical_alternative
  - marker: b
    text: 「すでに完全になった」または「すでに完成された」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語クリストス。「メシア」とも訳せる。
    reason: lexical_alternative
  - marker: d
    text: 直訳的には「もしそれをも捕らえることができるなら」。ここは、キリストが私を捕らえた目的・目標を指すと理解した。理由を示し、「キリストに捕らえられたからこそ」と理解することも可能である。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ἔλαβον
  choice: それを得た
  rationale: 目的語はギリシア語本文では明示されていないが、前後の文脈が示す目標を受けて、日本語として明瞭になるよう「それを」を補った。「得た」は、受ける・獲得する・到達するという語義の幅を過度に限定しない。
- source_word: τετελείωμαι
  choice: 完全な者にされた
  rationale: 完了受動形が表す、完成された状態にあるという意味を受動表現で保った。後代の教理的な意味を本文に持ち込まず、パウロがその状態にすでに達したことを否定している点を示す。
- source_word: διώκω
  choice: ひたすら追い求めています
  rationale: 継続的で強い追求を表す現在形の力を、自然な現代日本語で表した。
- source_word: καταλάβω / κατελήμφθην
  choice: 捕らえようと／捕らえられた
  rationale: 同じ語根の能動形と受動形による語の響き合いを、日本語でも同じ動詞によって保った。前者は目標を自分のものとする意味、後者はキリストがパウロを確保した意味を帯びる。
- source_word: ἐφ’ ᾧ
  choice: その目的を
  rationale: 主文では、キリストがパウロを捕らえた目的・目標を指す表現として訳した。ただし、この句には理由を示す解釈もあり得るため、脚注で明示した。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: パウロ書簡で固有名のようにも用いられる慣用を踏まえた自然な訳。「メシア」という称号の意味は脚注に示した。
theological_decisions:
- issue: τετελείωμαιが罪のない完全さを意味するか
  choice: 完全な者にされた
  alternative: 完成された／完全になった
  rationale: 本文はパウロが完成状態にすでに達したことを否定するが、その「完全」の範囲を後代の神学体系によって限定してはいない。受動・結果状態を保ちつつ、教理的な決着を訳文で加えない。
- issue: ἐφ’ ᾧが目的を示すか理由を示すか
  choice: キリストに捕らえられたその目的を
  alternative: キリストに捕らえられたからこそ
  rationale: 目的・目標の読みを本文に採ったが、ギリシア語の統語上、理由を示す読みも可能であるため脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの強い追求を表す品位ある語調にした。「捕らえる／捕らえられた」の反復によって原文の語の響き合いを保ち、神学的・統語的な曖昧さは脚注で示した。
