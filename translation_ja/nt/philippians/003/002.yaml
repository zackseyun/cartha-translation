  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: ja
  text: 犬どもに気をつけなさい。[a] 悪を働く者たちに気をつけなさい。[b] 切り刻みに気をつけなさい。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「気をつけなさい」に当たる同じギリシア語の命令が、この節で三度繰り返され、警告が強調されている。別訳「警戒しなさい」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「悪い働き人たち」。
    reason: literal_rendering
  - marker: c
    text: 直訳では「切断」または「切り刻み」。次の節の「割礼」と響きの似た語を使った、侮蔑的な言葉遊びである。
    reason: wordplay
lexical_decisions:
- source_word: Βλέπετε
  choice: 気をつけなさい
  rationale: ここでは目的語を伴う現在命令形で、危険な者たちを警戒するよう促す表現。同じ命令を三度繰り返し、切迫した警告の調子を保った。
- source_word: τοὺς κύνας
  choice: 犬ども
  rationale: 比喩を説明に置き換えず、パウロの厳しい批判を保持した。「ども」により、定冠詞を伴う複数形が指す集団への侮蔑的な響きを自然な日本語で表した。
- source_word: τοὺς κακοὺς ἐργάτας
  choice: 悪事を働く者たち
  rationale: κακούς の道徳的な否定性と、ἐργάτας の「働く者」という意味を、現代日本語として明瞭に表した。「悪い働き人」より自然であり、彼らの働きが悪いという非難も保つ。
- source_word: τὴν κατατομήν
  choice: 肉体を切り刻む者たち
  rationale: κατατομήは字義的には「切断・切り刻むこと」という抽象名詞だが、ここでは警戒すべき一団を侮蔑的に指す。日本語では対象となる人々が明確になるよう「者たち」とし、次節の「割礼」との鋭い対照を保つため「切り刻む」と訳した。「肉体」は文脈上の行為を明瞭にする最小限の補足。
theological_decisions:
- issue: κατατομήを周囲の「割礼」との関係でどう訳すか
  choice: 「肉体を切り刻む者たち」とし、通常の「割礼」とは異なる侮蔑的な対抗語として訳す
  alternative: 「切断」「偽りの割礼」「切り刻み」
  rationale: パウロは通常の「割礼」περιτομήではなく、意図的に響きの似た κατατομή を用いている。単に「割礼」として緊張を弱めず、同時に「偽りの」という本文にない神学的説明も加えない。抽象名詞を人々への集合的呼称として理解する点は文脈と三つの対句に基づくが、その字義は脚注で示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、三度の「気をつけなさい」を省略せず、原文の反復と警告のリズムを保持した。「犬ども」と「切り刻む」は強い表現だが、原文の意図的な論争的調子を弱めないために残した。
