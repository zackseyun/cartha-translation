source:
  edition: SBLGNT
  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: ja
  text: とはいえ、私自身は、肉においても頼みとするものがあります。[a] ほかの誰かが肉において頼みとするものがあると思うなら、私にはなおさら頼みとするものがあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉において」は、ここでは「人間的な資格を頼みとして」または「外面的な地位を頼みとして」という意味。
    reason: σάρξの直訳を本文に保ちつつ、この文脈での意味を明確にするため。
lexical_decisions:
- source_word: καίπερ
  choice: とはいえ
  rationale: 譲歩を表す語であり、前後の論旨を受けつつ、パウロ自身にも該当する資格があることを自然な現代日本語で示す。
- source_word: ἔχων πεποίθησιν
  choice: 頼みとするものがあります
  rationale: 直訳的な「確信を持つ」よりも、ここでの「信頼の根拠・誇る根拠」を自然に表し、続く5–6節の資格列挙にもつながる。
- source_word: ἐν σαρκί
  choice: 肉において
  rationale: σάρξという原語の表現と神学的緊張を本文に残す。ここでは主として人間的・外面的な資格を指すが、それを本文で一義的に言い換えず脚注で補う。
- source_word: δοκεῖ
  choice: 思う
  rationale: 自分にはそのような根拠があると考える、という通常の意味を簡潔に表す。
- source_word: ἄλλος
  choice: ほかの誰か
  rationale: τιςと合わせた比較の構文を自然な日本語にする。
- source_word: μᾶλλον
  choice: なおさらです
  rationale: 他者以上に自分にはその根拠がある、という強い比較を簡潔かつ自然に示す。
theological_decisions:
- issue: ピリピ3:4におけるσάρξの意味
  choice: 本文では「肉において」とし、人間的・外面的な資格という文脈上の意味を脚注で示す。
  alternative: 「人間的な資格を頼みとして」「外面的な身分を頼みとして」
  rationale: 直後の3:5–6は割礼、血統、律法上の立場、熱心さを列挙しているため、「罪深い性質」ではなく、人間的な身分や実績を信頼の根拠とすることが中心である。ただしσάρξの原語表現を本文から消さず、意味を狭く確定しすぎない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの簡潔で対決的な比較の調子を保った。「肉」は聖書的・神学的な語として本文に残し、誤って「罪深い性質」と限定されないよう脚注を付した。
