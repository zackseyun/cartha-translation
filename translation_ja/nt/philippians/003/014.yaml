id: PHP.3.14
reference: Philippians 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: ja
  text: 私は、目標に向かって、メシアであるイエスにあって神の上への召しに伴う賞を、ひたすら追い求めています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: 目標に向かって
  rationale: 競走の比喩に即して、定められた目標へ進む方向性を自然な日本語で表した。
- source_word: διώκω
  choice: ひたすら進み
  rationale: この文脈での、力を尽くして前進し続ける意味を表す。「追い求める」より競走のイメージが明瞭である。
- source_word: εἰς τὸ βραβεῖον
  choice: 賞を目指しています
  rationale: εἰςが示す努力の目当てを自然に表し、勝利の賞という競技的な比喩を保った。
- source_word: ἄνω
  choice: 上への
  rationale: 空間的な方向性を保ち、「天からの」「天にある」と解釈を一つに限定しない表現とした。
- source_word: κλήσεως τοῦ θεοῦ
  choice: 神が与える……召し
  rationale: 属格を、召しの源である神を示すものとして自然な日本語にした。「与える」は日本語上の補足であり、召しが神から来ることを表す。
- source_word: Χριστῷ
  choice: メシアである
  rationale: Χριστόςが称号であることを明示しつつ、「メシア・イエス」という不自然になりやすい連結を避けた。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにあって
  rationale: パウロの「～にあって」という結びつきの表現を保ち、称号としてのΧριστόςも明確にした。
theological_decisions:
- issue: ἄνω κλήσεωςの意味
  choice: 上への召し
  alternative: 天からの召し／天にある召し
  rationale: 競走における前進のイメージと、神から来て天へ向かわせる召しの両方を残し、どちらか一方に限定しないため。
- issue: τοῦ θεοῦとκλήσεωςの関係
  choice: 神が与える召し
  alternative: 神の召し
  rationale: 神が召しの源であるという自然な理解を明瞭にした。ただし、簡潔な「神の召し」も原文の属格により形式的に近い。
translation_notes:
  register: 現代の一般読者に理解しやすい、明瞭で品位ある文体。「ひたすら進み」と「目標」「賞」によって競走の比喩を保ち、「上への召し」は脚注で別解を示して原文の曖昧さを保持した。
