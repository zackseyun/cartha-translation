id: PHP.3.15
reference: Philippians 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: ja
  text: ですから、私たちのうち成熟した者[a]は皆、このように考えましょう[b]。もし何かの点で違う考え方をしているなら、そのことも神があなたがたに明らかにしてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「完全な者」とも訳せる。ギリシア語は、完成・完全のほか、十分に成長した成熟を表すことがある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「この思いを抱きましょう」。ここでの「考える」は、単なる意見だけでなく、心の向きや姿勢も含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ですから
  rationale: 直前までの議論を受けた推論・勧告への移行を、現代日本語で自然に示す。
- source_word: ὅσοι
  choice: 私たちのうち…者は皆
  rationale: 後続の一人称複数の勧告 φρονῶμεν と合わせ、対象となる集団の包括性を明確にする。
- source_word: τέλειοι
  choice: 成熟した者
  rationale: 直前でパウロ自身がなお目標を追い求めていると述べているため、ここでは絶対的な完全より、十分に成長した状態を表すと考えられる。ただし「完全な者」という語義も脚注に残す。
- source_word: τοῦτο
  choice: このような
  rationale: 直前に述べられた姿勢・考え方を指す指示語として自然に表現する。
- source_word: φρονῶμεν
  choice: 考え方をしましょう
  rationale: 現在接続法の勧告的用法を「しましょう」で表し、φρονέω が含む思考と姿勢の両面を「考え方」で伝える。
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: もし何かの点で違う考え方をしているなら
  rationale: 条件、範囲の不特定性、考え方の相違を過不足なく自然な日本語で表す。
- source_word: καὶ τοῦτο
  choice: そのことも
  rationale: 相違している点についても神が明らかにする、という追加の意味を保持する。
- source_word: ἀποκαλύψει
  choice: 明らかにしてくださいます
  rationale: 神による啓示・開示を示す語義を保ちつつ、日本語として自然な敬意を表す。
theological_decisions:
- issue: τέλειοι が表す完全さと成熟の関係
  choice: 本文では「成熟した者」
  alternative: 「完全な者」
  rationale: 3章12節でパウロは自分がすでに完成したのではないと述べているため、ここで罪のない絶対的完全を断定するのは文脈に合いにくい。一方、語そのものが持つ「完全な」という含みは脚注に残し、パウロの意図的な緊張を消さない。
- issue: 神が明らかにする内容
  choice: 異なる考えを持つ「そのこと」
  alternative: 直前に示された「この考え方」も神が明らかにする
  rationale: καὶ τοῦτο の指示対象には幅があり得るため、本文では日本語でも指示語のままにし、内容を教理的に限定しすぎない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、勧告と神への敬意にふさわしい品位を保った。「成熟」と「完全」の語義上の緊張、および後半の指示語の曖昧さは脚注または本文の表現によって保持した。
