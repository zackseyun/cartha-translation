id: PHP.3.1
reference: Philippians 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: ja
  text: 最後に[a]、私の兄弟たち[b]、主にあって喜びなさい。同じことをあなたがたに書くのは、私には煩わしいことではなく[c]、あなたがたにとって安全です[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「さて」「そのほかのこととして」。
    reason: lexical_alternative
  - marker: b
    text: ここで「兄弟たち」は会衆全体、すなわち兄弟姉妹を指す。
    reason: cultural_note
  - marker: c
    text: または「私には面倒ではなく」「私には億劫ではなく」。
    reason: lexical_alternative
  - marker: d
    text: または「あなたがたの守りとなることです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: 最後に
  rationale: 談話を転換する定型的な表現として自然な日本語にした。手紙がなお続くため、「さて」「そのほか」と取る余地も脚注に残した。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: ギリシア語の男性複数形を保持した。一方、会衆全体への呼びかけであることを脚注で明示した。
- source_word: χαίρετε
  choice: 喜びなさい
  rationale: 複数への命令形の勧告的な力を保ち、パウロ書簡での用法にも合う表現とした。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 喜びが主との結びつきの中にあるという神学的枠組みを、解釈で狭めずに保持した。
- source_word: τὰ αὐτά
  choice: 同じこと
  rationale: 何を指すかを特定せず、既述の勧告または教えを指し得る原文の曖昧さを保った。
- source_word: οὐκ ὀκνηρόν
  choice: 煩わしいことではなく
  rationale: 繰り返し書くことがパウロにとって負担でも億劫でもないという意味を、自然で品位ある現代日本語で表した。
- source_word: ἀσφαλές
  choice: 安全なことです
  rationale: 形容詞の「安全である、確かな」という直接的な意味を保ち、「守りとなる」という解釈的な表現は脚注に置いた。
theological_decisions:
- issue: 会衆への性別を伴う呼びかけ
  choice: 私の兄弟たち
  alternative: 私の兄弟姉妹たち
  rationale: 文法上の男性複数形を本文で保持しつつ、実際には教会の全会衆を指す包括的な用法であることを脚注で示した。
- issue: 繰り返し書くことの保護的意味
  choice: あなたがたにとっては安全なことです
  alternative: あなたがたの守りとなります
  rationale: 原文の形容詞の直接的意味を本文に残し、何からどのように守るかを本文で補わないことで、解釈を過度に限定しないようにした。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「主にあって」は新約聖書の関係的・神学的含意を保つために用いた。「安全なこと」はやや直訳調だが、原文の曖昧さを保持し、脚注で自然な解釈的代案を示した。
