id: PHP.3.10
reference: Philippians 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: ja
  text: キリスト、その復活の力、またその苦しみにあずかること[a]を知り、その死と同じ姿になりながら[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その苦しみとの交わり」。または「その苦しみに参与すること」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その死と同じ姿にされながら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: 知り／知る
  rationale: 単なる知識ではなく、キリストを人格的・経験的に知るという含みを保つ。目的を表す不定詞だが、前後に続く文の一部であるため、日本語でも連用形でつないだ。
- source_word: δύναμιν
  choice: 力
  rationale: 復活において現れ、働く有効な力を、簡潔で自然な日本語で表す。
- source_word: ἀναστάσεως
  choice: 復活
  rationale: この文脈で指される出来事を正確に示す、確立した訳語である。
- source_word: κοινωνίαν
  choice: あずかること
  rationale: 抽象的な親交だけでなく、キリストの苦しみに実際に参与する意味を、現代の読者に明瞭に伝える。名詞構文の意味は保ちつつ、自然な日本語にした。
- source_word: παθημάτων
  choice: 苦しみ
  rationale: キリストが受けた苦難を直接的かつ広く表し、特定の種類の患難に限定しない。
- source_word: συμμορφιζόμενος
  choice: 同じ姿にされながら
  rationale: 現在分詞の継続的な過程と、受動的に形づくられる含みを保つ。「同化」のような専門的表現を避けた。
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: その死と
  rationale: συμμορφιζόμενοςが求める基準・対応対象を自然な日本語で示し、キリストの死そのものへの一致に焦点を置く。
theological_decisions:
- issue: κοινωνίαν παθημάτων αὐτοῦ の意味
  choice: キリストの苦しみに実際にあずかること
  alternative: キリストの苦しみとの交わり
  rationale: κοινωνίαはここで単なる共感や抽象的な親交よりも参与を含む。ただし「交わり」という名詞的な理解も可能なので脚注に残した。
- issue: συμμορφιζόμενος の態と過程
  choice: その死と同じ姿にされながら
  alternative: その死と同じ姿になりながら
  rationale: 中動・受動の形態上の幅を踏まえ、本文では神によって形づくられる含みを表せる受動表現を採用したが、主体の変化に焦点を置く訳も脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続き、後節へつながる文法構造を保つため、冒頭を連用形、末尾を読点とした。αὐτόνは日本語で不自然になりやすい三人称代名詞を避け、直前の文脈上の指示対象を明示して「キリスト」とした。
