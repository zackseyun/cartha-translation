    rationale: ギリシア語では単一の不定詞 γνῶναι が αὐτόν、τὴν δύναμιν、κοινωνίαν を並列して支配する。現行の二回の「知り」は、この一体性を弱める。
  - severity: low
    issue: συμμορφιζόμενος の態の限定
    rationale: 「同じ姿にされながら」は可能な理解ではあるが、中動・受動形の曖昧さに対して受動的行為者を本文で強く示す。「同じ姿になりながら」を本文とし、受動的訳を脚注に置くのがより中立的である。
