id: PHP.3.20
reference: Philippians 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: ja
  text: というのも、私たちの国籍は天にあります。私たちはそこから、救い主、主イエス・キリストを切に待ち望んでいます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολίτευμα
  choice: 国籍
  rationale: 市民としての帰属を表す語であり、地上のことを思う者との対比の中で、信徒の天への帰属を明確かつ自然な現代日本語で示す。共同体・国家という意味の可能性もあるが、ここでは「国籍」が文脈に最も適する。
- source_word: ἐν οὐρανοῖς
  choice: 天に
  rationale: 原文は複数形だが、日本語では天的領域を自然に「天」と表す。
- source_word: ὑπάρχει
  choice: あります
  rationale: 現在の実在を肯定する動詞を、自然で格調を保つ日本語にした。
- source_word: ἐξ οὗ
  choice: そこから
  rationale: 先行する「天」を受け、救い主が来られる起点を空間的に明示する。
- source_word: σωτῆρα
  choice: 救い主
  rationale: 救済をもたらす方という意味とキリスト論的な重みを保つ標準的な訳語。
- source_word: ἀπεκδεχόμεθα
  choice: 切に待ち望んでいます
  rationale: 期待を込めて継続的に待つという強意を、明瞭で自然な日本語に表した。
- source_word: κύριον
  choice: 主
  rationale: 新約聖書のキリスト論的用法に適した標準訳。
- source_word: Χριστόν
  choice: キリスト
  rationale: κύριον Ἰησοῦν Χριστόνという定着した称号連鎖を、日本語で自然かつ意味深く伝える。日本語の「キリスト」は称号として広く理解され、「メシア」よりもこの固有の連語に適する。
theological_decisions:
- issue: κύριον Ἰησοῦν ΧριστόνにおけるΧριστόνの訳し方
  choice: 主イエス・キリスト
  alternative: 主イエス、メシア
  rationale: Χριστόςは「油注がれた者／メシア」という称号だが、日本語では「主イエス・キリスト」が定着した称号表現であり、単なる姓としてではなく称号としても自然に理解される。原文にない説明的な冠詞や同格の区切りを加えない。
- issue: 救い主と主イエス・キリストの関係
  choice: 同格として「救い主、主イエス・キリスト」
  alternative: 「救い主である主イエス・キリスト」
  rationale: 原文のσωτῆραとκύριον Ἰησοῦν Χριστόνの同格関係を保ち、「である」を補って解釈を過度に明示しない。
translation_notes:
  register: 明瞭な現代標準日本語。文頭のγάρは直前との対比・根拠づけを受けて「しかし」とした。神学用語は一般読者にも通じる定着語を用い、全体を二文に分けて読みやすくした。
