id: PHP.3.9
reference: Philippians 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: ja
  text: そして、彼のうちに見いだされたいのです。律法に由来する自分自身の義[b]ではなく、メシアへの信仰[a]による義、すなわち、信仰に基づく神からの義を持つ者として。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアの忠実さによる義」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: ここ、および後の「義」は、「正義」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ ἐν αὐτῷ
  choice: 彼のうちにいる者と認められたい
  rationale: 「彼のうちに」というパウロ特有の結びつきの表現を保ちつつ、受動形 εὑρεθῶ を現代日本語で自然な「認められる」とした。文脈上の願望・目的の含みを「たい」で表した。
- source_word: μὴ ἔχων ἐμὴν δικαιοσύνην
  choice: 私が持つのは、…自分自身の義ではなく
  rationale: 分詞 μὴ ἔχων が示す状態を、日本語で明瞭な対比構文に組み替えた。
- source_word: τὴν ἐκ νόμου
  choice: 律法から来る
  rationale: ἐκ が示す源・由来を簡潔に表し、「律法」をモーセ律法に限定する説明は本文に加えなかった。
- source_word: διὰ πίστεως Χριστοῦ
  choice: メシアへの信仰を通して得られる
  rationale: διὰ の媒介を「通して」で保ち、πίστεως Χριστοῦ は主本文で目的格的属格として訳した。ただし属格の解釈には真正な曖昧さがあるため、別解を脚注に示した。Χριστός は称号性を保って「メシア」とした。
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: 神からの義
  rationale: 義の源が神であることを、原文の簡潔な表現に沿って示した。
- source_word: ἐπὶ τῇ πίστει
  choice: 信仰に基づく
  rationale: ἐπί＋与格が表す基盤・根拠の意味を、明瞭な現代日本語で表した。
theological_decisions:
- issue: πίστεως Χριστοῦ の属格の解釈
  choice: メシアへの信仰
  alternative: メシアの忠実さ
  rationale: 目的格的属格と主格的属格の両方が文法上・解釈上論じられているため、主本文では一般読者に明瞭な前者を採り、後者を脚注で保存した。
- issue: δικαιοσύνη の意味領域
  choice: 義
  alternative: 正義
  rationale: このパウロ書簡の文脈では「義」が自然で伝統的な訳語だが、「正義」という意味領域も原語にあるため脚注で示した。
- issue: ἐν αὐτῷ の神学的広がり
  choice: 彼のうちに
  alternative: 彼と結ばれて
  rationale: キリストとの結合を含みうる表現だが、説明的な訳で意味を限定せず、原文の空間的比喩と神学的広がりを保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の長い一文は、単独節としての理解しやすさのため二文に分けた。パウロの「彼のうちに」という表現と、信仰・義をめぐる神学的緊張は説明で解消せず保持した。
