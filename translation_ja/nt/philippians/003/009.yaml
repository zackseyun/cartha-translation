  to: そして、彼のうちに見いだされたいのです。律法に由来する自分自身の義[b]ではなく、メシアへの信仰[a]による義、すなわち、信仰に基づく神からの義を持つ者として。
  rationale: 受動形 εὑρεθῶ と「彼のうちに」という原文の比喩を直接保ち、原文にない「得られる」を除きました。「律法に由来する」「メシアへの信仰による」は、それぞれ ἐκ と διά の関係を自然な現代日本語で示します。末尾を「持つ者として」とするのは、前文の「見いだされたい」に続く μὴ ἔχων の分詞的な状態を日本語で保つためです。脚注アンカーは、論争的な πίστεως Χριστοῦ に直接 a を置き、最初の δικαιοσύνη に b を置いています。
