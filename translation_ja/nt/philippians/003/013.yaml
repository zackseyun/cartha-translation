id: PHP.3.13
reference: Philippians 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: ja
  text: 兄弟たち[a]、私は自分がすでにそれをつかんだとは考えていません。ただ一つ、後ろにあるものを忘れ、前にあるものへと身を伸ばしながら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ギリシア語の男性複数呼格 adelphoi の訳。パウロはこの語を、女性を含む信仰共同体全体への呼びかけとしてしばしば用いている。
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数呼格の形を反映する自然な聖書的呼びかけ。混成共同体を含み得る用法は脚注で明示した。
- source_word: λογίζομαι
  choice: 考えていません
  rationale: 自分について判断・評価する意味を、現代日本語で自然に表した。
- source_word: κατειληφέναι
  choice: すでに捕らえた
  rationale: 直前の12節にもある「つかむ／捕らえる」という比喩を保った。目的語はギリシア語同様に明示せず、文脈に委ねた。
- source_word: ἓν δέ
  choice: ただ一つ
  rationale: 動詞のない簡潔で切迫した原文の省略表現を保ち、「することは」などを補わなかった。
- source_word: τὰ μὲν ὀπίσω
  choice: 後ろのもの
  rationale: 複数・中性の実体化表現を日本語で簡潔に示し、前方との空間的対照を保った。
- source_word: ἐπιλανθανόμενος
  choice: 忘れ
  rationale: 基本的な語義を採用し、「捨て去る」などの解釈的な強意を避けた。
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: 前のものへと
  rationale: 「後ろのもの」と対になる前方の対象を自然な日本語で表した。
- source_word: ἐπεκτεινόμενος
  choice: 身を伸ばしながら
  rationale: 前方へ全身を伸ばす能動的な運動の比喩と、現在分詞の継続的な様態を保った。
theological_decisions:
- issue: κατειληφέναι の省略された目的語
  choice: 目的語を補わず「捕らえた」とした
  alternative: 「それを捕らえた」または「目標に達した」
  rationale: 原文には明示的な目的語がなく、何を捕らえたのかは直前の文脈から理解される。日本語でも成立するため、曖昧さを保持した。
- issue: ἀδελφοί の共同体的範囲
  choice: 本文は形態に即して「兄弟たち」、混成共同体を含み得ることを脚注で説明
  alternative: 「兄弟姉妹たち」
  rationale: 原語の男性複数形を見える形で残しつつ、パウロ書簡における包括的用法を読者に伝えるため。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。原文の省略を保った「ただ一つ」と、競走を思わせる前後の身体的比喩を自然な日本語で再現した。節末は次節へ続く構文のため読点で閉じた。
