revisions:
- from: 兄弟たち[a]、私は、自分がすでに捕らえたとは考えていません。ただ一つ、後ろのものを忘れ、前のものへと身を伸ばしながら、
  to: 兄弟たち[a]、私は自分がすでにそれをつかんだとは考えていません。ただ一つ、後ろにあるものを忘れ、前にあるものへと身を伸ばしながら、
  rationale: 日本語として必要な範囲で省略目的語を「それ」として補い、「捕らえる」より自然で原文の把持の比喩に近い「つかむ」を用いた。「それ」が何を指すかは本文で特定しておらず、原文と文脈の曖昧さを保つ。後方・前方の表現には「にある」を補って自然さと対照を明確にした。節末の読点は次節へ続く構文を反映して維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:15Z'
review_pass:
  verdict: revise
  source_fidelity: 原文は「自分がすでに（それを）つかんだとは考えない」という完了不定詞を用い、目的語は文脈上省略されている。日本語では「捕らえた」を無目的語のまま置くと不自然で意味が取りにくいため、「それをつかんだ」として必要な照応を補うのが適切である。「ただ一つ」以下の省略的な転換、後方を忘れ前方へ伸びるという二つの現在分詞の並行は保たれている。
  naturalness: 「私は、自分がすでに捕らえたとは」は読点も含めてややぎこちなく、とりわけ「捕らえた」は通常、何を捕らえたかを要求する。「私は自分がすでにそれをつかんだとは」とすれば、現代標準日本語として自然で、比喩も維持される。「後ろにあるもの／前にあるもの」は空間的な対比をより明瞭にする。
  terminology: ἀδελφοί を「兄弟たち」とし、女性を含みうる共同体への呼びかけであることを脚注で示す処理は、原語の形態と書簡での用法の双方に配慮している。「つかむ」は κατειληφέναι の比喩的な「獲得する・つかみ取る」を過度に解釈せず表す。
  issues:
  - severity: medium
    issue: 「自分がすでに捕らえたとは」が無目的語で不自然
    rationale: κατειληφέναι の目的語はギリシア語では文脈上省略されるが、日本語の「捕らえる」はこの構文では目的語なしだと不自然である。「それを」を補って照応させても、何を指すかという文脈上の広がりを限定しない。
  - severity: low
    issue: 「後ろのもの／前のもの」はやや圧縮されている
    rationale: 誤訳ではないが、「後ろにあるもの／前にあるもの」とすると、日本語として自然でありつつ ὀπίσω と ἔμπροσθεν の空間的対照を明示できる。
  revised_text: 兄弟たち[a]、私は自分がすでにそれをつかんだとは考えていません。ただ一つ、後ろにあるものを忘れ、前にあるものへと身を伸ばしながら、
  revised_footnotes:
