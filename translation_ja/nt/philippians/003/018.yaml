id: PHP.3.18
reference: Philippians 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: ja
  text: というのも、多くの人が歩んでいるからです[a]。私は彼らについて、あなたがたに何度も話しましたが、今は涙ながらに言います。彼らはメシアの十字架の敵です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「歩んでいる」とは、ここでは生き方や日々の振る舞いを表す比喩。
    reason: 原文の比喩を保持しながら、現代の読者に意味を明確にするため。
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 形容詞の名詞的用法を、人数の多さを過度に強調せず自然な日本語で表した。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 前節の勧めを根拠づける説明的な接続を、日本語で明確に示した。
- source_word: περιπατοῦσιν
  choice: 歩んでいる
  rationale: 生き方を指すパウロの比喩を保持しつつ、脚注で意味を明確にした。
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: 以前から何度もあなたがたに話してきました
  rationale: πολλάκιςと未完了過去ἔλεγονが示す、過去に繰り返された行為を自然な日本語で表した。
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: 今は涙を流しながら語ります
  rationale: 現在分詞κλαίωνの同時性と、語り手の深い悲しみを直接的に保持した。
- source_word: ἐχθροὺς
  choice: 敵
  rationale: 十字架に敵対する者という強い表現を弱めずに訳した。
- source_word: σταυροῦ
  choice: 十字架
  rationale: 処刑具と、その死が持つ神学的意味の双方を担う定着した訳語を用いた。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは固有名というより称号として機能しているため、その意味を明示する「メシア」とした。
theological_decisions:
- issue: τοὺς ἐχθροὺςとπεριπατοῦσινの関係
  choice: 「メシアの十字架の敵として歩んでいる」
  alternative: 「彼らはメシアの十字架の敵です」
  rationale: 原文の後置された同格的表現を、日本語では「敵として歩む」と結び、彼らの生き方そのものが十字架への敵対を示すという力を保った。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςの称号としての意味を保持した。特定の教派的解釈を加えるものではない。
translation_notes:
  register: 明快な現代標準語を用い、パウロの悲嘆と警告の厳粛さを保った。原文の長い文構造は、日本語で理解しやすい二文に分けた。
