  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: ja
  text: しかし、私にとって利益だったものは何であれ、私はそれらをメシアのゆえに損失と見なしています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストのゆえに」または「メシアのために」とも訳せる。
    reason: Χριστόςの慣用的音訳「キリスト」と、διά＋対格を「～のために」と表す訳語上の選択肢を示す。
lexical_decisions:
- source_word: Ἀλλὰ
  choice: しかし
  rationale: 直前までに挙げた誇りの根拠との強い対照を、簡潔で自然な接続詞によって示す。
- source_word: ἅτινα
  choice: ……ものは何であれ
  rationale: 先に列挙された個々の利点すべてを包括する不定関係代名詞の広がりを保つ。
- source_word: κέρδη
  choice: 利益
  rationale: ζημίαとの会計的な対比を保ちつつ、複数形は「……もの」で表現する。
- source_word: ἥγημαι
  choice: 見なすようになりました
  rationale: 完了形が表す、過去の再評価によって成立し現在も続く判断を自然な日本語で示す。
- source_word: διὰ τὸν Χριστὸν
  choice: メシアのゆえに
  rationale: διά＋対格の理由・原因を表し、Χριστόςを称号として訳す。
- source_word: ζημίαν
  choice: 損失
  rationale: κέρδηとの商業・会計上の比喩的対照を明確に保つ。
theological_decisions:
- issue: Χριστόνの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この文脈では称号としての意味を明示する。ただし、日本語で定着した「キリスト」も可能なので脚注に示す。
- issue: διὰ＋対格の意味
  choice: ……のゆえに
  alternative: ……のために
  rationale: 主として理由・原因を表す読みを本文に採用する一方、目的・利益を含みうる表現上の幅を脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「利益／損失」という会計的対比を維持し、ἥγημαιの完了的な含意は「見なすようになりました」で表した。
