  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: ja
  text: 八日目に割礼を受け、イスラエルの民の出身で、ベニヤミン族に属し、ヘブライ人の家系に生まれたヘブライ人[a]であり、律法に関してはファリサイ派の者です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ヘブライ人から出たヘブライ人」。ヘブライ人としての家系を強調する表現であり、ヘブライ的な文化的アイデンティティーをも含意する可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: 八日目に割礼を受け
  rationale: 圧縮されたギリシア語表現を自然な日本語にしつつ、生後八日目という契約上のしるしを明確に保つ。
- source_word: ἐκ γένους Ἰσραήλ
  choice: イスラエルの民に生まれ
  rationale: γένοςが示す民族的な出自を、現代日本語で明瞭に表す。単なる所属ではなく、生まれ・血統についての主張であることも伝わる。
- source_word: φυλῆς Βενιαμίν
  choice: ベニヤミン族に属し
  rationale: 部族的系譜を示す属格句を、自然で簡潔な日本語にした。
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: ヘブライ人から生まれたヘブライ人
  rationale: ἐξの出自の意味を表し、パウロ自身と両親・祖先のヘブライ的出自および自己認識を強調する句として自然に訳す。原文の簡潔さと解釈の幅は脚注で補う。
- source_word: κατὰ νόμον
  choice: 律法に関しては
  rationale: ここでのκατάは評価基準・観点を示すため、「律法に従って」よりも、続く身分表示との関係が明確な表現を選ぶ。
- source_word: Φαρισαῖος
  choice: ファリサイ派の者
  rationale: 日本語で定着した名称を用い、個人名ではなくユダヤ教内の一派への所属であることを明瞭にする。
theological_decisions:
- issue: Ἑβραῖος ἐξ Ἑβραίωνが示す範囲
  choice: 本文では「ヘブライ人から生まれたヘブライ人」とし、出自を前面に出す
  alternative: 「生粋のヘブライ人」「ヘブライ人の中のヘブライ人」
  rationale: この句は親から受け継いだ出自だけでなく、言語・文化的な自己認識を含む可能性がある。「生粋の」は意味を固定しやすく、「〜の中の」は最上級的な意味を加えかねないため避け、脚注で含意を示す。
translation_notes:
  register: 列挙のリズムを保ちながら、現代の一般読者に分かりやすい文語寄りの標準日本語とした。前後の文に続く経歴一覧であるため、各句を連用形でつなぎ、末尾のみ丁寧な叙述形にまとめた。
