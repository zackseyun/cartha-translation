  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν εἰς ὃ ἐφθάσαμεν, τῷ αὐτῷ ⸀στοιχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: ja
  text: ただし、私たちがすでに到達したところに従い、その歩調を保って進みましょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「ただし、私たちがすでに到達したところに従って歩みましょう。」または「同じ基準に従って歩みましょう。」
    reason: στοιχεῖνは「歩調を保つ」「列に従って歩く」ことを表し、τῷ αὐτῷには「同じ〔もの〕に／によって」という含みがある。ただし、このSBLGNT本文では「基準」「規則」などの名詞は明示されていない。
lexical_decisions:
- source_word: πλήν
  choice: ただ
  rationale: ここでは例外を表すというより、勧めを一つの要点に絞る移行表現。「ただ」はパウロの限定・修正の力を簡潔で自然な日本語で表す。
- source_word: εἰς ὃ
  choice: ところに従って
  rationale: すでに到達した段階・水準を指す。στοιχεῖνとの結びつきを自然な日本語にし、その到達点に即して進む意味を示す。
- source_word: ἐφθάσαμεν
  choice: 私たちはすでに達した
  rationale: 過去に到達し、今も基準となっている段階を表す。「すでに達した」は文脈上の進展と現在的な意味を明瞭に伝える。
- source_word: τῷ αὐτῷ
  choice: 従って
  rationale: 同じ線・基準に即する意味を、本文に明示されない「規則」などの名詞を補わずに表す。
- source_word: στοιχεῖν
  choice: 歩みをそろえましょう
  rationale: 列を乱さず同じ線に沿って歩く比喩を保ちつつ、現代日本語で理解しやすい勧めとして表現する。
theological_decisions:
- issue: τῷ αὐτῷに「規則」「基準」などの名詞を明示的に補うか
  choice: 本文では名詞を補わず、「達したところに従って、歩みをそろえましょう」と訳す。
  alternative: 「同じ規則に従って歩みましょう」／「同じ基準を守りましょう」
  rationale: SBLGNTの短い本文では、従うべきものが暗黙にされている。後代の本文拡張や伝統的訳語に寄せて特定の名詞を補うことを避けつつ、同じ到達点に即して歩む勧めを伝える。
translation_notes:
  register: 明瞭な現代標準日本語。勧告の一人称複数を「ましょう」で表し、簡潔さと品位を保った。「歩みをそろえる」によりστοιχεῖνの整列して進む比喩を残した。
