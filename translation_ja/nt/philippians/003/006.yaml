id: PHP.3.6
reference: Philippians 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: ja
  text: 熱心について言えば、教会を迫害し、律法に基づく義[a][b]について言えば、非難されるところのない者となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正しさ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「律法に基づく義」は、直訳すると「律法の中にある義」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: ～について言えば
  rationale: 評価の観点を示す κατά の反復を、自然な現代日本語で明確に表した。
- source_word: ζῆλος
  choice: 熱心
  rationale: パウロのかつての宗教的な情熱と献身の強さを、簡潔で一般的な語によって表す。
- source_word: διώκων
  choice: 迫害し
  rationale: 文脈上、単なる追跡ではなく、キリスト者の共同体に対する敵対的行為を指す。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: ここでは一般的な集会ではなく、キリスト者の共同体を指している。
- source_word: δικαιοσύνην
  choice: 義
  rationale: 律法を基準とした正しさを指す語として、パウロ書簡の用語上のつながりを保つ「義」を採用した。
- source_word: ἐν νόμῳ
  choice: 律法に基づく
  rationale: 直訳は「律法の中にある」だが、ここでの領域・基準の意味を自然な日本語で示した。
- source_word: γενόμενος
  choice: ～者となりました
  rationale: 分詞の到達・成立のニュアンスを残し、単なる形容表現へ平板化しないようにした。
- source_word: ἄμεμπτος
  choice: 非難されるところのない
  rationale: 定められた評価基準の範囲内で責められる点がないことを表し、絶対的な無罪・無欠を意味しない表現とした。
theological_decisions:
- issue: パウロが主張する「非難されるところのなさ」の範囲
  choice: 律法に基づく義という評価領域において、非難されるところがなかったという主張として訳す。
  alternative: 神の前で完全に罪がなかったという主張として読む。
  rationale: ἄμεμπτος は「律法の中にある義」に結び付いており、無限定の道徳的完全さではなく、ここで明示された律法上の評価基準に即した主張である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。κατὰ の反復による対句を「～について言えば」で保持しつつ、日本語として過度に硬くならないようにした。
