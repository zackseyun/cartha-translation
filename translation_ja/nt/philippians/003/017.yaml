source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: ja
  text: 兄弟たち[a]、皆で私に倣う者となってください。そして、私たちを模範としているあなたがたと同じように歩んでいる人たちに、よく目を留めてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語の形は男性複数だが、ここでは会衆全体への呼びかけと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: 皆で私に倣う者となってください
  rationale: Συμμιμηταί の共同的な力を「皆で」で示し、γίνεσθε の「〜となれ」という命令も保った。自然な現代日本語にしつつ、単なる個人的模倣ではなく共同で倣う趣旨を表す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 文法上の男性複数呼格を本文に反映した。会衆全体への呼びかけである可能性は脚注で明示する。
- source_word: σκοπεῖτε
  choice: よく目を留めてください
  rationale: 注意深く継続して観察する意味を、自然で明瞭な日本語で表した。
- source_word: οὕτω περιπατοῦντας
  choice: 同じように歩んでいる人たち
  rationale: περιπατέω の生き方を表す比喩「歩む」を保持し、οὕτω を直前の模範との関係が分かる形で訳した。
- source_word: τύπον
  choice: 模範
  rationale: 従うべき実例・型を意味する。日本語では「模範」が人物を指す ἡμᾶς と自然に結びつく。
- source_word: ἡμᾶς
  choice: 私たち
  rationale: 原文の複数形を保持し、パウロだけに限定しなかった。
theological_decisions:
- issue: ἀδελφοί の包摂的な指示範囲
  choice: 本文では「兄弟たち」とし、脚注で会衆全体を指し得ることを示す。
  alternative: 本文で「兄弟姉妹たち」と訳す。
  rationale: 原文の男性複数形を保ちながら、文脈上は女性を含む会衆全体への呼びかけと考えられる点も読者に伝える。
- issue: 模倣の対象における単数と複数
  choice: 前半は「私」、後半は「私たち」と訳し分ける。
  alternative: 両方をパウロ個人への言及として単数にそろえる。
  rationale: 原文の μου と ἡμᾶς の数の違いを保持し、後半に同労者が含まれる余地を残す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。命令は「〜てください」で柔らかくせず、共同体への勧告として自然な丁寧さを持たせた。「歩む」はパウロ特有の生き方の比喩を保持する。
