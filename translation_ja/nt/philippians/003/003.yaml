id: PHP.3.3
reference: Philippians 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: ja
  text: というのも、神の霊によって礼拝し[a]、メシアであるイエスを誇りとし[b]、肉に頼らない[c]私たちこそ、割礼なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「霊によって神を礼拝し」とも読めます。
    reason: textual_variant
  - marker: b
    text: 「メシア」は、ギリシャ語の称号「クリストス」の意味を訳したものです。
    reason: lexical_alternative
  - marker: c
    text: ここで「肉」は、身体的な割礼、出自、身分、実績など、人間が頼りや誇りの根拠とするものを指します。
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: 割礼
  rationale: 具体的な契約用語を保ち、「私たちこそ、割礼なのです」という大胆な述語表現によって、身体上の印だけでなく真の契約共同体を指すパウロの逆説を保持した。
- source_word: πνεύματι θεοῦ
  choice: 神の霊によって
  rationale: SBLGNT本文のθεοῦに従い、人間の内面的精神ではなく、礼拝の力または働き手である神の霊を指す表現とした。与格の幅はあるが、日本語では手段を自然に示す「によって」を採用した。
- source_word: λατρεύοντες
  choice: 礼拝し
  rationale: 神にささげる宗教的奉仕を表す動詞であり、現代日本語で明瞭かつ自然な「礼拝する」とした。
- source_word: καυχώμενοι
  choice: 誇りとし
  rationale: 単なる喜びではなく、誇りや信頼の根拠を示す文脈上の対比を保った。日本語では「誇る」よりも「誇りとする」が自然である。
- source_word: Χριστῷ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語として不自然になりやすい「メシア・イエス」を避けた。「である」は原文にない語だが、称号と固有名の関係を自然に表すための最小限の補いである。
- source_word: σαρκί
  choice: 肉
  rationale: 字義と比喩の重なりを残すため「肉」を保持した。この文脈では身体的割礼、民族的出自、宗教的実績など、人間的・身体的な誇りの根拠を指す。
- source_word: πεποιθότες
  choice: 頼らない
  rationale: 完了分詞が示す確立した信頼・依拠を、平明な現代日本語で表した。「自信を置かない」より自然で、「信じない」より対象への依存という含意が明確である。
- source_word: γάρ
  choice: というのも
  rationale: 直前の警告を説明する論理関係を、現代日本語で自然に示した。
theological_decisions:
- issue: この節におけるσάρξの意味
  choice: 身体的割礼や出自、身分、宗教的実績など、人間的・身体的な信頼の根拠
  alternative: 内面的な道徳原理としての「罪深い性質」
  rationale: 直後の3章4–6節でパウロが割礼、民族、律法上の立場、熱心さを列挙するため、ここでは「肉」を人間が誇り得る資格や実績として読むのが文脈に適う。訳語自体は意味を狭く限定せず「肉」とした。
- issue: πνεύματι θεοῦの働き
  choice: 神の霊が礼拝の手段または力の領域である
  alternative: 人間の霊による礼拝、または単に霊的な態度で礼拝すること
  rationale: SBLGNTのθεοῦは「霊」を神に属するものとして限定するため、神の霊への言及と理解するのが自然である。ただし与格が手段と領域のどちらに重点を置くかは過度に断定しない。
- issue: 「私たちこそ、割礼なのです」の指示対象
  choice: パウロが「割礼」を真の契約共同体を指す逆説的呼称として用いる
  alternative: 信者が文字どおり全員身体的な割礼を受けているという意味
  rationale: 周囲の対比と三つの分詞句から、身体上の印ではなく神の霊による礼拝とメシアへの誇りによって特徴づけられる共同体を指す。ただし原文の強い同定表現を説明的な言い換えで弱めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、説明的になりすぎない格調を保った。三つの分詞句を並列させ、原文の修辞的な対比を再現した。「私たちこそ、割礼なのです」は日常語としては大胆だが、原文の逆説を保つために意図的に採用した。
