id: PHP.3.8
reference: Philippians 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: ja
  text: それどころか、私の主であるメシア・イエスを知ることの比類ない価値のゆえに、私はすべてを損失だと考えています。この方のゆえに、私はすべてを失い、それらをくず[a]と考えています。それは、メシア[b]を得るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「くず」は強い語で、「ごみ」「汚物」「糞」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「メシア」は「キリスト」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: それどころか
  rationale: 前節の評価をさらに強めて押し進める談話上の働きを、簡潔で自然な現代日本語で表す。
- source_word: ἡγοῦμαι
  choice: 考えています
  rationale: 熟慮したうえでの評価・判断を表す。二つの用例を一貫して訳した。
- source_word: πάντα / τὰ πάντα
  choice: すべて
  rationale: 意図的に広い範囲を保ちつつ、日本語として過度に形式張らない表現とした。
- source_word: ζημίαν
  choice: 損失
  rationale: κέρδος／κερδαίνωとの損得・会計の比喩に合い、前節から続く対比を保つ。
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: 知ることの、この上ない価値のゆえに
  rationale: ὑπερέχονの卓越性・比類なさと、γνῶσιςの関係的・経験的な『知ること』の含みを自然な日本語で伝える。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστόςの称号としての意味を明示し、固有名との結びつきを中黒で読みやすくした。
- source_word: τοῦ κυρίου μου
  choice: 私の主である
  rationale: 所有関係とキリスト論的重みを保ちつつ、前の名詞句に自然につなげる。
- source_word: δι’ ὃν
  choice: この方のゆえに
  rationale: 原因と献身的な関係の双方を示し、指示対象が人物であることを明確にする。
- source_word: ἐζημιώθην
  choice: 私はすべてを失い
  rationale: 受動形が表す損失を被った事実を簡潔に伝える。完了的な結果は文脈から明らかである。
- source_word: σκύβαλα
  choice: くず同然
  rationale: 無価値な廃物として退ける強い語感を、現代日本語で品位と可読性を保ちながら表す。排泄物を指し得る強さもあるが、ここでは語義を一つに限定しない。
- source_word: ἵνα Χριστὸν κερδήσω
  choice: それは、メシアを得るためです
  rationale: ἵναの目的を明示し、ζημίαとの損得の比喩を『得る』で保持する。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: 本節では称号としての意味がなお認められるため『メシア』とした。伝統的な音訳も可能であることを脚注に示す。
- issue: γνῶσιςの表現
  choice: 知ること
  alternative: 知識
  rationale: 属格構文の意味を保ちながら、単なる情報ではなく、メシア・イエスを人格的に知る含みを自然に示す。ただし、原文が持つ名詞的表現を教理的に過剰限定しない。
- issue: σκύβαλαの語感
  choice: くず同然
  alternative: ごみ／汚物／糞
  rationale: 強い侮蔑的評価を保ちながら、公刊聖書として自然で dignified な語を選んだ。語が具体的に廃物か排泄物かは文脈だけでは確定しないため、本文で狭く限定しない。
translation_notes:
  register: 明瞭な現代標準日本語。パウロの損失と獲得の比喩を維持し、過度に古風な語法を避けた。σκύβαλαの強さは『くず同然』で示しつつ、下品さを不必要に増幅していない。
