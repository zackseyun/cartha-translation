  text: εἴ πως καταντήσω εἰς τὴν ἐξανάστασιν ⸂τὴν ἐκ⸃ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/011.yaml
  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: ja
  text: 何とかして、死者の中からの復活に到達できればと思います[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「復活」と訳したギリシア語は、通常とは異なる珍しい形です。より直訳的には「死者の中からの『出る復活』」とも表せますが、この語形だけで特別な種類の復活を指すと断定することはできません。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: 何とかして……できれば
  rationale: 方法が定まっていないことと控えめな期待を表す。神の約束そのものへの疑いと断定せず、原文の条件的・切望的な響きを保った。
- source_word: καταντήσω
  choice: 達することができれば
  rationale: 目標や終着点に至るという比喩的意味を自然な日本語で表し、接続法の含みも「できれば」によって残した。
- source_word: εἰς
  choice: に
  rationale: 目標への到達を表す日本語として「復活に達する」が自然である。
- source_word: ἐξανάστασιν
  choice: 復活
  rationale: 死者が起こされることを指す標準的で明瞭な訳語を用いた。珍しい語形の「外へ」という含みは脚注で示した。
- source_word: τὴν ἐκ νεκρῶν
  choice: 死者の中からの
  rationale: 単なる「死者の復活」ではなく、死者たちの中から起こされるというἐκの方向性を明示した。
theological_decisions:
- issue: ἐξανάστασιςを通常のἀνάστασιςと明確に区別し、特別な種類の復活を指すものとして訳すべきか。
  choice: 本文では「死者の中からの復活」と訳す。
  alternative: 「死者たちの中から外への復活」または「抜け出る復活」
  rationale: 珍しい語形には「外へ」の含みがあり得るが、それだけで別種の復活という教理的区別を確定することはできない。本文の明瞭さを保ちつつ、語形上の特徴を脚注に残した。
- issue: εἴ πωςが復活についての疑念を表すのか、目標に向かう謙虚な切望を表すのか。
  choice: 「何とかして……できれば、と願っています」とし、期待と切望を表す。
  alternative: 「もし何らかの方法で……達するなら」
  rationale: 原文の条件的な形を保ちながら、文脈上、復活の約束への不信を断定しない訳とした。「願っています」は独立した日本語文として自然にするための補足である。
translation_notes:
  register: 明瞭で現代的ながら、終末的な希望にふさわしい落ち着いた文体とした。「達する」は目標到達の比喩を保つ。「できれば、と願っています」により、原文の断片的な条件表現を自然な独立文にしつつ、謙虚な切望を表した。
