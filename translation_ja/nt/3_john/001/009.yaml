  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: ja
  text: 私は教会に何かを書きました[a]。しかし、彼らの中で第一の地位を好むディオトレフェは、私たちを受け入れません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「教会に何かを書きました」。ギリシャ語は内容を特定しない表現です。写本によっては語句が補われています。
    reason: textual_variant
  - marker: b
    text: 「私たちを歓迎しない」「私たちを認めない」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά τι
  choice: 少し書き送りました
  rationale: アオリストを過去の行為として訳し、τιの不定性を「少し」によって自然な日本語で表した。本文が手紙を書く行為を指すため、「書き送りました」としたが、内容を具体化しすぎないよう脚注を付した。
- source_word: τῇ ἐκκλησίᾳ
  choice: 教会に
  rationale: 地域のキリスト者の集まりを指す標準的で広く理解される訳語。
- source_word: ὁ φιλοπρωτεύων
  choice: 第一の地位に就きたがる
  rationale: 単に順番が最初というより、集団内で首位・優位を好むという否定的含意を、明瞭な現代日本語で表した。
- source_word: αὐτῶν
  choice: 彼らの中で
  rationale: ディオトレフェが第一でありたがる範囲・集団を示し、正式な支配権まで断定しない。
- source_word: Διοτρέφης
  choice: ディオトレフェ
  rationale: ギリシャ語名の日本語における一般的な音写。
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: 私たちを受け入れません
  rationale: ἐπιδέχομαιが含みうる歓迎、受容、承認という幅を保ち、接待の拒否または権威の否認の一方だけに限定しない。
theological_decisions:
- issue: ディオトレフェの反対の具体的性質
  choice: 私たちを受け入れません
  alternative: 私たちを歓迎しません／私たちを認めません
  rationale: 人的な歓迎、使者の接待、または著者側の権威の承認のどれが中心かを本文だけで限定せず、ギリシャ語の意味の広がりと神学的緊張を保った。
- issue: ディオトレフェが求める優位の性質
  choice: 彼らの中で第一の地位に就きたがる
  alternative: 彼らを支配したがる
  rationale: 本文は首位を好む姿勢を非難するが、制度上の役職や正式な支配権を明示してはいないため、それを訳文に加えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「就きたがる」でφιλοπρωτεύωνの継続的な欲求と否定的評価を表し、「受け入れる」は意図的に広い語として残した。
