id: 3JN.1.7
reference: 3 John 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: ja
  text: 彼らは御名のために出て行き、異邦人[a]からは何も受け取らなかったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「異教徒」あるいは「信者でない人々」。
    reason: ἐθνικῶν は、民族的な意味での「異邦人」だけでなく、この文脈では宗教的共同体の外にいる人々を指す語としても理解できるため。
lexical_decisions:
- source_word: ὑπὲρ
  choice: 〜のために
  rationale: 属格を伴い、ここでは代位ではなく、行動の目的・動機を表す。「〜のために」は現代日本語として自然であり、宣教に出た理由を明確に伝える。
- source_word: τοῦ ὀνόματος
  choice: 御名
  rationale: 直訳的には「その名」。初期キリスト教においてイエス／主を敬って暗示する表現であるため、指示対象を本文に補わず、日本語で同様の敬意と含意を持つ「御名」とした。
- source_word: ἐξῆλθον
  choice: 出て行き
  rationale: アオリスト能動直説法。「旅立ち」も可能だが、原語の基本的な表現を保ちつつ、宣教のために出発した文脈にも自然に合う。
- source_word: μηδὲν λαμβάνοντες
  choice: 何も受け取らなかった
  rationale: 分詞句が、彼らが出て行った際の姿勢・行動を説明している。ここでは金銭や物質的援助を受領しなかった意と理解できるが、原文が対象を限定していないため「援助」などを補わなかった。
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: 異邦人から
  rationale: ἐθνικός の複数実詞用法で、諸国民に属する人々、文脈上はキリスト者でない人々を指す。「異邦人」は民族的・宗教的背景の両方を残し、「異教徒」「信者でない人々」より解釈を狭めにくい。
theological_decisions:
- issue: 「御名」の指示対象
  choice: イエス／主を敬って指す暗示的表現として、本文では「御名」とする。
  alternative: 「キリストの名のために」または「その方の名のために」と明示する。
  rationale: 原文は指示対象を明記せず「その名」という敬称的な略語を用いる。文脈上の指示対象は明らかだが、本文に「キリスト」などを補うと原文の含蓄が失われる。
- issue: ἐθνικῶν の意味範囲
  choice: 本文では「異邦人」とする。
  alternative: 「異教徒」または「信者でない人々」とする。
  rationale: この語は文脈上、キリスト者ではない外部の人々を表し得る一方、諸国民という民族的・歴史的な響きも持つ。「異邦人」はその両面を比較的よく保ち、別の理解は脚注に示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「御名」は聖書的な敬意を保ちながら一般読者にも理解可能な語とした。脚注記号は、それが説明する「異邦人」の直後に置いた。
