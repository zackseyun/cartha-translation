id: 3JN.1.10
reference: 3 John 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: ja
  text: ですから、私がそちらに行くなら、彼がしている行いを指摘します。彼は悪意ある言葉で私たちを中傷し、たわごとを言っています。それだけでは満足せず、彼自身も兄弟たちを受け入れず[a][b]、受け入れようとする人々を妨げ、その人々を教会から追い出しています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け入れず」は「歓迎せず」とも訳せる。ここでは、とりわけ宿を提供するなどして迎え入れることが含まれる。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、巡回していたキリスト者の兄弟たち、特に宣教者たちを指すと考えられる。
    reason: referent_clarification
  - marker: c
    text: 「教会から追い出す」は、この文脈ではキリスト者の共同体から除外することを指す。
    reason: cultural_context
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 前節を受ける因果・帰結を、自然な現代日本語で明示する。
- source_word: ἐὰν ἔλθω
  choice: 私が行ったなら
  rationale: 書き手が読者のもとへ赴くという書簡上の視点と、条件文の意味を保つ。
- source_word: ὑπομνήσω
  choice: 取り上げます
  rationale: 単に思い出させるというより、ディオトレフェスの行為を公に問題として示す文脈上の意味を表す。
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: 彼がしている行い
  rationale: 複数の行為と、その行為が継続中であることを簡潔に表す。
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: 悪意ある言葉で私たちを根拠なく非難しています
  rationale: φλυαρέωの空疎で無責任な発言という含意と、文脈上の敵対的な言動を、明瞭な日本語で表現する。
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: それだけでは満足せず
  rationale: 先の中傷に加えて行為がさらに及ぶという参与節の展開を自然に示す。
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: 自分でも兄弟たちを受け入れず
  rationale: αὐτόςの強調を「自分でも」で保ち、ἐπιδέχομαιの受け入れる・歓迎するという幅を本文と注で示す。
- source_word: τοὺς βουλομένους κωλύει
  choice: 受け入れようとする人々を妨げ
  rationale: 前節から補われる目的語を日本語では明示し、βούλομαιの意志とκωλύωの妨害の意味を保つ。
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: その人々を教会から追い出しています
  rationale: ἐκβάλλωの強い排除の意味と現在の継続的行為を、自然で力のある表現にする。
theological_decisions:
- issue: τοὺς ἀδελφούςが指す範囲
  choice: 兄弟たち
  alternative: 信者たち／兄弟姉妹たち
  rationale: 男性複数形を保ち、文脈上は巡回する男性のキリスト者・宣教者を指す可能性が高い。ただし共同体一般を指す可能性を完全には排除せず、注で説明する。
- issue: ἐκκλησίαの意味
  choice: 教会
  alternative: 集会／会衆
  rationale: ここでは地域のキリスト者共同体を指す。「教会」は自然な訳語だが、建物からの排除ではなく共同体からの排除であることを注で明確にする。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「根拠なく非難する」はφλυαρέωの空疎な言説を日本語として理解しやすく表した。「兄弟たち」は原文の男性複数を保持し、もてなしと教会共同体からの排除に関する含意は脚注で補った。
