  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: ja
  text: 愛する者よ、あなたは兄弟たち[b]のために何をするにしても、忠実に行っています。しかも、その兄弟たちが見知らぬ人であってもです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「兄弟たち」は男性複数形のἀδελφούςを訳したもの。ここでは同じ信仰を持つ仲間を指し、その中には女性も含まれていた可能性がある。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは、「兄弟たちのために何をするにしても、あなたは忠実なことをしています。それも、見知らぬ人たちのために」となる。
    reason: translation_clarity
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: 愛する者よ
  rationale: 単数呼格の親愛を込めた呼びかけ。書簡の温かさと品位を保ちつつ、現代日本語でも理解できる表現とした。
- source_word: πιστὸν ποιεῖς
  choice: 忠実に行っています
  rationale: 直訳的な「忠実なことをしている」より自然であり、ガイオの信実さと確かさをほめる意味を保つ。
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: することは何であれ
  rationale: 関係代名詞とἐάν＋接続法による不定の意味「何をするにしても」を表す。ἐργάζομαιはここでは広く実際の働き・行為を指す。
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: 兄弟たちのために
  rationale: εἰςの受益的な意味を自然な日本語で表した。ἀδελφούςの男性複数形は「兄弟たち」とし、文脈上の範囲は注で説明した。
- source_word: καὶ τοῦτο ξένους
  choice: しかも、彼らがあなたにとって見知らぬ人である場合にも
  rationale: 簡潔で省略のあるギリシア語を、未知の同信者に対するもてなしという文脈が伝わるよう補った。「しかも」によりκαὶ τοῦτοの強調を表した。
- source_word: ξένους
  choice: あなたにとって見知らぬ人
  rationale: ここでは民族的な「外国人」ではなく、受け入れる側と面識のない人を指すため。関係性を明確にするため「あなたにとって」を補った。
theological_decisions:
- issue: ἀδελφούςが指す信仰共同体の範囲
  choice: 本文では文法的形態に沿って「兄弟たち」とし、同じ信仰を持つ仲間を指すことを注記する
  alternative: 「兄弟姉妹たち」または「信仰の仲間たち」
  rationale: 原語の男性複数形を本文に保ちながら、文脈上は女性を含み得る共同体的用法であることを明示し、範囲を不必要に限定しない。
translation_notes:
  register: 親愛を込めた書簡の呼びかけと、相手をほめる穏やかで品位ある調子を保った。「見知らぬ人」は現代語として自然であり、民族的な外国人という誤解を避ける。省略の多い後半は、原文の強調を保ちながら日本語として意味が通るよう最小限補足した。
