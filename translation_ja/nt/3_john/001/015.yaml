  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: ja
  text: あなたに平安がありますように[a]。友人たちがあなたによろしくとあいさつしています。友人たち一人ひとりに、名を挙げてあいさつしてください[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたに平安を」。動詞を省いた簡潔な祝福の言葉。
    reason: lexical_alternative
  - marker: b
    text: 「名を挙げて」は、一人ひとりに個人的にあいさつすることを表す。別訳「友人たち一人ひとりにあいさつしてください」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: あなたに平安がありますように
  rationale: 動詞を省いた簡潔な書簡上の祝福。日本語では願いの意味を補うことで自然かつ明確に表現した。直訳的な「あなたに平安を」も可能。
- source_word: ἀσπάζονταί σε
  choice: あなたによろしくと言っています
  rationale: 書簡の結びに用いられる挨拶表現。発信者側の友人たちから受信者への挨拶であることを、現代日本語で自然に示す。
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: 友人たち
  rationale: 同じ語 φίλοι を二箇所で一貫して訳し、「兄弟たち」など本文にない教会用語へ置き換えない。
- source_word: κατ’ ὄνομα
  choice: 一人ひとりに、名を挙げて
  rationale: 直訳の「名によって」が持つ、各人を個人的に名指して挨拶する意味を明確にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語による、親しみと品位を備えた書簡の結語。「平安」は聖書的な語感を保ちつつ現代の読者にも理解できる表現とし、挨拶には自然な「よろしく伝える」を用いた。
