  source_fidelity: 「あなたに平安がありますように」は、Εἰρήνη σοι の簡潔な祝福を自然な日本語で適切に表している。「友人たち」も φίλοι を一貫して訳しており、「兄弟たち」などへの同化を避けている。後半の「よろしく伝えてください」は書簡としては理解可能だが、ἀσπάζου（あなた自身があいさつする）の直接性よりも、伝言を託す意味合いを帯びうるため、「あいさつしてください」とするのがより忠実である。
  naturalness: 現行の「あなたによろしくと言っています」は通じるが、書簡の結語としては「あなたによろしくとあいさつしています」のほうがやや明瞭で自然である。「名を挙げてあいさつしてください」は、現代標準語として自然で、個々人に向けたあいさつという文脈も保てる。
  terminology: 「平安」は祝福として定着した語であり、ここでは適切である。「友人たち」は原文の φίλοι を保つよい選択である。κατ’ ὄνομα は「名を挙げて」と訳し、注で「一人ひとりに個人的に」の意味を補足する。
