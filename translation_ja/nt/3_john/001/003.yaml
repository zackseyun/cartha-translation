source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: ja
  text: というのも、兄弟たち[a]が来て、あなたが真理に忠実であること[b]を証ししたので、私は大いに喜びました。その証しのとおり、あなたは真理のうちを歩んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、キリストを信じる仲間を指す呼び方です。原文は男性複数形ですが、文脈によっては女性を含む信徒全般を指すことがあります。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「あなたの真理について証しした」。または「あなたのうちにある真理について証しした」とも取れます。ここでは、真理に即したあなたの忠実な歩みを指すと理解しています。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: というのも、私は大いに喜びました
  rationale: γάρの説明的なつながりを「というのも」で示し、ἐχάρηνの能動的な意味とλίανの強意を、自然で品位ある現代日本語で表した。
- source_word: ἐρχομένων ἀδελφῶν
  choice: 兄弟たちが来て
  rationale: 属格独立分詞構文の時・状況を自然に表した。「兄弟たち」は初期キリスト教共同体の家族的呼称を保つ。
- source_word: μαρτυρούντων
  choice: 証ししてくれた
  rationale: μαρτυρέωの証言・証しの語感を保ちつつ、報告が著者にもたらされたことを自然な日本語で示した。
- source_word: σου τῇ ἀληθείᾳ
  choice: あなたが真理に忠実であること
  rationale: 直訳的な「あなたの真理」は私的な真理という誤解を招きやすいため、与格と属格が示すガイオの真理との関係を文脈に即して表した。解釈の幅は脚注に残した。
- source_word: καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς
  choice: その証しのとおり、あなたは真理のうちを歩んでいます
  rationale: καθώςが証言内容と実際の歩みとの一致を示すことを明確にし、περιπατέωの倫理的な「歩む」という比喩と、ヨハネ文書に特徴的な「真理」の表現を保持した。
theological_decisions:
- issue: ヨハネ文書の倫理的文脈における「真理」の意味
  choice: 両方のἀλήθειαを「真理」とし、第一の箇所は「真理に忠実である」と表現した
  alternative: 「あなたの真理」「あなたのうちにある真理」「誠実さ」
  rationale: 教理への忠実、道徳的誠実さ、真理に即した生活という含意を一つに限定しないため、中心語「真理」を維持した。
- issue: περιπατέωの倫理的比喩
  choice: 真理のうちを歩んでいます
  alternative: 真理に従って生きています
  rationale: 意味を理解できる範囲で原文の比喩とヨハネ文書内の表現上の連続性を保った。
translation_notes:
  register: 明瞭で現代的な敬体を用いた。書簡としての温かさを保ちつつ、「証し」「真理のうちを歩む」というヨハネ文書の主要な語彙と比喩を残した。
