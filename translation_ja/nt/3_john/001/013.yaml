  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: ja
  text: あなたに書くことがたくさんありましたが、インクとペン[a]であなたに書くつもりはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「インクと葦のペン」。
    reason: κάλαμος は葦を用いた筆記具を指す。本文では現代日本語として自然な「ペン」とした。
lexical_decisions:
- source_word: Πολλὰ
  choice: たくさんのこと
  rationale: 中性複数形が名詞的に用いられているため、複数の内容を自然な現代日本語で表した。本文では「書くことはたくさん」とした。
- source_word: εἶχον γράψαι
  choice: 書くことは……ありました
  rationale: 未完了過去の εἶχον とアオリスト不定詞の組み合わせを、書こうとしていた内容が多くあったことを示す表現として訳した。「書きたかった」として意欲を明示しすぎることは避けた。
- source_word: σοι
  choice: あなたに
  rationale: 与格が示す書き手から受取人への方向を明示した。原文で二度現れることに対応して、訳文でも二度示した。
- source_word: ἀλλ’ οὐ θέλω
  choice: が、……書こうとは思いません
  rationale: θέλω の意志・願望を、手紙の文脈に合う自然で丁寧な日本語にした。
- source_word: διὰ μέλανος καὶ καλάμου
  choice: インクと筆で
  rationale: διά＋属格の手段を「で」で表した。κάλαμος は文字どおりには葦の筆だが、本文では機能が明瞭な「筆」とし、材質は脚注で示した。
- source_word: γράφειν
  choice: 書こう
  rationale: 現在不定詞が表し得る書く行為の継続性を過度に説明せず、θέλω とともに自然な意向表現にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、書簡にふさわしい落ち着いた丁寧さを保った。原文の二つの不定詞のアスペクト差は、日本語で不自然に強調せず、文脈上の対比を保った。
