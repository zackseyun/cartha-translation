revisions:
- from: 彼らは教会の前で、あなたの愛について証ししました。あなたが彼らを神にふさわしい仕方で旅に送り出すなら[a]、よいことです。
  to: 彼らは教会の集まりの前で、あなたの愛について証ししました。あなたは、彼らを神にふさわしい仕方で旅に送り出すなら[a]、よいことをするでしょう。
  rationale: 証言の内容と公的な場面を保ちつつ、「教会」を建物と誤解しうる表現から共同体の集まりを指す表現へ改めた。後半は、条件的な日本語構文を維持しながらも、「よいことをするでしょう」により καλῶς ποιήσεις の未来形と丁寧な勧告・称賛の力を回復した。脚注の位置と内容は原語 προπέμπω の語義の幅に適切に対応している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:44:15Z'
review_pass:
  verdict: revise
  source_fidelity: 冒頭の証言報告は原文に忠実である。しかし、καλῶς ποιήσεις（未来形、慣用的な称賛・勧告）を「よいことです」とする現行訳は、将来に向けた「あなたはよく行うでしょう」の力を弱めている。また、原文の分詞 προπέμψας は、彼らを送り出す行為によって「よく行う」ことを示すため、その関係を日本語で明示するのがよい。
  naturalness: 「教会の前で」は理解できるが、現代日本語では建物の前という意味にも取り得る。「教会の集まりの前で」とすれば、ἐνώπιον ἐκκλησίας が指す共同体の集会での公的な報告を自然に表せる。後半は「あなたは…よいことをするでしょう」として、自然さと原文の未来の調子を両立できる。
  terminology: 「愛」「証し」「神にふさわしい」は適切である。「証ししました」は μαρτυρέω の公的な報告・証言の意味をこの文脈で十分に伝える。脚注は προπέμπω に伴いうる実際的支援の含意を、本文で過度に限定せずに正しく示している。
  issues:
  - severity: medium
    issue: καλῶς ποιήσεις の未来的・勧告的な力が弱い
    rationale: 「あなたが…送り出すなら、よいことです」は一般的評価として読め、原文の「あなたはよく行うでしょう」という、読者に向けた丁寧な称賛・促しを十分に表さない。
  - severity: low
    issue: 「教会の前で」がやや曖昧
    rationale: ἐκκλησία はこの箇所では建物ではなく信徒共同体の集まりを指す。「教会の集まりの前で」とすることで、現代日本語での不要な空間的曖昧さを避けられる。
  revised_text: 彼らは教会の集まりの前で、あなたの愛について証ししました。あなたは、彼らを神にふさわしい仕方で旅に送り出すなら[a]、よいことをするでしょう。
  revised_footnotes:
  - marker: a
    text: 「旅を援助する」とも訳せる。この語には、旅を続けるために必要なものを与えて送り出す意味が含まれることがある。
    reason: lexical_alternative
  revision_rationale: 証言の内容と公的な場面を保ちつつ、「教会」を建物と誤解しうる表現から共同体の集まりを指す表現へ改めた。後半は、条件的な日本語構文を維持しながらも、「よいことをするでしょう」により καλῶς ποιήσεις の未来形と丁寧な勧告・称賛の力を回復した。脚注の位置と内容は原語 προπέμπω の語義の幅に適切に対応している。
