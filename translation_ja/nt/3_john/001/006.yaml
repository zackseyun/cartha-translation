  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: ja
  text: 彼らは教会の集まりの前で、あなたの愛について証ししました。あなたは、彼らを神にふさわしい仕方で旅に送り出すなら[a]、よいことをするでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旅を援助する」とも訳せる。この語には、旅を続けるために必要なものを与えて送り出す意味が含まれることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: 証ししました
  rationale: アオリスト直説法が示す完了した報告行為を、自然な日本語の過去形で表した。「証言した」よりも教会的文脈になじみつつ、彼らが公に伝えたという意味を保つ。
- source_word: σου τῇ ἀγάπῃ
  choice: あなたの愛について
  rationale: 与格を証しの内容・対象として取り、ガイオの示した愛を彼らが報告したことを明確かつ自然に表す。
- source_word: ἐνώπιον ἐκκλησίας
  choice: 教会の前で
  rationale: ἐνώπιονの公然性と、ἐκκλησίαが指す集まった信仰共同体を簡潔に保つ。
- source_word: καλῶς ποιήσεις
  choice: よいことです
  rationale: 未来形の丁寧な勧告・称賛の力を、日本語では条件節に続く評価表現として自然に表した。直接命令にして語調を強めすぎない。
- source_word: προπέμψας
  choice: 旅に送り出す
  rationale: 旅人を次の目的地へ送り出す意味を本文に明示した。必要な援助を与える含意はあり得るが、語だけで物質的支援を断定せず脚注に残す。
- source_word: ἀξίως τοῦ θεοῦ
  choice: 神にふさわしい仕方で
  rationale: 行為のあり方が神にふさわしいものであるべきだという基準を、現代日本語で明瞭に表す。
theological_decisions:
- issue: キリスト者のもてなしにおける προπέμπω の含意
  choice: 本文では「旅に送り出す」とし、実際的な支援の含意を脚注で示す。
  alternative: 旅に必要なものを持たせて送り出す／旅を援助する
  rationale: この語は単に別れを告げること以上に、旅の継続に必要な便宜や物資を与えることを含み得る。しかし、支援の具体的内容までは本文で限定せず、語の幅を保持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の二つの関係節は、日本語で指示対象が分かりやすいよう二文に分けた。勧告は命令形にせず、原文の丁寧で称賛的な調子を保った。
