id: 3JN.1.1
reference: 3 John 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: ja
  text: 長老から、愛するガイオへ。私はあなたを真理にあって愛しています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心から」または「真実に」とも訳せる。このギリシア語の句は、誠実な愛、福音の真理に根差した愛、あるいはその両方を表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: 長老
  rationale: 定冠詞を伴う実名詞的用法で、差出人の自称。「長老」は教会における立場や身分の含みを保ちつつ、過度に専門的な教会用語を持ち込まない自然な訳。
- source_word: Γαΐῳ
  choice: ガイオ
  rationale: ギリシア語名を日本語聖書で一般的な形に音写した。
- source_word: τῷ ἀγαπητῷ
  choice: 愛する
  rationale: 受取人への温かな呼びかけを自然な日本語で表し、後続するἀγαπῶとの語彙的なつながりも保つ。
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: 私はあなたを…愛しています
  rationale: 関係代名詞の先行詞ガイオを日本語では「あなた」と受け、明示されたἐγώの軽い強調を「私は」で表した。
- source_word: ἐν ἀληθείᾳ
  choice: 真理にあって
  rationale: 単なる副詞「心から」と断定せず、ヨハネ文書における「真理」の神学的な響きと、誠実に愛するという含みの双方を残す。
theological_decisions:
- issue: 結びのἐν ἀληθείᾳにおける「真理」の含意
  choice: 「真理にあって」とし、真理を領域・基盤として表す読みを保持する。
  alternative: 「心から」「真実に」
  rationale: この句は愛の真実さを表すとも、福音の真理に根差す愛を表すとも理解でき、両者を兼ねる可能性もある。本文で一方に限定せず、脚注で幅を示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡の簡潔さと品位を保った。「愛するガイオ」は自然な宛名表現とし、「真理にあって」により原文の曖昧さとヨハネ的な響きを保持した。
