  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: ja
  text: しかし、私は近いうちにあなたに会えることを願っています。そして、私たちは顔を合わせて[a]話すでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「口と口を向かい合わせて」。直接会って語り合うことを意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: 願っています
  rationale: 現在形が表す著者の希望を、手紙の結びにふさわしい自然な現代日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: 前節の「書き送る」ことと、直接会って話すこととの穏やかな対比を保つ。
- source_word: εὐθέως
  choice: 近いうちに
  rationale: 本来は「直ちに」も意味し得るが、訪問の文脈では時間的に間近であることを表すため、この訳が自然である。
- source_word: σε ἰδεῖν
  choice: あなたに会いたい
  rationale: 「あなたを見る」という原義を踏まえつつ、対面を期待する文脈に即した自然な表現とした。ἐλπίζωと合わせて希望を表す。
- source_word: στόμα πρὸς στόμα
  choice: 顔と顔を合わせて
  rationale: 直訳は「口と口を向かい合わせて」だが、直接対面して語ることを意味する慣用句なので、日本語で誤解のない自然な対応表現を採った。
- source_word: λαλήσομεν
  choice: 話せるでしょう
  rationale: 未来形の見通しを自然な日本語で示す。前半が希望を述べるため、断定的な「話します」よりも、期待を伴う未来として表現した。
