id: 3JN.1.12
reference: 3 John 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: ja
  text: デメトリオについては、すべての人が証ししており、真理そのものも証ししています[a]。私たちも証しします。また、あなたは私たちの証しが真実であることを知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「デメトリオは、すべての人から、また真理そのものから証しされている」となります。ギリシア語は「証しする」の完了受動形で、すでに与えられ、現在も認められている証言を示します。「真理そのもの」は、デメトリオの生き方が真理にかなっていることを指すとも、より広く福音ないし真理が彼を支持していることを指すとも理解できます。
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: デメトリオ
  rationale: ギリシア語の人名を、現代日本語の聖書で自然な形に音写した。
- source_word: μεμαρτύρηται
  choice: よい証しを受けています
  rationale: 完了受動形が示す、すでに確立して現在も有効な評価を自然な日本語で表した。「よい」は語彙上明示されないが、推薦という文脈から証言の肯定的性格を示す。直訳的な受動表現は脚注に残した。
- source_word: ὑπὸ πάντων
  choice: すべての人から
  rationale: 受動構文における証言の主体を示し、πάντωνの包括的な範囲を保った。
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: 真理そのものからも
  rationale: αὐτῆςの強意を「そのもの」で表し、「真理」を福音や生き方に限定せず、ヨハネ文書における豊かな含意を保った。
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: 私たちも証しします
  rationale: δέの弱い接続性とἡμεῖςの強調を、自然な追加表現「も」で表した。
- source_word: οἶδας
  choice: あなたは知っています
  rationale: 形は完了形だが、コイネー・ギリシア語では現在の認識状態を表すため、現在形で訳した。
- source_word: ἡ μαρτυρία ἡμῶν
  choice: 私たちの証し
  rationale: 同節のμαρτυρέωとの語根上のつながりを「証し」で保った。
- source_word: ἀληθής ἐστιν
  choice: 真実である
  rationale: 先のἀλήθειαとの意味上のつながりを保ちつつ、述語として自然な日本語にした。
theological_decisions:
- issue: 「真理そのもの」が何を意味するか
  choice: 「真理そのもの」という表現を保持する
  alternative: 「福音そのもの」、または「彼の真理にかなった生活」
  rationale: この句は、デメトリオの生活が真理に合致しているため真理が彼を証しするとも、より広く福音・真理そのものが彼を支持するとも理解できる。本文では一つに限定せず、ヨハネ的な神学的含意と曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「証し」を反復して原文のμαρτυρέω／μαρτυρίαの連関を示した。本文の「よい」は推薦的文脈を自然に伝える補足であり、原文に形容詞がないことは脚注の直訳で明示した。
