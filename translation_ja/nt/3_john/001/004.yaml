  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: ja
  text: 私の子どもたちが真理のうちを歩んでいると聞くこと以上に、大きな喜びは私にはありません。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「これらのことより大きな喜びを、私は持っていません」。
    reason: lexical_alternative
  - marker: b
    text: 「私の子どもたち」は、おそらく筆者が信仰面で世話をしていた人々、すなわち信者たちを指します。
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν τούτων ... χαράν
  choice: これ以上に大きな喜び
  rationale: 比較級と比較の属格を自然な日本語で表しつつ、τούτωνの複数形を逐語的に「これらのこと」とせず、後続内容を受ける表現とした。
- source_word: ἵνα ἀκούω
  choice: …と聞くこと
  rationale: ここでἵναは厳密な目的よりも、その喜びを成り立たせる内容を示すと理解し、自然な名詞節で訳した。
- source_word: τὰ ἐμὰ τέκνα
  choice: 私の子どもたち
  rationale: 霊的な子どもを指す可能性が高いが、本文では親子の比喩を保ち、解釈を限定しなかった。
- source_word: ἐν τῇ ἀληθείᾳ
  choice: 真理のうちを
  rationale: ヨハネ文書における教えとしての真理と、それに即した生き方の双方を含み得る幅を保った。
- source_word: περιπατοῦντα
  choice: 歩んでいる
  rationale: 生活態度を表す比喩を保持し、日本語の聖書表現としても理解できる形にした。
theological_decisions:
- issue: τέκναが実子か霊的な子どもか
  choice: 本文では「私の子どもたち」とする
  alternative: 「私の霊的な子どもたち」または「私が信仰に導いた人たち」
  rationale: 文脈上は牧会的な関係にある信徒を指す可能性が高いが、ギリシア語の家族的比喩を本文に残した。
- issue: ἐν τῇ ἀληθείᾳの意味
  choice: 「真理のうちを」とする
  alternative: 「真実に」「真の教えに従って」
  rationale: 誠実な行動だけ、または正しい教理だけに狭めず、ヨハネ文書に見られる両面の緊張を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「歩む」「真理のうち」という原文の比喩と神学的含意を保ちながら、二文に分けて日本語として読みやすくした。
