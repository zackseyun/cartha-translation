source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: ja
  text: 愛する人よ。あなたのたましい[a]が栄えているのと同じように、あなたがあらゆる面で[b]栄え、健康であるように祈っています。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「命」「あなた自身」。ψυχήは文脈により、人の内面、命、自己などを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「すべてのことについて」。伝統的に「何よりも」とも訳されるが、ギリシア語は優先順位よりも願いの及ぶ範囲を表すと読むのが自然である。
    reason: alternative_reading
  - marker: c
    text: 別訳「すべてのことについて、あなたが栄え、健康であるように祈っています」。
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: 愛する者よ
  rationale: 愛情のこもった単数呼格であり、ἀγάπηと同系の語であることが伝わる表現とした。「親愛なる友よ」も自然だが、原文に明示されない「友」を補わない。
- source_word: περὶ πάντων
  choice: あらゆる面で
  rationale: 優先順位を示す「何よりも」ではなく、願いの及ぶ範囲を表す句として訳した。
- source_word: εὔχομαί
  choice: 祈っています
  rationale: 書簡の挨拶における祈り・願いを表す。現在形の継続的な響きも自然に示せる。
- source_word: εὐοδοῦσθαι / εὐοδοῦταί
  choice: 栄え／栄えている
  rationale: 同じ動詞の反復を日本語でも保ち、物事が順調に運ぶことや健全に繁栄することを表した。物質的な富だけに限定しない。
- source_word: ὑγιαίνειν
  choice: 健康である
  rationale: この文脈では身体の健康を指すと読むのが自然であり、明瞭な現代日本語とした。
- source_word: ψυχή
  choice: たましい
  rationale: 「命」「自己」「内なる人」などの意味領域を持つが、ここでは外的・身体的な健やかさと対照される内面を示す語として「たましい」を採用した。詳細な人間論は訳文に持ち込まない。
theological_decisions:
- issue: περὶ πάντων の係り方
  choice: 願いの範囲を示す「あらゆる面で」
  alternative: 「何よりも」または「すべてのことについて」
  rationale: 原文は優先順位よりも範囲を表すと読むのが自然である。「すべてのことについて、私は祈る」という係り方の可能性は注で残した。
- issue: εὐοδοῦσθαι の繁栄の意味
  choice: 人の歩みや営みが広く「栄える」こと
  alternative: 経済的に豊かになることだけを指す
  rationale: 語は広く物事が順調に運ぶことを表し、この一節だけから物質的繁栄を保証する教理を読み込まない。
- issue: ψυχή の意味
  choice: たましい
  alternative: 命／内なる人／自己
  rationale: 身体の健康との対比を保ちながら、ψυχήについて特定の体系的人間論を確定しない訳語を選んだ。
translation_notes:
  register: 明瞭で現代的ながら、書簡の温かさと品位を保つ文体。「愛する者よ」は日常会話より荘重だが、原文の愛情深い呼びかけと語彙上のつながりを保つために採用した。「栄える」は経済的成功に限定せず、生活や歩みが順調であるという広い意味で用いる。
