id: 3JN.1.8
reference: 3 John 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: ja
  text: ですから、私たちはこのような人たちを迎え入れる[a]べきです。それは、私たちが真理のための同労者[b]となるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「迎え入れる」と訳した語には、歓迎して世話をし、必要な物質的支援を与えるという意味も含まれます。
    reason: lexical_alternative
  - marker: b
    text: 別の理解としては、「真理とともに働く者」または「真理にあって同労者」とすることもできます。ギリシア語の与格には複数の取り方が可能ですが、本文では真理の働きを支えるという意味に訳しました。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 明示された代名詞の強調を保ち、前節の旅する働き人たちに対して、受け入れる側が負う責任を示す。
- source_word: οὖν
  choice: ですから
  rationale: 前節の内容から導かれる結論であることを、現代日本語で自然かつ明瞭に示す。
- source_word: ὀφείλομεν
  choice: べきです
  rationale: 道徳的な義務を表しつつ、単なる命令として過度に強めない表現とした。
- source_word: ὑπολαμβάνειν
  choice: 迎え入れる
  rationale: 旅する働き人を歓迎して世話し、必要な支援を与えるという文脈上の意味を含みながら、原語の広がりを保つ。
- source_word: τοὺς τοιούτους
  choice: このような人たち
  rationale: 前節までに述べられた種類の働き人を指す。性別を不必要に限定せず、自然な日本語とした。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 受け入れる目的または結果を明瞭に示す。
- source_word: συνεργοὶ
  choice: 働く同労者
  rationale: 共同で務めに携わる意味を保つ。「同労者」だけでは現代の一般読者にやや分かりにくいため、「働く」を添えた。
- source_word: γινώμεθα
  choice: 私たちが…となる
  rationale: γίνομαιの「なる、そういう者となる」という変化・参与のニュアンスを保持する。
- source_word: τῇ ἀληθείᾳ
  choice: 真理のために
  rationale: 与格を、真理の働きや前進を支える利益・目的の意味に取った。ただし「真理とともに」「真理にあって」という解釈も可能なので脚注に残した。
theological_decisions:
- issue: συνεργοὶ γινώμεθα τῇ ἀληθείᾳ における与格 τῇ ἀληθείᾳ の意味
  choice: 「真理のために働く同労者となる」—真理の働きに参与し、その前進を支える意味
  alternative: 「真理とともに働く者となる」、または「真理にあって同労者となる」
  rationale: 直前の文脈では、御名のために出て行った働き人を支援することが語られている。そのため、支援する者も真理の働きに参与するという目的・利益の意味が最も自然である。一方、ギリシア語の与格が持つ genuine な曖昧さは脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用い、短い書簡の勧告としての品位を保った。「同労者」は聖書的文脈で定着した語だが、一般読者にも意味が伝わるよう「働く」を添えた。脚注記号は、それぞれが説明する語句の直後を含む文末に配置した。
