id: 3JN.1.11
reference: 3 John 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: ja
  text: 愛する者よ、悪いことをまねしないで、良いことをまねなさい。善を行う者は神から出た者です。悪を行う者は、神を見たことがありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「善を行い続ける者……悪を行い続ける者」とも訳せる。ギリシャ語の現在分詞は、継続的な実践や、その人に特徴的な行いを示すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: 愛する者よ
  rationale: 単数呼格の親愛に満ちた呼びかけ。ヨハネ文書らしい温かさを保ちつつ、現代日本語として格調ある表現とした。
- source_word: μὴ μιμοῦ ... ἀλλὰ
  choice: …をまねず、…をまねなさい
  rationale: μιμέομαι の模倣・見倣いという意味を直接表し、悪い模範と良い模範との対照を明確にした。
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: 悪いこと／良いこと
  rationale: 冠詞付き中性形容詞の実質名詞的用法を、一般的な倫理的範疇として自然な日本語で表した。
- source_word: ὁ ἀγαθοποιῶν
  choice: 善を行う者
  rationale: 現在分詞の実質名詞的用法。継続的または特徴的な行いを含み得る簡潔な表現とした。
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: 神から出た者である
  rationale: ἐκ の起源・源を示す力を保ち、ヨハネ文書における『神から』という関係表現を明示した。
- source_word: ὁ κακοποιῶν
  choice: 悪を行う者
  rationale: ὁ ἀγαθοποιῶν と平行する現在分詞として、継続的または特徴的な行為という含みを保った。
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: 神を見たことがありません
  rationale: ὁράω の完了形を字義に沿って表し、『神を知らない』と解釈的に言い換えず、ヨハネ的な表現を保持した。
theological_decisions:
- issue: 行いと神との関係を述べるヨハネ的定式
  choice: 善を行う者は『神から出た者』、悪を行う者は『神を見たことがない』と、本文固有の範疇で表現する。
  alternative: これを再生、完全主義、または過去を含む神との関係の全面的欠如という体系神学的命題に置き換える。
  rationale: ギリシャ語は道徳的行為を神との関係の徴として強く述べるが、後代の教派的定式までは明示しない。警告の強さと神学的緊張をそのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、親愛の呼びかけと倫理的勧告にふさわしい格調を保った。後半は一般的・格言的な断定として訳し、原文の平行構造を維持した。
