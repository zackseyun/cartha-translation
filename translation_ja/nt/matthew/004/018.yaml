reference: Matthew 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: ja
  text: イエスは、ガリラヤ湖のほとりを歩いておられたとき、二人の兄弟、ペテロと呼ばれるシモンと、その兄弟アンデレが、湖に投げ網[a]を打っているのをご覧になった。二人は漁師だったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「網」。ギリシア語は、漁のために投げる網を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: 歩いておられたとき
  rationale: 現在分詞が主動詞と同時進行の動作を表すため、自然な日本語の時を示す従属節で表現した。
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: ガリラヤ湖のほとり
  rationale: παρά＋対格が沿って、またはそばでの移動を示す。「ガリラヤ湖」は日本語で定着した地名であり、地理的にも自然である。
- source_word: εἶδεν
  choice: ご覧になった
  rationale: 単純な知覚を表す語義を保ちつつ、イエスについての日本語聖書本文にふさわしい敬意ある語調とした。
- source_word: δύο ἀδελφούς
  choice: 二人の兄弟
  rationale: ここではシモンとアンデレという実の男性きょうだいを指すため、「兄弟」が正確で自然である。
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: ペテロと呼ばれるシモン
  rationale: λεγόμενον の受動的な意味を保ちながら、現代日本語で自然な連体修飾にした。
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: その兄弟アンデレ
  rationale: アンデレとシモンの関係を示す同格表現を簡潔に再現した。
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: 湖に投げ網を打っている
  rationale: ἀμφίβληστρον は投げて魚を捕る網を指す。「投げ網を打つ」は漁の動作を自然かつ具体的に伝える。εἰς の方向性は「湖に」で表した。
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: 二人は漁師だったのである
  rationale: γάρ の説明的なつながりを「のである」で示し、代名詞の指示対象を「二人」として明確にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文としての格調を保った。主語の「イエス」は直前の文脈から補い、敬語は過度に重くせず「歩いておられた」「ご覧になった」とした。本文では網の種類を具体的に訳し、別の簡潔な訳を脚注に示した。
