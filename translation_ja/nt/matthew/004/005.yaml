id: MAT.4.5
reference: Matthew 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: ja
  text: その時、悪魔はイエスを聖なる都[a]へ連れて行き、神殿の突端[b]に立たせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、エルサレム。
    reason: cross_reference
  - marker: b
    text: 別訳「神殿の翼」または「神殿域の最も高い所」。ギリシア語は、建物から張り出した端や高い地点を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を示す時間的・連続的な副詞として、自然な現代日本語にした。
- source_word: παραλαμβάνει
  choice: 連れて行き
  rationale: 歴史的現在による生き生きした叙述であり、文脈上は同行させて移動する意味。日本語では一連の出来事を自然に表すため連用形とした。
- source_word: αὐτόν
  choice: イエスを
  rationale: 日本語で「彼を」とすると指示対象が不自然または曖昧になりやすいため、直前の文脈上の指示対象を明示した。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: この文脈では人格的存在の呼称として用いられており、日本語で定着した訳語を採用した。
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: 聖なる都へ
  rationale: 移動先を表す εἰς を「へ」で示し、固有名に置き換えず、原文の尊称的表現を保持した。
- source_word: ἔστησεν
  choice: 立たせた
  rationale: 他動詞的・使役的用法であり、悪魔がイエスをその場所に立たせたことを明確にした。
- source_word: ἐπὶ τὸ πτερύγιον
  choice: 突端に
  rationale: πτερύγιον は字義的には翼、小翼、張り出した端を指し得る。特定の最高地点と断定せず、建造物の張り出した端という可能性を保つ訳語を選んだ。
- source_word: τοῦ ἱεροῦ
  choice: 神殿の
  rationale: ἱερόν は内陣だけでなく神殿域・神殿複合体を広く指すが、本文では自然で定着した「神殿」を用いた。
theological_decisions:
- issue: 「聖なる都」の特定
  choice: 本文では「聖なる都」を保持し、脚注でエルサレムと示す。
  alternative: 本文で「エルサレム」とする。
  rationale: 原文は固有名ではなく尊称的な表現を用いているため、その語感を残しつつ読者の理解を脚注で助ける。
- issue: πτερύγιον τοῦ ἱεροῦ の建築上の指示対象
  choice: 「神殿の突端」と訳し、脚注で「翼」「最も高い所」の可能性を示す。
  alternative: 「神殿の頂」「神殿の屋根の端」「神殿域の最も高い所」とする。
  rationale: 正確な建築箇所は確定できない。「突端」は張り出した端という語義を自然に伝え、特定の最高地点に限定しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保った。「イエス」は日本語で代名詞の指示が不明瞭になるのを避けるため補った。歴史的現在は、日本語で不自然な現在形を強制せず、物語叙述として自然な過去形にした。
