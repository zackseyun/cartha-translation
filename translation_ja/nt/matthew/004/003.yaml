  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: ja
  text: すると、誘惑者が近づいて、イエスに言った。「もしあなたが神の子なら[a]、これらの石がパンになるように言いなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたは神の子なのだから」とも理解できる。ギリシア語の条件文は、単純な疑いではなく、挑発として用いられている可能性がある。
    reason: alternative_reading
  - marker: b
    text: 原文の「パン」は複数形で、「複数のパン」または「パンの塊（ローフ）」を指しうる。日本語では通常、単に「パン」と言う。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 近づいて来て
  rationale: イエスのもとへ接近する動きを自然な現代日本語で表し、主動詞「言った」に先立つ分詞の働きも保つ。
- source_word: ὁ πειράζων
  choice: 誘惑する者
  rationale: 文脈ではイエスを誘惑している者を指す。固定的な呼称「誘惑者」よりも、現在分詞の動的な含みが伝わりやすい。
- source_word: Εἰ
  choice: もし…なら
  rationale: 条件文の形を保ち、疑い、挑発、既知の事実を踏まえた挑戦のいずれかに限定しない。
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: 神の子
  rationale: 無冠詞の述語名詞だが、マタイの文脈ではイエスを特定する称号である。日本語では「神の子」が自然で、定・不定を不必要に補わない。
- source_word: εἰπὲ ἵνα
  choice: …になれと言いなさい
  rationale: λέγωの語義を「命じる」と強めず、ἵνα節の内容を日本語の直接的な発話表現として自然に示す。
- source_word: οἱ λίθοι οὗτοι
  choice: これらの石
  rationale: 指示詞の強調を保ち、λίθοςを標準的に「石」と訳す。
- source_word: ἄρτοι γένωνται
  choice: パンになれ
  rationale: γίνομαιを「なる」で直接に表す。ἄρτοιは複数形だが、日本語の「パン」は通常、単複を形態上区別せず自然に総称できる。
theological_decisions:
- issue: 条件節 Εἰ υἱὸς εἶ τοῦ θεοῦ の力
  choice: 「もしあなたが神の子なら」とし、条件文の形を保持する。
  alternative: 「あなたは神の子なのだから」または「本当に神の子なら」
  rationale: この条件は単純な疑念だけでなく、挑発としても機能しうる。本文では意図を決めつけず、原文の神学的緊張を残す。
- issue: 称号 υἱὸς τοῦ θεοῦ
  choice: 「神の子」
  alternative: 「神の一人の子」
  rationale: 語順上は無冠詞の述語名詞だが、物語の文脈ではイエスの身分を示す既知の称号であり、一般的な分類を意味する訳は適切でない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すると」で場面の進展を示し、「誘惑する者」は説明的ながら自然な呼称とした。発話は過度に古風な命令形を避けつつ、挑戦的な調子が伝わる表現にした。
