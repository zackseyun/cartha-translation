id: MAT.4.23
reference: Matthew 4:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: ja
  text: イエスはガリラヤ全土を巡り、彼らの会堂で教え、王国の良い知らせ[a]を告げ知らせ、民の間にあるあらゆる病気とあらゆる患いを癒やしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「王国の福音」。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: 巡り
  rationale: 未完了過去が表す継続的な巡回を、文末の「癒やしておられた」と文脈全体によって示しつつ、地域内を広く移動する意味を自然な日本語で表した。
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: ガリラヤ全土を
  rationale: 移動を表す動詞とともに用いられたἐνとὅλῃの分布的な意味を、日本語として自然な「全土を」で表した。
- source_word: διδάσκων
  choice: 教え
  rationale: 主動詞と同時に続けられた活動を、連用形によって簡潔に表した。
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: その地の会堂で
  rationale: συναγωγήをユダヤ人共同体の会堂として訳し、αὐτῶνは不自然な「彼らの」を避けつつ、ガリラヤ各地の人々に属する会堂という関係を「その地の」で示した。
- source_word: κηρύσσων
  choice: 宣べ伝え
  rationale: 公に権威をもって告げ知らせるκηρύσσωの意味を、現代日本語でも理解できる聖書的で品位ある表現にした。
- source_word: τὸ εὐαγγέλιον
  choice: 良い知らせ
  rationale: 語の基本的意味を直接伝え、教会用語に不慣れな読者にも分かりやすくした。伝統的な「福音」は脚注に示した。
- source_word: τῆς βασιλείας
  choice: 御国の
  rationale: 属格の簡潔さを保ち、ここで明示されていない「神」や「天」を本文に補わず、王的支配と国の両面を含み得る表現とした。
- source_word: θεραπεύων
  choice: 癒やして
  rationale: 文脈上、単なる世話ではなく実際の治癒を意味するため「癒やす」とした。
- source_word: πᾶσαν νόσον
  choice: あらゆる病気
  rationale: νόσοςを一般的な疾病として表し、反復されるπᾶσανの包括性を「あらゆる」で保持した。
- source_word: πᾶσαν μαλακίαν
  choice: あらゆる患い
  rationale: 病気、弱り、虚弱を含み得るμαλακίαを広めの「患い」とし、νόσοςとの並列表現を保った。
- source_word: ἐν τῷ λαῷ
  choice: 民の間の
  rationale: 癒やしが行われた範囲を自然な日本語で示し、λαόςを集合的な「民」として訳した。
theological_decisions:
- issue: εὐαγγέλιονの訳語
  choice: 良い知らせ
  alternative: 福音
  rationale: 原語の意味を透明に伝えることを優先しつつ、伝統的な用語も脚注で保持した。内容上の教理的意味は狭めていない。
- issue: τῆς βασιλείαςの指示内容
  choice: 御国の
  alternative: 神の国についての
  rationale: 本文にない「神」を明示的に補わず、属格が表し得る「御国に属する／御国についての」という幅を残した。
- issue: 癒やしの包括性
  choice: あらゆる病気とあらゆる患い
  alternative: あらゆる病と弱り
  rationale: 二度のπᾶσανを反映して包括性を保ち、νόσοςとμαλακίαを一語にまとめず、原文の並列と意味の幅を維持した。
translation_notes:
  register: 明快な現代標準日本語を基本としながら、「御国」「宣べ伝える」「民」など、文脈にふさわしい品位ある語を用いた。未完了過去の継続性は文末の「癒やしておられた」によって段落全体に及ぶ形で表現した。
