id: MAT.4.17
reference: Matthew 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: ja
  text: その時から、イエスはこう宣べ伝え始めた[a]。「悔い改めなさい[b]。天の国[c]が近づいた[d]からだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「宣べ伝えることと語ることを始めた」。ここでは後に続く言葉が宣べ伝えた内容であることを、自然な日本語で示した。
    reason: previous_rendering
  - marker: b
    text: 「立ち返りなさい」とも訳せる。心だけでなく、生き方を改めて神に向き直ることを含む。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語では「諸天の国」。マタイがしばしば用いる表現で、「国」には王としての支配という意味もある。
    reason: lexical_alternative
  - marker: d
    text: 「近くに来ている」または「近い」とも訳せる。ギリシア語の完了形は、近さがすでに到来し、その状態が続いていることを示唆する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: その時から
  rationale: 物語の新しい段階が始まることを示す時間表現として、原文の起点の意味を自然な現代日本語で保つ。
- source_word: ἤρξατο
  choice: 始めた
  rationale: 補語となる不定詞を伴う「始める」の標準的な意味を簡潔に表す。
- source_word: κηρύσσειν καὶ λέγειν
  choice: こう宣べ伝え始めた
  rationale: 公に告げ知らせるκηρύσσεινの力を「宣べ伝える」で表し、λέγεινは後続する直接話法の内容を導く「こう」によって自然な日本語に統合した。原文の二動詞は脚注に示す。
- source_word: Μετανοεῖτε
  choice: 悔い改めなさい
  rationale: 考えだけでなく、生き方を神に向け直すよう求める命令を、定着した明瞭な日本語で表す。
- source_word: ἤγγικεν
  choice: 近づいた
  rationale: 完了形が示す、近い状態がすでに到来し現在も効力を持つという含みを保持する。「近くに来ている」も可能だが、本文では簡潔さを優先した。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を自然な日本語で保つ。βασιλείαには領域だけでなく王としての支配という意味もあるため、その幅を脚注で示す。
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶνの訳し方
  choice: 天の国
  alternative: 天の支配／諸天の国
  rationale: マタイ固有の言い回しを保ちつつ、現代日本語として理解しやすくした。「国」が場所だけを意味すると限定せず、神の王としての支配という語義も脚注で保持する。
- issue: Μετανοεῖτεの意味の幅
  choice: 悔い改めなさい
  alternative: 立ち返りなさい／心を改めなさい
  rationale: 単なる知的な意見変更にも、特定教派の悔悛理解にも狭めず、心と生き方の転換を求める命令として訳した。
- issue: ἤγγικενの完了形の力
  choice: 近づいた
  alternative: 近くに来ている／近い
  rationale: 神の国の近さが到来し、その状態が続いているという完了形の緊張を残した。到来が完全に成就したとも、単に未来に近いだけとも断定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。イエスにだけ敬語を加えることは避け、語りの文体を一貫して簡潔にした。「宣べ伝える」は聖書日本語として定着しているが、一般読者にも文脈から理解できる表現である。
