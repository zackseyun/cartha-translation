id: MAT.4.25
reference: Matthew 4:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: ja
  text: そして、ガリラヤ、デカポリス、エルサレム、ユダヤ、さらにヨルダン川の向こう側[a]から来た大勢の群衆が、イエスについて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨルダン川の対岸」。
    reason: πέραν τοῦ Ἰορδάνουは、ヨルダン川の向こう側にある地域、または川を隔てた対岸を指し得るため。
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスについて行った
  rationale: ἀκολουθέωの物理的に後について行く意味を自然な現代日本語で表しつつ、この時点で群衆全員が確立した弟子になったとは言い切らない表現とした。代名詞は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: ὄχλοι πολλοὶ
  choice: 大勢の群衆
  rationale: 多数の人々からなる群衆を、簡潔で自然な日本語で表す。
- source_word: ἀπὸ
  choice: から来た
  rationale: 列挙された各地域が群衆の出身地・来訪元であることを明確にし、日本語として修飾関係が分かりやすくなるよう「来た」を補った。
- source_word: Γαλιλαίας
  choice: ガリラヤ
  rationale: 地域名の標準的な日本語表記。
- source_word: Δεκαπόλεως
  choice: デカポリス
  rationale: 「十の町」を意味する固有の地域名として音写を採用し、原文の地理的呼称を保持した。
- source_word: Ἱεροσολύμων
  choice: エルサレム
  rationale: 地名の標準的な日本語表記。ギリシア語では複数形だが、日本語では通常どおり単数の固有名詞として扱う。
- source_word: Ἰουδαίας
  choice: ユダヤ
  rationale: 地域名の標準的な日本語表記。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ヨルダン川の向こう側
  rationale: ヨルダン川を基準とした対岸・彼方の地域という空間的意味を保持した。「川」を補って現代の一般読者に明瞭にした。
- source_word: καὶ ... καὶ ... καὶ
  choice: 、…、…、…、さらに…
  rationale: 日本語で不自然な「と」の反復は避けながら、最後の「さらに」により累積的な地理的広がりを表した。
theological_decisions:
- issue: ἀκολουθέωが弟子として従うことを含意するか
  choice: ついて行った
  alternative: 従った
  rationale: 群衆がイエスの後について行ったという物理的意味と、弟子としての関心へ発展し得る含みを残しつつ、群衆全員の信仰的献身を断定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い地名列挙を先にまとめ、「から来た大勢の群衆」を後置して読みやすくした。デカポリスは歴史的な固有地域名として音写し、説明的な訳語を本文に持ち込まなかった。
