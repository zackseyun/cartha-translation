lexical_decisions:
- source_word: Γῆ / γῆ
  choice: 地
  rationale: 地理的領域を指す語として自然であり、二度の反復も保った。
- source_word: Ζαβουλὼν
  choice: ゼブルン
  rationale: 日本語聖書で広く通用する部族名・地名の表記を用いた。
- source_word: Νεφθαλίμ
  choice: ナフタリ
  rationale: 日本語聖書で広く通用する部族名・地名の表記を用いた。
- source_word: ὁδὸν θαλάσσης
  choice: 海への道
  rationale: イザヤ書引用の簡潔な表現を保ち、特定の街道または海に関係する地域という含みを狭めないようにした。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ヨルダン川の向こう
  rationale: 地理的な視点を過度に限定せず、現代日本語で分かりやすく表した。日本語で地名として明確になるよう「川」を補った。
- source_word: Γαλιλαία
  choice: ガリラヤ
  rationale: 日本語で定着している地域名の表記を用いた。
- source_word: τῶν ἐθνῶν
  choice: 異邦人の
  rationale: このユダヤ的文脈では非ユダヤ人との対比を表す可能性が高い。「諸国民の」という語義上可能な訳は脚注に残した。
theological_decisions:
- issue: イザヤ書引用における ἐθνῶν の訳
  choice: 異邦人
  alternative: 諸国民
  rationale: マタイの文脈では、非ユダヤ人との民族的・宗教的対比が前面に出る。「諸国民」も可能なので脚注で示し、意味の幅を保持した。
