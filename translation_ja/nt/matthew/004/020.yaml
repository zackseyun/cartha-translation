  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: ja
  text: すると二人は、すぐに網を後にして、イエスに従った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: すると
  rationale: 弱い接続辞として物語を先へ進める働きを、自然な現代日本語で表す。強い対比は加えない。
- source_word: εὐθέως
  choice: すぐに
  rationale: 二人の応答の即時性を、明快で自然な日本語で保つ。
- source_word: ἀφέντες
  choice: 置いて
  rationale: 網をその場に残したことを自然に表し、文脈以上に強い「捨てる」「放棄する」は避ける。分詞の動作が主動詞に先立つことも語順で示す。
- source_word: τὰ δίκτυα
  choice: 網
  rationale: 直前の漁の文脈から漁網であることは明らかなので、説明を加えず簡潔に訳す。ギリシア語の定冠詞は日本語では明示しないのが自然。
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスに従った
  rationale: ἀκολουθέωの、物理的について行く意味と弟子として従う含みの両方を保つ。「彼」ではなく「イエス」として日本語で指示対象を明確にする。
theological_decisions:
- issue: ἠκολούθησαν αὐτῷ における弟子としての含意
  choice: イエスに従った
  alternative: イエスのあとについて行った
  rationale: 「従った」は実際について行く行為と弟子として身を寄せる意味の広がりを保つ。より物理的な意味に限定されやすい訳は採らない。
translation_notes:
  register: 明快で現代的かつ品位ある物語文。「すると」で前節の呼びかけへの即時の応答を自然につなぎ、「すぐに」を明示して原文の強調を保った。
