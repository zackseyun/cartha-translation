  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: ja
  text: 二人はすぐに舟と父親を残し、イエスに従った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 二人は
  rationale: 直前に言及された兄弟二人を指す実質的な冠詞を「二人」と明示した。δέは弱い物語接続であり、日本語では無理に訳語を置かないほうが自然である。
- source_word: εὐθέως
  choice: すぐに
  rationale: 応答の迅速さを明確に伝える、自然で現代的な表現。
- source_word: ἀφέντες
  choice: 残して
  rationale: 主動詞「従った」に先立つ行為を自然に表す。「捨てて」では永続的放棄の含みが強くなり得るため避けた。
- source_word: τὸ πλοῖον
  choice: 舟
  rationale: ガリラヤ湖の漁に用いる船を指す文脈に合い、聖書本文としても自然な語を選んだ。
- source_word: τὸν πατέρα αὐτῶν
  choice: 父親
  rationale: 二人に共通する父を明瞭に表す。主語を「二人」としたため、所有表現を重ねずとも関係は明らかである。
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスに従った
  rationale: ἀκολουθέωが持つ実際について行く意味と弟子として従う含意をともに保つ。日本語では代名詞「彼」より、指示対象の「イエス」を明示するほうが自然で明瞭である。
theological_decisions:
- issue: 弟子としての即時の応答と家族からの離別
  choice: 舟と父親を「残して」イエスに従ったと訳し、決然とした即時の応答を示す。
  alternative: 舟と父親を「捨てて」従った。
  rationale: 本文は応答の迅速さと行動の決断性を強調するが、ἀφέντεςだけから父親を永久に見捨てたと断定する必要はない。「残して」は物語の力を保ちながら、過剰な神学的含意を避ける。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。原文の分詞構文は日本語の「残して」で自然に表し、文脈上の指示対象は「イエス」と明示した。
