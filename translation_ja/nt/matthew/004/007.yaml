reference: Matthew 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: ja
  text: イエスは彼に言った。「また、こう書かれている。[a]『あなたの神である主を試してはならない。』」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 申命記6章16節からの引用。
    reason: cross_reference
  - marker: b
    text: 「試してはならない」は、「試みにかけてはならない」とも訳せる。ギリシア語の動詞には、相手を試す、または試みにかけるという意味がある。引用元の申命記6章16節のヘブライ語では、ここで「主」と訳した箇所に神の名が用いられている。
    reason: lexical_alternative_and_divine_name_background
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: イエスは彼に言われた
  rationale: 単純な発話導入として自然な現代日本語にした。αὐτῷの間接目的語も「彼に」と明示している。
- source_word: Πάλιν γέγραπται
  choice: また、こう書かれている
  rationale: πάλινの反論としての追加引用の働きと、γέγραπταιの聖書引用定型および現在も有効である含みを自然に表した。
- source_word: Οὐκ ἐκπειράσεις
  choice: 試してはならない
  rationale: 未来形による禁止命令を日本語の明確な禁止表現で訳した。ἐκπειράζωは文脈上、神の真実性や力を証明させようと試すことを指すが、本文では簡潔に「試す」とした。
- source_word: κύριον τὸν θεόν σου
  choice: あなたの神である主
  rationale: κύριοςを「主」、τὸν θεόν σουを「あなたの神」とし、同格関係が明瞭になるよう「である」で結んだ。ギリシア語本文に即し、本文では「主」とした。
theological_decisions:
- issue: イスラエルの神を指す聖書引用中のκύριοςの訳し方
  choice: 主
  alternative: 主（ヤハウェ）／ヤハウェ
  rationale: 直接の原文であるギリシア語はκύριοςであり、「主」と訳す。申命記6章16節のヘブライ語では神名が用いられているという背景は脚注で示し、本文に逆輸入しない。
- issue: 神を「試す」の意味の限定
  choice: 本文では「試してはならない」とし、意味を限定しすぎない
  alternative: 神を試みにかけてはならない／神の力を試してはならない
  rationale: ἐκπειράζωには「試す」「試みにかける」の幅があるため、本文では原語の簡潔さと広がりを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用句は律法の禁止命令として簡潔にし、「あなたの神である主」で同格関係を普通の読者にも分かりやすくした。脚注記号は本文中にすべて配置した。
