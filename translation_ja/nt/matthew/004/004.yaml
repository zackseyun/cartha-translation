id: MAT.4.4
reference: Matthew 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: ja
  text: しかし、イエスは答えた。「こう書かれている。『人[a]はパンだけで生きるのではなく、神の口から出るすべてのことば[b]によって生きる。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人」は、ここでは特定の男性ではなく、人間一般を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「神の口を通って出るすべてのことば」。原文は、神の口を通してことばが発せられるという像を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: しかし、イエスは答えた
  rationale: δέの対照を「しかし」で示し、セム語的な「答えて言った」は現代日本語で自然な「答えた」とした。主語のイエスは文脈上明らかなので補った。
- source_word: Γέγραπται
  choice: こう書かれている
  rationale: 完了受動の聖書引用定型句を、書かれた内容が現在も効力を持つことを自然に表す日本語で訳した。
- source_word: ἄρτῳ μόνῳ
  choice: パンだけで
  rationale: ἄρτοςの直接的な意味「パン」を保ち、「食べ物」と広義に解釈することを避けた。
- source_word: ζήσεται
  choice: 生きる
  rationale: 未来形だが、ここでは一般的・格言的な真理を表すため、日本語では非過去形が自然である。
- source_word: ὁ ἄνθρωπος
  choice: 人
  rationale: 特定の男性ではなく人間一般を代表する単数形なので、現代日本語で包括的かつ自然な「人」とした。
- source_word: παντὶ ῥήματι
  choice: すべてのことば
  rationale: 神が発する個々の発言を指す表現として、伝統性と平明さを兼ねる「ことば」を用いた。παντίの包括性は「すべての」で示した。
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: 神の口から出る
  rationale: ἐκπορεύομαιの「出て来る」という像を保ちつつ、διά＋属格が示す通過経路を日本語で自然な発話表現「口から出る」にした。直訳的な「口を通って」は注で示す。
theological_decisions:
- issue: ὁ ἄνθρωποςの代表的男性単数
  choice: 人
  alternative: 人間／その人
  rationale: この引用は男性一人に限定されず、人間一般について述べる。性別を不必要に限定せず、原文の一般的意味を保った。
- issue: Γέγραπταιの完了形と聖書引用の権威
  choice: こう書かれている
  alternative: 書かれてある
  rationale: 引用定型句として自然であり、過去に記されたものが現在も存続しているという完了形の含みを保つ。
- issue: διὰ στόματος θεοῦの経路表現
  choice: 神の口から出る
  alternative: 神の口を通って出る
  rationale: 原文のδιάは字義的には「～を通って」だが、日本語では「口から出る」が同じ発話の像を自然に伝える。神のことばの性質について追加の神学的説明は加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、聖書引用としての格調を保った。二重引用符と句点により引用の階層を明確にした。「ことば」は硬すぎない表記として平仮名を採用した。
