  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: ja
  text: そして彼に言った。「もしひれ伏して私を拝む[a]なら、これらすべてをあなたに与えよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私にひれ伏す」または「私に敬意を表する」とも訳せる。ギリシア語の動詞は、身をかがめて敬意を示すことも意味するが、ここでは文脈上「拝む」が適切である。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な接続を保ちつつ、物語の流れを自然な現代日本語で示す。
- source_word: εἶπεν αὐτῷ
  choice: 彼に言った
  rationale: 原文は話し手と相手を代名詞だけで示しているため、固有名を補わず、その指示の仕方を保つ。
- source_word: Ταῦτά σοι πάντα δώσω
  choice: これらすべてをあなたに与えよう
  rationale: 指示代名詞の複数性と πάντα の包括性を保ち、未来形による申し出を自然な日本語で表す。
- source_word: ἐὰν
  choice: もし…なら
  rationale: 条件を明示する最も平明な現代日本語である。
- source_word: πεσὼν
  choice: ひれ伏して
  rationale: 礼拝に伴う具体的な身体動作を表すアオリスト分詞の意味を、簡潔で自然な日本語にする。
- source_word: προσκυνήσῃς μοι
  choice: 私を拝む
  rationale: この誘惑の文脈と次節の応答から宗教的な礼拝の含意が強いため「拝む」とした。ただし、語自体が敬意を示して身をかがめる行為も表し得ることは脚注に残す。
theological_decisions:
- issue: サタンがイエスに求める προσκυνέω の訳し方
  choice: 私を拝む
  alternative: 私にひれ伏す／私に敬意を表する
  rationale: 直後の節では神だけに向けるべき礼拝が問題とされるため、単なる政治的服従や敬意ではなく、要求の宗教的重大さを本文に示す。一方で語の意味範囲は脚注で保持する。
translation_notes:
