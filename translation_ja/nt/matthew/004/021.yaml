id: MAT.4.21
reference: Matthew 4:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: ja
  text: そこからさらに進んで行かれ、イエスはほかの二人の兄弟、ゼベダイの子ヤコブとその兄弟ヨハネが、父ゼベダイと一緒に舟の中で網を繕っているのをご覧になり、二人をお呼びになった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: そこからさらに進んで行かれると
  rationale: 場所を離れて先へ進むという分詞の意味を保ちつつ、日本語の物語として自然につないだ。主語は文脈上イエスであり、現代の聖書文体にふさわしい敬語を用いた。
- source_word: εἶδεν
  choice: ご覧になり
  rationale: 単純な『見る』を過度に『気づく』などと強めず、イエスを主語とする日本語として自然な敬語で表した。
- source_word: ἄλλους δύο ἀδελφούς
  choice: ほかの二人の兄弟
  rationale: 直前の兄弟に加わる別の一組であることと、人数の二人を明示した。
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: ゼベダイの子ヤコブ
  rationale: ギリシア語の父称的な属格を、日本語で明確かつ慣用的に表した。
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: その兄弟ヨハネ
  rationale: αὐτοῦがヤコブを指し、ヨハネがその兄弟であることを簡潔に示した。兄か弟かは原文が特定しないため、『兄』『弟』とは訳し分けない。
- source_word: ἐν τῷ πλοίῳ
  choice: 舟の中で
  rationale: 漁の場面に適した小型船を示す語として『舟』を選び、位置を明示する『中で』を添えた。
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: 父ゼベダイと一緒に
  rationale: μετάの同伴関係と、ゼベダイが二人の父であることを自然な日本語で示した。
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: 網を繕っている
  rationale: 漁網を使用できる状態に整える文脈上の意味を、自然で具体的な『繕う』で表した。日本語では所有者が明白なので『自分たちの』は省略した。
- source_word: ἐκάλεσεν αὐτούς
  choice: 二人をお呼びになった
  rationale: 目的語が兄弟二人であることを明確にしつつ、原文にない『従うように』は補わず、καλέωの簡潔な表現を保った。
theological_decisions:
- issue: ἐκάλεσενが含意する弟子への召し
  choice: 『二人をお呼びになった』とし、何のために呼んだかは明記しない。
  alternative: 『二人に従うようお呼びになった』
  rationale: 文脈では弟子としての召しだと理解できるが、この節自体には目的句がない。原文の簡潔さを保ち、含意を訳文へ付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、福音書の叙述にふさわしい落ち着いた敬体的尊敬表現を採用した。固有名は日本語聖書で広く定着した『ゼベダイ』『ヤコブ』『ヨハネ』とした。注を必要とする本文上・語義上の重大な異読や不可避の曖昧さはないため、脚注は付していない。
