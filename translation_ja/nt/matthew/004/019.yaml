reference: Matthew 4:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: ja
  text: そしてイエスは彼らに言われた。「わたしの後について来なさい。あなたがたを人を捕る漁師にしよう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「人々の漁師」。ここで「人」は男性だけでなく、人間一般を指す。
    reason: ギリシア語の属格表現と、ἀνθρώπωνが人間一般を指す意味範囲を明確に示すため。
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語を生き生きと語る歴史的現在形だが、日本語では過去形が自然であり、発話の敬意を示すため「言われた」とした。
- source_word: Δεῦτε ὀπίσω μου
  choice: わたしの後について来なさい
  rationale: Δεῦτε（来なさい）とὀπίσω μου（わたしの後に）を一つの自然な弟子への呼びかけとして訳し、単なる移動ではなく従うという含意も保った。
- source_word: ποιήσω ὑμᾶς
  choice: あなたがたを…にしよう
  rationale: 未来形が表すイエスの約束と主体的な働きを、簡潔な意志・約束の表現で示した。
- source_word: ἁλιεῖς ἀνθρώπων
  choice: 人を捕る漁師
  rationale: ギリシア語の比喩を保ちつつ、日本語として自然な目的語構文にした。ἀνθρώπωνは男性だけでなく人間一般を指すため、包括的な「人」とした。
theological_decisions:
- issue: 「人を捕る漁師」という比喩の解釈
  choice: 比喩を説明せず、そのまま保持する
  alternative: 人々を弟子にする者
  rationale: この句は弟子たちの将来の使命を示すが、その具体的内容を訳文で限定せず、漁師への呼びかけと結びついた原文の比喩と余韻を保った。
- issue: ἀνθρώπωνの指示範囲
  choice: 人
  alternative: 男たち
  rationale: ここでἄνθρωποςの複数形は性別を限定せず、人間一般を指す。現代日本語の「人」がその意味を明瞭かつ自然に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準語。イエスの発話には自然な権威を感じさせる「来なさい」「しよう」を用い、伝統的な比喩表現を分かりやすく保持した。
