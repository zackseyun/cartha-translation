source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: ja
  text: そして、イエスについてのうわさはシリア全土に広まった。人々は、病気の人を皆、すなわち、さまざまな病気や苦痛に悩まされている人、悪霊に苦しめられている人、発作を起こす人[b]、体が麻痺した人を、イエスのもとに連れて来た。イエスは彼らを癒やした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ギリシア語は字義的には「月の影響を受ける者」。伝統的に「てんかんの者」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: 評判
  rationale: ここではイエスについて人々が聞き、広く伝えた内容を指す。「知らせ」も可能だが、人物について広がる評価を含み得る「評判」が自然である。
- source_word: ἀπῆλθεν
  choice: 広まった
  rationale: 直訳的には「出て行った」だが、評判を主語とする日本語では「広まった」が自然で、移動・伝播の比喩を明確に表す。
- source_word: ὅλην τὴν Συρίαν
  choice: シリア全土
  rationale: 地域全体を表す簡潔で現代的な地名表現。
- source_word: κακῶς ἔχοντας
  choice: 病気の人
  rationale: 直訳は「具合の悪い者たち」だが、文脈上は病む人々を広く指す慣用句である。
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: さまざまな病気や苦痛に悩まされている者
  rationale: συνέχωの拘束・圧迫の含みと、βάσανοςの強い苦痛を、過度に字義的にならない自然な日本語で表した。
- source_word: δαιμονιζομένους
  choice: 悪霊に苦しめられている者
  rationale: 悪霊による現実の作用を保持しつつ、「取りつかれた」という一段狭い状態だけに限定しない表現とした。
- source_word: σεληνιαζομένους
  choice: 発作を起こす者
  rationale: 月との語源的関連を現代の病因説明として採用せず、文脈上想定される発作症状を分かりやすく示す。語の字義と伝統的訳は脚注に残す。
- source_word: παραλυτικούς
  choice: 体の麻痺した者
  rationale: 現代日本語で明瞭かつ人格を損なわない表現。
- source_word: ἐθεράπευσεν
  choice: 癒やした
  rationale: 治療・治癒を表す標準的な聖書日本語で、文脈にも適する。
theological_decisions:
- issue: δαιμονιζομένουςが示す悪霊の作用の強さ
  choice: 悪霊に苦しめられている者
  alternative: 悪霊に取りつかれた者
  rationale: ギリシア語は悪霊の作用を明示するが、すべてを現代日本語の技術的な「憑依」概念に限定する必要はない。超自然的指示対象を弱めず、語義の幅を保った。
- issue: σεληνιαζομένουςの病態と月との関係
  choice: 発作を起こす者
  alternative: てんかんの者／月に影響された者
  rationale: 語源上は月との関連があるが、本文訳で古代的病因観を断定せず、観察される症状を示した。厳密な病名への同定も避けた。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。長い列挙は「など」を用いて総称と具体例の関係を自然に示した。英語相談層の脚注aは本文中の対応箇所と内容が食い違っているため採用せず、原語上説明を要するσεληνιαζομένουςにのみ脚注[b]を付した。
