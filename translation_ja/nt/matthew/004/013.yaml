id: MAT.4.13
reference: Matthew 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: ja
  text: そして、ナザラ[a]を後にし、ゼブルンとナフタリの地方にある海辺のカファルナウムに行き、そこに住まいを定められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「ナザラ」。一般には「ナザレ」と呼ばれる。
    reason: 本文の固有名詞のギリシア語形を保持しつつ、読者になじみ深い名称との同定を示すため。
lexical_decisions:
- source_word: καταλιπὼν
  choice: 後にして
  rationale: アオリスト分詞が主動詞に先立つ離去を表すため。現代日本語として自然であり、単に外出したのではなく、その地を離れた意味を保つ。
- source_word: Ναζαρὰ
  choice: ナザラ
  rationale: 本文のギリシア語形はΝαζαράであるため、その形を音写した。一般に知られる「ナザレ」は脚注に示した。
- source_word: ἐλθὼν
  choice: へ行き
  rationale: 移動先を示すεἰς Καφαρναούμとともに、出来事の順序を自然な日本語で表した。話者を基準にした「来て」より、ナザラからカファルナウムへの移動を明瞭にする「行き」が文脈に合う。
- source_word: κατῴκησεν
  choice: そこに住まわれた
  rationale: κατοικέωは居を定めて住むことを表す。主語であるイエスへの自然で節度ある敬意を示しつつ、居住開始の意味を伝える。
- source_word: Καφαρναοὺμ
  choice: カファルナウム
  rationale: 日本語聖書で定着している地名表記を用いた。
- source_word: τὴν παραθαλασσίαν
  choice: 湖畔の町
  rationale: ガリラヤ湖に面する場所を指すため、日本語では「海辺」より「湖畔」が地理的に明瞭である。形容語がカファルナウムを説明していることを「町」で自然に補った。
- source_word: ἐν ὁρίοις
  choice: 地域に
  rationale: ὅριαは境界、領域、地方を意味し、ここではゼブルンとナフタリに属するとされた地理的範囲を指す。「地域」は意味を限定しすぎず自然である。
- source_word: Ζαβουλὼν
  choice: ゼブルン
  rationale: 日本語で定着した旧約の部族名表記を用いた。
- source_word: Νεφθαλίμ
  choice: ナフタリ
  rationale: 日本語で定着した旧約の部族名表記を用いた。
theological_decisions: []
