  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: ja
  text: ヨハネが引き渡された[a]と聞いて、イエスはガリラヤへ退いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、より具体的には「逮捕された」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: 聞くと
  rationale: アオリスト分詞を主動詞に先立つ時を表すものとして捉え、現代日本語で自然な時間節にした。文脈上の主語であるイエスを主節に明示した。
- source_word: δὲ
  choice: 独立した語では訳出しない
  rationale: ここでは強い逆接ではなく、物語を進める軽い接続を表す。日本語では文の流れそのものによって十分に示されるため、「さて」などを加えなかった。
- source_word: Ἰωάννης
  choice: ヨハネ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: παρεδόθη
  choice: 引き渡された
  rationale: παραδίδωμι の受動形が持つ広い意味を保ち、文脈上可能な「逮捕された」だけに限定しない。
- source_word: ἀνεχώρησεν
  choice: 退いた
  rationale: 状況を受けてその場から離れるという ἀναχωρέω の含みを保ちつつ、「逃げた」のように動機を過度に限定しない表現とした。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ
  rationale: εἰς の方向性を、自然な現代日本語の助詞「へ」で表した。
theological_decisions:
- issue: ヨハネについての παραδίδωμι の訳し方
  choice: 引き渡された
  alternative: 逮捕された
  rationale: 原語は逮捕を含み得るが、それより広い意味を持ち、マタイ福音書内で「引き渡す」という響きも保つ。本文では語義の幅を残し、文脈に即した具体的な訳を脚注に示した。
translation_notes:
  register: 明快で簡潔な現代標準日本語。過度な敬語や古語を避けつつ、物語文としての落ち着いた格調を保った。
