  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: ja
  text: これは、預言者イザヤを通して語られたことが成就するためであった。次のように言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: それは〜ためであった
  rationale: 目的・結果を表すἵναを、前節とのつながりが自然になる形で示した。目的と結果のどちらか一方に限定しすぎない。
- source_word: πληρωθῇ
  choice: 実現する
  rationale: アオリスト受動接続法。聖書のことばが成就するというマタイの定型的主題を、現代日本語で明瞭に表す。
- source_word: τὸ ῥηθὲν
  choice: 語られたこと
  rationale: 冠詞付き受動分詞の名詞的用法を自然な日本語にした。
- source_word: διὰ Ἠσαΐου
  choice: イザヤを通して
  rationale: 属格を伴うδιάが示す媒介を保ち、イザヤが預言の仲介者であることを明示する。
- source_word: τοῦ προφήτου
  choice: 預言者
  rationale: イザヤの役割を示す同格表現を保持した。
- source_word: λέγοντος
  choice: すなわち、
  rationale: 後続する直接引用を導入する分詞。日本語では直訳的な「言っている」より、引用への移行を自然に示す「すなわち」が適切。
theological_decisions:
- issue: マタイにおける成就定型句
  choice: 「実現する」と訳し、聖書のことばの成就という主題を保持する。
  alternative: 「成就する」「そのとおりになる」
  rationale: 「実現する」は現代の一般読者に明瞭でありながら、単なる予言の的中以上の聖書的な成就の含みを保つ。意味を神学的に敷衍しない。
- issue: ἵνα節の目的・結果の含み
  choice: 「それは〜ためであった」
  alternative: 「こうして〜が実現した」
  rationale: 原文の目的・結果を表し得る緊張を残し、結果だけに解消しない。
translation_notes:
  register: 明瞭な現代標準日本語。本文は次節の引用へ続くため、末尾を「すなわち、」として開いた。固有名は日本語聖書で定着している「イザヤ」を用いた。
