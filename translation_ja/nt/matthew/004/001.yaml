id: MAT.4.1
reference: Matthew 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: ja
  text: それから、イエスは悪魔に誘惑されるため、霊によって荒れ野へ導き上げられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「試されるため」。ギリシア語の動詞は「誘惑する」と「試す」のどちらも意味し得るが、ここでは直近の文脈から「誘惑される」が自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: それから
  rationale: 直前の洗礼の記事に続く出来事であることを自然な現代日本語で示す時間的接続表現。
- source_word: ἀνήχθη
  choice: 導かれて……上って行かれた
  rationale: 受動の意味と、ἀνάγωが持つ上方への移動の含みをともに保つ。尊敬表現は日本語の聖書文体として自然であり、イエスを主語とする文の品位も保つ。
- source_word: εἰς τὴν ἔρημον
  choice: 荒れ野へ
  rationale: ἔρημοςは砂漠に限定されない、人里離れた荒涼とした地域を指し得るため、地形を過度に限定しない「荒れ野」とした。
- source_word: ὑπὸ τοῦ πνεύματος
  choice: 霊に
  rationale: 直前の洗礼記事に現れる神の霊を指すと理解できる。「聖」を補わず、原文どおり「霊」とすることで文脈上の同定を保つ。
- source_word: πειρασθῆναι
  choice: 誘惑されるため
  rationale: 行為者が悪魔であり、後続場面も悪への誘いとして展開するため、本文では「誘惑される」を採用する。ただし「試される」という語義も注で残す。
- source_word: ὑπὸ τοῦ διαβόλου
  choice: 悪魔に
  rationale: ここでは人格的な敵対者の呼称として用いられており、現代日本語で明確かつ定着した訳語。
theological_decisions:
- issue: τοῦ πνεύματοςが指すもの
  choice: 文脈上、神の霊を指す「霊」
  alternative: ある霊、または人間の霊
  rationale: 直前のイエスの洗礼で降った霊との物語上の連続性が強い。「聖霊」と明示的に補わず、原文の表現を保った。
- issue: πειρασθῆναιの訳し分け
  choice: 本文は「誘惑される」
  alternative: 「試される」
  rationale: 悪魔が行為者である直近の文脈から「誘惑」が自然だが、この動詞には試験・試練の意味もあるため、その神学的・語義的な緊張を注で保持する。
- issue: 目的を表す不定詞
  choice: 「誘惑されるため」
  alternative: 「誘惑されることになり」
  rationale: πειρασθῆναιは導かれたことの目的を示す形として素直に訳し、霊と悪魔それぞれの働きを本文が示す以上に説明しない。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「荒れ野」は聖書的背景を保ちつつ地形を砂漠に限定しない。「上って行かれた」により原文の方向性を残した。
