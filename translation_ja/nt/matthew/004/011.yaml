  source_fidelity: 原文の時系列（τότε）、悪魔がイエスを去ること、注意を喚起する ἰδού、天使たちが近づき、継続して奉仕したことを過不足なく伝えている。ἀφίησιν の歴史的現在を日本語の物語的過去形「離れた」としたのも適切である。
  naturalness: 「その時…すると、見よ…」はやや荘重な聖書的語り口だが、不自然ではなく、ἰδού の注意喚起を保持するための選択として明瞭である。「近寄って来て」「仕えていた」も現代標準日本語として理解可能である。
