id: MAT.4.11
reference: Matthew 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: ja
  text: その時、悪魔はイエスを離れた。すると、見よ、天使たちが近寄って来て、イエスに仕えていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「世話をしていた」とも訳せる。ギリシア語の動詞は奉仕することを表し、未完了過去形はその行為が続いていたことを示す。
    reason: 語義の別訳と動詞の継続的な相を示すため。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の時間的な進行を示す語として、自然で明確な接続表現を選んだ。
- source_word: ἀφίησιν αὐτὸν
  choice: イエスを離れた
  rationale: ἀφίησιν は歴史的現在だが、日本語の物語として自然な過去形にした。代名詞の指示対象を明確にするため「イエス」とした。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: 誘惑物語においてサタンを指す人格的呼称であり、現代日本語で定着した訳語を用いた。
- source_word: καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καί の展開機能と、ἰδού が場面への注意を促す生き生きとした力をともに残した。
- source_word: ἄγγελοι
  choice: 天使たち
  rationale: この文脈では人間の使者ではなく天的存在を指すため、「天使」とした。複数形も明示した。
- source_word: προσῆλθον
  choice: 近寄って来て
  rationale: 単なる到来だけでなく、イエスのもとへ近づく動きを自然な日本語で表した。
- source_word: διηκόνουν αὐτῷ
  choice: イエスに仕えていた
  rationale: διηκόνουν の未完了過去が示す継続的な奉仕を「仕えていた」で表した。受け手を明確にするため αὐτῷ を「イエスに」とした。
theological_decisions:
- issue: διάβολος の人格的呼称
  choice: 悪魔
  alternative: 中傷する者
  rationale: 語源的意味を前面に出すより、誘惑物語でサタンを指す定着した呼称を用いるほうが、文脈上の指示対象を正確かつ自然に伝える。
- issue: 天使たちの奉仕の内容
  choice: 仕えていた
  alternative: 世話をしていた
  rationale: 原文は奉仕の具体的内容を明示していないため、食事の提供などに限定せず、意味の幅と継続性を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「仕えていた」によって原文の注意喚起と荘重さを保った。
