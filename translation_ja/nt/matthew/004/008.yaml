  source_fidelity: ギリシア語の語順・内容を過不足なく伝えている。Πάλινを「再び」、παραλαμβάνειを文脈上自然な物語時制で「連れて行き」、εἰς ὄρος ὑψηλὸν λίανを「非常に高い山へ」とした点はいずれも適切である。πάσας τὰς βασιλείας τοῦ κόσμουは「世のすべての国々」と自然に表現され、τὴν δόξαν αὐτῶνの単数の「栄光」も集合的な意味を保っている。山上での提示の仕方を説明的に限定していない点も原文に忠実である。
