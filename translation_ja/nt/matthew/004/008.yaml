id: MAT.4.8
reference: Matthew 4:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: ja
  text: 再び、悪魔はイエスを非常に高い山へ連れて行き、世のすべての国々とその栄光[a]を見せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「栄華」。
    reason: δόξαはここで、国々の目に見える華やかさや威光を指すとも訳せるため。
lexical_decisions:
- source_word: Πάλιν
  choice: 再び
  rationale: 誘惑の出来事が繰り返し進むことを簡潔に示す、自然な現代日本語。
- source_word: παραλαμβάνει
  choice: 連れて行き
  rationale: 移動の文脈における「伴って行く」という意味を自然に表す。ギリシア語の歴史的現在は、日本語の物語として自然な過去時制で訳した。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: この文脈で固有の呼称として用いられており、一般読者にも明瞭な標準訳。
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: 非常に高い山へ
  rationale: εἰςの移動方向と、λίανによる「高い」の強調を、明快で自然な日本語にした。
- source_word: δείκνυσιν
  choice: 見せた
  rationale: 動詞の基本的な意味を過度に強めずに表す。
- source_word: πάσας τὰς βασιλείας
  choice: すべての国々
  rationale: 複数の政治的支配領域を指す意味を、現代日本語で自然に伝える。「王国」より広く理解でき、κόσμοςとの組み合わせにも適する。
- source_word: τοῦ κόσμου
  choice: 世の
  rationale: 世界全体を指すκόσμοςを、聖書本文として簡潔かつ自然に表す。
- source_word: τὴν δόξαν αὐτῶν
  choice: その栄光
  rationale: δόξαとの語彙上の対応を保ちつつ、国々に伴う威光や華やかさを表す。文脈的な訳語「栄華」は脚注に残した。
theological_decisions:
- issue: 誘惑物語における山上の場面の性質
  choice: 物語の記述どおり、悪魔がイエスを山へ連れて行き、国々を見せたと訳す。
  alternative: 物理的な山からの眺望、または幻・超自然的な提示であったと明示する。
  rationale: ギリシア語本文は、その見せ方や現象の仕組みを説明していないため、翻訳でもいずれかに限定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。主語を明示し、ギリシア語の歴史的現在は日本語の自然な物語時制で表した。代名詞αὐτόνは文脈上の指示対象を明確にするため「イエス」とした。
