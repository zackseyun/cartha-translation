  terminology: 「悪魔」「イエス」「栄光」は本文の文脈と聖書日本語の慣用に合う。「国々」はβασιλείαςの政治的複数性を十分に表しており、特定の国家制度を不必要に限定しない。脚注の「栄華」は、この箇所のδόξαが指しうる可視的な壮麗さを補う適切な代替訳である。
