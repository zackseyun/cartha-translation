  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: ja
  text: その時、イエスは彼に言われた。「立ち去れ、サタン。こう書かれているからだ。『あなたの神である主を礼拝し[a]、ただその方にのみ仕えなさい[b]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの神である主にひれ伏し」とも訳せる。ギリシア語の動詞は、敬意を表してひれ伏す、身をかがめるという動作を表すことがある。
    reason: lexical_alternative
  - marker: b
    text: ここで「仕える」と訳した動詞は、特に神にささげる宗教的・聖なる奉仕を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の順序を示す時間副詞。直前の誘惑への応答であることを自然に示す。
- source_word: λέγει
  choice: 言われた
  rationale: 物語を生き生きと描く歴史的現在だが、現代日本語の自然な物語文として過去形で表した。イエスへの敬意を保つため尊敬表現を用いた。
- source_word: Ὕπαγε
  choice: 退け
  rationale: 相手を強く退去させる命令。簡潔で力があり、聖書本文にふさわしい現代日本語として選んだ。
- source_word: Σατανᾶ
  choice: サタン
  rationale: 呼格で用いられた固有名・称号として、定着した音訳を採用した。
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 聖書引用を導入する完了受動の定型句。書かれた内容が現在も権威を持つ含意を保つ。
- source_word: Κύριον τὸν θεόν σου
  choice: あなたの神である主
  rationale: κύριον と τὸν θεόν σου の同格関係を明瞭に表し、引用がイスラエルの神を指すことを保った。
- source_word: προσκυνήσεις
  choice: 礼拝し
  rationale: この文脈では神に向けられる崇敬を表す。「ひれ伏す」という身体動作の語義もあるため脚注に残した。
- source_word: αὐτῷ μόνῳ
  choice: ただこの方にのみ
  rationale: μόνῳ が礼拝と奉仕の対象の排他性を強調することを明示した。「この方」は直前の「主」を自然に受ける。
- source_word: λατρεύσεις
  choice: 仕えなさい
  rationale: 神にささげる宗教的奉仕を表すが、προσκυνήσειςとの語義上の区別を保つため「礼拝する」と重ねず「仕える」とした。
theological_decisions:
- issue: προσκυνέω と λατρεύω の二つの動詞の訳し分け
  choice: 「礼拝する」と「仕える」と訳し分ける
  alternative: 両方を礼拝の語で訳す、または前者を「ひれ伏す」とする
  rationale: 原文の関連しつつ異なる二語を区別し、神だけが礼拝と奉仕の対象であるという引用の力を平板化しないため。身体的な「ひれ伏す」の可能性は脚注で示した。
- issue: μόνῳ が示す排他性
  choice: 「ただこの方にのみ」と明示する
  alternative: 「この方に仕える」と簡略化する
  rationale: 原文が奉仕の対象を神だけに限定していることを明確に保ち、本文以上の教理的限定は加えないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「退け」は命令の強さを簡潔に伝え、引用部は命令形で統一した。脚注記号[a][b]は対応する語の直後に置いた。
