id: MAT.4.6
reference: Matthew 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: ja
  text: そして彼に言った。「あなたが神の子なら、下へ身を投げなさい。[a] こう書かれているからだ。『神はあなたについて、ご自分の御使いたちに命じられる。』また、『彼らはその手であなたを支え上げる。[b] あなたの足が石に打ち当たることのないように。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「飛び降りなさい」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「あなたを持ち上げる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: 物語中の歴史的現在であり、現代日本語の自然な叙述として過去形にした。
- source_word: Εἰ
  choice: なら
  rationale: 誘惑者の挑戦を表す条件を保ち、条件の真偽を翻訳側で決めない。
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: 神の子
  rationale: マタイの文脈で称号として機能する表現を、日本語で自然に示した。
- source_word: βάλε σεαυτὸν κάτω
  choice: 下へ身を投げなさい
  rationale: 再帰的な命令と方向を明示しつつ、現代日本語として理解できる表現にした。
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 聖書引用を導く定型的な完了受動の意味と、書かれた言葉の現在的な効力を表した。
- source_word: ἐντελεῖται
  choice: 命じられる
  rationale: 権威ある命令を表す未来形を、日本語の引用文に自然な非過去形で示した。
- source_word: περὶ σοῦ
  choice: あなたについて
  rationale: περί＋属格の意味を直接保ち、原文に明記されていない命令内容を補わなかった。
- source_word: ἐπὶ χειρῶν
  choice: その手で
  rationale: 御使いたちの手による支持という像を自然な日本語で表した。
- source_word: ἀροῦσίν σε
  choice: あなたを支え上げる
  rationale: 持ち上げて守るという αἴρω の意味を、文脈に即して明瞭に表した。
- source_word: μήποτε προσκόψῃς
  choice: 打ち当たることのないように
  rationale: 防止を表す μήποτε と、足が物にぶつかる προσκόπτω の具体的な意味を保った。
- source_word: πρὸς λίθον
  choice: 石に
  rationale: 日本語では『石に打ち当たる』が自然であり、不定の石という意味も損なわない。
- source_word: τὸν πόδα σου
  choice: あなたの足
  rationale: 原文の単数を保持した。
theological_decisions:
- issue: 誘惑者の挑戦における「神の子」のキリスト論的な力
  choice: 称号として自然な「神の子」と訳した
  alternative: 不定的な意味に見える「神の一人の子」と訳す
  rationale: マタイの物語文脈では固有の称号として機能するが、本文を越える教理的説明は加えない。
- issue: 悪魔による詩編引用の扱い
  choice: 引用されたままを訳し、本文中で訂正や評価を加えない
  alternative: 引用の誤用であることを本文中に明記する
  rationale: 語り手はここで悪魔の聖書引用を記しているため、その緊張を保ち、解釈を本文へ挿入しない。
- issue: περὶ σοῦ に続く命令内容の省略
  choice: 「あなたについて」とし、守るように等の目的を補わない
  alternative: 「あなたを守るように」と補う
  rationale: 誘惑者が引用する形では命令の具体的内容が明記されておらず、詩編の周辺文脈から本文へ補充しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用には簡潔で格調ある調子を保った。「あなたについて」というやや特異な言い回しは、引用された原文の省略と曖昧さを保つため意図的に残した。
