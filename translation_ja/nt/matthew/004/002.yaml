  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: ja
  text: そして、四十日四十夜断食した後、イエスは空腹を覚えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「四十日四十夜断食し、その後、空腹になった。」
    reason: 分詞とὕστερονの時間的関係、およびἐπείνασενの起動的なニュアンスを、より逐語的に示す別訳。
lexical_decisions:
- source_word: νηστεύσας
  choice: 断食した後
  rationale: アオリスト能動分詞は主動詞に先立つ行為を表しており、現代日本語では「断食した後」が時間的関係を自然かつ明確に伝える。
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: 四十日四十夜
  rationale: 時間の継続を示す対格である。日本語の定着した簡潔な表現により、期間と聖書的な言い回しの両方を保つ。
- source_word: ὕστερον
  choice: 後
  rationale: 断食に続く時を示す。「断食した後」と分詞句に組み込み、原文の時間的順序を自然に表した。独立させた「その後」も可能である。
- source_word: ἐπείνασεν
  choice: 空腹を覚えた
  rationale: 空腹になったことを表すアオリストを、自然で品位ある現代日本語にした。「空腹になった」も可能だが、やや機械的に響く。
- source_word: καὶ
  choice: そして
  rationale: 物語を前節から続ける単純な接続を保ち、余分な因果や時間の解釈を加えない。
theological_decisions:
- issue: 断食後のイエスの現実の人間的必要
  choice: 空腹を覚えた
  alternative: 空腹になった
  rationale: 実際の飢えを明確に伝えつつ、この節の語義を越えて教理的説明を付加しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「イエス」はギリシア語本文では明示されないが、直前の主語を日本語で明確にするため補った。
