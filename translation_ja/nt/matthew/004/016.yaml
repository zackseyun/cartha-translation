  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: ja
  text: 暗闇に座っていた民は、大きな光を見た。そして、死の陰[a]の地に座っていた人々の上に、光が昇った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死の陰」は「深い闇」とも訳せる。ギリシア語には「死」が明記されており、聖書で親しまれている比喩とも響き合うため、この表現を保った。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς
  choice: 民
  rationale: 集合的な人々を指す語として、預言の引用にふさわしい簡潔で格調ある表現。「国民」ほど政治的・民族的に限定しない。
- source_word: καθήμενος / καθημένοις
  choice: 座っていた
  rationale: 原文の反復とイザヤ書に由来する鮮明な比喩を保つ。「住んでいた」も可能だが、原語の像を弱める。
- source_word: σκοτίᾳ
  choice: 暗闇
  rationale: 文字どおりの意味と比喩的な意味の双方を保ち、罪、無知、苦境など一つの解釈に限定しない。
- source_word: φῶς εἶδεν μέγα
  choice: 大きな光を見た
  rationale: 語順を自然な日本語にしつつ、単純過去の出来事と光の際立った大きさをそのまま表す。
- source_word: χώρᾳ
  choice: 地
  rationale: 特定の国家を連想させず、場所・地域を表す簡潔な聖書的日本語。「地方」よりも後続の比喩と自然につながる。
- source_word: σκιᾷ θανάτου
  choice: 死の陰
  rationale: ギリシア語に明記された「死」を残し、聖書に広く見られる比喩との響き合いを保つ。
- source_word: ἀνέτειλεν
  choice: 昇った
  rationale: 太陽や天体の光が昇る像を自然に伝える。「輝いた」では上昇・出現の含意が弱くなる。
- source_word: αὐτοῖς
  choice: 人々に
  rationale: 与格の受け手を明示し、日本語として自然に「光が昇った」と結ぶ。対象は直前の「座っていた人々」で示す。
theological_decisions:
- issue: 暗闇と光の比喩が具体的に何を指すか
  choice: 暗闇と光の像を解釈で限定せず、そのまま残す
  alternative: 暗闇を罪または異邦人の無知、光をメシアによる救いの啓示と明示する
  rationale: 文脈上豊かな神学的含意はあるが、この節自体は各比喩の意味を一つに定義していないため、預言的な広がりと緊張を保つ。
- issue: σκιᾷ θανάτου の表現
  choice: 「死の陰」と訳し、死への明示的言及を保つ
  alternative: 「深い闇」と訳す
  rationale: 旧約の背景では「深い闇」と理解しうるが、マタイのギリシア語本文には θανάτου（死）が明記されているため、それを本文から除かない。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、預言の引用としての格調と反復表現を保持した。「座っていた」「死の陰」は意図的に比喩を保った表現。
