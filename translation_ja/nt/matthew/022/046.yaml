  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: ja
  text: だれもイエスに一言も答えることができなかった[a]。また、その日以来、もはやあえてイエスに質問する者はいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼に一言答える」。ギリシア語にはλόγον（「言葉」）が含まれており、否定文では「一言も答えられなかった」という意味になる。
    reason: ギリシア語の慣用表現に含まれるλόγον（「言葉」）を示し、日本語訳の「一言も」との関係を明らかにするため。
lexical_decisions:
- source_word: οὐδεὶς ἐδύνατο
  choice: だれも…できなかった
  rationale: 全否定と過去における能力の欠如を、明快で自然な現代日本語で表した。
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: イエスに一言も答える
  rationale: λόγονを生かしつつ、ギリシア語の否定構文が持つ「一言たりとも答えられない」という意味を自然な日本語で表した。代名詞を重ねず、文脈上の指示対象を「イエス」と明示した。
- source_word: οὐδὲ
  choice: また…いなかった
  rationale: 前半の否定に第二の否定を加える関係を、日本語として滑らかに接続した。
- source_word: ἐτόλμησέν τις
  choice: あえて…する者はいなかった
  rationale: τολμάωの「敢えて行う、思い切って行う」という意味を保ち、単なる不実行ではなく、質問する勇気がなかったことを表した。
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: その日以来
  rationale: その日を起点として後まで続く状態を、簡潔で慣用的な日本語で示した。
- source_word: ἐπερωτῆσαι αὐτὸν οὐκέτι
  choice: もはや…イエスに質問する
  rationale: ἐπερωτάωを、論争的な文脈で問いを突きつける行為を含み得る「質問する」とし、οὐκέτιによる以後の中止を「もはや」で表した。
theological_decisions:
- issue: イエスへの応答と質問が途絶えたことの物語上の意味
  choice: 人々が答えられず、その後は質問する勇気もなかったという本文の叙述にとどめた。
  alternative: 訳文自体にイエスの知恵や権威の優越を明示する。
  rationale: 文脈はイエスが論争で相手を沈黙させたことを示唆するが、この節そのものは、だれも答えられず、以後あえて質問しなかったと述べるにとどまるため、解釈を訳文に加えなかった。
translation_notes:
  register: 明快な現代標準語を用いながら、「その日以来」「もはや」によって聖書本文にふさわしい落ち着きと品位を保った。過度に古風な語法や論争の勝敗を強調する説明的表現は避けた。
