base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: ja
  text: そして彼に言った。「友よ、婚礼の服を着ていないのに、どうやってここに入って来たのか。」しかし、その人は返す言葉がなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「黙らされた」。このギリシア語動詞には、文字どおり「口輪をはめられた」という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: 友よ
  rationale: 呼びかけとして自然であり、表面上の丁寧さと、文脈にある距離を置いた叱責の響きとの緊張を保つ。
- source_word: πῶς
  choice: どうして
  rationale: 入って来た経緯・あり方を問う語。現代日本語では「どうして」が自然だが、動機だけを問う意味に限定しない。
- source_word: εἰσῆλθες ὧδε
  choice: ここに入って来た
  rationale: 完了した入場の行為と、話者のいる場所を指す「ここに」を明確に表す。
- source_word: μὴ ἔχων
  choice: 着ないで
  rationale: 婚礼の服を身に着けていない状態で入ったという付帯状況を、自然な日本語で表す。
- source_word: ἔνδυμα γάμου
  choice: 婚礼の服
  rationale: 特定の衣服の種類を「礼服」や「長衣」と過度に限定せず、婚礼にふさわしい衣服という原文の幅を保つ。
- source_word: ἐφιμώθη
  choice: 返す言葉がなかった
  rationale: この場面で答えることができない結果を自然な日本語で示す。受動形の直訳と「口輪をはめる」という語の背景は脚注に残す。
theological_decisions:
- issue: 婚礼の服を着ていない客への呼びかけの調子
  choice: 表面上は丁寧だが叱責を含みうる「友よ」
  alternative: 「仲間よ」「君よ」
  rationale: 親愛にも敵意にも決めつけず、ギリシア語の呼びかけが持つ距離感と物語上の皮肉を保つ。
- issue: ἐφιμώθη の受動表現
  choice: 結果を表す「返す言葉がなかった」
  alternative: 「黙らされた」
  rationale: 誰が直接黙らせたのかを本文で補わず、男が答えられなかったという文脈上の結果を明瞭にする一方、原文の受動形と比喩的背景を脚注で示す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、たとえ話にふさわしい簡潔で dignified な語調と、主人の問いの厳粛さを保った。
