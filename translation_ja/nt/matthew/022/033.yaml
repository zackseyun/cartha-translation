  text: καὶ ἀκούσαντες οἱ ὄχλοι ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: ja
  text: 群衆はこれを聞いて[a]、イエスの教えに驚嘆した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これを聞くと」または、より直訳的に「聞いて」。
    reason: 分詞 ἀκούσαντες の時間的関係と、文脈から補った目的語「これ」に関する訳語上の選択肢を示すため。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞いて
  rationale: アオリスト能動分詞が「群衆」を修飾している。日本語では「聞いて」として後続の反応との時間的つながりを自然に表し、目的語は直前のイエスの答えを指す「これ」で補った。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語の「群衆」は集合的に用いられ、文脈に即して自然である。「群衆たち」は不自然なため避けた。
- source_word: ἐξεπλήσσοντο
  choice: 驚嘆した
  rationale: 未完了過去形が描く強い驚きの反応を、現代日本語で簡潔かつ品位ある「驚嘆した」で表した。「驚いていた」も形の継続性を示しうるが、ここでは出来事への反応として自然な表現を優先した。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: イエスの教えに
  rationale: ἐπί＋与格が驚きの根拠・対象を示すため「教えに」とした。日本語では代名詞「彼の」より「イエスの」のほうが指示対象が明確で自然である。
- source_word: καὶ
  choice: （独立した接続語を置かない）
  rationale: この節の καί は前段との単純な連結を示す。日本語では「そして」を明示するとやや重くなるため、文脈上の連続性に委ねた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「教え」は専門的に響きやすい「教理」より文脈に適する。主語の複数性は日本語として自然な集合名詞「群衆」で表した。
