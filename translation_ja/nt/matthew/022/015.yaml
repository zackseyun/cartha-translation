source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: ja
  text: その時、ファリサイ派の人々は出て行って、イエスを言葉のことで罠にかけるにはどうすればよいかと相談した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの言うことを利用して、罠にかけるにはどうすればよいかと相談した。」
    reason: ἐν λόγῳを、イエス自身の発言を利用して陥れるという文脈上の意味で明示する別訳。
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の展開を示す時間副詞。簡潔で自然な現代日本語とした。
- source_word: πορευθέντες
  choice: 出て行き
  rationale: 主動詞に先立つ移動を表すアオリスト分詞。文脈上、直前の場から立ち去って相談した流れを自然に示す。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 宗教的集団の名称を、一般読者にも人々を指すと分かる形で訳した。
- source_word: συμβούλιον ἔλαβον
  choice: 相談した
  rationale: 直訳的には『協議を持った』という慣用句。悪意は目的節が明示するため、ここでは協議・計画の意味を過度に強めずに表した。
- source_word: ὅπως
  choice: どのようにして…ようかと
  rationale: 協議の内容と目的の双方を示す構文を、自然な日本語の間接疑問として表した。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 指示対象を日本語で明確にするため、代名詞ではなく固有名を補った。
- source_word: παγιδεύσωσιν
  choice: 罠にかけよう
  rationale: 罠で捕らえる比喩を保ちつつ、敵対的な意図を明確に伝える現代日本語。
- source_word: ἐν λόγῳ
  choice: そのことばで
  rationale: λόγοςはここでは発言・ことばを指す。ἐνの手段的意味と、発言によって陥れようとする意図を簡潔に表した。
theological_decisions:
- issue: συμβούλιον ἔλαβονに含ませる敵意の強さ
  choice: 『相談した』と比較的中立に訳し、敵意は『罠にかけよう』で示す。
  alternative: 『たくらんだ』『策略を練った』
  rationale: 原文では悪意が目的節によって明示されるため、協議を表す句そのものに必要以上の敵意を読み込まない。
- issue: ἐν λόγῳの解釈
  choice: 『そのことばで』とし、発言を手段として罠にかける意味を保つ。
  alternative: 『何かを言わせて』『その言うことにつけ込んで』
  rationale: 原文の簡潔さと、ことば・発言をめぐる罠という比喩的な緊張を保つため。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。『ファリサイ派の人々』で集団名を分かりやすくし、『罠にかける』によって原文の比喩を保持した。
