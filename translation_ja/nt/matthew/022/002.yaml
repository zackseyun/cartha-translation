id: MAT.22.2
reference: Matthew 22:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: ja
  text: 天の国は、息子のために婚宴[b]を催した王にたとえられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「たとえることができる」。ギリシア語は直訳すれば「たとえられた」または「似たものとされた」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「婚礼」が複数形。婚礼の祝い、または婚礼の宴を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: たとえられた
  rationale: アオリスト受動態直説法の形を保ち、比喩を導入する表現として自然な日本語にした。「たとえることができる」では、原文に明示されない可能・許容の意味が加わるため、本文では避けた。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を「神の国」に言い換えず保持した。「国」は支配と領域の両方の含みを残しつつ、現代日本語で広く理解できる。
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: 王
  rationale: ἄνθρωποςとβασιλεύςを逐語的に「人である王」とすると日本語では不自然であり、ここでは「王」だけで人間の王を自然に表せる。原文の指示対象を損なわず簡潔に訳した。
- source_word: ἐποίησεν
  choice: 催した
  rationale: γάμουςとの結び付きでは、単なる「作った」ではなく婚礼の祝宴を開催したことを表す。「催した」は王が宴を設けたという文脈に自然である。
- source_word: γάμους
  choice: 婚宴
  rationale: 複数形は結婚という行為そのものより、婚礼の祝宴・一連の祝いを指す慣用表現である。「婚宴」は簡潔で格調を保ち、後続する宴席の文脈にも合う。
- source_word: τῷ υἱῷ αὐτοῦ
  choice: 息子のために
  rationale: 与格が示す利益・関係を明確にし、婚宴が王の息子のために催されたことを自然に表した。「自分の」は日本語では文脈上不要なため補わなかった。
theological_decisions:
- issue: 「天の国」という表現の性質
  choice: マタイの「天の国」をそのまま保持する
  alternative: 「神の国」または「天の支配」と訳す
  rationale: 「神の国」への調和や、「支配」だけへの解釈的限定を避け、マタイ固有の表現と、国・支配の両面を含み得る余地を残した。
- issue: たとえの導入句の時制と態
  choice: 「たとえられた」と訳す
  alternative: 「たとえることができる」または「似ている」と訳す
  rationale: 原文のアオリスト受動態直説法を尊重し、可能の意味を本文へ加えなかった。一方、定型的なたとえの導入として別訳が可能なことは脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、たとえ話にふさわしい簡潔で落ち着いた文体とした。「婚宴」は日常語の「結婚式」よりも原文の祝宴の含みを明確にし、過度に古風な表現は避けている。
