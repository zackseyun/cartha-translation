  source_fidelity: 本文はὩμοιώθηのアオリスト受動態を「たとえられた」とし、ἡ βασιλεία τῶν οὐρανῶνを「天の国」と保持している。ἀνθρώπῳ βασιλεῖは日本語として自然に「王」とまとめられ、ἐποίησεν γάμους τῷ υἱῷ αὐτοῦも「息子のために婚宴を催した」として、婚礼の祝宴を息子のために設けたという意味を適切に伝える。
  naturalness: 「天の国は、息子のために婚宴を催した王にたとえられた」は、明瞭な現代標準語として自然であり、たとえ話の導入にふさわしい落ち着いた文体である。「婚宴」はやや改まった語だが、この文脈では簡潔で意味も明確である。
  terminology: 「天の国」はマタイの固有の言い回しを保っており、「神の国」への調和を避けている。「婚宴」はγάμοιの複数形が指す婚礼の祝い・宴会という慣用的意味に合う。脚注a・bはいずれも本文中の該当語に適切に付され、原文の別表現と複数形の含意を過不足なく示している。
