  text: Συνηγμένων δὲ τῶν Φαρισαίων ἐπηρώτησεν αὐτοὺς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: ja
  text: ファリサイ人たちが集まっていたとき、イエスは彼らに尋ねた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: 集まっていた
  rationale: 属格独立構文の分詞で、主節の背景となる状況を表す。「集まっていた」として、継続中の集合状態を自然な日本語で示した。
- source_word: δὲ
  choice: （訳出せず）
  rationale: ここでは弱い談話上の移行を示す。日本語では従属節から主節への流れだけで十分自然であり、「さて」などを加えると原文以上に区切りを強調しかねないため、明示しなかった。
- source_word: τῶν Φαρισαίων
  choice: ファリサイ派の人々
  rationale: 当時の宗教的集団を指す名称として、現代の一般読者にも人々の集団であることが明瞭な表現を採用した。
- source_word: ἐπηρώτησεν
  choice: 尋ねられた
  rationale: 質問を発したことを表す中立的な動詞。「問いただされた」ほど対立的な含みを持たせず、イエスへの敬意を示す自然な敬語表現とした。
- source_word: αὐτοὺς
  choice: 彼らに
  rationale: 直前のファリサイ派の人々を受ける代名詞。日本語の「尋ねる」が質問の相手を「に」で示すため、この形にした。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 固有名詞として標準的に表記した。ギリシア語の冠詞は日本語では表さない。
