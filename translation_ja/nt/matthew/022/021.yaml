id: MAT.22.21
reference: Matthew 22:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ja
  text: 彼らはイエスに、「カエサルのものです」と答えた。そこでイエスは彼らに言った。「それなら、カエサルのものはカエサルに、神のものは神に返しなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「返しなさい」は、「納めなさい」または「当然与えるべきものを与えなさい」とも訳せる。ギリシア語の動詞には、返す、支払う、しかるべきものを渡す、という意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: 彼らはイエスに……と答えた
  rationale: 歴史的現在を、現代日本語の物語として自然な過去形で表した。文脈上は問いへの返答なので「言った」より「答えた」が自然であり、代名詞の指示対象を「イエス」と明示した。
- source_word: Καίσαρος
  choice: カエサルのものです
  rationale: 属格だけの簡潔な返答を保ちつつ、日本語では補われる内容を「もの」で示した。
- source_word: τότε λέγει αὐτοῖς
  choice: そこでイエスは彼らに言った
  rationale: τότε が示す会話の展開を「そこで」で自然に表し、歴史的現在は過去形にした。
- source_word: Ἀπόδοτε
  choice: 返しなさい
  rationale: ἀποδίδωμι が持つ、属する相手に返す、または当然納めるべきものを納めるという含みを簡潔に表した。語義の幅は脚注に残した。
- source_word: οὖν
  choice: それなら
  rationale: 直前の「カエサルのもの」という答えを受けた推論であることを、自然な会話表現で示した。
- source_word: τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ
  choice: カエサルのものはカエサルに、神のものは神に
  rationale: 二つの句の対句構造を日本語でも保ち、市民的義務と神への帰属の双方を説明的に限定しなかった。
theological_decisions:
- issue: 国家への義務と神への義務に関する命令の射程
  choice: 「カエサルのもの」と「神のもの」を並列のまま訳し、両者の区別と緊張を保った。
  alternative: 納税だけを命じる発言、または国家への無制限の服従を認める発言として明示する。
  rationale: ギリシア語本文は何がそれぞれに属するかを詳しく規定していないため、後代の政治理論や教派的解釈を訳文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの言葉の簡潔さと格調、原文の対句を保った。「カエサル」は新約聖書の歴史的称号として採用した。
