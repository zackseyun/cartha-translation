  source_fidelity: ギリシア語の語順（「足と手」）、強制的な追放（ἐκβάλετε）、および「外の暗闇」とそこでの「泣き悲しみ／歯ぎしり」という定型的な裁きの描写を、解釈を加えずに正確に伝えている。「そこで」はτότεの物語上の継起を自然に示す。
