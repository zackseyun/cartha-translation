id: MAT.22.13
reference: Matthew 22:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: ja
  text: そこで王は給仕の者たち[a]に言った。「この者の足と手を縛り、外の暗闇へ放り出せ。そこでは、泣き悲しみ、歯ぎしりすることになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「給仕の者たち」は「仕える者たち」または「召使いたち」とも訳せる。
    reason: διάκονοςは文脈により、給仕する者、仕える者、召使いなどを意味し得るため。
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の次の展開を示す時間的・継起的な副詞。現代日本語の物語文として自然に前後をつなぐ。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: たとえの宴席を主催する王を指し、原文の王権的イメージをそのまま保つ。
- source_word: τοῖς διακόνοις
  choice: 給仕の者たち
  rationale: 宴席の場で王に仕える者たちを指す。教会職を連想させる「執事」を避け、文脈上の役割を明確にした。
- source_word: Δήσαντες
  choice: 縛り
  rationale: 主命令に先立つアオリスト分詞を、日本語では連用形による一連の命令として自然に表した。δέωの拘束する意味も保つ。
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: この者の足と手
  rationale: 指示対象を日本語で明確にしつつ、原文の「足と手」という語順を保った。
- source_word: ἐκβάλετε αὐτὸν
  choice: この者を……放り出せ
  rationale: ἐκβάλλωが表す強制的で厳しい排除を、明瞭な現代日本語で表した。
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: 外の暗闇へ
  rationale: 宴席の外への排除という空間的イメージと、マタイ特有の裁きの表現を、解釈的に説明せず保持した。
- source_word: ἐκεῖ
  choice: そこでは
  rationale: 直前の「外の暗闇」を受ける場所の指示として自然であり、原文の場所的強調を保つ。
- source_word: ὁ κλαυθμὸς
  choice: 泣き悲しみ
  rationale: 悲嘆を伴う泣く行為を表し、「泣き叫ぶ」として意味を強めすぎない表現を選んだ。
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: 歯ぎしりする
  rationale: 苦悶や怒りの双方を含み得る慣用的イメージを、意味を限定せず日本語の定着した表現で保った。
- source_word: ἔσται
  choice: することになる
  rationale: 未来の事態を告げるἔσταιを、警告的な文脈に合う自然な現代日本語で表した。
theological_decisions:
- issue: たとえにおける排除のイメージの性質
  choice: 「外の暗闇へ放り出す」という具体的な比喩表現をそのまま保つ
  alternative: 「地獄へ落とす」と明示する、または単に宴席から締め出すこととして弱める
  rationale: 原文はたとえの中で鮮烈な裁きのイメージを用いるが、それを特定の終末論的教義や単なる社会的排除に限定してはいない。その緊張と余白を翻訳でも保持する。
- issue: 泣くことと歯ぎしりの感情的意味
  choice: 「泣き悲しみ、歯ぎしりする」とし、苦悶か怒りかを限定しない
  alternative: 後悔、絶望、または怒りのいずれかを明示する
  rationale: 原文の定型句は複数の感情を含み得るため、翻訳で一つの心理状態に決めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、王の命令の厳しさと、たとえの荘重な裁きの響きを保った。「執事」のような後代の教会職制を連想させる語は避けた。
