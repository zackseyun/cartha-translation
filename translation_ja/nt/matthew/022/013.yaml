  terminology: 「王」はβασιλεύςに適切であり、「給仕の者たち」は宴席という文脈におけるδιάκονοιの役割をよく表す。「外の暗闇」はマタイに特徴的な表現を保ち、これを地獄その他の特定教義へと狭めていない。脚注は「給仕の者たち」の代替的な意味領域を適切に示す。
