id: MAT.22.42
reference: Matthew 22:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: ja
  text: こう言った。「あなたがたはメシア[a]についてどう思うか。メシアはだれの子か。」彼らはイエスに言った。「ダビデの子です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語は「クリストス」で、ここではメシアを指す称号として使われている。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: こう言った
  rationale: λέγωの現在分詞で、イエスの発言を導入する。日本語では前後の物語に自然につながる独立した述語として表した。
- source_word: Τί ὑμῖν δοκεῖ
  choice: あなたがたは……どう思うか
  rationale: 相手の判断や見解を尋ねる慣用表現であり、現代日本語として自然に意味を保つ。
- source_word: περὶ τοῦ χριστοῦ
  choice: メシアについて
  rationale: χριστόςはここでは固有名のような用法ではなく、ユダヤ的な文脈における称号として用いられているため、「メシア」とした。
- source_word: τίνος υἱός ἐστιν
  choice: メシアはだれの子か
  rationale: 血統・王統上の父祖を問う表現。「彼」を用いるより、指示対象を繰り返すほうが日本語では明確で自然である。
- source_word: λέγουσιν αὐτῷ
  choice: 彼らはイエスに言った
  rationale: ギリシア語の歴史的現在を、日本語の物語に自然な過去形で表した。αὐτῷの指示対象は文脈上イエスなので明示した。
- source_word: Τοῦ Δαυίδ
  choice: ダビデの子です
  rationale: 原文は属格だけの省略回答だが、日本語で「ダビデの」とだけ言うのは不自然なため、問いから「子」を補った。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスの名の一部のようにではなく、待望される王を指す称号として使われている。「キリスト」も伝統的な音写として可能なので脚注に残した。
- issue: 「ダビデの子」の意味範囲
  choice: 血統・王統を示す表現としてそのまま訳す
  alternative: ダビデの子孫
  rationale: 「子」は王統上の子孫を含み得るが、後続の議論に重要な原文のυἱόςとの対応を保ち、解釈的に「子孫」へ限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、問いの簡潔さと公的な論争の調子を保った。発話者には敬語を付さず、原文にない評価を加えていない。
