  to: そこで彼らは、自分たちの弟子たちをヘロデ党の者たちと一緒にイエスのもとへ遣わして、こう言った。「先生、私たちは、あなたが真実な方であり、神の道を真実に教えておられることを知っています。また、あなたはだれにも左右されず、人を分け隔てなさらないからです。」
