id: MAT.22.16
reference: Matthew 22:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: ja
  text: そこで彼らは、自分たちの弟子たちをヘロデ党の者たちと一緒にイエスのもとへ遣わして、こう言った。「先生、私たちは、あなたが真実な方であり、神の道を真実に教えておられることを知っています。また、あなたはだれにも左右されず、人を分け隔てなさらないからです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: 遣わし、こう言わせた
  rationale: 歴史的現在を、日本語の物語として自然な過去の流れで表現した。「言わせた」は、派遣された者たちが後続の言葉を述べたことを明確にする。
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: 自分たちの弟子たち
  rationale: μαθητήςの福音書における標準的な意味を保ち、αὐτῶνの指示関係も明示した。
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ヘロデ党の者たちと一緒に
  rationale: 政治的集団との同行・協働を自然な日本語で表した。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして自然であり、教師を意味する語の通常の意味を過度な権威称号にせず表す。
- source_word: ἀληθὴς εἶ
  choice: 真実な方であり
  rationale: 発言や教えだけでなく人物の性質を述べる叙述用法を保った。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 神の道
  rationale: 神に従う道、生き方、教えを含み得る原文の比喩を狭めず保持した。
- source_word: ἐν ἀληθείᾳ
  choice: 真実に
  rationale: 原文の強調を保ちつつ、現代日本語として自然な副詞表現にした。
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: 誰にも気兼ねなさいません
  rationale: 一般的な無関心ではなく、他人の地位や反応に左右されないという文脈上の意味を伝える。
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: 人をうわべで見ないからです
  rationale: 顔を見るというギリシア語の慣用句を逐語的に再現せず、外見や社会的立場によって扱いを変えない意味を、直後の文脈に合う自然な日本語で表した。
theological_decisions:
- issue: 人物の顔を見ないという慣用句の解釈
  choice: 人をうわべで見ない
  alternative: 人を分け隔てしない／人の顔を見ない
  rationale: 原文は外見だけでなく身分や評判に左右されない公平さを表す。「うわべで見ない」は比喩をある程度保ちながら日本語で誤解されにくく、前文の「気兼ねしない」ともつながる。
- issue: οὐ μέλει σοι περὶ οὐδενόςが示す態度
  choice: 誰にも気兼ねなさいません
  alternative: 誰のことも気にかけません
  rationale: 後者は他者への思いやりがないという意味に取られやすい。ここでは人の権威、評価、反応に拘束されないことを述べているため、「気兼ねしない」とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、相手のへつらいを含む丁寧な発言として敬体を採用した。「真実な方」「神の道」により原文の荘重さと神学的含意を保った。
