id: MAT.22.45
reference: Matthew 22:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: ja
  text: それでは、ダビデがその方を「主」と呼んでいるのなら、どうしてその方はダビデの子なのでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈を明示すれば、「それでは、ダビデがメシアを『主』と呼んでいるのなら、どうしてメシアはダビデの子なのでしょうか」とも訳せる。
    reason: 代替訳。代名詞「その方」が文脈上メシアを指すことを明示する。
lexical_decisions:
- source_word: εἰ οὖν
  choice: それでは、…のなら
  rationale: εἰの条件とοὖνの推論的なつながりを、自然な現代日本語で保つ。「なら」は前提を断定しすぎず、議論の構造を示す。
- source_word: Δαυὶδ
  choice: ダビデ
  rationale: 日本語聖書で定着した人名表記を用いる。
- source_word: καλεῖ αὐτὸν κύριον
  choice: その方を「主」と呼んでいる
  rationale: καλέωの「呼ぶ」という意味と、κύριοςの称号としての重みを保つ。αὐτόνの指示対象は文脈に委ね、「その方」として自然に受ける。
- source_word: πῶς
  choice: どうして
  rationale: ここでは方法ではなく、二つの主張がどう両立するのかを問う修辞的疑問であるため、「どうして」が自然である。
- source_word: υἱὸς αὐτοῦ ἐστιν
  choice: その方はダビデの子なのでしょうか
  rationale: 「子」という家系的・王統的表現を維持し、「子孫」と説明的に広げない。日本語では所有者を「彼」と曖昧にせず「ダビデ」と補って関係を明確にする。
theological_decisions:
- issue: ダビデがメシアを「主」と呼びながら、その方がダビデの「子」であるというキリスト論的緊張
  choice: 本文では「主」と「ダビデの子」をそのまま並べ、関係を説明しない。
  alternative: 「ダビデがメシアを『主』と呼ぶのなら、どうしてメシアはダビデの子なのでしょうか」と明示する。
  rationale: ギリシア語本文はこの節で「メシア」を明記せず、αὐτόνによって直前の文脈を受ける。本文に「メシア」を加えると分かりやすいが、原文以上に指示対象を明示するため、注に置く。
translation_notes:
  register: 明瞭で品位ある現代標準語。修辞的な問いとして自然に響くよう丁寧体を用い、「主」は引用された称号であることをかぎ括弧で示した。注記記号は対応する文末に置いた。
