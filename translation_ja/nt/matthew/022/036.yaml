id: MAT.22.36
reference: Matthew 22:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: ja
  text: 「先生、律法の中で最も重要な[a]戒めはどれですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「大きな」。ここでは「重要な」、または文脈上「最も重要な」という意味。
    reason: 原文の μεγάλη は肯定級だが、文脈上は戒めの重要性の順位を問う表現として理解できるため。
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけの形。イエスに対する敬意を保ちつつ、現代日本語で教師を指す自然で標準的な表現。
- source_word: ποία
  choice: どれ
  rationale: 律法に含まれる複数の戒めの中から一つを問う疑問形容詞であり、日本語では「どれ」が自然。
- source_word: ἐντολὴ
  choice: 戒め
  rationale: 聖書とユダヤ教の律法という文脈にふさわしく、「命令」よりも定着した表現。
- source_word: μεγάλη
  choice: 最も重要な
  rationale: 語形自体は肯定級の「大きな」だが、この問いでは戒めの順位・重要性を尋ねる比較的な意味を持つため、自然な日本語では「最も重要な」とした。字義的な表現は脚注に残す。
- source_word: ἐν τῷ νόμῳ
  choice: 律法の中で
  rationale: ここでの νόμος は一般的な法律ではなく、ユダヤ教の律法を指すため、「律法」とした。
theological_decisions:
- issue: μεγάλη を最上級の意味で訳すか
  choice: 最も重要な
  alternative: 大きな／重要な
  rationale: ギリシア語は明示的な最上級ではないが、複数の戒めの中でどれが主要かを問う文脈では比較・最上級的に理解するのが自然である。ただし原文の語形と意味の幅を脚注で示した。
translation_notes:
  register: 簡潔で自然な現代標準日本語。呼びかけには一般読者に分かりやすい「先生」を用い、聖書用語として定着している「律法」「戒め」を保った。
