  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: ja
  text: また、第二の戒めも、これに似ています。『自分を愛するように、あなたの隣人を愛しなさい。』[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また、第二の戒めはこれに似ています。」
    reason: Δευτέραは無冠詞であるが、文脈上は第一の戒めに続く「第二の戒め」を指す。「も」を伴わない訳は、その表現上の選択肢を示す。
lexical_decisions:
- source_word: Δευτέρα δὲ
  choice: また、第二の戒め
  rationale: 無冠詞の序数詞が女性形で名詞的に用いられ、文脈上「第二の戒め」を指す。δὲは強い対比ではなく、話を次へ進める穏やかな接続として「また」とした。
- source_word: ὁμοία αὐτῇ
  choice: これと同じようなものです
  rationale: 与格αὐτῇは直前の第一の戒めを指す。二つを同一視せず、類似・同等性を示すὁμοίαの幅を自然な日本語で保った。
- source_word: Ἀγαπήσεις
  choice: 愛しなさい
  rationale: 未来直説法だが、七十人訳レビ記19章18節からの引用において命令の力を持つ。現代日本語では明確で格調も保てる命令形が自然である。
- source_word: τὸν πλησίον σου
  choice: あなたの隣人
  rationale: 慣用的に「あなたの隣人」を意味し、単なる空間的な近接者には限定しない。
- source_word: ὡς σεαυτόν
  choice: 自分自身のように
  rationale: ὡςは比較の基準を示し、再帰代名詞は命令の受け手自身を指す。「自分自身のように」が明確で自然である。
theological_decisions:
- issue: 第二の戒めと第一の戒めとの関係
  choice: 第二の戒めもこれと同じようなものです
  alternative: 第二の戒めはこれと同じです
  rationale: ὁμοίαは類似や同種性を表し、二つの戒めを一つに同一化しない。「同じようなもの」とすることで、その重要な対応関係を保ちつつ解釈を過度に限定しない。
- issue: Δευτέραの定性
  choice: 第二の戒め
  alternative: もう一つの戒め
  rationale: ギリシア語は無冠詞だが序数詞であり、文脈では第一に続く第二の戒めを名指している。日本語では「第二の戒め」が自然で、順位関係も明瞭である。
translation_notes:
  register: 明快な現代標準日本語を用い、イエスの説明部分は丁寧体、聖書引用の命令は簡潔で格調ある形とした。本文中に脚注記号[a]を明示した。
