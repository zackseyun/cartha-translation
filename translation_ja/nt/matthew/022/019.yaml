  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: ja
  text: 「税を納めるための硬貨[a]を見せなさい。」すると、彼らはイエスのところに一デナリオンを持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人頭税のための硬貨」または「人口調査税のための硬貨」とも訳せる。ここでいう税はローマ帝国に納める税である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: 見せなさい
  rationale: 二人称複数のアオリスト命令形。対象を目の前に出して見せるという視覚的な意味を自然な現代日本語で表す。
- source_word: τὸ νόμισμα
  choice: 硬貨
  rationale: 流通している貨幣、とりわけ硬貨を指す。後半で具体的にデナリオン硬貨と示されるため、「硬貨」が明確で自然。
- source_word: τοῦ κήνσου
  choice: 税として納める
  rationale: 属格は、この税の支払いに用いる硬貨という関係を表す。κήνσος はローマ帝国の人頭税・人口調査に基づく税を指し得るが、本文では過度に限定せず「税」とした。
- source_word: προσήνεγκαν αὐτῷ
  choice: イエスのところに……持って来た
  rationale: προσφέρω のアオリストで、彼のもとへ持参したことを表す。代名詞の指示対象を日本語で明瞭にするため「イエス」とした。
- source_word: δηνάριον
  choice: 一デナリオン硬貨
  rationale: 特定のローマ貨幣名を保持しつつ、日本語読者に硬貨であることを明示する。
