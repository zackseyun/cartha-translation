id: MAT.22.9
reference: Matthew 22:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: ja
  text: だから、道が交わったり分かれたりする所へ行き[a]、見つけた人をみな婚宴[b]に招きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「道の出口へ」「分かれ道へ」「交差点へ」。ギリシャ語は、道が分かれたり交わったりする場所を指しうる。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語では直訳すると「婚礼に」。ここでは結婚を祝う宴を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: 行き
  rationale: 複数の相手への現在命令だが、日本語では文脈に沿って後続の「招きなさい」と結び、自然な命令表現とした。
- source_word: οὖν
  choice: だから
  rationale: 直前の命令を受けた帰結を、明瞭で現代的な接続語で示す。
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: 道が交わったり分かれたりする所へ
  rationale: διέξοδοι が指しうる、道の出口・分岐点・交差点という幅を保ちつつ、現代の読者に分かりやすく表現した。単に「交差点」として意味を狭めることを避けた。
- source_word: ὅσους ἐὰν εὕρητε
  choice: 見つけた人をみな
  rationale: 不定性と数量的な広がりを表す構文を、「見つけた人はだれでも」という趣旨が自然に伝わる形にした。
- source_word: καλέσατε
  choice: 招きなさい
  rationale: 婚宴の文脈では、単に呼ぶのではなく招待することを意味する。
- source_word: εἰς τοὺς γάμους
  choice: 婚宴に
  rationale: 複数形 γάμους は複数の結婚式ではなく、結婚の祝い、特に宴席を指す慣用的な用法である。簡潔で dignified な「婚宴」を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話の王の命令にふさわしい簡潔さと品位を保った。「道路」「交差点」のような現代都市的な語に限定せず、原文の地理的な幅を残した。
