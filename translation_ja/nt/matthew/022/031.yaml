revisions:
- from: 死者の復活については、神があなたがたに語られたことを読んだことがないのですか。こう言われています。
  to: 死者の復活については、神があなたがたに向けて語られた次の言葉を、読んだことがないのですか。
  rationale: 「次の言葉」により、τὸ ῥηθὲν（語られたこと）とλέγοντος（言って）による次節の引用導入を、日本語として自然に一続きで表した。「あなたがたに向けて」は与格ὑμῖνを明示し、神が発話者である点も保持する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:39Z'
review_pass:
  verdict: revise
  source_fidelity: 冒頭の「死者の復活については」はπερὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶνを適切に表す。「神があなたがたに語られたこと」も、神を発話の主体とし聞き手への与格を示している。ただし、λέγοντοςは次節の引用を導く分詞であり、現行の「こう言われています」を独立文にすると、原文の「神が…語って言われる」という連結と引用導入が弱まる。
  naturalness: 現行文は明瞭であるが、「こう言われています」は誰が言われるのかが文面上やや曖昧で、前文と切り離されている。引用が次節へ続くことを示す「次の言葉」を用いると、自然な現代標準日本語で文のつながりも明確になる。
  terminology: 「死者の復活」はこの文脈のἀνάστασις τῶν νεκρῶνに対する標準的で適切な訳語である。「神」および「あなたがた」も原文の神的行為者と複数の聞き手を保っている。
  issues:
  - severity: medium
    issue: 引用導入の構文が独立文になっている
    rationale: λέγοντοςは「神によってあなたがたに語られたこと」に結びつき、直後の引用を導く。現行の句点後の「こう言われています」は、主語と前節への文法的連結を不明瞭にする。
  revised_text: 死者の復活については、神があなたがたに向けて語られた次の言葉を、読んだことがないのですか。
  revised_footnotes: []
  revision_rationale: 「次の言葉」により、τὸ ῥηθὲν（語られたこと）とλέγοντος（言って）による次節の引用導入を、日本語として自然に一続きで表した。「あなたがたに向けて」は与格ὑμῖνを明示し、神が発話者である点も保持する。
