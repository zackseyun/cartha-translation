  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: ja
  text: 死者の復活については、神があなたがたに向けて語られた次の言葉を、読んだことがないのですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: 死者の復活については
  rationale: περί＋属格が議題を示し、δέが話題の転換を担う。「については」によって、過度な対比を加えず自然に転換を表した。
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: 死者の復活
  rationale: 属格を素直に「死者の」とし、文脈上、死者が復活することを指す標準的で明瞭な表現とした。
- source_word: οὐκ ἀνέγνωτε
  choice: 読んだことがないのですか
  rationale: 修辞疑問の力を保ちつつ、聖書をこれまで読んだ経験と理解を問う自然な現代日本語とした。
- source_word: τὸ ῥηθὲν ὑμῖν
  choice: あなたがたに語られたこと
  rationale: 実体詞的な受動分詞と与格を保ち、聖書の言葉が当時の聞き手にも向けられていることを示す。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 神が
  rationale: ギリシア語では受動文の行為者だが、日本語では「神によって」より能動形の「神が」のほうが自然で、神が語り手である点も明確に保てる。
- source_word: λέγοντος
  choice: こう言われています
  rationale: 次節の直接引用を導く機能を、独立した自然な日本語で示した。現在形により、引用される聖書の言葉の提示として受け取れる。
theological_decisions:
- issue: 神による発話と、現在の聞き手への聖書の呼びかけ
  choice: 神があなたがたに語られたこと
  alternative: 神によってあなたがたに語られたこと
  rationale: 神が発話者であり、その言葉がイエスの聞き手に向けられているという原文の二点を保つ。聖書論について原文以上の説明は加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語。イエスの問いとしての品位を保ちつつ、硬すぎる受動表現を避けた。次節へ続くため、末尾は引用導入として処理した。
