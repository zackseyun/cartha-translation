  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: ja
  text: イエスは彼に言われた。「あなたは、心を尽くし、魂を尽くし[a]、思いを尽くして[b]、あなたの神である主を愛しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魂」は「いのち」または「自分自身」とも訳せる。ギリシア語のψυχήは、文脈により「いのち」「魂」「自分自身」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「思い」は「理解力」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη αὐτῷ
  choice: イエスは彼に言われた
  rationale: 主語は直前の文脈上イエスであり、日本語では明示するほうが自然である。δὲはここでは軽い談話接続なので、独立した接続語を置かず流れを保った。ἔφηは単純に発言を導くため「言われた」とした。
- source_word: Ἀγαπήσεις
  choice: 愛しなさい
  rationale: 形は未来直説法だが、申命記の命令を引用する文脈で命令の力を持つ。現代日本語では「愛しなさい」がその力を明瞭かつ自然に表す。
- source_word: κύριον τὸν θεόν σου
  choice: あなたの神である主
  rationale: κύριοςを「主」、θεόςを「神」とし、同一の方を指す同格関係が日本語で明確になるよう「である」で結んだ。
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: 心を尽くし
  rationale: ἐν＋「すべての」は献身の全体性を表す。日本語の聖書的表現として自然で簡潔な「心を尽くし」を用いた。
- source_word: ψυχῇ
  choice: いのち
  rationale: ψυχήは「魂」「いのち」「自己」を表し得る。ここでは人の生そのものを余すところなく神に向ける意味が伝わる「いのち」を本文に採用し、「魂」を脚注に示した。
- source_word: διανοίᾳ
  choice: 思い
  rationale: διάνοιαは思考・理解の働きを指す。「思い」は自然な日本語で知性を含む内的活動を表し、「理解力」という可能性を脚注に残した。
- source_word: ὅλῃ ... ὅλῃ ... ὅλῃ
  choice: 尽くし……尽くし……尽くして
  rationale: 三度の反復による全体性と修辞的並行を、日本語では各句に「尽くし」を反復して保持した。
theological_decisions:
- issue: 申命記引用における三つの語の区別
  choice: 「心……いのち……思い」の三項を保持する
  alternative: 三項を「全存在」など一語にまとめる
  rationale: καρδία、ψυχή、διάνοιαの語彙上の区別と引用の修辞的形を保ちつつ、それらを人間の厳密な三部分説として説明しない。命令が全人的な神への愛を求めるという緊張をそのまま示す。
- issue: 未来直説法Ἀγαπήσειςの命令的効力
  choice: 「愛しなさい」
  alternative: 「愛するであろう」
  rationale: 律法引用における未来形は命令として機能しているため、予告ではなく命令として訳す。ただし本文以上の義務表現は加えない。
- issue: κύριοςの契約名としての響き
  choice: 「主」
  alternative: 神名を推定して表記する
  rationale: ギリシア語本文のκύριοςに従い「主」とし、引用元の神名を本文へ逆輸入しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法引用にふさわしい簡潔で格調ある命令文とした。「心を尽くす」という定着した自然な表現を三項に展開し、原文の反復を保持した。
