- from: 復活の時には[a]、人はめとることも嫁ぐこともなく、天にいる神の御使いたちのようだからです。
  to: というのも、復活においては、人はめとることも嫁ぐこともなく、天にいる神の御使いたちのようです。
  rationale: γάρの説明的なつながりは「というのも」で表し、婚姻に関する二つの動詞の対句は「めとる／嫁ぐ」で維持した。文末を「ようです」として、原文の比較節を前半の理由に従属させず、比較であって同一化ではないことを保った。「復活においては」により、復活の時点だけでなく復活後の状態をも含みうる原文の表現を本文で保持した。脚注は、この訳文では必要な代替を提示していないため置かない。
