id: MAT.22.30
reference: Matthew 22:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: ja
  text: というのも、復活においては、人はめとることも嫁ぐこともなく、天にいる神の御使いたちのようです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: 復活の時には
  rationale: 復活後の状態を含みうる表現である一方、日本語として自然に文脈上の時・場面を示す。「復活において」という直訳的表現は不自然なため避け、別の可能性を脚注に残した。
- source_word: γαμοῦσιν
  choice: めとる
  rationale: 結婚する側を表す能動形と、続く受動形との区別を保つため、「結婚する」と一般化せず「めとる」とした。
- source_word: γαμίζονται
  choice: 嫁ぐ
  rationale: 受動的に婚姻へ入れられるという古代の婚姻表現を、自然な日本語で示し、γαμοῦσινとの対句を保った。文法上の受動を逐語的に「嫁に出される」とすると現代日本語では強制性を過度に響かせうるため避けた。
- source_word: ὡς
  choice: よう
  rationale: 同一性ではなく比較を示し、復活した人が御使いになるとの含意を避ける。
- source_word: ἄγγελοι θεοῦ
  choice: 神の御使いたち
  rationale: 属格 θεοῦを明示しつつ、聖書本文にふさわしく一般読者にも理解しやすい語を用いた。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天にいる
  rationale: ここでの οὐρανός は物理的な空ではなく御使いたちのいる天を指す。日本語では比較対象を自然に限定する連体表現とした。
- source_word: γὰρ
  choice: だからです
  rationale: 前節への理由説明であることを文末で自然に示す。
theological_decisions:
- issue: 御使いとの比較の範囲
  choice: 復活した人々は、結婚しないという点で御使いたちのようである
  alternative: 復活した人々が御使いそのものになる、または存在様式のあらゆる点で御使いと同じになる
  rationale: ὡς は同一ではなく類似を示し、直前の婚姻に関する記述が比較の直接的な文脈をなす。訳文は比較を保ち、その範囲を本文以上に拡張しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「めとる／嫁ぐ」により原文の能動・受動の対照を簡潔に保った。「御使い」は宗派固有の解釈を伴わない伝統的かつ理解可能な聖書語彙。
