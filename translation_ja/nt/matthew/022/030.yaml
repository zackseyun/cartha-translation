  naturalness: 「復活においては」はやや格調があるが、明瞭な現代標準日本語として自然であり、この文脈では「復活の時」より適切である。「めとることも嫁ぐこともなく」は簡潔で読みやすく、対句も保つ。
  terminology: 「神の御使いたち」は θεοῦ を明示し、聖書本文として理解可能な語彙である。「ようです」は比較を表し、人が御使いそのものになるとの含意を避ける。
