  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在形だが、現代日本語の物語として自然な過去形で表した。主語は文脈上イエスであり、日本語では敬意を込めた言い方が自然である。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 発話の相手を示す与格複数を、自然な日本語で明示した。
- source_word: Τίνος
  choice: だれの
  rationale: 所有または帰属を問う属格疑問代名詞を、曖昧さを狭めず簡潔に表した。二つの名詞それぞれに「だれの」を置き、日本語として問いの関係を明確にした。
- source_word: εἰκών
  choice: 肖像
  rationale: ここでは硬貨に刻まれた人物像を指すため、「像」より具体的で現代の読者に分かりやすい「肖像」とした。
- source_word: αὕτη
  choice: これ
  rationale: 目の前の硬貨上の特徴を指し示す語として自然な日本語にした。
- source_word: ἐπιγραφή
  choice: 銘
  rationale: 硬貨に刻まれた文字を指す語として簡潔で正確。「碑文」では対象に合わず、「文字」では刻まれた銘文という含意が弱い。
- source_word: καὶ
  choice: で
  rationale: 二つの問いを結ぶ並列を、日本語では「肖像で、だれの銘」と自然に接続した。
