  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: ja
  text: しかし、ファリサイ派の人々は、イエスがサドカイ派の人々を黙らせた[a]と聞くと、共に集まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「サドカイ派の人々に口輪をはめた」。ギリシア語の動詞は、ここでは議論で相手を黙らせることを比喩的に表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前のサドカイ派との応答からファリサイ派の動きへ転じる、穏やかな対照を示す。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 当時のユダヤ教内の集団名として、現代日本語で明瞭な慣用表現を用いた。
- source_word: ἀκούσαντες
  choice: 聞いて
  rationale: アオリスト分詞の時間的・付帯的関係を、自然な日本語の接続表現で示した。
- source_word: ἐφίμωσεν
  choice: 黙らせた
  rationale: 本来は「口籠をはめる」を意味し得る動詞だが、ここでは議論で相手を沈黙させたという比喩的意味。本文では自然な意味を示し、原語の比喩は脚注に残した。
- source_word: Σαδδουκαίους
  choice: サドカイ派の人々
  rationale: 当時のユダヤ教内の集団名として、現代日本語で明瞭な慣用表現を用いた。
- source_word: συνήχθησαν
  choice: 集まった
  rationale: 形は受動態だが、文脈上は集団が集合したという自動詞的意味を表す。
- source_word: ἐπὶ τὸ αὐτό
  choice: 一緒に
  rationale: 「同じ場所に」「一つになって」を含み得る慣用句の幅を保ち、場所や目的を過度に特定しない訳とした。
theological_decisions: []
