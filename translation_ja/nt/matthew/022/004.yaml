source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: ja
  text: 王はもう一度、別の奴隷たち[a]を遣わして言った。「招かれた人たちにこう言いなさい。『見なさい、私は私の食事を用意しました。私の雄牛と肥育した家畜も屠られ、すべて用意が整っています。婚宴に来なさい[b]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷たち」は「僕たち」または「召使いたち」とも訳せる。ギリシア語ドゥーロスは、文脈により奴隷または仕える者を指す。
    reason: lexical_alternative
  - marker: b
    text: 「婚宴」は「婚礼」または「結婚の祝い」とも訳せる。ギリシア語の複数形は、結婚を祝う一連の催し全体を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: もう一度
  rationale: 王が使者を改めて遣わす反復を、自然な物語文で表す。
- source_word: ἄλλους δούλους
  choice: 別の奴隷たち
  rationale: ἄλλουςは先に遣わされた者とは別の者を指す。王の家に属して命令に従う者という文脈上、δοῦλοιの社会的身分を保つため「奴隷」とした。
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: 招かれている人たちにこう言いなさい
  rationale: κεκλημένοιςの完了受動が示す、すでに招待を受け、その状態にある人々という含みを保つ。
- source_word: Ἰδοὺ τὸ ἄριστόν μου ἡτοίμακα
  choice: さあ、食事の用意ができました
  rationale: ἰδούの注意喚起を「さあ」で自然に表し、ἡτοίμακαの完了した準備と現在の整った状態を「用意ができました」で示す。ἄριστονは時刻を限定せず「食事」とした。
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: 雄牛も肥えた家畜も
  rationale: ταῦροιは雄牛、σιτιστάは食用に肥育された動物を指す。後者を子牛に限定せず「肥えた家畜」とした。日本語では所有者が文脈上明白なため、二度の「私の」は明示しない。
- source_word: τεθυμένα
  choice: 屠られ
  rationale: 宴席の食事のために動物がすでに屠殺されたことを表す。祭儀的犠牲と誤解されうる「いけにえにされた」は避ける。
- source_word: καὶ πάντα ἕτοιμα
  choice: すべて整っています
  rationale: 宴の準備が全面的に完了している現在の状態を簡潔に表す。
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: 婚宴に来てください
  rationale: γάμοιの複数形は結婚祝い全体または婚宴を指しうる。この食事の文脈では「婚宴」が自然だが、広い意味は脚注で示す。
theological_decisions:
- issue: 王の家における δοῦλοι の訳語
  choice: 奴隷たち
  alternative: 僕たち／召使いたち
  rationale: たとえの王家という文脈では、単なる雇用人よりも主人の権威の下にある身分が前景化するため「奴隷」とした。比喩の神学的対応関係は訳語に付加しない。
- issue: τοὺς γάμους の範囲
  choice: 婚宴
  alternative: 婚礼／結婚の祝い
  rationale: 直前に食事と屠られた家畜が述べられるため婚宴が文脈に適する。ただし複数形が婚礼の祝い全体を指しうる余地を脚注に残す。
translation_notes:
  register: 現代の一般読者に明瞭な、品位ある物語文とした。王の発言は命令の明確さを保ちつつ、招待文は日本語として自然な丁寧表現にした。「奴隷」は歴史的な社会関係を曖昧にしないため本文に置き、代替語を脚注で示した。
