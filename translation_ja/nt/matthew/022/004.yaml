  to: 王はもう一度、別の奴隷たち[a]を遣わして言った。「招かれた人たちにこう言いなさい。『見なさい、私は私の食事を用意しました。私の雄牛と肥育した家畜も屠られ、すべて用意が整っています。婚宴に来なさい[b]。』」
