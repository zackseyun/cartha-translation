  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: ja
  text: では、復活の時、その女は七人のうち誰の妻になるのでしょうか。皆が彼女を妻としていたのですから。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「皆が彼女を持った」。ここでは婚姻関係を指し、「七人全員が彼女と結婚した」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: 復活の時
  rationale: ἐνを伴う与格は時・状況を示す。文脈では死者の将来の復活を指し、日本語では「復活の時」が明確で自然である。
- source_word: οὖν
  choice: では
  rationale: 先行する話から導かれる問いであることを、現代日本語の自然な接続で示す。
- source_word: τίνος τῶν ἑπτὰ
  choice: 七人のうち誰の
  rationale: 七人という集団の中から夫を特定する属格の問いを、自然かつ正確に表す。
- source_word: ἔσται γυνή
  choice: 妻になるのでしょうか
  rationale: γυνήはこの婚姻文脈では「妻」。未来形を「なる」で表し、丁寧な問いの調子を保つ。
- source_word: πάντες
  choice: 皆が
  rationale: 先に述べられた七人全員を簡潔に指す。
- source_word: γὰρ
  choice: のですから
  rationale: 問いの根拠を示すγάρの説明的な働きを、日本語の文末接続で自然に表す。
- source_word: ἔσχον αὐτήν
  choice: 彼女を妻としていた
  rationale: 字義的には「彼女を持った」だが、日本語でそれを直訳すると所有物扱いの含意が過度に強くなる。婚姻関係を指す文脈上の意味を明示しつつ、七人全員との関係を簡潔に保つ。
theological_decisions:
- issue: サドカイ派の問いにおけるἀνάστασιςの意味
  choice: 死者が将来復活する時を指す
  alternative: 漠然とした死後の世界を指す
  rationale: 前後の文脈ではサドカイ派が復活そのものを問題にしており、イエスも続く箇所で同じ主題に答える。「復活の時」とすることで、その具体性を保つ。
- issue: 復活後にも地上と同じ婚姻関係が続くという問いの前提
  choice: 問いとしてそのまま保持する
  alternative: 後続するイエスの答えに合わせて前提をあらかじめ修正する
  rationale: この節はサドカイ派の挑戦的な問いを述べる箇所であり、その誤った可能性のある前提を翻訳者が先回りして解消すべきではない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、議論の場にふさわしい丁寧さと格調を保った。「その女」は直前の物語に登場する女性を指し、「では」で推論的な問いへの移行を示した。
