reference: Matthew 22:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: ja
  text: その奴隷たちは通りへ出て行き、見つけた人を、悪い者も良い者もみな集めた。こうして婚宴の場[a]は、食卓に着いた客[b]でいっぱいになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「婚礼」。ここでは、客でいっぱいになったと述べられているため、婚宴またはその会場を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 原文は「横になっている者たち」。当時、正式な宴席では横になって食事をするのが習慣だった。
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隷たち
  rationale: 王の支配下にある家の者という当時の社会的身分を弱めずに表すため。「僕」や「召使いたち」より原語の拘束された身分が明確である。
- source_word: ὁδοὺς
  choice: 通り
  rationale: 人々が行き交う公の道を広く指す文脈に合い、現代日本語として自然である。
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: 見つけた人を…みな集めた
  rationale: πάντας の包括性と、見つけた人々を一人残らず集めたという関係節の意味を明瞭に伝える。
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: 悪い者も良い者も
  rationale: 道徳的な対比を保ちつつ、人物を指す自然な日本語とした。「悪人も善人も」よりも文脈上の分類を固定化しすぎない。
- source_word: γάμος
  choice: 婚宴の場
  rationale: 語自体は婚礼または婚宴を指し得るが、ここでは客で満たされるものとして描かれるため、婚宴が行われる場を表す。ただし原語の幅は脚注に残した。
- source_word: ἐπλήσθη
  choice: いっぱいになった
  rationale: その場が客で満たされたという受動表現を、明瞭で自然な現代日本語にした。
- source_word: ἀνακειμένων
  choice: 食卓に着いた客
  rationale: 古代の正式な食事で横になって食卓に着く姿勢を表す。本文では機能的に自然な表現とし、具体的な姿勢は脚注で説明した。
theological_decisions:
- issue: 集められた人々の道徳的性格
  choice: 悪い者も良い者も
  alternative: 悪人も善人も
  rationale: 招きの無差別な広がりを示しながら、宴席にいることと後に問われる応答との関係を、この節だけで教理的に解決しない。原文の道徳的対比をそのまま保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「奴隷」は歴史的な社会的身分を婉曲化せず、「婚宴の場」と「食卓に着いた客」は情景が普通の読者に伝わるよう最適等価で表現した。
