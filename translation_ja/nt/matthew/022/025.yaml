reference: Matthew 22:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: ja
  text: 私たちのところに、七人の兄弟がいました。最初の者は結婚して、子孫[a]を残さずに死に、妻を自分の兄弟に残しました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「種を持たずに」。ここで「種」は子または子孫を意味する。
    reason: lexical_alternative
  - marker: b
    text: これは、亡くなった男性の兄弟がその未亡人を妻とし、亡くなった男性のために子孫を残すことを求められたレビラト婚（兄弟婚）の慣習を踏まえている。申命記25章5節参照。
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: 私たちのところに
  rationale: 話し手たちの共同体内にいたことを表す自然な日本語。場所だけでなく、彼らの間での存在という含みも保つ。
- source_word: ἑπτὰ ἀδελφοί
  choice: 七人の兄弟
  rationale: レビラト婚をめぐる文脈で、同胞である男性たちを指す。
- source_word: ὁ πρῶτος
  choice: 最初の者
  rationale: 年齢上の長男とは明記されておらず、七人のうちの順序を示すため、「長男」と限定しない。
- source_word: γήμας
  choice: 結婚しましたが
  rationale: アオリスト分詞が死に先立つ結婚を表すため、その時間的順序を自然な日本語で示す。後続する死との対照を「が」で滑らかにつなぐ。
- source_word: ἐτελεύτησεν
  choice: 死に
  rationale: 婉曲化せず、生命の終わりを明確かつ簡潔に表す。
- source_word: μὴ ἔχων σπέρμα
  choice: 子孫を残さずに
  rationale: σπέρμαの字義は「種」だが、ここでは家系を継ぐ子または子孫を指す。「子孫」は法的・系譜的な含みを保ち、「残さずに」は死亡時に子孫がいなかったことを自然に表す。
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: 妻を…残しました
  rationale: 死後に妻を後に残したことを表し、離縁や遺棄とは解さない。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 自分の兄弟に
  rationale: 与格が、妻を託された生存中の兄弟を示す。「弟」とは明記されていないため、年齢関係を限定しない。
theological_decisions:
- issue: レビラト婚の背景を本文で明示するか
  choice: ギリシア語本文どおり、妻を兄弟に残したとのみ訳し、結婚の目的は注で説明する。
  alternative: 「妻を、自分の兄弟がめとるように残しました」と本文で補う。
  rationale: 申命記25章5節の慣習は前提とされているが、原文はこの節で「めとるように」と明記していない。本文では含意を保ちつつ補足しすぎず、文化的背景を脚注に置く。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文として落ち着いた語調を採用した。「最初の者」「自分の兄弟」として、原文にない年齢順を持ち込まない。脚注記号は該当語句と文化的含意の位置にそれぞれ付した。
