  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: ja
  text: ところが、ほかの者たちはその王の奴隷たち[a]を捕らえ、乱暴に扱い、殺した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「僕たち」「召使いたち」とも訳せる。
    reason: δοῦλοςは隷属的身分に焦点を当てれば「奴隷」、仕える役割に焦点を当てれば「僕」または「召使い」と訳し得るため。
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: ところが、ほかの者たちは
  rationale: λοιποίは、前節で招きを意に介さなかった者たちとは別の、残りの招待客を指す。δέの穏やかな対照を「ところが」で表した。
- source_word: κρατήσαντες
  choice: 捕らえ
  rationale: κρατέωの「つかむ、取り押さえる」という意味を、この暴力的な文脈に即して「捕らえる」とした。アオリスト分詞と後続動詞の流れは、日本語の連用形で自然に表した。
- source_word: τοὺς δούλους αὐτοῦ
  choice: 王の奴隷たち[a]
  rationale: αὐτοῦが指す王を明示し、δοῦλοςが持つ隷属的な身分を「奴隷」で保った。一方、この文脈では「僕」も自然な訳なので脚注に示した。
- source_word: ὕβρισαν
  choice: 辱めた
  rationale: ὑβρίζωは単なる言葉上の侮辱に限らず、相手を辱める乱暴で恥ずべき扱いを含む。「辱めた」はその幅を保つ。
- source_word: ἀπέκτειναν
  choice: 殺した
  rationale: ἀποκτείνωを直接的に訳し、原語に明示されない法的評価を加える「殺害した」「謀殺した」は避けた。
theological_decisions:
- issue: たとえ話におけるδοῦλοςの訳語
  choice: 奴隷
  alternative: 僕／召使い
  rationale: 王に属して使者として遣わされる者たちの隷属的な社会的身分を隠さないため「奴隷」とした。ただし、ここでの役割に重点を置けば「僕」も可能であり、特定の神学的解釈に固定しないよう脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「捕らえ、辱めたうえで殺した」とし、行為の進行と結末を自然に示した。
