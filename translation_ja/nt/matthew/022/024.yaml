  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: ja
  text: こう言った。「先生、モーセは言いました。『もし、ある男が子どもを残さずに死んだなら、死んだ男の兄弟はその妻と結婚し[a]、兄弟のために子孫を残さなければならない。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より厳密には、「その兄弟は未亡人に対して夫の兄弟としての務めを果たさなければならない」とも訳せる。ギリシア語は、亡くなった男性の兄弟がその未亡人と結婚して家系を継ぐ、レビラト婚を特に指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 先生
  rationale: イエスを教える者として呼びかける自然な現代日本語。
- source_word: Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα
  choice: もし、ある男が子どもを残さずに死んだなら
  rationale: 男性を想定した律法上の事例であることを保ち、τέκναを性別を限定しない「子ども」とした。文脈上は死亡時に子がいないことを表すため、日本語では「子どもを残さずに」が自然。
- source_word: ἐπιγαμβρεύσει
  choice: その兄弟が彼の妻と結婚し
  rationale: レビラト婚を指す専門的な動詞の中心的意味を明瞭に訳し、制度固有の含意は脚注に示した。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 彼の妻
  rationale: 死んだ男の妻を指す代名詞構造を直接保った。文脈上、現在は未亡人である。
- source_word: ἀναστήσει σπέρμα
  choice: 子孫を残さなければならない
  rationale: 直訳的な「種を起こす」を避け、亡くなった兄弟の家系を継ぐ子をもうけるという慣用句の意味を自然な日本語で表した。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 兄弟のために
  rationale: 与格の受益・帰属の意味を保ち、その子孫が死んだ兄弟のためのものと見なされることを表した。
theological_decisions:
- issue: 律法上の事例における性別表現
  choice: 「ある男」「その兄弟」と訳す
  alternative: 「ある人」「その人のきょうだい」と中性化する
  rationale: 引用されているレビラト婚の規定は、夫の死とその兄弟の義務という男性の親族関係を具体的に扱っているため、原文の性別を保った。
- issue: σπέρμαの家系上の含意
  choice: 「兄弟のために子孫を残す」とする
  alternative: 「兄弟のために種を起こす」と直訳する
  rationale: 子が法的・家系的に亡き兄弟へ帰属するという緊張を「兄弟のために」で保ちつつ、現代日本語で誤解されやすい「種」は避けた。
translation_notes:
  register: 引用内引用が明確になるよう、日本語のかぎ括弧と二重かぎ括弧を用いた。全体は現代の読者に分かりやすく、律法の引用にふさわしい端正な文体とした。「こう言った」は前節から続く分詞 λέγοντες を反映する。
