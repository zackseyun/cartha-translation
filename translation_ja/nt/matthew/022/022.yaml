  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: ja
  text: 彼らはこれを聞いて驚き、イエスを残して立ち去った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞いて
  rationale: アオリスト能動分詞を、主動詞に先立つ行為として自然な現代日本語で表した。目的語は原文では明示されないが、文脈上イエスの答えを指すため「これ」を補った。
- source_word: ἐθαύμασαν
  choice: 驚き
  rationale: θαυμάζωが表す驚嘆・驚きを、簡潔で現代的な「驚く」で表した。
- source_word: ἀφέντες αὐτὸν
  choice: イエスを残して
  rationale: ἀφίημιの「その場に残して去る」という意味を反映した。「ひとり残して」は原文に明示されない含意を加えるため避け、代名詞は日本語で指示対象を明確にするため固有名にした。
- source_word: ἀπῆλθαν
  choice: 立ち去った
  rationale: その場から去るというἀπέρχομαιの意味を、自然で簡潔な物語文として表した。
- source_word: καὶ ... καὶ
  choice: 〜て…、〜て…
  rationale: 反復するκαίによる出来事の連続を、日本語では接続助詞と読点によって自然に表した。
