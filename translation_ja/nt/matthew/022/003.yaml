source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: ja
  text: 王は、婚宴に招いておいた人々を呼ぶために、しもべたちを遣わした[a][b]。しかし、人々は来ようとしなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」は「奴隷」とも訳せる。ギリシア語はどちらの意味にもなり得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「呼ばれていた人々を呼ぶために」。原文では「呼ぶ」と同じ語族が繰り返されるが、ここでは以前から招待されていた人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 遣わして
  rationale: アオリストの単純な派遣を表す。王が使者として送り出す文脈にふさわしい、自然で格調ある表現。
- source_word: δούλους
  choice: しもべたち
  rationale: δοῦλοςは奴隷または奉仕者を指し得る。ここでは隷属身分そのものより王の使者としての役割が前面に出るため、「しもべ」とした。
- source_word: καλέσαι
  choice: 呼ばせた
  rationale: 目的を表す不定詞を、日本語では使役表現によって自然に示した。既に招待された人々を婚宴へ呼びに行く意味を保つ。
- source_word: τοὺς κεκλημένους
  choice: 招いておいた人々
  rationale: καλέωの完了受動分詞で、以前から招待済みの人々を指す。「招いておいた」は先行する招待とその効力を自然に表す。
- source_word: εἰς τοὺς γάμους
  choice: 婚宴に
  rationale: 複数形γάμοιはこの文脈で婚礼の祝宴を指す。「婚宴」は簡潔で、単なる結婚式ではなく宴席であることを示す。
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: 来ようとしなかった
  rationale: 意志を表すἤθελονを保持し、単に来なかったのではなく来る意思がなかったことを示す。「拒んだ」ほど明示的に強めない。
theological_decisions:
- issue: δοῦλοςの訳語
  choice: しもべ
  alternative: 奴隷
  rationale: このたとえでは、人物の法的・社会的身分より、王に遣わされる使者としての働きが焦点である。「奴隷」という可能性は脚注で保持する。
- issue: καλέω語群の反復
  choice: 「招いておいた」と「呼ばせた」で文脈上の異なる機能を訳し分ける
  alternative: 両方を「呼ぶ」でそろえる
  rationale: 原文は同じ語族を反復するが、完了受動分詞は以前の招待を、不定詞は宴へ呼び出す行為を示す。日本語の明瞭さを優先しつつ、脚注で語の反復を明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話にふさわしい簡潔で品位ある叙述とした。「婚宴」はやや文語的だが一般読者にも理解可能で、γάμοιの祝宴という意味を正確に伝える。
