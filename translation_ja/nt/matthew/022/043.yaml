  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: ja
  text: イエスは彼らに言われた。「では、どうしてダビデは霊によって[a]、彼を『主』[b]と呼び、こう言っているのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖霊によって」とも訳せます。直訳では「霊にあって」です。ギリシア語の表現は、霊のうちで語ることと、霊によって語ることの両方を示し得ます。
    reason: lexical_alternative
  - marker: b
    text: 「主人」とも訳せます。ギリシア語のκύριοςは、権威ある者を指す称号で、ここでは一般に「主」と訳されます。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: イエスは彼らに言われた
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形で表した。主語の「イエス」は文脈から補った。
- source_word: Πῶς οὖν
  choice: では、どうして
  rationale: πῶςの問いの力と、οὖνの推論・論述継続のニュアンスを、自然な現代日本語で保った。
- source_word: Δαυὶδ
  choice: ダビデ
  rationale: 日本語聖書で広く定着している固有名詞表記を用いた。
- source_word: ἐν πνεύματι
  choice: 御霊によって
  rationale: ここでは聖霊を指す可能性が高い。「によって」は日本語として自然で、霊に動かされた発言という作用を表すが、ἐνが領域を示す可能性は脚注に残した。
- source_word: καλεῖ αὐτὸν κύριον
  choice: 彼を『主』と呼び
  rationale: αὐτόνを曖昧なまま「彼」とし、κύριοςは詩篇引用における称号として「主」と訳した。
- source_word: λέγων
  choice: こう言っている
  rationale: 後続する引用を導く分詞を、日本語で自然に接続しつつ現在の引用行為として表した。
theological_decisions:
- issue: ἐν πνεύματιの「霊」が指すもの
  choice: 聖霊を指すものとして「御霊」と表記
  alternative: ダビデ自身の霊、または霊的状態
  rationale: 聖書の引用を根拠とする文脈では、ダビデが聖霊の働きのもとで語ったことを指す可能性が高い。ただし前置詞ἐνの領域・手段の幅は脚注で示した。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: メシアに関する詩篇110篇の引用を導く文脈であり、称号としての重要性と引用上のつながりを保つため「主」とした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの発話には「言われた」を用いて品位を保った。後続節の詩篇引用へ続く導入文であるため、末尾は引用を予告する形にした。
