id: MAT.22.32
reference: Matthew 22:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: ja
  text: 『わたしはアブラハムの神、イサクの神、ヤコブの神である。』神は死んだ者たちの神ではなく、生きている者たちの神である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: わたしは…である
  rationale: 現在時制による直接の自己表明を保ち、引用された聖書の文言と、そこから導かれる議論の力を自然な日本語で示す。
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: アブラハムの神、イサクの神、ヤコブの神
  rationale: 原文における「神」の反復を省略せず、それぞれの族長との関係を強調する修辞的な重みを保つ。接続は日本語として自然な読点で表した。
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: 神は…神ではなく
  rationale: 原文で明示的に反復される「神」を日本語でも保持する。主語と述語に同じ語が現れるが、日本語として理解可能であり、対句の構造も明瞭になる。
- source_word: νεκρῶν
  choice: 死んだ者たち
  rationale: 実体詞的に用いられた複数形容詞を、人々を指すことが明確な現代日本語で表した。「死者」より平明で、ζώντωνとの対照も保てる。
- source_word: ζώντων
  choice: 生きている者たち
  rationale: 実体詞的な現在分詞を現在的・継続的な響きを保って訳し、「死んだ者たち」との簡潔な対照を示す。
theological_decisions:
- issue: 復活についての議論において、族長たちが神の前に生きていることが含意される点
  choice: 神は死んだ者たちの神ではなく、生きている者たちの神である
  alternative: 神は死んだ人々の神ではなく、今も神に対して生きている人々の神である
  rationale: 本文の対句をそのまま訳し、復活や中間状態について説明的な語句を加えない。これにより、イエスの議論の力を保ちつつ、本文以上に神学的結論を限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」は引用中の神の自己表明にふさわしい平明な表記とし、文末の「である」によって宣言と論証の重みを保った。引用符には日本語のかぎ括弧を用いた。
