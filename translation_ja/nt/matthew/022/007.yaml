id: MAT.22.7
reference: Matthew 22:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: ja
  text: しかし、王は怒り、自分の軍勢を送って、その殺人者たちを滅ぼし、彼らの町を焼き払った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: 怒り
  rationale: アオリスト受動形だが、感情の発生を表す慣用的な受動として、自然な日本語の能動表現にした。
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: 軍隊
  rationale: 複数形は複数の部隊・軍勢を指し得るが、日本語では集合的な「軍隊」が文脈に自然である。
- source_word: τοὺς φονεῖς ἐκείνους
  choice: その人殺したち
  rationale: φονεύςの直接的な意味を保ち、直前に使者を殺した者たちを指すἐκείνουςを「その」で表した。
- source_word: ἀπώλεσεν
  choice: 滅ぼし
  rationale: 王の軍事行動による完全な殺害・破滅を表す強い動詞として訳した。
- source_word: ἐνέπρησεν
  choice: 焼き払った
  rationale: 単に火をつけるだけでなく、町を焼き滅ぼす行為を自然かつ明確に表す。
theological_decisions:
- issue: たとえにおける王の怒りと裁き
  choice: 原文どおり、王が怒って殺人者を滅ぼし、町を焼いたと明記する
  alternative: 象徴的意味を訳文中で説明または緩和する
  rationale: 本文はたとえの物語として裁きの厳しさを描いているため、その神学的緊張を解説で解消せず保持した。
- issue: πέμψαςの統語関係
  choice: 「軍隊を遣わして」とし、後続する二つの行為に結びつける
  alternative: 英語POBのように「軍隊を遣わし、…滅ぼし」と等位的に訳す
  rationale: アオリスト分詞の従属関係を保ちつつ、日本語として自然な出来事の流れを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「人殺したち」は原語の具体性を保つ平易な表現であり、「焼き払った」は軍事的破壊を簡潔に伝える。
