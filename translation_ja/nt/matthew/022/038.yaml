  text: αὕτη ἐστὶν ⸂ἡ μεγάλη καὶ πρώτη⸃ ἐντολή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: ja
  text: これは、偉大であり、第一の戒めです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、「偉大な」と「第一の」という二つの形容語が「戒め」にかかっています。「第一の戒め」とも訳せます。
    reason: 原文の二つの並列した形容語を明示し、「偉大な」を最上級化しない本文訳の根拠を示すため。
lexical_decisions:
- source_word: αὕτη
  choice: これが
  rationale: 直前の37節で引用された戒めを指す指示代名詞。日本語では「これが」が自然に照応を示す。
- source_word: ἐστὶν
  choice: です
  rationale: 現在形の単純な繋辞として、現代標準日本語で自然な丁寧体にした。
- source_word: μεγάλη
  choice: 最も重要な
  rationale: ここでは物理的な大きさではなく、戒めの重要性・格の高さを表す。「大きな」より意味が明瞭である。ただし語形自体は最上級ではないため、その点は脚注で補う。
- source_word: πρώτη
  choice: 第一の
  rationale: 順序または順位における「第一」を明示し、μεγάληとは別個の修飾語であることを保つ。
- source_word: ἐντολή
  choice: 戒め
  rationale: 律法をめぐる文脈と聖書的な語調に適し、一般の読者にも理解しやすい。
theological_decisions:
- issue: μεγάλη と πρώτη が戒めをどのように修飾するか
  choice: 二つの形容を「最も重要な第一の戒め」として、ともに本文に反映する。
  alternative: 「第一の戒めです」または「最も重要な戒めです」と一つの概念にまとめる。
  rationale: ギリシア語は「重要性の大きさ」と「第一であること」を並列しており、どちらか一方へ統合すると原文の重なった強調が失われる。一方、日本語の「大いなる第一の戒め」は不自然なため、文脈上の意味を明瞭にした。
translation_notes:
  register: 明瞭で現代的な標準日本語の丁寧体。「戒め」で聖書的な品位を保ちつつ、「最も重要な」で意味を自然に伝えた。脚注標識[a]は本文に明記した。
