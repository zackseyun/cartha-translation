  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: ja
  text: というのは、呼ばれた者は多いが、選ばれた者は少ないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: 多い
  rationale: 名詞的に用いられ、「多くの人」を意味する。日本語では後続の「人」と合わせて自然に表し、ὀλίγοιとの対照を保った。
- source_word: γάρ
  choice: からです
  rationale: 直前のたとえを受ける説明・理由の接続を、現代日本語で自然な文末表現として示した。
- source_word: εἰσιν
  choice: いる
  rationale: 人を指す複数主語に対する現在形の連結動詞を、日本語では「いる」で表した。
- source_word: κλητοὶ
  choice: 招かれている人
  rationale: 「呼ばれた者」と「招かれた者」の両義があり、婚宴のたとえという直接の文脈では「招かれている人」が明瞭で自然である。より広い「呼ばれている人」は脚注に残した。
- source_word: ὀλίγοι
  choice: 少ない
  rationale: πολλοὶとの簡潔な対照をそのまま保つ表現である。
- source_word: δὲ
  choice: が
  rationale: 二つの節の対照を、簡潔で自然な逆接として示した。
- source_word: ἐκλεκτοί
  choice: 選ばれている人
  rationale: 基本的な語義を透明に表し、後代の教理用語を本文に持ち込まず、「選ばれた者」という別表現を脚注に示した。
theological_decisions:
- issue: κλητοίを婚宴への招待として訳すか、より広い召命を響かせる表現にするか
  choice: 招かれている人
  alternative: 呼ばれている人
  rationale: 直前の婚宴のたとえに即して「招かれている」が自然である一方、原語の「呼ぶ」という広い意味を失わせないため、代案を脚注に示した。
- issue: ἐκλεκτοίを教理用語として訳すか、一般的な語義で訳すか
  choice: 選ばれている人
  alternative: 選ばれた者
  rationale: 原語の選びの概念を保ちつつ、特定の教派的な予定論を本文だけで確定しない表現を採用した。
translation_notes:
  register: 簡潔なたとえの結語らしい格調を保ちつつ、普通の現代日本語として理解しやすい表現にした。理由を示す γάρ は文末の「からです」で表し、原文の「多い／少ない」という鋭い対照を維持した。
