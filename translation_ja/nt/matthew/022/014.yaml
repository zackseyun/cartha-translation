review_pass:
  verdict: revise
  source_fidelity: κλῆτοι and ἐκλεκτοί are substantival plural adjectives. The draft's progressive forms「招かれている人」「選ばれている人」can suggest an ongoing state not expressed by the Greek. 「呼ばれた者／選ばれた者」more directly preserves the concise passive-adjectival contrast. γάρ is retained by the explanatory opening「というのは」.
  naturalness: 「というのは、呼ばれた者は多いが、選ばれた者は少ないからです。」is clear modern standard Japanese and retains the terse proverbial contrast. 「者」is suitably concise and avoids the repetitive「人は…人は」.
  terminology: 「呼ばれた者」retains the broader lexical resonance of κλῆτοι without making a doctrinal claim. The banquet-specific alternative「招かれた者」is retained in a footnote. 「選ばれた者」is the direct, non-sectarian rendering of ἐκλεκτοί; a footnote may note「選民」as a traditional lexical alternative without imposing it on the text.
  issues:
  - severity: medium
    issue: κλῆτοι is rendered with a progressive form and the primary lexical preference is reversed.
    rationale: 「招かれている人」adds progressive aspect and foregrounds only the banquet sense. The source term can carry banquet-invitation nuance, but its broader sense is appropriately represented by「呼ばれた者」in the main text, with「招かれた者」noted.
  - severity: medium
    issue: ἐκλεκτοί is rendered with a progressive form.
    rationale: 「選ばれている人」can imply a continuing process or status. 「選ばれた者」more closely reflects the Greek adjective and maintains the compact contrast with κλῆτοι.
  - severity: low
    issue: The explanatory force of γάρ is placed only as sentence-final「からです」.
    rationale: This is possible Japanese, but an opening explanatory construction more clearly reflects the Greek connective while keeping natural Japanese.
  revised_text: というのは、呼ばれた者は多いが、選ばれた者は少ないからです。
  revised_footnotes:
  - marker: a
    text: または「招かれた者」。婚宴のたとえの文脈では、この意味もあり得る。
    reason: lexical_alternative
  - marker: b
    text: または「選民」。
    reason: lexical_alternative
