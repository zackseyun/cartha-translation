  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: ja
  text: その日、サドカイ派の人々がイエスのもとに来て[a]、復活はないと言い、イエスに質問した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より明示的には、「復活はないと主張するサドカイ派の人々がイエスのもとに来て」。
    reason: λέγοντες をサドカイ派の特徴的な見解を示す限定的表現として訳す可能性を示すため。
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日
  rationale: 自然な現代日本語の時を表す表現であり、直前の出来事と同じ日を指す文脈上のつながりを保つ。
- source_word: προσῆλθον αὐτῷ
  choice: イエスのもとに来て
  rationale: προσέρχομαι の「近づく、もとに来る」という意味を自然に表す。代名詞の指示対象は文脈上イエスなので、日本語で明確にした。
- source_word: Σαδδουκαῖοι
  choice: サドカイ派の人々
  rationale: ユダヤ教内の集団名として一般読者に分かりやすい標準的な表現を用いた。
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: 復活はないと言い
  rationale: 分詞構文を本文の語順に沿って表しつつ、その発言が当日のものとも彼らの恒常的見解とも読める余地を残した。より明示的な限定用法は脚注に示した。
- source_word: ἀνάστασιν
  choice: 復活
  rationale: 死者が再び生きることを指す新約聖書の標準的な用語であり、原語の神学的含意を保つ。
- source_word: ἐπηρώτησαν αὐτόν
  choice: イエスに質問した
  rationale: 問いかける、尋ねるという意味を明確に表す。「尋問した」ほど敵対的な含意を加えず、文脈上の問いを自然に示す。
theological_decisions:
- issue: サドカイ派による復活の否定の表し方
  choice: 復活はないと言い
  alternative: 復活はないと主張するサドカイ派の人々が
  rationale: ギリシア語の現在分詞は、その場での発言としても彼らを特徴づける見解としても表現できる。本文では構文を近く保ち、脚注で恒常的見解を明示する読みを提示して、復活についての否定を語り手の主張と誤認させないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「サドカイ派の人々」として集団名を説明的に表し、専門知識のない読者にも読みやすくした。
