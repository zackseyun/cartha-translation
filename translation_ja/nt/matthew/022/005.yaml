id: MAT.22.5
reference: Matthew 22:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: ja
  text: しかし、彼らは気にも留めず[a]、立ち去った。ある者は自分の畑へ、別の者は自分の商売へ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「顧みず」「意に介さず」。文脈上、王の招きを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: 気にも留めず
  rationale: 招きを意に介さず、顧みない態度を表す分詞。目的語はギリシア語と同様に明示せず、文脈に委ねながら、現代日本語として自然な表現にした。
- source_word: ἀπῆλθον
  choice: 立ち去った
  rationale: 王の招きから離れてそれぞれの用事へ向かう物語上の動きを、簡潔で自然に表す。
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ある者は……別の者は
  rationale: μέν……δέを伴う配分的な対照を、明瞭な現代日本語で保持する。
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: 自分の畑へ
  rationale: ἀγρόςの基本的意味である「畑」を採り、ἴδιονの「自分の」も明示して私的な関心との対照を保つ。
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: 自分の商売へ
  rationale: ἐμπορίαは交易・商業活動を指すため、農作業との対照が分かりやすい現代語「商売」とした。目的地を表す日本語として「へ」を用いた。
theological_decisions:
- issue: ἀμελήσαντεςの暗黙の目的語
  choice: 目的語を明示せず「気にも留めず」と訳す
  alternative: 「その招きを無視して」「それを顧みず」
  rationale: 直前の文脈では王の招きが対象だが、原文は目的語を明示していない。日本語でも自然に省略できるため、文脈上の意味を保ちつつ、原文以上に限定しない。
translation_notes:
  register: 明瞭で現代的だが、たとえ話の品位を損なわない叙述調とした。「商売」は日常的で理解しやすく、ἐμπορίαの商業活動という意味を自然に伝える。
