base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: ja
  text: イエスは答えて[a]、再び彼らにたとえを用いて、こう言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「応じて、再び彼らにたとえを用いて語り、こう言われた」とも訳せる。ギリシア語の「答えて」は、直前に明示的な質問がない場合にも用いられる一般的な物語上の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （日本語では独立した接続語を置かない）
  rationale: 前後の物語の連続は語順と文脈で自然に伝わるため、「そして」を機械的に加えず、現代日本語として明瞭にした。
- source_word: ἀποκριθεὶς
  choice: 答えて
  rationale: ἀποκρίνομαι のアオリスト分詞。直前に明示的な質問がない場合にも用いられるギリシア語の物語上の慣用表現を保持した。
- source_word: ὁ Ἰησοῦς
  choice: イエスは
  rationale: 固有名を自然な日本語で示し、主題を表す助詞「は」を用いた。
- source_word: πάλιν
  choice: 再び
  rationale: 語りかける行為が繰り返されることを、簡潔かつ直接に表す。
- source_word: εἶπεν
  choice: 言われた
  rationale: 後続の発言内容を導入する語として自然であり、イエスへの敬意を表す一般的で穏当な敬語を用いた。
- source_word: ἐν παραβολαῖς
  choice: たとえを用い
  rationale: ἐν と複数形 παραβολαῖς が示す話し方・手段を、現代日本語で自然に表した。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 語りかける相手を示す与格代名詞を直接訳した。
- source_word: λέγων
  choice: こう
  rationale: 後続する発言内容を導く現在分詞の機能を、日本語の引用導入として自然な「こう」で表した。
theological_decisions:
- issue: 直前に明示的な質問がない箇所での「答えて」の意味
  choice: 本文に「答えて」を残す
  alternative: 「応じて」または省略する
  rationale: ここは特定の神学的主張ではなく、ギリシア語に一般的な物語上の言い回しである。意味を過度に限定せず、原文の談話上の連続性を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた品位を保った。「言われた」は過度に古風ではない一般的な敬語表現。
