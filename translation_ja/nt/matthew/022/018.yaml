base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: ja
  text: しかしイエスは、彼らの悪意を見抜いて言われた。「偽善者たち、なぜわたしを試すのか」[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なぜわたしを誘惑するのか」とも訳せる。このギリシア語動詞は文脈により「試す」「試みる」「誘惑する」を意味し、この場面では「罠にかけようとする」という含みもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: 見抜いて
  rationale: アオリスト分詞で、主動詞「言われた」に先立つ認識を表す。文脈では、相手が隠している悪意を察知したという意味を自然な日本語で示す。
- source_word: δὲ
  choice: しかし
  rationale: 相手の取り入るような言葉と、それを見抜いたイエスの応答との対照を示す。
- source_word: πονηρίαν
  choice: 悪意
  rationale: 語は「悪」「邪悪さ」も意味し得るが、ここでは罠にかけようとする敵対的な意図を指すため、「悪意」が簡潔で文脈に即している。
- source_word: εἶπεν
  choice: 言われた
  rationale: 物語文の標準的な訳。イエスへの自然で品位ある敬語として尊敬表現を用いる。
- source_word: Τί
  choice: なぜ
  rationale: 動詞を伴うこの用法では理由を問う疑問詞として働くため、日本語では「なぜ」が自然である。
- source_word: πειράζετε
  choice: 試す
  rationale: πειράζωには「試す」「試みる」「誘惑する」の意味幅がある。この場面では罠にかけるために試す意味が中心だが、訳語を「試す」として原語の幅を保つ。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: 誠実さを装いながら敵意を隠す者たちを指す、定着した明瞭な訳語である。
theological_decisions:
- issue: イエスが相手の内心を認識したことの表現
  choice: 彼らの悪意を見抜いた
  alternative: 彼らの邪悪さを知っていた
  rationale: 本文はイエスが彼らの企みの道徳的性質を正確に認識したと述べる。「見抜く」は隠された動機の察知を表すが、それ以上の教理的説明は加えない。
- issue: πειράζωの意味幅
  choice: 試す
  alternative: 誘惑する／罠にかける
  rationale: 文脈上はイエスを陥れようとする試みだが、「誘惑する」だけに限定せず、原語が持つ「試す」と「誘惑する」の緊張を脚注で保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語を用いた。直接話法は簡潔さと鋭さを保ち、「偽善者たち」を呼びかけとして前置した。
