base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: ja
  text: 律法全体と預言者たちは、この二つの戒めにかかっている[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「かかっている」は、原文の「ぶら下がる、掛かる」という比喩を保った表現。ここでは「依存している」「これらに基づいている」という意味を含む。
    reason: lexical_alternative
  - marker: b
    text: 「律法と預言者たち」は、ユダヤ教の聖書に関わる定型的な言い方。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: この二つの戒めに
  rationale: ἐνを日本語の「に」で表し、κρέματαιとの結びつきによる「～にかかっている」という依存の比喩を自然に保った。
- source_word: ὅλος ὁ νόμος
  choice: 律法全体
  rationale: ὅλοςの包括性を「全体」で明示し、νόμοςはこの文脈でトーラーを指すため「律法」とした。
- source_word: κρέμαται
  choice: かかっている
  rationale: 「依存している」と説明的に言い換えず、「掛かる」と「係る」の両方を響かせ得る日本語で、原文の比喩と意味を保った。
- source_word: καὶ οἱ προφῆται
  choice: と預言者たち
  rationale: 定型句「律法と預言者たち」の後半を保ち、単なる個々の人物だけでなく預言書ないし預言者による聖書的証言を指し得る表現とした。
theological_decisions:
- issue: 「律法と預言者たち」が指す範囲
  choice: 聖書的証言の全体を示す定型句として、そのまま「律法全体と預言者たち」と訳す
  alternative: 倫理的な律法と預言者の教えだけを指すと限定する、または「聖書全体」と言い換える
  rationale: マタイにおける定型的な響きを残しつつ、二つの愛の戒めに聖書的証言全体が依存し、そこに要約されるという関係を示す。訳文自体ではその関係を一義的に説明し切らず、原文の神学的な含みを保った。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書用語として定着した「律法」「預言者たち」「戒め」を採用した。「かかっている」によって原文の鮮明な比喩と依存関係の双方を簡潔に表した。
