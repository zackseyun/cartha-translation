  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: ja
  text: 「主は私の主に言われた。『私があなたの敵をあなたの足の下に置く[a]まで、私の右に座っていなさい。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 詩編110編1節のヘブライ語の表現に従えば、「あなたの敵をあなたの足台とする」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος … τῷ κυρίῳ μου
  choice: 主は私の主に
  rationale: ギリシア語は二つの指示対象に同じκύριοςを用いているため、日本語でも同じ「主」を用いる。「私の」によって両者の関係上の区別を保ち、本文にない固有の区別を持ち込まない。
- source_word: Εἶπεν
  choice: 言われた
  rationale: 単純な発話を表すアオリストとして訳した。第一の「主」が神を指す文脈に合う自然な敬語表現であり、「宣言された」ほど意味を強めない。
- source_word: Κάθου
  choice: 座っていなさい
  rationale: 即位と統治の座にとどまる含みを持つ現在命令形を、自然な現代日本語で表す。「座りなさい」より継続性が伝わる。
- source_word: ἐκ δεξιῶν μου
  choice: 私の右に
  rationale: 権威と栄誉の場所を示す慣用句。「私の右手に」では身体の手そのものと誤解され得るため、位置を明確にした。
- source_word: ἕως ἂν θῶ
  choice: 私が…置くまで
  rationale: ἕως ἄνとアオリスト接続法が示す将来の到達点を、簡潔に「まで」で表した。
- source_word: τοὺς ἐχθρούς σου
  choice: あなたの敵を
  rationale: 一般的で明瞭な対応語を用いた。
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: あなたの足の下に
  rationale: マタイのギリシア語の空間表現を直接訳し、敵の服従を示す比喩を保持した。ヘブライ語詩編110:1の「足台」とする表現は注に示した。
theological_decisions:
- issue: 詩編110:1引用における二つのκύριοςの訳し分け
  choice: 主は私の主に
  alternative: 「主なる神は私の主に」または「主は私の主人に」
  rationale: ギリシア語本文は両者に同一語κύριοςを用いる。第一の主が神、第二の主がダビデの主を指す関係は保ちつつ、ギリシア語に明示されない語彙上の区別や解釈を本文に加えない。
- issue: ὑποκάτω τῶν ποδῶν σουと詩編のヘブライ語的「足台」表現
  choice: 本文は「あなたの足の下に」、異読的表現は注
  alternative: 本文を「あなたの敵をあなたの足台とするまで」とする
  rationale: マタイの現存ギリシア語本文を優先して直訳しつつ、引用元のヘブライ語の鮮明な比喩と伝統的な訳し方を注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後の節にまたがる問いの中の引用であるため、末尾の「と」は文脈上の接続を保持する。引用内は神から相手への直接発話として自然な命令表現を用いた。
