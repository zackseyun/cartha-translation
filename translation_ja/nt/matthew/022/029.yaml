  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: ja
  text: しかし、イエスは彼らに答えられた。「あなたがたは、聖書も神の力も知らないため、思い違いをしている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: しかし、イエスは彼らに答えられた
  rationale: 分詞と定動詞から成る定型的な応答表現を、現代日本語で自然な「答えられた」にまとめた。δέは直前の主張への対比を示すため「しかし」とした。
- source_word: Πλανᾶσθε
  choice: 思い違いをしている
  rationale: ここでは「誤っている」「迷っている」という意味。外から欺かれたことだけを示唆せず、相手の理解が誤っていることを明瞭かつ自然に表す。
- source_word: μὴ εἰδότες
  choice: 知らないため
  rationale: 付帯状況ではなく、誤りの理由を示す分詞として因果関係を明示した。
- source_word: τὰς γραφὰς
  choice: 聖書
  rationale: ユダヤ教の聖なる文書群を指す定着した訳語。日本語では集合的に単数形の「聖書」が自然である。
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: 神の力も
  rationale: 先行する否定とμηδέの並列を、日本語の「も……も知らない」で自然に表し、δύναμιςを素直に「力」とした。
theological_decisions:
- issue: サドカイ派の誤りの原因
  choice: 聖書も神の力も知らないことが、彼らの思い違いの原因である
  alternative: 一般的に誤っているとの指摘にとどめ、因果関係を明示しない
  rationale: μὴ εἰδότεςは文脈上、Πλανᾶσθεの理由を説明しており、二つの目的語がμηδέで結ばれているため、その因果関係と並列を保った。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの厳粛で直接的な指摘を保った。「ご存じない」のような敬語は対話の力関係と非難の調子に合わないため避けた。
