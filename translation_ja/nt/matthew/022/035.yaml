  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: ja
  text: そして、そのうちの一人である律法の専門家[a]が、イエスを試そうとして、イエスに問いかけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法学者」とも訳せる。ここではユダヤの律法に通じた専門家を指す。
    reason: νομικόςの歴史的・文化的意味を説明し、現代の一般的な法律家との混同を避けるため。
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 直前の出来事を受けて物語を進める接続語として、時間的意味を強く加えず自然な日本語にした。
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 「尋ねる、問う」を意味する動詞を簡潔に表し、日本語では目的語を補わなくても自然である。
- source_word: εἷς ἐξ αὐτῶν
  choice: そのうちの一人
  rationale: 直前に言及された集団に属する一人という部分表現を自然に保持した。
- source_word: νομικὸς
  choice: 律法の専門家
  rationale: 現代日本語の「法律家」では一般の司法実務家と誤解されやすいため、ユダヤの律法に通じた専門家であることを本文で明示した。
- source_word: πειράζων
  choice: 試そうとして
  rationale: この分詞が質問の意図を示すものとして訳し、罪へ誘惑するという限定的な意味を避けつつ、相手を試す敵対的な含みを保った。
- source_word: αὐτόν
  choice: イエスを
  rationale: 代名詞の指示対象を日本語で明確にし、単独節としても読みやすくした。
theological_decisions:
- issue: πειράζωνがイエスに対して表すニュアンス
  choice: イエスを試そうとして
  alternative: イエスを誘惑しようとして
  rationale: 語には「試す」と「誘惑する」の両義があり得るが、この文脈では悪へ誘うことより、問いによって吟味し罠にかけようとする意図が前面に出る。敵対的な緊張を消さず、意味を狭めすぎない訳とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ。「律法の専門家」は一般読者に意味が伝わりやすく、「尋ねた」で原文にない「質問」を名詞として重ねることを避けた。
