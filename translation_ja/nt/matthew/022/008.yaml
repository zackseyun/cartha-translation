  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: ja
  text: そこで王は家来たちに言った。「婚宴の用意はできている。だが、招かれていた人たちは、それにふさわしくなかった。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「招かれていた人たち」は、原文ではより直訳すると「呼ばれていた人たち」とも訳せる。ここでは婚宴に招待された人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の時間的な進行と、前の出来事を受けた次の展開を自然な現代日本語で示す。
- source_word: λέγει
  choice: 言った
  rationale: 原文は歴史的現在だが、日本語の物語では過去形が自然であり、出来事の順序を明瞭に伝える。主語の「王」は直前の文脈から補った。
- source_word: τοῖς δούλοις αὐτοῦ
  choice: 自分の僕たちに
  rationale: δοῦλοςの従属的身分を保ちつつ、王の家に仕える者という比喩の文脈に合う、簡潔で格調ある表現。
- source_word: Ὁ μὲν γάμος
  choice: 婚宴
  rationale: γάμοςはここでは結婚そのものより、準備された祝宴を指す。「婚宴」は宴席の意味を簡潔に表し、μὲνは後続のδέとの対照に反映した。
- source_word: ἕτοιμός ἐστιν
  choice: 用意はできている
  rationale: 準備済みの状態を自然な日本語で直接表す。
- source_word: οἱ δὲ κεκλημένοι
  choice: だが、招かれていた人たちは
  rationale: 宴席の文脈におけるκαλέωの「招待する」という意味を明確にする。完了受動分詞が示す、すでに招かれた状態は「招かれていた」で表した。
- source_word: οὐκ ἦσαν ἄξιοι
  choice: それにふさわしくなかった
  rationale: ἄξιοςの評価的な意味を保ちながら、何に対してふさわしくないのかを「それに」で自然に示し、その理由は説明しすぎない。
theological_decisions:
- issue: κεκλημένοιにあり得る神学的な「召された者」という響き
  choice: 本文では「招かれていた人たち」
  alternative: 「召されていた人たち」または「呼ばれていた人たち」
  rationale: 直近の婚宴の文脈では、以前に招待された客を指すのが第一義である。ただし原語がκαλέωの分詞であることによる語義上の幅は脚注に残し、神学的含意を本文で過度に強めない。
- issue: ἄξιοιの不適格性の根拠
  choice: 「それにふさわしくなかった」とし、理由を特定しない
  alternative: 「招待に値しなかった」「資格がなかった」
  rationale: 原文は評価を述べるが、その根拠をこの節自体では明示しないため、拒絶や行動との関係を説明として本文に加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、王の比喩にふさわしい簡潔で品位ある語調とした。「僕」は「しもべ」と読ませる特殊表記を避け、一般的な読みで理解できる語として用いた。
