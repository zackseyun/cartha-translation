  text: ὕστερον δὲ πάντων ἀπέθανεν ⸀ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/027.yaml
  text: Last of all[a], the woman died.
translation:
  language: ja
  text: 最後に、その女も死んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「兄弟たち全員の後に、その女が死んだ」。
    reason: ὕστερον δὲ πάντωνは「最後に」とも、文脈上先に述べられた兄弟たちが皆死んだ後に、とも表現できるため。
lexical_decisions:
- source_word: ὕστερον δὲ πάντων
  choice: 最後に
  rationale: ὕστερονと属格πάντωνの組み合わせは、先に挙げられた一連の出来事の末を示す。「最後に」は現代日本語として自然であり、δέの緩やかな接続も文脈上含意できる。
- source_word: ἀπέθανεν
  choice: 死んだ
  rationale: アオリスト直説法が死という出来事を端的に述べているため、婉曲表現を避けて直接的に訳した。
- source_word: ἡ γυνή
  choice: その女
  rationale: γυνήには「女」と「妻」の両義があるが、ここでは複数の兄弟と順次結婚した同一人物を指す。「その女」は指示性を明確にしつつ、特定の一人の夫から見た「妻」に限定しない。
- source_word: καί (implicit in Japanese も)
  choice: も
  rationale: ギリシア語本文にκαίはないが、直前まで兄弟たちが死んだことを受け、日本語では「その女も」とすることで、彼女も同じく死んだという談話上の関係を自然に表す。新たな命題内容を加えるものではない。
theological_decisions: []
translation_notes:
  register: 明快で簡潔な現代標準語。「亡くなった」ではなく「死んだ」として原文の直接性を保ち、文脈上自然な「も」を用いた。脚注記号は本文中に配置した。
