id: MAT.22.11
reference: Matthew 22:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: ja
  text: しかし、王が食卓についている客たち[a]を見るために入って来て、そこに婚礼の服[b]を着ていない一人の男がいるのを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「横になっている者たち」。当時、正式な宴席では食卓のそばに横になって食事をする習慣があった。
    reason: cultural_note
  - marker: b
    text: 「婚礼の衣」とも訳せる。婚礼用の一着、または婚礼にふさわしい服装を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν δὲ
  choice: しかし、王が……入って来ると
  rationale: アオリスト分詞が主動詞に先立つ行為を示し、δέは物語の展開に軽い対照と緊張の転換を添える。日本語では「しかし」と「入って来ると」で自然に表した。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 王の婚宴を描くたとえの文脈に即した標準的な訳語。
- source_word: θεάσασθαι
  choice: 見るために
  rationale: 目的を表す不定詞。「調べる」では意図的な検分の含みを強めすぎるため、広い意味を保つ「見る」とした。
- source_word: τοὺς ἀνακειμένους
  choice: 食卓についている客たち
  rationale: 宴席で横になって食事をする者たちを指す。本文は現代日本語として自然にし、当時の姿勢は脚注に残した。
- source_word: εἶδεν ἐκεῖ
  choice: そこに……いるのを見た
  rationale: 場所を示すἐκεῖと、単純な知覚を表すεἶδενを自然な日本語の語順で表現した。
- source_word: ἄνθρωπον
  choice: 一人の男
  rationale: 物語中の特定の男性一人を指す男性単数形なので、性別と個別性を保持した。
- source_word: οὐκ ἐνδεδυμένον
  choice: 着ていない
  rationale: 完了分詞が、その男が衣服を身に着けていない状態にあることを示す。現代日本語として簡潔な「着ていない」とした。
- source_word: ἔνδυμα γάμου
  choice: 婚礼の服
  rationale: 直訳的な「婚礼の衣」より明瞭でありつつ、婚礼用の特定の一着か、婚礼に適した服装一般かを断定しない表現を選んだ。
theological_decisions:
- issue: 宴席での姿勢を示す比喩的・文化的描写
  choice: 本文では「食卓についている客たち」とし、横になっていたことを脚注で明示する。
  alternative: 「横になっている者たち」と直訳する。
  rationale: 古代の正式な宴席という歴史的背景を失わず、本文自体は現代の読者が場面を誤解しない自然な日本語にした。
- issue: 婚礼の服の性質
  choice: 「婚礼の服」と訳し、特定の礼服か婚礼にふさわしい服装かを確定しない。
  alternative: 「婚礼にふさわしい礼服」と解釈を明示する。
  rationale: 原文の属格表現ἔνδυμα γάμουには一定の幅があり、たとえの神学的意味を訳文で先取りしないため。
- issue: ἄνθρωπονの性別
  choice: 「一人の男」とする。
  alternative: 「一人の人」または「ある人」とする。
  rationale: ここでは人類一般ではなく、物語中の男性単数の人物を指しているため、原文の性別を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、たとえ話にふさわしい落ち着いた格調を保った。「食卓についている」で現代の理解を助け、古代の宴席姿勢は脚注で補った。
