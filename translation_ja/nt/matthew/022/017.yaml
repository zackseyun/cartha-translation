id: MAT.22.17
reference: Matthew 22:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: ja
  text: では、私たちにお答えください。あなたはどう思われますか。カエサルに人頭税を納めることは許されていますか。それとも、許されていませんか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπὸν οὖν ἡμῖν
  choice: では、お答えください
  rationale: 直訳の「そこで、私たちに言ってください」を、論争の問いかけとして自然な現代日本語にした。「私たちに」は日本語では文脈上明らかなため明示しない。
- source_word: τί σοι δοκεῖ
  choice: あなたはどう思われますか
  rationale: 相手の判断を尋ねる表現。仕掛けられた丁重な問いの語調を保つ。
- source_word: ἔξεστιν
  choice: 律法にかなっていますか
  rationale: 単なる法律上の許可ではなく、神の律法に照らして許されるかを問う文脈を明確にしつつ、断定的な解釈を加えない。
- source_word: δοῦναι
  choice: 納める
  rationale: 原義は「与える」だが、税を目的語とする日本語では「納める」が自然で、支払い義務をめぐる問いを正確に表す。
- source_word: κῆνσον
  choice: 人頭税
  rationale: ローマに納める census tax を指すため、一般的な「税」より具体的な「人頭税」とした。
- source_word: Καίσαρι
  choice: 皇帝に
  rationale: 称号としての Caesar を、現代の一般読者に明瞭な「皇帝」と訳す。
theological_decisions:
- issue: ἔξεστιν が示す規範の性質
  choice: 律法にかなっていますか
  alternative: 許されていますか／合法ですか
  rationale: 宗教指導者への問いとして、ローマ法上の合法性よりも神の律法との適合性が争点である。ただし「神が命じていますか」などとはせず、許容性を問う原文の幅を保った。
- issue: δοῦναι の表現
  choice: 納める
  alternative: 与える
  rationale: 「与える」は語形に近いが、日本語で税については不自然になりやすい。ここではイエスの後の応答を先取りして神学的含意を付加せず、通常の納税表現を選んだ。
translation_notes:
  register: 明瞭で丁重な現代標準日本語。質問者たちの表面的な敬意と、二者択一を迫る問いの緊張が伝わるよう、短い疑問文を連ねた。
