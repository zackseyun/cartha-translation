id: MAT.18.6
reference: Matthew 18:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: ja
  text: しかし、わたしを信じるこの小さな者たちの一人でもつまずかせる者は[a]、ろばで回す大きなひき臼を首に掛けられ[b]、外海に沈められるほうが、その者にとってよい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を犯させる」。ギリシア語は、罪に陥らせる、信仰から離れさせる、つまずかせる、という意味を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳「ろばのひき臼」。手で回す小さな臼ではなく、ろばに回させる大型のひき臼を指す。
    reason: cultural_note
  - marker: c
    text: 別訳「海の深み」。ギリシア語は、岸から離れた広い外海を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: つまずかせる
  rationale: 罪を犯させる、信仰から離れさせるなどを含み得る比喩を保ち、意味を一つに限定しない。
- source_word: μικρῶν τούτων
  choice: この小さい者たち
  rationale: 直前の子どもとのつながりを保ちつつ、年齢だけでなく、弱く低く見られる信者をも指し得る広がりを残す。
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: わたしを信じる
  rationale: 個人を目的語とする πιστεύω εἰς を、自然で直接的な現代日本語にした。
- source_word: συμφέρει αὐτῷ
  choice: その者にとってよい
  rationale: 利益や有利さを表す語を、厳しい比較を示す文脈に即して簡潔に訳した。
- source_word: μύλος ὀνικός
  choice: ろばが回す大きなひき臼の石
  rationale: ろばによって回される大型の臼石であることを、文化的背景を知らない読者にも明確に伝える。
- source_word: καταποντισθῇ
  choice: 沈められる
  rationale: 水中へ沈められて溺死する強い像を保ちつつ、原語の受動表現に沿った。
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: 沖の海
  rationale: 岸辺ではなく広く深い外海を指す πέλαγος の基本的な像を自然な日本語で示す。
theological_decisions:
- issue: 「小さい者たち」の範囲
  choice: 「この小さい者たち」とし、子どもに限定しない
  alternative: 「この幼い子どもたち」
  rationale: 直前には子どもがいるが、「わたしを信じる」という限定は、へりくだった、弱い立場の弟子たちへ指示対象が広がる可能性を持つため、その緊張を残した。
- issue: σκανδαλίζω が表す害の内容
  choice: 比喩的な「つまずかせる」
  alternative: 「罪を犯させる」または「信仰を捨てさせる」
  rationale: 原語は罪への誘導、信仰上の転倒、離反を含み得るため、いずれか一つへ狭めなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、警告の厳粛さを保った。「者」「ひき臼」などは文脈にふさわしい dignified register とし、過度に古風な語尾や漢語は避けた。
