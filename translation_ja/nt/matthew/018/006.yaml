  naturalness: 「沖の海」は現代標準日本語としてやや不自然で意味も重なるため、「外海」に改める。「ろばが回す大きなひき臼の石」は「ひき臼」と「石」が重複気味なので、「ろばで回す大きなひき臼」とする。「この小さな者たち」は「この小さい者たち」より自然であり、指示範囲の広さも保つ。
