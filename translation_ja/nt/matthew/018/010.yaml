id: MAT.18.10
reference: Matthew 18:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: ja
  text: これらの小さい者の一人をも軽んじないように、気をつけなさい。[a] あなたがたに言います。なぜなら、彼らの御使いたちは[b]天にいて[c]、いつも天におられるわたしの父の御顔を見ているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軽んじる」は、「見下す」「取るに足りない者として扱う」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「彼らの御使いたち」は、これらの小さい者たちと結びつき、または彼らを代表する御使いたちを指す可能性がある。この節だけでは、個々人の守護天使についての教理全体は確定できない。
    reason: alternative_reading
  - marker: c
    text: ギリシア語では、「天にいて」と「天におられる」の「天」はどちらも複数形である。ここでは日本語の慣用に従って「天」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: 軽んじないよう、気をつけなさい
  rationale: Ὁρᾶτεが導く警告と、μή＋アオリスト接続法による禁止を、自然な現代日本語で表した。καταφρονέωには、価値のない者として扱う、見下す、侮るという含みがある。
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: これらの小さい者の一人をも
  rationale: 「これらの小さい者の一人」を保ちつつ、否定文に自然な「一人をも」とした。「子どもたち」に限定せず、年齢または低い立場という原文の幅を残した。
- source_word: λέγω γὰρ ὑμῖν
  choice: あなたがたに言います。…からです
  rationale: γάρの理由提示を文末の「からです」で示し、λέγω ὑμῖνを自然な直接話法として訳した。
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: 彼らの御使いたち
  rationale: 属格関係をそのまま保ち、個々の守護天使という特定の教理までは訳文に持ち込まなかった。
- source_word: ἐν οὐρανοῖς
  choice: 天にいる
  rationale: ギリシア語は複数形だが、この慣用表現では日本語として自然な「天」を用いた。
- source_word: διὰ παντὸς
  choice: いつも
  rationale: 継続的・常時の意味を、明快で自然な現代日本語で表した。
- source_word: βλέπουσι τὸ πρόσωπον
  choice: 御顔を…見ている
  rationale: 神の直接の御前に近づくことを示唆する「顔を見る」という聖書的比喩を保持した。敬意を示すため「御顔」とした。
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 天におられるわたしの父
  rationale: イエスの「わたしの父」という明示的な言い方と、それを修飾する所在表現を保持した。
theological_decisions:
- issue: 「彼らの御使いたち」の意味
  choice: 「彼らの御使いたち」と直訳的に保ち、個別の守護天使という制度を断定しない。
  alternative: 一人ひとりに割り当てられた守護天使、または小さい者たちに仕え、彼らを代表する御使いたちと明示する。
  rationale: 本文は御使いたちと「小さい者たち」との関係を述べるが、その仕組みや範囲を定義していないため、神学的な曖昧さを保持した。
- issue: 「小さい者たち」の指示対象
  choice: 「小さい者」とし、幼い子どもだけに限定しない。
  alternative: 「小さい子どもたち」または「身分の低い信者たち」と限定する。
  rationale: マタイ18章の文脈には子どもと、へりくだった弟子の双方が関わるため、μικροίの指示範囲を訳文で狭めなかった。
translation_notes:
  register: 明快で品位ある現代標準日本語。「御使い」「御顔」は聖書文体として一般読者にも理解できる敬語的表記を用いた。「軽んじないよう、気をつけなさい」により警告の力を保ち、「小さい者」「彼らの御使いたち」は原文の解釈上の幅を残した。
