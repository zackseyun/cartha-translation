lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: 中動態の「自分のもとに呼ぶ」という意味を、自然な現代日本語で簡潔に表す。
- source_word: παιδίον
  choice: 一人の子ども
  rationale: 年少の子どもを指す語。日本語として人物の導入が自然になるよう「一人の」を補った。
- source_word: ἔστησεν
  choice: 立たせた
  rationale: 他動詞的なアオリストであり、「置いた」よりも、子どもを立つ姿勢にさせたという原文の具体性を保つ。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 彼らの真ん中に
  rationale: 弟子たちの集団の中央という位置関係を、明瞭で自然な表現にした。
