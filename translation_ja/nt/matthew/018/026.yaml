  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: ja
  text: そこで、その奴隷は地に伏し、主人に平伏して、こう言った。[a]「どうか私に猶予をください。すべてお返しします。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主人を礼拝した」とも訳せる。ギリシア語の動詞は他の文脈では「礼拝する」を指しうるが、ここでは人間の主人に敬意と服従を示して平伏することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν οὖν
  choice: そこで、…ひれ伏し
  rationale: οὖνが前節からの結果・展開を示すため「そこで」とし、πεσώνが表す身を低くする動作を、自然な日本語の「ひれ伏し」で表した。
- source_word: ὁ δοῦλος
  choice: その奴隷
  rationale: δοῦλοςは所有と隷属の身分を指す。巨額の負債と売却が問題となるこのたとえでは、その社会的現実を弱めないよう「奴隷」とした。
- source_word: προσεκύνει αὐτῷ
  choice: 主人に懇願して言った
  rationale: προσκυνέωはここでは人間の主人に対する敬意と服従を示す平伏を表す。身体動作は直前の「ひれ伏し」で示し、未完了過去の切迫した継続性は文脈に自然な「懇願して」で伝えた。αὐτῷの指示対象は前節の主人であるため、明確さを優先して「主人に」とした。
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: どうか待ってください
  rationale: 負債の取り立てと処罰を猶予してほしいという願いである。「忍耐してください」よりも、この債務場面で意味が明瞭な「待ってください」とした。「どうか」で懇願の調子を表した。
- source_word: πάντα ἀποδώσω σοι
  choice: すべてお返しします
  rationale: πάνταは負債の全額を包括的に指し、ἀποδίδωμιは債務の文脈で返済することを意味する。「すべてお返しします」は簡潔で自然であり、全額返済の約束を保つ。
theological_decisions:
- issue: 人間の主人に向けられた προσκυνέω の意味
  choice: 宗教的礼拝ではなく、服従と敬意を示す平伏として訳す
  alternative: 「主人を拝んだ」
  rationale: 物語内の対象は人間の主人であり、文脈上は命乞いに近い恭順の身振りである。「拝んだ」では宗教的礼拝を過度に読み込ませる可能性があるため避けたが、語が他の文脈で「礼拝する」と訳され得ることは脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、たとえの厳粛さを保った。「奴隷」は原文の社会的身分を明示する語として用いた。直接話法は、切迫した懇願として自然な丁寧語にした。
