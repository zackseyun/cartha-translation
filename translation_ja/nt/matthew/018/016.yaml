  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: ja
  text: しかし、もしその人が聞き入れないなら、さらに一人か二人を連れて行きなさい。二人または三人の証人の口によって[a]、すべての事柄が確定されるようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 申命記19章15節への言及。「証人の口によって」は、「証人の証言によって」という意味。
    reason: lexical_alternative_cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: 聞き入れない
  rationale: 単に音声を聞かないことではなく、忠告に応じず従わないことを表す文脈なので、「聞き入れない」とした。
- source_word: παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο
  choice: ほかに一人か二人を一緒に連れて行きなさい
  rationale: 命令の具体性、同行を表すμετὰ σοῦ、追加を示すἔτιを、自然な現代日本語で明示した。
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: 二人または三人の証人の口によって
  rationale: 申命記19章15節を踏まえたセム語的・法的表現を保ちつつ、日本語でも意味をたどれる形にした。より説明的には「証言によって」と訳せる。
- source_word: σταθῇ
  choice: 確定する
  rationale: 法的文脈における「成立する、確証される」という意味を簡潔に表した。
- source_word: πᾶν ῥῆμα
  choice: すべての事柄
  rationale: 直訳的な「すべての言葉」よりも、申命記の法的背景に即して、審理・確認される事柄を指す表現とした。ただし特定の「訴え」だけに狭めなかった。
theological_decisions:
- issue: 旧約の証人規定と共同体内の戒めの文脈
  choice: 申命記の証人定式を想起させる「証人の口によって」を本文に残す
  alternative: 「二人または三人の証人の証言によって」と説明的に訳す
  rationale: 申命記19章15節への言語的なつながりと法的効力を保ちつつ、特定の教派的な懲戒制度を本文に持ち込まないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令形は「連れて行きなさい」とし、厳粛さを保ちながら一般読者にも自然な表現とした。
