  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: ja
  text: さて、王が会計を精算し始めると、一万タラントン[a]を負っている一人の債務者が、王のもとに連れて来られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: タラントンは非常に大きな貨幣単位。「一万タラントン」は、このたとえの時代背景では想像を絶するほど巨額の負債を表す。
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ συναίρειν
  choice: そして、王が清算を始めると
  rationale: 属格独立構文の時間的な状況を「始めると」で自然に表し、συναίρειν の会計上の意味を簡潔な「清算」で示した。文脈上の指示対象を明確にするため、αὐτοῦ は「王」とした。
- source_word: προσηνέχθη αὐτῷ
  choice: 王のもとに連れて来られた
  rationale: アオリスト受動形により、本人が自ら来たのではなく、他者によって王のもとへ連れて来られたことを保持した。
- source_word: εἷς ὀφειλέτης
  choice: 負債がある一人の者
  rationale: εἷς を「一人」として明示し、ὀφειλέτης は現代日本語で自然に理解できるよう「負債がある者」と表した。
- source_word: μυρίων ταλάντων
  choice: 一万タラントン
  rationale: μύριοι の数値「一万」を保持し、歴史的な重量・貨幣単位は不確かな現代通貨換算を避けて「タラントン」と音写した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用いながら、たとえ話にふさわしい落ち着いた格調を保った。「王」は直前の文脈から補い、代名詞の連続による日本語の不明瞭さを避けた。
