id: MAT.18.28
reference: Matthew 18:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: ja
  text: ところが、その奴隷が外へ出ると、自分に百デナリ[a]の借りがある仲間の奴隷の一人を見つけた。そして彼をつかみ、首を絞めながら言った。「負っているものは何であれ、返せ。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一デナリは、労働者や兵士の一般的な一日分の賃金に相当した。
    reason: cultural_note
  - marker: b
    text: 直訳に近くは、「何か借りがあるなら、返せ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隷
  rationale: 主人への隷属と強制力が前景にあるたとえなので、社会的身分を明確に示す「奴隷」とした。
- source_word: ἐξελθὼν δὲ
  choice: ところが、…外へ出ると
  rationale: δέの対照的な物語展開と、分詞の時間的関係を自然な現代日本語で表した。
- source_word: συνδούλων
  choice: 仲間の奴隷
  rationale: σύν-の「同じ身分の仲間」という意味を保ち、δοῦλοςの訳語とも統一した。
- source_word: ὤφειλεν
  choice: 借りがある
  rationale: ここでは金銭上の負債を指すため、平明で自然な表現を選んだ。
- source_word: ἑκατὸν δηνάρια
  choice: 百デナリ
  rationale: 直前の莫大な負債との対比を保つため、古代の貨幣単位を残した。
- source_word: κρατήσας
  choice: つかみ
  rationale: 相手を力ずくで捕らえる動作を簡潔に表した。
- source_word: ἔπνιγεν
  choice: 首を絞めながら
  rationale: 未完了過去が示す継続的な暴力を自然に表現した。文脈上は窒息させるため首を絞めることを指す。
- source_word: Ἀπόδος
  choice: 返せ
  rationale: 負債の返済を迫る鋭い命令として簡潔に訳した。
- source_word: εἴ τι ὀφείλεις
  choice: 借りているものは何でも
  rationale: εἴ τιの不定的な響きを保ち、既知の特定額だけに限定しない要求として訳した。より字義的な可能性は脚注に示した。
theological_decisions:
- issue: たとえにおける δοῦλος の訳し方
  choice: 奴隷／仲間の奴隷
  alternative: 僕／仲間の僕、召使い／仲間の召使い
  rationale: この場面では主人への隷属、負債、暴力的な強制が重要であるため、当時の社会的身分を弱めず「奴隷」とした。
- issue: εἴ τι ὀφείλεις の不定性
  choice: 借りているものは何でも
  alternative: 何か借りがあるなら／借りているものを
  rationale: 条件文としての字義的な形を認めつつ、ここでは不定表現として機能し得るため、その曖昧さを本文と脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。暴力性と奴隷身分を婉曲化せず、命令は短く鋭い形にした。
