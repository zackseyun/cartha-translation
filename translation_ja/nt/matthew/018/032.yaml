reference: Matthew 18:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: ja
  text: そこで、主人は彼を呼びつけて言った。「この悪い奴隷め[a]。おまえが私に懇願したので、私はあの負債をすべて免除してやった[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」は「僕（しもべ）」とも訳せる。ギリシア語のδοῦλοςは、主人に属して従属する者を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「赦してやった」または「帳消しにしてやった」。ギリシア語の動詞は、負債を免除することにも、罪を赦すことにも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の時間的な進行と、直前の出来事を受けた展開の両方を自然な現代日本語で示す。
- source_word: προσκαλεσάμενος
  choice: 呼びつけて
  rationale: 自分のもとへ呼ぶという意味に加え、主人が権威をもって奴隷を呼ぶ場面の力関係を表す。
- source_word: ὁ κύριος αὐτοῦ
  choice: 主人
  rationale: ここでは神的称号ではなく、たとえの中で奴隷を所有し支配する者を指す。
- source_word: λέγει αὐτῷ
  choice: 彼に言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形にした。本文では重複を避けて「彼を呼びつけて言った」とした。
- source_word: Δοῦλε πονηρέ
  choice: この悪い奴隷め
  rationale: πονηρόςによる道徳的非難と、δοῦλοςが示す隷属関係を、直接的で力のある呼びかけとして表した。
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: あの負債をすべて
  rationale: 既に語られた莫大な負債全体を指す表現を明確に保つ。
- source_word: ἀφῆκά σοι
  choice: 私は…免除してやった
  rationale: 直接の文脈は負債の放免なので「免除する」を用いた。一方、この動詞が持つ「赦す」との重なりは脚注で示した。
- source_word: ἐπεὶ παρεκάλεσάς με
  choice: おまえが私に懇願したので
  rationale: 理由を示すἐπείと、切実に願い求めるπαρακαλέωの語感を明瞭に表す。
theological_decisions:
- issue: δοῦλοςを主人と奴隷の関係の中でどう訳すか
  choice: 奴隷
  alternative: 僕／しもべ
  rationale: このたとえでは、主人への法的・経済的従属と主人の処分権が中心的であるため、「奴隷」が関係性を最も明確に伝える。
- issue: 負債の文脈におけるἀφίημιの訳
  choice: 免除する
  alternative: 赦す／帳消しにする
  rationale: 直接には負債の取り立てを放棄することを示すため、本文は自然で正確な「免除する」とした。ただし、マタイにおける罪の赦しとの語彙的・神学的な響き合いを失わないよう脚注に別訳を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、主人の厳しい叱責には「この…め」、上下関係を伴う二人称には「おまえ」を採用した。たとえの歴史的な主従関係を弱めず、同時に負債免除と赦しの語義的な重なりを脚注で保持した。
