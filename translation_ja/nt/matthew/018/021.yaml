id: MAT.18.21
reference: Matthew 18:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: ja
  text: その時、ペトロがイエスに近寄って言った。「主よ、私の兄弟[a]が私に対して罪を犯した場合、私は何度までその人を赦せばよいのでしょうか。七度までですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の兄弟姉妹」。ギリシア語は男性単数形で「私の兄弟」だが、文脈上は仲間の弟子を広く指している可能性がある。
    reason: 原語の文法上の性を示しつつ、文脈上ありうる包括的な意味を伝えるため。
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 時間的・物語的なつながりを示す語として、直前の教えを受けた場面の進行を自然に表す。
- source_word: προσελθὼν αὐτῷ
  choice: イエスに近寄って
  rationale: 分詞が表す、話す前に近づく動作を保持した。代名詞の指示対象は文脈上イエスなので、日本語では明示した。
- source_word: ὁ Πέτρος εἶπεν
  choice: ペトロが……言った
  rationale: 固有名は日本語聖書で広く用いられる形とし、一般的な発話動詞をそのまま訳した。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの敬意ある呼びかけと、κύριοςが持ちうる神学的な響きの双方を保つ。
- source_word: ποσάκις
  choice: 何度まで
  rationale: 後続する「七度まで」と対応させ、赦す回数の上限を尋ねていることを自然な日本語で示した。
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: 私に対して罪を犯した場合
  rationale: εἰς ἐμέが示す、罪が話者に向けられている関係を「私に対して」で表した。未来形は、反復しうる仮定的な場合を問う日本語として表現した。
- source_word: ὁ ἀδελφός μου
  choice: 私の兄弟
  rationale: 男性単数形という原文の形を本文で保持し、文脈上のより広い適用可能性は脚注に示した。
- source_word: καὶ ἀφήσω αὐτῷ
  choice: 私は……その人を赦せばよいのでしょうか
  rationale: ἀφίημιの倫理的文脈での意味を「赦す」とし、ペトロが自分に求められる赦しの回数を尋ねる自然な日本語にした。
- source_word: ἕως ἑπτάκις
  choice: 七度までですか
  rationale: ἕωςが示す上限の提案と、ἑπτάκιςの具体的な回数を簡潔に保持した。
theological_decisions:
- issue: 文脈におけるἀδελφόςの範囲
  choice: 本文では「私の兄弟」と訳す。
  alternative: 「私の兄弟姉妹」または「仲間の弟子」
  rationale: 原語は男性単数形だが、この文脈では仲間の弟子を代表的に指す可能性もある。本文で範囲を断定的に広げず、脚注でその可能性を保持した。
- issue: 赦しの問いにおける未来形と反復性
  choice: 「罪を犯した場合、私は何度まで……赦せばよいのでしょうか」と訳す。
  alternative: 「何度、罪を犯し、私がその人を赦すことになるのでしょうか」
  rationale: 二つの未来形を逐語的に並べると日本語では不自然になるため、想定される反復的状況と回数の上限を問う意味を明確にした。ただし、赦しの義務の範囲という問いそのものは解消していない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスへの呼びかけには「主よ」、罪への応答には「赦す」を採用し、聖書本文としての品位を保った。質問文は丁寧だが過度に古風にならない形にした。
