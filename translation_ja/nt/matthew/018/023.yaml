source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: ja
  text: ですから、天の国は、自分の奴隷たち[a]との勘定を清算しようとした、ある王にたとえられました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべたち」または「使用人たち」とも訳せる。ギリシア語はδοῦλοιで、王の権威のもとにある隷属する身分を表す。
    reason: alternative_reading
  - marker: b
    text: ギリシア語の形に即して「たとえられた」または「比べられた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ですから
  rationale: 直前の教えを受ける因果・推論上のつながりを、自然な現代日本語で明確に示す。
- source_word: ὡμοιώθη
  choice: たとえられます
  rationale: ὁμοιόωの受動形が示す「似たものとして提示される／比較される」という意味を保ちつつ、たとえ話を導入する日本語として自然にした。ギリシア語のアオリストの形は脚注で示す。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現であり、神の支配とその領域の双方を含みうる曖昧さを保つ、明瞭で定着した訳語。
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ある王
  rationale: 直訳すれば「王である一人の人」だが、βασιλεῖが人物の身分を特定しているため、日本語では「ある王」が簡潔で自然。
- source_word: ἠθέλησεν
  choice: しようとした
  rationale: 王の意志・意図を表し、その後に行動が始まる物語の流れにも適した表現。
- source_word: συνᾶραι λόγον
  choice: 勘定を清算する
  rationale: 金銭上の帳尻を合わせ、支払いを求めるという慣用的な意味を明瞭に表す。単なる確認ではなく決済・精算の含意を保つ。
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: 自分の奴隷たちと
  rationale: δοῦλοςが示す王の権威下にある隷属身分を明示する。この文脈では、債務の清算や後続する処分権もその身分を際立たせる。
theological_decisions:
- issue: 王の支配下にあるδοῦλοιの訳し方
  choice: 奴隷たち
  alternative: 僕たち／使用人たち
  rationale: このたとえでは王が彼らの財務を査定し、強い処分権を行使するため、単なる雇用人より隷属した身分が前景化している。ただしδοῦλοςの意味範囲と日本語での慣用を踏まえ、別訳を脚注に残す。
- issue: 天の国と王との比較の範囲
  choice: 文全体として王とその清算行為にたとえる
  alternative: 天の国を王その人だけに直接同一視する
  rationale: 文法上は「王」が比較対象だが、たとえの意味は王の意図と行動を含む場面全体によって展開する。訳文では解釈を追加せず、原文の構造を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、たとえ話の導入として自然でありながら品位ある語調にした。「奴隷」は歴史的・社会的な重みを弱めず原語の身分性を伝え、代替表現は脚注で示した。
