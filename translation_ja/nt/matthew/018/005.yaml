  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: ja
  text: また、わたしの名によって、このような子どもを一人受け入れる人は、わたしを受け入れるのである。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け入れる」は「迎え入れる」とも訳せる。ギリシア語の動詞には、受け入れる、歓迎する、認めるという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「このような子どもを一人」。この節のギリシア語には「小さな」に当たる形容詞はない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: …人は
  rationale: 不定関係節の一般的な条件を、現代日本語で自然な「…人は」として表した。誰にでも当てはまる趣旨を保っている。
- source_word: δέξηται / δέχεται
  choice: 受け入れる／受け入れる
  rationale: δέχομαι の反復を同じ訳語で再現し、子どもを受け入れることとイエスを受け入れることとの直接的な対応を明確にした。「迎え入れる」も文脈上可能である。
- source_word: ἓν παιδίον τοιοῦτο
  choice: このような子どもを一人でも
  rationale: τοιοῦτο の「このような」を保ち、ἓν は日本語として自然な「一人でも」で一般条件の力を表した。本文にない「小さな」は加えていない。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの名を根拠・権威・関係の基盤として受け入れる意味幅を限定しすぎずに表す。「わたしの名のゆえに」も可能である。
- source_word: ἐμὲ
  choice: わたしを
  rationale: 同じ動詞の目的語が子どもからイエスへ移る構造をそのまま示し、代表的一体性を保った。
theological_decisions:
- issue: 子どもとイエスとの代表的一体性
  choice: このような子どもをイエスの名によって受け入れることは、イエス自身を受け入れることであると直接表現した。
  alternative: その行為は単にイエスを敬うことだと弱めて表現する。
  rationale: 原文は同じ δέχομαι を反復して「子どもを受け入れる」と「わたしを受け入れる」を直結しているため、その強い対応を保った。一方、本文にない教会論的・秘跡的含意は加えていない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「のである」は教えの断定的な調子を自然に示す。「わたし」を用い、語の反復と神学的な対応関係を見えやすくした。
