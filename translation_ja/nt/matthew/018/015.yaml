id: MAT.18.15
reference: Matthew 18:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: ja
  text: 「また、あなたの兄弟[c]があなたに対して罪を犯したなら[a]、行って、二人だけでその人の過ちを指摘しなさい[b]。その人があなたの言うことを聞くなら、あなたはその兄弟を得たのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「あなたに対して」がなく、「あなたの兄弟が罪を犯したなら」となっている。
    reason: textual_variant
  - marker: b
    text: 「その人を戒めなさい」、または「その人に過ちを悟らせなさい」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「兄弟」は原文では男性単数形。文脈上、より広く仲間の弟子を指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: 罪を犯したなら
  rationale: ἐάνを伴うアオリスト接続法の一般的な条件を自然な日本語で表しつつ、ἁμαρτάνωの道徳的・宗教的な意味を保った。
- source_word: εἰς σέ
  choice: あなたに対して
  rationale: ここでのεἰς＋対格は、罪が聞き手に向けられたことを示す。SBLGNT本文に従って訳文に含め、異読は脚注に示した。
- source_word: ὁ ἀδελφός σου
  choice: あなたの兄弟
  rationale: ギリシア語の男性単数形を保った。文脈上は同じ弟子の仲間を指し得るため、その点を脚注で示した。
- source_word: ὕπαγε
  choice: 行って
  rationale: 命令として後続の行為を導く簡潔で自然な訳。
- source_word: ἔλεγξον αὐτόν
  choice: その人の過ちを指摘しなさい
  rationale: ἐλέγχωが持つ、過ちを明るみに出して本人に認識させる意味を、現代日本語で過度に攻撃的にならないよう表した。目的語を自然に示すため「その人の過ち」とした。
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: 二人だけで
  rationale: 当事者以外を交えないという秘密性・限定性を、簡潔で自然な日本語にした。
- source_word: ἐάν σου ἀκούσῃ
  choice: その人があなたの言うことを聞くなら
  rationale: 単なる聴覚ではなく、相手の言葉を受け止める含みを持たせつつ、「従う」と断定して意味を強めることは避けた。
- source_word: ἐκέρδησας
  choice: あなたは自分の兄弟を得たことになる
  rationale: κερδαίνωの「得る」という比喩を保持した。「取り戻す」は関係の回復を明示しすぎるため採らなかった。日本語の条件文として自然になるよう「ことになる」とした。
theological_decisions:
- issue: ἀδελφόςを適用上包括的に訳すか
  choice: 本文では「あなたの兄弟」とする
  alternative: 「兄弟または姉妹」「信仰の仲間」
  rationale: 原文の男性単数形を本文で保持し、文脈上より広く同じ弟子の仲間を指し得ることは脚注で伝えた。
- issue: εἰς σέの本文批評上の扱い
  choice: 本文に「あなたに対して」を含める
  alternative: この句を省き「あなたの兄弟が罪を犯したなら」とする
  rationale: 指定されたSBLGNT本文にはεἰς σέがあるため本文に訳出した。ただし、この異読は教えの適用範囲に関わるため、短い読みを脚注に保存した。
- issue: ἐκέρδησαςの比喩をどう扱うか
  choice: 「兄弟を得た」と比喩を保持する
  alternative: 「兄弟を取り戻した」「兄弟との関係を回復した」
  rationale: 後者は和解・回復という文脈上妥当な含意を明示する一方、動詞そのもの以上の解釈を加えるため、本文では原文の緊張を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「責める」よりも意味範囲が適切で、日常的にも理解しやすい「過ちを指摘する」を用いた。「二人だけで」により私的な対話であることを自然に示し、「兄弟を得る」という原文の比喩は保持した。
