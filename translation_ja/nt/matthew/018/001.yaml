  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ja
  text: その時、弟子たちがイエスのもとに来て言った。「では、天の御国でより偉いのは誰ですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: その時
  rationale: 直訳的には「その時刻に」だが、物語の移行を自然な現代日本語で表す。
- source_word: Τίς ἄρα
  choice: では、…誰ですか
  rationale: ἄρα が示す推論・帰結の含みを「では」で保持する。
- source_word: μείζων
  choice: より偉い
  rationale: 比較級であり、最上級の「最も偉い」とせず、比較の形と議論の含みを保つ。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の御国
  rationale: マタイに特徴的な表現を、現代日本語の聖書文体として明瞭かつ尊厳ある形で訳す。
theological_decisions:
- issue: μείζων の比較級を最上級的に解釈するか
  choice: 「より偉い」と比較級のまま訳す
  alternative: 「最も偉い」
  rationale: 文脈上は集団内の首位を問う可能性があるものの、原文は比較級であるため、その形式と曖昧さを本文に残す。
translation_notes:
  register: 明瞭な現代標準日本語。会話として自然にしつつ、聖書本文にふさわしい簡潔で尊厳ある調子を保った。
