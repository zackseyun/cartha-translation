id: MAT.18.18
reference: Matthew 18:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ja
  text: まことに、あなたがたに言います。あなたがたが地上でつなぐものは何であれ、天ですでにつながれていることになります。地上で解くものは何であれ、天ですでに解かれていることになります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天でつながれ、……天で解かれます」。ギリシア語はこのようにも訳せますが、本文では未来形の動詞と完了分詞の組み合わせを踏まえ、天ですでに成立している状態を示しうる表現にしています。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: 権威ある言葉を厳粛に導入する肯定表現。「アーメン」より一般読者に意味が明瞭で、現代日本語として自然である。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接的で権威ある発言を、明瞭な現代日本語で表した。
- source_word: ὅσα ἐὰν
  choice: ものは何であれ
  rationale: 不定の一般条件と範囲の広さを自然な日本語で示す。
- source_word: δήσητε
  choice: つなぐ
  rationale: δέωの結ぶ・縛るという比喩を保ち、司法的な「禁じる」だけに意味を限定しない。対になるλύωとの対応も明瞭になる。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 天との対照を簡潔かつ自然に示す。
- source_word: ἔσται δεδεμένα
  choice: 天ですでにつながれたものとなっており
  rationale: 未来形のεἰμίと完了受動分詞の組み合わせが示しうる、先行して成立し継続する状態を日本語で表した。逐語的な未来完了は不自然になりやすいため、文脈上の将来時を保ちつつ「すでに」と状態表現で完了性を示した。
- source_word: ἐν οὐρανῷ
  choice: 天で
  rationale: 神の領域としての単数οὐρανόςを、日本語聖書で自然かつ簡潔な「天」で表した。
- source_word: λύσητε
  choice: 解く
  rationale: λύωの基本的な比喩を保ち、「許す」だけに意味を限定しない。「つなぐ」と自然な対をなす。
- source_word: ἔσται λελυμένα
  choice: 天ですでに解かれたものとなっています
  rationale: 未来形＋完了受動分詞による、先行して成立した結果状態という含みを保った。前半と対応させつつ、自然な日本語にした。
theological_decisions:
- issue: 地上での「つなぐ／解く」と天での行為の時間的・神学的関係
  choice: 「天ですでに……ものとなっている」とし、天で先に成立している状態との対応を示唆する。
  alternative: 「天でもつながれる／解かれる」と訳し、単純未来の対応として表す。
  rationale: ἔσται＋完了受動分詞は、先行する行為の結果として成立している状態を示しうる。この含みを保ちながら、教会の決定を天が後から承認するという特定の教派的理解に限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「つなぐ／解く」によって原文の対句的な比喩を保持した。完了性は「すでに」と状態表現で示し、過度に専門的な言い回しを避けた。
