id: MAT.18.17
reference: Matthew 18:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: ja
  text: しかし、その人が彼らにも耳を貸そうとしないなら、そのことを集会[a]に伝えなさい。集会にも耳を貸そうとしないなら、その人を、あなたにとって異邦人や徴税人のような者としなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「集会」は「教会」または「会衆」とも訳せる。ギリシア語はエックレーシア。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: 耳を貸そうとしない
  rationale: 単に聞こえないという意味ではなく、忠告を受け入れず聞き従おうとしない意志的な拒否を、自然な現代日本語で表した。二度の用例を同じ表現で訳し、原文の反復も保った。
- source_word: εἰπὸν
  choice: そのことを……伝えなさい
  rationale: 命令の力を保ちつつ、文脈上省略されている報告内容を「そのこと」として自然に補った。
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: 集会
  rationale: 集められた共同体という語の基本的な意味を示し、後代の制度的・教派的な含みを本文に持ち込まないようにした。「教会」「会衆」は脚注に示した。
- source_word: ἔστω σοι
  choice: あなたにとって、その人は……者であるとしなさい
  rationale: σοι（あなたにとって）と命令の力を保ちながら、日本語として理解できる形にした。「扱いなさい」として具体的な処遇を補うことは避けた。
- source_word: ὥσπερ
  choice: ……のような
  rationale: 原文の比較表現をそのまま保ち、同一視や具体的な処遇へと言い換えなかった。
- source_word: ὁ ἐθνικὸς
  choice: 異邦人
  rationale: ユダヤ的文脈で契約共同体の外にいる諸国民の者を指す通常の語義を採った。「異教徒」として宗教的評価を付け加えることは避けた。
- source_word: ὁ τελώνης
  choice: 徴税人
  rationale: 当時の税を徴収する者を指す語として、明瞭で一般的な現代日本語を用いた。
theological_decisions:
- issue: 復活以前のマタイ福音書の戒規的文脈におけるἐκκλησίαの訳語
  choice: 集会
  alternative: 教会／会衆
  rationale: イエスの言葉に後代の制度や教派の構造を読み込まず、集められた共同体という中心的意味を本文に置いた。伝統的かつ文脈上可能な訳語は脚注に残した。
- issue: 聞き入れない者を共同体の外の者になぞらえる命令の強さ
  choice: あなたにとって、その人は異邦人や徴税人のような者であるとしなさい
  alternative: その人を異邦人や徴税人として扱いなさい／その人を部外者と見なしなさい
  rationale: 原文の比較と「あなたにとって」という限定を保った。「扱う」や「部外者」と言い換えて、具体的な排除手続きや後代の破門教理を本文以上に明示することを避けた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「耳を貸そうとしない」により拒絶の意志を表し、「集会」の反復によって原文の構造を保った。脚注記号[a]は該当語の直後に置いた。
