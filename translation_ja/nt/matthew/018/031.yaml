id: MAT.18.31
reference: Matthew 18:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: ja
  text: そこで、仲間の奴隷たち[a]は、起こったことを見て非常に心を痛め、主人[b]のもとへ行き、起こったことをすべて詳しく報告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「仲間のしもべたち」。ギリシア語は、同じ主人のもとにいる「仲間の奴隷たち」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼ら自身の主人」。ギリシア語κύριοςは、文脈により「主」または「主人」と訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語の展開と結果を自然に示す。ここでは論理的な「したがって」より、物語文に合う「そこで」が適切。
- source_word: σύνδουλοι
  choice: 仲間の奴隷たち
  rationale: 同じ主人のもとで奴隷の身分を共有する者たちを指す。単なる仕事仲間ではなく、共通の隷属関係がたとえの構図に関わるため、「奴隷」を保った。
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: 起こったこと／起こったことをすべて
  rationale: γίνομαιの実詞的分詞を自然な日本語にした。二度目にはπάνταがあるため、「すべて」を明示して強意を保った。
- source_word: ἐλυπήθησαν σφόδρα
  choice: 非常に心を痛め
  rationale: λυπέωが表す深い悲しみ・苦痛と、σφόδραの強意を、現代日本語で自然かつ重みのある表現にした。
- source_word: ἐλθόντες
  choice: もとへ行き
  rationale: 主動詞に先立つ付帯状況のアオリスト分詞を、出来事の順序が明確になる自然な連用表現で訳した。話者を基準にした「来て」より、奴隷たちが主人のもとへ向かったことを日本語では「行き」とするのが自然。
- source_word: διεσάφησαν
  choice: 詳しく報告した
  rationale: 単に告げるだけでなく、明らかにする、詳しく説明するという動詞の含意を「詳しく報告した」で表した。πάνταによる内容の網羅性とも調和する。
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: 主人
  rationale: ここではたとえの中の人間の所有者・支配者を指すため、日本語では「主人」が最も自然。「主」は神的称号と受け取られやすいので避けた。
theological_decisions:
- issue: たとえの社会的背景におけるδοῦλος系語の訳
  choice: 仲間の奴隷たち
  alternative: 仲間のしもべたち
  rationale: σύνδουλοιは、同じ主人に隷属する身分を共有する者たちを表す。伝統的な「しもべ」は意味を和らげる可能性があるため、原文の社会的関係を明確にする「奴隷」を本文に採用した。
- issue: 人間の上位者を指すκύριοςの訳
  choice: 主人
  alternative: 主
  rationale: 神学的称号ではなく、たとえに登場する奴隷たちの所有者を指す。日本語の文脈では「主人」が関係を明確にし、神への言及を不必要に連想させない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の流れには「そこで」を用い、奴隷制という原文の社会的背景は婉曲化しない。「心を痛め」は悲しみと苦痛の両面を自然に伝え、「詳しく報告した」でδιεσάφησανの説明的な含意を示した。
