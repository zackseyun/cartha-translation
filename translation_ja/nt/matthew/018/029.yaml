source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: ja
  text: そこで、その仲間の奴隷[a]はひれ伏し、彼に懇願して、こう言った。「私に猶予をください。お返しします。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「仲間のしもべ」。原語は、同じ主人に属する者を指す。
    reason: 「奴隷」は身分を明確に示す一方、日本語では「しもべ」と訳すこともできるため。
lexical_decisions:
- source_word: σύνδουλος
  choice: 仲間の奴隷
  rationale: 同じ主人に属する奴隷を指す複合語。王と負債をめぐるたとえの中で拘束された身分が重要なため、「仲間のしもべ」よりも原語の社会的実態を明確に示す。
- source_word: πεσών
  choice: ひれ伏し
  rationale: 嘆願のために身を低くして倒れ伏す動作を、自然で簡潔な現代日本語で表す。
- source_word: παρεκάλει
  choice: 懇願し続けた
  rationale: 未完了過去形が示す継続的・反復的な切実な願いを反映する。
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: どうか待ってください
  rationale: 負債返済の猶予を求める文脈で、「私に対して忍耐してください」という意味を自然な日本語にした。直訳的な「私に対して寛容でいてください」より発話として明瞭。
- source_word: ἀποδώσω
  choice: 必ずお返しします
  rationale: 負債を返済するという意味。「必ず」は日本語の約束として自然に未来の確約を表すが、原文に独立した強意語があるわけではない。
- source_word: οὖν
  choice: そこで
  rationale: 前節を受けて物語を順次進める接続を、自然な叙述表現で示す。
theological_decisions:
- issue: σύνδουλοςに含まれるδοῦλος系の身分表現
  choice: 本文で「仲間の奴隷」とする
  alternative: 「仲間のしもべ」「同僚の僕」
  rationale: 同じ主人の支配下にある者という関係と、たとえの中で際立つ拘束身分を保持するため。特定の教派的解釈を加えず、語の社会的意味を明示する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、たとえ話にふさわしい品位を保った。παρεκάλειの未完了過去は「懇願し続けた」で表し、直接話法は日本語として自然な語順に整えた。
