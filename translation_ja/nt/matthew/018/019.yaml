id: MAT.18.19
reference: Matthew 18:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: ja
  text: 改めて、まことにあなたがたに言います。あなたがたのうち二人が地上で、何であれ願い求める事柄について合意するなら[a]、それは天におられる[b]わたしの父によって、その二人のために実現します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直前の文脈は、共同体の中で罪を扱うことと、その権威についての教えです（18章15～18節）。ただし、この節そのものは、一致して願い求めることを広く述べています。
    reason: cross_reference
  - marker: b
    text: ギリシア語では「天」は複数形です。ここでは日本語の慣用に従って「天に」と訳しました。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: もう一度
  rationale: 直前の教えに続いて、改めて語ることを示す語として、談話の流れを自然に保つ。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことにあなたがたに言います
  rationale: イエスの厳粛で強調された宣言の定型句を、音写に頼らず明瞭な現代日本語で表した。
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: あなたがたのうち二人が……心を一つにするなら
  rationale: ἐξ ὑμῶνを「あなたがたのうち」と明示し、συμφωνέωの一致・合意の意味を自然な日本語で表した。単なる感情的一体感に限定せず、ある事柄について意見を合わせる意味を保つ。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 後半の「天におられる父」と対照をなす地上の領域を簡潔に保持した。
- source_word: περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται
  choice: 願い求めるどんなことについてでも
  rationale: πρᾶγμαの広い意味と、不定関係節が示す包括性を保った。αἰτέωはこの文脈では願い求めることを表すが、本文にない対象や条件は補っていない。
- source_word: γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου
  choice: わたしの父が、その二人のためにそれを実現してくださいます
  rationale: 直訳的な「父から彼らに生じる」では不自然なため、結果とその源である父の働きを明瞭な日本語で表した。「その二人」はαὐτοῖςの指示対象を明確にする。
- source_word: τοῦ ἐν οὐρανοῖς
  choice: 天におられる
  rationale: ギリシア語は複数形「天々」だが、日本語の聖書的・一般的な慣用に従い「天」とした。
theological_decisions:
- issue: 約束の適用範囲
  choice: 願いの範囲を本文どおり広く表し、教会規律だけに限定する条件も、あらゆる祈願が無条件に実現するとの説明も本文には加えない。
  alternative: 教会の戒規に関する決定だけに明示的に限定する、または一般的な祈りへの無条件の保証として訳す。
  rationale: 直前の18章15～18節は共同体内の罪への対応と権威を扱う一方、この節自体は一致して願う「どんなこと」についても語る。翻訳では、この文脈上の関係と本文の広い表現との緊張を保持する。
- issue: 父の応答の表現
  choice: 「実現してくださいます」とし、父を応答の主体として示す。
  alternative: 「父からその人たちに起こります」または「かなえてくださいます」とする。
  rationale: γενήσεταιとπαρά＋属格の組み合わせは結果とその源を示す。「かなえる」は祈願成就の意味をやや強く前面に出すため、より広い「実現する」を採用した。敬語は日本語として神への自然な敬意を示すもので、追加の教理的限定ではない。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、イエスの厳粛な宣言にふさわしい品位を保った。「心を一つにする」は理解しやすいが、単なる親密さではなく、特定の事柄について合意する意味で用いている。
