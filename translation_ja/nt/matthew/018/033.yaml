  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: ja
  text: わたしもおまえにあわれみをかけたように、おまえもおまえの仲間の奴隷[a]にあわれみをかけるべきではなかったか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仲間のしもべ」とも訳せる。ギリシア語は、同じ主人に属する仲間の奴隷を指す。
    reason: σύνδουλοςの隷属的身分と、同じ主人に属する者という関係を示すとともに、伝統的な別訳を提示するため。
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: べきではなかったか
  rationale: 過去に果たすべきだった道徳的義務を問う非難の修辞疑問として、自然な現代日本語にした。
- source_word: καὶ σὲ
  choice: おまえも
  rationale: καίが示す対応を「も」で表し、先にあわれみを受けた者にも同じ行為が求められることを示した。
- source_word: ἐλεῆσαι / ἠλέησα
  choice: あわれむ／あわれんだ
  rationale: 同じ動詞ἐλεέωの反復を同一の日本語動詞で保ち、単なる同情ではなく、相手に向けられる慈悲を表した。
- source_word: τὸν σύνδουλόν σου
  choice: 仲間の奴隷
  rationale: σύν-が示す同じ主人に属する仲間という関係と、δοῦλος系語の隷属的身分をともに保持した。所有代名詞は日本語では関係が明らかなため明示せず、自然さを優先した。
- source_word: ὡς κἀγὼ σὲ
  choice: わたしがおまえを……ように
  rationale: ὡςの比較を「ように」で表した。κἀγώのκαίは、主節の「おまえも」との対応によって日本語上十分に示されるため、重い「わたしも」を避けた。
theological_decisions:
- issue: σύνδουλοςにおけるδοῦλος系語の訳
  choice: 仲間の奴隷
  alternative: 仲間のしもべ／同じ主人に仕える者
  rationale: 王とその支配下にある者たちを描くたとえでは隷属的身分が意味を持つため、「奴隷」を本文に採用した。一方、σύνδουλοςの中心的な関係概念である「同じ主人を持つ者」は脚注で補った。
- issue: ἐλεέωの意味合い
  choice: あわれむ
  alternative: 慈悲をかける
  rationale: 前後二つの用例を同じ語で訳し、受けたあわれみと与えるべきあわれみの対応を保持した。特定の教派的含意を加えない。
translation_notes:
  register: 王が家来を厳しく問いただす場面に合わせ、二人称は「おまえ」とした。「憐れむ」ではなく常用的な表記の「あわれむ」を用い、現代の一般読者にも読みやすく、かつ荘重さを損なわない文体にした。
