id: MAT.18.20
reference: Matthew 18:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: ja
  text: 二人または三人がわたしの名によって集まっているところには、わたしはその人たちのただ中にいるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: ところには
  rationale: 場所を示す関係表現。後続のἐκεῖと対応する「ところには」で、ギリシア語の「どこで…そこに」という構造を自然な日本語にした。
- source_word: γάρ
  choice: からです
  rationale: 直前の文脈に対する理由・説明を示すため、文末の「からです」で説明的なつながりを保った。
- source_word: δύο ἢ τρεῖς
  choice: 二人または三人
  rationale: 数の表現をそのまま明確に訳した。
- source_word: συνηγμένοι
  choice: 集まっている
  rationale: 完了受動分詞が示す、集められて現在ともにいる結果状態を自然に表す。日本語では受動形に限定せず、解釈を過度に加えない表現とした。
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: わたしの名によって
  rationale: イエスの名との関係、権威、帰属を含みうる表現。「名の中へ」という逐語訳を避け、日本語として自然でありながら意味の幅を狭めすぎない訳とした。
- source_word: ἐκεῖ
  choice: そこには（日本語本文では「ところには」に統合）
  rationale: οὗとの相関を、日本語では「…ところには」という一まとまりの構文で表した。
- source_word: εἰμι
  choice: いる
  rationale: 単純な存在・臨在の主張を直接的に表し、「臨在する」などの教義的に響く語を加えなかった。
- source_word: ἐν μέσῳ αὐτῶν
  choice: その人たちの真ん中に
  rationale: 空間的イメージを保ちながら、現代日本語で分かりやすく表現した。「彼ら」を避け、対象を明瞭にした。
theological_decisions:
- issue: 集まった弟子たちの間におけるキリストの存在
  choice: 「わたしもその人たちの真ん中にいる」と率直に訳す。
  alternative: 「わたしは彼らとともに臨在する」など、特定の教会論・礼典論を連想させる解釈的表現。
  rationale: 本文はイエスの存在を明確に断言する一方、そのあり方を形而上学的・教派的に定義していないため、その緊張と開放性を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「わたしも」は、集まる者たちに対応してイエスがそこにいることを自然に示す。原文にない教会用語や教派固有の含意は加えていない。
