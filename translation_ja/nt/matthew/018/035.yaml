  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: ja
  text: あなたがた一人一人が、自分の兄弟[a]を心から赦さないなら、わたしの天の父も、あなたがたに同じようになさいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」はギリシア語の男性単数形を訳したもの。ここでは代表的に用いられ、女性を含む仲間の弟子、または信者を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: 同じように…も
  rationale: 直前のたとえにおける主人の処置を指し、それと父の処置を対応させる比較・適用の働きを自然な日本語で表した。
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: わたしの天の父
  rationale: 「わたしの」という所属と、οὐράνιος の「天の／天に属する」という限定を簡潔に保持した。
- source_word: ποιήσει ὑμῖν
  choice: あなたがたに…なさいます
  rationale: 直前のたとえで主人が行ったことを受ける広い表現を保ち、裁きの具体的な神学的範囲を訳文で限定しなかった。父への敬意を示すため「なさいます」とした。
- source_word: ἐὰν μὴ
  choice: …ないなら
  rationale: 否定条件を明瞭に表し、「もし…なければ」より簡潔で自然な現代日本語とした。
- source_word: ἀφῆτε
  choice: 赦さない
  rationale: 対人関係上の負い目を扱う文脈では ἀφίημι は「赦す」を意味する。たとえの債務比喩ともつながる。
- source_word: ἕκαστος
  choice: あなたがた一人一人が
  rationale: 単数形による配分的な意味を、複数の聞き手それぞれに及ぶ要求として明確にした。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 自分の兄弟
  rationale: 男性単数形を本文で保持した。「自分の」は、各人に対応する αὐτοῦ の再帰的な関係を自然な日本語で表す。代表的用法は脚注で説明した。
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: 心から
  rationale: 日本語では「あなたがたの心々から」などと直訳せず、「心から」が複数の各人に求められる内面的で真実な赦しを自然に表す。
theological_decisions:
- issue: 警告の範囲と強さ
  choice: たとえの主人の処置に対応する、父による厳粛な警告として訳す
  alternative: 「同様に扱われます」と和らげる、または永遠の刑罰・報いの喪失など特定の教理を明記する
  rationale: 本文は神の処置を厳粛に告げるが、その裁きの体系神学上の分類までは明示しない。「同じようになさいます」により重みを保ちつつ、解釈を過度に限定しない。
- issue: ἀδελφῷ の性と指示範囲
  choice: 本文では「兄弟」とし、文脈上の代表的な指示範囲を脚注で示す
  alternative: 「兄弟姉妹」「仲間の信者」「きょうだい」
  rationale: 原文の男性単数形を保持しながら、文脈上は女性を含む仲間の弟子・信者にも当てはまることを脚注で明らかにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳粛な警告にふさわしい品位を保った。「心から」は自然な日本語として原文の複数形の意味を各人に配分し、「なさいます」は父への敬意を示す。
