id: MAT.18.13
reference: Matthew 18:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: ja
  text: そして、もしそれを見つけることがあれば、はっきり言います。その人は、迷い出なかった九十九匹以上に、それを喜びます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な接続を保ち、直前の羊飼いのたとえから自然につなげた。
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: もしそれを見つけることができたなら
  rationale: ἐὰν＋γένηται＋不定詞が表す成否の不確かさを、「見つけたなら」より明示しつつ、現代日本語として自然にした。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: よく言っておきます
  rationale: イエスの厳粛で強調的な定型句を、古風すぎない明瞭な日本語で表した。
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: その一匹のことを喜びます
  rationale: χαίρωの強い喜びを保ち、代名詞の指示対象が羊であることを日本語で明確にした。
- source_word: μᾶλλον ἢ
  choice: 以上に
  rationale: 実質的な比較をそのまま保ち、九十九匹への喜びを排除する表現にはしなかった。
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: 九十九匹
  rationale: 原文では名詞が省略されるが、日本語では助数詞「匹」により羊を自然に示した。
- source_word: τοῖς μὴ πεπλανημένοις
  choice: 迷い出なかった
  rationale: 羊が群れや道から外れる文脈に合う自然な表現で、完了分詞の結果的な状態も伝える。
theological_decisions:
- issue: 羊飼いの喜びの比較が持つ解釈上の力点
  choice: 見つかった一匹を、迷い出なかった九十九匹以上に喜ぶという比較を直接表現する。
  alternative: 誤解を避けるため比較を弱める、または九十九匹への喜びを明示的に補足する。
  rationale: μᾶλλον ἢ は明確な比較であるため、その緊張を保った。九十九匹への配慮の欠如や価値の低さは本文に加えていない。
translation_notes:
  register: 明瞭で現代的な標準日本語。羊飼いのたとえとしての具体性を保ちつつ、厳粛な発言導入には丁寧体を用いた。
