id: MAT.18.34
reference: Matthew 18:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: ja
  text: 主人[a]は怒り、負債を残らず返すまで、彼を拷問する者たち[b]に引き渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主」。ギリシア語はキュリオス。このたとえの中では僕の主人を指すため、本文では「主人」とした。
    reason: alternative_reading
  - marker: b
    text: 別訳「責め苦を加える者たち」。弱い訳では「牢番たち」。このギリシア語は、単なる見張りではなく、苦痛を加える者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: 怒り
  rationale: アオリスト受動形の分詞を主動詞に伴う状況として自然な日本語で表し、主人の怒りが引き渡しの背景にあることを保った。
- source_word: ὁ κύριος αὐτοῦ
  choice: 主人
  rationale: たとえ話の中で僕に対する人間の主人を指すため、「主」という称号ではなく、関係を明確にする「主人」とした。
- source_word: παρέδωκεν αὐτόν
  choice: 彼を…に引き渡した
  rationale: 他者の支配下に渡す司法的・拘禁的な意味を、明瞭で自然な表現にした。
- source_word: τοῖς βασανισταῖς
  choice: 拷問する者たち
  rationale: 単なる牢番ではなく、苦痛や責め苦を加える者を指す語の強さを保った。
- source_word: ἕως οὗ ἀποδῷ
  choice: 返すまで
  rationale: ἕως οὗと接続法が示す、支払いを完了する時点までという将来的な終点を簡潔に表した。
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: 負債を残らず
  rationale: 文脈上の未払い額全体を指すことを明確にし、πᾶνの全面性を「残らず」で表した。
theological_decisions:
- issue: κύριοςを称号的な「主」と訳すか
  choice: 主人
  alternative: 主
  rationale: この箇所では、たとえ話の物語内で僕の主人を指す。神学的含意を否定せず、本文上の直接の指示対象を優先した。
- issue: βασανισταῖςの刑罰的な強さ
  choice: 拷問する者たち
  alternative: 責め苦を加える者たち／牢番たち
  rationale: 語が示す苦痛を加える役割を弱めずに訳した。ただし、このたとえが終末の刑罰について何を意味するかは、訳文でそれ以上に規定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、たとえ話の厳粛さと刑罰表現の強さを保った。「負債を残らず返すまで」は自然な日本語で全額返済の意味を伝える。
