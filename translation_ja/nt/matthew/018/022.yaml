id: MAT.18.22
reference: Matthew 18:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: ja
  text: イエスは彼に言われた。「あなたに言います。七回までではなく、七十七回[a]までです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「七十の七倍まで」。
    reason: ギリシア語の数表現ἑβδομηκοντάκις ἑπτάは、「七十七回」とも「七十の七倍」とも解釈できるため。
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、現代日本語の自然な物語文として過去形で表した。尊敬語によりイエスへの叙述として品位を保った。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 直前の文脈ではペトロを指すが、原文どおり代名詞を保持した。
- source_word: Οὐ λέγω σοι
  choice: あなたに言います。……ではなく
  rationale: 否定と対比を日本語として明瞭に示しつつ、λέγωと二人称単数の与格を直接的に反映した。
- source_word: ἕως ἑπτάκις
  choice: 七回まで
  rationale: 回数の上限を表す文脈なので、ἕωςを「まで」、頻度を示すἑπτάκιςを「七回」とした。
- source_word: ἀλλὰ
  choice: ではなく
  rationale: 「七回まで」と後続の大きな数を対照させる自然な日本語表現とした。
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: 七十七回まで
  rationale: この句は「七十七回」とも「七十の七倍」とも解し得る。本文では語句の一つの自然な理解である「七十七回」を採り、別解を脚注に残した。
theological_decisions:
- issue: 赦しの回数を示す数表現の曖昧さ
  choice: 七十七回
  alternative: 七十の七倍（四百九十回）
  rationale: ἑβδομηκοντάκις ἑπτάには古くから二通りの理解があるため、一方を本文に採用しつつ他方を脚注で明示した。これが厳密な赦しの上限かどうかは訳文で説明せず、原文の表現と緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、直接話法には丁寧体を採用した。数字は読みやすい漢数字とし、原文にない解釈的説明は本文へ加えていない。
