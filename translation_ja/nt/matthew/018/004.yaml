  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ja
  text: ですから、この子どものように自分を低くする人こそ、天の国で最も偉大な者です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: 自分を低くする
  rationale: 自らをへりくだらせるという再帰的な意味を明確にしつつ、現代の一般読者に自然に伝わる表現とした。
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: この子どものように
  rationale: 直前にいる特定の子どもを指す指示性と、比較をそのまま保持した。
- source_word: ὁ μείζων
  choice: 最も偉い
  rationale: 定冠詞を伴う比較級が文脈上示す最上級的な意味を自然な日本語で表した。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイ特有の表現を簡潔かつ現代的に訳し、統治と領域の両方を含みうる原語の幅を不必要に限定しない。
theological_decisions:
- issue: 天の国における偉大さと自己卑下の関係
  choice: 「自分を低くする人、その人こそ…最も偉い」と訳す
  alternative: 「子どものように謙遜な人が…最も偉い」と訳す
  rationale: 「謙遜な」と性質に置き換えず、ταπεινώσει ἑαυτόν が表す自発的な行為を保持した。また οὗτος の再提示と強調を「その人こそ」で反映した。
translation_notes:
  register: 明瞭で現代的な敬体。「ですから」で論理的な接続を示し、「その人こそ」によって原文の指示的な強調を自然に再現した。
