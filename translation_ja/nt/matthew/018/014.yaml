id: MAT.18.14
reference: Matthew 18:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: ja
  text: 同じように、天におられるあなたがたの父は、この小さい者たちの一人が滅びることを望んでおられません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅びる」は「失われる」とも訳せる。直前の迷い出た羊のたとえは、後者の意味合いを支持する。
    reason: ἀπόληται の語義と直近の文学的文脈の両方を保つため。
lexical_decisions:
- source_word: οὕτως
  choice: 同じように
  rationale: 直前の迷い出た羊のたとえと本節を結び、その比較・帰結の関係を自然な現代日本語で示す。
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς
  choice: 父は…望んでおられません
  rationale: 直訳的な「父の前では意志ではない」は日本語として不自然なため、神の意向・願いを表す慣用的な構文にした。ἔμπροσθενの含意は、この文脈では父ご自身の意向として表現される。
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: 天におられるあなたがたの父
  rationale: 複数形 οὐρανοῖς を日本語で自然な「天」とし、ὑμῶν の複数を「あなたがた」に明示した。
- source_word: ἵνα ἀπόληται
  choice: 滅びること
  rationale: ἀπόλλυμι の深刻な結果を保つ「滅びる」を本文に採用する一方、直前の迷い出た羊とのつながりから可能な「失われる」を脚注に残した。
- source_word: ἓν τῶν μικρῶν τούτων
  choice: この小さい者たちの一人
  rationale: ἓν を過度に強調せず「一人」と訳し、μικροί は幼児だけに限定せず、章の弟子共同体における弱く取るに足りないと見られる者をも含み得る表現として「小さい者たち」とした。
theological_decisions:
- issue: ἀπόληται が最終的な滅びを指すか、迷って失われることを指すか
  choice: 滅びる
  alternative: 失われる
  rationale: 語そのものは双方の意味を持ち得る。本文では警告の深刻さを保つ「滅びる」を用い、直前の迷い出た羊の文脈が支持する別の含みを脚注で明示して、曖昧さを解消しすぎないようにした。
- issue: 「小さい者たち」の指示対象
  choice: 年少者に限定しない表現
  alternative: 子どもたち
  rationale: 章の文脈では子どものイメージが用いられているが、弟子や弱い立場の信じる者まで含む可能性があるため、対象を子どもだけに限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御心ではありません」も可能だが、一般読者により直接的な「望んでおられません」を採用した。父への敬意は敬語で表し、「小さい者たち」は年齢に限定されない聖書的比喩として保持した。
