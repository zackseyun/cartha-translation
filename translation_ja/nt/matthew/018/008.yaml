  to: もしあなたの手か足があなたをつまずかせるなら[a]、それを切り落とし、自分から投げ捨てなさい。両手または両足を持ったまま永遠の火に投げ込まれるよりは、片手を失った、あるいは足が不自由な状態で、いのちに入るほうが、あなたにとってよいのです。
