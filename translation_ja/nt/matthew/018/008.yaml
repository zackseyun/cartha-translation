id: MAT.18.8
reference: Matthew 18:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: ja
  text: もしあなたの手か足があなたをつまずかせるなら[a]、それを切り落とし、自分から投げ捨てなさい。両手または両足を持ったまま永遠の火に投げ込まれるよりは、片手を失った、あるいは足が不自由な状態で、いのちに入るほうが、あなたにとってよいのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を犯させるなら」。ギリシア語の動詞は、字義どおりには「つまずかせる」という比喩的表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: つまずかせる
  rationale: 罪や離反へ導くことを表す文脈上の意味を保ちつつ、ギリシア語の「つまずき」の比喩をそのまま残す。
- source_word: ἔκκοψον
  choice: 切り落とし
  rationale: 手や足を対象とする強い命令の具体性と厳しさを保つ自然な日本語。
- source_word: βάλε ἀπὸ σοῦ
  choice: あなたから投げ捨てなさい
  rationale: 力をもって遠ざける動作と、自分から分離する意味の双方を表す。
- source_word: καλόν σοί ἐστιν
  choice: あなたにとってよい
  rationale: ἤによる二つの結果の比較を日本語の「よりは……ほうがよい」で明確に示す。
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: いのちに入る
  rationale: 原文にない「永遠の」を補わず、終末論的な含意を持つ簡潔な表現を維持する。表記は聖書的な意味の厚みを示しつつ平易な「いのち」とした。
- source_word: κυλλὸν
  choice: 手足を失ったり
  rationale: 直前の手を切り落とす命令に即し、身体の一部を欠いた状態を現代日本語で明瞭に示す。
- source_word: χωλόν
  choice: 足が不自由になったり
  rationale: 歩行に障害のある状態を、現代の読者に自然で配慮ある言い方で表す。
- source_word: ἔχοντα
  choice: 両手、両足がそろったまま
  rationale: 二つの手または二つの足を持つ完全な身体状態と、前半の欠損状態との対照を自然な日本語にする。
- source_word: βληθῆναι
  choice: 投げ込まれる
  rationale: 受動態を保ち、火の中へ放り込まれる強い動きを明確にする。
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: 永遠の火
  rationale: 裁きの文脈におけるαἰώνιοςの通常の意味を、簡潔かつ伝統に偏らない現代日本語で示す。
theological_decisions:
- issue: σκανδαλίζειを道徳的に説明するか、つまずきの比喩を保つか
  choice: つまずかせる
  alternative: 罪を犯させる
  rationale: 原文の比喩と、その比喩が含む罪への誘因という意味の両方を保つため。別訳を脚注に示して意味を明確にする。
- issue: εἰς τὴν ζωὴνの「いのち」を明示的に「永遠のいのち」とするか
  choice: いのち
  alternative: 永遠のいのち
  rationale: 終末論的意味は文脈上明らかだが、原文にはここで「永遠の」に相当する語がないため補わない。
- issue: 身体切断の命令を比喩として説明するか
  choice: 命令の具体的で厳しい表現をそのまま訳す
  alternative: 罪の原因を徹底して取り除くという説明に言い換える
  rationale: 誇張法か文字どおりかを訳文で決着させず、原文の衝撃と解釈上の緊張を保存する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳しさと終末的な対照を保った。「不具」「足なえ」などの古風または侮蔑的に響きうる語を避け、「手足を失ったり、足が不自由になったり」とした。
