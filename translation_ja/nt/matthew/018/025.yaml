id: MAT.18.25
reference: Matthew 18:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: ja
  text: しかし、彼が返済できなかったので、主人は、彼自身とその妻、子どもたち、また彼の持ち物すべてが売却され、返済がなされるよう命じた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このたとえでは、返済不能な僕について、本人とその家族、ならびにその所有物を売却し、その代金によって返済を行うよう命じられています。
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: しかし、彼には返済することができなかったので
  rationale: 属格独立構文が示す事情・理由を自然な日本語で表した。ἔχω＋不定詞はここで返済能力がないことを意味し、単に所持金が皆無だったと限定しない。
- source_word: ἐκέλευσεν
  choice: 命じた
  rationale: 権威をもって指図することを表す κελεύω に対応する、明瞭で格調を保った表現。
- source_word: ὁ κύριος
  choice: 主人
  rationale: この寓話では僕に対する人間の主人を指すため、「主」という神的称号を思わせる訳を避け、文脈上自然な語を選んだ。
- source_word: πραθῆναι
  choice: 売り
  rationale: 受動不定詞「売られること」を、日本語では命令内容を示す能動的な連用形に組み替えた。売却対象が本人以下であることは保持している。
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: その妻、子どもたち
  rationale: 定冠詞を文脈に即した所有関係として自然に表し、家族がともに売却対象となることを明確にした。
- source_word: πάντα ὅσα ἔχει
  choice: 彼の持ち物すべて
  rationale: 現在形 ἔχει の意味を保ち、所有する物の総体を簡潔に表した。
- source_word: καὶ ἀποδοθῆναι
  choice: 返済に充てるよう
  rationale: 売却によって支払いが行われるという受動不定詞の結果・目的を自然な日本語にした。原文が明示しない「借金」という名詞は補わなかった。
theological_decisions:
- issue: 寓話中の κύριος の訳語
  choice: 主人
  alternative: 主
  rationale: 語りの内部では僕を支配する人間の主人を指す。「主人」は κύριος の社会的関係を自然に示しつつ、この箇所自体を直接の神的称号として扱うことを避ける。
translation_notes:
  register: 明瞭な現代標準日本語。寓話の厳しい社会的・法的状況を和らげずに示しつつ、逐語的で不自然な受動表現は避けた。脚注記号は文全体に関わる文化的説明として文末に置いた。
