  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: ja
  text: しかし、彼は応じようとせず[a]、むしろ立ち去って、仲間を負債[c]を返すまで牢に投げ込んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その気にならなかった」または「望まなかった」。文脈上、「拒んだ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「牢に入れた」とも訳せる。ギリシア語の動詞は字義的には「投げ入れた」で、強い表現。
    reason: lexical_alternative
  - marker: c
    text: 「負債」は「支払うべきもの」または「借金」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: しかし、その人は
  rationale: 冠詞が名詞的に用いられ、直前のしもべを指す。δέの対照を「しかし」で示し、日本語では指示対象を明確にするため「その人」とした。
- source_word: οὐκ ἤθελεν
  choice: 承知せず
  rationale: 字義的には「望まなかった／その気がなかった」。文脈上は仲間の願いを受け入れなかったことを表すため、意志的な拒絶を自然に示す「承知せず」とした。ただし字義的表現は脚注に残した。
- source_word: ἀλλὰ
  choice: （後続動作との対照）
  rationale: 強い逆接は、前半の「しかし」と「承知せず」に続く動作の展開によって日本語として十分に表されるため、独立した「むしろ」は置かなかった。
- source_word: ἀπελθὼν
  choice: 立ち去って
  rationale: アオリスト分詞による先行ないし付随動作を、自然な連用表現で示した。
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: 仲間を牢に投げ込んだ
  rationale: βάλλωの強い動作性を「投げ込んだ」で保った。目的語は文脈上、同じしもべ仲間なので、単なる「彼」より分かりやすい「仲間」とした。
- source_word: ἕως οὗ
  choice: まで
  rationale: 投獄の期限を示す時間表現として簡潔で自然。
- source_word: ἀποδῷ
  choice: 返す
  rationale: ἀποδίδωμιはここでは負債の返済を指す。ἕως οὗに続く接続法の未完了・予期的な意味は「返すまで」で自然に表される。
- source_word: τὸ ὀφειλόμενον
  choice: 負債
  rationale: 名詞化された分詞「負っているもの／支払うべきもの」を、金銭債務の文脈に即して簡潔に表した。別の直訳的表現は脚注に示した。
theological_decisions: []
