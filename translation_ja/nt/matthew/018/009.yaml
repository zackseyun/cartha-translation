id: MAT.18.9
reference: Matthew 18:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: ja
  text: また、もしあなたの目があなたをつまずかせるなら[a]、それをえぐり出して、あなたから投げ捨てなさい。両目がそろったまま火のゲヘナ[b]に投げ込まれるよりは、片目でいのちに入るほうが、あなたにとってよいのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたに罪を犯させるなら」。ギリシア語の動詞は、人をつまずかせること、倒れさせること、また罪に陥らせることを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「ゲヘナ」は最終的な裁きの場所を指す語。伝統的には「地獄」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: つまずかせる
  rationale: つまずきや転倒の比喩を保ちつつ、文脈上の罪への誘引も含み得る語として訳した。意味を「罪を犯させる」だけに限定しない。
- source_word: ἔξελε
  choice: えぐり出しなさい
  rationale: 目を取り去るという強烈で切迫した命令の比喩を、現代日本語で自然かつ鮮明に表す。
- source_word: βάλε ἀπὸ σοῦ
  choice: あなたから投げ捨てなさい
  rationale: 自分から決然と遠ざけるという βάλλω と ἀπό の意味を保った。
- source_word: καλόν σοί ἐστιν
  choice: あなたにとってよい
  rationale: ἤ による比較の中で、二つの帰結のうち望ましいほうを示す表現として訳した。
- source_word: μονόφθαλμον
  choice: 片目で
  rationale: 「片目の、片目だけの」という意味を、文脈に合う簡潔で自然な日本語にした。
- source_word: εἰς τὴν ζωὴν
  choice: いのちに入る
  rationale: 原文に「永遠の」という形容語はないため補わず、終末論的な含意を持ち得る「いのち」をそのまま保った。
- source_word: βληθῆναι
  choice: 投げ込まれる
  rationale: 受動形と、ある場所の中へ放り込まれる動きを自然な日本語で表した。
- source_word: γέενναν
  choice: ゲヘナ
  rationale: ユダヤ的・終末論的背景を持つ固有の語を保持し、より広い後代の概念である「地獄」に一律に置き換えなかった。
- source_word: τοῦ πυρός
  choice: 火の
  rationale: 属格表現を簡潔に保持し、「火のゲヘナ」という原文の鮮烈な像を伝える。
theological_decisions:
- issue: γέεννα の訳語
  choice: ゲヘナ
  alternative: 地獄
  rationale: 原文固有の用語とその歴史的・終末論的含意を保ち、後代の包括的な神学用語へ狭めたり広げたりしないため。
- issue: εἰς τὴν ζωὴν の訳し方
  choice: いのちに入る
  alternative: 永遠のいのちに入る
  rationale: 文脈上は終末的ないのちを指す可能性が高いが、原文に「永遠の」は明記されていないため、解釈を本文へ補わない。
- issue: 身体切除の命令の表現
  choice: 強烈な命令表現をそのまま保持する
  alternative: 罪の原因を取り除きなさい、と説明的に意訳する
  rationale: この節の誇張的で衝撃的な身体像を説明へ置換せず、読者が文脈からその機能を受け取れるようにした。
translation_notes:
  register: 明瞭で現代的ながら尊厳のある文体とした。「えぐり出す」「投げ捨てる」「投げ込まれる」により原文の厳しい像を弱めず、「いのち」「ゲヘナ」によって原文の語彙上・神学上の余地を保った。
