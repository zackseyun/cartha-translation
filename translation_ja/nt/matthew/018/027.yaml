id: MAT.18.27
reference: Matthew 18:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: ja
  text: すると、その奴隷の主人は深く憐れみ、彼を解放し、借金を免除した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: 深く憐れみ
  rationale: 内臓が揺さぶられるような深い憐れみを表す語であり、自然な現代日本語でその感情の強さを伝える。
- source_word: δὲ
  choice: すると
  rationale: ここでは対比よりも物語の進行と、それを受けた主人の反応を示す。
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  choice: その奴隷の主人
  rationale: κύριοςはこのたとえの中の人間の主人を指すため、「主」ではなく「主人」とした。δοῦλοςは所有・隷属関係が文脈上重要なので「奴隷」とした。
- source_word: ἀπέλυσεν αὐτόν
  choice: 彼を解放し
  rationale: 拘束や差し押さえの対象となる状況から行かせる意味を、過度に限定せず表す。
- source_word: τὸ δάνειον ἀφῆκεν αὐτῷ
  choice: 借金を免除した
  rationale: δάνειονは本来、貸し付けたもの・貸付金を指すが、この場面では返済義務としての借金である。ἀφίημιと合わせて、日本語で自然な債務免除の表現とした。
theological_decisions:
- issue: κύριοςを神的称号と読む可能性
  choice: 人間の「主人」と訳す
  alternative: 「主」
  rationale: 直接の指示対象はたとえに登場する奴隷の主人である。たとえ全体の神学的対応関係は残しつつ、本文で直接神と同一視しない。
- issue: δοῦλοςの社会的身分
  choice: 「奴隷」と訳す
  alternative: 「僕」「しもべ」
  rationale: 主人との非対称な所有・支配関係が場面の理解に関わるため、身分を明確に示した。
- issue: ἀφίημιの赦しとの神学的響き
  choice: 金銭的文脈に即して「免除した」と訳す
  alternative: 「赦した」
  rationale: 目的語がδάνειονであるため、直接には債務の免除を意味する。罪の赦しとの比喩的な響きを排除はしないが、本文で両者を混同しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。文脈上必要な社会的・法的関係を具体的に示しつつ、たとえの神学的含意を訳文で先取りしない。
