id: MAT.18.7
reference: Matthew 18:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: ja
  text: つまずきとなるもののために、世には災いがある。[a] つまずきとなるものが来ることは避けられないからである。[b] しかし、つまずきがその人を通して来る人には、災いがある。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つまずきとなるもの」は、人を罪へ誘うもの、罪を犯すきっかけ、わな、反感を抱かせるもの、とも訳せる。ギリシア語は、人をつまずかせるものを幅広く指す。
    reason: lexical_alternative
  - marker: b
    text: 「避けられない」と訳したギリシア語の表現は必要性を表すが、その必要性が何に基づくかは、ここでは明示されていない。
    reason: theological_ambiguity
  - marker: c
    text: 「人」は、つまずきが来る経路となる一人の人を指す。この警告は、性別にかかわらず、これに当てはまる人を含む。
    reason: referent_clarification
lexical_decisions:
- source_word: οὐαί
  choice: 災いだ
  rationale: 預言的な嘆きと裁きの宣告の両面を保ち、二つの節で同じ表現を繰り返した。
- source_word: κόσμῳ
  choice: 世
  rationale: 物質的な被造世界だけでなく、人間社会を広く指し得る語として、簡潔で自然な「世」を用いた。
- source_word: ἀπὸ
  choice: 〜のために
  rationale: ここでは原因を示すため、「〜から」ではなく、災いの原因を表す日本語とした。
- source_word: σκάνδαλα / σκάνδαλον
  choice: つまずきとなるもの／つまずき
  rationale: 人を罪へ誘うもの、陥れるもの、反感を抱かせるものという幅を狭めず、つまずきの比喩を保った。原文の複数・単数の推移は、日本語では前半の「もの」と後半の個別的な「つまずき」によって示した。
- source_word: ἀνάγκη
  choice: 避けられない
  rationale: 必要性・不可避性を自然な現代日本語で表しつつ、その根拠が神の定めなのか、堕落した世の実情なのかを本文で限定しない。
- source_word: γάρ
  choice: 〜からである
  rationale: 直前の災いの宣告に理由・説明を加える関係を明示した。
- source_word: ἐλθεῖν ... ἔρχεται
  choice: 来る……来る
  rationale: 原文の動詞の反復を保ち、「起こる」と抽象化しなかった。
- source_word: πλήν
  choice: しかし
  rationale: つまずきの不可避性から、それをもたらす個人の責任への強い転換を明確にした。
- source_word: ἀνθρώπῳ
  choice: その人
  rationale: 特定の男性に限定せず、つまずきが来る経路となる一人の人間を指す原文の単数形を自然に表した。
- source_word: δι’ οὗ
  choice: その人を通して
  rationale: その人が、つまずきの到来する経路・媒介であるという原文の表現を保った。
theological_decisions:
- issue: ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα における必要性の性質
  choice: 「来ることは避けられない」とし、必要性・不可避性は示すが、その根拠を特定しない。
  alternative: 「来なければならない」として神的必然を強く響かせる、または「きっと来る」として経験的な予測に弱める。
  rationale: ギリシア語は必要性を述べるが、その原因を明示しない。神が罪を直接生じさせるという含意を加えず、同時に単なる可能性へ弱めないため。
- issue: つまずきの不可避性と、それをもたらす人の責任
  choice: 「しかし」によって、不可避性を述べた直後にも個人への災いの宣告をそのまま保持する。
  alternative: 不可避なら責任が軽くなるとの説明を加える、または不可避性を弱めて責任との緊張を解消する。
  rationale: 本文は不可避性と人間の責任を並べており、その神学的緊張を説明で解消していないため。
- issue: ἀνθρώπῳ の指示範囲
  choice: 「その人」と訳し、性別を限定せず、該当する一人ひとりへの警告として示す。
  alternative: 「その男」として文法上の男性形を前面に出す。
  rationale: ἄνθρωπος はこの文脈では人間一般の一個人を指し得る。日本語の「人」は単数性を保ちつつ、原文にない男性限定を加えない。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「世は災いだ」という簡潔で重い宣告調を採用した。原文の「来る」の反復と、不可避性から個人責任へ移る対照をできる限り保持した。末文は修辞的な反復を優先して「その人」を二度置いている。
