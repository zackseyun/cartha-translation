  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: ja
  text: あなたがたはどう思いますか。ある人が百匹の羊を持っていて、そのうちの一匹が迷い出たなら、その人は九十九匹を山々に残して、迷っているその一匹を捜しに行くのではありませんか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: あなたがたはどう思いますか
  rationale: 聞き手の判断を直接促す問いとして、複数の二人称を明示し、現代日本語で自然に表した。
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα
  choice: ある人が百匹の羊を持っていて
  rationale: 与格を伴う γίνομαι の所有を表す慣用を「持っていて」とし、τινι ἀνθρώπῳ は男性に限定しすぎない自然な「ある人」で表した。
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: そのうちの一匹が迷い出たなら
  rationale: πλανάω の受動形がここで表し得る「迷う／さまよう」の意味を保ちつつ、外部の行為者によって迷わされたとは限定しない。「迷い出る」は群れから離れる羊の情景にも合う。
- source_word: οὐχὶ ἀφήσει τὰ ἐνενήκοντα ἐννέα
  choice: その人は九十九匹を…残し
  rationale: οὐχί が肯定の答えを予期する修辞疑問であることを文末の「のではありませんか」で示し、ἀφίημι は恒久的な遺棄を連想させる「見捨てる」でなく「残す」とした。
- source_word: ἐπὶ τὰ ὄρη
  choice: 山々に
  rationale: ὄρη の複数形を保って「山々」とし、ἐπί の場所的用法を自然な助詞「に」で表した。
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: 出て行って…捜す
  rationale: 先行する分詞の移動を「出て行って」と明示し、ζητέω は行方の分からない羊を見つけようとする文脈に適した「捜す」とした。
- source_word: τὸ πλανώμενον
  choice: 迷っているその一匹
  rationale: 現在分詞の継続的な様相と、先の πλανηθῇ との語義上の対応を保つ。「失われた一匹」として原文にない ἀπόλλυμι の含意を持ち込むことを避けた。
theological_decisions:
- issue: πλανάω が示す迷いの主体性または外的作用
  choice: 迷い出た／迷っている
  alternative: 迷わされた／失われた
  rationale: 受動形は「迷わされる」も文法上可能だが、この羊の比喩では中動的な「迷う」の意味が自然である。原因や責任を特定せず、道徳的・神学的含意の余地を残した。
- issue: οὐχί を伴う問いの性質
  choice: 捜すのではありませんか
  alternative: 捜しに行きませんか／捜すでしょう
  rationale: 肯定の答えを期待する原文の修辞疑問を維持し、単なる断定に変えなかった。
- issue: τινι ἀνθρώπῳ の表現
  choice: ある人
  alternative: ある男／だれか
  rationale: この例話における男性単数の人物を自然に指しつつ、ἄνθρωπος の代表的人間という用法を過度に男性限定しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、修辞疑問の格調を保った。「探す」よりも、行方不明のものを求める意味が明確な「捜す」を採用した。原文の反復する πλανάω は「迷い出た／迷っている」と対応させた。
