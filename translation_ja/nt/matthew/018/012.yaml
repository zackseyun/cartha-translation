    rationale: 脚注の引用する「九十九匹を山々に残して、出て行き」は、本文の「九十九匹を山々に残し、出て行って」と実質的に同じ連結を言い換えているだけであり、異読として提示すべき本文差を示していません。また脚注アンカーが文末にあり、対象箇所も不明確です。SBLGNTの提示本文に基づく本節の日本語訳には、この脚注は不要です。
  - severity: low
    issue: 「出て行って」は πορευθείς より方向性が強い。
    rationale: πορευθείς はここでは「行って」の意味であり、話者・羊飼いの現在地から『外へ出る』ことまでは明示しません。中立的な「捜しに行く」が適切です。
