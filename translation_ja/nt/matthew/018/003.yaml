  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: ja
  text: そして言われた。「まことに、あなたがたに言います。向きを変えて[a]、子どもたちのようにならなければ、決して天の御国に入ることはありません[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立ち返って」、あるいは受動的に「向きを変えられて」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では、ここに強い否定表現が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: まことに
  rationale: 厳粛で権威ある宣言を導く定型句。現代日本語で意味が明瞭で、聖書本文としての品位も保つ。
- source_word: στραφῆτε
  choice: 向きを変えて
  rationale: アオリスト受動接続法だが、ここでは自動詞的・受動的の両方に解し得る。「向きを変える」は決定的な方向転換を示しつつ、主体を過度に限定しない。
- source_word: γένησθε
  choice: なる
  rationale: 状態の変化を表す通常の意味を自然な日本語で示し、στραφῆτεと並ぶ二つの動作を保持する。
- source_word: ὡς τὰ παιδία
  choice: 子どもたちのように
  rationale: 定冠詞を伴う複数形を具体性のある「子どもたち」とした。直前に立たされた一人の子どもを意識させる可能性を残しつつ、特定の性質を本文に付加しない。
- source_word: οὐ μὴ εἰσέλθητε
  choice: 決して…入ることはありません
  rationale: οὐ μήによる強い否定を、明瞭で自然な現代日本語として表す。
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: 天の御国
  rationale: マタイに特徴的な表現を、日本語聖書で広く理解される語として訳す。「御」は敬意を示す慣用的な表記で、意味を付加しない。
theological_decisions:
- issue: στραφῆτεの回心的表現
  choice: 「向きを変える」と訳し、技術的な教理用語にしない。
  alternative: 「回心する」「立ち返る」「向きを変えさせられる」
  rationale: 本文は決定的な方向転換を求めるが、後代の専門的な回心概念や行為主体を一義的に規定してはいない。
- issue: παιδίαが示す弟子のあり方
  choice: 「子どもたち」と具体的に訳し、性質を説明しない。
  alternative: 「幼子たち」「子どものように純真に／謙遜に」
  rationale: この節自体は、子どものどの性質が比較点なのかを明示していないため、純真さや謙遜などに限定せず解釈の開放性を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣言としての格調を保った。「まことに」「天の御国」は日本語聖書として理解しやすい慣用表現。
