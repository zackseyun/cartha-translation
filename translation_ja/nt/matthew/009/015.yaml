revisions:
- from: イエスは彼らに言われた。「花婿が一緒にいる間、婚礼の付き添いたち[a]は悲しむことができるでしょうか。しかし、花婿が彼らから取り去られる[b]日が来ます。その時、彼らは断食します。」
  to: イエスは彼らに言われた。「花婿が彼らと一緒にいる間、婚礼の付き添い人たち[a]が悲しむことなどできないでしょう。しかし、花婿が彼らから取り去られる[b]日々が来ます。その時、彼らは断食します。」
  rationale: 原文の μή を反映して、花婿が共にいる間は悲しむことが不可能だという反語の力を明示した。あわせて、「付き添いたち」を自然な「付き添い人たち」に整えた。それ以外は、花婿の比喩、取り去られることの含み、将来の断食を解釈的に拡張せず保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:37Z'
