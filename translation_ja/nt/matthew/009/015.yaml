id: MAT.9.15
reference: Matthew 9:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: ja
  text: イエスは彼らに言われた。「花婿が彼らと一緒にいる間、婚礼の付き添い人たち[a]が悲しむことなどできないでしょう。しかし、花婿が彼らから取り去られる[b]日々が来ます。その時、彼らは断食します。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「婚礼の部屋の子ら」。花婿の仲間や婚礼の付き添い人を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「引き離される」。受動形には、単なる出立以上の意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: 婚礼の付き添いたち
  rationale: 直訳は「婚礼の部屋の子ら」だが、婚礼に連なる者、とりわけ花婿の仲間や付き添いを指す慣用句である。現代日本語で社会的役割が明確に伝わる表現を選んだ。
- source_word: πενθεῖν
  choice: 悲しむ
  rationale: 喪に服して嘆き悲しむことを表す語で、断食との対比にも適する。「嘆き悲しむ」より簡潔で自然な表現とした。
- source_word: ἐφ’ ὅσον
  choice: 間
  rationale: 継続する期間を示すため、「一緒にいる間」と自然な日本語にした。
- source_word: νυμφίος
  choice: 花婿
  rationale: 婚礼の比喩を保ち、文脈上の象徴的な響きを説明的に限定しない表現である。
- source_word: ἀπαρθῇ
  choice: 取り去られる
  rationale: 単なる出立ではなく、外から引き離されることを示唆する受動形の含みを保った。
- source_word: νηστεύσουσιν
  choice: 断食します
  rationale: 未来形を明確かつ自然に表し、宗教的実践としての意味を簡潔に伝える。
- source_word: Μὴ δύνανται ... ;
  choice: 悲しむことができるでしょうか
  rationale: 否定の答えを予期する修辞疑問の形を保った。日本語では文脈により「できないでしょう」の含意が自然に伝わる。
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: しかし、……日が来ます
  rationale: ギリシア語は複数形「日々」だが、将来そのような時が訪れるという慣用的表現であり、日本語では単数形の「日が来る」が最も自然である。δέの穏やかな対比は「しかし」で示した。
theological_decisions:
- issue: 花婿の比喩が持つキリスト論的含意
  choice: 「花婿」という比喩をそのまま保ち、イエスを明示的にメシア的花婿と説明しない
  alternative: 「メシアである花婿」などと解釈を訳文に加える
  rationale: 本文そのものが読者に比喩の意味を考えさせているため、神学的含意を明示して緊張を解消せず、原文の比喩性を保つ。
- issue: 花婿が「取り去られる」ことの含意
  choice: 受動表現を維持し、死や受難を訳文で明示しない
  alternative: 「殺される」または「死によって取り去られる」と解釈的に訳す
  rationale: この動詞は強制的な隔離や受難の予示を含み得るが、本文はその出来事を明示していないため、含みを残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言は丁寧体で統一した。婚礼の喜びと後の悲しみ・断食との対比が自然に伝わるようにしつつ、花婿の比喩と「取り去られる」の神学的含意は説明し過ぎず保持した。
