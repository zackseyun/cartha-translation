  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: ja
  text: 悪霊が追い出されると、口の利けなかった人[a]は話した。群衆は驚いて言った。「このようなことは、イスラエルで一度も見られたことがない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耳の聞こえなかった人」とも訳せる。ギリシア語は「耳が聞こえない」と「口が利けない」のどちらも意味し得るが、ここではその人が話したことに重点がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: 追い出されると
  rationale: アオリスト受動分詞の属格独立構文が示す、主動詞に先立つ出来事を、自然な日本語の時間表現で表した。
- source_word: τοῦ δαιμονίου
  choice: 悪霊が
  rationale: 福音書の悪霊追放の文脈における δαιμόνιον を、現代日本語で明確かつ一般的な「悪霊」とした。
- source_word: ἐλάλησεν
  choice: 話し始めた
  rationale: 形態上は単純なアオリストだが、それまで話せなかった人が実際に話したという状態変化を、日本語で自然に示す。継続的に話したとの意味は加えていない。
- source_word: ὁ κωφός
  choice: 口の利けなかった人
  rationale: κωφός は「耳の聞こえない」と「口の利けない」の両義を持つが、直後の「話した」がこの箇所では発話不能を焦点としている。「人」は先行文脈から補った。
- source_word: ἐθαύμασαν
  choice: 驚いて
  rationale: 群衆の強い驚嘆を、明快で自然な現代日本語として表した。
- source_word: οἱ ὄχλοι
  choice: 群衆は
  rationale: ギリシア語は複数形だが、日本語では集合を表す「群衆」が自然であり、数を不必要に際立たせない。
- source_word: Οὐδέποτε
  choice: 一度も……ない
  rationale: 「決して／これまで一度もない」という強い否定を、日本語の呼応表現で明確にした。
- source_word: ἐφάνη
  choice: 見られたことがない
  rationale: φαίνω の受動形は「現れた」とも「見られた」とも取れる。ここでは前例のない出来事を目撃した群衆の発言として自然な「見られた」を採った。
- source_word: οὕτως
  choice: このようなこと
  rationale: 直前の出来事の様態を指す語を、日本語で主語を明示する必要に応じて名詞化した。
- source_word: ἐν τῷ Ἰσραήλ
  choice: イスラエルで
  rationale: 土地と民の双方を含み得る原文の簡潔な表現を保った。
theological_decisions:
- issue: κωφός の意味範囲
  choice: 「口の利けなかった人」と訳す。
  alternative: 「耳の聞こえない人」
  rationale: 語自体には両義があるため注で代案を示す一方、この節の結果が「話した」であることから、本文では発話不能を前面に出した。聴覚障害まで本文に付加しない。
- issue: ἐφάνη の受動表現
  choice: 「見られたことがない」と訳す。
  alternative: 「現れたことがない」
  rationale: 群衆が出来事の前例のなさを語る文脈では「見られた」が自然である。ただし原語の「現れる」という語感も可能であり、出来事の主体や性質を神学的に限定しない。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で品位ある物語調とした。「口が利けない」は意味が明瞭だが、人物を固定的な属性で呼ばないよう「口の利けなかった人」と表現した。引用は自然な口語に寄せつつ、聖書本文としての格調を保った。
