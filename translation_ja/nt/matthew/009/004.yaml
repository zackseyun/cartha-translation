  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: ja
  text: イエス[a]は彼らの思いを知って、言われた。「なぜあなたがたは心の中で悪いことを考えているのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼らの思いを察して」。
    reason: εἰδώςはここで、内心の思いを知ることを表す。本文では自然で直接的な「知って」を用い、知覚・認識の含みを持つ代案を注で示す。
lexical_decisions:
- source_word: εἰδὼς
  choice: 知って
  rationale: 完了分詞が表す、彼らの内面の思いをイエスが把握していたことを、簡潔で自然な日本語にした。単なる視覚的な「見て」には限定しない。
- source_word: ἐνθυμήσεις
  choice: 考えていること
  rationale: 内面で巡らす思考や考量を指す。後半の同語根の動詞とのつながりを保ちつつ、現代日本語として自然にした。
- source_word: Ἱνατί
  choice: なぜ
  rationale: 理由や動機を問う疑問語を、明快な現代日本語で表した。
- source_word: ἐνθυμεῖσθε
  choice: 考えている
  rationale: 現在形が示す進行中の内的思考を表し、前半のἐνθυμήσειςとの語彙的対応も保った。
- source_word: πονηρὰ
  choice: 悪いこと
  rationale: 中性複数形の形容詞が名詞的に用いられ、悪い思いや事柄を指す。「悪を」と断定的・抽象的にせず、自然な日本語にした。
- source_word: καρδίαις
  choice: 心
  rationale: 思考と意図を含む内なる人を表す原文の比喩を保ち、「頭」や「思考」に狭めなかった。
theological_decisions:
- issue: 口に出されていない思いをイエスが知っていたこと
  choice: イエスは彼らの考えていることを知って
  alternative: イエスは彼らの考えていることを見抜いて
  rationale: 本文が述べるイエスの内面認識をそのまま表し、それがどのようになされたかについて本文を超える教理的説明を加えない。「見抜いて」は知覚・洞察の含みを強めるため、より直接的な「知って」を採用した。
translation_notes:
  register: 明瞭で自然な現代標準日本語。会話部分には簡潔さと威厳を持たせ、「心の中」という聖書的比喩を保持した。
