source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: ja
  text: イエスがその家[b]で食卓に身を横たえておられたとき[a]、見よ、多くの徴税人や罪人たちがやって来て、イエスとその弟子たちと共に食卓で身を横たえていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は、食事の際に身を横たえる姿勢を表している。当時、そのようにして食卓を囲む習慣があった。より自然な言い方では「食事をしておられたとき」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語本文は単に「その家」と述べており、この節だけでは誰の家かを明示していない。
    reason: ambiguity
lexical_decisions:
- source_word: ἐγένετο αὐτοῦ ἀνακειμένου
  choice: イエスが…食卓に横になっておられると
  rationale: καὶ ἐγένετο は物語を進める構文として自然な時間表現にし、属格絶対構文の主語は文脈上のイエスと明示した。ἀνάκειμαι は当時の食事姿勢を表すため、「食卓に横になる」と訳した。
- source_word: ἐν τῇ οἰκίᾳ
  choice: その家で
  rationale: 定冠詞を「その」に反映しつつ、本文が家の所有者を明示していないことを保った。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 後続の光景に注意を促す談話標識としての際立ちと物語の生動感を保った。
- source_word: τελῶναι
  choice: 徴税人
  rationale: 税を請け負って徴収した人々を指す福音書の標準的で明瞭な訳語であり、文脈上の社会的評価も損なわない。
- source_word: ἁμαρτωλοὶ
  choice: 罪人たち
  rationale: 名詞的に用いられた形容詞を、当時の社会的・宗教的な呼称として簡潔に訳した。
- source_word: ἐλθόντες
  choice: やって来て
  rationale: アオリスト分詞が示す先行・付随動作を、自然な日本語の動作の連続として表した。
- source_word: συνανέκειντο
  choice: 一緒に食卓に横になった
  rationale: 共に食事の席に着くことを表す複合動詞であるため、食事姿勢と食卓の交わりの両方が見える訳とした。
- source_word: τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ
  choice: イエスやその弟子たちと
  rationale: 与格の共同関係を「と」で表し、μαθηταί は定着した訳語「弟子たち」とした。
theological_decisions:
- issue: 食事姿勢と食卓の交わり
  choice: 「食卓に横になって」を本文に残す
  alternative: 「食事をして」「食卓に着いて」
  rationale: 当時の食事姿勢と、イエスが徴税人や罪人たちと食卓を共にした場面を可視化しつつ、そこから先の神学的意味を訳文に付加しないため。
- issue: 「その家」の所有者
  choice: 所有者を特定しない
  alternative: 「イエスの家」「マタイの家」
  rationale: ギリシア語本文は ἐν τῇ οἰκίᾳ とだけ述べ、この節自体では誰の家かを明示していないため。
- issue: 「罪人たち」の性格
  choice: 当時の呼称をそのまま「罪人たち」とする
  alternative: 「罪深い人々」「罪人と見なされた人々」
  rationale: 本文の直接的な表現と、その社会的・宗教的分類に伴う緊張を保ち、単なる客観的評価か他者によるレッテルかを訳で決め切らないため。
translation_notes:
  register: 現代の一般読者に分かる標準的で品位ある日本語を用いた。「食卓に横になる」は現代日本語ではやや説明を要するが、原文の食事姿勢と食卓の交わりを保つため本文に残し、脚注で補足した。
