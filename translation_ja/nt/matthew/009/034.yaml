reference: Matthew 9:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: ja
  text: しかし、ファリサイ派の人々は言っていた。「彼は悪霊の支配者[a]によって、悪霊を追い出しているのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「支配者」は「かしら」とも訳せる。
    reason: ἄρχωνは権威をもって治める者を指し、この文脈では悪霊の上に立つ者をいう。「かしら」は可能な日本語訳の一つである。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の群衆の反応とファリサイ派の敵対的な評価との対照を、現代日本語で自然に示す。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 当時のユダヤ教内の一派を指す名称として、一般の読者にも分かりやすい表現を用いた。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的または反復的な側面を保つ。
- source_word: Ἐν τῷ ἄρχοντι
  choice: 支配者の力によって
  rationale: ἐν＋与格を手段・力の源を表す用法と捉え、日本語で誤解なく伝わるようにした。単なる場所的な「中で」とは訳さない。
- source_word: ἄρχοντι
  choice: 支配者
  rationale: 権威を持つ者という語義を、古風にならず明確に表す。「かしら」も可能なので脚注に示した。
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: 悪霊ども
  rationale: 超自然的な悪しき存在を指す語として日本語聖書で広く理解される表現を用い、原文の反復も保持した。
- source_word: ἐκβάλλει
  choice: 追い出している
  rationale: 悪霊追放の文脈における動作を自然な現代日本語で表し、現在形の進行的な響きも伝える。
theological_decisions:
- issue: イエスの力の源に関するファリサイ派の非難
  choice: 「悪霊どもの支配者の力によって」と発言内容をそのまま提示する
  alternative: 「悪霊の力を借りて」など、意味を説明的に言い換える
  rationale: これは語り手の断定ではなくファリサイ派の非難である。原文の発言形式と、彼らがイエスの悪霊追放を悪霊の支配者に帰したという神学的緊張を保つ。
- issue: δαιμόνιαの訳語
  choice: 悪霊ども
  alternative: 悪鬼ども／霊ども
  rationale: 原文が超自然的な悪しき存在を指すことを明確にしつつ、現代の一般読者に最も自然に通じる語を選んだ。「霊ども」では悪性が不明確になり、「悪鬼」は文語的である。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、発言の厳しさと原文の反復を保持した。「悪霊ども」は複数性と敵対的集団の響きを自然に示す。
