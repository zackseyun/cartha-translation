id: MAT.9.22
reference: Matthew 9:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: ja
  text: しかし、イエスは振り向いて彼女を見ると、言われた。「しっかりしなさい、娘よ。あなたの信仰があなたを救った[a]。」すると、その時から彼女は癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたを癒やした」または「あなたを元気にした」とも訳せる。ギリシア語の動詞には、「救う」「癒やす」「健やかにする」という意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: 振り向いて
  rationale: アオリスト受動分詞だが、ここでは自動詞的に方向を変える動作を表す。「振り向いて」は文脈に自然で、方向を必要以上に限定しない。
- source_word: ἰδὼν αὐτήν
  choice: 彼女を見ると
  rationale: 分詞が主動詞に先立つ、または密接に伴う動作を示すため、現代日本語として自然な接続表現にした。
- source_word: Θάρσει
  choice: しっかりしなさい
  rationale: θαρσέωの命令形で、勇気や確信を持つよう促す語。「勇気を出しなさい」も可能だが、この場面での慰めと励ましを自然な日本語で伝える。
- source_word: θύγατερ
  choice: 娘よ
  rationale: 呼格の親愛に満ちた呼びかけを、意味を付加せず直接保った。
- source_word: ἡ πίστις σου
  choice: あなたの信仰
  rationale: πίστιςの基本的かつ文脈に適した訳。「信頼」も可能だが、本文では語の宗教的・関係的な広がりを保つ「信仰」とした。
- source_word: σέσωκέν σε
  choice: あなたを救った
  rationale: σῴζωの完了形で、救済・治癒・回復の意味域を持つ。イエスの言葉では広い含意を保つため「救った」とし、直後の叙述では身体的結果を「癒やされた」と明示した。
- source_word: ἐσώθη
  choice: 癒やされた
  rationale: 同じσῴζωだが、ここでは女性の身体的回復という物語上の結果を指すため、「癒やされた」とした。
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: その時から
  rationale: 直訳的な「その時刻から」より自然でありながら、起点を示すἀπόと時間表現を保持する。
- source_word: ἡ γυνή
  choice: 彼女
  rationale: 直訳は「その女」だが、日本語では既出人物を指す「彼女」が自然で、指示対象も明確である。
theological_decisions:
- issue: πίστιςの訳語
  choice: 信仰
  alternative: 信頼
  rationale: この文脈ではイエスへの信頼が中心だが、「信仰」はπίστιςの宗教的・関係的意味を広く保つ。
- issue: イエスの発言と叙述におけるσῴζωの訳し分け
  choice: 発言では「救った」、叙述では「癒やされた」
  alternative: 両方を「癒やした／癒やされた」または「治した／治った」とする
  rationale: 同一動詞の反復を完全には再現できないものの、発言では救いを含む広い意味を保ち、叙述では文脈上明白な身体的治癒を示すことで、原文の意味上の重なりと緊張を保存する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの呼びかけには簡潔で品位ある語調を保った。「娘よ」は原文の親愛を保持し、「その時から」は現代の読者に自然な時間表現とした。
