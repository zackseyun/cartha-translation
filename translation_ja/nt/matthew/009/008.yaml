id: MAT.9.8
reference: Matthew 9:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: ja
  text: しかし、群衆はこのことを見て恐れ[a]、このような権威を人々に[b]与えた神をあがめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「畏敬の念に打たれ」とも考えられる。ギリシア語は基本的に「恐れる」という意味だが、ここでは畏れを伴う驚きを含む可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「人間に」とも訳せる。ギリシア語は複数形で、「人々」を指す場合にも、人間一般を指す場合にも用いられる。
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ἰδόντες
  choice: このことを見て
  rationale: アオリスト分詞を自然な時の関係として訳した。「このこと」は、直前のいやしと権威の現れを指す原文上の省略された対象を補う。
- source_word: δὲ
  choice: しかし
  rationale: 物語の展開と、律法学者たちの反応から群衆の反応への対照的な移行を示す。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: 原文は複数形だが、日本語の「群衆」は集合的に自然であり、文脈に即している。
- source_word: ἐφοβήθησαν
  choice: 恐れ
  rationale: φοβέομαιの基本的な意味を保ち、単に「感嘆した」と弱めない。文脈上は畏敬を含む可能性を脚注に示す。
- source_word: ἐδόξασαν
  choice: あがめた
  rationale: 神に栄光を帰すことを表すδοξάζωを、現代日本語で自然かつ荘重に表現する。
- source_word: τὸν θεὸν
  choice: 神
  rationale: 動詞ἐδόξασανの直接目的語として標準的に訳す。
- source_word: τὸν δόντα
  choice: 与えた
  rationale: 神を修飾する冠詞付きアオリスト分詞を、日本語の連体修飾として簡潔に表す。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる能力よりも、行使する権限や権利を示す語であり、罪を赦す権威という文脈にも適合する。
- source_word: τοιαύτην
  choice: このような
  rationale: 群衆が目撃した種類の権威を指す指示的なニュアンスを自然に表す。
- source_word: τοῖς ἀνθρώποις
  choice: 人々に
  rationale: ἄνθρωποιはここでは人間一般を指し得る。日本語の「人々」は複数性を保ちつつ、男性だけに限定しない自然な訳語である。
theological_decisions:
- issue: 群衆の反応を「恐れ」とするか「畏敬」とするか
  choice: 恐れ
  alternative: 畏敬の念に打たれ
  rationale: 原語の基本義を本文に保ち、恐怖と畏敬が重なり得る感情の幅を一方に限定しないため、別の可能性を脚注で示す。
- issue: τοῖς ἀνθρώποιςが指す範囲
  choice: 人々に
  alternative: 人間に
  rationale: 原文の複数形を保ちながら、人類一般を指し得る表現として訳す。イエス一人の行為を見た群衆が「人々に」と語る原文の神学的な含みは解消せずに残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「あがめた」によって礼拝的な重みを保った。「恐れ」は強い語感を残し、脚注で畏敬の可能性を補った。
