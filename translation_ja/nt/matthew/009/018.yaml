id: MAT.9.18
reference: Matthew 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: ja
  text: イエスが彼らにこれらのことを話しておられると、そこへ、ある指導者が来て、彼にひれ伏し、こう言った。「私の娘がたった今、死にました。けれども、来て娘の上に手を置いてください。そうすれば、娘は生き返ります。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: そこへ
  rationale: 新しい人物の登場に注意を向ける談話上の働きを、現代日本語の自然な場面転換として表した。
- source_word: ἄρχων
  choice: 会堂の指導者
  rationale: 語自体は一般に「指導者・役人」だが、並行記事の文脈から会堂の指導者であることが明らかであり、日本語読者に役割を簡潔に伝える表現とした。
- source_word: προσεκύνει
  choice: ひれ伏し
  rationale: 敬意を示して身を低くする行為を表す。ここで礼拝という神学的意味に限定しない。
- source_word: ἄρτι ἐτελεύτησεν
  choice: たった今、死にました
  rationale: ἄρτιの直近性と、完了した死を率直に表した。
- source_word: ζήσεται
  choice: 生き返ります
  rationale: すでに死んだ娘についての発言なので、単なる「生きます」より文脈上の意味を自然に示す。
theological_decisions:
- issue: προσκυνέωが礼拝を意味するか
  choice: ひれ伏し
  alternative: 礼拝し
  rationale: この語は崇拝にも敬意を表す平伏にも用いられるため、この節だけで行為者の神学的認識を断定せず、原文の幅を保った。
- issue: 指導者の願いに含まれる確信
  choice: そうすれば、娘は生き返ります
  alternative: 娘を生き返らせてください
  rationale: 命令形の願いに言い換えず、手を置けば生きるという原文の明確な確信を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。会話は切迫感を保ちつつ不自然に古風にならないようにした。
