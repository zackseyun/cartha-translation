  to: イエスが彼らにこれらのことを話しておられると、そこへ、ある指導者が来て、彼にひれ伏し、こう言った。「私の娘がたった今、死にました。けれども、来て娘の上に手を置いてください。そうすれば、娘は生き返ります。」
  rationale: 本節に明示されない「会堂の」を削除し、ἄρχωνの意味を本文の範囲内で保った。それ以外は原文への忠実さと自然な現代日本語を維持している。
