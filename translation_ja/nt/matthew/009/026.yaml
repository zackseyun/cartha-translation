  text: And this report went out into all that region[a].
translation:
  language: ja
  text: そして、この知らせはその地方全体に広まった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その土地全体に」または「その地域一帯に」。ギリシア語の「ゲー」（γῆ）は、土地、領域、地方などを意味する。ここでは全世界ではなく、周辺一帯を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 物語の流れを素直につなぐ接続表現として、καίを自然な現代日本語で訳した。
- source_word: ἐξῆλθεν
  choice: 広まった
  rationale: 直訳は「出て行った」だが、φήμηを主語とする日本語では「知らせが広まった」が自然であり、情報が発信地から周囲へ伝わったという比喩を保つ。
- source_word: ἡ φήμη αὕτη
  choice: この知らせ
  rationale: φήμηは流布する報告や知らせを指す。現代日本語の「うわさ」は不確かさを連想させやすいため避け、αὕτηの指示性を「この」で明示した。
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: その地方全体に
  rationale: γῆには「地」「土地」「地方」などの意味があるが、ここでは物語上の周辺地域を指すと考えられる。「その地方全体に」はὅληνの範囲とἐκείνηνの指示を自然に表す。
