  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: ja
  text: 群衆をご覧になると、イエスは彼らを深くあわれまれた。彼らが、羊飼いのいない羊のように、苦しめられ、打ち倒されていた[a]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「疲れ果て、途方に暮れていた」とも訳せる。ギリシア語の二つの語は、虐げられて消耗し、自分ではどうすることもできない群衆の姿を表すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: 群衆をご覧になると
  rationale: アオリスト分詞を自然な時の表現「～すると」で訳した。δὲは弱い接続辞であり、日本語では明示しなくても物語の進行が自然に伝わる。ὄχλοιは現代語の「群衆」とした。
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: 彼らを深くあわれまれた
  rationale: σπλαγχνίζομαιが表す内奥からの強い同情を「深くあわれむ」で表した。対象を示すπερὶ αὐτῶνは「彼らを」と自然に訳した。
- source_word: ὅτι
  choice: からである
  rationale: イエスがあわれまれた理由を導く接続語であるため、因果関係を明確に示した。
- source_word: ἐσκυλμένοι
  choice: 苦しめられ
  rationale: σκύλλωには悩ませる、虐げる、疲弊させるという幅がある。受動の形を保つ「苦しめられ」により、群衆が外から圧迫され消耗している様子を表した。
- source_word: ἐρριμμένοι
  choice: 打ち倒されていた
  rationale: ῥίπτωの「投げる、倒す」という具体的な像と完了受動分詞の結果状態を保った。「途方に暮れた」「無力な」より解釈を狭めない。
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: 羊飼いのいない羊のように
  rationale: 比較と牧者不在による無防備な状態を、簡潔で自然な日本語として再現した。
theological_decisions:
- issue: イエスのあわれみを表す語
  choice: 深くあわれまれた
  alternative: かわいそうに思われた／あわれみに動かされた
  rationale: 単なる同情より強いσπλαγχνίζομαιの情感を保ちつつ、身体的慣用句を不自然に直訳しなかった。
- issue: 群衆の状態を示す二つの受動分詞
  choice: 苦しめられ、打ち倒されていた
  alternative: 疲れ果て、途方に暮れていた／苦しめられ、無力になっていた
  rationale: 原文の受動性と「倒されている」という像を残し、群衆の状態を心理的・霊的な無力さだけに限定しないようにした。
- issue: 羊飼いのいない羊という比喩
  choice: 羊飼いのいない羊のように
  alternative: 牧者のいない羊のように
  rationale: 旧約聖書に響く指導者不在の比喩を保持した。「羊飼い」は一般読者に明瞭であり、特定の教会職制に限定されにくい。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスへの敬意を示す語法と、原文の牧歌的かつ強い受動的イメージを保った。独立した節として指示対象が明確になるよう、文脈上の主語である「イエス」を補った。
