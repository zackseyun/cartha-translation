id: MAT.9.20
reference: Matthew 9:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: ja
  text: すると、十二年もの間、出血が続いていたある女性が後ろから近づき、イエスの上着の縁[a][b]に触れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「縁」は「房」または「裾」とも訳せる。ギリシア語は衣服の縁や、そこに付けられた房を指し得る。
    reason: lexical_alternative
  - marker: b
    text: イスラエルの律法における衣服の房については、民数記15章38節、申命記22章12節参照。
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίで物語の進行をつなぎ、ἰδούの注意喚起と意外性を保った。「見よ」はやや格調があるが、簡潔で理解可能である。
- source_word: γυνὴ αἱμορροοῦσα
  choice: 出血に苦しんでいた一人の女
  rationale: 現在分詞が示す継続的な出血を、急性の大出血と限定せず、自然な現代日本語で表した。
- source_word: δώδεκα ἔτη
  choice: 十二年もの間
  rationale: 期間を表す対格を自然な日本語にし、「もの」によって長期にわたる状態の重みを伝えた。
- source_word: προσελθοῦσα ὄπισθεν
  choice: イエスの後ろから近づき
  rationale: 接近する動作と後方からであることを明示した。日本語では代名詞だけでは指示対象が曖昧になりやすいため、文脈上の指示対象を「イエス」とした。
- source_word: ἥψατο
  choice: 触れた
  rationale: この文脈でのἅπτω中動態の自然な意味を採り、つかんだという過度に強い接触を含ませなかった。
- source_word: τοῦ κρασπέδου
  choice: 房
  rationale: κράσπεδονは衣の縁、裾、房を指し得る。イスラエルの衣服に付ける房という背景を反映しつつ、語義の幅は脚注に残した。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: その上着の
  rationale: ἱμάτιονを特定の形状の衣に狭めず、外側に着る衣として分かりやすく表現した。αὐτοῦは直前に明示したイエスを受ける「その」で示した。
theological_decisions:
- issue: κράσπεδονがイスラエルの律法に基づく衣服の房を指す可能性
  choice: 本文では「房」と訳し、律法的背景を脚注で示す
  alternative: 「裾」または「衣の縁」と訳し、文化的背景を前面に出さない
  rationale: 語が衣の縁一般を指す可能性を認めながら、ユダヤ人の衣服に付けられた房を指す蓋然性を保った。ただし、この節自体がその象徴的・神学的意味を明示しているとは断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ἰδούの語りの勢いを保つため「見よ」を用いた。「出血に苦しんでいた」は慢性的な症状を自然に表し、「房」については本文で断定しすぎないよう語義と文化的背景を脚注で補った。
