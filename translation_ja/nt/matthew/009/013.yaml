id: MAT.9.13
reference: Matthew 9:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: ja
  text: だが、行って、『わたしが望むのはあわれみであって、いけにえではない』とはどういう意味か、学びなさい。[a][b] わたしが来たのは、正しい人たちではなく罪人たちを招くためだからである。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「これが何であるか」。
    reason: lexical_alternative
  - marker: b
    text: ホセア6章6節からの引用。
    reason: cross_reference
  - marker: c
    text: 「自分を正しいと思っている人たち」という意味の可能性もある。ギリシア語は単に「正しい人たち」とある。
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: だが、行って……学びなさい
  rationale: アオリスト分詞πορευθέντεςは後続の命令形μάθετεと結びついた慣用的表現であり、字義性と叱責の調子を保ちつつ、自然な日本語の「行って……学びなさい」とした。δέは文脈上の対照を示す「だが」とした。
- source_word: τί ἐστιν
  choice: とはどういう意味か
  rationale: 引用句の意義を理解するよう求める表現なので、直訳的な「これは何か」より自然で明確な日本語とした。字義的な形は脚注に示す。
- source_word: Ἔλεος
  choice: あわれみ
  rationale: 人への慈悲・思いやりと、ホセア書の契約的な響きの双方を過度に限定せず伝える語として「あわれみ」を選んだ。
- source_word: θέλω
  choice: わたしが望むのは
  rationale: 神の意志と願いを、聖書引用にふさわしい現代的で品位ある表現にした。
- source_word: καὶ οὐ θυσίαν
  choice: であって、いけにえではない
  rationale: καὶ οὐによる鋭い対照を保ち、θυσίανは宗教的な供犠を明確に表す「いけにえ」とした。
- source_word: οὐ γὰρ ἦλθον καλέσαι
  choice: わたしが来たのは……招くためではなく……だからである
  rationale: γάρの理由提示を日本語で自然になるよう文末の「からである」で表し、καλέσαιは文脈に即して「招く」とした。
- source_word: δικαίους
  choice: 正しい人たち
  rationale: 実際に正しい者か、自分を正しいと思う者かを本文で決めず、ギリシア語のカテゴリー表現を現代日本語で自然に保った。
- source_word: ἁμαρτωλούς
  choice: 罪人たち
  rationale: δικαίουςとの明確な対比を保つ標準的な訳語を用いた。
theological_decisions:
- issue: ホセア6章6節の引用が示す、あわれみといけにえの対照
  choice: 「わたしが望むのはあわれみであって、いけにえではない」と対照をそのまま保つ
  alternative: 神があらゆるいけにえを全面的に否定している、と説明的に訳す
  rationale: 預言者的な優先順位の鋭さを保ちながら、本文を超えて祭儀全般の廃止まで意味すると断定しないため。
- issue: 「正しい人たち」の指示対象
  choice: 本文では「正しい人たち」とし、皮肉かどうかを確定しない
  alternative: 「自分を正しいと思っている人たち」または「独善的な人たち」
  rationale: 文脈から皮肉に読む可能性はあるが、δικαίους自体はその解釈を明示していないため、曖昧さを保持する。
translation_notes:
  register: 明快な現代標準語を用い、イエスの叱責の鋭さと聖書引用の品位を両立させた。「あわれみ」「いけにえ」「罪人」は一般読者にも理解できる伝統的語彙として保持し、「正しい人たち」の解釈上の曖昧さは本文で解消せず脚注で示した。
