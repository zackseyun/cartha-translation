id: MAT.9.11
reference: Matthew 9:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: ja
  text: これ[a]を見たファリサイ派の人々は、イエスの弟子たちに言った。「なぜ、あなたがたの先生は徴税人や罪人たちと一緒に食事をするのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「見て」。ギリシャ語では「見た」ものが明示されておらず、文脈上、食事の光景を指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: これを見た
  rationale: アオリスト分詞を、物語の流れに合う時間的な表現にした。「これ」は文脈上の食事の光景を指す補足であり、ギリシャ語では目的語が明示されていないため、その点を脚注で示した。
- source_word: ἔλεγον
  choice: 言った
  rationale: 未完了過去形だが、物語中の発言導入として自然な現代日本語を優先した。「言っていた」とすると継続や反復が必要以上に強調される可能性がある。
- source_word: μαθηταῖς
  choice: 弟子たち
  rationale: 福音書における教師と弟子の関係を明確に保つ、標準的で自然な訳語。
- source_word: τελωνῶν
  choice: 徴税人
  rationale: 当時の税収請負制度の細部を過度に説明せず、社会的に忌避された職業集団を現代の読者に明瞭に伝える。
- source_word: ἁμαρτωλῶν
  choice: 罪人たち
  rationale: 社会的・道徳的に区別された人々を指す語を、解釈を加えず直接的に訳した。
- source_word: ἐσθίει
  choice: 食事をする
  rationale: 単なる摂食だけでなく、共に食卓を囲む場面であることが自然に伝わる表現。現在形の問いとして訳した。
- source_word: διδάσκαλος
  choice: 先生
  rationale: 弟子たちへの直接の問いにふさわしい自然な呼称であり、「教師」という役割を明確に表す。
theological_decisions:
- issue: 「見た」の目的語を明示するか
  choice: 本文では「これ」を補い、脚注で原文の含意を示す
  alternative: 目的語を補わず「見て」と訳す
  rationale: ギリシャ語は目的語を明示しないが、日本語で「これを見た」とすれば直前の食事の光景を自然に受けられる。何を見たかを神学的に限定しすぎないよう脚注を付した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、直接話法は丁寧だが過度に改まらない調子とした。「ファリサイ派の人々」「徴税人」は一般読者に分かりやすい現代的な語を選んだ。
