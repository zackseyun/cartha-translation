id: MAT.9.12
reference: Matthew 9:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: ja
  text: しかし、イエスはこれを聞いて言った。「健康な人には医者は必要ない。だが、病気の人には必要である。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「丈夫な人には医者は必要ない。だが、具合の悪い人には必要である。」
    reason: οἱ ἰσχύοντες は文脈上「健康な人」と自然に訳せる一方、「丈夫な人」とすることもできる。οἱ κακῶς ἔχοντες は「病気の人」のほか「具合の悪い人」とも訳せる。
lexical_decisions:
- source_word: ἀκούσας
  choice: これを聞いて
  rationale: アオリスト分詞の時間的な関係を自然な日本語で表し、目的語は直前の文脈から「これ」と補った。
- source_word: δὲ
  choice: しかし
  rationale: 直前の問いかけに対する応答への緩やかな対比・転換を示す。
- source_word: εἶπεν
  choice: 言った
  rationale: 原文の標準的な発話動詞をそのまま訳し、「答えた」と解釈的に強めることを避けた。
- source_word: οἱ ἰσχύοντες
  choice: 丈夫な人
  rationale: ἰσχύωの「力がある」という基本的意味と、病人との医療的な対比の双方を日本語で自然に表す。「健康な人」も可能。
- source_word: χρείαν ἔχουσιν ἰατροῦ
  choice: 医者はいらない
  rationale: 「医者を必要としない」より簡潔で、格言的な響きを保つ自然な現代日本語とした。
- source_word: οἱ κακῶς ἔχοντες
  choice: 病人
  rationale: 「具合が悪い者」を意味する慣用句を、医療的対比が明瞭な簡潔な名詞で表した。
theological_decisions:
- issue: 格言の医学的意味と比喩的・霊的適用
  choice: 本文では医者と病人という医学的比喩をそのまま述べ、罪人への霊的適用を明示しない。
  alternative: 「罪人には救い主が必要だ」など、文脈上の適用を訳文に織り込む。
  rationale: この節のギリシア語自体は医学的な格言として語られており、その適用は前後の文脈に委ねられているため。
translation_notes:
  register: 明瞭で格言的な現代標準日本語。「医師」より日常的で理解しやすい「医者」を用い、品位を損なわない簡潔な対句とした。
