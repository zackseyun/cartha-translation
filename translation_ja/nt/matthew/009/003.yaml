  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: ja
  text: すると、なんと、律法学者たちのうちの何人かが心の中で[a]言った。「この男は冒瀆している。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「内々に言った」とも訳せる。ギリシャ語の表現は、心の中での思いを表す場合も、仲間内で交わした言葉を表す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδού
  choice: すると、見よ
  rationale: καὶの物語上のつながりを「すると」で示し、ἰδούの注意を引く力と場面の鮮明さを「見よ」で保った。
- source_word: τινες τῶν γραμματέων
  choice: 律法学者たちのうちの何人か
  rationale: τινεςの不特定の一部という意味と、属格句が示す集団内の部分を明示した。γραμματεῖςは福音書の文脈に即して「律法学者」とした。
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: 心の中で言った
  rationale: 直訳的な「自分たちの内で言った」という表現が、この文脈では内心の発言を指す可能性を自然な日本語で示した。ただし、内輪の発言を指す余地は脚注に残した。
- source_word: Οὗτος
  choice: この男
  rationale: 指示代名詞の直接的な指し方と、文脈にある非好意的な調子を、過度に侮蔑的にならない形で表した。
- source_word: βλασφημεῖ
  choice: 神を冒瀆している
  rationale: 現在形の進行的な力を示しつつ、ここでのβλασφημέωが表す神への冒瀆という告発を明確な日本語にした。
theological_decisions:
- issue: イエスに対する律法学者たちの告発の訳し方
  choice: この男は神を冒瀆している
  alternative: この者は冒瀆の言葉を語っている
  rationale: 告発の強さを弱めず、同時にその正否について訳文の段階で説明を加えないことで、物語にある神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、ἰδούの注意喚起を保つため「見よ」を用いた。「冒瀆」は告発の宗教的・法的な重みを保持する語として採用した。
