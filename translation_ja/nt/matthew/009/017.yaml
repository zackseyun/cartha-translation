id: MAT.9.17
reference: Matthew 9:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: ja
  text: また、新しいぶどう酒を古い革袋に入れる人はいない。そうしないと、革袋は裂け、ぶどう酒は流れ出て、革袋は使えなくなる。そうではなく、新しいぶどう酒を新しい革袋[a]に入れる。そうすれば、両方とも保たれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、「新しいぶどう酒」の「新しい」（νέος）と、「新しい革袋」の「新しい」（καινός）には異なる語が使われている。後者は、新たな状態で使用に適したことを含みうる。
    reason: 同じ節で用いられるνέοςとκαινόςの語彙上の使い分けを示すため。
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: また、……入れる人はいない
  rationale: 直前のたとえにもう一つの否定的な例を加える接続関係を「また」で示し、一般的な慣行を自然な日本語で表した。βάλλουσιν はこの文脈では「投げる」でなく「入れる」が適切。
- source_word: οἶνον νέον
  choice: 新しいぶどう酒
  rationale: できたばかりで発酵中のぶどう酒を指す、明確で定着した訳語。
- source_word: ἀσκοὺς παλαιούς
  choice: 古い革袋
  rationale: ぶどう酒を入れる動物の皮製の袋を「革袋」とし、παλαιός の古さと劣化を簡潔に示した。
- source_word: εἰ δὲ μή γε
  choice: そんなことをすれば
  rationale: 直訳的な「もしそうでなければ」よりも、誤った行為の結果を導く条件関係を現代日本語で明瞭にした。
- source_word: ῥήγνυνται
  choice: 裂け
  rationale: 発酵の圧力で革袋が破れる様子を自然かつ具体的に表す。
- source_word: ἐκχεῖται
  choice: 流れ出て
  rationale: 革袋が裂けた結果、ぶどう酒が失われる状況を自然に示す。受動形を機械的に再現せず、出来事の連鎖を保った。
- source_word: ἀπόλλυνται
  choice: だめになる
  rationale: 革袋が使用不能になる実際的な意味を、過度に強い「滅びる」を避けて分かりやすく表した。
- source_word: ἀλλὰ
  choice: そうではなく
  rationale: 誤った扱いから正しい扱いへ転じる強い対比を明示した。
- source_word: ἀσκοὺς καινούς
  choice: 真新しい革袋
  rationale: καινός が示す新しさ、特に使用に適した新しい状態を表し、νέος を訳した「新しいぶどう酒」と日本語でも可能な範囲で区別した。
- source_word: ἀμφότεροι συντηροῦνται
  choice: どちらも保たれる
  rationale: ぶどう酒と革袋の双方が失われずに済むことを簡潔に表した。
theological_decisions:
- issue: νέος と καινός の区別
  choice: νέος を「新しい」、καινός を「真新しい」と訳す
  alternative: 両方を「新しい」と訳す
  rationale: 本文は二つの異なる形容詞を用いている。両者を過度に対立させることは避けつつ、ぶどう酒の時間的な新しさと、革袋の新しい状態というニュアンスを日本語でも見えるようにした。たとえの神学的意味は本文で特定せず、その緊張と開かれた適用を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、たとえとしての簡潔さと品位を保った。「革袋」は聖書文化に固有だが理解可能な語として維持し、説明を本文に過剰に加えなかった。
