source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: ja
  text: イエスが家に入ると、目の見えない二人が近寄って来た。イエスは彼らに言われた。「わたしにそれができると信じるか。」彼らは答えた。「はい、主よ。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主よ」は、原語では「先生」などの敬意を表す呼びかけとしても用いられる。ここでは、単なる敬称にも、イエスの権威を認める呼称にもなり得る曖昧さを保つため、「主よ」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: イエスが家に入ると
  rationale: 与格のアオリスト分詞を、後続する出来事の時を示す自然な日本語で表した。主語は文脈上イエスなので明示した。
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: 目の見えない二人が近寄って来た
  rationale: προσέρχομαι の「近づく」を自然に表した。οἱ τυφλοί は直前の文脈にある二人の男性を指すため「二人」を補った。「盲人」よりも現代の一般読者に明瞭で配慮ある表現を採った。
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは彼らに言われた
  rationale: ギリシア語の歴史的現在は、日本語物語文として自然で品位のある過去形で表し、イエスへの敬意を示す敬語を用いた。
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: わたしにそれができると信じるか
  rationale: δύναμαι の能力を自然な「できる」で表し、τοῦτο は求められている癒やしを指す「それ」とした。問いの直接性を保持した。
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: 彼らは答えた。「はい」
  rationale: 直訳の「彼に言った」より、問いへの応答であることが自然に伝わる「答えた」とした。Ναί は簡潔な肯定「はい」とした。
- source_word: κύριε
  choice: 主よ
  rationale: κύριε が敬称にも権威の承認にもなり得る曖昧さを保ちつつ、κύριος の基本訳として「主」を採用した。呼格は「よ」で表した。
theological_decisions:
- issue: イエスへの呼びかけ κύριε の訳
  choice: 主よ
  alternative: 先生／だんな様
  rationale: 単なる丁寧な呼称である可能性を否定しないが、イエスの権威への認識を含み得る語の重みを保持するため「主よ」とした。脚注で敬称としての可能性を示した。
- issue: 「信じる」の内容
  choice: わたしにそれができると信じるか
  alternative: わたしを信頼しているか
  rationale: ὅτι 以下が信じる内容を明示しているため、一般的・救済論的な「信仰」へ広げず、イエスの能力についての問いとして訳した。
- issue: 歴史的現在 λέγει／λέγουσιν
  choice: 過去形で表現
  alternative: 現在形で表現
  rationale: 時制上の出来事の順序を変えず、日本語の物語として自然に読める過去形を用いた。ギリシア語の歴史的現在による生動感を機械的に現在形へ移さなかった。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で品位ある物語調。「目の見えない二人」として現代の自然な表現を用い、直前の文脈に基づく人数を明示した。引用内は過度に古風にせず、「わたし」「信じるか」「主よ」で荘重さを保った。
