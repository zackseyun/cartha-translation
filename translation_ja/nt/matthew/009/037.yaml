id: MAT.9.37
reference: Matthew 9:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: ja
  text: その時、イエスは弟子たちに言う。[a]「収穫は多いが、働き手は少ない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は物語を生き生きと語る歴史的現在で「言う」としています。「言った」と訳すこともできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の展開における時点と順序を簡潔に示す自然な日本語。
- source_word: λέγει
  choice: 言う
  rationale: ギリシア語の歴史的現在を保ち、物語の生き生きとした語り口を伝える。日本語でも文脈上自然である。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: μαθηταίを標準的に「弟子たち」と訳す。日本語では「イエスは」を主語として明示することで、αὐτοῦの関係も自然かつ明確になる。
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: …は…が、…は…
  rationale: μέν…δέの対照を、硬い逐語表現を避けつつ自然な日本語の「が」で明確に示す。
- source_word: θερισμός
  choice: 収穫
  rationale: 農耕の比喩をそのまま保つ、定着した簡潔な訳語。
- source_word: πολύς
  choice: 多い
  rationale: 収穫の量の大きさを直接表し、「少ない」との対照も明瞭になる。
- source_word: ἐργάται
  choice: 働き手
  rationale: 収穫に携わる者を指す、現代日本語として自然で広く理解できる表現。
- source_word: ὀλίγοι
  choice: 少ない
  rationale: πολύςとの対照を簡潔かつ忠実に表す。原文にない「少なすぎる」という強意は加えない。
theological_decisions:
- issue: 収穫の比喩が指すもの
  choice: 農耕の比喩を説明せず、そのまま保持する。
  alternative: 収穫を、イエスの働きを受け入れる用意のできた人々などと明示して言い換える。
  rationale: この節自体は比喩の対象を明示していないため、本文に解釈を付加せず、文脈が生む含みと緊張を保つ。
- issue: 主語「イエス」の明示
  choice: 日本語本文では「イエスは」と明示する。
  alternative: 直前の文脈に依存して「彼は」または主語省略とする。
  rationale: ギリシア語では動詞に含まれる三人称単数の主語が文脈上イエスを指す。独立した節としても明瞭で自然な日本語にするため固有名を補うが、解釈上新たな内容は加えない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「収穫」「働き手」という平易な語で原文の農耕比喩と対照を保持した。歴史的現在は本文で再現し、異訳を脚注に示した。
