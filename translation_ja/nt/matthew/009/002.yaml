id: MAT.9.2
reference: Matthew 9:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: ja
  text: すると見よ、人々が寝床に横たわっている、体が麻痺した人をイエスのもとに連れて来た。イエスは彼らの信仰を見て、その人に言われた。「勇気を出しなさい、子よ。あなたの罪は赦されている。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの罪は赦された。」
    reason: 現在形受動ἀφίενταιは、現在有効な状態を表す訳と、赦しの成立を強調する訳の双方が可能であるため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面への注意を促す談話標識としての生き生きした力を保つ。現代日本語ではやや格調があるが、聖書本文として明瞭であり、単に省略するよりマタイの語り口を伝える。
- source_word: προσέφερον
  choice: 連れて来た
  rationale: この文脈の προσφέρω は、人をイエスのもとへ運び来ることを表す。日本語では「連れて来た」が自然であり、未完了過去の進行的な側面を不自然に強調せず、物語上の出来事として表現する。
- source_word: παραλυτικὸν
  choice: 体の麻痺した人
  rationale: 形容詞の名詞的用法を、現代日本語で人格を前面に出す明瞭な表現にした。性別はギリシア語のこの語自体から明示されないため「男」とはしない。
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: 床に横たわった
  rationale: κλίνη は寝床や簡素な床を指し得る。「床」は文脈に合い、「横たわった」はその人の姿勢・状態を自然に伝える。
- source_word: πίστιν
  choice: 信仰
  rationale: πίστις の標準的な訳語であり、行動に表れた信頼を含みつつ、本文の神学的含意を狭めない。
- source_word: Θάρσει
  choice: 勇気を出しなさい
  rationale: 励ましと安心を与える命令の力を、自然で直接的な現代日本語で表す。
- source_word: τέκνον
  choice: 子よ
  rationale: 親愛を込めた呼びかけを簡潔に保つ。原語自体が性別を特定しないため「息子よ」とはしない。
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: あなたの罪は赦されている
  rationale: 現在形の受動表現と、行為者を明示しない神的受動の余地を保つ。「赦された」と過去の一点に限定せず、現在有効な赦しの宣言として表現する。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: 日本語では集合的な「罪」が自然で、原語の複数が示す個々の背きも包含できる。
theological_decisions:
- issue: τὴν πίστιν αὐτῶν の指示範囲
  choice: 複数形を保ち、「彼らの信仰」と訳す。
  alternative: 運んで来た人々だけの信仰、または麻痺した人を含む一同の信仰と明示する。
  rationale: αὐτῶν は複数を示すが、麻痺した人を含むかどうかを本文は確定していない。訳文で範囲を限定せず、原文の曖昧さを保つ。
- issue: 罪の赦しの宣言における行為者
  choice: 受動形のまま「赦されている」とする。
  alternative: 「神があなたの罪を赦してくださった」または「わたしがあなたの罪を赦す」と行為者を明示する。
  rationale: ギリシア語は行為者を明示せず、赦しを権威ある仕方で宣言する。受動表現によって、神的受動とイエスの権威をめぐる物語上の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「子よ」によりマタイの叙述とイエスの親愛を込めた呼びかけの格調を保った。「体の麻痺した人」は簡潔さと人を中心に置く自然な表現との均衡を図った。
