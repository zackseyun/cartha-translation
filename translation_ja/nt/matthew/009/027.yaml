id: MAT.9.27
reference: Matthew 9:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: ja
  text: イエスがそこから進んで行かれるとき、二人の目の見えない男性が後を追い、「ダビデの子[a]よ、私たちをあわれんでください」と叫んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ダビデの子」は王としてのメシアを示す称号で、イエスを、約束されたダビデの家系の後継者として指し示している。
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: イエスがそこから進んで行かれると
  rationale: 現在分詞が示す同時的な場面展開を自然な日本語で表した。「進んで行かれる」は、イエスがその場所を離れて移動していることを示し、単にそばを通り過ぎたという限定を避ける。主語への敬意は現代日本語として過度にならない形で示した。
- source_word: ἠκολούθησαν αὐτῷ
  choice: ついて来た
  rationale: ここでは実際に後を追う動作を表す。語り手の視点に自然な「ついて来た」とした。
- source_word: δύο τυφλοὶ
  choice: 二人の目の見えない人
  rationale: 男性複数形によって二人の男性が指されているが、日本語では文脈上不要な性別の補足を避けつつ、人を形容だけで呼ぶ表現より自然で配慮ある言い方とした。
- source_word: κράζοντες καὶ λέγοντες
  choice: 「…」と叫びながら
  rationale: 二つの分詞は、彼らが大声で切実に訴えたことと発言内容の導入を担う。日本語では「叫びながら」に統合することで、意味を保ちつつ不自然な「叫んで言った」を避けた。
- source_word: Ἐλέησον ἡμᾶς
  choice: 私たちをあわれんでください
  rationale: 命令形による直接的で切実な慈悲の願いを、定着した聖書的表現でありながら現代語として理解できる形で表した。
- source_word: υἱὲ Δαυίδ
  choice: ダビデの子よ
  rationale: 単なる系譜説明に言い換えず、マタイにおける王的・メシア的称号をそのまま保った。呼格は「よ」で明示した。
theological_decisions:
- issue: 「ダビデの子」のメシア的意義
  choice: 本文では称号として「ダビデの子よ」と訳し、脚注で王的・メシア的含意を説明する
  alternative: 本文で「約束されたメシアであるダビデの子よ」などと説明的に訳す
  rationale: 原文は伝統的称号だけを用い、その意味を明示的には展開していない。本文では簡潔な称号を保持し、物語が持つ含意を訳文で過剰に確定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。語順は日本語の自然さを優先し、叫びの内容を先に置いた。差別的に響き得る名詞化表現を避け、「目の見えない人」とした。脚注記号は節末に置き、称号全体への注であることを示した。
