id: MAT.9.14
reference: Matthew 9:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: ja
  text: その時、ヨハネの弟子たちがイエスのところに来て、こう言った。「なぜ、私たちとファリサイ派の人々はたびたび断食するのに、あなたの弟子たちは断食しないのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 次の出来事を導く時間的な談話標識として、自然で簡潔な現代日本語にした。
- source_word: προσέρχονται αὐτῷ
  choice: イエスのところに来て
  rationale: προσέρχομαιの「近づく、〜のもとへ来る」という意味を自然に表した。代名詞の指示対象は文脈上イエスであり、日本語で明確にした。
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ヨハネの弟子たち
  rationale: 属格による関係を、日本語で自然な連体修飾として表した。
- source_word: λέγοντες
  choice: こう言った
  rationale: 主動詞と同時的な分詞を、日本語の自然な動作の連続として処理した。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う表現の標準的で明瞭な訳。
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: 私たちとファリサイ派の人々
  rationale: 強調された一人称複数と比較対象を保った。「ファリサイ派の人々」は現代の一般読者にも分かりやすい。
- source_word: νηστεύομεν
  choice: 断食する
  rationale: 宗教的実践として食を断つことを表す定着した日本語を用いた。
- source_word: πολλά
  choice: たびたび
  rationale: νηστεύωを修飾して反復・頻度を表す用法と理解し、「頻繁に」よりも本文の格調になじむ自然な表現とした。
- source_word: οἱ δὲ μαθηταί σου
  choice: あなたの弟子たちは
  rationale: δέの対照は、日本語では「〜のに」という構文全体で自然に示した。
- source_word: οὐ νηστεύουσιν
  choice: 断食しない
  rationale: 現在形を習慣的実践についての否定として訳し、特定の一回だけに限定しなかった。
theological_decisions:
- issue: 断食をめぐる問いの性質
  choice: 習慣的な宗教実践の違いを問う比較として訳す
  alternative: イエスの弟子たちが義務を怠っているという断罪、または特定の日の断食だけを指すものとして訳す
  rationale: 現在形の動詞とπολλάは一般的・反復的な実践を示唆する。本文にない doctrinal な断罪を加えず、問いに含まれる緊張をそのまま保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、会話には丁寧な疑問形を採用した。「ファリサイ派の人々」は専門用語だけを置くより一般読者に通じやすい。πολλάの頻度的意味は「たびたび」で本文中に十分表現できるため、脚注は設けなかった。
