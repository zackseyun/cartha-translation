  text: And he got up and went away to his house[a].
translation:
  language: ja
  text: 彼は起き上がり、自分の家へ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして（日本語本文では読点による連続として表現）
  rationale: 前の出来事に続く単純な物語上の連結を示す。日本語では主語の後に「そして」を置くより、「彼は起き上がり」と動作を連ねるほうが自然であり、余分な時間的含意を加えない。
- source_word: ἐγερθεὶς
  choice: 起き上がり
  rationale: ἐγείρωのアオリスト受動分詞だが、ここでは自動詞的に、横たわっていた人が立ち上がる動作を表す。文脈に即した自然な現代日本語として訳した。
- source_word: ἀπῆλθεν
  choice: 帰って行った
  rationale: ἀπέρχομαιはその場を離れて行くことを表す。目的地が本人の家なので、日本語では「帰って行った」が自然である。ただし「帰る」という意味は目的句との組み合わせから生じるため、単独なら「立ち去った」も可能である。
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: 自分の家に
  rationale: εἰςは家へ向かう移動を、οἶκοςは住居を示す。主語自身の家であることが明確になるよう、αὐτοῦを「自分の」と訳した。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語を用いた。短い物語文のテンポを保ち、原文の二つの連続動作を「起き上がり、…帰って行った」と簡潔に表現した。英語版の脚注にある departed は日本語本文の「帰って行った」に対する有益な異読というより、同じ動作の語法上の別表現にとどまるため、脚注は設けなかった。
