  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: ja
  text: 彼らが出て行く途中で、見よ、人々が悪霊につかれた、口のきけない人をイエスのもとに連れて来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: 彼らが出て行くと
  rationale: 属格独立構文の時間的関係を自然な日本語で表し、δέによる場面の移行は文脈の流れに織り込んだ。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 物語に注意を引きつけるἰδούの働きを省略せず、簡潔で格調ある表現によって保った。
- source_word: προσήνεγκαν αὐτῷ
  choice: 人々が…イエスのもとに連れて来た
  rationale: 主語が明示されていない三人称複数を不特定の「人々」とし、αὐτῷの指示対象を文脈に従って「イエス」と明示した。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ἄνθρωποςの基本的な意味を過度に性別限定せず、現代日本語として自然に表した。
- source_word: κωφὸν
  choice: 口の利けない
  rationale: κωφόςは耳が聞こえないことも話せないことも表し得るが、次節でこの人が話したと記されるため、ここでは発話不能の意味を本文に採った。語の幅は脚注に残した。
- source_word: δαιμονιζόμενον
  choice: 悪霊につかれていて
  rationale: 福音書の悪霊追放の記事における状態を、現代日本語で広く理解できる表現にした。状態の詳しい仕組みは本文に付け加えていない。
theological_decisions:
- issue: 悪霊による苦しみを表す語の訳し方
  choice: 悪霊につかれていて
  alternative: 悪霊の支配下にあって
  rationale: 本文が現実の悪霊的苦しみとして述べていることを保ちつつ、「憑依」と「抑圧」の厳密な区別など、原文が説明していない体系を持ち込まない表現とした。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、ἰδούは物語上の強調を保つため「見よ」と訳した。「口の利けない」は文脈に即した自然な表現であり、原語の語義上の曖昧さは脚注で明示した。
