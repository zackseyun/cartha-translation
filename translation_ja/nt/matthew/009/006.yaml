source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: ja
  text: しかし、人の子が地上で罪を赦す権威を持っていることを、あなたがたが知るために。」そのとき、イエスは麻痺した人[a]に言われた。「起き上がり、自分の寝床[b]を担いで、自分の家へ行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「麻痺した者」。
    reason: lexical_alternative
  - marker: b
    text: 「寝台」または「敷物」とも訳せる。ギリシア語は、ベッド、長椅子、簡易な寝床などを指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: しかし、…ことを、あなたがたに知らせよう
  rationale: δὲの穏やかな対照を「しかし」で示し、ἵνα＋接続法は、後続する命令によって知識を生じさせる意図を自然な日本語で表した。
- source_word: ἐξουσίαν ἔχει
  choice: 権威を持っている
  rationale: 単なる能力ではなく、罪を赦す正当な権能・資格を表すため「権威」とした。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した表現であり、ダニエル書7章との響きと称号としての含意を保つ。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 行為の及ぶ領域を簡潔かつ自然に示す。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 罪を赦す
  rationale: この文脈でἀφίημιは罪の免除を意味し、日本語の標準的な聖書表現にも合う。
- source_word: τότε λέγει
  choice: そう言って、イエスは…言われた
  rationale: 歴史的現在の場面転換と臨場感を、日本語では自然な過去叙述で表した。主語「イエス」は文脈上の指示対象を明確にする補足である。
- source_word: τῷ παραλυτικῷ
  choice: 体の麻痺した人
  rationale: 実体詞化された形容詞を、現代日本語で明確かつ尊重のある人中心の表現にした。
- source_word: Ἐγερθεὶς
  choice: 起き上がり
  rationale: 形式上はアオリスト分詞だが、後続する命令と一続きの命令的用法として訳した。
- source_word: ἆρόν
  choice: 担いで
  rationale: 寝床を持ち上げて運ぶ動作を表し、次の移動命令へ自然につなげる。
- source_word: κλίνην
  choice: 寝床
  rationale: ベッド、簡易寝台、敷物のいずれも含み得る語なので、形状を限定しすぎない「寝床」を選んだ。
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: 自分の家に帰りなさい
  rationale: 直訳は「あなたの家へ行きなさい」だが、本人の家へ戻る文脈を自然な日本語で示した。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουというキリスト論的称号
  choice: 人の子
  alternative: 人間である者
  rationale: 伝統的な称号を保持し、イエスの自己呼称およびダニエル書7章を想起させる可能性を、説明的な言い換えで平板化しない。
- issue: 罪を赦すことに関するἐξουσίαの性質
  choice: 権威
  alternative: 力／権利
  rationale: 奇跡を行う能力だけでなく、罪を赦す正当な権能が焦点であるため。ただし、その権威の由来について本文以上の説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。発話の途中に地の文が挿入される原文の構造を、閉じかぎ括弧と「そう言って」で読みやすく再現した。「あなたがた」は複数形を明示し、「帰りなさい」は命令の強さを保ちつつ不自然に粗暴にならない表現とした。
