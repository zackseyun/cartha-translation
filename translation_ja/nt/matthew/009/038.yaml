base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: ja
  text: ですから、収穫の主に、働き手をその収穫へ送り出して[a]くださるよう、切に祈りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「働き手をその収穫へ駆り出してくださるよう」とも訳せる。原語は単に「送る」より強い表現だが、ここでは働き手を収穫へ派遣することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: 切に祈りなさい
  rationale: δέομαιの懇願・切願のニュアンスと、祈りの文脈を、自然な現代日本語で表す。アオリスト命令形の要請も明確にした。
- source_word: οὖν
  choice: ですから
  rationale: 直前の「収穫は多いが働き手が少ない」という言葉を受けた推論・帰結を、明瞭かつ自然に示す。
- source_word: τοῦ κυρίου τοῦ θερισμοῦ
  choice: 収穫の主
  rationale: κύριοςを「主」、θερισμόςを「収穫」とし、権威と収穫の比喩を保つ。誰を指すかは本文以上に限定しない。
- source_word: ὅπως
  choice: …よう
  rationale: 祈り求める内容ないし目的を、日本語の「…よう祈る」という自然な構文で示す。
- source_word: ἐκβάλῃ
  choice: 送り出してくださる
  rationale: この文脈では働き手を収穫へ派遣する意味なので、本文では自然な「送り出す」とした。原語のより強い語感は脚注に残した。
- source_word: ἐργάτας
  choice: 働き手
  rationale: 収穫に従事する者を指す語として、現代日本語で明快な「働き手」を用いた。
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: 自分の収穫へ
  rationale: εἰςの方向性とαὐτοῦの所有関係を保ち、原文に明示されない「畑」は補わなかった。「自分」は文法上、収穫の主を指す。
theological_decisions:
- issue: 「収穫の主」が誰を指すか
  choice: 「収穫の主」とだけ訳し、指示対象を特定しない
  alternative: 父なる神、イエス、または神一般を明示する
  rationale: この節自体は「収穫の主」とのみ述べており、指示対象をそれ以上限定していないため、神学的な含みを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「収穫の主」「収穫」という聖書的比喩と荘重さを保持した。「切に祈りなさい」により懇願の強さを自然に表した。
