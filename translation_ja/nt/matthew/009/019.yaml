  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: ja
  text: そこでイエスは立ち上がり、その人について行かれた。弟子たちもついて行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: 立ち上がり
  rationale: アオリスト受動分詞だが、ここでは自動詞的に、座っていた状態から立って次の行動に移ることを表す。現代日本語の物語文として自然な「立ち上がり」とした。
- source_word: ἠκολούθει
  choice: ついて行かれた
  rationale: ἀκολουθέωの未完了過去で、後について進む動作を表す。日本語では文脈に即した「ついて行く」が自然であり、主語がイエスなので敬意を示す補助動詞「行かれた」を用いた。未完了相を不自然に強調せず、物語の進行を明瞭にした。
- source_word: αὐτῷ
  choice: その人に
  rationale: 前節の会堂司を指す男性単数与格。日本語本文では、代名詞の指示を明確にするため「その人」とした。
- source_word: μαθηταὶ
  choice: 弟子たち
  rationale: 福音書における師弟関係を表す定着した訳語であり、「学生」や一般的な「従う者たち」より文脈に適する。
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちもついて行った
  rationale: ギリシア語では動詞が省略されているが、日本語では補って反復するほうが自然で明確である。αὐτοῦはイエスを指すため「弟子たち」として十分明瞭である。
