  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: ja
  text: イエスは言っておられた。「出て行きなさい。この少女は死んだのではない、眠っているのだ。」すると人々はイエスをあざ笑っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「人々はイエスを笑いものにしていた」。ギリシア語の動詞は、相手を嘲って笑うことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っておられた
  rationale: 未完了過去の継続・反復的な側面を保ちつつ、イエスへの自然な敬意を表す現代日本語とした。
- source_word: Ἀναχωρεῖτε
  choice: 下がっていなさい
  rationale: 複数の相手にその場を離れるよう求める命令。文脈に自然で、単なる移動より退出の意味が伝わる。
- source_word: οὐ γὰρ ἀπέθανεν
  choice: 死んだのではなく
  rationale: γάρによる理由提示は、日本語では直前の命令に続く文脈で自然に示されるため接続語を明示せず、ἀπέθανενを死の出来事として訳した。
- source_word: τὸ κοράσιον
  choice: この少女
  rationale: κοράσιονは若い女の子を指す。「少女」は簡潔で自然であり、「幼い」という明示されない強調を加えない。定冠詞は場面内で特定されている人物を示すため「この」とした。
- source_word: ἀλλὰ καθεύδει
  choice: 眠っているのです
  rationale: 現在形の状態・動作を自然に表し、死との対比を解釈せずそのまま残した。
- source_word: κατεγέλων αὐτοῦ
  choice: 人々はイエスをあざ笑っていた
  rationale: καταγελάωには嘲りを伴って笑う意味がある。「あざ笑う」は笑いと侮蔑の双方を簡潔に伝え、未完了過去は「ていた」で表した。
theological_decisions:
- issue: 少女は「死んだのではなく、眠っている」というイエスの発言
  choice: 「眠っている」を本文にそのまま残す
  alternative: 「ただ眠っているだけだ」と補う、または死の比喩であると本文中で説明する
  rationale: 原文はこの挑発的な対比を説明していない。比喩、外見上の表現、間もなく生き返ることを見越した発言などの可能性を訳文で一つに決めず、物語上・神学上の緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。発話は丁寧体とし、地の文は簡潔な常体にした。未完了過去の継続性を「言っておられた」「あざ笑っていた」で示した。
