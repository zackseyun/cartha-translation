  naturalness: 「しかし、二人は外へ出ると、その地方一帯にイエスのことを言い広めた。」は明瞭で自然な現代標準日本語であり、物語文としても簡潔で読みやすい。「言い広めた」はこの文脈で十分に慣用的である。
