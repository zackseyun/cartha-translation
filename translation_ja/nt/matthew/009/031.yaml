id: MAT.9.31
reference: Matthew 9:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: ja
  text: しかし、二人は外へ出ると、その地方一帯にイエスのことを言い広めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その土地全体に」とも訳せる。ギリシア語の「ゲー」は、「地」「土地」「地方」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: しかし、二人は
  rationale: δὲは、口外しないよう命じた直前の言葉との穏やかな対比を示すため「しかし」とした。定冠詞を伴う複数形は文脈上、癒やされた二人を指すので、日本語では主語を明確にした。
- source_word: ἐξελθόντες
  choice: 外へ出ると
  rationale: 主動詞に先立つ行為を表すアオリスト分詞。自然な日本語で時間的な順序を示す。
- source_word: διεφήμισαν αὐτόν
  choice: イエスのことを言い広めた
  rationale: διεφήμισανは広く知らせることを表す。代名詞αὐτόνは日本語では指示対象を明確にして「イエスのこと」とし、彼についての知らせや評判を広めた意味を自然に表した。
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: その地方一帯に
  rationale: γῆは「地」「土地」「地方」を意味し得る。この局地的な物語の文脈では「地方」が自然で、ὅλῃの全域性を「一帯に」で表した。
theological_decisions:
- issue: γῆが示す地理的範囲
  choice: 地方
  alternative: 土地／地
  rationale: ここではイエスについての知らせが周辺地域に広まったことを述べており、国家的または普遍的な範囲まで読み込まない。「地方」は局地的意味に適するが、原語には「土地」の意味もあるため脚注に残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、物語文にふさわしい落ち着いた調子を保った。「二人」は直前の文脈を受ける補足であり、「言い広めた」は禁じられたにもかかわらず広く知らせたという展開を端的に示す。
