id: MAT.9.21
reference: Matthew 9:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: ja
  text: というのも、彼女は心の中でこう言っていたからである。「あの方の衣に触れさえすれば、私は救われる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私は癒やされる」または「私はよくなる」とも訳せる。ギリシア語では「私は救われる」とあり、ここでは癒やしをも意味し得る動詞が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っていた
  rationale: 未完了時制が表す継続的または反復的な内語を、自然な現代日本語で示す。
- source_word: γὰρ
  choice: というのも…からである
  rationale: 前後の叙述に対する説明の働きを明示しつつ、日本語として自然な接続にする。
- source_word: ἐν ἑαυτῇ
  choice: 心の中で
  rationale: 自分自身への内的な発言を表す慣用的で分かりやすい表現。
- source_word: Ἐὰν μόνον
  choice: …さえすれば
  rationale: それだけが満たされればよいという最小条件と強調を自然に表す。
- source_word: ἅψωμαι
  choice: 触れ
  rationale: ἐάνを伴うアオリスト接続法の条件を、日本語の条件表現「触れさえすれば」で簡潔に伝える。ここでは「つかむ」まで限定しない。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: あの方の衣
  rationale: ἱμάτιονを過度に特定せず衣服として表し、内語にふさわしい自然な指示表現を用いる。
- source_word: σωθήσομαι
  choice: 私は救われる
  rationale: 文脈上は身体の癒やしを指すが、σῴζωの「救う」という広い語義と含意を本文に残し、文脈的な訳語は脚注に示す。
theological_decisions:
- issue: 癒やしの文脈における σωθήσομαι の訳し方
  choice: 私は救われる
  alternative: 私は癒やされる／私はよくなる
  rationale: 直接の文脈は身体的な癒やしだが、原文はより広く救出・救済・回復を表し得る σῴζω を用いる。その語義の幅と神学的緊張を本文で保ちつつ、この文脈での意味を脚注で明らかにする。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あの方」は女性の内語における αὐτοῦ を自然に表し、「衣」は衣服の種類を不必要に限定しない。
