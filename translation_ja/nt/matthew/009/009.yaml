source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: ja
  text: イエスはそこから進んで行く途中、収税所に座っているマタイという人を見かけた。そして彼に言った。[a]「わたしについて来なさい。」するとマタイは立ち上がり、イエスについて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼に言う」。ギリシア語は、物語を生き生きと描く歴史的現在を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: そこから先へ進んで行く途中
  rationale: 現在分詞が表す進行中の移動と、ἐκεῖθενが示す出発点を自然な現代日本語で表した。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 固有名によって男性であることは明らかであり、日本語では「人」が自然で過不足がない。
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: 収税所に座っている
  rationale: 税や通行税を徴収する場所に着いていた状況を簡潔に表す。「税関」など現代の特定制度を連想させる語は避けた。
- source_word: Μαθθαῖον λεγόμενον
  choice: マタイという
  rationale: その人がマタイという名で呼ばれていたことを、自然かつ簡潔に示す。
- source_word: λέγει αὐτῷ
  choice: 彼に言った
  rationale: ギリシア語の歴史的現在は脚注で示し、本文では日本語の物語として自然な過去形にした。代名詞は直前のマタイを指す。
- source_word: Ἀκολούθει μοι
  choice: わたしについて来なさい
  rationale: 命令の直接性を保ちつつ、単なる後方移動だけでなく人に従う含みも持つ自然な日本語とした。「弟子になりなさい」という説明は加えていない。
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: 主動詞に先立つ即時の動作を、分詞的なつながりを保って表した。
- source_word: ἠκολούθησεν αὐτῷ
  choice: イエスについて行った
  rationale: 具体的に後について行く行為と弟子として従う含みの両方を保つ。日本語で指示対象が曖昧にならないよう「イエス」と明示した。
theological_decisions:
- issue: イエスの召しの性質
  choice: 「わたしについて来なさい」と簡潔に訳す
  alternative: 「わたしの弟子になりなさい」
  rationale: 文脈上は弟子への召しだが、原文はその意味を説明語に置き換えず、従うよう直接命じているため、その簡潔さと含みを保った。
- issue: マタイの応答
  choice: 具体的な動作として「立ち上がり、イエスについて行った」と訳す
  alternative: 「弟子になった」
  rationale: 原文が描く即時の行動を保ち、回心や弟子入りに関する説明を本文へ付加しないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。物語の流れを自然にするため歴史的現在は本文で過去形とし、原文の形は脚注に残した。「収税所」は古代の徴税場所を示しつつ、現代日本の特定機関名を避ける語として採用した。
