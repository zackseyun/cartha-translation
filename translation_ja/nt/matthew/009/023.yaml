  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: ja
  text: イエスはその指導者[a]の家に入り、笛を吹く者たち[b]と、騒いでいる群衆[c]をご覧になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「役人」「支配者」。並行記事では「会堂長」とされているが、ここでマタイが用いる語は単に「指導者」を意味する。
    reason: alternative_reading
  - marker: b
    text: 当時の葬儀では、笛を演奏する人々が伴うことが慣習であった。
    reason: cultural_note
  - marker: c
    text: 別訳「騒然としている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 家に入り
  rationale: アオリスト分詞の時間的・継起的関係を、日本語の自然な連用形で表した。「来て」も可能だが、εἰς と合わせて家の中へ入ったことを明確にした。
- source_word: οἰκίαν
  choice: 家
  rationale: 物語の場面に即した、簡潔で自然な訳語。
- source_word: ἄρχοντος
  choice: 指導者
  rationale: 統治者・役人・有力者などを指し得る広い語であり、並行記事から「会堂長」と特定せず、本文の一般性を保った。
- source_word: ἰδὼν
  choice: ご覧になった
  rationale: 単純な知覚を表す語。イエスを主語とする現代日本語の聖書文体として自然な敬語を用いた。
- source_word: αὐλητὰς
  choice: 笛を吹く者たち
  rationale: 葬送の場で笛を演奏する人々を指す。現代の読者に動作が明瞭に伝わる表現とした。
- source_word: ὄχλον
  choice: 群衆
  rationale: ὄχλος の標準的で自然な物語上の訳語。
- source_word: θορυβούμενον
  choice: 騒いでいる
  rationale: 騒音と混乱のある状態を表す中・受動形の分詞。悲嘆の具体的様式を本文以上に限定しない表現とした。
theological_decisions:
- issue: 家の主人の身分
  choice: 指導者
  alternative: 役人、支配者、会堂長
  rationale: マタイ本文の ἄρχων は身分を広く示すだけで、「会堂長」とは明記しない。並行記事による特定を本文へ持ち込まず、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔で品位ある物語文とした。分詞を日本語として自然な動詞の連続にし、原文にない接続語や並行記事の具体的情報は本文へ加えていない。
