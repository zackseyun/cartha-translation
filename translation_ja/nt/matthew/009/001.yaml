  naturalness: 明瞭で自然な現代標準日本語である。「それから」により物語の連続が滑らかに示され、動作の連なりも読みやすい。イエスに対する「ご自分」「来られた」は、日本語聖書として穏当で過度に重くない敬意表現である。
  terminology: 「舟」はこの文脈のπλοῖονに適切であり、「町」はπόλιςを現代日本語として無理なく表す。「ご自分の町」は神学的・地理的な同定を押しつけない。脚注も本文の曖昧さを維持しつつ、文脈上の可能性を適切に限定している。
