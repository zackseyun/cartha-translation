id: MAT.9.1
reference: Matthew 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: ja
  text: それからイエスは舟に乗り、向こう岸へ渡って、ご自分の町[a]に来られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ご自分の都市」。この段階でイエスの活動の拠点となっていた町を指すと考えられ、おそらくカファルナウム。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: 舟に乗り
  rationale: アオリスト分詞で、後続する主要動詞に先立つ動作を表す。日本語では連用形によって自然に動作の順序を示した。
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖上の一般的な水上交通手段を指すため、現代日本語では「船」より小型の印象を持つ「舟」が文脈に適する。不定性は日本語では明示しない。
- source_word: διεπέρασεν
  choice: 向こう岸へ渡って
  rationale: διαπεράωの、一方の岸から他方へ渡る方向性を自然な日本語で明示した。
- source_word: ἦλθεν
  choice: 来られた
  rationale: ἔρχομαιの基本的な移動を表しつつ、イエスを主語とする日本語の聖書文体として穏当な敬意を示した。
- source_word: τὴν ἰδίαν πόλιν
  choice: ご自分の町
  rationale: ἴδιοςの帰属・結びつきの含意を保ち、「故郷」と限定せず、原文が都市名を明示しない曖昧さを残した。
- source_word: Καὶ ... καὶ
  choice: それから…て
  rationale: 反復するκαίが作る単純な物語の連続を、現代日本語で不自然にならない接続と連用形で表した。
theological_decisions:
- issue: 「ご自分の町」が指す場所
  choice: 本文では都市名を特定せず「ご自分の町」とした。
  alternative: マタイの物語文脈からカファルナウムと明示する、または「故郷」と訳す。
  rationale: ギリシア語本文は都市名を挙げておらず、ἰδίαν πόλινも出生地・故郷に意味を限定しない。文脈上カファルナウムが有力でも、その同定を本文に持ち込まず原文の余地を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての品位を保った。冒頭のκαίは「そして」より自然な「それから」とし、イエスへの敬意は過度な尊敬語を避けて「ご自分」「来られた」で示した。
