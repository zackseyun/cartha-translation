id: MAT.9.5
reference: Matthew 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: ja
  text: というのも、「あなたの罪は赦されている[a]」と言うのと、「起きて歩け」と言うのとでは、どちらが易しいか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの罪は赦された」。ギリシア語の現在受動形は、赦された結果として現在そうなっている状態を表すとも理解できる。
    reason: 時制・相の理解に基づく訳語上の別案を示すため。
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: というのも、……どちらが易しいか
  rationale: τίと比較級は二つの選択肢を比べる問いなので「どちらが易しいか」とした。γάρは前節の発言を説明するつながりを示すため、「というのも」で明示した。
- source_word: εἰπεῖν
  choice: と言う
  rationale: 二つの節で同じ一般的な発話動詞が使われているため、どちらも簡潔に「と言う」とした。
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: あなたの罪は赦されている
  rationale: 現在受動形と、その結果として今も成り立つ状態を自然な日本語で表した。完了の時点を必要以上に確定しない。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: 複数形を日本語で自然な集合概念として「罪」とした。文脈にない比喩的説明は加えていない。
- source_word: Ἔγειρε
  choice: 起きて
  rationale: 癒やしの場面における命令として、現代日本語で自然な「起きて」を選んだ。
- source_word: καὶ περιπάτει
  choice: 歩け
  rationale: 立ち上がった後に実際に歩くよう命じる表現として、簡潔で力のある命令形にした。接続は日本語の連用形「起きて」で表した。
- source_word: σου
  choice: あなたの
  rationale: 二人称単数の所有を明確にし、直接の語りかけを保った。
theological_decisions:
- issue: イエスによる罪の赦しの宣言をどう表すか
  choice: あなたの罪は赦されている
  alternative: あなたの罪は赦された
  rationale: ギリシア語の現在受動形が示し得る現在の状態を本文に保ちつつ、赦しが成立した時点について本文以上の神学的限定を加えないため。別訳は脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用い、問いの修辞的な力と前節への説明的なつながりを保った。「赦す」は聖書文体として定着しつつ現代の読者にも理解できる表記である。
