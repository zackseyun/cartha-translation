base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: ja
  text: そこでイエスは彼らの目に触れ、こう言われた。「あなたがたの信仰[a]に応じて、あなたがたにそのとおりになりますように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼」とも訳せる。ギリシア語のピスティスは、文脈によっては「信頼」や「忠実さ」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の次の出来事を示す時間的な副詞。現代日本語の叙述として自然に流れをつなぐ。
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: 彼らの目に触れ
  rationale: ἅπτομαιと属格の組み合わせが表す身体的な接触を、自然な日本語で表した。
- source_word: λέγων
  choice: こう言われた
  rationale: 主動詞と同時に行われた発話を自然な日本語にし、引用への導入を明確にした。敬語はイエスについての福音書の叙述にふさわしい自然で品位ある文体による。
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: あなたがたの信仰に応じて
  rationale: κατάの対応・尺度の意味を「に応じて」で保ち、因果関係を必要以上に強めない。πίστιςは本文では標準的な「信仰」とし、この文脈で可能な「信頼」は脚注に示した。
- source_word: γενηθήτω ὑμῖν
  choice: あなたがたにそのとおりになるように
  rationale: アオリスト受動命令形の宣言的・遂行的な響きを、日本語の祝願・命令表現で表した。「あなたがたに」により与格も明示した。
theological_decisions:
- issue: 癒やしの宣言におけるπίστιςの訳
  choice: 信仰
  alternative: 信頼
  rationale: この文脈では、彼らがイエスの癒やす力を信頼していることを指す。「信仰」は語の神学的な広がりを保つ標準訳であり、「信頼」も実質的な文脈訳として脚注に残した。
- issue: 信仰と癒やしの関係
  choice: 「に応じて」として対応・尺度を表す
  alternative: 「を根拠として」
  rationale: κατάはここで対応または尺度を表し得るため、信仰を癒やしの功績的原因と断定する強い因果表現は避けた。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。主語の「イエス」は直前の文脈から補い、単独の節としても理解しやすくした。命令形は日本語で過度に荒く響く「そうなれ」を避け、宣言的な「そのとおりになるように」とした。
