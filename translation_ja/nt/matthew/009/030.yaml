  source_fidelity: 「すると」は単純な接続詞 καί に結果・展開の含みを加えうるため、「そして」がより忠実です。また「言い渡された」は日本語では受け身・敬語・公的な通達の響きが重なり、ἐνεβριμήθη の強い警告／命令を明瞭には表しません。「厳しく警告して、こう言われた」は、相手が二人であること、強い警告、そして λέγων による引用への接続を自然に保持します。命令文は、知られる事柄を補わず、原文の曖昧さを保っています。
