  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: ja
  text: そして、二人の目は開かれた。イエスは二人に厳しく警告して、こう言われた[a]。「だれにも知られないようにしなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二人に厳しく命じられた」「二人を厳しく戒められた」とも訳せる。原語には、強い感情を伴う厳しい警告・命令の響きがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「気をつけなさい。だれも知ることのないように」。何を知られてはならないのかは原文では明示されず、癒やしの文脈から理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: 開かれた
  rationale: アオリスト受動態を保ちつつ、視力が回復したことを表す聖書的な慣用表現として、簡潔で自然な日本語にした。行為者は本文同様に明示しない。
- source_word: αὐτῶν οἱ ὀφθαλμοί
  choice: 二人の目
  rationale: 直前の文脈にいる二人の盲人を受ける複数代名詞を、日本語で明瞭に表した。
- source_word: ἐνεβριμήθη
  choice: 厳しく言い渡された
  rationale: 強い感情と命令の力を帯びた動詞であり、ここでは後続する禁止命令に即して、単なる「注意した」より強い表現を選んだ。
- source_word: λέγων
  choice: （直接話法へ統合）
  rationale: 主動詞と同時の分詞で、ギリシア語では「言って」に相当するが、日本語では引用を直接続ける方が自然で、意味も失われない。
- source_word: Ὁρᾶτε μηδεὶς γινωσκέτω
  choice: だれにも知られないようにしなさい
  rationale: Ὁρᾶτε の警戒・配慮を求める命令と、μηδεὶς γινωσκέτω の禁止を、明瞭な現代日本語の命令として一体的に表した。知られる内容は原文と同じく明示しない。
theological_decisions:
- issue: 癒やしの後にイエスが命じた沈黙の強さと理由
  choice: 強い禁止命令として訳し、その理由は補わない。
  alternative: 「叱った」「固く命じた」などと訳し、また沈黙を命じた動機を説明的に補う。
  rationale: 本文は命令の強さを示す一方、その動機を説明していないため、強さは伝えつつ神学的理由を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「目は開かれた」という原文の受動表現を保持し、命令部分は逐語的な不自然さを避けて自然な日本語にした。
