  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: ja
  text: しかし、縮んでいない布[a]の継ぎ当てを古い衣に当てる人はいない。そうすれば、その継ぎ当てが衣からはがれ、裂け目がもっとひどくなるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「縮絨していない布」とも訳せる。ギリシア語は、まだ縮絨などの加工を施していない布を指し、縮んで古い衣に負担をかけることが、このたとえの背景にある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: しかし、…人はいない
  rationale: δὲの穏やかな対照を「しかし」で示し、οὐδεὶςの例外のない否定を自然な現代日本語で表した。
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: 継ぎ当てを…当てる
  rationale: ἐπιβάλλειは字義的には「上に置く／当てる」であり、「縫い付ける」とまでは明記されていないため、衣服の文脈にも合う「当てる」とした。ἐπίβλημαは「継ぎ当て」とした。
- source_word: ῥάκους ἀγνάφου
  choice: 縮んでいない布の
  rationale: ἀγνάφουは縮絨などの加工をまだ施していない布を指す。たとえの仕組みが普通の読者に伝わるよう「縮んでいない布」とした。別の厳密な表現は脚注に示した。
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: 古い衣に
  rationale: ἱμάτιονは衣服を広く指し得る。簡潔で品位のある「衣」を採用し、παλαιῷを「古い」とした。
- source_word: αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου
  choice: 継ぎ当てが衣を引っ張って離れ
  rationale: τὸ πλήρωμα αὐτοῦは字義的には「それを満たすもの」だが、ここでは穴をふさぐ継ぎ当てを指す。αἴρει…ἀπόの分離の動きを、縮む布が古い衣を引っ張るという文脈に即して表した。
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: 裂け目がもっとひどくなる
  rationale: 比較級χεῖρονと結果を表すγίνεταιを、自然な日本語で明確に表した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔なたとえの調子と品位を保った。「衣」はやや文語的だが広く理解でき、聖書本文として簡潔である。脚注記号は本文末に置き、節全体に関わる布の語義を補足した。
