  terminology: ἐπίβλημα は「継ぎ当て」、ἱμάτιον は「衣」、σχίσμα は「裂け目」で適切である。ἀγνάφου の「縮んでいない布」は本文の平明な訳として許容できるが、脚注では「縮絨していない」だけでなく、未加工・未収縮の含意を過度に限定せず示す。
