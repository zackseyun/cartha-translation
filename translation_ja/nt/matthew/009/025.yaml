id: MAT.9.25
reference: Matthew 9:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: ja
  text: しかし、群衆が外に出されると、イエスは中に入り、少女の手を取った。すると、少女は起き上がった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「少女は起こされた」。ギリシア語の動詞は、ここではどちらにも訳すことができる。
    reason: ἠγέρθηは形態上受動態だが、自動詞的にも理解できるため、原文の曖昧さを示す。
lexical_decisions:
- source_word: ὅτε δὲ
  choice: しかし、……されると
  rationale: ὅτεの時間関係を「……すると」で示し、δέは直前の展開との対照を表す穏やかな接続として「しかし」とした。
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: 群衆が外に出されると
  rationale: ἐξεβλήθηの受動態を保ちつつ、悪霊追放を連想させかねない強すぎる表現を避け、場から退かされたことを自然な現代日本語で示した。
- source_word: εἰσελθὼν
  choice: イエスは中に入り
  rationale: アオリスト分詞の先行・連続動作を自然な叙述にした。日本語で主語が不明瞭になるのを避けるため、文脈上明白な「イエス」を補った。
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: 少女の手を取った
  rationale: κρατέωと属格の組み合わせが表す「手をつかむ／取る」を、過度に力強くせず自然に訳した。
- source_word: ἠγέρθη
  choice: 起き上がった
  rationale: 形態上は受動態だが、自動詞的に結果を表し得る。日本語では「起き上がった」が場面に自然で、行為者を過度に明示しない。受動的な理解は脚注に残した。
- source_word: τὸ κοράσιον
  choice: 少女
  rationale: 若い女の子を指す語として、簡潔で現代的かつ文脈に適した表現を選んだ。
theological_decisions:
- issue: 死からの回復を語るἠγέρθηの態の表現
  choice: 少女は起き上がった
  alternative: 少女は起こされた
  rationale: 文脈はイエスによる生命の回復を語るが、本文では結果を自然に表し、神学的な行為者を文法以上に明示しない。ギリシア語の受動的な読みも脚注で保持した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。物語の流れを滑らかにするため二文に分け、「すると」で最後の出来事を導いた。脚注記号は該当語句「起き上がった」の直後に置いた。
source_grounding:
  english_pob_role: consult_only
