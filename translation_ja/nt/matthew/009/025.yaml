  source_fidelity: 原文の時系列と受動表現を適切に反映している。「群衆が外に出されると」はἐξεβλήθηの受動態と場から除かれた状況を自然に伝え、「中に入り、少女の手を取った」もεἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆςに忠実である。「少女は起き上がった」はἠγέρθηの出来事の結果を自然な日本語で表し、受動的理解は脚注で保持されている。
  naturalness: 明瞭で現代標準日本語として自然である。二文に分けた構成と「すると」は物語の連続を読みやすく示す。「しかし」はδέの穏やかな接続を訳出したものとして許容範囲であり、不自然な強い対立にはなっていない。
  terminology: 「群衆」「少女」「手を取った」はいずれも文脈と語義に適切である。「起き上がった」は、復活・蘇生の場面で不必要に教義的な言い回しを加えず、本文の表現として妥当である。脚注の「起こされた」は形態上の受動態を示す代案として適切で、アンカー位置も正しい。
