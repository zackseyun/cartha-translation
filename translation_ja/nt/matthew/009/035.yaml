id: MAT.9.35
reference: Matthew 9:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: ja
  text: イエスは、すべての町と村を巡り、各地の会堂で教え、王国の良い知らせ[a]を告げ知らせ、あらゆる病気とあらゆる不調[b]を癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「王国の福音」。
    reason: lexical_alternative
  - marker: b
    text: 「不調」は「弱さ」または「患い」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: 巡り歩き
  rationale: 未完了過去が表す継続的・反復的な巡回活動を、自然な現代日本語で表す。
- source_word: τὰς πόλεις πάσας καὶ τὰς κώμας
  choice: すべての町や村
  rationale: πόλιςとκώμηの規模の違いを「町」と「村」で保ちつつ、両者を包括するπάσαςを「すべての」で示す。
- source_word: διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: そこの会堂で教え
  rationale: αὐτῶνは各地の共同体に属する会堂を指すと理解し、不自然な「彼らの会堂」を避けて「そこの会堂」とした。
- source_word: κηρύσσων
  choice: 宣べ伝え
  rationale: 公に告げ知らせるκηρύσσωの布告的な力を保ちながら、聖書本文として明瞭で dignified な表現とした。
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: 御国の良い知らせ
  rationale: εὐαγγέλιονの意味を透明に伝える「良い知らせ」を採用し、βασιλείαは神の支配・王国を文脈上簡潔に示す慣用的な「御国」とした。属格の関係は解釈的に限定しない。
- source_word: θεραπεύων
  choice: 癒やされた
  rationale: 福音書の文脈に適した自然な訳語であり、主動詞に従って日本語では敬意を含む過去形にまとめた。
- source_word: πᾶσαν νόσον
  choice: あらゆる病気
  rationale: νόσοςを一般的な疾病を表す「病気」とし、πᾶσανの包括性を「あらゆる」で保持した。
- source_word: πᾶσαν μαλακίαν
  choice: あらゆる患い
  rationale: μαλακίαが表し得る身体的な弱さ・不調・疾病を「患い」で表し、νόσοςとの語の違いも可能な範囲で保った。
theological_decisions:
- issue: εὐαγγέλιονの訳語
  choice: 良い知らせ
  alternative: 福音
  rationale: 伝統的な教会用語に限定せず、語の基本的意味を現代の読者に直接伝える。一方、「福音」も正当な訳語なので脚注に残す。
- issue: βασιλείαの訳語
  choice: 御国
  alternative: 王国／支配
  rationale: 文脈上は神の王的支配とその国の双方に開かれた表現であるため、どちらか一方に限定せず、日本語聖書で理解されやすい「御国」を用いる。
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίανの範囲
  choice: あらゆる病気、あらゆる患い
  alternative: すべての病気とすべての弱さ
  rationale: 反復されたπᾶσανをそれぞれ「あらゆる」と訳して包括性を保ち、二つの名詞を同一化しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい品位を保った。三つの分詞は「教え、宣べ伝え、癒やされた」と並列し、巡回活動の内容として読みやすく構成した。すべての脚注記号を本文中に配置した。
