id: MAT.17.23
reference: Matthew 17:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: ja
  text: そして人々は彼を殺し、彼は三日目によみがえらされる[a]。」弟子たちは深く悲しんだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「よみがえる」。ギリシア語の動詞は受動態で、直訳すると「よみがえらされる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: 人々は彼を殺し
  rationale: 未来能動態複数の動作を保ち、「彼は殺される」と受動態に変えずに訳した。日本語では主語を明示しないと分かりにくいため、不特定複数を「人々」とした。「殺す」は「処刑する」や「殺害する」ほど意味を限定しない。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 三日目に
  rationale: 時を示す与格を、簡潔で定着した日本語表現にした。原文にない「その後」は補わない。
- source_word: ἐγερθήσεται
  choice: よみがえらされる
  rationale: 未来受動態を反映し、よみがえりが彼に対して行われるという原文の形を保った。「復活させられる」より自然で聖書本文として理解しやすい。
- source_word: ἐλυπήθησαν σφόδρα
  choice: 弟子たちは深く悲しんだ
  rationale: λυπέωの悲嘆とσφόδραの強意を自然な現代日本語で表した。主語は直前の文脈から弟子たちであるため、日本語で明示した。
- source_word: καὶ … καὶ … καὶ
  choice: そして…し、…。」…
  rationale: 最初のκαίを「そして」、節間のκαίを連用形「殺し」で表し、最後のκαίは日本語で新しい文を自然につなぐ形にした。単調な逐語反復は避けつつ、出来事の連続を保った。
theological_decisions:
- issue: 復活予告の受動態をどう表すか
  choice: よみがえらされる
  alternative: よみがえる
  rationale: ἐγερθήσεταιは未来受動態であり、その形を本文に残すことで、行為者を明示しない原文と、神の働きを暗示し得る神的受動の余地を保った。一方、自動詞的な訳も日本語として自然なので脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら、受難と復活の予告にふさわしい簡潔で dignified な文体とした。直接話法の閉じかぎ括弧は、前節から続くイエスの発言がここで終わることを示す。
source_grounding:
  english_pob_role: consult_only
