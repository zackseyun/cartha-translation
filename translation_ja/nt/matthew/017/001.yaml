id: MAT.17.1
reference: Matthew 17:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: ja
  text: 六日後、イエスはペトロ、ヤコブ、そしてその兄弟ヨハネだけを連れて、高い山に連れて上られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: 六日後
  rationale: 時間的な後続を表す自然な現代日本語であり、「六日が過ぎてから」というギリシア語の意味を簡潔に伝える。
- source_word: παραλαμβάνει
  choice: 連れて
  rationale: παραλαμβάνωの「自分と一緒に連れて行く」という意味を自然に表す。日本語では後続の移動動詞「登られた」と組み合わせることで、二つの歴史的現在を一続きの過去の出来事として読みやすく示せる。
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: ペトロとヤコブと…ヨハネ
  rationale: 日本語聖書で広く通用する人名表記を用いた。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: その兄弟ヨハネ
  rationale: 文脈上、ヨハネをヤコブの兄弟として同定する同格表現である。「その」は直前のヤコブを自然に指すが、兄か弟かを原文が特定していないため「兄弟」とした。
- source_word: ἀναφέρει
  choice: 登られた
  rationale: 山への上向きの移動を自然な日本語で表す。主語イエスへの敬意を保ちつつ、現代の文章として過度に荘重にならない形とした。
- source_word: εἰς ὄρος ὑψηλὸν
  choice: 高い山に
  rationale: 移動の目的地を示すεἰςを、日本語の自然な到達点表現「に」で訳した。
- source_word: κατ’ ἰδίαν
  choice: 彼らだけで
  rationale: イエスと三人の弟子が他の人々から離れていたことを表す。「ひそかに」ではなく、集団の限定に重点を置く原文の意味を明瞭にした。
theological_decisions:
- issue: 福音書物語における歴史的現在
  choice: 日本語では過去形「登られた」で表し、παραλαμβάνειは連用形「連れて」とした
  alternative: 「連れて行き、登る」のように現在形を保持する
  rationale: ギリシア語の現在形は物語を生き生きと語る歴史的現在であり、出来事の時制を現在に定めるものではない。現代日本語ではこの箇所を現在形にすると不自然になりやすいため、談話上等価な過去叙述とした。
- issue: τὸν ἀδελφὸν αὐτοῦにおける兄弟関係
  choice: ヨハネをヤコブの「兄弟」として示す
  alternative: 「彼の兄弟」として代名詞の指示を曖昧に保つ
  rationale: 統語上、この同格句はヨハネを直前のヤコブの兄弟として示すのが最も自然である。ただし年長・年少は特定せず、日本語の「兄」「弟」ではなく「兄弟」を用いた。
translation_notes:
  register: 明瞭で自然な現代標準日本語。原文の簡潔な物語調を保ち、固有名詞とイエスへの敬語は一般的な日本語聖書の格調に合わせた。原文にない兄・弟の区別は加えていない。
