  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: ja
  text: 私は息子をあなたの弟子たちのところへ連れて行きましたが、弟子たちは彼を癒やすことができませんでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: 連れて来ました
  rationale: ここでの προσφέρω は、人をほかの人のもとへ連れて来ることを表す。文脈上の目的語は息子なので、「息子を…連れて来ました」と補って自然な日本語にした。
- source_word: μαθηταῖς σου
  choice: あなたの弟子たち
  rationale: 福音書における μαθητής は、教師に従って学ぶ者を指すため、定着した明瞭な訳語「弟子」を用いた。
- source_word: οὐκ ἠδυνήθησαν
  choice: できませんでした
  rationale: δύναμαι の能力・可能を表す意味を、現代日本語で自然に示す。
- source_word: θεραπεῦσαι
  choice: 癒やすことが
  rationale: この文脈の θεραπεύω は病める者を癒やすことを指す。「治す」も可能だが、福音書の癒やしの記事に適した「癒やす」を選んだ。
- source_word: καὶ ... καὶ
  choice: …が
  rationale: ギリシア語では二つの節を καί で並列するが、日本語で「そして…そして」とすると不自然になるため、後半を「が」で接続し、出来事の流れと実際の対照を明瞭にした。
- source_word: αὐτόν
  choice: 彼を
  rationale: 直前の文脈にいる息子を受ける男性単数代名詞であり、「彼を」と訳した。
theological_decisions:
- issue: 弟子たちの失敗の性質
  choice: この節が述べるとおり、彼を癒やすことができなかったとのみ訳す。
  alternative: 悪霊を追い出せなかった、あるいは不信仰が原因だったと明示する。
  rationale: 原因や方法についての説明は周辺の文脈にあるが、この節自体は癒やす能力がなかったことだけを述べているため、解釈を本文へ付加しない。
translation_notes:
  register: 明瞭で自然な現代標準語としつつ、父親がイエスに訴える場面にふさわしく丁寧体を用いた。「癒やす」は一般読者にも理解できる聖書的で品位ある表現。日本語では主語の混同を避けるため、後半の主語「弟子たち」を明示した。
