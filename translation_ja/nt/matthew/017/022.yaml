id: MAT.17.22
reference: Matthew 17:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: ja
  text: 彼らがガリラヤに集まっていたとき[a]、イエスは彼らに言われた。「人の子は、まもなく人々[c]の手に引き渡される[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一緒に集まっていたとき」。この語は、一団となっていたことを表すとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「引き渡されようとしている」。原文は、間もなく起こることを示す。
    reason: lexical_alternative
  - marker: c
    text: 直訳「人間の手」。ここでは、人の子が人間の手に渡されるという対照がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: 集まっていた
  rationale: 属格独立構文の分詞で、彼らが一緒に集まる、または一団となっている状況を表す。文脈以上に移動や滞在を限定しない自然な表現とした。
- source_word: δὲ
  choice: ～とき
  rationale: 接続詞と属格独立構文を一体として処理し、イエスの発言がなされた背景状況を現代日本語で自然に示した。
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ガリラヤに
  rationale: 場所を示す前置詞句を簡潔に訳した。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: λέγωと間接目的語を素直に反映し、イエスへの敬意を表す一般的な聖書翻訳の文体とした。
- source_word: Μέλλει
  choice: まもなく～される
  rationale: 差し迫った将来を示す μέλλω の意味を、運命づけの含意を加えずに表した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの自称として定着した訳語であり、字義と聖書間の響きを保つ。
- source_word: παραδίδοσθαι
  choice: 引き渡される
  rationale: 受動態を保持し、裏切りだけに意味を限定せず、ある者の支配下へ渡されることを自然な日本語で表した。
- source_word: εἰς χεῖρας
  choice: ～の手に
  rationale: 原文の比喩を保ちながら、日本語でも支配や処置に委ねられる意味が通じる表現とした。
- source_word: ἀνθρώπων
  choice: 人々
  rationale: 複数の人間を指す語として性別を不必要に限定せずに訳した。「人の子」と「人々」の語の反復もある程度保たれる。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου の訳
  choice: 人の子
  alternative: 人間の子／人なる者
  rationale: 伝統的かつ字義的な訳により、イエスの自称と旧約的・終末論的な響きを解釈で狭めずに保った。
- issue: 受難予告における παραδίδοσθαι の含意
  choice: 引き渡される
  alternative: 渡される／裏切られる
  rationale: 行為者が明示されない受動態と、司法的移送・裏切り・より広い引き渡しという重なりを保ち、「裏切られる」と限定しなかった。
- issue: μέλλει の将来性
  choice: まもなく
  alternative: ～しようとしている／～することになっている
  rationale: 差し迫りを表しつつ、主体的意図や予定・宿命を原文以上に強く読み込まないようにした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、受難予告にふさわしい簡潔で重みのある文体とした。「言われた」は過度に古風にならない範囲で敬意を示す。「人の子」「～の手に」「引き渡される」は聖書的な響きと原文の比喩・受動態を保持する。
