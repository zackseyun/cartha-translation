id: MAT.17.20
reference: Matthew 17:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたの信仰が小さいからです。[a] よく言っておきます。もし、からし種ほどの信仰があるなら、[b]あなたがたはこの山に、『ここからあそこへ移れ』と言うでしょう。そうすれば、山は移るでしょう。あなたがたに不可能なことは何一つないでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの信仰が足りないからです」とも訳せる。ギリシア語は、信仰が全くないことよりも、信仰が小さく不十分であることを示す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「からし種一粒のような信仰」。比較は、ごく小さいものを指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: 歴史的現在だが、日本語の物語として自然な過去形にし、敬語でイエスの発言を示した。
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: あなたがたの信仰が小さいからです
  rationale: ὀλιγοπιστίαは完全な不信ではなく、信仰の乏しさ・不足を指すため、その語感を保った。
- source_word: ἀμὴν
  choice: よく言っておきます
  rationale: 発言の確かさと厳粛な強調を示す定型表現として、現代日本語で明瞭にした。
- source_word: πίστιν
  choice: 信仰
  rationale: ここでは神の力に信頼することを指すが、語の神学的幅を狭めない標準的な訳語を選んだ。
- source_word: ὡς κόκκον σινάπεως
  choice: からし種ほどの
  rationale: 比較対象の小ささが自然に伝わる日本語とした。
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: ここからあそこへ移れ
  rationale: 山に対する移動命令を簡潔かつ直接的に表した。
- source_word: μεταβήσεται
  choice: 山は移ります
  rationale: 未来中動態を自動詞的に理解し、主語を補って日本語で明確にした。
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: あなたがたに不可能なことは何一つありません
  rationale: 原文の慣用的な意味を、過度な字義訳を避けて明瞭に表した。
theological_decisions:
- issue: 奇跡の文脈における πίστις の意味
  choice: 信仰
  alternative: 信頼
  rationale: 文脈上は神の力への信頼だが、救済論など特定の教派的意味を持ち込まず、原語の広がりを保つ標準語を用いた。
- issue: ὀλιγοπιστίαが示す信仰の状態
  choice: 信仰が小さい
  alternative: 信仰が足りない／信仰がない
  rationale: 完全な不信と断定せず、弟子たちの信仰が乏しく不十分であるというマタイ特有の表現を保持した。
- issue: 山を移す発言の射程
  choice: 比喩とも文字どおりとも限定せず訳す
  alternative: 困難の克服を意味する比喩と明示する
  rationale: 本文自体が持つ強い表現と神学的緊張を保ち、解釈を訳文に付加しなかった。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。会話は丁寧体を用い、原文の力強い断言と命令形を保った。冒頭のδέは文脈の弱い移行として「すると」とし、過度な逆接を避けた。
