  source_fidelity: 全体として原文の意味をよく伝えているが、「人々」を補うより原文の不定の複数主語に対応する「彼ら」を保つほうがよい。また、πάσχειν は能動形の「苦しむ」であり、ὑπ’ αὐτῶν の行為者を明示しつつ、日本語では「彼らによって苦しみを受ける」とするのがより忠実で自然である。
  naturalness: 「彼だと気づかず」も理解可能だが、ここではエリヤとしての正しい身份を認めなかったことなので、「エリヤだと認めず」が明瞭である。「彼に対して、自分たちの望むままのことをしました」は現代標準語として自然で、原文の包括性を保つ。
  terminology: 「エリヤ」「人の子」は定着した適切な用語である。「苦しめられようとしています」は意味を大きく損なわないが、注の代案「苦しもうとしています」は日本語では意志的にも読めるため不適切である。
