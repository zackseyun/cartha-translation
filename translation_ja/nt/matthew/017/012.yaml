revisions:
- from: しかし、あなたがたに言います。エリヤはすでに来たのに、人々は彼だと気づかず、彼を思いのままに扱いました。[a] 同じように、人の子も彼らの手によって苦しめられようとしています。[b]
  to: しかし、あなたがたに言います。エリヤはすでに来ました。しかし、彼らはエリヤだと認めず、彼に対して、自分たちの望むままのことをしました。[a] 同じように、人の子も彼らによって苦しみを受けようとしています。[b]
  rationale: 原文の不定の複数主語を「彼ら」として保持し、ἐπέγνωσαν の文脈上の意味を「エリヤだと認めず」と明示した。ποιέω ἐν αὐτῷ ὅσα ἠθέλησαν の包括的な表現は、自然な日本語で「彼に対して、自分たちの望むままのことをしました」とした。μέλλει πάσχειν ὑπ’ αὐτῶν は、目前の受難と彼らの行為者性をともに保つため、「彼らによって苦しみを受けようとしています」とした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:40Z'
review_pass:
