source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: ja
  text: しかし、あなたがたに言います。エリヤはすでに来ました。しかし、彼らはエリヤだと認めず、彼に対して、自分たちの望むままのことをしました。[a] 同じように、人の子も彼らによって苦しみを受けようとしています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エリヤだと認めず」は、「彼を正しく見分けず」または「彼が誰であるかを認めず」とも訳せる。ここでは、彼をエリヤとして認めなかったことを表す。「彼に対して、自分たちの望むままのことをしました」は、直訳すれば「彼に対して、自分たちが望んだことを何でも行いました」。
    reason: lexical_alternative
  - marker: b
    text: 「苦しみを受けようとしています」は、「苦しむことになっています」とも訳せる。原文は、人の子の苦難が迫っていることを表し、「彼らによって」はその行為者を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: しかし、あなたがたに言います
  rationale: δέによる直前の期待との対比を「しかし」で示し、直接的な語りかけを自然な現代日本語で表した。
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: エリヤはすでに来た
  rationale: ἤδηとアオリストが示す、すでに完了した到来を簡潔に表した。固有名は日本語聖書で定着した「エリヤ」とした。
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: 人々は彼だと気づかず
  rationale: 文脈上、単に知らなかったのではなく、エリヤとして正しく見分けなかったことを示す。ギリシア語の主語は明示されないため、日本語では一般的な「人々」を補った。
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: 彼を思いのままに扱いました
  rationale: 逐語的には不自然なποιέω ἐνの慣用的表現と、意のままの行為を表すὅσα ἠθέλησανを、敵対的な文脈を保ちつつ自然に訳した。
- source_word: οὕτως καὶ
  choice: 同じように
  rationale: エリヤへの扱いと人の子の受難との類比を明瞭に示す。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 称号として定着した訳語を用い、聖書的背景と含意を保持した。
- source_word: μέλλει πάσχειν ὑπ’ αὐτῶν
  choice: 彼らの手によって苦しめられようとしています
  rationale: μέλλειの迫りつつある将来性と、ὑπό＋属格の行為主体を示した。「運命づけられている」のような、原文以上に強い必然性は加えていない。
theological_decisions:
- issue: エリヤの到来が誰を指すか
  choice: 本文では原文どおり「エリヤ」とし、洗礼者ヨハネという同定を挿入しない
  alternative: 「エリヤとして来たヨハネ」などと明示する
  rationale: 直後の文脈は弟子たちの理解を示すが、この節自体はエリヤとだけ述べるため、解釈上の同定は文脈に委ねた。
- issue: μέλλειが示す人の子の受難の性質
  choice: 「苦しめられようとしています」とし、目前の将来を表す
  alternative: 「苦しむよう定められています」として神学的必然性を強調する
  rationale: この句は受難が迫っていることを述べるが、それ自体では神的必然性を明示しないため、原文以上の決定論的含意を避けた。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な告知にふさわしい品位を保った。「人々」「彼ら」は文脈上の複数主語を自然な日本語で示すための補いであり、特定集団を本文以上に限定しない。
