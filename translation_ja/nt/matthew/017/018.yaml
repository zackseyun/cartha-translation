id: MAT.17.18
reference: Matthew 17:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: ja
  text: イエスはその悪霊を叱りつけた。悪霊はその子から出て行き、その時から少年は癒やされた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その瞬間から」。
    reason: ἀπὸ τῆς ὥρας ἐκείνηςは直訳すれば「その時刻から」であり、文脈上「その瞬間から」とも訳せる。
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: 叱りつけると
  rationale: 強くとがめる、権威をもって叱責するという語感を保ち、悪霊への対処として自然な現代日本語にした。
- source_word: αὐτῷ
  choice: その悪霊を
  rationale: 代名詞自体には指示対象の余地があるが、直後に悪霊がその子から出たとあるため、文脈上は悪霊を指すと判断した。日本語では対象を明示したほうが誤読を避けられる。
- source_word: τὸ δαιμόνιον
  choice: 悪霊
  rationale: 日本語聖書および一般的な宗教語として理解しやすく、「汚れた霊」など原文にない限定を加えない。
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: その子から出て行き
  rationale: 悪霊が人から出るという原文の具体的な表現を保ちつつ、自然な日本語にした。
- source_word: ἐθεραπεύθη
  choice: 癒やされた
  rationale: 身体的な治癒に狭めすぎず、原語の受動態と回復の結果を表す。
- source_word: ὁ παῖς
  choice: 少年
  rationale: 文脈では父親の息子を指すため、「僕」ではなく年少の男子を示す「少年」とした。
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: その時から
  rationale: 直訳的な「その時刻から」より自然でありながら、起点以後の継続を示すἀπόの意味を保つ。
theological_decisions:
- issue: イエスが叱りつけた対象（αὐτῷ）
  choice: 悪霊
  alternative: 少年
  rationale: 文法上、代名詞だけでは少年を指す可能性も排除しきれないが、直後の「悪霊はその子から出て行き」が、叱責の対象を悪霊と読むことを強く支持する。
- issue: 癒やしが起きた時点
  choice: その時から
  alternative: その瞬間に／直ちに
  rationale: ἀπὸ τῆς ὥρας ἐκείνηςは起点を示し、「その時以後、癒やされた状態になった」という原文の表現を保つ。「直ちに」とすると即時性を明示しすぎる。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、叙事の簡潔さと尊厳を保った。「その悪霊」と明示して日本語での指示対象の曖昧さを抑え、「その時から」によって原文の時間表現を自然に再現した。
