id: MAT.17.19
reference: Matthew 17:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: ja
  text: その時、弟子たちはひそかにイエスのもとに来て言った。「なぜ私たちは、それ[a]を追い出すことができなかったのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それ」は悪霊を指すと考えられる。苦しんでいた少年を指すなら、「あの子」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を導く時間表現として、自然で明瞭な現代日本語を用いた。
- source_word: προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: 弟子たちは……イエスのもとに来て
  rationale: 分詞を主動詞と自然に結び、イエスに近づいたことを平明に表した。
- source_word: κατ’ ἰδίαν
  choice: ひそかに
  rationale: 人目を避けた私的な場面であることを、簡潔で自然な日本語で示した。
- source_word: εἶπον
  choice: 言った
  rationale: 内容は疑問文だが、原文の一般的な発話動詞をそのまま保った。
- source_word: Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν
  choice: なぜ私たちは……できなかったのですか
  rationale: 理由を問う表現と、明示された主語ἡμεῖς、および能力の欠如を自然に伝えた。
- source_word: ἐκβαλεῖν
  choice: 追い出す
  rationale: 悪霊を排除する場面で一般読者に分かりやすく、原語の動作性も保つ表現を選んだ。
- source_word: αὐτό
  choice: それ
  rationale: 中性単数代名詞に対応させ、最も可能性の高い悪霊への指示を示しつつ、原文に残る指示対象の余地を脚注で明記した。
theological_decisions:
- issue: αὐτόの指示対象
  choice: 本文では悪霊を指すと考えて「それ」とした。
  alternative: 苦しんでいた少年を指すと取り、「あの子」と訳すこともできる。
  rationale: 直前の物語とἐκβάλλωの悪霊追放用法から悪霊が最も自然だが、代名詞の指示対象を断定しすぎず、別解を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、弟子たちが私的にイエスへ尋ねる場面にふさわしい、簡潔で丁寧な疑問文とした。
