  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: ja
  text: 弟子たちはこれを聞くと[a]、地に顔を伏せて倒れ[b]、非常に恐れた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「聞いて」。ギリシャ語のアオリスト分詞は、ここでは「聞くと」または「聞いた後」と訳すことができる。「これ」は原文に明記されておらず、直前の声を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼らの顔に向かって倒れ」。顔を下にして地に伏す姿勢を表す。
    reason: lexical_alternative
  - marker: c
    text: 「非常に」は、恐れの強さを表すギリシャ語 σφόδρα の訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞くと
  rationale: アオリスト分詞を自然な時間節で表した。「これ」は原文では明示されていない目的語を、直前の天からの声を受けて補ったもの。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 福音書における μαθηταί の標準的で明瞭な訳語。ここではイエスの弟子たちを指す。
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: 顔を地に伏せて倒れ
  rationale: 直訳的な身体動作を保ちつつ、日本語として姿勢が明確になるよう「地に」を補った。「ひれ伏した」だけでは礼拝という解釈に傾く可能性があるため、倒れたという叙述を残した。
- source_word: ἐφοβήθησαν σφόδρα
  choice: 非常に恐れた
  rationale: σφόδρα の強い程度を「非常に」で表し、φοβέομαι は神学的な意味を限定せず「恐れた」とした。
theological_decisions:
- issue: 神の声に対する弟子たちの反応の性質
  choice: 身体を伏せる動作と強い恐れをそのまま描写し、礼拝、畏敬、恐怖のいずれかに限定しない。
  alternative: 「ひれ伏して畏れた」と訳し、礼拝または畏敬の意味を前面に出す。
  rationale: ギリシャ語本文は姿勢と恐れを述べるが、その反応を神学的に分類してはいないため、原文の緊張と幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語調とした。「ひれ伏す」のみで礼拝行為と断定せず、原文の身体動作と強い恐れを具体的に示した。
