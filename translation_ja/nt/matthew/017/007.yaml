  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: ja
  text: イエスは近寄り、彼らに触れて言った。「起きなさい。恐れてはいけない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: 近寄り
  rationale: προσέρχομαιの、人のもとへ近づく動きを自然な現代日本語で表す。文脈上「近づく」より「近寄る」が対人的で自然である。
- source_word: ἁψάμενος αὐτῶν
  choice: 彼らに触れて
  rationale: ἅπτω＋属格の意味をそのまま「触れる」とし、手を置いたなど原文にない具体化を避ける。分詞は日本語として自然な連用形で表す。
- source_word: εἶπεν
  choice: 言った
  rationale: λέγωの基本的な意味を簡潔に表し、「語りかけた」などの付加的なニュアンスを避ける。
- source_word: Ἐγέρθητε
  choice: 起きなさい
  rationale: 直前に弟子たちがひれ伏しているため、その姿勢から身を起こす命令として自然である。「立ちなさい」では最終姿勢を限定しすぎる。
- source_word: μὴ φοβεῖσθε
  choice: 恐れてはいけない
  rationale: φοβέομαιの禁止命令を、荘重さを保ちつつ明瞭な現代日本語で表す。現在命令形を「恐れるのをやめなさい」とまで限定しない。
- source_word: καὶ
  choice: （連用形および句点で表現）
  rationale: 反復されるκαίが示す一連の動作を、日本語では「近寄り」「触れて」とつなぎ、命令間は句点で自然に表す。意味上の順序は保持するが、不自然な「そして」の反復は避ける。
theological_decisions:
- issue: イエスの命令に含まれる慰めを、解釈的に増幅せず表すこと
  choice: 「起きなさい。恐れてはいけない」
  alternative: 「立ち上がりなさい。もう怖がらなくてよい」
  rationale: 身体を起こす命令と恐れを禁じる命令を明瞭に保ちつつ、「もう」「よい」など原文に明示されない牧会的な言い換えを加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。物語の動作を簡潔に運び、イエスの言葉には威厳と慰めの両方が感じられる命令表現を用いた。異読や説明を要するほどの実質的な曖昧さはないため、脚注は付していない。
