  - severity: low
    issue: 「一行」
    rationale: 「一行」は旅行団・使節団などを連想させ、原文のαὐτῶν（彼ら）の素直な叙述より具体化されている。「彼らが」とすれば、文脈上のイエスと弟子たちを過不足なく指せる。
