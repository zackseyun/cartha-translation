id: MAT.17.9
reference: Matthew 17:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: ja
  text: 彼らが山を下っているとき、イエスは彼らに命じた。「人の子が死者の中から復活するまでは、この幻[a]について、だれにも話してはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「目にしたこと」とも訳せる。ギリシャ語は「幻」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: 一行が山を下っているとき
  rationale: 属格独立構文と現在分詞が示す同時進行の動作を、自然な現代日本語で表した。「一行」は文脈上のイエスと弟子たちを指す。
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: イエスは彼らにこう命じた
  rationale: ἐνετείλατο の強い指示を「命じた」で保ち、λέγων は日本語で自然な直接話法の導入「こう」に組み込んだ。
- source_word: Μηδενὶ εἴπητε
  choice: だれにも話してはならない
  rationale: μηδενί の全面的な否定と禁止命令の力を、明瞭で自然な日本語で示した。
- source_word: τὸ ὅραμα
  choice: この幻
  rationale: ὅραμα の視覚的・啓示的な含みを保つため「幻」とした。直前に描かれた出来事を指すので、日本語では「この」が自然である。
- source_word: ἕως οὗ
  choice: までは
  rationale: 禁止が続く時間的な限界を簡潔に示した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称を意訳せず、旧約的・神学的な響きを保つ定着した訳語を用いた。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: ἐκ の『中から』という意味と、複数形 νεκρῶν が指す死者たちの領域・集団を明確に表した。
- source_word: ἐγερθῇ
  choice: よみがえらされる
  rationale: 復活の文脈を明瞭にしつつ、アオリスト受動態の形を保ち、行為者を本文以上に明示しない訳とした。
theological_decisions:
- issue: 復活表現の態と行為者
  choice: 死者の中からよみがえらされる
  alternative: 死者の中からよみがえる／復活する
  rationale: ギリシャ語は受動態であるため、日本語でも受動表現を用いた。これにより、復活を起こす行為者を明示しない原文の形と神学的含みを保った。
- issue: ὅραμα の出来事としての性格
  choice: 幻
  alternative: 目にしたこと／光景
  rationale: 「幻」は超自然的な啓示という語感を保つ。一方、単なる非現実的な幻覚と誤解される可能性があるため、より中立的な訳の可能性を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の強さと本文の荘重さを保った。分詞構文は日本語として自然な形に整理したが、復活表現では原文の受動態を意識的に保持した。
