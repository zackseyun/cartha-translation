revisions:
- from: 一行が山を下っているとき、イエスは彼らにこう命じた。「人の子が死者の中からよみがえらされるまでは、この幻[a]について、だれにも話してはならない。」
  to: 彼らが山を下っているとき、イエスは彼らに命じた。「人の子が死者の中から復活するまでは、この幻[a]について、だれにも話してはならない。」
  rationale: 「彼らが山を下っているとき」は、現在分詞を伴う属格独立構文の同時進行を自然に表す。「復活する」は、日本語に不自然な使役受身を持ち込まずに復活の出来事を明確に述べ、原文が行為者を明示しない点も保つ。脚注アンカーはὅραμαに対応する箇所に維持した。
