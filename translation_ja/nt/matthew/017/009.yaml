  timestamp: '2026-07-16T07:38:36Z'
review_pass:
  verdict: revise
  source_fidelity: 文頭の属格独立構文、命令、ὅραμα、時間的制限、人の子、死者からの復活という主要な要素は概ね正しく捉えている。ただし「よみがえらされる」は日本語では「よみがえる」の使役受身と受け取られやすく、ギリシャ語の受動態を適切に反映する表現ではない。
  naturalness: 「一行」は文脈上理解可能だが、現代標準日本語の聖書本文としては「彼ら」のほうが簡潔で、原文の複数代名詞にも直接対応する。「復活する」は日本語として自然で、この文脈で明確である。
  terminology: 「人の子」は定着した自己呼称として適切である。「幻」もὅραμαの啓示的な性格を保つ訳語として許容できる。復活については、ギリシャ語の受動形を日本語の不自然な使役受身で逐語化せず、「復活する」とするのが適切である。これは行為者を明示せず、本文の神学的含みを不当に限定しない。
