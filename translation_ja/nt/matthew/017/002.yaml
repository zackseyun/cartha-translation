id: MAT.17.2
reference: Matthew 17:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: ja
  text: そして、イエスの姿が彼らの目の前で変わり[a]、その顔は太陽のように輝き、衣は光のように白くなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「変貌し」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: 姿が変わり
  rationale: 変化を表す受動形。日本語では「変貌し」も可能だが、現代の一般読者に明瞭で、直後に描かれる目に見える変化を自然に示す「姿が変わり」とした。受動の意味合いは日本語の自動詞表現で保たれる。
- source_word: ἔμπροσθεν αὐτῶν
  choice: 彼らの目の前で
  rationale: 出来事が弟子たちの面前で起きたことを明瞭かつ自然に表す。
- source_word: ἔλαμψεν
  choice: 輝き
  rationale: 光を放つことを表す直接的で自然な訳。
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: その顔
  rationale: ここでは身体的な顔を指す。「御顔」のような敬語的・宗教的含意は原文に加えない。
- source_word: ὡς ὁ ἥλιος
  choice: 太陽のように
  rationale: ὡςによる比喩を明確に保つ。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: 衣
  rationale: 衣服一般を指すが、場面の格調を保ちつつ現代日本語でも理解しやすい「衣」とした。
- source_word: ἐγένετο λευκὰ
  choice: 白くなった
  rationale: 状態の変化を過不足なく表し、原文に明記されない強度を付加しない。
- source_word: ὡς τὸ φῶς
  choice: 光のように
  rationale: 定冠詞を伴うφῶςを「光」とし、ὡςの比較表現をそのまま保つ。
theological_decisions:
- issue: 変貌の出来事の表現
  choice: 姿が変わり
  alternative: 変貌し
  rationale: 目に見える栄光の現れという文脈を保ちながら、専門的な出来事名だけに依存せず原語の基本義を明瞭に伝える。変化の性質や原因について本文以上の教理的説明は加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、叙述の荘重さを保った。「イエス」は直前の文脈上の指示対象を日本語で明確にするため補った。
