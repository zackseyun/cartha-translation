source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: ja
  text: 彼らがカファルナウムに着くと、二ドラクマの税を集める人たち[a]がペテロのところに来て言った。「あなたがたの先生は、二ドラクマの税を納めないのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「二ドラクマを受け取る人たち」。二ドラクマは当時の神殿税の額に当たる。
    reason: 文化的背景と原文の字義を示すため。
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: 一行が…来たとき
  rationale: 属格独立構文の時間的意味を自然な日本語で表した。αὐτῶνは文脈上イエスと弟子たちを指すため、「彼ら」より明瞭な「一行」とした。δέは場面の推移に吸収した。
- source_word: Καφαρναοὺμ
  choice: カファルナウム
  rationale: 日本語聖書で広く通用する地名表記を採用した。
- source_word: προσῆλθον
  choice: …のところに来て
  rationale: ペトロに近づいた動きを、硬すぎない自然な現代日本語で表した。
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: 二ドラクマの税を集める人たち
  rationale: 直訳は「二ドラクマを受け取る人たち」だが、文脈では定められた納付金の徴収を指す。「税」を補って機能を明瞭にし、文化的背景は脚注で示した。
- source_word: δίδραχμα
  choice: 二ドラクマの税
  rationale: δίδραχμονは二ドラクマ相当額を表す。単なる硬貨ではなく納付の有無が問題となっているため、文脈上の意味を明瞭にした。
- source_word: τῷ Πέτρῳ
  choice: ペトロのところに
  rationale: 接近を表す動詞との関係を自然な日本語にした。人名は現代日本語で定着した表記を用いた。
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: あなたがたの先生
  rationale: διδάσκαλοςの基本的な意味を、現代の読者に分かりやすい「先生」で表した。ὑμῶνの複数性は「あなたがた」で保持した。
- source_word: οὐ τελεῖ
  choice: 納めないのですか
  rationale: τελέωはここでは義務となる金額を支払うこと。「納める」は税の文脈に自然で、否定疑問文の形も保持して、肯定を予期する語用論的含みを断定的に言い換えなかった。
theological_decisions:
- issue: δίδραχμαが単なる貨幣か、神殿税としての納付金か
  choice: 本文では「二ドラクマの税」とし、脚注で神殿税であることを説明する
  alternative: 「二ドラクマ銀貨」または「二ドラクマ」
  rationale: 原文は字義的には「二ドラクマ」を受け取る者たちと言うが、問いはイエスがその額を納めるかどうかに関する。本文では文脈的な徴税の意味を示しつつ、「神殿税」という歴史的同定は脚注に置き、原文以上の神学的説明を本文へ持ち込まない。
- issue: 否定疑問文 οὐ τελεῖ の含意
  choice: 「納めないのですか」と否定疑問のまま訳す
  alternative: 「納めますよね」
  rationale: 原文は肯定の答えを予期している可能性が高いが、含意を一つに固定せず、問いの形と緊張を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、叙述には落ち着いた品位を保った。「徴収人」のような制度的で硬い語を避け、「税を集める人たち」とした。質問は丁寧だが過度に改まらない形にした。
