  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: ja
  text: そのとき、弟子たちは、イエスが自分たちにバプテスマのヨハネ[a]について話されたのだと悟った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「バプテスマを授ける者ヨハネ」。
    reason: βαπτιστής は「バプテスマを授ける者」とも訳せるが、本文では日本語で定着した呼称を用いる。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 弟子たちが理解に至った時点を示す物語上の時間表現として、明瞭で自然。
- source_word: συνῆκαν
  choice: 悟った
  rationale: 単に知識として理解しただけでなく、直前の言葉の意味と指示対象をつかんだことを自然に表す。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 福音書における μαθηταί の標準的で分かりやすい訳語。
- source_word: ὅτι
  choice: 〜のだと
  rationale: 理解した内容を導く接続詞として訳し、理由を表す「なぜなら」とは解さない。
- source_word: περὶ Ἰωάννου
  choice: ヨハネについて
  rationale: 属格を伴う περί が発言の主題・対象を示すことを自然な日本語で表す。
- source_word: τοῦ βαπτιστοῦ
  choice: バプテスマを授ける人
  rationale: βαπτιστής の行為者としての意味を明示し、現代の一般読者にも役割が伝わるようにする。
- source_word: εἶπεν αὐτοῖς
  choice: 自分たちに話された
  rationale: 発言の受け手 αὐτοῖς を保ち、主語がイエスであることを文脈に即して明示する。日本語の時制は主節との前後関係を自然に表せる。
theological_decisions:
- issue: 直前の文脈におけるエリヤに当たる人物の特定
  choice: 弟子たちは、イエスがヨハネについて語ったと理解した、と明記する。
  alternative: エリヤとヨハネの関係を訳文内で説明する。
  rationale: 本文は弟子たちの理解として指示対象を明示するが、その関係の性質までは説明していないため、訳文でも説明を加えない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文にふさわしい落ち着きを保った。「イエス」はギリシア語本文で省略されている主語だが、直前の文脈から明白であり、日本語での参照を明確にするため補った。
