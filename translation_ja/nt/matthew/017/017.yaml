reference: Matthew 17:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: ja
  text: イエスは答えた。「ああ、信仰のない[a]、ねじ曲がった[b]世代よ。いつまでわたしはあなたがたと共にいるのか。いつまであなたがたに耐えるのか。その子をここへ、わたしのところに連れて来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不信仰な」または「不忠実な」とも訳せる。ギリシア語は、信じないことと忠実でないことのどちらも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「ゆがんだ」または「堕落した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: すると、イエスは答えた
  rationale: 「答えて言った」という原文の慣用表現を自然な現代日本語にまとめた。δέはここでは物語の展開を示す軽い転換として「すると」とした。
- source_word: Ὦ
  choice: ああ
  rationale: 嘆きと厳粛な叱責を帯びた呼びかけを、自然で品位のある日本語で表した。
- source_word: γενεὰ
  choice: 世代
  rationale: 同時代の人々を指し得る語であり、原文の預言者的な響きを保つため「人々」ではなく「世代」とした。
- source_word: ἄπιστος
  choice: 信仰のない
  rationale: 不信と不忠実の両方を含み得るが、直近の文脈にある信仰の欠如を明確かつ自然に表す。語義の幅は脚注に残した。
- source_word: διεστραμμένη
  choice: ねじ曲がった
  rationale: διαστρέφωの完了受動分詞が示す、正しい状態からゆがめられた状態を保つ。「堕落した」より比喩を残し、「倒錯した」より現代日本語で誤解が少ない。
- source_word: μεθ’ ὑμῶν ἔσομαι
  choice: わたしはあなたがたと共にいるのか
  rationale: 未来形を含む修辞疑問を日本語の「いつまで…いるのか」で自然に表した。
- source_word: ἀνέξομαι ὑμῶν
  choice: あなたがたに耐えなければならないのか
  rationale: ἀνέχομαιの「耐える、辛抱する」という強い苛立ちを保ちつつ、「我慢する」より厳粛な文体とした。
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: その子をここへ、わたしのところに連れて来なさい
  rationale: αὐτόνの指示対象を文脈に即して「その子」と明示し、ὧδεとμοιの双方を「ここへ」「わたしのところに」で表した。人を運ぶ場面なので自然な「連れて来なさい」とした。
theological_decisions:
- issue: ἄπιστοςが表す非難の性質
  choice: 信仰のない
  alternative: 不信実な／不忠実な
  rationale: 直前の弟子たちの失敗と後続の「信仰」の教えに照らし、不信を前面に出した。ただし、この語が「不忠実な」という意味も持ち得ることは脚注で保持した。
- issue: 叱責の対象であるγενεάの範囲
  choice: 範囲を限定せず「世代」と訳す
  alternative: 弟子たち／群衆／当時の人々と明示する
  rationale: 呼びかけが具体的に誰まで含むかを本文は明示していないため、特定集団に限定せず原文の曖昧さを保った。
- issue: 「いつまで」の二つの問いの調子
  choice: 嘆きと叱責を伴う修辞疑問として保持する
  alternative: イエスが共にいる期間についての単純な質問と解する
  rationale: 反復と語彙は強い嘆き・忍耐の限界を表すが、その期間を神学的に特定する説明は加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「ああ」「世代よ」「共に」によって厳粛で預言者的な叱責の調子を保った。過度に古風な語尾や、口語的すぎる「我慢する」は避けた。
