source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: ja
  text: しかし、この類いは、祈りと断食によらなければ出て行かない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、最古期のギリシャ語写本（4世紀のシナイ写本とバチカン写本を含む）および初期のシリア語訳・コプト語訳にはないが、ビザンティン多数本文、ラテン語伝承、および大部分のシリア語写本にはある。後代の写字生がマルコ9章29節と調和させるために加えた可能性が高い。
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: 類い
  rationale: 文脈上、悪霊の種類・部類を指す。現代日本語として自然であり、特定の悪霊論を付加しない。
- source_word: ἐκπορεύεται
  choice: 出て行かない
  rationale: 取りついた人から悪霊が退出することを表す。「出て行く」は原語の移動の方向性を保ちつつ自然である。
- source_word: εἰ μὴ
  choice: …によらなければ
  rationale: ここでは手段を限定する表現であるため、後続の前置詞句と合わせて「祈りと断食によらなければ」と訳した。
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: 祈りと断食
  rationale: 二つの名詞を等位に保ち、本文が示す実践を明確かつ簡潔に表した。
theological_decisions:
- issue: 「この類い」が何を指すか
  choice: 指示対象を本文中で「悪霊」と明示せず、「この類い」とした
  alternative: 「この種の悪霊」
  rationale: 文脈上は悪霊を指すが、ギリシャ語本文自体は名詞を補わず「この類い」と述べるため、その省略と含みを保持した。
- issue: 祈りと断食の効力の表現
  choice: 「…によらなければ出て行かない」
  alternative: 「…によってのみ追い出せる」
  rationale: 原文は悪霊が「出て行く」ことを述べており、弟子たちが「追い出す」能力へ言い換えてはいないため、因果関係を過度に体系化しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「類い」は文脈依存の指示を保ち、「祈りと断食」は伝統的で一般読者にも理解しやすい表現とした。本文中の脚注記号は該当節全体に関するため文末に置いた。
