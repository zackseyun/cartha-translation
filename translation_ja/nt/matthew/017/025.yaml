id: MAT.17.25
reference: Matthew 17:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: ja
  text: ペトロは「はい」と答えた。彼が家に入ると、イエスが先にペトロに話しかけて言われた。「シモン、あなたはどう思いますか。地上の王たちは、諸税や人頭税をだれから取り立てますか。自分の息子たちからですか。それとも、よその者たちからですか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸税」は、関税や通行税などの間接税を指す。「よその者たち」は、自分の家族に属さない者たち、すなわち部外者を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: はい
  rationale: ペトロの簡潔な肯定の返答として、現代日本語で最も自然である。
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: 彼が家に入ると
  rationale: 対格分詞の主語がペトロであることを明示し、時間的なつながりを自然な日本語で表した。
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: イエスのほうから先にこう言われた
  rationale: イエスがペトロの発言に先んじて話しかけたという動作の主導性を、逐語的すぎず明確に伝える。
- source_word: Τί σοι δοκεῖ
  choice: あなたはどう思いますか
  rationale: シモンの判断を問う定型表現を自然な現代日本語にした。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: γῆを特定の土地に限定せず、天上との潜在的な対照も損なわない表現である。
- source_word: τέλη
  choice: 関税
  rationale: 間接税、通行税、関税などを指す語として、後続する人頭税との区別が分かりやすい。
- source_word: κῆνσον
  choice: 人頭税
  rationale: 個人に課される貢納税という具体的な意味を示し、τέληとの違いを保った。
- source_word: υἱῶν αὐτῶν
  choice: 自分の息子たち
  rationale: υἱοίの男性親族語を保持し、王の家族と部外者との対比、および次節へ続く含意を残した。
- source_word: ἀλλοτρίων
  choice: よその者たち
  rationale: 自分の家族に属さない者という関係的な意味を自然に表し、『外国人』と不必要に限定しない。
theological_decisions:
- issue: 王の「息子たち」が持つ神学的含意
  choice: 「自分の息子たち」と直訳的な家族表現を保持する
  alternative: 「自分の子どもたち」または「臣民」
  rationale: 王家の息子が税を免れるという比喩が次節の御子に関する含意を準備しているため、ここで解釈を説明的に付加せず、原文の緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの問いには落ち着いた威厳を保った。「イエスのほうから先に」で先行動作を自然に示し、税の二種類と家族・部外者の対比を明確にした。
