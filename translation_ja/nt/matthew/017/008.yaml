id: MAT.17.8
reference: Matthew 17:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: ja
  text: 彼らが目を上げると、ただイエスおひとりしか見えなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「イエスおひとりのほかには、誰も見なかった」。原文は「〜のほかには」と「ひとり」を重ね、イエスだけが見えたことを強く示している。
    reason: 原文の重ねられた限定表現と、日本語訳での自然な再構成を示すため。
lexical_decisions:
- source_word: ἐπάραντες
  choice: 目を上げると
  rationale: アオリスト分詞が主動詞に先立つ動作を示すため、現代日本語で自然な継起表現とした。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは弱い物語上の接続であり、日本語では「と」による文の流れだけで自然に表せる。
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: 彼らが目を
  rationale: ギリシア語の具体的な身体表現を保ちつつ、所有関係を日本語の主語で自然に示した。
- source_word: οὐδένα εἶδον
  choice: しか見えなかった
  rationale: 直訳的な「誰も見なかった」より場面に即した自然な日本語とし、後続の例外表現と合わせて「ほかには誰も見えなかった」の意味を表した。
- source_word: εἰ μὴ
  choice: しか
  rationale: 否定文における「〜を除いて」という限定を、日本語の限定否定構文で表した。
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: ただイエスおひとり
  rationale: αὐτόν、固有名、μόνονが重なる強い限定を、冗長にならない現代日本語で「ただ」と「おひとり」により保持した。
theological_decisions:
- issue: 幻の後に見えた人物がイエスだけであったことの強調
  choice: 「ただイエスおひとりしか」として強い限定を保つ
  alternative: 「イエスのほかには、誰も見えなかった」
  rationale: 原文は否定、例外、μόνονを重ねて排他性を強調している。モーセとエリヤが見えなくなり、イエスだけが見えたという物語上の事実を示し、それ以上の教理的意味は訳文に加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語。「おひとり」は人物を数える自然で品位ある表現として用い、過度に古風な言い回しや教派特有の表現は避けた。
