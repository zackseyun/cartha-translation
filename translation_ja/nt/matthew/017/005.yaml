reference: Matthew 17:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: ja
  text: 彼がまだ話しているうちに、見よ、輝く雲が彼らを覆いかぶさった[b]。そして見よ[a]、雲から声がして、こう言った。「この方はわたしの愛する子、わたしが喜ぶ者。彼の言うことを聞きなさい[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「見よ」に当たる語が二度用いられ、場面への注意を促して劇的な展開を際立たせている。
    reason: lexical_alternative
  - marker: b
    text: 「覆いかぶさった」と訳した語は、神がご自身を現される場面で用いられる聖書的な雲の描写を響かせている可能性がある。
    reason: cross_reference
  - marker: c
    text: 「聞きなさい」は、「耳を傾け、その言葉を重んじる」という意味を含み得る。別訳「彼に聞き従いなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: 彼がまだ話しているうちに
  rationale: 属格独立構文による同時進行を自然な日本語で表し、ἔτιが示す、話している最中に出来事が起きたという流れを保った。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面への注意を促す語であり、劇的な展開を示すため、本文中の二度とも訳出した。現代語としてはやや格調があるが、意味は明瞭である。
- source_word: νεφέλη φωτεινὴ
  choice: 輝く雲
  rationale: φωτεινήの明るさ、光を放つ印象を簡潔に表し、象徴的意味を本文で説明しすぎない訳とした。
- source_word: ἐπεσκίασεν
  choice: 覆った
  rationale: 雲がその場の人々を覆う像を自然に表す。神の現臨を思わせる聖書的響きの可能性は脚注に示した。
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: 雲の中から声がして、こう言った
  rationale: 分詞を日本語の自然な叙述に組み替えつつ、声が雲から発したことと、その内容が続くことを明確にした。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: わたしの愛する子
  rationale: 子としての身分と、ἀγαπητόςが示す愛を、簡潔で自然かつ荘重な日本語で表した。
- source_word: ἐν ᾧ εὐδόκησα
  choice: わたしの心にかなう者
  rationale: 神の喜びと是認を表す定型的な宣言を自然な日本語にした。アオリストを機械的に過去形にせず、この場で有効な評価として訳した。
- source_word: ἀκούετε αὐτοῦ
  choice: 彼の言うことを聞きなさい
  rationale: 単に音声を聞くのではなく、語る内容に耳を傾け従う含みを持つ命令として訳した。「従いなさい」と断定して意味を狭めることは避けた。
theological_decisions:
- issue: イエスについての神の宣言
  choice: これはわたしの愛する子、わたしの心にかなう者
  alternative: これはわたしの子、愛する者。この者をわたしは喜んだ
  rationale: イエスを「子」と直接示す原文と、愛および神の喜び・是認を保ちつつ、後代の教理用語を付加しない自然な宣言文とした。
- issue: ἀκούετε αὐτοῦ の命令の強さ
  choice: 彼の言うことを聞きなさい
  alternative: 彼に従いなさい／彼の声を聞きなさい
  rationale: 聞くことに加えて重んじ従う含意を残す一方、「従う」だけに限定せず、原語が持つ聴聞と服従の幅を保った。
- issue: 雲が覆う描写の神顕現的含意
  choice: 本文では「覆った」とし、含意を脚注で示す
  alternative: 神の臨在で彼らを包んだ
  rationale: 原文は出来事を描写しており、その神学的意味を明示してはいないため、本文で解釈を加えず、聖書的連想の可能性のみを注記した。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神の声の場面にふさわしい格調を保った。注意喚起語「見よ」は原文の反復を尊重して残したが、それ以外は不自然な逐語調を避けた。
