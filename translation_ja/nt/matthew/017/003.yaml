base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: ja
  text: すると、見よ[a]、モーセとエリヤが彼らに現れ、イエスと話していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼らに見えた」。ギリシア語の動詞は形式上は受動態だが、ここでは「彼らに現れ」と訳すのが自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίによる場面の進展と、ἰδούの注意を促す力および突然の出来事の鮮明さを保った。「見よ」はやや格調があるが、現代日本語でも理解できる。
- source_word: ὤφθη
  choice: 現れ
  rationale: ὁράωのアオリスト受動形だが、この用法は「見られた」と逐語的に訳すより「現れた」とするのが自然で、目に見えるようになった出来事を適切に表す。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 出現を目撃した者たちを示す与格を直接的に訳した。文脈上、彼らは同行した弟子たちであるが、原文どおり代名詞を保つ。
- source_word: Μωϋσῆς καὶ Ἠλίας
  choice: モーセとエリヤ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: συλλαλοῦντες
  choice: 語り合っていた
  rationale: 互いに話すことを表す複合動詞の相互性を自然な日本語で示す。分詞の継続的な情景描写も「ていた」で表した。
- source_word: μετ’ αὐτοῦ
  choice: その方と
  rationale: μετά＋属格の同伴・交わりを表す。αὐτοῦの指示対象は文脈上イエスだが、名前に置き換えず代名詞的な表現を保った。敬意を示しつつ通常の人物指示である「その方」を採用した。
theological_decisions:
- issue: αὐτοῦの指示対象
  choice: 文脈上イエスを指すが、「その方」と訳す
  alternative: 「イエスと」と明示する／「彼と」と訳す
  rationale: 変貌の場面では指示対象はイエスで明らかである。ただし、原文の代名詞を固有名詞に置き換えず、自然で曖昧さの少ない日本語にした。
- issue: モーセとエリヤの出現のあり方
  choice: 「現れ」と訳し、目に見える出現として述べる
  alternative: 「彼らに見え」と形式上の受動態を前面に出す
  rationale: 本文は二人が目撃者たちに見える形で現れたことを述べるが、その存在様式については説明していない。訳文もそれ以上の教理的説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ἰδούには場面の突然性を保つため格調ある「見よ」を用いた。「語り合っていた」は会話の相互性と情景の継続を自然に示す。
