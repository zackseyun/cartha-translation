id: MAT.17.10
reference: Matthew 17:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ja
  text: そこで弟子たちはイエスに尋ねた。「では、なぜ律法学者たちは、まずエリヤが来なければならないと言っているのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: 尋ねた
  rationale: 直接の問いを導くアオリストであり、現代日本語として自然に動作を表す。
- source_word: μαθηταὶ
  choice: 弟子たち
  rationale: 定冠詞により文脈上既知の集団を指す。原文にない所有表現「イエスの」は加えない。
- source_word: λέγοντες
  choice: 「……」
  rationale: 日本語では発言内容を直接引用すれば分詞の「言って」を明示せずとも機能が自然に伝わる。
- source_word: Τί οὖν
  choice: では、なぜ
  rationale: τί は形式上「何」だが、λέγουσιν ὅτι と結びつき、律法学者がそう述べる理由を問う表現である。οὖν は前後関係を示す「では」とした。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 福音書の文脈で、律法に通じ教える専門家を指すことが一般読者に明瞭に伝わる定着した訳語。
- source_word: λέγουσιν ὅτι
  choice: ……と言っている
  rationale: 現在形の継続的・一般的な主張を、日本語で自然に表した。
- source_word: Ἠλίαν
  choice: エリヤ
  rationale: 日本語聖書で定着した固有名の表記。
- source_word: δεῖ ἐλθεῖν
  choice: 来なければならない
  rationale: δεῖ が表す必要性を明確に保持する自然な日本語。
- source_word: πρῶτον
  choice: まず
  rationale: 到来の順序を示す副詞として自然であり、「先に」の意味を保つ。
- source_word: αὐτόν
  choice: イエスに
  rationale: 三人称代名詞をそのまま「彼に」とするより、文脈上の指示対象を固有名で示すほうが現代日本語では明瞭で、意味を変えない。
theological_decisions:
- issue: エリヤの到来についての弟子たちの問いの解釈的な力点
  choice: 律法学者の教えの理由を問う形にとどめ、その教えを肯定しているのか、疑っているのか、修正を求めているのかは確定しない。
  alternative: 問いに懐疑の響きを加える、またはマラキ書の背景や後続節の答えを本文に織り込む。
  rationale: この節そのものは弟子たちの問いを報告するだけであり、その神学的緊張は17章11–13節の答えまで保つべきである。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語とした。直接話法を用い、原文の問いの流れを自然に再現した。
