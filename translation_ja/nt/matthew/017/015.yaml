id: MAT.17.15
reference: Matthew 17:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: ja
  text: そして言った。「主よ、息子をあわれんでください。息子は発作を起こし[a]、ひどく苦しんでいます。というのも、何度も火の中に落ち、また何度も水の中に落ちるからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字義的には「月に打たれている」。発作を伴う状態を指す古代の表現。別訳「てんかんを患っており」。
    reason: σεληνιάζεταιの月に関わる字義的背景と、発作様の状態を指す古代的慣用、および可能な訳語を示すため。
lexical_decisions:
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの敬意ある呼びかけであり、κύριος の通常の神学的・文脈的重みを保つ。
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: 息子をあわれんでください
  rationale: ἐλέησόν の切実な慈悲の願いと、υἱόν が明示する「息子」を自然な現代日本語で表した。
- source_word: σεληνιάζεται
  choice: 発作に襲われ
  rationale: 語源的には月との関連を含む古代の表現だが、ここでは発作様の症状を指す。「てんかん」と現代医学的に断定せず、観察される状態を表す。
- source_word: κακῶς πάσχει
  choice: ひどく苦しんでいます
  rationale: κακῶς の強意と πάσχει の苦痛を、明瞭で自然な日本語にした。
- source_word: πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ
  choice: 何度も火の中に倒れ込み、また何度も水の中に倒れ込むのです
  rationale: πολλάκις の反復と火・水の並行表現を保持し、γάρ は説明を表す文末の「のです」で自然に示した。
- source_word: καὶ λέγων
  choice: そして言った
  rationale: 前節から続く分詞構文を、日本語の物語文として自然な定動詞で表した。
theological_decisions:
- issue: 癒やし・悪霊追放の文脈における σεληνιάζεται の訳
  choice: 発作に襲われ
  alternative: てんかんを患っている／月に打たれている
  rationale: 父親が述べる症状を現象的に訳し、現代の医学診断や月が原因だという古代的理解を本文に持ち込まない。この節自体が明示しない病因や神学的説明も加えない。
translation_notes:
  register: 明瞭で現代的だが、嘆願の厳粛さを保つ文体。「あわれんで」は聖書語として理解可能でありながら過度に古風ではない。
