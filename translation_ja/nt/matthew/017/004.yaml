reference: Matthew 17:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ja
  text: ペトロは答えて、イエスに言った。「主よ、ここにいるのは、私たちにとってよいことです。もしお望みなら、私がここに仮小屋[a]を三つ造りましょう。あなたのために一つ、モーセのために一つ、エリヤのために一つです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幕屋」「天幕」または「小屋」とも訳せる。
    reason: σκηνάςの語義には一時的な小屋やテント状の住まいが含まれ、「幕屋」という訳は祭儀的な連想を帯びる可能性があるため。
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: そこで…言った
  rationale: 「答えて言った」というギリシア語の慣用的な発話導入を、応答先の明示的な問いがない文脈でも自然な現代日本語となるよう「そこで…言った」とした。δέの物語進行の働きも表す。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの敬意ある呼びかけであり、κύριοςが帯び得る神学的な重みも狭めずに保つ。
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: 私たちがここにいるのはすばらしいことです
  rationale: ギリシア語の評価表現を自然な日本語にしつつ、単なる利便性ではなく「良い、望ましい」という肯定的な意味を表した。
- source_word: εἰ θέλεις
  choice: もしお望みなら
  rationale: θέλωの願望・意志の幅を保ち、イエスへの呼びかけにふさわしい敬意ある表現とした。
- source_word: ποιήσω
  choice: 私が…造りましょう
  rationale: 未来形による申し出を日本語の意志・提案表現で示す。「建てる」より広く、簡易な構造物にも合う「造る」を選んだ。
- source_word: σκηνάς
  choice: 仮小屋
  rationale: 一時的な小屋、幕屋、天幕を指し得る語である。「仮小屋」は現代日本語で理解しやすく、恒久的建築物という印象を避ける。祭りや幕屋との連想を断定しないよう、別訳を脚注に残す。
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: あなたのために一つ、モーセのために一つ、エリヤのために一つ
  rationale: μίανの三度の反復による配分の強調を、日本語でも「一つ」を繰り返して保持した。
- source_word: ὧδε
  choice: ここ
  rationale: 二度現れるὧδεをどちらも「ここ」と訳し、原文の反復を保持した。
theological_decisions:
- issue: イエスへの呼びかけκύριος
  choice: 主よ
  alternative: 先生／ご主人様
  rationale: 単なる敬称に限定せず、語が持ち得る権威と神学的含意を保つため「主」とした。
- issue: 変貌の場面におけるσκηνάς
  choice: 仮小屋
  alternative: 幕屋／天幕／小屋
  rationale: 本文自体は仮庵の祭りとの明示的な同定をしていないため、中立的で分かりやすい語を本文に置き、祭儀的・聖書間的な連想を持ち得る訳語は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ペトロの敬意は「主よ」「お望みなら」で示し、冗長な「答えて言った」は避けた。固有名は一般的な日本語聖書表記に従った。
