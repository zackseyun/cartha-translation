id: MAT.17.27
reference: Matthew 17:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: ja
  text: しかし、彼らをつまずかせないために[a]、海へ行って釣り針を投げ、最初に上がって来た魚を取りなさい。その魚の口を開けると、スタテル一枚[b]が見つかる。それを取って、わたしとあなたのために彼らに渡しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らに不快感を与えないために」または「彼らの反感を招かないために」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: スタテルはおよそ四ドラクマに相当する貨幣で、二人分の神殿税を納めるのに足りた。
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: 彼らのつまずきとならない
  rationale: 文脈では道徳的な罪へ誘うことより、神殿税を徴収する人々に不必要な反感や問題を生じさせることを指す。「つまずき」という原語の比喩を残しつつ、脚注で語用的な意味を補う。
- source_word: θάλασσαν
  choice: 湖
  rationale: θάλασσα自体は「海」だが、ここで指すガリラヤ湖について、現代日本語では「湖へ行って」が自然で地理的にも明瞭。固有名称は直前の文脈から補わず、一般名詞にとどめた。
- source_word: ἄγκιστρον
  choice: 釣り針
  rationale: 単なる「針」よりも用途が明確で、現代日本語として自然。
- source_word: τὸν ἀναβάντα πρῶτον ἰχθὺν
  choice: 最初に釣れた魚
  rationale: 直訳は「最初に上がって来た魚」だが、釣り針を投げるという文脈で、その結果を自然な日本語で表した。
- source_word: ἆρον
  choice: 取りなさい
  rationale: αἴρωの「取り上げる／取る」という意味を、命令の流れに合う簡潔な表現で示した。
- source_word: στατῆρα
  choice: スタテル銀貨一枚
  rationale: 特定の貨幣名を保持し、「銀貨」を添えて読者に種類を明示する。価値と神殿税二人分に相当する点は脚注で説明する。
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: わたしとあなたの分として
  rationale: ここでのἀντίは二人に代わる支払いを表す。「分として」は日本語で納税の代理・充当関係を自然に伝える。
- source_word: πορευθεὶς
  choice: 行って
  rationale: 先行する付帯動作を、日本語の連用表現によって後続の命令へ自然につないだ。
- source_word: δὸς αὐτοῖς
  choice: 彼らに納めなさい
  rationale: 字義は「彼らに与えなさい」だが、神殿税の徴収という文脈では「納める」が対象行為を明確かつ自然に表す。
theological_decisions:
- issue: 神殿税の支払いに関するσκανδαλίζωの意味
  choice: 先の「子たちは免除されている」という主張を撤回せず、徴収者たちのつまずきとならないために支払うという実際的な配慮として訳す。
  alternative: イエスが神殿税への絶対的義務を認めたために支払う、と解する。
  rationale: 17章24～26節は子たちの自由を述べ、この節は「しかし……つまずきとならないために」と譲歩的な理由を加える。本文が保つ自由と自発的配慮の緊張を解消しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。イエスの発話は「わたし」「あなた」とし、命令形は穏当な「～なさい」で統一した。原文の接続関係と命令の順序を保ちながら、釣りと納税の場面が普通の読者に自然に伝わる表現を選んだ。
