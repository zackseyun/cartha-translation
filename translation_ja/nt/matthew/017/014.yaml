lexical_decisions:
- source_word: Καὶ
  choice: （「一行が」で自然に文を開始）
  rationale: 前の物語を受ける接続詞。日本語では逐語的に「そして」を置かず、場面の連続性が自然に伝わる文頭とした。
- source_word: ἐλθόντων
  choice: 一行が……来ると
  rationale: 属格絶対のアオリスト分詞で、文脈上の複数の主体を表す。「来ると」により、主節に先立つ時を自然に示した。
- source_word: πρὸς τὸν ὄχλον
  choice: 群衆のところに
  rationale: ὄχλοςを現代日本語で自然な「群衆」とし、πρόςの到達方向を「のところに」で表した。
- source_word: προσῆλθεν αὐτῷ
  choice: イエスに近寄り
  rationale: προσέρχομαιの接近する意味を明確に表した。代名詞の指示対象は文脈上イエスであり、日本語での明瞭さのため固有名で示した。
- source_word: ἄνθρωπος
  choice: 一人の男
  rationale: ここでは特定の成人男性を指すため、「一人の男」が正確で自然である。
- source_word: γονυπετῶν αὐτόν
  choice: その前にひざまずいて
  rationale: イエスに対して膝をつく身体動作を自然な日本語で表した。分詞の継続性を「て」で保ち、次節へ続く構文も示した。
theological_decisions:
- issue: γονυπετῶνが礼拝を意味するか、嘆願の姿勢を意味するか
  choice: その前にひざまずいて
  alternative: 彼を礼拝して
  rationale: 語は膝をつく動作を直接表しており、その行為の神学的意味を本文だけで「礼拝」と断定しない。敬意や嘆願を含み得る姿勢として訳した。
- issue: ἄνθρωποςの個別的な指示
  choice: 一人の男
  alternative: 一人の人
  rationale: この箇所では特定の男性を指しているため、性別を曖昧にせず訳した。ただし、人間一般についての神学的主張は加えていない。
translation_notes:
  register: 明瞭で現代的かつ品位のある物語文。「一行」は直前の文脈にいる複数の人物を自然に受ける。節末は次節の発言へ続くため読点で終えた。
