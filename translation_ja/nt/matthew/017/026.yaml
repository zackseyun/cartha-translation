source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: ja
  text: 「よその人たちからです」[a]と答えると、イエスは彼に言った。「それなら、息子たちは自由なのだ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身内でない人たちから」または「ほかの人たちから」とも訳せる。原語は、支配者の家に属さない者たちを、その息子たちと対比している。
    reason: lexical_alternative
  - marker: b
    text: 文脈上は「息子たちは税を免除されている」という意味。原文は、より文字どおりには「息子たちは自由である」と述べている。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: と答えると
  rationale: 属格独立構文の時間的なつながりを自然な日本語で示した。直前の問いへの発言なので「答える」としたが、内容を過度に補ってはいない。
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: よその人たちから
  rationale: 支配者の家に属する息子たちとの対比を表す語であり、国籍や民族を強く連想させる「外国人」よりも、身内ではない者という関係的な意味を自然に伝える。
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: イエスは彼に言われた
  rationale: φημίの通常の物語用法と、αὐτῷが示す相手への方向性を保った。イエスの発言には、現代日本語の聖書文体として自然な尊敬表現を用いた。
- source_word: Ἄρα γε
  choice: それなら
  rationale: 相手の答えから結論を導く推論を、硬すぎない明瞭な現代日本語で表した。
- source_word: ἐλεύθεροί
  choice: 自由なのだ
  rationale: 文脈上は納税義務を免れていることを含意するが、原語のより広い「自由」という表現を残し、単に「免除されている」と狭めなかった。
- source_word: οἱ υἱοί
  choice: 息子たち
  rationale: 原語が明示的に「息子たち」を意味し、王の家に属する者とよその者との家族的・法的対比を担うため、その性別と比喩を保持した。
theological_decisions:
- issue: 王の息子たちの納税上の自由と、より広い子としての身分との響き
  choice: 息子たちは自由なのだ
  alternative: 息子たちは税を免除されている
  rationale: 直接の文脈では税の免除を意味するが、原文は「自由である」と述べている。そこで、納税義務に限定せず、子としての身分が持つ広がりと神学的緊張を保持した。
- issue: οἱ υἱοίの性別を明示するか
  choice: 息子たち
  alternative: 子どもたち
  rationale: 王とその息子たちという直前の比喩、および原語の男性複数形を保つため「息子たち」とした。代表範囲を本文で拡張も限定もしない。
translation_notes:
  register: 明瞭で自然な現代標準語を用いながら、イエスの発言には簡潔で dignified な聖書文体を保った。「よその人たち」は口語的すぎず、民族的な意味に限定されない表現である。
