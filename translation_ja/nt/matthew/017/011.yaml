  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: ja
  text: イエスは答えた。「確かに、エリヤが来て、すべてを回復する。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「確かに、エリヤは来る。そして、すべてを回復する」。ギリシア語の「来る」は現在形だが、ここでは未来に向けた意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えた
  rationale: 分詞と定形動詞を重ねるセム語的な言い回しを、応答の意味を保ちながら自然な現代日本語にした。主語は文脈上の明確さのため「イエス」とした。
- source_word: Ἠλίας
  choice: エリヤ
  rationale: 日本語聖書で広く定着している固有名詞表記を用いた。
- source_word: μέν
  choice: 確かに
  rationale: 次節の対照を予告しつつ、この発言を肯定する強調を自然に示す。
- source_word: ἔρχεται
  choice: 来て
  rationale: 形は現在時制だが文脈上は未来志向であり、後続する未来動詞と一続きの日本語にして「来て……する」と表した。別訳の余地は脚注に示した。
- source_word: ἀποκαταστήσει
  choice: 回復する
  rationale: 未来の行為を表す語であり、何をどのように元へ戻すかを本文以上に限定せず、直接的に訳した。
- source_word: πάντα
  choice: すべて
  rationale: 中性複数形の包括的な範囲を保ち、対象を本文にない仕方で特定しない表現とした。
theological_decisions:
- issue: エリヤによる回復の性質と範囲
  choice: 「すべてを回復する」と広く訳す
  alternative: 「あらゆるものを正しい状態に戻す」など、回復の内容を具体化する
  rationale: この節は回復の範囲や性質を定義していないため、霊的刷新、社会的改革、終末的完成などに限定せず、原文の包括性と解釈上の緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「お答えになった」のような敬語による解釈的な待遇表現は避け、簡潔な叙述とした。
