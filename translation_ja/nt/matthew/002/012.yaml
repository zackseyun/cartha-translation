  source_fidelity: 「夢の中で警告を受けた」は、κατ’ ὄναρ と受動分詞 χρηματισθέντες の神的な警告という含意を、神を本文で明示せずに適切に表している。「ヘロデのもとへ戻らないよう」は μὴ ἀνακάμψαι πρὸς Ἡρῴδην を自然かつ正確に反映する。「別の道を通って自分たちの国へ帰って行った」も、別経路で故国へ出発したことを忠実に伝える。
  naturalness: 明快な現代標準日本語であり、叙述として滑らかである。「帰って行った」は、故国を目的地とする文脈で自然で、ἀνεχώρησαν の出発・退去のニュアンスも損なっていない。
  terminology: 「ヘロデ」「警告を受けた」「夢の中で」「別の道」「自分たちの国」はいずれも適切である。本文が神を明示しない点を保ち、注で神的含意を説明していることも妥当である。
