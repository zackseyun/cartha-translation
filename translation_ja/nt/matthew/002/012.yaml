id: MAT.2.12
reference: Matthew 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: ja
  text: そして、ヘロデのもとへ戻らないよう夢の中で警告を受けた[a]ので、彼らは別の道[b]を通って自分たちの国へ帰って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神から警告を受けた」。ギリシア語の受動表現は神からの警告を示唆するが、この節では神が明記されていない。
    reason: lexical_alternative
  - marker: b
    text: または「別の経路で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: 警告を受けた
  rationale: 神からの告知や指示を受けることを表す受動分詞。文脈上は神の働きが示唆されるが、本文に神の名は明記されていないため、自然な受動表現にした。
- source_word: κατ’ ὄναρ
  choice: 夢の中で
  rationale: 夢を通して告知を受けたことを表すマタイ特有の自然な言い回しとして訳した。
- source_word: μὴ ἀνακάμψαι
  choice: 戻らないよう
  rationale: μήを伴う不定詞が警告の内容を示している。旅の文脈に合う明快な表現とした。
- source_word: πρὸς Ἡρῴδην
  choice: ヘロデのもとへ
  rationale: πρόςと対格が人のところへの移動を示すため、日本語として自然な「もとへ」とした。
- source_word: δι’ ἄλλης ὁδοῦ
  choice: 別の道を通って
  rationale: ὁδόςの具体的な移動経路という意味を保ちつつ、現代日本語で自然な表現にした。「別の経路で」も可能。
- source_word: ἀνεχώρησαν
  choice: 帰って行った
  rationale: 語自体は「立ち去る、退く」だが、目的地が自分たちの国であるため、文脈上の帰還を自然に表した。
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: 自分たちの国へ
  rationale: χώραは国、土地、地方を意味し得る。ユダヤから故国へ向かう場面なので「自分たちの国」が明瞭である。
theological_decisions:
- issue: 警告を与えた主体としての神の含意
  choice: 本文では「警告を受けた」と受動態で訳し、神を明示しない。
  alternative: 「神から警告を受けた」または「神のお告げを受けた」
  rationale: 文脈とχρηματίζωの用法は神的な告知を強く示唆するが、この節のギリシア語は神を明記していない。含意を保ちつつ、本文以上に主体を特定しないため。
translation_notes:
  register: 明快で現代的かつ落ち着いた叙述調。「お告げ」は宗教的含意を明示しやすいため本文では避け、原文の受動態が持つ余韻を「警告を受けた」で保持した。
