lexical_decisions:
- source_word: ἰδόντες
  choice: 見ると
  rationale: アオリスト分詞の時間的関係を、自然な現代日本語で表した。星を見たことに続いて喜んだという流れを保っている。
- source_word: δὲ
  choice: （訳語を明示しない）
  rationale: ここでのδέは物語を緩やかに進める接続語であり、日本語では文脈上あえて「そして」などを置かないほうが自然である。
- source_word: τὸν ἀστέρα
  choice: その星
  rationale: すでに文脈に登場している特定の星を指す定冠詞の働きを「その」で示した。
- source_word: ἐχάρησαν
  choice: 喜びにあふれた
  rationale: χαίρωの喜ぶという意味を保ちつつ、同語根のχαράを伴う強意的な表現を、日本語として自然に再現した。
- source_word: χαρὰν μεγάλην
  choice: 大きな喜び
  rationale: 動詞と同語根の目的格による強調を、名詞「喜び」を明示して表した。
- source_word: σφόδρα
  choice: 非常に
  rationale: 喜びの大きさを強く増幅する副詞として、明快で格調を損なわない現代語を選んだ。
