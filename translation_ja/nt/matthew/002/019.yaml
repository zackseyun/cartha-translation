id: MAT.2.19
reference: Matthew 2:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: ja
  text: さて、ヘロデが死んだ後、見よ、主の天使[a]がエジプトにいるヨセフに夢の中で現れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「天使」に定冠詞がありません。そのため、英語などでは「主のある天使」と訳すこともできますが、日本語の「主の天使」だけでは定・不定の区別は示されません。
    reason: 原文の「天使」の無冠詞性と、日本語では定・不定を文法的に区別しないことを示すため。
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: さて、ヘロデが死んだ後
  rationale: 属格独立のアオリスト分詞を、先行する出来事の完了を示す自然な時間表現にした。δέは強い逆接ではなく物語の場面転換として「さて」とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 読者の注意を促し、出来事を生き生きと提示するマタイの文学的な標識を、簡潔で荘重な表現によって保った。
- source_word: ἄγγελος κυρίου
  choice: 主の使い
  rationale: κύριοςを「主」、ἄγγελοςを文脈に合う「使い」とした。日本語には冠詞がないため、ギリシア語でἄγγελοςに冠詞がないことは脚注で示した。
- source_word: φαίνεται
  choice: 現れる
  rationale: 物語を生き生きと語る歴史的現在を、日本語でも現在形によって保った。受動的な「見られる」より、ここでの意味に自然である。
- source_word: κατ’ ὄναρ
  choice: 夢の中で
  rationale: 夢によって啓示を受けることを表すマタイの慣用句として、自然な日本語にした。
- source_word: τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
  choice: エジプトにいたヨセフに
  rationale: 与格を出現の相手として訳し、ἐν Αἰγύπτῳが示すその時点でのヨセフの所在を明確で自然な語順にした。
theological_decisions:
- issue: ἄγγελος κυρίουにおけるἄγγελοςの無冠詞性
  choice: 本文は「主の使い」とし、無冠詞性を脚注で説明する
  alternative: 「主の一人の使い」または伝統的な特定表現としての「主の使い」
  rationale: ギリシア語本文にはἄγγελοςの前に冠詞がなく、不特定の使いと読むのが素直だが、日本語の「主の使い」自体は特定・不特定を文法的に区別しない。不自然に限定を加えず、原文上の情報と伝統的解釈の余地を脚注に残した。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: ἄγγελος κυρίουは神に属する使いを指す定型的表現であり、神への称号として現代日本語聖書で自然かつ荘重な「主」を用いた。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「見よ」と歴史的現在の「現れる」によって、原文の荘重さと物語の臨場感を保った。
