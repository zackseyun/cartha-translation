id: MAT.2.22
reference: Matthew 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: ja
  text: しかし、アルケラオが父ヘロデに代わってユダヤを王として治めていると聞くと、ヨセフはそこへ行くのを恐れた。そして、夢の中で警告を受け、ガリラヤ地方へ退いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: しかし、…と聞くと
  rationale: アオリスト分詞の先行する状況を自然な日本語の時の表現で示し、δὲによる物語上の転換・対照を「しかし」で表した。
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: ユダヤを治めている
  rationale: 王として支配する意味を文脈上明確に保ちつつ、現代日本語として自然にした。「王となっている」より統治の継続を明瞭に表す。
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: 父ヘロデに代わって
  rationale: ἀντίが示す交代・後継の関係を、原文にない継承事情を付加せず簡潔に表した。
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: そこへ行くのを恐れた
  rationale: 恐れとその対象となる行動の関係を、原文の不定詞構文に沿って自然に表した。
- source_word: χρηματισθεὶς κατ’ ὄναρ
  choice: 夢の中で警告を受け
  rationale: 神的な告知を含意しうる受動動詞を「警告を受け」と訳し、原文で明示されない行為者は補わなかった。κατ’ ὄναρはマタイで用いられる定型的な「夢の中で」とした。
- source_word: ἀνεχώρησεν
  choice: 退いた
  rationale: 危険や事情に応じて意図的に別の場所へ移る含みを保持した。単なる「行った」より原語のニュアンスに近い。
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: ガリラヤ地方へ
  rationale: 複数形 μέρη は地域一帯を表す自然な日本語「地方」でまとめた。地理的な到達先として「へ」を用いた。
- source_word: implicit subject
  choice: ヨセフは
  rationale: ギリシア語では主語が前後の文脈から明らかであるが、日本語で連続する二つの節の主体を明瞭にするため、文脈上のヨセフを一度明示した。
theological_decisions:
- issue: χρηματισθείςの警告の主体を神と明示するか
  choice: 「警告を受け」とし、主体を明示しない
  alternative: 「神から警告を受け」／「神のお告げを受け」
  rationale: マタイにおける用法は神的な伝達を強く含意するが、この節のギリシア語は行為者を明示していない。そのため神的含意を否定せず、本文以上に限定もしない受動表現を採用した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。固有名詞は一般的な聖書表記を採用し、「治めている」「警告を受け」「退いた」によって原文の統治、啓示的警告、危険回避のニュアンスを簡潔に保持した。
