  source_fidelity: 「ユダヤを治めている」は統治の継続をよく表しているが、βασιλεύει（王として治める／王である）の王権的語義が本文では明示されていない。原文に即して「王として」を補うのが安全である。その他、ヨセフの明示、父ヘロデに代わること、恐れて行かないこと、夢における受動的な警告、ガリラヤへの退去は適切に反映されている。
  naturalness: 全体として明瞭で自然な現代標準日本語である。「そこへ行くのを恐れた」「夢の中で警告を受け」「ガリラヤ地方へ退いた」は文脈に合い、過度に説明的ではない。
  terminology: 「アルケラオ」「ヘロデ」「ユダヤ」「ガリラヤ」は一般的な聖書地名・人名表記として問題ない。「警告を受け」はχρηματισθείςの受動性と、明示されない行為者を保持している。神を本文に補わない判断も妥当である。
