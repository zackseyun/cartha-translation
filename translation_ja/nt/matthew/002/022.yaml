- from: しかし、アルケラオが父ヘロデに代わってユダヤを治めていると聞くと、ヨセフはそこへ行くのを恐れた。そして、夢の中で警告を受け、ガリラヤ地方へ退いた。
  to: しかし、アルケラオが父ヘロデに代わってユダヤを王として治めていると聞くと、ヨセフはそこへ行くのを恐れた。そして、夢の中で警告を受け、ガリラヤ地方へ退いた。
  rationale: βασιλεύειの「王として治める」という語義を本文に明示した。それ以外は原文の時系列、受動表現の曖昧さ、および危険を受けての退去という含意を自然な日本語で保持しているため変更しない。英語監査記録の脚注はヘロデに付されながらχρηματισθείςを説明しており、この日本語本文には対応する脚注アンカーがないため、当該不整合を日本語の脚注として持ち込まない。
