  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: ja
  text: ヘロデ王はこのことを聞いて動揺し、エルサレム全体も、彼とともに動揺した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エルサレム全体」は、都市名によってその住民を集合的に指す表現である。都市全体に広がった動揺を一般的に、あるいは誇張を込めて述べている可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: このことを聞いて
  rationale: アオリスト分詞を先行する出来事を表す自然な日本語にし、直前の博士たちの問いを指す暗黙の目的語を「このこと」として補った。
- source_word: δὲ
  choice: 独立した訳語を置かない
  rationale: 弱い接続・転換を示す語であり、日本語では分詞の「聞いて」による文の流れの中で十分に表される。
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ヘロデ王
  rationale: 称号と固有名を保ちつつ、現代日本語として自然な語順にした。
- source_word: ἐταράχθη
  choice: 動揺し／動揺した
  rationale: 内面的な乱れや不安を表す受動形。原因や程度を限定しすぎず、ヘロデとエルサレムに同じ動詞がかかる構造を日本語でも示した。
- source_word: πᾶσα Ἱεροσόλυμα
  choice: エルサレム中の人々
  rationale: 都市名で住民を指す換喩を、日本語で誤解なく自然に伝えた。「中」により全体を指す表現を保つが、厳密に一人残らずという範囲までは確定しない。
- source_word: μετ’ αὐτοῦ
  choice: 王とともに
  rationale: 「彼」では指示対象が曖昧になり得るため、ヘロデ王を指すことを明確にし、連動した動揺を表した。
theological_decisions:
- issue: πᾶσα Ἱεροσόλυμα の範囲
  choice: 都市の住民全体を集合的に指す表現として訳す
  alternative: 多くの住民を指す誇張表現、または特に指導者層を指すと解する
  rationale: ギリシア語は都市名を全体として掲げており、指導者層などに限定していない。一方、文字どおり全住民一人一人と断定する必要もないため、その含みを脚注で示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「恐れた」など原因や感情を狭める語を避け、「動揺した」で原語の幅を保った。主語の換喩は日本語の理解しやすさのため「人々」を明示し、その範囲の含みを脚注に残した。
