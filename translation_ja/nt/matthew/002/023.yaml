id: MAT.2.23
reference: Matthew 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: ja
  text: そして彼は、ナザレという町に来て、そこに住んだ[a]。それは、預言者たちを通して語られたことが成就するためであった。「彼はナザレ人と呼ばれることになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ナゾライ人」とも訳せる。「彼はナザレ人と呼ばれる」という言葉が、預言書のどの箇所を背景としているかについては見解が分かれる。マタイは一つの特定の箇所を引用するのではなく、複数の預言者に見られる主題を要約している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 来て
  rationale: 主動詞に先立つアオリスト分詞を、自然な日本語の連用形で表し、到来から居住への流れを保った。
- source_word: κατῴκησεν
  choice: 住んだ
  rationale: 居を定めて生活する意味を、現代の一般読者に明瞭な語で表した。「定住した」ほど永続性を強調しない。
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: ナザレという町に
  rationale: κατοικέωとεἰςの組み合わせを日本語として自然な「町に住む」とした。πόλιςは集落規模を不必要に誇張しない「町」とした。
- source_word: ὅπως πληρωθῇ
  choice: それは、…成就するためであった
  rationale: マタイの成就定型句における目的・結果の含みを保ちつつ、文脈に合う自然で格調ある日本語にした。
- source_word: τὸ ῥηθὲν
  choice: 語られたこと
  rationale: 冠詞付き受動分詞を簡潔で自然な日本語にした。
- source_word: διὰ τῶν προφητῶν
  choice: 預言者たちを通して
  rationale: διά＋属格が示す媒介を保持し、複数形も明示した。
- source_word: Ναζωραῖος
  choice: ナザレ人
  rationale: この文脈ではナザレとの結び付きを表す呼称として理解しやすい。ギリシア語形をより形式的に写す別表記と預言的背景の不確定性は脚注に残した。
- source_word: κληθήσεται
  choice: 呼ばれる
  rationale: καλέωの未来受動を、日本語の引用文で自然な受動形として表した。
theological_decisions:
- issue: 単一の旧約本文と逐語的に一致しない成就引用の性質
  choice: 本文では「預言者たち」という複数形をそのまま保ち、特定の一箇所を同定しない。
  alternative: イザヤ11章1節の「若枝」への語呂的暗示、またはメシアが軽んじられるという預言者的主題の要約と特定する。
  rationale: ギリシア語は明確に複数の「預言者たち」と述べているため、翻訳本文で推測的な出典を確定せず、議論の余地を脚注で示す。
- issue: Ναζωραῖοςの解釈
  choice: ナザレ人
  alternative: ナゾライ人、またはナジル人
  rationale: 直前の地名ナザレとの関連が文脈上明白である。「ナジル人」は別の概念であるナジルの誓願との混同を招くため採用しない。形式的な別表記は脚注で提示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、成就定型句には聖書本文としての品位を保った。「預言者たち」の複数形と、目的・結果の両面を帯び得るὅπωςの緊張を過度に説明的に解消しないようにした。
