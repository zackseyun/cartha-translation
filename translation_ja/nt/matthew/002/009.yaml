id: MAT.2.9
reference: Matthew 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: ja
  text: 王の言葉を聞いた後、彼らは出発した。すると、見よ、彼らが東で[a]見た星が彼らの先を進み、幼子のいる所の上に来て止まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「東で」は、「その星が昇る時に」とも訳せる。このギリシャ語表現は、東という地域・方角と、星が昇ることのどちらも指し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: 王の話を聞くと
  rationale: アオリスト分詞を主動詞に先立つ時を示す節として訳した。ἀκούωに属格の人物が続く構文を、現代日本語で自然な「王の話を聞く」とした。「ヘロデ」はこの節のギリシャ語本文にないため補わない。
- source_word: ἐπορεύθησαν
  choice: 出発した
  rationale: 王との面会後にその場を離れて進むという物語の動きを、簡潔で自然な日本語で表した。
- source_word: ἰδοὺ
  choice: すると、見よ
  rationale: 場面の急な展開に注意を向ける談話標識として省略せず、現代語として理解できる範囲で本文の生き生きした調子を保った。
- source_word: ὃν εἶδον ἐν τῇ ἀνατολῇ
  choice: 彼らが東で[a]見た
  rationale: εἶδονが先行する出来事であることは日本語の連体節で自然に伝わる。ἐν τῇ ἀνατολῇは地域・方角としての「東で」を本文に採用し、天文学的な「その星が昇る時に」という可能性は脚注に残した。
- source_word: προῆγεν αὐτούς
  choice: 彼らの先を進み
  rationale: 星が彼らに先行するというπροάγωの像を保ち、「導いた」として作用の仕方を必要以上に確定しなかった。
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: ついに…まで来て、…止まった
  rationale: 到来してから停止するという分詞と主動詞の流れを自然な日本語で表した。ἕωςは目標点への到達を示す「ついに…まで」とした。
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: 幼子のいる所まで来て、その上に
  rationale: 位置関係を明確にしつつ、「上に」が何を指すかについて本文以上の具体的説明を加えなかった。παιδίονは文脈に適した「幼子」とした。
theological_decisions:
- issue: 星についてのἐν τῇ ἀνατολῇの意味
  choice: 東で
  alternative: その星が昇る時に
  rationale: このギリシャ語句は、東という地域・方角も、星が昇ることも指し得る。本文では簡潔で広く理解される「東で」を用いる一方、星の性質や現れ方を解釈によって決めないよう、もう一つの可能性を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、ἰδούは「見よ」として物語の荘重さと鮮明さを保った。語順は日本語として自然になるよう整え、原文にない人物名や星の仕組みについての説明は加えていない。
