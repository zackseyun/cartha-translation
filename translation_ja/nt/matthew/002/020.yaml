id: MAT.2.20
reference: Matthew 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: ja
  text: こう言った。「起きて、幼子とその母を連れ、イスラエルの地へ行きなさい。幼子の命を狙う者たちは死んだからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: こう言った
  rationale: 現在分詞で前節の御使いの出現に続いて発言を導入する。日本語では分詞構文を形式的に残すより、「こう言った」とすることで前後のつながりを自然かつ明確に表せる。
- source_word: Ἐγερθείς
  choice: 起きて
  rationale: 命令に先立つアオリスト受動分詞だが、ここでは慣用的に「起きて」と訳すのが自然であり、続く命令と一続きの行動を示す。
- source_word: παράλαβε
  choice: 連れ
  rationale: この文脈の παραλαμβάνω は人を自分と一緒に連れて行くことを意味する。「受け入れ」ではなく「連れ」が簡潔で自然。
- source_word: τὸ παιδίον
  choice: 幼子
  rationale: παιδίον は子どもを指す。物語の幼いイエスを指す呼称として、現代日本語でも理解でき、文体上の品位も保つ「幼子」を採用した。
- source_word: τὴν μητέρα αὐτοῦ
  choice: その母
  rationale: αὐτοῦ が幼子を受ける関係をそのまま示し、「その母」と簡潔に訳した。
- source_word: πορεύου
  choice: 行きなさい
  rationale: 移動を命じる中動態命令であり、平明な命令表現「行きなさい」が適切。
- source_word: εἰς γῆν Ἰσραήλ
  choice: イスラエルの地へ
  rationale: γῆ Ἰσραήλ の領土・地域としての意味を保ち、単に「イスラエルへ」とはしなかった。
- source_word: τεθνήκασιν
  choice: 死んだ
  rationale: θνῄσκω の完了形は、死んで現在もその状態にあることを示す。日本語では「死んだからだ」が結果状態を文脈上十分に伝える。
- source_word: οἱ ζητοῦντες
  choice: 狙っていた者たち
  rationale: 「命を求める」は日本語では命を欲するという別の意味にも取られうるため、殺害を企てていた文脈を自然に表す「命を狙っていた」とした。複数形も「者たち」で保持した。
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: 幼子の命
  rationale: この慣用表現の ψυχή は非物質的な「魂」ではなく、奪おうとされている生命を指すため、「命」と訳した。
theological_decisions:
- issue: 殺害の脅威を表す ψυχή の訳語
  choice: 命
  alternative: 魂
  rationale: 「人の ψυχή を求める」という表現は、この物語ではその人を殺そうとすることを意味する。「魂」とすると、本文が意図しない霊魂論的含意を持ち込むことになる。
- issue: 命を狙った者たちの複数性
  choice: 者たち
  alternative: 者
  rationale: 原文の冠詞付き複数分詞 οἱ ζητοῦντες を保持し、ヘロデ一人だけに明示的に限定しない。誰々を含むかは本文以上に特定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、御使いの命令には自然で品位のある「行きなさい」を採用した。「幼子」は一般読者にも理解可能で、マタイ2章の文脈にふさわしい呼称として統一しやすい。脚注記号は、その説明対象である末尾の句の直後に置いた。
