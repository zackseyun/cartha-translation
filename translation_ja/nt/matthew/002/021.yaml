source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: ja
  text: それからヨセフは起き上がり、子どもとその母親を連れて、イスラエルの地に入った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 強い対比ではなく、前の命令を受けた物語の進展を示す接続辞なので、自然な因果・継起を表す「そこで」とした。
- source_word: ἐγερθεὶς
  choice: 起き
  rationale: 文脈では受動の意味よりも自動詞的な「起きる」を表す分詞であり、後続動作に先立つ行為として自然に訳した。
- source_word: παρέλαβε
  choice: 連れて
  rationale: ここでは自分とともに連れて行くという意味であり、日本語では「取った」より「連れて」が明瞭で自然である。
- source_word: τὸ παιδίον
  choice: 幼子
  rationale: παιδίονは幼い子どもを指す。降誕物語の文体にふさわしく、現代日本語でも理解できる「幼子」とした。
- source_word: τὴν μητέρα αὐτοῦ
  choice: その母
  rationale: αὐτοῦは自然には幼子を指すため、「その母」として指示関係を保った。
- source_word: εἰσῆλθεν
  choice: 入った
  rationale: εἰσέρχομαιの基本的な方向性を保ちつつ、現代日本語の物語文として自然な表現にした。
- source_word: εἰς γῆν Ἰσραήλ
  choice: イスラエルの地に
  rationale: 地理的・民族的領域を表す定型的な属格表現を、過度に限定せず「イスラエルの地」と訳した。
theological_decisions:
- issue: 主語ヨセフの明示
  choice: ヨセフを補った
  alternative: 代名詞的な主語を省略して「そこで起き」とする
  rationale: ギリシャ語では冠詞付き分詞が前節のヨセフを受けて主語となる。日本語で主語を完全に省くと文脈を切り出した際に不明瞭になるため、指示対象を変えずに固有名を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書物語としての落ち着いた品位を保った。「幼子」はやや格調があるが一般読者にも理解可能で、マタイの幼年物語における反復表現にも適する。
