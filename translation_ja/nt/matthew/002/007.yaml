lexical_decisions:
- source_word: Τότε
  choice: そこで
  rationale: 直前の出来事を受けて次の行動へ進む物語上のつながりを、自然な現代日本語で示す。
- source_word: Ἡρῴδης
  choice: ヘロデ
  rationale: 日本語聖書で広く定着している人名表記を用いる。
- source_word: λάθρᾳ
  choice: ひそかに
  rationale: 人に知られないように行ったという隠密性を、簡潔で自然に表す。
- source_word: καλέσας
  choice: 呼び寄せ
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、連用形で自然な動作の順序を保つ。単なる呼びかけではなく、面前に召した意味も伝わる。
- source_word: τοὺς μάγους
  choice: 博士たち
  rationale: μάγοιは東方の占星術や学問に通じた者たちを指す。本文では日本語で伝統的かつ理解しやすい「博士たち」とし、その具体的意味を脚注で補う。
- source_word: ἠκρίβωσεν
  choice: 詳しく確かめた
  rationale: 正確に調べて突き止めるという動詞の意味を、過度に硬くない明瞭な日本語で表す。
- source_word: παρ’ αὐτῶν
  choice: 彼らから
  rationale: 属格を伴うπαράが情報源を示すことを直接表現する。
- source_word: τὸν χρόνον τοῦ φαινομένου ἀστέρος
  choice: 星が現れた時
  rationale: 属格の分詞句を自然な時間節として訳す。φαινομένουの形だけでは継続・反復・出現時点の細部を過剰に限定せず、文脈に即して星の出現した時を示す。
