id: MAT.2.15
reference: Matthew 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: ja
  text: 'そして、ヘロデが死ぬまでそこにいた。これは、主が預言者を通して語られたことが成就するためであった。


    「わたしはエジプトからわたしの子を呼んだ。」[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしはエジプトからわたしの子を呼び出した。」
    reason: lexical_alternative
  - marker: b
    text: ホセア11:1からの引用。ホセア書では元来イスラエルが神の子と呼ばれているが、マタイはここで、この聖句がイエスにおいて成就したと述べている。
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: そこにいた
  rationale: 未完了過去の単純な状態表現を自然な日本語で表し、「とどまった」という文脈上の含意を本文に加えない。
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: ヘロデが死ぬまで
  rationale: τελευτήはここでは死、すなわち生涯の終わりを指す。日本語では動詞表現が明瞭で自然である。
- source_word: ἵνα πληρωθῇ
  choice: 実現するためであった
  rationale: マタイの成就定型句における目的・結果の幅を保ちつつ、現代日本語として自然に表現する。「成就する」より一般読者に分かりやすい「実現する」を用いる。
- source_word: τὸ ῥηθὲν
  choice: 語られたこと
  rationale: 冠詞付き受動分詞を自然に名詞化し、受動の意味を保持する。
- source_word: ὑπὸ κυρίου
  choice: 主が
  rationale: κύριοςを「主」とし、受動構文を自然な日本語の能動構文に変えて、主が究極の発話者であることを明確にする。
- source_word: διὰ τοῦ προφήτου
  choice: 預言者を通して
  rationale: διά＋属格が示す媒介を保ち、主を発話の源、預言者を媒介者として区別する。
- source_word: λέγοντος
  choice: （直接引用で表現）
  rationale: 日本語では「こう言われた」を重ねず、直前の「語られたこと」に続けて引用を置くことで意味を自然に伝える。
- source_word: Ἐξ Αἰγύπτου
  choice: エジプトから
  rationale: ἐξの起点・内部からの移動は文脈と「呼び出した」によって十分伝わり、現代日本語として自然である。
- source_word: ἐκάλεσα
  choice: 呼び出した
  rationale: 単なる命名ではなく、エジプトから外へ呼ぶ文脈上の方向性を自然に示す。καλέωの「呼ぶ」という中心義も保持する。
- source_word: τὸν υἱόν μου
  choice: わたしの子
  rationale: υἱόςの父子関係を保持する。「息子」も可能だが、聖書引用としての尊厳とイスラエルおよびイエスへの適用の幅を保つため「子」とする。
theological_decisions:
- issue: ホセア11章1節の引用における「実現」
  choice: イエスのエジプトからの帰還が、主が預言者を通して語ったことを実現したというマタイの主張をそのまま表す。
  alternative: 直接的な予言だけを指す、またはイスラエルの歩みをメシアが類型的に反復したことだけを指す、と限定する。
  rationale: 本文は実現を明言する一方、その仕組みを説明していないため、特定の預言理解を訳文に織り込まず神学的緊張を保つ。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主なる神
  rationale: ギリシャ語はκυρίουであり、「神」を補わずに訳す。旧約の神名との関連はあり得るが、本文では「主」が原文に最も直接的である。
- issue: 「わたしの子」の指示対象
  choice: 本文では指示対象を説明せず、引用をそのまま置く。
  alternative: 本文中でイエスまたはイスラエルと明示する。
  rationale: ホセア書の元の文脈とマタイによるイエスへの適用の両方を保ち、本文で一方だけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用には簡潔で dignified な調子を保った。「成就」ではなく「実現」を採用して一般読者への分かりやすさを優先しつつ、ἵνα πληρωθῇの成就定型句を保持した。すべての脚注記号を本文中に配置した。
