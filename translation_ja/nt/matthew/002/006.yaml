id: MAT.2.6
reference: Matthew 2:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: ja
  text: '「そして、ユダの地、ベツレヘムよ。


    あなたはユダの統治者たちの中で、


    決して最も小さい者ではない。


    あなたから、わたしの民イスラエルを牧する[a]


    支配者が出て来る[b]からである。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「牧する」には、「治める」という意味合いもある。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「出て行く」。文脈上、「現れる」「出て来る」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: 地
  rationale: ベツレヘムをユダに属する場所として示す同格表現なので、土壌や全世界ではなく、地域を表す簡潔な「地」とした。
- source_word: οὐδαμῶς
  choice: 決して…ない
  rationale: 後続の評価を強く否定する語の強調を、現代日本語で自然な「決して…ない」によって保った。
- source_word: ἐλαχίστη
  choice: 最も小さく
  rationale: 規模だけでなく地位や重要性の低さも含み得るため、「最も小さく」として原文の比較表現を保ち、「取るに足りない」などに限定しなかった。
- source_word: ἡγεμόσιν
  choice: 統治者たち
  rationale: 政治的・指導的立場を表す複数形をそのまま人物として訳し、特定の官職を意味する「総督」などには狭めなかった。
- source_word: ἐξελεύσεται
  choice: 出て来る
  rationale: ἐξέρχομαιの「外へ出る」と、話者の視点からの「来る」の両面を自然な日本語で表した。
- source_word: ἡγούμενος
  choice: 支配者
  rationale: 名詞的に用いられた分詞で、来る者の統治的役割を示すため、「支配者」とした。
- source_word: ποιμανεῖ
  choice: 牧する
  rationale: 羊飼いのイメージを保持しつつ、民を導き治める比喩的意味も担える語として「牧する」を採用した。補足的な統治の含意は脚注に示した。
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: わたしの民イスラエル
  rationale: 所有関係と「イスラエル」の同格関係を、語を補いすぎず自然に示した。
theological_decisions:
- issue: 来る人物における王的統治と羊飼いのイメージ
  choice: ἡγούμενοςを「支配者」、ποιμανεῖを「牧する」と訳し、両方の側面を残す。
  alternative: 両語を「指導者／治める」のように政治的表現へ統一する、または両方を牧会的表現へ統一する。
  rationale: 原文は統治と牧羊のイメージを組み合わせている。どちらか一方に解消せず、メシア的指導者像に含まれる緊張と豊かさを保つため。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、預言の引用にふさわしい簡潔で格調ある文体とした。「牧する」は日常語よりやや聖書的だが、原文の重要な羊飼いの比喩を一語で保つため採用し、意味を脚注で補った。
