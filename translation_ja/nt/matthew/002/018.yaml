id: MAT.2.18
reference: Matthew 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: ja
  text: '「ラマで声が聞こえた。


    泣き声と激しい嘆き。


    ラケルは自分の子どもたちのために泣き、


    慰めを受けようとはしなかった。


    子どもたちがもういないからである。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: ラマで声が聞こえた
  rationale: 受動形ἠκούσθηと場所を示すἐνをそのまま保ち、預言の引用にふさわしい簡潔で厳粛な表現とした。
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: 泣き声と激しい嘆きの声
  rationale: κλαυθμόςの耳に聞こえる泣き声と、πολύςによって強められたὀδυρμόςを区別しつつ、前文の「声」と自然につながる日本語にした。
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: ラケルが自分の子どもたちのために泣いている
  rationale: 現在分詞κλαίουσαの継続的な情景を「泣いている」で表し、τέκναは性別を限定せず「子どもたち」とした。目的語対格は、嘆きの対象を表す自然な日本語として「のために」と訳した。
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: 彼女は慰めを受けようとはしなかった
  rationale: θέλωの意志・意向を保ち、「拒んだ」と断定するよりも原文に近い表現にした。παρακληθῆναιの受動態も「慰めを受ける」で示した。
- source_word: ὅτι οὐκ εἰσίν
  choice: 子どもたちがもういないからである
  rationale: 直訳の「彼らはいない」が喪失を表す慣用句であることを、死と明示して解釈を狭めず、自然な現代日本語で表した。
theological_decisions:
- issue: 引用におけるラケルの位置づけ
  choice: ラケルを預言的・母性的な人物としてそのまま残し、象徴の意味を本文中で説明しない
  alternative: ラケルをイスラエルの母たちの象徴と明示する、または文字どおり歴史上の母として説明する
  rationale: 本文はエレミヤ書の引用を通してラケルを提示するだけで、その象徴的関係を明示的には解説していないため、翻訳でもその含みと緊張を保った。
- issue: 「もういない」が示す喪失の性質
  choice: 死を明示せず「もういない」とする
  alternative: 「死んでしまった」と明示する
  rationale: 文脈上は殺された子どもたちを指すが、ギリシア語ὅτι οὐκ εἰσίνの簡潔で婉曲的な表現を保ち、引用本来の響きを残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言の引用らしい簡潔さと厳粛さを保った。詩的な並行表現を伝えるため改行し、過度に古風な語法は避けた。
