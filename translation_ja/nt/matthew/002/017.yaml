  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: ja
  text: その時、預言者エレミヤを通して次のように語られたことが成就した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の時間的な進行を示す副詞として、直前の出来事を受ける自然な日本語とした。
- source_word: ἐπληρώθη
  choice: 成就した
  rationale: マタイに特徴的な成就句の神学的・文学的表現を保つため、受動形の意味を日本語で自然に表す定訳を用いた。
- source_word: τὸ ῥηθὲν
  choice: 語られたこと
  rationale: 冠詞付き受動分詞の名詞的用法を、簡潔で自然な日本語にした。
- source_word: διὰ Ἰερεμίου
  choice: エレミヤを通して
  rationale: 属格を伴うδιάが示す媒介を明示し、預言者を通して言葉が語られたという構造を保った。
- source_word: τοῦ προφήτου
  choice: 預言者エレミヤ
  rationale: エレミヤの役割を示す同格表現を、日本語として自然な語順で訳した。
- source_word: λέγοντος
  choice: こう語られている
  rationale: 直後の引用を導く機能を自然な現代日本語で示した。文法上はエレミヤにかかる「こう言った」とも表せるため、その可能性を脚注に残した。
theological_decisions:
- issue: マタイの成就定型句
  choice: 「成就した」と明示する
  alternative: 「実現した」「成就するために起こった」
  rationale: 本文は出来事を預言の成就として明確に位置づけるが、目的を示す構文ではないため、「成就するため」とは補わない。
- issue: λέγοντοςの係り先と引用導入
  choice: 本文では「こう語られている」として引用内容へ自然につなぐ
  alternative: 「預言者エレミヤがこう言った」
  rationale: ギリシア語では属格分詞がエレミヤに文法的に呼応する一方、引用導入として機能する。本文の自然さを優先しつつ、文法的に明示的な訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。マタイの成就表現を維持し、引用導入は次節へ自然につながるよう整えた。
