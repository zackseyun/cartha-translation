  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: ja
  text: 彼らは王に答えた。「ユダヤのベツレヘムです。預言者を通して、こう書かれている[a]からです：」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「こう書かれたままである」。ギリシア語の完了受動形は、聖書を引用するときの定型表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 彼らは
  rationale: 定冠詞の名詞的用法は前節の祭司長たちと律法学者たちを指す。δέは弱い接続であり、日本語では文脈上あえて訳語を置かないほうが自然である。
- source_word: εἶπαν αὐτῷ
  choice: 王に答えた
  rationale: 直訳は「彼に言った」だが、直前にヘロデ王が問いただしたことへの応答なので「答えた」が自然である。指示対象を明確にするためαὐτῷを「王に」とした。
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: ユダヤのベツレヘムです
  rationale: 属格は同名の町を区別し、ユダヤ地方に属するベツレヘムを示す。「ユダヤの」は原文の簡潔な同定を保つ。補った「です」は質問への返答として自然な現代日本語にする。
- source_word: οὕτως γὰρ
  choice: こう…からです
  rationale: γάρの理由提示を「からです」で表し、οὕτωςが次節の引用内容を前方指示する働きを「こう」で保った。
- source_word: γέγραπται
  choice: 書かれている
  rationale: 完了受動形は、過去に記されて今も権威ある文書として存続することを表す定型的な聖書引用表現である。日本語では「書かれている」がその結果状態を自然に示す。
- source_word: διὰ τοῦ προφήτου
  choice: 預言者を通して
  rationale: διά＋属格の媒介性を明示し、預言者を通して言葉が記されたという原文の表現を保つ。
theological_decisions:
- issue: 預言者による媒介の表現
  choice: 預言者を通して
  alternative: 預言者によって
  rationale: 「を通して」はδιά＋属格の媒介的な含みを保ち、究極的な発信者を明示せずに、預言者が伝達の担い手であることを表す。
- issue: γέγραπταιの完了受動形
  choice: 書かれている
  alternative: 書かれた
  rationale: 単なる過去の執筆行為ではなく、記された言葉が現在も効力を持つという完了形の結果状態を保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「王に」は前節のヘロデ王を明示する文脈的な訳。「です」を用いて祭司長たちと律法学者たちの返答として自然にした。節末は次節の引用へ続くため、コロン相当の「。」ではなく引用導入を示す流れを意識したが、日本語本文では閉じ括弧前に句点を置いた。
