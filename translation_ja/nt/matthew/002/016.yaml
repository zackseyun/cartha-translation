id: MAT.2.16
reference: Matthew 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: ja
  text: その時、ヘロデは、博士たち[b]に欺かれた[a]と知って激しく怒り、人を遣わして、ベツレヘムとその周辺一帯にいた、博士たちから詳しく確かめた時を基準とする二歳以下の男の子を一人残らず殺した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「愚弄された」または「嘲弄された」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 原語は「マゴイ」。東方から来た占星術師・賢者のような人々を指す。伝統的に「博士」または「賢者」と訳される。
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を導く時間的接続を、自然な現代日本語で表した。
- source_word: ἰδὼν ὅτι
  choice: …と知って
  rationale: 単なる視覚ではなく、ヘロデが事態を認識したことを表す分詞句として訳した。
- source_word: ἐνεπαίχθη
  choice: 欺かれた
  rationale: 語義には「嘲弄された」もあるが、ここでは博士たちが戻らなかったため、ヘロデが出し抜かれたという文脈上の意味を明瞭に表す。より字義的な選択肢は脚注に残した。
- source_word: τῶν μάγων
  choice: 博士たち
  rationale: 日本語聖書で広く理解される呼称を用いつつ、原語が東方の占星術や知恵に携わる者を指すことを脚注で明示した。
- source_word: ἐθυμώθη λίαν
  choice: 激しく怒り
  rationale: 怒りを表す動詞と強意の副詞を、簡潔で自然な日本語にした。
- source_word: ἀποστείλας
  choice: 人を遣わして
  rationale: 殺害を実行する者たちを派遣したという文脈上の含意を、日本語で明瞭にした。
- source_word: ἀνεῖλεν
  choice: 殺した
  rationale: ここでの「殺す、除き去る」という直接的な意味を、婉曲化せず表した。
- source_word: πάντας τοὺς παῖδας
  choice: 男の子を一人残らず
  rationale: 文脈上、対象は男児であり、πάνταςの全称的な力を「一人残らず」で表した。
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: ベツレヘムとその周辺一帯
  rationale: ὅριαを境界線そのものではなく、町を取り巻く地域として自然に表した。
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: 二歳以下
  rationale: 二歳を含む上限を、簡潔で明確な日本語にした。
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: 博士たちから確かめた時期に基づき
  rationale: ヘロデが博士たちから詳しく確認した時を基準に年齢を定めたことを表した。
theological_decisions:
- issue: μάγοιの訳語
  choice: 博士たち
  alternative: マゴイたち／占星術の学者たち
  rationale: 本文の読みやすさと日本語での認知度を保ちながら、後代の王のイメージを持ち込まず、歴史文化的な意味は脚注で補った。
- issue: ἐνεπαίχθηの意味
  choice: 欺かれた
  alternative: 嘲弄された／愚弄された
  rationale: 博士たちが戻らず、ヘロデが出し抜かれたという文脈的意味を本文に採り、原語のより字義的なニュアンスは脚注に保存した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。暴力の内容は原文どおり直接的に表現し、ヘロデ自身が派遣した者たちを通して殺害したという統語関係も保った。脚注記号は、それぞれが説明する語の直後に置いた。
