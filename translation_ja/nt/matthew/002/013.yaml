  verdict: revise
  source_fidelity: 「捜し出して殺そうとしている」は、ζητεῖν（捜す）を「捜し出す」と結果まで含めており、また「捜す」と「殺す」の二つを並列した意図のように響く。ギリシア語は「幼子を殺すために捜そうとしている」であり、目的を明示するほうが正確である。
  naturalness: 全体として読みやすい現代標準語である。「去った後」は、この場面で博士たちがその場を離れたことを自然に表し、「帰った後」より文脈に依存しない。
  terminology: 「主の使い」「ヨセフ」「幼子」「エジプト」「ヘロデ」は適切である。「幼子」はやや文語的だが、聖書本文の簡潔な格調と παιδίον の年少性を自然に保つ。
  issues:
  - severity: medium
    issue: 「捜し出して殺そうとしている」
    rationale: ζητεῖνは「捜す」であり、「捜し出す」は発見・捕捉という結果を加える。また τοῦ ἀπολέσαι αὐτό は捜索の目的なので、「殺すために捜そうとしている」とする必要がある。
  - severity: low
    issue: 「彼らが帰った後」
    rationale: ἀναχωρέωはここでは直前の訪問者たちが立ち去ることを表す。「去った後」のほうが、行き先である自国への帰還を本文に補わず、より直接的である。
