id: MAT.2.13
reference: Matthew 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: ja
  text: 彼らが去った後、見よ、主の使いが夢の中でヨセフに現れて言った。「起きて、幼子とその母を連れてエジプトへ逃げ、私が知らせるまで、そこにいなさい。ヘロデは幼子を殺すために捜そうとしているからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: 彼らが帰った後
  rationale: 属格独立構文による先行動作を自然に示す。文脈上「彼ら」は直前の博士たちであり、彼らが自国へ帰ったことを受けて「帰った」とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 突然の神的介入に注意を向ける、マタイの生き生きとした物語標識を保持した。
- source_word: ἄγγελος κυρίου
  choice: 主の使い
  rationale: ἄγγελοςはここでは神から遣わされた天的な使者を指す。冠詞の有無を日本語で不自然に明示せず、κύριοςは「主」とした。
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: 夢の中でヨセフに現れて
  rationale: 歴史的現在のφαίνεταιは日本語の物語として自然な過去の流れで訳し、κατ’ ὄναρを慣用的に「夢の中で」とした。
- source_word: Ἐγερθεὶς παράλαβε
  choice: 起きて、…連れて
  rationale: 分詞Ἐγερθείςは命令の連続として機能するため「起きて」とし、παράλαβεは自分と共に連れて行く意味を表した。
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: 幼子とその母
  rationale: παιδίονを年少の子を示す自然で格調ある「幼子」とし、母がその子の母である関係を明確にした。
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: エジプトへ逃げ
  rationale: φεῦγεの危険と切迫感を「逃げ」で簡潔に保持した。
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: 私が知らせるまで、そこにいなさい
  rationale: 直訳的な「私があなたに言うまで」の意味を、今後の指示を待つ文脈に合う明瞭な日本語で表した。
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: ヘロデが…捜し出して…しようとしているからだ
  rationale: μέλλειと不定詞が表す差し迫った意図を「しようとしている」で示し、ζητεῖνは対象を見つけようとする敵対的探索なので「捜し出して」とした。
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: 殺そうとしている
  rationale: ἀπόλλυμιの基本像は滅ぼすことだが、人である幼子を目的語とするこの文脈では死に至らせる意図を自然かつ明確に表す「殺す」とした。
theological_decisions:
- issue: ἄγγελος κυρίουにおけるκύριοςの訳
  choice: 主
  alternative: 主人
  rationale: 聖書における神の称号として自然な「主」を用い、使いの厳密な身元について本文以上の特定をしない。
- issue: 無冠詞のἄγγελος κυρίουの限定性
  choice: 主の使い
  alternative: ある主の使い／あの主の使い
  rationale: 日本語には冠詞がないため限定・非限定を補わず、ギリシア語が許す含みを保持した。特定の唯一の存在だとも、単に多数のうち一人だとも断定しない。
- issue: ἀπολέσαιが示すヘロデの目的
  choice: 殺そうとしている
  alternative: 滅ぼそうとしている
  rationale: 対象が幼子であるため、ここでは生命を奪う意味が文脈上明確である。抽象的・神学的な「滅ぼす」より普通の読者に直接伝わる表現を選んだ。
translation_notes:
  register: 現代の標準的な日本語を基調にしつつ、物語標識の「見よ」と呼称の「幼子」によって聖書本文にふさわしい簡潔で格調ある調子を保った。命令は明快で切迫した響きにした。
