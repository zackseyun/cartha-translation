  to: 彼らが去った後、見よ、主の使いが夢の中でヨセフに現れて言った。「起きて、幼子とその母を連れてエジプトへ逃げ、私が知らせるまで、そこにいなさい。ヘロデは幼子を殺すために捜そうとしているからだ。」
  rationale: ヘロデの行為について、原文の「捜す」と「殺すために」という目的関係を明確にした。本文がすでに「殺す」と文脈上明白な意味を適切に表しているため、語義説明の脚注は不要とした。冒頭は属格独立構文の先行動作を、余計な行き先を補わずに訳した。
