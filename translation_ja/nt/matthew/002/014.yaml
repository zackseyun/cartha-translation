  rationale: 目的地を伴う移動を自然な現代日本語で表すため、「立ち去った」を「出発した」に改めました。これにより、危険からの逃避という動機を本文に過度に読み込まず、原文の「エジプトへ去った」という移動を保ちます。英語監査訳の脚注は、標識が「got up」に置かれている一方で本文注は目的地表現の代案を述べており、対応が不整合です。しかし、日本語では「エジプトへ／エジプトに」は実質的な訳語選択の注を要しないため、脚注は設けません。
