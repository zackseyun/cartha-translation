id: MAT.2.14
reference: Matthew 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: ja
  text: そこでヨセフは起きて、夜のうちに幼子とその母を連れ、エジプトへ出発した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 弱い接続辞であり、直前の命令を受けて物語を進める。現代日本語では「そこで」が応答と展開の流れを自然に示す。
- source_word: ὁ … ἐγερθεὶς
  choice: ヨセフは起き
  rationale: 分詞は直前の文脈で指示を受けたヨセフの行動を表す。日本語では主語を明示したほうが明瞭であり、「起き」は動作の順序を簡潔に伝える。
- source_word: παρέλαβε
  choice: 連れ
  rationale: ここでは、自分と一緒に人を伴って行くことを意味する。「連れ」が日本語として自然で、単なる「受け取る」との誤解も避けられる。
- source_word: τὸ παιδίον
  choice: 幼子
  rationale: παιδίονは幼い子どもを指す。マタイ2章の文脈に合い、現代日本語でも理解しやすい「幼子」とした。
- source_word: τὴν μητέρα αὐτοῦ
  choice: その母
  rationale: αὐτοῦは幼子を受ける。「その母」とすることで、母がヨセフではなく幼子との関係で示されていることを自然に保つ。
- source_word: νυκτὸς
  choice: 夜のうちに
  rationale: 時を表す属格で、行動が夜間に行われたことを示す。「夜のうちに」は明瞭で自然な現代日本語である。
- source_word: ἀνεχώρησεν
  choice: 立ち去った
  rationale: ἀναχωρέωはその場を離れる、退くという意味を持つ。「立ち去った」は目的地への移動を自然に表しつつ、「逃亡した」など動機の過度な明示を避ける。
- source_word: εἰς Αἴγυπτον
  choice: エジプトへ
  rationale: εἰςは移動の目的地を示す。日本語では「エジプトへ」が簡潔で自然である。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシャ語の出来事の順序を保ちながら、日本語として不自然な分詞構文は連続する動作として訳した。英語相談訳の脚注は「got up」に付された標識と「to Egypt」という本文内容が一致しておらず、また日本語の「へ／に」は意味上の重要な異読ではないため、本文脚注には採用しなかった。
