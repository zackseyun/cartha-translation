  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: ja
  text: 彼らは言った。「ユダヤ人の王としてお生まれになった方は、どこにおられますか。私たちは東で[a]その方の星を見たので、その方に拝礼するために[b]来ました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方の星が昇った時に」。ギリシア語の表現は、「東で」とも、星が「昇る時に」とも理解できる。
    reason: alternative_reading
  - marker: b
    text: 別訳「その方を礼拝するために」。ギリシア語の動詞は、文脈により、王に敬意を表すことも、礼拝することも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 彼らは言った
  rationale: 現在分詞が博士たちの発言内容を導いている。日本語の物語文として自然になるよう、主語を補って定形動詞で表した。
- source_word: Ποῦ ἐστιν
  choice: どこにおられますか
  rationale: 場所を尋ねる直接的な疑問。敬意を帯びた発話として、人物について自然な「おられますか」を用いた。
- source_word: ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων
  choice: ユダヤ人の王としてお生まれになった方
  rationale: 冠詞付き受動分詞を「お生まれになった方」と実体詞的に訳し、「王として」によって、生まれた時から王であるという表現の力を保った。「新しく生まれた」として幼児性を余分に強調することは避けた。
- source_word: εἴδομεν γὰρ
  choice: 私たちは…見たので
  rationale: γάρが問いの理由を示すため、日本語では前文とのつながりが自然な「ので」とした。アオリストは単純な過去「見た」で表した。
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: その方の星
  rationale: 属格代名詞の所有関係を簡潔に示し、その星が具体的にどのような天体現象だったかは限定しない。
- source_word: ἐν τῇ ἀνατολῇ
  choice: 東の方で
  rationale: ἀνατολήには方角としての「東」と天体の「昇ること」の両義がある。本文では伝統的で文脈上可能な地理的表現を採り、天文学的な読みを脚注に残した。
- source_word: ἤλθομεν
  choice: 来ました
  rationale: 話者たちがすでに到着している発話状況を、日本語では自然な過去形で表した。
- source_word: προσκυνῆσαι αὐτῷ
  choice: その方に拝礼するために
  rationale: προσκυνέωは、身をかがめて王に敬意を表すことにも、宗教的な礼拝にも用いられる。「拝礼」は王への崇敬という直近の文脈を自然に表しつつ、行為の深い宗教的含意を排除しない。
theological_decisions:
- issue: 幼子イエスに対する προσκυνῆσαι の訳し方
  choice: その方に拝礼するために
  alternative: その方を礼拝するために
  rationale: 博士たちは「ユダヤ人の王」を捜しているため、直接の文脈は王への敬意である。しかし、この語は神への礼拝にも使われ得る。「拝礼」を本文に置き、「礼拝」を脚注に示すことで、この節だけでキリスト論的含意を一方に限定せず、語の神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、敬意ある発話として整えた。「お生まれになった方」「おられますか」は品位を保ちながら一般読者にも理解しやすい。二つの重要な語義上の曖昧さは本文で一方を選びつつ、脚注で明示した。
