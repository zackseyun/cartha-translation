id: MAT.2.8
reference: Matthew 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: ja
  text: そして彼らをベツレヘムへ遣わして、こう言った。「行って、その子のことを念入りに調べなさい。見つけたら、私も行ってその子を礼拝するために、私に知らせなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέμψας
  choice: 遣わして
  rationale: アオリスト分詞は主動詞「言った」に先立つ行為を示すが、日本語では接続形「遣わして」で順序を自然に表せる。
- source_word: Πορευθέντες
  choice: 行って
  rationale: 後続の命令形と一体となって命令を構成するため、「行って、…調べなさい」とした。
- source_word: ἐξετάσατε ἀκριβῶς
  choice: 念入りに調べなさい
  rationale: ἐξετάζωの詳しく調査する意味と、ἀκριβῶςの正確さ・綿密さを、明瞭な現代日本語で表した。
- source_word: περὶ τοῦ παιδίου
  choice: その子のことを
  rationale: περίはここでは調査の対象を示す。「その子を捜しなさい」よりも、所在などを詳しく調べるという原文の幅を保つ。
- source_word: παιδίου
  choice: その子
  rationale: παιδίονは幼い子を指し得るが、年齢を原文以上に限定せず、文脈上特定された子として自然に訳した。
- source_word: ἐπὰν δὲ εὕρητε
  choice: 見つけたら
  rationale: ἐπάν＋接続法の将来的な条件を、「見つけたら」と自然かつ過度に確定させずに表した。
- source_word: ἀπαγγείλατέ μοι
  choice: 私に知らせなさい
  rationale: 発見後に報告を返す意味を、一般読者に明瞭な表現で示した。
- source_word: ὅπως
  choice: ためだ
  rationale: ヘロデが述べる目的を日本語の自然な目的表現で保持した。
- source_word: κἀγὼ
  choice: 私も
  rationale: καίの付加的な意味を保ち、ヘロデが博士たちと同じ意図を装う言い方を表した。
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: 行って、その子を礼拝する
  rationale: 分詞と接続法を連続する行為として自然に訳した。προσκυνέωの礼拝と王への敬意・ひれ伏しの両義性は脚注で保持した。
theological_decisions:
- issue: 幼子イエスに対する προσκυνήσω αὐτῷ の訳
  choice: その子を礼拝する
  alternative: その子に敬意を表する／その子の前にひれ伏す
  rationale: προσκυνέωは神への礼拝にも、王などへのひれ伏しや敬意にも用いられる。マタイにおけるイエスへの用法が持つ神学的含意を弱めないため本文は「礼拝する」としつつ、この場面だけでは語義を一つに固定できないことを脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「博士たち」など原文にない主語説明は加えず、ヘロデの命令の簡潔さを維持した。「念入りに」はἀκριβῶςの綿密さを自然に伝える。
