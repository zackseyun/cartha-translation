id: MAT.2.11
reference: Matthew 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: ja
  text: 彼らは家に入ると、母マリアと共にいる幼子を見た。そして、ひれ伏して幼子に敬意を表した[a]。それから、自分たちの宝物を納めたものを開き、幼子に贈り物、すなわち黄金、乳香、没薬を差し出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「幼子を礼拝した」。このギリシア語動詞は、文脈により、礼拝することも、深い敬意を示すことも表し得る。
    reason: προσκυνέωが持つ礼拝と恭敬の意味の幅を保持するため。
lexical_decisions:
- source_word: οἰκίαν
  choice: 家
  rationale: 具体的な住居を指す通常の語義を、余分な含意を加えず自然な現代日本語で表した。
- source_word: παιδίον
  choice: 幼子
  rationale: 乳児に限定せず、年若い子どもを指す語義を保つ。文脈にふさわしい品位も備えた表現である。
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: 母マリアと共にいる
  rationale: μετάの「共に」と、マリアが幼子の母であるという同格的説明を明確に表した。
- source_word: πεσόντες
  choice: ひれ伏して
  rationale: 地に身を伏せる身体的動作を、日本語で簡潔かつ鮮明に示した。
- source_word: προσεκύνησαν
  choice: 敬意を表した
  rationale: 王への恭敬にも礼拝にも用いられ得る語の幅を保ち、直前の「ひれ伏して」と合わせて行為の深い崇敬を表した。
- source_word: θησαυροὺς
  choice: 宝の入れ物
  rationale: 「開く」という動作から、宝を収めた容器・収納物を指す文脈上の意味を自然に示しつつ、「宝箱」として形状を限定することを避けた。
- source_word: προσήνεγκαν
  choice: 差し出した
  rationale: 贈り物を相手に献呈する動作を自然に表し、祭儀的な「献げた」に意味を限定しなかった。
- source_word: δῶρα
  choice: 贈り物
  rationale: 祭儀的な供え物と断定せず、贈答品という基本的意味を明瞭に表した。
- source_word: χρυσὸν
  choice: 黄金
  rationale: 金という貴重品を指すことが明確で、列挙にもふさわしい表現とした。
- source_word: λίβανον
  choice: 乳香
  rationale: 一般的な香ではなく、香料樹脂フランキンセンスを指す正確な日本語名称を用いた。
- source_word: σμύρναν
  choice: 没薬
  rationale: ミルラを指す定着した正確な日本語名称を用いた。
theological_decisions:
- issue: 幼子イエスに対する προσκυνέω の訳し方
  choice: 敬意を表した
  alternative: 礼拝した
  rationale: この語は王に対する恭敬と神への礼拝の双方を表し得る。本文では「ひれ伏して敬意を表した」として直近の文脈にある深い崇敬を示しつつ、行為の神学的意味を一方に限定せず、「礼拝した」を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「幼子」「乳香」「没薬」は文脈上正確で定着した語として採用し、προσκυνέω の神学的な含みは本文と脚注を合わせて保持した。脚注記号は、その対象語である「敬意を表した」の直後に置いた。
