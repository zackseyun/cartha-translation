id: MAT.2.4
reference: Matthew 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: ja
  text: そして、民の祭司長たちと律法学者たちを皆集め、メシア[a]はどこで生まれることになっているのかと彼らに尋ねていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語の称号「クリストス」は「油を注がれた者」を意味し、ここではユダヤ人が待ち望んでいたメシアを指す。
    reason: Χριστόςの別訳と、この文脈で「メシア」を採用した理由を示すため。
lexical_decisions:
- source_word: συναγαγὼν
  choice: 集め
  rationale: アオリスト分詞が主動詞に先立つ行為を表す。日本語では連用形により、集めたうえで尋ねるという自然な順序を示した。
- source_word: πάντας
  choice: 皆
  rationale: 祭司長たちと律法学者たちを包括する語として、ギリシア語の全体性を簡潔に保持した。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数の大祭司職在任者ではなく、上級祭司層を指す新約聖書の標準的な表現として訳した。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 単なる書記ではなく、律法の解釈と教授に携わった者たちを指す文脈上の意味を、現代の一般読者に明確に伝える。
- source_word: τοῦ λαοῦ
  choice: 民の
  rationale: 民族名を補わず、属格の簡潔さと原文の表現を保った。語順上、祭司長たちと律法学者たちの双方に自然にかかる。
- source_word: ἐπυνθάνετο
  choice: 尋ねていた
  rationale: 未完了過去の継続的・進行的な問いかけを「ていた」で表した。
- source_word: παρ’ αὐτῶν
  choice: 彼らに
  rationale: 日本語の「尋ねる」が要求する自然な格を用い、彼らから情報を得ようとした意味を保った。
- source_word: ὁ χριστὸς
  choice: メシア
  rationale: ここでは固有名ではなく、ユダヤ的な待望の油注がれた王を指す称号として機能しているため、「メシア」とした。
- source_word: γεννᾶται
  choice: 生まれることになっている
  rationale: 現在受動形を、預言によって定められ期待されている出生地を問う間接疑問として自然に表現した。単純な未来に決めつけず、予定・定めの含みを保持する。
theological_decisions:
- issue: 称号 Χριστός の訳し方
  choice: メシア
  alternative: キリスト
  rationale: ヘロデがユダヤの預言に基づいて待望される油注がれた支配者の出生地を問う場面なので、称号としての意味が明瞭な「メシア」を本文に採用した。「キリスト」という伝統的表記も脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた文体を保った。原文で主語が明示されていないため「ヘロデ」を補わず、前後の文脈に接続する「そして」で始めた。
source_grounding:
  english_pob_role: consult_only
