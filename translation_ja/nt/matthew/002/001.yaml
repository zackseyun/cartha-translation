id: MAT.2.1
reference: Matthew 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: ja
  text: ヘロデ王の時代、イエスがユダヤのベツレヘムでお生まれになった後、見よ、東方から博士たち[a]がエルサレムにやって来て、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「マギたち」。ギリシア語は、占星術や宮廷の知識と関わりのある、東方の学識者を指す。
    reason: μάγοιの技術的な別訳と語義の範囲を示し、「博士」を現代の学位名称として限定的に理解させないため。
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: イエスが……お生まれになったのは
  rationale: 属格独立構文が主動詞に先立つ背景事情を示すことを踏まえ、日本語では後続の時代設定と自然につながる形にした。δὲは弱い叙述上の移行であり、独立した「さて」を補わなかった。
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: ユダヤのベツレヘム
  rationale: 同名の町を区別する属格を簡潔かつ自然に表した。
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: ヘロデ王の時代であった
  rationale: 歴史的時期を示す慣用句を、現代日本語として明瞭で品位のある表現にした。
- source_word: ἰδοὺ
  choice: すると、見よ
  rationale: 後続の登場に注意を向ける談話標識としての強調を保持した。「すると」で場面展開も自然に示した。
- source_word: μάγοι
  choice: 博士たち
  rationale: 東方の学識者・占星術者を指す語として、日本語聖書読者にも通じやすい伝統的表現を採用した。ただし現代の学位取得者という意味に限定されないことを脚注で明示した。
- source_word: ἀπὸ ἀνατολῶν
  choice: 東方から
  rationale: 複数形が表す東の地域・地方からの来訪を、日本語の慣用的な集合表現で訳した。
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: エルサレムにやって来て
  rationale: 到着・登場を表す動詞と方向を表す前置詞句を自然な日本語にした。文が次節へ続く構文であるため連用形で結んだ。
theological_decisions:
- issue: μάγοιを後代の伝承を持ち込まずに訳すこと
  choice: 博士たち
  alternative: 占星術の学者たち／マギたち
  rationale: 原文は人数や王の身分を示していないため、それらを加えなかった。「博士」は役割を広く伝え、占星術や宮廷的知識との関連は脚注で補った。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「見よ」で原文の注意喚起を保った。「お生まれになった」はイエスへの自然な敬意を示す一般的な日本語表現。節末は2節へ続く原文の統語を反映して読点で終えた。
