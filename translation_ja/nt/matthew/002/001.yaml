revisions:
- from: イエスがユダヤのベツレヘムでお生まれになったのは、ヘロデ王の時代であった。すると、見よ、東方から博士たち[a]がエルサレムにやって来て、
  to: ヘロデ王の時代、イエスがユダヤのベツレヘムでお生まれになった後、見よ、東方から博士たち[a]がエルサレムにやって来て、
  rationale: 出生を主節への時間的背景として復し、「ヘロデ王の時代」が出生を修飾する関係を明確にした。「見よ」によりἰδούの際立った注意喚起を保ち、原文に明示されない「すると」は省いた。節末の連用形と読点は次節への継続を保持している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:13Z'
review_pass:
  verdict: revise
  source_fidelity: 属格独立構文（「イエスが…生まれた後／時」）と「ヘロデ王の時代」という出生時の時代設定が、草案では「…お生まれになったのは、…時代であった」という独立文に組み替えられている。そのため主節の到来との時間的・統語的関係が弱くなっている。また「すると」は、原文のδέとἰδούの注意喚起を超えて、明示的な順次展開を加えやすい。
  naturalness: 「ヘロデ王の時代、イエスが…お生まれになった後、見よ、…」は、原文の背景設定と主節を保ちながら、明瞭な現代標準語として読める。「博士たち」は定着した訳語だが現代語では学位を想起させ得るため、脚注で技術的な語義を明示する。
  terminology: 固有名詞「ユダヤのベツレヘム」「ヘロデ王」「エルサレム」は適切。「博士たち」は本文で許容できるが、μάγοιを単に現代的な博士号取得者と理解させない脚注が必要である。人数や王位を原文が述べないことを注記する必要はなく、語義注に絞る。
  issues:
  - severity: medium
    issue: 属格独立構文と時代設定の統語関係が組み替えられている。
    rationale: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως は、主節「マギたちがエルサレムに来た」に対する背景的な時間節である。出生を「ヘロデ王の時代であった」という独立した叙述にすると、この関係が不明瞭になる。
  - severity: low
    issue: 「すると」が明示的な順次・結果の含みを加える。
    rationale: δέは弱い接続であり、ἰδούは注意喚起である。ここでは「見よ」だけで原文の標識を保てるため、「すると」は加えないほうが節度がある。
  - severity: low
    issue: 脚注が語義注の範囲を超えて後代伝承への注意を本文外で詳述している。
    rationale: 人数や王位を原文が記さないこと自体は正しいが、この箇所の語義注としては「マギ」とそのおおまかな歴史的・職能的指示を示せば十分であり、英語POBの監査記録にも整合する。
