id: MAT.23.39
reference: Matthew 23:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: ja
  text: というのも、わたしはあなたがたに言います。今から、あなたがたが「主の名によって来られる方に、祝福があるように」[a]と言う時まで、あなたがたは決してわたしを見ることはありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 詩篇118:26からの引用、またはそれを踏まえた表現。
    reason: cross_reference
  - marker: b
    text: ギリシア語は強い否定（οὐ μή）を用いている。語順に沿って、「あなたがたは、今から『……』と言う時まで、決してわたしを見ることはありません」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: わたしはあなたがたに言います
  rationale: λέγω＋与格の直接呼びかけを、現代日本語として自然かつ荘重に表した。γάρの説明的なつながりは、直前の文脈から明らかなため、独立した接続語を補わずに示した。
- source_word: οὐ μή
  choice: 決して～ありません
  rationale: アオリスト接続法とともに用いられた強い否定を、過度に口語的な「絶対に」ではなく、明瞭で荘重な「決して」で表した。
- source_word: ἴδητε
  choice: 見る
  rationale: ὁράωの通常の意味を保ち、解釈を加えずに訳した。
- source_word: ἀπ’ ἄρτι
  choice: 今から
  rationale: 発話時点を起点とする時間表現を、簡潔で自然な現代日本語にした。
- source_word: ἕως ἂν εἴπητε
  choice: あなたがたが～と言う時まで
  rationale: ἕως ἄν＋接続法が示す将来の到達点を明確にしつつ、その時点や出来事を特定しない表現とした。
- source_word: Εὐλογημένος
  choice: 祝福があるように
  rationale: 引用句の祝福・称賛の宣言を自然な日本語で表し、詩篇118:26との響きを保った。
- source_word: ὁ ἐρχόμενος
  choice: 来られる方
  rationale: 冠詞付き分詞を敬意ある自然な日本語で表し、「来たるべき方」という称号的解釈を訳文に持ち込まないようにした。
- source_word: ἐν ὀνόματι κυρίου
  choice: 主の名によって
  rationale: ἐνの手段・権威・関係を含み得る幅を保つ定着した表現を採用し、κύριοςを「主」とした。
theological_decisions:
- issue: 今後再び見る時と告白の意味
  choice: 引用された祝福の言葉を語る時までイエスを見ないという厳粛な宣言として訳し、その時点を特定しない
  alternative: 凱旋入城、再臨、またはイスラエルの将来の悔い改めのいずれかに限定する
  rationale: 本文は将来の到達点を述べるが、その具体的な歴史的・終末論的出来事を明示していないため、解釈上の緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言にふさわしい荘重さを保った。引用句は聖書的な響きを残しつつ、古語的な表現を避けた。
