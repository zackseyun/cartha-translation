id: MAT.23.28
reference: Matthew 23:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: ja
  text: 同じように、あなたがたも、外側は人々に正しい者と見えますが、内側は偽善と不法で満ちています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: 同じように
  rationale: 直前の白く塗った墓の比喩との比較を明確に結び付ける、自然な現代日本語。
- source_word: ἔξωθεν ... ἔσωθεν
  choice: 外側は……内側は
  rationale: 外観と内実の鮮明な対比を簡潔に保つ。
- source_word: φαίνεσθε τοῖς ἀνθρώποις δίκαιοι
  choice: 人々に正しい者と見えます
  rationale: 人の目にはそう見えるという意味を示し、実際に正しいと認定しているとの誤解を避ける。τοῖς ἀνθρώποιςは性別を限定しない一般的な「人々」とした。
- source_word: μεστοὶ
  choice: 満ちています
  rationale: 形容詞の「いっぱいである」という状態を、自然で格調ある日本語で表す。
- source_word: ὑποκρίσεως
  choice: 偽善
  rationale: 外面と内面の不一致を非難する文脈に即した、定着した訳語。
- source_word: ἀνομίας
  choice: 不法
  rationale: 単なる一般的な悪ではなく、律法に背くことを含む語義を保持する。
theological_decisions:
- issue: δίκαιοιが実際の義を指すか、人の目に映る外見上の義を指すか
  choice: 人々には正しい者と見えるという外見上の義
  alternative: 実際に正しい者である
  rationale: φαίνεσθεと、内側は偽善と不法で満ちているという対比により、人から見た印象が語られている。
translation_notes:
  register: 明瞭な現代標準語を用い、糾弾の厳粛さを保った。「義人」より一般読者に分かりやすい「正しい者」を採用し、外側と内側の対照を語順でも明示した。
