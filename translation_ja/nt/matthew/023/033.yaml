id: MAT.23.33
reference: Matthew 23:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: ja
  text: 蛇ども、まむしの子らよ！ おまえたちは、どうしてゲヘナ[a]の裁きを逃れられるだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地獄の裁き」。ギリシア語は「ゲヘナ」。
    reason: 原語の固有性を本文に残しつつ、一般的な訳語を示すため。
lexical_decisions:
- source_word: ὄφεις
  choice: 蛇ども
  rationale: 複数の呼びかけであることと、直接的で厳しい比喩的非難を、現代日本語で自然に伝える。
- source_word: γεννήματα
  choice: 子ら
  rationale: 「生まれたもの、子孫」を表す語。後続する属格と合わせて「まむしの子ら」とし、簡潔で力強い表現にした。
- source_word: ἐχιδνῶν
  choice: まむし
  rationale: 一般的な蛇ではなく毒蛇を指す語であり、日本語で通じやすい具体的な毒蛇名を用いた。
- source_word: πῶς
  choice: どうして
  rationale: 逃れる方法ないし可能性を問う修辞疑問の力を保ちつつ、自然な現代日本語にした。
- source_word: φύγητε
  choice: 逃れられるだろうか
  rationale: 「逃げる、逃れる」の意味と、将来を見据えた修辞疑問の含みを表す。単なる能力とも単なる未来とも断定しすぎない表現である。
- source_word: κρίσεως
  choice: 裁き
  rationale: 司法的な判定を表す広い語義を保ち、「刑罰」や「有罪判決」と限定しすぎない。
- source_word: γεέννης
  choice: ゲヘナ
  rationale: ユダヤ的・終末論的背景を持つ固有の用語を音写し、後代の「地獄」に伴う意味を本文へ一律に持ち込まない。一般的な訳語は脚注に示す。
theological_decisions:
- issue: γέενναの訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: 原語固有の歴史的・終末論的含意を保つため本文では音写した。「地獄」という一般的な理解も脚注に残し、読者の理解を助ける。
- issue: 修辞疑問の可能性表現
  choice: どうして……逃れられるだろうか
  alternative: どうやって……逃れるのか
  rationale: πῶςと接続法の組み合わせが持つ、将来の逃避の可能性を厳しく問いただす響きを保つ。ただし、逃れられないという結論を平叙文として明示して原文以上に断定することは避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、原文の厳しい直接的な非難を弱めないため「蛇ども」「おまえたち」とした。一方、「裁き」は原語の幅を保ち、解釈的に強すぎる「刑罰」「有罪判決」は避けた。
