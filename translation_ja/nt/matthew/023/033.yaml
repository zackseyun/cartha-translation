  source_fidelity: 「蛇ども、まむしの子らよ」はὄφεις γεννήματα ἐχιδνῶνの複数の呼びかけと痛烈な比喩的非難を保っている。「まむし」はἐχίδνα（毒蛇・まむし）の自然で定着した日本語の対応語である。「どうして……逃れられるだろうか」はπῶς φύγητεの将来に向けた修辞疑問を適切に表し、「ゲヘナの裁き」はτῆς κρίσεως τῆς γεέννηςを過度に解釈せずに訳している。
  naturalness: 明瞭な現代標準日本語として自然であり、厳しい呼びかけの調子も十分に保たれている。「蛇ども」「おまえたち」はこの文脈の非難にふさわしく、不必要に古風ではない。
  terminology: 「裁き」はκρίσιςの広い司法的・終末論的意味を保つ。「ゲヘナ」はγέενναの固有の歴史的・ユダヤ的背景を本文で保持しており、「地獄」を脚注に置く処理も英語POBの監査方針と整合する。脚注アンカー[a]も本文中の「ゲヘナ」に適切に対応している。
