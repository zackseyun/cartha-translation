id: MAT.23.23
reference: Matthew 23:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: ja
  text: 災いだ、律法学者とファリサイ派の人たち、偽善者たちよ。あなたがたは、ミント、ディル、クミンの十分の一を納めていながら、律法のより重要なこと、すなわち公正、あわれみ、信仰[a]をおろそかにしている。これらを行うべきだったし、あれらもおろそかにすべきではなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さ」とも訳せる。ギリシア語は、信仰、信頼、忠実さを表し得る。ここでは倫理的な文脈から、「忠実さ」と理解されることも多い。
    reason: πίστις はこの倫理的三項では「忠実さ」を意味し得るため、本文の「信仰」と併せて別解を示す。
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言者的な糾弾と裁きの響きを保ちつつ、現代日本語で明確にした。単なる悲嘆を表す「ああ」より強い表現である。
- source_word: γραμματεῖς
  choice: 律法学者
  rationale: 福音書の文脈で、聖書と律法の解釈・教授に携わった人々を現代の読者に分かりやすく示す。「書記官」では職務が狭く受け取られやすい。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: ここでは演技者という語源的意味ではなく、宗教的外面と内実の不一致を責める倫理的意味で用いられている。
- source_word: ἀποδεκατοῦτε
  choice: 十分の一を納めている
  rationale: 律法に基づく十分の一の献納を具体的かつ自然な日本語で表した。
- source_word: τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον
  choice: ミント、ディル、クミン
  rationale: 三種の香草・香辛料を、現代日本語で一般に認識されやすい名称によって訳した。
- source_word: ἀφήκατε
  choice: なおざりにしている
  rationale: 意図的か否かを過度に限定せず、「脇に置く、怠る」という文脈上の意味を自然に表した。
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: 律法の中でより重要なこと
  rationale: 直訳的な「より重いこと」が持つ重要度の比喩を、誤解の少ない現代日本語で明示した。
- source_word: κρίσιν
  choice: 公正
  rationale: 倫理的な三項の一つとして、裁判行為そのものよりも正義にかなった扱いを指すため、「公正」とした。
- source_word: ἔλεος
  choice: あわれみ
  rationale: 困窮する者への慈悲深い応答を示す聖書的用語として、平明で広く理解できる表現を選んだ。
- source_word: πίστιν
  choice: 信仰
  rationale: 語の基本的な幅を保つ訳として本文では「信仰」とし、この倫理的文脈で有力な「信実」を脚注に示した。
- source_word: ταῦτα ... κἀκεῖνα
  choice: これらは……あれらも
  rationale: 「これら」は公正・あわれみ・信仰を、「あれら」は香草の十分の一を指すという原文の対照を保った。
theological_decisions:
- issue: 倫理的な三項における πίστις の意味
  choice: 信仰
  alternative: 信実
  rationale: πίστις は信仰・信頼・誠実さの意味領域を持つ。本文では一般的な訳語「信仰」を維持しつつ、この箇所では神や人に対する誠実さ、契約への忠実さを指す可能性があるため、脚注で「信実」を示して曖昧さを残した。
- issue: 細かな十分の一の実践と律法の重要事項との関係
  choice: 重要事項を行うべきであり、細かな実践もなおざりにすべきではなかった
  alternative: 重要事項だけが要求され、細かな実践は退けられる
  rationale: 原文は香草の十分の一そのものを否定せず、優先順位を正しながら両方を行うよう述べるため、その緊張関係を保持した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。呼びかけと「災いだ」によって原文の厳しい糾弾を保ち、香草名には現代の一般的なカタカナ表記を用いた。「これら／あれら」の対照を残して、重要事項と細かな実践の双方に言及する原文の論理を保った。
