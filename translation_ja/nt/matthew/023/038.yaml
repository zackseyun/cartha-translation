id: MAT.23.38
reference: Matthew 23:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: ja
  text: 見よ、あなたがたの家[a]は、荒れ果てたまま、あなたがたに残される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの神殿」とも考えられる。文脈上、「家」は特に神殿を指す可能性があるが、ギリシア語の表現自体はより広い。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す語であり、この箇所の厳粛な宣告の調子を保つため、「見なさい」より簡潔で格調のある「見よ」とした。
- source_word: ἀφίεται
  choice: 残される
  rationale: 現在受動形を保ち、家がそのまま残されるという意味を表した。「見捨てられる」も可能だが、行為者や見捨てるという含意を本文以上に明示するため避けた。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 与格を明示し、その家が彼らに残されるというギリシア語の構文を保った。
- source_word: ὁ οἶκος ὑμῶν
  choice: あなたがたの家
  rationale: 字義どおり「あなたがたの家」とし、神殿、エルサレム、イスラエルの家など、文脈上あり得る指示対象を本文で一つに限定しなかった。
- source_word: ἔρημος
  choice: 荒れ果てたまま
  rationale: 人が去って寂れ、荒廃した状態を表す預言的な響きを自然な日本語で示した。「空の」では意味が弱く、「廃墟となって」では物理的破壊に狭めすぎるため、この表現を選んだ。
theological_decisions:
- issue: 「あなたがたの家」が指すもの
  choice: 本文では「あなたがたの家」として広さを保つ
  alternative: 「あなたがたの神殿」「エルサレム」「イスラエルの家」と特定する
  rationale: 直前の文脈からはエルサレム、とりわけ神殿が強く示唆されるが、原文の οἶκος はより広い表現である。指示対象を本文で狭めず、預言的な比喩と神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、裁きの宣告にふさわしい厳粛さを「見よ」で保った。「荒れ果てたまま」を用いて、自然さと原文の述語的な意味を両立させた。
