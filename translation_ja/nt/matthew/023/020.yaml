  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: ja
  text: したがって、祭壇にかけて誓う者は、祭壇と、その上にあるすべてのもの[a]にかけて誓うのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は一つの「供え物」だけに限定せず、祭壇の上にあるすべてのものを指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: したがって、…誓う者は
  rationale: οὖνを前の議論から導かれる結論として「したがって」と訳した。冠詞付きアオリスト分詞は特定の一人ではなく一般的な人を指すため、「誓った者」ではなく、一般原則を自然に表す「誓う者」とした。
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: 祭壇にかけて
  rationale: ἐνはここでは場所を表すのではなく、ὀμνύωとともに誓いの対象を示す。「祭壇によって」よりも、現代日本語の誓いの表現として自然な「祭壇にかけて」とした。
- source_word: ὀμνύει ἐν αὐτῷ
  choice: 祭壇…にかけて誓うのである
  rationale: αὐτῷの指示対象を明確にするため、日本語では代名詞「それ」を避けて「祭壇」を繰り返した。現在形の一般的・原則的な意味を保ち、「のである」で論証上の結論を示した。
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: と、その上にあるすべてのものにかけて
  rationale: πᾶσι τοῖς ἐπάνω αὐτοῦは、祭壇の上にあるものを包括的に指す。直前の文脈にある供え物だけに限定せず、原文の広がりを保った。
theological_decisions:
- issue: 「祭壇の上にあるすべてのもの」の範囲
  choice: 祭壇上のもの全般を指す包括的な表現とし、本文では限定しない。
  alternative: 「祭壇の上の供え物すべて」または「祭壇より上にあるすべてのもの」
  rationale: 18–19節では祭壇と供え物が対比されるが、本節のギリシア語は単数の「供え物」より広い。供え物に限定する解釈を本文へ持ち込まず、同時に空間的な「祭壇より上方」という不自然な理解も避けた。
translation_notes:
  register: 明瞭で現代的ながら、論証を述べる場面にふさわしい格調を保った。「にかけて誓う」は誓いの定型として自然であり、「のである」は前節までの議論を受けた結論の響きを伝える。
