  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: ja
  text: また、神殿にかけて誓う者は、神殿にかけて、またそこに住んでおられる方にかけて誓っているのである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「神殿の中で誓う者は、その中で、また神殿に住んでおられる方の中で誓っている」。ここで「〜の中で」に当たるギリシア語は、誓いの表現では「〜にかけて」の意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: 誓う者
  rationale: 冠詞付きアオリスト分詞を一般的・実質的に捉え、特定の男性に限定せず、だれであれ誓う人を指す自然な日本語とした。
- source_word: ἐν τῷ ναῷ
  choice: 神殿にかけて
  rationale: ἐν の基本義は「〜の中で」だが、ここでは誓いの対象を示す定型表現であり、日本語の誓言として自然な「〜にかけて」とした。
- source_word: ναῷ
  choice: 神殿
  rationale: ναός は神殿、特に聖所を指し得るが、文脈上はエルサレム神殿を指すため、一般読者に明瞭な「神殿」とした。
- source_word: ὀμνύει
  choice: 誓っているのである
  rationale: 現在形が表す一般原則を示しつつ、前件の誓いが実際には何を伴うかを説明する文の力を自然な日本語で表した。
- source_word: ἐν αὐτῷ
  choice: 神殿…にかけて
  rationale: 代名詞を日本語で単に「それ」とせず先行詞を明確に補い、誓いの定型表現として訳した。
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: そこに住んでおられる方
  rationale: 現在分詞の継続的な意味と神殿における神の臨在を保った。「おられる方」という敬語により神を指すことを自然に示しつつ、本文に固有名を補わなかった。
theological_decisions:
- issue: 神殿に住む方の同定
  choice: 「そこに住んでおられる方」とし、神を指すことを敬語で示す
  alternative: 「そこに住む者」として指示対象をより暗示的に保つ
  rationale: 文脈では神殿に住まわれる神が明確な指示対象である。ただし原文はθεόςを明記せず分詞表現を用いるため、「神」と明示的に補わず、その表現を保持した。
- issue: 誓いにおけるἐνの解釈
  choice: 「〜にかけて」と訳す
  alternative: 字義どおり「神殿の中で…その中で」と訳す
  rationale: 直前から続く誓言の並行構造では、ἐν は場所ではなく、誓いにおいて持ち出される対象を示す。それでも字義的可能性は脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「また」で前後の並行した教えとのつながりを示し、「のである」で一般原則を説明する調子を保った。神への敬意は敬語で表し、原文にない神名は本文へ補っていない。
