id: MAT.23.10
reference: Matthew 23:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: ja
  text: また、指導者と呼ばれてはならない。あなたがたの指導者はただ一人、メシア[a]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: また、…てはならない
  rationale: 直前から続く禁止であることを「また」で示しつつ、単独の節としても自然な日本語にした。
- source_word: κληθῆτε
  choice: 呼ばれてはならない
  rationale: 受動形を保ち、称号としてそう呼ばれることを禁じる表現とした。
- source_word: καθηγηταί / καθηγητής
  choice: 指導者
  rationale: 導き教える者を表す語であり、近接文脈の「教師」に相当する διδάσκαλος と区別しながら、現代日本語で分かりやすい語を選んだ。単数・複数とも同じ語で対応させた。
- source_word: ὅτι
  choice: だからである
  rationale: 禁止の理由を明示する接続関係を自然で格調ある日本語にした。
- source_word: ὑμῶν ἐστιν εἷς
  choice: あなたがたの…はただ一人
  rationale: 所有関係と「一人」の強調を保ち、自然な日本語の述語構造にした。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 定冠詞を伴い称号として機能しているため、ユダヤ的な「油注がれた者」という称号性が伝わる「メシア」とした。
theological_decisions:
- issue: Χριστός の訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは人名の一部というより称号として用いられているため「メシア」を本文に採用し、日本語で定着した別表記「キリスト」を脚注に示した。
- issue: 唯一の καθηγητής の表現
  choice: 指導者はただ一人
  alternative: 指導者は一人である
  rationale: εἷς の排他的な強調を明瞭にしつつ、その唯一の者がメシアであるという同格関係を保持した。
translation_notes:
  register: 明瞭な現代標準日本語。命令の厳粛さを保つため「ならない」「だからである」を用い、過度に古風な表現は避けた。
