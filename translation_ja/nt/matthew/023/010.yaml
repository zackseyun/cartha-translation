  naturalness: 「また、指導者と呼ばれてはならない。あなたがたの指導者はただ一人、メシアだからである。」は明瞭で自然な現代標準日本語であり、教えの厳粛な調子にも適している。後半は簡潔ながら、「ただ一人」と「メシア」の同格関係、および禁止の理由を無理なく表している。
