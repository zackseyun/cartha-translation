base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: ja
  text: 律法学者たち、ファリサイ派の人たち、偽善者たちよ、あなたがたに災いがある。[a] あなたがたは、やもめたちの家を食い尽くし、見せかけのために長い祈りをする。だから、あなたがたはより重い裁きを受ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、シナイ写本とバチカン写本を含む最も初期のギリシア語写本や初期のコプト語訳にはありませんが、ビザンティン系の多数の写本、古ラテン語訳、ウルガタ訳、シリア語訳にはあります。後代の写字生が、マルコ12章40節およびルカ20章47節の類似した言葉に合わせて加えた可能性があります。この節を含む写本でも、13節の前に置くものと後に置くものがあります。
    reason: textual_critical
lexical_decisions:
- source_word: Οὐαί
  choice: 災いだ
  rationale: 警告と断罪を表す定型的な嘆声。現代日本語として明瞭でありながら、原文の厳粛さを保つ。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: ユダヤ教の律法の解釈・教授に携わった集団を、現代の読者に分かりやすく示す。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: 外面と実態の食い違いを非難する呼びかけとして、一般に理解しやすい定訳を採用した。
- source_word: κατεσθίετε τὰς οἰκίας τῶν χηρῶν
  choice: やもめたちの家を食い尽くし
  rationale: 「家」は家屋だけでなく家産・暮らしを含み得る。搾取の激しさを示す原文の比喩を保持し、意味を一義的に限定しない。
- source_word: προφάσει
  choice: 見せかけに
  rationale: 長い祈りが真の信心ではなく、搾取を覆い隠す外面的な口実であることを簡潔に表す。
- source_word: μακρὰ προσευχόμενοι
  choice: 長い祈りをする
  rationale: 分詞句を自然な日本語の述語として訳し、祈りの長さを強調する原文を保つ。
- source_word: περισσότερον κρίμα
  choice: より重い有罪判決
  rationale: 比較級の強さと、文脈上否定的・刑罰的な κρίμα の意味を明示する。「裁き」より結果の有罪性が伝わる。
theological_decisions:
- issue: 「より重い有罪判決」が何との比較か
  choice: 比較対象を補わず、「より重い」とした
  alternative: ほかの人々より厳しい罰を受ける
  rationale: 原文は比較対象を明示していないため、神学的説明を本文に付加せず、比較の開放性を保った。
- issue: やもめの「家」の意味
  choice: 比喩を保って「家」とした
  alternative: 財産を奪う／生活を食い物にする
  rationale: οἰκίας は家屋、家産、世帯・暮らしを含み得るため、一つの解釈に狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、預言者的な断罪の厳粛さを保った。「やもめ」は聖書で定着した語だが、現代読者にも意味が通じる範囲と判断した。本文は指定されたビザンティン本文を訳し、節全体の本文批評上の問題は脚注で明示した。
