source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: ja
  text: 目の見えない者たちよ。では、供え物[a]と、その供え物を聖なるものにする祭壇とでは、どちらのほうが重要なのか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「贈り物」。ここでは祭壇にささげる物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: 目の見えない者たちよ
  rationale: 呼格の複数形を直接の呼びかけとして訳した。「愚かで目の見えない者たち」とはせず、本文にない μωροί を補わない。
- source_word: τί γὰρ μεῖζον
  choice: では、……どちらが上なのか
  rationale: 比較疑問の τί と μεῖζον を自然な日本語で保ち、γάρ の説明的なつながりを「では」で示した。「重要か」よりも、原文の比較表現を直接に残す。
- source_word: τὸ δῶρον
  choice: 供え物
  rationale: δῶρον の基本義は「贈り物」だが、ここでは祭壇にささげるものを指すため、神殿祭儀の文脈に自然な「供え物」とした。一般的な「贈り物」の意味も注で示す。
- source_word: θυσιαστήριον
  choice: 祭壇
  rationale: 祭儀的文脈における標準的で明瞭な訳語。
- source_word: τὸ ἁγιάζον
  choice: 聖なるものにする
  rationale: 現在分詞が祭壇を修飾し、祭壇が供え物を聖なるものにする働きを表す。「聖別する」より一般読者に分かりやすく、ἁγιάζω の聖性付与の意味を明示する。
theological_decisions:
- issue: 祭壇と供え物の関係を表す ἁγιάζω の祭儀的意味
  choice: その供え物を聖なるものにする祭壇
  alternative: その供え物を聖別する祭壇
  rationale: 祭壇が供え物に聖性を与えるという議論の論理を保った。「聖別する」も可能だが、現代の一般読者により直接伝わる表現を選んだ。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある直接的な叱責として訳した。短い修辞疑問の力を保ちつつ、祭儀用語は一般読者にも理解できる表現にした。
