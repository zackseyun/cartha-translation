  text: φιλοῦσι ⸀δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: ja
  text: また彼らは、宴会では上席[a][c]を、会堂では上座[b]を好む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上席」は、古代の正式な食事で最も名誉ある横臥席を指す。「食卓での最上位の席」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「上座」は、地位や序列が最も高い人のための席を意味する。「首席」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 古代地中海世界の宴会では、席順によって人の名誉や序列が目に見える形で示された。ここで問題にされているのは、単なる快適さではなく、人前で高い地位を得ようとする姿勢である。
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: 好む
  rationale: ここでは神学的な「愛」ではなく、強い好みや執着を表す。「好む」は現代日本語として自然で、批判的な文脈にも適する。
- source_word: δὲ
  choice: また
  rationale: 前節から彼らの振る舞いを続けて列挙する、弱い接続を表す。強い逆接にはしない。
- source_word: τὴν πρωτοκλισίαν
  choice: 上席
  rationale: 古代の正式な食事で最も名誉ある横臥席を指す。「上席」は社会的な序列と名誉を簡潔に伝え、単なる座り心地のよい席という誤解を避ける。ギリシア語は単数形だが、一般的な習慣を述べる日本語として自然である。
- source_word: ἐν τοῖς δείπνοις
  choice: 宴会では
  rationale: δεῖπνον は夕食・正式な食事を指し、この文脈では人前で名誉の序列が示される会食であるため、「宴会」が意味を明確に伝える。
- source_word: τὰς πρωτοκαθεδρίας
  choice: 上座
  rationale: 会堂内で地位や優先性の最も高い席を指す。「上座」は高い身分と公的な名誉を表す自然な日本語である。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 会堂では
  rationale: ユダヤ人の集会・礼拝の場を指す定着した聖書語「会堂」を用い、場所を対比的に示す。
