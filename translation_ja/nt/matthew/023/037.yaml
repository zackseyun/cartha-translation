reference: Matthew 23:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: ja
  text: エルサレム、エルサレム、預言者たちを殺し、エルサレムに遣わされた者たちを石で打ち殺す者よ。めんどり[a]がひなを翼の下に集めるように、わたしは何度、あなたの子らを集めようと願ったことか。それなのに、あなたがたは願わなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「めんどり」と訳した語は、より一般に「鳥」を意味することもある。しかし、ひなを翼の下に集める文脈では、めんどりを指すと理解するのが自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: エルサレム、エルサレム
  rationale: 地名の反復を保ち、呼びかけに込められた強調と嘆きを表した。
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: 預言者たちを殺し、…石で打ち殺す者よ
  rationale: 二つの現在分詞が示す特徴的・反復的な行為を並行して表し、呼格として自然な「者よ」とした。λιθοβολέω は単に石を投げることではなく、石打ちによって殺す文脈なので「石で打ち殺す」とした。
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: 自分に遣わされた人々
  rationale: 完了受動分詞の意味を自然な日本語で示した。女性単数代名詞は擬人化されたエルサレムを指すため、「自分に」としてその関係を保った。
- source_word: ποσάκις ἠθέλησα
  choice: わたしは何度…願ったことか
  rationale: ποσάκις の感嘆的な嘆きと、θέλω の意志・願望を自然な現代日本語で表した。
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: あなたの子らを集めようと
  rationale: 都市とそこに属する人々との親子の比喩を保ち、住民などと限定的に解釈しなかった。
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: めんどりがひなを翼の下に集めるように
  rationale: ὄρνις は一般に鳥も意味し得るが、自分のひなを翼の下に集める母鳥の像なので、文脈に即して「めんどり」とした。前後の同じ動詞 ἐπισυνάγω はともに「集める」として語彙的対応を保った。
- source_word: καὶ οὐκ ἠθελήσατε
  choice: それなのに、あなたがたは願わなかった
  rationale: 単数の都市への呼びかけから複数形へ移る原文の転換を「あなたがた」で明示し、先の ἠθέλησα と同じ「願う」を用いて意志の対照を保った。καί は文脈上の逆接を「それなのに」で表した。
theological_decisions:
- issue: イエスの願いとエルサレム側の拒絶との意志的対照
  choice: 両方の θέλω を「願う」で対応させ、現実の意志の対照を保つ。
  alternative: 一方を「決定した」などの決定論的表現にする、または単なる感情的な嘆きとして意訳する。
  rationale: 本文は「わたしは願った」と「あなたがたは願わなかった」を鋭く対置している。神の意志、人間の責任、キリスト論をめぐる体系的結論を訳文に持ち込まず、その緊張をそのまま示した。
- issue: 「あなたの子ら」の範囲
  choice: 比喩を保って「あなたの子ら」とする。
  alternative: 「あなたの民」「あなたの住民」と解釈的に限定する。
  rationale: 擬人化されたエルサレムと、それに属する人々との関係を示す原文の比喩を維持し、特定の集団へ狭めなかった。
- issue: 単数形から複数形への移行
  choice: 「あなた」から「あなたがた」への転換を明示する。
  alternative: 全体を単数の「あなた」で統一する。
  rationale: σου は都市エルサレムへの単数の呼びかけだが、ἠθελήσατε は複数形で、その子らないし共同体の構成員へ責任を向ける効果がある。日本語でもこの緊張を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、預言者的な嘆きにふさわしい荘重さを保った。「子ら」「者よ」はやや格調のある語だが、一般読者にも理解可能である。句読点を用いて、呼びかけ、告発、嘆き、拒絶の展開を読み取りやすくした。
