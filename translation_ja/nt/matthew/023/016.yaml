  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: ja
  text: 災いだ、目の見えない案内人たち。あなたがたはこう言う。「神殿にかけて[a]誓う者は、何の効力もない[b]。しかし、神殿の金にかけて誓う者には義務がある。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「神殿の中で」。ここでは、神殿を引き合いに出して誓うという誓いの言い方を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「それは何でもない」。文脈では、そのような誓いは拘束力がないものとして扱われる、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: 災いだ
  rationale: 預言者的な糾弾と裁きの響きを保ちつつ、現代日本語で簡潔に表した。複数の「あなたがた」は後続の呼びかけと文脈から明らかである。
- source_word: ὁδηγοὶ τυφλοὶ
  choice: 目の見えない案内人たち
  rationale: 他者を導く者自身が見えていないという比喩を、分かりやすい現代日本語で保持した。
- source_word: οἱ λέγοντες
  choice: あなたがたはこう言っている
  rationale: 冠詞付き分詞が示す相手の特徴を自然な主節として表し、引用へ滑らかにつないだ。
- source_word: Ὃς ἂν ὀμόσῃ
  choice: 誓っても／誓うなら
  rationale: 不定関係節と接続法が表す一般的条件を、日本語の条件表現で自然に再現した。対照を明瞭にするため、第一節では譲歩的な「ても」、第二節では「なら」を用いた。
- source_word: ἐν τῷ ναῷ
  choice: 神殿にかけて
  rationale: 前置詞ἐνの表面的な「中で」ではなく、この誓願定式における、神殿を引き合いに出して誓う意味を日本語の慣用表現で示した。字義的可能性は脚注に残した。
- source_word: οὐδέν ἐστιν
  choice: その誓いは何でもない
  rationale: 原文の短く省略的な「何でもない」を保ち、拘束力がないと見なす意味の説明は脚注に置いた。
- source_word: χρυσῷ τοῦ ναοῦ
  choice: 神殿の黄金
  rationale: 神殿そのものと、それに属する黄金との対比を直接的に保った。
- source_word: ὀφείλει
  choice: その誓いを果たす義務がある
  rationale: 「負っている、義務がある」という語義を誓いの文脈に即して自然に明示した。原文では目的語が省略されているため、補足部分を脚注で明らかにした。
theological_decisions:
- issue: 誓いの拘束力をめぐる省略表現
  choice: 第一節では「何でもない」という原文の簡潔さを保ち、第二節では「その誓いを果たす義務がある」と文脈上の含意を明示する。
  alternative: 「何の効力もない……義務がある」と両節を説明的に訳す、または「何でもない……負っている」と両節の省略をそのまま残す。
  rationale: イエスが批判しているのは、何にかけて誓うかによって拘束力を区別する詭弁的な規則である。第一節の意図を脚注で説明しつつ、本文では原文の修辞的な簡潔さと第二節の実際的意味の双方を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、糾弾の厳粛さを保った。「目の見えない」は比喩としての意味を明確にし、「案内人」で導きの比喩を維持した。脚注cに対応する本文マーカーを置けないため、本文との整合を優先するなら脚注cは削除する必要がある。
