  to: そしてあなたがたは言います。「もし私たちが父祖の時代に生きていたなら、預言者たちの血を流すことに彼らと共に加わる者[a]にはならなかったでしょう。」
  rationale: 原文の「彼らと共に」（αὐτῶν）と共同参与者（κοινωνοί）を保ちながら、日本語として不自然な「血にあずかる」を、文脈上明白な流血への加担として表しました。注記は、逐語的な構文と本文の明瞭な訳し方との関係を示します。
