  naturalness: 「血を流すことに加わる者」は明瞭な現代標準語であり、反実仮想には「ならなかったでしょう」が自然です。「父祖の時代」は「父祖たちの時代」よりも日本語として滑らかです。
  terminology: 「父祖」は πατέρων が指す先代の父たちという歴史的表現を保ち、「預言者」は定着した訳語です。「共犯者」とはせず、「加わる者」として κοινωνοί の共有・参与の幅を保ちます。
