id: MAT.23.30
reference: Matthew 23:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: ja
  text: そしてあなたがたは言います。「もし私たちが父祖の時代に生きていたなら、預言者たちの血を流すことに彼らと共に加わる者[a]にはならなかったでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「預言者たちの血において彼らと共有する者」。ここでは、預言者たちの流血に加担し、その責任を共に負うことを指す。
    reason: idiom_clarification
lexical_decisions:
- source_word: λέγετε
  choice: あなたがたは言います
  rationale: 現在直説法二人称複数を、イエスが相手に直接語りかける現在の発言として自然に表した。
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: もし私たちが…時代に生きていたなら
  rationale: 過去の事実に反する仮定を表す未完了過去形を、日本語の反実仮想として明確にした。「生きていた」はその時代に居合わせるという含意を自然に伝える。
- source_word: τῶν πατέρων ἡμῶν
  choice: 私たちの父祖たち
  rationale: πατέρων の男性形と、先代の父たちを指す歴史的な響きを保つため「父祖たち」とした。本文では所有関係が文脈上明白なので、引用内では「父祖たち」と簡潔に表した。
- source_word: οὐκ ἂν ἤμεθα
  choice: …にはならなかっただろう
  rationale: 過去の事実に反する条件文の帰結を、日本語で自然な反実仮想として表した。
- source_word: αὐτῶν κοινωνοὶ
  choice: 彼らと共に…にあずかる者
  rationale: κοινωνοί が示す共同関与・参与を表しつつ、「共犯者」と断定して語義を狭めることを避けた。
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: 預言者たちの血に
  rationale: 血を流した責任への関与を示す具体的な「血」の比喩を本文に残し、説明的な「殺害」へ置き換えなかった。
- source_word: τῶν προφητῶν
  choice: 預言者たち
  rationale: 確立した自然な訳語を用いた。
theological_decisions:
- issue: κοινωνοὶ ἐν τῷ αἵματι が示す加担の程度
  choice: 彼らと共に預言者たちの血にあずかる者
  alternative: 預言者たちを殺した彼らの共犯者
  rationale: 先祖による預言者への暴力と流血責任への共同関与を否定する発言である。本文では κοινωνοί の参与という関係的表現と「血」の比喩を保ち、「共犯者」「殺害」と解釈を限定しすぎないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、直接的な糾弾の調子と「血」という聖書的な具体表現を保った。「父祖」はやや格調を備えるが、一般読者にも理解可能であり、πατέρων の歴史的・男性的な表現に対応する。
