  terminology: 「預言者」「律法学者」「会堂」「十字架につけ」は定着した適切な用語である。「知恵ある者」もσοφούςの意味を不必要に専門化せず伝えている。話者の身分や派遣の神学的意味を本文に補足していない点も適切である。
