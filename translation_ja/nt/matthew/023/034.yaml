id: MAT.23.34
reference: Matthew 23:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: ja
  text: だから、見よ、わたしはあなたがたのもとに、預言者、知恵ある者、律法学者たちを遣わす。あなたがたは、そのうちのある者を殺して十字架につけ、ある者を自分たちの会堂でむち打ち、町から町へと迫害する。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 直前の文脈を受ける因果・帰結を、明瞭な現代日本語で示す。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 発言への注意を促す命令的な間投詞の力を保ち、聖書本文として自然で格調ある表現とした。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 単なる筆記者ではなく、ユダヤ教の律法に通じた専門家を指す文脈上の意味を伝える。
- source_word: ἐξ αὐτῶν
  choice: そのうちのある者
  rationale: 集団の一部を指す部分表現を自然な日本語で再現し、二度の反復も保った。
- source_word: μαστιγώσετε
  choice: むち打ち
  rationale: 身体刑を表す具体的な動詞の意味を簡潔に伝える。
- source_word: ἀπὸ πόλεως εἰς πόλιν
  choice: 町から町へと
  rationale: 迫害が次々と各都市へ及ぶ移動・反復の感覚を保持する。
theological_decisions:
- issue: 「わたしは遣わす」の話者と権威
  choice: 一人称の主語をそのまま「わたし」として保持
  alternative: 神が遣わすという説明を補う
  rationale: ギリシア語本文はἐγὼ ἀποστέλλωと明言するため、その強調を保ちつつ、話者の神学的身分を訳文内の補足で決めつけない。
- issue: 殺害と十字架刑の対象範囲
  choice: 「ある者を殺して十字架につけ」
  alternative: 「ある者を殺し、別の者を十字架につけ」
  rationale: 原文の一つの部分表現ἐξ αὐτῶνに二つの動詞が続く構造を保ち、両動詞の対象関係を訳文で過度に限定しない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な宣告にふさわしい格調を保った。「見よ」は日常語より文語的だが、ἰδοὺの注意喚起と荘重さを簡潔に伝えるため採用した。
