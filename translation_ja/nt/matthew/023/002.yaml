translation:
  language: ja
  text: こう言われた。「律法学者たちとファリサイ人は、モーセの座に着いている。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「モーセの座に座っている」または「モーセの座に着いた」とも訳せる。「モーセの座」は、モーセの律法を教える権威ある立場を指す比喩と考えられる。ギリシア語の動詞は、彼らがどのようにその立場に至ったかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: こう言われた
  rationale: 現在分詞で前節の「イエス」に結び付き、発言を導入する。日本語では独立した節として自然に読めるよう有限動詞で表した。
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: モーセの座に
  rationale: 物理的な椅子だけでなく、モーセに結び付く教えの権威ある立場を表す比喩を保った。
- source_word: ἐκάθισαν
  choice: 着いている
  rationale: アオリスト形が示す「座に着いた」という出来事と、その結果として現在その立場を占めている含みを自然な日本語で表す。自任したのか公認されたのかは本文で断定しない。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: 福音書の文脈で、律法に通じた専門家集団を現代の一般読者に明確に伝える。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を標準的に音写し、「派の人々」を添えて現代日本語として分かりやすくした。
theological_decisions:
- issue: ἐκάθισανが単に現在の着座を述べるのか、権威ある地位に就いたことを含むのか
  choice: モーセの座に着いている
  alternative: モーセの座に座っている／モーセの座に着いた
  rationale: 結果としてその権威ある立場を占めていることを示しつつ、その地位が自己任命か正式な承認によるものかは決めず、原文の緊張と曖昧さを残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、発言の荘重さを保った。「モーセの座」という簡潔な比喩は本文に残し、必要な説明は脚注に置いた。
