id: MAT.23.8
reference: Matthew 23:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: ja
  text: しかし、あなたがたは「ラビ」[a]と呼ばれてはなりません。あなたがたの教師は一人であり、あなたがたは皆、兄弟[b]だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ラビ」はユダヤ人社会で教師に用いられた称号。意味を「教師」と訳すこともできるが、ユダヤ的な背景と、後に出る「教師」との語の違いを保つため音写した。
    reason: lexical_alternative
  - marker: b
    text: 原語は男性複数形で「兄弟」。この文脈では、弟子の仲間全体を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: 呼ばれてはなりません
  rationale: μήを伴う受動態の禁止を、明確で自然な現代日本語の禁止表現で示した。
- source_word: Ῥαββί
  choice: 「ラビ」
  rationale: ギリシア語本文に音写されたユダヤ的称号をそのまま残し、後に出る「教師」と同一語に平板化しないようにした。
- source_word: εἷς
  choice: 一人
  rationale: 単数性を直接表し、「ただ一人」として本文以上に排他性を強めることを避けた。
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: あなたがたの教師
  rationale: 属格ὑμῶνが示す弟子たちとの関係を、日本語として自然に表した。
- source_word: πάντες δὲ ὑμεῖς
  choice: あなたがたは皆
  rationale: 弟子たち全員が同じ立場にあるという集合的な強調を保った。
- source_word: ἀδελφοί
  choice: 兄弟
  rationale: 男性複数形と家族的な比喩を本文に保持し、文脈上の集合的な指示範囲は脚注で説明した。
theological_decisions:
- issue: 「ラビ」と呼ばれることの禁止が、あらゆる敬称の絶対的禁止なのか、弟子共同体における地位追求への戒めなのか
  choice: 本文どおり直接的な禁止として訳し、その適用範囲を訳文で拡張も限定もしない。
  alternative: あらゆる類似の称号を絶対的に禁じる訳、または偽善的な野心だけに限定する訳。
  rationale: ギリシア語本文は明確な禁止とその理由を述べるが、後世のあらゆる適用をこの一節だけで明示してはいないため、神学的緊張を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。禁止の力を保ちつつ過度に古風な表現を避け、「ラビ」は歴史的背景を残すため音写した。
