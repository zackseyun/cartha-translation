id: MAT.23.15
reference: Matthew 23:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: ja
  text: 律法学者たち、ファリサイ派の人々、偽善者たち。あなたがたに災いがある。あなたがたは、一人を改宗者[a]にするために海と陸を巡り歩き、その人が改宗者になると、あなたがたより二倍もゲヘナの子[b]にするからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでは、ユダヤ教への改宗者を指す。「プロセリュトス」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「ゲヘナの子」は、ゲヘナに属する者を表す慣用的な言い方。ゲヘナは、しばしば「地獄」と訳される。
    reason: cultural_and_lexical_explanation
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言者的な糾弾と警告の力を保つ。「ああ」は嘆きに偏りやすいため避けた。
- source_word: γραμματεῖς
  choice: 律法学者
  rationale: 当時の律法に通じた公的な学識者を、現代日本語で分かりやすく表す。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 歴史的なユダヤ教集団の名称を標準的な音写で示し、「派の人々」として自然な日本語にした。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: 宗教的・道徳的な見せかけを非難する語として定着し、文脈にも合う。
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: 海と陸を巡り歩き
  rationale: 広範囲にわたって骨を折る様子を、原文の対句を保ちながら自然に表した。
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: 一人の改宗者を得る
  rationale: προσήλυτοςの意味を一般読者に通じる語で示した。「作る」は日本語では不自然なため、目的を表すποιῆσαιを文脈に即して「得る」とした。
- source_word: ὅταν γένηται
  choice: その人が改宗すると
  rationale: 何になるのかという原文上の省略を直前の「改宗者」から自然に補い、出来事の成立を明確にした。
- source_word: υἱὸν γεέννης
  choice: ゲヘナの子
  rationale: γεένναを一般化した「地獄」に置き換えず、ユダヤ的・終末論的背景を持つ名称とセム語的な「子」の比喩を保持した。
- source_word: διπλότερον ὑμῶν
  choice: 自分たちの二倍も
  rationale: 比較対象が話しかけられている律法学者とファリサイ派であることを明確にし、二倍という強い比較を保った。
theological_decisions:
- issue: γεένναの訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: 原文固有の語と、その歴史的・終末論的含意を保つため音写した。一般的な理解の助けとして脚注で「地獄」との関係を説明する。
- issue: υἱὸν γεέννηςの比喩
  choice: ゲヘナの子
  alternative: 地獄に定められた者
  rationale: 「子」というセム語的な所属・性質の比喩を本文に残し、その意味を脚注で補うことで、解釈を本文に過度に織り込まない。
- issue: προσήλυτοςの対象
  choice: 改宗者
  alternative: ユダヤ教への改宗者／プロセリュトス
  rationale: 本文では読みやすさを優先しつつ、当時の文脈でユダヤ教への改宗者を指すことを脚注に示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳しい預言者的糾弾を弱めない文体とした。「ゲヘナの子」のような原文の重要な比喩は本文に保持し、脚注で理解を助ける。
