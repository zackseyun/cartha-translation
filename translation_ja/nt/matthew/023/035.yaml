id: MAT.23.35
reference: Matthew 23:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: ja
  text: それは、正しい人々の、地上で流されたすべての血が、正しいアベルの血から、あなたがたが聖所と祭壇の間で殺害したバラキヤの子ゼカリヤの血に至るまで、あなたがたに降りかかるためです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地上で」は「この地で」とも訳せる。ギリシア語は「地球・地上」と「土地・国土」のどちらも意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「バラキヤの子ゼカリヤ」がだれを指すかについては議論がある。預言者ゼカリヤと見る説もあれば、エホヤダの子ゼカリヤ（歴代誌第二24章20－22節）と結びつける説もある。ここではギリシア語本文の記述をそのまま訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: それは……ためです
  rationale: 前節から続く目的・結果のニュアンスを保ちつつ、現代日本語として自然につないだ。
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: 責任が……あなたがたに降りかかる
  rationale: 直訳的には「あなたがたの上に来る」だが、日本語では血そのものが降りかかるより、流血の責任・罪責が及ぶという司法的含意を明示する方が自然である。
- source_word: πᾶν αἷμα δίκαιον
  choice: 正しい人々の血の責任が、すべて
  rationale: δίκαιον は血を換喩的に修飾し、正しい人々が流した血ではなく、正しい人々の流された血を指すため、その関係を明確にした。
- source_word: ἐκχυννόμενον
  choice: 流されてきた
  rationale: 血が流されるという日本語の慣用を用い、現在分詞が表す累積的・継続的な射程を「てきた」で伝えた。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 文脈の広い射程に合う「地上」を本文に採用し、γῆ が「地、国土」を意味し得ることは脚注に残した。
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: 正しいアベルの血から
  rationale: 属格構文とアベルへの「正しい」という評価を簡潔に保持した。
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: バラキヤの子ゼカリヤの血に至るまで
  rationale: ἀπό…ἕως の範囲表現を自然な日本語で保持し、人名は一般的な聖書表記に従った。
- source_word: ὃν ἐφονεύσατε
  choice: あなたがたが……殺害した
  rationale: φονεύω の不法かつ非難を伴う殺害の意味を、尊厳ある現代語「殺害した」で表した。
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: 聖所と祭壇の間で
  rationale: ναός は神殿域全体よりも神殿本体・聖所を指すため、「神殿」ではなく「聖所」とした。
theological_decisions:
- issue: 「血があなたがたに来る」という表現の意味
  choice: 「血の責任が……降りかかる」と表現する
  alternative: 「血がすべてあなたがたの上に降りかかる」
  rationale: 原文の血は流血罪・血の責任を換喩的に表す。日本語で誤って物理的な血を想起させないよう意味を明示したが、裁きの厳しさは保持した。
- issue: バラキヤの子ゼカリヤの同定
  choice: ギリシア語本文どおり「バラキヤの子ゼカリヤ」とする
  alternative: エホヤダの子ゼカリヤと調和させる、または預言者ゼカリヤと断定する
  rationale: 歴史的同定には議論があるため、本文を改変も調和もせず、曖昧さを脚注で示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「正しい」は δίκαιος を一般読者にも理解しやすく表し、「義人」という教会語への依存を避けた。「殺害した」により告発の強さを保ち、「聖所」で ναός と神殿域全体との区別を反映した。
