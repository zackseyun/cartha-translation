revisions:
- from: それは、地上で流されてきた正しい人々の血の責任が、すべてあなたがたに降りかかるためです[a]。すなわち、正しいアベルの血から、あなたがたが聖所と祭壇の間で殺害した、バラキヤの子ゼカリヤの血に至るまでです[b]。
  to: それは、正しい人々の、地上で流されたすべての血が、正しいアベルの血から、あなたがたが聖所と祭壇の間で殺害したバラキヤの子ゼカリヤの血に至るまで、あなたがたに降りかかるためです[a][b]。
  rationale: 「血の責任」という明示されていない抽象名詞を除き、原文どおり「血」が「あなたがたに降りかかる」とした。「正しい人々の、地上で流されたすべての血」は、δίκαιονが血を換喩的に修飾する意味とἐκχυννόμενονの受動的な流血の意味を自然な日本語で表す。脚注a・bの内容は原文上の語義的・歴史的曖昧さを適切に保存しているため維持した。
