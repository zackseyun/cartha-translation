id: MAT.23.22
reference: Matthew 23:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: ja
  text: また、天にかけて誓う者は、神の御座と、その上に座っておられる方にかけて誓っているのである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その上に座っている方」。
    reason: καθημένῳは「座っている」とも直訳できるが、本文では敬意と御座の文脈を踏まえて「座っておられる」とした。
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: 誓う者
  rationale: 冠詞付きアオリスト分詞はここでは一般的・実詞的に用いられ、過去の一回の行為ではなく、だれであれそのように誓う者を指す。日本語では簡潔に「誓う者」とした。
- source_word: ἐν
  choice: にかけて
  rationale: 誓いの定型表現における与格支配のἐνであり、場所を表す「中で」ではなく、誓いの対象を示す自然な日本語「にかけて」とした。反復される各句にも同じ意味がある。
- source_word: οὐρανῷ
  choice: 天
  rationale: 直後に神の御座と結び付けられる宗教的文脈なので、物理的な「空」ではなく「天」が適切である。
- source_word: ὀμνύει
  choice: 誓っているのである
  rationale: 現在直説法は一般的真理を述べる。日本語では、前件の行為が実質的に何を意味するかを明示する説明的な述語として「誓っているのである」とした。
- source_word: θρόνῳ τοῦ θεοῦ
  choice: 神の御座
  rationale: 属格関係を自然な日本語で表し、「御座」は神の王権と尊厳を保ちつつ現代の聖書文体にもなじむ。
- source_word: τῷ καθημένῳ
  choice: 座っておられる方
  rationale: 実詞化された現在分詞で、御座に着いている方を指す。敬意を自然に表すため「おられる」を用い、原文どおり直接「神」と置き換えず婉曲表現を保った。
- source_word: ἐπάνω αὐτοῦ
  choice: その上に
  rationale: αὐτοῦは直前の「御座」を受ける。御座との位置関係を示し、日本語として自然な「その上に」とした。
theological_decisions:
- issue: 「その上に座っておられる方」の指示対象
  choice: 天で御座に着いておられる神を指す敬意ある婉曲表現として保つ
  alternative: 指示対象を本文中で明示して「神」と訳す、またはより不定的に「そこに座る者」とする
  rationale: 直前の「神の御座」により指示対象は明らかであり、この節の論理は天にかけた誓いが神ご自身にも及ぶというものである。ただし原文は神という名詞を繰り返さず分詞表現を用いるため、その緊張と婉曲性を訳文にも残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の御座という荘重な文脈に合わせて「御座」「おられる方」を用いた。「また」で前節からの連続を示し、「のである」でイエスの論証的な調子を表した。
