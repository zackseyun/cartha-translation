id: MAT.23.12
reference: Matthew 23:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: ja
  text: しかし、自分を高くする者は低くされ、自分を低くする者は高くされる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分を持ち上げる者は引き下げられ、自分を引き下げる者は持ち上げられる。」
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: …者
  rationale: 不定関係代名詞が表す一般的・格言的な意味を、現代日本語で自然な「…者」によって表した。
- source_word: δὲ
  choice: しかし
  rationale: 前の文脈に対する穏やかな対照を明確に示す。
- source_word: ὑψώσει ἑαυτόν
  choice: 自分を高くする
  rationale: 直訳的な「自分を高くする」で自己高揚・自己称揚の意味を保ち、後半との語彙的な対称も示す。
- source_word: ταπεινωθήσεται
  choice: 低くされる
  rationale: 未来受動の形と、高低を用いた対句を保持する。動作主は原文どおり明示しない。
- source_word: ταπεινώσει ἑαυτόν
  choice: 自分を低くする
  rationale: 再帰的な能動表現を保ち、謙遜して身を低くする意味を簡潔に表す。
- source_word: ὑψωθήσεται
  choice: 高くされる
  rationale: 未来受動を保ち、前半の「高くする」および「低くされる」との鮮明な対句を再現する。
theological_decisions:
- issue: 受動態の動作主
  choice: 「低くされる」「高くされる」と受動態で訳し、動作主を明示しない
  alternative: 「神に低くされる」「神に高くされる」
  rationale: 原文は受動態であり、神の働きが含意され得るものの、動作主を明記していない。その神学的な含みと開放性を保つ。
- issue: 一般命題における文法上の男性単数
  choice: 性別を限定しない一般的な「者」で訳す
  alternative: 「自分を高くする男」など、男性を明示する
  rationale: ギリシア語の男性単数形はここでは任意の人を代表する一般的用法である。日本語の「者」は単数的な構文と一般性の双方を自然に保持する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文の二つの節の平行構造、能動と受動の対照、「高くする／低くする」の反転を優先した。
