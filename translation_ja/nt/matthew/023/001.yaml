  text: Τότε ὁ Ἰησοῦς ἐλάλησεν τοῖς ὄχλοις καὶ τοῖς μαθηταῖς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/001.yaml
  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: ja
  text: それから、イエスは群衆と弟子たちに語った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: それから
  rationale: 物語の時間的な進行を示す副詞。直前の出来事を受けた自然な現代日本語として「それから」とした。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 定冠詞を伴う固有名だが、これはギリシア語の通常の語法であり、日本語では冠詞に相当する表現を加えない。
- source_word: ἐλάλησεν
  choice: 語った
  rationale: λαλέωのアオリストで、ここでは発話行為を簡潔に表す。「話しかけた」も可能だが、後続するまとまった教えへの導入として「語った」が自然であり、原文にない発言内容を補わない。
- source_word: τοῖς ὄχλοις
  choice: 群衆
  rationale: 定冠詞付き与格複数。日本語の集合名詞「群衆」は数を明示せずとも複数の集団を自然に包含でき、「大勢の人々」より簡潔で格調を保つ。
- source_word: καὶ
  choice: と
  rationale: 二つの聞き手の集団を並列する接続詞であり、日本語では「群衆と弟子たちに」とまとめるのが自然。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たち
  rationale: 定冠詞付き与格複数と三人称属格。日本語では文脈上イエスの弟子であることが明白なため「その弟子たち」ではなく「弟子たち」とし、複数は「たち」で示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。原文の簡潔な叙述と、群衆および弟子たちという二つの聞き手の並列を保った。
