reference: Matthew 23:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: ja
  text: だが、律法学者たち、ファリサイ派の人々、偽善者たちよ、あなたがたは災いだ。あなたがたは人々の前で天の国を閉ざしている。自分たちも入らず、入ろうとしている人々[a]が入ることも許さないからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「入ろうとしている人々」は、「入って行く人々」とも訳せる。ギリシア語は、入る途中にある人々、または入ることを目指している人々のどちらをも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: だが、あなたがたは災いだ
  rationale: οὐαίの預言者的な糾弾を保ちつつ、現代日本語として明瞭にした。δέは一連の糾弾をつなぐ軽い対照・推移として「だが」とした。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 福音書のユダヤ的文脈で、単なる筆記者ではなく律法の専門家を指すことが普通の読者にも伝わる表現とした。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を現代日本語で自然かつ明瞭に示した。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: 宗教的・道徳的な見せかけを非難する語勢を保つ定着した訳語である。
- source_word: κλείετε
  choice: 閉ざしている
  rationale: 天の国への道を遮る比喩を自然な日本語で保ち、継続的な行為を表した。
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイ特有の表現に対する、日本語聖書で広く理解される自然な訳語。神の支配という意味を排除せず、不要な教派的説明を加えない。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 人々の前で
  rationale: 人々の行く手で入口を閉ざすという空間的・比喩的描写を保った。ἀνθρώπωνは性別を限定しない「人々」とした。
- source_word: οὐκ εἰσέρχεσθε
  choice: 自分たちも入らず
  rationale: 主語の対照を日本語で明確にしつつ、原文の現在形が示す事態を簡潔に表した。
- source_word: τοὺς εἰσερχομένους
  choice: 入ろうとしている人々
  rationale: 現在分詞が、入りつつある者だけでなく入ることを目指している者も表し得る曖昧さを、文脈に合う自然な日本語で示した。別訳を脚注に付した。
- source_word: οὐδὲ … ἀφίετε εἰσελθεῖν
  choice: 入ることも許さない
  rationale: ἀφίημι＋不定詞の許可の意味と、εἰσελθεῖνを明示しながら、日本語で不自然な反復を避けた。
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν の訳し方
  choice: 天の国
  alternative: 天の支配／もろもろの天の国
  rationale: マタイの特徴的表現を慣用的な日本語で伝え、「神の国」と別種の領域であるとの教理的区別を持ち込まない。
- issue: τοὺς εἰσερχομένους の進行・志向の含意
  choice: 入ろうとしている人々
  alternative: 入って行く人々
  rationale: 文脈上、指導者らに妨げられているため完了には至っていない人々を自然に表す。ただしギリシア語現在分詞は実際に入りつつある意味にも取れるため、脚注で代案を示して曖昧さを保つ。
- issue: 糾弾の根拠を示す二つの接続表現 ὅτι と γάρ
  choice: 二文をまとめ、末尾の「からだ」で根拠全体を示す
  alternative: 「というのは……。実際……」と逐語的に区分する
  rationale: 天の国を閉ざすことと、自ら入らず他者も許さないことの論理関係を保ちながら、現代日本語として読みやすくした。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳しい預言者的糾弾にふさわしい格調を保った。「あなたがたは災いだ」は強い宣告として訳し、「律法学者」「ファリサイ派」「偽善者」は一般読者に理解しやすい標準的な宗教語彙を用いた。
