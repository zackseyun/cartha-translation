review_pass:
  verdict: revise
  source_fidelity: πληρώσατε is correctly rendered as an imperative, and 「先祖たち」 appropriately conveys πατέρων in this context. However, 「升目」 ordinarily means grid squares or scale markings in contemporary Japanese, not a measured quantity or capacity; it therefore fails to convey τὸ μέτρον accurately.
  naturalness: 「先祖たちの升目を満たしなさい」 is not natural modern Japanese and is likely to evoke a ruled grid rather than the intended metaphor of a measure reaching fullness. 「先祖たちの量を満たしなさい」 is clear enough while retaining the compact, deliberately metaphorical wording.
  terminology: Use 「量」 for μέτρον here. It preserves the unspecified metaphor without inserting 「罪」 into the main text. The footnote may explain that the context concerns accumulated guilt.
  issues:
  - severity: high
    issue: 「升目」はτὸ μέτρονの訳語として不適切
    rationale: 現代日本語の「升目」は主に方眼・目盛りの一区画を指し、「量」「分量」「升（容量）」という原文の比喩を伝えない。
  - severity: medium
    issue: 脚注の「罪を余すところなく完成させなさい」は不自然で、原文より解釈を強くしている
    rationale: 原文は「先祖たちの量を満たす」とのみ述べ、罪という語を明示しない。文脈上の罪責は説明できるが、別訳は比喩の範囲にとどめるのがよい。
