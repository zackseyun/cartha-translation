id: MAT.23.32
reference: Matthew 23:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: ja
  text: あなたがたも、先祖たちの量を満たしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「先祖たちの量を満たしなさい」。ここでの「量」は、先祖たちから積み重なった罪責が限度に達することを表す比喩である。「先祖たちの量をいっぱいにしなさい」とも訳せる。
    reason: 原文の比喩を本文に保ちながら、文脈上示唆される累積した罪責と、自然な別表現を示すため。
lexical_decisions:
- source_word: καὶ
  choice: も
  rationale: 直前の「先祖たち」と現在の聞き手を結びつける継続・加算の力を、日本語として自然に表す。
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 明示された二人称複数代名詞を訳出し、文脈上の強調を保つ。
- source_word: πληρώσατε
  choice: 満たしなさい
  rationale: アオリスト能動命令法二人称複数を命令形として保ち、比喩を予告へと言い換えない。文脈では皮肉を帯びた断罪的な命令である。
- source_word: τὸ μέτρον
  choice: 升目
  rationale: 一定の容量・限度を表す μέτρον の比喩を簡潔に保つ。「罪の量」は文脈上の意味を明示しすぎるため本文には加えない。
- source_word: τῶν πατέρων ὑμῶν
  choice: 先祖たちの
  rationale: ここでの πατέρες は実父ではなく、預言者を殺した過去の世代を指すため、現代日本語で誤解の少ない「先祖たち」とする。
theological_decisions:
- issue: イエスの発言を命令と取るか、予告と取るか
  choice: 「満たしなさい」という命令形
  alternative: 「満たしている」「満たすことになる」という叙述・予告
  rationale: πληρώσατε は形態上、アオリスト能動命令法二人称複数である。したがって命令形を保ちつつ、文脈上は先祖の罪の歩みを完成させるよう迫る、皮肉で断罪的な言葉として読める緊張を残す。
- issue: 「升目」の内容を罪または罪責と明示するか
  choice: 本文では明示せず、比喩を保持する
  alternative: 「先祖たちの罪の升目を満たしなさい」
  rationale: 原文には「罪」に当たる語がない。文脈から蓄積する罪責が示唆されるが、その解釈は脚注に置いて原文の簡潔な比喩を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準語。短い命令文の鋭さを維持した。「父祖」より一般読者に分かりやすい「先祖たち」を用い、「升目」によって原文の容量・限度の比喩を残した。
