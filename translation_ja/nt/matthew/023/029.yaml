  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: ja
  text: 律法学者たち、ファリサイ派の人々、偽善者たちよ。あなたがたに災いがある。あなたがたは預言者たちの墓を建て、正しい人たちの記念碑[a]を飾っているからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「墓の記念碑」とも訳せる。ギリシア語は墓そのもの、または墓を記念する建造物を指すことがある。ここでは前半の「墓」と区別して「記念碑」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言者的な裁きの宣告としての強さを保ちつつ、現代日本語で明瞭にした。「ああ」は哀惜に傾きやすい。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 当時のユダヤ教における律法の専門家を、現代の一般読者に分かりやすく示す。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を慣用的な音写で示し、「派の人々」によって呼びかけの対象を自然に表す。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: 宗教的・道徳的な見せかけを非難する語として、定着した明瞭な訳語。
- source_word: ὅτι
  choice: （後続の独立文で理由を示す）
  rationale: 災いの宣告の理由を導く因果関係を、日本語では文を分けて自然に表した。
- source_word: οἰκοδομεῖτε
  choice: 建て
  rationale: 単に建設する意を保ち、「建て直す」という本文にない限定を避ける。
- source_word: τοὺς τάφους τῶν προφητῶν
  choice: 預言者たちの墓
  rationale: 建造された埋葬施設を指す自然な表現で、属格の関係もそのまま保つ。
- source_word: κοσμεῖτε
  choice: 飾っている
  rationale: 美しく整え、装飾する継続的・習慣的な行為を平明に表す。
- source_word: τὰ μνημεῖα
  choice: 墓碑
  rationale: τάφουςとの語の違いを示しながら、墓または墓を記念する構造物という文脈上の意味を表す。
- source_word: τῶν δικαίων
  choice: 正しい人たちの
  rationale: 実質的に名詞として用いられた形容詞を自然な現代日本語にし、道徳的・信仰的評価を過度に教理化せず保つ。
theological_decisions:
- issue: δικαίωνの訳し方
  choice: 正しい人たち
  alternative: 義人たち
  rationale: 過去の忠実で正しい人々を指す評価を保ちつつ、一般読者に明瞭な現代日本語とした。「義人たち」も可能だが、やや専門的・文語的である。
- issue: Οὐαὶ ὑμῖνの機能
  choice: あなたがたは災いだ
  alternative: あなたがたは何と災いなことか／ああ、あなたがたは災いだ
  rationale: 単なる悲嘆ではなく裁きの宣告という預言者的な力を保つ。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。呼びかけの列挙と裁きの宣告の強さを保ち、理由部分は日本語として自然になるよう別文にした。脚注記号[a]は本文中の該当語に付した。
