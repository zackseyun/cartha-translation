  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: ja
  text: また、「祭壇にかけて誓う者は、その誓いは無効である[b]。しかし、祭壇の上にある供え物[a]にかけて誓う者は、義務を負う」と言う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「供え物」に当たるギリシア語は、一般には「贈り物」を意味するが、ここでは神殿で神にささげる物を指す。
    reason: lexical_alternative
  - marker: b
    text: イエスが非難しているこの教えによれば、祭壇にかけた誓いは「効力がない」とされる一方、その上の供え物にかけた誓いは守る義務があるとされた。
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: また
  rationale: 非難の対象となっている教えをさらに一つ挙げる接続語として、文脈の流れを自然に示す。
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: 誓う者は……しかし……誓う者は
  rationale: 不定関係節による一般的条件を、簡潔で自然な現代日本語で表した。
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: 祭壇にかけて
  rationale: 誓いの対象を示すἐνを、日本語の誓願表現として自然な「〜にかけて」で訳した。
- source_word: θυσιαστήριον
  choice: 祭壇
  rationale: 神殿で犠牲をささげる祭壇を表す標準的な訳語。
- source_word: οὐδέν ἐστιν
  choice: それは何でもない
  rationale: 問題の教えが、その誓いには効力がないとみなしていたことを示しつつ、原文の簡潔で直截な表現を保った。
- source_word: ἐν τῷ δώρῳ
  choice: 供え物にかけて
  rationale: δῶρονは一般には贈り物を意味するが、ここでは祭壇上で神にささげられた物を指すため、「供え物」が文脈上明瞭である。
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: 祭壇の上にある
  rationale: 代名詞の指示先である祭壇を日本語で明示し、位置関係を自然に表した。
- source_word: ὀφείλει
  choice: 義務を負う
  rationale: 誓いによる法的・道徳的拘束を表しながら、原文に明示されていない目的語を補わない簡潔な訳とした。
theological_decisions:
- issue: 誓いに伴う義務の内容
  choice: 「義務を負う」とし、何を行う義務かを明示しない
  alternative: 「その誓いを果たす義務がある」
  rationale: 文脈上は誓いを履行する義務が意図されるが、ギリシア語は目的語を明示していないため、その簡潔さと含みを本文に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語を用いた。「〜にかけて誓う」は日本語として自然な誓いの表現である。引用された規定の詭弁的な対比と、ὀφείλειの目的語を省く原文の簡潔さを保った。
