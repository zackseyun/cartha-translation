id: MAT.23.36
reference: Matthew 23:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: ja
  text: まことに、あなたがたに言う。これらすべてのこと[a]は、この世代[b]に降りかかる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このすべて」。ギリシア語は複数形で、直訳は「これらすべてのこと」。
    reason: lexical_alternative
  - marker: b
    text: 「この世代」は、「この人々」または、より広く不信仰な世代を指すと理解されることもあるが、ギリシア語の最も直接的な表現は「この世代」である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: 権威ある言葉を厳粛に導入する定型句としての肯定の力を、現代日本語で自然かつ格調を保って表す。単独のἀμήνなので、重ねては訳さない。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言う
  rationale: 現在形の動詞と複数二人称の与格を素直に表し、定型句の厳粛な調子を保つ。
- source_word: ἥξει
  choice: 降りかかる
  rationale: 後続のἐπὶと合わせ、先に述べられた裁きの事柄がその世代に及ぶことを、自然な日本語で表す。単なる『起こる』よりも原文の『来る』という方向性を保つ。
- source_word: ταῦτα πάντα
  choice: これらすべてのこと
  rationale: 中性複数の指示代名詞と『すべて』を明示し、直前までに述べられた複数の事柄を指す形を保つ。
- source_word: ἐπὶ
  choice: に
  rationale: ἥξειと一体で『この世代に降りかかる』とし、対格を伴うἐπίが示す到来の対象を自然な日本語で表す。『敵対して』とまでは解釈を加えない。
- source_word: γενεὰν ταύτην
  choice: この世代
  rationale: 最も直接的な語義を保ち、同時代の人々、より広い不信仰な人々、時代などをめぐる解釈を訳文で決着させない。
theological_decisions:
- issue: 「この世代」（γενεὰν ταύτην）の指示範囲
  choice: この世代
  alternative: この人々／不信仰を特徴とするより広い世代／この時代
  rationale: 原文の時間的・集団的な表現をそのまま保ち、その範囲について争われる終末論的解釈を訳文に持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの厳粛な宣言としての格調を保った。「降りかかる」によって裁きの文脈と到来の動きを自然に表した。
