  - severity: low
    issue: 「言いはするものの」の逆接の強さ
    rationale: ギリシア語はλέγουσιν καὶ οὐ ποιοῦσιν（言う、そして行わない）という簡潔な対照である。「言うが、行わない」とすると、不要な譲歩的含意を避けながら自然な対照を保てる。
