revisions:
- from: ですから、彼らがあなたがたに言うことはすべて、行い、守りなさい。しかし、彼らの行いに倣って行ってはなりません[a]。彼らは言いはするものの、行わないからです。
  to: ですから、彼らがあなたがたに言うことはすべて、行い、守りなさい。しかし、彼らが行うとおりに行ってはなりません[a]。彼らは言うが、行わないからです。
  rationale: 原文のποιέωの反復（ποιήσατε／μὴ ποιεῖτε／οὐ ποιοῦσιν）を、日本語でも「行い／行ってはなりません／行わない」と一貫して保った。同時に、κατὰ τὰ ἔργα αὐτῶνを「彼らが行うとおりに」として自然な現代日本語に整えた。脚注は本文の該当箇所に置き、意味を変えない名詞句中心の別訳を示す。
