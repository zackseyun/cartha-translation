  timestamp: '2026-07-16T07:39:48Z'
review_pass:
  verdict: revise
  source_fidelity: 本文はSBLGNTの語順と主要な反復をおおむね正確に反映している。「すべて」「行い、守りなさい」「彼らは言うが、行わない」という対応も適切である。ただし「彼らの行いに倣って行ってはなりません」は日本語として重複感が強く、κατὰ τὰ ἔργα αὐτῶν μὴ ποιεῖτεの「彼らが行うとおりに行うな」という対照をより直接に表せる。
  naturalness: 敬体と命令の調子は明瞭で現代標準語として適切である。「言いはするものの」は自然だが、原文の簡潔な並列・対照には「言うが、行わない」のほうが直接的である。「彼らが行うとおりに行ってはなりません」とすることで、不自然な「行いに倣って行う」を避けつつ動詞反復も保てる。
  terminology: 「あなたがた」「守りなさい」「行う」は文脈と登録に合う。前節の対象を本文内で説明せず「彼ら」とする方針も、原文の省略を尊重している。
