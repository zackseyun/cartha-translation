id: MAT.23.3
reference: Matthew 23:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: ja
  text: ですから、彼らがあなたがたに言うことはすべて、行い、守りなさい。しかし、彼らが行うとおりに行ってはなりません[a]。彼らは言うが、行わないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、彼らの行いに倣ってはなりません。」
    reason: κατὰ τὰ ἔργα αὐτῶνを「彼らの行いに従って／倣って」と名詞句中心に表す訳。本文はποιεῖτεの反復を保つため、「彼らが行うとおりに行ってはなりません」とした。
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: ですから、…ことはすべて
  rationale: οὖνの推論的なつながりを「ですから」で示し、πάντα ὅσα ἐὰνの包括的な意味を自然な日本語の「…ことはすべて」で表した。
- source_word: εἴπωσιν ὑμῖν
  choice: 彼らがあなたがたに言う
  rationale: λέγωの基本義を保ち、「教える」「命じる」など、本文に明示されていない権威的な含みを加えない表現とした。
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: 行い、守りなさい
  rationale: ποιέωとτηρέωをそれぞれ「行う」「守る」と訳し、二つの命令の区別と並列を保持した。
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: しかし、彼らの行いに倣って行ってはなりません
  rationale: κατάの基準・一致の意味を「…に倣って」で表し、ἔργαとποιεῖτεの行為語彙も可能な限り保持した。より平明な言い換えは脚注に示した。
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: 彼らは言いはするものの、行わないからです
  rationale: λέγωとποιέωの簡潔な対照を保ちつつ、καίの逆接的な働きを現代日本語で自然な「…ものの」によって示した。原文にない目的語は補わなかった。
theological_decisions:
- issue: 前節にある律法学者とファリサイ派の人々の教える権威を、この節で明示するか
  choice: この節では対象を「彼ら」のままにし、前後の文脈に委ねる
  alternative: 「彼らが教えること」「モーセの座から語ること」と補う
  rationale: 直前の文脈は指示対象を明らかにするが、本節自体はそれらの説明を繰り返していないため、解釈的な補足を本文に取り込まない。
- issue: ποιέωの反復を自然な日本語のために別々の動詞へ置き換えるか
  choice: 「行い／行って／行わない」と語根をそろえて反復を残す
  alternative: 「実践しなさい／まねてはならない／実行しない」などに言い換える
  rationale: 原文はποιέωを反復し、発言と行動の不一致を修辞的に際立たせているため、その響きを日本語でも可能な範囲で保持した。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、命令と非難の厳粛さを保った。「言いはするものの、行わない」は、原文の簡潔な対照と意図的な動詞反復を両立させる表現である。
