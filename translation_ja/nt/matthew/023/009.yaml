source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: ja
  text: また、地上のだれをもあなたがたの父と呼んではならない。あなたがたの父はただひとり、天におられる方[a]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天におられる方」は、「天の父」または「天におられる父」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: だれをも自分たちの父と呼んではならない
  rationale: μή＋アオリスト接続法の禁止を明確に表し、πατέραとὑμῶνの関係を「自分たちの父」とした。原文の峻厳な命令を保ちつつ、生物学的父性だけを指すとの解釈も、称号だけに限定する解釈も本文には加えない。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上の
  rationale: 天に属する父との対照を、自然で簡潔な現代日本語で示す。
- source_word: εἷς γάρ ἐστιν ὑμῶν ὁ πατήρ
  choice: あなたがたの父はただひとり…だからである
  rationale: εἷςの唯一性とγάρの理由提示を明瞭に表す。「ただひとり」は日本語では「ひとり」だけより自然に排他性を伝える。
- source_word: ὁ οὐράνιος
  choice: 天におられる方
  rationale: 冠詞付き形容詞の実質的用法を尊重し、「天の父」と名詞を補う可能性を避けながら、父を指す表現として自然にした。
theological_decisions:
- issue: 禁止命令の範囲
  choice: 「父と呼んではならない」という直接的な禁止をそのまま保つ
  alternative: あらゆる日常的・生物学的な「父」の呼称を禁じると明示する、または霊的称号だけの禁止だと本文で限定する
  rationale: ギリシア語の命令は強いが、その適用範囲をこの一節だけで説明的に限定してはいない。したがって、解釈上の緊張を訳文で解消しない。
- issue: ὁ οὐράνιος の理解
  choice: 「天におられる方」
  alternative: 「天の父」または「天におられる父」
  rationale: 形容詞が実質的に用いられ、先行する「父」を同定しているという構造を保つ。「天におられる方」は場所的表現に聞こえ得るため、別訳を注記する。
translation_notes:
  register: 明瞭な現代標準日本語。命令の厳粛さを保つため「ならない」を用い、後半は「だからである」で理由を明示した。「自分たち」は同一節内の二つのὑμῶνを日本語として区別しやすくするため用いた。
