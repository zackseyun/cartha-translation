id: MAT.23.11
reference: Matthew 23:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: ja
  text: しかし、あなたがたの中で最も偉い者は、あなたがたに仕える者となります[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「あなたがたの中で、より偉い者は、あなたがたに仕える者となります」。ギリシア語の比較級は、ここでは集団内で最も上位にいる者を表す言い方と理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前まで述べられた地位や称号の追求との対照を、現代日本語で明確に示す。
- source_word: μείζων
  choice: 最も偉い者
  rationale: 比較級だが、集団内で最高位の者を指す最上級的な用法として自然に訳した。原語により近い形は脚注に残す。
- source_word: ὑμῶν（第一例）
  choice: あなたがたの中で
  rationale: 部分を表す属格であり、語りかけられている集団内の者を指すことを自然な日本語で示す。
- source_word: ἔσται
  choice: となります
  rationale: 未来形を反映しつつ、偉い者と仕える者との逆転を自然に表現する。
- source_word: ὑμῶν（第二例）
  choice: あなたがたに
  rationale: διάκονοςとの関係を、日本語では奉仕の相手を示す「に」で自然に表した。
- source_word: διάκονος
  choice: 仕える者
  rationale: ここでは教会職を指す専門用語ではなく、他者に奉仕する者を意味する。日本語の「しもべ」より現代的で、行為の意味も明瞭である。
theological_decisions:
- issue: 偉さと奉仕の関係
  choice: 「最も偉い者」が「仕える者」となるという地位の逆転として訳す。
  alternative: 「より偉い者は、あなたがたの奉仕者となる」
  rationale: 真の偉さが奉仕として現れるという緊張を保ち、後代の教会職制を示す語を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「偉大な者」ではなく、順位や地位をめぐる文脈に合う「偉い者」を用い、「διάκονος」は職名に限定せず「仕える者」とした。
