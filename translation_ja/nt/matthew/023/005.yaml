id: MAT.23.5
reference: Matthew 23:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: ja
  text: しかし、彼らはすべての行いを人に見せるためにする。彼らは経札[a]を幅広くし、衣の房[b]を大きくしている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「経札」は、聖書の箇所を書いた小片を納めて身につける小さな革製の容器。一部のユダヤ人は、申命記6章8節などに従って用いた。
    reason: cultural_note
  - marker: b
    text: 別訳「衣の縁飾り」。民数記15章38～39節参照。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: 彼らの行いはすべて
  rationale: πάνταがἔργαの全体を指すことを保ちつつ、現代日本語として自然な主題構文にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の文脈との対照を明確に示す。
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: 人に見てもらうためである
  rationale: 目的を表すπρὸς τὸ＋不定詞を明示し、τοῖς ἀνθρώποιςを性別を限定しない「人」とした。「見てもらう」は、人の目を意識した意図を自然に伝える。
- source_word: φυλακτήρια
  choice: 経札
  rationale: 聖句を納めて身につけるユダヤ教の具体的な用具を指す既存の日本語訳語。本文では簡潔に保ち、脚注で説明する。
- source_word: πλατύνουσι
  choice: 幅広くし
  rationale: 物理的に幅を広くするという語義を直接表す。
- source_word: κράσπεδα
  choice: 衣の房
  rationale: この文脈では律法に基づいて衣服につける房を指す。「衣の」を補って、縁飾り一般との混同を避けた。
- source_word: μεγαλύνουσι
  choice: 大きくしている
  rationale: 「大きくする」という基本義を保ち、長さだけに意味を限定しない。
theological_decisions:
- issue: ユダヤ教の宗教的用具を、慣行そのものへの非難と誤解されないように訳すこと
  choice: 「経札」「衣の房」と具体的に訳し、経札は脚注で中立的に説明する。
  alternative: 「お守り」「祈りの箱」「衣の縁」と訳す。
  rationale: 批判の焦点は、これらを身につける行為自体ではなく、人に見せるために目立たせる動機にある。「お守り」は否定的または異教的な含意を持ち得るため避けた。
translation_notes:
  register: 明快な現代標準日本語を用い、断定的で厳粛な調子を保った。「見てもらう」は目的性と人目を求める動機を自然に表す。専門的な「経札」は脚注で補い、本文の簡潔さを維持した。
