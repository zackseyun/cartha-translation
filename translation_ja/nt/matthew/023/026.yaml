  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: ja
  text: 盲目のファリサイ人よ、まず杯と皿[a]の内側を清めなさい。そうすれば、その外側も清くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皿」に当たる語は、大皿、鉢、盛り皿など、料理を盛る器を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: 目の見えないファリサイ派の人よ
  rationale: 単数呼格の直接的な叱責を保ちつつ、「盲目」を霊的・認識的な比喩としても受け取れる自然な現代日本語にした。
- source_word: καθάρισον πρῶτον
  choice: まず…清めなさい
  rationale: アオリスト命令の明確な要求と、πρῶτονが示す優先順序を簡潔に表した。「清める」は器の洗浄と道徳的含意の双方を保持する。
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: 杯…の内側
  rationale: 具体的な器の比喩を保持した。「杯」は福音書の文脈にふさわしい簡潔で品位ある訳語。
- source_word: καὶ τῆς παροψίδος
  choice: と鉢
  rationale: παροψίςは料理を盛る器を指し、形状を過度に限定しない「鉢」を採用した。別訳の幅は脚注に示した。
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: そうすれば、その外側も清くなる
  rationale: ἵναの目的・結果の流れとγένηταιの変化の意味を、自然な日本語の条件結果構文で表した。καίは「も」とした。単数代名詞は「その」で簡潔に反映した。
theological_decisions:
- issue: 器の具体的な描写と道徳的意味の関係
  choice: 杯と鉢の内側・外側を清めるという具体的な比喩を本文に残す
  alternative: 「まず内面を清めれば、外面も清くなる」のように意味を明示する
  rationale: 原文は道徳的・霊的意味を具体的な器の描写によって伝えている。解釈を本文に織り込まず、比喩の緊張と修辞的力を保った。
- issue: τυφλέの比喩性
  choice: 目の見えない
  alternative: 盲目の／霊的に目の見えない
  rationale: 叱責の強さを保ちながら、原文にない「霊的に」を補わず、文字どおりの像と比喩的意味の両方を残した。
translation_notes:
  register: 明瞭な現代標準語を用い、直接的な叱責には格調を残した。具体的な器の比喩を維持し、説明的な意訳は避けた。
