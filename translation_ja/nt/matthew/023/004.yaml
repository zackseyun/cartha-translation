  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: ja
  text: 彼らは重い荷をくくって人々の肩に載せるが、自分たちはそれを指一本で動かそうともしない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: くくって
  rationale: 荷をひとまとめに縛る具体的な像を、自然な現代日本語で表す。
- source_word: φορτία βαρέα
  choice: 重い荷
  rationale: 物理的な荷の像と、比喩的に重い要求を負わせる響きの両方を保つ。
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων
  choice: 人々の肩に載せる
  rationale: 肩の上に荷を置くという原文の具体的な身体像をそのまま伝える。ἄνθρωποιはここでは人間一般を指すため「人々」とする。
- source_word: αὐτοὶ δὲ
  choice: が、自分たちは
  rationale: 他者に負わせる行為と本人たちの拒絶との強い対照、および代名詞の強調を保つ。
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: 指一本で
  rationale: 原文は単数の「指」。日本語の慣用的な表現により、ごくわずかな努力さえしないという意味を明確にする。
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: それを……動かそうともしない
  rationale: 能力の欠如ではなく意志的な拒絶を示すθέλωと、「動かす」というκινέωの基本義を保つ。
theological_decisions:
- issue: 荷が文字どおりか比喩か
  choice: 「重い荷」という具体的な比喩を保ち、何を指すかは本文中で特定しない。
  alternative: 律法上の要求や宗教的規則と明示する。
  rationale: 文脈上は宗教指導者が人々に負わせる過酷な要求が念頭にあるが、原文自体はその内容を限定せず「荷」の像を用いているため、解釈を本文に織り込まない。
translation_notes:
  register: 明快で自然な現代標準日本語。「指一本で動かそうともしない」は日常的に理解しやすい一方、イエスの非難の力強さと dignified な調子を保つ。
