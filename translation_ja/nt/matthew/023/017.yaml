id: MAT.23.17
reference: Matthew 23:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: ja
  text: 愚かで目の見えない者たちよ。いったい、どちらが偉大なのか。金か、それとも、その金を聖なるものとした神殿[a]か。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」と訳したギリシア語は、より限定的に神殿の聖所を指すことがある。
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: 愚かな者たち
  rationale: 呼格複数による強い直接的な叱責を、現代日本語で明確かつ品位を保って表した。本文では後続語と合わせて「愚かで…者たち」とした。
- source_word: τυφλοί
  choice: 目の見えない者たち
  rationale: 比喩的な非難であることを文脈に委ねつつ、原文の「盲目」の像を保つ自然な表現とした。本文では μωροὶ と一つの呼びかけにまとめた。
- source_word: τίς γὰρ μείζων ἐστίν
  choice: いったい、どちらが偉大なのか
  rationale: 二つの対象を比較する τίς を「どちら」とし、γάρ の説明・論証の働きは、直前の叱責を受ける修辞的な問いの流れと「いったい」によって自然に示した。
- source_word: ὁ χρυσὸς
  choice: 金
  rationale: 神殿に属する特定の金を指すが、日本語では文脈上、冠詞相当の指示語を加えず「金」とするのが自然である。
- source_word: ὁ ναὸς
  choice: 神殿
  rationale: ναός はより限定的に神殿の聖所を指し得るが、本文では一般読者に明瞭な「神殿」を採用し、語義上の限定を脚注で示した。
- source_word: ὁ ἁγιάσας
  choice: 聖なるものとした
  rationale: アオリスト能動分詞の形を保ち、「聖別した」より平明に、金に聖なる地位を与えたという祭儀的意味を表した。
- source_word: τὸν χρυσόν
  choice: その金
  rationale: 原文の反復を保ちつつ、先に挙げた金を指すことが明瞭になる自然な日本語とした。
theological_decisions:
- issue: 神殿文脈における ἁγιάζω の訳
  choice: 聖なるものとした
  alternative: 聖別した／聖なるものとする
  rationale: 祭儀的な聖性付与という論理を保ちながら、専門用語に偏らない明瞭な日本語とした。アオリスト分詞に対応して完了的に訳したが、一般的な原理を表す現在的理解も可能である。
- issue: ναός の指示範囲
  choice: 神殿
  alternative: 聖所
  rationale: 文脈では神殿の中心的聖域を指し得るものの、範囲を本文で過度に限定せず、語義上の可能性を脚注に残した。
translation_notes:
  register: 強い叱責と修辞的な比較質問を保ちつつ、現代の一般読者に明瞭で、口語的すぎない格調ある標準語とした。「聖なるものとした」は祭儀的意味を平明に伝える。
