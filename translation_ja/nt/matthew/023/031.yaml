id: MAT.23.31
reference: Matthew 23:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: ja
  text: こうして、あなたがたは、自分たちが預言者たちを殺した者たちの子であると、自らに不利な証言をしているのです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分自身に対して証言している」。ギリシア語は字義的にはこのようにも訳せるが、文脈では、その証言が彼ら自身に不利なものとなっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: こうして
  rationale: 前節までの発言から導かれる結果・推論を、自然な現代日本語で示す。
- source_word: μαρτυρεῖτε
  choice: 証言をしている
  rationale: 「証言する、証しする」という法廷的含意を保ち、この文脈での自己を不利にする響きにも合う。
- source_word: ἑαυτοῖς
  choice: 自らに不利な
  rationale: 与格は字義的には「自分自身に（対して）」だが、文脈上、その証言が話し手自身を不利にするという含意を本文で自然に表した。字義的な可能性は脚注に残す。
- source_word: ὅτι
  choice: ～であると
  rationale: 証言の内容を導く接続詞として訳した。
- source_word: υἱοί
  choice: 子
  rationale: 親子関係の比喩と、祖先との系譜的・道徳的連帯の両方を保つ。日本語の「息子たち」は不自然に生物学的・男性的意味を強め得るため、「子」とした。
- source_word: τῶν φονευσάντων
  choice: 殺した者たちの
  rationale: 完了した殺害行為によって彼らを特定するアオリスト分詞を簡潔に表す。文脈上は不当な殺害だが、日本語では「預言者たちを殺した」だけでもその非道性が明瞭である。
- source_word: τοὺς προφήτας
  choice: 預言者たちを
  rationale: イスラエルの歴史における神の使者としての一群を、そのまま明確に表す。
theological_decisions:
- issue: υἱοίを字義的な男性複数として「息子たち」とするか、親子関係を表す「子」とするか。
  choice: 子
  alternative: 息子たち／子孫
  rationale: ここでは血統だけでなく、預言者を殺した先祖と同じ態度を受け継ぐ者という修辞的意味が重なる。「子」はこの親子比喩を自然に保ち、「子孫」よりも道徳的連帯の響きを残す一方、「息子たち」ほど不自然に生物学的性別を前面に出さない。
- issue: ἑαυτοῖςを字義どおり「自分自身に」とするか、文脈上の自己告発的な意味を明示するか。
  choice: 自らに不利な
  alternative: 自分自身に対して
  rationale: 直前の彼ら自身の言葉が、預言者を殺した者たちとのつながりを認める証言となっている。本文では文脈的な含意を自然に示し、ギリシア語の字義的な曖昧さは脚注で明示した。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳しい論告にふさわしい格調を保った。「こうして」で推論の流れを示し、「自らに不利な証言」で法廷的・自己告発的な含意を自然な日本語にした。
