  source_fidelity: 「こうして」はὥστεの結論・帰結を適切に示す。「自らに不利な証言をしている」はμαρτυρεῖτε ἑαυτοῖςの文脈上の自己告発的な力を自然な日本語で表しており、ὅτι以下を証言内容として正しくつないでいる。「預言者たちを殺した者たちの子」も、φονεύσαντες τοὺς προφήταςおよびυἱοίの系譜的・修辞的関係を保持している。
  naturalness: 現代標準日本語として明瞭であり、論告の厳粛な調子にも合う。「あなたがたは」の後および従属節後の読点はやや多めだが、理解を妨げるほどではなく、安全な修正を要する問題ではない。
  terminology: 「預言者」「証言」「子」は文脈に適切である。「子」はギリシア語の男性複数を日本語として不自然に性別限定せず、親子関係と祖先との連帯という修辞を保つ。「殺した」はφονεύωの非道な殺害をこの文脈で十分に伝える。
