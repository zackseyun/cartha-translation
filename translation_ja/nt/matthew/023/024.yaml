base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: ja
  text: 目の見えない案内人たちよ。あなたがたは、蚊をこし取るのに、らくだを飲み込んでいる！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: 目の見えない案内人たち
  rationale: 宗教的指導者が他者を導きながら、自らは霊的に見えていないという鮮烈な比喩を、現代日本語で自然に保つ。
- source_word: διϋλίζοντες
  choice: こし取って
  rationale: 液体をこして異物を取り除く動作を表す語であり、単に注意深く選別するという抽象的意味にせず、原文の具体的な情景を伝える。
- source_word: τὸν κώνωπα
  choice: ぶよ
  rationale: κώνωψは、ぶよ・蚊などの小さな飛翔昆虫を指す。ここでは、らくだとの極端な大小の対比が明瞭になる簡潔な語を選ぶ。
- source_word: τὴν δὲ κάμηλον
  choice: ところが、らくだを
  rationale: δέの対照を日本語の『ところが』で明示し、ごく小さな虫を除きながら巨大な動物を飲み込むという不条理を際立たせる。
- source_word: καταπίνοντες
  choice: 飲み込んでいる
  rationale: 原語の直接的で誇張的な像をそのまま保ち、説明的な意訳を避ける。
theological_decisions:
- issue: 清浄規定を背景とする比喩の力
  choice: 小さな汚れを液体から丹念に除く一方で、巨大な汚れを丸ごと飲み込むという具体像を保持する。
  alternative: 『小さな過ちにはこだわるが、大きな過ちは見過ごす』と抽象的に意訳する。
  rationale: 原文は、小さな不浄な生き物と大きな不浄な動物との不釣り合いな対比によって偽善を非難している。具体像を残すことで、特定の教理的解釈を加えず、原文の誇張と緊張を伝えられる。
translation_notes:
  register: 明快な現代標準日本語。呼びかけの鋭さと、ことわざ的で誇張された対比を保ちつつ、過度に古風な表現は避けた。
