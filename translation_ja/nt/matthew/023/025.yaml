id: MAT.23.25
reference: Matthew 23:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: ja
  text: 律法学者、ファリサイ派の人々、偽善者たちよ。あなたがたに災いがある。あなたがたは杯と皿の外側をきれいにしているが、その内側は強奪と自制のなさで満ちている[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「強奪」は「略奪」「搾取」とも、「自制のなさ」は「放縦」「節度のない自己満足」とも訳せる。原語は、他者から奪い取ることと、欲望を抑えない節度のなさを含み得る。
    reason: ἁρπαγή と ἀκρασία の語義の幅、および前者の搾取的な強い含意を示すため。
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言者的な告発と裁きの響きを保ちつつ、現代日本語として明瞭に表現した。単なる悲嘆を表す「ああ」より原文の厳しさが伝わる。
- source_word: γραμματεῖς
  choice: 律法学者
  rationale: 当時、律法の解釈と教授に携わった人々を、現代の一般読者に分かりやすく示す定着した訳語。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を音写しつつ、「派の人々」として日本語で自然にした。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: 宗教的・道徳的な見せかけを非難する語として定着しており、文脈に適合する。
- source_word: καθαρίζετε
  choice: きれいにする
  rationale: 継続的・習慣的な行為を、明瞭で自然な現代日本語にした。
- source_word: τὸ ἔξωθεν / ἔσωθεν
  choice: 外側／内側
  rationale: 原文の鮮明な対比と器の比喩をそのまま保った。
- source_word: ποτηρίου καὶ τῆς παροψίδος
  choice: 杯と皿
  rationale: ποτήριονには「杯」、食卓用の器を広く指し得る παροψίς には特定しすぎない「皿」を用いた。
- source_word: γέμουσιν
  choice: 満ちている
  rationale: 複数形の動詞が杯と皿を受ける構文を踏まえ、「その内側」を両方の器に共通する内側として表現した。
- source_word: ἁρπαγῆς
  choice: 強奪
  rationale: 貪欲という内面的性向だけでなく、奪い取ることや搾取を含み得る原語の強い意味を保持した。
- source_word: ἀκρασίας
  choice: 放縦
  rationale: 自制の欠如から生じる節度のない欲望や振る舞いを、簡潔で格調を保った日本語で示した。
theological_decisions:
- issue: 内側の汚れという比喩の指示対象
  choice: 「その内側は」として杯と皿の比喩を維持する
  alternative: 「あなたがたの内側は」として指導者たちの内面を明示する
  rationale: ギリシア語の複数動詞は直前の杯と皿を自然に受ける。指導者たちへの適用は明白だが、本文が保つ器の比喩を解釈的に展開しすぎないようにした。
- issue: ἁρπαγήとἀκρασίαの倫理的内容
  choice: 強奪と放縦
  alternative: 強欲と自己放任／貪欲と自制のなさ
  rationale: 内面的悪徳だけに限定せず、搾取的に奪う行為と節度を失った欲望の双方を表し得る原語の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの厳しい預言者的告発にふさわしい品位と力を保った。「杯」「放縦」はやや格調のある語だが、文脈上理解可能で、過度に古風ではない。
