id: MAT.23.27
reference: Matthew 23:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: ja
  text: 律法学者たち、ファリサイ派の人々、偽善者たちよ。あなたがたに災いあれ。あなたがたは白く塗られた墓に似ている。それらは外側は美しく見えるが、内側は死者の骨とあらゆる汚れ[a]で満ちている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れ」は、この文脈では儀礼上の不浄と道徳的な腐敗の両方を含み得る。
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言者的な裁きの宣告としての強さを保ちつつ、現代日本語で明瞭に伝える。「ああ、災いだ」より嘆きだけに傾かず、対象への告発を表す。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 当時の聖書・律法の専門家を、現代の一般読者に分かりやすく示す。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を標準的に音写し、「派の人々」として自然な日本語にする。
- source_word: ὑποκριταί
  choice: 偽善者たち
  rationale: 宗教的・道徳的な見せかけを非難する文脈に合い、現代日本語でも明瞭である。
- source_word: παρομοιάζετε
  choice: 似ている
  rationale: 比較を直接的かつ自然に表し、受動的で不自然な言い回しを避ける。
- source_word: τάφοις κεκονιαμένοις
  choice: 白く塗った墓
  rationale: 石灰などで墓を白く塗る具体的な光景を簡潔に表す。「白く塗り上げた墓」などの過度な解釈を避ける。
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: 外側こそ……が、内側は
  rationale: 外見と内実の鋭い対照を、日本語の自然な対比構文で保持する。
- source_word: φαίνονται ὡραῖοι
  choice: 美しく見える
  rationale: 実際の美しさではなく、外からそう見えるという外観上の性質を保つ。
- source_word: γέμουσιν
  choice: 満ちている
  rationale: 原文の現在形と、内部を満たしている状態を簡潔に表す。
- source_word: ὀστέων νεκρῶν
  choice: 死人の骨
  rationale: 「死者の骨」も可能だが、墓の内部の生々しい対照を自然で明瞭な日本語として伝える。
- source_word: πάσης ἀκαθαρσίας
  choice: あらゆる汚れ
  rationale: 儀礼的不浄と道徳的腐敗の双方を含み得る広さを保ち、どちらか一方に限定しない。
theological_decisions:
- issue: ἀκαθαρσίαが指す不浄の性質
  choice: 「汚れ」と広く訳す
  alternative: 「儀礼上の汚れ」または「道徳的腐敗」と限定する
  rationale: 墓はユダヤ的背景では儀礼的不浄を想起させる一方、文脈は内面の道徳的腐敗も非難している。広い語を用いて両義的な緊張を保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。呼びかけと災いの宣告を二文に分け、非難の力を保ちながら読みやすくした。英語資料の脚注aは本文中の対応位置と内容がずれているため採用せず、原語上重要なἀκαθαρσίαの幅を説明する脚注のみを付した。
