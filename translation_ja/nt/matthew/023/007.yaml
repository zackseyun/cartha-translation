  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: ja
  text: また、市場であいさつを受け、人々から『ラビ』と呼ばれることを好む。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: 挨拶され
  rationale: 文脈上、単に挨拶することではなく、人前で敬意ある挨拶を受けることを好むという意味。前節から続く目的語を、日本語では受け身で自然に表した。
- source_word: ἀγοραῖς
  choice: 広場
  rationale: 古代都市の公共的な市場・集会空間を指す。現代日本語では簡潔で通用しやすい「広場」とした。
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: 人々から
  rationale: ここでἄνθρωποιは性別を対照させる語ではなく、呼び手となる一般の人々を表すため、包括的で自然な訳とした。
- source_word: Ῥαββί
  choice: ラビ
  rationale: ユダヤ教の教師への敬称として定着している音訳を用い、歴史的・文化的含意を保った。
theological_decisions:
- issue: 「ラビ」の称号としての性格
  choice: 音訳「ラビ」を本文に保持する
  alternative: 「先生」と意訳する
  rationale: 次節以降でこの呼称自体が論点となるため、一般的な「先生」に平板化せず、当時のユダヤ的敬称を保つ。
translation_notes:
  register: 前節から続く文法関係を踏まえ、日本語では独立して読めるよう「好む」を補った。現代的で平明ながら、非難の調子と歴史的呼称の重みを保つ。
