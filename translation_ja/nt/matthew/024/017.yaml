  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: ja
  text: 屋上にいる者は、家から物を取り出すために、下に降りてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「屋上」は、当時の家に一般的だった、平らで人が利用できる屋根の部分を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: 屋上にいる者
  rationale: 冠詞付き句を実体詞的に訳した。「者」は代表的単数を保ちつつ、文法上の男性を日本語で不必要に性別限定しない。
- source_word: δώματος
  choice: 屋上
  rationale: 古代の家屋にあった平らで利用可能な屋根部分を指す。「屋根」より、人がその上にいる場面を自然かつ具体的に表せる。
- source_word: μὴ καταβάτω
  choice: 下に降りてはならない
  rationale: 緊迫した禁止命令を明確に表し、屋上から下方へ移動する意味も保持する。
- source_word: ἆραι
  choice: 取り出そうとして
  rationale: αἴρωの『取る、持ち出す』という意味と、ここでの目的用法を自然な日本語で表す。
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: 家から物を
  rationale: 中性複数の省略的表現を、所有物に限定しすぎず簡潔に訳した。ἐκの起点・内部から外へという含意も『家から』で保つ。
- source_word: οἰκίας αὐτοῦ
  choice: 家
  rationale: 屋上から降りて物を取るという物理的場面なので、『家庭』や情緒的な『わが家』ではなく建物としての『家』を用いる。日本語では所有者を文脈から自然に理解できるため、αὐτοῦを不自然な『彼の』として明示しない。
theological_decisions:
- issue: 代表的男性単数
  choice: 『者』とし、性別を明示しない
  alternative: 『男』『彼の家』とする
  rationale: ギリシア語の男性単数は代表的・総称的な構文であり、男性だけを対象とする神学的主張ではない。日本語は代名詞や所有表現を省略できるため、単数の指示を保ちながら不要な性別限定を避ける。
translation_notes:
  register: 現代標準日本語による、明快で緊迫感のある禁止命令。『屋上』は通常の読者にも分かりやすく、古代家屋の文化的背景は脚注で補った。
