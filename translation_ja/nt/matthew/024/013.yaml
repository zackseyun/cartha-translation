id: MAT.24.13
reference: Matthew 24:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: ja
  text: しかし、最後まで耐え抜く人は救われます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「終わりに至るまで」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「助け出されます」。ギリシア語は、危難からの救出と救いのどちらも表し得ます。ここでは文脈が意味を一方に限定しないため、より広い表現にしています。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の離反や裏切りについての警告との穏やかな対照を、自然な現代日本語で示す。
- source_word: ὁ ... ὑπομείνας
  choice: 耐え抜く人
  rationale: 定冠詞を伴うアオリスト分詞の実名詞的用法を、性別を限定しない自然な表現で訳した。分詞はここでは過去の一回的行為ではなく、最後まで持ちこたえる者を指す。
- source_word: ὑπομείνας
  choice: 耐え抜く
  rationale: 試練の下にとどまり、持ちこたえるという意味を明瞭に表す。「忍耐する」より動作性があり、一般の読者にも理解しやすい。
- source_word: εἰς τέλος
  choice: 最後まで
  rationale: 終点に至るまで継続することを表す、日本語として簡潔で自然な訳。
- source_word: οὗτος
  choice: （「人は」という主題に反映）
  rationale: ギリシア語では先行する実名詞的分詞を強調して受けるが、「その人こそ」と明示すると日本語では不必要に強く響くため、「耐え抜く人は」という主題構文にその指示と強調を反映した。
- source_word: σωθήσεται
  choice: 救われます
  rationale: σῴζωの未来受動態が持つ救済・救出の幅を保つ。文脈だけでは終末的救いと危難からの救出のいずれか一方に限定できない。
theological_decisions:
- issue: 忍耐と救いの関係
  choice: 「最後まで耐え抜く人は救われます」とし、忍耐が救いの原因なのか、救われる者のしるしなのかを訳文で規定しない。
  alternative: 「最後まで耐え抜くことによって救いを得ます」など、因果関係を明示する。
  rationale: 原文は耐え抜く者について救われると約束するが、その組織神学的な関係を明示していないため、緊張を保持する。
- issue: σωθήσεταιの救いの範囲
  choice: 「救われます」として広い意味を保持する。
  alternative: 「助け出されます」として危難からの救出に限定する。
  rationale: 終末的救済、苦難からの救出、またはその両方が含まれ得るため、文脈が確定していない範囲を狭めない。
translation_notes:
  register: 明瞭で現代的な標準日本語。聖書本文としての品位を保ちつつ、過度に文語的な「耐え忍ぶ者」「救わるべし」は避けた。敬体で統一した。
