  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: ja
  text: しかし、もしその悪い召使い[a]が心の中で、「私の主人[b]は遅れている」と言うなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その悪い奴隷」。ギリシア語の「ドゥーロス」は、文脈により「召使い」とも「奴隷」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「主」。ここでは家を舞台とするたとえの関係を表すため「主人」とした。ギリシア語は「キュリオス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: しかし、もし……なら
  rationale: ἐὰνと接続法による条件を「もし……なら」で表し、δέの穏やかな対比を「しかし」で示した。
- source_word: εἴπῃ
  choice: 言う
  rationale: アオリスト接続法は条件節の中にあり、日本語では「もし……と言うなら」とすることで、仮定的な意味を自然に保てる。
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: その悪い召使い
  rationale: κακόςの道徳的な悪さを「悪い」で表し、ἐκεῖνοςの指示性を「その」で保った。δοῦλοςは奴隷をも意味するが、ここでは家の中で務めを任された者という物語上の役割を前面に出して「召使い」とした。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心の中で
  rationale: 内心の思いや独り言を表す原文の比喩を、現代日本語でも自然な「心の中で」によって保持した。
- source_word: Χρονίζει
  choice: 遅れている
  rationale: 現在形が表す継続中の遅れを示し、帰還など原文に明示されていない語は補わなかった。
- source_word: μου ὁ κύριος
  choice: 主人
  rationale: μουの所有関係は、日本語の「主人」という関係語と文脈から明瞭である。κύριοςはこの家のたとえの直接的な場面では召使いに対する主人を指すため、「主」ではなく「主人」とした。
theological_decisions:
- issue: 家のたとえにおけるκύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: 広い文脈では人の子の到来を指し示すたとえとして読めるが、発言内の直接的な物語場面では家の召使いの上に立つ者を指す。訳文はこの直接的意味を「主人」で示し、キリスト論的な含意を訳語によって断定しない。
- issue: δοῦλοςの社会的身分と役割の表現
  choice: 召使い
  alternative: 奴隷
  rationale: δοῦλοςには「奴隷」の意味がある一方、この箇所では家の管理を任された者としての役割が焦点となる。「召使い」を本文に置き、身分を強く示す「奴隷」を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「心の中で」という原文の比喩を保持した。節末は原文と文脈上、次節へ続く条件構文なので読点で終えた。「しもべ」はやや古風であり、「僕」は一人称代名詞との混同が生じ得るため避け、「召使い」を採用した。
