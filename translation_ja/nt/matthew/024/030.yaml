id: MAT.24.30
reference: Matthew 24:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: ja
  text: その時、人の子のしるしが天に[a]現れる。そしてその時、地上のすべての部族は嘆き[b]、人の子が力と大いなる栄光を帯びて、天の雲に乗って来るのを見る[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「空に」とも訳せる。ギリシア語の οὐρανός は、文脈により「天」または「空」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「この地のすべての部族」とも訳せる。ギリシア語の γῆ は「地上・世界」または特定の「地・土地」を意味しうる。
    reason: alternative_reading
  - marker: c
    text: 「天の雲に乗って来る」は、ダニエル書7章13節を反映している。
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: 現れる
  rationale: 受動・中動形をここでは自動詞的に取り、目に見える形で出現する出来事を自然な現代日本語で表した。
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子のしるし
  rationale: 「人の子に属するしるし」か「人の子自身というしるし」かを特定せず、ギリシア語の属格が持つ曖昧さを保った。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天に
  rationale: οὐρανόςの天的・終末論的な響きを保つため「天」とし、空間的な「空」の可能性は脚注に示した。
- source_word: κόψονται
  choice: 嘆き
  rationale: この文脈では服喪・悲嘆を表す慣用的用法であり、特定の身ぶりに限定せず明瞭に訳した。
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: 地上のすべての部族
  rationale: φυλήを字義に近い「部族」、γῆを宇宙的文脈に即して「地上」とした。「この地の全部族」という限定的理解も可能なため脚注に残した。
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: 天の雲に乗って
  rationale: ἐπίの空間的意味とダニエル書7章13節への響きを、自然な日本語で保った。
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: 力と大いなる栄光を帯びて
  rationale: πολλῆςが直接修飾する「栄光」の大きさを明示しつつ、μετάの随伴を自然な日本語で表現した。
theological_decisions:
- issue: 「人の子のしるし」が何を指すか
  choice: 「人の子のしるし」として属格の曖昧さを保持した。
  alternative: 「人の子に属するしるし」または「しるしである人の子自身」
  rationale: 原文だけでは一義的に決まらず、終末論上の論争点を翻訳で解消しないため。
- issue: γῆの範囲
  choice: 宇宙的・終末論的文脈を踏まえて「地上」とした。
  alternative: 「この地」または「その地」
  rationale: 普遍的範囲が文脈上自然だが、イスラエルの地に焦点を当てる読みも語義上可能なので脚注に示した。
- issue: 雲に乗って来る描写の背景
  choice: 本文を直訳的に保ち、ダニエル書への関連を脚注で示した。
  alternative: 背景を本文中で説明的に訳す。
  rationale: ダニエル書7章13節への明白な反響を読者に知らせつつ、本文には解釈説明を加えないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「人の子」「大いなる栄光」は聖書的な荘重さを残しつつ、文全体は一般読者が容易に理解できる語順に整えた。脚注記号は該当表現の直後に配置した。
