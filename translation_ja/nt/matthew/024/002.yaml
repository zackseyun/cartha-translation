source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: ja
  text: すると、イエスは彼らに答えた。「これらすべてが見えないのですか。まことに、あなたがたに言います。ここで石の上に残される石は一つもなく、すべて崩されます[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「崩される」は、「破壊される」または「取り壊される」とも訳せる。ギリシア語は、建造物を解体し、石を元の位置から取り除くことを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: イエスは彼らに答えた
  rationale: 分詞と定形動詞を重ねるセム語的な言い回しは、日本語では「答えた」と自然にまとめた。主語は文脈上のイエスであり、明示することで日本語として明瞭にした。
- source_word: Οὐ βλέπετε ταῦτα πάντα
  choice: これらすべてが見えないのですか
  rationale: οὐを伴う修辞疑問の形を保ち、目前の神殿建築物を指すταῦτα πάνταを「これらすべて」とした。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの厳粛な導入句を、現代日本語で格調を保ちながら明瞭に表した。
- source_word: οὐ μὴ ἀφεθῇ
  choice: 残る…は一つもありません
  rationale: οὐ μήの強い否定を「一つもありません」で表し、予告として自然な日本語にした。
- source_word: ὧδε
  choice: ここでは
  rationale: その場の神殿域を示す場所の副詞として簡潔に訳した。
- source_word: λίθος ἐπὶ λίθον
  choice: 石の上に残る石
  rationale: 石が積み重なった建造物の像を保ちつつ、後続の関係節と自然につながる日本語にした。
- source_word: καταλυθήσεται
  choice: 崩されずに
  rationale: 建造物を解体・破壊する語義を受動形で表し、石が元の場所から取り除かれる具体的な像を保った。
theological_decisions:
- issue: 神殿についての予告の範囲と力点
  choice: 石造建築が徹底的に崩されるという具体的な予告として訳す
  alternative: 象徴的な裁き、または特定の終末論体系に結び付けて訳す
  rationale: 本文の表現は具体的かつ建築的であるため、その力を保つ一方、この節自体が明示しない終末論的枠組みは加えない。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの発言には丁寧体を用いて厳粛さと読みやすさを両立させ、過度に古風な語法は避けた。
