id: MAT.24.26
reference: Matthew 24:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: ja
  text: だから、もし人々があなたがたに、『見よ、荒れ野[a]にいる』と言っても、出て行ってはならない。『見よ、奥まった部屋[b]にいる』と言っても、信じてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「砂漠」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「納戸」「貯蔵室」または「人目につかない部屋」とも訳せる。ギリシア語は、家の奥にある私的な部屋を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: だから、もし……ても
  rationale: οὖνの前文からの帰結を「だから」で示し、ἐὰνの条件性を日本語として自然な「もし……ても」で表した。
- source_word: εἴπωσιν ὑμῖν
  choice: 人々があなたがたに……と言っても
  rationale: 三人称複数は特定の集団を指さないため、不特定の「人々」とした。二つの発言内容にまたがる条件構文を明瞭にするため、後半にも「と言っても」を補った。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す指示表現の直接性を保ちつつ、聖書本文にふさわしい簡潔で dignified な語調とした。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒れ野に
  rationale: ἔρημοςは人里離れた荒涼地を広く指し、必ずしも砂地の砂漠に限定されないため「荒れ野」とした。
- source_word: ἐστίν
  choice: いる
  rationale: 文脈上の人物を指す主語はギリシア語で明示されていない。日本語では主語を補わず「いる」とすることで、その含みを保った。
- source_word: μὴ ἐξέλθητε
  choice: 出て行ってはならない
  rationale: μήを伴うアオリスト接続法の禁止と、ἐξέρχομαιの外へ向かう動きを直接に表した。
- source_word: ἐν τοῖς ταμείοις
  choice: 奥まった部屋に
  rationale: ταμεῖονは家の内側にある私的な部屋、納戸、貯蔵室などを指し得る。ここでは用途を限定せず、外から見えにくい内奥の空間を示す「奥まった部屋」とした。
- source_word: μὴ πιστεύσητε
  choice: 信じてはならない
  rationale: 話者そのものではなく、告げられた主張を信じないよう命じる文脈である。日本語では目的語を明示せずとも自然であるため補わなかった。
theological_decisions:
- issue: ἐστίνの暗黙の主語
  choice: 日本語本文でも主語を明示せず「いる」とする
  alternative: 「あの方がいる」「メシアがいる」と補う
  rationale: 直前までの文脈では偽メシアに関する報告が問題となっているが、この節のギリシア語自体は主語や称号を明示しない。日本語で自然に省略できるため、特定の称号を加えず原文の含みを保った。
- issue: 二つの場所についての報告の関係
  choice: 接続詞を加えず、並行する二つの引用として訳す
  alternative: 二つ目の前に「あるいは」を加える
  rationale: 二つの報告は同じ条件構文の下で並行しているが、原文には選択を明示する接続詞がないため、「あるいは」は本文に加えなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、命令には簡潔で重みのある「見よ」「してはならない」を採用した。二つの警告の並行性は、引用と反復によって自然に示した。
