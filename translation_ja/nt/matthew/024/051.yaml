id: MAT.24.51
reference: Matthew 24:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ja
  text: そして、その者を真っ二つに切り裂き[a]、その者には偽善者たちと同じ取り分を与える[b]。そこでは、泣き叫びと歯ぎしりがある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「厳しく罰する」。ギリシア語の動詞は、文字どおりには「二つに切る」という意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳「その者の取り分を偽善者たちと共に定める」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: 真っ二つに切り裂き
  rationale: 語の具体的な基本義である「二つに切る」を保ち、警告の激しさを弱めない。比喩的に「厳しく罰する」と理解する余地は脚注に示す。
- source_word: μέρος
  choice: 割り当て
  rationale: 「部分、取り分」から、この文脈では人に定められる分・運命を表す。「場所」と限定せず、原文の幅を保つ。
- source_word: ὑποκριτῶν
  choice: 偽善者たち
  rationale: マタイで繰り返される語の主題的一貫性を保つ標準的な訳語。
- source_word: ἐκεῖ
  choice: そこでは
  rationale: 直前に述べた偽善者たちと同じ割り当てに伴う裁きの場・状態を自然に指し示す。
- source_word: κλαυθμὸς
  choice: 泣きわめき
  rationale: 単なる静かな涙よりも、名詞が表す嘆きの強さを現代日本語で明瞭に伝える。
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: 歯ぎしりすること
  rationale: マタイに反復される鮮烈な定型表現を、自然な日本語として保持する。
theological_decisions:
- issue: διχοτομήσειを比喩的な処罰表現に和らげるか
  choice: 本文では「真っ二つに切り裂く」という具体的表現を保持する
  alternative: 「厳しく罰する」と訳す
  rationale: 原語の直接的な像と警告の力を保ちつつ、それが文字どおりか比喩かを本文で決めつけないため。
- issue: τὸ μέρος αὐτοῦ ... θήσειが表す運命をどう訳すか
  choice: 「偽善者たちと同じ割り当てを与える」とする
  alternative: 「偽善者たちと同じ場所に置く」または「偽善者たちと同じ取り分を与える」
  rationale: 場所、取り分、定められた運命のいずれかに狭く限定せず、司法的に定められる分という原文の含みを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きの警告にふさわしい厳粛さと原文の鮮烈な比喩を保持した。「割り当て」はやや硬質だが、場所や運命に意味を限定しないため採用した。
