  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: ja
  text: また、不法が増すために、多くの人の愛が冷える。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: 増すために
  rationale: διάと冠詞付き不定詞は原因を表す。日本語では「増すために」として、名詞化を避けつつ文脈上の将来的な増加を自然に示した。受動形は、不法そのものが増大するという自然な日本語で表現した。
- source_word: ἀνομίαν
  choice: 不法
  rationale: 神の律法を無視し、これに背くことを指す語であり、「不法」は簡潔で意味も明確である。「悪」では広すぎ、「不義」では別の概念との区別が弱くなる。
- source_word: ψυγήσεται
  choice: 冷える
  rationale: 愛情が冷たくなるという比喩を、そのまま自然な現代日本語で表した。未来の出来事であることは周囲の終末的文脈から明らかで、日本語では非過去形が自然である。
- source_word: ἀγάπη
  choice: 愛
  rationale: 語の基本的な意味を簡潔かつ標準的に表し、対象や性質を本文以上に限定しない。
- source_word: τῶν πολλῶν
  choice: 多くの人の
  rationale: 定冠詞を機械的に「その多くの人々」とせず、広いが不特定の範囲を自然な日本語で保持した。「大多数の人」とすると統計的な意味を加えすぎる。
theological_decisions:
- issue: 「多くの人の愛」が指す範囲
  choice: 「多くの人の愛」とし、集団を特定しない
  alternative: 信者たちの愛／社会一般の人間愛
  rationale: τῶν πολλῶνは、その人々が弟子、名目的信者、社会一般の人々のいずれであるかを明示していないため、解釈上の緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「増す」「冷える」という簡潔な動詞表現により、原文の因果関係と比喩を自然に伝える。
