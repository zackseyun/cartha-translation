  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: ja
  text: それでは、時にかなった食事を家の者たちに与えるために、主人[b]が彼らを任せた、忠実で賢明な奴隷[a]とは、いったい誰でしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しもべ」。ギリシア語は、文脈によって「奴隷」とも「しもべ」とも訳せる。ここでは主人の権威の下にある者という強い意味を保つため、「奴隷」とした。
    reason: lexical_alternative
  - marker: b
    text: 別訳「主」。ここでは家を舞台とするたとえの社会的な関係に合わせて、「主人」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄρα
  choice: それでは……いったい誰でしょうか
  rationale: ἄραが前の教えを受けて導く推論的・継続的な問いであることを「それでは」で示し、修辞的な問いの力を「いったい誰」で自然に表した。
- source_word: πιστὸς
  choice: 忠実な
  rationale: 任された務めを確実に果たす信頼性と、道徳的な誠実さの両方を保つ。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 主人の権威の下に置かれた身分を含む語であり、この家を舞台とする比喩では、より弱い「しもべ」より原文の社会的関係を明確に表す。一般的な訳語は脚注に残した。
- source_word: φρόνιμος
  choice: 賢明な
  rationale: 単なる知識ではなく、状況に応じて適切に行動する実際的な知恵と思慮を表す。
- source_word: κατέστησεν
  choice: 任命し
  rationale: 家の者たちを管理する責任ある地位に就けるという、委任された権限を表す。
- source_word: κύριος
  choice: 主人
  rationale: 直近の文脈は奴隷と家の者たちをめぐる家政の比喩なので、社会的関係を自然に示す「主人」とした。称号としての「主」は脚注に残した。
- source_word: οἰκετείας
  choice: 家の者たち
  rationale: 単に建物や抽象的な家全体ではなく、その家に属する人々、とりわけ家内の構成員・使用人たちを指す複数的な意味を明示した。
- source_word: τοῦ δοῦναι
  choice: 食事を与えさせる
  rationale: 属格付き冠詞不定詞の目的用法を、任命の目的として自然な日本語で表した。主語は主人であり、実際に食事を与えるのは任命された奴隷であることが明確になる。
- source_word: τροφὴν
  choice: 食事
  rationale: 家の者たちに所定の時に配る食物という文脈に合い、「配給」などの過度に限定的な含みを避けた。
- source_word: ἐν καιρῷ
  choice: 時に応じて
  rationale: 単なる時計上の時刻ではなく、必要にかなった適切な時を表すκαιρόςの含みを自然に伝える。
theological_decisions:
- issue: 家を舞台とする比喩におけるκύριοςの訳
  choice: 主人
  alternative: 主
  rationale: 比喩の表層では家の奴隷に権限を委ねる主人を指すため、「主人」が直接の意味に合う。より広い文脈でイエスを暗示する可能性は否定せず、称号的な読みを本文に先取りして固定しない。
- issue: δοῦλοςが示す身分と権威関係
  choice: 奴隷
  alternative: しもべ
  rationale: 原語が示す主人への従属を弱めず、比喩の社会的緊張を保つため「奴隷」とした。ただし、日本語聖書で親しまれてきた柔らかな選択肢を脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。修辞的な問いを自然に保ち、家政の比喩における主人、奴隷、家の者たちの関係を明確にした。脚注記号は対応する語の直後に置いた。
