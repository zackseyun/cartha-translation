id: MAT.24.43
reference: Matthew 24:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: ja
  text: しかし、このことを知っておきなさい。家の主人が、夜のどの見張りの時間帯[a]に泥棒が来るのか知っていたなら、目を覚まして見張り、自分の家に押し入らせはしなかったでしょう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時、夜は見張りの交代に応じて幾つかの時間帯に分けられていた。直訳すると「夜のどの見張り時に」。
    reason: cultural_note
  - marker: b
    text: 直訳すると「自分の家が掘り破られるのを許さなかった」。古代の家屋では、泥棒が壁などを掘り破って侵入することがあった。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: しかし、このことを知っておきなさい
  rationale: δέによる話の展開と、γινώσκετεの直接的な呼びかけを保ちつつ、現代日本語で自然な命令表現とした。
- source_word: οἰκοδεσπότης
  choice: 家の主人
  rationale: 単なる現代的な不動産所有者ではなく、家と家人を取り仕切る者という語の社会的含意を簡潔に保った。
- source_word: ποίᾳ φυλακῇ
  choice: 夜のどの見張りの時間帯
  rationale: φυλακήが夜を区切る見張りの時間帯を指すことを本文で分かりやすく示し、古代の時間区分については脚注で補った。
- source_word: ὁ κλέπτης ἔρχεται
  choice: 泥棒が来るのか
  rationale: ギリシア語の現在形を保ちつつ、日本語の間接疑問として自然に表現した。仮定全体の反実仮想は後続の「知っていたなら」で明確になる。
- source_word: ἐγρηγόρησεν ἂν
  choice: 目を覚ましていて
  rationale: γρηγορέωの「眠らずにいる、目を覚ましている」という意味を、夜の泥棒という比喩に即して明瞭に表した。
- source_word: οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: 自分の家に押し入らせはしなかったでしょう
  rationale: 日本語では家を物理的に「掘り抜く」と直訳するより、盗人の侵入を許さないという文脈上の意味を自然に伝える。壁などを掘り破る原語の具体像は脚注に残した。
theological_decisions:
- issue: 家の主人の比喩の訳し方
  choice: 家の主人
  alternative: 家主／家長
  rationale: これは警戒を促す比喩であり、特定の教義的称号ではない。「家の主人」はοἰκοδεσπότηςの役割を保ちながら、現代の不動産賃貸に限る「家主」という連想を避ける。
- issue: 泥棒の侵入方法を表す古代的な描写
  choice: 自分の家に押し入らせはしなかった
  alternative: 自分の家を掘り破らせはしなかった
  rationale: 本文では比喩の要点である侵入を自然に示し、古代家屋の壁などを掘り破る具体的な描写は脚注に明示することで、意味と歴史的背景の双方を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、警告としての厳粛さを保った。「知っておきなさい」と反実仮想の「知っていたなら……しなかったでしょう」により、原文の直接的な教えと条件構文を自然に表現した。
