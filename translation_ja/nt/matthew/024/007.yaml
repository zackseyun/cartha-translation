id: MAT.24.7
reference: Matthew 24:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: ja
  text: 民族は民族に、王国は王国に対して立ち上がり[a]、各地で[b]飢饉と地震が起こるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「攻めかかり」とも訳せる。ギリシャ語のこの表現は、民族や王国の間で敵対行動が起こることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「所々で」または「場所から場所へ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: 敵対して立ち上がり
  rationale: この未来受動・中動形は、ここでは敵対行動が起こることを表す慣用的な用法。「敵対して」を補うことで、単に起立する意味ではないことを明確にしつつ、背後の行為者や神的因果関係は加えない。
- source_word: γὰρ
  choice: からです
  rationale: 直前の発言に理由・説明を加える接続辞であるため、日本語では文末の「からです」で自然にそのつながりを示した。
- source_word: ἔθνος
  choice: 民族
  rationale: 政治的・民族的な集団を指し、並行する「王国」と区別される。「異邦人」という限定的な意味は文脈上不要なので避けた。
- source_word: ἐπὶ ἔθνος
  choice: 民族に…敵対して
  rationale: 対立を表すἐπί＋対格の慣用法を、日本語で自然な「…に敵対して」とした。
- source_word: βασιλεία
  choice: 王国
  rationale: ここでは統治権そのものより政治的領域を指す。「王国」はἔθνοςとの並行関係と終末論的な語調を保つ。
- source_word: ἔσονται
  choice: 起こる
  rationale: 飢饉と地震の発生を表す存在用法を、自然な日本語の出来事表現にした。
- source_word: λιμοὶ
  choice: 飢饉
  rationale: 深刻な食糧不足を表す標準的な訳語。ギリシャ語は複数形だが、日本語では無標の「飢饉」で各地に起こる複数の事例を自然に表せる。
- source_word: σεισμοὶ
  choice: 地震
  rationale: この文脈でσεισμόςが指す自然災害を明確に表す標準的な訳語。複数性は「各地で」によって十分に示される。
- source_word: κατὰ τόπους
  choice: 各地で
  rationale: 複数の場所に分布して起こることを表す句。「各地で」は簡潔で現代日本語として自然である。
theological_decisions:
- issue: 終末的な争いの文脈におけるἔθνοςの範囲
  choice: 民族
  alternative: 国、民
  rationale: 「王国」との並行関係を保ちつつ、特定の異邦民族だけを指すという限定を持ち込まないため。
- issue: 未来受動・中動形ἐγερθήσεταιの含意
  choice: 敵対して立ち上がる
  alternative: 敵対するように起こされる、攻めかかる
  rationale: 争いの勃発を表しながら、本文が明示していない神的受動や特定の行為者を訳文に加えないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言的な文脈にふさわしい格調を保った。「民族は民族に、王国は王国に」という並行構造を維持し、γάρは日本語として自然な文末表現「からです」で示した。
