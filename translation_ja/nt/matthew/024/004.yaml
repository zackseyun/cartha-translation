  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: ja
  text: イエスは彼らに答えた。「だれにも惑わされないように、気をつけなさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれにもだまされないように、気をつけなさい。」
