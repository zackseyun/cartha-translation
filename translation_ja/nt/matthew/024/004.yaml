lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: 彼らに答えた
  rationale: 「答えて言った」というギリシア語の定型的な言い回しを、応答の意味を保ちながら自然な現代日本語にまとめた。
- source_word: Βλέπετε μή τις
  choice: だれにも…ないように、気をつけなさい
  rationale: 命令形と μή＋接続法が表す警戒・防止の意味を、明瞭で自然な日本語にした。複数の弟子に向けた命令だが、日本語では数を明示しなくても伝わる。
- source_word: πλανήσῃ
  choice: 惑わされる
  rationale: 誤った考えを信じ込まされることだけでなく、正しい道から外されることも含み得る πλανάω の幅を簡潔に保つ。
theological_decisions:
- issue: πλανήσῃ が表す警告の範囲
  choice: 「惑わされる」とし、欺きと正しい道からの逸脱の両方を含み得る表現にした
  alternative: 「だまされる」として欺瞞の側面を前面に出す
  rationale: 終末についての偽りの主張という文脈で、単なる知的な誤認に限定せず、誤った方向へ導かれる含みを残した。
translation_notes:
  register: 明瞭な現代標準日本語。「気をつけなさい」は日常的でありながら聖書本文にふさわしい端正さを保つ。「そこで」は直前の問いに対する応答としての καί を自然に示す。
