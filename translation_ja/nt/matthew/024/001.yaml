source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: ja
  text: イエスが神殿[a]から出て、そこを去って行かれる途中、弟子たちは神殿の建物をお見せしようとして、イエスに近寄って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、聖所だけでなく、境内を含む神殿区域全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 出て
  rationale: アオリスト分詞が主動詞に先立つ動作を表しているため、イエスがまず神殿から出たことを簡潔に示した。
- source_word: ἱεροῦ / τοῦ ἱεροῦ
  choice: 神殿
  rationale: ἱερόνは内陣だけでなく境内を含む神殿区域全体を指す。本文では自然で定着した「神殿」を用い、範囲は脚注で明示した。
- source_word: ἐπορεύετο
  choice: 立ち去って行かれると
  rationale: 未完了過去が表す進行中の移動を自然な日本語で示し、単に「立ち去った」と完結させなかった。文脈上、意図や未遂を含み得る「立ち去ろうと」ではなく、実際の移動として訳した。
- source_word: προσῆλθον
  choice: 近寄って来た
  rationale: προσέρχομαιの接近の意味を保ち、弟子たちがイエスのもとへ来たことを自然に表した。
- source_word: ἐπιδεῖξαι
  choice: お見せしようと
  rationale: 不定詞の目的用法を明示した。イエスへの敬意を自然な現代日本語の敬語で表した。
- source_word: οἰκοδομὰς
  choice: 建物
  rationale: 神殿区域にある複数の建造物を集合的に指す自然な日本語として「建物」を選んだ。
theological_decisions:
- issue: ἱερόνとναόςの区別
  choice: 本文では「神殿」、脚注で神殿区域全体を指し得ることを説明する
  alternative: 神殿境内／神殿区域
  rationale: 原語は内陣に限定されないが、本文で「神殿区域」とすると説明的になりすぎる。一般読者に自然な「神殿」を保ちつつ、原語上の重要な範囲を脚注で開示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスへの敬意は「行かれる」「お見せする」という自然な敬語で表した。ギリシア語の動作の順序と、弟子たちが近寄った目的を読みやすい一文の中に保持した。
