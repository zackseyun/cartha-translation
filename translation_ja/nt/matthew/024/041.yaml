  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: ja
  text: 二人の女性[a]がひき臼[b]で粉をひいている。一人は連れて行かれ、もう一人は残される[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「二人が粉をひいている」だが、「ひいている」に当たるギリシア語は女性複数形であり、二人が女性であることを示している。
    reason: lexical_alternative
  - marker: b
    text: 「臼で」または「臼石で」とも訳せる。ギリシア語は、製粉する設備またはその臼石を指し得る。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は単に「一人は連れて行かれ、もう一人は残される」と述べており、ここでは、連れて行かれることが救いを意味するのか裁きを意味するのかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: 二人の女が……粉をひいている
  rationale: ἀλήθουσαιは「ひく」を意味する現在能動分詞・女性複数形で、明示された名詞はないが、女性二人を指す。日本語では主語の「女」を補い、動作を自然に表した。
- source_word: ἐν τῷ μύλῳ
  choice: ひき臼で
  rationale: μύλοςは臼、ひき臼、製粉設備を指し得る。この家庭内の作業場面では「ひき臼で」が具体的かつ自然であり、器具の細部までは限定しない。
- source_word: μία παραλαμβάνεται
  choice: 一人は連れて行かれ
  rationale: παραλαμβάνεταιは現在受動形。「連れて行かれる」は人を対象とする日本語として自然で、ここでそれが救いか裁きかを断定しない。
- source_word: καὶ μία ἀφίεται
  choice: もう一人は残される
  rationale: ἀφίεταιは現在受動形で、この対比では「残される」が簡潔で自然。「置き去りにされる」ほど強い否定的含意を加えない。
theological_decisions:
- issue: 女性形の分詞が示す主語を明示するか
  choice: 「二人の女」と明示する
  alternative: 「二人が」とだけ訳す
  rationale: ἀλήθουσαιは女性複数形なので、原文が示す性を日本語にも正確に反映した。
- issue: 「連れて行かれる」と「残される」の終末論的意味
  choice: どちらが救いまたは裁きかを本文で特定しない
  alternative: 一方を救い、他方を裁きと明示する
  rationale: この節自体は、連れて行かれることと残されることの意味を明言していないため、その神学的緊張と曖昧さを保った。
translation_notes:
  register: 明快で現代的な標準語を用いながら、終末について語る文脈にふさわしい簡潔で厳粛な調子を保った。「粉をひいている」として日本語で作業内容を自然に示し、「連れて行かれ／残される」の対照を平行に表現した。
