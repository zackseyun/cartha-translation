  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: ja
  text: 主人が帰って来たとき、その僕がそのようにしているのを見つけるなら、幸いなのはその僕です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: 幸いです
  rationale: 祝福された状態を表す語。現代日本語で自然かつ聖書的な響きを保つ。
- source_word: δοῦλος
  choice: 僕
  rationale: 主人に属して仕える者という当時の身分関係を保つため、「しもべ」より現代的な表記の「僕」を採用した。
- source_word: κύριος
  choice: 主人
  rationale: ここではδοῦλοςとの関係を示す人間の主人を指すため、「主」ではなく文脈に即した「主人」とした。
- source_word: ἐλθών
  choice: 帰って来たとき
  rationale: 主人が不在から戻るというたとえの文脈を自然な日本語で明示した。原語自体は単に「来て」だが、帰還の含意が文脈上明らかである。
- source_word: οὕτως ποιοῦντα
  choice: そのようにしている
  rationale: 直前の45節に述べられた務めを忠実に行っていることを受ける表現として、指示性を保った。
theological_decisions:
- issue: κύριοςを「主」とするか「主人」とするか
  choice: 主人
  alternative: 主
  rationale: たとえの内部では僕に対する所有者・主人を表す。キリストへの適用を否定せず、語りの直接的な場面を優先した。
- issue: μακάριοςの訳語
  choice: 幸いです
  alternative: 祝福されています
  rationale: 神からの祝福という含みを保ちつつ、結果としての幸福な状態を簡潔に表す定着した訳語を用いた。
translation_notes:
  register: 明快な現代標準日本語。たとえの主従関係を保ちながら、古風すぎる語法を避けた。文末は教えとしての宣言にふさわしい丁寧体とした。
