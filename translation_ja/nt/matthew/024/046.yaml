revisions:
- from: 主人が帰って来たとき、そのようにしているのを見てもらえる僕は幸いです。
  to: 主人が帰って来たとき、その僕がそのようにしているのを見つけるなら、幸いなのはその僕です。
  rationale: 主人が見いだすという原文の主語・動作を「主人が……見つける」と明示し、「見てもらえる」に伴う不必要な恩恵・受動の含みを除きました。「帰って来た」と「そのようにしている」は直前のたとえを受ける文脈に適合するため維持しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:11Z'
review_pass:
  verdict: revise
  source_fidelity: 原文は「その奴隷／しもべは幸いである。主人が来たとき、その者がそのようにしているのを見いだす」という構文です。草案は「帰って来た」で文脈上の帰還を適切に表し、「そのようにしている」もοὕτως ποιοῦνταの指示内容を保っています。しかし「見てもらえる」は主人から恩恵を受けるという含みを加え、原文の主人が見いだすという叙述を不正確にしています。
  naturalness: 「その僕」は単独では一人称代名詞にも読まれ得ますが、文脈上は理解可能です。とはいえ、「見てもらえる」はこの文脈では不自然かつ意味がずれます。「その僕が……しているのを見つける」と能動的に表すと、明快な現代標準日本語になります。
  terminology: κύριοςをたとえの内部で「主人」とするのは適切です。δοῦλοςの「僕」は従属的な身分を表す既存の選択として維持できますが、「その僕」として指示対象を明示します。μακάριοςは文全体に係るため、「幸いです」としてもよいものの、「幸いなのは……です」の構文にして原文の関係節を自然に再現します。
  issues:
  - severity: high
    issue: 「見てもらえる」
    rationale: εὑρήσειは「（主人が）見つける／見いだす」であり、受動・恩恵の「～してもらえる」ではありません。草案は行為者の焦点を主人から僕へ移し、恩恵の含みを加えています。
  - severity: medium
    issue: 「幸いです」の係り先がやや不明瞭
    rationale: 原文では「そのようにしているのを主人が見いだす、その僕」が幸いだとされます。日本語では「幸いなのは……僕です」とすることで、この関係を明瞭にできます。
  revised_text: 主人が帰って来たとき、その僕がそのようにしているのを見つけるなら、幸いなのはその僕です。
  revised_footnotes: []
  revision_rationale: 主人が見いだすという原文の主語・動作を「主人が……見つける」と明示し、「見てもらえる」に伴う不必要な恩恵・受動の含みを除きました。「帰って来た」と「そのようにしている」は直前のたとえを受ける文脈に適合するため維持しました。
