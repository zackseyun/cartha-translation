base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: ja
  text: だから、目を覚ましていなさい[a]。あなたがたの主が何日に[b]来られるのか[c]を、あなたがたは知らないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見張っていなさい」「警戒していなさい」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「どの日に」。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語では現在形。別訳「来るのか」「おいでになるのか」。
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 現在命令形が表す継続的な警戒を、覚醒の比喩を保ちながら自然な現代日本語で表した。「備えていなさい」より原語の像に近い。
- source_word: οὖν
  choice: だから
  rationale: 直前の教えから導かれる結論を、明瞭で自然な接続表現によって示した。
- source_word: ὅτι
  choice: からです
  rationale: 命令の理由を示す接続詞であるため、日本語では文末の理由表現として自然に訳した。
- source_word: οὐκ οἴδατε
  choice: あなたがたは知らない
  rationale: 二人称複数と否定された知識動詞を、意味を補わずに明示した。
- source_word: ποίᾳ ἡμέρᾳ
  choice: 何日に
  rationale: 時を表す与格句を、特定できない日を問う自然な日本語にした。
- source_word: ὁ κύριος ὑμῶν
  choice: あなたがたの主
  rationale: κύριοςの権威と新約聖書における称号としての用法を保ち、所有関係も明示した。
- source_word: ἔρχεται
  choice: 来られる
  rationale: ギリシア語の現在形を、日本語で将来の到来にも自然に用いられる非過去形で表した。主に対する敬意を示しつつ、時期を過度に限定しない。
theological_decisions:
- issue: 終末的文脈における現在形ἔρχεταιの力
  choice: 日本語の非過去形「来られる」とし、切迫感を損なわず、到来時期を断定しない
  alternative: 「来られることになる」または「おいでになる」
  rationale: 原文は現在形だが、文脈上は将来の到来を指しうる。日本語の非過去形はこの両面を自然に保持し、特定の終末論的時期設定を持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用い、命令には継続性が感じられる表現を選んだ。「主」は新約聖書の称号としての重みを保つ。「来られる」は丁寧で格調を保つ一方、現代の一般読者にも理解できる表現である。
