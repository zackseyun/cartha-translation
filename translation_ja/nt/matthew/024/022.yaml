id: MAT.24.22
reference: Matthew 24:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: ja
  text: そして、もしその日々が短くされなかったなら[a]、だれ一人救われなかったであろう[b]。しかし、選ばれた者たちのために、その日々は短くされる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「切り詰められなかったなら」とも訳せる。原語は、日々の期間が短くされることを表す。
    reason: lexical_alternative
  - marker: b
    text: 原文は直訳すると「すべての肉は救われなかった」。ここで「すべての肉」は生身の人間全体を指し、否定文では「だれ一人……ない」という意味になる。「救われる」には、この文脈では命を保たれるという意味も含まれる。
    reason: lexical_and_idiomatic_clarification
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: 短くされなかったなら／短くされる
  rationale: κολοβόωは「短くする」「切り詰める」を表す。日々の期間が減らされるという意味を、現代日本語で自然かつ明確に示すため「短くされる」とした。
- source_word: οὐκ ἂν ἐσώθη
  choice: 救われなかったであろう
  rationale: 反実仮想の結果を表す構文を保持した。σῴζωはこの文脈では命が保たれることを強く含むが、「生き残る」と限定せず、「救う」という語の意味の広がりを残した。
- source_word: πᾶσα σάρξ
  choice: だれ一人……ない
  rationale: 字義的には「すべての肉」だが、否定文中では「生身の人間はだれも」を意味する聖書的表現である。日本語として明瞭な「だれ一人……ない」で人間全体を指す意味を伝えた。
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: しかし、選ばれた者たちのために
  rationale: διά＋対格の理由・配慮の意味を「のために」で表した。ἐκλεκτοίは、対象を神学的に特定しすぎない透明な表現として「選ばれた者たち」とした。
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: その日々
  rationale: 指示表現を保ちつつ、前後の文脈を受ける自然な現代日本語とした。
- source_word: καὶ εἰ μὴ
  choice: そして、もし……なかったなら
  rationale: 冒頭の接続と明示的な条件構文を保持し、反実仮想が分かる形にした。
theological_decisions:
- issue: 終末に関する談話における「選ばれた者たち」の範囲
  choice: 「選ばれた者たち」とし、説明を加えない
  alternative: 神に選ばれた民／信者たち／忠実な残りの者
  rationale: この節自体は、その集団の神学的範囲を特定していない。イスラエル、教会、残りの者などの解釈に決めず、原文の開放性を保った。
- issue: この文脈におけるσῴζωの意味
  choice: 「救われる」と訳し、生命の保全を含みつつ意味を限定しない
  alternative: 生き残る／命を保たれる
  rationale: 災厄を生き延びることが直接の文脈だが、原語は「救う」「保つ」という幅を持つ。「生き残る」だけに狭めず、救済語としての響きも排除しない訳とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、終末的な警告の厳粛さを保った。「選民」は特定の集団を強く連想させうるため避け、「選ばれた者たち」とした。条件文と未来形の対照を明示し、原文の神学的・語義的な幅を残した。
