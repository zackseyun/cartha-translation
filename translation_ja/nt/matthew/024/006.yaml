id: MAT.24.6
reference: Matthew 24:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: ja
  text: また、あなたがたは、戦争や戦争の知らせ[a]を耳にすることになるでしょう。動揺しないように気をつけなさい。そうしたことは起こらなければなりません。しかし、まだ終わりではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「戦争のうわさ」とも訳せる。ギリシャ語の表現は、知らせ、報告、うわさを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: ことになるでしょう
  rationale: μέλλωの将来的・予期的な意味を表しつつ、現代日本語として自然な見通しの表現とした。単なる未来の断定にも、直近の出来事だけにも限定しない。
- source_word: ἀκούειν
  choice: 耳にする
  rationale: ここでは戦争そのものの音を直接聞くのではなく、その情報を伝え聞く意味なので、「耳にする」とした。
- source_word: πολέμους
  choice: 戦争
  rationale: πόλεμοςの通常の意味を保ち、個々の戦闘や一般的な対立に狭めなかった。
- source_word: ἀκοὰς πολέμων
  choice: 戦争の知らせ
  rationale: ἀκοήは知らせ、報告、うわさを含み得る。「知らせ」は情報の真偽を決めつけない広い表現であり、「うわさ」は脚注に残した。
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: 動揺しないように気をつけなさい
  rationale: ὁρᾶτεの警告・注意を促す命令と、θροεῖσθεの心を乱され、騒ぎ立つ意味を自然な日本語で表した。恐怖の強さを不必要に誇張しない。
- source_word: δεῖ γὰρ γενέσθαι
  choice: そうしたことは起こらなければなりません
  rationale: δεῖの必然性を明示した。ギリシャ語は非人称的で主語を明記しないが、日本語では直前の戦争とその知らせを受ける「そうしたこと」を補って意味を明瞭にした。
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: しかし、まだ終わりではありません
  rationale: τέλοςを説明的に限定せず「終わり」とし、οὔπωの「まだ……ではない」を簡潔で自然な日本語にした。
theological_decisions:
- issue: τὸ τέλοςが指す終末の範囲
  choice: 終わり
  alternative: 世の終わり／完成の時
  rationale: 原文は何の「終わり」かをこの節だけでは詳しく限定していないため、特定の終末論的枠組みを持ち込まず、広い表現を保った。
- issue: δεῖが表す必然性
  choice: 起こらなければなりません
  alternative: 必ず起こります
  rationale: 出来事の確実性だけでなく、δεῖが表す必要・必然の含みを保った。ただし、その必然性の神学的仕組みまでは本文に付加しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの警告としての厳粛さを保った。「動揺しないように」は理解しやすく、過度に古風または口語的にならない表現である。脚注記号[a]は対応する語句の直後に置いた。
