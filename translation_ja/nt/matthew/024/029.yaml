id: MAT.24.29
reference: Matthew 24:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: ja
  text: しかし、その日々の苦難の直後に、太陽は暗くなり、月はその光を放たず、星々は天から落ち[a]、天の力は揺り動かされる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天」は「空」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「天の力」は、宇宙的な力、天体、または天的な勢力を指す可能性がある。ギリシア語では複数形であり、その表現は意味を広く保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: しかし、…すぐ後に
  rationale: δὲによる軽い対比を「しかし」で示し、Εὐθέωςの強い時間的な即時性を「すぐ」で自然に表した。
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: その日々の苦難のすぐ後に
  rationale: θλῖψιςの終末論的な重みを保つため「苦難」とし、属格「その日々の」を苦難にかけて原文の関係を保持した。
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: 太陽は暗くなり
  rationale: 日本語では「暗くされる」より自然であり、未来の預言として文脈上明瞭。「暗くなる」は出来事そのものを述べ、原因を補わない。
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: 月はその光を放たず
  rationale: 「その光」によってαὐτῆςを示し、「放つ」で「光を与えない」という比喩を自然な現代日本語にした。
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: 星々は天から落ち
  rationale: 複数形を「星々」で示した。οὐρανόςは「空」も可能だが、黙示的な格調と後続の「天」とのつながりを保つため本文では「天」とした。
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: 天のもろもろの力
  rationale: δυνάμειςが宇宙的な力、天体、天的な勢力などを指し得る曖昧さを、「力」という広い語で保持した。「もろもろ」により複数性も示した。
- source_word: σαλευθήσονται
  choice: 揺り動かされる
  rationale: 未来受動の形と宇宙的・預言的な響きを保ち、単なる心理的な「動揺」とは限定しない表現にした。
theological_decisions:
- issue: 黙示的な宇宙現象の性質
  choice: 太陽、月、星、天の力という像をそのまま訳し、出来事の性質を限定しない。
  alternative: 文字どおりの天文学的崩壊、政治的・司法的変動を表す象徴、またはその両方と明示する。
  rationale: 原文は預言的・黙示的なイメージを用いるが、その解釈を一つに確定していないため、訳文でも神学的緊張と解釈の幅を保った。
- issue: 「天のもろもろの力」の指示対象
  choice: 指示対象を特定せず、広い表現を保持する。
  alternative: 天体、宇宙を支配する力、または天的存在と限定する。
  rationale: ギリシア語の表現自体が複数の理解を許すため、特定の終末論や霊的存在の解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、終末預言にふさわしい厳粛さを保った。「天のもろもろの力」はやや格調ある表現だが、原文の複数性と意図的な曖昧さを自然な範囲で保持するために採用した。
