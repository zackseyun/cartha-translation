  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: ja
  text: そして彼は、大きなラッパの音[a]とともに御使いたちを遣わす。御使いたちは、四方の風から[c]、天の一方の果てから他方の果てまで[d]、彼の選ばれた者たち[b]を集める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大きなラッパとともに」または「力強いラッパの音とともに」。
    reason: lexical_alternative
  - marker: b
    text: 「選民」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「四方の風」は、あらゆる方角、すなわち最も遠い所々までを表す慣用表現。
    reason: cultural_note
  - marker: d
    text: 直訳「天々の端から、それらの端まで」。天の一方の果てから他方の果てまでという全範囲を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: 遣わす
  rationale: 未来形の意味を文脈に沿って表し、単に移動させるだけでなく、任務を与えて送り出す含みも自然に伝える。
- source_word: ἀγγέλους
  choice: 御使いたち
  rationale: 終末論的文脈では人間の使者ではなく天的存在を指すため、現代日本語の聖書文体で明確な「御使い」とした。
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: 大きく響くラッパとともに
  rationale: μετάの随伴の意味とラッパのイメージを保ちつつ、μεγάληςがここで音の強さ・盛大さを示し得ることを自然な日本語で表した。原文は字義的には「大きなラッパ」とも取れるため、脚注で示した。
- source_word: ἐπισυνάξουσιν
  choice: 集める
  rationale: 接頭辞を含む動詞の「一つに集める」という意味は、日本語の「集める」で文脈上十分に伝わる。複数主語が明確になるよう「御使いたちは」を補った。
- source_word: ἐκλεκτούς
  choice: 選ばれた者たち
  rationale: 語の基本的意味を明瞭に伝え、特定の教派的な体系を訳語だけで持ち込まない表現とした。
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: 四方の風から
  rationale: 「四つの風」という聖書的イメージと、あらゆる方角を示す慣用的意味の双方を保つ簡潔な表現とした。
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: 天の果てから果てまで
  rationale: 両極を挙げて全範囲を表す原文の表現を、自然で荘重な日本語にした。「天」は日本語では単数形でも広がり全体を表せる。
theological_decisions:
- issue: 終末論的文脈におけるἐκλεκτούςの訳し方
  choice: 選ばれた者たち
  alternative: 選民
  rationale: 本文は彼らが誰であるかを後代の組織神学の枠組みで詳述していない。「選ばれた者たち」は語義を保ちながら、訳語による教派的限定を避ける。
- issue: 集められる範囲を示す比喩
  choice: 四方の風から、天の果てから果てまで
  alternative: あらゆる方角から、世界の隅々まで
  rationale: 地理的説明へ狭く言い換えず、原文の宇宙的で詩的な広がりを保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、終末の場面にふさわしい簡潔で格調ある調子を保った。「御使い」は一般読者にも理解できる聖書語として用い、「選民」のように教義的含意が前面に出やすい語は本文では避けた。
