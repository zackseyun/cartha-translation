  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: ja
  text: その時、世界の初めから今に至るまで起こったことがなく、今後も決して起こらないほどの大きな苦難[a]が起こるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな苦しみ」または「大きな患難」とも訳せる。ギリシア語は、激しい困難、圧迫、苦しみを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: その時……からです
  rationale: τότεを「その時」とし、γάρの前節に対する説明の働きを文末の「からです」で自然に表した。
- source_word: θλῖψις μεγάλη
  choice: 大きな苦難
  rationale: θλῖψιςが表す激しい苦しみ、圧迫、困難を、現代日本語で明瞭かつ重みのある「苦難」とした。「大患難」のように特定の終末論的体系を想起させやすい表現は本文では避けた。
- source_word: οἵα
  choice: ……ほどの
  rationale: 過去にも未来にも類例がないという質と程度の比較を、日本語で自然な連体修飾として表した。
- source_word: γέγονεν
  choice: 起こったことがなく
  rationale: γίνομαιの出来事的な意味と、現在までに生じたことがないという完了形の射程を表した。
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: 世界の初めから今に至るまで
  rationale: κόσμοςを文脈上そのまま「世界」とし、時間的範囲を明確に表した。「創造」は本文に明示されていないため補わなかった。
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: 今後も決して起こらない
  rationale: οὐ μήによる強い未来否定を「決して」で表し、「今後も」によって前半との時間的対照を明確にした。
- source_word: ἔσται
  choice: ある
  rationale: 苦難の到来を表す存在構文として、簡潔で自然な日本語にした。
theological_decisions:
- issue: 終末論的含意を持つθλῖψιςの訳語
  choice: 苦難
  alternative: 患難／苦しみ／苦境
  rationale: 文脈上の重大さを保ちながら、特定の終末論的区分を訳文に持ち込まないため「苦難」とした。語が持つ圧迫や苦しみの幅は脚注で示した。
- issue: 未曾有性を表す未来否定
  choice: 今後も決して起こらない
  alternative: 二度と起こらない
  rationale: ギリシア語の強い否定を保持しつつ、「二度と」によって同一事象の反復という解釈を過度に強めない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教的・教派的な専門語を避けつつ、イエスの言葉の厳粛さを保った。γάρは日本語として自然な文末の「からです」で表現した。
