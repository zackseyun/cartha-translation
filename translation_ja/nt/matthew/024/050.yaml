  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: ja
  text: その奴隷の主人は、彼が予期していない日に、彼の知らない時刻に来る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἥξει
  choice: 帰って来る
  rationale: ἥκωは「来る、到着する」の意。直前の文脈では主人の帰還が想定されているため、日本語では「帰って来る」が自然である。
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  choice: そのしもべの主人
  rationale: κύριοςはここではたとえの中の人間の主人を指す。δοῦλοςは隷属的な奉仕関係を表すが、現代日本語で本文を明瞭かつ過度に限定せず伝えるため「しもべ」とした。
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: 彼が予想していない日に
  rationale: 不定の「日」を保ち、προσδοκάωの期待・予期する意味を自然な現代日本語で表した。代名詞「彼」は主人ではなく、しもべを指す。
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: 知らない時刻に
  rationale: ὥραを「時刻」とし、先行する「日」との時間的な並行を保った。「彼が」は日本語では重複を避けても主語が明らかであるため省略した。
theological_decisions:
- issue: κύριοςを人間の主人として訳すか、神的称号を連想させる語で訳すか
  choice: 主人
  alternative: 主
  rationale: 節の直接的な物語世界では、κύριοςはしもべに対する人間の主人を指す。たとえの終末論的含意を否定せず、語句そのものに神的称号を先取りして持ち込まない。
- issue: δοῦλοςの社会的身分を日本語でどう表すか
  choice: しもべ
  alternative: 奴隷
  rationale: δοῦλοςには隷属的身分が含まれるが、「しもべ」は聖書的文脈で主人との従属関係を示しつつ、本文の焦点である不意の帰還を自然に伝える。「奴隷」は歴史的社会身分をより明示する代案である。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。κύριοςとδοῦλοςの関係は「主人／しもべ」で表し、たとえとしての品位を保った。原文の「日／時」の並行を「日／時刻」として維持した。
