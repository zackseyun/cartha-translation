  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: ja
  text: しかし、その日、その時については、だれも知らない。天にいる天使たちも、子も[a]知らない。ただ父だけが知っている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本には「子も」がありません。本文はSBLGNTの読みを採用しています。
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: しかし、…については
  rationale: περί＋属格の話題提示を「については」で表し、δέが直前との対照を示すため「しかし」を添えた。
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: その日、その時
  rationale: 一つの指示語が結合された「日」と「時」にかかる。日本語では「その日、その時」が自然で、特定の時点を指す表現として明瞭である。
- source_word: οὐδεὶς οἶδεν
  choice: だれも知らない
  rationale: οὐδείςの全面的否定と、現在の意味を持つοἶδαを、明快な現代日本語で表した。
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: 天の御使いたちも…知らず
  rationale: οὐδέによる追加的で強調された否定を、日本語の「も…知らず」で自然に表現した。τῶν οὐρανῶνは慣用的に「天の」とした。
- source_word: οὐδὲ ὁ υἱός
  choice: 子も知らず
  rationale: 先行する否定項目と並列であることを保った。定冠詞を伴う称号ὁ υἱόςは、文脈上「子」とした。
- source_word: εἰ μὴ
  choice: ただ…だけ
  rationale: 否定文の後の除外を示すため、条件の「もし…でなければ」ではなく、日本語として自然な限定表現にした。
- source_word: ὁ πατὴρ μόνος
  choice: ただ父だけが知っておられる
  rationale: μόνοςによる排他的限定を「ただ…だけ」で明示した。「父」は神を指す称号として扱い、敬意を示す述語を用いた。
theological_decisions:
- issue: 「子も知らず」がもたらすキリスト論上の緊張
  choice: 「子も知らず」を本文にそのまま残し、説明的な言い換えで弱めない。
  alternative: 一部写本に従って句を省く、または神学的緊張を和らげる補足を本文に加える。
  rationale: SBLGNT本文はοὐδὲ ὁ υἱόςを含むため、その読みを忠実に訳した。子の神性との関係を翻訳内で解消せず、原文が持つ緊張を保持した。
translation_notes:
  register: 明快な現代標準日本語を用いた。「御使い」は聖書的な品位を保ちつつ一般読者にも理解できる語として採用した。文を二つに分け、否定の範囲と、父だけを例外とする構造を明瞭にした。
