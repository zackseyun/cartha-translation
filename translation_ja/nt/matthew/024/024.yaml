  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: ja
  text: 偽メシアたちと偽預言者たちが現れ、もし可能なら選ばれた者たちさえも惑わすほどの、大きなしるしと不思議な業を行うからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もし可能なら」は、選ばれた者たちが実際に惑わされうるかどうかを断定していません。別訳「できることなら」「もしできるものなら」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: 現れ
  rationale: ここでは人々が歴史の舞台に登場することを表す慣用的な受動形であり、復活や、何者かによって立てられることを不必要に示唆しない自然な訳とした。
- source_word: ψευδόχριστοι
  choice: 偽メシアたち
  rationale: Χριστόςはここで固有名のようではなく称号として機能しているため、「偽キリスト」よりもユダヤ的・称号的な意味を明瞭に保つ。
- source_word: ψευδοπροφῆται
  choice: 偽預言者たち
  rationale: 複合名詞の意味を標準的かつ直接に訳した。
- source_word: δώσουσιν σημεῖα μεγάλα καὶ τέρατα
  choice: 大きなしるしや不思議な業を行い
  rationale: δίδωμιは字義的には「与える」だが、この語の組み合わせでは「行う」が自然である。σημεῖαは証拠的・象徴的含意を残す「しるし」、τέραταは驚異を表す「不思議な業」とした。καίは日本語の自然な並列として「や」で表した。
- source_word: ὥστε πλανῆσαι
  choice: 惑わそうとする
  rationale: ὥστε＋不定詞が表しうる意図または帰結を過度に限定せず、文脈上の企図を自然な日本語で表す。「惑わす」は単なる虚偽の告知だけでなく、正しい道から迷わせる含みを持つ。
- source_word: εἰ δυνατὸν
  choice: できることなら
  rationale: 簡潔な条件表現をそのまま保ち、「もし可能であるなら」のような不自然さを避けつつ、反事実性を訳文に付加しない。
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: 選ばれた者たちさえも
  rationale: καίの強意的な働きを「さえも」で示した。ἐκλεκτούςは現代の一般読者にも明瞭な「選ばれた者たち」とし、専門用語的な「選民」を避けた。
theological_decisions:
- issue: ψευδόχριστοιにおけるΧριστόςの称号性
  choice: 偽メシアたち
  alternative: 偽キリストたち
  rationale: この箇所では称号としての用法が前面に出ているため、「メシア」と訳して当時の待望との関係を保った。
- issue: εἰ δυνατὸνが選ばれた者について持つ含意
  choice: できることなら
  alternative: もしできるものなら
  rationale: ギリシア語は単に条件を述べており、選ばれた者が最終的に惑わされうるかどうかを明言していない。反事実性を強めず、神学的緊張を保持した。
- issue: ὥστε πλανῆσαιの目的・結果の幅
  choice: 惑わそうとする
  alternative: 惑わすほどである
  rationale: 不定詞構文は目的または自然な帰結として理解しうる。文脈に合う自然な日本語を選びつつ、実際に選ばれた者が惑わされたと断定しない表現にした。
translation_notes:
  register: 明瞭で現代的ながら荘重さを保つ文体。「しるし」は聖書的な重要語として保持し、「選ばれた者たち」は一般読者に分かりやすい表現とした。主節の理由を示すγάρは、前後のつながりを保つため文末の「からです」で表した。
