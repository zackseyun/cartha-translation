  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: ja
  text: その日々、妊婦や乳飲み子に乳を飲ませている女性には、災いだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「胎内に子を宿している女性、および乳を飲ませている女性」。
    reason: 語句の別訳
lexical_decisions:
- source_word: οὐαὶ
  choice: なんと災いなことか
  rationale: 迫り来る苦難を告げる預言的な嘆きと強い感嘆を保ちつつ、現代日本語で自然に表した。
- source_word: δὲ
  choice: だが
  rationale: 直前の警告を受けた緩やかな転換を示す。強すぎる対立にはしない。
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: 身重の人
  rationale: 「胎内に持つ」という慣用句が妊娠を指すことを、簡潔で品位ある現代日本語にした。
- source_word: ταῖς θηλαζούσαις
  choice: 乳飲み子を抱える人
  rationale: θηλάζωが乳児に乳を飲ませることを表すため、日本語ではその養育状況を自然に明示した。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: その日々には
  rationale: 指示性と時間的な継続を保つ素直な訳。
theological_decisions:
- issue: 女性形の与格・分詞が指す対象
  choice: 本文では「身重の人」「乳飲み子を抱える人」と訳す
  alternative: 「妊娠している女性」「乳飲み子に乳を飲ませている女性」
  rationale: ギリシア語の女性形が女性を指すことは明白だが、日本語では状態を示す表現だけでも意味が自然に伝わる。焦点を、苦難の際に特に困難を負う状態に置いたままにする。
translation_notes:
  register: 明瞭で現代的ながら、警告と嘆きの荘重さを保った。「なんと災いなことか」は οὐαί の感嘆的・預言的な力を示す。
