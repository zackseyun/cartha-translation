  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: ja
  text: 死体があるところには、ハゲワシ[a]が集まる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「鷲」。ギリシア語は「鷲」を指すこともあるが、ここでは死体の周りに集まる鳥という描写から「ハゲワシ」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: ある所には、どこにでも
  rationale: ὅπου＋ἐάν＋接続法が表す不定の関係を、自然な現代日本語で「どこにでも」と表した。
- source_word: πτῶμα
  choice: 死体
  rationale: 倒れた死者の体、すなわち死体を指す語であり、人にも動物にも限定しない原文の幅を保てる。
- source_word: συναχθήσονται
  choice: 集まる
  rationale: 形態上は未来受動形だが、鳥が一か所に集まることを表す文脈では、日本語の自動詞「集まる」が自然である。
- source_word: ἀετοί
  choice: はげわし
  rationale: この語は通常「鷲」を指し得るが、死体の周りに集まる鳥という像には「はげわし」が最も自然に合う。語義上可能な「鷲」は脚注に残した。
theological_decisions:
- issue: ことわざ的な比喩の終末論的意味
  choice: 死体と鳥の像をそのまま訳し、何を象徴するかは明示しない。
  alternative: 避けられない裁き、人の子の到来の明白さ、エルサレム滅亡またはローマ軍旗への言及として訳文中で特定する。
  rationale: 原文は死体や鳥が何を象徴するかを明示していないため、特定の解釈を本文に持ち込まず、神学的な緊張と曖昧さを保つ。
translation_notes:
  register: 明快で現代的かつ格調を保った日本語。「死体」は直接的だが原語に忠実。「ある所には、どこにでも」によって不定の意味を自然に示した。
