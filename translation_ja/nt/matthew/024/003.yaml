  to: イエスがオリーブ山に座っておられると、弟子たちだけでイエスのもとに来て言った。「お聞かせください。これらのことは、いつ起こるのですか。また、あなたが来られること[a]と、この時代の終わり[b]を示すしるしは何ですか。」
