id: MAT.24.3
reference: Matthew 24:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: ja
  text: イエスがオリーブ山に座っておられると、弟子たちだけでイエスのもとに来て言った。「お聞かせください。これらのことは、いつ起こるのですか。また、あなたが来られること[a]と、この時代の終わり[b]を示すしるしは何ですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの到来」または「あなたの臨在」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「この時代の完成」。伝統的には「世の終わり」とも訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: イエスが……座っておられると
  rationale: 属格独立構文を自然な時の節として訳し、継続中の動作を表した。日本語では指示対象を明確にするため「イエス」を補った。
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: オリーブ山
  rationale: 日本語で定着した地名を用いた。
- source_word: προσῆλθον αὐτῷ
  choice: みもとに来て
  rationale: イエスの方へ近づいた動きを、敬意を保つ自然な日本語で表した。
- source_word: κατ’ ἰδίαν
  choice: ひそかに
  rationale: ほかの人々から離れた私的な場面を簡潔に表す。
- source_word: Εἰπὸν ἡμῖν
  choice: お聞かせください
  rationale: 命令形による依頼を、弟子がイエスに語る場面にふさわしい丁寧で自然な表現とした。
- source_word: πότε ταῦτα ἔσται
  choice: それらのことは、いつ起こるのですか
  rationale: 未来の出来事を尋ねる意味を明瞭にしつつ、複数の指示内容を「それらのこと」で保持した。
- source_word: σημεῖον
  choice: 前兆
  rationale: 終末についての問いであるため、単なる標識ではなく、到来を予告・識別させるしるしという文脈上の意味を自然に表した。
- source_word: παρουσίας
  choice: 来られること
  rationale: 未来の到来を指す文脈を明瞭にしつつ、原語が持ちうる「到着」「臨在」の幅は脚注に残した。
- source_word: συντελείας
  choice: 終わり
  rationale: 完成・完結の含意を持つ語を、現代日本語で最も明瞭な「終わり」とした。別訳は脚注に示した。
- source_word: αἰῶνος
  choice: 時代
  rationale: 物理的な世界そのものではなく、ある時代・世を指す語義を優先し、「世界」とは訳さなかった。
theological_decisions:
- issue: 終末論的文脈における παρουσία の訳
  choice: 来られること
  alternative: 到来／臨在
  rationale: 将来のイエスの到来を尋ねる文脈では「来られること」が明瞭である。ただし原語は到着後の存在・臨在を含みうるため、その語義的幅を脚注で保持した。
- issue: συντελείας τοῦ αἰῶνος の訳
  choice: この時代の終わり
  alternative: この時代の完成／世の終わり
  rationale: 原文は物理的世界の滅亡を明記せず、時代の完結を述べる。「この時代の終わり」はその区別を保ちながら自然である。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。弟子からイエスへの依頼には丁寧語を用いた。「来られること」と「時代の終わり」は解釈を過度に限定せず、語義上の別案を脚注に残した。
