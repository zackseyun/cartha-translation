  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: ja
  text: しかし、あなたがたが逃げるのが冬にも安息日にも当たらないように祈りなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύχεσθε
  choice: 祈りなさい
  rationale: 現在命令形の二人称複数。継続的に祈る含みはあり得るが、日本語では文脈に委ね、自然な命令表現とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の警告を受けた緩やかな対照・展開を明確に示す。
- source_word: ἵνα μὴ γένηται
  choice: ならないように
  rationale: 祈りの内容を示すἵναと接続法を、自然な日本語の願望・目的表現で訳した。
- source_word: ἡ φυγὴ ὑμῶν
  choice: あなたがたが逃げるのが
  rationale: φυγήの「逃走・逃げること」を動詞的に表現し、成功した脱出まで含意し得る「避難」「脱出」は避けた。
- source_word: χειμῶνος
  choice: 冬に
  rationale: 時を表す属格を、季節を示す自然な日本語にした。
- source_word: μηδὲ σαββάτῳ
  choice: 安息日にも
  rationale: 先行する否定に第二の状況を加えるμηδέを「にも」で対応させ、時を表す与格を自然に訳した。
theological_decisions:
- issue: σαββάτῳの定冠詞性
  choice: 安息日
  alternative: ある安息日／その安息日
  rationale: ギリシア語は無冠詞だが、日本語には冠詞がなく、「安息日」が特定・不特定のいずれかを不必要に確定しない自然な訳となる。英語訳で必要となる冠詞の別訳注は、日本語では意味のある差を生まないため設けなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語。原文の簡潔な命令と、冬・安息日という二つの困難な時期の並列を保った。
