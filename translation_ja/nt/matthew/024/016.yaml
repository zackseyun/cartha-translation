lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 出来事の時間的な展開を示す副詞。文脈に自然で、時間の前進を明確に表す。
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ユダヤにいる人々
  rationale: 前置詞句を伴う冠詞が人々を指す名詞句として機能している。所在地を明示しつつ、対象を過度に限定しない自然な日本語。
- source_word: Ἰουδαίᾳ
  choice: ユダヤ
  rationale: 地域名の日本語での慣用表記。ここでは地理的地域を指すことが文脈上明らかである。
- source_word: φευγέτωσαν
  choice: 逃げなさい
  rationale: 三人称複数の現在命令形。日本語では引用された命令を直接かつ自然に表し、警告の切迫感も保つ。
- source_word: ἐπὶ τὰ ὄρη
  choice: 山々へ
  rationale: 移動を表す動詞とともに用いられたἐπί＋対格は、向かう先を示す。ὄρηの複数形を「山々」として保持した。
theological_decisions:
- issue: 終末に関する警告における命令形の強さ
  choice: 切迫した直接命令として「逃げなさい」と訳す
  alternative: 「山々へ逃げるように」と、より間接的に訳す
  rationale: 実際の行動を命じる原文の命令形を自然な現代日本語で保ち、特定の終末論的解釈は加えない。
translation_notes:
  register: 明瞭で現代的かつ威厳のある標準日本語。命令の緊迫感を保ちながら、特定の教派的解釈を加えていない。
