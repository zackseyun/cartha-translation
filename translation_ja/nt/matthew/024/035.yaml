  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ja
  text: 天と地は過ぎ去る。しかしわたしのことばは決して過ぎ去らない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「決して……ない」に当たるギリシャ語は、否定を強調する表現。別訳「絶対に過ぎ去ることはない」。
    reason: 強調否定の語法と可能な別訳を示すため。
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天と地
  rationale: 終末論的な対句では、単なる「空」と特定の「土地」ではなく、現在の被造世界全体を指す自然な表現である。
- source_word: παρελεύσεται
  choice: 過ぎ去る
  rationale: 現在の天と地が存続しなくなることを表し、その様態を必要以上に限定せず、原文の荘重さを保つ。
- source_word: δὲ
  choice: しかし
  rationale: 過ぎ去る天と地と、決して過ぎ去らないイエスのことばとの明確な対比を示す。
- source_word: οἱ λόγοι μου
  choice: わたしのことば
  rationale: イエスが語った発言や教えを広く指す。日本語では「ことば」が自然であり、複数の内容を集合的に表せる。
- source_word: οὐ μὴ παρέλθωσιν
  choice: 決して過ぎ去らない
  rationale: οὐ μήとアオリスト接続法による強い否定を、明瞭で格調のある現代日本語で表す。
theological_decisions:
- issue: イエスのことばの永続性についての主張
  choice: 天と地の過ぎ去ることと対照させ、イエスのことばが決して過ぎ去らないと強く断言する。
  alternative: イエスの神的権威などの教理的含意を訳文で明示する。
  rationale: 原文が持つ重い主張と対比はそのまま保ちつつ、本文が明言していない教理的説明を訳文に加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、簡潔で荘重な宣言調を保った。「天と地」「過ぎ去る」「ことば」は聖書的な響きを持つが、一般の読者にも理解しやすい表現である。
