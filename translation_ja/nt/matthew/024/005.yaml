id: MAT.24.5
reference: Matthew 24:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: ja
  text: というのも、多くの者がわたしの名を名乗って現れ、「わたしがメシアだ」と言い、多くの人を惑わすからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの者
  rationale: 不特定多数の人を表す主語として、明確で自然な訳。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 直前の警告に理由を添える説明的な接続を、現代日本語で自然に示す。
- source_word: ἐλεύσονται
  choice: 現れ
  rationale: 単なる移動ではなく、偽の主張を携えて登場する文脈に合う自然な表現。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: わたしの名を名乗って
  rationale: イエスの名や身分を自称して来る意味を日本語で明瞭に表す。『わたしの名によって』では、正当な権威を受けて来るとの誤解を招きうる。
- source_word: λέγοντες
  choice: と言い
  rationale: 分詞が導く発言内容を、解釈を加えず簡潔に示す。
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: 「わたしがメシアだ」
  rationale: χριστόςはここでは固有名ではなく、終末的な救済者としての称号を自称する語なので『メシア』とした。
- source_word: πλανήσουσιν
  choice: 惑わす
  rationale: 欺いて正しい道から逸らすというπλανάωの意味を、簡潔で聖書本文にふさわしい現代日本語で表す。
- source_word: πολλοὺς
  choice: 多くの人
  rationale: 目的語であることを明瞭にし、主語の『多くの者』との混同を避ける自然な訳。
theological_decisions:
- issue: 偽の救済者によるχριστόςの自称
  choice: メシア
  alternative: キリスト
  rationale: 定冠詞を伴うὁ χριστόςはここで称号として用いられ、偽の名乗り手が『約束されたメシア』だと主張する意味である。日本語では『キリスト』が固有名のように受け取られやすいため、称号性を明確にする『メシア』を採用した。
- issue: ἐπὶ τῷ ὀνόματί μουが示す偽称の性格
  choice: わたしの名を名乗って
  alternative: わたしの名によって
  rationale: 文脈では、来る者たちがイエスの身分を自らに当てはめて『わたしがメシアだ』と主張する。正当な委任を含意しやすい代案を避けつつ、原文の名への依拠を表した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言としての品位を保った。γάρの説明的機能は『というのも……からです』で保持した。主語と目的語の双方にπολύςがあるため、『多くの者』『多くの人』と訳し分けて読みやすくした。
