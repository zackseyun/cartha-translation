  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: ja
  text: その時、もしだれかがあなたがたに、「見よ、ここにメシアがいる」、あるいは、「ここにいる」と言っても、信じてはいけません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。また、二つ目の「ここにいる」に当たる原文は直訳すると「ここに」で、述語が省かれている。
    reason: 称号Χριστόςの別訳と、第二の楕円的なὧδεの字義を保存するため。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 直前の終末に関する文脈を受ける時間表現として、自然な日本語でつながりを保つ。
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: もしだれかがあなたがたに……と言っても
  rationale: 不特定の主体を示す条件構文を、日本語として自然な譲歩的条件の形で表した。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す間投詞の力を保ちつつ、聖書本文にふさわしい簡潔で格調ある表現とした。
- source_word: ὧδε
  choice: ここに／あそこに
  rationale: 語自体は「ここ」を意味するが、二つの競合する場所の指示として日本語で明瞭にするため、第一を「ここに」、楕円的な第二を「あそこに」とした。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 定冠詞を伴い、期待される油注がれた者という称号として用いられているため、「メシア」とした。
- source_word: μὴ πιστεύσητε
  choice: 信じてはいけません
  rationale: μήを伴う禁止を明確に表す。目的語は日本語では文脈から自然に理解できるため補わなかった。
theological_decisions:
- issue: Χριστόςの称号としての訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、救済者としての身分を主張する称号である。「メシア」はその機能を明確にし、「キリスト」は脚注で示す。
- issue: 第二のὯδεの補い方
  choice: 『あそこにいる』
  alternative: 『ここにいる』／『ここだ』
  rationale: 原文は述語を省いた「ここに」という楕円表現である。日本語では意図された人物を最小限補い、二つの場所を指す警告として自然に伝わる「あそこにいる」とした。ただし原語上は同じ場所副詞であることを脚注に明示する。
translation_notes:
  register: 現代標準日本語を用い、敬体で統一した。「見よ」は注意喚起の強さと本文の格調を保つため採用した。
