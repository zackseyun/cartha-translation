source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: ja
  text: いちじくの木から、このたとえ[a]を学びなさい。その枝がすでに柔らかくなって葉を出すと[b]、夏[c]が近いことが分かります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この教訓」または「この例え話」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「葉が芽吹くと」。
    reason: lexical_alternative
  - marker: c
    text: 「夏」と訳した語は、文脈によっては収穫の季節を指すこともある。ここでは、いちじくの木が示す季節の兆しという意味が最も自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: いちじくの木から
  rationale: ἀπό＋属格が学びの源を示すため、「いちじくの木から」とした。δέの軽い接続的働きは、日本語では文脈上あえて語を補わなくても自然に伝わる。
- source_word: μάθετε
  choice: 学びなさい
  rationale: μανθάνωのアオリスト命令形であり、理解した結果よりも、教訓を受け取るよう促す直接の命令を表す。
- source_word: τὴν παραβολήν
  choice: このたとえ
  rationale: παραβολήの福音書における基本的な意味を保ちつつ、日本語として自然な「たとえ」を採用した。定冠詞は、直後に示される具体的なたとえを指すため「この」で表した。
- source_word: ὅταν ἤδη
  choice: …すると
  rationale: ὅτανは一般的な時・条件を示し、ἤδηは季節の兆しが現れ始めた段階を添える。枝が柔らかくなり葉が出るという日本語表現自体でその開始性が十分伝わるため、自然な条件表現「すると」とした。
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: その枝が柔らかくなって
  rationale: γένηταιの状態変化を「なって」で、ἁπαλόςが表す新しい枝の柔らかさを「柔らかく」で表した。
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: 葉を出す
  rationale: ἐκφύωは芽や葉が生え出ることを表す。「葉を出す」は植物の成長について明瞭で自然な現代日本語である。
- source_word: γινώσκετε
  choice: 分かります
  rationale: 二人称複数の現在直説法として、一般的な認識を表す。命令形にはせず、読み手を含む自然な丁寧体で訳した。
- source_word: ἐγγὺς τὸ θέρος
  choice: 夏が近い
  rationale: θέροςは文脈によって収穫期を指し得るが、ここではいちじくの葉が示す季節の到来が中心なので「夏」とした。
theological_decisions:
- issue: いちじくの木の比喩的意味
  choice: 季節の近さを兆候から知る自然界のたとえとして訳し、いちじくの木が何を象徴するかは訳文で特定しない。
  alternative: いちじくの木をイスラエルの象徴として明示する、または単なる一般的な自然例と断定する。
  rationale: この節のギリシア語本文は、観察できる兆候から時の近さを知るという対応関係を提示するが、いちじくの木の象徴対象を明示していないため、解釈上の幅を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語の丁寧体を用いた。命令の「学びなさい」には適度な格調を保ち、植物の描写は日常的で理解しやすい表現にした。
