  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: ja
  text: そして、自分の仲間である奴隷たち[a]を打ちたたき始め、酒に酔う者たち[b]と一緒に食べたり飲んだりするなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仲間のしもべたち」とも訳せる。ギリシャ語は、同じ主人に仕える奴隷仲間を指し、同じ主人のもとにある共通の身分を強調する。
    reason: alternative_reading
  - marker: b
    text: 「酔っぱらいたち」とも訳せる。ギリシャ語の分詞は、酒に酔うことを特徴とする人々を指す場合がある。
