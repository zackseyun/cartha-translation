lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: 打ちたたき始め
  rationale: ἄρξηταιと不定詞の組み合わせが表す動作の開始を「始め」で示し、τύπτεινは継続・反復する暴力を自然に伝える「打ちたたく」とした。
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: 自分の奴隷仲間たち
  rationale: σύνδουλοςは同じ主人のもとにある「仲間の奴隷」を意味する。「奴隷仲間」は共有された従属的身分を保ち、「自分の」によってαὐτοῦを自然に表した。
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: 食べたり飲んだりする
  rationale: 二つの現在形が描く継続的・特徴的な振る舞いを、現代日本語として自然な並列表現で示した。δὲはここでは強い対照ではなく、行為を続けて挙げる接続として処理した。
- source_word: μετὰ τῶν μεθυόντων
  choice: 酒に酔う者たちと一緒に
  rationale: μεθύωの現在分詞が表す、酒に酔う行為に携わる人々という描写を保った。「酔っぱらいたち」のような固定的なレッテルは本文では避けた。
theological_decisions:
- issue: σύνδουλοςにおける奴隷身分の表現
  choice: 奴隷仲間たち
  alternative: 仲間のしもべたち
  rationale: このたとえでは一人の主人のもとにある共通の身分が重要であるため、社会的現実を明確にする「奴隷」を採用した。一方、奉仕者としての側面を前面に出す訳も脚注に示した。
- issue: μεθυόντωνが示す人物像
  choice: 酒に酔う者たち
  alternative: 酔っぱらいたち
  rationale: 分詞的な描写を保ち、単に一時的に酔っているのか、飲酒にふけることを特徴とする人々なのかを本文で過度に限定しないようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、たとえの厳粛な警告にふさわしい格調を保った。節が前後の条件文の一部であることを自然に示すため、末尾を「するなら、」とした。
