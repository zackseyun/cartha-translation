  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: ja
  text: だから、あなたがたも備えていなさい。人の子は、あなたがたが予想していない時刻[a]に来るからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたが思っていない時刻」。ギリシア語の動詞は「思う」「考える」「予想する」などの意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 直前の警告を受けた因果・推論上のつながりを、現代日本語で明確かつ自然に示す。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: καίの付加・包含と、明示された複数代名詞の強調を過度に重くせず保持する。
- source_word: γίνεσθε ἕτοιμοι
  choice: 備えていなさい
  rationale: 現在命令形が求める継続的な心構えを表す。「準備しなさい」よりも、いつ来てもよい状態を保つという文脈に自然である。
- source_word: ὅτι
  choice: からです
  rationale: 命令の理由を導く因果用法を明確に表す。
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: あなたがたが予想していない時
  rationale: 時間を表す与格構文を自然に訳し、δοκεῖτεの文脈上の含意である「予想する」を本文に採用する一方、より字義的な「思う」は脚注に残す。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書で定着した字義的な称号を用い、セム語的背景とダニエル書との響き、キリスト論的含意を保持する。
- source_word: ἔρχεται
  choice: 来る
  rationale: 現在形の生き生きとした確実性を日本語の非過去形で自然に表し、明示的な未来表現に限定しない。
theological_decisions:
- issue: ὁ υἱὸς τοῦἀνθρώπουというキリスト論的称号の訳
  choice: 人の子
  alternative: 人間なる者
  rationale: 伝統的かつ字義的な「人の子」は、称号の表現、ダニエル書的な響き、福音書における神学的含意を解釈で狭めずに保持する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「備えていなさい」により継続的な待機姿勢を自然に示し、文末の「からです」で命令の理由を明確にした。
