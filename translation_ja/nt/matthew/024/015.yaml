  naturalness: 全体として明瞭な現代標準日本語であり、預言的・引用的文脈にふさわしい格調がある。「荒廃の忌まわしいもの」は日常語としてはやや形式的だが、ダニエル書を反響する定型的で難解な表現を、解釈で平板化せずに維持するために適切である。ダッシュによる挿入句の区切りも読みやすい。
  terminology: 「預言者ダニエル」「荒廃の忌まわしいもの」「聖なる場所」は、固有名・黙示的定型句・場所表現をそれぞれ過度に限定せずに再現している。τόπῳ ἁγίῳについて本文を「聖なる場所」とし、より限定的な「聖所」を脚注に置く処理は、原文の無冠詞性と文脈上の含意の両方に配慮している。脚注bも属格の可能な解釈を提示しつつ本文の曖昧さを保持している。
