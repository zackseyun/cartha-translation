id: MAT.24.15
reference: Matthew 24:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: ja
  text: ですから、預言者ダニエルを通して語られた「荒廃の忌まわしいもの」[b]が、聖なる場所[a]に立っているのを見たなら――読者は悟りなさい――。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖所に」。
    reason: 原文の冠詞のない「聖なる場所」は、文脈上、神殿またはその聖所を指すと理解することもできる。
  - marker: b
    text: 別訳「荒廃をもたらす忌まわしいもの」または「荒廃させる忌まわしいもの」。ダニエル書の表現を踏まえている。
    reason: 属格表現は形式的に「荒廃の」とも、その作用や結果を明示して「荒廃をもたらす」とも訳し得る。
lexical_decisions:
- source_word: Ὅταν
  choice: 見たなら
  rationale: 接続法を伴う将来の時を示す節として、預言的な文脈に自然な条件的時間表現とした。「いつでも」ではなく、予告された出来事が起こる時を指す。
- source_word: οὖν
  choice: ですから
  rationale: 直前の教えを受けた推論・話題の展開を、明瞭な現代日本語で示す。
- source_word: ἴδητε
  choice: 見た
  rationale: ὁράωの基本的な知覚の意味を保ち、過度に「認識する」などと解釈しない。
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: 荒廃の忌まわしいもの
  rationale: 属格構文を保ち、ダニエル書への響きを残す。「荒廃をもたらす」と因果関係を明示せず、原文の曖昧さを維持した。
- source_word: τὸ ῥηθὲν
  choice: 語られた
  rationale: 預言として告げられたことを表す受動分詞を簡潔に訳した。
- source_word: διὰ Δανιὴλ τοῦ προφήτου
  choice: 預言者ダニエルを通して
  rationale: 属格を伴うδιάの媒介・代理の意味を保ち、発言の究極的な源とダニエルという媒介者を不用意に同一視しない。
- source_word: ἑστὸς
  choice: 立っている
  rationale: ἵστημιの完了分詞を直接的に訳し、「据えられている」など特定の設置行為を読み込まない。
- source_word: ἐν τόπῳ ἁγίῳ
  choice: 聖なる場所に
  rationale: 冠詞のないギリシア語を反映し、神殿内の特定区画に限定しない。「聖所に」より広い表現を採用した。
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: 読者は悟りなさい
  rationale: 挿入的な勧告として簡潔に表し、νοέωの理解・洞察への命令を「注意しなさい」に弱めなかった。
theological_decisions:
- issue: τόπῳ ἁγίῳの定性と神殿への限定
  choice: 聖なる場所に
  alternative: 聖所に／その聖なる場所に
  rationale: 神殿を想起させる可能性は高いが、原文には冠詞がなく、特定の神殿区画に限定することは必須ではない。本文では広さを保ち、伝統的な限定訳を脚注に示した。
- issue: βδέλυγμα τῆς ἐρημώσεωςの属格の意味
  choice: 荒廃の忌まわしいもの
  alternative: 荒廃をもたらす忌まわしいもの／荒廃させる忌まわしいもの
  rationale: ダニエル書を反響する定型的・黙示的表現であり、属格が結果・作用を示すと断定せず、神学的および指示対象上の緊張を保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言的発言にふさわしい格調を保った。ダニエル書への引用的な響きと原文の曖昧さを残すため、中心句はやや形式的に訳し、自然な解釈的代案を脚注に置いた。挿入句はダッシュで区切り、読者への直接的な勧告であることを示した。
source_grounding:
  english_pob_role: consult_only
