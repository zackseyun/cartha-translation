source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: ja
  text: というのは、洪水前の日々には、人々はノアが箱舟に入った日まで、食べたり飲んだり、結婚したり、人を結婚させたりしていたように、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς γὰρ
  choice: （文脈上の比較を）そうだったのである
  rationale: γάρの説明的な働きとὡςの比較を、前節から続く日本語として自然に表した。単独節では比較の受け先が前節にあるため、末尾で関係を示した。
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: 洪水前の日々
  rationale: 時間的な範囲を簡潔に示し、ノアの物語との結びつきが明瞭な「洪水」を用いた。
- source_word: ἦσαν … τρώγοντες καὶ πίνοντες
  choice: 人々は食べたり飲んだり…していた
  rationale: 未完了過去と分詞による継続的な行為を「していた」で表した。日本語では主語を補う方が明瞭なため、一般的な人々を指す「人々」を用いた。行為自体への道徳的非難は加えていない。
- source_word: γαμοῦντες
  choice: 結婚したり
  rationale: 一般的な「結婚する」の意味を現代日本語で自然に表し、後続のγαμίζοντεςとの区別を保った。
- source_word: γαμίζοντες
  choice: 嫁がせたり
  rationale: 他者を婚姻させる使役的な意味を表した。歴史的文脈には合うが性別を限定しうるため、語義上の別解を注記する余地がある。
- source_word: ἄχρι ἧς ἡμέρας
  choice: その日まで
  rationale: 継続する日常行為の終点を自然な日本語で示した。
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: ノアが箱舟に入った
  rationale: アオリストの決定的な出来事を簡潔に表現し、κιβωτόςは創世記とのつながりを保つ定着語「箱舟」とした。
theological_decisions:
- issue: 列挙された行為を罪深い放縦として描くか、裁きを知らずに続く通常生活として中立的に描くか
  choice: 食事、飲酒、婚姻を通常の継続的行為として中立的に訳した
  alternative: 享楽や道徳的無頓着を暗示する表現にする
  rationale: ギリシア語の分詞自体には、これらの行為を罪と断定する修飾がない。文脈の焦点は、通常の生活が続く中で裁きが突然来たことにあるため、非難を訳文へ付加しなかった。
- issue: γαμίζοντεςの態を「嫁がせる」とするか「嫁ぐ／結婚させられる」とするか
  choice: 使役的に「嫁がせる」とした
  alternative: 受け身的に「嫁ぐ」または「結婚させられる」とする
  rationale: γαμίζωは通常、誰かを結婚させることを表すため使役的に訳した。ただし伝承上の異読や解釈の幅を不必要に断定しないよう、必要なら注記で代案を示すべき箇所である。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。日常行為の反復は「たり…たり」で自然に表し、原文にない道徳的評価は加えない。「箱舟」は聖書物語との連続性を保つ一般的な表記。
