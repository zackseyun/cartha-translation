  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: ja
  text: というのは、ノアの日々がそうであったように、人の子の到来[a]もそのようになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「臨在」とも訳せる。ギリシア語は「臨在」または「到来」を表しうるが、ここでは人の子の将来の到来を指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: 〜がそうであったように、…もそのようになります
  rationale: 対応する比較構文を明示し、ノアの日々と人の子の到来との類比を自然な現代日本語で保つ。
- source_word: γὰρ
  choice: （訳文では明示しない）
  rationale: 前節を受ける説明の働きは文脈上明らかであり、日本語で「というのは」を置くと単独節として重くなるため、自然さを優先して含意させた。
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: ノアの日々
  rationale: 時代の状況全体を指す原文の表現を簡潔に保つ。「ノアの時代」も自然だが、原文の比喩的な言い回しにより近い。
- source_word: Νῶε
  choice: ノア
  rationale: 日本語聖書で定着した固有名表記を用いる。
- source_word: ἔσται
  choice: なります
  rationale: 未来を表すとともに、到来のありさまがノアの日々と同様になるという比較を、日本語として自然に示す。
- source_word: παρουσία
  choice: 到来
  rationale: ここでは人の子が将来現れる出来事を指すため、「到来」が明瞭である。同語には「臨在」の意味もあり、その幅は脚注に残す。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの称号として日本語で定着しており、ダニエル書との響きも保持する。
theological_decisions:
- issue: 終末論的な文脈における παρουσία の訳
  choice: 到来
  alternative: 臨在
  rationale: 文脈上は人の子が将来来る出来事が前景化しているため「到来」としたが、語が持ちうる継続的な「臨在」の意味を排除しないよう脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ノアの日々」を残して原文の比較表現を保ちつつ、補語「そうであった」を補って日本語として理解しやすくした。脚注記号は本文の文末に置いた。
