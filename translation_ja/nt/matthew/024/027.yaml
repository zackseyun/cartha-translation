source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: ja
  text: なぜなら、稲妻が東から現れ、西にまで見えるように、人の子の到来[a]もまた、そのようになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「臨在」。ギリシア語のπαρουσίαは「臨在」または「到来」を意味し得るが、ここでは文脈上、人の子の将来の到来を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: というのも、…ように
  rationale: γάρの説明的なつながりを「というのも」で示し、ὥσπερの比較を「…ように」で自然に表した。
- source_word: ἡ ἀστραπή
  choice: 稲妻
  rationale: この比喩で指される自然現象を、現代日本語で明確かつ簡潔に表す。
- source_word: ἐξέρχεται ἀπὸ ἀνατολῶν
  choice: 東から現れ
  rationale: ἐξέρχεταιの「出て来る、現れる」という意味と、東西の方向的対照を自然な日本語で保つ。
- source_word: φαίνεται ἕως δυσμῶν
  choice: 西にまで見える
  rationale: φαίνεταιの可視性と、ἕωςが示す到達範囲をともに反映する。
- source_word: οὕτως ἔσται
  choice: もそのようになる
  rationale: 前半の比較を受けるοὕτωςと、未来を示すἔσταιを明示した。
- source_word: ἡ παρουσία
  choice: 到来
  rationale: この終末論的文脈では、将来の来臨・到着という出来事を簡潔に表す。「存在」「臨在」の語義も脚注に残す。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子
  rationale: ダニエル書との間テクスト的な響きと、福音書で定着した称号を保持する。
theological_decisions:
- issue: 終末論的な言明におけるπαρουσίαの訳語
  choice: 到来
  alternative: 臨在、存在、来臨
  rationale: 稲妻の公然として明白な現れとの比較から、ここでは将来の到来という出来事の意味が前景化している。ただし語が「存在」「臨在」をも意味し得ることは脚注で保持し、語義上の幅を消さない。
translation_notes:
  register: 明快な現代標準日本語を用い、説明を加えすぎず、原文の因果的接続、東から西までの広がり、比較構文、未来の意味を保持した。敬体は周辺文脈との調和を想定した、自然で品位ある聖書本文の調子である。
