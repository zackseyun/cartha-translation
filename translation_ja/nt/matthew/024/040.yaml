  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: ja
  text: その時、二人の男が畑にいる。一人は連れて行かれ[a]、一人は残される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一人は伴って連れて行かれる」。この動詞だけでは、救いのために連れて行かれるのか、裁きのために取られるのかは特定されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 直前の終末的な文脈を受ける時の副詞として、自然かつ簡潔に時のつながりを示す。
- source_word: δύο ἔσονται
  choice: 二人の男が……いる
  rationale: ギリシア語は直訳すれば「二人がいる」だが、後続の εἷς … εἷς は男性形であり、次節の女性二人の例との対比もあるため、男性を指す場面であることを明示した。
- source_word: ἐν τῷ ἀγρῷ
  choice: 畑に
  rationale: 場所を表す句を簡潔に訳した。「野」も可能だが、農作業の場面として現代日本語では「畑」が明瞭である。
- source_word: εἷς
  choice: 一人
  rationale: 人を数える日本語として自然であり、原文の簡潔な対照を保つ。
- source_word: παραλαμβάνεται
  choice: 連れて行かれ
  rationale: 未来の場面を生き生きと描く現在受動形。「連れて行かれる」は、救出か裁きかを本文だけで確定せず、動詞が持つ「伴って行く／引き取る」という意味合いを自然に表せる。
- source_word: ἀφίεται
  choice: 残される
  rationale: この文脈での受動形を直接的に表す。「置き去りにされる」では否定的な含みが強すぎるため避けた。
theological_decisions:
- issue: παραλαμβάνεται が救いのために連れて行かれることを指すのか、裁きのために取られることを指すのか
  choice: 本文では中立的な「連れて行かれ」とし、行き先や目的を特定しない
  alternative: 「救い出される」または「裁きに取られる」と明示する
  rationale: ノアの時代との比較を含む直前の文脈をどう理解するかには議論がある。訳文で特定の終末論的解釈に決着をつけず、原文の緊張と曖昧さを保つ。
- issue: δύο と男性形 εἷς … εἷς の指示対象を日本語で明示するか
  choice: 「二人の男」とする
  alternative: 「二人」とだけする
  rationale: 日本語の「二人」は性別を示さないが、原文の後続語は男性形であり、次節には女性二人の並行例が続くため、原文が描く男性の場面を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、終末について語る文脈にふさわしい簡潔で格調ある調子とした。二つの受動表現を並行させ、原文の鋭い対照を保った。
