id: MAT.24.39
reference: Matthew 24:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: ja
  text: そして、洪水が来て彼らを皆さらって行ったまで、彼らは気づかなかった。人の子の到来も同じようになる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: 何も悟らなかった
  rationale: 単なる情報の欠如よりも、目前の事態を認識しなかったという文脈上の意味を、自然な現代日本語で表す。
- source_word: ὁ κατακλυσμός
  choice: 洪水
  rationale: 直前のノアの物語を受ける定冠詞付きの語であり、日本語では簡潔に「洪水」とする。
- source_word: ἦρεν ἅπαντας
  choice: 彼らをことごとくさらって行く
  rationale: αἴρω の「取り去る」という意味と、洪水による急激な喪失の像を保ち、ἅπαντας の全体性を「ことごとく」で示す。
- source_word: ἡ παρουσία
  choice: 到来
  rationale: ここでは人の子が来る出来事を指す。「来臨」より一般読者に明快でありながら、名詞としての重みを保つ。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書における定着した称号をそのまま保つ。
theological_decisions:
- issue: οὐκ ἔγνωσαν が示す認識の内容
  choice: 何も悟らなかった
  alternative: 知らなかった
  rationale: 何を知らなかったかは本文で明示されないため補足説明は加えず、終末への無自覚という文脈的含意のみを自然に表した。
- issue: ἦρεν の含意
  choice: さらって行く
  alternative: 取り去る
  rationale: 救済的な「取り去り」と誤読されにくく、洪水が全員を滅ぼす文脈上の方向性を示す。ただし本文にない「滅ぼした」とまでは明示しない。
- issue: οὕτως ἔσται καὶ の比較構造
  choice: 人の子の到来も、そのようになる
  alternative: そのように、人の子の到来がある
  rationale: καί の「も」を明示し、洪水以前の人々の無自覚と人の子の到来との類比を保つ。類比の範囲を本文以上に限定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。前節から続く叙述として冒頭の「そして」を残し、「ことごとく」によりἅπανταςの強調を表した。
