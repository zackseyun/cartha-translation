  source_fidelity: 「何も悟らなかった」はοὐκ ἔγνωσαν（知らなかった／気づかなかった）の目的語を「何も」として不必要に拡大している。また、洪水が「来て」「さらって行った」という完了した出来事であるため、過去形でそろえるのが原文の叙述に忠実である。
  naturalness: 「洪水が来て彼らをことごとくさらって行くまで」は、歴史的出来事の叙述として「行く」がやや不自然である。「皆をさらって行ったまで」とすると、自然で明快な現代標準日本語になる。
  terminology: 「洪水」「人の子」「到来」はいずれも適切である。「人の子の到来も同じようになる」はκαὶおよびοὕτωςの比較を自然に表す。
