id: MAT.24.14
reference: Matthew 24:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: ja
  text: そして、この神の国の良い知らせは、すべての国々に対する証しとして、全世界で告げ知らされます[a][b]。それから、終わりが来ます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この御国の福音」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「人の住む全世界で」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: 宣べ伝えられる
  rationale: 権威ある知らせを公に告げ広めることを表す未来受動形。「宣べ伝える」は現代日本語でも理解でき、単なる私的な伝達ではなく公的な宣言という含みを保つ。
- source_word: τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας
  choice: この御国の福音
  rationale: 指示語「この」と属格「御国の」を保った。「福音」は定着した聖書語であり、脚注で「良い知らせ」という透明な言い換えを示す。βασιλείαは文脈上、神の王としての支配とその領域の両面を持ちうるため、簡潔な「御国」とした。
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: 全世界に
  rationale: οἰκουμένηは人の住む世界を指す。「全世界に」は自然な現代日本語で普遍的な広がりを伝えつつ、脚注でより字義的な表現を示す。
- source_word: εἰς μαρτύριον
  choice: 証しとして
  rationale: 目的または結果を表し、宣教が証言として機能することを示す。誰に有利または不利な証しなのかは本文が明示しないため限定しない。
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: すべての国々への
  rationale: ἔθνηの広い意味を「国々」で保ち、ユダヤ人と対比した「異邦人」に限定しない。与格を「への」と訳し、証しが諸国民に向けられる関係を自然に示す。
- source_word: ἥξει τὸ τέλος
  choice: 終わりが来る
  rationale: 語順は日本語として自然に整えつつ、ἥξειとτὸ τέλοςを簡潔に対応させた。「終末」など特定の体系を連想させる専門語は避けた。
theological_decisions:
- issue: οἰκουμένηとἔθνηが示す範囲
  choice: 「全世界」「すべての国々」として普遍的な広がりを保つ。
  alternative: οἰκουμένηを第一世紀のローマ世界に限定する、またはἔθνηを民族集団という後代の宣教学的区分に限定する。
  rationale: 本文は広範な宣教を述べるが、その正確な地理的範囲、成就の時点、終末の時間表を定義していないため、特定の解釈体系に狭めない。
- issue: εἰς μαρτύριονの証しの性格
  choice: 「証しとして」とし、目的と結果の両方に開かれた表現を保つ。
  alternative: 「彼らを救うための証し」または「彼らを罪に定める証拠」と明示する。
  rationale: 原文は証しが救済的か審判的かをここで明示していないため、その神学的緊張を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御国」「福音」「宣べ伝える」は聖書文体として広く通用する語だが、難解さを補うため「福音」とοἰκουμένηの字義的な別訳を脚注に示した。原文の二つのκαίは「そして」「それから」で流れを明示した。
