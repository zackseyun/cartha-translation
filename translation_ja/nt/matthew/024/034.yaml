reference: Matthew 24:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: ja
  text: まことに、あなたがたに言います。この世代が、これらすべてのことが起こるまでに過ぎ去ることは、決してありません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この民」または「この民族」。ギリシア語はより広い意味にも理解できるが、ここでは「世代」が最も直接的な訳である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: イエスの厳粛な断言を導く語として、音写の「アーメン」ではなく、意味を明瞭かつ自然な現代日本語で表した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接的な語りかけを保ちつつ、現代標準語として自然にした。
- source_word: ὅτι
  choice: （句点で内容節を導く）
  rationale: 日本語では接続語を明示せず、断言の定型句の後を文として区切ることで内容を自然かつ明瞭に示せる。
- source_word: οὐ μὴ παρέλθῃ
  choice: 決して過ぎ去りません
  rationale: οὐ μήと接続法による強い否定を「決して」で明示し、παρέρχομαιの比喩的な意味を「過ぎ去る」で保持した。
- source_word: ἡ γενεὰ αὕτη
  choice: この世代
  rationale: γενεάの最も直接的で通常の意味を採り、終末論上の解釈を本文で決めつけないようにした。
- source_word: ἕως ἂν
  choice: までは
  rationale: 将来の出来事を限界点として示す構文を、日本語の自然な時間表現で表した。
- source_word: πάντα ταῦτα
  choice: これらのことがすべて
  rationale: 指示詞と複数の出来事の総体を明示し、文脈上挙げられた事柄を指すことが分かる形にした。
- source_word: γένηται
  choice: 起こる
  rationale: この文脈のγίνομαιは出来事の発生を表すため、明快な現代語の「起こる」とした。
theological_decisions:
- issue: 終末についての談話における「この世代」（ἡ γενεὰ αὕτη）の意味
  choice: 本文では「この世代」と訳し、指示対象を解釈によって限定しない。
  alternative: 「この民」または「この民族」など、より広い集団を指す読み。
  rationale: 最も直接的な語義を本文に置き、イエスと同時代の人々、ある民、民族などをめぐる解釈上・終末論上の緊張を翻訳によって解消しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「まことに」と「決して」により原文の厳粛さと強い否定を表し、古風すぎる言い回しは避けた。脚注記号[a]は本文中に配置した。
