id: MAT.24.33
reference: Matthew 24:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: ja
  text: 同じように、あなたがたも、これらすべてを見たとき、それ[a]が近く、戸口のところにあることを知りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼が近く、戸口のところにいる」とも訳せる。ギリシア語では主語が明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同じように、あなたがたも
  rationale: 直前のいちじくの木のたとえとの対応を示すοὕτωςと、弟子たちを対応する観察者として強調するκαὶ ὑμεῖςを、自然な現代日本語で保つ。
- source_word: ὅταν ἴδητε
  choice: 見たなら
  rationale: ὅτανとアオリスト接続法による将来の時を表す構文を、反復を強調せず、条件を伴う自然な日本語で表す。
- source_word: πάντα ταῦτα
  choice: これらすべて
  rationale: 中性複数の指示内容を保ち、「出来事」などの説明語を補って解釈を狭めない。
- source_word: γινώσκετε
  choice: 知りなさい
  rationale: 現在命令法の命令・勧告の力を直接表し、「悟りなさい」などの解釈的な表現を避ける。
- source_word: ἐγγύς ἐστιν
  choice: それが近く
  rationale: ギリシア語では主語が明示されていないため、本文では中立的な「それ」を用い、指示対象を断定しない。
- source_word: ἐπὶ θύραις
  choice: 戸口まで来ている
  rationale: 複数形θύραιςを日本語の自然な慣用表現にしつつ、目前に迫った近さを伝える。日本語では「戸口」は通常単数形で場所を表し、数の区別を明示しない。
theological_decisions:
- issue: ἐγγύς ἐστινの省略された主語
  choice: 本文を「それが近く」とし、指示対象を確定しない
  alternative: 「その方が近くにいる」または「彼が近くにいる」
  rationale: 原文は主語を明示せず、人である子を指す可能性と、到来する出来事・終末などを指す可能性の双方を許す。本文と脚注でこの真正な曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ格調を保った標準語。「あなたがた」「知りなさい」で弟子たちへの直接の語りかけと命令形を示した。脚注標識[a]は該当文の末尾に置いた。
