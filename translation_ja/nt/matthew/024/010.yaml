source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: ja
  text: その時、多くの人がつまずき[a]、互いに裏切り[b]、憎み合う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「つまずかされる」。文脈上、「信仰から離れる」、または「不快に思う」という意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: または「互いを引き渡し」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 終末についての談話の中で、先行する出来事を受けた時点を示す。現代日本語として自然で、文脈との連続も明確である。
- source_word: σκανδαλισθήσονται
  choice: つまずき
  rationale: この受動形には、つまずかされる、拒絶反応を起こす、信仰から離れるという幅がある。「つまずき」は原語の比喩を保ち、迫害下での深刻な離反を含み得る一方、本文だけで意味を一つに限定しない。
- source_word: πολλοὶ
  choice: 多くの人が
  rationale: 実体詞的に用いられた形容詞を、明瞭な現代日本語にした。
- source_word: ἀλλήλους
  choice: 互いに／憎み合う
  rationale: 相互的な行為を示す代名詞である。日本語では各動詞に適した自然な相互表現を用いた。
- source_word: παραδώσουσιν
  choice: 裏切り
  rationale: 字義的には「引き渡す」だが、迫害と相互の敵意という文脈では、仲間を敵対者側に渡す背信行為を「裏切る」が自然に表す。字義的な選択肢は脚注に残した。
- source_word: μισήσουσιν
  choice: 憎み合う
  rationale: μισέωの能動的な敵意と、ἀλλήλουςの相互性を簡潔に表す。
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: その時、…、…、…
  rationale: 日本語では接続詞を逐一反復せず、読点で累積的な進行を自然に示した。三つの動作の連続と高まりは保持している。
theological_decisions:
- issue: 終末の迫害という文脈におけるσκανδαλισθήσονταιの意味
  choice: つまずき
  alternative: 信仰から離れ／つまずかされ／拒絶し
  rationale: 文脈上は深刻な離反が想定され得るが、原語自体はその結果を特定の教理用語で限定しない。「つまずき」により比喩と意味の幅を保ち、脚注で受動的意味と離反の可能性を示す。
- issue: παραδώσουσινが単なる引き渡しか背信的な裏切りか
  choice: 裏切り
  alternative: 引き渡し
  rationale: 迫害下で互いを敵の手に渡すという文脈的な背信性を自然な日本語で示す。ただし、原語の具体的な「引き渡す」という意味は脚注に明記する。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。終末論上の離反を過度に教理化せず、原語の比喩と曖昧さを保った。「憎み合う」により相互代名詞を自然な日本語で表現した。
