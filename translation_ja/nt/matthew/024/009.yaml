id: MAT.24.9
reference: Matthew 24:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: ja
  text: そのとき、あなたがたは苦難に引き渡され、殺されます。また、わたしの名のゆえに[a]、すべての国々から[b]憎まれます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの名のゆえに」とも訳せる。「名」はイエスご自身とその権威を表す表現。
    reason: lexical_alternative
  - marker: b
    text: 「すべての異邦人」と訳すこともできるが、この文脈では「すべての国々」が自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 談話の進行と出来事の順序を示す時間副詞を、自然で格調ある現代日本語で表した。
- source_word: παραδώσουσιν ὑμᾶς
  choice: 人々はあなたがたを…引き渡し
  rationale: παραδίδωμιは他者の支配下へ渡すことを表す。主語は明示されていないため、不特定の「人々」を補い、「裏切る」とは限定しなかった。複数のὑμᾶςは「あなたがた」とした。
- source_word: εἰς θλῖψιν
  choice: 苦難に
  rationale: θλῖψιςが表し得る圧迫、苦悩、迫害、およびこの終末論的談話における重みを、特定の終末論体系の専門語に固定せず伝える。
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: 殺します
  rationale: 動詞の直接的な意味を保ち、「処刑する」「虐殺する」など本文にない限定を加えなかった。二つ目の目的語は日本語では自然に省略でき、同じ「あなたがた」を指す。
- source_word: ἔσεσθε μισούμενοι
  choice: 憎まれます
  rationale: 迂言的な未来受動の意味を、明瞭な日本語の受身で表した。
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: あらゆる国の人々から
  rationale: ἔθνηの世界的範囲を自然な日本語で示しつつ、「異邦人」に限定しなかった。受動文の行為者は「から」で表した。
- source_word: διὰ τὸ ὄνομά μου
  choice: わたしの名のために
  rationale: διά＋対格の原因を表し、イエスの名という聖書的表現を説明的に言い換えず保持した。
theological_decisions:
- issue: 終末論的談話におけるθλῖψιςの訳語
  choice: 苦難
  alternative: 患難／迫害／苦しみ
  rationale: 通常の圧迫や迫害と終末論的な重みの双方を許す広い訳語を採用し、特定の終末論体系に結びつく専門用語へ狭めなかった。
- issue: ἔθνηの範囲
  choice: あらゆる国の人々
  alternative: すべての異邦人／すべての国々
  rationale: 文脈上は民族的なユダヤ人・異邦人の対比より、世界的な敵意を表すと判断した。ただし語義上「異邦人」も可能であることを注記した。
- issue: 「わたしの名」の含意
  choice: 本文では「わたしの名」を保持
  alternative: わたしに従うため／わたしを信じているため
  rationale: 名がイエス自身と彼への帰属を表す含意を保ち、本文で解釈を一つに固定せず注記で説明した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、預言的談話にふさわしい簡潔さと格調を保った。「患難」は教会用語・終末論用語としての固定的連想が強いため本文では「苦難」を選び、原語の幅は判断欄で保持した。脚注記号は関連箇所の直後に置いた。
