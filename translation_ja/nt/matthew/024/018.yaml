  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: ja
  text: 畑にいる人は、上着[a]を取りに戻ってはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「衣」あるいは「外衣」。
    reason: ἱμάτιονは広く衣服を意味する場合も、特に外側にまとう衣を意味する場合もあるため。
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: 畑にいる人
  rationale: 冠詞付きの句を人を指す表現として訳した。単数の代表的な意味を保ちつつ、男性に限定しない自然な日本語である。
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: 戻ってはならない
  rationale: μήを伴うアオリスト命令法の禁止と、ἐπιστρέφωにὀπίσωが添えられた「引き返す」の意味を、切迫した文脈に合う明確な禁止表現で示した。
- source_word: ἆραι
  choice: 取りに
  rationale: 移動を表す動詞に続く目的の不定詞として、「取るために」を簡潔で自然な日本語にした。
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: 上着
  rationale: ἱμάτιονは一般に外側に着る衣服を指すため、現代の読者に分かりやすい「上着」とした。所有者は日本語の文脈から明白なので「自分の」を本文では補わず、原文の意味を自然に伝えた。
theological_decisions:
- issue: 冠詞付き男性単数形が指す人の性別
  choice: 畑にいる人
  alternative: 畑にいる男
  rationale: 文法上は男性単数だが、この警告では代表的・一般的に人を指す。性別を男性に限定せず、単数の個人への呼びかけを保った。
translation_notes:
  register: 明瞭で切迫感のある現代標準語。「戻ってはならない」によって禁止命令を端的に示し、「畑」はἀγρόςの通常の意味を自然に伝える。
