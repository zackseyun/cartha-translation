id: MAT.24.47
reference: Matthew 24:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: ja
  text: まことに、あなたがたに言います。主人はそのしもべを、自分の全財産を管理する者に任命します[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の持つすべてのものを管理する者に任命します」。
    reason: τοῖς ὑπάρχουσιν αὐτοῦは、直訳的には「彼が持っているすべてのもの」を意味し、「全財産」以外の自然な訳し方も可能であるため。
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: イエスが権威をもって厳粛に宣言する定型句として、現代日本語で自然かつ格調のある表現を選んだ。ギリシア語は一語なので、重ねては訳さない。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接的な語りかけを保ち、厳粛な宣言の定型性も伝える。
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: 自分の全財産を管理する者に
  rationale: ἐπίと与格は、ここでは管理を委ねられる範囲を示す。τοῖς ὑπάρχουσινは主人に属するもの全体を指すため、「全財産」と簡潔に訳した。
- source_word: καταστήσει
  choice: 任命します
  rationale: 単に物理的に置くのではなく、責任ある地位に就ける意味を文脈に即して表す。ギリシア語の未来形は、日本語では文脈上、非過去形で自然に伝わる。
- source_word: αὐτόν
  choice: そのしもべを
  rationale: 直前の文脈にある忠実で賢いしもべを指す男性単数代名詞である。日本語で不自然な「彼」を避けつつ、指示対象を明確にした。
theological_decisions:
- issue: 主人から委ねられる報いの性質
  choice: たとえの中で、しもべが主人の全財産を管理する地位に任命されることを、そのまま訳す。
  alternative: 教会における権威、または終末における天上の報いを明示する。
  rationale: 本文自体は、より広い管理責任への任命を述べるにとどまる。教会論的または終末論的な適用を翻訳に織り込まず、解釈上の余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい格調を保った。「管理する者に任命します」により、役職への任命と責任範囲の双方を自然に表した。
