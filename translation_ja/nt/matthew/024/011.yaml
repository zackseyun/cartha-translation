  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: ja
  text: また、多くの偽預言者が現れ、多くの人を惑わす[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「多くの人を欺く」。
    reason: lexical_alternative
  - marker: b
    text: 「現れ」は「起こされる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの
  rationale: 数量を表す一般的な形容詞として、自然かつ原文に忠実に訳した。
- source_word: ψευδοπροφῆται
  choice: 偽預言者
  rationale: 偽りの預言者、または人を欺く預言者を指す複合語であり、聖書的な響きを保つ定着した訳語を用いた。
- source_word: ἐγερθήσονται
  choice: 現れ
  rationale: 受動形には「起こされる」という形も反映できるが、この文脈では偽預言者が出現することを表す自然な日本語とした。復活を意味するとの誤解も避けられる。
- source_word: πλανήσουσιν
  choice: 惑わす
  rationale: 道から迷わせる、誤った方向へ導く、欺くという広い意味を、簡潔で自然な日本語によって保持した。
- source_word: πολλούς
  choice: 多くの人を
  rationale: 目的語が人々であることを日本語で明確にしつつ、原文の数量表現を保った。
- source_word: καὶ ... καὶ
  choice: また、…し、…
  rationale: 二つの未来の出来事を順に結ぶ原文の累加的な構造を、自然な日本語の接続で表した。
theological_decisions:
- issue: πλανήσουσιν が表す惑わしの性質
  choice: 偽預言者が多くの人を広く誤った方向へ導くとの警告として訳す。
  alternative: 教理上の欺き、道徳的な迷い、または終末に関する欺きのいずれかに限定する。
  rationale: 原語は教理的・道徳的・霊的な惑わしを含み得るため、具体的な仕方や範囲を限定しなかった。
- issue: ἐγερθήσονται の受動形
  choice: 文脈に即して「現れ」と訳す。
  alternative: 「起こされる」と訳し、受動の形を明示する。
  rationale: 行為者は原文で示されておらず、神が彼らを立てるという神学的含意を訳文に加えないため、出現を表す中立的な表現を本文に採用し、形態上の別訳を脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準語を用いた。「偽預言者」は聖書用語として一般にも理解可能であり、「惑わす」は原語の幅と比喩性を簡潔に保つ。脚注記号は該当する述語の後にまとめて置いた。
