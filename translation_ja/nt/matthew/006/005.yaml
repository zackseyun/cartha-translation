id: MAT.6.5
reference: Matthew 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: ja
  text: また、祈るときには、偽善者たちのようであってはなりません。彼らは、人々に見てもらおうとして、会堂や大通りの角に立って祈ることを好むからです。まことに、あなたがたに言います。彼らはすでに自分たちの報いを受けています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「報いをすっかり受け取っています」とも訳せます。ここで「受ける」と訳したギリシア語は、代金などを受領済みであることを表す場合があります。
    reason: ἀπέχουσιの商業的用法と、報いを受け尽くしたという含意を示すため。
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: 祈るときには
  rationale: 不定の時を表す一般的な教えとして、現代日本語で自然に表した。文脈上、繰り返される祈りの習慣を含む。
- source_word: οὐκ ἔσεσθε ὡς οἱ ὑποκριταί
  choice: 偽善者たちのようであってはなりません
  rationale: 未来形の禁止・命令的な力を、荘重さを保ちながら明確な現代日本語にした。ὑποκριταίは文脈に即した定着語「偽善者」とした。
- source_word: φιλοῦσιν
  choice: 好む
  rationale: 単なる行為ではなく、人目につく祈りを進んで行い、それを好む意味を保持した。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 会堂で
  rationale: 当時のユダヤ教の歴史的背景を保つ標準的な訳語を用いた。
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: 大通りの角で
  rationale: πλατεῖαの広い公道という意味を保ちつつ、日本語として自然にした。
- source_word: ἑστῶτες προσεύχεσθαι
  choice: 立って祈ること
  rationale: 立つことが祈りの姿勢を表す分詞構文であることを簡潔に保持した。
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: 人々に見てもらおうとして
  rationale: 目的を明示し、ἀνθρώποιςを性別を限定しない総称として訳した。「見てもらう」は、人の注目を意図する文脈を自然に示す。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの厳粛な定型句を、現代日本語の品位ある表現で保持した。
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: 彼らはすでに自分たちの報いを受けています
  rationale: ἀπέχωの商業的語感である「受領済み」を「すでに」で表しつつ、「全額」という解釈を本文に過度に補わなかった。
theological_decisions:
- issue: 人に見せる祈りと立って祈る行為の関係
  choice: 非難の対象を、人に見てもらう目的に置く
  alternative: 立って祈ること自体を非難するように訳す
  rationale: ギリシア語ではὅπως節が目的を明示しており、問題は祈りの姿勢そのものではなく、人から見られるための宗教的演技にある。
- issue: ἀπέχουσιが表す報いの完結性
  choice: 「すでに…受けています」とする
  alternative: 「報いをすべて受け取っています」または単に「報いを受けています」
  rationale: 受領済みという語用的含意を示しながら、「全額」を明文化しすぎず、彼らが求めた人間からの評価がすでにその報いとなっているという緊張を保った。
translation_notes:
  register: 敬体を用い、イエスの教えにふさわしい明瞭で品位ある現代標準日本語とした。「会堂」「報い」「まことに」は聖書的な歴史性と荘重さを保ちつつ、一般読者にも理解可能な語である。
