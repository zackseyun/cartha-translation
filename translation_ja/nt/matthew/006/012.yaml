  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: ja
  text: また、私たちも自分に負い目のある人たちを赦しましたように、私たちの負い目をお赦しください。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφες
  choice: お赦しください
  rationale: 祈りの中のアオリスト命令形。基本義の「放す、免除する」を踏まえつつ、道徳的な負い目との結びつきに最も自然な「赦す」とした。
- source_word: τὰ ὀφειλήματα
  choice: 負い目
  rationale: 字義的な「負債」と、ここで示唆される罪・過ちの双方を保てる日本語であり、対応する「負い目のある人」との語的なつながりも維持する。
- source_word: ὡς
  choice: ように
  rationale: 神に求める赦しと、人が他者に与えた赦しとの比較・対応を示す。因果関係だけに限定しない表現とした。
- source_word: καὶ ἡμεῖς
  choice: 私たちも
  rationale: 二つ目の καὶ と明示された代名詞の強調を自然な日本語で表す。
- source_word: ἀφήκαμεν
  choice: 赦しました
  rationale: アオリスト直説法を単純過去として訳し、すでに行ったものとして述べる原文の形を保つ。日本語では文脈上、現在にも関わる完了した行為として自然に理解できる。
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: 私たちに負い目のある人たち
  rationale: ὀφειλήματα との同根語による対応を「負い目」で再現しつつ、現代日本語で「債務者」より広い道徳的含意を伝える。
theological_decisions:
- issue: ὀφειλήματα の道徳的な負債の比喩
  choice: 本文では「負い目」とし、負債の比喩と罪・過ちへの含意をともに残す。
  alternative: 「罪」「過ち」「負債」
  rationale: 原文は一般的な「罪」ではなく、負っているものを表す語を用い、後半の「負い目のある人」と呼応させているため。
- issue: ὡς が示す関係
  choice: 「ように」と訳し、比較・対応関係を保つ。
  alternative: 「ので」「その条件として」
  rationale: 原文だけでは赦しの原因または功績と断定できないため、神の赦しと人の赦しの緊張を解消しない。
- issue: ἀφήκαμεν の時制的ニュアンス
  choice: 「赦しました」と訳す。
  alternative: 「赦しています」「赦してきました」
  rationale: アオリストの完結的な叙述を明示しつつ、日本語で不自然に継続性を付加しない。異読に関する情報は脚注に示す。
translation_notes:
  register: 主の祈りにふさわしい簡潔で丁寧な祈願調とした。「債務」「債務者」の法律的・金銭的な響きを避け、原文の比喩を保つため「負い目」を用いた。
