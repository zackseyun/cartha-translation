id: MAT.6.2
reference: Matthew 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: ja
  text: だから、施しをするときには、偽善者たちが人々から称賛を受けようとして会堂や通りでするように、自分の前でラッパを吹き鳴らしてはならない。[a] よく言っておく。彼らはすでに自分の報いを全額受け取っている。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「施し」は、貧しい人に金品を与える慈善行為を指す。「ラッパを吹き鳴らす」は、誇張または比喩とも考えられるが、原文は文字どおりこの表現を用いている。
    reason: 語義と修辞的曖昧さの説明
  - marker: b
    text: 「全額受け取っている」は商取引にも使われた表現で、彼らが受け取る報いはそれですべてだ、という意味を含む。
    reason: 文化的・慣用的背景
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: だから、……するときには
  rationale: οὖνによる直前とのつながりを「だから」で示し、ὅτανと接続法が表す一般的・反復的な場合を「するときには」で自然に表した。
- source_word: ποιῇς ἐλεημοσύνην
  choice: 施しをする
  rationale: 貧しい人への慈善的な施与を指す定着した表現であり、簡潔で文脈にも適する。
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: 自分の前でラッパを吹き鳴らしてはならない
  rationale: 原文の鮮明な比喩ないし誇張を解消せず、ἔμπροσθέν σουも自然な日本語で保持した。
- source_word: οἱ ὑποκριταί
  choice: 偽善者たち
  rationale: 人に見せるために敬虔な行為を演じる者を表す、この文脈で標準的な訳語。
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: 会堂や通りで
  rationale: συναγωγήは当時のユダヤ人の会堂、ῥύμηは公に人目につく通りを指す。
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: 人々から称賛を受けようとして
  rationale: 目的を明示し、ここでのδοξάζωが人間から公に誉められることを意味する点を、現代日本語として自然に表した。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: よく言っておく
  rationale: イエスの厳粛で権威ある宣言定型を、明瞭で格調を保つ現代日本語にした。
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: 彼らはすでに自分の報いを全額受け取っている
  rationale: ἀπέχωの商取引用語的な「全額受領済み」の含意を明示し、その場で得た人間の称賛が彼らの報いのすべてであるという力を保った。
theological_decisions:
- issue: δοξασθῶσινの強さ
  choice: 称賛を受ける
  alternative: 栄光を受ける／あがめられる
  rationale: 語の基本的な強さは保ちつつ、この文脈では人間から誉めそやされることを指すため、「称賛」が誤解の少ない自然な表現である。
- issue: ἀπέχουσινが示す報いの完結性
  choice: すでに……全額受け取っている
  alternative: 自分の報いを受けている
  rationale: 商取引用語の完済・全額受領の含意を保ち、神からの追加の報いがあるかのように読ませない。
- issue: ラッパの表現の性格
  choice: 字義的な像を本文に残す
  alternative: 人に言いふらしてはならない
  rationale: 実際の慣習、誇張、比喩のいずれかを本文だけで確定せず、原文の修辞的な緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教調に寄りすぎず、イエスの警告の厳粛さを保った。「施し」「会堂」「報い」は聖書文脈で定着しつつ一般読者にも理解可能な語として採用した。
