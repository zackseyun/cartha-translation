id: MAT.6.33
reference: Matthew 6:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: ja
  text: しかし、まず神の国と神の義[a]を求めなさい。そうすれば、これらすべてのものがあなたがたに加えられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「正義」。ギリシア語は「義」と「正義」の両方を表し得る。ここでは、神との正しい関係や神の意志にかなう行いを含み、司法的・社会的な正義だけに限られないため、本文では「義」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: 求めなさい
  rationale: 現在命令形が表す継続的・積極的な追求を、簡潔で自然な命令として表した。継続性は文脈に含ませ、「求め続けなさい」とまでは明示しなかった。
- source_word: δὲ
  choice: しかし
  rationale: 直前の、生活上の必要を思い煩い追い求めることとの対照を明確にした。
- source_word: πρῶτον
  choice: まず
  rationale: 順序と優先性の両方を保ち、過度な言い換えを避けた。
- source_word: βασιλείαν
  choice: 国
  rationale: 神の王としての支配と、その支配に属する領域の双方を含み得る、マタイ福音書で自然かつ定着した訳語を用いた。
- source_word: δικαιοσύνην
  choice: 義
  rationale: 神のみこころにかなう正しさ、神との正しい関係、正しい行いを含み得る語の幅を保つため「義」とした。「正義」という可能性は脚注に残した。
- source_word: αὐτοῦ
  choice: 神の
  rationale: ギリシア語は代名詞「その方の」だが、日本語では直前の文脈上の指示対象である神を明示する方が自然で明瞭である。国と義の双方が神に属することを「神の国と神の義」で示した。
- source_word: ταῦτα πάντα
  choice: これらのものはすべて
  rationale: 直前に語られた食べ物、飲み物、衣服などの必要を指す指示表現と全称性を保った。
- source_word: προστεθήσεται
  choice: 加えて与えられます
  rationale: 未来受動形の意味を保ちつつ、日本語として「加えられる」だけより自然にした。主要な追求に伴って必要なものも加えられるという含意を表す。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数二人称の与格を明示し、聞き手全体への約束であることを保った。
theological_decisions:
- issue: δικαιοσύνην の訳し方
  choice: 義
  alternative: 正義
  rationale: ここでは司法的・社会的な正義だけでなく、神のみこころにかなうあり方と行いを広く含み得るため、「義」を本文に置いた。語義上可能な「正義」は脚注に示した。
- issue: αὐτοῦ の指示対象
  choice: 神の
  alternative: その方の
  rationale: 原文は代名詞だが、文脈上は父なる神を指す。日本語で「その方の国と義」とすると不自然になりやすいため、指示対象を明示した。ただし、神の国と神の義という原文の所有関係は保った。
- issue: καὶ による命令と約束の接続
  choice: そうすれば
  alternative: そして
  rationale: 命令に続く結果・約束という文脈上の関係を自然な日本語で示した。機械的な条件交換を意味するようには強めていない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令には威厳を保つ「求めなさい」、約束には丁寧体の「与えられます」を採用した。直訳調を避けながら、対照、優先性、受動的な授与という原文の構造を保持した。
