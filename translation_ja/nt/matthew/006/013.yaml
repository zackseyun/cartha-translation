  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: ja
  text: 私たちを誘惑[a]に導き入れないで、悪[b]から救い出してください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「試み」または「試練」とも訳せる。ギリシア語は、罪への誘惑と、人を試す苦難のどちらも指しうる。
    reason: lexical_alternative
  - marker: b
    text: 「悪い者から」とも訳せる。ギリシア語の表現は、人格的な「悪い者」とも、非人格的な「悪」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: 陥らせないで
  rationale: 直訳的には「中へ連れて行かないで／導き入れないで」。日本語では「誘惑に陥らせないで」が祈願として自然であり、神が誘惑者であると説明的に言い換えず、原文の直接的な表現を保つ。
- source_word: πειρασμόν
  choice: 誘惑
  rationale: 罪への誘いを表す自然で定着した訳語。ただし、πειρασμόςには試練・試みの意味もあるため、脚注で語義の幅を示す。
- source_word: ῥῦσαι
  choice: 救い出してください
  rationale: 危険や敵の支配から能動的に救出することを求める命令形の祈願を、明瞭で敬意ある現代日本語で表す。
- source_word: τοῦ πονηροῦ
  choice: 悪い者
  rationale: 定冠詞を伴う形容詞の名詞的用法を男性形と理解し、人格的な悪者を本文に採る。ただし、文法上は中性の「悪」とも理解できるため、脚注で真正な曖昧さを保持する。
theological_decisions:
- issue: τοῦ πονηροῦの人格的・非人格的解釈
  choice: 悪い者
  alternative: 悪
  rationale: ギリシア語の形は男性単数属格と中性単数属格が同形であり、「悪い者」と「悪」の双方が可能である。誘惑との対比では人格的な敵を指す読みが自然なため本文に置くが、非人格的な読みも脚注に明記する。
- issue: 神と誘惑の関係を表す祈願の直接性
  choice: 陥らせないで
  alternative: 誘惑に陥ることを許さないで
  rationale: 原文は神に対して直接「導き入れないで」と願っている。神学的困難を解消するための許容表現を本文へ補わず、原文の緊張を保つ。
translation_notes:
  register: 明瞭で現代的な祈りの文体とし、「ください」によって敬意を表した。「悪い者」は「悪しき者」より平明であり、人格的な読みを保つ。脚注記号は該当語の直後に配置した。
