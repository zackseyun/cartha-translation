revisions:
- from: しかし、今日生えていて、明日にはかまど[a]に投げ込まれる野の草を、神がこのように装ってくださるのなら、まして、あなたがたにはなおさら衣を着せてくださるのではないか。信仰の薄い者たちよ。[b]
  to: しかし、今日ここにあって、明日にはかまど[a]に投げ込まれる野の草を、神がこのように装ってくださるのなら、ましてあなたがたを、なおさら装ってくださらないでしょうか。信仰の薄い人たちよ。[b]
  rationale: 原文のὄνταに対応する表現を、成長という追加的含意のある「生えていて」から、存在の一時性を表す「今日ここにあって」へ改めた。また、現代標準語としての明瞭さのため「者たち」を「人たち」とした。草と聞き手の双方に「装う」を用い、神が草を装うなら人をなおさら装うという原文の比較と動詞の反復を保った。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:59Z'
