  terminology: χόρτοςを「野の草」、κλίβανοςを「かまど」、ὀλιγόπιστοιを「信仰の薄い人たちよ」とするのはいずれも適切です。「装う」は神が草に衣をまとわせる比喩を自然に示します。脚注a・bの位置と内容は本文に適切に対応しています。
