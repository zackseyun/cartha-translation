id: MAT.6.30
reference: Matthew 6:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: ja
  text: しかし、今日ここにあって、明日にはかまど[a]に投げ込まれる野の草を、神がこのように装ってくださるのなら、ましてあなたがたを、なおさら装ってくださらないでしょうか。信仰の薄い人たちよ。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「かまど」はパンなどを焼く炉。乾かした草や野の植物が燃料として使われることがあった。
    reason: cultural_note
  - marker: b
    text: 別訳「信仰が少ししかない人たちよ」。ギリシア語では、不十分な信頼を戒める直接の呼びかけ。
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: 野の草
  rationale: χόρτοςは草や草本を指す。短命な野の植物という文脈を保ちつつ、花に限定しない自然な日本語とした。
- source_word: σήμερον ὄντα
  choice: 今日生えていて
  rationale: 直訳は「今日存在していて」だが、野の草についての自然な日本語として「生えていて」とし、その一時的な存在を表した。
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: 明日にはかまどに投げ込まれる
  rationale: κλίβανοςは金属精錬炉というよりパン焼き用のかまどを指す。受動の分詞を自然な日本語で表した。
- source_word: οὕτως ἀμφιέννυσιν
  choice: このように装ってくださる
  rationale: ἀμφιέννυμιの「衣を着せる、装う」という比喩を保持した。「くださる」は神の配慮を表す日本語として自然だが、装飾性を過度に強めないよう「美しく飾る」とはしなかった。
- source_word: οὐ πολλῷ μᾶλλον
  choice: まして、あなたがたにはなおさら……ではないか
  rationale: 小さいものから大きいものへ論じる比較の力と、否定形の修辞疑問を自然な日本語で保持した。
- source_word: ὑμᾶς
  choice: あなたがたにはなおさら衣を着せてくださる
  rationale: 原文では直前の動詞が省略されているため、日本語では「衣を着せる」を補って論旨を明確にした。
- source_word: ὀλιγόπιστοι
  choice: 信仰の薄い者たちよ
  rationale: 複数への直接の呼びかけと、不十分な信頼を戒める響きを保った。
- source_word: εἰ δὲ
  choice: しかし、……のなら
  rationale: δέの緩やかな対比・論の展開を「しかし」で示し、条件節を自然な日本語にした。
theological_decisions:
- issue: 小さいものから大きいものへ進む、神の備えについての議論
  choice: 一時的な野の草よりも弟子たちをなおさら顧みるという修辞疑問として訳した。
  alternative: 疑問ではなく断定文として訳す。
  rationale: ギリシア語の否定疑問と末尾の呼びかけは、心配する弟子たちへの戒めを鋭くする修辞疑問を支持する。追加の教理的説明は加えなかった。
- issue: ὀλιγόπιστοιが指す問題
  choice: 「信仰の薄い者たち」とし、神への信頼が不十分であることへの戒めとして曖昧さを保った。
  alternative: 「不信仰な者たち」または「信仰のない者たち」とする。
  rationale: 語は信仰の完全な欠如ではなく、その少なさ・不十分さを表すため、より強い断定を避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、修辞疑問と末尾の厳かな直接呼びかけを保持した。「装う」と「衣を着せる」により原文の衣服の比喩を一貫して示した。
