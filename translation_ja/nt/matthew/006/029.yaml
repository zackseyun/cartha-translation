source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: ja
  text: しかし、あなたがたに言います。ソロモンでさえ、そのすべての栄華をもってしても、この花の一つほどには身にまとっていませんでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: しかし、あなたがたに言います
  rationale: λέγωと与格ὑμῖνを自然な現代日本語で表し、δέの穏やかな対比を「しかし」で示した。
- source_word: οὐδὲ Σολομὼν
  choice: ソロモンでさえ……ませんでした
  rationale: οὐδέの強調された否定を、日本語で自然な「でさえ……ない」によって保持した。
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: 栄華を極めた
  rationale: ここでのδόξαは王としての壮麗さ・栄華を指す。「栄華を極めた」はἐν πάσῃの全面性を簡潔かつ自然に伝える。
- source_word: περιεβάλετο
  choice: 装ってはいませんでした
  rationale: 衣服をまとう意味と、花との外見上の比較を保つ。「着飾る」ほど意図的な華美に限定せず、中動態・受動態の曖昧さを過度に説明しない表現とした。
- source_word: ὡς ἓν τούτων
  choice: この花の一つほどにも
  rationale: τούτωνの指示対象を直前の文脈にある花として明示し、ἓνの単数と否定比較を自然な日本語で保持した。
theological_decisions:
- issue: ソロモンについてのδόξαの意味
  choice: 地上の王としての「栄華」
  alternative: 「栄光」「華麗さ」
  rationale: 文脈は神的栄光ではなく、ソロモンの王としての壮麗さと野の花の装いとの比較である。「栄華」は神学的含意を不必要に持ち込まず、その意味を明確にする。
translation_notes:
  register: 明快で格調を保った現代標準日本語。前節からの対比を「しかし」で示し、「この花」と補って単独でも指示対象が分かるようにした。
