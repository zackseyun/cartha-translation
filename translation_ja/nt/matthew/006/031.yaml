  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: ja
  text: ですから、「何を食べようか、何を飲もうか、何を着ようか」と言って、心配してはいけません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: だから、心配してはいけません
  rationale: οὖνの推論を自然な「だから」で示し、μεριμνάωはこの文脈で生活の必要をめぐる思い煩いを指すため、現代日本語で明瞭な「心配する」とした。μή＋アオリスト接続法の禁止も保っている。
- source_word: λέγοντες
  choice: 「……」と言って
  rationale: 分詞が、心配が言葉として現れる様子を示すため、日本語では引用部を受ける「と言って」で自然に表した。
- source_word: Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
  choice: 「何を食べようか」「何を飲もうか」「何を着ようか」
  rationale: 三つの deliberative subjunctive を、将来の必要について思い悩む自然な日本語の問い「〜ようか」で統一した。περιβαλώμεθα は衣服を身に着ける意味なので「着ようか」とした。
- source_word: ἤ ... ἤ
  choice: 並列された三つの引用疑問
  rationale: ギリシア語の選言的な列挙は、日本語では各引用を続けて並べることで明瞭に伝わる。「それとも」を反復すると不自然に重くなるため省いたが、三項の区別は引用符で保持した。
theological_decisions:
- issue: 生活上の必要に関するイエスの禁止の性質
  choice: 生活の必要をめぐって心配することへの禁止として訳す
  alternative: あらゆる配慮や計画を禁じる表現にする
  rationale: 直近の文脈は食物・飲み物・衣服についての不安を扱っている。「心配してはいけません」は、責任ある備えまで否定する意味を訳文に持ち込まず、本文の禁止の力を保つ。
translation_notes:
  register: 明瞭で現代的ながら、イエスの教えとして落ち着きのある丁寧体を用いた。「思い煩う」より一般読者に直接伝わる「心配する」を選び、三つの問いは簡潔な反復で修辞的なリズムを保った。
