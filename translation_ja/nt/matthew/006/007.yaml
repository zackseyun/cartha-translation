id: MAT.6.7
reference: Matthew 6:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: ja
  text: また、祈るときには、異邦人[a]のようにむなしい言葉を並べ立ててはならない[b]。彼らは、多く語れば聞き入れられると思っているからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「異教徒」。ギリシア語は、契約の民の外にいる諸民族、すなわちこの文脈では非ユダヤ人を指す。
    reason: lexical_alternative
  - marker: b
    text: または「たわごとを言ってはならない」「意味のない反復をしてはならない」。ギリシア語の動詞は稀で、内容のない、機械的な、または冗長な発話を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: 祈るときには
  rationale: 状況を示す副詞的分詞として自然に訳し、教えの場面に合う現代日本語とした。
- source_word: δὲ
  choice: また
  rationale: 強い逆接ではなく、祈りについての次の教えへ話を進める接続を表す。
- source_word: μὴ βατταλογήσητε
  choice: むなしい言葉を重ねてはならない
  rationale: まれな動詞が表す、内容のない、機械的または冗長な発話という含みを伝え、真摯な祈りを繰り返すことすべてを禁じる表現は避けた。
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: 異邦人のように
  rationale: ユダヤ的文脈で契約の民の外にいる諸民族、特に非ユダヤ人を指す語を、定着した聖書語で直接的に表した。
- source_word: δοκοῦσιν
  choice: 思っている
  rationale: 祈りについて彼らが抱く思い込みを、明瞭で自然な日本語で表した。
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: 言葉が多ければ
  rationale: πολυλογίαの『多く語ること、冗長さ』と、それを聞き入れられる根拠とみなす因果的な含みを自然に表した。
- source_word: εἰσακουσθήσονται
  choice: 聞き入れられる
  rationale: 単に音声を聞かれるのではなく、好意的に耳を傾けてもらう意味を表しつつ、『答えを与えられる』とまで意味を強めない表現とした。
theological_decisions:
- issue: イエスが祈りにおける反復そのものを禁じているのか、それとも内容のない冗長な発話を禁じているのか
  choice: 「むなしい言葉を重ねてはならない」とし、内容のない冗長さを禁じる意味を本文に示した。
  alternative: 「同じ言葉を繰り返してはならない」または「くどくど祈ってはならない」
  rationale: このまれな動詞の力を保ちながら、真摯な反復祈願まですべて否定するとの解釈を避ける。焦点は、多く語ることによって神に聞いてもらえるという思い込みにある。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの教えにふさわしい簡潔で格調ある命令表現とした。「聞き入れられる」は祈りの文脈に自然で、原文の受動表現も保つ。
