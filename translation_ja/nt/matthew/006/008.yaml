id: MAT.6.8
reference: Matthew 6:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: ja
  text: だから、彼らのようになってはいけません。あなたがたの父は、あなたがたが願い求める前から、何が必要かを知っておられるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: だから、～してはいけません
  rationale: οὖνの推論的なつながりと、μήを伴う禁止を、前節から自然に続く現代日本語で表した。
- source_word: ὁμοιωθῆτε
  choice: 彼らのようになって
  rationale: アオリスト受動接続法の禁止。字義的な「似せられる」より自然で、彼らのあり方に倣うことを禁じる意味を保つ。
- source_word: αὐτοῖς
  choice: 彼ら
  rationale: 直前の文脈で言及された異邦人を受ける代名詞として簡潔に訳した。
- source_word: οἶδεν
  choice: 知っておられる
  rationale: 形態上は完了形のοἶδαだが、現在の意味を持つ。父への敬意を自然な日本語の尊敬表現で示した。
- source_word: ὁ πατὴρ ὑμῶν
  choice: あなたがたの父
  rationale: 原文には「天の」がないため補わず、複数二人称を明示した。
- source_word: ὧν χρείαν ἔχετε
  choice: 何が必要か
  rationale: 必要としているものの内容を、簡潔で自然な日本語として表した。
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: あなたがたが願い求める前から
  rationale: πρὸ τοῦ＋不定詞の時間的先行を表す。「前から」により、願う以前にすでに知っておられるという文意を自然に示した。αὐτόνは日本語では目的語を省略しても父を指すことが明白である。
theological_decisions:
- issue: 祈りに先立つ神の知識
  choice: 父が弟子たちの必要を、彼らが願う前から知っておられると、そのまま訳す。
  alternative: 祈りは情報伝達ではなく関係のためである、などの説明を訳文に加える。
  rationale: 本文は父の先行する知識を明言する一方、祈る意味についてはここで説明していない。その神学的緊張を解消せず保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語。教会的な威厳を保ちつつ、一般読者にも理解しやすい敬体とした。原文にない「天の」は加えず、過度に字義的な受動表現も避けた。
