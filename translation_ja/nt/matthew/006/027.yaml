source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: ja
  text: あなたがたのうち、心配したからといって、自分の寿命[a]を一キュビトでも延ばせる人がいるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寿命」と訳したギリシア語は、「背丈」を意味することもある。したがって、「自分の背丈を一キュビトでも伸ばせる」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: あなたがたのうち、…人がいるでしょうか
  rationale: ἐξ ὑμῶνを「あなたがたのうち」とし、修辞疑問として自然な現代日本語にした。δέはここでは弱い接続であり、日本語では明示しなくても前後の流れが保たれる。
- source_word: μεριμνῶν
  choice: 心配したからといって
  rationale: μεριμνάωの「思い煩う、心配する」という意味と、分詞が示す手段を、無益さを問う修辞疑問に合う自然な表現で示した。
- source_word: δύναται προσθεῖναι
  choice: 延ばせる
  rationale: 寿命についてのπροσθεῖναι（加える）を、日本語で自然な「延ばす」と訳し、δύναταιの可能・能力を「〜られる」で表した。
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: 自分の寿命
  rationale: ἡλικίαには「年齢・寿命」と「背丈」の両義がある。命についての周辺文脈と心配によって命を延ばせないという趣旨を踏まえて本文では「寿命」とし、もう一つの可能性は脚注に残した。αὐτοῦは修辞疑問の各人を指すため「自分の」とした。
- source_word: πῆχυν ἕνα
  choice: 一キュビトでも
  rationale: 古代の長さの単位という具体的な比喩を保つため「一キュビト」とした。「でも」により、わずか一単位さえ加えられないという修辞的な力を自然に表した。
theological_decisions:
- issue: ἡλικίαの意味
  choice: 寿命
  alternative: 背丈
  rationale: 語彙上はどちらも可能である。本文では、直前の「命」と神の養いをめぐる文脈に整合する「寿命」を採った。ただし、長さの単位「一キュビト」と直接結びつく「背丈」も有力なので、曖昧さを解消せず脚注に明記した。
translation_notes:
  register: 明快で自然な現代標準日本語を用い、修辞疑問の調子を保った。「一キュビト」は聖書時代の長さの単位をそのまま残し、寿命を長さとして測る原文の比喩を保持した。
