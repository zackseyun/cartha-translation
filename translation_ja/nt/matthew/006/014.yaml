source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: ja
  text: というのも、人々の過ち[a]を赦すなら、あなたがたの天の父も、あなたがたを赦してくださるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「背き」「違反」「罪過」とも訳せる。ギリシア語は、道徳上の過失や正しい道からの踏み外しを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: …なら、…からです
  rationale: γάρが直前の祈りを受けて理由を示すため、日本語では文末の「からです」で表した。ἐάνとアオリスト接続法による条件は「…なら」とした。
- source_word: ἀφῆτε / ἀφήσει
  choice: 赦す／赦してくださる
  rationale: この文脈のἀφίημιは道徳的な過失を赦すことを指す。同じ動詞の反復を保ちつつ、父を主語とする後半では自然な敬意を示す補助動詞「くださる」を用いた。
- source_word: τοῖς ἀνθρώποις
  choice: 人々
  rationale: 性別を限定しない一般的な人間を指すため、明瞭で自然な「人々」とした。
- source_word: τὰ παραπτώματα αὐτῶν
  choice: 人々の過ち
  rationale: παράπτωμαは踏み外しに由来し、道徳的な過失、違反、背きを表す。「過ち」は現代日本語で理解しやすく、対人関係上の不正も含み得る。意味の幅は脚注で補った。
- source_word: καὶ ὑμῖν
  choice: あなたがたも、あなたがたを
  rationale: καίが示す対応を、父を表す句の後の「も」で自然に示した。ὑμῖνは日本語では「あなたがたを赦す」と目的語で表すのが自然である。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: あなたがたの天の父
  rationale: 冠詞を伴う形容詞οὐράνιοςは父を「天の」と特徴づける。マタイの用法に沿う、簡潔で尊厳ある表現とした。
theological_decisions:
- issue: 人が赦すことと神が赦すことの条件関係
  choice: 「赦すなら…赦してくださる」と、原文の条件文をそのまま表した。
  alternative: 人の赦しが神の赦しを獲得するという強い因果解釈、または人の赦しは先行する神の赦しの証拠にすぎないという解釈。
  rationale: ギリシア語本文は明確な条件文だが、その条件の教理的仕組みまでは説明していない。したがって、特定の教派的説明を訳文に持ち込まず、本文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「赦す」は一般の「許す」と区別して道徳的・宗教的な赦しを示し、文全体の尊厳を保つ。理由を表すγάρを自然に伝えるため、語順を日本語化して文末を「からです」とした。
