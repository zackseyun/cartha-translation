source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: ja
  text: だから、明日のことを心配してはいけません。明日は明日のことを心配します。一日ごとに、その日の苦労[a]で十分です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一日ごとに、その日の悪で十分です」とも訳せる。ギリシア語の語は「悪」を意味し得るが、ここではその日に伴う苦労や災いを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: 心配してはいけません
  rationale: 文脈では、必要な配慮一般ではなく、将来について思い悩むことを指す。現代日本語として自然で、6:25–34に繰り返される語との一貫性も保てる。
- source_word: εἰς τὴν αὔριον
  choice: 明日のことを
  rationale: μεριμνάωが向けられる対象を示しており、日本語では「明日のことを心配する」が自然である。
- source_word: ἡ αὔριον
  choice: 明日
  rationale: 「明日」を主語として擬人化する原文の修辞を、そのまま自然な日本語で表した。
- source_word: μεριμνήσει αὑτῆς
  choice: 明日のことを心配します
  rationale: 直訳的な「自分自身を心配する」は日本語では意味がずれやすい。「明日は明日のことを」として再帰的な意味と前文との動詞の反復を保った。
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: 一日には……十分あります
  rationale: 「その日には十分である」という述語的構文を、分配的な意味が明瞭になる自然な日本語にした。
- source_word: ἡ κακία αὐτῆς
  choice: その日なりの苦労
  rationale: κακίαの基本的な「悪」という意味を踏まえつつ、この文脈では一日ごとの災いや難儀を指すため「苦労」とした。「その日なりの」は各日に固有のものという代名詞の働きを表す。
theological_decisions:
- issue: κακίαを道徳的な「悪」と取るか、日々の災いや難儀と取るか
  choice: 本文では「苦労」
  alternative: 「悪」または「災い」
  rationale: 将来への心配を戒める文脈では、その日に伴う困難や悩みを表す読みが最も自然である。ただし語そのものは「悪」を意味し得るため、脚注で語義の幅を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、教えとしての簡潔さと品位を保った。「明日は明日のことを心配します」により原文の擬人化と語の反復を再現した。脚注記号は該当する語義上の論点がある最終文の後に置いた。
