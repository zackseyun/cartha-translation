id: MAT.6.28
reference: Matthew 6:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: ja
  text: また、衣服のことで、なぜ思い悩むのですか。野のユリ[a]がどのように育つか、よく見なさい[b]。労苦することも、糸を紡ぐこともありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユリ」は、ここでは広く「野の花」を指すとも考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「よく観察しなさい」、または「よく見て学びなさい」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: 衣服のことで
  rationale: 単数形の「衣服」を個別の一着ではなく、生活に必要な衣類という一般的な範疇として自然に表した。
- source_word: τί μεριμνᾶτε
  choice: なぜ思い悩むのですか
  rationale: τίの問いを日本語で自然な理由の問いとして表し、μεριμνάωが文脈上示す不安を伴う心配を「思い悩む」で伝えた。
- source_word: καταμάθετε
  choice: よく見なさい
  rationale: 注意深く観察し、そこから理解するよう促す命令を、簡潔で自然な現代日本語にした。観察だけでなく学ぶ含みがあるため脚注に補足した。
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: 野のユリ
  rationale: κρίναの基本的な意味である「ユリ」を本文に採り、τοῦ ἀγροῦは日本語として定着した自然な表現「野の」で表した。より広く野の花を指す可能性は脚注に残した。
- source_word: πῶς αὐξάνουσιν
  choice: どのように育つか
  rationale: 植物の自然な成長を表すαὐξάνωを、現代日本語で明瞭な「育つ」とした。
- source_word: οὐ κοπιῶσιν
  choice: 労苦することも…ありません
  rationale: κοπιάωの、疲れるほど働くという含みを「労苦する」で保ち、後続句との並行を整えた。
- source_word: οὐδὲ νήθουσιν
  choice: 糸を紡ぐこともありません
  rationale: νήθωが衣服を作るために糸を紡ぐ行為を指すことを、日本語では目的語を補って明確にした。
theological_decisions:
- issue: μεριμνάωが示す心配の性質
  choice: 思い悩む
  alternative: 心配する
  rationale: 単に気にかけること一般ではなく、生活の必要をめぐる不安な思いを問題にする文脈を伝える一方、通常の備えそのものを禁じるとの解釈を訳文に持ち込まないため。
- issue: κρίναが指す植物の範囲
  choice: ユリ
  alternative: 野の花
  rationale: 語の直接的な対応を本文に置きつつ、特定種ではなく野生の花々を広く指す可能性を脚注で保持した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。イエスの問いかけは丁寧体で統一し、過度に古風な語順を避けた。「労苦する」はやや格調を保ちながらも一般読者に理解でき、「糸を紡ぐ」との対句を明確にする。
