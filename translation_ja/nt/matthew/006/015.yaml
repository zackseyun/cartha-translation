  verdict: approve
  source_fidelity: 原文の否定条件（ἐὰν δὲ μὴ）と、その帰結を導く否定的対応（οὐδέ）を、「しかし、もし……赦さないなら、……父も……赦してくださらない」と正確に保っている。ἀφίημι の二度の用例も「赦す」で対応しており、「天の」を補っていない点も原文に忠実である。「人々」は性別を限定しない τοῖς ἀνθρώποις の適切な現代語訳である。
  naturalness: 明瞭で自然な現代標準日本語であり、聖書本文として必要な格調も保たれている。「あなたがた」を明示することで複数形も読み手に分かりやすい。「赦してくださらない」は父への敬意を自然に示す表現である。
  terminology: 「赦す」は対人的赦しと父の赦しに一貫して用いられ、原文の反復と条件的対応をよく再現している。「過ち」は παράπτωμα の「過失・違反・道徳的な逸脱」の意味領域を、過度に教義化せず平明に伝える。脚注は代替可能な語義を適切に示している。
