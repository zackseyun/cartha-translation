id: MAT.6.15
reference: Matthew 6:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: ja
  text: しかし、もしあなたがたが人々を赦さないなら、あなたがたの父も、あなたがたの過ち[a]を赦してくださらない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「背き」「違反」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: しかし、もし……ないなら
  rationale: ἐάνの条件、δέの前節との対照、μήの否定を、自然な現代日本語の条件文で示した。
- source_word: ἀφῆτε / ἀφήσει
  choice: 赦さない／赦してくださらない
  rationale: ἀφίημιの反復を「赦す」でそろえ、人の赦しと父の赦しの対応関係を保った。後半は「父」を主語とする敬意を自然に示すため補助動詞を用いた。
- source_word: τοῖς ἀνθρώποις
  choice: 人々を
  rationale: 性別を限定しない一般的な人間を指すため、「人々」とした。日本語では「人々の過ちを」の目的語が省略されているが、直前の文脈から赦しの対象は明白である。
- source_word: οὐδὲ
  choice: ……も……ない
  rationale: 否定条件に対応する「父も……ない」という日本語の構文で、οὐδέの否定的な対応と強調を表した。
- source_word: ὁ πατὴρ ὑμῶν
  choice: あなたがたの父
  rationale: 原文に「天の」に当たる語がないため補わず、定冠詞を含む父の呼称を簡潔に訳した。
- source_word: τὰ παραπτώματα ὑμῶν
  choice: あなたがたの過ち
  rationale: παράπτωμαが表す道徳的な過失・違反を、現代の一般読者に明瞭な「過ち」で表した。「罪」より語義を狭めず、「背き」ほど解釈を強めない。
theological_decisions:
- issue: 人間が赦すことと父が赦すことの条件的関係
  choice: 原文どおり、直接的な条件文として保持する。
  alternative: 人を赦すことは神に赦された証拠にすぎない、またはここでいう赦しは交わりの回復だけを指す、と説明的に訳す。
  rationale: ギリシア語は明確な否定条件とその帰結を述べている。翻訳では、その神学的緊張を弱めたり、特定の体系によって解消したりしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「赦す」は対人関係と神の赦しの双方に用い、原文の語の反復を保持した。すべての二人称複数は「あなたがた」で明示した。
