id: MAT.6.9
reference: Matthew 6:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: ja
  text: 'ですから、あなたがたはこのように祈りなさい。


    「天におられる私たちの父よ[a]、


    あなたの名が聖なるものと認められますように[b]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「もろもろの天におられる」。原文の「天」は複数形。
    reason: lexical_alternative
  - marker: b
    text: または「あなたの名が聖なるものとして尊ばれますように」。伝統的には「御名があがめられますように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: このように
  rationale: 祈る際の仕方または模範を示す語であり、現代日本語として自然にその指示的な働きを伝える。
- source_word: οὖν
  choice: ですから
  rationale: 直前の教えを受けた帰結を示す接続語として、論理的なつながりを保ちつつ自然な現代語にした。
- source_word: προσεύχεσθε ὑμεῖς
  choice: あなたがたは……祈りなさい
  rationale: 二人称複数の命令形と、明示された代名詞ὑμεῖςの強調を、日本語でも主語を明記して表した。
- source_word: Πάτερ ἡμῶν
  choice: 私たちの父よ
  rationale: 呼びかけであることを終助詞「よ」で示し、共同体的な複数所有「私たちの」を保持した。
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: 天におられる
  rationale: 日本語では「天」が通常、数を明示せず自然に場所を表すため本文では単数・複数を不自然に限定せず、原文が複数形であることを脚注に示した。「おられる」は父への敬意を自然に表す。
- source_word: ἁγιασθήτω
  choice: 聖とされますように
  rationale: アオリスト受動命令形の願願・祈願の力を「ますように」で示した。「聖とされる」は、神の名が聖なるものとして認められ、尊ばれることを表しつつ、単に「崇める」と意訳して意味を狭めることを避ける。
- source_word: τὸ ὄνομά σου
  choice: あなたの名
  rationale: 原文の「名」をそのまま保持した。名が人格、評判、啓示された性質を含み得るとしても、本文でそれを説明的に言い換えない。
theological_decisions:
- issue: 父への呼びかけと、天におられるという超越性の表現
  choice: 天におられる私たちの父よ
  alternative: 天の父よ／もろもろの天におられる私たちの父よ
  rationale: 「私たちの父」という親しい共同的な呼びかけと、「天におられる」という超越性をともに保持した。「天の父」は簡潔だが関係節の意味を弱め、「もろもろの天」は複数形を明示する一方、現代日本語では過度に不自然なため採らなかった。
- issue: ἁγιασθήτωの受動表現と神学的な含み
  choice: あなたの名が聖とされますように
  alternative: あなたの名が崇められますように／あなたの名を聖なるものとしてください
  rationale: 神の名が聖なるものとして認められ尊ばれることを願う受動形を保持した。「崇められる」だけに限定せず、神的受動として読める可能性も含め、誰がそれを実現するかを本文で決めつけない。
translation_notes:
  register: 明快な現代標準語を基調としながら、祈りの呼びかけにふさわしい品位を保った。「御名」のような教会内で定着した語に頼らず「あなたの名」として一般読者にも分かりやすくし、「聖とされますように」によって原文の簡潔さと神学的な余韻を残した。
