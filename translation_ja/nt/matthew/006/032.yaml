id: MAT.6.32
reference: Matthew 6:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: ja
  text: というのも、異邦人たち[a]はこれらすべてを追い求めているのです[b]。あなたがたの天の父は、あなたがたにこれらすべてが必要であることをご存じだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」または「異教徒たち」。ギリシア語は広く諸民族を指し得るが、ここではおそらく契約の民の外にいる人々を指す。
    reason: alternative_reading
  - marker: b
    text: 「追い求める」には、熱心に、または根気強く求めるという含みがあり得る。別訳「熱心に求めている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: 異邦人たち
  rationale: この文脈では、イエスの弟子たちと対照される、契約の民の外にいる諸民族を指す。「異教徒」ほど否定的な宗教評価を加えず、「諸国民」よりも歴史的・社会的な対照を自然に示せる。
- source_word: ἐπιζητοῦσιν
  choice: 追い求めている
  rationale: 単なる一時的な探索ではなく、関心を向けて求め続ける含みを、現代日本語として自然な「追い求める」で表した。「熱心に」を加えるよりも原文の強調を過度に固定しない。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: あなたがたの天の父
  rationale: 所有関係と「天の」という限定をともに保ち、聖書的な尊厳を備えた自然な日本語とした。
- source_word: οἶδεν
  choice: ご存じです
  rationale: 形は完了形だが現在の状態を表すため、敬意を込めた現在表現で訳した。
- source_word: χρῄζετε
  choice: あなたがたに必要である
  rationale: 「必要としている」も可能だが、ここでは必要の事実を明確かつ自然に表す。
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: これらすべては……これらすべてが
  rationale: 原文にある「これらすべて」の反復を残し、強調と二つの節の対応を保った。
- source_word: γὰρ ... γὰρ
  choice: ……からです。……からです。
  rationale: 二つのγάρが担う説明・理由の流れを、日本語の理由表現を反復することで保持した。
theological_decisions:
- issue: τὰ ἔθνηが指す人々
  choice: 異邦人たち
  alternative: 諸国民／異教徒たち
  rationale: 弟子たちとその外側の人々との歴史的な対照を保つ一方、すべての非ユダヤ人に絶対的な道徳評価を下す表現にはしない。
- issue: 父の配慮と人間の必要との関係
  choice: 必要を父がすでに知っていることを、そのまま理由として提示する
  alternative: 父が必ず必要を満たすという約束まで明示する
  rationale: この節が明言するのは父の認識であり、供給についての含意を訳文の中で明文化せず、文脈に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、父への敬意を示す「ご存じです」と説明を重ねる原文の構造を保持した。脚注記号は該当語句の直後または文末に置いた。
