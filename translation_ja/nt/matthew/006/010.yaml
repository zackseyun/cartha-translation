  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: ja
  text: あなたの王国が来ますように。あなたの意志が、天で行われるように、地上でも行われますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、「あなたの王国が来て、あなたの意志が行われますように。天でそうであるように、地上でも」と理解することもできる。この場合、「天でそうであるように、地上でも」は二つの願いの両方にかかる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: 来ますように
  rationale: ἔρχομαιのアオリスト能動命令法三人称単数。神に向けた祈願として、現代日本語の祈りに自然な「来ますように」とした。
- source_word: ἡ βασιλεία σου
  choice: あなたの御国
  rationale: βασιλείαは「王国」と「王としての支配」の双方を含み得る。マタイの文脈と日本語聖書の語感を踏まえ、「御国」として王的支配の含意を保った。
- source_word: γενηθήτω
  choice: 行われますように
  rationale: γίνομαιのアオリスト受動命令法三人称単数。θέλημαとの組み合わせでは、意志が実現されることを表すため、日本語として自然な「行われますように」とした。
- source_word: τὸ θέλημά σου
  choice: あなたのみこころ
  rationale: θέλημαは意志、望み、意図を指す。「みこころ」は神の意志を表す自然で品位ある日本語であり、目的や願望の一方に狭めない。
- source_word: ὡς ἐν οὐρανῷ
  choice: 天で行われているように
  rationale: ὡςは比較を導く。ギリシア語で省略されている述語を日本語では補わないと不自然なため、直前の「行われる」を受けて「行われているように」と明示した。
- source_word: καὶ ἐπὶ γῆς
  choice: 地上でも
  rationale: καίはこの比較構文で「〜でも」によって自然に表せる。ἐπί＋属格の場所を「地上で」とし、天と地の対照を明確にした。
theological_decisions:
- issue: 比較句 ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς の適用範囲
  choice: 本文では直近の第二の祈願「あなたのみこころが行われますように」に結び付けた。
  alternative: 「天でそうであるように、地上でも」を「御国が来ること」と「みこころが行われること」の両方にかける。
  rationale: 現代版のギリシア語句読法は編集上のものであり、統語上は適用範囲に議論の余地がある。直近の節への結び付きが最も自然だが、両方の祈願にかかる可能性を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、祈りとしての品位を保った。「御国」は慣用性と神の王的支配という含意を両立させるため漢字表記とし、「みこころ」は読みやすさを優先して平仮名表記とした。
