id: MAT.6.6
reference: Matthew 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: ja
  text: しかし、あなたが祈るときは、あなたの奥の部屋[a]に入り、戸を閉めてから、隠れた所におられるあなたの父に祈りなさい。そして、隠れた所で見ておられるあなたの父が、あなたに報いてくださる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人目につかない部屋」「物置」とも訳せる。ギリシア語は、家の内部にある、私的な場所または物を保管する部屋を指す。
    reason: lexical_alternative
  - marker: b
    text: 「返してくださる」とも訳せる。ギリシア語の動詞には、返す、返報する、報いるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: しかし、あなたが
  rationale: 前節の偽善者たちとの対比を「しかし」で示し、強調された代名詞 σὺ も「あなたが」と明示した。
- source_word: ὅταν προσεύχῃ
  choice: 祈るときは
  rationale: ὅταν と接続法による一般的・反復的な時を、自然な現代日本語で表した。
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: 奥まった自分の部屋に入り
  rationale: ταμεῖον は家の内部にある、人目を避けられる部屋または物置を指し得る。「奥まった部屋」は用途を物置に限定せず、隔てられた内部空間という含みを保つ。
- source_word: κλείσας τὴν θύραν σου
  choice: 戸を閉めてから
  rationale: アオリスト分詞が主命令に先立つ動作を示すため、動作の順序を明瞭にした。
- source_word: πρόσευξαι τῷ πατρί σου
  choice: あなたの父に祈りなさい
  rationale: 本文にない「天の」を補わず、父という関係的呼称をそのまま保った。
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: 隠れた所におられる
  rationale: 隠されていることと場所的な含みの双方を残し、直後の反復表現とも対応させた。
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: 隠れた所で見ておられる
  rationale: ἐν τῷ κρυπτῷ の反復を「隠れた所」で保持した。「隠れてしたことを」と目的語を補わず、何が見られるのかを限定しすぎない。
- source_word: ἀποδώσει σοι
  choice: あなたに報いてくださる
  rationale: ἀποδίδωμι の返報・報償の意味を文脈に即して「報いる」とした。敬語補助動詞は、神である父を指す日本語として自然である。
theological_decisions:
- issue: ἐν τῷ κρυπτῷ の反復と意味
  choice: 父については「隠れた所におられる」、見ることについては「隠れた所で見ておられる」とした。
  alternative: 「人目につかない所におられる／隠れてしたことを見ておられる」
  rationale: 原文は同一表現を反復し、場所、状態、秘された領域の間に含みを持つ。目的語を補って意味を一つに決めず、反復と神学的緊張を保った。
- issue: πατήρ の訳語
  choice: 父
  alternative: 天の父
  rationale: この節の本文には「天の」に当たる語がないため補わず、イエスが祈りの相手である神を示す関係的呼称を直接訳した。
- issue: ἀποδώσει の意味
  choice: 報いてくださる
  alternative: 返してくださる／償ってくださる
  rationale: 文脈上は人に見せるためでない祈りへの神の応答を述べており、「報いる」が自然である。ただし報いの具体的内容は本文が述べないため限定しなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「戸」は室内の仕切りを自然に表し、「父」は原文の簡潔な呼称を維持した。二度の「隠れた所」は意図的な反復である。
