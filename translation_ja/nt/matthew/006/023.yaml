id: MAT.6.23
reference: Matthew 6:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: ja
  text: しかし、あなたの目が悪ければ[a]、あなたの全身は暗くなる。だから、あなたの内にある光が闇なら、その闇はどれほど大きいことか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「邪悪な目」「健全でない目」とも訳せる。また、「目」を用いた慣用表現と前後の文脈から、「物惜しみする目」という含みもあり得る。
    reason: πονηρόςの語義と「悪い目」という比喩に複数の解釈可能性があるため。
lexical_decisions:
- source_word: πονηρὸς
  choice: 悪い
  rationale: 道徳的な「悪い」、機能的に「健全でない」、また文脈上は物惜しみする目という含みもあり得る。本文では意味を一つに限定せず、広い語義を保つ「悪い」とした。
- source_word: σκοτεινὸν
  choice: 暗くなる
  rationale: 未来形ἔσταιとともに、全身が「暗いものとなる」ことを自然な現代日本語で表した。
- source_word: φῶς
  choice: 光
  rationale: 内的・道徳的な認識を示す比喩だが、原文の光と闇の対照を保つため字義どおり「光」とした。
- source_word: σκότος
  choice: 闇
  rationale: φῶςとの対照と末尾の強い反復を保ち、日本語として格調のある「闇」とした。
- source_word: πόσον
  choice: どれほど深いことか
  rationale: 省略を伴う感嘆表現として程度の甚だしさを示す。「どれほど大きいか」よりも、日本語では闇について自然な「深い」を用いた。
- source_word: ὀφθαλμός
  choice: 目
  rationale: 知覚、意図、道徳的方向性にかかわる身体的比喩を保つため、字義どおり「目」とした。
- source_word: ὅλον τὸ σῶμά σου
  choice: あなたの全身
  rationale: ὅλονの全体性を簡潔で自然な日本語で表した。
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: あなたの内にある光
  rationale: 「内なる光」のように概念化しすぎず、前置詞句を明示的に訳して原文の表現を保った。
theological_decisions:
- issue: 「悪い目」という比喩の意味
  choice: 本文では意味の広い「目が悪い」を用い、比喩を開いたままにする。
  alternative: 「邪悪な目」「健全でない目」「物惜しみする目」
  rationale: マタイ6:19–24の文脈では、道徳的な悪、歪んだ認識、またセム語的な慣用表現としての物惜しみが重なり得る。本文で一つに決めず、可能性を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、光と闇の比喩および末尾の感嘆の力を保った。「しかし」と「だから」でδὲとοὖνの論理関係を示した。
