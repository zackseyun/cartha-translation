reference: Matthew 6:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: ja
  text: 空の鳥をよく見なさい。鳥は種をまくことも、刈り入れることも、倉に集めることもしません。そして、あなたがたの天の父は鳥を養っておられます。あなたがたは、鳥よりもはるかに価値があるのではありませんか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: よく見なさい
  rationale: 対象へ注意深く目を向けるよう命じるアオリスト命令形の力を、自然な現代日本語で表した。単なる視認よりも、そこから学ぶために注目する含みを保つ。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: πετεινάを文脈に即して「鳥」、οὐρανόςを目に見える領域として「空」と訳した。「天の鳥」より自然であり、「空を飛ぶ鳥」として原文にない動作を加えることも避けた。
- source_word: ὅτι
  choice: （独立した文として展開）
  rationale: ここでは鳥に目を向ける際の観察内容ないし理由を導く。日本語では「種をまくことも…しません」と文を分けることで、意味関係を保ちながら不自然な「ということを」を避けた。
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: 種をまくことも、刈り入れることも、倉に集めることもしません
  rationale: 三つの農耕・貯蔵行為の並行を保ち、「も…も…も…ない」によって反復を明瞭にした。
- source_word: εἰς ἀποθήκας
  choice: 倉に
  rationale: ἀποθήκηは収穫物などを蓄える場所を指す。「倉」は簡潔で、農耕の文脈にも合う。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: あなたがたの天の父
  rationale: 関係を表す「父」とοὐράνιοςの限定をともに保持した。日本語聖書語として理解しやすく、現代語としても明瞭である。
- source_word: τρέφει αὐτά
  choice: 鳥を養っておられます
  rationale: τρέφωは食物を与えて生かすことを表す。「養う」は「食べさせる」より広い供給の含みを保ち、主語への敬意を自然な日本語で示す。代名詞は指示対象を明確にするため「鳥」とした。
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: あなたがたは、鳥よりもはるかに価値ある者ではありませんか
  rationale: 肯定を期待する修辞疑問を保持した。διαφέρωの比較的な優越を「価値ある」、μᾶλλονの強意を「はるかに」で表し、その価値の神学的根拠は補わなかった。
theological_decisions:
- issue: 人間と鳥との相対的価値
  choice: 聞き手が鳥よりもはるかに価値ある者だという比較だけを明示する
  alternative: 神のかたち、または契約関係を、その価値の明示的根拠として訳文に加える
  rationale: 本文は聞き手のより大きな価値を肯定するが、その理由をこの節では特定していないため、特定の教理的説明を訳文に持ち込まない。
- issue: 父による鳥への供給と人への配慮の論理
  choice: 鳥を実際に養う天の父から、人へのより大きな配慮を推論させる修辞を保つ
  alternative: 人には苦難や欠乏が一切ないという保証として言い換える
  rationale: 本文は神の配慮を根拠に不安へ語りかけるが、あらゆる欠乏の不在を直接述べてはいない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。命令形は「よく見なさい」とし、三つの行為の修辞的並行と、結びの修辞疑問を保った。解釈上必要のない脚注は設けていない。
