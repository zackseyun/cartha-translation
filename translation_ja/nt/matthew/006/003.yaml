  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: ja
  text: しかし、あなたが貧しい人に施しをするときは[a]、左の手が、右の手のしていることを知らないようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
