    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: しかし、あなたが…するときは
  rationale: 属格独立構文を自然な日本語の時を表す節で訳し、δέによる直前との対比を「しかし」で示した。
- source_word: ἐλεημοσύνην
  choice: 貧しい人に施し
  rationale: 語が指す、困窮者への慈善的な施与を明確にする。「施し」は簡潔で現代日本語でも理解可能だが、意味範囲を脚注で補った。
- source_word: μὴ γνώτω
  choice: 知られないようにしなさい
  rationale: 三人称命令の禁止を自然な日本語にしつつ、左右の手を擬人化する鮮明な比喩を保った。
- source_word: ἡ ἀριστερά σου
  choice: 左の手
  rationale: 原文の身体的イメージと左右の対句をそのまま保った。
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: 右の手がしていること
  rationale: 現在形の継続的なニュアンスを「している」で表し、原文の語順に近い印象的な表現とした。
theological_decisions:
- issue: 左右の手についての言葉の解釈
  choice: 人目や自己顕示を避けた施しを促す鮮明な比喩として、そのまま残す。
  alternative: 一般的な謙遜の教えとして言い換える、または公に行う慈善を例外なく禁じる命令と明示する。
  rationale: 原文の擬人化と誇張を解釈的に平板化せず、また本文以上に厳格な教理的結論も加えないことで、隠れた寛大さを求める力点と解釈上の余地を保った。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「右の手／左の手」として原文の比喩と対句を保持し、「貧しい人に」で施しの対象を明示した。
