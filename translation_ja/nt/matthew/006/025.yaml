id: MAT.6.25
reference: Matthew 6:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: ja
  text: だから、あなたがたに言います。何を食べようかと自分たちの命[a]について、また何を着ようかと自分たちの体について、心配してはいけません。命は食べ物以上のもの、体は衣服以上のものではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魂」とも訳せるギリシア語。ここでは食べ物、体、衣服に関する文脈なので、「命」の意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: だから
  rationale: 直前の教えを受けた推論・帰結を、現代日本語で自然かつ明瞭に示す。
- source_word: μὴ μεριμνᾶτε
  choice: 心配してはいけません
  rationale: 必要への思慮そのものではなく、思い煩うような不安を禁じる文脈であり、一般読者に明快な表現とした。
- source_word: τῇ ψυχῇ ὑμῶν
  choice: 自分の命[a]のことで
  rationale: 食べることとの対比から、ここでは非物質的な「魂」に限定せず、生きている自分・生命を指す「命」が適切である。属格的な関心の対象を自然な日本語で表した。
- source_word: τί φάγητε
  choice: 何を食べようか
  rationale: μεριμνάωに伴う間接疑問で、将来の必要を案じる意味を自然な日本語で表す。
- source_word: τῷ σώματι ὑμῶν
  choice: 自分の体のことで
  rationale: 衣服との対比にある身体を直接示す。
- source_word: τί ἐνδύσησθε
  choice: 何を着ようか
  rationale: 衣服を身に着けることを、現代日本語で簡潔かつ自然に表す。
- source_word: οὐχὶ
  choice: ではありませんか
  rationale: 肯定の答えを期待する修辞疑問の力を保つ。
- source_word: πλεῖόν ... τῆς / τοῦ
  choice: …以上のもの
  rationale: 命と体が、それを支える食べ物や衣服を超えるものであるという比較を、価値だけに意味を狭めず表現する。
- source_word: τροφῆς
  choice: 食べ物
  rationale: 命を支える食物を指す、明快で一般的な語。
- source_word: ἐνδύματος
  choice: 衣服
  rationale: 身に着ける物一般を指し、文章の品位と「食べ物」との対句を保つ。
theological_decisions:
- issue: ψυχήがここで指すもの
  choice: 本文では「命」と訳す
  alternative: 「魂」
  rationale: 食べること、体、衣服という生活上の必要を扱う文脈では、ψυχήは地上の生命または生きている自己を表す。「魂」と限定すると、この節が明示していない心身二元論的な含意を持ち込みかねないため、別訳を注記した。
- issue: 命・体と食べ物・衣服との比較
  choice: 「以上のもの」とし、比較の広がりを保つ
  alternative: 「より大切」「より価値がある」
  rationale: πλεῖονは重要性や価値を含み得るが、それだけに限定されない。「以上のもの」は、命と体がそれらを支える物より大きな存在であるという論旨を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの教えにふさわしい落ち着いた丁寧体とした。修辞疑問と、命／食べ物・体／衣服の並行関係を保持した。
