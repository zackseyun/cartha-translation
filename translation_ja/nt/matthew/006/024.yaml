  to: だれも二人の主人に仕えることはできない。一方を憎んで他方を愛するか、一方に忠実で他方を軽んじるか、どちらかだからである。あなたがたは、神とマモン[a]の両方に仕えることはできない。
  rationale: ἑνὸς ἀνθέξεταιに対応する箇所のみを、「固くついて」から「忠実で」へ改めた。これにより、一方への堅い帰属・献身という原文の意味を保ちながら、明瞭な現代標準日本語としての自然さを高めた。その他の表現と脚注は原文と英語監査記録に忠実であり、変更を要しない。
