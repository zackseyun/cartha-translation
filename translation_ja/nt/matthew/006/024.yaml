  source_fidelity: 全体として原文の論理と対句をよく保っている。「二人の主人」「仕える」「神とマモン」は、δουλεύεινの主従関係とμαμωνᾷの修辞的な対置を適切に反映する。「あなたがた」は原文の複数形δύνασθεにも合う。ただし、ἑνὸς ἀνθέξεταιは単に物理的に『固くつく』というより、一方にしっかり付き従い、支持・忠誠を示すことをいう。
  naturalness: 「一方に固くついて」は意味を推測できるものの、現代標準日本語ではやや口語的かつ身体的な付着の印象があり、この格言的文脈では不自然さが残る。「一方に忠実で」とすることで、明瞭で自然な対照になる。
  terminology: 「主人」はこの文脈のκύριοιςに適切であり、「神」との称号上の混同も避けられている。「マモン」の音写と脚注も適切である。脚注の「富」「財産」は語義の説明として十分であり、擬人化は断定しすぎず「主人のように表している」と説明されている。
