id: MAT.6.24
reference: Matthew 6:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: ja
  text: だれも二人の主人に仕えることはできない。一方を憎んで他方を愛するか、一方に忠実で他方を軽んじるか、どちらかだからである。あなたがたは、神とマモン[a]の両方に仕えることはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「富」「財産」とも訳せる。原文はアラム語由来の借用語「マモン」を用いており、富を神と競い合う主人のように表している。
    reason: 借用語の意味と擬人化された修辞を説明するため。
lexical_decisions:
- source_word: Οὐδεὶς
  choice: だれも……ない
  rationale: 普遍的な否定を、明瞭で自然な現代日本語の呼応表現で示した。
- source_word: δυσὶ κυρίοις
  choice: 二人の主人
  rationale: ここでは奴隷・僕として仕える関係が念頭にあるため、「二人の主」よりも社会的関係を明確に表す「二人の主人」とした。
- source_word: δουλεύειν
  choice: 仕える
  rationale: 奴隷として奉仕する語だが、「主人」との組み合わせにより従属関係が十分伝わるため、自然な「仕える」とした。
- source_word: μισήσει / ἀγαπήσει
  choice: 憎む／愛する
  rationale: 対照の強さを弱めず、原文どおりの対句を保った。
- source_word: ἑνὸς ἀνθέξεται
  choice: 一方に固くつく
  rationale: 一方にしっかり結びつき、離れずにいる意味を保ちつつ、一般の読者に通じる表現とした。
- source_word: καταφρονήσει
  choice: 軽んじる
  rationale: 相手を低く見て顧みないという意味を、簡潔で品位ある現代語で表した。
- source_word: μαμωνᾷ
  choice: マモン
  rationale: アラム語由来の借用語を残し、富が神と並ぶ競合する主人のように提示される修辞を保持した。意味は脚注で補った。
theological_decisions:
- issue: κύριοςを社会的な支配者の意味でどう訳すか
  choice: 主人
  alternative: 主
  rationale: 複数形で、δουλεύεινとの組み合わせが主人と奴隷の関係を示すため、神的称号との混同を避けて文脈上の意味を明示した。
- issue: μαμωνᾶςの訳し方
  choice: マモン
  alternative: 富／財産／金銭
  rationale: 神と並ぶ奉仕の対象として擬人化された響きを保つため音写し、語義上の選択肢は脚注に示した。
- issue: μισέωの強さ
  choice: 憎む
  alternative: より少なく愛する
  rationale: 比較的な含みを想定して弱めず、「愛する」と「軽んじる」に対する原文の強い対照をそのまま残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格言的な対句と荘重さを保った。「一方／他方」を反復して原文の均衡を再現し、末尾の「神とマモン」の対立を際立たせた。
