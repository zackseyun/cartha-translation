  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: ja
  text: しかし、あなたは断食するとき、頭に油を塗って[a]、顔を洗いなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「頭に油を塗る」は、当時の日常的な身だしなみの一つを指すことがある。
    reason: lexical_alternative
  - marker: b
    text: つまり、断食していることが外見から人に分からないよう、普段どおりの姿を保つということ。
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: しかし、あなたは
  rationale: 強調された代名詞とδέにより、前節の偽善者たちとの対照が示される。「しかし、あなたは」として、その対照と呼びかけを自然な日本語で保った。
- source_word: νηστεύων
  choice: 断食するとき
  rationale: 現在分詞を時を表す従属節として訳した。命令の状況を明確かつ自然に示す。
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: 頭に油を塗り
  rationale: ἀλείφωは油などを塗ることを表す。この文脈では儀式的な「油を注ぐ」より、日常の身だしなみを示す「油を塗る」が明確で自然である。κεφαλήは語義に即して「頭」とした。
- source_word: καὶ τὸ πρόσωπόν σου νίψαι
  choice: 顔を洗いなさい
  rationale: νίπτωは身体の一部を洗うことを表すため、「顔を洗う」とするのが簡潔で自然である。二つの命令は日本語として「塗り、洗いなさい」と連結した。
theological_decisions:
- issue: 断食中の外見についての命令の性質
  choice: 断食を人目につくものにせず、普段どおり身だしなみを整えるよう命じている
  alternative: 儀式的な塗油を命じている、または公の場での断食そのものを禁じている
  rationale: 直前の文脈は、偽善者が断食を見せるために顔をやつれさせることと対照をなす。本節の表現自体は断食を禁じず、また塗油を儀式として明示してもいないため、その範囲を越えて解釈を限定しない。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある命令文とした。「香油を注ぐ」は儀式的な印象を強めうるため避け、「油を塗る」と具体的に表現した。
