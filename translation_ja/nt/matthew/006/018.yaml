reference: Matthew 6:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: ja
  text: それは、あなたが断食していることが人々には見えず、隠れたところにおられるあなたの父には見えるようにするためです。そして、隠れたところで見ておられるあなたの父が、あなたに報いてくださいます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: あなたが断食していることを人々に見せるためではなく
  rationale: ὅπως は文脈上の目的を表し、μὴ…ἀλλὰ の対比を日本語で明瞭にした。φανῇς は受動形だが、「人々の目に断食している者として現れる」という意味を、自然な日本語の「見せる」で表した。ἀνθρώποις は男性に限定されないため「人々」とした。
- source_word: ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ κρυφαίῳ
  choice: 隠れたところにおられるあなたの父に示すためです
  rationale: 前半との対比を補って自然な日本語にした。「示す」はギリシア語で明記されない省略要素だが、φανῇς の意味を対照節にも及ぼしたもの。κρυφαίῳ は場所とも秘かな領域とも取れるため、過度に限定しない「隠れたところ」とした。
- source_word: ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: 隠れたところで見ておられるあなたの父
  rationale: 関係する二つの分詞的表現を保ち、κρυφαίῳ の反復も同じ訳語で示した。「隠れて行われることを」と目的語を補わず、原文の簡潔さと曖昧さを保った。
- source_word: ἀποδώσει σοι
  choice: あなたに報いてくださいます
  rationale: ἀποδίδωμι は本来「返す、相応に与える」だが、この文脈では神による応報を表す。「報いる」が自然であり、父への敬意を「くださいます」で示した。
theological_decisions:
- issue: 断食を誰に「見せる」のかという対比
  choice: 人々に見せるのではなく、父に示す
  alternative: 人々には断食しているように見えず、父にだけ見える
  rationale: μὴ…ἀλλὰ は人間の観衆と父との対比を形成する。父に対する節では動詞が省略されているため、日本語では「示す」を補ったが、父だけが断食を視覚的に見るという狭い意味には限定しなかった。
- issue: ἐν τῷ κρυφαίῳ の意味
  choice: 二度とも「隠れたところ」と訳す
  alternative: 「ひそかなところで」「隠れたことを」
  rationale: 第一の用例は父の隠れた臨在、第二は父が見る領域または仕方を表し得る。同じギリシア語の反復を保ちつつ、その神学的・統語的な幅を残した。
- issue: 神の応報
  choice: 「報いてくださいます」
  alternative: 「返してくださいます」「報酬を与えてくださいます」
  rationale: 善行による救済などの体系を持ち込まず、この箇所が明言する父の応答だけを表した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教的な加筆を避けた。「父」は文脈上神を指すが、原文どおり称号を追加しない。文末は敬語にして尊厳を保った。
