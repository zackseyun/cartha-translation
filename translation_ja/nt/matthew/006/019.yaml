id: MAT.6.19
reference: Matthew 6:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: ja
  text: 自分のために地上に宝を蓄えてはいけません。そこでは、蛾や損耗[a]によって損なわれ、盗人たちが押し入って[b]盗みます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「さび」とも訳せます。ギリシア語は、金属のさびだけでなく、物をむしばむ作用や消耗・劣化を広く指すことがあります。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「掘り抜いて」。当時の盗人が土壁などを破って家に侵入することを指すと考えられます。
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: 蓄えてはいけません
  rationale: μήを伴う現在命令形の禁止を、現代日本語で明確かつ自然に表す。「蓄える」により、宝をため込むという動詞の意味を保つ。
- source_word: ὑμῖν
  choice: 自分のために
  rationale: ここでは行為者自身の所有や利益のためという再帰的な意味を持つ与格であり、日本語で明示する。
- source_word: θησαυροὺς
  choice: 宝
  rationale: 金銭だけに限定せず、価値ある地上的財産全般を含み得る語として訳す。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上に
  rationale: 続く節の天との対比を保ちつつ、日本語として自然な場所表現にする。
- source_word: σὴς
  choice: 蛾
  rationale: 衣類などの貯蔵品を害する蛾を指すため、原語に直接対応する語を用いる。
- source_word: βρῶσις
  choice: 腐食
  rationale: 原義は食べること、食い尽くすことから生じた消耗・劣化を表し得る。「さび」だけに限定せず、物がむしばまれる意味を簡潔に示す。
- source_word: ἀφανίζει
  choice: 損ない
  rationale: 消失させる、台なしにするという意味を、蛾と腐食の双方に自然に結びつく表現で示す。
- source_word: κλέπται
  choice: 盗人
  rationale: 窃盗を行う者を指す語に対応し、文体の品位を保ちながら明確に訳す。
- source_word: διορύσσουσιν
  choice: 押し入って
  rationale: 字義は「掘り抜く」で、家の壁を破って侵入する行為を指すと考えられる。本文では現代の読者に直ちに通じる侵入の意味を訳し、具体的背景は脚注に残す。
- source_word: κλέπτουσιν
  choice: 盗みます
  rationale: 窃盗行為を表す基本的な意味をそのまま訳す。
theological_decisions:
- issue: γῆの範囲と天との対比
  choice: 地上に
  alternative: この地に／地球上に
  rationale: 直後の文脈にある天との対比を示しながら、原文以上の宇宙論的・神学的区別を持ち込まない。
- issue: βρῶσιςの意味範囲
  choice: 腐食
  alternative: さび／朽ち／食い荒らすもの
  rationale: 伝統的な「さび」も文脈上可能だが、原語はより広く、食い尽くす作用や物の劣化を表し得る。本文では意味範囲を過度に金属へ限定せず、別訳を脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保つ丁寧体とした。「だめにする」より品位のある「損なう」を選び、原文の具体性と自然な日本語の均衡を図った。脚注記号は、それぞれ説明対象である「腐食」と「押し入って」の直後に置いた。
