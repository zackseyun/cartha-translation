id: MAT.6.1
reference: Matthew 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: ja
  text: しかし、人に見せるために、人前で自分たちの正しい行いをしないよう、注意しなさい。[a] そうでなければ、天におられるあなたがたの父から報いを受けることはありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの正しさを」とも訳せる。異読には「施しを」がある。
    reason: textual_variant
  - marker: b
    text: 「天」は、ギリシア語では複数形で「諸天」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: 注意しなさい
  rationale: 現在命令形の継続的な警戒の呼びかけを、明瞭で自然な現代日本語にした。
- source_word: δὲ
  choice: ただし
  rationale: 直前の教えを受けつつ、ここで警告へ転じる対照・移行を表す。
- source_word: τὴν δικαιοσύνην ὑμῶν μὴ ποιεῖν
  choice: 自分の正しさを行わないように
  rationale: SBLGNTのδικαιοσύνηνを狭く施しに限定せず、『正しさ』として幅を保った。ποιεῖνとの結びつきも見える表現にした。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 人前で
  rationale: 人間一般の目の前で行うことを、性別を限定せず簡潔に表す。
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: 人に見てもらおうとして
  rationale: 目的を表す構文と、他者の注目を意図する含みを自然な日本語で保持した。
- source_word: εἰ δὲ μή γε
  choice: そうでなければ
  rationale: 条件に伴う警告を日本語として自然に示す。
- source_word: μισθὸν οὐκ ἔχετε
  choice: 報いを受けることはありません
  rationale: 直訳的には『報いを持たない』だが、神からの報償という文脈に即して自然にした。
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: あなたがたの父から
  rationale: 報いの源を示す意味を明瞭に表した。
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: 天におられる
  rationale: 日本語では慣用的で明瞭な単数形『天』を本文に用い、ギリシア語の複数形は脚注で示した。
theological_decisions:
- issue: δικαιοσύνηνの範囲
  choice: 正しさ
  alternative: 正しい行い／施し
  rationale: 底本のδικαιοσύνηνは広い意味を持ち得るため、本文では施しだけに限定しない。行為を指す理解と異読の『施し』は脚注に残した。
- issue: ἀνθρώπωνの指示対象
  choice: 人
  alternative: 男たち
  rationale: ここでは男性だけでなく、人間の観衆一般を指す。
- issue: τοῖς οὐρανοῖςの数
  choice: 天
  alternative: 諸天
  rationale: ギリシア語の形は複数だが、日本語本文では不自然な教義的含意を避けて慣用表現を用い、原文の数は脚注で明示した。
- issue: 報いの所在・源を表すπαρά＋与格
  choice: 父から報いを受ける
  alternative: 父のもとに報いがある
  rationale: 源を表す理解を本文に採ったが、ギリシア語は父のもとでの所在・近接としても捉え得るため、意味を過度に体系化しない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。命令は『注意しなさい』とし、δικαιοσύνηの広さと本文異読を脚注で保持した。脚注記号[a]と[b]は、それぞれ関連する本文箇所に配置した。
