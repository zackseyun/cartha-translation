translation:
  language: ja
  text: 私たちの日ごとの[a]パンを、今日、私たちにお与えください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「今日のためのパン」「来る日のためのパン」「必要なパン」。ギリシア語の形容詞エピウーシオスは用例が極めて少なく、正確な意味について見解が分かれている。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: 私たちのパン
  rationale: ἄρτοςの具体的な像を保って「パン」とし、属格ἡμῶνを自然な所有表現「私たちの」で表した。パンは広く食物や生活の糧を指し得るが、本文では意味を一般化しない。
- source_word: τὸν ἐπιούσιον
  choice: 日ごとの
  rationale: ἐπιούσιοςは極めて稀で意味が論争されている。「日ごとの」は主の祈りの定着した自然な訳で、日々神に養いを求める願いを簡潔に表す。ただし「今日の」「来る日の」「必要な」という可能性を排除しないよう脚注に示した。
- source_word: δὸς ἡμῖν
  choice: 私たちにお与えください
  rationale: δίδωμιのアオリスト命令形と与格代名詞を、祈りにふさわしい現代日本語の丁寧な願いとして訳した。命令の直接性を保ちつつ、不自然に強い語調を避けた。
- source_word: σήμερον
  choice: 今日も
  rationale: 基本義は「今日」。「日ごとのパン」と日本語で自然につなぎ、日々繰り返される祈りであることを表すため助詞「も」を補った。時間指定そのものは「今日」に保持されている。
theological_decisions:
- issue: 主の祈りにおけるἐπιούσιονの意味
  choice: 日ごとの
  alternative: 「今日の」「来る日の」「必要な」
  rationale: この形容詞は、当日の糧、来る日の糧、または生きるために必要な糧を指す可能性がある。本文では明瞭で定着した「日ごとの」を採り、どれか一つの語源的解釈に限定せず、真正な曖昧さを脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語。祈りとしての品位を保つため「お与えください」を用い、古風な「我ら」「与えたまえ」は避けた。脚注記号[a]は本文中に明示した。
