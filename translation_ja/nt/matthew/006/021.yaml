  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ja
  text: というのも、あなたの宝があるところには、あなたの心もあるでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: あるところ
  rationale: 場所を示す関係節を自然な日本語で表し、後半の「そこに」との対応を保つ。
- source_word: γάρ
  choice: からです
  rationale: 直前の教えに対する理由・説明であることを、現代日本語として自然な文末表現で示す。
- source_word: θησαυρός
  choice: 宝
  rationale: 物質的な富と、価値を置くものという比喩的な含みの双方を保てる標準的な訳語。
- source_word: σου
  choice: あなたの
  rationale: 「宝」と「心」の双方に付く二人称単数の所有を明示する。
- source_word: ἐκεῖ
  choice: そこに
  rationale: ὅπουとの「ところ……そこに」という対応関係と簡潔な並行性を保つ。
- source_word: ἔσται
  choice: あるようになる
  rationale: 未来形を現在形に平板化せず、心が宝のあるところへ向かい、そこに置かれるという方向性も自然な日本語で伝える。単純な「あるだろう」より格言の意味が明瞭。
- source_word: καρδία
  choice: 心
  rationale: 願望、忠誠、内面的な志向を含み得る語義の広さを保つ定着した訳語。
- source_word: καὶ
  choice: も
  rationale: 宝の所在に心の所在を加える働きを、簡潔な日本語で示す。
theological_decisions:
- issue: 知恵文学的な格言におけるἔσταιの時間的意味
  choice: 未来の方向性を「あるようになる」で保持する
  alternative: 一般的真理として現在形の「ある」と訳す
  rationale: ギリシア語は未来形であり、宝と心の静的な一致だけでなく、心が宝の置かれたところへ向かう含みを残す。ただし、特定の心理過程や教理を本文以上に断定しない。
translation_notes:
  register: 明瞭で現代的かつ格調を保った常体。前節との説明的つながりを文末の「からです」で示した。短い格言としての並行性を優先した。
