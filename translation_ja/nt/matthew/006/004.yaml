  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: ja
  text: あなたの貧しい人への施しが、人目につかないところで行われるようにしなさい。人目につかないところで見ておられるあなたの父が、あなたに報いてくださる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: それは、…ためである
  rationale: 直前の命令に結びつく目的の意味を保ちつつ、現代日本語として自然に表した。
- source_word: ἐλεημοσύνη
  choice: 貧しい人への施し
  rationale: 一般的な慈善ではなく、困窮者に与える行為を具体的に指す語義を明確にした。
- source_word: ἐν τῷ κρυπτῷ
  choice: 人目につかないところで／人目につかないところを
  rationale: 公の目から隠れているという慣用的意味を自然に示し、両節で同じ表現を反復した。後半では βλέπων の目的語として自然になるよう助詞を調整した。
- source_word: ὁ πατήρ σου
  choice: あなたの父
  rationale: 原文にない「天の」を補わず、父を指す表現をそのまま保った。
- source_word: ὁ βλέπων
  choice: 見ておられる
  rationale: 継続的に見ていることを表す分詞を、敬意を込めた自然な連体表現にした。
- source_word: ἀποδώσει σοι
  choice: あなたに報いてくださる
  rationale: 神の好意的な応答を自然に伝えながら、報いの形や時期を限定しない。「返してくださる」という原義寄りの可能性は脚注に残した。
theological_decisions:
- issue: ἀποδώσει が表す神の応報の性質
  choice: 報いてくださる
  alternative: 返してくださる
  rationale: 隠れた施しに対する神の肯定的な応答を示しつつ、それが物質的、霊的、現世的、終末的のいずれかを特定しない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「施し」は文脈上の具体性を保つため「貧しい人への施し」とした。「人目につかないところ」を反復し、原文の構造的な対応を見える形で残した。
