  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: ja
  text: 「目は体のともしびです。ですから、あなたの目が健やかであれば[a]、体全体が光に満ちるでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「単純であれば」「澄んでいれば」「正常であれば」とも訳せる。このギリシア語には「分かれていない」という意味もあり、文脈によっては「惜しみない」という意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: ともしび
  rationale: 抽象的な「光」ではなく具体的な灯火を指す語であり、目を体を照らすものにたとえる比喩を保つ。
- source_word: σῶμα
  choice: 体
  rationale: 身体的な比喩を明瞭かつ自然な現代日本語で表す。
- source_word: ὀφθαλμός
  choice: 目
  rationale: 身体器官としての像と、その比喩的含意の双方を保つ直接的な訳。
- source_word: ἐὰν οὖν
  choice: ですから、…であれば
  rationale: οὖνの推論・帰結のつながりと、ἐὰνの条件を自然な日本語で示す。
- source_word: ἁπλοῦς
  choice: 健やかで
  rationale: 直後の「悪い目」との対比および体が照らされるという視覚の比喩に即して、正常に働く目を自然に表す。一方、「純一な」「澄んだ」「惜しみない」などの含意は脚注に残す。
- source_word: ὅλον
  choice: 全体
  rationale: 体のすべてに及ぶ包括性を簡潔に表す。
- source_word: φωτεινὸν
  choice: 光に満ちます
  rationale: 単に「明るい」よりも、目というともしびによって体全体が照らされる像を自然に伝える。
- source_word: ἔσται
  choice: 満ちます
  rationale: ギリシア語の未来形を、日本語の条件文における帰結として自然に表現する。
theological_decisions:
- issue: 目を形容するἁπλοῦςの意味
  choice: 本文では「健やか」と訳す
  alternative: 「純一な」「澄んだ」「正常な」、文脈によっては「惜しみない」
  rationale: 直接の比喩は、目の状態によって体が明るくなるか暗くなるかというものであるため、本文では視覚器官が正しく働く意味を前面に出す。ただし、この語が持ち得る心の分裂のなさや寛大さという含意を一つに決めず、脚注で示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「ともしび」で具体的な比喩を保ち、「健やか」は硬すぎず、目が正常に働く意味を伝える。脚注記号[a]は該当語の直後に置いた。
