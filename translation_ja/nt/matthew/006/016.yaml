  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: ja
  text: また、断食するときは、偽善者たちのように沈んだ顔つきをしてはなりません。彼らは、断食していることが人々に見えるように、自分の顔を見苦しくするのです。まことに、あなたがたに言います。彼らは自分の報いを全部受けています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: また、断食するときは
  rationale: Ὅτανは一般的・反復的な場合を表す。「断食するたびに」も可能だが、教えとして自然な日本語の「断食するときは」とし、δὲは前段の施しと祈りに続く並行的な接続として「また」とした。
- source_word: μὴ γίνεσθε … σκυθρωποί
  choice: 沈んだ顔つきをしてはなりません
  rationale: γίνεσθεの状態を取るニュアンスと、σκυθρωποίが示す陰鬱で悲しげな外見を、自然な日本語で具体的に表した。
- source_word: ὡς οἱ ὑποκριταὶ
  choice: 偽善者たちのように
  rationale: ὑποκριτήςはこの文脈で、人に見せるために敬虔さを演じる者を指すため、定着した「偽善者」を用いた。
- source_word: ἀφανίζουσιν … τὰ πρόσωπα αὐτῶν
  choice: 顔をやつれさせる
  rationale: ἀφανίζωには損なう、見苦しくするという幅があり、ここでは断食中だと分かるよう顔の外観を意図的に変えることを指す。「顔を損なう」より文脈上明瞭で、「顔をやつれさせる」は外見の演出を自然に伝える。
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: 断食していることが人々に見えるように
  rationale: ὅπωςの目的、φανῶσινの「見える／そう見られる」、τοῖς ἀνθρώποιςの一般的な「人々」を保った。性別を限定する意味はない。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの厳粛で権威ある宣言定式を、現代日本語として明瞭かつ格調を保って訳した。
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: すでに自分の報いを全部受けています
  rationale: ἀπέχωの商業的な「全額を受領した」という含意を「全部受けています」で示し、文脈上それ以上の報いが残らないという警告を保った。「すでに」は完了した受領の含意を自然に明示する。
theological_decisions:
- issue: ἀπέχουσινが含む報いの完結性
  choice: 彼らはすでに自分の報いを全部受けています
  alternative: 彼らは自分の報いを受けています
  rationale: 単に報いを持つという意味ではなく、人からの評価によって報酬を全額受領済みであるという慣用的な力を訳文に反映した。ただし、その報いの具体的内容を本文以上に説明しない。
- issue: τοῖς ἀνθρώποιςの指示範囲
  choice: 人々
  alternative: 人間たち／男たち
  rationale: ἄνθρωποιはここで性別を問わず周囲の人間一般を指す。「人々」が原文の代表的・一般的用法を現代日本語で正確に表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教的に膨らませず、イエスの警告の厳粛さを保った。文体は丁寧体で統一した。注がないため本文に脚注記号は付していない。
