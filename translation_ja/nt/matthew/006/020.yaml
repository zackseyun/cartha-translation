  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: ja
  text: しかし、自分たちのために、天に宝を蓄えなさい。そこでは、蛾にも劣化[a]にも損なわれず、盗人が壁を破って侵入[b]したり、盗んだりすることもありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「さび」とも訳せます。原語は、物を食い尽くすこと、または腐食・劣化のように物を損なうことを広く指しえます。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「掘り抜く」。当時の家の壁を破って侵入することを指すと考えられます。
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: 宝を蓄えなさい
  rationale: 現在命令形の継続的な勧めを、自然な現代日本語で表しつつ、宝を蓄積するという比喩を保った。
- source_word: δὲ
  choice: しかし
  rationale: 前節の「地上に蓄えてはならない」との対比を明確にする接続語として訳した。
- source_word: ὑμῖν
  choice: 自分たちのために
  rationale: 利益・関与を示す与格の再帰的な含みを明示した。
- source_word: θησαυροὺς ἐν οὐρανῷ
  choice: 天に宝を
  rationale: 複数形は日本語では無標の「宝」が自然であり、「天に」という場所の比喩は解釈的に言い換えず保持した。
- source_word: σὴς
  choice: 虫
  rationale: 蓄えた衣類などを食害する蛾、特に衣蛾を指すが、日本語では破壊作用が伝わりやすい簡潔な「虫」とした。
- source_word: βρῶσις
  choice: 腐食
  rationale: 食い尽くす作用や物を損なう消耗を広く表し得る語であり、金属の「さび」に限定せず、簡潔に劣化作用を示した。脚注で語義の幅を補った。
- source_word: ἀφανίζει
  choice: 宝を損なわず
  rationale: 消失させる、滅ぼすという意味を、虫と腐食の双方を主語として自然に受けられる日本語で表現した。目的語「宝」は文脈から補った。
- source_word: διορύσσουσιν
  choice: 壁を破って押し入る
  rationale: 文字どおりには「掘り抜く」で、当時の家屋の壁を破る侵入方法を指す。現代の読者にも行為が分かるよう訳し、文化的背景を脚注に示した。
- source_word: κλέπτουσιν
  choice: 盗む
  rationale: 単純で直接的な対応語を用いた。
theological_decisions:
- issue: 「天に宝を蓄える」の意味
  choice: 比喩をそのまま保持する
  alternative: 「天からの報いを得る」「霊的な富を蓄える」と説明的に訳す
  rationale: 本文自体は宝の具体的内容や報いの仕組みを説明していないため、特定の功績論や報酬論を持ち込まず、原文の比喩と含みを残した。
- issue: βρῶσιςが表す破壊作用の範囲
  choice: 「腐食」とし、脚注で広い語義を示す
  alternative: 「さび」「食害」「朽ち」
  rationale: 「さび」だけに限定すると対象が金属に狭まり得る。一方、原語は食い尽くすことや消耗・劣化を広く指し得るため、訳語と脚注を組み合わせて曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節との対比を「しかし」で示し、命令は「蓄えなさい」とした。原文の比喩は説明しすぎず保持し、歴史的背景と語義上の幅は脚注で補った。
