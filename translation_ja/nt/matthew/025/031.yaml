revisions:
- from: しかし、人の子がその栄光のうちに、すべての天使を伴って来るとき、その時、人の子は栄光に輝く王座[a]に着く。
  to: しかし、人の子が自らの栄光のうちに、すべての天使と共に来るとき、彼は自らの栄光の王座に座る。
  rationale: 天使との関係を原文どおり「共に」とし、重複する時間表現と不要な主語反復を整えた。「自らの栄光」により所有関係を明確にし、καθίσει は「座る」と直接に訳した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:22Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は「人の子」「すべての天使」「来るとき」「王座に着く」という主要要素を保っている。しかし、μετ’ αὐτοῦ は「天使を伴って」より「天使と共に」とする方が、天使が人の子に同行するという原文の関係を直接に表す。また、後半で「人の子」を繰り返す必要はなく、原文で省略された主語を日本語では「彼」と受けるのが自然である。
  naturalness: 「来るとき、その時」は現代標準日本語として重複感が強い。「来るとき、彼は」とすれば自然であり、時間的な帰結は文脈上十分に保たれる。「王座に座る」は καθίσει の基本義を明瞭に表す。
  terminology: 「人の子」「栄光」「天使」「王座」はいずれも適切である。「その栄光」は指示対象がやや曖昧なので、「自らの栄光」として αὐτοῦ を明示する。θρόνου δόξης αὐτοῦ は本文では自然な「自らの栄光の王座」とし、脚注でより逐語的な語順を示す。
  issues:
  - severity: medium
    issue: 「すべての天使を伴って」
    rationale: μετ’ αὐτοῦ は「彼と共に」であり、天使が人の子に同行する関係を表す。「人の子が天使を伴う」も文脈的には可能だが、原文の簡潔な同行表現から一歩踏み出すため、「すべての天使と共に」がより忠実である。
  - severity: low
    issue: 「来るとき、その時」の重複
    rationale: Ὅταν と τότε の連関を反映しようとする意図は妥当だが、日本語では不自然に重なる。従属節と主節の順序だけで時間的連関を自然に示せる。
  - severity: low
    issue: 「その栄光」および脚注の「その栄光の王座」
    rationale: αὐτοῦ は人の子に属する栄光を指す。「自らの栄光」とすることで指示対象を明確にし、脚注も同じ所有関係を保つべきである。
  revised_text: しかし、人の子が自らの栄光のうちに、すべての天使と共に来るとき、彼は自らの栄光の王座に座る。
  revised_footnotes:
  - marker: a
    text: より直訳すると、「自らの栄光の王座」。
    reason: θρόνου δόξης αὐτοῦ の属格表現を、より原文の語順に近く示すため。
  revision_rationale: 天使との関係を原文どおり「共に」とし、重複する時間表現と不要な主語反復を整えた。「自らの栄光」により所有関係を明確にし、καθίσει は「座る」と直接に訳した。
