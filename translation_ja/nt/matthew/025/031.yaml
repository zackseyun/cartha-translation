reference: Matthew 25:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: ja
  text: しかし、人の子が自らの栄光のうちに、すべての天使と共に来るとき、彼は自らの栄光の王座に座る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν
  choice: 来るとき
  rationale: 未来の一回的な出来事を導く時の表現として、現代日本語で自然な「～とき」とした。
- source_word: δὲ
  choice: しかし
  rationale: 談話の転換と穏やかな対照を示す接続詞として訳した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: ダニエル書との関連を持つイエスの称号として、伝統的かつ簡潔な訳語を保持した。
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: その栄光のうちに
  rationale: δόξαの威光、誉れ、顕現という聖書的な含みを保ちつつ、ἐνの表現も反映した。
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: すべての天使を伴って
  rationale: 本文に明示されていない所有表現を加えず、「すべての天使」と同行の意味を自然な日本語で示した。
- source_word: τότε
  choice: その時
  rationale: 来臨に続く着座という時間的な順序を明示した。
- source_word: καθίσει
  choice: 着く
  rationale: 王座との組み合わせでは「王座に着く」が自然で、統治者・裁き主として着座する動作を簡潔に表す。
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: 栄光に輝く王座に
  rationale: 属格連鎖を現代日本語で自然な修飾表現にし、王座が栄光によって特徴づけられる意味を表した。より形式的な構造は脚注に残した。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουというキリスト論的称号
  choice: 人の子
  alternative: 人間である者
  rationale: 解釈的な言い換えを避け、ダニエル書7章を背景とする称号の響きと、メシア的・審判者的役割を保持した。
- issue: θρόνου δόξης αὐτοῦの属格関係
  choice: 栄光に輝く王座
  alternative: その栄光の王座
  rationale: 王として、また裁き主としての着座を自然な現代日本語で表しつつ、より逐語的な形を脚注に示して原文の構造を確認できるようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「天使」は一般読者にも理解しやすい語を採用し、「人の子」「栄光」「王座」は聖書的な響きを保持した。
