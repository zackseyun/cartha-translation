id: MAT.25.1
reference: Matthew 25:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: ja
  text: その時、天の国は、十人のおとめ[a]にたとえられる。彼女たちはそれぞれ自分のともしび[b]を手にして、花婿を迎えに出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「おとめ」と訳したギリシア語は、ここでは結婚していない若い女性を指し、「処女」とも訳せる。
    reason: 原語παρθένοςの語義上の具体性を示しつつ、本文を自然な現代日本語にするため。
  - marker: b
    text: 「ともしび」は「ランプ」または「たいまつ」とも訳せる。婚礼の行列で手に持つ灯火を指す。
    reason: λαμπάςが複数種の携帯用灯火を指し得るという語彙上の曖昧さを保持するため。
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 直前の終末に関する教えとこのたとえを結ぶ時間表現として、自然で明瞭な日本語にした。
- source_word: ὁμοιωθήσεται
  choice: たとえられる
  rationale: ὁμοιόωの未来受動形を保ちつつ、日本語として自然な比較導入表現にした。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を、現代日本語で明瞭かつ過度に教派的でない形にした。
- source_word: δέκα παρθένοις
  choice: 十人のおとめ
  rationale: 結婚の場面にいる若い未婚女性を表す語として、原語の含意と日本語の品位・自然さを両立させた。原語が処女性を示す点は脚注で明示した。
- source_word: λαβοῦσαι τὰς λαμπάδας ἑαυτῶν
  choice: それぞれ自分のともしびを手にして
  rationale: 分詞の先行動作を自然に表し、再帰代名詞ἑαυτῶνの分配的な意味を「それぞれ自分の」で明確にした。λαμπάςがランプにもたいまつにもなり得る曖昧さは「ともしび」と脚注で保持した。
- source_word: ἐξῆλθον εἰς ὑπάντησιν τοῦ νυμφίου
  choice: 花婿を迎えに出た
  rationale: 婚礼行列のため外へ出て会いに行く動作を、簡潔で自然な日本語にした。
theological_decisions:
- issue: たとえの比較構文
  choice: 天の国は、十人のおとめにたとえられる
  alternative: 天の国は、十人のおとめのようである
  rationale: 未来受動形を明示し、比較の対象が文法上「十人のおとめ」であるという原文の緊張を平滑化しなかった。
- issue: παρθένοιςの表現
  choice: おとめ
  alternative: 処女／若い未婚女性
  rationale: 「処女」は語義を直接示す一方、現代日本語では臨床的に響くことがある。「おとめ」を本文に置き、処女性を含む原語の具体性は脚注で保持した。
- issue: λαμπάςの指示対象
  choice: ともしび
  alternative: ランプ／たいまつ
  rationale: 婚礼行列で用いる携帯用の灯火を指すが、具体的な形状は語だけでは一義的に決められないため、本文では広い表現を用い、脚注に二つの可能性を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「おとめ」「花婿」により婚礼の情景を自然に示し、受動形「たとえられる」で原文の比較構文を保った。
