  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: ja
  text: というのも、愚かな娘たちは、自分たちのともしび[a]を取ったとき、油を一緒に取らなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ランプ」、または「たいまつ」とも訳せる（ギリシア語 λαμπάς）。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ γὰρ μωραὶ
  choice: 愚かな娘たちは……からである
  rationale: γάρが前節の判断を説明する働きを、「からである」で自然に示した。女性複数形の形容詞μωραίは、たとえ話に登場する娘たちを指すため、「愚かな娘たち」とした。
- source_word: λαβοῦσαι
  choice: 持って行くとき
  rationale: 主動詞に先立つ、または付随する行為を表すアオリスト分詞を、自然な時間表現で訳した。
- source_word: τὰς λαμπάδας αὐτῶν
  choice: ともしび[a]
  rationale: λαμπάςは油を用いる携帯用の明かりを指し得る。「ともしび」は現代日本語で理解しやすく、古代のランプか、たいまつかという語義上の幅を過度に限定しない。所有代名詞は日本語では文脈上明らかなため明示しなかった。
- source_word: οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον
  choice: 油を一緒に持って行かなかった
  rationale: 否定と目的語を明確に保ち、μεθ’ ἑαυτῶνを自然な日本語の「一緒に」で表した。λαβοῦσαιとの語の反復は、日本語では「持って行く」の反復によって保った。
