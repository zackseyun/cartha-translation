  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: ja
  text: 五タラント[b]を受け取った者が進み出て、さらに五タラントを持って来て、こう言った。「ご主人[a]、あなたは私に五タラントをお渡しになりました。ご覧ください。さらに五タラントを得ました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「主よ」。ここでは、僕が自分の主人に呼びかけている。
    reason: κύριεの基本的な訳語の幅と、このたとえ話における呼びかけの意味を示すため。
  - marker: b
    text: タラントは、古代の大きな重量単位であり、金銭の額を表す単位としても用いられた。
    reason: 現代の読者に馴染みのない貨幣・重量単位を説明するため。
lexical_decisions:
- source_word: προσελθὼν
  choice: 進み出て
  rationale: 主人の前に近づいて報告する場面を、自然な現代日本語で表す。
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: 五タラントを受け取っていた者
  rationale: 冠詞付き分詞句による人物の特定と、主動詞に先立つ受領を表す。
- source_word: τάλαντα
  choice: タラント
  rationale: 古代の大きな重量・貨幣単位である原語の名称を保持し、価値を特定の現代通貨や金属に狭めない。
- source_word: προσήνεγκεν
  choice: 差し出し
  rationale: 単に運んで来たことだけでなく、主人の前にその金額を提示する動作を簡潔に表す。祭儀的な含みは持たせない。
- source_word: ἄλλα πέντε τάλαντα
  choice: さらに五タラント
  rationale: 元の五タラントと同額が加わったことを自然に示す。
- source_word: Κύριε
  choice: ご主人様
  rationale: たとえ話の中で僕が自分の主人に呼びかける社会的意味を、現代日本語として自然に表す。語の広い意味は注で示す。
- source_word: παρέδωκας
  choice: お預けになりました
  rationale: 手渡した金が運用を任せるためのものであるという文脈を明瞭にしつつ、敬語を用いて主人への発話として整える。
- source_word: ἴδε
  choice: ご覧ください
  rationale: 相手の注意を目の前の成果へ向ける命令表現を、丁寧な直接話法で表す。
- source_word: ἐκέρδησα
  choice: もうけました
  rationale: κερδαίνωの利益を得る意味を、金銭運用の文脈に即した自然な日本語で示す。
theological_decisions:
- issue: たとえ話における κύριος の訳語
  choice: ご主人様
  alternative: 主よ
  rationale: この直接話法では僕が家の主人に呼びかけているため、第一義的な場面の意味を優先する。ただし κύριος が「主」とも訳される語であり、マタイ福音書における重層的な響きを持ち得ることを注で保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語。僕から主人への発話では丁寧な敬語を用い、物語本文は簡潔で品位ある文体とした。脚注記号は、aを「ご主人様」の直後、bを節末に置いた。
