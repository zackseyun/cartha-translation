id: MAT.25.24
reference: Matthew 25:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: ja
  text: 一タラントを受け取った者も進み出て、こう言った。「ご主人様、あなたは厳しい人[a]で、種をまかなかった所で刈り取り、散らさなかった所から集める[b]方だと、私は知っていました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「苛酷な人」または「厳格な人」とも訳せる。ギリシア語は「硬い」という意味から、人について「厳しい、苛酷な」を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「あなたが散らさなかった所から集める」。何を散らすのかは原文に明示されていない。文脈上、種や穀物が想定されている可能性がある。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: προσελθὼν
  choice: 進み出て
  rationale: 主人の前に出て話すという物語上の動きを、自然な日本語で表す。
- source_word: δὲ καὶ
  choice: も
  rationale: 物語の進行は文脈に委ねつつ、καίが示す「この者も」という追加の意味を明示する。
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: 一タラントを受け取っていた者
  rationale: 冠詞付き分詞句を「者」で表し、完了分詞が示す、受領済みであることの継続的な関連を「受け取っていた」で保つ。
- source_word: τάλαντον
  choice: タラント
  rationale: 古代の重量・貨幣単位として音写し、現代語の「才能」との混同を避けつつ、原語との対応を保つ。
- source_word: Κύριε
  choice: ご主人様
  rationale: このたとえの中で僕が主人に呼びかける場面なので、敬意を含む自然な呼称とした。神学的称号であると先取りしない。
- source_word: ἔγνων σε ὅτι
  choice: あなたは…方だと、私は知っていました
  rationale: 日本語では内容節の主語として「あなた」を置くのが自然であり、主人の性質について知っていたという主張を表す。
- source_word: σκληρὸς ἄνθρωπος
  choice: 厳しい人
  rationale: σκληρόςの「硬い・苛酷な・厳しい」という意味幅のうち、人の性質を表す自然な日本語を採用し、話者の非難を弱めず、過度にも強めない。
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: 種をまかなかった所で刈り取り
  rationale: 種まきと刈り取りの農耕的対照を明確に保つ。
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: 散らさなかった所から集める
  rationale: ὅθενの起点を「所から」で表し、原文に明示されない目的語を本文では補わず、農耕比喩の含みを残す。
theological_decisions:
- issue: たとえの中の呼びかけ Κύριε
  choice: ご主人様
  alternative: 主よ
  rationale: 物語内では僕から主人への呼びかけであり、現代日本語として自然な関係を表す。これを直接の神学的称号と断定しない。
- issue: 主人に対する僕の評価
  choice: 僕の主張として「厳しい人」とそのまま述べる
  alternative: 「冷酷な人」または評価を和らげた表現
  rationale: この発言が主人を正しく描写しているかどうかを翻訳で決めず、僕の非難的な認識として緊張を保つ。
- issue: διασκορπίζωの省略された目的語
  choice: 本文では目的語を補わない
  alternative: 「種を散らさなかった所から集める」
  rationale: 原文には「種」などの目的語が明示されていない。農耕文脈は保ちつつ、何を散らすことが想定されているかを確定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、たとえ話としての品位を保った。「ご主人様」は僕と主人の関係を自然に示す。「タラント」は古代の単位として片仮名表記した。発言者による主人への厳しい評価は、訳文側で肯定も否定もしていない。
