source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: ja
  text: また、いつ私たちは、あなたが見知らぬ人であるのを見て[a]迎え入れ[b]、あるいは、裸であるのを見て[c]服を着せたのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「よそから来た人」とも訳せる。ギリシア語は、見知らぬ人、自分の身近な輪の外にいる人を指し得る。ここでは、歓待を必要としている人という意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「集め入れた」または「受け入れた」。ここでは、宿を提供するなどして迎え入れることを意味する。
    reason: lexical_alternative
  - marker: c
    text: 「着る物が十分にない」とも訳せる。ギリシア語は、裸であることだけでなく、衣服が足りない状態も指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: いつ
  rationale: 行為がなされた時を問う疑問副詞であり、現代日本語では「いつ」が自然で正確である。
- source_word: δέ
  choice: また
  rationale: 前の問いに続く軽い接続を表す。強い逆接ではないため、「しかし」ではなく「また」とした。
- source_word: σε
  choice: あなたを
  rationale: たとえの中の王、すなわち人の子を指す二人称単数の目的語である。
- source_word: εἴδομεν
  choice: 私たちは…見て
  rationale: ὁράωのアオリスト直説法。日本語の疑問文全体を「いつ…たでしょうか」とし、過去の行為を自然に表した。
- source_word: ξένον
  choice: 見知らぬ人である
  rationale: ξένοςは、自分の仲間や身近な範囲の外にいる人、知らない人、よそから来た人を指し得る。ここでは歓待を必要とする人という文脈を保ちつつ、国籍や民族を限定しない「見知らぬ人」とした。
- source_word: συνηγάγομεν
  choice: 迎え入れ
  rationale: 字義的には「集め入れる」だが、この文脈では人を受け入れて宿を提供する歓待の行為を表す。「迎え入れる」が明瞭で自然である。
- source_word: ἢ
  choice: あるいは
  rationale: 二つ目の問いを第一の問いに結ぶ選択接続詞として訳した。
- source_word: γυμνὸν
  choice: 裸の
  rationale: 第一義の「裸」を本文に残した。ただし、衣服が全くない状態だけでなく、十分な衣服がない状態も指し得るため、脚注で幅を示した。
- source_word: περιεβάλομεν
  choice: 服を着せた
  rationale: ここでのπεριβάλλωは、人に衣服をまとわせることを意味する。現代日本語で具体的かつ自然な表現とした。
theological_decisions:
- issue: 裁きのたとえにおけるξένοςの社会的意味
  choice: 見知らぬ人
  alternative: よそから来た人／外国人
  rationale: この箇所の焦点は、国籍や民族の区別ではなく、受け入れと歓待を必要とする身近な輪の外の人への憐れみである。「見知らぬ人」はその意味を保ち、「外国人」と訳して範囲を不必要に限定することを避ける。
- issue: γυμνόςが示す衣服の欠如の程度
  choice: 裸
  alternative: 着る物が十分にない
  rationale: 原語の直接的な意味を本文に残しつつ、完全な裸と不十分な衣服の両方を含み得る語義上の幅は脚注で明示する。
translation_notes:
  register: 明瞭で現代的ながら、たとえの厳粛な調子に合う丁寧で格調ある疑問文とした。「見知らぬ人」「迎え入れる」「服を着せる」は日常語として理解しやすく、原文の具体的な慈善行為も保っている。
