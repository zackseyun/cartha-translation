reference: Matthew 25:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: ja
  text: 王は彼らに答えて、こう言うだろう。「まことに[a]、あなたがたに言う。あなたがたが、これらのわたしの兄弟たち[b]のうち、最も小さい者の一人にしたことは、わたしにしたのである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「アーメン、あなたがたに言う」。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、男性複数形のギリシア語を訳したもの。この「これらのわたしの兄弟たち」が、特にイエスの弟子たちを指すのか、信者一般を指すのか、あるいはより広く弱い立場にある人々を指すのかについては、複数の解釈がある。本文では、その問いを決めずに原文の表現を保った。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: 答えて言う
  rationale: アオリスト分詞と未来動詞を一続きの応答表現として訳した。日本語では「答えて言う」が、応答の意味と直接話法への導入をともに自然に保つ。文脈上の未来は日本語の非過去形で表せる。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: ギリシア語の明示的な称号をそのまま保った。日本語では大文字・小文字の区別がないため、解釈的な表記は加えない。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言う
  rationale: イエスの厳粛な宣言定型を、現代日本語で理解しやすく、かつ重みのある表現にした。「アーメン」という字義的な形は脚注に示す。
- source_word: ἐφ’ ὅσον ἐποιήσατε
  choice: あなたがたが…したことは
  rationale: 行為の範囲・対応を示す構文を、日本語で不自然な「した限りにおいて」とせず、後半との対応関係が明瞭になる形で表した。
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: これらのわたしの兄弟たちのうち、最も小さい者の一人に
  rationale: ἑνίの個別性、ἀδελφῶνの男性複数形、ἐλαχίστωνの最上級を保ちつつ、それぞれの修飾関係が明確になる自然な日本語とした。
- source_word: ἐμοὶ ἐποιήσατε
  choice: わたしにしたのである
  rationale: 与格ἐμοίを「わたしに」と直接訳し、兄弟の一人への行為と王への行為との強い同一視を保った。
theological_decisions:
- issue: 「これらのわたしの兄弟たち」が指す範囲
  choice: 指示対象を特定せず、「これらのわたしの兄弟たち」と訳す。
  alternative: イエスの弟子・使者、信者一般、または困窮し弱い立場にある人々と明示する。
  rationale: この節の語句自体は、どの範囲を指すかを明示的に決定していない。本文では原文の表現を保ち、解釈上の緊張を解消しない。
- issue: ἀδελφῶνの性を含む表現
  choice: 兄弟たち
  alternative: 兄弟姉妹、同胞、仲間たち
  rationale: 原語は文法上の男性複数形であり、指示対象についても議論があるため、本文にない包括的な展開を加えず、性を含む原語の形を保った。
- issue: 「最も小さい者」の意味
  choice: 社会的地位、重要性、弱さなどの可能性を狭めず、「最も小さい者」とする。
  alternative: 最も身分の低い者、最も弱い者、最も取るに足りない者
  rationale: ἐλάχιστοςの比喩的な幅を保ち、特定の社会的・倫理的分類だけに限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、王の厳粛な宣言にふさわしい品位を保った。「のである」は結論部の断定と強調を表すが、過度に古風な語法は避けた。
