id: MAT.25.4
reference: Matthew 25:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: ja
  text: しかし、賢い娘たちは、ともしび[a]と一緒に、器に入れた油も持って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「たいまつ」。ギリシア語は、文脈によって「ともしび」とも「たいまつ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: 賢い娘たち
  rationale: 実際的な知恵や思慮深さを表し、文脈上の人物を補って自然な日本語とした。「用意のよい」とすると準備の一点に意味を限定しすぎる。
- source_word: ἔλαβον
  choice: 持って行った
  rationale: 物語の場面で、油を携えて行ったことを表す。「受け取った」では文脈に合わない。
- source_word: ἔλαιον
  choice: 油
  rationale: 通常はオリーブ油を指し得るが、原文は種類を明示していないため、一般的な「油」とした。
- source_word: ἀγγείοις
  choice: 器
  rationale: 形状や材質を特定しない一般的な容器を意味するため、「壺」や「瓶」より広い「器」とした。
- source_word: λαμπάδων
  choice: ともしび
  rationale: λαμπάςは文脈により灯火またはたいまつを指し得る。油との結びつきが自然で、伝統的にも理解しやすい「ともしび」を本文に採用し、別訳を脚注に残した。
- source_word: ἑαυτῶν
  choice: （ともしび）
  rationale: 所有者は主語の娘たちであることが日本語の文脈から明らかなため、冗長な「自分たちの」は明示しなかった。
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: ともしびと一緒に
  rationale: μετά＋属格の同伴・併置を自然に表し、油をともしびとは別に携えたことを保った。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準語を用いた。「しかし」で前節との対照を示し、「器に入れた油も」によって、ともしびに加えて予備の油を携えたという叙述を自然に表現した。
