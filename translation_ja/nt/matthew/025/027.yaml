id: MAT.25.27
reference: Matthew 25:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: ja
  text: だから、あなたは私の金銭[a]を銀行家たちに預けるべきだった。そうすれば、私が帰って来たとき、利息とともに私のものを受け取れただろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私の銀貨」。
    reason: ἀργύριαは字義的には銀（銀貨）を指し得るが、この文脈では金銭の意味で用いられている。
lexical_decisions:
- source_word: ἔδει
  choice: 預けておくべきだった
  rationale: 過去に果たすべきだった義務を表す未完了過去の非人称表現を、自然な現代日本語で非難の響きを保って訳した。
- source_word: οὖν
  choice: だから
  rationale: 直前の叱責から導かれる帰結を、明快で自然な接続語によって示した。
- source_word: βαλεῖν
  choice: 預けておく
  rationale: 基本義は「置く」だが、銀行業者と利息が言及される金融上の文脈では、金銭を預託する意味が明確である。
- source_word: τὰ ἀργύριά μου
  choice: 私の金
  rationale: ἀργύριονは「銀」または「金銭」を意味する。ここでは商取引上の機能を明瞭に伝える「金」が自然である。
- source_word: τοῖς τραπεζίταις
  choice: 銀行に
  rationale: 語は銀行業者・両替商を指すが、預金と利息の文脈に即し、現代の読者に行為の意味が明瞭な表現とした。人物を指す原文を制度・場所として表す日本語上の換喩である。
- source_word: ἐλθὼν ἐγὼ
  choice: 帰って来た時、私は
  rationale: 分詞の時間的関係を自然に表し、主人が戻った後に回収するという順序を保った。文脈上、単なる「来る」より「帰って来る」が明確である。
- source_word: ἐκομισάμην ἂν
  choice: 受け取れただろう
  rationale: 中動態の「自分のために受け取る、取り戻す」とἄνによる反実仮想の結果を表した。
- source_word: τὸ ἐμὸν
  choice: 自分のもの
  rationale: 名詞化された所有形容詞の強調を、簡潔で自然な日本語で保持した。
- source_word: σὺν τόκῳ
  choice: 利息とともに
  rationale: τόκοςの金融上の通常の意味を中立的に訳し、過度な利息を暗示する語を避けた。
theological_decisions:
- issue: たとえの金融表現と利息徴収に対する道徳的評価
  choice: 金融用語をたとえの描写として中立的に訳す
  alternative: 利息を道徳的に非難する含みのある語で訳す
  rationale: 本文は、このたとえの中で通常の経済行為を比喩的に用いている。利息一般への是認や非難を訳文に持ち込まず、本文自体の緊張と射程を保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語。主人の叱責としての強さを「べきだった」で保ちつつ、金融用語は現代の一般読者に理解しやすくした。原文に実質的な別訳の必要がないため脚注は付していない。
