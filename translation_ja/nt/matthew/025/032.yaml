id: MAT.25.32
reference: Matthew 25:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: ja
  text: そして、すべての国々の民が彼の前に集められる。[a] 彼は、羊飼いが羊と山羊を分けるように、彼らを互いに分ける。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「すべての民族」。ギリシア語は「すべての国々（諸国民）」。
    reason: lexical_alternative
  - marker: b
    text: 「山羊」に当たるギリシア語は、より具体的には「子山羊」を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: 集められる
  rationale: 未来受動態を保ち、集める主体を本文以上に明示しない自然な表現。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: 彼の前に
  rationale: 場面の対面的・裁判的な含みを保つ、簡潔で自然な訳。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々の民
  rationale: ἔθνηの「諸国民／民族／異邦人」という意味の幅を保ちつつ、国家そのものが集まるという不自然さを避ける。「異邦人」に限定しない。
- source_word: ἀφορίσει
  choice: 分ける
  rationale: 一つに集められた者たちを二つに分離する文脈を明瞭に表す。
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: 彼らを互いに分ける
  rationale: 集められた人々の間で相互に区分されるというギリシア語の構造を保つ。
- source_word: ὥσπερ
  choice: …ように
  rationale: 直後の羊飼いの比喩との比較を自然な現代日本語で示す。
- source_word: ὁ ποιμὴν
  choice: 羊飼い
  rationale: 定冠詞は一般的な類型を示すものとして、日本語では不自然な限定を加えず訳す。
- source_word: τὰ πρόβατα
  choice: 羊
  rationale: 具体的な動物の対比をそのまま保持する。
- source_word: τῶν ἐρίφων
  choice: 山羊
  rationale: 文脈上自然で伝統的な対語。「子山羊」というより限定的な意味は脚注に残す。
theological_decisions:
- issue: πάντα τὰ ἔθνηの範囲
  choice: すべての国々の民
  alternative: すべての民族／すべての異邦人
  rationale: 終末の裁きの対象を特定の集団に狭めず、同時に「諸国民」という原語の集合的な表現を保持する。
- issue: 集める主体
  choice: 受動形のまま「集められる」
  alternative: 神が集める
  rationale: 神的受動の可能性はあるが、本文が主体を明示していないため、訳文でも補わない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「国々の民」によって原語の集合性と、人々が集められる場面の自然さを両立させた。脚注記号は該当する句・比喩の直後に配置した。
source_grounding:
  english_pob_role: consult_only
