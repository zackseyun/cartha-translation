  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ja
  text: そして、この役に立たない奴隷[a]を外の暗闇に放り出せ。そこでは、泣き、歯ぎしりすることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」と訳したギリシア語ドゥーロスは、「しもべ」とも訳せる。ここでは、主人に従属する身分がたとえの中で明確なため、「奴隷」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: 役に立たない
  rationale: 主人から見て有用でないことを表す語。現代日本語として明瞭であり、文脈上の厳しい否定的評価も保つ。
- source_word: δοῦλον
  choice: 奴隷
  rationale: 主人に全面的に従属する者というたとえの社会的関係が明瞭なため、「僕」や「召使い」よりも「奴隷」を用いた。訳語が持つ幅は脚注で示す。
- source_word: ἐκβάλετε
  choice: 放り出せ
  rationale: 命令形の強さと、内から外へ強制的に追放する動作を、自然で力のある日本語で表す。
- source_word: σκότος τὸ ἐξώτερον
  choice: 外の闇
  rationale: 祝宴や主人のいる場所の外へ排除されるイメージを保ちつつ、定着した簡潔な表現とした。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 直前の「外の闇」を指す場所の副詞として、簡潔で自然に訳した。
- source_word: κλαυθμὸς
  choice: 泣いて
  rationale: 悲嘆を表すが、その激しさを原文以上に限定しない表現とした。
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: 歯ぎしりする
  rationale: 苦悩や怒りを含み得る慣用的なイメージを解釈で一方に限定せず、そのまま伝える。
theological_decisions:
- issue: たとえにおける裁きのイメージの性質
  choice: 排除と苦悩のイメージをそのまま残し、それが最終的な裁き、地獄、または別の処罰を直接指すとは訳文内で特定しない。
  alternative: 「地獄」などの教理的な説明語を訳文に加える。
  rationale: この節はマタイ福音書に繰り返される裁きの表現を用いるが、原文自体は「外の闇」と「泣いて歯ぎしりする」というイメージで語っているため、その神学的緊張と解釈の余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令と裁きの厳しさを保った。「放り出せ」は口語的すぎない範囲でἐκβάλετεの強さを表し、後半は日本語で定着した「泣いて歯ぎしりする」という言い回しにした。
