review_pass:
  verdict: revise
  source_fidelity: 本文は主要な語義をよく捉えている。ただし「病気で、牢にいたとき」は、病気であることと拘禁されていることを一つの同時的な状況として読ませやすい。ギリシア語の並列（ἀσθενὴς καὶ ἐν φυλακῇ）と前節の対応から、病気の場合と拘禁の場合のいずれにも訪問しなかったことが明瞭になるようにするのが安全である。
  naturalness: 「〜であったとき」の反復は理解可能だが、列挙としてはやや重い。「わたしは…だったのに、あなたがたは…」および「〜のときも」の形にすると、明瞭で自然な現代標準日本語になる。また「訪ねてくれなかった」の「くれる」は日本語として自然である一方、訳文の発話者を受益者としてやや強調するため、中立的な「訪ねなかった」が原文の否定をより直接に表す。
  terminology: 「よそ者」はξένοςの社会的に外部にいる者という含意を保ち、「外国人」に限定しない点で適切である。「迎え入れる」「服を着せる」「病気」「牢に入れられている」「訪ねる」も、各語の文脈上の意味を適切に表す。脚注はaを迎え入れ・もてなしの含意に、bを気遣いを伴う訪問の含意に限定しており、本文を過度に解釈していない。
  issues:
  - severity: medium
    issue: 「病気で、牢にいたとき」が病気と拘禁を同時に満たす一場面として読める。
    rationale: ἀσθενὴςとἐν φυλακῇはκαίで並列され、25:36の対応する列挙も踏まえると、病人と囚人の双方を顧みなかったという意味を明示するほうが、並列関係を損なわない。
  - severity: low
    issue: 「訪ねてくれなかった」の受益表現。
    rationale: 誤訳ではないが、「くれる」は話者への恩恵という日本語の視点を加える。原文の直接的な否定を保つため、「訪ねなかった」がより中立的である。
  revised_text: わたしはよそ者だったのに、あなたがたは迎え入れず[a]、裸だったのに、服を着せず、病気のときも、牢に入れられていたときも、訪ねなかった[b]。
