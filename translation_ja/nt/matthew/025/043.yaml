id: MAT.25.43
reference: Matthew 25:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: ja
  text: わたしはよそ者だったのに、あなたがたは迎え入れず[a]、裸だったのに、服を着せず、病気のときも、牢に入れられていたときも、訪ねなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け入れず」とも訳せる。ここでは、よそ者を家に迎え入れ、もてなすことをいう。
    reason: lexical_alternative
  - marker: b
    text: 「訪ねる」には、ただ会いに行くだけでなく、気遣い、世話をするという意味合いもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: よそ者
  rationale: 自分たちの家や共同体の外にいて、受け入れを必要とする人を指す。「外国人」ほど民族的意味に限定せず、「客」よりも弱い立場を保つ。
- source_word: συνηγάγετέ
  choice: 迎え入れず
  rationale: 字義は「集める」だが、ξένοςとの組み合わせでは、宿や交わりに受け入れてもてなす意味。「迎え入れる」は現代日本語で自然にその含意を表す。
- source_word: γυμνός
  choice: 裸
  rationale: 文字どおりの裸、または十分な衣服がない状態を表し得る。ここでは「服を着せる」と対になり、衣服の欠乏を強く表す直接的な訳とした。
- source_word: περιεβάλετέ
  choice: 服を着せず
  rationale: 字義は「周りに掛ける」で、ここでは衣服を与えて着せること。自然で具体的な日本語とした。
- source_word: ἀσθενής
  choice: 病気
  rationale: 一般に「弱い」も意味し得るが、この憐れみの行為の列挙では身体的な病気が最も自然。
- source_word: ἐν φυλακῇ
  choice: 牢にいた
  rationale: φυλακήはここでは監視所でなく拘禁状態を指す。「牢」は簡潔で、古代の拘禁にも不自然な現代制度上の限定を加えない。
- source_word: ἐπεσκέψασθέ
  choice: 訪ねてくれなかった
  rationale: 単なる社交的訪問ではなく、気遣って訪れ、世話をする含みを持つ。本文では具体的行為を保つ「訪ねる」とし、その含意を注記する。
theological_decisions:
- issue: ἐπεσκέψασθέ με が表す憐れみの行為の幅
  choice: 訪ねてくれなかった
  alternative: 世話をしてくれなかった／顧みてくれなかった
  rationale: ギリシア語が名指す具体的な訪問行為を保ちつつ、単なる面会以上の気遣いや世話の含みは脚注で示す。本文だけで特定の奉仕内容に狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。反復される状況節を「〜であったとき／〜いたとき」で補い、ギリシア語の列挙関係を自然に明示した。「よそ者」は「外国人」への民族的限定を避け、「見知らぬ人」より共同体外の者という社会的含意を出す。すべての脚注標識を本文に配置した。
