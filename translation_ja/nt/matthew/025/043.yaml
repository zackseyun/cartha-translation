revisions:
- from: わたしがよそ者であったとき、あなたがたは迎え入れず[a]、裸であったとき、服を着せず、病気で、牢にいたとき、訪ねてくれなかった[b]。
  to: わたしはよそ者だったのに、あなたがたは迎え入れず[a]、裸だったのに、服を着せず、病気のときも、牢に入れられていたときも、訪ねなかった[b]。
  rationale: 病気と拘禁という二つの並列された窮状を「〜のときも」で明示し、原文の列挙と25:36との対応を自然な日本語で保った。「訪ねなかった」として原文の否定を中立的に訳した。脚注aは「交わり」という抽象的でやや広い表現を避け、受け入れともてなしという文脈上の含意に整えた。
  reviewer_model: gpt-5.6-terra
