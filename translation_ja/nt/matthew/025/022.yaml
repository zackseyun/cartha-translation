id: MAT.25.22
reference: Matthew 25:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: ja
  text: 二タラントを受けた者も進み出て言った。「ご主人様[a]、私に二タラント[b]をお預けになりました。ご覧ください。私はさらに二タラントを得ました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は「主よ」とも訳せる。このたとえでは、僕が主人に呼びかける敬称として用いられている。
    reason: alternative_reading
  - marker: b
    text: タラントは古代の大きな重量・貨幣単位であり、生まれつきの才能という意味ではない。
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: 進み出て
  rationale: 主人の前に近づいて報告する動作を、物語の場面に自然な現代日本語で表した。
- source_word: δὲ καὶ
  choice: も
  rationale: 前の僕に続いて、二タラントを受けた者も同様に報告したという追加と並行関係を簡潔に示す。
- source_word: ὁ τὰ δύο τάλαντα
  choice: 二タラントを受けた者
  rationale: 原文は直訳すれば「二タラントの者」だが、文脈から委ねられた金額によって人物を特定しているため、「受けた」を補って明瞭にした。
- source_word: Κύριε
  choice: ご主人様
  rationale: κύριος は「主」とも訳せるが、このたとえの直接的な社会関係では、僕が主人に呼びかける敬称として「ご主人様」が自然である。別訳の可能性は脚注に残した。
- source_word: παρέδωκας
  choice: お預けになりました
  rationale: 字義的には「引き渡した」だが、ここでは財産を僕に託したことを指す。「預ける」は所有者と管理者の関係を自然に表す。
- source_word: ἴδε
  choice: ご覧ください
  rationale: 結果に相手の注意を向ける命令表現の力を保ちつつ、主人への敬意に合う表現とした。
- source_word: ἄλλα δύο τάλαντα
  choice: さらに二タラント
  rationale: 元の額と同じだけ追加で得たことを、自然な日本語で示す。
- source_word: ἐκέρδησα
  choice: 得ました
  rationale: κερδαίνω の「得る、もうける」という意味を保ちながら、利益を得た具体的方法を原文以上に限定しない。
- source_word: τάλαντα
  choice: タラント
  rationale: 古代の大きな重量・貨幣単位を伝統的な音写で保持し、生来の才能という現代的意味との混同を脚注で防ぐ。
theological_decisions:
- issue: たとえの中の呼びかけ Κύριε の訳
  choice: ご主人様
  alternative: 主よ
  rationale: κύριος には「主」という重要な訳語がある一方、この箇所では僕が財産の所有者に直接呼びかけている。「ご主人様」は物語上の関係を明瞭にし、語の別の可能性を脚注に示すことで神学的含意を一方的に決めない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、主人に対する僕の丁寧な語り口を敬語で表した。硬すぎる文語表現は避けつつ、たとえの荘重さを保った。
