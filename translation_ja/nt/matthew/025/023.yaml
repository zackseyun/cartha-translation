reference: Matthew 25:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: ja
  text: 主人は彼に言った。「よくやった、善良で忠実なしもべ[a]よ。あなたはわずかなことに忠実だった。多くのことを任せよう。あなたの主人の喜びに入りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」とも訳せる。ギリシア語のδοῦλοςは、文脈により「しもべ」または「奴隷」を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: 言った
  rationale: 直接話法を導く標準的で自然な現代日本語。
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: 主人／主人と
  rationale: たとえ話の内部では、しもべに対する人間の主人を指す。称号としての「主」を訳文に持ち込まず、文脈上の上下関係を明確にする。
- source_word: Εὖ
  choice: よくやった
  rationale: 働きを評価して褒める語として自然であり、単なる「よい」よりもこの呼びかけの機能を明確に伝える。
- source_word: δοῦλε
  choice: しもべ
  rationale: 主人に従属する者を表す語。日本語の聖書的・比喩的文脈で通じやすい「しもべ」を本文に置き、法的・社会的身分を強く示す「奴隷」の可能性は脚注に残す。
- source_word: ἀγαθὲ καὶ πιστέ / πιστός
  choice: 善良で忠実な／忠実だった
  rationale: ἀγαθόςとπιστόςの組み合わせを保ち、πιστόςの反復も同じ「忠実」で再現する。
- source_word: ἐπὶ ὀλίγα
  choice: わずかなものに
  rationale: 委ねられた対象・責任の範囲を表す。日本語では「わずかなものに忠実」が簡潔で、原文の曖昧な複数中性形も不必要に具体化しない。
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: 多くのものを任せよう
  rationale: καθίστημιがここで示す、より大きな責任への任命を自然な日本語で表す。「管理させる」などと具体化しすぎない。
- source_word: εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου
  choice: 主人と喜びを共にしなさい
  rationale: 字義的には「主人の喜びの中に入りなさい」。日本語では意味上の参加を自然に伝える表現を本文に採用し、空間的比喩は脚注で示す。
theological_decisions:
- issue: κύριοςをたとえ話の人間の上位者としてどう訳すか
  choice: 主人
  alternative: 主
  rationale: 物語内の指示対象はしもべの主人であるため、「主人」が文脈に即している。たとえの神学的含意を称号の訳し方によって先取りしない。
- issue: δοῦλοςの従属身分をどう表すか
  choice: しもべ
  alternative: 奴隷
  rationale: この節の前景は忠実な務めへの称賛である。「しもべ」は現代の一般読者にも比喩的関係を伝えやすいが、原語が奴隷身分を指し得ることは脚注で明示する。
- issue: 「主人の喜びに入る」という比喩をどう扱うか
  choice: 主人と喜びを共にしなさい
  alternative: 主人の喜びの中に入りなさい
  rationale: 参加の意味を自然な日本語で表しつつ、原文の入るという比喩を脚注に保存し、終末論的含意を過度に限定しない。
translation_notes:
  register: 明瞭で現代的だが、たとえ話の荘重さを保つ文体。「僕」は読み違いを避けるため平仮名で「しもべ」とした。主人の発言は簡潔で権威ある調子を保ち、「あなた」を用いて古風すぎる表現を避けた。
