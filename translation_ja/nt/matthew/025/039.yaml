  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: ja
  text: また、いつ、私たちは、あなたが病気だったり、牢に入れられていたりするのを見て、あなたのもとに行ったでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたを訪ねた」、または文脈上「あなたを見舞った」とも訳せる。ギリシア語は、より直訳的には「あなたのもとに来た」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: いつ
  rationale: 行為の時を問う疑問副詞であり、直接話法では「いつ」が自然で明確である。
- source_word: δέ
  choice: また
  rationale: 一連の問いをつなぐ弱い接続辞であり、強い逆接を避けて「また」とした。
- source_word: εἴδομεν
  choice: 私たちは…見て
  rationale: アオリスト直説法の過去の出来事を、日本語の問いとして後続の「行ったでしょうか」と自然に結びつけた。
- source_word: ἀσθενοῦντα
  choice: 病気であったり
  rationale: 文脈上、身体的な病気を指す。「弱っている」より意味が明確であり、もう一つの状態と並列になるよう「たり」を用いた。
- source_word: ἐν φυλακῇ
  choice: 牢に入っていたり
  rationale: φυλακήはここでは拘禁される場所を表す。「牢」は現代日本語でも理解しやすく、簡潔で格調を損なわない。
- source_word: ἤλθομεν πρός σε
  choice: あなたのもとに行った
  rationale: 直訳的には「あなたのところへ来た」。日本語では話者が王に過去を問い返す場面なので「あなたのもとに行った」が自然で、単なる移動・接近という原文の幅を保つ。
theological_decisions:
- issue: ἤλθομεν πρός σεを「見舞った」と具体化するか、移動・接近の表現を保つか
  choice: あなたのもとに行った
  alternative: あなたを見舞った
  rationale: この文脈では病人や囚人を訪ねる慈善行為が含意されるが、ギリシア語自体は「見舞う」という特定の動詞ではなく「あなたのもとへ行く」と述べる。解釈を本文に織り込まず、自然な日本語で原文の表現範囲を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、王への問いとして丁寧な「でしょうか」を用いた。「病気であったり、牢に入っていたり」と並列を明示し、自然な口調を保った。
