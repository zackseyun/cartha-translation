id: MAT.25.10
reference: Matthew 25:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: ja
  text: ところが、彼女たちが買いに出ている間に、花婿が来た。用意のできていた者たちは花婿と一緒に婚礼の宴[a]に入り、戸は閉められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「婚宴」「婚礼」。ギリシア語の複数形は、婚礼の祝い全体を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: ところが、彼女たちが買いに出ている間に
  rationale: 属格独立構文による同時進行を「間に」で表し、ἀπέρχομαι の移動のニュアンスを「買いに出ている」に保った。ἀγοράσαι の目的語である油は直前の文脈から明らかだが、原文どおりここでは補わない。δέ は場面の転換と対照を示す「ところが」とした。
- source_word: ὁ νυμφίος
  choice: 花婿
  rationale: 婚礼の場面における通常の意味を明確に保ち、比喩の神学的指示対象を訳文で明示しない。
- source_word: αἱ ἕτοιμοι
  choice: 用意のできていた者たち
  rationale: 女性複数の形容詞が名詞的に用いられ、直前までの娘たちを指す。「者たち」とすることで、自然な日本語のまま「用意ができていた」という状態を保持した。
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: 花婿と一緒に……に入り
  rationale: μετ’ αὐτοῦ の指示対象を日本語で明確にするため「花婿」を反復し、物語の動きを自然に表した。
- source_word: εἰς τοὺς γάμους
  choice: 婚礼の宴に
  rationale: 複数形 γάμοι が指す婚礼の祝い・宴席を、現代日本語で分かりやすく表した。単に「結婚式」とすると儀式そのものに限定される可能性があるため避けた。
- source_word: ἐκλείσθη ἡ θύρα
  choice: 戸は閉められた
  rationale: アオリスト受動態を受動表現で保ち、誰が閉めたかを補わず、場面の決定的な終結を簡潔に示した。
theological_decisions:
- issue: たとえにおける婚礼の比喩表現
  choice: 「花婿」「婚礼の宴」を通常の物語表現として保持し、キリスト論的解釈を本文に明示しない
  alternative: 「花婿」を特定の神学的称号として説明的に訳す
  rationale: この節はたとえの物語として語られており、その神学的意味は文脈から読み取られるべきである。訳文によって解釈を先取りせず、原文の比喩と緊張感を保つ。
- issue: 閉じられた戸の最終性
  choice: 「戸は閉められた」とだけ訳す
  alternative: 締め出しや救済論的結末を説明的に補う
  rationale: 原文が述べる受動的な出来事とその厳粛さを保持し、行為者や教理的含意を本文に付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、たとえの厳粛さにふさわしい簡潔で品位ある語調とした。「婚礼の宴」は日常語よりやや改まった表現だが、意味が明瞭で聖書物語の文体にも自然である。
