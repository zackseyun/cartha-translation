id: MAT.25.8
reference: Matthew 25:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: ja
  text: ところが、愚かな娘たちは賢い娘たちに言った。「あなたがたの油を少し分けてください。私たちのともしびが消えかかっているのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μωραὶ
  choice: 愚かな娘たち
  rationale: 形容詞の名詞的用法で、たとえに登場する娘たちを指す。文脈上の指示対象を自然な日本語で明示しつつ、φρονίμοιςとの対比を保った。
- source_word: φρονίμοις
  choice: 賢い娘たち
  rationale: ここでは先を見越して備える実際的な賢さを表す。「賢い」は対語の「愚かな」と自然に対応し、意味を過度に限定しない。
- source_word: Δότε
  choice: 分けてください
  rationale: 直訳は「与えてください」だが、ἐκ τοῦ ἐλαίου ὑμῶνの部分的な分与を求める文脈では「油を少し分けてください」が現代日本語として自然である。
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: あなたがたの油を少し
  rationale: ἐκ＋属格の部分的用法を「少し」で明示し、相手の蓄えの一部を求めていることを自然に表した。
- source_word: λαμπάδες
  choice: ともしび
  rationale: λαμπάςは油を用いる携帯型の照明具を指し、「たいまつ」と「ランプ」のいずれにも解され得る。「ともしび」は器具の形状を断定せず、燃える光源を自然かつ格調ある日本語で表せる。
- source_word: σβέννυνται
  choice: 消えかかっている
  rationale: 現在形が示す進行中の消火・消滅を、炎が今まさに消えようとしている状態として自然に表した。
- source_word: ὅτι
  choice: のです
  rationale: 依頼の理由を示す因果関係を、日本語では説明の「のです」によって自然に表した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話は丁寧だが切迫感のある表現とした。「娘たち」は直前までの十人の娘たちを受ける文脈的補足である。「ともしび」により、λαμπάδεςがランプかたいまつかという器具形状の曖昧さを本文内で保った。
