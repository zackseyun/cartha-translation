  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: ja
  text: そのとき、王は彼らに答えて言うでしょう。「まことに、あなたがたに言います。これらの最も小さい者の一人のためにしなかったことは、わたしのためにもしなかったのです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらの最も小さい者」が特にイエスの弟子たちを指すのか、より広く身分の低い人や困窮している人を指すのかについては、解釈が分かれます。訳文は原文の表現をそのまま残しています。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 裁きの場面における応答の順序を示す。現代日本語として自然で、叙述の厳粛さも保つ。
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: 彼らに答えて言います
  rationale: 未来形は文脈に沿って丁寧体の非過去形で表し、λέγωνを含む応答の定型的な構造を保った。主語の「王」は前節から補い、代名詞だけより日本語で明確にした。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの厳粛な宣言定型を、意味の明瞭さと荘重さを両立させて表した。
- source_word: ἐφ’ ὅσον οὐκ ἐποιήσατε
  choice: しなかったことは
  rationale: ἐφ’ ὅσονはここでは行為の有無と対応関係を示す。直訳的な「〜する限り」を避けつつ、後半との論理的対応を保った。
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: これらの最も小さい者の一人に
  rationale: ἑνίの単数性とἐλαχίστωνの最上級を保持し、対象が誰かを訳文で限定しない。
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: わたしにもしなかったのです
  rationale: οὐδέの追加的否定を「も」で表し、前半と同じ動詞を反復して、彼らへの不作為がイエスへの不作為であるという直接的同一視を保った。
theological_decisions:
- issue: 「これらの最も小さい者」の指示対象
  choice: 訳文では「これらの最も小さい者」とし、対象を特定しない
  alternative: イエスの弟子・使者に限定する、または貧しい人や困窮者一般と明示する
  rationale: この節自体は指示対象を明示的に定義していないため、解釈上の緊張を残し、いずれかに限定する語を本文へ加えない。
- issue: 最も小さい者とイエスとの関係
  choice: その一人にしなかったことは、イエスにもしなかったと直接表現する
  alternative: 単なる比喩的類似や間接的関係として弱める
  rationale: 原文は不作為を直接対応させており、その神学的な強さを弱めずに保持する。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用い、裁きの宣告にふさわしい厳粛さを保った。「最も小さい者」はやや直訳的だが、原文の最上級と解釈上の幅を保持するため採用した。
