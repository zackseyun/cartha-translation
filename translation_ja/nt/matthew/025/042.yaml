  source_fidelity: 原文は二つのアオリスト（「わたしは空腹だった／渇いていた」）と、それに対応する二つの否定された行為を、γάρ（「というのも／なぜなら」）によって前後の裁きの宣告の理由として示す。改訂案はこの並行と理由づけを保つ。現行の「のに」は原文にない逆接を加えるため避ける。
  naturalness: 「空腹だったが、…くれず、喉が渇いていたが、…くれなかった」は意味は通るが、「のに」は対比・譲歩を強める。また「飲ませてくれなかった」は口語的で、飲ませる行為にも読める。簡潔な現代標準語として、各節を「わたしは…だったのに、あなたがたは…与えなかった」とするよりも、原文どおり並列し「わたしは…だったが、あなたがたは…与えなかった」とすることも可能だが、ここでは余分な逆接を避け、二文節を読点で並べる。
  terminology: 「空腹」「喉が渇く」「食べる物」「飲み物」は明快で標準的である。「あなたがた」は二人称複数を適切に示す。「わたしに飲み物を与えなかった」はποτίζωのこの文脈での『飲み物を与える』を明確にし、μεへの個人的な不作為も保持する。
