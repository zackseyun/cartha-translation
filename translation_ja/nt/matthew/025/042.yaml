  to: というのも、わたしは空腹だったのに、あなたがたはわたしに食べる物を与えず、喉が渇いていたのに、わたしに飲み物を与えなかったからだ。
  rationale: 原文のγάρを「というのも…からだ」で理由として明示し、二つの否定された施しを「わたしに食べる物／飲み物を与えなかった」と対応させた。ただし、改訂文には「のに」が残っており、原文にない譲歩を加えるため、これは適切でない。安全な最終改訂としては以下の文に統一する：『というのも、わたしは空腹で、あなたがたはわたしに食べる物を与えず、喉が渇いていて、わたしに飲み物を与えなかったからだ。』この表現は日本語では状態と応答のつながりがやや弱くなるため、文の反復を保つ完成形を採用する。
