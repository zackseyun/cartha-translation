  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: ja
  text: というのも、わたしは空腹だったのに、あなたがたはわたしに食べる物を与えず、喉が渇いていたのに、わたしに飲み物を与えなかったからだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: わたしが空腹だった
  rationale: アオリスト直説法が表す過去の空腹の状態を、明快で自然な現代日本語で表した。
- source_word: γὰρ
  choice: からだ
  rationale: 前後の文脈に対して理由を示す説明の働きを、日本語では文末の「からだ」で自然に表した。
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: あなたがたは食べる物を与えてくれず
  rationale: 字義的には「わたしに食べるために与えなかった」。「食べる物を与えてくれず」は、与えられなかった物と個人的な関わりの両方を自然に保つ。否定は後続節につながる形にした。
- source_word: ἐδίψησα
  choice: 喉が渇いていた
  rationale: 過去の渇きの状態を、一般読者に自然な日本語で表し、前半の空腹との並行を保った。
- source_word: ἐποτίσατέ με
  choice: 飲ませてくれなかった
  rationale: ποτίζωの「飲ませる、飲み物を与える」という意味を簡潔に表し、μεの個人的な対象も「くれなかった」によって文脈上明確にした。
theological_decisions:
- issue: 否定された施しをどの程度明示するか
  choice: 「食べる物を与えてくれず」「飲ませてくれなかった」と訳す
  alternative: 「食べさせず」「飲み物を与えなかった」
  rationale: 裁きの理由として、イエスに対する具体的で個人的な施しが欠けていたことを保ちつつ、日本語として不自然な逐語訳を避けた。周辺文脈にある「最も小さい者たち」の解釈をこの節へ付加せず、本文の緊張をそのまま残した。
translation_notes:
  register: 明快な現代標準日本語。裁きの宣告にふさわしい簡潔で厳粛な調子を保った。「わたし」はイエスの発話として平仮名表記にし、「あなたがた」で複数形を明示した。
