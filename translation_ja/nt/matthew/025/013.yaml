  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: ja
  text: ですから、目を覚ましていなさい。[a] あなたがたは、その日もその時も知らないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「見張っていなさい」「油断せずにいなさい」。ギリシア語の命令形には、警戒を続ける意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 現在命令形が表す継続的な警戒を示しつつ、たとえの中の「眠る／目を覚ます」という比喩を保つ、自然な現代日本語とした。
- source_word: οὖν
  choice: ですから
  rationale: 直前のたとえから導かれる結論であることを、明瞭で自然な接続表現によって示した。
- source_word: ὅτι
  choice: からです
  rationale: 命令の理由を導く因果関係を、現代日本語として自然に表した。
- source_word: οὐκ οἴδατε
  choice: あなたがたは……知らない
  rationale: 二人称複数と否定された知識動詞を、意味の補足を加えずに明示した。
- source_word: τὴν ἡμέραν οὐδὲ τὴν ὥραν
  choice: その日もその時も
  rationale: 二つの定冠詞付き名詞とοὐδέによる並列否定を自然な日本語で再現した。ὥραは文脈上、厳密な六十分間よりも特定の時点を指すため「時」とした。
theological_decisions:
- issue: 警戒を促す命令の比喩
  choice: 目を覚ましていなさい
  alternative: 見張っていなさい／油断せずにいなさい
  rationale: 到来の時が不明であることに備える継続的な警戒を表しながら、比喩を抽象的な心得だけに置き換えないようにした。
- issue: 「その日、その時」の範囲
  choice: 説明を加えず「その日もその時も」とする
  alternative: 人の子が来る日も時も／定められた時も
  rationale: 周辺文脈との神学的関連は保ちつつ、この節のギリシア語に明記されていない対象を本文へ補わなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。複数の聞き手を「あなたがた」で明示し、文脈上の比喩と継続的警戒の含みを保持した。
