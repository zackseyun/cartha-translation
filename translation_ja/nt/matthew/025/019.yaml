  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: ja
  text: 長い時がたってから、あの奴隷たち[a]の主人が来て、彼らと勘定を清算した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷たち」は「しもべたち」とも訳せる。原語は、主人の所有と権威の下にある者を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: 長い時がたってから
  rationale: μετά＋対格の時間的用法を自然な現代日本語で表した。δέは軽い接続であり、「さて」などを加えなくても物語の推移は明らかである。
- source_word: ἔρχεται
  choice: 帰って来て
  rationale: 歴史的現在がもつ物語の生動感を保ちつつ、主人が旅から戻る文脈（25:14）を日本語として明確にした。
- source_word: ὁ κύριος τῶν δούλων ἐκείνων
  choice: あのしもべたちの主人
  rationale: κύριοςはここではたとえ話の家の主人を指すため「主人」とした。δοῦλοιは所有下の奴隷をも意味するが、日本語の「奴隷」はこの会計を任された家内管理者としての役割を狭めかねないため、本文では「しもべ」とし、身分上の含意を脚注で示した。
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: 彼らと勘定を清算した
  rationale: この慣用句の会計・決算上の意味を、明瞭で自然な現代日本語にした。物語上の出来事として、日本語では過去形にまとめた。
theological_decisions:
- issue: たとえ話におけるκύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: 節内ではキリスト論的称号を直接用いているのではなく、δοῦλοιに対する所有者・主人という物語上の関係を表す。たとえの神学的含意は文脈に委ね、本文で「主」と断定しない。
- issue: δοῦλοςの訳語
  choice: しもべ
  alternative: 奴隷
  rationale: 原語には奴隷身分が含まれ得るため、その点を脚注で保持する。一方、明瞭で品位ある日本語本文では、主人から資産を託されて会計報告をする家内従属者を「しもべ」と表した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある物語文。「しもべ」はやや聖書的だが広く理解可能であり、原語の身分上の強さは脚注で補った。
