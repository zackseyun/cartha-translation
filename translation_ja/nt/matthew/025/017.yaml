lexical_decisions:
- source_word: ὡσαύτως
  choice: 同じように
  rationale: 前節のしもべの行動と同様であることを示す副詞の比較的な力を、自然な現代日本語で表した。
- source_word: ὁ τὰ δύο
  choice: 二つを持っていた者
  rationale: 定冠詞と対格句から成る省略表現を保ちつつ、文脈上の二タラントを託された者を自然に指す表現とした。原文にない「受け取った」を本文には補わなかった。
- source_word: ἐκέρδησεν
  choice: もうけた
  rationale: 金銭を運用して同種のものを増やしたという文脈に合い、「稼いだ」よりも賃金の含意が弱い。
- source_word: ἄλλα δύο
  choice: さらに二つ
  rationale: 同じ種類のものが二つ加わったことを、簡潔で明瞭な現代日本語で示した。
