  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: ja
  text: しかし、主人は彼に答えた。「悪くて怠け者の召し使い[a]よ。おまえは、私が種を蒔かなかった所で刈り取り、散らさなかった所から集めると知っていたのか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」とも訳せる。ギリシア語の「ドゥーロス」は、文脈によって召し使いまたは奴隷を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「おまえは、私が種を蒔かなかった所で刈り取り、散らさなかった所から集めると知っていたのだ」と断定文に読むこともできる。ギリシア語は修辞疑問とも断定とも解し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: しかし、…答えた
  rationale: δέの緩やかな対比を「しかし」で示し、定型的な応答表現は自然な日本語の「答えた」とした。
- source_word: ὁ κύριος αὐτοῦ
  choice: 主人
  rationale: たとえの中の主従関係を表す語であり、ここでは称号としての「主」より「主人」が文脈に合う。
- source_word: Πονηρὲ
  choice: 悪い
  rationale: 召し使いに対する道徳的な非難を、明瞭で現代的な語で表した。
- source_word: δοῦλε
  choice: 召し使い
  rationale: 従属して仕える者という文脈上の意味を自然な現代日本語で示した。法的身分を前面に出す「奴隷」も可能なので脚注に残した。
- source_word: ὀκνηρέ
  choice: 怠け者の
  rationale: 行動をためらい務めを果たさない性質を、日常的で明瞭な表現にした。
- source_word: ᾔδεις ὅτι
  choice: …と知っていたのか
  rationale: 知っていた内容をὅτι以下が導く構造を保ちつつ、文脈に沿って修辞疑問として訳した。
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: 種を蒔かなかった所で刈り取り
  rationale: 蒔くことと刈り取ることの農耕上の対照を自然な日本語で明示した。
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: 散らさなかった所から集める
  rationale: ὅθενの起点を「所から」で示し、διασκορπίζωの目的語を補わず「散らす」という原文の表現を保った。
theological_decisions:
- issue: 主人の最後の言葉を断定と取るか修辞疑問と取るか
  choice: 「知っていたのか」と修辞疑問にする
  alternative: 「知っていたのだ」と断定文にする
  rationale: 直前の召し使いの主張を主人が問い返して論証に用いる流れに合う。一方、ギリシア語本文自体には疑問符がなく断定文にも読めるため、別解を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、主人の厳しい叱責にふさわしい引き締まった語調と、農耕比喩の並行性を保った。「おまえ」は上下関係と叱責の場面を自然に示すために用いた。
