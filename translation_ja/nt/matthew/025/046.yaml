  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: ja
  text: そして、これらの者たちは永遠の罰へと去って行き、正しい者たちは永遠のいのちへと行く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: 入る
  rationale: 字義的には「去って行く」だが、行き先を示す εἰς と日本語の自然さを考慮し、二つの帰結への移行を簡潔に表す「入る」とした。後半では動詞が省略されているため、並行を明確にするため補った。
- source_word: οὗτοι
  choice: この者たち
  rationale: 直前に述べられた一群を指す指示代名詞。対照される「正しい者たち」と釣り合う、明確で簡潔な表現とした。
- source_word: κόλασιν
  choice: 罰
  rationale: 最終的な裁きの文脈では、矯正という含みを限定的に付加せず、処罰の帰結を自然に表す「罰」が適切である。
- source_word: αἰώνιον
  choice: 永遠の
  rationale: 同じ形容詞が「罰」と「いのち」の双方を修飾するため、両節で同じ訳語を用いて原文の対称性を保った。語義をめぐる議論は脚注に示した。
- source_word: οἱ δὲ δίκαιοι
  choice: 正しい者たちは
  rationale: 実体詞的な形容詞で、正しいと認められ、また正しさを特徴とする人々を指す。「義人」より一般読者に分かりやすい現代語とし、δὲ の対照は「は」で自然に表した。
- source_word: ζωὴν
  choice: いのち
  rationale: 単なる生存以上の聖書的な響きを保ちつつ、現代日本語で親しまれている表記として「いのち」を採用した。
theological_decisions:
- issue: κόλασιν αἰώνιον と ζωὴν αἰώνιον における αἰώνιον の訳し方
  choice: 両方を「永遠の」と訳す
  alternative: 両方を「時代にわたる」または「世々にわたる」と訳す
  rationale: 同一文中で同じ形容詞が「罰」と「いのち」を修飾しているため、持続期間や性質を訳文で別々に解釈せず、原文の厳密な並行関係を保った。「永遠の」はこの文脈で自然かつ標準的だが、別の語義理解も脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この者たち」と「正しい者たち」、「永遠の罰」と「永遠のいのち」の対照を簡潔に再現した。
