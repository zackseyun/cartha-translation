id: MAT.25.33
reference: Matthew 25:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: ja
  text: そして、羊を自分の右側に、子やぎを左側に置く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσει
  choice: 置く
  rationale: 未来形で、目的語をある位置に立たせる、すなわち配置することを表す。日本語では文脈上、非過去形の「置く」で未来の行為を自然に表現できる。
- source_word: τὰ μὲν πρόβατα
  choice: 羊を
  rationale: πρόβαταは通常「羊」を指す。μὲνは後続のδὲとの対照によって日本語の構文全体に反映した。
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: 自分の右側に
  rationale: 字義的には「彼の右から」に近い形だが、配置を表すこの用法では「彼の右側に」という意味。「自分の」は、配置する者を基準とする位置関係を明確にする。
- source_word: τὰ δὲ ἐρίφια
  choice: 子やぎを
  rationale: ἐρίφιαはἐρίφιονの複数形で、より具体的には若いやぎ、子やぎを指す。日本語の「子やぎ」は自然で、原語の年齢的ニュアンスも保持できる。
- source_word: ἐξ εὐωνύμων
  choice: 左側に
  rationale: 字義的には「左から」に近い形だが、ここでは右側との対照で配置場所を示す。「彼の」は原文で反復されず、日本語でも省略して自然に理解できる。
- source_word: μὲν ... δὲ
  choice: 羊を…、子やぎを…
  rationale: 二群の対照は、並列構文と読点によって自然に示した。「しかし」を加えるより、簡潔で日本語らしい対照となる。
theological_decisions:
- issue: 右と左の象徴的意味を訳文に明示するか
  choice: 空間的位置として「右側…左側」と訳す
  alternative: 「祝福の側…退けられる側」など、評価的意味を補う
  rationale: 本文が直接述べるのは裁きの場面における配置である。右と左の評価的・象徴的含意は文脈から伝わるため、訳文に解釈を加えない。
- issue: ἐρίφιαの年齢的ニュアンスを保持するか
  choice: 「子やぎ」として保持する
  alternative: 一般化して「やぎ」とする
  rationale: 原語は若いやぎを指し得るため、日本語で不自然にならない範囲で具体性を保った。ここでの羊との対照も明瞭である。
translation_notes:
  register: 明快な現代標準日本語を用い、裁きの場面にふさわしい簡潔で落ち着いた調子とした。「自分の右側」は主語を基準とする位置を自然に示し、「左側」では不要な反復を避けた。
