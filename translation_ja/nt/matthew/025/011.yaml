  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: ja
  text: その後、残りの乙女たちも来て、こう言った。「主よ、主よ[a]、私たちのために開けてください[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ご主人様、ご主人様」または「先生、先生」とも訳せる。ギリシア語は「キュリエ、キュリエ」。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では単に「私たちのために開けてください」。文脈上、戸を開けることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: その後
  rationale: 物語上の後続を示す時間副詞。現代日本語で自然に出来事の順序を表す。
- source_word: δὲ
  choice: （独立した語では訳さない）
  rationale: 弱い接続を示す語であり、「その後」という移行表現と文脈で十分に機能が伝わる。
- source_word: ἔρχονται
  choice: 来て
  rationale: 物語的現在による生き生きとした叙述。日本語では後続の発言と自然につなぐため連用形にした。
- source_word: καὶ
  choice: も
  rationale: 先に来た乙女たちに加えて、ほかの乙女たちも来たという添加の意味を表す。
- source_word: αἱ λοιπαὶ παρθένοι
  choice: ほかの乙女たち
  rationale: λοιπαίの「残りの／ほかの」を簡潔に表し、παρθένοιは文脈に合う伝統的かつ理解しやすい「乙女たち」とした。
- source_word: λέγουσαι
  choice: こう言った
  rationale: 直接話法を導く分詞を、自然な日本語の叙述として独立した述語で表した。
- source_word: Κύριε κύριε
  choice: 主よ、主よ
  rationale: κύριοςが持つ敬称としての意味と、マタイ福音書における神学的な響きの双方を保つ。切迫した反復もそのまま残した。
- source_word: ἄνοιξον ἡμῖν
  choice: 私たちのために開けてください
  rationale: 命令形と与格代名詞を自然な日本語で表した。目的語は原文に明記されていないため、本文では「戸を」を補わない。
theological_decisions:
- issue: 呼びかけのκύριοςの訳し方
  choice: 主
  alternative: ご主人様／先生
  rationale: 物語内では敬意を表す呼称とも取れるが、マタイ福音書のより広い神学的響きもあり得る。「主」とすることで、その両義的な緊張を狭めずに保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、たとえ話にふさわしい品位を保った。「主よ」の反復は原文の切迫感と神学的余韻を残すため保持した。
