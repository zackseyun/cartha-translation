  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: ja
  text: というのも、わたしが空腹だったとき、あなたがたは食べ物を与え、渇いていたときには飲み物を与え、見知らぬ者だったときには迎え入れてくれたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見知らぬ者」は「よそ者」「旅人」とも訳せる。「迎え入れる」に当たるギリシア語は字義的には「集める」だが、ここでは見知らぬ者を受け入れて歓待することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: わたしが空腹だったとき
  rationale: アオリストが表す過去の空腹の経験を自然な現代日本語で示し、後続の行為との時間的関係も明確にする。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の宣言に理由を示す説明的接続であるため、日本語では呼応表現によって論理関係を自然に示す。
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: あなたがたは食べ物を与え
  rationale: δίδωμι＋与格＋不定詞の構文を、簡潔で自然な「食べ物を与える」と訳す。
- source_word: ἐδίψησα
  choice: 渇いていたとき
  rationale: 過去に喉の渇きを経験していた状態を、文脈に即した自然な表現で示す。
- source_word: ἐποτίσατέ με
  choice: 飲ませ
  rationale: ποτίζωの「飲み物を与える」という意味を、日本語で簡潔に表す。何を飲ませたかは原文が限定しないため「水」は補わない。
- source_word: ξένος
  choice: 旅人
  rationale: ここでは、見知らぬ者で宿や共同体の受け入れを必要とする人を指す。「外国人」のように国籍へ限定せず、古代の歓待の文脈を自然に伝える。
- source_word: συνηγάγετέ με
  choice: 迎え入れてくれた
  rationale: 字義は「集める」だが、ξένοςとの組み合わせでは客として受け入れる歓待を表す。「迎え入れる」はその含意を自然に伝える。
theological_decisions:
- issue: ξένος … συνηγάγετέ με が表す歓待
  choice: 「旅人だったときには迎え入れてくれた」
  alternative: 「見知らぬ者だったときには受け入れてくれた」
  rationale: 弱い立場にある他者を個人的に歓待する倫理的意味を保ちつつ、現代の国籍・在留資格などの政治的区分へ狭めない。「旅人」は文脈上の宿を必要とするよそ者を表すが、語の幅は注で示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。三つの状況と応答の並行性を保ち、γάρの説明関係を「というのも……からです」で明示した。
