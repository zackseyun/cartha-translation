base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: ja
  text: 私は恐れて、行ってあなたのタラントン[a]を地面に隠しました。ご覧ください。あなたのものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「タラントン」は高額の重量・貨幣単位。生まれつきの「才能」という意味ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: 私は恐ろしくなり
  rationale: アオリスト分詞が、後続する行動の動機または状況を示す。畏敬と限定せず、しもべ自身が述べる恐れを自然な日本語で表した。
- source_word: ἀπελθὼν
  choice: 行って
  rationale: アオリスト分詞を動作の順序に沿って訳し、「行って、…隠しました」と有限動詞につないだ。文脈上明らかなため、方向を過度に補わない。
- source_word: ἔκρυψα
  choice: 隠しました
  rationale: κρύπτωの直接的な意味を採用した。埋めたことは「地中に」によって示されるため、動詞自体には付加しない。
- source_word: τὸ τάλαντόν σου
  choice: あなたのタラントン[a]
  rationale: τάλαντονは高額の重量・貨幣単位であり、現代日本語の「才能」との混同を避けつつ歴史的名称を保つため、「タラントン」と音写し、脚注で説明した。
- source_word: ἐν τῇ γῇ
  choice: 地中に
  rationale: 隠した場所としてのγῆを、簡潔で自然な現代日本語にした。
- source_word: ἴδε
  choice: ご覧ください
  rationale: 相手の注意を向ける命令表現。しもべが主人に語る場面にふさわしい丁寧さを保った。
- source_word: ἔχεις τὸ σόν
  choice: これがあなたのものです
  rationale: 直訳的な「あなたはあなたのものを持っています」では不自然なため、差し出して返す場面を踏まえつつ、所有を強調する省略表現の意味を自然に表した。
theological_decisions:
- issue: τάλαντονを、後世の比喩的意味である「才能」と理解する可能性
  choice: 本文では歴史的な重量・貨幣単位として「タラントン」とし、脚注で金銭的意味を明示する。
  alternative: 「多額のお金」または具体的な現代通貨相当額と訳す。
  rationale: 原語は生来の能力ではなく、高価な重量・貨幣単位を指す。音写によって物語の歴史的表現を保ち、脚注によって誤解を防ぐ。現代通貨への換算は不確実性が大きいため避ける。
- issue: しもべの恐れの性質
  choice: 単に「恐ろしくなり」と訳し、恐れの性質を限定しない。
  alternative: 「主人を畏れて」または「罰が怖くて」と解釈的に訳す。
  rationale: φοβηθεὶς自体は、畏敬か処罰への恐怖かを明示しないため、本文にある神学的・心理的な余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、主人に対するしもべの発言には丁寧体を採用した。「ご覧ください」は尊敬語として自然でありながら、ἴδεの注意喚起を保持する。
