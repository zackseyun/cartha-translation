id: MAT.25.34
reference: Matthew 25:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: ja
  text: その時、王は自分の右にいる人たちに言う。「来なさい。わたしの父に祝福された人たちよ、世界の基が据えられた時からあなたがたのために用意されている王国を受け継ぎなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 裁きの場面における出来事の順序を自然な現代日本語で示す。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 文脈上、終末の裁きを行う特定の王を指す。日本語では大文字による固有称号化がないため、簡潔に「王」とした。
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: 自分の右にいる者たち
  rationale: 位置を明確にしつつ、右側が持つ名誉ある含意を原文どおり文脈に委ねた。
- source_word: Δεῦτε
  choice: さあ
  rationale: 単なる移動命令よりも、続く招きへ促す呼びかけとして自然に表した。
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: わたしの父に祝福された者たち
  rationale: 完了受動分詞の継続する状態と、属格が示す祝福の源を明瞭に表す。
- source_word: κληρονομήσατε
  choice: 受け継ぎなさい
  rationale: 命令の力を保ち、相続・継承という語の含意を一般的な「受け取りなさい」よりよく伝える。
- source_word: τὴν ... βασιλείαν
  choice: 王国
  rationale: 相続され、用意されている対象としての領域的意味を保つ。「支配」と限定せず、王との語のつながりも明瞭にした。
- source_word: ἡτοιμασμένην ὑμῖν
  choice: あなたがたのために用意されている
  rationale: 完了受動分詞が表す、すでに用意されて現在もその状態にあることを自然に示す。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 世界が造られた時から
  rationale: 起点を示すἀπόを「時から」で保ち、καταβολήの慣用的な意味を普通の読者に分かりやすく表した。原文の比喩的表現は脚注に示す。
theological_decisions:
- issue: 「父に祝福された」における行為者・源
  choice: 「わたしの父に祝福された」
  alternative: 「わたしの父の祝福された者たち」
  rationale: 属格は祝福の源を示すと自然に理解できる。現代日本語では助詞「に」によって受動の行為者を明示するのが明瞭であり、意味を付加しない。
- issue: 終末的相続の文脈における βασιλεία
  choice: 「王国」
  alternative: 「支配」または「御国」
  rationale: 「受け継ぐ」「用意されている」との結びつきは、相続される終末的な国・領域の意味に適する。「支配」として抽象化せず、また敬語的表記に依存しない表現を選んだ。
- issue: ἀπὸ καταβολῆς κόσμου の修飾関係
  choice: 「あなたがたのために用意されている」に結びつける
  alternative: 招き全体に緩やかに結びつける
  rationale: 語順と統語上、直近のἡτοιμασμένηνにかかるのが最も自然であり、世界創造の時から王国が用意されているという意味を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、王の厳粛な宣告にふさわしい格調を保った。引用内の呼びかけには「者たちよ」を用いて荘重さを残し、それ以外は過度に古風な語法を避けた。
