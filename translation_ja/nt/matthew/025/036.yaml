  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: ja
  text: 裸[a]だったときには私に服を着せ、病気だったときには私を見舞い[b]、牢にいたときには私のところに来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裸」は、十分な衣服を持たない状態を含むこともある。
    reason: lexical_alternative
  - marker: b
    text: この語には、気遣って訪ねることや世話をするという含みもあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: 裸
  rationale: 「裸、衣服を身に着けていない」を直接表す。文脈上は衣服が足りない状態を含み得るため、その幅を脚注に示した。
- source_word: περιεβάλετέ
  choice: 服を着せ
  rationale: περιβάλλωの、衣服を人の身に着けさせるという具体的な動作を、現代日本語で自然に表した。
- source_word: ἠσθένησα
  choice: 病気だった
  rationale: この語は広く「弱る」も意味し得るが、ここでは困窮者への具体的な慈しみの行為が列挙されており、「病気だった」が文脈に最も適する。
- source_word: ἐπεσκέψασθέ
  choice: 見舞い
  rationale: 単なる訪問だけでなく、気遣いや世話を伴う訪問を表し得る語である。「見舞う」は病人を訪ねて気遣う意味を自然かつ簡潔に伝える。
- source_word: φυλακῇ
  choice: 牢
  rationale: 拘禁される場所を指す。簡潔で格調を保ちつつ、一般読者にも明瞭な語を選んだ。
- source_word: ἤλθατε πρός με
  choice: 私のところに来てくれた
  rationale: 原文どおり「私のもとへ来た」という単純な表現を保ち、「訪ねた」「世話をした」などを付加しなかった。文脈上の善意は授受表現「くれた」で自然に示した。
theological_decisions:
- issue: 慈しみの行為をどこまで説明的に訳すか
  choice: 「服を着せ」「見舞い」「私のところに来てくれた」という具体的な行為を保つ。
  alternative: 「世話をし」「訪問して励ました」などと意味を補う。
  rationale: この節は具体的な慈しみの行為を簡潔に並べている。原文に明示されない牧会的・神学的含意を本文へ加えず、ἐπισκέπτομαιに含まれ得る気遣いの含意だけを脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言として自然でありながら軽すぎない調子にした。並列を「〜だったときには」で整え、原文の簡潔な反復と具体性を保った。
