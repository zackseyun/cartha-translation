  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: ja
  text: その時、正しい人たちは彼にこう答えるでしょう。『主よ、いつ私たちは、空腹のあなたを見て食べ物を差し上げ、渇いておられるあなたを見て飲み物を差し上げたでしょうか。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 談話の時間的な展開を示す語として、簡潔で自然な日本語にした。
- source_word: ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες
  choice: 正しい人たちは彼にこう答える
  rationale: 未来形を文脈に即した日本語の非過去形で表し、λέγοντεςは直接話法を導く「こう」によって自然に統合した。οἱ δίκαιοιは一般読者に明瞭な「正しい人たち」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼格による直接の呼びかけを保ち、敬意と本文にある称号としての含みを損なわない表現とした。
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: 空腹であるのを見て食べ物を差し上げ
  rationale: 目的語補語的な分詞と具体的な給食行為を自然な日本語で表現した。「養う」より、この場面の行為が明瞭である。
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: 渇いているのを見て飲み物を差し上げた
  rationale: ἐποτίσαμενの使役的な意味を、現代日本語で自然かつ具体的な「飲み物を差し上げた」とした。並行する節では原文で省略された「見て」を日本語上補った。
theological_decisions:
- issue: イエスへの呼びかけにおける κύριος の訳
  choice: 主
  alternative: 先生／主人
  rationale: 「主」は敬意ある呼称とキリスト論的な響きの両方を保持しつつ、本文以上の意味を限定的に付加しない。
- issue: οἱ δίκαιοι の表現
  choice: 正しい人たち
  alternative: 義人たち
  rationale: 終末の場面で正しい者と認められる人々を指すが、その認定の根拠や教理を訳文で補わず、形容詞の実質名詞的用法を明瞭な現代語で表した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、直接話法では「主よ」「差し上げる」により敬意と品位を保った。原文の並行構造を維持し、神学的な説明は本文に加えていない。
