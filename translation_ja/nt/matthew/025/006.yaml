lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: ところが、真夜中に
  rationale: 時を示す属格表現を自然な日本語で「真夜中に」とし、δέの穏やかな場面転換と対照を「ところが」で表した。
- source_word: κραυγὴ γέγονεν
  choice: 叫び声が上がった
  rationale: γίνομαιの完了形はここで叫びが生じた出来事を告げる。「叫び声が上がった」は突然の告知を自然に伝える。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す指示的な間投詞の力を保ちつつ、聖書本文として簡潔で格調ある現代語とした。日常的には「ほら」とも訳せるため脚注を付した。
- source_word: ὁ νυμφίος
  choice: 花婿
  rationale: 婚礼の文脈にあるνυμφίοςを明確かつ自然に表す。
- source_word: ἐξέρχεσθε
  choice: 出なさい
  rationale: 聞き手に外へ出るよう命じる複数形の命令を、自然な日本語の直接命令として訳した。
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: 迎えに
  rationale: この慣用句は相手を迎えるために出向くことを表す。「迎えに出る」という日本語で移動と対面の含意を簡潔に保持した。
theological_decisions:
- issue: νυμφίοςがたとえの中で指すもの
  choice: 「花婿」と普通名詞で訳し、キリストを明示しない
  alternative: 「花婿」を特別な表記にしてキリストとの同定を示す
  rationale: 文脈上はイエスを指すと理解されるが、この節自体はたとえの登場人物として語っている。翻訳では文学的次元を保ち、解釈を本文に加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接話法には簡潔で dignified な調子を保った。「見よ」はやや文語的だが、ἰδούの注意喚起を端的に再現し、脚注でより口語的な選択肢を示した。
