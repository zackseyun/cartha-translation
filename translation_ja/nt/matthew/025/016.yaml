source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: ja
  text: 五タラント[a]を受け取った者は、出て行ってそれを元手に働き[b]、さらに五タラントをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: タラントは、生まれつきの才能ではなく、当時の大きな貨幣単位。
    reason: cultural_note
  - marker: b
    text: 直訳すると「それらを用いて働き」。預かった金を利益のために積極的に用いたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: 出て行って
  rationale: 先行する分詞を自然な連用表現とし、後続の行動との順序を示した。原文に明示されない「すぐに」は加えない。
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: 五タラントを受け取った者
  rationale: 冠詞付き分詞句の指示機能を保ち、性別を不必要に補わず自然な日本語にした。
- source_word: τάλαντα
  choice: タラント
  rationale: 当時の大きな貨幣単位を表す語として伝統的な音訳を用い、現代語の「才能」との混同を脚注で避ける。
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: それを元手に働き
  rationale: 金銭を実際に用いて利益を得るために働いたという文脈を明確にしつつ、「商売をした」ほど行為を限定しない。
- source_word: ἐκέρδησεν
  choice: もうけた
  rationale: 利益を得たことを表す商業的文脈に自然で明瞭な現代日本語。
- source_word: ἄλλα πέντε
  choice: さらに五タラント
  rationale: 元の五タラントに加えて同額を得たという加算の意味を簡潔に表す。
