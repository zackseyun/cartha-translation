  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: ja
  text: その時、あの乙女たちは皆起き上がり、自分たちのともしび[a]を整えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ランプ」、または「たいまつ」とも訳せる。ギリシア語は携帯用の灯火を指し、油を用いて整えるという文脈では、いずれも可能である。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の次の出来事を示す時間副詞。自然な現代日本語で叙述の流れを保つ。
- source_word: ἠγέρθησαν
  choice: 起き上がり
  rationale: ここでは眠り、または横になった状態から起きることを指す。「目を覚まし」も文脈上は可能だが、後続の行動につながる身体動作をより直接に表す。
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: あの乙女たちは皆
  rationale: παρθένοι の未婚・処女性を含む語義と婚礼の文脈を保つ。「若い女たち」より語義が明確で、「処女たち」より日本語の物語表現として自然かつ品位がある。
- source_word: ἐκόσμησαν
  choice: 整えた
  rationale: 基本義は「整える、秩序立てる」。灯火について、芯などを使用できる状態に整えたことを表すが、原文が具体的な作業を明記しないため「芯を切りそろえた」と限定しない。
- source_word: λαμπάδας
  choice: ともしび
  rationale: λαμπάς は携帯用のランプまたはたいまつを指し得る。「ともしび」は日本語で両者にまたがる光源表現として自然で、原語の幅をある程度保つ。別訳を脚注に示す。
- source_word: ἑαυτῶν
  choice: 自分たちの
  rationale: 再帰代名詞の所有関係を明示し、乙女たち自身が携えていた灯火であることを自然に表す。
theological_decisions: []
