  to: その時、王は左側にいる者たちにも言う。『呪われた者たちよ[a]、私から立ち去れ。悪魔とその天使たちのために用意された永遠の火の中へ行け。』
  rationale: 「使いたち」を「天使たち」に改め、悪魔に属する超自然的存在というἀγγέλοιの文脈上の指示対象を明確にした。また、Πορεύεσθε ἀπ’ ἐμοῦに対応して「私から立ち去れ」とした。その他の語順と内容は、原文の呼びかけ、目的地への移動、永遠の火が悪魔とその天使たちのために用意されていることを保っている。
