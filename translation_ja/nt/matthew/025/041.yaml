id: MAT.25.41
reference: Matthew 25:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: ja
  text: その時、王は左側にいる者たちにも言う。『呪われた者たちよ[a]、私から立ち去れ。悪魔とその天使たちのために用意された永遠の火の中へ行け。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「呪いの下にある者たちよ」とも訳せる。
    reason: 完了受動分詞が、呪いを受けてその状態にあることを表すため。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: さばきの場面における出来事の進行を示す時間表現として、自然で明確な日本語にした。
- source_word: ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων
  choice: 王は左側にいる者たちにも言う
  rationale: 動詞に明示されていない主語は直前の文脈の「王」であり、日本語では補うと話者が明確になる。ἐξ εὐωνύμων は王の左側に配置された一群を指す。καί は「にも」で表した。
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: 私から離れ
  rationale: 命令形と分離を示す前置詞句を合わせ、話者のもとから立ち去る命令を簡潔かつ厳粛に表した。
- source_word: οἱ κατηραμένοι
  choice: 呪われた者たちよ
  rationale: 完了受動分詞の呼びかけとして、呪いを受けた状態にある者たちを表す。受動の含みを保った。
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: 永遠の火の中へ行け
  rationale: εἰς が示す内部への移動を「中へ」で保ち、αἰώνιον はこの終末的さばきの文脈で通常の意味に従い「永遠の」とした。
- source_word: τὸ ἡτοιμασμένον
  choice: 用意された
  rationale: 以前に用意され、現在その状態にあることを示す完了受動分詞を自然な日本語で表した。
- source_word: τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ
  choice: 悪魔とその使いたちのために
  rationale: 終末的さばきの文脈では διάβολος は固有の敵対者である悪魔を、ἄγγελοι はそれに属する超自然的な使いたちを指す。「御使い」として善的含意を加えず「使い」とした。
theological_decisions:
- issue: αἰώνιον の時間的意味
  choice: 永遠の
  alternative: いつまでも続く／一時代にわたる
  rationale: この終末的さばきの文脈における通常の語義を採りつつ、火の性質や刑罰のあり方について本文が明言しない詳細は付加しない。
- issue: διάβολος と ἄγγελοι の指示対象
  choice: 悪魔とその使いたち
  alternative: 中傷する者とその使者たち
  rationale: ここでは一般的な性質や人間の使者ではなく、悪魔とそれに属する超自然的存在を指す定型的表現として読むのが文脈に適う。
- issue: 火が用意された対象
  choice: 悪魔とその使いたちのために用意された
  alternative: 悪魔とその使いたちに属するために用意された
  rationale: 与格を目的・対象として自然に表し、人間のために用意されたという含意を本文へ付け加えない。
translation_notes:
  register: 現代の一般読者に分かる明瞭な標準語を用い、直接話法の厳粛さと命令の強さを保った。「王」は直前の文脈に基づく主語の補足である。
