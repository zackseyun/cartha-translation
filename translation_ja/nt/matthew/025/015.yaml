id: MAT.25.15
reference: Matthew 25:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: ja
  text: そして、一人には五タラント[a]、別の一人には二タラント、もう一人には一タラントを、各自の能力に応じて与え、旅に出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: タラントは古代の非常に大きな重量または貨幣の単位。ここでは現代語の「才能」という意味ではない。別訳「多額の金銭」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τάλαντα
  choice: タラント
  rationale: 古代の大きな重量・貨幣単位を指す歴史的名称を保ち、現代語の「才能」と誤解されないよう脚注で説明する。
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: 一人には……別の一人には……もう一人には
  rationale: μέν／δέによる配分と対比を、自然な現代日本語で明確に示す。
- source_word: ἕν
  choice: 一タラント
  rationale: ギリシア語では名詞が省略されているが、日本語では単位名を補うほうが明瞭で自然である。
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: それぞれの力に応じて
  rationale: 各人に対応する分配的な意味を保ち、δύναμιςをここでは奇跡的な力ではなく、任されたものを扱う力量・能力として訳す。
- source_word: ἀπεδήμησεν
  choice: 旅に出た
  rationale: 単にその場を離れたことだけでなく、遠方へ出かける語感を簡潔に表す。
- source_word: εὐθέως
  choice: すぐに
  rationale: 本文では直前の「旅に出た」を修飾する読みを採るが、次節の行動にかかる可能性を脚注に残す。
- source_word: καὶ
  choice: そして
  rationale: 前節から続く物語の流れを、意味を付加せず自然に示す。
theological_decisions:
- issue: 「それぞれ」に対応する所有表現
  choice: それぞれの力に応じて
  alternative: 各自の力に応じて
  rationale: ギリシア語の単数による分配的表現を保ちながら、日本語では性別を不必要に明示せず、各人固有の力量という意味を自然に伝える。
- issue: たとえにおける τάλαντα の意味
  choice: 貨幣単位としての「タラント」
  alternative: 多額の金銭
  rationale: 文脈は主人が僕たちに財産を託す場面であり、現代語でいう生来の「才能」を直接指すものではない。歴史的単位を本文に残し、脚注で明確にする。
- issue: εὐθέως の係り先
  choice: 主人が「すぐに旅に出た」
  alternative: 次節の僕が「すぐに」行動した
  rationale: 語順上はどちらも可能であり、古代写本の句読法は決定的ではない。英語POBの読みを本文に採りつつ、SBLGNTの編集上の句点と整合する別の係り方を脚注で示して曖昧さを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「タラント」は歴史的・聖書的用語として保持し、誤解を脚注で防いだ。列挙は日本語として自然な形にしつつ、原文の三者への配分を明確にした。
