id: MAT.25.21
reference: Matthew 25:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: ja
  text: 主人[b]は彼に言った。「よくやった、善良で忠実な召使い[a]よ。あなたはわずかなことを任されて忠実だった。多くのことを管理する者に任命しよう。あなたの主人の喜びに入りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」とも訳せる。ギリシア語のドゥーロスは、文脈により「召使い」または「奴隷」を意味する。
    reason: alternative_reading
  - marker: b
    text: 「主」とも訳せる。ここでは、たとえの中の召使いとの関係を表すため「主人」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: 言った
  rationale: 直接話法を導くφημίの標準的で自然な物語表現。
- source_word: κύριος
  choice: 主人
  rationale: たとえの物語上、召使いを所有し指揮する人物を指すため、「主」よりも両者の社会的関係を明確に表す。
- source_word: δοῦλε
  choice: 召使い
  rationale: 現代日本語で理解しやすく、主人に従属して仕える者という文脈上の役割を表す。原語が「奴隷」をも意味することは脚注に残す。
- source_word: Εὖ
  choice: よくやった
  rationale: 主人による称賛として自然な日本語であり、単なる「よい」より文脈に即している。
- source_word: ἀγαθὲ καὶ πιστέ
  choice: 善良で忠実な
  rationale: 二つの評価語を区別しつつ、呼びかけとして自然に表す。
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: わずかなものに忠実だった
  rationale: 委ねられた小さな範囲で忠実だったという意味を、後半との対照を保って簡潔に表す。
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: 多くのものを任せよう
  rationale: καθίστημιがここで責任ある立場への任命を意味することを自然に表し、「わずかなもの」と「多くのもの」の対比を保つ。
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: 喜びに入りなさい
  rationale: 「入る」という原文の比喩を保ち、「喜びを共にする」と説明的に限定しない。
theological_decisions:
- issue: たとえの人物を指すκύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: 神またはキリストを暗示するたとえとして読む余地を残しながらも、発話の直接的な場面では主人と召使いの関係を表す語を採用し、キリスト論的称号を本文に先取りして持ち込まない。
- issue: δοῦλοςが示す身分の訳し方
  choice: 召使い
  alternative: 奴隷
  rationale: 文脈上の奉仕と従属関係を明瞭で自然な現代日本語で示しつつ、原語に実在する奴隷身分の含意を脚注で明記する。
- issue: 「主人の喜びに入る」という表現の解釈
  choice: 比喩をそのまま保持する
  alternative: 主人と喜びを共にしなさい
  rationale: 参加や祝宴を含意し得るが、原文は説明せず「喜びに入る」と述べているため、その開かれた比喩と神学的含みを保持する。
translation_notes:
  register: 明瞭な現代標準語を基調とし、主人の称賛には簡潔で品位のある口調を用いた。「おまえ」は上下関係のある直接の呼びかけとして採用したが、侮蔑的になりすぎない文脈に置いた。原文の反復と「喜びに入る」という比喩を保持した。
