  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: ja
  text: そのうち五人は愚かで、五人は賢かった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: 五人
  rationale: 直前の十人の娘たちを数える基数なので、日本語では人を数える助数詞「人」を補った。二度繰り返し、原文の均衡と対比を保った。
- source_word: δὲ
  choice: （「で」による接続）
  rationale: ここでは強い逆接ではなく、叙述を進めながら二群を示す軽い接続である。独立した「しかし」などを置かず、「愚かで」と自然につないだ。
- source_word: ἐξ αὐτῶν
  choice: そのうち
  rationale: 先に述べられた集団の中の一部であることを示す部分表現。現代日本語で簡潔かつ自然な「そのうち」とした。
- source_word: ἦσαν
  choice: ～だった
  rationale: εἰμίの未完了過去がこの箇所では描写的な繋辞として働くため、自然な過去表現とした。文末の「賢かった」が両群にかかる構文で表した。
- source_word: μωραὶ
  choice: 愚か
  rationale: 思慮や分別を欠くことを表し、対となる φρόνιμοι との明確な対比を保つ一般的で dignified な語を選んだ。
- source_word: φρόνιμοι
  choice: 賢かった
  rationale: 文脈上、先を見越して適切に行動する分別を表す。「思慮深い」も可能だが、「愚か」との簡潔で定着した対比を保つため「賢い」とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。原文の「五人／五人」という均衡を維持しつつ、日本語では繋辞を一度にまとめ、簡潔で格調を失わない文とした。
