id: MAT.25.44
reference: Matthew 25:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: ja
  text: その時、彼らも答えてこう言うでしょう。『主よ、いつ私たちは、あなたが空腹で、渇き、よそ者で[b]、裸で、病気で、あるいは牢にいるのを見て、あなたに仕えなかったでしょうか[a]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕えなかった」は、「世話をしなかった」または「奉仕しなかった」とも訳せる。ギリシア語ディアコネオーは、必要に応じて実際に仕えることを表す。
    reason: διακονέωの実際的な援助を含む広い意味を示す。
  - marker: b
    text: 「よそ者」は、「見知らぬ人」「旅人」とも訳せる。ギリシア語クセノスは、共同体の外から来て受け入れを必要とする人を指しうる。
    reason: ξένοςを旅の途上にある人だけに限定せず、文脈上の社会的な意味の幅を示す。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 最後の審判の場面における応答の順序を示す時間副詞として、明瞭で自然な表現。
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: 彼らも答えて言う
  rationale: καὶ αὐτοὶ の「彼らも」という対応関係と、応答を導く分詞 λέγοντες を保つ。日本語では未来形を明示せず、預言的叙述に自然な現在形で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼格でのイエスへの呼びかけ。敬意と文脈上の称号性を保つ標準的な訳。
- source_word: πεινῶντα ἢ διψῶντα
  choice: 空腹であるのを、渇いているのを
  rationale: いずれも目的語 σε の状態を示す述語的分詞であり、並列を明瞭に保った。
- source_word: ξένον
  choice: 旅人であるのを
  rationale: この憐れみの行為の文脈では、よそから来て迎え入れを必要とする者を指す。「外国人」と民族的に限定せず、「見知らぬ人」よりももてなしとの関連が伝わる表現を選んだ。
- source_word: γυμνὸν
  choice: 裸であるのを
  rationale: 衣服を欠く状態を表す語の直接的な力を保ち、文脈上は着る物に事欠く状態も含みうる。
- source_word: ἀσθενῆ
  choice: 病んでいるのを
  rationale: 語には「弱い」の意味もあるが、身体的・社会的困窮の列挙では病気の状態を指すのが自然。
- source_word: ἐν φυλακῇ
  choice: 牢にいるのを
  rationale: 拘禁されている状態を、現代日本語で簡潔かつ具体的に表した。
- source_word: οὐ διηκονήσαμέν σοι
  choice: あなたに仕えなかったでしょうか
  rationale: διακονέω の実際的な奉仕という広い意味を保ち、特定の教会的職務に限定しない。否定を伴う疑問として自然に表現した。
theological_decisions:
- issue: κύριος のイエスへの称号としての訳
  choice: 主
  alternative: 主人
  rationale: 尊敬を込めた呼びかけとキリスト論的な響きの双方を保ちつつ、本文以上の解釈を加えない。
- issue: διακονέω の意味範囲
  choice: 仕える
  alternative: 世話をする／奉仕する
  rationale: 困窮者への具体的援助と王への奉仕との結び付きを保つ。「世話をする」だけに狭めず、制度的・宗教的奉仕だけにも限定しない。
- issue: ξένος の社会的意味
  choice: 旅人
  alternative: 見知らぬ人／外国人
  rationale: 迎え入れを必要とする共同体外の者という文脈を示し、民族的な意味に限定しない。「見知らぬ人」という語義もありうるため、その幅は注記する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きの場面にふさわしい格調を保った。原文の反復的な列挙を生かし、「あなたが…のを」を最初に置いた後も各状態を明示して、聞き取りやすさを優先した。
