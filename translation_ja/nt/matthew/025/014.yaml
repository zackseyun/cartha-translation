id: MAT.25.14
reference: Matthew 25:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: ja
  text: というのも、旅に出るある人が、自分の奴隷たち[a]を呼び、自分の財産を彼らに預けたのと同じだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分のしもべたち」または「自分の召使いたち」とも訳せる。ギリシア語ドゥーロスは、文脈により奴隷またはしもべを指す。ここでは主人への従属と権威関係が前面に出ているため、「奴隷」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: というのも、それは、…ようなものだからです
  rationale: γάρが前節との説明的なつながりを示し、ὥσπερがたとえによる比較を導く。原文で省略されている比較の主語を「それは」で最小限に補い、何を指すかを本文中で限定しない。
- source_word: ἄνθρωπος
  choice: ある人
  rationale: たとえに登場する一人の男性を指すが、日本語では「ある人」が自然であり、人物の性別を不必要に強調しない。
- source_word: ἀποδημῶν
  choice: 旅に出ようとしていた
  rationale: 別の土地へ出かけることを表す現在分詞を、奴隷たちを呼んだ時点で出立を予定・準備していたという自然な日本語で表した。「外国へ」は意味を狭めすぎるため避けた。
- source_word: ἐκάλεσεν
  choice: 呼び
  rationale: 主人が自分の奴隷たちを呼び寄せたことを、簡潔で自然な現代語で表す。
- source_word: τοὺς ἰδίους δούλους
  choice: 自分の奴隷たち
  rationale: ἰδίουςの所有・所属の含意を「自分の」で示し、δοῦλοςは主人の所有権と権威が目立つ家政的文脈に即して「奴隷」とした。
- source_word: παρέδωκεν
  choice: 預けた
  rationale: 財産を管理責任とともに委ねる文脈なので、単なる物理的な引き渡しより「預けた」が自然で的確。
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: 財産
  rationale: その人に属する所有物全体を指すため、日本語では簡潔な集合名詞「財産」が適切。
theological_decisions:
- issue: たとえの家政的文脈における δοῦλος の訳語
  choice: 奴隷
  alternative: しもべ／召使い
  rationale: 主人への法的・社会的従属と、主人が財産を管理させる権威関係を弱めずに伝えるため。「しもべ」は宗教語的で現代の一般読者には身分関係が曖昧になりやすく、「召使い」は雇用関係と受け取られる可能性がある。別訳は脚注で示す。
- issue: Ὥσπερ γὰρ の省略された比較対象
  choice: 「それは」で指示対象を開いたままにする
  alternative: 「天の国は」と明示する
  rationale: 文脈上は天の国や主の来臨に関わるたとえだが、この節のギリシア語本文には明示的な主語がないため、解釈を本文へ織り込まず原文の省略と余地を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、たとえにふさわしい落ち着いた語調にした。「というのも」と文末の「だからです」で前節との説明的接続を示す。
