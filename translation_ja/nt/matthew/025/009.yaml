  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: ja
  text: しかし、賢い娘たちは答えた。「いいえ。私たちにもあなたがたにも足りなくなるといけませんから。[a] それより、売っている人たちのところへ行って、自分たちのために買いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「私たちにもあなたがたにも、決して足りなくならないように」。ギリシア語では「～するといけない」を表す語に強い否定が重なり、油が双方に足りなくなることへの強い懸念を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι
  choice: しかし、賢い娘たちは答えた
  rationale: δέの対照を「しかし」で示し、形容詞の名詞的用法αἱ φρόνιμοιは、文脈上すでに登場している娘たちを指すため、自然な日本語で「賢い娘たち」とした。λέγουσαιは日本語では重ねて「言って」とせず、発話を導く「答えた」に含めた。
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: いいえ。……とても足りそうにありません
  rationale: μήποτεと強い否定οὐ μήが表す拒絶と不足への強い懸念を、現代日本語として自然に表した。「いいえ」は文脈上含意される拒絶を明示する。
- source_word: ἡμῖν καὶ ὑμῖν
  choice: 私たちとあなたがたの両方には
  rationale: 双方に行き渡るだけの量がないという意味を明確にしつつ、二つの与格を保持した。
- source_word: πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας
  choice: それより、売っている人たちのところへ行って
  rationale: μᾶλλονは、拒絶された案に代わる行動を示す「それより」とした。τοὺς πωλοῦνταςは目的語を補わず「売っている人たち」と訳し、原文の簡潔さを保った。
- source_word: ἀγοράσατε ἑαυταῖς
  choice: 自分たちの分を買いなさい
  rationale: 再帰代名詞の与格が示す、自分たちのための購入を自然な日本語で表した。
