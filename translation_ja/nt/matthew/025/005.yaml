id: MAT.25.5
reference: Matthew 25:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: ja
  text: しかし、花婿が来るのに時間がかかっているうちに[a]、娘たちは皆、眠くなり、眠り込んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「花婿が遅れている間に」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「眠くなり、眠っていた」。ギリシア語は、眠くなること（ἐνύσταξαν）と、眠っていること（ἐκάθευδον）を区別している。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: 来るのに時間がかかっている
  rationale: χρονίζωの「遅れる、長くかかる」という継続的な意味を自然な現代日本語で表す。文脈上補われる「来る」を明示するが、意図的に遅らせたとは断定しない。
- source_word: δὲ
  choice: しかし
  rationale: 待っていた娘たちが眠るという物語上の転換と緩やかな対照を示す。
- source_word: τοῦ νυμφίου
  choice: 花婿
  rationale: 婚礼のたとえにおけるνυμφίοςの具体的な像を、伝統的かつ明瞭な日本語で保持する。
- source_word: ἐνύσταξαν
  choice: 眠くなり
  rationale: 眠気を催す段階を表し、後続する実際の睡眠と区別する。
- source_word: πᾶσαι
  choice: 娘たちは皆
  rationale: 女性複数形が前節の娘たち全員を指すことを明確にし、賢い者も愚かな者も例外でないことを保持する。
- source_word: ἐκάθευδον
  choice: 眠り込んだ
  rationale: 先行する「眠くなり」から実際に眠るまでの進行を自然に表す。一方、未完了過去の継続性は脚注で示す。
theological_decisions:
- issue: 花婿の比喩的意味
  choice: 本文では「花婿」というたとえの像のみを保持する
  alternative: キリストを指すことを訳文に明示する
  rationale: マタイ福音書の広い文脈ではキリスト論的な響きがあるが、この節自体はたとえの登場人物として述べているため、解釈を本文へ付加しない。
- issue: 花婿の遅れの原因
  choice: 「来るのに時間がかかっている」とし、原因や責任を特定しない
  alternative: 「花婿が遅れている」または「花婿がぐずぐずしている」
  rationale: χρονίζωは遅延または長時間を要することを表すが、その原因や意図までは明示しない。神学的意味を過度に確定しないため、中立的に訳す。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「花婿」は婚礼の比喩を保ち、「娘たち」は文脈上の女性複数の指示対象を自然に示す。二つの睡眠動詞の段階差を本文と脚注で保持した。
