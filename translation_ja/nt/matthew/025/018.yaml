id: MAT.25.18
reference: Matthew 25:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: ja
  text: しかし、一タラントを受け取った者は、出て行って地面を掘り、主人の金銭を隠した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「主人の銀」。
    reason: ἀργύριονは「銀」と「金銭」の両義を持つため、本文では文脈上の意味を示し、字義的な語感を脚注に残した。
lexical_decisions:
- source_word: ὁ δὲ τὸ ἓν λαβὼν
  choice: しかし、一タラントを受け取った者は
  rationale: δέによる前のしもべたちとの対照を「しかし」で示す。τὸ ἓνは直前の文脈にあるタラントを指すため、「一タラント」と補って明確にした。λαβώνは後続動作に先立つ受領を自然な日本語で表した。
- source_word: ἀπελθὼν
  choice: 出て行って
  rationale: その場から離れて次の行動に移ったという動作の順序を、簡潔で自然な表現にした。
- source_word: ὤρυξεν γῆν
  choice: 地面を掘り
  rationale: 直訳に近い簡潔さを保ち、「穴を」と明示して原文以上に限定することを避けた。
- source_word: ἔκρυψεν
  choice: 隠した
  rationale: κρύπτωの基本的な意味を、平明な現代日本語で表した。
- source_word: τὸ ἀργύριον
  choice: 金
  rationale: ここでは銀という素材より、主人から預かった財貨を指す。現代日本語の「金」が文脈上自然であり、より字義的な「銀」は脚注に残した。
- source_word: τοῦ κυρίου αὐτοῦ
  choice: 主人の
  rationale: κύριοςは物語内でしもべに対する人間の主人を指すため、「主」ではなく、社会的関係が明瞭な「主人」とした。
theological_decisions:
- issue: たとえ話の中のκύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: 直接の指示対象は物語内の人間の主人である。「主人」はその関係を自然に示し、この一語自体を神的称号として過度に明示しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「しもべ」は本節に明示されていないため本文では「者」とし、前後の文脈への依存を保った。脚注記号は対応箇所である文末に置いた。
