id: MAT.25.29
reference: Matthew 25:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: ja
  text: というのも、持っている人はだれでも、与えられて豊かになる。しかし、持っていない人からは、持っているものまで取り上げられる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: だれでも、持っている人には
  rationale: 与格の冠詞付き分詞と παντί の配分的な意味を、現代日本語で自然な総称表現として訳した。γάρ は前文を受ける説明関係を示すが、日本語では独立した格言的文として接続語を明示しなくても関係が保たれる。
- source_word: δοθήσεται
  choice: 与えられ
  rationale: δίδωμι の未来受動を受動表現で保ち、行為者を原文同様に明示しない。
- source_word: καὶ περισσευθήσεται
  choice: その人は豊かに持つようになる
  rationale: περισσεύω が示す、与えられた結果として十分以上に持つ状態を自然な日本語で表した。καί は結果の連続として処理した。
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: しかし、持っていない人は
  rationale: 対照を示す δέ を「しかし」で明示し、総称的な単数の分詞表現を「人」で保った。後続する奪取の起点は、日本語の受動構文全体によって自然に示される。
- source_word: καὶ ὃ ἔχει
  choice: 持っているものまで
  rationale: καί の強意・累加的意味を「まで」で表し、欠けているとされる者が現に持つものさえ失うという逆説を保った。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 取り上げられる
  rationale: αἴρω の未来受動と ἀπό の分離の意味を、日本語の自然な受動表現にまとめた。
theological_decisions:
- issue: 総称的な男性単数の分詞表現
  choice: 「持っている人」「持っていない人」「その人」と単数の総称表現で訳す
  alternative: 複数化して「持っている人々」「彼ら」と訳す
  rationale: ギリシア語の男性単数は文法的に総称であり、特定の男性だけを指すものではない。日本語では性別を加えずに単数の代表的構造を保てるため、「人」を用いた。
- issue: περισσευθήσεται の意味と態
  choice: 「豊かに持つようになる」
  alternative: 「あふれるほどになる」または「ますます豊かになる」
  rationale: 文脈上は所有の増加を表すが、何を持つかは原文で明示されない。「豊かに持つ」はその省略と、十分以上になる結果の両方を保ち、特定の霊的・物質的対象に限定しない。
translation_notes:
  register: 明瞭な現代標準語。格言としての簡潔さと荘重さを保ちつつ、原文が明示しない「何を持つか」や与える者を補わない。日本語では総称表現に性別代名詞を必要としないため、包括性と単数構造を両立させた。
