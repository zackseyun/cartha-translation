lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: しかし、主人は答えた
  rationale: 分詞と定動詞を重ねる物語上の定型表現は、現代日本語では「答えた」と簡潔に訳す。δέは直前の願いへの対照を示すため「しかし」とした。日本語では主語の補足が必要であり、文脈上の話者である主人を明示した。
- source_word: Ἀμὴν
  choice: よく言っておく
  rationale: 共観福音書に特徴的な厳粛な宣言の導入句として、意味が明瞭で自然な現代日本語を用いた。「アーメン」より一般読者に伝わりやすく、単数形なので反復もしない。
- source_word: λέγω ὑμῖν
  choice: 言っておく
  rationale: 直接の語りかけと宣言の重みを保ちながら、Ἀμὴνと合わせて自然な日本語の定型句「よく言っておく」とした。
- source_word: οὐκ οἶδα
  choice: 知らない
  rationale: 基本義をそのまま保ち、文脈上あり得る関係的な否認や「見知らない」という含みを本文で一義的に決めない。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数の目的語であることを、日本語でも明示した。
theological_decisions:
- issue: 「あなたがたを知らない」の力点
  choice: 関係的な否認を含み得る、字義に近い「私はあなたがたを知らない」を保持する。
  alternative: 「あなたがたを見知らない」または「あなたがたとは何の関係もない」
  rationale: この句は文脈上、拒絶と関係的否認の重みを帯びるが、救いについての体系的な説明まで本文に加えず、原文の簡潔さと神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、厳粛さを保った。「よく言っておく」はイエスの宣言句として自然かつ格調があり、「知らない」は原文の簡潔さと曖昧さを保持する。
