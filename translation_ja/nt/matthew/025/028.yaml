id: MAT.25.28
reference: Matthew 25:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: ja
  text: だから、その一タラントを彼から取り上げて[a]、十タラントを持っている者に与えなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「取り去って」。ギリシア語の命令は、ここでは彼の手元からそれをなくすことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「タラント」は大きな重量の単位で、そこから貨幣の単位としても用いられた。
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: 取り上げて
  rationale: αἴρωのアオリスト能動命令形。ここでは、ある物をその人の手元から除くよう命じている。「取り上げる」は分離の意味と命令の強さを自然な日本語で表す。
- source_word: οὖν
  choice: だから
  rationale: 直前の裁定を受けた帰結を示す。現代の明瞭な日本語で論理的なつながりを保つ。
- source_word: ἀπ’ αὐτοῦ
  choice: 彼から
  rationale: ἀπό＋属格が、たとえの中で裁かれた者からの分離を示すため、簡潔に「彼から」とした。
- source_word: τὸ τάλαντον
  choice: その一タラント
  rationale: 定冠詞は、すでに言及された特定の一タラントを指す。タラントは当時の大きな重量・貨幣単位であり、歴史的用語を保持した。
- source_word: δότε
  choice: 与えなさい
  rationale: δίδωμιのアオリスト能動命令形。標準的で明確な命令表現とした。
- source_word: τῷ ἔχοντι
  choice: 持っている者に
  rationale: 冠詞付き分詞の実体詞的用法を、性別を不必要に補わない自然な日本語で表した。
- source_word: τὰ δέκα τάλαντα
  choice: 十タラントを
  rationale: 定冠詞は物語ですでに示された特定の十タラントを指す。日本語では文脈によって特定性が十分に伝わるため、指示語を重ねなかった。
theological_decisions:
- issue: たとえにおける τάλαντον の意味
  choice: 歴史的な重量・貨幣単位として「タラント」と表記する
  alternative: 大金／金額／才能
  rationale: 文脈は委ねられた財貨と清算を扱っている。「才能」と意訳すると後代の語義を本文に持ち込むため避け、「大金」だけに置き換えず歴史的単位を保持して注で説明した。
translation_notes:
  register: 明瞭で現代的ながら、たとえの主人が下す命令にふさわしい端正な文体。「だから」で直前からの帰結を自然に示し、歴史的用語「タラント」は注で補足した。
