  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: ja
  text: なぜなら、イエスは権威を持つ者として彼らを教えておられ、彼らの律法学者たちのようではなかったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: というのも、…教えておられ…からである
  rationale: γάρが前節の驚きの理由を説明する働きを保ち、ἦν＋現在分詞の継続的な過去の動作を自然な日本語で表した。文脈上の主語イエスを明示した。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 前節の群衆、すなわち聞いていた人々を指す目的語として訳した。
- source_word: ὡς ἐξουσίαν ἔχων
  choice: 権威を持つ者のように
  rationale: ἐξουσίαを「権威」とし、ὡς＋分詞の比較構文を明示的に保った。単なる自信や迫力に弱めず、同時に権威の神学的根拠を本文以上に説明しない。
- source_word: καὶ οὐχ ὡς
  choice: …のようではなかった
  rationale: 前半との明確な比較と対照を、自然な日本語の述語表現で保持した。
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: 彼らの律法学者たち
  rationale: γραμματεῖςはこの文脈で律法に通じた公的教師を指すため、現代の読者に意味が伝わる「律法学者」とした。αὐτῶνは本文に従い「彼らの」と明示した。
theological_decisions:
- issue: イエスの教えにおける権威の性質
  choice: 教え方の比較として「権威を持つ者のように」と記述する。
  alternative: 「神の権威によって」と明示する、または「自信をもって」と弱める。
  rationale: 本文はイエスの権威を現実のものとして律法学者たちと対比するが、その権威の究極的根拠まではこの節自体で説明していないため、神学的緊張を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。説明を表すγάρを「というのも…からである」で表し、逐語性と日本語としての自然さを両立させた。「律法学者」は一般読者にも役割が伝わりやすい定着した聖書語彙として用いた。
