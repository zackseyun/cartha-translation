  naturalness: 原文案の「というのも、…からである」は説明標識が重なり、やや回りくどい。また「権威を持つ者のように」より「権威を持つ者として」の方が、現代標準日本語として自然で、文脈上の対比も明瞭である。
  terminology: 「権威」「律法学者」は適切である。「彼らの」はαὐτῶνを保持し、聞き手側に属する公的な宗教的教師を指すという文脈上の含みを保つ。イエスへの敬意を表す「おられた」も日本語の聖書翻訳の標準的な文体として許容される。
