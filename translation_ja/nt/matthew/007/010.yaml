  rationale: ἢ καὶ は前節の例に続く選択的な第二例として「あるいは」で表した。αἰτήσει の暗黙の求め手は、日本語の条件表現として「魚を求める人がいれば」と自然に表し、αὐτῷ は「その人に」と本文に保持した。μὴ による否定回答を予期する問いは「まさか…でしょうか」で明瞭に再現した。本文で受け手を明示したため、代名詞省略を説明する脚注は不要である。
