  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: ja
  text: あるいは、魚を求める人がいれば、まさかその人に蛇を与えるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: また、…なら
  rationale: 直前のパンの例に続く第二の例を導く。καίを不自然に逐語化せず、ἤの選択的なつながりを現代日本語で自然に示した。
- source_word: ἰχθὺν
  choice: 魚を
  rationale: 対格単数で、家庭の食物を扱う文脈における通常の意味をそのまま表した。
- source_word: αἰτήσει
  choice: 求めるなら
  rationale: 未来直説法だが、一般的な仮定の例として自然な日本語の条件表現にした。依頼して食物を求める意味を簡潔に伝える。
- source_word: μὴ
  choice: …でしょうか
  rationale: 否定の答えを予期する修辞疑問であることを、文脈上明らかな日本語の疑問形で表した。
- source_word: ὄφιν
  choice: 蛇を
  rationale: ὄφιςの一般的な動物名。現代日本語では「蛇」が自然で、「大蛇」など原文にない含意を加えない。
- source_word: ἐπιδώσει
  choice: 与える
  rationale: この父子の比喩では、物を相手に与えるという通常の意味であり、簡潔で格調を保つ「与える」が適切。
- source_word: αὐτῷ
  choice: （文脈上省略）
  rationale: 受け手は魚を求めた子であることが直前の文脈から明白で、日本語では代名詞を置かない方が自然である。意味は条件節と主節の対応によって保持される。
theological_decisions:
- issue: 修辞疑問の力
  choice: 「蛇を与えるでしょうか」とし、否定の答えを期待する問いとして訳す
  alternative: 「蛇を与えることはない」と平叙文にする／「まさか蛇を与えはしないでしょう」と期待される答えを明示する
  rationale: μήで始まる疑問は否定の答えを予期する。疑問形を保つことで、周辺文脈における小から大への論証の修辞的な力を保持しつつ、「まさか」など原文以上の強調は加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「魚」「蛇」は日常的な語を用い、修辞疑問を簡潔に保った。SBLGNTの区切りは日本語では読点で自然に処理した。
