  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: ja
  text: また、あなたがたのうち、自分の息子にパンを求められたとき、石を与える人がいるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: また
  rationale: 前の問いに続けて別の身近な例を提示する接続語として、現代日本語で自然な「また」とした。
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: あなたがたのうち……人がいるでしょうか
  rationale: 直訳的な語順を避けつつ、聞き手の中にそのような人がいるかを問う修辞疑問として表した。日本語の「人」はここで代表的な意味を自然に保つ。
- source_word: ὁ υἱὸς αὐτοῦ
  choice: 息子が
  rationale: 原文が明示する親子関係と男性名詞の具体性を保ち、「子ども」へ一般化しなかった。所有関係は文脈上明らかなため、日本語では不自然な「彼の」を置かなかった。
- source_word: αἰτήσει ... ἄρτον
  choice: パンを求める
  rationale: 未来形は一般的・仮定的な場面を描いており、日本語では非過去形が自然である。「求める」は食べ物を頼む意味を簡潔に伝える。
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: 石を与える……でしょうか
  rationale: μήが否定の答えを予期する修辞疑問であることを、「いるでしょうか」という問い全体で自然に示した。与える相手は息子であることが明白なので反復しなかった。
theological_decisions:
- issue: 代表的な意味で用いられたἄνθρωπος
  choice: 人
  alternative: 男
  rationale: ἄνθρωποςはこの文脈では聞き手の中の親を代表的に指す。日本語の「人」は性別を意図的に消す言い換えではなく、この語の広い指示範囲を自然に表す。一方、原文で具体的な「息子」はそのまま保持した。
- issue: 否定を予期する修辞疑問
  choice: 石を与える人がいるでしょうか
  alternative: 石を与えたりするでしょうか。いや、しません
  rationale: 原文の修辞的な力と含みを保ち、説明的な答えを本文に加えなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、説教調や過度に文語的な表現を避けた。親が息子の願いに反して石を与えるはずがないという対比が一読で伝わる語順にした。
