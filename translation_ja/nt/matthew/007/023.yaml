  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: ja
  text: その時、わたしは彼らに明言する。[a]「わたしはあなたがたを一度も知らなかった。わたしから去れ、不法を行う者たちよ。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「公然と宣言する」「はっきりと言う」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「悪を行う者たち」「不義を働く者たち」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: その時
  rationale: 前の文脈に続く時間的な展開を、自然で簡潔な日本語で示す。「そしてその時」も可能だが、ここでは接続を文脈に委ねた。
- source_word: ὁμολογήσω
  choice: はっきりと言う
  rationale: 終末的・裁きの場面で、公然と明言する意味を表す。「告白する」では日本語で罪の告白と誤解されやすいため避けた。未来の意味は文脈と「その時」によって明確である。
- source_word: Οὐδέποτε
  choice: 一度も…なかった
  rationale: 過去形の動詞と組み合わせ、いかなる時にもなかったという絶対的否定を自然な現代日本語で表した。
- source_word: ἔγνων
  choice: 知らなかった
  rationale: 単なる情報上の認知だけでなく関係的な認知も含み得る原語の幅を保つため、説明的な「認めなかった」や「受け入れなかった」に置き換えなかった。
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: わたしから離れ去れ
  rationale: 退去を命じる厳粛な命令を、現代日本語として理解でき、かつ場面の重みを保つ表現にした。
- source_word: οἱ ἐργαζόμενοι
  choice: 行う者たち
  rationale: 分詞が示す特徴的・継続的な行為を、名詞句として自然に表した。
- source_word: τὴν ἀνομίαν
  choice: 不法
  rationale: 法や正しい秩序への背反という語の道徳的・法的含意を保つ。「悪」では広すぎ、「不義」では別のギリシア語との区別が薄れる。
theological_decisions:
- issue: 「わたしはあなたがたを一度も知らなかった」の意味
  choice: 関係的・裁判的な含みを残したまま「知らなかった」と訳した。
  alternative: 「一度も認めなかった」「あなたがたは決してわたしのものではなかった」
  rationale: 原文は直接に「知る」という語を用いており、承認、所属、救いの状態について教義的に言い換えると、本文が明示しない解釈を固定してしまうため。
- issue: ἀνομίαの意味
  choice: 「不法」とした。
  alternative: 「不義」「悪」「悪事」
  rationale: 神の法や正しい秩序への背反という原語の力を保ちつつ、特定の教派的な救済論・聖化論を持ち込まないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、裁きの宣告にふさわしい厳粛さを保った。「離れ去れ」はやや格調があるが、古語ではなく、命令の強さを自然に伝える。脚注標識は対応箇所に置き、[a]は宣言表現、[b]はἀνομίαを含む句の訳語の幅を示す。
