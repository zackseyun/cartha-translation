id: MAT.7.18
reference: Matthew 7:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: ja
  text: 良い木が悪い実を結ぶことはできず、腐った木が良い実を結ぶこともできない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: 良い木
  rationale: ἀγαθόςの基本的な評価語としての意味を保ち、木の健全さだけに限定せず、実によって性質が明らかになる比喩の広がりを残す。
- source_word: οὐ δύναται ... ποιεῖν
  choice: 実を結ぶことはできない
  rationale: δύναταιの表す能力上の不可能を「できない」で明確にし、ποιεῖνとκαρπούςの組み合わせは日本語の自然な果樹表現「実を結ぶ」で訳す。
- source_word: καρποὺς πονηρούς
  choice: 悪い実
  rationale: πονηρόςの否定的な質と道徳的含意の双方を保てる広い表現であり、比喩を不必要に「邪悪な」と抽象化しない。
- source_word: οὐδέ
  choice: …もできない
  rationale: 第二節も第一節と並行する否定として結び、均衡の取れた対照を自然な日本語で示す。
- source_word: δένδρον σαπρόν
  choice: 腐った木
  rationale: σαπρόςの腐敗・朽廃の鮮明な像を直接保ち、単に「悪い木」としてἀγαθόςとの一般的な対語に平板化しない。
- source_word: καρποὺς καλούς
  choice: 良い実
  rationale: καλόςがここで表す質の良さを自然に示し、「悪い実」と明瞭に対照させる。
theological_decisions:
- issue: 比喩における不可能性の強さ
  choice: 「できない」と断定的な不可能性として訳す。
  alternative: 「普通は結ばない」「結ぶべきではない」
  rationale: οὐ δύναταιは単なる傾向や規範ではなく能力上の不可能を述べる。この強さを保ちつつ、比喩を越えた教理的結論は訳文に付加しない。
translation_notes:
  register: 現代の一般読者に明快でありながら、格調を損なわない簡潔な文体。「実を結ぶ」は果樹の描写として自然で、文脈上の比喩性も保つ。原文に訳注を要するほどの本文異同や不可避の曖昧さはないため、脚注は付さない。
