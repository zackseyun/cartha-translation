  naturalness: 「良い木が悪い実を結ぶことはできず、腐った木が良い実を結ぶこともできない。」は明快で自然な現代標準日本語であり、「実を結ぶ」はこの文脈で適切かつ慣用的である。
  terminology: 「腐った木」はσαπρόνの腐敗・朽廃のイメージをよく伝え、「悪い木」と平板化していない。「悪い実」はπονηρούςの広い否定的評価を保ち、文脈を超えて「邪悪な」と限定しない。重要語の対照と反復も一貫している。
