  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: ja
  text: イエスがこれらのことば[a]を語り終えると、群衆はその教えに大いに驚いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これらの発言」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: すると
  rationale: 談話の終結と次の場面への移行を示す物語上の定型表現。ギリシア語の逐語的な重なりを不自然に再現せず、現代日本語で自然な接続として表した。
- source_word: ἐτέλεσεν
  choice: 語り終える
  rationale: 直前の一連の発言を完結したことを示す。目的語が「ことば」であるため、「終える」だけでなく「語り終える」とするのが自然である。
- source_word: τοὺς λόγους τούτους
  choice: これらのことば
  rationale: λόγοι の複数形と τούτους の指示性を保ち、直前の教え全体を、原文にない「説教」などの名称を加えずに指す。
- source_word: ἐξεπλήσσοντο
  choice: 驚いていた
  rationale: 強い驚きを表す動詞を平明に訳し、未完了過去が描く群衆の持続的・集団的な反応を「ていた」で表した。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語では集合名詞「群衆」が自然であり、複数の人々の集まりを十分に表す。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: その教えに
  rationale: 驚きの対象・契機を表す ἐπί＋与格を、簡潔で自然な日本語として訳した。
theological_decisions:
- issue: 「これらのことば」が指す範囲
  choice: 直前までのイエスの発言を指す表現として「これらのことば」とした。
  alternative: 「これらの教え」「この説教」
  rationale: 原文は λόγοι であり、直前の談話を指すが、「説教」という後代の区分名や、意味を教えに限定する語を本文へ持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の移行句は日本語として自然な「すると」とし、原文の未完了過去は「驚いていた」で表現した。表記は本文で柔らかく読める「ことば」を採用した。
