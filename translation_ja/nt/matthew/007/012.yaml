source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: ja
  text: ですから、人々[a]にしてほしいとあなたがたが望むことは何でも、あなたがたも人々に同じようにしなさい。これが律法と預言者だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人々」は、ギリシア語では男性複数形ですが、ここでは性別を問わず人間一般を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: ですから、何事でも、…ことは
  rationale: οὖνの推論・結論のつながりを「ですから」で示し、Πάνταとὅσαの包括的な範囲を「何事でも」で自然に表した。
- source_word: ἐὰν θέλητε
  choice: 望む
  rationale: ἐάνを伴う一般的・不定的な条件の中で、θέλωの意志や願いを簡潔に表す。文脈上、一時的な欲求に狭めないため「欲しい」ではなく「望む」とした。
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: 人々にしてもらいたい
  rationale: θέλητεに続くἵνα＋接続法が望まれる行為を表すことを、日本語の「してもらいたい」で自然に示した。οἱ ἄνθρωποιは男性に限定せず「人々」とした。
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: あなたがたも同じように人々にしなさい
  rationale: οὕτως καίの対応・相互性を「も同じように」で表し、現在命令形ποιεῖτεを継続的な行動を求める命令として「しなさい」と訳した。αὐτοῖςの指示対象は日本語で明確になるよう「人々」と反復した。
- source_word: οὗτος γάρ ἐστιν
  choice: これが…だからです
  rationale: γάρの理由説明を文末の「だからです」で示し、οὗτοςとἐστινの端的な同定を「これが…です」と保持した。
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: 律法と預言者
  rationale: ユダヤ教聖書を指す定着した要約表現を意訳せず保持し、本文の間テクスト的・神学的な響きを残した。
theological_decisions:
- issue: οἱ ἄνθρωποιの包括性
  choice: 人々
  alternative: 男たち／他の人々
  rationale: ここでは男性だけでなく、人間関係全般に及ぶ倫理的教えであるため、文法上の男性複数形を性別限定的に訳さない。
- issue: 「律法と預言者」の意味範囲
  choice: 聖書を要約する定型句として「律法と預言者」を保持
  alternative: 聖書全体の倫理的教え／律法と預言者の教えの本質
  rationale: 原文のマタイ的・ユダヤ的な定型表現を説明的な言い換えにせず、倫理的要約と聖書区分への言及が重なる余地を保った。
- issue: οὗτος…ἐστινの同定表現
  choice: これが律法と預言者
  alternative: これが律法と預言者の教えの要点である
  rationale: 「要点」などを補うと解釈を狭めるため、原文の簡潔で強い同定表現を維持した。
translation_notes:
  register: 現代の一般読者に明瞭な丁寧体を用いながら、命令は「しなさい」として教えの直接性と格調を保った。「律法と預言者」は定着した聖書用語としてそのまま残した。
