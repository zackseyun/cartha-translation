id: MAT.7.11
reference: Matthew 7:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: ja
  text: ですから、悪い者であるあなたがたでさえ、自分の子どもたちに良い贈り物を与えることを知っているなら、天におられるあなたがたの父[a]は、どれほどなおさら、父に求める人たちに良いもの[b]を与えてくださるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「もろもろの天におられるあなたがたの父」。ギリシア語の「天」は複数形です。
    reason: lexical_alternative
  - marker: b
    text: ここでギリシア語は「良い贈り物」ではなく、単に「良いもの」としています。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν
  choice: それなら
  rationale: 直前の比較を受ける推論を、現代日本語で自然に示す。条件文の形を保ちながら、οὖνの結論的な働きも表す。
- source_word: ὑμεῖς πονηροὶ ὄντες
  choice: あなたがたは悪い者でありながら
  rationale: 分詞句の譲歩的な力を「ながら」で表し、「悪い者」とすることで本文の厳しい人間評価を弱めず、特定の教理体系へも拡張しない。
- source_word: οἴδατε … διδόναι
  choice: 与えることを知っています
  rationale: 実際に与える心得があるという意味を表す。日本語では「与え方を知っている」も可能だが、原文の不定詞構造に近い表現を選んだ。
- source_word: δόματα ἀγαθὰ
  choice: 良い贈り物
  rationale: δόματαを「贈り物」と明示し、ἀγαθὰをその修飾語として訳す。
- source_word: τοῖς τέκνοις ὑμῶν
  choice: 自分の子どもたちに
  rationale: τέκναは性別を限定しない。「自分の」を用いて日本語の所有関係を自然にした。
- source_word: πόσῳ μᾶλλον
  choice: まして…なおさら
  rationale: 小から大への論証を明確にする日本語の定型表現。重みのある対比を保つ。
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: 天におられるあなたがたの父
  rationale: 父と天におられるという限定を分けて表す。ギリシア語の複数形は、日本語では数を明示しない「天」が最も自然なため、脚注で示す。
- source_word: δώσει ἀγαθὰ
  choice: 良いものを与えてくださるでしょう
  rationale: 二つ目のἀγαθὰは名詞を伴わないため「良いもの」とし、最初の「贈り物」を補わない。未来形は「でしょう」で、修辞的比較の確信を自然に表した。敬語は神である父を指す日本語として自然である。
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: ご自分に求める人たちに
  rationale: 現在分詞の一般的・継続的な性格を「求める人たち」で表し、αὐτόνの指示対象が父であることを「ご自分」で保つ。
theological_decisions:
- issue: 「悪い者でありながら」が示す人間観
  choice: 直接的な「悪い者」を保つ
  alternative: 「罪深い者」「欠点のある者」
  rationale: イエスの比較に含まれる厳しい評価を弱めず、同時に、この一節だけで特定の人間論を詳述しない。
- issue: 「天におられる」の数
  choice: 本文では自然な日本語の「天」とし、複数形を脚注で明示する
  alternative: 「もろもろの天におられる」「天上の」
  rationale: ギリシア語の複数形を隠さず注記しつつ、本文を不自然または古風にしない。「天上の」のような形容語への置換も避ける。
- issue: 第二節のἀγαθὰ
  choice: 「良いもの」と訳す
  alternative: 「良い贈り物」
  rationale: 原文は第二節でδόματαを繰り返していないため、最初の節から「贈り物」を補って調和させない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの教えにふさわしい丁寧で格調ある調子とした。聞き手への言及には「あなたがた」、神である父の行為には自然な尊敬表現「与えてくださる」を用いた。
