  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: ja
  text: '雨が降り、川[a]が押し寄せ、風が吹き、これらがその家に打ちつけた[b]。家は倒れなかった。岩の上に土台が据えられていたからである。


    [a] 「洪水」または「川の水」とも訳せる。ギリシア語は直訳すると「川」。


    [b] 「その家に襲いかかった」または「その家にぶつかった」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「洪水」または「川の水」とも訳せる。ギリシア語は直訳すると「川」。
    reason: lexical_alternative
  - marker: b
    text: 「その家に襲いかかった」または「その家にぶつかった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: 雨が降り
  rationale: καταβαίνωの下降の意味は、日本語では雨について自然な表現である「降る」に含まれる。
- source_word: οἱ ποταμοί
  choice: 川
  rationale: ποταμοίの基本義を保った。嵐の文脈では増水して押し寄せる川の流れを表すため、「洪水」「川の水」という文脈的な訳も脚注に示した。
- source_word: ἦλθον
  choice: 押し寄せ
  rationale: 直訳の「来た」では日本語として不自然なため、家を脅かす増水した流れが迫る様子を文脈に即して表した。
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: 風が吹いて
  rationale: 原文の通常の意味と節の連続した叙述を自然な日本語で保った。
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: その家に打ちつけた
  rationale: προσπίπτωの「ぶつかる、襲いかかる」という意味を嵐の文脈に合う自然な表現にした。反復性を文法的に断定しないよう、「打ちつづけた」とはしなかった。
- source_word: οὐκ ἔπεσεν
  choice: 家は倒れなかった
  rationale: 建物について自然であり、原文の「落ちる、倒れる」の意味を保つ。「崩壊しなかった」よりも解釈を加えない。
- source_word: τεθεμελίωτο
  choice: 土台が据えられていた
  rationale: 過去完了受動が示す、嵐より前に基礎が据えられ、その状態にあったことを表した。
- source_word: ἐπὶ τὴν πέτραν
  choice: 岩の上に
  rationale: πέτραを通常どおり「岩」とし、「岩盤」など原文より具体的な語を避けた。
theological_decisions:
- issue: たとえにおける土台の比喩
  choice: 岩の上に
  alternative: 岩盤の上に
  rationale: この節自体は「岩」が何を指すかを明示していないため、比喩をそのまま保ち、特定の神学的同定を訳文に持ち込まなかった。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、たとえの荘重さと短い並列構造を保った。「それでも」により、激しい自然現象と家が倒れなかったことの対照を自然に示した。
