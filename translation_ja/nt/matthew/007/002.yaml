  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: ja
  text: あなたがたがどのような裁きで裁くか、その裁きによって、あなたがたも裁かれ、どのような量りで量るか、その量りによって、あなたがたにも量られるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: 裁き／裁く／裁かれる
  rationale: 同語根による反復と相互対応を日本語でも保つ。「罪に定める」では意味を限定しすぎるため、より広い「裁く」を選んだ。
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: 量り／量る／量られる
  rationale: 名詞と動詞の語の響きを保ち、この言葉の格言的な並行構造を明確にする。「基準」だけでは原文の比喩と語遊びが弱まる。
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: その…によって／その…によって
  rationale: 手段または基準を示す反復表現として訳し、二つの節の並行性を保った。
- source_word: γὰρ
  choice: からです
  rationale: 直前の命令を根拠づける説明の接続を、自然な日本語の文末表現で示した。
- source_word: μετρηθήσεται ὑμῖν
  choice: あなたがたにも量られる
  rationale: 受動形と与格をできるだけ保ち、原文に明示されない「返して」や行為者を本文に補わないようにした。
theological_decisions:
- issue: 相応する裁きの行為者
  choice: 受動表現のまま行為者を明示しない
  alternative: 神が同じ基準で裁く／人々から同じ基準で裁かれる
  rationale: 原文の受動形は行為者を明記していないため、神の裁きだけとも人間同士の応報だけとも限定せず、解釈上の余地を保った。
translation_notes:
  register: 明瞭で格調ある現代標準語を用いた。「裁き／裁く／裁かれる」と「量り／量る／量られる」の反復により、原文の並行構造と警告の鋭さを保っている。
