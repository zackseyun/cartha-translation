source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: ja
  text: 雨が降り、川の水が押し寄せ[a]、風が吹いてその家に打ちつけた。そして、その家は倒れ、その倒壊はひどいものだった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「川々が来て」。ここでは、増水した川や洪水の水が押し寄せる様子を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: 雨が降り
  rationale: καταβαίνωの下降の動きは、日本語では雨について自然な「降る」に含まれるため、簡潔で慣用的に訳した。
- source_word: ἦλθον οἱ ποταμοί
  choice: 川の水が押し寄せ
  rationale: ποταμοίは字義的には複数の「川」だが、嵐の文脈では増水して押し寄せる水を表す。「川々が来た」という不自然さを避けつつ、洪水と断定しすぎない表現にした。
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: 風が吹いて
  rationale: 複数形ἄνεμοιを日本語で自然な集合的単数の「風」とし、πνέωを「吹く」と直接的に訳した。
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: その家に打ちつけた
  rationale: ここでのπροσκόπτωは「つまずく」ではなく、風が家に衝突する意味。「打ちつける」により強い反復的な衝撃を自然に表した。
- source_word: ἔπεσεν
  choice: 家は倒れ
  rationale: πίπτωの基本義「倒れる」を保ち、「倒壊した」のような説明的な語への置き換えを避けた。
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: その崩れ方はひどかった
  rationale: πτῶσιςが示す倒壊の結果とμεγάληの甚大さを、現代日本語として自然かつ強く表した。終末的裁きなどの解釈は付加していない。
theological_decisions:
- issue: たとえの結末における滅び・裁きのイメージの強さ
  choice: その崩れ方はひどかった
  alternative: その倒壊は壊滅的だった
  rationale: 原文は家の倒れ方が「大きかった」と述べるにとどまるため、警告の厳しさは保ちつつ、終末的裁きなどを明示的に付加しない。
translation_notes:
  register: 明快な現代標準日本語。嵐の動きを短い節で重ね、原文の連続的なリズムを保った。「甚大」「壊滅的」などの硬すぎる語を避け、一般の読者に分かりやすく、なお品位のある文体とした。
