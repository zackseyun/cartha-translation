  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: ja
  text: ですから[a]、あなたがたはその実によって彼らを見分けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「したがって、まさにその実から、あなたがたは彼らを知ることになります。」
    reason: ἄρα γεの強調と、ἀπὸおよびἐπιγινώσκωのより字義的な訳を示すため。
lexical_decisions:
- source_word: ἄρα γε
  choice: ですから
  rationale: 推論を受けて結論を示す表現。γεの軽い強調も含め、文脈上の帰結を自然で明瞭な現代日本語で表した。
- source_word: ἀπὸ
  choice: によって
  rationale: ここでは、見分ける根拠・手がかりを示す。日本語では「その実によって」が自然である。
- source_word: καρπῶν
  choice: 実
  rationale: ギリシア語は複数形だが、日本語の集合的な「実」は数を不自然に明示せず比喩を保てる。「行い」「結果」と説明的に置き換えなかった。
- source_word: αὐτῶν
  choice: その
  rationale: 「彼らの実」という所属関係を、直前の対象を受ける自然な日本語で示した。
- source_word: ἐπιγνώσεσθε
  choice: 見分けます
  rationale: 未来形で、観察できる証拠から人々の正体を識別する意味。「知ります」より文脈に即している。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 直前から論じられている人々を指す目的語として明示した。
theological_decisions:
- issue: 人を評価する際の「実」の比喩
  choice: 「実」という比喩を本文に保持する
  alternative: 「行い」「結果」と解釈して訳す
  rationale: 観察可能な行いや結果を指しうるが、原文自体は実の比喩を用いる。直前の文脈とのつながりと解釈上の幅を保つため、説明的に限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「あなたがた」で二人称複数を保持し、「見分けます」で文脈上の識別の意味を自然に表した。
