source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: ja
  text: 狭い門から入りなさい。門は広く、滅びに至る道は広々としており[a]、その門から入る人が多いからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その道はゆったりとしており」。ギリシア語は、幅が広いことや、ゆとりがあることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: 入りなさい
  rationale: アオリスト能動命令法二人称複数の直接的な命令を、自然で明確な現代日本語で表す。
- source_word: διὰ τῆς στενῆς πύλης
  choice: 狭い門から
  rationale: 属格を伴うδιάは通過を表す。日本語では門を通過して入ることを「門から入る」と自然に表現できる。
- source_word: ὅτι
  choice: からです
  rationale: 先行する命令の理由を示す接続関係を、文末の理由表現で明確にする。
- source_word: πλατεῖα ἡ πύλη
  choice: 門は広く
  rationale: πλατύςの空間的対比を「広い」で表し、「狭い門」との対照を保つ。
- source_word: εὐρύχωρος ἡ ὁδός
  choice: その道は広々としており
  rationale: εὐρύχωροςの「広い、ゆったりした」という含みを自然な日本語で表し、門の広さとは語感を分ける。
- source_word: ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν
  choice: 滅びに至る
  rationale: 道がある終着点へ導くという比喩を簡潔に保つ。ἀπώλειαは意味を過度に教理化せず「滅び」とする。
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: そこから入る人が多い
  rationale: 「多い」を述語として自然な日本語にし、女性形αὐτῆςの指示対象を明示せず、原文に残る形式上の照応を「そこ」で保つ。文脈上は門を指すのが自然である。
theological_decisions:
- issue: ἀπώλειαが指す終局の性質
  choice: 滅び
  alternative: 破滅／滅亡
  rationale: 警告の重大さを伝えつつ、その終局の神学的性質を本文以上に限定しない。
- issue: δι’ αὐτῆςの指示対象
  choice: そこから
  alternative: その門から
  rationale: 文脈上は女性名詞πύλη（門）を指すのが最も自然だが、訳文に「門」を補って明示せず、代名詞的な表現を保つ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。命令の直接性と、狭い門／広い門および道の対比を維持した。「広々としており」は肯定的にも響き得るが、原語εὐρύχωροςの空間的な含みを保持し、結末の「滅び」によって警告の文脈を明確にした。
