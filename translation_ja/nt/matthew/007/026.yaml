  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: ja
  text: また、わたしのこれらのことばを聞いても、それを行わない人は皆、砂の上に自分の家を建てた[b]愚かな人[a]にたとえられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「愚かな男」。ギリシア語では男性を表す語が、ここでは代表的な比較に用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「自分の家を」については、写本間に異読がある。
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: 聞いても……行わない人は皆
  rationale: 冠詞付き現在分詞の一般的・包括的な意味を「人は皆」で表した。「聞いても」は後続の否定「行わない」との対照を自然な日本語で明確にする。
- source_word: μου τοὺς λόγους τούτους
  choice: わたしのこれらのことば
  rationale: 指示語と所有関係をともに保った。「ことば」は λόγοι の平明で文脈に適した訳である。
- source_word: μὴ ποιῶν αὐτούς
  choice: それを行わない
  rationale: ποιέω の「実行する」という意味を保ち、直前の複数の「ことば」は日本語では集合的に単数代名詞「それ」で自然に受けた。
- source_word: ὁμοιωθήσεται
  choice: たとえられる
  rationale: 未来受動形の比較・類比の機能を保つ。日本語では文脈上、未来性を明示しなくても一般的な帰結として自然に伝わる。
- source_word: ἀνδρὶ μωρῷ
  choice: 愚かな人
  rationale: ἀνήρ は男性を指し得るが、ここでは一般の聞き手を代表する比較であり、日本語の「人」は自然に包括的である。性別情報を明示する必要があるため注を付した。
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: 自分の家を建てた
  rationale: οἰκία の建物としての意味を「家」で表し、再帰的な所有関係を自然な日本語の「自分の」で示した。
- source_word: ἐπὶ τὴν ἄμμον
  choice: 砂の上に
  rationale: 建築の場所・土台を示す比喩を、簡潔で自然な日本語で保持した。
theological_decisions:
- issue: 比較における男性形の代表的用法
  choice: 本文では「愚かな人」とし、注でギリシア語が男性を表す語を用いることを示す
  alternative: 「愚かな男」
  rationale: ἀνδρί は字義上「男」だが、比較の適用範囲は冒頭の「皆」に及ぶ。現代日本語では「愚かな男」とすると対象が男性に限定される印象が強いため、代表的意味を本文で自然に示し、原文の性別情報は注で保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「ことば」は聖書文体として不自然に古くならず、発言内容を指す語として用いた。前節との対照が伝わるよう、聞くことと行わないことの関係を「聞いても」で表現した。
