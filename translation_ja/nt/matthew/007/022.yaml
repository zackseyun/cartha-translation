id: MAT.7.22
reference: Matthew 7:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: ja
  text: その日には、多くの者が私に言うだろう。『主よ、主よ。私たちは、あなたの名によって預言し、あなたの名によって悪霊を追い出し、あなたの名によって多くの力あるわざ[a]を行ったではありませんか。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「多くの奇跡」または「多くの力のわざ」。ギリシア語では文字どおり「多くの力」を意味し、福音書ではしばしば奇跡的な行為を指す。
    reason: δυνάμεις πολλὰςの語義の幅と、福音書における用法を示すため。
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの者
  rationale: 男性複数形の形容詞が名詞的に用いられているため、人を指すことを自然な日本語で明示した。
- source_word: ἐροῦσίν μοι
  choice: 私に言うだろう
  rationale: λέγωの未来形と与格代名詞を直接的に訳し、未来の出来事としての語調を保った。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日には
  rationale: 終末的含意を持つ表現だが、本文が明示する以上に「裁きの日」と説明せず、そのまま保った。
- source_word: Κύριε κύριε
  choice: 主よ、主よ
  rationale: 呼格の反復による切迫した訴えを保ち、κύριοςの称号としての重みも伝えた。
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: 私たちは……預言し……行ったではありませんか
  rationale: 肯定の答えを期待する否定疑問を、日本語では列挙全体を受ける文末の「ではありませんか」で自然に表した。
- source_word: τῷ σῷ ὀνόματι
  choice: あなたの名によって
  rationale: その名を権威または根拠として行う意味を表し、原文どおり三度の反復を保った。
- source_word: δαιμόνια ἐξεβάλομεν
  choice: 悪霊を追い出し
  rationale: 福音書におけるἐκβάλλωとδαιμόνιαの定型的な意味を、明瞭で一般的な日本語にした。
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: 多くの力あるわざを行った
  rationale: δύναμιςの「力」と奇跡的行為の両面を保ち、「奇跡」とだけ限定しない訳を採用した。
theological_decisions:
- issue: イエスへの直接呼びかけにおけるκύριος
  choice: 主
  alternative: 先生／主人
  rationale: 称号の通常の意味とキリスト論的な重みの双方を保ちつつ、本文以上の説明を加えないため。
- issue: 「その日」の終末論的含意
  choice: その日
  alternative: 裁きの日
  rationale: 文脈上は最終的な裁きを指すが、原文自体は「その日」と述べるため、暗示を説明に置き換えなかった。
- issue: δυνάμειςの奇跡的意味
  choice: 力あるわざ
  alternative: 奇跡
  rationale: 福音書では奇跡的行為を指し得るが、語そのものが持つ「力」の意味を残し、脚注で自然な別訳を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接話法の荘重さと三度繰り返される「あなたの名によって」の修辞的な力を保った。否定疑問は日本語として自然になるよう文末で列挙全体を受けた。
