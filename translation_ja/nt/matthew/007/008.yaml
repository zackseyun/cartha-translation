  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ja
  text: なぜなら、求める人はだれでも受け取り、捜す人は見つけ、たたく人には開かれます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文には、何が「開かれる」のかは明記されていない。たたくという比喩から、扉や門が暗示されている。
    reason: 原文で省略されている受動文の主語と、比喩上暗示される内容を説明するため。
lexical_decisions:
- source_word: πᾶς
  choice: だれでも
  rationale: 定冠詞付き分詞とともに一般的・普遍的な範囲を示すため、現代日本語で自然な「だれでも」とした。
- source_word: γὰρ
  choice: からです
  rationale: 直前の勧めに対する理由・根拠を示す説明的な接続を、文末の「からです」で自然に表した。
- source_word: ὁ αἰτῶν
  choice: 求める者
  rationale: 実質的に名詞として働く現在分詞を「求める者」とし、一般的・継続的な行為の含みと三つの並行表現を保った。
- source_word: λαμβάνει
  choice: 受け
  rationale: λαμβάνωの基本的な意味を簡潔に表し、何を受けるかを本文で限定しなかった。
- source_word: ὁ ζητῶν
  choice: 捜す者
  rationale: αἰτέωの「求める」と区別しつつ、探し求める行為を簡潔に示した。
- source_word: εὑρίσκει
  choice: 見つけ
  rationale: 日常的で明瞭な対応語を用い、原文の簡潔な対句を保った。
- source_word: τῷ κρούοντι
  choice: たたく者には
  rationale: 与格を「には」で表し、受動態の動詞との関係と並行構造を自然な日本語で保った。何をたたくかは原文同様に明示しなかった。
- source_word: ἀνοιγήσεται
  choice: 開かれる
  rationale: 未来受動の約束を表しつつ、原文に明示されていない「戸」や「門」を本文に補わなかった。日本語では文脈上、未来の確実な成就を非過去形で自然に表せる。
theological_decisions:
- issue: 約束の範囲と効力
  choice: 求める者すべてに向けた一般的な確約として、原文の広い表現をそのまま保つ。
  alternative: 求めた個々の事柄が必ずそのまま与えられるという無条件の保証、または特定の霊的な願いだけに限定された約束として訳文で明示する。
  rationale: 原文の普遍的な言い方を狭めも絶対化もせず、文脈の中で解釈されるべき神学的緊張を訳文に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、原文の三つの並行表現と簡潔な格言調を保持した。「です」を用いて説明を示すγὰρを自然に受けつつ、過度に口語的にも古風にもならない端正な文体とした。
