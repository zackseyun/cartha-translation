id: MAT.7.21
reference: Matthew 7:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: ja
  text: わたしに『主よ、主よ』と言う者がみな、天の国[a]に入るわけではない。入るのは、天におられる[b]わたしの父の御心を行う者である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「諸天の国」で、「天」は複数形である。マタイは、他の箇所では「神の国」と呼ばれるものについて、この表現をしばしば用いる。
    reason: lexical_alternative
  - marker: b
    text: ここでもギリシア語の「天」は複数形だが、日本語では慣用的に「天に」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: わたしに…と言う者が皆…入るのではない
  rationale: οὐ πᾶς は全否定ではなく部分否定なので、「だれも入らない」ではなく「皆が入るのではない」とした。現在分詞は一般的・継続的な行為を自然な日本語の関係節で表した。
- source_word: Κύριε κύριε
  choice: 主よ、主よ
  rationale: κύριος の呼格を「主よ」とし、強調を伴う反復もそのまま残した。
- source_word: εἰσελεύσεται
  choice: 入る
  rationale: 未来形の意味は文脈上明瞭であり、日本語では「入る」とするのが自然である。後半ではギリシア語で省略されている述語を補い、「入るのは…者である」として対比を明確にした。
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: 天の国に
  rationale: βασιλεία を「国」、マタイ特有の複数形 τῶν οὐρανῶν を慣用的に「天の」と訳した。神の支配という含意を狭めない表現である。
- source_word: ἀλλ’ ὁ ποιῶν
  choice: 入るのは…行う者である
  rationale: 冠詞付き現在分詞を実質的な名詞句として訳し、前半の「言う者」と後半の「行う者」の対比を保った。
- source_word: τὸ θέλημα
  choice: みこころ
  rationale: 父の意志、望み、目的を含み得る θέλημα を、現代日本語で尊敬を込めつつ聖書文体として広く理解される「みこころ」とした。
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: 天におられるわたしの父
  rationale: 修飾関係を保ち、複数形 τοῖς οὐρανοῖς は日本語として自然な単数の「天」で表した。
theological_decisions:
- issue: 主への言葉による告白と、父のみこころを行うこととの関係
  choice: 単にイエスを「主」と呼ぶことと、父のみこころを実行することとの対比をそのまま示す。
  alternative: この一節だけで、行いによる義認、または言葉による告白だけで十分だという包括的な救済論を確定する。
  rationale: 本文は「言う」ことと「行う」ことを明確に対比するが、義認や救いの教理全体をここで詳述してはいないため、警告と神学的緊張を解消せずに残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な警告にふさわしい品位を保った。「入るのは…者である」という構文により、ギリシア語で後半に省略された述語を日本語では自然に明示した。
