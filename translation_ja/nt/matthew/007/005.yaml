id: MAT.7.5
reference: Matthew 7:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: ja
  text: 偽善者よ。まず自分の目から梁[a]を取り除きなさい。そうすれば、そのとき、兄弟の目から木くず[b]を取り除くために、はっきり見えるようになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「丸太」または「厚い板」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「小さなとげ」または「わらくず」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: 偽善者よ
  rationale: 単数呼格による鋭い直接の叱責を、現代日本語で明確に表す。
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: 取り除きなさい／取り除く
  rationale: 目にある異物を外へ出す比喩に自然であり、命令形と不定詞で同じ動詞を対応させた。
- source_word: πρῶτον
  choice: まず
  rationale: 行為の優先順位を簡潔で自然な日本語で示す。
- source_word: δοκόν
  choice: 梁
  rationale: 建物を支える大きな木材を指し、微小な κάρφος との誇張された対比を保つ。
- source_word: διαβλέψεις
  choice: はっきり見えるようになる
  rationale: διαβλέπω の、単に見るだけでなく明瞭に見るという強意を保つ。
- source_word: κάρφος
  choice: 木くず
  rationale: 小さな乾いた木片などを表す語として自然で、梁との大小の対比も伝わる。
- source_word: ἀδελφοῦ σου
  choice: 兄弟の
  rationale: 男性単数の関係語を保持し、共同体内の他者を指す表現として訳した。
theological_decisions:
- issue: ἀδελφοῦ の性別を含む共同体的呼称
  choice: 兄弟の
  alternative: 仲間の／ほかの人の
  rationale: 原文の男性単数を不必要に中性化せず、宗教的・倫理的共同体の中の関係を保つ。
- issue: διαβλέψεις ἐκβαλεῖν が明瞭な視覚を述べるか、除去する能力を含意するか
  choice: 取り除くために、はっきり見えるようになる
  alternative: はっきり見えて、取り除けるようになる
  rationale: 原文の目的・結果の関係にある程度の幅を残し、能力という解釈を訳文に強く付加しない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの叱責の厳しさと、梁と木くずによる誇張された比喩を保つ。原文の καὶ τότε は日本語として意味が伝わるよう「そうすれば、そのとき初めて」とした。
