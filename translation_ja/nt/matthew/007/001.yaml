  text: Do not judge[a], so that you may not be judged.
translation:
  language: ja
  text: 人を裁いてはいけません[a]。そうすれば、あなたがたも裁かれません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人を罪に定めてはいけません。そうすれば、あなたがたも罪に定められません」。ギリシア語の動詞は文脈によって「罪に定める」という意味にもなるが、「裁く」のほうが意味の幅が広く、この節にある同じ語の反復も保たれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: 人を裁いてはいけない
  rationale: μήを伴う現在命令形の禁止を、明瞭で自然な現代日本語にした。目的語は原文では明示されないが、日本語では「人を」を補うことで対人的な命令であることを自然に示す。
- source_word: κρίνετε / κριθῆτε
  choice: 裁いて / 裁かれ
  rationale: 同じ語根の能動形と受動形を同じ日本語の動詞で訳し、原文の反復と修辞的な釣り合いを保つ。「裁く」は評価から断罪まで含み得る広い表現で、意味を「罪に定める」に限定しない。
- source_word: ἵνα μὴ
  choice: ないためである
  rationale: ἵναと接続法が表す目的・結果の関係を簡潔に示す。文脈上の警告の力を保ちつつ、目的か結果かを必要以上に限定しない。
- source_word: κριθῆτε
  choice: あなたがたも裁かれ
  rationale: 二人称複数を「あなたがた」で明示し、受動態をそのまま保った。裁く主体は原文に明示されないため、訳文でも特定しない。
theological_decisions:
- issue: κρίνωが指す裁きの範囲
  choice: 広い「裁く」を本文に採用する。
  alternative: 「罪に定める」「非難する」と限定して訳す。
  rationale: この一節だけでは禁じられる裁きの全範囲は明示されず、直後の文脈によって具体化される。「裁く」とすることで、道徳的判断をすべて禁じるとも、最終的な断罪だけを禁じるとも訳文で決めつけず、原文の緊張を保つ。
- issue: 受動形 κριθῆτε の行為者
  choice: 「裁かれない」とし、行為者を明示しない。
  alternative: 「神に裁かれない」とする。
  rationale: 神の裁きを含意する可能性はあるが、文法上、行為者は明記されていない。訳文で「神に」を補わず、原文の含みを保存する。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「〜してはならない」より日常的に理解しやすい「〜してはいけない」を用い、後半は「ためである」で簡潔かつ荘重に整えた。
