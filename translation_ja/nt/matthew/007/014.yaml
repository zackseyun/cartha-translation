  naturalness: 「なぜなら、門は狭く、命に至る道は困難であり、それを見いだす人は少ないからです」は、現代標準日本語として自然で、簡潔な教えの文体を保つ。
  terminology: 「命」は、原文にない「永遠の」を補わず、適切である。「門」「道」「見いだす」も比喩の対応を保つ。「困難である」はτεθλιμμένηの圧迫され通りにくいという比喩的困難を、特定の教理的解釈を加えずに表す。
