id: MAT.7.14
reference: Matthew 7:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: ja
  text: なぜなら、門は狭く、命に至る道は困難であり、それを見いだす人は少ないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: 狭い
  rationale: 門の幅が狭いことを表す基本的な意味を、自然で明瞭な日本語で保持した。
- source_word: τεθλιμμένη
  choice: 険しい
  rationale: θλίβω の完了受動分詞で、圧迫され狭められた状態を字義的には表すが、ここでは通行の困難さを自然に伝える「険しい」とした。単に幅が狭いという前句との重複を避けつつ、困難という含意を保持する。
- source_word: ζωήν
  choice: 命
  rationale: マタイにおける終末論的・救済論的な「命」の含意を限定せず保持するため、「人生」や説明的な「永遠の命」ではなく「命」とした。
- source_word: εὑρίσκοντες
  choice: 見いだす
  rationale: 単なる偶然の発見とも意図的な探索とも断定せず、原語の幅を保てる表現とした。
theological_decisions:
- issue: 「命」の性質
  choice: 命
  alternative: 永遠の命
  rationale: 文脈上は終末的な命を指す可能性が高いが、この節自体には「永遠の」に相当する語がないため補わない。
- issue: 道の困難さの表現
  choice: 険しい
  alternative: 狭められている／苦しい
  rationale: τεθλιμμένη の圧迫・困難の比喩を自然な日本語で示しつつ、その困難が迫害、禁欲、功績など特定の教理的内容を意味すると限定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、山上の説教にふさわしい簡潔で格調ある文体。「門」と「道」の対句を保ち、不要な説明を加えなかった。
