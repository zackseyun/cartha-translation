  to: なぜなら、門は狭く、命に至る道は困難であり、それを見いだす人は少ないからです。
  rationale: 接続詞ὅτιを「なぜなら」として訳出し、「命に至る」の修飾先を原文どおり「道」に置いた。「険しい」を「困難であり」に改め、τεθλιμμένηが示す圧迫され通行しにくい状態の比喩的困難を、余計な限定なく明瞭に表した。
  reviewer_model: gpt-5.6-terra
