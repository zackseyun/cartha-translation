id: MAT.7.15
reference: Matthew 7:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: ja
  text: 偽預言者たちに用心しなさい。彼らは羊の皮をかぶってあなたがたのところに来ますが、内側では、貪欲な狼です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「貪欲な狼」は、他者を奪い取り、食い物にするような略奪的・捕食的な性質を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: ～に用心しなさい
  rationale: 現在命令形による継続的な警戒の呼びかけを、自然で明確な現代日本語にした。ἀπόはπροσέχωとともに警戒の対象を示す。
- source_word: ψευδοπροφητῶν
  choice: 偽預言者たち
  rationale: 預言者を装う者、または偽りを語る預言者を指す標準的で簡潔な訳語。後代の教派的分類には限定しない。
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: 彼らは……あなたがたのところに来ます
  rationale: 現在形による描写を保ち、警戒すべき者たちが聞き手に近づいて来ることを自然に表した。
- source_word: ἐν ἐνδύμασι προβάτων
  choice: 羊の衣をまとって
  rationale: 直訳的な比喩を保ちながら、日本語として理解しやすい表現にした。外見が羊のようであるという欺瞞を明確に伝える。
- source_word: ἔσωθεν δέ
  choice: しかし、その内側は
  rationale: 外見と内実との強い対照を保つため、δέを「しかし」、ἔσωθενを「その内側」と訳した。
- source_word: λύκοι ἅρπαγες
  choice: 貪欲な狼
  rationale: ἅρπαγεςが表す、奪い取り食い荒らす捕食的・破壊的性質を、日本語で定着した簡潔な比喩として表した。単なる空腹ではなく、他者を食い物にする性質を含む。
theological_decisions:
- issue: 偽預言者に対する警告の範囲
  choice: 外見と内実が異なる偽預言者への警告として、そのまま訳す
  alternative: 後代の意味での異端教師や特定の宗教制度上の指導者に限定する
  rationale: ギリシア語本文は偽預言者を警戒するよう命じ、羊と狼の比喩で欺瞞と危険を描いている。本文に明示されない後代の教派的・制度的区分を持ち込まない。
- issue: ἅρπαγεςの含意
  choice: 「貪欲な」とし、捕食的・略奪的な危険を保つ
  alternative: 「飢えた」または単に「凶暴な」とする
  rationale: 語は単なる飢餓よりも、奪い取り、食い物にする性質を表す。「貪欲な」は伝統的で理解しやすいが、意味範囲を脚注で補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「羊の衣」「狼」という原文の鮮明な比喩を維持しつつ、文脈にない教派的解釈は加えていない。
