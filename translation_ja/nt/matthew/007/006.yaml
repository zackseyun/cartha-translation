  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: ja
  text: 聖なるもの[a]を犬に与えてはいけません。また、あなたがたの真珠を豚の前に投げてはいけません。そうしないと、豚がそれを足で踏みつけ、向きを変えてあなたがたを引き裂くかもしれないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なるもの」は、神聖なもの、聖別されたもの全般を指し得る表現です。本文は、それが具体的に何であるかを限定していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: 聖なるもの
  rationale: 中性単数の形容詞が名詞的に用いられている。何を指すかを教えや供え物などに限定せず、原文の広い指示範囲を保つ。
- source_word: τοῖς κυσίν
  choice: 犬に
  rationale: 比喩の鋭さを和らげず、複数形の総称的な用法を自然な日本語で表した。
- source_word: βάλητε
  choice: 投げて
  rationale: βάλλωの具体的な動作を、現代日本語で自然かつ明瞭に表す。
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: あなたがたの真珠
  rationale: 複数の「真珠」と二人称複数の所有を保ち、比喩を解釈的に言い換えない。
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: 豚の前に
  rationale: 空間的な表現をそのまま自然な日本語に移し、伝統的な比喩を保持する。
- source_word: μήποτε
  choice: ことのないためです
  rationale: 後続する危険を避けるための警告として訳した。日本語では文末まで受ける形にして、二つの動作をともに含めた。
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: それを足で踏みつけ
  rationale: αὐτούςは文法上、男性複数の「真珠」を受ける。日本語では無生物の複数を自然に「それ」とし、ἐν τοῖς ποσὶν αὐτῶνを「足で」と表した。
- source_word: στραφέντες
  choice: 向き直って
  rationale: 先に真珠を踏みつけた豚が、その後、人のほうへ向きを変えるという動作の推移を明瞭にした。
- source_word: ῥήξωσιν ὑμᾶς
  choice: あなたがたを引き裂く
  rationale: ῥήγνυμιの暴力的な「裂く、引き裂く」という意味を保ち、単なる「襲う」へ弱めない。ὑμᾶςの複数性も明示した。
theological_decisions:
- issue: 「聖なるもの」「犬」「真珠」「豚」が具体的に何を指すか
  choice: 比喩を解釈せず、そのまま保持する。
  alternative: 「聖なるもの」や「真珠」を神の教え・福音とし、「犬」や「豚」をそれに敵対する人々と明示する。
  rationale: 本文自体は各比喩の対象を定義していない。特定の教理的適用に限定せず、原文の意図的な広がりと緊張を残す。
- issue: 踏みつけ、向き直り、引き裂く主体
  choice: 直前の「豚」を主体として明示する。
  alternative: 主体を省略して、犬と豚のどちらを指すかを日本語でも曖昧にする。
  rationale: ギリシア語では直前の複数名詞「豚」が、続く複数動詞の自然な主語である。日本語で主語を一度補うことで、原文の統語関係を明瞭にした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の厳粛さと比喩の強さを保持した。「〜してはなりません」より一般読者に自然な「〜してはいけません」を採用し、末尾は警告の目的を示す形でまとめた。
