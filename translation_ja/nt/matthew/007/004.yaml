  rationale: 接続詞を「それとも」に改めて原文の修辞的な論理展開を明確にし、許可を求める一人称の動作を「私に」により明示した。比喩の鮮烈さ、原文の語順に沿う「見なさい」、および「ちり／梁」の大小対比は維持した。
