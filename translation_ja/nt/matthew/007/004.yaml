  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: ja
  text: それとも、どうして自分の兄弟[a]に、『私にあなたの目からそのちり[b]を取り出させてください』と言うのでしょうか。見なさい、あなた自身の目には梁[c]があるのに。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」は、ここでは実の兄弟に限らず、代表的に仲間の人を指している可能性がある。
    reason: cultural_note
  - marker: b
    text: 「ちり」と訳したギリシア語は、小さな木くず、わらくずなど、乾いた物の小片を指し得る。
    reason: lexical_alternative
  - marker: c
    text: 「梁」は大きな建築用材。文脈上は「丸太」や「大材」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: また
  rationale: 直前の問いを受けて、議論をさらに進める接続語として、現代日本語で自然な「また」とした。
- source_word: πῶς ἐρεῖς
  choice: どうして……と言うのでしょうか
  rationale: 未来形を含む修辞的な問いの力を、日本語で不自然にならない形で表した。「どうして」は、そのように言うことの不合理さを示す。
- source_word: τῷ ἀδελφῷ σου
  choice: 自分の兄弟
  rationale: ἀδελφόςの男性単数を保ちつつ、ここでは実の兄弟に限定されず、仲間を指し得る語として訳した。範囲は脚注で明示した。
- source_word: Ἄφες ἐκβάλω
  choice: 取らせてください
  rationale: 許可を求める命令形と接続法の組み合わせを、「私に取ることを許してください」という意味の自然な日本語で表した。
- source_word: τὸ κάρφος
  choice: ちり
  rationale: 小さな乾いた物片を指す語であり、梁との極端な大小の対比を簡潔に伝える。「木くず」などの可能性は脚注に残した。
- source_word: καὶ ἰδοὺ
  choice: 見なさい
  rationale: 注意を強く促すἰδούの談話機能を、明瞭で品位のある現代日本語の命令表現で保った。
- source_word: ἡ δοκὸς
  choice: 梁
  rationale: 大きな構造材を指すδοκόςに最も直接対応し、「ちり」との誇張された対比も保つ。
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: あなた自身の目には……ある
  rationale: 位置を表すἐνを素直に訳し、文脈上の対照を「自身」で明確にした。
theological_decisions:
- issue: ἀδελφῷの性別と指示範囲
  choice: 兄弟
  alternative: 仲間／信仰の仲間／兄弟姉妹
  rationale: 原文は男性単数であるため本文では「兄弟」とした。ただし、代表的な単数として仲間の弟子を指す可能性を排除せず、脚注で示した。
- issue: κάρφοςとδοκόςの誇張された対比
  choice: ちり／梁
  alternative: 木くず／丸太、わらくず／大材
  rationale: イエスの比喩にある著しい大小の差を保ちながら、それぞれの語の意味範囲を過度に限定しない組み合わせを採用した。
- issue: 問いの終わりにある譲歩的な含み
  choice: 梁があるのに
  alternative: 梁があるではありませんか
  rationale: 原文の一つの修辞疑問全体が示す矛盾を自然な日本語で保つため「のに」としたが、話者の驚きや注意喚起は「見なさい」に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「見なさい」「梁」によって比喩の厳粛さと鮮烈さを保った。会話内の依頼は丁寧な「取らせてください」とし、修辞疑問全体は自然な「のに」で結んだ。
