id: MAT.7.19
reference: Matthew 7:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: ja
  text: 良い実を結ばない木はすべて切り倒され、火の中に投げ込まれる。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「良い実を生み出さない」。
    reason: lexical_alternative
  - marker: b
    text: 「火」は裁きの比喩。この節だけでは、現世の裁き、終末の裁き、またはその両方のどれに重点があるのかは、さらに限定されていない。
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: 木はすべて
  rationale: πᾶνと単数名詞の組み合わせを配分的に捉え、一本一本の木を指すことを自然な日本語で表した。
- source_word: μὴ ποιοῦν
  choice: 結ばない
  rationale: ποιέωは直訳すれば「生み出す」だが、日本語では木と実の関係を「実を結ぶ」と表すのが自然であり、現在分詞が示す特徴的・継続的な状態も簡潔に伝わる。
- source_word: καρπὸν καλὸν
  choice: 良い実
  rationale: καλόςの、良質でふさわしいという評価的・道徳的含意を、文脈に即して明瞭に保つ。
- source_word: ἐκκόπτεται
  choice: 切り倒され
  rationale: 木全体に対する伐採を表す受動態として、現代日本語で最も自然な表現を採用した。
- source_word: εἰς πῦρ βάλλεται
  choice: 火の中に投げ込まれる
  rationale: εἰςの方向性とβάλλεταιの受動態を明示しつつ、冠詞のないπῦρを過度に特定しない表現とした。
theological_decisions:
- issue: 火が表す裁きの範囲と時期
  choice: 木が火の中に投げ込まれるという裁きの比喩をそのまま保ち、火の厳密な指示対象は本文で特定しない。
  alternative: この火を現世的な裁き、終末の裁き、または地獄のいずれかに限定して訳す。
  rationale: この節は裁きの警告を明確に伝える一方、その時期や範囲を単独では厳密に規定していないため、特定の教理的解釈を本文へ持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「実を結ぶ」は日常的かつ聖書文脈にも自然な慣用表現であり、受動表現を連ねて原文の警告的な調子を維持した。
