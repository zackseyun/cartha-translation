  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ja
  text: 求めなさい[a]。あなたがたに与えられます。探しなさい。見つけます。たたきなさい。あなたがたに開かれます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の現在命令法は、継続の意味を込めて「求め続けなさい……探し続けなさい……たたき続けなさい」とも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: 求めなさい
  rationale: 現在能動命令法・二人称複数。祈りの文脈にも一般的な願いにも通じる自然で格調ある表現とした。継続の含みは脚注に示す。
- source_word: δοθήσεται ὑμῖν
  choice: あなたがたに与えられます
  rationale: 未来受動を保ち、与える主体を原文同様に明示しない。ὑμῖνは「あなたがたに」と明示した。
- source_word: ζητεῖτε
  choice: 捜しなさい
  rationale: 現在能動命令法。「探し求める」より簡潔で、後続の「見つかる」と自然に対応する。
- source_word: εὑρήσετε
  choice: 見つかります
  rationale: 未来能動形だが、日本語では主語を省いた自動詞表現が自然であり、聞き手が見いだすという意味を明瞭に伝える。
- source_word: κρούετε
  choice: たたきなさい
  rationale: 戸口をたたく動作を表す自然な命令表現。「門を」は原文にないため補わない。
- source_word: ἀνοιγήσεται ὑμῖν
  choice: あなたがたのために開かれます
  rationale: 未来受動を「開かれます」で保持し、動作主は明示しない。ὑμῖνはここでは受益の関係が自然に伝わるよう「あなたがたのために」とした。
- source_word: καὶ
  choice: そうすれば
  rationale: 各命令と未来の約束との連関を現代日本語で自然に示す。単純な並列の「そして」より文脈上の応答関係が明瞭だが、機械的な条件法にはしない。
theological_decisions:
- issue: 三つの現在命令法のアスペクト
  choice: 本文では「求めなさい」「捜しなさい」「たたきなさい」と簡潔な命令形にする。
  alternative: 「求め続けなさい」「捜し続けなさい」「たたき続けなさい」と継続を明示する。
  rationale: ギリシア語現在命令法には継続的・反復的な理解の余地があるが、それを必須の意味として本文に固定せず、脚注で示す。
- issue: 神的受動の扱い
  choice: 「与えられます」「開かれます」と受動表現を保ち、行為者を明示しない。
  alternative: 「神が与えてくださいます」「神が開いてくださいます」と行為者を補う。
  rationale: 文脈上は神が暗示され得るが、原文は行為者を明記していないため、神学的含意を本文で明示化しない。
translation_notes:
  register: 明快な現代標準日本語を用い、三つの命令と約束の並行構造を短い文で際立たせた。「あなたがた」は複数の聞き手を明示する箇所に用い、未来受動と原文の行為者非明示を保った。
