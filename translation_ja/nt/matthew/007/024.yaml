id: MAT.7.24
reference: Matthew 7:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: ja
  text: ですから、わたしのこれらのことばを聞いて、それを行う人は皆、岩の上に自分の家を建てた賢い人にたとえられるでしょう。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「……賢い人のようになるでしょう」または「……賢い人になぞらえられるでしょう」。
    reason: lexical_alternative
  - marker: b
    text: 原文で「賢い人」と訳した語は、男性を指す語である。
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: ですから……人は皆
  rationale: οὖνの推論的なつながりを「ですから」で示し、Πᾶςとὅστιςの総称的・分配的な意味を、自然な日本語の「人は皆」で表した。
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: わたしのこれらのことばを聞いて
  rationale: 語順を日本語として整えつつ、μουとτούτουςの両方を明示した。「ことば」はλόγουςの意味を広げすぎず、現代日本語としても理解しやすい。
- source_word: καὶ ποιεῖ αὐτούς
  choice: それを行う
  rationale: ποιεῖの実践を求める直接的な意味を「行う」で保った。「それ」は直前の「ことば」を受ける日本語として自然である。
- source_word: ὁμοιωθήσεται
  choice: たとえられます
  rationale: 未来受動形が示す比較を明示し、単に「似ている」とせず、「たとえられる」という原文に近い構造を保った。日本語では現在・未来の形態的区別がないため、文脈上の帰結として理解される。
- source_word: ἀνδρὶ φρονίμῳ
  choice: 賢い人
  rationale: φρονίμῳを文脈に即して「賢い」とした。ἀνδρίは男性を指すが、日本語の「賢い男」は不必要に粗い響きを帯びやすいため、本文では自然な「賢い人」とし、原文の男性形は脚注で明示した。
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: 自分の家を建てた
  rationale: 再帰的に理解される所有関係を、日本語で自然な「自分の家」として表し、建築の比喩を保持した。
- source_word: ἐπὶ τὴν πέτραν
  choice: 岩の上に
  rationale: πέτραを直接的に「岩」と訳し、堅固な岩盤という像を過度に説明せずに保った。
theological_decisions:
- issue: 比較に登場する人物の性別表現
  choice: 本文は「賢い人」とし、脚注で男性を指す語であることを明示する
  alternative: 賢い男／賢い男性
  rationale: 原文のἀνήρは男性を指すため、その情報を失わせない一方、現代日本語で自然かつ品位ある本文とするため「人」を用いた。性別情報は脚注に明示し、一般化して消去しない。
- issue: 聞くことと行うことの関係
  choice: 「聞いて、それを行う」と並列して保持する
  alternative: 聞いて従う／聞いたとおりに生きる
  rationale: 原文はἀκούειとποιεῖを明確に並べており、理解・信仰・服従の関係を訳文で神学的に説明しすぎないよう、直接的な表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教の結論を導く「ですから」と比較の受動表現を保った。丁寧体で統一しつつ、過度に古風な語や説明的な意訳を避けた。
