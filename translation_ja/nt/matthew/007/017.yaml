id: MAT.7.17
reference: Matthew 7:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: ja
  text: このように、良い木はみな良い実を結び、腐った木は悪い実を結ぶ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: このように
  rationale: 直前のたとえを受け、その原則を示す語。現代日本語として自然で、推論と様態の両方の含みを保つ。
- source_word: πᾶν δένδρον ἀγαθὸν
  choice: 良い木はみな
  rationale: 単数名詞を伴う πᾶν の分配的意味を「みな」で表し、一般的・格言的な響きを保つ。ἀγαθός は広い意味の「良い」とした。
- source_word: καρποὺς καλοὺς
  choice: 良い実
  rationale: καλός には「美しい」「立派な」の意味もあるが、木の実の質と文脈上の倫理的含意の双方に自然な「良い」を選んだ。
- source_word: ποιεῖ
  choice: 実を結ぶ
  rationale: 直訳は「作る」だが、木と実についての自然な日本語表現である「実を結ぶ」とし、結果を生み出す比喩にも適合させた。
- source_word: τὸ δὲ σαπρὸν δένδρον
  choice: 腐った木は
  rationale: δέ の対照は日本語では並置で十分明確なため、不要な接続詞を加えなかった。σαπρός の腐敗・損壊の具体性を「腐った」で保つ。
- source_word: καρποὺς πονηροὺς
  choice: 悪い実
  rationale: πονηρός の倫理的な響きを残しつつ、農業的なたとえとして自然な「悪い」を採用した。
theological_decisions:
- issue: 木と実の比喩が持つ農業的意味と倫理的意味
  choice: 具体的な木と実の比喩をそのまま訳し、偽預言者への適用を本文に補わない。
  alternative: 「堕落した木」「邪悪な行い」など、倫理的意味を明示する。
  rationale: 原文は比喩を述べ、その解釈は文脈に委ねているため、農業的イメージと道徳的含意の緊張を保つ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「実を結ぶ」は日常的に理解でき、聖書的比喩としても自然である。原文に明確な語義上・本文上の注記を要する曖昧さはないため、脚注は付さない。
