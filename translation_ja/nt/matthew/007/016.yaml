id: MAT.7.16
reference: Matthew 7:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: ja
  text: あなたがたは、その実によって彼らを見分けます。[a] 人は、茨からぶどうを、あざみからいちじくを採るでしょうか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたは、その実によって彼らを知るでしょう。」
    reason: ἐπιγνώσεσθε は「知る」とも訳せるが、ここでは証拠に基づいて識別する意味を踏まえて本文を「見分けます」とした。
  - marker: b
    text: この問いは否定の答えを予期している。茨からぶどうを、あざみからいちじくを採ることはない。
    reason: μήτι が否定の答えを予期する修辞疑問であることを明示する。
lexical_decisions:
- source_word: καρπῶν
  choice: 実
  rationale: ギリシア語は複数形だが、日本語では集合的に「実」とするのが自然であり、人の行いや結果を示す農耕の比喩も保てる。
- source_word: ἐπιγνώσεσθε
  choice: 見分けます
  rationale: 観察できる証拠によって相手が何者かを認識する文脈なので、「知ります」よりも識別の含意が明確で、かつ「完全に知る」と過剰に訳さない。
- source_word: μήτι
  choice: 採るでしょうか
  rationale: 否定の答えを予期する修辞疑問を、現代日本語で自然な疑問形として表した。期待される否定は脚注で明示する。
- source_word: συλλέγουσιν
  choice: 採る
  rationale: ぶどうやいちじくの収穫について自然な現代日本語であり、農耕のイメージを保つ。
- source_word: ἀκανθῶν
  choice: 茨
  rationale: とげのある植物または茨を指す語として簡潔で伝統的かつ現代でも理解でき、植物から実を採るという対比に適する。
- source_word: σταφυλάς
  choice: ぶどう
  rationale: 語の通常の意味をそのまま訳した。日本語では単複を形態的に区別せず自然に表せる。
- source_word: τριβόλων
  choice: あざみ
  rationale: とげのある雑草・植物を指す。厳密な植物同定には幅があるが、一般読者に分かりやすく、食べられる実との対照を保つ。
- source_word: σῦκα
  choice: いちじく
  rationale: 語の標準的な訳語であり、農耕の比喩を具体的に保つ。
- source_word: αὐτῶν / αὐτούς
  choice: その／彼ら
  rationale: 文脈上、人々、すなわち偽預言者たちを受ける代名詞として、人格的な指示を保った。
theological_decisions:
- issue: 人を識別する基準としての「実」の比喩
  choice: 「実」という農耕の比喩を保持する。
  alternative: 「行い」または「生み出す結果」と解釈して訳す。
  rationale: 本文は具体的な農耕の比喩を用いており、その意味を行動や結果の一方に狭めず、比喩が持つ神学的・文脈的な広がりを残す。
translation_notes:
  register: 明快で格調を保った現代標準日本語。敬体を用い、「実」「茨」など聖書的な農耕イメージを自然な形で保持した。「あざみ」は一般的な表記として平仮名にした。
