id: MAT.7.3
reference: Matthew 7:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ja
  text: では、なぜあなたは、兄弟の目にある小さな木くず[a]を見ているのに、自分の目にある梁[b]に気づかないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小さな木くず」は、「小枝のかけら」「わらくず」「もみ殻の一片」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「梁」は、建物を支える大きな横木。「丸太」「厚板」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: それなのに、なぜ
  rationale: τίはこの疑問文で理由を問う「なぜ」と解し、δὲは直前の教えとの対照を自然な日本語で示した。
- source_word: βλέπεις
  choice: 見える
  rationale: 目の比喩を保ちながら、後半のκατανοεῖς「気づく」と語感を区別した。
- source_word: κάρφος
  choice: 小さな木くず
  rationale: 乾いた小片を表す語であり、目に入る微小な異物と後半の大きな梁との誇張された対比が明瞭になる。素材を完全には限定できないため別訳を脚注に示した。
- source_word: ἀδελφοῦ σου
  choice: 兄弟の
  rationale: 原文の男性単数の親族呼称を保った。文脈上、同胞や仲間にも用いられ得るが、本文では過度に一般化しない。
- source_word: τῷ σῷ ὀφθαλμῷ
  choice: 自分の目に
  rationale: σῷの強調的な所有を「自分の」で表し、「兄弟の目」との対照を明確にした。
- source_word: δοκόν
  choice: 梁
  rationale: 建物を支える大きな木材を指す語であり、κάρφοςとの滑稽なほど大きな対比を忠実に保つ。
- source_word: οὐ κατανοεῖς
  choice: 気づかない
  rationale: 単に見ることではなく、注意して認める・悟る意味を自然な現代日本語で表した。
theological_decisions:
- issue: ἀδελφοῦの性別と範囲
  choice: 兄弟
  alternative: 仲間／兄弟姉妹
  rationale: 教えの適用範囲を男性に限定する意図とは断定できない一方、原文は男性単数であるため、その形を本文に保ち、解釈的な包括表現へ置き換えなかった。
translation_notes:
  register: 明瞭で現代的ながら、教えとしての品位を保つ敬体。「それなのに」で修辞的な対照を示し、「小さな木くず」と「梁」の誇張を分かりやすく保った。すべての脚注記号を本文中に配置した。
