  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: ja
  text: サルモンはラハブとの間にボアズの父となり、ボアズはルツとの間にオベデの父となり、オベデはエッサイの父となった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 系図における男性を主語とする出生・父系のつながりを示す語。現代日本語として自然であり、古風すぎる「生んだ」や曖昧になりやすい「父となった」より、この文脈に適している。
- source_word: ἐκ
  choice: によって
  rationale: 母親の名を伴い、母系の出自を明示する用法。「ラハブによって」「ルツによって」として、父系の系図の中で母親が特記されている点を保持した。
- source_word: δὲ
  choice: （読点による接続）
  rationale: ここでは対立ではなく、系図を順に進める弱い接続辞である。日本語では「そして」を繰り返さず、読点で自然に連結した。
- source_word: Σαλμών / Βόες / Ῥαχάβ / Ἰωβήδ / Ῥούθ / Ἰεσσαί
  choice: サルモン／ボアズ／ラハブ／オベデ／ルツ／エッサイ
  rationale: 日本語聖書で広く認識される旧約人物名との連続性を保つ標準的な表記を採用した。
theological_decisions:
- issue: 父系の系図における母親の明示
  choice: 「ラハブによって」「ルツによって」を明記しつつ、「もうけた」で父系の連鎖を保つ。
  alternative: 母親への言及を一般的な親子関係の表現に吸収する、または「ラハブから」のように形式的に訳す。
  rationale: ギリシア語は二人の母親をἐκ＋属格で特に挙げている。この特徴を省かず、同時に日本語として不自然な逐語訳を避けた。
translation_notes:
  register: 明快で品位ある現代標準日本語。系図らしい簡潔な反復を保ちながら、接続詞の過剰な反復は避けた。
