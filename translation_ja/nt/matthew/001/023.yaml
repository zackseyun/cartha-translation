id: MAT.1.23
reference: Matthew 1:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: ja
  text: 「見よ、処女[a]が身ごもり、男の子を産む。そして、その名をインマヌエル[b]と呼ぶ[c]。」これは、訳すと「神が私たちとともにおられる」という意味である[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「若い女性」とも訳せる。ただし、マタイの文脈では、ギリシア語παρθένοςは通常「処女」を指し、周囲の誕生物語もこの訳を支持する。
    reason: lexical_alternative
  - marker: b
    text: 「エマヌエル」と音写することもある。
    reason: lexical_alternative
  - marker: c
    text: 原文は「彼らはその名を……と呼ぶ」。主語を特定しない複数表現である。
    reason: lexical_alternative
  - marker: d
    text: 直訳に近くは、「これは、訳すと……である」。
    reason: previous_rendering
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言の引用における注意喚起の力と格調を保ちつつ、現代日本語でも明瞭な表現とした。
- source_word: ἡ παρθένος
  choice: 処女
  rationale: マタイの誕生物語の文脈と、引用されたギリシア語παρθένοςの通常の意味を反映する。イザヤ書のヘブライ語をめぐる語義上の論点は脚注に残した。
- source_word: ἐν γαστρὶ ἕξει
  choice: 身ごもって
  rationale: 直訳的には「胎内に持つ」だが、日本語として自然に受胎を表す「身ごもる」を用いた。
- source_word: τέξεται υἱόν
  choice: 男の子を産む
  rationale: 出産と子の性別を、自然で明瞭な現代日本語で表した。
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: その名は……と呼ばれる
  rationale: 原文は主語を特定しない三人称複数「彼らは呼ぶ」。日本語では不特定の行為者を自然に示す受動形とし、その点を脚注で明示した。
- source_word: Ἐμμανουήλ
  choice: インマヌエル
  rationale: 日本語聖書で広く認知される音写を採用した。別の音写は脚注に示した。
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: この名は、……という意味である
  rationale: 名称の翻訳・解釈を読者に説明する分詞句を、簡潔で自然な日本語にした。より形式的な訳は脚注に示した。
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: 神は私たちとともにおられる
  rationale: 名称の意味「私たちとともに神」を自然な日本語の文として表し、本文以上の教理的説明は加えなかった。
theological_decisions:
- issue: 処女懐胎に関わるπαρθένοςの訳語
  choice: 処女
  alternative: 若い女／若い女性
  rationale: マタイ1章の直接の文脈では超自然的な受胎が語られ、ギリシア語παρθένοςも通常「処女」を意味するため、本文には「処女」を採用した。ただし、引用元イザヤ7:14のヘブライ語をめぐる議論を無視せず脚注に示した。
- issue: インマヌエルの意味の表現
  choice: 神は私たちとともにおられる
  alternative: 私たちとともに神がいる／私たちとともにいます神
  rationale: 名称に込められた神学的重みを保ちながら、受肉についての説明など本文にない教理的展開は加えなかった。
- issue: καλέσουσινの不特定複数
  choice: 日本語本文では受動形「呼ばれる」
  alternative: 彼らはその名を……と呼ぶ
  rationale: 原文の行為者は特定されていない。日本語の「彼ら」は具体的集団を想起させやすいため、不特定主体を自然に表す受動形を採用し、原文の形は脚注に保存した。
translation_notes:
  register: 預言引用にふさわしい格調を「見よ」で保ち、それ以外は明瞭で自然な現代標準日本語とした。引用部とマタイによる名称解説の境界が分かるよう句読点を整えた。すべての脚注記号を本文中に配置した。
