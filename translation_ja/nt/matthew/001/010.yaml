id: MAT.1.10
reference: Matthew 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: ja
  text: ヒゼキヤはマナセをもうけ、マナセはアモス[a]をもうけ、アモスはヨシヤをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の翻訳は、列王記第二21章に登場するユダの王の名に合わせて、ここを「アモン」としている。マタイのギリシア語本文は「アモス」となっている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 系図における男性側の生殖・父系のつながりを表す。現代日本語として自然で簡潔であり、系図の定型的な反復にも適している。
- source_word: Ἑζεκίας
  choice: ヒゼキヤ
  rationale: 日本語聖書で広く認知されている固有名の慣用表記を用いた。
- source_word: Μανασσῆς
  choice: マナセ
  rationale: 日本語聖書で広く認知されている固有名の慣用表記を用いた。
- source_word: Ἀμώς
  choice: アモス
  rationale: SBLGNT本文のἈμώςをそのまま音写した。列王記・歴代誌の王名との調和を図って「アモン」とはせず、異同は脚注に示した。
- source_word: Ἰωσίας
  choice: ヨシヤ
  rationale: 日本語聖書で広く認知されている固有名の慣用表記を用いた。
- source_word: δέ
  choice: 読点による接続
  rationale: 反復する系図の文脈では、δέは各世代へ記述を進める軽い接続を担う。日本語では接続詞を重ねず、読点で連ねるほうが自然である。
theological_decisions:
- issue: マタイのギリシア語本文と旧約のユダ王名との相違
  choice: 本文ではギリシア語のἈμώςに従い「アモス」とする
  alternative: 列王記第二21章および歴代誌第二33章の王名に合わせて「アモン」とする
  rationale: 原語本文を優先し、旧約の王名に合わせて暗黙に調和させない。読者が系図上の相違を認識できるよう、代替表記は脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系図の簡潔な反復を維持しつつ、古風な「生んだ」や説明的に長い「父となった」は避けた。脚注記号[a]は該当する「アモス」の直後に置いた。
