id: MAT.1.19
reference: Matthew 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: ja
  text: その夫[a]ヨセフは正しい人で、彼女を公に辱めたくなかった[b]ので、ひそかに離縁しようと[c]決めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「婚約者」。ギリシア語は直訳すると「彼女の男／夫」。当時のユダヤの婚約には法的拘束力があったため、「夫」と呼ぶことができた。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼女をさらし者にする」または「公に恥をかかせる」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「ひそかに彼女を去らせる」。ここでは、法的拘束力のある婚約関係を正式に解消することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: その夫
  rationale: ἀνήρは文脈により「男」または「夫」を意味する。ここでは婚約が法的拘束力を持ち、関係の解消にἀπολύωが用いられているため、「夫」がその法的関係を最も明確に伝える。婚姻成立前の段階であることは脚注で補う。
- source_word: δίκαιος
  choice: 正しい人
  rationale: 神の前での正しさと人への誠実な振る舞いの双方を含み得る語である。「正しい人」は現代日本語として明瞭であり、律法遵守か慈悲かという解釈を一方に限定しない。
- source_word: δειγματίσαι
  choice: 公に辱める
  rationale: 人目にさらして恥辱を負わせる意味を、自然で簡潔な日本語で表す。「公に」により公開性を明示する。
- source_word: ἐβουλήθη
  choice: 決めた
  rationale: 熟慮した意向・決定を表す。単なる願望ではなく、考えた末の意図であることを現代日本語で自然に示す。
- source_word: λάθρᾳ
  choice: ひそかに
  rationale: 人に知られないように、内々に行うことを表す。ヨセフが公の辱めを避けようとした文脈にも合う。
- source_word: ἀπολῦσαι
  choice: 離縁する
  rationale: 字義的には「去らせる、解放する」だが、この文脈では法的拘束力のある婚約関係を正式に解消することを指す。「離縁する」は法的な解消を簡潔に伝える。
- source_word: δὲ
  choice: （日本語では独立した接続語を置かない）
  rationale: 弱い物語上の接続であり、日本語では前後の流れによって自然に表せるため、明示的な「しかし」「さて」は加えない。
- source_word: ὢν καὶ μὴ θέλων
  choice: 正しい人で、彼女を…たくなかったので
  rationale: 二つの分詞的要素を背景・理由として自然な日本語にしつつ、ヨセフの正しさと、公に辱めることを望まなかったことの結び付きを保つ。
theological_decisions:
- issue: ヨセフがδίκαιοςであることの意味
  choice: 「正しい人」とし、その正しさを律法への厳格さ、憐れみ、またはその両方のいずれかに限定しない。
  alternative: 「義人」として神学的な響きを強める、または「思いやりのある人」と解釈的に言い換える。
  rationale: 本文はヨセフをδίκαιοςと呼び、同時にマリアを公に辱めたくないという態度を記す。その緊張と含意を保持し、特定の倫理的・教派的説明に解消しない。
- issue: ヨセフとマリアの法的関係
  choice: 本文では「夫」「離縁する」を用いる。
  alternative: 「婚約者」「婚約を解消する」、または字義的な「男」「去らせる」。
  rationale: 当時のユダヤの婚約は法的拘束力を持ち、その解消には正式な離縁が必要だった。現代の単なる婚約破棄と誤解されない表現を本文に置き、婚姻生活前の段階だったことは脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔ながら品位のある物語調とした。「義人」は教会語としては定着しているが、一般読者にも直接伝わり、かつ意味を狭めない「正しい人」を採用した。「離婚」よりも、婚姻生活開始前を含む正式な関係解消に適する「離縁」を用いた。
