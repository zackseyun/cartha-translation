id: MAT.1.17
reference: Matthew 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: ja
  text: こうして、アブラハムからダビデまでの代は全部で十四代、ダビデからバビロン捕囚までが十四代、バビロン捕囚からメシア[a]までが十四代である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語クリストスは「油を注がれた者」という称号で、ヘブライ語由来の「メシア」に当たる。
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: こうして……代は全部で
  rationale: οὖνの総括的な働きを「こうして」で表し、Πᾶσαιを「全部で」によって明示した。γενεαίは系図上の各世代を指すため、簡潔で自然な「代」とした。
- source_word: ἀπὸ ... ἕως
  choice: …から…まで
  rationale: 系図における二つの区切りの間の範囲を、現代日本語で自然に示す。
- source_word: μετοικεσίας Βαβυλῶνος
  choice: バビロン捕囚
  rationale: 語義の中心はバビロンへの移送・強制移住だが、日本語で当該歴史事象を明瞭かつ簡潔に指す定着した表現を採用した。
- source_word: τοῦ χριστοῦ
  choice: メシア
  rationale: 定冠詞を伴い、系図の頂点となる称号として機能しているため、音写的な「キリスト」ではなく称号の意味を伝える「メシア」とした。
- source_word: γενεαὶ δεκατέσσαρες
  choice: 十四代
  rationale: 三つの区分に反復される定型句を同じ形で表し、原文の均整を保った。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、約束された者を示す称号として系図を締めくくっている。別の伝統的表記は脚注に残した。
- issue: 系図の三つの十四代の表現
  choice: 原文どおり三つの区分を並列して提示
  alternative: 系図中の省略を補足または説明する
  rationale: 本節は著者による系図の総括であり、本文自体の数え方や神学的意図を解釈によって修正せず、その緊張をそのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、系図の総括にふさわしい簡潔で格調ある文体とした。三つの「十四代」の反復を保ち、原文の均整を再現した。
