  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: ja
  text: バビロンへの強制移送[a]の後、エコンヤはサラティエルをもうけ、サラティエルはゼルバベルをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バビロン捕囚」とも訳せる。ギリシア語は、バビロンへ強制的に移された出来事を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: の後
  rationale: μετά＋対格が時間的な後続を示す。δέは弱い接続辞であり、日本語では系図の自然な流れの中に吸収した。
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: バビロンへの強制移住
  rationale: μετοικεσίαは、民が強制的に移されて捕囚となった出来事を指す。「強制移住」は移動が本人たちの意思によらないことを明確にしつつ、現代日本語として理解しやすい。
- source_word: Ἰεχονίας
  choice: エコニヤ
  rationale: 旧約聖書の人物名として認識しやすい日本語の慣用表記を採用した。
- source_word: ἐγέννησεν
  choice: をもうけた
  rationale: 系図におけるγεννάωの父系的な継承を自然な現代日本語で表す。系図という文学形式が許容する以上に、直系の実父子関係や世代の連続性を限定しない。
- source_word: Σαλαθιήλ
  choice: シャルティエル
  rationale: 旧約聖書の人物名との対応が分かりやすい、日本語で広く用いられる形を採用した。
- source_word: δὲ
  choice: （無標）
  rationale: 二つ目のδέは系図の項目を穏やかにつなぐ接続辞であり、目的語を主題化せず同じ文型を反復する日本語では、接続語を加えない方が自然である。
- source_word: Ζοροβαβέλ
  choice: ゼルバベル
  rationale: 旧約聖書の人物名との対応が明確な、日本語の標準的な慣用表記を採用した。
theological_decisions:
- issue: 系図におけるγεννάωの訳し方
  choice: 「をもうけた」と訳し、父系の系譜上の継承を表す
  alternative: 「の父となった」「生んだ」
  rationale: 「もうけた」は男性を主語とする系図の定型として自然である一方、この系図の慣用を超えて各人物が必ず一世代違いの生物学的父子であると断定しない。「生んだ」は日本語では母親を主語とする意味に受け取られやすい。
translation_notes:
  register: 明快な現代標準日本語を用い、系図らしい簡潔さと品位を保った。人名は旧約聖書とのつながりが分かる慣用形とし、「強制移住」には語義上必要な補足脚注を付した。
