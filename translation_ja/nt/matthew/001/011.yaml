  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: ja
  text: ヨシヤは、バビロンへの強制移送[a]のころ、エコニヤとエコニヤの兄弟たちの父となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「バビロンへの捕囚」。このギリシア語は、強制的な移送、または捕囚を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 父となった
  rationale: 系図における男性からの血統を表す。現代日本語として自然で品位があり、「もうけた」より誤解が少なく、「生んだ」のように母親の出産を連想させない。系図が世代を省略し得るかという問題は、この表現で決着させない。
- source_word: Ἰεχονίαν
  choice: エコニヤ
  rationale: ギリシア語形Ἰεχονίαςに即した、聖書人名として通用する日本語表記を採用した。
- source_word: ἀδελφοὺς αὐτοῦ
  choice: その兄弟たち
  rationale: 男性複数形を保ち、系図の文脈における男性の親族を自然に表す。
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: バビロンへの強制移住のころ
  rationale: μετοικεσίαが表す移住・捕囚、とりわけ強制的な移送の性格を「強制移住」で示し、ἐπί＋属格の時間的用法を「のころ」で自然に表した。Βαβυλῶνοςはこの慣用表現で目的地として訳した。
- source_word: δὲ
  choice: 独立した訳語を置かない
  rationale: 系図を進める弱い接続辞であり、日本語では明示しない方が自然で、意味の損失もない。
theological_decisions:
- issue: マタイの系図における世代の省略
  choice: 本文の系図表現をそのまま訳し、歴史上の世代関係を本文中で調整しない
  alternative: ἐγέννησενを、直接の父子関係に限らず祖先から子孫への系譜的関係として明示的に訳す
  rationale: マタイの系図には世代の省略があり得るが、翻訳ではギリシア語の定型表現を反映し、調和化や歴史的説明を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語。系図らしい簡潔さと聖書本文としての品位を保ちつつ、「強制移住」により出来事の強制性を伝えた。脚注標識[a]は該当語の直後に置いた。
