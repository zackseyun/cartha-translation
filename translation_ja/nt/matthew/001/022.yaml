  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: ja
  text: この一連の出来事すべてが起こったのは、主が預言者を通して次のように語られたことが成就するためであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このこと全体が起こったのは」。ギリシア語の表現は、直前に述べられた出来事の全体を強調している。
    reason: τοῦτο δὲ ὅλον の単数形と全体性の強調を示すため。
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: これらすべてのこと
  rationale: τοῦτο は直前の出来事を一つのまとまりとして指し、ὅλον はその全体性を強調する。日本語では複数形の「これらすべてのこと」が自然に文脈全体を受ける。δέは弱い接続・展開を示すが、ここでは独立した接続語を置かなくても自然に伝わる。
- source_word: γέγονεν
  choice: 起こった
  rationale: γίνομαι の完了形。出来事の成立を現代日本語で自然に表し、文脈上の結果性も損なわない。
- source_word: ἵνα πληρωθῇ
  choice: 成就するためであった
  rationale: ἵνα＋接続法と受動態の成就表現を保つ。「ため」は目的と結果の重なりを残し、どちらか一方に限定しない。日本語では「成就する」が自動詞的に用いられ、受動の意味内容を自然に伝える。
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: 主が…語られたこと
  rationale: 実質化された受動分詞を「語られたこと」とし、ὑπό句が示す究極的な発話者を「主が」で明示する。
- source_word: διὰ τοῦ προφήτου
  choice: 預言者を通して
  rationale: διά＋属格が表す媒介を明確にし、主と預言者の役割を混同しない。
- source_word: λέγοντος
  choice: 語られた
  rationale: 後続する引用を導く分詞の働きを、日本語では「語られたこと」に含めて自然に表す。次節の引用へ滑らかにつながる。
theological_decisions:
- issue: 預言における発話の主体と媒介
  choice: 「主が預言者を通して語られた」
  alternative: 「預言者が主から語った」
  rationale: ὑπό＋属格は主を究極的な発話者として、διά＋属格は預言者を媒介者として示す。この区別を保ちつつ、本文を越えた霊感論の説明は加えない。
- issue: 成就定型句における目的と結果
  choice: 「成就するためであった」
  alternative: 「その結果、成就した」
  rationale: ἵνα＋接続法には目的と結果の両面があり得るため、「ため」によって目的性を示しながら、その神学的緊張を一義的に解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「成就」は聖書の預言が実現することを表す一般的な聖書用語として保持した。語順は日本語として自然にしつつ、主が発話の主体、預言者が媒介者であるという原文の構造を明示した。
