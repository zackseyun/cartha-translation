id: MAT.1.18
reference: Matthew 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: ja
  text: メシアであるイエス[a]の誕生は、次のようであった。母マリアはヨセフと婚約していたが[b]、二人が一緒になる前に[c]、聖霊によって身ごもっていることが分かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・キリスト」とも訳せる。ギリシャ語「クリストス」は「油注がれた者」、すなわち「メシア」を意味する称号である。
    reason: alternative_reading
  - marker: b
    text: 当時の「婚約」は、現代の一般的な婚約よりも拘束力の強い、法的に認められた結婚の取り決めであった。
    reason: cultural_note
  - marker: c
    text: 「一緒になる」は、夫婦として生活を始めること、特に夫婦の関係を持つことを含意し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: 誕生
  rationale: この文脈では、イエスが生まれるに至った出来事を導入している。「由来」「成り立ち」の含みもあり得るが、直後の受胎の記事には「誕生」が最も自然に結び付く。
- source_word: Ἰησοῦ χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστόςを姓のように扱わず、「油注がれた者」という称号の機能が伝わる「メシア」で表した。日本語として自然になるよう「メシアであるイエス」とした。
- source_word: οὕτως ἦν
  choice: 次のようであった
  rationale: これから出来事の経緯を説明する導入表現として、簡潔で格調を保つ現代日本語にした。
- source_word: μνηστευθείσης
  choice: 婚約していた
  rationale: 当時の法的拘束力を伴う婚約を指す。本文は分かりやすい「婚約」とし、現代の一般的な婚約との違いは脚注で補った。
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: 二人が一緒になる前に
  rationale: συνέρχομαιの婉曲的で幅のある表現を保ち、同居または夫婦としての結合を一方に限定しなかった。
- source_word: εὑρέθη
  choice: 分かった
  rationale: 受動形の意味を自然な日本語で表し、誰が知ったのかを原文以上に特定しないようにした。
- source_word: ἐν γαστρὶ ἔχουσα
  choice: 身ごもっている
  rationale: 字義的には「胎内に持っている」だが、現代日本語で自然かつ品位のある妊娠表現を採用した。
- source_word: ἐκ πνεύματος ἁγίου
  choice: 聖霊によって
  rationale: ἐκが示す源・由来を日本語として自然に表した。文脈上、神の聖霊を指す。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスに付された称号としての働きが明瞭なため、その意味を伝える「メシア」を本文に置いた。「キリスト」も定着した音写として脚注に示した。
- issue: πνεύματος ἁγίουの指示対象
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 定冠詞がないことだけで不定の霊とはならず、マタイの受胎記事では神の聖霊を指す。原文の主張を弱めず「聖霊」とした。
- issue: συνελθεῖνの含意
  choice: 一緒になる
  alternative: 夫婦の関係を持つ／同居する
  rationale: この句は婚姻生活、とりわけ夫婦の性的結合を含意し得るが、語句自体の婉曲性と意味の幅を本文で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「身ごもる」「一緒になる」により原文の婉曲的な語調を維持し、文化的背景と語義の幅は脚注で説明した。
