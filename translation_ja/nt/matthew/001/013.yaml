  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: ja
  text: ゼルバベルはアビウド[a]をもうけ、アビウドはエリアキムをもうけ、エリアキムはアゾルをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「の父となった」。聖書の系図では、この繰り返される動詞が、途中の世代を省略した形で系譜を示すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: ゼルバベル
  rationale: 人名は翻訳せず、旧約聖書以来、日本語聖書で広く用いられる慣用表記を採用した。
- source_word: δέ
  choice: 「は」および読点による連結
  rationale: ここでは強い対比ではなく系図を順に進める軽い接続を表すため、「しかし」とせず、日本語として自然な連続構文にした。
- source_word: ἐγέννησεν
  choice: をもうけた
  rationale: 男性を主語とする系図の定型表現として簡潔で自然であり、古風な「生んだ」や硬い「父となった」よりも現代日本語に適する。世代が省略されている可能性は脚注で示した。
- source_word: Ἀβιούδ
  choice: アビウド
  rationale: ギリシア語形に基づく、明瞭で慣用的な日本語音写とした。
- source_word: Ἐλιακίμ
  choice: エリアキム
  rationale: ギリシア語形を反映しつつ、日本語聖書で通用する慣用表記を採用した。
- source_word: Ἀζώρ
  choice: アゾル
  rationale: ギリシア語の発音と日本語聖書の慣用に沿って音写した。
theological_decisions:
- issue: 世代を省略し得る系図における γεννάω の訳し方
  choice: をもうけた
  alternative: の父となった／の祖先であった
  rationale: 原文の反復される直接的な系図表現を保ちつつ、各人物間が必ず一世代だけだと訳文で断定しない。「祖先であった」は省略の可能性を明示しすぎるため本文では採らず、その含みを脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系図の反復を残し、原文の簡潔なリズムを再現した。
