id: MAT.1.9
reference: Matthew 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: ja
  text: ウジヤはヨタムをもうけ、ヨタムはアハズをもうけ、アハズはヒゼキヤをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀζίας
  choice: ウジヤ
  rationale: ギリシア語形を機械的に音写せず、旧約聖書のユダ王として日本語聖書で広く知られる名に合わせた。
- source_word: δὲ
  choice: （読点による接続）
  rationale: 系図の各項を穏やかにつなぐ語であり、日本語では同じ接続詞を反復せず、読点で連続させるほうが自然で、列挙の流れも保てる。
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 系図における父系のつながりを示す語として、古風すぎず簡潔で品位のある現代日本語を選んだ。「生んだ」は日本語では母親について受け取られやすいため避けた。
- source_word: Ἰωαθάμ
  choice: ヨタム
  rationale: 旧約聖書の同一人物に対応する、一般的な日本語聖書の人名表記を用いた。
- source_word: Ἀχάζ
  choice: アハズ
  rationale: 旧約聖書の同一人物に対応する、一般的な日本語聖書の人名表記を用いた。
- source_word: Ἑζεκίαν
  choice: ヒゼキヤ
  rationale: 旧約聖書の同一人物に対応する、一般的な日本語聖書の人名表記を用いた。
theological_decisions:
- issue: 系図における γεννάω の意味
  choice: 父系の継承を「もうけた」と直接的に表した。
  alternative: 「父となった」「祖先であった」
  rationale: 本文は定型的な系図の表現で父系の継承を提示している。「祖先であった」と広げれば、系図に世代省略があり得ることを先回りして解釈することになるため、本文自体の素直な表現を保った。
translation_notes:
  register: 明瞭で現代的かつ端正な文体。原文の三つの並行句と反復を保ちつつ、δὲは日本語として自然な読点で表現した。
