id: MAT.1.8
reference: Matthew 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: ja
  text: アサフはヨシャファトをもうけ[a]、ヨシャファトはヨラムをもうけ、ヨラムはウジヤをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「アサフ」ではなく「アサ」とする。「アサ」は、旧約聖書の系図に名が挙げられているユダの王の名とも一致する。
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: アサフ
  rationale: SBLGNT本文の固有名Ἀσάφをそのまま音写した。旧約の系図で対応する王名「アサ」へ本文で調和させず、異読と系図上の対応は脚注に示す。
- source_word: δὲ
  choice: （読点による接続）
  rationale: ここでは逆接ではなく、系図の各節を緩やかにつなぐ語である。日本語では「しかし」などを置かず、読点で自然に連結した。
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 父系の系図における「父となった／生ませた」という意味を、簡潔で現代的かつ品位のある日本語で表す。
- source_word: Ἰωσαφάτ
  choice: ヨシャファト
  rationale: 旧約のユダ王として日本語聖書で広く認識される形を用いた。
- source_word: Ἰωράμ
  choice: ヨラム
  rationale: ギリシア語形Ἰωράμに対応する簡潔な慣用表記を採った。
- source_word: Ὀζίαν
  choice: ウジヤ
  rationale: 旧約のユダ王として広く用いられる日本語名を採り、ギリシア語に近い「オジア」より読者の認識しやすさを優先した。
theological_decisions:
- issue: 反復されるδὲとἐγέννησενを系図としてどう表すか
  choice: 三つの父子関係すべてで「もうけた」を反復し、読点でつなぐ。
  alternative: 各節に「そして」を置く、または「父となった」と訳す。
  rationale: 反復と系譜の順序を保ちながら、不自然に接続詞を重ねない現代日本語とした。
- issue: Ἀσὰφを旧約の王名アサに調和させるか
  choice: 本文では写本本文に従い「アサフ」とし、「アサ」は脚注に置く。
  alternative: 旧約の系図に合わせ、本文を「アサ」とする。
  rationale: 現存する採用ギリシア語本文の形を優先しつつ、歴史的・系図的対応と写本異読を読者に明示するため。
translation_notes:
  register: 明瞭で現代的な標準日本語。系図にふさわしい簡潔さと品位を保ち、固有名の本文上の問題は調和させず脚注で透明に示した。
