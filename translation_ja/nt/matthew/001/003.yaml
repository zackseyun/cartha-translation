id: MAT.1.3
reference: Matthew 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: ja
  text: ユダはタマルによってペレツとゼラの父となり、ペレツはヘツロンの父となり、ヘツロンはアラム[a]の父となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧約の系図や一部の翻訳では「ラム」とされるが、ここで用いたギリシャ語本文は「アラム」と読んでいる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: ユダ
  rationale: 系図では族長ユダを指すため、日本語聖書で定着している「ユダ」とした。
- source_word: δὲ
  choice: 「〜となり」で文を連結
  rationale: ここでは強い対比ではなく系図を進める軽い接続であり、日本語では反復構文と読点によって自然に表した。
- source_word: ἐγέννησεν
  choice: 父となった
  rationale: 系図における男性側の親子・祖先関係を示す。現代日本語として明瞭で品位があり、「生んだ」に伴いうる不自然さを避けた。
- source_word: Φαρὲς
  choice: ペレツ
  rationale: ヘブライ語名פֶּרֶץに対応し、日本語の旧約表記との連続性を保つ。
- source_word: Ζάρα
  choice: ゼラ
  rationale: ヘブライ語名זֶרַחに対応する、旧約との連続性が明瞭な日本語表記。
- source_word: ἐκ τῆς Θαμάρ
  choice: タマルによって
  rationale: 母タマルを通して生まれたことを示すἐκを、簡潔で自然な系図表現にした。
- source_word: Θαμάρ
  choice: タマル
  rationale: 日本語聖書で広く定着している固有名表記。
- source_word: Ἑσρώμ
  choice: ヘツロン
  rationale: ヘブライ語名חֶצְרוֹןに対応し、旧約の人物名との連続性を保つ。
- source_word: Ἀράμ
  choice: アラム
  rationale: 提示されたギリシャ語本文のἈράμを直接反映し、「ラム」へ調和させなかった。
theological_decisions:
- issue: 末尾の名を旧約系図で一般的な表記に調和させるか
  choice: アラム
  alternative: ラム
  rationale: 原語本文を優先し、SBLGNTのἈράμを本文に反映した。一方、旧約の系図や翻訳伝統で知られる「ラム」は脚注に残し、本文間の緊張を隠さない。
translation_notes:
  register: 明瞭な現代標準日本語。系図特有の反復を保ちながら、「もうけた」より平明で、「生んだ」より男性主体の文として自然な「父となった」を採用した。
