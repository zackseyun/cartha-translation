  text: アブラハムはイサクをもうけ[a]、イサクはヤコブをもうけ、ヤコブはユダとその兄弟たちをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イサクの父となった」。ギリシア語の動詞は、系図では男性が子をもうけること、また父系のつながりを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 父となり／父となった
  rationale: 系図における男性側の生殖・父系上のつながりを表す。現代日本語で自然かつ品位があり、直系の一代関係に限定する含みを不必要に強めない表現とした。文末のみ「父となった」として日本語の文を完結させた。
- source_word: δὲ
  choice: （読点による連結）
  rationale: ここでは強い逆接ではなく、系図を次へ進める軽い接続である。日本語では「しかし」などを加えず、読点で並べるのが自然である。
- source_word: Ἰούδαν
  choice: ユダ
  rationale: 指示対象はヤコブの子である族長ユダであり、日本語聖書で定着した名称を用いた。
- source_word: ἀδελφοὺς αὐτοῦ
  choice: その兄弟たち
  rationale: 文脈上、ヤコブのほかの息子たち、すなわちユダの男性の兄弟を指すため、「きょうだい」ではなく「兄弟たち」とした。
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: アブラハム／イサク／ヤコブ
  rationale: 各人名には、現代日本語の聖書で一般に定着している表記を用いた。
theological_decisions:
- issue: 系図の動詞の訳し方
  choice: 「父となる」を一貫して用いる
  alternative: 「もうける」「生む」
  rationale: ギリシア語の父系的な系図表現を保ちつつ、古風さや、各関係が必ず一代の直接的な親子関係であるとの過度な限定を避けるため。
translation_notes:
  register: 明瞭な現代標準日本語。系図らしい反復と格調を保ちながら、古風な「生んだ」「もうけた」の連続は避けた。原文の三つの節を一文として保ち、日本語として自然に結んだ。
