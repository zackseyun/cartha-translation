  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: ja
  text: ヨセフは眠りから目を覚ますと、主の御使いに命じられたとおりにし、妻を迎え入れた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け入れた」または「自分のもとに迎えた」とも訳せる。ギリシア語の動詞には、自分の家や生活の中に迎え入れる意味がありうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: ヨセフは眠りから目を覚ますと
  rationale: 分詞による出来事の順序と、睡眠から目覚めたという意味を、自然な現代日本語で表した。δὲの物語を進める働きは「〜すると」という接続に含めた。
- source_word: ἐποίησεν ὡς προσέταξεν αὐτῷ
  choice: 命じられたとおりにし
  rationale: 命令への服従を表すἐποίησεν ὡςと、権威ある指示を示すπροσέταξενを簡潔に反映した。日本語では受身形により命令の受け手がヨセフであることを自然に示せる。
- source_word: ὁ ἄγγελος κυρίου
  choice: 主の御使い
  rationale: κύριοςを「主」とし、聖書的文脈で自然かつ品位ある定着表現「主の御使い」を用いた。
- source_word: παρέλαβεν
  choice: 迎え入れた
  rationale: 単なる同行以上に、自分のもとへ、また生活・家に受け入れる含みを持ちうるπαραλαμβάνωを自然に表す。同時に具体的な婚礼手続きまでは本文に付加しない。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻を
  rationale: 直前からの婚姻上・法的な文脈ではγυνήは「妻」が自然であり、性的関係の成立までを含意するものではない。日本語では主語ヨセフとの関係が明白なので「彼の」は省いた。
theological_decisions:
- issue: 婚姻の完了以前の文脈におけるγυνήの訳
  choice: 妻
  alternative: 女、婚約者
  rationale: マタイはマリアをすでに婚姻上の枠組みの中で語っている。「妻」はその社会的・法的関係を示すが、夫婦関係の consummation を先取りして断定しない。
- issue: ἄγγελος κυρίουにおけるκύριοςの訳
  choice: 主の御使い
  alternative: ヤハウェの使い、主の使い
  rationale: ギリシア語本文のκύριοςを「主」と訳し、特定の神名を本文に補わない。「御使い」は天的な使者を指す日本語の定着表現である。
- issue: παρέλαβενが表す受け入れの範囲
  choice: 迎え入れた
  alternative: 受け入れた、妻として迎えた、自分の家に連れて来た
  rationale: 動詞が持つ「自分のもとに受け入れる」という幅を保ち、同居開始や婚礼の具体的形態を本文だけから確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「御使い」は一般語の「使者」と区別して天使を示す定着語。「迎え入れた」は婚姻関係の文脈に適するが、原文以上の儀礼的・生活上の細部は断定しない。
