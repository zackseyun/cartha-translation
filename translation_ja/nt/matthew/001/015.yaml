  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: ja
  text: エリウドはエレアザルをもうけ、エレアザルはマタンをもうけ、マタンはヤコブをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: エリウド
  rationale: ギリシア語の人名を、現代日本語の聖書で自然な音写にした。
- source_word: δὲ
  choice: （「は」と読点による連続の中に反映）
  rationale: この系図では列挙を進める弱い接続語であるため、接続詞を逐一置かず、主題を示す「は」と文の連なりによって自然に表した。
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 系図における父系の出生・系譜関係を簡潔に示す。現代日本語として読みやすく、古風な「生んだ」より男性を主語とするこの文脈に適している。
- source_word: τὸν
  choice: （訳出せず）
  rationale: 固有名詞を目的語として示すギリシア語の冠詞であり、日本語では格助詞「を」によって統語関係を表すため、独立して訳さない。
- source_word: Ἐλεάζαρ
  choice: エレアザル
  rationale: ギリシア語の人名を慣用的な日本語表記で音写した。
- source_word: Ματθάν
  choice: マタン
  rationale: ギリシア語の人名を日本語で明瞭かつ簡潔に音写した。
- source_word: Ἰακώβ
  choice: ヤコブ
  rationale: 日本語聖書で定着している人名表記を用いた。
