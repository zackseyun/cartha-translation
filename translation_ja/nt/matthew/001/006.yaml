id: MAT.1.6
reference: Matthew 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: ja
  text: エッサイはダビデ王の父となった。ダビデはウリヤの妻[a]によってソロモンの父となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「ウリヤの〔女〕から」。妻を意味する省略表現である。マタイはここでバテ・シェバの名を記していない。
    reason: 原文の省略表現と、女性を名指ししない特徴を示すため。
lexical_decisions:
- source_word: ἐγέννησεν
  choice: 父となった
  rationale: 系図における男性側の生殖・親子関係を表す。現代日本語として自然であり、古風な「生んだ」や不自然になりやすい「もうけた」を避けつつ、系図の反復を保った。
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: ダビデ王
  rationale: 定冠詞を伴う βασιλέα はダビデを王として特に示す。日本語では「王ダビデ」よりも「ダビデ王」が自然で、王としての身分も明確に伝わる。
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: ウリヤの妻によって
  rationale: 原文は直訳すると「ウリヤの〔女〕から」という省略表現で、妻が含意される。日本語では「ウリヤの妻によって」とし、女性の名を補わず、ウリヤとの関係による間接的な言及を保持した。
- source_word: Ἰεσσαί / Δαυίδ / Σολομών / Οὐρίας
  choice: エッサイ／ダビデ／ソロモン／ウリヤ
  rationale: 現代日本語聖書で広く通用する固有名詞表記を用いた。
- source_word: δέ
  choice: 訳語を立てない
  rationale: ここでは系図の連鎖をゆるやかにつなぐ接続詞である。文を区切る日本語では明示しなくても順序関係が明らかであり、過剰な接続表現を避けた。
theological_decisions:
- issue: マタイがバテ・シェバを名指しせず、ウリヤとの関係で示していること
  choice: 「ウリヤの妻」として間接表現を保つ
  alternative: 「バテ・シェバ」または「かつてウリヤの妻であった女」とする
  rationale: 原文は女性の名を補わず、ウリヤとの関係を前面に出している。これによりサムエル記下の物語に伴う文学的・道徳的緊張が残るため、訳文でも解消しない。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。「父となった」を反復して系図の形式を保ち、「ダビデ王」で王としての強調を自然に表した。
