  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: ja
  text: アゾルはサドクをもうけ、サドクはアキムをもうけ、アキムはエリウドをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: アゾル
  rationale: ギリシア語本文の人名を、現代日本語で読みやすい形に音写した。
- source_word: δέ
  choice: は／（連続する節の構造に反映）
  rationale: 系図を順につなぐ軽い接続辞である。日本語では各節の主題を示す「は」と反復構造によって連続性が自然に伝わるため、独立した接続語は置かなかった。
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: この系図における男性側からの出生・系譜関係を簡潔に表し、古風すぎず、単なる養育を意味する「父となった」より原語の生殖・血統上の含意を保つ。
- source_word: τὸν
  choice: （個別には訳さない）
  rationale: 各固有名詞を直接目的語として示す対格冠詞だが、日本語ではこの構文で冠詞に相当する語を必要としない。
- source_word: Σαδώκ
  choice: サドク
  rationale: ギリシア語形を日本語の慣用的な聖書人名表記に沿って音写した。
- source_word: Ἀχίμ
  choice: アキム
  rationale: ギリシア語形を日本語で明瞭に読める形に音写した。
- source_word: Ἐλιούδ
  choice: エリウド
  rationale: ギリシア語形を日本語で明瞭に読める形に音写した。
theological_decisions: []
