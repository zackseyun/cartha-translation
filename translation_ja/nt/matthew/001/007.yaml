id: MAT.1.7
reference: Matthew 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: ja
  text: ソロモンはレハブアムをもうけ、レハブアムはアビヤをもうけ、アビヤはアサフ[a]をもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「アサ」とある。これは列王記第一15章および歴代誌第二14―16章に登場するユダの王の名と一致する。ここで採用したギリシア語本文は「アサフ」と読む。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: もうけ
  rationale: 男性を主語とする系図で、子を生じさせて家系をつなぐことを簡潔に表す。現代日本語として自然でありながら、系図にふさわしい格調も保つ。
- source_word: δὲ
  choice: 読点と文の連続構造で表現
  rationale: ここでは対立ではなく、系図を次へ進める弱い接続を表す。各節に「そして」を重ねず、並列構造によって自然に伝えた。
- source_word: Σολομών
  choice: ソロモン
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: Ῥοβοάμ
  choice: レハブアム
  rationale: 旧約の王名とのつながりが読者に分かるよう、日本語で定着した表記を用いた。
- source_word: Ἀβιά
  choice: アビヤ
  rationale: 旧約の王名との連続性を保つ、日本語で定着した表記を用いた。
- source_word: Ἀσάφ
  choice: アサフ
  rationale: 底本SBLGNTの本文がἈσάφと読むため、その読みを音写した。歴史的に予想される「アサ」は脚注に示した。
theological_decisions:
- issue: マタイの系図を旧約のユダ王国の王名表に合わせ、Ἀσάφを「アサ」と訳すか
  choice: 本文では「アサフ」とする
  alternative: 「アサ」として歴代の王名に調和させる
  rationale: 提示されたギリシア語本文の読みを優先し、旧約の系図に合わせて無言で修正しない。写本上の異読と旧約との対応は脚注で明示し、本文上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語。系図の反復を保ちつつ、「もうけた」を用いて簡潔で格調ある文体とした。脚注記号は異読の対象である「アサフ」の直後に置いた。
