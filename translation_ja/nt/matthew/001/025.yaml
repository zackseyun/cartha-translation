id: MAT.1.25
reference: Matthew 1:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: ja
  text: ヨセフは、マリアが男の子を産むまで、彼女と夫婦の関係を持たなかった[a][b]。そして、その子をイエスと名づけた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼女を知らなかった」。ギリシア語では「知る」が性的関係を表す婉曲表現として使われている。
    reason: lexical_alternative
  - marker: b
    text: 「まで」は、イエスの誕生時まで何が事実であったかを示すが、その後どうなったかを、この語だけで決めることはできない。
    reason: alternative_reading
  - marker: c
    text: 直訳に近くすれば、「彼はその名をイエスと呼んだ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: 夫婦の関係を持たなかった
  rationale: ここで「知る」は性的関係を表す婉曲表現である。日本語で直訳して「彼女を知らなかった」とすると意味が伝わりにくく、別人のように誤解されるため、文脈上の意味を明確かつ節度ある現代語で表した。未完了過去の継続的な否定も「持たなかった」で自然に表現できる。
- source_word: ἕως οὗ
  choice: まで
  rationale: 誕生の時点まで続いた事実を示す標準的な時間表現。誕生後に状況が変化したかどうかは、この表現だけでは決まらない。
- source_word: ἔτεκεν
  choice: 産む
  rationale: τίκτωの意味を、自然で一般的な現代日本語で表した。
- source_word: υἱόν
  choice: 男の子
  rationale: 冠詞のないυἱόνを不定の意味で自然に表し、「その息子」などの余分な限定を加えない。
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: その子をイエスと名づけた
  rationale: 原文のセム語的な言い回しを、日本語として自然な命名表現にした。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 新約聖書の人名として定着している日本語表記を用いた。
theological_decisions:
- issue: 「まで」がマリアの出産後の夫婦関係について含意するか
  choice: 「まで」とだけ訳し、出産後に夫婦関係があったとも、なかったとも断定しない。
  alternative: 出産後には通常の夫婦関係が始まったと推論する読み、または出産後については何の変化も含意しないとする読み。
  rationale: ἕως οὗはイエス誕生までの状態を明示するが、それ以後の状態をそれ自体で確定しない。教派的な結論を本文に持ち込まず、原文の解釈上の余地を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「性的関係」よりも文脈に即して穏当な「夫婦の関係」を用いた。日本語では主語の省略が可能だが、節単独でも指示対象が明確になるよう、文脈上の主語ヨセフを明示した。
