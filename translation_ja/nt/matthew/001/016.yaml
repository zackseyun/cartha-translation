id: MAT.1.16
reference: Matthew 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: ja
  text: そしてヤコブは、マリアの夫ヨセフをもうけた。そのマリアから、メシア[a]と呼ばれるイエスが生まれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語クリストスは「油を注がれた者」という称号で、ヘブライ語由来の「メシア」に当たる。
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: そして
  rationale: 系図の叙述を軽く先へ進める接続語として、対比を強調しすぎない自然な表現を選んだ。
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 系図における男性側からの出生・血統関係を簡潔に表し、古風すぎる「生んだ」「生ませた」を避けた。
- source_word: τὸν ἄνδρα Μαρίας
  choice: マリアの夫
  rationale: 属格を伴うἀνήρはここでは婚姻関係を表すため、「男」ではなく「夫」とした。
- source_word: ἐξ ἧς
  choice: そのマリアから
  rationale: 女性単数の関係代名詞がヨセフではなくマリアだけを指すことを、日本語でも明確にした。前置詞ἐκの起点・由来の意味を「から」で保った。
- source_word: ἐγεννήθη
  choice: 生まれた
  rationale: 能動形「もうけた」から受動形へ移る原文の変化を反映し、ヨセフがイエスをもうけたとは述べない構文を保った。
- source_word: ὁ λεγόμενος
  choice: と呼ばれる
  rationale: 一般にその称号で呼ばれていることを表す、明瞭で自然な現代日本語とした。
- source_word: χριστός
  choice: メシア
  rationale: ここでは固有名の一部というより称号として機能しているため、その称号の意味が伝わる「メシア」とした。
theological_decisions:
- issue: χριστόςをキリスト論的な呼称の中でどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: ὁ λεγόμενος χριστόςではχριστόςが称号として提示されている。そのため称号性を明らかにする「メシア」を本文に置き、伝統的な音訳「キリスト」は脚注に示した。
- issue: ヨセフの出生とイエスの出生に用いられる表現の切り替え
  choice: ヨセフについては「もうけた」、イエスについては「そのマリアから…生まれた」
  alternative: 両方を同じ出生表現で訳す
  rationale: 原文は能動形ἐγέννησενから受動形ἐγεννήθηと女性単数ἐξ ἧςへ意図的に切り替えている。この違いを保ちつつ、その神学的含意を本文で説明し足さないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「もうけた」は系図の定型性を保ちながら、「生んだ」より父系の関係を自然に示す。原文は一文だが、日本語で修飾関係と主語の交替を明確にするため二文に分けた。敬語的な「お生まれになった」は原文にない敬意を文法化するため避けた。
