id: MAT.1.4
reference: Matthew 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: ja
  text: アラムはアミナダブの父となり、アミナダブはナフションの父となり、ナフションはサルモンの父となった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρὰμ
  choice: アラム
  rationale: SBLGNTのギリシア語形Ἀράμを直接反映した一般的な日本語音写。英語版の注が示す「Ram」との差は英語表記上の問題であり、日本語では通常「アラム」と表記されるため、別名注は設けない。
- source_word: δὲ
  choice: は（連鎖構文で表現）
  rationale: ここでのδέは強い対照ではなく系譜を次へ進める接続辞。日本語では各節を「〜は」で連ねることで、反復的なつながりを自然に示した。
- source_word: ἐγέννησεν
  choice: 父となり／父となった
  rationale: 系譜における男性側の生殖・父系関係を明確にしつつ、古風な「生んだ」や「もうけた」より自然で品位ある現代日本語とした。ギリシア語の反復は三度とも同じ表現で保持した。
- source_word: Ἀμιναδάβ
  choice: アミナダブ
  rationale: ギリシア語形を踏まえつつ、日本語聖書で認識しやすい慣用的な固有名表記を採用した。
- source_word: Ναασσών
  choice: ナフション
  rationale: 対応するヘブライ語名との連続性が認識しやすい、日本語で定着した聖書固有名表記を採用した。ギリシア語の字面だけに従う「ナアソン」より正典内の人物同定に適する。
- source_word: Σαλμών
  choice: サルモン
  rationale: ギリシア語Σαλμώνに対応する、明瞭で一般的な日本語の聖書固有名表記。
theological_decisions: []
