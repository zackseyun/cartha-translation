  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: ja
  text: 彼女は男の子を産む。その名をイエスと名づけなさい[a]。この方が、ご自分の民を彼らの罪から救うからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス」は、ヘブライ語・アラム語の「イェシュア」（ヨシュアに当たる名）に対応するギリシア語形で、「ヤハウェは救う」という意味と関連づけられる。続く「救うからである」は、この名に関わる語呂合わせを説明している。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται δὲ υἱὸν
  choice: 彼女は男の子を産む
  rationale: 未来形の予告を自然な日本語の非過去形で表した。δὲは穏やかな接続辞であり、ここでは独立した訳語を置かなくても文脈の流れが保たれる。υἱόςは出生告知に即して「男の子」とした。
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: その名を…と名づけなさい
  rationale: ギリシア語の二人称未来形はこの命名命令の文脈で指示の力を持つ。「その名を…と名づけなさい」はセム語的な命名表現を反映しつつ、現代日本語として明瞭である。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 新約聖書の人物名として定着した日本語表記を用いた。ヘブライ語・アラム語のイェシュアとの関係と、救いをめぐる語義的連想は脚注で示す。
- source_word: αὐτὸς
  choice: この方が
  rationale: 主語を明示して焦点を保ちながら、過度に強意的な「この方ご自身が」は避けた。直前のイエスを指すことも明瞭になる。
- source_word: σώσει
  choice: 救う
  rationale: 罪からの解放を目的語句が明示しているため、σῴζωの救済的意味を直接表す「救う」が最も適切である。
- source_word: τὸν λαὸν αὐτοῦ
  choice: ご自分の民
  rationale: 所有関係とλαόςの民・契約共同体を想起させる含みを保ち、イスラエルまたは全人類などと範囲を訳文で限定しない。
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: その罪から
  rationale: ἀπόの分離の意味を「から」で表した。日本語では集合的な複数の罪も自然に単数形の「罪」で表せるため、意味を損なわず簡潔に訳した。
- source_word: γὰρ
  choice: からである
  rationale: 命名の理由を説明する接続機能を、文末の理由表現として自然に示した。
theological_decisions:
- issue: 強意代名詞αὐτόςとイエスの救いの働き
  choice: 「この方が」として主語の焦点を明示する
  alternative: 「この方ご自身が」または単に「彼が」
  rationale: αὐτόςによる明示的な主語を反映しつつ、日本語で原文以上の排他的・対照的強意を加えない。イエスが救いの主体であることは明瞭に保たれる。
- issue: 「ご自分の民」の範囲
  choice: 範囲を限定せず「ご自分の民」とする
  alternative: 「ご自分の民イスラエル」または「ご自分に属するすべての人々」
  rationale: 当該句自体は範囲を明示していないため、ユダヤ的・契約的文脈を保ちながら、訳文でイスラエルだけに狭めたり全人類へ広げたりしない。
- issue: 罪から救うという表現
  choice: 「その罪から救う」と直接訳す
  alternative: 罪の結果から救う、罪を赦す
  rationale: 原文は救いの対象との関係をἀπόで示すが、その具体的仕方をここでは説明していない。赦しや刑罰からの救出などに限定せず、原文の包括性を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、天使の告知にふさわしい簡潔で格調ある文体とした。「ご自分の民」は敬意を含む自然な指示表現であり、「その罪」は民を受ける。脚注記号[a]は名前の語義説明に直接対応する位置に置いた。
