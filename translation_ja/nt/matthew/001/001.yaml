  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: ja
  text: メシアであるイエス――ダビデの子、アブラハムの子――の系図[a]の書。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「系図」は「起源」または「誕生」とも訳せる。ギリシア語にはより広い「始まり・由来」の響きがあるが、ここでは直後に系譜が続くため「系図」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: 書
  rationale: 書物・記録を指す語。ここでは表題としての簡潔さと聖書本文にふさわしい格調を保つため「書」とした。
- source_word: γενέσεως
  choice: 系図
  rationale: 起源・誕生・系譜を意味し得るが、直後に続く系譜一覧との関係から本文では「系図」が最も自然である。より広い含意は脚注に残した。
- source_word: Ἰησοῦ χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστόςはここで称号として働くため「メシア」とし、日本語で姓のように誤解されないよう「メシアであるイエス」と表現した。
- source_word: υἱοῦ Δαυὶδ
  choice: ダビデの子
  rationale: υἱόςは系譜上「子孫」を含意するが、「ダビデの子」という王的・メシア的称号の力を保つため字義的な慣用表現を採用した。
- source_word: υἱοῦ Ἀβραάμ
  choice: アブラハムの子
  rationale: 文脈上は子孫を意味するが、原文の反復と契約史的な結びつきを保つため「子」とした。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名の一部というより称号としてイエスの身分を示すため、「油注がれた者」というユダヤ的・王的背景が伝わる「メシア」を採用した。
- issue: γενέσεωςの意味
  choice: 系図
  alternative: 起源／誕生
  rationale: 直後の系譜に最もよく合う「系図」を本文に置きつつ、語が持つ起源・誕生という広い響きを脚注で明示し、解釈上の余地を残した。
- issue: 二つの「子」の順序
  choice: アブラハムの子、ダビデの子
  alternative: ダビデの子、アブラハムの子
  rationale: ギリシア語の表面上の順序はダビデ、アブラハムだが、日本語では「アブラハムの子、ダビデの子、…イエス」と祖先から子孫へ連結させることで、各属格がイエスに係る関係を保ちながら自然に読める。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、冒頭の表題らしい簡潔さと格調を保った。「メシアである」によりΧριστόςが姓ではなく称号であることを自然に示した。
