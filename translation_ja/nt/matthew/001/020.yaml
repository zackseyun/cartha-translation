  to: ところが、ヨセフがこれらのことを思い巡らしていると、見よ、主の使いが夢の中に現れて言った。「ダビデの子ヨセフ、恐れずに、妻マリアを迎え入れなさい。[a] 彼女の胎内に宿ったものは、聖霊によるものです。」
