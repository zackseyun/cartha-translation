id: MAT.1.20
reference: Matthew 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: ja
  text: ところが、ヨセフがこれらのことを思い巡らしていると、見よ、主の使いが夢の中に現れて言った。「ダビデの子ヨセフ、恐れずに、妻マリアを迎え入れなさい。[a] 彼女の胎内に宿ったものは、聖霊によるものです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの妻マリアを引き取りなさい」。ここでは、婚姻生活のために彼女を自分の家に迎えることを指す。
    reason: παραλαβεῖνの婚姻文脈での意味と、「妻として」と訳した場合に生じうる身分変更の含みを説明するため。
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: 思い巡らしていると
  rationale: ヨセフの内面的で継続中の熟慮を表し、すでに決断したとの意味を加えない。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面の鮮明な転換と突然の介入を示す談話標識として、本文に明示した。
- source_word: ἄγγελος κυρίου
  choice: 主の使い
  rationale: 冠詞のないἄγγελοςを、特定の旧約的顕現と断定せず、日本語聖書として自然な表現にした。
- source_word: κατ’ ὄναρ ἐφάνη
  choice: 夢の中に現れて
  rationale: 夢による啓示的な出現を、明瞭で自然な現代日本語で表した。
- source_word: υἱὸς Δαυίδ
  choice: ダビデの子
  rationale: ダビデの家系との関係、および物語上のダビデ的含意を保持した。
- source_word: μὴ φοβηθῇς
  choice: 恐れずに
  rationale: 禁止命令の力を保ちつつ、後続の命令と自然につながる日本語にした。
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: 妻マリアを迎え入れなさい
  rationale: マリアがすでに「あなたの妻」と呼ばれていることを保ちつつ、παραλαμβάνωが婚姻生活のため家に迎えることを指す文脈を表した。
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: 彼女のうちに宿っているもの
  rationale: 中性の実体化された分詞を「もの」で保ち、胎内に生じた存在を指すことを自然に示した。
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: 聖霊による
  rationale: ἐκが示す源・起源を簡潔に表し、聖霊を単なる力へと言い換えない。
theological_decisions:
- issue: ἄγγελος κυρίουにおけるκυρίου
  choice: 主の使い
  alternative: 主なる神の使い／あの主の御使い
  rationale: 「主」を保持しつつ、この無冠詞表現を特定の神顕現と断定する訳を避けた。
- issue: πνεύματός ... ἁγίουの指示対象
  choice: 聖霊
  alternative: 聖なる霊／聖霊の力
  rationale: マタイの文脈における神的な聖霊への言及を保ち、非人格的な力であると限定しない。
- issue: マリアの婚姻上の身分
  choice: 妻マリア
  alternative: マリアを妻として
  rationale: τὴν γυναῖκά σουは「あなたの妻」と同格的にマリアを特定しており、新たに妻の身分を与えるとの含みを避けた。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「見よ」「主の使い」「ダビデの子」により聖書物語としての品位と原文の談話的・系譜的響きを保持した。発話は過度に古風な「〜せよ」を避け、「迎え入れなさい」「〜からです」とした。
