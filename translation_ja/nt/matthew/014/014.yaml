id: MAT.14.14
reference: Matthew 14:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: ja
  text: イエスは舟から上がると[a]、大勢の群衆を見て、彼らを深く憐れみ、その中の病人たちを癒やした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「外に出ると」。文脈上、舟から岸に上がったことを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 舟から上がると
  rationale: 語そのものは「出る」を意味するが、直前の舟での移動という文脈を明示し、自然な現代日本語で岸に上がる動作を表した。原文には「舟」や「岸」の語がないため、注で直訳を示す。
- source_word: εἶδεν
  choice: 見て
  rationale: ὁράωのアオリストを簡潔に表し、後続する憐れみと癒やしへ自然につないだ。
- source_word: πολὺν ὄχλον
  choice: 大勢の群衆
  rationale: πολύςの数量的な意味とὄχλοςの集合的な意味を、明瞭で自然な日本語にした。
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: 彼らを深く憐れみ
  rationale: σπλαγχνίζομαιが表す内面からの強い憐れみを、「深く憐れむ」で簡潔かつ格調を保って表現した。
- source_word: ἐθεράπευσεν
  choice: 癒やした
  rationale: この文脈では身体の病を治す行為を指す。「癒やす」は福音書の語調に適しつつ、現代日本語として理解しやすい。
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: その中の病人たち
  rationale: αὐτῶνが群衆との所属・関係を表すことを、日本語で誤解なく示した。「彼らの病人」より自然であり、原文の意味を過度に拡張しない。
theological_decisions:
- issue: イエスの感情的応答の表現
  choice: 彼らを深く憐れみ
  alternative: 彼らをかわいそうに思い／彼らに対して憐れみに動かされ
  rationale: 癒やしに先立つイエスの深い憐れみを保持しながら、感情の原因や性質を本文以上に教理化しない。「かわいそうに思う」はやや軽く、「憐れみに動かされ」は受動的な形を強調するため採らなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、福音書本文にふさわしい簡潔で dignified な調子とした。「癒やした」「憐れみ」は一般読者にも理解できる伝統的な聖書語彙として保持した。
