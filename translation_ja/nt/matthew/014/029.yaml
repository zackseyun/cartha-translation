id: MAT.14.29
reference: Matthew 14:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: ja
  text: イエスは「来なさい」と言われた。そこでペトロは舟から降り、水の上を歩いて、イエスのほうへ進んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスのもとへ行った」。ギリシア語はイエスの方向への移動を表しており、到着したかどうかは必ずしも明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: 来なさい
  rationale: ἔρχομαιのアオリスト命令形による直接の呼びかけ。簡潔で自然な現代日本語とし、原文にない語を補わない。
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: 舟から降り
  rationale: 分詞によって先行する動作が示されているため、日本語では後続動作との順序が自然に伝わる連用形とした。
- source_word: πλοίου
  choice: 舟
  rationale: ガリラヤ湖で用いられる比較的小型の船を指す文脈に合い、聖書本文としても自然な表記である。
- source_word: περιεπάτησεν
  choice: 歩いて
  rationale: ここでの περιπατέω は通常の意味で「歩く」。開始や歩き回るという含意は加えない。
- source_word: ἐπὶ τὰ ὕδατα
  choice: 水の上を
  rationale: 水面上の移動を表す。日本語では複数形を直訳せず、「水」を用いるのが自然である。
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: イエスのほうへ進んだ
  rationale: πρός が示すイエスの方向への動きを保ちつつ、到着したと断定しない自然な日本語にした。
- source_word: δὲ
  choice: そこで
  rationale: 物語を進める穏やかな接続を、日本語の文脈に即して表した。
theological_decisions:
- issue: ペトロがイエスのもとに到着したか、それともイエスの方向へ進んだか
  choice: イエスのほうへ進んだ
  alternative: イエスのもとへ行った
  rationale: πρὸς はイエスに向かう方向を示すが、この句だけでは到着を必ずしも明言しない。物語上の緊張を解消せずに残す。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述とした。イエスの発言には敬意を示す「言われた」を用い、命令は簡潔な「来なさい」とした。
