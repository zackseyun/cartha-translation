id: MAT.14.30
reference: Matthew 14:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: ja
  text: しかし、強い風[a]を見て怖くなり、沈みかけると、「主よ、私を救ってください[b]」と叫んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「激しい風」。
    reason: lexical_alternative
  - marker: b
    text: または「私を助けてください」。ここで「救う」と訳したギリシア語の動詞は、目の前の危険から助け出すことも、より広い意味での救いも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: 見て
  rationale: 現在分詞が表す、風を知覚することと恐れることの同時的なつながりを簡潔に保った。
- source_word: δὲ
  choice: しかし
  rationale: それまで水の上を歩いていた場面から、恐れへ転じる対比を明確にする。
- source_word: ἄνεμον ἰσχυρόν
  choice: 強い風
  rationale: ἰσχυρόςがἄνεμοςを直接修飾する形を保ち、現代日本語として自然に表現した。「激しい風」も可能なため脚注に示した。
- source_word: ἐφοβήθη
  choice: 怖くなり
  rationale: 恐れが生じたことを表すアオリストの起動的な意味合いを自然な日本語で示した。
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: 沈みかけると
  rationale: 沈下が始まったものの、まだ完全に水没したり溺れたりしたとは述べていない段階性を保った。
- source_word: ἔκραξεν λέγων
  choice: 「…」と叫んだ
  rationale: λέγωνを日本語の引用構文に自然に組み込み、ἔκραξενの切迫した大声を「叫んだ」で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの直接の呼びかけとしてκύριοςの意味とキリスト論的な響きを保つ、定着した訳語を用いた。
- source_word: σῶσόν με
  choice: 私を救ってください
  rationale: 目前の危険からの救出を求める緊急の命令・願いでありつつ、σῴζωが持つより広い「救う」という語義の響きも保った。
theological_decisions:
- issue: イエスへの呼びかけとしてのκύριος
  choice: 主よ
  alternative: 先生、私の主人よ
  rationale: 文脈上イエスへの敬意ある直接呼称であり、「主」はκύριοςの意味とマタイ福音書における含意を狭めずに保つ。
- issue: 目前の身体的危険におけるσῴζω
  choice: 私を救ってください
  alternative: 私を助けてください
  rationale: 直接には水に沈む危険からの救出を指すが、「救う」とすることで動詞の広い意味領域を不必要に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある語調とした。「沈みかけると」によって原文の開始相を自然に示し、ペトロの切迫した短い叫びは簡潔な直接話法で再現した。
