base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: ja
  text: しかし、弟子たちはイエスに言った。「ここには、パン五つと魚二匹しかありません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: すると弟子たちは
  rationale: 定冠詞は文脈上、弟子たちを指す。δέは、直前のイエスの命令を受けた応答への軽い転換を自然な日本語の「すると」で表した。
- source_word: λέγουσιν αὐτῷ
  choice: イエスに言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形にした。代名詞の指示対象を明確にするため「彼に」ではなく「イエスに」とした。
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: ここには…しかありません
  rationale: 否定節に続くεἰ μήは「…以外ない」の意味であり、日本語では限定を表す「しか…ない」が簡潔かつ自然である。
- source_word: πέντε ἄρτους
  choice: パン五つ
  rationale: ἄρτοςはパンまたは一個のパンを指す。日本語では個数を保ちつつ「パン五つ」とするのが明快である。
- source_word: δύο ἰχθύας
  choice: 魚二匹
  rationale: ἰχθύςの複数を、日本語で魚を数える一般的な助数詞「匹」を用いて訳した。
