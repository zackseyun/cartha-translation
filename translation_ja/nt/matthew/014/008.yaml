  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: ja
  text: 彼女は母に促されて、言った。「バプテスマを授けるヨハネ[a]の首を、盆に載せて、ここで私にください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「バプテスマのヨハネ」。
    reason: 称号βαπτιστήςの広く知られた伝統的表現を示すため。
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: 言い含められていた
  rationale: 母が前もって娘に働きかけ、求める内容を指図したことを自然な日本語で表しつつ、受動の形を保った。「そそのかされて」ほど明示的に悪意を付加しない。
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: 母に
  rationale: 受動表現における行為者を示すὑπό＋属格を、日本語として自然な「母に」で表した。
- source_word: Δός μοι
  choice: 私にください
  rationale: 直接的な命令を、宴席で王に向けた発言として自然な丁寧命令で表した。
- source_word: φησίν
  choice: こう言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語文では過去形が自然である。引用を導くため「こう」を添えた。
- source_word: ὧδε
  choice: ここで
  rationale: 場所を指す副詞の意味を簡潔に保持した。「今すぐ」という時間的意味は本文に明示されていないため加えていない。
- source_word: ἐπὶ πίνακι
  choice: 盆に載せて
  rationale: 宴席で料理などを載せる平たい器を指す文脈に合い、首がその上に置かれた状態で渡されることを自然な日本語で示す。
- source_word: τὴν κεφαλὴν
  choice: 首
  rationale: 日本語では切り離された人のheadを「首」と表すのが自然であり、原文の凄惨で具体的な要求を保持する。
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: バプテスマを授ける者ヨハネ
  rationale: βαπτιστήςを単なる固有名の一部にせず、ヨハネの活動を表す称号として訳した。伝統的で簡潔な呼称は脚注に残した。
theological_decisions:
- issue: βαπτιστήςというヨハネの称号の訳し方
  choice: バプテスマを授ける者ヨハネ
  alternative: バプテスマのヨハネ
  rationale: ギリシア語の行為者名詞が持つ「バプテスマを授ける者」という記述的な意味を本文で明らかにし、広く定着した伝統的呼称も脚注で示した。特定教派の用語に限定しないため「洗礼者」ではなく「バプテスマを授ける者」とした。
translation_notes:
  register: 明瞭で現代的な標準語を用いた。命令は「ください」として自然さと場面にふさわしい品位を保ち、原文の直接性と凄惨さは弱めていない。
