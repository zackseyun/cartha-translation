  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: ja
  text: しかし、イエスはすぐに彼らに語りかけられた。「しっかりしなさい。わたしだ[a]。恐れてはいけない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「わたしはある」。ここでは単純に自分がイエスであると知らせる表現として理解できるが、神の自己宣言を響かせていると受け取る人もいる。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: すぐに
  rationale: 直前の弟子たちの恐怖に対し、イエスが間を置かず応答したことを、自然な現代日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の恐怖とイエスの安心を与える言葉との穏やかな対照を示す。
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: イエスは彼らに語りかけられた
  rationale: 「彼らに話した」と直接話法を導く分詞を、日本語として重複なく自然にまとめる。敬語はイエスの発話主体としての尊重を示す。
- source_word: Θαρσεῖτε
  choice: しっかりしなさい
  rationale: 恐怖の中にいる弟子たちを励ます複数命令の力を、明瞭で自然な日本語にする。「勇気を出しなさい」も可能だが、ここでは安心を促す口調を重視した。
- source_word: ἐγώ εἰμι
  choice: わたしだ
  rationale: 文脈上の自己同定を簡潔で自然に表す。同時に、字義的な「わたしはある」が持ち得る響きを脚注に残す。
- source_word: μὴ φοβεῖσθε
  choice: 恐れることはない
  rationale: 恐怖を鎮める命令を、威圧的すぎず、威厳ある自然な日本語で表す。
theological_decisions:
- issue: ἐγώ εἰμιを単純な自己同定として訳すか、神的自己宣言への響きを前面に出すか
  choice: 本文では文脈上自然な自己同定として「わたしだ」とする。
  alternative: より字義的には「わたしはある」。また、日本語の自己同定としては「わたしだよ」もあり得る。
  rationale: 直近の文脈では、恐れる弟子たちにイエスが自分であることを知らせている。ただし、ギリシア語表現に神的自己宣言を想起させる可能性を認め、脚注で字義を保存して神学的緊張を解消しすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の緊迫感とイエスの安心を与える威厳ある口調を保った。「恐れることはない」は現代語として理解しやすく、聖書文体としても過度に古風ではない。
