  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: ja
  text: みなが食べて満腹した。そして、残ったかけらを拾い集めると、十二の籠がいっぱいになった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: 食べて
  rationale: 物語の流れに沿うアオリストとして、自然な現代日本語の連用形で表した。
- source_word: πάντες
  choice: みな
  rationale: 群衆全員を指す普遍的な範囲を、簡潔で自然な日本語で保持した。
- source_word: ἐχορτάσθησαν
  choice: 満腹した
  rationale: 十分に食べて満たされたという受動形の実質的意味を、日常的で明瞭な表現にした。
- source_word: ἦραν
  choice: 拾い集めると
  rationale: 残った物を取り上げて集めたという文脈上の動作を自然に表した。
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: 残ったパンのかけら
  rationale: 直訳的には「かけらのうち残ったもの」。κλάσμαはこの供食記事ではパンを裂いてできた断片を指すため、「パンのかけら」と明示した。
- source_word: δώδεκα κοφίνους πλήρεις
  choice: 十二の籠いっぱい
  rationale: 数量と、各籠が満ちた結果を自然な日本語で表現した。
theological_decisions:
- issue: 奇跡による供給の結果を示す満腹の表現
  choice: 満腹した
  alternative: 十分に食べた／満たされた
  rationale: 本文は奇跡の意味を解説せず、全員が十分に食べた結果を平明に述べる。「満腹した」はその事実を過不足なく伝え、追加の神学的解釈を持ち込まない。
translation_notes:
  register: 明瞭な現代標準語。叙事の簡潔さと品位を保ち、「籠」はκόφινοςの一般的な意味として採用した。
