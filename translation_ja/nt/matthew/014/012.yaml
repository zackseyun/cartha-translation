  source_fidelity: 原文の動作の連続（弟子たちが来る／遺体を取り扱う／葬る／イエスのもとへ行って報告する）を忠実に伝えている。「ヨハネの弟子たち」は文脈上明白な指示対象を自然な日本語で明示したものであり、意味を不当に限定していない。「遺体」「引き取り」「葬った」はπτῶμα、ἦραν、ἔθαψανに適切に対応する。
  naturalness: 簡潔で明快な現代標準日本語であり、死と埋葬を扱う叙述にふさわしい節度ある文体である。「それからイエスのもとへ行き、報告した」も、第二の分詞が示す移動と後続行為を自然に表している。
  terminology: 「弟子たち」「遺体」「葬った」「イエス」は定着した適切な用語・表記である。脚注は「遺体」に対する語彙上の別表現として「死体」を示し、πτῶμαが死んだ身体を指すことを正確に説明している。
