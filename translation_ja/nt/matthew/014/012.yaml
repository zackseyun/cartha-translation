id: MAT.14.12
reference: Matthew 14:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: ja
  text: ヨハネの弟子たちはやって来て、その遺体[a]を引き取り、葬った。それからイエスのもとへ行き、報告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「死体」。ギリシア語は、死んだ体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: やって来て
  rationale: 弟子たちがその場に来て行動を始めたことを、自然な現代日本語で表す。
- source_word: μαθηταὶ αὐτοῦ
  choice: ヨハネの弟子たち
  rationale: 直前の文脈で指示対象はバプテスマのヨハネである。日本語の「彼の弟子たち」ではイエスを指すとの誤読が生じやすいため、文脈上の指示対象を明示した。
- source_word: ἦραν
  choice: 引き取り
  rationale: αἴρωの「持ち上げる、運び去る」という意味を、埋葬の文脈に適した簡潔な日本語で表した。
- source_word: πτῶμα
  choice: 遺体
  rationale: 死体を意味する語。物語の尊厳を保ちつつ、死んだ身体であることを明確に示す現代日本語として「遺体」を採用した。
- source_word: ἔθαψαν αὐτόν
  choice: 葬った
  rationale: θάπτωの意味を直接表し、墓に納めたなど原文にない細部は加えない。目的語は前節の「遺体」から自然に理解できる。
- source_word: ἐλθόντες
  choice: それからイエスのもとへ行き
  rationale: 分詞が示す次の移動と出来事の順序を、日本語の自然な連続動作として表した。
- source_word: ἀπήγγειλαν
  choice: 報告した
  rationale: 出来事を知らせるというἀπαγγέλλωの意味を保つ。報告内容は原文同様に明示せず、文脈に委ねた。
- source_word: τῷ Ἰησοῦ
  choice: イエスのもとへ
  rationale: 日本語で報告の相手と移動先を自然に示した。人名は標準的な表記「イエス」とした。
theological_decisions:
- issue: 「その弟子たち」の指示対象
  choice: バプテスマのヨハネの弟子たち
  alternative: イエスの弟子たち
  rationale: 直前の物語はヨハネの処刑を扱い、遺体を引き取って埋葬する弟子たちは文脈上ヨハネの弟子たちである。ギリシア語自体は代名詞を用いるが、日本語では曖昧さが不自然に増すため名を補った。
translation_notes:
  register: 明快で現代的かつ荘重な物語文。「遺体」「葬った」により場面にふさわしい敬意を保ち、短い動詞の連鎖で原文の簡潔な進行を再現した。
