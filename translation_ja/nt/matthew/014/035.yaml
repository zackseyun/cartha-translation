id: MAT.14.35
reference: Matthew 14:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: ja
  text: その土地の男たちは、イエスだと気づくと、周辺一帯に使いを送り[a]、病気の人を皆、イエスのもとに連れて来た[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その周辺一帯に送った」。ギリシア語では、何を、または誰を送ったのかが明示されておらず、「知らせ」または「使い」が含意されていると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「具合の悪い人を皆」。病気の人を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες αὐτόν
  choice: イエスだと気づくと
  rationale: ἐπιγινώσκωは、この文脈では広い意味で「知る」ことではなく、目の前の人物がイエスだと見分けることを表す。「気づく」は現代日本語として自然であり、目的語の代名詞は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: その土地の男たちは
  rationale: ἀνήρの男性を指す語義を保って「男たち」とし、τόποςは当地を指す自然な表現として「土地」とした。
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: 周辺一帯に使いを送り
  rationale: ἀποστέλλωの目的語はギリシア語本文では明示されていないが、日本語として自然にするため「使い」を補った。περίχωροςは「周辺一帯」とした。補われうる内容の曖昧さは脚注に示した。
- source_word: προσήνεγκαν αὐτῷ
  choice: イエスのもとに連れて来た
  rationale: ここでのπροσφέρωは人々をイエスのところへ連れて来る意であり、供え物をささげる意味ではない。日本語では「連れて来た」が自然である。
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: 病気の人を皆
  rationale: κακῶς ἔχεινは直訳すれば「悪い状態にある」だが、病気であることを意味する慣用句なので、簡潔に「病気の人」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の男性名詞は「男たち」として保持し、省略された送る対象については本文を自然にする最小限の補足を行い、原文上の曖昧さを脚注で明示した。
