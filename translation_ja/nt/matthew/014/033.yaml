id: MAT.14.33
reference: Matthew 14:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: ja
  text: すると、舟にいた者たちはイエスを礼拝し[a]、「本当に、あなたは神の子です[b]」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの前にひれ伏し」または「イエスに敬意を表し」。ギリシア語の動詞は、ひざまずいたり、ひれ伏したりして崇敬を表すことを意味し得る。ここでは文脈から「礼拝し」とした。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「神の子」。ギリシア語では「神」に冠詞がないが、この文脈では単に「神の子の一人」という意味ではなく、称号として機能している。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: すると、…者たちは
  rationale: δέはここでは強い対立ではなく、直前の出来事を受けた物語の進展を示す。「すると」はその流れを自然な現代日本語で表す。
- source_word: ἐν τῷ πλοίῳ
  choice: 舟にいた
  rationale: 場所を表すἐνを、人物を修飾する自然な日本語にした。πλοῖονは文脈に即して「舟」と訳す。
- source_word: προσεκύνησαν αὐτῷ
  choice: イエスを礼拝し
  rationale: προσκυνέωは、ひれ伏すこと、敬意を表すこと、礼拝することを表し得る。海に対する権威の顕示と直後の告白を踏まえ、本文では「礼拝する」が最も適切。ただし動作・敬意に重点を置く別訳を脚注に示す。代名詞αὐτῷは、日本語で指示対象を明確にするため「イエス」とした。
- source_word: λέγοντες
  choice: 「…」と言った
  rationale: 付帯状況を表す分詞を、日本語として自然な定動詞表現にした。
- source_word: Ἀληθῶς
  choice: 本当に
  rationale: 告白の確信を明瞭かつ自然に表す。「まことに」も可能だが、現代の一般読者に分かりやすい「本当に」を採用した。
- source_word: θεοῦ υἱὸς
  choice: 神の子
  rationale: 冠詞のない属格θεοῦとυἱόςの結び付きを、日本語の定着した称号「神の子」で表す。ギリシア語で冠詞がないこと自体は「神の子の一人」という不定の意味を要求しない。
- source_word: εἶ
  choice: あなたは…です
  rationale: 二人称単数のコピュラを、直接の告白として明確な丁寧体で表した。
theological_decisions:
- issue: イエスに向けられたπροσκυνέωの意味
  choice: 「イエスを礼拝し」
  alternative: 「イエスの前にひれ伏し」／「イエスに敬意を表し」
  rationale: 語そのものには身体的な伏礼や臣従の意味幅があるが、イエスが海を支配した直後であり、「神の子」という告白も伴うため、「礼拝」が文脈上の力をよく伝える。語彙上の幅は脚注に残す。
- issue: θεοῦ υἱὸςの定性と称号性
  choice: 「神の子」
  alternative: 「神の子の一人」
  rationale: 無冠詞であってもギリシア語では不定とは限らない。この告白の文脈では称号的・質的な表現であり、日本語の「神の子」がその力を保つ。「一人」を加えると原文にない不定性を持ち込む。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、告白場面にふさわしい品位を保った。「舟」は聖書叙述に自然で、現代の読者にも理解しやすい表記。「本当に」は古風な「まことに」より平明でありながら、Ἀληθῶςの確信を保持する。すべての脚注記号を該当箇所に付した。
