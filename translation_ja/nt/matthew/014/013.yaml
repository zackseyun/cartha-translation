source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: ja
  text: イエスはこのことを聞くと、舟でそこから人里離れた場所[a]へ、ひとりで退かれた。群衆は、それを聞くと、町々[b]から歩いてイエスの後を追った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寂しい場所」または「荒れ野」とも訳せる。ギリシア語は、人の住んでいない孤立した場所を表し、必ずしも砂漠を意味しない。
    reason: lexical_alternative
  - marker: b
    text: 「町々」は「都市」とも訳せる。ギリシア語は、文脈によって町または都市を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: このことを聞くと
  rationale: アオリスト分詞を時間的に訳し、δέは強い対立ではなく物語の展開を示すため、日本語では文脈上自然な形にした。「このこと」は直前の知らせを受けるが、聞いた内容を本文以上に特定しない。
- source_word: ἀνεχώρησεν
  choice: 退かれた
  rationale: 単なる移動だけでなく、その場から身を引く含みを保つ。敬語は現代日本語の聖書文体として自然な範囲にとどめた。
- source_word: ἐκεῖθεν ἐν πλοίῳ
  choice: 舟でそこから
  rationale: 出発点と移動手段を簡潔かつ自然に示す。
- source_word: εἰς ἔρημον τόπον
  choice: 人里離れた場所
  rationale: ἔρημοςは必ずしも砂漠ではなく、人の住んでいない孤立した場所を指しうるため、地形を限定しない訳を選んだ。
- source_word: κατ’ ἰδίαν
  choice: ひとり
  rationale: 人々から離れた私的な状態を簡潔に表す。動機や目的は補わない。
- source_word: ἀκούσαντες οἱ ὄχλοι
  choice: 群衆はそのことを聞き
  rationale: 分詞の時間的関係を自然な日本語で表し、複数形ὄχλοιは日本語では集合的な「群衆」とした。
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスの後を追った
  rationale: ここでは弟子として従うという神学的意味を必要以上に読み込まず、実際に後を追って移動したことを明確にする。
- source_word: πεζῇ
  choice: 歩いて
  rationale: 徒歩で移動したことを現代日本語で自然に表す。
- source_word: ἀπὸ τῶν πόλεων
  choice: 町々から
  rationale: πόλιςは町にも都市にも用いられる。ガリラヤの文脈に合う自然な表現として「町々」を採り、複数も保った。
theological_decisions:
- issue: イエスが退いた理由
  choice: 理由を明示せず、「このことを聞くと…退かれた」とだけ訳す。
  alternative: 危険を避けるため、悲しむため、祈るためなどの目的を補う。
  rationale: 本文は知らせを聞いた後に退いたことと、ひとりであったことを述べるが、その動機を明言していないため、解釈上の余地を保つ。
- issue: 群衆が「従った」ことの含意
  choice: 物理的な移動として「後を追った」と訳す。
  alternative: 弟子としての信従を含ませて「従った」と訳す。
  rationale: この文脈では徒歩でイエスを追って行った行動が前景化されており、本文だけでは弟子としての信従まで断定できない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの動作には自然で節度ある敬語を用いた。「ところが」で群衆が静かな場所にも追って来た展開上の対照を示した。脚注記号は該当語の直後に配置した。
