base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: ja
  text: 群衆を解散させてから、イエスはひとりで祈るために山に登られた。夕方になると、イエスはそこにひとりでおられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσας τοὺς ὄχλους
  choice: 群衆を解散させると
  rationale: アオリスト分詞の先行動作を自然な時間関係として表し、複数形のὄχλουςは日本語で集合を表す「群衆」とした。
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: 山に登られた
  rationale: 山の方へ上って行く動きを簡潔な現代日本語で表した。文脈上の主語イエスを明示し、福音書本文にふさわしい敬体ではない尊敬表現を用いた。
- source_word: κατ’ ἰδίαν
  choice: ひとりで
  rationale: 「人々から離れて」「私的に」という意味を含みつつ、この場面では単独で祈りに向かうことを最も自然に表す。
- source_word: προσεύξασθαι
  choice: 祈るため
  rationale: 不定詞の目的用法を明確に表した。
- source_word: ὀψίας δὲ γενομένης
  choice: 夕方になっても
  rationale: 属格独立構文の時間的推移を表し、後続の「ひとりでいた」との継続的な対照を自然な日本語で示した。δέの軽い展開も「も」によって反映した。
- source_word: μόνος ἦν ἐκεῖ
  choice: そこにひとりでおられた
  rationale: μόνοςの孤独・単独性とἐκεῖの場所指示を保持した。
