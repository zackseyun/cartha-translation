lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 弟子たちが食べ物の乏しさを述べた直後、それに応じてイエスが命じる対照を自然に示す弱い逆接として訳した。
- source_word: εἶπεν
  choice: イエスは言った
  rationale: 主語は文脈上イエスであり、日本語では明示する方が分かりやすい。動詞自体に命令を付加せず、単純に「言った」とした。
- source_word: Φέρετέ
  choice: 持って来なさい
  rationale: 複数の聞き手に対する現在能動命令であり、品物を話者のもとへ運ぶ意味を自然な現代日本語で表した。
- source_word: μοι
  choice: わたしのところへ
  rationale: 与格が示すイエスへの方向を、自然な日本語で明示した。
- source_word: ὧδε
  choice: ここに
  rationale: 場所を表す副詞の意味を保持した。「わたしのところへ」との併記も、原文の空間的・人的焦点を保つ。
- source_word: αὐτούς
  choice: それを
  rationale: 文脈上、前節のパンと魚をまとめて指す。日本語では無生物を受ける「それを」が自然であり、指示対象の説明は脚注に置いた。
