source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: ja
  text: そして、彼の首は大皿[a]に載せて運ばれ、少女に渡された。少女はそれを母親のもとへ持って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「盆」または「料理用の平皿」とも訳せる。ギリシア語のπίναξは、料理などを載せる大皿や盆を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: 運ばれ
  rationale: φέρωのアオリスト受動態。受動の形を保ちつつ、首が大皿に載せられた状態で運ばれて来たという場面を、自然な現代日本語で表す。
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: 彼の首
  rationale: 原文の名詞句を婉曲化せず、そのまま明確に訳す。
- source_word: ἐπὶ πίνακι
  choice: 大皿に載せて
  rationale: πίναξは料理などを載せる平たい大皿や盆を指す。日本語では、物がその上に置かれた状態を自然に示すため「大皿に載せて」とした。
- source_word: ἐδόθη
  choice: 渡された
  rationale: δίδωμιのアオリスト受動態。「与えられた」よりも、この場面で品物を手渡す動作として自然であり、受動態も保持する。
- source_word: τῷ κορασίῳ
  choice: 少女に
  rationale: κοράσιονは少女、若い娘を指す。「少女」は簡潔で現代的であり、年若い女性であることも伝える。
- source_word: ἤνεγκεν
  choice: 持って行った
  rationale: φέρωのアオリスト能動態。移動の到達先が母親であるため、日本語では「持って行った」が自然。目的語「それ」を補い、直前の首を指すことを明確にする。
- source_word: τῇ μητρὶ αὐτῆς
  choice: 母親のもとへ
  rationale: 少女自身の母親を指す所有関係を文脈上自然に示し、移動の到達先として訳す。
