  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: ja
  text: そこで彼は、彼女に、彼女が求めるものは何でも与えると、誓いを立てて約束した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼女が何を求めても」。ギリシア語は不定関係節を用い、これからなされる要求の内容が限定されていないことを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: そこで
  rationale: 先行する出来事を受け、その結果として次の行為が起こったことを示す推論的・結果的な接続を、自然な物語文で表した。
- source_word: μετὰ ὅρκου
  choice: 誓いを立てて
  rationale: 属格を伴う前置詞句が、約束が誓約をもってなされたことを表すため。現代日本語として自然で、厳粛さも保つ。
- source_word: ὡμολόγησεν
  choice: 約束した
  rationale: ここでは告白ではなく、相手に対して確約する意味。続く不定詞 δοῦναι の内容を受ける表現として適切である。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: 少女を指す与格の間接目的語。日本語では約束の相手を「彼女に」と表す。本文では語順上、「彼女が」と重なる不自然さを避けつつ、文全体で相手が明らかになる形にした。
- source_word: δοῦναι
  choice: 与える
  rationale: 約束の内容を示すアオリスト不定詞であり、直接的に「与える」と訳した。
- source_word: ὃ ἐὰν αἰτήσηται
  choice: 彼女が求めるものは何でも
  rationale: 関係代名詞に ἐάν と接続法が続く不定関係節で、将来の要求内容が限定されていないことを表す。「ものは何でも」によってその開放性を自然に保持した。
