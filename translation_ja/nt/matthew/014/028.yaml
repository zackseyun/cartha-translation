  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: ja
  text: ペトロはイエスに答えた。「主よ、あなたでしたら、私が水の上をあなたのもとに行くよう、お命じください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: そこでペトロはイエスに答えた
  rationale: δέを伴う応答の物語定型を、自然な現代日本語の接続「そこで」で表した。αὐτῷは文脈上イエスを指すため、曖昧な「彼に」ではなく固有名で明示した。εἶπενは日本語では「答えた」に含め、冗長な「答えて言った」を避けた。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけとキリスト論的含意の可能性をともに保ち、「先生」などに狭めない。
- source_word: εἰ σὺ εἶ
  choice: あなたでしたら
  rationale: 目の前の人物が本当にイエスかという同定を問う表現として、自然でありつつ条件の響きを保った。
- source_word: κέλευσόν με
  choice: 私にお命じください
  rationale: κελεύωの権威ある指示という力を「命じる」で保持し、直接の呼びかけにふさわしい丁寧な依頼形とした。
- source_word: ἐλθεῖν πρὸς σὲ
  choice: あなたのところへ行くよう
  rationale: 話者ペトロの位置から日本語では「行く」が自然であり、πρὸς σέの到達方向は「あなたのところへ」で明確にした。
- source_word: ἐπὶ τὰ ὕδατα
  choice: 水の上を歩いて
  rationale: 日本語では移動の経路を「水の上を」と表すのが自然。原文に「歩く」に相当する語はないが、直前の文脈でイエスが水上を歩いており、単なる「水の上を行く」より意味が明瞭になる。
theological_decisions:
- issue: ペトロがイエスをκύριεと呼ぶことの含意
  choice: 「主よ」と訳す
  alternative: 「先生」「ご主人様」
  rationale: 単なる敬称に限定せず、マタイ福音書におけるキリスト論的な重みの可能性を保つ一方、この一語だけで完全な信仰告白と断定しない。
- issue: εἰ σὺ εἶの条件表現
  choice: 「あなたでしたら」と条件の形を保つ
  alternative: 「あなたなのですから」
  rationale: ペトロの言葉にある確認・条件の緊張を、確信へと読み替えずに残す。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。ペトロの発言は丁寧だが切迫した願いとして表現した。日本語として不自然な複数形「水々」は用いず、「水」とした。
