review_pass:
  verdict: revise
  source_fidelity: 「解散させようとされた」は、ἀπολύσῃ（アオリスト接続法）が示す将来の時点までという時間関係を、単なる意図・試みへと変えてしまっている。本文は、イエスが群衆を解散させるまで弟子たちを先に行かせたことを述べる。
  naturalness: 全体として自然で明瞭だが、「その間に、ご自分は…しようとされた」は日本語としても冗長で、原文の時間的限定を正確に表していない。時間節を明示する形が自然である。
  terminology: 「イエス」「弟子たち」「舟」「向こう岸」「群衆」は明瞭な現代標準日本語として適切である。「強いて」はἠνάγκασενの強い働きかけをよく保持している。
  issues:
  - severity: medium
    issue: 「解散させようとされた」が、群衆を解散させるという行為を意図・試みとして表している。
    rationale: ἕως οὗ ἀπολύσῃは「（ご自分が）群衆を解散させるまで」という将来を見込んだ時間的限界を表す。原文には「しようとした」に相当する意志・試行の表現はない。
  revised_text: イエスはすぐに、群衆を解散させるまで、弟子たちを強いて舟に乗り込ませ、ご自分より先に向こう岸へ行かせた。
