source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: ja
  text: イエスはすぐに、群衆を解散させるまで、弟子たちを強いて舟に乗り込ませ、ご自分より先に向こう岸へ行かせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: それからすぐ
  rationale: 直前の出来事からの速やかな移行を示す副詞の意味を、自然な物語表現で伝える。
- source_word: ἠνάγκασεν
  choice: 強いて
  rationale: 単に勧めたのではなく、強い働きかけや必要性をもって行わせたという語の力を保ちつつ、物理的暴力までは含意しない。
- source_word: τοὺς μαθητάς
  choice: 弟子たち
  rationale: 定冠詞は文脈上既知の弟子たちを指す。日本語では所有表現を補わなくても指示対象が明瞭である。
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: 舟に乗り込ませ
  rationale: 舟に入る、すなわち乗船する動作を、明瞭で自然な現代日本語で表した。
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖上の比較的小型の船を指す文脈に合い、聖書物語でも一般読者に分かりやすい。
- source_word: προάγειν αὐτόν
  choice: ご自分より先に……行かせた
  rationale: 弟子たちがイエスに先行するという目的語関係を明示し、自然な日本語の敬意表現を用いた。
- source_word: εἰς τὸ πέραν
  choice: 向こう岸へ
  rationale: 水域の反対側を指す定型的表現を、簡潔で自然な日本語にした。
- source_word: ἕως οὗ ἀπολύσῃ
  choice: その間に……解散させようとされた
  rationale: 主動作に続く、群衆を送り出すまでの時間的枠組みと、接続法が示す未完了・前望的な性格を、過度に硬い直訳を避けて表した。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語の集合名詞「群衆」で複数の集まりを自然に表現できる。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文にふさわしい端正さを保った。「強いて」によりイエスの強い指示を弱めず、「その間に……ようとされた」により後続行為の前望的な時間関係を自然に表現した。
