  to: イエスはすぐに、群衆を解散させるまで、弟子たちを強いて舟に乗り込ませ、ご自分より先に向こう岸へ行かせた。
  rationale: 「群衆を解散させるまで」を明示し、ἕως οὗ ἀπολύσῃの前望的な時間関係を保った。「強いて」「舟に乗り込ませ」「ご自分より先に向こう岸へ行かせた」は、それぞれἠνάγκασεν、ἐμβῆναι εἰς πλοῖον、προάγειν αὐτὸν εἰς τὸ πέρανを自然な現代日本語で反映する。
