  terminology: 「舟」はガリラヤ湖の文脈に適切で、「スタディオン」は原文の距離単位を保持している。脚注aはγῆの文脈的代替訳を、脚注bは単位の必要最小限の説明を、脚注cはβασανιζόμενονの自然な訳語の代替を適切に示す。神学用語・固有名に関する問題はない。
