id: MAT.14.24
reference: Matthew 14:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: ja
  text: しかし、舟はすでに陸地から何スタディオンも離れており[a][b]、波に激しく打たれていた[c]。向かい風だったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「岸から」とも訳せる。ギリシア語は直訳すると「陸地から」。
    reason: lexical_alternative
  - marker: b
    text: 一スタディオンは古代の距離単位で、約一八五メートル。
    reason: cultural_note
  - marker: c
    text: 「波にもまれていた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖を渡る場面に合い、大型船を連想させすぎない、自然で簡潔な語を選んだ。
- source_word: ἤδη
  choice: すでに
  rationale: 物語のこの時点までに状況が進展していたことを、そのまま明確に表す。
- source_word: σταδίους πολλοὺς
  choice: 何スタディオンも
  rationale: 原文が古代の距離単位を明記しているため、曖昧な「かなりの距離」に置き換えず、単位を保持した。具体的な長さは脚注で説明する。
- source_word: ἀπὸ τῆς γῆς
  choice: 陸地から
  rationale: γῆの基本的な意味を保ちつつ、水上の舟との対照が明瞭になる。「岸から」という文脈上自然な訳は脚注に示す。
- source_word: ἀπεῖχεν
  choice: 離れており
  rationale: 空間的な隔たりを現代日本語として自然に表し、後続の分詞句にも滑らかにつなげる。
- source_word: βασανιζόμενον
  choice: 激しく打たれていた
  rationale: βασανίζωの強い苦しめ・圧迫のニュアンスを、舟に波が作用する海上の文脈に即して物理的に表現した。
- source_word: ὑπὸ τῶν κυμάτων
  choice: 波に
  rationale: 受動表現の作用主体である波を、簡潔で自然な日本語で示した。
- source_word: ἐναντίος
  choice: 向かい風
  rationale: 風が進行を妨げる方向から吹いていたことを、対象を不必要に補わず簡潔に表す。
- source_word: δὲ
  choice: しかし
  rationale: イエスのいる陸上から、困難な状況にある舟へと場面を移す、緩やかな対照を示す。
- source_word: γάρ
  choice: からである
  rationale: 舟が波に激しく打たれていた理由を説明する接続関係を明示する。
theological_decisions: []
