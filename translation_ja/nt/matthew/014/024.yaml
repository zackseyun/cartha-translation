  source_fidelity: 「舟」「すでに」「陸地から何スタディオンも離れており」は、τὸ πλοῖον、ἤδη、σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχενを正確に反映している。「波に激しく打たれていた」は、この海上の文脈におけるβασανιζόμενον ὑπὸ τῶν κυμάτωνの強い受動的な圧迫・打撃を自然に表す。「向かい風だったからである」も、ἦν γὰρ ἐναντίος ὁ ἄνεμοςの説明関係と、舟の進行を妨げる風という含意を適切に伝える。
