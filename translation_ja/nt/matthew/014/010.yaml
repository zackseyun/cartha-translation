id: MAT.14.10
reference: Matthew 14:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πέμψας ἀπεκεφάλισεν ⸀τὸν Ἰωάννην ἐν τῇ φυλακῇ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: ja
  text: そして、人を遣わして、牢の中でヨハネの首をはねた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「そして、遣わして、牢の中でヨハネの首をはねた」。ギリシア語では、アオリスト分詞「遣わして」に主動詞「首をはねた」が続く。
    reason: 原文の統語構造と、「人を」という補足を明示するため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 物語を継続する単純な接続辞。現代日本語として自然に前後をつなぎ、余分な因果関係は加えない。
- source_word: πέμψας
  choice: 人を遣わして
  rationale: πέμπωのアオリスト分詞。主動詞に先立って使者または執行者を派遣したことを表す。目的語は明示されていないが、日本語では「遣わして」だけでは不自然になりやすいため、最小限の補足として「人を」を加えた。
- source_word: ἀπεκεφάλισεν
  choice: 首をはねた
  rationale: ἀποκεφαλίζωの具体的な意味を、明瞭で一般的な現代日本語にした。ギリシア語は行為を文法上の主語に帰しているため、「首をはねるよう命じた」と解釈的に言い換えない。
- source_word: τὸν Ἰωάννην
  choice: ヨハネ
  rationale: 本文にある固有名のみを訳し、文脈上明らかな「バプテスマのヨハネ」などの説明は加えない。
- source_word: ἐν τῇ φυλακῇ
  choice: 牢の中で
  rationale: φυλακήがここでは拘禁場所を指すことを明確にし、具体的な場所を表す定冠詞付きの句も「中で」によって自然に反映した。
theological_decisions:
- issue: ヘロデ本人による直接執行か、派遣された者を介した執行か
  choice: 「人を遣わして、…首をはねた」とし、主語への行為の帰属と媒介者の存在をともに保持する。
  alternative: 「ヨハネの首をはねるよう命じた」
  rationale: アオリスト分詞 πέμψας は誰かを派遣したことを示す一方、定動詞 ἀπεκεφάλισεν は行為を主語に帰す。命令だけに限定すると、原文の表現を解釈的に狭める。
translation_notes:
  register: 明瞭で現代的ながら、聖書物語にふさわしい簡潔で重みのある文体。「刑務所」よりも時代背景と叙述の調子に合う「牢」を採用した。
