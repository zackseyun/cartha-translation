lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: そのころ
  rationale: 時間を示す慣用句を、文脈の流れに合う自然な現代日本語で表した。
- source_word: ἤκουσεν
  choice: 耳にした
  rationale: ἀκούωの基本的な「聞く」という意味を保ちつつ、評判や知らせを聞いた場合に自然な日本語とした。
- source_word: Ἡρῴδης
  choice: ヘロデ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ὁ τετραάρχης
  choice: 領主
  rationale: τετραάρχηςはローマ支配下で一定地域を治める支配者の称号である。「四分領主」より一般読者に分かりやすく、単なる「王」として歴史的地位を誤認させない表現を選んだ。
- source_word: τὴν ἀκοὴν
  choice: 評判
  rationale: ここでは聴覚ではなく、広まって伝え聞かれる事柄を指す。イエスの活動について聞こえてきた報告という文脈に合う。
- source_word: Ἰησοῦ
  choice: イエスについての
  rationale: 属格を、報告内容の対象を示す自然な日本語として訳した。
