  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: ja
  text: すると、イエスはすぐに手を伸ばして彼をつかみ、彼に言われた。「信仰の薄い者よ、なぜ疑ったのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なぜためらったのか」または「なぜ心が揺れたのか」とも訳せる。ギリシア語の動詞は、疑うことのほか、ためらいや心の揺れも表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: するとすぐに
  rationale: 行動の即時性と、直前の出来事を受ける物語の流れを自然な現代日本語で表す。
- source_word: δὲ
  choice: すると
  rationale: 弱い継続・転換を、文脈に即した自然な接続として表す。強い逆接にはしない。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 手を伸ばして
  rationale: 具体的な動作と、後続する『つかむ』までの動作順を保つ。
- source_word: ἐπελάβετο αὐτοῦ
  choice: 彼をつかみ
  rationale: 救助のために相手をしっかりととらえる動作を簡潔に表し、『捕らえる』という不適切な含意を避ける。
- source_word: λέγει αὐτῷ
  choice: 言われた
  rationale: ギリシア語の歴史的現在を、日本語の自然な物語時制と敬意を備えた表現で訳す。
- source_word: Ὀλιγόπιστε
  choice: 信仰の薄い者よ
  rationale: 信仰が皆無なのではなく不足しているという呼びかけを保つ。現代日本語でも理解しやすく、荘重さもある。
- source_word: εἰς τί
  choice: なぜ
  rationale: 理由を問う表現として最も自然で明瞭な日本語。
- source_word: ἐδίστασας
  choice: 疑った
  rationale: 文脈に合う基本的な意味を明瞭に示しつつ、ためらい・心の揺れという語義上の幅を脚注に残す。
theological_decisions:
- issue: Ὀλιγόπιστε と πίστις の関係
  choice: 信仰の薄い者よ
  alternative: 信仰の小さい者よ／信仰の少ない者よ
  rationale: ペトロを不信仰者と断定せず、信仰の不足を叱責する原文の度合いを保つ。『薄い』は日本語として自然で、全く信仰がないとの過剰な解釈を避ける。
- issue: ἐδίστασας の意味の幅
  choice: 疑った
  alternative: ためらった／心が揺れた
  rationale: 疑いを表す中心的な訳語を本文に置きながら、定まらず揺れるニュアンスを脚注で明示し、心理状態を一義的に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの呼びかけには簡潔で品位ある調子を保った。歴史的現在は日本語の自然な物語文に合わせて過去形とした。
