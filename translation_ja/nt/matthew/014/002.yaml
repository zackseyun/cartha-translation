id: MAT.14.2
reference: Matthew 14:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: ja
  text: そして、仕える者たちに言った。「この人はバプテスマを授けるヨハネだ。彼は死者の中からよみがえらされたのだ。このため、力〔a〕が彼のうちで働いているのだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παισὶν
  choice: 家臣たち
  rationale: παῖςは子ども、僕、従者などを意味し得るが、ここでは領主ヘロデに仕える身近な者たちを指す。「家臣」は宮廷内の関係を自然に表しつつ、役職を過度に限定しない。
- source_word: ὁ βαπτιστής
  choice: バプテスマを授ける人
  rationale: 語の働きを現代日本語で明確に示し、単なる称号の音写にとどめない表現とした。
- source_word: ἠγέρθη
  choice: よみがえらされた
  rationale: アオリスト受動態の形を保ち、ヨハネが自力でよみがえったという含みを避ける。
- source_word: ἀπὸ τῶν νεκρῶν
  choice: 死者の中から
  rationale: ἀπόと複数形τῶν νεκρῶνの意味を明示し、自然な日本語の範囲で原文の「死者たちの中から」という構図を保つ。
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 直前の復活という主張を理由とする因果関係を、明瞭で自然な現代日本語にした。
- source_word: αἱ δυνάμεις
  choice: あの力ある業
  rationale: 文脈では超自然的な力が現れた業を指す。抽象的な「力」だけにも、結果としての「奇跡」だけにも限定せず、力とその顕現の双方を伝える。定冠詞は、ヘロデが耳にした業を指すものとして「あの」で表した。
- source_word: ἐνεργοῦσιν
  choice: 働いている
  rationale: 現在形の継続的・現実的な作用を自然に表す。
- source_word: ἐν αὐτῷ
  choice: 彼のうちに
  rationale: ἐνの基本的な空間・領域の意味を保ち、「彼を通して」と解釈的に言い換えない。
theological_decisions:
- issue: ヨハネの復活についての受動表現
  choice: 彼は死者の中からよみがえらされた
  alternative: 彼は死者の中からよみがえった
  rationale: 原文の受動態を保持する。誰がよみがえらせたかは明記せず、ヘロデの発言以上の教理的説明を加えない。
- issue: δυνάμειςの意味
  choice: あの力ある業が彼のうちに働いている
  alternative: あの奇跡の力が彼のうちに働いている／奇跡が彼によって行われている
  rationale: 超自然的な意味合いは文脈上明らかだが、「力」とその現れである「業」の緊張を残し、「奇跡」や「彼を通して」へ一義的に解釈しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「バプテスマを授ける人」は語義を伝える表現とし、「よみがえらされた」で原文の受動態を保った。発言者ヘロデの誤った推測であることを訳文内で訂正せず、そのまま提示した。
