id: MAT.14.6
reference: Matthew 14:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: ja
  text: さて、ヘロデの誕生日の祝いが行われたとき[a]、ヘロディアの娘がその場の中央で踊り、ヘロデを喜ばせた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヘロデの誕生日になったとき」または「ヘロデの誕生祝いの席で」。ギリシア語は、ヘロデの誕生日を祝う機会を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「中央で」。集まりの中で踊ったという意味である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: ヘロデの誕生日の祝いの日になり
  rationale: γενέσιαは誕生日そのものだけでなく、その祝いの機会を指しうる。分詞 γενομένοις を時間表現として自然な日本語にし、祝宴とまでは限定しなかった。
- source_word: δὲ
  choice: ところが
  rationale: 物語を進めつつ、直前の状況からの軽い転換・対照を表す。
- source_word: ὠρχήσατο
  choice: 踊って
  rationale: ὀρχέομαι の直接的な意味を、現代日本語で簡潔に表した。演目の性質は本文以上に特定しない。
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ヘロディアの娘
  rationale: 属格関係を自然に訳し、本文にない娘の名は補わない。
- source_word: ἐν τῷ μέσῳ
  choice: 人々の真ん中で
  rationale: 直訳は「真ん中で／ただ中で」。文脈上、集まった人々の中で踊ったことを示す自然な表現とし、解釈を脚注で明示した。
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: ヘロデを喜ばせた
  rationale: ἀρέσκω と与格の基本的意味を自然な日本語で表す。「気に入られた」よりも原文の能動的な構造を保つ。
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: ヘロデ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての品位を保った。「誕生日の祝いの日」は祝いの機会を示しつつ「祝宴」への限定を避ける。「人々」は文脈上の補足であるため、直訳を脚注に残した。
