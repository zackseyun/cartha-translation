source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: ja
  text: 食べた者は、女性と子どもを数に入れず、約五千人の男性であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: 食べた者は
  rationale: 冠詞付き現在分詞を名詞的に取り、食事にあずかった人々を指す表現として自然に訳した。δέは軽い談話接続であり、日本語では文脈上あえて明示しない。
- source_word: ἦσαν
  choice: であった
  rationale: 未完了過去の連結動詞で、人数を述べる単純な叙述として訳した。
- source_word: ἄνδρες
  choice: 男
  rationale: 女性と子どもが別に言及されているため、男性を指す語義を保持した。文脈上、人数を数える表現として「男」が簡潔で明確である。
- source_word: ὡσεὶ
  choice: 約
  rationale: 概数であることを明確に示す、自然で簡潔な日本語を選んだ。
- source_word: πεντακισχίλιοι
  choice: 五千人
  rationale: 人数を表す基数としてそのまま訳した。
- source_word: χωρὶς
  choice: 別にして
  rationale: 属格を伴い、女性と子どもが五千人という数に含まれていないことを示す。「別にして」は分離・除外の意味を保ちつつ自然である。
- source_word: γυναικῶν
  choice: 女
  rationale: ここでは婚姻関係ではなく人数区分を表すため、「妻」ではなく「女」とした。後続の「男」と対応する簡潔な表現である。
- source_word: παιδίων
  choice: 子ども
  rationale: 年齢を必要以上に限定せず、現代日本語で自然な総称とした。
theological_decisions:
- issue: 男女と子どもを含む群衆のうち、男性だけを数える表現
  choice: ἄνδρεςを「男」と訳し、女と子どもがその数とは別であることを明記する。
  alternative: ἄνδρεςを「人々」または「人」と訳す。
  rationale: 原文は男性を表す語を用い、その後で女と子どもを明確に区別している。「人々」とすると原文の性別に関する情報と歴史的な数え方が失われる。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で品位ある叙述とした。「女性」よりも「女」を選び、「男」と並ぶ原文の簡潔な対句的区分を保った。
