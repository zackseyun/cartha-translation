id: MAT.14.26
reference: Matthew 14:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: ja
  text: しかし、弟子たちはイエスが湖の上を歩いているのを見て、取り乱し、「幽霊だ」[a]と言った。そして、恐ろしさのあまり叫び声を上げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幻影」「亡霊」。
    reason: φάντασμαが幽霊のような出現や幻影を幅広く表し得るため。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節から物語を進めつつ、イエスの行動と弟子たちの恐怖に満ちた反応との軽い対照を示す。
- source_word: οἱ μαθηταὶ ἰδόντες αὐτὸν
  choice: 弟子たちはイエスが…のを見て
  rationale: アオリスト分詞を自然な時間的表現で訳した。代名詞は日本語で指示対象が明確になるよう「イエス」とした。
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: 湖の上を歩いている
  rationale: ἐπί＋属格が水面上での歩行を表す。θάλασσαは一般に「海」だが、文脈上はガリラヤ湖を指すため、現代日本語で自然な「湖」とした。
- source_word: ἐταράχθησαν
  choice: 取り乱し
  rationale: 単に不安になったというより、目撃したものに動揺して平静を失った状態を表し、後続する叫びとも調和する。
- source_word: Φάντασμά ἐστιν
  choice: 「幽霊だ」
  rationale: φάντασμαは幽霊のような出現・幻影を指す。弟子たちの恐れに基づく判断として、分かりやすい現代語を選んだ。
- source_word: ἀπὸ τοῦ φόβου ἔκραξαν
  choice: 恐ろしさのあまり叫び声を上げた
  rationale: ἀπόの原因・源を示す働きと、κράζωの大声で叫ぶ意味を自然な日本語で表した。
theological_decisions:
- issue: 弟子たちが口にした φάντασμα の性質
  choice: 本文では「幽霊」と訳す
  alternative: 「幻影」「亡霊」
  rationale: これは弟子たちの恐怖に満ちた認識を報告する言葉であり、霊的存在の実在や性質について本文以上の教理的主張をするものではない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語の緊迫感を保った。「イエス」を補って代名詞の曖昧さを避けたが、弟子たちの誤認そのものは解消せず、そのまま提示した。
source_grounding:
  english_pob_role: consult_only
