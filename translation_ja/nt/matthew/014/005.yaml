id: MAT.14.5
reference: Matthew 14:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: ja
  text: 彼を殺したいと思っていたが、群衆を恐れた。人々が彼を預言者と見なしていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: 殺したいと思っていたが
  rationale: 分詞の基本的な願望の意味を保ちつつ、主動詞「恐れた」との文脈上の譲歩的関係を、自然な現代日本語の「が」で表した。
- source_word: ἀποκτεῖναι
  choice: 殺す
  rationale: 「死刑にする」と制度的に限定せず、動詞の直接的な意味を簡潔に表す。
- source_word: ἐφοβήθη
  choice: 恐れた
  rationale: φοβέομαι の意味を、簡潔で品位ある物語表現として訳した。
- source_word: τὸν ὄχλον
  choice: 群衆
  rationale: その場に集まった多数の人々を指す ὄχλος の標準的で明瞭な訳語。
- source_word: ὅτι
  choice: からである
  rationale: 群衆を恐れた理由を導く因果関係を明確に示す。
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: 人々が彼を預言者と見なしていた
  rationale: ἔχω と述語対格の慣用的意味「〜と見なす」を自然に表し、ὡς προφήτην の評価内容を保持する。
theological_decisions:
- issue: ギリシア語で文脈に委ねられている主語と目的語の人物名
  choice: 人物名を補わず、「彼」と文脈上の主語省略で表す
  alternative: 「ヘロデはヨハネを殺したいと思っていたが」と人物名を明示する
  rationale: 原文は代名詞を用い、人物の特定を直前の文脈に委ねているため、その形式と曖昧さを保つ。
- issue: θέλων と ἐφοβήθη の論理関係
  choice: 「〜たいと思っていたが」と譲歩・対照を明示する
  alternative: より逐語的に「彼を殺そうと望み、群衆を恐れた」
  rationale: 接続関係自体は分詞に明示されないが、殺害願望と群衆への恐れの対照は文脈から明らかであり、日本語では「が」が自然である。ただし「にもかかわらず」ほど強く解釈を固定しない。
translation_notes:
  register: 明瞭な現代標準日本語。人物名を補わず原文の代名詞表現を尊重しつつ、分詞構文は日本語として自然な対照節にした。
