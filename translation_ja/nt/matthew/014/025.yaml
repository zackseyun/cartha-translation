source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: ja
  text: 夜の第四の見張りのころ、イエスは海の上を歩いて彼らのところに来た。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「第四の見張り」は、ローマ式の夜の最後の見張りで、およそ午前3時から6時までを指す。
    reason: cultural_note
  - marker: b
    text: 「海の上を歩いて」は、水面の上を歩いたことを示す。文脈上、「海辺を歩いて」という意味ではない。
    reason: alternative_reading
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: 夜の第四の見張り時に
  rationale: 時間を表す与格句。「第四」を残して当時の夜警区分を保持しつつ、日本語として意味が通るよう「見張り時」とした。
- source_word: δὲ
  choice: （訳出せず）
  rationale: 物語を緩やかに進める接続語であり、この一節では日本語の自然な叙述の中に吸収した。
- source_word: ἦλθεν πρὸς αὐτούς
  choice: 弟子たちのところに来られた
  rationale: πρός＋対格が人々への接近を示す。文脈上の指示対象を明確にするため αὐτούς を「弟子たち」とし、イエスを主語とする叙述にふさわしい敬体ではない尊敬表現を用いた。
- source_word: περιπατῶν
  choice: 歩いて
  rationale: 主動詞と同時に進行する動作を表す現在分詞を、自然な連用形で表した。
- source_word: ἐπὶ τὴν θάλασσαν
  choice: 湖の上を
  rationale: ἐπί＋対格はここで水面上の移動を表す。θάλασσα は語義上「海」だが、対象はガリラヤ湖であり、現代日本語で地理的誤解を避けるため「湖」とした。移動経路を自然に示す助詞「を」を用いた。
theological_decisions:
- issue: イエスが水上を移動したという奇跡の描写
  choice: 湖の上を歩いて
  alternative: 湖のほとりを歩いて
  rationale: περιπατῶν ἐπὶ τὴν θάλασσαν は、文脈上、岸辺ではなく水面上の移動を示す。奇跡性を弱めず、同時に原文以上の説明も加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。歴史的な夜警区分を本文に残し、説明は脚注に置いた。原文の θάλασσα は、日本語読者に場所を明確に伝えるため本文では「湖」とした。
