source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: ja
  text: そして人々は、せめてその衣の縁[a]に触れるだけでも許してほしいと、イエスに懇願していた。そこに触れた者は皆、癒やされた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣の縁」は「へり」「端」とも訳せる。衣に付いた「房」を指す可能性もある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すっかり良くなった」「救われた」。原語は癒やされることのほか、救い出される、無事にされるという意味にもなり得る。ここでは身体の癒やしが文脈の中心である。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: 懇願した
  rationale: 未完了形が表す継続的・反復的な願いと、その切実さを、現代日本語で自然に伝える。
- source_word: ἵνα μόνον ἅψωνται
  choice: せめて…触れさせてほしいと
  rationale: ἵνα＋接続法を願いの内容として表し、μόνονが示す「それだけでも」という限定と切実さを「せめて」で伝える。
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: その上着の裾
  rationale: ἱμάτιονは外衣を指すため「上着」とし、κράσπεδονは衣の縁・裾・房を指し得るので、過度に限定しない「裾」を本文に採用する。
- source_word: ὅσοι
  choice: …者は皆
  rationale: 触れた者の全員を指す数量的・包括的な意味を、自然な日本語で表す。
- source_word: διεσώθησαν
  choice: 癒やされた
  rationale: この箇所の直接の文脈は身体的な病の回復であるため「癒やされた」とする一方、動詞が持つより広い救済・救出の含みは注に残す。
theological_decisions:
- issue: 奇跡による癒やしの文脈における διεσώθησαν の意味
  choice: 身体的に「癒やされた」
  alternative: 「救われた」「無事にされた」「すっかり良くなった」
  rationale: 直前の文脈は病人の身体的回復を扱っているため、本文では明瞭な「癒やされた」を選ぶ。ただし、原語には救出・救済を含む広い意味領域があるので、その語義上の幅を注で明示し、神学的含意を不必要に狭めない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、「懇願した」で場面の切実さと品位を保った。「触れさせてほしい」は許しを求める願いを自然に表す。本文中の代名詞 αὐτόν は、単独の節としても指示対象が明確になるよう「イエス」とした。
