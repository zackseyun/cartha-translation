id: MAT.14.15
reference: Matthew 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: ja
  text: 夕方になると、弟子たちはイエスのもとに来て言った。「ここは人里離れた場所です[a]し、もう遅い時刻です[b]。群衆が村々へ行って、自分たちのために食べ物を買えるように、帰らせてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ここは寂しい場所です」。
    reason: ἔρημοςは、人の住んでいない場所、寂しい場所、荒れた場所などを表し得る。ここでは周辺に食べ物を得られる集落がないことが焦点となっている。
  - marker: b
    text: 直訳「時刻はすでに過ぎました」。
    reason: 原文の表現を示しつつ、本文ではその慣用的な意味である時間の遅さを自然な日本語にした。
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: 夕方になると
  rationale: 属格独立構文による時間の推移を、自然な現代日本語で表した。δέの物語上の展開は「なると」の流れで十分に伝わるため、明示的な接続語は加えなかった。
- source_word: προσῆλθον αὐτῷ
  choice: イエスのもとに来た
  rationale: 「近づいた」も可能だが、προσέρχομαιの基本的な動きを自然に表す。文脈上の指示対象を明確にするため、代名詞を「イエス」とした。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 定冠詞は既知の集団を示す。日本語では「弟子たち」で自然に特定されるため、原文にない所有表現は加えなかった。
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ここは人里離れた場所です
  rationale: ἔρημοςはここでは無人または集落から離れた場所を表す。「荒れ果てた」という景観上の意味に限定せず、後続の村々との距離関係が伝わる表現を選んだ。
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: 時刻ももう遅くなりました
  rationale: 字義的には「時刻はすでに過ぎた」だが、この文脈では日が暮れかけて時間が遅いことを意味する。比喩を過度に直訳せず、時刻への言及を残した。
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: 群衆を解散させてください
  rationale: ἀπολύωはこの場面では群衆をその場から去らせること。「解散させる」は集まった群衆への指示として明確で自然である。
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: 群衆が村々へ行き…できるよう
  rationale: ἵναの目的と、ἀπελθόντεςが示す先行動作を、日本語の目的構文で自然にまとめた。「近くの」は文脈上推測できるが原文に明記されないため加えなかった。
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: 自分たちの食べ物を買える
  rationale: βρώματαを一般的な「食べ物」とし、ἑαυτοῖςの再帰的な意味を「自分たちの」で保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話には丁寧語を採用した。「イエス」は原文では代名詞だが、単独節として読んでも指示対象が明確になるよう固有名で表した。脚注記号は、それぞれ対応する語句の直後に配置した。
