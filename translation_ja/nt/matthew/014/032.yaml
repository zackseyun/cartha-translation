id: MAT.14.32
reference: Matthew 14:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: ja
  text: 二人が舟に乗り込むと[a]、風はやんだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「二人が舟へ上ると」。
    reason: ἀναβαίνωの字義的な意味と属格独立構文を示すため。
lexical_decisions:
- source_word: ἀναβάντων αὐτῶν
  choice: 二人が……乗り込むと
  rationale: 属格独立構文を自然な時の節として訳した。αὐτῶνは文脈上イエスとペトロを指すため「二人」とした。ἀναβαίνωは字義的には「上る」だが、舟への移動を表す自然な日本語として「乗り込む」を選んだ。
- source_word: εἰς τὸ πλοῖον
  choice: 舟に
  rationale: πλοῖονはガリラヤ湖で用いる舟を指す。「船」よりも規模と福音書の場面に合う「舟」を用いた。εἰςの方向性は「に」で自然に表した。
- source_word: ἐκόπασεν
  choice: やんだ
  rationale: 風が止む、静まることを表す。日本語では「風はやんだ」が簡潔で自然であり、過程を明示せずアオリストの出来事をそのまま伝える。
- source_word: ὁ ἄνεμος
  choice: 風は
  rationale: 主題を表す自然な日本語として助詞「は」を用い、定冠詞を過度に逐語化しなかった。
- source_word: καὶ
  choice: （独立した接続語なし）
  rationale: 日本語では前後の連続が「すると」によって十分示されるため、καίを機械的に「そして」とせず、自然な物語の流れにした。
theological_decisions:
- issue: イエスの自然に対する権威という物語上の含意
  choice: 二人が舟に乗り込むと風がやんだという出来事を、そのまま簡潔に訳す。
  alternative: 奇跡的な権威や因果関係を説明する語句を補う。
  rationale: 本文は時間的な連続を述べるが、その神学的意味を明示的に解説してはいない。したがって、文脈から生じる含意を保ちつつ、訳文では説明を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「乗り込む」「やんだ」により、一般の読者に自然な日本語と原文の簡潔さを両立した。
