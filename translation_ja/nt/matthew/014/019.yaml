id: MAT.14.19
reference: Matthew 14:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: ja
  text: そして、群衆に草の上に座るよう命じ、五つのパンと二匹の魚を取り、天を仰いで祝福し[a]、パンを裂いて弟子たちに渡し、弟子たちはそれを群衆に配った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「神をほめた」「祝福の祈りをささげた」。ギリシア語は、何を、または誰を祝福したのかを明示していない。
    reason: 原文で明示されないεὐλόγησενの目的語と、それに伴う解釈の幅を保存するため。
lexical_decisions:
- source_word: κελεύσας
  choice: 命じ
  rationale: 明確な指示を表す語の強さを保ちつつ、分詞の先行動作を自然な日本語の連用形で表した。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: 複数形は場面に集まった人々の集団を指すが、日本語では総称的な「群衆」が自然である。
- source_word: ἀνακλιθῆναι
  choice: 座る
  rationale: 食事のために身を横たえる意味を含むが、日本語で「横になる」とすると休息や就寝を連想しやすいため、場面を明瞭に伝える「座る」とした。
- source_word: ἐπὶ τοῦ χόρτου
  choice: 草の上に
  rationale: 原文の場所表現をそのまま簡潔に訳し、マルコにある「青い」などの情報は加えない。
- source_word: λαβὼν
  choice: 取り
  rationale: 主動作に先立つ動作を、自然な日本語の連用形で表した。
- source_word: τοὺς πέντε ἄρτους
  choice: 五つのパン
  rationale: この文脈のἄρτοςは数えられるパンを指す。「五個のパン」より聖書叙述として自然で、現代語でも理解しやすい。
- source_word: τοὺς δύο ἰχθύας
  choice: 二匹の魚
  rationale: 具体的な魚の数を自然な日本語の助数詞で示した。
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: 天を仰いで
  rationale: 上を向いて天を見る動作を簡潔で品位ある現代日本語にした。
- source_word: εὐλόγησεν
  choice: 祝福し
  rationale: 目的語を明示しない原文の構文を保ち、パンや神を目的語として補わない。日本語でも目的語なしで成立するため、曖昧さを本文に残した。
- source_word: κλάσας
  choice: パンを裂いて
  rationale: 直前のパンを暗黙の目的語として補い、食物を分ける動作を「裂く」で表した。
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: パンを裂いて弟子たちに渡された
  rationale: 明示された目的語「パン」を前の分詞と共有させ、反復を避けた。「渡された」はイエスへの敬意を示す通常の日本語で、意味内容を変更しない。
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: そして弟子たちは群衆に配った
  rationale: ギリシア語で省略されている動詞を日本語では補い、弟子たちが群衆へパンを渡したことを自然に示した。文脈上、複数の人に行き渡らせる「配った」が適切である。
theological_decisions:
- issue: εὐλόγησενの目的語
  choice: 本文では目的語を補わず「祝福し」とする
  alternative: 「神をほめた／祝福した」「祝福の祈りをささげた」または「パンと魚を祝福した」
  rationale: ギリシア語は目的語を明示していない。食前に神をたたえるユダヤ的な祝福の祈りとも、食物への祝福とも理解され得るため、本文で一方に限定せず脚注で説明する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語調とした。分詞の連続は日本語の連用形に整理した。イエスの動作には一般的な敬語「渡された」を用いたが、過度な荘重語は避けた。
