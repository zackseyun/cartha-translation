id: MAT.14.9
reference: Matthew 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: ja
  text: 王は心を痛めたが、自分が立てた誓いと、共に食卓についていた人々[a]の手前、それ[b]を与えるよう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「共に食卓で横になっていた人々」。当時は、食事の際に横になって食卓につく習慣があった。
    reason: cultural_note
  - marker: b
    text: 原文では「与える」の目的語が明示されていない。前の文脈で少女が求めたものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: 心を痛めたが
  rationale: 悲しみや苦悩を覚えたことを表す受動分詞を、後続の命令との対照が自然に伝わる譲歩表現にした。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 原文の称号をそのまま明確に訳した。
- source_word: διὰ τοὺς ὅρκους
  choice: 自分が立てた誓い…の手前
  rationale: διά＋対格の理由を示し、複数形のὅρκουςは文脈上、王自身が重ねて口にした誓いを指すため、日本語で自然な形にした。
- source_word: τοὺς συνανακειμένους
  choice: 共に食卓についていた人々
  rationale: 当時の姿勢を直訳して不自然にせず、同じ食事の席にいた人々という意味を明確にした。
- source_word: ἐκέλευσεν
  choice: 命じた
  rationale: 権威をもって指示するという語義を簡潔に表した。
- source_word: δοθῆναι
  choice: それを与えるよう
  rationale: 受動不定詞の意味を自然な日本語で示しつつ、何を与えるかを原文同様に明示せず、前の文脈を受ける「それ」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準語。「心を痛めたが」で王の悲しみと、その後の命令との緊張を保ち、「人々の手前」によって同席者を意識した社会的圧力を自然に表現した。
