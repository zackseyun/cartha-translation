lexical_decisions:
- source_word: διαπεράσαντες
  choice: 湖を渡り
  rationale: アオリスト能動分詞で、主動詞に先立つ行為を表す。文脈上は湖を渡ったことが明らかなため、自然な日本語として「湖を」を補った。
- source_word: ἦλθον
  choice: 着いた
  rationale: 目的地への到着を表す文脈なので、一般的で自然な「着いた」とした。
- source_word: ἐπὶ τὴν γῆν εἰς Γεννησαρέτ
  choice: ゲネサレの地に
  rationale: 直訳的には「陸の上へ」と「ゲネサレへ」が重なった表現であり、ゲネサレ地方の陸地・岸への到着を示す。本文では簡潔に「ゲネサレの地に」とし、構文上の含みは脚注に残した。
- source_word: Γεννησαρέτ
  choice: ゲネサレ
  rationale: 地名として、現代日本語の聖書読者に通用する慣用的な音写を用いた。
