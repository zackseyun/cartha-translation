base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: ja
  text: ヨハネが彼に、「あなたが彼女を妻にしていることは、許されない」と言い続けていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言い続けていた
  rationale: 未完了時制が示す過去の継続的・反復的な発言を、自然な現代日本語で表す。
- source_word: γὰρ
  choice: からである
  rationale: 直前の叙述に理由・背景説明を加える接続関係を明示する。
- source_word: αὐτῷ
  choice: 彼に
  rationale: λέγωの間接目的語として、ヘロデに向けた発言であることをそのまま示す。
- source_word: ὁ Ἰωάννης
  choice: ヨハネ
  rationale: 原文どおり人物名のみを訳し、文脈から明らかな「バプテスマのヨハネ」という補足は加えない。
- source_word: Οὐκ ἔξεστίν
  choice: 律法で許されていない
  rationale: 単なる不適切さではなく、文脈上の法的・倫理的な不許可を明確にする。
- source_word: σοι
  choice: 自分のものとしていることは
  rationale: 日本語では発言相手を「あなた」と明示するより、引用内の再帰表現に組み込むほうが自然である。
- source_word: ἔχειν
  choice: 自分のものとしている
  rationale: ἔχεινの基本的な「持つ」を保ちつつ、人を対象とするこの文脈で、妻・伴侶として保持している含意を過度に限定せず表す。
- source_word: αὐτήν
  choice: あの女を
  rationale: 直前に言及されたヘロディアを指す女性代名詞を、指示対象が分かる自然な日本語にする。
theological_decisions:
- issue: ヨハネの非難の性質
  choice: 「律法で許されていない」という法的・倫理的禁止として訳す。
  alternative: 「してはならない」または「正しくない」と一般的に訳す。
  rationale: ἔξεστινは許可・合法性を表し、この文脈ではヘロデの関係が律法に反するとの非難である。ただし具体的な律法条文や婚姻関係の説明は本文に付加しない。
- issue: ἔχειν αὐτήν の婚姻的含意
  choice: 「あの女を自分のものとしている」とし、原文の幅を保つ。
  alternative: 「あの女を妻にしている」と明示する。
  rationale: 文脈上は妻・伴侶としての関係を指すが、原文は「妻」という語を用いないため、訳文でも解釈を固定しすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。未完了時制の継続性と、γάρの説明的関係を自然に表現した。引用は強い非難だが、古風な法令調にはしていない。
