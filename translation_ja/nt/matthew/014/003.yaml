id: MAT.14.3
reference: Matthew 14:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: ja
  text: というのも、ヘロデは、自分の兄弟フィリポの妻ヘロディアのことが理由で、ヨハネを捕らえ[a]、縛り、牢に入れたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨハネをつかまえ」。
    reason: κρατήσαςは、より字義的には「つかまえる」とも訳せるため。
lexical_decisions:
- source_word: γὰρ
  choice: というのも……からである
  rationale: 直前の叙述に理由を示す説明的な接続を、現代日本語で明確かつ自然に表す。
- source_word: κρατήσας
  choice: 捕らえ
  rationale: 拘禁へ至る文脈では「捕らえる」が自然であり、単なる身体的把握よりも逮捕・拘束の意味合いを適切に伝える。
- source_word: ἔδησεν
  choice: 縛って
  rationale: 拘束手段を「鎖」と限定せず、δέωの具体的な意味を保つ。
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: 牢に入れていた
  rationale: 投獄を明瞭に表し、過去の出来事を説明する日本語の文脈に合わせて継続的な拘禁状態も自然に示す。
- source_word: διὰ Ἡρῳδιάδα
  choice: ヘロディアのことで
  rationale: διά＋対格の理由・原因を表しつつ、具体的事情を次節に残す原文の含みを保つ。
- source_word: γυναῖκα
  choice: 妻
  rationale: フィリポとの関係を示す属格構文では「女」ではなく「妻」が適切である。
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: ヘロデの兄弟フィリポ
  rationale: αὐτοῦがヘロデを指すことを日本語で明確にし、フィリポがヘロデの兄弟であるという同格関係を自然に示す。
theological_decisions:
- issue: ヘロディアとフィリポの関係に対する歴史的・道徳的評価
  choice: 「ヘロデの兄弟フィリポの妻」と中立的に記す
  alternative: 「兄弟フィリポから奪った妻」など、関係の不法性をこの節で明示する
  rationale: この節自体はヘロディアをフィリポの妻と特定するにとどまり、その関係への明示的な非難は次節に現れるため、評価を先取りしない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。長いギリシア語文を二文に分け、人物関係を読み違えにくくした。説明を導くγὰρは「というのも……からである」で保持した。
