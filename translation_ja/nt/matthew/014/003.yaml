  to: というのも、ヘロデは、自分の兄弟フィリポの妻ヘロディアのことが理由で、ヨハネを捕らえ[a]、縛り、牢に入れたからである。
  rationale: 原文の三つの過去の行為を「捕らえ、縛り、牢に入れた」と対応させた。「ヘロディアのことが理由で」はδιά＋対格の因果関係を明示するが、ヘロデとヘロディアの関係の不法性など、この節に述べられていない評価や事情は加えていない。
