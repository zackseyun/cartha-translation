  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: ja
  text: しかし、イエスは弟子たちに言った。「彼らは去る必要がありません。あなたがたが、彼らに食べる物を与えなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 弟子たちが群衆を解散させようとした直前の提案との穏やかな対照を示す。
- source_word: εἶπεν αὐτοῖς
  choice: 弟子たちに言った
  rationale: αὐτοῖςの指示対象を文脈から明示し、現代日本語として自然な発話導入にした。
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: あの人たちが帰る必要はない
  rationale: 「必要を持たない」というギリシア語の慣用表現を自然な日本語にし、ἀπέρχομαιはこの場から去る意味で「帰る」とした。
- source_word: δότε αὐτοῖς
  choice: 何か食べる物をあげなさい
  rationale: 与える相手が群衆であることを日本語の文脈で自然に表し、命令形の力を「あげなさい」で保った。
- source_word: ὑμεῖς
  choice: あなたがた自身で
  rationale: 明示された二人称複数代名詞の強調を保ち、弟子たち自身が行うよう求める命令として訳した。
- source_word: φαγεῖν
  choice: 何か食べる物
  rationale: δίδωμιと不定詞の構文を、日本語で自然な「何か食べる物をあげる」と表現した。
theological_decisions:
- issue: イエスの命令における弟子たちの役割の強調
  choice: 「あなたがた自身で」と明示する
  alternative: 単に「あなたがたが」または主語を省略する
  rationale: ὑμεῖςには明確な強調があり、解釈を付加せずに、群衆に食べ物を与える主体として弟子たちを際立たせるため。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの言葉には簡潔で威厳ある調子を保った。「彼ら」ではなく「あの人たち」として、群衆を指す口語上の自然さを確保した。
