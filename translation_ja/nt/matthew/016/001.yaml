id: MAT.16.1
reference: Matthew 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: ja
  text: ファリサイ派とサドカイ派が近寄って来て、イエスを試そうとし[a]、天からのしるしを彼らに見せるよう、イエスに求めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑しようとして」または「罠にかけようとして」とも訳せる。
    reason: πειράζοντες には「試す」のほか、文脈により「誘惑する」「罠にかけようとする」の含意もあり得るため。
lexical_decisions:
- source_word: προσελθόντες
  choice: 近寄って来て
  rationale: イエスのもとへ近づいたという移動を自然な現代日本語で表し、主動詞に先立つ分詞の働きも保った。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 現代日本語で一般的な名称を用い、宗教的集団であることが分かるよう「派の人々」とした。
- source_word: Σαδδουκαῖοι
  choice: サドカイ派の人々
  rationale: 現代日本語で一般的な名称を用い、宗教的集団であることが分かるよう「派の人々」とした。
- source_word: πειράζοντες
  choice: 試そうとし
  rationale: 敵対的な文脈を示しつつ、「誘惑する」「罠にかける」とまで意味を限定せず、πειράζω の語義上の幅を保った。
- source_word: ἐπηρώτησαν
  choice: 求めた
  rationale: ここでは不定詞 ἐπιδεῖξαι を伴い、単なる質問ではなく、しるしを見せるよう要求したことを表すため、日本語として自然な「求めた」とした。
- source_word: σημεῖον
  choice: しるし
  rationale: 奇跡的な意味合いは文脈に含まれるが、原文自体は「しるし」としているため、説明を加えずに訳した。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天からの
  rationale: しるしの源・由来が天であることを、簡潔で自然な日本語で表した。
- source_word: ἐπιδεῖξαι
  choice: 見せてほしい
  rationale: 「示す、見せる」という意味を、求める内容として自然な日本語の引用的構文にした。
theological_decisions:
- issue: ファリサイ派とサドカイ派の要求に含まれる敵対的意図
  choice: πειράζοντες を「イエスを試そうとし」と訳す。
  alternative: 「イエスを誘惑しようとし」または「イエスを罠にかけようとし」
  rationale: 敵対的な意図を示しながらも、誘惑または罠という特定の解釈に狭めず、原文の曖昧さと緊張を保つため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しるし」は聖書的な重要語としてひらがな表記を採用した。主語が求めた相手を明確にするため、原文の αὐτόν を「イエス」と明示した。脚注記号は、該当する「試そうとし」の直後ではなく文末に置くと対象が曖昧になるため、本来は「試そうとし[a]」とするのが望ましい。
