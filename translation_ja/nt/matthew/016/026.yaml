id: MAT.16.26
reference: Matthew 16:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: ja
  text: 人がたとえ全世界を手に入れても、自分のいのちを失うなら、いったい何の益があるだろうか。あるいは、人は自分のいのちの代価として、何を差し出すことができるだろうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本文の二つの「いのち」は、いずれも「魂」とも訳せる。ギリシア語の「プシュケー」は、文脈により「いのち」「自分自身」「魂」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ... ὠφεληθήσεται ἄνθρωπος
  choice: 人に何の益があるだろうか
  rationale: γάρの説明的なつながりを日本語では文脈に委ねつつ、受益を問う修辞疑問として自然に表現した。ἄνθρωποςは一般的な人間を指すため「人」とした。
- source_word: τὸν κόσμον ὅλον κερδήσῃ
  choice: 全世界を手に入れても
  rationale: κόσμοςとὅλοςの総体性を「全世界」で保ち、κερδαίνωの獲得の意味を現代日本語として自然な「手に入れる」で示した。
- source_word: τὴν ... ψυχὴν αὐτοῦ ζημιωθῇ
  choice: 自分のいのちを失うなら
  rationale: ψυχήはここで人の生命・自己そのものを広く指し得るため「いのち」とした。ζημιόωの受動形は損失を被る意味であり、日本語では「失う」が自然である。
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: 自分のいのちと引き換えに
  rationale: ἀντάλλαγμαが表す交換・代価の比喩を、過度に贖金概念へ限定せず「引き換えに」と訳した。
- source_word: τί δώσει ἄνθρωπος
  choice: 人は何を差し出せるだろうか
  rationale: δώσειは未来形だが、修辞疑問の含意を自然な日本語で表すため可能表現を用いた。「差し出す」は交換の代価として与える意味を明確にする。
theological_decisions:
- issue: 究極的な損失についての句における ψυχή の訳
  choice: いのち
  alternative: 魂／自分自身
  rationale: 本文は身体と非物質的な魂を厳密に区別する人間論を必須としておらず、ψυχήは生命または人自身を指し得る。「いのち」はその広がりを比較的よく保つ一方、伝統的で有力な「魂」は脚注に残して曖昧さを保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。経済的な対比は「手に入れる」「失う」「引き換えに」「差し出す」で再現し、修辞疑問の力を保った。
