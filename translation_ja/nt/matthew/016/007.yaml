  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: ja
  text: 弟子たちは互いに、「パンを持って来なかった」と話し合っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 弟子たちは
  rationale: δέは弱い接続辞であり、日本語では明示的な接続語を置かない方が自然。主語は文脈上弟子たちなので、代名詞より明確にした。
- source_word: διελογίζοντο
  choice: 話し合っていた
  rationale: 未完了過去は継続中の協議・思案を表す。「論じていた」よりも自然な現代日本語で、互いに解釈をめぐって話していた場面に合う。
- source_word: ἐν ἑαυτοῖς
  choice: 互いに
  rationale: 弟子たち自身の間でのやり取りを簡潔かつ自然に表す。
- source_word: λέγοντες
  choice: 「…」と
  rationale: 分詞が話し合いの内容を導入するため、日本語では引用助詞「と」に統合するのが自然。
- source_word: ὅτι
  choice: からだ
  rationale: ここでは単なる引用内容の標識とも、直前のイエスの発言について理由を推測する表現とも取れる。文脈上の推論を自然な日本語で示しつつ、明示されていない目的語「それ」を加えない。
- source_word: Ἄρτους
  choice: パン
  rationale: 複数形だが、携行する食料としてのパンを総称的に指すため、日本語では「パン」が自然。
- source_word: οὐκ ἐλάβομεν
  choice: 持って来なかった
  rationale: λαμβάνωは基本的に「取る」だが、旅の携行品という文脈では「持って来る」の意味になる。弟子たちがパンを携えて来なかったことを自然に表す。
theological_decisions:
- issue: ὅτιが導く発言の性格
  choice: 「パンを持って来なかったからだ」
  alternative: 「パンを持って来なかった」と
  rationale: ὅτιは発言内容を導くだけとも取れるが、直前の警告をパン不足のせいだと弟子たちが推測している文脈では、理由を表す「からだ」が自然。ただし、推論対象を補う「それは」は加えず、原文の省略を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語。物語文として簡潔にし、弟子たちの継続的な話し合いと理由推定を表した。
