id: MAT.16.6
reference: Matthew 16:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「よく注意し、ファリサイ派とサドカイ派のパン種[a]を警戒しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「酵母」とも訳せる。ギリシア語はパンを膨らませる「パン種」を指す。ここでは比喩として用いられ、その意味は後の文脈でファリサイ派とサドカイ派の教えとの関係で説明される。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の文脈との緩やかな対照を示す接続として、自然な現代日本語で表した。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: 間接目的語を明示しつつ、イエスの発言を自然で品位ある日本語にした。
- source_word: Ὁρᾶτε
  choice: よく注意し
  rationale: ここでは視覚的に「見る」というより、危険に気づくよう促す警告の命令である。
- source_word: προσέχετε ἀπὸ
  choice: ～を警戒しなさい
  rationale: 何かから身を守り、用心するよう命じる自然な日本語。Ὁρᾶτεとの命令の重なりも保った。
- source_word: ζύμης
  choice: パン種
  rationale: パンを膨らませる発酵種を指し、この箇所の比喩を説明に置き換えず保持できる、定着した日本語表現である。
- source_word: Φαρισαίων
  choice: ファリサイ派
  rationale: 宗教的集団名として現代日本語で分かりやすい標準的な表記。
- source_word: Σαδδουκαίων
  choice: サドカイ派
  rationale: 宗教的集団名として現代日本語で分かりやすい標準的な表記。
theological_decisions:
- issue: 「パン種」の比喩的意味
  choice: 本文では「パン種」という比喩をそのまま残す。
  alternative: 「教え」または「影響」と明示する。
  rationale: この節自体はζύμηという比喩を用いており、その意味は後の文脈で示される。ここで先回りして意味を限定せず、原文の展開と含みを保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「よく注意し」と「警戒しなさい」によって、原文の二重の警告を不自然にならない範囲で保った。
