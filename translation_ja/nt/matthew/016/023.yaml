id: MAT.16.23
reference: Matthew 16:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: ja
  text: しかし、イエスは振り向いてペトロに言われた。「わたしの後ろに行け、サタン。[a] あなたはわたしにとって妨げとなるものだ。神のことに心を向けず、人間のことに心を向けているからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの後ろに退け、サタン。」伝統的には「引き下がれ、サタン」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: 振り向いて
  rationale: 受動形ながら自動詞的に用いられ、発言に先立つ身体の向きの変化を自然な日本語で示す。
- source_word: Ὕπαγε ὀπίσω μου
  choice: わたしの後ろに下がれ
  rationale: Ὕπαγε の退去命令と ὀπίσω μου の空間的意味をともに保ち、弟子が師の前に立って妨げるのではなく後ろに位置すべきだという含みも残す。
- source_word: Σατανᾶ
  choice: サタン
  rationale: 文脈上の呼びかけとして音写し、単なる「敵対者」と解釈して鋭さや正体に関する曖昧さを弱めない。
- source_word: σκάνδαλον
  choice: つまずかせるもの
  rationale: 人を転ばせる障害という比喩と、ペトロがイエスの歩みを妨げる文脈を明瞭に表す。「つまずき」は日本語では本人がつまずく意味にも取られやすいため、使役的にした。
- source_word: ἐμοῦ
  choice: わたしを
  rationale: σκάνδαλον との関係を、影響を受ける者として自然な日本語で示す。
- source_word: φρονεῖς
  choice: 思っている
  rationale: 単発の思考ではなく心の向きや価値判断を表す。対句を簡潔で自然に保ちながら継続的な姿勢を示す。
- source_word: τὰ τοῦ θεοῦ
  choice: 神のこと
  rationale: 所有を伴う実体化表現を過度に「利益」「計画」などへ限定せず、原文の広がりを保つ。
- source_word: τὰ τῶν ἀνθρώπων
  choice: 人間のこと
  rationale: ἄνθρωπος はここで神と対照される人間一般を指すため、現代日本語で包括的かつ正確な「人間」とした。
theological_decisions:
- issue: ペトロへの「サタン」という呼びかけの意味
  choice: 「サタン」と直接呼びかける形を保つ。
  alternative: 一般名詞として「敵対者」と訳す、または「ペトロを通して働くサタン」と明示する。
  rationale: ギリシア語の強い叱責と誘惑物語との響きを保ちつつ、ペトロ自身をサタンと同一視しているのか、サタン的な役割を果たしているのかを訳文で決めない。
- issue: ὀπίσω μου の空間的・弟子的含意
  choice: 「わたしの後ろに下がれ」とする。
  alternative: 「引き下がれ」「立ち去れ」とだけ訳す。
  rationale: 拒絶の命令だけでなく、「後ろ」という原文の語を残し、弟子としてイエスに従う位置へ戻れという含みを読者が受け取れるようにする。ただし、その含みを本文で説明しすぎない。
- issue: τὰ τῶν ἀνθρώπων の範囲
  choice: 「人間のこと」と訳す。
  alternative: 「男たちのこと」「人々のこと」「人間的な関心事」と訳す。
  rationale: この複数形は男性だけに限定せず、人間一般を神と対比する代表的用法である。日本語では「人間」が性別を持ち込まず原意を最も直接に示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの叱責の鋭さを保った。「言われた」は福音書の語りにふさわしい品位を持たせ、「下がれ」「思っている」は現代の一般読者にも理解しやすい表現とした。固有名は日本語聖書で広く通用する「ペトロ」「サタン」を採用した。
