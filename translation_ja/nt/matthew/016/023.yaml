revisions:
- from: しかし、イエスは振り向いてペトロに言われた。「わたしの後ろに下がれ、サタン。[a] あなたはわたしをつまずかせるものだ。神のことを思わず、人間のことを思っているからだ。」
  to: しかし、イエスは振り向いてペトロに言われた。「わたしの後ろに行け、サタン。[a] あなたはわたしにとって妨げとなるものだ。神のことに心を向けず、人間のことに心を向けているからだ。」
  rationale: イエスの厳しい呼びかけとしての「サタン」と、ὀπίσω μου の空間的意味を保った。一方、σκάνδαλον と ἐμοῦ の関係を「わたしにとって妨げ」と明示して、使役的に過度に限定されることを避けた。また、φρονεῖς を「心を向ける」として、神の事柄と人間の事柄の間の根本的な志向の対比を保った。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:33Z'
review_pass:
  verdict: revise
  source_fidelity: 「わたしをつまずかせるものだ」は、ペトロがイエスを実際につまずかせるという使役的意味に寄りすぎる。σκάνδαλον εἶ ἐμοῦ はこの文脈では「わたしにとって妨げである」とするのが、属格 ἐμοῦ との関係をより正確に表す。「神のことを思わず」も意味は通るが、φρονεῖς の持続的な志向・関心を「心を向ける」でより適切に表せる。
  naturalness: 「わたしの後ろに下がれ」は理解可能だが、位置関係を伴う命令としては「わたしの後ろに行け」のほうが明快で自然である。「神のことに心を向けず、人間のことに心を向けている」は、対比と継続的な態度を明瞭にする。
  terminology: 「ペトロ」「サタン」は適切である。「人間」は ἀνθρώπων の人間一般という意味を自然な現代日本語で保つ。「妨げとなるもの」は σκάνδαλον の障害という比喩を、不要に特定の解釈へ限定せずに伝える。
  issues:
  - severity: medium
    issue: σκάνδαλον εἶ ἐμοῦ の訳し方
    rationale: 「あなたはわたしをつまずかせるものだ」は、イエスをつまずかせる行為を明示する表現となる。原文はペトロがイエスにとっての σκάνδαλον、すなわち妨害・障害であることを述べるため、「わたしにとって妨げとなるものだ」とする。
  - severity: low
    issue: φρονεῖς の志向性
    rationale: 「思っている」でも不可能ではないが、φρονέω は単なる思考内容より心の向き・関心を表す。「心を向けている」が対照をよりよく保持する。
  - severity: low
    issue: ὀπίσω μου を含む命令の自然さ
    rationale: 「後ろに下がれ」より「後ろに行け」のほうが、原文の移動命令と空間的意味を現代日本語で素直に表す。
  revised_text: しかし、イエスは振り向いてペトロに言われた。「わたしの後ろに行け、サタン。[a] あなたはわたしにとって妨げとなるものだ。神のことに心を向けず、人間のことに心を向けているからだ。」
  revised_footnotes:
