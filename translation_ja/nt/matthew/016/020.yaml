id: MAT.16.20
reference: Matthew 16:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: ja
  text: その時、イエスは弟子たちに、ご自分がメシア[a]であることを誰にも言わないよう、厳しく命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語「クリストス」は「油を注がれた者」を意味する称号。
    reason: 称号の伝統的な別訳を示し、原語の意味を説明するため。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の時間的な展開を示す副詞として、簡潔で自然な現代日本語にした。
- source_word: διεστείλατο
  choice: 厳しく命じた
  rationale: 強い指示・禁止命令を表す中動態の語感を保つ。「警告した」では危険への注意という含みが前面に出るため避けた。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たちに
  rationale: 文脈上すでに知られているイエスの弟子たちを指す。日本語では所有表現を補わなくても明瞭である。
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: 誰にも言わないよう
  rationale: 命令の内容を示すἵνα節を、自然な日本語の禁止表現で訳した。
- source_word: ὅτι αὐτός ἐστιν
  choice: ご自分が…であることを
  rationale: 発言内容を示すὅτι節として訳した。αὐτόςの指示対象がイエスであることを明確にしつつ、不要な強調は加えていない。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名ではなく、油注がれた者を意味する称号として用いられているため、その称号的意味が伝わる「メシア」とした。
theological_decisions:
- issue: Χριστόςという称号の訳し方
  choice: メシア
  alternative: キリスト
  rationale: この文脈のΧριστόςは称号として機能している。「メシア」はそのユダヤ的・称号的意味を明確に保ち、「キリスト」は伝統的な別訳として脚注に示した。
translation_notes:
  register: 明快で現代的かつ品位ある叙述。「厳しく命じた」により命令の強さを保ち、「ご自分」で指示対象を自然に明示した。
