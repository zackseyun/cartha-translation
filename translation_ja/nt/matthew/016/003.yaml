id: MAT.16.3
reference: Matthew 16:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: ja
  text: また朝には、『今日は荒れ模様になる。空が赤く、どんよりしているからだ』と言う。あなたがたは空の様子[a]を見分けることができるのに、時のしるし[b]は見分けられない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「空の顔」。目に見える空の状態を指す。
    reason: lexical_alternative
  - marker: b
    text: 「時のしるし」は、イエスのメシアとしての働きを含め、その時が持つ霊的に重要な意味を指している可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: 朝には
  rationale: 時を表す副詞であり、自然な現代日本語で前後の天候判断との対比を保つ。
- source_word: χειμών
  choice: 荒れ模様になる
  rationale: ここでは季節の「冬」ではなく、嵐を伴う悪天候を指す。「荒れ模様」は天気予測の文脈に自然である。
- source_word: πυρράζει
  choice: 赤く
  rationale: 空が赤みを帯びていることを簡潔に表し、意味を過度に強めない。
- source_word: στυγνάζων
  choice: どんよりしている
  rationale: 空が暗く陰鬱で、悪天候を思わせる状態を、一般的な気象表現で伝える。
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: 空の様子
  rationale: 直訳は「空の顔」だが、ここでは目に見える空の状態を指す慣用表現なので、現代日本語として明瞭にした。
- source_word: γινώσκετε διακρίνειν
  choice: 見分けることができる
  rationale: 識別する知識と能力を表す構文を、日本語で自然に伝える。
- source_word: σημεῖα
  choice: しるし
  rationale: 出来事の意味を示す証拠・徴候という含みを保ち、マタイにおける用語とのつながりも維持する。
- source_word: καιρῶν
  choice: 時
  rationale: 単なる季節ではなく、意味を帯びた時機や時代を指す。複数形の意味を日本語で自然な定型句「時のしるし」として表した。
- source_word: οὐ δύνασθε
  choice: 見分けられない
  rationale: 明示された不能を表し、前半の「見分ける」との対照を明確にする。
theological_decisions:
- issue: 「時のしるし」の範囲
  choice: 「時のしるし」と広く訳し、意味を限定しない
  alternative: 「今の時代のメシアのしるし」または「終末のしるし」
  rationale: この句は、イエスの働きを含む現在の時の霊的・救済史的な意味を示しうるが、ギリシャ語自体はメシア的または終末論的意味の一方だけに限定していないため、その緊張を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、イエスの非難の鋭い対比を保持した。「荒れ模様になる」は朝の空からその日の天候を予測する発言として自然にし、「時のしるし」は神学的意味を狭く確定しない表現とした。
