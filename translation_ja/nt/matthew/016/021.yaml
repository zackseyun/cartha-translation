id: MAT.16.21
reference: Matthew 16:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: ja
  text: その時から、イエスは弟子たちに、ご自分がエルサレムへ行き、長老たち、祭司長たち、律法学者たちから[b]多くの苦しみを受け[a]、殺され、三日目によみがえらされなければならない[c]ことを示し始められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「多くのことを苦しむ」。さまざまな苦しみを受けることを強調する表現。
    reason: lexical_alternative
  - marker: b
    text: 「長老たち、祭司長たち、律法学者たちの手によって、多くの苦しみを受け」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: 「よみがえらなければならない」とも訳せる。ギリシア語は受動形で、直訳は「よみがえらされなければならない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: その時から
  rationale: 物語の転換点と、そこから始まる新しい段階を自然な日本語で示す。
- source_word: ἤρξατο
  choice: 示し始められた
  rationale: イエスの教えに新しい段階が始まったことを表す。日本語として一続きになるよう、δεικνύεινと合わせて訳した。
- source_word: δεικνύειν
  choice: 示し
  rationale: 単に告げるだけでなく、弟子たちに明らかにしていくという語義を保つ。
- source_word: δεῖ
  choice: なければならない
  rationale: 必要性の強い意味を保ちつつ、その必要性の源を本文で特定しない。
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: エルサレムへ行き
  rationale: 目的地への移動を明瞭で自然な現代日本語にした。
- source_word: πολλὰ παθεῖν
  choice: 多くの苦しみを受け
  rationale: πολλάの複数的な含みを反映し、さまざまな苦難を受けることを表す。
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: 長老たち、祭司長たち、律法学者たちから
  rationale: ἀπόの起点・原因・行為主体の幅を残しつつ、日本語で自然に表現する。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: 当時のユダヤ指導層の一群を指す標準的で透明な訳語。
- source_word: ἀρχιερέων
  choice: 祭司長たち
  rationale: 複数形が指す祭司階級の指導者集団を適切に表し、『大祭司たち』という誤解を避ける。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 単なる書記ではなく、律法の専門家としての役割が現代の読者に伝わる訳語。
- source_word: ἀποκτανθῆναι
  choice: 殺され
  rationale: 受動態を保った明瞭で直接的な訳。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 三日目に
  rationale: 原文の序数表現を簡潔かつ自然に再現する。
- source_word: ἐγερθῆναι
  choice: よみがえらされ
  rationale: 受動形を明示し、行為者を本文で補わない。
theological_decisions:
- issue: δεῖが示す受難の必然性
  choice: 「なければならない」とし、必要性の源を明示しない
  alternative: 「神の定めによって、そうしなければならない」
  rationale: 原文は強い必要性を示すが、この節ではその源を明示していないため、神の計画、聖書の成就、歴史的必然性のいずれかに限定しない。
- issue: ἐγερθῆναιの態
  choice: 受動の「よみがえらされる」
  alternative: 自動詞的な「よみがえる」
  rationale: ギリシア語の受動態を保ち、誰がよみがえらせるかを本文で明示せず、神学的な含みを保持する。
- issue: ἀπόと三つの指導者集団の関係
  choice: 「長老たち、祭司長たち、律法学者たちから」と訳す
  alternative: 「長老たち、祭司長たち、律法学者たちの手によって」
  rationale: 原文の前置詞が持つ起点・原因・行為主体の関係を狭く決めすぎない。
translation_notes:
  register: 明瞭で品位ある現代標準語。敬語は福音書本文で自然な主体敬語にとどめ、過度に古風な表現を避けた。「よみがえらされる」はやや非日常的だが、原文の受動態と神学的余韻を保持するため採用した。
