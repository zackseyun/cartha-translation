id: MAT.16.8
reference: Matthew 16:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: ja
  text: しかし、イエスはそれに気づいて言われた。「信仰の薄い者たちよ、なぜ互いに、パンを持って来なかった[a]ことについて話し合っているのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「パンを取らなかった」。ここでは、パンを携えて来なかったという意味。
    reason: λαμβάνω の字義と文脈に即した訳語との差を示すため。
lexical_decisions:
- source_word: γνοὺς
  choice: それに気づいて
  rationale: 目的語は原文では明示されていないが、直前の弟子たちの話し合いを受ける。アオリスト分詞が示す、発言に先立つイエスの認知を自然な日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 弟子たちの話し合いから、それを察したイエスの応答へと移る緩やかな対照を示す。
- source_word: εἶπεν
  choice: 言われた
  rationale: 物語の発言導入として標準的であり、イエスへの敬意を示す現代日本語の自然な敬語を用いた。
- source_word: Τί
  choice: なぜ
  rationale: διαλογίζεσθε と ὅτι節を伴うこの構文では、話し合いの内容そのものより、そのように話し合う理由を問う用法と判断した。
- source_word: διαλογίζεσθε
  choice: 話し合っている
  rationale: 弟子たちが互いに考えを交わしている文脈を、平明な現代日本語で表す。「論じている」より日常的だが、熟慮・議論の要素を失わない。
- source_word: ἐν ἑαυτοῖς
  choice: 互いに
  rationale: 内心で、という可能性もある表現だが、直前の弟子たちの会話を受けるため、集団内での相互の話し合いとして訳した。
- source_word: ὀλιγόπιστοι
  choice: 信仰の薄い者たちよ
  rationale: 弟子たちの信頼の不足を直接たしなめる呼びかけとして訳し、意味を単なる理解不足に弱めなかった。
- source_word: ὅτι
  choice: ことを
  rationale: 弟子たちが話し合っている内容、すなわちパンを持参しなかった事実を導くものとして表した。「から」として原因に限定することは避けた。
- source_word: ἄρτους
  choice: パン
  rationale: ギリシャ語は複数形だが、日本語では数量を特に強調しない場合「パン」が自然であり、意味を十分に保つ。
- source_word: οὐκ ἐλάβετε
  choice: 持って来なかった
  rationale: λαμβάνω の基本義は「取る」だが、直前の文脈では旅にパンを携えて来なかったことを指すため、文脈上の意味を明確かつ自然に表した。字義的な訳は脚注に残した。
theological_decisions:
- issue: ὀλιγόπιστοι によるイエスの叱責の強さ
  choice: 弟子たちの信仰・信頼の不足を指摘する直接的な呼びかけとして「信仰の薄い者たちよ」とした。
  alternative: 単なる理解不足を指す穏やかな表現にする。
  rationale: 語そのものが信仰の乏しさを問題にしているため、その神学的な力を保つ一方、ここから一般的な教理説明を付け加えない。
- issue: ὅτι節と問いの関係
  choice: 話し合いの内容を示す「ことを」とした。
  alternative: 理由を示す「パンを持って来なかったからといって」とする。
  rationale: ὅτιは内容にも原因にも取り得るが、直前の会話内容とのつながりを重視した。因果関係に限定しすぎず、原文の議論の焦点を保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの叱責には品位ある呼びかけの形を保った。「言われた」は日本語聖書として自然な敬語だが、過度に古風な表現は避けた。
