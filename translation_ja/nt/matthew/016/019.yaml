id: MAT.16.19
reference: Matthew 16:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ja
  text: わたしはあなたに天の国の鍵を与えます[a]。あなたが地上でつなぐものは何であれ、天ではすでにつながれていることになります[b][c]。あなたが地上で解くものは何であれ、天ではすでに解かれていることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「もろもろの天の王国」。マタイはこの表現をたびたび用いている。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「天でもつながれる……天でも解かれる」とも訳される。ギリシア語はより厳密には、天ですでにそうされた結果の状態を表すと理解できる。
    reason: alternative_reading
  - marker: c
    text: 「つなぐ」と「解く」には、禁じることと許すこと、また義務を課すことと解くこと、という意味合いもあり得る。本文では原文の比喩を残した。
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: わたしはあなたに……与えます
  rationale: 未来能動直説法による約束を、明瞭で自然な現代日本語の未来表現とした。σοιは間接目的語「あなたに」と明示した。
- source_word: τὰς κλεῖδας
  choice: 鍵
  rationale: 複数形を日本語では数量を不自然に強調せず「鍵」とした。権威などの意味に置き換えず、原文の比喩を保持した。
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を、現代日本語で自然かつ広く理解できる形にした。βασιλείαを特定の教会制度に限定せず、「国」と訳した。
- source_word: ὃ ἐὰν
  choice: ものは何であれ
  rationale: 不定関係節の包括性を自然な日本語で表した。「何であれ」は対象を限定しない原文の力を保つ。
- source_word: δήσῃς
  choice: つなぐ
  rationale: 「縛る」も可能だが、対になる「解く」と自然に対応し、原文の比喩を保つ「つなぐ」を採用した。禁止する、義務を課す、といった解釈は本文に織り込まず脚注で示した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 天との対比を簡潔で自然な日本語にした。
- source_word: ἔσται δεδεμένον
  choice: 天ではすでにつながれていることになり
  rationale: 未来のεἰμίと完了受動分詞の組み合わせが示す、先行して成立した結果状態を日本語で表すため「すでに……ていることになる」とした。
- source_word: λύσῃς
  choice: 解く
  rationale: 「つなぐ」と対をなし、原文の比喩と意味上の幅を保持する語を選んだ。
- source_word: ἔσται λελυμένον
  choice: 天ではすでに解かれていることになります
  rationale: 前半と同じ未来＋完了受動分詞の形と対称性を保ち、完了した行為の結果状態を表した。
theological_decisions:
- issue: 地上での「つなぐ・解く」と天での決定との時間的・論理的関係
  choice: 「天ではすでに……ていることになる」
  alternative: 「天でも……れることになる」
  rationale: 原文の未来形＋完了受動分詞を反映し、地上の行為が天の決定を一方的に生じさせると断定しない訳とした。ただし、その関係を特定の教会論にまで解釈してはいない。
- issue: 「天の国の鍵」の具体的意味
  choice: 比喩をそのまま「鍵」とした
  alternative: 「人を受け入れたり締め出したりする権威」「管理を任された権限」
  rationale: 鍵が権威を示唆する可能性は高いが、本文は比喩のまま述べているため、特定の制度的・教派的理解を訳文に持ち込まなかった。
- issue: 「つなぐ・解く」の解釈
  choice: 比喩を本文に保持した
  alternative: 「禁じる・許す」「義務を課す・免除する」
  rationale: これらの法的・教育的な意味合いはあり得るが、原文の多義性と神学的緊張を保つため、本文では一つに確定せず脚注で説明した。
translation_notes:
  register: イエスの言葉として、明瞭で落ち着いた現代標準語を用いた。文末は丁寧体で統一しつつ、比喩と構文上の対称性を保持した。「御国」のような教会内で主に用いられる語を避け、一般の読者にも分かりやすい「天の国」とした。
