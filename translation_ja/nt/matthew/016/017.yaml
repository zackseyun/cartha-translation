reference: Matthew 16:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: ja
  text: イエスは彼に答えられた。「シモン・バルヨナ[a]、あなたは幸いだ。あなたにこのことを明らかにしたのは、肉と血[b]ではなく、天におられる[c]わたしの父だからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バルヨナ」はアラム語系の父称で、「ヨナの子」という意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「肉と血」。ここでは、人間または人間的な源を指す慣用表現。
    reason: cultural_note
  - marker: c
    text: ギリシア語では「天々に」と複数形。日本語では慣用に従って「天に」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: イエスは彼に答えられた
  rationale: 分詞と定動詞を重ねる「答えて言った」という構文の意味を、現代日本語で自然な「答えられた」にまとめた。αὐτῷの相手を「彼に」で明示し、δέは文脈上、独立した接続語を置かなくても自然に継続するため無理に訳出しない。
- source_word: Μακάριος
  choice: 幸いだ
  rationale: 単なる心理的な「うれしい」ではなく、神から恵みを受けた祝福された状態を表し得る、聖書日本語として明瞭で重みのある表現を選んだ。
- source_word: Σίμων Βαριωνᾶ
  choice: シモン・バルヨナ
  rationale: ギリシア語本文が保存するアラム語系の父称を固有名として音写し、その由来は脚注で示した。
- source_word: ὅτι
  choice: だからだ
  rationale: ここではシモンが幸いである理由を導くため、日本語では後続文末の「だからだ」で因果関係を明確にした。
- source_word: σὰρξ καὶ αἷμα
  choice: 血肉
  rationale: 人間または人間的な源を指す慣用句の具体的な像を保った。日本語では意味が自明でない可能性があるため脚注を付した。
- source_word: ἀπεκάλυψέν σοι
  choice: あなたにこのことを明らかにした
  rationale: 動詞の啓示・開示の意味を「明らかにした」で自然に表した。目的語はギリシア語では文脈から補われるため、直前の告白を指す「このこと」を日本語でも補った。
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: ではなく、…わたしの父
  rationale: 人間的な源と父なる神との強い対照を「ではなく」で明示した。
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: 天におられる
  rationale: ギリシア語の複数形「天々に」を、日本語の自然な聖書表現である単数の「天に」とし、関係表現を「おられる」で明示した。
theological_decisions:
- issue: ペトロの告白を明らかにした源
  choice: 「血肉」と「わたしの父」を対照させ、人間的な源ではなく父なる神の啓示によることを示す
  alternative: 「血肉」をペトロ自身の自然な推論、または特定の人間の教師だけに限定する
  rationale: 本文の慣用句は人間的な源を広く退けるが、それが誰または何を個別に指すかは限定していないため、その幅を保った。
- issue: 省略された啓示の目的語
  choice: 文脈上のペトロの告白を受けて「このこと」と補う
  alternative: 目的語を置かず「あなたに明らかにした」とする
  rationale: 日本語の自然さのために指示語を補う一方、内容を教理的に詳述せず、直前の文脈への参照にとどめた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言にふさわしい簡潔で格調ある語調とした。「幸いだ」「わたしの父」は親しみやすさと荘重さの均衡を図り、「血肉」の原文の像は脚注を添えて保持した。
