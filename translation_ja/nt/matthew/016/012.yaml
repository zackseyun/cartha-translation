id: MAT.16.12
reference: Matthew 16:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: ja
  text: その時、弟子たちは、イエスがパンのパン種[a]に気をつけるように言われたのではなく、ファリサイ派とサドカイ派の教えに気をつけるように言われたのだと理解した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「パン」は複数形。なお、「パンの」に当たる語句は本文伝承に不確かさがある。
    reason: τῶν ἄρτων の複数形を示すとともに、SBLGNTでこの語句が角括弧に置かれている本文批評上の不確かさを反映するため。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 弟子たちがイエスの言葉の意味を悟った時点を示す自然な時間表現。
- source_word: συνῆκαν
  choice: 悟った
  rationale: 単に情報を理解しただけでなく、それまで分からなかった意味に気づいた文脈を、簡潔で自然な日本語で表す。
- source_word: οὐκ εἶπεν προσέχειν
  choice: 気をつけるように言われたのは…ではなく
  rationale: προσέχω の警戒を促す意味を保ちつつ、間接話法として自然な日本語にした。主語の「イエス」は文脈上の指示対象を明確にするため補った。
- source_word: ἀπὸ τῆς ζύμης
  choice: パン種のこと
  rationale: ζύμη の字義と聖書的な比喩を保つため、現代日本語でも通用する「パン種」を用いた。
- source_word: τῶν ἄρτων
  choice: パンの
  rationale: ギリシア語は複数形だが、日本語では通常、数を明示せず総称的に「パン」とするのが自然。複数形であることは脚注に示した。
- source_word: διδαχῆς
  choice: 教え
  rationale: 宗派的・教義学的な含みを不必要に加えず、教えられている内容を表す平明な語。
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: ファリサイ派とサドカイ派
  rationale: 当時の宗教的集団であることが日本語読者に自然に伝わる標準的な名称を用いた。
theological_decisions:
- issue: 「パン種」の比喩的意味
  choice: 本文自身の説明どおり、「ファリサイ派とサドカイ派の教え」とする。
  alternative: 「偽善」「腐敗した教え」など、並行箇所や解釈に基づく説明を本文に加える。
  rationale: この節はパン種が「教え」を指すことまでは明示するが、その教えの性質をそれ以上限定していないため、本文が残す範囲を越えて解釈しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、語り口の品位を保った。「パンのパン種」は多少反復的だが、原文が文字どおりのパンに由来するパン種と比喩的な教えを対比しているため保持した。
