  text: λέγει αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/015.yaml
  text: He says to them[a], “But who do you say that I am?”
translation:
  language: ja
  text: イエスは彼らに言った[a]。「では、あなたがたは、わたしをだれだと言うのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「言う」と現在形になっている。過去の出来事を生き生きと語る歴史的現在である。
    reason: 原文の時制と日本語訳の時制の違いを示すため。
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は臨場感を与える歴史的現在形だが、現代日本語の物語として自然になるよう過去形で表した。イエスの発言であることを踏まえ、敬意を示す「言われた」とした。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 発言の相手である弟子たちを示す与格複数代名詞を、そのまま自然な日本語で表した。
- source_word: Ὑμεῖς
  choice: あなたがたは
  rationale: 明示された二人称複数代名詞には対比的な強調があるため、「あなたがたは」と主題を明示した。
- source_word: δὲ
  choice: では
  rationale: 直前に述べられた世間の見方から弟子たち自身の見方へ問いを転じる対比を、自然な日本語の「では」で表した。
- source_word: τίνα
  choice: 何者
  rationale: 人物の身元・本質について問う疑問代名詞であり、日本語では「誰」より「何者」が文脈に適する。ただし、答えの内容を先取りしない。
- source_word: με λέγετε εἶναι
  choice: わたしを何者だと言う
  rationale: 対格＋不定詞による間接話法を、日本語で自然でありながら構造にも近い「わたしを何者だと言う」と訳した。
theological_decisions:
- issue: 弟子たち自身の判断を求める対比的強調
  choice: 「では、あなたがたは」として対比を明示する
  alternative: 「あなたがたは、わたしを誰だと言うのか」
  rationale: δὲと明示的なὙμεῖςによって、群衆の意見ではなく弟子たち自身の答えが問われている。後続節の告白内容をこの問いに読み込まず、対比だけを保った。
- issue: τίναが問う範囲
  choice: 「何者」と訳す
  alternative: 「誰」
  rationale: 単なる個人名の確認ではなく、イエスをどのような者と認識するかを問う文脈に合う一方、特定の称号や教理的結論は付加しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言には「言われた」を用いて端正で敬意ある語調を保った。「では」によって自然に文脈上の対比を示し、「何者」で問いの重みを簡潔に表した。
