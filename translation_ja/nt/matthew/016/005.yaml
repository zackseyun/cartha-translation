  text: 弟子たちは向こう岸に着いたとき、パンを持って行くのを忘れていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: 着いたが
  rationale: アオリスト分詞を、主動詞に先立つ到着を表す自然な日本語の節として訳した。接続助詞「が」は、到着とパンを忘れたこととの軽い対照を自然に示す。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 福音書におけるイエスの弟子たちを指す標準的で明確な訳語。
- source_word: εἰς τὸ πέραν
  choice: 向こう岸に
  rationale: 湖を渡った先を指す福音書の定型的表現として、簡潔で自然な日本語にした。
- source_word: ἐπελάθοντο
  choice: 忘れていた
  rationale: 到着した時点ですでに持参を忘れていたという物語上の先行性を、日本語の「ていた」で表した。
- source_word: ἄρτους
  choice: パン
  rationale: ギリシャ語は複数形だが、日本語の「パン」は通常、個数を明示せず食料として自然に用いられるため、文脈上の意味を保って訳した。
- source_word: λαβεῖν
  choice: 持って来るのを
  rationale: 移動の際にパンを携行する意味を文脈に即して自然に表す。「取る」よりも目的地への持参が明確になる。
