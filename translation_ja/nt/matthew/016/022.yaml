id: MAT.16.22
reference: Matthew 16:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: ja
  text: ペテロはイエスを脇へ連れて行き、強くいさめ始めた。「主よ、そんなことがあなたに起こりませんように[a]。決してそんなことがあなたに起こることはありません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主よ、そんなことがあなたに起こるなど、とんでもないことです」、または「神がお守りくださいますように」とも訳せる。ギリシア語は省略を含む慣用表現で、字義的には「あなたに慈悲深く」の意を帯びる。
    reason: Ἵλεώς σοιは解釈と訳し方に幅のある省略的な慣用句であるため。
lexical_decisions:
- source_word: προσλαβόμενος
  choice: 脇へ連れて行き
  rationale: 中動態分詞がこの文脈で表す、ペテロがイエスを人々から離して自分のそばへ連れ出したという含みを、自然な日本語で示した。単に「連れて」よりも、私的に話そうとした場面が伝わる。
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: いさめ始めた
  rationale: ἤρξατο＋不定詞の開始の意味を明示した。ἐπιτιμάωには強く非難する響きがあるが、この場面では、目上の相手に思い直すよう迫る行為を表す「いさめる」が自然であり、ペテロの不適切な強い制止も伝えられる。
- source_word: Ἵλεώς σοι
  choice: とんでもないことです
  rationale: 直訳しにくい省略的な慣用表現で、相手にそのような災いが及ばないよう願い、直前の発言を強く退ける言い方である。「とんでもないことです」は、本文に明示されていない「神」を補わず、ペテロの強い拒絶を現代日本語で表す。字義的な含みと別訳は脚注に残した。
- source_word: κύριε
  choice: 主よ
  rationale: イエスへの敬意ある呼びかけと、福音書におけるキリスト論的な響きの双方を保つ。
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: そんなことがあなたに起こるはずはありません
  rationale: οὐ μή＋未来形の強い否定を「起こるはずはありません」で表した。指示語「そんなこと」は直前にイエスが語った受難と死を受ける自然な日本語である。
theological_decisions:
- issue: ペテロの抗議に含まれるἽλεώς σοιを、本文以上に神学的に明確化しないこと
  choice: 主よ、とんでもないことです
  alternative: 主よ、どうかそのようなことがありませんように／主よ、神がお守りくださいますように
  rationale: この句は字義的には「あなたに慈悲深く」のような形だが、主語などが省略された慣用句であり、災いを強く退ける。本文で「神」を明示すると解釈を補いすぎるため避け、曖昧さと伝統的な理解を脚注で示した。
- issue: ペテロがイエスをἐπιτιμᾶνした行為の強さ
  choice: いさめ始めた
  alternative: 叱り始めた／厳しく非難し始めた
  rationale: 原語が示す強い制止を弱めすぎない一方、日本語で「叱る」とすると身分関係や感情を過度に特定しやすい。「いさめる」は、ペテロがイエスの言葉を退けて思い直させようとした緊張を自然に保つ。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスへの呼びかけは「主よ」として尊厳を保った。ペテロの行動と抗議の強さは示すが、口語的すぎる表現や、原文に明示されない神学的主語の補足は避けた。
