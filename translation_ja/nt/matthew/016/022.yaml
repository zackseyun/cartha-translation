- from: ペテロはイエスを脇へ連れて行き、いさめ始めた。「主よ、とんでもないことです[a]。そんなことがあなたに起こるはずはありません。」
  to: ペテロはイエスを脇へ連れて行き、強くいさめ始めた。「主よ、そんなことがあなたに起こりませんように[a]。決してそんなことがあなたに起こることはありません。」
  rationale: 本文の第一の抗議を、災いがイエスに及ばないことを願う自然な日本語に改めた。これは「神」を本文に補わずにἽλεώς σοιの対人的な向きと慣用的な願いの力を表す。続くοὐ μήの強い否定は「決して」で明示した。脚注には従来の拒絶的な訳と、神を補う解釈的訳を代案として保持した。
