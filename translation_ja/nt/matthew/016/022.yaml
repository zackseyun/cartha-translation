review_pass:
  verdict: revise
  source_fidelity: Ἵλεώς σοι is an elliptical idiom of aversion/wish for protection, followed by the emphatic denial οὐ μὴ ἔσται. The draft's 「とんでもないことです」 conveys protest but leaves σοι ('to/for you') unexpressed and is overly detached from the following clause. Rendering it as a wish that this not happen to Jesus better represents the idiom without making God an explicit subject. 「強くいさめ始めた」 retains both the ingressive force of ἤρξατο and the sharpness of ἐπιτιμᾶν.
  naturalness: The revised wording is clear, contemporary standard Japanese. 「そんなことがあなたに起こりませんように」 is a natural solemn protest addressed to 「主よ」; the following 「決して…ありません」 appropriately preserves the deliberately emphatic repetition.
  terminology: 「ペテロ」「イエス」「主よ」 are appropriate and consistent. The footnote continues to signal the idiomatic and disputed character of Ἵλεώς σοι, while avoiding an assertion that God is explicit in the Greek.
  issues:
  - severity: medium
    issue: 「とんでもないことです」 does not adequately express σοι in Ἵλεώς σοι.
    rationale: The Greek idiom is directed to Jesus ('for/to you') and expresses aversion to the predicted outcome. The draft's general exclamation makes this relationship only inferable and weakens the idiom's wish/protective force.
  - severity: low
    issue: 「いさめ始めた」 may understate ἐπιτιμᾶν.
    rationale: 「いさめる」 can be mild counsel in modern Japanese. Adding 「強く」 preserves the source's rebuking/censuring force without imposing an unnecessarily specific emotional tone.
  revised_text: ペテロはイエスを脇へ連れて行き、強くいさめ始めた。「主よ、そんなことがあなたに起こりませんように[a]。決してそんなことがあなたに起こることはありません。」
  revised_footnotes:
