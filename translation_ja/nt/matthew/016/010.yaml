  text: また、四千人のための七つのパンと、あなたがたが大かごを何かご集めたかも、覚えていないのですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: また…も…ないのですか
  rationale: 前節から続く修辞疑問の第二項を示す。単独でも自然な日本語になるよう、否定を述語側に補いながら「また…も」で連続性を表した。
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: 七つのパン
  rationale: 給食物語における具体的なパンの個数を、現代日本語で自然に表した。
- source_word: τῶν τετρακισχιλίων
  choice: 四千人のための
  rationale: 属格が示す、四千人への給食との文脈的関係を明確かつ簡潔に表した。
- source_word: πόσας
  choice: 幾つ
  rationale: 女性複数形でσπυρίδαςを修飾する数量疑問詞を自然な日本語にした。
- source_word: σπυρίδας
  choice: 大かご
  rationale: 別の給食記事で用いられるκόφινοςとの語彙上の区別を保つため、比較的大きなかごであることを明示した。
- source_word: ἐλάβετε
  choice: 集めた
  rationale: 残ったパンをかごに回収した文脈に即し、単なる「取った」より行為を自然に伝える語を選んだ。
