  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: ja
  text: その時、イエスは弟子たちに言われた。「だれでも私の後について来たいなら、自分を捨て、自分の十字架を取り上げ、私に従いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の進行を示す時間的な接続表現として、自然で格調のある日本語にした。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: 福音書における μαθητής の教師に学び従う者という定着した意味を保つ。文脈上、所有者は明白なので「自分の弟子たち」とはしなかった。
- source_word: Εἴ τις θέλει ὀπίσω μου ἐλθεῖν
  choice: だれでも私の後について来たいなら
  rationale: τις の不特定で包括的な範囲、θέλει の意志、ὀπίσω μου の「後ろ」という弟子道の比喩を保った。後半の ἀκολουθείτω と完全には同一化しないよう「後について来る」とした。
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: 自分を捨て
  rationale: 自己を中心とする立場や要求を退ける決然とした命令を、現代日本語で自然な「自分を捨てる」にした。「自己否定」より具体的で、人格的自己の抹消という意味を不必要に持ち込まない。
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: 自分の十字架を背負って
  rationale: αἴρω は持ち上げて担うことを表す。この定型的文脈では日本語の「十字架を背負う」が、処刑具を自ら担う像と弟子としての個別の代価を明瞭に伝える。
- source_word: ἀκολουθείτω μοι
  choice: 私に従いなさい
  rationale: 現在命令形の継続的な弟子道を、自然な命令表現で示した。「ついて来なさい」も可能だが、冒頭の「後について来る」と区別しつつ ἀκολουθέω の関係的意味を表すため「従う」とした。
theological_decisions:
- issue: 自分を否むことの意味
  choice: 自分を捨て
  alternative: 自分を否定し／自分との関係を否認し
  rationale: ἀπαρνέομαι は否認・拒絶を表すが、ここでは自分自身を弟子道の中心から退ける命令である。「自分を捨てる」は伝統的かつ自然であり、自己嫌悪や人格の消滅と断定する解釈を避ける。
- issue: 「自分の十字架」の比喩と歴史的像
  choice: 自分の十字架を背負って
  alternative: 自分の十字架を取り上げて
  rationale: 十字架刑に向かう者が横木等を担う具体的な像を保ちつつ、弟子が負う苦難一般だけに狭めない。日本語では「背負う」が最も自然だが、何を十字架と呼ぶかは本文で解釈し尽くさない。
- issue: ギリシア語の男性単数形と普遍的対象
  choice: 性を限定しない日本語の「だれでも」「自分」を用いる
  alternative: 男性単数を明示する表現
  rationale: τις と単数命令形・再帰代名詞は代表的な単数で、対象は男女を問わない。日本語にはこの箇所で文法的性を再現する必要がなく、「だれでも」「自分」が単数性と普遍性を自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さを保ちながら古風な「おのれ」や硬い「否認する」は避けた。直接話法は簡潔な命令のリズムを保ち、「自分を捨て、自分の十字架を背負って、私に従いなさい」と段階的に配置した。
