  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ja
  text: 邪悪で姦淫の世代[a]は、しるしを求める。しかし、ヨナのしるし[b]のほかには、何のしるしも与えられない。彼は彼らを後にして、立ち去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「姦淫の」は「不実な」とも訳せる。原文は姦淫を表す語を用いており、神に対する契約上の不忠実を姦淫になぞらえる預言書の表現が響いている可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「ヨナのしるし」については、マタイ12章39–40節で、ヨナの三日三晩と「人の子」との対応が示されている。
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: 世代
  rationale: マタイにおいて同時代の人々を集合的に指す語として理解できるため、「時代」や「人々」と意訳せず「世代」とした。
- source_word: πονηρὰ
  choice: 邪悪な
  rationale: 道徳的な悪を直接表し、現代日本語でも明確で重みのある表現である。
- source_word: μοιχαλὶς
  choice: 姦淫の
  rationale: 語が持つ姦淫の比喩を本文に残し、単に「不誠実な」と解釈的に限定しない。預言書的な契約不忠実の響きは注で示す。
- source_word: σημεῖον
  choice: しるし
  rationale: 要求された超自然的な証拠という文脈を保ちつつ、原文にない「奇跡」という限定を加えない。
- source_word: ἐπιζητεῖ
  choice: 求める
  rationale: 強く要求する含みもあり得るが、動詞自体を過度に強めず、文脈に判断を委ねる。
- source_word: δοθήσεται
  choice: 与えられない
  rationale: 未来受動の意味を自然な日本語で直接表した。
- source_word: εἰ μὴ
  choice: のほかには
  rationale: 唯一の例外を示す構文として、日本語で自然かつ明確に表現した。
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ヨナのしるし
  rationale: 属格の簡潔さと解釈上の余地を保ち、この節の本文だけで死と復活を明示しない。
- source_word: καταλιπὼν αὐτοὺς
  choice: 彼らを残し
  rationale: 分詞が表す先行・付帯動作を簡潔に保ち、彼らから離れたことを示す。
- source_word: ἀπῆλθεν
  choice: 立ち去った
  rationale: その場から離れて行った動きを、自然で簡潔な現代日本語で表した。
theological_decisions:
- issue: 「姦淫の世代」の意味
  choice: 本文では姦淫の比喩を保持する
  alternative: 「不実な世代」「神に不忠実な世代」と解釈的に訳す
  rationale: 預言書に見られる神への不忠実という響きが考えられる一方、原文は姦淫を表す語を用いる。比喩の鋭さと、道徳的・契約的含意の両方を残した。
- issue: 「ヨナのしるし」の意味
  choice: 簡潔な句のまま訳す
  alternative: イエスの死と復活を指すと本文中で明示する
  rationale: マタイ12章39–40節には説明があるが、この節自体は簡潔であるため、より詳しい解釈を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、宣告の厳粛さを保った。「邪悪で姦淫の世代」は日常語としては硬いが、原文の比喩の鋭さを保存するために採用した。後半は主語を「イエス」と補い、日本語で指示対象が曖昧にならないようにした。
