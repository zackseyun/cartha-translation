id: MAT.16.28
reference: Matthew 16:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: ja
  text: まことに、あなたがたに言います。ここに立っている人々の中には、人の子がご自分の王国[c]とともに来る[b]のを見るまでは、決して死を味わわない者がいます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死を味わうことは決してない」。ギリシア語では強い否定表現が用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「人の子がご自分の王国とともに来る」が、変容、復活と高挙、ペンテコステ、エルサレムへの裁き、または終末の再臨のどれを指すのか、本文自体は特定していない。
    reason: alternative_reading
  - marker: c
    text: 「王国」は「王としての支配」または「王権」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: 権威ある発言を導入する厳粛な確言として、現代日本語で自然かつ格調を保つ表現を選んだ。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけと発言の厳粛さを、明瞭な現代標準語で表した。
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: ここに立っている人々の中には、…者がいます
  rationale: 属格の部分的用法、すなわちその場にいる人々の一部を指す構造を自然な日本語で明示した。
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: 決して死を味わわない
  rationale: οὐ μήによる強い否定を「決して」で示しつつ、「死を味わう」という原文の鮮明な比喩を保持した。
- source_word: ἕως ἂν ἴδωσιν
  choice: 見るまでは
  rationale: 将来の出来事を限界点とする時の構文を、簡潔で自然な日本語にした。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称であり、聖書的・黙示的な含意を保つ定着した訳語を用いた。
- source_word: ἐρχόμενον
  choice: 来る
  rationale: 現在分詞の直接的な意味を保ち、並行箇所から「力をもって」などを補わなかった。
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: ご自分の王国のうちに
  rationale: βασιλείαの領域としての「王国」と統治としての「支配」の両義性を不必要に狭めず、ἐνも明示的に反映した。
theological_decisions:
- issue: 「人の子がご自分の王国のうちに来る」が指す出来事
  choice: 出来事を特定せず、原文どおりに訳す
  alternative: 変貌、復活と高挙、ペンテコステ、エルサレムへの裁き、または終末の再臨のいずれかに特定する
  rationale: ギリシア語本文はどの出来事かを明示していないため、解釈上の緊張と曖昧さを訳文に残した。
- issue: βασιλείαの意味合い
  choice: 王国
  alternative: 支配、王としての統治
  rationale: 「王国」は具体的な王国のイメージを保ちながら、神学的意味を抽象的な統治だけに限定しない。脚注で他の可能性を示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「まことに」「人の子」「死を味わう」によって聖書本文としての格調と主要な比喩を保った。敬語は「ご自分」に限定し、過度に古風な語法は避けた。
