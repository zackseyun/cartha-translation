  to: まことに、あなたがたに言います。ここに立っている人々の中には、人の子がご自分の王国[c]とともに来る[b]のを見るまでは、決して死を味わわない者がいます[a]。
  rationale: 必要な修正は「王国のうちに」を「王国とともに」に置き換える一点である。これにより、原文の ἐν τῇ βασιλείᾳ αὐτοῦ を日本語として誤解なく表し、出来事の指示対象について本文が特定しないという方針も維持する。対応して脚注bの引用句も改めた。
