  source_fidelity: 主要な構文と語彙はよく反映されている。「決して死を味わわない」は οὐ μὴ γεύσωνται θανάτου の強い否定と比喩を保ち、「ここに立っている人々の中には」は部分属格を適切に表す。ただし、ἐν τῇ βασιλείᾳ αὐτοῦ を「ご自分の王国のうちに来る」とする日本語は、人の子が自分の王国内のある場所へ来るという不自然で狭い場所的意味を生じさせる。文脈に即して「ご自分の王国とともに来る」とするのが、日本語として自然でありつつ、原文の解釈上の未確定性を保つ。
  naturalness: 全体は明瞭な現代標準日本語で、聖書本文として適切な格調もある。「王国のうちに来る」だけは現代日本語として不自然であり、意味の取り違えを招きうる。
  terminology: 「まことに」「人の子」「死を味わう」はいずれも適切である。「王国」も βασιλεία の訳語として維持できる。「ご自分の王国とともに来る」は、王国／王としての支配の両面を脚注で開いたまま、本文では不必要な神学的特定をしない。
