source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: ja
  text: 彼らは答えた。[a]「ある人たちはバプテスマのヨハネだと言い、ほかの人たちはエリヤだと言い、また別の人たちはエレミヤ、あるいは預言者の一人だと言っています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 意味を明示すれば、「ある人たちは、あなたはバプテスマのヨハネだと言い、ほかの人たちは、あなたはエリヤだと言い、また別の人たちは、あなたはエレミヤ、あるいは預言者の一人だと言っています」となる。
    reason: 原文では、だれをこれらの人物だと言っているのかが省略され、直前の問いから補われる。
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 彼らは答えた
  rationale: δέはこの応答を直前の問いにつなぐが、日本語では接続語を加えなくても流れが明瞭である。εἶπανは字義的には「言った」だが、問いへの返答なので「答えた」が自然である。
- source_word: Οἱ μὲν
  choice: ある人たちは
  rationale: μένは後続のἄλλοι、ἕτεροιとともに複数の見解を順に挙げる。「ある人たちは」でその配分的な構造を自然に示す。
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: バプテスマのヨハネ
  rationale: βαπτιστήςは洗礼を授ける者を指す。日本語聖書で広く認知され、人物名として自然な「バプテスマのヨハネ」を用いる。
- source_word: ἄλλοι δὲ Ἠλίαν
  choice: ほかの人たちはエリヤ
  rationale: 第二の集団とその見解を示す。δέの対照性を過度に強めず、列挙として自然に訳す。
- source_word: ἕτεροι δὲ Ἰερεμίαν
  choice: また別の人たちはエレミヤ
  rationale: ἕτεροιはさらに別の集団を示すため、「また別の人たちは」として三番目の見解を明確にする。
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: か、預言者の一人
  rationale: ἤの選択関係を「か」で表し、原文にない「ほかの」を補わず、「預言者の一人」と訳す。
theological_decisions:
- issue: 人物同定の省略された対象
  choice: 「あなたは」を本文に補わず、「バプテスマのヨハネ…だと言っています」と文脈に委ねる
  alternative: 「あなたはバプテスマのヨハネ…だと言っています」と明示する
  rationale: ギリシア語は直前の問いを受け、同定される対象を省略して人物名だけを列挙している。日本語でも主語の省略が自然であり、原文の簡潔さと含意を保てる。明示訳も文脈上正しいため脚注に示す。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、会話としての丁寧さを「言っています」で表した。固有名は一般的な日本語聖書表記に従い、列挙のリズムと原文の省略を保った。
