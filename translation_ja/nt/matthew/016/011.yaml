  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ja
  text: わたしがパンのことを言ったのではないと、どうして分からないのですか。しかし、ファリサイ派とサドカイ派のパン種に用心しなさい[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファリサイ派とサドカイ派のパン種に気をつけなさい」。
    reason: lexical_alternative
  - marker: b
    text: ここで「パン種」は比喩。次の節では、ファリサイ派とサドカイ派の「教え」を指すと説明される。
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: どうして分からないのですか
  rationale: πῶςと否定を伴うνοέωによる、理解できていないことへの叱責を含む修辞疑問。現代日本語として自然にしつつ、その問いかけの力を保った。
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: パンのことを言ったのではないと
  rationale: περὶ ἄρτωνは文脈上「パンのこと」と自然に訳した。ἄρτωνは複数形だが、日本語では個数を明示せず「パン」とするのが自然。ὑμῖνは日本語では文脈上明らかなため、独立した「あなたがたに」を置かず動詞に含意させた。
- source_word: προσέχετε δὲ
  choice: 用心しなさい
  rationale: προσέχετεはここでは単なる注意喚起ではなく、危険を避けるよう警告する命令。δέは前文から本来の警告へ戻る移行を示すが、日本語では接続語を加えないほうが自然で、対照も文脈から明らか。
- source_word: ἀπὸ τῆς ζύμης
  choice: パン種に
  rationale: προσέχω＋ἀπόは、あるものを警戒し、それから身を守る意味。「パン種」はζύμηの比喩を保ち、次節の説明にも自然につながる。
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ファリサイ派とサドカイ派の
  rationale: 当時の宗教的集団を、現代日本語で理解しやすい標準的な名称として表した。属格は、その両派に属する、または両派を特徴づけるパン種を示す。
theological_decisions:
- issue: 「パン種」の比喩性
  choice: 本文では「パン種」という比喩を保持し、「教え」と明示しない。
  alternative: ファリサイ派とサドカイ派の教えに用心しなさい。
  rationale: 原文はこの節でζύμηという比喩を用い、その意味は次節で「教え」と説明される。本文中で先回りして置き換えず、比喩とその展開を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの叱責を含む問いと命令の重みを保った。「パン種」は聖書的比喩として理解可能な語であり、脚注で次節との関係を補った。
