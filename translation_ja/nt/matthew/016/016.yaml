id: MAT.16.16
reference: Matthew 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: ja
  text: シモン・ペトロは答えた。「あなたはメシア[a]、生ける神の子です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語「クリストス」は「油を注がれた者」を意味する称号で、ヘブライ語由来の「メシア」に当たる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 答えた
  rationale: 分詞と定動詞を組み合わせた慣用的な発話導入であり、日本語では重複を避けて「答えた」とするのが自然である。
- source_word: δὲ
  choice: 訳出しない
  rationale: ここでは弱い談話上の継続・移行を示すため、日本語の文脈では明示しなくても流れが保たれる。
- source_word: Σίμων Πέτρος
  choice: シモン・ペトロ
  rationale: 人名として、現代日本語の聖書で広く通用する音写を用いた。
- source_word: Σὺ
  choice: あなたは
  rationale: 明示された代名詞の強調を保ち、告白の対象をはっきり示す。
- source_word: ὁ χριστὸς
  choice: メシア
  rationale: ここでは固有名ではなく称号として機能しており、ユダヤ的な救済者待望の文脈が伝わる「メシア」とした。別訳「キリスト」を脚注に示す。
- source_word: ὁ υἱὸς
  choice: 子
  rationale: 定冠詞を伴う特定的・称号的な表現だが、日本語では「神の子」が自然にその意味を担う。
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: 生ける神の
  rationale: 現在分詞の属性的用法を、神が生きておられることを表す定着した荘重な日本語「生ける神」で保持した。
theological_decisions:
- issue: Χριστόςを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: ペトロの告白ではメシア的称号としての意味が前面に出るため本文を「メシア」とし、日本語で定着した「キリスト」も真正な別訳として脚注に残した。
- issue: 「神の子」の意味の扱い
  choice: 生ける神の子
  alternative: 生きておられる神の子
  rationale: 原文の告白的・称号的表現をそのまま保ち、後代の教理的説明を付加せず、意味を限定しすぎない。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としつつ、告白の荘重さを保つため「生ける神」を用いた。発話導入は自然な「答えた」とし、原文の強調は「あなたは」で表した。
