id: MAT.16.25
reference: Matthew 16:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ja
  text: 自分のいのちを救おうとする者は、それを失い、わたしのために自分のいのちを失う者は、それを見いだすからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのち」と訳したギリシア語は、文脈により「たましい」または「自分自身」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: …者は…、…者は…からである
  rationale: 不定一般条件を日本語の「…者は」で表し、γάρによる前節との理由上のつながりを文末の「からである」で保持した。δέの対照は二つの並行節そのものによって自然に伝わるため、接続語を補いすぎなかった。
- source_word: θέλῃ
  choice: …しようとする
  rationale: 単なる願望よりも意志を含むθέλωの文脈上の力を、自然な現代日本語で表した。
- source_word: ψυχὴν
  choice: いのち
  rationale: 救う・失う・見いだすという逆説と、死をも視野に入れた弟子道の文脈には「いのち」が最も自然である。ただしψυχήには「たましい」「自分自身」の意味領域もあるため脚注に残した。
- source_word: σῶσαι
  choice: 救う
  rationale: σῴζωの基本的意味を保ち、「失う」との鋭い対照を維持した。
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: 失い／失う
  rationale: この文脈では滅ぼすことより、いのちを失うことを指す。第一節の未来形と第二節の一般条件は、日本語では並行する形にしても帰結の確実性が自然に伝わる。
- source_word: ἕνεκεν ἐμοῦ
  choice: わたしのために
  rationale: 原因・動機とイエスへの個人的忠誠の両方を簡潔に表す。
- source_word: εὑρήσει
  choice: 見いだす
  rationale: εὑρίσκωの「見つける」という比喩的な力と逆説を保ち、解釈的な「得る」には広げなかった。
- source_word: αὐτοῦ / αὐτήν
  choice: 自分の／それを
  rationale: 代表的単数を日本語で性別を限定せず自然に表し、「それ」は直前の「いのち」を受ける。
theological_decisions:
- issue: 弟子道の逆説におけるψυχήの訳語
  choice: いのち
  alternative: たましい／自分自身
  rationale: 文脈は、イエスに従うために現世のいのちを失う可能性と、真のいのちを見いだす逆説を語る。「いのち」は意味を不必要に非物質的な魂へ限定しない。一方、語の意味範囲は脚注で明示し、神学的な含みを排除しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「生命」より聖書的文脈になじみつつ日常的にも理解しやすい「いのち」を採用した。理由を示すγάρは、日本語として自然な文末の「からである」で訳した。
