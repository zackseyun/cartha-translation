id: MAT.16.18
reference: Matthew 16:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: ja
  text: わたしもまた、あなたに言う。あなたはペトロ[a]である。わたしはこの岩の上に、わたしの教会を建てる。ハデス[b]の門も、それに打ち勝つことはない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ペトロ」に当たるギリシャ語はペトロス、「岩」はペトラで、両者には語呂合わせがある。「この岩」は、ペトロ本人、ペトロの信仰告白、または告白者であり使徒を代表するペトロを指すと理解されてきた。
    reason: alternative_reading
  - marker: b
    text: ギリシャ語「ハデス」。死者の世界を指す。伝統的には「陰府」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: また、わたしも
  rationale: κἀγώの強調された「わたしも」と、δέの継続・軽い対照を保ち、直前のペトロの発言に応答する流れを示した。
- source_word: σοι λέγω
  choice: あなたに言う
  rationale: 直接話法を導くλέγωの基本的な意味を、自然で格調を保つ日本語にした。
- source_word: Πέτρος
  choice: ペトロ
  rationale: 日本語聖書で広く定着した人名表記を用いた。πέτραとの語呂合わせは本文だけでは再現できないため脚注で示した。
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: この岩の上に
  rationale: ἐπίと指示語ταύτῃを明示し、建築の比喩を自然な日本語で保持した。
- source_word: οἰκοδομήσω
  choice: 建てる
  rationale: οἰκοδομέωの建築的な意味と未来の意志を簡潔に保った。
- source_word: μου τὴν ἐκκλησίαν
  choice: わたしの教会
  rationale: ἐκκλησίαは集会・会衆を意味し得るが、ここではイエスに属する共同体を指すため、現代日本語で定着した「教会」とした。所有を表すμουも明示した。
- source_word: πύλαι ᾅδου
  choice: ハデスの門
  rationale: ᾅδηςを最終的刑罰の場としての「地獄」と同一視せず、死者の領域を指す語として音写した。「門」の比喩も保持した。
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: それに打ち勝つことはない
  rationale: κατισχύωの敵対的な「圧倒する、打ち勝つ」という意味を表し、「それ」が直前の教会を受けることを自然に示した。
theological_decisions:
- issue: 「この岩」（πέτρα）が何を指すか
  choice: 本文では「この岩」とし、指示対象を限定しない
  alternative: ペトロ本人、ペトロの信仰告白、または告白者であり使徒を代表するペトロと明示する
  rationale: ギリシャ語はΠέτροςとπέτραの語呂合わせを含む一方、「この岩」の解釈を一義的には説明していない。諸伝統の論争を翻訳本文で解決せず、原文の曖昧さと神学的緊張を保った。
- issue: ᾅδηςの訳語
  choice: ハデス
  alternative: 死者の世界、陰府、地獄
  rationale: この語は死者の領域を指し、最終的刑罰を表すゲヘナとは区別される。「ハデス」として原語上の区別を保ち、意味は脚注で補った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言にふさわしい簡潔で格調ある文体とした。建築と門の比喩は原文どおり保持し、教派的解釈を本文へ持ち込まないようにした。
