  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: ja
  text: まだ分からないのですか。また、五つのパンを五千人に分けた時、何かご分集めたかを覚えていないのですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: まだ…ない
  rationale: 未だその理解に至っていないことを表す時間的な意味を保ち、問いかけの中で自然な現代日本語とした。
- source_word: νοεῖτε
  choice: 分かる
  rationale: ここでは以前の出来事の意味を理解することを指すため、平明な「分かる」とした。
- source_word: οὐδὲ
  choice: また…ない
  rationale: 二つの否定疑問を結びつける働きを、日本語として明瞭な並列で表した。
- source_word: μνημονεύετε
  choice: 覚えている
  rationale: 以前のパンの奇跡を記憶していることを問う直接的で自然な表現。
- source_word: τοὺς πέντε ἄρτους
  choice: 五つのパン
  rationale: ἄρτοςの具体的な個数を保ちつつ、日本語で通常用いられる表現とした。
- source_word: τῶν πεντακισχιλίων
  choice: 五千人に分けた時
  rationale: 属格が五千人への給食の出来事を指すという文脈上の関係を、過度に説明的にならない自然な日本語で明示した。
- source_word: πόσους κοφίνους
  choice: 幾つのかご
  rationale: かごの数を尋ねる原文の具体的な表現をそのまま保った。
- source_word: ἐλάβετε
  choice: 集めた
  rationale: 基本義は「取った」だが、この文脈では残りをかごに集めたことを指すため、自然で明瞭な訳語を選んだ。
