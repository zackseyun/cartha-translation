id: MAT.16.13
reference: Matthew 16:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: ja
  text: イエスはフィリポ・カイサリア地方に来ると、弟子たちにこう尋ねた。「人々は、人の子[a]をだれだと言っていますか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人の子」は、イエスがご自分を指して特徴的に用いた表現。「人間である者」とも訳し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: 来ると
  rationale: アオリスト分詞による場面の移行と時間関係を、現代日本語の自然な従属節で表した。δέはここでは弱い移行を示すため、独立した接続語を補わない。
- source_word: εἰς τὰ μέρη
  choice: 地方に
  rationale: μέρηは文字どおりの「部分」ではなく、町とその周辺の地域を指す慣用表現である。
- source_word: Καισαρείας τῆς Φιλίππου
  choice: フィリポ・カイサリア
  rationale: 日本語で定着している地名表記を用いた。
- source_word: ἠρώτα
  choice: 尋ねた
  rationale: 未完了過去は継続的・開始的な含みを持ち得るが、一つの問いを導く日本語では「尋ねていた」より単純過去が自然である。文脈上の問いかけの動作は失われない。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 弟子たちに
  rationale: μαθητήςの福音書における定着した訳語「弟子」を用い、複数を「たち」で示した。
- source_word: λέγων
  choice: こう
  rationale: 発言内容を導く分詞を、「こう尋ねた」という自然な日本語の引用導入に組み込んだ。
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: 人々は…をだれだと言っていますか
  rationale: ἄνθρωποιを性別を限定しない「人々」とし、不定詞を伴う間接話法を自然な日本語の引用内容として表した。現在形λέγουσινは「言っています」で示した。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの特徴的な自己呼称であり、ダニエル書との響きと称号的な重みを保つ定着訳を採用した。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουの訳し方
  choice: 人の子
  alternative: 人間である者
  rationale: この表現が持つ自己呼称、普通名詞的な響き、ダニエル書7章との関連を一つに限定せず保つため、伝統的で簡潔な「人の子」とした。別訳は脚注で示し、意味を特定の理解に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用導入は「こう尋ねた」と簡潔にした。地名と「人の子」は日本語聖書で広く認識される形を保ちつつ、敬語を過度に加えない端正な叙述とした。
