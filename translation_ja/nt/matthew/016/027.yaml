id: MAT.16.27
reference: Matthew 16:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: ja
  text: なぜなら、人の子は父の栄光のうちに天使たちを伴って来ようとしており[a]、そのとき、一人ひとりにその行いに応じて報いる[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「来ることになっている」「来る」。ギリシア語は、到来が迫っているという含みを持つ表現。
    reason: lexical_alternative
  - marker: b
    text: 直訳「その行為に応じて」。ギリシア語では「行為」が単数形で、各人の行い・生き方を分配的に指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: まさに来ようとしている
  rationale: μέλλω＋不定詞が持つ、差し迫った出来事という含みを保つ。単純な未来形に弱めず、同時に時期について本文以上の断定を加えない。
- source_word: γὰρ
  choice: からである
  rationale: 直前の発言の理由を示す接続語なので、日本語では文末で理由を示す形が自然である。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 聖書間の関連と称号としての響きを保つ、定着した直訳である。
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: 父の栄光のうちに
  rationale: ἐνが表す領域・顕現の中での到来を保ち、栄光が父のものであるという属格関係も明示する。
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: 天使たちを伴って
  rationale: μετά＋属格の随伴を自然な現代日本語で表す。文脈上、ἄγγελοιは天上の天使を指す。
- source_word: ἀποδώσει
  choice: 報いる
  rationale: 各人に当然のものを返すという裁きの含みを保ち、肯定的な褒賞だけに限定しない語を選んだ。
- source_word: ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: 一人ひとりに、その行いに応じて
  rationale: ἑκάστῳの個別性と、単数のπρᾶξιςが各人の行為・生き方を分配的に指すことを、自然な日本語で表した。
theological_decisions:
- issue: 人の子の到来におけるμέλλειの終末論的な時間感覚
  choice: 「まさに来ようとしている」として切迫感を残す。
  alternative: 「来る」「やがて来る」「来ることになっている」
  rationale: 原文が単純未来ではなくμέλλω＋不定詞を用いることを反映し、到来の時期をめぐる神学的緊張を翻訳で解消しないため。
- issue: 行いに応じた裁き
  choice: 「一人ひとりに、その行いに応じて報いる」とする。
  alternative: 「行ったことに応じて報酬を与える」「数々の行いに応じて返す」
  rationale: 個々人への応報という本文の司法的意味を保ちつつ、救済論上の体系や、報いが肯定的褒賞だけだという解釈を持ち込まないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「人の子」「父の栄光」など本文の聖書的な響きを保った。理由を示すγάρは、日本語として自然な文末の「からである」で表した。
