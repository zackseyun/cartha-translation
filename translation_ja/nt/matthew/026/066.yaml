  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: ja
  text: 「あなたがたはどう思うか。」彼らは答えた[a]。「彼は死刑に値する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼には死に当たる罪がある」または「彼は死刑に処せられるべきだ」とも訳せる。ギリシア語は法的な判決を表す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: あなたがたはどう思うか
  rationale: δοκέωと与格ὑμῖνによる、意見または判断を求める自然な問い。法廷的な文脈は後続の判決で明らかになるため、問い自体は簡潔に訳した。
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: 彼らは答えた
  rationale: 分詞ἀποκριθέντεςとεἶπανの重なりはギリシア語の慣用的な叙述であり、現代日本語では「答えた」とするのが自然。δέは軽い接続で、明示しなくても流れが保たれる。
- source_word: Ἔνοχος θανάτου
  choice: 死刑に値する
  rationale: ἔνοχοςに属格θανάτουが続き、死に関して有罪・処罰対象であるという法的判決を表す。「死刑に値する」は司法的意味を明確かつ自然に伝える。
- source_word: ἐστίν
  choice: 彼は…に値する
  rationale: 日本語として判決の対象を明確にするため、文脈上の主語を「彼」として補い、コピュラの断定性を保った。
theological_decisions:
- issue: 議会による判決の司法的性格
  choice: 彼は死刑に値する
  alternative: 彼は死に当たる罪がある／彼は死刑に処せられるべきだ
  rationale: ここで語られているのは議会がイエスに下した法的な判定である。神の前での実際の罪責や贖罪について本文以上の判断を加えず、発言者たちの判決として表現した。
translation_notes:
  register: 明快な現代標準日本語を用い、問いと判決の短く鋭い応酬を保った。「死刑に値する」により法廷的な含意を自然に示しつつ、発言者の判決を翻訳者自身の神学的断定にしないようにした。
