  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: ja
  text: イエスを裏切る者は、彼らにあらかじめ合図を与え、こう言っていた。「私が口づけする人が、その人だ。捕らえろ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδιδοὺς
  choice: 裏切ろうとしていた者
  rationale: この語は基本的に「引き渡す」を意味し得るが、受難物語のこの文脈ではユダの裏切りを指す。現在分詞の進行中・企図的な性格も自然な日本語で表した。
- source_word: σημεῖον
  choice: 合図
  rationale: ここでは逮捕する者たちにイエスを特定させるため、あらかじめ定められた識別のしるしを指す。「合図」が文脈上自然である。
- source_word: Ὃν ἂν φιλήσω
  choice: 私が口づけする人
  rationale: 不定関係節の識別機能を、明瞭で自然な現代日本語にした。
- source_word: φιλήσω
  choice: 口づけする
  rationale: 識別の身ぶりとしての接吻を表す。「口づけする」は場面にふさわしい品位を保ち、単なる挨拶だったとは限定しない。
- source_word: αὐτός ἐστιν
  choice: その人だ
  rationale: 強意代名詞による端的な人物特定を自然に表す。
- source_word: κρατήσατε
  choice: 捕らえろ
  rationale: しっかりつかんで拘束する命令を表す。文脈には合うが、原語以上に法的手続きを示す「逮捕しろ」は避けた。
theological_decisions:
- issue: ユダについて用いられた παραδιδοὺς の道徳的含意
  choice: 「裏切ろうとしていた者」と訳す
  alternative: 「引き渡そうとしていた者」
  rationale: 「引き渡す」という語義上の幅はあるが、この受難物語ではユダの裏切りであることが明白であり、文脈上の道徳的な力を自然に伝える。特定の教派的解釈は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔かつ荘重な調子を保った。ὁ δέ の δέ は日本語では無理に接続詞を置かず、文脈の展開に委ねた。過去完了的な ἔδωκεν は、逮捕の場面より前に合図を定めていたことが分かるよう「決めて…言っていた」とした。
