revisions:
- from: イエスを裏切ろうとしていた者は、彼らに合図を決めて言っていた。「私が口づけする人が、その人だ。捕らえろ。」
  to: イエスを裏切る者は、彼らにあらかじめ合図を与え、こう言っていた。「私が口づけする人が、その人だ。捕らえろ。」
  rationale: 原文の現在分詞 παραδιδοὺς を「裏切る者」とし、未遂・意図だけを表す「裏切ろうとしていた者」を避けた。ἔδωκεν αὐτοῖς σημεῖον は、逮捕者たちへ識別のしるしを与えたという内容なので、「彼らにあらかじめ合図を与え」とした。「あらかじめ」と「言っていた」により、逮捕場面に先立つ合図の伝達という文脈上の過去完了的な関係を、日本語として自然に表した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:42Z'
review_pass:
  verdict: revise
  source_fidelity: 「裏切ろうとしていた者」は、現在分詞 παραδιδοὺς を単に意図・未遂の意味に狭めており、この文脈での「裏切る者／裏切っている者」という人物規定を十分に表さない。また、「合図を決めて」は ἔδωκεν αὐτοῖς σημεῖον（彼らにしるしを与えた）よりも、合図そのものを設定したことに重点が移る。
  naturalness: 全体は自然で簡潔である。ただし「あらかじめ合図を与え、こう言っていた」とすれば、逮捕者たちに伝えられた識別の合図であることと、先行する出来事であることが明瞭になる。
  terminology: 「合図」「口づけ」「捕らえろ」は現代標準語として適切であり、σημεῖον、φιλήσω、κρατήσατεの文脈上の意味をよく伝える。「裏切る者」に改めることで παραδιδοὺς の受難物語における含意を、意図に限定せず表せる。
