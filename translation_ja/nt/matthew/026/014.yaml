  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: ja
  text: そのとき、十二人のうちの一人、イスカリオテのユダと呼ばれる者が、祭司長たちのところへ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を導く時間表現。現代日本語として自然で、出来事の連続を保つ。
- source_word: πορευθεὶς
  choice: 行った
  rationale: 主動詞を伴わない分詞的な移動表現だが、日本語では文脈に即して有限動詞にするのが自然である。πρόςが示す祭司長たちへの移動を明確に表す。
- source_word: εἷς τῶν δώδεκα
  choice: 十二人の一人
  rationale: 部分を示す属格表現を自然な日本語で再現する。十二人がイエスの内輪の弟子集団を指すことは文脈から明らかである。
- source_word: ὁ λεγόμενος
  choice: と呼ばれる者
  rationale: ユダを同格的に特定する表現。原文の受動的な『呼ばれる』を保ちつつ、自然な日本語にした。
- source_word: Ἰούδας Ἰσκαριώτης
  choice: イスカリオテのユダ
  rationale: 日本語聖書で広く認識される固有名の形を用い、名と呼称を明確に示す。
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: 祭司長たちのところへ
  rationale: πρός＋対格の方向性を『ところへ』で表す。ἀρχιερεῖςは単独の大祭司ではなく、祭司階級の指導者たちを指すため『祭司長たち』とした。
theological_decisions:
- issue: τῶν δώδεκα の集団名称としての表現
  choice: 十二人の一人
  alternative: 「十二弟子の一人」または集団名としての「十二人」の一人
  rationale: 原文には『弟子』に当たる語がないため補わず、単純な数詞表現を保った。特定の集団名称として読むことも可能であり、その点を脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述調。語順は日本語として自然に整えながら、ユダが十二人に属していたことと、祭司長たちのもとへ向かったことを明確に保った。
