  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: ja
  text: イエスを捕らえた者たちは、イエスを大祭司カヤパのもとへ連れて行った。そこには律法学者たちと長老たちが集まっていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「集められていた」とも訳せる。ギリシア語の動詞は受動形であり、ここでは人々が「集まっていた」とも、何らかの働きかけによって「集められていた」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες
  choice: イエスを捕らえた者たちは
  rationale: 定冠詞付き分詞を「者たち」とし、κρατέωは法的な意味に限定しすぎない「捕らえた」で表した。δέは弱い物語上の接続なので、日本語では無理に接続語を加えず自然な展開とした。
- source_word: ἀπήγαγον πρὸς Καϊάφαν
  choice: 大祭司カヤパのもとへ連れて行った
  rationale: ἀπάγωの拘束下で移動させる意味を「連れて行った」で表し、πρόςは人を目標とする「もとへ」とした。原文に明記されない「家」は補わない。
- source_word: τὸν ἀρχιερέα
  choice: 大祭司
  rationale: 当時の職名として、現代日本語の聖書表現で明確な「大祭司」を用いた。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: この文脈のγραμματεῖςは、律法の専門家・教師として活動した人々を指すため、一般読者に役割が伝わる「律法学者」とした。
- source_word: οἱ πρεσβύτεροι
  choice: 長老たち
  rationale: ユダヤ人社会の公認された指導者層を指す定着した訳語「長老」を用いた。
- source_word: συνήχθησαν
  choice: 集まっていた
  rationale: イエスが連行された時点ですでに集合していたことが自然に伝わる。形態上は受動形であり、「集められていた」という理解も可能なので注記した。
theological_decisions: []
