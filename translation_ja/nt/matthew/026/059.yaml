  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: ja
  text: 祭司長たちと最高法院全体は、イエスを死刑にするため、イエスに不利な偽証[a]を捜していた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「偽りの証言」。ギリシア語は法的な場でなされる虚偽の証言を指す。
    reason: lexical_alternative
  - marker: b
    text: 「最高法院」は、ユダヤ人の最高統治・司法機関であるサンヘドリンを指す。
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: （訳出せず）
  rationale: 物語を緩やかに進める接続辞であり、日本語では文脈上、明示的な接続語を置かないほうが自然である。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 当時の上級祭司指導者層を指す定着した聖書用語であり、複数の現職大祭司という誤解を避ける。
- source_word: τὸ συνέδριον ὅλον
  choice: 最高法院全体
  rationale: ユダヤの最高統治・司法機関を指す語として簡潔に示し、ὅλονの全体性も保持する。
- source_word: ἐζήτουν
  choice: 捜していた
  rationale: 未完了過去の継続的な動きを自然な日本語で表す。
- source_word: ψευδομαρτυρίαν
  choice: 偽証
  rationale: 法的文脈に合い、虚偽の証言という内容を簡潔かつ明確に表す。語が証言または証人を指し得る点は脚注に残す。
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: イエスに不利な
  rationale: 裁判上、イエスを訴える方向の証言であることを自然な現代日本語で表す。
- source_word: ὅπως αὐτὸν θανατώσωσιν
  choice: イエスを死刑にするため
  rationale: 目的節を明示し、司法的文脈における『死に至らせる』意図を表す。代名詞は日本語での指示の明瞭さのため固有名詞で示す。
theological_decisions:
- issue: 指導者たちの司法的意図
  choice: 偽証を継続して捜し、それによってイエスを死刑にしようとする目的を明示する。
  alternative: 『イエスを殺すため』と一般的に訳す。
  rationale: ἐζήτουνの継続相とὅπως以下の目的を保ち、計画的な司法手続きの悪用という本文の力を、教理的説明を加えずに示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法廷場面に合わせて「偽証」「死刑にする」を用い、未完了過去は「捜していた」で表した。すべての脚注標識を本文に配置した。
