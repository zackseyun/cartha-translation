id: MAT.26.18
reference: Matthew 26:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: ja
  text: そこでイエスは言った。「都に入り、ある人のところへ行って、こう言いなさい。『先生が、「わたしの時が近づいている。わたしは弟子たちと一緒に、あなたのところで過越の祭りを祝う」と言っておられます。』」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: 行って
  rationale: 移動を命じる複数形の命令であり、文脈に合う自然で簡潔な表現。
- source_word: πρὸς τὸν δεῖνα
  choice: ある人のところへ
  rationale: δεῖναは、名を明かさない特定の人物を指す。「ある人」でその特定性と匿名性を自然に保つ。
- source_word: Ὁ διδάσκαλος
  choice: 先生
  rationale: διδάσκαλοςの一般的で自然な現代日本語訳。伝言の中でイエスを指す呼称としても分かりやすい。
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: わたしの時が近づいている
  rationale: καιρόςが示す重要な時を、死、食事、使命の成就のいずれかに限定せず、原文の幅を保つ。
- source_word: πρὸς σὲ
  choice: あなたのところで
  rationale: 字義的な方向・関係性を保ちつつ、この文脈で場所を表す自然な日本語とした。「家」と明示する以上の限定は避ける。
- source_word: ποιῶ τὸ πάσχα
  choice: 過越の祭りを祝う
  rationale: ποιεῖν τὸ πάσχαは過越を守る、祝うという慣用表現。「祝う」は現代日本語として明瞭で、祭儀の実行を自然に伝える。
- source_word: μετὰ τῶν μαθητῶν μου
  choice: 弟子たちと一緒に
  rationale: μαθηταίの定着した訳語「弟子」を用い、μετάの共同性を明確に表す。
theological_decisions:
- issue: イエスのκαιρόςが何を指すか
  choice: 「わたしの時」とし、指示内容を限定しない
  alternative: 「わたしの定められた時」または「わたしの死の時」
  rationale: 本文自体は、その時を死、過越の食事、使命の成就のいずれかに明示的に限定していないため、物語上の含みと神学的緊張を保つ。
- issue: πρὸς σὲが示す場所
  choice: 「あなたのところで」
  alternative: 「あなたの家で」または字義的な「あなたとともに」
  rationale: 家での食事という文脈的含意は伝えながらも、原文にない「家」を本文へ補わず、また弟子たちとの「一緒に」との不自然な重複も避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら聖書本文にふさわしい落ち着いた調子にした。直接話法の入れ子は日本語のかぎ括弧で明確に示した。
