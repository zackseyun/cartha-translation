id: MAT.26.38
reference: Matthew 26:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: ja
  text: その時、イエスは彼らに言われた。「私の魂は、死ぬほど深く悲しんでいる。[a][b]ここにとどまり、私とともに目を覚ましていなさい。[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「深い悲しみに包まれている」または「悲しみに押しつぶされそうだ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「死に至るまで」。ここでは、死に至るほどの悲しみという極度を表す。
    reason: lexical_alternative
  - marker: c
    text: 「私とともに警戒して見守っていなさい」とも訳せる。ギリシア語は、眠らずにいることと、警戒して見守ることの両方を表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の次の場面を導く時間的な接続を、自然な現代日本語で示す。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は臨場感を与える歴史的現在だが、日本語では過去形が自然な物語文となる。主語がイエスであるため、敬意を表す通常の語法を用いた。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: λέγειの間接目的語をそのまま明示した。文脈上、弟子たちを指す。
- source_word: Περίλυπός
  choice: 深く悲しんでいる
  rationale: 強い悲しみや苦悩を表す語であり、明快な現代日本語でその強度を伝える。「悲しみに包まれている」なども可能なため脚注に残した。
- source_word: ἡ ψυχή μου
  choice: 私の魂
  rationale: 慣用的に「私は」と訳すこともできるが、原文に明示されたψυχήを保持し、イエスの内奥の苦悩を表した。ここで特定の心身観を付加しない。
- source_word: ἕως θανάτου
  choice: 死ぬほど
  rationale: 悲しみが死に及ぶほどであるという極度を、自然な日本語で表した。「死に至るまで」という方向性を持つ表現も可能なので脚注で示した。
- source_word: μείνατε
  choice: とどまり
  rationale: 弟子たちにその場所に残るよう命じるアオリスト命令形。厳粛さを保ちつつ現代日本語として自然な「とどまる」を選んだ。
- source_word: ὧδε
  choice: ここに
  rationale: 場所を示す副詞を直接的に訳した。
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 第一義的な覚醒を明確にし、直後に弟子たちが眠る場面とのつながりを保った。この語が含み得る警戒・見張りの意味は脚注に示した。
- source_word: μετ’ ἐμοῦ
  choice: 私とともに
  rationale: μετάの伴同行為を表し、弟子たちがイエスと一緒に目を覚ましているよう求められていることを明示した。
theological_decisions:
- issue: イエスの発言におけるψυχήの訳し方
  choice: 私の魂
  alternative: 私は
  rationale: ψυχήを単なる一人称に置き換えず、原文の名詞を保持した。これにより、イエスの真実で深い人間的苦悩をそのまま伝えつつ、魂と身体の関係について本文以上の教理的定義を持ち込まない。
- issue: γρηγορεῖτεが示す命令の範囲
  choice: 目を覚ましていなさい
  alternative: 見張っていなさい／目を覚まして警戒していなさい
  rationale: ゲツセマネの直接の文脈では実際に眠らないことが前景化する一方、この動詞には警戒して見守る意味もある。本文では覚醒を明示し、より広い警戒の含意を脚注に残して、両義性を消さない。
- issue: ἕως θανάτουが表す悲しみと死の関係
  choice: 死ぬほど
  alternative: 死に至るまで
  rationale: 極度の悲しみを表す自然な日本語を本文に用いた。ただし、単なる程度表現に限定せず、死に達するほど、または死に至るまでという原文の緊張を脚注に保持した。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの言葉の厳粛さを保った。「私の魂」を残して原文の表現を尊重し、過度に古風な「わが魂」「目を覚ましておれ」などは避けた。敬体ではなく聖書本文に適した常体とし、イエスへの叙述上の敬意として「言われた」を用いた。
