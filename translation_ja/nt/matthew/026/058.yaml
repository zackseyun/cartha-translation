  register: 明快で格調を保った現代標準日本語。未完了過去の継続性は「座っていた」で明示し、前半は日本語の叙述として過度に重くならない形にした。語義に幅のあるὑπηρέταιとτέλοςは本文で文脈に適した訳を採用し、脚注で代替訳と字義を示した。
