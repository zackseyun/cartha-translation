source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: ja
  text: しかし、ペトロは遠く離れてイエスのあとをついて行っていた。大祭司の屋敷の中庭まで来て、その中に入ると、結末[b]を見るために、役人たち[a]と一緒に座っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「従者たち」「係の者たち」「警備の者たち」とも訳せる。ギリシア語は、従属的な立場で職務に当たる者や補佐する者を広く指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「終わり」。ここでは、イエスをめぐる事態がどのような結果になるかという「結末」を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: あとをついて行き
  rationale: 未完了過去の継続的な動きを、日本語として自然な叙述で表した。目的語の指示対象は文脈上イエスであるため、「イエスのあと」と明示した。
- source_word: ἀπὸ μακρόθεν
  choice: 遠く離れて
  rationale: ペトロが一定の距離を保って従ったことを、明快な現代日本語で表す。
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: 大祭司の屋敷の中庭まで
  rationale: ἕωςの到達範囲と、ここでのαὐλήが建物に囲まれた中庭を指すことを明確にした。「屋敷」は中庭の所属関係を自然に示す補足である。
- source_word: εἰσελθὼν ἔσω
  choice: 中に入ると
  rationale: 主動詞に先立つ動作を自然に示し、ἔσωの「内側へ」という意味も保持した。
- source_word: ἐκάθητο
  choice: 座っていた
  rationale: 未完了過去が示す継続した状態を反映した。
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: 下役たちと一緒に
  rationale: ὑπηρέταιは大祭司側に仕える従属的な職務の者を指し得る。「下役」は役人・従者・警備担当者のいずれかに限定しすぎず、その職務上の従属関係を表す。
- source_word: ἰδεῖν τὸ τέλος
  choice: 結末を見届けようとして
  rationale: 目的を表す不定詞を「ようとして」で示した。τέλοςの字義的な「終わり」を踏まえつつ、この場面で事態がどう決着するかを見ようとした意味を「結末」で自然に表した。
