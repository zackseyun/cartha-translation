  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: ja
  text: その時、祭司長たちと民の長老たちは、カヤパと呼ばれる大祭司の屋敷の中庭[b]に集まった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「集められた」とも訳せる。原文の動詞は受動形。
    reason: lexical_alternative
  - marker: b
    text: 「中庭」に当たる語は、大きな邸宅や宮殿の中庭を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 直前の出来事を受けて次の場面を導く時間表現として、自然で明確な現代日本語を用いた。
- source_word: συνήχθησαν
  choice: 集められた
  rationale: アオリスト受動形を反映した。日本語では「集まった」も自然なため、脚注に代案を示した。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数の大祭司職保持者ではなく、指導的な祭司層を指す福音書の標準的な表現として訳した。
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: 民の長老たち
  rationale: 属格関係を素直に保ち、民の公認の指導者たちを表す簡潔な表現とした。
- source_word: εἰς τὴν αὐλὴν
  choice: 屋敷の中庭に
  rationale: εἰςは集合先を示す「に」とし、αὐλήの基本義である囲われた中庭を明示した。所有者が大祭司であることから、日本語で場所が自然に伝わるよう「屋敷の」を補った。語の意味の幅は脚注に残した。
- source_word: τοῦ ἀρχιερέως
  choice: 大祭司の
  rationale: 単数の職務保持者を指すため、日本語の定着した名称を用いた。
- source_word: τοῦ λεγομένου Καϊάφα
  choice: カヤパと呼ばれる
  rationale: 分詞の表現を保ちながら、人物名を自然に特定する現代日本語とした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位のある現代標準日本語。宗教的な定着語である「祭司長」「大祭司」「長老」を用い、ギリシア語の受動形とαὐλήの意味の幅を脚注で保持した。
