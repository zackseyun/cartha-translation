  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: ja
  text: では、このように起こらなければならないと述べている聖書の言葉は、どうして成就するのだろうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: では、どうして……だろうか
  rationale: 直前の発言を受ける推論的なつながりと、反語的な問いの力を自然な現代日本語で表す。
- source_word: πληρωθῶσιν
  choice: 実現する
  rationale: 聖書に記されたことが成就するという受動形の意味を、日本語では自然に「実現する」と表した。
- source_word: αἱ γραφαὶ
  choice: 聖書
  rationale: 一般の文書ではなく、イスラエルの聖なる諸文書を指す定着した表現として訳した。
- source_word: ὅτι
  choice: 「……」とあることが
  rationale: 後続句を聖書の内容として受ける理解を明確かつ自然に示す。
- source_word: οὕτως
  choice: このように
  rationale: 逮捕と受難が進むそのあり方を指す語として、簡潔で格調を保つ表現を選んだ。
- source_word: δεῖ γενέσθαι
  choice: 起こらなければならない
  rationale: 出来事が生じることと、その必然性の双方を保ち、必然性の根拠を本文以上に説明しない。
theological_decisions:
- issue: δεῖが示す必然性の性質
  choice: 「起こらなければならない」とだけ訳す
  alternative: 「神のご計画に従って起こらなければならない」
  rationale: 聖書の実現との結びつきから神的な必然性は含意されるが、ギリシア語本文が明記しない説明は加えず、神学的な緊張を保つ。
- issue: ὅτι節と「聖書」の統語関係
  choice: 聖書に記された内容として引用形式で示す
  alternative: 「聖書はどうして実現するだろうか。このように起こらなければならないのに」
  rationale: ὅτιを内容を導く接続詞と理解するのが自然だが、文全体を説明的に言い換えすぎないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの反語的な問いにふさわしい簡潔さと格調を保った。「成就する」より一般読者に分かりやすい「実現する」を採用し、引用形式によって内容関係を読み取りやすくした。
