review_pass:
  verdict: revise
  source_fidelity: 原文の πληρωθῶσιν は「（聖書が）成就する／満たされる」という受動的表現である。草案の「聖書に…とあることが、どうして実現する」は意味をおおむね伝えるが、実現する主体が「こと」となり、聖書そのものが成就するという原文の構文とややずれる。ὅτι節は聖書が述べる内容として自然に訳せる。
  naturalness: 「聖書の言葉は、どうして成就するのだろうか」は明瞭な現代標準語であり、文脈上の反語的な問いも保つ。「聖書」を集合的に用い、「聖書の言葉」とすることで、複数形 αἱ γραφαὶ の指示内容も日本語として無理なく表せる。
  terminology: 「聖書」「成就する」はこの文脈で定着した適切な用語である。「起こらなければならない」は δεῖ γενέσθαι の必然性を、根拠を付加せずに保つ。
  issues:
