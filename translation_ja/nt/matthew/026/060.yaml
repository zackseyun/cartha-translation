- source_word: οὐχ εὗρον
  choice: 見つからなかった
  rationale: 目的語は明示されておらず、直前の26:59で求めていた、イエスを死刑にするための証言または罪状を文脈上指す。日本語でも目的語を補わず自然に表現でき、ギリシア語の含みを保てる。
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: 多くの偽証人が進み出たにもかかわらず
  rationale: 属格独立構文を文脈上の譲歩として訳した。ψευδομάρτυρεςは裁判の場面に即して「偽証人」とし、προσέρχομαιは証言者として現れる意味を自然な「進み出る」で表した。
- source_word: ὕστερον δὲ
  choice: その後
  rationale: ὕστερονの時間的推移を明確にし、δέの軽い転換は文の切り替わりによって表した。
- source_word: προσελθόντες δύο
  choice: 二人が進み出て
  rationale: 法的審理の場で証人として前に出る動作を表す。「二人」を主語として明示し、後続節へ続く分詞の形を「進み出て」で保持した。
