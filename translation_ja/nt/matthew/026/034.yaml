base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: ja
  text: イエスは彼に言われた。「まことに、あなたに言います。今夜[a]、鶏が鳴く前に、あなたは三度、わたしを否認するでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「この夜に」。目前のこの夜を強調する言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: イエスは彼に言われた
  rationale: 単純な発話を表すἔφηを自然な物語文として訳した。日本語ではイエスへの敬意を表す通常の表現として「言われた」を用いた。
- source_word: Ἀμὴν λέγω σοι
  choice: まことに、あなたに言います
  rationale: イエスが発言の冒頭で用いる厳粛な確言の重みを保ちつつ、現代の読者に明瞭な日本語とした。
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: 今夜
  rationale: 日本語として最も自然であり、指示語ταύτῃが示す目前の夜という意味も文脈上明確である。強調については脚注で示した。
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: 鶏が鳴く前に
  rationale: 不定詞構文を自然な従属節にした。冠詞のないἀλέκτοραについて、日本語では「鶏が」とすることで不必要な特定を避けた。
- source_word: τρὶς
  choice: 三度
  rationale: 簡潔で格調を保ちながら、現代日本語でも明瞭な表現である。
- source_word: ἀπαρνήσῃ με
  choice: わたしを知らないと言います
  rationale: 直訳的な「わたしを否定する」は日本語では存在や発言の否定とも受け取られやすい。文脈上の関係否認を自然かつ明瞭に表し、原文の簡潔な表現は脚注に示した。
theological_decisions:
- issue: イエスの導入句Ἀμὴν λέγω σοιの訳し方
  choice: まことに、あなたに言います
  alternative: アーメン、わたしはあなたに言います／よく言っておきます
  rationale: イエスの言葉の厳粛さと権威を保ちながら、典礼的な外来語や過度な意訳を本文に持ち込まない。
- issue: ペトロのἀπαρνήσῃ μεが表す否認の内容
  choice: わたしを知らないと言います
  alternative: わたしを否定します／わたしとの関係を否定します
  rationale: 人間関係を否認するという文脈上の意味を明瞭にしたが、原文そのものは否認の文言を明示していないため、脚注でより直訳的な形を併記した。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの厳粛な予告にふさわしい簡潔さと品位を保った。「言われた」は日本語聖書として自然な敬意表現であり、古語にはしていない。
