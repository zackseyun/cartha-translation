  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: ja
  text: 再び、二度目に離れて行き、こう祈られた。「わたしの父よ、もし、わたしがこれ[a]を飲まなければ、これが過ぎ去ることができないのなら、あなたのみこころが行われますように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これ」は、前の節で語られた苦しみの杯を指す。この節のギリシア語本文では、単に「これ」と表現されている。
    reason: cross_reference
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: また、二度目に
  rationale: 反復を示すπάλινと「二度目に」を意味するἐκ δευτέρουの両方を保ちつつ、日本語として読める形にした。
- source_word: ἀπελθὼν προσηύξατο λέγων
  choice: 離れて行き、こう祈られた
  rationale: 先行する分詞と主動詞を自然な日本語の継起表現とし、λέγωνは祈りの内容を導く「こう」に含めた。イエスに対する敬意を表すため主体敬語を用いた。
- source_word: Πάτερ μου
  choice: わたしの父よ
  rationale: 呼格と所有代名詞を明示し、親しい父子関係を保ちながら、荘重で分かりやすい呼びかけとした。
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: もし……これが過ぎ去ることができないのであれば
  rationale: οὐ δύναταιの不可能性とπαρελθεῖνの「過ぎ去る」を明示し、条件文として自然に整えた。
- source_word: τοῦτο / αὐτό
  choice: これ
  rationale: この節のギリシア語本文には「杯」という名詞がないため、指示語をそのまま保った。文脈上の指示対象は脚注で説明した。
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: わたしがこれを飲まないかぎり
  rationale: ἐὰν μήの除外条件を「～ないかぎり」で表し、πίωの飲むという比喩表現を保持した。
- source_word: γενηθήτω τὸ θέλημά σου
  choice: あなたのみこころが行われますように
  rationale: γενηθήτωの祈願を表す命令法の力を保ち、マタイ6章10節の祈りとの響きも維持できる定着した日本語表現を選んだ。
theological_decisions:
- issue: τοῦτο／αὐτόの指示対象を本文で「杯」と明示するか
  choice: 本文では「これ」とし、文脈上の指示対象を脚注に示す
  alternative: 本文で「この杯」と補う
  rationale: 直前の26章39節から苦しみの杯を指すことは明らかだが、本節自体にはποτήριονがない。本文にない名詞を補わず、文脈とのつながりは脚注で確保した。
- issue: イエスの服従の祈りをどう表すか
  choice: あなたのみこころが行われますように
  alternative: あなたのみこころのとおりになりますように
  rationale: 神のみこころへの服従と、γενηθήτωの祈願的な命令法を保つ。また、マタイ6章10節との語句上のつながりも損なわない。
- issue: 「飲まないかぎり」と「過ぎ去れない」の論理関係
  choice: もし、わたしがこれを飲まないかぎり、これが過ぎ去ることができないのであれば
  alternative: もしこれが過ぎ去ることができず、わたしがそれを飲まなければならないのであれば
  rationale: 原文のἐὰν μήを除外条件として明示し、苦しみを飲むこととそれが過ぎ去ることとの緊張を解釈で弱めないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りにふさわしい敬虔で格調ある文体とした。「また、二度目に」はやや重なる表現だが、原文のπάλινとἐκ δευτέρουをともに残すため意図的に保持した。
