  source_fidelity: 原文のἠρνήσατοを、直前の告発内容を受ける「それを否定し」としたのは、目的語を過度に特定せず文脈上の含意を日本語で明確にしており、適切です。ἔμπροσθεν πάντων（皆の前で）、λέγων（引用して「と言った」）、Οὐκ οἶδα τί λέγεις（「あなたが何を言っているのか、私には分からない」）も、いずれも原文の意味と発話の否認的性格を保っています。
  naturalness: 全体として明瞭で自然な現代標準日本語です。「しかし」による場面の推移、「皆の前で」の公然性、引用文の落ち着いた語調はいずれも受難物語の文脈に合っています。
  terminology: 固有名「ペトロ」は一貫した日本語聖書用語として許容されます。「否定」はἀρνέομαιに適切であり、「分からない」はこの文脈での『何を言っているのか理解しない』という主張を自然に表します。神学的な説明の上乗せはありません。
