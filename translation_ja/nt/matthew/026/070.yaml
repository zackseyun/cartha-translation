  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: ja
  text: しかし、ペトロは皆の前でそれを否定し、「あなたが何を言っているのか、私には分からない」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: それを否定し
  rationale: 直前の女中の言葉を否定したことを示す。ギリシア語に目的語は明示されていないため、文脈上の内容を受ける「それを」にとどめ、イエスとの関係を直接否認したなどの説明は加えない。
- source_word: ἔμπροσθεν πάντων
  choice: 皆の前で
  rationale: その場にいた人々の面前で行われた公然の否定という意味を、簡潔で自然な日本語で表す。
- source_word: λέγων
  choice: 「……」と言った
  rationale: ギリシア語の分詞を、現代日本語の物語文として自然な引用構文にする。
- source_word: Οὐκ οἶδα
  choice: 私には分からない
  rationale: ここでは相手の発言内容を理解していないと主張する表現なので、日本語では「知らない」より「分からない」が自然である。
- source_word: τί λέγεις
  choice: あなたが何を言っているのか
  rationale: 語義と構文を直接保ちつつ、現代日本語として自然に表現する。「何のことを言っているのか」も可能だが、原文の言い方により近い訳を採る。
theological_decisions:
- issue: ペトロの否定の対象
  choice: 直前の発言内容を指す「それ」を補う
  alternative: 「イエスを否定した」または目的語を補わず単に「否定した」とする
  rationale: 原文は目的語を明示せず、直前の告発に応じて「否定した」と述べる。日本語の明瞭さのため最小限の目的語を補うが、否定の対象を原文以上に特定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、受難物語にふさわしい落ち着いた語調とした。ペトロの発言は直訳調に傾きすぎない範囲で原文の構造を保った。
