  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: ja
  text: しかし、これらすべてのことが起こったのは、預言者たちの書が成就するためである。」その時、弟子たちは皆、イエスを残して[a]逃げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見捨てて」とも訳せる。ここでのἀφέντεςには、単にその場を離れる以上に、イエスを見捨てるという強い意味が文脈上含まれ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: しかし、このすべてのこと
  rationale: 直前までの出来事全体を指す表現として自然な日本語にし、δέの軽い対照・接続を「しかし」で表した。
- source_word: γέγονεν
  choice: 起こった
  rationale: 完了した出来事を明瞭に表す。日本語では文脈上、その結果が現在に及ぶことも自然に含意される。
- source_word: ἵνα πληρωθῶσιν
  choice: 成就するため
  rationale: 目的と結果の双方を響かせ得るἵνα構文を断定的に狭めず、マタイに特徴的な成就の語を保持した。
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: 預言者たちの書
  rationale: 聖なる預言書を指す定着した日本語表現を用い、属格を「書いた」「語った」などと説明的に限定しなかった。
- source_word: τότε
  choice: その時
  rationale: 続いて起きた出来事を示す物語上の時間標識を自然に表した。
- source_word: οἱ μαθηταὶ πάντες
  choice: 弟子たちは皆
  rationale: πάντεςの全体性と強調を保ち、原文に明記されない所有表現は加えなかった。
- source_word: ἀφέντες αὐτὸν
  choice: イエスを置き去りにして
  rationale: 文脈上の離反の重みを保ちつつ、「見捨てる」と断定するよりもἀφίημιの語義の幅を残した。代名詞は、日本語で指示対象を明瞭にするため「イエス」とした。
- source_word: ἔφυγον
  choice: 逃げた
  rationale: 危険から逃走したことを簡潔で重みのある現代日本語で表した。
theological_decisions:
- issue: 預言者の書の成就
  choice: 「預言者たちの書が成就するため」と明示する
  alternative: 「預言者たちが書いたことが実現するため」
  rationale: 原文のγραφήと「成就する」というマタイの神学的に重要な語法を保ち、著者関係を説明的に言い換えない。
- issue: 弟子たちの離反の強さ
  choice: 「置き去りにして」と訳し、脚注で「見捨てて」の可能性を示す
  alternative: 本文を「見捨てて」とする
  rationale: 弟子たちの全面的な逃走を弱めずに表しながら、ἀφέντεςが必ずしも心理的・道徳的評価だけを語るとは限らない余地を残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「成就する」「預言者たちの書」など聖書本文にふさわしい簡潔で格調ある表現を保った。発話の終わりを示す閉じかぎ括弧は文脈上補った。脚注記号は該当語句の直後に置いた。
