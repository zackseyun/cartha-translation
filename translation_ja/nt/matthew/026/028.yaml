id: MAT.26.28
reference: Matthew 26:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: ja
  text: これは、多くの人のために[b]、罪の赦しのために注ぎ出される、わたしの契約の血[a]だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「わたしの新しい契約の血」とある。
    reason: textual_variant
  - marker: b
    text: 別訳「多くの人に代わって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: これは
  rationale: 指示代名詞をそのまま訳し、文脈上示されているものを指す。「杯」はこの節のギリシャ語本文にないため補わない。
- source_word: γάρ
  choice: だからです
  rationale: 直前の「飲みなさい」という命令の理由を示す説明的な接続を、自然な現代日本語で表す。
- source_word: τὸ αἷμά μου τῆς διαθήκης
  choice: わたしの契約の血
  rationale: 「血」と契約との結び付きを保持し、犠牲と契約の響きを言い換えで弱めない。底本にない「新しい」は本文へ加えない。
- source_word: περὶ πολλῶν
  choice: 多くの人のために
  rationale: 犠牲の文脈における利益・代理の含意を自然に表しつつ、「多くの人」という語を保ち、贖罪の範囲をめぐる議論を訳文で決着させない。別訳を脚注に示す。
- source_word: ἐκχυννόμενον
  choice: 注ぎ出される
  rationale: 現在受動分詞が「血」を修飾する関係を保ち、犠牲的なイメージを明瞭な日本語で伝える。
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: 罪が赦されるために
  rationale: 目的・結果の方向性を保持しつつ、「罪の赦しのために」よりも一般読者に自然で明瞭な表現とする。
theological_decisions:
- issue: 「契約」に「新しい」を含めるか
  choice: 契約
  alternative: 新しい契約
  rationale: SBLGNTの提示本文には καινῆς（「新しい」）がないため、底本に従う。異読は脚注で保存する。
- issue: 「多くの人のために」が示す贖罪の範囲
  choice: 多くの人のために
  alternative: すべての人のために
  rationale: 本文の πολλῶν を保持し、この節だけで贖罪の範囲に関する神学的論争を解決しない。
- issue: περί＋属格の訳し方
  choice: 多くの人のために
  alternative: 多くの人に代わって
  rationale: 利益・代理の含意を自然に伝える標準的な表現を本文に置き、より明示的な代理表現は語義上の別訳として脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。聖餐・契約・犠牲に関する原文の表現を保持し、底本にない語を補わず、神学的な含意を過度に説明しない。脚注記号は該当句の情報をまとめて文末に配置した。
