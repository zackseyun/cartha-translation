  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: ja
  text: すると、イエスを裏切ろうとしていたユダが答えた。「先生、まさか私ではないでしょうね。」イエスは彼に言われた。「あなたがそう言った。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: イエスを裏切ろうとしていた
  rationale: 現在分詞を、進行中の企てを表す自然な日本語にした。παραδίδωμι は文脈上、単なる「引き渡す」ではなく裏切って引き渡す意味。
- source_word: Μήτι ἐγώ εἰμι
  choice: まさか私ではないでしょうね
  rationale: μήτι が否定の答えを予期する問いであることを、日本語の「まさか…ではないでしょうね」で表した。
- source_word: ῥαββί
  choice: 先生
  rationale: 当時の敬称としての Rabbi を、一般読者に明瞭な現代日本語で訳した。
- source_word: Σὺ εἶπας
  choice: あなたがそう言った
  rationale: ギリシア語の簡潔で間接的な応答を保持し、「そのとおりだ」と断定的に言い換えず、原文の含みを残した。
theological_decisions:
- issue: 「あなたがそう言った」という応答の断定性
  choice: あなたがそう言った
  alternative: そのとおりだ
  rationale: Σὺ εἶπας は肯定を含み得る慣用的応答だが、あえて間接的に述べる表現でもあるため、その曖昧さと緊張を保存した。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文。「ラビ」より「先生」を採用して普通の読者への理解しやすさを優先しつつ、イエスの応答は直訳調を保って含意を狭めない。
