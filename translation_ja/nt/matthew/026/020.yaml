  text: Ὀψίας δὲ γενομένης ἀνέκειτο μετὰ τῶν δώδεκα ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/020.yaml
  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: ja
  text: 夕方になると、イエスは十二人の弟子たち[a]と共に、食事の席に横になっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「弟子たち」がなく、「十二人」とだけあります。
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 夕方になると
  rationale: 属格独立構文が示す時の状況を、簡潔で自然な現代日本語にした。「夕方になった時」も可能だが、「夕方になると」のほうが物語の進行として滑らかである。
- source_word: ἀνέκειτο
  choice: 食事の席に横になっていた
  rationale: 当時の食事で横になって席に着く姿勢を表す動詞なので、単に「座っていた」「食卓に着いていた」とせず、横になるという意味を明示した。食事の場面であることは動詞の慣用的な含意に基づく。
- source_word: μετὰ
  choice: と共に
  rationale: 属格を伴う μετά の共同・同伴の意味を、自然で品位のある日本語で表した。
- source_word: τῶν δώδεκα μαθητῶν
  choice: 十二人の弟子たち
  rationale: SBLGNT本文にある μαθητῶν を省略せず「弟子たち」と訳した。「十二人」だけの場合との本文異同は脚注に示した。
- source_word: implicit subject
  choice: イエスは
  rationale: ギリシア語では動詞の主語が文脈上省略されているが、日本語では主語を補うことで誰の行動かを明瞭にした。直前の文脈から主語はイエスである。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、食事の際に横になる当時の習慣を原文どおり残した。脚注記号は異読の該当箇所である「弟子たち」の直後に置いた。
