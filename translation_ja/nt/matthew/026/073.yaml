  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: ja
  text: 少しして、そこに立っていた人たちが近寄って来て、ペトロに言った。「確かに、あなたもあの人たちの仲間だ。あなたの話し方[a]からも、あなたが仲間だと分かる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「話し方」は「話しぶり」または「なまり」とも訳せる。ギリシャ語は、話す仕方やなまりを含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: しばらくして
  rationale: 短い時間が経過した後を表す自然な日本語で、物語の流れにも合う。
- source_word: δὲ
  choice: 独立した語では訳出しない
  rationale: ここでは物語を先へ進める軽い接続であり、日本語では文のつながりによって自然に表せる。
- source_word: προσελθόντες
  choice: 近寄って来て
  rationale: 人々がペトロのいる所へ近づいた動きを明確かつ自然に表す。
- source_word: οἱ ἑστῶτες
  choice: そこに立っていた人たち
  rationale: 原文の分詞表現を保ちつつ、その場にいた人々を指す自然な表現とした。
- source_word: Ἀληθῶς
  choice: 確かに
  rationale: 話し手たちの確信を伴う断定を、現代日本語の会話として明瞭に表す。
- source_word: καὶ σὺ
  choice: あなたも
  rationale: ペトロもその集団に属するという包含の強調を保つ。
- source_word: ἐξ αὐτῶν
  choice: あの人たちの仲間
  rationale: 直訳的な「彼らのうちの者」より自然に、集団への所属を表す。
- source_word: καὶ γὰρ
  choice: …からも
  rationale: γάρの理由提示とκαίの付加・強調を、日本語では文末の「も」を用いて簡潔に表した。
- source_word: ἡ λαλιά σου
  choice: 話し方
  rationale: 声そのものではなく、発話の仕方、言葉遣い、なまりを含み得る語義の幅を保つ。文脈上「なまり」も有力だが、原文以上に限定しない。
- source_word: δῆλόν σε ποιεῖ
  choice: それが分かる
  rationale: 直訳では「あなたを明らかにする」だが、ここではペトロが仲間であることが発話によって判明するという意味を、自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、会話には確信を込めつつ過度に荒々しくない調子を持たせた。「人々」より会話的で読みやすい「人たち」を採用し、全体の品位は保った。
