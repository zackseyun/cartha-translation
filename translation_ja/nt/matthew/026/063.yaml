source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: ja
  text: しかし、イエスは黙っておられた。そして、大祭司はイエスに言った。「生ける神にかけて、あなたに厳命する[a]。あなたがメシア[b]、神の子なのか、私たちに答えなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「生ける神にかけて、あなたに命じる」。原文は、神を呼び求めて相手に答えを要求する厳粛な宣誓・法廷の表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「キリスト」。ギリシア語クリストスは「油を注がれた者」を意味する称号で、ここでは「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: 黙っておられた
  rationale: 未完了過去が表す継続した沈黙を自然な日本語で示す。「おられた」は物語におけるイエスへの節度ある敬意を保つ。
- source_word: ἀρχιερεύς
  choice: 大祭司
  rationale: 当時のユダヤ教における最高位の祭司職を表す標準的な訳語。
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: 生ける神にかけて、あなたに厳命する
  rationale: 神を証人として呼び求める厳粛な宣誓要求の力を、「生ける神にかけて」と「厳命する」によって明確かつ自然に表す。
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: 私たちに答えなさい
  rationale: 厳命の内容として発言を要求しているため、裁判的な問答の文脈に合う自然な命令表現とした。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名ではなく、待望された油注がれた者という称号として機能するため、「メシア」と訳す。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: キリスト論的称号を簡潔にそのまま表し、その意味を本文で過度に解釈しない。
- source_word: ὁ δὲ Ἰησοῦς
  choice: しかし、イエスは
  rationale: δέが直前の告発に対するイエスの沈黙を対照的に導くため、「しかし」とした。
theological_decisions:
- issue: Χριστόςを直接的なキリスト論的尋問の中でどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: 定冠詞を伴う称号として、待望された油注がれた者を指す文脈である。「キリスト」も伝統的に定着しているため脚注に残す。
- issue: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος の効力
  choice: 神を証人として立てる厳粛な宣誓要求として訳す
  alternative: 単なる命令として訳す
  rationale: 神への正式な訴えを含む法廷的な表現なので、単なる「命じる」より強い「生ける神にかけて、あなたに厳命する」とした。ただし、後代の特定の法制度用語は持ち込まない。
- issue: 「メシア」と「神の子」の関係
  choice: 二つの称号を並置したまま訳す
  alternative: 後者を前者の説明と明示して訳す
  rationale: 原文は両称号を並べるが、その統語的・神学的関係を説明語で限定していないため、曖昧さと緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁判場面の厳粛さを保った。「厳命する」は日常語より格調があるが理解可能であり、宣誓要求の法廷的な強さに適する。引用内は現代的で直接的な命令表現とした。
