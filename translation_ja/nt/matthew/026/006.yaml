  text: さて、イエスがベタニア[a]で、皮膚病を患ったシモン[b]の家におられたとき、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスがベタニアに滞在している間に」とも訳せる。ギリシア語の構文は、出来事の時と状況を示している。
