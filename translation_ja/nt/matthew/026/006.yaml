lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: さて、イエスが……おられたとき
  rationale: 属格独立構文を、場面の移行と時を示す自然な日本語にした。δέは強い逆接ではなく緩やかな場面転換なので「さて」とし、γενομένουはここでは木直訳せず、所在を表す「おられた」とした。
- source_word: ἐν Βηθανίᾳ
  choice: ベタニアで
  rationale: 場所を表すἐνを、後続する「家におられた」と自然につながる助詞「で」で訳した。
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: シモンの家に
  rationale: οἰκίαはここでは出来事の物理的な場所であり、属格Σίμωνοςは所有を示す。
- source_word: τοῦ λεπροῦ
  choice: 皮膚病のシモン
  rationale: λεπρόςを現代の特定の病名に限定せず、当時この語が広く皮膚疾患を指し得たことを踏まえて訳した。原文の簡潔な呼び名を保ち、現在罹患中か過去の罹患かは本文で断定しない。
theological_decisions:
- issue: 「皮膚病のシモン」という呼び名が示す罹患時期
  choice: 現在罹患中とも、以前に癒やされたとも断定しない
  alternative: 「かつて皮膚病だったシモン」または「皮膚病を患っているシモン」
  rationale: ギリシア語はシモンを識別する呼び名を置くだけで、その病状の時期や治癒の有無を明示していないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。未完の従属節である原文に合わせ、読点で次節へ続けた。「皮膚病のシモン」はやや異質な呼称だが、原文の識別的な添え名とその曖昧さを保つため採用した。
