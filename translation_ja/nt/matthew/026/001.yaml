  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: ja
  text: イエスはこれらのことばをすべて語り終えると、弟子たちに言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: 〜終えると
  rationale: セム語的な物語移行句を、現代日本語で自然な時間表現として訳した。「そのとき」と訳してもよいが、出来事が起こったという形式的要素を逐語的に加えると不自然になる。
- source_word: ἐτέλεσεν
  choice: 語り終える
  rationale: 後続する主動詞「言われた」に先立つ完了を表す。目的語が「ことば」であるため、日本語では「語り終える」が自然である。
- source_word: πάντας τοὺς λόγους τούτους
  choice: これらのことばをすべて
  rationale: λόγους の語義と、マタイにおける説教区分の結びの定型を保つため「ことば」とした。「これらすべてのこと」も可能だが、語彙上の対応が弱くなる。
- source_word: εἶπεν
  choice: 言われた
  rationale: λέγω の基本的意味を保ちつつ、イエスを主語とする日本語聖書本文にふさわしい自然で節度ある敬語表現とした。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: μαθηταῖς を慣用的に「弟子たち」と訳す。日本語では主語が明示されているため、αὐτοῦ の所属関係は文脈上明白であり、「ご自分の弟子たち」とすると過度に重くなる。
