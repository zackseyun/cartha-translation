  verdict: approve
  source_fidelity: 「イエスはこれらのことばをすべて語り終えると、弟子たちに言われた。」は、ὅτεを時間関係の「〜すると」として自然に表し、ἐτέλεσεν、πάντας τοὺς λόγους τούτους、εἶπεν、τοῖς μαθηταῖς αὐτοῦの内容を過不足なく伝えている。冒頭のΚαὶ ἐγένετοというマタイ的な移行句は、日本語では独立した出来事表現を加えず時間構文に吸収しており、意味を損なわない。
  naturalness: 明瞭で現代標準日本語として自然である。「語り終えると」は、後続の発話に先行する完了を無理なく示す。「言われた」という節度ある敬語も、日本語聖書本文の文体として一貫しており不自然ではない。
  terminology: 「弟子たち」は μαθηταί の標準的な訳語であり、「これらのことばをすべて」は λόγους の語彙的意味と説教終結の定型性を保つ。「ことば」の表記も本文の語調に適している。
