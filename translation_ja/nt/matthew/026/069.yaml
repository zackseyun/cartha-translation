source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: ja
  text: 一方、ペトロは外の中庭で座っていた。そこへ、一人の女の召使い[a]が彼に近づいて来て言った。「あなたも、ガリラヤ人イエスと一緒にいました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「若い女の召使い」または「女奴隷」とも訳せる。ギリシャ語のπαιδίσκηは若い女性の召使いを指し、奴隷身分の女性を指すこともある。
    reason: παιδίσκηの年齢・奉仕者としての役割・奴隷身分の可能性という語義の幅を示すため。
lexical_decisions:
- source_word: δὲ
  choice: 一方
  rationale: 場面を大祭司邸内の審理から外にいるペトロへ移す、穏やかな対照を示す。明示的な時を表す語ではないため「さて今」とはしない。
- source_word: ἐκάθητο ἔξω
  choice: 外の中庭に座っていた
  rationale: 未完了過去が示す継続中の状態を「座っていた」で表し、ἔξωを屋内で行われている審理との位置関係として「外」と訳した。
- source_word: ἐν τῇ αὐλῇ
  choice: 中庭に
  rationale: ここでは大祭司の邸宅にある開放された中庭を指すため、現代日本語で明瞭な「中庭」とした。
- source_word: προσῆλθεν αὐτῷ
  choice: 彼に近寄って来て
  rationale: ペトロのもとへ物理的に近づいた動きを自然な日本語で表した。
- source_word: μία παιδίσκη
  choice: 一人の若い女性の召使い[a]
  rationale: μίαによる一人の人物の導入を残し、παιδίσκηが示し得る若い女性の召使いという身分を表した。奴隷身分かどうかは本文で断定せず、脚注で語義の幅を示す。
- source_word: λέγουσα
  choice: 言った
  rationale: ギリシャ語では分詞だが、日本語では有限動詞として前文を閉じる方が自然で明瞭である。
- source_word: Καὶ σὺ
  choice: あなたも
  rationale: καίと強調されたσὺが、イエスと共にいた他の者にペトロを加えていることを表す。
- source_word: ἦσθα μετὰ
  choice: 一緒にいました
  rationale: 関係を説明的に膨らませず、「共にいた」という直接的な意味を自然に表した。
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: ガリラヤ人イエス
  rationale: Γαλιλαῖοςを出身地による呼称として保ち、「ガリラヤのイエス」よりも原文の異名的な響きを明確にした。
