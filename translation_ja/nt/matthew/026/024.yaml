id: MAT.26.24
reference: Matthew 26:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: ja
  text: 人の子は、自分について書かれているとおりに去って行きます。しかし、人の子を裏切る[a]その人には災いがあります。その人は、生まれなかったほうがよかったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人の子を引き渡すその人」とも訳せる。ギリシア語の動詞は「裏切る」と「引き渡す」のどちらの意味にもなり得る。ここではユダの背信が問題になっているため、「裏切る」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ... δὲ
  choice: 人の子は……しかし
  rationale: 「人の子」という称号を保持し、μέν…δέの対照は、日本語で不自然な「確かに」を加えず、「……しかし」で明確に示した。
- source_word: ὑπάγει
  choice: 去って行きます
  rationale: 単なる移動とも死への歩みとも取り得る表現なので、「死ぬ」と明示せず、文脈的な含みを保つ「去って行く」とした。
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: 自分について書かれているとおりに
  rationale: γέγραπταιの、書かれて現在も効力を持つ完了の含意を、日本語で慣用的な「書かれている」によって表した。αὐτοῦの指示対象が人の子であることを自然に示すため「自分について」とした。
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: しかし、……その人には災いがあります
  rationale: οὐαίの預言的・裁きの響きを「災い」によって保ちつつ、現代の読者に理解できる文にした。ἐκεῖνοςの指示性は「その人」で保持した。
- source_word: δι’ οὗ
  choice: ……を……その人
  rationale: διά＋属格が表す媒介・行為者を、日本語では関係節「人の子を裏切るその人」によって自然に表した。
- source_word: παραδίδοται
  choice: 裏切る
  rationale: この文脈ではユダの背信行為が前景化しているため「裏切る」とした。ただし、語のより広い意味である「引き渡す」も脚注に残した。ギリシア語の受動形は、日本語として自然な能動関係節に転換した。
- source_word: καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: 生まれなかったほうがよかった
  rationale: 反実仮想的な比較・選好を表すギリシア語の慣用句を、現代日本語で自然かつ厳粛な言い方にした。
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: その人
  rationale: ἐκεῖνοςの強い指示性を保持しつつ、日本語で性別を不必要に反復しない自然な表現とした。
theological_decisions:
- issue: 聖書に記された成就と裏切る者の責任との関係
  choice: 人の子が書かれているとおりに去ることと、裏切る者への災いの宣告を、どちらも弱めず並置した。
  alternative: 予定を強調して裏切る者の責任を弱める読み、または人間の行為だけを強調して聖書の成就を弱める読み。
  rationale: 原文は神的な計画・聖書の成就と人間の責任との緊張を解消していないため、訳文も両方をそのまま保持する。
- issue: 「生まれなかったほうがよかった」という結語の意味
  choice: 厳しい裁きの宣告として訳し、それ以上の組織神学的結論は加えない。
  alternative: 単なる誇張と限定する読み、または滅びや予定についての詳細な教理をこの一節だけから明示する読み。
  rationale: 原文の強烈さを保ちながら、この句が明言していない結論を訳文に持ち込まないため。
translation_notes:
  register: 明快な現代標準日本語による、口語的すぎない丁寧体。称号「人の子」と裁きの語「災い」を保持して聖書本文らしい厳粛さを保ち、語順と関係節は日本語として自然になるよう調整した。
