  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: ja
  text: 彼らは言った。「この男は、『私は神の神殿[b]を壊し、三日で[a]建てることができる』と言った。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「三日のうちに」。ギリシア語の表現は、その期間内に完成することを意味しうる。
    reason: lexical_alternative
  - marker: b
    text: ヨハネ2章19―21節は、イエスの神殿に関する発言がご自分の体を指していたと説明している。
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: 彼らは言った
  rationale: アオリスト直説法を、証人たちの発言を一つの出来事として提示する自然な物語体で訳した。
- source_word: Οὗτος
  choice: この男
  rationale: 指示的でやや突き放した法廷での言い方を、現代日本語で自然に保った。
- source_word: ἔφη
  choice: と言いました
  rationale: 単に発言内容を報告する語であり、「主張した」などの意味を加えずに訳した。引用内の発言として自然な敬体を用いた。
- source_word: Δύναμαι
  choice: できる
  rationale: 能力・可能を表す語を、明瞭で自然な現代日本語にした。
- source_word: καταλῦσαι
  choice: 壊し
  rationale: 建造物について、破壊する・取り壊すという意味を簡潔に表す。
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: 神の神殿
  rationale: ναόςを文脈上明瞭な「神殿」とし、属格τοῦ θεοῦを素直に「神の」と訳した。
- source_word: διὰ τριῶν ἡμερῶν
  choice: 三日で
  rationale: 三日という期間を経て、またはその期間内に完成する意味を持ちうる表現を、簡潔で自然な日本語にした。別訳の可能性は脚注に示した。
- source_word: οἰκοδομῆσαι
  choice: 建てる
  rationale: ギリシア語は単に「建てる」であり、「建て直す」という文脈上の補足を本文には加えなかった。目的語は日本語では前文から自然に補えるため反復しない。
theological_decisions:
- issue: 告発における「神の神殿」の指示対象
  choice: 証人たちの告発を、その表面上の意味どおり神殿についての発言として訳す。
  alternative: ヨハネ2章21節に基づき、本文自体をイエスの体への言及として訳す。
  rationale: マタイ26章61節は裁判で証人たちが報告した告発内容を記している。ヨハネによる解釈を本文へ織り込まず、関連情報は脚注に置くことで、マタイの場面と神学的な関連の双方を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。物語の地の文は常体とし、大祭司らに向けた証人の報告は自然な敬体にした。告発の直接引用は、原文の簡潔さと法廷的な響きを保っている。
