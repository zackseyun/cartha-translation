id: MAT.26.26
reference: Matthew 26:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: ja
  text: 一同が食事をしているとき[a]、イエスはパンを取り、祝福して[b]それを裂き、弟子たちに与えて言われた。「取って食べなさい[c]。これはわたしの体です[d]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「一同が食事をしている間に」。
    reason: lexical_alternative
  - marker: b
    text: 「祝福の言葉を述べて」とも訳せる。この行為を、パンを前にして感謝をささげることと理解する場合もある。
    reason: lexical_alternative
  - marker: c
    text: 直訳では「取りなさい、食べなさい」。
    reason: lexical_alternative
  - marker: d
    text: ギリシア語は直訳すると「これはわたしの体です」。これを「わたしの体を意味する／象徴する」と解釈する場合もあるが、本文では原文の言い方を保った。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: 一同が食事をしているとき
  rationale: 属格独立構文の時間的な背景と動作の継続を自然な現代日本語で表した。δέは軽い接続であり、強い逆接にはしなかった。
- source_word: λαβὼν
  choice: 取り
  rationale: 主動詞に先立つアオリスト分詞を、日本語の自然な動作の連続として訳した。
- source_word: ἄρτον
  choice: パン
  rationale: 食事の文脈ではパンまたは一つのパンを指し得るが、原語の範囲を狭めない標準的な訳語を採用した。
- source_word: εὐλογήσας
  choice: 祝福して
  rationale: εὐλογέωを直接反映し、感謝をささげるという別の動詞に置き換えなかった。祝福の対象を本文で明示せず、原文の簡潔さも保った。
- source_word: ἔκλασεν
  choice: それを裂き
  rationale: パンを分ける動作を自然に表し、目的語の『それを』は直前のパンを受けるものとして補った。
- source_word: δοὺς τοῖς μαθηταῖς
  choice: 弟子たちに与えて
  rationale: 分詞を一連の動作として訳した。原文に明示されない所有表現『自分の』は加えなかった。
- source_word: Λάβετε φάγετε
  choice: 取って食べなさい
  rationale: 二つのアオリスト命令を自然な日本語の連続命令として表した。接続詞のない原文の形は脚注で示した。
- source_word: τοῦτό ἐστιν
  choice: これは…です
  rationale: 単純な連結辞ἐστινを『意味する』『象徴する』と解釈的に言い換えず、そのまま保った。
- source_word: τὸ σῶμά μου
  choice: わたしの体
  rationale: σῶμαと所有表現を標準的な現代日本語で直接訳した。
theological_decisions:
- issue: 主の晩餐における『これはわたしの体です』という言葉
  choice: τοῦτό ἐστιν τὸ σῶμά μουを『これはわたしの体です』と訳す。
  alternative: 『これはわたしの体を意味します』または『これはわたしの体を象徴します』
  rationale: 原文は単純な連結辞ἐστινを用いている。特定の聖餐理解を本文に持ち込まず、原文が持つ神学的緊張と解釈上の余地を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語部分は自然な動作の流れを優先し、イエスの言葉は簡潔で直接的な調子を保った。
