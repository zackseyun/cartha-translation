id: MAT.26.13
reference: Matthew 26:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: ja
  text: まことに、あなたがたに言います。この良い知らせ[a]が世界中のどこで宣べ伝えられても、この女性がしたことも、彼女の記念として語られます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この福音」。
    reason: lexical_alternative
  - marker: b
    text: または「この女性がしたことも、彼女を覚えるために語られます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: イエスの厳粛な確言を導く語として、音訳の「アーメン」ではなく、現代日本語で意味が明確な表現を用いた。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 二人称複数への直接の語りかけを保ちつつ、自然な現代日本語とした。
- source_word: ὅπου ἐὰν
  choice: どこで……ても
  rationale: 場所を限定しない一般的な条件を、日本語の譲歩条件表現で自然に示した。
- source_word: κηρυχθῇ
  choice: 宣べ伝えられても
  rationale: 公に告げ知らせるというκηρύσσωの意味を保ち、聖書文脈でも一般読者に理解しやすい表現とした。
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: この良い知らせ
  rationale: εὐαγγέλιονの基本的意味を明瞭に表し、伝統的な「福音」は脚注に残した。
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: 世界中
  rationale: 全世界に及ぶ範囲を簡潔で自然な日本語によって表した。
- source_word: λαληθήσεται
  choice: 語られます
  rationale: 未来受動の形を保ち、この女性の行為が後に言及されることを自然に表した。
- source_word: ὃ ἐποίησεν αὕτη
  choice: この女性がしたこと
  rationale: 中性関係代名詞が行為を指すことを明示し、文脈上の女性を、侮蔑的に響きうる「この女」ではなく「この女性」とした。
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: 彼女を覚えるために
  rationale: 記憶・記念という意味と目的的なεἰςの含みを、分かりやすい現代日本語で表した。記念としてという解釈可能性は脚注に示した。
theological_decisions:
- issue: εὐαγγέλιονの訳語
  choice: 良い知らせ
  alternative: 福音
  rationale: 教会用語として定着した「福音」も可能だが、ギリシア語の意味を一般読者に直接伝える「良い知らせ」を本文とし、伝統的訳語を脚注に置いた。
- issue: εἰς μνημόσυνον αὐτῆςの関係
  choice: 彼女を覚えるために
  alternative: 彼女の記念として
  rationale: 目的を表す読みを自然に訳したが、その行為自体が彼女の記念となるという表現上の含みも排除せず、脚注に残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「まことに」と「宣べ伝える」により聖書らしい厳粛さを保ちながら、「良い知らせ」「この女性」など、一般読者に理解しやすく不必要に古風でない語を選んだ。
