id: MAT.26.55
reference: Matthew 26:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: ja
  text: その時、イエスは群衆に言われた。「強盗[a]にでも向かうように、剣やこん棒を持って私を捕らえに来たのか。私は毎日、神殿の境内で座って教えていたのに、あなたがたは私を捕らえなかった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「追いはぎ」、また文脈によっては「武装した反乱者」とも訳せる。ギリシア語は、単なる盗人よりも暴力的な略奪者を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: その時
  rationale: 直訳的な「その時刻に」より自然な現代日本語で、直前の逮捕場面を指す時間表現としての即時性を保つ。
- source_word: τοῖς ὄχλοις
  choice: 群衆に
  rationale: ギリシア語は複数形だが、日本語の集合名詞「群衆」は数を不自然に強調せず、現場に集まった人々を明瞭に表す。
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: 強盗にでも向かうように
  rationale: ἐπίを伴う句の敵対的な方向性を反映しつつ、イエスが危険な犯罪者であるかのように扱われているという修辞的対比を自然に表す。
- source_word: ἐξήλθατε
  choice: 来たのか
  rationale: 話者であるイエスのもとへ武装して出向いて来た動作を、日本語の視点に即して簡潔に表す。
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: 剣やこん棒を持って
  rationale: μάχαιραは武器としての剣、ξύλονはこの文脈では打撃用の木製武器を指すため、「こん棒」が機能を明確に伝える。接続は自然な列挙として「や」を用いる。
- source_word: συλλαβεῖν με
  choice: 私を捕らえに
  rationale: 逮捕の含意はあるが、語そのものの「捕らえる」という広い意味を保ち、後半のκρατέωとの語義の重なりも日本語では自然に受け入れる。
- source_word: καθ’ ἡμέραν
  choice: 毎日
  rationale: 日ごとの反復を明瞭かつ自然に表す。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内で
  rationale: ἱερόνは内陣だけでなく神殿域全体を指し得るため、「境内」を補って、公開の場で教えていたことを明確にする。
- source_word: ἐκαθεζόμην διδάσκων
  choice: 座って教えていた
  rationale: 未完了過去の継続・反復性と、同時に行われていた着座と教授の動作を自然に保つ。
- source_word: οὐκ ἐκρατήσατέ με
  choice: あなたがたは私を捕らえなかった
  rationale: κρατέωの「つかむ、拘束する」を文脈に即して表し、彼らが公然とはイエスを拘束しなかったという対照を伝える。
theological_decisions:
- issue: λῃστήςが示す犯罪者像の幅
  choice: 強盗
  alternative: 追いはぎ、武装した反乱者
  rationale: この語は暴力的な略奪者や場合によっては反乱者を指し得るが、この節だけで政治的反乱者に限定する根拠はない。「強盗」は暴力性を含む分かりやすい中心的訳語であり、意味の幅は脚注に残す。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳しい修辞疑問と公然たる教授との対照を保つ。敬語的な「言われた」を用い、引用内は過度に古風にせず、 dignified な聖書文体とした。
