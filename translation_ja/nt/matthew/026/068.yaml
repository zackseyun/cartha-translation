  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: ja
  text: こう言って言った。「メシア[a]よ、私たちに預言してみろ。おまえを打ったのは誰か。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語Χριστόςは、ここでは固有名のようにではなく、称号として用いられている。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 現在分詞で、直前の行為に伴って発せられた嘲りの言葉を導入する。日本語では文脈とのつながりを保ちつつ自然な叙述となる。
- source_word: Προφήτευσον
  choice: 預言してみろ
  rationale: アオリスト命令形。単なる依頼ではなく、預言者として相手を試す嘲弄の響きを「してみろ」で表した。
- source_word: ἡμῖν
  choice: （「誰か」と尋ねる発話全体に含意）
  rationale: 日本語では「私たちに預言せよ」を明示すると不自然になりやすく、直後の問いが語り手たちへの回答要求を十分に示す。意味は省かれていない。
- source_word: χριστέ
  choice: メシアよ
  rationale: Χριστόςの呼格で、名のような用法ではなく称号として嘲弄的に呼びかけているため、称号の意味を示す「メシア」とした。
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: おまえを殴ったのは誰か
  rationale: 実体詞的分詞ὁ παίσαςを、日本語で自然な同定疑問文として訳した。παίωはここでは具体的な打撃を表すため「殴った」とした。
theological_decisions:
- issue: Χριστόςを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この語は呼格で、イエスへの称号を用いた嘲りである。意味を訳す方針に従い「メシア」とし、日本語で定着した別表記「キリスト」は脚注に示した。
translation_notes:
  register: 現代標準日本語。場面の侮辱的な口調を「してみろ」「おまえ」で明瞭にしつつ、過度に俗悪な表現は避けた。
