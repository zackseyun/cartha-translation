  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: ja
  text: しかし、わたしが復活させられた後[a]、あなたがたより先にガリラヤへ行く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「復活した後」。ギリシア語は、より直訳的には受動形で「復活させられた後」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: しかし、…後
  rationale: μετάと冠詞付き不定詞による時間的前後関係を「…後」とし、δέは直前のつまずきの予告との緩やかな対照を「しかし」で表した。
- source_word: τὸ ἐγερθῆναί με
  choice: わたしは復活させられた
  rationale: ἐγείρωのアオリスト受動不定詞と対格主語μεを反映した。日本語で単に「起こされる」とすると睡眠から目覚める意味に取られやすいため、復活の文脈を明確にしつつ受動態を保った。
- source_word: προάξω ὑμᾶς
  choice: あなたがたより先に…行く
  rationale: ここでのπροάγωは、弟子たちに先立って行くことを表す。「導く」とまでは限定せず、方向と先行の意味を自然な日本語にした。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ
  rationale: 移動の方向を示すεἰςを、現代日本語で自然な「へ」により表した。「ガリラヤの中へ」はこの文脈では不自然に具体的すぎる。
theological_decisions:
- issue: ἐγερθῆναίの復活表現と受動態
  choice: 「復活させられた後」として受動の形を保持する
  alternative: 「復活した後」
  rationale: ギリシア語は明示的に受動態であり、行為者を明記しない。日本語でも受動態を保つことで、神の働きを明文化して付加することなく、原文の含みを残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「わたし」「あなたがた」は福音書本文に適した一般的な聖書文体とし、語順は日本語として自然に整えた。
