  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: ja
  text: ペトロが門口へ出て行くと、別の女が彼を見て、そこにいた人々に言う。「この人は、ナザレ人イエスと一緒にいました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: 門口
  rationale: 中庭から外へ通じる門の区域・入口を指す語。文脈上、単なる門扉ではなく出入口の場所なので、自然な日本語で「門口」とした。
- source_word: ἄλλη
  choice: 別の女
  rationale: 女性形で、直前の女中とは別の女性を指す。身分を明示する語は本文にないため「別の女」とした。
- source_word: λέγει
  choice: 言う
  rationale: 歴史的現在の形を保ち、場面の切迫感を伝えるため現在形で訳した。
- source_word: τοῦ Ναζωραίου
  choice: ナザレ人
  rationale: 出身地・所属を示す呼称として簡潔かつ伝統的に理解される表現を採用した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、受難物語にふさわしい簡潔で格調ある文体とした。主語の「ペトロ」はギリシア語では代名詞だが、日本語で参照先を明確にするため固有名を補った。λέγει の歴史的現在は「言う」として保持した。
