  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: ja
  text: 「二日後に過越の祭りが来ることを、あなたがたは知っています。そして、人の子は十字架につけられるために引き渡されます[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裏切られます」とも訳せる。ギリシア語の動詞は裏切りを指すこともあるが、より広く「引き渡される」「渡される」という意味を持つ。
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: あなたがたも知っているとおり
  rationale: 二人称複数で現在の意味を持つ。弟子たちが共有している時期の認識を踏まえ、自然な現代日本語にした。
- source_word: μετὰ δύο ἡμέρας
  choice: 二日後には
  rationale: μετά＋対格の時間的用法「二日後」を明確かつ自然に表す。
- source_word: τὸ πάσχα
  choice: 過越の祭り
  rationale: πάσχαを日本語の聖書用語として定着した「過越」で表し、文脈上の祭りを自然に示すため「の祭り」を補った。
- source_word: γίνεται
  choice: 行われます
  rationale: ここでは過越の祭りが到来し、執り行われることを指す。「行われる」は日本語として自然で、単なる存在以上の出来事を表す。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した訳語を用い、その聖書的・神学的含意を保持する。
- source_word: παραδίδοται
  choice: 引き渡されます
  rationale: 現在受動形が表す確実に迫る出来事を日本語の非過去受動で示し、「裏切られる」に限定せず、より広い「引き渡される」という意味を保持する。
- source_word: εἰς τὸ σταυρωθῆναι
  choice: 十字架につけられるために
  rationale: εἰς＋冠詞付き不定詞が示す目的または帰結を直接的に表す。
theological_decisions:
- issue: 受難予告における παραδίδοται の訳し方
  choice: 引き渡されます
  alternative: 裏切られます
  rationale: 文脈にはユダの裏切りが含まれるが、動詞自体はそれより広く、人による裏切りと権力者への引き渡しの双方を含み得る。狭く限定せず、本文の神学的な緊張と受動表現を保った。
translation_notes:
  register: 明瞭で現代的ながら、イエスの受難予告にふさわしい端正な敬体とした。「過越」「人の子」「十字架につけられる」は定着した聖書語を保持し、一般読者にも理解できる表現にした。
