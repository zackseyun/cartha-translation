id: MAT.26.51
reference: Matthew 26:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: ja
  text: すると、見よ、イエスと一緒にいた者の一人が手を伸ばして剣を抜き、大祭司の奴隷[a]に切りつけ、その耳を切り落とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「召使い」とも訳せる。
    reason: δοῦλοςには奴隷身分を表す用法と、従属して仕える者を指す用法があり、日本語では文脈により「召使い」と訳すこともできるため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: すると見よ
  rationale: 場面の急展開と語りの鮮明さを保つ。「見よ」はやや格調があるが、聖書本文として理解でき、原文の談話標識を省略しない。
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: イエスと一緒にいた者の一人
  rationale: 分格構文を自然な現代日本語で表し、人物の名を特定しない原文に従う。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 手を伸ばして
  rationale: 剣を抜く前の動作を表すアオリスト分詞を、自然な連続動作として訳す。
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: 剣を抜き
  rationale: 武器を引き抜く動作を簡潔に表す。αὐτοῦは日本語では所有者が明白なため、過剰な「自分の」を避ける。
- source_word: μάχαιραν
  choice: 剣
  rationale: 短剣や大型の刃物を指し得るが、文脈上「剣」が一般的であり、形状を不必要に限定しない。
- source_word: πατάξας
  choice: 切りつけ
  rationale: 剣による打撃であることを日本語として自然に示し、続く耳の切断との因果的な流れも明瞭にする。
- source_word: δοῦλον
  choice: 奴隷
  rationale: 大祭司に属する従属的な社会身分を弱めずに表す。「僕」や「召使い」より原語の社会的現実を明確に伝える。
- source_word: ἀρχιερέως
  choice: 大祭司
  rationale: 単数形ἀρχιερεύςの標準的な訳語。
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: その耳を切り落とした
  rationale: 直訳的な「耳を取り去った」が剣の一撃による切断を意味するため、自然で具体的な日本語にする。有限動詞を文末の主要動作として保持する。
- source_word: ὠτίον
  choice: 耳
  rationale: 指小形だが、ここで「耳たぶ」などと限定する根拠はなく、通常の「耳」が適切。
theological_decisions:
- issue: 社会的身分を表すδοῦλοςの訳語
  choice: 奴隷
  alternative: 召使い／僕
  rationale: この物語では大祭司に属する人物の身分関係が具体的に示されているため、原語の強い従属関係を和らげない。ただし日本語で読みやすい代替語を脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ἰδοὺには物語的な鮮明さを保つため「見よ」を用いた。動作の連鎖は日本語の接続形で滑らかにし、最後の有限動詞に対応する「切り落とした」を明示した。
