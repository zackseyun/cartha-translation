id: MAT.26.22
reference: Matthew 26:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: ja
  text: 彼らは非常に悲しみ、一人ずつ[a]イエスに言い始めた。「主よ、まさか私ではないでしょうね[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一人一人」。また「次々に」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語のμήτιで始まる問いは、否定の答えを予期している。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: 非常に悲しみ
  rationale: 分詞が表すその時の継続的な感情を自然な日本語で示し、σφόδραの強意も「非常に」で保った。
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: イエスに言い始めた
  rationale: 起動相の「言い始めた」を保った。αὐτῷは文脈上の指示対象を明確にするため「イエスに」とした。
- source_word: εἷς ἕκαστος
  choice: 一人ずつ
  rationale: 各人が個別に応答したことを、簡潔で自然な日本語で表した。
- source_word: Μήτι ἐγώ εἰμι
  choice: まさか私ではないでしょうね
  rationale: 否定の答えを予期するμήτιの含みを「まさか」と文末の「でしょうね」で表し、話者が否定を期待している調子を保った。
- source_word: κύριε
  choice: 主よ
  rationale: イエスへの呼びかけとしてκύριοςの称号的・物語的な重みを保ち、「主よ」と訳した。
theological_decisions:
- issue: イエスへの呼びかけκύριεの訳語
  choice: 主よ
  alternative: 先生／ご主人様
  rationale: κύριοςには敬称的用法もあり得るが、マタイにおいてイエスに向けられる語の重みを過小評価せず、同時に説明を加えすぎない「主よ」とした。
- issue: μήτιを用いた問いの確信度
  choice: まさか私ではないでしょうね
  alternative: 私ですか
  rationale: 単なる中立的な質問にせず、否定の答えを期待する原文の語用論的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いた。悲しみの強さと、弟子たちが各自否定を期待しながら尋ねる緊張を、過度に口語的にならない自然な直接話法で表した。
