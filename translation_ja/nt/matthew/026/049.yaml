reference: Matthew 26:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: ja
  text: 彼はすぐにイエスに近づき、「こんにちは、ラビ[a]」と言って、イエスに口づけをした。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ラビ」は「先生」を意味する称号。
    reason: 現代の一般読者に、音写された称号の意味を示すため。
  - marker: b
    text: この動詞には、強く口づけした、あるいは繰り返し口づけした、という含みがある可能性もある。
    reason: κατεφίλησεν が持ち得る強意または反復のニュアンスを、本文で断定せず保持するため。
lexical_decisions:
- source_word: εὐθέως
  choice: すぐに
  rationale: 行動の即時性を、現代日本語として自然で簡潔に表す。
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: イエスに近寄り
  rationale: イエスのそばへ近づく身体的な動きを保ちつつ、分詞を自然な動作の連続として訳した。
- source_word: Χαῖρε
  choice: ごきげんよう
  rationale: この文脈では喜ぶよう命じる語ではなく慣用的な挨拶である。やや改まった呼びかけとして、裏切りの場面における表面的な礼儀も伝える。
- source_word: ῥαββί
  choice: ラビ
  rationale: ギリシア語本文がセム語由来の称号を音写していることを保つ。意味は脚注で補った。
- source_word: κατεφίλησεν
  choice: 口づけした
  rationale: 接吻を表す動作を、現代日本語の聖書本文にふさわしい品位で訳した。この動詞にあり得る強意または反復の含みは、断定せず脚注に残した。
- source_word: αὐτόν
  choice: イエスに
  rationale: 日本語では代名詞「彼に」より指示対象を明示するほうが自然で、誤読を避けられる。
theological_decisions:
- issue: Χαῖρε を挨拶としてどう訳すか
  choice: ごきげんよう
  alternative: 喜べ／こんにちは
  rationale: ここでは通常の挨拶であり、神学的な歓喜の命令とは解さない。「こんにちは」は時間帯を連想させやすいため避け、物語上の皮肉を訳語で過度に説明しないようにした。
- issue: κατεφίλησεν の強意を本文に明示するか
  choice: 本文では「口づけした」とし、脚注で強意・反復の可能性を示す
  alternative: 熱烈に口づけした／何度も口づけした
  rationale: 接頭辞による強意や反復の可能性はあるが、どちらか一方に確定すると原文の幅を狭めるため、本文は簡潔にし、含みを脚注に保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。語順は日本語として自然に整えつつ、接近、挨拶、口づけという原文の動作の順序を維持した。「ごきげんよう」は日常会話ではやや改まった表現だが、χαῖρε の慣用的かつ礼儀的な挨拶として、この場面では適切と判断した。
