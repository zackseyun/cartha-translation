reference: Matthew 26:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: ja
  text: イエスがまだ話しておられるうちに、見よ、十二人の一人であるユダがやって来た。彼と一緒に、祭司長たちと民の長老たちから[a]、剣とこん棒[b]を持った大勢の群衆もやって来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「祭司長たちと民の長老たちに遣わされて」。ギリシア語は直訳すると「祭司長たちと民の長老たちから」。
    reason: alternative_reading
  - marker: b
    text: または「棒」。このギリシア語は字義的には木材や木片を指すが、ここでは武器として用いる棒を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: イエスがまだ話しておられるうちに
  rationale: 属格独立構文の同時性を「うちに」で表し、ἔτιを「まだ」とした。日本語では主語を明示するほうが場面を自然に追いやすい。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面の急展開に読者の注意を向ける談話標識として保持した。「突然」とすると、原文以上に時間的な唐突さを明示することになる。
- source_word: Ἰούδας
  choice: ユダ
  rationale: 日本語聖書で広く定着している人名表記。
- source_word: εἷς τῶν δώδεκα
  choice: 十二人の一人
  rationale: 部分を示す表現を直接的に訳し、ユダが十二弟子に属していたことを原文どおり示した。
- source_word: ἦλθεν
  choice: やって来た
  rationale: 単純な到来を表す。現場への接近を自然な現代日本語で伝えるため「来た」よりも「やって来た」とした。
- source_word: ὄχλος πολὺς
  choice: 大勢の群衆
  rationale: πολύςの数量的意味を明確にしつつ、ὄχλος自体にはない「暴徒」という評価は加えなかった。
- source_word: μετὰ μαχαιρῶν
  choice: 剣を手にした
  rationale: μάχαιραは剣または短剣状の武器を指し得るが、ここでは広く自然な「剣」とした。μετάが示す携行を日本語らしく「手にした」で表した。
- source_word: καὶ ξύλων
  choice: こん棒
  rationale: ξύλονは字義的には木材・木片だが、この武装した群衆の文脈では打撃用の棒を指す。「こん棒」は用途を明瞭にし、「棒」という語義上可能な訳は脚注に残した。
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: 祭司長たちと民の長老たちのもとから
  rationale: ἀπόが示す出所を保ち、派遣・指示が文脈上推測できても、原文にない「遣わされた」を本文へ補わなかった。
theological_decisions:
- issue: 群衆が宗教指導者たちから正式に派遣されたことを明示するか
  choice: 祭司長たちと民の長老たちのもとから
  alternative: 祭司長たちと民の長老たちに遣わされて
  rationale: 文脈は権限を受けた派遣を示唆するが、原文のἀπόは直接には出所を示し、派遣を表す動詞はない。そこで本文では曖昧さを保ち、可能な理解を脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、ἰδοὺは物語上の強調を保つため格調ある「見よ」とした。「十二人の一人」「祭司長たち」「民の長老たち」は一般読者にも理解できる定着表現を用いた。
