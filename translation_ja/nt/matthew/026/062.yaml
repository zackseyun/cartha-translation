id: MAT.26.62
reference: Matthew 26:62
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: ja
  text: そこで大祭司は立ち上がり、イエスに言った。「何も答えないのか。この者たちは、あなたに不利な何を証言しているのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: 大祭司が発言に先立って実際に立ったことを表すアオリスト分詞。自然な現代日本語で場面の緊張感も保つ。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: この文脈におけるユダヤ教の最高祭司職を表す標準的な訳語。
- source_word: εἶπεν αὐτῷ
  choice: イエスに言った
  rationale: 原文は代名詞だが、日本語では直前の複数の証人との混同を避け、指示対象を明示するほうが自然で明瞭。
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: 何も答えないのか
  rationale: 否定を伴う直接疑問の詰問調を、簡潔で自然な日本語として再現する。
- source_word: τί
  choice: どうなのか
  rationale: 後続する証言の内容またはそれに対する応答を求める省略的な問いを、日本語として理解できる形にする。何を問うかには一定の曖昧さがあるため、断定的に補わない。
- source_word: οὗτοί
  choice: この者たち
  rationale: その場にいる男性複数の証人を指す。現代日本語で人物を明示しつつ、法廷的で厳粛な調子を保つ。
- source_word: σου
  choice: あなたに不利な
  rationale: καταμαρτυρέωと結びつき、単に『あなたについて』ではなく、被告に不利な証言であるという対立的・法的な意味を示す。
- source_word: καταμαρτυροῦσιν
  choice: 証言をしている
  rationale: 現在形と法廷的な『不利な証言をする』という意味を保ち、より解釈的な『訴える』を避ける。
theological_decisions:
- issue: 第二の疑問文の省略性
  choice: 「この者たちがあなたに不利な証言をしているが、どうなのか」
  alternative: 「この者たちは、あなたに不利な何を証言しているのか」
  rationale: 原文 τί οὗτοί σου καταμαρτυροῦσιν は、証言内容を問うとも、それへの釈明を迫るとも取り得る省略的な表現である。本文では詰問の流れを自然に示しつつ、その曖昧さを過度に解消しない訳を採った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、裁判的場面にふさわしい簡潔で dignified な調子と、大祭司の詰問の強さを保った。接続詞 καί は場面の進行を示す「そこで」とした。
