  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: ja
  text: ペテロは、イエスが言ったことばを思い出した。「鶏が鳴く前に、あなたは三度、わたしを否認する。」そして、外へ出て、激しく泣いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: 思い出した
  rationale: 過去に語られたことがその場で意識によみがえったという物語上の動きを、自然な現代日本語で表す。
- source_word: ῥήματος
  choice: ことば
  rationale: ここではイエスが口にした発言を指す。「ことば」は簡潔で、後続する「語られた」と自然につながる。
- source_word: εἰρηκότος
  choice: 語られた
  rationale: 先に語られ、今なお意味を持つ発言を示す完了分詞。日本語では「イエスが語られたことば」として自然に表現した。
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: 鶏が鳴く前に
  rationale: 不定詞を伴う時間表現を自然な日本語の節にした。日本語では冠詞の有無を区別しないため、単に「鶏」とした。
- source_word: τρὶς
  choice: 三度
  rationale: 回数を明瞭かつ簡潔に示し、聖書本文にふさわしい現代的で端正な表現とした。
- source_word: ἀπαρνήσῃ
  choice: わたしを知らないと言う
  rationale: この文脈での否認の具体的内容を自然な日本語で伝える。単なる発言の否定ではなく、イエスとの関係を否定する意味を表す。
- source_word: ἐξελθὼν ἔξω
  choice: 外へ出て
  rationale: ギリシア語の動詞と副詞による重なりを、意味を保ちながら自然な日本語にまとめた。
- source_word: ἔκλαυσεν πικρῶς
  choice: 激しく泣いた
  rationale: πικρῶς が表す深い苦痛と悲嘆を、現代日本語で自然に伝える。「苦々しく泣いた」は不自然で誤解を招きやすいため避けた。
theological_decisions:
- issue: イエスへの呼称
  choice: イエス
  alternative: 主イエス
  rationale: 原文はἸησοῦとのみ記しており、原文にない称号を加えない。
- issue: ペテロの否認の表現
  choice: わたしを知らないと言う
  alternative: わたしを否む
  rationale: ἀπαρνέομαιの重大さを保ちつつ、この場面に即して関係を否定する意味を明確にした。「否む」は簡潔だが、現代の一般読者には意味が捉えにくい。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叙事の簡潔さと悔恨の重みを保った。「語られた」はイエスへの自然な敬意を表す日本語として用いたもので、原文に称号を追加するものではない。
