source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: ja
  text: そのとき、ペトロは、「私はその人を知らない」と、呪いをかけて誓い始めた[a]。すると、すぐに雄鶏が鳴いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「呪いをかけて誓い始めた」とも訳せる。ここでの「呪い」は、否認が偽りなら自分が呪いを受けてもよいという誓いを指す可能性が高いが、呪いの対象は原文に明示されていない。
    reason: καταθεματίζεινは誓いの文脈で自己への呪いを伴う誓言を指す可能性が高い一方、原文は呪いの対象を明示しないため。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の次の出来事を示す時間的・連続的な副詞として、簡潔で自然に訳した。
- source_word: ἤρξατο
  choice: 言い始めた
  rationale: 二つの不定詞にかかる開始の意味を保ちつつ、日本語では引用発言の後に置いて自然な文にした。
- source_word: καταθεματίζειν
  choice: 呪いを口にし
  rationale: 単なる悪態ではなく、呪いを持ち出す意味を表す一方、原文に明示されない呪いの対象を本文で限定しない訳とした。
- source_word: ὀμνύειν
  choice: 誓って
  rationale: 厳粛に誓う行為を簡潔に表し、否認を強める文脈を保った。
- source_word: ὅτι
  choice: 「…」と
  rationale: 誓いと否認の内容を導く語を、日本語で明瞭な直接話法として表した。
- source_word: Οὐκ οἶδα
  choice: 私は…知らない
  rationale: 知識または面識を否定する率直な表現として訳した。
- source_word: τὸν ἄνθρωπον
  choice: そんな人
  rationale: 直訳は「その人」だが、否認の場面における突き放した言い方を自然な日本語で表した。
- source_word: καὶ εὐθέως
  choice: すると、すぐに
  rationale: 直後に起こったことを示し、イエスの予告が即座に実現する物語上の緊迫感を保った。
- source_word: ἀλέκτωρ
  choice: 鶏
  rationale: 雄鶏を指すが、日本語では鳴き声との組み合わせで「鶏」が自然であり、意味も明瞭である。
- source_word: ἐφώνησεν
  choice: 鳴いた
  rationale: 鶏の発声を表す自然な日本語を用いた。
theological_decisions:
- issue: ペトロの否認における καταθεματίζειν の意味
  choice: 本文では「呪いを口にし」とし、呪いを伴う厳しい誓いであることを表す。
  alternative: 自分の上に呪いを招く／一般的に悪態をつく／イエスを呪う。
  rationale: ὀμνύειν と並ぶ誓言の文脈では自己への呪いを含む誓約である可能性が高いが、目的語や再帰代名詞は明示されていない。そのため本文では対象を限定せず、脚注で有力な含意を示した。
translation_notes:
  register: 明瞭で現代的かつ端正な物語文。ペトロの否認の激しさを伝えながら、原文が明示しない呪いの対象を本文で断定しない。脚注記号 [a] は該当する誓言表現の直後に置いた。
