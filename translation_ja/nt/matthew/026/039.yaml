id: MAT.26.39
reference: Matthew 26:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: ja
  text: そして、少し先へ進み、顔を地に伏せて倒れ[a]、祈って言われた。「わたしの父よ、もしできることなら、この杯[b]をわたしから過ぎ去らせてください。しかし、わたしの望むようにではなく、あなたの望まれるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「顔を伏せて倒れた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「杯」は、割り当てられた分、とりわけ苦しみを表す聖書的な比喩。マタイ20:22、26:42参照。
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: 少し先へ進み
  rationale: アオリスト分詞と μικρόν は、そこからわずかな距離だけ先へ移動したことを表す。日本語の自然な物語の流れを保ちつつ、前進の意味を明示した。
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: 顔を地につけてひれ伏し
  rationale: 直訳的な「自分の顔の上に倒れた」ではなく、顔を地に向けて伏す姿勢を自然な現代日本語で表した。「ひれ伏す」により祈りの場面での身体的姿勢も伝わる。
- source_word: προσευχόμενος καὶ λέγων
  choice: 祈って言われた
  rationale: 二つの現在分詞が主動詞と同時進行の行為を示すことを、簡潔で自然な日本語にした。イエスへの敬意を表す通常の聖書文体として尊敬表現を用いた。
- source_word: Πάτερ μου
  choice: わたしの父よ
  rationale: 呼格と所有代名詞をそのまま反映し、親密さと厳粛さの両方を保った。「お父さま」などの感情的含意は加えていない。
- source_word: εἰ δυνατόν ἐστιν
  choice: もしできることなら
  rationale: 可能性を条件として述べる節を、意味を補いすぎず自然な日本語で表した。
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: わたしから過ぎ去らせてください
  rationale: 三人称アオリスト命令形による願いを丁寧な祈願として訳し、ἀπ’ ἐμοῦ の「わたしから」を明示した。
- source_word: τὸ ποτήριον τοῦτο
  choice: この杯
  rationale: ποτήριον の比喩を説明語に置き換えず、聖書内の関連箇所と結びつく「杯」の像を保持した。
- source_word: πλὴν
  choice: しかし
  rationale: 先の願いを強く限定する対比を、明瞭な現代日本語で示した。
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: わたしの望むようにではなく、あなたの望まれるように
  rationale: θέλω を「望む」とし、イエスの真実な意志と父への従順との対比を保った。後半で省略されている θέλω は日本語でも「望まれる」によって明らかにし、原文どおり結びの動詞を過度に補わなかった。
theological_decisions:
- issue: 「杯」の比喩
  choice: 本文で「この杯」を保持する
  alternative: この苦しみ／この定め
  rationale: 「杯」は割り当てられた分、とりわけ苦難を表し得る聖書的比喩である。具体的に「苦しみ」や「神の怒り」と限定すると、本文が保持する象徴性と相互参照の広がりを狭めるため、そのまま訳した。
- issue: イエスの望みと父の望みの関係
  choice: 双方を「望む」で対照させる
  alternative: わたしの願いではなく、あなたのみこころのままに
  rationale: 意訳的な定型句にせず、原文の同じ動詞 θέλω の明示と省略による対照を見える形で保った。これにより、イエス自身の望みの真実性と父への服従の緊張を解消せずに伝える。
translation_notes:
  register: 明瞭な現代標準語を基調とし、祈りの厳粛さにふさわしい品位を保った。「わたし」「父よ」「杯」は聖書的な響きを残す一方、古語的な語尾や不自然な直訳調は避けた。原文末尾の省略表現を尊重し、意味を教理的に補完しすぎない訳文とした。
