  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: ja
  text: しかし、ペテロはイエスに答えた。「たとえ皆があなたのことでつまずいても[a]、私は決してつまずきません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「反感を抱く」。ギリシア語の動詞は、つまずかされること、反感を抱くこと、あるいは忠誠を失って離れることを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: しかし、ペトロはイエスに答えた
  rationale: 分詞と定動詞を重ねるギリシア語の慣用的な発話導入を、自然な日本語の「答えた」にまとめた。δέの文脈上の対照は「しかし」で示し、αὐτῷの指示対象は明瞭さのため「イエス」とした。
- source_word: Εἰ πάντες
  choice: たとえ皆が
  rationale: εἰは形式上「もし」だが、ここではペトロが他の全員と自分を対比する譲歩的な発言なので、「たとえ」が自然である。
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: つまずいて離れる
  rationale: σκανδαλίζωが持つ「つまずく」と、弟子としての忠誠から離れるという文脈上の強い含意を一つの日本語表現で伝える。二つの用例は同じ訳語にそろえた。
- source_word: ἐν σοί
  choice: あなたに
  rationale: σκανδαλίζωと結び付くἐν σοίを「あなたとの関わりで／あなたのゆえに」という意味に取り、日本語では動詞句「あなたにつまずいて離れる」に組み込んだ。
- source_word: ἐγὼ οὐδέποτε
  choice: 私は決して
  rationale: 明示されたἐγώによる「皆」との対比を「私は」で保ち、οὐδέποτεの強い時間的否定を「決して…ません」で表した。
theological_decisions:
- issue: 弟子としての失敗を表すσκανδαλίζωの訳し方
  choice: つまずいて離れる
  alternative: つまずく／離反する／あなたのために信仰を捨てる
  rationale: 単なる一時的失敗にも最終的背教にも意味を限定せず、妨げによって忠誠が揺らぎ、離れるという文脈的な重みを保つ。「信仰を捨てる」は解釈を固定しすぎるため避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、ペトロの強い自己確信と、同じ動詞を反復する原文の対照を保持した。
