  source_fidelity: ギリシア語の対比構文を正確に保っている。「貧しい人々」はτοὺς πτωχούςの集合的用法を自然に表し、「あなたがたと一緒にいる」はἔχετε μεθ’ ἑαυτῶνが示す継続的な身近な存在を適切に伝える。後半の「いつも一緒にいるわけではない」はοὐ πάντοτεの「常にではない」という時間的対照を保っている。γάρは日本語では明示しない場合でも前後の文脈における説明関係として無理なく機能する。
