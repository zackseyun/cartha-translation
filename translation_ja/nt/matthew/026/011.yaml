id: MAT.26.11
reference: Matthew 26:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ja
  text: 貧しい人々はいつもあなたがたと一緒にいるが、わたしはいつも一緒にいるわけではない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的・恒常的な存在を表す副詞であり、現代日本語として自然な「いつも」とした。後半でも同じ語を用い、原文の反復と対比を保った。
- source_word: γὰρ
  choice: （明示しない）
  rationale: 直前の発言の理由を示すが、日本語では文脈上その説明関係が明らかであり、「なぜなら」を加えるより無接続のほうが自然で簡潔である。
- source_word: τοὺς πτωχοὺς
  choice: 貧しい人々
  rationale: 貧困状態にある人々を集合的に指す。現代日本語では「貧しい人々」が明瞭で、人を抽象的な階層名に還元しない自然な表現である。
- source_word: ἔχετε
  choice: 一緒にいる
  rationale: ここでは所有ではなく、身近に存在していることを表す。「持っている」という不自然で誤解を招く直訳を避け、μεθ’ ἑαυτῶν と一体に訳した。
- source_word: μεθ’ ἑαυτῶν
  choice: あなたがたと一緒に
  rationale: 弟子たちのもとにいること、また彼らと共にいることを表す。「あなたがたの間に」も可能だが、後半のイエスとの対照が明瞭になる表現を選んだ。
- source_word: ἐμὲ
  choice: わたし
  rationale: 話者であるイエス自身を指す強調形の対格代名詞。日本語では対比を語順と助詞「は」で示した。
- source_word: δὲ
  choice: が
  rationale: 貧しい人々が常にいることと、イエスが常にいるわけではないことの対照を、自然な逆接の接続助詞で示した。
- source_word: οὐ πάντοτε
  choice: いつも一緒にいるわけではない
  rationale: 「決していない」ではなく、「常にいるのではない」という部分否定を明確に保つ訳である。
theological_decisions:
- issue: イエスの臨在についての含意
  choice: 貧しい人々が継続して身近にいることと、イエスが弟子たちと共にいる期間が限られていることとの時間的対比として訳した。
  alternative: 貧しい人々への配慮を軽視する発言として読む。
  rationale: 原文が直接示すのは時間的な対照であり、貧しい人々の価値や施しの必要性を否定してはいない。一方で「身体的な臨在」など原文にない限定説明は本文へ加えず、含意と緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言にふさわしい簡潔で落ち着いた文体とした。「一緒にいる」を両節に反映し、原文の並行と対照を自然に伝えた。
