  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: ja
  text: その時、イエスは彼に言った。「あなたの剣を元の場所に戻しなさい。剣を取る者[a]は皆、剣によって滅びるからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「剣を取る」は、単に武器を手に取ることではなく、暴力に訴えることを意味する可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の次の出来事を導く時間表現として、明瞭で自然な現代日本語にした。
- source_word: λέγει αὐτῷ
  choice: 彼に言われた
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形で表した。イエスへの敬意を示す一般的な敬語表現を用いた。
- source_word: Ἀπόστρεψον
  choice: 戻しなさい
  rationale: 武器を直ちに元の位置へ返すよう命じるアオリスト命令形の力を、明瞭な命令として表した。
- source_word: τὴν μάχαιράν σου
  choice: 剣を
  rationale: μάχαιραは短剣や大型の刃物も指し得るが、この場面と後続の格言的表現では「剣」が最も明瞭で慣用的である。所有者は文脈上明らかなので、不自然になりやすい「あなたの」は明示しなかった。
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: 元の場所に
  rationale: 剣を本来置かれていた場所へ返す意味を保った。「さやに」と限定すると原文以上に具体化するため避けた。
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: 剣を取る者は皆
  rationale: 冠詞付き分詞の一般化・格言的な働きを保った。「剣を取る」は、単に武器を握る以上に、武力に訴えることを含み得るため、その含みを脚注で示した。
- source_word: ἐν μαχαίρῃ
  choice: 剣によって
  rationale: 手段を表す与格を自然な日本語で表し、前半との格言的な並行を保った。
- source_word: ἀπολοῦνται
  choice: 滅びる
  rationale: 死や破滅に至ることを表す語の重みを保ちつつ、その様態を原文以上に限定しない訳語を選んだ。
theological_decisions:
- issue: 剣についてのイエスの言葉が及ぶ範囲
  choice: 「剣を取る者は皆」という一般的原則として訳す。
  alternative: あらゆる実力行使を例外なく禁じる絶対命令とする、またはこの逮捕場面だけに限られた予告とする。
  rationale: ギリシア語は一般化を示す格言的構文である。その広がりを保つ一方、暴力に関する特定教派の立場を訳文に持ち込まないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの命令は自然な「なさい」形とし、格言部分は簡潔な並行表現にした。
