    text: 別訳「友よ、何のために来たのか」。ギリシア語の表現は簡潔で、疑問文とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: 友よ
  rationale: ユダに対する呼びかけ。親密さを強調しすぎず、抑制された語調を保つ自然な現代日本語とした。
- source_word: ἐφ’ ὃ πάρει
  choice: しようとして来たことをしなさい
  rationale: 原文は非常に簡潔で、目的を遂行するよう促す表現とも疑問文とも解し得る。本文では文脈に即した命令的な理解を採り、曖昧さは脚注に残した。
- source_word: προσελθόντες
  choice: 進み寄り
  rationale: 捕縛する者たちがイエスに近づく動作と、その後の行為との連続を簡潔に表した。
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: イエスに手をかけて
  rationale: 敵対的に手をかけ、身柄を押さえる慣用的な動作を、自然で明瞭な日本語にした。
- source_word: ἐκράτησαν αὐτόν
  choice: 捕らえた
  rationale: 力をもって確保する意味を表しつつ、原文以上に法的な『逮捕』という概念を持ち込まない表現とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前のユダの行動からイエスの応答への穏やかな対照を示す。
theological_decisions:
- issue: ユダに対するイエスの呼びかけと応答の解釈
  choice: 「友よ、しようとして来たことをしなさい」
  alternative: 「友よ、何のために来たのか」
  rationale: イエスの抑制された呼びかけと、圧縮されたギリシア語が持つ緊張を保った。本文では命令的理解を採るが、疑問文としての理解も真正な可能性として脚注に示し、穏やかさにも断罪にも一方的に寄せない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「友よ」は古風になりすぎない範囲で呼格を示し、「手をかけて捕らえた」によって捕縛の身体的な動作を自然に表現した。
