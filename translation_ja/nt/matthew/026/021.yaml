base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: ja
  text: 皆が食事をしているとき、イエスは言われた。「あなたがたにはっきり言っておく。あなたがたのうちの一人が、私を裏切る[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私を引き渡す」。または「私を渡す」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: 一同が食事をしているとき
  rationale: 属格独立構文が示す同時進行を、自然な現代日本語で表した。「一同」は食卓を囲む者たちをまとめて指す。
- source_word: Ἀμὴν
  choice: まことに
  rationale: イエスが権威ある重大な言明を導入する厳粛な肯定として訳した。「アーメン」と音写するより、ここでの機能が一般読者に明確に伝わる。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言う
  rationale: 二人称複数への直接の語りかけを保ちつつ、簡潔で格調のある日本語とした。
- source_word: εἷς ἐξ ὑμῶν
  choice: あなたがたのうちの一人
  rationale: 部分を示す表現を明確かつ自然に訳した。
- source_word: παραδώσει
  choice: 裏切る
  rationale: 語そのものには「引き渡す」という広い意味があるが、この受難物語の文脈では、弟子の一人による背信的な引き渡しを表すため、「裏切る」が文脈上の意味を自然に伝える。未来の出来事であることは、この発言の文脈と日本語の非過去形によって示される。
- source_word: με
  choice: 私を
  rationale: イエスを指す直接目的語をそのまま明示した。
theological_decisions:
- issue: 受難物語における παραδώσει の訳し方
  choice: 裏切る
  alternative: 私を引き渡す
  rationale: 「裏切る」は弟子による背信を明確に表す一方、原語の基本的な動作である「引き渡す」より意味が限定される。そのため本文では文脈上自然な「裏切る」を採用し、より字義的な語義を脚注に残して、原語の幅を保持した。
translation_notes:
  register: 明瞭で自然な現代標準語を用いながら、イエスの厳粛な宣言にふさわしい品位を保った。原文の主語は代名詞だが、日本語で指示対象を明確にするため「イエス」とした。
