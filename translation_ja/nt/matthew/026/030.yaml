  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: ja
  text: そして、一同は賛美の歌を歌ってから[a]、オリーブ山へ出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「賛美を歌ってから」。ギリシア語の動詞は一般に、歌によって神を賛美することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: 賛美の歌を歌ってから
  rationale: ὑμνέωのアオリスト能動分詞で、賛美を歌う行為が主動詞に先立つことを表す。「賛美の歌」は、食事の直後という文脈に自然に合い、特定の一曲に限定せず、賛歌を歌ったという意味を明瞭に伝える。
- source_word: ἐξῆλθον
  choice: 出て行った
  rationale: ἐξέρχομαιの基本義「外へ出る」を保ち、直前の食事の場からオリーブ山へ向かったという移動を自然な現代日本語で表す。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: オリーブ山へ
  rationale: 定着した地名「オリーブ山」を用い、方向を示すεἰςを助詞「へ」で自然に表す。
- source_word: καὶ
  choice: そして
  rationale: 先行する出来事との単純な物語上の接続を保ち、不必要に強い時間的・論理的関係を加えない。
