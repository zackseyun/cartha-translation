  source_fidelity: 原文の動作の流れ（弟子たちのもとへ来る／眠っている彼らを見つける／ペトロに言う）を正確に保っている。ペトロへの呼びかけに続く二人称複数「あなたがたは」により、ギリシア語の数の移行も解消せずに示されている。「一時間も目を覚ましていられなかったのですか」は、μίαν ὥραν、γρηγορῆσαι、οὐκ ἰσχύσατεの能力を問う非難的な問いを自然に表す。οὕτωςの驚き・叱責の語気も、「一時間も」と問いの形で十分に反映されている。
  naturalness: 明瞭な現代標準日本語であり、叙述と発話のつながりも自然である。「目を覚ましていられなかった」は、眠っていたこととの対照を明快にする。
  terminology: 「イエス」「弟子たち」「ペトロ」は一貫した固有名表記であり、「わたし」も発話者にふさわしい標準的な表記である。脚注の「見張って」はγρηγορέωの可能な警戒・見張りの含みを簡潔に示しており、本文の具体的文脈上の意味を損なわない。
