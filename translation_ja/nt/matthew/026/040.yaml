id: MAT.26.40
reference: Matthew 26:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: ja
  text: イエスは弟子たちのところに来て、彼らが眠っているのを見つけ、ペトロに言った。「あなたがたは、わたしと一緒に一時間も目を覚まして[a]いられなかったのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見張って」とも訳せる。
    reason: γρηγορέω は「目を覚ましている」と「警戒して見張る」の両方の意味合いを持つため。
lexical_decisions:
- source_word: ἔρχεται
  choice: 来て
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、日本語では一連の動作を自然につなぐ連用形とし、文末の過去形に時間を担わせた。
- source_word: πρὸς τοὺς μαθητὰς
  choice: 弟子たちのところに
  rationale: 移動先を表す πρός を、現代日本語で自然な表現にした。
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: 彼らが眠っているのを見つけ
  rationale: 分詞 καθεύδοντας の継続的・動作的な意味を「眠っている」で明確にした。
- source_word: λέγει τῷ Πέτρῳ
  choice: ペトロに言った
  rationale: 単数の直接の話し相手がペトロであることを明示した。λέγει は歴史的現在だが、自然な日本語の物語時制として「言った」とした。
- source_word: Οὕτως
  choice: （問い全体の驚き・叱責の調子として表現）
  rationale: ここでは独立した様態表現というより、驚きや軽い叱責を帯びて問いを導く。日本語では不自然な「このように」を置かず、「一時間も」と疑問文の調子によってその機能を表した。
- source_word: οὐκ ἰσχύσατε
  choice: いられなかったのですか
  rationale: ἰσχύω の能力・力の意味を、この文脈で自然な可能表現にした。二人称複数は「あなたがた」で明示した。
- source_word: μίαν ὥραν
  choice: 一時間も
  rationale: 時間の継続を表す対格を「一時間」で訳し、否定疑問における「も」によって『一時間さえ』という叱責の含みを自然に示した。
- source_word: γρηγορῆσαι
  choice: 目を覚ましている
  rationale: 眠っていたこととの直接の対比を優先した。警戒して見張る含みもあるため、別訳を脚注に残した。
- source_word: μετ’ ἐμοῦ
  choice: わたしと一緒に
  rationale: 単純な同伴を明瞭で自然な日本語にした。
theological_decisions:
- issue: 話しかけられた相手はペトロ一人だが、ἰσχύσατε は二人称複数である
  choice: 「ペトロに言った」に続けて「あなたがたは」と訳し、単数の話し相手と複数への問いをともに明示した。
  alternative: 問いを「あなたは」と単数にして、ペトロだけへの言葉として滑らかにする。
  rationale: 原文の数の移行は、ペトロを直接の話し相手としながら他の弟子たちをも含めている可能性がある。解釈で均さず、原文の緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの問いの厳粛さと軽い叱責を保った。神名・敬称を補わず、主語の「イエス」は日本語で指示対象を明確にするために明示した。
