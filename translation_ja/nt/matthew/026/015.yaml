  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: ja
  text: 「私に何をくださるつもりですか。そうすれば、彼をあなたがたに引き渡しましょう[a]」と言った。すると彼らは、彼に銀三十枚を量り出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼をあなたがたに裏切って渡しましょう」。ギリシア語の動詞には「引き渡す」「渡す」の意味があり、この文脈では「裏切る」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: 私に何をくださいますか
  rationale: 直訳的には「私に何を与えたいのか／与えるつもりか」。取引を持ちかける文脈では、日本語の「何をくださいますか」が相手の提示額を尋ねる自然な表現であり、θέλωの意志・意向も含意する。
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: そうすれば、彼をあなたがたに引き渡しましょう
  rationale: παραδίδωμιの基本的な「引き渡す」を採り、行為が裏切りであるという文脈上の評価を本文の動詞に過度に織り込まない。「そうすれば」は、この取引条件を日本語で明瞭に示す。
- source_word: οἱ δὲ
  choice: すると彼らは
  rationale: δέは弱い接続語であり、ここではユダの申し出に対する祭司長たちの応答を示すため、「すると」が自然な物語の流れを作る。
- source_word: ἔστησαν αὐτῷ
  choice: 量って彼に渡した
  rationale: 銀を支払いとして定め、量って渡すという商取引上の意味を具体的に表す。単なる「支払った」より原文の具体性を保ちつつ、現代日本語として意味が通る形にした。
- source_word: τριάκοντα ἀργύρια
  choice: 銀貨三十枚
  rationale: ἀργύριαは銀製の貨幣を指すが、原文は貨幣の種類や額面を特定しない。「銀貨三十枚」は日本語で簡潔かつ自然で、原文以上の貨幣単位を補わない。
theological_decisions:
- issue: ユダの申し出における παραδώσω の訳
  choice: 引き渡しましょう
  alternative: 裏切って渡しましょう／引き渡します
  rationale: この動詞は文脈上ユダの裏切りを指すが、語そのものはより広く「引き渡す、渡す」を意味する。本文では語義の幅を保ち、行為の道徳的評価を訳語だけで確定しすぎない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、取引の緊張感と原文の簡潔さを保った。「くださいますか」「引き渡しましょう」により、丁寧だが打算的な申し出として読める調子にした。
