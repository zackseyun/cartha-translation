  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: ja
  text: そして再び来て、彼は弟子たちが眠っているのを見つけた。彼らの目が重くなっていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: 戻って来ると
  rationale: 文脈上、イエスが祈りの場所から弟子たちの所へ戻ったことを表す。アオリスト分詞の主動詞に先立つ動作を、自然な日本語の接続表現で示した。
- source_word: πάλιν
  choice: 再び
  rationale: 同じ行為が繰り返されたことを簡潔かつ格調を保って表す。
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: 弟子たちが眠っているのを見つけた
  rationale: καθεύδοντας の継続中の状態を「眠っている」で保ち、αὐτούς の指示対象は文脈に即して「弟子たち」と明示した。
- source_word: ἦσαν γὰρ
  choice: ……いたからである
  rationale: γάρ の説明・理由を示す働きを、現代日本語で明確な因果関係として表した。
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: 彼らのまぶた
  rationale: 直訳は「彼らの目」だが、眠気で重くなる身体部位を日本語では自然に「まぶた」と表す。意味を具体化するため、脚注で直訳も示した。
- source_word: βεβαρημένοι
  choice: 重くなっていた
  rationale: βαρέω の完了受動分詞が示す、重くされた結果の継続状態を自然な日本語で表した。
