id: MAT.26.31
reference: Matthew 26:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: ja
  text: 'その時、イエスは弟子たちに言われた。「今夜、あなたがたは皆、わたしのことでつまずく[a]。こう書かれているからだ。

    『わたしは羊飼いを打つ。

    すると、群れの羊は散らされる。』[b]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つまずく」は、「つまずかされる」「離反する」とも訳せる。この文脈では、弟子たちがイエスを見捨てて散っていくことを指す。
    reason: lexical_alternative
  - marker: b
    text: ゼカリヤ書13章7節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の場面を導く標準的な時間表現として、自然な現代日本語にした。
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは弟子たちに言われた
  rationale: λέγει は物語上の歴史的現在だが、日本語では過去形が自然である。αὐτοῖς の指示対象は文脈上弟子たちなので明示した。イエスの発話には敬意を表す自然な尊敬語を用いた。
- source_word: Πάντες ὑμεῖς
  choice: あなたがたは皆
  rationale: 二人称複数と πάντες の強調をともに保った。
- source_word: σκανδαλισθήσεσθε
  choice: つまずく
  rationale: この語が持つ「つまずく」「離反する」「見捨てるに至る」という幅を保つ表現。文脈上は弟子たちの離散を指すが、本文で最終的な背教と断定しない。
- source_word: ἐν ἐμοὶ
  choice: わたしのことで
  rationale: イエスとの関係、またイエスに起こることがつまずきの契機となる意味を自然に表しつつ、単純な原因関係だけに限定しない。
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: 今夜
  rationale: 直訳的な「この夜」より自然で、指示される時間を正確に伝える。
- source_word: γέγραπται γάρ
  choice: こう書かれているからだ
  rationale: 聖書引用を導く完了受動の定型句を、継続して有効な記述として自然に表した。
- source_word: Πατάξω τὸν ποιμένα
  choice: わたしは羊飼いを打つ
  rationale: 一人称主語と羊飼いの比喩を保ち、「殺す」など結果を本文以上に特定しない。
- source_word: διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης
  choice: 群れの羊は散らされる
  rationale: 未来受動の意味と、πρόβατα と ποίμνης の双方を反映した。「散らされる」は羊の比喩と受動形を自然に保つ。
theological_decisions:
- issue: σκανδαλισθήσεσθε が示す弟子たちの反応
  choice: 本文では「つまずく」とし、注でこの文脈ではイエスを見捨てて離散することを説明する
  alternative: 「離反する」「わたしを見捨てる」「信仰を捨てる」
  rationale: 羊飼いが打たれて羊が散るという引用により、実際の離散が示唆される。一方、この語自体の意味の幅と、最終的背教か一時的失敗かという緊張を残すため、本文で過度に限定しない。
- issue: ἐν ἐμοὶ の関係的・原因的意味
  choice: わたしのことで
  alternative: わたしにつまずく／わたしのゆえに
  rationale: イエス自身との関係と、イエスに起こる出来事が契機になることの両面を残し、責任や原因について不要な解釈を加えない。
- issue: ゼカリヤ書引用における一人称「わたし」
  choice: 原文どおり「わたしは羊飼いを打つ」とする
  alternative: 神が羊飼いを打つ／羊飼いは打たれる
  rationale: 引用文の一人称と神的主体を暗示する緊張を保持し、本文中で話者を説明的に置き換えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書引用には簡潔で格調ある調子を保った。会話として自然な「今夜」を採用し、語義上・神学上の幅がある σκανδαλισθήσεσθε は「つまずく」として注で文脈を補った。
