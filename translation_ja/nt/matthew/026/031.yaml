  terminology: 「つまずく」「羊飼い」「群れの羊」「散らされる」は、比喩と神学的・語彙的な開放性を保つ適切な用語である。「離反する」を本文に固定せず注で可能性として扱うため、弟子たちの反応を最終的背教と読ませることもない。固有名詞およびゼカリヤ書13章7節の参照も適切である。
