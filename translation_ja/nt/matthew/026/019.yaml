id: MAT.26.19
reference: Matthew 26:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: ja
  text: 弟子たちは、イエスが命じられたとおりにし、過越の食事を用意した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「過越を用意した」。「過越」（πάσχα）は、過越の祭りやその祝い全体を広く指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: 〜とおりにした
  rationale: ὡς συνέταξεν と一体で、指示されたとおりに行動したことを自然な日本語で表す。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 福音書における標準的で明瞭な訳語。イエスに学び従う者たちという関係を自然に示す。
- source_word: ὡς
  choice: 〜とおりに
  rationale: 行動がイエスの指示に一致していたという様態・準拠を簡潔に表す。
- source_word: συνέταξεν
  choice: 命じられた
  rationale: συντάσσω の持つ権威ある指示の意味を保つ。日本語の敬語として主語イエスへの尊敬を表し、過去の指示であることは文脈と構文から明らかである。
- source_word: ἡτοίμασαν
  choice: 用意した
  rationale: 食事や祭儀の準備について自然で、現代の一般読者にも明瞭な表現。
- source_word: τὸ πάσχα
  choice: 過越の食事
  rationale: 直前の指示と後続する食卓場面では、弟子たちが実際に用意したものを自然な日本語で示すには「過越の食事」が最も明瞭。ただし πάσχα は祭り・祝いをより広く指し得るため、脚注で語義の幅を保持する。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した標準的な人名表記。
theological_decisions:
- issue: τὸ πάσχα の範囲
  choice: 過越の食事
  alternative: 過越の祭り／過越の小羊
  rationale: πάσχα は過越の祭り全体、祭りの食事、また文脈によっては犠牲の小羊を指し得る。この箇所では食事を整える場面が中心なので本文は自然な「過越の食事」とし、原語がより広い意味を持ち得ることを脚注で明示して、過度な限定を避ける。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「命じられた」はイエスの権威を保ちながら、過度に威圧的な響きを避ける。脚注記号は、その説明対象である「過越の食事を用意した」の直後に置いた。
