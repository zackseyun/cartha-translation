  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: ja
  text: そして、杯[a]を取り、感謝をささげて、それを彼らに渡して言った。「皆、この杯から飲みなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「杯」に冠詞がないため、「一つの杯」とも訳せる。しかし、食事の文脈では特定の杯を指すとも考えられる。日本語の本文では冠詞性を明示していない。
    reason: lexical_alternative
  - marker: b
    text: 「皆」は、飲む量のすべてではなく、命令を受けた人々全員、すなわち「あなたがた全員」を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: λαβὼν
  choice: 取り
  rationale: アオリスト分詞で、主動詞「渡した」に先立つ動作を表す。日本語では連用形にして自然な流れを保った。
- source_word: ποτήριον
  choice: 杯
  rationale: ギリシア語では無冠詞だが、日本語には冠詞の区別がない。「一つの杯」とすると不必要に数量を強調するため、文脈に自然な「杯」とした。
- source_word: εὐχαριστήσας
  choice: 感謝をささげてから
  rationale: 主動詞に先立つ感謝の行為を明確に示す。後代の典礼用語や「祝福した」という意味を持ち込まない。
- source_word: ἔδωκεν αὐτοῖς
  choice: 弟子たちに渡して
  rationale: 直訳的には「彼らに渡した」。指示対象を日本語で明瞭にするため、文脈上の「弟子たち」を用いた。
- source_word: λέγων
  choice: 言われた
  rationale: 直接話法を導く現在分詞。日本語では主動詞と結びつけ、「渡して言われた」とするのが自然である。イエスへの敬意を示す通常の聖書文体として尊敬形を用いた。
- source_word: Πίετε
  choice: 飲みなさい
  rationale: 複数の相手に向けたアオリスト命令形。完飲を意味する「飲み干しなさい」までは含意しない。
- source_word: ἐξ αὐτοῦ
  choice: これから
  rationale: ἐκ＋属格が飲む源を示すため、「これから」とした。直前の杯を自然に指す。
- source_word: πάντες
  choice: あなたがたは皆
  rationale: 命令を受ける者全員を指すことを明示する。飲む量の全部を意味する表現ではない。
theological_decisions:
- issue: εὐχαριστήσαςに聖餐・典礼上の意味をどこまで反映するか
  choice: 「感謝をささげてから」
  alternative: 「祝福してから」「感謝の祈りを唱えてから」
  rationale: 語の基本義は「感謝する」である。物を祝福したと限定したり、特定の典礼形式を読み込んだりせず、最後の晩餐という文脈が持つ神学的意義は本文そのものに委ねた。
- issue: πάντεςの係り先
  choice: 命令を受ける弟子たち全員を指す「あなたがたは皆」
  alternative: 杯の中身を全部飲むという意味に取る表現
  rationale: ギリシア語では複数命令形の主語を説明する用法が最も自然であり、特定の聖餐実践について本文以上の主張は加えない。
- issue: 無冠詞のποτήριονの定・不定
  choice: 冠詞性を明示しない日本語の「杯」
  alternative: 「一つの杯」「その杯」
  rationale: 原文は無冠詞だが、食事の文脈では特定の杯とも理解できる。日本語の「杯」はこの曖昧さを不自然なく保持できる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、最後の晩餐の場面にふさわしい簡潔で格調ある語調とした。「取る―感謝をささげる―渡す―言う」という動作の順序を自然な日本語で保っている。
