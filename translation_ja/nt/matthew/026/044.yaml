  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: ja
  text: そして、弟子たちを残し、再びそこを離れて、三度目に、同じことばを再び言って祈られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: 弟子たちを残して
  rationale: 代名詞の指示対象を文脈に即して明示し、ἀφίημιの「その場に残して離れる」という意味を自然な日本語で表した。
- source_word: πάλιν ἀπελθὼν
  choice: 再び離れ
  rationale: 最初のπάλινを明示し、弟子たちのもとから再度離れたという動作を簡潔に表した。
- source_word: προσηύξατο ἐκ τρίτου
  choice: 三度目の祈りをし
  rationale: ἐκ τρίτουを「三度目」とし、祈りが第三の機会に行われたことを自然に示した。
- source_word: τὸν αὐτὸν λόγον
  choice: 同じことば
  rationale: λόγοςの単数形と、同じ祈りの内容を語ったという意味の双方を保てる表現とした。
- source_word: εἰπὼν πάλιν
  choice: また…語られた
  rationale: 末尾のπάλινも省略せず、同じ内容を再び口にしたという反復を保持した。敬意を込めた自然な叙述として尊敬表現を用いた。
theological_decisions:
- issue: 祈りの反復
  choice: 三度目に祈り、同じことばを再び語ったという二重の反復を保持する。
  alternative: 日本語の重複を避けるため、二つのπάλινの一方を省く。
  rationale: 原文はπάλινを二度用いており、祈りの機会と内容の反復をそれぞれ示しているため、解釈的に整理せず両方を訳出した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難物語にふさわしい落ち着いた格調を保った。「再び」と「また」の反復は原文に基づき意図的に残した。
