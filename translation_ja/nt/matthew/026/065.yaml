reference: Matthew 26:65
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: ja
  text: その時、大祭司は自分の衣を引き裂いて[a]言った。「この者は冒瀆した。これ以上、証人が必要だろうか。見よ、今あなたがたはその冒瀆を聞いた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 衣を引き裂くことは、強い衝撃、悲嘆、または憤りを公に示す行為だった。
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の次の出来事を導く時間的接続を、自然で明瞭な日本語で表す。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 当時のユダヤ社会における単数の職位を表す定訳。
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: 自分の衣を引き裂いて
  rationale: 衣服を裂く具体的な動作を保ちつつ、ἱμάτιαを特定の祭服に限定しない。
- source_word: Ἐβλασφήμησεν
  choice: この者は神を冒瀆した
  rationale: 主語を日本語で明確にし、βλασφημέωの宗教的・法的な告発の力を保つ。「神を」は日本語で「冒瀆した」の対象を自然に示すための補足であり、発言者の告発として表す。
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: これ以上、証人が必要だろうか
  rationale: 直訳的な「何の必要があるか」の反語的な力とἔτιの意味を、現代日本語で自然に表す。
- source_word: ἴδε νῦν ἠκούσατε
  choice: 見よ、今あなたがたは…聞いた
  rationale: 注意を促すἴδεと即時性を示すνῦνを明示し、法廷的な場面の緊張を保つ。
- source_word: τὴν βλασφημίαν
  choice: その冒瀆の言葉
  rationale: 抽象名詞を自然な日本語にしつつ、大祭司が直前の発言を冒瀆と断定していることを保持する。
theological_decisions:
- issue: βλασφημέω／βλασφημίαという告発の扱い
  choice: 「神を冒瀆した」「その冒瀆の言葉」として、大祭司の告発を直接話法で保持する。
  alternative: 「神を汚す言葉を語った」「不敬な発言」
  rationale: 宗教的・法的な告発の重大さを保ちながら、それが語り手自身の断定ではなく大祭司の判断であることを文脈に委ねる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きの場面にふさわしい品位と緊張感を保った。「見よ」は日常語より荘重だが、ἴδεの注意喚起を簡潔に伝えるため採用した。英語資料の脚注マーカーと脚注内容には不整合があるため、文化注を実際に対応する「衣を引き裂いて」に付した。
