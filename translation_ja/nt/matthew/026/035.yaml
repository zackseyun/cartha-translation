id: MAT.26.35
reference: Matthew 26:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: ja
  text: ペトロはイエスに言った。「たとえあなたと一緒に死ななければならないとしても、あなたを否認することは決してありません[a]。」弟子たちも皆、同じように言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたを決して否認しません」。ギリシア語では強い否定（οὐ μή）が用いられている。
    reason: οὐ μήの強い否定を示しつつ、日本語として自然な別表現を示すため。
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は物語現在だが、現代日本語の自然な物語叙述に合わせて過去形とした。発話を生き生きと提示する談話上の働きは文脈によって保たれる。
- source_word: Κἂν δέῃ με
  choice: たとえ…なければならないとしても
  rationale: κἄνの譲歩条件とδέῃの必要性を、明瞭で自然な日本語で表した。
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: あなたと一緒に死ぬ
  rationale: σύνが示す同行・共同を「一緒に」で明示し、ペトロがイエスと運命を共にすると主張する意味を保った。
- source_word: οὐ μή
  choice: 決して…ません
  rationale: 二重の強い否定が持つ断固とした響きを、現代日本語で自然な強意否定によって表した。
- source_word: σε ἀπαρνήσομαι
  choice: あなたを知らないとは…言いません
  rationale: この文脈のἀπαρνέομαιは、イエスとの関係を否定することを指す。日本語で「あなたを否定する」は思想や主張を否定する意味にも取られやすいため、後の否認場面とも対応する自然な表現を選んだ。
- source_word: ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν
  choice: 弟子たちも皆、同じように言った
  rationale: ὁμοίωςを「同じように」、καίを「も」で表し、弟子全員がペトロと同様の発言をしたことを簡潔に伝えた。
theological_decisions:
- issue: ペトロの否認しないという誓言の強さ
  choice: 「決して…ません」として強い未来否定を保った。
  alternative: 「絶対に…しません」または単に「…しません」
  rationale: οὐ μήは非常に強い否定であるため、弱めずに訳した。一方、ペトロの自信に対する評価や後の失敗の神学的説明は本文に加えず、物語上の緊張をそのまま残した。
- issue: ἀπαρνήσομαιの対象と意味
  choice: 「あなたを知らないとは言いません」と訳し、イエスとの関係を否定する意味を示した。
  alternative: 「あなたを否定しません」「あなたを見捨てません」
  rationale: 「見捨てる」は離反という別の含意を加え、「否定する」は現代日本語では不自然または多義的になりやすい。後続する否認の具体的な言葉遣いを踏まえつつ、宗派的解釈を持ち込まない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ペトロの断固とした口調と場面の厳粛さを保った。「イエス」はギリシア語の代名詞が指す人物を日本語で明確にするために補った。
