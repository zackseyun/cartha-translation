revisions:
- from: ペトロはイエスに言った。「たとえあなたと一緒に死ななければならないとしても、あなたを知らないとは決して言いません[a]。」弟子たちも皆、同じように言った。
  to: ペトロはイエスに言った。「たとえあなたと一緒に死ななければならないとしても、あなたを否認することは決してありません[a]。」弟子たちも皆、同じように言った。
  rationale: 「否認することは決してありません」として、強い未来的否定を保ちながら、ἀπαρνήσομαιが表す否認の意味を特定の「知らない」という言葉に限定せずに訳しました。その他の文は原文の譲歩条件、イエスとの共同の死、弟子全員の同様の発言を自然に伝えているため維持しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:37Z'
review_pass:
  verdict: revise
  source_fidelity: 「あなたを知らないとは決して言いません」は文脈上理解可能ですが、ἀπαρνήσομαιは単に「知らないと言う」という発話に限定されず、相手との関係を否認・拒絶することを表します。本文ではこのより広い意味を保つ「否認する」が適切です。κἂν δέῃ με σὺν σοὶ ἀποθανεῖν、οὐ μή、および弟子全員が同様に言ったという内容は保持されています。
  naturalness: 「あなたを否認することは決してありません」は明瞭な現代標準日本語であり、福音書叙述にふさわしいやや改まった調子も保ちます。「弟子たちも皆、同じように言った」は自然です。
  terminology: ἀπαρνέομαιには、この文脈で定着しており意味範囲も適切な「否認する」を用います。「ペトロ」「イエス」「弟子」は一貫して自然です。
  issues:
  - severity: medium
    issue: ἀπαρνήσομαιを「あなたを知らないとは…言いません」と限定している。
    rationale: この表現は後続する否認場面を想起させる利点はありますが、原語の「否認する／関係を拒む」というより広い意味を、特定の発話内容と発話行為に狭めます。また、原文にはここで「言う」に当たる動詞はありません。
  revised_text: ペトロはイエスに言った。「たとえあなたと一緒に死ななければならないとしても、あなたを否認することは決してありません[a]。」弟子たちも皆、同じように言った。
