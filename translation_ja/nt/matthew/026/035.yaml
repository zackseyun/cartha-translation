  revision_rationale: 「否認することは決してありません」として、強い未来的否定を保ちながら、ἀπαρνήσομαιが表す否認の意味を特定の「知らない」という言葉に限定せずに訳しました。その他の文は原文の譲歩条件、イエスとの共同の死、弟子全員の同様の発言を自然に伝えているため維持しました。
