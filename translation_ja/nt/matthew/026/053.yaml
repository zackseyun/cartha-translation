id: MAT.26.53
reference: Matthew 26:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: ja
  text: それとも、わたしが父に願うことができないとでも思うのか。[a] 願えば父は今すぐ、十二軍団を超える天使の軍勢[c]をわたしのもとに置いてくださるではないか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父に呼び求める」または「父に頼む」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「わたしのそばに置いてくださる」。すなわち、助けとして使えるようにしてくださるということ。
    reason: lexical_alternative
  - marker: c
    text: 「軍団」はローマ軍の大規模な部隊。この表現は、圧倒的な天の軍勢を強調している。
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の発言を受けて別の可能性を示す修辞的な問いとして、自然な接続を保った。
- source_word: δοκεῖς ὅτι οὐ δύναμαι
  choice: わたしが…できないとでも思うのか
  rationale: 能力を表す δύναμαι と、相手の誤認を鋭く問い返す δοκεῖς の修辞的な力を明確にした。
- source_word: παρακαλέσαι τὸν πατέρα μου
  choice: 父に願う
  rationale: παρακαλέω の嘆願・要請の意味を、父子関係にふさわしい自然な現代日本語で表した。
- source_word: καὶ παραστήσει μοι
  choice: 願えば父は…わたしのもとに置いてくださる
  rationale: καί が導く当然の帰結を日本語で明瞭にするため「願えば」を補い、παρίστημι の『そばに置いて助力に使えるようにする』という像を残した。
- source_word: ἄρτι
  choice: 今すぐ
  rationale: その場で直ちに助力が得られるという時間的切迫性を自然に表した。
- source_word: πλείω δώδεκα λεγιῶνας ἀγγέλων
  choice: 十二軍団を超える天使たち
  rationale: 比較表現とローマ軍の軍事的比喩を保持し、圧倒的な規模を示した。
theological_decisions:
- issue: イエスが父の助けを求められないのか、それとも求めようとしないのか
  choice: 能力についての問いとして「願うことができないとでも思うのか」と訳した
  alternative: 意志に重点を置き「願おうと思わないのか」などと訳す
  rationale: δύναμαι は能力・可能性を表す。逮捕が無力さのためではないという含みを保ちつつ、なぜ助けを求めないのかは本文中で説明し足さなかった。
- issue: 父が天使を与えることの確実性
  choice: 「置いてくださるではないか」と修辞的な確信を表した
  alternative: 「置いてくださるだろう」と可能性を弱める
  rationale: 未来形 παραστήσει は、願いに応じる父の行為を確かな帰結として提示している。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの修辞的な問いの威厳と強さを保った。「軍団」は歴史的比喩として本文に残し、文化的背景は脚注で補った。
