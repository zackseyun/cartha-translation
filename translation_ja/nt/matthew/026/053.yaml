  source_fidelity: 主文は、ἢ の修辞的な「それとも」、οὐ δύναμαι の能力に関する否定、παρακαλέσαι の嘆願、ἄρτι の即時性をおおむね正確に伝えている。ただし「十二軍団を超える天使たち」は、天使そのものの数だけが十二軍団を超えるようにも読め、λεγιῶνας ἀγγέλων（天使の軍団）の軍事的なまとまりがやや不明瞭である。
