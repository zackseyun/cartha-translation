  to: それとも、わたしが父に願うことができないとでも思うのか。[a] 願えば父は今すぐ、十二軍団を超える天使の軍勢[c]をわたしのもとに置いてくださるではないか。[b]
  rationale: 「天使たち」を「天使の軍勢」に改め、原文の λεγιῶνας ἀγγέλων が表す軍事的な編制・比喩を明確にした。それ以外の表現と脚注は、原文の能力を問う修辞疑問、父への嘆願、即時の助力という意味を適切に保っているため維持した。
