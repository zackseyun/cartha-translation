revisions:
- from: しかし、あなたがたに言っておく。今から、わたしの父の御国で、あなたがたとともにそれを新たに[a]飲むその日まで、わたしはこのぶどうの実からできたものを、決して飲まない。
  to: しかし、あなたがたに言っておく。今後、わたしはこのぶどうの実からできたものを決して飲まない。わたしの父の御国で、あなたがたとともにそれを新しいものとして飲む、その日までは。
  rationale: καινόνの文法的な係り先と意味の幅をより適切に保つため、「新たに」を「新しいものとして」に改めた。また、原文の「今から…その日まで」という時間枠と強い否定を日本語で明瞭にするため、文を二文に整えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:37Z'
review_pass:
  verdict: revise
  source_fidelity: 原文の強い未来否定（οὐ μή）、現在を起点とする時間表現、ぶどうの産物という婉曲表現、将来の特定の日、父の国における共同の飲みを、おおむね忠実に反映している。ただし、καινόνはαὐτό（「それ」）にかかる述語的な形容詞であり、「新たに飲む」だけでは副詞的な「再び」の意味にやや寄りやすい。
  naturalness: 現行文は理解可能だが、「父の御国で、あなたがたとともにそれを新たに飲むその日まで」という修飾部が長く、主要述語が末尾まで保留されるため、やや重い。文を二文に分けず、否定の対象と期限を近づけることで、明瞭な現代標準日本語として読みやすくできる。
  terminology: 「御国」は日本語聖書で定着した神学的用語であり、この文脈では維持できる。「このぶどうの実からできたもの」はやや説明的だが、γένημα τῆς ἀμπέλουを単に「ぶどう酒」と狭めないために適切である。
  issues:
  - severity: medium
    issue: 「新たに」がκαινόνの述語的な係り方を十分に示さない。
    rationale: καινόνは「飲む」という行為だけでなく、その飲まれる「それ」の新しさ・新しいあり方を表し得る。「新たに」は自然だが、「再び」の時間的意味として読まれやすいので、本文で「新しいものとして」として係り先を明示し、脚注で「再び」の可能性を残すのがより安全である。
  - severity: low
    issue: 現行の語順では期限を示す従属節が長く、主節の「決して飲まない」から離れている。
    rationale: 原文の語順を機械的に再現する必要はない。日本語では「今後、…決して飲まない。その日まで」という関係を一文内で近接させることで、強い否定と将来の期限が明瞭になる。
  revised_text: しかし、あなたがたに言っておく。今後、わたしはこのぶどうの実からできたものを決して飲まない。わたしの父の御国で、あなたがたとともにそれを新しいものとして飲む、その日までは。
  revised_footnotes:
