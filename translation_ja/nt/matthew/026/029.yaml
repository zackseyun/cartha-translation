    text: 直訳「それを新しいものとして」。または「新たに」「再び」。ギリシア語は、新しさの性質・あり方を指すことがあり、来るべき御国で再び飲むという含みもあり得る。
    reason: καινόνは「それ」（αὐτό）にかかる述語的形容詞であるため、その係り方を本文で示しつつ、「再び」という可能な時間的含意を脚注に保存する。
  revision_rationale: καινόνの文法的な係り先と意味の幅をより適切に保つため、「新たに」を「新しいものとして」に改めた。また、原文の「今から…その日まで」という時間枠と強い否定を日本語で明瞭にするため、文を二文に整えた。
