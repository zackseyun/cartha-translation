id: MAT.26.29
reference: Matthew 26:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: ja
  text: しかし、あなたがたに言っておく。今後、わたしはこのぶどうの実からできたものを決して飲まない。わたしの父の御国で、あなたがたとともにそれを新しいものとして飲む、その日までは。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: しかし、あなたがたに言っておく
  rationale: δέによる軽い対照と話の転換を「しかし」で示し、λέγω ὑμῖνは現代日本語として自然で荘重な「あなたがたに言っておく」とした。
- source_word: οὐ μὴ πίω
  choice: 決して飲まない
  rationale: οὐ μήとアオリスト接続法による強い未来否定を、過度に絶対化せず明瞭に表す。
- source_word: ἀπ’ ἄρτι
  choice: 今から
  rationale: 発話時点を起点とする時間表現を、簡潔で自然な日本語にした。
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: このぶどうの実からできたものを
  rationale: γένημαの「産物・実り」という語義と、この杯の中身を指す慣用表現を保ちつつ、単に「ぶどう酒」と明示して原文以上に限定することを避けた。
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: その日まで
  rationale: ἐκείνηςが指し示す特定の将来の日をそのまま表した。
- source_word: ὅταν αὐτὸ πίνω
  choice: それを…飲む
  rationale: αὐτόが先に述べられたぶどうの産物を受けることを「それ」で明示し、ὅτανの将来の時点を「飲むその日」で自然に表現した。
- source_word: καινὸν
  choice: 新たに
  rationale: 述語的に用いられたκαινόνを日本語として自然に表しつつ、新しい性質・あり方と、再び飲むことの両方を排除しない。語義の幅は脚注に示した。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたとともに
  rationale: 単なる同伴以上に共同の食事の響きも自然に伝わる表現とした。
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: わたしの父の御国で
  rationale: 「わたしの父」という関係表現を保ち、βασιλείαは聖書日本語として定着しつつ理解しやすい「御国」とした。
theological_decisions:
- issue: 杯の中身を「ぶどう酒」と明示するか、原文の慣用表現を保つか
  choice: 「このぶどうの実からできたもの」とした
  alternative: 「このぶどう酒」
  rationale: 原文はοἶνοςではなく「ぶどうの産物」と述べているため、その表現を読者に理解できる形で保ち、本文以上の祭儀的・象徴的限定を加えないようにした。
- issue: 終末の食事におけるκαινὸνの意味
  choice: 本文では「新たに」とし、意味を一つに限定しない
  alternative: 「新しいものとして」または「再び」
  rationale: この語は性質・あり方の新しさを示し得る一方、「再び／新たに飲む」という含みも生じる。本文で解釈を固定せず、脚注で幅を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの厳粛な宣言にふさわしい品位を保った。「御国」は一般読者にも理解可能な聖書語として採用し、文全体は長くなりすぎないよう日本語の語順を整えた。
