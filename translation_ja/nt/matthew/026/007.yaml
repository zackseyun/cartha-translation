source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: ja
  text: すると、一人の女が、非常に高価な香油の入った雪花石膏の壺[a]を持ってイエスに近づき、食事の席で横になっていた[b]イエスの頭に香油を注いだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「雪花石膏の小瓶」とも訳せる。ここでいう「香油」は、香りのついた油や軟膏を指す。容器は雪花石膏製、またはその名で呼ばれる香油用の壺であった可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 当時は食事の際、寝台に横たわって上体を起こす姿勢を取ることがあった。
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: イエスに近づき
  rationale: προσέρχομαιの相手へ向かう動きを自然な現代日本語で表した。代名詞は文脈上の指示対象である「イエス」として明示した。
- source_word: γυνή
  choice: 一人の女
  rationale: 特定されていない単数の女性を表すため、日本語として自然な「一人の女」とした。
- source_word: ἔχουσα
  choice: 持って
  rationale: 女性が容器を携えていたという具体的な状況を、簡潔で自然に表した。
- source_word: ἀλάβαστρον μύρου βαρυτίμου
  choice: 非常に高価な香油の入った雪花石膏の壺
  rationale: μύρονは芳香をつけた油または軟膏を指すため「香油」とし、βαρύτιμοςの強い価値表現を「非常に高価な」で保持した。ἀλάβαστρονは素材名に由来する容器として「雪花石膏の壺」としたが、形状や素材には幅があるため脚注を付した。
- source_word: κατέχεεν
  choice: 注いだ
  rationale: 頭の上へ液体を流しかける動作を、現代日本語で最も自然に表した。
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: イエスの頭に
  rationale: ἐπί＋属格が示す接触・位置を「頭に」で簡潔に表し、日本語で曖昧にならないよう代名詞を固有名で受けた。
- source_word: ἀνακειμένου
  choice: 食事の席に着いていた
  rationale: 当時の食事時の横臥姿勢を指す。日本語の「横になっていた」では休息中とも読めるため、本文では食事の場面を自然に示し、具体的な姿勢は脚注で補った。
