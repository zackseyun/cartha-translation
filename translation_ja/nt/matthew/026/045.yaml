id: MAT.26.45
reference: Matthew 26:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ja
  text: それから、イエスは弟子たちのところに来て、彼らに言われた。「もう眠って休みなさい。[a] 見なさい。時が近づいた。[b] 人の子は罪人たちの手に引き渡される。[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まだ眠って休んでいるのですか」。ギリシア語は修辞的な問いとして理解することもできる。本文は、直後の告知との間にある皮肉と緊張を残している。
    reason: alternative_reading
  - marker: b
    text: 別訳「時が来た」または「時が迫った」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「裏切られる」。ギリシア語はより広く「引き渡される」「渡される」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: それから
  rationale: 出来事の順序を示す標準的な接続表現として、自然な現代日本語にした。
- source_word: ἔρχεται πρὸς τοὺς μαθητάς καὶ λέγει αὐτοῖς
  choice: イエスは弟子たちのところに来て、彼らに言われた
  rationale: ギリシア語の歴史的現在は、日本語の物語として自然な過去形で表した。文脈上の主語イエスを明示し、敬意を示す通常の聖書文体を用いた。
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: もう眠って休みなさい
  rationale: 表面上は命令として読める形を保ちつつ、直後の切迫した告知との緊張と皮肉の可能性を残した。τὸ λοιπὸν は文脈に即して「もう」と簡潔に表した。
- source_word: ἰδού
  choice: 見なさい
  rationale: 聞き手の注意を促す語として、古風すぎない荘重な表現を選んだ。
- source_word: ἤγγικεν ἡ ὥρα
  choice: 時が近づいた
  rationale: ἐγγίζω の「近づく」という基本像と、完了形が示す現在の切迫性を保った。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの重要な自己呼称として定着している訳語を用い、説明的に言い換えなかった。
- source_word: παραδίδοται
  choice: 引き渡される
  rationale: 「裏切られる」だけに狭めず、逮捕と受難へ渡されるという広い語義を保った。
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: 罪人たちの手に
  rationale: 明瞭な日本語の慣用表現でもあるため、原文の具体的な「手」の比喩を保持した。
theological_decisions:
- issue: Καθεύδετε … καὶ ἀναπαύεσθε の発話の力
  choice: 「もう眠って休みなさい」と、皮肉または譲歩を帯びうる命令形で訳した。
  alternative: 「まだ眠って休んでいるのですか」と修辞疑問にする。
  rationale: ギリシア語の形は命令とも陳述とも取ることができ、文脈上は修辞疑問の可能性もある。本文では疑問文に断定せず、直後の告知との緊張を保った。
- issue: 受難文脈における παραδίδοται の意味
  choice: 引き渡される
  alternative: 裏切られる
  rationale: この語はユダの裏切りを含みうるが、それだけでなく、イエスが敵の手に渡される出来事全体を表せるため、より広い原語の意味を維持した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、イエスの発言には簡潔で dignified な調子を保った。歴史的現在は日本語の自然な物語時制に移し、主語イエスを文脈から補った。「見よ」のような強い文語は避け、「見なさい」とした。
