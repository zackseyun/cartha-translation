base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: ja
  text: そして彼らは、策略を用いてイエスを捕らえ、殺そうと相談した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: 相談した
  rationale: 共同で策を協議したことを表す中動態のアオリスト。文脈上、悪意ある企てだが、その含みは目的節と「ひそかに」によって十分伝わる。
- source_word: δόλῳ
  choice: ひそかに
  rationale: 原語は欺き・策略を用いることを示す。ここでは公然とではなく策略によって捕らえる意味を、自然な日本語で表した。
- source_word: κρατήσωσιν
  choice: 捕らえて
  rationale: 人を支配下に置く、逮捕するという文脈上の意味を明確にした。
- source_word: ἀποκτείνωσιν
  choice: 殺そう
  rationale: 目的節 ἵνα と接続法が表す企図を、日本語の意志・目的表現「〜しよう」で自然に示した。
theological_decisions:
- issue: ἵνα と二つの接続法が示す目的
  choice: 「捕らえて殺そうと」
  alternative: 「捕らえ、殺すために」
  rationale: 企てられた目的であり、実現済みの行為ではないことを自然に保つ。
- issue: δόλῳ の意味範囲
  choice: 「ひそかに」
  alternative: 「策略を用いて」または「だまして」
  rationale: 欺瞞や策略の含意を持つが、具体的に「だます」と限定せず、隠密な方法という文脈上の焦点を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語。短い叙述の流れを保ちつつ、原文の共同協議、隠密な手段、捕縛と殺害という目的を簡潔かつ格調を損なわず表現した。
