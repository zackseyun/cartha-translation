reference: Matthew 26:64
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: ja
  text: イエスは彼に言われた。「あなたがそう言いました[a]。しかし、あなたがたに言っておきます[b]。今から後、あなたがたは、人の子が『力』の右に座り、天の雲に乗って来るのを見るでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなた自身がそう言ったのです」。このギリシア語表現は、相手の言葉を受けて肯定する慣用的な答えです。
    reason: lexical_alternative
  - marker: b
    text: ダニエル書7章13節と詩篇110篇1節を踏まえた表現です。「力」は、神を敬って間接的に指す言い方です。
    reason: cross_reference_and_cultural_note
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: あなたがそう言いました
  rationale: 肯定を含む慣用的な応答でありながら、単純な「はい」よりも原文の言い回しを保ち、曖昧さを過度に解消しない。
- source_word: πλὴν
  choice: しかし
  rationale: 直前の応答から厳粛な宣言へ移る強い転換を、自然な現代日本語で示す。
- source_word: ἀπ’ ἄρτι
  choice: 今から後
  rationale: この時点から始まる事態を表し、ただちに一瞬で成就するという意味に限定しない。
- source_word: ὄψεσθε
  choice: あなたがたは…見ることになります
  rationale: 複数形を明示し、未来の確実な展開を自然な日本語で表す。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: ダニエル書との関連をもつ、定着した称号を保持する。
- source_word: καθήμενον
  choice: 座り
  rationale: 直訳的で自然であり、右の座という文脈によって即位と高挙の含意も保たれる。
- source_word: ἐκ δεξιῶν
  choice: 右に
  rationale: 栄誉と権威の位置を示す聖書的表現を、簡潔で自然な日本語にする。
- source_word: τῆς δυνάμεως
  choice: 『力ある方』
  rationale: 神を指す敬虔な婉曲表現としての機能を示しつつ、原文以上に直接「神」と明示しない。
- source_word: ἐρχόμενον
  choice: 来る
  rationale: ダニエル書の幻との響きを保持する直接的で自然な訳。
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: 天の雲に乗って
  rationale: ἐπίの空間的イメージを日本語として明瞭に表し、ダニエル7章13節への言及を保つ。
theological_decisions:
- issue: 大祭司への応答「Σὺ εἶπας」の強さ
  choice: 肯定を含みつつ原語の言い回しを残す「あなたがそう言いました」
  alternative: 「そのとおりです」または「はい」
  rationale: 単なる回避的返答とはせず、同時に原文を無条件の明示的な「はい」へ平板化しない。
- issue: 「力」（τῆς δυνάμεως）の指示対象
  choice: 神を指す敬虔な婉曲表現として「『力ある方』」と訳す
  alternative: 「神」または「大能者」
  rationale: 指示対象は伝えながら、原文が直接「神」と言わない抑制された宗教的語法を保持する。
- issue: 「見る」内容の時間的範囲
  choice: 右に座ることと雲に乗って来ることを一つの宣言の中に並置する
  alternative: すべてを直近の出来事、または再臨だけに限定する
  rationale: 二つの分詞がともに「見る」の内容となっている原文を保ち、成就時期を翻訳で一義的に決めない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、裁判場面の厳粛さと旧約聖書への言及を保った。「あなたがた」で複数形を明示し、「『力ある方』」は固有の婉曲称号であることが読者に分かるよう括弧を用いた。
