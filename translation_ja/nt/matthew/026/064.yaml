revisions:
- from: イエスは彼に言われた。「あなたがそう言いました[a]。しかし、あなたがたに言っておきます[b]。今から後、あなたがたは、人の子が『力ある方』の右に座り、天の雲に乗って来るのを見ることになります。」
  to: イエスは彼に言われた。「あなたがそう言いました[a]。しかし、あなたがたに言っておきます[b]。今から後、あなたがたは、人の子が『力』の右に座り、天の雲に乗って来るのを見るでしょう。」
  rationale: 「『力ある方』」を「『力』」へ改め、原文の τῆς δυνάμεως の抽象名詞による婉曲表現を保ちました。また、「見ることになります」を「見るでしょう」に改め、ὄψεσθε の未来形を余分なニュアンスなしに自然に表しました。その他の表現と注のアンカーは原文および英語監査記録に適合しています。
