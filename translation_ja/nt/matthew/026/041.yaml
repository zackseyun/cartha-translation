  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ja
  text: 誘惑[a]に陥らないように、目を覚まして祈っていなさい。霊は確かに意欲があっても、肉は弱いのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」と訳したギリシア語は、「試み」または「試練」を意味することもある。罪への誘いと、人を試す苦難のどちらをも指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 直訳的な「目を覚ましている」と、状況に即した「警戒している」の両方を含みうる。弟子たちが実際に眠っていた文脈を踏まえ、自然な命令表現とした。
- source_word: προσεύχεσθε
  choice: 祈っていなさい
  rationale: 現在命令形が示す継続的な行為を、現代日本語で自然な「祈っていなさい」によって表した。
- source_word: ἵνα μὴ εἰσέλθητε εἰς πειρασμόν
  choice: 誘惑に陥らないためです
  rationale: 目的・防止を示す構文を明確にした。「入る」という原文の比喩は日本語では不自然になりやすいため、「陥る」としたが、πειρασμόςの意味の幅は脚注に残した。
- source_word: πειρασμόν
  choice: 誘惑
  rationale: 目前の圧力の中で弟子たちが道徳的に失敗する危険への警告として「誘惑」が最も自然である。ただし「試み」「試練」の意味もありうるため脚注を付した。
- source_word: τὸ μὲν πνεῦμα
  choice: 霊は確かに
  rationale: πνεῦμαを「心」と言い換えず「霊」とし、人間の内なる意志を指す可能性と語の神学的な含みを保った。μένの対比の力は「確かに……ても」で表した。
- source_word: πρόθυμον
  choice: 進んでいても
  rationale: 意欲、心構え、進んで行おうとする姿勢を表す語であり、対照を自然な日本語にするため「進んでいる」とした。
- source_word: ἡ δὲ σὰρξ
  choice: 肉は
  rationale: 「肉体」や「人間の弱さ」と説明的に訳さず、「霊」との対照をなす原文の比喩と神学的緊張を保つため「肉」とした。
- source_word: ἀσθενής
  choice: 弱い
  rationale: この文脈で、人間の脆さと力不足を簡潔かつ自然に表す。
theological_decisions:
- issue: πνεῦμαの指示対象
  choice: 「霊」と訳し、文脈上は人間の内なる意志を第一に想定する
  alternative: 「心」または「聖霊」
  rationale: 弟子たちの意志と実際の弱さとの対照は人間の霊を示唆するが、「心」と解釈的に限定せず、原語の表現を保った。聖霊を明示する根拠も本文にはない。
- issue: σάρξの訳語
  choice: 肉
  alternative: 肉体／罪深い性質
  rationale: ここでは発達した教理用語としての「罪深い性質」より、人間の身体性を伴う弱さが中心である。「肉」は「霊」との対照と聖書的比喩を保持する。
- issue: πειρασμόςの意味
  choice: 本文では「誘惑」
  alternative: 試み／試練
  rationale: 差し迫る状況で弟子たちが罪に陥る危険に合う一方、原語自体には試験や苦難の意味もあるため、その幅を脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、命令の切迫感と格調を保った。「霊」と「肉」は説明的に言い換えず、原文の簡潔な対照と解釈上の緊張を残した。
