  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: ja
  text: イエスは答えた。「私と一緒に鉢に手を浸した者、その人が私を裏切ります[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私を引き渡します」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えた
  rationale: 分詞と定動詞を重ねた慣用的な表現であり、現代日本語では簡潔に「答えた」とするのが自然で、意味も保たれる。
- source_word: ἐμβάψας
  choice: 浸した
  rationale: 食物を取るために手を鉢へ入れた、完了した識別行為を表す。「浸した」は語義を明確に伝える。
- source_word: μετ’ ἐμοῦ
  choice: 私と一緒に
  rationale: 属格を伴う μετά の同伴の意味を、自然な日本語で表す。
- source_word: τὴν χεῖρα
  choice: 手を
  rationale: 身体部位につくギリシア語の定冠詞は、日本語では所有者を明示せずとも自然に理解できる。
- source_word: ἐν τῷ τρυβλίῳ
  choice: 鉢に
  rationale: τρύβλιον は食物を入れる皿または鉢を指す。ここでは、手を浸す動作と自然に結びつく「鉢」を採用した。
- source_word: οὗτός
  choice: その人が
  rationale: 指示代名詞の強調を、単なる「彼」ではなく「その人が」で保ちつつ、自然な日本語にした。
- source_word: παραδώσει
  choice: 裏切ります
  rationale: 基本的には「引き渡す」を意味するが、この受難物語では敵に渡す背信行為を指すため、「裏切る」が文脈上の意味を明瞭に伝える。字義的な選択肢は脚注に残した。
theological_decisions:
- issue: ユダの行為を指す παραδίδωμι の訳
  choice: 裏切ります
  alternative: 引き渡します
  rationale: この動詞には一般に「引き渡す」の意味がある一方、ここでは親しい食卓の交わりにある者がイエスを敵へ渡す文脈なので、背信の含意が中心となる。ただし語の基本的な意味を失わないよう、別訳を脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら品位ある直接話法とした。「私と一緒に」と「その人が」により、原文の同伴関係と指示の強調を保った。脚注記号は該当する「裏切ります」の直後に置いた。
