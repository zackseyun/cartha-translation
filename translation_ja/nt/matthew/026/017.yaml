reference: Matthew 26:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: ja
  text: 除酵祭の最初の日[a]、弟子たちはイエスのところに来て、こう言った。「過越の食事をお召し上がりになるため、私たちがどこで用意することをお望みですか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「種なしパンの最初の日」。祭りの期間を指す表現です。過越の食事との時系列上の関係は、この訳語だけで決着させるべきではありません。
    reason: cultural_note
  - marker: b
    text: 別訳「過越を食べるために、どこで用意することをお望みですか」。ここで「過越」は、文脈上、過越の食事を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: 除酵祭の最初の日
  rationale: 時間を示す与格を「最初の日」とし、実詞的な複数形「種なしパンのもの」をユダヤ祭期を指す慣用的な名称「除酵祭」とした。δέは弱い接続であり、日本語では無理に接続語を加えず文脈に委ねた。
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: 弟子たちはイエスのところに来て
  rationale: προσέρχομαιの接近の意味を、自然な現代日本語の「ところに来る」で表した。「弟子たち」は原文どおり既知の集団を指し、「イエスの」とは補わない。
- source_word: λέγοντες
  choice: こう言った
  rationale: 同時的な分詞を、日本語として自然な連用関係で表した。「尋ねた」とせず、原文の一般的な発話動詞の幅を保った。
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: 私たちはどこに用意すればよいでしょうか
  rationale: θέλωを含む間接的な意向確認を、敬意ある自然な問いとして表した。σοιは受益者を示すが、後続の尊敬表現「なさるために」と問い全体からイエスのための準備であることが明瞭なため、重い「あなたのために」は避けた。
- source_word: φαγεῖν τὸ πάσχα
  choice: 過越の食事をなさるために
  rationale: πάσχαは祭り、食事、犠牲を指し得るが、φαγεῖνとの結び付きでは食事が念頭にある。「過越」だけでは現代日本語で「食べる」と結び付きにくいため「過越の食事」と明示し、φαγεῖνを目的として訳した。
theological_decisions:
- issue: 「除酵祭の最初の日」と過越の食事の年代関係
  choice: 原文の祭日表現を「除酵祭の最初の日」とそのまま保持する。
  alternative: 「除酵祭の前日」または「過越祭の最初の日」と解釈的に言い換える。
  rationale: ギリシア語本文は明確に「除酵の最初の日」と述べる。福音書間の年代を翻訳で調和させず、原文にある緊張を残した。
translation_notes:
  register: 明快で現代的な標準日本語を用い、会話には弟子からイエスへの自然な敬意を示した。「除酵祭」「過越」は聖書・ユダヤ文化上の固有用語として保持し、脚注で補った。
