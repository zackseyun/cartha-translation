lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が示す、協議の中で続いていた発言を自然な日本語で表す。
- source_word: δέ
  choice: しかし
  rationale: 前節の企てに対し、その実行時期には慎重だったことを示す穏やかな対比を表す。
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: 祭りの間はいけない
  rationale: 省略を含む否定表現を、日本語の相談・決定の言い方として自然に訳す。ἐνは時間的な「間」、ἑορτήは文脈上、過越の祭りを指す。
- source_word: ἵνα μὴ
  choice: ～といけないから
  rationale: 避けようとする結果ないし目的を、現代日本語で自然に表す。
- source_word: θόρυβος
  choice: 騒ぎ
  rationale: 公衆の混乱や騒動を意味するが、「暴動」と断定するほど意味を強めず、語の幅を保つ。
- source_word: γένηται
  choice: 起こる
  rationale: θόρυβοςが生じることを簡潔で自然な日本語にする。
- source_word: ἐν τῷ λαῷ
  choice: 民衆の間で
  rationale: 集まっている人々の中に騒ぎが広がる社会的状況を明確に表す。
