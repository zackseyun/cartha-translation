  rationale: εἰς ἐμέの意味の幅を本文と脚注で適切に保つため、「わたしに……してくれた」を「わたしに対して……した」に改めました。また、ἔργονに対応して「立派なこと」を「立派な行い」とし、行為としての評価を明示しました。その他は原文の構文、叱責の調子、自然な現代日本語を保っています。
