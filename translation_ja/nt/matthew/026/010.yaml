source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: ja
  text: しかし、イエスはそれを知って、彼らに言われた。「なぜ、この女性を困らせるのですか。彼女はわたしに対して立派な行いをしたのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: それを知って
  rationale: アオリスト分詞の付帯状況を自然な日本語で表し、文脈上の対象である弟子たちの非難を「それ」で受けた。
- source_word: δὲ
  choice: しかし
  rationale: 弟子たちの非難からイエスの応答へ移る際の穏やかな対照を示す。
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: なぜ、この女性を困らせるのですか
  rationale: κόπους παρέχετε の「労苦・厄介を与える」という語法を、叱責の調子を保つ明瞭で自然な現代日本語にした。τῇ γυναικί はその影響を受ける相手として表した。
- source_word: ἔργον καλὸν
  choice: 立派なこと
  rationale: καλός が持つ善さ、美しさ、称賛に値する適切さを、行為への評価として自然に伝える。「良いこと」より称賛の強さを保ち、「美しい行い」より一般読者に自然である。
- source_word: ἠργάσατο εἰς ἐμέ
  choice: わたしに……してくれた
  rationale: 完了した行為とイエスへの関係・方向を自然に表す。「してくれた」は日本語では受益を含意し得るため、εἰς の方向性を前面に出す別訳を脚注に残した。
theological_decisions:
- issue: 女性の行為に対する評価
  choice: 立派なこと
  alternative: 美しい行い／良い行い
  rationale: 本文が明確に与える肯定的評価を保ちつつ、功徳、秘跡、その他の教派的含意を加えない。καλός の道徳的・美的な幅は脚注で保持した。
- issue: εἰς ἐμέ が示す関係
  choice: わたしに……してくれた
  alternative: わたしに向けて……した／わたしのために……した
  rationale: 方向と受益のいずれにも理解し得る表現を一義的な教理へ狭めず、自然な本文と別訳脚注で幅を示した。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの発言には丁寧だが直接的な叱責の調子を持たせた。「女」より現代日本語で中立的な「女性」を選び、文体の品位と一般読者への分かりやすさを両立した。
