  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: ja
  text: それから、イエスは弟子たちと一緒に、ゲツセマネと呼ばれる場所に来た。そして弟子たちに言った。「私が向こうへ行って祈るまで[a]、ここに座っていなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が向こうへ行って祈っている間」。原文は字義的には「私が向こうへ行って祈るまで」という表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: それから
  rationale: 物語の次の出来事を示す時間的接続語として、自然な現代日本語の流れを保つ。
- source_word: ἔρχεται
  choice: 来られた
  rationale: ギリシア語は臨場感を与える歴史的現在だが、日本語では過去形の物語叙述が自然である。主語がイエスであることに合わせ、本文全体の品位を保つ表現とした。
- source_word: μετ’ αὐτῶν
  choice: 弟子たちと一緒に
  rationale: αὐτῶνの指示対象を文脈から明示し、μετάの同伴の意味を自然に表した。
- source_word: χωρίον
  choice: 場所
  rationale: 土地、一区画、場所を表し得る語。マタイ本文には「園」と明記されていないため、広い意味を保つ「場所」とした。
- source_word: λεγόμενον Γεθσημανί
  choice: ゲツセマネと呼ばれる
  rationale: 場所の名称を示す一般的な分詞表現を自然な日本語にし、固有名は慣用的に音写した。
- source_word: λέγει τοῖς μαθηταῖς
  choice: 弟子たちに言われた
  rationale: 原文の歴史的現在を、日本語の自然な過去叙述として訳した。
- source_word: Καθίσατε αὐτοῦ
  choice: ここに座っていなさい
  rationale: 命令の簡潔さを保ちつつ、後続する一時的な待機の意味が日本語で自然に伝わるようにした。αὐτοῦは場所を示す副詞として「ここに」とした。
- source_word: ἕως οὗ
  choice: 間
  rationale: 字義的には「〜するまで」だが、この文脈では、イエスが行って祈るあいだ弟子たちがそこにいるよう命じる意味を自然に表す。「まで」という時間的限界の含みは脚注に残した。
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: 私が向こうへ行って祈っている
  rationale: 分詞ἀπελθώνと接続法προσεύξωμαιの動作関係を、自然な日本語の連続した行為として表した。ἐκεῖは「ここ」との対照を示す「向こう」とした。
theological_decisions:
- issue: ゲツセマネの場所の性質
  choice: χωρίονを「場所」と訳した。
  alternative: 「園」
  rationale: マタイ自身の表現は、その場所を「園」と特定していない。「園」とするとヨハネ18:1の情報をマタイ本文に持ち込むことになるため、原文の広い表現を保持した。
- issue: 弟子たちが待つ期間の表現
  choice: 「祈っている間」
  alternative: 「祈るまで」
  rationale: ἕως οὗの時間的限界を認めつつ、この命令が示す同時的な待機を現代日本語で自然に伝えた。字義的な別訳は脚注に示し、意味の幅を残した。
translation_notes:
  register: 明快な現代標準日本語を用い、物語本文は自然な過去時制で統一した。イエスの発話は簡潔で威厳のある口調とし、古風すぎる表現は避けた。英語参照文では脚注記号が「ゲツセマネ」に付いているが、脚注内容はἕως οὗの訳し方に関するため、日本語本文では対応する「間」の後に配置した。
