  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: ja
  text: その時、人々はイエスの顔につばを吐きかけ、拳で殴った。ほかの者たちは平手で打った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 出来事の時間的な進行を示す語。現代日本語の物語文として自然で、直前の場面とのつながりを保つ。
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: イエスの顔につばを吐きかけ
  rationale: ἐμπτύωとεἰς τὸ πρόσωπονは、顔を狙って直接つばを吐く侮辱行為を表す。「顔につばを吐きかける」は、その方向性と侮辱性を自然な日本語で伝える。
- source_word: ἐκολάφισαν αὐτόν
  choice: 拳で殴った
  rationale: κολαφίζωは拳による打撃を指しうるため、一般的な「打った」より具体的に訳した。現代語として明瞭でありながら、過度に口語的ではない。
- source_word: οἱ δὲ ἐράπισαν
  choice: また、平手でたたく者たちもいた
  rationale: 冠詞οἱは実質的に「（別の）者たち」を表し、ῥαπίζωは平手で打つことを指すことが多い。目的語「イエス」は文脈上明白なので、日本語では自然な形に整えた。
- source_word: δέ
  choice: また
  rationale: 強い対比ではなく、別の人々による行為を付加する軽い転換として理解した。「また」と「も」によってその区別を自然に示す。
theological_decisions:
- issue: 議会の前でイエスが受けた侮辱と暴行の描写
  choice: つばを吐きかける、拳で殴る、平手でたたくという行為を具体的に訳す。
  alternative: 「虐待した」「打った」などの包括的な表現にまとめる。
  rationale: 原文は侮辱と身体的暴行を個別の動作として描いている。具体性を保つことで、説明や教理的解釈を加えずに物語の力を伝えられる。
translation_notes:
  register: 明瞭な現代標準日本語。暴行の具体性は保ちつつ、扇情的・俗語的な表現は避けた。「イエス」は原文の代名詞を文脈に即して明示した。
