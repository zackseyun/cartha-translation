  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: ja
  text: そして彼は再び誓って否定した。「私はその人を知らない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な物語上の接続を保ち、原文にない強い時間的含意を加えない。
- source_word: πάλιν
  choice: 再び
  rationale: ペトロの否定が繰り返されたことを、簡潔で自然な現代日本語で示す。
- source_word: ἠρνήσατο
  choice: 否定した
  rationale: 後続する直接話法が否定の内容を示すため、日本語では目的語を補わなくても自然であり、原文の意味を明確に伝えられる。
- source_word: μετὰ ὅρκου
  choice: 誓って
  rationale: 誓いを立てながら否定したことを自然に表す。「宣誓のもとで」は正式な司法手続きを連想させかねない。
- source_word: ὅτι
  choice: 「 」
  rationale: 否定の内容を導く語であり、日本語では直接話法として引用符で示すのが自然である。
- source_word: Οὐκ οἶδα
  choice: 私は……知らない
  rationale: 知っていることを明確に否定する発言として、簡潔かつ荘重さを損なわない表現にした。
- source_word: τὸν ἄνθρωπον
  choice: その人
  rationale: 文脈ですでに話題となっている男性を指す定冠詞付きの表現を、自然な日本語で示す。「あの人」より指示的な距離感を過度に強めず、「イエス」と明示する解釈も加えない。
theological_decisions:
- issue: ペトロの否定における「その人」の指示対象
  choice: 「その人」という表現を保つ。
  alternative: 「あの方」「イエス」「彼」
  rationale: 原文は明示的に「その人」と述べており、ペトロが距離を置くような言い方の修辞的効果を保つ。「イエス」と置き換えると、原文にない固有名を補うことになる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔な叙事文と直接話法で原文の緊張感を保った。「誓って」は口語的すぎず、宗教・司法上の形式を不必要に加えない自然で格調ある表現である。
