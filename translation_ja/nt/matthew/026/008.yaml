base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: ja
  text: しかし、弟子たちはそれを見て憤り、「何のために、このような無駄をするのか」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: それを見て
  rationale: アオリスト分詞を自然な日本語の連用表現とした。ギリシア語では目的語が明示されていないが、文脈上は女性の行為を指すため、日本語でも自然になるよう「それを」を補った。
- source_word: δὲ
  choice: しかし
  rationale: 直前の女性の行為から弟子たちの否定的な反応への緩やかな対照と展開を示す。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 福音書における標準的な訳語。「イエスの」は原文に明示されていないため補わない。
- source_word: ἠγανάκτησαν
  choice: 憤り
  rationale: 単なる不快感より強く、その行為を不当と見る憤慨のニュアンスを保つ。
- source_word: λέγοντες
  choice: と言った
  rationale: 分詞による発言導入を、現代日本語として自然な叙述にした。
- source_word: Εἰς τί
  choice: なぜ
  rationale: 字義的には「何のために／何を目的として」だが、ここでは非難を込めて理由を問う日本語の「なぜ」が自然である。
- source_word: ἡ ἀπώλεια αὕτη
  choice: こんな無駄なこと
  rationale: ἀπώλεια は損失・浪費を表し、この文脈では香油を注いだ行為を「無駄」と評価する語。「こんな」により指示語 αὕτη と非難の語調を自然に表した。
