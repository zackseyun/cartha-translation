lexical_decisions:
- source_word: ἐδύνατο
  choice: できたのに
  rationale: 未完了過去形と不定詞が表す、過去に実現しなかった可能性を自然な日本語で示す。文脈上の非難・反実現の含みも保つ。
- source_word: γὰρ
  choice: 訳語を明示しない
  rationale: 前節の「何のための無駄遣いか」という問いに対する理由説明は、日本語では文脈と「のに」によって自然に伝わるため、接続語を補わない。
- source_word: τοῦτο
  choice: これ
  rationale: 直前の香油を指す中性単数の指示語を、そのまま簡潔に訳す。
- source_word: πραθῆναι
  choice: 売って
  rationale: アオリスト受動不定詞「売られること」を、日本語の可能表現「売ることができた」に組み込み、後続する施しとの動作の流れを自然に示す。
- source_word: πολλοῦ
  choice: 高く
  rationale: 価格の属格で、大きな金額で売ることを意味する。金額を特定せず、現代日本語で簡潔に表す。
- source_word: δοθῆναι
  choice: 施す
  rationale: 受動不定詞「与えられること」を、πτωχοῖςとの組み合わせに即して「貧しい人たちに施す」と自然に表現する。売却代金が与えられるという文脈上の意味を保つ。
- source_word: πτωχοῖς
  choice: 貧しい人たちに
  rationale: 実体詞的な複数形容詞を、尊厳を保った明瞭な現代日本語で訳す。
