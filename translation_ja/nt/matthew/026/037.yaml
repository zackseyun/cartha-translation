source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: ja
  text: そして、ペトロとゼベダイの二人の息子を連れて行き、悲しみ始め、ひどく苦悩し始めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν
  choice: 連れて行き
  rationale: アオリスト分詞は、イエスが選んだ三人を伴ってさらに進んだことを表す。日本語では「連れて行き」が文脈上自然であり、同行の意味を明確に伝える。
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: ゼベダイの二人の息子
  rationale: ギリシア語の明示的な呼称をそのまま保ち、この節にない「ヤコブとヨハネ」という名は補わない。
- source_word: ἤρξατο
  choice: 始めた
  rationale: 二つの不定詞にかかる開始の意味を明示する。
- source_word: λυπεῖσθαι
  choice: 悲しみ
  rationale: 悲哀や悲痛を経験する意味を、現代日本語で明瞭かつ厳粛に表す。「悲しくなり」よりも場面にふさわしい重みがある。
- source_word: ἀδημονεῖν
  choice: 深く苦しみ
  rationale: 強い内的動揺や苦悩を表す語であり、「深く苦しみ」は先行する「悲しみ」より強い切迫した苦悩を自然に伝える一方、「絶望」など原文以上の意味は加えない。
- source_word: καὶ ... καὶ
  choice: そして…と／悲しみ、深く苦しみ
  rationale: 接続の積み重ねを日本語として自然に整えつつ、同行者の並列と二つの感情表現の双方を保持する。
theological_decisions:
- issue: キリスト論との関係におけるイエスの感情状態
  choice: 二つの動詞を、現実の人間的な悲しみと深い苦悩として率直に訳す
  alternative: 感情的な弱さを避けるため表現を弱める、または語義を越えて「恐怖」「絶望」と強める
  rationale: 原文はイエスの真実な悲しみと激しい内的苦悩を描く。これを弱めず、同時に希望の喪失まで読み込まず、原文の神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、受難直前の場面にふさわしい簡潔で厳粛な調子とした。「ペトロ」は原語名に近い現代的な表記を採用した。
