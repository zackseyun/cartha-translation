  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: ja
  text: というのも、この人がこの香油をわたしの体に注いだのは、わたしの埋葬の備えをするためだったのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしを葬るため」とも訳せる。ここで用いられているギリシア語には、遺体を埋葬に向けて整える意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: 注いだ
  rationale: βάλλωのアオリスト分詞だが、この文脈では香油を体に施す行為を表すため、字義的な「投げた」ではなく、自然な日本語の「注いだ」とした。分詞と主動詞の関係は「注いだのは……ためだった」という構文で表した。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の発言に理由・説明を加える接続辞なので、現代日本語で説明の働きが明確な「というのも」とした。
- source_word: αὕτη
  choice: この人
  rationale: 指示代名詞の指示性を保ちつつ、女性を指すことが文脈から明らかなため、自然で敬意を損なわない「この人」とした。
- source_word: τὸ μύρον τοῦτο
  choice: この香油
  rationale: μύρονは香りのある油または軟膏を指す。聖書文脈で通じやすく、液体を注ぐ行為とも合う「香油」とした。
- source_word: ἐπὶ τοῦ σώματός μου
  choice: わたしの体に
  rationale: ἐπί＋属格が示す接触・位置を、簡潔で自然な日本語で表した。
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: わたしの埋葬の備えをするため
  rationale: πρός＋冠詞付き不定詞の目的を「ため」で表し、ἐνταφιάζωが単に埋める行為だけでなく、遺体を埋葬に向けて整えることを含む点を「埋葬の備え」で示した。
- source_word: ἐποίησεν
  choice: だったのです
  rationale: 直訳的な「彼女はした」を重ねると日本語では不自然になるため、「注いだのは……ためだったのです」という焦点構文に組み込み、行為と目的の関係および説明的な語調を保った。
theological_decisions:
- issue: ἐνταφιάζωとイエスの死との関係
  choice: 女性の行為を、イエスの埋葬に向けた備えとして述べる。
  alternative: 単に「わたしを葬るため」と訳し、備えの意味を明示しない。
  rationale: この動詞は埋葬そのものだけでなく、遺体を埋葬に向けて整えることを表し得る。本文ではその含意を明示する一方、女性自身の意図や理解の程度については断定していない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの説明としての重みを保つため「だったのです」とした。「この女」よりも現代語で自然かつ尊厳のある「この人」を採用した。
