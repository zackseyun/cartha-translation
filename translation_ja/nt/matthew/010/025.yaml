id: MAT.10.25
reference: Matthew 10:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the servant like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: ja
  text: 弟子にとっては、教師のようになることで十分であり、奴隷にとっては、主人のようになることで十分である。家の主人がベルゼブル[a]と呼ばれたのなら、その家の者たちはなおさらそう呼ばれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の呼び方では「ベルゼブブ」。
    reason: 伝統的に広く知られる異形を示しつつ、本文ではギリシア語本文のΒεελζεβούλに対応する形を採用するため。
lexical_decisions:
- source_word: ἀρκετὸν
  choice: 十分である
  rationale: 充足を表す述語形容詞。現代日本語で自然かつ簡潔に意味を保つ。
- source_word: μαθητῇ
  choice: 弟子
  rationale: 単なる学習者ではなく、教師に従って学ぶ関係を表す福音書の用法に適する。
- source_word: ἵνα γένηται
  choice: ようになれば
  rationale: ἀρκετόνに続くἵνα＋接続法が表す、十分とされる到達点を自然な条件表現で示す。
- source_word: διδάσκαλος
  choice: 教師
  rationale: μαθητήςとの対を明確にし、後続するκύριοςの『主人』と区別する。
- source_word: δοῦλος
  choice: 奴隷
  rationale: κύριοςとの身分上の対比が前面にあるため、拘束された従属関係を弱めずに表す。
- source_word: κύριος
  choice: 主人
  rationale: ここでは称号としての『主』よりも、奴隷に対する所有者・支配者という社会的意味が文脈に合う。
- source_word: οἰκοδεσπότην
  choice: 家の主人
  rationale: 家を治める者という複合語の意味を明瞭に表し、後の『その家の者たち』との連関も保つ。
- source_word: Βεελζεβοὺλ
  choice: ベルゼブル
  rationale: SBLGNTのギリシア語形を音写する。日本語で知られる別形は脚注に示す。
- source_word: ἐπεκάλεσαν
  choice: 呼ばれた
  rationale: 原文は能動形『彼らが呼んだ』だが、主語が明示されない日本語では受動形が自然で、侮蔑的な呼称を付けた意味を保てる。
- source_word: πόσῳ μᾶλλον
  choice: なおさら
  rationale: 小から大への論法を表す定型的で自然な日本語。
- source_word: οἰκιακοὺς
  choice: その家の者たち
  rationale: 奴隷だけに限定せず、家に属する人々を広く指す語義を保つ。
theological_decisions:
- issue: 家庭内の比喩におけるκύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: δοῦλοςとの対比、およびοἰκοδεσπότηςへ続く家庭・身分関係が中心であり、ここで明示されていないキリスト論的称号を訳文に持ち込まない。
- issue: δοῦλοςが示す身分
  choice: 奴隷
  alternative: しもべ
  rationale: 主人との身分的従属関係が論旨に重要であるため、拘束性を弱める可能性のある『しもべ』より『奴隷』を採る。
- issue: πόσῳ μᾶλλον以下の省略
  choice: 『呼ばれる』を補わず、省略を保つ
  alternative: その家の者たちは、なおさらそう呼ばれる
  rationale: 原文は比較節の述語を省略しており、意味は文脈から明らかである。日本語でも理解可能なので、修辞的な緊張と簡潔さを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。教師と弟子、主人と奴隷、家の主人と家の者という三つの対応関係が聞き取りやすいよう、語を統一した。
