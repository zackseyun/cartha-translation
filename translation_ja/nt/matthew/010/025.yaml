  naturalness: 「弟子にとっては、教師のようになることで十分であり」とすることで、ἀρκετὸν τῷ μαθητῇの与格に自然に対応する。末尾には「なおさらそう呼ばれる」を補い、日本語として完結した比較表現にするのが明瞭である。これは原文の意味を追加するのでなく、原文の修辞的省略を日本語で自然に表すものである。
