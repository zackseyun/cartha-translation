id: MAT.10.26
reference: Matthew 10:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: ja
  text: だから、彼らを恐れてはならない。覆われていて、明らかにされないものは何もなく、隠されていて、知られないものも何もないからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: だから、彼らを恐れてはならない
  rationale: οὖν の文脈上の帰結を「だから」で示し、禁止のアオリスト接続法を明確で格調ある禁止表現とした。αὐτούς は前後の文脈を保って「彼ら」とした。
- source_word: κεκαλυμμένον
  choice: 覆われているもの
  rationale: καλύπτω の被覆という比喩を保ち、対になる ἀποκαλυφθήσεται「明らかにされる」との語義的なつながりを示した。
- source_word: ἀποκαλυφθήσεται
  choice: 明らかにされない
  rationale: 未来受動の意味を保ちつつ、日本語では「明らかにされる」と自然に表した。否定関係は οὐδὲν ... ὃ οὐκ の構文に従った。
- source_word: κρυπτὸν ὃ οὐ γνωσθήσεται
  choice: 隠されているもので知られないものはない
  rationale: κρυπτός と γνωσθήσεται の対照を「隠されている」「知られる」で直接的に再現し、何が誰によって知られるかは原文同様に特定しなかった。
theological_decisions:
- issue: 隠された事柄が明らかになるという言明の主体と時点
  choice: 主体や時点を補わず、未来受動のまま訳す
  alternative: 「神が明らかにされる」「やがて公にされる」などと明示する
  rationale: 原文は行為主体と具体的時点を明示していないため、神学的な含意を訳文で限定せず、真正な曖昧さを保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「恐れてはならない」「ないからである」によって聖書本文にふさわしい落ち着いた格調を保った。二つの並行句の構造を揃え、原文の修辞的な均衡を反映した。
