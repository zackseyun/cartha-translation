  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: ja
  text: だから、恐れてはいけません。あなたがたは、たくさんの雀よりも価値があるのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: だから、恐れてはいけません
  rationale: οὖνが直前の、父なる神が雀さえ顧みておられるという論証からの帰結を示すため、「だから」とした。μὴと現在命令形φοβεῖσθεによる禁止は、自然で明瞭な現代日本語の「恐れてはいけません」と訳した。
- source_word: πολλῶν στρουθίων
  choice: たくさんの雀よりも
  rationale: στρουθίονは直前の10章29節と同じく雀を指す。属格はδιαφέρετεに伴う比較を表すので、「たくさんの雀よりも」とした。
- source_word: διαφέρετε
  choice: 価値がある
  rationale: ここでは単に「異なる」ではなく、価値や重要性においてまさるという意味。比較対象を「よりも」で明示し、日本語として自然な「価値がある」とした。
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された代名詞の強調と、弟子たちへの複数の呼びかけを保つため、「あなたがたは」とした。
theological_decisions:
- issue: 弟子たちと雀との相対的な価値
  choice: あなたがたは、たくさんの雀よりも価値があるのです
  alternative: あなたがたは、たくさんの雀よりも大切なのです
  rationale: διαφέρετεの比較的な価値の意味を明示しつつ、神が雀を顧みないという含意は持ち込まない。文脈では、雀をも顧みる父が弟子たちをなおさら顧みるという論旨である。
translation_notes:
  register: 明瞭で現代的な敬体を用いた。「だから」で前節までとの論理的つながりを自然に示し、「価値があるのです」で説明的な結びとした。原文に本文異読や、注記を要するほどの意味上の曖昧さはないため、脚注は付していない。
