  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: ja
  text: その家に入るときは、その家[a]にあいさつしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その家の人々に」。ギリシア語は直訳すると「その家にあいさつしなさい」であり、「家」はそこに住む人々を指していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: 入るときは
  rationale: 現在分詞の副詞的用法を時間節として訳した。命令の相手が家に入る際の行為を、自然な現代日本語で表す。
- source_word: δὲ
  choice: は（構文に吸収）
  rationale: 弱い接続を示す語であり、ここでは「入るときは」という話題提示の構文に談話上の働きを吸収した。強い逆接にはしない。
- source_word: οἰκίαν
  choice: その家
  rationale: 建物としての家と、そこに住む家の者たちの双方を指し得る。入るという文脈に即して本文では具体的な「家」とし、換喩的な意味は脚注で示す。
- source_word: ἀσπάσασθε
  choice: あいさつしなさい
  rationale: アオリスト中動態命令法二人称複数。現代の読者に明瞭で、直接的な命令として自然に伝わる表現を選んだ。
- source_word: αὐτήν
  choice: その家に
  rationale: 女性単数代名詞でοἰκίανを受ける。日本語では「それに」より名詞を反復する方が明瞭であり、原文が家を文法上の対象としている点も保てる。
theological_decisions:
- issue: 家そのものへのあいさつという表現と、住人へのあいさつという換喩との関係
  choice: 本文では「その家にあいさつしなさい」とし、原文の換喩を保つ
  alternative: 「その家の人々にあいさつしなさい」
  rationale: 原文のαὐτήνはοἰκίανを受けており、明示的には「家」を対象とする。実際には住人を指す可能性が高いが、その解釈を本文で確定せず脚注に置くことで、原文の表現と含意をともに保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「その家」を反復して指示対象を明確にしつつ、命令文には簡潔で品位のある「〜しなさい」を採用した。
