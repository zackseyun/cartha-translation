id: MAT.10.38
reference: Matthew 10:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: ja
  text: また、自分の十字架を負って、わたしの後について来ない者は、わたしにふさわしくない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの後について来る」は、単に「わたしについて来る」とも訳せる。ギリシア語は直訳すると「わたしの後ろに従う」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 者
  rationale: 不定・一般的な関係表現を、日本語では「…ない者」とすることで自然かつ簡潔に表した。性別を限定せず、個々の弟子に当てはまる。
- source_word: λαμβάνει
  choice: 負って
  rationale: 十字架については、日本語の聖書的・一般的表現である「十字架を負う」が、単に手に取ることではなく、自ら引き受けるという文脈上の意味をよく伝える。
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: 自分の十字架
  rationale: αὐτοῦは一般的な単数の各人を指すため、日本語では「自分の」が最も自然で、各弟子が自らの十字架を負うという個別性も保つ。
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: わたしの後について来ない
  rationale: ἀκολουθεῖだけでなくὀπίσω μουの「わたしの後ろに」という要素も、「わたしの後について来る」によって明示した。
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: わたしにふさわしくない
  rationale: ἄξιοςと属格μουの関係を直接的かつ自然に表し、弟子としての適格性をめぐる厳粛な評価を保った。
theological_decisions:
- issue: 十字架を負うという弟子道の比喩
  choice: 具体的な「自分の十字架を負う」という像を保持した。
  alternative: 「苦しみを受け入れる」「自己を捨てる」などと説明的に訳す。
  rationale: 原文の十字架という歴史的で強烈な像を抽象化せず、イエスに従うことに伴う苦難、恥、死への覚悟を含み得る緊張を残すため。
- issue: αὐτοῦの一般的男性単数
  choice: 「自分の」と訳した。
  alternative: 「彼の」と訳し、注で一般的用法を説明する。
  rationale: 日本語の「彼の」は男性に限定する印象が強く、一般的な各人を指す原文の機能をかえって損ない得る。「自分の」は単数の個別性と再帰的関係を自然に保持する。
- issue: 「わたしの後に」の明示
  choice: 「わたしの後について来る」と訳した。
  alternative: 簡潔に「わたしについて来る」と訳す。
  rationale: ὀπίσω μουを反映し、イエスが先に立ち、弟子がその後に従うという位置関係と弟子道の像を保つため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な弟子道の要求にふさわしい格調を保った。「十字架を負う」は定着した自然な表現であり、原文の具体的な像を保持する。冒頭のκαίは前文との連続を示すため「また」とした。
