  terminology: 「十字架」「負う」「わたし」「ふさわしくない」は福音書の文脈に適した一貫した用語である。「自分の」は、原文の男性単数が一般的・代表的に用いられている機能を、日本語で不必要に性別限定せず自然に伝えている。脚注もὀπίσω μουを補う訳語上の選択を正確に説明している。
