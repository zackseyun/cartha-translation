  source_fidelity: 原文の不定・一般的関係表現ὃςを「…ない者」と適切に表し、λαμβάνει τὸν σταυρὸν αὐτοῦは定着した文脈的に正確な「自分の十字架を負って」と訳している。ἀκολουθεῖ ὀπίσω μουの「後に従う」要素も「わたしの後について来る」に保持され、οὐκ ἔστιν μου ἄξιοςも「わたしにふさわしくない」と忠実である。冒頭のκαίを「また」とすることも、前節との付加的連続を自然に示す範囲で問題ない。
