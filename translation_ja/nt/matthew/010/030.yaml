  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: ja
  text: しかし、あなたがたの髪の毛さえ、一本残らず数えられています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「すでに数えられています」。ギリシア語の完了受動形は、行為が完了し、その結果が今も続いていることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: 二人称複数属格を、現代日本語で自然な複数の所有表現として訳した。
- source_word: δὲ
  choice: しかし
  rationale: 前後の文脈にある穏やかな対照を示す。
- source_word: καὶ
  choice: さえ
  rationale: 小さなものにまで及ぶことを強調する用法を自然な日本語で表した。
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: 髪の毛
  rationale: 直訳的な「頭の毛」より自然で明瞭な現代日本語とし、指示対象を保った。
- source_word: πᾶσαι
  choice: 一本残らず
  rationale: 個々の髪の毛を含む全体性を、日本語で具体的かつ自然に強調した。
- source_word: ἠριθμημέναι εἰσίν
  choice: 数えられています
  rationale: 完了受動の、数え終えられた結果が現在も続く状態を自然に表した。
theological_decisions:
- issue: この言葉が示唆する神の知識と配慮の範囲
  choice: 髪の毛がすべて数えられているという具体的な表現をそのまま保つ。
  alternative: 神の摂理や守りを明示する説明的な訳。
  rationale: 本文自体が語る具体的な比喩を維持し、神学的含意は文脈から読み取れるようにした。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「一本残らず」により πᾶσαι の包括性を伝えつつ、簡潔で品位ある語調を保った。
