id: MAT.10.10
reference: Matthew 10:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: ja
  text: 旅用の袋も、下着を二枚も、履き物も、杖も[a]持って行ってはならない。働く者は自分の食べ物を得るにふさわしいからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: マルコ6:8では杖一本を持つことが許されているため、ここは「予備の杖」を持つことの禁止だと理解する人もいる。
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: 旅のための袋
  rationale: 旅先で食料などを携える袋を指す。単なる「袋」より用途が明確で、原文の旅行文脈を自然な日本語で表す。
- source_word: εἰς ὁδὸν
  choice: 旅のための
  rationale: 旅に携えて行く物という意味を簡潔に表し、「袋」に自然に係る形とした。
- source_word: δύο χιτῶνας
  choice: 下着を二枚
  rationale: χιτώνは体に直接着る基本的な衣服を指す。「下着」は現代日本語で理解しやすいが、現代的な肌着だけに限定されない古代の衣服であることは文脈上保たれる。
- source_word: ὑποδήματα
  choice: 履き物
  rationale: 足の下に結び付ける物を広く指す語である。古代の実物としてはサンダルが典型的だが、「履き物」は原語の範囲を狭めず自然である。
- source_word: ῥάβδον
  choice: 杖
  rationale: 旅人が用いる杖を自然かつ簡潔に表す。マルコ6:8との違いを本文で調和させず、マタイの禁止をそのまま残す。
- source_word: ἄξιος
  choice: 受けるのは当然
  rationale: 直訳的な「価する」より自然な日本語で、働く者には食物を受ける正当な資格があるという評価的意味を表す。
- source_word: ὁ ἐργάτης
  choice: 働く者
  rationale: 宣教者に限定する専門用語を持ち込まず、一般的で明瞭な表現とした。
- source_word: τῆς τροφῆς αὐτοῦ
  choice: 食べ物を受ける
  rationale: τροφήの具体的な意味である食物を保つ。属格を日本語では受給の構文にして、「支援」などの広い解釈を本文へ持ち込まない。
theological_decisions:
- issue: 並行記事で許される旅支度との潜在的な調和
  choice: マタイ本文どおり「杖も」禁止品に含める。
  alternative: マルコ6:8を踏まえ、「予備の杖」を禁じたと解する。
  rationale: ギリシア語本文はῥάβδονを禁止品として明記し、「予備の」に相当する語はない。福音書間の緊張を訳文で解消せず、別解を脚注で示す。
translation_notes:
  register: 明瞭で現代的ながら、命令と格言の重みを保つ文体。「持って行ってはならない」でμήの禁止を明示した。脚注記号は節末に置き、杖に関する本文上の緊張を注で扱う。
