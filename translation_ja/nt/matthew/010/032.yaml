id: MAT.10.32
reference: Matthew 10:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: ja
  text: ですから、だれでも人々の前でわたしを認めるなら、わたしも天におられるわたしの父の前で、その人を認めます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その人を」に当たるギリシア語は、直訳すれば「その人にあって」または「その人について」。ここでは前半の「わたしを認める」と対応する自然な日本語にした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: ですから、だれでも…なら
  rationale: 一般化を表すΠᾶς…ὅστιςを自然な日本語の条件表現とし、οὖνの推論的なつながりを「ですから」で保った。
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: わたしを認める
  rationale: ὁμολογέωはここで、人前でイエスとの関係を公に認める意味。「告白する」より現代日本語で自然な「認める」とし、ἐν ἐμοὶはこの構文の対象を示すものとして訳した。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 人々の前で
  rationale: ἄνθρωποιはここでは性別を限定せず人間一般を指すため、「人々」とした。ἔμπροσθενの公然性は「前で」で表した。
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: わたしも…その人を認めます
  rationale: 最初のὁμολογέωとの対応を保って同じ「認める」を用い、κἀγώの強調を「わたしも」で示した。ἐν αὐτῷは自然な日本語では対象を示す「その人を」としたが、前置詞を含む原文の形は注記した。
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 天におられるわたしの父
  rationale: マタイに特徴的な表現を、尊厳があり自然な現代日本語で訳した。複数形οὐρανοῖςは日本語の通常の聖書表現に従い「天」とした。
theological_decisions:
- issue: イエスを公に認める者を、イエスも父の前で認めるという相互性
  choice: 父の前でのイエスの応答を約束として直接表現する。
  alternative: 終末の裁判に限定する、または現在の弟子としての承認に限定する。
  rationale: 本文は時点や救済の仕組みを明示せず、相互に「認める」ことを述べる。そのため、終末論的・教会論的な限定を訳文に持ち込まない。
- issue: ὁμολογέωの宗教的含意
  choice: 「認める」と訳し、公然たる承認という意味を保つ。
  alternative: 「告白する」「信仰を言い表す」「味方であると言う」。
  rationale: 「認める」は相互に用いられた同一動詞を自然に再現しつつ、特定の儀式や教派的な信仰告白に意味を限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの発言として丁寧体を用い、「父」は神を指す呼称として表記した。
