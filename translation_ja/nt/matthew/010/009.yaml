  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: ja
  text: 自分たちの腰帯に入れるための金も銀も銅も、手に入れてはならない。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時、腰帯は金銭を入れて携帯するためにも用いられた。
    reason: cultural_note
  - marker: b
    text: 「銅」は「青銅」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: 手に入れてはならない
  rationale: κτάομαιの「獲得する、手に入れる」という意味を保ち、単に携帯することを禁じる表現にはしない。文脈に合う明快な禁止表現とした。
- source_word: χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν
  choice: 金も銀も銅貨も
  rationale: 金・銀は貨幣として用いる素材名をそのまま訳し、χαλκόςはこの貨幣の列挙では低額の銅貨を指すことが明瞭になるよう「銅貨」とした。
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: 腰帯に入れるために
  rationale: εἰςの方向・目的の含みと、ζώνηが金銭をしまう腰帯であった文化的背景を、過度に説明的にならない自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、命令の厳粛さを保つ文体。「持って行ってはならない」ではなく「手に入れてはならない」とし、原文のκτάομαιの語義を保持した。
