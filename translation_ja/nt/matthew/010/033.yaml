id: MAT.10.33
reference: Matthew 10:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: ja
  text: しかし、人々の前でわたしを否む[a]者がだれであっても、わたしも天[b]におられるわたしの父の前で、その人を否む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「否む」は、「自分はその人を知らない、またはその人と関係がないと公に言う」という意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「天々」。ギリシャ語は複数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: しかし、…者がだれであっても
  rationale: δέによる前節との対比と、ὅστις＋ἄν＋接続法が表す一般的・包括的な条件を、自然な現代日本語で示した。
- source_word: ἀρνήσηταί … ἀρνήσομαι
  choice: 否む…否む
  rationale: 同じ動詞ἀρνέομαιの反復を同じ日本語で表し、イエスを公に認めないことと、それに対応する否認との修辞的な対称性を保った。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 人々の前で
  rationale: ἔμπροσθενの公然性・面前性を「前で」で表し、ἀνθρώπωνは文脈上、人間一般を指すため「人々」とした。
- source_word: κἀγὼ αὐτὸν
  choice: わたしも…その人を
  rationale: κἀγώの対応を示す「わたしも」を保持し、αὐτόνは日本語として自然で、一般条件の指示対象を明確にする「その人」とした。
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 天におられるわたしの父
  rationale: 所有関係と関係節を明示しつつ、οὐρανοῖςの複数形は日本語の慣用に従って本文では「天」とした。
theological_decisions:
- issue: 相互に対応する否認の表現
  choice: わたしを否む…わたしも…その人を否む
  alternative: わたしとの関係を否定する…わたしもその人との関係を否定する
  rationale: 原文が同じἀρνέομαιを反復して生む厳粛な対応関係を保ち、否認の性質や最終的帰結を本文以上に説明しないようにした。
- issue: ἀνθρώπωνとαὐτόνの性の表現
  choice: 人々…その人
  alternative: 男たち…彼
  rationale: ここでἀνθρώπωνは人間一般を指し、αὐτόνはその一般条件に該当する者を受ける。日本語では文法的男性形を機械的に再現せず、指示範囲を正確かつ自然に表した。
translation_notes:
  register: 明瞭で厳粛な現代標準日本語とした。「おられる」は父への敬意を自然に示し、「否む」の反復によって原文の簡潔さと緊張感を保った。
