source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: ja
  text: というのも、わたしが来たのは、男をその父に対立させ[a]、娘をその母に対立させ、息子の妻[b]をそのしゅうとめに対立させるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「分裂させる」。ギリシア語は「分ける、分裂させる」という意味を持つが、続く反復的な「…に対して」という表現は、家族関係における対立を具体的に示している。
    reason: lexical_alternative
  - marker: b
    text: 「息子の妻」に当たるギリシア語は、文脈によって「花嫁」を意味することもある。しかし、ここでは「しゅうとめ」と対になっているため、「息子の妻」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: わたしが来た
  rationale: アオリスト直説法を、イエスの到来と使命を指す自然な日本語として訳した。
- source_word: γὰρ
  choice: だからである
  rationale: 直前の発言を説明する接続の働きを、文末の説明表現で明示した。
- source_word: διχάσαι
  choice: 逆らわせる
  rationale: 基本義は「分ける、分裂させる」だが、後続する反復的な κατά＋属格が人間関係上の対立を示すため、その作用を自然な日本語で表した。別訳は脚注に残した。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ここでは父との関係に置かれた男性を指しうるが、日本語の「人」は性別を限定せずとも原文の対人関係を自然に表せる。続く「娘」「嫁」により家庭内の対比も明確である。
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: その父に逆らわせ
  rationale: κατά＋属格の対立的意味を、「父に逆らう」という自然で明確な日本語にした。
- source_word: θυγατέρα
  choice: 娘
  rationale: 直接的で自然な対応語。
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: その母に逆らわせ
  rationale: 反復される対立構文を保ち、第一の句と同じ形で訳した。
- source_word: νύμφην
  choice: 嫁
  rationale: νύμφη は「花嫁」の意味も持つが、ここでは πενθερά と対になっており、婚姻による親族としての「嫁」を意味する。
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: そのしゅうとめに逆らわせる
  rationale: 婚姻関係にある女性側の親族語として、現代日本語で理解しやすい「しゅうとめ」を用い、対立構文を維持した。
theological_decisions:
- issue: イエスの到来の目的と家族内対立との関係
  choice: 「逆らわせるため」として、イエスの到来がもたらす家族内の対立という厳しい表現を保持する。
  alternative: 「分裂が生じるため」または、イエスへの忠誠によって迫害が起こると説明的に言い換える。
  rationale: 原文は目的を表す不定詞を用いており、その鋭さを弱めるべきではない。一方、対立を究極的な善として喜ぶという解釈や、迫害についての補足説明は本文に持ち込まず、神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宣言の厳粛さと三つの並行句を保った。「姑」は読みが難しい場合があるため、本文では「しゅうとめ」と平仮名で表記した。
