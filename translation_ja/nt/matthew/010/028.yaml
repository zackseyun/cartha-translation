id: MAT.10.28
reference: Matthew 10:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: ja
  text: また、体は殺しても、魂は殺せない者たちを恐れてはならない。むしろ、魂も体もゲヘナ[a]で滅ぼすことのできる者を恐れなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地獄で」。ギリシア語は「ゲヘナ」。ヒノムの谷に由来し、最終的な裁きの場所を指す語として用いられた。
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: 恐れてはならない／恐れなさい
  rationale: 同じ動詞が対照的に反復されているため、日本語でも「恐れる」を一貫して用い、警告の力と対比を保った。
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: 殺す者たち
  rationale: 冠詞付き現在分詞の一般的な類別を、自然な現代日本語で表した。
- source_word: σῶμα
  choice: 体
  rationale: 身体を指す標準的で明快な訳語。
- source_word: ψυχήν
  choice: 魂
  rationale: ここでは「体」と明確に対置されているため、「命」よりもその対比を保つ「魂」が適切。
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: 殺すことのできない
  rationale: 能力がないことを示す分詞構文を明確に表した。
- source_word: μᾶλλον
  choice: むしろ
  rationale: 前の命令を退け、別の対象を恐れるよう促す対照と修正の働きを自然に示す。
- source_word: τὸν δυνάμενον
  choice: ことのできる方
  rationale: 単数の実体詞的分詞を訳しつつ、本文が明示していない指示対象を「神」や「サタン」と断定しない。「方」は畏敬を伴う文脈に自然だが、固有の同定までは加えない。
- source_word: ἀπολέσαι
  choice: 滅ぼす
  rationale: 決定的な破滅または裁きを表す語の重みを保ち、その具体的なあり方は過度に規定しない。
- source_word: ἐν γεέννῃ
  choice: ゲヘナで
  rationale: ギリシア語の固有の背景を持つ語を音写し、後代の「地獄」という語に伴う観念を本文へ直接持ち込まない。
theological_decisions:
- issue: 「魂も体もゲヘナで滅ぼすことのできる方」の指示対象
  choice: 本文では「方」とし、明示的に同定しない
  alternative: 神／サタン
  rationale: 文脈上は最終的な裁きの権威を持つ神を指すのが最も自然だが、ギリシア語本文自体は名を挙げていないため、翻訳ではその余地を保った。
- issue: γέενναの訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: 原語のユダヤ的・第二神殿期的背景を保つため音写し、一般的な解釈的対応語「地獄」は脚注に示した。
translation_notes:
  register: 明快な現代標準語としつつ、命令の厳粛さを保った。「肉体」ではなく日常的で分かりやすい「体」を用い、「魂」との対照を明瞭にした。脚注記号[a]は本文中に配置した。
