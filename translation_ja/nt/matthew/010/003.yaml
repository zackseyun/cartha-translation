lexical_decisions:
- source_word: Φίλιππος
  choice: フィリポ
  rationale: 新約聖書の人名として日本語で広く定着した音写を用いた。
- source_word: Βαρθολομαῖος
  choice: バルトロマイ
  rationale: 日本語聖書で定着した、原語名に対応する音写を用いた。
- source_word: Θωμᾶς
  choice: トマス
  rationale: 現代日本語で自然かつ広く認知される音写を用いた。
- source_word: Μαθθαῖος
  choice: マタイ
  rationale: 日本語聖書で定着した人名表記を採用した。
- source_word: ὁ τελώνης
  choice: 徴税人
  rationale: 税や通行税を徴収する者を指す語であり、古風な語を避けつつ当時の職務を簡潔に示す。
- source_word: Ἰάκωβος
  choice: ヤコブ
  rationale: Ἰάκωβοςに対応する日本語聖書の慣用的な人名表記を用いた。
- source_word: ὁ τοῦ Ἁλφαίου
  choice: アルファイの子
  rationale: 原文で省略されている親子関係を、日本語で明瞭かつ自然に表した。
- source_word: Θαδδαῖος
  choice: タダイ
  rationale: SBLGNT本文の読みを音写し、異読は脚注に残した。
- source_word: καὶ
  choice: と
  rationale: 使徒名を二人ずつ結ぶ原文の並列構造を、簡潔で自然な日本語として保持した。
theological_decisions:
- issue: 名簿末尾の使徒の同定
  choice: タダイ
  alternative: レビバイ（または「タダイと呼ばれるレビバイ」）、ヤコブの子ユダ
  rationale: 提示されたSBLGNT本文はΘαδδαῖοςと読むため、本文では「タダイ」とした。写本異読およびルカの対応する使徒名簿との差異は調和させず、脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。名簿の簡潔な並列を保ち、「徴税人」はマタイを特定する同格的な肩書きとして人名の前に置いた。脚注記号[a]は異読に関係する「バルトロマイ」の直後ではなく、英語監査層の指定に合わせて同位置に置かれているが、脚注内容自体は節末の「タダイ」に関するものである。
