base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: ja
  text: フィリポとバルトロマイ、トマスと徴税人マタイ、アルパヨの子ヤコブとタダイ[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、この名を「レバイ」（または「タダイと呼ばれるレバイ」）としている。また、ルカの使徒名簿では、対応する箇所に「ヤコブの子ユダ」とある。
