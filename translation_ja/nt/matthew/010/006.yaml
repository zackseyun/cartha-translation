  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: ja
  text: むしろ、イスラエルの家の失われた羊たちのところへ行きなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「むしろ、イスラエルの家から失われた羊たちのところへ行きなさい。」
    reason: 「イスラエルの家」が羊の所属を示すのか、羊がそこから失われたことを示すのかについて、原文が許す別の係り方を示すため。
lexical_decisions:
- source_word: πορεύεσθε
  choice: 行きなさい
  rationale: 現在命令形の二人称複数。弟子たちへの指示として、現代日本語で自然かつ明確な命令表現とした。
- source_word: δὲ μᾶλλον
  choice: むしろ
  rationale: 直前の異邦人やサマリア人の町へ行くなという禁止を受け、行き先を対照的に示す。「しかし、むしろ」では日本語として重いため、「むしろ」で対比と方向転換を表した。
- source_word: πρὸς
  choice: ～のところへ
  rationale: 移動の目的地を示す。羊を人々の比喩として用いているため、「～へ」だけでなく「～のところへ」として自然な日本語にした。
- source_word: τὰ πρόβατα
  choice: 羊たち
  rationale: 原文の明示的な羊の比喩を保持する。複数性を自然に伝え、対象が人々であることにもなじむ表現とした。
- source_word: τὰ ἀπολωλότα
  choice: 失われた
  rationale: ἀπόλλυμιの完了分詞で、羊の比喩の中では「失われた」が文脈に適する。滅亡したと断定したり、「迷った」と解釈を狭めたりしない。
- source_word: οἴκου Ἰσραήλ
  choice: イスラエルの家
  rationale: 聖書的・共同体的な響きを持つ属格表現を保ち、「イスラエルの民」と説明的に言い換えない。
theological_decisions:
- issue: イスラエルを羊にたとえる比喩
  choice: 「イスラエルの家の失われた羊たち」という比喩を本文に保持する。
  alternative: 「道を外れたイスラエルの民」などと説明的に訳す。
  rationale: 羊の比喩は原文に明示され、旧約聖書の牧者・羊のイメージとの文学的、神学的連続性があるため、解釈的な言い換えを避けた。
- issue: 属格 οἴκου Ἰσραήλ の係り方
  choice: 本文では、失われた羊たちがイスラエルの家に属するという通常の読みを採用する。
  alternative: イスラエルの家から失われた羊たち。
  rationale: ギリシア語は後者の理解も文法的に許しうるため、本文では自然な主要読解を示しつつ、脚注で真正な曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「イスラエルの家」と羊の比喩は聖書的な響きを保つため維持し、「むしろ」で前節との対照を簡潔に表した。
