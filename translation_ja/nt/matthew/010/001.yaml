id: MAT.10.1
reference: Matthew 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: ja
  text: イエスは十二人の弟子を呼び寄せ、彼らが汚れた霊を追い出し、あらゆる病気とあらゆる患いを癒やせるように、汚れた霊に対する権威をお与えになった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: 中動態を含む「自分のもとに呼ぶ」という意味を、自然で簡潔な現代日本語で表した。アオリスト分詞と主動詞の時間関係は文脈上明らかなため、明示的な「後で」は加えない。
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: 十二人の弟子
  rationale: μαθητήςは福音書の文脈で定着した「弟子」とし、αὐτοῦは日本語では主語のイエスとの関係が明白なので冗長な「ご自分の」を避けた。
- source_word: ἔδωκεν αὐτοῖς
  choice: 彼らにお与えになった
  rationale: δίδωμιの基本義「与える」を保ち、イエスを主語とする叙述にふさわしい敬語を用いた。
- source_word: ἐξουσίαν πνευμάτων ἀκαθάρτων
  choice: 汚れた霊を追い出し……権威
  rationale: ἐξουσίαは単なる能力よりも、行為する資格・権能を表すため「権威」とした。属格句と後続の不定詞を、日本語では権威の内容として自然にまとめた。
- source_word: ἐκβάλλειν αὐτά
  choice: 追い出し
  rationale: 悪霊追放の文脈に合う、一般読者にも明瞭な表現。「それらを」に当たる代名詞は「汚れた霊」が直前にあるため反復しなかった。
- source_word: θεραπεύειν
  choice: 癒やす
  rationale: 病者を治す意味を表しつつ、福音書の文体にふさわしい「癒やす」を採用した。
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: あらゆる病気や患い
  rationale: νόσοςとμαλακίαという近接した二語を「病気」「患い」と訳し分け、包括性と語の重なりを保った。ギリシア語の反復されたπᾶσανは、日本語では一つの「あらゆる」で両語に自然に掛けた。
theological_decisions:
- issue: 弟子たちに与えられたものの性質
  choice: 権威
  alternative: 力
  rationale: ἐξουσίαはここで、イエスから委ねられた支配権・行為する権能を示す。「力」だけでは物理的・霊的能力に狭める可能性がある。
- issue: ὥστε＋不定詞の目的・結果の幅
  choice: 「追い出し……癒やす権威」として権威の具体的内容を示す
  alternative: 「その結果」「～するために」と明示する
  rationale: ὥστεは目的と結果の両面を帯び得るため、どちらか一方に限定せず、日本語でその権威が何を可能にするかを自然に表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「お与えになった」は主語であるイエスへの自然な敬意を示す。二つの病患語は同義語として潰さず訳し分けた。
