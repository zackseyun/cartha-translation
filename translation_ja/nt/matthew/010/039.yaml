id: MAT.10.39
reference: Matthew 10:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: ja
  text: 自分のいのちを得る者は、それを失い、わたしのために自分のいのちを失う者は、それを得る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのち」は「魂」とも訳せる。ギリシア語の ψυχή は「いのち」と「魂」のどちらも意味し得るが、ここでは弟子としていのちを失い、また得るという文脈から「いのち」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: 得ようとする者
  rationale: 定冠詞付きアオリスト分詞は一般的な人を指す。直訳の「見いだす者」では日本語で意図が不明瞭になりやすいため、この文脈では自分のいのちを確保しようとする含意を自然に表した。
- source_word: ψυχὴν
  choice: いのち
  rationale: ここでの ψυχή は、肉体と区別された抽象的な「魂」よりも、弟子として差し出す、または保とうとする自分の生命・存在を指す。「いのち」は文脈と逆説に最もよく合う。
- source_word: ἀπολέσει / ὁ ἀπολέσας
  choice: 失い／失う者
  rationale: ἀπόλλυμι はここでは滅ぼすことより喪失を表す。同じ語根を同じ「失う」で訳し、前後の対応を保った。
- source_word: ἕνεκεν ἐμοῦ
  choice: わたしのために
  rationale: 原因・理由または動機を示し、イエスへの忠誠ゆえの喪失を簡潔かつ自然に表す。
- source_word: εὑρήσει
  choice: 得る
  rationale: 日本語の「いのちを見いだす」は不自然になりやすいため「得る」とした。冒頭も同じ動詞にそろえ、εὑρίσκω の反復による修辞的対応を保った。
- source_word: αὐτοῦ / αὐτήν
  choice: 自分の／それを
  rationale: ギリシア語の代表的単数を、日本語で自然な一般表現として保持した。
theological_decisions:
- issue: 弟子としての逆説における ψυχή の訳
  choice: いのち
  alternative: 魂
  rationale: この節は、イエスへの忠誠のために自分の生命を保つか失うかという逆説を述べている。「魂」だけに限定せず、生命と自己存在の広がりを持つ「いのち」とした。ただし原語には「魂」の意味域もあるため脚注に残した。
- issue: εὑρίσκω を「得る」と訳すこと
  choice: 得る／得ようとする
  alternative: 見いだす
  rationale: 原語の「見いだす」を機械的に移すと日本語では意味が取りにくい。自分のいのちを確保しようとする者と、最終的にそれを得る者との逆説を自然に伝えつつ、両句を同じ語で対応させた。
translation_notes:
  register: 明快な現代標準日本語を用い、格調を保ちつつ古風な「己」「命を見いだす」は避けた。「いのち」は語の広がりと聖書的な響きを保つため、ひらがな表記とした。
