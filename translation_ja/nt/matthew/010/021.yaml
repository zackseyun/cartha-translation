id: MAT.10.21
reference: Matthew 10:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: ja
  text: 兄弟が兄弟を死に至るように引き渡し[a]、父が子を死に至るように引き渡す。また、子どもたちは親に立ち向かい、親を死に至らせる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「引き渡す」とも訳せる。この動詞は、背信を伴う文脈では「裏切る」という意味を帯びることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: 死に渡し／死に渡す
  rationale: 人を敵対者の手に引き渡し、その結果として死に至らせることを表す。「裏切る」と限定せず、具体的な引き渡しの意味を保った。後半の「父がその子を」には、ギリシア語で省略された動詞を日本語で補った。
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: 兄弟が兄弟を
  rationale: 男性のきょうだいを指す語の反復を保ち、家族内の対立を明確にした。
- source_word: εἰς θάνατον
  choice: 死に
  rationale: 引き渡しの結果または目的が死であることを簡潔に表した。
- source_word: πατὴρ τέκνον
  choice: 父がその子を
  rationale: τέκνονは性別を限定しないため「子」とし、自然な日本語になるよう所有関係を示す「その」を補った。
- source_word: ἐπαναστήσονται
  choice: 逆らって立ち上がり
  rationale: 敵対して立ち上がるという動詞の比喩的な力を保ちつつ、現代日本語で意味が明瞭になるよう「逆らって」を添えた。
- source_word: τέκνα
  choice: 子どもたち
  rationale: 性別を限定しない複数形を自然に表した。
- source_word: ἐπὶ γονεῖς
  choice: 親に逆らって
  rationale: 敵対を表すἐπίの意味を「逆らって」で明示した。γονεῖςは父母を含む「親」とした。
- source_word: θανατώσουσιν
  choice: 死なせる
  rationale: 意図的に死に至らせる意味を表す。直接殺す場合だけでなく、処刑させる可能性も残すため「殺す」より広い表現を選んだ。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 直前の「親」を受ける代名詞として、原文の流れを保った。
theological_decisions:
- issue: 家族関係を表す語の性別と範囲
  choice: ἀδελφόςは「兄弟」、τέκναとγονεῖςはそれぞれ「子どもたち」「親」と訳す
  alternative: ἀδελφόςも包括的に「きょうだい」と訳す
  rationale: ἀδελφόςの男性を指す語義を保つ一方、τέκναとγονεῖςには原文以上の性別限定を加えない。
- issue: θανατόωが示す死のもたらし方
  choice: 「死なせる」として直接殺害と権力への引き渡しの双方を許容する
  alternative: 「殺す」または「処刑させる」と限定する
  rationale: 文脈上、家族による告発や引き渡しを通した死も考えられるため、原文が特定しない手段を限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、家族同士が死に渡すという厳粛さと、原文の反復・緊張感を保った。
