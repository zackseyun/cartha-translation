  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: ja
  text: どの町や村に入っても、そこにいる、ふさわしい人が誰かをよく調べなさい[a][b]。そして、そこを出るまで、そこにとどまりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「よく調べなさい」は、「尋ねなさい」「調査しなさい」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここで「ふさわしい人」とは、神の好意を受けるに値する功績のある人というより、使者たちを迎えるのに適した、または彼らを受け入れる人を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: どの町や村に入っても
  rationale: εἰς の方向性と、ἄνを伴う不定関係節の「どの場所であっても」という意味を、自然な日本語の条件的表現で示した。πόλις と κώμηの区別は「町」と「村」で表した。
- source_word: ἐξετάσατε
  choice: よく調べなさい
  rationale: 単に尋ねるだけでなく、注意深く問い合わせて見定めるという命令の力を表す。「探し出しなさい」よりも手段を限定せず、現代日本語として明瞭である。
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: そこに誰かふさわしい人がいるか
  rationale: τίς の問いと、町または村の中にいる人物という関係を保った。ἄξιος は文脈上、使者を迎えるのに適した者という意味を持ちうるため、「価値がある」や「立派な」ではなく「ふさわしい」とした。
- source_word: κἀκεῖ μείνατε
  choice: そして、そこにとどまりなさい
  rationale: κἀκεῖの接続辞καίと場所副詞ἐκεῖをともに表し、滞在先を次々に変えないようにという命令を簡潔に伝える。原文の「そこ」が具体的に家、人のもと、またはその場所のどれを指すかを本文で過度に限定しない。
- source_word: ἕως ἂν ἐξέλθητε
  choice: そこを出るまで
  rationale: ἕως ἄνと接続法が示す将来の退出時点までの継続を自然に表した。日本語では目的地を明示しなくても、直前の町または村から出る意味が通じる。
theological_decisions:
- issue: 宣教の指示におけるἄξιοςの意味
  choice: 「ふさわしい」と訳し、使者を迎えるのに適した、または受け入れる人という文脈的意味を保つ。
  alternative: 道徳的に「立派な人」「値する人」と訳す。
  rationale: この箇所は弟子たちが滞在先を見定める場面であり、救いや神の恵みを獲得する功績を論じてはいない。ただしἄξιοςの評価的な響きを消し切らないため、本文では説明的に「受け入れてくれる人」と置き換えず、「ふさわしい」を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令文には簡潔で品位のある「〜なさい」を採用した。「そこ」の反復は原文の場所指示を保ち、滞在先について原文以上に具体化しないため意図的に残した。
