source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: ja
  text: 父または母をわたしよりも愛する者は、わたしにふさわしくない。[a] また、息子または娘をわたしよりも愛する者は、わたしにふさわしくない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたし以上に」。ギリシャ語の表現は、イエスよりも他者を優先して愛することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: 愛する者
  rationale: 定冠詞を伴う現在分詞を、継続的・特徴的な行為をする人を表す一般的な言い方として簡潔に訳した。
- source_word: πατέρα ἢ μητέρα
  choice: 父や母
  rationale: ギリシャ語には所有代名詞がないため「自分の」を補わず、親族名称を自然な日本語で表した。選択肢を列挙するἢは、この文脈では「や」が自然である。
- source_word: ὑπὲρ ἐμέ
  choice: わたしよりも
  rationale: 比較を表すὑπέρを、イエス以上に相手を愛するという優先順位が明確になる現代日本語で表した。
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: わたしにふさわしくない
  rationale: ἄξιοςと属格μουの関係を自然な日本語で保持しつつ、「わたしのものとなる資格がない」などの解釈的な補足は避けた。
- source_word: καὶ
  choice: また
  rationale: 二つの平行文を結ぶ接続を、現代日本語で滑らかに示した。
- source_word: υἱὸν ἢ θυγατέρα
  choice: 息子や娘
  rationale: 所有表現を補わず、原文の親族名称を直接かつ自然に訳した。
theological_decisions:
- issue: 家族への愛とイエスへの忠誠の関係
  choice: 家族を愛すること自体を否定せず、イエスへの愛を最優先するよう求める比較表現として訳す。
  alternative: 家族への憎しみを要求する表現とする、または要求を弱めて単なる好みの差として意訳する。
  rationale: ὑπὲρ ἐμέは比較と優先を示す。原文の厳しい弟子道の要求と「ふさわしくない」という判断を保ちながら、ここにない「憎む」という語を持ち込まない。
- issue: 「わたしにふさわしくない」の意味範囲
  choice: 関係や弟子としての適格性を限定的に説明せず、原文同様に簡潔なまま残す。
  alternative: 「わたしの弟子になる資格がない」または「わたしのものとなるに値しない」と明示する。
  rationale: 属格を伴うἄξιοςには文脈上の含みがあるが、原文はその関係を具体的に限定していないため、神学的緊張と余地を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」はイエスの自己言及として平仮名表記にし、二つの平行構造を反復して原文の強調を保った。脚注記号は第一文の直後に置いた。
