id: MAT.10.5
reference: Matthew 10:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: ja
  text: イエスはこの十二人を遣わし、彼らにこう命じられた。「異邦人の地へ向かう道には行ってはならない[a]。また、サマリア人の町には入ってはならない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「異邦人の道へ」。異邦人の地域へ向かうことを指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: または「サマリア人の町には入ってはならない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: この十二人
  rationale: 直前に名を挙げられた十二人を指す。原文に「弟子」はないため補わない。
- source_word: ἀπέστειλεν
  choice: 遣わす
  rationale: 使命を帯びて送り出す意味合いを、自然で格調ある日本語で表す。
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: 遣わすにあたり、こう命じられた
  rationale: 分詞構文を自然な日本語に組み替え、παραγγέλλωの指示・命令としての強さを保つ。敬語はイエスへの自然な叙述として用いる。
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: 異邦人の方へ通じる道には
  rationale: 直訳的には「異邦人の道へ」。ὁδόςの道という表現と、異邦人の地域へ向かう趣旨の双方を保つ。
- source_word: ἐθνῶν
  choice: 異邦人
  rationale: このユダヤ人宣教の文脈では非ユダヤ人を指す標準的な表現。
- source_word: μὴ ἀπέλθητε
  choice: 行かず
  rationale: 後続の禁止命令と並列させ、二つの禁止を自然な一文にする。禁止の力は文末の「ならない」が双方に及ぶ。
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: サマリア人の町には
  rationale: 属格を保ちつつ、πόλιςを規模を誇張しない「町」と訳す。
- source_word: μὴ εἰσέλθητε
  choice: 入ってはならない
  rationale: 禁止命令の明確な力を現代日本語で直接表す。
theological_decisions:
- issue: 異邦人とサマリア人に関する禁止の範囲と時限性
  choice: この十二人を遣わす際の具体的な命令として訳し、禁止の力を保つ
  alternative: 異邦人やサマリア人を恒久的に排除する命令と読めるように強める
  rationale: 本文はこの派遣時の命令を記しているが、その永続性については明言しない。翻訳で恒久的な排除を付加せず、マタイ福音書全体にある緊張も解消しない。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、聖書本文としての品位を保った。「遣わす」「異邦人」は一般的な聖書語彙だが、文脈上明瞭である。二重の禁止は日本語の自然さのため「行かず……入ってはならない」とまとめた。
