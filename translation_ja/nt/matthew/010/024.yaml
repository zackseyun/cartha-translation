id: MAT.10.24
reference: Matthew 10:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a servant above his master.
translation:
  language: ja
  text: 弟子は教師より上ではなく、奴隷[a]もその主人[b]より上ではない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」とも訳せる。ギリシア語は文脈により、奴隷または仕える者を指す。
    reason: alternative_reading
  - marker: b
    text: 「主」とも訳せるが、ここでは奴隷に対する人間の主人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: 弟子
  rationale: 福音書における師との人格的・継続的な学びの関係を表し、単なる「学生」より原語の意味に適している。
- source_word: ὑπέρ + 対格
  choice: より上
  rationale: ここでは地位や優越を表す比較であり、「より上」は簡潔で自然にその意味を保つ。
- source_word: διδάσκαλος
  choice: 教師
  rationale: 教える者という基本義を明瞭に表し、後半の主人と奴隷の対比とも区別できる。
- source_word: δοῦλος
  choice: 奴隷
  rationale: κύριοςとの対句では、単なる奉仕ではなく従属する身分関係が前面に出ているため、「奴隷」が原語の力をよく保つ。文脈により「しもべ」とも訳せることは脚注に示す。
- source_word: κύριος
  choice: 主人
  rationale: ここでは神的称号ではなく、奴隷に対する人間の所有者・上位者を指すため、「主人」が自然で正確である。
- source_word: αὐτοῦ
  choice: その
  rationale: δοῦλοςに対応する主人であることを、現代日本語で自然に示す。
- source_word: οὐδέ
  choice: も…ない
  rationale: 第一の否定に第二の否定を並列して加える原文の構造を、日本語として自然に表す。
theological_decisions:
- issue: 非救済論的なたとえにおける δοῦλος の訳語
  choice: 奴隷
  alternative: しもべ、僕
  rationale: 弟子と教師、奴隷と主人という二組の身分比較であり、拘束と従属を含む社会的関係を弱めずに伝える。ただし日本語の聖書的伝統で用いられる「しもべ」の可能性も脚注に残す。
- issue: 人間関係の文脈における κύριος の訳語
  choice: 主人
  alternative: 主
  rationale: 直後・直前の関係は奴隷に対する人間の主人を指す社会的なたとえであり、ここで「主」とすると神的称号と誤解されうるため、「主人」とする。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の二つの並行する比較と、後半の身分的な対比を簡潔に保持した。
