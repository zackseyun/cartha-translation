id: MAT.10.29
reference: Matthew 10:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: ja
  text: 二羽の雀は一アサリオン[b]で売られているではありませんか。それでも、そのうちの一羽さえ、あなたがたの父なしには[a]地に落ちることはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの父を離れては」。この表現は、父の知識、配慮、または意志と無関係ではないことを含み得るが、ギリシア語はそのどれを指すか明示していない。
    reason: alternative_reading
  - marker: b
    text: アサリオンは、価値のごく低いローマの小額銅貨。
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: 雀
  rationale: この文脈では一般に雀を指すと理解され、具体的で自然な訳となる。「小鳥」も語義上可能だが、ここでは「雀」が適切。
- source_word: ἀσσαρίου
  choice: 一アサリオン
  rationale: 特定のローマの少額銅貨を指すため、現代日本の貨幣に置き換えず歴史的名称を残し、脚注で説明する。
- source_word: πωλεῖται
  choice: 売られている
  rationale: 現在受動形の商取引上の意味を、自然な現代日本語で表す。
- source_word: ἓν ἐξ αὐτῶν
  choice: そのうちの一羽
  rationale: 部分を示す表現を自然な日本語にし、雀を数える助数詞「羽」を用いる。
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: 地に落ちることはありません
  rationale: 未来の出来事を否定する文脈に合わせ、「地に落ちる」を明瞭に表現する。
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: あなたがたの父と関わりなく
  rationale: 「父なしに」という原文の広い含意を、日本語として理解可能な形で保つ。父の知識、配慮、許し、意志のいずれか一つに限定しない。
- source_word: οὐχὶ ... ;
  choice: …ではありませんか
  rationale: 肯定の答えを予期する修辞疑問の力を、自然な丁寧体で表す。
- source_word: καὶ
  choice: しかし
  rationale: 雀の低い価格と、それでも一羽も父と無関係には落ちないこととの対照を明確にする。
theological_decisions:
- issue: 「あなたがたの父なしに」が示す神の摂理のあり方
  choice: 「あなたがたの父と関わりなく」とし、父の関与の様態を限定しない。
  alternative: 「あなたがたの父の許しなしに」「あなたがたの父が知らないうちに」
  rationale: 原文は父との関係なしには起こらないことを述べるが、その関係が知識、配慮、許し、意志のどれであるかを明示していないため、特定の教理的説明を本文に加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。修辞疑問には丁寧体を用い、貨幣名は歴史的固有性を保った。神学的に含みのある句は説明的に狭めず、脚注で曖昧さを示した。
