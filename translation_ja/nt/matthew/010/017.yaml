id: MAT.10.17
reference: Matthew 10:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: ja
  text: しかし、人々には気をつけなさい。彼らはあなたがたを法廷に引き渡し、彼らの会堂であなたがたをむち打つからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: 用心しなさい
  rationale: 複数への命令であり、敵対する人々から来る危険への継続的な警戒を、自然で明確な現代日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの派遣の教えから迫害への警告へ移る、穏やかな対照を示す。
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: 人々に
  rationale: προσέχω＋ἀπόは危険の源を警戒する意味。ἄνθρωποιはここでは男性に限定されず、人間である敵対者を総称するため「人々」とした。
- source_word: παραδώσουσιν
  choice: 引き渡し
  rationale: 当局・司法機関の手に渡すという法的文脈を自然に表し、「裏切る」という関係上の意味を不必要に加えない。
- source_word: συνέδρια
  choice: 議会
  rationale: エルサレムの最高法院だけでなく、複数の地方的な統治・司法評議機関を指し得る。「議会」は制度的意味を保ちつつ、特定の一機関に限定しない。
- source_word: συναγωγαῖς
  choice: 会堂
  rationale: ユダヤ人の共同体的・宗教的集会所を指す、日本語聖書で定着し理解可能な語を用いた。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 会堂が、直前の敵対する人々に属する、または彼らと結び付いた場であることを明示する。
- source_word: μαστιγώσουσιν
  choice: むち打つ
  rationale: 司法的・身体的な処罰としてむちで打つことを、古風すぎない明瞭な表現で示す。
theological_decisions:
- issue: ἀνθρώπωνの性別表現
  choice: 人々
  alternative: 男たち
  rationale: 文法上は男性複数形だが、文脈では迫害者となる人間を総称しており、男性だけを指すとは限定されていないため。
- issue: συνέδριαが指す機関の範囲
  choice: 議会
  alternative: 最高法院／法廷
  rationale: 複数形で地方の評議・司法機関を指し得るため、エルサレムの最高法院だけに限定せず、また司法機能だけにも狭めない訳語を選んだ。
translation_notes:
  register: 明確で格調を保った現代標準日本語。二人称複数は「あなたがた」とし、警告の命令と迫害の法的・身体的な厳しさを簡潔に保った。日本語訳では「人々」が性別を限定しないことが明白なため、英語版のような性別に関する脚注は不要と判断した。
