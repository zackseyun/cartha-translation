  rationale: συνέδρια を「法廷」に改め、司法的な文脈を明確にした。「人々には気をつけなさい」として、προσέχετε ἀπὸ τῶν ἀνθρώπων の警告を自然な現代日本語で表した。他の表現は原文の複数形、将来形、および「彼らの会堂」という関係を適切に保っている。
