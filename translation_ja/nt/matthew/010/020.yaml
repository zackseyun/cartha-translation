id: MAT.10.20
reference: Matthew 10:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: ja
  text: 語っているのはあなたがたではなく、あなたがたの父の霊が、あなたがたのうちで語っておられるからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたを通して語っておられる」。ギリシア語は直訳すると「あなたがたのうちで」だが、弟子たちを通して語るという意味も含み得る。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: からです
  rationale: γάρは直前の約束の理由を示す。日本語では文末の「からです」によって、説明のつながりを自然に表した。否定は「ではなく」で保持した。
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: 語っているのはあなたがたではなく
  rationale: 明示されたὑμεῖςと、話し手が誰であるかを強調する迂言的構文を、「〜のは…ではなく」という焦点構文で表した。現在分詞の継続的な動作も「語っている」で示した。
- source_word: ἀλλὰ
  choice: ではなく
  rationale: 「あなたがた」と「父の霊」を強く対比するため、日本語の対照構文「Aではなく、B」を用いた。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: 文脈上、父に属する神の霊を指す。「あなたがたの父の霊」という限定によって指示対象は明確であり、日本語本文では不自然な説明を加えなかった。
- source_word: τοῦ πατρὸς ὑμῶν
  choice: あなたがたの父の
  rationale: 原文どおり、弟子たちの「父」とその霊との関係を表した。「天の」は本文にないため補わなかった。
- source_word: τὸ λαλοῦν
  choice: 語ってくださる
  rationale: 現在分詞の動作を述語として自然な日本語にした。神の霊の働きを表すため敬意を含む補助動詞を用いたが、発話の内容や仕方は付加していない。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちで
  rationale: ἐνの直接的な場所的表現を保ち、単に「あなたがたを通して」として手段の意味に限定することを避けた。日本語では複数の弟子たちを指すことが分かるよう「あなたがたのうちで」とした。
theological_decisions:
- issue: ἐν ὑμῖνを内在として訳すか、手段・媒介として訳すか
  choice: あなたがたのうちで
  alternative: あなたがたを通して
  rationale: ἐνの基本的な意味を本文に残した。文脈上は弟子たちを通して語ることも含意し得るが、「通して」とすると媒介の意味に決めすぎるため、代替訳を脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「語る」を反復して原文のλαλέωの反復と対比を保持した。理由を示すγάρは日本語として自然な文末の「からです」で表現した。
