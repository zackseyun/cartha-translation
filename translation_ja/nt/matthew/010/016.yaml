id: MAT.10.16
reference: Matthew 10:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: ja
  text: 見なさい。わたしはあなたがたを、狼のただ中にいる羊のように遣わします。ですから、蛇のように賢く、鳩のように純真でありなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「純真」は、混じり気がなく、悪意や害のないことを表す。別訳「無害」。
    reason: ἀκέραιοι の意味範囲と主要な別訳を示し、原文の含意を一語に限定しすぎないため。
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す語の働きを、現代日本語で明瞭かつ荘重に表した。
- source_word: ἀποστέλλω
  choice: 遣わします
  rationale: 権威をもって使命へ送り出す含意を保つため、「送ります」よりも聖書文脈に適した「遣わします」とした。
- source_word: ἐν μέσῳ λύκων
  choice: 狼のただ中にいる
  rationale: 敵対的な環境の中心に置かれるという空間的な強さを保った。
- source_word: φρόνιμοι
  choice: 賢く
  rationale: 思慮深さ、実際的な判断力、慎重さを含み得る語を、簡潔で自然な「賢く」で表した。
- source_word: ἀκέραιοι
  choice: 純真で
  rationale: 混じり物がなく、悪意や害のない性質を示す語であり、「純真」はその肯定的な意味を自然に伝える。
theological_decisions:
- issue: 蛇の賢さと鳩の純真さの緊張関係
  choice: 両者を並列し、どちらかで他方を弱めずに訳す
  alternative: 「用心深く、無害で」と説明的に訳して緊張を和らげる
  rationale: 原文は弟子に実際的な賢さと混じり気のない純真さを同時に求めており、その逆説的な組み合わせを保持すべきである。
- issue: ἀκέραιοι の意味範囲
  choice: 本文を「純真」とし、無害・混じり気がないという語義を脚注で示す
  alternative: 本文を「無害」とする
  rationale: 「無害」は行動面を明確にする一方、原語の完全さ・混じり気のなさを狭める可能性があるため、本文では広めの表現を採用した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの派遣命令にふさわしい品位を保った。「あなたがた」「遣わします」により、口語的すぎず古風すぎない調子とした。
