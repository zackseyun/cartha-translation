id: MAT.10.15
reference: Matthew 10:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: ja
  text: まことに、あなたがたに言います。裁きの日には、あの町よりも、ソドムとゴモラの地のほうが耐えやすいでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: イエスの厳粛な断言を導く語として、音写の「アーメン」より意味が明瞭で、現代日本語として自然な「まことに」を採用した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 原文の直接的な発話定型を保ちつつ、明瞭な現代日本語にした。
- source_word: ἀνεκτότερον
  choice: 耐えやすい
  rationale: 比較級が表す「より耐えられる、より忍びやすい」という意味を自然に伝える。裁きの軽重と意訳せず、原文の表現を保った。
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: ソドムとゴモラの地
  rationale: γῇの地理的な意味を明示し、二つの町名に結びつく原文の属格構造を自然な日本語で保持した。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 裁きの日には
  rationale: 将来の神の裁きを指す厳粛な表現を保ち、それ以上の終末論的体系を訳文に持ち込まない。
- source_word: τῇ πόλει ἐκείνῃ
  choice: あの町
  rationale: πόλιςは町にも都市にも用いられるが、弟子たちが訪れる各地の町という直前の文脈に適した「町」を選び、ἐκείνῃの指示性を「あの」で表した。
theological_decisions:
- issue: 「裁きの日」の性質
  choice: 将来の神の裁きの日として訳すが、その詳細は規定しない
  alternative: 一般的な裁きの時として理解する
  rationale: ἐν ἡμέρᾳ κρίσεωςは終末的な神の裁きを自然に示す一方、本文はその時期や仕組みを詳述していないため、訳文でもそれ以上を補わない。
- issue: ソドムとゴモラの地が「耐えやすい」という擬人化・換喩
  choice: 原文どおり「地のほうが耐えやすい」と表現する
  alternative: 「ソドムとゴモラの人々への裁きのほうが軽い」と説明的に訳す
  rationale: 原文は土地を挙げてそこに属する人々を指す表現であり、裁きの程度を明示的に「軽い」と言い換えるより、その修辞と含意を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「まことに」「裁きの日」によって発言の厳粛さを保った。「でしょう」は未来の宣告を自然に表し、単なる推量として弱めない文脈で用いている。
