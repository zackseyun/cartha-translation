id: MAT.10.41
reference: Matthew 10:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: ja
  text: 預言者を預言者として受け入れる人は[a]、預言者の報いを受ける。また、正しい人を正しい人として受け入れる人は[b]、正しい人の報いを受ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「預言者の名において」。または「その人が預言者であるゆえに」。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「正しい人の名において」。または「その人が正しい人であるゆえに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: 受け入れる人
  rationale: 冠詞付き現在分詞を一般的な人物を表す表現として訳した。「迎える」も可能だが、人をその立場ゆえに認めて受け入れる意味を広く保つため「受け入れる」とした。
- source_word: προφήτην
  choice: 預言者
  rationale: 宗教的役割を表す標準的で明瞭な訳語を採用した。
- source_word: εἰς ὄνομα προφήτου
  choice: 預言者の名によって
  rationale: 字義的な「預言者の名へと／名に基づいて」に近い形を保ち、相手を預言者として、または預言者であるゆえに受け入れるという慣用的意味は脚注で明らかにした。
- source_word: μισθὸν προφήτου
  choice: 預言者の報い
  rationale: 「預言者に与えられる報い」か「預言者にふさわしい報い」かを限定せず、属格の簡潔さと曖昧さを保った。
- source_word: λήμψεται
  choice: 受ける
  rationale: 未来の確実な帰結を日本語の非過去形で自然に表した。文脈上、将来の約束として理解できる。
- source_word: δίκαιον
  choice: 正しい人
  rationale: 実体詞的に用いられた形容詞を、現代日本語で自然な「正しい人」とした。文法上の男性形を日本語で不必要に「男」と限定せず、義にかなう人物という語義を表した。
- source_word: εἰς ὄνομα δικαίου
  choice: 正しい人の名によって
  rationale: 前半との厳密な並行を保ちつつ、慣用的意味は脚注に示した。
- source_word: μισθὸν δικαίου
  choice: 正しい人の報い
  rationale: 前半の「預言者の報い」と並行させ、報いの属格関係を過度に解釈せず残した。
theological_decisions:
- issue: εἰς ὄνομα＋属格の意味
  choice: 本文では「〜の名によって」と形を保ち、脚注で「〜であるゆえに／〜として」という意味を示す。
  alternative: 本文を「預言者だから受け入れる」「正しい人として受け入れる」と意訳する。
  rationale: この表現は、その人の身分・性質を認め、それに基づいて受け入れることを示す。本文で反復表現を保持しながら、現代日本語で誤解されないよう脚注を付した。
- issue: μισθὸν προφήτου／δικαίουにおける属格の関係
  choice: 「預言者の報い」「正しい人の報い」とし、関係を限定しない。
  alternative: 「預言者が受ける報い」「正しい人にふさわしい報い」と明示する。
  rationale: 原文は、当人に与えられる報いとも、その立場に対応する報いとも読める。いずれか一方に固定せず、神学的な含みを保持した。
- issue: δίκαιον／δικαίουの男性形
  choice: 「正しい人」と訳す。
  alternative: 「正しい男」と訳す。
  rationale: ギリシア語は男性単数形だが、ここでは類型的な人物を表す。日本語の「人」は原文の人物指示を自然に表し、本文が男性だけに限定しているとの不要な解釈を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「名によって」と「〜の報い」という原文の反復と曖昧さを保持した。「義人」は簡潔だが教会用語的に響きやすいため、一般読者にも直接理解できる「正しい人」を選んだ。
