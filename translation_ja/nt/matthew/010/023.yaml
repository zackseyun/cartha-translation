id: MAT.10.23
reference: Matthew 10:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: ja
  text: この町であなたがたが迫害されるときは、別の町へ逃げなさい。[a] というのは、本当にあなたがたに言います。人の子が来るまで、あなたがたはイスラエルの町々を回り終えることは決してありません。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「もう一方の〔町〕へ」。前の節から「町」が補われる。「ほかの町へ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「イスラエルの町々を終えることは決してない」。「回り」は、町々を巡って宣教するという文脈上の意味を明示したもの。
    reason: lexical_alternative
  - marker: c
    text: 「人の子が来る」が何を指すかは、ここでは限定されていない。イエスが栄光を受けること、裁きのために来ること、終わりの日に再び来ることなどの解釈がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: …されたなら
  rationale: 不定の時を表す条件的な時間節として、将来起こり得る場合を自然な現代日本語で表した。
- source_word: διώκωσιν ὑμᾶς
  choice: 迫害された
  rationale: 宣教命令の文脈における敵対的な迫害を明確に表す。ギリシア語の能動表現は、日本語では受身が自然である。
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: この町で
  rationale: 指示詞の近称と命令の直接性を保った。
- source_word: φεύγετε εἰς τὴν ἑτέραν
  choice: 別の町へ逃げなさい
  rationale: 前節から補われる「町」を明示し、ἑτέρανを特定の順番に限定しない「別の」とした。命令の切迫感も保っている。
- source_word: ἀμὴν γὰρ λέγω ὑμῖν
  choice: 本当に、あなたがたに言います
  rationale: イエスの厳粛で権威ある導入句を、明瞭で格調のある現代日本語にした。γάρはここでは前の命令を支える説明を導くが、日本語で「というのは」を加えると重くなるため、文脈上のつながりに委ねた。
- source_word: οὐ μὴ τελέσητε
  choice: 回り終えることは決してありません
  rationale: οὐ μήの強い否定を「決して…ありません」で表し、τελέωの完了の意味を「終える」で保持した。目的語が町々であるため、文脈上含意される巡回を「回り」として明示した。
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: イスラエルの町々
  rationale: 属格表現を簡潔に保ち、複数形を「町々」で表した。
- source_word: ἕως ἂν ἔλθῃ
  choice: 来るまでに
  rationale: 否定された完了との自然な日本語の組み合わせとして、将来の時点までに巡回が完了しないという意味を表す。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 聖書で定着した称号を用い、字義とダニエル書的・神学的響きを保持した。
theological_decisions:
- issue: 「人の子が来る」の指示対象
  choice: 「人の子が来る」とのみ訳し、何を指すか特定しない
  alternative: 復活・顕彰、エルサレムへの裁き、または終末における再臨のいずれかに限定する
  rationale: ギリシア語本文自体はこの句が指す出来事を限定しておらず、解釈上の議論があるため、神学的緊張と曖昧さを本文に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの命令と厳粛な宣言にふさわしい格調を保った。「迫害されたなら」は日本語として自然な受身とし、「決してありません」で原文の強い否定を伝えた。解釈が分かれる終末論的表現は説明的に限定せず、脚注で主要な可能性を示した。
