  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: ja
  text: あなたがたを受け入れる人は、わたしを受け入れる。わたしを受け入れる人は、わたしを遣わした方を受け入れる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「歓迎する」。ギリシア語の動詞には、人、とりわけ使者を迎え入れ、その人を受け入れるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: 受け入れる人
  rationale: 冠詞付き現在分詞の実名詞的用法を、一般的な人物を指す自然な現代日本語で表した。
- source_word: δέχομαι / δέχεται
  choice: 受け入れる
  rationale: 同じ動詞の反復による、弟子たち、イエス、イエスを遣わした方へと続く関係の連鎖を保った。文脈上は歓迎して迎える意味も含みうる。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数であり、イエスが遣わす弟子たちを指すため、複数を明示した。
- source_word: ἐμέ
  choice: わたしを
  rationale: イエスを指す一人称単数目的格を、自然で品位ある表現にした。
- source_word: τὸν ἀποστείλαντά με
  choice: わたしを遣わした方
  rationale: 冠詞付きアオリスト能動分詞の実名詞的用法を自然に表し、原文が明示しない「父」を本文に補わなかった。
theological_decisions:
- issue: イエスを遣わした者の同定
  choice: 「わたしを遣わした方」と訳し、本文では一般的な表現を保つ。
  alternative: 「わたしを遣わした父」
  rationale: 文脈とマタイ福音書の神学では父なる神が強く示唆されるが、ギリシア語本文は「わたしを遣わした方」とだけ述べているため、明示されていない語を補わない。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「方」により敬意を示しつつ、原文以上に送り手を特定しない。「のであり／のである」は同一視の連鎖を明確にする。
