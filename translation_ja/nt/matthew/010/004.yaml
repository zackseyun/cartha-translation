  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: ja
  text: カナナイ人シモン[a]と、イスカリオテのユダ、イエスを裏切った[b]者でもある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「熱心な者シモン」。原文は「カナナイ人」で、アラム語またはヘブライ語に由来し、「熱心な者」を意味する呼称と一般に理解されている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスを引き渡した者」。原語の動詞は広く「引き渡す」を意味するが、ユダについては文脈上「裏切る」という意味になる。
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: カナナイ人
  rationale: ギリシア語の形を解釈語「熱心党員」に置き換えず、アラム語・ヘブライ語に由来すると考えられる呼称を慣用的に音写した。「熱心党員」という伝統的理解は脚注に示す。
- source_word: Ἰσκαριώτης
  choice: イスカリオテ
  rationale: 人物の呼称として、日本語聖書で広く通用する形に音写した。
- source_word: παραδοὺς
  choice: 裏切った
  rationale: 動詞自体には広く「引き渡す」の意味があるが、ユダを特定するこの文脈では、敵に引き渡す背信行為を表す「裏切った」が自然である。語のより中立的な意味は脚注に残す。
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: すなわちイエスを裏切った者である
  rationale: 冠詞付き分詞を、ユダをその後の行為によって特定する同格的な説明として自然な日本語にした。αὐτόνの指示対象は文脈上イエスであり、不自然な「彼を」を避けて明示した。καίの付加・特定の働きは「すなわち」によって表した。
theological_decisions:
- issue: παραδοὺςを中立的な「引き渡した」とするか、文脈上の「裏切った」とするか
  choice: 裏切った
  alternative: 引き渡した
  rationale: この使徒一覧では、ユダはイエスを敵に渡した背信行為によって特定されているため、「裏切った」が物語上の意味を明確に伝える。ただし、原語そのものはより広い意味を持つので、別訳を脚注に示して解釈上の幅を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、使徒名簿にふさわしい簡潔で品位ある文体とした。「カナナイ人」は原語の呼称を保ち、「熱心党員」は脚注に置いた。
