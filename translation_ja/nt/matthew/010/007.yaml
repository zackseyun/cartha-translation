id: MAT.10.7
reference: Matthew 10:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: ja
  text: そして、行きながら、こう宣べ伝えなさい。「天の国は近づいた。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「近くに来ている」または「近い」。ギリシア語の完了形は、近くまで来たことと、その結果が今も続いていることを示す。
    reason: lexical_alternative
  - marker: b
    text: マタイはしばしば「天の国」という表現を用いる。他の福音書の並行箇所では、しばしば「神の国」と言われる。
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: 行って
  rationale: 現在分詞を主動詞の命令に伴う行為として訳した。「行きながら」より自然であり、弟子たちが出て行って宣べ伝える流れを明確にする。
- source_word: δὲ
  choice: そして
  rationale: 弱い接続を表し、前節からの指示の連続性を保つ。対比は強調しない。
- source_word: κηρύσσετε
  choice: 宣べ伝えなさい
  rationale: 公に告げ知らせる命令の意味を保ちつつ、現代日本語の聖書文体として明瞭で品位のある表現とした。
- source_word: λέγοντες
  choice: こう
  rationale: 後続する直接話法の内容を示す分詞を、日本語で重複感の少ない「こう宣べ伝えなさい」とした。
- source_word: ὅτι
  choice: 「…」
  rationale: 発言内容を導く語であり、日本語では引用符による直接話法で自然に表した。
- source_word: Ἤγγικεν
  choice: 近づいた
  rationale: 完了形が示す、近くまで来てその状態が現在も意味を持つことを簡潔に表す。「近い」とだけして結果状態に限定しない。
- source_word: ἡ βασιλεία
  choice: 国
  rationale: 王の支配とその領域の両方を含み得る語として、定着し理解しやすい「国」を用いた。「支配」と限定して意味の幅を狭めない。
- source_word: τῶν οὐρανῶν
  choice: 天の
  rationale: マタイに特徴的な属格表現を「神の」に置き換えず、そのまま自然な日本語で保持した。
theological_decisions:
- issue: 「天の国」の意味
  choice: 天の国
  alternative: 神の国／天の支配
  rationale: マタイ特有の表現を他福音書の「神の国」に同化させず、「国」が持つ支配と領域の意味の広がりも残した。
- issue: Ἤγγικεν の完了形の含意
  choice: 近づいた
  alternative: 近い／近くに来ている
  rationale: 到来した近さと、その結果がなお有効であることを表しつつ、神の国の到来の仕方について本文以上の神学的説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令と公的な告知にふさわしい品位を保った。「宣べ伝える」はやや聖書的だが、κηρύσσω の公的な告知という意味を簡潔に伝える定着表現である。
