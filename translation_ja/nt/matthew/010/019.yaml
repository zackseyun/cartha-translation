  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: ja
  text: しかし、人々があなたがたを引き渡すとき、どのように話すべきか、あるいは何を話すべきかと心配してはならない。なぜなら、その時には、何を話すべきかがあなたがたに与えられるからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「与えられる」という受動表現では、与える方が明示されていない。次の節では、彼らを通して語る方があなたがたの父の御霊であると示される。
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: しかし、…とき
  rationale: ὅτανの将来における不定の時を「…とき」で表し、δέは直前の警告を受ける穏やかな転換として「しかし」とした。
- source_word: παραδῶσιν ὑμᾶς
  choice: 人々があなたがたを引き渡す
  rationale: παραδίδωμιの司法的・敵対的な文脈での基本義を保ちつつ、「裏切る」と限定せず、自然な現代日本語とした。主語はギリシア語の三人称複数に対応する一般的な「人々」で補った。
- source_word: μὴ μεριμνήσητε
  choice: 心配してはならない
  rationale: 差し迫った証言について思い煩うことを禁じる表現。明瞭で自然かつ、命令の力を保つ訳とした。
- source_word: πῶς ἢ τί λαλήσητε
  choice: どのように、また何を話そうか
  rationale: πῶςとτίが示す話し方と内容の区別を保持した。ἤは日本語では並列が自然になるため「また」とし、間接疑問を「話そうか」で表した。
- source_word: δοθήσεται
  choice: 与えられる
  rationale: 未来受動をそのまま受動形で訳し、与える方を本文で明示しない原文の抑制を保持した。
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: その時には
  rationale: 必要な時に与えられるという即時性を、現代日本語として自然な表現で伝えた。
- source_word: τί λαλήσητε
  choice: 話すべきこと
  rationale: λαλέωの反復を「話す」で再現し、文脈上求められる発言内容を「べきこと」で自然に表した。
theological_decisions:
- issue: δοθήσεταιにおける行為者を明示しない受動表現
  choice: 「与えられる」とし、与える方を明示しない
  alternative: 「神が与えてくださる」または「御霊が与えてくださる」
  rationale: この節自体は行為者を明示しておらず、次節で御霊が彼らを通して語ると説明される。したがって、この節では原文の受動表現と神学的な含みを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その時には」は「その時刻に」より自然でありつつ、ἐν ἐκείνῃ τῇ ὥρᾳの切迫感を保つ。本文中の脚注記号は対応箇所である文末に置いた。
