id: MAT.10.22
reference: Matthew 10:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ja
  text: また、あなたがたは、わたしの名のために、すべての人から憎まれます[a]。しかし、最後まで耐え抜く人は救われます[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの名のゆえに」。
    reason: lexical_alternative
  - marker: b
    text: 「耐え抜く」は「忍耐し続ける」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「救われます」は、文脈の理解によっては「助け出されます」または「救出されます」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: すべての人から憎まれます
  rationale: 未来の状態を表す迂言的な構文を自然な日本語の受け身で表し、πάντωνの包括的な意味も保持した。
- source_word: διὰ τὸ ὄνομά μου
  choice: わたしの名のために
  rationale: διά＋対格の理由・原因を示す。「名」がイエスの人格、権威、イエスへの帰属を含み得る聖書的な表現を保った。
- source_word: ὁ δὲ ὑπομείνας
  choice: しかし、…耐え抜く人
  rationale: ὑπομένωが迫害の中で持ちこたえることを表すため、「耐え抜く」とした。δέの対比も「しかし」で明示した。
- source_word: εἰς τέλος
  choice: 最後まで
  rationale: ある終点に至るまで耐えるという意味を、簡潔で自然な日本語で表した。
- source_word: οὗτος
  choice: （「人」を主語として統合）
  rationale: ギリシア語では先行する分詞句を受けて強調する代名詞だが、「この人こそ」とすると日本語では強調が過度になり得るため、自然な主語述語構造に統合した。
- source_word: σωθήσεται
  choice: 救われます
  rationale: σῴζωが持つ救済・救出の幅を狭めず、終末的救いにも危難からの救出にも開かれた表現とした。
theological_decisions:
- issue: 忍耐と最終的な救いとの関係
  choice: 「救われます」と広い表現を保つ
  alternative: 「危難から助け出されます」または特定の忍耐教理として明示する
  rationale: 本文は迫害の中で最後まで耐えることと救いを結びつけるが、その救いが身体的救出だけを指すのか、終末的救いを指すのかを翻訳で限定せず、神学的緊張を保持した。
translation_notes:
  register: 明瞭で現代的ながら品位ある「です・ます」調を用いた。「憎まれる」「救われる」という聖書的に重要な語を保ちつつ、語順は自然な日本語に整えた。
