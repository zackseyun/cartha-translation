  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: ja
  text: わたしが暗闇の中であなたがたに言うことを、光の中で語りなさい。また、耳もとで聞くことを、家々の屋根の上で告げ知らせなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「暗闇の中で……光の中で」は、「ひそかに……公然と」という意味を含む。「耳もとで」聞いたことを「家々の屋根の上で」告げるとは、私的に聞いたことを広く公に知らせるということ。古代の家の屋根は平らで、人々に呼びかける目立つ場所として用いることができた。
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: わたしがあなたがたに言うこと
  rationale: 関係代名詞ὃを「こと」として自然に名詞化し、λέγωと与格ὑμῖνの直接的な教示の構文を明確に保った。
- source_word: ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί
  choice: 暗闇の中で／光の中で
  rationale: 秘密と公然という含意に置き換えず、原文の鮮明な対照的イメージを保持した。
- source_word: εἴπατε
  choice: 語りなさい
  rationale: 命令の力を保ちつつ、日本語で公に言葉を伝える文脈に自然な表現とした。
- source_word: εἰς τὸ οὖς
  choice: 耳もとで
  rationale: 逐語的な「耳の中へ」では不自然なため、私的に耳へ伝えられるという像を現代日本語で簡潔に表した。
- source_word: κηρύξατε
  choice: 告げ知らせなさい
  rationale: 公の使者が広く宣言する語感を示し、「説教しなさい」のように宗教的行為へ狭めることを避けた。
- source_word: ἐπὶ τῶν δωμάτων
  choice: 屋上から
  rationale: 古代家屋の平らな屋根を公に告知する高い場所として描く機能が、日本語では「屋上から」によって自然かつ明瞭に伝わる。
theological_decisions:
- issue: 暗闇／光、耳／屋上の表現を比喩のまま訳すか、秘密／公然という意味に言い換えるか
  choice: 主要なイメージを本文に残し、私的に受けたことを公に宣べる意味は注で説明する。
  alternative: 「ひそかに言うことを公然と語り、ささやかれたことを公に告げ知らせなさい」と解釈的に訳す。
  rationale: イエスの対照的で印象的な修辞を保ち、比喩が持つ広がりを一つの説明に限定しないため。
translation_notes:
  register: 明快な現代標準語を用いながら、命令形には「なさい」を採用して品位を保った。「暗闇」「光」「耳もと」「屋上」という原文の像を残し、意味上の含意と文化背景は脚注にまとめた。
