id: MAT.10.34
reference: Matthew 10:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: ja
  text: 「わたしが地上に平和をもたらすために来たと思ってはならない。わたしは平和をもたらすために来たのではなく、剣をもたらすために来たのだ。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「剣」は、後続する文脈では人々の間に生じる分裂を表す像である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: 思ってはならない
  rationale: μήを伴うアオリスト接続法の禁止を、現代日本語で明瞭かつ厳粛に表す。「考えてはならない」も可能だが、「思ってはならない」が自然で直接的である。
- source_word: ἦλθον
  choice: 来た
  rationale: 使命・目的を述べるアオリストとして、簡潔な「来た」が自然である。日本語では文脈により「来ている」に近い含みも持ち得るが、本文では過度に説明しない。
- source_word: βαλεῖν
  choice: もたらす
  rationale: 原義は「投げる、置く」だが、平和と剣を目的語とするこの構文では、意図された結果を自然に伝える「もたらす」が適切である。
- source_word: εἰρήνην
  choice: 平和
  rationale: εἰρήνηの標準的な訳語であり、文脈上さらに意味を限定する必要はない。
- source_word: ἐπὶ τὴν γῆν
  choice: 地上に
  rationale: γῆはここでは個別の土地より広く世界を指す。「地上に」は簡潔で自然であり、ἐπί＋対格の広がりも表す。
- source_word: μάχαιραν
  choice: 剣
  rationale: 具体的な比喩像を保持する。周囲の文脈では分裂を指すが、本文で「分裂」と解釈的に置き換えない。
theological_decisions:
- issue: 「剣」を本文で「分裂」と意訳するか
  choice: 具体的な語「剣」を保持する
  alternative: 分裂
  rationale: 原文は明確にμάχαιραν（剣）と言う。後続文脈がその分裂的な作用を示す一方、本文では比喩と神学的緊張を保ち、暴力の推奨とも単なる抽象的分裂とも断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言の厳粛さと対照の強さを保った。「平和」を二度繰り返し、「剣」という衝撃的な像を残して原文の修辞を再現した。
