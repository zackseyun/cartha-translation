id: MAT.10.18
reference: Matthew 10:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: ja
  text: また、あなたがたは、わたしのために総督たちや王たちの前に連れて行かれ、彼らと異邦人たちへの証しとなります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らに対する証し」とも訳せる。ギリシア語の与格自体は、「彼らへの」か「彼らに対する」かを明示していない。また、「異邦人たち」は「諸国民」とも訳せる。
    reason: αὐτοῖςの中立的・対立的理解と、τοῖς ἔθνεσινの語義上の別訳を、それぞれ独立して保存するため。
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: 総督たちや王たちの前に
  rationale: ἐπί＋対格は、連れて行かれる先である権力者の面前を表す。「総督」は当時の統治権を持つἡγεμώνを自然に表し、「王」はβασιλεῖςに対応する。
- source_word: ἀχθήσεσθε
  choice: 連れて行かれ
  rationale: ἄγωの未来受動形。司法的な場へ移送される意味を保ちつつ、原文に明示されない暴力性を加えない。
- source_word: ἕνεκεν ἐμοῦ
  choice: わたしのために
  rationale: 原因・理由を表し、「わたしのゆえに」より現代日本語として自然で、イエスとの関係ゆえに起こることを示す。
- source_word: εἰς μαρτύριον
  choice: 証しとなります
  rationale: εἰςが示す目的・結果を自然な日本語で表し、μαρτύριονの名詞的概念を保つ。
- source_word: αὐτοῖς
  choice: 彼らへの
  rationale: 直前の総督たちや王たちを指す与格として中立的に訳す。文脈上「彼らに対する」とも理解できるため、その可能性は脚注で示す。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人たちへの
  rationale: マタイにおけるἔθνηはしばしばイスラエル以外の民を指す。「諸国民」も可能だが、ここでは「異邦人」が文脈上の対照を明確にする。
theological_decisions:
- issue: μαρτύριον αὐτοῖςの方向性
  choice: 「彼らへの証し」と中立的に訳す
  alternative: 「彼らに対する証し」
  rationale: 与格αὐτοῖς自体は、証しが救いへの招きなのか、拒絶を告発するものなのかを明示しない。本文では中立性を保ち、文脈上あり得る対立的理解を脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、権力者の面前に立たされる司法的な響きを保った。「あなたがた」「わたし」により、イエスの弟子たちへの直接的な語りかけとしての格調も維持した。
