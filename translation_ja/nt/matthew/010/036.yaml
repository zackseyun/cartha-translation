  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: ja
  text: そして、人の敵は、自分の家の者たちとなる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人の敵は、自分の家族となる」。ただし、ギリシア語は血縁の家族に限らず、同じ家・世帯に属する者たちを指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前の文との単純なつながりを保ち、理由や強調を加えない自然な接続表現とした。
- source_word: ἐχθροὶ
  choice: 敵
  rationale: 実際に敵対する者を指す名詞的用法であり、簡潔で十分に強い日本語とした。
- source_word: τοῦ ἀνθρώπου
  choice: 人の
  rationale: ἄνθρωπος はここでは一人の人を代表的・一般的に指す。日本語の「人」は原文の一般性を自然に伝え、性別を不必要に限定しない。
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: その家の者たち
  rationale: 同じ家・世帯に属する人々を指す。単に建物としての家ではなく、また必ずしも血縁家族だけに限定されないため、「その家の者たち」とした。αὐτοῦ の指示も「その」によって明示した。
theological_decisions:
- issue: τοῦ ἀνθρώπου の代表的単数と性別
  choice: 人の
  alternative: 男の／ある人の
  rationale: 文法上は男性単数形だが、格言的な文脈で人一般を代表している。現代日本語では「人」が形式と意味の双方を自然に保ち、原文にない男性限定を生じさせない。
- issue: οἰκιακοί の範囲
  choice: その家の者たち
  alternative: その家族／その世帯の者たち
  rationale: 語は家に属する人々を表し、血縁関係だけとは限らない。「家族」より広い可能性を残して、原文の含みを保った。
translation_notes:
  register: 簡潔な格言調を保ちつつ、現代の標準的な日本語で明瞭にした。補われる述語「となる」は直前の文脈にある未来的な内容を自然に表す。
