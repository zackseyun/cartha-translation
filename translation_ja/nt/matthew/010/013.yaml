reference: Matthew 10:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: ja
  text: もしその家がふさわしいなら[a]、あなたがたの平安がその家に臨みますように。しかし、ふさわしくないなら[b]、あなたがたの平安があなたがたのもとに戻りますように[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家」は、住居だけでなく、そこに住む家族や一同を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: ここで「ふさわしい」とは、道徳的に罪がないという意味ではなく、使者とその平安を迎えるに足るという意味。
    reason: cultural_note
  - marker: c
    text: または「あなたがたの平安があなたがたのもとへ引き返しますように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: 家
  rationale: 最も直接的な対応語。文脈上は住居だけでなく、そこに住む家族や一同を含み得るため、脚注で補足した。
- source_word: ἀξία
  choice: ふさわしい
  rationale: 使者とその平安を迎えるに足る、適格であるという評価的意味を保ち、「受け入れる」のように意味を狭めない。
- source_word: ἐλθάτω
  choice: 臨むようにしなさい
  rationale: 三人称命令の力を自然な日本語で表しつつ、平安が家に到来するという比喩を保つ。
- source_word: εἰρήνη
  choice: 平安
  rationale: 通常の対応語であり、単なる挨拶に限定せず、祝福や健やかさを含む広がりを文脈に残す。
- source_word: ἐπ’ αὐτήν
  choice: その家に
  rationale: 日本語では代名詞より指示対象を明示するほうが自然であり、平安が家へ臨む方向性を表す。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのもとに
  rationale: πρόςの方向性を示し、ἐπιστραφήτωとの組み合わせで帰着先を自然に表す。
- source_word: ἐπιστραφήτω
  choice: 戻るようにしなさい
  rationale: 三人称命令を自然に表し、平安がそこにとどまらず弟子たちへ戻るという意味を保つ。
- source_word: μὲν ... δὲ
  choice: もし……なら……しかし、……なら
  rationale: 二つの条件を対照させる構造を、過度に硬くせず明確に再現する。
theological_decisions:
- issue: 「あなたがたの平安」の性質
  choice: 弟子たちの平安が家に臨み、また戻り得るという本文の具体的な比喩を保持した。
  alternative: 「平安の挨拶」または「あなたがたが告げる祝福」と説明的に訳す。
  rationale: 本文は平安を単なる願いや挨拶とも、機械的に移動する力とも明言していないため、その神学的な含みと緊張を解消しない。
- issue: 「ふさわしい」の意味
  choice: 道徳的に無罪という意味に限定せず、使者とその平安を迎えるに足るという文脈的意味を脚注で示した。
  alternative: 本文を「受け入れるなら」と意訳する。
  rationale: 「受け入れる」は文脈には合うが、ἀξίαの評価的な幅を狭めるため、本文では「ふさわしい」を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「平安が臨む／戻る」という荘重な聖書的比喩を保持した。「平安」は単なる挨拶に還元せず、「ふさわしい」も受容性だけに限定していない。
