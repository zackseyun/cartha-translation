  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: ja
  text: 十二使徒の名は次のとおりである。第一[a]に、ペテロと呼ばれるシモン、その兄弟アンデレ、ゼベダイの子ヤコブ、その兄弟ヨハネ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「第一」に当たる語は、単なる列挙順だけでなく、十二人の中での卓越性を含意する可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: 訳文では独立した接続語を置かない
  rationale: ここでは穏やかな話題の移行を示す。日本語では文脈と「次のとおり」で自然に移行が伝わるため、「さて」などを補わない。
- source_word: δώδεκα ἀποστόλων
  choice: 十二使徒
  rationale: イエスから遣わされた公認の十二人を指す定着した聖書用語であり、簡潔で明瞭。
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: 名は次のとおりである
  rationale: 指示表現を保ちながら、現代日本語として自然な列挙の導入にした。
- source_word: πρῶτος
  choice: まず
  rationale: 列挙の最初を自然に示しつつ、権威上の首位を本文で断定しない。「第一に」より平明である。
- source_word: ὁ λεγόμενος Πέτρος
  choice: ペテロと呼ばれる
  rationale: 呼称による人物同定を原文に即して明示する。
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: その兄弟
  rationale: 二つの用例で、それぞれ直前のシモンとヤコブを指す関係を自然に表す。本文だけでは兄・弟の別を特定しない。
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: ゼベダイの子
  rationale: ギリシア語の属格による人物同定が含意する父子関係を、日本語の慣用的な表現で明示する。
theological_decisions:
- issue: シモン／ペテロに伴う πρῶτος の意味
  choice: 本文では列挙上の「まず」とする
  alternative: 十二人の中での卓越性または指導的地位を示す「第一の」
  rationale: 文脈は名簿の提示であり、第一義的には列挙順として読める。一方、語が卓越性を帯びる可能性は排除せず、教派的な首位権の主張を本文へ持ち込まないよう脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。人名は日本語聖書で広く定着した表記を用い、列挙は読点と句点で読みやすく整えた。
