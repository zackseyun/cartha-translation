id: MAT.10.42
reference: Matthew 10:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: ja
  text: また、この小さい者たち[b]の一人に、その人が弟子であるということで[a]、冷たい水を一杯でも飲ませる人は、よく言っておくが、決して自分の報いを失うことはない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「弟子の名によって」。ここでは、その人が弟子であることを理由に飲ませる、という意味。
    reason: alternative_reading
  - marker: b
    text: 「小さい者たち」は、子どもだけではなく、イエスに従う人々のうち低い立場にある者たちを指すと考えられる。
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: …人は
  rationale: 不定・一般化の意味を持つ関係表現を、日本語で自然な「…人は」によって表した。
- source_word: ποτίσῃ
  choice: 飲ませる
  rationale: 原語の「飲み物を与える」という使役的な意味を明確に保ち、「冷たい水を一杯」と自然につなげた。
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: この小さい者たちの一人
  rationale: 地位の低さや弱さを含み得る比喩的表現を保ち、子どもだけに限定しなかった。
- source_word: ποτήριον ψυχροῦ
  choice: 冷たい水を一杯
  rationale: ψυχροῦには「水」が省略されていると理解し、現代日本語で自然な語順にした。
- source_word: μόνον
  choice: …一杯でも
  rationale: 贈り物がごく小さなものであっても、という限定・強調を自然に伝えた。
- source_word: εἰς ὄνομα μαθητοῦ
  choice: その人が弟子であるということで
  rationale: 行為の理由が受け手の弟子としての身分にあることを伝えつつ、原句の多少の幅を残した。直訳的な形は脚注に示した。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: よく言っておくが
  rationale: イエスの厳粛で権威ある断言を、明瞭な現代日本語で表した。
- source_word: οὐ μὴ ἀπολέσῃ
  choice: 決して…失うことはない
  rationale: οὐ μήによる強い否定を明確に表した。
- source_word: τὸν μισθὸν αὐτοῦ
  choice: 自分の報い
  rationale: 文脈上の「報い」を採用し、主語と同じ人物を指すことが明瞭になるよう「自分の」とした。
theological_decisions:
- issue: 「小さい者たち」が指す対象
  choice: 「この小さい者たち」とし、低い立場にある弟子たちを含み得る表現として保持した。
  alternative: 文字どおりの子どもだけ、または新しい信者・弱い信者だけを指す。
  rationale: 直前の文脈は弟子を受け入れることを扱っているが、本文自体は対象を狭く限定していないため、その緊張を残した。
- issue: εἰς ὄνομα μαθητοῦ の意味
  choice: 「その人が弟子であるということで」と訳した。
  alternative: 「弟子の名によって」または「弟子の名のゆえに」。
  rationale: 受け手が弟子であることを理由として行う、という文脈上の意味を自然に示しつつ、定型句や儀式的意味を不必要に持ち込まなかった。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「よく言っておくが」は定型的な solemn formula を過度に古風にせず表す。脚注記号は、関連表現の直後に置くため、本文では「弟子であるということで[a]」「小さい者たち[b]」とするのが望ましい。
