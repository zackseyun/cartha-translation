source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: ja
  text: 病人を癒やし、死者を生き返らせ[b]、皮膚病の人々[a]を清め、悪霊を追い出しなさい。あなたがたはただで受けたのだから、ただで与えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皮膚病」と訳した語は、現代のハンセン病だけを指すとは限らず、聖書時代にはさまざまな皮膚の病気を指し得ます。
    reason: cultural_note
  - marker: b
    text: 「死者を生き返らせ」は、一部の古代写本にないため、本文に含めるかどうかについて見解が分かれています。
    reason: textual_variant
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: 病人を癒やし
  rationale: ἀσθενοῦνταςはこの治癒の文脈で病気の人々を指し、θεραπεύετεは直接的な命令「癒やしなさい」を表す。日本語では列挙を自然にするため連用形とした。
- source_word: νεκροὺς ἐγείρετε
  choice: 死者を生き返らせ
  rationale: ἐγείρωはここでは単に起こすことではなく、死者を死から起こすことを意味する。「生き返らせる」が現代日本語で明確である。
- source_word: λεπροὺς
  choice: 重い皮膚病の人々
  rationale: λεπρόςは聖書時代の広範な皮膚疾患を指し得て、現代医学のハンセン病だけに限定できない。本文では人を病名で呼ぶ表現を避けつつ、脚注で語義の幅を示した。
- source_word: καθαρίζετε
  choice: 清め
  rationale: καθαρίζωは身体的な回復だけでなく、宗教的・儀礼的な清さへの回復も含み得るため、「治し」ではなく「清め」とした。
- source_word: δαιμόνια ἐκβάλλετε
  choice: 悪霊を追い出しなさい
  rationale: δαιμόνιαは悪霊、ἐκβάλλετεは力をもって外へ出す命令を表す。「追い出す」は現代日本語として自然で、悪霊追放の具体性も保つ。
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: あなたがたはただで受けたのだから、ただで与えなさい
  rationale: δωρεάνの「無償で」を「ただで」と訳し、二度反復して原文の対句を保った。後半の命令の根拠として前半を受ける日本語の自然な関係を「のだから」で明示した。
theological_decisions:
- issue: 奇跡を行う命令の範囲
  choice: 宣教のため十二弟子に与えられた具体的な複数命令として、そのまま訳す。
  alternative: 比喩、または後代の教会的実践だけを指す表現として訳す。
  rationale: ギリシア語は具体的な働きを列挙する複数形の直接命令である。適用範囲を本文以上に広げたり狭めたりせず、歴史的・神学的な緊張を保つ。
- issue: καθαρίζετεに含まれる清めの意味
  choice: 身体的治癒に限定せず「清め」とする。
  alternative: 「治し」として身体的回復だけを前面に出す。
  rationale: この動詞は皮膚疾患に関する身体的回復と、共同体・礼拝上の清さへの回復の双方を響かせ得るため、原文の含意を残す。
translation_notes:
  register: 明快な現代標準日本語を用い、命令の力を保ちながら、列挙部分は連用形で整えた。「重い皮膚病の人々」は人への配慮と歴史的語義の幅を両立させ、脚注で医学的同定の不確かさを説明する。
