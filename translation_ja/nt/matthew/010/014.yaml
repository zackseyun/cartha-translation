id: MAT.10.14
reference: Matthew 10:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: ja
  text: また、あなたがたを迎え入れず、あなたがたの言葉に耳を傾けない人がいるなら、その家またはその町[a]を出るとき、足のほこりを払い落としなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その家またはその都市」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「足のほこりを払い落とす」ことは、その知らせを拒んだ人々との関係を断ち、彼らに対する裁きを示す象徴的な行為だった。
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: …ない人がいるなら
  rationale: 不定関係表現の一般的・条件的な力を、自然な現代日本語で表した。文頭の καί は「また」として文脈との連続を保った。
- source_word: δέξηται ὑμᾶς
  choice: あなたがたを迎え入れず
  rationale: 使者を家に迎えることと、その使命を好意的に受け入れることの両面を保つ。
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: あなたがたの言葉に耳を傾けない
  rationale: 単に音を聞く以上の、語られた言葉を聞こうとする意味を表しつつ、「従う」とまでは限定しない。
- source_word: ἐξερχόμενοι ἔξω
  choice: 出るとき
  rationale: 分詞による付帯状況を簡潔で自然に表し、場所の外へ出る動作を保持した。
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: その家またはその町
  rationale: ἐκείνης の指示性を「その」で示した。πόλις は規模を限定しすぎない「町」とし、「都市」も可能であることを脚注に示した。
- source_word: ἐκτινάξατε
  choice: 払い落としなさい
  rationale: 付着したほこりを振るい落とす具体的で象徴的な動作を、明瞭な命令形で表した。
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: 足のほこり
  rationale: 直訳的な「あなたがたの足のほこり」は日本語では重いため、主語から所有者が明らかな自然な表現とした。
theological_decisions:
- issue: 弟子たちの言葉を拒む者に対する象徴的行為
  choice: 「足のほこりを払い落としなさい」という具体的命令を本文に保持する。
  alternative: 「彼らへの証しとして」を補う、または「彼らを裁きのもとに残せ」と意訳する。
  rationale: この節自体は行為を命じるが、その意味を明示していない。並行箇所の語句を本文へ補わず、象徴性と裁きの含意は脚注で説明する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「迎え入れる」で接待と使者の受容を含ませ、「耳を傾ける」で ἀκούω の文脈的意味を過度に「従う」と限定しない。脚注記号は本文中にすべて配置した。
