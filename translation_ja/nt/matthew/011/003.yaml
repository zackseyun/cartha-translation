  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: ja
  text: イエスにこう言った。「来るべき方[a]はあなたなのですか。それとも、ほかの方を待ち望むべきでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「来る方」。文脈上、「来たるべき方」とも訳せる。ギリシア語のこの表現は、待望されていたメシアを指す称号として用いられうる。
    reason: 語彙上の別訳と称号的含意を示すため。
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: そしてイエスに言った
  rationale: εἶπενは「言った」、αὐτῷは文脈上イエスを指すため、日本語では指示対象を明示した。「そして」は前節から続く発話を自然につなぐ。
- source_word: Σὺ εἶ
  choice: あなたなのですか
  rationale: 明示された代名詞σύの焦点を、「来るべき方は、あなたなのですか」という語順で自然に表した。
- source_word: ὁ ἐρχόμενος
  choice: 来るべき方
  rationale: 冠詞付き現在分詞の実質名詞的用法を、称号的・メシア的含みを保ちながら自然な日本語で訳した。「メシア」と断定して原文以上に限定することは避けた。
- source_word: ἢ ἕτερον
  choice: それとも、ほかの方を
  rationale: 選択疑問を明確にし、ἕτερονの「別の者・ほかの者」という意味を、人物への敬意を保つ「ほかの方」で表した。
- source_word: προσδοκῶμεν
  choice: 待つべきでしょうか
  rationale: 期待しつつ待つという語義を保ち、熟慮的な問いとして自然な現代日本語にした。単なる予測を意味しやすい「予想する」は避けた。
theological_decisions:
- issue: ὁ ἐρχόμενοςのメシア的・称号的性格
  choice: 「来るべき方」と訳す
  alternative: 「来ている方」「来ようとしている方」「メシア」
  rationale: 文脈は待望される救済者をめぐる問いを示すが、原文自体は「メシア」という名詞を用いていない。「来るべき方」は称号的な響きと分詞本来の意味の両方を保ち、曖昧さを解消しすぎない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、直接話法には相手への敬意が自然に伝わる丁寧体を採用した。「来るべき方」は聖書的な品位を保ちつつ、一般読者にも理解できる表現である。
