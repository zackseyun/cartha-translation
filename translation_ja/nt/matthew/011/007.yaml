reference: Matthew 11:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: ja
  text: 彼らが去って行く間に、イエスは群衆にヨハネについて語り始めた。「あなたがたは何を見るために荒野へ出て行ったのですか。風に揺れる葦ですか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「風に揺れる葦」は不安定さを連想させる。この問いは、ヨハネについてそのような答えを否定することを期待した修辞的な問いである。
    reason: 比喩と修辞疑問の働きを説明するが、比喩の適用を特定の解釈に固定しない。
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: 彼らが立ち去って行くと
  rationale: 属格絶対構文による同時進行の場面転換を自然な日本語で表した。「彼ら」は直前の文脈にあるヨハネの弟子たちを指すが、原文どおり本文では固有の説明を加えない。
- source_word: ἤρξατο ὁ Ἰησοῦς λέγειν
  choice: イエスは…語り始められた
  rationale: ἄρχομαι＋不定詞の開始の意味を保持し、群衆に向けたまとまった発言に自然な「語る」を用いた。イエスへの慣用的で過度でない敬語として「られた」を採用した。
- source_word: τοῖς ὄχλοις
  choice: 群衆に
  rationale: ギリシア語は複数形だが、日本語では集合的な「群衆」が自然であり、数量上の不要な強調を避ける。
- source_word: περὶ Ἰωάννου
  choice: ヨハネのことを
  rationale: περί＋属格の話題を示す用法を、明快な現代日本語で表した。
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: あなたがたは何を見るために荒野へ出て行ったのですか
  rationale: τίを理由ではなく対象を問う「何」とし、θεάομαιはここでは観察する意を含みうるが、自然で直接的な「見る」とした。ἔρημοςはユダヤ地方の文脈に適した「荒野」とした。
- source_word: κάλαμον ὑπὸ ἀνέμου σαλευόμενον
  choice: 風に揺さぶられる葦
  rationale: 受動分詞を連体修飾で保持した。「揺さぶられる」は単に穏やかに揺れる以上のσαλεύωの動揺の含みを伝える。
theological_decisions:
- issue: Τούτωνの指示対象
  choice: 本文では「彼ら」とし、直前の文脈に委ねる
  alternative: 「ヨハネの弟子たちが」と明示する
  rationale: 指示対象は直前のヨハネの弟子たちだが、節自体の表現を越えて説明を本文に織り込まず、原文の照応関係を保った。
- issue: 風に揺さぶられる葦の比喩
  choice: 比喩を説明せず修辞疑問として保持する
  alternative: 不安定で態度の定まらない人という意味を本文で明示する
  rationale: イエスの問いはヨハネが風向き次第で揺れる人物ではないことを暗示するが、その解釈を本文に固定せず、原文の比喩的緊張を残した。
translation_notes:
  register: 明快な現代標準日本語を用い、会話は丁寧体として品位を保った。「荒野」「葦」は聖書世界の情景を簡潔に伝える一般的な語である。脚注標識[a]は該当する比喩の直後に置いた。
