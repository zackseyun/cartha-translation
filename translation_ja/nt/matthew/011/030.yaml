  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: ja
  text: 私のくびきは負いやすく、私の荷は軽いからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: くびき
  rationale: 家畜をつないで働かせる道具を指す比喩を保ち、日本語の聖書表現としても理解可能な「くびき」とした。
- source_word: χρηστός
  choice: 心地よい
  rationale: 「良い、親切な、役に立つ、負いやすい」という意味領域があり、くびきとの組み合わせでは、よく合って苦痛を与えないという含みを自然に伝える。「容易」と断定せず、原語の好ましさ・慈しみのニュアンスも残す。
- source_word: φορτίον
  choice: 荷
  rationale: 担わされる重荷を簡潔に表し、「くびき」と対応する具体的な比喩を保つ。
- source_word: ἐλαφρόν
  choice: 軽い
  rationale: 重量が軽いという基本義と、負担が重くないという比喩的意味の双方をそのまま表せる。
- source_word: γάρ
  choice: からです
  rationale: 前節の「休ませてあげます」および招きの理由を示す接続関係を、節末の自然な日本語で明示する。
theological_decisions:
- issue: χρηστόςが示す、イエスのくびきの性質
  choice: 「心地よい」とし、単なる課題の容易さではなく、よく合い、害を与えない好ましさを表す
  alternative: 「負いやすい」「優しい」「容易だ」
  rationale: 「容易だ」は弟子として従うことに困難がないとの誤解を招きうる一方、「優しい」はくびき自体を修飾する日本語として不自然になりやすい。「心地よい」は比喩を保ちつつ、χρηστόςの肯定的で慈しみ深い性質を伝える。
translation_notes:
  register: 明快な現代標準語。比喩語「くびき」は保持し、文末の「からです」で文脈上の理由説明を示した。荘重さを保ちながら、過度に文語的な表現は避けた。
