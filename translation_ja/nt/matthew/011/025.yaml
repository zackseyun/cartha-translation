language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: ja
  text: その時、イエスはこう言われた。「父よ、天地の主よ、あなたをほめたたえます[a]。あなたはこれらのことを、知恵ある者や賢い者には隠し、幼子たち[b]には明らかにされたからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたに感謝します」とも訳せる。ギリシア語の動詞は、賛美だけでなく、感謝や公に認めることも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「乳飲み子たち」とも訳せる。ここでは、幼子のように受け入れる者たちを比喩的に指していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: その時
  rationale: 自然な物語上の時のつながりを示し、時点を必要以上に限定しない。
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: こう言われた
  rationale: 直訳的な「答えて言った」は日本語では先行する質問を強く想定させるため、応答の含みを「こう」に残しつつ自然な叙述とした。
- source_word: Ἐξομολογοῦμαί σοι
  choice: あなたをほめたたえます
  rationale: ここでは父への公然たる承認、賛美、感謝を表す。罪の告白と誤解される表現を避け、賛美の調子を示した。感謝の意味もあり得るため脚注を付した。
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: 天地の主である父よ
  rationale: 父への呼びかけと、天と地を治める主という称号を、明瞭で格調ある現代日本語にした。
- source_word: ὅτι
  choice: からです
  rationale: 賛美の理由を導く因果的なつながりを明示する。
- source_word: ἔκρυψας
  choice: あなたは…隠し
  rationale: 神を主語とする能動形を弱めず、その直接的な帰属を保持する。
- source_word: ταῦτα ... αὐτά
  choice: これらのことを
  rationale: 何を指すかという本文の開かれた指示性を保つ。日本語では目的語を一度示せば後半で自然に共有できる。
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: 知恵ある者や賢い者には
  rationale: 二つの実質化された形容詞の並列を保ち、知恵と理解力・思慮のニュアンスを自然な日本語で区別した。
- source_word: ἀπεκάλυψας
  choice: 明らかにされた
  rationale: 神による開示を表し、神学的な「啓示」の意味も伝わる平明な表現。
- source_word: νηπίοις
  choice: 幼子たち
  rationale: 乳児をも指し得る語だが、ここでは比喩的対照を保つ「幼子」が自然であり、「謙遜な者」と解釈し切ることを避ける。
theological_decisions:
- issue: 隠すことと明らかにすることにおける神の主体性
  choice: 「あなたは…隠し、…明らかにされた」と父への直接的帰属を保持する。
  alternative: 「隠れたままにされた」など許容的・間接的な表現に弱める。
  rationale: ギリシア語は父を主語とする能動形を用いる。予定や裁きについて本文以上の説明を加えず、神学的緊張をそのまま残す。
- issue: νηπίοις の意味
  choice: 比喩を保持して「幼子たち」とする。
  alternative: 字義に限定した「乳飲み子たち」、または解釈的な「謙遜な者たち」。
  rationale: 文脈上、「知恵ある者や賢い者」と対照される受け手を幼子の像で表している。抽象的な性質へ言い換えず、像と意味の幅を保つ。
translation_notes:
  register: 明瞭で現代的ながら、祈りの呼びかけにふさわしい品位を保った。「天地」は定着した簡潔な聖書語として用い、「である」により「父」と「主」の関係を明確にした。敬語はイエスの発話導入と父の行為に用い、引用内では自然な祈りの調子を保った。
