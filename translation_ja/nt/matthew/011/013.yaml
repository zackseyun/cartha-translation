id: MAT.11.13
reference: Matthew 11:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: ja
  text: すべての預言者と律法は、ヨハネまで[a]預言したからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨハネに至るまで」または「ヨハネの時まで」とも訳せる。この表現は、ヨハネを預言的証言の集約点として示しているとも、その転換点となる境界として示しているとも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: すべての
  rationale: 定冠詞付きの「預言者たち」全体を集合的に指すため、自然な「すべての」とした。
- source_word: γὰρ
  choice: からである
  rationale: 直前の発言に根拠や説明を加える接続の働きを、文末表現で自然に示した。
- source_word: οἱ προφῆται
  choice: 預言者
  rationale: 神から託された言葉を語る者たちを指す標準的な訳語。「すべての」により複数・集合の意味は明確である。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 一般的な法ではなく、イスラエルの聖書的証言としてのトーラーを指すため、定着した訳語「律法」を用いた。
- source_word: ἕως Ἰωάννου
  choice: ヨハネまで
  rationale: 時間的な限界を簡潔に表しつつ、ヨハネを預言的証言の頂点として含むのか、時代の境界とするのかという原文の曖昧さを保った。
- source_word: ἐπροφήτευσαν
  choice: 預言した
  rationale: アオリスト能動直説法を直接的に訳した。預言者だけでなく律法も主語であるという原文の擬人的な表現を保っている。
theological_decisions:
- issue: ὁ νόμοςが一般的な法を指すか、聖書の一部としての律法を指すか
  choice: 律法
  alternative: 法／おきて
  rationale: 「預言者」と並置され、イスラエルの聖書的証言を指しているため、「律法」とした。日本語では大文字小文字の区別がないが、この定着した語で固有の聖書的指示対象を示せる。
- issue: ἕως Ἰωάννουがヨハネを預言の時代に含めるか、その終点の外に置くか
  choice: ヨハネまで
  alternative: ヨハネの時まで／ヨハネに至るまで
  rationale: 原文はヨハネが預言的証言の集約点なのか、時代の転換を示す境界なのかを完全には特定しない。「ヨハネまで」は、その時間的境界と解釈上の緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「預言したからである」により説明を示すγὰρを保持し、「律法が預言した」という原文の大胆な擬人表現も弱めずに訳した。
