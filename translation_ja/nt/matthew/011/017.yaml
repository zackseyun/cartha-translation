id: MAT.11.17
reference: Matthew 11:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: ja
  text: こう言う。『私たちがあなたがたのために笛を吹いたのに、あなたがたは踊らなかった。私たちが哀歌を歌ったのに[a]、あなたがたは悲しみを表さなかった[b]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「嘆いた」または「葬送の歌を歌った」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「自分の身を打たなかった」。胸を打つなど、悲しみを表す当時の慣習を指す。
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: こう言う
  rationale: 例えの場面を生き生きと示す現在形を保ち、直前の子どもたちが発する言葉として自然に導入する。
- source_word: Ηὐλήσαμεν
  choice: 笛を吹いた
  rationale: αὐλέωが笛・管楽器を演奏することを具体的に指すため、現代日本語で簡潔かつ明瞭に表した。
- source_word: ὑμῖν
  choice: あなたがたのために
  rationale: 演奏が相手に向けられたものであることを自然に示す。
- source_word: ὠρχήσασθε
  choice: 踊らなかった
  rationale: 中動態に不必要な再帰的意味を加えず、文脈に即した通常の意味を訳した。
- source_word: ἐθρηνήσαμεν
  choice: 哀歌を歌った
  rationale: 葬送を思わせる嘆きの歌という意味と、前半の演奏との並行関係を保つ。
- source_word: ἐκόψασθε
  choice: 悲しみを表さなかった
  rationale: 語が指し得る胸を打つなどの服喪動作を過度に限定せず、外に表す嘆きという文脈上の意味を自然な日本語で示す。
theological_decisions: []
