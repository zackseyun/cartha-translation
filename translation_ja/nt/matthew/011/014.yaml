  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: ja
  text: そして、あなたがたが受け入れるつもりなら[a]、この人こそ、来ることになっているエリヤです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたがこれを受け入れるつもりなら」。
    reason: δέξασθαιの目的語は原文に明示されていない。日本語本文でも目的語を補わず、文脈上イエスのこの説明を受け入れることが想定される余地を保つ。
  - marker: b
    text: すなわち、洗礼者ヨハネが、来ると期待されていたエリヤとして同定されている。マラキ書4章5節、マタイ17章10～13節参照。
    reason: 預言的背景と関連箇所を示す。本文の直接的な同定を「エリヤのような者」と弱めず、その同定をどう理解するかは訳文・脚注ともに決着させない。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前の文脈とのつながりを自然に示しつつ、談話関係を過度に限定しない。
- source_word: εἰ θέλετε δέξασθαι
  choice: あなたがたに受け入れる意思があるなら
  rationale: θέλετε＋不定詞が表す意志・受容の用意を明示する。δέξασθαιの目的語は原文でも明示されないため、日本語でも補わず、解釈上の余地を保つ。
- source_word: αὐτός
  choice: この人こそ
  rationale: 文脈上、洗礼者ヨハネを指す。αὐτόςの指示と強調を、自然な日本語で示す。
- source_word: ἐστιν Ἠλίας
  choice: エリヤです
  rationale: 原文の直接的な同定を弱めて「エリヤのような人」などとはせず、そのまま保つ。
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: 来ることになっている
  rationale: 預言に基づいて到来が期待されていた者という未来志向を表し、「間もなく来る」と時間的切迫性を過度に加えない。
theological_decisions:
- issue: 洗礼者ヨハネとエリヤの同定
  choice: 「この人こそ、来ることになっているエリヤです」と直接的に訳す。
  alternative: 「この人はエリヤの役割を果たす者です」「この人はエリヤのような者です」
  rationale: ギリシア語は直接に同定している一方、「受け入れる意思があるなら」という条件的な訴えを伴う。両方を保ち、同一人物性か役割の成就かを訳文で決着させない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「この人こそ」で原文の指示・強調を表した。「来ることになっている」はやや改まった聖書的文脈にも適合し、預言上の期待を自然に伝える。
