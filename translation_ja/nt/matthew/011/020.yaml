source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: ja
  text: それからイエスは、ご自分の力あるわざ[a]が最も多く行われた町々を、その町々の人々が悔い改めなかったので、責め始められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「力あるわざ」は、「奇跡」または「力のわざ」とも訳せる（ギリシア語：デュナメイス）。
    reason: δυνάμειςの語彙的な訳語の選択肢を示すため。
lexical_decisions:
- source_word: Τότε
  choice: それから
  rationale: 物語の次の展開を示す時間的な接続語として、現代日本語で自然に訳した。
- source_word: ἤρξατο ὀνειδίζειν
  choice: 責め始められた
  rationale: ἤρξατο の開始の意味を保ちつつ、ὀνειδίζω の非難・叱責の語感を、過度に司法的な意味を加えずに表した。
- source_word: τὰς πόλεις ἐν αἷς
  choice: …町々を
  rationale: 文脈上はガリラヤの諸都市・町を指すため、現代日本語として自然な「町々」とした。関係節は前置修飾で表した。
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: ご自分の力あるわざが最も多く行われた
  rationale: δυνάμεις がイエスの力の現れである行為を指すことを保ち、「奇跡」とだけ限定せずに訳した。πλεῖσται は比較範囲を明示しない原文どおり「最も多く」とした。
- source_word: ὅτι οὐ μετενόησαν
  choice: 彼らが悔い改めなかったからである
  rationale: ὅτι の理由を明示し、μετανοέω の道徳的・霊的な転換を、定着した自然な表現「悔い改める」で訳した。
theological_decisions:
- issue: δυνάμεις の奇跡文脈での訳語
  choice: 力あるわざ
  alternative: 奇跡／力のわざ
  rationale: 語の中心にある「力」の意味と、それが具体的な行為として現れたことの両方を保ち、単に後代の分類語へ狭めないため。
- issue: μετενόησαν の訳語
  choice: 悔い改めなかった
  alternative: 考えを改めなかった／立ち返らなかった
  rationale: イエスの力あるわざに対する道徳的・霊的応答の欠如を表す文脈であり、原語の重みを保つ一般的な聖書用語が適切である。
- issue: 町々を指す代名詞の扱い
  choice: 彼ら
  alternative: 町々は／その町の人々は
  rationale: 原文では動詞が三人称複数で、文法上は「町々」を受ける擬人法である。「彼ら」はその緊張をある程度保つが、実質的には住民を指す。脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」は直前の文脈から補い、主語を自然に明示した。敬語は過度に重くせず、「ご自分」「始められた」で尊敬を表した。脚注記号[a]は本文中に配置した。
