id: MAT.11.21
reference: Matthew 11:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: ja
  text: コラジンよ、あなたに災いがある。ベツサイダよ、あなたに災いがある。あなたがたの間で行われた力あるわざ[a]が、もしティルスとシドンで行われていたなら、彼らはとうの昔に粗布をまとい、灰をかぶって悔い改めていたであろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奇跡」とも訳せる。ギリシア語は「力ある行い」「力のわざ」の意。
    reason: δυνάμειςの有力な訳語と、その「力」を表す語感を示すため。
lexical_decisions:
- source_word: Οὐαί σοι
  choice: あなたは災いだ
  rationale: 預言者的な嘆きと裁きの宣告をともに保ちつつ、現代日本語で直接的かつ明瞭に表現した。
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: コラジン／ベツサイダ／ティルス／シドン
  rationale: 固有地名を現代日本語で一般的な聖書表記に従って音写した。
- source_word: αἱ δυνάμεις
  choice: 力あるわざ
  rationale: 神的な力の現れである行為という語義を保つ。「奇跡」も可能だが、δυνάμειςの「力」とのつながりを明示するため本文ではこの表現を採用した。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 複数の住民に向けた表現であり、内面的な意味ではなく、その町の人々のただ中で行われたことを示す。
- source_word: πάλαι
  choice: とうの昔に
  rationale: 単なる過去ではなく、今よりずっと前に悔い改めていたはずだという強い時間的対比を自然に表す。
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: 粗布をまとい、灰をかぶって
  rationale: 悔い改めと悲嘆を示す古代の具体的な所作が日本語読者に伝わるよう、文化的情景を明示した。
- source_word: μετενόησαν
  choice: 悔い改めていたであろう
  rationale: 文脈上の宗教的・倫理的な方向転換を自然に表し、ἄνを伴う反実仮想の帰結も保持した。
theological_decisions:
- issue: ティルスとシドンとの反実仮想的な比較
  choice: イエスの力あるわざを見ながら悔い改めなかった町々の、より重い責任を示す実質的な比較として訳す
  alternative: 実際の比較判断を伴わない純粋な修辞的誇張と解する
  rationale: 原文の反実仮想と道徳的対比をそのまま保ち、それ以上の教理的結論は補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な裁きの宣告にふさわしい威厳を保った。「粗布をまとい、灰をかぶって」は字面だけの不自然な直訳を避け、原文の悔い改めの情景を具体的に伝える表現とした。
