  to: コラジンよ、あなたに災いがある。ベツサイダよ、あなたに災いがある。あなたがたの間で行われた力あるわざ[a]が、もしティルスとシドンで行われていたなら、彼らはとうの昔に粗布をまとい、灰をかぶって悔い改めていたであろう。
