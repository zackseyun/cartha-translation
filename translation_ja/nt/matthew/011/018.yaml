  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: ja
  text: というのも、ヨハネは食べも飲みもしないで来たのに、人々は「彼は悪霊に取りつかれている」と言う。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼は悪霊を持っている」。または「彼には悪霊がいる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: 来て
  rationale: アオリストはヨハネが公の場に現れたことを指すが、通常の語義に沿う自然な日本語として「来て」とした。
- source_word: γὰρ
  choice: ので
  rationale: 前節の言葉を受け、その理由を示す説明的な接続を、日本語の文脈に自然な因果表現で示した。
- source_word: Ἰωάννης
  choice: ヨハネ
  rationale: 日本語聖書で定着した人名表記。文脈上、バプテスマのヨハネを指す。
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: 食べも飲みもしなかった
  rationale: μήτε…μήτεの対句を簡潔に保った。原文にないパンやぶどう酒を補わず、ヨハネの禁欲的な生活ぶりを表す圧縮された言い方を維持した。
- source_word: καὶ λέγουσιν
  choice: 人々は…と言う
  rationale: 主語が明示されない一般的・敵対的な発言者を、日本語で自然な「人々」とした。現在形の生き生きとした一般化を「言う」で保った。
- source_word: Δαιμόνιον ἔχει
  choice: 悪霊に取りつかれている
  rationale: 直訳は「悪霊を持っている」だが、日本語では誤解を招きやすいため、当時の आरोप accusation の意味が自然に伝わる慣用表現を本文に採用し、直訳を脚注に示した。δαιμόνιονはδιάβολοςではないため「悪魔」ではなく「悪霊」とした。
theological_decisions:
- issue: δαιμόνιον ἔχειという非難の訳し方
  choice: 悪霊に取りつかれている
  alternative: 悪霊がいる／悪霊を持っている
  rationale: これは語り手の断定ではなく、人々がヨハネに向けた非難である。日本語として意味の明瞭な慣用表現を本文に置きつつ、脚注でギリシア語の字義を保存し、解釈の幅を示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「あれは」は、批判する人々の距離を置いた口調を自然に表す。脚注記号は該当する引用文の直後に配置した。
