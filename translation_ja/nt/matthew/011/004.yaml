  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: ja
  text: イエスは彼らに答えた。「行って、あなたがたが聞いていることと見ていることをヨハネに知らせなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: 彼らに答えた
  rationale: 「答えて言った」というギリシア語の慣用的な発話導入句を、意味を保ちながら自然な現代日本語にまとめた。
- source_word: Πορευθέντες
  choice: 行って
  rationale: 命令形に伴う分詞で、後続の命令に先立つ行為を表すため、「行って」とした。
- source_word: ἀπαγγείλατε
  choice: 知らせなさい
  rationale: 見聞きした内容をヨハネに伝え返すという文脈に合い、一般読者に明瞭な表現である。
- source_word: Ἰωάννῃ
  choice: ヨハネに
  rationale: 与格の間接目的語を自然な日本語で示した。
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: あなたがたが聞いていること、見ていること
  rationale: 二つの現在形が示す彼らの現時点での経験を保ち、対象を並列して明確に表した。
- source_word: καὶ
  choice: （独立した接続語としては訳出しない）
  rationale: 節頭の継続的な接続は、日本語では文脈上明らかであり、訳出しなくても自然に物語の連続性が保たれる。
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν の物語的定型句
  choice: 彼らに答えた
  alternative: 彼らに答えて言った
  rationale: 教理上の差はなく、重複感のある直訳を避けて、発話への応答という機能を自然な日本語で保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「あなたがた」により複数の聞き手を明示し、命令は「知らせなさい」として厳粛さと分かりやすさを両立させた。
