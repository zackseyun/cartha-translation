  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: ja
  text: では、この世代を何にたとえようか。それは、市場[a]に座って、ほかの者たち[b]に呼びかけている子どもたちのようなものだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「市場の広場」とも訳せる。ギリシア語は、人々が集まる公共の市場や広場を指す。
    reason: lexical_alternative
  - marker: b
    text: 「ほかの子どもたち」とも訳せる。ギリシア語は単に「ほかの者たち」としており、相手が誰かはこのたとえの文脈から補われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι δὲ ὁμοιώσω
  choice: では、…を何にたとえようか
  rationale: δὲの穏やかな転換を「では」で示し、与格Τίνιとὁμοιώσωによる修辞的な問いを、自然な現代日本語で表した。
- source_word: τὴν γενεὰν ταύτην
  choice: この時代の人々
  rationale: γενεάは同時代の世代と、その世代に属する人々の双方を指しうる。日本語の「この世代」よりも、人々を子どもたちにたとえる構文が明瞭になる表現を採った。
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: 子どもたちに似ている
  rationale: 類似を表す単純な述語を自然に訳し、παιδίοιςに不要な幼さの強調を加えなかった。
- source_word: καθημένοις ἐν ταῖς ἀγοραῖς
  choice: 広場に座り
  rationale: ἀγοράは市場であると同時に、人が集まる公共の広場を指す。この場面では簡潔で自然な「広場」とした。
- source_word: ἃ προσφωνοῦντα
  choice: 呼びかけている
  rationale: προσφωνέωの、声をかけて相手に語りかける意味を表し、分詞の継続的な場面描写も保った。
- source_word: τοῖς ἑτέροις
  choice: ほかの者たちに
  rationale: 原文は相手を明示せず「ほかの者たち」とだけ述べるため、その曖昧さを保った。文脈上はほかの子どもたちと理解できる。
theological_decisions: []
