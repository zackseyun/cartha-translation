id: MAT.11.11
reference: Matthew 11:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: ja
  text: よく言っておく。女から生まれた者の中で、バプテスマのヨハネより偉大な者は現れたことがない[a][b]。しかし、天の国で最も小さい者[c]は、彼より偉大である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「起こされた者はいない」とも訳せる。ギリシア語の動詞は「現れる」「立ち上がる」のほか、「起こされる」という意味にもなり得るが、ここでは歴史上に現れることを指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「女から生まれた者」は、人間を指すセム語的な表現。
    reason: cultural_note
  - marker: c
    text: 直訳は「より小さい者」。ここでは、天の国で地位や序列が最も低い者という意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: よく言っておく
  rationale: イエスが厳粛に断言する定型句として、現代日本語で自然かつ重みのある表現を採った。「アーメン、あなたがたに言う」より理解しやすく、権威ある語調を保つ。
- source_word: οὐκ ἐγήγερται
  choice: 現れたことがない
  rationale: ἐγείρω の完了形がここでは歴史上に現れることを指す可能性が高い。「起こされた」として復活を連想させることを避けつつ、受動の可能性は脚注に残した。
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: 女から生まれた者の中で
  rationale: 人間一般を表すセム語的表現の具体的なイメージを保ち、日本語として明瞭にした。
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: バプテスマのヨハネより偉大な者
  rationale: 比較構文を自然な日本語にし、「偉大」で人物の卓越性を幅広く表した。
- source_word: τοῦ βαπτιστοῦ
  choice: バプテスマのヨハネ
  rationale: 日本語の聖書用語として広く認識され、洗礼を授ける者という称号を固有の呼称として明確に示す。
- source_word: ὁ δὲ μικρότερος
  choice: しかし、天の国で最も小さい者
  rationale: 比較級 μικρότερος はここで地位や序列の最下位を表す用法と理解できるため、日本語では自然な最上級相当で表した。比較級どおりの別訳は脚注に示した。
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 天の国で
  rationale: マタイに特徴的な表現を、現代日本語で簡潔かつ定着した形にした。「国」は神の支配と領域の双方を含み得るため、その幅を限定しない。
- source_word: μείζων αὐτοῦ ἐστιν
  choice: 彼より偉大である
  rationale: 比較の逆説を説明で和らげず、原文どおり直接的に表した。αὐτοῦ の指示対象は直前のヨハネとして自然に読める。
theological_decisions:
- issue: ヨハネの偉大さと天の国にいる最小の者との比較
  choice: 比較をそのまま訳し、なぜ最小の者がヨハネより偉大なのかは説明しない。
  alternative: 救済史上の時代、新しい契約の特権、個人の聖さや身分の違いとして明示的に説明する。
  rationale: 本文自体は逆説的比較の根拠や仕組みを説明していないため、特定の教理的解釈を訳文に持ち込まず、緊張を保った。
- issue: 「天の国」の意味
  choice: 「天の国」と訳し、神の支配か領域かを一方に限定しない。
  alternative: 「天の支配」または「天国」として意味を限定する。
  rationale: βασιλεία は王権・支配とその領域の双方を含み得る。マタイの定型句の曖昧さを保つため、定着した「天の国」を用いた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい格調を保った。「よく言っておく」は定型句として簡潔にし、後半の逆説は解説を加えず原文の緊張を維持した。脚注記号は該当語句の直後に配置した。
