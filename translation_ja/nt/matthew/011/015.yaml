  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ja
  text: 耳のある者[a]は、聞きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耳のある人は、聞きなさい」とも訳せる。ギリシア語は単数形を用いた一般的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ある者
  rationale: 定冠詞と現在分詞による実詞的表現で、耳を持つ人を一般的に指す。日本語の「者」は単数・複数を明示せず、原文の一般的な呼びかけを簡潔かつ格調を保って表せる。
- source_word: ὦτα
  choice: 耳
  rationale: 原文は複数形だが、日本語では身体器官をこの慣用表現で「耳」とするのが自然であり、原文の意味を損なわない。
- source_word: ἀκουέτω
  choice: 聞きなさい
  rationale: 三人称単数・現在命令形の呼びかけを、現代日本語で自然な命令表現として訳した。「聞く」には音を受け取るだけでなく、注意して受け止め従う含みも残る。
theological_decisions:
- issue: 単数形による一般的表現
  choice: 耳のある者は、聞きなさい。
  alternative: 耳のある人は、聞きなさい。
  rationale: ギリシア語は文法上、男性単数形を用いて一般の人を指す。日本語では性別を付加せず、「者」によって包括的な一般性と原文の簡潔な調子を保った。
- issue: 「聞く」の意味の広がり
  choice: 聞きなさい
  alternative: よく聞きなさい
  rationale: 文脈上は注意深く受け止めることが求められるが、「よく」を本文に補わず、単純な命令が持つ比喩的・霊的含意をそのまま残した。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。広く知られた聖書的な言い回しを保ちつつ、古風な命令形は避けた。
