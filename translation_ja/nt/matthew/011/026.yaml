  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: ja
  text: はい、父よ。このようになることは、あなたの御前で喜ばしいことだったからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「はい、父よ。このようになることは、あなたのよい御心によることだったからです。」
    reason: εὐδοκία ἐγένετο ἔμπροσθέν σου は字義的には「あなたの前で喜ばしいこととなった」。文脈上、父の喜び・よい御心を表す表現としても訳せる。
lexical_decisions:
- source_word: ναί
  choice: はい
  rationale: 祈りの中で父のなさり方に同意し、肯定する語。現代日本語で直接的かつ自然な「はい」とした。
- source_word: ὁ πατήρ
  choice: 父よ
  rationale: 冠詞付き主格が呼びかけとして用いられている。「父よ」は明瞭で dignified な日本語の呼格表現である。
- source_word: ὅτι
  choice: からです
  rationale: 直前の肯定の理由を示す因果的用法と取り、現代日本語で自然な理由表現にした。
- source_word: οὕτως
  choice: これ
  rationale: 直前に述べられた、隠すことと現すことを含む父のなさり方を指す。日本語では「これ」が簡潔で自然である。
- source_word: εὐδοκία
  choice: 御心にかなうこと
  rationale: 父に喜ばれ、よしとされることを表す。「御計画」として予定・決定の意味に狭めず、神の好意・喜びという評価的含意を保つ。
- source_word: ἐγένετο
  choice: だった
  rationale: この構文では「生じた」「なった」と逐語的に訳すより、判断を表す連語として日本語のコピュラで自然に表せる。
- source_word: ἔμπροσθέν σου
  choice: あなたの御心に
  rationale: 字義的には「あなたの前で」だが、ここでは父の目に喜ばしいという意味。「御心にかなう」は日本語でその関係的・評価的意味を自然に伝える。
theological_decisions:
- issue: εὐδοκίαを神の決定・計画として訳すか、神の喜び・承認として訳すか
  choice: 「御心にかなうこと」とし、父に喜ばれるという意味を表した。
  alternative: 「あなたのよい御旨であった」「あなたの御計画にかなっていた」
  rationale: 本文は父のなさり方が父の前で喜ばしいことだったと述べる。「御計画」とすると予定や決定の意味を必要以上に強めうるため避け、神の主権的な喜びという含みは残した。
translation_notes:
  register: 明瞭な現代標準日本語。祈りとしての敬意を「父よ」と「御心」で保ちつつ、過度に古風な語法は避けた。
