  source_fidelity: 「食べたり飲んだりしていると」は、来た（ἦλθεν）ことを条件・時間節のようにしており、分詞句の原文どおり「食べたり飲んだりして来た」とする必要がある。また、ἐδικαιώθηの主語は「知恵」であって「知恵の正しさ」ではないため、知恵そのものが正しいと示されたという擬人化を保つ。καίに対する「しかし」は原文にない逆接を加えるため、「そして」に改める。
  naturalness: 「人の子は、食べたり飲んだりして来た」とすれば、現代標準語として自然でありつつ原文の構文に忠実になる。引用内の「見ろ」「大食い」「大酒飲み」は公然たる非難の調子を自然に伝える。「仲間」は φίλος（友）の訳としてやや意味が広いため、「友」とする。
  terminology: 「人の子」「徴税人」「罪人」は適切。「知恵は、その行いによって正しいと示された」は、δικαιόωのこの文脈での立証・正当化の意味を自然に表し、知恵の指示対象を解釈で限定しない。「行い」は ἔργα の複数形が示す実際の行為・成果を無理なく表す。
