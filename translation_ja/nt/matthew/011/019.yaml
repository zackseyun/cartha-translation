  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: ja
  text: 人の子は、食べたり飲んだりして来た。すると彼らは言う。『見ろ、大食いで大酒飲みの男、徴税人や罪人の友だ！』そして、知恵は、その行いによって正しいと示された。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「知恵は、その行いによって正当であることが示された」。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本は「行い」ではなく「子どもたち」とし、「知恵は、その子どもたちによって正しいと示された」とする。
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自称として定着した訳語を用い、セム語的背景と称号としての含意を保つ。
- source_word: ἐσθίων καὶ πίνων
  choice: 食べたり飲んだりしている
  rationale: 継続的・習慣的な行動を自然な日本語で表し、文脈上のヨハネとの対比を保ちながら「宴会をする」などの意味を加えない。
- source_word: Ἰδοὺ
  choice: 見ろ
  rationale: 公然と非難する調子を、現代日本語で簡潔に再現する。
- source_word: φάγος καὶ οἰνοπότης
  choice: 大食いで大酒飲みの男
  rationale: 中立的な飲食の描写ではなく、過度の飲食を責める侮蔑的な呼称として訳す。
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: 徴税人や罪人の仲間
  rationale: 「友」という語の親交の含意を保ちつつ、非難の発言として自然な日本語にする。「罪人」は当時の社会的・宗教的なレッテルを保持する。
- source_word: ἐδικαιώθη
  choice: 正しさは……証明された
  rationale: ここでは「正しいと示された、正当であることが明らかになった」の意味。日本語の「義とされた」が招きうる別の教理的連想を避け、文脈上の意味を明確にする。
- source_word: ἡ σοφία
  choice: 知恵
  rationale: 何を指すかを解釈で限定せず、擬人化された表現をそのまま保つ。
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: その働きによって
  rationale: ἀπόが証明の根拠を示す用法を「によって」で表し、ἔργαは抽象的な知恵が生み出す行為・成果を含められる「働き」とする。
theological_decisions:
- issue: 結びの「知恵」が何を指すか
  choice: 「知恵」という擬人化表現を保ち、明示的に同定しない
  alternative: イエス自身、神の知恵、または神の救いの計画と明示する
  rationale: 原文は指示対象を明示していないため、特定の神学的理解に狭めず、文学的・神学的緊張を残す。
- issue: 結びの接続関係
  choice: 日本語の談話上、非難と結論の対照を「しかし」で示す
  alternative: καίを形式的に「そして」と訳す
  rationale: καί自体は単純な接続詞だが、直前の非難に対し、知恵の正しさがその働きで示されるという文脈上の対照を、日本語で自然に伝える。ただし対照を強くしすぎない。
- issue: 末尾の本文形
  choice: SBLGNTのἔργων（働き）を本文に採用する
  alternative: 一部写本のτέκνων（子どもたち）
  rationale: 指定された原語本文に従う。重要な異読は脚注で示す。
translation_notes:
  register: 明快な現代標準語。引用内では非難の鋭さを保つため「見ろ」「大食い」「大酒飲み」を用い、地の文は簡潔で品位ある調子にした。脚注記号は該当する末尾句の後に置いた。
