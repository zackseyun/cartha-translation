revisions:
- from: 人の子が来て、食べたり飲んだりしていると、彼らは言う。『見ろ、大食いで大酒飲みの男、徴税人や罪人の仲間だ！』しかし、知恵の正しさは、その働きによって証明された。[a][b]
  to: 人の子は、食べたり飲んだりして来た。すると彼らは言う。『見ろ、大食いで大酒飲みの男、徴税人や罪人の友だ！』そして、知恵は、その行いによって正しいと示された。[a][b]
  rationale: 原文の時制・構文に合わせて「食べたり飲んだりして来た」とし、καίの接続を「そして」とした。結句では主語を「知恵」に戻して擬人化を保持し、ἐδικαιώθηを「正しいと示された」と訳した。異読脚注はSBLGNT本文の「行い」と、一部写本の「子どもたち」の対比が本文と対応するよう整えた。
  reviewer_model: gpt-5.6-terra
