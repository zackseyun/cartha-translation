    rationale: καίはここで単純接続であり、逆接を明示するのは原文以上の談話関係を加える。
  - severity: medium
    issue: 「知恵の正しさは」
    rationale: 原文の主語は擬人化された「知恵」である。抽象名詞句への変更は、知恵自身が正しいと立証される表現を弱める。
  - severity: low
    issue: 「徴税人や罪人の仲間」
    rationale: φίλοςは「友」であり、「仲間」よりも原語の関係表現に近い。
