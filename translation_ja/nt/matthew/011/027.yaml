id: MAT.11.27
reference: Matthew 11:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ja
  text: すべてのものは、わたしの父からわたしに委ねられています。子を知っている者は父のほかにはなく、父を知っている者は、子と、子が父を明らかにしようと望む人[a]のほかにはいません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子が父を明らかにすることを意志する人」。
    reason: βούληται は「望む」のほか、「意志する」「選ぶ」とも訳せ、子の意志的な啓示を表す。
lexical_decisions:
- source_word: Πάντα
  choice: すべてのこと
  rationale: 中性複数の包括的な範囲を保ちつつ、文脈が明示していない対象領域を限定しない。
- source_word: παρεδόθη
  choice: 委ねられています
  rationale: アオリスト受動態が示す父から子への移譲と、その結果としての現在の状態を、自然な現代日本語で表す。文脈上、裏切りや引き渡しではなく権限・事柄の委託を表す。
- source_word: ἐπιγινώσκει
  choice: 知っている
  rationale: この語が深い、十分な認識を含み得ることは認めつつも、接頭辞の強意を必ず明示するとは限らないため、本文では過剰に限定せず「知っている」とする。
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: 子／父
  rationale: 相互に対応する固有の関係称号として簡潔に表し、日本語聖書文体で自然な「子」「父」を用いる。
- source_word: εἰ μὴ
  choice: ほかにはなく／ほかにはいません
  rationale: 否定文に続く排他的例外を、自然な日本語で明確に示す。
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: 子が父を現そうと望む者だけが
  rationale: βούληται の意志・意向を「望む」で保ち、関係代名詞構文を日本語として明瞭に組み替える。「だけが」により、先行する排他的構造との結びつきを示す。
- source_word: ἀποκαλύψαι
  choice: 現す
  rationale: 隠されていた父を子が開示するという意味を、簡潔で格調ある日本語で表す。目的語「父」はギリシア語では省略されているが、直前の指示対象から補って明示する。
theological_decisions:
- issue: ἐπιγινώσκω が表す認識の強さ
  choice: 本文は「知っている」とし、語が深い認識を含み得ることを注で示さない
  alternative: 「十分に知っている」「真に知っている」
  rationale: ἐπιγινώσκω は文脈によって十分な認識を表し得るが、ここで強意を明示的に訳し込むことは確実ではない。本文の相互的・排他的な知識という強調は構文自体で十分に伝わる。
- issue: βούληται における子の意志
  choice: 「子が……現そうと望む者」
  alternative: 「子が……現すことを選ぶ者」「子が……現そうとする者」
  rationale: 子が父を啓示する主体的意志を保持しつつ、「選ぶ」によって選定の側面を必要以上に前景化しない。
- issue: 父を知る者の範囲を表す最終句
  choice: 「また、子が父を現そうと望む者だけが、父を知る」
  alternative: 「子と、子が父を現そうと望む者のほかには、だれも父を知らない」
  rationale: 原文では「子」と啓示を受ける者が並列される。日本語では文を分け、啓示を受ける者が父を知るという論理を明示する一方、子だけが本来的に父を知るという前半の主張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、父と子の相互的で排他的な認識、および子による啓示という緊張を保った。「わたしの父」はイエスの発話として自然にし、「委ねられています」で完了した移譲の現存する結果を表した。
