reference: Matthew 11:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: ja
  text: そして、わたしのことでつまずかない人は幸いである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしにつまずかない人」、または「わたしのことで反感を抱かない人」とも訳せる。ここで「つまずく」は、イエスを受け入れられず、疑ったり離れたりすることを含みうる。
    reason: σκανδαλισθῇ ἐν ἐμοί の比喩と、反感・疑い・離反を含みうる意味の幅を示すため。
lexical_decisions:
- source_word: καί
  choice: そして
  rationale: 直前の文脈とこの宣言とのつながりを明示する、自然な接続表現。
- source_word: μακάριος
  choice: 幸いである
  rationale: 単なる主観的な幸福感ではなく、神の前で祝福された状態を告げる語の宗教的な重みを保ち、至福の宣言として定着した自然な日本語にする。
- source_word: ὃς ἐὰν μὴ
  choice: …ない人
  rationale: 特定の人物ではなく、条件に当てはまる者を一般的に指す構文を、現代日本語で自然に表す。
- source_word: σκανδαλισθῇ
  choice: つまずかない
  rationale: 比喩的な「つまずき」を保ち、単なる不快感だけでなく、イエスを受け入れられず疑うことや離反することまで含みうる意味の幅を残す。ギリシア語の受動形を日本語で機械的に受動表現にすると不自然になるため、自然な自動詞表現とした。
- source_word: ἐν ἐμοί
  choice: わたしのことで
  rationale: イエスがつまずきの契機となる関係を自然に表しつつ、「わたしに」「わたしのゆえに」にも開かれた原文の意味を過度に限定しない。
theological_decisions:
- issue: イエスとの関係における σκανδαλισθῇ の意味の強さ
  choice: 本文では「わたしのことでつまずかない」として、つまずきの比喩を保持する。
  alternative: 「わたしに反感を抱かない」「わたしを受け入れられず離れていかない」
  rationale: この語を単なる感情的な不快感に狭めず、イエスとその働きを理由に信頼を失うことや離反する可能性を含む神学的緊張を残すため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、「幸いである」と「つまずく」によってイエスの至福の宣言にふさわしい簡潔で品位ある調子を保った。「者」よりも一般読者に自然な「人」を採用した。
