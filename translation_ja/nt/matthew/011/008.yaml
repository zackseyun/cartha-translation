id: MAT.11.8
reference: Matthew 11:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: ja
  text: では、何を見に出て行ったのですか。柔らかな服を着た人ですか。見なさい、柔らかな服を身に着けている人々は、王たちの家にいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「柔らかな服」は、繊細で上等な衣服、ぜいたくな衣服を指す。また「王たちの家」は「王宮」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: では
  rationale: 前節から続く問いを受けて次の対照的な問いへ進む接続語として、現代日本語で自然な「では」とした。
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: 何を見に出て行ったのですか
  rationale: τίを「何を」、目的を表す不定詞ἰδεῖνを「見に」と訳し、修辞疑問の形を保った。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 直近では洗礼者ヨハネを指す男性だが、日本語では「人」が自然であり、原文の単数も保てる。
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: 柔らかな服を着た
  rationale: μαλακοῖςの字義である「柔らかなもの」を具体的に服と補い、繊細で上等な衣服という含意は注で示した。完了受動分詞は自然な状態表現「着た」とした。
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す語の修辞的な力を、古風すぎない明瞭な命令表現で保った。
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: 柔らかな服を身に着けている人々
  rationale: φοροῦντεςが表す継続的・習慣的な着用を「身に着けている」で表し、μαλακάは前半と同じ「柔らかな服」として反復を保った。
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: 王たちの家にいます
  rationale: 複数形の「王たち」と字義的な「家」を保ち、より解釈的な「王宮」への言い換えは注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら品位のある敬体。二つの修辞疑問と「見なさい」の注意喚起を保ち、原文にある「柔らかな」の反復と「王たちの家」という具体的表現を残した。
