id: MAT.11.10
reference: Matthew 11:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: ja
  text: この人こそ、次のように書かれている人です。『見よ、わたしはあなたの前にわたしの使者を遣わす。彼はあなたの前に、あなたの道を整える。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ
  choice: この人こそ、……人です
  rationale: 指示代名詞による強い同定を「こそ」で表し、περὶ οὗの関係も自然な現代日本語で保った。
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 聖書引用の定型表現である完了受動形を、書かれた内容の現在的効力も感じられる日本語にした。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言的引用の注意喚起と格調を保つ、簡潔で定着した表現。
- source_word: ἀποστέλλω
  choice: 遣わす
  rationale: 引用文の荘重さと派遣の意味を保つ。「遣わす」は現代日本語でも聖書的文脈で明瞭。
- source_word: τὸν ἄγγελόν μου
  choice: わたしの使者
  rationale: 文脈上は先駆者である人間を指すため、「天使」ではなく語の基本的な使者の意味を採った。
- source_word: πρὸ προσώπου σου
  choice: あなたの前に
  rationale: 直訳的な「あなたの顔の前に」は日本語では不自然なため、位置と先行の意味を明瞭に表した。
- source_word: κατασκευάσει
  choice: 整える
  rationale: 道を通れるよう準備するという語義を、目的語「道」と自然に結びつく動詞で表した。
- source_word: τὴν ὁδόν σου
  choice: あなたの行く道
  rationale: 所有を機械的に「あなたの道」とせず、使者がその人に先立って道を準備する文脈を自然に示しつつ、文字どおりと比喩の両方の響きを残した。
- source_word: ἔμπροσθέν σου
  choice: あなたの前に
  rationale: 標準的な位置・先行の表現として訳し、原文にある二つ目の前置詞句も省略しなかった。
theological_decisions:
- issue: 引用文に重ねて置かれた二つの前置詞句
  choice: 「あなたの前に」を二度とも本文に残す
  alternative: 一方を省略する、または「あなたに先立って」などにまとめる
  rationale: 原文はπρὸ προσώπου σουとἔμπροσθέν σουの双方を明記している。日本語として理解可能な範囲で反復を残し、引用の強調と形式を保った。
- issue: ἄγγελοςの指示対象
  choice: 「使者」
  alternative: 「天使」
  rationale: 直前からの文脈で洗礼者ヨハネが指示対象であり、ここでの語義は天的存在に限定されない。特定の教理的含意を加えず、文脈上の通常の意味を採った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書引用の「見よ」「遣わす」に適度な荘重さを残した。「顔の前」という不自然な逐語訳は避けたが、原文の二重の前置詞句は反復として保持した。
