base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ja
  text: では、何を見に出て行ったのですか。預言者ですか。そうです。あなたがたに言います。預言者以上の者です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「預言者以上」で、人を指す「者」は日本語で補っています。「預言者より偉大な者」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: では
  rationale: 直前から続く修辞疑問の流れを受けつつ、問いを次の段階へ進める対照・転換を、現代日本語で自然に示す。
- source_word: τί ἐξήλθατε
  choice: 何を…出て行ったのですか
  rationale: τίを理由の「なぜ」ではなく、見ようとした対象を問う「何」として訳す。
- source_word: ἰδεῖν
  choice: 見に
  rationale: ἐξήλθατεに伴う目的の不定詞を、自然な目的表現で示す。
- source_word: προφήτην
  choice: 預言者
  rationale: 修辞疑問の述語として、冠詞を必要としない自然な日本語にする。
- source_word: ναί
  choice: そうです
  rationale: 直前の問いに対する明確な肯定を、落ち着いた現代語で表す。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 定型的な発言導入句を、明瞭かつ格調を保った現代日本語で表す。
- source_word: καὶ περισσότερον προφήτου
  choice: 預言者を超える者です
  rationale: 比較属格を伴う「預言者以上のもの」という意味を明確にしつつ、何において超えるかは補わず、原文の含みを保つ。日本語では人を指すため「者」を最小限補った。
theological_decisions:
- issue: イエスの言葉における洗礼者ヨハネの身分と位置づけ
  choice: 「預言者を超える者」とし、どの点で超えるかは説明しない。
  alternative: 「預言者より偉大な者」／「普通の預言者以上の者」
  rationale: 本文はヨハネを預言者の範疇以上に位置づけるが、この句だけではその具体的な意味を規定していない。「偉大」や「普通の」を加えず、神学的な緊張と余白を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの問いかけの反復と簡潔な断言を保ち、説明的な語句を本文へ持ち込まない。
