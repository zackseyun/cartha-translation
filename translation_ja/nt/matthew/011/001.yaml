id: MAT.11.1
reference: Matthew 11:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: ja
  text: さて、イエスは十二人の弟子に指示を与え終えると[a]、そこを去り、彼らの町々で[b]教え、宣べ伝えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十二人の弟子に命じ終えると」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「彼ら」が誰を指すかはギリシア語では明確でない。弟子たちの町々を指すとも、その地方の人々の町々を広く指すとも考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: さて、……終えると
  rationale: マタイに特徴的な物語の移行表現として、セム語的な構文を不自然に直訳せず、接続と時間関係を明確にした。
- source_word: ἐτέλεσεν
  choice: 終えると
  rationale: 弟子への指示が完了した後、次の行動に移ったという出来事の順序を自然な日本語で表した。
- source_word: διατάσσων
  choice: 指示を与え
  rationale: 権威をもって指示・命令する意味を保ちつつ、派遣の教えを締めくくる文脈に合う現代日本語とした。「命じる」という訳語も脚注に残した。
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: 十二人の弟子に
  rationale: 福音書における μαθητής の定着した訳語「弟子」を用い、十二人であることを明示した。日本語では所有関係が文脈上明らかなため「自分の」は補わなかった。
- source_word: μετέβη ἐκεῖθεν
  choice: そこを去り
  rationale: それまでいた場所から別の場所へ移ったことを、簡潔で自然な叙述として表した。
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: 教え、宣べ伝えた
  rationale: 目的を表す不定詞構文を、移動後に行った活動として自然に表現し、教えることと公に告げ知らせることの区別を保った。
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: 彼らの町々で
  rationale: 古代の πόλις に適した一般的な「町」を選び、複数形を「町々」で表した。αὐτῶν の指示対象は本文で特定せず、ギリシア語の曖昧さを残した。
theological_decisions:
- issue: ἐν ταῖς πόλεσιν αὐτῶν の αὐτῶν が誰を指すか
  choice: 「彼らの町々」として指示対象を特定しない
  alternative: 「弟子たちの町々」「その地方の町々」「ユダヤ人の町々」などと明示する
  rationale: ギリシア語本文は所有代名詞の指示対象を明示していないため、解釈によって一つに限定せず、本文の曖昧さを保った。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての落ち着きと品位を保つ文体とした。「宣べ伝える」は κηρύσσειν の公的な告知の含みを伝える定着表現として採用した。
