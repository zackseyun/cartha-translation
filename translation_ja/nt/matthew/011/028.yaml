  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: ja
  text: 労苦し、重荷を負わされている人はみな、私のもとに来なさい。私があなたがたを休ませよう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「あなたがたに元気を取り戻させよう」とも訳せる。この動詞には、人を休ませる、または元気を取り戻させるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: 私のもとに来なさい
  rationale: 招きを表す命令を、現代日本語で自然かつ直接的に表した。πρός με は人に向かう動きを示すため、「私のもとに」とした。
- source_word: πάντες
  choice: みな
  rationale: 招きが該当する人すべてに及ぶことを、簡潔に保持した。
- source_word: οἱ κοπιῶντες
  choice: 労苦している人
  rationale: κοπιάω の、骨を折って働き疲れるという能動的な意味を保ちつつ、文脈を肉体労働だけに限定しない表現とした。
- source_word: πεφορτισμένοι
  choice: 重荷を負わされている人
  rationale: 完了受動分詞が示す、重荷を負わせられ、その状態が続いているという含みを表した。
- source_word: κἀγώ
  choice: 私が
  rationale: 明示された一人称主語の軽い強調を、日本語の主格助詞「が」で自然に示した。
- source_word: ἀναπαύσω ὑμᾶς
  choice: 私があなたがたを休ませよう
  rationale: 動詞の使役的な意味である「休ませる」を直接表し、約束としての未来的な響きを「よう」で示した。休息の性質は限定しなかった。
theological_decisions:
- issue: ἀναπαύσω が約束する休息の性質
  choice: 「休ませよう」と広く訳し、霊的・終末論的・感情的・身体的な休息のいずれかに限定しない。
  alternative: 「安らぎを与えよう」または「元気を取り戻させよう」
  rationale: この節そのものは休息の様態を一つに定めていないため、解釈上の広がりを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。伝統的な響きに偏りすぎず、命令形は招きとして自然に読める「来なさい」を用いた。
