id: MAT.11.23
reference: Matthew 11:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: ja
  text: また、カペナウムよ。おまえは天にまで上げられるのか。よみにまで下るのだ。[a] カペナウムで行われた力あるわざがソドムで行われていたなら、ソドムは今日まで残っていたであろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「よみ」は死者の領域を指す。ギリシア語は「ハデス」であり、「ゲヘナ」ではない。
    reason: ᾅδηςを最終刑罰の場所と即断することを避け、原語上の区別を明確にするため。
lexical_decisions:
- source_word: Καφαρναούμ
  choice: カペナウム
  rationale: 日本語聖書で広く定着している地名表記を用いた。
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: おまえは天にまで上げられるのか
  rationale: μήを否定の答えを予期する修辞疑問と解し、受動態と空間的比喩を保った。「高くされる」より文脈上自然な「上げられる」とした。
- source_word: ἕως ᾅδου καταβήσῃ
  choice: よみにまで下るのだ
  rationale: καταβαίνωの下降の意味を直接表し、ᾅδηςはゲヘナとの区別を保てる伝統的かつ理解可能な「よみ」とした。ἕωςの対照を「まで」で示した。
- source_word: δυνάμεις
  choice: 力あるわざ
  rationale: 単に「奇跡」と狭めず、実際の行為とそこに現れる力の両面を表した。
- source_word: γενόμεναι ἐν σοί
  choice: おまえのうちで行われた
  rationale: 町を直接呼びかける比喩を保ち、ἐνの場所的意味を「うちで」で表した。
- source_word: ἐγενήθησαν
  choice: 行われていたなら
  rationale: 反実仮想の条件を日本語で自然に示し、直前の「力あるわざ」との結びつきを明確にした。
- source_word: ἔμεινεν ἂν
  choice: 残っていたであろう
  rationale: ἄνを伴う反実仮想の帰結を表し、単数の主語を町としてのソドムに対応させた。
- source_word: μέχρι τῆς σήμερον
  choice: 今日まで
  rationale: 時間的な終点を簡潔な現代日本語で表した。
theological_decisions:
- issue: ᾅδηςの訳語
  choice: よみ
  alternative: 死者の領域／ハデス／地獄
  rationale: 「地獄」として最終刑罰の概念を持ち込まず、死者の領域を指す語として日本語で定着した「よみ」を採用した。原語がゲヘナではない点は脚注で明示した。
- issue: μήを伴う節の構文
  choice: 否定の答えを予期する修辞疑問
  alternative: 「天にまで上げられることはない」という否定文
  rationale: 語順と疑問を導くμήを尊重し、断定的否定へ平板化せず、原文の修辞的な力を保った。
translation_notes:
  register: 町への直接的で厳しい呼びかけを示すため「おまえ」を用いたが、卑俗にはせず、簡潔で荘重な調子を保った。「天にまで」と「よみにまで」の対照、およびソドムとの反実仮想を明瞭にした。
