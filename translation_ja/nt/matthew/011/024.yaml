id: MAT.11.24
reference: Matthew 11:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: ja
  text: しかし、あなたがたに言っておく。裁きの日には、あなたよりもソドムの地のほうが耐えやすい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忍びやすい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 前節までの宣告を受け、厳粛な対比を導く逆接として、現代日本語で自然な「しかし」とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言っておく
  rationale: 複数の聞き手に向けた直接話法の定型句。単なる発言以上の厳粛な告知の響きを、自然な日本語で示す。
- source_word: γῇ Σοδόμων
  choice: ソドムの地
  rationale: γῇを省かず、都市名だけでなく、その地を明示する原文の表現を保った。
- source_word: ἀνεκτότερον
  choice: 耐えやすい
  rationale: 比較級の「より耐えられる、より忍びやすい」を明快な現代日本語で表す。「まだ耐えやすい」も可能だが、原文に明示されない「まだ」は加えなかった。
- source_word: ἔσται
  choice: …のほうが耐えやすい
  rationale: 日本語では未来の時点を示す「裁きの日には」によって未来性が十分伝わるため、明示的な「なるだろう」を加えず自然な述語とした。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 裁きの日には
  rationale: 終末的な裁きの時を指す定型的な表現として、簡潔で格調ある日本語を用いた。
- source_word: ἢ σοί
  choice: あなたよりも
  rationale: 比較を自然に表しつつ、σοίの単数を保持した。文脈上、町が擬人化されて直接呼びかけられている。
theological_decisions:
- issue: 単数形 σοί の指示対象
  choice: 「あなた」と単数で訳し、町への直接の呼びかけを保持する
  alternative: 「あなたがた」または「あなたの町の人々」と展開する
  rationale: ギリシア語は単数で、直前の文脈における町への預言者的な呼びかけを継続している。複数の住民へ解釈的に言い換えない。
- issue: 裁きの比較が示す程度差
  choice: 「ソドムの地のほうが耐えやすい」と比較をそのまま示す
  alternative: 罰の軽重を説明的に補う
  rationale: 原文は裁きの相対的な耐えやすさを述べるが、罰の仕組みまでは説明していないため、神学的説明を本文に加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣告としての格調を保った。「あなたがた」は発言の聞き手、「あなた」は文脈上擬人化された町を指し、原文の複数・単数の対照を維持している。
