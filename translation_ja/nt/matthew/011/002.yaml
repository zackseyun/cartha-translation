reference: Matthew 11:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: ja
  text: さて、ヨハネは牢の中でメシア[a]のなさったことを聞き、自分の弟子たちを通して使いを送った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: Χριστόςを意味訳するか、伝統的に音写するかという訳語上の選択を示すため。
lexical_decisions:
- source_word: δὲ
  choice: さて
  rationale: 物語の場面転換を自然に示す。明示的な時間表現ではないため、時間的な「その時」とはしない。
- source_word: ἀκούσας ἐν τῷ δεσμωτηρίῳ
  choice: 牢の中で…聞き
  rationale: アオリスト分詞の先行する行為を自然な日本語の連用形で表し、拘禁中という場所・状況を保つ。
- source_word: τὰ ἔργα
  choice: なさったこと
  rationale: 個々の奇跡だけに狭めず、メシアの働きや行為全般を含めつつ、現代日本語として自然に表す。
- source_word: τοῦ χριστοῦ
  choice: メシア
  rationale: ここでは固有名のような「キリスト」よりも称号として機能しているため、意味を明示する「メシア」とする。
- source_word: πέμψας διὰ τῶν μαθητῶν αὐτοῦ
  choice: 自分の弟子たちを通して使いを送った
  rationale: διά＋属格の仲介を「通して」で示し、πέμψαςの目的語は次節で明らかになるため、何を送ったかを過度に補わず「使いを送った」とした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての意味が前面に出ている。「キリスト」も伝統的な音写として可能なので脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「牢」は簡潔で一般読者に分かりやすい。「なさったこと」により、イエスの業を自然な敬意を伴って表現した。
