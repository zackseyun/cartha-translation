source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: ja
  text: さて、バプテスマのヨハネの時代から今に至るまで、天の国は暴力を受けている[a]。そして、暴力を振るう者たちがそれを奪い取っている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天の国は力強く進んでおり、強引な者たちがそれを手に入れている。」ここで「暴力を受けている」と訳したギリシア語の動詞は、中動態的な意味にも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: しかし、…から
  rationale: ἀπόの起点を「から」で示し、δέは文脈の転換を表す穏やかな接続として「しかし」とした。
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: バプテスマのヨハネの時代
  rationale: 直訳的な「日々」より、期間を指すギリシア語の慣用を現代日本語で自然に伝える。「バプテスマのヨハネ」は固有の呼称として明確である。
- source_word: ἕως ἄρτι
  choice: 今に至るまで
  rationale: ヨハネの時代から発話時点まで続く時間的範囲を、明瞭で格調ある日本語で表す。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の御国
  rationale: マタイに特徴的な表現を、日本語聖書で理解されやすい尊厳ある語として訳した。「御国」は領域だけでなく支配の含意も保ち得る。
- source_word: βιάζεται
  choice: 暴力を受け
  rationale: 中動態・受動態として解釈が分かれる形である。本文では後続のβιασταίおよびἁρπάζουσινとのつながりが自然な受動的理解を採り、別解は脚注に残した。
- source_word: βιασταὶ
  choice: 暴力を振るう者たち
  rationale: 強引さ・暴力性を持つ人々を指す。文法上の男性複数を日本語で不自然に「男たち」と限定せず、語の意味を明確に表した。
- source_word: ἁρπάζουσιν αὐτήν
  choice: それを奪い取っている
  rationale: ἁρπάζωの強引に奪う意味を保ち、現在形の継続的・生き生きした叙述を自然な日本語で示す。
theological_decisions:
- issue: 御国に関するβιάζεταιの解釈
  choice: 本文では受動的に「天の御国は暴力を受け」とした。
  alternative: 中動態・自動詞的に「天の御国は力強く進んでおり、力ある者たちがそれを手にしている」とも訳せる。
  rationale: この動詞形には真正な文法的・解釈上の曖昧さがある。後半との連続性から受動的理解を本文に採用したが、御国の力強い前進を表す読みも排除せず脚注に明記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書本文としての品位を保った。「暴力を受け／暴力を振るう／奪い取る」により原文の語義的な連鎖を見える形にし、争点となる中動態の読みは脚注で保存した。
