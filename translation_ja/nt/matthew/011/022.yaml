source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: ja
  text: しかし、あなたがたに言っておく。裁きの日には、ティルスとシドンが受ける裁きのほうが、あなたがたが受ける裁きよりも耐えやすい[a]だろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まだましである」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 直前の非難を受けた強い対照を、明瞭で自然な現代日本語で示す。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言っておく
  rationale: 複数の聞き手への直接的で重みのある告知を、自然な日本語で表す。
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: ティルスとシドンのほうが
  rationale: 比較構文の与格を、日本語では比較の当事者を示す「のほうが」で明確に表す。
- source_word: ἀνεκτότερον
  choice: 耐えやすい
  rationale: 「耐えられる」を意味する形容詞の比較級を忠実に表す。日本語では比較対象を明示することで「より」の意味が成立する。
- source_word: ἔσται
  choice: 耐えやすい
  rationale: 未来のコピュラは、「裁きの日には」という未来の時を示す句と文脈によって日本語で自然に表されるため、冗長な「ものとなる」は加えない。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: 裁きの日には
  rationale: 終末的な裁きの時を指す句を、簡潔で定着した日本語として訳す。
- source_word: κρίσεως
  choice: 裁き
  rationale: 有罪判決という結果に限定せず、司法的な審理・判定の出来事という広い意味を保つ。
- source_word: ἢ ὑμῖν
  choice: あなたがたよりも
  rationale: 複数の聞き手を比較の基準として明示し、ギリシア語の比較構造を自然な日本語にする。
theological_decisions:
- issue: 来たるべき裁きの性質
  choice: 裁きの日
  alternative: ある裁きの日
  rationale: 冠詞のないギリシア語表現だが、マタイのこの文脈では認知された終末的な裁きの日を指す。「裁きの日」は余分な教理的説明を加えず、その慣用的・神学的な力を保つ。
- issue: 比較される裁きの程度
  choice: ティルスとシドンのほうが耐えやすい
  alternative: ティルスとシドンは裁きを免れる
  rationale: 本文は裁きの免除ではなく、比較上の耐えやすさだけを述べるため、その緊張を保ち、救済または免罪を推論して加えない。
translation_notes:
  register: 明瞭で現代的ながら威厳のある標準日本語。「言っておく」でイエスの厳粛な告知の力を保ち、「耐えやすい」は原文の簡潔な比較表現を維持した。
