id: MAT.11.5
reference: Matthew 11:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: ja
  text: 目の見えない人たちは見えるようになり、足の不自由な人たちは歩き、重い皮膚病の人たちは清められ、耳の聞こえない人たちは聞こえるようになり、死者たちはよみがえらされ、貧しい人たちには良い知らせ[a]が告げられている。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「貧しい人たちには福音が宣べ伝えられている」。ギリシア語は受動形で、貧しい人たちが良い知らせを受ける側であることを表す。
    reason: lexical_alternative
  - marker: b
    text: この一連の言葉はイザヤ書35:5–6、61:1を響かせており、メシアの働きと結び付けられたしるしを示している。
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: 目の見えない人たち
  rationale: 名詞的に用いられた形容詞を、現代日本語で明瞭かつ自然な人物表現にした。
- source_word: ἀναβλέπουσιν
  choice: 見えるようになり
  rationale: 癒やしの文脈では、単に「見上げる」ではなく、視力を得る、または取り戻すことを表す。以前から見えなかった場合と失明後に回復した場合の両方を含められる表現とした。
- source_word: χωλοὶ περιπατοῦσιν
  choice: 足の不自由な人たちは歩き
  rationale: χωλόςは歩行に障害のある人を指し、περιπατέωの単純な現在形を簡潔な「歩き」で表した。
- source_word: λεπροὶ
  choice: 重い皮膚病の人たち
  rationale: 古代の語が指す病状は現代医学上のハンセン病だけに限定できないため、一般読者に分かりやすく、診断を不当に限定しない表現を選んだ。
- source_word: καθαρίζονται
  choice: 清められ
  rationale: 単なる治癒だけでなく、汚れから清い状態へ回復されるという身体的・宗教的含意と受動態を保った。
- source_word: κωφοὶ ἀκούουσιν
  choice: 耳の聞こえない人たちは聞こえるようになり
  rationale: κωφόςには「口の利けない」の意味もあり得るが、ここではἀκούωとの組み合わせにより聴覚障害を指す。回復の意味が自然に伝わるようにした。
- source_word: νεκροὶ ἐγείρονται
  choice: 死者たちはよみがえらされ
  rationale: ἐγείρονταιの受動形を保ち、死者が外からの働きによって起こされることを表した。
- source_word: πτωχοὶ
  choice: 貧しい人たち
  rationale: 社会経済的な意味とイザヤ書への響きを保持し、霊的な貧しさだけに限定しなかった。
- source_word: εὐαγγελίζονται
  choice: 貧しい人たちには良い知らせが告げられている
  rationale: 受動態と、貧しい人々が知らせの受け手である点を自然な日本語で示した。「福音」という後代の専門用語だけに狭めず、語本来の「良い知らせ」とした。
theological_decisions:
- issue: εὐαγγελίζονταιを「福音」と訳すか「良い知らせ」と訳すか
  choice: 良い知らせが告げられている
  alternative: 福音が宣べ伝えられている
  rationale: メシア的な知らせという含みを保ちつつ、ギリシア語の動詞の基本的意味と受動態を明瞭に表し、教会用語に不必要に限定しない。
- issue: 奇跡の列挙をメシア預言の成就として本文中で明示するか
  choice: 業の列挙をそのまま訳し、イザヤ書との関係は脚注で示す
  alternative: 本文に「預言の成就として」などを補う
  rationale: イザヤ書35章および61章への強い反響はあるが、ギリシア語本文には明示的な成就説明がないため、本文へ解釈を付加しなかった。
- issue: ἐγείρονταιの受動態
  choice: よみがえらされ
  alternative: よみがえる
  rationale: 原文の受動態を保持し、死者を起こす働きの主体を本文が明示していない点もそのまま残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、列挙の簡潔さと荘重さを保った。障害や病気を表す箇所では人物を病状だけで呼ぶ名詞化を避け、「〜人たち」とした。時制は、目の前で確認できる継続的・反復的なしるしを列挙するギリシア語現在形に合わせた。
