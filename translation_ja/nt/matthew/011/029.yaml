reference: Matthew 11:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: ja
  text: わたしのくびきを負い、わたしから学びなさい。わたしは柔和で、心のへりくだった者だからです。そうすれば、あなたがたはあなたがたの魂に安らぎを見いだします。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: わたしのくびきを負い
  rationale: くびきを自分の上に取るという具体的な比喩を保ちつつ、日本語では自然な「くびきを負う」とした。教えや権威を受け入れる含意を説明的に言い換えず、原文の比喩に委ねた。
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: わたしから学びなさい
  rationale: 命令の力と、イエスを源として学ぶというἀπόの意味を明確で自然な現代日本語で表した。
- source_word: ὅτι
  choice: だからです
  rationale: イエスから学ぶべき理由を示す説明的・因果的な働きを明示した。
- source_word: πραΰς
  choice: 柔和
  rationale: 弱さではなく、荒々しくない穏やかな性質を表す語として、聖書的な響きと現代日本語での理解しやすさを両立させた。
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: 心のへりくだった者
  rationale: ταπεινόςの謙遜・低さと、τῇ καρδίᾳが示す内面的な性質を保った。単なる態度ではなく人格の自己描写であることを「者」で表した。
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: 安らぎを見いだします
  rationale: 未来形の約束を保ち、ἀνάπαυσιςを文脈に合う「安らぎ」とした。「休息」よりも魂の内的な安息を自然に伝える。
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: あなたがたは魂に
  rationale: ψυχήを「魂」として保持し、人の内なるいのち・存在全体を指し得る原文の幅を狭めないようにした。日本語として自然になるよう、安らぎが魂にもたらされる形で表現した。
theological_decisions:
- issue: πραΰς καὶ ταπεινὸς τῇ καρδίᾳによるイエスの自己描写
  choice: わたしは柔和で、心のへりくだった者
  alternative: わたしは穏やかで、心の低い者
  rationale: イエスの人格についての自己描写をそのまま保ち、「柔和」と「へりくだり」の双方を明示した。弱さや自己卑下という意味に限定せず、原文の神学的な緊張を説明で解消しないようにした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「くびき」「柔和」「魂」という中心的な聖書語彙と比喩を保持した。命令は丁寧すぎない「学びなさい」とし、イエスの招きとしての威厳を保った。
