  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: ja
  text: 女たちが行く途中、すると番兵のうち何人かが都に入り、起こったことをすべて祭司長たちに報告した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: 女たちが帰る途中
  rationale: 属格絶対による同時的な時間背景を自然な日本語で示した。αὐτῶνの指示対象は直前の女性たちであり、文脈上の移動方向を「帰る」で簡潔に表した。ただし原文自体は目的地を明示しないため脚注を付した。
- source_word: ἰδού
  choice: すると
  rationale: 物理的に「見よ」と命じる語ではなく、物語上の新たな展開へ注意を向ける談話標識として、現代日本語で自然な「すると」を採用した。
- source_word: τινες τῆς κουστωδίας
  choice: 番兵のうち何人か
  rationale: κουστωδίαは墓を警備していた一団を指す。「番兵」により任務を明確にし、τινεςの部分性を「うち何人か」で保持した。
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: 都に入り
  rationale: アオリスト分詞を主動詞に先行する行為として自然に接続した。エルサレムを指す定冠詞付きの「町」は、文脈に即して「都」とした。
- source_word: ἀπήγγειλαν
  choice: 報告した
  rationale: 権威者に出来事を伝達する意味を明確に表す。
- source_word: τοῖς ἀρχιερεῦσιν
  choice: 祭司長たちに
  rationale: 第二神殿期のユダヤ指導層を指すἀρχιερεῖςの標準的で分かりやすい訳語。複数形も保持した。
- source_word: ἅπαντα τὰ γενόμενα
  choice: 起こったことをすべて
  rationale: ἅπανταの包括性と、既に生じた出来事を指すτὰ γενόμεναを自然な語順で保持した。
