reference: Matthew 28:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: ja
  text: わたしがあなたがたに命じたことをすべて守るように、彼らを教えなさい。見よ、わたしはこの時代の終わりまで[a]、いつの日もあなたがたと共にいる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「この時代の完成まで」。ギリシア語の「アイオーン」（αἰών）は、ここでは物質的な世界そのものではなく、「時代」「世」を指す。伝統的には「世の終わりまで」とも訳される。
    reason: 「時代の終わり」の意味を明確にし、世界そのものの消滅を意味すると限定する誤解を避けるため。
lexical_decisions:
- source_word: διδάσκοντες
  choice: 教えなさい
  rationale: 現在分詞で、前節の「弟子としなさい」がどのように行われるかを示す。日本語では文脈上の命令を受けて定動詞とし、継続的に教える働きを自然に表した。
- source_word: τηρεῖν
  choice: 守るように
  rationale: 命令を心に留め、実行するという意味を含む。「従う」だけに狭めず、τηρέω の保持・遵守の幅を保つ。
- source_word: πάντα ὅσα
  choice: ことをすべて
  rationale: 命じられた内容を余すところなく含む包括性を、自然な現代日本語で示す。
- source_word: ἐνετειλάμην
  choice: 命じた
  rationale: イエスが権威をもって指示したことを明確に表し、「教えた」より原語の命令の力を保つ。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 聞き手の注意を強く促す談話標識。現代語として理解可能であり、結びの言葉の荘重さも保つ。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: あなたがたと共にいる
  rationale: 弟子たちへの継続的な臨在の約束を、直接的かつ自然に表す。
- source_word: πάσας τὰς ἡμέρας
  choice: いつの日も
  rationale: 字義的には「すべての日々」。単なる抽象的な「いつも」より、一日一日の継続を感じさせつつ自然な日本語とした。
- source_word: συντελείας
  choice: 終わり
  rationale: ある期間が完結に至ることを表す。本文では明瞭で定着した「終わり」を用い、「完成・完結」の含意は注で補う。
- source_word: αἰῶνος
  choice: この時代
  rationale: 物質的な世界ではなく、終結へ向かう時代・世を指す。日本語の「世の終わり」が世界の消滅と誤解される可能性を避けるため、「この時代」と明示した。
theological_decisions:
- issue: ἕως τῆς συντελείας τοῦ αἰῶνος の終末論的意味
  choice: この時代の終わりまで
  alternative: 世の終わりまで／この時代が完成するまで
  rationale: συντέλεια は完結・完成に至る終わり、αἰών は世界そのものではなく時代・世を表す。物質世界の消滅と断定せず、現在の時代が終結に至るという原文の意味を保った。
- issue: 「わたしはあなたがたと共にいる」という現在形
  choice: 現在形の「いる」を保持
  alternative: 共にいてあげよう／共にあり続ける
  rationale: 未来の約束として言い換えず、ἐγώ εἰμι の強い現在形と継続する臨在の緊張をそのまま示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、ἰδού は結びの荘重さを保つため「見よ」とした。話者イエスの一人称は、一般読者に読みやすい「わたし」を用いた。前節に従属する分詞構文は、日本語で独立して読んでも意味が通る命令文として表した。
