  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: ja
  text: こう言った。「『彼の弟子たちが夜に[a]来て、私たちが眠っている間に彼を[b]盗んだ』と言いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夜の間に」。ギリシア語のνυκτόςは、彼らが来た時を表す副詞的属格。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「彼を」であり、「彼の遺体を」ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 現在分詞で、前節の行為に伴う発言内容を導く。日本語では文脈を受けて独立した叙述とするのが自然である。
- source_word: Εἴπατε
  choice: と言いなさい
  rationale: アオリスト命令法二人称複数の直接的な命令を、現代日本語で明確に表す。
- source_word: ὅτι
  choice: 直接引用の構造で表現
  rationale: 発言内容を導く接続詞。日本語では引用符と「と」によってその機能を自然に示せる。
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: αὐτοῦは文脈上イエスを指すが、日本語では「その弟子たち」より「弟子たち」が自然で、指示対象も明らかである。
- source_word: νυκτὸς
  choice: 夜の間に
  rationale: 時を表す副詞的属格。来た時が夜であったことを、過度に「真夜中」と限定せず表す。
- source_word: ἐλθόντες
  choice: やって来て
  rationale: 主動詞に先立つアオリスト分詞を、日本語では動作の連続として自然に表す。
- source_word: ἔκλεψαν
  choice: 盗んでいった
  rationale: 盗みの行為に加え、そこから連れ去ったという文脈上の動きを自然な日本語で示す。
- source_word: αὐτὸν
  choice: その方を
  rationale: 原文の人称代名詞を保ち、「遺体」と解釈的に言い換えない。
- source_word: ἡμῶν κοιμωμένων
  choice: 私たちが眠っている間に
  rationale: 属格独立構文の同時的な状況を、明瞭な現代日本語で表す。
theological_decisions:
- issue: 捏造された報告における αὐτόν の指示対象
  choice: 人を指す「その方」を用いる
  alternative: 「その遺体」
  rationale: ギリシア語は「遺体」ではなく男性単数の人称代名詞を用いる。文脈上の対象は明らかなため、説明的な語を本文へ加えない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、命令と捏造された報告の直接話法を保った。「その方」は原文の人称代名詞を尊重しつつ、対象への通常の日本語の言及として用いた。
