  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: ja
  text: もしこのことが総督の耳に入ったら[a]、私たちが総督を説得し、あなたがたが心配しなくてすむようにしよう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もしこのことが総督に知られたら」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたがたを心配のない者にしよう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ τοῦτο ἐπὶ τοῦ ἡγεμόνος
  choice: このことが総督の耳に入っても
  rationale: 受動形の「聞かれる」を日本語で自然な慣用表現にし、この件が総督に知られるという文脈上の意味を表した。ἐπί＋属格には「総督の前で」の可能性もあるため、別訳を脚注に残した。
- source_word: ἡγεμόνος
  choice: 総督
  rationale: この文脈ではローマ属州の統治者、すなわちピラトを指すため、「支配者」より具体的な「総督」とした。
- source_word: πείσομεν αὐτόν
  choice: 私たちが総督を説得し
  rationale: πείθωの通常の意味を保ち、総督をなだめる、あるいは納得させるという含みを過度に限定しなかった。代名詞は日本語で指示対象を明確にするため「総督」とした。
- source_word: ὑμᾶς ἀμερίμνους ποιήσομεν
  choice: あなたがたには面倒がかからないようにしよう
  rationale: 直訳は「あなたがたを心配のない者にする」だが、兵士たちが処罰などを心配しなくて済むよう取り計らうという文脈上の結果を、自然な現代日本語で表した。直訳的な意味は脚注に示した。
