  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: ja
  text: 急いで行って、弟子たちにこう告げなさい。『イエスは死者の中からよみがえられた。見なさい、あなたがたより先にガリラヤへ行かれる。そこで彼に会うでしょう。』見なさい、私はあなたがたに告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: 急いで行って
  rationale: 分詞の命令的な働きを自然な現代日本語で表し、ταχύの迅速さも保持した。
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: 死者の中からよみがえられた
  rationale: 神的受動の可能性を保ちつつ、復活を表す日本語として定着した「よみがえられた」を用いた。
- source_word: προάγει ὑμᾶς
  choice: あなたがたより先に……行かれる
  rationale: 先行するという意味を明示し、主語であるイエスへの自然な敬意を表した。
- source_word: ἰδοὺ
  choice: 見なさい／確かに
  rationale: 最初は注意を促す働き、末尾は発言の確実性を強調する談話上の働きに合わせ、文脈に即して訳し分けた。
- source_word: ὄψεσθε
  choice: お会いする
  rationale: 単なる視認ではなく再会の文脈に自然な表現。ただし「見る」という意味を越えて過度に解釈しない範囲にとどめた。
theological_decisions:
- issue: Ἠγέρθη の受動態と復活の行為者
  choice: よみがえられた
  alternative: 神によってよみがえらされた
  rationale: 原文は行為者を明示しないため、神を補わず受動表現を保った。
- issue: προάγει の時制
  choice: 行かれる
  alternative: 先に行っておられる
  rationale: 現在形の生き生きとした叙述を保持し、移動の完了を断定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。天使の命令と告知の緊迫感を簡潔に表した。固有名「イエス」は引用内で主語と目的語を明確にするため補った。
