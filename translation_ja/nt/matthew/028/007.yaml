review_pass:
  verdict: revise
  source_fidelity: 「急いで行って」「死者の中からよみがえられた」「あなたがたより先にガリラヤへ行かれる」は、ταχὺ πορευθεῖσαι、Ἠγέρθη ἀπὸ τῶν νεκρῶν、προάγει ὑμᾶςをおおむね忠実に表している。ただし、二つのἰδοὺは注意を喚起する標識であり、末尾を「確かに」とするよりも同じく「見なさい」と訳すほうが原文の反復と発話行為に忠実である。ὄψεσθεは「会う」でもこの文脈では可能だが、「お会いする」は敬語の方向性を加える。
  naturalness: 改訂文は、天使による緊急の指示として自然な現代標準日本語である。「見なさい、」はやや格調を保つが、原文のἰδοὺに対応する直接的な呼びかけとして明快である。
  terminology: 「よみがえられた」は、行為者を明示しない受動態を維持し、復活の定訳的用法として適切である。「ガリラヤ」および「弟子たち」も適切である。固有名を原文にない箇所で反復せず、「彼」として原文の代名詞に対応させる。
