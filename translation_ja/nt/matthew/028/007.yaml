    rationale: ἰδοὺは文頭の用例と同じ注意喚起・確認の標識であり、「確かに」は命令的な「見よ」の響きと反復を弱める。
  - severity: low
    issue: ὄψεσθεを「お会いする」としている。
    rationale: 再会の場面では「会う」は可能だが、「お会いする」は日本語の敬語関係を加える。「会うでしょう」のほうが中立的で、二人称複数の未来形も明示できる。
