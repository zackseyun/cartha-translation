id: MAT.28.6
reference: Matthew 28:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: ja
  text: あの方はここにはおられません。前に言われたとおり、よみがえらされたのです[a]。さあ、来て、あの方が横たわっていた場所[b]を見なさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「よみがえられた」。ギリシア語の動詞は受動形で、直訳的には「よみがえらされた」。
    reason: alternative_reading
  - marker: b
    text: または「あの方が安置されていた場所」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: あの方はここにはおられません
  rationale: 文脈上の指示対象であるイエスを「あの方」で自然に補い、ὧδεの場所の意味を「ここに」で明確にした。天使がイエスについて語る場面にふさわしい丁寧で品位ある表現として「おられません」を用いた。
- source_word: ἠγέρθη
  choice: よみがえらされたのです
  rationale: ἐγείρωのアオリスト受動形を、日本語でも明示的な受動表現によって保った。復活の文脈なので、単なる「起こされた」ではなく「よみがえらされた」とした。
- source_word: γὰρ
  choice: のです
  rationale: 直前の「ここにはおられません」の理由を示す説明関係を、日本語で自然な「のです」によって表した。
- source_word: καθὼς εἶπεν
  choice: 前に言われたとおり
  rationale: καθώςの一致・対応を「とおり」で示し、発言が復活に先立つことを自然に伝えるため「前に」を補った。
- source_word: δεῦτε
  choice: さあ、来て
  rationale: 相手を招き寄せる呼びかけ・促しを、「さあ」と命令形「来て」の組み合わせで明示した。
- source_word: ἴδετε
  choice: 見なさい
  rationale: その場で確認するよう促すアオリスト命令形を、現代日本語の明確な命令表現で訳した。
- source_word: τὸν τόπον
  choice: 場所
  rationale: 墓の中で遺体が置かれていた具体的な所を、過度に限定せず自然に示す語を選んだ。
- source_word: ὅπου ἔκειτο
  choice: あの方が横たわっていた
  rationale: κεῖμαιの状態的な意味と未完了時制を、「横たわっていた」で保った。日本語で主語を明確にするため「あの方」を補った。
theological_decisions:
- issue: 復活を述べる動詞の態と行為主体
  choice: よみがえらされた
  alternative: よみがえられた
  rationale: ἠγέρθηは受動形なので、復活がその方になされた出来事として語られていることを本文で保った。一方、日本語の伝統的な「よみがえられた」は能動とも尊敬表現とも読めるため、代案として脚注に示した。これは他の箇所で語られるイエス自身の主体性を否定するものではない。
- issue: 墓の中での身体の状態
  choice: 横たわっていた
  alternative: 安置されていた
  rationale: ἔκειτοの状態的な「横たわっている」を優先し、誰かによって置かれたという出来事を本文に明示的に加えなかった。受動的な含みを伝える自然な代案は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、天使の宣言にふさわしい簡潔さと品位を保った。イエスへの言及には自然な敬意を示す「あの方」「おられません」を用いたが、古風な語法や教派固有の表現は避けた。
