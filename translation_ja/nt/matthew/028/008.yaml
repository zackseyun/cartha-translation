  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: ja
  text: 女たちは、急いで墓を離れ、恐れ[a]と大きな喜びを抱き、イエスの弟子たちに知らせるために走って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恐れ」は、この文脈では畏敬の念を含むこともある。
    reason: φόβοςは通常の恐れのほか、この文脈では畏敬の含みを持ち得るため。
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου
  choice: 急いで墓を離れ
  rationale: 分詞句を自然な日本語の連用形で表し、ταχύの迅速さとἀπόの起点を明確にした。μνημεῖονは復活物語の文脈に即して「墓」とした。
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: 恐れと大きな喜びを抱きながら
  rationale: 二つの感情が同時に伴っていたことを示し、φόβοςを「畏れ」だけに限定せず、原文の緊張を保った。
- source_word: ἔδραμον
  choice: 走って行った
  rationale: τρέχωの具体的で生き生きとした動作を弱めず、日本語として行き先へ向かう動きも自然に示した。
- source_word: ἀπαγγεῖλαι
  choice: 知らせるために
  rationale: 不定詞の目的用法を明示した。原文に直接目的語がないため、「そのことを」などの補足は本文に加えなかった。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: μαθηταίを福音書で定着した「弟子たち」とした。日本語では文脈上イエスの弟子たちであることが明白なので、不自然になり得る所有表現は省いた。
theological_decisions:
- issue: 女たちの応答における恐れと喜びの併存
  choice: 恐れと大きな喜び
  alternative: 畏れと大きな喜び
  rationale: φόβοςはこの文脈で畏敬を含み得るが、「畏れ」に限定すると通常の恐れの含意を狭める。そこで本文は広い「恐れ」とし、脚注で文脈上の別の含みを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の語順を機械的に写さず、感情を表す句を先に置いて日本語として自然な流れにした。
