reference: Matthew 28:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: ja
  text: 安息日の後[a]、週の初めの日が明けようとするころ、マグダラのマリアともう一人のマリアが墓を見に来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「安息日の終わりごろ、週の初めの日が明けようとするころ」とも訳せる。冒頭のギリシア語は、「安息日の後」とも「安息日の終わりごろ」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: 安息日の後
  rationale: ὀψέ＋属格は「…の後」を表し得る。復活記事の時間の流れに即してこの意味を本文に採用した。形式上複数の σαββάτων は、ユダヤ的ギリシア語の慣用に従い単数の「安息日」とした。δέ は日本語で不自然な接続語を加えず、文脈上の推移として表した。別解の「安息日の終わりごろ」は脚注に残した。
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: 週の初めの日が明けようとするころ
  rationale: ἐπιφώσκω の夜明けの意味と、εἰς の「…に向かって」という時間的推移を、自然な日本語で表した。μίαν σαββάτων はセム語的な慣用表現なので「週の初めの日」とした。
- source_word: Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία
  choice: マグダラのマリアともう一人のマリア
  rationale: 固有名は日本語聖書で広く理解される形を用い、ἡ ἄλλη Μαρία は人物を区別する自然な表現「もう一人のマリア」とした。
- source_word: θεωρῆσαι τὸν τάφον
  choice: 墓を見に
  rationale: θεωρέω は意識して見る・見守ることを表すが、「調べる」とまで強めず、目的を自然に示す「墓を見に」とした。τάφος はイエスの埋葬所を指すため「墓」と訳した。
theological_decisions:
- issue: 復活記事冒頭の時を示す表現
  choice: 安息日が終わった後、週の初めの日の夜明けごろに女性たちが来たという読み
  alternative: 「安息日の終わりごろ、週の初めの日が明けようとするころ」という読み
  rationale: ὀψὲ σαββάτων には「安息日の後」と「安息日の終わりごろ」の両解釈があり得る。本文では後続の夜明けの表現との流れから前者を採り、原文の真正な曖昧さを失わないよう後者を脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位のある叙述体。原文の時間表現を過度に説明せず、普通の読者に通じる語順に整えた。
