reference: Matthew 28:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: ja
  text: ですから、行って、あらゆる民を弟子とし、彼らに、父と子と聖霊の名へと[a]バプテスマを授けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父と子と聖霊の名において」とも訳せる。ギリシャ語は「名へと」という方向性を表しており、その名が示す方との関係または帰属に入ることを含意する可能性がある。
    reason: εἰς τὸ ὄνομα の方向性を本文で保ちつつ、慣用的な別訳と、原文が持ち得る関係・帰属の含意を正確に示すため。
lexical_decisions:
- source_word: πορευθέντες
  choice: 行って
  rationale: 主命令「弟子としなさい」に先立つアオリスト分詞。日本語では「行って」とすることで、単なる付随状況ではなく派遣の力を自然に保てる。
- source_word: οὖν
  choice: ですから
  rationale: 直前の28章18節で宣言されたイエスの権威を受けた推論・帰結を、明瞭で現代的な日本語で示す。
- source_word: μαθητεύσατε
  choice: 弟子とし
  rationale: 人を弟子にするという使役的な意味を保つ。「弟子にし」も可能だが、「弟子とする」は命令の内容を簡潔かつ端正に表す。
- source_word: πάντα τὰ ἔθνη
  choice: あらゆる民
  rationale: ἔθνηの民族・諸国民という広い範囲を表し、非ユダヤ人だけに限定しない。「すべての国々」よりも、人々を弟子とする文脈に自然に合う。
- source_word: βαπτίζοντες
  choice: バプテスマを授け
  rationale: 弟子とすることに伴う行為を表す分詞。「浸す」として方式を限定せず、現代日本語のキリスト教用語として広く理解される表現を用いる。
- source_word: εἰς τὸ ὄνομα
  choice: 名へと
  rationale: εἰςの方向性を保ち、名によって行うという手段だけでなく、その名との関係・帰属に入る含みを残す。日本語で極端に不自然な「名の中へ」は脚注に示す。
- source_word: τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος
  choice: 父と子と聖霊の
  rationale: 単数の「名」に続く三つの並列された神的称号を簡潔に表す。日本語ではこれらの称号を文脈上明瞭に理解できるため、余分な説明を加えない。
theological_decisions:
- issue: 三者の名へのバプテスマにおける前置詞εἰςの訳
  choice: 名へと
  alternative: 名において／名によって
  rationale: εἰςが持つ「中へ」という方向性と、関係または帰属への導入という含みを保持する一方、特定の秘跡論を本文に持ち込まない。慣用的な別訳は脚注に残す。
- issue: 単数の「名」と父・子・聖霊の並列
  choice: 父と子と聖霊の名
  alternative: 父の名、子の名、聖霊の名
  rationale: 原文では「名」が単数であり、その後に父・子・聖霊が並列される。この構文をそのまま保ち、三つの別個の名であるかのような言い換えを避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宣教命令にふさわしい端正さを保った。「ですから」で前節との論理的つながりを示し、「行って……弟子とし……授けなさい」という流れで、分詞と主命令の関係を自然に表現した。
