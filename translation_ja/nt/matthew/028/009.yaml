source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: ja
  text: すると、イエスが彼女たちに出会い、「喜びなさい」と声をかけられた。[a] 彼女たちは近寄って、その足をつかみ、イエスを礼拝した。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は字義的には複数の相手に対する「喜びなさい」という命令形だが、ここでは挨拶として用いられている。「ごきげんよう」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「イエスの前にひれ伏した」または「イエスに敬意を表した」とも訳せる。ギリシア語は伏礼や敬意を表す行為を指しうるが、ここでは復活の文脈から「礼拝した」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を促し、場面を生き生きと提示する談話標識として明示した。現代日本語ではやや格調があるが、聖書物語の文体として理解しやすい。
- source_word: ὑπήντησεν
  choice: 出会って
  rationale: 道中でイエスが彼女たちに会ったことを簡潔に表し、原文にない方向性を加えない。
- source_word: Χαίρετε
  choice: おはよう
  rationale: 字義的には複数への『喜べ』だが、ここでは通常の挨拶として機能する。朝の出来事という文脈に自然な現代日本語の挨拶を採用し、字義的可能性は脚注に残した。
- source_word: προσελθοῦσαι
  choice: 近寄り
  rationale: 後続する二つの動作に先立って、彼女たちがイエスに接近した順序を自然に示す。
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: その足をしっかり抱き
  rationale: κρατέωの強くつかんで離さない含意と、足に触れた具体的な姿勢を、日本語として自然に表した。
- source_word: προσεκύνησαν αὐτῷ
  choice: イエスを礼拝した
  rationale: 復活後の文脈では単なる敬意以上の宗教的重みがあるため『礼拝した』とした。ただし語自体がひれ伏して敬意を表す行為も指し得るため、脚注で幅を示した。
theological_decisions:
- issue: 復活したイエスに対する προσκυνέω の訳
  choice: イエスを礼拝した
  alternative: イエスの前にひれ伏した／イエスに敬意を表した
  rationale: マタイの復活物語の文脈では礼拝の意味合いが強い。一方、語彙上は身体的な伏礼や臣従の表現も可能なので、その曖昧さを脚注に保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としつつ、『見よ』『礼拝した』によって原文の物語的な力と宗教的重みを保持した。引用内の挨拶は、場面に自然な『おはよう』とした。脚注記号は該当箇所の直後に置いた。
