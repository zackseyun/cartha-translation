  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: ja
  text: 彼を恐れたため、番兵たちは震え、死人のようになった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ
  choice: 〜のため
  rationale: 属格を伴って原因を表し、番兵たちが震えた理由を自然な現代日本語で示す。
- source_word: δὲ
  choice: （明示しない）
  rationale: 弱い接続辞であり、日本語では前後の流れによって十分に表されるため、無理に「そして」などを補わない。
- source_word: φόβου
  choice: 恐れ
  rationale: 語の基本的な意味を保ち、「恐怖」ほど強度を限定しない中立的な表現。
- source_word: αὐτοῦ
  choice: 彼への
  rationale: 直前の御使いを指す人称代名詞として訳し、恐れの対象であることが自然に伝わる形にした。
- source_word: ἐσείσθησαν
  choice: 震え
  rationale: 受動形だが、この文脈では身体的反応として「震える」の意味を自然に表す。
- source_word: οἱ τηροῦντες
  choice: 番兵たち
  rationale: 字義は「見張っている者たち」だが、墓を警護する者たちを指すため、簡潔で明確な表現とした。
- source_word: ἐγενήθησαν
  choice: なった
  rationale: 状態の変化を表す γίνομαι のニュアンスを保持する。
- source_word: ὡς
  choice: ように
  rationale: 同一性ではなく比較であることを明確にする。
- source_word: νεκροί
  choice: 死人
  rationale: 男性複数の番兵を指し、「死人のようになった」という日本語の自然な比喩表現にした。
theological_decisions:
- issue: αὐτοῦ（彼）の指示対象
  choice: 直前に描かれた御使いを指すものとして「彼」とする。
  alternative: 天からの出来事全体を漠然と指すと理解する。
  rationale: 最も近い先行詞は前節の御使いであり、その姿を受けた番兵たちの反応として読むのが文脈上最も自然。ただし本文では「御使い」と説明的に置き換えず、代名詞が持つ指示の余地を保つ。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。原文の因果関係、番兵たちの身体的反応、死者との比較、および状態変化を保った。
