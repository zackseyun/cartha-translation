id: MAT.28.2
reference: Matthew 28:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: ja
  text: すると、見よ、大きな地震が起こった。主の使いが天から降りて来て近寄り、石を転がしてどけ、その上に座っていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδού
  choice: すると見よ
  rationale: 物語の展開を示すκαίと、読者の注意を促すἰδούの力を保ちつつ、現代日本語として簡潔に表した。
- source_word: σεισμὸς ... μέγας
  choice: 大きな地震
  rationale: 語義と語順上の強調を自然な日本語で直接表した。
- source_word: ἄγγελος ... κυρίου
  choice: 主の使い
  rationale: ἄγγελοςを文脈に即して『使い』とし、無冠詞のκυρίουは定型的な表現として『主』とした。
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: 天から降りて来て
  rationale: 分詞の先行動作を保ちながら、日本語の連続動作として自然に訳した。
- source_word: προσελθών
  choice: 近寄り
  rationale: 対象は明示されていないため補わず、接近する動作だけを表した。
- source_word: ἀπεκύλισε τὸν λίθον
  choice: 石を転がして
  rationale: 石を転がして元の位置から退ける動作を表す。日本語では『転がして』で後続動作との流れも保てる。
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: その上に座った
  rationale: 未完了時制は着座後の状態も含み得るが、この物語文では自然な日本語として『座った』とし、『その』が石を指すことを保った。
theological_decisions:
- issue: 地震と御使いの行動の因果関係
  choice: 『…からである』としてγάρの因果説明を明示する
  alternative: 単に出来事を並列し、『というのも』などで緩やかにつなぐ
  rationale: γάρは大きな地震が起こった理由を、主の使いの降下と行動によって説明している。本文がどの動作を直接の原因とするかはそれ以上限定しない。
- issue: 『主』の指示対象
  choice: 『主』と訳し、神またはイエスのどちらかを注釈なしに限定しない
  alternative: 『神の使い』と明示する
  rationale: 原文κυρίουの表現を保持し、この節だけでは指示対象を訳文で過度に特定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。『見よ』は聖書物語における注意喚起の機能を残すため用いた。原文の動作順序とγάρによる説明関係を保ち、対象や時間関係を必要以上に補足していない。
