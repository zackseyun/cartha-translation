  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: ja
  text: その姿[a]は稲妻のようで、衣は雪のように白かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「姿」は「外見」または「容貌」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （訳出しない）
  rationale: ここでは物語を穏やかにつなぐ接続詞であり、日本語では明示しないほうが自然な流れになる。強い対比は表さない。
- source_word: εἰδέα
  choice: 姿
  rationale: 目に見える外観や形を指す。「姿」は自然な現代日本語で、外見全体を表せる。
- source_word: ὡς ἀστραπή
  choice: 稲妻のよう
  rationale: ὡςによる比喩をそのまま保ち、まばゆく印象的な外観との比較を自然な日本語で表す。
- source_word: ἔνδυμα
  choice: 衣
  rationale: 特定の衣服の種類を限定しない一般語であるため、「衣」とした。簡潔で格調を保ちつつ、現代の読者にも理解できる。
- source_word: λευκόν ὡς χιών
  choice: 雪のように白かった
  rationale: 衣の白さを雪にたとえる原文の比較を自然な語順で保持する。明るさなど、原文に明示されない意味は加えない。
theological_decisions:
- issue: αὐτοῦの指示対象
  choice: 直前の文脈で述べられた主の使いを指す代名詞として「その」を用いる。
  alternative: 復活の記事全体からイエスを指すと受け取る可能性。
  rationale: 最も近い先行詞は28章2節の「主の使い」である。ただし、この節では名詞を補わず、原文どおり代名詞による表現を保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、聖書本文にふさわしい簡潔さと品位を保った。「稲妻」「雪」という二つの比喩を並行的に残し、原文にない説明や強調は加えていない。
