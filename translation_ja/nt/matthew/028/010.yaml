source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: ja
  text: そこでイエスは彼女たちに言われた。「恐れてはいけません。行って、わたしの兄弟たちに、ガリラヤへ行くよう伝えなさい。そこで彼らはわたしを見るでしょう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の時間的な続きと場面の展開を、自然な現代日本語で示す。
- source_word: λέγει αὐταῖς ὁ Ἰησοῦς
  choice: イエスは彼女たちに言われた
  rationale: 歴史的現在は日本語の物語文として自然な過去形で表し、女性複数を指す代名詞は文脈上明示した。イエスの発言には簡潔な敬語を用いた。
- source_word: Μὴ φοβεῖσθε
  choice: 恐れることはありません
  rationale: 禁止命令の意味を保ちながら、慰めとして自然で品位ある表現とした。
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: 行って、…伝えなさい
  rationale: 二つの命令を簡潔に保持し、ἀπαγγέλλωの伝言を届ける意味を「伝える」で自然に表した。
- source_word: τοῖς ἀδελφοῖς μου
  choice: わたしの兄弟たち
  rationale: 男性複数の親族語を解釈的な「弟子たち」に置き換えず、原文の家族的表現を保持した。
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ行くよう
  rationale: ἵνα節が伝える間接命令の内容を、自然な日本語の「よう伝える」で表した。
- source_word: κἀκεῖ με ὄψονται
  choice: そこで彼らはわたしに会います
  rationale: ὄψονταιの基本義は「見る」だが、復活したイエスとの対面を予告するこの文脈では、日本語の「会う」が自然であり、目的語「わたし」との結びつきも明瞭である。
theological_decisions:
- issue: 「わたしの兄弟たち」の指示対象
  choice: 原文どおり「わたしの兄弟たち」と訳す
  alternative: 「わたしの弟子たち」と訳す
  rationale: 直近の文脈では弟子たちを指すと考えられるが、本文では解釈語に置換せず、イエスが用いた家族的呼称とその神学的含意を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話には穏やかで品位ある敬体を採用した。「兄弟たち」は原文の男性複数を保持し、説明的な脚注は本文理解に不可欠でないため付していない。
