id: MAT.28.18
reference: Matthew 28:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: ja
  text: イエスは彼らに近づいて語りかけ、こう言われた。「天においても地においても、すべての権威[b]がわたしに与えられている[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしに与えられた」。ギリシア語のアオリスト受動態を、より形式的に訳すとこのようになる。本文は、完了した授与の結果が今も続いていることを表している。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すべての力」。ギリシア語のἐξουσίαは、単なる力そのものよりも、権威、権利、正当な支配権を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 彼らに近づいて
  rationale: 弟子たちの方へ移動してから語ったという空間的な意味を、自然な現代日本語で表した。
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: 彼らに近づいて語りかけ、こう言われた
  rationale: λαλέωの「語る」とλέγωνによる直接話法の導入を、過度に重複した日本語にせず表現した。「語りかける」により、αὐτοῖςが示す相手への発話も明確にした。
- source_word: Ἐδόθη μοι
  choice: わたしに与えられている
  rationale: 受動態を保ちつつ、完了した授与の結果として現在も権威を有するという文脈上の効力を自然な日本語で示した。より形式的な「わたしに与えられた」も可能なので脚注に示した。
- source_word: πᾶσα ἐξουσία
  choice: すべての権威
  rationale: 単数の抽象名詞に伴うπᾶσαを全体性を示す「すべての」とし、ἐξουσίαを単なる能力や力ではなく、正当な支配権を表す「権威」と訳した。
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: 天においても地においても
  rationale: 天と地という二つの領域に及ぶ普遍性を、対句を保った明瞭で格調ある日本語にした。
theological_decisions:
- issue: イエスが普遍的権威を有することの表現
  choice: すべての権威がわたしに与えられている
  alternative: すべての力がわたしにある／すべての権威がわたしに与えられた
  rationale: 原文の受動態を維持し、権威が授けられたという叙述を、単なる内在的能力の主張へ置き換えないようにした。同時に「与えられている」によって、その授与の結果が現在も有効であることを表した。授与者は原文に明示されていないため、本文では補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言にふさわしい簡潔さと格調を保った。「語りかけ、こう言われた」は原文の二つの発話表現を日本語として無理なく反映している。脚注記号は、それぞれが説明する「権威」と「与えられている」の直後に置いた。
