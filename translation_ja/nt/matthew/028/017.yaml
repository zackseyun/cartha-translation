  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: ja
  text: 彼らはイエスを見て、礼拝した。しかし、中には疑った者もいた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ためらった」「心が揺れた」。ギリシア語は、確定した不信というより、迷いやためらいを表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 見ると
  rationale: アオリスト分詞を主動詞に対する時の関係として自然な日本語にし、「見ると」と訳した。
- source_word: προσεκύνησαν
  choice: ひれ伏して礼拝した
  rationale: προσκυνέω が表すひれ伏す行為と、復活したイエスに向けられた礼拝の意味をともに伝えるため、この表現を選んだ。
- source_word: οἱ δὲ
  choice: しかし、中には…者もいた
  rationale: 対照を示す δέ と、先に述べた集団の一部を指す省略的な οἱ を、明瞭で自然な日本語にした。
- source_word: ἐδίστασαν
  choice: 疑う者もいた
  rationale: διστάζω の基本的な意味を本文では「疑う」としつつ、確定した不信ではなく、ためらいや心の揺れを表し得ることを脚注に残した。
theological_decisions:
- issue: 復活したイエスに向けられた προσκυνέω の意味
  choice: ひれ伏して礼拝した
  alternative: ひれ伏した／敬意を表した
  rationale: この語は身体的な伏礼や敬意も表し得るが、マタイの復活物語の文脈では「礼拝」が有力である。身体的な含意も「ひれ伏して」によって保持した。
- issue: διστάζω のニュアンス
  choice: 疑う者もいた
  alternative: ためらう者もいた／心が揺れる者もいた
  rationale: 本文では簡潔な「疑う」を採りつつ、語が必ずしも確定的な不信を意味せず、ためらいや動揺を示し得るという緊張を脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、復活したイエスへの礼拝という場面にふさわしい品位を保った。「中には」により、礼拝した集団と疑った者との関係について原文以上に断定しないよう配慮した。
