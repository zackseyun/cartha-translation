  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: ja
  text: 十一人の弟子たちはガリラヤへ行き、イエスが彼らに指定しておられた山へ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: （訳出せず）
  rationale: 弱い接続辞であり、この一節だけでも日本語の自然な叙述を損なわずに省略できる。「さて」や「しかし」とすると、原文以上に転換や対比を強調する可能性がある。
- source_word: οἱ ἕνδεκα μαθηταί
  choice: 十一人の弟子たち
  rationale: ユダを欠く弟子集団が十一人であることを明示し、μαθηταίには福音書で定着した「弟子」を用いた。
- source_word: ἐπορεύθησαν εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ行き
  rationale: 移動を表す一般的な動詞と方向を、簡潔で自然な現代日本語にした。
- source_word: εἰς τὸ ὄρος
  choice: 山に登った
  rationale: εἰςは山への移動を示す。日本語では「山へ行った」より「山に登った」が自然だが、原文が登攀そのものを明記しているわけではない点を脚注で補った。
- source_word: οὗ
  choice: （関係節として）イエスが彼らに指定しておられた山
  rationale: 場所を受ける関係表現を、日本語では名詞を後置する連体修飾に組み替えた。
- source_word: ἐτάξατο αὐτοῖς
  choice: 彼らに指定しておられた
  rationale: τάσσωの「定める・指定する・指示する」という意味幅のうち、ここではあらかじめ会う場所を定めたという文脈を表す。「命じた」として権威的な含意を強めることは避けた。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で一般的な固有名の表記を用いた。
theological_decisions:
- issue: イエスが会合場所を定めた行為の強さ
  choice: 「指定しておられた」
  alternative: 「命じておられた」「定めておられた」
  rationale: 本文はイエスが前もって場所を示したことを述べるが、命令や職務への任命を必ずしも意味しない。場所の指定という文脈を明確にしつつ、動詞の意味幅は脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「おられた」でイエスへの自然な敬意を表しつつ、過度な古語調は避けた。
