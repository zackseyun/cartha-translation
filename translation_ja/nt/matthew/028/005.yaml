id: MAT.28.5
reference: Matthew 28:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: ja
  text: しかし、天使は女たちに答えて言った。「あなたがたは恐れなくてよいのです。[a] あなたがたが十字架につけられたイエスを捜していることを、わたしは知っていますから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では通常は省略できる「あなたがた」が明示され、慰めの言葉が特に女たちに向けられていることが強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν
  choice: すると…答えて言った
  rationale: δέの穏やかな場面転換を「すると」で表し、ἀποκριθείςとεἶπενから成る物語上の発話導入句を、明瞭さを保って「答えて言った」と訳した。
- source_word: ὁ ἄγγελος
  choice: 御使い
  rationale: 復活の記事では天的な使者を指すため、単なる人間の「使者」ではなく、日本語聖書で広く理解される「御使い」とした。
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: あなたがたは恐れることはありません
  rationale: 禁止・慰めとして自然な日本語にしつつ、明示されたὑμεῖςの強調を主語「あなたがたは」によって保持した。
- source_word: οἶδα γὰρ ὅτι
  choice: …ことは、わたしには分かっています
  rationale: γάρが示す慰めの根拠を文脈上自然につなぎ、οἶδαを現在の確かな認識として表した。
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: 十字架につけられたイエス
  rationale: 完了受動分詞の結果的な状態を含み得る表現として、簡潔で自然な連体修飾にした。
- source_word: ζητεῖτε
  choice: 捜している
  rationale: この場面で特定の人物を見つけようとしている継続中の行為を、現在進行的に表した。
theological_decisions:
- issue: 慰めの言葉における明示的な代名詞ὑμεῖςの強調
  choice: 「あなたがたは」を本文に明示し、脚注で強調を説明する
  alternative: 「恐れることはありません」とだけ訳す
  rationale: 原文は通常省略できる代名詞を明示しており、慰めが特に女たちへ向けられていることを示す。ただし、ほかの者との対比の内容までは本文に補わない。
- issue: 完了受動分詞ἐσταυρωμένονの表現
  choice: 「十字架につけられたイエス」
  alternative: 「十字架につけられているイエス」または「十字架につけられた方イエス」
  rationale: 十字架刑が完了した出来事であることを明確にしながら、その結果的意義を特定の教理表現で過度に説明しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、復活記事にふさわしい品位を保った。「答えて言った」は原文の発話導入句を残すためのやや改まった表現。「御使い」は一般読者にも通じる伝統的な聖書語として採用した。
