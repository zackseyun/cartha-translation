- from: すると、御使いは女たちに答えて言った。「あなたがたは恐れることはありません。[a] 十字架につけられたイエスを捜していることは、わたしには分かっています。」
  to: しかし、天使は女たちに答えて言った。「あなたがたは恐れなくてよいのです。[a] あなたがたが十字架につけられたイエスを捜していることを、わたしは知っていますから。」
  rationale: 原文の慰めとしての命令、δέによる語りの転換、γάρによる理由づけを本文で自然に反映した。明示されたὑμεῖςは「あなたがたは」として保ち、脚注でその強調を説明する。十字架につけられたという完了した受難の表現は、解釈的な教理説明を加えず維持した。
