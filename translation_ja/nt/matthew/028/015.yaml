source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: ja
  text: そこで、彼らはその銀を受け取り、教えられたとおりにした。この話[a]はユダヤ人の間に今日に至るまで広まっている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この報告」。原語は文脈により「言葉」「報告」「話」などを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: 受け取り
  rationale: 前節で祭司長たちが兵士たちに金を与えた流れを受け、授受を自然に表す。『取って』も可能だが、日本語では『受け取り』が文脈に合う。
- source_word: τὰ ἀργύρια
  choice: 銀貨
  rationale: 複数形の語がここでは支払われた銀の金銭を指すため、『銀貨』とした。『金』も自然だが、原語の銀という具体性を残した。
- source_word: ἐποίησαν ὡς ἐδιδάχθησαν
  choice: 教えられたとおりにした
  rationale: 受動形の『教えられた／指示された』という意味を保ちつつ、直前に告げられた偽りの説明を実行したことを簡潔に表す。
- source_word: διεφημίσθη
  choice: 広まり
  rationale: 話やうわさが広く流布することを表す動詞。後続の『今日に至っている』と合わせ、過去に始まり継続する状態を自然な日本語で示す。
- source_word: ὁ λόγος οὗτος
  choice: この話
  rationale: λόγος は『言葉』『報告』『話』などを意味し得る。ここでは兵士たちが流布した説明を指すため『話』が自然だが、曖昧さを脚注に示した。
- source_word: παρὰ Ἰουδαίοις
  choice: ユダヤ人の間に
  rationale: παρά＋与格の『～の間で』という意味を直接表す。物語上、その話が流布した共同体を指し、それ以上の一般化を加えない。
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: 今日に至っている
  rationale: 著者の時点まで継続していることを表す慣用句を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: Ἰουδαίοις が物語上指す範囲と、反ユダヤ的な一般化を避けること
  choice: ユダヤ人の間に
  alternative: ユダヤの人々の間に／ユダヤ地方の人々の間に
  rationale: 原語の通常の共同体的意味を保つ一方、この節の記述をあらゆる時代の全ユダヤ人への評価へ拡張しない。『ユダヤ地方の人々』では地理的意味に限定しすぎる。
- issue: ὁ λόγος οὗτος の指示内容
  choice: この話
  alternative: この報告／この言い伝え
  rationale: 直前に兵士たちへ教え込まれた説明を指すと読むのが文脈上自然である。ただし λόγος の語義は一つに固定できないため、脚注で代案を示す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。『そこで』で前節との因果的・叙事的つながりを示し、『今日に至っている』で継続性を自然に表した。脚注記号 [a] は本文中の対応箇所に置いた。
