id: MAT.28.12
reference: Matthew 28:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: ja
  text: 彼らは長老たちと集まって協議し、兵士たちに多額の銀貨[a]を与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「かなりの量の銀」。ここでは支払いに用いられた銀の貨幣を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: 集まって
  rationale: アオリスト受動分詞がここでは「集まる」という意味で用いられている。主動詞に先立つ行為を、自然な日本語の連用形で表した。
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: 長老たちと
  rationale: 属格を伴う μετά の共同・同伴の意味を簡潔に表した。πρεσβύτεροι はこの指導者層の文脈で定着した「長老」とした。
- source_word: συμβούλιόν τε λαβόντες
  choice: 協議し
  rationale: συμβούλιον λαμβάνω は単に助言を受けるのではなく、相談して方針を決めることを表す。「協議し」はその熟議の意味を保ちつつ自然である。
- source_word: ἀργύρια ἱκανὰ
  choice: 多額の銀貨
  rationale: ἀργύρια は銀または銀の貨幣を指し、ἱκανὰ はここでは十分・相当な数量を表す。支払いの文脈に合う自然な表現とし、銀という原文の要素も保持した。
- source_word: ἔδωκαν
  choice: 与えた
  rationale: δίδωμι の単純なアオリストであり、直接的な訳語を用いた。
- source_word: τοῖς στρατιώταις
  choice: 兵士たちに
  rationale: 彼らは文脈上、番兵の役目をしているが、στρατιώτης の語義そのものは「兵士」であるため、そのまま訳した。
theological_decisions:
- issue: 省略された主語の特定
  choice: 「彼ら」は前節から続く祭司長たちを指す
  alternative: 特定されない複数の人々
  rationale: 分詞と主動詞はいずれも男性複数形で、マタイ28:11の祭司長たちを主語として受け継いでいる。ただし、この節のギリシア語は「祭司長たち」を明示的に繰り返していないため、「彼ら」として連続性と原文の省略を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙述としての簡潔さと格調を保った。「協議し」で共同の熟議を表し、「多額の銀貨」で原文の銀への言及と自然な日本語を両立させた。
