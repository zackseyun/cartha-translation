  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: ja
  text: しかし、彼女は近寄ってイエスの前にひれ伏し[a]、「主よ、私をお助けください」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「礼拝し」。ギリシア語の動詞は、文脈により、ひれ伏して敬意を表すこと、敬意をささげること、または礼拝することを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の応答にもかかわらず女性が願い続けるという、穏やかな逆接を自然に示す。
- source_word: ἐλθοῦσα
  choice: 近寄って
  rationale: イエスのもとへ進み出た動きを、後続の動作と自然につなげて表す。
- source_word: προσεκύνει αὐτῷ
  choice: イエスの前にひれ伏し
  rationale: προσκυνέωが表し得る身体的な伏拝と深い敬意を示しつつ、それが礼拝であったかどうかを本文で断定しない。代名詞の指示対象は文脈上明らかなため「イエス」とした。
- source_word: λέγουσα
  choice: 「…」と言った
  rationale: 付帯する発話を、現代日本語として自然な定動詞で表す。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの重みある呼びかけを保ち、「先生」などに弱めない。
- source_word: βοήθει μοι
  choice: 私をお助けください
  rationale: 切迫した直接的な願いを、敬意を伴う自然な日本語で簡潔に表す。
theological_decisions:
- issue: イエスに対する προσκυνέω の訳し方
  choice: ひれ伏し
  alternative: 礼拝し
  rationale: この動詞は文脈により、ひれ伏して敬意を表すこと、敬意をささげること、または礼拝することを意味し得る。本文では身体的行為を明確にしながら女性の神学的理解を過度に確定せず、「礼拝し」を脚注に残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「ひれ伏す」で切実な懇願と深い敬意を表し、「お助けください」で短い叫びの直接性を保った。
