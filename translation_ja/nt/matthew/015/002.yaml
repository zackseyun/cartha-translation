id: MAT.15.2
reference: Matthew 15:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: ja
  text: 「なぜ、あなたの弟子たちは長老たちの言い伝えを破るのですか。パン[b]を食べるとき、手を洗わない[a]からです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この文脈での手洗いは、単なる衛生上の習慣としてではなく、長老たちの言い伝えに関わるものとして問題にされている。
    reason: cultural_note
  - marker: b
    text: 別訳「食事をするとき」。ギリシア語の「パン」は、食物や食事全体を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う自然で明快な現代日本語。
- source_word: παραβαίνουσιν
  choice: 破る
  rationale: 権威ある規範や言い伝えに違反する意味を、過度に法律的な語調にせず表す。
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: 長老たちの言い伝え
  rationale: παράδοσιςの受け継がれた伝承という意味と、πρεσβύτεροιがこの文脈で権威ある先人・長老を指すことを明確に表す。
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: 手を洗わない
  rationale: νίπτωは身体の一部を洗うことを表す。日本語では所有者が文脈上明らかなため「自分たちの」を省いて自然にした。
- source_word: ὅταν
  choice: とき
  rationale: 現在接続法とともに反復的・習慣的な場面を示し、日本語の「とき」で自然に表せる。
- source_word: ἄρτον
  choice: パン
  rationale: 語の直接的な意味を本文に保持する。一方、食物や食事全体を指し得ることは脚注で示す。
- source_word: ἐσθίωσιν
  choice: 食べる
  rationale: ὅτανに続く習慣的行為を、自然な日本語の非過去形で表す。
- source_word: οὐ γὰρ
  choice: ないからです
  rationale: 前の問いに対する根拠・理由を示すγάρの働きを、日本語として自然な理由節で表す。
theological_decisions:
- issue: 手洗いへの言及の性質
  choice: 本文では長老たちの言い伝えに関する論争として訳し、手洗いの性質を明示的に規定しない。
  alternative: 本文中で「儀式的に手を洗う」と補う、または通常の衛生上の手洗いと解釈する。
  rationale: 本文自体は問題を「長老たちの言い伝え」と結びつけているが、「儀式的」という限定語は用いていない。背景は脚注で説明し、本文に解釈を過剰に持ち込まない。
translation_notes:
  register: 明快で現代的かつ品位ある標準語を用いた。問答の流れを保ち、γάρは「からです」で理由として自然に接続した。「長老たちの言い伝え」は権威ある伝承という含意を保ちつつ、専門用語に偏らない表現とした。
