id: MAT.15.27
reference: Matthew 15:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: ja
  text: 女は言った。「はい、主よ。実際、小犬たち[a]でさえ、その主人たちの食卓から落ちるパンくず[b]を食べます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小犬」は、家で飼われ、食卓のそばにいる犬を指すとも考えられる。原語は「犬」の指小形だが、必ずしも子犬だけを意味しない。
    reason: lexical_alternative
  - marker: b
    text: 「パンくず」は、直訳では「くず」「小さな食べ物のかけら」。原語はパンに限定していない。
    reason: lexical_precision
lexical_decisions:
- source_word: Ναί
  choice: はい
  rationale: 相手の言葉を受け入れる率直な肯定として、現代日本語で自然な「はい」とした。
- source_word: κύριε
  choice: 主よ
  rationale: イエスへの呼びかけとして「主」を用い、敬称としての含みと、イエスの権威を認める可能性の両方を保った。
- source_word: καὶ γὰρ
  choice: けれども、…でさえ
  rationale: 女性は直前の比喩を認めつつ、その比喩の中から願いを支える理由を示している。「けれども」で応答の論理を自然に示し、「でさえ」でκαίの添加・強調を表した。
- source_word: κυνάρια
  choice: 小犬たち
  rationale: 指小形のニュアンスを保持し、野犬よりも家の食卓のそばにいる小さな犬を想起させる訳語とした。
- source_word: ἐσθίει
  choice: 食べます
  rationale: 中性複数主語に単数動詞が伴うギリシア語構文を、日本語では自然な複数主体の一般的行為として表した。
- source_word: ψιχίων
  choice: パンくず
  rationale: 食卓から落ちる小さな食物片という情景を明瞭にする、日本語聖書として自然な表現。原語自体はパンに限定しないため注記した。
- source_word: τῶν πιπτόντων
  choice: 落ちる
  rationale: 現在分詞の一般的・継続的な情景を、簡潔な連体修飾で表した。
- source_word: τραπέζης
  choice: 食卓
  rationale: 単なる家具としての「テーブル」より、食事の場という文脈を明確に伝える。
- source_word: τῶν κυρίων αὐτῶν
  choice: 主人たちの
  rationale: 犬に対する人間の所有・権威関係を示す複数形を保ち、「飼い主」より原語κύριοςとの対応が見える「主人」とした。
theological_decisions:
- issue: イエスへの直接呼称κύριε
  choice: 主よ
  alternative: 先生／だんな様
  rationale: この呼称は丁重な「先生」に近い用法とも理解できるが、マタイ福音書におけるイエスへの呼称が持ちうる神学的な深みを消さず、同時にそれだけに限定しないため「主よ」とした。
- issue: κυνάριαの指小的ニュアンス
  choice: 小犬たち
  alternative: 犬たち／飼い犬たち／子犬たち
  rationale: 厳しい比喩を不必要に強めず、かといって意訳で和らげすぎないよう、原語の指小形を「小犬」で示した。必ずしも幼い犬を意味しないため「子犬」は避けた。
- issue: Ναίとκαὶ γὰρの論理関係
  choice: はい、主よ。けれども、…でさえ
  alternative: そのとおりです、主よ。実際、…も
  rationale: 女性がイエスの比喩を否定せず受け入れながら、その内部から反論ないし願いの根拠を述べる緊張を保った。「けれども」は文脈上の逆接を明示するが、γάρの説明的機能も失わない構成とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。女性の応答が持つ、同意しながら願いを押し進める機知と緊張を自然な日本語で示した。脚注記号は本文末の該当語順にまとめず、出版時の参照を確実にするため本文に明示した。
