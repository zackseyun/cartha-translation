  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ja
  text: 「しかし、彼らは人間の戒めを教えとして教えながら、むなしくわたしを礼拝している。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάτην
  choice: むなしい
  rationale: 「何の益もなく、無駄に」という意味を、神への礼拝が目的を果たしていないという文脈に即して自然な日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 前後のつながりにある穏やかな対比と、引用全体の非難の調子を示す。
- source_word: σέβονταί
  choice: 礼拝しても
  rationale: 神を目的語とする敬意・崇敬を表すため「礼拝する」とした。譲歩表現は、礼拝という行為があっても無益だという日本語の自然な関係を示す。
- source_word: διδάσκοντες
  choice: 教えているからだ
  rationale: 現在分詞が、礼拝がむなしい事情・理由を説明していることを明確な現代日本語で表した。ただし分詞の圧縮された関係には別の表現も可能なため脚注に残した。
- source_word: διδασκαλίας
  choice: 教えとして
  rationale: 後続する「戒め」を、権威ある教えとして教えるという同格的な関係を自然に示す。
- source_word: ἐντάλματα
  choice: 戒め
  rationale: 定められた命令・規則を指し、宗教的文脈と聖書引用の格調に適する。
- source_word: ἀνθρώπων
  choice: 人間の
  rationale: 性別を限定しない総称であり、神に由来するものと人間に由来するものとの対比を明確に保つ。
theological_decisions:
- issue: διδασκαλίας ἐντάλματα ἀνθρώπων の圧縮された統語関係
  choice: 人間の戒めを教えとして教えている
  alternative: 教えとして、人間の戒めを教えている／人間の戒めである教えを教えている
  rationale: 人間に由来する戒めが権威ある教えとして提示されているという意味を、余計な教派的解釈を加えず明確にした。
- issue: 分詞 διδάσκοντες と主節の関係
  choice: 理由を示す「からだ」
  alternative: 「教えながら」として付帯状況を保つ
  rationale: 文脈上、教えている内容が礼拝のむなしさを説明する。ただしギリシア語分詞自体は理由を明示する接続詞ではないため、付帯状況としての訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言書からの引用にふさわしい簡潔で厳粛な調子を保った。「人間」は総称であり、神に由来する戒めとの対比を表す。
