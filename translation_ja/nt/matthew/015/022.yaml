  naturalness: 「見よ」は日常語としては文語的だが、注意喚起のἰδούに対応する聖書本文として自然であり、全体は明瞭な現代標準日本語である。「叫び続けた」と発話内容の接続も読みやすい。
  terminology: 「主よ、ダビデの子よ」はκύριεとυἱὸς Δαυίδの称号性を保つ。「悪霊に取りつかれています」は定着した訳語であり、脚注がδαιμονίζεταιの具体的様態を必要以上に限定しない代替表現を示している。
