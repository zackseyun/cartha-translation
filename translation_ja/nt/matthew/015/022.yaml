id: MAT.15.22
reference: Matthew 15:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: ja
  text: すると、見よ、カナン人の女がその地方から出て来て、叫び続けた。「主よ、ダビデの子よ、私をあわれんでください。娘がひどく悪霊に取りつかれています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪霊にひどく苦しめられています」。
    reason: δαιμονίζεται は悪霊の作用を表すが、その具体的様態を「取りつかれる」と「苦しめられる」のどちらか一方に完全には限定しないため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 物語の中で注意を促す談話標識としての力を保つ。現代日本語ではやや改まった表現だが、聖書本文として明瞭で簡潔。
- source_word: Χαναναία
  choice: カナン人の女
  rationale: マタイが用いる歴史的・民族的呼称をそのまま保ち、マルコ並行箇所の「シリア・フェニキア人」を持ち込まない。
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: その地方から
  rationale: ὅρια の領域・地域という意味を自然な日本語で表す。文脈上、複数形を不自然に直訳する必要はない。
- source_word: ἐξελθοῦσα
  choice: 出て来て
  rationale: アオリスト分詞を、日本語の自然な動作の連続として訳す。語り手の視点に向かう動きも表せる。
- source_word: ἔκραζεν
  choice: 叫び続けた
  rationale: 未完了過去の継続的または反復的な側面を明示する。
- source_word: Ἐλέησόν με
  choice: 私をあわれんでください
  rationale: 切迫した命令・願いを丁寧で自然な祈願表現とし、「あわれみ」という聖書的語彙を保つ。
- source_word: κύριε
  choice: 主よ
  rationale: 「ダビデの子よ」と結びついた呼びかけなので、単なる「先生」よりも敬意とメシア的含意を保持する「主」が適切。
- source_word: υἱὸς Δαυίδ
  choice: ダビデの子
  rationale: 王統とメシア的意義を持つ称号を字義どおりに保つ。
- source_word: κακῶς
  choice: ひどく
  rationale: 娘の状態の深刻さを、過度に医学的にならない自然な現代日本語で表す。
- source_word: δαιμονίζεται
  choice: 悪霊に取りつかれています
  rationale: 悪霊の支配・作用を表す慣用的で明瞭な訳。ギリシア語が作用の具体的様態を厳密には限定しない点は脚注で補う。
theological_decisions:
- issue: メシア的呼びかけの文脈における κύριε
  choice: 主よ
  alternative: 先生／ご主人様
  rationale: 「ダビデの子」と併置されており、単なる礼儀的呼称以上の可能性がある。「主」は敬意とメシア的響きを保ちつつ、女性の信仰理解の程度を本文以上に規定しない。
- issue: δαιμονίζεται の表現
  choice: 悪霊に取りつかれています
  alternative: 悪霊にひどく苦しめられています
  rationale: 本文は悪霊による状態を明確に述べるが、その現象を日本語の「憑依」概念だけに狭めすぎないよう、別訳を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「主よ」「あわれんでください」によって本文の荘重さと切迫感を保った。「叫び続けた」で未完了過去の継続性を伝えた。
