  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: ja
  text: イエスは彼らに言われた。「パンをいくつ持っていますか。」彼らは答えた。「七つ、それに小魚が少しです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魚」とも訳せる。ギリシア語では、小ささを表す形（指小形）が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語現在形で「言う」だが、日本語の物語として自然な過去形にした。イエスへの敬意を表す現代日本語として尊敬表現を用いた。
- source_word: Πόσους ἄρτους
  choice: パンをいくつ
  rationale: ἄρτους は数えられるパンを指す。日本語では「パン」を助数詞なしに「いくつ」で数える表現が自然である。
- source_word: ἔχετε
  choice: 持っていますか
  rationale: 弟子たちが手元に所有しているパンの数を尋ねる現在時制の問いとして明確に訳した。
- source_word: οἱ δὲ εἶπαν
  choice: 彼らは答えた
  rationale: δέ はここでは強い逆接ではなく、応答へと物語を進める。「言った」よりも、直前の問いへの返答であることが自然に伝わる「答えた」とした。
- source_word: Ἑπτά
  choice: 七つ
  rationale: パンの数を示す数詞として自然な日本語にした。
- source_word: ὀλίγα
  choice: 少し
  rationale: 数の少なさを示す語を、小魚について自然に用いられる数量表現で訳した。
- source_word: ἰχθύδια
  choice: 小魚
  rationale: 指小形が示唆する魚の小ささを本文に反映した。ただし文脈によっては単に「魚」と訳す余地もあるため脚注を付した。
theological_decisions: []
