  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: ja
  text: 大勢の群衆がイエスのもとにやって来た。彼らは、口のきけない人[a]、目の見えない人、足の不自由な人、手足に障害のある人[b]、そのほか多くの人を連れて来て、イエスの足もとに置いた。イエスは彼らを癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耳の聞こえない人」とも訳せる。ギリシア語は、耳が聞こえない人、口がきけない人、またはその両方を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は、手足が曲がっている人、欠損している人、または手足の機能に障害がある人を広く指し得る。
    reason: lexical_range
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: イエスのもとにやって来た
  rationale: 「近づく／もとに来る」を表す。日本語の物語として自然になるよう代名詞を「イエス」と明示した。
- source_word: ὄχλοι πολλοί
  choice: 大勢の群衆
  rationale: 多数の人々から成る群衆を自然な現代日本語で表した。
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: 連れて来て
  rationale: 直訳は「自分たちとともに伴って」だが、文脈上は病や障害のある人々を同行させて来たことを示す。
- source_word: κωφούς
  choice: 口のきけない人
  rationale: κωφός は耳が聞こえない人、口がきけない人、またはその両方を指し得る。本文では一つを選び、語義上の曖昧さを脚注に残した。
- source_word: τυφλούς
  choice: 目の見えない人
  rationale: τυφλός の明瞭で自然な訳。現代の一般読者に分かりやすい表現とした。
- source_word: χωλούς
  choice: 足の不自由な人
  rationale: 歩行に障害がある状態を表す χωλός を、侮蔑的に響きにくい現代日本語で訳した。
- source_word: κυλλούς
  choice: 手足に障害のある人
  rationale: κυλλός は手足が曲がっている、欠損している、または機能が損なわれている状態を広く指し得るため、原因や形態を限定しない訳とした。
- source_word: ἑτέρους πολλούς
  choice: そのほか多くの人
  rationale: 列挙された人々以外にも大勢いたことを簡潔に示した。
- source_word: ἔρριψαν
  choice: 横たえた
  rationale: 基本義には「投げる」があるが、ここでは人々をイエスの足もとに置く動作を表す。「投げ出した」として不必要な粗暴さを含ませず、身体状況も考慮して「横たえた」とした。
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: イエスの足もとに
  rationale: イエスのすぐそばに置いたという位置関係を自然に表す。
- source_word: ἐθεράπευσεν αὐτούς
  choice: イエスは彼らを癒やされた
  rationale: 福音書の治癒記事における θεραπεύω の標準的な意味を保ち、敬意を示す自然な日本語とした。
theological_decisions:
- issue: 癒やしの対象を表す αὐτούς の範囲
  choice: 彼ら
  alternative: その人たち全員
  rationale: 男性複数代名詞は連れて来られた人々を指すが、本文だけで「一人残らず」という強調まで加えないよう、単に「彼ら」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。障害を表す語は原文の区別を保ちつつ、現代日本語で不必要に侮蔑的に響く名詞化表現を避けた。短い原文一文を日本語では三文に分け、動作の流れと主語を明確にした。
