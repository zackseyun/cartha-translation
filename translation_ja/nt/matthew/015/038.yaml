source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: ja
  text: 食べた人たちは、女性と子どもを数に入れず、男性が四千人いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「女性と子どもを除いて」。
    reason: χωρίςは、女性と子どもが四千人という人数に含まれないことを示す。本文の「数に入れず」と同義の、より簡潔な表現を示す別訳。
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: 食べた人たちは
  rationale: 冠詞付き分詞を「人たち」と実体詞的に訳した。現在分詞だが、食事を終えた群衆の人数を述べる文脈なので、自然な日本語では完了した出来事として「食べた」とした。δέは弱い接続であり、単独の接続語を加えず文脈に委ねた。
- source_word: ἦσαν τετρακισχίλιοι
  choice: 四千人であった
  rationale: 単純な連結動詞と基数詞による人数の提示を、明瞭で格調を保つ日本語にした。
- source_word: ἄνδρες
  choice: 男が
  rationale: ἀνήρはここで成人男性を指し、後続の女と子どもから区別されているため、一般的な「人々」には広げない。
- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: 女と子どもを除いて
  rationale: χωρίςは、女と子どもが四千人という数に含まれていないことを示す。「除いて」は原文の計数上の除外を簡潔に表す。γυνήはここでは「妻」ではなく一般に「女」、παιδίονは年齢を不必要に狭めず「子ども」とした。
theological_decisions:
- issue: 男女と子どもを区別する人数表現
  choice: 四千人を「男」と明示し、女と子どもはその数から除かれていると訳す。
  alternative: 「四千人の人々」と包括的に訳す。
  rationale: 原文はἄνδρεςを用い、さらに女と子どもを別に挙げる。包括的な「人々」ではこの語彙上の区別が失われるため、原文どおり保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙述としての品位を保った。「男性」より聖書叙述で自然な「男」を選びつつ、原文の性別区分を正確に保持した。脚注標識は該当文末に置いた。
