id: MAT.15.5
reference: Matthew 15:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: ja
  text: しかし、あなたがたは言います。「父または母に、『私から受けられたはずのものは、贈り物[a]です』と言う人は、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「供え物」とも訳せる。ここでは、親を支えるために使えたものを神にささげたものと宣言することを指す。マルコ7章11節では「コルバン」という語が使われている。
    reason: δῶρονの語義の幅と、この箇所での宗教的・社会的背景を示すため。
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: しかし、あなたがたは言います
  rationale: δὲによる直前との対比を「しかし」で示し、λέγετεの現在形を一般的な発言・教えとして自然に訳した。
- source_word: Ὃς ἂν εἴπῃ
  choice: …と言う人は
  rationale: 関係代名詞とἄνを伴う接続法が表す不特定の一般条件を、日本語で自然な「…と言う人は」とした。この節の文が次節へ続くことも保持している。
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: 父または母に
  rationale: 与格の間接目的語を「に」で示した。文脈上本人の父母であることは明らかなため、不自然な所有表現を加えず簡潔にした。
- source_word: Δῶρον
  choice: 供え物
  rationale: δῶρονは一般的な「贈り物」と神にささげる「供え物」の双方を意味し得る。この文脈では神に取り分けられたものを指すため「供え物」が明瞭だが、神への奉献という説明そのものは本文に補わず脚注に置いた。
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: 私から受けられたはずのものは
  rationale: ἐξ ἐμοῦの「私から」という方向と、ὠφεληθῇςの受益・援助の意味を保ちつつ、親が受けるはずだった支援を自然な現代日本語で表した。「もの」として、具体的な金銭や物品などに限定していない。
theological_decisions:
- issue: マタイ本文に「コルバン」という専門語を補うか
  choice: マタイのδῶρονを「供え物」と訳し、「コルバン」は本文に入れない
  alternative: 「コルバン」または「神にささげた供え物」と本文で明示する
  rationale: マタイはマルコ7章11節のκορβᾶνではなくδῶρονを用いている。原文の語彙上の違いを守り、神への奉献という文脈的含意は脚注で説明する。
translation_notes:
  register: 明瞭で現代的かつ敬意ある文体とした。引用の入れ子をかぎ括弧と二重かぎ括弧で示し、15章5節が次節へ続く未完の構文であることを末尾の「人は、」によって保持した。
