id: MAT.15.32
reference: Matthew 15:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: ja
  text: それからイエスは弟子たちを呼び寄せて言われた。「群衆をかわいそうに思う。もう三日も私と一緒にいて、食べる物がない。空腹のまま帰らせたくはない。途中で力尽きるかもしれないからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せて
  rationale: 中動態の分詞が表す、弟子たちを自分のもとへ呼ぶという方向性を、簡潔で自然な日本語で示す。
- source_word: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον
  choice: 群衆がかわいそうだ
  rationale: 深いあわれみを表す動詞を、現代の一般読者に自然に伝わる直接的な表現とした。「群衆を深くあわれんでいる」も可能だが、発話としての自然さを優先した。
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: もう三日も私と一緒にいて
  rationale: προσμένωの継続してとどまる意味と、三日間に及ぶ状況を自然な日本語で表す。「も」により長さを意識する文脈上の含みも伝える。
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: 食べる物がない
  rationale: 食物を持たないというギリシア語の慣用的な意味を、明瞭で自然に表す。
- source_word: ἀπολῦσαι
  choice: 帰らせたくはない
  rationale: 集まった群衆を解散させて帰す場面なので、日本語では「帰らせる」が目的地を過度に補わず自然である。
- source_word: νήστεις
  choice: 空腹のまま
  rationale: 語義上は「食べずに」「何も食べていない」であり、ここでは宗教的断食ではなく食物のない状態を指すため、文脈に即して訳した。
- source_word: μήποτε ἐκλυθῶσιν
  choice: 力尽きるかもしれない
  rationale: μήποτεが示す懸念と、ἐκλύομαιの衰弱して参る意味を自然に表す。「気を失う」ほど意味を限定しない。
- source_word: ἐν τῇ ὁδῷ
  choice: 途中で
  rationale: 帰途を含む道中を指す文脈に合う、簡潔で慣用的な表現。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発話は親しみやすさと品位を両立させた。「かわいそうだ」は軽い同情ではなく文脈上の深いあわれみを表すが、必要以上に説明的な語句は本文へ加えていない。
