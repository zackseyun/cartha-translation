reference: Matthew 15:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: ja
  text: その時、弟子たちが近寄って来て、イエスに言った。「ファリサイ人たちがその言葉[b]を聞いて、気を悪くした[a]のをご存じですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「つまずいた」。直訳的には「つまずかされた」。ここでは、聞いた言葉に気を害し、反発したことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「その言葉」は、直前のイエスの発言を指す。
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を導く時間表現として、自然で明確な日本語にした。
- source_word: προσελθόντες
  choice: 近寄って来て
  rationale: προσέρχομαι の接近の意味を保ちつつ、後続する発言へ自然につなげた。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: ギリシア語には「彼の」に当たる語がないため、明示的に補わなかった。
- source_word: λέγουσιν αὐτῷ
  choice: イエスに言った
  rationale: 歴史的現在を日本語の物語として自然な過去形にし、代名詞の指示対象は明確さのため「イエス」とした。
- source_word: Οἶδας
  choice: ご存じですか
  rationale: 問いとしての οἶδας を、弟子たちがイエスに語る場面にふさわしい自然な敬語で表した。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 現代の一般読者にも宗教集団であることが分かりやすい標準的な表現を採用した。
- source_word: ἀκούσαντες τὸν λόγον
  choice: あのおことばを聞いて
  rationale: λόγος を直前のイエスの発言を指す語として訳し、発言者への敬意を自然な日本語の「おことば」で示した。「あの」は直前の発言への指示を明確にする。
- source_word: ἐσκανδαλίσθησαν
  choice: つまずいた
  rationale: σκανδαλίζω の比喩的な核を保持し、単なる不快感に限定しない訳とした。文脈上の「腹を立てた／反感を抱いた」という含みは脚注で示す。
theological_decisions:
- issue: σκανδαλίζω の反応をどの程度限定して訳すか
  choice: つまずいた
  alternative: 腹を立てた／反感を抱いた
  rationale: 原語は「つまずかせる」を核に、気分を害する、反感を抱くという意味を取り得る。本文では比喩と神学的緊張を残し、文脈的な意味を脚注で補った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての品位を保った。弟子たちからイエスへの発話には「ご存じですか」を用い、λόγος は文脈に即して「あのおことば」とした。脚注記号は対応箇所の直後に配置した。
