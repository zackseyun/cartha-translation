  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: ja
  text: イエスは答えた。「子どもたちのパンを取って、小犬たち[a]に投げるのは、ふさわしくない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小犬」は「家で飼われる犬」または「子犬」とも訳せる。ギリシア語は指小形であり、野良犬というより小さい犬や家庭内の犬を示唆し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: しかし、イエスは答えた
  rationale: 分詞と定動詞を組み合わせた応答表現を、現代日本語で自然な「答えた」とした。主語は文脈上のイエスであり、日本語での明瞭さのため補った。δὲ は直前との応答上の対照を示す「しかし」とした。
- source_word: καλὸν
  choice: ふさわしくない
  rationale: ここでは一般的な善悪よりも、行為の適切さ・妥当性を表すため、「良くない」より文脈に即した「ふさわしくない」とした。
- source_word: λαβεῖν
  choice: 取って
  rationale: パンを手に取り、別の相手に投げ与える比喩の動きを率直に保つ。
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: 子どもたちのパン
  rationale: 属格関係とパンの比喩をそのまま保ち、τέκνα を性別を限定しない「子どもたち」とした。
- source_word: βαλεῖν
  choice: 投げてやる
  rationale: βάλλω の具体的で鮮明な「投げる」を保つ。「やる」は動物に与えるという日本語の自然な関係を表すが、単なる「与える」に弱めない。
- source_word: τοῖς κυναρίοις
  choice: 小犬たち
  rationale: κυνάριον の指小形を反映し、単なる「犬」ではなく「小犬」とした。家庭内の犬や子犬を指し得るが、語だけでは一つに確定できないため脚注で示す。
theological_decisions:
- issue: 子どもと犬の比喩が指す対象と発言の調子
  choice: 本文では「子どもたちのパン」と「小犬たち」という比喩を直接保ち、その指示対象を説明的に補わない。
  alternative: 本文中でイスラエルと異邦人を明示する、または「飼い犬」と確定して発言を和らげる。
  rationale: この節自体は比喩の指示対象を明示しておらず、周辺文脈に委ねている。解釈を本文へ織り込まず、発言の鋭さと後続の応答につながる緊張を保持する。
translation_notes:
  register: 明瞭で現代的ながら品位のある会話文。「投げてやる」により原文の動作性を保ち、「ふさわしくない」で適否を表す。脚注記号は節全体、とりわけ「小犬たち」に関する注として引用文の後に置いた。
