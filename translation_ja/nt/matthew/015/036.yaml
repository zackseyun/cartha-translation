  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: ja
  text: イエスは七つのパンと魚を取り、感謝をささげてからパンを裂き、弟子たちに渡し続けた。弟子たちはそれを群衆に配った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: 取った
  rationale: 食物を手に取って感謝し、裂いて配るという一連の動作を自然に表す。主語の「イエス」は直前の文脈から補った。
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: 七つのパン
  rationale: ἄρτοςはこの給食物語では数えられるパンを指す。「七個のパン」よりも聖書物語として自然で、個数も明確な「七つのパン」とした。
- source_word: τοὺς ἰχθύας
  choice: 魚
  rationale: ギリシア語は複数形だが、日本語の「魚」は無標で複数を表せるため、自然な表現とした。
- source_word: εὐχαριστήσας
  choice: 感謝をささげてから
  rationale: アオリスト分詞が後続の動作に先立つことを明示しつつ、感謝の相手を本文以上に明示しない。「ささげる」は祈りとしての感謝にふさわしい現代日本語である。
- source_word: ἔκλασεν
  choice: パンを裂き
  rationale: 原文では目的語が省略されているが、文脈上、裂く対象はパンである。日本語で曖昧にならないよう補った。魚まで裂いたとの誤解も避ける。
- source_word: ἐδίδου
  choice: 渡し続けられた
  rationale: 未完了過去の継続・反復的な分配を表す。「られた」はイエスへの敬意を示す標準的な敬語であり、受け身ではない。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たちに
  rationale: 与格の受け手を自然に表す。原文にない所有表現「ご自分の」は加えない。
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: 弟子たちはそれを群衆に配った
  rationale: 原文の省略された動詞を日本語では補い、弟子たちが受け取った食物を群衆へ分配したことを明確にした。ὄχλοιの複数性は集合名詞的な「群衆」で自然に表せる。
theological_decisions:
- issue: εὐχαριστήσαςにあり得る聖餐的響き
  choice: 通常の食事の場面における行為として「感謝をささげてから」と訳す
  alternative: 聖餐を前面に出す典礼的な表現を用いる
  rationale: 後の主の晩餐を想起させる可能性は残るが、本文そのものは給食の奇跡において食物を前に感謝する行為を語る。訳文で特定の聖餐理解を付加しない。
- issue: イエスへの敬語
  choice: 「渡し続けられた」と尊敬語で表す
  alternative: 全動作を常体の「取った、裂いた、渡し続けた」で統一する
  rationale: 明瞭で品位ある現代日本語として、イエスの動作には過度でない敬意を示す。ただし神学的意味を動詞に付加しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。原文の動作順序と、ἐδίδουの継続・反復性を保持した。ギリシア語の後半の省略構文は、日本語で意味が通るよう「それを」「配った」を補った。脚注を必要とする実質的な異読・訳語上の曖昧さはない。
