id: MAT.15.31
reference: Matthew 15:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ja
  text: そのため、群衆は、口のきけない人たちが話し[a]、手足の不自由な人たちが健やかになり[b]、足の不自由な人たちが歩き、目の見えない人たちが見えるようになったのを見て驚き、イスラエルの神をあがめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耳の聞こえない人たちが話し」とも訳せる。ギリシア語は、耳の聞こえない人にも口のきけない人にも用いられる。ここでは「話し」との対照から本文の訳を採った。
    reason: lexical_alternative
  - marker: b
    text: 「手足を損なった人たちが元どおりになり」とも訳せる。ギリシア語は、手足に障害や損傷のある人が健全な状態になったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: そのため
  rationale: 直前の癒やしの結果として群衆が示した反応を、自然な現代日本語で表す。
- source_word: τὸν ὄχλον
  choice: 群衆は
  rationale: 物語の場面に合う、明瞭で一般的な訳語。
- source_word: θαυμάσαι
  choice: 驚き
  rationale: 奇跡を目撃した群衆の強い驚嘆を簡潔に表す。
- source_word: βλέποντας
  choice: 見て
  rationale: 群衆が驚いた根拠となる目撃を示す分詞を、自然な接続で訳す。
- source_word: κωφοὺς
  choice: 口のきけない人たち
  rationale: κωφόςには「耳の聞こえない」と「口のきけない」の両義があるが、ここでは「話す」との対照から発話不能を本文に採用する。
- source_word: λαλοῦντας
  choice: 話し
  rationale: 回復した発話能力を直接的に表す。
- source_word: κυλλοὺς
  choice: 手足の不自由な人たち
  rationale: 損傷または障害のある手足を持つ人を指す語を、侮蔑的響きを避けつつ明瞭に表す。
- source_word: ὑγιεῖς
  choice: 健やかになり
  rationale: 形容詞の「健全な、健康な」という状態を保ちつつ、癒やしの結果であることが自然に伝わる形にする。
- source_word: χωλοὺς
  choice: 足の不自由な人たち
  rationale: 歩行に障害のある人を指す語として、明瞭で配慮ある現代日本語を用いる。
- source_word: περιπατοῦντας
  choice: 歩き
  rationale: 癒やされた人々が実際に歩いているという字義どおりの意味を表す。
- source_word: τυφλοὺς
  choice: 目の見えない人たち
  rationale: 視覚のない人々を指す自然で明瞭な表現。
- source_word: βλέποντας
  choice: 見えるようになった
  rationale: 以前は見えなかった人々の視覚が回復したことを、文脈上明確にする。
- source_word: ἐδόξασαν
  choice: あがめた
  rationale: 神に栄誉を帰し、ほめたたえる応答を、自然で尊厳ある日本語で表す。
- source_word: τὸν θεὸν Ἰσραήλ
  choice: イスラエルの神
  rationale: 属格関係をそのまま明瞭に表す定着した訳。
theological_decisions:
- issue: κωφοὺς λαλοῦντας の解釈
  choice: 口のきけない人たちが話し
  alternative: 耳の聞こえない人たちが話し
  rationale: κωφόςの語義には聴覚障害と発話障害の両方が含まれ得る。直後の「話す」との対照から本文では発話障害を採り、別の可能性を脚注に残す。
- issue: κυλλοὺς ὑγιεῖς の表現
  choice: 手足の不自由な人たちが健やかになり
  alternative: 手足を損なった人たちが元どおりになり
  rationale: κυλλόςは手足の障害や損傷を、ὑγιήςは健全な状態を表す。本文では原因や回復の具体的形態を断定せず、語の幅を保つ。
- issue: 神に対する δοξάζω
  choice: イスラエルの神をあがめた
  alternative: イスラエルの神に栄光を帰した
  rationale: 神の働きを見て栄誉を帰すという神学的意味を保ちながら、現代日本語として自然な表現を選ぶ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、奇跡の列挙のリズムを保った。障害を表す語は原文の区別を維持しながら、現代日本語で不必要に侮蔑的に響かない表現とした。「健やかになり」はὑγιεῖςの形容詞的性格と、文脈上の回復結果の双方を伝える。
