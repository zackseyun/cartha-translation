  source_fidelity: ギリシア語の対比構文を忠実に反映している。「これらのものが人を汚す」はταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπονを自然に表し、「洗っていない手で食べることは、人を汚さない」はτὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπονに対応する。τὸν ἄνθρωπονの代表的単数は、日本語の「人」で適切に一般化されている。
  naturalness: 明瞭な現代標準日本語であり、「のであって」によって前後の対照も無理なく示されている。「洗っていない手で食べること」も文脈上自然である。
