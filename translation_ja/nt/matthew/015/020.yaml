id: MAT.15.20
reference: Matthew 15:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: ja
  text: これらのものが人を汚す[a]のであって、洗っていない手で食べることは、人を汚さない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れたものにする」とも訳せる。ここでのギリシア語は、祭儀上汚れた状態にすることを指し得るが、イエスの教えでは道徳的に人を汚す意味にも及んでいる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτά ἐστιν τὰ
  choice: これらのものが
  rationale: 指示語の強調を保ちつつ、直前に列挙された事柄を受ける自然な現代日本語とした。
- source_word: κοινοῦντα / κοινοῖ
  choice: 汚す／汚さない
  rationale: 祭儀上の汚れという文脈と、内面から出る悪が人を道徳的に汚すという広がりの両方を保てる表現である。
- source_word: τὸν ἄνθρωπον
  choice: 人を
  rationale: 単数形による一般的・代表的な意味を、日本語で性別を限定せず自然に表した。
- source_word: ἀνίπτοις χερσὶν
  choice: 洗っていない手で
  rationale: 手洗いをめぐる直近の文脈を明確に伝える、平明で自然な表現である。
- source_word: φαγεῖν
  choice: 食べることは
  rationale: 不定詞を名詞化し、対比される行為を日本語で明瞭に示した。
- source_word: δέ
  choice: のであって、…は
  rationale: 真に人を汚すものと、洗っていない手で食べることとの対照を自然な構文で示した。
theological_decisions:
- issue: 清浄規定をめぐる文脈での κοινόω の意味
  choice: 「汚す」と訳し、祭儀的な汚れと道徳的な汚れの双方に開かれた表現とした。
  alternative: 「汚れたものにする」「清くないものにする」
  rationale: 文脈は祭儀的清浄をめぐる論争だが、イエスの教えは人の内から出る悪へと焦点を移している。「汚す」は、その神学的緊張を狭めずに保つ。
- issue: 一般的用法の単数形 ἄνθρωπον
  choice: 「人」と訳した。
  alternative: 「その人」「人間」
  rationale: ギリシア語の単数形を保ちながら、特定の男性ではなく人一般についての真理であることを自然な日本語で伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「のであって」により前半と後半の強い対照を示しつつ、過度に文語的な表現は避けた。
