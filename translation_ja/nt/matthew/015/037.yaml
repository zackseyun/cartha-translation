  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: ja
  text: 人々は皆、食べて満腹になった。そして、残ったパン切れを拾い集めたところ、かご七つがいっぱいになった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「かご」と訳したギリシア語（スピュリス）は、より大きい種類のかごを指すことがある。別訳「大きなかご七つがいっぱいになった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: 食べて
  rationale: 目的語は原文にも明示されていないため、自然な日本語で簡潔に訳した。
- source_word: πάντες
  choice: 人々は皆
  rationale: 群衆全体を指す複数主語を日本語で自然に補い、全員という範囲を保った。
- source_word: ἐχορτάσθησαν
  choice: 満腹になった
  rationale: 十分に食べて満たされたことを表す。現代日本語として自然で、単なる満足感ではなく食事による充足を明確にする。
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: 残ったパン切れ
  rationale: 「残っているもの」と「ちぎられた断片」の関係を簡潔に表した。文脈上パンの残片であるため、「パン切れ」とした。
- source_word: ἦραν
  choice: 集めると
  rationale: この場面のαἴρωは残片を拾い集める行為を表す。「集めると」により、その結果かごがいっぱいになったという自然な日本語の流れにした。
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: かご七つがいっぱいになった
  rationale: 七つのかごが満杯になったという内容を、数量表現として自然な日本語で示した。σπυρίςの大きさの含意は脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙事文として簡潔かつ品位ある調子にした。「満腹になった」で食事による十分な充足を表し、かごの種類に関する語彙上の含みは本文で断定せず脚注に示した。
