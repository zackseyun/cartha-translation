  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: ja
  text: すると、ペトロはイエスに答えた。「このたとえを私たちに説明してください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「このたとえを私たちに告げてください」「このたとえを私たちに明らかにしてください」。
    reason: φράζωには「告げる」「明らかにする」という意味の幅があるため。
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ … εἶπεν
  choice: そこで、…言った
  rationale: ギリシア語の応答を表す定型的な重複表現を、現代日本語で自然な物語の流れとなるよう簡潔に表した。δὲはここでは強い逆接ではなく展開を示すため、「そこで」とした。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 代名詞の指示対象を文脈から明示し、日本語として分かりやすくした。
- source_word: Φράσον
  choice: 説明してください
  rationale: φράζωは、知らせる、明らかにする、説明するという意味を持つ。この場面では、比喩的な言葉の意味を明らかにするよう求めているため、「説明してください」が最も自然である。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 話し手であるペトロを含む弟子たちを指す与格を明示した。
- source_word: τὴν παραβολὴν ταύτην
  choice: このたとえ
  rationale: παραβολήに一貫した平易な訳語「たとえ」を用い、ταύτηνは直前の言葉を指す「この」とした。
theological_decisions:
- issue: παραβολήが指す発言の性格
  choice: たとえ
  alternative: 比喩／ことば
  rationale: 直前の発言は物語形式のたとえではないが、原文は福音書で広く用いられるπαραβολήを用いている。その用語上の幅を保つため、「たとえ」とした。
translation_notes:
  register: 明瞭で自然な現代標準日本語。ペトロの依頼は丁寧な命令表現としつつ、簡潔で率直な口調を保った。
