id: MAT.15.4
reference: Matthew 15:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ja
  text: というのも、神はこう言われたからです。『父と母を敬いなさい。』また、『父または母をののしる者は、必ず死刑に処せられなければならない[a]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「必ず死ななければならない」。ギリシア語は死の刑罰を表す法的な定型句であり、処刑を行う者は明示していない。
    reason: θανάτῳ τελευτάτωの字義的表現と、法的死刑という文脈上の意味の両方を示すため。
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: 神は……からです
  rationale: γάρが直前の主張の根拠を示すため、日本語では文末の「からです」で因果関係を自然かつ明確に表した。ὁ θεόςは簡潔に「神」とした。
- source_word: εἶπεν
  choice: こう言われた
  rationale: 聖書引用を導入するλέγωの基本義を保ち、「命じられた」と意味を強めず、引用が続くことを「こう」で自然に示した。神への敬意を表す通常の尊敬表現を用いた。
- source_word: Τίμα
  choice: 敬いなさい
  rationale: τιμάωが表す、ふさわしい敬意を払うという倫理的な重みを保つ。「尊敬しなさい」よりも十戒の命令として自然で格調がある。
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: 父と母
  rationale: ギリシア語本文には所有代名詞がなく、日本語でも文脈上「自分の」が自然に理解されるため、明示的に補わなかった。
- source_word: Ὁ κακολογῶν
  choice: ののしる者
  rationale: κακολογέωは悪く言う、侮辱する、呪うという意味範囲を持つ。「ののしる」は法的引用の深刻さを保ちながら、特定の呪詛行為だけに狭めない。定冠詞付き分詞は「者」とした。
- source_word: πατέρα ἢ μητέρα
  choice: 父または母
  rationale: ἤの選択・代替関係を「または」で明示し、無冠詞の一般的な表現を保った。
- source_word: θανάτῳ τελευτάτω
  choice: 必ず死ななければならない
  rationale: 与格θανάτῳと命令形τελευτάτωから成る厳粛な死の刑罰の定型句を反映した。刑罰の確実性と法的な強さを示しつつ、ギリシア語が処刑の主体を明示していない点を保った。
theological_decisions:
- issue: 律法引用における死の刑罰の定型句
  choice: 必ず死ななければならない
  alternative: 必ず死刑に処せられなければならない
  rationale: 引用された律法の厳しさを保ちながら、θανάτῳ τελευτάτω自体が処刑の人的主体を明示していないことも保持した。別訳では法的執行の意味をより明確にできるため脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用い、聖書引用としての品位と法的な厳粛さを保った。「こう言われたからです」によってγάρの論証上の働きを自然に示した。
