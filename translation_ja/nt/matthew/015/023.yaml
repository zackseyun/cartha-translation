  terminology: イエスへの「お答えにならなかった」は本文全体の敬意ある文体として自然である。「去らせてください」はἀπολύωの中立的な『送り去る／立ち去らせる』を保ち、弟子たちが願いをかなえるよう求めたのか、単に遠ざけるよう求めたのかを決めない。
