id: MAT.15.23
reference: Matthew 15:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: ja
  text: しかし、イエスは彼女に一言もお答えにならなかった。そこで弟子たちは近寄って来て、繰り返し願った。「彼女を去らせてください[a]。私たちの後ろで[b]叫んでいますから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼女を去らせてください」という言葉だけでは、弟子たちが「願いをかなえて去らせてください」と求めたのか、それとも単に「ここから立ち去らせてください」と求めたのかは明示されていない。
    reason: alternative_reading
  - marker: b
    text: 別訳「私たちの後を追って」。ギリシア語は、後ろにいる位置を指すことも、後を追うことを指すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: 彼女に一言もお答えにならなかった
  rationale: 「一言も」により、彼女に対して全く返答しなかったというギリシア語の強調を、自然な現代日本語で保った。
- source_word: προσελθόντες
  choice: 近寄って来て
  rationale: 弟子たちがイエスのもとへ近づいた動きを明示し、物語として自然に表した。
- source_word: ἠρώτουν
  choice: 繰り返し願った
  rationale: 未完了過去が示し得る継続・反復を反映した。「懇願した」では語の強さを過度に限定するため避けた。
- source_word: Ἀπόλυσον αὐτήν
  choice: 彼女を帰らせてください
  rationale: ἀπολύωの「去らせる、帰らせる」という意味を自然に表し、願いをかなえて帰すのか、単に追い払うのかを本文では確定しない表現とした。
- source_word: κράζει
  choice: 叫び続けています
  rationale: 大声で訴えていることと、その行為の継続性が文脈上伝わる表現を選んだ。
- source_word: ὄπισθεν ἡμῶν
  choice: 私たちの後ろで
  rationale: 空間的な意味を本文に採用したが、「後を追って」という追随の意味も可能なので脚注に残した。
theological_decisions:
- issue: 弟子たちの「彼女を帰らせてください」という願いの意図
  choice: 彼女の願いをかなえてから帰すのか、単に立ち去らせるのかを確定しない
  alternative: 「願いをかなえて帰してください」または「追い払ってください」と明示する
  rationale: 命令形Ἀπόλυσον αὐτήν自体は、どのように彼女を去らせるのかを明示していない。物語上の緊張と解釈上の余地を保つため、中立的に訳した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、イエスへの叙述には自然な敬意を示す「お答えにならなかった」を採用した。弟子たちの発言は丁寧だが過度に古風ではない語調とし、原文に残る二つの曖昧さは脚注で明示した。
