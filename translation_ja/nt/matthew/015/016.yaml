  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: ja
  text: すると、イエスは言われた。「あなたがたも、まだ分からないのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: すると
  rationale: 弟子たちの問いを受けたイエスの応答への移行を、自然な日本語で示す。強い逆接にしすぎない。
- source_word: ὁ
  choice: イエスは
  rationale: 冠詞が代名詞的に働き、文脈上イエスを指す。日本語では指示対象を明示すると単独の節としても分かりやすい。
- source_word: εἶπεν
  choice: 言われた
  rationale: 物語文における λέγω のアオリストを、イエスへの敬意を保つ自然な日本語で表す。
- source_word: Ἀκμὴν
  choice: まだ
  rationale: 「今に至るまでなお」という継続の意味を、現代日本語の簡潔な表現で伝える。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: 弟子たちまでも理解していない、という強調を保つ。
- source_word: ἀσύνετοί ἐστε
  choice: 分からないのですか
  rationale: 理解や洞察を欠いている状態を明瞭に表しつつ、「愚かだ」など原文以上に道徳的・侮蔑的な響きを強める表現を避ける。
theological_decisions:
- issue: 弟子たちに対するイエスの叱責の強さ
  choice: 「あなたがたも、まだ分からないのですか」
  alternative: 「あなたがたも、まだ悟りがないのですか」
  rationale: 継続する無理解への鋭い問いかけを保ちながら、原文を必要以上に厳しい人格評価として表さない。「分からない」は現代の一般読者に自然で、文脈上の理解不足を明確に伝える。
translation_notes:
  register: 明快な現代標準日本語を用い、問いの簡潔さと叱責の緊張感を保った。「すると」は応答への移行を示し、「まだ」と「も」によって Ἀκμὴν καὶ ὑμεῖς の焦点を自然に再現した。
