  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: ja
  text: しかし、イエスは答えて言われた。「わたしの天の父が植えなかったすべての植えられたものは、根こそぎにされる。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えて言われた
  rationale: 二つの動詞から成る原文の叙述表現を保ちつつ、現代日本語でも聖書の物語文として自然で品位ある言い方とした。主語は文脈上イエスなので明示した。
- source_word: Πᾶσα
  choice: どれも
  rationale: 単数名詞に伴う分配的な意味を自然な日本語で表した。
- source_word: φυτεία
  choice: 植えられたもの
  rationale: 語は「植えられたもの」または「植栽」を意味し得る。後続の「植える」「根こそぎにする」と農耕の比喩を一貫させつつ、その指示対象を教え・伝承・人のいずれかに限定しない表現を選んだ。本文では関係節との重複を避け、「もの」とした。
- source_word: ἐφύτευσεν
  choice: 植えなかった
  rationale: 同語根の農耕的なイメージを直接保った。
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: わたしの天の父
  rationale: 所有関係と「天に属する／天におられる」という限定を簡潔に保つ、日本語聖書として自然な表現とした。
- source_word: ἐκριζωθήσεται
  choice: 根こそぎにされる
  rationale: 未来受動の意味と、根から抜き取る強い農耕・裁きのイメージを明確に表した。
theological_decisions:
- issue: 「植えられたもの」の比喩的指示対象
  choice: 「もの」として比喩を保持し、教え・伝承・人のいずれとも特定しない
  alternative: 「教え」「言い伝え」「人」と解釈して明示する
  rationale: ギリシャ語は文脈上の比喩を開いたままにしているため、解釈上・神学上の緊張を保ち、特定の理解を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「答えて言われた」は原文の二重動詞を保つため採用し、農耕比喩は「植える／根こそぎにする」で一貫させた。
