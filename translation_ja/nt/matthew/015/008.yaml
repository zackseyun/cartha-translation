  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: ja
  text: 「この民は唇でわたしを敬うが、その心[a]はわたしから遠く離れている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「心」は単数形で、ここではこの民全体の内面を一つのものとして表していると考えられる。
    reason: 集合的単数としてのκαρδίαを示すため。
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: この民は
  rationale: λαόςの集合的な「民」とοὗτοςの指示の力を保ち、預言書からの引用にふさわしい簡潔で自然な表現とした。
- source_word: τοῖς χείλεσίν
  choice: 唇で
  rationale: 道具を表す与格として訳し、χέιληの具体的な身体表現を抽象化せずに保った。
- source_word: με τιμᾷ
  choice: わたしを敬う
  rationale: τιμάωの基本的な意味である敬意を示すことを、現代日本語で自然に表した。
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: その心は
  rationale: 単数形καρδίαを保ち、民全体の内面を集合的に示す表現とした。δέの対照は「が」で表した。
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: わたしから遠く離れている
  rationale: 距離を表すπόρρωとἀπέχω ἀπόの意味を自然に伝え、物理的距離の比喩を保った。
theological_decisions:
- issue: 集合的単数の「心」と個々人を表す複数的表現
  choice: 単数の「その心」を採用
  alternative: 彼らの心々／彼らの心
  rationale: ギリシア語のκαρδίαは単数で、民を一つの集団として捉えた内的態度を表す。日本語の「その心」は単数性と集合的な修辞を保てる。
- issue: 神からの隔たりの表現
  choice: 遠く離れている
  alternative: 遠ざかっている
  rationale: 原文は必ずしも離れていく動作や意図を明示せず、距離のある状態を述べるため、その曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用文として簡潔な対句構造を維持し、「唇」と「心」の対照を明確にした。
