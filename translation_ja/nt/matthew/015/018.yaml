id: MAT.15.18
reference: Matthew 15:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: ja
  text: しかし、口から出るものは心から出て来る。それらが人を汚す。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα ἐκ τοῦ στόματος
  choice: 口から出るもの
  rationale: 実体詞的な中性複数分詞を「もの」とし、口から外へ出るという具体的な比喩を自然な日本語で保った。文脈上は言葉を指すが、本文で「言葉」と限定せず、原文の表現の広がりを残した。
- source_word: ἐκ τῆς καρδίας ἐξέρχεται
  choice: 心から出て来る
  rationale: καρδίαを聖書的な内面の中心を表す「心」とし、同じ節に反復される「出る」という動きを日本語でも保持した。中性複数主語に単数動詞が伴うギリシア語の構文は、日本語では数を明示せず自然に表現できる。
- source_word: κἀκεῖνα
  choice: それが
  rationale: 直前の「口から出るもの」全体を受ける指示表現として訳した。日本語では「それら」より「それが」のほうが自然であり、原文の集合的な指示を損なわない。
- source_word: κοινοῖ
  choice: 汚す
  rationale: 清浄・不浄をめぐる文脈で、人を不浄なものとする意味を簡潔に表す。「汚す」は道徳的な汚れと宗教的な不浄の双方を含み得るため、原文の緊張を保てる。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: 定冠詞付き単数はここでは特定の男性ではなく、人を一般的・代表的に指す。日本語の「人」はこの総称的用法を自然かつ正確に伝えるため、性別を付加する「男」は用いなかった。
theological_decisions:
- issue: 人を汚すものの源
  choice: 人を汚すものは心から出て口に現れる、と訳す
  alternative: 発言だけが儀礼的な不浄を生じさせるという狭い理解
  rationale: 直前の文脈は外から入るものと内から出るものを対比している。「心」と「汚す」をそのまま保ち、内面から生じるものが人を汚すという主張を、儀礼面だけにも道徳面だけにも限定しなかった。
- issue: ἄνθρωποςの代表的単数
  choice: 「人」と訳す
  alternative: 「男」または「その人」
  rationale: 原語の文法上の単数は性別を対比するものではなく、人間一般を代表している。現代日本語の「人」がその範囲を最も自然に再現する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「しかし」で対比を示し、「のであり」によって前半の説明と後半の結論を滑らかにつないだ。原文の「口」「心」「出る」「汚す」という主要な身体的・宗教的イメージを保持した。
