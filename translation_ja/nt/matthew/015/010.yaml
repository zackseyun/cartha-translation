  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: ja
  text: そして、群衆を呼び寄せて言われた。「聞いて、理解しなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 物語を前へ進める接続語として、ギリシア語の単純な連結を自然な現代日本語で表す。
- source_word: προσκαλεσάμενος
  choice: 呼び寄せて
  rationale: アオリスト中動態分詞。群衆を自分のもとへ呼ぶ方向性と、主動詞に先立つ動作を簡潔に表す。
- source_word: τὸν ὄχλον
  choice: 群衆を
  rationale: その場に集まっている人々を指す定冠詞付きのὄχλοςを、明瞭で一般的な語に訳す。
- source_word: εἶπεν αὐτοῖς
  choice: 言われた
  rationale: 直訳は「彼らに言った」。日本語では直前の「群衆を」によって相手が明らかなため重複を避け、イエスへの自然な敬意を示す通常の聖書的叙述とした。
- source_word: Ἀκούετε
  choice: 聞いて
  rationale: 現在命令法複数。単に音を耳にするのでなく注意して聞くよう促す命令として自然に表す。
- source_word: συνίετε
  choice: 悟りなさい
  rationale: 聞いた内容の意味を知的に把握することを求める命令。「理解しなさい」も可能だが、教えの意味をよくつかむという文脈に「悟る」が適する。
