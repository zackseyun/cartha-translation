id: MAT.15.14
reference: Matthew 15:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ja
  text: 彼らのことは放っておきなさい。彼らは、目の見えない人たちを導く、目の見えない案内人です。目の見えない人が目の見えない人を導けば、二人とも穴[a]に落ちます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穴」は「溝」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: 彼らのことは放っておきなさい
  rationale: ここでのἀφίημιは「赦す」ではなく、「そのままにする、関わらずにおく」の意。文脈に合う自然な命令として訳した。
- source_word: τυφλοί
  choice: 目の見えない
  rationale: 霊的な認識の欠如を表す比喩だが、解釈を本文に加えず、原文の視覚的比喩を保持した。現代日本語で人を指す表現として配慮ある言い方を用いた。
- source_word: ὁδηγοὶ τυφλῶν
  choice: 目の見えない人たちを導く、目の見えない案内人
  rationale: 属格τυφλῶνを案内の対象として自然に示しつつ、ὁδηγόςを「案内人」として後半の「導く」との語彙的連関を保った。
- source_word: τυφλὸς ... τυφλὸν
  choice: 目の見えない人が目の見えない人を
  rationale: ギリシア語の単数による一般的な格言表現を、日本語でも性別を不必要に限定せず単数的な「人」で表した。
- source_word: ἐὰν ὁδηγῇ
  choice: 導けば
  rationale: ἐάνと接続法による一般条件を、日本語の自然な条件形で表した。
- source_word: ἀμφότεροι
  choice: 二人とも
  rationale: 導く側と導かれる側の双方を指すことを明確かつ簡潔に表した。
- source_word: εἰς βόθυνον
  choice: 穴に
  rationale: βόθυνοςは穴、くぼみ、溝を指しうる。広く通じ、比喩の鮮明さを保つ「穴」を本文に採用し、別訳を脚注に示した。
- source_word: πεσοῦνται
  choice: 落ちます
  rationale: 一般条件の必然的な帰結を示す未来形を、格言として自然な日本語の非過去形で表した。
theological_decisions:
- issue: 「目の見えない」の比喩的意味
  choice: 比喩をそのまま残し、本文では霊的意味を説明しない
  alternative: 「霊的に目が見えない」「ものの分からない指導者」
  rationale: 原文は説明ではなく鮮明な比喩で批判しているため、意味を限定する補足を本文に入れず、修辞的力と解釈上の幅を保った。
- issue: 格言における文法上の男性単数
  choice: 「目の見えない人」と訳す
  alternative: 「目の見えない男」
  rationale: τυφλόςは文法上男性単数だが、ここでは特定の男性ではなく一般的な人を表す格言的用法である。日本語の「人」は原文の代表的単数の意図を自然に伝える。
- issue: 「盲人」か「目の見えない人」か
  choice: 「目の見えない人」
  alternative: 「盲人」
  rationale: 原文の「見えない」という比喩を保持しつつ、普通の現代日本語で明瞭かつ配慮ある表現を選んだ。
translation_notes:
  register: 明瞭で現代的かつ品位ある語調。前半では同語の連続が重くなりすぎないよう「案内人」を用い、後半では格言の反復を保持した。本文中の脚注記号[a]は対象語「導けば」の直後に置いた。
