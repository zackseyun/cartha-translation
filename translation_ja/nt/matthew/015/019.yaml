id: MAT.15.19
reference: Matthew 15:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: ja
  text: というのも、心から出てくるのは、悪い考え、殺人、姦淫、みだらな性行為、盗み、偽証、そして中傷[a]だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「冒瀆」とも訳せる。原語は文脈により、人に対する中傷、または神に対する冒瀆を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας ἐξέρχονται
  choice: 心から出て来るのは……だからです
  rationale: γάρの説明・理由を文末の「からです」で自然に表し、ἐκとἐξέρχονταιが描く、心を源として外へ現れるという比喩を「心から出て来る」で保った。καρδίαは知性だけでなく内なる人全体を指すため、聖書的比喩を保持する「心」とした。
- source_word: διαλογισμοὶ πονηροί
  choice: 悪い思い
  rationale: διαλογισμοίは思考、考え、企てを含み得るが、ここでは過度に「たくらみ」へ限定せず、広い意味を保つ自然な表現とした。
- source_word: φόνοι
  choice: 殺人
  rationale: 不当な人命剝奪を指す語であり、一般的な「殺し」より道徳的・法的な意味が明確な「殺人」とした。日本語では列挙中の複数を名詞自体で標示しなくても複数例を自然に含意できる。
- source_word: μοιχεῖαι
  choice: 姦淫
  rationale: 婚姻関係を侵す性的行為を指す標準的で簡潔な語を用いた。
- source_word: πορνεῖαι
  choice: みだらな性行為
  rationale: πορνείαが指す不適切な性的行為の広がりを保ち、「姦淫」と区別した。「淫行」より現代の一般読者に意味が通じやすい表現を選んだ。
- source_word: κλοπαί
  choice: 盗み
  rationale: 行為を直接かつ自然に表す現代日本語で、列挙にもよくなじむ。
- source_word: ψευδομαρτυρίαι
  choice: 偽証
  rationale: 偽りの証言をすることという、証言・法廷的な含みを簡潔に保つ語を選んだ。
- source_word: βλασφημίαι
  choice: 中傷
  rationale: この一般的な悪徳表では、人に対する名誉毀損的・侮辱的発言を表す可能性が高い。ただし神への冒瀆も語義上可能なため、脚注で残した。
theological_decisions:
- issue: βλασφημίαιが人への中傷か神への冒瀆か
  choice: 本文を「中傷」とする
  alternative: 「冒瀆」または「神を冒瀆すること」
  rationale: 文脈は心から出る諸悪一般の列挙で、対象が神と明示されていないため、人を傷つける発言を含む「中傷」が自然である。しかし原語は神への冒瀆にも用いられるので、その曖昧さを脚注で明示した。
translation_notes:
  register: 明快な現代標準日本語を用い、悪徳表の簡潔な列挙調を保持した。「心」「姦淫」「偽証」は簡潔さと聖書・倫理的文脈での明瞭さを両立する語として採用し、難解になり得る「淫行」は避けた。
