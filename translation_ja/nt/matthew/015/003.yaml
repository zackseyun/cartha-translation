id: MAT.15.3
reference: Matthew 15:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: ja
  text: すると、イエスは彼らに答えた。「なぜあなたがたも、あなたがたの言い伝えのために、神の戒めを破っているのですか」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの言い伝えのせいで、神の戒めを破っているのですか」とも訳せる。
    reason: διά＋対格はここで理由・根拠を表しうる。「言い伝えのために」は、その言い伝えを優先する文脈上の含みも保つ。
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: すると、イエスは彼らに答えた
  rationale: 日本語では「答えて言った」と重ねるより「答えた」が自然であり、応答を表す意味を十分に保つ。主語は文脈上のイエスを明示した。δέは場面の応答的な展開を「すると」で示した。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う自然で明快な現代日本語。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: 直前の弟子たちへの非難に対応して、相手側にも同様の問いを返すκαίの働きを保つ。
- source_word: παραβαίνετε
  choice: 破っている
  rationale: 命令に背く、違反するという意味を、一般読者に分かりやすく、かつ直接的に表す。
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: 神の戒め
  rationale: ἐντολήの聖書的・契約的な響きを保ち、人間の言い伝えとの対照を明確にする。
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: 自分たちの言い伝えのために
  rationale: παράδοσιςを、受け継がれてきた教えや慣行を指す「言い伝え」とした。διά＋対格には原因・理由と目的寄りの含みがあり、「ために」はその幅を保つ。ὑμῶνは対照を明確にするため「自分たちの」とした。
theological_decisions:
- issue: 神の戒めと人間の言い伝えとの対照
  choice: 「神の戒め」と「自分たちの言い伝え」を直接対置する
  alternative: 「神の命令」と「あなたがたの伝統」とする
  rationale: 神の権威と相手方が受け継いだ慣行との緊張を保持する一方、この節があらゆる伝統一般を否定しているかのようには訳さない。
- issue: διὰ τὴν παράδοσιν ὑμῶνの因果・目的の含み
  choice: 「言い伝えのために」
  alternative: 「言い伝えのせいで」または「言い伝えによって」
  rationale: 原文のδιά＋対格は理由・原因を示しうるが、ここでは言い伝えを優先・擁護するために戒めを破るという目的寄りの含みも読みうる。「ために」で曖昧さを保ち、脚注で因果的な訳を示す。
translation_notes:
  register: 明快で品位ある現代標準日本語。問いの鋭さを保ちつつ、過度に古風な「違犯する」や説明的な意訳を避けた。
