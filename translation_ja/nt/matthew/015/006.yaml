id: MAT.15.6
reference: Matthew 15:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: ja
  text: 「その人は、父を敬う必要は全くない[b]。」そして、あなたがたは、自分たちの言い伝えのために、神のことば[a]を無効にしました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「神のことば」の代わりに「神の命令」とあります。
    reason: textual_variant
  - marker: b
    text: ここで「敬う」ことには、単に敬意を示すだけでなく、親の生活を実際に支える責任も含まれていると考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: 父を敬う必要は全くない
  rationale: οὐ μήの強い否定を「全くない」で表しつつ、この文脈では将来の予告ではなく、言い伝えによって親を敬う義務を免れるという意味に取った。τιμάωは十戒との語彙的つながりを保つため「敬う」とした。
- source_word: τὸν πατέρα αὐτοῦ
  choice: 父
  rationale: 本文は単数の「その人の父」と明記している。日本語では主語から所有関係が明らかなため「その人の」を重ねず、母や両親を補わなかった。
- source_word: ἠκυρώσατε
  choice: 無効にしました
  rationale: ἀκυρόωの「効力を失わせる、無効にする」という強い非難を、明瞭な現代日本語で表した。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: SBLGNT本文のλόγονを直接反映した。「神の命令」という異読は脚注に残した。
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: 自分たちの言い伝えによって
  rationale: διά＋対格が示す原因・理由を自然に表し、παράδοσιςはこの文脈で受け継がれた教えを指すため「言い伝え」とした。
theological_decisions:
- issue: 「敬う」に親への物質的扶養を明示するか
  choice: 本文では「敬う」とし、実際的な扶養を含みうることは脚注で示す。
  alternative: 「養う」「扶養する」と訳す。
  rationale: 論争の文脈では親への経済的責任が含意されるが、τιμάω自体はより広い「敬う」であり、親を敬えという戒めとの結びつきを保つ必要がある。
- issue: 近接文脈や異読に合わせて「父または母」「神の命令」とするか
  choice: SBLGNT本文どおり、単数の「父」と「神のことば」を採用する。
  alternative: 「父または母」「神の命令」とする。
  rationale: 与えられたギリシア語本文を優先し、文脈による補完や異読との調和は本文に持ち込まない。重要な異読は脚注に示す。
- issue: οὐ μήを予告的否定と義務免除のどちらとして表すか
  choice: 「必要は全くない」として、義務を免除する趣旨を表す。
  alternative: 「決して敬わないだろう」と予告的に訳す。
  rationale: 直前の言い伝えの規定を受ける文脈では、行動の予告よりも、父を敬う義務がないとする許容・免除の意味が自然である。ただし強い否定は「全く」で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「伝統」よりも、この箇所で人から受け継がれた規定を具体的に示す「言い伝え」を用いた。引用の継続であることを閉じかぎ括弧で示し、καίは論理的帰結を自然に示す「こうして」とした。
