  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: ja
  text: しかし、イエスは答えた。「わたしが遣わされたのは、イスラエルの家の失われた羊たちのもとにだけです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: しかし、イエスは答えた
  rationale: 分詞と定動詞を日本語で自然な一つの応答表現にまとめた。主語は文脈上のイエスであり、日本語で明確にした。δὲの穏やかな対照は「しかし」で表した。
- source_word: Οὐκ ἀπεστάλην εἰ μὴ
  choice: わたしが遣わされたのは…だけです
  rationale: 否定と例外を示す構文を、日本語で自然な限定構文「…のは…だけ」で表し、使命の範囲を明確に保った。
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: 失われた羊
  rationale: 羊の比喩を保持した。ἀπολωλόταはこの文脈では最終的な滅びを断定する「滅びた」よりも、迷い出て失われた状態を示す「失われた」が適切である。
- source_word: οἴκου Ἰσραήλ
  choice: イスラエルの家
  rationale: 聖書的・共同体的な表現を保ち、「イスラエル民族」などの解釈的な言い換えを避けた。
- source_word: εἰς
  choice: ところ
  rationale: 遣わされる対象・行き先を自然な日本語で示すため「ところ」とした。
theological_decisions:
- issue: この発言におけるイエスの使命の範囲
  choice: イスラエルへの限定を、そのまま明確に訳す。
  alternative: イスラエルへの優先順位だけを示すように弱める、または後の異邦人宣教を訳文に織り込む。
  rationale: Οὐκ ... εἰ μὴは明示的な限定を表す。物語内の神学的緊張を保ち、より広い正典的展開によってこの場で解消しない。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準語。「わたし」「遣わされた」「イスラエルの家」により、発言の荘重さと聖書的比喩を保った。引用文末は、断定の強さを保ちつつ通常の対話として自然な「です」とした。
