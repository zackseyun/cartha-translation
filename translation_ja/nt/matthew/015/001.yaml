  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: ja
  text: そのとき、エルサレムから来たファリサイ人と律法学者たちがイエスに近づいて、こう言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: そのころ
  rationale: 次の場面を導入する時間的な談話標識。日本語では「その時」より自然に物語をつなぎ、厳密な直後性を過度に示さない。
- source_word: προσέρχονται
  choice: 近づいて
  rationale: イエスのもとへ進み出る動きを自然な現代日本語で表す。ギリシア語の歴史的現在は、日本語で不自然にならないよう過去の物語叙述に移した。
- source_word: τῷ Ἰησοῦ
  choice: イエスに
  rationale: προσέρχομαιとともに、近づく相手を示す与格を簡潔に表した。
- source_word: ἀπὸ Ἱεροσολύμων
  choice: エルサレムから来た
  rationale: 出所を明示するἀπόを自然に表す。「公式に派遣された」とまでは本文から断定しない。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 歴史的・宗教的集団名として定着した表記を用い、普通の読者に集団であることが分かるよう「派の人々」とした。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: この文脈では単なる筆記者ではなく、律法の解釈・教授に通じた専門家を指すため、現代日本語で意味の明確な定訳を採用した。
- source_word: καὶ
  choice: と
  rationale: 二つの集団を単純に並列する接続を自然な日本語で表した。
- source_word: λέγοντες
  choice: こう言った
  rationale: 次節の直接話法を導く分詞。日本語では独立した述語として処理するのが自然であり、「こう」によって後続の発言を明示した。
theological_decisions:
- issue: 歴史的現在
  choice: 日本語では過去形「近づいて、こう言った」とする
  alternative: 現在形「近づいて来て、こう言う」としてギリシア語の歴史的現在を保つ
  rationale: ギリシア語のπροσέρχονταιは歴史的現在で場面に臨場感を与えるが、日本語の物語で現在形をそのまま用いると不自然または時制転換が強く意識されやすい。物語上の機能を損なわない範囲で自然な過去叙述を選んだ。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「律法学者」によってγραμματεῖςの文脈上の役割を分かりやすくしつつ、彼らの権限や派遣の公式性は本文以上に補わない。
