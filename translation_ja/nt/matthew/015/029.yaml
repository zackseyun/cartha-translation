  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: ja
  text: イエスはそこを去り、ガリラヤ湖のほとりに来られた。そして山に登り、そこに座っておられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: そこを去り
  rationale: アオリスト分詞と場所を表す副詞を、日本語の自然な継起表現として簡潔に訳した。主動詞に先立つ移動を示す。
- source_word: ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: ガリラヤ湖のほとりに来られた
  rationale: παρά＋対格は移動の到達域または岸辺に沿う動きを表し得る。文脈上確実な岸辺への移動を示しつつ、原文以上に経路を限定しない「ほとりに」とした。θάλασσαは固有の地理名称として一般的な「ガリラヤ湖」とした。
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: 山に登り
  rationale: 上方への移動と到達方向を自然な日本語で表した。定冠詞は特定の名山を必ずしも指さないため、日本語では明示しない。
- source_word: ἐκάθητο ἐκεῖ
  choice: そこに座っておられた
  rationale: 未完了過去の継続的な状態を「座っておられた」で保持した。「おられた」はイエスへの自然で節度ある敬意を示す。
