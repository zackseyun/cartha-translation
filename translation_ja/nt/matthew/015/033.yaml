id: MAT.15.33
reference: Matthew 15:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: ja
  text: すると弟子たちはイエスに言った。「この人里離れた所で、これほど大勢の群衆を満腹にするほどのパンを、どこから手に入れられるでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: 言った
  rationale: ギリシア語の歴史的現在だが、現代日本語の物語として自然な過去形で表した。
- source_word: οἱ μαθηταί
  choice: 弟子たち
  rationale: 定冠詞は文脈上すでに知られている一団を示す。「イエスの」は原文に明記されていないため補わない。
- source_word: Πόθεν ἡμῖν
  choice: どこから手に入れられるでしょうか
  rationale: 直訳的には「どこから私たちにあるのか」だが、食物を調達する含意を自然な日本語で明示した。
- source_word: ἐν ἐρημίᾳ
  choice: この人里離れた所で
  rationale: ἐρημίαは無人または寂しい地域を指す。砂漠と限定せず、場面に即した自然な表現とした。
- source_word: ἄρτοι τοσοῦτοι
  choice: これほどのパン
  rationale: ἄρτοιは複数形で字義的には「これほど多くのパン（パンの塊）」だが、日本語ではパンを集合的に表しても数量の意味が保たれる。
- source_word: ὥστε χορτάσαι
  choice: 満腹にするほどの
  rationale: ὥστεと不定詞の結果・程度を「ほどの」で示し、χορτάσαιが単に食べさせるだけでなく十分に食べさせることを表す点を「満腹にする」で保持した。
- source_word: ὄχλον τοσοῦτον
  choice: これほど大勢の群衆
  rationale: τοσοῦτονの強調された規模を、明瞭で自然な現代日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、弟子たちの問いの驚きと困難さが伝わる丁寧な疑問表現とした。「荒野」という聖書的定型語に固定せず、この箇所の地理的意味を「人里離れた所」で表した。
