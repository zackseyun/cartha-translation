  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: ja
  text: イエスはそこを出て、ティルスとシドンの地方へ退かれた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ティルスとシドンの地方へ立ち去られた」。ギリシア語はより中立的にも訳せるが、「退かれた」はマタイがこの動詞を繰り返し用いる際の含みを反映している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: そこを出て
  rationale: 主動詞に先立つ移動を表すアオリスト分詞。日本語では「出て」として自然に動作の順序を示す。
- source_word: ἐκεῖθεν
  choice: そこを
  rationale: 直前の場所からの出発を示す。「そこから出て」より簡潔で自然な「そこを出て」とした。
- source_word: ἀνεχώρησεν
  choice: 退かれた
  rationale: マタイにおける反復的な用法が持つ、単なる出発以上の「身を引く／退く」という含みを保ちつつ、退却の理由や切迫性までは付加しない。
- source_word: εἰς τὰ μέρη
  choice: 地方へ
  rationale: 複数形 μέρη は都市そのものではなく、それらに属する周辺地域を指し得る。「地方へ」は方向と地域性を自然に表す。
- source_word: Τύρου καὶ Σιδῶνος
  choice: ティルスとシドンの
  rationale: フェニキアの二都市に結び付く地方を示す属格。現代日本語で通用する地名表記を用いた。
- source_word: Καὶ
  choice: （独立には訳出せず）
  rationale: 日本語では文頭の「そして」を置かなくても文脈上の連続が明瞭であり、自然な物語文となる。接続関係は語順と文脈で保持される。
theological_decisions:
- issue: 異邦人地域と結び付く場所へのイエスの移動が持つ物語上の含み
  choice: ἀνεχώρησενを「退かれた」とし、移動の理由は明示しない。
  alternative: より中立的に「移られた／立ち去られた」とする、またはより強く「退却された」とする。
  rationale: 原文は単なる移動以上の戦略的な退避を含み得るが、その動機を明言してはいない。「退かれた」はその含みを残しながら、心理的・神学的理由を付加しない。
translation_notes:
  register: 明快な現代標準日本語を用い、敬意を示すためイエスの動作に尊敬語を用いた。「退かれた」は格調を保ちつつ、現代の一般読者にも理解できる表現である。
