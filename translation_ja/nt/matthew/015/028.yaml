reference: Matthew 15:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: ja
  text: そこで、イエスは彼女に答えた。「婦人よ、あなたの信仰は大きい[a]。あなたの願いどおりになるように。」その時から、彼女の娘は癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの信頼は大きい」とも訳せる。ギリシア語の「ピスティス」は、ここではイエスに寄せる信頼を含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 直前のやり取りを受けてイエスの応答が起きたことを示す自然な時間表現。
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: 彼女に答えた
  rationale: ギリシア語の分詞と発話動詞を、日本語で重複感のない一つの発話導入として訳し、αὐτῇも明示した。
- source_word: Ὦ γύναι
  choice: ああ、女よ
  rationale: 呼びかけの強調と荘重さを保つ。γύναιはこの文脈で侮蔑語ではないため、直接的な「女」を用いた。
- source_word: μεγάλη σου ἡ πίστις
  choice: あなたの信仰は大きい
  rationale: 前置されたμεγάληの強調を、自然で明瞭な日本語にした。
- source_word: πίστις
  choice: 信仰
  rationale: この文脈では、女性がイエスに寄せる信頼を含む「信仰」が最も適切。語義上の「信頼」は脚注に残した。
- source_word: γενηθήτω σοι ὡς θέλεις
  choice: あなたの願いどおりになるように
  rationale: 受動命令形の宣言的・実現的な力を保ちながら、日本語として自然に表現した。
- source_word: ἰάθη
  choice: 癒やされた
  rationale: 奇跡による回復を表す受動形を明確に保持した。
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: その時から
  rationale: 直訳は「その時刻から」だが、ここでは出来事が即時に起きたことを示す自然な日本語とした。
theological_decisions:
- issue: πίστιςの訳語
  choice: 信仰
  alternative: 信頼
  rationale: 女性がイエスに信頼して願い続けた文脈では両方の含意がある。「信仰」を本文の標準訳とし、「信頼」という語義上の可能性を脚注で示した。
- issue: γενηθήτωの発話の力
  choice: なるように
  alternative: そうなれ
  rationale: イエスの権威ある宣言という力を保ちつつ、「そうなれ」が日本語で帯びうる過度に命令的・呪文的な響きを避けた。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの呼びかけと宣言には適度な荘重さを残した。「ああ、女よ」は現代の日常会話より高い文体だが、Ὦ γύναιの強調された直接呼称を保持するために採用した。
