id: MAT.15.39
reference: Matthew 15:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: ja
  text: そして、群衆を解散させてから、イエスは舟に乗り、マガダン地方[a]へ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「マガダン」の代わりに「マグダラ」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: 解散させてから
  rationale: アオリスト分詞が主動詞に先立つ行為を表しているため、群衆を立ち去らせた後という時間関係を自然な現代日本語で示した。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: 複数形だが、日本語では集合的な「群衆」が自然であり、文脈上の複数の人々を十分に表せる。
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: 舟に乗り
  rationale: 乗船する具体的な動作を、簡潔で自然な日本語として表した。
- source_word: ἦλθεν
  choice: 行った
  rationale: ἔρχομαιは基本的に「来る」だが、語り手の視点から目的地への移動を述べるこの文脈では、日本語の「行った」が自然である。到着の完了を過度に強調しない。
- source_word: τὰ ὅρια
  choice: 地方
  rationale: 字義的には「境界、領域」だが、複数形は地理的な地域を指す慣用表現であり、「地方」が明確で自然である。
- source_word: Μαγαδάν
  choice: マガダン
  rationale: 指定されたSBLGNT本文の地名を音写した。異読「マグダラ」は脚注に残した。
theological_decisions:
- issue: 節末の地名の本文形
  choice: マガダン
  alternative: マグダラ
  rationale: 神学的判断というより本文批評上の問題である。指定された原語本文のΜαγαδάνを採用し、よく知られた異読は透明性のため脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「イエス」はギリシア語本文では省略された主語だが、直前の文脈上の主語を日本語で明確にするため補った。脚注記号は、異読の対象が分かるよう地名の直後に置いた。
source_grounding:
  english_pob_role: consult_only
