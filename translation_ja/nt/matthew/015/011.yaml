id: MAT.15.11
reference: Matthew 15:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: ja
  text: 口に入るものが人を汚すのではない。口から出るものこそが、人を汚すのである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚す」は、「不浄にする」とも訳せる。ここでは、神の前で清くないものとする意味を含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: 汚す
  rationale: 清浄・不浄という文脈で、人を不浄なものとする意味を表す。「汚す」は儀礼的意味と道徳的意味の双方を保ち、単なる衛生上の汚れには限定しない。
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: 口に入るもの
  rationale: 冠詞付き分詞を実体詞的に自然な日本語で表し、口へ入るという具体的な像を保った。
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: 口から出るもの
  rationale: 冠詞付き分詞を自然に名詞化し、ἐκの起点を「から」で明示した。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: 文脈上、特定の男性ではなく人間一般を代表する単数形であるため、現代日本語で包括的かつ自然な「人」とした。
- source_word: τοῦτο
  choice: ものこそが
  rationale: 指示語による第二節の強調を、日本語では係助詞「こそ」によって明確に表した。
- source_word: οὐ ... ἀλλὰ
  choice: …のではない。…こそが…のである
  rationale: 否定と対照の構造を明瞭にしつつ、教えとしての引き締まった調子を保った。
theological_decisions:
- issue: κοινόωの清浄・不浄に関する含意
  choice: 本文では「汚す」と訳し、清浄規定上の不浄と内面的・道徳的な汚れの響きをともに残す。
  alternative: 「不浄にする」
  rationale: 「不浄にする」は清浄規定とのつながりを明示する一方、意味を儀礼面に狭めて受け取られる可能性がある。「汚す」は文脈上の緊張を保てる。
- issue: ἄνθρωπονの代表的単数
  choice: 「人」と訳す。
  alternative: 「その人」または「人間」
  rationale: ここでは男性に限定せず、人一般を指す。日本語の「人」は単数の代表的用法を自然に表し、原文にない性別の限定を持ち込まない。
translation_notes:
  register: 明快な現代標準日本語。対句を二文に分け、後半のτοῦτοの強調を「こそ」で表した。簡潔で格調を保ちつつ、一般読者に理解しやすい表現とした。
