  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: ja
  text: 口に入るものはすべて胃に入り、便所へ排出されるということが、分からないのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「口に入るものは何であれ……排泄所へ出される」とも訳せる。
    reason: ἀφεδρώνは便所・排泄所を指す語であるため。
lexical_decisions:
- source_word: νοεῖτε
  choice: 分からないのですか
  rationale: ここではイエスの論点を理解することを指す。否定疑問の叱責的な響きを保ちつつ、現代日本語として自然にした。
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: 入るものはすべて
  rationale: 中性単数の冠詞付き分詞が表す一般的な範囲を、自然な日本語で保持した。
- source_word: εἰς τὸ στόμα
  choice: 口から
  rationale: ギリシア語は直訳すれば「口の中へ」だが、日本語では消化経路を述べる際に「口から入る」が最も自然であり、方向性も明確である。
- source_word: κοιλίαν
  choice: 腹
  rationale: この文脈では消化器官・腹部を指す。「胃」よりも語義の幅を保ち、日常的で明瞭な「腹」とした。
- source_word: χωρεῖ
  choice: 入る
  rationale: 消化経路を進んで腹へ至る意味を、簡潔で自然に表した。
- source_word: ἀφεδρῶνα
  choice: 便所
  rationale: 排泄の場所を指す語。「便所」は現代日本語で明確かつ過度にくだけず、古代の設備を現代的な水洗トイレに限定しない。別の語義理解は脚注に示した。
- source_word: ἐκβάλλεται
  choice: 排出される
  rationale: 受動態と身体外へ出される過程を、品位を保った現代日本語で正確に表す。
theological_decisions:
- issue: イエスの発言と儀礼的清浄規定との関係
  choice: 身体の消化・排泄過程についての発言をそのまま訳し、食物をすべて清いと宣言したという説明は加えない。
  alternative: すべての食物が清いとされたことを明示する解釈的な文言を補う。
  rationale: この節自体は身体の過程を述べており、マルコ7:19にある解釈的表現を明示してはいない。本文にない神学的結論を訳文へ持ち込まず、文脈上の緊張を保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。生理的内容を婉曲にぼかしすぎず、同時に不必要に露骨な表現も避けた。
