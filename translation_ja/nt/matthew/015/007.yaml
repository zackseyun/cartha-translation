  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: ja
  text: 偽善者たちよ。イザヤはあなたがたについて、的確に[a]こう預言した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正しく」。
    reason: καλῶςは、預言が聞き手に正しく、また的確に当てはまることを表す。
lexical_decisions:
- source_word: ὑποκριταί
  choice: 偽善者たちよ
  rationale: 複数の呼格による直接的で厳しい非難を、「偽善者たちよ」と明示した。現代日本語でも意味が通り、原文の鋭さを保つ。
- source_word: καλῶς
  choice: 見事に
  rationale: ここではイザヤの預言が聞き手に適切に当てはまることを表す。「見事に」は単なる巧拙ではなく、的確さを自然に伝える。別訳の可能性は脚注に示した。
- source_word: ἐπροφήτευσεν
  choice: 預言して
  rationale: 預言者イザヤとのつながりと、預言行為を表す標準的な聖書用語を保った。
- source_word: περὶ ὑμῶν
  choice: あなたがたについて
  rationale: περί＋属格の「～について」を直接かつ自然に訳した。
- source_word: Ἠσαΐας
  choice: イザヤ
  rationale: 日本語聖書で広く定着している固有名表記を用いた。
- source_word: λέγων
  choice: こう言った
  rationale: 後続する引用を導入する現在分詞の機能を、自然な日本語の引用導入表現で示した。
theological_decisions:
- issue: イエスによる直接的な非難の強さ
  choice: 「偽善者たちよ」という断定的な呼びかけ
  alternative: 「見せかけだけの者たち」などの婉曲表現
  rationale: ὑποκριταίは文脈上、強い道徳的・宗教的非難であるため、語調を弱めずに訳した。
- issue: καλῶςが示す預言の評価
  choice: 預言が聞き手に的確に当てはまるという意味で「見事に」
  alternative: 預言の仕方を評価する「うまく」、または正しさを前面に出す「正しく」
  rationale: 副詞の修飾関係に含まれる曖昧さを保ちつつ、日本語として自然に、イザヤの言葉の適合性を表した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの叱責の鋭さと預言引用を導く荘重さを保った。脚注記号[a]は本文中に付した。
