review_pass:
  verdict: revise
  source_fidelity: ὑποκριταί is accurately rendered as a forceful plural direct address, and イザヤ／預言／あなたがたについて correctly represent the principal Greek terms. However, 「見事に」 can naturally evaluate Isaiah's skill or performance in Japanese, whereas καλῶς here chiefly affirms the aptness or correctness of the prophecy as applied to the hearers. 「的確に」 more clearly preserves that force.
  naturalness: 「見事に預言して、こう言った」 is understandable, but the connective して can make the prophecy and speaking sound like two merely coordinated actions. Placing 「こう」 directly with 「預言した」 makes the quotation-introducing function more natural and direct.
  terminology: 「偽善者たちよ」「イザヤ」「預言」は clear modern standard Japanese and retain the required rebuking and prophetic register. 「的確に」 is preferable to 「見事に」 for καλῶς in this context.
  issues:
  - severity: medium
    issue: 「見事に」はκαλῶςの文脈上の意味をややずらしうる。
    rationale: この副詞は、イザヤの預言が聞き手に対して正しく・的確に当てはまることをいう。日本語の「見事に」は預言の技巧や出来栄えへの称賛とも読まれうる。
  - severity: low
    issue: 引用導入の「こう言った」の結び付きがやや緩い。
    rationale: λέγωνは後続引用を導く分詞なので、「こう預言した」とすることで、引用との関係を日本語で明瞭にできる。
  revised_text: 偽善者たちよ。イザヤはあなたがたについて、的確に[a]こう預言した。
  revised_footnotes:
