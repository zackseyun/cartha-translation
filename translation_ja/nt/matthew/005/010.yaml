  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: ja
  text: '義[a]のために迫害されてきた人たちは幸いである。

    天の国はその人たちのものだからである。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義のために」とも訳せる。ギリシア語は、道徳的な正しさと、神との契約にかなう正しさの両方を含みうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いである
  rationale: 主観的な感情としての「幸福」よりも、神の祝福のもとにある状態を宣言する至福の言葉として自然であり、定型的な重みも保つ。
- source_word: οἱ δεδιωγμένοι
  choice: 迫害されてきた人たち
  rationale: 定冠詞を伴う完了受動分詞の名詞的用法を表し、過去からの迫害と、その結果が現在にも及ぶ含みを日本語で伝える。
- source_word: ἕνεκεν
  choice: のために
  rationale: 迫害の理由を簡潔に示す。「ゆえに」も可能だが、現代の一般読者には「のために」が明瞭である。
- source_word: δικαιοσύνης
  choice: 義
  rationale: 神の意志にかなう正しさ、生き方、関係上の正しさを含みうる語として、簡潔で聖書文脈にも適した「義」を採用する。「正義」の含みは脚注に残す。
- source_word: ὅτι
  choice: だからである
  rationale: 先の幸いの宣言に対する理由を明示する接続として、自然な日本語にした。
- source_word: αὐτῶν
  choice: その人たちのもの
  rationale: 所有を強調するギリシア語の表現を、指示対象が明確な現代日本語で表した。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイ特有の表現を、日本語聖書で広く理解される自然な形で訳す。「国」は領域だけでなく神の王としての支配も含みうる。
theological_decisions:
- issue: δικαιοσύνηの訳し方
  choice: 義
  alternative: 正義
  rationale: ここでは神の意志に沿う正しいあり方や行いを広く指す可能性を保つため「義」とした。ただし、社会的・法的な公正としての「正義」も語義に含まれうるため、脚注で代案を示した。
- issue: 天の国の時制的含意
  choice: 天の国はその人たちのものだからである
  alternative: 天の国はその人たちのものとなるからである
  rationale: 原文のἐστινは現在形であり、将来だけに限定せず現在の帰属を宣言しているため、「ものとなる」ではなく「ものである」とした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。至福の宣言として「幸いである」を用い、完了分詞の結果的な含みは「迫害されてきた」で表した。脚注記号[a]は該当語句を含む第一文の末尾に置いた。
