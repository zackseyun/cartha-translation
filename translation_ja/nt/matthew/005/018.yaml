id: MAT.5.18
reference: Matthew 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: ja
  text: なぜなら、まことに、あなたがたに言います。天地が過ぎ去るまで、律法からイオタ一つ[a]も、小さな筆画一つ[b]も、決して失われることはありません――すべてが実現する[c]まで。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イオタ」はギリシア語アルファベットで最も小さい文字。意訳すると「最小の一文字」。
    reason: lexical_alternative
  - marker: b
    text: 文字を区別する、ごく小さな線や突起のこと。別訳「小さなしるし一つ」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「すべてが起こる」「すべてが成就する」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: イエスが権威ある宣言を導入する厳粛な肯定として、現代日本語でも自然で格調のある表現を採用した。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の発言を根拠づける説明的な接続を明示した。文脈から切り離しても機能が分かる表現である。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 二人称複数と、イエスの直接的で権威ある語調を保った。
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天地が過ぎ去るまでは
  rationale: 宇宙的な範囲を表す定型的な『天地』を用い、παρέρχομαιの終末的含意を狭めず『過ぎ去る』とした。
- source_word: ἰῶτα ἓν
  choice: イオタ一つ
  rationale: 原文が具体的に名指す最小のギリシア文字を保持し、その意味は脚注で説明した。慣用句『一点一画』だけにすると、文字と筆画の区別が見えにくくなるため避けた。
- source_word: μία κεραία
  choice: 小さな一画一つ
  rationale: 文字を区別するごく小さな突起・線という像を、現代日本語で理解できるように表した。
- source_word: οὐ μὴ παρέλθῃ
  choice: 決して消え去ることはありません
  rationale: οὐ μήと接続法による強い否定を『決して…ありません』で表現した。律法から書記要素が失われる比喩に合うよう『消え去る』を用いた。
- source_word: ἀπὸ τοῦ νόμου
  choice: 律法から
  rationale: 文脈上、聖書に記された神の律法を指すため、日本語聖書で通用する『律法』を用いた。範囲をモーセ五書だけ、または旧約全体と断定しない。
- source_word: ἕως ἂν πάντα γένηται
  choice: すべてが実現するまでは
  rationale: γίνομαιの『生じる・実現する』という幅を保ちつつ、文脈に適した自然な日本語とした。『成就する』ほど解釈を限定しない。
theological_decisions:
- issue: νόμοςの範囲
  choice: 本文では『律法』とし、神の聖書的な律法を指すことを示す
  alternative: 特にモーセ五書を指す、または広く旧約聖書全体を指す
  rationale: 直前の5:17では『律法と預言者』が語られるが、この節のνόμος自体がどこまでを包含するかは断定せず、文脈に委ねた。
- issue: πάντα γένηταιの意味
  choice: すべてが実現する
  alternative: すべてが起こる／すべてが成就する
  rationale: 出来事の発生と神の意図の完成の双方を含み得るため、『実現する』を採り、脚注で別訳を示して終末論的な解釈を一つに固定しない。
- issue: 二つのἕως節の関係
  choice: 二つの『…までは』を保持し、ダッシュで後半を強調する
  alternative: 一文に平滑化して後半を『すべてが実現するまで残る』と補う
  rationale: 原文の反復と、天地が過ぎ去る時と『すべて』が実現する時との関係にある解釈上の緊張を保ち、原文にない動詞を補わない。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、イエスの厳粛で権威ある宣言にふさわしい格調を保った。冒頭の説明接続γάρは『というのも』で明示した。二重の『…までは』は平滑化せず、ダッシュを用いて原文の反復と余韻を自然に保持した。
