revisions:
- from: というのも、まことに、あなたがたに言います。天地が過ぎ去るまでは、律法からイオタ一つ[a]、小さな一画一つ[b]も決して消え去ることはありません――すべてが実現する[c]までは。
  to: なぜなら、まことに、あなたがたに言います。天地が過ぎ去るまで、律法からイオタ一つ[a]も、小さな筆画一つ[b]も、決して失われることはありません――すべてが実現する[c]まで。
  rationale: 接続詞γάρをより自然な説明接続「なぜなら」で示し、κεραίαの訳語を「小さな筆画一つ」として日本語の重複を解消した。「失われる」は、律法から最小の書記要素さえ消失しないというἀπὸ τοῦ νόμου ... οὐ μὴ παρέλθῃの意味を自然に表す。二つの時間節と、その関係にある解釈上の含みは維持した。
