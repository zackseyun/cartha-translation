- source_word: ὅτι
  choice: 〜のを
  rationale: 聞いた内容を引用文として受ける、自然な日本語の補文表現。
- source_word: ἐρρέθη
  choice: 言われた
  rationale: λέγωの受動態を保ち、発言者を明示しない原文の形を再現する。
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: 目には目を
  rationale: ἀντίの交換・対応関係を、日本語で広く知られた簡潔な法的定式として表す。
- source_word: καὶ
  choice: 、
  rationale: 二つの並行句は、日本語では読点で並べるほうが格言的な均衡と自然さを保てる。
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: 歯には歯を
  rationale: 前半と対応する定型表現とし、原文の平行構造を保つ。
