id: MAT.5.45
reference: Matthew 5:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: ja
  text: それは、あなたがたが天におられるあなたがたの父の子となるためです。父は、ご自分の太陽を悪い者にも良い者にも昇らせ、正しい者にも不正な者にも雨を降らせるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: それは、……ためです
  rationale: 目的を表す接続詞の力を保ちつつ、前節から自然につながる現代日本語とした。
- source_word: γένησθε
  choice: となる
  rationale: γίνομαι の変化・成立を示す語義を「である」と平板化せずに表す。ここでは父に倣う者となることを述べるが、養子縁組の仕組みを訳文に持ち込まない。
- source_word: υἱοὶ
  choice: 子
  rationale: 日本語の「息子たち」は男性だけを指す意味が強すぎるため、弟子一般を含み得る関係的・子としての表現を自然に伝える「子」とした。
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: 天におられる父
  rationale: 「あなたがたの」は日本語では文脈上明らかであり、父への呼びかけを自然にした。「天」はギリシア語では複数形だが、この定型表現の日本語として単数が自然。
- source_word: ὅτι
  choice: からです
  rationale: 先行する目的節の根拠・説明を明確に表す。
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: ご自分の太陽を……昇らせ
  rationale: 明示された所有代名詞と、神を主語とする使役的な働きをともに保持した。
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: 悪い者にも良い者にも
  rationale: 名詞的に用いられた形容詞を人を指す自然な日本語で表し、対句を保った。
- source_word: βρέχει
  choice: 雨を降らせてくださる
  rationale: 神の働きを自然な日本語で示し、文脈に即して恵み深い行為への敬意を補助動詞で表した。
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: 正しい者にも正しくない者にも
  rationale: δίκαιος と ἄδικος の語形上の対照を、同じ語幹を用いて明瞭に再現した。
theological_decisions:
- issue: υἱοὶ の性別を伴う子の言語
  choice: 父の子
  alternative: 父の息子たち
  rationale: 原文は男性複数形だが、この文脈では弟子たちを代表的に指す。「息子たち」は現代日本語では男性限定に聞こえやすいため、親子関係を保持しつつ包括範囲を狭めない「子」を選んだ。
- issue: γένησθε と神の子であることの関係
  choice: 子となる
  alternative: 子であることを示す／子である
  rationale: 「なる」という原文の動的な力を保った。行為によって救済上の身分を獲得するという教理的説明は加えず、文脈にある父への模倣との緊張をそのまま残した。
- issue: 善悪双方に対する神の摂理
  choice: 悪い者にも良い者にも……正しい者にも正しくない者にも
  alternative: 善人にも悪人にも……義人にも不義な者にも
  rationale: 対照される双方が太陽と雨の恩恵を受けるという本文を限定せず、神の普遍的な恵み深い働きを明示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。説教調や古語を避け、対句のリズムを保った。脚注記号は該当文末に配置した。
