  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: ja
  text: というのは、あなたがたに言っておく。あなたがたの義[a]が律法学者やファリサイ人の義を上回るものでなければ、あなたがたは決して天の国に入ることはない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は、神の前での正しさと、それにかなう正しい行いを表しうる。文脈によっては「正しさ」または「正義」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: あなたがたに言っておく
  rationale: γάρは直前の教えを受けた説明のつながりを示す。日本語では独立した理由節として「というのは」を補うより、文脈に自然につながる断言として訳した。λέγωの現在形と与格の直接呼びかけも保っている。
- source_word: ἐὰν μὴ
  choice: …ていなければ
  rationale: 必要な否定条件を示す。現代日本語で明快な条件表現とした。
- source_word: περισσεύσῃ … πλεῖον
  choice: …にまさっていなければ
  rationale: 比較対象より豊かで多いことを表す。道徳的・宗教的な質の比較として自然な「まさる」を用いた。
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: あなたがたの義
  rationale: δικαιοσύνηは正しさ、正しい行い、神の前での正しいあり方を含みうる。「義」はその幅とマタイ5章の主題を簡潔に保つ。
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: 律法学者やファリサイ派の人々の義
  rationale: 比較されているのが人そのものではなくδικαιοσύνηであることを日本語で明確にするため「義」を補った。γραμματεύςは当時の律法の専門家を指すため「律法学者」、Φαρισαῖοιは一般に理解しやすい「ファリサイ派の人々」とした。καίは二つの集団を一括して比較対象にする自然な「や」で表した。
- source_word: οὐ μὴ εἰσέλθητε
  choice: 決して…入ることはない
  rationale: οὐ μήとアオリスト接続法による強い否定を、明瞭で重みのある現代日本語で表した。
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を、現代日本語で定着し理解しやすい形にした。「国」は領域だけでなく神の支配も含みうる。
theological_decisions:
- issue: δικαιοσύνηの意味の幅
  choice: 義
  alternative: 正しさ／正義
  rationale: この箇所では律法学者とファリサイ派を超える、神の御心にかなうあり方と行いが問題となっている。「義」は法廷的身分だけにも社会的正義だけにも限定せず、原語の神学的な幅を保つ。別訳の可能性は脚注で示した。
- issue: 比較の対象
  choice: あなたがたの義と、律法学者やファリサイ派の人々の義との比較を明示
  alternative: あなたがたの義が律法学者やファリサイ派にまさる
  rationale: ギリシア語では比較表現が簡潔で、「義」が補われていないが、意味上は彼らの義との比較と読むのが自然である。日本語の誤解を避けつつ、義がどのようにまさるかは説明せず、本文の緊張を保った。
- issue: 天の国に入ることについての否定の強さ
  choice: 決して…入ることはない
  alternative: 入ることはない
  rationale: οὐ μήの強い否定を弱めず、条件の深刻さをそのまま示した。義が何によって、どのように得られるかはこの一節に補わなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの断定の重みを保った。「言っておく」「決して…ない」により口語的すぎず、一般読者にも理解しやすい格調とした。
