id: MAT.5.29
reference: Matthew 5:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: ja
  text: しかし、もし右の目があなたをつまずかせるなら[a]、それをえぐり出して、投げ捨てなさい。あなたの体の一部が失われるほうが、全身がゲヘナ[b]に投げ込まれるより、あなたにとってよいのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を犯させるなら」。
    reason: lexical_alternative
  - marker: b
    text: 「ゲヘナ」は、ヒノムの谷に由来する名称のギリシア語形。伝統的には「地獄」と訳される。
    reason: historical_term
lexical_decisions:
- source_word: σκανδαλίζει
  choice: つまずかせる
  rationale: 罪へ陥らせるという文脈上の意味を含みつつ、ギリシア語の「つまずき」の比喩を本文に残す。
- source_word: ἔξελε
  choice: えぐり出しなさい
  rationale: 目を取り除くよう命じる強烈で切迫した表現を、自然な現代日本語で保つ。
- source_word: βάλε ἀπὸ σοῦ
  choice: 投げ捨てなさい
  rationale: 投げる動作と、自分から遠ざけるという分離の意味を簡潔に表す。
- source_word: συμφέρει
  choice: あなたにとってよい
  rationale: 利益や有利さを示す語を、後続の比較構文に合う自然な日本語にする。
- source_word: ἀπόληται
  choice: 失っても
  rationale: 身体の一部が失われるという意味を文脈に即して表し、「滅びる」より日本語として自然にする。
- source_word: ἓν τῶν μελῶν σου
  choice: 体の一部
  rationale: 目も含む身体の構成部分を指すため、「手足」ではなく包括的な表現を用いる。
- source_word: βληθῇ
  choice: 投げ込まれない
  rationale: 受動態と、ゲヘナの中へ投げ入れられる強い像を保つ。
- source_word: γέενναν
  choice: ゲヘナ
  rationale: 後代の一般化された神学用語に置き換えず、本文固有の名称を音写する。
- source_word: ὁ δεξιὸς
  choice: 右の
  rationale: 原文が明記する左右の指定をそのまま保持する。
- source_word: δὲ
  choice: しかし
  rationale: 前節からの継続と軽い対照を表す。
theological_decisions:
- issue: γέενναの訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: 歴史的・神学的連想を一語に固定せず、イエスの発言にある固有の用語を保持する。一般的な訳語は注で示す。
- issue: σκανδαλίζωの比喩性
  choice: つまずかせる
  alternative: 罪を犯させる
  rationale: 罪に陥る文脈を認めながら、原文の比喩を解消せず本文に残す。
translation_notes:
  register: 明快で格調を保った現代標準語。「えぐり出して」「投げ捨てなさい」により原文の強烈な命令を弱めず、「つまずかせる」と「ゲヘナ」に注を付して意味上の幅と歴史的背景を示した。
