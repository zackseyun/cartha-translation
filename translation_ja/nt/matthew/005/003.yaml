id: MAT.5.3
reference: Matthew 5:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: ja
  text: 霊において貧しい人々[b]は幸いである[a]。天の国[c]はその人たちのものであるからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幸せである」「恵まれている」とも訳せる。この語は単なる幸福感ではなく、神の恵みのもとにある望ましい状態を表す。
    reason: lexical_alternative
  - marker: b
    text: 「霊的に貧しい人々」、または「自分の霊的な必要を自覚している人々」という意味にも理解できる。本文は解釈を一つに限定せず、ギリシア語の表現を保った。
    reason: alternative_reading
  - marker: c
    text: ギリシア語では「天」が複数形で、マタイに特徴的な表現である。日本語では慣用的に「天の国」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: 幸いである
  rationale: 神の恵みを受けた望ましい状態を表す語であり、単なる主観的な幸福感に限定せず、山上の説教の宣言にふさわしい自然で格調ある表現とした。
- source_word: οἱ πτωχοὶ
  choice: 貧しい人々
  rationale: 定冠詞を伴う形容詞の名詞的用法を自然な日本語で表し、困窮という中心的意味を保った。「物乞いをする人々」では意味を狭めすぎる。
- source_word: τῷ πνεύματι
  choice: 霊において
  rationale: 限定の与格を明示しつつ、「霊的に貧しい」「自分の霊的必要を自覚する」など一つの解釈に絞らない。「心の貧しい」はπνεῦμαを「心」に置き換え、人格的な卑しさとの誤解も招きうるため避けた。
- source_word: ὅτι
  choice: だからである
  rationale: 前半の幸いの理由を導く接続関係を、明瞭な現代日本語で示した。
- source_word: αὐτῶν ἐστιν
  choice: その人たちのものである
  rationale: 現在形と所有の意味を保ち、将来だけの約束に変えない。直前の人々を受けることが明確になるよう「その人たち」とした。
- source_word: ἡ βασιλεία
  choice: 国
  rationale: βασιλείαは王の支配とその領域の双方を含みうるが、マタイの定型表現として理解しやすく定着した「天の国」を用いた。
- source_word: τῶν οὐρανῶν
  choice: 天の
  rationale: ギリシア語は複数形だが、日本語では慣用的かつ自然な単数的表現「天の国」とし、マタイ特有の言い回しを保った。
theological_decisions:
- issue: 「霊において貧しい」の意味
  choice: 「霊において貧しい」として原文の簡潔な表現と解釈上の幅を保つ。
  alternative: 「霊的に貧しい」「謙遜な」「自分の霊的必要を知る」
  rationale: 原文はこれらと関係しうるが、どれか一つに明示的に限定してはいない。本文で説明的に言い換えると、原文にある神学的な含みを狭めるため。
- issue: 天の国の所有の時制
  choice: 現在形で「その人たちのものである」とする。
  alternative: 「その人たちのものとなる」「その人たちに与えられる」
  rationale: ἐστινは現在形であり、この幸いを将来の報いだけに移さず、現在の所有として表すため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宣言としての簡潔さと格調を保った。「霊において」は日常語よりやや硬いが、原文の曖昧さを不用意に解消しないために採用し、脚注で主な理解を示した。
