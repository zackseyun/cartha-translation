  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: ja
  text: 心の清い人たちは[a]幸いである。その人たちこそ、神を見ることになるからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「心の純粋な人たち」。
    reason: lexical_alternative
  - marker: b
    text: 「神を見る」という約束は、神の臨在に直接あずかることを指し、そのことが将来完成することを含む可能性がある。本文では意味を限定せず、原文どおりの表現を保った。
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いである
  rationale: 神から恵みを受ける祝福された状態を表す、八福にふさわしい定着した表現。「幸福だ」よりも一時的な感情に狭めない。
- source_word: καθαροὶ
  choice: 清い
  rationale: ここでは内面的・道徳的な純粋さを自然に表す。「きれいな」では日常的・外面的に響きやすく、「純粋な」よりも聖書本文として簡潔で格調がある。
- source_word: τῇ καρδίᾳ
  choice: 心の
  rationale: 限定・観点を示す与格を、日本語で自然な「心の清い」とした。καρδίαは感情だけでなく内なる人全体を指しうる。
- source_word: ὅτι
  choice: からである
  rationale: 先の幸いの根拠を明示する接続表現として、現代日本語で明快に訳した。
- source_word: αὐτοὶ
  choice: その人たちは
  rationale: 強意的な代名詞を受け、まさにその人々が約束を受けることを示す。日本語では主語を明示して強調を保った。
- source_word: τὸν θεὸν
  choice: 神を
  rationale: ὄψονταιの直接目的語として簡潔に訳した。
- source_word: ὄψονται
  choice: 見る
  rationale: 未来の約束は文末の「からである」と文脈によって示されるが、日本語では必要に応じ「見ることになる」も可能。ここでは原文の簡潔さと直接性を優先した。
theological_decisions:
- issue: 「神を見る」の意味
  choice: 「神を見る」と解釈的な補足をせず保持する
  alternative: 「神の臨在を経験する」「終わりの日に神を仰ぎ見る」
  rationale: 神への直接的な接近や将来の完成を含みうるが、原文は簡潔であり、特定の時点や様態に限定していない。その神学的な広がりと緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、八福にふさわしい簡潔で品位ある文体とした。「心」は単なる感情ではなく内なる人を表す。脚注記号は対応箇所の直後に置いた。
