  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: ja
  text: 柔和な[b]人たちは幸いです。彼らこそ地[a]を受け継ぐからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大地」または「土地」とも訳せます。この表現は詩編37編11節を踏まえていると考えられ、契約の約束に結びつく土地という意味にも、より広く地全体という意味にも受け取れます。
    reason: alternative_reading
  - marker: b
    text: 「穏やかな人たち」とも訳せます。ここでいう「柔和」は弱さではなく、へりくだりを伴う穏やかさを意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いです
  rationale: 神の恵みのもとにある祝福された状態を表す定型的で自然な訳。「幸せです」よりも、一時的・主観的な感情に限定されにくい。
- source_word: οἱ πραεῖς
  choice: 柔和な人たち
  rationale: πραΰςが表す、弱さや臆病さではなく、へりくだりを伴う穏やかさを簡潔に伝える。冠詞付き形容詞の名詞的用法は「人たち」で表した。
- source_word: ὅτι
  choice: からです
  rationale: 前半の幸いである理由・根拠を示す接続を、現代日本語で自然に表す。
- source_word: αὐτοὶ
  choice: その人たちが
  rationale: ギリシア語の強調を、直前の人々を明示的に指し直す「その人たち」で過度に重くならない形で示す。
- source_word: κληρονομήσουσι
  choice: 受け継ぐ
  rationale: 相続として受け取るという意味と、契約の約束を想起させる響きを保つ。未来性は文脈上の約束として日本語の非過去形で自然に表した。
- source_word: τὴν γῆν
  choice: 地
  rationale: γῆの「大地・世界」と「土地」の両義性を、日本語でも比較的保ちやすい簡潔な語を採用した。
theological_decisions:
- issue: τὴν γῆνの範囲
  choice: 地
  alternative: 大地／土地
  rationale: γῆは世界全体としての「地」と、契約に関わる特定の「土地」のどちらも指し得る。詩篇37:11への反響を考慮し、いずれか一方に限定せず、本文と脚注でその緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用いた。山上の教えの簡潔で荘重な調子を保ちつつ、日常語として理解できる表現にした。
