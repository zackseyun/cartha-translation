id: MAT.5.36
reference: Matthew 5:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: ja
  text: また、自分の頭にかけて誓ってはならない。あなたは髪の毛一本さえ、白くも黒くもすることができないからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: また、…てはならない
  rationale: 前節から続く否定的な命令の並列を示し、現代日本語で自然に接続する。
- source_word: ἐν τῇ κεφαλῇ σου
  choice: 自分の頭にかけて
  rationale: 誓いにおいて持ち出す対象を表す表現なので、日本語の慣用的な「…にかけて誓う」とした。
- source_word: ὀμόσῃς
  choice: 誓ってはならない
  rationale: μήτεを伴うアオリスト接続法の禁止を、明確で格調を保った現代日本語にした。
- source_word: ὅτι
  choice: …からである
  rationale: 禁止の理由を導く因果関係を明示する。
- source_word: οὐ δύνασαι
  choice: することができない
  rationale: 人間にはその力がないという原文の能力・可能性の否定を直接表す。
- source_word: μίαν τρίχα
  choice: 髪の毛一本さえ
  rationale: μίανの「一つ」を保ちつつ、最小のものすらという強調が自然に伝わるよう「さえ」を用いた。
- source_word: λευκὴν … ἢ μέλαιναν
  choice: 白くも黒くも
  rationale: 二つの基本的な色彩語の対照を解釈で弱めず、日本語の否定文に自然な形で表した。
- source_word: ποιῆσαι
  choice: する
  rationale: ここでは、髪をある色の状態にするという使役的意味を簡潔に表す。
theological_decisions:
- issue: 誓いの禁止の範囲
  choice: 自分の頭にかけて誓うことへの直接の禁止として訳す
  alternative: あらゆる誓いを例外なく禁じる教理的命題、または欺瞞的な誓言形式だけへの禁止と解釈して訳す
  rationale: この節は明示的に「自分の頭にかけて」誓うことを扱い、その理由を人間の能力の限界に置いている。より広い誓いの是非については訳文で決着させず、本文の射程と緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「…てはならない」「…からである」によって教えとしての端正さを保った。原文にない教理的限定や説明は加えていない。
