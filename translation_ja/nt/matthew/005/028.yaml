  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: ja
  text: しかし、私はあなたがたに言います。情欲を抱こうとして女性を見る者はだれでも、すでに心の中でその女性と姦淫を行ったのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女性」は「妻」とも訳せる。ギリシア語のγυνήは、文脈によってどちらの意味にもなる。
    reason: lexical_alternative
  - marker: b
    text: 「情欲を抱こうとして」は、「欲望を抱くために」とも訳せる。原文は目的や意図を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: しかし、わたしはあなたがたに言います
  rationale: δέの対照とἐγώの強調を保ちつつ、現代日本語として明瞭で品位ある直接話法とした。
- source_word: πᾶς ὁ βλέπων
  choice: 見る者はだれでも
  rationale: πᾶςの普遍的な範囲を示し、性別を不必要に補わない表現とした。
- source_word: γυναῖκα
  choice: 女
  rationale: γυνήは文脈により「女」「妻」のいずれにもなり得るが、原文が婚姻関係を明示しないため、本文では広い語義を保った。現代日本語の聖書的・倫理的文脈に合う簡潔な語を選んだ。
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: 情欲を抱くために
  rationale: πρὸς＋冠詞付き不定詞の目的・意図を「ために」で明示した。ἐπιθυμέω自体は広く「欲する」を意味し得るが、この文脈では性的で不正な欲望を指すため「情欲を抱く」とした。
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: すでにその女と姦淫を犯した
  rationale: ἤδηの「すでに」を保持し、μοιχεύωの倫理的・婚姻的含意を「姦淫を犯す」で正確に表した。対格αὐτήνは日本語で自然な「その女と」とした。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心の中で
  rationale: καρδίαが思考や欲望を含む内なる人を表すことを、自然で伝統的な日本語として保持した。
theological_decisions:
- issue: γυνήを「女」とするか「妻」とするか
  choice: 女
  alternative: 妻
  rationale: 姦淫という文脈から既婚女性を想定する可能性はあるが、原文自体は婚姻関係を明示していない。本文では曖昧さを狭めず、別訳を脚注に示した。
- issue: ἐπιθυμέωを一般的な「欲する」とするか、性的な「情欲を抱く」とするか
  choice: 情欲を抱く
  alternative: 欲望を抱く／欲する
  rationale: 語そのものの意味範囲は広いが、この箇所では見る対象と姦淫への言及により、不正な性的欲望が明白である。日本語では文脈上の意味を自然に伝える表現を本文に採用した。
- issue: πρὸς τὸ＋不定詞の目的性を明示するか
  choice: 「ために」で目的・意図を明示
  alternative: 情欲を抱いて女を見る
  rationale: 原文は単に欲望が生じることよりも、欲望を目的として見る方向づけを表す。行為者の意図を保持し、無意識の一瞥と同一視しない訳とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの対照的で権威ある発言を丁寧体で表した。「姦淫」は日常語ではないが、婚姻に反する性的行為を正確かつ簡潔に示すため保持した。
