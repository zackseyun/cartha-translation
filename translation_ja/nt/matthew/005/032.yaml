source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ja
  text: しかし、わたしはあなたがたに言います。自分の妻を離縁する者はみな、不正な性行為を理由とする場合を除いて、その妻を姦淫に陥らせます[a]。また、離縁された女性と結婚する者は、姦淫を犯します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「その妻を姦淫された者とする」。ギリシア語の不定詞は受動形であり、「その妻に姦淫を犯させる」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: 離縁する／離縁された
  rationale: 婚姻の文脈における法的・関係的な意味を明確にしつつ、原語の能動と受動の対応を保つため。
- source_word: γυναῖκα
  choice: 妻
  rationale: 所有代名詞と離縁の文脈から、一般的な「女」ではなく配偶者を指す。
- source_word: παρεκτὸς λόγου πορνείας
  choice: 不品行を理由とする場合を除き
  rationale: παρεκτός の例外の力と、λόγος の「理由・事由」の意味を表す。πορνείαは姦淫一種類に限定されない不正な性行為を指すため、包括性を保つ「不品行」とした。
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: その妻を姦淫する者にさせる
  rationale: ποιέω＋不定詞の使役を明示し、受動形の μοιχευθῆναι が持つ結果的な含みを、日本語として理解できる形で表した。
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: 結婚する者は
  rationale: 不定関係節による一般的条件を、自然で簡潔な日本語にした。
- source_word: μοιχᾶται
  choice: 姦淫を犯す
  rationale: 現在形による一般的命題を、日本語の聖書語彙として明瞭な表現で伝える。
- source_word: πᾶς ὁ ἀπολύων
  choice: 離縁する者はみな
  rationale: πᾶς の包括性と分詞句の一般的な人物指示を保つ。妻への言及により当時の男性主体の社会的文脈も本文に残る。
theological_decisions:
- issue: 例外句 παρεκτὸς λόγου πορνείας の意味
  choice: 「不品行を理由とする場合を除き」と、真正な例外として訳す。
  alternative: 「不法な婚姻の場合を除き」など、πορνείαの範囲を特定の状況に限定する。
  rationale: ギリシア語は明確に例外を示す一方、πορνείαが具体的にどの行為・状況を含むかは限定していない。訳文もその範囲を狭めず、解釈上の緊張を残す。
- issue: ποιεῖ αὐτὴν μοιχευθῆναι の力
  choice: 「その妻を姦淫する者にさせる」と訳し、使役と結果を表す。
  alternative: 「その妻に姦淫を犯させる」または「その妻が姦淫されるようにする」。
  rationale: μoιχευθῆναι は形態上受動だが、文脈上は女性が姦淫に関わる状態に置かれる結果を表し得る。本文で一方に断定しすぎず、脚注で受動形と別訳を示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「離縁」は婚姻解消の法的文脈を簡潔に示し、「姦淫」は本文の重要語として一貫して用いた。「不品行」はπορνείαの広さを保つが、現代語では意味が広く感じられるため、その語義が不正な性行為であることを必要に応じて注記できる。
