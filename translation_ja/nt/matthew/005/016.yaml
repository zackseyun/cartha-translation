id: MAT.5.16
reference: Matthew 5:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: ja
  text: このように、あなたがたの光を人々の前で輝かせなさい。人々があなたがたの良い行いを見て、天におられる[a]あなたがたの父をあがめるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「諸天におられる」。ギリシア語の「天」は複数形です。
    reason: 原文の複数形οὐρανοῖςを、自然な本文を損なわずに示すため。
lexical_decisions:
- source_word: οὕτως
  choice: 同じように
  rationale: 直前のともしびの比喩を受け、その比喩と同じあり方で光を輝かせるよう促す談話上のつながりを明確にした。
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: あなたがたの光を…輝かせなさい
  rationale: 三人称単数の命令形を、現代日本語で自然かつ明確な命令として表した。単数の「光」と複数の所有者「あなたがた」を保持している。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 人々の前で
  rationale: ἀνθρώπωνはここでは性別を限定せず人間一般を指すため、「人々」とした。「前で」は公に見える位置という意味を自然に伝える。
- source_word: ὅπως ἴδωσιν
  choice: 見て…ようになるためです
  rationale: ὅπωςと接続法が示す目的を明示しつつ、後続する二つの動作の流れを自然な日本語にした。
- source_word: τὰ καλὰ ἔργα
  choice: 良い行い
  rationale: καλάが含み得る立派さや美しさを、文脈に合う明快な日本語で表した。「行い」はἔργαの倫理的・実践的側面を伝える。
- source_word: δοξάσωσιν
  choice: あがめる
  rationale: 神に栄光を帰し、その偉大さを認めてたたえるというδοξάζωの意味を、一般読者に自然な聖書日本語で表した。
- source_word: τὸν πατέρα ὑμῶν
  choice: あなたがたの父
  rationale: マタイ福音書で重要な、弟子たちと神との関係を示す父という呼称をそのまま保持した。
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: 天におられる
  rationale: 日本語として定着し自然な表現を本文に用いた。原文のοὐρανοῖςが複数形であることは脚注で明示した。
theological_decisions:
- issue: ἀνθρώπωνの包括的意味
  choice: 人々
  alternative: 男たち／人間たち
  rationale: 文脈上、目撃者は男性だけに限られず、人間一般を指す。日本語の「人々」は原文の指示範囲を性別の限定なく正確に伝える。
- issue: οὐρανοῖςの複数形
  choice: 本文は「天に」、脚注で複数形を明示
  alternative: 諸天に
  rationale: 原文の形態的情報を脚注で保持しながら、本文では ordinary modern Japanese として自然な言い方を採用した。複数形を特定の宇宙論へ解釈していない。
- issue: 良い行いを見ることと父をあがめることの関係
  choice: 目的を示す「ためです」
  alternative: 結果を強く示す「その結果」
  rationale: ὅπωςは目的を中心に結果の含みも持ち得るため、本文では目的を明示しつつ、「ようになる」により実際の帰結の可能性も自然に残した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、命令の力と神への敬意を保った。「あがめる」は荘重さを保ちつつ一般読者にも理解しやすい。節全体の因果関係が追いやすいよう二文構成とした。
