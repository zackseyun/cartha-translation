revisions:
- from: また、昔の人々にこう言われたのを、あなたがたは聞いています。『偽りの誓いをしてはならない[a]。主[b]に対して立てた誓いは果たしなさい。』
  to: また、あなたがたは、昔の人々にこう言われたことを聞いてきました。『偽りの誓いをしてはならない[a]。主[b]に立てた誓いを果たしなさい。』
  rationale: 本文の意味を変えずに、導入句を現代日本語として自然にし、主への与格と誓いの関係を「主に立てた誓い」として明瞭にした。脚注bは、英語監査記録の「the LORD」という契約の神名に関する代案に相当する情報を、日本語読者に具体的に分かる形で示した。脚注記号a・bはいずれも該当語句の直後にあり、対応関係は明確である。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:46Z'
