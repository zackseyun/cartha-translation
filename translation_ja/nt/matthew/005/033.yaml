  naturalness: 「こう言われたのを、あなたがたは聞いています」は不自然ではないが、現代標準日本語では「こう言われたことを聞いてきました」のほうが、この定型句の過去から現在への伝承を自然に表す。「主に立てた誓いを果たしなさい」は明瞭で、引用内の格調も保てる。
