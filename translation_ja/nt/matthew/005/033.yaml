  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: ja
  text: また、あなたがたは、昔の人々にこう言われたことを聞いてきました。『偽りの誓いをしてはならない[a]。主[b]に立てた誓いを果たしなさい。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誓いを破ってはならない」。この動詞は、偽りの誓いをすること、または誓いに背くことを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 旧約聖書の背景では神の固有名YHWHを指すため、「ヤハウェ」と訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: また
  rationale: 一連の対比の中で次の例を導入する語として、自然な現代日本語の「また」を用いた。
- source_word: ἠκούσατε
  choice: あなたがたは聞いています
  rationale: アオリストだが、この定型表現では、過去に聞いて現在も知っていることを表す自然な日本語とした。
- source_word: ἐρρέθη
  choice: こう言われた
  rationale: 発言者を特定しない受動形を保ちつつ、後続の引用を自然に導入した。
- source_word: τοῖς ἀρχαίοις
  choice: 昔の人々に
  rationale: 単に高齢者ではなく、以前の世代の人々を指す歴史的な意味を明確にした。
- source_word: Οὐκ ἐπιορκήσεις
  choice: 偽りの誓いをしてはならない
  rationale: ἐπιορκέωの中心的な意味である偽誓を表し、現代の法廷用語に狭く限定しない表現とした。誓いを破る意味も脚注に残した。
- source_word: ἀποδώσεις
  choice: 果たしなさい
  rationale: ここでは、誓いによって負った義務を実行する意味であり、「返す」より「果たす」が自然で明確である。
- source_word: τῷ κυρίῳ
  choice: 主に対して
  rationale: ギリシア語κύριοςを直接反映して「主」とし、誓いの相手・履行の向かう先を「に対して」で明確にした。
- source_word: τοὺς ὅρκους σου
  choice: 立てた誓い
  rationale: ὅρκοςを「誓い」とし、日本語では「誓いを立てる」と補うことで、各自の誓いであることを自然に表した。
theological_decisions:
- issue: イスラエルの聖書を背景とするκύριοςの訳し方
  choice: 主
  alternative: 主〔契約の神名を示す表記〕
  rationale: 本文のギリシア語はκυρίῳであり、直接引用されたヘブライ語神名ではないため、本文では「主」とした。ただし、旧約聖書の契約の神名が背景にある可能性を脚注で示した。
- issue: ἐπιορκέωの意味の範囲
  choice: 偽りの誓いをする
  alternative: 誓いを破る
  rationale: この動詞は偽って誓うことにも、立てた誓いに背くことにも用いられ得る。本文では前者を採り、後者を脚注に残して語義上の幅を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用部分は戒めとして簡潔にし、「してはならない」「果たしなさい」で法的・聖書的な調子を保った。すべての脚注記号を対応する語句の直後に置いた。
