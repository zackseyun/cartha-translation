  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: ja
  text: あなたがたは、昔の人々にこう言われたことを聞いてきました。『殺人をしてはならない。人を殺す者は、裁きを受けることになる。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: 聞いています
  rationale: 説教の聴衆が受け継いできた教えを指す定型表現として、現在にも関わる既知の内容を自然な日本語で表した。
- source_word: ἐρρέθη
  choice: 言われた
  rationale: 発言者を明示しない受動形を保ち、神が直接語ったと翻訳上断定しない。
- source_word: τοῖς ἀρχαίοις
  choice: 昔の人々に
  rationale: 与格を教えの受け手として素直に表した。『昔の人々によって』という解釈の可能性は本文で採らず、注で示した。
- source_word: Οὐ φονεύσεις
  choice: 殺してはならない
  rationale: 日本語の十戒引用として明瞭で自然な表現を用いた。ただし φονεύω は一般的な殺害より不法な殺人に重点があるため、注で明確にした。
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: 人を殺す者は
  rationale: ἄν＋接続法による不特定の一般条件を、自然な一般化表現で訳した。
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: 裁きを受けることになる
  rationale: 法的責任を負って裁きに服する意味を、日本語として自然に表しつつ、具体的な裁判機関や有罪判決に限定しなかった。
theological_decisions:
- issue: 第六戒の φονεύω の範囲
  choice: 本文は『殺してはならない』とし、不法な殺人を意味することを注記
  alternative: 『殺人を犯してはならない』
  rationale: φονεύω をあらゆる殺害の禁止へ広げず、同時に日本語でよく知られた戒めの簡潔さを保った。
- issue: τοῖς ἀρχαίοις の与格の解釈
  choice: 昔の人々に
  alternative: 昔の人々によって
  rationale: 通常の受け手の与格として訳したが、行為者を表す可能性も完全には排除せず注記した。
- issue: 引用の範囲
  choice: 戒めと法的帰結を一続きの引用として表示
  alternative: 戒めだけを直接引用し、帰結を地の文として扱う
  rationale: ギリシア語本文だけでは引用符の範囲が明示されないため、自然な主要解釈を本文に置き、別の区切り方を注で保存した。
translation_notes:
  register: 明瞭な現代標準語を用い、山上の説教にふさわしい簡潔で dignified な調子を保った。『あなたがた』で複数の聴衆を明示し、法廷語彙は専門的になりすぎないよう『裁きを受ける』とした。
