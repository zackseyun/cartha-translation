id: MAT.5.22
reference: Matthew 5:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: ja
  text: しかし、わたしはあなたがたに言います。自分の兄弟に対して怒る者はみな、裁きの対象となります。[a][b] また、自分の兄弟に「ラカ」と言う者は、評議会の裁きの対象となります。[c] そして、「愚か者よ」と言う者は、火のゲヘナの裁きの対象となります。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「怒る者」の後に「理由もなく」に当たる語を加えていますが、初期の有力な写本にはありません。
    reason: textual_variant
  - marker: b
    text: 「兄弟」は男性単数形の語の訳ですが、ここでは男性のきょうだいだけに限らず、広く人との関係を代表していると理解できます。
    reason: lexical_alternative
  - marker: c
    text: 「ラカ」はアラム語の侮蔑表現で、「能なし」「空っぽの頭」ほどの意味です。「評議会」は「議会」とも訳せ、この文脈ではサンヘドリンを指す可能性もあります。
    reason: cultural_note
  - marker: d
    text: 「ゲヘナ」はヒンノムの谷に由来し、裁きと結び付けられた語です。「火の地獄」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: しかし、わたしはあなたがたに言います
  rationale: δέの対比とἐγώの強調を保ちつつ、現代日本語として自然で格調ある表現にした。
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: 怒る者はみな
  rationale: 現在分詞の一般的・格言的な意味を保ち、怒りの開始や継続を過度に限定しない。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 自分の兄弟に対して
  rationale: 与格が示す怒りの対象を明確にした。ἀδελφόςの男性単数形は本文で保持し、代表的用法について脚注で補った。
- source_word: ἔνοχος ἔσται
  choice: 裁きを受けることになります／裁かれることになります／投げ込まれることになります
  rationale: 法的責任と処罰への服しを文脈ごとに自然な日本語で表現した。最後のεἰςは行き着く処罰を明瞭に示した。
- source_word: τῇ κρίσει
  choice: 裁き
  rationale: 特定の地方裁判所と断定せず、司法的な裁きという原文の幅を保った。
- source_word: Ῥακά
  choice: ラカ
  rationale: ギリシア語本文に保存されたアラム語の侮蔑語を音写し、その意味は脚注で説明した。
- source_word: τῷ συνεδρίῳ
  choice: 最高法院
  rationale: ユダヤの最高評議機関を指す可能性が高い語として、一般読者に理解しやすい伝統的な日本語を選んだ。ただし単に『議会』を意味する可能性を脚注に残した。
- source_word: Μωρέ
  choice: 愚か者
  rationale: 直接的な侮辱であり、知能だけでなく人格的・道徳的非難を帯び得る語として、現代日本語で通じる表現を選んだ。
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: 火のゲヘナに投げ込まれる
  rationale: γέενναを『地獄』に置き換えず、ヒンノムの谷に由来する固有の裁きのイメージを保持した。τοῦ πυρόςは『火の』として残した。
theological_decisions:
- issue: γέενναの訳語
  choice: ゲヘナ
  alternative: 地獄
  rationale: イエスの語が持つユダヤ的・歴史的背景を保ち、後代の『地獄』概念を無限定に読み込まないため。裁きの厳しさは『火の』と文全体によって維持される。
- issue: ἀδελφόςの範囲
  choice: 兄弟
  alternative: 兄弟姉妹／仲間
  rationale: 原文の男性単数を本文で保持しつつ、一般的・代表的に人間関係へ適用され得ることを脚注で示した。
- issue: τὸ συνέδριονの指示対象
  choice: 最高法院
  alternative: 議会／評議会
  rationale: 文脈上サンヘドリンを指す理解が自然だが、普通名詞としての幅もあるため、別訳を脚注に示した。
- issue: 怒りに関する本文異同
  choice: 『理由なく』を含めない
  alternative: 理由なく怒る者
  rationale: SBLGNT本文および早期の有力な証言に従い、εἰκῇを本文に採用しない。異読は脚注で開示した。
translation_notes:
  register: 明快な現代標準日本語の敬体。イエスの権威ある対比を保ちながら、司法的な三段構成が聞き取れるよう反復を整えた。固有の文化語『ラカ』『ゲヘナ』は音写し、脚注で簡潔に説明した。
