  to: しかし、わたしはあなたがたに言います。自分の兄弟に対して怒る者はみな、裁きの対象となります。[a][b] また、自分の兄弟に「ラカ」と言う者は、評議会の裁きの対象となります。[c] そして、「愚か者よ」と言う者は、火のゲヘナの裁きの対象となります。[d]
  rationale: 本文を、ἔνοχος ἔσταιによる法的責任の三重の並行を保つ形に改めました。「評議会」はσυνέδριονを過度に限定せずに訳し、サンヘドリンの可能性は脚注に残しました。呼格Μωρέは「愚か者よ」としました。本文異同、文化語、およびゲヘナに関する脚注の情報は維持しています。
