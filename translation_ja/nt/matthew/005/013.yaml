id: MAT.5.13
reference: Matthew 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: ja
  text: あなたがたは地の塩です。しかし、塩が塩気を失ったなら[a]、何によって塩味をつけられるでしょうか。もはや何の役にも立たず、外に投げ捨てられ、人々に踏みつけられるだけです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「塩が味を失ったなら」。この動詞は本来「愚かになる」という意味にも用いられますが、ここでは塩について「塩気がなくなる」ことを表します。
    reason: 語義の幅と原文の語遊びの可能性を示すため。
lexical_decisions:
- source_word: Ὑμεῖς
  choice: あなたがたは
  rationale: 明示された複数二人称代名詞の強調を、文頭の「あなたがた」で自然に表した。
- source_word: τὸ ἅλας τῆς γῆς
  choice: 地の塩
  rationale: γῆの広い範囲を保ちつつ、日本語聖書表現として明瞭で簡潔な訳とした。
- source_word: μωρανθῇ
  choice: 塩気を失った
  rationale: 塩について用いられる文脈上の意味は「味がなくなる、塩気を失う」。語源的な「愚かになる」を本文に持ち込まず、比喩を自然に保った。
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: 何によって塩味をつけられるでしょうか
  rationale: 手段を問うἐν τίνιと未来受動形を反映し、主語を塩のまま保った。
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: もはや何の役にも立たず
  rationale: ここでのἰσχύειは実用上の有効性・有用性を表すため、自然な現代日本語にした。
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: 外に投げ捨てられ
  rationale: ἔξωの空間的意味を「外に」で残し、βληθένを文脈に即した自然な「投げ捨てられ」とした。
- source_word: καταπατεῖσθαι
  choice: 踏みつけられる
  rationale: 踏み歩かれて押しつぶされる鮮明な像を、簡潔な日本語で表した。
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: 人々に
  rationale: ἄνθρωποιはここで男女を限定しない人間一般を指す。日本語の「人々」はその一般的意味を正確に表す。
theological_decisions:
- issue: 塩が効力を失う比喩の解釈
  choice: 塩気を失ったなら
  alternative: 愚かになったなら／味がなくなったなら
  rationale: μωρανθῇの語源的含意を教理的説明へ展開せず、塩を主語とする文脈上の意味を訳した。弟子への比喩が何を具体的に意味するかは本文で限定しない。
- issue: ὑπὸ τῶν ἀνθρώπωνの一般的人間指示
  choice: 人々に
  alternative: 男たちに／人間に
  rationale: ギリシア語は特定の男性ではなく人間一般を表しており、性別を限定しない自然な日本語を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「である」調に偏らず、一般読者に自然な「です・ます」調を採用した。修辞的疑問は受動構文を保ち、原文の論理と比喩の緊張を維持した。
