source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: ja
  text: 地にかけて誓ってはならない。地は神の足台だからである。[a] また、エルサレムにかけて誓ってはならない。[b] そこは大いなる王の都だからである。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イザヤ書66章1節への暗示。「地はわたしの足台」とある。
    reason: cross_reference
  - marker: b
    text: 直訳すれば「エルサレムへ（に向かって）」。誓いの文脈では、誓いの対象を示す表現と理解できる。
    reason: lexical_alternative
  - marker: c
    text: 詩編48編2節への暗示。そこではエルサレムが「大いなる王の都」と呼ばれている。
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: …てもならない／また…てもならない
  rationale: 前節から続く一連の禁止を、現代日本語で自然な並列として示す。
- source_word: ἐν τῇ γῇ
  choice: 地を指して誓う
  rationale: 前置詞ἐνはここでは誓言の対象を示す。直訳的な「地において」ではなく、日本語の誓いの表現として意味が明確な形にした。
- source_word: γῇ
  choice: 地
  rationale: 周囲の「天」「エルサレム」と対比され、特定地域ではなく大地を指す。簡潔で聖書的な響きも保つ。
- source_word: ὅτι
  choice: …からである
  rationale: 禁止の理由を示す因果関係を明確に表す。
- source_word: ὑποπόδιόν
  choice: 足台
  rationale: ὑποπόδιονの標準的な訳であり、旧約聖書への暗示も保てる。
- source_word: τῶν ποδῶν αὐτοῦ
  choice: 神の足台
  rationale: 日本語で「彼の足の足台」とすると不自然なため、文脈上の指示対象である神を補い、簡潔に表した。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムを指して誓う
  rationale: εἰςには方向性があるが、ここでは誓言表現の中で対象を示す用法と理解するのが自然である。前置詞の字義的な違いは脚注に残した。
- source_word: πόλις
  choice: 都
  rationale: 単なる都市ではなく王に属する都市という文脈に合い、詩編への暗示を自然に伝える。
- source_word: τοῦ μεγάλου βασιλέως
  choice: 大いなる王の
  rationale: 属格を自然な所有表現で示し、旧約引用を思わせる荘重さを保つ。
theological_decisions:
- issue: 「その足」（αὐτοῦ）の指示対象
  choice: 本文では「神の足台」と明示する
  alternative: 「その方の足台」または「彼の足の足台」として指示対象を暗黙のままにする
  rationale: ギリシア語自体には大文字表記による神の明示はないが、直前の「天は神の御座」との文脈およびイザヤ書66章1節への暗示から指示対象は神である。現代日本語で不自然な代名詞を避けるため明示した。
- issue: 「大いなる王」の指示対象
  choice: 称号をそのまま「大いなる王」とし、指示対象を本文で説明しない
  alternative: 「偉大な王である神」と明示する
  rationale: 詩編48編への暗示と称号の含みを保ち、本文が持つ簡潔さと神学的余韻を維持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「足台」「大いなる王」という旧約聖書を想起させる荘重な語を保持した。節が前節から続く禁止命令であることを「…てもならない」で示し、誓言の慣用句は意味が即座に伝わる「…を指して誓う」とした。
