  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: ja
  text: あなたがたは、『自分の隣人を愛し、自分の敵を憎め』と言われていたのを聞いています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 前半はレビ記19:18を踏まえている。後半の「自分の敵を憎め」は旧約聖書からの直接の引用ではなく、イエスが正そうとしている、当時受け継がれていた教えを反映している。
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: 聞いています
  rationale: アオリスト形だが、過去から受け継いできた教えを耳にしているという定型的な導入なので、現代日本語で自然な「聞いています」とした。
- source_word: ἐρρέθη
  choice: 言われていた
  rationale: 受動態を保ちつつ、誰が言ったかを本文で特定しない表現とした。継承されてきた教えという文脈も自然に表す。
- source_word: Ἀγαπήσεις
  choice: 愛し
  rationale: 命令の働きをする未来形。後続の「憎め」と一続きの引用として、日本語では簡潔な命令表現にした。
- source_word: τὸν πλησίον σου
  choice: 自分の隣人
  rationale: レビ記19:18との照応を保つ定着した訳語「隣人」を用い、所有関係は自然な日本語の「自分の」で表した。
- source_word: μισήσεις
  choice: 憎め
  rationale: 命令の働きをする未来形を明確な命令形で訳し、引用された教えの強い対照を保った。
- source_word: τὸν ἐχθρόν σου
  choice: 自分の敵
  rationale: 倫理的対照におけるἐχθρόςの直接的で自然な訳語として「敵」を採用した。
theological_decisions:
- issue: 「自分の敵を憎め」という句の位置づけ
  choice: イエスが人々の聞いてきた言葉として、前半とともに一続きの引用に含める。ただし全体を聖書からの直接引用とは示さない。
  alternative: 後半を本文中で明示的に伝承または解釈として区別する。
  rationale: ギリシア語本文は両句を「言われていた」一つの内容として提示する一方、後半は旧約聖書の直接の命令ではない。本文ではその緊張を保ち、脚注で出典上の違いを説明する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用内は命令形で簡潔にし、導入部では受動表現によって発言者を特定しない原文の形を保った。
