id: MAT.5.9
reference: Matthew 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: ja
  text: 平和をつくる人たちは幸いである。彼らは神の子たち[a]と呼ばれるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「神の息子たち」。ギリシア語は男性複数形だが、ここでは代表的な意味で用いられ、男女を含む「神の子たち」を指す。
    reason: 原文の性を伴う子としての表現と、その包括的な用法を示すため。
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いである
  rationale: 単なる主観的な「幸福」ではなく、神の恵みを受けた祝福された状態を表す、至福の教えとして自然で定着した表現。
- source_word: εἰρηνοποιοί
  choice: 平和をつくる人たち
  rationale: 平和を好むだけでなく、能動的に平和を実現する者という複合名詞の行為者的な意味を明確に伝える。
- source_word: ὅτι
  choice: からである
  rationale: 前半の祝福の理由・根拠を示す因果関係を、現代日本語で明瞭に表す。
- source_word: αὐτοὶ
  choice: 彼らは
  rationale: ギリシア語代名詞の強調を独立した主語で示す。「彼ら自身こそ」とすると日本語では強すぎるため避けた。
- source_word: υἱοὶ θεοῦ
  choice: 神の子たち
  rationale: 日本語で定着した尊厳ある称号を用いる。原文は男性複数形「神の息子たち」だが、代表的・包括的に用いられており、「神の息子たち」は現代日本語では生物学的含意が不自然に強い。原文の形は脚注で明示する。
- source_word: κληθήσονται
  choice: 呼ばれる
  rationale: καλέωの未来受動態を直接的に訳し、単に人々から認められるという意味に限定しない。未来の意味は文脈上この形で自然に伝わる。
theological_decisions:
- issue: υἱοὶ θεοῦの男性複数形と包括性
  choice: 本文は「神の子たち」とし、原文の男性形を脚注で示す
  alternative: 神の息子たち
  rationale: 「息子たち」は原文の文法的性を明示する一方、日本語では血縁・生物学的意味を過度に感じさせる。「神の子たち」は称号として自然で、対象が男性だけに限られない代表的な意味を保つ。男性複数形であることと訳語上の選択は脚注で透明に示す。
translation_notes:
  register: 明快な現代標準日本語。「幸いである」と「からである」により、簡潔でありながら聖書本文にふさわしい格調を保った。「平和をつくる」は能動性を明確にするため、抽象的な「平和を愛する」や硬い造語を避けた。
