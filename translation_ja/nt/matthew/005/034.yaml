id: MAT.5.34
reference: Matthew 5:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: ja
  text: しかし、わたしはあなたがたに言います。決して誓ってはなりません。天にかけても誓ってはなりません。天は神の御座だからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: しかし、わたしはあなたがたに言います
  rationale: 前節との対比を「しかし」で示し、明示された主語ἐγώの強調を「わたしは」で保った。
- source_word: μὴ ὀμόσαι ὅλως
  choice: 決して誓ってはなりません
  rationale: ὅλωςを「決して」とし、誓約・誓言を表すὀμόσαιを現代日本語で明瞭に訳した。目的語を補って意味を限定しなかった。
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: 天にかけても誓ってはなりません
  rationale: 誓いの根拠・対象を示すἐνを、日本語の慣用的な誓言表現「〜にかけて」で表した。μήτεに含まれる禁止を自然な日本語として明示した。
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: 天は神の御座だからです
  rationale: ὅτιの理由を「だからです」で明示し、θρόνοςは聖書的な荘重さと理解しやすさを両立する「御座」とした。文脈上の主語「天」を補った。
theological_decisions:
- issue: μὴ ὀμόσαι ὅλωςの禁止の範囲
  choice: 「決して誓ってはなりません」と無限定の形を保持する
  alternative: 「軽々しく誓ってはなりません」など、特定種類の誓いに限定する
  rationale: 本文自体のὅλωςは包括的に読めるため、解釈によって禁止対象を狭めず、後続の具体例との緊張もそのまま残した。
- issue: ὅτιの論理関係
  choice: 理由を示す「だからです」
  alternative: 説明的な「すなわち」または「というのも」
  rationale: 天にかけて誓ってはならない根拠として、天が神の御座であることを述べる自然な因果関係を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「御座」によって聖書本文にふさわしい品位を保った。原文の一文を日本語では短く区切り、禁止とその理由を理解しやすくした。
