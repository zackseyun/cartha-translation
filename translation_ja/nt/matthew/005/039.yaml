reference: Matthew 5:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: ja
  text: しかし、わたしはあなたがたに言います。悪を行う者に抵抗してはなりません。[a] むしろ、だれかがあなたの右の頬を平手で打つなら、もう一方の頬もその人に向けなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悪に抵抗してはならない」とも訳せる。また、「悪い者に抵抗してはならない」とも訳せる。この句は、悪一般、悪を行う人、あるいは特定の悪しき人格的存在を指す可能性がある。
    reason: τῷ πονηρῷは文法上、中性の抽象的な「悪」、男性の一般的人物、または特定の人格的存在として解し得るため。
  - marker: b
    text: 直訳に近くは「もう一方もその人に向けなさい」。文脈上、「もう一方」はもう一方の頬を指す。
    reason: ギリシア語では二度目の「頬」が省略されているため。
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: 抵抗してはなりません
  rationale: ἀνθίστημιの基本的な意味である「立ち向かう、抵抗する」を保ちつつ、報復だけに意味を狭めない表現とした。直後の例からは、ここでは特に相手にやり返さないことが念頭にあると考えられる。
- source_word: τῷ πονηρῷ
  choice: 悪を行う者
  rationale: 冠詞付き形容詞は、中性の「悪」、一般的な男性の「悪い人」、特定の人格的存在である「悪い者」のいずれにも解し得る。続く例が危害を加える人を扱うため、本文では人間一般を指す表現を採用し、文法上の別解は脚注に残した。
- source_word: ῥαπίζει
  choice: 平手で打つ
  rationale: ῥαπίζωは手で打つこと、特に平手打ちを表し得る。頬という目的語にも合い、単なる打撃だけでなく侮辱の含みも伝えやすい。
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: 右の頬を
  rationale: σιαγώνは顎または頬を意味するが、平手打ちの文脈では日本語の「頬」が自然である。打撃動詞とともに用いられたεἰςは、日本語では目的語を示す「を」で表した。
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: もう一方の頬もその人に向けなさい
  rationale: στρέφωの「向ける、振り向ける」という直接的な意味を保った。「もう一方」が頬を指すことを日本語で明確にし、「差し出す」のような解釈的に強い語は避けた。
- source_word: ὅστις
  choice: だれかが…なら
  rationale: 不特定の人物を条件的に示す構文として、現代日本語で自然な形にした。
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: しかし、わたしはあなたがたに言います
  rationale: δέの対照を「しかし」で示し、ἐγώの明示による「わたし」の強調も残した。前節までの教えと対比される、イエスの権威ある発言形式を明瞭に表す。
theological_decisions:
- issue: τῷ πονηρῷの指示対象
  choice: 一般的な人間を指す「悪を行う者」
  alternative: 抽象的な「悪」、または特定の人格的存在を指す「悪い者」
  rationale: この句は文法上 genuinely ambiguous である。直後の平手打ちの例は人間の加害者を示唆するため本文では一般的な人物として訳したが、抽象的な悪や悪魔を指す可能性を排除せず脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の厳粛さを保つため「してはなりません」「向けなさい」とした。「平手で打つ」により具体性と侮辱のニュアンスを示し、過度に口語的な「ビンタする」は避けた。
