  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: ja
  text: しかし、あなたがたの言葉は、「はい」なら「はい」、「いいえ」なら「いいえ」であるようにしなさい。それらを超えることは、悪い者[a]から出るのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪から」。ギリシア語は、人格的な「悪い者」とも、非人格的な「悪」とも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: ～としなさい
  rationale: εἰμίの三人称現在命令形。日本語では、発言をそのようなものにせよという勧めを自然かつ明確に表す。
- source_word: ὁ λόγος ὑμῶν
  choice: あなたがたが言うこと
  rationale: ここでλόγοςは日常の発言を指す。「あなたがたのことば」より自然な現代日本語としつつ、発言内容に焦点を保つ。
- source_word: ναὶ ναί, οὒ οὔ
  choice: 「はい」なら「はい」、「いいえ」なら「いいえ」
  rationale: 原文の反復と対句を保ちながら、日本語で、肯定や否定を偽りなく明確に述べるという意味が伝わる形にした。
- source_word: τὸ δὲ περισσὸν τούτων
  choice: それ以上のこと
  rationale: 直前の単純で明確な肯定・否定を越えて付け加えられるものを指す。簡潔で自然な比較表現とした。
- source_word: ἐκ
  choice: ～から出る
  rationale: 起源・源を示す前置詞。日本語では述語を補い、「～から出る」とすることで意味を明確にした。
- source_word: τοῦ πονηροῦ
  choice: 悪い者
  rationale: 冠詞付き属格は人格的な「悪い者」と非人格的な「悪」のいずれにも解し得る。マタイにおける人格的用法を考慮して本文では「悪い者」とし、別解を脚注に残した。
theological_decisions:
- issue: τοῦ πονηροῦを人格的な「悪い者」と取るか、非人格的な「悪」と取るか
  choice: 悪い者
  alternative: 悪
  rationale: 文法上は両義的だが、マタイではὁ πονηρόςが人格的に用いられる例があるため、本文では可能性の高い人格的理解を採用した。ただし原文の曖昧さを解消しすぎないよう、非人格的理解を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の端的な調子と原文の対句的なリズムを保った。「悪い者」は理解しやすさを優先しつつ、脚注で原文の神学的・文法的な両義性を明示した。
