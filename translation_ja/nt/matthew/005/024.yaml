  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: ja
  text: 供え物をそこに、祭壇の前に置いて、まず行って兄弟[a]と和解しなさい。それから来て、供え物を献げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」は原文では男性単数形。この文脈の和解の原則は、より広い対人関係にも当てはまりうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: そこに置いて
  rationale: 供え物をその場所に残すよう命じる表現。日本語では「そこに置いて」が具体的かつ自然である。
- source_word: τὸ δῶρόν σου
  choice: 供え物
  rationale: 神に献げる贈り物を指し、祭壇という文脈では「供え物」が明瞭で自然である。
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: 祭壇の前に
  rationale: 空間的な位置関係をそのまま明確に伝える。
- source_word: ὕπαγε πρῶτον
  choice: まず行って
  rationale: 和解が献げ物に先立つという順序と優先性を保つ。
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: 兄弟と和解しなさい
  rationale: διαλλάγηθι の受動的な形を自然な日本語で表し、与格は相互的関係を示す「と」で訳した。
- source_word: καὶ τότε ἐλθὼν
  choice: それから戻って来て
  rationale: τότε の時間的順序を示し、祭壇のもとへ再び来ることを文脈上自然な「戻って来て」で表した。
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: 供え物を献げなさい
  rationale: 祭儀的な提示を表すため、現代日本語として格調もある「献げる」を用いた。
theological_decisions:
- issue: ἀδελφός の対象範囲
  choice: 兄弟
  alternative: 兄弟姉妹／仲間
  rationale: 原文の男性単数形を本文では保持する一方、この倫理的教えが男性の実兄弟だけに限定されない可能性を脚注で明示した。
- issue: διαλλάγηθι の関係表現
  choice: 兄弟と和解しなさい
  alternative: 兄弟に和解してもらいなさい
  rationale: 受動命令形の含みを不自然に一方的な意味へ限定せず、相互的な関係回復として自然に表現した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、命令の厳粛さを保った。「供え物」「祭壇」「献げる」により祭儀的文脈を自然に示した。脚注記号[a]は本文に付した。
