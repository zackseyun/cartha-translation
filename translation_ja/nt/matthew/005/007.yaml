  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: ja
  text: あわれみ深い人たちは幸いである。その人たちこそ、あわれみを受けるであろう[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は未来受動態で、だれがあわれみを示すのかは明示されていない。
    reason: 未来受動態の形と、行為者を明示しない原文の含みを示すため。
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いである
  rationale: 単なる主観的な幸福感ではなく、神の恵みのもとにある祝福された状態を表す。日本語の「幸いである」は、山上の説教にふさわしい簡潔で格調ある定型を保つ。
- source_word: οἱ ἐλεήμονες
  choice: あわれみ深い人たち
  rationale: 定冠詞付き形容詞の名詞的用法を自然な日本語で表した。「あわれみ深い」は、困窮する人への憐憫と実際の慈悲を含み、後半の「あわれみ」と語の響きを対応させる。
- source_word: ὅτι
  choice: からである
  rationale: 祝福の理由または根拠を示す因果関係を、明瞭で自然な現代日本語で表す。
- source_word: αὐτοὶ
  choice: その人たちこそ
  rationale: 代名詞の強調を「こそ」で示し、あわれみ深い人たちと、あわれみを受ける人たちとの対応を明確にする。
- source_word: ἐλεηθήσονται
  choice: あわれみを受ける
  rationale: ἐλεάωの未来受動態。自然な日本語を用いつつ、前半の「あわれみ深い」との語彙的な反復を保つ。時制上の約束は文脈によって伝わる。
theological_decisions:
- issue: 約束されたあわれみを与える主体
  choice: 「あわれみを受ける」とし、主体を明示しない
  alternative: 「神からあわれみを受ける」
  rationale: 文脈上は神が主体であることが強く示唆されるが、ギリシア語の受動態は主体を明記していないため、その含みと余地を保つ。
- issue: あわれみ深さと受けるあわれみとの関係
  choice: 「からである」で本文の因果的な形を保つ
  alternative: 条件文として「もしあわれみ深くするなら」と言い換える
  rationale: 本文は条件文ではなく祝福の宣言とその根拠である。功績による報酬などの体系を訳文に付加せず、原文の神学的緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、至福の教えの簡潔さと格調を保った。「憐れみ」は漢字表記を避けて「あわれみ」とし、一般読者への読みやすさを優先した。
