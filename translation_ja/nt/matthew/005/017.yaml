id: MAT.5.17
reference: Matthew 5:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: ja
  text: 「わたしが律法や預言者を廃止するために来た、と思ってはならない。廃止するために来たのではなく、成就する[a]ために来たのである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「成就する」は、「完成へ導く」または「余すところなく実現する」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: と思ってはならない
  rationale: μήを伴うアオリスト接続法の禁止を、明瞭で自然な現代日本語として表した。
- source_word: ἦλθον
  choice: 来た
  rationale: 単純アオリストを自然に表し、原文どおり二つの節で繰り返した。
- source_word: καταλῦσαι
  choice: 廃止する
  rationale: 律法と預言者を物理的に破壊する意味ではなく、効力をなくし、退けるという文脈上の意味を、現代日本語で明確に示す。
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: 律法や預言者
  rationale: イスラエルの聖書を指す定型的な組み合わせとして理解できる自然な日本語とした。「や」はここで、どちらか一方を廃止するという意味を含む原文のἢを文脈に即して表す。
- source_word: πληρῶσαι
  choice: 成就する
  rationale: 実現する、完成へ導く、十全に表すなどの含みを保てる、聖書文脈で定着した訳語を用いた。意味を一つに限定しないよう脚注を付した。
theological_decisions:
- issue: イエスが律法や預言者を「成就する」（πληρῶσαι）ことの意味
  choice: 「成就する」とし、単一の神学的解釈に限定しない
  alternative: 完成する／余すところなく実現する／本来の意図を十全に示す
  rationale: πληρῶσαιには複数の相関する理解が可能であり、本節だけで特定の教派的説明に狭めず、原文の神学的な広がりと緊張を保つため。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの宣言にふさわしい簡潔で格調ある文体とした。「廃する」より一般読者に分かりやすい「廃止する」を採用し、「成就する」はその神学的・聖書的な含意を保つため脚注で補った。
