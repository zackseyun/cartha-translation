  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: ja
  text: なぜなら、あなたがたを愛する人たちを愛するなら、どんな報いがあるでしょうか。[a] 徴税人たちも、同じことをしているではありませんか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どんな賃金があるでしょうか」とも訳せる。ギリシア語は「賃金」と「報い」のどちらも意味しうるが、ここではイエスの教えの文脈における応報を指す。
    reason: lexical_alternative
  - marker: b
    text: 「同じことを」に当たる語句には、写本間で異同がある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: 〜したからといって
  rationale: γάρによる前節からの論理的つながりと、ἐάνの条件を、日本語で自然な理由提示を伴う条件表現として示す。
- source_word: ἀγαπήσητε
  choice: 愛した
  rationale: ἐάνを伴うアオリスト接続法の一般的条件を、日本語の仮定的な言い回しの中で自然に表す。特定の過去の一回的行為には限定しない。
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: あなたがたを愛してくれる人たち
  rationale: 実質的に名詞化された現在分詞を明瞭に訳し、相手から向けられる愛という相互性を自然な日本語で表す。
- source_word: τίνα μισθὸν ἔχετε
  choice: いったい何の報いがあるでしょうか
  rationale: μισθόςの文脈上の意味を「報い」とし、τίναの問いの強さを「いったい」で示す。「ある」はἔχετεを日本語として自然に表現する。
- source_word: οὐχὶ καὶ
  choice: 〜でさえ、…しているではありませんか
  rationale: 肯定の答えを予期するοὐχίの修辞疑問と、καίの強意を、日本語の「でさえ」「ではありませんか」で再現する。
- source_word: οἱ τελῶναι
  choice: 徴税人たち
  rationale: 税や通行税を徴収した当時の人々を簡潔かつ現代的に示す。文脈上の社会的評価を訳語自体に付加しない。
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: 同じことをしている
  rationale: 「同じことを行う」という原文の簡潔な表現を自然な現代日本語で保つ。
theological_decisions:
- issue: イエスの倫理的教えにおけるμισθόςの意味
  choice: 報い
  alternative: 賃金／報酬
  rationale: 神からの応報を含みうる文脈的意味を保ちながら、功績によって機械的に賃金を得るという特定の教理を持ち込まない。「報い」は肯定・否定いずれの含みも文脈に委ねられる。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。修辞疑問の力を保ちつつ、通常の読者に自然に響く語順とした。「徴税人」は歴史的職業を示し、説明的・評価的な語を本文に加えていない。
