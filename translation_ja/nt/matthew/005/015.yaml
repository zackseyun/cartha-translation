id: MAT.5.15
reference: Matthew 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: ja
  text: また、人は灯火をともして、それを升[a]の下に置いたりはせず、むしろ灯火台の上に置きます。そして、それは家の中にいるすべての人を照らします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「升（ます）」は穀物などを量る容量の単位であり、ここではその計量容器を指します。伝統的には「枡」とも訳されます。原語のμόδιοςは乾量の単位、およびその容器を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: また、…人はいません
  rationale: 前節に続く否定の例であることを「また」で示し、主語の明示されない一般的な複数形を、日本語で自然な一般論として表した。
- source_word: καίουσιν λύχνον
  choice: 明かりをともして
  rationale: λύχνοςは具体的には油皿型の灯火を指すが、日本語では「明かりをともす」が自然で、物としての灯火とその光のイメージを保てる。
- source_word: τιθέασιν αὐτὸν
  choice: それを…置く
  rationale: 指示代名詞を明示し、灯火をどこに置くかという対比を保った。
- source_word: ὑπὸ τὸν μόδιον
  choice: 升の下に
  rationale: μόδιοςは穀物などを量る乾量升、およびその容器を指す。「升」は簡潔で原語の計量容器という意味を保つが、現代の読者には補足が必要なため脚注を付した。
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: 燭台の上に置きます
  rationale: λυχνίαは灯火を載せる台を指す。「燭台」は現代日本語でも理解でき、升の下との位置的対比を明確にする。
- source_word: λάμπει
  choice: 照らします
  rationale: λάμπωの「輝く」と、与格で示された人々に光が及ぶ結果の両方を、この文脈では「照らす」が自然に表す。
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: 家の中にいるすべての人を
  rationale: πᾶσινの包括性と、οἰκίᾳの空間的意味を明確に保った。
theological_decisions:
- issue: 主語が明示されない一般的な三人称複数形
  choice: …人はいません
  alternative: 人々は…しません／彼らは…しません
  rationale: 特定の集団を指す「彼ら」を避け、格言的な一般性を自然な日本語で表した。
- issue: λάμπειと与格の関係
  choice: すべての人を照らします
  alternative: すべての人のために輝きます
  rationale: 原文は直訳的には「家にいるすべての人に輝く」とも表せる。「照らす」は光が人々に届く機能を自然に示すが、原語の自動詞的表現も脚注に値するほどの神学的差異はないと判断した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節とのつながりを「また」で示し、長い一文を二文に分けて、升の下と燭台の上の対比を読み取りやすくした。
