  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: ja
  text: あなたがたは世の光です。山[a]の上にある町が隠されることはできません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「山」は「丘」とも訳せる。
    reason: ὄροςの語義上の別訳
lexical_decisions:
- source_word: Ὑμεῖς
  choice: あなたがた
  rationale: 二人称複数代名詞が明示され、強調を伴う。日本語では主語を明記することで、弟子たちへの直接的な呼びかけを保つ。
- source_word: τὸ φῶς
  choice: 光
  rationale: 日本語では述語名詞に冠詞を反映できないが、「世の光」という定表現で、比喩的な同定を自然に保つ。
- source_word: τοῦ κόσμου
  choice: 世の
  rationale: 属格を「世の」と訳し、「世のための」と目的を補って解釈することを避ける。κόσμοςはここで広く人間世界を指す。
- source_word: οὐ δύναται
  choice: …ことができません
  rationale: 能力・可能性の否定を明示し、原文の不可能性を自然な現代日本語で表す。
- source_word: πόλις
  choice: 町
  rationale: πόλιςは都市・町を指す。山上の集落という情景には、現代日本語の「町」が自然で、規模を過大に限定しない。
- source_word: κρυβῆναι
  choice: 隠れる
  rationale: 受動形は文脈上「見えない状態になる」ことを表す。日本語では「隠される」より「隠れる」が町を主語とする自然な表現であり、受動的意味も文脈に保たれる。
- source_word: ἐπάνω ὄρους
  choice: 山の上に
  rationale: ὄροςの基本的な地形語義を「山」とし、ἐπάνωを「上に」で対応させる。丘とする可能性は脚注に示す。
- source_word: κειμένη
  choice: ある
  rationale: 「横たわっている／位置している」という状態を、場所にある町について自然な日本語の「ある」で表す。
theological_decisions:
- issue: 弟子たちを光とする比喩的同定
  choice: 「あなたがたは世の光です」と直接的な比喩を保持する。
  alternative: 「あなたがたは世のための光です」
  rationale: 属格を目的・受益として説明的に解消せず、弟子たちの役割を示す原文の比喩と神学的な含みをそのまま保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準語。前半は簡潔な比喩を維持し、後半は原文の語順と論理に近づけつつ自然な日本語とした。敬体は日本語版本文の読みやすさを考慮して採用した。
