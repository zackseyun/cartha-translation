id: MAT.5.12
reference: Matthew 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: ja
  text: 喜びなさい。大いに喜びなさい。あなたがたの報いは天[a]において大きいからです。このように、あなたがたより前にいた預言者たちを迫害したのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシャ語では「諸天で」と複数形。マタイは、日本語で通常「天」と言う場合にもこの複数形をしばしば用いる。
    reason: 原文の複数形を示しつつ、本文では自然な日本語の「天」を用いるため。
lexical_decisions:
- source_word: χαίρετε
  choice: 喜びなさい
  rationale: 現在命令形の呼びかけを、明快で自然な現代日本語の命令表現で示した。
- source_word: ἀγαλλιᾶσθε
  choice: 大いに喜びなさい
  rationale: χαίρετεより強い、あふれるような喜びを、一般読者にも分かりやすい表現で伝えた。
- source_word: μισθὸς
  choice: 報い
  rationale: ここでは迫害に対して神から与えられるものを指すため、商取引的な響きの強い「賃金」ではなく「報い」とした。
- source_word: πολὺς
  choice: 大きい
  rationale: 報いの大きさを表す述語形容詞の強調を、自然な日本語で保持した。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天で
  rationale: ギリシャ語は複数形だが、日本語では神の領域を指す場合「天」が自然であり、複数性は脚注で明示した。
- source_word: οὕτως
  choice: 同じように
  rationale: 弟子たちへの迫害と先の預言者たちへの迫害との対応関係を明確にした。
- source_word: ἐδίωξαν
  choice: 人々は…迫害した
  rationale: 文脈上の不特定の主語を「人々」と補い、能動態と敵対的な意味を保った。
- source_word: τοὺς προφήτας τοὺς πρὸ ὑμῶν
  choice: あなたがたより前の預言者たち
  rationale: 弟子たちに先立つ歴史上の預言者たちを指す修飾関係を簡潔に表した。
theological_decisions:
- issue: 「天で」の意味と複数形
  choice: 神の領域を指す自然な日本語として「天で」と訳す
  alternative: 「もろもろの天で」「諸天で」と形式的に複数形を示す
  rationale: 原文の複数形を教理的な複数天の主張として確定せず、マタイに見られる表現上の複数形として脚注に残した。
- issue: 報いの位置と受領
  choice: 「天であなたがたが受ける報い」とする
  alternative: 「あなたがたの報いは天で大きい」と語順をより形式的に保つ
  rationale: 報いが神から与えられるという文脈を自然に伝えつつ、時期や仕組みについて原文以上の限定は加えていない。
translation_notes:
  register: 明快な現代標準日本語。二つの命令を分けて喜びの強まりを示し、荘重さを保ちながらも日常語として理解しやすい表現にした。
