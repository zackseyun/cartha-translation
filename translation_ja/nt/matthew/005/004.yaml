  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: ja
  text: 悲しむ人たちは幸いである[a]。その人たちは慰められるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「嘆く人たち」。ギリシア語は意味が広く、悲しみの原因を特定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いである
  rationale: 主観的な感情としての「幸福」だけでなく、神の前で祝福された状態を告げる至福の宣言としての評価的な力を保ち、日本語の聖書文体でも自然である。
- source_word: οἱ πενθοῦντες
  choice: 悲しむ人たち
  rationale: 冠詞付き現在分詞を人々を指す表現として自然に訳した。πενθέωは喪失、苦難、罪などをめぐる深い悲しみや嘆きを表し得るが、本文はその原因を限定していない。
- source_word: ὅτι
  choice: からである
  rationale: 祝福を宣言する根拠を示す因果関係を明確に表す。
- source_word: αὐτοὶ
  choice: その人たち
  rationale: 先に述べた「悲しむ人たち」こそが慰めを受けるという指示と軽い強調を、日本語として不自然にならない形で表した。
- source_word: παρακληθήσονται
  choice: 慰められる
  rationale: 未来受動形を保ち、慰めを受けるという意味を簡潔で自然な日本語にした。行為者は原文同様に明示しない。
theological_decisions:
- issue: 悲しみの範囲
  choice: 悲しみの原因を特定せず、「悲しむ人たち」と広く訳す。
  alternative: 罪を悲しむ人たち／一般に嘆き悲しむ人たち／イスラエルの状態を嘆く人たち
  rationale: ギリシア語本文は悲しみの対象や原因を明示していないため、個人的喪失、罪、抑圧、終末的待望などのいずれかに限定せず、本文の神学的・牧会的な広がりを保つ。
- issue: 慰める者の特定
  choice: 受動態のまま「慰められる」とし、行為者を明示しない。
  alternative: 神に慰められる
  rationale: 神が暗黙の行為者である可能性は高いが、原文は明示していないため、翻訳本文では補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、至福の宣言にふさわしい簡潔で格調ある「幸いである」という形を採用した。後半の「その人たちは」は αὐτοὶ の指示と強調を自然に反映する。
