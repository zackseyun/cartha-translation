id: MAT.5.47
reference: Matthew 5:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: ja
  text: また、自分の兄弟たち[a]にだけ挨拶をするなら、何か格別なことをしているのでしょうか[b]。異邦人[c]も同じことをしているではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」または「仲間」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは自分と同じ集団に属する人々を広く指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「何を余分にしているのですか」。「何が格別なのでしょうか」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「異教徒」と訳すこともできるが、基本的にはユダヤ人ではない人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: 挨拶をする
  rationale: 相手に挨拶や敬意を表す行為を指す。文脈上、歓待という意味まで加えず、現代日本語として自然な表現を選んだ。
- source_word: ἀδελφοὺς ὑμῶν
  choice: 自分の兄弟たち
  rationale: 語の男性複数形を保ちつつ、文脈上は肉親だけでなく仲間や同じ集団の人々を広く指し得るため、その可能性を脚注に示した。
- source_word: μόνον
  choice: だけ
  rationale: 挨拶する相手を自分の兄弟たちに限定する意味を、簡潔で自然な日本語で表す。
- source_word: τί περισσὸν ποιεῖτε
  choice: 何が人並み以上なのでしょうか
  rationale: περισσόν が表す『通常を越えたもの、より優れたもの』という比較的な含みを保ち、直訳調を避けて修辞疑問として自然にした。
- source_word: ἐθνικοὶ
  choice: 異邦人
  rationale: ユダヤ人ではない人々を指す語として、民族的・契約共同体的な対比を保つ。『異教徒』では宗教的評価を強めすぎる可能性がある。
- source_word: τὸ αὐτό
  choice: 同じこと
  rationale: 直前の『自分の仲間だけに挨拶する』行為を受ける自然な表現。
theological_decisions:
- issue: ἀδελφοὺς の指示範囲
  choice: 本文では『兄弟たち』とし、同じ集団に属する人々を広く指し得ることを脚注に示す。
  alternative: 『兄弟姉妹』『仲間』
  rationale: 原語の男性複数形を保持しながら、教えの対象範囲を男性の肉親だけに限定してしまわないよう、原語にある指示範囲の曖昧さを保存する。
- issue: περισσόν の倫理的含意
  choice: 『人並み以上』
  alternative: 『何を余分に』『何が格別』
  rationale: 弟子の行いが一般的な相互性を越えているかを問う比較的な力点を示すが、功績や救いの条件といった特定の教理までは読み込まない。
- issue: ἐθνικοὶ の意味
  choice: 『異邦人』
  alternative: 『異教徒』『諸国民』
  rationale: 第一義的な非ユダヤ人という意味を保ち、原語以上に宗教的・道徳的な非難を強めない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。二つの修辞疑問を自然な敬体で表し、語気を不必要に攻撃的にしない。
