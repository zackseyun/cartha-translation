base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: ja
  text: ですから、あなたがたは、天におられるあなたがたの父が完全であるように、完全[a]でありなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「完全」は、「完全な」「全体的な」または「成熟した」とも訳せる。ギリシア語τέλειοςには、完全さだけでなく、全体性や成熟という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: 完全でありなさい
  rationale: 未来形だが、文脈上は勧告・命令の力を持つ。現代日本語では「ありなさい」がその厳粛な要請を自然に伝える。
- source_word: οὖν
  choice: ですから
  rationale: 直前の敵を愛する教えから導かれる結論であることを、明瞭で自然な現代日本語で示す。
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された複数代名詞の強調を保ち、弟子たちへの直接的な呼びかけを表す。
- source_word: τέλειοι / τέλειός
  choice: 完全
  rationale: 弟子たちと父について反復される同一語を同じ訳語で対応させ、比較の修辞的な力を保つ。語義には「全き」「成熟した」も含まれるため脚注で示す。
- source_word: ὡς
  choice: ように
  rationale: 弟子たちへの要請と天の父との比較を自然な日本語で表す。
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: 天の父
  rationale: 日本語では文脈上「あなたがたの」を省いても関係が明瞭であり、簡潔で定着した表現となる。原文の所有関係は文脈に含意される。
theological_decisions:
- issue: 倫理的勧告における τέλειος の意味
  choice: 本文では「完全」とし、脚注で「全き、欠けのない、成熟した」の可能性を示す。
  alternative: 全き／欠けのない／成熟した
  rationale: 「完全」は原語との直接的な対応と厳しい倫理的要請を保つ一方、直前の文脈では敵をも含む分け隔てのない愛という全体性が中心にある。脚注により、神との存在上の同等性や単純な無罪性へ意味を固定せず、原語の幅を保持する。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「ですから」で論理的つながりを示し、「ありなさい」で勧告的な未来形の命令力を表した。脚注マーカーは本文中に配置した。
