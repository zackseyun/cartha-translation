base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: ja
  text: また、こう言われた。「自分の妻と離婚する者は、妻に離婚証書を渡さなければならない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の妻を去らせる者は、妻に離婚証書を渡さなければならない」とも訳せる。ここで「離婚する」と訳したギリシア語は「去らせる」という意味にもなりうるが、この箇所では婚姻に関する法的文脈で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: また、こう言われている
  rationale: 引用を導入する定型表現として自然な日本語にした。δέはここでは新しい論点への移行を示すため、「しかし」と強い対立にせず「また」とした。ギリシア語はアオリスト受動形だが、日本語では現在にも通じる既成の言説として「言われている」が自然である。
- source_word: Ὃς ἂν
  choice: …する者は
  rationale: 不特定の一般条件を、法的な引用に合う簡潔な日本語で表した。
- source_word: ἀπολύσῃ
  choice: 離縁する
  rationale: 一般には「解放する、去らせる」の意味もあるが、妻と離縁状が明示される婚姻法上の文脈なので「離縁する」とした。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻
  rationale: γυνήは「女」にも「妻」にもなり得るが、所有表現と離婚の文脈から「妻」が適切である。日本語では主語との関係が明白なので「自分の」を補わなかった。
- source_word: δότω αὐτῇ
  choice: 妻に…渡しなさい
  rationale: 三人称命令を、引用された規定として自然な直接命令形で表した。αὐτῇの指示対象を明確にするため「妻に」とした。
- source_word: ἀποστάσιον
  choice: 離縁状
  rationale: 離婚を成立・証明する書面を指すため、簡潔で法的文書性を保つ「離縁状」とした。
theological_decisions:
- issue: モーセの離婚規定とイエスの言葉との関係
  choice: この節は法的な言い伝えの引用として訳し、それへの賛否を訳文に加えない。
  alternative: 離婚手続きを是認する命令、または単なる当時の慣行の説明として解釈的に訳す。
  rationale: この節は次節でイエスが取り上げる言葉を提示している。離婚倫理をめぐる評価はこの節だけで先取りせず、原文の緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、引用された法的規定としての簡潔さと格調を保った。「離縁」は日常語の「離婚」よりやや文語的だが、「離縁状」と対応し、この文脈の法的・歴史的性格を自然に示す。
