  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: ja
  text: しかし、わたしはあなたがたに言います。自分の敵を愛し、自分を迫害する人たちのために祈りなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分を迫害する人たちを思って祈りなさい」とも表現できる。
    reason: ὑπέρ＋属格は、ここでは迫害する人たちのために、その人たちの益を願って祈ることを示す。代理として祈る意味に限定しない。
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: しかし、わたしはあなたがたに言います
  rationale: δέの対照を「しかし」で示し、明示されたἐγώの強調を「わたしは」で保った。説教の中の直接的で格調ある語りとして「言います」とした。
- source_word: ἀγαπᾶτε
  choice: 愛しなさい
  rationale: 現在命令形の継続的側面を不自然に強調せず、命令の倫理的な力を標準的な表現で伝える。
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: 自分の敵を
  rationale: 敵対関係を弱めず、同一文中の「自分を迫害する人たち」と自然に対応させた。
- source_word: προσεύχεσθε
  choice: 祈りなさい
  rationale: προσεύχομαιの命令を、自然で明確な日本語の命令表現とした。
- source_word: ὑπὲρ
  choice: ～のために
  rationale: 属格を伴うὑπέρがここで表す、相手のため・益を願って祈る意味を自然な日本語で示す。「代わって」という代理性に限定しない。
- source_word: τῶν διωκόντων ὑμᾶς
  choice: 自分を迫害する人たち
  rationale: 実体詞的な現在分詞の動作性を保ち、単なる肩書きの「迫害者」よりも自然かつ具体的に訳した。
theological_decisions:
- issue: 敵への命令の範囲
  choice: 「愛し」「祈りなさい」と直接訳し、その具体的内容を補足しない
  alternative: 善行、無抵抗、祝福、悔い改めや回心のための祈りなどを明示する
  rationale: ギリシア語本文は敵への愛と迫害する者のための祈りを命じるが、その実践の全範囲や祈りの具体的内容まではここで定めていないため、解釈を付加せず緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、山上の説教にふさわしい簡潔で格調ある命令調とした。「あなたがた」を用いて複数形を明示した。
