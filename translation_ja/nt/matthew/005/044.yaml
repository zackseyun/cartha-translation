  source_fidelity: 本文はSBLGNTの二つの命令（「敵を愛する」「迫害する者のために祈る」）を忠実に伝えている。「わたしは」「しかし」はἐγὼとδέによる対照・強調を適切に反映する。もっとも、脚注の「に代わって」「代表して」は、この文脈のὑπέρ（属格）に通常含意される『その人のために／益を願って』を代理行為へ不適切に狭める。
  naturalness: 本文は明瞭な現代標準日本語として自然であり、山上の説教に合う簡潔な命令調である。「自分の敵」「自分を迫害する人たち」は、複数の聞き手に対する分配的な表現として無理がない。
  terminology: 「愛しなさい」「迫害する人たち」「祈りなさい」はいずれも定着した適切な訳語である。脚注は『代わって』ではなく、『その人たちを思って／その人たちの益を願って』という祈りの対象・受益を示す表現に改める必要がある。
