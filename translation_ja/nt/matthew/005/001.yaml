id: MAT.5.1
reference: Matthew 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: ja
  text: イエスは群衆を見て、山に登られた。そして腰を下ろされると、弟子たちがイエスのもとに来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: 見て
  rationale: アオリスト分詞が主動詞の状況を示す。日本語では「見て」が自然で、時間関係を必要以上に限定しない。
- source_word: δὲ
  choice: 訳出しない
  rationale: ここでは弱い接続・転換を示すため、明示的に訳さないほうが自然な日本語になる。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: 原文は複数形だが、日本語の集合名詞「群衆」は人数の多い人々を自然に表し、文脈上の意味を保つ。
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: 山に登られた
  rationale: 上方へ移動して山へ入ることを自然に表す。「登る」は文脈に適し、「に」によって到達方向も示す。主語イエスへの日本語として自然な敬意を保つ。
- source_word: τὸ ὄρος
  choice: 山
  rationale: ὄροςの基本義を採用する。定冠詞は日本語では通常明示できず、特定の山名を補わない。
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: そして腰を下ろされると
  rationale: 属格独立構文の時間的・状況的関係を「すると」で自然に示し、厳密な前後関係を過度に強めない。「腰を下ろす」は着席動作を明確にする。
- source_word: προσῆλθαν αὐτῷ
  choice: みもとに来た
  rationale: 「彼のところに来た」という接近を、弟子とイエスの関係にふさわしい自然で格調ある日本語にする。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: μαθηταίの標準的な訳。複数であることを「たち」で示し、所有関係は文脈上明白なので重い「彼の」を避ける。
theological_decisions:
- issue: τὸ ὄροςの定冠詞
  choice: 山
  alternative: その山／ある山／山腹
  rationale: ギリシア語には定冠詞があるが、日本語で「その山」とすると既出・特定済みという含みを強めかねない。「山」は原文の地形語を保ちつつ、特定の名のある山とは断定しない。
- issue: καθίσαντος αὐτοῦの時間関係
  choice: 腰を下ろされると
  alternative: 腰を下ろされた後／腰を下ろしておられるとき
  rationale: 属格独立構文は次の出来事との時間的・状況的関係を示す。「すると」は自然な推移を示すが、「後」として厳密な継起を過度に固定せず、着座した教師という儀礼的意味も付加しない。
- issue: イエスを主語とする敬語
  choice: 登られた／腰を下ろされる
  alternative: 登った／腰を下ろすと
  rationale: 現代日本語の聖書文体として自然な尊敬表現を用いるが、神学的称号や原文にない評価語は加えない。弟子の動作には敬語を用いず、主語関係を明瞭にする。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語文とした。原文にない固有名や山の特定は加えず、分詞構文と属格独立構文の時間関係も過度に限定していない。
