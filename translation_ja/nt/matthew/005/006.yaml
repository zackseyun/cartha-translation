  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: ja
  text: 義[a]に飢え渇いている人々は幸いです。彼らは満たされるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正義」とも訳せます。このギリシア語は、神の前で正しいことも意味し得ます。
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いです
  rationale: 祝福された状態を宣言する山上の説教の定型表現として、心理的な「幸福」だけに狭めず、現代日本語として自然で格調のある「幸いです」とした。
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: 飢え渇く人たち
  rationale: 現在分詞が表す継続的で切実な希求を保ち、比喩の力を簡潔な日本語で伝える。
- source_word: τὴν δικαιοσύνην
  choice: 義に
  rationale: δικαιοσύνηの、神の前で正しいこと、正しい関係や公正を含みうる広がりを残す聖書語として「義」を用いた。目的語の対格は、日本語では「義に飢え渇く」と自然に表した。
- source_word: ὅτι
  choice: からです
  rationale: 前半の幸いである理由を明示する接続として、明快な現代日本語にした。
- source_word: αὐτοὶ
  choice: 彼らは
  rationale: 明示された代名詞の焦点をある程度保ち、前半の人々こそが満たされるという対応を示した。
- source_word: χορτασθήσονται
  choice: 満たされる
  rationale: 未来受動形を保ち、飢え渇きの比喩と呼応させる。「満ち足りる」よりも、行為者が明示されない神的受動の余地を残す。
theological_decisions:
- issue: δικαιοσύνηの意味範囲
  choice: 義
  alternative: 正義／公正
  rationale: 本文では個人的徳、公正、神の前で正しいことを一語に限定せず保持できる「義」を採用し、社会的な正義・公正を含みうることを注で明示した。
- issue: χορτασθήσονταιの受動態
  choice: 満たされる
  alternative: 神が満たしてくださる
  rationale: 原文は行為者を明示しないため、神が行為者である可能性を保ちつつ、本文では補わず受動表現を維持した。
translation_notes:
  register: 明瞭な現代標準日本語。八福の宣言としての簡潔さと格調を保ち、「です」で一般読者にも読みやすくした。脚注記号は対応箇所が分かるよう文末に置いた。
