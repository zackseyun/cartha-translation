  text: そして、口を開いて彼らに教え、こう言われた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には、「そして、口を開いて、彼らに教えておられた。こう言って」とも訳せる。原文の「教えていた」は未完了過去形であり、「こう言って」は後に続く教えを導く分詞である。
