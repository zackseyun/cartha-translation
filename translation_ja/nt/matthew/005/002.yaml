lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な接続を保ち、必要以上に強い時間的順序を加えない。
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: 口を開き
  rationale: 「口を開く」という原文の荘重な発話導入表現を保ちつつ、日本語として自然にした。所有代名詞は日本語では自明なため明示しない。
- source_word: ἐδίδασκεν
  choice: 教えて
  rationale: 未完了過去の継続的な様相を文脈に自然な形で表す。「教え始めた」として起動相だけに限定しない。
- source_word: αὐτοὺς
  choice: 彼らに
  rationale: 指示対象を「弟子たち」や「群衆」に限定せず、原文の代名詞の曖昧さを保つ。日本語の「教える」が要求する格に合わせて「に」とした。
- source_word: λέγων
  choice: こう言われた
  rationale: 後続する教えの内容を導入する現在分詞を、現代日本語で自然な発話導入として訳した。敬語はイエスの発話を述べる日本語聖書の格調に適する。
