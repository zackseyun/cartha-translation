  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: ja
  text: 「あなたがたは、『姦淫してはならない』と言われたことを聞いています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には、「あなたがたは、『……』と言われたことを聞いた」。
    reason: Ἠκούσατεのアオリストと引用導入構文の、より形式的な訳を示すため。
lexical_decisions:
- source_word: Ἠκούσατε
  choice: あなたがたは聞いています
  rationale: アオリスト直説法だが、この定型的な導入では、過去に聞いて現在も知っている教えを指す。現代日本語では「聞いています」がその談話上の働きを自然に表す。
- source_word: ὅτι
  choice: 〜のを
  rationale: 聞いた内容を導く補文標識。日本語では引用節を「の」で名詞化し、「聞いています」につなぐのが自然である。
- source_word: ἐρρέθη
  choice: 言われた
  rationale: λέγωのアオリスト受動形を、行為者を明示しない受動表現として訳した。「語られた」より一般読者に自然である。
- source_word: Οὐ μοιχεύσεις
  choice: 姦淫してはならない
  rationale: 未来直説法による禁止で、十戒の命令を引用している。「〜してはならない」は法的・命令的な響きを保ち、「姦淫」は婚姻関係を侵す性的行為を指す語として正確である。
theological_decisions:
- issue: 十戒の引用との関係
  choice: 「姦淫してはならない」という命令形を保つ
  alternative: 「姦淫するな」
  rationale: イエスが十戒として知られる戒めを引用していることを示しつつ、過度に古風またはぞんざいにならない、現代の格調ある禁止表現を用いた。
translation_notes:
  register: 明快な現代標準日本語。引用された戒めには簡潔で格調ある「〜してはならない」を用い、導入句は日常的に理解しやすい表現とした。
