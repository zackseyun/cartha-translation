  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: ja
  text: また、だれかがあなたに一ミリオンの距離を行くよう強いるなら、その人と二ミリオン行きなさい。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「強いる」は、公的権力が人を役務のために強制的に徴用することを指す場合がある。この表現はローマ支配下の強制的な役務を想起させる。
    reason: lexical_alternative
  - marker: b
    text: 一ミリオンはローマの距離単位で、約一・五キロメートル。原文後半は直訳すると「その人と二〔ミリオン〕行きなさい」で、距離単位が省略されている。
    reason: historical_unit_and_ellipsis
lexical_decisions:
- source_word: ὅστις
  choice: だれかが…なら
  rationale: 不定関係代名詞が示す一般的な場合を、現代日本語で自然な条件表現にした。
- source_word: ἀγγαρεύσει
  choice: 行くことを強いる
  rationale: 公的権力によって役務を強制する含みを持つ語。文脈上の移動を示しつつ、単なる依頼ではなく強制であることを明確にした。
- source_word: μίλιον ἕν
  choice: 一ミリオン
  rationale: ローマの距離単位を、現代の英米マイルと同一視せず音写した。
- source_word: ὕπαγε μετ’ αὐτοῦ δύο
  choice: その人と二ミリオン行きなさい
  rationale: μετάの同行の意味と命令形を保ち、二度目には原文で省略されている距離単位を自然な日本語のため補った。
theological_decisions:
- issue: 強制された役務の歴史的・社会的背景
  choice: 強制であることは本文に示すが、ローマ兵には限定しない
  alternative: ローマ兵に荷物を運ばされる場面として明示する
  rationale: 語とローマの距離単位は公権力による徴用を想起させるが、本文は兵士や荷物を明記していないため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。歴史的単位は換算で置き換えず本文に残し、脚注で説明した。「同行しなさい」より具体的な移動を表す「その人と…行きなさい」を採用した。
