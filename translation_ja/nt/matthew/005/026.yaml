id: MAT.5.26
reference: Matthew 5:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: ja
  text: よく言っておく。あなたは最後の一クァドランス[a]を支払うまで、決してそこから出られない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: クァドランスは、当時のローマの少額硬貨。
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν λέγω σοι
  choice: よく言っておく
  rationale: 共観福音書に特徴的な、権威をもって厳粛に断言する定型句。直訳調の「アーメン、あなたに言う」より自然な現代日本語で、その強い語調を表した。
- source_word: οὐ μὴ ἐξέλθῃς
  choice: 決して…出られない
  rationale: οὐ μή＋アオリスト接続法による強い否定を「決して…ない」で保持し、拘束された状況から出ることを「出られない」と自然に表した。
- source_word: ἐκεῖθεν
  choice: そこから
  rationale: 移動の起点を示す語なので、「そこから」と訳した。
- source_word: ἕως ἂν ἀποδῷς
  choice: 支払うまで
  rationale: 支払いが完了する時点まで先の状態が続くことを簡潔に示す。「返す」も可能だが、負債と拘禁の比喩には「支払う」が自然。
- source_word: τὸν ἔσχατον κοδράντην
  choice: 最後の一クァドランス
  rationale: ἔσχατονの最終・残余の含意を「最後の一」で表し、具体的なローマ貨幣名は音写して文化的情報を保持した。
theological_decisions:
- issue: この拘禁と支払いを、終末的裁き、清め、または単なる法的場面のいずれかに限定するか
  choice: 負債を全額支払うまで拘束が続くという具体的な比喩をそのまま訳す
  alternative: 神の最終的裁きや死後の清めを明示する
  rationale: ギリシア語本文は拘禁と完済のイメージを述べるが、その教理的指示対象を明示していないため、解釈上の緊張を残した。
- issue: 「まで」が最終的な釈放を必ず含意するか
  choice: 時間的限界を示す「まで」を保持し、実際に支払い可能か、釈放されるかは明示しない
  alternative: 最終的な釈放を保証する、または永続的拘禁を意味するように補う
  rationale: ἕως ἄνは支払いを境界として示すが、それ以上の教理的結論を翻訳に持ち込むべきではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「よく言っておく」は福音書の定型的な厳粛宣言として自然さと権威性を両立させた。貨幣名は本文で保持し、脚注で簡潔に説明した。
