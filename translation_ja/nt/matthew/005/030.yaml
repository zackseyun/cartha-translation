id: MAT.5.30
reference: Matthew 5:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: ja
  text: また、もしあなたの右手があなたをつまずかせるなら[a]、それを切り落として、捨てなさい。あなたの体の一部が失われるほうが、あなたの全身がゲヘナに行く[b]よりも、あなたにとってよいからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪を犯させる」とも訳せる。「つまずかせる」は、罪へ陥らせることを表す比喩。
    reason: lexical_alternative
  - marker: b
    text: 「地獄」とも訳せる。ギリシア語「ゲヘナ」はヒンノムの谷に由来する語で、終末の裁きを表す語として用いられている。
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: 右の手
  rationale: 身体上の具体性と前節との並行を保つ、自然で明確な訳。
- source_word: σκανδαλίζει
  choice: つまずかせる
  rationale: 罪への転落を生じさせるという比喩を保ち、解釈を本文で「罪を犯させる」に限定しない。
- source_word: ἔκκοψον
  choice: 切り落として
  rationale: 手を対象とする断固とした命令を、現代日本語で直接的に表す。
- source_word: βάλε ἀπὸ σοῦ
  choice: 捨てなさい
  rationale: 自分から遠ざけて放棄するという力強い命令を、冗長さのない自然な日本語で表す。
- source_word: συμφέρει γάρ σοι
  choice: あなたにとってよいからです
  rationale: 利益・有利さの比較を文脈に即して自然に表し、後続する「より」と結びつける。
- source_word: ἵνα ἀπόληται ἓν τῶν μελῶν σου
  choice: 体の一部を失っても
  rationale: 日本語では目的節を譲歩的比較として組み替えることで、全身との対照を明瞭かつ自然に示す。「一部」は μέλος の範囲を「手足」だけに狭めない。
- source_word: ὅλον τὸ σῶμά σου
  choice: 全身
  rationale: 一つの身体部分との全体性の対照を簡潔に保つ。
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: ゲヘナに行く
  rationale: ἀπέρχομαι の能動的な「行く」を保ち、「投げ込まれる」という原文にない受動表現を加えない。γέεννα は音写して歴史的・終末論的含意を保持する。
theological_decisions:
- issue: γέεννα の訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: 原語の歴史的背景と終末の裁きに関する含意を保ち、後代の「地獄」という語に伴う諸観念へ直ちに一本化しない。一般読者の理解のため、脚注で説明する。
- issue: σκανδαλίζει の意味範囲
  choice: つまずかせる
  alternative: 罪を犯させる
  rationale: 原文の転倒の比喩を本文に残しつつ、この文脈で罪への誘因を指すことを脚注で示す。
translation_notes:
  register: 明瞭で厳粛な現代標準語。命令の強さと身体的比喩を保ちながら、比較構文を日本語として自然に整えた。
