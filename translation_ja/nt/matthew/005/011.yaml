id: MAT.5.11
reference: Matthew 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: ja
  text: わたしのために、人々があなたがたを侮辱し、迫害し、偽ってあなたがたについてあらゆる悪口を言うとき、あなたがたは幸いです。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「侮辱し」は「ののしり」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたについてあらゆる悪口を言う」は、「あなたがたに対してあらゆる悪いことを言う」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「わたしのために」は「わたしのゆえに」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: あなたがたは幸いです
  rationale: 山上の説教に繰り返される祝福の宣言として、神の恵みのもとにある状態を表しつつ、現代日本語で明瞭な「幸いです」とした。
- source_word: ὅταν
  choice: 〜とき
  rationale: 後続する接続法とともに一般的・将来的な場合を示すため、自然な「〜とき」とした。
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: あなたがたを侮辱し
  rationale: 非難や罵りを含む言葉による辱めを、現代の読者に明瞭な「侮辱する」で表した。
- source_word: διώξωσιν
  choice: 迫害し
  rationale: イエスとの関係を理由とする敵対的な扱いを広く指し、形態を限定しない「迫害する」とした。
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: あらゆる悪口を浴びせる
  rationale: 敵意ある発言が本人たちに向けられるという句全体の意味を、自然な日本語で表した。「あらゆる」により πᾶν の包括性も保持した。
- source_word: ψευδόμενοι
  choice: 偽って
  rationale: 悪意ある発言が事実ではないことを明示し、分詞の副詞的機能を自然に表した。
- source_word: ἕνεκεν ἐμοῦ
  choice: わたしのために
  rationale: イエスを理由として、またイエスとの結びつきゆえに苦難を受ける意味を簡潔に表した。
theological_decisions:
- issue: 語られている敵対行為の範囲
  choice: 侮辱、迫害、虚偽の悪口という複数の形の敵対を、そのまま幅広く表す。
  alternative: 迫害を身体的暴力だけに限定する、または中傷だけに限定する。
  rationale: 三つの並列表現は、言葉による辱めからより広い迫害までを含むため、特定の形態に狭めなかった。
- issue: ἕνεκεν ἐμοῦ の意味合い
  choice: 「わたしのために」とし、イエスとの関係が敵対の理由であることを表す。
  alternative: 「わたしのゆえに」「わたしのことで」として、原因の意味をより直接的に示す。
  rationale: 目的・献身と原因の両方を含み得る日本語を選び、原文の簡潔さと神学的含意を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。定着した聖書語である「幸い」「迫害」を用いつつ、語順は日本語として自然になるよう、敵対の理由を文頭に置いた。
