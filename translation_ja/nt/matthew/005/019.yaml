id: MAT.5.19
reference: Matthew 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: ja
  text: ですから、これらの戒めのうち最も小さい戒めの一つでも無効にし[a]、人々にもそうするように教える者は、天の御国で最も小さい者と呼ばれます。しかし、これらを行い、教える者は、天の御国で偉大な者と呼ばれます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「廃する」「破る」。ギリシア語は直訳すると「解く」で、ここでは戒めの効力を弱めたり、拘束力のないものとして扱ったりすることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ですから
  rationale: 直前の律法についての宣言から導かれる帰結を、明瞭で自然な現代日本語で示す。
- source_word: λύσῃ
  choice: 無効にし
  rationale: 字義は「解く」だが、戒めを拘束力のないものとして扱うという文脈上の意味を表す。「破る」だけに限定せず、戒めの効力を弱める含みを保つ。
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: これらの戒めのうち、最も小さいものの一つでも
  rationale: 属格構文が示す、これらの戒めの中で最小とされる部類の一つ、という比較的な意味を保持する。「でも」により μίαν の最小単位を強調する。
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: 人々にもそうするように教える
  rationale: ἀνθρώπους はここでは人間一般を指すため「人々」とする。οὕτως が先行する戒めの無効化を受けることを「そうするように」で明示する。
- source_word: ἐλάχιστος κληθήσεται
  choice: 最も小さい者と呼ばれます
  rationale: 未来受動の「呼ばれる」を直接保ち、御国における比較的評価を訳文以上に解釈しない。
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 天の御国で
  rationale: マタイに特徴的な表現を、日本語聖書として自然で荘重な定型により表す。
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: それを行い、教える
  rationale: ποιέω の広い意味を「行う」で直接表現する。目的語は複数の戒めを指すが、日本語では集合的に「それ」と受けるのが自然である。
- source_word: οὗτος μέγας κληθήσεται
  choice: 偉大な者と呼ばれます
  rationale: οὗτος の指示的強調は、日本語では対照構文と「者」の反復によって十分に示される。μέγας は最上級にせず「偉大」とする。
theological_decisions:
- issue: 御国で「最も小さい／偉大」と呼ばれることの意味
  choice: 御国における比較的評価として、そのまま訳す。
  alternative: 「最も小さい」を御国からの排除と解する、または「偉大」を天上の報酬の技術的階級と解する。
  rationale: 本文は「天の御国で」と述べるだけで、救い、排除、報酬制度について明示していないため、その神学的緊張を解消しない。
- issue: τοὺς ἀνθρώπους の指示範囲
  choice: 性別を限定しない「人々」とする。
  alternative: 男性に限定して受け取られ得る「男たち」とする。
  rationale: この複数形は文脈上、人間一般を指す。現代日本語でその範囲を正確かつ自然に伝える。
- issue: λύσῃ が表す行為
  choice: 戒めを「無効にする」と訳し、拘束力を弱める意味を示す。
  alternative: 個々の戒めを実際に「破る」ことだけに限定する。
  rationale: 「解く」という語の法的・規範的文脈での含みを保ち、単なる違反か廃棄かという解釈を過度に狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な教えにふさわしい丁寧体と格調を保った。「天の御国」はマタイの用語として一貫性のある表現。原文にない男性限定を避け、「人々」とした。
