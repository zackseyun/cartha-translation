  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: ja
  text: また、あなたを相手取って訴訟を起こし[a]、内側の衣服[b]を取ろうとする者には、上着も渡しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたと法廷で争い」。ギリシア語は字義的には、法的な場で裁かれることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「内側の衣服」は体に近く着る衣服、「上着」はその上にまとう外側の衣服を指す。
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: …しようとする者には
  rationale: 冠詞付き現在分詞を一般的な人物を指す表現として訳し、θέλωの意志・願望を自然な現代日本語で示した。
- source_word: σοι κριθῆναι
  choice: あなたを訴え[a]
  rationale: 法的な場で争うことを表す文脈上の意味を簡潔に示した。原語の字義的な『裁かれる／裁判になる』という幅は脚注に残した。
- source_word: χιτῶνά
  choice: 下着[b]
  rationale: 上にまとうἱμάτιονとの対比を保ち、体に近く着る内側の衣服を明確にした。現代の下着と完全に同一視されないよう文化的説明を付した。
- source_word: λαβεῖν
  choice: 取ろうとする
  rationale: 訴訟によって所有を得ようとする動きを、過度に強い『奪う』ではなく基本義に沿って表した。
- source_word: ἄφες αὐτῷ
  choice: その者には…譲りなさい
  rationale: 命令の直接性を保ちつつ、相手に所有を明け渡すというἀφίημιの文脈上の意味を自然に表した。
- source_word: ἱμάτιον
  choice: 上着
  rationale: 内側のχιτώνに対する外側の衣服であることが、日本語で直ちに分かる語を選んだ。
- source_word: καὶ ... καὶ
  choice: また…も
  rationale: 最初のκαίによる前文との連結と、後のκαίによる追加の強調をそれぞれ保持した。
theological_decisions:
- issue: 法的争いにおけるイエスの命令の倫理的な強さ
  choice: 報復せず、要求を超えて譲るよう求める直接的な命令として訳した。
  alternative: 権利に固執しないという一般原則へ抽象化して訳す。
  rationale: 命令形ἄφεςと具体的な二つの衣服の描写は、意図的に鋭い教えを形作っているため、比喩に限定したり弱めたりせず、その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。訴訟場面を自然に伝えながら、衣服の歴史的区別は脚注で補った。
