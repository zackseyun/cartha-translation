  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: ja
  text: あなたに求める者には与えなさい。また、あなたから借りようとする者に背を向けてはならない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたから借りようとする者を拒んではならない。」
    reason: 「背を向ける」はこの文脈で「拒む」という意味にも取れるため、その語用上の意味を別訳として示す。
lexical_decisions:
- source_word: τῷ αἰτοῦντί σε
  choice: あなたに求める者
  rationale: 定冠詞を伴う現在分詞を一般的な人物を指す表現として訳した。「求める」は、何を求めるかを原文同様に限定せず、継続的・一般的な意味合いを保つ。
- source_word: δός
  choice: 与えなさい
  rationale: δίδωμιのアオリスト命令形。命令の直接性を保ちつつ、現代日本語の聖書文として自然で品位のある形にした。
- source_word: τὸν θέλοντα
  choice: …しようとする者
  rationale: 定冠詞を伴う現在分詞で、一般的な人物を指す。後続の不定詞と合わせ、「借りることを望む」を自然な日本語で「借りようとする」とした。
- source_word: ἀπὸ σοῦ
  choice: あなたから
  rationale: 借り受けるものの出所を示す前置詞句を、そのまま明確に表した。
- source_word: δανίσασθαι
  choice: 借りる
  rationale: 文脈上「借りる」の意味。原文は対象を金銭に限定していないため、「金を借りる」とはしなかった。
- source_word: μὴ ἀποστραφῇς
  choice: 背を向けてはならない
  rationale: μήを伴う禁止表現。「拒んではならない」と意訳せず、ἀποστρέφωの身体的な比喩を自然な日本語で保持した。
theological_decisions:
- issue: イエスの倫理的命令の範囲と強さ
  choice: 対象を限定せず、二つの直接的な命令として訳す。
  alternative: 「ふさわしい者にだけ与える」などの条件を補う、または後半を「断ってはならない」と解釈的に訳す。
  rationale: 原文は山上の説教の中で一般的な形の命令を述べており、本文にない条件や例外を翻訳に持ち込むべきではない。一方、後半は拒絶を含意し得るが、本文の比喩的表現を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の力を保ちながら簡潔で格調ある文体とした。「者」は一般的な人物を指す聖書本文として自然で、二つの分詞表現の対応も保つ。
