id: MAT.5.25
reference: Matthew 5:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: ja
  text: あなたを訴える相手に対しては、その人と一緒に道を進んでいる間に、すぐに好意的な態度を取りなさい[a]。そうでないと、相手があなたを裁判官に引き渡し、裁判官が役人に引き渡して、あなたは牢に投げ込まれることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 法的な文脈に即して、「あなたを訴える相手と、すぐに和解しなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: 好意的な態度を取りなさい
  rationale: 「好意を持つ／好意的である」という語の中心的意味と、現在分詞を伴う命令の継続的な含みを自然な現代日本語で表す。法的文脈で「和解しなさい」と解する余地は脚注に残す。
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: あなたを訴える相手／相手
  rationale: 裁判官、役人、牢という司法的連鎖から、単なる敵対者ではなく訴訟上の相手であることを明示する。二度目は自然さのため「相手」とする。
- source_word: ταχὺ
  choice: すぐに
  rationale: 命令の切迫性を明快で自然な日本語にする。
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: その人と一緒に道を進んでいる間に
  rationale: 道を共にしているという具体的な像を保ち、「裁判所へ行く途中」とまでは補わない。日本語では時間句を独立させ、警告までの猶予を強調する。
- source_word: μήποτέ
  choice: そうでないと
  rationale: 警告と望ましくない帰結を、古風にならない明瞭な日本語で示す。
- source_word: παραδῷ
  choice: 引き渡し
  rationale: 司法上の拘束を次の権限者へ移す意味を自然に表す。
- source_word: κριτῇ / κριτὴς
  choice: 裁判官
  rationale: 法的文脈における標準的で明確な訳語。
- source_word: ὑπηρέτῃ
  choice: 役人
  rationale: 裁判官の命令を執行する配下の公的な者を指す。特定の制度に限定される「廷吏」などを避ける。
- source_word: εἰς φυλακὴν
  choice: 牢に
  rationale: 拘禁場所を簡潔かつ厳粛に表す。
- source_word: βληθήσῃ
  choice: 投げ込まれることになる
  rationale: βάλλωの強い像を保ちつつ、警告される帰結として自然な日本語にする。
theological_decisions:
- issue: 冒頭の命令を、相手への好意的態度として訳すか、法的な和解成立として訳すか
  choice: 本文では「好意的な態度を取りなさい」とし、εὐνοέωの語義を保つ。
  alternative: 「あなたを訴える相手と、すぐに和解しなさい」
  rationale: 法的文脈では和解を促す含みが十分に考えられるが、原文そのものは相手に対する好意的な姿勢を命じる表現であり、和解成立までを明示してはいない。解釈上の含みは脚注で示し、曖昧さを残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、司法的な警告の厳粛さを保った。「訴える相手」は法的意味を明確にし、「道」は比喩化せず原文の具体像を残した。
