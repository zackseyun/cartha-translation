source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: ja
  text: だから、あなたが祭壇に供え物をささげていて、そこで、あなたの兄弟があなたに対して何か不満を持っていることを思い出したなら、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」は、ここでは姉妹を含めて代表的に用いられている可能性がある。ギリシア語は男性単数の「兄弟」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: だから、……なら
  rationale: οὖνの前文からの帰結を「だから」で示し、ἐὰνの条件を文末の「なら」で自然に表した。
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: あなたが……供え物をささげようとしていて
  rationale: προσφέρωの祭儀的文脈を「ささげる」で表し、δῶρονはこの場面で祭壇に供える物なので「供え物」とした。現在接続法が描く場面の進行性は「ささげようとしていて」で示した。
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: 祭壇に
  rationale: ἐπί＋対格は供え物を祭壇へ差し出す方向・到達点を示し得るため、日本語では自然な「祭壇に」とした。
- source_word: κἀκεῖ μνησθῇς
  choice: そこで……思い出した
  rationale: κἀκεῖの場所の強調を「そこで」で保ち、μνησθῇςは過度に受動性を持ち込まず「思い出した」とした。
- source_word: ὁ ἀδελφός σου
  choice: 自分の兄弟
  rationale: 男性単数のἀδελφόςを明示的に「兄弟」と訳した。日本語の「兄弟」は実兄弟にも信仰共同体の仲間にも用い得るため、原文の関係性を限定しすぎない。
- source_word: ἔχει τι κατὰ σοῦ
  choice: あなたに対して何か不満を抱いている
  rationale: κατά＋属格を伴うἔχεινの慣用的な対立・訴えの意味を自然な日本語で表し、τιの不特定性を「何か」で保持した。
theological_decisions:
- issue: ἀδελφόςの性と指示範囲
  choice: 兄弟
  alternative: 兄弟姉妹／仲間の信者
  rationale: 原文は男性単数なので本文では「兄弟」とした。ただし文脈上、代表的に用いられ、姉妹を含み得る可能性は脚注で示した。
- issue: ἔχει τι κατὰ σοῦが示す責任の所在
  choice: 何か不満を抱いている
  alternative: あなたに非がある／あなたを恨んでいる
  rationale: 原文は相手が何かを対抗事由として持つことを述べるが、その訴えが正当か、話者側に実際の非があるかまでは明示しない。その曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、山上の説教にふさわしい端正さを保った。次節へ続く条件節なので、末尾は読点とし、脚注記号は節末に置いた。
