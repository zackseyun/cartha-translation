revisions:
- from: だれかがあなたがたに何か言ったら、こう言いなさい。『主がこの二頭を必要としておられます。』そうすれば、その人はすぐに二頭を送り出してくれます。
  to: だれかがあなたがたに何か言ったら、『主がこの二頭を必要としておられます』と言いなさい。すると、すぐに二頭を送り出します。
  rationale: 主語を補わない日本語表現にして、ἀποστελεῖの解釈上の余地を本文で固定しないようにした。「そうすれば」を「すると」に、「送り出してくれます」を「送り出します」に改め、原文にない因果の強調および受益の含みを除いた。脚注は「送り出します」に付す。
