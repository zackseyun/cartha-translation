id: MAT.21.3
reference: Matthew 21:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: ja
  text: だれかがあなたがたに何か言ったら、『主がこの二頭を必要としておられます』と言いなさい。すると、すぐに二頭を送り出します。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: だれかがあなたがたに何か言ったら
  rationale: 不定条件と、弟子たちを指す複数の「あなたがた」を明示する。「尋ねる」と限定せず、λέγωとτιの広い意味を保った。
- source_word: ἐρεῖτε
  choice: こう言いなさい
  rationale: 未来形の指示的・命令的な力を、自然な現代日本語の命令表現で示した。
- source_word: Ὁ κύριος
  choice: 主
  rationale: 文脈上イエスがご自身を指して権威を示す表現として「主」を採用し、「持ち主」と断定しない。
- source_word: αὐτῶν χρείαν ἔχει
  choice: この二頭を必要としておられます
  rationale: αὐτῶνは直前の雌ろばと子ろばを指すため、日本語では指示対象と複数性を明確にした。敬語は「主」を受けた自然な日本語表現である。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 即時性を明快で現代的な語で表した。
- source_word: ἀποστελεῖ αὐτούς
  choice: その人はすぐに二頭を送り出してくれます
  rationale: 動詞の主語は最も自然には弟子たちに声をかけた人物と解されるため「その人」とした。「返す」という原文にない意味は加えず、使役的に解し得る「送り出す」とした。
theological_decisions:
- issue: Ὁ κύριοςの指示対象と称号性
  choice: 主
  alternative: 持ち主／主人
  rationale: 実際的な「主人」の意味の可能性を不必要に排除せず、同時にマタイの物語におけるイエスの権威と称号としての響きを保持する。
- issue: ἀποστελεῖの主語
  choice: 弟子たちに声をかけた人物（その人）
  alternative: 主（イエス）が後で二頭を返す
  rationale: 直前の不定代名詞τιςを主語として補うのが統語上最も自然である。原文自体は主語を明示しないため、別解の余地はあるが、本文は自然な読みを採った。
translation_notes:
  register: 明快な現代標準日本語としつつ、イエスの指示にふさわしい品位を保った。「二頭」は直前の文脈にある雌ろばと子ろばを受け、単独節でも複数代名詞の指示を明瞭にするため補った。
