translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く文であるため、λέγων αὐτοῖςのαὐτοῖςを『二人に』と明示した。動物について不自然な性別表現を避けつつ、二頭がいることは『それら』で保持した。
