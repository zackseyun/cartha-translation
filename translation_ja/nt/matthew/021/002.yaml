  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: ja
  text: 二人に言った。「向かいの村へ行きなさい。するとすぐに、ろばがつながれていて、子ろば[a]が一緒にいるのを見つけます。二頭をほどいて、わたしのところへ連れて来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子ろば」は、文脈上、若いろばを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: 二人に言った
  rationale: 前節で遣わされた二人の弟子を受ける。日本語では分詞構文を独立した叙述にし、発話の導入を自然にした。
- source_word: Πορεύεσθε
  choice: 行きなさい
  rationale: 物語中の命令として自然で明快であり、移動の意味を過不足なく表す。
- source_word: κώμην
  choice: 村
  rationale: 都市ではない集落を指すκώμηの標準的で分かりやすい訳語。
- source_word: κατέναντι ὑμῶν
  choice: 向こうの
  rationale: 話し手と聞き手から見て前方・反対側に位置するという空間関係を、自然な現代日本語で表す。厳密な『真向かい』に限定しない。
- source_word: εὐθέως
  choice: すぐに
  rationale: 即時性を保ちつつ、現代日本語の物語文として自然。
- source_word: ὄνον δεδεμένην
  choice: ろばがつながれていて
  rationale: ὄνοςは文法上女性単数で、δεδεμένηνはつながれた状態を表す完了受動分詞。日本語では自然な状態描写とした。
- source_word: πῶλον μετ’ αὐτῆς
  choice: そのそばに子ろばがいる
  rationale: πῶλοςは若い動物で、ここでは文脈上ろばの子。μετάは共在を表し、近接を自然に示す『そのそばに』とした。
- source_word: λύσαντες ἀγάγετέ μοι
  choice: それらをほどいて、わたしのところへ連れて来なさい
  rationale: 先行するアオリスト分詞と命令形の順序を、日本語では『ほどいて、…連れて来なさい』と自然に再現した。複数の対象は二頭を指す。
