revisions:
- from: 彼らはイエスに言った。「その主人は、あの悪者どもを容赦なく滅ぼし[a]、ぶどう園をほかの農夫たちに貸し出すでしょう[b]。その農夫たちは、それぞれの収穫の時に、主人に実りを納めるでしょう[c]。」
  to: 彼らはイエスに言った。「その主人は、あの悪人どもを無残に滅ぼし[a]、ぶどう園をほかの農夫たちに貸し出すでしょう[b]。その農夫たちは、定められた時に主人に実りを納めるでしょう[c]。」
  rationale: καιροίを「定められた時」として、季節・時機および納付期限の含みを保ち、「収穫の時」への過度な限定を避けた。「無残に滅ぼす」は日本語として自然で、κακοὺς κακῶςの厳しい反復を本文で伝えつつ、脚注で形式上の語呂合わせを補っている。
