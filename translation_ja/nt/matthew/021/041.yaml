id: MAT.21.41
reference: Matthew 21:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: ja
  text: 彼らはイエスに言った。「その主人は、あの悪人どもを無残に滅ぼし[a]、ぶどう園をほかの農夫たちに貸し出すでしょう[b]。その農夫たちは、定められた時に主人に実りを納めるでしょう[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「悪い者たちを悪く滅ぼす」。ギリシア語は同じ語根の形容詞と副詞を重ね、裁きの厳しさを強調している。
    reason: 原文の語呂合わせと強調を示すため。
  - marker: b
    text: または「ぶどう園をほかの小作人たちに貸すでしょう」。
    reason: 農夫たちが賃借して耕す者であるという文脈上の意味を示すため。
  - marker: c
    text: または「しかるべき時に、主人に収穫を納めるでしょう」。
    reason: 「実り」と「収穫」、および果実を納めるべき定められた時期という訳語の幅を示すため。
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: 彼らはイエスに言った
  rationale: 現在形は物語を生き生きと語る歴史的現在と判断し、自然な現代日本語の過去形にした。代名詞の指示対象は文脈上イエスであるため明示した。
- source_word: Κακοὺς κακῶς
  choice: あの悪者どもを容赦なく
  rationale: 同語根の形容詞と副詞による強い語呂合わせを、日本語では非難を表す「あの悪者ども」と裁きの徹底性を表す「容赦なく」で再現した。
- source_word: ἀπολέσει
  choice: 滅ぼし
  rationale: 決定的な裁きを表しつつ、その具体的な手段を本文以上に限定しない。
- source_word: τὸν ἀμπελῶνα
  choice: ぶどう園
  rationale: 農業的情景と、たとえにおけるぶどう園のイメージを保つ標準的な訳語。
- source_word: ἐκδώσεται
  choice: 貸し出す
  rationale: 土地を耕作者に賃貸する文脈上の意味を、現代日本語で明瞭に表した。
- source_word: ἄλλοις γεωργοῖς
  choice: ほかの農夫たち
  rationale: γεωργοίの基本的な農耕者という意味を保ち、借地人であることは「貸し出す」で示した。
- source_word: οἵτινες
  choice: その農夫たちは
  rationale: 先行詞を受ける関係節を日本語として自然な独立文にし、期待に応える種類の農夫という含みを文脈に委ねた。
- source_word: ἀποδώσουσιν αὐτῷ
  choice: 主人に実りを納める
  rationale: ἀποδίδωμιが含む、当然渡すべきものを返す・支払うという意味を「納める」で表した。αὐτῷの指示対象はぶどう園の主人であるため明示した。
- source_word: τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν
  choice: それぞれの収穫の時に、主人に実りを
  rationale: καρποίの農業的・比喩的な響きを「実り」で保ち、複数のκαιροίとαὐτῶνが示す、それぞれに定められた時期という意味を自然に表した。
theological_decisions:
- issue: 小作人たちに下される裁きの厳しさと性質
  choice: あの悪者どもを容赦なく滅ぼし
  alternative: あの悪者どもをひどい目に遭わせて滅ぼし
  rationale: 原文は同語根の反復で裁きを強調しているが、刑罰の具体的な方法を教理的に規定してはいない。「容赦なく」はその強さを保ちながら、本文にない詳細を加えない。
translation_notes:
  register: 明瞭で現代的ながら、たとえ話の裁きの宣告にふさわしい重みを保った。「悪者ども」は強い非難を自然に表し、「容赦なく」は原文の同語根反復の強調を補う。長いギリシア語の一文は、日本語の可読性のため引用内で二文に分けた。
