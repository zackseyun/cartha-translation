  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: ja
  text: そして彼らは、その息子をつかまえ、ぶどう園の外へ放り出し[a]、殺した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ぶどう園の外へ追い出し」。
    reason: ἐκβάλλωはこの文脈で「放り出す」とも「追い出す」とも訳し得るため。
lexical_decisions:
- source_word: λαβόντες（λαμβάνω）
  choice: 捕らえ
  rationale: 後続する動作に先立って相手を確保したことを自然な日本語で表す。単なる「取る」ではこの文脈で不自然だが、「取り押さえる」ほど強い力の行使を明示しない。
- source_word: αὐτόν
  choice: その息子を
  rationale: 代名詞を文脈上の指示対象である息子として明示し、現代日本語で分かりやすくした。
- source_word: ἐξέβαλον（ἐκβάλλω）
  choice: 放り出し
  rationale: ぶどう園の内側から外側へ強制的に出した動作を簡潔かつ自然に表す。「追い出し」も可能だが、本文では動作の荒々しさをよりよく伝える語を選んだ。
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ぶどう園の外へ
  rationale: 移動の到達方向を「外へ」で表し、ἐξέβαλονとの結びつきを自然にした。
- source_word: ἀμπελῶνος（ἀμπελών）
  choice: ぶどう園
  rationale: 当該語の標準的で明確な訳語。
- source_word: ἀπέκτειναν（ἀποκτείνω）
  choice: 殺した
  rationale: 原語の意味を直接的に表す。「殺害した」や「死刑にした」よりも自然で、原文にない法的・道徳的含意を加えない。
theological_decisions:
- issue: 息子をぶどう園の外へ出すことと殺すことの順序
  choice: ぶどう園の外へ放り出した後で殺したという順序をそのまま訳す。
  alternative: マルコおよびルカの並行記事に合わせ、殺した後で外へ出したと読めるように訳す。
  rationale: マタイ本文はἐξέβαλον（放り出した）の後にἀπέκτειναν（殺した）を置いているため、その明示的な叙述順序を保ち、並行記事との調和を訳文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、たとえ話にふさわしい簡潔で重みのある叙述にした。原文の動作順序を保ち、接続を過度に補わなかった。
