id: MAT.21.12
reference: Matthew 21:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: ja
  text: イエスは神殿の境内[a]に入り、境内で売り買いしていた人々を皆追い出し、両替人の台と、鳩を売る者たちの椅子をひっくり返した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」とも訳せる。ギリシア語は、聖所そのものに限らず、庭や建物を含む神殿域全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: 神殿の境内
  rationale: ναός（聖所）とは異なり、神殿の建物群と庭を含む区域全体を指す語である。この商取引が行われていた場所を自然かつ明確に示すため「神殿の境内」とした。
- source_word: ἐξέβαλεν
  choice: 追い出し
  rationale: 強制的に外へ出すという決然とした行為を、現代日本語で自然に表す。
- source_word: πάντας
  choice: 皆
  rationale: 売り買いしていた人々に対する行為の範囲を明示する原文の語を保持した。
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: 売り買いしていた人々
  rationale: 売る者と買う者の双方を含む現在分詞の表現を、簡潔で自然な日本語にした。
- source_word: τράπεζας
  choice: 台
  rationale: 両替に用いる卓を指す文脈であり、日本語では「両替人の台」が明瞭で自然である。
- source_word: κολλυβιστῶν
  choice: 両替人
  rationale: 貨幣を交換する者を指すため、神殿での状況にも合う定着した訳語を用いた。
- source_word: κατέστρεψεν
  choice: ひっくり返した
  rationale: この文脈では家具を転覆させる動作を表す。破壊したとまでは限定せず、動作を鮮明に伝える。
- source_word: καθέδρας
  choice: 腰掛け
  rationale: 座るための椅子や席を指す語を、具体的かつ自然に表現した。
- source_word: περιστεράς
  choice: 鳩
  rationale: 鳩または家鳩を指し得る語であり、犠牲として売られていた文脈に合う一般的な訳語を採用した。
theological_decisions:
- issue: イエスが入ったἱερόνの範囲
  choice: 聖所そのものではなく、庭を含む神殿の境内を指すものとして訳す。
  alternative: 範囲を特定せず、単に「神殿」と訳す。
  rationale: ἱερόνは通常、聖所を表すναόςと区別され、神殿域全体を指す。歴史的・空間的な区別を明確にしつつ、それ以上の神学的解釈は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の一続きの動作を自然な一文で表し、「皆」によりπάνταςの範囲を保持した。
