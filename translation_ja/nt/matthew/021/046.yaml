id: MAT.21.46
reference: Matthew 21:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: ja
  text: 彼らはイエスを捕らえようとしていたが、群衆を恐れた。群衆がイエスを預言者だと考えていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: 捕らえようとしていたが
  rationale: 現在分詞の継続的な意図を表し、主動詞との文脈上の逆接関係を自然な日本語の「〜していたが」で示した。
- source_word: κρατῆσαι
  choice: 捕らえよう
  rationale: 敵対的な文脈で、人を強制的に拘束する意味を表す。「逮捕しよう」より原語の幅を保ちつつ、単なる接触ではないことが明確である。
- source_word: ἐφοβήθησαν
  choice: 恐れた
  rationale: アオリストを簡潔な過去形で訳し、群衆に対する恐れを直接表した。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語では集合的な「群衆」が自然であり、集まった人々を明瞭に指す。
- source_word: ἐπεὶ εἰς
  choice: からである
  rationale: 群衆を恐れた理由を導く因果関係を、明快で品位ある現代日本語で表した。
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: イエスを預言者だと考えていた
  rationale: 「人を〜として見なす」という慣用的構文を自然に訳し、群衆による評価であることを保持した。
- source_word: προφήτην
  choice: 預言者
  rationale: 日本語では不定冠詞を明示する必要がなく、人物の類型・身分として自然に表せる。
theological_decisions:
- issue: 群衆によるイエスの評価を、節を越えたキリスト論的主張を持ち込まずにどう表すか
  choice: 群衆がイエスを預言者だと考えていた
  alternative: 群衆がイエスを預言者と見なしていた
  rationale: この節は群衆の認識を報告しており、イエスの全き身分を定義してはいない。「考えていた」とすることで物語上の視点を保ち、イエスが預言者にすぎないとも、ここで客観的定義がなされているとも読ませない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「彼ら」と「群衆」の指示関係を明確にするため、後半では主語「群衆」を繰り返し、αὐτόνは文脈上「イエス」と明示した。簡潔さと朗読時の理解しやすさを優先しつつ、叙述の緊張を保持した。
