  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: ja
  text: 群衆の大半は、自分たちの上着を道に敷いた[a]。また、ほかの人々は木々から枝を切り、道に敷いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「群衆のうち、より多くの人々は」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: 群衆の大半は
  rationale: πλεῖστος は集合名詞 ὄχλος とともに「大半、より多くの部分」を表す。「群衆の大半」は自然な現代日本語であり、δέ は文脈上の展開として無理に訳語を加えない。
- source_word: ἔστρωσαν
  choice: 敷いた
  rationale: 衣を道路の上に広げて置く動作を、日本語では簡潔かつ自然に「敷いた」と表せる。
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: 自分たちの上着
  rationale: 再帰代名詞 ἑαυτῶν の意味を「自分たちの」で明示する。ἱμάτια はここでは外衣を指すため、一般読者に分かりやすい「上着」とした。
- source_word: ἐν τῇ ὁδῷ
  choice: 道に
  rationale: 物を道路上に敷くという場面に即し、日本語として自然な「道に」とした。
- source_word: ἄλλοι δὲ
  choice: また、ほかの人々は
  rationale: 別の人々による並行した行為を加える δέ の流れを、「また」で自然に示す。
- source_word: ἔκοπτον κλάδους ἀπὸ τῶν δένδρων
  choice: 木々から枝を切り
  rationale: κλάδους と ἀπὸ τῶν δένδρων を直接的に訳し、未完了過去の進行的な情景は後続の「敷いていた」と合わせて表現する。
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: 道に敷いていた
  rationale: 未完了過去 ἐστρώννυον の継続・進行的な側面を「敷いていた」で保持し、反復される場所句も訳出する。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。衣を道路上に置く動作には自然な「敷く」を用い、二つの群の行為と未完了過去の進行感を読み取りやすく示した。
