id: MAT.21.23
reference: Matthew 21:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: ja
  text: イエスが神殿の境内[a]に入って教えておられるとき、祭司長たちと民の長老たちが近寄って言った。「あなたは何の権威によって、こうしたことをしているのか。だれがあなたにその権威を与えたのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は、神殿の内陣だけでなく、庭などを含む神殿の区域全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: イエスが……に入り
  rationale: 属格独立構文の時間的な関係を自然な日本語で表した。直前の文脈から主語を「イエス」と明示し、「入る」によって神殿域への到着を表す。
- source_word: ἱερὸν
  choice: 神殿の境内
  rationale: ἱερόνは内陣そのものではなく神殿複合域を指すため、「神殿」だけより範囲が明確な「神殿の境内」とした。
- source_word: προσῆλθον αὐτῷ
  choice: 近寄って来て
  rationale: 相手のもとへ接近する動作を、物語として自然な現代日本語で表す。
- source_word: διδάσκοντι
  choice: 教えておられると
  rationale: 現在分詞が、指導者たちが近寄った時に継続していた行為を示すため、同時性を保った。敬語は日本語の聖書文体として自然な最低限の敬意を示す。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数の大祭司職保持者ではなく、指導的な祭司層を指す定着した訳語。
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: 民の長老たち
  rationale: ユダヤの民の公認された指導者たちを、簡潔かつ原文に近く表す。
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: 行為の正当な根拠・認可を問う表現として、ἐνとἐξουσίαの意味を自然に伝える。
- source_word: ταῦτα ποιεῖς
  choice: こうしたことをしているのか
  rationale: 現在進行中または当面の一連の行為を指す現在形を自然に表し、複数の行為を含み得る曖昧さを保持する。
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: だれがあなたにその権威を授けたのか
  rationale: ἔδωκενが示す権威付与の行為を、「与えた」より公的認可の含意が伝わる「授けた」で表す。
theological_decisions:
- issue: 指導者たちの問いにおけるἐξουσίαの意味
  choice: 権威
  alternative: 権利／力
  rationale: ここでは単なる能力や実力ではなく、神殿で行動し教える正当な資格と認可が問題にされている。「権威」は制度的含意と神学的含意の双方を保ちつつ、その由来を先取りして決めない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。会話の問い詰める調子は保つが、過度に粗い表現にはしない。「神殿の境内」に脚注標識[a]を付し、ἱερόνと内陣を指す語との区別を説明した。
