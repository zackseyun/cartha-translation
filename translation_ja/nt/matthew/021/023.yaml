revisions:
- from: イエスが神殿の境内[a]に入り、教えておられると、祭司長たちと民の長老たちが近寄って来て言った。「何の権威によって、こうしたことをしているのか。だれがあなたにその権威を授けたのか。」
  to: イエスが神殿の境内[a]に入って教えておられるとき、祭司長たちと民の長老たちが近寄って言った。「あなたは何の権威によって、こうしたことをしているのか。だれがあなたにその権威を与えたのか。」
  rationale: 原文の時間的・同時的関係をより滑らかな日本語で表し、接近の動詞を視点上中立な形に整えた。「与えた」は、権威の由来を問う原文の表現を保ちつつ、付与の形態を過度に限定しない。脚注標識と脚注内容は原文のἱερόνの範囲を適切に説明しており、変更を要しない。
  reviewer_model: gpt-5.6-terra
