source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: ja
  text: そしてイエスは彼らに言われた。「こう書かれている。『わたしの家は祈りの家と呼ばれる。』ところが、あなたがたはそれを強盗[a]の巣にしている。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「強盗」は「盗賊」または「山賊」とも訳せる。ギリシア語は、暴力を用いる略奪者を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: イエスはここで、イザヤ書56章7節とエレミヤ書7章11節の言葉を組み合わせている。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、日本語で「言われる」とすると時制や意味が不自然に受け取られやすいため、自然な物語体の過去形とした。主語は文脈上のイエスであることを明示した。
- source_word: Γέγραπται
  choice: こう書かれている
  rationale: 完了受動形が示す、書かれた言葉が今も有効であるという含みを、現代日本語の定型的な聖書引用表現で保った。
- source_word: οἶκός μου
  choice: わたしの家
  rationale: 「神殿」と限定せず、イザヤ書からの引用にある「家」という比喩と呼称をそのまま保った。
- source_word: οἶκος προσευχῆς
  choice: 祈りの家
  rationale: 属格構文を簡潔かつ自然に訳し、イザヤ書56章7節との語句上のつながりを保った。
- source_word: κληθήσεται
  choice: 呼ばれる
  rationale: 未来受動形を自然な日本語で表した。引用文では日本語の非過去形が未来の意味を十分に担う。
- source_word: ποιεῖτε
  choice: にしている
  rationale: 現在形の継続的な非難を表し、彼らが神の家をそのような場所にしているという能動的責任を保った。
- source_word: σπήλαιον
  choice: 巣窟
  rationale: 字義的には「洞穴」だが、ここでは強盗の潜伏場所を指すため、「巣窟」が自然であり、エレミヤ書7章11節の比喩的な力も伝える。
- source_word: λῃστῶν
  choice: 強盗ども
  rationale: 暴力を伴う略奪者を指し得る語なので「強盗」とした。「ども」は複数と厳しい告発の調子を簡潔に表すが、単なる侮蔑語にならないよう引用全体の荘重さの中で用いた。
theological_decisions:
- issue: 旧約聖書の引用と暗示
  choice: 「わたしの家は祈りの家と呼ばれる」と「強盗どもの巣窟」という表現を保ち、イザヤ書56章7節とエレミヤ書7章11節との結びつきを明瞭にした。
  alternative: より自由な現代語に言い換え、旧約聖書との語句上のつながりを弱める。
  rationale: イエスの告発は二つの預言書の言葉を組み合わせており、その緊張と権威を読者が追跡できるようにする必要がある。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で荘重な聖書物語体とした。引用の定型表現は保ちつつ、歴史的現在は日本語として自然な過去形で表した。脚注記号[a]と[b]は、それぞれ引用・暗示全体と語義上の補足に関わるため、節末に配置した。
