revisions:
- from: 道端に一本のいちじくの木があるのを見て、イエスはそこへ行かれた。しかし、葉のほかには何も見つからなかった。そこで、その木に言われた。「今後いつまでも、おまえから実が生じることがないように。」すると、いちじくの木はたちまち枯れた。
  to: 道端に一本のいちじくの木があるのを見て、イエスはその木に近づかれた。しかし、葉のほかには何も見つからなかった。そこで、その木に言われた。「今後、決して、おまえから実がなることがないように。」すると、いちじくの木はたちまち枯れた。
  rationale: 木への接近を明示し、樹木に実がつくことを表す自然な日本語の「実がなる」を用いた。接続法による厳粛な宣告は「…ことがないように」により保持し、象徴的・教義的解釈は加えていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:22Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として場面、葉しかなかったこと、いちじくの木への宣告、即時に枯れたことを正確に伝えている。ただし「そこへ行かれた」は木そのものへ近づいたというἐπ’ αὐτήνの対象をやや曖昧にし、「実が生じる」は樹木の実については不自然である。
  naturalness: 「道端に一本のいちじくの木があるのを見て」は自然だが、「その木に近づかれた」とすれば指示対象が明確になる。「今後、決して、おまえから実がなることがないように」は、宣告の厳粛さを保ちながら現代標準語としてより自然である。
  terminology: 「いちじくの木」「実」「たちまち枯れた」は適切である。「おまえ」は木への直接の呼びかけとして可能であり、ギリシア語の二人称を保つ。
  issues:
  - severity: medium
    issue: 「そこへ行かれた」
    rationale: ἦλθεν ἐπ’ αὐτήνは、場所一般ではなく、見たその木へ近づいたことを示す。「その木に近づかれた」のほうが対象と接近の動きを明確に伝える。
  - severity: medium
    issue: 「おまえから実が生じる」
    rationale: γένηταιの『生じる／起こる』という語感を保とうとした訳だが、日本語では樹木については通常『実がなる』と言う。意味を変えず、自然な慣用表現に改めるのがよい。
  - severity: low
    issue: 「今後いつまでも」
    rationale: μηκέτιとεἰς τὸν αἰῶναの永続的否定は伝わるが、「今後、決して」とするほうが日本語として簡潔で、二要素の強い否定を自然に表せる。
  revised_text: 道端に一本のいちじくの木があるのを見て、イエスはその木に近づかれた。しかし、葉のほかには何も見つからなかった。そこで、その木に言われた。「今後、決して、おまえから実がなることがないように。」すると、いちじくの木はたちまち枯れた。
