id: MAT.21.19
reference: Matthew 21:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: ja
  text: 道端に一本のいちじくの木があるのを見て、イエスはその木に近づかれた。しかし、葉のほかには何も見つからなかった。そこで、その木に言われた。「今後、決して、おまえから実がなることがないように。」すると、いちじくの木はたちまち枯れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: 一本のいちじくの木
  rationale: μίανを日本語で自然に明示し、特定されていない一本の木が場面に導入されることを表した。
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: 道端に
  rationale: 静止している木の位置を表す日本語として自然であり、「道の上に」という誤解を避ける。
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: そこへ行かれた
  rationale: 木へ近づく動きを自然に表した。主語は文脈上イエスなので明示した。
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: 葉のほかには何も見つからなかった
  rationale: 「葉だけ」という限定と、ほかには何もなかったという強調を簡潔で自然な日本語にした。
- source_word: λέγει αὐτῇ
  choice: その木に言われた
  rationale: 歴史的現在を日本語の過去叙述として整え、対象が木であることを明確にした。
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: 今後いつまでも、おまえから実が生じることがないように
  rationale: μηκέτιの「今後はもう」とεἰς τὸν αἰῶναの永続性をともに保ち、ἐκ σοῦとγένηταιの源・発生の表現も残した。
- source_word: ἐξηράνθη παραχρῆμα
  choice: たちまち枯れた
  rationale: 木が乾いて枯れることと、その即時性を明瞭かつ自然に表した。
theological_decisions:
- issue: いちじくの木への宣告の法的・発話的な力
  choice: 「実が生じることがないように」と、厳粛な禁止・呪詛的宣告として訳す
  alternative: 「もう決して実はならない」と予告的な断定として訳す
  rationale: Μηκέτιと接続法γένηταιの組み合わせが持つ禁止・宣告の響きを保ち、単なる未来予告へ限定しない。象徴的意味は本文に付加しない。
translation_notes:
  register: 明瞭な現代標準語を用い、物語部分は自然に、イエスの言葉は厳粛さが伝わる調子にした。「おまえ」は樹木への直接的で強い呼びかけとして採用した。
