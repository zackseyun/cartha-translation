id: MAT.21.9
reference: Matthew 21:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: ja
  text: そして、イエスの前を行く群衆も、後に従う人々も、こう叫び続けた。「ダビデの子[b]にホサナ[a]！ 主の名によって来られる方は祝福されている！[c] いと高き所にホサナ！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ホサナ」はヘブライ語に由来し、「どうか救ってください」または「今、救ってください」というほどの意味です。ここでは賛美の歓呼として用いられています。
    reason: lexical_alternative
  - marker: b
    text: 「ダビデの子」は、ダビデとの系譜的関係を表す王的・メシア的称号です。
    reason: cultural_note
  - marker: c
    text: この言葉は詩編118編26節を踏まえています。ヘブライ語の詩編本文で、ここに当たる「主」は神の名YHWHです。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: 集まった多数の人々を指す自然な現代日本語であり、複数形の集団性も文脈上十分に表せる。
- source_word: οἱ προάγοντες αὐτὸν καὶ οἱ ἀκολουθοῦντες
  choice: イエスの前を行く群衆も、後について行く人々も
  rationale: 行列の前方と後方にいる二群を明確に示し、「先導した」という役割までは含意しない。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: ἔκραζον λέγοντες
  choice: こう叫び続けた
  rationale: ἔκραζον の未完了過去が示す継続的な叫びを「続けた」で表し、λέγοντες は後続の直接話法を導く「こう」に自然に組み込んだ。
- source_word: Ὡσαννά
  choice: ホサナ
  rationale: この場面では救いを求める語源的意味を保ちながら、典礼的な歓呼として機能しているため、本文では音写し、意味を脚注で示した。
- source_word: τῷ υἱῷ Δαυίδ
  choice: ダビデの子に
  rationale: 与格を「に」で表し、本文にあるダビデ王家に関わる称号を解釈的な「メシア」に置き換えず保持した。
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: 来られる方に祝福があるように
  rationale: 詩編からの歓呼として自然で格調ある日本語にしつつ、ὁ ἐρχόμενος の単数の称号的な響きを「方」で保った。
- source_word: ἐν ὀνόματι κυρίου
  choice: 主の名によって
  rationale: 「名」が権威や委任を含み得る表現を直訳的に保ち、詩編118編への響きも維持した。
- source_word: ἐν τοῖς ὑψίστοις
  choice: いと高き所に
  rationale: 最高の天的領域を示唆する複数中性形を、過度に「天」と特定せず、歓呼の荘重さを保つ慣用的な表現とした。
theological_decisions:
- issue: τῷ υἱῷ Δαυίδ のメシア的・王的称号
  choice: 本文では「ダビデの子」とする。
  alternative: 「メシアに」と意訳する。
  rationale: ギリシア語本文そのもののダビデ的称号を保持し、その含意は脚注で説明することで、歴史的・神学的な厚みを失わない。
- issue: Ὡσαννά の機能と語源的意味
  choice: 本文では「ホサナ」と音写し、脚注で「どうか救ってください／今、救ってください」に由来することを示す。
  alternative: 本文で「どうかお救いください」と訳す。
  rationale: ここでは嘆願の語源を持ちながら賛美の歓呼としても機能しており、一方だけに限定しないため。
- issue: 詩編引用中の κυρίου
  choice: 「主」と訳す。
  alternative: 旧約背景を前面に出して「ヤハウェ」または「主（YHWH）」と本文に置く。
  rationale: 直接のギリシア語本文 κύριος を訳しつつ、詩編のヘブライ語本文における神名YHWHとの関係は脚注で明示する。
- issue: Εὐλογημένος の表現
  choice: 「祝福があるように」と歓呼・祝願として訳す。
  alternative: 「祝福されている」と状態描写として訳す。
  rationale: 形態上は祝福された者との宣言にも読めるが、詩編引用を用いた群衆の歓呼として日本語で自然な祝願形を採用した。断定的な神学的補足は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、群衆の典礼的な歓呼には「来られる方」「いと高き所」など適度に荘重な表現を用いた。「ホサナ」と「ダビデの子」は本文に保持し、語源的意味とメシア的含意を脚注に分けた。
