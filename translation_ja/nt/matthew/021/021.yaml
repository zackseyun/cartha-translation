id: MAT.21.21
reference: Matthew 21:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: ja
  text: そこでイエスは彼らに答えられた。「まことに、あなたがたに言います。もし信仰があり、疑わないなら[a]、いちじくの木に起こったことをするだけでなく、この山に向かって、『持ち上げられ、海に投げ込まれよ』と言えば、そのとおりになります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「心が揺れないなら」または「心が二つに分かれないなら」。
    reason: διακρίνωの受動形は、疑うことに加えて、内面で揺れることや心が分かれることを含意し得るため。
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: そこでイエスは彼らに答えられた
  rationale: 応答を表す分詞と発話動詞を、日本語で自然な一つの導入句にまとめた。δέは強い逆接ではなく、文脈上の展開を示す「そこで」とした。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの厳粛で権威ある宣言の定型句として、強調を保ちつつ現代日本語で明瞭にした。
- source_word: ἐὰν ἔχητε πίστιν
  choice: もし信仰があり
  rationale: πίστιςはここでは人格的な忠実さより、神への信頼に基づく確信を指すため「信仰」とした。
- source_word: μὴ διακριθῆτε
  choice: 疑わないなら
  rationale: この文脈での内面的なためらいや疑念を、最も明瞭な現代語で表した。心が揺れる、二つに分かれるという語感は脚注に残した。
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: いちじくの木に起こったようなことをするだけでなく
  rationale: 省略的なτὸ τῆς συκῆςを直前の出来事への言及として自然に補った。「なされた」と限定せず、出来事を指す曖昧さを保った。
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: この山に向かって…と言えば
  rationale: κἄνの強意的な展開は「だけでなく」と文全体で表し、指示詞を保って「この山」とした。
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: 持ち上げられて、海に投げ込まれよ
  rationale: 二つの受動命令形と物理的なイメージを保持した。「取り除かれよ」より原語の持ち上げる動きを明示する。
- source_word: γενήσεται
  choice: そのとおりになります
  rationale: 命じられた出来事が実現することを指す未来形を、自然で格調のある日本語にした。
theological_decisions:
- issue: 奇跡的行為についての言葉におけるπίστις
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: ここでは性質としての忠実さよりも、神への信頼に基づく確信が文脈に適合する。ただし、信仰の対象や仕組みを本文に補足しなかった。
- issue: 山を動かすという言葉の性質
  choice: 鮮烈な比喩的・預言者的イメージをそのまま保持する
  alternative: 物理的奇跡だけを約束する表現、または困難克服だけを意味する比喩への限定
  rationale: 原文は山が海へ投げ込まれる情景を直接語るため、その力を弱めず、同時に解釈を字義的奇跡または単なる比喩の一方へ限定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの厳粛な宣言には丁寧体を採用した。命令の引用は簡潔な文語的命令形「投げ込まれよ」にして、発言の力強さと尊厳を保った。
