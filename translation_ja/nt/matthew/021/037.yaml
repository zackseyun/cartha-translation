  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: ja
  text: しかし、その後、彼は自分の息子を彼らのところに遣わし、こう言った。「彼らは私の息子を重んじるだろう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らは私の息子に敬意を払うだろう」。このギリシャ語動詞は、この文脈では相手を尊重する、または重んじることを表す。他の文脈では「恥じる」「恥じ入る」の意味を持つこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: その後
  rationale: 時間的な順序を示す「後で／その後」の意味を自然な現代日本語で表し、「最後に」として原文以上に最終性を強調することを避けた。
- source_word: δὲ
  choice: しかし
  rationale: 僕たちを送った後に息子を送るという物語上の転換と対照を、穏やかな逆接として示した。
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: 彼らのところに遣わし
  rationale: 人に向けて送るという πρός の方向性を自然に示した。「遣わす」はやや格調を保ちつつ、現代日本語でも理解できる。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 自分の息子
  rationale: 主語との所有関係が明確になる自然な日本語とし、「愛する」など原文にない修飾は加えなかった。
- source_word: λέγων
  choice: こう言った
  rationale: 分詞を日本語の叙述に合わせて主動詞と並ぶ形に整え、続く直接話法を明確に導入した。
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: 私の息子には敬意を払うだろう
  rationale: 直接目的語を伴うこの文脈では、ἐντρέπω は相手に敬意や配慮を示す意味と判断した。「敬意を払う」は現代日本語として明瞭で、礼拝的な含意を過度に加えない。
theological_decisions:
- issue: たとえの息子をキリスト論的に過剰解釈しないこと
  choice: 自分の息子／私の息子
  alternative: 愛する息子／御子
  rationale: たとえがイエスを指し示すことは文脈から読み取れるが、この節の υἱός 自体には「愛する」という修飾も称号化を要求する標識もない。物語中の通常の親子表現を保ち、キリスト論的含意は文脈から立ち上がるようにした。
- issue: 主人の期待の強さ
  choice: 敬意を払うだろう
  alternative: きっと敬意を払うはずだ
  rationale: 未来形の期待をそのまま示し、「きっと」「はずだ」など確信や推量の度合いを原文以上に限定する表現を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「遣わす」は文脈に合う格調を持たせ、「敬意を払う」によって古風または礼拝的に響きやすい語を避けた。
