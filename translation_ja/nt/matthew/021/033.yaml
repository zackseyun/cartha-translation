id: MAT.21.33
reference: Matthew 21:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: ja
  text: 「もう一つのたとえを聞きなさい。ある地主がぶどう園を造り、その周りに囲いを巡らし[b]、中にぶどう搾り場を掘り、塔を建てた[a]。そして、そのぶどう園を小作人たちに貸し出し[c]、旅に出た。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ぶどう園を造り、囲いを巡らし、ぶどう搾り場を設け、塔を建てる描写は、イザヤ書5章1–2節を思い起こさせる。
    reason: cross_reference
  - marker: b
    text: 「生け垣を巡らし」とも訳せる。ギリシア語は、柵や生け垣など、周囲を囲む仕切りを指し得る。
    reason: lexical_alternative
  - marker: c
    text: 「農夫たちに貸し出し」とも訳せる。ここでいう農夫たちは、ぶどう園を借りて耕作する者たちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: もう一つのたとえを聞きなさい
  rationale: 複数へのアオリスト命令形を明確な呼びかけとして訳した。παραβολήはイエスの教えの文脈で定着した「たとえ」とした。
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: ある地主が
  rationale: ぶどう園を所有して小作人に貸す農業経営の文脈から、οἰκοδεσπότηςの役割を現代日本語で自然に示す「地主」とした。ἄνθρωπος ἦνは物語導入の「ある」に含めた。
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ぶどう園を造り
  rationale: 字義的には「ぶどう園を植えた」だが、日本語では園全体の開設を「ぶどう園を造る」とするのが自然で、具体的な農作業のイメージも保てる。
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: その周りに囲いを巡らし
  rationale: φραγμόςは垣、生け垣、柵などを含み得るため、材質を限定しない「囲い」とし、περιτίθημιの周囲を取り巻く意味を「巡らす」で表した。
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: 中にぶどう搾り場を掘り
  rationale: ληνόςをぶどうを搾る設備として明示し、ὀρύσσωの「掘る」を保持した。
- source_word: ᾠκοδόμησεν πύργον
  choice: 塔を建てた
  rationale: πύργοςは「塔」。見張り塔としての用途は想定され得るが、本文には機能が明記されないため限定しなかった。
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: そのぶどう園を小作人たちに貸し出し
  rationale: 中間態のἐκδίδωμιは賃貸を表し、γεωργοίはここでは園を借りて耕作する者たちである。「小作人」で経済関係を簡潔に示した。
- source_word: ἀπεδήμησεν
  choice: 旅に出た
  rationale: 居所を離れて遠くへ行く意味を自然な日本語で表し、目的地や国外への旅行など本文にない情報は加えなかった。
theological_decisions:
- issue: イザヤ書5章1–2節のぶどう園のイメージ
  choice: 農業設備の具体的描写を本文に保ち、旧約への呼応は脚注で示す
  alternative: 「生け垣」など伝統的な語を用いてイザヤ書との呼応を本文で強く示す
  rationale: イザヤ書との強い呼応は認められるが、本文ではマタイのギリシア語が述べる具体像を訳し、解釈的な相互参照は脚注に置くのが適切である。
- issue: γεωργοίの身分と役割
  choice: 小作人たち
  alternative: 農夫たち／ぶどう栽培者たち
  rationale: 単なる雇用労働者ではなく、ぶどう園を借り受ける耕作者であることを、賃貸を表す動詞との関係から明確にした。
translation_notes:
  register: 明瞭で現代的だが、イエスの命令と物語の格調を保つ文体とした。「聞きなさい」「地主」「小作人」は一般読者に理解しやすく、古風すぎない。「ぶどう搾り場」は設備の用途を明確にし、「囲い」は原語が許す材質上の幅を保つ。
