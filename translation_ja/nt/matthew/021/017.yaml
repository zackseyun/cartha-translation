  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: ja
  text: そして、彼らを後にして、都の外へ出てベタニアへ行かれ、そこで夜を過ごされた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこで泊まられた」。
    reason: ηὐλίσθηは「泊まる」「夜を過ごす」のどちらにも自然に訳せるため。
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: 彼らを後にして
  rationale: アオリスト分詞による主動詞に先立つ動作を自然な日本語で示す。「彼らを捨てて」ほど強い含意を持たせず、文脈上の相手を代名詞のまま保つ。
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: 都を出ると
  rationale: 動詞と前置詞句がともに外へ出る動きを表すため、日本語では不自然な重複を避けて簡潔に訳す。πόλιςは文脈上エルサレムを指すので、固有名を補わず「都」とした。
- source_word: εἰς Βηθανίαν
  choice: ベタニアへ行き
  rationale: 場所への方向を表すεἰςを、現代日本語で自然な移動表現にした。
- source_word: ηὐλίσθη ἐκεῖ
  choice: そこで夜を過ごされた
  rationale: αὐλίζομαιの「泊まる、夜を過ごす」という意味を明確に伝える。受動態の形を機械的に再現せず、中動・受動形の自動詞的用法として訳した。
theological_decisions:
- issue: 省略された主語と敬語表現
  choice: 主語名を補わず、述語を「過ごされた」とする
  alternative: 「イエスは……夜を過ごした」
  rationale: ギリシア語本文では主語が明示されていないため固有名を本文に加えず、前文から続くイエスへの言及は日本語の聖書文体で自然な尊敬表現によって示した。特定の教派的解釈を加えるものではない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスについては穏やかな尊敬表現を採用した。「都」は文脈上のエルサレムを示すが、原文にない固有名は補っていない。
