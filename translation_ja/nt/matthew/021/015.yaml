id: MAT.21.15
reference: Matthew 21:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: ja
  text: しかし、祭司長たちと律法学者たちは、イエスがなさった驚くべきことを見、また神殿[a]で子どもたちが「ダビデの子に、ホサナ[b]」と叫んでいるのを見て、憤慨した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、内側の聖所だけでなく、境内を含む神殿域全体を指す。
    reason: cultural_note
  - marker: b
    text: 「ホサナ」はヘブライ語に由来し、「どうかお救いください」または「今、お救いください」ほどの意味を持つが、当時すでに賛美の歓呼としても用いられていた。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 見て
  rationale: アオリスト分詞が主動詞「憤慨した」に至る状況を示す。日本語では二つの目的語に「見」を対応させ、自然な時間・原因関係を保った。
- source_word: δὲ
  choice: しかし
  rationale: 直前の場面との穏やかな対照を明確に表す。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 単独の大祭司ではなく、祭司階級の指導者たちを指す定着した訳語。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 当時の聖書・律法の専門家という役割を、現代の一般読者に誤解なく伝える。
- source_word: τὰ θαυμάσια
  choice: 驚くべきこと
  rationale: 驚異的な行為を広く指し、すべてを奇跡と限定しない表現。
- source_word: ἐποίησεν
  choice: なさった
  rationale: 単純な過去の行為を表しつつ、イエスを主語とする文脈にふさわしい自然で敬意ある日本語。
- source_word: παῖδας
  choice: 子どもたち
  rationale: この文脈で最も自然な語義であり、「僕」や男性に限定される「少年たち」は採らない。
- source_word: κράζοντας
  choice: 叫んでいる
  rationale: 敵意を含意せず、大声で公に歓呼している様子を表す。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: 自然な本文表現を採りつつ、ἱερόνが内陣だけでなく神殿域全体を指すことを脚注で明示する。
- source_word: λέγοντας
  choice: 「…」と
  rationale: 叫ばれた内容を直接話法で自然に導き、κράζονταςとの重複を避けた。
- source_word: Ὡσαννὰ
  choice: ホサナ
  rationale: 救いを求める語源的意味と、賛美の歓呼としての機能の双方を保つため音写し、意味は脚注に示す。
- source_word: τῷ υἱῷ Δαυίδ
  choice: ダビデの子に
  rationale: 与格を「に」で表し、マタイにおけるメシア的称号「ダビデの子」を字義どおり保持する。
- source_word: ἠγανάκτησαν
  choice: 憤慨した
  rationale: 強い不快感と怒りを表す語を、明瞭で品位ある現代日本語にした。
theological_decisions:
- issue: 「ダビデの子」のメシア的意義
  choice: 称号を「ダビデの子」と字義どおり保持した。
  alternative: 「ダビデの後継者」「ダビデの子孫」
  rationale: マタイの物語で認識されるメシア的称号としての響きを弱めず、同時に本文以上の説明を織り込まないため。
- issue: Ὡσαννάの意味と機能
  choice: 本文では「ホサナ」と音写した。
  alternative: 「どうかお救いください」「今、お救いください」
  rationale: 語源的には救いを求める願いでありながら、この箇所では定型化した賛美・歓呼としても機能する。その両義的な緊張を本文で一方に限定せず、脚注で説明した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「律法学者」「祭司長」「ダビデの子」は一般読者にも通じる定着語を採用し、「ホサナ」は礼拝的・メシア的響きと語源的な救済嘆願の両方を残した。
