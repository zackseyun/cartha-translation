id: MAT.21.40
reference: Matthew 21:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: ja
  text: それでは、ぶどう園の持ち主[a]が来たとき、あの農夫たち[b]をどうするだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ぶどう園の主人」とも訳せる。ギリシア語はキュリオスで、しばしば「主」と訳されるが、ここではたとえの中のぶどう園の所有者を指す。
    reason: lexical_alternative
  - marker: b
    text: 文脈上は、ぶどう園を借りて耕す「小作人たち」を指す。ただし、ギリシア語自体はより広く「農夫」「耕作者」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 来たとき
  rationale: 接続法を伴う時の節で、このたとえの中で予期される一度の到来を指すため、「来るたび」ではなく「来たとき」とした。
- source_word: οὖν
  choice: それでは
  rationale: 直前の物語を受けて結論を問う推論・移行の働きを、現代日本語の自然な問いかけとして表した。
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: ぶどう園の持ち主
  rationale: κύριος は「主」「主人」とも訳せるが、ここではたとえの中のぶどう園の所有者を指す。「持ち主」は神学的称号を不必要に持ち込まず、文脈上の役割を明確にする。
- source_word: ἀμπελῶνος
  choice: ぶどう園
  rationale: ἀμπελών の標準的で明瞭な訳語。
- source_word: τί ποιήσει τοῖς γεωργοῖς ἐκείνοις
  choice: あの農夫たちをどうするだろうか
  rationale: 未来形の問いを「どうするだろうか」とし、行為の向けられる相手を示す与格は日本語で自然な「を」によって表した。ἐκείνοις の指示性と距離感は「あの」で保持した。
- source_word: γεωργοῖς
  choice: 農夫たち
  rationale: 語自体は広く耕作者・農夫を意味する。物語上は借り受けて耕す者たちだが、その情報を本文の語だけに過剰に織り込まず、脚注で補った。
theological_decisions:
- issue: たとえの文脈における κύριος の訳し方
  choice: 持ち主
  alternative: 主／主人
  rationale: ここでは直接の指示対象がたとえの物語内にいるぶどう園の所有者であり、神的称号としての「主」と断定する必要はない。一方で「主人」という語義の可能性は脚注に残した。
- issue: γεωργοί に小作関係を明示するか
  choice: 本文では「農夫たち」
  alternative: 小作人たち／借地農夫たち
  rationale: 周辺文脈から賃借して耕していることは分かるが、γεωργοί 自体は必ずしも小作関係を明示しないため、本文では広い語義を保ち、文脈的な意味を脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、問いかけの厳粛さを保った。「それでは」は οὖν の論理的な移行を自然に示し、「だろうか」は未来の行為を問う形を簡潔に表す。
