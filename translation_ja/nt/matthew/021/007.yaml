reference: Matthew 21:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: ja
  text: 弟子たちは、ろばと子ろばを連れて来て、その二頭に自分たちの上着を掛けた。そして、イエスはそれらの上に座られた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それら」は、二頭のろばを指すとも、二頭に掛けられた上着を指すとも取れる。後者なら、「上着の上に座られた」という意味になる。
    reason: 最後の複数代名詞の指示対象には統語上の曖昧さがあるため。
lexical_decisions:
- source_word: ἤγαγον
  choice: 連れて来て
  rationale: ἄγωは「導く」「連れて来る」の意を持つ。弟子たちが二頭をイエスのもとへ伴って来たという文脈を、自然な現代日本語で表した。
- source_word: τὴν ὄνον
  choice: ろば
  rationale: ὄνοςはろばを指し、女性形の冠詞からこの個体が雌であることが分かる。ただし直前の文脈でも親子関係は示され、日本語本文で「雌ろば」とすると不自然に強調されるため、通常の「ろば」とした。
- source_word: τὸν πῶλον
  choice: 子ろば
  rationale: πῶλοςは若い動物を指し、ここでは文脈上、若いろばである。「子ろば」は「子馬」との混同を避けつつ、簡潔で明瞭である。
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: その二頭に自分たちの上着を掛けた
  rationale: 複数代名詞αὐτῶνが先に挙げられた二頭を指すことを明確にした。ἱμάτιαはこの場面では外衣・上着であり、「自分たちの」は弟子たちを指す文脈上の自然な補足である。
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: イエスはそれらの上に座られた
  rationale: 原文の複数代名詞を「それら」として保持し、それが二頭を指すのか、掛けられた上着を指すのかを本文で断定しない。主語「イエス」は日本語で明瞭にするため文脈から補い、敬意を示す自然な叙述として「座られた」とした。
theological_decisions:
- issue: καὶ ἐπεκάθισεν ἐπάνω αὐτῶνにおける最後の複数代名詞αὐτῶνの指示対象
  choice: 「それらの上に」と訳し、指示対象を本文では確定しない。
  alternative: 「上着の上に座られた」、または一頭のろばに座られたと解する。
  rationale: これは教理上の断定よりも統語的・物語的な曖昧さである。原文の複数形を保ち、二頭と上着のどちらを指すかという真正な曖昧さを注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「それら」は日常語としてやや形式的だが、原文の複数形と指示対象の曖昧さを保持するために採用した。
