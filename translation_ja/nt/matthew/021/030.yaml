id: MAT.21.30
reference: Matthew 21:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: ja
  text: 父は次に、二人目の息子のところへ行って、同じことを言った。息子は答えた。「私が行きます、お父さん[a]。」しかし、行かなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の敬意ある呼びかけは直訳すると「主よ」「ご主人様」など。この文脈では、息子が父に呼びかけているため「お父さん」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: そこで父は…ところへ行き
  rationale: 分詞を日本語の自然な物語の流れに直し、文脈上の主語「父」を補った。δὲは強い逆接ではなく、場面の進行を示す「そこで」とした。
- source_word: τῷ δευτέρῳ
  choice: 二人目の息子
  rationale: 原文は「二人目」だけだが、直前の文脈で息子を指す。日本語で対象を明確にするため「息子」を補った。
- source_word: ὡσαύτως
  choice: 同じことを
  rationale: 二人目にも同一の命令を伝えたことを、簡潔で自然な日本語にした。
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えた
  rationale: 字義的には「答えて言った」だが、日本語では冗長になるため慣用的にまとめた。
- source_word: Ἐγώ
  choice: 私が行きます
  rationale: 原文は強調された代名詞「私が」のみで、動詞は省略されている。命令への承諾として含意される「行きます」を本文で補い、省略について脚注に示した。
- source_word: κύριε
  choice: お父さん
  rationale: κύριεは敬意を込めた呼びかけだが、ここでは神的・メシア的称号ではなく、息子が人間の父に呼びかけている。現代日本語の家庭内の呼称として自然な「お父さん」を採った。
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: しかし、行かなかった
  rationale: καίは形式上「そして」だが、承諾と行動の明確な対照を日本語で自然に表すため「しかし」とした。
theological_decisions:
- issue: 父への呼びかけκύριεの訳
  choice: お父さん
  alternative: 主よ／ご主人様
  rationale: この箇所では人間の父への敬意ある呼びかけであり、「主よ」では神学的称号の含みが不必要に強くなる。「ご主人様」も親子間の日本語として不自然なため、文脈に即して「お父さん」とした。
- issue: Ἐγώという省略応答の明示化
  choice: 私が行きます
  alternative: 私が／はい
  rationale: 原文の省略と強調を踏まえつつ、日本語として命令への承諾が明瞭になるよう動詞を補った。後の不履行との緊張を保つため、確約として訳した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語として簡潔に整えた。「父」「息子」は文脈上明らかな指示対象を日本語で自然に示すため補っている。応答は丁寧体とし、父への敬意を保ちながら古風すぎる表現を避けた。
