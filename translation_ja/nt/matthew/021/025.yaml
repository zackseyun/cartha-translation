id: MAT.21.25
reference: Matthew 21:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: ja
  text: 「ヨハネのバプテスマは、どこからのものだったのか。天からか、それとも人からか。」彼らは仲間内で[a]論じ合った。「もし『天から』と言えば、彼は私たちに、『それなら、なぜヨハネを信じなかったのか』と言うだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼ら自身の間で」。仲間内であれこれ考え、論じ合ったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: ヨハネのバプテスマ
  rationale: βάπτισμαはここではヨハネが行った洗礼の実践と、その権威を含む働きを指す。日本語で定着した「バプテスマ」を用い、単なる一般的な「洗い」とはしない。
- source_word: πόθεν ἦν
  choice: どこから来たのか
  rationale: 場所そのものではなく起源・権威の源を問う表現。「どこからのものだったか」より自然で、由来を問う力も保つ。
- source_word: ἐξ οὐρανοῦ
  choice: 天から
  rationale: 原文の婉曲的な表現をそのまま保ち、神に由来するという意味を本文で明示的に言い換えない。
- source_word: ἐξ ἀνθρώπων
  choice: 人から
  rationale: 男性だけでなく人間に由来することを表す複数形。簡潔な「人から」により「天から」との対照を保つ。
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: 互いに相談して
  rationale: 彼らが内輪で考えを巡らせ、話し合った継続的な協議を自然な日本語で表す。
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: ヨハネを信じなかった
  rationale: αὐτῷの指示対象を日本語で明確にし、ヨハネの告げたことと権威を受け入れなかった意味を表す。
theological_decisions:
- issue: 「天から」が指すもの
  choice: 本文では「天から」を保持する
  alternative: 神から
  rationale: 神的起源・権威を指すユダヤ的な婉曲表現だが、原文の言い回しと修辞的対照を保ち、解釈を本文に代入しない。
- issue: 「人から」の範囲
  choice: 性別を限定しない「人から」
  alternative: 人々から／人間から
  rationale: ἀνθρώπωνはここで男性に限定されず、神的起源に対する人間的起源を意味する。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文とした。「バプテスマ」は聖書用語として定着した表記を採用。「それなら」によりοὖνの推論的な力を自然に示した。
