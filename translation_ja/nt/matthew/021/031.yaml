id: MAT.21.31
reference: Matthew 21:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: ja
  text: 「二人のうち、どちらが父の望みを行ったのか。」彼らは「最初の者です」と答えた。イエスは彼らに言われた。「まことに、あなたがたに言います。徴税人や娼婦たちが、あなたがたより先に神の国へ入っていきます。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに先立って神の国に入る」。ギリシア語は「あなたがたより先に進む」という意味で、彼らが先行することを強調しているが、あなたがたが最終的に入れないとまで必ずしも述べてはいない。
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: 二人のうち、どちら
  rationale: ἐκの部分を示す用法を保ちつつ、現代日本語として自然な問いにした。
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: 父親の望みどおりにした
  rationale: 直訳的な「父の意志を行った」より自然で分かりやすく、たとえ話の父親への言及であることも明確にする。
- source_word: Ὁ πρῶτος
  choice: 初めの息子です
  rationale: ギリシア語は「最初の者」と省略的に答えるが、日本語では対象を補って自然にした。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言う
  rationale: イエスの厳粛な導入句を、格調を保った理解しやすい定型表現で訳した。
- source_word: τελῶναι
  choice: 徴税人
  rationale: 当時の税・通行税などを徴収した人々を指す、福音書で一般的かつ明確な訳語。
- source_word: πόρναι
  choice: 娼婦たち
  rationale: 語の具体的意味を保ち、より広義の「性的に不道徳な女性」と一般化しない。
- source_word: προάγουσιν ὑμᾶς
  choice: あなたがたより先に…入っていく
  rationale: 現在形と先行の比喩を自然な日本語で表し、相手の最終的な排除までは断定しない。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国へ
  rationale: 方向を示すεἰςと定着した神学的表現「神の国」を保った。
theological_decisions:
- issue: προάγουσιν ὑμᾶςが神の国への入場について持つ含意
  choice: あなたがたより先に神の国へ入っていく
  alternative: あなたがたに先立って神の国に入る／あなたがたより先に神の国へ向かっている
  rationale: προάγωの先行という意味とεἰςの方向性を表す一方、宗教指導者たちが最終的に完全に排除されるとまでは本文以上に断定せず、警告の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で厳粛な調子を保った。「娼婦」「徴税人」は原文の具体性と社会的な衝撃を弱めずに伝える語を選んだ。
