source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: ja
  text: 群衆はこう言っていた。「この方は、ガリラヤのナザレ出身の預言者[a]イエスです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「預言者」にはギリシア語の定冠詞が付いており、特定の預言者を指す可能性がある。「一人の預言者」と理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: 群衆は
  rationale: ὄχλοιは複数形だが、日本語では集合を表す「群衆」が自然である。δέは軽い接続であり、文脈上、日本語では明示しなくても物語の流れが保たれる。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的または反復的な発話を、自然な現代日本語で表す。
- source_word: Οὗτός ἐστιν
  choice: この方は…だ
  rationale: 指示詞と繋辞による同定を表す。「この方」はイエスを指す群衆の発言として自然で、不要に粗い響きを避ける。
- source_word: ὁ προφήτης
  choice: 預言者
  rationale: ギリシア語には定冠詞があり、特定の、または広く認められた預言者としての同定を含み得る。ただし日本語には定冠詞がないため、本文では自然な「預言者」とし、その含意と別訳を脚注で示す。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 固有名を日本語聖書で一般的な形に音写する。
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: ガリラヤのナザレ出身の
  rationale: 出身地を示す冠詞付き句を自然な日本語にする。τῆς Γαλιλαίαςはナザレの地理的位置を示すため、「ガリラヤのナザレ」とした。
theological_decisions:
- issue: ὁ προφήτηςを特定的に訳すか、不特定的に訳すか
  choice: 本文では「預言者」とし、定冠詞の含意を脚注で保持する
  alternative: 「あの預言者」または「一人の預言者」
  rationale: ギリシア語の定冠詞は、群衆がイエスを特定の、あるいは認められた預言者的人物と見なした可能性を残す。一方、日本語で「あの預言者」とすると旧約的な特定人物への同定を強めすぎるおそれがあり、「一人の預言者」では定冠詞を弱めるため、本文と脚注を組み合わせて曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「言っていた」で未完了過去の継続性を保ち、「ガリラヤのナザレ出身」で地理的関係を自然に表した。脚注記号[a]は該当表現の直後に置いた。
