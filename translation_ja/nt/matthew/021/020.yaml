  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: ja
  text: 弟子たちはそれを見て驚き、「いちじくの木が、どのようにしてたちまち枯れたのですか」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: それを見て
  rationale: アオリスト分詞を自然な継起として訳した。「それ」は直前の文脈にある、いちじくの木が枯れた出来事を指す。
- source_word: οἱ μαθηταί
  choice: 弟子たちは
  rationale: 定冠詞を伴う主語を、文脈上特定されたイエスの弟子たちとして標準的に表現した。
- source_word: ἐθαύμασαν
  choice: 驚き
  rationale: θαυμάζωが表す驚嘆を、現代日本語で自然かつ簡潔に表した。
- source_word: λέγοντες
  choice: と言った
  rationale: 発言を導く現在分詞を、日本語として自然な引用構文に組み替えた。
- source_word: Πῶς
  choice: どうして
  rationale: ここでは枯れた仕方や原因を問う驚きの疑問を表す。日本語の「どうして」はその幅を保つ。
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 「直ちに、すぐに」という時間的意味を保ちつつ、驚きを伴う問いにふさわしい自然で dignified な表現とした。
- source_word: ἐξηράνθη
  choice: 枯れた
  rationale: ξηραίνωのアオリスト受動形。木については、日本語では結果状態を自然に表す「枯れた」が適切であり、受動形を機械的に再現しない。
- source_word: ἡ συκῆ
  choice: いちじくの木が
  rationale: συκῆを具体的かつ一般読者に明瞭な語で訳した。
