id: MAT.21.35
reference: Matthew 21:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: ja
  text: 小作人たちは主人の奴隷たち[a]を捕らえ、一人を打ちたたき、別の一人を殺し、さらに別の一人を石打ちにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべたち」とも訳せる。ギリシア語「ドゥーロイ」は、文脈により「奴隷」または「しもべ」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: 小作人たち
  rationale: ぶどう園を所有者から任されて耕作する者たちを指すため、単なる「農夫」ではなく、賃借関係も表す「小作人」とした。
- source_word: λαβόντες
  choice: 捕らえ
  rationale: 基本義は「取る」だが、直後に暴行と殺害が続く文脈では、敵対的に身柄を押さえることを自然に表す「捕らえ」が適切である。
- source_word: δούλους
  choice: 奴隷たち
  rationale: 所有者に属し、その権威のもとで遣わされた者たちであることを明確にするため「奴隷」とした。ただし文脈上「しもべ」とも訳し得るため脚注を付した。
- source_word: ἔδειραν
  choice: 打ちたたき
  rationale: 暴力を加えて打つことを表す。方法を「むち打ち」に限定せず、現代日本語で明瞭な表現とした。
- source_word: ἀπέκτειναν
  choice: 殺し
  rationale: 動詞の直接的な意味を保ち、「処刑した」「虐殺した」などの追加的な含意を避けた。
- source_word: ἐλιθοβόλησαν
  choice: 石打ちにした
  rationale: 石を投げつけて攻撃または殺害する行為を表す定着した聖書用語であり、原語の具体性を保つ。
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: 一人を……別の一人を……さらに別の一人を
  rationale: それぞれ異なる奴隷が異なる仕打ちを受けたという分配的な構文を、自然で明瞭な日本語にした。
theological_decisions:
- issue: たとえ話における δοῦλος の訳語
  choice: 奴隷
  alternative: しもべ
  rationale: ここでは所有者との従属・所有関係が背景にあり、「奴隷」が原語の社会的身分をより直接に伝える。一方、遣わされた代理人としての役割に重点を置けば「しもべ」も可能なので、その余地を脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を用い、たとえ話としての簡潔で厳粛な調子を保った。「主人」は αὐτοῦ の指示対象であるぶどう園の所有者を日本語で明確にするため補った。
