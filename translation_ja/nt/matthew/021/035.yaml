  verdict: approve
  source_fidelity: ギリシア語の分配構文（「一人を…別の一人を…さらに別の一人を…」）と、捕縛・殴打・殺害・石打ちという一連の行為を正確に再現している。「小作人たち」は、このたとえにおけるγεωργοίの賃借・耕作の役割を適切に示す。「主人」は直前のたとえの土地所有者を指す文脈上明確であり、αὐτοῦの自然な補足として許容される。
  naturalness: 全体として明瞭な現代標準語であり、簡潔な物語文として自然である。「捕らえ」「打ちたたき」「石打ちにした」の並列も読みやすい。「石打ちにした」は、原語が必ずしも結果としての死亡を明示しない点を保っている。
  terminology: δοῦλοιを「奴隷たち」とするのは原語の基本的社会的身分を率直に表しており、このたとえの主人との関係にも合う。脚注は「しもべたち」という文脈上の代替訳を適切に示す。「小作人」「石打ち」はいずれも意味が明確で、過度に古風ではない。
