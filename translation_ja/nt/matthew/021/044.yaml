id: MAT.21.44
reference: Matthew 21:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: ja
  text: この石の上に落ちる者は、打ち砕かれる。しかし、この石がだれの上に落ちても、その人を粉々にする。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後半は、より字義的には「その人を粉にする」、また「もみ殻のように吹き散らす」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: この節は、マタイの一部の写本にはない。ただし、ルカ20章18節に並行箇所がある。
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: 落ちる者
  rationale: 冠詞付き分詞を一般的な人物を指す名詞句として訳し、単数の格言的な響きを保った。
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: この石の上に
  rationale: 空間的な意味を素直に表し、周囲の文脈にあるλίθοςの石の比喩とのつながりを保った。
- source_word: συνθλασθήσεται
  choice: 打ち砕かれる
  rationale: 未来受動の強い破壊を自然な日本語で示しつつ、後半のλικμήσειとの表現上の違いを残した。
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: しかし、この石が落ちかかる者は
  rationale: 衝突の向きが逆転し、石が落ちる側になることを明示した。ἄνを伴う不定関係節の一般性は「者」で表した。
- source_word: λικμήσει
  choice: 粉々にされる
  rationale: 粉砕する、あるいはもみ殻のように吹き散らすほど徹底的に滅ぼすという強い像を、明瞭で力のある日本語にした。ギリシア語では能動形だが、日本語では前節と対応させた受動表現が自然である。
- source_word: αὐτόν
  choice: （「者」を受ける省略された目的語）
  rationale: 日本語では同じ人物を表す目的語を明示すると不自然になりやすいため、「その者を」を表面上は省略し、「粉々にされる」の主語として対応関係を保った。
theological_decisions:
- issue: 石の比喩と裁きの表現
  choice: 具体的な「石」と二方向の衝突による破壊の像をそのまま残す。
  alternative: 本文中で石を明示的にメシアまたはイエスと説明する。
  rationale: 周囲の文脈は石の意味を示唆するが、この節自体には明示的な同定がないため、解釈を本文に加えず、比喩と裁きの厳しさを保持した。
- issue: 二つの破壊動詞の区別
  choice: συνθλασθήσεταιを「打ち砕かれる」、λικμήσειを「粉々にされる」と訳し、後半をより徹底的な破壊として表す。
  alternative: 両方を同じ「砕かれる」で訳す。
  rationale: 二つの異なる動詞が作る緊張と、後半のより鮮烈な粉砕・吹き散らしの含意を消さないため。
- issue: 本文批評上の位置
  choice: 節を本文に置き、写本上の欠落を脚注で明示する。
  alternative: 本文から除いて脚注のみに置く。
  rationale: 指定されたSBLGNT本文には節が角括弧相当の本文批評記号付きで収録されているため、本文として訳しつつ、重要な異読を読者に知らせる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「打ち砕かれる」と「粉々にされる」によって二つの動詞を区別した。脚注記号は本文中に[a][b]として付した。
