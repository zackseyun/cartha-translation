id: MAT.21.42
reference: Matthew 21:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたは、聖書の中で次のことを一度も読んだことがないのですか。『家を建てる者たちが退けた石、それが隅の要石[a]となった。これは主[b]から起こったことであり、私たちの目には驚くべきことである。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「隅の頭」。建物の隅を成す主要な石とも、建物上部の「頂石」とも理解される。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「主」。引用元のヘブライ語（詩編118:22–23）では神名YHWHが用いられている。
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去表現にした。イエスへの敬意を保ちつつ、発言導入として明瞭である。
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: 読んだことがないのですか
  rationale: 強い修辞疑問を、現代日本語で自然な経験表現として訳した。単なる過去の一度の読書ではなく、聖書を知っているはずの相手への問いかけを伝える。
- source_word: ἐν ταῖς γραφαῖς
  choice: 聖書で
  rationale: イスラエルの聖なる諸文書を指す定着した訳語「聖書」を用い、ἐν の引用箇所を示す働きを自然な助詞「で」で表した。
- source_word: Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες
  choice: 家を建てる者たちが退けた石
  rationale: 建築の比喩を保ち、ἀποδοκιμάζω の『不適格と判断して退ける』意味を簡潔な「退けた」で表した。
- source_word: οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
  choice: それが隅の要石となった
  rationale: 強調された指示語 οὗτος を「それが」で受け、結果として重要な地位に置かれたことを「となった」で表した。κεφαλὴ γωνίας は位置に議論があるため、建物の隅で要となる石を示しつつ過度に特定しない「隅の要石」とした。
- source_word: παρὰ κυρίου ἐγένετο αὕτη
  choice: これは主から出たことであり
  rationale: παρά＋属格の起源・源泉の意味を「主から出た」として保持した。αὕτη は特定の石そのものより、石が要石となった出来事を指す自然な日本語にした。
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: 私たちの目には驚くべきことである
  rationale: 「私たちの目に」という視覚的表現を残しながら、θαυμαστή の驚嘆を格調ある自然な日本語で示した。
theological_decisions:
- issue: 詩編引用中の κύριος の表記
  choice: 主
  alternative: 主〔ヤハウェ〕、または神名を示す特別な表記
  rationale: マタイのギリシア語本文は κυρίου であるため、本文では「主」と訳した。一方、引用元のヘブライ語には神名 YHWH があることを脚注で明示し、両言語の情報を混同しないようにした。
- issue: 石の比喩のメシア的適用
  choice: 比喩をそのまま保持する
  alternative: 本文で石をキリストまたはメシアと明示する
  rationale: 文脈上イエス自身への適用が示唆されるが、この節の引用文自体は石の比喩を明示的に解説していないため、訳文に解釈的な同定を加えなかった。
- issue: κεφαλὴ γωνίας が示す建築部位
  choice: 隅の要石
  alternative: 隅の親石、礎石、頂石
  rationale: 基礎の隅石か上部の頂石かを本文だけで断定せず、中心的・決定的な石という比喩を保てる表現を選び、別解を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、聖書引用には簡潔で格調ある「である」調を用いた。修辞疑問の強さ、石の比喩、引用元にある神名の背景を保ち、建築部位やメシア的意味を本文で一義的に決めつけていない。
