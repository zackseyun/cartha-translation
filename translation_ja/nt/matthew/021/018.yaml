  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: ja
  text: 朝早く、イエスは都へ戻る途中、空腹を覚えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: 朝早く
  rationale: 一日の早い時間を示す副詞。「朝早く」は、時間的な強調を保ちつつ、現代日本語として自然である。
- source_word: δὲ
  choice: 訳文では独立した接続語を置かない
  rationale: ここでは強い対比ではなく、物語を進める軽い接続を表す。日本語では文脈と語順によって自然に示せるため、「さて」などを補わない。
- source_word: ἐπανάγων
  choice: 戻る途中
  rationale: 現在分詞で、主動詞と同時進行する動作を示す。「戻る途中」は、都へ向かって戻っていた最中であることを簡潔に表す。
- source_word: εἰς τὴν πόλιν
  choice: 都へ
  rationale: εἰς＋対格が示す移動の方向を「へ」で表した。「都」は文脈上エルサレムを指し、原文の定冠詞付き πόλις の簡潔さを保つ。到着済みとは断定しない。
- source_word: ἐπείνασεν
  choice: 空腹を覚えた
  rationale: アオリストの出来事としての性格を自然な日本語で示し、その時に空腹になったことを表す。「腹をすかせた」は意図的にそうしたとの誤解を招きうるため避けた。
theological_decisions:
- issue: イエスが空腹を経験したことのキリスト論的含意
  choice: 現実の身体的な空腹として率直に訳す
  alternative: 教理的な説明を本文に加える、または空腹を比喩化する
  rationale: 本文はイエスの実際の空腹を物語として述べている。説明を加えずそのまま訳すことで、真の人間性への証言を保ちつつ、本文以上の教理を持ち込まない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「都」は聖書物語にふさわしい品位を保ちながら一般読者にも理解しやすい。主語はギリシア語では省略されているが、日本語の単独節として指示対象を明確にするため「イエス」を補った。
