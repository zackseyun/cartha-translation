base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: ja
  text: このことが起こったのは、預言者を通して[a]こう語られたことが成就するためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「預言者によって」とも訳せる。ギリシア語は直訳すると「預言者を通して」で、預言者が言葉を伝える媒介者であることを示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: このこと
  rationale: 中性単数の指示語で、直前に命じられた一連の出来事をひとまとまりに指す。現代日本語では「このこと」が自然である。
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: ここでは弱い接続・展開を示す。日本語では文脈と「このことが起こったのは」という構文によって自然に表せるため、「さて」などを加えなかった。
- source_word: γέγονεν
  choice: 起こった
  rationale: γίνομαι の完了形。成就定型句の中で出来事の発生を表しており、「起こった」が明快で自然である。
- source_word: ἵνα πληρωθῇ
  choice: 成就するためであった
  rationale: ἵνα とアオリスト受動接続法の目的・結果の含みを保つ。「成就した」だけにして関係を弱めず、同時に日本語として自然な目的構文とした。
- source_word: τὸ ῥηθὲν
  choice: 語られたこと
  rationale: 冠詞付き受動分詞の名詞的用法を、受動の形を保って簡潔に訳した。
- source_word: διὰ τοῦ προφήτου
  choice: 預言者を通して
  rationale: 属格を伴う διά が示す媒介性を保ち、預言者を介して語られたという表現にした。
- source_word: λέγοντος
  choice: こう言われている
  rationale: 後続する引用を導入する現在分詞。日本語では文を分け、「こう言われている」とすることで引用へのつながりを明瞭にした。
theological_decisions:
- issue: 成就定型句における預言者の役割
  choice: 「預言者を通して語られたこと」とし、媒介された発言として訳す。
  alternative: 「預言者によって語られたこと」または「預言者が語ったこと」
  rationale: 原文の διὰ＋属格は預言者を媒介者として示しうる。「預言者を通して」は、発言の究極的な源を明示的に補わずに、その媒介性を保つ。
- issue: ἵνα 節の目的と結果の関係
  choice: 「成就するため」と訳す。
  alternative: 「成就したのである」または「成就することとなった」
  rationale: ἵνα の目的的な力を保つ一方、目的と結果が重なりうる成就定型句の神学的緊張を、過度な説明を加えず表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用導入の分詞は、日本語の自然さを優先して独立文とした。「成就」は聖書の預言実現を表す一般的な語として保持した。
