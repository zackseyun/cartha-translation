  terminology: 「幼子」「乳飲み子」「賛美」は適切である。「備えられた」は神への呼びかけにおける敬意ある表現として許容され、κατηρτίσω の意味を過度に限定しない。脚注は、マタイのギリシア語引用とヘブライ語本文の「力」の相違を適切に示す。
