language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: ja
  text: '彼らはイエスに言った。「この者たちが何を言っているか、聞こえるか。」イエスは彼らに言った。「はい。あなたがたは、こう書かれているのを一度も読んだことがないのですか。


    『幼子と乳飲み子の口から、

    あなたは賛美を備えられた。』[a]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イエスはここで、ギリシア語聖書の伝承に沿って詩篇8篇2節を引用している。ヘブライ語本文は一般に、「幼子と乳飲み子の口から、あなたは力を打ち立てられた」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: 聞こえているのか
  rationale: 現在形の直接疑問を自然な現代日本語で表し、イエスがその発言を認識しているかと問い詰める響きを保った。
- source_word: τί οὗτοι λέγουσιν
  choice: あの者たちが何を言っているか
  rationale: οὗτοι の指示性と、話し手側の距離を置いたやや見下すような響きを「あの者たち」で示し、λέγουσιν の継続中の発言を自然に表した。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は臨場感を与える歴史的現在だが、日本語で「言う」とすると不自然になりやすいため、物語文として自然な過去形を用いた。
- source_word: Ναί
  choice: 聞こえている
  rationale: 単なる「はい」よりも、直前の「聞こえているのか」に対応する肯定内容を明示し、日本語の対話として自然にした。
- source_word: οὐδέποτε ἀνέγνωτε
  choice: 一度も読んだことがないのか
  rationale: 聖書に通じているはずの相手への修辞的な問いと叱責の調子を、明瞭な現代日本語で保持した。
- source_word: Ἐκ στόματος
  choice: 口から
  rationale: 起点を示す前置詞句を簡潔かつ直接的に訳した。
- source_word: νηπίων
  choice: 幼子
  rationale: 非常に幼い子どもを指す語として自然であり、続く「乳飲み子」と完全に重ならない表現を選んだ。
- source_word: θηλαζόντων
  choice: 乳飲み子
  rationale: 乳を飲んでいる子どもという具体的な像を、簡潔で聖書引用にもふさわしい現代日本語で表した。
- source_word: κατηρτίσω
  choice: 備えられた
  rationale: マタイが引用するギリシア語本文の「整える、備える、成立させる」という意味を保ち、神への呼びかけに合う敬意表現とした。
- source_word: αἶνον
  choice: 賛美
  rationale: 抽象名詞としての基本義を簡潔に訳し、「賛美の歌」など本文にない限定を加えなかった。
theological_decisions:
- issue: イエスが引用する詩篇8篇2節の表現
  choice: マタイのギリシア語本文に従い、本文を「あなたは賛美を備えられた」とする
  alternative: ヘブライ語本文に基づく「あなたは力を打ち立てられた」
  rationale: マタイはギリシア語聖書の形に沿って引用しているため、本文ではマタイ自身が提示する表現を訳した。ヘブライ語本文との差異は調和させず、脚注に明示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、聖書引用には簡潔で品位ある表現を用いた。会話部分では過度に古風な語尾を避け、修辞的な問いの厳しさを保った。
