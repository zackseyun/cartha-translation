  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: ja
  text: 祭司長たちとファリサイ派の人々は、イエスのたとえ話[a]を聞いて、イエスが自分たちのことを語っているのだと分かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自分たちについて」。文脈には批判的な含みがあるが、ギリシア語は直接には「彼らについて」と述べている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 聞いて
  rationale: アオリスト分詞を、主動詞「悟った」に先立つ状況を自然に示す接続形で訳した。文脈上、「聞いたとき」とも訳せる。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 当時の上級祭司層・祭司指導者を指す複数形として、日本語聖書で定着し、誤解の少ない訳語を用いた。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: ユダヤ教内の集団名として、現代の一般読者にも人々を指すことが明確になる表現を選んだ。
- source_word: παραβολὰς
  choice: たとえ
  rationale: イエスの比喩的な物語や語りを指す、自然で定着した訳語。複数形の意味は集合的な日本語表現で十分に伝わる。
- source_word: ἔγνωσαν
  choice: 悟った
  rationale: ここでは単に知っていたのではなく、その時に意味を認識したことを表すため、「分かった」より dignified で自然な「悟った」とした。
- source_word: περὶ αὐτῶν
  choice: 自分たちについて
  rationale: περί＋属格の基本義「〜について」を保った。「自分たち」は、認識主体である祭司長たちとファリサイ派を自然に受ける。文脈上は批判が含意されるが、「自分たちを非難して」とは強めない。
- source_word: λέγει
  choice: 語っている
  rationale: 歴史的現在形の継続的な響きを、間接話法の中で自然な日本語の進行表現として示した。主語のイエスは日本語で補い、指示対象を明確にした。
theological_decisions:
- issue: たとえが宗教指導者たちへの非難であることを訳文で明示するか
  choice: 自分たちについて語っている
  alternative: 自分たちを非難して語っている／自分たちに向けて語っている
  rationale: ギリシア語 περὶ αὐτῶν は直接には「彼らについて」を意味する。文脈は批判的だが、前置詞自体に「反対して」「非難して」という意味を読み込まず、含意と語義の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「祭司長」「たとえ」は定着した語を採用し、「ファリサイ派の人々」で一般読者への分かりやすさを確保した。注を必要とするほど重大な異読・訳語上の曖昧さはないため、脚注は付していない。
