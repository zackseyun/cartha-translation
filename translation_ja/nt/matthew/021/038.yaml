id: MAT.21.38
reference: Matthew 21:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: ja
  text: ところが、小作人たちはその息子を見ると、互いに言った。「あれが相続人だ。さあ、殺して、その相続財産をわれわれのものにしよう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その相続財産を持とう」。ここでは、それを自分たちの所有にしようという意味。
    reason: σχῶμενの基本義と、この文脈での取得の意味との両方を示すため。
lexical_decisions:
- source_word: γεωργοὶ
  choice: 小作人たち
  rationale: ぶどう園を所有者から任されて耕作する者たちを指す文脈なので、単なる「農夫」ではなく、その社会的立場が分かる「小作人」とした。
- source_word: ἰδόντες
  choice: 見ると
  rationale: アオリスト分詞を自然な時の節として訳し、息子を見た後に相談したという動作の流れを示した。
- source_word: τὸν υἱὸν
  choice: その息子
  rationale: ギリシア語には所有代名詞がないため「主人の息子」と説明的にはせず、文脈上すでに知られている人物を示す冠詞を自然な日本語の「その」で表した。
- source_word: ἐν ἑαυτοῖς
  choice: 互いに
  rationale: 複数の小作人たちが自分たちの間で相談したことを、簡潔で自然な日本語で表した。
- source_word: κληρονόμος
  choice: 相続人
  rationale: 法的な相続関係を明確に示し、続く「相続財産」との語義上のつながりも保った。
- source_word: δεῦτε
  choice: さあ
  rationale: 後に続く共同行動を促す勧誘の機能を、現代日本語で自然に表した。
- source_word: ἀποκτείνωμεν
  choice: 殺して
  rationale: 勧誘の接続法を後続の「われわれのものにしよう」と一続きの提案として訳した。「処刑する」のような司法的含意は加えていない。
- source_word: σχῶμεν
  choice: われわれのものにしよう
  rationale: 基本義は「持つ」だが、相続人を殺して財産を取得しようとする文脈上の意味を自然に示した。武力による取得を明示する「奪い取る」よりも原語の幅を保つため、脚注で直訳を示した。
- source_word: κληρονομίαν αὐτοῦ
  choice: その相続財産
  rationale: κληρονομίαの相続に関する意味と、αὐτοῦが指す相続人との関係を明確にした。日本語では「彼の」より指示関係が自然な「その」を用いた。
theological_decisions:
- issue: たとえの中の「息子」が指すもの
  choice: 物語の表現どおり「その息子」と訳し、本文中でイエスとの同一視を明示しない。
  alternative: 「イエスを表す息子」など、キリスト論的な意味を訳文に織り込む。
  rationale: マタイ福音書の文脈ではイエスを指し示すが、この節自体はたとえの物語として語られているため、解釈を本文に追加せず、その含意と緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、たとえの緊迫した相談の口調を保った。「あれ」は目の前に現れた息子を指す自然な発話であり、「こいつ」ほど露骨に侮蔑的ではない。
