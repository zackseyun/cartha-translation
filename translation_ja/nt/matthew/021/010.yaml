  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: ja
  text: イエスがエルサレムに入ると、都全体が騒然となり[a]、「この人は誰だ」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「揺さぶられた」。このギリシア語は、物理的に揺れることにも、ここでは人々が動揺して町が騒ぎになることにも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: イエスが…入られると
  rationale: 属格独立構文を自然な時の節として訳した。直前の文脈で指示対象がイエスであることが明白なので、日本語で不自然になり得る「彼」を避けて固有名を補い、敬意を示す通常の聖書文体とした。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 地名の現代日本語における標準的な表記を用いた。
- source_word: ἐσείσθη
  choice: 騒然となり
  rationale: 原義は「揺さぶる、揺れる」だが、ここではイエスの入城に対する町全体の動揺や騒ぎを表す。「騒然となる」は比喩的な意味を明瞭かつ自然に伝える。字義的な像は脚注で示した。
- source_word: πᾶσα ἡ πόλις
  choice: 町中が
  rationale: 住民を含む町全体を集合的に指す表現として、簡潔で自然な日本語にした。
- source_word: λέγουσα
  choice: …と言った
  rationale: 単数形の「町」を受ける分詞を、日本語では引用に続く述語として表現した。疑問の発話だが、原文に忠実に「尋ねた」と限定しなかった。
- source_word: Τίς ἐστιν οὗτος;
  choice: この人は誰だ
  rationale: 指示代名詞の人物指示を自然な日本語で明示した。「この人」は性別以上の解釈を加えず、群衆の直接的な問いを保つ。
theological_decisions:
- issue: 町の反応を表す動詞の字義的・比喩的な力
  choice: 本文では「騒然となり」と比喩的に訳す
  alternative: 「揺れ動き」「揺さぶられ」
  rationale: 文脈は地震ではなく、イエスの入城に対する町の社会的・感情的な動揺を描く。本文では意図された意味を自然に伝えつつ、「揺れる」という原語の比喩は脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用い、物語文としての品位を保った。「町中」はエルサレムの住民全体を集合的に表す。敬語は過度にせず、イエスの動作に「入られる」を用いた。
