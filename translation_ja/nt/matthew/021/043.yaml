  source_fidelity: ギリシア語の論理的帰結（διὰ τοῦτο）、未来受動態による剥奪と授与（ἀρθήσεται／δοθήσεται）、相手からの分離（ἀφ’ ὑμῶν）、および実を生み出す共同体という修飾（ἔθνει ποιοῦντι）を適切に保持している。「その実」は女性単数のαὐτῆςを「神の国」に受ける自然な訳であり、複数のκαρπούςも「実」として日本語で無理なく表現されている。
  naturalness: 「ですから、あなたがたに言います」は現代標準日本語の敬体として明瞭であり、聖書本文としても不自然ではない。「取り上げられ、その実を生み出す民に与えられます」も簡潔で意味関係が明確である。
  terminology: 「神の国」はβασιλεία τοῦ θεοῦの意味の幅を保つ定着した訳語である。「民」はἔθνειを政治的国家や特定の民族に狭めず、本文が意図的に特定しない集合的受領者を適切に表す。脚注は「国民」という代替を示しつつ、受領者を教会・異邦人等へ断定していない。
