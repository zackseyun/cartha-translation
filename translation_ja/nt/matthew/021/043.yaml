id: MAT.21.43
reference: Matthew 21:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: ja
  text: ですから、あなたがたに言います。神の国はあなたがたから取り上げられ、その実を生み出す民[a]に与えられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一つの国民」とも訳せる。ギリシア語は、国や民族、民の集団を指し得る。ここでは実を生み出す一つの共同体を表すが、それが具体的に誰であるかをこれ以上限定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 直前のたとえと引用から導かれる結論を示す。現代日本語として自然であり、論理的なつながりを保つ。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接的な宣言であることを、自然な敬体で表した。
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: あなたがたから取り上げられ
  rationale: 未来受動態と分離の意味を保ち、現在それを託されている者たちが失うという判断を明確に伝える。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 神の統治とその領域の両面を含み得る定着した表現であり、意味を一方に限定しない。
- source_word: δοθήσεται
  choice: 与えられます
  rationale: 未来受動態を保ち、神が与える主体であることを本文以上に明示しない。
- source_word: ἔθνει
  choice: 民
  rationale: 単数の集合体を表す。日本語の「民族」では民族的意味に狭まりやすく、「国」では政治国家を強く連想させるため、ここでは幅のある「民」とした。別訳を脚注に示す。
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: その実を生み出す
  rationale: 現在分詞が示す継続的・特徴的な行為と、国に属する実りの比喩を自然な日本語で表す。「その」は最も自然に「神の国」を受ける。
theological_decisions:
- issue: ἔθνειが指す共同体
  choice: 「民」と一般的に訳し、実を生み出す共同体として表す
  alternative: 教会、異邦人、または新しくされた神の民と明示する
  rationale: ギリシア語本文は受け手を実りによって特徴づけるが、その後代的・神学的な同定を一つに限定してはいないため。
- issue: 「神の国」の意味
  choice: 「神の国」をそのまま保持する
  alternative: 「神の支配」または「神の民に属する特権」と説明的に訳す
  rationale: βασιλείαの統治と領域にまたがる意味の幅、およびこの裁きの宣言にある神学的緊張を狭めないため。
- issue: αὐτῆςの指示対象
  choice: 「その」と訳し、文法上最も自然な「神の国」を受ける形にする
  alternative: ぶどう園や民の実りとして明示する
  rationale: 女性単数属格は「神の国」（βασιλεία）を受けるのが最も自然であり、別の対象を補う根拠は本文にない。
translation_notes:
  register: 明瞭な現代標準日本語の敬体を用いた。裁きの宣言としての重みを保ちつつ、過度に古風な語法や、特定の教派的解釈を避けた。
