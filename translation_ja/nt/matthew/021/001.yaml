  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: ja
  text: 一行がエルサレムに近づき、オリーブ山のベトファゲ[a]に来たとき、イエスは二人の弟子を遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「ベトファゲへ、オリーブ山へ」と続く。ここでは後半を、ベトファゲをオリーブ山との関係で示す表現と理解して訳した。
    reason: 原文の連続する二つのεἰς句の構文的・地理的な含みを示し、本文で一つの解釈に過度に固定しないため。
lexical_decisions:
- source_word: ἤγγισαν
  choice: 近づき
  rationale: ἐγγίζωの空間的な意味を自然な現代日本語で表し、エルサレムへ向かう動きを保つ。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 現代日本語で定着している標準的な地名表記。
- source_word: ἦλθον
  choice: 着いた
  rationale: ἤγγισανとの動作の違いを明確にし、ベトファゲへ到達したことを自然に表す。
- source_word: Βηθφαγὴ
  choice: ベトファゲ
  rationale: 現代日本語の聖書で一般的な地名表記。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: オリーブ山にある
  rationale: 二つ目のεἰς句を、ベトファゲの地理的位置を示す同格的な表現と理解し、日本語で誤解なく自然に結びつける。
- source_word: τότε
  choice: とき
  rationale: 先行する到着を、イエスが弟子を遣わす時点として自然な従属節にまとめる。
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: 用務のために弟子を送り出したという意味を、福音書にふさわしい明瞭で品位ある語で表す。
- source_word: δύο μαθητὰς
  choice: 二人の弟子
  rationale: 数詞と名詞を直接かつ自然に訳す。
theological_decisions:
- issue: イエスが明示される前の複数動詞の主語
  choice: 「一行」を補い、複数の同行者を指すものとして訳す。
  alternative: 「彼らが」として、ギリシア語の暗黙の主語をより形式的に保つ。
  rationale: ギリシア語は複数主語を明示しないが、日本語の「彼ら」では参照先がこの一節だけでは不明瞭になる。「一行」はイエスと同行者を過度に特定せず、複数形と物語の流れを自然に伝える。
- issue: ベトファゲとオリーブ山の地理的関係
  choice: 「オリーブ山にあるベトファゲ」とする。
  alternative: 「ベトファゲ、オリーブ山へ着いた」と、二つのεἰς句を並列的に保つ。
  rationale: 原文の語順には圧縮があるが、後半はベトファゲの位置をオリーブ山との関係で示すと理解できる。日本語では同格関係を明示することで、二つの別々の目的地であるかのような誤読を避ける。
translation_notes:
  register: 明瞭な現代標準日本語。物語文として簡潔さを保ちつつ、「遣わした」により福音書にふさわしい品位を持たせた。原文の明示しない主語は「一行」と最小限に補った。
