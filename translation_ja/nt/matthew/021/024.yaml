  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: ja
  text: しかし、イエスは彼らに答えた。「わたしもあなたがたに一つ尋ねよう[a]。それに答えるなら、わたしも、何の権威によってこれらのことをしているのか、あなたがたに言おう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「一つの言葉」。ここでの「言葉」は、問い、または論じる事柄を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: しかし、イエスは彼らに答えた
  rationale: 分詞と定動詞を日本語で自然な一つの応答表現にまとめ、δὲの文脈上の軽い対照を「しかし」で示した。
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: わたしもあなたがたに…尋ねよう
  rationale: 未来形の意志的な響きと、κἀγώが示す「あなたがたが問うなら、わたしも」という相互性を保った。
- source_word: λόγον ἕνα
  choice: 一つ尋ねよう
  rationale: 直訳的な「一つの言葉」ではなく、この問答の文脈で一つの問いを提示する意味を自然な日本語で表した。名詞をそのまま置かず、動詞「尋ねる」に含ませた。
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: それに答えてくれるなら
  rationale: λέγωの基本義は「言う」だが、ここでは提示された問いへの返答を求めているため、「答える」が文脈上明確で自然である。ἐάνによる条件は「なら」で保持した。
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: わたしも…あなたがたに言おう
  rationale: 前半のκἀγώとの対応を「わたしも」で明示し、相互的な条件構造を保った。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: 行為の根拠または資格としてのἐξουσίαを、現代日本語で自然な「何の権威によって」とした。
- source_word: ταῦτα ποιῶ
  choice: これらのことをしている
  rationale: ταῦταの複数的・包括的な指示を「これらのこと」で保ち、現在形は争点となっている継続的な活動を自然に示す「している」とした。
