  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: ja
  text: 「ところで、あなたがたはどう思いますか。ある人に二人の子どもがいました。その人は最初の子[a]のところへ行って言いました。『子よ、今日、ぶどう園へ行き、そこで働きなさい。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二人の息子」とも訳されますが、ギリシア語は性別を限定しない「子ども」（τέκνα）です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: ところで、あなたがたはどう思いますか
  rationale: δὲの軽い接続・転換の働きを「ところで」で示し、聞き手の判断を求めるδοκεῖの慣用表現を自然な現代日本語にした。
- source_word: ἄνθρωπος
  choice: ある人
  rationale: 物語を導入する不定の男性人物を自然に表す。「男」よりも日本語のたとえ話として滑らかで、性別を否定するものでもない。
- source_word: τέκνα δύο
  choice: 二人の子ども
  rationale: τέκναは性別を限定しない「子どもたち」であり、伝統的な「息子二人」へ狭めず、原語の広さを保った。日本語では人数を「二人」で示した。
- source_word: προσελθὼν τῷ πρώτῳ
  choice: 最初の子のところへ行って
  rationale: 近づく動作と後続の発話を自然な順序で表した。τῷ πρώτῳは文脈上、二人のうち最初の子を指す。
- source_word: Τέκνον
  choice: 子よ
  rationale: τέκνονの性別を限定しない呼びかけを保持しつつ、たとえ話にふさわしい簡潔で格調ある呼称とした。
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: 今日、…へ行って働きなさい
  rationale: 二つの命令「行け」「働け」を日本語として自然に連結し、σήμερονを明示した。
- source_word: ἐν τῷ ἀμπελῶνι
  choice: ぶどう園へ行って働きなさい
  rationale: 働く場所はぶどう園である。日本語では移動を表す「行って」と場所を結びつけることで、原文の命令全体を自然に表現した。
theological_decisions:
- issue: τέκνα／τέκνονを伝統的な「息子たち／息子」と訳すか
  choice: 子ども／子
  alternative: 息子／息子よ
  rationale: この節のギリシア語は性別を限定するυἱόςではなく、より広いτέκνονを用いる。たとえの登場人物を男性と理解する伝統はあるが、この節自体の語彙を不必要に狭めない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、直接話法では「子よ」「働きなさい」として聖書のたとえ話にふさわしい品位を保った。冒頭の問いは聞き手への複数形を「あなたがた」で明示した。
