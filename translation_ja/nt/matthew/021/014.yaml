base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: ja
  text: 神殿の境内で[a]、目の見えない人たちや足の不自由な人たちがイエスのもとに来た。イエスは彼らを癒やした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の「ヒエロン」は、内殿そのものに限らず、庭を含む神殿の境内を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: イエスのもとに来た
  rationale: προσέρχομαιと与格代名詞は、ある人のもとへ近づくことを表す。「イエスのもとに来た」は自然な現代日本語で、その方向性も明確に伝える。
- source_word: τυφλοὶ
  choice: 目の見えない人たち
  rationale: 実体詞的に用いられた複数形の形容詞。現代日本語として明瞭で、人を第一に表す言い方を採用した。
- source_word: χωλοὶ
  choice: 足の不自由な人たち
  rationale: 歩行に障害のある人々を指す実体詞的複数形。「足の不自由な人たち」は、意味を保ちながら現代日本語で穏当かつ理解しやすい。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内で
  rationale: ἱερόνは通常、内陣そのものではなく建物や庭を含む神殿域全体を指す。「神殿の境内」は、その空間的範囲を簡潔に示す。
- source_word: ἐθεράπευσεν
  choice: 癒やした
  rationale: 福音書の奇跡物語におけるθεραπεύωは病気や障害を治すことを表す。「癒やした」は文脈に適した自然で格調ある表現。
theological_decisions:
- issue: ἱερόνが示す癒やしの場所
  choice: 神殿の境内でイエスが彼らを癒やした
  alternative: 神殿でイエスが彼らを癒やした
  rationale: ἱερόνは通常、至聖所や聖所を含む内殿だけでなく、より広い神殿域を表す。「神殿の境内」とすることで、立ち入り場所を内殿に限定する誤解を避ける。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語としての簡潔さと聖書本文にふさわしい品位を保った。「目の見えない人たち」「足の不自由な人たち」として、原文の実体詞的形容詞を人を第一に置く表現で訳した。
