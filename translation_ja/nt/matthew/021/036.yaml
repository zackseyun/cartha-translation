  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: ja
  text: 主人は再び、最初に送ったしもべたちよりも多くのほかのしもべたち[a]を送った。そして農夫たちは、彼らにも同じことをした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奴隷たち」。ギリシア語「ドゥーロス」は、文脈により「しもべ」とも「奴隷」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: また
  rationale: 同じ行為が繰り返されたことを、自然な物語の流れで示す。
- source_word: ἀπέστειλεν
  choice: 送った
  rationale: ἀποστέλλωのアオリストを簡潔な過去の叙述として訳した。主語の「主人」は直前の文脈から補った。
- source_word: ἄλλους δούλους
  choice: 別のしもべたち
  rationale: ἄλλουςは先に送られた者たちとは別の一団を表す。δοῦλοςには「奴隷」と「しもべ」の語義があるが、このたとえでは主人から遣わされる者としての役割に重点があるため、「しもべ」を本文に採用した。
- source_word: πλείονας τῶν πρώτων
  choice: 初めよりも多くの
  rationale: 後の一団が最初の一団より人数の多いことを、簡潔で自然な日本語で示した。
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: 彼らにも同じようにした
  rationale: 前節に記された扱いを指す婉曲的な表現を保ち、具体的内容をこの節で重ねて説明しなかった。
theological_decisions:
- issue: たとえにおける δοῦλος の訳語
  choice: しもべ
  alternative: 奴隷
  rationale: 法的身分そのものより、主人に属して遣わされる者としての役割が前景化しているため、「しもべ」を採用した。ただし原語が「奴隷」をも意味することは脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、たとえ話にふさわしい端正な語調と、前節を受ける原文の簡潔さを保った。
