id: MAT.21.32
reference: Matthew 21:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: ja
  text: というのも、ヨハネは義の道を歩んであなたがたのところに来たのに、あなたがたは彼を信じなかった。しかし、徴税人や娼婦たちは彼を信じた。あなたがたはそれを見ても、その後、思い直して彼を信じることはなかった[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「彼を信じる」は、「彼を信頼する」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「思い直す」は、一般に「悔い改める」と訳されることの多い別のギリシア語ではなく、ここでは特に、後悔して考えを変えることを表す語。別訳「その後、悔い改めて彼を信じることはなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: 来たのに
  rationale: γάρは直前の文脈を説明するが、この節内ではヨハネの到来と聞き手の不信との対照が自然に伝わるよう、「来たのに」と表現した。説明上のつながりは文脈によって保たれる。
- source_word: Ἰωάννης πρὸς ὑμᾶς
  choice: ヨハネがあなたがたのところに
  rationale: πρός＋対格の方向性を保ち、現代日本語として自然な形にした。
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: 義の道をもって
  rationale: ὁδόςの「道」という比喩とδικαιοσύνηの「義」を保つ。ヨハネの生き方・務めのあり方と、彼が示した義の道の双方を排除しない表現とした。
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: 彼を信じなかった／彼を信じた
  rationale: πιστεύω＋与格は、その人の語ることを信じ、その人を信頼する意味を持つ。「彼を信じる」は両面を自然に含み、「彼に信仰を持つ」のような後代的定式化を持ち込まない。
- source_word: οἱ τελῶναι
  choice: 徴税人
  rationale: 当時、税や関税を請け負って徴収した者を指す、明確で一般的な現代日本語。
- source_word: αἱ πόρναι
  choice: 娼婦たち
  rationale: 語の社会的・道徳的な強さを保つ直接的な訳語。
- source_word: ἰδόντες
  choice: それを見ても
  rationale: 指示内容を、直前の徴税人と娼婦たちがヨハネを信じた事実として自然に補い、譲歩的な文脈を示した。
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: 後になって思い直し…とはしなかった
  rationale: μεταμέλομαιの「後悔する、考えを変える」というニュアンスを「思い直す」で示し、μετανοέωとの語彙上の違いを不必要に消さない。
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: 彼を信じようとはしなかった
  rationale: 属格不定詞が示す結果・目的の関係を自然な日本語で表し、思い直すことがヨハネを信じることへ至るはずだった点を示した。
theological_decisions:
- issue: δικαιοσύνηの訳
  choice: 義
  alternative: 正しさ／正義
  rationale: マタイにおける神の御心にかなう正しいあり方という幅を保ち、単に社会的公正へ限定しない。
- issue: πιστεύω＋αὐτῷの訳
  choice: 彼を信じる
  alternative: 彼を信頼する／彼の言葉を信じる
  rationale: 人物とその証言のどちらか一方に意味を限定せず、原文の簡潔さと緊張を保つ。
- issue: μεταμέλομαιの訳
  choice: 思い直す
  alternative: 悔い改める／後悔する
  rationale: 「悔い改める」だけで訳してμετανοέωとの区別をぼかすことを避けつつ、単なる感情的後悔よりも、信じる方向への意志の転換を文脈に即して表す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの公的な叱責にふさわしい格調を保った。「あなたがた」を反復して原文の強調を示し、「徴税人や娼婦たち」として対照の社会的な鋭さも残した。
