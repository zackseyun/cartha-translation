  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: ja
  text: 実りの時期が近づくと、主人は自分の収穫物を受け取るために、召使いたち[a]を小作人たち[b]のもとへ遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷たち」とも訳せる。ギリシア語の「ドゥーロス」は、奴隷または主人に仕える者を指す。ここでは、主人の代理として遣わされる役割に焦点を置いて「召使いたち」とした。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「耕す者たち」または「農夫たち」。このたとえでは、他人のぶどう園を借りて耕している者たちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 〜と
  rationale: 時間を示すὅτεを自然な日本語の接続表現で訳した。δέは軽い場面転換であり、ここでは明示しなくても文脈上の移行が保たれる。
- source_word: ἤγγισεν
  choice: 近づくと
  rationale: ἐγγίζωの「近づく」という意味を保ち、後続する主節との時間関係を自然に表した。
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: 実りの時期
  rationale: καιρόςは適切な時・時期を表し、農業の文脈では「時期」が自然である。καρποίの果実・収穫という具体性を「実り」で伝えた。
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: 単なる移動ではなく、主人が代理者を任務のために送る場面なので、自然で品位のある「遣わした」とした。
- source_word: τοὺς δούλους αὐτοῦ
  choice: 僕たち
  rationale: δοῦλοςには「奴隷」と「僕・召使い」の意味領域がある。この場面では主人の代理として派遣される役割が前面に出るため「僕」とし、身分上の含意は脚注に残した。
- source_word: πρὸς τοὺς γεωργοὺς
  choice: 小作人たちのもとへ
  rationale: γεωργός自体は耕作者・農夫を指すが、直前の文脈では他人のぶどう園を借りて耕す者たちであるため、「小作人」が役割を明確かつ簡潔に表す。
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: 自分の収穫物を受け取るために
  rationale: λαβεῖνの基本義「受け取る」を保ちつつ、καρποίがここではぶどう園から得られる収穫物を指すことを自然な日本語で表した。αὐτοῦは「自分の」として明示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、たとえ話にふさわしい落ち着いた語調と「遣わした」の品位を保った。「僕」は「しもべ」と読み、日常語だけでは失われやすいδοῦλοςの奉仕者としての響きを残している。
