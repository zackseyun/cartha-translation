  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: ja
  text: また、祈りの中で、信じて[a]求めるものは何でも、あなたがたは受けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信頼しながら」。ギリシア語の分詞は、祈り求める際に信じていることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: ものは何でも
  rationale: πᾶςとὅσοςの組み合わせが表す包括的で開かれた範囲を、自然な日本語で示す。
- source_word: ἂν αἰτήσητε
  choice: 求める
  rationale: ἄνを伴うアオリスト接続法は不定関係節の一部であり、「ものは何でも」と組み合わせることで、日本語として自然に不特定性を表せる。
- source_word: ἐν τῇ προσευχῇ
  choice: 祈りの中で
  rationale: 名詞προσευχήを保ちつつ、祈りという営みの中で求めることを明確に表す。
- source_word: πιστεύοντες
  choice: 信じて
  rationale: 現在分詞が、求めることと同時に伴う姿勢を示すため、明示的な条件節に変えず「信じて」と訳す。
- source_word: λήμψεσθε
  choice: 受けます
  rationale: λαμβάνωの未来形を、約束の意味と本文の品位を保つ自然な現代日本語で表す。
theological_decisions:
- issue: 信仰と祈りが聞かれることとの関係
  choice: 「信じて」と分詞的なつながりを保つ
  alternative: 「信じるなら」または「信じることを条件として」
  rationale: ギリシア語は明示的な条件節ではなく現在分詞を用いている。祈りと信仰の密接な結びつきを示しながら、その仕組みや範囲について本文以上に条件を明文化せず、神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「あなたがた」を明示して複数の聞き手を表し、「ものは何でも」によって原文の包括的表現を自然に伝えた。
