  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: ja
  text: しかし、「人からのものだ」[a]と言えば、群衆を恐れる。群衆は皆、ヨハネを預言者とみなしているからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「人に由来する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: しかし、…と言えば
  rationale: ἐάν＋接続法が示す条件的な可能性を、自然な現代日本語の「と言えば」で表した。δέによる対比は「しかし」で明示した。
- source_word: Ἐξ ἀνθρώπων
  choice: 「人からだ」
  rationale: 直前の「天から」との出所の対比を簡潔に保った。ἀνθρώπωνは男性だけでなく、人間に由来することを指す。
- source_word: φοβούμεθα τὸν ὄχλον
  choice: 群衆が怖い
  rationale: φοβέομαι＋対格の直接的な恐れを、明快で自然な日本語にした。
- source_word: πάντες
  choice: 皆が
  rationale: 群衆全体について述べる複数の意味を簡潔に表した。
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: ヨハネを預言者だと認めている
  rationale: ἔχω＋目的語＋ὡς＋補語が示す「ある者を…と見なす」という評価を、自然な日本語で表した。「認めている」は、群衆がヨハネを真の預言者として受け止めていたという文脈上の力を保つ。
- source_word: προφήτην
  choice: 預言者
  rationale: 神からの言葉を語る者を指す標準的な聖書用語を用いた。
- source_word: Ἰωάννην
  choice: ヨハネ
  rationale: 日本語聖書で定着した人名表記を用いた。
theological_decisions:
- issue: 「天から」と「人から」の起源の対比
  choice: 「人からだ」
  alternative: 「人に由来する」
  rationale: 神的起源と人間的起源との鋭い対比を保ちつつ、ἀνθρώπωνを男性限定の意味には解さない。
- issue: 群衆によるヨハネの評価
  choice: 皆がヨハネを預言者だと認めている
  alternative: 皆がヨハネを預言者と見なしている
  rationale: 本文が報告する群衆の確信をそのまま表し、それ以上の神学的判断は加えない。
translation_notes:
  register: 明快な現代標準日本語。宗教指導者たちの切迫した内心の協議として自然に読めるよう簡潔にしつつ、「天から／人から」という原文の対比を保持した。
