  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: ja
  text: ところが、息子は「行きたくありません」と答えた。しかし、後になって思い直し[a]、出かけて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「後悔して」または「気を変えて」とも訳せる。このギリシア語には、後悔した結果、行動を変えるという意味合いが含まれることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 答えた
  rationale: 物語で頻出する応答の分詞表現。日本語では後続の εἶπεν と合わせて「答えた」とするのが自然で、意味も保たれる。
- source_word: Οὐ θέλω
  choice: 行きたくありません
  rationale: θέλω は意志や願望を表す。直前のぶどう園へ行くようにとの命令を補い、息子の直接的な拒否を現代日本語で自然に表した。
- source_word: ὕστερον
  choice: 後になって
  rationale: 先の拒否から時間が経過した後の行動であることを、簡潔で自然な時間表現として示す。
- source_word: μεταμεληθεὶς
  choice: 思い直し
  rationale: 後悔を伴いうる心の変化と、それによる行動の転換を表す。「悔い改め」として神学的意味を限定せず、原語の幅を保つ。
- source_word: ἀπῆλθεν
  choice: 出かけて行った
  rationale: 単にその場を去ったのではなく、頼まれた仕事をするために向かったという文脈上の動きを、自然な日本語で表す。
theological_decisions:
- issue: たとえの中の μεταμεληθεὶς の意味
  choice: 思い直し
  alternative: 後悔して／悔い改めて
  rationale: この箇所の中心は、拒否から従う行動への転換にある。「悔い改めて」では専門的・神学的意味を強く読み込みかねない一方、「思い直し」は後悔の含みを排除せず、原文の意味の幅とたとえの緊張を保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、たとえ話にふさわしい簡潔で落ち着いた語調を用いた。直接話法の敬体は父への返答として自然であり、過度に古風な表現や教派的な用語を避けた。
