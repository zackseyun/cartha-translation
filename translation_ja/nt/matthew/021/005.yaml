revisions:
- from: 「シオンの娘に告げなさい。『見よ、あなたの王があなたのところに来る。柔和で[a]、ろばに乗り、荷を負う獣の子である子ろばに乗って[b]。』」
  to: 「シオンの娘に告げなさい。『見よ、あなたの王があなたのところに来る。柔和で[a]、ろばに、そして荷役獣の子である子ろばに乗って。』」
  rationale: 乗ることを表す語を一度だけ訳し、原文の一つの分詞に二つの動物句が連なる構文を反映した。これにより、マタイ本文の反復的・連結的表現を保ちながら、二頭に別々に乗るという不必要な叙述を避けた。脚注bも、二頭の動物の実際の扱いを断定せず、「二つの動物表現」として本文の語法を説明するよう整えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:16Z'
review_pass:
  verdict: revise
  source_fidelity: 主な内容と預言的な擬人化は適切に保たれている。しかし、原文には乗ることを表す分詞が一つだけであり、現行の「ろばに乗り、…子ろばに乗って」は、王が二頭それぞれに乗るという動作を日本語として明示してしまう。二つの前置詞句を一つの「乗って」に係らせる必要がある。
  naturalness: 「シオンの娘」「見よ」「柔和」は、預言引用として理解可能で、現代標準日本語の範囲にある。動物表現は「荷役獣」を用いるとやや明瞭になる。
  terminology: 「シオン」「王」「柔和」「ろば」は適切である。「子ろば」は文脈上許容され、原文の「子／若い動物」と荷役獣の表現の重なりも「荷役獣の子である子ろば」によっておおむね保持できる。
  issues:
  - severity: medium
    issue: 「ろばに乗り、…子ろばに乗って」が二度の乗馬動作を表す。
    rationale: ἐπιβεβηκὼς（乗っている／乗った状態で）は一つであり、ἐπὶ ὄνον καὶ ἐπὶ πῶλον はその分詞に連なる。日本語では「ろばに、そして…子ろばに乗って」として、原文の連結された表現を保ちつつ、二つの独立した乗馬動作を付加しないようにする。
  revised_text: 「シオンの娘に告げなさい。『見よ、あなたの王があなたのところに来る。柔和で[a]、ろばに、そして荷役獣の子である子ろばに乗って。』」
