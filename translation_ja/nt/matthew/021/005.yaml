source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: ja
  text: 「シオンの娘に告げなさい。『見よ、あなたの王があなたのところに来る。柔和で[a]、ろばに、そして荷役獣の子である子ろばに乗って。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「へりくだっていて」。ギリシア語は「柔和な」「穏やかな」「へりくだった」という意味を表し得る。ゼカリヤ9章9節を踏まえた表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπατε
  choice: 告げなさい
  rationale: アオリスト命令法複数の指示としての力を保ちつつ、預言の引用を導く dignified で自然な現代日本語とした。
- source_word: τῇ θυγατρὶ Σιών
  choice: シオンの娘に
  rationale: シオンを女性として擬人化する預言的表現を、「シオンの民」などに平板化せず保持した。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を喚起する機能を簡潔に表す。現代でも聖書的・宣言的文脈では理解しやすく、引用の荘重さにも合う。
- source_word: ὁ βασιλεύς σου
  choice: あなたの王
  rationale: 二人称単数の所有関係と王としての意味をそのまま保持した。
- source_word: ἔρχεταί σοι
  choice: あなたのところに来る
  rationale: σοι の受益・方向性を自然な日本語で示し、現在形の生き生きとした到来の描写を保った。
- source_word: πραῢς
  choice: 柔和で
  rationale: 穏やかさ、へりくだり、非威圧的な性質を含む語。日本語の聖書的語彙として理解可能で、単に性格が「優しい」とするより意味幅を保ちやすい。
- source_word: ἐπιβεβηκὼς
  choice: 乗り
  rationale: 完了分詞が表す「乗った状態で」を、日本語の連用表現で自然に示した。
- source_word: ἐπὶ ὄνον
  choice: ろばに
  rationale: ὄνος の通常の意味を明瞭な現代日本語で表した。
- source_word: πῶλον
  choice: 子ろば
  rationale: 若い動物を指す πῶλος を、文脈上の種が明らかな自然な日本語で表した。
- source_word: υἱὸν ὑποζυγίου
  choice: 荷を負う獣の子である
  rationale: 「軛を負う動物／荷役獣の子」というセム語的表現を、意味を狭めすぎず理解できる日本語にした。
theological_decisions:
- issue: ゼカリヤ9章9節の成就引用を旧約側の表現に調和させるか
  choice: マタイのギリシア語本文にある「柔和」と二つの連結された動物表現を保持する。
  alternative: 「へりくだっている」と訳してゼカリヤ書との対応を前面に出す、または二つの動物表現を一つにまとめる。
  rationale: 成就引用のメシア的含意を保ちながら、旧約本文や特定の解釈へ暗黙に調和させず、マタイが記した語形と構文上の緊張を訳文に残す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、預言の引用にふさわしい荘重さを「告げなさい」「見よ」「柔和」で保った。「シオンの娘」は説明的に言い換えず、原文の擬人化を維持した。
