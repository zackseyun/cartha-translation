  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ja
  text: 彼らはイエスに答えて、「知りません」と言った。するとイエスも彼らに言われた。「わたしも、わたしがどのような権威によってこれらのことを行っているのかを、あなたがたには言いません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: 答えて
  rationale: 応答を導く分詞を、現代日本語で自然な連用形として表した。
- source_word: Οὐκ οἴδαμεν
  choice: 分かりません
  rationale: 知識がないとの返答を、対話として自然でありながら丁寧な現代日本語で表した。
- source_word: ἔφη
  choice: 言われた
  rationale: 一般的な発話動詞として簡潔に訳し、イエスに対する日本語聖書文体上の敬意を保った。
- source_word: καὶ αὐτός / Οὐδὲ ἐγώ
  choice: イエスも／わたしも
  rationale: 相手が答えなかったことに対応して、イエスも告げないという相互対応の力を「も」で保持した。
- source_word: λέγω ὑμῖν
  choice: あなたがたには言いません
  rationale: 情報を明かさないという文脈に即し、「言う」を用いて現在形の拒否を自然に表した。助詞「は」により拒否の対象を明確にした。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: 行為の正当な根拠または授権を問う表現として、日本語で明瞭な形にした。
- source_word: ταῦτα ποιῶ
  choice: これらのことをしている
  rationale: 複数指示詞を保持し、目前の一回の行為だけでなく、問題とされている一連の行為を指す現在形の含みを表した。
theological_decisions:
- issue: ἐξουσίαの意味
  choice: 権威
  alternative: 権利／力
  rationale: この論争では、イエスの行為の能力そのものより、その正当性と権威の源が問われている。「権威」は司法的・神学的な含みを保ちつつ、特定の解釈に狭めない。
- issue: イエスの返答における現在形λέγω
  choice: 言いません
  alternative: 言わないでしょう／教えません
  rationale: ギリシア語の現在形と直接的な拒否を保持した。「教えません」は情報開示の意味を明確にする一方、原語の一般的な発話動詞より限定的になるため採らなかった。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、対話には丁寧さと聖書本文としての品位を持たせた。「彼らはイエスに答えて……と言った」は原文の分詞構造を無理なく反映し、イエスの返答では「も」を反復して応答の対称性を示した。
