  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: ja
  text: そこで、弟子たちは行って、イエスが彼らに指示したとおりにした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「命じた」。ギリシア語の動詞は、命令することにも指示を与えることにも用いられる。ここでは文脈により「指示した」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: 出かけて行き
  rationale: アオリスト分詞で、主動作に先立つ移動を表す。日本語の自然な物語文として順次動作を明確にした。
- source_word: δὲ
  choice: そこで
  rationale: 物語の継続と、直前の指示を受けた応答の流れを表す。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 福音書における μαθηταί の標準的で自然な訳語。主題を示す「は」を用いた。
- source_word: καὶ ποιήσαντες
  choice: そして…した
  rationale: 先行する分詞と連続する行為を日本語で自然に表した。本文では「出かけて行き、…した」と簡潔につないだ。
- source_word: καθὼς
  choice: とおりに
  rationale: イエスの指示と弟子たちの行動との一致を過不足なく表す。
- source_word: συνέταξεν
  choice: 指示された
  rationale: 文脈上、具体的な行動を言いつける意味。「命じられた」も可能だが、直前の詳しい指図に即して「指示された」を採用した。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 指示を受けた弟子たちを明示する間接目的語として訳出した。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 固有名詞の主語として現代日本語の通常の形で訳した。
