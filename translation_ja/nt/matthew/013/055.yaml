id: MAT.13.55
reference: Matthew 13:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: ja
  text: この人は大工の息子ではないか。母親はマリアと呼ばれ、その兄弟たち[a]はヤコブ、ヨセフ[b]、シモン、ユダではないか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は「親族たち」または「近親者たち」とも理解できる。ギリシア語は通常「兄弟たち」を意味するが、この箇所ではより広い意味に取る見方もある。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては「ヨセフ」ではなく「ヨセ」とある。
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: 大工
  rationale: 木工だけでなく建築にも携わる職人を指し得るが、この箇所では伝統的で一般読者にも明快な「大工」が自然である。
- source_word: υἱός
  choice: 息子
  rationale: 直近の家族関係を述べる文脈であり、通常の親子関係を表す「息子」が明確である。
- source_word: λέγεται
  choice: 呼ばれ
  rationale: 受動形の「～と呼ばれている」を自然な日本語にした。名前については「という」も可能だが、原文の形を比較的よく保つ。
- source_word: Μαριὰμ
  choice: マリア
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: ἀδελφοὶ
  choice: 兄弟たち
  rationale: 通常の語義を本文に採り、具体的な血縁関係をめぐる後代の教理的論争を本文で決着させない。広い親族的意味の可能性は脚注に示す。
- source_word: Ἰάκωβος
  choice: ヤコブ
  rationale: ギリシア語名に対応する、日本語聖書で一般的な表記である。
- source_word: Ἰωσὴφ
  choice: ヨセフ
  rationale: SBLGNT本文の読みを反映した標準的な日本語表記である。異読は脚注に示す。
- source_word: Σίμων
  choice: シモン
  rationale: 日本語聖書で一般的な音写を用いた。
- source_word: Ἰούδας
  choice: ユダ
  rationale: 日本語聖書で一般的な音写を用い、文脈にない人物同定は加えない。
- source_word: οὐχ ... ;
  choice: ～ではないか
  rationale: 肯定の答えを予期する修辞疑問を、自然かつ格調を保った現代日本語で表した。
theological_decisions:
- issue: ἀδελφοὶ αὐτοῦが表すイエスとの家族関係
  choice: 本文では「兄弟たち」と訳す
  alternative: 「親族たち」「近親者たち」と広く解する
  rationale: ἀδελφοίの通常の表面上の意味を保ちつつ、彼らが実の兄弟か、より広い親族かという神学的・歴史的論争を訳文で解決しない。広義の可能性は脚注で明示する。
- issue: Ἰωσὴφの本文異読
  choice: SBLGNTに従い「ヨセフ」とする
  alternative: 「ヨセ」（Ἰωσῆς）
  rationale: 指定された原語本文を優先し、写本上の異読を脚注に保存する。
translation_notes:
  register: 明快な現代標準日本語を用い、二つの修辞疑問を保った。「この人」は話し手たちの距離を感じさせるοὗτοςを自然に表す。脚注記号は関連語の直後に置き、兄弟の語義注[a]は節末に配置した。
