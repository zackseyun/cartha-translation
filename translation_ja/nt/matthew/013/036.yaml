  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: ja
  text: それから、イエスは群衆を後にして家に入った。弟子たちがイエスのところに来て言った。「畑の雑草[a]のたとえを、私たちに説明してください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「畑の毒麦」とも訳せる。ギリシャ語は、小麦によく似た雑草、特にドクムギを指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: それから
  rationale: 直前の出来事に続く場面の展開を示す時間的な談話標識として、現代日本語で自然に表した。
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: 群衆を後にして
  rationale: ἀφίημιの分詞が示す、群衆のいる場を離れて次の行動へ移る関係を簡潔に表した。ὄχλοιは複数形だが、日本語では集合的な「群衆」が自然である。
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: イエスは家に入った
  rationale: 移動主体は文脈上イエスであり、日本語では明示したほうが明瞭である。εἰςが示す内部への移動を「入った」で自然に表した。定冠詞は付くが、日本語では単に「家」が自然である。
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちが近寄って来て
  rationale: προσέρχομαιの接近の意味を「近寄って来て」で表し、αὐτοῦは直前にイエスを明示した文脈から日本語では重複を避けた。
- source_word: λέγοντες
  choice: 言った
  rationale: ギリシャ語の分詞を、日本語の自然な引用導入として定動詞で表した。
- source_word: Διασάφησον ἡμῖν
  choice: 私たちに説明してください
  rationale: διασαφέωは明瞭に説き明かすことを求める語であり、弟子たちからイエスへの依頼として丁寧な命令表現を用いた。
- source_word: τὴν παραβολὴν
  choice: たとえ
  rationale: 福音書におけるπαραβολήの定着した自然な日本語表現を採用した。
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: 畑の毒麦
  rationale: ζιζάνιαは小麦に似た有害な雑草、おそらくドクムギを指す。「毒麦」は聖書日本語で認知されつつ意味も推測しやすいが、植物学的な特定には不確かさがあるため脚注を付した。属格の連鎖は自然な日本語の「畑の毒麦」とした。
