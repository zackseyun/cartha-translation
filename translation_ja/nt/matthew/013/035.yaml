id: MAT.13.35
reference: Matthew 13:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: ja
  text: 'これは、預言者を通して語られたことが成就するためであった。こう言われた。


    「私は、たとえをもって口を開き、

    基が据えられた時から隠されてきたことを語り出す。[a]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「世界の基が据えられた時から」とする写本もある。
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: 実現するためであった
  rationale: 目的と結果の含みを保ちつつ、マタイの成就定型句を明瞭で自然な現代日本語にした。
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: 預言者を通して語られたこと
  rationale: διά＋属格が示す媒介を「通して」で表し、預言者が言葉の媒介者であることを保持した。
- source_word: λέγοντος
  choice: 預言者はこう言っている
  rationale: 引用を導入する分詞を独立した文にし、その主語が預言者であることを日本語で明確にした。
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: 私は、たとえをもって口を開き
  rationale: 詩的な身体表現を残しながら、ἐν παραβολαῖςを自然な「たとえをもって」とした。
- source_word: ἐρεύξομαι
  choice: 語り出そう
  rationale: 内にあるものを外へ発する語感を保ちつつ、「吐き出す」ほど粗野にならない詩的で自然な表現を選んだ。
- source_word: κεκρυμμένα
  choice: 隠されていたこと
  rationale: 完了受動分詞の、隠された状態が続いていたという含みを表した。
- source_word: ἀπὸ καταβολῆς
  choice: 基が据えられた時から
  rationale: 本文に明示されていない「世界」を補わず、καταβολήの基礎を据えるという像と起点を示すἀπόを保持した。
theological_decisions:
- issue: 預言者の特定
  choice: 預言者
  alternative: アサフという預言者
  rationale: SBLGNT本文は預言者の名を記していないため、詩篇78篇の表題などから名前を補わなかった。
- issue: ἀπὸ καταβολῆςで暗示される対象
  choice: 基が据えられた時から
  alternative: 世界の基が据えられた時から
  rationale: 本文にはκόσμου（世界の）がないため、何の基かという省略を本文で解消しなかった。より明示的な異読は脚注に示した。
- issue: 成就句の目的・結果の関係
  choice: 実現するためであった
  alternative: こうして実現した
  rationale: ὅπως＋接続法の目的を表す形を保持しつつ、文脈上の結果の響きも排除しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分には詩篇引用にふさわしい簡潔で格調ある調子を持たせた。「基が据えられた時」はやや詩的だが、原文の省略と比喩を保持するため意図的に採用した。
