lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: しかし、日が昇ると
  rationale: 属格独立構文の時間的状況を自然な日本語で表し、δέの緩やかな対比を「しかし」で保持した。
- source_word: ἐκαυματίσθη
  choice: 焼けつき
  rationale: 熱によって植物が損なわれる受動的意味を、文脈に即した現代日本語で表した。
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ないために
  rationale: διά＋冠詞付き不定詞が示す明示的な原因を、自然な理由表現で保持した。
- source_word: ῥίζαν
  choice: 根
  rationale: ギリシア語の単数形を保ち、日本語でも植物について自然な表現とした。
- source_word: ἐξηράνθη
  choice: 枯れてしまった
  rationale: 植物の文脈における「乾く、枯れる」の意味を自然に表し、「しまった」で結果の完結性を示した。
