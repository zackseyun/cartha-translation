  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ja
  text: そして彼らを火の炉[a]に投げ込む。そこでは、彼らは泣き、歯ぎしりすることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「火の炉」。より自然には「燃える炉」。
    reason: 原文の属格表現を示しつつ、自然な日本語の代替表現を示すため。
lexical_decisions:
- source_word: βαλοῦσιν
  choice: 投げ込む
  rationale: 未来形の文脈上の動作を、日本語では終末時の叙述として自然な非過去形で表した。「投げ込む」は炉の中への強制的な投入を明確にする。
- source_word: αὐτοὺς
  choice: 彼らを
  rationale: 直前の文脈にある悪い者たちを指す男性複数対格代名詞を、そのまま複数の目的語として表した。
- source_word: κάμινον τοῦ πυρός
  choice: 火の炉
  rationale: 属格を反映した直訳的な表現で、具体的な裁きの比喩を保つ。日本語としても理解可能であり、「燃え盛る炉」などの解釈的な強調を加えない。
- source_word: ἐκεῖ
  choice: そこでは
  rationale: 場所を明示する副詞の力を自然な日本語で保持し、前述の炉を受ける。
- source_word: ἔσται
  choice: することになる
  rationale: 後続する動作名詞的内容が将来そこに生じることを、日本語として自然に表現する。
- source_word: ὁ κλαυθμὸς
  choice: 泣き叫び
  rationale: 単なる静かな涙よりも、裁きの場面における声を伴う嘆きを表す語として選んだ。「泣く」だけより原語の名詞が示す悲嘆の強さを伝える。
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: 歯ぎしり
  rationale: 歯をきしらせる行為を指す定着した日本語表現で、マタイに反復される句の簡潔さと裁きの含意を保つ。
theological_decisions:
- issue: 終末的裁きの比喩表現
  choice: 「火の炉」「泣き叫び、歯ぎしりする」という具体的な像を保持する
  alternative: 「激しい苦しみに遭う」などと抽象的に言い換える
  rationale: 本文が示す厳しい裁きの像を弱めたり、その性質を説明的に限定したりせず、比喩と神学的緊張をそのまま伝える。
- issue: 冠詞付き名詞句「泣き」と「歯ぎしり」の表現
  choice: 日本語では動作として「泣き叫び、歯ぎしりすることになる」とする
  alternative: 名詞句を形式的に保って「泣きと歯ぎしりがある」とする
  rationale: 原文の並列を保ちながら、現代日本語として不自然な存在文を避ける。誰がその動作をするかは文脈上明らかであるため、解釈的な主語を補わない。
translation_notes:
  register: 明快な現代標準日本語。裁きの場面にふさわしい厳粛さを保ち、過度に古風な「投げ入れられるであろう」等は避けた。
