id: MAT.13.13
reference: Matthew 13:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: ja
  text: このために、わたしは彼らにたとえを用いて話す。彼らは見ていても見ず、聞いていても聞かず、理解もしないからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 直前の文脈を受けて理由を示す表現。推論を過度に強めず、現代日本語として自然に因果関係を伝える。
- source_word: ἐν παραβολαῖς
  choice: たとえで
  rationale: ἐν＋与格が示す話し方・手段を、簡潔で自然な日本語で表した。
- source_word: αὐτοῖς λαλῶ
  choice: わたしは彼らに…話す
  rationale: 与格の聞き手と現在形の発話を直接に保った。
- source_word: ὅτι
  choice: …からである
  rationale: ここでは内容ではなく、たとえで話す理由を導く因果用法と判断した。
- source_word: βλέποντες οὐ βλέπουσιν
  choice: 見ていても見ず
  rationale: 分詞と定動詞の逆説的な対照を自然な日本語で示しつつ、何を見抜けないのかを補足しなかった。
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: 聞いていても聞かず
  rationale: 前句との修辞的並行を保ち、外面的な聴取と実質的な聴取の緊張を残した。
- source_word: οὐδὲ συνίουσιν
  choice: 理解もしない
  rationale: 否定の連続と結びの強調を「も」で表し、συνίημιを意味の把握として平明に訳した。
theological_decisions:
- issue: βλέποντες と ἀκούοντες の分詞の働き
  choice: 「見ていても」「聞いていても」と譲歩的に訳す
  alternative: 「見ながら見ず、聞きながら聞かず」と形式的に訳す
  rationale: ギリシア語の分詞自体は明示的な譲歩接続詞を持たないが、同じ動詞を肯定・否定で反復する逆説は日本語では譲歩形が自然に伝える。身体的知覚と真の認識との緊張は保ち、霊的状態について説明を加えない。
- issue: συνίουσιν の意味
  choice: 「理解する」
  alternative: 「悟る」「分かる」
  rationale: 見聞きしたものの意味を把握することを広く表し、「悟る」が帯びうる宗教的・瞬間的含意を不必要に加えない。
- issue: たとえで話すことと聞き手の無理解との因果関係
  choice: ὅτιを理由として「…からである」と訳す
  alternative: ὅτιを内容提示の「すなわち」と取る
  rationale: 構文上の因果関係を明確にしつつ、その理由が単なる説明か裁きの作用かという、本文だけでは展開されない神学的問いを訳文で決着させない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの説明としての落ち着いた品位を保った。「彼ら」は文脈上の聞き手を指すため具体化せず、「見えない」「聞こえない」と能力の欠如にも言い換えず、原文の能動形と逆説を維持した。
