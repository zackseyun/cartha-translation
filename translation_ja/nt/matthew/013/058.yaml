  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: ja
  text: そしてイエスは、彼らの不信仰のために、そこでは力あるわざ[a]をあまり行わなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「多くの奇跡」または「多くの力のわざ」とも訳せる。ギリシア語は「力」を表す語で、この文脈では力ある、すなわち奇跡的なわざを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: そしてイエスは……あまり行わなかった
  rationale: καίを物語の継続を示す「そして」とし、οὐκとアオリストἐποίησενを行為の不実行として訳した。日本語では主語を明確にするため文脈上の「イエス」を補った。「多くは行わなかった」より「あまり行わなかった」が自然であり、全く行わなかったという意味にはしない。
- source_word: ἐκεῖ
  choice: そこでは
  rationale: 故郷という直前の場所を指す単純な場所の副詞。「では」により、その場所における行為を自然に示した。
- source_word: δυνάμεις πολλὰς
  choice: 力あるわざをあまり
  rationale: δύναμιςはここでは力の現れである奇跡的行為を指す。「力あるわざ」は「奇跡」と断定的に平板化せず、語の力とのつながりを保つ。πολλάςは否定辞とともに日本語として自然な「あまり……なかった」で表した。
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: 彼らの不信仰のために
  rationale: 対格を伴うδιάは原因を示す。ἀπιστίαの否定的な強さを保つため「信仰の乏しさ」ではなく「不信仰」とした。
theological_decisions:
- issue: 不信仰のためにイエスが奇跡を行えなかったのか、行わなかったのか
  choice: 「あまり行わなかった」とし、行為の不実行として訳す。
  alternative: 「あまり行うことができなかった」
  rationale: 本文はοὐκ ἐποίησεν（行わなかった）であり、能力の欠如を表す動詞は用いていない。マタイの表現を越えて不能を読み込まず、神学的緊張を残す。
translation_notes:
  register: 明瞭で現代的ながら品位のある文体。「力あるわざ」は聖書的な荘重さを保ちつつ意味を理解できる表現。脚注マーカーは該当文末に置いた。
