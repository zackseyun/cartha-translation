  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: ja
  text: イエスはこれらのたとえを語り終えると、そこを立ち去った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: 〜すると
  rationale: 逐語的には「そして、〜した時に起こった」だが、ここでは物語を次へ進める定型的な時間表現。現代日本語では「〜すると」が時間的なつながりと叙述の流れを自然に表す。
- source_word: ἐτέλεσεν
  choice: 語り終える
  rationale: τελέωは「終える、完了する」の意。目的語が「たとえ」であり、直前までイエスがたとえを語っていた文脈を踏まえ、「語り終える」と自然に明示した。
- source_word: τὰς παραβολὰς ταύτας
  choice: これらのたとえ
  rationale: παραβολήは共観福音書の教えの文脈で「たとえ」が定着している。ταύταςは直前の一連のたとえを指すため「これらの」とした。
- source_word: μετῆρεν
  choice: 立ち去った
  rationale: μεταίρωは、ある場所から別の場所へ移ることを表す。行き先や移動方法を補わず、その場を離れたことを自然かつ格調を保って示す。
- source_word: ἐκεῖθεν
  choice: そこを
  rationale: 「そこから」の意。日本語では「そこを立ち去った」が自然であり、起点の意味も十分に保持する。
