id: MAT.13.22
reference: Matthew 13:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: ja
  text: 茨の中に蒔かれたものとは、ことばを聞く人のことである。そして、この時代の思い煩い[a]と富の欺き[b]が、ことばが実を結ぶのを妨げ、その人は実を結ばなくなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この世の思い煩い」とも訳せる。ギリシア語は直訳すると「この時代の思い煩い」。
    reason: αἰών の意味範囲と、日本語で一般的な別訳を示すため。
  - marker: b
    text: 別訳「富の惑わし」「富の欺瞞」。
    reason: ἀπάτη は「欺き」「惑わし」「欺瞞」を表し、富が人を誤らせる性質をいうため。
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: 茨の中に蒔かれたもの
  rationale: 受動分詞の種蒔きの比喩を保ちつつ、続く説明でそれが「ことばを聞く人」を指すことを明示した。日本語では「茨の中へ」より「茨の中に」が自然である。
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ことばを聞く人
  rationale: 現在分詞を自然な関係節相当の表現にした。λόγος は文脈上、宣べ伝えられた知らせを指すが、解釈を狭めすぎないよう「ことば」とした。
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: この時代の思い煩い
  rationale: μέριμνα の否定的な心配・懸念の意味を「思い煩い」で表し、αἰών の時間的・道徳的含みを保つため「この世」ではなく「この時代」とした。
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: 富の惑わし
  rationale: 富そのものの欺瞞的な力を自然な日本語で表した。「欺き」も可能だが、「惑わし」は人を誤った方向へ導く含みを明瞭に伝える。
- source_word: συμπνίγει
  choice: ふさぎ
  rationale: 茨が植物の成長を圧迫して窒息させる農耕比喩を簡潔に保った。「締め殺す」ほど過度に字義的にせず、ことばの働きが妨げられる意味も伝わる。
- source_word: ἄκαρπος γίνεται
  choice: その人は実を結ばなくなる
  rationale: 直訳的な「実のない者になる」より自然で、結実の比喩を保持する。先行する「聞く人」を受けて「その人」とし、ことば自体が実を結ばないという誤解を避けた。
theological_decisions:
- issue: αἰών の訳し方
  choice: この時代
  alternative: この世
  rationale: αἰών は第一に時代・世代を表し、新約に見られる現在の時代という含みを保つ。「この世」も文脈上可能なので脚注に示した。
- issue: 結実しない主体
  choice: その人は実を結ばなくなる
  alternative: それは実を結ばなくなる／ことばが実を結ばなくなる
  rationale: 説明の中心は「ことばを聞く人」であり、男性単数の表現もその人を受ける。ことばそのものに本質的な失敗があると読み込ませない訳とした。
- issue: λόγος の神学的限定
  choice: ことば
  alternative: みことば／教え
  rationale: 原文は λόγος とだけ述べるため、敬称的な「みことば」や内容を限定する「教え」を本文に持ち込まず、文脈に開かれた表現を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔で格調を失わない説明文とした。「だが」で対照を示し、農耕比喩の「蒔く」「ふさぐ」「実を結ぶ」を一貫して保持した。
