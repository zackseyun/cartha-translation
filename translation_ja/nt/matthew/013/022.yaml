revisions:
- from: 茨の中に蒔かれたものとは、ことばを聞く人のことである。だが、この時代の思い煩い[a]と富の惑わし[b]がことばをふさぎ、その人は実を結ばなくなる。
  to: 茨の中に蒔かれたものとは、ことばを聞く人のことである。そして、この時代の思い煩い[a]と富の欺き[b]が、ことばが実を結ぶのを妨げ、その人は実を結ばなくなる。
  rationale: 原文の比喩的因果関係、すなわち思い煩いと富の欺きが「ことば」を圧迫し、その結果として聞く人が結実しないという流れを、自然な現代日本語で明示した。「ことばが実を結ぶのを妨げ」は、συμπνίγειの圧迫して結実を阻む含みを保ち、ことば自体が不自然に「ふさがれる」という表現を避ける。
