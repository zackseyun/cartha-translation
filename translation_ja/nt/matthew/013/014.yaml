id: MAT.13.14
reference: Matthew 13:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: ja
  text: 'そして彼らについて、イザヤの預言が成就している[a]。こう言われている。


    「あなたがたは、聞いては聞くが、決して理解しない。


    見ては見るが、決して悟らない。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「聞くことによって、あなたがたは聞く……また、見ながら、あなたがたは見る」。ギリシア語を通して引用された、ヘブライ語的な反復による強調表現。
    reason: 原文の反復構文とその強調の働きを示すため。
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: 成就している
  rationale: 現在受動形の意味を自然な現代日本語で表し、この人々において預言が現に実現していることを示す。「完全に成就する」と意味を強めすぎない。
- source_word: αὐτοῖς
  choice: 彼らについて
  rationale: 与格が示す、この人々の場合に預言が当てはまって実現するという関係を、日本語として明瞭に表す。「彼らのうちに」も可能だが、場所的に響きやすい。
- source_word: ἡ προφητεία Ἠσαΐου ἡ λέγουσα
  choice: イザヤの預言が……こう言われている
  rationale: 預言の内容として引用を導く分詞 λέγουσα の働きを、自然で格調ある日本語に組み替えた。
- source_word: Ἀκοῇ ἀκούσετε
  choice: あなたがたは確かに聞く
  rationale: 同根語を重ねたセム語的強調を「確かに」で伝える。直訳的な構造は脚注に残す。
- source_word: οὐ μὴ συνῆτε
  choice: 決して理解しない
  rationale: οὐ μή の強い否定を「決して」で表し、συνίημι を知的な理解として訳す。
- source_word: βλέποντες βλέψετε
  choice: 確かに見る
  rationale: 分詞と定動詞による反復的強調を、前半と対応する簡潔な日本語で表す。
- source_word: οὐ μὴ ἴδητε
  choice: 決して悟らない
  rationale: 強い否定を保ちつつ、先行する βλέπω の視覚的な「見る」と区別し、ὁράω が文脈上含む認知・洞察の意味を「悟る」で示す。
theological_decisions:
- issue: 預言の成就と人々の反応との関係
  choice: イザヤの預言がこの人々について現に成就していると述べる
  alternative: 単に彼らの状況が預言の一例である、または預言がここで余すところなく完結したとする
  rationale: ἀναπληροῦται の成就表現を保ちながら、心の頑なさ、予定、責任などの仕組みを本文以上に説明せず、神学的な緊張を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分には簡潔で格調ある並行表現を採用した。「成就している」は現在形の動的な含みを保つ。
