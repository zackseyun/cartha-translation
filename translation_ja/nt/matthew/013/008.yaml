  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: ja
  text: しかし、別の種は良い土に落ち、実を結んだ。あるものは百倍、あるものは六十倍、あるものは三十倍の実を結んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: ほかの種
  rationale: 中性複数形の形容詞が名詞的に用いられ、前の文脈の種を指す。日本語では対象を明確にするため「種」を補った。
- source_word: δὲ
  choice: しかし
  rationale: それまで実を結ばなかった種との対比を自然に示す。
- source_word: ἔπεσεν
  choice: 落ち
  rationale: 原文の「落ちた」という具体的な種まきの描写を保ち、「まかれた」と言い換えない。
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: 良い土に
  rationale: 農耕の文脈に即して γῆ を「土」、καλήν を作物の生育に適した「良い」と訳した。
- source_word: ἐδίδου καρπόν
  choice: 実を結んでいった
  rationale: 未完了過去の継続的・展開的な側面を「〜ていった」で表し、καρπός の農耕的比喩を「実」で保った。
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: あるものは百倍、あるものは六十倍、あるものは三十倍になった
  rationale: ギリシア語の配分表現を「あるものは…」の反復で示し、各数値が収穫倍率であることを「倍」で明示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位あるたとえ話の語り口とした。「実を結ぶ」という聖書で親しまれている表現を保ちつつ、未完了過去の動きを自然な日本語で示した。
