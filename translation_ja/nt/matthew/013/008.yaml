- from: しかし、ほかの種は良い土に落ち、実を結んでいった。あるものは百倍、あるものは六十倍、あるものは三十倍になった。
  to: しかし、別の種は良い土に落ち、実を結んだ。あるものは百倍、あるものは六十倍、あるものは三十倍の実を結んだ。
