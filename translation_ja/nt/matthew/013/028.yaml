  naturalness: 全体として明瞭な現代標準日本語である。「では、私たちが行って、それらを集めましょうか」は、主人の意向を尋ねる申し出として自然であり、原文の従属的な「行って」を保つ。
  terminology: δοῦλοιを「奴隷たち」とするのは、このたとえの主人への隷属的関係を曖昧にせず、教派的解釈を持ち込まない訳として適切である。「主人」は文脈上補われる指示対象として自然である。
