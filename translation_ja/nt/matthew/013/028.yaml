reference: Matthew 13:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the servants said to him, “Do you want us to go and gather them up?”
translation:
  language: ja
  text: 主人は彼らに言った。「敵がこれをしたのだ。」すると、奴隷たちは主人に言った。「では、私たちが行って、それらを集めましょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: 言った
  rationale: 物語中の発話を表す標準的で自然な訳。
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: 敵
  rationale: 直訳的には「敵である人」だが、日本語では「敵」が個人を自然に表し、意味を過不足なく伝える。
- source_word: τοῦτο ἐποίησεν
  choice: したことだ
  rationale: 指示語とアオリストの完了した行為を、簡潔で自然な日本語にした。
- source_word: δοῦλοι
  choice: 奴隷たち
  rationale: 主人に属して働く者という当時の社会的身分を明確に保つ。単なる雇い人を連想させる「使用人」より原語に近い。
- source_word: Θέλεις
  choice: ～ましょうか
  rationale: 直訳の「あなたは望みますか」ではなく、主人の意向を尋ねて行動を申し出る日本語の自然な疑問表現とした。
- source_word: οὖν
  choice: では
  rationale: 主人の説明を受けた次の提案・帰結を示す接続として自然。
- source_word: ἀπελθόντες
  choice: 行って
  rationale: 主動詞に先立つ移動を、自然な連用表現で保持する。
- source_word: συλλέξωμεν
  choice: 集めましょうか
  rationale: 雑草を抜き集める行為を表す。直後の文脈で除去の危険が説明されるため、ここでは原語どおり広い「集める」を保つ。
- source_word: αὐτά
  choice: それ
  rationale: 直前までの文脈にある毒麦を集合的に指す。日本語では無生物の複数にも通常「それ」を用いる。
theological_decisions:
- issue: たとえにおける δοῦλοι の訳
  choice: 奴隷たち
  alternative: しもべたち／使用人たち
  rationale: 原語が示す隷属的な身分関係を明示し、現代の自発的な雇用関係との混同を避ける。たとえの神学的指示対象を訳語によって先取りしない。
- issue: αὐτά が指す対象と行為
  choice: それを集める
  alternative: 毒麦を抜く／それを抜き集める
  rationale: 指示対象は文脈上の毒麦だが、この節自体の語は「抜く」ではなく「集める」であるため、後続節の語義を先取りせず原文の表現を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語。主人と奴隷の階層関係を代名詞だけに頼らず明示した。「したことだ」は簡潔で威厳ある断定、「では、行ってそれを集めましょうか」は申し出として自然な口調に整えた。
