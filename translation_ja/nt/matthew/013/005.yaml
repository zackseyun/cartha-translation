  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: ja
  text: ほかの種は、土の少ない岩地[a]に落ちた。土が深くなかったので、すぐに芽を出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「岩地（岩の多い所）」。岩盤の上を薄い土が覆っている土地を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: ほかの種は
  rationale: 中性複数形は前節の「種」を省略して受けているため、日本語では「種」を補い、対比を自然に表した。
- source_word: ἔπεσεν
  choice: 落ちた
  rationale: 原文の動詞の基本的な意味を保ち、「まかれた」と解釈的に言い換えなかった。
- source_word: ἐπὶ τὰ πετρώδη
  choice: 岩地に
  rationale: 岩盤の上を薄い土が覆う場所を指す表現として、簡潔で自然な「岩地」を選んだ。具体像は脚注で補った。
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: 土の少ない
  rationale: 直訳的な「そこには多くの土がなかった」を、日本語として自然な連体修飾にした。
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: すぐに芽を出した
  rationale: εὐθέωςの即時性と、農耕文脈におけるἐξανέτειλενの発芽の意味を明確に表した。
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: 土が深くなかったので
  rationale: διάを伴う冠詞付き不定詞の原因の意味を保ち、表土の浅さを現代日本語で自然に表現した。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準日本語を用いた。「岩地」はやや簡潔な語だが、脚注により地形の具体像を示した。原文の原因関係と発芽の速さを保ち、寓意的解釈は本文に持ち込んでいない。
