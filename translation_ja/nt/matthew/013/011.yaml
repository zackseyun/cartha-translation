id: MAT.13.11
reference: Matthew 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: ja
  text: イエスは彼らに答えた。「あなたがたには、天の国の奥義[a]を知ることが与えられています[b]。しかし、あの人たちには与えられていません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「秘密」。ここでは、以前は隠されていたが、今は明らかにされている事柄を指す。
    reason: lexical_alternative
  - marker: b
    text: 「与えられています」という受動表現では、与える方は明示されていない。神がこの知識を授けるという意味が含まれている。
    reason: theological_clarification
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えた
  rationale: 分詞と定動詞を重ねる慣用表現であり、現代日本語では簡潔に「答えた」とするのが自然で、意味も保たれる。
- source_word: Ὅτι
  choice: 直接引用の導入として訳出しない
  rationale: ここでは答えの内容を導く用法と取り、独立した「なぜなら」を置かず、日本語として自然な直接話法にした。文脈上、理由を示す含みは残る。
- source_word: ὑμῖν δέδοται
  choice: あなたがたには……与えられています
  rationale: 受け手を示す与格と完了受動の現在的な結果を保つ。授与者は原文同様に明示しない。
- source_word: γνῶναι
  choice: 知ること
  rationale: γινώσκωの基本義を保ち、「理解する」と解釈的に狭めない。
- source_word: τὰ μυστήρια
  choice: 奥義
  rationale: 神によって隠され、今や知らされる真理という含意を持つ語として、聖書文脈に定着しつつ現代語でも理解可能な「奥義」を採用した。「秘密」も可能なので脚注に示す。
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を、現代日本語で自然かつ簡潔な「天の国」とした。
- source_word: ἐκείνοις
  choice: あの人たちには
  rationale: 近称の「彼ら」ではなく、弟子たちと対照される別の集団を指す指示性を「あの人たち」で表した。
- source_word: οὐ δέδοται
  choice: 与えられていません
  rationale: 前半の完了受動との対照と並行性を保ち、授与者を補わない。
theological_decisions:
- issue: 受動形「与えられている」の授与者
  choice: 神を明示せず、受動表現を維持する
  alternative: 神があなたがたに与えてくださった
  rationale: 神が授与者であることは強く含意されるが、原文は明示していないため、神的受動の含みと神学的緊張を保つ。
- issue: μυστήρια の意味
  choice: 奥義
  alternative: 秘密／隠された真理
  rationale: 単なる不可解な謎ではなく、隠されていたが啓示によって知らされる神の国の真理を指す語として訳し、より日常的な代案を脚注に示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「奥義」は聖書語としての深みを保つ一方、脚注で意味を補った。対照を明確にするため、ὑμῖνを「あなたがた」、ἐκείνοιςを「あの人たち」と訳し分けた。
