  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: ja
  text: イエスは彼らに別のたとえを示された。こう言われた。「天の国は、ある人が取って自分の畑に蒔いた一粒のからし種のようなものです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: 示して
  rationale: 直訳的には「彼らの前に置いた」だが、たとえを聞き手に提示するという文脈上の意味を、現代日本語で自然かつ簡潔に表す。
- source_word: παραβολὴν
  choice: たとえ
  rationale: 共観福音書におけるイエスの比喩的な教えを表す、日本語聖書で定着した明瞭な語。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を簡潔に保持する。「国」は領域と支配の両面を排除せず、「天国」よりも死後の行き先だけを連想させにくい。
- source_word: κόκκῳ σινάπεως
  choice: 一粒のからし種
  rationale: κόκκοςの粒としての個別性を「一粒」で表し、σινάπεωςを一般読者に通じる「からし種」とした。
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ある人が取って
  rationale: ἄνθρωποςは物語中の不特定の一人を指すため、「男」と性別を強調せず「ある人」とする。λαβώνの先行動作は自然な連用形で保持する。
- source_word: ἔσπειρεν
  choice: 蒔いた
  rationale: σπείρωの播種という具体的な農作業を正確に表す。
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: 自分の畑に
  rationale: αὐτοῦの所有関係を再帰的な「自分の」で明瞭にし、場所を日本語として自然な着点の助詞「に」で表す。
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν の訳し方
  choice: 天の国
  alternative: 天の支配／天国
  rationale: 「天の国」はマタイの定型句を保ちつつ、神の支配とその領域の双方を含み得る。「天の支配」に限定せず、また「天国」によって死後の場所だけへ狭めることも避ける。
- issue: 比喩の対応範囲
  choice: 「天の国は……からし種のよう」と原文どおり開いた比較にする
  alternative: 天の国の成長は、からし種の成長のよう
  rationale: 原文は比較のどの要素が中心かをこの節だけでは限定していないため、成長などの解釈を本文へ補わず、続く説明に委ねる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会衆での朗読にも適する簡潔で品位ある文体とした。発話者は文脈上のイエスであり、日本語では主語がないと唐突になるため明示した。「ようなものです」は比較導入句として自然で、断定的な同一視を避ける。
