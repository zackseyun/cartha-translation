source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: ja
  text: イエスはこれらすべてのことを、たとえを用いて群衆に語られた。たとえを用いずには、彼らに何も語られなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「たとえを用いずには、彼らに何も語っておられなかった」とも訳せる。ギリシア語の未完了過去は、継続的または習慣的な過去を表すことがある。
    reason: ギリシア語未完了過去の継続的・習慣的な含みを、不自然な大過去的表現を避けて示すため。
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: これらのことをすべて
  rationale: 指示語と全体性の双方を保ちつつ、現代日本語として自然な語順にした。
- source_word: ἐλάλησεν
  choice: 語られた
  rationale: アオリストによる談話の総括を表す。イエスへの敬意を自然な尊敬語で示した。
- source_word: ἐν παραβολαῖς
  choice: たとえで
  rationale: ἐνの手段・様態を簡潔な日本語で表した。複数形は、この文脈では種類・方法を示す集合的な「たとえ」で自然に伝わる。
- source_word: τοῖς ὄχλοις
  choice: 群衆に
  rationale: ギリシア語は複数形だが、日本語の集合名詞「群衆」は数を明示せず自然に対応する。
- source_word: χωρὶς παραβολῆς
  choice: たとえなしには
  rationale: χωρίςと単数形παραβολῆςを反映し、「たとえという方法によらずには」という意味を自然に表す。
- source_word: οὐδὲν ἐλάλει
  choice: 何も語られなかった
  rationale: 否定の強さを保つ。未完了過去の継続的・習慣的な含みは、日本語では文脈に自然な過去形とし、脚注で示した。
- source_word: αὐτοῖς
  choice: 省略（群衆にで明示済み）
  rationale: 日本語では同じ対象を再度「彼らに」とすると不自然になりやすいため、省略しても指示対象は明瞭である。
theological_decisions:
- issue: 第二節の未完了過去ἐλάλειが示す叙述上の強調
  choice: 本文は自然な過去形とし、継続的・習慣的な含みを脚注で保持する
  alternative: 「何もお語りになっていなかった」と継続形で訳す
  rationale: 未完了過去は、この場面でイエスが群衆に繰り返し、あるいは一貫してたとえで語ったことを含意しうる。ただし日本語の継続形は不自然または特定時点での進行を過度に示しうるため、意味を決め切らず脚注で提示する。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「語られた」は聖書本文として自然な尊敬表現。脚注記号[a]は、未完了過去に関係する第二文末に置いた。
