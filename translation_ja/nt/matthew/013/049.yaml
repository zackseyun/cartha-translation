id: MAT.13.49
reference: Matthew 13:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: ja
  text: この時代の終わりには、このようになります。天使たちが出て行き、正しい人々の中から悪い者たちをより分けます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: そのようになります
  rationale: たとえの結末を終末の出来事に対応させる表現。未来の意味を明示しつつ、現代日本語として自然にした。
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: この時代の終わりに
  rationale: συντέλειαの「完了・終結」とαἰώνの「時代」の意味を保つ。「世界の滅亡」という、原文が必ずしも述べていない意味を持ち込まないため、「世の終わり」ではなく「この時代の終わり」とした。
- source_word: ἐξελεύσονται
  choice: 出て行き
  rationale: ἐξέρχομαιの基本的な移動の意味を、文脈に合う自然な日本語で表した。
- source_word: οἱ ἄγγελοι
  choice: 御使いたち
  rationale: 終末の裁きという文脈では、人間の使者ではなく天的存在を指す。聖書日本語として通用し、一般読者にも理解可能な「御使い」を採用した。
- source_word: ἀφοριοῦσιν
  choice: より分けます
  rationale: 混在する集団から一方を分離する動作を表す。「分けます」よりも、選別を伴うたとえの情景が明確になる。
- source_word: τοὺς πονηροὺς
  choice: 悪い者たち
  rationale: 実体詞的な形容詞で、悪を行う人々を指す。「悪人」より原語の素直な性格描写を保ち、過度に固定的な分類語になることを避けた。
- source_word: ἐκ μέσου
  choice: 中から
  rationale: 混在した集団の内部から取り出して分離する関係を、簡潔な現代日本語で示した。
- source_word: τῶν δικαίων
  choice: 正しい人々
  rationale: 実体詞的形容詞を人々の集団として明示した。「義人」より一般読者に分かりやすく、δικαίωνの道徳的・法廷的含意を不必要に狭めない。
theological_decisions:
- issue: 終末表現におけるαἰώνの意味
  choice: この時代
  alternative: 世界／世
  rationale: αἰώνはここで物理的な世界そのものより、現在の時代・秩序を指す。「世界」と訳して宇宙の消滅を断定することを避け、原文の範囲を保った。
- issue: οἱ ἄγγελοιの指示対象
  choice: 天的存在である御使いたち
  alternative: 人間の使者たち
  rationale: たとえの説明と終末の裁きという文脈から、ここでは天的な御使いを指すと判断した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、終末の裁きを語る箇所にふさわしい端正さを保った。「御使い」は日本語聖書で定着した語だが、文脈上の天的存在を明確にするため採用した。
