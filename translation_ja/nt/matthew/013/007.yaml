base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: ja
  text: また、ほかの種は茨の中に落ちた[a]。茨が生えてきて、それらを押しふさいでしまった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では字義的に「茨の上に落ちた」。ここでは種蒔きの文脈に即して「茨の中に」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ほかの種
  rationale: 中性複数の名詞的用法で、文脈上は前節から続く種を指す。日本語では「種」を補うことで指示対象が自然に明確になる。
- source_word: δὲ
  choice: すると
  rationale: 物語の次の場面を進める弱い接続であり、強い逆接ではない。後半の展開とのつながりも含め、自然な日本語にした。
- source_word: ἔπεσεν
  choice: 落ちた
  rationale: πίπτωのアオリストであり、「蒔かれた」と意訳せず、原文の落下の表現を保った。
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: 茨の中に
  rationale: ἐπί＋対格は字義的には「茨の上に」だが、種蒔きの農耕文脈では、茨の生える場所に落ちたことを表す自然な日本語として「茨の中に」とした。
- source_word: ἀκάνθας / ἄκανθαι
  choice: 茨
  rationale: とげのある雑草や低木を集合的に指す語として、たとえの農耕的情景に合う簡潔で定着した訳語を用いた。
- source_word: ἀνέβησαν
  choice: 伸びてきて
  rationale: ἀναβαίνωの上方への成長という像を、植物について自然な現代日本語で表した。
- source_word: ἔπνιξαν
  choice: ふさいでしまった
  rationale: πνίγωの「窒息させる、締めつける」という像を保ちつつ、植物が成長を妨げる農耕的意味が伝わる表現とした。
- source_word: αὐτά
  choice: それら
  rationale: 原文の中性複数代名詞に対応させ、暗黙の複数の種を受ける形を保った。
theological_decisions: []
