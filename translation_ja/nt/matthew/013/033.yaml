source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: ja
  text: また別のたとえを彼らに語られた。「天の国はパン種[a]に似ている。ある女がそれを取り、三サトンの小麦粉[b]の中に隠し入れた[c]。全体が発酵するまで。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「酵母」とも訳せる。ギリシア語は、生地を発酵させるために用いるパン種を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「小麦粉三サトン」。サトンは古代の容量単位で、三サトンはかなり多量である。
    reason: cultural_note
  - marker: c
    text: 「混ぜ込んだ」「練り込んだ」とも訳せる。ギリシア語の字義は「中に隠した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: また別のたとえを彼らに語られた
  rationale: ἄλληνの追加の意味を「また別の」で示し、たとえを提示する物語上の表現としてἐλάλησενを自然な「語られた」とした。文脈上明らかな主語を本文に補わず、敬意を表す自然な日本語にした。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイ特有の表現を、現代日本語で明瞭かつ定着した形にした。οὐρανῶνの文法上の複数形はセム語的背景を持つため、日本語で不自然に複数化しない。
- source_word: ζύμῃ
  choice: パン種
  rationale: 発酵させた生地を新しい生地に混ぜる古代の膨張剤を表し、比喩としての柔軟性も保つ。「酵母」は代替語として脚注に示した。
- source_word: ἐνέκρυψεν εἰς
  choice: 中に隠し入れた
  rationale: ἐγκρύπτωの字義的な「中に隠す」を保ちながら、粉に入れる動作として日本語で理解できる表現にした。「混ぜ込んだ」は自然だが、原文より解釈的なので脚注に置いた。
- source_word: ἀλεύρου σάτα τρία
  choice: 三サトンの小麦粉
  rationale: σάτονという具体的な古代の容量単位を音写して保持し、それがかなり多量であることを脚注で説明した。ἄλευρονは文脈に即して「小麦粉」とした。
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: ついには全体にパン種が行き渡った
  rationale: 受動形が示す全体の発酵を、過度に「生地」などと補わず自然な日本語で表した。ὅλονの全体性と、パン種が隅々まで作用する像を保つ。
theological_decisions:
- issue: 天の国のたとえにおけるパン種の価値づけ
  choice: パン種を中立的な比喩として訳し、肯定的・否定的いずれの評価も本文に加えない
  alternative: 他の聖書箇所でパン種が否定的に用いられることを根拠に、この箇所にも否定的含意を明示する
  rationale: この一節の語句自体は、パン種が隠れて全体に作用する像を提示しているが、その神学的評価を明言していない。訳文は解釈上の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、たとえ話にふさわしい簡潔で品位ある調子と、原文の「隠す」という印象的な語を保持した。古代の単位は本文で保存し、読者に必要な説明を脚注に置いた。
