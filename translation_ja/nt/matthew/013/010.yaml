id: MAT.13.10
reference: Matthew 13:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: ja
  text: すると、弟子たちがイエスに近寄って[a]言った。「なぜ、あの人たちにはたとえでお話しになるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「近づいて」。原文は、弟子たちが話す前にまずイエスのそばへ来たことを示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: すると
  rationale: 単なる接続の「そして」よりも、直前の出来事を受けて物語を進める働きを自然な現代日本語で表す。
- source_word: προσελθόντες
  choice: 近寄って
  rationale: 弟子たちが話す前にイエスのもとへ近づいたという移動と動作の順序を簡潔に保つ。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 定冠詞は文脈上既知の弟子たちを指す。「イエスの」は文脈から明らかだが原文には明示されていないため補わない。
- source_word: εἶπαν αὐτῷ
  choice: イエスに……言った
  rationale: 原文の「彼に言った」を保ちつつ、日本語では指示対象を明確にするため「イエス」とした。直接疑問が続くので「尋ねた」も可能だが、λέγωにより近い「言った」を採用する。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う標準的な疑問表現として簡潔かつ自然である。
- source_word: ἐν παραβολαῖς
  choice: たとえで
  rationale: ἐνの手段・様態を自然な日本語で表し、複数形は総称的な話し方として理解できるため不自然な「たとえ話々で」を避ける。
- source_word: λαλεῖς
  choice: お話しになる
  rationale: 現在形の継続的・一般的な発話を表し、弟子からイエスへの発言として自然で品位ある敬語を用いる。
- source_word: αὐτοῖς
  choice: あの人たちには
  rationale: イエスが語りかけていた群衆を指す。日本語では対照を示す「には」により、弟子たちが自分たちと群衆を区別して問う文脈を自然に表せる。
