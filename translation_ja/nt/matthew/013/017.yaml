revisions:
- from: というのも、あなたがたに、まことに言います。多くの預言者や正しい人々[a]が、あなたがたの見ているものを見たいと切に願いましたが、それを見ることはなく、あなたがたの聞いていることを聞きたいと切に願いましたが、それを聞くことはありませんでした。
  to: まことに、あなたがたに言います。というのも、多くの預言者と正しい人々[a]は、あなたがたが見ているものを見たいと、また、あなたがたが聞いているものを聞きたいと切に願いましたが、見ることも聞くこともありませんでした。
  rationale: 冒頭を自然な日本語の定型句に整えつつ、γάρの説明的機能を「というのも」で保持しました。「預言者と正しい人々」として原文の並列を反映し、見ることと聞くことへの強い願望を、一度の「切に願いました」が支える並行構造として訳しました。対象は引き続き「見ているもの」「聞いているもの」にとどめ、イエスや御国などを補っていません。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:20Z'
review_pass:
  verdict: revise
  source_fidelity: 原文の主要な意味内容、特に見聞きする対象を特定しない点と、実際に見聞きしなかったという否定は概ね保たれています。ただし、καὶを「や」とするより「と」として二つの群を明確に並列する方が適切です。また、ἐπεθύμησανは一度だけ用いられ、二つの不定詞を支配しているため、二度「切に願いました」とするより、一つの願望として訳す方が原文の構造に忠実です。
  naturalness: 「というのも、あなたがたに、まことに言います」は読点の位置と語順が現代日本語としてやや不自然です。「まことに、あなたがたに言います。というのも、」とすると、厳粛な定型句と説明の接続が明瞭になります。関係節は「あなたがたが見ているもの／聞いているもの」とすると自然です。
  terminology: 「預言者」「正しい人々」「切に願う」は適切です。「義人たち」はδίκαιοιの直訳的な別表現として有用であり、脚注も本文の意味を不必要に限定していません。
  issues:
  - severity: medium
    issue: 冒頭の語順と句読点が不自然で、γάρの説明関係も弱く見える。
    rationale: 「というのも、あなたがたに、まことに言います」は日本語として不自然です。ἀμὴν λέγω ὑμῖνをまず「まことに、あなたがたに言います」と訳し、γάρを続けて「というのも」と置くのが明瞭です。
  - severity: low
    issue: καὶを「や」としている。
    rationale: 「や」は例示的・非網羅的な響きを持ちえます。原文は預言者と正しい人々を並列するため、「と」がより忠実です。
  - severity: medium
    issue: 「切に願いました」が二度繰り返され、原文の一つのἐπεθύμησανによる並行構造が見えにくい。
    rationale: 原文では「見たい、また聞きたい」という二つの不定詞句を一つの動詞ἐπεθύμησανが支配します。一度の「切に願いました」にまとめることで、意味を保ったまま構造を反映できます。
