  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ja
  text: まことに、あなたがたに言います。というのも、多くの預言者と正しい人々[a]は、あなたがたが見ているものを見たいと、また、あなたがたが聞いているものを聞きたいと切に願いましたが、見ることも聞くこともありませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「義人たち」。ギリシア語では「正しい」という形容詞が名詞として用いられ、正しい人々を指しています。
    reason: 名詞的形容詞δίκαιοιの直訳的な別表現を示すため。
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: イエスの厳粛な断言を表す定型句として、音写ではなく意味を明確に伝える現代日本語を用いた。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の言明を根拠づける説明的な接続を明示した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 原文の直接的な語りかけと定型的な表現を、自然な敬体で保った。
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: 多くの預言者や正しい人々
  rationale: δίκαιοιを名詞的に用いられた形容詞として訳し、預言者と並ぶ人々の一群であることを明確にした。καίはここでは日本語として自然な並列の「や」とした。
- source_word: ἐπεθύμησαν
  choice: 切に願いました
  rationale: 単なる希望より強い願望を表す動詞の力を伝えつつ、この文脈にない否定的な欲望の含みは避けた。後続する「見る」と「聞く」の双方に同じ強さを反映した。
- source_word: ἃ βλέπετε
  choice: あなたがたの見ているもの
  rationale: 目的語の内容をイエス、メシア、御国などと補わず、原文の関係節が持つ含みを保った。
- source_word: οὐκ εἶδαν
  choice: それを見ることはなく
  rationale: 歴史的事実として見なかったことを表し、「できなかった」として能力の欠如を明示することは避けた。
- source_word: ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: あなたがたの聞いていることを……それを聞くことはありませんでした
  rationale: 「見る」との平行構造を保ち、聞いた内容を解釈的に特定しなかった。
theological_decisions:
- issue: δίκαιοιの範囲
  choice: 「正しい人々」とし、預言者と並ぶより広い人々の一群として表した。
  alternative: 「義人たち」
  rationale: 原文は複数の名詞的形容詞であり、特定の制度的・教派的な集団名ではない。現代の一般読者に意味が通じる表現を本文に置いた。
- issue: 見聞きされたものの内容
  choice: 「あなたがたの見ているもの」「あなたがたの聞いていること」として、対象を明示しなかった。
  alternative: 「メシア」または「御国の奥義」などと補う。
  rationale: 文脈はイエスの働きと御国の啓示を示唆するが、この節自体は対象を関係節だけで表しているため、その含みと神学的緊張を保った。
- issue: 否定の性質
  choice: 「見ることはなく」「聞くことはありませんでした」と訳した。
  alternative: 「見ることができず」「聞くことができませんでした」
  rationale: 原文の否定アオリストは実際に見聞きしなかったことを述べる。機会や時代の制約は文脈上考えられるが、能力不能を本文で断定しないようにした。
translation_notes:
  register: 明瞭で品位のある現代標準日本語の敬体。イエスの厳粛な宣言には「まことに」を用い、原文の反復と「見る／聞く」の並行を保ちながら、不自然な逐語調は避けた。
