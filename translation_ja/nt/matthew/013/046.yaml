source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: ja
  text: そして、非常に価値のある[a]真珠を一つ見つけると、彼は立ち去り、持っていたものをすべて売って、それを買った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「貴重な」。
    reason: πολύτιμον は「非常に価値のある」のほか、「貴重な」とも訳せるため。
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: そして、…見つけると
  rationale: δέはここでは強い逆接ではなく、前節から話を進める軽い接続と判断した。アオリスト分詞は、後続する主要動作に先立つ出来事を自然な日本語の条件・時の表現で示した。
- source_word: ἕνα
  choice: 一つ
  rationale: ギリシア語に明示された数詞を保持し、並外れた価値を持つ単一の真珠であることを示した。
- source_word: πολύτιμον
  choice: 非常に価値のある
  rationale: 高価で貴重であるという意味を、現代の読者に明瞭で自然な表現にした。
- source_word: μαργαρίτην
  choice: 真珠
  rationale: 文脈に適した標準的な訳語である。
- source_word: ἀπελθὼν
  choice: 行って
  rationale: その場を離れて次の行動に移る順序を簡潔に表した。
- source_word: πέπρακεν
  choice: 売り
  rationale: 完了形が示す完遂された行為を、日本語の物語として自然な連用形で表した。
- source_word: πάντα ὅσα εἶχεν
  choice: 持っていたものをすべて
  rationale: 所有物の全体を指す原文の包括性を明確に保持した。
- source_word: ἠγόρασεν
  choice: 買った
  rationale: 平明で自然な現代日本語の対応語を用いた。
- source_word: αὐτόν
  choice: それを
  rationale: 文法上は男性形だが、先行詞は無生物の「真珠」であるため、日本語では自然に「それ」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の行動の順序と、「一つ」「すべて」という強調を保持した。
