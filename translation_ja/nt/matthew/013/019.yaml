id: MAT.13.19
reference: Matthew 13:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: ja
  text: だれでも神の国のことばを聞いて理解しないなら、悪い者が来て、その人の心に蒔かれたものを奪い去る。この人は、道端に蒔かれた者である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「道に沿って蒔かれた者」。原文は、ことばを聞く人を、道端に蒔かれたものというたとえの表現と重ねている。
    reason: 原文の男性単数の比喩的同定と、παρά の空間的な意味を示すため。
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: だれでも…聞いて
  rationale: 属格の分詞構文が表す一般的な場合を、現代日本語で自然に「だれでも…聞いて」とした。
- source_word: τὸν λόγον τῆς βασιλείας
  choice: 御国のことば
  rationale: λόγος の「ことば／知らせ」の幅を保ちつつ、種とことばの比喩的対応を残した。「御国」は神の支配を指す文脈で定着した、簡潔で品位ある表現である。
- source_word: μὴ συνιέντος
  choice: 悟らない
  rationale: 単に音声を聞くだけでなく、意味を理解して受け止めることを表す。日本語の聖書文体として自然でありながら、過度な解釈を加えない。
- source_word: ὁ πονηρὸς
  choice: 悪い者
  rationale: 定冠詞付き形容詞の名詞的用法を人格的存在として訳した。本文が明示しない固有名で特定せず、「悪い者」として意味を保った。
- source_word: ἁρπάζει
  choice: 奪い去る
  rationale: 力ずくで突然取り去るという動詞の強さを表した。
- source_word: τὸ ἐσπαρμένον
  choice: 蒔かれたもの
  rationale: 中性・完了受動分詞の名詞的用法を反映し、すでに心に蒔かれているものを指す形にした。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: その人の心に
  rationale: καρδία を「心」とし、代表的単数の αὐτοῦ は、日本語で指示対象が明瞭になるよう「その人の」とした。
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: 道端に蒔かれた者
  rationale: 聞く人を蒔かれた種と重ねる原文の換喩的な緊張を説明的に解消せず、そのまま保持した。παρά はこの場面では「道端に」が自然である。
theological_decisions:
- issue: ὁ πονηρὸς の人格性
  choice: 人格的な「悪い者」
  alternative: 抽象的な「悪」
  rationale: 来て奪い去るという行為主体として描かれているため人格的に訳す一方、「サタン」など本文にない特定は加えなかった。
- issue: 蒔かれた対象と人との同一視
  choice: 「この人が、道端に蒔かれた者である」
  alternative: 「これは道端に蒔かれた種のことである」
  rationale: 文法上の男性単数分詞は人を指すと読め、イエスが聞き手と蒔かれたものを重ねる比喩を保つ。明瞭化のために種だけへ限定しない。
- issue: αὐτοῦ の性と指示
  choice: 「その人の心」
  alternative: 「彼の心」
  rationale: 原文の単数の指示を保ちつつ、現代日本語では総称的な男性を「彼」で表すと不自然になりやすいため、性を不必要に強調しない指示表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「御国」「悟る」に聖書本文としての品位を持たせた。比喩の不自然さを説明的に平滑化せず、本文では簡潔に保ち、必要最小限の注で補った。
