  naturalness: 「だれでも…なら」の条件表現と「悪い者が来て…奪い去る」は自然である。一方、「この人が、…者である」は主題・述語の結び付きが不安定なので、「この人は、…者である」と改める。
  terminology: 「神の国のことば」は、現代日本語で意味が明瞭であり、τῆς βασιλείας の属格関係も保つ。「悪い者」は人格的な ὁ πονηρός を固有名で過度に特定せずに表せる。
  issues:
