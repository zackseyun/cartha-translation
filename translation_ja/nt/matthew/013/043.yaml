id: MAT.13.43
reference: Matthew 13:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: ja
  text: その時、正しい者たちは、彼らの父の王国で太陽のように輝く[a]。耳のある者は聞きなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「輝き出る」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 原文は単数形で、一人ひとりに心して聞くよう促す代表的な呼びかけ。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 直前のたとえの説明に続く終末的な時を示す。現代日本語として自然で、時間的なつながりを明確にする。
- source_word: οἱ δίκαιοι
  choice: 正しい者たち
  rationale: 実体詞的な形容詞を、道徳的・契約的な含みを狭めずに表す。複数であることも明示する。
- source_word: ἐκλάμψουσιν
  choice: 輝く
  rationale: ἐκλάμπωの未来形。「輝き出る」という方向性もあり得るが、「太陽のように」という比喩によって強い輝きは十分伝わるため、本文では自然な「輝く」とした。
- source_word: ὡς ὁ ἥλιος
  choice: 太陽のように
  rationale: ὡςによる比較を、明瞭で自然な現代日本語で保つ。
- source_word: ἐν τῇ βασιλείᾳ
  choice: 王国で
  rationale: 前置詞句の場所的な意味を保つ。「支配」も語義上可能だが、ここでは正しい者たちが輝く領域として描かれているため「王国」が適切。
- source_word: τοῦ πατρὸς αὐτῶν
  choice: 彼らの父の
  rationale: 原文の所有関係をそのまま保ち、「天の」や「神」を補わない。
- source_word: ὁ ἔχων ὦτα
  choice: 耳のある者は
  rationale: 単数の実体詞的分詞を、代表的・一般的な呼びかけとして自然な日本語にする。
- source_word: ἀκουέτω
  choice: 聞きなさい
  rationale: 三人称命令の呼びかけを、単なる聴覚作用だけでなく注意して受け止めることを促す文脈に合う、簡潔で力のある表現とした。
theological_decisions:
- issue: βασιλείαを「王国」と「支配」のどちらで訳すか
  choice: 王国
  alternative: 支配
  rationale: 「彼らの父の王国で」という場所的構文と終末的な情景に合う。王の支配という含意を否定せず、特定の教派的理解にも限定しない。
- issue: 結びの勧告における単数の代表表現
  choice: 耳のある者は聞きなさい
  alternative: 耳のある人たちは聞きなさい
  rationale: ギリシア語の単数形を平板な複数に変えず、一人ひとりに向けられた代表的な呼びかけとして日本語で自然に表した。
- issue: 「彼らの父」への語の補足
  choice: 彼らの父
  alternative: 彼らの天の父／父なる神
  rationale: 文脈上の指示対象を説明的に補わず、原文が持つ簡潔さを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、終末的な宣言と厳粛な呼びかけにふさわしい品位を保った。「御国」は避け、一般読者にも意味が直接伝わる「王国」とした。
