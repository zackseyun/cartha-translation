  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Ὁ σπείρων τὸ καλὸν σπέρμα ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: ja
  text: イエスは答えられた。「良い種をまく者は、人の子です。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人なる者」とも訳せる。ギリシア語の「人の子」という称号はダニエル書7章を想起させ、福音書における確立した表現と神学的な響きを保つため、本文では「人の子」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: イエスは答えられた
  rationale: ギリシア語では直訳すると「答えて言った」だが、日本語では冗長になるため、応答として語り始める機能を自然な「答えられた」で表した。主語は直前の文脈からイエスであり、日本語で明確に補った。
- source_word: Ὁ σπείρων
  choice: まく者
  rationale: 名詞的に用いられた現在分詞で、行為によってその人物を特定している。「種をまく人」も可能だが、述語の「人の子」と対応する簡潔で格調ある表現とした。
- source_word: τὸ καλὸν σπέρμα
  choice: 良い種
  rationale: καλόςはここで、見た目の美しさよりも質や性質の良さを示す。σπέρμαは集合的な単数なので「種」とした。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの定着した自己呼称であり、ダニエル書7章への響きも保つ日本語聖書の伝統的表現を採用した。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουというキリスト論的称号の訳し方
  choice: 人の子
  alternative: 人間である者／人なる者
  rationale: 単に一般的な人間を指す表現へ平板化せず、福音書全体とダニエル書7章に通じる称号としての含みを保つため。「人の子」は現代日本語では日常的表現でないものの、確立した聖書用語として理解可能である。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスのたとえの解説にふさわしい簡潔で落ち着いた語調とした。原文に明示されない主語「イエス」は、日本語で発話者を明確にするため文脈に基づいて補った。
