id: MAT.13.44
reference: Matthew 13:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: ja
  text: 天の御国は、畑に隠されている宝[a]のようなものです。ある男がそれを見つけて隠し、その喜びのゆえに行って、自分の持っているものをすべて売り、その畑を買います。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天の御国は、畑に隠された宝に似ています。」
    reason: 比較構文および完了受動分詞を別の自然な日本語表現で示すため。
  - marker: b
    text: 「その喜びのゆえに」は、「喜びのあまり」とも訳せます。
    reason: ἀπὸ τῆς χαρᾶς αὐτοῦが後続する行動の原因・動機を表すことを示すため。
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: 〜のようなものです
  rationale: たとえを導く定型表現を、明瞭で自然な現代日本語にした。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の御国
  rationale: マタイ特有の表現を保ちつつ、神の支配と国の双方を含み得る定着した訳語を用いた。
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: 畑に隠されている宝
  rationale: 完了受動分詞が示す、隠された状態が続いていることを表した。ギリシア語の冠詞はこの文脈で必ずしも特定の畑を要求しないため、初出では「畑」とした。
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: それを見つけた男は
  rationale: 関係節を自然な日本語の語順に組み替え、ἄνθρωποςの男性単数を文脈に即して「男」とした。
- source_word: ἔκρυψεν
  choice: もう一度隠しました
  rationale: 宝はすでに隠されていたため、発見後に再び隠したという物語上の意味を日本語で明示した。
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: 喜びのあまり
  rationale: 喜びが後続の行動の動機・原因であることを自然に表した。
- source_word: ὑπάγει
  choice: 行って
  rationale: 物語的現在の動きと後続動作へのつながりを簡潔に表した。
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: 持ち物をすべて売り払い
  rationale: 所有するものの全面性を保ち、「売り払う」で全処分の含意を自然に示した。
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: その畑を買います
  rationale: ἐκεῖνονが、宝のある特定の畑を指すことを「その」で表した。
theological_decisions:
- issue: βασιλείαの訳し方
  choice: 天の御国
  alternative: 天の支配
  rationale: βασιλείαは支配と領域の双方を含み得る。ここではマタイの定型句として自然で広く理解される「天の御国」を採り、動的な支配の意味を排除しない。
- issue: ἄνθρωποςの性別表現
  choice: 男
  alternative: 人
  rationale: 男性単数で描かれる物語上の人物を保った。普遍的適用を否定する意図はない。
- issue: 宝を再び隠す行為の解釈
  choice: 行為のみを訳し、倫理的評価を加えない
  alternative: 正当または不正な行為として説明する
  rationale: 本文は男の行為を記すが、その倫理性を明示的に評価していないため、解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用い、たとえとしての簡潔さと品位を保った。文体は丁寧体で統一し、物語的現在は「買います」として生き生きした進行を維持した。
