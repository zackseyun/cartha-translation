id: MAT.13.26
reference: Matthew 13:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: ja
  text: しかし、作物が芽を出して実を結ぶと、その時、雑草[a]も姿を現した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「毒麦」とも訳せる。小麦によく似たドクムギを指す可能性がある。
    reason: ζιζάνιαの伝統的訳語と、可能性のある具体的な植物名を示しつつ、同定の不確かさを保つため。
lexical_decisions:
- source_word: ὅτε δὲ
  choice: しかし、…すると
  rationale: ὅτεの時を表す従属関係を「…すると」で示し、δέは前の場面との軽い対照と物語の進行を「しかし」で表した。
- source_word: ἐβλάστησεν
  choice: 芽を出して
  rationale: βλαστάνωの、植物が発芽して伸び始める意味を、自然で明瞭な現代日本語で表した。
- source_word: ὁ χόρτος
  choice: 作物
  rationale: χόρτοςは草や生えた植物を指し得るが、畑と収穫の文脈では「作物」が自然であり、この節だけで植物の種類を過度に限定しない。
- source_word: καρπὸν ἐποίησεν
  choice: 実を結ぶ
  rationale: 直訳的には「実を作る」だが、収穫物を生じることを表す日本語の慣用表現とした。「穀粒」と限定せず、原文のκαρπόςの広がりも保った。
- source_word: τότε
  choice: その時
  rationale: 先行する成長と結実を受け、雑草が見分けられるようになった時点を明示した。
- source_word: ἐφάνη
  choice: 姿を現した
  rationale: φαίνωの受動・自動詞的な「見えるようになる、現れる」という意味を自然に表した。
- source_word: καὶ τὰ ζιζάνια
  choice: 雑草も
  rationale: ζιζάνιαは畑の有害な草を指すが、植物学的な同定には不確かさがあるため本文では一般的な「雑草」とし、καίの付加的意味を「も」で表した。
theological_decisions:
- issue: ζιζάνιαが指す植物の特定
  choice: 本文では一般的に「雑草」と訳す
  alternative: 「毒麦」または「ドクムギ」
  rationale: 原文は作物に交じる有害な草を指すが、厳密な植物学的同定を要求してはいない。本文を分かりやすくしつつ、伝統的・具体的な理解は脚注に残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、たとえ話にふさわしい簡潔で品位ある語調とした。脚注記号は説明対象である「雑草」の直後に置いた。
