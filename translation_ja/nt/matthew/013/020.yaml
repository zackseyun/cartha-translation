id: MAT.13.20
reference: Matthew 13:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: ja
  text: 岩地にまかれたものとは[a]、みことばを聞き、すぐに喜んでそれを受け入れる人のことである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「岩の多い所にまかれたものとは」。
    reason: πετρώδηの形式的な別訳と、ギリシア語の複数形に近い表現を示すため。
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: 岩地にまかれたものとは
  rationale: 冠詞付き受動分詞を名詞的に訳し、種と土地の比喩を保ちながら、δέは日本語の主題提示「とは」によって穏やかな移行として表した。
- source_word: πετρώδη
  choice: 岩地
  rationale: 岩盤が浅い土に覆われた土地という文脈に合い、現代日本語として簡潔に農耕の情景を伝える。
- source_word: σπαρείς
  choice: まかれた
  rationale: アオリスト受動分詞の受動的な農耕比喩を自然な日本語で保持した。
- source_word: οὗτός ἐστιν
  choice: 人のことである
  rationale: 直訳的な同定を日本語として明瞭にしつつ、「表す」と説明的に言い換えすぎない形にした。
- source_word: ὁ τὸν λόγον ἀκούων
  choice: みことばを聞く…人
  rationale: 現在分詞を自然な連体節で表した。λόγοςは本文の主題的響きを保つため「みことば」とした。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 即時性を明快で現代的な標準語によって表した。
- source_word: μετὰ χαρᾶς
  choice: 喜んで
  rationale: 日本語では副詞的に表すほうが自然であり、喜びを伴う受容という意味を保持する。
- source_word: λαμβάνων αὐτόν
  choice: それを受け入れる
  rationale: αὐτόνがλόγοςを指すことを「それ」で保持し、λαμβάνωの文脈上の受容・受諾の意味を「受け入れる」で明瞭にした。
theological_decisions:
- issue: たとえの説明における「まかれたもの」の指示対象
  choice: 「岩地にまかれたもの」という圧縮された比喩を本文に残し、続く句で聞く人として同定する。
  alternative: 「岩地にまかれた種は、みことばを聞く人を表す」と説明的に展開する。
  rationale: ギリシア語は、まかれた「もの」と、それが指す聞き手とを緊張を残したまま結びつけているため、種と人を明示的に分ける解釈的補足を本文へ持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御言葉」ではなく読みやすい「みことば」を用い、文末は説明句として落ち着きのある「ことである」とした。
