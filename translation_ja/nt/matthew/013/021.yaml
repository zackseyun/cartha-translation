id: MAT.13.21
reference: Matthew 13:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: ja
  text: しかし、その人のうちに根がなく、長続きしない。ことばのために苦難や迫害が起こると、すぐにつまずく[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「つまずかされる」「不快に思う」とも訳せる。ギリシア語の動詞は、つまずくこと、つまずかされること、または不快に思うことを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: その人のうちには根がなく
  rationale: 種まきのたとえにある農耕の比喩「根」を保ちつつ、再帰表現を自然な現代日本語で表した。
- source_word: πρόσκαιρός
  choice: しばらく続くだけである
  rationale: 限られた期間しか持続しないという意味を、簡潔で明瞭な日本語にした。
- source_word: γενομένης δὲ θλίψεως ἢ διωγμοῦ
  choice: 苦難や迫害が起こると
  rationale: 属格絶対を時の条件として訳し、θλῖψιςの圧迫・苦境の深刻さを「苦難」で表した。
- source_word: διὰ τὸν λόγον
  choice: みことばのために
  rationale: たとえの中で告げられた神のメッセージを指すλόγοςとの語彙的つながりを保ち、日本語聖書として自然な表現を選んだ。
- source_word: εὐθὺς
  choice: たちまち
  rationale: 圧迫に直面した際の即時性を、格調を保った自然な語で示した。
- source_word: σκανδαλίζεται
  choice: つまずいて離れてしまう
  rationale: 動詞本来の「つまずく」という比喩と、文脈上の離反という帰結の双方を表し、一方だけに意味を狭めないようにした。
theological_decisions:
- issue: 弟子としての歩みの文脈におけるσκανδαλίζεταιの意味
  choice: つまずいて離れてしまう
  alternative: つまずく／気を悪くする／離れてしまう
  rationale: 原語にはつまずかされる、反感を抱く、離反するという幅がある。本文では「つまずく」を残しつつ文脈上の帰結を「離れてしまう」で補い、背教に関する特定の教理体系を持ち込まず緊張を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「根」というたとえの像を保持した。「みことば」は福音書の文脈に自然だが、専門用語化しすぎないよう、文全体は平易に整えた。
