id: MAT.13.27
reference: Matthew 13:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the servants of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: ja
  text: そこで、家の主人の奴隷たちが主人のもとに来て言った。「ご主人様、ご主人様の畑に良い種をまかれたのではありませんか。それなのに、毒麦[a]はどこから来たのでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「雑草」とも訳せる。ギリシア語は、生育の初期には小麦によく似るドクムギを指す可能性がある。
    reason: ζιζάνιαの一般的意味と、特定の植物種への有力だが確定的ではない同定の両方を示す。
lexical_decisions:
- source_word: προσελθόντες
  choice: 主人のもとに来て
  rationale: 主人に近づいた動作を、後続する「言った」に先立つ自然な日本語の動作として表した。
- source_word: δοῦλοι
  choice: 奴隷たち
  rationale: 主人に所有され、その権威の下にある者という当時の社会的身分を曖昧にせず表す。
- source_word: οἰκοδεσπότου
  choice: 家の主人
  rationale: 家と所領を治める主人という語義を、明瞭で自然な日本語にした。
- source_word: Κύριε
  choice: ご主人様
  rationale: このたとえの会話では家の主人への敬意ある呼びかけであり、キリスト論的称号と決めつけず、話者と主人の関係を自然に示す。
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: 良い種をまかれたのではありませんか
  rationale: 肯定の答えを予期する否定疑問の力を保ちつつ、敬意ある現代日本語とした。
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: 畑には
  rationale: 所有者への直接の呼びかけと文脈から「あなたの」は明白なので、日本語では不自然な反復を避けた。
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: それなのに、毒麦はどこから来たのでしょうか
  rationale: πόθενの起源を問う意味とοὖνの推論・意外性を自然に表した。ギリシア語の「畑が持つ」という構文は直訳せず、意味を明瞭にした。
- source_word: ζιζάνια
  choice: 毒麦
  rationale: 小麦に似た有害な雑草、特にドクムギを指す可能性が高い語として、日本の聖書読者にも通じる簡潔な表現を採用した。具体的な同定の不確かさは脚注に残す。
theological_decisions:
- issue: δοῦλοιの社会的身分の表現
  choice: 奴隷たち
  alternative: 僕たち／召使いたち
  rationale: この箇所は奴隷制について教えるものではないが、主人に属する者という原文の社会的関係を弱めずに示した。
- issue: κύριεの呼びかけ
  choice: ご主人様
  alternative: 主よ
  rationale: ここではたとえの中の家の主人に対する呼称であるため、神学的称号に限定して読ませない文脈的な訳を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。奴隷から主人への発話には敬語を用い、否定疑問と驚きの含みを自然に再現した。
