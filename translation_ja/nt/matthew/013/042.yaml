source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ja
  text: そして、彼らを燃える炉に投げ込む。そこでは、泣き叫びと歯ぎしりがある。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節からの連続を示す接続詞として、現代日本語で自然に保持した。
- source_word: βαλοῦσιν αὐτοὺς
  choice: 彼らを…投げ込む
  rationale: βάλλω の強い動作と、炉の中への移動を表す εἰς を自然な日本語で表現した。主語は前節から明らかなため補わない。
- source_word: τὴν κάμινον τοῦ πυρός
  choice: 燃える炉
  rationale: 直訳的な「火の炉」より自然であり、火の燃えている炉という具体的な裁きの比喩を保つ。後代の教理用語には置き換えない。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 直前の炉を指す場所の意味を簡潔かつ自然に保持した。
- source_word: ὁ κλαυθμὸς
  choice: 泣きわめき
  rationale: 単なる静かな涙に限定せず、κλαυθμός が示し得る声を伴う嘆きを明瞭に表す。
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: 歯ぎしりする
  rationale: 日本語で定着した対応表現を用い、悲嘆か怒りかのいずれか一方に意味を限定しない。
- source_word: ἔσται
  choice: …することになる
  rationale: 未来の事態を示すとともに、日本語では抽象名詞を重ねるより動詞化したほうが自然で明瞭である。
theological_decisions:
- issue: 「燃える炉」が表す裁きの性質
  choice: 具体的な炉と火の比喩をそのまま保持する
  alternative: 「地獄の火」などの教理用語で説明する
  rationale: 本文は終末的裁きの鮮烈な像を示すが、その像を後代の用語で特定してはいないため、過不足なく比喩を残した。
- issue: 「泣きわめき、歯ぎしりする」の感情的含意
  choice: 苦悶を示す定型表現として、感情を一つに限定しない
  alternative: 悲しみだけ、または怒りだけを表すように訳す
  rationale: この表現は悲嘆や苦痛、憤りを含み得るため、訳文でその神学的・感情的緊張を解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、裁きの厳粛さにふさわしい簡潔で dignified な調子を保った。名詞句の逐語訳を避け、日本語として自然な動詞表現にした。
