id: MAT.13.12
reference: Matthew 13:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: ja
  text: というのも、持っている人には与えられ、豊かになる[a]。しかし、持っていない人からは、持っているものまでも取り上げられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その人に与えられ、その人は豊かになる」。何を持ち、何が与えられるのかは、原文では明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: …人
  rationale: 不定関係代名詞が示す一般原則を、現代日本語で自然な「持っている人」「持っていない人」として表した。特定の性別には限定しない。
- source_word: γὰρ
  choice: …からである
  rationale: 直前の発言を説明する接続関係を、文末表現によって明確にした。
- source_word: ἔχει / οὐκ ἔχει
  choice: 持っている／持っていない
  rationale: 目的語を補わず、ギリシア語にある広がりと文脈上の含みを保持した。
- source_word: δοθήσεται αὐτῷ
  choice: …人には与えられ
  rationale: 受動態と与えられる相手を保持した。「さらに」を本文に補わず、原文が何を与えるか明示していないことを尊重した。
- source_word: περισσευθήσεται
  choice: 豊かになる
  rationale: περισσεύω の、満ちあふれるほどになるという結果を簡潔で自然な日本語にした。
- source_word: δὲ
  choice: しかし
  rationale: 二つの対照的な場合を明瞭につなぐ逆接として訳した。
- source_word: καὶ ὃ ἔχει
  choice: 持っているものまでも
  rationale: καί の強意的な働きを「までも」で表し、逆説的な強調を保持した。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 取り上げられる
  rationale: 将来受動の除去・剝奪の意味を、簡潔で慣用的な日本語で表した。
theological_decisions:
- issue: 「持っている」の暗黙の目的語
  choice: 本文では目的語を補わない
  alternative: 理解、受容する心、御国の奥義などを明記する
  rationale: 文脈はイエスの教えや天の御国の奥義への受容と理解に関係するが、ギリシア語自体は目的語を明示していないため、その解釈上の幅を残した。
- issue: 与えられるものの量
  choice: 原文どおり「与えられ」とし、「さらに多く」を本文に補わない
  alternative: 「さらに多く与えられ」
  rationale: 「さらに多く」は対照と後続の「豊かになる」から自然に含意されるが、ギリシア語には対応する比較表現がないため、本文では明示しなかった。
- issue: 男性単数形の一般的用法
  choice: 性別を示さない日本語の「人」と文脈上の省略で表す
  alternative: 男性代名詞に当たる表現を反復する
  rationale: ギリシア語の男性単数はここでは一般的・代表的に用いられている。日本語では「人」がその一般性を正確かつ自然に表し、性別を変更する複数化も必要ない。
translation_notes:
  register: 明快な現代標準日本語を用い、格言的な簡潔さと厳粛さを保った。「からである」を文末に置いて、γὰρ が直前の文を説明する働きを自然な日本語で示した。
