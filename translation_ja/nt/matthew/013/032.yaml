id: MAT.13.32
reference: Matthew 13:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: ja
  text: それは、あらゆる種よりも小さいが、成長すると、畑のどの植物よりも大きくなって木となり、空の鳥[a]が来て、その枝に巣を作るほどになる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「空を飛ぶ鳥」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 鳥が枝に宿る情景は、大きな王国を木として描く旧約聖書の表現（例えば、エゼキエル書17章23節、ダニエル書4章12節）を思わせる可能性がある。ただし、この節自体はその象徴的意味を明言していない。
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: あらゆる種よりも小さい
  rationale: 比較級の形を保ちながら、πάντωνを含む比較を自然な現代日本語で表した。植物学上の厳密な最小性を訳文に持ち込まず、たとえの対比をそのまま示す。
- source_word: μέν ... δέ
  choice: …小さいが、…
  rationale: 小さな始まりと大きな成長との対比を、日本語で簡潔かつ自然に示した。
- source_word: ὅταν ... αὐξηθῇ
  choice: 成長すると
  rationale: 成長が実現した時点を条件的に示す表現として、自然な日本語にした。
- source_word: μεῖζον τῶν λαχάνων
  choice: 畑のどの植物よりも大きく
  rationale: λάχαναは栽培される草本・園芸植物を指し得るため、「野菜」に狭めず、比較対象が分かる表現とした。
- source_word: γίνεται δένδρον
  choice: 木となり
  rationale: 原文の鮮明な「木になる」という像を弱めずに訳した。
- source_word: ὥστε ἐλθεῖν
  choice: 来て…ほどになる
  rationale: ὥστε不定詞の結果の意味を、日本語の「…ほどになる」で自然に表した。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: οὐρανόςの文脈上の意味を「空」とし、簡潔で自然な聖書日本語にした。
- source_word: κατασκηνοῦν
  choice: 巣を作る
  rationale: 鳥が枝に宿るという文脈で、動作を明瞭かつ自然に表す。語義には「宿る」も含まれるため、別訳の余地は脚注で示した。
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: その枝に
  rationale: 木を受ける所有関係と場所を、自然な日本語で明示した。
theological_decisions:
- issue: 大木の枝に鳥が宿るという旧約的なイメージの可能性
  choice: 本文では鳥と木のイメージを文字どおりに保ち、象徴の意味を明示しない。
  alternative: 鳥を諸国民または神の国に安息を見いだす人々の象徴として本文中で解釈する。
  rationale: エゼキエル書17章23節やダニエル書4章12節などとの響き合いは考えられるが、この節自体はその象徴を説明していないため、解釈を本文に加えず脚注で可能性のみを示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「畑の植物」は専門的すぎず、λάχαναの範囲を不必要に「野菜」へ限定しない。「巣を作るほどになる」により、成長の結果として鳥が来るという流れを自然に示した。
