id: MAT.13.15
reference: Matthew 13:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: ja
  text: というのも、この民の心は鈍くなり、耳では聞き取りにくくなり、目を閉じた。彼らが目で見、耳で聞き、心で悟り、立ち返って、わたしが彼らを癒やすことのないように。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耳では聞き取りにくくなり」は、直訳では「耳で重く聞いた」。
    reason: lexical_alternative
  - marker: b
    text: イザヤ書6章10節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: 鈍くなり
  rationale: 字義は「厚くなった、肥えた」だが、心について用いられ、感受性や理解力が鈍くなった状態を表す。自然な現代日本語で比喩的意味を保つ。
- source_word: καρδία
  choice: 心
  rationale: 理解や意志を含む内なる人を指す標準的な訳語であり、後続の「心で悟る」との対応も保てる。
- source_word: βαρέως ἤκουσαν
  choice: 耳では聞き取りにくくなり
  rationale: 直訳的には「耳で重く聞いた」。聞くことが困難または鈍重になった状態を、過度に解釈せず自然な日本語で示す。
- source_word: ἐκάμμυσαν
  choice: 目を閉じてしまった
  rationale: 人々自身が目を閉じたという能動的な行為を保ち、完了した行為の現在的な結果も表す。
- source_word: μήποτε
  choice: …ことのないため
  rationale: 否定的な目的・結果を導く表面上の強い構文を保ち、神の裁きと人間の責任をめぐる緊張を訳文で解消しない。
- source_word: συνῶσιν
  choice: 悟って
  rationale: 単なる情報理解ではなく、心による洞察を表す文脈に適した自然な訳語。
- source_word: ἐπιστρέψωσιν
  choice: 立ち返り
  rationale: 方向転換・帰還の意味を保ち、悔い改めの含意を許しつつ、教会用語的な「回心する」を持ち込まない。
- source_word: ἰάσομαι
  choice: わたしが彼らを癒やす
  rationale: 未来形の内容を従属節内で自然な日本語にしつつ、「癒やす」という原語の基本的意味を保つ。
theological_decisions:
- issue: μήποτε以下における神の裁きと人間の責任の緊張
  choice: 「それは…ことのないためである」とし、人々が自ら目を閉じたことも明示する
  alternative: 「そうでなければ…立ち返り、わたしは彼らを癒やすだろう」
  rationale: 原文の否定的目的・結果の表面上の力を弱めず、人々の能動的責任も残す。目的、結果、皮肉的描写のいずれかに一義的に決めない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「目で見、耳で聞き、心で悟る」という原文の反復と身体語彙を保持した。脚注標識は節末にまとめ、本文中にすべて表示した。
