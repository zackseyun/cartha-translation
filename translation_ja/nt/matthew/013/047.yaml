id: MAT.13.47
reference: Matthew 13:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: ja
  text: また、天の国は、海に投げ入れられ、あらゆる種類の魚[a]を集める地引き網[b]に似ている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あらゆる種類から集める」。原文に「魚」という語はないが、漁の情景から含意されている。
    reason: lexical_alternative
  - marker: b
    text: より一般的には「網」。原語は、水中を引いて魚を捕る大型の網を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: また
  rationale: 一連のたとえの中で、次のたとえを導入する副詞。現代日本語として簡潔で自然な「また」とした。
- source_word: ὁμοία ἐστὶν
  choice: 似ている
  rationale: 比較を表す定型句を、比喩であることが明確に伝わる自然な日本語にした。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を「神の国」などに置き換えず保持しつつ、現代日本語で明瞭な形にした。
- source_word: σαγήνῃ
  choice: 地引き網
  rationale: 一般的な網ではなく、水中を引いて多くの魚を捕る大型の網を指すため、具体的な種類が伝わる語を選んだ。
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: 海に投げ入れられ
  rationale: 受動の分詞と「海へ」という方向を保ち、漁の情景に合う自然な表現にした。
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: あらゆる種類の魚を集める
  rationale: 原文では集める対象が省略されているが、漁の比喩から魚が含意される。日本語で意味を明瞭にするため補い、脚注で明示した。
theological_decisions:
- issue: 「天の国」の表現
  choice: マタイ固有の「天の国」を保持する
  alternative: 神の国／天の支配
  rationale: 原文の特徴的な言い回しを保ち、別表現への置換によって神学的意味を先取りしないため。
- issue: 網が集める対象
  choice: 文脈上含意される「魚」を本文で補う
  alternative: 対象を明示せず「あらゆる種類のものを集める」とする
  rationale: 原文の省略を脚注で示しながら、漁の情景を普通の日本語で明瞭に伝えるため。魚の種類の選別や象徴的意味までは本文に付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御国」のような教会内に偏りやすい語を避けて「天の国」とし、漁の具体的な情景は「地引き網」で伝えた。
