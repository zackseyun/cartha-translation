  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: ja
  text: 「あなたがたは、これらのことをすべて理解しましたか[a]。」彼らはイエスに、「はい」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらのことがみな分かりましたか」とも訳せる。
    reason: Συνήκατεは、ここまでに理解したかを問う表現であり、日本語では「理解しましたか」のほか「分かりましたか」とも自然に表せるため。
lexical_decisions:
- source_word: Συνήκατε
  choice: 理解しましたか
  rationale: アオリスト直説法二人称複数の問いを、ここまで語られた事柄を理解したかと確かめる自然な現代日本語で表した。単なる現在の状態に限定せず、それまでの教えを受けた時点での理解を問う含みを保つ。
- source_word: ταῦτα πάντα
  choice: これらのことをみな
  rationale: 指示代名詞の中性複数と「すべて」の組み合わせを明示し、直前までの教えやたとえ全体を指す表現とした。
- source_word: λέγουσιν αὐτῷ
  choice: 彼らはイエスに…と言った
  rationale: 歴史的現在は、日本語の物語として自然な過去形にした。αὐτῷの相手は文脈上イエスなので、代名詞の曖昧さを避けるため固有名で明示した。
- source_word: Ναί
  choice: はい
  rationale: 肯定の小辞だけを簡潔に訳し、原文にない敬称を加えなかった。
theological_decisions:
- issue: 返答に敬称を補うか
  choice: 「はい」だけを訳す
  alternative: 「はい、主よ」などとする
  rationale: SBLGNT本文には肯定の小辞 Ναί しかなく、敬称を補う本文上の根拠がないため、簡潔な返答を保った。
translation_notes:
  register: 平明で現代的な標準日本語を用いながら、イエスの問いと簡潔な返答の調子を保った。「理解しましたか」は日常語として通じつつ、教えを把握したかを問う文脈にもふさわしい。
