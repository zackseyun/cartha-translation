id: MAT.13.2
reference: Matthew 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: ja
  text: すると、大勢の群衆がイエスのもとに集まって来たので、イエスは舟に乗って座った。群衆は皆、岸辺に立っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「岸辺」は「浜辺」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: イエスのもとに集まって来た
  rationale: 受動形はここでは自発的に集まる意味として自然に理解でき、πρόςの方向性も「もとに……来た」で表した。代名詞は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: ὄχλοι πολλοί
  choice: 大勢の群衆
  rationale: 複数形とπολλοίが示す多数性を、自然な現代日本語で表した。
- source_word: ὥστε
  choice: ので
  rationale: 群衆が集まったことの結果としてイエスが舟に乗る流れを、自然な因果・結果表現で示した。
- source_word: εἰς πλοῖον ἐμβάντα
  choice: 舟に乗って
  rationale: 舟の中へ入る動作を日本語では簡潔かつ自然に「舟に乗る」と表現できる。
- source_word: καθῆσθαι
  choice: 座った
  rationale: 結果構文の中心動作を簡明に表し、「腰を下ろした」ほど動作の細部を強調しない訳とした。
- source_word: πᾶς ὁ ὄχλος
  choice: 群衆は皆
  rationale: 先の複数の群衆を一つの集合として受ける単数形と、πᾶςの全体性を自然に表した。
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: 岸辺に
  rationale: αἰγιαλόςは水際の岸・浜を指すため、場所を限定しすぎない「岸辺」を本文に採用した。
- source_word: εἱστήκει
  choice: 立っていた
  rationale: 過去完了形が描く継続的な立位の情景を、日本語の「ていた」で自然に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシア語の結果関係と、イエスが舟に座り群衆が岸に立つ場面の対照を自然な語順で示した。
