source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: ja
  text: また、天の御国は、良質の真珠を探し求める商人に似ている。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν
  choice: また
  rationale: 一連のたとえの中で、もう一つの比較を導入する語。現代日本語では「また」が自然で、文脈の連続性も保てる。
- source_word: ὁμοία ἐστὶν
  choice: 似ている
  rationale: たとえによる比較を簡潔かつ自然に表す。「たとえられる」より直接的で、原文の比喩表現を保つ。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の御国
  rationale: マタイに特徴的な表現を、現代日本語の聖書文体として明瞭かつ品位ある形で表した。「御国」は神の王としての支配と領域の双方を過度に限定しない。
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: 商人
  rationale: ἔμποροςが人物を商人と特定しているため、ἀνθρώπῳを別に「人」と重ねず、日本語として自然にまとめた。比較の直接の対象が商人であることは保持した。
- source_word: ζητοῦντι
  choice: 探し求める
  rationale: 継続して求めている活動を表す現在分詞の含みを保ち、「探す」以上の意志的な追求を自然な日本語で示す。
- source_word: καλοὺς μαργαρίτας
  choice: 良質の真珠
  rationale: καλόςはここでは単なる外見上の美しさより、商品としての優れた品質を指す。「良質の真珠」が商取引の文脈に適し、価値そのものを明示しすぎない。
theological_decisions:
- issue: たとえの比較対象の範囲
  choice: 天の御国を、直接には良質の真珠を探す商人にたとえる。
  alternative: 天の御国を、商人が良質の真珠を探す一連の状況全体にたとえる。
  rationale: ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳという統語構造では、直近の比較対象は商人である。ただし、たとえの意味を商人だけに限定せず、続く物語全体が比較に関わり得る余地を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、たとえ話にふさわしい簡潔で品位ある調子とした。「良い真珠」より意味が明確な「良質の真珠」を採用し、商人の継続的・意志的な探索を「探し求める」で表した。
