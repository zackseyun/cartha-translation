  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: ja
  text: 網が魚でいっぱいになると[a]、人々はそれを岸に引き上げ、座って、良い魚を入れ物[b]に集め、傷んだ魚は外に投げ捨てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「それが満たされた時」。ここでは前節の網が魚でいっぱいになったことを指す。
    reason: referent_clarification
  - marker: b
    text: 「容器」とも訳せる。ギリシア語は籠に限定されない一般的な入れ物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: 網がいっぱいになると
  rationale: 関係代名詞ἣνの先行詞である前節の「網」を日本語では補い、時を表すὅτεと受動形ἐπληρώθηを自然な叙述にした。誰が満たしたかを特定せず、網が魚で満ちた状況を表す。
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: それを岸に引き上げ
  rationale: 網を水中から陸へ上げる動作を明確にし、αἰγιαλόςは砂浜に限定しない「岸」とした。
- source_word: καθίσαντες
  choice: 座って
  rationale: 分詞が示す動作の順序を、現代日本語で自然な接続表現にした。
- source_word: συνέλεξαν τὰ καλά
  choice: 良い魚を…集め
  rationale: τὰ καλάは直訳すれば「良いもの」だが、漁の文脈から指示対象の「魚」を補って明瞭にした。
- source_word: εἰς ἄγγη
  choice: 入れ物に
  rationale: ἄγγηは籠に限定されない一般的な容器を指すため、広い意味を保つ「入れ物」とした。
- source_word: τὰ δὲ σαπρά
  choice: 悪いものは
  rationale: σαπρόςには「腐った、傷んだ、役に立たない」という幅がある。魚が文字どおり腐敗していると断定せず、文脈上の選別基準を広く保つ「悪いもの」とした。
- source_word: ἔξω ἔβαλον
  choice: 外に投げ捨てた
  rationale: 外へ放り出して排除する動作の強さを、自然な現代日本語で表した。
theological_decisions:
- issue: たとえにおける選別の解釈
  choice: 漁と魚の選別という具体的情景のまま訳す
  alternative: 後続する終末の裁きの説明を先取りした解釈的表現にする
  rationale: この節自体はたとえの情景を語り、その解釈は後続節で示されるため、本文には終末論的対象を持ち込まない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。分詞の連続は日本語の自然な動作順に整えた。本文中の脚注記号[a]、[b]は各注と対応している。
