review_pass:
  verdict: revise
  source_fidelity: Ὡμοιώθη is an aorist passive and, in Matthew's parable formula, idiomatically introduces a comparison. The draft's 「人にたとえられる」 preserves passive form but can misleadingly make the individual man alone the direct and exhaustive referent of 「天の国」. 「人のようなものである」 naturally carries the formula's comparison and leaves the ensuing parable as its effective scope.
  naturalness: 「別のたとえを彼らに示して、こう言われた」 is clear modern standard Japanese. Recasting the comparison as 「人のようなものである」 is substantially more natural than 「人にたとえられる」 in this context.
  terminology: 「天の国」 appropriately renders Matthew's characteristic ἡ βασιλεία τῶν οὐρανῶν in clear modern Japanese. 「良い種」「畑」 are accurate and natural. The revised note retains the relevant formal observation without forcing a theological interpretation.
  issues:
  - severity: medium
    issue: 「天の国は…人にたとえられる」
    rationale: Although formally possible as a rendering of the passive verb, this Japanese wording tends to state that the kingdom itself is compared specifically to a man. In Matthew's conventional parable introduction, the comparison unfolds through the situation narrated about the man; an idiomatic comparison expression better preserves that scope.
  revised_text: また、別のたとえを彼らに示して、こう言われた。「天の国は、自分の畑に良い種を蒔いた人のようなものである[a]。」
  revised_footnotes:
  - marker: a
    text: 直訳「天の国は、自分の畑に良い種を蒔いた人にたとえられた」。原文は受動形であるが、マタイによく見られるたとえの導入句であり、ここでは続くたとえ全体との比較を導く表現として理解できる。
    reason: 原文の受動形を示すとともに、日本語本文の慣用的な比較表現が、比較の対象を人物だけに限定しないことを明らかにするため。
  revision_rationale: 本文をマタイのたとえ導入句として自然で誤解の少ない日本語に改めた。受動形という原文上の特徴と比較範囲に関する説明は脚注に保持し、本文に不自然な受動表現を残さなかった。
