id: MAT.13.24
reference: Matthew 13:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: ja
  text: また、別のたとえを彼らに示して、こう言われた。「天の国は、自分の畑に良い種を蒔いた人のようなものである[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「天の国は、自分の畑に良い種を蒔いた人にたとえられた」。原文は受動形であるが、マタイによく見られるたとえの導入句であり、ここでは続くたとえ全体との比較を導く表現として理解できる。
    reason: 原文の受動形を示すとともに、日本語本文の慣用的な比較表現が、比較の対象を人物だけに限定しないことを明らかにするため。
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: 別のたとえ
  rationale: 直前までのたとえに続いて、さらに一つのたとえが提示されることを自然な現代日本語で表す。
- source_word: παρέθηκεν αὐτοῖς
  choice: 彼らに示して
  rationale: παρατίθημι の「前に置く、提示する」という比喩的用法を、教えを提示する場面に合う明瞭な日本語で表した。
- source_word: λέγων
  choice: こう言われた
  rationale: 分詞による引用導入を日本語の物語文として自然に整え、敬意を保つ表現とした。
- source_word: Ὡμοιώθη
  choice: たとえられる
  rationale: 受動形を保ちつつ、マタイのたとえ導入句として自然に読める表現を採用した。時制上の変化を過度に強調しない。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイ特有の表現を、簡潔で現代の一般読者にも理解しやすい日本語にした。「国」は領域だけでなく王としての支配も含み得る。
- source_word: ἀνθρώπῳ
  choice: 人
  rationale: ἄνθρωπος の基本的な意味を反映する。日本語では「人」が自然であり、原文以上に性別を強調しない。
- source_word: σπείραντι καλὸν σπέρμα
  choice: 良い種を蒔いた
  rationale: 完了した播種行為と、後続箇所で悪いものと対照される種の良質さを明確に表した。
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: 自分の畑に
  rationale: αὐτοῦ が種を蒔いた人に属することを、日本語で曖昧にならないよう「自分の」とした。
theological_decisions:
- issue: マタイの「天の国」という表現
  choice: 天の国
  alternative: 天の御国／天々の国
  rationale: 複数形 οὐρανῶν を日本語で不自然に直訳せず、神の支配を指すマタイの定型表現を簡潔に保った。特定の教派的含意は加えていない。
- issue: Ὡμοιώθη の受動形とたとえの比較範囲
  choice: 人にたとえられる
  alternative: 人のようなものである
  rationale: 原文の受動形を見える形で残した。ただし、この句は天の国と人物だけを単純に同一視するというより、続く物語全体を比較対象とするたとえの導入句として理解できるため、別訳を注記した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「御国」のような教会内でなじみ深い語よりも一般読者に直接伝わる「天の国」を選び、引用導入では日本語として自然な敬語を用いた。
