  to: また、別のたとえを彼らに示して、こう言われた。「天の国は、自分の畑に良い種を蒔いた人のようなものである[a]。」
  rationale: 本文をマタイのたとえ導入句として自然で誤解の少ない日本語に改めた。受動形という原文上の特徴と比較範囲に関する説明は脚注に保持し、本文に不自然な受動表現を残さなかった。
