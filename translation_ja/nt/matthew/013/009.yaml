  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ja
  text: 耳のある者は、聞きなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ある者は
  rationale: 定冠詞を伴う現在分詞が名詞的に用いられ、該当する人を一般的に指している。「者」は単数の代表的・総称的な性格を保ちつつ、性別を限定しない自然な日本語となる。
- source_word: ὦτα
  choice: 耳
  rationale: ギリシア語は「耳」の複数形だが、日本語では身体器官を通常「耳」と言えば両耳を含み、数を明示しなくても原文の意味を自然に伝えられる。
- source_word: ἀκουέτω
  choice: 聞きなさい
  rationale: 三人称単数の現在命令形が持つ勧告・命令の力を、現代日本語として明瞭な「聞きなさい」で表した。「聞く」は音を耳にすることだけでなく、注意して受け止めるという文脈上の含意も保つ。
theological_decisions:
- issue: 総称的な男性単数形
  choice: 耳のある者は
  alternative: 耳のある人は／耳のある者はだれでも
  rationale: ギリシア語の男性単数形は特定の男性ではなく、人一般を指す。日本語の「者」は性別を限定せず、原文の単数的・総称的な表現を保てるため、性別に関する注記は不要と判断した。
- issue: 「聞く」の含意
  choice: 聞きなさい
  alternative: 耳を傾けなさい／よく聞きなさい
  rationale: 文脈上は理解し受け入れることを促すが、原語ἀκούω自体の比喩的な広がりを保つため、解釈を明示しすぎる表現は避けた。
translation_notes:
  register: 簡潔で格調を保ちながら、現代の一般読者に自然に通じる命令表現とした。日本語では総称表現に性別上の問題が生じず、英語版の脚注に相当する注は不要である。
