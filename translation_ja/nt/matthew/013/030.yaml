  naturalness: 改訂文は明瞭な現代標準日本語であり、たとえ話の主人の命令として自然である。「束に縛りなさい」は、原文の「束にして縛る」という具体的動作を明示する。
  terminology: 「毒麦」は伝統的で、ここでは有害な雑草を指す用法として使用可能である。ただし植物学的な同定は確定しないため、注で「考えられる」として限定する現行方針が適切である。「倉」はἀποθήκηの農業的文脈に合う。
