  to: 両方とも、刈り入れまで一緒に育つままにしておきなさい。刈り入れの時になったら、私は刈り取る者たちにこう言おう。『まず毒麦[a]を集め、焼くために束に縛りなさい。しかし、小麦は私の倉に納めなさい。』
