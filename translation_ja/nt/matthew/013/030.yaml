source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: ja
  text: 両方とも、刈り入れまで一緒に育つままにしておきなさい。刈り入れの時になったら、私は刈り取る者たちにこう言おう。『まず毒麦[a]を集め、焼くために束に縛りなさい。しかし、小麦は私の倉に納めなさい。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「毒麦」は、小麦によく似た有害な雑草を指すと考えられる。単に「雑草」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: 両方とも……一緒に育たせておきなさい
  rationale: ἄφετε＋不定詞の許容を表す命令と、συν-（一緒に）の意味を、自然な現代日本語で明示した。
- source_word: μέχρι τοῦ θερισμοῦ
  choice: 刈り入れの時まで
  rationale: θερισμόςを農作業として明瞭な「刈り入れ」とし、定まった時点までという意味を保った。
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: 刈り入れの時になったら
  rationale: καιρόςが表す時機を、物語の流れに合う自然な条件・時間表現で訳した。
- source_word: τοῖς θερισταῖς
  choice: 刈り取る者たち
  rationale: 作業者を指す語義を明確にしつつ、一般読者にも理解しやすい表現とした。
- source_word: τὰ ζιζάνια
  choice: 毒麦
  rationale: 小麦に似た有害な雑草を指す語の具体性と、たとえの対比を保った。植物同定には幅があるため注を付した。
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: 束にしなさい
  rationale: 「それらを束へと縛る」という動作を、簡潔で自然な日本語にした。
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: 焼くために
  rationale: 目的を表す構文を保持し、たとえの農業的描写を過度に解釈しなかった。
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: しかし、小麦は私の倉に納めなさい
  rationale: δέの対照を「しかし」で示し、συναγάγετε εἰςを日本語として自然な「納める」で表した。
theological_decisions:
- issue: 最終的な分離を示すたとえのイメージ
  choice: 農作業の描写をそのまま保ち、終末の裁きを訳文中で明示しない
  alternative: 「滅ぼすため」「完全に焼き尽くすため」など、後に示される解釈を前面に出す
  rationale: この節では語られたたとえ自体を訳し、その後の解き明かしを先取りしないことで、本文の展開と神学的緊張を保持した。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。命令形は「〜なさい」で統一し、農業的なたとえを平易に保った。
