  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: ja
  text: 彼が種をまいていると、その一部は道端に落ち[a]、鳥が来てそれらを食べ尽くした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あるものは道端に落ち」。文脈から、まかれた種の一部を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: 種をまいていると
  rationale: ἐν＋定冠詞付き不定詞は同時の時を表す。日本語では「種をまいていると」が自然で、動作の進行中に次の出来事が起きたことを示す。
- source_word: ἃ μὲν
  choice: ある種
  rationale: 原文は直訳すれば「あるものは」という中性複数で、文脈上「種」を指す。日本語で意味を明確にするため、名詞「種」を補った。
- source_word: ἔπεσεν
  choice: 落ち
  rationale: 物語中のアオリストであり、単純な出来事として「落ち」と訳す。
- source_word: παρὰ τὴν ὁδόν
  choice: 道端に
  rationale: παρά＋対格は道のそばの位置を示す。「道端」は農地を通る道の脇を自然かつ簡潔に表す。
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: 鳥が来て
  rationale: アオリスト分詞を、出来事の順序が自然に伝わる連用表現とした。πετεινάはここでは簡潔に「鳥」と訳し、原文にない「空の」を補わない。
- source_word: κατέφαγεν
  choice: 食べ尽くした
  rationale: κατεσθίωの、すっかり食べるという強意を表す。「食べた」より原語の力を保ちつつ、現代日本語として自然である。
- source_word: αὐτά
  choice: （「食べ尽くした」の目的語として省略）
  rationale: 指示対象は落ちた種で明白であり、日本語では目的語を繰り返さなくても自然に伝わる。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で品位ある物語調とした。「道端」「食べ尽くした」により、農耕の場面と原文の動作の強さを自然に表現した。
