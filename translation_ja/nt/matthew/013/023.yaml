reference: Matthew 13:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: ja
  text: しかし、良い土[a]の上にまかれたものとは、ことばを聞いて悟る人のことである。その人は確かに実を結び、ある人は百倍、ある人は六十倍、ある人は三十倍の実りを生み出す[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「良い地」または「良い土地」とも訳せる。ここでは農耕の文脈に合わせて「土」とした。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「あるものは百、あるものは六十、あるものは三十」。文脈上、実り（収穫）の量が異なることを指す。「百倍、六十倍、三十倍」はその意味を明確にする訳し方である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: 良い土の上に
  rationale: 農耕のたとえに即して γῆ を「土」とした。καλή は道徳的な善というより、種が育つのに適した良質な土を表す。「上に」は ἐπί と対格の表現を保つ。
- source_word: σπαρείς
  choice: まかれたもの
  rationale: アオリスト受動分詞の比喩を保ちつつ、後続する「ことばを聞いて悟る人」へ自然につなげた。
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ことばを聞いて…人
  rationale: λόγος を解釈的な「福音」や「教え」に限定せず、「ことば」として文脈上の含みを保った。現在分詞はその人の特徴的な応答として自然な日本語にした。
- source_word: συνιείς
  choice: 悟る
  rationale: 単に音声を聞くだけでなく、意味を理解することを表す。「理解する」も可能だが、たとえの霊的・認識的文脈に適した自然な「悟る」を選んだ。
- source_word: δὴ
  choice: 確かに
  rationale: この人こそ実を結ぶという強調を、過度に重くせず明示した。
- source_word: καρποφορεῖ
  choice: 実を結び
  rationale: 農耕の像と弟子の応答を重ねる比喩をそのまま保った。
- source_word: ποιεῖ
  choice: 実りを生み出す
  rationale: καρποφορεῖ と ποιεῖ の二つの動詞を一つに畳まず、前者を「実を結ぶ」、後者を収穫量を「生み出す」と訳し分けた。
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ある人は百倍、ある人は六十倍、ある人は三十倍
  rationale: 分配を示す構文を明確にし、農作物の収量として日本語で自然な「倍」を補った。原文に「倍」に相当する語が明記されていない点は脚注で示した。
theological_decisions:
- issue: ことばへの応答の性質
  choice: 良い土に対応する人を、ことばを聞き、悟り、実を結ぶ人として記述する。
  alternative: 忍耐、真の回心、再生の証拠などの教理的概念を訳文で明示する。
  rationale: 本文は聞くこと、悟ること、実を結ぶことを述べるが、それらを後代の特定の教理用語で定義してはいないため、本文自身の緊張と範囲を保った。
- issue: 実りの量の違い
  choice: 人によって百倍、六十倍、三十倍と異なる実りを生み出すと訳す。
  alternative: 数字を霊的な階級や報いの厳密な区分として解釈する。
  rationale: 本文は実りの多様な量を述べるにとどまり、その数字の教理的な対応関係を説明していないため、解釈を加えなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、たとえの農耕的な比喩と格調を保った。「ことば」「悟る」「実を結ぶ」は聖書的な響きを持つが、一般の読者にも理解できる表現である。
