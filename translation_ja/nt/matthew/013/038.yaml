id: MAT.13.38
reference: Matthew 13:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: ja
  text: 畑は世界です。良い種とは、御国に属する者たち[a]です。毒麦[b]とは、悪い者に属する者たちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「御国の子ら」。御国に属する人々を指す表現です。
    reason: cultural_note
  - marker: b
    text: 小麦によく似た雑草のドクムギ。伝統的に「毒麦」と訳されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: 畑
  rationale: 農業のたとえの具体的な情景を、自然で一般的な現代日本語で保つ。
- source_word: κόσμος
  choice: 世界
  rationale: 種がまかれる領域全体を広く指す語として、通常かつ明瞭な訳語。
- source_word: καλὸν σπέρμα
  choice: 良い種
  rationale: 農業的比喩を保ち、毒麦との対照を明確にする。
- source_word: οἱ υἱοὶ τῆς βασιλείας
  choice: 御国に属する者たち
  rationale: 直訳的な「御国の子ら」が持つセム語的な所属・関係の意味を、現代日本語で誤解なく伝える。男女双方を指す代表的表現であることも自然に示す。
- source_word: ζιζάνια
  choice: 毒麦
  rationale: 小麦に似た有害な雑草（ドクムギ）を指す語として、日本語聖書の文脈でも理解されやすく、単なる「雑草」より原語の具体性を保つ。
- source_word: οἱ υἱοὶ τοῦ πονηροῦ
  choice: 悪い者に属する者たち
  rationale: 「子ら」という関係表現の所属の意味を自然な日本語で表し、τοῦ πονηροῦの人格的な指示も保つ。
theological_decisions:
- issue: τοῦ πονηροῦが抽象的な「悪」か、人格的な「悪い者」か
  choice: 悪い者
  alternative: 悪
  rationale: 定冠詞を伴う男性単数属格であり、対立する集団を説明するこの文脈では人格的な指示対象と読むのが自然。ただし本文が明示する以上に「サタン」などと特定しない。
- issue: υἱοὶを字義どおり「子ら」とするか、所属関係を明示するか
  choice: 〜に属する者たち
  alternative: 〜の子ら
  rationale: この表現は実際の親子関係ではなく、御国または悪い者との関係・所属を表す。自然で明瞭な現代日本語を優先し、原語の比喩は脚注で示す。
translation_notes:
  register: 平易で明瞭な現代標準日本語。「です」を用いて、イエスによるたとえの説明として自然な口調にした。三つの対応関係を短い文に分け、原文の並行構造を明確にした。
