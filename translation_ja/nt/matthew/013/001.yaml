lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: その日
  rationale: 自然な現代日本語の時を示す表現であり、直前の出来事との連続を明示しすぎずに原文の時間的指示を保つ。
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: 家を出て
  rationale: アオリスト分詞と起点を示す属格を、日本語で自然な連用表現としてまとめた。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 人名を日本語聖書で広く定着した形に音写した。
- source_word: ἐκάθητο
  choice: 座っておられた
  rationale: 未完了過去の継続的・場面設定的な性格を「ていた」で表し、イエスについての自然で品位ある敬語を用いた。
- source_word: παρὰ τὴν θάλασσαν
  choice: 湖のほとりに
  rationale: 文脈上のガリラヤ湖を指す θάλασσα を、日本語で誤解の少ない「湖」とし、παρά の近接を「ほとり」で自然に表した。岸辺そのものとまでは限定しない。
