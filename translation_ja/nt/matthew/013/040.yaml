id: MAT.13.40
reference: Matthew 13:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: ja
  text: ですから、毒麦[a]が集められて火で焼かれるように、時代の終わりには、そのようになります。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「毒麦」は、麦に似た有害な雑草、おそらくドクムギを指す。単に「雑草」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「時代の終わり」。伝統的には「世の終わり」とも訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: ですから、…ように
  rationale: οὖνの推論・継続を「ですから」で、ὥσπερの比較を「…ように」で表し、直前の説明との論理的つながりを保った。
- source_word: συλλέγεται
  choice: 集められて
  rationale: 受動の意味を保ち、畑の雑草を処分のために集める文脈に自然な表現とした。
- source_word: τὰ ζιζάνια
  choice: 毒麦
  rationale: この語は穀物に似た有害な雑草、おそらくドクムギを指す。「毒麦」は日本語聖書で知られた簡潔な表現であり、単なる「雑草」より比喩の農耕的特徴を伝える。
- source_word: πυρὶ καίεται
  choice: 火で焼かれる
  rationale: πυρίの手段を「火で」と明示し、καίεταιの単純な受動を過度に強めずに表した。
- source_word: οὕτως ἔσται
  choice: そのようになります
  rationale: 先の比較を受けるοὕτωςと、未来のἔσταιを自然な現代日本語で表した。
- source_word: ἐν τῇ συντελείᾳ
  choice: 終わりに
  rationale: 終結・完成を表す語を、終末論的な文脈で明瞭かつ平易な「終わり」とした。
- source_word: τοῦ αἰῶνος
  choice: この時代の
  rationale: αἰώνの時間的意味を「時代」で保った。ギリシア語に指示詞はないが、日本語では限定された現行の時代を自然に示すため「この」を補ったことを脚注で明示した。
theological_decisions:
- issue: 終末論的表現 τοῦ αἰῶνος
  choice: この時代の終わり
  alternative: 世の終わり
  rationale: αἰώνの時間的・救済史的な含みを保ち、物理的世界そのものの消滅と断定しない。「この」は文脈上の現行時代を示す自然な補足だが、原文に明示されないため脚注を付した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ですから」で論理関係を明示し、比較構文は自然な「…ように、…そのようになります」とした。すべての脚注記号を本文に配置した。
