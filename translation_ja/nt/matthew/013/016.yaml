id: MAT.13.16
reference: Matthew 13:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: ja
  text: しかし、あなたがたの目は幸いです。見ているからです。あなたがたの耳も幸いです。聞いているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見ているのですから……聞いているのですから」とも訳せる。ここで用いられているギリシア語の接続詞は、いずれの言い方にも訳しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の、見ても見ず、聞いても聞かない人々との対比を明確に示す。
- source_word: μακάριοι
  choice: 幸いです
  rationale: 単なる主観的な幸福感ではなく、神の恵みを受けた祝福された状態を表し、至福の宣言にふさわしい自然な日本語である。
- source_word: οἱ ὀφθαλμοὶ ὑμῶν / τὰ ὦτα ὑμῶν
  choice: あなたがたの目／あなたがたの耳
  rationale: ギリシア語の所有関係と並行構造を、明瞭で自然な日本語で保つ。
- source_word: ὅτι βλέπουσιν / ὅτι ἀκούουσιν
  choice: 見ているからです／聞いているからです
  rationale: ὅτιを理由を示す接続詞として訳し、単純な感覚動詞と両句の並行性を保つ。
- source_word: βλέπουσιν / ἀκούουσιν
  choice: 見ている／聞いている
  rationale: 「悟る」などを補わず、身体的感覚と霊的受容の双方に開かれた原文の表現を保つ。
theological_decisions:
- issue: 見ることと聞くことを、訳文で明示的に霊的理解として表すか
  choice: 「見ている」「聞いている」という感覚表現をそのまま用いる。
  alternative: 「見抜いている」「理解している」などと訳す。
  rationale: 文脈には霊的理解が含意されるが、この節自体は「見る」「聞く」と述べる。解釈を訳文に織り込まず、原文の神学的な含みと緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体を採用した。目と耳の並行性を自然に示すため、後半にも「幸いです」を補った。脚注記号は該当する二つの理由節をまとめて注記できるよう節末に置いた。
