  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: ja
  text: 人の子は自分の天使たちを遣わし、彼らはその国から、人をつまずかせるすべてのもの[a]と、不法を行う者たち[b]を集め出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「つまずきの原因となるすべてのもの」。ギリシア語は、人を罪に陥らせたり、信仰から離れさせたりするものを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「不法をなす者たち」。原文の表現は、不法な行いを特徴的に続ける者を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: 遣わす
  rationale: 未来形。使命を帯びて送り出す意味を、簡潔で自然な日本語で表した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: マタイにおける称号としての定着した訳であり、ダニエル書との関連も保つ。
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: 自分の御使いたち
  rationale: 終末の裁きという文脈では、人間の使者ではなく天的な御使いを指す。「自分の」は再帰的な所有関係を明確にする。
- source_word: συλλέξουσιν
  choice: 集め出す
  rationale: 収穫の比喩を保ちつつ、ἐκが示す御国の中からの除去も自然に表す。
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: その御国から
  rationale: 「その」は人の子を受け、御国の中から取り除くという起点を示す。「御国」は神的支配を指す聖書語として明瞭である。
- source_word: πάντα τὰ σκάνδαλα
  choice: 人をつまずかせるすべてのもの
  rationale: 罪や離反へ導く原因という能動的意味を伝え、物・影響・場合によっては人を含み得る原語の幅を保つ。
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: 不法を行う者たち
  rationale: 原文の「不法を行う」という表現を保つ。現在分詞が示し得る継続的・特徴的な行為は脚注で補足する。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου の称号
  choice: 人の子
  alternative: 人間である者
  rationale: 伝統的な称号を維持し、ダニエル書7章を含む黙示的な響きを失わないようにした。
- issue: σκάνδαλα の範囲
  choice: 人をつまずかせるすべてのもの
  alternative: すべてのつまずき／すべてのつまずきとなるもの
  rationale: 人、物、影響など、罪へ導く原因全般を含み得る曖昧さを保ち、単なる感情的な「不快」には狭めなかった。
- issue: ἀνομία の道徳的・神学的意味
  choice: 不法
  alternative: 悪
  rationale: 神の意志や律法に背くという語感を保ち、一般的な「悪」へ広げすぎないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、終末の裁きにふさわしい簡潔で荘重な調子を保った。「御使い」「御国」は一般読者にも通じる聖書的語彙として採用した。
