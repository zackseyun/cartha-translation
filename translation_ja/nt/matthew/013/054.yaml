id: MAT.13.54
reference: Matthew 13:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: ja
  text: イエスは故郷に行き、彼らの会堂で人々を教えておられた。そのため、人々は非常に驚いて言った。「この人は、どこからこのような知恵と力あるわざ[a]を得たのだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は「力」（複数形）。ここでは、力の現れとしての驚くべきわざを指し、「奇跡」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: 故郷
  rationale: この文脈では、国土ではなく、イエスが育ち住民に知られていた土地を指す。現代日本語の「故郷」が自然で簡潔である。
- source_word: ἐδίδασκεν
  choice: 教えておられた
  rationale: 未完了過去の継続的な動作を表しつつ、現代の聖書文体として自然な敬意を保つ。
- source_word: συναγωγῇ
  choice: 会堂
  rationale: 当時のユダヤ人の礼拝・教育の場であるシナゴーグを指す。文脈上明瞭で、日本語聖書で広く理解される表現である。
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: すると、人々は驚いて言った
  rationale: ὥστεが示す結果を自然な日本語で表す。ἐκπλήσσεσθαιの強い驚きも「驚いて」で明瞭に伝わる。
- source_word: Πόθεν
  choice: どこから…得た
  rationale: 場所そのものより、知恵と力あるわざの出所を問う表現なので、「どこから…得た」が日本語として自然である。
- source_word: τούτῳ
  choice: この人
  rationale: 指示代名詞が帯びる距離感を保ち、群衆の発言として自然にした。
- source_word: σοφία
  choice: 知恵
  rationale: 語の基本的意味をそのまま明瞭に表す。
- source_word: δυνάμεις
  choice: 力あるわざ
  rationale: 語義の中心である「力」を保ちながら、この複数形が文脈上、力の現れとしての行為を指すことを自然な日本語で示す。「奇跡」より解釈を限定しない。
theological_decisions:
- issue: イエスの超常的な働きを指す δυνάμεις の訳し方
  choice: 力あるわざ
  alternative: 力／奇跡
  rationale: 「力」だけでは日本語で能力一般と誤解されやすく、「奇跡」は意味を具体化しすぎる可能性がある。「力あるわざ」は、神的な力の現れとしての行為という含みを保ち、本文の曖昧さを不必要に解消しない。
translation_notes:
  register: 明快な現代標準日本語を用い、語り口には節度ある品位を持たせた。「イエス」はギリシア語では代名詞だが、単独節として主語を明確にするため補った。英語資料では脚注記号が「hometown」に置かれている一方、脚注内容は δυνάμεις の訳語説明なので、日本語稿では対応する「力あるわざ」の後に配置した。
