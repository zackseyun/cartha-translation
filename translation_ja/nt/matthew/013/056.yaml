  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: ja
  text: また、その姉妹たちも皆、私たちと一緒にいるではないか。では、この人はこれらすべてをどこから得たのか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女性の親族たち」と解釈する見方もある。ギリシア語はここでは通常「姉妹たち」を意味するが、後代の神学的議論を踏まえて、より広い意味に取る人もいる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: 姉妹たち
  rationale: 文脈はイエスの家族を列挙しており、通常の家族関係を表す「姉妹」が最も自然で直接的である。日本語では複数であることを明示するため「たち」を添えた。
- source_word: οὐχὶ πᾶσαι
  choice: 皆、…いるではないか
  rationale: 肯定の答えを予想する修辞疑問として訳し、「皆」という全体への強調も保持した。
- source_word: πρὸς ἡμᾶς
  choice: 私たちと一緒にいる
  rationale: 共同体との結びつきや、その場にいることを表す自然な現代日本語。
- source_word: πόθεν
  choice: どこから
  rationale: 知恵や力の源・由来を問う語の意味を、そのまま明確に表す。
- source_word: οὖν
  choice: それなのに
  rationale: 話者たちは身近な家族背景とイエスの知恵や力との不釣り合いを問題にしているため、文脈上の推論を自然な日本語で示す。
- source_word: τούτῳ
  choice: この男は
  rationale: 指示語の距離感と、郷里の人々のやや見下した調子を保持する。「この人」よりも文脈の否定的な響きを伝える。
- source_word: ταῦτα πάντα
  choice: これらすべて
  rationale: 直前に語られた知恵と力ある業を広く指す複数表現を保つ。日本語では目的語が文脈から理解できるため「もの」を補わず自然にした。
theological_decisions:
- issue: イエスの「姉妹たち」が指す親族関係
  choice: ἀδελφαὶを通常の語義どおり「姉妹たち」と訳す。
  alternative: 女性の親族たち／いとこたち
  rationale: 家族を列挙する文脈では実の姉妹を指すのが最も自然である。後代の神学的議論に基づいて親族関係を広く解釈せず、本文が持つ緊張を残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある口調。修辞疑問の勢いを「いるではないか」で表し、話者の推論を「それなのに」で自然につないだ。脚注記号[a]を本文に明示した。
