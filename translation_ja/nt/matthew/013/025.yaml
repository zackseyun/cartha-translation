id: MAT.13.25
reference: Matthew 13:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: ja
  text: しかし、人々が眠っている間に、彼の敵が来て、麦の間に毒麦[a]をまき、立ち去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「毒麦」は、成長の初期には麦とよく似ている雑草（ドクムギ）を指す。
    reason: Modern readers may otherwise understand 「毒麦」 as poisoned wheat rather than the wheat-like weed denoted by ζιζάνια.
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: 人々
  rationale: ἄνθρωποι is generic in this context and refers naturally to the people present, likely the servants mentioned in the parable; Japanese 「人々」 preserves that sense without unnecessarily restricting it to adult males.
- source_word: ζιζάνια
  choice: 毒麦
  rationale: ζιζάνια denotes a weed resembling wheat, commonly identified as darnel. 「毒麦」 is the established concise Japanese biblical term, while the footnote clarifies the plant and its deceptive resemblance to wheat.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: 麦の間に
  rationale: Naturally and accurately expresses sowing the weeds throughout or among the standing wheat.
- source_word: ἀπῆλθεν
  choice: 立ち去った
  rationale: Conveys not merely movement away but the enemy's departure after completing the covert act.
theological_decisions:
- issue: Identity and gender of τοὺς ἀνθρώπους
  choice: 人々
  alternative: 男たち／しもべたち
  rationale: The Greek plural ἄνθρωποι can denote people generally, and the verse does not explicitly call them servants. 「人々」 preserves the source wording and avoids adding gender or role specificity.
translation_notes:
  register: 現代の一般読者に明快でありながら、たとえ話にふさわしい簡潔で品位ある文体とした。「しかし」で前節との対比を示し、敵の隠密な行為を自然な日本語で表現した。
source_grounding:
  english_pob_role: consult_only
