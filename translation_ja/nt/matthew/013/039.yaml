id: MAT.13.39
reference: Matthew 13:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: ja
  text: それを蒔いた敵は悪魔です。刈り入れは時代の終わり[a]であり、刈り入れる者たちは天使たちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「時代の完成」。伝統的には「世の終わり」。
    reason: συντέλειαは「終わり」だけでなく「完成、成就」の含みを持ち得、αἰώνはここでは時間的な「時代」を表すため。
lexical_decisions:
- source_word: ἐχθρὸς
  choice: 敵
  rationale: たとえの中で意図的に害を加える人格的な対抗者を示す、明瞭で自然な訳語。
- source_word: ὁ σπείρας αὐτά
  choice: それを蒔いた
  rationale: アオリスト分詞が敵をその行為によって特定している。「それ」は直前の複数の毒麦を集合的に受け、日本語として自然にした。
- source_word: διάβολος
  choice: 悪魔
  rationale: この文脈ではサタンを指す人格的呼称であり、語源的な「中傷する者」より指示対象が明確。
- source_word: θερισμός
  choice: 刈り入れ
  rationale: 農耕の比喩を保ちつつ、収穫という出来事・作業を自然に表す。
- source_word: συντέλεια αἰῶνος
  choice: この時代の終わり
  rationale: αἰώνの時間的意味を保ち、「世界の消滅」という含意を不用意に持ち込まない。「この」は定冠詞の機械的対応ではなく、文脈上の現時代を明示する自然な日本語。
- source_word: θερισταί
  choice: 刈り取る者たち
  rationale: θερισμόςとの語彙的つながりと農耕比喩を明瞭に保つ。
- source_word: ἄγγελοι
  choice: 天使たち
  rationale: 終末論的文脈では人間の使者ではなく天的存在を指す。
- source_word: δέ
  choice: 句点および「であり」による展開
  rationale: 反復されるδέは説明の進行を示すため、日本語では不自然な「しかし」の反復を避け、文の区切りと接続で表した。
theological_decisions:
- issue: 終末論的表現 συντέλεια αἰῶνος の訳し方
  choice: この時代の終わり
  alternative: この時代の完成／世の終わり
  rationale: συντέλειαには終結・完成の含みがあり、αἰώνは主として時間的な「時代」を指す。本文では自然で明瞭な「終わり」とし、「完成」という語義上の可能性を脚注に残した。伝統的な「世の終わり」は、被造世界そのものの消滅と誤解され得るため本文では採らない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえの農耕語彙を一貫させた。「です」と「であり」を組み合わせ、説明としての荘重さを保ちながら過度に文語的になることを避けた。
