id: MAT.13.52
reference: Matthew 13:52
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「だから、天の国のために教えを受けた律法学者[a]は皆、自分の倉から新しい物と古い物を取り出す一家の主人[b]のようなものです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天の国の弟子となった律法学者」とも訳せる。ギリシャ語は、教えを受けることだけでなく、弟子とされることも意味し得る。
    reason: alternative_reading
  - marker: b
    text: 「家の主人」または「家長」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: だから
  rationale: 直前の弟子たちの理解を受けた推論を、自然な現代日本語で明確に示す。
- source_word: πᾶς γραμματεὺς
  choice: 律法学者は皆
  rationale: γραμματεύςの字義は「書記」だが、マタイの文脈では律法に通じた教師を指すため、日本語で広く理解される「律法学者」とした。
- source_word: μαθητευθεὶς τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 天の国のために教えを受けた
  rationale: 受動的に弟子として形成される意味を「教えを受けた」で表し、珍しい与格の方向・関係性は「ために」とした。弟子となったという語義上の可能性は脚注に残す。
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: 一家の主人
  rationale: 家と家人を管理する責任者という役割を、古風すぎない簡潔な日本語で表す。
- source_word: ἐκβάλλει
  choice: 取り出す
  rationale: 基本義の強い「投げ出す」ではなく、蓄えた物を中から出すというこの文脈の意味を採る。
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: 自分の倉から
  rationale: θησαυρόςは宝そのものにも宝庫・貯蔵所にもなり得る。ここでは物を取り出す場所としての比喩が自然なため「倉」とした。
- source_word: καινὰ καὶ παλαιά
  choice: 新しい物と古い物
  rationale: 名詞化された中性複数形を「物」で補い、原文の語順と対比を保つ。
theological_decisions:
- issue: μαθητευθεὶςと天の国との関係
  choice: 天の国のために教えを受けた律法学者
  alternative: 天の国の弟子となった律法学者
  rationale: この分詞は、教えを受けることと弟子とされることの双方を含み得る。本文では自然な日本語として前者を採り、後者を脚注で明示して曖昧さを保持する。
- issue: 「新しい物と古い物」の具体的同定
  choice: 比喩のまま具体的内容を特定しない
  alternative: 新約と旧約、またはイエスの教えと律法を明示する
  rationale: 原文は新旧の物が何を指すかを明言していないため、特定の神学的解釈を本文へ持ち込まない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの教えにふさわしい落ち着いた敬体を用いた。「そこでイエスは」はギリシャ語の代名詞が指す話者を日本語で明確にした。比喩の解釈は本文に加えず、原文の余白を保った。
