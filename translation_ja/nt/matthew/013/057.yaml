id: MAT.13.57
reference: Matthew 13:57
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: ja
  text: 人々はイエスに反感を抱いた。[a] しかし、イエスは彼らに言った。「預言者が敬われないのは、自分の故郷[b]と自分の家[c]だけである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスにつまずいた」とも訳せる。直訳は「彼にあってつまずいた」。ここでは、イエスを受け入れず反発したことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「郷里」「出身地」、または「故国」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 原語は、建物としての「家」にも、「家族」や「家の者」にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: イエスに反感を抱いた
  rationale: この文脈では、文字どおり足を取られることではなく、イエスを受け入れず反発することを表す慣用表現である。本文は現代日本語として意味が明確な表現とし、原文の比喩は脚注に残した。
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: しかし、イエスは彼らに言った
  rationale: δέは、人々の反感を受けたイエスの応答への穏やかな対比と場面転換を示す。
- source_word: προφήτης
  choice: 預言者
  rationale: 原語の宗教的・社会的役割を直接かつ一般に理解できる標準的な訳語である。
- source_word: ἄτιμος
  choice: 敬われない
  rationale: 名誉を与えられないという名誉・不名誉の含意を保ちつつ、日本語の格言として自然にした。
- source_word: εἰ μὴ
  choice: だけである
  rationale: 否定文に続く例外を示す構文を、日本語では「敬われないのは……だけ」と自然に表した。
- source_word: πατρίδι
  choice: 自分の故郷
  rationale: 物語上はイエスの出身地を指す。原語には出身地・郷里・故国という幅があるため、本文では文脈に合う「故郷」を選び、幅を脚注で示した。
- source_word: οἰκίᾳ αὐτοῦ
  choice: 自分の家
  rationale: οἰκίαは建物としての家にも、そこに属する家族・家の者にもなりうる。「自分の家」は日本語でもある程度その両義を保てるため、意味を一方に限定せず、脚注で明示した。
theological_decisions:
- issue: イエスの格言が述べる拒絶の範囲
  choice: 預言者が出身地と自分の家で敬われないという一般的な格言として訳す
  alternative: 家族の不信仰に特に焦点を当てた解釈的な訳
  rationale: 原文はこの状況に適用された格言を述べている。訳文では、名誉を受けないことと身近な共同体からの拒絶という緊張を保ち、イエスへのあらゆる拒絶について原文以上の教理的説明を加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスのことばには簡潔で格言的な調子を保った。「自分の家」は原語の家屋／家族という曖昧さをなるべく残す選択である。
