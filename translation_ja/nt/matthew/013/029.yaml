lexical_decisions:
- source_word: φησιν
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形で表した。
- source_word: Οὔ
  choice: いや
  rationale: 主人の直接的な否定の返答を、簡潔で自然な日本語にした。
- source_word: μήποτε
  choice: 〜してしまうかもしれない
  rationale: 望ましくない結果が起こりうることへの警戒を表す。
- source_word: συλλέγοντες
  choice: 集めるとき
  rationale: 主動詞と同時に行われる動作を自然に示した。
- source_word: ζιζάνια
  choice: 毒麦
  rationale: 麦に似た雑草を指す文脈を保ち、日本語聖書で理解されやすい名称を用いた。植物学的な同定には不確かさがあるため脚注で補った。
- source_word: ἐκριζώσητε
  choice: 根こそぎ抜いてしまう
  rationale: 根から引き抜くという動詞の具体性と、懸念される結果を明確に表した。
- source_word: ἅμα αὐτοῖς
  choice: 毒麦と一緒に
  rationale: 代名詞の指示対象を日本語で明確にし、同時に除かれる意味を示した。
- source_word: σῖτον
  choice: 麦
  rationale: 農耕の文脈と毒麦との対比に即して、一般読者に自然な語を選んだ。
theological_decisions:
- issue: ζιζάνιαの訳語
  choice: 毒麦
  alternative: 雑草、ドクムギ
  rationale: 教理上の解釈を加えず、麦と見分けにくい雑草というたとえの像を保つため「毒麦」とした。ただし原語が指す植物の厳密な同定は確定的でないため、その幅を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、たとえ話としての簡潔さと品位を保った。「根こそぎ」は原語の具体的な動作を自然に伝える。
