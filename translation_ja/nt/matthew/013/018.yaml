lexical_decisions:
- source_word: Ὑμεῖς
  choice: あなたがたは
  rationale: 二人称複数代名詞が明示され、強調されているため、主語を省略せず「あなたがたは」とした。
- source_word: οὖν
  choice: ですから
  rationale: 直前の発言を受けた推論・展開を示す接続語として、現代日本語で明確な「ですから」を用いた。
- source_word: ἀκούσατε
  choice: 聞きなさい
  rationale: アオリスト能動命令法二人称複数の命令の力を保った。「理解しなさい」では意味を限定しすぎるため、基本義に沿って「聞きなさい」とした。
- source_word: τὴν παραβολὴν
  choice: たとえ
  rationale: 福音書の教えの文脈におけるπαραβολήの標準的で平明な訳語として「たとえ」を選んだ。
- source_word: τοῦ σπείραντος
  choice: 種をまいた人の
  rationale: 冠詞付きアオリスト分詞の「種をまいた者」という出来事を直接表し、固定的な呼称へ変えず自然な日本語にした。
