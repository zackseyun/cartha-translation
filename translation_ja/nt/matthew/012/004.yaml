id: MAT.12.4
reference: Matthew 12:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: ja
  text: ダビデがどのように神の家に入り、彼らが供えのパンを食べた[a]か。そのパンは、ダビデも彼と共にいた者たちも食べることを許されず、ただ祭司たちだけに許されていたのではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異なる写本の読みでは、「彼らが食べた」ではなく「彼が食べた」となっています。
    reason: textual_variant
lexical_decisions:
- source_word: πῶς
  choice: どのようにして
  rationale: 先行する問いかけの内容を導く語として、ダビデの行動の経緯を示す自然な日本語とした。
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: 神の家に入り
  rationale: 原文の「神の家」を保ち、文脈から幕屋などと限定して言い換えることは避けた。
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: 供えのパン
  rationale: 神の前に供えられた聖別されたパンを指す祭儀用語を、現代日本語で簡潔かつ理解可能に表した。
- source_word: ἔφαγον
  choice: 彼らが……食べた
  rationale: 提示されたSBLGNT本文の複数形を反映し、ダビデと同行者を主語とした。異読の単数形は脚注に示す。
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: そのパンは、ダビデにも……食べることが律法で許されず
  rationale: ἐξόνの許可・合法性という意味を、律法上の祭儀的制限であることが伝わる形で表した。代名詞の指示対象を明確にするため「ダビデ」とした。
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: 共にいた者たちにも
  rationale: 同行者を明示する原文を過度に具体化せず、自然な日本語で訳した。
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ただ祭司たちだけに許されていた
  rationale: 例外を示すεἰ μήと、排他的なμόνοιςの双方を明確に反映した。
theological_decisions:
- issue: ἐξόνの祭儀的・法的意味
  choice: 「律法で許されず」と訳す
  alternative: 「許されておらず」
  rationale: 単なる社会的許可ではなく、祭司に限定された律法上の規定が背景にあることを伝える。ただし具体的な律法解釈は付加しない。
- issue: ἔφαγονの主語に関する本文異読
  choice: SBLGNTの複数形に従い「彼らが食べた」とする
  alternative: 単数形異読に従い「ダビデが食べた」とする
  rationale: 指定された原語本文を優先しつつ、意味に関わる単数形異読を脚注で保存する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の長い疑問文を二文に分けつつ、全体が一つの修辞疑問であることを終止部で示した。「供えのパン」は日本語で通用する祭儀用語であり、英語固有の伝統訳に関する脚注は日本語訳には不要と判断した。
