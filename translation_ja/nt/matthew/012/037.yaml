  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: ja
  text: なぜなら、あなたは自分のことばによって正しいと認められることになり、また自分のことばによって有罪とされることになるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: によって
  rationale: 属格を伴い、判断の根拠または証拠を示す。日本語の「によって」は、ことばが裁きの根拠となることを自然に表す。
- source_word: γάρ
  choice: からです
  rationale: 直前の発言について理由を示す接続辞。文末の「からです」により、現代日本語として自然に説明の働きを保つ。
- source_word: λόγων σου
  choice: 自分のことば
  rationale: 二人称単数の所有を、主語「あなた」と自然に結びつけるため「自分の」とした。「ことば」は発せられた言辞を指し、反復による対句も保つ。
- source_word: δικαιωθήσῃ
  choice: 正しいと認められ
  rationale: 未来受動形で、ここでは καταδικασθήσῃ との対比から法廷的な宣告を表す。「正しいと認められる」は、内面的に義しく変えられるという意味に限定せず、正しい側にあると宣告される意味を明確にする。
- source_word: καταδικασθήσῃ
  choice: 罪ありとされる
  rationale: 未来受動形の司法的意味を表し、「正しいと認められる」と明瞭な法廷的対照をなす。「罪に定められる」も可能だが、現代の一般読者により直接的な表現を選んだ。
theological_decisions:
- issue: ことばと終末の裁きにおける δικαιόω の法廷的意味
  choice: 「正しいと認められ」と訳し、ことばが判断の根拠・証拠となる法廷的宣告を示した。
  alternative: 「義とされる」「無罪とされる」「正しかったと証明される」
  rationale: 直後の「罪ありとされる」との対句が法廷的文脈を明示する。「正しいと認められる」は、救済論上の特定の体系を持ち込まず、無罪宣告と正しさの確認の両方に開かれた原語の幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準語。原文の二つの節の反復と対照を維持し、受動態も残した。「言葉」ではなく聖書本文で自然な「ことば」を採用した。
