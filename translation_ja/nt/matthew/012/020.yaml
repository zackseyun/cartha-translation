id: MAT.12.20
reference: Matthew 12:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: ja
  text: 彼は、傷ついた葦を折らず、くすぶる灯火の芯を消さない。公正を勝利へと導くまで。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: 傷んだ葦
  rationale: κάλαμοςは「葦」、συντετριμμένονは押しつぶされるなどして損なわれた状態を表す。「傷んだ」は、すでに完全に折れているとは断定せず、続く「折らない」と自然につながる。
- source_word: οὐ κατεάξει
  choice: 折らず
  rationale: κατάγνυμιの「折る、折って壊す」という意味を、葦の比喩に即して簡潔に表した。
- source_word: λίνον τυφόμενον
  choice: くすぶる灯心
  rationale: λίνονは本来、亜麻または亜麻製のものを指すが、ここでは灯火の芯を指す。τυφόμενονは煙を出しながら弱く燃えている状態であり、「くすぶる」が自然に伝える。
- source_word: οὐ σβέσει
  choice: 消さない
  rationale: σβέννυμιは火や灯火を消すことを意味する。現代日本語として明瞭で、灯心の比喩にも適する。
- source_word: ἕως ἂν
  choice: …まで
  rationale: 将来の到達点を示す原文の構文を保持した。日本語では結句に置き、預言的な力強さも保った。
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: 勝利に至らせる
  rationale: ἐκβάλλωの「外へ出す、もたらす」とεἰς νῖκοςの結果・到達点を合わせ、公正が最終的に勝利するという意味を自然な日本語で表した。
- source_word: τὴν κρίσιν
  choice: 公正
  rationale: κρίσιςには「裁き」と「公正」の両義がある。イザヤ42章のしもべの文脈では、単なる判決より、正しい秩序を実現する広い意味が前面に出るため「公正」とした。
theological_decisions:
- issue: イザヤのしもべの引用における κρίσις の訳
  choice: 公正
  alternative: 裁き
  rationale: しもべの働きは判決を言い渡すことだけでなく、神の正しい秩序をもたらすことを含む。「公正」はその広がりを表すが、司法的な「裁き」も語義上可能なので脚注に残した。
- issue: 灯火の比喩における λίνον の具体化
  choice: 灯心
  alternative: 亜麻
  rationale: 原語は亜麻を指すが、文脈上は亜麻で作られた灯火の芯である。現代の読者に像が明確に伝わるよう「灯心」とし、字義的情報を脚注で示した。
- issue: ἕως ἂν が生じさせうる時間的含意
  choice: 「…まで」を保持
  alternative: 「ついには…」と結果だけを明示
  rationale: 原文の時間的・到達点的な表現を保持し、勝利後に葦を折り灯心を消すという含意を訳文側で断定も否定もしない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、引用詩としての簡潔さと品位を保った。二つの否定表現を並行させ、最後の「…まで」を独立した短文として置くことで、原文の語順に近い強調と預言的な余韻を表した。
