id: MAT.12.6
reference: Matthew 12:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: ja
  text: しかし、あなたがたに言います。神殿よりも偉大なものが、ここにあります[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神殿よりも偉大な方が、ここにいます」または「神殿よりも偉大な者が、ここにいます」。ギリシア語の「偉大な」は中性形で、何を指すかは文法上明示されていない。
    reason: alternative_reading
  - marker: b
    text: 別訳「この場所に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: しかし、あなたがたに言います
  rationale: δέは前の議論を受けつつ対照を示すため「しかし」とし、λέγω ὑμῖνは現代日本語で自然な直接呼びかけとして訳した。
- source_word: τοῦ ἱεροῦ
  choice: 神殿よりも
  rationale: ἱερόνは通常、内陣だけでなく神殿域を指すが、日本語では文脈上「神殿」が最も自然で正確である。属格は比較の基準を表す。
- source_word: μεῖζόν
  choice: 偉大なもの
  rationale: 中性単数比較級が名詞的に用いられ、指示対象は明示されていない。「もの」とすることで、本文では人を明示せず、原文の形式上の曖昧さを保った。
- source_word: ἐστιν
  choice: あります
  rationale: 単純な現在の存在・所在を表す。日本語では「もの」を受けて「あります」とするのが自然である。
- source_word: ὧδε
  choice: ここに
  rationale: 場所を表す副詞であり、簡潔で自然な「ここに」とした。
theological_decisions:
- issue: 中性比較級 μεῖζόν の明示されていない指示対象
  choice: 本文では「神殿よりも偉大なもの」とする
  alternative: 「神殿よりも偉大な方」または「神殿よりも偉大な者」とする
  rationale: 文脈はイエスとその権威を強く指し示すが、ギリシア語は男性形ではなく中性形を用い、指示対象を明示していない。そのため本文で人物に限定せず、解釈上・神学上の含みを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの宣言にふさわしい簡潔で品位ある調子とした。「もの／あります」は原文の中性形を反映するための意図的な選択であり、脚注で人物を指す自然な別訳を示した。
