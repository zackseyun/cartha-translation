  terminology: ἰσχυρόςの具体的比喩は「強い男」で保たれています。σκεύηを「家財」とするのは文脈上妥当であり、脚注で「器・道具」という語義の幅を示すことができます。「略奪」はδιαρπάσειの、前半のἁρπάσαιより包括的・強い奪取を適切に表します。
