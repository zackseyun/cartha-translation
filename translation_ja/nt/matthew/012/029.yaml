id: MAT.12.29
reference: Matthew 12:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: ja
  text: あるいは、まず強い男を縛らなければ、どうしてだれかがその家に入り、その家財[a]を奪い取ることができるでしょうか。そしてその後で初めて、その人はその家を略奪するでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家財」は、直訳では「器、道具」。ここでは広く家の中の持ち物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: また
  rationale: 直前の議論を別のたとえによって補強する接続。日本語では「また」が自然に論旨をつなぐ。
- source_word: πῶς δύναταί τις
  choice: どうして…できるでしょうか
  rationale: 一般的な人物を主語とする修辞疑問の力を、自然な現代日本語で保つ。日本語では不定代名詞を明示しなくても一般性が伝わる。
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ
  choice: その強い男の家に入り
  rationale: 具体的な押し入りの比喩と、実体詞的に用いられた男性形のἰσχυρόςをそのまま保つ。
- source_word: τὰ σκεύη αὐτοῦ
  choice: 家財
  rationale: σκεύηは器具・器を指し得るが、この家への押し入りの文脈では家の中の所有物全般を意味する。「家財」は簡潔で自然。
- source_word: ἁρπάσαι
  choice: 奪い取る
  rationale: 力ずくで取る意味を表しつつ、後半のより強いδιαρπάσειとの語感の違いを保つ。
- source_word: ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν
  choice: まずその強い男を縛らなければ
  rationale: 条件構文とπρῶτονの順序を明示し、δήσῃの基本義を直接的に訳す。
- source_word: καὶ τότε
  choice: 縛ってこそ
  rationale: 先に強い男を縛った後にはじめて略奪できるという、接続詞と時間的・論理的順序を自然な日本語で示す。
- source_word: διαρπάσει
  choice: 略奪できる
  rationale: 家を荒らして広く奪うという複合動詞の強い意味を表す。修辞疑問に続く帰結として、日本語では可能表現が自然。
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: その家
  rationale: 直前に示された強い男の家を指す具体的な比喩を維持し、解釈的な「支配領域」などを本文に持ち込まない。
theological_decisions:
- issue: 「強い男」という比喩の男性表現
  choice: その強い男
  alternative: 力の強い者
  rationale: 原文は具体的な家主を男性形で描く比喩であり、その像を保つ。「強い者」も可能だが、家への押し入りという場面では「強い男」が明瞭。
- issue: 「家」と「家財」の比喩的範囲
  choice: 具体的な押し入りと略奪の比喩をそのまま訳す
  alternative: 「支配領域」「所有する者たち」などと解釈的に訳す
  rationale: 文脈上は悪霊に対するイエスの権威を示すが、本文は寓意の対応関係を明示していないため、翻訳では神学的説明を織り込まず緊張と比喩を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある語調。前半の修辞疑問と後半の帰結を自然な日本語にしつつ、押し入りと略奪という原文の強い比喩を弱めない。
