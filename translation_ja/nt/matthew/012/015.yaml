source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: ja
  text: 'しかし、イエスはそのことを知ると[a]、そこから退いた。大勢の人がイエスに従った。そして、イエスは彼らを皆癒やした。


    [a] ギリシア語では「知る」の目的語が明示されておらず、前の節の内容が文脈から補われる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「知る」の目的語が明示されておらず、前の節の内容が文脈から補われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: そのことを知ると
  rationale: アオリスト分詞が主動詞に先立つ認識を表す。目的語は原文では明示されていないが、前節で述べられたパリサイ派の企てを受けるものとして「そのこと」を補い、自然な日本語にした。原文の省略は脚注で示した。
- source_word: ἀνεχώρησεν
  choice: 退いた
  rationale: 単なる移動ではなく、敵対を察してその場から身を引く含みを保つ。「立ち去った」より目的をもった退避のニュアンスがあり、「逃げた」のように恐れを暗示しない。
- source_word: ἐκεῖθεν
  choice: そこから
  rationale: 場所を起点とする移動を簡潔で自然な現代日本語で表した。
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: 大勢の人がついて来た
  rationale: πολλοί は明示的に「群衆」とは言わず「多くの者」を意味するため、「大勢の人」とした。ἀκολουθέω の継続的な追随を自然な「ついて来た」で表した。
- source_word: ἐθεράπευσεν
  choice: 癒やした
  rationale: 福音書の治癒の文脈における θεραπεύω の標準的で明瞭な訳語。
- source_word: αὐτοὺς πάντας
  choice: 彼らを皆
  rationale: πάντας の包括性を明確に保ちつつ、自然な日本語の語順にした。
theological_decisions:
- issue: γνοὺς の暗黙の目的語
  choice: 前節の企てを指すものとして「そのこと」を本文に補う
  alternative: 目的語を補わず「知ると」とする
  rationale: ギリシア語は目的語を明示しないため曖昧さを脚注に残す一方、本文では前後関係を自然に結ぶ指示語だけを補った。敵意や殺害計画などを本文中で重ねて説明せず、文脈以上の解釈を加えていない。
- issue: イエスの移動のニュアンス
  choice: 退いた
  alternative: 立ち去った／去った
  rationale: マタイに見られる、敵対に応じた意図的な退避の含みを保つ。ただし恐怖や臆病さを示す語は用いず、行動の動機を神学的に断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語調とした。敬語的な主語尊敬表現は加えず、原文の平明な叙述を保った。「ので」は二つの出来事のつながりを自然にするが、強い因果関係を断定する意図はない。
