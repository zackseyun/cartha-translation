id: MAT.12.27
reference: Matthew 12:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ja
  text: また、もし私がベルゼブル[a]によって悪霊を追い出しているのなら、あなたがたの子ら[b]は、誰によって悪霊を追い出しているのですか。それゆえ、彼ら自身があなたがたを裁く者となります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「ベルゼブル」。訳文では「ベルゼブブ」とするものもあります。
    reason: 底本の固有名の語形と、広く用いられる別表記を示すため。
  - marker: b
    text: ここで「子ら」は、聞き手たちの仲間や弟子たちを指している可能性があります。
    reason: 親族語の比喩的な用法と指示対象の曖昧さを示すため。
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: ベルゼブルによって
  rationale: ἐνはここでは手段・作用者を表すため、自然な日本語で「によって」とした。固有名は底本のΒεελζεβούλに従い「ベルゼブル」と音写した。
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: 悪霊どもを追い出す
  rationale: ἐκβάλλωの排除する力を「追い出す」で表し、複数形τὰ δαιμόνιαは「悪霊ども」とした。
- source_word: οἱ υἱοὶ ὑμῶν
  choice: あなたがたの子ら
  rationale: υἱοίの親族語を保持し、聞き手側に属する者たちを指しうる比喩的な含みは脚注で示した。
- source_word: ἐν τίνι
  choice: 誰によって
  rationale: 先のἐνと並行する手段・作用者の問いとして、人格的な力を尋ねる自然な表現にした。
- source_word: διὰ τοῦτο
  choice: それゆえ
  rationale: 直前の修辞的な問いから導かれる結論であることを明確にした。
- source_word: αὐτοὶ κριταὶ ἔσονται ὑμῶν
  choice: 彼ら自身があなたがたを裁く者となります
  rationale: 強意のαὐτοίを「自身」で表し、未来の連結構文と名詞κριταίを「裁く者となる」として自然に保持した。
theological_decisions:
- issue: Βεελζεβούλの表記と同定
  choice: ベルゼブル
  alternative: ベルゼブブ
  rationale: 提供されたSBLGNT本文の語形を優先し、伝統的に知られる別形へ同化させなかった。
- issue: 「あなたがたの子ら」の指示対象
  choice: 本文では親族語を保つ
  alternative: あなたがたの仲間／弟子たち
  rationale: 文脈上は聞き手側の仲間や弟子を指す可能性があるが、本文だけでは範囲を確定できないため、解釈を本文に織り込まず脚注で説明した。
- issue: 「彼らが裁く者となる」の意味
  choice: 比喩を保持する
  alternative: 彼らの行いがあなたがたの主張の矛盾を明らかにする
  rationale: イエスの論証が含む法廷的・終末論的な響きを一方に限定せず、κριταίの表現をそのまま生かした。
translation_notes:
  register: 明瞭で現代的ながら品位のある「です・ます」調とした。修辞的な問いと結論の流れを保ち、「彼ら自身」で原文の強調を表した。
