id: MAT.12.45
reference: Matthew 12:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: ja
  text: そのあと、その霊は出かけて行き、自分よりも悪いほかの七つの霊[a]を連れて行く。彼らはそこに入り、そこに住み着く。すると、その人の最後の状態は初めの状態よりも悪くなる[b]。この悪い世代も同じようになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分よりも邪悪な、別の七つの霊」。
    reason: ἕτερα は「ほかの」のほか、文脈により「別の」とも訳し得る。πονηρότερα は「より邪悪な」とも訳せる。
  - marker: b
    text: 直訳「その人の最後のことは、最初のことよりも悪くなる」。その人の最終的な状態が以前の状態より悪化するという意味。
    reason: ギリシア語の慣用的な前後対比と、本文で補った「状態」を示すため。
lexical_decisions:
- source_word: τότε πορεύεται
  choice: そこで、その霊は出かけて行き
  rationale: τότε は物語の次の展開を示すため「そこで」とし、ギリシア語では省略されている主語を文脈上明らかな「その霊」で補った。歴史的現在の生き生きした進行も保つ。
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: 連れて来る
  rationale: 同行させる意味を自然な現代日本語で表した。直前の「出かけて行き」と、家へ戻る文脈から「来る」が適切である。
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: ほかの七つの霊
  rationale: ἕτερα はここでは第一の霊に加わる「ほかの」を表し、必ずしも種類の相違を強調しない。πνεύματα は原語どおり「霊」とした。
- source_word: πονηρότερα ἑαυτοῦ
  choice: 自分よりも悪い
  rationale: 比較級の道徳的・害悪的な強さを、平明で文脈に合う「悪い」で表現した。
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: 彼らは中に入り、そこに住み着く
  rationale: 分詞 εἰσελθόντα の先行動作を定動詞として自然に示した。κατοικεῖ は本文上単数形だが、意味上は一団の霊が居を定めることを表すため、「住み着く」とした。
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: その人の最後の状態は初めよりも悪くなる
  rationale: 字義的には「その人の最後のことが初めのことより悪くなる」だが、状態の前後を対比する慣用表現として明確に訳した。ἄνθρωπος は日本語では性別を不必要に特定しない通常の対応語「人」が自然である。
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: この悪い時代も同じようになる
  rationale: οὕτως の類比を「同じように」で示した。γενεά は同時代の人々を含む「時代」と訳し、単なる年代区分ではなくその世代への適用を保った。
theological_decisions:
- issue: πνεύματα の悪霊的文脈
  choice: 霊
  alternative: 悪霊
  rationale: 直前から汚れた霊が主語であり悪霊的意味は明白だが、この句自体の原語は πνεύματα なので、より限定的な「悪霊」を本文に持ち込まず「霊」を保った。
- issue: γενεά の指示範囲
  choice: この悪い時代
  alternative: この悪い世代
  rationale: γενεά は同時代の人々とその時代の双方を指し得る。日本語の「世代」は年齢集団と受け取られやすいため「時代」としたが、その時代の人々への裁きの適用は文脈に残る。
- issue: ἄνθρωπος の性別表現
  choice: その人
  alternative: その男
  rationale: ἄνθρωπος は文法上属格単数男性形だが、語そのものは一般に人間を指し、この例も性別を論点としていない。日本語で自然かつ原義に即した「その人」とした。
translation_notes:
  register: 平明な現代標準語を用いながら、たとえの厳粛さと結論の警告調を保った。「住み着く」は κατοικέω の定住性を自然に伝える。本文中の脚注記号 [a]、[b] は該当箇所に配置した。
