id: MAT.12.32
reference: Matthew 12:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: ja
  text: また、人の子に逆らうことばを口にする者は、だれでも赦される。しかし、聖霊に逆らうことばを口にする者は、だれでも赦されない。この時代においても、来るべき時代においても、赦されない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後半は直訳すると「来るべきものにおいても」であり、「時代」という語が前半から補われている。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: …者は、だれでも
  rationale: 不定関係節による一般的・包括的な条件を、自然な現代日本語で表す。
- source_word: εἴπῃ λόγον
  choice: ことばを言う
  rationale: λόγονを明示しつつ、日本語として理解しやすく、厳粛な警告の調子も保つ。
- source_word: κατὰ
  choice: 逆らう／逆らって
  rationale: 属格を伴うκατάが示す敵対的な発言の方向を、平明な日本語で表す。二つの節の対応も保つ。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 称号として定着した訳を用い、原文の表現とそのメシア的・終末論的含意を保つ。
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: 赦される／赦されない
  rationale: 神的受動態を説明的に展開せず、原文の受動表現と対照を簡潔に保つ。日本語では与格代名詞を別に訳さなくても対象が明瞭である。
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: 聖霊
  rationale: 現代日本語の聖書用語として標準的で、称号を正確に示す。
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: この時代でも、来るべき時代でも
  rationale: αἰώνの時間的・終末論的対照を「世界」ではなく「時代」で示す。後半で省略されたαἰώνを日本語では補って自然に表す。
theological_decisions:
- issue: αἰώνとμέλλωνによる時間的対照
  choice: この時代でも、来るべき時代でも
  alternative: この世でも、来世でも
  rationale: 空間的な二世界よりも、原文が示す現在と将来の時代の対照を保つ。「来世」は死後の状態という特定の理解に狭めるおそれがあるため避ける。
- issue: 赦されない罪の性質
  choice: 聖霊に逆らって言う者への警告を、そのまま保持する
  alternative: 「聖霊への冒瀆」または「最終的な悔い改めの拒絶」と解釈して明示する
  rationale: この節自体は行為を後代の教理用語で厳密に定義していないため、翻訳で特定の解釈に限定しない。
- issue: 神的受動態の扱い
  choice: 「赦される／赦されない」と受動形を保つ
  alternative: 「神は赦す／神は赦さない」
  rationale: 行為者が神であることは文脈上含意されるが、原文は明示していないため、翻訳でも補わない。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「人の子」「聖霊」「赦す」は聖書的称号・概念として保持した。末尾の否定を日本語で明確にするため「赦されない」を反復し、οὔτε…οὔτεの強い包括的否定を伝えた。
