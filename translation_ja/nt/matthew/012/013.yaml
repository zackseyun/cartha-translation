id: MAT.12.13
reference: Matthew 12:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: ja
  text: それから、イエスはその人に言われた。「手を伸ばしなさい。」その人が手を伸ばすと、その手は元どおりになり、もう一方の手と同じように健康になった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「元どおりにされ、もう一方と同じように健康になった」。ここで「もう一方」は、その人のもう一方の手を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: それから
  rationale: 物語の時間的な進行を示す語として、現代日本語で自然な「それから」を用いた。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語では臨場感を与える歴史的現在だが、日本語では過去形が自然な物語叙述となる。主語のイエスは文脈から補い、敬意を表す通常の聖書的文体として尊敬語を用いた。
- source_word: τῷ ἀνθρώπῳ
  choice: その人に
  rationale: 文脈上の特定の男性を指すが、日本語では「その人」が自然であり、指示対象も明確である。
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: 手を伸ばしなさい
  rationale: 直接の命令を、明瞭で自然な現代日本語にした。χείςはここでは「手」を意味する。
- source_word: ἐξέτεινεν
  choice: その人が手を伸ばすと
  rationale: 命令と応答における動詞の反復を保ちつつ、後続する即時の結果が自然に伝わる接続にした。
- source_word: ἀπεκατεστάθη
  choice: その手は元どおりになり
  rationale: 単なる治癒だけでなく、本来の正常な状態への回復を表す動詞の含意を「元どおりになり」で示した。
- source_word: ὑγιὴς ὡς ἡ ἄλλη
  choice: もう一方の手と同じように健康になった
  rationale: 省略された比較対象がもう一方の手であることを日本語では明示し、ὑγιήςの健康・正常という意味を保った。
theological_decisions:
- issue: 癒やしの性質の描写
  choice: 手が本来の健康な状態に回復したことを述べる
  alternative: 手が癒やされた／完全になったと訳す
  rationale: 奇跡を明確に叙述しながら、ἀποκαθίστημιが示す回復の意味を保ち、本文にない追加の教理的説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。会話部分は直接的で分かりやすくし、叙述では原文の回復という語感を自然な日本語で保持した。
