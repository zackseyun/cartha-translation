id: MAT.12.41
reference: Matthew 12:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: ja
  text: ニネベの男たちは、裁きの時にこの世代とともに立ち上がって、この世代を罪に定めるでしょう。彼らはヨナの宣告に応じて悔い改めたからです。見よ、ヨナよりも偉大なものがここにあります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨナよりも偉大な方が、ここにいる」とも訳せる。ギリシア語は中性表現で、直訳すれば「ヨナよりも偉大なもの」。イエスという人物だけでなく、イエスにおいて今ここにある、より偉大な現実を強調している可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: ニネベの男たち
  rationale: ἄνδρεςの明示的な男性複数を保ちつつ、現代日本語として自然に地名との関係を示す。
- source_word: ἀναστήσονται
  choice: 立ち上がり
  rationale: 裁きの場に立つ意味と、復活を響かせうる表現上の含みを残す。
- source_word: ἐν τῇ κρίσει
  choice: 裁きの時に
  rationale: 終末的な裁きの出来事を、明瞭で自然な日本語で表す。
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: この世代の者たちとともに
  rationale: μετά＋属格の基本義「ともに」を保持し、「世代」が指す人々を日本語で明瞭にする。
- source_word: κατακρινοῦσιν αὐτήν
  choice: 彼らを罪に定める
  rationale: κατακρίνωの有罪宣告の意味を表し、代名詞の指示対象である「この世代の者たち」を自然に受ける。
- source_word: μετενόησαν
  choice: 悔い改めた
  rationale: 預言者の宣告への応答としてのμετανοέωを、定着した明瞭な聖書日本語で訳す。
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: ヨナの宣告に応じて
  rationale: κήρυγμαを公的・預言的な「宣告」とし、εἰςが示す応答の関係を明示する。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 聞き手の注意を強く促す荘重な談話標識として訳す。
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ヨナよりも偉大なものが、ここにある
  rationale: 中性単数πλεῖονを人格だけに限定せず、「もの」として保持し、イエスとその働きにおけるより偉大な現実を指しうる原文の幅を残す。
theological_decisions:
- issue: πλεῖον Ἰωνᾶがイエスをどう指すか
  choice: ヨナよりも偉大なものが、ここにある
  alternative: ヨナよりも偉大な方が、ここにいる
  rationale: 原文の中性表現を人格的な「方」へ一義的に狭めず、イエス自身とその臨在・働きを含みうる緊張を保存する。
- issue: ἄνδρεςの性別表現
  choice: 男たち
  alternative: 人々
  rationale: 原文が一般的な住民ではなく明示的に男性名詞を用いるため、その情報を保持する。
- issue: ἀναστήσονταιの終末論的含意
  choice: 立ち上がり
  alternative: 復活し
  rationale: 裁きの場で立つことと復活の含みの双方を許し、「復活」と明示して原文以上に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「見よ」「罪に定める」によって発言の荘重さと司法的な力を保った。「この世代」は聖書本文に特徴的な表現として維持し、指示対象を明瞭にするため後続では「彼ら」と受けた。
