  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ja
  text: わたしと共にいない者は、わたしに敵対しており、わたしと共に集めない者は散らす。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: いない者
  rationale: 冠詞付き分詞の実質名詞用法を、一般的な人物を指す自然な現代日本語で表した。
- source_word: μετ’ ἐμοῦ
  choice: わたしと共に
  rationale: 属格を伴う μετά の結びつき・同行の意味を直接保ち、単なる立場表明以上の含みを残した。
- source_word: κατ’ ἐμοῦ
  choice: わたしに敵対して
  rationale: 属格を伴う κατά が示す対立を明確に表し、「反対側にいる」という意味を自然な日本語にした。
- source_word: συνάγων
  choice: 集めない
  rationale: 何を集めるかを原文同様に特定せず、収穫や群れなどの可能な比喩を限定しないようにした。
- source_word: σκορπίζει
  choice: 散らしている
  rationale: 「集める」との対照を保ち、現在形の継続的・特徴的な行為の響きを表した。
- source_word: καὶ
  choice: 、
  rationale: 日本語では二つの並行命題を読点で続けることで、ギリシャ語の付加的な連結を自然に表せる。
theological_decisions:
- issue: イエスに対する絶対的な二分法の強さ
  choice: 「共にいない者」と「敵対している者」を明確に対応させ、対立の厳しさを保つ。
  alternative: 対立を弱めて「味方でない者」のように意訳する。
  rationale: 原文には対立を和らげる表現がなく、二つの並行節が妥協のない選択を示しているため、その緊張を解消しなかった。
- issue: 「集める」「散らす」の対象
  choice: 目的語を補わず、比喩の開かれた意味を保持する。
  alternative: 「人々」「羊」「収穫」などを目的語として補う。
  rationale: ギリシャ語本文は対象を明示していないため、特定の解釈や教理を訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「者」は一般的な人物を指す対句に適し、文語的になりすぎない範囲で厳粛な発言の調子を保つ。
