id: MAT.12.36
reference: Matthew 12:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: ja
  text: しかし、あなたがたに言います。人々は、口にする無益なことば[a]の一つ一つについて、さばきの日に申し開きをすることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不用意なことば」または「むだなことば」とも訳せる。ギリシア語には「働かない」「実を結ばない」「役に立たない」という意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: しかし、あなたがたに言います
  rationale: δέは前の文脈を受けた穏やかな対比として「しかし」とし、現在形の直接的な語りかけを自然な現代日本語で表した。
- source_word: πᾶν ῥῆμα
  choice: ことばの一つ一つ
  rationale: 単数名詞を伴うπᾶνの分配的意味を明確にし、ῥῆμαをここでは口から出る発言として「ことば」とした。
- source_word: ἀργὸν
  choice: 無益な
  rationale: ἀργόςの「働かない、実を結ばない、むだな」という語義を保ちつつ、単なる言い間違いに限定せず、審判の対象となる発言の倫理的重大さを伝える。
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: 人々は、口にする
  rationale: οἱ ἄνθρωποιは男性だけでなく人間一般を指すため「人々」とし、λαλέωは発話を表す自然な表現「口にする」とした。
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: その一つ一つについて、申し開きをすることになります
  rationale: ἀποδίδωμιとλόγοςの組み合わせによる「釈明する、責任を問われて説明する」という司法的な慣用表現を「申し開きをする」で表し、περὶ αὐτοῦの対象を「その一つ一つについて」と明示した。
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: さばきの日に
  rationale: 神の司法的審判の日を指す定着した明瞭な表現とした。漢字が連続する硬さを避けるため「さばき」はひらがな表記とした。
theological_decisions:
- issue: ἀργόνが表す発言の性質
  choice: 「無益な」と訳し、実を結ばず責任を問われることばという幅を保った。
  alternative: 「不用意な」「むだな」「軽率な」
  rationale: 「不用意な」「軽率な」だけでは話者の不注意に意味が狭まり、「むだな」だけでは倫理的重大さが弱く聞こえうる。「無益な」は原語の非生産性と文脈上の責任の双方を比較的よく保つ。
- issue: 審判におけるἀποδώσουσιν λόγονの意味
  choice: 「申し開きをすることになります」とし、説明責任と司法的文脈を示した。
  alternative: 「言い開きをする」「責任を問われる」「報告する」
  rationale: 原文は有罪判決そのものではなく、語ったことについて勘定・説明を求められることを述べるため、その緊張を解消せずに表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「申し開き」は日常語よりやや改まった語だが、審判という司法的文脈に適し、一般読者にも理解可能である。
