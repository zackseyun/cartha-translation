  source_fidelity: 原文の主要要素を忠実に反映している。「しかし」はδέの文脈上の対比を自然に示し、「人々」はοἱ ἄνθρωποιの包括的・一般的用法に適切である。「ことばの一つ一つ」はπᾶν ῥῆμαの分配的な意味を表し、「無益な」はἀργόνの「むだな、実を結ばない、役に立たない」という意味領域を保つ。「～について、申し開きをする」はἀποδώσουσιν περὶ αὐτοῦ λόγον（その事柄について説明・勘定を求められる）の司法的な説明責任を適切に表す。「さばきの日」もἐν ἡμέρᾳ κρίσεωςに相当する。
