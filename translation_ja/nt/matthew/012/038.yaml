id: MAT.12.38
reference: Matthew 12:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: ja
  text: その時、律法学者とファリサイ派の人々のうち数人がイエスに答えて言った。「先生、あなたからのしるし[a]を見たいのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「奇跡のしるし」。原語は、奇跡的な意味を持つしるしを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を導く時の副詞として、自然で明確な現代日本語にした。
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: イエスに答えて言った
  rationale: 直前に明示的な質問がなくても応答を表し得るギリシア語の語法を「答えて」で保ち、代名詞の指示対象は日本語で明確になるよう「イエス」とした。
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: 律法学者とファリサイ派の人々のうち数人
  rationale: τινεςが両集団の全員ではなく一部を指すことを明示した。γραμματεῖςは当時の役割が伝わる「律法学者」、Φαρισαῖοιは現代日本語で集団名と分かる「ファリサイ派の人々」とした。
- source_word: λέγοντες
  choice: 言った
  rationale: 直接話法を導く分詞を、日本語として自然な定動詞に組み替えた。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 教師への呼びかけを表す自然な現代日本語であり、「主」などの神学的含意を加えない。
- source_word: θέλομεν
  choice: 見たいのです
  rationale: 意志・願望を表す語を、続く不定詞と合わせて自然な日本語にした。丁寧さを伴う要求の調子も表す。
- source_word: ἀπὸ σοῦ
  choice: あなたからの
  rationale: しるしの源がイエスであることを示すἀπόの意味を簡潔に保った。
- source_word: σημεῖον
  choice: しるし
  rationale: 文脈上は奇跡的なしるしを含意するが、語そのものの広い意味を狭めずに訳した。
- source_word: ἰδεῖν
  choice: 見る
  rationale: ὁράωの不定詞を基本義どおりに訳し、「目撃する」などの解釈的な強調を避けた。
theological_decisions:
- issue: σημεῖονの性質
  choice: 本文では「しるし」とする
  alternative: 「奇跡のしるし」または「奇跡」
  rationale: この文脈ではイエスを証明する超自然的なしるしが求められていると考えられるが、原語σημεῖον自体はより広い「しるし」を意味するため、その幅を本文に残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、福音書本文にふさわしい落ち着いた文体とした。「答えて言った」はやや原文寄りだが、応答という語感を保つため採用した。
