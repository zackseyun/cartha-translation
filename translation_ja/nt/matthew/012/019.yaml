id: MAT.12.19
reference: Matthew 12:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: ja
  text: 彼は言い争わず、叫び声も上げない。大通りでその声を聞く者はいない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は争わず、大声で叫ばない。広場でその声を聞く者はいない。」
    reason: ἐρίζω、κραυγάζω、πλατεῖαには、それぞれ「争う」「大声で叫ぶ」「広場」という訳も可能であるため。
lexical_decisions:
- source_word: ἐρίσει
  choice: 言い争わず
  rationale: ἐρίζωは争いや論争に加わることを表す。ここではメシアの非好戦的な態度を自然な現代日本語で示し、単なる努力を意味する「努める」との混同を避けた。
- source_word: κραυγάσει
  choice: 叫び声も上げない
  rationale: κραυγάζωは大声で叫ぶことを表す。「叫び声を上げる」は、公の場で声高に自己を主張しない様子を自然に伝える。
- source_word: ἀκούσει τις
  choice: 聞く者はいない
  rationale: 否定辞οὐδέと不定代名詞τιςの組み合わせを、明瞭で自然な日本語の否定表現にした。
- source_word: ἐν ταῖς πλατείαις
  choice: 大通りで
  rationale: πλατεῖαは幅の広い道や公の往来を指す。「大通り」は公共の場という含意を保つ。「広場」も文脈上可能なので脚注に示した。
- source_word: τὴν φωνὴν αὐτοῦ
  choice: その声
  rationale: φωνήの通常の意味である「声」を採用し、αὐτοῦは直前の主語を受ける自然な日本語として「その」とした。
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: …ず、…も…ない。…者はいない
  rationale: 三つの否定が積み重なる力を保ちつつ、現代日本語として読みやすい二文に整えた。
theological_decisions:
- issue: イザヤのしもべの引用とメシアの振る舞い
  choice: メシアが言い争わず、公の場で声高に自己を主張しない姿として訳す。
  alternative: 伝統的な引用調を強め、「争わず、声を張り上げない」とすることもできる。
  rationale: このギリシア語はイザヤ42章2節の成就としてイエスの穏やかで非好戦的な姿を描く。ただし、あらゆる公の発言や行動を否定する絶対的沈黙という意味までは訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。預言的な未来は、日本語の引用文として自然な非過去形で表した。
