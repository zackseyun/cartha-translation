  source_fidelity: ギリシア語の条件構文（καὶ εἰ）、同一の主体・対象である「サタン」、自己対立を表すἐφ’ ἑαυτόν、分裂（ἐμερίσθη）、および王国の存続を問う未来形の修辞疑問（πῶς οὖν σταθήσεται）が過不足なく反映されている。「分裂したことになる」は条件から帰結する状態を自然な日本語で表しており、背理法の論理も保たれている。
  naturalness: 「また、もし…なら」で前節からの論証の接続を保ち、「それなら、どうして…だろうか」という問いも明瞭で自然である。「自らに敵対して分裂したことになる」はやや格調ある表現だが、現代標準日本語として十分に通じ、本文の論理を明確にする。
  terminology: 「サタン」は定着した名称として適切であり、「追い出す」はἐκβάλλειの文脈上の力を自然に伝える。「国」はここでのβασιλεία（サタンに属する支配領域・王国）の訳語として許容範囲であり、特定の教派的解釈を持ち込んでいない。
