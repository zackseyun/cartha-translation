id: MAT.12.26
reference: Matthew 12:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: ja
  text: また、もしサタンがサタンを追い出すなら、サタンは自らに敵対して分裂したことになる。それなら、どうしてその国が立ち続けるだろうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἰ
  choice: また、もし～なら
  rationale: καίによる前の議論とのつながりと、εἰの条件を、自然な現代日本語でともに示した。
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: サタン
  rationale: 人名・称号として定着した音写を用い、主語と目的語が同一であるという原文の論理を保った。
- source_word: ἐκβάλλει
  choice: 追い出す
  rationale: 悪霊を排除する文脈で自然かつ明瞭であり、「放逐する」ほど硬くない表現を選んだ。
- source_word: ἐφ’ ἑαυτὸν
  choice: 自らに敵対して
  rationale: ἐπίと再帰代名詞が表す、自分自身に対する対立・内紛の意味を明示した。
- source_word: ἐμερίσθη
  choice: 分裂したことになる
  rationale: アオリスト受動形を条件文から導かれる結果として表し、単なる現在状態とも過去の出来事とも断定しすぎない日本語にした。
- source_word: πῶς οὖν
  choice: それなら、どうして
  rationale: οὖνの推論的なつながりとπῶςの修辞疑問を、明快な現代日本語で再現した。
- source_word: σταθήσεται
  choice: 立ち続けるだろうか
  rationale: 将来の含意を保ちつつ、「立つ」という比喩と、存続するという文脈上の意味を自然に伝えた。
- source_word: ἡ βασιλεία αὐτοῦ
  choice: その国
  rationale: βασιλείαをここでは分裂しうる支配領域として「国」とし、αὐτοῦの指示対象であるサタンを文脈的な「その」で受けた。
theological_decisions:
- issue: サタンが自らを追い出すという仮定の論理的意味
  choice: サタンがサタンを追い出すなら、自らに敵対して分裂したことになり、その国は存続できない、という背理的な問いとして訳した。
  alternative: 前節の「家」の比喩を補って、「内輪もめした家」のように意訳することもできる。
  rationale: 原文は自己対立、分裂、国が立つことの不可能性を述べるが、「家」という語は本節にはないため、説明を加えず論理的緊張をそのまま保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「サタンは」と繰り返すことで、代名詞が不自然になりやすい日本語でも自己対立の論理を明確にした。修辞疑問は断定に言い換えず保持した。
