  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μὴ φανερὸν αὐτὸν ποιήσωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: ja
  text: そして、彼のことを公にしないよう、彼らを厳しく戒めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「厳しく警告した」または「厳しく命じた」。
    reason: ἐπετίμησεν は、文脈により「厳しく戒める」「厳しく警告する」「叱る」「命じる」などの意味を持ち得るため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 物語を継続する単純な接続詞として、自然な現代日本語で表した。
- source_word: ἐπετίμησεν
  choice: 厳しく命じた
  rationale: この文脈では、非難することよりも、強い調子で禁止を言い渡す意味が中心である。「厳しく命じた」は動詞の強さと後続する内容節を自然に伝える。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 直前の文脈でイエスに従い、癒やされた人々を指す与格複数代名詞を明示した。
- source_word: ἵνα μὴ
  choice: ないよう
  rationale: 命令を表す動詞に続く否定内容節として、日本語で自然な禁止の表現にした。
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: 自分のことを人々に知らせる
  rationale: φανερὸν ποιέω は「公にする、明らかにする、知らせる」という慣用表現である。αὐτόν は主語であるイエスを指すため、直接話法的な日本語の視点に合わせて「自分のこと」とした。「人々に」は、公に知られるという φανερόν の含意を自然に示す。
theological_decisions:
- issue: イエスが公表を禁じた指示の性質
  choice: 自分について人々に知らせないようにする厳しい命令
  alternative: 彼らへの叱責、または単なる警告
  rationale: ἐπιτιμάω は叱責、厳しい警告、命令のいずれも表し得るが、ἵνα μή 以下が具体的な禁止内容を示すため、ここでは強い指示として訳した。公表を禁じた理由は本文に明記されていないので、訳文には補わない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「知られないよう」ではなく「自分のことを人々に知らせないよう」とし、彼らが公表するという能動的な構文を保持した。脚注で動詞の語義上の幅を示した。
