  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: ja
  text: 人の子は安息日の主だからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人の子は安息日を支配する者なのです」。
    reason: lexical_alternative
  - marker: b
    text: 「人の子」は、福音書でイエスが特徴的に用いる自己呼称。より一般的に「人間」と訳すこともできるが、その場合、称号としての響きが弱くなる。
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: だからです
  rationale: 直前の議論を受ける理由・説明の働きを、現代日本語で自然に示す。
- source_word: κύριος
  choice: 主
  rationale: 安息日に対する権威を表す強い称号として、語の神学的重みを保つ。
- source_word: τοῦ σαββάτου
  choice: 安息日の
  rationale: κύριοςにかかる属格を簡潔に再現し、ユダヤ教の聖なる日・制度を指す定着した訳語を用いる。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの特徴的な自己呼称として定着した表現を保ち、ダニエル書を含む称号的な響きを失わないようにする。
- source_word: ἐστιν
  choice: です
  rationale: 現在時制の繋辞を、文全体の丁寧で格調ある語調に合わせて表す。
theological_decisions:
- issue: 「κύριος ... τοῦ σαββάτου」が持つキリスト論的な力
  choice: 「人の子は安息日の主」とし、安息日に対する強い権威の宣言として訳す。
  alternative: 「人の子は安息日を支配する者」
  rationale: 「主」は本文の称号的・神学的な重みを保ちながら、本文が述べる以上の内容を付け加えない。
- issue: 「ὁ υἱὸς τοῦ ἀνθρώπου」の理解
  choice: 称号的な自己呼称「人の子」として訳す。
  alternative: 「人間」または「この人」
  rationale: 一般的な人間を指す可能性を注で示しつつ、福音書での定着した自己呼称と、その背景にある称号的・黙示的な響きを本文で保つ。
translation_notes:
  register: 明快な現代標準日本語。文脈への説明的接続を自然な文末の「だからです」で示し、「主」「人の子」「安息日」という定着した聖書用語を用いて、簡潔さと格調を保った。
