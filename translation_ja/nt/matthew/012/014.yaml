  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: ja
  text: しかし、ファリサイ派の人々は外に出て、彼をどのようにして滅ぼすかを相談した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「殺す」または「死に至らせる」とも訳せる。ギリシア語は「滅ぼす」であり、この文脈では殺害の意図を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: 外に出て
  rationale: アオリスト分詞の時間的・継起的な働きを保ち、相談に先立つ退出を自然な日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の出来事に対するファリサイ派の敵対的な反応へ転じる、穏やかな対比を示す。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 当時のユダヤ教内の集団名を一般読者に分かりやすい現代日本語で示した。
- source_word: συμβούλιον ἔλαβον
  choice: 策を練った
  rationale: 直訳的には「協議した／相談した」だが、κατ’ αὐτοῦと後続の目的内容を踏まえ、敵対的な協議・企てを自然に表した。「共謀した」ほど法的・断定的な響きにはしなかった。
- source_word: κατ’ αὐτοῦ
  choice: 彼に対する
  rationale: κατά＋属格の敵対的な意味を明示した。
- source_word: ὅπως
  choice: どうすれば
  rationale: 策を練る内容を導く熟慮的なニュアンスを自然な日本語で表した。
- source_word: ἀπολέσωσιν
  choice: 滅ぼせる
  rationale: 文脈上は殺害の意図を含み得るが、語自体の「滅ぼす／破滅させる」という幅を残し、明示的に「殺す」と限定しなかった。
theological_decisions:
- issue: ἀπολέσωσινの具体性
  choice: 滅ぼせる
  alternative: 殺せる／死に至らせられる
  rationale: 文脈は致死的な意図を強く示すものの、原語は明示的な殺害動詞より意味範囲が広い。本文ではその幅を保ち、より具体的な理解を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」を用いて原文の代名詞を保持し、「策を練った」によって敵対的な協議を自然に表現した。
