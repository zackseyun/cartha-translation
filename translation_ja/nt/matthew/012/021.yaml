  text: and in his name the nations will hope[a].
translation:
  language: ja
  text: そして、諸国の民[a]は彼の名に希望を託すだろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「異邦人は彼の名に希望を託すだろう」。
    reason: ἔθνη は「諸国の民」とも「異邦人」とも訳せるため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前から続く引用の結びであることを示すため、自然な接続表現として訳した。
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: 彼の名に
  rationale: 与格を「名に」と訳し、その名が表す本人、権威、名声という含みを狭めずに保った。
- source_word: ἔθνη
  choice: 諸国の民
  rationale: 「国々」と「異邦人」の両方に及ぶ語義を踏まえ、イザヤ書からの引用にある広い諸民族的な範囲を自然な日本語で表した。
- source_word: ἐλπιοῦσιν
  choice: 望みを置く
  rationale: 未来形を現在の約束として明確に表しつつ、ἐλπίζωの「望む」という語義と終末的な響きを保った。
theological_decisions:
- issue: メシアに関する引用における ἔθνη の訳
  choice: 諸国の民
  alternative: 異邦人
  rationale: イスラエル以外の民を含むイザヤ書の広い視野を保ち、単なる国家ではなく人々を指すことを明確にした。「異邦人」も文脈上可能なため脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「希望する」より聖書的な約束の響きを持ち、日常語としても理解しやすい「望みを置く」を採用した。
