id: MAT.12.35
reference: Matthew 12:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: ja
  text: 善い人は、善い蓄えから善いものを取り出し[a]、悪い人は、悪い蓄えから悪いものを取り出す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直前直後の文脈では人の語る言葉が問題とされているため、「善いもの」と「悪いもの」は、特に善い言葉と悪い言葉を指している可能性がある。
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: 善い／善いもの
  rationale: 人の性質と、そこから出るものに同じ語根が反復される原文の対応を保った。中性複数の実詞的用法である ἀγαθά は、範囲を狭めず「善いもの」とした。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ここでは代表的な一人の人間を指す。現代日本語の「人」は性別を限定せず、原文の一般的・格言的な用法を自然に表せる。
- source_word: θησαυρός
  choice: 蓄え
  rationale: 内に蓄積され、そこから何かが取り出されるという比喩を自然な日本語で保つため。「宝」よりも、この文脈で蓄えられた内容という意味が明瞭である。
- source_word: ἐκβάλλει
  choice: 取り出す
  rationale: ἐκ の起点と、内から外へ出す動きを保ちつつ、現代日本語として自然にした。「生み出す」では蓄えから出す比喩が弱くなる。
- source_word: πονηρός / πονηρά
  choice: 悪い／悪いもの
  rationale: ἀγαθός との道徳的対照と原文の反復を保った。「邪悪な」はこの格言的な対句では強すぎるため、簡明な「悪い」を選んだ。
theological_decisions:
- issue: 蓄えから取り出されるものの範囲
  choice: 「善いもの」「悪いもの」と広く訳す
  alternative: 直前直後の文脈に即して「善い言葉」「悪い言葉」と限定する
  rationale: 直近の文脈は発言を扱っているが、原文は名詞を明示せず、中性複数の形容詞を実詞的に用いている。そのため本文では広い表現を保ち、発言を特に含みうることを脚注で示した。
translation_notes:
  register: 簡潔な格言調と、善い／悪い、蓄え／取り出すという原文の平行構造を保った。語彙は現代標準日本語で、平易ながら品位のある表現とした。
