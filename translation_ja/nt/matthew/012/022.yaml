id: MAT.12.22
reference: Matthew 12:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: ja
  text: その時、悪霊に取りつかれ、目が見えず、話すことのできない人[a]が、イエスのもとに連れて来られた。イエスはその人を癒やされた。その結果、話すことのできなかった人は話し、見えるようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「耳の聞こえない人」。ギリシア語は、耳が聞こえないこと、または話すことができないことを表し得る。ここでは、癒やされた結果としてその人が話したと記されているため、本文の訳とした。
    reason: κωφόςの語義上の別解を保持するため。
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 次の出来事を導入する時間的な談話標識として、明瞭で自然な現代日本語とした。
- source_word: προσηνέχθη αὐτῷ
  choice: イエスのもとに連れて来られた
  rationale: ギリシア語の受動態と、行為者が明示されていないことを保った。日本語では指示対象を明確にするため、αὐτῷを「イエス」とした。
- source_word: δαιμονιζόμενος
  choice: 悪霊につかれ
  rationale: 悪霊による苦しみという原文の明示的な表現を保ち、現代の臨床的分類に置き換えなかった。
- source_word: τυφλὸς
  choice: 目が見えず
  rationale: 「盲目の」よりも日常的で明瞭な表現にしつつ、視覚障害の意味を正確に伝えた。
- source_word: κωφός
  choice: 口のきけない
  rationale: κωφόςには「耳が聞こえない」と「口がきけない」の両義があるが、結果節が「話し、見る」と述べるため、ここでは発話不能の意味を本文に採った。語の幅は脚注で示した。
- source_word: ἐθεράπευσεν αὐτόν
  choice: その人を癒やすと
  rationale: 福音書の奇跡物語における θεραπεύω の通常の意味を保ち、後続する結果を自然な日本語で接続した。
- source_word: ὥστε
  choice: すると／結果として
  rationale: 治癒の結果を示す接続であり、日本語本文では「癒やすと」によってその結果関係を自然に表した。
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: 口のきけなかった人は話し、見えるようになった
  rationale: 実体詞的な形容詞を自然に展開し、λαλεῖν と βλέπειν を治癒によって回復した能力として明瞭に表した。
theological_decisions:
- issue: 悪霊による苦しみの表現
  choice: 「悪霊につかれ」と明示する
  alternative: 精神疾患であった／苦しめられていた
  rationale: 原文は悪霊との関係を明示しているため、現代的な臨床診断や曖昧な苦痛表現へ置き換えず、その世界観を保持した。
- issue: κωφόςの文脈上の意味
  choice: 本文では「口のきけない」とする
  alternative: 耳の聞こえない／耳が聞こえず口もきけない
  rationale: 語自体には聴覚障害の意味もあるが、治癒の結果として発話と視覚だけが述べられるため、本文では発話不能を採用し、真の語義的曖昧さは脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位のある叙述体。「口がきけない」は文脈に即した慣用表現である。セミコロンを避け、二文に分けて普通の読者にも追いやすくした。
