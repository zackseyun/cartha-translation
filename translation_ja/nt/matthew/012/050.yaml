id: MAT.12.50
reference: Matthew 12:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: ja
  text: というのも、天におられるわたしの父の御心を行う人は誰でも、その人こそ[a]、わたしの兄弟、姉妹、母なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、「誰でも」に当たる語と「その人」に当たる語は文法上、男性単数形ですが、ここでは性別を限定せず、一般に「…する人は誰でも」という意味です。
    reason: 原文の文法上の男性形と、その総称的な意味範囲をともに示すため。
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: …人は誰でも
  rationale: 不定関係詞とἄνによる一般的・開放的な条件を、現代日本語で自然に表す。特定の性別に限定しない原文の総称的用法も伝わる。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の発言を説明する接続を明示しつつ、「なぜなら」より会話の流れに自然な表現とした。
- source_word: ποιήσῃ τὸ θέλημα
  choice: みこころを行う
  rationale: ποιέωの実行の意味を保ち、「従う」と解釈的に狭めない。「みこころ」は神のθέλημαを表す日本語聖書文体として明瞭で尊厳がある。
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: 天におられるわたしの父
  rationale: 父との関係と、その父が天におられるという修飾関係を明確に保つ。複数形οὐρανοῖςは日本語の慣用に従い「天」とした。
- source_word: αὐτός
  choice: その人こそ
  rationale: 指示代名詞の強意を「こそ」で表し、父のみこころを行う当人がイエスの家族であるという焦点を保持する。
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: 兄弟、姉妹、母
  rationale: 原文が三つの家族関係を個別に列挙するため、包括語にまとめず、それぞれを単数的な関係名として保持する。
- source_word: ἐστίν
  choice: なのです
  rationale: 現在時制の連結を保ち、説明文脈に合う自然で丁寧な断定とした。
theological_decisions:
- issue: 総称文における文法上の男性単数形
  choice: 「人は誰でも、その人こそ」と総称的に訳し、注で原文の男性単数形を説明する
  alternative: 「彼こそ」として原文の文法上の男性形を表面上も示す
  rationale: ギリシア語のὅστιςとαὐτόςは文法上男性単数形だが、ὅστις ... ἂνの構文は性別を限定しない一般条件である。日本語には同じ文法的性の体系がなく、「彼」は実際の男性に限定する誤解を招きうるため、総称性を本文で正確に伝え、形式上の情報は注に残した。兄弟・姉妹・母という列挙もその包括的範囲を示している。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「みこころ」「天におられる」によって聖書本文としての尊厳を保った。「というのも」で前節との説明関係を示し、「こそ」でαὐτόςの強意を自然に表した。
