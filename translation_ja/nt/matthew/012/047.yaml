  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: ja
  text: すると、ある人がイエスに言った。[a]「見てください。あなたの母と兄弟たちが、あなたに話をしたいと、外に立っています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本には、この節がありません。
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: すると、ある人がイエスに言った
  rationale: δέは軽い接続を表すため、物語の自然な進行を示す「すると」とした。τιςの不定性は「ある人」で表し、代名詞の指示対象は日本語で明瞭になるよう「イエス」とした。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 注意を促す語としての機能を保ちつつ、現代日本語の丁寧な直接話法に自然な表現とした。
- source_word: ἡ μήτηρ σου
  choice: あなたのお母様
  rationale: 通常の親族名称を用い、話者が本人に告げる場面に合う丁寧さを「お母様」で表した。
- source_word: οἱ ἀδελφοί σου
  choice: 兄弟たち
  rationale: 文脈上、男性の家族成員を指す語として「兄弟たち」とし、「きょうだい」のように性別の範囲を広げなかった。
- source_word: ἔξω ἑστήκασιν
  choice: 外に立っていて
  rationale: ἵστημιの完了形が示す、立った結果として現在そこにいる状態を自然な日本語で表し、ἔξωも明示した。
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: あなたと話したいと願っています
  rationale: ζητέωの意志・要望を含む用法を自然な日本語で表した。「話す」はλαλέωに対応し、σοιは日本語として自然な相互的表現「あなたと」で訳した。
theological_decisions:
- issue: マタイ12章47節の本文批評上の位置
  choice: 提示されたSBLGNT本文に従って節を本文に含め、一部写本での欠落を脚注に記す
  alternative: 一部の写本に従い、この節を本文から除く
  rationale: 提示された原語本文を翻訳しつつ、重要な写本上の異読を隠さず示すことで、本文の透明性と監査可能性を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。直接話法では、知らせる相手であるイエスへの自然な敬意を表すため「ご覧ください」「お母様」を用いた。
