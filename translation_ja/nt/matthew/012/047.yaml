  - severity: low
    issue: 「話したいと願っています」
    rationale: ζητοῦντες σοι λαλῆσαιは、内面的な願望というより、イエスに話すことを求めている／そのために来ていることを表す。「あなたに話をしたいと」がより簡潔で、目的性を保つ。
