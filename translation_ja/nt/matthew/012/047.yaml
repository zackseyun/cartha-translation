review_pass:
  verdict: revise
  source_fidelity: 本文の内容と語順の大筋は原文に忠実であり、「外に立っている」ことと、イエスに話すことを求めている点を保持している。もっとも、「お母様」はμήτηρに含まれない敬称を加えており、「話したいと願っています」はζητοῦντεςの『話す機会を求めている』という含みをやや心理的願望に狭める。
  naturalness: 全体として読みやすい現代標準日本語である。ただし、原文に根拠のない尊敬語を親族名に付加しないほうが、語り手の社会的距離を不必要に規定せず、自然で中立的である。
  terminology: 「兄弟たち」はοἱ ἀδελφοίに適切である。「母」とすることで原文の中立的な親族名称を保つ。「あなたに話をしたいと、外に立っています」は、ζητέω＋不定詞が表す目的・求めを自然に表せる。
  issues:
