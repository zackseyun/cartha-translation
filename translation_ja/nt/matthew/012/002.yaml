id: MAT.12.2
reference: Matthew 12:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: ja
  text: ところが、ファリサイ人たちはこれを見て、イエスに言った。「見なさい。あなたの弟子たちは、安息日にしてはならないこと[a]をしています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「安息日に許されていないこと」。
    reason: ἔξεστιν は「許されている」「してよい」の意も持つため、その許可・規範上のニュアンスを示す語義代案。
lexical_decisions:
- source_word: δὲ
  choice: ところが
  rationale: 直前の弟子たちの行動に対してファリサイ派が異議を唱える展開への対照を、自然な現代日本語で示す。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 宗教的集団を指すことが一般読者にも明確になる表現とした。
- source_word: ἰδόντες
  choice: これを見て
  rationale: アオリスト分詞を時間・契機を示す形で訳し、「これ」は文脈上の弟子たちの行動を受ける。
- source_word: εἶπαν αὐτῷ
  choice: イエスに言った
  rationale: 代名詞の指示対象を日本語で明確にし、標準的な発話表現とした。
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 相手の注意を弟子たちの行為に向ける、非難を伴う間投詞の力を保つ。
- source_word: μαθηταί
  choice: 弟子たち
  rationale: 福音書における教師と弟子の関係を正確かつ慣用的に表す。
- source_word: ποιοῦσιν ... ποιεῖν
  choice: してはならないことをしています
  rationale: ποιέωの反復を可能な範囲で「する」の反復として保ちつつ、自然な日本語にした。
- source_word: ὃ οὐκ ἔξεστιν
  choice: してはならないこと
  rationale: 許可されていないという法的・規範的な意味を示すが、その規範が聖書の律法か解釈伝承かは特定しない。
- source_word: ἐν σαββάτῳ
  choice: 安息日に
  rationale: 安息日という制度・日の時間的用法を簡潔で慣用的な日本語にした。
theological_decisions:
- issue: ファリサイ派の異議の法的根拠
  choice: 「してはならない」と訳し、規範上許されないという彼らの主張を示す。
  alternative: 「律法に反している」「許されていない」
  rationale: 原文は異議の根拠が聖書の律法そのものか、解釈上の伝承かをここでは明示しない。「律法に反している」と断定せず、物語上の緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。会話では「見なさい」によってἸδοὺの注意喚起と非難の調子を保った。注記を要する本文上の異読や不可欠な語義上の補足はないため、脚注は付していない。
