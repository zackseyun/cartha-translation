id: MAT.12.12
reference: Matthew 12:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: ja
  text: それなら、人は羊よりもどれほど価値があることでしょう。ですから、安息日[a]に良いことをするのは許されています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「安息日」は複数形ですが、安息日の遵守について述べる際に用いられる一般的な言い方です。
    reason: 原文の複数形と、日本語で自然な単数形による訳との違いを示すため。
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: まして
  rationale: 直前の羊の例を受けた、小さいものから大きいものへの推論を、自然な現代日本語で表した。οὖνの論理的つながりも文脈の中に保たれている。
- source_word: διαφέρει
  choice: 大切
  rationale: ここでは単に「異なる」ではなく、人が羊よりも価値ある存在だという比較を表す。「価値がある」よりも自然で、イエスの修辞的な問いにもよく合う。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 羊と対比される人間一般を指すため、性別を限定しない日本語の「人」が原文の一般的用法を自然に伝える。
- source_word: ὥστε
  choice: ですから
  rationale: 直前の比較から導かれる結論であることを明確にした。
- source_word: ἔξεστιν
  choice: 律法で許されています
  rationale: 安息日をめぐる律法上の可否が論点なので、単なる一般的許可ではなく、律法上許されるという意味を明示した。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: ギリシア語は複数形だが、安息日の遵守を指す慣用的表現であるため、日本語では自然な単数形とした。原文の形は脚注で示す。
- source_word: καλῶς ποιεῖν
  choice: 良いことをする
  rationale: 善をもたらす行為を意味する一般的な表現を、平明で原文に近い日本語にした。
theological_decisions:
- issue: ἄνθρωποςの包括的な指示範囲
  choice: 人
  alternative: 人間／男
  rationale: この語はここで特定の男性ではなく、人間一般を羊と対比している。「人」はその一般性を自然に保ち、原文にない性別限定を持ち込まない。
- issue: 安息日における行為の適法性
  choice: 律法で許されています
  alternative: してもよい／律法にかなっています
  rationale: ἔξεστινは安息日律法をめぐる論争の中で適法性を表す。「律法で許されている」は、その法的・倫理的含意を明確にしつつ、何が「良いこと」かを本文以上に規定しない。
- issue: σάββασινの複数形
  choice: 本文では「安息日に」、脚注で複数形を説明
  alternative: 安息日ごとに／安息日々に
  rationale: この複数形は安息日の遵守を表す一般的な慣用法であり、日本語で機械的に複数化すると不自然になる。意味を自然に伝えつつ、形態上の情報は脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある口調とした。修辞的な比較は「どれほど大切でしょうか」で保ち、結論は「ですから」で明確につないだ。
