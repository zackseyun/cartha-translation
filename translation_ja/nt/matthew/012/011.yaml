reference: Matthew 12:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「あなたがたのうち、羊を一匹持っていて、その羊が安息日に穴に落ちたなら、それをつかんで引き上げない人がいるでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: あなたがたのうち、…人がいて
  rationale: 直訳調の「あなたがたのうち、だれが人であろうか」を避け、肯定の答えを予期する修辞疑問として自然な現代日本語にした。ἄνθρωπος はこの仮定例では一般的な人を指すため、「人」とした。
- source_word: ἕξει πρόβατον ἕν
  choice: 羊を一匹持っている
  rationale: 未来形 ἕξει は仮定的な修辞構文の中にあり、日本語では現在の状態として表すのが自然である。ἕν の単数性は助数詞「一匹」で保持した。
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: その羊が…落ちたなら
  rationale: τοῦτο の指示対象を日本語で明確にするため「その羊」とし、アオリスト接続法を自然な条件表現「落ちたなら」で訳した。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: 複数形は安息日を指す慣用的用法であり、日本語では単数概念の「安息日に」が明瞭である。
- source_word: εἰς βόθυνον
  choice: 穴に
  rationale: βόθυνος は地面などの穴・くぼみを広く指す。「穴」は種類を不必要に限定せず、平易で自然である。
- source_word: οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ
  choice: つかんで引き上げないでしょうか
  rationale: οὐχί が肯定の答えを予期することを「ないでしょうか」で表した。κρατέω の確かな把持を「つかむ」、ἐγείρω の文脈上の上方への救出を「引き上げる」とした。
theological_decisions:
- issue: 代表的な男性単数表現 ἄνθρωπος
  choice: 人
  alternative: 男
  rationale: ギリシア語は文法上男性単数だが、ここでは聞き手一般を代表する仮定上の人物である。日本語の「人」は性別を消す意訳というより、ἄνθρωπος の一般的人間という語義を自然に表す。
- issue: τοῖς σάββασιν の複数形
  choice: 安息日に
  alternative: 安息日ごとに／安息日々に
  rationale: この複数形は安息日を表す慣用法であり、反復や複数の日を意味すると解する必要はない。論争の律法的背景も単数表現で十分伝わる。
- issue: ἐγερεῖ の意味の幅
  choice: 引き上げる
  alternative: 起こす／持ち上げる
  rationale: ἐγείρω は広く「起こす、上げる」を意味するが、穴に落ちた羊という具体的文脈では「引き上げる」が自然である。復活などの神学的含意をこの箇所へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの発言として品位を保ちつつ、修辞疑問が自然に聞こえる語順と敬体を用いた。原文上、注記を必須とするほどの本文異読や訳語上の重大な曖昧さはないため、脚注は付していない。
