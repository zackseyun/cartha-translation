id: MAT.12.44
reference: Matthew 12:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: ja
  text: 'そこで、こう言う。「自分の家へ戻ろう。そこから私は出て行ったのだから。」そして行ってみると、家は空いていて[a]、掃かれ、整えられている[b]。


    [a] 「空の」とも訳せる。


    [b] 「飾られている」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「空の」とも訳せる。
    reason: σχολάζονταは、占有されず空いていること、また空であることを表し得るため。
  - marker: b
    text: 「飾られている」とも訳せる。
    reason: κεκοσμημένονは、整えられた状態のほか、飾られた状態も表し得るため。
lexical_decisions:
- source_word: τότε λέγει
  choice: そこで、こう言う
  rationale: τότεによる展開を「そこで」で示し、文脈上の主語である汚れた霊を不必要に補わず、λέγειの生き生きとした現在形を保った。
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: 自分の家に戻ろう
  rationale: ἐπιστρέψωの帰還の意味と、霊がその家を自分のものと呼ぶ所有の表現を保持した。日本語の引用内では「自分の家」が自然である。
- source_word: ὅθεν ἐξῆλθον
  choice: 出て来た
  rationale: 直前の「自分の家」を修飾する形にして、そこから出たという具体的な移動の像を簡潔に保った。
- source_word: ἐλθὸν εὑρίσκει
  choice: 帰って来てみると
  rationale: 先行する分詞と主動詞の順序を自然な日本語の時間表現にし、見いだしたという発見の含みを「みると」で表した。帰還であることは直前の発言から明らかである。
- source_word: σχολάζοντα
  choice: 空いたままで
  rationale: 家が占有されず、利用できる状態にあるという語義を表す。「空で」という可能な訳は脚注に残した。
- source_word: σεσαρωμένον
  choice: 掃き清められ
  rationale: 完了受動分詞が示す、すでに掃かれて清潔になっている状態を自然に表した。
- source_word: κεκοσμημένον
  choice: 整えられている
  rationale: κοσμέωの「整える、秩序立てる」という意味を採用し、装飾だけに限定しなかった。「飾られている」という可能性は脚注に示した。
theological_decisions:
- issue: 「家」の比喩的意味
  choice: 本文では「家」をそのまま保持し、人や人生と説明しない
  alternative: 「自分が出て来た人のところ」などと比喩を解き明かして訳す
  rationale: 原文はοἶκοςという家の像を用いている。文脈上の比喩を訳文内で解釈し切らず、イエスの修辞的な描写とその緊張を保つため。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、たとえの簡潔さと品位を保持した。引用内の「戻ろう」は独白として自然で、「掃き清められ、整えられている」は二つの完了受動分詞が示す整った状態を伝える。
