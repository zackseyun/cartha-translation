id: MAT.12.34
reference: Matthew 12:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: ja
  text: まむしの子らよ。[a] 悪い者であるあなたがたが、どうして良いことを語れようか。なぜなら、心に満ちあふれていることを、口が語るからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まむしの群れよ」。
    reason: γεννήματαは「子ら」のほか、集合的に「群れ」と表すこともできる。
  - marker: b
    text: 別訳「心の豊かさから、口が語る」。
    reason: περίσσευμαには「満ちあふれ」のほか、「豊かさ」「豊富にあるもの」という意味合いがある。
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: まむしの子ら
  rationale: γέννημαは「生み出されたもの、子」を表し、ἐχιδνῶνとの組み合わせで性質や系譜を鋭く非難する比喩となる。日本語で定着した聖書的表現を用い、比喩の強さを保った。
- source_word: πῶς δύνασθε
  choice: どうして…語れようか
  rationale: 能力を問う形の修辞疑問で、実際には不可能性を強く示す。現代日本語として自然な反語表現にした。
- source_word: ἀγαθὰ λαλεῖν
  choice: 良いことを語る
  rationale: 中性複数のἀγαθάを実質的な名詞として取り、内容を限定せず「良いこと」と訳した。
- source_word: πονηροὶ ὄντες
  choice: 悪い者でありながら
  rationale: 分詞句が示す状況と修辞的な対照を「でありながら」で明示した。πονηροίの倫理的な重みを保ち、単なる質の悪さに弱めなかった。
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: 心に満ちあふれているものから…のだから
  rationale: περίσσευμαの「豊かさ、余り、あふれ」を動的に表現し、内に満ちたものが言葉となって出る比喩を自然な日本語で保った。γάρの理由提示は文末の「のだから」で示した。
- source_word: τῆς καρδίας
  choice: 心
  rationale: καρδίαは感情だけでなく思考や意志を含む内なる人を指し得るため、意味を狭めず聖書的な「心」を保持した。
- source_word: τὸ στόμα λαλεῖ
  choice: 口は語る
  rationale: 内面と発話を結ぶ擬人的で簡潔な表現を、原文に近い形で保った。
theological_decisions:
- issue: 「心」の比喩的意味
  choice: 内なる人を表す聖書的語として「心」を保持する
  alternative: 内面／思い
  rationale: 原文は感情・知性・意志のいずれか一つに限定していないため、解釈で狭めなかった。
- issue: πονηροίの道徳的評価
  choice: 悪い者
  alternative: 邪悪な者／悪人
  rationale: 明確な倫理的非難を保ちつつ、「邪悪な者」ほど過度に強めず、形容詞述語の簡潔さを反映した。
- issue: 修辞疑問の力
  choice: 「どうして…語れようか」と反語で訳す
  alternative: どうして…語ることができるのか
  rationale: 単なる能力への質問ではなく、内面が悪い状態では良い発言が出ないという強い非難を自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの厳しい叱責を弱めず、同時に不必要な古語や過度に激しい語を避けた。原文の二つの比喩「まむしの子ら」「心から口が語る」を保持した。
