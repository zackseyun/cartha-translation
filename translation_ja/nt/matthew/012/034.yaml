  source_fidelity: γεννήματα ἐχιδνῶνを「まむしの子ら」とするのは、日本語聖書で定着した比喩表現であり、原文の厳しい呼びかけをよく保っている。πῶς δύνασθε…πoνηροὶ ὄντεςの修辞的非難も維持されている。一方、後半の「心に満ちあふれているものから、口は語る」は、ἐκ（～から）を保とうとしたため日本語としてやや不自然であり、心の満ちた内容が発話として現れる関係をより明瞭に表すのが安全である。
  naturalness: 前半は明瞭で自然である。「悪い者でありながら」は意味上の主語が文脈から分かるものの、呼びかけを受ける複数の相手を明示して「悪い者であるあなたがたが」とすると、原文の対人的な叱責がより自然かつ明確になる。後半は「心に満ちあふれていることを、口が語る」とすることで、現代標準日本語として滑らかになる。
  terminology: 「まむし」「心」「口」「良いこと」はいずれも適切である。「悪い」はπονηροίの道徳的評価を不当に弱めず、「邪悪な」に過度に強めてもいない。
