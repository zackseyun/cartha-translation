id: MAT.12.18
reference: Matthew 12:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: ja
  text: '「見よ、わたしが選んだわたしのしもべ、

    わたしの愛する者、わたしの魂が喜びとした者。[a]

    わたしは彼の上にわたしの霊を置く。

    彼は諸国の民[b]に公正[c]を告げ知らせる。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの心にかなう者」。直訳的には「わたしの魂が喜びとした者」。
    reason: 日本語として自然な慣用表現との対応を示しつつ、本文が原文の「魂」を保持していることを明確にするため。
  - marker: b
    text: 別訳「異邦人」。
    reason: ἔθνηは文脈により「諸国の民」とも「異邦人」とも訳せるため。
  - marker: c
    text: 別訳「さばき」。
    reason: κρίσιςには「公正」と「さばき」の両方の語義があり、この預言的文脈でも後者の含意を完全には排除できないため。
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言の引用における注意喚起の力と荘重さを保ちつつ、現代日本語でも理解できる表現とした。
- source_word: παῖς
  choice: しもべ
  rationale: イザヤ書の「主のしもべ」という文脈を受ける語であり、ここでは「子」よりも「しもべ」が適切である。
- source_word: ᾑρέτισα
  choice: 選んだ
  rationale: 神による選びが完了した出来事であることを、自然な日本語の過去形で表した。
- source_word: ὁ ἀγαπητός μου
  choice: わたしの愛する者
  rationale: 神の深い愛情を明瞭に伝え、「愛する者」という人格的で品位ある表現にした。
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: わたしの魂が喜びとした者
  rationale: 明示された主語「わたしの魂」を省かず、神の深い喜びと好意を表す表現とした。
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: わたしは彼の上にわたしの霊を置く
  rationale: 預言者的な任命の響きを保ち、「上に」と「置く」を明示して原文の構造に沿った。
- source_word: κρίσιν
  choice: 公正
  rationale: このイザヤ書引用では、しもべが諸国にもたらし告げる神の正しい秩序を指すため、「さばき」より「公正」を本文に採った。語の別の可能性は脚注に残した。
- source_word: τοῖς ἔθνεσιν
  choice: 諸国の民
  rationale: 預言の普遍的な広がりを自然に表す。「異邦人」という意味もあり得るため脚注に示した。
- source_word: ἀπαγγελεῖ
  choice: 告げ知らせる
  rationale: 公に伝達する意味を保ちつつ、現代日本語として明瞭な表現を選んだ。
theological_decisions:
- issue: παῖςが示すメシアの身分
  choice: イザヤ書のしもべの文脈に従い、「しもべ」と訳す。
  alternative: 子、息子
  rationale: この語自体に別箇所の子なる身分を読み込まず、引用元の「しもべ」という主題を保持するため。
- issue: κρίσιςの意味範囲
  choice: 本文では「公正」とする。
  alternative: さばき
  rationale: ここではしもべが諸国に告げる神の正しい秩序という面が前景化している。ただし、裁定・さばきの意味も語義上可能なので脚注に保持した。
- issue: ἔθνηの対象範囲
  choice: 本文では「諸国の民」とする。
  alternative: 異邦人
  rationale: 引用された預言の世界的な射程を保つ一方、ユダヤ人以外を指す伝統的な理解も脚注で示した。
- issue: 「わたしの魂」の保持
  choice: ψυχήを「魂」として明示する。
  alternative: わたしの心にかなう者、わたしが喜びとする者
  rationale: 日本語としてやや荘重だが、原文が神の「魂」を明示する強い人格的・情意的表現を平板化しないため。
translation_notes:
  register: 預言の引用としての品位を保つため「見よ」「しもべ」を用いた。全体は明瞭な現代標準日本語とし、原文の並行的な句構造が聞き取れるよう改行した。「魂」は日常語より荘重だが、原文の明示的な表現と神の深い喜びを保持するため採用した。
