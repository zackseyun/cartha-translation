  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: ja
  text: これは、預言者イザヤを通して次のように語られたことが実現するためであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: 実現するためであった
  rationale: 目的と結果の両方を含み得る接続表現として、文脈上自然な「ため」を用いた。「であった」により前節の出来事を受ける。
- source_word: πληρωθῇ
  choice: 実現する
  rationale: マタイの成就定型句を、現代日本語で自然かつ明瞭に表す。「成就する」より一般読者に理解しやすく、語られた内容が現実となる意味を保つ。
- source_word: τὸ ῥηθὲν
  choice: 語られたこと
  rationale: 冠詞付き受動分詞の名詞的用法と受動の意味を簡潔に保持する。
- source_word: διὰ
  choice: を通して
  rationale: 属格を伴うδιάが示す媒介者としての預言者の役割を保持し、イザヤが究極的な発言主体であると限定しない。
- source_word: Ἠσαΐου
  choice: イザヤ
  rationale: 日本語聖書で定着した預言者名の表記を用いる。
- source_word: τοῦ προφήτου
  choice: 預言者
  rationale: イザヤを同格的に説明する原文の要素を明示する。
- source_word: λέγοντος
  choice: こう言われている
  rationale: 次節の引用を導く機能を自然な日本語で示す。文法上イザヤにかかる可能性を残しつつ、引用内容への滑らかな接続を優先した。
theological_decisions:
- issue: 引用定型句における預言者の媒介性
  choice: 預言者イザヤを通して
  alternative: 預言者イザヤによって
  rationale: διά＋属格の媒介的意味を明示し、神が預言者を通して語るという原文の構図を不用意に平板化しない。
- issue: ἵνα節の目的・結果の幅
  choice: 実現するためであった
  alternative: こうして実現した
  rationale: ἵναの目的・結果の両義性を完全には一方に限定せず、マタイの成就表現として自然な形を採った。
translation_notes:
  register: 明瞭な現代標準日本語。引用導入句としての荘重さを保ちながら、「成就」のような教会内でのみ馴染みやすい語を避け、一般読者にも分かる表現とした。
