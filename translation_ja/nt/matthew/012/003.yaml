  to: しかし、イエスは彼らに言われた。「ダビデが空腹で、彼と一緒にいた人たちも空腹だったとき、彼が何をしたか、あなたがたは読んだことがないのですか。」
  rationale: 「空腹になった」を状態を表す「空腹で／空腹だった」に改め、πεινάωの意味をより素直に反映した。同行者にも空腹が及ぶ自然な読みは本文で示しつつ、ギリシア語で動詞が単数形であるという統語上の特徴と、それに伴う表現上の幅を脚注に保存した。
