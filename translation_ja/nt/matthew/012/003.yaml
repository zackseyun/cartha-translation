  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「ダビデが空腹で、彼と一緒にいた人たちも空腹だったとき、彼が何をしたか、あなたがたは読んだことがないのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: しかし、イエスは
  rationale: δέは直前の非難に対する応答を示す穏やかな接続語なので「しかし」とした。ὁは文脈上イエスを指すため、現代日本語で主語を明確にした。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: 与格αὐτοῖςを「彼らに」、λέγωを自然な「言う」で表した。イエスの発言として敬意を示す「言われた」を用いた。
- source_word: Οὐκ ἀνέγνωτε
  choice: 読んだことがないのですか
  rationale: 聖書を知っているはずだという修辞疑問の力を、自然な現代日本語の経験表現で示した。
- source_word: τί ἐποίησεν
  choice: 彼が何をしたか
  rationale: ποιέωの単純な歴史的意味を「した」とし、三人称単数の主語ダビデを「彼」で受けた。
- source_word: Δαυὶδ
  choice: ダビデ
  rationale: 日本語で定着している聖書人名表記を用いた。
- source_word: ὅτε ἐπείνασεν
  choice: ダビデが空腹になり
  rationale: πεινάωを自然な「空腹になる」で表した。動詞が三人称単数で、明示的にはダビデを指すことを保った。
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: 一緒にいた人たちも空腹になったとき
  rationale: 字義的には「彼と共にいた者たち」。日本語として文を完結させるため、前の「空腹になった」を補ったが、ギリシア語の省略と解釈上の幅は脚注で示した。
theological_decisions:
- issue: 空腹がダビデだけに明示されるのか、同行者にも及ぶのか
  choice: 本文ではダビデと同行者の双方が空腹だったと表現する
  alternative: 「ダビデが空腹になったとき、彼と一緒にいた人たちは」とし、省略をそのまま残す
  rationale: ἐπείνασενは単数で明示的にはダビデを指すが、続くκαὶ οἱ μετ’ αὐτοῦは同じ述語を補って読むのが自然である。ただし原文の統語上の特徴を消さないよう脚注を付した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、論争場面にふさわしい端正さを保った。「あなたがたは読んだことがないのですか」は、相手の聖書知識に訴える修辞疑問として自然に聞こえる表現である。
