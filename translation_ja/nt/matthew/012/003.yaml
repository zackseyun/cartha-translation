review_pass:
  verdict: revise
  source_fidelity: 本文は、ダビデと同行者の双方が空腹だったという自然な理解を適切に表している。ただし「空腹になり／空腹になった」は、πεινάωの状態「空腹であった」よりも空腹になった出来事を前面に出し、原文の含みをわずかに狭める。
  naturalness: 原案は概ね明快だが、「空腹になり、一緒にいた人たちも空腹になったとき」は「なり」の反復がやや重く、時系列的にも読まれうる。「空腹で…空腹だったとき」とするほうが自然である。
  terminology: 「ダビデ」は標準的であり、「彼らに言われた」「あなたがた」はこの論争場面にふさわしい端正な表現である。脚注は、単数動詞が明示的にはダビデに対応する点を適切に説明するよう整える。
  issues:
  - severity: low
    issue: πεινάωを「空腹になった」と訳している
    rationale: πεινάωはここでは空腹という状態を述べる。「空腹になった」は意味として可能だが、空腹になった瞬間・変化を示しやすい。
  - severity: low
    issue: 脚注の「別訳」が本文とほぼ同じ意味を反復している
    rationale: 訳語上の別訳としてではなく、原文の単数動詞と後続する同行者句との統語的関係を説明する脚注にしたほうが有益である。
  revised_text: しかし、イエスは彼らに言われた。「ダビデが空腹で、彼と一緒にいた人たちも空腹だったとき、彼が何をしたか、あなたがたは読んだことがないのですか。」
  revised_footnotes:
