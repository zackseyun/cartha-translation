id: MAT.12.31
reference: Matthew 12:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: ja
  text: ですから、あなたがたに言います。人には、どんな罪も冒涜も赦されます。しかし、霊に対する冒涜[a]は赦されません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、この「霊」は聖霊を指す。原文はこの節では単に「霊」とある。
    reason: 原文の簡潔な表現を保ちながら、文脈上の指示対象を明確にするため。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す。現代日本語として自然で、論理的なつながりを保つ。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけと厳粛な告知の力を保ちつつ、明瞭な現代日本語とした。
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: どんな罪も冒瀆も
  rationale: πᾶσα の包括的・配分的な意味を自然に表し、二つの名詞をともに赦しの対象として示す。
- source_word: βλασφημία
  choice: 冒瀆
  rationale: この文脈では、神的なものに対する反抗的・侮辱的な言動を指すため、「中傷」より「冒瀆」が適切である。
- source_word: ἀφεθήσεται
  choice: 赦されます
  rationale: ここでの ἀφίημι は罪の赦しを意味する。未来受動の内容を日本語では文脈上の将来的・一般的宣言として自然に表した。
- source_word: τοῖς ἀνθρώποις
  choice: 人には
  rationale: 赦しを受ける者を示す与格を「人には」とし、性別を限定しない一般的な人間への言及を保った。
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: しかし、霊に対する冒瀆
  rationale: 属格を冒瀆の対象として理解するのが文脈上自然である。「聖なる」に当たる語は本文にないため、本文では「霊」とし、指示対象を注で明示した。
theological_decisions:
- issue: πνεύματος を本文で「霊」とするか「聖霊」とするか
  choice: 霊
  alternative: 聖霊
  rationale: この節のギリシア語本文には ἁγίου（聖なる）がなく、単に τοῦ πνεύματος とある。直前の文脈から聖霊を指すことは明らかだが、本文では原文の表現を保ち、文脈上の指示対象を脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な宣言にふさわしい品位を保った。「人には」という構文により、ギリシア語の受動表現と赦しの受け手を自然な日本語で示した。
