id: MAT.12.33
reference: Matthew 12:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: ja
  text: 木を良いものにし、その実も良いものにしなさい。あるいは、木を腐ったものにし、その実も腐った[b]ものにしなさい。[a] 木はその実によって見分けられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「良いものにしなさい」「腐ったものにしなさい」は、「良いものと見なしなさい」「腐ったものと見なしなさい」、または「良いものだと示しなさい」「腐ったものだと示しなさい」という修辞的な意味にも取れます。ただし、ギリシア語の形は命令形です。
    reason: alternative_reading
  - marker: b
    text: 「腐った」と訳したギリシア語は、「悪い」「傷んだ」「役に立たない」という意味にもなります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: 良いものにしなさい／腐ったものにしなさい
  rationale: アオリスト命令形の直接的な力と、二つの句の並行関係を保った。文脈上は「そう見なせ」「そう示せ」という修辞的な響きもあり得るため、脚注で示した。
- source_word: δένδρον
  choice: 木
  rationale: 比喩の中心となる語の標準的で自然な訳。
- source_word: καλός
  choice: 良い
  rationale: 木や実の質の良さと、文脈にある倫理的な響きの双方を保てる。
- source_word: καρπός
  choice: 実
  rationale: 木の比喩に即した、自然で簡潔な日本語。
- source_word: σαπρός
  choice: 腐った
  rationale: 傷み、腐敗し、役に立たない状態を表す語の鮮明さを保ち、木と実の双方に適用できる表現とした。
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: その実によって……からです
  rationale: ἐκを日本語の受け身に自然な「によって」で表し、γάρの説明関係を「からです」で明示した。
- source_word: γινώσκεται
  choice: 見分けられる
  rationale: 単に知識として「知られる」よりも、実を手がかりに木の性質が判別されるという文脈を自然に表す。
theological_decisions:
- issue: 比喩における命令形の力
  choice: 「良いものにしなさい」「腐ったものにしなさい」と命令形を保持した。
  alternative: 「良いものと見なしなさい」「腐ったものと見なしなさい」、または条件文として訳す。
  rationale: 原文は二度とも命令形であり、修辞的な挑戦としての鋭さを保つため、本文では命令形をそのまま訳した。一方、実際に木の性質を作り変える命令なのか、首尾一貫して評価せよとの要求なのかは断定せず、脚注で幅を示した。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの言葉の命令的な鋭さと反復による並行構造を保持した。「果実」ではなく日常的な「実」、「知られる」ではなく文脈に自然な「見分けられる」を採用した。
