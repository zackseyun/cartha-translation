id: MAT.12.42
reference: Matthew 12:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ja
  text: 南の女王[a]は、裁きの時にこの世代とともに立ち上がり、この世代を罪に定める。彼女はソロモンの知恵を聞くために、地の果てから来たからである。見よ、ここにソロモンよりも偉大なものがある。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「南の女王」はシェバの女王を指す（列王記第一10章1–13節、歴代誌第二9章1–12節）。ただし、ギリシア語本文には「シェバ」という名はない。
    reason: cross_reference
  - marker: b
    text: 別訳「ここにソロモンよりも偉大な方がいる」。ギリシア語は中性形（直訳「より偉大なもの」）を用いており、イエスとその働きに現れた、ソロモンをしのぐ偉大さを強調している可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: 南の女王
  rationale: 属格を素直に表し、ギリシア語本文にない「シェバ」を本文へ補わない。旧約聖書上の背景は脚注で示す。
- source_word: ἐγερθήσεται
  choice: 立ち上がり
  rationale: 受動形は「起こされる」とも訳せるが、裁きの場で立つ意味と復活を想起させる含みの双方を保ちつつ、自然な日本語とした。
- source_word: ἐν τῇ κρίσει
  choice: 裁きの時に
  rationale: 定冠詞のある終末的な裁きを指す表現として、文脈が明確になる自然な日本語を用いた。
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: この世代とともに
  rationale: 属格を伴う μετά の通常の意味「ともに」を保持し、「敵対して」という意味を前置詞自体に読み込まない。
- source_word: κατακρινεῖ αὐτήν
  choice: この世代を罪に定める
  rationale: κατακρίνω の有罪宣告の意味を「罪に定める」で表した。日本語で不明瞭になる代名詞を避け、指示対象を繰り返した。
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: 地の果てから
  rationale: 非常に遠い場所を表す慣用的表現を、簡潔で聖書的かつ現代にも理解できる形で訳した。
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ソロモンの知恵を聞くために
  rationale: 不定詞の目的用法と属格関係を明確に保った。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 聞き手の注意を強く促す談話標識の荘重な力を保持した。
- source_word: πλεῖον Σολομῶνος
  choice: ソロモンよりも偉大なもの
  rationale: 中性形 πλεῖον を「もの」と訳し、単に男性個人を指す「方」と決めず、イエスとその働きに現れている卓越性を含みうる原文の幅を保った。
- source_word: ὧδε
  choice: ここに…ある
  rationale: 場所を示す「ここに」を明示し、中性表現に合わせて自然な存在表現とした。
theological_decisions:
- issue: 中性比較級 πλεῖον がイエスとの関係で何を指すか
  choice: ソロモンよりも偉大なもの
  alternative: ソロモンよりも偉大な方
  rationale: 文脈上イエス自身が中心にあるが、原文は男性形ではなく中性形を用いる。そのため、イエス本人だけに狭めず、イエスとその宣教において現に存在する、ソロモンを超える偉大さを含みうる表現とした。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「裁き」「罪に定める」「見よ」によって発言の荘重さと司法的な響きを保持した。「この世代」は原文の簡潔さを優先し、「この時代の人々」と説明的に広げなかった。
