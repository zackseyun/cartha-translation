  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: ja
  text: しかし、イエスは彼らに答えて言われた。「邪悪で姦淫する世代[a]はしるしを求める。だが、預言者ヨナのしるし[b]のほかには、この世代にしるしは与えられない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「姦淫する」は、文字どおりの姦淫に加えて、預言書で姦淫が神への不忠実の比喩として用いられることも響かせていると考えられる。
    reason: cross_reference
  - marker: b
    text: この表現は「ヨナという預言者のしるし」とも訳せる。しるしが具体的に何を指すかは、直後の文脈で説明される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えて言われた
  rationale: 分詞と定動詞を重ねた福音書特有の語り方を保ちつつ、現代日本語として通じる表現にした。敬語はイエスの発言を語る日本語聖書の自然で品位ある文体に合わせた。
- source_word: Γενεὰ
  choice: 世代
  rationale: 同時代の人々を一つの集団として道徳的に特徴づける語であり、単に「人々」とせず、原語の集合的な力を保つ。
- source_word: πονηρὰ
  choice: 邪悪
  rationale: 道徳的な断罪の強さを明確に伝え、「悪い」よりもこの文脈にふさわしい重みを持たせた。
- source_word: μοιχαλὶς
  choice: 姦淫
  rationale: 文字どおりの性的背信と、預言書に見られる神への契約的不忠実という比喩の双方を響かせるため、「不忠実」と解釈的に限定しなかった。
- source_word: σημεῖον
  choice: しるし
  rationale: 証拠となる出来事を指し得る広い語義を保ち、「奇跡」と限定しなかった。
- source_word: ἐπιζητεῖ
  choice: 求める
  rationale: 強く求める含みはあり得るが、「要求する」とまで明示せず、原文の基本的な意味を自然に表した。
- source_word: δοθήσεται
  choice: 与えられない
  rationale: 未来受動を、前の否定語と合わせて自然な日本語の受動表現にした。
- source_word: αὐτῇ
  choice: （訳文では省略）
  rationale: 「その世代に」を受ける女性単数代名詞だが、日本語では受け手を繰り返さなくても明白であり、省略する方が自然である。
- source_word: εἰ μὴ
  choice: のほかには
  rationale: 否定文における唯一の例外を明確に示す自然な日本語とした。
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: 預言者ヨナのしるし
  rationale: 属格句の曖昧さを保ち、この節だけでヨナのしるしの具体的内容を説明しない。
theological_decisions:
- issue: 「姦淫」の意味
  choice: 比喩的・預言者的な鋭さを保つ「姦淫」を本文に置く。
  alternative: 不忠実
  rationale: この語は性的な不道徳を指し得ると同時に、神に対する契約的不忠実を表す預言書的な比喩も呼び起こす。一方だけに意味を限定しないためである。
- issue: 「ヨナのしるし」の内容
  choice: 本文では「預言者ヨナのしるし」とだけ訳し、内容を説明しない。
  alternative: ヨナの経験と同じようなしるし
  rationale: 具体的な意味は直後の文脈で展開されるため、この節で特定の解釈を先取りしない。
translation_notes:
  register: 明快な現代標準語を用いつつ、イエスの厳しい断罪と福音書の荘重さを保った。「しるし」は漢字の「徴」より読みやすい平仮名とし、「しかし」と「だが」で論理の転換を明確にした。
