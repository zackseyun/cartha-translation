  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: ja
  text: そして、弟子たちのほうへ手を伸ばして言われた。「見なさい[a]、わたしの母と兄弟たち[b]だ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見よ」または「さあ、見なさい」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は男性複数形の「兄弟」。ここでは「兄弟姉妹」と広げずに訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: 手を伸ばして
  rationale: アオリスト分詞が主動詞に先立つ身ぶりを表しており、日本語では連用形によって自然に一連の動作として示せる。
- source_word: τὴν χεῖρα
  choice: 手を
  rationale: 具体的な指示の身ぶりを表す通常の意味であり、「腕」より原語に即している。
- source_word: ἐπὶ τοὺς μαθητὰς
  choice: 弟子たちのほうへ
  rationale: 対格を伴うἐπίは、この身ぶりの文脈では弟子たちへ向かう方向を表す。「ほうへ」により、手を差し向ける動作を自然な日本語で伝える。
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 注意を促し、目の前の人々を指し示す語。古風な「見よ」より現代の読者に明瞭でありながら、命令的な強調を保つ。
- source_word: ἡ μήτηρ μου
  choice: わたしの母
  rationale: 具体的な親族名称をそのまま保ち、弟子たちを家族として示す発言の修辞的な力を伝える。
- source_word: οἱ ἀδελφοί μου
  choice: わたしの兄弟たち
  rationale: 原文の男性複数形と直前から続く実際の家族をめぐる表現を保ち、「兄弟姉妹」や「家族」と解釈的に広げない。
theological_decisions:
- issue: イエスが弟子たちを家族として示す親族語の訳
  choice: 「母」「兄弟たち」という具体的な親族語を保持する
  alternative: 「家族」または「兄弟姉妹」と包括的に言い換える
  rationale: この節は、具体的な親族名称によって弟子たちをイエスの家族として指し示す。一般化すると修辞的な対比が弱まり、原文に明示されない解釈を加えることになる。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの身ぶりと指示の力を簡潔に表した。「見なさい」は現代的だが軽すぎず、発言末尾の「だ」は直接的な同定を自然に伝える。
