id: MAT.12.10
reference: Matthew 12:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: ja
  text: すると、そこに手が萎えた人がいた。彼らはイエスを訴えるために、イエスに尋ねた。「安息日[a]に人を癒やすことは、許されていますか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「安息日」は複数形。安息日一般を指す通常の言い方。
    reason: 原文の数を示しつつ、日本語本文を自然に保つため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: すると、そこに
  rationale: 場面に注意を向ける語りの働きを、現代日本語で自然に表した。「見よ」も可能だが、ここでは不必要に古風な調子を避けた。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 文脈では成人男性を指すが、日本語の「人」は自然であり、人物の性別をあえて曖昧にする表現でもない。
- source_word: χεῖρα ἔχων ξηράν
  choice: 片手の萎えた
  rationale: ξηράν は、手が衰え、動かない、または痩せ細った状態を表す。「萎えた」は病状を過度に特定せず、簡潔に表現できる。単数の χεῖρα は自然な日本語として「片手」とした。
- source_word: ἐπηρώτησαν αὐτόν
  choice: イエスに……尋ねた
  rationale: 代名詞の指示対象を日本語で明確にしつつ、動詞自体に必要以上の敵意を持たせない訳とした。敵対的な意図は後半で明示される。
- source_word: ἔξεστι
  choice: 律法で許されていますか
  rationale: 単なる社会的な許可ではなく、安息日をめぐる律法上の可否を問う表現であるため、「律法で」を補って法的・宗教的な意味を明確にした。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: ギリシア語は複数形だが、安息日一般を指す通常の言い方である。日本語では単複を形の上で区別せず、「安息日に」が最も自然である。原文の形は脚注に示した。
- source_word: θεραπεύειν
  choice: 人を癒やすこと
  rationale: 目的語は明示されていないが、日本語では「人を癒やす」とすることで問いの一般性を自然に表せる。「癒やす」は福音書の治癒の文脈に適する。
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: イエスを訴えるために
  rationale: ἵνα の目的を明確に表し、κατηγορέω の告発・非難という法的で敵対的な含みを「訴える」で保持した。
theological_decisions:
- issue: 安息日をめぐる問いの法的性格
  choice: 「律法で許されていますか」と明示する
  alternative: 「してもよいですか」
  rationale: ἔξεστι は許可の可否を問うが、この場面では安息日律法をめぐる論争である。「律法で」を添えることで、単なる礼儀や慣習上の質問と誤解されるのを避けた。
- issue: τοῖς σάββασιν の複数形
  choice: 本文は自然な「安息日に」とし、脚注で原文の複数形を示す
  alternative: 「安息日ごとに」または「安息日々に」
  rationale: ギリシア語の複数形は安息日を指す一般的な用法であり、反復の意味を強く限定する必要はない。不自然な逐語訳を避けながら原文情報を脚注に保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語としての品位を保った。「すると、そこに」で ἰδοὺ の注意喚起を自然に表し、問いの律法上の性格と、告発を目的とする敵意を明確にした。
