  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: ja
  text: イエスがまだ群衆に話しておられる間に、見よ、母と兄弟たち[a]が外に立っていて、イエスに話をしようとしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「近親者たち」とも訳し得る。ギリシア語は男性複数形で、本文では「兄弟たち」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: イエスがまだ……話しておられると
  rationale: 属格独立構文による同時進行を自然な日本語で表し、ἔτιの継続性を「まだ」によって保持した。δὲは弱い場面転換であり、「と」による展開の中に自然に織り込んだ。主語は文脈上のイエスを明示した。
- source_word: τοῖς ὄχλοις
  choice: 群衆に
  rationale: ギリシア語は複数形だが、日本語の「群衆」は集合的に用いられ、数を不自然に強調せず原意を明瞭に伝える。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 新たな展開へ注意を向ける、際立った物語上の標識としての力を保持した。
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: 母と兄弟たち
  rationale: αὐτοῦは文法上「兄弟たち」に付くが、両者がイエスの家族であることは文脈上明白である。日本語では所有代名詞を重ねず、自然に表現した。ἀδελφοίの男性複数形は本文で「兄弟たち」とした。
- source_word: εἱστήκεισαν ἔξω
  choice: 外に立っていて
  rationale: ἵστημιの完了語幹による継続的な状態を「立っていて」とし、ἔξωは場所を補わず「外」と訳した。
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: イエスに話そうとしていた
  rationale: ζητέωの目的をもった試みを、現代日本語として自然な「話そうとしていた」で表した。代名詞は日本語で指示対象を明確にするため「イエス」とした。
theological_decisions:
- issue: イエスの家族に関するἀδελφοίの訳
  choice: 兄弟たち
  alternative: きょうだいたち／近親者たち
  rationale: 男性複数形の語彙上の表面を本文では「兄弟たち」と訳す。ただし、この語だけからイエスとの厳密な親族関係を確定せず、より広い親族を指し得る可能性を脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述。「見よ」によりἰδούの注意喚起を保ち、「おられる」でイエスへの自然な敬意を示した。
