id: MAT.12.43
reference: Matthew 12:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: ja
  text: 汚れた霊が人から出て行くと、水のない場所[a]を通り、休みを求めるが、見つからない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「乾いた場所」。ギリシア語は字義的には「水のない場所」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: 〜と
  rationale: 一般的な場合を示す時間・条件表現として自然な日本語にした。δὲの軽い談話上の移行は、文脈上不自然な「さて」「しかし」を加えず、文のつながりに委ねた。
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: 汚れた霊
  rationale: 福音書の悪霊追放の文脈で定着した意味を保ちつつ、原文が「悪霊」ではなく「汚れた霊」と述べる点をそのまま示した。
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: 人から出て行く
  rationale: 移動の起点を明確にし、一般的な例としてのἄνθρωποςを自然な日本語の「人」で表した。
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: 水のない場所を巡り歩いて
  rationale: ἄνυδροςの具体的な「水のない」という像を保った。「巡り歩く」は複数の場所を通り行く継続的な動きを自然に表す。
- source_word: ζητοῦν ἀνάπαυσιν
  choice: 休みを求める
  rationale: 分詞の同時的・目的的な動作を簡潔に示し、ἀνάπαυσιςを解釈的な「休み場」ではなく「休み」と訳した。
- source_word: καὶ οὐχ εὑρίσκει
  choice: が、見つからない
  rationale: 直前の「休み」が目的語であることは日本語でも明瞭なため反復せず、自然な対照を「が」で示した。
theological_decisions:
- issue: 悪霊追放の文脈におけるπνεῦμαの訳語
  choice: 霊
  alternative: 悪霊
  rationale: 指示対象は邪悪な霊的存在だが、原文はδαιμόνιονではなくπνεῦμαを用いているため、「汚れた霊」として原文の表現を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、イエスの教えにふさわしい簡潔で端正な調子を保った。脚注記号は修飾対象である「水のない場所」の直後に置いた。
