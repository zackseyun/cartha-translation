id: MAT.12.28
reference: Matthew 12:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ja
  text: しかし、もしわたしが神の霊によって[a]悪霊を追い出しているのなら、それなら、神の国はあなたがたのもとに達したのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の霊のうちに」。ギリシア語は、手段・働き手を表すとも、領域を表すとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたの上に達した」「あなたがたに追いついた」とも訳せる。神の国がイエスの働きにおいて彼らのもとまで来たことを強調する表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、もし
  rationale: δέの穏やかな対比と、εἰが導く条件を、自然な現代日本語で表した。
- source_word: ἐν πνεύματι θεοῦ
  choice: 神の霊によって
  rationale: ἐν＋与格を、ここでは悪霊追放の手段・働き手を示す表現として訳した。「神の霊のうちに」という可能性は脚注に残した。
- source_word: ἐγὼ
  choice: わたしが
  rationale: ギリシア語では明示された代名詞に強調があるため、主語を省かず訳した。
- source_word: ἐκβάλλω
  choice: 追い出している
  rationale: 悪霊追放の文脈で明快かつ自然な表現。「している」により、論証の根拠となる現実の働きを示す。
- source_word: τὰ δαιμόνια
  choice: 悪霊ども
  rationale: δαιμόνιαを現代日本語で理解しやすく表し、複数であることも示した。
- source_word: ἄρα
  choice: のなら
  rationale: 条件から導かれる帰結を、日本語の「もし…のなら」という構文で自然に明示した。
- source_word: ἔφθασεν
  choice: すでに…到来した
  rationale: φθάνωの「達する、到来する」という意味と、イエスの働きにおいて神の国が現に達している含意を表した。「すでに」は文脈上の到来の現実性を明瞭にする。
- source_word: ἐφ’ ὑμᾶς
  choice: あなたがたのところに
  rationale: ἐπί＋対格が示す、聞き手にまで達したという方向性を自然な日本語で表した。より強い「あなたがたの上に」は脚注で示した。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 神の王的支配とその領域の双方を含みうる、定着した簡潔な訳語を採用した。
theological_decisions:
- issue: 悪霊追放と神の国の到来との関係
  choice: イエスが神の霊によって悪霊を追い出す働きは、神の国が聞き手のもとに現実に到来したことを示す。
  alternative: 神の国は近づいただけでまだ到来していない、または将来の完成だけを指す。
  rationale: ἔφθασενは「達した、到来した」を意味し、この節の論証は悪霊追放が神の支配の現在的到来を示すことに基づく。一方で、将来の完成について本文以上の断定は加えない。
- issue: 「神の霊」の指示対象
  choice: イエスの悪霊追放に働く神の霊を指す。
  alternative: 人格的含意のない一般的な神の力だけを指す。
  rationale: πνεῦμα θεοῦという表現をそのまま「神の霊」とし、単に「神の力」と言い換えて意味を狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」「あなたがた」は聖書本文として自然な表記とし、「悪霊ども」で複数性を明示した。条件と帰結を一文の流れで読みやすく整えた。
