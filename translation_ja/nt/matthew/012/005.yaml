id: MAT.12.5
reference: Matthew 12:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: ja
  text: それとも、律法に、安息日ごとに祭司たちが神殿で安息日を汚していても、罪には問われない、とあるのを読んだことがないのですか。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚す」は、「冒涜する」「安息日を破る」とも訳せる。ギリシア語の動詞には、聖なるものを俗なものとして扱うという意味がある。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は複数形で、「安息日ごとに」という、繰り返される安息日の機会を指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: ここでいう「律法」はモーセの律法を指す。特に、安息日における祭司の奉仕に関する規定が念頭にあると考えられる（民数記28章9～10節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: イエスが反論の中で別の聖書的根拠を示す流れを、自然な日本語の接続で保つ。
- source_word: οὐκ ἀνέγνωτε
  choice: 読んだことがないのですか
  rationale: 聖書を読んで知っているはずだと問う、マタイに特徴的な修辞疑問を現代日本語で表す。
- source_word: ἐν τῷ νόμῳ
  choice: 律法の中で
  rationale: 抽象的な法一般ではなく、モーセの律法という聖書文書を指す。
- source_word: τοῖς σάββασιν
  choice: 安息日ごとに
  rationale: ギリシア語の複数形が示唆する、繰り返される安息日の務めを、日本語として自然に表す。
- source_word: οἱ ἱερεῖς
  choice: 祭司たちは
  rationale: 神殿で祭儀を担う祭司を指す標準的な訳語。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόνは聖所内部に限らず神殿域を指し得るが、本文では簡潔で自然な「神殿」とする。
- source_word: τὸ σάββατον
  choice: 安息日を
  rationale: βεβηλοῦσινの目的語として、安息日という制度・聖日を指す単数形を保つ。
- source_word: βεβηλοῦσιν
  choice: 汚しても
  rationale: 聖なるものを俗なものとして扱うという強い意味を保つ。「破る」だけでは語の聖俗的な含意が弱まる。逆接的な「ても」により、後続の無罪性との緊張を自然に示す。
- source_word: ἀναίτιοί εἰσιν
  choice: 罪には問われない
  rationale: ここで中心となる法的・道徳的な非帰責性を明確に伝える。「罪がない」より、行為が問題に見えても責任を負わないという対比が伝わる。
theological_decisions:
- issue: 祭司が安息日を実際に冒瀆したとの断定を避けるため、表現を弱めるべきか
  choice: 「安息日を汚しても、罪には問われない」と強い動詞と非帰責性の双方を保持する
  alternative: 「安息日の規定に反する働きをしても、罪にはならない」などと説明的に和らげる
  rationale: 原文はβεβηλοῦσινとἀναίτιοίの間に意図的な緊張を置く。祭司の神殿奉仕は外形上、安息日を俗用するように見えるが、律法上は罪に問われない。その緊張を訳文で解消しない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの鋭い修辞疑問にふさわしい品位を保った。「安息日ごとに」は複数形の意味を自然に伝え、「汚しても、罪には問われない」によって原文の神学的・修辞的緊張を保持した。すべての脚注標識を本文に明示した。
