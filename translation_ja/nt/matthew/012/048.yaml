id: MAT.12.48
reference: Matthew 12:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: ja
  text: しかしイエスは、イエスに話しかけていた人に答えた[a]。「わたしの母とは誰ですか。また、わたしの兄弟たちとは誰ですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「しかしイエスは、イエスに話しかけていた人に答えて言った」。
    reason: ἀποκριθεὶς εἶπεν の形式を示す語句上の別訳。
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: しかしイエスは、答えた
  rationale: ἀποκριθεὶς εἶπεν は「答えて言った」というセム語的な言い回しであり、現代日本語では「答えた」で意味を自然に表せる。δέ は場面の転換と応答の対照を示すため「しかし」とした。主語は文脈上イエスであり、日本語で明確にした。
- source_word: τῷ λέγοντι αὐτῷ
  choice: 自分に話しかけていた人に
  rationale: 定冠詞付き現在分詞 λέγοντι は、イエスに言葉をかけていた人物を指す。「話しかけていた」は継続中の発話と相手への働きかけを自然な日本語で表す。
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: わたしの母とは誰ですか
  rationale: 身份を問う修辞的疑問を説明的に言い換えず、そのまま保った。「とは」により、日本語として自然に問いの焦点を示す。
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: また、わたしの兄弟たちとは誰ですか
  rationale: καί を「また」で表し、第一の問いとの並行関係を保った。ἀδελφοί は男性複数形で、直前の物語上の家族を指すため「兄弟たち」とした。
theological_decisions:
- issue: イエスが家族の身份を問う修辞的疑問の解釈
  choice: 問いを説明なしに字義どおり残す
  alternative: 「誰がわたしの母と見なされ、誰がわたしの兄弟と見なされますか」
  rationale: 続く文脈では新しい親族関係が示されるが、本節の訳文にその説明を先取りせず、修辞的な緊張を保つ。
- issue: ἀδελφοί の性別表現
  choice: 兄弟たち
  alternative: きょうだいたち／兄弟姉妹
  rationale: 原語は男性複数形であり、この場面ではイエスの家族として登場した兄弟を直接指しているため、範囲を混合集団へ広げない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、修辞的な二つの問いとその並行性を保持した。敬体の疑問形は、荘重さを損なわず一般読者にも理解しやすい。
