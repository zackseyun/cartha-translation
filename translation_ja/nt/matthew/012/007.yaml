id: MAT.12.7
reference: Matthew 12:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: ja
  text: しかし、『わたしが望むのはあわれみであって、いけにえではない』[b]とはどういう意味かを知っていたなら、あなたがたは罪のない人たち[a]を罪に定めはしなかったでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「潔白な人たち」。
    reason: lexical_alternative
  - marker: b
    text: イエスはホセア書6章6節を引用している。
    reason: cross_reference
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: 知っていたなら
  rationale: 過去の時点で理解していなかったことを責める反実仮想の条件を、自然な日本語で表す。ここで「知る」は引用聖句の意味を理解することを含む。
- source_word: τί ἐστιν
  choice: とはどういう意味か
  rationale: 引用された聖句の意味を問う導入句として、現代日本語で明確かつ自然である。
- source_word: Ἔλεος
  choice: あわれみ
  rationale: ἔλεοςの慈悲・憐憫の意味を簡潔に保ち、文脈上の隣人への思いやりにも通じる表現である。
- source_word: θέλω
  choice: わたしが望むのは
  rationale: 預言書からの引用にふさわしい品位を保ち、「欲しい」よりも自然に神の意志と優先を示す。
- source_word: θυσίαν
  choice: いけにえ
  rationale: 祭儀においてささげられる犠牲を指す語として、聖書文脈で分かりやすい日本語である。
- source_word: κατεδικάσατε
  choice: 罪に定めはしなかったでしょう
  rationale: καταδικάζωの司法的な「有罪とする、断罪する」という力を保ち、反実仮想の帰結を明示する。
- source_word: τοὺς ἀναιτίους
  choice: 罪のない人たち
  rationale: 形容詞の複数・名詞的用法と法的な無罪性を、硬すぎない現代日本語で表す。「潔白な人たち」も可能。
theological_decisions:
- issue: ホセア6章6節の引用における、あわれみといけにえの対比
  choice: わたしが望むのはあわれみであって、いけにえではない
  alternative: わたしはあわれみを望み、いけにえを望まない
  rationale: 原文の鋭い対比をそのまま保ち、儀式から切り離されたあわれみの優先性を示す一方、翻訳によって犠牲制度全体の一律な否定と解釈し切らない。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「あわれみ」「いけにえ」は引用句の聖書的な響きを保ち、「罪のない人たち」で結論の司法的意味を平易にした。脚注記号は対応する語句・引用に近い位置に置いた。
