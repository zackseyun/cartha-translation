id: MAT.12.1
reference: Matthew 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: ja
  text: そのころ、イエスは安息日に[a]麦畑の中を通られた。弟子たちは空腹になり、麦の穂を摘み始め、それを食べた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「安息日」が複数形になっているが、ここでは「安息日に」を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: そのころ
  rationale: 物語上の時を示す自然な現代日本語であり、厳密な時刻ではなく時期・機会を表す καιρός の幅を保つ。
- source_word: ἐπορεύθη
  choice: 通られた
  rationale: διὰ τῶν σπορίμων と合わせ、麦畑の中を進んだことを自然に表す。主語イエスへの敬意は、過度に荘重にならない標準的な尊敬表現で示した。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: ギリシア語は複数形だが、ここでは一回の安息日を指す慣用的用法と理解するのが文脈に適う。
- source_word: διὰ τῶν σπορίμων
  choice: 麦畑の中を
  rationale: σπόριμος は種をまいた畑、とりわけ穀物畑を指す。後続の στάχυας とのつながりが明瞭な「麦畑」とした。
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: 弟子たちは
  rationale: δέ はここで強い逆接ではなく場面を進める軽い接続であるため、日本語では明示的な接続詞を置かない方が自然。所有者は直前のイエスから明らかなので「その弟子たち」とせず簡潔にした。
- source_word: ἐπείνασαν
  choice: 空腹になり
  rationale: アオリストが示しうる空腹の発生を表し、単なる状態の「空腹だった」より原文の動きを保つ。
- source_word: ἤρξαντο
  choice: 始めた
  rationale: 後続する二つの不定詞 τίλλειν と ἐσθίειν にかかる、行為の開始を明確に表す。
- source_word: τίλλειν στάχυας
  choice: 麦の穂を摘んで
  rationale: τίλλω の手で摘み取る動作と、στάχυς の穀物の穂という意味を、現代日本語で分かりやすく表す。
- source_word: καὶ ἐσθίειν
  choice: 食べ始めた
  rationale: ἤρξαντο が「摘む」と「食べる」の両方にかかる構造を、日本語では「摘んで食べ始めた」と自然にまとめた。
theological_decisions:
- issue: τοῖς σάββασιν の数の表現
  choice: 安息日に
  alternative: 安息日ごとに／安息日々に
  rationale: 形態上は複数形だが、コイネー・ギリシア語では単一の安息日を表す慣用的な複数形として用いられうる。複数回の出来事と誤解されないよう本文は単数相当とし、形態は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの動作には一般的な聖書文体として穏当な尊敬語を用い、弟子たちの動作は簡潔な叙述とした。「麦畑」「麦の穂」によって場面を普通の読者にも即座に理解できるようにした。
