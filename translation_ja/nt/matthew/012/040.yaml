id: MAT.12.40
reference: Matthew 12:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: ja
  text: というのは、ヨナが三日三晩[b]、大きな海の生き物の腹の中にいた[a]ように、人の子も三日三晩、地の中心に[c]いることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな魚」とも訳せる。ギリシア語は大型の海の生き物を指し、特定の動物種に限定されない。
    reason: lexical_alternative
  - marker: b
    text: 「三日三晩」は、三日にまたがる各日の一部を含む慣用表現と理解されることもあれば、より厳密な期間と理解されることもある。
    reason: alternative_reading
  - marker: c
    text: ギリシア語は文字どおりには「地の心」と言う。「地の中心」はその比喩を自然な日本語で表したものであり、埋葬、墓、地の深み、あるいは死者の領域のいずれを指すかは本文では限定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ ... οὕτως
  choice: …ように、…も
  rationale: 対応する比較構文を自然な日本語で示す。γάρの説明的な働きは、文脈上この比較構文全体によって十分に伝わる。
- source_word: Ἰωνᾶς
  choice: ヨナ
  rationale: 日本語聖書で定着している人名表記。
- source_word: ἐν τῇ κοιλίᾳ
  choice: 腹の中に
  rationale: κοιλίαの具体的な意味を、物語への言及にふさわしい自然な日本語で表す。
- source_word: τοῦ κήτους
  choice: 大きな海の生き物
  rationale: κῆτοςは特定の動物種に限定されない大型の海生物を指し得るため、「魚」や「鯨」に狭めない。
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: 三日三晩
  rationale: 原文の時間表現を簡潔かつ直接的に保持する。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として聖書的響きを保つ定着訳。
- source_word: ἔσται
  choice: いることになる
  rationale: εἰμίの未来形を表し、「とどまる」など原文に明示されない継続の意味を加えない。
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: 地の心の中に
  rationale: καρδίαの比喩を保持し、「墓」「死者の領域」「地の深み」のいずれかに解釈を限定しない。
theological_decisions:
- issue: 「地の心」の意味
  choice: 比喩を保って「地の心の中」と訳す
  alternative: 墓、地の深み、死者の領域
  rationale: 原文だけでは指示対象を一つに確定できないため、埋葬・墓・死者の領域などの解釈上の緊張を本文で解消しない。
- issue: 「三日三晩」の時間的な意味
  choice: 本文ではそのまま「三日三晩」とする
  alternative: 三日にまたがる日の一部を含む慣用表現、厳密な七十二時間
  rationale: 原文の明示的な表現を保持し、年代計算に関する解釈を本文へ持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「大きな海の生き物」は少し説明的だが、κῆτοςの語義の広さを保つ。「地の心」は通常の日本語では珍しいものの、原文の意図的な比喩と解釈上の幅を守るため採用した。
