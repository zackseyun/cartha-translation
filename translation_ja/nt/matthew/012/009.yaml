id: MAT.12.9
reference: Matthew 12:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: ja
  text: イエスはそこを去り、彼らの会堂に入った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: ～し
  rationale: 前の場面との単純なつながりを、日本語では二つの動作を連ねる形で自然に表した。独立した「そして」を置かずとも、接続の働きは保たれる。
- source_word: μεταβὰς
  choice: 去り
  rationale: μεταβαίνωのアオリスト分詞が示す、以前の場所から移る動作を簡潔に表す。「移って」も可能だが、「去り」のほうが現代日本語として自然である。
- source_word: ἐκεῖθεν
  choice: そこを
  rationale: 直前の場所から離れることを指す。日本語では「そこから去り」より「そこを去り」が自然であり、起点の意味も明確である。
- source_word: ἦλθεν
  choice: 入った
  rationale: εἰς τὴν συναγωγήνと組み合わさり、会堂の中へ移動したことを表すため、日本語では「入った」が自然である。単なる「行った」より方向性を明確に伝える。
- source_word: συναγωγὴν
  choice: 会堂
  rationale: 当時のユダヤ人の集会・礼拝の場所を指す語として、日本語聖書で定着し、簡潔で理解しやすい訳語である。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 複数属格代名詞をそのまま中立的に表し、具体的な所属集団や敵対性を訳文で付け加えない。
theological_decisions:
- issue: 「彼らの会堂」の指示対象
  choice: 「彼らの会堂」と中立的に訳す
  alternative: 「その人々の会堂」または特定集団を明示する訳
  rationale: 原文はαὐτῶνの指示対象をこの節自体では特定していないため、敵対的・宗派的な含意を加えず、曖昧さを保った。
- issue: 主語の明示
  choice: 「イエスは」を補う
  alternative: 主語を省いて「そこを去り」とする
  rationale: ギリシア語では動詞の主語が文脈から分かるが、独立した日本語の節として明瞭にするため、直前から継続する主語イエスを明示した。新たな解釈を加えるものではない。
translation_notes:
  register: 明瞭で現代的な標準日本語とし、過度に文語的な表現や解釈的な説明を避けた。「入られた」のような敬語ではなく、物語文として簡潔で統一しやすい常体を用いた。
