id: MAT.12.25
reference: Matthew 12:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: ja
  text: しかし、イエスは彼らの考え[a]を知って、こう言われた。「どんな国も、内部で分裂すれば荒れ果てる。また、どんな町も家[b]も、内部で分裂すれば立ち行かなくなる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「考え」は、「思案」または「意図」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「家」は、ここでは「家族」または「家の者たち」を意味する可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: 知って
  rationale: 心で認識していることを表す分詞。「見抜いて」とすると認識の仕方まで示唆し得るため、本文が述べる事実だけを自然に表す「知って」とした。
- source_word: δὲ
  choice: しかし
  rationale: 文脈上の穏やかな転換・対照を示すため、「しかし」とした。
- source_word: ἐνθυμήσεις
  choice: 考え
  rationale: 内心の思考、思案、意図を含み得る語であり、現代日本語で広く自然な「考え」を採用した。意味の幅は脚注に残した。
- source_word: Πᾶσα βασιλεία
  choice: どんな国も
  rationale: 単数名詞を伴う πᾶσα が示す普遍的な格言を、自然な日本語で表した。
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: 内部で分裂すれば
  rationale: 共同体が自らの内部で対立し、分かれる意味を明確にしつつ、不自然な直訳を避けた。
- source_word: ἐρημοῦται
  choice: 荒れ果てる
  rationale: 荒廃し、破滅的な状態に至るという強い意味を、能動・中動・受動の形を日本語で過度に限定せず表した。
- source_word: πόλις ἢ οἰκία
  choice: 町や家
  rationale: πόλις は文脈上「町」、οἰκία は建物としての家と家族・家の者の双方を指し得るため、本文では「家」とし、後者の可能性を脚注に示した。
- source_word: οὐ σταθήσεται
  choice: 存続できない
  rationale: ここでの「立つ」は、確立した状態を保ち、持ちこたえるという慣用的意味であるため、国・町・家のいずれにも自然に通じる「存続できない」とした。
theological_decisions:
- issue: イエスが彼らの内心を知った方法
  choice: 単に「彼らの考えを知って」と訳し、その方法を特定しない。
  alternative: 超自然的に心を知った、または言動や状況から見抜いたと明示する。
  rationale: 原文はイエスが彼らの考えを知っていたことを述べるが、どのように知ったかは説明していないため、解釈上の可能性を訳文で限定しない。
- issue: οἰκία の指示対象
  choice: 本文では「家」とし、建物と家族・家の者の両義性を保つ。
  alternative: 「家庭」または「家族」と限定する。
  rationale: 文脈上は共同体としての家族・家の者が想定され得るが、語自体には家屋の意味もあるため、一方に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語とした。格言としての反復を保ち、「内部で分裂すれば」を二度用いた。原文に明示されない主語は文脈上の明瞭さのため「イエス」と補った。
