id: MAT.12.24
reference: Matthew 12:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: ja
  text: しかし、ファリサイ派の人々はこれを聞いて言った。「この男が悪霊どもを追い出すのは、悪霊どもの支配者ベルゼブル[a]によるほかない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベルゼブル」は、伝統的には「ベルゼブブ」とも呼ばれる。
    reason: 原語本文の名称形と、広く知られた伝統的名称形の違いを示すため。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の群衆の反応との対照を、自然な現代日本語で示す。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団を指すことが一般読者にも明確になる表現とした。
- source_word: ἀκούσαντες
  choice: これを聞いて
  rationale: アオリスト分詞の時間的関係を表し、文脈から明らかな目的語を「これ」として補った。
- source_word: Οὗτος
  choice: この男
  rationale: 指示代名詞に伴う、相手を突き放すような敵対的調子を保つ。
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: 悪霊どもを追い出す
  rationale: ἐκβάλλει の排除する動作を明確にし、δαιμόνια は福音書の文脈に即して「悪霊」とした。複数性は「ども」で表した。
- source_word: εἰ μὴ ἐν
  choice: によるほかない
  rationale: 唯一の手段・作用者だとする非難を、簡潔で自然な日本語にした。
- source_word: Βεελζεβοὺλ
  choice: ベルゼブル
  rationale: SBLGNTのギリシア語形を音写し、伝統的な別名は脚注に残した。
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: 悪霊どもの支配者
  rationale: ἄρχων の権威・統治の意味を、現代の一般読者に分かりやすく表した。
theological_decisions:
- issue: 敵対的な指示語 Οὗτος の訳し方
  choice: この男
  alternative: この者／彼
  rationale: ファリサイ派の人々の突き放した非難の調子を保ちつつ、本文にない教理的評価は加えない。
- issue: Βεελζεβοὺλ の名称形
  choice: ベルゼブル
  alternative: ベルゼブブ
  rationale: 本文では原語本文の形を優先し、伝統的に知られた名称形は脚注で示す。
- issue: ἐν の手段・作用者としての表現
  choice: ベルゼブルによる
  alternative: ベルゼブルの力による
  rationale: 文脈上の手段・作用者を明確にしながら、原文に明記されていない「力」を本文に補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この男」で敵対的な語調を残し、「によるほかない」によってファリサイ派の排他的な主張を自然に表現した。
