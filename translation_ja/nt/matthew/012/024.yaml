  terminology: 「ファリサイ派」「悪霊」「ベルゼブル」「支配者」はいずれも分かりやすく、本文の語義と整合する。本文はギリシア語形に対応する「ベルゼブル」を用い、伝統的な「ベルゼブブ」を脚注で示しており、名称方針も適切である。
