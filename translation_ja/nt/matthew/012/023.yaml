  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: ja
  text: 群衆はみな、非常に驚いて言った。「まさか、この方がダビデの子[a]なのだろうか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ダビデの子」は、ダビデの家系から来ると約束された王、すなわちメシアを指す称号。
    reason: cross_reference
  - marker: b
    text: 原文の問いには、「まさか、この方がダビデの子ではあるまい」という、否定的な答えを予想する含みもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 非常に驚いて
  rationale: この語が表す強い驚きを、現代日本語として自然に伝える。未完了過去の継続的な反応は、文脈と「群衆は皆」によって十分に示される。
- source_word: πάντες οἱ ὄχλοι
  choice: 群衆は皆
  rationale: 複数形のὄχλοιを日本語で不自然な「すべての群衆」とせず、そこにいた群衆全体を指す自然な表現とした。
- source_word: ἔλεγον
  choice: 言った
  rationale: 未完了過去は人々が口々に言っていたことを示し得るが、物語の会話導入として簡潔で自然な日本語を採用した。
- source_word: Μήτι
  choice: もしかすると、…なのだろうか
  rationale: 否定的な答えを予想しつつも、驚きの中で可能性を探る問いの含みを保つ。「まさか…ではあるまい」のように否定を強めすぎない。
- source_word: ὁ υἱὸς Δαυίδ
  choice: ダビデの子
  rationale: マタイにおけるメシア的称号を、「メシア」と解釈的に言い換えず、原文の表現のまま保持する。
theological_decisions:
- issue: 「ダビデの子」のメシア的意味
  choice: 本文では「ダビデの子」という称号をそのまま残す。
  alternative: 「メシア」または「ダビデの家系から来る約束の王」
  rationale: 原文は称号そのものを用いているため、その歴史的・神学的含意を本文で一義的に説明せず、注で補う。
- issue: Μήτιが示す問いの否定的予想
  choice: 驚きとためらいを示す開かれた問いとして訳し、注で否定を予想する含みを示す。
  alternative: 「まさか、この方がダビデの子ではあるまい」
  rationale: 原文の問いは一般に否定的な答えを予想するが、文脈では群衆が可能性に驚いている。本文で強い否定に固定せず、語用論的な緊張を保存する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「この方」で群衆の驚きと敬意を自然に表し、称号と疑問の神学的・語用論的な曖昧さは本文と注で保持した。
