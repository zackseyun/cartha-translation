source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ja
  text: また、『私たちの父はアブラハムだ』と自分たちの間で[a]言おうなどと考えてはならない。あなたがたに言う。神は、これらの石からでもアブラハムの子どもたちを起こすことがおできになるからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の心の中で」。ギリシア語の表現は、心の中で自分に言うこととも、集団の中で互いに言うこととも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: 思い上がって言ってはならない
  rationale: 単なる思考の禁止ではなく、祖先への不当な自信を抱いてそう言い出すことへの警告として、文脈上の含意を自然な日本語で表した。
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: 自分たちの間で言う
  rationale: 複数の再帰代名詞を踏まえ、集団内で交わす言葉を本文に採った。ただし、心の中で自分に言う意味も可能なので脚注に残した。
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: 私たちの父はアブラハムだ
  rationale: 血統上の父祖を根拠とする主張を、明瞭で自然な現代日本語にした。
- source_word: λέγω γὰρ ὑμῖν
  choice: あなたがたに言っておく
  rationale: 説明を導く定型句を、厳粛さを保ちつつ自然な日本語で表現した。日本語では前文との関係が明らかなため、γάρを独立した接続語で過度に明示していない。
- source_word: δύναται
  choice: おできになる
  rationale: 神の能力を明示し、対象への敬意を自然な敬語で示した。
- source_word: ἐκ τῶν λίθων τούτων
  choice: これらの石からでも
  rationale: 起点を表すἐκを「から」とし、「でも」によって、目の前の石さえ用いうるという強調を自然に伝えた。
- source_word: ἐγεῖραι
  choice: 起こす
  rationale: ここでは復活に限定せず、子孫を生じさせる、立てるという広がりを保つ表現を選んだ。
- source_word: τέκνα
  choice: 子孫
  rationale: 文脈ではアブラハムとの血統的・共同体的関係が焦点なので、日本語の「子ども」より「子孫」が明瞭であり、性別も限定しない。
- source_word: τῷ Ἀβραάμ
  choice: アブラハムのために
  rationale: 与格が示す関係・利害を保持し、アブラハムに属する子孫を起こすという意味を過度に説明せず表した。
theological_decisions:
- issue: アブラハムの子孫であることへの警告
  choice: アブラハムとの肉体的な血統を安全の根拠として思い上がることを退ける警告として訳す
  alternative: 民族的イスラエルそのものの置換を宣言するものと解する
  rationale: 本文は祖先への自己確信を直接戒めるが、イスラエルの歴史的血統を否定したり、後代の置換神学を明言したりはしないため、その緊張を保持した。
- issue: 石から子孫を起こすという表現
  choice: 神の能力を示す強い比喩的・修辞的発言として、そのまま保持する
  alternative: 異邦人を石にたとえた暗示として明示的に訳す
  rationale: 本文自体は石が誰を象徴するかを特定していないため、解釈を訳文へ持ち込まなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、洗礼者ヨハネの厳しい警告と神について語る際の荘重さを保った。「思い上がって」は文脈上の不当な自信を表すが、系譜そのものの否定には踏み込まない。
