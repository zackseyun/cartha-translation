id: MAT.3.11
reference: Matthew 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: ja
  text: 私は、悔い改めのために[b]、水によって[a]あなたがたにバプテスマを授けています。しかし、私の後から来られる方は私よりも力があり、私はその方の履物を持つにも値しません。その方こそ、聖霊と火によって[c]あなたがたにバプテスマを授けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「水の中で」とも訳せる。ギリシア語の前置詞ἐνは、この箇所と後半の句で、領域を表す「～の中で」とも、手段を表す「～によって」とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「悔い改めへと」。この表現は方向や目的を示すが、悔い改めとバプテスマの前後関係や厳密な関係までは定めていない。
    reason: lexical_alternative
  - marker: c
    text: 「火」が清めを表すのか裁きを表すのかは、この句自体では明示されていない。周囲の文脈を踏まえて理解する必要がある。
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: バプテスマを授けています／授けます
  rationale: キリスト教の儀礼を表す定着した語を用い、浸すという動作様式に意味を限定しない。現在形と未来形の対照も保った。
- source_word: ἐν ὕδατι
  choice: 水によって
  rationale: ἐν＋与格が手段または領域を表し得ることを踏まえ、日本語として自然な手段表現を採用した。別の理解は脚注に示した。
- source_word: εἰς μετάνοιαν
  choice: 悔い改めのために
  rationale: εἰςの方向性・目的性を簡潔な現代日本語で表しつつ、バプテスマと悔い改めの厳密な時間的・神学的関係は本文で確定しない。
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: しかし、私の後から来られる方
  rationale: 実詞的分詞と対比のδέを自然に表し、ὀπίσω μουの順序的意味を保った。敬意を示す「来られる」は、後続するヨハネのへりくだりにも合う。
- source_word: ἰσχυρότερός μού ἐστιν
  choice: 私よりも力があり
  rationale: 比較級の意味を明瞭に伝え、「強い」よりも人物の権威・能力を広く含み得る「力がある」とした。
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: 私はその方の……にも値しません
  rationale: ἱκανόςは能力・適格性も表し得るが、ここではへりくだりの慣用的な文脈に即して「値しない」とした。
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: 履物を持つ
  rationale: βαστάζωの「運ぶ、持つ」をそのまま反映し、「脱がせる」とはしない。ὑποδήματαは当時のサンダル類を含む一般的な「履物」とした。
- source_word: αὐτός
  choice: その方こそ
  rationale: ヨハネ自身との対照をなす強意を、日本語の係助詞「こそ」で表した。
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: 聖霊と火によって
  rationale: 二つの与格を一つのἐνが支配する構造を保ち、「火」を浄化または裁きのどちらかに限定しない。
theological_decisions:
- issue: 「聖霊と火」の意味
  choice: 「聖霊と火」と直訳的に保つ
  alternative: 「聖霊と清めの火」または「聖霊と裁きの火」
  rationale: 直後の文脈は火による裁きを強く想起させる一方、火を浄化の像と見る余地も論じられてきたため、本文では像の意味を限定しない。
- issue: πνεύματι ἁγίῳの指示対象
  choice: 「聖霊」
  alternative: 「聖なる霊」または「聖なる霊の力」
  rationale: マタイの文脈と新約聖書の通常の用法に従い、人格的な聖霊を指す表現として訳す。ただし「力」などの説明語は補わない。
- issue: 悔い改めと水のバプテスマの関係
  choice: 「悔い改めのために」とし、関係を詳しく規定しない
  alternative: 「悔い改めに至らせるために」または「悔い改めのしるしとして」
  rationale: εἰςは方向・目的・関連を示し得るが、この句だけでは悔い改めがバプテスマに先行するのか、バプテスマがそれを生じさせるのか、またはそれを表すのかを一義的に定めない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、ヨハネの宣言にふさわしい簡潔で格調ある調子と、後から来る方への敬意を保った。「その方こそ」で原文の強調を再現し、解釈上争われる関係や比喩は脚注に委ねた。
