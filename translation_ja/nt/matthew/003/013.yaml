source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: ja
  text: その時、イエスはヨハネから洗礼を受けるため、ガリラヤからヨルダン川へ、ヨハネのもとに来られた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その時、イエスはガリラヤからヨルダン川へ、ヨハネのもとへ、彼から洗礼を受けるために来られる」。ギリシア語は、過去の出来事を生き生きと語る歴史的現在を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 次の出来事を導く時間的な談話標識。現代日本語の物語として自然で、出来事の連続を明確にする。
- source_word: παραγίνεται
  choice: 来られた
  rationale: 歴史的現在による生き生きした叙述だが、日本語では過去形が自然である。主語がイエスであるため、過度に古風にならない範囲で敬意を表す形とした。別訳「到着された」も可能。
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: ガリラヤから
  rationale: ἀπόが出発点・起点を示すことを簡潔に表す。
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: ヨルダン川の
  rationale: 移動先を示す句。日本語では「ヨルダン」だけより「ヨルダン川」が地名として明瞭であり、後続の「ヨハネのもとに」と自然に結び付けた。
- source_word: πρὸς τὸν Ἰωάννην
  choice: ヨハネのもとに
  rationale: 人を目指す移動を自然な日本語で表現する。「バプテスマのヨハネ」という称号は原文にないため加えない。
- source_word: τοῦ βαπτισθῆναι
  choice: 洗礼を受けるため
  rationale: 属格付き定冠詞不定詞が表す目的を明示する。日本語では「受洗する」より一般読者に分かりやすい。
- source_word: ὑπ’ αὐτοῦ
  choice: ヨハネから
  rationale: 受動行為の人的主体を示す。日本語の「彼から」は指示が不自然になりやすいため、直前の人物名を明示した。
theological_decisions:
- issue: παραγίνεταιの歴史的現在
  choice: 自然な日本語の過去形「来られた」で訳す
  alternative: 現在形「来られる」で叙述の臨場感を再現する
  rationale: ギリシア語の歴史的現在は物語を生き生きと提示するが、日本語で現在形を用いると時制の切り替えが不自然になり得る。意味内容を変えず、物語として自然な過去形を採用した。
- issue: ヨハネの称号
  choice: 「ヨハネ」とだけ訳す
  alternative: 「洗礼者ヨハネ」または「バプテスマのヨハネ」
  rationale: この節の原文は称号を付けていないため、文脈から補わず原文どおり人名のみとした。
- issue: βαπτισθῆναιの訳語
  choice: 「洗礼を受ける」
  alternative: 「バプテスマを受ける」
  rationale: 一般的な現代日本語として理解しやすい「洗礼」を用いる。特定教派の洗礼観や方式を本文に読み込まず、受動態と目的だけを保持する。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。ギリシア語の移動句を日本語として自然にまとめつつ、出発地、目的地、相手、目的をすべて保持した。イエスへの敬意は「来られた」で穏やかに表し、過度な敬語や教派固有の表現を避けた。
