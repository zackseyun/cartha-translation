id: MAT.3.5
reference: Matthew 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: ja
  text: そのころ、エルサレム、ユダヤ全土、またヨルダン川周辺の全地域から、人々がヨハネのもとへ出て来ていた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「出て来ていた」に当たるギリシア語の未完了過去形は、人々が継続して、または繰り返しヨハネのもとへ出て来たことを示します。
    reason: lexical_alternative
  - marker: b
    text: 「ユダヤ全土」と「ヨルダン川周辺の全地域」は、ヨハネへの反応が広範囲に及んだことを示す包括的な地理表現で、必ずしも住民一人一人の全員を意味するものではありません。
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: そのころ
  rationale: 直前に述べられたヨハネの宣教を受け、その時期に起きた反応を示す時間表現。日本語では「その時」よりも、継続的な動きを述べる文脈になじむ。
- source_word: ἐξεπορεύετο
  choice: 続々と出て来ていた
  rationale: 未完了過去形が示す、過去に継続または反復していた動きを自然な日本語で表した。「続々と」は大勢が相次いで来る様子を示し、「出て来ていた」は未完了相を保つ。
- source_word: πρὸς αὐτόν
  choice: ヨハネのもとへ
  rationale: 移動の到達方向を表す。日本語で「彼のもとへ」とするより指示対象が明確で自然なため、直前の文脈上の人物ヨハネを明示した。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 現代日本語で定着した地名表記。地域名が移動するという不自然さを避けるため、後続の諸地域とともに「から」で人々の出身地を示した。
- source_word: πᾶσα ἡ Ἰουδαία
  choice: ユダヤ全土
  rationale: 地域全体に広がる反応を簡潔に表す。個々の住民全員を数学的に指すとは限定しない、通常の包括的な地理表現として訳した。
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: ヨルダン川周辺の全地域
  rationale: περίχωροςの「周辺地域」という意味と、ヨルダンを基準とする属格関係を自然な日本語で保持した。「川」を補い、日本語で地名を明確にした。
- source_word: καὶ ... καὶ
  choice: 、…、また…
  rationale: 三つの地理的範囲を累加的に並べる構造を、日本語として読みやすい列挙で再現した。
theological_decisions:
- issue: 地域を表す包括語の範囲
  choice: 広範な反応を示す地理的な総称として本文に保持する
  alternative: 「各地から多くの人々が」のように意訳する
  rationale: πᾶσαの反復による広がりと強調を残しつつ、古代の一般的な包括表現を、住民一人残らずという意味に狭く固定しない。
- issue: αὐτόνの指示対象
  choice: 文脈上のヨハネを本文で明示する
  alternative: 「彼のもとへ」と代名詞で訳す
  rationale: 指示対象は直前の文脈でヨハネであり、明示は解釈上の緊張を解消するものではなく、日本語の不自然または曖昧な代名詞を避けるための文脈的補足である。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「続々と出て来ていた」により未完了過去の継続・反復性と群衆の広がりを自然に表現した。地名の列挙には「から」を用い、地域そのものが移動するように聞こえる不自然さを避けた。
