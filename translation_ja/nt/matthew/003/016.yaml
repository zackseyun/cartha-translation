id: MAT.3.16
reference: Matthew 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: ja
  text: イエスはバプテスマを受けると、すぐに水から上がられた。[a]すると、見よ、天が開かれ、イエスは神の霊が鳩のように[b]下り、イエスの上に来る[c]のをご覧になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「水の中から上がられた」とも訳せる。ギリシア語は直訳すると「水から」である。
    reason: lexical_alternative
  - marker: b
    text: 「鳩のような姿で」と限定する訳もあるが、原文は比較を表し、姿と動き方のどちらに重点があるかを明示していない。
    reason: alternative_reading
  - marker: c
    text: 「イエスの上に舞い降りる」と訳されることもあるが、ギリシア語の動詞は、より字義的には「来る」である。
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: イエスはバプテスマを受けると
  rationale: アオリスト受動分詞が主動詞に先立つ状況を表すため、受動の意味と自然な時間的連続を保つ「受けると」とした。δέは日本語では文脈の流れに吸収し、不自然な逆接を加えない。
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: すぐに水から上がられた
  rationale: εὐθύςの即時性を「すぐに」で表し、ἀπόの起点の意味を越えて水中から出たことを必要以上に強調しないよう「水から」とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 読者の注意を鮮やかに促す談話標識の力を保つため、簡潔で格調のある「見よ」とした。
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: 天が開かれ
  rationale: 受動形を保ち、複数形οἱ οὐρανοίは日本語で自然な集合的表現「天」とした。
- source_word: εἶδεν
  choice: イエスは…ご覧になった
  rationale: ギリシア語では主語が省略されているが、直前のイエスを明示して日本語での指示関係を明確にした。
- source_word: πνεῦμα θεοῦ
  choice: 神の霊
  rationale: 属格構文をそのまま自然に表し、本文にない「聖」を補わず、同時にこの定着した聖書表現を保持した。
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: 鳩のように下り
  rationale: ὡσεὶの比較を「ように」で明示し、霊そのものを鳩と同一視しない。現在分詞の動きを簡潔に表した。
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: ご自分の上に来る
  rationale: ἐρχόμενονの基本的な移動の意味を「来る」で保ち、「とどまる」「舞い降りる」など本文以上に具体的な動作を加えなかった。
theological_decisions:
- issue: πνεῦμα θεοῦが聖霊を指すことを訳文でどこまで明示するか
  choice: 神の霊
  alternative: 聖霊／神からの一つの霊
  rationale: 洗礼場面では聖霊を指すと理解されるが、原文の表現そのものは「神の霊」であるため、解釈的な称号への置換を避けた。
- issue: ὡσεὶ περιστερὰνが霊の実体を鳩とするのか、鳩との類似を示すのか
  choice: 鳩のように
  alternative: 鳩となって／鳩として
  rationale: 比較辞ὡσεὶを明示し、類似の対象が姿か動き方かという原文の余地を狭めず、霊を文字どおり鳩と同一視しない。
- issue: ἐρχόμενον ἐπ’ αὐτόνを「とどまる」「舞い降りる」と具体化するか
  choice: ご自分の上に来る
  alternative: その上にとどまる／その上に舞い降りる
  rationale: 原文の動詞は「来る」であり、到来後の滞在や着地を明示していないため、動作を過度に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「見よ」で原文の荘重な注意喚起を残した。イエスについては自然な敬語を用い、文中の主語と代名詞の指示関係を明確にした。脚注記号は、それぞれが説明する語句の直後に配置した。
