  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: ja
  text: そのころ、バプテスマを授けるヨハネ[a]が現れ[b]、ユダヤの荒野で宣べ伝えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「バプテスマのヨハネ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「やって来て」。原文の動詞は、過去の出来事を現在形で生き生きと語る「歴史的現在」である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: そのころ
  rationale: 時間を示す句を自然な現代日本語で表した。δέは弱い接続であり、ここでは日本語に独立した接続語を加えなくても、場面の移行が十分に伝わる。
- source_word: παραγίνεται
  choice: 現れ
  rationale: 物語にヨハネが登場することを表す歴史的現在を、日本語の叙述に自然な形で訳した。「やって来る／来た」も可能だが、移動そのものを必要以上に強調しない。
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: バプテスマを授けるヨハネ
  rationale: βαπτιστήςが、その行為によってヨハネを識別する呼称であることを明瞭にした。固有名は日本語で定着した「ヨハネ」とした。
- source_word: κηρύσσων
  choice: 宣べ伝えていた
  rationale: 主動詞と同時進行の分詞を、継続中の宣教活動として自然に表した。「宣言していた」も可能だが、宗教的な公の告知を表す日本語として「宣べ伝える」が適切である。
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: ユダヤの荒野で
  rationale: ἔρημοςを、人の住まない荒涼とした地域を指す「荒野」とし、Ἰουδαίαは当時の地域名として「ユダヤ」とした。
theological_decisions:
- issue: ヨハネの呼称 βαπτιστής の訳し方
  choice: バプテスマを授けるヨハネ
  alternative: バプテスマのヨハネ
  rationale: 語の行為者としての意味を明示し、特定教派の名称と誤解される可能性を避けた。一方、伝統的で簡潔な呼称も脚注に残した。これは語彙上の選択であり、洗礼理解に関する特定の教理を加えるものではない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、聖書本文としての品位を保った。「宣べ伝える」は一般読者にも理解可能な範囲で、κηρύσσωの公的な告知の響きを保つ。
