  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: ja
  text: そして人々は、自分たちの罪を告白しながら、ヨルダン川で彼からバプテスマを受けていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「バプテスマを受けた」。ギリシア語の未完了過去は、行為が続いていたことや繰り返されていたことを示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: バプテスマを受けていた
  rationale: 未完了過去の受動態が表す、継続的または反復的に進んでいた出来事を自然な日本語で示す。「浸されていた」など方式を特定する表現は避け、文脈上確立した儀礼用語を保った。
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: ヨルダン川で
  rationale: ἐν＋与格の場所を表す用法と、明記されたποταμός「川」の両方を簡潔で自然な日本語にした。
- source_word: ὑπ’ αὐτοῦ
  choice: 彼から
  rationale: ὑπό＋属格が示す行為者を表す。日本語では「彼によって」よりも、バプテスマを受けるという表現に「彼から」を組み合わせるほうが自然であり、指示対象を「ヨハネ」と明示せず代名詞を保つ。
- source_word: ἐξομολογούμενοι
  choice: 告白しながら
  rationale: 主動詞と同時に行われる分詞として訳し、自らの過ちを言葉で認める意味を保った。
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: 自分たちの罪
  rationale: 複数形のἁμαρτίαςを集合的に自然な日本語の「罪」で表し、再帰的な所有関係を「自分たちの」で明確にした。
- source_word: καὶ
  choice: そして
  rationale: 前節から続く物語の単純な接続を自然な現代日本語で示した。
theological_decisions:
- issue: バプテスマの方式
  choice: 「バプテスマを受ける」とし、方式を特定しない。
  alternative: 「浸される」「身を沈める」「洗われる」
  rationale: 本文はヨルダン川でヨハネからバプテスマを受けたことを述べるが、その方式をこの語だけで訳文上限定することは避けるべきである。儀礼用語を保つことで、本文にない教派的結論を持ち込まない。
- issue: 未完了過去の時間的側面
  choice: 「受けていた」として継続的・反復的な場面を示す。
  alternative: 「受けた」
  rationale: ἐβαπτίζοντοの未完了過去が描く進行中または繰り返される出来事を反映する。ただし日本語では単純過去も文脈上可能なため脚注で示す。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「彼によって」より自然な「彼から」を採用しつつ、原文の代名詞を保った。脚注記号は該当する主動詞を含む文の末尾に置いた。
