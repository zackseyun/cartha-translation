  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: ja
  text: だから、悔い改めにふさわしい実[a]を結びなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だから、悔い改めにかなう実を結びなさい。」
    reason: ἄξιον は、悔い改めとの適合・対応を「かなう」と表すこともできる。
lexical_decisions:
- source_word: ποιήσατε
  choice: 結びなさい
  rationale: アオリスト能動命令法二人称複数。直訳的な「作りなさい」よりも、καρπός（実）との自然な日本語の結び付きを優先しつつ、命令の力を保った。
- source_word: οὖν
  choice: だから
  rationale: 直前の勧告と警告を受けた帰結を、明瞭で現代的な日本語で示す。
- source_word: καρπὸν
  choice: 実
  rationale: 目に見える行いや結果を比喩的に表す集合的単数として、原文の単数を自然に保持した。
- source_word: ἄξιον
  choice: ふさわしい
  rationale: 属格を伴い、価値の同等性や功績ではなく、適合・対応を表す。自然な日本語でその意味を伝える。
- source_word: μετανοίας
  choice: 悔い改め
  rationale: 単なる考えの変更に狭めず、ヨハネの呼びかけに応じて心と生き方の向きを変えることを表す、定着した訳語。
theological_decisions:
- issue: καρπὸν ἄξιον τῆς μετανοίας の意味
  choice: 悔い改めに対応し、それにふさわしい実を結ぶよう命じる表現
  alternative: 悔い改めを獲得する実、または悔い改めと同価値の実
  rationale: ἄξιος＋属格はここで適合や対応を示す。行いが悔い改めを買い取るという意味にせず、同時に、悔い改めには目に見える実が求められるという本文の倫理的要求を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。「だから」は論理的なつながりを自然に示し、「実を結ぶ」は聖書的比喩を保ちながら一般読者にも理解しやすい。命令形は複数の聴衆への直接的な呼びかけとして簡潔に表現した。
