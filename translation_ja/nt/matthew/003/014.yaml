  verdict: revise
  source_fidelity: 主文の意味はおおむね正確で、διεκώλυενの未完了過去の継続・反復的な含みも適切に捉えている。ただし「思いとどまらせる」は相手の考えを変えさせることに重心があり、διεκώλυενの「妨げる／制止する」よりやや狭い。「制止しようとし続けて」のほうが、行為を妨げようとする原文の意味を直接的に表す。
  naturalness: 「制止しようとし続けて」は明瞭な現代標準日本語である。後半は「あなたが私のもとに来るのですか」とし、原文の現在形の問いと修辞的な対照を自然に保つ。「来られる」は日本語として可能だが、原文に明示されない敬語上の待遇を加えるため避ける。
  terminology: 「バプテスマを受ける」は、βαπτισθῆναιの受動と、方式を限定しない定着した聖書用語を適切に反映する。「あなたから」はὑπὸ σοῦが示す行為者を自然な日本語で表している。
