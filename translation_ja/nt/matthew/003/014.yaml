  to: しかし、ヨハネはイエスを制止しようとし続けて[a]、こう言った。「私のほうこそ、あなたからバプテスマを受ける必要があるのに、あなたが私のもとに来るのですか。」
  rationale: 制止を表す動詞を原文のδιεκώλυενにより近い「制止しようとし続けて」へ改め、原文に明示されない敬語を避けた。脚注は、代替訳として文法的に完結する形に修正した。ヨハネの必要とイエスがヨハネのもとへ来ることの対照は、「私のほうこそ」と「のに」によって保持している。
