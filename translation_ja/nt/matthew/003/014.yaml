  - severity: low
    issue: 「来られる」
    rationale: 敬語は日本語の翻訳上あり得る処理だが、ギリシア語本文には敬語に相当する標識がない。「来る」とすることで、本文以上の対人的な待遇を付加せずに問いの力を保てる。
