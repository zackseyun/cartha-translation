id: MAT.3.14
reference: Matthew 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: ja
  text: しかし、ヨハネはイエスを制止しようとし続けて[a]、こう言った。「私のほうこそ、あなたからバプテスマを受ける必要があるのに、あなたが私のもとに来るのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヨハネはイエスを制止しようとした」。ギリシア語の未完了過去は、動作が継続または反復していたことを示す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: 思いとどまらせようとし続けて
  rationale: 未完了過去の継続的・反復的な側面と、実際には阻止できなかった文脈を自然な日本語で表す。単に「止めた」とはせず、試みの継続を示した。
- source_word: λέγων
  choice: こう言った
  rationale: 分詞が、ヨハネの制止の試みを具体的な発言によって説明していることを、自然な日本語の叙述として表した。
- source_word: χρείαν ἔχω
  choice: 必要がある
  rationale: 「必要を持つ」というギリシア語の慣用表現を、明瞭な現代日本語にした。
- source_word: ὑπὸ σοῦ
  choice: あなたから
  rationale: 受動不定詞とともに行為者を示すが、日本語では「あなたによって」よりも「あなたからバプテスマを受ける」が自然であり、主体も明確である。
- source_word: βαπτισθῆναι
  choice: バプテスマを受ける
  rationale: 受動の意味を自然に表しつつ、方式を「浸礼」などに限定せず、定着した聖書用語を用いた。
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: あなたが私のところに来られるのですか
  rationale: 修辞疑問を保ち、「のに」で直前との対照を自然に示した。敬意を示す「来られる」は、ヨハネが認めるイエスの優位性に合うが、神学的説明を付加しない。
- source_word: δὲ
  choice: しかし
  rationale: 前節でイエスがヨハネのもとへ来たことと、ヨハネの反応との穏やかな対照を明確にした。
theological_decisions:
- issue: ヨハネがイエスへのバプテスマをためらった理由
  choice: ヨハネ自身がイエスからバプテスマを受ける必要を認めた発言として、そのまま訳す。
  alternative: 罪のなさ、身分、権威など、ためらいの理由を訳文内で明示する。
  rationale: 本文はイエスの優位性とヨハネ自身の必要を示すが、その神学的根拠を明示してはいないため、緊張と余白を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「私のほうこそ」と「のに」によって対照を自然に示し、説明的な神学用語は加えていない。
