source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: ja
  text: その方は手に箕[a]を持ち、ご自分の脱穀場をすっかりきれいにし、麦をご自分の倉[b]に集める。しかし、殻は消すことのできない火で焼き尽くす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「箕」は、脱穀した穀物をあおり上げ、穀粒と殻を選り分ける農具。穀物をすくって投げ上げる道具を指すとも考えられる。
    reason: lexical_alternative
  - marker: b
    text: または「穀物倉」「貯蔵庫」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: 箕
  rationale: 脱穀した穀物を空中にあおり上げ、穀粒ともみ殻を選り分ける農具を指す。日本語の伝統的かつ的確な名称を用い、脚注で分かりやすく説明する。
- source_word: διακαθαριεῖ
  choice: すっかり清め
  rationale: 接頭辞による徹底性を「すっかり」で示し、脱穀場から不要物を完全に取り除く意味を自然に表す。
- source_word: ἅλωνα
  choice: 脱穀場
  rationale: 脱穀と選別を行う場所を指す標準的な農業用語であり、原文の具体的な情景を保つ。
- source_word: σῖτον
  choice: 麦
  rationale: 語は穀物一般を指す場合もあるが、もみ殻との対比をなすこの選別の情景では「麦」が自然で具体的である。
- source_word: ἀποθήκην
  choice: 倉
  rationale: 貯蔵場所を広く指す語であり、特定の建築様式を想定せず、簡潔で自然な日本語となる。
- source_word: ἄχυρον
  choice: もみ殻
  rationale: 選別によって穀粒から分けられる不要な殻を表し、この農耕比喩に適した現代日本語である。
- source_word: κατακαύσει
  choice: 焼き尽くす
  rationale: 単に焼くのではなく、完全に焼いてしまうという複合動詞の強意を保持する。
- source_word: πυρὶ ἀσβέστῳ
  choice: 消すことのできない火で
  rationale: 火が消され得ないことを明瞭な現代語で表し、与格の手段的な働きも「で」によって示す。
- source_word: οὗ
  choice: その方は…ご自分の
  rationale: 前節の「来られる方」を受ける関係代名詞の所有関係を、日本語では主題を明示したうえで「ご自分の」と表し、自然な文脈接続と敬意ある語調を保つ。
theological_decisions:
- issue: 麦ともみ殻を分ける裁きの比喩
  choice: 具体的な農耕の比喩と未来の裁きの厳しさをそのまま保持した。
  alternative: 麦を正しい者、もみ殻を悪い者と本文中で明示する説明的意訳。
  rationale: 原文自身は象徴の対象をこの節で明示せず、比喩によって裁きを語るため、その曖昧さと神学的緊張を解説で解消しない。
- issue: πυρὶ ἀσβέστῳ の性質
  choice: 「消すことのできない火」と訳し、火の継続時間や終末論的体系を追加説明しない。
  alternative: 「永遠に燃え続ける火」など、時間的意味を明示する訳。
  rationale: ἀσβέστῳ が直接表すのは「消されない／消すことのできない」であり、本文を越えた教理的限定を避ける。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、裁きの宣言にふさわしい簡潔で重みのある文体とした。「その方」「ご自分の」により前節の人物への指示を自然に保ち、農耕語の「箕」には理解を助ける脚注を付した。
