  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: ja
  text: ヨハネ自身は、らくだの毛でできた衣をまとい[b][c]、腰には革の帯を締めていた[a]。食べ物は、いなごと野生の蜂蜜であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この服装は、列王記第二1章8節に描かれる預言者エリヤの姿を思い起こさせる。これは、マタイがヨハネを描く上で重要な背景となっている。
    reason: cross_reference
  - marker: b
    text: 別訳「らくだの毛の衣」。
    reason: lexical_alternative
  - marker: c
    text: 直訳では、ヨハネはその衣を「持っていた」。ここでは着用していた意味で訳した。
    reason: literal_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: ヨハネ自身は
  rationale: αὐτόςの強調を「自身」で表し、δέは日本語の自然な叙述の流れの中で主題を示す「は」に担わせた。
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: 衣をまとい
  rationale: εἶχενは字義的には「持っていた」だが、衣については着用状態を表すため、現代日本語として自然な「まとい」とした。
- source_word: ἀπὸ τριχῶν καμήλου
  choice: らくだの毛でできた
  rationale: ἀπόが素材を示すので、衣の材質が明確に伝わる表現とした。
- source_word: ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ
  choice: 腰には革の帯を締めていた
  rationale: ζώνηを「帯」、ὀσφύςを現代的な「腰」とし、身に着けていた状態を自然な日本語で表した。
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: 食べ物は……であった
  rationale: τροφήの基本義を簡潔に「食べ物」とし、δέによる次の描写への移行は主題提示の「は」で自然に示した。
- source_word: ἀκρίδες
  choice: いなご
  rationale: 通常の語義である食用にもされた昆虫を指す。植物名などに読み替えない。
- source_word: μέλι ἄγριον
  choice: 野蜜
  rationale: ἄγριονは野生の環境で得られる蜂蜜を示す。「野蜜」は簡潔で文脈に合う現代日本語である。
theological_decisions:
- issue: ヨハネの姿とエリヤとの関連
  choice: 本文では服装と食物をそのまま描写し、エリヤとの関連は脚注に置く。
  alternative: 本文の表現自体にエリヤを明示する。
  rationale: 原文はエリヤの名を挙げず、ヨハネの姿を記述している。列王記第二1章8節との間テキスト的な響きは重要だが、本文に解釈を補わず脚注で示すのが適切である。
translation_notes:
  register: 明瞭で格調を保った現代標準語。服装の描写には「まとい」「帯を締めていた」を用いて自然さを確保し、食物の描写は簡潔に保った。「野蜜」は「野生の蜂蜜」より簡潔で聖書叙述にふさわしいが、古語的になりすぎない語として採用した。
