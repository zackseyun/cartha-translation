reference: Matthew 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: ja
  text: しかし、イエスは彼に答えられた。「今はそうさせてほしい。このようにして、わたしたちがすべての義[a]を果たすことは、ふさわしいからである。」そこでヨハネは、イエスにそうすることを許した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての正義」とも訳せる。ギリシア語は「義」と「正義」の両方を表し得るが、ここでは神の意志にかなうことを重んじるマタイの用法に照らして「義」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: しかし、イエスは彼に答えられた
  rationale: ἀποκριθεὶς…εἶπεν は「答えて言った」という慣用表現なので、現代日本語では簡潔に「答えられた」とした。δέ は前節のヨハネの制止との対照を示すため「しかし」とした。πρὸς αὐτόν の「彼に」も保持した。
- source_word: Ἄφες ἄρτι
  choice: 今はそうさせてほしい
  rationale: ἀφίημι はここでは「赦す」ではなく、ヨハネに洗礼を行うことを許すよう求める語。ἄρτι の当面・現時点の含みを「今は」で表した。
- source_word: οὕτως γὰρ
  choice: このようにして……からである
  rationale: 直前に問題となっている、ヨハネがイエスに洗礼を授けるという仕方を指す指示的な力を保った。
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: わたしたちが……ことは、ふさわしい
  rationale: πρέπον の道徳的・状況的に適切であるという意味を、過度に法律的にせず「ふさわしい」で表現した。ἡμῖν の複数形も「わたしたち」で明示した。
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: すべての義を果たす
  rationale: πληρόω のマタイにおける「成就する／十分に実現する」という響きを「果たす」で自然に表し、δικαιοσύνη は神の意志にかなうことを広く指し得るため「義」として意味の幅を保持した。
- source_word: τότε ἀφίησιν αὐτόν
  choice: そこでヨハネは、イエスにそうすることを許した
  rationale: 歴史的現在を日本語の物語に自然な過去形で訳した。主語と目的語は文脈からヨハネとイエスであるため明示し、「立ち去らせた」ではなく洗礼を受けることを認めた意味にした。
theological_decisions:
- issue: 「すべての義」の意味
  choice: この場面で神の正しい意志にかなうことを、ヨハネとイエスが共に成し遂げるという広い表現として保持する。
  alternative: あらゆる律法上の要件を満たすこと、または「すべての正義」を実現すること。
  rationale: 本文は法的義務だけに限定しておらず、後代の特定の教理体系も明示していない。「義」という簡潔な訳により、神の意志への適合というマタイ的な広がりと解釈上の緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で dignified な調子を保った。「そうさせてほしい」「そうすること」は、洗礼という直前の文脈を不自然に重複せず示す。
