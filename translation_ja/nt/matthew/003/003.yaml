id: MAT.3.3
reference: Matthew 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ja
  text: 'というのも、この方こそ、預言者イザヤを通してこの方について次のように語られた方である。


    「荒野で叫ぶ者の声がする[a]。


    『主[b]の道を整えよ。


    その方の道筋をまっすぐにせよ。』」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「叫ぶ者の声。『荒野で主の道を整えよ』」と区切ることもできる。
    reason: ἐν τῇ ἐρήμῳ（「荒野で」）を「叫ぶ」に結び付けるか、「整えよ」に結び付けるかという解釈上の可能性を示すため。
  - marker: b
    text: 引用元のイザヤ40:3のヘブライ語本文では、ここに神の名YHWHが用いられている。
    reason: ギリシア語本文のκύριοςを「主」と訳しつつ、引用元にある神名との重要な相互参照を示すため。
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: というのも、この人こそ……人である
  rationale: γάρの説明的なつながりを「というのも」で示し、οὗτοςの指示性と同定の力を「この人こそ」で自然に表した。
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: 預言者イザヤを通して……語られた人
  rationale: 受動分詞を人物への言及として訳し、διά＋属格が示す預言者の媒介性を「通して」で保持した。
- source_word: λέγοντος
  choice: こう
  rationale: 後続する引用を導く分詞を、日本語の自然な引用導入表現「こう語られた」で表した。
- source_word: Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ
  choice: 荒野で叫ぶ者の声
  rationale: 属格分詞を「叫ぶ者の」とし、ἐν τῇ ἐρήμῳを基本的には「叫ぶ」に結び付けた。修飾関係の別の区切り方は脚注に残した。
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: 主の道を整えよ
  rationale: 命令の直接性とイザヤ書への響きを保った。「用意せよ」よりも、道を通行可能にする比喩に自然な「整えよ」を選んだ。
- source_word: κυρίου
  choice: 主
  rationale: 目の前のギリシア語κύριοςを日本語で通常の「主」とした。引用元のヘブライ語に神名YHWHがあることは脚注で明示した。
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: その方の道筋をまっすぐにせよ
  rationale: εὐθείας ποιεῖτεの命令を直截に訳し、τρίβουςを詩的かつ自然な「道筋」とした。αὐτοῦの人格的な指示も「その方の」で保持した。
theological_decisions:
- issue: イザヤ40:3の引用におけるκυρίουと、引用元ヘブライ語の神名YHWHとの関係
  choice: 本文では「主」
  alternative: 神名YHWHであることを本文で明示する
  rationale: マタイのギリシア語本文はκυρίουであるため本文は「主」とし、引用元で神名が用いられているという重要な背景は脚注で保持した。
- issue: ἐν τῇ ἐρήμῳの修飾先
  choice: 「叫ぶ者」に結び付けて「荒野で叫ぶ者の声」
  alternative: 命令に結び付けて「荒野で主の道を整えよ」
  rationale: マタイの文脈と通常のギリシア語の読み方に従って本文を構成したが、句読法による別の区切りとイザヤ書との相互参照上の可能性を脚注に残した。
translation_notes:
  register: 明快な現代標準語を用いながら、預言の引用にふさわしい簡潔で格調ある命令形「整えよ」「まっすぐにせよ」を採用した。引用の入れ子はかぎ括弧と二重かぎ括弧で明示し、朗読時にも構造が分かるよう改行した。
