  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: ja
  text: そして、こう言った。「悔い改めなさい[a]。天の国[b]が近づいたからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悔い改める」に当たるギリシア語は、考え方を改め、向きを変えることを表す。単に後悔したり罪悪感を抱いたりすることだけではない。別訳「考えを改めなさい」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「天」が複数形。より直訳的には「天（複数）の国」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: そして、こう言った
  rationale: 前節のヨハネの行動に続く分詞句。日本語では自然な叙述となるよう定形動詞で表し、「宣べ伝えた」などの意味は加えなかった。
- source_word: Μετανοεῖτε
  choice: 悔い改めなさい
  rationale: μετανοέωは考えや理解を改め、方向を転じることを表す。日本語の聖書語として通じる「悔い改める」を用い、単なる後悔や罪悪感に狭めないよう注を付した。複数の聞き手への現在命令である。
- source_word: ἤγγικεν
  choice: 近づいた
  rationale: ἐγγίζωの完了形が示す、近くまで到来して今も近いという含みを簡潔に保つ。
- source_word: γὰρ
  choice: からだ
  rationale: 命令の根拠を示す接続を、日本語の発話として自然な文末表現にした。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の国
  rationale: βασιλείαが持つ王の支配とその領域の両面を残しつつ、マタイ特有の表現を明瞭で自然な日本語にした。「神の支配」と解釈的に言い換えなかった。
theological_decisions:
- issue: 「天の国」の意味
  choice: マタイの表現を「天の国」として保持する
  alternative: 神の支配／神の国
  rationale: 「神の支配」はβασιλείαの重要な側面を明示するが、領域の含みを狭めうる。「神の国」は共観福音書の並行表現だが、本文にあるマタイ特有の「天」を保存した。
- issue: μετανοεῖτεの射程
  choice: 「悔い改めなさい」とし、思考と生き方の根本的転換を含ませる
  alternative: 考えを改めなさい／立ち返りなさい
  rationale: 語義を感情的な後悔だけに限定せず、同時に文脈上の倫理的・実存的な転換も、単なる意見変更へ狭めないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宣言の簡潔さと威厳を保った。「御国」のような宗派的・伝統的響きの強い敬語形は避け、「天の国」とした。
