id: MAT.3.10
reference: Matthew 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ja
  text: そして、斧はすでに木々の根元に置かれている[a]。それゆえ、良い実を結ばない木はすべて切り倒され、火に投げ込まれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「木々の根元に横たわっている」。
    reason: κεῖταιは「置かれている」とも「横たわっている」とも訳せるため。
lexical_decisions:
- source_word: ἤδη
  choice: すでに
  rationale: 差し迫った裁きが、すでに目前に迫っているという時間的な力を保つ。
- source_word: δὲ
  choice: そして
  rationale: 強い逆接ではなく、前の警告を受ける穏やかな接続として訳した。
- source_word: ἀξίνη
  choice: 斧
  rationale: 木を切る道具を指す標準的で明瞭な訳語であり、裁きの比喩をそのまま伝える。
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: 木々の根元に置かれている
  rationale: κεῖταιの「横たわる／置かれている」という状態と、斧がすぐ使える位置にある情景を自然な日本語で表す。
- source_word: πᾶν οὖν δένδρον
  choice: それゆえ、…木はすべて
  rationale: οὖνが示す前文からの帰結を明示し、πᾶνの包括性を保つ。
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: 良い実を結ばない
  rationale: ποιέωを木と実の文脈に即した自然な日本語「実を結ぶ」で表し、継続的・特徴的な状態を示す。
- source_word: ἐκκόπτεται
  choice: 切り倒され
  rationale: 木について用いられる受動形を、情景に合う自然な日本語で表す。
- source_word: εἰς πῦρ βάλλεται
  choice: 火に投げ込まれる
  rationale: βάλλεταιの受動的な力を保ちつつ、現代日本語として明瞭に訳す。
theological_decisions:
- issue: 火の比喩が指す裁きの性質
  choice: 「火」とだけ訳し、解釈を付け加えない
  alternative: 終末の裁き、地上での裁き、地獄の火のいずれかに限定する
  rationale: 本文は明らかに裁きの比喩を用いるが、その火の性質をこの節だけでは限定していないため、神学的な幅と緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、警告の厳粛さと比喩の鮮明さを保った。「良い実を結ぶ」は木の比喩に即した自然な慣用表現である。
