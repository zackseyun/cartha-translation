language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ja
  text: ところが、ファリサイ派とサドカイ派の人々が大勢、ヨハネのバプテスマに来るのを見て[a]、ヨハネは彼らに言った。「毒蛇の子らよ[b]、誰がおまえたちに、迫り来る怒りから逃れよと警告したのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼のバプテスマへ来る」。文脈上、「彼」はヨハネを指す。「ヨハネからバプテスマを受けようとして来る」とも理解できるが、この節は彼らが実際に受けたとは明記していない。
    reason: lexical_alternative
  - marker: b
    text: 「まむしの子らよ」とも訳せる。原文は、有毒な蛇から生まれた者たちという強烈な比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ところが、……来るのを見て
  rationale: アオリスト分詞を自然な従属表現とし、δέの軽い対照・場面転換を「ところが」で示した。
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ファリサイ派とサドカイ派の人々が大勢
  rationale: 属格を伴う部分表現を反映し、両派の全員ではなく、その中の多くの人々を指すことが分かる形にした。
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: ヨハネのバプテスマのもとに来る
  rationale: 彼らがヨハネのバプテスマへ近づいて来たことを表しつつ、この節だけでは実際にバプテスマを受けたとまでは述べていない点を保った。αὐτοῦの指示対象は文脈上ヨハネであるため、明示した。
- source_word: Γεννήματα ἐχιδνῶν
  choice: 毒蛇の子らよ
  rationale: γεννήματαの「生み出されたもの、子」という像と、ἐχιδνῶνの有毒な蛇という強烈な非難を、現代日本語で明瞭に伝える。
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: 誰が、おまえたちに……と警告したのか
  rationale: ὑποδείκνυμιには「示す、教える、警告する」の幅があるが、迫る怒りから逃れるという文脈では「警告する」が切迫感を最も自然に表す。
- source_word: φυγεῖν ἀπὸ
  choice: ……から逃れよ
  rationale: 危険から身を避けるφυγεῖνの切迫した動きを保ち、日本語の警告表現として自然にした。
- source_word: τῆς μελλούσης ὀργῆς
  choice: 迫り来る怒り
  rationale: μέλλωの将来性・切迫性と、ὀργήの「怒り」を弱めずに表した。
theological_decisions:
- issue: 呼びかけの対象となった人々の範囲
  choice: その場に来たファリサイ派とサドカイ派の多くの人々
  alternative: 両派の全員または両派全体
  rationale: πολλούςと属格の部分表現に従い、厳しい非難をその場の対象者に向けつつ、本文を越えて両派の全員へ一般化しない。
- issue: 彼らがバプテスマを受ける意図または事実
  choice: ヨハネのバプテスマのもとへ来た
  alternative: ヨハネからバプテスマを受けるために来た
  rationale: ἐπὶ τὸ βάπτισμαはバプテスマへ向かうことを示すが、この節自体は彼らが実際に受けたことを明言しないため、その余地を残した。
- issue: ὀργήの終末論的重み
  choice: 怒り
  alternative: 裁き／罰
  rationale: 「裁き」や「罰」と言い換えて意味を限定せず、神の怒りという原語の神学的な重みと、将来に迫る性格を保持した。
translation_notes:
  register: 明瞭で現代的ながら、預言者的な厳しさを保つ文体とした。「おまえたち」は鋭い叱責の場面に合わせたもので、一般的な敬称ではない。「バプテスマ」は日本語聖書で広く通用する語として用いた。
