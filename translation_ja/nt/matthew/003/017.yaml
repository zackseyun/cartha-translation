  rationale: 本文を安全に最小限修正した。「わたしが喜びとする者である」は、神の喜び・是認を自然な日本語で表しつつ、原文の「この者において」という結び付きを、その者を修飾する関係節として保つ。脚注bは、前置詞ἐνとアオリストεὐδόκησαに近い代替訳を示し、本文が採った慣用的・宣言的な表現との関係を明らかにする。
