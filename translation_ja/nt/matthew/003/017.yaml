id: MAT.3.17
reference: Matthew 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: ja
  text: すると、見よ、天[a]から声がして、こう言った。「これはわたしの愛する子、わたしが喜びとする者である[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「天」に当たる語は複数形である。日本語の「天から」は数を特定しない。
    reason: source_form
  - marker: b
    text: 直訳に近くは「この者にあって、わたしは喜んだ」。また「この者はわたしの心にかなっている」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίを文脈の展開を示す「すると」とし、ἰδούの注意を強く促す荘重な働きを「見よ」で保った。
- source_word: φωνὴ
  choice: 声
  rationale: 後に直接話法が続くため、単なる音ではなく、ことばを語る声を指す。
- source_word: ἐκ τῶν οὐρανῶν
  choice: 天から
  rationale: 原文は複数形だが、日本語の「天」は数を明示せず自然に同じ領域を表せる。原文の形は脚注で示した。
- source_word: λέγουσα
  choice: 声がして、こう言った
  rationale: 分詞が直接話法を導く構造を、明瞭で自然な日本語の叙述にした。
- source_word: Οὗτός ἐστιν
  choice: これは
  rationale: 指示と同定の力を簡潔に保つ自然な日本語とした。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: わたしの愛する子
  rationale: 「子」という関係とἀγαπητόςの「愛されている／愛する」の意味を、荘重で理解しやすい定型表現で示した。
- source_word: ἐν ᾧ εὐδόκησα
  choice: わたしはこの者を喜びとする
  rationale: 神の喜びと是認を表す句として自然に訳しつつ、「心にかなう」だけに意味を限定しないようにした。前置詞ἐνとアオリストの字面に近い表現は脚注に残した。
theological_decisions:
- issue: イエスに対する「子」の宣言
  choice: わたしの愛する子
  alternative: わたしの、愛されている子
  rationale: 原文が明言する父子関係と愛をそのまま示し、養子・任命など特定の教理的説明を本文に付加しない。
- issue: ἐν ᾧ εὐδόκησαにおける神の喜びと是認
  choice: わたしはこの者を喜びとする
  alternative: この者はわたしの心にかなっている
  rationale: 神の好意、喜び、是認を含み得る原文の幅を保ち、単に規準への適合だけを表す言い方に狭めない。時制は宣言時に有効な神の喜びとして自然な現在形にしたが、原文の形は脚注で示した。
translation_notes:
  register: 現代の一般読者に通じる明瞭な文体を基本としつつ、天からの宣言にふさわしい荘重さを「見よ」と簡潔な直接話法で保った。「天々」のような不自然な複数表現は避け、原文情報を脚注に置いた。
