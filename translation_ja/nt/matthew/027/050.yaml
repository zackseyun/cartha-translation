  rationale: 原文は字義的には「霊を放った」だが、死を表す慣用表現でもある。本文では明瞭で自然な日本語を採りつつ、「霊」という語が持つ含みと原文の形を脚注で示し、単なる呼吸停止に意味を限定しない。
