  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: ja
  text: そして彼らは、主が私に[b]命じられた[a]とおりに、その銀貨を陶器師の畑のために渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「命じられた」は「指示された」「言いつけられた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: マタイはこの預言の引用・引喩で、一人称の「私に」という表現を、周囲の物語に合わせて変更せずに残している。
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: 渡した
  rationale: δίδωμιの基本義「与える」を保ちつつ、銀貨の処置を表す文脈に自然な訳とした。「支払った」は購入を明示しすぎるため避けた。
- source_word: αὐτὰ
  choice: その銀貨を
  rationale: ギリシア語では中性複数代名詞で、文脈上は銀貨を指す。日本語の「それら」より指示対象が明瞭で自然になるよう名詞を補った。
- source_word: εἰς τὸν ἀγρὸν
  choice: 畑のために
  rationale: εἰςの方向・目的の含みを、この購入ないし取得の文脈に即して表した。「畑に」では銀貨を畑の中へ置いたとの誤解を招きうる。
- source_word: τοῦ κεραμέως
  choice: 陶器師の
  rationale: κεραμεύςは土器を作る職人を指す。「陶器師」は簡潔で、属格による「陶器師の畑」という関係もそのまま保てる。
- source_word: καθὰ
  choice: とおり
  rationale: 後続内容との一致を示す比較表現を、現代日本語で自然な「〜とおり」とした。
- source_word: συνέταξέν
  choice: 命じられた
  rationale: συντάσσωの権威ある指示という意味を明確に表す。文脈における主への敬意を自然に示すため尊敬表現を用いた。別訳「指示された」も可能。
- source_word: μοι
  choice: 私に
  rationale: 一人称単数与格を明示的に保持し、引用の話者を物語の文脈に合わせて変更しなかった。
- source_word: κύριος
  choice: 主
  rationale: κύριοςの定着した聖書語として「主」を採用した。日本語では冠詞を別に訳出しない。
theological_decisions:
- issue: 引用・引喩における一人称の話者
  choice: ギリシア語の「私に」をそのまま保持する
  alternative: 周囲の物語や旧約の文言に合わせ、話者を明示せず意訳する
  rationale: 本文にはμοι（私に）があり、マタイの引用方法をめぐる緊張を翻訳で調和させず、原文どおり残すため。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「陶器師」は職業名としてやや文語的だが、意味が明確で聖書本文に適する。「私に」を明示し、引用に内在する曖昧さを保持した。
