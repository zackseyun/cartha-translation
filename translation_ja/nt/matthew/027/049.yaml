  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: ja
  text: しかし、ほかの人々は言った。「そのままにしておけ。エリヤが彼を救いに来るかどうか、見てみよう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: しかし、ほかの人々は
  rationale: δέの対照を「しかし」で示し、λοιποίは直前の行為者以外の人々を指す自然な日本語として「ほかの人々」とした。
- source_word: ἔλεγον
  choice: 言った
  rationale: 未完了過去は継続・反復を含み得るが、この発言を導入する日本語の物語文では単純な「言った」が自然であり、必要以上に反復性を明示しない。
- source_word: Ἄφες
  choice: そのままにしておけ
  rationale: 単数命令形で、直前の行為者に介入をやめるよう求める語。明示されていない目的語を「彼」と断定せず、文脈に合う慣用的な表現とした。
- source_word: ἴδωμεν
  choice: 見てみよう
  rationale: 一人称複数の勧誘的接続法を、自然で直接的な勧誘表現にした。
- source_word: εἰ ἔρχεται
  choice: 来るかどうか
  rationale: εἰが導く間接疑問を「かどうか」で表した。現在形ἔρχεταιの切迫感を保ちつつ、日本語ではこの文脈に自然な非過去形「来る」とした。
- source_word: Ἠλίας
  choice: エリヤ
  rationale: 日本語聖書で一般的な固有名詞表記。
- source_word: σώσων αὐτόν
  choice: 彼を救いに
  rationale: 未来分詞σώσωνを来る目的として表し、σῴζωの基本的な語義と受難物語における響きを保つため「救う」を用いた。
theological_decisions:
- issue: 十字架の場面におけるσῴζωの神学的含意
  choice: 目の前の死からの解放を指す「彼を救いに」と訳す
  alternative: 彼を助けに／彼を救出しに
  rationale: 発言者が念頭に置くのは十字架からの目に見える救出だが、「救う」とすることで語の通常の意味と受難物語の皮肉な響きの双方を保ち、教理的意味を付加も排除もしない。
translation_notes:
  register: 明快な現代標準語を用いながら、受難記事にふさわしい簡潔で重みのある語調とした。「そのままにしておけ」は命令の直接性を保ち、「見てみよう」は群衆の観察的・嘲弄的な発言として自然に響く。
