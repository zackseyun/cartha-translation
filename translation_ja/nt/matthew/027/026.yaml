source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: ja
  text: そこで、ピラトは彼らにバラバを釈放した。しかし、イエスを鞭で打った[a]後、十字架につけられるために引き渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鞭で打った」は、ローマの刑罰として行われた鞭打ちを指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の時間的な進行と、直前の決定を受けた展開の両方を自然な現代日本語で示す。
- source_word: ἀπέλυσεν
  choice: 釈放し
  rationale: 囚人を司法的に解放する文脈に適した、明確で一般的な表現。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 釈放の受け手・利益を受ける側を示す与格を直接反映する。
- source_word: τὸν Βαραββᾶν
  choice: バラバを
  rationale: 人名を日本語聖書で一般的な形に音写し、目的語として表す。
- source_word: τὸν δὲ Ἰησοῦν
  choice: イエスを
  rationale: δέによる対照は、バラバの釈放とイエスへの処置を並置する文全体の構造で十分明らかなため、不自然な逆接語を加えない。
- source_word: φραγελλώσας
  choice: むちで打った後
  rationale: ローマ式の鞭打ちを指す動詞であり、アオリスト分詞が主動詞に先立つ行為を表すことを明確にする。
- source_word: παρέδωκεν
  choice: 引き渡した
  rationale: 定められた処刑へ向けて権限ある者の手に渡す司法的な意味を自然に保つ。
- source_word: ἵνα σταυρωθῇ
  choice: 十字架につけるために
  rationale: ἵναと受動接続法が表す目的を簡潔に示す。日本語では主語を明示せずとも、イエスが十字架刑に処される意味が文脈上明白である。
theological_decisions:
- issue: イエスへの鞭打ちと引き渡しの順序および行為主体
  choice: ピラトはイエスを鞭打たせた後、十字架刑のために引き渡した
  alternative: イエスを引き渡した後に鞭打ちが行われた
  rationale: φραγελλώσαςは主動詞παρέδωκενに先行する行為を表すのが自然である。日本語の使役形を避けたが、主語ピラトによる公的命令のもとでの処置という通常の叙述を損なわない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。長い一文の流れを維持しつつ、分詞の時間関係を「後」で明示した。脚注記号は対象となる節全体の末尾に置いた。
