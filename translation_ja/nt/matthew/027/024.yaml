  to: そこでピラトは、何の効果もなく、かえって騒動が起こり始めているのを見て、水を取り、群衆の前で手を洗って言った。「この血について、私には責任がない。[a] あなたがた自身で始末することだ。」[b]
  rationale: 進行中の騒動をより正確に表し、ピラトの取り組みが無効だったという文脈上の含意を過度に明示しないよう整えた。最後の発言は、群衆への責任委任という慣用的意味を保ちつつ、原文以上に強い命令調にならない自然な現代語に改めた。
