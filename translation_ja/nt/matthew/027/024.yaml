reference: Matthew 27:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: ja
  text: そこでピラトは、何の効果もなく、かえって騒動が起こり始めているのを見て、水を取り、群衆の前で手を洗って言った。「この血について、私には責任がない。[a] あなたがた自身で始末することだ。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私はこの血から潔白である」。人の死について責任がない、という意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたがたが見るだろう」。ここでは「あなたがた自身で対処することだ」「責任を引き受けることだ」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: そこでピラトは……のを見て
  rationale: δέを物語の次の展開を示す接続として自然な「そこで」で表し、アオリスト分詞を日本語の従属節にした。
- source_word: ὅτι οὐδὲν ὠφελεῖ
  choice: 何をしても無駄で
  rationale: 直訳は「何の役にも立たない」だが、文脈上はピラトの働きかけが成果を上げないことを指すため、簡明な現代語で表した。
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: かえって騒動が起こりかけている
  rationale: θόρυβοςの群衆による騒乱・騒動という幅を保ち、γίνεταιの進行中の発生を「起こりかけている」で表した。
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: 水を取り、……手を洗って
  rationale: 先行する付帯動作と象徴的な洗浄行為を、自然な日本語の連続動作として訳した。
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: 群衆の前で
  rationale: 行為が群衆に見える公然のものであったことを簡潔に表す。
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: この血について、私には責任がない
  rationale: 「この血から潔白だ」という原文の責任否認の慣用的意味を明瞭にしつつ、「この血」を残して原文の表現を保った。
- source_word: ὑμεῖς ὄψεσθε
  choice: あなたがた自身で始末するがよい
  rationale: 字義は「あなたがたが見るだろう」だが、ここでは相手に処置と責任を委ねる慣用表現。明示されたὑμεῖςの強調を「自身で」で示した。
theological_decisions:
- issue: ピラトの潔白の宣言
  choice: ピラト自身による責任否認として直接話法で訳し、その主張が真実であるとは本文で認定しない。
  alternative: 「私はこの血から潔白である」と、より逐語的に訳す。
  rationale: 物語が残すピラトの法的・道徳的責任をめぐる緊張を、翻訳によって解消しないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。ピラトの公的な身振りと責任転嫁が自然に伝わるようにした。「騒動」はθόρυβοςを過度に限定して「暴動」と断定しない選択。
