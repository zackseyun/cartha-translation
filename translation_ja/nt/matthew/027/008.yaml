lexical_decisions:
- source_word: διὸ
  choice: そのため
  rationale: 直前に述べられた畑の購入と命名を受ける結果・推論のつながりを、現代日本語で明確かつ自然に示す。
- source_word: ἐκλήθη
  choice: 呼ばれている
  rationale: アオリスト受動形は命名された出来事を表すが、「今日に至るまで」と組み合わされて、その呼称が著者の時代まで存続していることを示す。日本語では「呼ばれている」が自然にこの継続を伝える。
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: その畑
  rationale: ἀγρόςを基本義どおり「畑」とし、ἐκεῖνοςは文脈上すでに言及された場所を指す「その」で表した。後続の地名との語の反復も保つ。
- source_word: Ἀγρὸς Αἵματος
  choice: 「血の畑」
  rationale: ἀγρόςと属格αἵματοςから成る名称を、関係を明瞭に保つ日本語「血の畑」とした。かぎ括弧によって固有の呼称であることを示す。
- source_word: αἵματος
  choice: 血
  rationale: αἷμαの属格単数で、地名を構成する語。「血」と簡潔に訳し、属格関係は助詞「の」で表した。
- source_word: ἕως τῆς σήμερον
  choice: 今日に至るまで
  rationale: その名称が著者の現在まで用いられていたことを表す慣用的な時間表現。格調を保ちつつ現代日本語として明瞭である。
