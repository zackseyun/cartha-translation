  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: ja
  text: ピラトが裁判の席に着いていると、その妻が彼のもとに使いを送って、こう伝えた。「あの正しい人[a]には、何の関わりも持たないでください。というのも、私は今日、夢の中で、あの人のことでたいへん苦しみました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪のない人」とも訳せる。ギリシア語は「正しい」「公正な」を意味し、裁判の文脈では「無実の」という意味にもなりうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: ピラトが……着いていると
  rationale: 属格独立構文の同時進行の状況を自然な日本語で表した。日本語では代名詞だけでは指示対象が曖昧になりやすいため、文脈上の人物名「ピラト」を補った。
- source_word: ἐπὶ τοῦ βήματος
  choice: 裁判の席に
  rationale: βῆμαはこの文脈で裁判を行う公的な座を指す。「裁判の席」は単なる壇や椅子ではなく司法的機能を明確にする。
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: その妻が彼のもとに使いを送り、こう言わせた
  rationale: 送られたもの自体は原文に明示されないが、λέγουσαが伝言内容を導くため、使者を介した伝達として自然に表現した。
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: あの正しい方には、何の関わりも持たないでください
  rationale: μηδὲν σοί καίの省略的な慣用句を「何の関わりも持たない」で表した。δίκαιοςの道徳的・司法的含意を保つため「正しい」を本文に採用し、文脈にふさわしい敬意を「方」で示した。
- source_word: πολλὰ γὰρ ἔπαθον σήμερον
  choice: 私は今日……たいへん苦しみました
  rationale: πολλὰ πάσχωの強意を、明瞭で自然な現代日本語「たいへん苦しむ」で表した。γάρの理由説明は日本語の文脈で自然に連結されるため独立した接続詞を置かなかった。
- source_word: κατ’ ὄναρ δι’ αὐτόν
  choice: 夢の中で、あの方のことで
  rationale: κατ’ ὄναρを慣用的に「夢の中で」、原因を示すδιά＋対格を「あの方のことで」と訳し、人物への言及を明確にした。
theological_decisions:
- issue: イエスを指すδίκαιοςの訳語
  choice: 正しい方
  alternative: 罪のない方／正しい人
  rationale: δίκαιοςの基本的な道徳的意味を保持し、マタイ福音書における含意を法的無罪だけに限定しないよう「正しい」を採用した。ただし裁判の文脈では「罪のない」も十分可能なため脚注に示した。
- issue: 夢による苦しみの性質
  choice: 夢の中で……たいへん苦しみました
  alternative: 夢のためにひどく苦しみました
  rationale: 原文は苦しみの具体的内容や夢の神的起源を説明しないため、それらを補わず、経験そのものをそのまま訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁判場面の厳粛さを保った。妻からピラトへの言葉は「ください」により自然な丁寧さを示した。原文の「彼」が日本語では曖昧になる箇所のみ「ピラト」「あの方」と明示した。
