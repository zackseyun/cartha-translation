  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: ja
  text: 第六時から第九時まで、全土を闇が覆った[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第六時は正午ごろ、第九時は午後三時ごろ。
    reason: cultural_note
  - marker: b
    text: 別訳「地上全体を」。ギリシア語は「土地、国土」と「地、世界」のどちらをも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: から
  rationale: ἀπόの起点を「から」で明確に示した。δέは弱い接続辞であり、この一節だけの日本語では特に訳語を置かなくても流れを損なわず、過度な対比も加えない。
- source_word: ἕκτης ὥρας
  choice: 第六時
  rationale: 原文の時刻表現を本文に保持した。現代の時刻との対応は脚注で説明する。
- source_word: σκότος
  choice: 闇
  rationale: ここでは実際の暗さを表す基本語。「闇」は簡潔で荘重さがあり、出来事の際立った描写を保つ。
- source_word: ἐγένετο
  choice: 覆った
  rationale: 直訳的には「生じた／起こった」だが、ἐπὶ句と合わせて「闇が覆った」とすることで、暗闇の到来を自然な現代日本語で表した。
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: 全土を
  rationale: γῆには「土地、国土」と「地、世界」の両義がある。本文では受難物語の直接の舞台に即した「全土」を採用し、より広い「地上全体」の可能性を脚注に残した。
- source_word: ἕως ὥρας ἐνάτης
  choice: 第九時まで
  rationale: 原文の時刻表現を保持し、終点を自然な日本語の「まで」で示した。現代時刻は脚注で補う。
theological_decisions:
- issue: 暗闇が及んだ範囲を示すγῆ
  choice: 全土
  alternative: 地上全体
  rationale: γῆ自体は地域的にも世界的にも解し得る。本文では文脈上抑制された訳を採用する一方、宇宙的規模と読む可能性を排除せず脚注に明記した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語としつつ、「第六時」「第九時」という原文の文化的表現を残して荘重さを保った。「全土」と「地上全体」の解釈上の幅は本文と脚注で提示した。
