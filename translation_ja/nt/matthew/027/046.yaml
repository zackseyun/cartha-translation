source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: ja
  text: 第九時ごろ、イエスは大声で叫ばれた[a]。「エリ、エリ、レマ、サバクタニ？」これは、「わが神、わが神、なぜ私をお見捨てになったのですか[b]」という意味である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この言葉遣いは詩篇22篇1節を反映している。
    reason: cross_reference
  - marker: b
    text: ギリシア語の動詞はアオリストで、「なぜ私をお見捨てになったのですか」という問いは、過去の行為を指すとも、現在に及ぶ状態を訴えるとも受け取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: 第九時ごろ
  rationale: περί＋対格は時刻のおおよそを表す。δὲは軽い接続辞であり、日本語では明示せず自然な叙述の流れに委ねた。第九時は当時の時刻表現を保持する。
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: 大声で叫ばれた
  rationale: 動詞と様態を一体として自然な日本語にしつつ、大きな声を上げたという強調を保持した。イエスへの敬意を示す通常の文体として尊敬表現を用いた。
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: エリ、エリ、レマ、サバクタニ
  rationale: マタイがセム語の叫びを保存した後に訳を示す構成を、そのまま保持した。
- source_word: τοῦτ’ ἔστιν
  choice: これは、…という意味である
  rationale: 直前のセム語表現に対する翻訳・説明であることを、明瞭で自然な日本語で示した。
- source_word: Θεέ μου θεέ μου
  choice: わが神、わが神
  rationale: 呼格の反復と詩篇22篇1節を思わせる厳粛な響きを保持した。
- source_word: ἱνατί με ἐγκατέλιπες
  choice: なぜ私をお見捨てになったのですか
  rationale: ἱνατίを「なぜ」、ἐγκατέλιπεςを「見捨てる」と訳した。アオリストの時間的含意を日本語で過度に限定せず、現に発せられた切実な問いとして自然に表現した。
theological_decisions:
- issue: イエスの叫びと詩篇22篇1節との関係
  choice: 見捨てられたことを訴える実際の叫びとして率直に訳し、同時に詩篇を想起させる語調を保つ。
  alternative: 単なる詩篇引用の合図として弱める、または見捨てられたという意味を和らげて意訳する。
  rationale: ギリシア語本文は叫びを解釈で限定していないため、経験的な切実さも、その神学的な深みも翻訳によって一義的に解消しない。
- issue: セム語の叫びを本文に残すか
  choice: 音写を本文に残し、その後に意味を示す。
  alternative: 意味だけを日本語で記す。
  rationale: マタイ自身が原語の叫びとその翻訳の両方を記しており、後続文脈で「エリ」がエリヤへの呼びかけと誤解される narrative detail にも関係する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、受難記事にふさわしい厳粛さを保った。「わが神」は詩篇的な響きを保持するために選び、その他は過度に古風な文語を避けた。
