source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: ja
  text: そして、イエスの頭の上に、イエスに対する罪状[a]を書いた札を掲げた。「これはユダヤ人の王イエスである[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスに対する告発内容」。ギリシア語のαἰτίαには、ここでは司法的な意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「ユダヤ人」は「ユダヤ地方の人々」とも訳せる。ギリシア語のἸουδαίωνは、文脈により民族的にも地理的にも理解し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: 掲げた
  rationale: 物理的に置くことを表すが、ここでは罪状書きを頭上に設置する動作なので、現代日本語では「掲げた」が自然である。
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: イエスの頭の上に
  rationale: 属格を伴うἐπάνωの位置関係を明確に表し、本人を指す代名詞の連続を避けた。
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: イエスに対する罪状
  rationale: αἰτίαの司法的意味を表す。「罪状」は処刑理由を記した公式な告示という文脈に合う。
- source_word: γεγραμμένην
  choice: 記して
  rationale: 完了受動分詞が示す書かれた状態を、日本語の自然な連用表現で伝える。
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: これは、…イエスである
  rationale: 指示代名詞と繋辞を保ちつつ、後続する称号と合わせて自然な碑文調にした。
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: 受難物語の政治的・王権的な告発文として定着した意味を明瞭に表す。
theological_decisions:
- issue: 十字架上の札に記された司法的文言
  choice: 罪状
  alternative: 告発内容
  rationale: 札が処刑の法的理由を示すという司法的含意を保ち、余分な神学的解釈を加えない。
- issue: Ἰουδαίωνの範囲
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: この王号・告発の定型句では民族・宗教共同体を指す「ユダヤ人」が文脈上最も自然だが、語には地理的意味もあり得るため脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、告示文は簡潔で荘重な「である」調とした。本文の叙述は自然な動作表現とし、固有名を補って指示対象を明確にした。
