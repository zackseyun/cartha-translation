source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: ja
  text: 人々はイエスに、胆汁を混ぜたぶどう酒を飲むように与えた[a]。しかし、イエスはそれを味見すると、飲もうとはしなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「胆汁」と訳したギリシア語は、文字どおりの胆汁のほか、一般に苦い物質を指すこともある。マルコ15章23節の並行記事では「没薬」と記されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: イエスに…飲ませようとした
  rationale: 直訳は「彼に飲むために与えた」。日本語では、飲み物を差し出す行為を自然に表しつつ、実際には飲まなかったという文脈に合わせて「飲ませようとした」とした。主語は文脈上の人々、目的語はイエスであることを明示した。
- source_word: οἶνον
  choice: ぶどう酒
  rationale: 当時の発酵した葡萄酒を指す通常の語。現代日本語の聖書文体で明確な「ぶどう酒」とした。
- source_word: μετὰ χολῆς μεμιγμένον
  choice: 胆汁を混ぜた
  rationale: χολήは文字どおりには胆汁・胆液を意味し、広く苦い物質を指す場合もある。マタイの語彙と聖書的連想を保つため本文では「胆汁」とし、μεμιγμένονを「混ぜた」と訳した。
- source_word: γευσάμενος
  choice: それを味見すると
  rationale: アオリスト分詞の先行動作を自然な日本語で表現した。「口にすると」では飲んだ印象を与え得るため、味を確かめたことを示す「味見する」とした。
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: 飲もうとはしなかった
  rationale: θέλωの意志・意欲の含みを保ち、単なる「飲まなかった」や、より強い解釈となる「拒んだ」を避けた。
theological_decisions:
- issue: 受難記事と詩編的連想に関わるχολήの訳
  choice: 胆汁
  alternative: 苦い物／苦味のあるもの
  rationale: χολήには胆汁と、より一般的な苦い物質の両義性がある。本文では語の具体性とマタイ固有の表現を保ち、意味の幅は脚注で示した。マルコ15章23節の「没薬」に同一化しない。
- issue: イエスが飲まなかったことの意志性
  choice: 飲もうとはしなかった
  alternative: 飲むのを拒んだ
  rationale: 原文のοὐκ ἠθέλησενは意志しなかったことを述べるが、拒絶の態度や理由までは明示しないため、その神学的・心理的動機を補わない表現とした。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「イエス」を補って指示対象を明確にし、「飲もうとはしなかった」で原文の意志性を自然に保った。脚注記号[a]は対応箇所に配置した。
