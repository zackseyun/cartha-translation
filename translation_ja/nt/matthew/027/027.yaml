id: MAT.27.27
reference: Matthew 27:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: ja
  text: それから、総督の兵士たちはイエスを総督官邸[a]の中に連れて行き、部隊全員をイエスの周りに集めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「総督の官邸」または「総督の司令部」とも訳せる。ギリシア語は、ローマ総督の公邸または軍の司令部を指す。
    reason: lexical_alternative
  - marker: b
    text: 「部隊」はローマ軍の編制単位を表す語。この表現は、その部隊の定員すべてが実際にその場にいたことを必ずしも意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: それから
  rationale: 受難物語の出来事が次へ進むことを示す自然な時間接続として訳した。
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: 総督の兵士たち
  rationale: 属格の所属・関係を自然な現代日本語で表し、ローマ総督に属する兵士たちであることを明確にした。
- source_word: ἡγεμόνος
  choice: 総督
  rationale: この文脈ではローマの地方統治者を指すため、「支配者」より具体的で、「長官」ほど官職を限定しすぎない訳語を選んだ。
- source_word: παραλαβόντες
  choice: 連れて行き
  rationale: 兵士たちがイエスを引き取って官邸内へ移動させたことを、分詞構文に拘泥せず自然に表した。
- source_word: εἰς τὸ πραιτώριον
  choice: 総督官邸[a]の中に
  rationale: πραιτώριονの歴史的意味を一般読者に直ちに理解できる表現で示した。軍司令部を含み得る語義の幅は脚注に残した。
- source_word: συνήγαγον
  choice: 集めた
  rationale: 兵士たちを一か所に集合させたという基本義を簡潔に表した。
- source_word: ἐπ’ αὐτὸν
  choice: イエスの周りに
  rationale: この場面ではイエスのもとへ集結し、取り囲む配置になることを表すのが最も自然である。代名詞を固有名に戻して日本語での指示を明瞭にした。
- source_word: ὅλην τὴν σπεῖραν
  choice: 部隊全員
  rationale: σπεῖραがローマ軍の編制単位を指すことを保ちつつ、「コホルス」という専門語を本文では避けた。ὅληνは「全員」で反映したが、定員どおりの全兵員が実在したとの断定を避ける説明を脚注に置いた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「プラエトリウム」「コホルス」の音写は歴史的精密さがある一方で一般読者には難しいため、本文では意味の通る「総督官邸」「部隊」を用い、語義と文化的背景を脚注で補った。
