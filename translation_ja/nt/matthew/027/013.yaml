  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: ja
  text: そのとき、ピラトは彼に言った。「彼らがあなたに不利なことをどれほど多く証言しているか、聞こえないのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の次の展開を示す時間的・談話的な接続語として、現代日本語の叙述に自然である。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語では臨場感を与える歴史的現在だが、日本語では過去形が自然な物語叙述となる。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 直訳は「彼に」だが、日本語では人物の取り違えを避けるため、文脈上明らかな指示対象を明示する。
- source_word: Οὐκ ἀκούεις
  choice: 聞こえないのか
  rationale: 否定疑問の力を保ちつつ、相手の耳に入っている証言を指す自然な日本語とした。
- source_word: πόσα
  choice: どれほど多くのことを
  rationale: 具体的に「告発」と限定せず、原文の中性複数が示す多数の事柄を保持する。
- source_word: σου ... καταμαρτυροῦσιν
  choice: あなたに不利な証言として述べている
  rationale: 法廷的な「不利な証言をする」という意味を明示し、「告発する」へ意味を狭めすぎない。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、ピラトの問いの圧力と法廷的文脈を保った。歴史的現在は、日本語として不自然な時制混在を避けるため過去形で訳した。
