  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: ja
  text: しかし、総督は彼らに答えた。「二人のうち、私があなたがたのために釈放することを望むのは、どちらか。」彼らは言った。「バラバを。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: しかし、総督は彼らに答えた
  rationale: ἀποκριθείς＋εἶπενというギリシア語の慣用的な重複表現を、現代日本語で自然な「答えた」にまとめた。δὲは場面の軽い転換・対照を示すため「しかし」とし、ἡγεμώνはローマの属州総督を指す文脈に即して「総督」とした。
- source_word: Τίνα θέλετε ἀπὸ τῶν δύο
  choice: 二人のうち、どちらを…ほしいのか
  rationale: Τίναとἀπὸ τῶν δύοが示す、特定された二人からの選択を「二人のうち、どちら」と表現した。θέλετεは率直な希望・選好を表すため「ほしい」とした。
- source_word: ἀπολύσω ὑμῖν
  choice: あなたがたのために釈放して
  rationale: 法的文脈のἀπολύωを「釈放する」とし、一人称接続法をθέλετεに従属させて「釈放してほしい」と自然に表現した。ὑμῖνは受益の意味を保って「あなたがたのために」とした。
- source_word: οἱ δὲ εἶπαν
  choice: 彼らは言った
  rationale: 二つ目のδὲは群衆の応答へ進む軽い継続であり、日本語では接続詞を置かないほうが自然なため、単に「彼らは言った」とした。
- source_word: Τὸν Βαραββᾶν
  choice: バラバを
  rationale: 固有名詞Βαραββᾶςを慣用的に「バラバ」と音写し、問いへの省略応答であることを格助詞「を」で明示した。
