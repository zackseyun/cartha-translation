  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: ja
  text: 同じように[a]、イエスとともに十字架につけられた強盗たちまで、イエスをののしっていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同じことを」。ギリシア語の表現は、彼らも同じ仕方でイエスを扱ったことを意味する。
    reason: lexical_alternative
  - marker: b
    text: または「侮辱していた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: 同じように
  rationale: τὸ αὐτόはここでは副詞的に働き、直前に描かれたのと同じ仕方であざけったことを示す。「同じことを」より自然に文脈上の意味を伝える。δέは軽い展開を示し、日本語では明示しなくても流れが保たれる。
- source_word: καὶ
  choice: まで
  rationale: 通行人や指導者たちに加え、共に処刑された強盗たちも加わったという強調を、「まで」で自然に表した。
- source_word: λῃσταὶ
  choice: 強盗たち
  rationale: λῃστήςの基本的な意味である強盗・盗賊を明確に表し、政治的反乱者などと過度に限定しない。
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: イエスとともに十字架につけられた
  rationale: 受動の分詞が強盗たちを限定していることを保ち、「ともに」によって同じ場所で十字架刑に処された意味を自然に示す。代名詞の指示対象は日本語で明確にするため「イエス」とした。
- source_word: ὠνείδιζον
  choice: ののしっていた
  rationale: 非難や侮辱を浴びせる意味と、未完了過去が示す継続的な行為の両方を、現代日本語で簡潔に表す。
- source_word: αὐτόν
  choice: イエスを
  rationale: 目的語がイエスであることを、日本語で曖昧にならないよう固有名で示した。
theological_decisions:
- issue: ルカの記述では一人の犯罪人が異なる言動を取ることとの調和
  choice: マタイの複数形をそのまま保ち、強盗たちがイエスをののしっていたと訳す。
  alternative: 福音書間の見かけ上の緊張を和らげるため、複数への言及を弱める。
  rationale: 本文は複数の「強盗たち」と複数形の動詞を用いているため、他の福音書に合わせて限定や説明を加えず、マタイの叙述をそのまま保持する。
translation_notes:
  register: 明快で自然な現代標準日本語を用いつつ、受難物語にふさわしい簡潔で厳粛な調子を保った。「ののしっていた」により継続的な侮辱を表し、複数形が生む福音書間の緊張は解消せず保持した。
