  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: ja
  text: 彼らはイエスを十字架につけた後、くじを引いてイエスの衣服を分けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: 十字架につけると
  rationale: アオリスト分詞が主動詞に先立つ行為を示しているため、十字架刑の後に衣服を分けたという順序を、自然な現代日本語で表した。文脈上の主語は兵士たちである。
- source_word: δὲ
  choice: （「と」の接続に含める）
  rationale: ここでは物語を穏やかに進める接続辞であり、独立した「そして」を置かず、前後関係を示す「と」に機能を含めるほうが日本語として自然である。
- source_word: διεμερίσαντο
  choice: 分け合った
  rationale: 衣服を複数の者の間で分配したことを表す中動態の形に即し、「分けた」よりも相互的な分配が自然に伝わる表現とした。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: その衣服
  rationale: ἱμάτια は衣類を広く指しうるため、「上着」と限定せず「衣服」とした。αὐτοῦ は直前のイエスを受けるため「その」とした。
- source_word: βάλλοντες κλῆρον
  choice: くじを引いて
  rationale: 字義的には「くじを投じて」だが、分配方法を示す慣用的で明瞭な現代日本語として「くじを引いて」とした。κλῆρον は単数形だが、日本語では数量を明示する必要がない。
theological_decisions:
- issue: βάλλοντες κλῆρον と διεμερίσαντο の関係
  choice: くじを引くことを、衣服を分ける方法として表す
  alternative: 「その衣服を分け合い、くじを引いた」と並列的に訳す
  rationale: 分詞は主動詞に伴い、どのように衣服を分けたかを示すと自然に理解できる。「くじを引いて」により、その関係を過度な解釈を加えず明確にした。
- issue: σταυρώσαντες の時間的関係
  choice: 「十字架につけると」と訳し、先行する行為として示す
  alternative: 「十字架につけて」と訳して付帯状況としてやや曖昧に残す
  rationale: アオリスト分詞はここで主動詞に先行する行為を自然に表す。「すると」ほど即時性を強調せず、出来事の順序を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、受難記事にふさわしい簡潔で落ち着いた文体とした。「衣服」「十字架につける」は一般読者にも理解しやすく、過度に古風ではない。
