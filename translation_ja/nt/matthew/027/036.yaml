  yaml_path: translation/nt/matthew/027/036.yaml
  text: And sitting there[a], they kept watch over him.
translation:
  language: ja
  text: そして、そこに座って、イエスを見張っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な接続として物語の流れを保ち、原文に明示されない因果や強い時間的意味を加えない。
- source_word: καθήμενοι
  choice: 座って
  rationale: κάθημαι の現在分詞が表す、主動詞に伴う姿勢・状況を、自然な現代日本語で表した。
- source_word: ἐτήρουν
  choice: 見張っていた
  rationale: τηρέω はこの文脈では監視・警護を意味し、未完了過去の継続的な動作を「見張っていた」で示した。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 代名詞の指示対象を日本語で明確にし、節単独でも理解しやすくした。
- source_word: ἐκεῖ
  choice: そこに
  rationale: 行為が行われた場所を示す場所副詞として、分詞句に自然に結び付けた。
theological_decisions: []
