id: MAT.27.17
reference: Matthew 27:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: ja
  text: そこで、彼らが集まったとき、ピラトは彼らに言った。「あなたがたは、私にどちらを釈放してほしいのか。イエス・バラバ[a]か、それともメシアと呼ばれるイエス[b]か。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「イエス・バラバ」ではなく、単に「バラバ」とする。
    reason: textual_variant
  - marker: b
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語クリストスは、ここでは称号として用いられている。
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: 彼らが集まったとき
  rationale: 属格絶対の分詞句を時間的に訳した。集まったという先行する出来事を示しつつ、現代日本語として自然である。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語の進行と帰結を自然に示す。
- source_word: Τίνα
  choice: どちらを
  rationale: 二人のうち一人を選ばせる問いなので、二者択一を明示する「どちら」が適切である。
- source_word: θέλετε
  choice: 釈放してほしいのか
  rationale: ここでは意志・希望を表す。後続の接続法ἀπολύσωと合わせ、「私に……してほしい」という自然な日本語にした。
- source_word: ἀπολύσω
  choice: 私に……釈放して
  rationale: 囚人を自由にする司法的文脈を保つ。「赦免する」ではなく「釈放する」とした。動詞の一人称は「私に」で明示した。
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: イエス・バラバ
  rationale: 提示されたSBLGNT本文のἸησοῦνを反映し、同じ名を持つ二人の対比を保持した。
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: メシアと呼ばれているイエス
  rationale: λεγόμενονを中立的な「呼ばれている」とし、軽蔑的な含みを加えなかった。χριστόςはここでは称号なので「メシア」と訳した。
theological_decisions:
- issue: χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: 「呼ばれている」に続く称号として機能しているため、固有名のように音写するより、称号として「メシア」と訳した。別の伝統的表現は脚注に示した。
- issue: バラバの前の「イエス」の有無
  choice: 本文に「イエス・バラバ」を採用
  alternative: 「バラバ」のみ
  rationale: 提示されたSBLGNT本文にはἸησοῦνがあるため本文に反映した。一方、写本上の異読は脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、法的な場面にふさわしい落ち着いた語調を保った。「私に」を補ってἀπολύσωの一人称を明示し、問いの構造を分かりやすくした。脚注記号は、それぞれが説明する語句の直後に配置した。
