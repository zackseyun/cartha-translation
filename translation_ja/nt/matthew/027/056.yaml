  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: ja
  text: その中には、マグダラのマリア、ヤコブとヨセフ[a]の母マリア、そしてゼベダイの息子たちの母がいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「ヨセフ」ではなく「ヨセ」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: その中には
  rationale: 直前の節にある、遠くから見守っていた女性たちの一団を受ける関係表現。日本語では「その中には」が自然に所属関係と前節とのつながりを示す。
- source_word: ἦν
  choice: いた
  rationale: 後続する複数の女性を挙げる存在表現。日本語では人について「いた」とするのが自然であり、ギリシア語の単数形を不自然に再現しない。
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: マグダラのマリア
  rationale: 出身地または呼称による識別を示す、日本語聖書で広く通用する明瞭な表現。
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: ヤコブとヨセフの母マリア
  rationale: 属格が二人の息子によってこのマリアを識別している構造を、簡潔で自然な日本語にした。
- source_word: Ἰάκωβος
  choice: ヤコブ
  rationale: ギリシア語名Ἰάκωβοςの標準的な日本語音写。英語の慣用形Jamesには依存せず、原語に基づいた。
- source_word: Ἰωσὴφ
  choice: ヨセフ
  rationale: 採用本文SBLGNTのἸωσήφを標準的に音写した。別読は脚注で保持する。
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ゼベダイの息子たちの母
  rationale: 属格関係を明瞭に保ち、二人の息子の母であることを自然な日本語で表した。
- source_word: Ζεβεδαίου
  choice: ゼベダイ
  rationale: Ζεβεδαῖοςの標準的な日本語音写。
theological_decisions: []
