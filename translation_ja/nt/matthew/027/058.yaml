id: MAT.27.58
reference: Matthew 27:58
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: ja
  text: この人はピラトのところへ行き、イエスの遺体を渡してほしいと願い出た。そこでピラトは、遺体を引き渡すよう命じた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「遺体を渡すよう」。ギリシア語はここで、「渡す」「引き渡す」などと訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: この人は
  rationale: 前節のアリマタヤのヨセフを指す指示代名詞。文脈上の人物を明確に受けつつ、ギリシア語の指示性を保った。
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: ピラトのところへ行き
  rationale: ピラトに近づいた先行動作を、現代日本語の物語文として自然に表した。
- source_word: ᾐτήσατο
  choice: 渡してほしいと願い出た
  rationale: 単なる質問ではなく、遺体の引き渡しを正式に求める場面なので、「願い出た」とした。
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: イエスの遺体
  rationale: σῶμαの基本義は「体」だが、ここでは死後の体を指すため、日本語では敬意と自然さを備えた「遺体」が明確。
- source_word: τότε
  choice: そこで
  rationale: 願い出を受けた次の出来事と応答関係を自然に示す。時間的な「その時」も可能。
- source_word: ἐκέλευσεν
  choice: 命じた
  rationale: 行政権限を持つピラトが指示を出すというκελεύωの意味を簡潔に表す。
- source_word: ἀποδοθῆναι
  choice: 遺体を引き渡すよう
  rationale: 受動不定詞を日本語の命令内容として自然に能動化した。受取人を本文で明示せず、原文の含みを保った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「死体」は避け、葬りの文脈に適した「遺体」を用いた。原文で明示されない引き渡し先を補わず、ヨセフへの引き渡しは文脈から理解できる形にした。
