  source_fidelity: οὗτοςは前節のアリマタヤのヨセフを受ける「この人」として適切に表されている。προσελθών τῷ Πιλάτῳ、ᾐτήσατο、τὸ σῶμα τοῦ Ἰησοῦは、「ピラトのところへ行き」「遺体を渡してほしいと願い出た」「イエスの遺体」によって文脈に即して忠実に訳されている。ἐκέλευσεν ἀποδοθῆναιも、受取人を本文で過度に補わず、「遺体を引き渡すよう命じた」として適切である。
