reference: Matthew 27:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: ja
  text: 朝になると[a]、祭司長たちと民の長老たちは皆、イエスを死に至らせるために協議した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夜が明けると」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「協議を行った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: 朝になると
  rationale: 属格絶対による時の移行を、自然な現代日本語で表した。δέは文脈上の移行に含ませ、独立した接続語にはしなかった。
- source_word: συμβούλιον ἔλαβον
  choice: 協議した
  rationale: 指導者たちが正式に相談・審議したことを示す慣用句。単なる会話や、本文以上に陰謀性を強める「企てた」を避けた。
- source_word: πάντες
  choice: 皆
  rationale: 参加した指導者層の包括性を明示する語なので保持した。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 福音書におけるエルサレムの祭司指導者層を指す標準的な訳語。複数の大祭司が在職していたかのような誤解を避ける。
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: 民の長老たち
  rationale: 民を代表する指導者たちという正式な呼称を、簡潔で定着した日本語で表した。
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: イエスに対して
  rationale: 属格を伴うκατάの敵対的な方向性を示しつつ、日本語として「協議した」と自然につながる表現にした。
- source_word: ὥστε
  choice: ため
  rationale: 不定詞を伴い、意図された結果・目的を表す。日本語では目的を自然に示す「ため」が適切である。
- source_word: θανατῶσαι αὐτόν
  choice: イエスを死刑にする
  rationale: 司法的な場面にふさわしく、単なる「殺す」より正式な処刑の意図を表す。ただし具体的な処刑方法までは付加しない。
theological_decisions:
- issue: 指導者たちのイエスに対する行動の性質
  choice: 敵対的な協議と、イエスを死刑にする目的を明示する。
  alternative: 「イエスについて相談した」と弱く訳す、または「イエスを殺そうと企んだ」と陰謀性を強く訳す。
  rationale: κατὰ τοῦἸησοῦは敵対性を、ὥστε θανατῶσαι αὐτόνは死に至らせる目的を明確に示す。一方、「協議した」は本文が述べる審議性を保ち、必要以上に陰謀の含意を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「祭司長」「民の長老」は聖書文脈で定着した呼称として用い、文全体は一般読者にも理解しやすい語順に整えた。
