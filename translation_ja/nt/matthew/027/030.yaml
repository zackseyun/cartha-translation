id: MAT.27.30
reference: Matthew 27:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: ja
  text: そして、イエスにつばを吐きかけると、葦の棒[a]を取り、それでイエスの頭を何度もたたいた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「葦」とも訳せる。ギリシア語は、葦または葦のような棒を指す。
    reason: lexical_alternative
  - marker: b
    text: 「イエスの頭をたたき続けた」とも訳せる。ギリシア語の未完了過去形は、動作の反復または継続を表し得る。
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: イエスにつばを吐きかけると
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、自然な日本語で動作の順序を示した。代名詞は文脈上の指示対象を明確にするため「イエス」とした。
- source_word: ἔλαβον
  choice: 取り
  rationale: λαμβάνωの基本的な意味を、直前の文脈でイエスに持たせた物を兵士たちが取る動作として簡潔に表した。
- source_word: τὸν κάλαμον
  choice: 葦の棒
  rationale: κάλαμοςの基本義「葦」を保ちながら、この場面では打つために用いられる棒状の物であることが現代日本語で自然に伝わるようにした。
- source_word: ἔτυπτον
  choice: 何度もたたいた
  rationale: 未完了過去が示し得る反復・継続を明示し、繰り返された暴力を自然な日本語で表した。
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: イエスの頭を
  rationale: εἰςはここで打撃の対象を示す。日本語では「頭をたたく」が最も自然であり、指示対象も明確にした。
theological_decisions:
- issue: 兵士たちによるイエスへの侮辱と暴行の描写
  choice: 行為を具体的かつ平明に描き、未完了過去の反復性を「何度も」で示す。
  alternative: 「頭をたたいていた」として継続中の動作を前面に出す。
  rationale: 本文の暴力を弱めたり誇張したりせず、ἔτυπτονが許す反復または継続という幅を注記で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、受難物語にふさわしい節度と重みを保った。「彼」ではなく「イエス」を用いて単独の節としても指示対象が明確になるようにした。
