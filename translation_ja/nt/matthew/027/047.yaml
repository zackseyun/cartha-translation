  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: ja
  text: しかし、そこに立っていた人々のうち何人かは、これを聞いて言っていた。「この人[a]はエリヤを呼んでいる。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「この者」。
    reason: lexical_alternative
  - marker: b
    text: その場にいた人々は、前の節のイエスの叫びを、エリヤを呼ぶ声だと受け取ったと考えられる。
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: 何人か
  rationale: その場にいた人々の中の、不特定の一部を自然で簡潔な日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: 直前のイエスの叫びと、それに対する人々の受け止めとの軽い対照と物語上の展開を示す。
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: そこに立っていた人々のうち
  rationale: 定冠詞を伴う完了分詞の実体詞的用法と、その場に立っている姿を保つ。
- source_word: ἀκούσαντες
  choice: これを聞いて
  rationale: 主動詞に先立つ動作を表す。目的語は明示されていないが、文脈上、直前の叫びを指すため「これ」を補う。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的・反復的な側面を、過度に強調せずに表す。
- source_word: ὅτι
  choice: 直接話法の引用符
  rationale: ギリシア語では発言内容を導くが、現代日本語では直接引用として示すのが自然である。
- source_word: Ἠλίαν
  choice: エリヤ
  rationale: 旧約の預言者名として定着した日本語表記を用いる。
- source_word: φωνεῖ
  choice: 呼んでいる
  rationale: 現在形の進行的な状況を表し、呼びかけるのか助けを求めて呼ぶのかを必要以上に限定しない。
- source_word: οὗτος
  choice: この人
  rationale: 指示語の力を保ちつつ、現代日本語として自然に人物を指す。
theological_decisions:
- issue: 群衆の言葉を、イエスが実際にエリヤを呼んだという事実として訳すか、彼らの受け止めとして訳すか
  choice: 発言の引用として「この人はエリヤを呼んでいる」とする
  alternative: 「この人はエリヤに助けを求めている」または「この人はエリヤに呼びかけている」
  rationale: 本文は傍らにいた人々の発言を報告しているので、その誤解の具体的な仕組みや意図を本文で断定せず、物語上の緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。「何人か」「この人」で平易さを保ち、「呼んでいる」は原文の意味幅を狭めない。脚注記号は対応箇所が明確になるよう、引用文末に並置した。
