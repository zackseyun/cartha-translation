  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: ja
  text: すると、民は皆答えた[a]。「その人の血の責任は、私たちと私たちの子どもたちにあるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで語っているのは、この場面に集まっていた人々である。この表現を、あらゆる時代のすべてのユダヤ人に永続的な罪責を負わせるものと受け取ってはならない。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 答えた
  rationale: 分詞と定動詞を組み合わせた応答導入の慣用表現であり、現代日本語では簡潔に「答えた」とするのが自然。
- source_word: πᾶς ὁ λαὸς
  choice: 民は皆
  rationale: 単数の定冠詞付き名詞に πᾶς が付く集合的表現。文脈上、その場に集まった人々全体を指し、「民は皆」は λαός の語感と集合性を保つ。
- source_word: Τὸ αἷμα αὐτοῦ
  choice: その人の血の責任
  rationale: 司法的文脈で「血」は死についての責任、すなわち血の責任を含意する。日本語で単に「血が私たちの上に」では意味が不明瞭になるため、慣用的含意を最小限に明示した。
- source_word: ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν
  choice: 私たちと私たちの子どもたちが負う
  rationale: 動詞のない句が持つ引受け・願望的な力を、自然な日本語の「負う」で表した。τέκνα は広く「子孫」とせず、基本義どおり「子どもたち」とした。
theological_decisions:
- issue: πᾶς ὁ λαὸς を反ユダヤ的・超歴史的に読む可能性
  choice: 物語の場面に集まった人々の集合的発言として「民は皆」と訳す。
  alternative: 「群衆は皆」と訳す、または全時代のユダヤ人に責任を拡張して解釈する。
  rationale: 原文はこの場面にいる人々の応答を報告している。集合的表現を弱めずに訳す一方、民族全体や後代に永続的責任を負わせる主張を本文へ持ち込まない。注で適用範囲を明確にする。
- issue: 「血」の比喩を日本語でどう表すか
  choice: 「血の責任」として、死に対する責任という文脈上の含意を示す。
  alternative: 「その人の血は、私たちの上に」と形式的に訳す。
  rationale: 直訳は現代日本語では血が物理的に付着する意味に誤解されやすい。「責任」を補うことで、原文の司法的・慣用的力を保ちつつ、責任の射程そのものは拡張しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「その人」は直前のイエスを指す αὐτοῦ を自然に受ける表現。「血の責任を負う」は厳粛な司法的発言としての力を保ちながら、逐語訳の不自然さを避ける。
