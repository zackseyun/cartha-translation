  rationale: 原文に明記されない「一行」「兵士たち」という主語の具体化を避け、「彼ら」に改めた。ἀγγαρεύωの脚注上の代替表現も、単なる移動の強制ではなく、強制的な役務を表すよう訂正した。αὐτοῦの指示対象については、日本語での誤読を避けるため「イエスの十字架」を維持した。
