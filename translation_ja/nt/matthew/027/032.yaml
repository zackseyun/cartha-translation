  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: ja
  text: 彼らが出て行く途中、キレネ出身のシモンという人を見つけた。彼らは、イエスの十字架を運ばせるため、この人を徴用した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「徴用した」は、権威によって人を強制的な役務に就かせたことを表す。別訳「無理に奉仕させた」「強制した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: 一行が外へ出て行く途中
  rationale: 現在分詞の同時的・時間的な働きを「途中」で表し、δέは日本語の自然な物語進行のため独立した接続語にしなかった。主語は文脈上、イエスを連行する者たちであり、「一行」として過度に限定せず示した。
- source_word: εὗρον
  choice: 見つけた
  rationale: アオリスト直説法の出来事を、明瞭で自然な現代日本語にした。
- source_word: ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα
  choice: キレネ出身のシモンという人
  rationale: 地理的出自と名前を、原文の情報順に近く、現代日本語として自然に表した。
- source_word: τοῦτον
  choice: この人
  rationale: 明示された指示代名詞の指示性を保ち、シモンを指すことを明確にした。
- source_word: ἠγγάρευσαν
  choice: 徴用した
  rationale: 権威によって強制的な役務に就かせる語義を簡潔に表す。「無理に」だけでは公権力による徴発の含意が弱いため、「徴用」を採用した。
- source_word: ἵνα ἄρῃ
  choice: 運ばせるため
  rationale: ἵνα＋接続法の目的を「ため」で示し、αἴρωはこの行進の文脈に即して「運ぶ」とした。使役形により、徴用した目的とシモンが担う行為を自然に結んだ。
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: イエスの十字架
  rationale: αὐτοῦの文脈上の指示対象はイエスである。日本語の「彼の」では直前のシモンを指すように誤読されやすいため、指示対象を明示した。σταυρόςは語の範囲を狭めず伝統的かつ正確な「十字架」とした。
theological_decisions:
- issue: αὐτοῦ（彼の）の指示対象
  choice: イエスの十字架
  alternative: 彼の十字架
  rationale: 物語上、シモンが運ばされるのは死刑囚イエスの十字架である。原文の代名詞そのものに実質的な神学的曖昧さはないが、日本語で代名詞を保つとシモンを指すとの不自然な曖昧さが生じるため、固有名で明示した。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。「徴用」はやや公的な語だが、ἀγγαρεύωの権威による強制奉仕という歴史的含意を適切に伝える。脚注記号は該当語の直後に置いた。
