  terminology: 「神の子」は、文脈上の称号的な力を保つ適切な訳です。「神の一人の子」とする必要はありません。詩篇への言及は日本語の一般的な表記に合わせ「詩編」とし、脚注aは実際に代替案が関わる条件節に付します。
