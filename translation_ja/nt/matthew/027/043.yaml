id: MAT.27.43
reference: Matthew 27:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: ja
  text: 彼は神に信頼している。神が彼を望んでいるなら[a]、今、神が彼を救い出せばよい。『私は神の子だ』と言ったのだから[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神が彼を喜んでおられるなら」。この言い回しは詩編22編8節を響かせており、そこでは神の好意という意味合いが前面に出ています。
    reason: alternative_reading
  - marker: b
    text: このあざけりは詩編22編8節と強く響き合っており、イエスへの嘲笑を、同篇に描かれる苦難を受ける者と結びつけています。
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν
  choice: 信頼している
  rationale: 完了形が表す、信頼した結果として今も続く確かな状態を、自然な現代日本語で示す。
- source_word: ἐπὶ τὸν θεόν
  choice: 神に
  rationale: πέποιθα とともに、信頼を向ける相手を表す。日本語では「神に信頼する」が原文の方向性を明確に保つ。
- source_word: ῥυσάσθω
  choice: 神に救い出してもらえばよい
  rationale: ῥύομαι は危険から救出することを表す。三人称命令の挑発的な響きを自然な日本語にし、直前の「神」を動作主として明示した。
- source_word: νῦν
  choice: 今
  rationale: 嘲る者たちが即時の救出を迫る強調をそのまま示す。
- source_word: εἰ θέλει αὐτόν
  choice: 神が彼を望んでおられるなら
  rationale: θέλω の通常の意味である「望む」を優先し、詩篇22篇への暗示に由来する「喜んでおられる」の解釈は脚注に残す。
- source_word: εἶπεν γὰρ ὅτι
  choice: 『…』と言ったのだから
  rationale: 理由を示す γάρ と、発言内容を導く ὅτι を、日本語として自然な直接話法で表した。
- source_word: Θεοῦ εἰμι υἱός
  choice: 私は神の子だ
  rationale: マタイの文脈で認識される称号的・キリスト論的な含意を保ちつつ、日本語では冠詞を補わず自然に表現できる。
theological_decisions:
- issue: Θεοῦ εἰμι υἱός の称号的意味
  choice: 私は神の子だ
  alternative: 私は神の一人の子だ
  rationale: 無冠詞であっても、語順とマタイ福音書の文脈は一般的な神的所属ではなく、イエスの称号としての「神の子」を指す。日本語の「神の子」はその力を保ちながら、原文以上の教理的説明を加えない。
- issue: θέλει αὐτόν に詩篇22篇の「喜ぶ」という含みを本文へ入れるか
  choice: 神が彼を望んでおられるなら
  alternative: 神が彼を喜んでおられるなら
  rationale: 本文では θέλω の直接的な語義を優先する。一方、詩篇22篇8節との響き合いによる神の好意・喜びの含みは真正な解釈可能性なので脚注に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、嘲りの挑発的な調子を「もらえばよい」で表した。「望んでおられる」はやや異質な響きを残すが、原文の θέλω の意味と詩篇への暗示の緊張を解消しないため意図的に保持した。
