  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: ja
  text: ピラトは彼らに言った。「番兵を使える。[a] 行って、あなたがたの知るとおりに、墓をしっかり守りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「番兵を連れて行け」、または「あなたがたには自分たちの番兵がいる」とも訳せる。ギリシア語は、ピラトが番兵の使用を許したとも、彼らがすでに利用できる番兵に言及したとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Πιλᾶτος
  choice: ピラトは彼らに言った
  rationale: 語順を自然な現代日本語に整えつつ、話者と間接目的語を明示した。
- source_word: Ἔχετε
  choice: ならいる
  rationale: ἔχωの基本的な陳述の意味を踏まえ、「番兵が利用できる」という趣旨を自然な日本語で表した。ただし、形態上は命令としても理解でき、文脈上も番兵を与える許可か、すでに彼らにいる番兵への言及かが確定しないため、脚注で示した。
- source_word: κουστωδίαν
  choice: 番兵
  rationale: ラテン語由来の語で、見張りに当たる兵または警備隊を指す。文脈に即し、一般読者に明瞭な「番兵」とした。
- source_word: ὑπάγετε
  choice: 行って
  rationale: 移動を命じる複数形の命令を、後続の命令へ自然につなげた。
- source_word: ἀσφαλίσασθε
  choice: 墓を厳重に守らせなさい
  rationale: 目的語は直前まで話題となっている墓を補った。中動態と番兵の文脈を踏まえ、彼ら自身が警備するのでなく、番兵を用いて墓を確保する意味を自然に表した。
- source_word: ὡς οἴδατε
  choice: あなたがたが心得ているとおり
  rationale: 直訳的な「あなたがたが知っているように」の意味を保ち、方法や力量に応じて確実にせよという含みを過度に限定せず表現した。
theological_decisions:
- issue: Ἔχετε κουστωδίαν が、ピラトによるローマ兵の貸与を意味するのか、指導者たちがすでに使える番兵への言及なのか
  choice: 本文では「番兵ならいる」とし、番兵が利用可能であることだけを前景化した
  alternative: 「番兵を連れて行け」または「あなたがたには自分たちの番兵がいる」
  rationale: ギリシア語は命令として番兵を取るよう許可したとも、直説法として利用可能な番兵がいると述べたとも理解できる。歴史的帰属を本文で断定せず、脚注に主要な解釈を残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「番兵ならいる」によって不自然な逐語訳を避けつつ、番兵の所属を本文で断定しないようにした。
