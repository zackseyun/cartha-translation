  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: ja
  text: そして言った。「閣下、人を惑わすあの者が、まだ生きていた時、『三日後に、わたしはよみがえる』と言っていたことを、私たちは思い出しました。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「三日後に、わたしは起こされる」とも訳せる。ギリシア語は現在形で、中動態にも受動態にも解しうる。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: そして言った
  rationale: 前節の主動詞に続く分詞で、発言内容を導入する。日本語では文脈とのつながりを自然に示すため「そして言った」とした。
- source_word: Κύριε
  choice: 閣下
  rationale: ここではピラトへの敬称であり、神的称号ではない。「主よ」よりも場面に即した現代日本語の敬称を選んだ。
- source_word: ἐμνήσθημεν
  choice: 私たちは思い出しました
  rationale: アオリスト形の回想を尊重しつつ、今その記憶を申し出ている文脈に自然な表現とした。
- source_word: ἐκεῖνος ὁ πλάνος
  choice: あの人を惑わす者
  rationale: ἐκεῖνοςの距離を置く響きと、πλάνοςの「人を迷わせる者」という敵対者側の評価を保った。
- source_word: ἔτι ζῶν
  choice: まだ生きていた時
  rationale: その発言が死以前になされたことを簡潔で自然な日本語で示した。
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: 三日後に
  rationale: μετά＋対格の基本的な時間表現「〜の後」を保ち、「三日目に」へ調和させなかった。
- source_word: ἐγείρομαι
  choice: わたしはよみがえる
  rationale: 現在形の生々しさを保ちつつ、復活についての引用として自然な日本語にした。中動・受動の形態的曖昧さは脚注で示す。
theological_decisions:
- issue: 引用された復活予告のἐγείρομαιの態
  choice: 「わたしはよみがえる」と本文で訳す
  alternative: 「わたしは起こされる」「わたしはよみがえらされる」
  rationale: ἐγείρομαιは中動・受動の形が同形であり、この文脈では自動詞的な「よみがえる」が自然である。ただし、神によって起こされるという受動的理解も形態上可能なので、脚注で明示して曖昧さを保存した。
translation_notes:
  register: 現代の一般読者に明瞭で、かつ裁判・行政場面にふさわしい品位ある口調とした。「閣下」はピラトへの世俗的敬称であることを明確にし、「あの人を惑わす者」には話者たちの敵意と距離感を残した。
