  to: そして言った。「閣下、人を惑わすあの者が、まだ生きていた時、『三日後に、わたしはよみがえる』と言っていたことを、私たちは思い出しました。[a]」
  rationale: 安全な修正はπλάνοςを表す句の語順のみである。「人を惑わすあの者」により、話者たちがイエスを距離を置いて侮蔑的に呼んでいることを明瞭にしつつ、「人を惑わす者」という語義を保った。その他の訳文と脚注は原文の時制・態の解釈上の幅を適切に扱っているため維持した。
