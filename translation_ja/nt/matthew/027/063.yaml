  naturalness: 「あの人を惑わす者」は、通常の日本語の続き書きでは「あの人（その人物）を惑わす者」と読まれやすく、話者たちがイエスを「あの惑わす者」と呼ぶ原文の構文と意味を明瞭に表していない。「人を惑わすあの者」とすることで、この曖昧さを解消できる。
  terminology: πλάνοςは敵対者側の侮蔑的な呼称であり、「人を惑わすあの者」は「人を惑わす者」と「あの者」の両方の要素を自然に保つ。「よみがえる」は復活の文脈で標準的な表現であり、脚注の「起こされる」は可能な受動的読みとして適切である。
