  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: ja
  text: そして、イエスの服を脱がせて、緋色のマント[a]を着せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「緋色の外套」または「緋色の上着」とも訳せる。ギリシア語は外衣・マントを指す語。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 物語の連続を示す接続詞として、καίを自然な現代日本語で表した。
- source_word: ἐκδύσαντες αὐτὸν
  choice: イエスの服を脱がせ
  rationale: ἐκδύωの「服を脱がせる、裸にする」という意味を保ちつつ、アオリスト分詞が主動詞に先立つ行為を示すことを日本語の連用形で自然に表した。代名詞は文脈上明確な「イエス」とした。
- source_word: χλαμύδα
  choice: 外套
  rationale: χλαμύςは、兵士や官吏とも関連する短い上着・マントを指し得る。「外套」は衣服の種類を示しながら、王服という解釈を過度に持ち込まない。
- source_word: κοκκίνην
  choice: 緋色の
  rationale: κόκκινοςの鮮やかな赤色を、受難物語にふさわしい明瞭で格調ある日本語として「緋色」と訳した。
- source_word: περιέθηκαν αὐτῷ
  choice: 着せた
  rationale: 衣を人の周りに置くという動作を、現代日本語で最も自然な「着せた」と表した。
theological_decisions:
- issue: 嘲弄の場面で着せられた衣の性質
  choice: 緋色の外套
  alternative: 緋色の上着／緋色のマント
  rationale: 兵士たちがイエスを王に見立てて嘲弄する文脈は保ちつつ、χλαμύςそのものを「王の衣」と解釈的に限定せず、衣服を指す語として訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「緋色」「外套」によって原文の色彩と衣服の種類を簡潔に伝え、文末は物語文として自然な常体にした。
