  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: ja
  text: そして彼らは、ゴルゴタと呼ばれる場所、すなわち「どくろの場所」と呼ばれる所に着いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すなわち、『どくろの場所』という意味である」とも訳せる。ギリシア語の後半は、「ゴルゴタ」という名を説明する句である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: 着いた
  rationale: アオリスト分詞を、文脈上の主動作に自然につながる日本語として表現した。「来ると」も可能だが、目的地への到着を明瞭に示す。
- source_word: τόπον
  choice: 場所
  rationale: τόποςの一般的な意味を、現代日本語で自然に表した。
- source_word: λεγόμενον
  choice: と呼ばれる
  rationale: 名称を示す受動分詞の意味を、そのまま明瞭な日本語にした。
- source_word: Γολγοθᾶ
  choice: ゴルゴタ
  rationale: 地名として慣用的な日本語音写を用いた。
- source_word: ὅ ἐστιν
  choice: すなわち
  rationale: 後続句が「ゴルゴタ」の意味・呼称を説明する注釈であることを、重複を避けつつ示す。より直訳的には「これは……である」。
- source_word: Κρανίου Τόπος
  choice: どくろの場所
  rationale: κρανίουを属格として「どくろの」、τόποςを「場所」と訳した。ギリシア語には冠詞がないため、特定性を過度に加えない表現とした。
- source_word: λεγόμενος
  choice: と呼ばれる所
  rationale: 原文にあるλεγόμενοςの反復を保持し、説明句自体がその場所の呼称であることを示した。日本語での不自然な「場所」の連続を軽減するため、二度目は「所」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「髑髏」は一般読者には読みにくいため、平仮名の「どくろ」を採用した。原文にある「呼ばれる」の反復は、説明的な構文と曖昧さを保つために残した。
