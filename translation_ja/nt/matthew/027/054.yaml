id: MAT.27.54
reference: Matthew 27:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: ja
  text: 百人隊長と、彼と共にイエスを見張っていた者たちは、地震と起こった出来事を見て、非常に恐れ、「まことに、この方は神の子であった[a]」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の子の一人であった」とも訳し得る。ギリシア語の「神の子」には冠詞がないが、この構文とマタイ福音書の文脈では、称号としての「神の子」と読むことができる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: 百人隊長
  rationale: ローマ軍の将校を表す、日本語聖書で定着し一般にも理解できる訳語。
- source_word: οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν
  choice: 一緒にイエスを見張っていた者たち
  rationale: μετ’ αὐτοῦとτηροῦντεςの双方を自然に反映し、処刑場で監視していた集団を示す。
- source_word: ἰδόντες
  choice: 見て
  rationale: 主動詞に先立つ分詞を、日本語で自然な継起・契機として表した。
- source_word: τὸν σεισμὸν
  choice: 地震
  rationale: 受難物語の文脈でσεισμόςが指す通常の意味を採用した。
- source_word: τὰ γενόμενα
  choice: 起こった出来事
  rationale: 地震だけに限定されない複数的・包括的な表現を保つ。
- source_word: ἐφοβήθησαν σφόδρα
  choice: 非常に恐れ
  rationale: σφόδραの強意を明確かつ現代的な日本語で表した。
- source_word: Ἀληθῶς
  choice: まことに
  rationale: 発言の厳粛で強い確信を、過度な解釈を加えずに示す。
- source_word: θεοῦ υἱὸς
  choice: 神の子
  rationale: 無冠詞形の含みを不必要に限定せず、同時にマタイ福音書における称号として自然に読める定着した表現を採用した。
- source_word: οὗτος
  choice: この方
  rationale: 指示代名詞の直接性を保ちつつ、十字架上のイエスを指す発言として自然で dignified な日本語にした。
theological_decisions:
- issue: θεοῦ υἱὸςの定性・不定性
  choice: 神の子
  alternative: 神の子の一人／神的な者
  rationale: ギリシア語には冠詞がないが、述語名詞の無冠詞形だけで不定と断定できず、マタイの物語文脈では称号的・質的な読みが強い。日本語の「神の子」は英語ほど冠詞選択を強制しないため、原文の含みとマタイのキリスト論的響きをともに保てる。別解は脚注で明示する。
- issue: ἦνの時制
  choice: であった
  alternative: だった／である
  rationale: 未完了過去ἦνを素直に過去で表し、話者が死んだイエスを振り返って語る場面性を保った。現在形に変えて神学的意味を補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、受難記事にふさわしい品位を保った。「この方」「まことに」はやや格調を持たせつつ、一般読者にも理解しやすい表現である。
