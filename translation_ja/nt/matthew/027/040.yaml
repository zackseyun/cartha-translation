reference: Matthew 27:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: ja
  text: そしてこう言った。「神殿を壊し、三日で建てる[a]者よ、自分を救え。神の子なら、十字架から降りてこい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「建て直す」。ギリシア語の動詞自体は単に「建てる」だが、この嘲りの文脈では再建することを意味している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: そしてこう言った
  rationale: 前節から続く現在分詞を、日本語の物語として自然な発話導入にした。主語は文脈に委ね、ここでは重ねて明示しない。
- source_word: Ὁ καταλύων
  choice: 壊し…者よ
  rationale: 冠詞付き分詞が呼びかけとして機能しているため、「者よ」と訳し、嘲りの調子を保った。
- source_word: ναός
  choice: 神殿
  rationale: ここではエルサレム神殿を指す自然で定着した訳語であり、「聖所」ほど技術的に限定しない。
- source_word: ἐν τρισὶν ἡμέραις
  choice: 三日で
  rationale: 期間内の成就を表す簡潔で自然な日本語とし、嘲りの言葉の簡明さを保った。
- source_word: οἰκοδομῶν
  choice: 建てる
  rationale: 原語は単に「建てる」を意味するため、文脈から推測できる「建て直す」を本文に織り込まず、脚注で示した。
- source_word: σῶσον σεαυτόν
  choice: 自分を救ってみろ
  rationale: 命令の内容は「自分を救え」だが、「てみろ」によって、この場面の挑発的な命令の語気を自然な日本語で表した。
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: 神の子なら
  rationale: 条件文とキリスト論的称号を簡潔に保ち、嘲る者たちの挑戦として訳した。
- source_word: κατάβηθι ἀπὸ τοῦ σταυροῦ
  choice: 十字架から降りてこい
  rationale: 高い所にいる相手への直接の命令として「降りてこい」が自然であり、σταυρόςは受難記事で定着した「十字架」とした。
theological_decisions:
- issue: 嘲りの文脈における υἱὸς τοῦ θεοῦ の訳し方
  choice: 神の子
  alternative: 神の御子
  rationale: 称号の内容を弱めたり説明を加えたりせず、現代日本語で透明な「神の子」とした。話者がその真実性を疑う挑発の文脈は、条件表現「なら」によって保持される。
- issue: οἰκοδομῶν に再建の意味を明示するか
  choice: 建てる
  alternative: 建て直す
  rationale: 神殿を壊した後という文脈上は再建が含意され得るが、動詞自体は「建てる」であるため、本文では原語の表現を保ち、解釈的な補足は脚注に置いた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、公開の嘲りにふさわしい鋭い命令調を保った。「者よ」はやや荘重だが、冠詞付き分詞による直接の呼びかけを簡潔に再現する。
