  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: ja
  text: ヨセフは遺体を受け取り、清潔な亜麻布[a]で包んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「清潔な亜麻の覆い」。この語は、埋葬に用いる亜麻布を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: 受け取り
  rationale: アオリスト分詞で、主動詞に先立つ行為を表す。直前の文脈でピラトから引き渡された遺体を受領する場面なので、現代日本語では「受け取り」が自然である。
- source_word: τὸ σῶμα
  choice: 遺体
  rationale: 語義は「体」だが、埋葬の文脈では亡くなったイエスの体を指すため、「遺体」が明確で自然である。原文に所有表現はないので「イエスの遺体」とは補わない。
- source_word: ἐνετύλιξεν
  choice: 包んだ
  rationale: ἐντυλίσσωは布などで包む、くるむことを表す。埋葬場面に合い、簡潔で自然な訳である。
- source_word: αὐτό
  choice: 明示せず
  rationale: 中性単数代名詞でτὸ σῶμαを受ける。日本語では目的語を繰り返さず省略するのが自然であり、「遺体を受け取り……包んだ」で指示関係も明瞭である。
- source_word: σινδόνι
  choice: 亜麻布
  rationale: σινδώνは亜麻製の布を指し、この文脈では埋葬用の布として用いられている。「亜麻布」は材質を保ちつつ、「遺体を包む布」や「覆い」のように用途を原語以上に限定しない。
- source_word: καθαρᾷ
  choice: 清潔な
  rationale: ここでは布の状態を表すため、儀礼的・道徳的な含みを強め得る「清い」よりも「清潔な」が文脈に即している。
- source_word: καί
  choice: 独立した接続語としては訳さず
  rationale: 日本語では節頭の「そして」を置かなくても前後の物語的連続が自然に伝わる。意味上の順序は「受け取り、……包んだ」という接続で保持した。
