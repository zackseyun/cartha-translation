  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: ja
  text: そして、彼を縛った後、連れて行き、総督ピラトに引き渡した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δήσαντες
  choice: 縛って
  rationale: δέωのアオリスト能動分詞。後続する主要動詞に先立つ行為を表し、イエスを実際に拘束したことを、現代日本語の自然な連続表現で示す。
- source_word: ἀπήγαγον
  choice: 連れて行き
  rationale: ἀπάγωの「連れて行く、引いて行く」という意味を、拘束下で移送する文脈に即して明瞭に表す。
- source_word: παρέδωκαν
  choice: 引き渡した
  rationale: 他者の支配・権限のもとへ渡すという司法的、拘禁上の意味を明確にしつつ、受難物語における神学的含意を説明的に限定しない。
- source_word: Πιλάτῳ
  choice: ピラトに
  rationale: 人名を現代日本語で定着した形に音写し、与格を受け手を示す「に」で表す。
- source_word: τῷ ἡγεμόνι
  choice: 総督
  rationale: 統治官を指す広い語であり、ピラトの歴史的官職を原文以上に細かく限定せず、一般読者にも通じる標準的な訳語を用いる。
- source_word: καὶ ... καὶ
  choice: そして…て…き
  rationale: 冒頭のκαίによる物語の連続を「そして」で保ち、後のκαίは日本語として自然な連用形で一連の行為を結ぶ。
theological_decisions:
- issue: 受難物語におけるπαραδίδωμιの訳し方
  choice: 引き渡した
  alternative: 渡した／委ねた
  rationale: この箇所では、イエスがピラトの権限下に置かれたという直接の司法的意味を前面に出す。同時に、動詞が受難物語全体で帯びる神学的な響きを説明語で解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難記事にふさわしい簡潔で品位ある叙述とした。主語は直前の文脈から明らかなため補わず、原文の簡潔さを保った。
