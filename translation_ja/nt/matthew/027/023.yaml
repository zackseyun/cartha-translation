base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: ja
  text: しかし、彼は言った。「いったい、彼がどんな悪事をしたというのか。」ところが、人々はますます激しく叫び続けた。「十字架につけよ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: 言った
  rationale: アオリストを、物語における自然な発話導入として簡潔に訳した。主語は直前の文脈でピラトを指すが、この節のギリシア語どおり「彼」とした。
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: いったい、彼がどんな悪事をしたというのか
  rationale: γάρを日本語の問いに自然な強調「いったい」で表し、κακόνの道徳的・法的な重みを「悪事」で保った。「したというのか」により、非難の根拠を問い返す響きを表した。
- source_word: περισσῶς
  choice: ますます激しく
  rationale: 直前より反応が強まる比較的・増幅的な意味を「ますます」で示し、叫びの激しさを自然な日本語で表した。音量だけに限定しない。
- source_word: ἔκραζον
  choice: 叫び続けた
  rationale: 未完了過去の継続・反復的な側面を「続けた」で表した。
- source_word: λέγοντες
  choice: （独立した直接話法として処理）
  rationale: 日本語では「言って」を重ねるより、叫んだ内容をそのまま引用するほうが自然であり、同時性と内容は保たれる。
- source_word: Σταυρωθήτω
  choice: 十字架につけろ
  rationale: 三人称受動命令の要求を、群衆の叫びとして自然で強い現代日本語の命令表現にした。形式的には「十字架につけられよ」も可能だが、現代日本語では不自然で、要求の直接性が弱まる。
- source_word: ὁ δὲ ... οἱ δὲ
  choice: しかし、彼は……ところが、人々は……
  rationale: 二つのδέが示す展開と対照を、単調な反復を避けつつ「しかし」「ところが」で明確にした。複数冠詞のみで示される群衆側は、文脈に即して「人々」とした。
theological_decisions:
- issue: 群衆の十字架刑要求を受動形のまま訳すか
  choice: 十字架につけろ
  alternative: 十字架につけられよ
  rationale: 原文は受動命令だが、日本語の「つけられよ」は現代の群衆の叫びとして著しく不自然である。「十字架につけろ」は執行を要求する意味と命令の激しさを正確に伝え、誰が執行するかを本文以上に特定しない。
- issue: ピラトの問いにおけるκακόνの強さ
  choice: 悪事
  alternative: 悪いこと／どんな罪
  rationale: 「悪事」はκακόνの否定的な道徳性を保つ一方、「罪」と訳して法的有罪や特定の神学概念を原文以上に持ち込むことを避ける。
translation_notes:
  register: 明瞭で現代的かつ荘重さを保つ叙述。ピラトの問いは理性的な反問として、群衆の応答は継続し激化する叫びとして対照的に表現した。注記を必要とするほどの本文異読や不可避の曖昧さはないため、脚注は設けていない。
