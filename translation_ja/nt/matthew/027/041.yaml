  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: ja
  text: 同じように[a]、祭司長たちも、律法学者たちと長老たちとともにイエスをあざけり、こう言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同様に」とも訳せる。
    reason: ὁμοίωςの簡潔な別訳。直前のあざけりとの対応を同じく表す。
lexical_decisions:
- source_word: ὁμοίως
  choice: 同じように
  rationale: 直前に描かれた人々のあざけりと対応することを示す副詞。比較の意味を保ちながら、現代日本語として自然である。
- source_word: καὶ
  choice: も
  rationale: 祭司長たちも先に登場した者たちと同じくあざけった、という付加の意味を表す。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 当時の主要な祭司権威者たちを指す福音書での定訳であり、複数の大祭司職保持者を意味するとの誤解を避ける。
- source_word: ἐμπαίζοντες
  choice: イエスをあざけり
  rationale: 侮辱を伴う嘲弄を表す。目的語の「イエス」は直前の文脈から明白なので補った。分詞の付帯的な働きを連用形で自然に表現した。
- source_word: μετὰ
  choice: とともに
  rationale: 属格を伴い、律法学者たちと長老たちが行為に加わったという共同・同伴を示す。単なる居合わせではないことを自然に表す。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 福音書の文脈において、律法の専門家としての社会的・宗教的役割を明瞭に伝える日本語の定訳。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: 単に年長の男性ではなく、共同体の公認された指導者たちを指す制度的な意味を保つ。
- source_word: ἔλεγον
  choice: こう言っていた
  rationale: 未完了過去の継続的な様相を保ち、次節に続く発言を導入する日本語として自然である。
theological_decisions:
- issue: あざけりに加わった者たちの範囲
  choice: 祭司長たち、律法学者たち、長老たちがともにイエスをあざけったと訳す。
  alternative: 祭司長たちが、律法学者たちや長老たちのいるところであざけった、と緩やかに解する余地。
  rationale: μετὰ＋属格はここでは行為への共同参加を示すのが最も自然である。ただし、本文以上の動機や神学的評価は付け加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の分詞構文は日本語の連用形で表し、未完了過去は「言っていた」とした。次節へ続く導入であることを「こう」によって示した。
