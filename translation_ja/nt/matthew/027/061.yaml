  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: ja
  text: そこには、マグダラのマリアともう一人のマリアが、墓の向かいに座っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: そこには……いた
  rationale: 二人の人物がその場所にいたことを、後置された複合主語に合わせて自然な日本語で表した。δὲは弱い叙述上の接続であり、この一節では独立した接続語を置かなくても流れが保たれる。
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: マグダラのマリア
  rationale: 日本語聖書で広く理解される自然な固有名表記で、マグダラに結び付く呼称も保持する。
- source_word: ἡ ἄλλη Μαρία
  choice: もう一人のマリア
  rationale: 先に挙げられたマグダラのマリアとは別のマリアであることを、自然かつ明確に示す。
- source_word: καθήμεναι
  choice: 座っていた
  rationale: 女性複数主語の姿勢を示す現在分詞を、主動詞と合わせて継続的な場面描写として表した。
- source_word: ἀπέναντι τοῦ τάφου
  choice: 墓の向かいに
  rationale: 墓と向かい合う位置関係を簡潔に示す。τάφοςはこの埋葬場面では「墓」が自然である。
