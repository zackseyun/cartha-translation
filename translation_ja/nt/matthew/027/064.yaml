source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: ja
  text: ですから、三日目まで墓を厳重に確保するよう命じてください。弟子たちが来て[a]彼を盗み出し、人々に『彼は死者の中からよみがえらされた』[b]と言い出すといけません。そうなれば、最後の欺きは初めのものよりもひどくなります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本には「来て」の後に「夜に」があり、「弟子たちが夜に来て彼を盗み出し」となっています。ここでは短い読みを採用しています。
    reason: textual_variant
  - marker: b
    text: 「よみがえらされた」はギリシア語の受動態を反映しています。「よみがえった」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: 命じてください
  rationale: ピラトの公的権限による決定的な措置を求めるアオリスト命令法を、自然な敬語表現で示す。
- source_word: οὖν
  choice: ですから
  rationale: 直前の発言を根拠とする推論・帰結を、明確かつ自然に示す。
- source_word: ἀσφαλισθῆναι τὸν τάφον
  choice: 墓を厳重に守る
  rationale: 墓を安全・確実な状態にするという受動不定詞の意味を、この文脈で自然に表す。具体的手段は本文では限定しない。
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: 三日目まで
  rationale: 復活予告と結び付く時の表現を簡潔に保つ。
- source_word: μήποτε
  choice: 〜といけません
  rationale: 話者が危惧し、防止しようとしている可能性を現代日本語で自然に表す。
- source_word: κλέψωσιν αὐτόν
  choice: 彼を盗み出し
  rationale: 目的語が『遺体』ではなく人称代名詞『彼』であることを保ちつつ、墓から持ち去る文脈を自然に示す。
- source_word: τῷ λαῷ
  choice: 人々に
  rationale: その場の群衆だけでなく民一般を指し得る語義を保つ。
- source_word: Ἠγέρθη
  choice: よみがえらされた
  rationale: アオリスト受動態を保持し、誰がよみがえらせたかは明示しない。
- source_word: ἀπὸ τῶν νεκρῶν
  choice: 死者の中から
  rationale: 複数形の表現を反映し、死者たちの中から起こされたという原文の像を保つ。
- source_word: ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης
  choice: 最後の欺きは初めのものよりもひどくなります
  rationale: 比較構文を明確に示しつつ、『初めの欺き』の具体的内容を訳文で特定しない。
theological_decisions:
- issue: 復活についての主張を受動態で訳すか
  choice: 彼は死者の中からよみがえらされた
  alternative: 彼は死者の中からよみがえった
  rationale: Ἠγέρθη は受動態であり、神を暗黙の行為者として含み得る新約聖書の復活表現を保つ。ただし、行為者を本文以上に明示しない。
- issue: 『最後の欺き』と『初めのもの』の指示対象
  choice: 説明を加えず原文の比較を保持する
  alternative: 初めの欺きをイエスの生前の主張などと明示する
  rationale: 原文は両者の具体的内容を明言していないため、その曖昧さを維持する。
translation_notes:
  register: 現代の一般読者に分かりやすい丁寧な話し言葉としつつ、祭司長たちが総督ピラトに願い出る場面にふさわしい品位を保った。脚注記号は、それぞれ関係する本文箇所の直後に置く。
