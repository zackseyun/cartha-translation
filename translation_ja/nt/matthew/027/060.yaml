  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: ja
  text: そして、その遺体を、岩に掘り抜いて造った自分の新しい墓に納めた。それから、墓の入り口[a]まで大きな石を転がし、立ち去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「墓の戸口」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: その遺体を…納めた
  rationale: 直訳は「それを置いた」だが、直前の文脈で指すものはイエスの遺体である。埋葬の場面にふさわしい自然で品位ある日本語として「遺体を納めた」とした。
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: 自分の新しい墓に
  rationale: μνημεῖονはこの文脈では岩を掘った埋葬用の墓を指す。καινόςの明示的な意味「新しい」を保ち、「未使用」とまでは訳文に加えない。αὐτοῦは所有を示すため「自分の」とした。
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: 岩に掘っておいた
  rationale: λατομέωは岩を切り掘ることを表す。墓があらかじめ造られていたことが日本語で自然に伝わるよう「掘っておいた」とした。
- source_word: προσκυλίσας λίθον μέγαν
  choice: 大きな石を転がして置き
  rationale: προσκυλίωの転がす動作と、アオリスト分詞が主動詞に先立つ動作を示すことを表現した。「置き」を添えて、石を入り口まで転がして据えた状況を自然に示した。
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: 墓の入り口
  rationale: θύραは「戸口」「入り口」の両義を持つ。岩を掘った墓について現代の読者が蝶番の付いた扉を想像しないよう「入り口」を本文に採用し、原語に近い別訳を脚注に示した。
- source_word: ἀπῆλθεν
  choice: 立ち去った
  rationale: その場所から去ったという簡潔な物語上の動きを、自然で品位ある現代日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、埋葬記事にふさわしい簡潔さと品位を保った。二つのκαίは「そして」「それから」で物語の順序を示した。
