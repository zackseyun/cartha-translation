  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: ja
  text: その時、イエスと一緒に二人の強盗[a]が十字架につけられた。一人は右に、一人は左にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「盗賊」。ギリシア語は暴力を伴う強盗を指し、文脈によっては反乱活動にかかわる者を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を示す時間表現。現代日本語として自然で簡潔に訳した。
- source_word: σταυροῦνται
  choice: 十字架につけられた
  rationale: 現在受動形だが、歴史的現在として物語を生き生きと描く用法。日本語では過去形が自然であり、受動の意味を保持した。
- source_word: σὺν αὐτῷ
  choice: イエスと一緒に
  rationale: σύν＋与格が表す同伴を明確にした。日本語では代名詞だけより指示対象を明示するほうが読みやすい。
- source_word: δύο λῃσταί
  choice: 二人の強盗
  rationale: λῃστήςは暴力を伴う強盗や追いはぎを指し得る。政治的反乱者と限定せず、本文が直接示す範囲で訳した。
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: 一人は右に、一人は左にいた
  rationale: 左右の位置を示す慣用表現として、自然で明瞭な日本語にした。文末の「いた」は日本語で位置関係を滑らかに示す補足である。
theological_decisions:
- issue: λῃσταίの人物像
  choice: 「強盗」と訳し、政治的意味を限定しない
  alternative: 「盗賊」「反乱者」
  rationale: 語は暴力的な盗賊を指し、文脈によっては反乱活動との重なりもあり得るが、この節だけでは「反乱者」と特定できないため。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。歴史的現在は日本語の自然な物語時制に合わせて過去形とし、語義上の幅は脚注に残した。
