id: MAT.27.22
reference: Matthew 27:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: ja
  text: ピラトは彼らに言った。「では、メシアと呼ばれているイエスを、私はどうすればよいのか。」彼らは皆、「十字架につけろ」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: では、私はどうすればよいのか
  rationale: ποιήσω は熟慮を表す問いに用いられたアオリスト接続法であり、「どうすればよいのか」とすることで、単純な未来ではなく判断を求める問いを自然な日本語で表した。οὖν は文脈上の帰結を示す「では」とした。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 人名として、日本語聖書で広く定着した慣用表記を用いた。
- source_word: τὸν λεγόμενον χριστόν
  choice: メシアと呼ばれているイエス
  rationale: λεγόμενον の現在受動分詞の継続的・帰属的な意味を「呼ばれている」で表した。χριστόν はここでは名の一部というより称号として機能するため、その意味が伝わる「メシア」とした。
- source_word: λέγουσιν πάντες
  choice: 彼らは皆、…と言った
  rationale: 歴史的現在 λέγουσιν は、日本語の物語として自然な過去形「言った」で表し、πάντες の集団全体を示す力を「皆」で保持した。
- source_word: Σταυρωθήτω
  choice: 十字架につけろ
  rationale: 三人称単数のアオリスト受動命令の要求を、群衆の直接的で激しい発言として自然な日本語の命令表現にした。「十字架につけられよ」では受動形を形式的に保てるが、現代日本語の発話として不自然である。
theological_decisions:
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: 「…と呼ばれている」という構文では称号としての意味が前面に出るため、「油注がれた者」というユダヤ的・救済史的背景を伝える「メシア」を本文に採用した。「キリスト」は伝統的な音写だが、ここでは固有名の一部と誤解されやすい。
translation_notes:
  register: 明瞭で現代的ながら、裁判場面の緊張と品位を保つ文体とした。ピラトの問いは「私は」を明示して原文の一人称を自然に示し、群衆の返答は簡潔で強い命令口調とした。英語相談層の脚注 [a] は、英語本文中の位置と内容が不整合であり、また日本語本文では Χριστός を「メシア」と訳す判断を本文に直接反映できるため採用しなかった。
