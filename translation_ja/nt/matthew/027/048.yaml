  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: ja
  text: するとすぐに、彼らのうちの一人が走って行き、海綿を取り、酸いぶどう酒[a]を含ませて葦に付け、イエスに飲ませていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「酢」とも訳せる。ギリシア語は、酸味のあるぶどう酒またはぶどう酒酢を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: すぐに
  rationale: 行動の即時性を、現代日本語の自然な物語表現で伝える。
- source_word: δραμὼν
  choice: 走って行き
  rationale: アオリスト分詞を後続する一連の動作に自然につなげ、切迫した動きを保つ。
- source_word: εἷς ἐξ αὐτῶν
  choice: 彼らのうちの一人
  rationale: 部分を表すギリシア語表現を明確かつ自然に訳した。
- source_word: λαβὼν σπόγγον
  choice: 海綿を取り
  rationale: σπόγγοςを、当時用いられた天然のスポンジを指す「海綿」とした。
- source_word: πλήσας τε ὄξους
  choice: それに酸いぶどう酒をたっぷり含ませ
  rationale: 液体を海綿に満たす動作を日本語として自然に表し、ὄξοςを飲用され得る酸味の強いぶどう酒として訳した。
- source_word: περιθεὶς καλάμῳ
  choice: 葦の棒に付けて
  rationale: κάλαμοςの基本義「葦」を保ちつつ、道具として使う棒であることを明瞭にした。
- source_word: ἐπότιζεν αὐτόν
  choice: イエスに飲ませようとした
  rationale: 未完了過去の進行・試行的な含みを自然な日本語で示す。単に飲み物を差し出すのではなく、飲ませる行為を表す。
theological_decisions:
- issue: イエスに与えられた飲み物の性質
  choice: 酸いぶどう酒
  alternative: 酢
  rationale: ὄξοςは酸味を帯びたぶどう酒またはぶどう酒酢を指し得る。「酸いぶどう酒」は飲料としての実態を伝え、「酢」が現代の調味料だけを連想させることを避ける。
- issue: ἐπότιζενが示す行為の成否・継続性
  choice: 飲ませようとした
  alternative: 飲ませた／飲ませ続けた
  rationale: 未完了過去の進行または試行のニュアンスを保持しつつ、実際に飲んだと断定しない。文脈上の緊張を不用意に解消しない訳とした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「海綿」「葦」は原文の具体物を保ち、「葦の棒」として読者に用途が伝わるようにした。
