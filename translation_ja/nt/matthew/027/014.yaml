lexical_decisions:
- source_word: καὶ
  choice: しかし
  rationale: 文脈上、総督の問いかけや訴えに対して答えなかったという対照を自然な日本語で示す。
- source_word: οὐκ ἀπεκρίθη αὐτῷ
  choice: イエスは総督に……答えなかった
  rationale: ἀπεκρίθηはここでは「答えた」の意味。省略された主語と代名詞の指示対象を文脈に即して明示し、単独でも理解しやすくした。
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: 一言も
  rationale: 強い否定を伴うοὐδὲ ἓνとῥῆμαの基本義を、簡潔で自然な日本語にした。訴えの一項一項を指す可能性は脚注に残した。
- source_word: ὥστε
  choice: ので
  rationale: 総督の驚きがイエスの沈黙の結果であったことを、自然な因果・結果表現で示す。
- source_word: τὸν ἡγεμόνα
  choice: 総督
  rationale: ローマ属州の統治者であるピラトを指す文脈に最も適切な行政称号。
- source_word: θαυμάζειν ... λίαν
  choice: 非常に驚いた
  rationale: θαυμάζεινの驚嘆とλίανの強い程度を、現代日本語で明瞭に表す。
