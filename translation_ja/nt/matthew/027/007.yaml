id: MAT.27.7
reference: Matthew 27:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: ja
  text: そこで彼らは相談の上、その銀貨で[a]「陶器師の畑」を買い、よそから来た人々[b]の墓地とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「それらから」。直前に出てくる銀貨を指す。
    reason: lexical_alternative
  - marker: b
    text: 「外国人」または「よそ者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον δὲ λαβόντες
  choice: そこで彼らは相談の上
  rationale: 分詞構文の「協議した後／協議の上」という意味を、物語の自然な続きとして表した。δὲは強い逆接ではなく、ここでは文脈を進める接続として「そこで」とした。
- source_word: ἠγόρασαν
  choice: 買い
  rationale: ἀγοράζωのアオリストを、現代日本語で自然な「買う」とした。後続の目的と滑らかにつなぐため連用形を用いた。
- source_word: ἐξ αὐτῶν
  choice: その銀貨で
  rationale: 直訳は「それらから」だが、中性複数代名詞は直前の銀貨を指す。日本語では指示対象と手段を明示する「その銀貨で」が自然である。
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: 「陶器師の畑」
  rationale: 属格を自然な所有・関係表現として訳した。物語中で土地を指し示す呼称になっているため、括弧を付した。
- source_word: εἰς ταφὴν
  choice: 墓地とした
  rationale: εἰςが示す用途・目的を、日本語で簡潔かつ明瞭に表した。
- source_word: τοῖς ξένοις
  choice: よそから来た人々の
  rationale: ξένοςは外国人、よそ者、滞在者などを指し得る。「よそから来た人々」は非地元者という文脈上の意味を自然に伝えつつ、民族的な外国人だけに限定しない。
theological_decisions:
- issue: αὐτῶνの指示対象
  choice: 直前に言及された銀貨を指すものとして「その銀貨で」と訳す。
  alternative: 代名詞の形をより直接に残して「それらで」とする。
  rationale: 直前の文脈と中性複数形から銀貨が指示対象であることは明らかで、日本語では明示した方が誤解がない。
- issue: ξένοιςが指す人々の範囲
  choice: 民族的な外国人に限定せず、「よそから来た人々」とする。
  alternative: 「外国人」または「見知らぬ人々」とする。
  rationale: 原語は外国人だけでなく、土地の外から来た者やよそ者も意味し得るため、その幅を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい簡潔で落ち着いた調子にした。「よそから来た人々」によってξένοςの意味範囲を不必要に狭めないようにした。
