  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: ja
  text: すると、見よ、神殿の垂れ幕[a]が上から下まで真二つに裂け、地が揺れ、岩々が割れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所の垂れ幕」とも訳せる。ここで「神殿」と訳したギリシア語は、神殿域全体ではなく、より狭く聖所を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: すると見よ
  rationale: 場面の急展開と読者の注意を促す劇的な力を保つ。「見よ」は現代語ではやや荘重だが、受難叙述の厳粛さに適している。接続詞 καί は「すると」に含めた。
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: 神殿の垂れ幕
  rationale: καταπέτασμα は神殿内部の仕切りとなる幕を指しうる。「垂れ幕」は現代日本語で具体像が伝わりやすく、ναός の聖所という限定的な意味合いは脚注で示す。
- source_word: ἐσχίσθη
  choice: 裂け
  rationale: 布に自然な動詞を用い、受動形の出来事性を日本語で簡潔に表した。行為者は明示せず、原文の含みを保つ。
- source_word: ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: 上から下まで真二つに
  rationale: 裂けた方向と結果を自然な日本語で明確に表す。「真二つ」は εἰς δύο の強い視覚的効果を伝える。
- source_word: ἡ γῆ ἐσείσθη
  choice: 地が揺れ
  rationale: γῆ は「地」「大地」「土地」の幅を持つ。ここでは宇宙的なしるしとも局地的な地震とも取りうる広がりを残すため、「地」とした。
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: 岩々が割れた
  rationale: πέτραι はこの地震描写では小石より岩塊を示す「岩」が自然。同じ σχίζω でも、日本語では布に「裂ける」、岩に「割れる」を用いるのが自然である。複数形は「岩々」で反映した。
theological_decisions:
- issue: 神殿のしるしの意味
  choice: 神殿の垂れ幕が裂けた出来事を記述するにとどめ、その象徴的意味を本文に加えない。
  alternative: 神への接近の道が開かれたこと、または神殿への裁きを明示する。
  rationale: この節自体は出来事を報告するだけで、その神学的意味を説明していない。解釈を本文に織り込まず、原文の神学的緊張を保つ。
- issue: 裂いた主体
  choice: 日本語の自動詞「裂けた」を用い、主体を明示しない。
  alternative: 「神によって裂かれた」など、神を明示的な行為者とする。
  rationale: ギリシア語の受動形が神的受動態である可能性はあるが、行為者は本文に明記されていないため、その含みを保持する。
- issue: 地の揺れの範囲
  choice: 「地」と訳し、全地球規模か周辺地域かを限定しない。
  alternative: 「大地」または「その土地」として範囲を解釈する。
  rationale: γῆ の語義範囲と文脈上の壮大さを保ちつつ、出来事の地理的範囲を訳文で確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」で原文の劇的で厳粛な注意喚起を保持した。三つの出来事を読点で連ね、原文の畳みかけるリズムを再現した。
