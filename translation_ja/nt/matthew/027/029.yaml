id: MAT.27.29
reference: Matthew 27:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: ja
  text: 彼らは、いばらで冠を編んでイエスの頭にかぶせ、その右手に葦の棒を持たせた。そして、イエスの前にひざまずき、「ユダヤ人の王[a]、万歳！」と言って、イエスをあざけった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々の王」。ギリシア語は、ユダヤ人全般を指すことも、ユダヤ地方の人々を指すこともある。ここでは、イエスをあざける王号として使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: 編んで
  rationale: アオリスト分詞が主動詞に先立つ動作を表す。日本語では「編んで」と続けることで、冠を作ってから頭に載せたという自然な順序を示せる。
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: いばらで冠
  rationale: στέφανος は花輪や勝利の冠も指しうるが、ここでは王権をあざける場面なので「冠」が適切。ἐξ ἀκανθῶν は材料を表すため「いばらで」とした。
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: イエスの頭にかぶせ
  rationale: 直訳的な「頭の上に置いた」よりも、冠について自然な現代日本語であり、行為の具体像を保つ。代名詞は指示対象を明確にするため「イエス」とした。
- source_word: κάλαμον ἐν τῇ δεξιᾷ αὐτοῦ
  choice: その右手に葦の棒を持たせた
  rationale: κάλαμος の具体的な素材を「葦」として残しつつ、手に持つ物として分かりやすい「葦の棒」とした。王笏に見立てた物だが、本文では明示されないため「王笏」とは訳さない。
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: イエスの前にひざまずき
  rationale: 偽りの臣従を演じる姿勢を、簡潔で自然な日本語によってそのまま表した。
- source_word: ἐνέπαιξαν αὐτῷ
  choice: イエスをあざけった
  rationale: 単なる冗談ではなく、侮辱を伴う嘲弄であることを、厳粛な物語文に合う「あざけった」で表した。
- source_word: Χαῖρε
  choice: 万歳
  rationale: 通常の挨拶にもなりうる語だが、ここでは王に対する儀礼的な歓呼をまねた皮肉な呼びかけ。「万歳」は日本語で王への歓呼と嘲弄の両方を自然に伝える。
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: 呼格を「王」と「万歳」の語順で自然に表した。Ἰουδαίων には地域的な「ユダヤ地方の人々」という含みもありうるが、受難物語における王号・罪状としては「ユダヤ人」が最も自然で広く理解される。
theological_decisions:
- issue: 兵士たちの歓呼に含まれる王権の主張と皮肉
  choice: 「ユダヤ人の王、万歳！」
  alternative: 「ごきげんよう、ユダヤ人の王よ！」
  rationale: Χαῖρε の挨拶としての意味を保ちながら、この場面で演じられている王への公式な敬礼と、その嘲弄的な反転を「万歳」で伝える。語り手がその王号を否定しているとも肯定しているとも訳文で説明せず、物語上の緊張を残した。
- issue: Ἰουδαίων の範囲
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: この語は民族・宗教的集団と地域住民の双方を指しうる。本文ではイエスに対する王号として用いられており、「ユダヤ人」が自然だが、地域的理解の可能性は脚注で示した。
translation_notes:
  register: 現代の一般読者が無理なく読める、簡潔で dignified な物語文とした。「葦の棒」で具体像を保ち、「王笏」と説明的に訳すことは避けた。嘲弄の場面であることは動作と「あざけった」によって明示し、王号そのものに解釈を付け加えていない。
