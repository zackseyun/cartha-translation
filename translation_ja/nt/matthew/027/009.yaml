  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: ja
  text: その時、預言者エレミヤを通して語られたことが成就した[a]。こう言われている。「彼らは銀貨三十枚、すなわち、イスラエルの子らの中から彼らが値を付けた、値を付けられた者の代価を受け取った[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: マタイはこの預言の言葉をエレミヤに帰している。文言はゼカリヤ11章12～13節に最も近い。この点については、複合引用、エレミヤを代表名とする預言書群への言及、本文伝承上の問題など、さまざまな説明がある。
    reason: textual_variant
  - marker: b
    text: 直訳すると、この句は「彼らがイスラエルの子らから値を付けた者」とも取れる。ギリシア語の表現は難解で、「イスラエルの子らの中から」という部分的な意味を認める解釈のほか、「イスラエルの子らによって」と理解する解釈もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の時間的な進行を示す副詞として、簡潔で自然な日本語にした。
- source_word: ἐπληρώθη
  choice: 成就した
  rationale: マタイに特徴的な成就句を保ち、預言された事柄が実現したという意味を表した。ギリシア語の受動形は、日本語では慣用的な自動詞表現にした。
- source_word: τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου
  choice: 預言者エレミヤを通して語られたこと
  rationale: διά＋属格の媒介の意味を「通して」で表し、本文にあるエレミヤへの帰属を変更せず保持した。
- source_word: ἔλαβον
  choice: 彼らは…受け取った
  rationale: 引用元との文脈では「受け取った」が自然であり、主語が明示されない三人称複数も「彼ら」として保った。
- source_word: τὰ τριάκοντα ἀργύρια
  choice: 銀貨三十枚
  rationale: 銀による貨幣を指すため、現代日本語で明瞭な「銀貨」とした。
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: 値を付けられた者の代価
  rationale: τιμήの商取引上の意味を「代価」で示し、同根のτιμάωとの語の連関を「値を付ける」で保った。
- source_word: ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ
  choice: イスラエルの子らが値を付けた者の代価
  rationale: 難解な構文を日本語として読める形に整えつつ、「イスラエルの子ら」と価格評価との関係を示した。ἀπόの働きには不確かさがあるため脚注を付した。
theological_decisions:
- issue: 引用がエレミヤに帰される一方、文言がゼカリヤ11章12–13節に最も近いこと
  choice: 本文どおり「預言者エレミヤ」を保持する
  alternative: ゼカリヤに変更する、または預言者名を省く
  rationale: SBLGNTの本文を翻訳し、帰属上の緊張を調和させず、説明は脚注に置いた。
- issue: τοῦ τετιμημένουとὃν ἐτιμήσαντοにおけるτιμάωの反復
  choice: 両方を「値を付ける」で表す
  alternative: 「評価された者」「尊ばれた者」などと訳し分ける
  rationale: 金銭的な文脈と原文の語の反復および皮肉を保持するため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、預言引用にふさわしい格調を保った。「イスラエルの子ら」はυἱῶνの形を見えるように残し、難解なἀπὸ υἱῶν Ἰσραήλは本文で過度に断定せず脚注で代案を示した。
