revisions:
- from: その時、預言者エレミヤを通して語られたことが成就した[a]。こう言われている。「彼らは銀貨三十枚を受け取った。それは、値を付けられた者の代価、イスラエルの子らが値を付けた者の代価である[b]。」
  to: その時、預言者エレミヤを通して語られたことが成就した[a]。こう言われている。「彼らは銀貨三十枚、すなわち、イスラエルの子らの中から彼らが値を付けた、値を付けられた者の代価を受け取った[b]。」
  rationale: 引用後半を、τιμάωの反復を「値を付ける」で保ちながら、一つの「代価」に対応する修飾節として整えた。ἀπὸ υἱῶν Ἰσραήλについては、本文で「中から」という可能な理解を採り、脚注で他の構文理解を明示して、争いのある曖昧さを解消しないようにした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:56Z'
