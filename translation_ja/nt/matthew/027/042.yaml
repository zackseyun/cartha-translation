  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: ja
  text: 「他の者は救った。自分は救えない。イスラエルの王だ。今すぐ十字架から降りてみろ。そうすれば、われわれも彼を信じる。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もしイスラエルの王なら、今すぐ十字架から降りてみろ。そうすれば、われわれも彼を信じる。」原文は「もし」に当たる語を用いず、「イスラエルの王である」と直接述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: ほかの人々
  rationale: 対格複数を名詞的に用いた表現。自分との嘲りの対比を明確にし、現代日本語として自然にした。
- source_word: ἔσωσεν / σῶσαι
  choice: 救った／救えない
  rationale: σῴζωの救出・癒やし・救済にまたがる意味の広がりを保つため、同じ語根を「救う」で統一した。
- source_word: ἑαυτὸν
  choice: 自分
  rationale: ほかの人々とイエス自身との対比を簡潔に示す。
- source_word: οὐ δύναται σῶσαι
  choice: 救えない
  rationale: 能力を否定する嘲りを、簡潔で力のある現代日本語で表した。
- source_word: βασιλεὺς Ἰσραήλ
  choice: イスラエルの王
  rationale: 明示的な条件文にせず、ギリシア語の称号を直接述べる形を保持した。
- source_word: καταβάτω
  choice: 降りてみろ
  rationale: 三人称命令の挑発的な力を、日本語の直接話法における自然な嘲りとして表した。「降りよ」より現代的で、「降りてください」より文脈に適合する。
- source_word: νῦν
  choice: 今すぐ
  rationale: 要求の即時性と挑発の強さを自然に示す。
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: 十字架から
  rationale: 文脈上明確で定着した訳語を用いた。
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: われわれも彼を信じよう
  rationale: ἐπί＋対格が示す人物に向けられた信頼・信仰を「彼を信じる」で表した。καίは、提示された条件への応答を自然に示す「そうすれば」と、話者側を含める「も」に反映した。
theological_decisions:
- issue: イエスを「イスラエルの王」と呼ぶ嘲りの構文
  choice: イスラエルの王なのだから
  alternative: もしイスラエルの王なら
  rationale: 原文は「もし」に当たる条件辞を含まず、「イスラエルの王である」と直接述べる名詞文である。「なのだから」により、その主張を嘲って試す論理を自然な日本語で示しつつ、明示的な条件文への変更を避けた。
- issue: πιστεύσομενの発話上の力
  choice: 信じよう
  alternative: 信じるだろう／信じます
  rationale: 未来形が表す約束めいた挑発を、嘲る者たちの意志を帯びた日本語として表した。実際の信仰告白として解釈させないよう文脈の緊張を保持した。
translation_notes:
  register: 祭司長たちなどによる公然たる嘲りとして、明快で現代的だが軽薄にならない口調を採用した。「降りてみろ」で挑発を表し、「われわれ」で集団的な発話にやや公的な響きを持たせた。脚注記号[a]は本文中に明示した。
