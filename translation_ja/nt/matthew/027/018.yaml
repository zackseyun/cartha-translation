  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: ja
  text: というのも、ピラトは、彼らがねたみ[a]からイエスを引き渡したことを知っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「嫉妬心から」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 知っていた
  rationale: οἶδαの過去完了的な形が表す継続的な認識を、自然な現代日本語で示す。文脈上の主語ピラトを明示した。
- source_word: γὰρ
  choice: からである
  rationale: 直前の内容に理由・説明を加える接続機能を、日本語の文末表現で明確にした。
- source_word: ὅτι
  choice: ～と
  rationale: 原因ではなく、ピラトが知っていた内容を導くὅτιであるため、引用・内容節を示す「と」とした。
- source_word: διὰ φθόνον
  choice: ねたみのため
  rationale: διά＋対格の原因・動機を保ち、φθόνοςが示す他者への悪意を伴う羨望を平易に表す。「嫉妬心から」も可能。
- source_word: παρέδωκαν
  choice: 引き渡した
  rationale: 当局者に身柄を渡す行為を表す文脈上の意味を保持する。「裏切った」では意味を狭めすぎるため避けた。
- source_word: αὐτόν
  choice: イエスを
  rationale: 代名詞の指示対象を明確にし、単独節としても読みやすくした。
theological_decisions:
- issue: イエスを訴えた者たちの動機
  choice: ピラトは、彼らがイエスを引き渡した動機を「ねたみ」だと認識していた。
  alternative: 「嫉妬心」が動機だったと認識していた。
  rationale: φθόνοςが明示する心理的・道徳的動機をそのまま示し、本文にない神学的説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼ら」と「ピラト」は文脈上の指示対象を明確にするため補った。説明を導くγάρは、日本語として自然な文末の「からである」で表した。
