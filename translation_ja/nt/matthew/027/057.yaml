source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: ja
  text: 夕方になると、アリマタヤ出身でヨセフという名の裕福な人がやって来た。彼自身もイエスの弟子となっていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼自身もイエスによって弟子とされていた」または「彼自身もイエスの弟子であった」。
    reason: ἐμαθητεύθηは受動形で、「弟子となった」「弟子とされた」、また文脈上「弟子であった」とも訳し得るため。
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 夕方になると
  rationale: 属格独立構文による時の移行を、自然な現代日本語で表した。δέの軽い場面転換は文脈と「～と」に担わせ、原文にない強い接続語は加えなかった。
- source_word: ἦλθεν
  choice: やって来た
  rationale: ἔρχομαιの単純な移動を表す物語上のアオリスト。日本語の叙述として自然である。
- source_word: ἄνθρωπος πλούσιος
  choice: 裕福な人
  rationale: 富を有する人物という意味を、明瞭で品位ある現代日本語にした。
- source_word: ἀπὸ Ἁριμαθαίας
  choice: アリマタヤ出身の
  rationale: ἀπόが示す出身地を明確に表した。
- source_word: τοὔνομα Ἰωσήφ
  choice: ヨセフという名で
  rationale: 人物を特定する慣用表現を簡潔で自然な日本語にした。
- source_word: ὃς καὶ αὐτὸς
  choice: 彼自身も
  rationale: καίの『～も』とαὐτόςの強調『自身』をともに保持した。
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: イエスの弟子となっていた
  rationale: 受動形が表し得る『弟子となる／弟子とされる』のうち、文脈上の弟子としての身分を自然に示し、過去の時点ですでにその状態にあったことを表した。受動の含みは脚注に残した。
theological_decisions:
- issue: ἐμαθητεύθηとイエスとの関係
  choice: イエスの弟子となっていた
  alternative: イエスによって弟子とされていた／イエスの弟子であった
  rationale: 本文はヨセフがイエスに属する弟子であったことを示すが、その弟子入りの具体的な経緯までは明示しない。本文では自然な身分表現を用い、受動形の別の捉え方を脚注で提示した。
translation_notes:
  register: 明瞭な現代標準日本語。物語の簡潔さと品位を保ち、ὃς καὶ αὐτόςの強調を「彼自身も」で明示した。
