id: MAT.27.53
reference: Matthew 27:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: ja
  text: そして、イエスの復活の後、彼らは墓から出て、聖なる都[b]に入り、多くの人に姿を現した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「聖なる都」はエルサレムを指す。
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: 墓から出た彼らは
  rationale: アオリスト分詞を主語に結びつけ、後続する主動詞「入った」との時間的な前後関係を、自然な現代日本語で表した。
- source_word: μνημείων
  choice: 墓
  rationale: 直前の節で開いた埋葬所を指すため、「墓」が文脈に適し、一般読者にも明瞭である。
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: イエスの復活後
  rationale: μετά＋対格の時間的意味「～の後」を保持した。αὐτοῦの指示対象は文脈上イエスであり、日本語では固有名を補うことで不自然な曖昧さを避けた。ἔγερσιςはこの文脈で死者の中から起こされることを指すため「復活」とした。
- source_word: εἰσῆλθον
  choice: 入り
  rationale: 単純な物語上のアオリストとして、簡潔で自然な「入る」を用いた。
- source_word: τὴν ἁγίαν πόλιν
  choice: 聖なる都
  rationale: エルサレムを指す聖書的呼称を説明に置き換えず、そのまま保持した。
- source_word: ἐνεφανίσθησαν
  choice: 姿を現した
  rationale: 人々の目に見えるようになった、現れたという受動形の意味を、自然な日本語で表した。
- source_word: πολλοῖς
  choice: 多くの人に
  rationale: ギリシア語では「多くの者に」だが、日本語で対象が人であることを明瞭にするため「人」を補った。
theological_decisions:
- issue: 「墓から出る」と「イエスの復活後」の時間的関係
  choice: 「イエスの復活後、墓から出た彼らは」とし、墓から出たことと、その後の都への入城がイエスの復活後であることを示した。
  alternative: ギリシア語の語順を強く反映して「墓から出て、イエスの復活後、聖なる都に入った」とすることも可能だが、日本語では復活後という句が入城だけにかかるようにも読める。
  rationale: μετὰ τὴν ἔγερσιν αὐτοῦは分詞句の直後、主動詞の前に置かれている。本文は最も自然な統語関係を示しつつ、語順上の事情を脚注で明示し、前節との時間関係について本文以上の調和を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「復活」「聖なる都」は広く理解される聖書語彙として保持し、文全体は過度に文語的にならないよう整えた。
