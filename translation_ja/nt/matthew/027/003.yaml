id: MAT.27.3
reference: Matthew 27:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: ja
  text: その時、イエスを裏切ったユダは、イエスが有罪とされたのを見て後悔し、銀貨三十枚を祭司長たちと長老たちに返した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の次の出来事を示す時間的な接続語として、明瞭で自然な現代日本語とした。
- source_word: ἰδὼν
  choice: 見て
  rationale: アオリスト分詞の時間的・付帯状況的なつながりを簡潔に保ち、「見た時」と過度に限定しない。
- source_word: Ἰούδας
  choice: ユダ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: イエスを裏切った
  rationale: 冠詞付き現在分詞はユダをその行為によって特定する。文脈上は「引き渡した」より「裏切った」が自然だが、完了した出来事として日本語の連体修飾で表した。代名詞の指示を明確にするため「イエス」とした。
- source_word: ὅτι κατεκρίθη
  choice: イエスが有罪とされたのを
  rationale: ὅτιを知覚内容として表し、受動態を保持した。「死刑判決」とまでは原文に明記されないため「有罪とされた」とした。
- source_word: μεταμεληθεὶς
  choice: 後悔し
  rationale: μεταμέλομαιは悔恨・後悔を表すため、回心を強く含意し得る「悔い改めた」を避けた。
- source_word: ἔστρεψεν
  choice: 返した
  rationale: 金銭を元の相手に戻す文脈で、簡潔かつ自然な訳語である。
- source_word: τὰ τριάκοντα ἀργύρια
  choice: 銀貨三十枚
  rationale: ἀργύριαは銀の貨幣を指す。現代の読者に明瞭で、数量も自然な日本語で示せる。
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: 祭司長たちと長老たちに
  rationale: マタイにおけるユダヤ指導者の二集団を示す定着した訳語を用いた。
theological_decisions:
- issue: μεταμεληθεὶςが表すユダの反応
  choice: 「後悔し」と訳し、悔恨を示す
  alternative: 「悔い改めて」「思い直して」
  rationale: 原語はμετανοέωではなくμεταμέλομαιであり、ユダの霊的状態や救済について本文以上の結論を持ち込まないため。
- issue: κατεκρίθηの判決内容
  choice: 「有罪とされた」と訳す
  alternative: 「死刑の判決を受けた」
  rationale: 直前の文脈では死刑に当たるとの決議があるが、この動詞自体は「有罪とする／断罪する」であり、訳文では原語の範囲を超えて判決内容を限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。分詞構文の関係を日本語の連用形で自然に示し、主語の混同を避けるため二度目のαὐτόςに相当する箇所も「イエス」と明示した。
