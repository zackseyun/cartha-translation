  terminology: 「ユダ」「イエス」「祭司長たち」「長老たち」は日本語聖書で広く通用する適切な用語である。「銀貨三十枚」はἀργύριαの貨幣的意味をわかりやすく表す。「後悔し」は本文の語彙的・神学的範囲を守っている。
