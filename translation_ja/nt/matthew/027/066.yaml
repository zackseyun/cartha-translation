id: MAT.27.66
reference: Matthew 27:66
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: ja
  text: そこで彼らは行って、警備隊とともに石に封印を施し、墓を厳重に守る措置をとった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「石に封印をし、警備隊を配置して」。ギリシア語の表現は簡潔で、警備隊が封印に立ち会ったことを指すのか、警備隊を配置したことも指すのかは明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: そこで彼らは行き
  rationale: δέによる物語の進行と、主動詞に伴う分詞πορευθέντεςを、自然な現代日本語の連続動作として表した。強い対比は加えていない。
- source_word: ἠσφαλίσαντο
  choice: 厳重にした
  rationale: ἀσφαλίζωの「安全にする、確実に守る」という意味を、墓への不正な介入を防ぐ文脈に即して簡潔に表した。「警備した」と限定せず、封印を含む措置全体を指せる表現とした。
- source_word: τὸν τάφον
  choice: 墓
  rationale: ここではイエスが葬られた墓を指す。現代日本語で明瞭かつ標準的な語を用いた。
- source_word: σφραγίσαντες
  choice: 封印を施して
  rationale: 分詞を、墓を厳重にした手段または付随動作として自然に表した。「施す」により、石そのものを密閉するというより、権威を示す封印を付す意味を明確にした。
- source_word: τὸν λίθον
  choice: 石
  rationale: 墓の入口にある石を指すが、原文にない「入口の」を本文へ補わず、文脈に委ねた。
- source_word: μετὰ τῆς κουστωδίας
  choice: 番兵とともに
  rationale: μετά＋属格の基本的な随伴の意味を保った。κουστωδίαは警備に当たる一隊を指すが、ローマ兵か神殿警備兵かを本文で断定せず、簡潔に「番兵」とした。
theological_decisions:
- issue: μετὰ τῆς κουστωδίαςが墓を厳重にする行為とどう関係するか
  choice: 番兵が伴う中で石に封印を施したという、随伴を示す簡潔な表現
  alternative: 石に封印をし、番兵を配置して墓を厳重にした
  rationale: ギリシア語は簡潔で、番兵の配置を独立した第二の行為として明示してはいない。本文では「番兵とともに」として、番兵の立ち会い・関与・配置のいずれかに限定せず、原文の曖昧さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「墓を厳重にした」は措置の内容を過度に限定せず、「番兵とともに」によって原文の簡潔さと解釈上の余地を保持する。
