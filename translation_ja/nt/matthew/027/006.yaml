id: MAT.27.6
reference: Matthew 27:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: ja
  text: しかし、祭司長たちはその銀貨を拾い上げて言った。「これは血の代価だから、神殿の宝物庫[a]に入れることは許されない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「コルバン」。神殿の宝物庫、または神にささげられた資金を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 福音書における上級祭司層を指す標準的で自然な訳。複数形も明示した。
- source_word: λαβόντες
  choice: 拾い上げて
  rationale: 直前でユダが銀貨を神殿に投げ込んだ文脈を踏まえ、単なる「取って」より具体的な動作を自然に表す。
- source_word: τὰ ἀργύρια
  choice: その銀貨
  rationale: 直前に言及された銀の支払いを指す。貨幣であることを明確にしつつ、ここで特定の貨幣種までは断定しない。
- source_word: Οὐκ ἔξεστιν
  choice: 許されない
  rationale: 祭司たちが宗教法上の可否を問題にしていることを、現代日本語で明瞭に表す。
- source_word: βαλεῖν
  choice: 入れる
  rationale: 宝物庫に納めるという文脈に適した自然な訳であり、「投げる」という字義に不必要に拘泥しない。
- source_word: κορβανᾶν
  choice: 神殿の宝物庫
  rationale: 神殿に属する聖なる資金・宝物庫を指す語の意味を、音写せず一般読者に分かる形で示す。
- source_word: ἐπεὶ
  choice: だから
  rationale: 禁止の理由を導く接続を、発話として自然な因果表現にした。
- source_word: τιμὴ αἵματός
  choice: 血の代価
  rationale: ギリシア語の表現を比較的形式的に保ち、単に金銭の性質だけでなく血に関わる代価という含みを残す。
theological_decisions:
- issue: κορβανᾶνを音写するか意味訳するか
  choice: 神殿の宝物庫
  alternative: コルバン／宝物庫
  rationale: ここでは神殿資金と宗教法上の適否が問題であるため、意味訳が現代の一般読者に最も明瞭。原語名は脚注に残した。
- issue: τιμὴ αἵματόςの解釈幅
  choice: 血の代価
  alternative: 血の報酬／人を死なせるために支払われた金
  rationale: 簡潔な原文表現を保ち、イエスの死のために支払われた金という文脈的意味を本文で説明しすぎない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「しかし」で場面の対照を示し、祭司たちの直接話法は硬すぎない法的・宗教的表現とした。脚注記号[a]は本文中の該当語に付した。
