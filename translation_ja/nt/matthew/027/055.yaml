id: MAT.27.55
reference: Matthew 27:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: ja
  text: そこには多くの女性たちがいて、遠くから見守っていた。彼女たちはガリラヤからイエスについて来て、イエスに仕えていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕えていた」は、身の回りの世話や必要な支援をすることを含み得る。
    reason: διακονέωの実際的な奉仕・支援という意味の幅を示すため。
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: そこには……がいて
  rationale: Ἦσανとἐκεῖの存在・場所の意味を自然な現代日本語で表した。δέは弱い接続辞であり、ここでは独立した接続語を置かなくても場面の流れが保たれる。
- source_word: γυναῖκες πολλαὶ
  choice: 多くの女性たち
  rationale: 人数の多さと女性であることを明確かつ平易に示す。
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: 遠くから見守っていた
  rationale: θεωρέωの継続的に注視する意味を表し、単に視界に入ったという意味よりも、そこで成り行きを見ていたことを自然に伝える。
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: 彼女たちは、イエスに……ついて来た人々であった
  rationale: 関係節が女性たちを、それまでイエスに従って来た者たちとして説明していることを、読みやすい別文で表した。ἀκολουθέωに対応する「ついて来た」は、継続して同行した含みを保つ。
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: ガリラヤから
  rationale: 彼女たちがイエスについて来た地理的な起点をそのまま示す。
- source_word: διακονοῦσαι αὐτῷ
  choice: イエスに仕えるために
  rationale: 分詞が彼女たちの同行に伴う奉仕を表すことを示す。「仕える」は実際的な世話や支援を含み得る一方、後代の教会職制に限定しない。目的表現は日本語として自然だが、原文の分詞は同行中の継続的な奉仕を描いているため、その点を脚注で補う。
theological_decisions:
- issue: 女性たちのδιακονέωの性質
  choice: イエスに仕える
  alternative: イエスの世話をする／イエスに奉仕する
  rationale: 実際的な世話や支援に限定せず、かつ制度化された聖職上の務めとも決めつけないよう、意味の幅を保つ表現を選んだ。
- issue: ガリラヤからの同行と奉仕の関係
  choice: イエスに仕えるために、ガリラヤからついて来た
  alternative: ガリラヤからイエスについて来て、彼に仕えていた
  rationale: 原文では「ついて来た」が定動詞で「仕えながら」が分詞である。本文は自然な日本語を優先し、奉仕が同行の目的・特徴であったことを表したが、時間的に同行中の奉仕とも読める原文の含みを脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシャ語の一文を二文に分け、通常の読者が関係節を追いやすくした。「見守る」は継続的な注視を、「仕える」は制度的役職に狭めない奉仕を表す。脚注記号[a]は本文中に明示した。
