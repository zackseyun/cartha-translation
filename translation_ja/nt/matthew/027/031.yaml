id: MAT.27.31
reference: Matthew 27:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: ja
  text: 彼らはイエスをあざけった後、外套[a]を脱がせ、元の服を着せて、十字架につけるために連れて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上着」とも訳せる。ギリシア語は肩に掛ける外衣を指し、しばしば軍人の外套をいう。ここでは、イエスを王に見立てて着せた衣のこと。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: あざけった
  rationale: 嘲弄し、侮辱する行為を表す。軽い「からかった」ではなく、文脈の残酷な嘲りを伝える「あざけった」とした。
- source_word: χλαμύδα
  choice: 外套
  rationale: χλαμύςは肩に掛ける外衣、しばしば軍人の外套を指す。語そのもの以上に王の正装と限定せず、直前の文脈ではイエスに着せた王を装うための衣を指す。
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: 外套を脱がせ
  rationale: ἐκδύωの「衣服を脱がせる」という他動的な意味を、自然な現代日本語で表した。
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: 元の服を着せて
  rationale: αὐτοῦによる本人の衣服と、今しがた取り除いた外套との対比を明確にした。「元の」は文脈上の対比を自然に表す。
- source_word: ἀπήγαγον
  choice: 連れて行った
  rationale: 拘束下の人物を処刑場所へ移送する意味に合う、明瞭で自然な表現。
- source_word: εἰς τὸ σταυρῶσαι
  choice: 十字架につけるために
  rationale: εἰς＋冠詞付き不定詞が示す目的を明示した。σταυρόωはこの文脈で十字架刑に処することを意味する。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難記事にふさわしい簡潔で重みのある叙述とした。「彼ら」の後に「イエス」を補い、日本語で指示対象が明確になるようにした。
