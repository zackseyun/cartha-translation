  source_fidelity: 本文は、兵士たちがイエスを嘲弄した後、彼からχλαμύς（外套）を取り去り、彼自身の衣服を着せ、十字架刑にする目的で連行したというギリシア語の順序・行為者・目的を正確に伝えている。「元の服」はαὐτοῦ（彼の）を直前に脱がせた外套との対比の中で自然に表している。
