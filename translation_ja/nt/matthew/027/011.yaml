language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: ja
  text: イエスは総督の前に立った。総督はイエスに尋ねた。「あなたがユダヤ人[b]の王なのか。」イエスは言った。「あなたがそう言うのです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたがそう言っている」。また、「あなたの言うとおりです」とも訳せる。ギリシア語の返答は簡潔で省略的であり、やや含みがある。
    reason: alternative_reading
  - marker: b
    text: 「ユダヤ地方の人々」とも訳し得る。ギリシア語は、広くユダヤ人を指す場合と、文脈によってユダヤ地方の人々を指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστάθη
  choice: 立った
  rationale: アオリスト受動形だが、ここでは自動詞的に「立った」とするのが自然。「立たされた」とすると、本文に明示されていない使役の意味を加えることになる。
- source_word: ἔμπροσθεν τοῦ ἡγεμόνος
  choice: 総督の前に
  rationale: 司法的な場面と空間的な位置の両方を、簡潔で自然な日本語で表す。
- source_word: ἡγεμών
  choice: 総督
  rationale: この文脈のローマ行政官を表す標準的で分かりやすい訳語。「長官」は可能だが、ここでは「総督」が広く定着している。
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 公的な審問の場での質問を表しつつ、「尋問した」ほど強い含みを加えない。
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: ローマ側の告発で用いられる政治的・民族的な称号として自然で、一般読者にも明瞭。「ユダヤ地方の人々の王」という地域的な理解も語義上あり得るため脚注で示す。
- source_word: ἔφη
  choice: 言った
  rationale: イエスの応答を導入する簡潔な動詞として、原文に最も近く自然である。
- source_word: Σὺ λέγεις
  choice: そう言っているのは、あなたです
  rationale: 直訳的な「あなたが言っている」の簡潔さと抑制を保ちながら、日本語として意味が通る形にした。全面的な肯定とも否定とも言い切らない原文の含みを残す。
theological_decisions:
- issue: イエスの返答 Σὺ λέγεις のニュアンス
  choice: 「そう言っているのは、あなたです」――相手の言葉に返す、抑制された間接的な肯定
  alternative: 「そのとおりです」または「あなたの言うとおりです」という明確な肯定
  rationale: ギリシア語は簡潔で省略的であり、総督の政治的な言い方をそのまま全面肯定する表現にはしていない。肯定とも距離を置いた応答とも取れる緊張を、訳文と脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法廷場面にふさわしい簡潔で落ち着いた調子とした。原文に明示的な「さて」「その時」がないため、冒頭に時間・談話標識を補わなかった。敬体や尊敬語を加えず、物語本文として統一的な常体にした。
