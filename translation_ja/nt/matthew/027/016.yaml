id: MAT.27.16
reference: Matthew 27:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: ja
  text: そのころ、彼らのもとには、イエス・バラバと呼ばれる悪名高い囚人がいた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「イエス」を省いて、単に「バラバ」とする。
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: 彼らのもとには…いた
  rationale: 未完了過去の複数形で、主語は明示されていない。拘禁していた当局者らを暗に指すと考えられるため、所有・管理下にある含みを自然な日本語で表した。
- source_word: δὲ
  choice: （独立には訳出せず）
  rationale: 弱い談話接続辞であり、日本語では「そのころ」で自然に叙述が続くため、機械的な「さて」などを加えなかった。
- source_word: τότε
  choice: そのころ
  rationale: 明示された時間的意味を保ちつつ、物語文として自然な現代日本語にした。
- source_word: δέσμιον
  choice: 囚人
  rationale: 拘禁されている者を指し、この司法・拘禁の文脈で明瞭な標準語である。
- source_word: ἐπίσημον
  choice: 悪名高い
  rationale: 語自体には「名の知れた、著名な」の幅があるが、囚人バラバについての文脈では悪い意味で名高いという理解が最も自然である。
- source_word: λεγόμενον
  choice: と呼ばれる
  rationale: 人名・呼称を導入する分詞を、簡潔で自然な日本語にした。
- source_word: Ἰησοῦν Βαραββᾶν
  choice: イエス・バラバ
  rationale: 指定されたSBLGNT本文にἸησοῦνが含まれるため本文に反映し、異読は脚注に示した。
theological_decisions:
- issue: バラバの名に「イエス」を含めるか
  choice: 本文を「イエス・バラバ」とする
  alternative: 「バラバ」とだけする
  rationale: 指定された原語本文はἸησοῦν Βαραββᾶνと読むため、その形を本文に採用した。一方、多くの写本にある短い読みも本文批評上重要なので脚注に保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼ら」の指示対象が原文で明示されない点を保持し、「悪名高い」は文脈上の否定的含意を自然に伝える。
