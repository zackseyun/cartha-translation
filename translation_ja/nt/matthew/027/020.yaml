  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: ja
  text: しかし、祭司長たちと長老たちは群衆を説き伏せ、バラバを求めさせ、イエスを殺すよう求めさせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の展開との対照を自然な日本語で示す。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: エルサレムの祭司指導者層を指す定着した訳語であり、複数形も保つ。
- source_word: πρεσβύτεροι
  choice: 長老たち
  rationale: 公的に認められたユダヤ人指導者たちという歴史的・制度的意味を保つ。
- source_word: ἔπεισαν
  choice: 説き伏せ
  rationale: 群衆に働きかけ、特定の要求をさせたという完結した行為を明瞭に表す。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: 日本語では集合名詞の「群衆」が自然であり、複数の集団を必ずしも「群衆たち」とする必要はない。
- source_word: ἵνα αἰτήσωνται
  choice: 釈放するよう願い出させ
  rationale: 説得の内容・目的を使役表現で自然に示す。文脈上、バラバを求めるとは釈放を願うことであるため、それを明示した。
- source_word: Βαραββᾶν
  choice: バラバ
  rationale: 日本語聖書で定着した音写を用いる。
- source_word: τὸν δὲ Ἰησοῦν ἀπολέσωσιν
  choice: イエスは死刑にするよう求めさせた
  rationale: 二つ目の δέ の対照を「は」で表し、司法的文脈における ἀπόλλυμι の具体的意味を明瞭に訳す。
theological_decisions:
- issue: 司法的処刑の文脈における ἀπολέσωσιν の訳し方
  choice: 死刑にする
  alternative: 滅ぼす／殺す
  rationale: ἀπόλλυμι は広く「滅ぼす、死なせる」を意味するが、ここではピラトに対してイエスの処刑を求める場面である。「滅ぼす」は現代日本語では具体性に乏しくなりやすいため、文脈上の意味を明瞭にする「死刑にする」を採用した。
translation_notes:
  register: 明快で現代的かつ品位ある叙述。ギリシア語の対照構造は「バラバを……、イエスは……」で保持し、長い従属構文は日本語として読みやすい使役表現に整えた。
