    issue: 「釈放する」を本文に補っている
    rationale: 原文は「バラバを求める」と述べるのみで、釈放は直前の文脈から理解される内容です。この節の本文では補足せず、原文の簡潔さを保つのが安全です。
  - severity: low
    issue: 「死刑にする」は原文より法的に限定的である
    rationale: ἀπολέσωσιν はこの場面で殺害・死に至らせることを指す一方、「死刑」は正式な司法上の刑罰という限定を加えます。「殺すよう求める」がより直接的です。
