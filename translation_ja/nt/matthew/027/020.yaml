revisions:
- from: しかし、祭司長たちと長老たちは群衆を説き伏せ、バラバを釈放するよう願い出させ、イエスは死刑にするよう求めさせた。
  to: しかし、祭司長たちと長老たちは群衆を説き伏せ、バラバを求めさせ、イエスを殺すよう求めさせた。
  rationale: 原文にない「釈放する」を削除し、ἵνα 以下の二つの並列した内容を日本語でも明示しました。「殺すよう求めさせた」は、群衆自身がイエスを殺すという意味ではなく、そのように要求するよう指導者たちが群衆を説得したという構文です。
