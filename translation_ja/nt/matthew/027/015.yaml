  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: ja
  text: 祭り[a]の時には、総督は群衆のために、彼らが望む囚人を一人釈放するのを常としていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「祭りの期間中には」とも訳せる。
    reason: κατά＋対格は、この箇所では祭りの際・期間中という時間的な意味を表す。
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: 祭りのたびに
  rationale: κατά＋対格を時を表す慣用表現として捉え、未完了形が示す反復的な慣例と自然につながるようにした。δέの軽い接続は、日本語では文脈上あえて独立した語にしない。
- source_word: ἑορτὴν
  choice: 祭り
  rationale: 宗教的な祝祭を指す語であり、現代の一般読者に明瞭な「祭り」とした。文脈上は過越の祭りを指す。
- source_word: εἰώθει
  choice: 慣例としていた
  rationale: 過去に繰り返されていた習慣を明示し、未完了形の継続・反復の意味を保つ。
- source_word: ὁ ἡγεμὼν
  choice: 総督
  rationale: ここではローマの属州統治者を指すため、歴史的文脈に適した標準的な訳語を用いた。
- source_word: ἀπολύειν
  choice: 釈放する
  rationale: 拘禁中の者を公的に自由にする司法的文脈を明確に表す。
- source_word: ἕνα … δέσμιον
  choice: 囚人を一人
  rationale: 人数を明示するἕναと、拘束されている者を表すδέσμιονを自然な日本語の語順で訳した。
- source_word: τῷ ὄχλῳ
  choice: 群衆のために
  rationale: 与格を受益・関与の意味に取り、群衆の求めに応じて釈放することを表す。
- source_word: ὃν ἤθελον
  choice: 群衆が望む
  rationale: 関係代名詞の先行詞である「囚人」を修飾し、複数動詞の主体を集合名詞「群衆」として自然に明示した。
