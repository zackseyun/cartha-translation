  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: ja
  text: そして、墓が開き、眠りについていた[a]多くの聖なる者たちの体が起こされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「眠りについていた」は、「死んでいた」を表す一般的な婉曲表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節から出来事を並列的につなぐ接続詞。時間的な意味を過度に加えず、現代日本語の物語文として自然にした。
- source_word: τὰ μνημεῖα
  choice: 墓
  rationale: 埋葬場所を指す一般的な語であり、文脈に最も自然で明確な訳語。
- source_word: ἀνεῴχθησαν
  choice: 開き
  rationale: アオリスト受動形の意味を表す。「開かれ」とすることも可能だが、日本語では自動詞的な受け身の意味を含む「墓が開き」が自然で、開いた仕組みは付加しない。
- source_word: πολλὰ σώματα
  choice: 多くの…体
  rationale: σῶμαの中立的な意味を保ち、「遺体」のように死んだ状態を固定する語を避けた。
- source_word: τῶν κεκοιμημένων
  choice: 眠りについていた
  rationale: 死を表す慣用的な婉曲表現を保持しつつ、現代日本語として理解しやすくした。
- source_word: ἁγίων
  choice: 聖なる者たち
  rationale: 名詞的に用いられた形容詞の意味を直接表し、対象の身元を本文以上に限定しない。「聖徒たち」より一般読者に分かりやすい。
- source_word: ἠγέρθησαν
  choice: 起こされた
  rationale: 受動形を保ち、死者が起こされたことを表す一方、その出来事を特定の復活概念へ狭めない。
theological_decisions:
- issue: ἠγέρθησανが表す出来事の性質
  choice: 起こされた
  alternative: 復活させられた
  rationale: この動詞は死者の復活を指し得るが、「起こされた」は原語の比喩的な幅を保ち、この一節だけで復活の性質を体系的に確定しない。
- issue: κεκοιμημένωνの死を表す婉曲表現
  choice: 眠りについていた
  alternative: 死んでいた
  rationale: 原文の「眠る」という慣用表現と、その含意を本文に残すため。意味は脚注で明示する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖なる者たち」として専門的な教会用語への依存を抑え、受動表現と原文の死の婉曲語法を保持した。
