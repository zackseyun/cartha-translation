  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: ja
  text: 翌日、すなわち備えの日の翌日[a]、祭司長たちとパリサイ人たちはピラトのもとに集まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「備えの後の日に」とも訳せる。「備えの日」は安息日の前日を指し得るが、「金曜日」と訳すと原文以上に限定することになる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: さて、その翌日
  rationale: 翌日への時間的進行を明確にし、δέの軽い接続機能を自然な「さて」で表した。明示的な「今」を加えることは避けた。
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: すなわち備えの日の次の日に
  rationale: ἥτιςの説明的な働きを「すなわち」で示し、μετάの時間的意味を「次の日」と自然に表した。
- source_word: παρασκευήν
  choice: 備えの日
  rationale: 安息日の前の準備日を指すユダヤ暦上の表現を保った。「金曜日」と断定すると原文より解釈的になるため避けた。
- source_word: συνήχθησαν
  choice: 集まった
  rationale: 受動形ながら自動詞的に用いられているため、現代日本語で簡潔かつ自然な「集まった」とした。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 単数の大祭司職が複数いたという意味ではなく、祭司階級の指導者たちを指す標準的な訳語を用いた。
- source_word: οἱ Φαρισαῖοι
  choice: パリサイ人たち
  rationale: このユダヤ教集団の名称として広く通用する音写を用いた。
- source_word: πρὸς Πιλᾶτον
  choice: ピラトのもとに
  rationale: 人を目的語に取るπρόςが、ここではその人物のもとへ赴いて集まることを表すため、自然な日本語で訳した。
- source_word: Πιλᾶτον
  choice: ピラト
  rationale: 固有名Πιλᾶτοςの日本語で定着した音写を採用した。
