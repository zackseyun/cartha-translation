  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: ja
  text: そこを通りかかった人々は、頭を振りながら[b]、イエスを冒涜していた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ののしっていた」。ギリシア語は、狭い意味で神を冒涜することだけでなく、人を罵倒したり中傷したりすることも表す。
    reason: lexical_alternative
  - marker: b
    text: 軽蔑や嘲りを示す身振り。詩篇22:7参照。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: 人々は
  rationale: 冠詞付き分詞を名詞的に訳した。δέは弱い接続であり、日本語では文脈上あえて接続詞を置かないほうが自然である。
- source_word: παραπορευόμενοι
  choice: そこを通りかかった
  rationale: 十字架刑の場所のそばを通過していた人々を表す現在分詞。日本語として自然にしつつ、通行の動作を保った。
- source_word: ἐβλασφήμουν
  choice: 冒瀆していた
  rationale: 未完了過去の継続的な様相を「していた」で示した。βλασφημέωは神への冒瀆だけでなく、人に対する悪意ある罵倒にも用いられるが、マタイの強い語調と神学的な含みを保つため「冒瀆」を本文に採用した。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 指示対象はイエスである。日本語では「彼を」より固有名詞で受けるほうが明瞭で自然である。
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: 頭を振りながら
  rationale: 主動詞と同時に行われた嘲りの身振りを自然な日本語で表した。各人が自分の頭を振るため、日本語では単数形の「頭」が自然である。
theological_decisions:
- issue: 受難物語でイエスに向けられた βλασφημέω の意味合い
  choice: 本文では「冒瀆していた」とする
  alternative: 「ののしっていた」「悪口を浴びせていた」
  rationale: 語が持つ強い非難の響きと、イエスに向けられた言葉が帯びる神学的緊張を保つ。一方、「冒瀆」が神に対する行為だけを意味すると限定されないよう、語義上の別訳を脚注に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難記事にふさわしい品位を保った。「冒瀆」はやや強い語だが、原文の語感と意図的な神学的緊張を保持するため採用し、日常的な意味の可能性を脚注で補った。
