  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: ja
  text: そして、祭司長たちと長老たちに訴えられている間、イエスは何も答えなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何の返答もしなかった」。
    reason: οὐδὲν ἀπεκρίνατοは、直訳的な「何も答えなかった」のほか、日本語では「何の返答もしなかった」とも表現できるため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前の叙述とのつながりを自然な現代日本語で示し、原文にない強い対比は加えない。
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: 訴えられている間
  rationale: ἐν＋冠詞付き現在不定詞が表す同時性と、受動態および継続中の動作を保つ。法的な場面にも合う自然な表現である。
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: 祭司長たちと長老たちから
  rationale: ἀρχιερεῖςは福音書では祭司階級の指導者たちを指すため、慣用的で明確な「祭司長たち」とする。ὑπόは受動文の動作主を示す「から」で表した。
- source_word: οὐδὲν
  choice: 何も
  rationale: ἀπεκρίνατοの内容を示す語として、原文の直接的な否定表現を保つ。
- source_word: ἀπεκρίνατο
  choice: 答えなかった
  rationale: οὐδένと合わせて「何も答えなかった」とし、簡潔な叙述を保つ。「返答しなかった」も可能だが、本文ではより一般的な語を選んだ。
- source_word: αὐτόν
  choice: イエスは
  rationale: 日本語では三人称代名詞を機械的に用いるより、文脈上の指示対象であるイエスを明示するほうが自然で明確である。
theological_decisions:
- issue: 告発者たちの前でのイエスの沈黙
  choice: 出来事を「何も答えなかった」とそのまま叙述する。
  alternative: イザヤ書53章との関連を明示するような解釈的表現を加える。
  rationale: この節自体は預言の成就を明言していないため、神学的関連を本文に補わず、原文が述べる沈黙をそのまま伝える。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、法廷場面にふさわしい落ち着いた叙述調とした。原文にない敬語や預言成就の説明は加えていない。
