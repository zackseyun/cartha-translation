  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: ja
  text: こう言った。「私は罪を犯しました。罪のない人の血を売り渡したのです[a]。」しかし彼らは言った。「われわれの知ったことか。自分で対処しろ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「罪のない人の血を引き渡して」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「あなた自身が見るだろう」。ここでは「それはあなた自身の責任だ」という突き放した言い方。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: 私は罪を犯しました
  rationale: アオリスト直説法の告白を、行為と現在の罪責を自然に表す現代日本語にした。
- source_word: παραδοὺς
  choice: 売り渡したのです
  rationale: 文脈上、ユダがイエスを敵の手に引き渡した裏切りを指す。「引き渡す」より背信性を伝える「売り渡す」がここでは自然だが、分詞の字義的な形は脚注に残した。
- source_word: αἷμα ἀθῷον
  choice: 罪のない人の血
  rationale: 無実の者を死に至らせる責任を表す聖書的表現を保ちつつ、日本語で指示内容が明瞭になる形にした。イエスという名は補わない。
- source_word: Τί πρὸς ἡμᾶς;
  choice: われわれの知ったことか
  rationale: 責任や関心を突き放すギリシア語の慣用句を、簡潔で強い日本語の反語として訳した。
- source_word: σὺ ὄψῃ
  choice: 自分で始末しろ
  rationale: 未来形が文脈上、命令に近い突き放した言い方として機能しているため、その語用的な力を自然な日本語で表した。字義に近い別訳は脚注に示した。
theological_decisions:
- issue: ユダが売り渡した相手を明示するか
  choice: 「罪のない人の血」とし、イエスの名は加えない
  alternative: 「罪のないイエスの血」
  rationale: 原文は指示対象を文脈に委ねており、名を補うと原文以上の明示になるため。
- issue: σὺ ὄψῃを未来の叙述として訳すか、命令的な拒絶として訳すか
  choice: 命令的な拒絶として「自分で始末しろ」
  alternative: 「あなた自身が見ることになる」／「自分で対処せよ」
  rationale: 形態は未来形だが、この慣用表現は相手に責任を押し返す冷淡な応答である。形と機能の緊張は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、ユダの告白には丁寧体、祭司長たちの返答には冷淡でぞんざいな調子を用いた。「われわれ」はやや荘重な物語調を保つ。
