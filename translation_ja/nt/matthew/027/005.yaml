  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: ja
  text: そして、銀貨を神殿[a]に投げ込むと、そこを立ち去り[b]、行って首をつった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」とも訳せる。ギリシア語のναός（ナオス）は、神殿の境内全体ではなく、特に神殿の中核となる聖所を指すことが多い。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「立ち去り、行って、自らをつった」。原文は、立ち去ることと行くことを別々の語で述べている。
    reason: source_structure
lexical_decisions:
- source_word: ῥίψας
  choice: 投げ込むと
  rationale: アオリスト分詞による先行動作を、自然な日本語で主動作へつなげる。「投げ捨てる」ほど処分の含意を加えず、投げ入れる動作を明確にした。
- source_word: τὰ ἀργύρια
  choice: 銀貨
  rationale: 字義的には「銀」だが、文脈では返された銀貨を指す。日本語では「銀」より「銀貨」が明瞭で自然である。
- source_word: εἰς τὸν ναὸν
  choice: 神殿
  rationale: ναόςは神殿域全体よりも聖所を指すことが多いが、本文では簡潔で一般読者に分かりやすい「神殿」とし、より限定的な意味を脚注に示した。
- source_word: ἀνεχώρησεν
  choice: そこを立ち去り
  rationale: 「退いた」「立ち去った」の意味。場所から離れたことを自然かつ荘重に表す。
- source_word: ἀπελθὼν
  choice: 行って
  rationale: ἀνεχώρησενとは別の移動表現であるため、省略せず、「行って」により後続行為へのつながりを保った。
- source_word: ἀπήγξατο
  choice: 首をつった
  rationale: 中動態による自らへの行為を表し、この文脈では自死のために首をつる意味と理解するのが最も自然である。
theological_decisions:
- issue: ναόςが神殿全域ではなく聖所を指し得ること
  choice: 本文では「神殿」、脚注で「聖所」の可能性を明示
  alternative: 本文で「聖所」または「神殿の聖所」とする
  rationale: 建築上の限定的な語義を失わないよう脚注に残しつつ、本文では一般読者に明瞭な表現を採用した。
- issue: 二つの移動表現ἀνεχώρησενとἀπελθώνの関係
  choice: 「そこを立ち去り、行って」と両方を訳出
  alternative: 「そこを立ち去って首をつった」と一つにまとめる
  rationale: 日本語では多少反復的になるが、原文にある二つの動きを安易に統合せず、その緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、物語の厳粛さを保った。「首をつった」は現代日本語で直接的かつ自然な表現。原文の二重の移動表現は、やや反復的でも本文に残した。
