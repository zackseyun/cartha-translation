  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ja
  text: 彼はイエスに尋ねた。「どの戒めですか。」イエスは言われた。「『殺してはならない』、『姦淫してはならない』、『盗んではならない』、『偽証してはならない』です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: どの戒めですか
  rationale: 直訳は「どれですか」だが、直前の文脈で問われている複数の戒めを自然かつ明確に指すため、「戒め」を補った。
- source_word: Οὐ φονεύσεις
  choice: 殺してはならない
  rationale: φονεύω は不法に人を殺すことを表すため、日本語の十戒として定着し、かつ簡潔な表現を採用した。
- source_word: Οὐ μοιχεύσεις
  choice: 姦淫してはならない
  rationale: μοιχεύω の婚姻関係に対する不貞という意味を保持する。
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: 偽証してはならない
  rationale: 単なる虚言ではなく、偽りの証言をすることを指す原語の法廷的含意を保つ。
theological_decisions:
- issue: 冠詞 Τὸ の扱い
  choice: 日本語では独立した語として訳さず、引用符で戒めの列挙を示す
  alternative: 「次の戒めです」または「すなわち」と明示する
  rationale: Τὸ は後続する戒めの引用全体を名詞化・導入する働きと理解できるが、日本語で「その」と逐語的に置くと不自然になる。引用形式によって機能を再現し、本文にない説明を増やさない。
- issue: 現在形 λέγει とアオリスト εἶπεν の語り分け
  choice: いずれも自然な日本語の過去叙述として訳す
  alternative: 「彼は言う」「イエスは言われた」と時制を分ける
  rationale: ギリシア語の歴史的現在を日本語で現在形にすると不自然な時制転換になるため、物語上の出来事として統一した。
translation_notes:
  register: 現代の一般読者に明瞭で、十戒の引用にふさわしい簡潔で格調ある表現とした。発言者を明確にするため αὐτῷ の相手を「イエス」と明示し、イエスの発言には敬語を用いた。
