  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: ja
  text: 父と母を敬いなさい。また、隣人を自分自身のように愛しなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後半は、原文の形に即して訳すと「また、あなたは隣人を自分自身のように愛する」。律法の引用で、未来形が命令の意味を表している。
    reason: 原文における未来直説法の命令的用法と、前半の命令法との形の違いを示すため。
lexical_decisions:
- source_word: Τίμα
  choice: 敬いなさい
  rationale: 単なる内面的な尊敬にとどまらず、父母にふさわしい敬意を示すことを命じる十戒の表現として、「敬いなさい」が自然で重みも保てる。
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: 父と母
  rationale: ギリシア語には所有代名詞がないため、日本語でも不要な「あなたの」を補わず、十戒として定着した自然な言い方にした。
- source_word: Ἀγαπήσεις
  choice: 愛しなさい
  rationale: 形は未来直説法だが、律法引用において命令の力を持つ。現代日本語の本文では直接的な命令形が最も自然である一方、原文の形は脚注に残した。
- source_word: τὸν πλησίον σου
  choice: 隣人
  rationale: レビ記19章18節を背景とする倫理的文脈で、身近な他者を指す標準的で明確な訳語である。
- source_word: ὡς σεαυτόν
  choice: 自分自身のように
  rationale: 比較表現を簡潔に保ち、「自分を愛するように」のような原文に明示されていない動詞の補足を避けた。
theological_decisions:
- issue: 戒めの引用における命令形と未来直説法の組み合わせ
  choice: 本文では両方を自然な命令として訳す
  alternative: 後半を形に即して「また、あなたは隣人を自分自身のように愛する」と訳す
  rationale: ギリシア語は前半に命令法、後半に律法の命令表現としての未来直説法を用いる。本文では戒めとしての同じ効力を明瞭に伝え、形の違いは脚注で示すことで、自然さと原文情報の双方を保った。
translation_notes:
  register: 明快な現代標準語を用いながら、戒めにふさわしい簡潔さと品位を保った。「また」で二つの引用を区切り、朗読時にも関係が分かりやすい形にした。
