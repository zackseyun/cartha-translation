  text: And large crowds followed him, and he healed them there.
translation:
  language: ja
  text: 大勢の群衆がイエスについて行き、イエスはそこで彼らを癒やした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスについて行き
  rationale: ἀκολουθέω＋与格を、文脈上の実際の移動として自然な現代日本語にした。「従った」も可能だが、ここでは弟子として従うという意味を不必要に強めない「ついて行った」が適切。主語の連続を滑らかにするため連用形とした。
- source_word: ὄχλοι πολλοί
  choice: 大勢の群衆
  rationale: 直訳的には「多くの群衆」。日本語では「大勢の群衆」が人数の多さを明瞭かつ自然に表す。
- source_word: ἐθεράπευσεν
  choice: 癒やされた
  rationale: 治癒を表す θεραπεύω を、福音書の叙述にふさわしい標準的な「癒やす」で訳した。敬語ではなく、イエスに対する自然で簡潔な尊敬表現として主語尊敬の「癒やされた」を用いた。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 直前の「群衆」を受ける複数代名詞として明示した。原文は群衆全体を複数で指すため、その照応を保った。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 場所を示す副詞の簡潔な力を保ちつつ、前後の出来事とのつながりが自然になる形にした。
- source_word: καὶ ... καὶ
  choice: …て行き、…
  rationale: 二つの出来事を並列的に結ぶ καί の流れを、日本語で不自然に接続詞を反復せず、連用接続によって保持した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。簡潔な福音書叙述の調子を保ち、弟子道などの含意を本文以上に加えない。固有名詞「イエス」は、単独の三人称代名詞が日本語では参照先を曖昧にしやすいため補った。
