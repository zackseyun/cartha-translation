id: MAT.19.3
reference: Matthew 19:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: ja
  text: すると、ファリサイ派の人々がイエスに近寄り、イエスを試そうとして言った。「どんな理由であっても[a]、男が自分の妻と離婚することは許されていますか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どんな根拠であっても」または「あらゆる理由で」。ギリシャ語の表現は、離婚が許される根拠について広く問う法的な問いを反映している。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: 近寄り
  rationale: 相手のもとへ近づくという方向性を、自然な現代日本語で表す。
- source_word: πειράζοντες
  choice: 試そうとして
  rationale: 敵対的な意図を文脈に委ねつつ、「試す」という語の幅を保ち、「誘惑する」や「罠にかける」と狭く断定しない。
- source_word: ἔξεστιν
  choice: 許されていますか
  rationale: 何が認められているかを問う法的・宗教的論争の表現として明瞭であり、「合法ですか」より自然な日本語となる。
- source_word: ἀνθρώπῳ
  choice: 男が
  rationale: 直後に「その妻」とあるため、ここでは一般的な「人」ではなく、妻を持つ男性を具体的に指す。
- source_word: ἀπολῦσαι
  choice: 離婚する
  rationale: 基本義は「解放する、去らせる」だが、婚姻関係の文脈では離婚を表す慣用的な用法である。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻と
  rationale: γυνήは「女」または「妻」を意味するが、所有表現と離婚の文脈から「妻」が適切である。日本語では「妻を離婚する」ではなく「妻と離婚する」とする。
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: どんな理由であっても
  rationale: 離婚を認める根拠の範囲を広く問う表現であり、「どのような理由でも」という包括性を自然に保つ。
theological_decisions:
- issue: 離婚が許される根拠をめぐる一世紀の法的・宗教的論争を、後代の教派的立場で限定せずに表すこと
  choice: 「どんな理由であっても、男が妻と離婚することは許されていますか」
  alternative: 「男は、どんな理由でも妻と離婚することが律法上許されていますか」
  rationale: この節はイエスへの問いを提示する段階であり、離婚についての結論はまだ述べていない。そのため、問いの広さと法的な含みを保ちつつ、特定の離婚理由や教理体系を訳文に持ち込まない。
translation_notes:
  register: 明瞭で自然な現代標準語を用いながら、対話場面にふさわしい丁寧な疑問形とした。「ファリサイ派の人々」は一般読者にも理解しやすく、「イエス」を補って代名詞の連続による曖昧さを避けた。
