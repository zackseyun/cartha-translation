id: MAT.19.23
reference: Matthew 19:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: ja
  text: そこでイエスは弟子たちに言われた。「まことに、あなたがたに言う。裕福な人が天の国に入るのは難しい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 直前の出来事を受けて語り始めるという、物語上の推移を自然な現代日本語で示す。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: 文脈上イエスの弟子たちであることは明白であり、日本語では所有表現を重ねずとも関係が明確である。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言う
  rationale: イエスの厳粛な宣言定型句の重みを保ちつつ、現代の読者にも意味が直接伝わる表現とした。
- source_word: πλούσιος
  choice: 裕福な人
  rationale: 形容詞が名詞的に用いられ、富を持つ一人の人を代表的に指す。日本語として自然で、性別を不必要に補わない。
- source_word: δυσκόλως
  choice: 入るのは難しい
  rationale: 『困難を伴って』という様態を自然な日本語の述語表現にした。次節が示す不可能性を先取りして強めすぎない。
- source_word: εἰσελεύσεται
  choice: 入る
  rationale: 未来形の予測的な意味は、日本語では一般的な言明の形で自然に表される。
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: 天の国
  rationale: マタイに特徴的な表現を簡潔に保つ。βασιλείαには支配・王権の含意もあるが、ここでは定着し明瞭な『国』を採用した。
theological_decisions:
- issue: πλούσιοςの男性単数形
  choice: 裕福な人
  alternative: 裕福な男
  rationale: ギリシア語の男性単数は代表的な個人を指すが、日本語では『人』が自然であり、原文にない対比的な性別強調を持ち込まない。
- issue: Ἀμὴνを含むイエスの宣言句
  choice: まことに、あなたがたに言う
  alternative: アーメン、あなたがたに言う
  rationale: 原語の音写よりも発言の真実性と厳粛さを明瞭に伝え、イエスの権威ある宣言という機能を保つ。
- issue: 天の国に入る困難さの程度
  choice: 入るのは難しい
  alternative: ほとんど入れない
  rationale: δυσκόλως自体は困難さを表すため、次節の強い比喩を先取りして『ほとんど不可能』と解釈し切らない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。イエスの発言は厳粛さを保つ常体とし、過度に古風な語法や教派固有の用語を避けた。
