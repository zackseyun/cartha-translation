reference: Matthew 19:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ja
  text: しかし、わたしはあなたがたに言います。だれでも、性的不道徳の場合を除いて妻と離婚し[a]、別の女性と結婚する者は、姦通を犯します。また、離婚された女性と結婚する者も姦通を犯します。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「性的不道徳の場合を除いて」と訳したギリシア語は、より狭く「淫行を理由とする場合を除いて」とも訳せます。また、「性的な不貞の場合を除いて」と解する見方もあります。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本には、「また、離婚された女性と結婚する者も姦通を犯します」という部分がありません。
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: しかし、わたしはあなたがたに言います
  rationale: δέを文脈上の穏やかな対比として「しかし」とし、λέγω＋与格を現代日本語で自然な「あなたがたに言います」とした。
- source_word: ὃς ἂν
  choice: だれでも…するなら
  rationale: 関係代名詞とἄνが表す不特定かつ一般的な条件を、明瞭な現代日本語で表した。
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: 妻と離婚し
  rationale: 婚姻の文脈におけるἀπολύωは単なる追放ではなく離婚を指し、γυνήはここでは「妻」である。日本語として自然な助詞「と」を用いた。
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: 性的不品行を理由とする場合を除いて
  rationale: ἐπίの理由・根拠の含意と例外節の働きを明示しつつ、πορνείαを姦通だけに限定せず、広い意味範囲を保った。
- source_word: γαμήσῃ ἄλλην
  choice: 別の女と結婚する
  rationale: 女性形ἄλληνが示す「別の女性」を、日本語で明確かつ自然に表した。
- source_word: μοιχᾶται
  choice: 姦通を犯します
  rationale: 婚姻関係に背く性的行為を指す語として、定着した明瞭な表現を用いた。
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: また、離婚された女と結婚する者も姦通を犯します
  rationale: 冠詞付き分詞を一般的な「者」として訳し、完了受動分詞ἀπολελυμένηνを「離婚された女」とした。καίは追加の意味を自然に表す「また…も」とした。
theological_decisions:
- issue: 例外節のπορνείαの意味
  choice: 「性的不品行」と広く訳す
  alternative: 「姦淫」「淫行」「性的な不貞」と狭く、または特定的に訳す
  rationale: πορνείαはμοιχεία（姦通）と同一範囲に限定できない広い語であるため、特定の教派的理解に絞らず、原語の幅を保つ。訳語の可能性は脚注に示した。
- issue: 末尾の節 καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται の本文採用
  choice: 本文に含め、異読を脚注で示す
  alternative: 一部写本に従って省く
  rationale: 指定されたSBLGNT本文には異読標識付きで収録されているため訳文に含め、写本上の不確かさを脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言としての重みを保った。「離縁」より日常的に理解しやすい「離婚」を採用し、例外節は原文の語彙的・神学的な幅を狭めないようにした。
