reference: Matthew 19:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: ja
  text: すると、見よ、ある人がイエスに近寄って言った。「先生、永遠の命を得るためには、どんな善いこと[a]をすればよいのでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どんな善い行い」とも訳せる。ギリシア語の τί ἀγαθὸν は「どんな善いこと」を意味し、「する」と結び付いて「どんな善い行い」を指すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίによる物語の進行を「すると」で示し、ἰδούの注意喚起と場面の生き生きした提示を「見よ」で保持した。
- source_word: εἷς
  choice: ある人
  rationale: 直訳的な「一人」を不自然にせず、現代日本語で人物を初めて導入する自然な表現とした。この節だけでは語られていない富や年齢は補わない。
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: イエスに近寄って言った
  rationale: アオリスト分詞による、近寄ってから話すという順序を保った。日本語では相手を明確にするため、文脈上のαὐτῷの指示対象を「イエス」とした。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 教師・教える者への呼びかけとして、現代日本語で自然かつ敬意を含む語を選んだ。
- source_word: τί ἀγαθὸν
  choice: どんな善いこと
  rationale: 中性単数の開かれた表現を保ち、特定の善行に限定しない。「善い行い」も文脈上可能なので脚注に示した。
- source_word: ποιήσω
  choice: すればよいのでしょうか
  rationale: 熟慮的なアオリスト接続法の問いを、義務を過度に強めず、実際に何を行うべきかを尋ねる自然な日本語で表した。
- source_word: ἵνα σχῶ
  choice: 得るためには
  rationale: ἵναの目的の力を明示した。σχῶは字義的には「持つ」に対応するが、この文脈では「命を得る」が自然で、獲得に至る含みも表せる。
- source_word: ζωὴν αἰώνιον
  choice: 永遠の命
  rationale: 意味が明瞭で定着した訳語を用い、時間的な永続性と終末的な命の含意を一方に限定しなかった。
theological_decisions:
- issue: 話し手の身元をこの節でどこまで明示するか
  choice: ある人
  alternative: 一人の男／金持ちの青年
  rationale: 本文のεἷςだけに従い、後続文脈や並行箇所から富、性別表現、年齢を先取りして加えない。
- issue: 行為と永遠の命との関係をどう表すか
  choice: 永遠の命を得るためには、どんな善いことをすればよいのでしょうか
  alternative: 永遠の命を受け継ぐには、何をすべきでしょうか
  rationale: 質問者が善いことを行うことと永遠の命を結び付けて尋ねている緊張をそのまま残し、功績、行いによる救い、恵みなどについて本文にない結論を訳文へ加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、ἰδούは物語上の注意喚起を保つため、やや格調のある「見よ」とした。「いのち」ではなく一般的な漢字表記の「命」を用いた。
