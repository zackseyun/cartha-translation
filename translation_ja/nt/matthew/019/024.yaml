id: MAT.19.24
reference: Matthew 19:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: ja
  text: もう一度、あなたがたに言います。裕福な人が神の国に入るよりも、らくだ[a]が針の穴を通るほうが容易です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「綱」と解する説もありますが、ここのギリシア語本文は「らくだ」となっています。
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ
  choice: もう一度
  rationale: πάλινの反復の意味を明確に表す。δέはここでは弱い接続であり、日本語として不自然な接続詞を加えずに訳した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接的な語りかけを、明快で自然な現代日本語で表した。
- source_word: εὐκοπώτερόν ἐστιν
  choice: ほうが易しいのです
  rationale: 二つの不定詞句を比較する構文を、日本語で自然な「よりも……ほうが易しい」とした。
- source_word: κάμηλον
  choice: らくだ
  rationale: 本文のギリシア語κάμηλοςは「らくだ」を意味する。誇張された比喩の強さを弱めず、そのまま訳した。
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: 針の穴を通る
  rationale: 縫い針の糸を通す穴を指す表現。「針の穴」は簡潔で、現代日本語でも明瞭である。
- source_word: πλούσιον
  choice: 裕福な人
  rationale: 富を持つ人を指す形容詞の名詞的用法。日本語では性別を不必要に限定せず、意味を正確かつ自然に表した。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国に入る
  rationale: 中心的な聖書表現βασιλεία τοῦ θεοῦを「神の国」とし、εἰςとεἰσελθεῖνの方向性を自然な「に入る」で表した。
theological_decisions:
- issue: らくだと針の穴の比喩の解釈
  choice: 人間的には極度に困難であることを示す、意図的で強烈な誇張表現としてそのまま訳す。
  alternative: エルサレムにあったとされる「針の穴」という門への言及と解する、または「らくだ」を「綱」と読み替える。
  rationale: ギリシア語本文は、らくだが縫い針の穴を通るという鮮烈な像を明瞭に示している。特定の門への寓意化や「綱」への変更を支持する本文上の根拠はなく、文脈上の神学的緊張を弱めずに保った。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「金持ち」よりやや中立的で自然な「裕福な人」を用い、比喩の衝撃はそのまま保持した。
