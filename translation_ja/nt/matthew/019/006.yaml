id: MAT.19.6
reference: Matthew 19:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: ja
  text: こうして、二人はもはや二人ではなく、一つの肉である。だから、神が結び合わせたものを、人は引き離してはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: こうして
  rationale: 直前の「二人が一つの肉となる」という引用から導かれる結果を、現代日本語で自然に示す。
- source_word: οὐκέτι εἰσὶν δύο
  choice: 二人はもはや二人ではなく
  rationale: οὐκέτιの状態の変化を「もはや」で表し、δύοとμίαの対照を明確に保つ。文脈上、二人の人物を指すため、最初のδύοも「二人」とした。
- source_word: σὰρξ μία
  choice: 一つの肉
  rationale: 創世記の結婚の言葉との結び付きを保つため、「一つの体」などに言い換えず、原文の比喩を訳出する。
- source_word: ὃ οὖν
  choice: だから、…ものを
  rationale: οὖνの推論を「だから」で示し、中性関係代名詞ὃは、神が成立させた結び付きを指す「もの」として自然に表す。
- source_word: συνέζευξεν
  choice: 結び合わせた
  rationale: 元来「共にくびきにつなぐ、結合する」を意味する動詞を、結婚の文脈に合う自然な日本語で表す。完了した行為そのものは日本語の過去形で十分に示される。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 特定の男性ではなく人間一般を指す単数の総称用法であるため、日本語で同じく包括的に用いられる「人」とする。
- source_word: μὴ χωριζέτω
  choice: 引き離してはならない
  rationale: μήを伴う現在命令形の禁止を明確に表し、結び合わされたものを分離するという対照も保つ。
theological_decisions:
- issue: σὰρξ μίαにある創世記の結婚表現
  choice: 「一つの肉」として保持する
  alternative: 「一つの体」「一体」
  rationale: 字義的な像と創世記への相互本文的なつながりを保ち、結婚の結合について原文以上の説明を加えないため。
- issue: ἄνθρωποςの総称的な範囲
  choice: 「人」と訳し、すべての人間に及ぶ禁止として表す
  alternative: 「男」「誰も」
  rationale: 原語は文法上単数だが、ここでは神が結び合わせたものを分ける人間一般を指す。「男」では日本語で男性に限定される誤解を生み、「誰も」は意味を明示する一方で語形からやや離れる。
- issue: 神の行為と人間への禁止の関係
  choice: 「神が結び合わせたものを、人は引き離してはならない」
  alternative: 「神が結び合わせた二人を、誰も離婚させてはならない」
  rationale: ὃの指示対象を「もの」として保ち、χωρίζωを法的な離婚だけに限定せず、原文の簡潔さと意味の幅を維持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうして」と「だから」により、前文からの結果とそこから導かれる命令を区別した。「一つの肉」は日常語として多少非慣用的だが、聖書間の響きと原文の比喩を優先した。
