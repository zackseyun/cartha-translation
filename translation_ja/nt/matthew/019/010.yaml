  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: ja
  text: 弟子たちはイエスに言った。「もし、男と妻との関係がそのようなものなら、結婚しないほうがよい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ οἱ μαθηταί
  choice: 弟子たちはイエスに言った
  rationale: 歴史的現在を日本語の自然な物語時制で訳した。代名詞の指示対象を明確にするため「彼」ではなく「イエス」とした。μαθηταίは福音書で定着した「弟子」とした。
- source_word: Εἰ οὕτως ἐστὶν
  choice: もし…そのようなものなら
  rationale: 直前の教えを受けた条件表現として、οὕτωςの指示・推論の力を自然な日本語で保った。
- source_word: ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: 夫と妻との関係
  rationale: αἰτίαはここでは厳密な「原因」よりも事情・状態・関係を指す。婚姻文脈に即してἀνήρ相当の文脈的男性とγυνήを「夫」「妻」とし、簡潔な日本語にした。
- source_word: οὐ συμφέρει
  choice: …しないほうがよい
  rationale: συμφέρειの有益・有利であるという意味を、弟子たちの実際的判断として現代日本語に自然に表した。「益にならない」より文脈に適する。
- source_word: γαμῆσαι
  choice: 結婚する
  rationale: 婚姻に入ることを表す不定詞を、標準的な現代日本語で訳した。
theological_decisions:
- issue: τοῦ ἀνθρώπου μετὰ τῆς γυναικόςの性別と婚姻関係
  choice: 夫と妻との関係
  alternative: 人とその配偶者との関係
  rationale: 直前の文脈は男性と妻について述べており、原文の性別を中性化せず、婚姻上の関係を明示した。
- issue: 弟子たちの結論におけるοὐ συμφέρειの強さ
  choice: 結婚しないほうがよいでしょう
  alternative: 結婚することは益になりません
  rationale: 絶対的な禁止や神学的規範にせず、結婚は割に合わないという弟子たちの実際的な判断を保った。文末の「でしょう」は発話としての判断を自然に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文として落ち着いた語調を保った。αἰτίαの圧縮された表現は「関係」として自然化し、οὐ συμφέρειは慣用的に「しないほうがよい」とした。
