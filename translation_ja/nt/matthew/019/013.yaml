id: MAT.19.13
reference: Matthew 19:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: ja
  text: その時、子どもたちがイエスのもとに連れて来られた。イエスが子どもたちに手を置き、祈るためであった。しかし、弟子たちは彼らを叱った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼ら」は、子どもたちを指すとも、子どもたちを連れて来た人々を指すとも取れる。
    reason: 原文の代名詞の指示対象に曖昧さがあるため。
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 物語の展開における時間的なつながりを、自然で簡潔な日本語で示す。
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: 子どもたちがイエスのもとに連れて来られた
  rationale: アオリスト受動態を保ちつつ、αὐτῷの指示対象を文脈に即して「イエス」と明示した。「子どもたち」は年齢を必要以上に限定しない。
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται
  choice: イエスに手を置いて祈っていただくためであった
  rationale: ἵναの目的を明示し、按手と祈りを自然な日本語で表した。προσεύξηταιには目的語が明記されていないため、「彼らのために」とは補わなかった。日本語の「手を置く」は単複を通常区別しないが、原文の行為を適切に伝える。
- source_word: οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς
  choice: しかし、弟子たちは彼らを叱った
  rationale: δέの対照を「しかし」で表し、ἐπιτιμάωの強い制止・非難を平明な「叱った」で伝えた。最後のαὐτοῖςは「彼ら」として指示対象の曖昧さを残した。
theological_decisions:
- issue: 最後のαὐτοῖςが指す対象
  choice: 「彼ら」として曖昧さを保持する
  alternative: 「子どもたち」または「子どもたちを連れて来た人々」と特定する
  rationale: ギリシア語の複数代名詞は、子どもたちを指すとも、連れて来た人々を指すとも解釈できる。本文で一方に限定せず、注で両方の可能性を示した。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある叙述体。「彼ら」は日常語としてやや硬いが、原文にある指示対象の曖昧さを保つために採用した。
