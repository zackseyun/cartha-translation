id: MAT.19.1
reference: Matthew 19:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: ja
  text: さて、イエスはこれらのことばを語り終えると、ガリラヤを去り、ヨルダン川の向こう側[a]のユダヤ地方へ行かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨルダン川を越えた先」。
    reason: πέραν は、基準となる側から見た「向こう側」または「越えた先」を意味し得るため。
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: さて、…すると
  rationale: マタイに特徴的な物語の移行表現。ギリシア語の形式を不自然に直訳せず、出来事の推移と後続行為との時間関係を明確にした。
- source_word: ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους
  choice: イエスはこれらのことばを語り終える
  rationale: ἐτέλεσεν の完了した動作を「終える」で表し、λόγους が直前の教えを指すことを「これらのことば」で保持した。「語り」を補うことで現代日本語として自然にした。
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: ガリラヤを去り
  rationale: μεταίρω の場所を離れて移動する意味を、簡潔で格調を損なわない「去る」で表した。
- source_word: ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας
  choice: ユダヤ地方へ行かれた
  rationale: ὅρια はここでは境界線そのものより領域・地方を指す。「行かれた」は日本語の視点に自然であり、イエスへの穏当な敬意も保つ。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ヨルダン川の向こう側
  rationale: πέραν の空間的意味を自然に表した。日本語読者に地理的対象が明確になるよう「川」を補った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔で品位ある調子にした。原文の語順を機械的に移さず、行為の順序と地理的関係を自然に伝えた。
