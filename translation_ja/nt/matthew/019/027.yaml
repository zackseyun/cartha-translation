review_pass:
  verdict: revise
  source_fidelity: 「何もかも捨てて」はἀφήκαμεν πάνταをよく表し、「ご覧ください」もἸδοὺの注意喚起を自然に伝えている。しかし、「何をいただけるのでしょうか」はτί ἄρα ἔσται ἡμῖν（直訳すれば「では、私たちには何がある／あることになるのか」）を、イエスから何かを受け取る問いへとやや限定する。また「従って来ました」は継続的な歩みを示しうるため、アオリストの簡潔な叙述には「従いました」がより近い。
  naturalness: 全体として明瞭で現代標準語として自然である。「それでは、私たちには何があるのでしょうか」はやや直訳調だが、問いの開放性を保ち、文脈上も理解可能である。
  terminology: 「ペテロ」「イエス」は標準的な固有名表記である。敬意を示す「ご覧ください」「いただける」調のうち、後者は受益者・授与者関係を明示しすぎるため改める。
  issues:
  - severity: medium
    issue: 結びの問いが「いただける」とされている。
    rationale: 原文は「私たちに何があることになるのか」という開かれた未来の問いであり、授与行為や受領物を明示していない。前後の文脈には報いの含意があるが、訳文でそれを固定しない方が原文の表現を保てる。
  - severity: low
    issue: 「従って来ました」が継続的な経過を含意しうる。
    rationale: ἠκολουθήσαμενはここでは「従った」というアオリストの叙述である。「従いました」は余分な時間的含意を避けつつ自然である。
