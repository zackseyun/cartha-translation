  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: ja
  text: その時、ペテロがイエスに言った。「ご覧ください。私たちは何もかも捨てて、あなたに従いました。それでは、私たちには何があるのでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 直前の出来事を受ける時間的・物語的なつながりを自然に示す。
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: 言った
  rationale: セム語的用法を反映したギリシア語の定型表現であり、日本語で「答えて言った」と重ねるより自然。ただし文脈への応答性は保たれる。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 注意を促す語の力を保ちつつ、ペテロがイエスに語る場面にふさわしい丁寧さを示す。
- source_word: ἀφήκαμεν πάντα
  choice: 何もかも捨てて
  rationale: πάνταの包括性と、ἀφίημιの『後に残す・手放す』意味を、文脈に即した自然な日本語で表す。
- source_word: ἠκολουθήσαμέν σοι
  choice: あなたに従って来ました
  rationale: アオリスト形が述べる実際の追従を表し、日本語の「従って来ました」により、それまで続いてきた歩みも自然に伝える。
- source_word: τί ἄρα ἔσται ἡμῖν;
  choice: それでは、私たちは何をいただけるのでしょうか
  rationale: 直訳的には『では、私たちには何があるのか』。直前の財産放棄と報いを問う文脈から、与えられるものを尋ねる意味を自然な敬語で表す。
theological_decisions:
- issue: 弟子たちへの報いを問う表現
  choice: 「私たちは何をいただけるのでしょうか」
  alternative: 「私たちには何があるのでしょうか」
  rationale: 報いの内容を先取りして特定せず、τίと未来形ἔσταιの開かれた問いを保つ一方、与格ἡμῖνの受益的な意味を日本語で明瞭にした。
translation_notes:
  register: 明瞭で現代的ながら品位ある会話文。「ご覧ください」「いただけるのでしょうか」により、イエスに対する発話として自然な敬意を表した。固有名は一般的な日本語聖書表記の「ペテロ」を採用した。
