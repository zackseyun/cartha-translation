id: MAT.19.30
reference: Matthew 19:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ja
  text: しかし、先の者の多くは後になり、後の者は先になる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「しかし、多くの先の者が後に、後の者が先になる」。原文は非常に簡潔な格言調で、「先」と「後」が何の順位や立場を指すかは、この節だけでは限定されていない。
    reason: 原文の簡潔な構文と意味範囲を示すため。
lexical_decisions:
- source_word: πολλοὶ
  choice: 多く
  rationale: 形容詞が名詞的に用いられ、特定されない多数の人を指す。日本語では「先の者の多く」として、人数についての表現であることを明確にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の議論を受けた穏やかな対照を示すため、現代日本語で自然な「しかし」とした。
- source_word: ἔσονται
  choice: なる
  rationale: 未来の状態変化を、日本語の文脈上自然な非過去形「なる」で表した。ことわざ的な一般性と将来的含意の双方を保てる。
- source_word: πρῶτοι
  choice: 先の者／先
  rationale: 時間的順序だけに限定せず、順位や立場も含みうる簡潔な対語として「先」を用いた。
- source_word: ἔσχατοι
  choice: 後／後の者
  rationale: πρῶτοιとの直接的な対照を保ち、順位や立場の逆転を特定の領域に限定しない表現とした。
- source_word: πολλοὶ … πρῶτοι ἔσχατοι
  choice: 先の者の多くは後になり
  rationale: πολλοὶが人の多数を示すことを自然な日本語で表しつつ、原文の簡潔な述語関係を保った。
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: 後の者は先になる
  rationale: 原文では二つ目の節の動詞が省略されているが、日本語では補わないと不自然になりやすいため「なる」を補い、対句の明瞭さを保った。
theological_decisions:
- issue: 逆転の言葉が指す範囲
  choice: 順位や立場の逆転を語る一般的な格言として訳し、その具体的範囲を限定しない。
  alternative: 救いへの加入、弟子への報い、社会的地位、終末における順位のいずれかに特定する。
  rationale: この節自体は逆転が何について起こるかを明示していないため、文脈にある神学的緊張と広がりを訳文に残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、原文の簡潔で格言的な対句を保った。「者」は日常会話よりやや格調があるが、聖書本文として自然であり、過度に古風ではない。
