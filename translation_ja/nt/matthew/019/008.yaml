id: MAT.19.8
reference: Matthew 19:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたの心のかたくなさのために[a]、モーセはあなたがたが妻と離婚することを許した[b][c]。しかし、初めからそうではなかった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたが心をかたくなにしているために」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたがたの妻たちを去らせること」。この文脈では離婚を意味する。
    reason: lexical_alternative
  - marker: c
    text: すなわち、この許可は創造の初めからのあり方を示すものではなかった。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: イエスは彼らに言われた
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去形で訳した。主語は文脈上のイエスを明示し、「言われた」によって現代の聖書文として自然で品位ある敬語表現とした。
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: あなたがたの心のかたくなさのために
  rationale: πρός＋対格がここで表す理由・事情を「ために」で示し、σκληροκαρδίαの聖書的な身体比喩を「心のかたくなさ」として保った。
- source_word: ἐπέτρεψεν
  choice: 許した
  rationale: 命令や是認ではなく、許可を与えたことを表す動詞なので「許した」とした。
- source_word: ἀπολῦσαι
  choice: 離縁する
  rationale: 一般的には「去らせる、解放する」だが、婚姻をめぐるこの文脈では離婚を意味する。「離縁する」は法的・関係的意味を明確にしつつ、本文の品位にも合う。
- source_word: τὰς γυναῖκας ὑμῶν
  choice: 自分の妻
  rationale: γυνήは「女」または「妻」を意味し得るが、ここでは婚姻と離縁の議論なので「妻」が適切である。複数の聞き手それぞれの妻を指すため、日本語では「自分の妻」とした。
- source_word: ἀπ’ ἀρχῆς
  choice: 初めから
  rationale: 直前の創造への言及を響かせながら、原文どおり簡潔に訳した。
- source_word: οὐ γέγονεν οὕτως
  choice: そうだったのではない
  rationale: γίνομαιの完了形が示す成立した事態・あり方を、過度に説明せず自然な日本語で表した。「神の意図ではない」などの解釈を本文に加えていない。
theological_decisions:
- issue: モーセの措置を命令・是認・許可のどれとして表すか
  choice: モーセは……許した
  alternative: モーセは……命じた
  rationale: ἐπέτρεψενは許可を表し、命令を意味しない。人の心のかたくなさを踏まえた措置であるという、イエスの議論の緊張を保った。
- issue: 創造への訴えを本文でどこまで明示するか
  choice: しかし、初めからそうだったのではない
  alternative: しかし、それは初めからの神のご計画ではなかった
  rationale: 直前の文脈は創造を指すが、この節自体は「初めからそうではなかった」とだけ述べる。本文では含意を説明的に展開せず、原文の簡潔さを保った。
- issue: σκληροκαρδίαを心理的頑固さとして意訳するか、聖書的比喩を残すか
  choice: 心のかたくなさ
  alternative: 頑固さ
  rationale: 単なる性格上の頑固さに狭めず、神への応答を含み得る原語の比喩と神学的含みを保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、会話として読める自然さと聖書本文としての品位を両立させた。「離縁」は「離婚」よりやや改まった語だが、婚姻関係を解くという文脈に明確で、一般読者にも理解可能である。
