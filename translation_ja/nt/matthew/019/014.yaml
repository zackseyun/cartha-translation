id: MAT.19.14
reference: Matthew 19:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: ja
  text: しかし、イエスは言われた。「子どもたちを、わたしのところに来させなさい。妨げてはいけません。天の御国は、このような者たち[a]のものだからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「このような者たちのものである」。これは、そこにいた子どもたちだけでなく、そのような種類の人々をも指し得るが、本文はその性質を具体的に説明していない。
    reason: lexical_alternative_and_ambiguity
lexical_decisions:
- source_word: Ἄφετε
  choice: 来させなさい
  rationale: ここでのἀφίημιは「去らせる」ではなく、子どもたちが来ることを許すよう命じる用法である。後続の「わたしのところに来る」と自然につながる日本語にした。
- source_word: τὰ παιδία
  choice: 子どもたち
  rationale: παιδίαは幼い子どもを指し得るが、この節だけから年齢を必要以上に限定せず、自然で広く通じる表現とした。
- source_word: μὴ κωλύετε
  choice: 妨げてはいけません
  rationale: κωλύωの「妨げる、阻む、禁じる」という意味を、行為の進行状況を過度に特定せずに表した。
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: わたしのところに来るのを
  rationale: κωλύωと不定詞の構文を、日本語で自然な「来るのを妨げる」とした。πρός μεの方向性と対人的な意味を保っている。
- source_word: τῶν γὰρ τοιούτων
  choice: このような者たちのものだから
  rationale: τοιούτωνは目の前の子どもたちだけでなく、そのような種類・あり方の者を含み得る。「このような者たち」として、その代表的な含みを保持した。
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の御国
  rationale: マタイに特徴的な表現を、現代日本語の聖書文体として明瞭かつ尊厳のある定訳的表現で示した。
- source_word: ἐστὶν
  choice: ものです
  rationale: 属格を伴うἐστὶνを直訳的な「…である」だけにせず、所有・帰属を自然に示す「…のもの」とした。ただし脚注に直訳を示した。
theological_decisions:
- issue: イエスの言葉が実際の子どもだけを指すのか、子どもたちに代表されるような人々をも指すのか
  choice: 「このような者たち」と訳し、目前の子どもたちと、同じような者たちの双方を含み得る表現にする。
  alternative: 「この子どもたちのもの」と狭く訳す、または「子どものような者たちのもの」と解釈を明示する。
  rationale: τοιούτωνは特定の子どもたちを越えた類型的な指示を持つ一方、何の性質が問題なのかを本文は明示しない。そのため、子どもらしさの内容を訳文で補わず、神学的な緊張と曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、直接話法には穏やかだが権威ある敬体を採用した。「天の御国」はマタイの特徴的表現として保持した。脚注記号[a]は対応する箇所に置いた。
