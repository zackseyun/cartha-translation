id: MAT.19.5
reference: Matthew 19:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: ja
  text: そして、こう言われた。「それゆえ、男は父と母を離れ、妻と結ばれ[a]、二人は一つの肉となる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「妻と固く結びつき」。このギリシア語動詞は、密接に結び合わされることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: それゆえ
  rationale: 前の内容を受けて理由・帰結を示す表現として、簡潔で格調のある現代日本語を用いた。
- source_word: καταλείψει
  choice: 離れ
  rationale: 未来形の趣旨を文全体の一般的・規範的な言い方の中で自然に表し、父母との関係を断絶するという過剰な含意は加えない。
- source_word: ἄνθρωπος
  choice: 男
  rationale: 一般的な「人」ではなく、続く「妻」と対をなす結婚文脈の男性を指すため、性別を明示した。
- source_word: κολληθήσεται
  choice: 結ばれ
  rationale: 受動形と、密接に結合する意味を自然な日本語で表した。密着・固着という語感を直訳しすぎず、結婚の結びつきを保っている。
- source_word: γυναικὶ αὐτοῦ
  choice: 妻
  rationale: γυνήは文脈により「女」または「妻」を意味するが、ここでは明確に婚姻関係を指す。日本語では「その妻」より「妻」が自然で、所有関係も文脈上明白である。
- source_word: οἱ δύο
  choice: 二人
  rationale: 原文が二者を明示しているため、省略せず保持した。
- source_word: εἰς σάρκα μίαν
  choice: 一つの肉となる
  rationale: 創世記引用の身体的・関係的な比喩を保持し、「一体となる」と意訳してσάρξを消さないようにした。「となる」でεἰςが示す結果を表した。
theological_decisions:
- issue: 結婚に関する引用における性別表現
  choice: 男……妻
  alternative: 人……配偶者
  rationale: 本文は抽象的な人類一般ではなく、男とその妻という組み合わせを述べているため、原文の性別を保った。
- issue: 婚姻による結合の表現
  choice: 二人は一つの肉となる
  alternative: 二人は一体となる／二人は一つの肉である
  rationale: 「一つの肉」という原文の比喩と神学的な緊張を保持しつつ、ἔσονται εἰςが示す結果・移行を「となる」で表した。
translation_notes:
  register: 明瞭で現代的ながら、聖書引用にふさわしい簡潔で品位ある文体とした。「一つの肉」は説明的に言い換えず、原文の比喩を保持した。
