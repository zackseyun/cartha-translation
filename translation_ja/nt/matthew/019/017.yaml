id: MAT.19.17
reference: Matthew 19:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: ja
  text: すると、イエスは彼に言った[a]。「なぜ、何が善いかをわたしに尋ねるのですか。善い方はただひとりです[b]。しかし、いのちに入りたいのなら、戒めを守りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、また並行箇所では、「なぜ、わたしを善いと言うのか。善い方は、ただひとり、神だけである」とあります。SBLGNTのマタイ本文は、「なぜ、何が善いかをわたしに尋ねるのか。善い方はただひとりである」となっています。
    reason: textual_variant
  - marker: b
    text: 直訳に近くすれば、「ひとりが善い方です」。また、「善い方はひとりです」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: なぜ、何が善いかをわたしに尋ねるのですか
  rationale: 中性単数 τοῦ ἀγαθοῦ を、人を指す「善い方」ではなく、「何が善いか」という内容として訳した。マルコ、ルカの並行箇所に合わせず、マタイ本文の構文を保っている。
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: 善い方はただひとりです
  rationale: 名詞的に用いられた ὁ ἀγαθός を「善い方」とし、εἷς の唯一性を自然な現代日本語で「ただひとり」と表した。誰を指すかは本文で補わず、原文の含みを残した。
- source_word: εἰ δὲ θέλεις
  choice: しかし、…たいのなら
  rationale: θέλεις の意志・願望を自然な条件表現「…たいのなら」で表し、δέ の軽い対照を「しかし」で示した。
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: いのちに入る
  rationale: 終末的な充実した命を含意しうる表現だが、この句自体に「永遠の」はないため補わなかった。聖書的な重みを保つため「いのち」と表記した。
- source_word: τήρησον τὰς ἐντολάς
  choice: 戒めを守りなさい
  rationale: 命令に関する τηρέω の通常の意味を「守る」、神の命令を指す ἐντολάς を「戒め」とした。簡潔で現代日本語としても明瞭である。
theological_decisions:
- issue: イエスの発言と神の善性・キリスト論との関係
  choice: マタイの本文どおり、「何が善いか」についての問いと「善い方はただひとり」という応答として訳す。
  alternative: マルコ、ルカの並行箇所に合わせて「なぜ、わたしを善いと言うのか。神おひとりのほかに善い者はいない」と訳す。
  rationale: SBLGNTのマタイ本文は並行箇所とは異なる。イエスの善性を否定するとも、逆にここで明示的に神性を宣言するとも訳文で決めつけず、本文の神学的緊張と指示対象の含みを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言には丁寧で威厳ある語調を保った。「生命」より聖書的文脈になじむ「いのち」、「命令」より宗教的な重みのある「戒め」を採用した。
