id: MAT.19.12
reference: Matthew 19:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: ja
  text: 母の胎内からそのように生まれた宦官もいれば、人の手で宦官にされた者もおり、天の御国のために自らを宦官にした者もいる[a]。このことを受け入れることのできる者は、受け入れなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自ら去勢した」。多くの解釈者は、天の御国のために結婚を断念し、独身を選ぶことの比喩だと理解している。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「受け止めることのできる者は、受け止めなさい」または「心に収めることのできる者は、心に収めなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: 宦官
  rationale: 原語の反復と三つの類型のつながりを保つため、全体を通して同じ語で訳した。「独身者」とすると第三の類型についての比喩的解釈を本文に織り込むことになるため避けた。
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: 母の胎内からそのように生まれた
  rationale: 「母の胎内から」という原文の生き生きとした表現を保ちつつ、οὕτωςを自然な現代日本語の「そのように」で表した。
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: 人の手で宦官にされた
  rationale: 名詞「宦官」と動詞の語彙的な結びつきを保った。「人の手で」は行為者を表すὑπόの意味を自然に伝える。
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: 自らを宦官にした
  rationale: 原文の衝撃的で曖昧な言い方をそのまま保ち、文字どおりの自己去勢か、結婚を断念して独身を選ぶことの比喩かを本文で決めつけない。
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: 天の御国のために
  rationale: διά＋対格が表す目的・動機を簡潔に示した。「天の御国」はマタイに特徴的な表現の神学的な重みを保つ。
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: このことを受け入れることのできる者は、受け入れなさい
  rationale: χωρέωの「受け入れる、心に収める」という文脈上の意味と命令の力を、明瞭な現代日本語で表した。補った「このこと」は直前から続く難しい教えを指す。
theological_decisions:
- issue: εὐνούχισαν ἑαυτοὺςを文字どおりに取るか、比喩的に取るか
  choice: 本文では「自らを宦官にした」と原語に即して訳し、解釈を確定しない。
  alternative: 「自ら去勢した」または「天の御国のために独身を選んだ」
  rationale: 原文自体は、文字どおりの行為、誇張的表現、結婚を断念することの比喩のいずれであるかを明示していない。神学的緊張を保ち、代表的な理解を注で示す。
- issue: ὁ δυνάμενος χωρεῖν χωρείτωの解釈
  choice: 「このことを受け入れることのできる者は、受け入れなさい」
  alternative: 「受け止めることのできる者は、受け止めなさい」または「心に収めることのできる者は、心に収めなさい」
  rationale: 単なる知的理解よりも、難しい教えを受容するという含みを伝えながら、誰がそれをなし得るかという限定と勧告の両方を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの言葉の厳粛さと反復を保った。「宦官」は日常語としてやや硬いが、原語の具体性と三つの類型にわたる語の反復を保持するために採用した。英語相談層の脚注記号は配置と内容が対応していなかったため、自己を宦官にする句に[a]、最後の勧告に[b]を付して内容との対応を正した。
