id: MAT.19.28
reference: Matthew 19:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: ja
  text: イエスは彼らに言われた。「まことに、あなたがたに言います。わたしに従ってきたあなたがたは、新たにされる時[a]、人の子がご自身の栄光の王座に着くとき、あなたがたも十二の王座に着き、イスラエルの十二部族を裁きます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「再生において」。個人の新生よりも、人の子の王座への着座に伴う将来の刷新を指すと考えられる。「新しい世界で」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「裁く」には、ここでは「治める」「統治する」という意味合いも含まれ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: まことに
  rationale: 権威ある厳粛な宣言を導く定型句として、現代日本語で自然かつ格調を保つ。
- source_word: ἀκολουθήσαντές μοι
  choice: わたしに従ってきたあなたがた
  rationale: イエスに従った者たちを特定するアオリスト分詞の働きを表しつつ、これまでの歩みを自然な日本語で示す。
- source_word: ἐν τῇ παλιγγενεσίᾳ
  choice: 新しく造り直される時
  rationale: 個人の新生に限定せず、人の子の即位に結びつく将来の刷新を表す。名詞を時間的な表現にして日本語として明瞭にした。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 聖書的称号として定着した訳を用い、ダニエル書を背景とする響きを保つ。
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: その栄光の座に
  rationale: 属格表現の荘重さを保ちながら、自然な日本語とした。
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: あなたがたも……座に着き
  rationale: καίの「も」と、弟子たち自身への強調を自然に反映する。
- source_word: κρίνοντες
  choice: 裁きます
  rationale: 第一義的な司法的意味を保持し、統治という含意だけに狭めない。
theological_decisions:
- issue: παλιγγενεσίαの意味
  choice: 人の子の即位に伴う将来の刷新
  alternative: 個人の新生／新しい世界／再生
  rationale: 文脈は個人の回心ではなく、将来の即位と裁きである。ただし特定の終末論体系には限定しない。
- issue: κρίνοντεςの範囲
  choice: 裁く
  alternative: 治める／統治する
  rationale: 語の直接的意味を本文に残し、統治権を含み得ることは脚注で示して解釈上の幅を保つ。
- issue: 十二の座と十二弟子の対応
  choice: 本文どおり「十二の座」とする
  alternative: 個々の弟子への割り当てを説明的に明示する
  rationale: ユダを含む十二弟子との関係など、本文が明示しない問題を訳文で解決しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい格調を保った。「王座」ではなく「座」として、同一節で反復される θρόνος の対応を維持した。
