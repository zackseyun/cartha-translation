  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: ja
  text: 彼らはイエスに言った。「それでは、なぜモーセは、離婚証書を渡し、妻を去らせるよう命じたのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: 彼らはイエスに言った
  rationale: 物語中の歴史的現在を、自然な日本語の過去形で表した。αὐτῷが文脈上イエスを指すため、代名詞ではなく固有の指示対象を明示した。
- source_word: Τί οὖν
  choice: それでは、なぜ
  rationale: 直前の発言に対する反論・問い返しの論理を自然に示す。
- source_word: Μωϋσῆς ἐνετείλατο
  choice: モーセは…命じた
  rationale: ἐντέλλομαιの命令の強さと、話者たち自身の主張の枠組みを保持した。次節のイエスの訂正を先取りして「許した」とはしない。
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: 離婚状を渡して
  rationale: 法的な離縁文書を意味する慣用句を、現代日本語で簡潔かつ明確に表した。
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: 妻を去らせる
  rationale: ἀπολύωの字義的な「去らせる／送り出す」を残しつつ、女性代名詞の指示対象を文脈に即して「妻」と明示した。離婚の法的意味は直前の「離婚状」によって明らかである。
theological_decisions:
- issue: パリサイ人たちの言葉を、次節のイエスの訂正に合わせて訳すか
  choice: 「命じた」を保持する
  alternative: 「許した」「認めた」
  rationale: 原文は明確に「命じた」と述べている。この節では相手側の主張をそのまま示し、モーセの譲歩だったという次節の区別を先取りしない。
- issue: ἀπολῦσαιを法的意味だけで訳すか
  choice: 「去らせる」と訳す
  alternative: 「離婚する」「離縁する」
  rationale: この議論で反復される「去らせる」という表現を保ち、「離婚状」との組み合わせによって離婚を指すことを示した。
translation_notes:
  register: 明瞭な現代標準日本語。問いの反論的な調子を「それでは、なぜ」で示し、法的文書は一般読者に分かりやすい「離婚状」とした。原文にない「私たちに」は補わない。
