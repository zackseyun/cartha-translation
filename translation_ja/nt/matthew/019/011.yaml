id: MAT.19.11
reference: Matthew 19:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: ja
  text: しかし、イエスは彼らに言った。「すべての人がこのことば[a]を受け入れることができるわけではない。受け入れることができるのは、それを与えられている[b]人たちだけだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この発言」「この教え」。
    reason: λόγος はここで、直前の発言または教えを指し得るため。
  - marker: b
    text: 「与えられている」という受動表現は、神が与え手であることを含意している可能性が高いが、ギリシア語では与え手が明示されていない。
    reason: 原文が明示しない神的受動の可能性を説明しつつ、本文ではその曖昧さを保つため。
lexical_decisions:
- source_word: εἶπεν
  choice: 言った
  rationale: 物語を導入する λέγω のアオリストとして、現代日本語で最も自然かつ簡潔な表現を採った。
- source_word: Οὐ πάντες
  choice: すべての人が…わけではない
  rationale: 全否定ではなく部分否定であることを、誤解のない自然な日本語で表した。
- source_word: χωροῦσι
  choice: 受け入れられる
  rationale: χωρέω の原義は「場所を空ける、収める」だが、λόγος を目的語とするここでは、そのことばを心に受け入れる、受容できるという意味を表す。
- source_word: τὸν λόγον τοῦτον
  choice: このことば
  rationale: 直前の発言または教えを指す。「ことば」は λόγος との語彙的対応を保ちつつ、文脈上も理解できる。
- source_word: ἀλλ’ οἷς
  choice: 受け入れられるのは、…人たちだけだ
  rationale: ἀλλά と関係節が示す限定的な対照を、自然な日本語の「だけ」で明示した。
- source_word: δέδοται
  choice: それを与えられている
  rationale: δίδωμι の完了受動形が示す、すでに与えられ、その結果が現在も続いている含意と、与え手を明示しない受動表現を保った。
theological_decisions:
- issue: δέδοται の暗黙の与え手
  choice: 本文では与え手を特定せず、「与えられている」と受動形を保つ。
  alternative: 「神からそれを与えられている」と、神を明示する。
  rationale: 文脈上は神を与え手とする神的受動表現と理解できるが、ギリシア語本文は主語を明示していないため、その含みと緊張を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、イエスの発言は簡潔で dignified な常体とした。部分否定を明確にしつつ、原文の受動表現と神学的含意を保持した。
