  source_fidelity: ギリシア語の物語的現在 λέγει を日本語の自然な物語時制「言った」で表し、αὐτῷ の指示対象を文脈上の「イエスに」と明示している。ὁ νεανίσκος は「青年」とされ、並行記事から「役人」などを補っていない。「そのすべては守ってきました」は Πάντα ταῦτα と ἐφύλαξα を、直前の戒め全体に関する自己申告として適切に表す。「私にはまだ何が足りないのでしょうか」は τί ἔτι ὑστερῶ の残る不足を問う意味を保っている。
  naturalness: 全体として明快な現代標準日本語であり、会話の丁寧さも文脈に適合する。「そのすべて」「守ってきました」「まだ何が足りないのでしょうか」は自然で理解しやすい。
  terminology: 「青年」は νεανίσκος に忠実であり、「守る」は戒めに対する φυλάσσω の標準的で適切な訳語である。訳文は青年の自己評価をそのまま報告し、肯定・否定や教理的評価を加えていない。
