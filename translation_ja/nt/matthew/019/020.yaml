id: MAT.19.20
reference: Matthew 19:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: ja
  text: 青年はイエスに言った。「そのすべては守ってきました[a]。私にはまだ何が足りないのでしょうか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのすべては実行してきました」。
    reason: φυλάσσωは、戒めを「守る」のほか「実行する、遵守する」とも表せるため。
  - marker: b
    text: 別訳「私はまだどの点で及ばないのでしょうか」。
    reason: ὑστερέωには「足りない」のほか「及ばない、欠けている」という意味合いがあるため。
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は物語的現在だが、現代日本語の自然な物語文として過去形で表した。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 代名詞の指示対象を文脈に即して明示し、日本語で自然にした。
- source_word: ὁ νεανίσκος
  choice: 青年
  rationale: νεανίσκοςは若い男性を指す。「役人」など並行記事由来の情報は加えない。
- source_word: Πάντα ταῦτα
  choice: そのすべて
  rationale: 直前に挙げられた戒め全体を指すことが明確で、簡潔な現代日本語である。
- source_word: ἐφύλαξα
  choice: 守ってきました
  rationale: 戒めを守るという意味を保ちつつ、過去から現在までの行いについて述べる発言として自然に表した。
- source_word: τί ἔτι ὑστερῶ
  choice: 私にはまだ何が足りないのでしょうか
  rationale: ὑστερέωの「欠けている、不足している」という意味を、問いとして自然かつ丁寧に表した。
theological_decisions:
- issue: 戒めに従ってきたという自己評価
  choice: 青年の主張をそのまま提示し、翻訳上は肯定も否定もしない。
  alternative: 誠実だが誤った主張、または誇張された主張であることを訳文に示す。
  rationale: ギリシア語本文は青年の言葉を直接提示するだけで、その真偽への評価はこの節自体に明示されていないため、神学的緊張を保持した。
translation_notes:
  register: 明快で現代的な標準語を用い、青年の丁寧な問いとして「です・ます」調にした。地の文は自然な日本語の物語時制を採用した。
