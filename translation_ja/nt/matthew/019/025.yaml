id: MAT.19.25
reference: Matthew 19:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: ja
  text: 弟子たちはこれを聞いて、非常に驚き、「それでは、いったいだれが救われることができるのですか」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞いて
  rationale: アオリスト分詞を、主動詞に先立つ状況として自然な日本語にした。「これ」は直前のイエスの発言を指す文脈上の補足である。
- source_word: δὲ
  choice: 明示しない
  rationale: 軽い継続または対照を示すが、「これを聞いて」という導入だけで日本語のつながりが自然に伝わるため、接続語は置かなかった。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 福音書におけるイエスの弟子たちを指す標準的で明瞭な表現。
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: 非常に驚き
  rationale: 未完了過去の強い驚きの反応と、強意の副詞 σφόδρα を、現代日本語として自然に表した。
- source_word: λέγοντες
  choice: と言った
  rationale: 発話を伴う現在分詞を、日本語の物語文で自然な定動詞として訳した。
- source_word: Τίς ἄρα
  choice: それでは、いったいだれが
  rationale: ἄρα の推論的な意味を「それでは」で示し、驚きを帯びた問いの力を「いったい」で自然に伝えた。
- source_word: δύναται σωθῆναι
  choice: 救われることができる
  rationale: 能力を表す δύναται と受動不定詞 σωθῆναι の双方を明示し、救いの主体や仕組みを訳文で限定しないようにした。
theological_decisions:
- issue: σωθῆναι の文脈上の意味
  choice: 救われる
  alternative: 助け出される／救出される
  rationale: 直前の神の国に入ることについての議論を受けた問いであり、単なる一時的救出ではなく、より包括的な救いを指す。「救われる」は受動形を保ちつつ、その方法や仕組みを特定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話には驚きと推論が伝わる自然な表現を採用した。「救われることができる」はやや形式的だが、δύναται と σωθῆναι の区別を保つために選んだ。
