id: MAT.19.26
reference: Matthew 19:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: ja
  text: しかし、イエスは彼らを見つめて言われた。「人にはこれはできません。しかし、神にはすべてが可能です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: 見つめて
  rationale: 相手に視線を向ける動作を表す。単なる「見て」より意識的なまなざしを伝えつつ、過度に強めない自然な日本語とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の弟子たちの驚きと問いを受け、続く人間と神との対比を明確にする軽い逆接として訳した。
- source_word: εἶπεν αὐτοῖς
  choice: 言われた
  rationale: αὐτοῖςの相手は直前の「彼ら」で明白であり、日本語では「彼らに」を重ねずとも意味が保たれる。イエスへの敬意を示す自然な叙述として尊敬語を用いた。
- source_word: παρὰ ἀνθρώποις
  choice: 人には
  rationale: παρά＋与格が示す領域・側を、日本語で自然な「人には」とした。ἄνθρωποιςはここで人類一般を指し、性別を限定しない。
- source_word: τοῦτο
  choice: これは
  rationale: 直前に話題となった救いの可能性を指す指示語を、そのまま簡潔に保持した。
- source_word: ἀδύνατόν ἐστιν
  choice: できません
  rationale: 「不可能です」も可能だが、後半のδυνατάとの対照を自然な現代日本語で伝えるため「できません」とした。
- source_word: παρὰ δὲ θεῷ
  choice: しかし、神には
  rationale: 前半の「人には」と並行させ、同じπαρά＋与格の対比構造を保持した。
- source_word: πάντα δυνατά
  choice: すべてが可能です
  rationale: πάνταの包括性と、動詞を欠く簡潔な述語表現を保ち、神にあって可能であることを明瞭にした。
theological_decisions:
- issue: πάντα δυνατάの範囲
  choice: 「すべてが可能です」と包括的な表現を保持する
  alternative: 「救うことは可能です」と文脈に限定して明示する
  rationale: 文脈は人が救われる可能性についてだが、原文はπάνταという一般的で包括的な語を用いる。翻訳で対象を救いだけに限定せず、文脈と格言的な広がりの緊張を残した。
- issue: ἀνθρώποιςの一般性
  choice: 「人には」
  alternative: 「人間には」
  rationale: 原語は男性だけでなく人間一般を指す。「人には」は性別を限定せず、神との対比にも自然である。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言には自然な敬体を採用した。前半と後半の「人には／神には」という並行と対比を保ち、簡潔で格調ある文に整えた。
