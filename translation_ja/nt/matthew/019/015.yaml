  source_fidelity: 原文のκαὶは「そして」で自然に接続され、ἐπιθείς τὰς χεῖρας αὐτοῖςは「彼らに手を置いてから」として、手を置く具体的行為と主動詞に先行する分詞の働きを適切に表している。ἐπορεύθη ἐκεῖθενも「そこを去られた」で、この場所から去ったという意味を過不足なく伝えている。日本語で「手」を単数形にすることは慣用上自然であり、原文の複数形を損なわない。
  naturalness: 「そして、彼らに手を置いてから、そこを去られた」は明瞭な現代標準日本語である。「去る」と「そこを」の結び付きも自然である。主動詞の尊敬表現は文脈上のイエスへの一貫した敬意を自然に示している。
  terminology: 「手を置く」は原文の身体的行為を直接に表す適切な表現であり、「祝福する」や按手・任職等の特定の神学的含意を加えていない。脚注も分詞を継起的に表す訳の可能性を示すにとどまり、本文の意味を変更しない。
