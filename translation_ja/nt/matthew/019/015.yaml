id: MAT.19.15
reference: Matthew 19:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: ja
  text: そして、彼らに手を置いてから[a]、そこを去られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らに手を置き、そこを去られた。」
    reason: 分詞を明示的な先行動作としてではなく、物語上の継起として訳すこともできるため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の出来事に続く単純な物語上の接続を、自然な現代日本語で示す。
- source_word: ἐπιθεὶς
  choice: 置いてから
  rationale: アオリスト分詞が主動詞に先立つ動作を表す流れを明確にしつつ、自然な日本語にした。
- source_word: τὰς χεῖρας αὐτοῖς
  choice: 彼らに手を
  rationale: 「人に手を置く」という日本語の慣用的な形で、具体的な身体動作を保った。ギリシア語では「両手／手」が複数形だが、日本語では通常「手」とする。
- source_word: ἐπορεύθη
  choice: 去られた
  rationale: その場所から移動したことを簡潔に表し、文脈上の主語であるイエスに対する自然な敬意も保った。
- source_word: ἐκεῖθεν
  choice: そこを
  rationale: 起点を表す意味を、「去る」と自然に結びつく現代日本語で表した。
theological_decisions:
- issue: イエスが手を置いた行為の性質
  choice: 具体的な動作として「彼らに手を置く」と訳した。
  alternative: 文脈上の意味を補って「彼らを祝福する」と訳す。
  rationale: 文脈は祝福を示唆するが、原文が明記するのは手を置く行為である。秘跡、按手、任職などの限定的な含意を持ち込まず、原文の具体的表現を保った。
- issue: 分詞と主動詞の時間的関係
  choice: 「置いてから」として先行動作を示した。
  alternative: 「手を置き、そこを去られた」と並列的に訳す。
  rationale: アオリスト分詞はここで主動詞に先立つ動作と読むのが自然だが、日本語では単純な継起として表すことも可能なため、その余地を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、イエスへの敬意は主動詞の尊敬表現「去られた」で自然に示した。「手を置く」という具体的表現を保ち、解釈的な「祝福する」への置き換えは避けた。
