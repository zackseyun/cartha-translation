  naturalness: 「完全な者になりたいのなら」も理解できるが、現代標準日本語では「完全になりたいのなら」のほうが簡潔で自然であり、τέλειος の述語的用法にもよく対応する。未来の約束も「得るでしょう」とすることで、引用内の命令形との対照が明確になる。
  terminology: 「完全」は τέλειος の直接的で伝統的な訳語として保てる。脚注は「欠けがない」「成熟している」という有効な意味の幅を適切に示し、罪のない絶対的完全性という限定的理解を本文に持ち込んでいない。「天」「宝」「わたしに従いなさい」も適切である。
