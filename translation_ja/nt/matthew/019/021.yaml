id: MAT.19.21
reference: Matthew 19:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: ja
  text: イエスは彼に言われた。「もし完全になりたいのなら[a]、行って、持ち物を売り、貧しい人々に与えなさい。そうすれば、天に宝を得るでしょう。それから、来て、わたしに従いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「欠けのない者」または「成熟した者」とも訳せる。ギリシア語は、完全であること、欠けがないこと、十分に成長していることを表し得る。
    reason: τέλειος の真正な語義の幅を示し、「完全」を罪のない絶対的完全性だけに限定して読まないため。
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: イエスは彼に言われた
  rationale: 標準的な発話導入として自然に訳した。「言われた」は現代日本語でも通用する敬意を帯びた聖書叙述であり、発話の仕方を過度に限定しない。
- source_word: τέλειος
  choice: 完全な者
  rationale: 「完全な、欠けのない、成熟した」という意味範囲を持つ語である。本文では語義を狭めず、伝統的かつ直接的な「完全な者」とし、別の可能性を脚注に示した。
- source_word: ὕπαγε
  choice: 行って
  rationale: 移動を命じる簡潔な命令。後続する命令とのつながりが自然になるよう連用形とした。
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: 持ち物を売り
  rationale: τὰ ὑπάρχοντα はその人が所有する財産・所有物を指す。「持ち物」は明快で自然であり、文脈上、財産を含む所有物全体を表す。
- source_word: δὸς πτωχοῖς
  choice: 貧しい人々に与えなさい
  rationale: 実体詞的な複数形 πτωχοῖς を、現代日本語で明瞭な「貧しい人々」とした。何を与えるかは直前の売却代金として文脈から理解できるため、原文同様に補わない。
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: 天に宝を持つことになる
  rationale: 未来形を結果として自然に表した。οὐρανοῖς は複数形だが、この宗教的表現では日本語の「天」が自然で、意味を保てる。
- source_word: δεῦρο
  choice: それから、来て
  rationale: 話者のもとへの招きを示す語。「それから」で先行命令の後という流れを明らかにしつつ、「来て」によって招きそのものを保持した。
- source_word: ἀκολούθει μοι
  choice: わたしに従いなさい
  rationale: 福音書における弟子への招きを直接かつ自然に表す定訳的表現。
theological_decisions:
- issue: τέλειος が弟子としてのあり方について何を意味するか
  choice: 本文を「完全な者」とし、意味範囲を脚注で示す
  alternative: 「欠けのない者」または「成熟した者」
  rationale: この語は道徳的な無欠性だけでなく、全き献身、欠けのなさ、成熟を表し得る。本文で特定の完成観や無罪性の教理に限定せず、脚注によって文脈上可能な幅を保存した。
- issue: 財産売却の命令と天の宝との関係
  choice: 条件命令とその結果を原文どおり直接に表す
  alternative: 一般的な救済条件または特定個人だけへの助言と説明的に限定する
  rationale: 本文自体はその神学的適用範囲を明示していないため、いずれの体系にも寄せず、イエスがこの人物に語った命令と約束をそのまま保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの言葉にふさわしい簡潔さと威厳を保った。命令は「なさい」で統一し、古語的な表現や過度に教派的な用語を避けた。
