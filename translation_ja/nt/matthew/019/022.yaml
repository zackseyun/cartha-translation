id: MAT.19.22
reference: Matthew 19:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: ja
  text: しかし、青年はこのことば[a]を聞くと、悲しみながら立ち去った[b]。多くの財産を持っていたからである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この発言」。ギリシア語では「そのことば」で、直前のイエスの発言を指す。
    reason: lexical_alternative
  - marker: b
    text: または「悲しんで立ち去った」「悲しみに沈んで立ち去った」。原文の分詞は、悲しんでいる状態で立ち去ったことを表す。
    reason: lexical_alternative
  - marker: c
    text: 伝統的な訳では「大きな財産」。原文は、より文字どおりには財産の量が多いことを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 聞くと
  rationale: アオリスト分詞を時を表す節として自然な現代日本語にし、聞いた後に立ち去ったという順序を保った。
- source_word: δὲ
  choice: しかし
  rationale: 直前のイエスのことばに対する青年の否定的な反応への穏やかな転換・対照を表す。
- source_word: νεανίσκος
  choice: 青年
  rationale: 語そのものは若い男性を意味する。この節にない「議員」「役人」などを並行記事から補わない。
- source_word: τὸν λόγον
  choice: このことば
  rationale: 文脈上、直前のイエスの発言を指す。指示語を補って日本語として明確にしつつ、λόγοςの表現を保った。
- source_word: ἀπῆλθεν
  choice: 立ち去った
  rationale: その場を離れたことを簡潔で自然かつ品位ある日本語で表す。
- source_word: λυπούμενος
  choice: 悲しみながら
  rationale: 現在分詞が、立ち去る際に続いていた悲しみの状態・様態を表すことを保持する。
- source_word: ἦν γὰρ ἔχων
  choice: 持っていたからである
  rationale: 継続的な所有状態を表す迂言的未完了形を、自然な日本語の過去継続として訳した。γάρの理由説明も明示した。
- source_word: κτήματα πολλά
  choice: 多くの財産
  rationale: κτήματαを所有物・財産、πολλάを量の多さとして訳し、「大きな財産」のように規模へ意味をずらさない。
theological_decisions:
- issue: 並行記事に基づいて「役人／議員」という身分を補うか
  choice: νεανίσκοςを「青年」とのみ訳す
  alternative: 若い役人／若い議員
  rationale: マタイのこの節は彼を青年とのみ呼ぶ。ルカの情報を加えることなく、本文固有の表現を優先する。
translation_notes:
  register: 明瞭な現代標準日本語。物語の転換を「しかし」で示し、「悲しみながら」により原文の分詞的な同時性を保った。文末の理由節は日本語として自然な独立文にしつつ、γάρの説明関係を明示した。
source_grounding:
  english_pob_role: consult_only
