id: MAT.19.29
reference: Matthew 19:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: ja
  text: また、わたしの名のために、家々、兄弟、姉妹、父、母、妻[a]、子どもたち、あるいは畑を後にした者はみな、百倍を受け、永遠のいのちを受け継ぐ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本には「妻」がない。
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: 者はみな
  rationale: 一人一人に当てはまる普遍的・分配的な意味を、自然な現代日本語で表す。
- source_word: ἀφῆκεν
  choice: 後にした
  rationale: 弟子として従うために離れたことを表しつつ、「捨てた」「見捨てた」ほど否定的な含意を加えない。
- source_word: οἰκίας
  choice: 家々
  rationale: 複数形を反映し、畑と並ぶ住居・財産としての具体性を保つ。
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: 兄弟、姉妹
  rationale: 原文が男性と女性のきょうだいを別々に列挙しているため、区別して訳す。
- source_word: πατέρα / μητέρα
  choice: 父、母
  rationale: 単数の親族名称を簡潔にそのまま訳す。
- source_word: γυναῖκα
  choice: 妻
  rationale: 家族関係を列挙する文脈では、一般的な「女」ではなく配偶者を指す。
- source_word: τέκνα
  choice: 子どもたち
  rationale: 家族一覧における子・子孫を自然な現代日本語で表す。
- source_word: ἀγρούς
  choice: 畑
  rationale: 農地・土地という経済的資産の側面を、過度に限定せず具体的に示す。
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: わたしの名のために
  rationale: イエスへの忠誠を示す「名」という原文の重要な表現を保持する。
- source_word: ἑκατονταπλασίονα
  choice: その百倍
  rationale: 数量的な強さを簡潔に保ち、何の百倍かは列挙されたものを受ける文脈に委ねる。
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: 永遠のいのちを受け継ぐ
  rationale: κληρονομέω の相続・継承の比喩を保ち、将来的約束を自然に表す。
theological_decisions:
- issue: γυνή の解釈
  choice: 妻
  alternative: 女
  rationale: 家、親族、子ども、畑が並ぶ家庭・財産の文脈では配偶者の意味が適切であり、女性一般から離れるという誤解を避ける。
- issue: ἕνεκεν τοῦ ὀνόματός μου の表現
  choice: わたしの名のために
  alternative: わたしのために／わたしの名のゆえに
  rationale: 「名」が帯びる人格、権威、公に告白されるアイデンティティーを削らずに訳す。
- issue: ἑκατονταπλασίονα の性質
  choice: その百倍
  alternative: 百倍ものもの／百倍を
  rationale: 約束の豊かさと数量表現を保持し、報いが機械的・物質的に同種の資産だけを意味すると断定しない。
- issue: ἀφῆκεν が示す離別
  choice: 後にした
  alternative: 捨てた／離れた
  rationale: 弟子としての犠牲を明示しつつ、家族への倫理的義務を全面的に放棄せよという含意を訳語自体に持ち込まない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、「わたしの名」「受け継ぐ」など原文の神学的比喩を保持した。列挙のリズムを保ち、「あるいは」で最後の財産項目を自然につないだ。
