  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: ja
  text: 彼は答えた。「初めから創造した方[b]が、彼らを男と女に造られたことを、あなたがたは読んだことがないのですか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたは読まなかったのですか」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「創造した方」。「創造者」とも訳せる。「初めから」は「創造した」に係るとも、後半の「彼らを男と女に造られた」に係るとも取れる。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 彼は答えた
  rationale: 分詞と定動詞を重ねるギリシア語の慣用表現を、意味を損なわず自然な現代日本語の一つの動詞にまとめた。主語は原文どおり固有名を補わず代名詞で示した。
- source_word: Οὐκ ἀνέγνωτε
  choice: あなたがたは読んだことがないのですか
  rationale: 聖書を読んで知っているはずだと問いかける含みを、「読んだことがないのですか」で自然に表した。
- source_word: ὁ κτίσας
  choice: 創造された方
  rationale: 冠詞付き分詞を称号の「創造者」と断定せず、「創造された方」としてギリシア語の形を保った。文脈上、敬意を示す表現が自然である。
- source_word: ἀπ’ ἀρχῆς
  choice: 初めから
  rationale: 創世記の創造記事への響きを保ち、前置詞句を素直に訳した。
- source_word: ἄρσεν καὶ θῆλυ
  choice: 男と女
  rationale: 創世記1章27節を踏まえた人間の対を、伝統的で分かりやすい日本語にした。
- source_word: ἐποίησεν αὐτούς
  choice: 彼らを…造られた
  rationale: αὐτούςを明示して原文の指示表現を保ち、κτίζωとποιέωの語の違いを「創造する」と「造る」で訳し分けた。
theological_decisions:
- issue: 創世記1章27節に由来する創造の対の訳し方
  choice: 男と女
  alternative: 男性と女性／人を男と女に
  rationale: ἄρσεν καὶ θῆλυの対を言い換えず、創造記事への直接の言及を保つ一方、この節を越える教理的結論は付加しない。
- issue: ἀπ’ ἀρχῆςの係り先
  choice: 「初めから創造された方」と原語順に近く配置
  alternative: 「創造された方が、初めから彼らを…造られた」
  rationale: 語順上はκτίσαςに近い読みを本文に採ったが、「初めから」が創造行為全体に係る可能性もあるため脚注で曖昧さを示した。
translation_notes:
  register: 明瞭な現代標準語を用い、問いかけには丁寧さを持たせた。神を指す動作には自然な敬語を用いたが、原文にない称号や教派的表現は加えていない。
