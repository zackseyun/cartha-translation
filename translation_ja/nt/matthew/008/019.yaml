  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: ja
  text: 一人の律法学者が近づいて来て、イエスに言った。「先生、あなたがどこへ行かれても、私はついて行きます。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがどこへ立ち去られても」とも訳せる。ギリシア語の動詞は、より具体的に「去る、立ち去る」を意味することがあるが、ここでは自然に「行く」の意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 近寄って来て
  rationale: イエスの方へ近づいてから語ったという動きを、自然な日本語で表す。
- source_word: εἷς
  choice: 一人の
  rationale: 人物を導入する数詞の働きを保ち、「一人の律法学者」とした。
- source_word: γραμματεὺς
  choice: 律法学者
  rationale: 福音書の文脈で、律法の解釈と教授に携わった人物を現代の一般読者に分かりやすく示す。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして自然であり、διδάσκαλοςの「教える者」という意味を過度な称号化なしに伝える。
- source_word: ἀκολουθήσω
  choice: 私はついて行きます
  rationale: 未来形による意志表明を表しつつ、実際に同行する意味と弟子として従う含みの双方を残す。
- source_word: ὅπου ἐὰν
  choice: どこへ…ても
  rationale: 行き先を限定しない不定関係の意味を、自然な日本語で表す。
- source_word: ἀπέρχῃ
  choice: 行かれて
  rationale: 文脈上は一般的な「行く」が自然である。敬意を伴う直接話法に合わせて尊敬表現としたが、「立ち去る」という語義上の含みは注で示す。
theological_decisions:
- issue: イエスへの呼称 διδάσκαλος
  choice: 先生
  alternative: 教師／師よ
  rationale: 敬意ある呼びかけを自然な現代日本語で示しつつ、原文以上に強い主従関係やキリスト論的意味を付加しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文とした。「先生」「行かれても」で話者の敬意を示し、「ついて行きます」に同行と弟子として従うことの両義的な響きを残した。
