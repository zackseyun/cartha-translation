reference: Matthew 8:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ja
  text: というのも、私もまた権威の下にある者であり、私の下にも兵士がいます。私がこの者に『行け』と言えば行き、別の者に『来い』と言えば来ます。また、私の奴隷[a]に『これをしろ』と言えば、それを行います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「召使い」とも訳せる。ギリシア語はドゥーロスで、基本的には「奴隷」を指す。
    reason: δοῦλοςの歴史的・社会的従属を本文の「奴隷」で示しつつ、この文脈で可能な「召使い」という訳語も示すため。
lexical_decisions:
- source_word: καὶ γὰρ ἐγώ
  choice: 私もまた
  rationale: γάρの説明の働きは文脈と文のつながりに込め、καίと明示されたἐγώによる「私も」という類比と強調を自然な日本語で表した。
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: 権威の下にある者であり
  rationale: 軍の指揮系統において上位の権威に服していることを示す。日本語では「人間」と明示するより「者」とするほうが自然で、意味も保たれる。
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: 私の下にも兵士たちがいます
  rationale: 百人隊長自身が権威の下にありながら、部下を持つという対応関係を、「にも」によって明確にした。
- source_word: λέγω τούτῳ· Πορεύθητι
  choice: 私がこの者に『行け』と言えば
  rationale: τούτῳの指示的な響きを「この者」で保ち、命令と即時の服従という例示を簡潔に表した。
- source_word: καὶ ἄλλῳ· Ἔρχου
  choice: 別の者に『来い』と言えば
  rationale: 最初の兵士との対照を保ち、Ἔρχουを直接的な命令として訳した。
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: 『これをしろ』と言えば、そのとおりにします
  rationale: 命令と実行の対応を自然な日本語で表した。「そのとおりに」は原文の単純な反復を説明的にしすぎず明確にする。
theological_decisions:
- issue: δοῦλοςの社会的身分をどう表すか
  choice: 奴隷
  alternative: 召使い／使用人
  rationale: δοῦλοςは所有者に従属する奴隷を通常指すため、歴史的・社会的意味を明確にした。一方、この箇所では家の奉仕者としての役割が前面に出るため、「召使い」という文脈上の訳語も脚注に残した。
- issue: 百人隊長の「権威の下」とイエスの権威との類比
  choice: 類比をそのまま表し、イエスが誰の権威の下にあるかは補わない
  alternative: 神の権威の下にあると明示する
  rationale: 原文は百人隊長自身の指揮系統を述べるが、イエスについて対応する上位権威を明示していない。神学的含意を訳文で限定せず、原文の緊張と余地を保った。
translation_notes:
  register: 明快な現代標準語を用い、軍人の直接的な命令は「行け」「来い」「しろ」と簡潔にした。丁寧な地の文と命令形の対照により、百人隊長の権威と部下の即時の服従が自然に伝わるようにした。
