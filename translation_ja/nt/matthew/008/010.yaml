id: MAT.8.10
reference: Matthew 8:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: ja
  text: イエスはこれを聞いて驚き、ついて来ていた人たちに言われた。「よく言っておく。イスラエルの中で、これほどの信仰[a]をだれにも見いだしたことがない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これほど大きな信仰」
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: これを聞いて
  rationale: アオリスト分詞を、直前の百人隊長の言葉を受ける自然な時間・状況表現とした。「これ」は文脈上の補足である。
- source_word: ἐθαύμασεν
  choice: 驚き
  rationale: イエスが百人隊長の言葉に強い驚嘆を示したという物語上の力を、明瞭な現代日本語で表す。
- source_word: τοῖς ἀκολουθοῦσιν
  choice: ついて来ていた人たちに
  rationale: その時イエスに同行していた人々を指す現在分詞であり、固定的な集団名にせず場面に即して訳した。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: よく言っておく
  rationale: イエスの厳粛で強調的な宣言句を、現代日本語で自然かつ重みのある定型表現にした。
- source_word: παρ’ οὐδενὶ
  choice: 一人も
  rationale: 与格を伴うπαράが示す「だれのところにも／だれの場合にもない」という意味を、日本語の否定呼応で自然に表した。
- source_word: τοσαύτην πίστιν
  choice: これほどの信仰
  rationale: τοσαύτηνが示す程度の大きさを明示し、πίστιςは文脈に即して「信仰」とした。
- source_word: ἐν τῷ Ἰσραήλ
  choice: イスラエルの中で
  rationale: 場所的かつ共同体的な範囲を示す句を直接的に訳した。
- source_word: εὗρον
  choice: 出会ったことがない
  rationale: 直訳的な「見いだしたことがない」の意味を保ちつつ、人にそのような信仰を認めるという文脈で自然な日本語にした。
theological_decisions:
- issue: πίστιςの訳語
  choice: 信仰
  alternative: 信頼
  rationale: ここでは百人隊長がイエスの権威を信じて委ねる姿を指す。「信頼」も含意されるが、神学的用語としての連続性と本文の意味を保つため「信仰」を採用した。
- issue: 否定句の統語的かかり方
  choice: イスラエルの中で、これほどの信仰を持つ人には一人も出会ったことがない
  alternative: イスラエルでは、だれにもこれほどの信仰を見いだしたことがない
  rationale: παρ’ οὐδενὶとτοσαύτην πίστινの関係を、人とその人に認められる信仰として自然に表した。別訳の語順も原文上可能なニュアンスを保つため脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。Ἀμὴνの宣言的な重みは「よく言っておく」で表し、人物への言及は過度に制度化せず「ついて来ていた人たち」とした。
