- from: すると見よ、海に激しい嵐[a]が起こり、舟は波に覆われるほどであった[b]。ところが、イエスは眠っていた。
  to: すると、見よ、海に大嵐[a]が起こり、そのため舟は波に覆われていた[b]。しかし、イエスは眠っていた。
  rationale: 原文の結果構文と現在受動の進行的な描写を、自然な現代日本語で直接示すため、「舟は波に覆われていた」と改めた。「大嵐」は μέγας の強さを保ちつつ簡潔である。対照を示す δέ は「しかし」とし、αὐτός の対照的な働きと、嵐の最中にもイエスが眠っていた情景を自然に伝える。脚注bは、原文の実際の被覆を「なりそうだった」と弱めない表現に訂正した。
