source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: ja
  text: すると、見よ、海に大嵐[a]が起こり、そのため舟は波に覆われていた[b]。しかし、イエスは眠っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「嵐」と訳したギリシア語は、字義的には「揺れ」を意味し、しばしば「地震」を指す。ここでは海、舟、波という文脈から、海上の激しい嵐を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「舟は波にのみ込まれていた」。原文は、波が舟を覆い続ける様子を表している。
    reason: translation_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面の急変に注意を向けさせる談話標識として、その鮮やかさを保った。現代語ではやや格調があるが、意味は明瞭である。
- source_word: σεισμὸς μέγας
  choice: 激しい嵐
  rationale: σεισμός は通常「地震」「揺れ」を表し得るが、ここでは海、舟、波という文脈から、海上の激しい動揺、すなわち暴風を指す。「大きな嵐」より自然な日本語として「激しい嵐」とした。
- source_word: ἐγένετο
  choice: 起こり
  rationale: 気象上の出来事が発生したことを自然に表し、原文の出来事の開始を伝える。
- source_word: ἐν τῇ θαλάσσῃ
  choice: 海に
  rationale: θάλασσα の語を「海」として保った。「湖」とすれば地理的には分かりやすいが、原文の語彙を狭めるため採らなかった。
- source_word: ὥστε
  choice: ほどであった
  rationale: 嵐の激しさが舟を波で覆う結果に至ったことを、日本語として自然な結果構文で表した。
- source_word: τὸ πλοῖον
  choice: 舟
  rationale: ガリラヤ湖上の比較的小型の舟という場面に適し、現代日本語でも明瞭である。
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: 波に覆われる
  rationale: 現在受動不定詞の継続的な様相と、「覆う」という基本義を保った。「水浸しになる」よりも原文の表現に近い。
- source_word: αὐτὸς δὲ ἐκάθευδεν
  choice: ところが、イエスは眠っていた
  rationale: δὲ の対照を「ところが」で示し、未完了過去の継続性を「眠っていた」で表した。日本語で不自然な「彼」を避け、文脈上の指示対象を明示した。
theological_decisions:
- issue: σεισμός が表す出来事の性質
  choice: 海上の「嵐」と訳す
  alternative: 「地震」または「激しい揺れ」と訳す
  rationale: これは教理的判断ではなく文脈に基づく語義判断である。舟が波に覆われるという直後の描写から、ここでは海上の激しい嵐を指す。ただし語の字義的な幅は脚注に残した。
- issue: αὐτός の指示対象
  choice: 「イエス」と明示する
  alternative: 主語を省略する、または「彼」とする
  rationale: 前後の文脈で指示対象はイエスである。日本語では人称代名詞「彼」が不自然になりやすく、主語省略では嵐との対照が弱まるため、固有名を補って明瞭にした。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「見よ」によって原文の劇的な注意喚起を保った。「すると見よ」は日常会話より格調があるが、聖書本文として理解可能で簡潔である。後半は「ところが」で嵐の激しさとイエスの睡眠との鮮明な対照を示した。
