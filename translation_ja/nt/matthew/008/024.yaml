  naturalness: 「すると見よ」は聖書的な文体として可能だが、明瞭な現代標準語では読点を加えた「すると、見よ、」が読みやすい。主節を「舟は波に覆われていた」とすれば、現代日本語としても自然で情景が明確になる。
