base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: ja
  text: イエスがカファルナウムに入られると、百人隊長が近寄って来て、懇願した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: イエスが入られると
  rationale: 属格独立構文のアオリスト分詞を自然な時の節として訳した。「〜と」は出来事の推移を示しつつ、厳密な先行か同時かを過度に限定しない。文脈上の指示対象を明確にするため「イエス」を補った。
- source_word: εἰς Καφαρναοὺμ
  choice: カファルナウムに
  rationale: 地名は現代日本語の聖書で広く用いられる音写とし、εἰς の方向性は「入る」と組み合わせて表した。
- source_word: προσῆλθεν αὐτῷ
  choice: 近寄って来て
  rationale: προσέρχομαι の「近づく、そばに来る」という意味を、場面の動きが自然に伝わる日本語で表した。
- source_word: ἑκατόνταρχος
  choice: 百人隊長
  rationale: ローマ軍の具体的な役職を示す、日本語聖書で定着した簡潔で正確な訳語を採用した。
- source_word: παρακαλῶν αὐτὸν
  choice: 懇願した
  rationale: 続く依頼を切実に申し出る意味を表した。日本語では主文と分詞を一続きの動作として再構成し、目的語の「彼に」は不自然な重複を避けて省略した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用い、物語文として自然でありながら品位を保った。「百人隊長」は歴史的役職名として保持し、「懇願した」は単なる依頼より切実だが、感情を過度に誇張しない表現とした。
