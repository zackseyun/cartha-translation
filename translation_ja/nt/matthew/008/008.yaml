id: MAT.8.8
reference: Matthew 8:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: ja
  text: 百人隊長は答えた。「主よ、あなたが私の屋根の下にお入りになるには、私はふさわしくありません。ただ、ひと言おっしゃってください[a]。そうすれば、私のしもべ[b]は癒やされます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ただ、言葉によって語ってください」。
    reason: εἰπὲ λόγῳの「言葉」による発話という表現を示すため。本文の「ひと言おっしゃってください」は自然な日本語による訳。
  - marker: b
    text: 「少年」または「子ども」とも訳せる。原語は文脈により、子ども、若者、しもべを指す。
    reason: παῖςが持つ語義上の曖昧さを保持するため。
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: 答えた
  rationale: 分詞と発話動詞を組み合わせたギリシア語の慣用的な発話導入を、日本語では自然に一つの動詞で表した。
- source_word: ἑκατόνταρχος
  choice: 百人隊長
  rationale: ローマ軍でおよそ百人を率いる将校を指す、正確で定着した訳語。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけであると同時に、イエスに対する称号としての含みも保つ。
- source_word: οὐκ εἰμὶ ἱκανός
  choice: ふさわしい者ではありません
  rationale: ここでは能力不足よりも、相手を家に迎える資格や値打ちがないという謙遜を表す。
- source_word: ὑπὸ τὴν στέγην εἰσέλθῃς
  choice: 自分の屋根の下にお迎えする
  rationale: 「屋根の下」という原文の具体的な比喩を保ちつつ、客を家に入れる場面として自然な日本語にした。
- source_word: μόνον εἰπὲ λόγῳ
  choice: ただ、ひと言お命じください
  rationale: λόγῳを「ひと言」として簡潔に表し、文脈上、その言葉によって癒やしを命じる意味を自然に示した。直訳寄りの可能性は脚注に残した。
- source_word: ἰαθήσεται
  choice: 癒やされます
  rationale: ἰάομαιの未来受動形を、奇跡的な治癒の文脈にふさわしい標準的な表現で訳した。
- source_word: παῖς
  choice: しもべ
  rationale: 語義には子ども・少年・しもべがあるが、百人隊長の家に属する者という文脈と並行記事から「しもべ」を本文に採用し、曖昧さは脚注で示した。
theological_decisions:
- issue: イエスへの呼びかけ κύριος の訳
  choice: 主よ
  alternative: 先生／だんな様
  rationale: 単なる敬称とも読める一方、福音書におけるキリスト論的な響きを排除しないため、「主よ」とした。
- issue: παῖς が示す人物の身分・年齢
  choice: しもべ
  alternative: 少年／子ども
  rationale: 文脈上は「しもべ」が最も適切だが、原語だけでは年少者や子どもの可能性を完全には排除できないため、脚注で保持した。
- issue: εἰπὲ λόγῳ の発話の性質
  choice: ひと言お命じください
  alternative: ひと言おっしゃってください
  rationale: 百人隊長が続いて権威と命令について語る文脈を反映した。ただし、原文の表現自体は一般的な「ひと言語る」ことも許すため、脚注により示した。
translation_notes:
  register: 明瞭で現代的ながら礼節と格調を保つ文体。「屋根の下」という原文の像を残し、百人隊長の謙遜とイエスの権威への信頼が自然に伝わるようにした。
