id: MAT.8.34
reference: Matthew 8:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: ja
  text: すると、見よ、町中の人々がイエスに会うために出て行った。そしてイエスを見ると、自分たちの地域[a]から立ち去ってほしいと懇願した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自分たちの領域から」。より字義的には「自分たちの境界から」。
    reason: ὅριαはこの文脈では地域・領域を指すが、字義的には「境界」であり、語義上の代替を示すため。
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίによる物語の進行と、ἰδούの注意を引く談話標識としての力を保った。「見よ」はやや格調があるが、聖書物語の生き生きとした転換を簡潔に伝える。
- source_word: πᾶσα ἡ πόλις
  choice: 町中の人々
  rationale: 字義的には「町全体」だが、ここでは建物や区域ではなく住民を集合的に指す。現代日本語で誤解なく自然に伝わる表現とした。
- source_word: ἐξῆλθεν
  choice: 出て来た
  rationale: 町から外へ出る動きを表す。叙述の視点ではイエスのいる所へ向かうため、日本語では「出て来た」が自然である。
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: イエスに会うために
  rationale: 人を迎え、または会うために出向くという定型的な意味を、明瞭な現代日本語で表した。文脈が明示しない歓迎の含意は加えていない。
- source_word: ἰδόντες αὐτόν
  choice: イエスを見ると
  rationale: アオリスト分詞の時間的関係を自然に表し、彼を見たことに続いて願い出たという流れを保つ。
- source_word: παρεκάλεσαν
  choice: 懇願した
  rationale: 単に「頼んだ」より強い、切実に願い求める語感を表す。住民の動機そのものは補わない。
- source_word: ὅπως μεταβῇ
  choice: 立ち去ってほしいと
  rationale: 願いの内容を自然な日本語で示す。μεταβαίνωの、その場所を離れて別の所へ移る意味を「立ち去る」で簡潔に表した。
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: 自分たちの地域から
  rationale: ὅριαは字義的には「境界」であり、複数形では境界内の領域・地方を指し得る。ここでは境界線そのものではなく住民の地域を離れることなので、「地域」が自然で正確である。
theological_decisions:
- issue: 町の人々がイエスに立ち去るよう願った理由
  choice: 理由を明示せず、彼らが懇願した事実だけを訳す。
  alternative: イエスの力への恐れ、豚を失ったことへの怒り、出来事全体への動揺などを理由として補う。
  rationale: ギリシャ語本文は彼らの動機を説明していないため、特定の心理や神学的評価を訳文に加えず、物語上の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「懇願した」により原文の談話的な強調と厳粛な物語調を保った。「町中の人々」はπᾶσα ἡ πόλιςの換喩を自然に明示する表現であり、一人残らずという厳密な数量断定を意図しない。
