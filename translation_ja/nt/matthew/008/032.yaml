id: MAT.8.32
reference: Matthew 8:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: ja
  text: イエスは彼らに言われた。「行け。」彼らは出て行って豚の中へ入った。すると、見よ、群れ全体が急な斜面[a]を駆け下りて海に入り、水の中で死んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「崖を」。このギリシャ語は、急な斜面、切り立った岸、崖を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 文脈上は「水に溺れて死んだ」とも訳せる。ギリシャ語は直訳すると「水の中で死んだ」。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: 行け
  rationale: 簡潔な命令形である原文の力を保ち、現代日本語として自然に表した。
- source_word: ἐξελθόντες ἀπῆλθον εἰς τοὺς χοίρους
  choice: 出て行って豚の中に入った
  rationale: 悪霊たちが人から出て豚へ移った動きを、原文の分詞と定動詞の流れに沿って明瞭に表した。
- source_word: χοίρους
  choice: 豚
  rationale: 現代日本語で一般的かつ正確な語であり、古風な言い換えを避けた。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 続く出来事へ注意を向ける談話標識の働きを保持した。単なる「突然」として出来事の様態に限定しなかった。
- source_word: πᾶσα ἡ ἀγέλη
  choice: 群れ全体
  rationale: πᾶσα の全体性と、ἀγέλη の集合的な意味を簡潔に再現した。
- source_word: ὥρμησεν
  choice: 駆け下りて
  rationale: 勢いよく突進する動きを、斜面を下る文脈に合う自然な日本語で表した。
- source_word: κατὰ τοῦ κρημνοῦ
  choice: 急な斜面を
  rationale: κρημνός は急斜面、岸、崖を指し得るため、垂直な崖と断定せず地形の険しさを示した。
- source_word: θάλασσαν
  choice: 海
  rationale: 語の基本的な意味を優先した。指示対象はガリラヤ湖だが、本文で説明的に「湖」へ置き換えなかった。
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: 水の中で死んだ
  rationale: 原文が明示する「水の中で死んだ」を保ち、文脈上推測できる死因を本文に加えなかった。
theological_decisions:
- issue: 豚の群れの死因をどこまで明示するか
  choice: 「水の中で死んだ」と訳す
  alternative: 「水に溺れて死んだ」または「溺れ死んだ」
  rationale: 文脈は溺死を強く示唆するが、ἀπέθανον は単に「死んだ」と述べる。原文以上に死因を特定せず、含みを保った。
- issue: 「彼ら」が指す者
  choice: 代名詞のまま「彼ら」とする
  alternative: 「悪霊ども」と明示する
  rationale: 文脈上は悪霊たちを指すが、この節自体の原文は代名詞を用いるため、本文では指示対象を説明的に補わなかった。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、ἰδοὺ は物語の鮮烈さを保つため「見よ」とした。イエスの命令は短く力強い「行け」とし、全体を簡潔で格調ある叙述に整えた。
