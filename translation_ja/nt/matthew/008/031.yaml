  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: ja
  text: 悪霊たちはイエスにしきりに願った[a]。「もし私たちを追い出すのなら、私たちを豚の群れの中へ送ってください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「繰り返し願って」または「願い続けて」とも訳せる。ギリシャ語の動詞は未完了時制で、継続または反復する動作を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: 悪霊ども
  rationale: 人格を持つ邪悪な霊的存在を表す文脈であり、現代日本語の聖書表現として明瞭で自然。複数形は「ども」で示す。
- source_word: παρεκάλουν
  choice: しきりに願って
  rationale: 未完了時制が示す継続的・反復的な懇願を自然な日本語で表す。「懇願し続けた」より平明で、単なる「願った」より相の情報を保持する。
- source_word: λέγοντες
  choice: 言った
  rationale: 直接話法を導く分詞を、日本語の物語文として自然な定動詞に組み替えた。
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: もし私たちを追い出すのなら
  rationale: 条件を表す εἰ を「もし」で保持し、ἐκβάλλω は悪霊追放の文脈にも合う平明な「追い出す」とした。
- source_word: ἀπόστειλον ἡμᾶς
  choice: 送ってください
  rationale: アオリスト命令形による直接の願いを、文脈に即した丁寧な依頼表現で自然に示す。目的語「私たち」は直前に明示され、日本語では省いても指示対象が明確。
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: あの豚の群れの中へ
  rationale: ἀγέλη は動物の「群れ」、χοῖρος は現代語の「豚」とした。定冠詞は場面内で特定された群れを指すため「あの」で表し、εἰς の内部への方向性を「中へ」で保持する。
- source_word: οἱ δὲ
  choice: 悪霊どもは
  rationale: δέ の軽い展開・対照は、日本語では主題提示の「は」で自然に表せるため、機械的な接続詞を加えない。
theological_decisions:
- issue: δαίμονες が指す存在
  choice: 悪霊ども
  alternative: 悪霊たち／悪鬼ども
  rationale: 本文がイエスに語りかける人格的な邪悪な霊的存在として描く点を保持しつつ、余分な教理説明を加えない。
- issue: 条件文 Εἰ ἐκβάλλεις のニュアンス
  choice: もし私たちを追い出すのなら
  alternative: 私たちを追い出されるのでしたら／私たちを追い出す以上は
  rationale: 話者が追放を予期している可能性はあるが、ギリシャ語の条件形式を断定的な理由表現へ解消せず、その緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。物語として自然な語順を採りつつ、条件文と未完了時制の含意を保持した。「悪霊ども」は対象への距離を示す文脈的に適切な複数表現であり、発話部分は懇願にふさわしい丁寧体とした。
