id: MAT.8.12
reference: Matthew 8:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ja
  text: しかし、御国の子ら[a]は外の闇へ投げ出される。そこで泣き悲しみ、歯ぎしりすることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「御国の息子たち」。御国に当然属する、またはその正当な成員であると見なされていた人々を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: しかし、御国の子ら
  rationale: δέによる前節との対照を「しかし」で示す。「御国の子ら」はギリシア語の比喩的慣用表現を保ちつつ、御国に属すると見なされていた人々という皮肉を伝える。日本語では「息子たち」より「子ら」がこの代表的・関係的用法に自然である。
- source_word: ἐκβληθήσονται
  choice: 投げ出される
  rationale: ἐκβάλλωの未来受動が表す強制的な排除を、明瞭で力のある現代日本語で表す。
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: 外の闇
  rationale: マタイ特有の裁きのイメージを簡潔に保ち、「地獄」などの解釈語を加えない。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 節頭に置かれた場所の指示を文頭の「そこで」で保ち、直前の「外の闇」を受ける自然な日本語とする。
- source_word: ὁ κλαυθμὸς
  choice: 泣き悲しみ
  rationale: 単なる涙よりも嘆きを含むκλαυθμόςを、過度に強めず自然に表す。
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: 歯ぎしりする
  rationale: 定着した日本語表現を用い、歯をきしませる苦悶のイメージを保つ。
theological_decisions:
- issue: 排除と裁きのイメージ
  choice: 「外の闇へ投げ出される」「泣き悲しみ、歯ぎしりする」と具体的な比喩を保持する。
  alternative: 「地獄に落とされる」「永遠の罰を受ける」などと教理的に説明する。
  rationale: 本文は厳しい終末的排除と苦悶を描くが、ここでは「地獄」や「永遠の罰」という語を直接用いていないため、本文のイメージと神学的緊張を保つ。
- issue: υἱοὶの性別と慣用性
  choice: 「御国の子ら」
  alternative: 「御国の息子たち」または「御国を受け継ぐ人々」
  rationale: 原語の男性複数形を踏まえつつ、このセム語的な関係表現が集団を指すことを自然な日本語で表す。「息子たち」は日本語では生物学的な男性に限定して響きやすく、「受け継ぐ人々」は解釈を本文に織り込みすぎる。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。「御国」は文脈上の神の国を簡潔に示す。「泣き悲しみ、歯ぎしりすることになる」は二つの定冠詞付き名詞句を日本語の自然な動作表現にしつつ、裁きの厳粛さを保つ。
