reference: Matthew 8:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ja
  text: イエスは彼に言われた。「狐には巣穴があり、空の鳥にはねぐらがある。しかし、人の子[a]には、頭を横たえる場所さえない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人の子」は、イエスが自分を指して用いた呼び名。別訳「人間なる者」。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語を生き生きと描く歴史的現在形だが、現代日本語の自然な物語文として過去形にした。イエスへの敬意を表す通常の表現として尊敬語を用いた。
- source_word: φωλεούς
  choice: 巣穴
  rationale: 狐の住み場所を指す自然な現代日本語であり、単なる「穴」より文脈が明確である。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: οὐρανός の空間的な意味を自然に表した。「天の鳥」も字義的には可能だが、ここでは鳥が飛ぶ空を指す。
- source_word: κατασκηνώσεις
  choice: 巣
  rationale: 住み場・休む場所を表す語で、この文脈では鳥の「巣」が簡潔で自然である。「ねぐら」も可能だが、原語は特定の形態に限定しない。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した訳語を採用し、ダニエル書を含む聖書的響きと、通常の人間性を示し得る表現の幅を保った。
- source_word: ποῦ ... οὐκ ἔχει
  choice: 所さえない
  rationale: 直訳的な「どこに……するかを持たない」を避け、全面的な欠如を自然な日本語で表した。「さえ」は狐や鳥との対比を明確にする。
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: 頭を横たえる
  rationale: 原文の具体的な身体表現を保ちつつ、日本語として理解しやすくした。
theological_decisions:
- issue: イエスの自己呼称 ὁ υἱὸς τοῦ ἀνθρώπου の訳し方
  choice: 人の子
  alternative: 人間である者
  rationale: 「人の子」は自己呼称としての固有の聖書的・神学的含意を保ち、同時に表現そのものが持つ人間性との関わりも残す。「人間である者」は意味を一方向に限定し、原文の緊張を弱める。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの発言にふさわしい簡潔さと重みを保った。狐と鳥の住み場所に対し、人の子には最低限の休息場所さえないという対比が自然に伝わるようにした。
