  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: ja
  text: イエスは、ご自分の周りに大勢の群衆がいるのを見て、向こう岸へ渡るよう命じられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: 見て
  rationale: 分詞の時間的関係を自然な日本語の連用形で表した。
- source_word: πολλοὺς ὄχλους
  choice: 大勢の群衆
  rationale: 複数形ὄχλουςを日本語で不自然に「多くの群衆」とせず、多人数の集まりとして自然に表現した。本文批評上の語順差は訳意に影響しない。
- source_word: ἐκέλευσεν
  choice: 命じられた
  rationale: 単なる発言より強い命令を表す動詞の意味を保ち、イエスへの敬意を示す自然な敬語とした。
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: 向こう岸へ渡るよう
  rationale: 湖の対岸への移動という文脈を明確にしつつ、不定詞が命令内容を示す構造を「よう」で表した。主語が明示されないという原文の余地は保った。
theological_decisions:
- issue: 命令された移動の主語
  choice: 「向こう岸へ渡るよう」とし、誰が渡るのかを明示しない
  alternative: 「弟子たちに、向こう岸へ渡るよう」または「一行が向こう岸へ渡るよう」
  rationale: 原文はἐκέλευσενの相手やἀπελθεῖνの意味上の主語を明示していないため、文脈から補わず曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。イエスの動作には一般的な尊敬表現を用い、不要な説明語は加えていない。
