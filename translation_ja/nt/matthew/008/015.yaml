  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: ja
  text: イエスが彼女の手に触れると、熱は引いた。彼女は起き上がり、イエスに仕えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「仕え始めた」。ギリシア語の未完了過去は、続いていた行為を描くことも、行為の始まりを示唆することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο τῆς χειρὸς αὐτῆς
  choice: 彼女の手に触れると
  rationale: ἅπτομαι＋属格は「触れる」の意。日本語では「手に触れる」が自然である。接続詞の連続は、最初の出来事を「〜すると」として結果の即時性を自然に示した。
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: 熱は引いた
  rationale: 原文では熱が彼女を「離れた」と擬人的に表現されるが、日本語の「熱が引く」は同じ出来事を簡潔かつ自然に表す。
- source_word: πυρετός
  choice: 熱
  rationale: 文脈上、発熱を指す。「熱病」よりも現代日本語で自然であり、原文以上に特定の病名を示さない。
- source_word: ἠγέρθη
  choice: 起き上がり
  rationale: ここでは癒やされた女性が床から起きるという通常の物語的意味。受動形を機械的に「起こされ」とせず、復活の含意も持ち込まない。
- source_word: διηκόνει αὐτῷ
  choice: イエスに仕えた
  rationale: διακονέωはこの家庭内の場面で世話やもてなしをすることを含む「仕える」。代名詞だけでは日本語で指示先が曖昧になりやすいため、「イエス」と明示した。未完了過去は継続的な奉仕を描写し得るが、開始そのものを明示するとは限らない。
theological_decisions:
- issue: ἠγέρθηに復活の神学的含意を読み込む可能性
  choice: 日常的な動作として「起き上がり」と訳す
  alternative: 起こされ／よみがえり
  rationale: 直前の癒やしに続いて床から起きたことを述べる文脈であり、復活を示す訳語は不要な神学的含意を加える。
- issue: διηκόνειの未完了過去が開始を表すか継続を表すか
  choice: 本文では「仕えた」とし、相の幅を脚注に残す
  alternative: 仕え始めた
  rationale: 未完了過去は進行・継続を示し得るが、開始を必ず明示するわけではないため、本文で一方に限定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。敬体を避けた聖書本文らしい簡潔で品位ある叙述とし、ギリシア語の接続詞の反復は日本語の流れに合わせて整理した。
