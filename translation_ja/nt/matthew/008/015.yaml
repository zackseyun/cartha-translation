    reason: lexical_alternative
  revision_rationale: 安全に訂正すべき箇所はない。διηκόνειの未完了過去について、本文の「仕えた」は日本語の叙述として継続・開始のいずれも明示しすぎず、脚注が「仕え始めた」という可能性を適切に示している。
