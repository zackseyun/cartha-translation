  naturalness: 平明で自然な現代標準日本語である。「イエスがペテロの家に入ると」は叙事文として自然であり、「ご覧になった」も本文全体の敬語方針として無理がない。「しゅうとめ」は聖書文脈で定着した語で、ひらがな表記も読みやすい。
  terminology: 「ペテロ」「しゅうとめ」「熱を出している」は、固有名・親族関係・病状を明確に表す。原文にない病床や熱の程度を補っておらず、神学的な解釈も加えていない。
