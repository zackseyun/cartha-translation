id: MAT.8.14
reference: Matthew 8:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: ja
  text: イエスがペテロの家に入ると、ペテロのしゅうとめが横たわり、熱を出しているのをご覧になった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: 入ると
  rationale: アオリスト分詞の時間的な関係を、自然な現代日本語で表した。「来られると」も可能だが、εἰς τὴν οἰκίαν と結びつくため「家に入ると」が明確である。
- source_word: οἰκίαν Πέτρου
  choice: ペテロの家
  rationale: 属格による所有を簡潔かつ自然に表した。
- source_word: πενθερὰν αὐτοῦ
  choice: ペテロのしゅうとめ
  rationale: πενθεράは妻の母、すなわち「しゅうとめ」を指す。日本語で「彼の」とすると直前のイエスを指すようにも読めるため、指示対象をペテロと明示した。
- source_word: βεβλημένην
  choice: 横たわり
  rationale: 完了受動分詞が表す、横たえられた結果としてその状態にあることを簡潔に表した。「床に伏し」は病床を補い、「寝ていて」は睡眠とも取れるため避けた。
- source_word: πυρέσσουσαν
  choice: 熱を出している
  rationale: 発熱している継続的な状態を、平明で自然な現代日本語にした。「高熱」は原文以上の程度を加えるため採らなかった。
theological_decisions:
- issue: αὐτοῦ（その人の）の指示対象
  choice: ペテロを指すものとして「ペテロのしゅうとめ」と明示する
  alternative: 「彼のしゅうとめ」として代名詞を保持する
  rationale: 統語と文脈から指示対象はペテロであり、イエスではない。日本語の代名詞による不要な誤解を避けつつ、ペテロにしゅうとめがいたという本文の叙述以上の結論は加えない。
translation_notes:
  register: 平明な現代標準日本語を用いながら、叙事文としての品位を保った。「ご覧になった」はイエスを主語とする自然な敬語表現であり、過度に古風な語法は避けた。
