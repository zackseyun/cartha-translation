id: MAT.8.17
reference: Matthew 8:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: ja
  text: 'それは、預言者イザヤを通して次のように語られたことが実現するためであった。


    「彼自身が、私たちの弱さ[a]を引き受け、


    私たちの病を担った[b]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「病気」または「虚弱」とも訳せる。原語は、弱さ、虚弱、病気を表しうる。
    reason: lexical_alternative
  - marker: b
    text: 「負った」とも訳せる。原語には、運ぶ、担う、負うという意味がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: 実現するためであった
  rationale: 目的と結果の両面を帯びうる成就表現を、日本語として自然な形で保つ。「実現する」は預言されたことが現実となる意味を明瞭に伝える。
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: 預言者イザヤを通して語られたこと
  rationale: διά＋属格の媒介性を「通して」で表し、神が預言者を介して語るという含みを保つ。
- source_word: λέγοντος
  choice: こう言われている
  rationale: 引用導入を明瞭で自然な現代日本語にした。直前の「語られた」との不自然な重複も抑える。
- source_word: Αὐτὸς
  choice: この方自身が
  rationale: 明示された代名詞の強調を「自身」で保つ。「この方」は引用文中の指示対象を品位ある日本語で示す。
- source_word: ἀσθενείας
  choice: 弱さ
  rationale: 身体的な病気を含みつつ、弱さ・虚弱という語の広がりを保つ。直後の νόσους「病」との語彙上の区別も維持する。
- source_word: ἔλαβεν
  choice: 引き受け
  rationale: 単なる取得ではなく、人の弱さを自ら負う文脈を自然に表す一方、「取り去った」とまでは限定しない。
- source_word: νόσους
  choice: 病
  rationale: 身体的疾患を指す語として簡潔で自然であり、文脈にも合う。
- source_word: ἐβάστασεν
  choice: 担った
  rationale: 運ぶ・負うという意味を保ち、イザヤ書引用の重みも伝える。日本語では「負った」も可能なため脚注に示す。
theological_decisions:
- issue: イザヤ53章4節の引用を、マタイの癒やしの文脈でどう表すか
  choice: 「弱さ」と「病」により身体的苦痛の文脈を示しつつ、「引き受け」「担った」で負うという含みを残す。
  alternative: 「病気」と「病」、または「患い」と「病」と訳し、身体的疾患により限定する。
  rationale: 直前の癒やしの記事との結びつきを明確にしながら、引用元が持つより広い意味や、苦難を担うという神学的緊張を狭く解決しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分には簡潔で格調ある表現を採用した。「この方自身」で強調を保ち、「弱さ」と「病」を区別して原文の二語を反映した。
