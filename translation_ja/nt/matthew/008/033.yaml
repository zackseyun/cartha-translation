  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: ja
  text: すると、豚の世話をしていた者たちは逃げ、町へ行って、すべてのことと、悪霊につかれた男たちに関すること[a]を報告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪霊につかれた男たちに起こったことも」。原文は直訳すると「悪霊につかれた者たちに関することも」。
    reason: 属格表現τὰ τῶν δαιμονιζομένωνは、彼らに関する事柄全般とも、彼らに起こった出来事とも理解できるため。
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: すると、豚の番をしていた者たちは
  rationale: βόσκοντες は直訳すれば「飼っていた者たち／草を食べさせていた者たち」。直前の豚の群れを世話する者たちを指すため、現代日本語で自然な「豚の番をしていた者たち」とした。δέ は物語の進行を示す「すると」で表した。
- source_word: ἔφυγον
  choice: 逃げ
  rationale: φεύγω のアオリストであり、その場から逃げ去る動きを簡潔に表す。
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: 町へ行って
  rationale: 先行動作を示すアオリスト分詞を自然な連用表現にし、εἰς の方向性を「へ」で表した。
- source_word: ἀπήγγειλαν πάντα
  choice: すべてのことを報告した
  rationale: ἀπαγγέλλω は知らせる、報告するの意。πάντα の包括性を保ちつつ、出来事を町で伝える文脈に合う「報告した」とした。
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: また悪霊につかれた男たちのこと
  rationale: 字義的には「また、悪霊につかれた者たちに関すること」。出来事の内容を明示しすぎず、原文の簡潔さと幅を保った。「男たち」は男性複数形と直前の二人の男性という文脈に基づく。
- source_word: δαιμονιζομένων
  choice: 悪霊につかれた
  rationale: 悪霊の支配・影響下にある状態を示す語として、一般読者に明瞭で定着した表現を用いた。原文にない作用の程度や仕組みは付加しない。
theological_decisions:
- issue: δαιμονιζομένων が示す悪霊による状態の表現
  choice: 悪霊につかれた男たち
  alternative: 悪霊に苦しめられていた男たち
  rationale: 物語が実在する悪霊による深刻な状態を描くことを保ちつつ、その状態を特定の教理的分類に細分化しない。「苦しめられていた」では語の支配的含意が弱まる可能性があるため採らなかった。
- issue: τὰ τῶν δαιμονιζομένων の曖昧さ
  choice: 悪霊につかれた男たちのこと
  alternative: 悪霊につかれた男たちに起こったこと
  rationale: 属格句は彼らに関する事柄を広く指し得る。「起こったこと」と限定せず、原文の幅を本文に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔で品位ある調子にした。「一部始終」は自然だが πάντα の単純な包括性に慣用的な含みを加え得るため避けた。脚注記号は対応する句の後に置いた。
