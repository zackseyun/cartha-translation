  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: ja
  text: 夕方になると、人々は悪霊につかれた多くの人をイエスのもとに連れて来た[a]。イエスは一言で悪霊を追い出し、病気の人を皆癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪霊に苦しめられていた人々」。ギリシャ語の分詞は、悪霊の影響下にある人々を指す。「悪霊につかれた」は慣用的で簡潔な訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 夕方になると
  rationale: 属格独立構文による時を示す表現。出来事の進行を自然な現代日本語で表しつつ、「夕方になった時」という原文の意味を保つ。
- source_word: προσήνεγκαν αὐτῷ
  choice: 人々は…イエスのもとに連れて来た
  rationale: ここでの προσφέρω は人をイエスのところへ連れて来ることを指す。主語は明示されていないため、文脈に適した一般的な「人々」を補い、代名詞 αὐτῷ は指示対象を明確にするため「イエス」とした。
- source_word: δαιμονιζομένους πολλούς
  choice: 悪霊につかれた者を大勢
  rationale: 悪霊の影響下にある人々を表す分詞。「悪霊につかれた」は日本語で簡潔かつ慣用的だが、支配の程度を厳密に規定しない原語の幅は脚注で示す。
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: 霊どもを追い出し
  rationale: ἐκβάλλω の強い排除の意味を「追い出す」で表し、目的語 τὰ πνεύματα は原文どおり「霊」とした。文脈上は悪い霊だが、本文では原文にない形容を加えない。
- source_word: λόγῳ
  choice: ことば一つで
  rationale: 手段を示す与格。「一つ」は日本語で無冠詞の λόγῳ が持つ簡潔な命令の力を自然に伝える表現であり、原文にない「自分の」は加えない。
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: 病気の人を皆
  rationale: κακῶς ἔχειν は病んでいる状態を表す慣用句。治癒の文脈に即して、明快な「病気の人」とした。πάντας は「皆」で保持する。
- source_word: ἐθεράπευσεν
  choice: いやされた
  rationale: 福音書の治癒記事における θεραπεύω の標準的な意味を表す。日本語聖書としての品位を保つため「いやす」を用い、敬意を示す語法とした。
theological_decisions:
- issue: δαιμονιζομένους と τὰ πνεύματα が示す状態
  choice: 本文を「悪霊につかれた者」「霊ども」と訳し、悪霊による苦しみと霊の追放という本文の区別を保つ。
  alternative: 「悪霊に苦しめられていた者」とし、支配・憑依の含意を弱める。
  rationale: 本文は霊を追い出すことと病人をいやすことを並べており、その叙述上の区別を心理的・医学的説明に置き換えない。一方、δαιμονίζομαι が悪霊の影響の度合いを厳密に定義するとは限らないため、別訳を脚注に示す。
- issue: λόγῳ による追放の含意
  choice: 「ことば一つで」とし、イエスの命令の直接的な権威を簡潔に表す。
  alternative: 「ご自分のことばで」または「命じて」。
  rationale: 手段を示す原文を保ちながら、原文に明示されていない所有表現や具体的な発話内容を加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、福音書の叙述にふさわしい落ち着いた調子を保った。「ことば一つで」は自然な日本語でイエスの権威を表し、「霊ども」は複数形を明確にする。脚注記号は説明対象である「悪霊につかれた者」に関わる文の直後に置いた。
