review_pass:
  verdict: revise
  source_fidelity: 「悪霊につかれた二人の男」「墓場から出て来て」「だれもその道を通ることができないほどだった」は、ギリシア語の内容と結果構文をよく伝えている。ただし、ὑπήντησαν αὐτῷ は歓待を含み得る「迎えた」よりも、中立的な「出会った」が適切である。χαλεποὶ λίαν は具体的な暴力を必ずしも述べないため、「非常に危険な者たち」とするのが安全である。
  naturalness: 全体として明瞭な現代標準日本語である。「二人は」と受けて結果を述べる構成も自然である。地名異読の脚注は、対象語「ガダラ人」に直接付すべきである。
  terminology: 「悪霊につかれた」は δαιμονιζόμενοι の通用する自然な訳語であり、過度に教理化していない。「ガダラ人」はSBLGNT本文に一致する。μνημεῖα はこの文脈では「墓場」で問題ない。
  issues:
  - severity: medium
    issue: 「イエスを迎えた」
    rationale: ὑπαντάω はここでは「出会う／行き会う」の意味であり、「迎える」には歓迎・受け入れの含みがあり得る。後続する危険な描写との関係でも中立的な「出会った」がよい。
  - severity: low
    issue: 「非常に凶暴で」
    rationale: χαλεπός は「手に負えない、危険な、恐ろしい」を表し、本文は暴力的行為を明示しない。「凶暴」は可能な解釈だが、身体的暴力をやや具体化するため、「非常に危険な者たちで」として語義の幅を保つ。
  - severity: medium
    issue: 地名異読の脚注アンカー位置と脚注c
    rationale: 写本異読の脚注aは「向こう岸に着くと」ではなく「ガダラ人」に付すべきである。また脚注cの「通り抜ける」は本文の「通る」と実質的な差が乏しく、原文上の有意な代替を示していないため不要である。
  revised_text: イエスが向こう岸にあるガダラ人[a]の地方に着くと、悪霊につかれた二人の男が墓場から出て来て、イエスに出会った。二人は非常に危険な者たちで[b]、だれもその道を通ることができないほどだった。
