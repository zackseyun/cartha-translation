revisions:
- from: イエスが向こう岸にあるガダラ人の地方に着くと[a]、悪霊につかれた二人の男が墓場から出て来て、イエスを迎えた。二人は非常に凶暴で[b]、だれもその道を通ることができないほどだった[c]。
  to: イエスが向こう岸にあるガダラ人[a]の地方に着くと、悪霊につかれた二人の男が墓場から出て来て、イエスに出会った。二人は非常に危険な者たちで[b]、だれもその道を通ることができないほどだった。
  rationale: 中立的な出会いを表す動詞に改め、χαλεπόςの危険性を保ちつつ「凶暴」という具体化を脚注の別訳へ移した。地名異読のアンカーを該当する語へ移動し、実質的に重複する脚注cを削除した。
