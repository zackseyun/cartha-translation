id: MAT.8.28
reference: Matthew 8:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: ja
  text: イエスが向こう岸にあるガダラ人[a]の地方に着くと、悪霊につかれた二人の男が墓場から出て来て、イエスに出会った。二人は非常に危険な者たちで[b]、だれもその道を通ることができないほどだった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「ガダラ人」の代わりに「ゲルゲサ人」または「ゲラサ人」とある。
    reason: textual_variant
  - marker: b
    text: 別訳「非常に凶暴で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ εἰς τὸ πέραν
  choice: イエスが向こう岸に……着くと
  rationale: 属格独立構文を自然な時の節で表し、τὸ πέρανを湖の「向こう岸」とした。文脈上の指示対象を日本語で明確にするため「イエス」を補った。
- source_word: εἰς τὴν χώραν τῶν Γαδαρηνῶν
  choice: ガダラ人の地方に
  rationale: χώραを領域を表す自然な日本語「地方」とし、SBLGNT本文のΓαδαρηνῶνに従って地名を音写した。
- source_word: δύο δαιμονιζόμενοι
  choice: 悪霊につかれた二人の男
  rationale: 悪霊の現実的な支配を表しつつ、ギリシア語以上にそのあり方を定義しない、一般読者に通じる表現とした。男性複数は「二人の男」で明示した。
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: 墓場から出て来て
  rationale: μνημεῖονはここでは埋葬所を指すため「墓場」とし、分詞を日本語の自然な連用節にした。
- source_word: ὑπήντησαν αὐτῷ
  choice: イエスを迎えた
  rationale: ὑπαντάωの「出会う、迎えに出る」という方向性を保ち、彼らが墓場から出て来て接近した場面に合う表現とした。敵意そのものは後続句に委ねた。
- source_word: χαλεποὶ λίαν
  choice: 非常に凶暴で
  rationale: χαλεπόςがこの文脈で表す恐ろしさと危険性を「凶暴」で伝え、λίανを「非常に」で明示した。
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: だれもその道を通ることができないほどだった
  rationale: ὥστεの結果を「ほど」で自然に示し、ἰσχύωをここでは能力の否定、διὰ τῆς ὁδοῦを通行経路として訳した。
theological_decisions:
- issue: 悪霊による状態の表現
  choice: 悪霊につかれた
  alternative: 悪霊の支配下にあった／悪霊に苦しめられていた
  rationale: δαιμονίζομαιが示す悪霊的支配を明確にしながら、支配の仕組みや程度について本文にない体系的説明を加えないため。
- issue: 地名の本文異読
  choice: ガダラ人
  alternative: ゲルゲサ人／ゲラサ人
  rationale: 主本文はSBLGNTのΓαδαρηνῶνに従い、重要な写本異読は脚注に残した。
- issue: χαλεπόςが表す危険性
  choice: 凶暴
  alternative: 危険／手に負えない
  rationale: 通行不能という結果につながる人々の恐ろしい状態を自然に示す一方、具体的な暴力行為を本文に付加しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある叙述調とした。「悪霊につかれた」は広く理解される慣用表現だが、神学的な機序を過度に規定しない。地名異読と主要な語義の幅は脚注で保持した。
