reference: Matthew 8:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: ja
  text: イエスはその人に言われた。「だれにも言わないように気をつけなさい。ただ、行って祭司に自分を見せ、モーセが命じた供え物[b]を、彼らへの証しとして献げなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼ら」が誰を指すかは本文で明示されていない。「彼らへの証しとして」は、祭司たちに示す証拠を指すとも、不信じる者たちへの証言を含むとも理解されるが、本文はそのいずれかに限定していない。
    reason: alternative_reading
  - marker: b
    text: これは、皮膚の病から清められた人についてモーセの律法が定めた手続きに関わる。レビ記14章参照。
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: だれにも話さないように気をつけなさい
  rationale: Ὅραを警告・注意を促す命令として自然な日本語にし、μηδενὶ εἴπῃςの禁止を明確に表した。
- source_word: ὕπαγε
  choice: 行って
  rationale: 移動を命じる単純な命令として、文脈に自然な表現を選んだ。
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: 自分の体を祭司に見せ
  rationale: 直訳的な「自分自身を見せる」より自然で、祭司による身体の確認という文脈も伝わる表現とした。ギリシア語の定冠詞は、律法上しかるべき祭司を指すものとして日本語では単に「祭司」とした。
- source_word: προσένεγκον τὸ δῶρον
  choice: 供え物を献げなさい
  rationale: 祭儀的文脈に合わせ、προσένεγκονを「献げる」、δῶρονを「供え物」とし、単なる贈り物や持参品との誤解を避けた。
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: モーセが命じた
  rationale: προστάσσωの命令・規定の意味を簡潔に保ち、モーセ律法への言及を明確にした。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: それが彼らへの証しとなるためである
  rationale: εἰςの目的・結果の幅とμαρτύριονの「証し／証拠」の意味を保ち、αὐτοῖςの指示対象や証しの肯定的・対立的性格を特定しなかった。
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: イエスはその人に言われた
  rationale: 歴史的現在を自然な日本語の過去形で表し、イエスへの敬意を示す一般的な聖書文体として尊敬表現を用いた。
theological_decisions:
- issue: 「彼らへの証し」の指示対象と性格
  choice: 「彼ら」と訳し、祭司たち、民、指導者などに限定せず、「証し」が証拠なのか不信への証言なのかも確定しない。
  alternative: 「祭司たちへの証拠として」または「彼らに対する証言として」
  rationale: αὐτοῖςの指示対象は本文中で明示されず、μαρτύριονも広い意味を持つため、原文の真正な曖昧さを保存した。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語とした。命令の強さを保ちつつ不自然な逐語訳を避け、「彼らへの証し」の曖昧さは本文中に残した。
