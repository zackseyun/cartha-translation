  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: ja
  text: 人々は驚いて言った。「いったい、この人はどのような人[a]なのだろう。風も湖もこの人に従うのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どんな人」。ギリシア語は、この人がどのような種類・性質の人物なのかを問う表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: 一同は
  rationale: 文脈上、舟にいた人々を指す。日本語の「男たち」は不自然に性別を強調するため、集団を自然に示す「一同」とした。δέはここでは叙述の流れに溶け込ませた。
- source_word: ἐθαύμασαν λέγοντες
  choice: 驚いて言った
  rationale: 驚嘆と発言の同時的なつながりを、現代日本語で自然な連用形により表した。
- source_word: Ποταπός ἐστιν οὗτος
  choice: いったいどのような方なのだろう
  rationale: ποταπόςが問う人物の種類・性質を保ち、驚きの強さを「いったい」で表した。「この方」だけで人物を指すことが明確なため、「人」と限定しなかった。
- source_word: ὅτι
  choice: 〜とは
  rationale: 後続する事実が驚きの根拠であることを、日本語の感嘆的な「〜とは」で自然に示した。
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: 風も湖も
  rationale: 反復するκαίを「も…も」で表し、自然界まで従うという強調を保った。θάλασσαはこの文脈ではガリラヤ湖を指すため「湖」とした。
- source_word: αὐτῷ ὑπακούουσιν
  choice: この方に従う
  rationale: ὑπακούωが示す権威への服従を「従う」で明確に表し、代名詞の指示対象も自然な日本語で示した。
theological_decisions:
- issue: 弟子たちの問いが持つキリスト論的含意
  choice: 自然界さえ従う権威への驚きを保ちつつ、イエスがどのような方かという問いを未解決のまま提示した。
  alternative: イエスの神性または創造主としての権威を訳文中で明示する。
  rationale: 本文はイエスの並外れた権威を暗示するが、ここでは人々の驚きと問いとして語られている。訳文で教理的結論を補わず、物語上の緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、聖書物語にふさわしい落ち着いた格調を保った。語順は日本語として自然になるよう、驚きの根拠である「風も湖も…」を問いの前に置いた。
