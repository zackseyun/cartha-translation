  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: ja
  text: イエスが山から下りて来られた後、大勢の群衆がイエスに従った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: イエスが……下りて来られると
  rationale: 属格独立構文のアオリスト分詞を、先行する出来事を示す自然な時間節として訳した。主語は文脈上イエスであり、日本語で明確にした。δέは軽い接続なので、「と」による流れの中に反映した。
- source_word: ἀπὸ τοῦ ὄρους
  choice: 山から
  rationale: ὄροςは山または丘を意味し得るが、直前の説教の舞台を受ける定冠詞付きの表現であり、「山から」が簡潔で自然である。
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスに従った
  rationale: ἀκολουθέωと与格の組み合わせを、福音書で一般的かつ自然な「～に従う」とした。ここでは実際について行く行為を表すが、弟子として従うという語の含みを不必要に排除しない。
- source_word: ὄχλοι πολλοί
  choice: 大勢の群衆
  rationale: 後置されたπολλοίが群衆の人数の多さを表すため、現代日本語として自然な「大勢の群衆」とした。複数形は日本語では通常、明示しなくても文脈上十分に伝わる。
theological_decisions:
- issue: ἀκολουθέωが物理的な追随だけか、弟子として従うことも含むか
  choice: 従った
  alternative: 後について行った
  rationale: 原文の動詞が持ち得る通常の追随と弟子道の含みを保持し、一方に限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文として簡潔かつ品位ある調子にした。敬語はイエスの動作にのみ「来られる」を用い、過度に荘重な文語表現は避けた。
