id: MAT.8.29
reference: Matthew 8:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: ja
  text: すると、見よ、彼らは叫んで言った。「神の子よ、私たちとあなたに何の関わりがあるのですか[a]。定めの時[b]より前に、私たちを苦しめるためにここへ来たのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちとあなたに何があるのですか」。相手との関係や干渉を拒む慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「定めの時」は、直訳では「時」。ギリシア語は、ふさわしい時や定められた時を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίによる展開と、ἰδούの注意を引いて場面を生き生きと示す力を保った。「見よ」は現代語としてやや格調があるが、聖書本文で理解可能であり、標識を省略しない。
- source_word: ἔκραξαν λέγοντες
  choice: 叫んで言った
  rationale: κράζωの大声で叫ぶ強さと、λέγοντεςの発話導入を簡潔で自然な日本語にした。
- source_word: Τί ἡμῖν καὶ σοί
  choice: 私たちとあなたに何の関わりがあるのですか
  rationale: 双方の関係を拒むセム語的な慣用表現であり、「何の用ですか」と意訳し切らず、対立的な響きと原文の曖昧さを残した。
- source_word: υἱὲ τοῦ θεοῦ
  choice: 神の子よ
  rationale: イエスに対する直接の呼びかけである称号を、説明を加えずそのまま訳した。
- source_word: ἦλθες ὧδε
  choice: ここへ来たのですか
  rationale: ἦλθεςを到来についての問い、ὧδεを場所を示す「ここへ」として自然に表した。
- source_word: πρὸ καιροῦ
  choice: 定めの時より前に
  rationale: καιρόςが単なる時間ではなく、ふさわしい時・定められた時を指し得ることを示しつつ、誰がどのように定めたかは本文以上に特定しない。
- source_word: βασανίσαι
  choice: 苦しめるために
  rationale: 裁きに伴う激しい苦痛を表す語だが、身体的拷問だけに限定しない「苦しめる」が文脈に適する。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 話している複数者を指す対格をそのまま訳した。
theological_decisions:
- issue: 悪霊たちによるイエスの身分の認識
  choice: 神の子よ
  alternative: 神の御子よ
  rationale: 原文の称号を直接保ち、悪霊たちが認識している内容を弱めず、同時に本文にない説明も加えない。「神の子」は明瞭な現代標準語である。
- issue: καιρόςの終末論的含意
  choice: 定めの時より前に
  alternative: 時より前に
  rationale: 文脈は苦しみ・裁きのための一定の時を示唆する。「定めの時」はその含意を保つが、詳細な終末論の体系までは持ち込まない。
- issue: Τί ἡμῖν καὶ σοίの関係拒絶の慣用句
  choice: 私たちとあなたに何の関わりがあるのですか
  alternative: 私たちに何の用ですか
  rationale: 自然さを保ちながら、単なる用件の質問ではなく、関係や干渉を拒む表現であることを残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」と呼格の「神の子よ」で原文の切迫感と格調を保った。慣用句は過度に口語化せず、神学的・語用論的な緊張を残している。
