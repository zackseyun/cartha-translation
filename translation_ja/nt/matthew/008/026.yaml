id: MAT.8.26
reference: Matthew 8:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: ja
  text: イエスは彼らに言われた。「なぜ恐れているのか、信仰の薄い者たちよ。」それから起き上がり、風と湖を叱りつけられた。すると、大きな凪となった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: 怖がる
  rationale: 文脈上、嵐を前にした弟子たちの恐れを自然な現代日本語で表す。「臆病な者たち」よりも発話として明瞭である。
- source_word: ὀλιγόπιστοι
  choice: 信仰の薄い者たち
  rationale: 弟子たちに信仰が全くないのではなく、その乏しさを指摘する語意を保つ。
- source_word: ἐπετίμησεν
  choice: 叱りつけられる
  rationale: 風と水域に対する強い制止命令を表し、単なる「命じる」より原語の叱責の響きを保つ。
- source_word: θάλασσα
  choice: 湖
  rationale: この場面の水域はガリラヤ湖であり、日本語では地理的実体に即して「湖」とするのが自然である。
- source_word: γαλήνη μεγάλη
  choice: すっかり凪になった
  rationale: μεγάληの強意を「すっかり」で表し、嵐から完全な静穏へ変わった状態を自然に伝える。
theological_decisions:
- issue: ὀλιγόπιστοιが示す弟子たちの信仰の評価
  choice: 信仰の薄い者たち
  alternative: 不信仰な者たち
  rationale: 原語は信仰の欠如そのものより信仰の小ささ・乏しさを示すため、全面的な不信仰とは訳さない。
- issue: 風と湖への叱責における人格化
  choice: 叱りつけられる
  alternative: 静まるよう命じられる
  rationale: 被造物に対して用いられた原文の強い動詞をそのまま保ちつつ、その背後にある存在や仕組みについて本文以上の解釈を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。イエスへの敬意は日本語の主語と述語の尊敬表現で示し、弟子への問いは簡潔で直接的な調子を保った。
