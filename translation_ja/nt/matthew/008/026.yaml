  - severity: medium
    issue: γαλήνη μεγάληの「大きな」要素が「すっかり」だけでは十分に表れていない
    rationale: 「すっかり」は完全性を表すが、μεγάληは大いなる・深い静穏をいう。「大きな凪」を用いて明示する。
