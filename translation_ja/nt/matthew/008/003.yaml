  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: ja
  text: イエスは手を伸ばしてその人に触れ、言われた。「そうしよう。清くなれ。」すると、たちまちその人の皮膚病[a]は清められた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「皮膚病」と訳したギリシア語は、現代のハンセン病に限らず、さまざまな皮膚疾患を指すことがあります。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 手を伸ばして
  rationale: 先行する身ぶりを自然な日本語で具体的に表し、直後の接触へ滑らかにつなげる。
- source_word: ἥψατο αὐτοῦ
  choice: その人に触れ
  rationale: ἅπτομαι＋属格の通常の意味である「触れる」を採り、癒やしの場面に即して簡潔に訳す。
- source_word: Θέλω
  choice: そうしよう
  rationale: 直前の願いに対する意志と承諾を自然な日本語で表す。「望んでいる」より応答として自然であり、単なる未来予告にも限定しない。
- source_word: καθαρίσθητι
  choice: 清くなれ
  rationale: 身体的回復と清浄の両面を含む καθαρίζω の語感を保つため、「治れ」ではなく清めの表現を用いる。
- source_word: εὐθέως
  choice: たちまち
  rationale: 結果が即座に生じたことを、明快で品位ある現代日本語で示す。
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: その人の皮膚病は清められた
  rationale: ギリシア語と同じく病を文法上の主語として保ち、命令の「清くなれ」と語彙的に対応させる。
- source_word: ἡ λέπρα
  choice: 皮膚病
  rationale: λέπρα は現代のハンセン病だけに限定できないため、当時の広い疾病分類を誤解なく伝える語を本文に採用する。
theological_decisions:
- issue: καθαρίζω における清浄と癒やし
  choice: 命令と結果の双方を「清い／清める」の語で訳す
  alternative: 「治れ／治った」と訳す
  rationale: 原文の清浄概念を保ち、身体的治癒だけに意味を狭めないため。
- issue: イエスの返答 Θέλω の意味
  choice: 「そうしよう」
  alternative: 「わたしは望む」「よろしい」
  rationale: 願いに対する自発的な承諾を表しつつ、意志の宣言と命令のつながりを自然な日本語にする。神学的な含意を過度に補わない。
translation_notes:
  register: 明快な現代標準語を用いながら、「清くなれ／清められた」によって原文の身体的・宗教的清浄の重なりを保持した。「そうしよう」は簡潔で威厳ある応答として Θέλω の意志と承諾を伝える。
