  verdict: approve
  source_fidelity: καὶ ἰδού is represented by「すると、見よ」, retaining both the narrative transition and attention-directing force. 「重い皮膚病を患う人」is an established Japanese way of rendering λεπρός without equating the ancient category uncritically with a specific modern diagnosis. The approach, prostration, respectful address, conditional appeal to Jesus’ will, ability, and cleansing are all conveyed accurately. 「ひれ伏して」appropriately leaves προσκυνέω’s precise religious force open, and「清くする」preserves καθαρίσαι’s cleansing resonance.
  naturalness: The wording is clear, fluent modern standard Japanese with a suitably respectful and slightly elevated biblical register. 「見よ」and「清くする」are marked but intelligible choices that appropriately preserve the source’s discourse and ritual-religious coloring. The honorific forms in the direct address are natural.
  terminology: 「主よ」is appropriate for Κύριε and retains its respectful and potentially fuller theological range. 「重い皮膚病を患う人」avoids stigmatizing person-first terminology while reflecting conventional Japanese biblical usage. The footnote properly identifies「礼拝して」as a possible, but not compulsory, construal of προσκυνέω.
