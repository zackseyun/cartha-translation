id: MAT.8.2
reference: Matthew 8:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: ja
  text: すると、見よ、重い皮膚病を患う人が近寄り、イエスの前にひれ伏して[a]言った。「主よ、お望みになれば、私を清くすることがおできになります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスを礼拝して」とも訳せる。このギリシア語動詞は、文脈により、ひれ伏して敬意を表すこと、敬礼すること、または礼拝することを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 読者の注意を場面へ向ける談話標識の力と、物語の生き生きとした調子を保つため。現代日本語ではやや改まった表現だが、聖書本文として明瞭である。
- source_word: λεπρὸς
  choice: 重い皮膚病を患う人
  rationale: λεπρόςは伝統的に「らい病人」と訳されてきたが、古代の用法は現代医学上のハンセン病だけに限定されない。「重い皮膚病」は病名を不当に特定せず、「患う人」として人を病状そのものと同一視することも避ける。
- source_word: προσελθὼν
  choice: 近寄り
  rationale: イエスのもとへ接近する動作を簡潔かつ自然に表す。
- source_word: προσεκύνει
  choice: イエスの前にひれ伏して
  rationale: 身体を低くして敬意を示す動作を明示しつつ、それが礼拝を意味するか敬礼を意味するかを本文で断定しない。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけと、マタイ福音書におけるキリスト論的な含みの両方を保つ。「先生」などに狭めない。
- source_word: ἐὰν θέλῃς
  choice: お望みになれば
  rationale: イエスの意志を条件とする願いを、敬意のある自然な現代日本語で表す。
- source_word: δύνασαί
  choice: おできになります
  rationale: 単なる可能性ではなく、そうする能力・力があるとの確信を敬語で自然に表す。
- source_word: καθαρίσαι
  choice: 私を清くする
  rationale: 病の治癒だけでなく、皮膚病に伴う宗教的・社会的な清めの含意も保つため、「治す」ではなく「清くする」とする。
theological_decisions:
- issue: イエスに対する προσκυνέω の意味
  choice: 敬意を示す身体動作として「イエスの前にひれ伏して」と訳し、脚注で「礼拝した」の可能性を示す。
  alternative: 「イエスを礼拝して」または「イエスに敬意を表して」
  rationale: この動詞は、ひれ伏すこと、敬意を表すこと、礼拝することまでを意味し得る。文脈上、深い敬意は明らかだが、本文で「礼拝」と断定すると意味の幅を狭めるため、神学的な緊張を残す。
- issue: καθαρίσαι における治癒と清め
  choice: 「私を清くする」と訳す。
  alternative: 「私を治す」
  rationale: 皮膚病からの回復には身体的治癒と儀礼的清浄の回復が重なっているため、原語の「清める」という表現を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、嘆願の場面にふさわしい敬意と格調を保った。「見よ」と「清くする」は原文の談話的・宗教的含意を保持するため、意図的にやや聖書的な表現として残した。
