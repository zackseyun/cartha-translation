  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: ja
  text: イエスは百人隊長に言った。「行きなさい。あなたが信じたとおりになるように。」その時、しもべ[a]は癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「少年」「子ども」。ギリシア語のπαῖςは、しもべを指すことも、若者や子どもを指すこともある。この文脈では、百人隊長の配下である「しもべ」が最も適切である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: 百人隊長
  rationale: ローマ軍でおよそ百人の兵を率いた将校を指す、福音書で定着した正確な訳語。
- source_word: Ὕπαγε
  choice: 行きなさい
  rationale: 立ち去るよう命じる簡潔な命令形を、自然な現代日本語で表した。
- source_word: ὡς ἐπίστευσας
  choice: あなたが信じたとおり
  rationale: 名詞の「信仰」に置き換えず、πιστεύωの動詞としての力と、百人隊長自身が信じたことを保持した。
- source_word: γενηθήτω σοι
  choice: あなたのためにそうなるように
  rationale: γίνομαιの受動命令形が持つ願望・命令的な力と、σοιの受益的な意味を自然な日本語で表した。「そう」は直前までに語られた癒やしの実現を受ける。
- source_word: παῖς
  choice: しもべ
  rationale: 直前の文脈では百人隊長の配下を指し、並行する語としてδοῦλοςも使われるため、「しもべ」が最も適切。ただし、若者や子どもを指し得る語義は脚注に残した。
- source_word: ἰάθη
  choice: 癒やされた
  rationale: 病からの回復を表すἰάομαιの受動形を、聖書本文として自然で意味の明確な表現にした。
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: その時
  rationale: 字義的には「その時刻に」だが、現代日本語では「その時」が自然であり、即時性を保ちつつ厳密な瞬間と過度に限定しない。
theological_decisions:
- issue: πιστεύωを表す信仰関連語の訳し方
  choice: 信じた
  alternative: 信頼した／信仰を持った
  rationale: 動詞形を保ち、百人隊長の行為を直接述べる標準的な表現とした。信仰を抽象名詞化したり、特定の教理的解釈を加えたりしない。
- issue: 百人隊長の信じたことと結果との関係
  choice: 信じたとおり、あなたのためにそうなるように
  alternative: あなたの信仰に応じて、そうなれ
  rationale: ὡςが示す対応関係は保つが、信仰を癒やしの功績や交換条件と断定する表現は避け、原文の緊張をそのまま残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの言葉には簡潔で dignified な調子を保った。「僕」は「ぼく」と読まれる可能性があるため、本文では「しもべ」と平仮名表記にした。
