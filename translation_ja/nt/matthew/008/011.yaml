id: MAT.8.11
reference: Matthew 8:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: ja
  text: しかし、あなたがたに言います。多くの人が東からも西からも来て、天の御国でアブラハム、イサク、ヤコブと共に食卓に着きます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「横になって食事の席に着きます」。当時は宴席で横になって食事をする習慣がありました。
    reason: cultural_note
  - marker: b
    text: 「東からも西からも」は、遠く離れた各地から来ることを表し、イスラエルの外から来る人々をも含むと考えられます。
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: しかし、あなたがたに言います
  rationale: δέが示す前文からの穏やかな対比・展開を「しかし」で表し、λέγωとὑμῖνを明瞭で自然な現代日本語にした。
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 名詞的に用いられた形容詞であり、日本語では「人」を補うことで自然かつ明確になる。
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: 東からも西からも
  rationale: 複数形は東西の方角・地域を広く指す慣用表現。「も…も」により両方から来る広がりを自然に示した。
- source_word: ἥξουσιν
  choice: 来て
  rationale: 「来る／到着する」の意。後続の動詞と結んで、将来の出来事を日本語として流麗に表した。
- source_word: ἀνακλιθήσονται
  choice: 食卓に着きます
  rationale: 古代の宴席で横になって食事をする動作を指す。姿勢を逐語的に「横たわる」とせず、食事と交わりの情景が現代の読者に伝わる表現を選んだ。
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: アブラハム、イサク、ヤコブと共に
  rationale: μετά＋属格の同伴・交わりを「と共に」で保持し、人名は日本語で定着した表記とした。
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: 天の御国で
  rationale: マタイに特徴的な表現を、日本語聖書語として定着しつつ現代にも理解可能な「天の御国」とした。ἐνは宴席が行われる領域を示すため「で」とした。
theological_decisions:
- issue: 宴席の比喩と終末的な交わり
  choice: 「食卓に着きます」として食事・宴席の情景を残す
  alternative: 「共に横になります」または「共に座ります」
  rationale: 単なる同席や存在ではなく、宴席での交わりを表す動詞である。古代の姿勢を本文で不自然に逐語訳せず、脚注で説明することで、比喩の神学的・文化的力を保った。
- issue: 東西から来る「多くの人」の範囲
  choice: 地理的表現と「多くの人」をそのまま保ち、異邦人とは明記しない
  alternative: 「多くの異邦人が東からも西からも来て」
  rationale: 文脈はイスラエルの外からの参加を強く示唆するが、ギリシア語本文は「異邦人」と明記していない。含意を保ちつつ解釈を本文へ織り込まない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「言います」はイエスの発言として過度に古風な「言っておく」を避けた。「御国」は定着した聖書語だが理解可能であり、「天の王国」より自然。「食卓に着く」によって現代日本語の自然さと宴席の含意を両立させ、古代の横臥姿勢は脚注に委ねた。
