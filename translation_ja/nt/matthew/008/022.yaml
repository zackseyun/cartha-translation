id: MAT.8.22
reference: Matthew 8:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: ja
  text: しかし、イエスは彼に言われた。「わたしに従いなさい。死者たちには、自分たちの死者を葬ることは任せておきなさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最初の「死者」は比喩的に、霊的に応答しない人々を指し、その人々が肉体的に死んだ者を葬る、という意味に理解されることが多い。
    reason: 第一の「死者」の有力な比喩的解釈を示しつつ、本文の語義の曖昧さを保持するため。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の願いに対するイエスの応答の穏やかな対比を示す。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として自然であり、イエスへの敬意も保つ。
- source_word: Ἀκολούθει μοι
  choice: わたしに従いなさい
  rationale: 継続的な弟子としての追従を含む直接的な命令を、自然で明瞭な日本語にした。
- source_word: ἄφες
  choice: 葬らせておきなさい
  rationale: ここでは単なる許可よりも、その務めを彼らに任せて自らは離れる含みがあるため。
- source_word: νεκροὺς ... νεκρούς
  choice: 死者たち……死者
  rationale: 同一語の反復を保ち、第一の用例を『霊的に死んだ者』と本文で限定せず、意図的な語義の緊張を残す。
- source_word: θάψαι
  choice: 葬らせて
  rationale: ἄφεςに続く不定詞の使役・許容的関係を自然な日本語で表す。
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: 自分たちの死者
  rationale: 再帰代名詞による帰属の強調を保持する。
theological_decisions:
- issue: 二度現れる「死者」の解釈
  choice: 本文では二度とも「死者」とし、語の反復と緊張を保持する。
  alternative: 最初を「霊的に死んでいる者たち」、二度目を肉体的な「死者」と明示する。
  rationale: 最初の語は比喩的である可能性が高いが、原文は同じ語を用いており、「霊的に」を補うと解釈を本文に固定してしまうため。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳しい命令の響きを弱めない格調ある文体。歴史的現在は日本語の自然な叙述に合わせて過去形とし、敬語は「言われた」にとどめた。
