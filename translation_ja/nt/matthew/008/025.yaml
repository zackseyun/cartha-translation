id: MAT.8.25
reference: Matthew 8:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: ja
  text: 彼らは近寄ってイエスを起こし、こう言った。「主よ、私たちをお救いください[a]。私たちは死んでしまいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「助けてください」とも訳せる。ギリシア語の命令形は、目前の危険から救い出す意味にも、より広い意味で救うことにも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: 近寄って
  rationale: προσέρχομαιのアオリスト分詞で、イエスを起こす前にそのもとへ近づいたという動作の順序を表す。「近寄って」は移動を明示しつつ、原文以上の事情を加えない自然な訳である。
- source_word: ἤγειραν
  choice: 起こし
  rationale: ἐγείρωはここでは眠っている人を目覚めさせる具体的な意味であり、復活や高挙を示す用法ではない。「起こす」が現代日本語として最も自然で明確である。
- source_word: λέγοντες
  choice: こう言った
  rationale: 発言内容を導く現在分詞。日本語では前の動作とつないで「こう言った」とすることで、過度な感情表現を加えず自然な文になる。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριοςの呼格。単なる役職名に狭めず、マタイにおける称号の含みを保つため「主よ」とした。
- source_word: σῶσον
  choice: 私たちをお救いください
  rationale: σῴζωのアオリスト命令形で、ここでは目前の危険からの救出を求める切迫した願い。「救う」という語彙的つながりを保ち、文脈上明白な目的語「私たちを」を日本語で補った。
- source_word: ἀπολλύμεθα
  choice: 私たちは死んでしまいます
  rationale: ἀπόλλυμιの現在中動・受動態形で、差し迫った破滅や死を表す。嵐の中での具体的な危機として、現代日本語で自然かつ切迫感のある表現にした。
theological_decisions:
- issue: イエスへの呼びかけκύριοςをどう訳すか
  choice: 主よ
  alternative: 先生
  rationale: この呼びかけには敬称からキリスト論的な重みまで幅があり得る。その含みを狭めず保持するため「主よ」とした。
- issue: σῶσονの暗黙の目的語を明示するか
  choice: 私たちをお救いください
  alternative: お救いください
  rationale: ギリシア語の動詞自体には目的語が明記されていないが、直後の「私たちは死んでしまいます」と状況から対象は明白である。日本語で願いの内容を明瞭かつ自然にするため明示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「主よ」「お救いください」によって聖書本文としての品位を保った。危機の場面に合う自然な表現を選び、原文にない感情描写は加えていない。
