  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: ja
  text: イエスが舟に乗り込むと、弟子たちもイエスに従った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβάντι
  choice: 乗り込むと
  rationale: アオリスト分詞の時間的関係を、自然な日本語の「〜すると」で表した。主動詞に先立つ動作を示しつつ、「乗り込む」によって舟への移動を明確にした。
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖で用いられる比較的小型の船という文脈に適し、現代日本語として自然である。ギリシア語には冠詞がないが、日本語では定・不定を明示する必要がないため、「舟」とした。
- source_word: ἠκολούθησαν
  choice: 従った
  rationale: ここでの実際の移動と、マタイにおける弟子として従う含みの双方を保てる訳語である。単に「後から乗った」とはしなかった。
- source_word: μαθηταὶ
  choice: 弟子たち
  rationale: 福音書におけるイエスに学び従う者を表す定着した自然な訳語である。
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: イエスが／イエスに／弟子たち
  rationale: 文脈上、代名詞はいずれもイエスを指す。日本語で指示対象が曖昧にならないよう固有名を補い、最後の所有代名詞は自然な「弟子たち」という表現に組み込んだ。
theological_decisions:
- issue: ἀκολουθέωにある弟子として従う含み
  choice: 「従った」として、移動と弟子道の響きをともに残す
  alternative: 「ついて行った」または「一緒に行った」
  rationale: この場面では舟に乗るイエスに続く実際の行動だが、マタイではこの動詞が弟子として従うこともしばしば示す。「従った」はその緊張を過度に説明せず保つ。
translation_notes:
  register: 明快な現代標準日本語。「乗り込む」は具体的で自然、「従った」は簡潔で格調を保ちながら弟子道の含みも伝える。「も」は、イエスに続いて弟子たちが行動した流れを自然に示す補助である。
