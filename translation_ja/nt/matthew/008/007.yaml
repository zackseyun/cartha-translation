  text: And he says to him[a], “I will come and heal him.”
translation:
  language: ja
  text: そして、イエスは彼に言った[a]。「わたしが行って、彼を癒やそう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、「わたしが行って、彼を癒やそうか」。文脈からイエスの言葉を疑問文と取る解釈もあるが、ギリシア語の表現自体は平叙文として読むのが自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 単純な物語上の接続を、現代日本語で自然に示す。明示されていない強い因果関係は加えない。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語を生き生きと語る歴史的現在だが、日本語では過去形が自然である。主語がイエスであるため、文体上の敬意を示す形とした。
- source_word: αὐτῷ
  choice: 彼に
  rationale: λέγειに伴う与格の間接目的語を素直に表す。
- source_word: Ἐγὼ
  choice: わたしが
  rationale: 明示された一人称代名詞の軽い強調を、主格助詞「が」で自然に保つ。
- source_word: ἐλθὼν
  choice: 行って
  rationale: 主動詞に先立つ移動を、日本語の連用的な接続「行って」で自然に表す。話し手から相手のいる場所へ赴く文脈では「行く」が自然である。
- source_word: θεραπεύσω
  choice: 癒やそう
  rationale: 未来形が表す意志・約束を意志形で表し、治療・回復の意味を福音書の文脈に適した「癒やす」で訳す。
- source_word: αὐτόν
  choice: 彼を
  rationale: 病んでいる僕を指す男性単数対格を、曖昧さを増やさず「彼を」と表す。
theological_decisions:
- issue: 発言を平叙文と疑問文のどちらに訳すか
  choice: 平叙文：「わたしが行って、彼を癒やそう。」
  alternative: 疑問文：「わたしが行って、彼を癒やそうか。」
  rationale: ギリシア語には疑問を明示する語がなく、語順も自然には平叙文として読める。文脈から修辞疑問と解する見方は脚注に残し、本文では原文の素直な読みを採用する。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ。「癒やそう」は意志と申し出を自然に表す。脚注記号[a]は、平叙文か疑問文かという解釈上の分岐が生じる発言箇所に置いた。
