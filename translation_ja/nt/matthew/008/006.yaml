  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: ja
  text: そして、こう言った。「主よ、私のしもべ[a]が家で麻痺して横たわっており、ひどく苦しんでいます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の子」または「私の少年」とも訳せる。ギリシア語は、しもべにも子どもにも使われるが、百人隊長の文脈には「しもべ」が最もよく合う。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「ひどく苦しめられています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: そして、こう言った
  rationale: 現在分詞による前節からのつながりを保ちつつ、現代日本語の自然な物語文として定動詞で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけとも、より深い意味を持つ称号とも理解できる原文の幅を保つ。
- source_word: ὁ παῖς μου
  choice: 私のしもべ
  rationale: παῖςには子ども、少年、しもべの意味がある。百人隊長という文脈では「しもべ」が最も適切だが、別の可能性は脚注に残した。
- source_word: βέβληται
  choice: 伏せっていて
  rationale: 完了受動形が示す、倒れ伏した結果として今も横たわっている状態を、自然な日本語で表した。
- source_word: ἐν τῇ οἰκίᾳ
  choice: 家で
  rationale: 場所を示す句を簡潔で自然な現代日本語にした。
- source_word: παραλυτικός
  choice: 体を麻痺させ
  rationale: 身体が麻痺した状態を、一般読者に分かりやすい現代語で表した。
- source_word: δεινῶς βασανιζόμενος
  choice: ひどく苦しんでいます
  rationale: 激しい苦痛や責め苦を受けていることを明瞭に伝えつつ、その原因を本文以上に限定しない表現とした。
theological_decisions:
- issue: イエスへの呼びかけ Κύριε の意味合い
  choice: 主よ
  alternative: 先生／閣下
  rationale: 単なる丁寧な呼称とも、より高い認識を含む称号とも取り得る場面の神学的な開放性を保つため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、呼びかけには聖書本文としての品位を保つ「主よ」を採用した。「しもべ」は日常語よりやや荘重だが、古代の主従関係を「使用人」より適切に示す。
