  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: ja
  text: 彼らから遠く離れた所で、たくさんの豚の群れが餌を食べていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ
  choice: …いた
  rationale: ἦνは存在・状態を表し、分詞「餌を食べている」と合わせて自然な継続表現「食べていた」とした。δέは弱い物語上の接続辞であり、この一文では日本語の明示的な接続語を置かなくても流れが保たれるため、過剰に訳出しない。
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: 彼らから少し離れた所で
  rationale: ἀπόが起点「彼らから」を、μακράνが空間的隔たりを示す。本文では自然な日本語として「少し離れた所」とし、「遠く離れた所」という可能性を脚注に残した。
- source_word: ἀγέλη
  choice: 群れ
  rationale: 動物の集団を指す一般的で自然な現代日本語。
- source_word: χοίρων
  choice: 豚の
  rationale: χοῖροςを明瞭で通常の現代語「豚」と訳した。
- source_word: πολλῶν
  choice: たくさんの
  rationale: 複数属格で豚の数が多いことを直接修飾するため、日本語でも数量を明示する「たくさんの」とした。
- source_word: βοσκομένη
  choice: 餌を食べていた
  rationale: 中動態形の現在分詞は、ここでは群れが食物をあさり食べている状態を表す。「草を食べる」では豚について意味を狭め、「飼われていた」では明示されていない世話する者に焦点を移すため避けた。
