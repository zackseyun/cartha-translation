  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: ja
  text: すると、弟子たちの別の一人がイエスに言った。「主よ、まず、父を葬りに行かせてください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この願いは、父の埋葬が目前に迫っていたことを指すとも、父が亡くなるまで子としての務めを果たすことを広く指すとも解釈できる。ギリシア語は時期を明示していない。
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: すると、弟子の一人が
  rationale: ἕτεροςは直前の人物とは別の一人を示し、属格句はその人が弟子たちに属することを表す。日本語では「別の弟子」より「弟子の一人」が自然であり、δέは物語を進める穏やかな接続として「すると」とした。
- source_word: εἶπεν αὐτῷ
  choice: イエスに言った
  rationale: αὐτῷは文脈上イエスを指すため、現代日本語で指示対象が明確になるよう固有名で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意を込めた呼びかけであると同時に神学的含意を持ち得るため、「先生」などに狭めず標準的な「主」を用いた。
- source_word: ἐπίτρεψόν μοι
  choice: お許しください
  rationale: 許可を求める命令形を、主への敬意を保った自然な依頼表現にした。
- source_word: πρῶτον ἀπελθεῖν
  choice: まず…行くことを
  rationale: πρῶτονの順序上の優先を「まず」で示す。ἀπέρχομαιの離去の含みは、目的を示す「葬りに行く」という自然な日本語の中で十分に伝わる。
- source_word: θάψαι τὸν πατέρα μου
  choice: 父を葬りに
  rationale: 原文どおり単純に「父を葬る」と訳し、父がすでに死亡しているのか、将来まで扶養する意味なのかを本文で決めない。
theological_decisions:
- issue: 父を葬るという願いの時期と範囲
  choice: 父を葬りに行く許可を求める言葉としてそのまま訳す
  alternative: 父が亡くなった直後の埋葬と解する／父が死ぬまで家にとどまり孝養を尽くす意味と解する
  rationale: ギリシア語本文は埋葬の時期を明示しないため、どちらかに限定せず曖昧さを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。依頼表現は「お許しください」とし、丁寧さを示した。脚注記号[a]は解釈上の曖昧さに関わる文末に置いた。
