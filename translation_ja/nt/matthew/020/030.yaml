id: MAT.20.30
reference: Matthew 20:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ja
  text: 見よ、道端に、目の見えない二人の男性が座っていた。彼らは、イエスが通りかかっていると聞いて、「主よ、私たちをあわれんでください。ダビデの子よ」と叫んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面に注意を向けさせる語りの標識と、マタイに特徴的な生き生きとした叙述を保つため。現代日本語ではやや格調があるが、聖書本文として明瞭で簡潔。
- source_word: δύο τυφλοὶ
  choice: 二人の目の見えない男
  rationale: τυφλοίの意味を、現代日本語で理解しやすく配慮ある表現にした。男性複数形で、ここでは特定の二人の男性を指すことも保持している。
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: 道端に…座っていた
  rationale: 場所と姿勢を自然な日本語で表し、分詞の背景描写としての働きを保った。
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: イエスが通りかかると聞いて
  rationale: アオリスト分詞を時間的な関係として自然に訳し、παράγειをこの移動場面に即して「通りかかる」とした。
- source_word: ἔκραξαν
  choice: 叫んだ
  rationale: κράζωの大声で切迫して呼びかける強さを簡潔に伝える。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの敬意ある直接呼びかけを保持し、続くメシア的称号「ダビデの子」との結びつきにも適する。
- source_word: ἐλέησον ἡμᾶς
  choice: 私たちをあわれんでください
  rationale: 助けを求める命令形の切実さを、自然で敬意ある現代日本語にした。
- source_word: υἱὸς Δαυίδ
  choice: ダビデの子よ
  rationale: マタイにおける王的・メシア的称号の定型性を保ち、単なる「子孫」という説明に置き換えなかった。
theological_decisions:
- issue: イエスへの呼びかけにおける κύριος
  choice: 主よ
  alternative: 先生／だんな様
  rationale: この語には一般的な敬称の可能性もあるが、「ダビデの子」と並ぶ文脈では敬意とメシア的含意を保つ「主よ」が最適であり、含意を過度に限定しない。
- issue: υἱὸς Δαυίδ のメシア的な力
  choice: ダビデの子よ
  alternative: ダビデの子孫よ
  rationale: 系譜上の説明だけに平板化せず、マタイで機能する伝統的なメシア称号として保持した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「見よ」「主よ」「ダビデの子よ」によって原文の叙述上・称号上の格調を保った。「目の見えない男」は人物を障害だけで呼ぶ表現を避けながら、ギリシア語の男性複数を明示する。
