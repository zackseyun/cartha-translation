id: MAT.20.28
reference: Matthew 20:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ja
  text: ちょうど人の子が、仕えられるためではなく仕えるために、また多くの人のための[a]身代金として自分の命を与えるために来たのと同じです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、より明示的に「多くの人に代わる身代金として」。
    reason: ἀντίが持つ「代わりに」という意味合いを明示する訳語上の選択肢。
lexical_decisions:
- source_word: ὥσπερ
  choice: ちょうど…のと同じです
  rationale: 直前の教えとの比較を明示し、ギリシャ語の比較の力を自然な現代日本語で保つ。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した訳であり、ダニエル書との響きも保つ。
- source_word: οὐκ ἦλθεν
  choice: 来た…ではなく
  rationale: アオリストを素直に過去として訳し、原文にない場所や相を補わない。
- source_word: διακονηθῆναι
  choice: 仕えられるため
  rationale: 受動不定詞を明確に示し、宗教的な専門語を避けた。
- source_word: ἀλλὰ διακονῆσαι
  choice: ではなく仕えるために
  rationale: 同じ動詞による受動と能動の対照を、日本語でも「仕えられる／仕える」と対応させる。
- source_word: καὶ δοῦναι
  choice: また…与えるために
  rationale: 先行する目的と並列する不定詞の構造を保つ。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自分の命
  rationale: ここでψυχήは非物質的な「魂」に限定されず、死に至るまで差し出される命を指す。主語への再帰関係も自然に示す。
- source_word: λύτρον
  choice: 身代金
  rationale: 解放のために支払われる代価という意味を、簡潔で定着した日本語で表す。
- source_word: ἀντὶ πολλῶν
  choice: 多くの人のための
  rationale: 本文では自然な日本語を優先しつつ、ἀντίが持ちうる交換・代理の明示的な含意は脚注に残す。
theological_decisions:
- issue: 身代金の言葉におけるἀντίの意味合い
  choice: 本文では「多くの人のための」と訳し、代理・置換の意味をより明示する訳を脚注に示す。
  alternative: 多くの人に代わる
  rationale: ἀντίは交換や「代わりに」を表しうるが、本文で一つの神学的説明に狭めず、自然な日本語と重要な代替解釈の双方を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体とし、「仕えられる／仕える」の対照を保持した。比較を表すὥσπερは、前文を受ける「ちょうど…のと同じです」で表した。
