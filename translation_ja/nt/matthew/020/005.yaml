  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: ja
  text: 彼らは出かけて行った。彼はまた、第六時ごろと第九時ごろ[a]に出て行き、同じようにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ユダヤ式の時刻の数え方では、それぞれ正午ごろと午後三時ごろ。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: 彼らは出かけて行った
  rationale: οἱは直前の働き手たちを指す。「出かけて行った」はἀπῆλθονの移動を自然な現代日本語で表す。δέはここでは弱い接続なので、文脈上明らかなつながりを日本語で過度に明示しない。
- source_word: πάλιν ἐξελθὼν
  choice: 彼はまた……出て行き
  rationale: πάλινの反復を「また」で示し、ἐξελθώνの分詞構文を主動詞に続く自然な連用表現とした。「彼」は直前まで語られている主人を指すが、役割名を本文に補って限定しすぎない。
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: 六時ごろと九時ごろ[a]に
  rationale: περίを「ごろ」で表し、ユダヤ式の時刻表現である「第六時」「第九時」は、日本語で簡潔な「六時」「九時」とした。現代の時刻との対応は脚注で説明する。
- source_word: ἐποίησεν ὡσαύτως
  choice: 同じようにした
  rationale: ἐποίησενは文脈から内容を受ける軽い動詞であり、ὡσαύτωςの比較を「同じように」で明示する。何をしたかを本文で補足せず、原文の文脈依存性を保つ。
