  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: ja
  text: イエスは深い憐れみを抱き、彼らの目に触れた。すると、彼らはすぐに見えるようになり[a]、イエスに従った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「再び見えるようになり」。ギリシア語の動詞は「視力を得る」「視力を回復する」のほか、字義的には「上を見る」「顔を上げる」という意味にもなり得るが、ここでは盲人が見えるようになったことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: 深く憐れみ
  rationale: 内側から湧き起こる強い憐れみを表す分詞である。自然な現代日本語で感情の深さを伝えつつ、説明を加えすぎない表現とした。
- source_word: δὲ
  choice: （独立した接続語を置かず）
  rationale: 弱い物語上の接続であり、日本語では文脈と語順によって自然に展開を示せるため、明示的な「そして」は省いた。
- source_word: ἥψατο τῶν ὀμμάτων αὐτῶν
  choice: 彼らの目に触れられた
  rationale: 属格を伴う動詞の意味を、日本語で自然な「目に触れる」とした。イエスへの敬意を表す通常の聖書文体として尊敬表現を用いた。
- source_word: εὐθέως
  choice: すぐに
  rationale: 癒やしが即時に起こったことを、明快で自然な現代日本語で示す。
- source_word: ἀνέβλεψαν
  choice: 見えるようになり
  rationale: この癒やしの文脈では視力の獲得・回復を意味する。彼らが以前に見えていたかどうかまでは本文が明示しないため、「再び見えるようになった」ではなく「見えるようになった」とした。語の別の可能性は脚注に残した。
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスに従った
  rationale: 実際について行く意味と弟子として従う含みの双方を保ち、「弟子になった」と限定しない。代名詞を固有名に戻すことで日本語の指示を明瞭にした。
theological_decisions:
- issue: ἀνέβλεψανが表す癒やしの性質
  choice: 彼らは直ちに見えるようになった
  alternative: 彼らは再び見えるようになった／顔を上げた
  rationale: 盲人の癒やしという直前の文脈とεὐθέωςにより、実際の即時的な視力の獲得・回復が示される。ただし、先天性か後天性かは本文から確定せず、「再び」は脚注上の可能性にとどめた。
- issue: ἠκολούθησαν αὐτῷの含意
  choice: イエスに従った
  alternative: イエスの弟子になった
  rationale: 弟子として従う響きはあり得るが、その身分や期間を本文以上に明確化せず、行為をそのまま訳した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語の荘重さを保った。「憐れみ」は聖書的な深みを持ちつつ一般にも理解可能。「触れられた」以外は過度な敬語化を避け、簡潔な叙述とした。
