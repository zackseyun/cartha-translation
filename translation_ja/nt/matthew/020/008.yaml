id: MAT.20.8
reference: Matthew 20:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ja
  text: 夕方になると、ぶどう園の主人は管理人に言う。「労働者たちを呼び、最後の者たちから始めて、最初の者たちまで賃金を払いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας
  choice: 夕方
  rationale: 文脈上、一日の労働が終わり賃金を支払う時刻を指す自然な訳。
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ぶどう園の主人
  rationale: κύριος はここではぶどう園を所有・統括する人物を指し、「主人」が文脈に合う。
- source_word: τῷ ἐπιτρόπῳ
  choice: 管理人
  rationale: 主人から労働者への支払いを任された監督・管理担当者を表す。
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: 賃金を払いなさい
  rationale: ἀποδίδωμι の『支払うべきものを渡す』という意味を、自然な日本語で表した。
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: 最後に来た者たちから始めて、最初に来た者たちまで
  rationale: 字義的には『最後の者たちから最初の者たちまで』だが、直前の雇用順序を受けることを明確にしつつ、順番の逆転を保持した。
theological_decisions:
- issue: 歴史的現在 λέγει の訳
  choice: 言った
  alternative: 言う
  rationale: ギリシア語の現在形は物語を生き生きと語る歴史的現在であり、現代日本語の物語として自然な過去形にした。神学的意味の差は生じない。
- issue: 『最後／最初』が指す基準
  choice: 来た順序を本文で補足
  alternative: 最後の者たち／最初の者たち
  rationale: たとえの直接の文脈では雇われて来た順番を指す。後続する神学的格言そのものと混同しないよう、ここでは場面上の意味を自然に示した。
translation_notes:
  register: 明瞭で現代的ながら、たとえ話にふさわしい落ち着いた文体。主人の命令は丁寧すぎない直接的な表現とした。
