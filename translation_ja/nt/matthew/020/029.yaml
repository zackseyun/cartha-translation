  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: ja
  text: 彼らがエリコを出て行くとき、大勢の群衆がイエスに従った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπορευομένων αὐτῶν
  choice: 一行が……出て行くと
  rationale: 属格複数の現在分詞を時間を表す従属節として訳した。「一行」はイエスと弟子たちを自然に指し、現在分詞の進行的な場面設定を「出て行くと」で簡潔に表す。
- source_word: ἀπὸ Ἰεριχὼ
  choice: エリコを
  rationale: ἀπόは場所から離れる動きを示す。日本語では移動動詞「出て行く」とともに「エリコを」とするのが自然であり、「エリコから出て行く」より簡潔である。
- source_word: ἠκολούθησεν
  choice: 従った
  rationale: ἀκολουθέωの基本的な意味を保ち、単なる同行以上に、後について行く動きを自然な現代日本語で表す。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 単数与格代名詞の指示対象を文脈上の中心人物であるイエスとして明示した。日本語の「彼に」は不自然になりやすいため固有名を用いるが、複数の一行へと平滑化しない。
- source_word: ὄχλος πολύς
  choice: 大勢の群衆
  rationale: πολύςの数量的意味を「大勢の」で示し、ὄχλοςを「群衆」と訳した。明瞭で現代的な表現である。
theological_decisions:
- issue: 複数形の分詞節の後に置かれた単数代名詞 αὐτῷ の指示対象
  choice: 群衆はイエスに従った。
  alternative: 群衆は一行に従った。
  rationale: ギリシャ語は「彼らが出て行く」と複数で述べた後、「彼に従った」と単数に切り替える。文脈上、単数はイエスを指すのが最も自然であり、この数の切り替えを保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「一行」によって複数の主語を簡潔に示し、後半では「イエス」と明示して原文の複数から単数への移行を伝える。英語版の脚注は英語表現上の言い換えであり、日本語本文には独立した意味上の異読を生じさせないため採用しない。
