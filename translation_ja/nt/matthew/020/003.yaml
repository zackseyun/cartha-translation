  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: ja
  text: また、第三時ごろ[a]に出て行って、市場で何もせず立っている[b]ほかの人たちを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、午前九時ごろ。当時は通常、日の出を基準に昼の時間を数えた。
    reason: cultural_note
  - marker: b
    text: 「働いていない」とも訳せる。ギリシャ語は、何もせず、働いていない状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 出て行くと
  rationale: アオリスト分詞が示す先行動作を、物語として自然な順序を保つ日本語で表した。
- source_word: περὶ τρίτην ὥραν
  choice: 第三時ごろ
  rationale: 日の出から数える当時の時刻表現を本文に残し、現代の時刻への換算は脚注に示した。
- source_word: εἶδεν
  choice: 見た
  rationale: ὁράωの単純な物語用法を、余分な解釈を加えずに訳した。
- source_word: ἄλλους
  choice: ほかの人たち
  rationale: 名詞的に用いられた形容詞であり、原文に明示されない性別を補わない表現とした。
- source_word: ἑστῶτας
  choice: 立っている
  rationale: 完了分詞の状態的な意味を、自然な継続状態として表した。
- source_word: ἀγορᾷ
  choice: 市場
  rationale: 売買だけでなく人々が集まる公共空間を指す語だが、この文脈では簡潔で一般的な「市場」が適切である。
- source_word: ἀργούς
  choice: 仕事をせずに
  rationale: 働いていない状態を表し、現代的な雇用制度を前提とする「失業中」と断定せず、文脈上の意味を明瞭にした。
