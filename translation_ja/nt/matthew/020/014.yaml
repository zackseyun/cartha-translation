  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: ja
  text: 「自分のものを持って、行きなさい。[a] だが、私はこの最後の人にも、あなたに与えるのと同じように与えたいのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「行きなさい」は「立ち去りなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆρον
  choice: 受け取って
  rationale: αἴρωのアオリスト命令形。ここでは、自分に属するものを受け取るよう促す文脈なので、現代日本語として自然な「受け取って」とした。
- source_word: τὸ σὸν
  choice: 自分の分
  rationale: 直訳的には「あなたのもの」。文脈上は支払われた賃金を指すが、原文にない「賃金」を明示せず、自然な表現にした。
- source_word: ὕπαγε
  choice: 行きなさい
  rationale: この文脈では相手を送り出す命令。「立ち去りなさい」ほど敵対的な響きを加えず、簡潔な命令の調子を保った。
- source_word: θέλω δὲ
  choice: だが、私は…与えたいのだ
  rationale: θέλωの意志を「…たい」で表し、δέの穏やかな対比を「だが」で示した。「のだ」は主人が自らの意志を説明する語調を自然に伝える。
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: この最後の人にも
  rationale: 指示語と形容詞の男性単数形が、たとえの中の最後に雇われた一人の労働者を指す。「最後に来た人」と説明的にせず、原文の簡潔さを保った。日本語の「人」は性別を不必要に強調せず、特定の個人を明確に指せる。
- source_word: δοῦναι
  choice: 与えたい
  rationale: δίδωμιの基本義「与える」を保持した。文脈上は賃金の支払いだが、「支払う」に限定せず、主人の自由な意志という含みを残した。
- source_word: ὡς καὶ σοί
  choice: あなたと同じように
  rationale: 比較と同等の扱いを自然な日本語で表した。与える額が同じであることは文脈から明らかだが、「同じ額」と補わず原文の表現範囲を保った。
theological_decisions:
- issue: 主人の自由な意志と同等の扱いの表現
  choice: 「私はこの最後の人にも、あなたと同じように与えたい」
  alternative: 「私は最後に来たこの人にも、あなたと同じ額を支払いたい」
  rationale: 後者は文脈を明瞭にする一方、「来た」「額」「支払う」を補う。本文では、主人の意志を表すθέλωと、広い意味を持つδίδωμι、比較表現ὡς καὶ σοίを保ち、恵みや報酬について特定の教理的解釈を上乗せしない。
- issue: 男性単数の人物指示
  choice: この最後の人
  alternative: この最後の男
  rationale: 原文は男性単数で一人の労働者を指すが、現代日本語では「人」が特定の男性も自然に指し、文脈上の性別を否定しない。「男」は原文以上に性別を強調するため避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、家の主人の直接的で威厳ある語調を保った。「自分の分」「行きなさい」「だが」により簡潔な対話文とし、文脈上理解できる「賃金」「金額」などは本文に補っていない。
