id: MAT.20.16
reference: Matthew 20:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: ja
  text: このように、後の者が先になり、先の者が後になる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だから、後の者が先になり、先の者が後になる。」
    reason: οὕτωςは、前述のたとえを受ける「このように」とも、結論を示す「だから」とも訳せるため。
lexical_decisions:
- source_word: οὕτως
  choice: このように
  rationale: 直前のたとえを受けて結論を導く語。推論的な「だから」も可能だが、たとえで示されたあり方を指す原文の幅を保つため「このように」とした。
- source_word: ἔσονται
  choice: ～になる
  rationale: εἰμίの未来形であり、日本語では身分・順序の逆転を自然に表す「～になる」で未来の帰結を示した。
- source_word: οἱ ἔσχατοι
  choice: 後の者
  rationale: 冠詞付き形容詞の名詞的用法。「後の者」とすることで、時間、順序、地位などのいずれかに限定せず、πρῶτοιとの対照を保った。
- source_word: πρῶτοι
  choice: 先に
  rationale: 逆転を表す簡潔な対句に合わせた述語表現。「第一の者」とせず、現代日本語として自然な形にした。
- source_word: καὶ
  choice: ～、
  rationale: 二つの節を並列する単純な接続。日本語では読点で自然に連結し、原文に明示されない逆接を加えなかった。
- source_word: οἱ πρῶτοι
  choice: 先の者
  rationale: 冠詞付き形容詞の名詞的用法。前半の「後の者」と対称になる表現を採用した。
- source_word: ἔσχατοι
  choice: 後に
  rationale: 前半の「先に」と対応する述語表現とし、原文の簡潔で均衡した逆転句を再現した。
theological_decisions:
- issue: 逆転の言葉が指す範囲
  choice: 「後の者／先の者」という簡潔な逆転の格言として訳し、その対象を限定しない。
  alternative: 社会的地位、弟子への報い、救いの順序のいずれかに特定して訳す。
  rationale: 原文は逆転を宣言するが、それが時間的順序、社会的地位、報い、救いのどれを指すかをこの文自体では限定していないため、その神学的な幅を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。原文の簡潔な対句を保ち、「最後／最初」よりも人について自然に読める「後の者／先の者」を用いた。
