  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: ja
  text: また、第十一時ごろ[a]に出て行って、ほかの人たちが立っているのを見つけ、彼らに言った[b]。『なぜ一日中、ここで何もせずに立っているのか。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「第十一時ごろ」。当時は日中を十二時間に分けて数えたため、通常、日没の約一時間前を指す。
    reason: 古代の時刻法を明確にし、現代の午前十一時との混同を避けるため。
  - marker: b
    text: 直訳「彼らに言う」。ギリシア語は、物語を生き生きと描く歴史的現在を用いている。
    reason: 本文では自然な日本語の過去形としたため、原文の時制を示す。
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: また、十一時ごろ
  rationale: περί＋対格の概数を「ごろ」で表した。「十一時」は当時の日の出から数える第十一時を指すため、現代の午前十一時との混同を避ける注を付した。
- source_word: ἐξελθὼν εὗρεν
  choice: 出て行くと、…見つけ
  rationale: アオリスト分詞が主動詞に先立つ行為を示すことを、自然な日本語の「出て行くと」で表現した。
- source_word: ἄλλους ἑστῶτας
  choice: ほかの人たちが立っているのを
  rationale: ἄλλουςは名詞的に用いられており、性別を不必要に明示せず「ほかの人たち」とした。ἑστῶταςの継続的な立位状態も保持した。
- source_word: καὶ λέγει αὐτοῖς
  choice: 彼らに言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形を本文に採り、原文の時制は注記した。
- source_word: Τί ὧδε ἑστήκατε
  choice: なぜ…ここで…立っているのか
  rationale: 疑問詞τίは文脈上「なぜ」。ἑστήκατεは完了形で、そこに立ち続けている状態を表す。
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: 一日中、…何もせずに
  rationale: ἀργοίは働いていない、活動していない状態を指す。「怠けて」は非難の意味を強めすぎ、「失業して」は社会経済的に限定しすぎるため避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「何もせずに」はἀργοίの状態を自然に伝え、本人たちの怠慢だと断定しない。引用は簡潔な常体とした。
