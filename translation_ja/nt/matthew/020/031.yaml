id: MAT.20.31
reference: Matthew 20:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: ja
  text: しかし群衆は、黙るようにと彼らを叱りつけた。それでも彼らはますます[a]叫んで言った。「主よ、私たちをあわれんでください。ダビデの子よ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「もっと大声で」。ギリシア語の比較表現は、叫びがいっそう激しくなったこと全般を指すとも、特に声量が増したことを指すとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「ダビデの子」は、単にダビデの子孫であることを述べるだけでなく、メシアを指す称号である。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ ὄχλος
  choice: しかし群衆は
  rationale: ὄχλοςを現代日本語で自然な「群衆」とし、δέは前後の対照を示す「しかし」で表した。
- source_word: ἐπετίμησεν αὐτοῖς
  choice: 彼らを叱りつけた
  rationale: ἐπιτιμάωの強い制止・叱責の語感を「叱りつけた」で保ち、αὐτοῖςは文脈上の二人を指す「彼ら」とした。
- source_word: ἵνα σιωπήσωσιν
  choice: 黙るようにと
  rationale: ἵνα節が群衆の意図する結果を示すため、簡潔で自然な目的表現とした。
- source_word: μεῖζον
  choice: ますます
  rationale: 比較級の副詞的用法を、強さの増大を広く表せる「ますます」とした。声量に限定する「もっと大声で」も可能なので脚注に示した。
- source_word: ἔκραξαν λέγοντες
  choice: 叫んで言った
  rationale: κράζωの大声と切迫感を「叫んで」で表し、λέγοντεςも省略せず「言った」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意を込めた呼びかけとキリスト論的含意の双方を狭めずに保つため、「主よ」とした。
- source_word: ἐλέησον ἡμᾶς
  choice: 私たちをあわれんでください
  rationale: 命令形の切実な願いを、現代の読者に明瞭でありつつ尊厳のある依頼表現で訳した。
- source_word: υἱὸς Δαυίδ
  choice: ダビデの子
  rationale: 単なる血統説明に言い換えず、マタイにおける王的・メシア的称号を文字どおり保った。
theological_decisions:
- issue: イエスに用いられるメシア的称号
  choice: υἱὸς Δαυίδを本文で「ダビデの子」とする。
  alternative: ダビデの子孫
  rationale: この表現は系譜上の出自だけでなく、王的・メシア的期待を帯びた称号として機能するため、その含意を狭めない訳を採用した。
- issue: イエスへの呼びかけとしてのκύριος
  choice: 「主よ」と訳す。
  alternative: 先生よ／ご主人様
  rationale: 敬称としての幅と、文脈上あり得るキリスト論的な響きの両方を保ち、一方に限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叫びの切迫感と呼びかけの尊厳を保った。「あわれむ」は読みやすさを優先して平仮名表記とし、原文の語順にある「主よ……ダビデの子よ」という二重の呼びかけも保持した。
