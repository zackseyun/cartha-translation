  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: ja
  text: こう言った。「最後に来たこの人たちは一時間しか働かなかったのに、あなたは一日の重荷と焼けつく暑さに耐えた私たちと彼らを同じにしました[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らを私たちと同じように扱いました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 前節の動詞に続く現在分詞。日本語では引用を導く叙述として自然に表した。
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: 最後に来たこの人たち
  rationale: 直訳は「この最後の者たち」だが、たとえの文脈で最後に雇われた人々を指すことが明確になる自然な表現とした。
- source_word: μίαν ὥραν ἐποίησαν
  choice: 一時間しか働かなかった
  rationale: ποιέωと時間表現の組み合わせを「働く」と解し、苦情に含まれる対比を日本語の「しか……なかった」で自然に示した。
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: 私たちと同じ扱いをしました
  rationale: 字義的には「彼らを私たちと等しくした」。ここでは同額の賃金を与えた扱いについての訴えなので、意味を限定しすぎず自然な日本語にした。別訳を脚注に示した。
- source_word: τοῖς βαστάσασι
  choice: 耐えた私たち
  rationale: βαστάζωは「担う」と「耐える」の両義を持つ。重労働と酷暑を受け続けた文脈に自然な「耐えた」を選んだ。
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: 丸一日の重労働
  rationale: 字義は「その日の重荷」。労働時間と負担の双方が伝わる現代日本語として表した。
- source_word: τὸν καύσωνα
  choice: 焼けつく暑さ
  rationale: καύσωνが表す強烈で過酷な暑さを、明瞭で自然な日本語にした。
theological_decisions:
- issue: 公平さをめぐる労働者たちの訴え
  choice: 労働者たちの不満をそのまま表し、主人の扱いへの神学的評価は訳文に加えない。
  alternative: 「不公平に扱った」など、訴えの評価を明示する訳。
  rationale: 本文はたとえの登場人物による抗議を記している。神の正義や恵みについての結論を訳文で先取りせず、たとえが持つ緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、引用内の抗議の強さと品位を保った。「最後に来た」は文脈上の意味を明示し、「丸一日」は一時間との対比を自然に伝える。
