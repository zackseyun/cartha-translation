  source_fidelity: 「最後に来たこの人たち」「一時間しか働かなかった」「焼けつく暑さ」は原文の対比と苦情の調子をよく伝えている。しかし「丸一日の重労働」は τὸ βάρος τῆς ἡμέρας（「一日の重荷／負担」）の比喩を具体的な労働内容へやや狭めている。原文の「彼らを私たちと等しくした」という等価関係も、本文ではより直接に表すのが望ましい。
  naturalness: 全体として明瞭な現代標準語である。ただし「あなたは、」の読点は不要であり、「同じ扱いをしました」より「彼らを私たちと同じにしました」のほうが、この抗議の直接性を保ちつつ自然に読める。
  terminology: 「一日の重荷」は βάρος の「重さ・負担」という表現を保つ。「焼けつく暑さ」は καύσων に適切である。「同じにしました」は ἴσους…ἐποίησας の主要な訳として用い、脚注に「同じ扱いをした」という慣用的な意味訳を置く。
