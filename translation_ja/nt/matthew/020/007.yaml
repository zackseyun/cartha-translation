  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: ja
  text: 彼らは答えた。「誰も私たちを雇ってくれなかったからです。」主人は彼らに言った。「あなたがたもぶどう園に行きなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: 彼らは答えた
  rationale: 歴史的現在だが、日本語の物語として自然な過去形にした。直前の問いへの応答なので「言った」より「答えた」が文脈に合う。
- source_word: Ὅτι
  choice: からです
  rationale: ここでは、立ったままでいる理由を示す説明の働きを自然な日本語で表す。
- source_word: οὐδεὶς ἡμᾶς ἐμισθώσατο
  choice: 誰も私たちを雇ってくれなかった
  rationale: 雇用するという語義を保ちつつ、「くれなかった」によって自分たちが雇われなかったという日本語の自然な視点を示す。
- source_word: λέγει αὐτοῖς
  choice: 主人は彼らに言った
  rationale: ギリシア語の主語は文脈上ぶどう園の主人であるため、引用の話者を明確にした。歴史的現在は自然な物語調の過去形で表した。
- source_word: Ὑπάγετε καὶ ὑμεῖς
  choice: あなたがたも…行きなさい
  rationale: 命令と、先に送られた者たちに加えてこの一団も含める意味を明確に保つ。
- source_word: ἀμπελῶνα
  choice: ぶどう園
  rationale: 現代日本語で一般的かつ明瞭な対応語。
