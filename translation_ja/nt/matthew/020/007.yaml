  source_fidelity: ギリシア語の発話内容を正確に反映している。「誰も私たちを雇ってくれなかったからです」は、οὐδεὶς ἡμᾶς ἐμισθώσατο の否定・対象・雇用の意味を自然に表す。「あなたがたも」は καὶ ὑμεῖς の追加・強調を保ち、「ぶどう園」はἀμπελῶναの標準的な訳語である。λέγουσιν／λέγει の歴史的現在を日本語の物語文として過去形にするのも適切である。文脈上のぶどう園の主人を「主人」と明示することも、意味を不当に限定しない。
