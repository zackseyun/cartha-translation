base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: ja
  text: そして彼らに言った。「あなたがたもぶどう園へ行きなさい。そして、正当なもの[a]は何でも、あなたがたに与えよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正しいもの」または「公正なもの」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: 彼らに
  rationale: 直前に言及された別の働き人たちを指す与格複数の指示代名詞。文脈上、自然な日本語の代名詞で十分に明確である。
- source_word: εἶπεν
  choice: 言った
  rationale: 物語中で直接話法を導くλέγωの標準的で自然な訳。
- source_word: Ὑπάγετε
  choice: 行きなさい
  rationale: ここでは複数への命令として、ぶどう園へ行くよう率直に命じている。現代日本語では「行きなさい」が自然である。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: 先に雇われた者たちと同じく、この者たちも送り出されるという包含と強調を保つ。
- source_word: ἀμπελῶνα
  choice: ぶどう園
  rationale: ἀμπελώνの通常の意味であり、たとえの舞台にも合う標準的な訳語。
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: 正当なもの
  rationale: 「正しいもの」「公正なもの」という幅を持つ表現。賃金の文脈における客観的な正当性を示しつつ、法的意味だけに限定しない。
- source_word: δώσω ὑμῖν
  choice: あなたがたに与えよう
  rationale: δίδωμιの基本義「与える」を保持する。文脈上は賃金の支払いを指すが、原文は支払いに特化した動詞を用いていない。
theological_decisions:
- issue: 賃金を定める文脈でのδίκαιονの訳
  choice: 正当なもの
  alternative: 正しいもの／公正なもの
  rationale: 土地所有者が正義や正しい秩序にかなうものを与えるという倫理的含意を保つ。「公正なもの」だけでは現代的な公平感へ狭める可能性があり、「正しいもの」より「正当なもの」が賃金の文脈に自然である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令は「行きなさい」、約束は簡潔な「与えよう」とし、たとえ話の語り口を自然にした。脚注標識は該当表現を含む発言の直後に置いた。
