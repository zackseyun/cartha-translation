id: MAT.20.23
reference: Matthew 20:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたは確かに、わたしの杯[a]を飲むことになる。しかし、わたしの右と左に座ることは、わたしが与えるものではない。それは、わたしの父によって用意されている人たちのためのものである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「杯」は、イエスに定められた苦しみや運命を表す比喩であり、弟子たちもそれにあずかることになる。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: イエスは彼らに言われた
  rationale: ギリシャ語は歴史的現在形だが、現代日本語の物語として自然な過去形で表した。主語の「イエス」は文脈上明らかな補足である。
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: あなたがたは確かに、わたしの杯を飲むことになる
  rationale: 「杯」という比喩を解釈語に置き換えず保持した。未来形を「飲むことになる」とし、μένの肯定を伴う対比を「確かに」で示した。
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: わたしの右と左に座ること
  rationale: イエスの両側にある栄誉の席を指す表現を、簡潔で自然な日本語にした。
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: わたしが与えるものではない
  rationale: δοῦναιの基本義「与える」を保ち、この権限に関する原文の率直な言い方を弱めたり説明したりしなかった。
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: それは……用意されている人たちのためのものである
  rationale: ἀλλά以下の省略を日本語で補い、完了受動形が表す、すでに用意されていて現在もその状態にあるという意味を表した。
- source_word: ὑπὸ τοῦ πατρός μου
  choice: わたしの父によって
  rationale: 受動文の行為者を直接的に訳し、原文にない「ただ」などの限定は加えなかった。
theological_decisions:
- issue: 席を与えることは「わたしが与えるものではない」というキリスト論上の含意
  choice: 原文どおり率直に訳し、限定や調和的説明を本文に加えない
  alternative: 「父から離れてわたしが与えるものではない」などと説明的に補う
  rationale: 原文が示す父と子の役割に関する緊張を保ち、翻訳によって教理的に解消しないため。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、イエスの発言にふさわしい簡潔で品位ある調子と、「杯」という聖書的比喩を保持した。
