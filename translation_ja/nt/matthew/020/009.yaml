lexical_decisions:
- source_word: καὶ
  choice: （訳出せず）
  rationale: 日本語では文脈の連続が明らかであり、接続詞を置かないほうが自然な物語の流れになる。
- source_word: ἐλθόντες
  choice: 来た
  rationale: アオリスト分詞を、主語を修飾する自然な連体表現として訳した。
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: 十一時ごろに来た人たち
  rationale: περὶの時間的な幅を「ごろ」で保ち、文脈上暗示される「雇われた」は本文に加えなかった。
- source_word: ἔλαβον
  choice: 受け取った
  rationale: 賃金の支払いを受ける場面に即した、自然で正確な表現。
- source_word: ἀνὰ
  choice: 一人…ずつ
  rationale: 各人に同じ額が配られたという分配の意味を明確に表す。
- source_word: δηνάριον
  choice: デナリオン
  rationale: 歴史的な貨幣名を保持し、その価値については脚注で説明する。
