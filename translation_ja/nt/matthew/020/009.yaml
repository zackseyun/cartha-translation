  source_fidelity: 「十一時ごろ」は現代日本語では通常、時計時刻の午前（または夜）の11時を指すため、ギリシア語の「第十一時」（当時の日中の時間区分）を十分に伝えない。「第十一時ごろ」とし、簡潔な注で時刻体系を示すのが適切である。他方、ἐλθόντεςを「来た」、ἔλαβονを「受け取った」、ἀνάを一人ごとの分配として表すこと、δηνάριονを音写で保持することは原文に忠実である。
  naturalness: 「一人一デナリオンずつ」も理解できるが、「一人につき一デナリオン」のほうが明瞭で自然な現代標準日本語である。「第十一時」はやや文語的な聖書用語だが、注を伴えば、歴史的時間表現を正確に保ちながら十分に明瞭である。
  terminology: 「デナリオン」は適切であり、既存の文化注も英語監査記録に沿う。「第十一時」は古代の時刻制度を示すために必要な表現で、現代の時計時刻として誤読されないよう注記する。
  issues:
