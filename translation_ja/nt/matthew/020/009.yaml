  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: ja
  text: 第十一時ごろ[b]に来た人たちが、一人につき一デナリオン[a]を受け取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: デナリオンはローマの標準的な銀貨で、一般に労働者一日分の賃金に相当すると考えられていた。
    reason: cultural_note
