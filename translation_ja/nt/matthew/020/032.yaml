  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: ja
  text: イエスは立ち止まり、二人を呼んで言われた。「わたしに何をしてほしいのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: 立ち止まり
  rationale: ἵστημιのアオリスト分詞で、進んでいたイエスが足を止めたことを表す。日本語の自然な連続動作として訳した。
- source_word: ἐφώνησεν
  choice: 呼んで
  rationale: ここでは、直前に登場する二人に呼びかける、または呼び寄せる意。文脈以上に厳かな「召す」は避けた。
- source_word: αὐτοὺς
  choice: 二人を
  rationale: 代名詞の指示対象は直前の二人の盲人であり、日本語では「彼ら」より「二人」のほうが明瞭で自然である。
- source_word: Τί θέλετε ποιήσω ὑμῖν
  choice: わたしに何をしてほしいのですか
  rationale: θέλω＋接続法の内容を、現代日本語で自然な「〜してほしい」と表した。ὑμῖνは受益の与格だが、この構文では「してほしい」に相手のための行為という意味が含まれる。
theological_decisions:
- issue: イエスの問いの調子と意味
  choice: 「わたしに何をしてほしいのですか」
  alternative: 「あなたがたのために、わたしに何をしてもらいたいのですか」
  rationale: 直接的でありながら相手に向き合う問いとして訳した。過度に格式ばらず、同時に軽すぎない表現とし、願いの内容を尋ねる原文の意味を保った。
translation_notes:
  register: 明快な現代標準日本語。地の文には簡潔で品位ある叙述を用い、イエスの発言は自然で丁寧な問いとした。
