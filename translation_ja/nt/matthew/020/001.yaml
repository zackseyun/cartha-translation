id: MAT.20.1
reference: Matthew 20:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ja
  text: 天の御国は、朝早く、自分のぶどう園で働く人々を雇うために出かけた、ある家の主人のようなものだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: 天の御国
  rationale: マタイに特徴的な表現を、現代日本語で通用する聖書的かつ格調ある語として訳した。
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ある家の主人
  rationale: ἀνθρώπῳを「ある」によって不定の人物として表し、οἰκοδεσπότῃの家・家産を治める主人という意味を自然な日本語で保持した。
- source_word: ἅμα πρωῒ
  choice: 朝早く
  rationale: 夜明けごろを指しうる時間表現を、過度に時刻を限定せず自然に訳した。
- source_word: μισθώσασθαι ἐργάτας
  choice: 働く人々を雇うために
  rationale: 目的を示す不定詞と、賃金を払って労働者を雇う意味を明確に表した。
- source_word: ἀμπελῶνα
  choice: ぶどう園
  rationale: 具体的な農園の種類をそのまま示す標準的な訳語を採用した。
theological_decisions:
- issue: Ὁμοίαの比喩が「御国」と「主人」のどこまでを直接対応させるか
  choice: 「天の御国は…ある家の主人のようなもの」
  alternative: 「天の御国は…主人についての次のようなたとえである」
  rationale: 原文の文法的な比喩表現を保ち、たとえの神学的対応関係を本文で先回りして限定しなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、たとえ話の導入にふさわしい落ち着いた格調を保った。「だからです」によりγάρを直前の文脈につなぐ説明として明示した。
