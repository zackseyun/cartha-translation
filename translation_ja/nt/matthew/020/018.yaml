id: MAT.20.18
reference: Matthew 20:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: ja
  text: 「見てください。わたしたちはエルサレムへ上って行きます。人の子は祭司長たちと律法学者たちに引き渡され[a]、彼らは人の子に死刑を宣告します。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「渡され」とも訳せる。文脈によっては「裏切られ」の意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: さあ
  rationale: 聞き手の注意を促す談話標識の働きを、現代日本語で自然に表す。字義的な「見よ」より日常的だが、後続する重大な予告への注意喚起を保つ。
- source_word: ἀναβαίνομεν
  choice: 上って行きます
  rationale: 現在形の進行的な移動を自然に表し、エルサレムへの地理的・慣用的な上行の含みも保持する。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 現代日本語で定着した地名表記。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの特徴的な自己呼称を伝統的かつ簡潔に保持し、ダニエル書7章を想起させる可能性も狭めない。
- source_word: παραδοθήσεται
  choice: 引き渡され
  rationale: 敵対者の支配下へ渡されるという受動の意味を表し、この節だけでは明示されない「裏切る」という狭い意味に限定しない。
- source_word: τοῖς ἀρχιερεῦσιν
  choice: 祭司長たち
  rationale: 複数形で表された祭司階級の指導者を指す、定着した自然な訳語。
- source_word: γραμματεῦσιν
  choice: 律法学者たち
  rationale: ユダヤ教の律法に通じた専門家という役割を、現代の一般読者に分かりやすく示す。単なる筆記者という誤解を避ける。
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: 彼らは人の子に死刑を宣告します
  rationale: 司法的な有罪判決と、その刑罰が死であることを自然な日本語で表す。代名詞を「人の子」と補い直し、指示対象を明瞭にする。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου の訳し方
  choice: 人の子
  alternative: 人間である者
  rationale: イエスの自己呼称としての定着した表現と、ダニエル書7:13–14への響きの可能性を保持し、一般的な「人間」という意味に平板化しない。
- issue: παραδοθήσεται の意味範囲
  choice: 引き渡される
  alternative: 裏切られる
  rationale: ギリシャ語はここで、他者の権力下へ渡されることを広く表し得る。行為者や裏切りという動機を本文以上に特定しない。
- issue: 未来受動形における行為者
  choice: 行為者を明示しない
  alternative: 神によって引き渡される
  rationale: 本文は引き渡す主体を明記していないため、神的受動の可能性を断定せず、物語上の人間の行為者にも限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準語。イエスが弟子たちに語る直接話法として丁寧体を用い、「見よ」の古風さを避けて「さあ」とした。「律法学者」は現代の一般読者への分かりやすさを優先した。
source_grounding:
  english_pob_role: consult_only
