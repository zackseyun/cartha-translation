  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: ja
  text: 私のものを、私が望むとおりにしてはならないのか。それとも、私が善いから、あなたの目は悪いのか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それとも、私が善いから、あなたはねたむのか」。直訳は「あなたの目は悪いのか」。これは、ねたみや、人の好意を快く思わない気持ちを表すギリシア語の言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: 許されていないのか
  rationale: 許可・正当性を問う語であり、地主の修辞疑問として自然な現代日本語にした。
- source_word: ὃ θέλω ποιῆσαι
  choice: 自分の望むようにする
  rationale: θέλωの意志を明確に表しつつ、日本語として滑らかにした。
- source_word: ἐν τοῖς ἐμοῖς
  choice: 自分のものを
  rationale: 自分に属する財産を用いるという文脈を簡潔に示す。
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: あなたの目は悪い
  rationale: 原文の比喩を本文に残し、ねたみや不満という含意は脚注で説明する。
- source_word: ἀγαθός
  choice: 良い者
  rationale: 文脈上は寛大さを含意するが、原語の基本的意味と「悪い目」との対照を保った。
theological_decisions:
- issue: ὁ ὀφθαλμός σου πονηρόςを本文で解釈的に訳すか
  choice: 「あなたの目は悪い」と原文の比喩を保持する
  alternative: 「あなたはねたむのか」「私が気前よくするのが気に入らないのか」
  rationale: 主人の善良さと働き手の「悪い目」との対照を保ち、ねたみだけに意味を限定しないため。想定される意味は脚注で補う。
translation_notes:
  register: 明快な現代標準語を用いながら、地主の威厳ある修辞疑問と原文の「悪い目／良い者」という対照を保持した。
