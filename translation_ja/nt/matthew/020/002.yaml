  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: ja
  text: 労働者たちと一日につき一デナリオン[a]で合意した後、彼らを自分のぶどう園へ送った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一デナリオンは、労働者の標準的な一日分の賃金でした。
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: 約束をしたうえで
  rationale: アオリスト能動分詞が主動詞に先立つ行為を表すため、合意成立の意味と時間関係を自然な日本語で示した。
- source_word: δὲ
  choice: 明示しない
  rationale: ここでは弱い物語上の接続であり、日本語では分詞節から主節への流れによって十分に表される。
- source_word: ἐργατῶν
  choice: 労働者たち
  rationale: ぶどう園で雇われる働き手を指す、明瞭で現代的な語を用いた。
- source_word: ἐκ δηναρίου
  choice: 一デナリオン
  rationale: 合意された賃金額を示す表現。古代貨幣名を保持し、現代通貨への不確かな換算を避けた。
- source_word: τὴν ἡμέραν
  choice: 一日
  rationale: 賃金が一日についてのものであることを簡潔に表し、『丸一日』など原文以上の限定は加えなかった。
- source_word: ἀπέστειλεν
  choice: 送り出した
  rationale: 雇った者たちをぶどう園へ行かせたという物語上の動きを、自然かつ明確に表した。
- source_word: ἀμπελῶνα
  choice: ぶどう園
  rationale: 標準的な意味を、一般読者に分かりやすい表記で訳した。
- source_word: αὐτοῦ
  choice: 自分の
  rationale: 主語である家の主人が所有するぶどう園を指すことを、日本語の自然な再帰表現で示した。
