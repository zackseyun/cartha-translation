  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: ja
  text: ほかの十人はそれを聞くと、二人の兄弟のことで憤慨した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: ほかの十人
  rationale: 直訳は「十人」だが、文脈上はヤコブとヨハネ以外の十人を指すため、自然な日本語として「ほかの」を補った。
- source_word: ἀκούσαντες
  choice: それを聞くと
  rationale: 分詞の時間的関係を自然に表現し、聞いた内容は直前の出来事を受ける「それ」とした。
- source_word: ἠγανάκτησαν
  choice: 憤慨した
  rationale: 強い不快感や怒りを表す語義を、現代標準日本語の品位ある表現で伝える。
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: 二人の兄弟のことで
  rationale: περίの「～について／～のことで」という範囲を保ち、怒りの直接の対象を「兄弟に対して」と断定しすぎないようにした。
