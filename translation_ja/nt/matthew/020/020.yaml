  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: ja
  text: その時、ゼベダイの息子たちの母が、息子たちと一緒にイエスのもとに来て、ひれ伏し[a]、イエスに何かを求めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「礼拝し」。ギリシア語の動詞は、文脈により、ひれ伏して敬意を表すこと、敬意を示すこと、または礼拝することを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: その時
  rationale: 出来事の順序を示す自然な時間的接続表現であり、文脈上の次の場面を導入する。
- source_word: προσῆλθεν αὐτῷ
  choice: イエスのもとに来て
  rationale: προσέρχομαιの接近の意味を自然な日本語で表す。代名詞の指示対象を明確にするため「イエス」とした。
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ゼベダイの息子たちの母
  rationale: ギリシア語の属格構造を明瞭に保ち、女性をゼベダイの息子たちとの関係によって特定する。
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: 息子たちと一緒に
  rationale: 属格を伴うμετάの同伴の意味を、現代日本語で自然に表した。
- source_word: προσκυνοῦσα
  choice: ひれ伏し
  rationale: 身体的な伏礼と深い敬意を表しつつ、「礼拝した」と断定せず、語が持つ意味の幅を保つ。
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: 何かを願った
  rationale: αἰτέωと不定代名詞τιを簡潔で自然に表現する。「彼に何かを願った」は日本語では重複感があるため、相手は文脈に委ねた。
theological_decisions:
- issue: イエスに対するπροσκυνοῦσαの訳し方
  choice: ひれ伏し
  alternative: 礼拝し／敬意を表し
  rationale: προσκυνέωは文脈により、伏礼、敬意の表明、礼拝を意味し得る。この場面では請願に伴う身体的・敬意的行為を本文に置き、「礼拝」の可能性は脚注に残して、神学的な含みを一義的に解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい簡潔で品位ある語調とした。「ひれ伏し」により原語の身体的・敬意的含意を保ち、脚注で「礼拝し」という可能性を提示した。
