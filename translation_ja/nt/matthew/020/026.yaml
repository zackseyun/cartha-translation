source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: ja
  text: あなたがたの間では、そうであってはならない[a]。むしろ、あなたがたの間で偉くなりたい者は、あなたがたに仕える者となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの間では、そうではない」。ギリシア語は未来形（直訳「そうはならない」）を用いており、イエスに従う者たちの間ではそのようであってはならない、という意味を表しているとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: あなたがたの間では、そうであってはならない
  rationale: 未来形ἔσταιを単なる現在の事実に平板化せず、イエスの弟子たちの共同体が今後そうあってはならないという規範的な力を、自然な現代日本語で表した。ἐν ὑμῖνは社会的・共同体的な意味で「あなたがたの間では」とした。
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: むしろ、…なりたい者は
  rationale: ὃς ἂνと接続法による不定・一般的な条件を「…者は」で表し、θέλῃの意志を自然な「なりたい」に込めた。ἀλλάは直前との強い対照を示すため「むしろ」とした。
- source_word: μέγας γενέσθαι
  choice: 偉くなりたい
  rationale: γενέσθαιの「なる」という変化・到達のニュアンスを保持し、単に「偉くありたい」とはしなかった。
- source_word: διάκονος
  choice: 仕える者
  rationale: 文脈では他者に奉仕する者を指す。後代の教会職を連想させる「執事」や制度的な「奉仕者」を避け、δοῦλοςの隷属的含意も持ち込まず、動作と関係が明瞭な「仕える者」とした。
- source_word: ὑμῶν
  choice: あなたがたに
  rationale: διάκονοςとの関係を日本語で自然に示すため、「あなたがたの仕える者」ではなく「あなたがたに仕える者」と表した。
theological_decisions:
- issue: イエスに従う共同体における偉さの性質
  choice: 世俗的な支配の序列を逆転させ、偉くなろうとする者に共同体への奉仕を命じる言葉として訳す
  alternative: διάκονοςを教会の職制である「執事」と読む、または具体的な奉仕の言葉を一般的な謙遜へと言い換える
  rationale: 周囲の文脈は異邦人の支配のあり方と弟子たちのあり方を対照させている。そこで具体的な「仕える」という表現を保ちつつ、後代の教会制度や特定教派の理解を持ち込まなかった。
- issue: ἔσταιの未来形が示す力
  choice: 「そうであってはならない」とし、将来に向けた規範・禁止的な力を表す
  alternative: 「あなたがたの間ではそうではない」と現在の状態の記述として訳す
  rationale: 未来形は文脈上、弟子たちの間で何が起こるべきでないかを示す指示として理解できる。ただし現在的な読みも可能なので脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、イエスの教えにふさわしい簡潔で格調ある調子を保った。「偉くなる」と「仕える者」の対照を明確にし、職制用語は避けた。
