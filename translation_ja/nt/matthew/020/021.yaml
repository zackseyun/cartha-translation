source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: ja
  text: イエスは彼女に言われた。「何を望んでいるのですか。」彼女はイエスに言った。「私のこの二人の息子が、あなたの御国[b]で、一人はあなたの右に、もう一人はあなたの左に座るように、と言ってください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「言ってください」。この文脈では、そのようになるよう権威をもって宣言することを願う表現とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「御国」は「王としての支配」または「王として治めること」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: 何を望んでいるのか
  rationale: θέλωがここで尋ねているのは、彼女がどのような願いを持っているかである。「何を望んでいるのか」は、直接的な問いの力を保ちつつ、現代日本語として自然である。
- source_word: Εἰπὲ
  choice: お命じください
  rationale: 語そのものは「言ってください」だが、後続のἵνα節との組み合わせでは、二人がその席に着くことを権威ある言葉によって定めてほしいという依頼を表す。本文では文脈上自然な「お命じください」とし、より字義的な訳を脚注に示した。
- source_word: ἵνα καθίσωσιν
  choice: 座るよう
  rationale: ἵνα節は依頼の内容を示す。「座るよう」は、席への任命を願う意味を日本語で簡潔に表し、受動態を原文に加えない。
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: 私のこの二人の息子
  rationale: 指示詞οὗτοιと所有をともに保ち、彼女がその場の二人を指していることが分かる自然な語順とした。
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: 一人はあなたの右に、もう一人は左に
  rationale: 右と左という空間的位置を保ちつつ、日本語の対句として自然にした。後半の「あなたの」は省略しても対応関係が明瞭である。
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: あなたの御国で
  rationale: βασιλείαには王国と王としての支配の両面がある。ここでは席の位置が問題となるため「御国」が自然だが、「王として治める時」という理解も脚注で示した。
theological_decisions:
- issue: イエスの王権と、求められた左右の席の性格
  choice: 「あなたの御国で」と訳し、王の左右にある栄誉ある席を願う表現として保つ
  alternative: 地上のメシア王国、または終末に完成する天上の王国と明示する
  rationale: 原文は御国が地上的か天上的か、またその実現時期がいつかを限定していないため、特定の終末論的枠組みを訳文に持ち込まない。
- issue: Εἰπὲに含まれる依頼の効力
  choice: 文脈上の発話行為を「お命じください」と表し、字義的意味を脚注に残す
  alternative: 「言ってください」または「お許しください」
  rationale: 単なる発言の要求ではなく、イエスの権威ある言葉によって席を定めてほしいという依頼である。ただし「許す」「かなえる」とまでは原文に明記されていないため、その解釈は本文に加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスへの敬意は「言われた」「お命じください」「御国」で表した。過度に古風な敬語は避けた。脚注記号[a]と[b]は、該当する本文箇所に明示した。
