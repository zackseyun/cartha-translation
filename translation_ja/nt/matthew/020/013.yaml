  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: ja
  text: しかし主人は、そのうちの一人に答えた。「友よ[a]、私はあなたを不当に扱ってはいない。あなたは一デナリオンで私と取り決めたではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「友よ」は、必ずしも親密さを表す呼びかけではなく、距離を置いた響きを帯びることもある。
    reason: lexical_nuance
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς … εἶπεν
  choice: しかし主人は……答えた
  rationale: 分詞と定動詞を日本語で自然な一つの発話導入にまとめた。δέは、抗議に対する応答への転換を「しかし」で示す。文脈上の話者である主人を補って明確にした。
- source_word: ἑνὶ αὐτῶν
  choice: そのうちの一人に
  rationale: 与格単数と部分属格の関係をそのまま明確に表し、集団の中の一人に応答したことを示す。
- source_word: Ἑταῖρε
  choice: 友よ
  rationale: 呼びかけとして簡潔で格調があり、現代日本語でも理解しやすい。ここでは親密さを必ずしも意味しないため、その含みを注で補う。
- source_word: οὐκ ἀδικῶ σε
  choice: 私はあなたに不当なことをしてはいない
  rationale: ἀδικέωの『不当に扱う、害する』という対人的な意味と、現在形の主張を明瞭に表す。
- source_word: οὐχὶ
  choice: ……ではないか
  rationale: 肯定の答えを予期する修辞疑問の力を、自然な日本語の反語表現で保持する。
- source_word: δηναρίου
  choice: 一デナリオンで
  rationale: 価格を示す属格として訳し、歴史的な貨幣単位を一般化せず保持する。
- source_word: συνεφώνησάς μοι
  choice: 私と合意した
  rationale: 以前に双方が取り決めたというアオリストの意味を、簡潔で現代的な表現にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、たとえ話の主人の落ち着いた反論にふさわしい端正さを保った。「合意した」は契約的な取り決めを明確にし、「ではないか」で原文の修辞疑問を再現した。
