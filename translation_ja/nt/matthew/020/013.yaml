  to: しかし主人は、そのうちの一人に答えた。「友よ[a]、私はあなたを不当に扱ってはいない。あなたは一デナリオンで私と取り決めたではないか。」
  rationale: 「不当なことをしてはいない」を、対格の相手に対して不正を行うというἀδικέωの対人的な力がより直接に伝わる「あなたを不当に扱ってはいない」に改めた。あわせて、過去の賃金条件についてのσυμφωνέωを自然な現代日本語で表すため、「合意した」を「取り決めた」に改めた。脚注bのアンカーは本文の「一デナリオン」に残す必要があるため、改訂本文では当該箇所に[b]を付す。
