reference: Matthew 20:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: ja
  text: また、あなたがたの間で第一になりたい者は、あなたがたの奴隷となる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: なりたい者
  rationale: 不定関係節の一般的な意味を「者」で表し、θέλῃの意志・願望を自然な現代日本語の「なりたい」に込めた。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 共同体内部での順位や立場を示すため、「あなたがたの間で」とした。
- source_word: εἶναι πρῶτος
  choice: 第一になりたい
  rationale: πρῶτοςが示す最高位・首位への志向を簡潔に表した。日本語では「第一でありたい」より「第一になりたい」が自然である。
- source_word: ἔσται
  choice: となる
  rationale: 未来直説法の形を保ちつつ、この文脈での規範的な響きを断定的な「となる」で表した。「ならなければならない」として義務を明示しすぎることは避けた。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: 他の弟子たちに対する関係を属格に即して表した。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 前節のδιάκονοςより強い語であり、隷属する者という社会的身分と、イエスの言葉の意図的な強まりを保持するため「奴隷」とした。
theological_decisions:
- issue: 弟子としての奉仕を語る箇所におけるδοῦλοςの訳語
  choice: 奴隷
  alternative: 僕／仕える者
  rationale: ここでは社会的な上位を求める姿勢と徹底した自己卑下が対置され、前節のδιάκονοςから表現も強められている。「僕」や「仕える者」ではその強さと隷属的身分が薄れるため、「奴隷」とした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。前節から続くκαίは「また」と訳し、文脈上の連続性を示した。原文の強い比喩を本文で直接伝えられるため、脚注は付していない。
