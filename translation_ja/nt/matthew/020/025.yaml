id: MAT.20.25
reference: Matthew 20:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: ja
  text: そこでイエスは彼らを呼び寄せて、こう言われた。「あなたがたは知っている。異邦人[a]の支配者たちは自分たちの民の上に君臨し、その有力者たち[b]はその民に権力を振るっている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「諸国民」。
    reason: alternative_reading
  - marker: b
    text: 直訳「その大いなる者たち」。文脈上は「高官たち」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 彼らを呼び寄せて
  rationale: 弟子たちを自分のもとへ呼ぶという中動態のニュアンスを、過度に説明的にせず自然な日本語で表した。
- source_word: Οἴδατε
  choice: あなたがたも知っているように
  rationale: 形は完了形だが現在の意味を持つ。後続内容が周知の事実であることを導く自然な表現とした。
- source_word: ἄρχοντες
  choice: 支配者たち
  rationale: 政治的・社会的に統治する者を指す広い語義を保つ。
- source_word: τῶν ἐθνῶν
  choice: 異邦人の
  rationale: ユダヤ人である弟子たちに対し、非ユダヤ諸民族の統治慣行を指す文脈に適する。「諸国民の」という可能性は脚注に残した。
- source_word: κατακυριεύουσιν
  choice: 君臨し
  rationale: 単なる統治よりも、上から押さえつけるように支配する含みを簡潔に表す。
- source_word: οἱ μεγάλοι
  choice: その有力者たち
  rationale: 直訳的な「大いなる者たち」ではなく、社会的・政治的に力を持つ人物を指す意味を現代日本語で明確にした。
- source_word: κατεξουσιάζουσιν
  choice: 権力を振るっている
  rationale: 権威を行使する意味と、並行する κατακυριεύουσιν が示す威圧的な響きの双方を表した。
- source_word: αὐτῶν
  choice: 人々に
  rationale: 代名詞は τῶν ἐθνῶν に属する人々を受ける。日本語で「彼らに」を重ねた際の指示対象の曖昧さを避けつつ、対象を過度に限定しない表現とした。
theological_decisions:
- issue: ユダヤ的文脈における ἐθνῶν の訳
  choice: 異邦人
  alternative: 諸国民／諸民族
  rationale: イエスが弟子たちに、非ユダヤ世界の支配のあり方を例として語る対比を保つ。ただし語自体は「諸国民」とも訳せるため、脚注で示した。
- issue: οἱ μεγάλοι の表現
  choice: その有力者たち
  alternative: その偉い者たち／その高官たち
  rationale: 文法上の男性複数を不自然な性別明示に変えず、社会的・政治的な有力者という語義を表す。「高官」ほど官職に限定しない。
- issue: 二つの支配動詞が持つ否定的含意
  choice: 君臨する／権力を振るう
  alternative: 支配する／権威を行使する
  rationale: 二つの強意的な複合動詞が示す高圧的な統治の響きを保つ一方、後続節の教えを本文へ先取りして付け加えない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの発言にふさわしい品位を保った。「君臨する」「権力を振るう」により並行表現と批判的な響きを示し、一般読者に分かりにくい直訳調は避けた。
