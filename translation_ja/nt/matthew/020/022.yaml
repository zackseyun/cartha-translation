  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: ja
  text: しかし、イエスは答えて言われた。「あなたがたは、自分たちが何を願い求めているのか、分かっていません。わたしがこれから飲もうとしている杯を、あなたがたは飲むことができますか。」彼らはイエスに、「できます」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: しかし、イエスは答えて言われた
  rationale: δέの穏やかな対照を「しかし」で示し、分詞と定形動詞から成る応答の定型表現を、自然さを損なわない範囲で反映した。
- source_word: Οὐκ οἴδατε
  choice: 分かっていません
  rationale: 単なる情報の不知ではなく、自分たちの願いの意味を認識していない文脈なので、現代日本語で自然な「分かっていません」とした。
- source_word: τί αἰτεῖσθε
  choice: 自分が何を願い求めているのか
  rationale: αἰτέομαιの求める行為を「願い求める」で表し、中動態の含意を過度に説明せず、日本語では主語との関係を「自分が」で明確にした。
- source_word: δύνασθε πιεῖν
  choice: 飲むことができますか
  rationale: 能力・可能性を問うδύνασθεを明示し、後半の「できます」と対応させた。
- source_word: τὸ ποτήριον
  choice: 杯
  rationale: 聖書的な比喩を保持するため、苦難や死と説明的に置き換えず「杯」とした。
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: わたしがこれから飲もうとしている
  rationale: μέλλωの将来への向かいと差し迫った意図を「これから～しようとしている」で表し、必然性だけに限定しなかった。
- source_word: λέγουσιν αὐτῷ· Δυνάμεθα
  choice: 彼らはイエスに、「できます」と言った
  rationale: 歴史的現在は日本語の通常の物語時制に合わせて過去形とし、代名詞の指示対象を「イエス」と明確にした。「できます」は先の能力を問う表現と語彙的に対応する。
theological_decisions:
- issue: 「杯」の比喩的意味
  choice: 本文では「杯」をそのまま保持する。
  alternative: 「わたしが受けようとしている苦しみ」または「苦しみの杯」
  rationale: この比喩はイエスに定められた受難を指し示すが、本文自体は内容を一語に限定していない。比喩と神学的な広がりを保つため説明的に解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの厳粛な問いにふさわしい品位を保った。「杯」は日常語の「カップ」にせず、聖書的比喩に適する「杯」とした。
