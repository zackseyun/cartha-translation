  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: ja
  text: 彼らはそれを受け取ると、家の主人に向かって不平を言い始めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: それを受け取ると
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、自然な日本語で時間的な順序を示した。目的語はギリシア語では省略されているが、文脈上は支払われた一デナリを指すので、「それを」と補った。
- source_word: δὲ
  choice: （独立した接続語は置かない）
  rationale: ここでは物語を進める弱い接続であり、日本語では「受け取ると」という構文自体が前節との流れを自然に示すため、接続語を加えなかった。
- source_word: ἐγόγγυζον
  choice: 不平を言い始めた
  rationale: 未完了過去が表し得る開始的な含みを文脈に即して示し、γογγύζωの不満をぶつぶつ表す意味を、現代の一般読者に自然な表現で訳した。
- source_word: κατὰ
  choice: に向かって
  rationale: 属格を伴い、主人を相手として不満が向けられたことを示す。日本語では「に反対して」よりも場面に自然である。
- source_word: τοῦ οἰκοδεσπότου
  choice: 家の主人
  rationale: 家や所領を取り仕切る者を指す語の構成と意味を保ちつつ、現代日本語として分かりやすくした。「地主」では土地所有に意味を狭めすぎる可能性がある。
theological_decisions: []
