revisions:
- from: そして、人々はその方を異邦人たちに引き渡し、あざけり、むち打ち、十字架につけさせる。しかし、その方は三日目によみがえらされる。[a]
  to: 彼らは、あざけり、むち打ち、十字架につけるために、その方を異邦人たちに引き渡す。しかし三日目に、その方はよみがえらされる。[a]
