    issue: 暴行・処刑を行う者の統語関係が不明瞭
    rationale: ギリシア語では「彼ら」は彼を異邦人に引き渡し、異邦人があざけり、むち打ち、十字架につける。現行文は同じ主語が全行為を行うようにも読めるため、目的構文を明示する必要がある。
  - severity: medium
    issue: 「十字架につけさせる」が不要な使役を示しうる
    rationale: σταυρῶσαιは「十字架につける／十字架刑にする」であり、原文はここでさらに別の行為者に処刑をさせることを述べない。
  revised_text: 彼らは、あざけり、むち打ち、十字架につけるために、その方を異邦人たちに引き渡す。しかし三日目に、その方はよみがえらされる。[a]
