review_pass:
  verdict: revise
  source_fidelity: 「引き渡す」「異邦人たち」「三日目」「よみがえらされる」は、各々παραδώσουσιν、τοῖς ἔθνεσιν、τῇ τρίτῃ ἡμέρᾳ、ἐγερθήσεταιを適切に反映している。ただし、現行の連用形の連なりでは、主節の主語である「人々」があざけり・むち打ち・十字架刑を行うようにも読め、これらを行う異邦人に引き渡すというεἰς＋不定詞の構文関係が不明瞭になる。
  naturalness: 「あざけり、むち打ち、十字架につけさせる」は、主語・行為者の関係が曖昧であり、「つけさせる」はさらに使役の意味を加えうる。目的を明示して「…するために、…に引き渡す」とするのが、明瞭な現代標準日本語として自然である。
  terminology: 「異邦人たち」「十字架につける」は文脈に即した適切な用語である。「その方」は敬意を帯びるが、現行の荘重な登録には整合する。復活表現はギリシア語の未来受動態を保持するため「よみがえらされる」を維持し、代案を脚注で示す。
  issues:
