  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: ja
  text: 彼らは、あざけり、むち打ち、十字架につけるために、その方を異邦人たちに引き渡す。しかし三日目に、その方はよみがえらされる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「よみがえる」。ギリシア語の動詞は受動態（「よみがえらされる」）で、復活を語る際によく用いられ、神の働きを含意することがある。
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: 引き渡し
  rationale: 他者の支配下へ渡す意味を自然な現代日本語で表し、「裏切る」という限定的な意味は持ち込まない。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人たちに
  rationale: 受難予告のユダヤ的文脈では、諸国民一般よりも非ユダヤ人、特に異邦人の権力者を指す。
- source_word: εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι
  choice: あざけり、むち打ち、十字架につけさせる
  rationale: εἰς＋冠詞付き不定詞の目的・結果を、日本語では引き渡しの相手が行う一連の行為として自然に表した。共有目的語は「その方」によって明らかである。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 三日目に
  rationale: 時間を表す与格を簡潔で慣用的な日本語にした。
- source_word: ἐγερθήσεται
  choice: よみがえらされる
  rationale: 未来受動形を保ち、復活における神の働きを含意し得る表現とした。単なる自動詞の「よみがえる」へ変えず、原文の態を反映する。
theological_decisions:
- issue: 復活動詞の態
  choice: よみがえらされる
  alternative: よみがえる
  rationale: ギリシア語は未来受動形であるため、その形と神の働きの含意を保つ。一方で日本語として理解を助けるため、自動詞訳も脚注に示す。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「彼」ではなく「その方」を用いて直前の指示対象を自然に示した。三つの暴行を並列させ、原文の厳粛な進行を保った。
