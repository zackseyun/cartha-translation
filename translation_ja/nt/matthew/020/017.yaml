  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ja
  text: さて、イエスはエルサレムへ上って行く途中、十二人の弟子を脇へ連れて行き、道すがら彼らに言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: 上って行く途中
  rationale: 現在分詞が主動詞と同時進行の動作を表すため、「上って行く」でエルサレムへの地理的・慣用的な上行を保ち、「途中」で文脈に自然につないだ。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムへ
  rationale: 都市を目的地とする εἰς を、現代日本語で自然な方向表現「へ」とした。
- source_word: παρέλαβεν
  choice: 連れて別の所に行き
  rationale: 「伴って行く／連れて行く」という語義を表しつつ、後続の κατ’ ἰδίαν が示す一行から離れた私的な場面を日本語として明瞭にした。
- source_word: τοὺς δώδεκα μαθητὰς
  choice: 十二人の弟子
  rationale: 本文に明記された μαθητάς を省かず、「十二人」と人数も明示した。
- source_word: κατ’ ἰδίαν
  choice: だけを…別の所に
  rationale: 他の者たちから離れて、弟子たちだけを伴うという空間的・私的な含みを自然な日本語で表した。
- source_word: ἐν τῇ ὁδῷ
  choice: 道すがら
  rationale: 旅の途上で語ったことを簡潔で品位ある現代日本語にした。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: λέγω の通常の発話を表し、イエスへの敬意を自然な日本語の主体敬語で示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。物語文として自然な流れを優先しながら、上行、十二人の弟子、他の者から離れた私的状況、旅の途上という原文の要素を保持した。
