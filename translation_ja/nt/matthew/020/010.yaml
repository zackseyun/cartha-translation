  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: ja
  text: 最初の人たち[a]が来たとき、自分たちはもっと多くもらえると思った。ところが、彼らも一人につき一デナリオン[b]を受け取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「最初の人たち」とは、このたとえ話で最初に雇われた労働者たちを指す。
    reason: lexical_alternative
  - marker: b
    text: 一デナリオンは、当時の労働者の一般的な一日分の賃金だった。
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: 来ると
  rationale: アオリスト分詞の時間的用法を、物語の順序が自然に伝わる現代日本語で表した。
- source_word: οἱ πρῶτοι
  choice: 最初の人たち
  rationale: 抽象的な順位ではなく、たとえ話の中で最初に雇われた労働者たちを指す複数形として訳した。
- source_word: ἐνόμισαν
  choice: 思った
  rationale: ここでは推測や期待を表すため、確信を過度に強めない自然な表現を選んだ。
- source_word: πλεῖον
  choice: もっと多く
  rationale: 報酬の額がより多いことを指す比較表現を簡潔に示した。
- source_word: λήμψονται
  choice: もらえる
  rationale: 過去の時点における彼ら自身の期待を、自然な日本語の間接話法で表した。
- source_word: τὸ ἀνὰ δηνάριον
  choice: 一人一デナリオン
  rationale: ἀνάの配分的意味を「一人…」で明示し、各人が同額を受け取ったことを伝えた。
- source_word: καὶ αὐτοί
  choice: 彼らも
  rationale: 後から雇われた者たちと同じ額だったという、意外な同等性への強調を保った。
