  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: ja
  text: 彼らはイエスに言った。「主よ[a]、私たちの目を開けてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主よ」は、敬意を表す呼びかけとして理解することもできる。
    reason: κύριε はイエスへの「主よ」という呼びかけであるとともに、文脈によっては「Sir」に相当する敬意ある呼称としても用いられるため。
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: 彼らはイエスに言った
  rationale: 歴史的現在の λέγουσιν は、日本語の物語として自然な過去形「言った」で表した。αὐτῷ は文脈上イエスを指すため、曖昧にならないよう「イエスに」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριος の呼格であり、イエスへの敬意と権威の承認を保つ「主よ」とした。ただし、呼びかけとして「先生」に近い意味にも理解できるため脚注を付した。
- source_word: ἵνα ἀνοιγῶσιν
  choice: 見えるようにしてください
  rationale: 直訳は「開かれるように」だが、日本語で目について「見えるようにしてください」とすることで、視力の回復を求める願いを自然かつ明確に伝えた。依頼を導く ἵνα と受動態の意図を、使役的に断定せず願いの表現として再現した。
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: 私たちの目
  rationale: 名詞と属格代名詞を、現代日本語で自然な所有表現にした。
theological_decisions:
- issue: イエスへの呼びかけ κύριε の訳
  choice: 主よ
  alternative: 先生
  rationale: 「主よ」はマタイ福音書におけるイエスへの呼びかけの重みを保つ一方、この一語だけで話者のキリスト論的理解を必要以上に確定しない。日常的な敬称として理解する可能性は脚注に残した。
- issue: 目が「開かれる」という受動表現
  choice: 目が見えるようにしてください
  alternative: 私たちの目が開かれますように
  rationale: 原文の比喩的な形を逐語的に残すより、盲人が視力の回復を願う意味を明瞭で自然な日本語にした。誰が癒やすかという含意は、イエスへの依頼という文脈によって保たれる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、願いの切実さを丁寧な依頼表現で示した。「主よ」は荘重さを保つが、全体は一般の読者にも理解しやすい語調とした。
