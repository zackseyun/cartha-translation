  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: ja
  text: しかし、愛する人たち、あなたがたは、あなたがたの最も聖なる信仰[b]を土台にして[a]自らを築き上げ、聖霊のうちに[c]祈りながら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの最も聖なる信仰の中で」。ギリシア語は、信仰を建物の土台として捉えることも、信仰との関わりやその領域の中で築き上げることも表し得る。
    reason: lexical_alternative
  - marker: b
    text: ここでの「信仰」は、信者の共同体が共有する信仰を指す可能性が高いが、「信頼」または「忠実さ」と理解する余地もある。
    reason: lexical_alternative
  - marker: c
    text: 別訳「聖霊によって」。この句は、祈りが聖霊のうちで行われることにも、聖霊の働きによって行われることにも重点を置き得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: しかし、あなたがたは
  rationale: δέによる直前の人々との対照と、明示された代名詞ὑμεῖςの強調を、自然な日本語で保った。
- source_word: ἀγαπητοί
  choice: 愛する人たち
  rationale: 複数への親愛を込めた呼びかけである。現代の読者に明瞭でありながら、軽すぎない表現とした。
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: 自分たちを築き上げ
  rationale: 建築の比喩と再帰代名詞の働きを保った。複数の共同体への呼びかけであることが伝わるよう「自分たち」とした。
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: 自分たちの最も聖なる信仰を土台として
  rationale: ἁγιωτάτῃの最上級を保ち、ἐποικοδομέωに伴う与格を建築の土台として表した。ただし、与格には領域・関係を示す理解もあり得るため脚注を付した。
- source_word: πίστει
  choice: 信仰
  rationale: 文脈上、共同体が受け入れて共有するキリスト教信仰を指す可能性が高い。語の幅を完全には限定せず、別の意味を脚注に示した。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊のうちに
  rationale: ἐνの領域的な意味を保ち、πνεύματι ἁγίῳを神の聖霊への言及として訳した。手段を表す「聖霊によって」も可能なので脚注に示した。
- source_word: προσευχόμενοι
  choice: 祈りながら
  rationale: 現在分詞を、続く勧告の流れを保つ連用表現にした。節が次節へ続くことも読点で示した。
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳの指示対象
  choice: 神の聖霊
  alternative: 聖なる心・霊的態度
  rationale: 初期キリスト教の用法とユダ書の文脈では神の聖霊を指すのが最も自然である。ただしἐνが領域を示すか働きかけの手段を示すかは訳文だけで断定せず、脚注に残した。
- issue: πίστιςの意味
  choice: 共同体が受け入れ、共有している信仰
  alternative: 信頼する行為、または忠実さ
  rationale: ユダ書における「信仰」の用法、とりわけ三節との関連から、受け継がれた信仰内容を指す可能性が高い。ただし語彙上あり得る別の意味は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、親愛を込めた呼びかけと建築の比喩を保持した。原文が次節へ続く分詞構文なので、完結させず読点で終えた。「最も聖なる」は最上級を明示するため、やや荘重だが理解しやすい表現として採用した。
