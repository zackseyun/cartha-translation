  to: しかし、この者たちは、自分が理解していないものを悪く言い[a]、理性のない動物のように本能的に知っている事柄については、その事柄によって滅びに至っています[b]。
  rationale: 原文の対照（理解しない事柄を悪く言う／動物のように本能的に知る事柄）と、後者の事柄が彼らの腐敗・破滅に関与する関係を、自然で明瞭な日本語にした。本文は φθείρονται の破滅の側面を示しつつ、脚注で「堕落」と、ἐν τούτοις の領域的な読みを保持する。
