    rationale: 「本能で知ることについては、それによって」は、ἐν τούτοις が指す「本能的に知る事柄」を日本語で滑らかに示していない。対象を「本能的に知っている事柄」と明示し、それを「その事柄」と受けるのが自然である。
  - severity: low
    issue: 「身を滅ぼしています」の「身」
    rationale: 自己破滅の含みを表す意図は妥当だが、「身」は身体的な響きを帯び得る。φθείρονται の腐敗・破滅という広い結果を、「滅びに至っています」でより中立に表せる。
  - severity: low
    issue: 脚注aの代替訳の並列
    rationale: 「または『冒瀆し』『ののしり』」は接続がやや不自然であるため、「『冒瀆し』または『ののしり』」とする。
