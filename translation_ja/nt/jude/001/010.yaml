id: JUD.1.10
reference: Jude 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: ja
  text: しかし、この者たちは、自分が理解していないものを悪く言い[a]、理性のない動物のように本能的に知っている事柄については、その事柄によって滅びに至っています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「冒瀆し」または「ののしり」。
    reason: lexical_alternative
  - marker: b
    text: 「そのようなことにおいて堕落しています」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: この者たち
  rationale: 文脈上、共同体に入り込んだ者たちを指す。性別を限定せず、指示語の非難的な響きも保つ。
- source_word: βλασφημοῦσιν
  choice: 悪く言い
  rationale: 神への冒瀆に限定せず、理解しない事柄を口汚く非難する広い意味を自然な日本語で表す。
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: 自分が理解していないもの
  rationale: 後半の本能的な知との対比から、単なる未知ではなく理解の欠如を表す。
- source_word: φυσικῶς
  choice: 本能で
  rationale: 理性的理解と対照され、動物との比喩によって明確になる生得的・本能的な知り方を簡潔に表す。
- source_word: τὰ ἄλογα ζῷα
  choice: 理性のない動物
  rationale: ἄλογα の『理性を欠く』という対比を、侮蔑的な古語を避けて明瞭に表す。
- source_word: ἐπίστανται
  choice: 知る
  rationale: 前半の『理解する』とは異なる動詞であり、限定された本能的認知を示すため『知る』と訳し分ける。
- source_word: ἐν τούτοις
  choice: それによって
  rationale: ἐν の場所的・領域的な含みを認めつつ、ここでは彼らが本能で知る事柄が破滅の手段となるという道具的意味を本文に採る。
- source_word: φθείρονται
  choice: 身を滅ぼしています
  rationale: 現在形の進行的な響きと、中・受動形が許す自己破滅および滅ぼされることの重なりを日本語で表す。 moral corruption の含みも文脈上残る。
theological_decisions:
- issue: βλασφημέω の対象が明示的に神ではない場合の意味
  choice: 『悪く言う』と訳す
  alternative: 『冒瀆する』『ののしる』
  rationale: 対象は『理解していないもの』であり、直接的な神への冒瀆だけに狭めない。激しい非難という意味を保ちつつ、日本語として過度に口語的・限定的にしない。
- issue: φθείρονται の腐敗と破滅の重なり
  choice: 『身を滅ぼしています』と訳す
  alternative: 『堕落しています』『滅ぼされています』
  rationale: ユダ書の裁きの文脈にある破滅を前面に出しながら、その本能的行動による自己破壊という中動態的な含みを保つ。外的受動か自己破滅かを完全には固定しない。
- issue: ἐν τούτοις の機能
  choice: 道具的に『それによって』と訳す
  alternative: 領域的に『そのようなことにおいて』
  rationale: 前述の本能的に知る事柄が破滅をもたらすという文脈上の流れを自然に示すが、別解は注で保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。前半の οἴδασιν は『理解する』、後半の ἐπίστανται は『知る』と訳し分け、理性的理解と本能的認知の対比を示した。すべての脚注記号を本文に配置した。
