  verdict: revise
  source_fidelity: 前半の「理解していないものを悪く言い」は、ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν を適切に表す。後半も、本能的・動物的な認知の対象そのものが彼らの破滅／腐敗に関わるという原文の関係を明示するよう整える。φθείρονται は「堕落」と「破滅」の両義を持ち得るため、本文では破滅の方向を示し、脚注で領域的・腐敗の訳を保持する。
  naturalness: 現行の「理性のない動物のように本能で知ることについては、それによって」は、「こと」と「それ」の指示関係がやや不自然で曖昧である。「本能的に知っている事柄」「その事柄によって」とすることで、明瞭な現代標準語になる。
  terminology: 「悪く言う」は、この文脈の βλασφημοῦσιν を神への冒瀆に限定せずに表す穏当な訳である。「理性のない動物」も ἄλογα ζῷα の対比を保つ。「滅びに至っています」は中・受動態の結果的な破滅を表し、「身を」がもたらし得る身体的含意を避ける。
  issues:
