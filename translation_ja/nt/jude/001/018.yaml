id: JUD.1.18
reference: Jude 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: ja
  text: 彼らはあなたがたにこう言っていました。「終わりの時には[a]、あざける者たち[b]がいて、自分たちの不敬虔な欲望に従って歩む。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「終末の時には」または「時の終わりには」。ギリシャ語の「時」は単数形であり、「日々」ではない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「嘲る者たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていました
  rationale: 未完了過去の継続・反復の含みを保ちつつ、現代日本語として自然に表した。
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: 終わりの時には
  rationale: χρόνου が単数であることを保ち、「終わりの日々」とはせず、終末論的な意味を明確に伝えた。
- source_word: ἐμπαῖκται
  choice: あざける者たち
  rationale: 嘲笑し侮る者という意味を、一般の読者に分かりやすい現代語で表した。
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: 自分自身の……欲望に従って
  rationale: κατά の規範・方向に沿う意味を自然な日本語で表し、ἐπιθυμίαι を性的欲情だけに狭めないよう「欲望」とした。
- source_word: πορευόμενοι
  choice: 歩む
  rationale: 移動を表す語から生き方を示す比喩への広がりを保ち、聖書本文にふさわしい自然で簡潔な表現とした。
- source_word: τῶν ἀσεβειῶν
  choice: 不敬虔な
  rationale: 属格が欲望の性質を示すものと捉え、神を敬わないという宗教的・道徳的評価を形容表現で自然に伝えた。
theological_decisions:
- issue: 終末を表す句
  choice: 終わりの時には
  alternative: 終わりの日々には／時の終わりには
  rationale: 原文の単数 χρόνος を保持し、他の箇所でよく使われる「終わりの日々」と不用意に調和させないため。なお、この句が終末的な時期を指すという含みは保った。
- issue: 欲望の道徳的性格
  choice: 不敬虔な欲望
  alternative: 不敬虔に属する欲望／神を恐れない欲望
  rationale: 原文の道徳的・宗教的評価を明示しながら、欲望を性的なものだけに限定しないため。
- issue: πορευόμενοι の生き方の比喩
  choice: 欲望に従って歩む
  alternative: 欲望に従って生きる
  rationale: 原文の「行く・歩む」という比喩を残しつつ、生活態度を指すことが日本語でも理解できる表現とした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、引用内では適度な荘重さを保った。「言っていました」で未完了過去の含みを示し、「歩む」によって原文の生活上の比喩を保持した。英語相談層では脚注記号と内容の対応が逆転しているため、日本語稿では本文上の該当語句に正しく付した。
