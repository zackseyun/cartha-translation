id: JUD.1.5
reference: Jude 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: ja
  text: あなたがたには、すでに一度、これらすべてのことを知っていただいていますが、改めて思い起こさせたいのです。イエス[a]は、エジプトの地から民を救い出した後、信じなかった者たちを滅ぼしました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「イエス」ではなく「主」または「神」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι
  choice: 思い起こしてもらいたい
  rationale: すでに知っている事柄を改めて心に留めさせる意味を、自然な現代日本語で表した。
- source_word: βούλομαι
  choice: 〜してもらいたい
  rationale: 話者の意志・願いを明瞭に表し、Ὑπομνῆσαιとの結び付きを自然にした。
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: あなたがたはすべてのことを一度で知っているとはいえ
  rationale: 分詞句を文脈上の譲歩として訳し、πάνταの広がりとἅπαξの『一度で／一度限り』という含みを保持した。日本語で断定的に『すべてを完全に』と意味を狭めることは避けた。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 指定されたSBLGNT本文の読みをそのまま訳し、出エジプトにおけるイエスの働きという強いキリスト論的表現を弱めなかった。
- source_word: λαὸν
  choice: 民
  rationale: イスラエルを集合的に指す聖書的な語感を保ちつつ、日本語では不自然な不定表現を避けた。
- source_word: ἐκ γῆς Αἰγύπτου
  choice: エジプトの地から
  rationale: 出エジプト伝承に響く『地』を残した。
- source_word: σώσας
  choice: 救い出した後
  rationale: 主動詞に先立つアオリスト分詞の時間的先行を自然に示し、エジプトからの解放という文脈に合わせて『救い出す』とした。
- source_word: τὸ δεύτερον
  choice: その後
  rationale: 二つ目の行為、すなわち救出に続く裁きを示す慣用的な時間表現として訳した。
- source_word: τοὺς μὴ πιστεύσαντας
  choice: 信じなかった者たち
  rationale: 不信仰に陥った集団を直接的かつ標準的な表現で示した。
- source_word: ἀπώλεσεν
  choice: 滅ぼされました
  rationale: 神的裁きの厳しさを保つため『滅ぼす』を用い、文体上は敬語によって主語への敬意を示した。
theological_decisions:
- issue: 出エジプトの行為者を示す本文異読
  choice: 本文を「イエス」とする
  alternative: 「主」または「神」
  rationale: 提示されたSBLGNT本文はἸησοῦςと読むため、それを主文に反映した。異読は本文批評上も神学上も重要なので脚注に残し、本文で調和させなかった。
- issue: 救いと裁きの同一主体
  choice: イエスが民を救い、その後、不信仰な者たちを滅ぼしたという緊張を保持する
  alternative: 裁きの主体を曖昧にする、または別主体として補う
  rationale: ギリシア語では同じ主語がσώσαςとἀπώλεσενを担うため、その神学的緊張をそのまま訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半の長い分詞構文は二文に分けて理解しやすくしたが、譲歩関係、救出から裁きへの順序、同一主体は保持した。
