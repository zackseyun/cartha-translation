revisions:
- from: あなたがたはすべてのことを一度で知っているとはいえ、思い起こしてもらいたいことがあります。イエス[a]は、エジプトの地から民を救い出した後、信じなかった者たちを滅ぼされました。
  to: あなたがたには、すでに一度、これらすべてのことを知っていただいていますが、改めて思い起こさせたいのです。イエス[a]は、エジプトの地から民を救い出した後、信じなかった者たちを滅ぼしました。
  rationale: 原文の譲歩的な分詞句を「すでに一度…知っていただいていますが」とし、ἅπαξの時間的含みと、既知の内容を想起させる文脈を自然に表しました。「改めて思い起こさせたいのです」により、著者の意志と読者への働きかけを明示しています。後半は、イエスを救出と裁きの両方の主体として保ち、能動文にして原文の構文を明確にしました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:44:26Z'
review_pass:
  verdict: revise
  source_fidelity: 「一度で知っている」はἅπαξを「一度で（at one time）」のように受け取らせやすく、原文の「すでに／かつて一度、知っている事柄を改めて思い起こさせる」という趣旨を十分に表していません。また、「思い起こしてもらいたいことがあります」は、Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι（「あなたがたに思い起こさせたい」）よりも間接的です。本文のἸησοῦς、および救出と滅びの同一主体は保持されています。
  naturalness: 「あなたがたには、すでに一度、これらすべてのことを知っていただいていますが、改めて思い起こさせたいのです」は、現代標準日本語として明瞭で、既知の事柄への想起を求める導入として自然です。「滅ぼされました」の尊敬語は不必要で、主語がイエスであることを通常の能動文「滅ぼしました」で明確にするのが適切です。
  terminology: 「イエス」「エジプトの地」「民」「救い出す」「信じなかった者たち」「滅ぼす」は、本文と聖書日本語の用法に適合しています。本文異読の脚注も正しく対応しています。
  issues:
  - severity: medium
    issue: ἅπαξの訳し方
    rationale: 「一度で」は、原文の「一度限りに／すでに」という時間的・確定的な含みではなく、一回の機会に知識を得る方法を示す日本語になりやすいです。
  - severity: medium
    issue: 導入句の行為主体と直接性
    rationale: 「思い起こしてもらいたいことがあります」は日本語として可能ですが、「私はあなたがたに思い起こさせたい」というβούλομαι＋不定詞の直接的な構文を弱めています。
  - severity: low
    issue: 不必要な尊敬語
    rationale: 「滅ぼされました」は受け身形と同形の尊敬語であり、原文の能動態を日本語の通常の能動文で明示するほうが明瞭です。
  revised_text: あなたがたには、すでに一度、これらすべてのことを知っていただいていますが、改めて思い起こさせたいのです。イエス[a]は、エジプトの地から民を救い出した後、信じなかった者たちを滅ぼしました。
