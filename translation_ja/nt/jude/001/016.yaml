id: JUD.1.16
reference: Jude 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: ja
  text: この者たちは、不平をつぶやく者、自分の境遇に不満を抱く者であり、自分の欲望に従って歩んでいます。彼らの口は尊大なことを語り、利益を得るために人を特別扱いします。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「顔を称賛する」です。人を特別扱いする、またはえこひいきすることを表す慣用句です。
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσταί
  choice: 不平をつぶやき
  rationale: 声を低くして繰り返し不満を漏らすという語感を、現代日本語で自然に表した。
- source_word: μεμψίμοιροι
  choice: 自分の境遇に不満を抱く者たち
  rationale: 単なる批判ではなく、自分に割り当てられた境遇や運命への不満を表す珍しい語の意味を明示した。
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: 自分の欲望に従って歩んでいます
  rationale: πορεύομαιの生き方を示す比喩を「歩む」で保ち、ἐπιθυμίαιは性的意味に限定せず、文脈上の否定的な強い欲求を「欲望」とした。
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: その口は大言壮語し
  rationale: 単数形「口」を保ちつつ、膨れ上がった尊大な発言を意味するὑπέρογκαを、簡潔で格調ある日本語にした。
- source_word: θαυμάζοντες πρόσωπα
  choice: 人にへつらいます
  rationale: 字義は「顔を称賛する」だが、利益を得るため相手を持ち上げるという文脈上の行為を自然な日本語で表した。
- source_word: ὠφελείας χάριν
  choice: 利益のために
  rationale: 自己に有利なものを得ようとする動機を簡潔に示した。
theological_decisions:
- issue: ἐπιθυμίαιの道徳的範囲
  choice: 欲望
  alternative: 情欲／欲求
  rationale: 性的な情欲に限定せず、自己中心的で秩序を逸脱した願望全般を含む文脈上の否定的意味を保つ。
- issue: θαυμάζοντες πρόσωπαの慣用的意味
  choice: 人にへつらいます
  alternative: 人をえこひいきします／人の顔を称賛します
  rationale: 「利益のために」という目的句との結びつきから、単なる偏りよりも、利得を狙って相手を持ち上げる振る舞いが前景化している。ただし慣用句の幅は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ユダ書の鋭い告発調を保った。「自分の境遇に不満を抱く」は稀語μεμψίμοιροιの固有の意味を伝えるため説明的に訳し、「歩む」と単数形の「口」は原文の比喩と表現を保持した。
