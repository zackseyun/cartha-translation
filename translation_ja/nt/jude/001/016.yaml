  terminology: μεμψίμοιροιを「自分の境遇に不満を抱く者」とする点、ἐπιθυμίαιを性的意味に限定しない「欲望」とする点は適切です。ὑπέρογκαは「大言壮語」よりも尊大で誇大な発言を含むため、「尊大なこと」がより直接的です。
