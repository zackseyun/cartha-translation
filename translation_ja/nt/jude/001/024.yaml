id: JUD.1.24
reference: Jude 1:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: ja
  text: さて、あなたがたをつまずかないように守り[a]、ご自分の栄光の前に[b]、傷のない者[c]として喜びのうちに立たせることのできる方に、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「倒れないように」。原語には、つまずかない、倒れないという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳「ご自分の栄光の前に」。「栄光に満ちた御前」と理解することもできる。
    reason: alternative_reading
  - marker: c
    text: 「責められるところのない者」とも訳せる。原語には、供え物などが「傷のない」状態を表す響きもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: できる方に
  rationale: 冠詞付き分詞の与格を、25節へ続く頌栄の間接目的語として自然な日本語で表した。「方」は指示対象への敬意を保ちつつ、分詞の働きを明確にする。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、結びの頌栄への穏やかな転換を示すため。「今」という時間的意味は加えない。
- source_word: φυλάξαι
  choice: 守り
  rationale: 「見張る」「保つ」も可能だが、ここでは危険や失敗から保護する意味を簡潔に伝える。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数を明示する。
- source_word: ἀπταίστους
  choice: つまずかないように
  rationale: 「つまずかない」という形容詞的意味を、日本語の「守る」と自然につながる目的・結果表現にした。比喩を保持し、日々の罪か最終的な離反かに意味を限定しない。
- source_word: καὶ στῆσαι
  choice: 立たせる
  rationale: 使役的な「立たせる」を保持し、神の栄光の前に立つ場面を直接表す。「差し出す」「立たせてくださる」より原文の構造に近い。
- source_word: κατενώπιον
  choice: 前に
  rationale: 「面前に」「御前に」より平明で、臨在の含意も保てる。
- source_word: τῆς δόξης αὐτοῦ
  choice: ご自分の栄光
  rationale: 原文の名詞「栄光」をそのまま保ち、「栄光に満ちた臨在」のような解釈的展開を避ける。再帰的な「ご自分の」で主語との関係を自然に示す。
- source_word: ἀμώμους
  choice: 傷のない者
  rationale: 道徳的に責められるところがないことと、供え物に傷がないという祭儀的響きの双方を残す。
- source_word: ἐν ἀγαλλιάσει
  choice: 喜びのうちに
  rationale: 高揚した喜びを表す名詞句を保ち、「大きな」のような原文にない程度表現は加えない。
theological_decisions:
- issue: ἀπταίστουςが日常的な罪からの保護を指すのか、最終的な離反から守ることを指すのか
  choice: つまずかないように
  alternative: 倒れないように
  rationale: 原語の比喩を保ち、どちらか一方の教理的理解に狭めない。
- issue: τῆς δόξης αὐτοῦを「ご自分の栄光」とするか、「栄光に満ちた臨在」と解するか
  choice: ご自分の栄光
  alternative: 栄光に満ちた御前
  rationale: 原文が明記する「栄光」を保持し、臨在という妥当だが解釈的な補足を本文に組み込まない。
- issue: ἀμώμουςの倫理的意味と祭儀的意味をどう保つか
  choice: 傷のない者
  alternative: 責められるところのない者
  rationale: 神の前での無罪・潔白だけでなく、傷のない供え物を想起させる語感も残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、頌栄にふさわしい格調を保った。文は25節へ続くため読点で終える。「御前」などの宗教的慣用語に偏らず、「栄光の前に」として原文の像を保持した。
