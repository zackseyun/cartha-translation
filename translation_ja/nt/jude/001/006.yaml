id: JUD.1.6
reference: Jude 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: ja
  text: また、自分たちの領分[a]を守らず、自分たちの住まい[b]を捨てた天使たちを、大いなる日の裁きのために、永遠の鎖につなぎ、深い暗闇[c]の中に留めておられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの地位」または「自分たちの支配」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「自分たち本来の住まい」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳「暗闇の下に」。ギリシア語は陰鬱で深い闇を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: 天使たち
  rationale: この裁きの文脈では、人間の「使者」ではなく超自然的存在を指すのが自然であり、ユダの手紙の背景にも合う。
- source_word: τηρήσαντας / τετήρηκεν
  choice: 守らず／留めておられます
  rationale: 同じ動詞の反復が表す対照を、自然な日本語の範囲で示した。天使たちは自分たちの領分を守らなかったため、裁きに向けて留められている。
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: 自分たちの領分
  rationale: ἀρχήには「初め」「権威」「支配」「地位・領域」などの幅がある。ここでは、天使たちに属する領域または立場を表しつつ、「支配権」や時間的な「初め」に限定しない表現とした。
- source_word: ἀπολιπόντας
  choice: 捨てた
  rationale: 単にその場を離れた以上に、意図的に放棄したという司法的文脈に合う強さを持つ。
- source_word: τὸ ἴδιον οἰκητήριον
  choice: 自分たちの住まい
  rationale: οἰκητήριονは居住する場所を表し、ἴδιονはそれが彼ら自身に属することを示す。「本来の住まい」という文脈的含意は注に残した。
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: 大いなる日の裁きのために
  rationale: εἰςの目的・結果への方向性と属格構造を保ち、「その日まで」と時間的意味だけに限定することを避けた。
- source_word: δεσμοῖς ἀϊδίοις
  choice: 永遠の鎖につなぎ
  rationale: δεσμοίの拘束の比喩を明瞭にし、ἀΐδιοςの永続性を現代日本語で端的に表した。
- source_word: ὑπὸ ζόφον
  choice: 深い暗闇の中に
  rationale: ζόφοςは通常の暗さではなく、陰鬱で濃い闇を表す。「下に」という直訳より自然な日本語を用いながら、その強いイメージを「深い暗闇」で保持した。
- source_word: τε
  choice: また／も
  rationale: 前節の裁きの例にこの例を結び付ける添加の働きを、日本語の「また」と「も」で自然に示した。
theological_decisions:
- issue: 天使たちの違反の具体的内容
  choice: 天使たちが自分たちの領分を守らず、住まいを捨てたとだけ述べ、その出来事の詳細は特定しない。
  alternative: 創世記6章に関係する天使の反逆、または原初の一般的な天使の堕落を明示する。
  rationale: ユダは当時知られていた伝承を想起させている可能性が高いが、この節自体は背景を詳述しない。本文の曖昧さと緊張を保ち、特定の解釈を訳文へ持ち込まない。
- issue: τετήρηκενの暗黙の主語
  choice: 日本語でも主語を明示せず、「留めておられます」と訳す。
  alternative: 「神は」または「主は」を補う。
  rationale: ギリシア語では主語がこの節に明記されず、前の文脈から補われる。日本語では主語の省略が自然なので、神学的な同定を訳文で狭めない。
- issue: ἀΐδιοςの効力
  choice: 永遠の
  alternative: 永久の、絶えることのない
  rationale: 永続性を明瞭に表す標準的な語を採用しつつ、鎖の性質について本文以上の形而上学的説明は加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、終末的な裁きの厳粛さにふさわしい格調を保った。「御使い」より一般読者に分かりやすい「天使」を採用した。暗黙の主語は日本語でも省略し、原文の指示関係を保った。
