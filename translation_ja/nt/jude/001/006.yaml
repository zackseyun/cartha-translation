  terminology: 「天使」「領分」「住まい」「裁き」「永遠の鎖」は明瞭で適切である。「深い暗闇」はζόφοςの濃く陰鬱な闇を自然に伝える。注a・b・cはいずれも対応箇所に適切に付され、代替訳・直訳上の情報も妥当である。
