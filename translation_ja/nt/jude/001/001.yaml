id: JUD.1.1
reference: Jude 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: ja
  text: イエス・キリストのしもべであり、ヤコブの兄弟であるユダから、父なる神にあって愛され[b]、イエス・キリストのために守られている[a]、召された人々へ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・キリストによって守られている」とも訳せる。ギリシア語の与格は、「によって」という作用者、または「のために」という利益・方向を表しうる。
    reason: alternative_reading
  - marker: b
    text: 一部の写本は「父なる神にあって聖別され」とする。
    reason: textual_variant
lexical_decisions:
- source_word: δοῦλος
  choice: しもべ
  rationale: 所有と全面的な服従を含む語だが、日本語の「奴隷」はこの書簡の自己紹介では近代的な強制労働の含意が前面に出やすい。「しもべ」は聖書的な忠誠と従属を自然かつ尊厳ある形で伝える。
- source_word: Χριστοῦ / Χριστῷ
  choice: キリスト
  rationale: Χριστόςは「油を注がれた者」という称号だが、「キリスト」は現代日本語の聖書・一般用法で定着しており、固有名詞化しすぎない文脈上の称号として保持できる。
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: ヤコブの兄弟である
  rationale: δέはここでは強い逆接ではなく、自己紹介の要素を加える軽い接続である。日本語では並列によって自然に表す。
- source_word: ἐν θεῷ πατρὶ
  choice: 父なる神のうちに
  rationale: ἐνの領域・関係を表す語感を保ち、「神によって」と作用者に限定しない。
- source_word: ἠγαπημένοις
  choice: 愛され
  rationale: 完了受動分詞が示す、愛された結果として今もその状態にあることを、簡潔な現代日本語で表す。
- source_word: τετηρημένοις
  choice: 守られている
  rationale: 完了受動分詞の継続的な結果状態を明示する。Ἰησοῦ Χριστῷとの関係は本文で「ために」とし、別解を脚注に示す。
- source_word: κλητοῖς
  choice: 召された人々
  rationale: 受取人を指す実体詞的形容詞として訳し、神による召しの意味を保つ。日本語では文頭寄りに置くより、三つの修飾句の最後に置くことで原文の強調と流れを保つ。
- source_word: Ἰούδας
  choice: ユダ
  rationale: 新約聖書の日本語慣例に従う人名表記。
- source_word: Ἰάκωβος
  choice: ヤコブ
  rationale: 新約聖書の日本語慣例に従う人名表記。
theological_decisions:
- issue: τετηρημένοιςとἸησοῦ Χριστῷの関係
  choice: イエス・キリストのために守られている
  alternative: イエス・キリストによって守られている
  rationale: 与格は利益・方向を表す「ために」と作用者を表す「によって」の双方に理解されうる。本文では前者を採り、真正な統語的・神学的曖昧さを脚注に残す。
- issue: ἠγαπημένοιςの本文異読
  choice: 愛され
  alternative: 聖なるものとされ
  rationale: 提示されたSBLGNTのἠγαπημένοιςを本文とする。一部写本のἡγιασμένοιςは意味のある異読なので脚注に示す。
translation_notes:
  register: 明瞭で現代的かつ書簡冒頭にふさわしい格調を保った。「しもべ」は自然な日本語を優先しつつ従属と忠誠を表す。「父なる神のうちに」は原文の関係的・領域的表現を保持した。脚注記号は該当する受取人句の末尾にまとめて配置した。
