  naturalness: 「彼らは災いだ」は現代日本語では不自然で、災いが彼らに臨むという原文の方向も曖昧になります。「彼らに災いがある。なぜなら、…からである」は明瞭で、預言的な宣告の調子も保ちます。「身を投じた」は自然な現代標準語です。
  terminology: 固有名は「カイン」「バラム」「コラ」で統一し、既存の日本語聖書用法と整合します。「道」「迷い」「反逆」「滅び」は、それぞれ原文の比喩、曖昧さ、旧約への言及、裁きの結末を過度に教義化せずに表します。
