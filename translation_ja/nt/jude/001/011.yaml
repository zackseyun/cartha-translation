id: JUD.1.11
reference: Jude 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: ja
  text: 彼らに災いがある。なぜなら、カインの道を歩み、報酬を求めてバラムの迷いに身を投じ[a]、コラの反逆によって滅びたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「報酬のためにバラムの迷いへと注ぎ出された」。別訳「利益を求めてバラムの迷いへと突っ走った」。
    reason: ἐξεχύθησανは「注ぎ出す」の比喩を用いる難解な表現であり、文脈上は利得のために無謀に身を投じることを表すと理解できる。
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: 彼らは災いだ
  rationale: 預言者的な断罪と裁きの響きを保ち、「ああ、彼らは」のような単なる悲嘆よりも強い警告として表した。
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: カインの道を歩み
  rationale: ὁδόςの生き方・行動様式という比喩と、ἐπορεύθησανの移動のイメージを自然な日本語でともに保った。
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: バラムの迷いへと
  rationale: πλάνηが持つ迷い、誤り、惑わしの幅を不必要に限定せず、ἐξεχύθησανが示す方向性を「へと」で表した。
- source_word: μισθοῦ
  choice: 報酬のために
  rationale: 金銭的・利得目的の動機を明確にしつつ、「賃金」よりもこの文脈に自然な語を選んだ。
- source_word: ἐξεχύθησαν
  choice: 身を注ぎ出し
  rationale: 直訳的な「注ぎ出された」という鮮明な比喩を再帰的に理解できる形で保った。日本語では意味が難しいため、慣用的な別訳を脚注に示した。
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: コラの反逆によって
  rationale: 民数記16章への言及を踏まえ、ἀντιλογίαの反抗・反逆の意味を表した。与格は滅びに至った領域または契機を示し得るため、自然な日本語として「によって」とした。
- source_word: ἀπώλοντο
  choice: 滅びた
  rationale: 完了した破滅を簡潔かつ荘重に表し、受動的な破壊などの様態は付加しなかった。
theological_decisions:
- issue: καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν の圧縮された比喩表現
  choice: 報酬のためにバラムの迷いへと身を注ぎ出し
  alternative: 利益を求めてバラムの迷いへと突っ走り
  rationale: 本文ではἐξεχύθησανの「注ぎ出す」という比喩と、μισθοῦが示す利得目的を保った。意味を完全に慣用化して比喩を消さず、より分かりやすい解釈的訳は脚注に置いた。
- issue: τῇ ἀντιλογίᾳ と ἀπώλοντο の関係
  choice: コラの反逆によって滅びた
  alternative: コラの反逆のうちに滅びた
  rationale: 与格の厳密な機能には幅があるが、日本語で理解可能な因果・契機として表した。コラと同じ出来事で既に滅びたという意味に限定せず、偽教師たちへの確実な裁きを預言的過去で述べる緊張を保つため、単純過去形を用いた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、三つの旧約聖書への言及が連なる荘重な断罪の調子を保った。「身を注ぎ出し」は意図的に鮮明でやや異質な比喩として残し、理解を助ける慣用的別訳を脚注に示した。固有名は日本語聖書で広く通用する「カイン」「バラム」「コラ」とした。
