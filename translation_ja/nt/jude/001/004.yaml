id: JUD.1.4
reference: Jude 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: ja
  text: というのも、ある者たちがひそかに入り込んできたからです。[a] 彼らは、この裁きについて昔から前もって記されていた、神を敬わない者たちです。[b] 彼らは私たちの神の恵みを放縦へと変え[c]、私たちの唯一の主権者であり主であるイエス・メシアを否んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「気づかれないように忍び込んできた」。
    reason: lexical_alternative
  - marker: b
    text: 「この裁きについて昔から前もって記されていた」は、「この裁きを受ける者としてあらかじめ定められていた」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: 「放縦」は、恥を顧みず欲望のままに振る舞うこと。特に性的な不品行を含む場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: ひそかに入り込んでいる
  rationale: 人に気づかれないよう潜入したことと、その結果として現在共同体内にいることを自然な日本語で表した。
- source_word: πάλαι προγεγραμμένοι
  choice: 昔からあらかじめ記されていた
  rationale: πάλαιの時間的な遠さと、προγράφωが持ち得る「前もって書く／記す」という像を保ち、個々人の予定を断定する訳を避けた。
- source_word: κρίμα
  choice: 裁き
  rationale: 判決と有罪宣告の双方を含み得る司法的な広がりを保つ。
- source_word: ἀσεβεῖς
  choice: 神を敬わない者たち
  rationale: 神への不敬を、現代の一般読者に明瞭な表現で示した。
- source_word: χάριτα
  choice: 恵み
  rationale: 神の好意と救いの賜物を指す文脈で定着した、明瞭な訳語。
- source_word: μετατιθέντες εἰς ἀσέλγειαν
  choice: 放縦の口実に変え
  rationale: 単なる変化ではなく、神の恵みを恥知らずな自己放任に悪用する文脈的意味を自然に示す。「口実」は補足的だが、日本語で「恵みを放縦に変える」という不自然さを避ける。
- source_word: μόνον δεσπότην καὶ κύριον
  choice: 唯一の主権者また主
  rationale: δεσπότηςとκύριοςという二つの称号を区別して表し、前者の絶対的権威と後者の標準的な「主」を保持した。
- source_word: Ἰησοῦν Χριστόν
  choice: イエス・メシア
  rationale: Χριστόςを称号として示しつつ、日本語で自然な固有名・称号の形にした。
- source_word: ἀρνούμενοι
  choice: 否んでいます
  rationale: 信仰告白と行動の両面における拒絶・否認を表す標準的な聖書語彙。
theological_decisions:
- issue: προγεγραμμένοι εἰς τοῦτο τὸ κρίμα の意味
  choice: この裁きについて昔から前もって記されていた
  alternative: この有罪判決を受けるようあらかじめ定められていた
  rationale: 原語は以前の聖書的記載・予告とも、事前の指定とも理解し得る。本文では「記されていた」として強い個人予定説を断定せず、脚注で別解を示した。
- issue: μόνον δεσπότην καὶ κύριον の指示対象
  choice: 二つの称号はいずれもイエス・メシアを指す
  alternative: 「主権者」は父なる神を、「主」はイエス・メシアを指す
  rationale: 冠詞を共有する二つの称号にイエス・メシアが同格的に続くため、両称号をイエスに結び付けるのが最も自然な統語的理解である。
- issue: ἀσέλγεια の範囲
  choice: 放縦
  alternative: 好色、みだらな行い
  rationale: 性的な不品行を含み得るが、それだけに限定されない恥知らずな自己放任という広がりを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも」で前節との理由関係を示し、長いギリシア語文は二文に分けて可読性を確保した。「主権者また主」は二つの称号を保持し、「イエス・メシア」はΧριστόςの称号性を表した。
