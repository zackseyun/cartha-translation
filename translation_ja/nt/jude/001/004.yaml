    issue: 「この裁きを受ける者として、昔からあらかじめ記されていた」
    rationale: πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα は、以前にこの裁きについて書かれていたという意味と、この裁きのために前もって指定されていたという意味の両方が議論される。本文の「裁きを受ける者として」は後者へ寄せるため、本文では『この裁きについて前もって記されていた』として、脚注で指定の読みを示すほうが曖昧さを保てる。
  - severity: medium
    issue: 「放縦の口実に変え」
    rationale: ἀσέλγειαν は放縦そのものを指し、μετατιθέντες は恵みを放縦へ変えることを述べる。「口実」は文脈上もっともらしい補足だが、原文にない悪用の手段を明示するため省くべきである。
  - severity: low
    issue: 「昔からあらかじめ」と読点を伴う称号句
    rationale: 前者は冗長であり、後者の『主である、イエス』という読点は日本語として不自然である。意味を変えずに整えられる。
