- from: というのも、ある者たちがひそかに入り込んでいるからです。[a] 彼らは、この裁きを受ける者として、昔からあらかじめ記されていた者たちであり、神を敬わない者たちです。[b] 彼らは、私たちの神の恵みを放縦の口実に変え[c]、私たちの唯一の主権者また主である、イエス・メシアを否んでいます。
  to: というのも、ある者たちがひそかに入り込んできたからです。[a] 彼らは、この裁きについて昔から前もって記されていた、神を敬わない者たちです。[b] 彼らは私たちの神の恵みを放縦へと変え[c]、私たちの唯一の主権者であり主であるイエス・メシアを否んでいます。
