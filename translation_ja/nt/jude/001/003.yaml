revisions:
- from: 愛する皆さん、私たちが共にあずかる救いについて、ぜひ書きたいと思っていましたが、聖なる者たちにただ一度、決定的に伝えられた信仰[a]のために力を尽くして戦うよう、あなたがたに勧める手紙を書く必要があると感じました。[b]
  to: 愛する皆さん。私は、私たちが共にあずかる救いについて、あらゆる熱意をもって書こうとしていましたが、聖なる者たちにひとたび伝えられた信仰[a]のために力を尽くして戦うよう勧める手紙を、あなたがたに書く必要が生じました。[b]
  rationale: 原文のπᾶσαν σπουδὴνの熱意を明確にし、ἅπαξについては本文が確定しない含意を「決定的に」として追加しないよう改めました。γράφεινとγράψαιの反復、および後者に伴う「あなたがたに」は、自然な日本語を優先して本文では「勧める手紙を、あなたがたに書く」とまとめ、注で原文の構造を示しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:44:24Z'
review_pass:
  verdict: revise
  source_fidelity: 「決定的に」はἅπαξの語義として取り得る含意ではあるものの、本文で明示すると単なる「ひとたび／一度」の可能性を狭めます。また、「ぜひ書きたいと思っていました」はπᾶσαν σπουδὴν ποιούμενοςの骨身を惜しまない熱意・努力をやや弱めています。改訂ではこれらをより直接的かつ過度に解釈しない表現にします。
  naturalness: 現行文はおおむね明瞭ですが、「信仰のために力を尽くして戦う」は日本語ではやや硬く、目的・対象が一読で取りにくい箇所です。「信仰のために力を尽くして戦うよう勧める手紙」と整えることで、勧告の内容と手紙を書く目的の関係が自然になります。
  terminology: 「愛する皆さん」「私たちが共にあずかる救い」「信仰」「聖なる者たち」は、現代標準日本語として自然であり、原文の共同体的・牧会的な語調を保っています。「聖なる者たち」は後世の称号としての「聖人」を避ける適切な選択です。
  issues:
