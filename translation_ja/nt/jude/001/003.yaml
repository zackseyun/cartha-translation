id: JUD.1.3
reference: Jude 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: ja
  text: 愛する皆さん。私は、私たちが共にあずかる救いについて、あらゆる熱意をもって書こうとしていましたが、聖なる者たちにひとたび伝えられた信仰[a]のために力を尽くして戦うよう勧める手紙を、あなたがたに書く必要が生じました。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「信仰」は、個人が信じる行為というより、信者たちに伝えられた教えや告白の内容を指すと考えられます。
    reason: alternative_reading
  - marker: b
    text: 直訳的には「……救いについて書こうとしていましたが、あなたがたに、……よう勧めながら書く必要が生じました」。ギリシア語は「書く」を二度用いています。
    reason: previous_rendering
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 愛する皆さん
  rationale: 親愛を込めた複数への呼びかけを、現代日本語で自然かつ牧会的に表した。
- source_word: πᾶσαν σπουδὴν ποιούμενος γράφειν
  choice: ぜひ書きたいと思っていましたが
  rationale: σπουδήの熱意と、文脈上の譲歩的な分詞の働きを自然な日本語で示した。単なる努力よりも執筆への強い意欲を表す。
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: 私たちが共にあずかる救いについて
  rationale: κοινόςの共有性を、曖昧な『共通の救い』より自然に表した。
- source_word: ἀνάγκην ἔσχον γράψαι
  choice: 手紙を書く必要があると感じました
  rationale: 状況から生じた必要を表し、『強いられた』ほど強制性を過度に加えない。
- source_word: παρακαλῶν
  choice: 勧める
  rationale: 真剣な訴えを、平明で品位ある日本語にした。
- source_word: ἐπαγωνίζεσθαι
  choice: 力を尽くして戦う
  rationale: 強意を伴う闘争・奮闘の語感を保ちつつ、物理的暴力に限定しない表現とした。
- source_word: τῇ ... πίστει
  choice: 信仰
  rationale: ここでは信じる行為より、共同体に伝えられた信仰内容を指す可能性が高い。日本語本文では定着した語を用い、注で明確にした。
- source_word: ἅπαξ
  choice: ただ一度、決定的に
  rationale: 一回性だけでなく、この文脈での確定的な力を示す。ただし『永遠に変更不能』など本文以上の体系化は避けた。
- source_word: παραδοθείσῃ
  choice: 伝えられた
  rationale: 教えの伝達という文脈に自然で、受け渡されたという受動形の意味を保つ。
- source_word: τοῖς ἁγίοις
  choice: 聖なる者たち
  rationale: 後世の列聖者に限定され得る『聖人』を避け、神に属する信者たちという語義を保った。
theological_decisions:
- issue: πίστις の意味
  choice: 共同体に委ねられたキリスト教信仰の内容
  alternative: 個々人が神を信頼する行為
  rationale: 『聖なる者たちに伝えられた』という受動的伝達の表現は、信じる行為よりも伝承された教え・告白の総体を示唆する。ただし本文は『信仰』とし、注で説明した。
- issue: ἅπαξ παραδοθείσῃ の力
  choice: ただ一度の決定的な伝達
  alternative: 過去に一度伝えられたという単純な時点表示
  rationale: ἅπαξには文脈上、反復を要しない確定的な一回性があるため、その力を日本語に表した。
- issue: ἐπαγωνίζεσθαι の比喩性
  choice: 信仰を守るための真剣な奮闘
  alternative: 物理的・軍事的な戦い
  rationale: 競技や闘争を背景とする強い動詞だが、文脈は教えをめぐる勧告であり、暴力を命じると限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、親愛を込めた呼びかけと緊迫した勧告の調子を両立させた。『聖人』は後代の限定的連想を招くため避け、『聖なる者たち』とした。原文の γράφειν／γράψαι の反復は日本語本文では不自然になるため一文に整え、注で原文の構造を示した。
