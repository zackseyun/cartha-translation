    rationale: ἅπαξはここで反復しない一回の伝達を強く示し得ますが、「決定的に」を本文に置くと、原語が明示しない最終性・変更不能性まで確定させるおそれがあります。本文は「ひとたび」とし、必要なら注で含意を説明するのが安全です。
  - severity: medium
    issue: πᾶσαν σπουδὴν ποιούμενοςの力が弱いこと
    rationale: 「ぜひ書きたいと思っていました」は願望中心であり、πᾶσαν σπουδήνの熱心な努力・真剣さを十分に表しません。「あらゆる熱意をもって書こうとしていました」とすることで、意欲と真剣な取り組みを保てます。
  - severity: low
    issue: ἐπαγωνίζεσθαιの目的語関係の分かりにくさ
    rationale: 「信仰のために力を尽くして戦う」は不自然ではありませんが、勧告の内容として「信仰のために力を尽くして戦うよう」とし、手紙を書く目的に接続すると読みやすくなります。
