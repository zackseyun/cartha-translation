id: JUD.1.9
reference: Jude 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: ja
  text: しかし、天使長ミカエルは、モーセの体を巡って悪魔と争い、論じ合っていたとき、悪魔に対して、ののしるような断罪をあえて下すことはせず[a]、ただこう言いました。「主があなたを叱責されますように。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ののしるような断罪」に当たるギリシア語は解釈が難しく、「冒涜的な裁き」または「ののしりの訴え」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: この言い回しは、主がサタンを叱責するゼカリヤ書3章2節の言葉を響かせています。
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: 天使長
  rationale: 天使たちの長という称号を、現代日本語で簡潔かつ伝統との連続性を保って表す。
- source_word: διαβόλῳ
  choice: 悪魔
  rationale: ここでは人格的な超自然的敵対者を指す称号として用いられているため、日本語で定着した「悪魔」とする。
- source_word: διακρινόμενος διελέγετο
  choice: 争い、論じ合った
  rationale: 二つの動詞を一つに潰さず、争いの状態と継続的な言葉の応酬の双方を自然な日本語で表す。
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: モーセの体を巡って
  rationale: σῶμαの具体性を保つため「体」とし、死体・遺体と明示して原文以上に限定することを避ける。
- source_word: οὐκ ἐτόλμησεν
  choice: あえて…下さず
  rationale: 行為に踏み切らなかったことを示すτολμάωの含意を、自然で引き締まった表現にする。
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: 相手をののしるような断罪を…下さず
  rationale: 難解な属格表現について、κρίσιςの法廷的・断罪的意味とβλασφημίαの中傷・罵倒の意味を示しつつ、ミカエルが神を冒瀆したという誤解を避ける。別の直訳的理解は脚注に残す。
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: 主があなたを叱責なさるように
  rationale: アオリスト希求法による願望・祈願の力を明示し、ミカエル自身ではなく主の権威に委ねる言葉として表す。
- source_word: κύριος
  choice: 主
  rationale: κύριοςに対する標準的で尊厳ある日本語訳を用いる。
theological_decisions:
- issue: 悪魔に対するミカエルの自制の性質
  choice: ミカエルは自ら侮辱的な断罪を下さず、主による叱責に委ねる。
  alternative: ミカエルは冒瀆に当たる裁きを避けた、または、ののしりの告発そのものを避けた。
  rationale: κρίσιν … βλασφημίαςの統語と意味には幅がある。本文では明白な対比、すなわちミカエルが自ら断罪せず主の権威に訴えたことを示しつつ、詳細な天使論や特定の教理を持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「天使長」「断罪」「叱責」により聖書本文にふさわしい簡潔な威厳を保った。「体」は原文の具体性と曖昧さを保ち、「遺体」と限定しなかった。
