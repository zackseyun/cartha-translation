  naturalness: 「自分自身を養う牧者です」は意味は通じますが、比喩の連鎖の中ではやや唐突です。「自分を養う牧者であり」として前後をつなぐと、現代標準日本語として自然で、原文の分詞構文の連続も表せます。
  terminology: 「愛の食事」は明瞭で、「愛餐」よりも対象方針に合います。「暗礁」はσπιλάδεςの有力な理解を適切に表し、別解は脚注で保持されています。「牧者」はποιμαίνωの羊飼いの比喩を保っています。脚注bの「自分自身を食べさせる」は現代日本語として不自然で、本文と同じく「自分を養う」とするのがよいでしょう。
