id: JUD.1.12
reference: Jude 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: ja
  text: この者たちは、あなたがたの愛の食事に潜む暗礁であり[a]、共に宴をし、恐れもなく自分を養う牧者であり[b][c]、風に流される水のない雲、実を結ばない秋の木、二度死んで根こそぎにされた木です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「暗礁」に当たるギリシア語は、「汚点」または「しみ」と理解することもできます。ここでは、続く自然界の比喩とのつながりから「暗礁」と訳しました。
    reason: alternative_reading
  - marker: b
    text: 「自分を養う牧者」は、「自分を養う者たち」とも訳せます。この訳では牧者の比喩は明示されませんが、自分の利益だけを求める態度を強調します。
    reason: lexical_alternative
  - marker: c
    text: 自分を養い、群れを養わない牧者の比喩については、エゼキエル書34章を参照してください。
    reason: cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: 潜む暗礁
  rationale: 共同の食事の中にある見えにくい危険という鮮明な比喩を保つ。「汚点」という語義の可能性は脚注に残した。
- source_word: ἀγάπαις
  choice: 愛の食事
  rationale: 初期キリスト者の愛に基づく共同の食事を、現代日本語で明瞭に表した。
- source_word: συνευωχούμενοι
  choice: 共に宴をし
  rationale: 同じ宴に加わって食事をするという分詞の共同性を簡潔に示した。
- source_word: ἀφόβως
  choice: 恐れもなく
  rationale: 厚かましさ、無頓着さ、不敬のいずれかに限定せず、原文の幅を保った。
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: 自分自身を養う牧者
  rationale: 「牧する」という比喩と、自分だけを養うという文脈上の非難の両方が日本語で伝わるようにした。
- source_word: νεφέλαι ἄνυδροι
  choice: 水のない雲
  rationale: 与えるものがないという具体的な自然の比喩をそのまま保った。
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: 風に流される
  rationale: 外からの力によって運ばれる受動的な動きを自然な日本語で表した。
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: 実を結ばない秋の木
  rationale: 実が期待される季節にも実のない木という具体的な像を保った。
- source_word: δὶς ἀποθανόντα
  choice: 二度死んで
  rationale: 解釈して弱めず、原文の強烈で謎を含む表現を直訳的に保持した。
- source_word: ἐκριζωθέντα
  choice: 根こそぎにされた
  rationale: 根から引き抜かれ、生命を失った状態を鮮明に表した。
theological_decisions:
- issue: σπιλάδεςが偽教師を何にたとえるか
  choice: 共同の食事に潜む危険な暗礁
  alternative: 愛の食事における汚点、しみ
  rationale: 自然界の鮮明な比喩が連続する文脈には「暗礁」がよく調和する一方、語義上の別解を脚注に明記した。
- issue: ἑαυτοὺς ποιμαίνοντεςの比喩的な力
  choice: 自分自身を養う牧者
  alternative: 自分自身を養い／食べさせ
  rationale: 牧者の比喩とエゼキエル34章との響きを保ちつつ、自己本位な行為が現代日本語でも理解できるようにした。
- issue: δὶς ἀποθανόνταの意味
  choice: 二度死んで
  alternative: 完全に死んで
  rationale: 「二度」が何を指すかを本文で決めつけず、原文の修辞的な緊張と解釈上の余地を維持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。比喩の連鎖が聞き取りやすいよう短い文に分けた。「愛餐」のような教会内専門語を避け、「愛の食事」とした。
