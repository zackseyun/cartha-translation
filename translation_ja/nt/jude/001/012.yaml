    issue: 脚注bの代替訳が不自然
    rationale: 「自分自身を食べさせる」は日本語として不自然です。ποιμαίνωの文脈上の「自分を養う」を示しつつ、牧者の比喩が別の訳し方で弱まることを説明します。
