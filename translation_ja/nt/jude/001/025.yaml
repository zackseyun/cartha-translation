  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: ja
  text: 唯一の神、私たちの救い主に、私たちの主イエス・メシアを通して、栄光、威厳、支配、権威が、あらゆる時代の前にも、今も、あらゆる時代に至るまでもありますように。[a]アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「すべての時代より前にも、今も、すべての時代に至るまでも」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: 唯一の神、私たちの救い主に
  rationale: 与格を頌栄の帰着先として表し、μόνῳによる神の唯一性とσωτῆρι ἡμῶνの救済的称号を明確に保った。
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: 私たちの主イエス・メシアを通して
  rationale: 属格を伴うδιάの媒介の意味を「を通して」で示した。Χριστόςは称号としての意味を伝えるため「メシア」とし、日本語として自然な同格表現にした。
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: 栄光、威厳、支配、権威
  rationale: 四つの語を区別して保持した。κράτοςは行使される力・統治力として「支配」、ἐξουσίαは正当な権能として「権威」とした。
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: すべての時に先立つ昔から
  rationale: 字義的には「すべての時代より前」。創造以前を含む時間的広がりを自然な日本語で示しつつ、「永遠の昔から」と断定してαἰώνの表現を均してしまうことを避けた。
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: 今も、永遠に
  rationale: 現在からあらゆる時代に至る継続を、明瞭で荘重な日本語の頌栄表現として訳した。
theological_decisions:
- issue: 頌栄における媒介句の係り方
  choice: 賛美は唯一の神、私たちの救い主に向けられ、私たちの主イエス・メシアを通してささげられる。
  alternative: 「イエス・メシアを通して」を文全体により緩やかに係らせる理解。
  rationale: 統語上、διὰ Ἰησοῦ Χριστοῦは神に帰される頌栄の媒介を表すのが最も自然であり、神への焦点とイエスの媒介的役割をどちらも保つ。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは単なる固有名の一部ではなく称号として機能しているため、その意味を明示する「メシア」を採用した。
- issue: 頌栄の時制表現
  choice: 「ありますように」で補う
  alternative: 動詞を省略した名詞列のまま訳す。
  rationale: ギリシア語では動詞が省略されている。日本語では願望形を補うことで頌栄として自然になるが、これは神の属性が新たに生じるとの意味ではなく、賛美の帰属を表す。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、頌栄にふさわしい格調を保った。「御」「まします」などの古風な語法は避け、四つの賛美語と三段階の時間表現を保持した。
