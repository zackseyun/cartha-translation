  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: ja
  text: 神の愛のうちに自分自身を保ち[a]、永遠の命に至るために[b]、私たちの主イエス・キリストの憐れみを待ち望みなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の愛」は、神が与える愛とも、神に対する愛とも理解できます。
    reason: alternative_reading
  - marker: b
    text: 「永遠の命に至るために」は、「永遠の命のために」または「永遠の命へ」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: 保ちなさい
  rationale: アオリスト能動命令法二人称複数の直接的な勧告を保ち、「自分自身を」と合わせて、継続してその状態にとどまるよう求める文脈を自然な現代日本語で表す。
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: 神の愛のうちに
  rationale: 属格 θεοῦ をあえて限定せず、神からの愛とも神への愛とも取り得る原文の幅を保つ。
- source_word: προσδεχόμενοι
  choice: 待ち望みつつ
  rationale: 現在分詞が主命令に伴う継続的で期待を伴った姿勢を示すため、「待つ」よりも期待の含意が自然に伝わる表現とした。
- source_word: ἔλεος
  choice: 憐れみ
  rationale: 苦境にある者への慈しみ深い配慮と恩恵を表す、新約聖書の文脈にふさわしい標準的な訳語。
- source_word: κυρίου
  choice: 主
  rationale: 新約聖書における κύριος の称号としての意味を簡潔に保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語で定着した称号を含む固有名表現を用い、Χριστός のメシア称号としての背景を失わない慣用的な形とした。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 永遠の命に至るように
  rationale: εἰς の目標・到達点の方向性を現代日本語で示しつつ、憐れみと待望のどちらに強く結び付くかは脚注で補う。
theological_decisions:
- issue: ἀγάπῃ θεοῦ における属格の意味
  choice: 「神の愛」と訳して曖昧さを保つ
  alternative: 「神があなたがたを愛してくださる愛」または「神を愛する愛」
  rationale: 原文は神を愛の主体と見ることも対象と見ることもでき、文脈だけでは一方に限定できないため。
- issue: εἰς ζωὴν αἰώνιον の係り方と意味
  choice: 永遠の命を目標・到達点として示す
  alternative: 「永遠の命のために」または「永遠の命に至るまで」
  rationale: εἰς は方向・目標・結果を表し得るため、本文では到達の方向性を示し、時間的終点または目的という理解も脚注で提示する。
- issue: Χριστός の称号性
  choice: 日本語で定着した「キリスト」を用いる
  alternative: 「メシア」
  rationale: Χριστός は「油注がれた者」という称号だが、「イエス・キリスト」は現代日本語で称号性を保持する定着表現であり、一般読者にも最も明瞭である。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。主命令を先に置き、現在分詞は「待ち望みつつ」として従属関係を保った。二文目は前文に伴う分詞句として意図的に提示しているが、日本語としての流れを損なわないよう句読点を整えた。
