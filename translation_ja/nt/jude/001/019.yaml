  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: ja
  text: この人たちは、分裂を引き起こす者たち[a]、自然的な人たち[b]、聖霊を持たない者たち[c]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自らを他と分ける者たち」または「分派を作る者たち」。
    reason: lexical_alternative
  - marker: b
    text: 「自然的な人たち」は、「世俗的な人たち」「霊的でない人たち」または「生まれながらの人たち」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「聖霊」は「霊」とも訳せるが、文脈上は聖霊を指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: この人たちは
  rationale: 直前まで述べられてきた者たちを指す指示代名詞の働きを、現代日本語で明確に表す。
- source_word: οἱ ἀποδιορίζοντες
  choice: 分裂を引き起こす者たち
  rationale: 文脈上、共同体を分裂させる活動を表す可能性が高い。自らを分離するという語義上可能な理解は脚注に残す。
- source_word: ψυχικοί
  choice: 生まれつきのままの人たち
  rationale: 神の御霊によらず、人間の自然的な命の次元にとどまる者という対比を表す。「世俗的」「霊的でない」だけでは意味を狭めうるため、別訳を脚注に示す。
- source_word: πνεῦμα
  choice: 御霊
  rationale: ψυχικοίとの対比とユダ書の文脈から、聖霊を指す可能性が最も高い。冠詞のない形ゆえに「霊」という理解の余地は脚注に保持する。
- source_word: μὴ ἔχοντες
  choice: 持たない
  rationale: 否定を伴う分詞を簡潔に訳し、直前の人々の特徴を説明する構造を保つ。
theological_decisions:
- issue: πνεῦμαの指示対象
  choice: 聖霊（本文では「御霊」）
  alternative: 人間の霊、または一般的な意味での霊
  rationale: 直前のψυχικοίとの強い対比は、単に自然的な命に属し、神の御霊を持たない者という理解を支持する。ただし原文は冠詞を欠き、語そのものには広い意味域があるため、別の可能性を脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ψυχικοίを過度に教派的な用語で固定せず、πνεῦμαとの対比が伝わる自然な表現とし、語義上の曖昧さは脚注で保持した。
