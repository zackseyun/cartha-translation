source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: ja
  text: また、ある人々を、火の中から奪い出して救いなさい。[a] ほかの人々には、恐れをもってあわれみを示し、[b] 肉によって汚された肌着さえも憎みつつ、そうしなさい。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「火から救い出しなさい」とも訳せる。この火は、迫る裁き、または深刻な霊的危険を指す可能性がある。
    reason: alternative_reading
  - marker: b
    text: 「恐れ」は、神への畏れを意味するとも、自分も汚されないよう警戒することを意味するとも考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「肉」は、ここでは罪に汚れた人間の性質を指すとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: 救いなさい
  rationale: 命令として訳し、目の前の危険からの救出と救済的な重みの双方を保った。
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: 火の中から奪い出して
  rationale: 分詞が救う方法を示しているため、「奪い出して」とし、強制的で切迫した救出のイメージを保った。
- source_word: ἐλεᾶτε
  choice: あわれみを示しなさい
  rationale: 現代日本語として自然な命令表現であり、相手に向けられる慈悲の行為を明確にした。
- source_word: ἐν φόβῳ
  choice: 恐れをもって
  rationale: 神への畏れとも、自らが汚されないための警戒とも取れる曖昧さを限定せずに残した。
- source_word: μισοῦντες
  choice: 憎みなさい
  rationale: あわれみを示す際にも汚れそのものは拒むという、原文の強い語調を保持した。
- source_word: χιτῶνα
  choice: 肌着
  rationale: 身体に近く着ける衣を指す語であり、単なる「衣」より具体的で、日本語でも比喩の生々しさが伝わる。
- source_word: ἐσπιλωμένον
  choice: 汚された
  rationale: すでに汚れた状態にあることを表す完了受動分詞を簡潔に表現した。
- source_word: σάρξ
  choice: 肉
  rationale: 道徳的腐敗を示唆する文脈であるが、「罪深い性質」と解釈的に言い換えず、原文の身体的な比喩と神学的緊張を保った。
theological_decisions:
- issue: 「火」が指すもの
  choice: 本文では単に「火」とし、比喩の指示対象を特定しない。
  alternative: 終末の裁き、または現在の深刻な霊的危険と明示する。
  rationale: 原文は火のイメージを説明しておらず、裁きと差し迫った霊的危険のどちらにも読めるため。
- issue: 「恐れをもって」の意味
  choice: 意味を限定せず、そのまま訳す。
  alternative: 神への畏れ、または自らも汚されることへの警戒と明示する。
  rationale: いずれも文脈上可能であり、原文の簡潔な表現は一方に確定していないため。
- issue: 「肉」の意味
  choice: 本文では「肉」とする。
  alternative: 「罪深い性質」と解釈して訳す。
  rationale: 道徳的汚れとの関連は明らかだが、「肉」という原語の比喩を保つことで、特定の組織神学的解釈を本文に持ち込まないため。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、命令の切迫感と道徳的な鋭さを保った。「あわれみ」は聖書的な品位を持ちながら一般読者にも理解できる表記とし、「肌着」によって古代の内衣の具体性を自然な日本語で示した。
