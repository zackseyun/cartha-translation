id: JUD.1.17
reference: Jude 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: ja
  text: しかし、愛する者たちよ、あなたがたは私たちの主、メシアであるイエスの使徒たちが前もって語った言葉を思い起こしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: しかし、あなたがたは
  rationale: δέの対照を「しかし」で示し、明示されたὙμεῖςの強調を「あなたがたは」で保った。直前に述べられた者たちから読者へと話題が転じることが明確になる。
- source_word: ἀγαπητοί
  choice: 愛する者たちよ
  rationale: 親愛を込めた複数への呼びかけ。現代日本語として理解しやすく、書簡にふさわしい温かさと品位を保つ。
- source_word: μνήσθητε
  choice: 思い起こしなさい
  rationale: 過去に受けた教えを意識的に想起するよう命じるアオリスト命令形の力を自然に表す。
- source_word: τῶν ῥημάτων
  choice: 言葉
  rationale: ここでは語られた発言・教えを指すため、簡潔で自然な「言葉」とした。
- source_word: τῶν προειρημένων
  choice: 前もって語った
  rationale: 時間的に先に語られたことを表しつつ、「予言した」と限定しない。以前からの使徒的警告と予告の両方を含み得る原文の幅を保つ。
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: 使徒たちが
  rationale: 受動表現を日本語として自然な能動文に組み替え、行為者を明確にした。「使徒」は新約聖書で定着した訳語である。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主…の
  rationale: 使徒たちが誰に属し、誰から遣わされた者であるかを示す属格関係を保った。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語で定着している固有名・称号の形を用いた。「キリスト」はΧριστόςの音写として広く理解され、ここでもメシア的称号を担う。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστοῦの訳し方
  choice: イエス・キリスト
  alternative: メシアであるイエス
  rationale: 日本語では「イエス・キリスト」が標準的で自然な表現であり、「キリスト」も単なる姓ではなく称号として機能し得る。より説明的な「メシアであるイエス」は称号性を明示する一方、原文以上に解釈を表面化させるため本文には採らなかった。
- issue: προειρημένωνが単なる先行発言か予告か
  choice: 前もって語った
  alternative: 予告した
  rationale: 語が持つ時間的先行性を明確にしながら、内容を予言だけに狭めない訳とした。これにより、以前の教えと将来についての警告との間にある含みを保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、使徒的勧告にふさわしい品位ある命令調とした。呼びかけの温かさ、読者を際立たせる対照、既に語られた言葉を想起する命令を明示している。
