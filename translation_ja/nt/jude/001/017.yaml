  terminology: 「使徒」「主」は適切。「キリスト」は日本語で広く定着しているが、この案件の明示されたΧριστόςの方針および英語POBの監査結果に従い、本文では意味を訳出して「メシア」とする。固有名としてのイエスと称号メシアの関係は「メシアであるイエス」として自然に示す。
