id: JUD.1.14
reference: Jude 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: ja
  text: アダムから数えて七代目のエノクも、この者たちについて[a]こう預言しました。「見よ、主はご自分の幾万もの聖なる者たちを伴って来られた[b][c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この者たちに」または「この者たちに対して」とも訳せる。ギリシア語の与格は、預言が向けられた相手、または預言が扱う対象を示し得る。文脈では、不敬虔な侵入者たちを指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「ご自分の幾万もの聖なる者たちと共に」。「幾万」は非常に大きな数の聖なる一団を表す。
    reason: lexical_alternative
  - marker: c
    text: この引用は第一エノク書1章9節と呼応している。
    reason: cross_reference
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: 預言しました
  rationale: προφητεύωの預言者的な発言行為を保ち、単なる未来予告に狭めない。
- source_word: δὲ καὶ
  choice: も
  rationale: δέの穏やかな談話接続とκαίの付加的意味を、日本語で自然な「も」にまとめた。
- source_word: τούτοις
  choice: この者たちについて
  rationale: 与格が示し得る関連・対象の意味を採用した。文脈上は直前まで述べられた不敬虔な者たちを指すが、原文にない「男たち」などは補わない。
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: アダムから数えて七代目
  rationale: 系譜上の位置を、現代日本語で誤解なく自然に表した。
- source_word: Ἑνὼχ
  choice: エノク
  rationale: 日本語聖書で定着している人名表記。
- source_word: λέγων
  choice: こう…しました
  rationale: 引用を導く分詞を、日本語では預言動詞と引用形式に統合した。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言的で荘重な注意喚起の力を保つ。
- source_word: ἦλθεν
  choice: 来られた
  rationale: アオリストの過去形を保持し、預言的過去を未来形へ解釈して置き換えない。主への敬意を自然な日本語の尊敬表現で示した。
- source_word: κύριος
  choice: 主
  rationale: 称号をそのまま訳し、神一般かイエスかという指示対象を本文で限定しない。
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: ご自分の聖なる者たちを幾万も伴って
  rationale: ἐνを随伴の意味に取り、μυριάσινの巨大な数と、ἁγίαιςがその集団を修飾することを自然に表現した。「天使」とは明示せず、原文の範囲にとどめた。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文では単に「主」とする。
  alternative: エノク書の文脈における神、またはユダによるイエスへのキリスト論的適用と明示する。
  rationale: 原文はκύριοςとだけ記し、指示対象を明示していないため、その神学的緊張を保持する。
- issue: エノクの預言と第一エノク書の関係
  choice: 本文ではエノクの預言として訳し、脚注で第一エノク書1:9との対応を示す。
  alternative: 本文中で第一エノク書からの直接引用であると断定する。
  rationale: ユダ自身の表現を保ち、引用資料の正典性や伝承史について本文へ判断を持ち込まない。
- issue: ἦλθενの時間的意味
  choice: 形態に即して「来られた」と過去形で訳す。
  alternative: 預言的過去と解釈し、「来られる」と未来形で訳す。
  rationale: 預言的文脈で未来を確実なものとして過去形で語る可能性はあるが、翻訳ではギリシア語の時制が持つ緊張を残す。
translation_notes:
  register: 明快な現代標準語を用いつつ、預言の荘重さを「見よ」で保持した。「この者たち」「聖なる者たち」として原文の曖昧さを残し、性別や天使という限定を加えていない。脚注記号は対応箇所にすべて配置した。
