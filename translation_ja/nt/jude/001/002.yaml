  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: ja
  text: あわれみと平安と愛が、あなたがたにますます豊かに増し加えられますように[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ますます豊かになりますように」または「満ちあふれますように」。
    reason: πληθυνθείη の「増し加えられる」の比喩を、日本語で自然に表す際の語義上の選択肢を示すため。
lexical_decisions:
- source_word: ἔλεος
  choice: あわれみ
  rationale: 神の慈しみと、苦しむ者への深い心遣いの両面を保つ、聖書的で現代にも通じる表現。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数二人称の与格を明示し、祝福が受け手に向けられていることを自然な日本語で示す。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在だけでなく、神との関係を含む全人的な安らぎを表し得る定着した訳語。
- source_word: ἀγάπη
  choice: 愛
  rationale: 意味を狭めず、現代日本語で明瞭かつ自然な標準訳。
- source_word: πληθυνθείη
  choice: ますます豊かにありますように
  rationale: アオリスト受動態希求法による祝福の願いを「ありますように」で表し、「ますます豊かに」によって増大・充満の比喩を自然な日本語で伝える。
- source_word: καὶ ... καὶ ... καὶ
  choice: と……と……が
  rationale: 日本語の並列表現を用いながら、三つの祝福が一つも省かれず積み重なる原文のリズムを保つ。
theological_decisions:
- issue: 希求法による祝福の表現
  choice: あわれみと平安と愛が、あなたがたにますます豊かにありますように。
  alternative: あわれみと平安と愛が、あなたがたに増し加えられますように。
  rationale: 願いの意味を「ように」で明示しつつ、神が暗黙の行為者であると断定的に補わない。「豊かにあります」は受動態を逐語的に再現しないが、原文の増大という意味を自然に保つ。
translation_notes:
  register: 明瞭で現代的な標準語を用い、書簡冒頭の祝福にふさわしい簡潔で dignified な調子とした。「憐れみ」ではなく読みやすい「あわれみ」と表記し、三項の並列を自然に響かせた。
