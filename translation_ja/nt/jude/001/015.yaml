id: JUD.1.15
reference: Jude 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: ja
  text: すべての者に対して裁きを行い、不敬虔な者たちを皆、彼らが不敬虔に行ったすべての不敬虔な行いについて、また、不敬虔な罪人たちがその方[b]に対して語ったすべての厳しいことば[c]について、有罪であることを明らかにする[a]ためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪を暴く」、または「有罪であることを立証する」とも訳せる。ギリシア語の動詞は悪事を明るみに出すことを表し得るが、ここでは「裁きを行う」と並ぶ司法的な文脈にある。
    reason: lexical_alternative
  - marker: b
    text: 「その方」は、文脈上、前の節で言及された「主」を指す。
    reason: cross_reference
  - marker: c
    text: 直訳では「厳しいことば」。反抗的な、または不遜なことばという意味を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  choice: すべての者に対して裁きを行い
  rationale: ποιεῖν κρίσιν は司法的な裁きを実行することを表す。「裁きを行う」はその動作性を保ち、κατά の対抗的・司法的な向きを「に対して」で示す。
- source_word: ἐλέγξαι
  choice: 罪ありと明らかにする
  rationale: 裁きの文脈で、罪を暴き、その責任を明白にする意味を表す。「責める」だけでは弱く、「有罪とする」では κρίσιν との区別が薄れやすいため、この表現を採った。
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: 不敬虔な者たちを皆
  rationale: 実体詞的な複数表現と πάντας の包括性を明示し、後続する ἀσέβεια、ἀσεβέω、ἀσεβεῖς との語根上の反復も「不敬虔」でできる限り保つ。
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν
  choice: 彼らが不敬虔にも行ったすべての不敬虔な行いについて
  rationale: 原文に重ねられた ἀσεβ- 語群の強調を、多少重複感のある日本語によって意図的に残した。「にも」は行為の仕方が不敬虔であったことを示す。
- source_word: πάντων τῶν σκληρῶν
  choice: すべての暴言
  rationale: σκληρός は直訳すれば「硬い」だが、発言について用いられ、厳しく反抗的・侮蔑的なことばを指す。日本語では「暴言」が簡潔で自然だが、意味の幅を注で示す。
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: その方に逆らって語った
  rationale: κατά の敵対的な意味を「逆らって」で表し、アオリストは完了した発言行為として自然な過去形にした。
- source_word: αὐτοῦ
  choice: その方
  rationale: 原文どおり代名詞相当の表現を保ちつつ、日本語で文脈上の主を指すのに自然で敬意を失わない形とした。
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: 不敬虔な罪人たち
  rationale: 二つの記述語をともに残し、この節を貫く「不敬虔」の反復を前面に出した。
theological_decisions:
- issue: αὐτοῦ（「その方」）が誰を指すか
  choice: 本文では「主」や「神」と明示せず、「その方」とする。
  alternative: 「主に逆らって」または「神に逆らって」
  rationale: 直前の14節では来られる方が「主」とされているため文脈上の指示対象は分かるが、本文のギリシア語は代名詞である。訳文でも明示的な同定を加えず、文脈による理解を保つ。
- issue: ἐλέγξαι の司法的意味
  choice: 「罪ありと明らかにする」とし、罪の暴露と立証の両面を残す。
  alternative: 「有罪と宣告する」または「責める」
  rationale: 前句の「裁きを行う」と並ぶため司法的含意は強いが、この動詞自体を判決宣告だけに限定せず、罪を明るみに出して責任を明白にする幅を保つ。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、終末の裁きにふさわしい荘重さを保った。原文で意図的に反復される ἀσεβ- 語群は、「不敬虔」が続く日本語の重さを許容して保持した。「その方」は指示対象を本文で断定的に言い換えないための表現である。
