id: JUD.1.7
reference: Jude 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: ja
  text: ソドムとゴモラ、およびその周辺の町々も、これらの者たちと同じように[a]、性的な不品行にふけり、別の肉[b]を追い求め、永遠の火の刑罰を受けつつ、警告の実例として示されています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらの者たち」は、前節の御使いたちを指すとも、ここまでに挙げられた反逆と裁きの例を広く指すとも考えられます。
    reason: alternative_reading
  - marker: b
    text: 「別の肉」は直訳的な表現です。「異なる肉」「異質な肉」とも訳せます。何を指すかについて、本文では一つの解釈に限定していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: それと同じように
  rationale: 直前の反逆と裁きの例との比較を明示しつつ、自然な現代日本語とした。
- source_word: Σόδομα καὶ Γόμορρα
  choice: ソドムとゴモラ
  rationale: 日本語聖書で定着した地名表記を用いた。
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: その周辺の町々
  rationale: περὶの地理的な意味を簡潔かつ自然に表した。
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: それと同じように
  rationale: 比較の意味を保ちながら、τούτοιςが六節の御使いたちを指すのか、先行する諸例を広く指すのかは本文で限定しなかった。
- source_word: ἐκπορνεύσασαι
  choice: 淫らな行いにふけり
  rationale: 性的な不道徳を表す強い動詞の意味を、婉曲化せず、現代日本語で理解しやすく表した。
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: 追い求めた
  rationale: 何かの後を追って求めるという慣用的な意味を自然な日本語で表した。
- source_word: σαρκὸς ἑτέρας
  choice: 異なる肉
  rationale: σάρξとἕτεροςを字義に近く訳し、具体的に何を指すかを一つの解釈に狭めなかった。
- source_word: πρόκεινται
  choice: さらされています
  rationale: 人目の前に置かれ、公に示されているという意味を文脈に即して表した。
- source_word: δεῖγμα
  choice: 見せしめ
  rationale: 単なる例ではなく、裁きについての警告となる実例という含意を簡潔に表した。
- source_word: πυρὸς αἰωνίου
  choice: 永遠の火による
  rationale: αἰώνιοςの重みを弱めず、属格を刑罰の手段・性格として自然に表した。
- source_word: δίκην ὑπέχουσαι
  choice: 刑罰を受け
  rationale: 処罰を被るという司法的な慣用句の意味を明瞭に表した。
theological_decisions:
- issue: τούτοιςの指示対象
  choice: 本文では「それ」とし、比較対象を特定しない。
  alternative: 六節の御使いたちを指す、または先行する反逆と裁きの例を広く指す。
  rationale: ギリシア語では比較は明確だが、代名詞の厳密な指示対象には解釈上の余地があるため。
- issue: σαρκὸς ἑτέραςの意味
  choice: 「異なる肉」と直訳的に訳す。
  alternative: 「別の肉」「異質な肉」、または特定の性的行為や人間と天的存在との境界侵犯を明示する解釈訳。
  rationale: 語句自体が具体的対象を限定しておらず、創世記19章および第二神殿期ユダヤ教の背景との関係にも議論があるため、本文では狭く解釈しない。
- issue: πυρὸς αἰωνίουの射程
  choice: 「永遠の火」という表現をそのまま保つ。
  alternative: 「いつまでも続く火」。
  rationale: 裁きの表現を弱めず、同時にこの一節を越えた体系的教理の説明を付加しないため。
- issue: ソドム等と永遠の火との関係
  choice: 町々が刑罰を受けたことと、現在も警告の実例として示されていることを日本語の語順で表す。
  alternative: 「永遠の火の刑罰を受けつつ、例として置かれている」と分詞構造をより形式的に保つ。
  rationale: 原文の現在形πρόκεινταιと現在分詞ὑπέχουσαιの関係を断定的に時制解釈せず、自然な日本語で裁きと例示の双方を保つため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地名は定着形を採用し、性的罪と裁きの表現は婉曲化しない一方、曖昧な指示対象や「異なる肉」の具体的解釈は確定しない。脚注記号は対応箇所に付した。
