  text: And have mercy on those who are doubting,[a]
translation:
  language: ja
  text: 疑っている人たちには、あわれみを示しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「迷っている人たち」、あるいは「異を唱えている人たち」とも訳せる。この文脈で用いられたギリシア語の分詞には、複数の意味合いがあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: （文脈上、命令の連続として表現）
  rationale: 前後の勧告を結ぶ接続詞。日本語では独立した節の冒頭に「また」を置かなくても連続性が自然に伝わるため、明示しない。
- source_word: οὓς μὲν
  choice: 人たちには
  rationale: 複数の対象群のうち最初の一群を導く表現。μένの対照構造は、後続節と組み合わせて「～には」とすることで自然に示した。
- source_word: ἐλεᾶτε
  choice: あわれみを示しなさい
  rationale: ἐλεάωの慈悲や憐れみをもって接するよう求める命令を、明瞭で品位ある現代日本語にした。
- source_word: διακρινομένους
  choice: 疑っている
  rationale: この文脈では、信仰上の疑いや迷いを抱く人を指す可能性が高い。ただし語には「迷っている」「異を唱えている」という含みもあり得るため、脚注に残した。
theological_decisions:
- issue: διακρινομένουςが示す牧会的対象の状態
  choice: 疑っている人たち
  alternative: 迷っている人たち、または異を唱えている人たち
  rationale: 慈悲を求める命令とのつながりから、霊的な疑いを抱く人々という理解を本文に採った。一方、分裂・論争を表し得る原語の幅は確定せず、脚注で保持した。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「憐れみ」より読みやすい「あわれみ」を用い、「あわれみを示す」で命令の能動的な性格を保った。
