id: JUD.1.13
reference: Jude 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: ja
  text: 荒れ狂う海の波――自分たちの恥を泡のように吐き出すもの[a]。さまよう星々――彼らのために、暗黒の闇が永遠に取っておかれている[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの恥辱を泡のように吐き出すもの」または「自分たちの恥ずべき行いを泡のように吐き出すもの」。ギリシア語の「恥」は複数形で、恥辱そのものとも、それをさらけ出す恥ずべき行いとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「最も深い闇」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: 荒れ狂う海の波
  rationale: κύματα（波）、ἄγρια（荒々しい）、θαλάσσης（海の）という鮮明な比喩を、自然で力強い現代日本語にした。
- source_word: ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας
  choice: 自分たちの恥を泡立たせるもの
  rationale: 現在分詞の継続的な動作と、ἑαυτῶνの強調を保った。複数形αἰσχύναςは日本語では自然な集合表現「恥」とし、「恥辱」または「恥ずべき行い」という語義上の幅は脚注で示した。
- source_word: ἀστέρες πλανῆται
  choice: さまよう星々
  rationale: πλανῆταιの「さまよう」という像を保ち、現代天文学上の「惑星」に限定しなかった。
- source_word: ὁ ζόφος τοῦ σκότους
  choice: 暗闇の深い闇
  rationale: ζόφοςとσκότοςが重なる強い暗黒の表現を、理解しやすく荘重な日本語で再現した。
- source_word: εἰς αἰῶνα τετήρηται
  choice: 永遠に取っておかれている
  rationale: εἰς αἰῶναの継続性を「永遠に」で示し、完了受動形τετήρηταιの結果状態を「取っておかれている」で表した。
theological_decisions:
- issue: εἰς αἰῶναが表す裁きの継続期間
  choice: 永遠に
  alternative: いつまでも／世に至るまで
  rationale: この裁きの文脈では終わりのない継続を表すのが最も自然であり、本文以上の教理的説明は加えなかった。
- issue: οἷςの指示対象
  choice: その者たちのために
  alternative: それらのために
  rationale: 文法上は「星々」を受けるが、比喩で指されている人々を明確にしつつ、比喩そのものは保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、海・泡・星・暗闇という連続する比喩の詩的な力を保った。「取っておかれている」は完了受動の結果状態を自然に示す。脚注記号はそれぞれ、意味の幅が問題となる句の直後、および暗闇の表現の直後に置いた。
