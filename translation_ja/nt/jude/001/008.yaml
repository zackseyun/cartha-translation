id: JUD.1.8
reference: Jude 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: ja
  text: しかし、同じように、この者たちも夢に頼って[a]、肉を汚し、権威を退け、栄光ある者たちをののしるのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夢を見ながら」。ギリシア語の分詞は形式的にはこのようにも訳せるが、ここでは彼らが夢を自分たちの行動の根拠としていることを示す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「栄光ある者たち」は、高められた天上の存在、おそらく天使たちを指すと考えられる。ギリシア語では字義的に「栄光」（複数形）。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: それにもかかわらず、同じように
  rationale: μέντοιの逆接的な響きと、ὁμοίωςによる先行例との比較をともに保った。
- source_word: οὗτοι
  choice: この者たち
  rationale: 文脈中の侵入者たちを指す指示語として、性別を補わず自然に表した。
- source_word: ἐνυπνιαζόμενοι
  choice: 夢に頼って
  rationale: 分詞が彼らの行為の根拠またはあり方を示す可能性を自然な日本語で表した。ただし、より形式的な「夢を見ながら」も脚注に残した。
- source_word: σάρκα
  choice: 肉
  rationale: 単なる身体とも特定の神学的概念とも決めず、ギリシア語の比喩的・道徳的含意を保った。
- source_word: μιαίνουσιν
  choice: 汚し
  rationale: 道徳的・宗教的な汚染を表す語として、簡潔で現代的な表現を選んだ。
- source_word: κυριότητα
  choice: 支配
  rationale: 神の主権、天上の権威、より一般的な支配のいずれかに限定せず、κυριότηςの抽象名詞としての幅を保った。
- source_word: ἀθετοῦσιν
  choice: 退け
  rationale: 認めるべきものを否認し、受け入れないという強い意味を簡潔に表した。
- source_word: δόξας
  choice: 栄光ある者たち
  rationale: 字義的な複数形「栄光」を人格的な指示対象として自然に表しつつ、「天使」とまでは特定しなかった。
- source_word: βλασφημοῦσιν
  choice: ののしっています
  rationale: 対象が神に限定されないため「冒瀆する」よりも、悪しざまに言う意味が明確な表現を選んだ。
theological_decisions:
- issue: δόξαςの指示対象
  choice: 高められた栄光ある存在を広く指す表現
  alternative: 天使、天上の威光ある者たち、抽象的な『栄光』
  rationale: 直後の9節は天使的存在を示唆するが、この名詞自体は明示していないため、本文では範囲を狭めず脚注で可能性を示した。
- issue: ἐνυπνιαζόμενοιの機能
  choice: 夢を行動のよりどころとすること
  alternative: 単に夢を見ている、夢を見ながら
  rationale: 分詞が後続する行為の根拠を示す可能性を反映したが、ギリシア語により近い形式的訳も脚注に残して解釈の余地を保った。
- issue: κυριότηταの指示対象
  choice: 特定されない『支配』
  alternative: 神の主権、キリストの主権、天使的権威、一般的な権威
  rationale: 単数抽象名詞の指示対象を本文だけで確定せず、原文の神学的な緊張を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ユダの手紙の厳しい告発調を保った。「この者たち」「肉」「支配」「栄光ある者たち」により、原文の簡潔さと曖昧さを可能な限り維持した。
