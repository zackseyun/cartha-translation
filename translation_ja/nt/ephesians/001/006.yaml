source:
  edition: SBLGNT
  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: ja
  text: それは、愛された方[b]にあって私たちに恵みを施してくださった[a]、その恵みの栄光がほめたたえられるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵みを施してくださった」は、直訳すると「恵みを授けてくださった」または「好意を示してくださった」。原文では「恵み」と動詞が同じ語根です。
    reason: lexical_alternative
  - marker: b
    text: 「愛された方」はキリストを指します。原文は字義的には「愛されている方」です。
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: ほめたたえられるため
  rationale: εἰς はここで目的・結果を示す。日本語では受動表現によって、神の恵みの栄光が賛美の対象となる趣旨を自然に表した。
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: その恵みの栄光
  rationale: 属格の連鎖を保ち、神の恵みが帯びる栄光、または恵みに現れる栄光という原文の幅を残した。
- source_word: ἐχαρίτωσεν
  choice: 豊かに与えてくださった
  rationale: χαριτόω は恵み・好意を授けることを表す。日本語で不自然な「恵んだ」を避けつつ、直前の「恵み」を目的語として受け、神の恩恵的な行為を明瞭にした。
- source_word: ἐν τῷ ἠγαπημένῳ
  choice: 神が愛する方にあって
  rationale: ἐν の領域・結合・媒介を一義的に限定せず、「にあって」で保った。ἠγαπημένῳ は実体詞的な完了受動分詞であり、明示されていない「御子」を本文に補わず、称号的な表現とした。
theological_decisions:
- issue: χάρις と同語根の χαριτόω の関係
  choice: 恵みを……豊かに与えてくださった
  alternative: 私たちを恵まれた者としてくださった／私たちに好意を示してくださった
  rationale: 語根上のつながりを「恵み」を動詞の目的語として受ける構文で示しつつ、χαριτόω が必ずしも量的な「豊かさ」を明示しない点を脚注で補足する。
- issue: τῷ ἠγαπημένῳ のキリスト論的指示
  choice: 神が愛する方
  alternative: 愛されている方／愛する御子
  rationale: 文脈上キリストを指すが、この節自体には「御子」がないため本文で補わない。受動形の字義は脚注に示す。
translation_notes:
  register: 現代標準日本語の、礼拝朗読にも適する端正な文体。「にあって」によりパウロ書簡の神学的含意を狭めず保持した。脚注記号は、それぞれ「与えてくださった」と「愛する方」の直後に置くのがより局所的だが、提示本文では節末に並べても参照可能である。
