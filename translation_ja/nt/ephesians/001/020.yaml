source:
  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: ja
  text: その力を、神はメシア[a]において働かせ、彼を死者の中からよみがえらせ、天上の領域で[b]ご自分の右の座に着かせました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せます。
    reason: alternative_rendering
  - marker: b
    text: 「天上の領域で」は、「天上で」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἐνήργηκεν
  choice: その力を、神は……働かせ
  rationale: 関係代名詞ἣνは前文の女性名詞を受けるため、単独節でもつながりが分かるよう「その力を」と補い、ἐνήργηκενの有効に作用させる意味を「働かせ」で表した。主語「神」は文脈から明示した。
- source_word: ἐν τῷ Χριστῷ
  choice: メシアのうちに
  rationale: Χριστόςの称号性を「メシア」で保ち、ἐνを「のうちに」として、神の力がメシアにおいて働いたという関係を過度に限定しない。
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: 彼を死者の中からよみがえらせ
  rationale: 分詞を主動詞に伴う行為として自然な連用形で訳し、ἐκ νεκρῶνの複数性を「死者の中から」で明確にした。
- source_word: καθίσας ἐν δεξιᾷ αὐτοῦ
  choice: ご自分の右の座に着かせました
  rationale: 使役的な他動詞καθίζωと、権威ある位置を示す定型表現を、自然で荘重な日本語にした。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上で
  rationale: 実体詞的な複数形形容詞が示す天的領域を、現代日本語で簡潔に表した。
theological_decisions:
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号として理解できるため、その語義を明示する。「キリスト」も日本語聖書で定着した音写として脚注に残す。
- issue: ἐν τοῖς ἐπουρανίοιςの範囲
  choice: 天上で
  alternative: 天上の領域で
  rationale: 特定の複数の場所と断定せず、天に属する領域というパウロ的表現を自然に示す。実体詞的複数形の含みは脚注で補う。
- issue: 二つのアオリスト分詞の関係
  choice: 「よみがえらせ、…着かせました」と並列的に訳す
  alternative: 「よみがえらせた時、…着かせました」
  rationale: ἐγείραςとκαθίσαςは神の力が働いた二つの行為を示しうるため、時間関係を必要以上に限定せず、同格的・手段的な連なりを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、復活と高挙の荘重さを保った。「右手」ではなく「右の座」とし、身体部位ではなく神の傍らの権威ある位置を表した。脚注記号は対応箇所の直後に置いた。
