id: EPH.1.22
reference: Ephesians 1:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: ja
  text: また、神は万物をキリストの足の下に従わせ[a]、万物の上に立つかしらとして、キリストを教会にお与えになりました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この表現は詩篇8篇6節を踏まえており、万物が支配者の足の下に置かれるという聖書的なイメージです。
    reason: cross_reference
  - marker: b
    text: または「教会のために」。ギリシア語の与格 τῇ ἐκκλησίᾳ は、受け手だけでなく受益者を表すこともできます。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: 万物
  rationale: 中性複数形が示す包括的・宇宙的な範囲を、簡潔で自然な日本語で表す。
- source_word: ὑπέταξεν
  choice: 従わせ
  rationale: 何かを下位に置く使役的な意味を保ち、神による服従・支配の確立を明確にする。
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: キリストの足の下に
  rationale: 支配と服従を表す比喩、および詩篇8篇の響きを保つ。文脈上の指示対象を日本語で明確にするため「キリスト」とした。
- source_word: αὐτὸν ἔδωκεν
  choice: キリストを…お与えになりました
  rationale: δίδωμιの基本義「与える」を保ち、「任命した」と限定しない。敬意ある現代日本語として神の行為に「お与えになりました」を用いた。
- source_word: κεφαλὴν
  choice: かしらとして
  rationale: 権威と卓越を含む身体比喩を保持する。「指導者」などの説明的訳に狭めない。
- source_word: ὑπὲρ πάντα
  choice: 万物の上に立つ
  rationale: 万物に対する卓越と権威を自然な日本語で示す。
- source_word: τῇ ἐκκλησίᾳ
  choice: 教会に
  rationale: 与える行為の受け手を表す与格として訳しつつ、恩恵の与格「教会のために」の可能性を脚注に残す。ἐκκλησίαはパウロ書簡で定着した「教会」とする。
theological_decisions:
- issue: キリストのかしらとしての地位と、教会および万物との関係
  choice: キリストは万物の上に立つかしらとして教会に与えられた。
  alternative: キリストは教会のために、万物の上に立つかしらとされた。
  rationale: 統語上、κεφαλὴν ὑπὲρ πάνταを一まとまりとしてキリストの普遍的至高性を表し、τῇ ἐκκλησίᾳは受け手または受益者と解し得る。その両義性を本文と脚注で保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。主語と代名詞の指示対象は日本語での理解を助けるため「神」「キリスト」と明示した。「かしら」は比喩を保つため平仮名表記とし、過度に制度的な意味へ限定しない。
