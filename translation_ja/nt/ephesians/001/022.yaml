  source_fidelity: 原文の二つの動詞（ὑπέταξεν／ἔδωκεν）、万物（πάντα）の包括性、「キリストの足の下に」という支配の比喩、ならびに「万物の上に立つかしらとして、教会に与えた」という統語関係を適切に保っています。本文で神とキリストを明示することも、日本語としての指示対象の明確化であり、意味を付加していません。
  naturalness: 「また、神は万物をキリストの足の下に従わせ、万物の上に立つかしらとして、キリストを教会にお与えになりました」は、明瞭で格調を保った現代標準日本語です。「かしら」は身体比喩とパウロ書簡における定着した用語を自然に保っています。
  terminology: 「万物」「教会」「かしら」はいずれも文脈に適合します。「万物の上に立つ」はὑπὲρ πάνταの至高性・支配の含意を自然に表しつつ、過度の教義的説明を加えていません。脚注はτῇ ἐκκλησίᾳの受け手／受益者の両可能性を適切に残しています。
