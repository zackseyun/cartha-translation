id: EPH.1.2
reference: Ephesians 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ja
  text: あなたがたに、私たちの父である神と主イエス・キリスト[a]から、恵みと平安がありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・メシア」とも訳せる。ギリシャ語の「キリスト」は「メシア（油を注がれた者）」という称号だが、ここでは名前の一部のようにも用いられている。
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの挨拶における祝福の意味と神学的な含意を、現代日本語で簡潔に保つ。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数の受け手を明示し、祝福が彼らに与えられることを自然な日本語で表す。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在を超えた、聖書的なシャロームの響きを保つ定訳。
- source_word: ἀπὸ
  choice: から
  rationale: 恵みと平安の源を示す前置詞の意味を直接表す。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 私たちの父である神
  rationale: 属格句を同格的に理解し、原文にない接続詞を加えず、神が『私たちの父』であることを明瞭にする。
- source_word: κυρίου
  choice: 主
  rationale: イエスに対する称号としての κύριος の権威とキリスト論的な重みを保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語で広く定着した自然な表現を採用しつつ、Χριστός が本来『メシア』という称号であり得ることを脚注で示す。
- source_word: verbless blessing formula
  choice: ありますように
  rationale: ギリシャ語の動詞を省いた祝福の挨拶を、日本語で文として自然かつ祈願的に表すために補う。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ における Χριστοῦ の称号性と名前化
  choice: イエス・キリスト
  alternative: イエス・メシア
  rationale: Χριστός は『油注がれた者／メシア』という称号だが、この定型的な名前・称号の連続では名前に近く機能する可能性もある。本文は現代日本語で定着した形を用い、称号としての意味を脚注に残して曖昧さを解消しすぎない。
- issue: 動詞のない原文の祝福句
  choice: 「ありますように」を補う
  alternative: 「恵みと平安を」などの体言止め
  rationale: 原文は動詞を明示しないが、単なる叙述ではなく挨拶を兼ねた祝福である。日本語では祈願形がその発話機能を最も自然に伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、書簡冒頭の祝福にふさわしい端正さを保った。「あなたがた」は複数を明示し、「ありますように」によって原文の祝福的な働きを自然に表した。
