  text: 神はその恵みを、あらゆる知恵と理解をもって、私たちに豊かに注いでくださいました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神はその恵みを、私たちに向けて豊かに注いでくださいました」。
    reason: lexical_alternative
  - marker: b
