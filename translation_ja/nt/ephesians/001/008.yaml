    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: その恵みを
  rationale: 女性単数属格の関係代名詞で、7節の「恵み」を受ける。日本語では先行詞を補って目的語として表すと、文脈とのつながりと他動的な意味が明瞭になる。
- source_word: ἐπερίσσευσεν
  choice: あふれさせてくださいました
  rationale: ここでは神が恵みを豊かに注ぐ使役的・他動的用法。「あふれさせる」は過剰なほどの豊かさという比喩を保ちつつ、現代日本語として自然である。
- source_word: εἰς ἡμᾶς
  choice: 私たちの上に
  rationale: 恵みが受け手へ向けられ、注がれる方向性を表す。「上に」は「あふれさせる」と自然に結びつく。
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: あらゆる知恵と理解をもって
  rationale: ἐνの手段・様態的な響きを「もって」で表しつつ、この句が神の行為を述べるのか、与えられる恵みに伴うものかは注で示す。πάσῃは抽象名詞の包括性を「あらゆる」で表す。
- source_word: σοφίᾳ
  choice: 知恵
  rationale: σοφίαの標準的で透明な訳語。
- source_word: φρονήσει
  choice: 理解
  rationale: 実際的な理解力・洞察を表す語。σοφίαと区別しながら、古風にならない一般的な日本語を選んだ。
theological_decisions:
- issue: 「あらゆる知恵と理解をもって」の係り先
  choice: 本文では神が恵みをあふれさせた仕方として自然に読める語順を採りつつ、注で別の係り方も明示する。
  alternative: 知恵と理解が、信じる者に与えられた恵みに伴う内容であると読む。
  rationale: ギリシア語では、この前置詞句が神の行為の様態を表すのか、信じる者に与えられるものと結びつくのかに構文上の余地があるため、一方を教理的に断定しない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「くださいました」によって神を主語とする前節からの継続を自然に示した。本文中の脚注記号は該当箇所にすべて配置した。
