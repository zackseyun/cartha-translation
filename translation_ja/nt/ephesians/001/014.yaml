revisions:
- from: この方は、私たちが受け継ぐものの手付金であり、神がご自分のものとされたものが完全に贖われることへと導きます。[a] こうして、神の栄光がほめたたえられるのです。
  to: その方は、私たちの受け継ぐものの手付金であり、神がご自分のものとされたものの贖いに向けたものです。それは、神の栄光がほめたたえられるためです。
  rationale: 原文の二つの εἰς 句を「贖いに向けた」「…ためです」として保持し、訳文に加えられていた「完全に」と「導きます」を除きました。これにより、聖霊が将来の相続の手付金であるという比喩、贖いへ向かう関係、そして神の栄光への賛美という目的を、解釈的に固定せずに表します。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:33Z'
review_pass:
  verdict: revise
  source_fidelity: 「完全に」と「導きます」は原文に明示されていない時間的・動作主的な補足です。特に εἰς ἀπολύτρωσιν は聖霊が「導く」ことを述べるのではなく、贖いへ向かう目的・到達点を示します。これらを除き、τῆς περιποιήσεως の指示対象の幅を本文と注で保つ必要があります。
  naturalness: 「この方」は自然ですが、直前の聖霊を受ける関係節として「その方」とするのが滑らかです。「…の贖いに向けたものです」はやや凝縮された表現ながら、原文の並列構造と方向性を保つ明快な現代標準日本語です。
  terminology: 「手付金」は ἀρραβών の先払い・保証の比喩をよく保っています。「贖い」も ἀπολύτρωσις の神学的かつ解放を含む語彙として適切です。περιποίησις は「神がご自分のものとされたもの」として限定せず、注で「神の民」という有力な理解を含めて説明します。
  issues:
  - severity: medium
    issue: 「完全に贖われること」が原文にない時間的限定を加えている。
    rationale: ἀπολύτρωσις 自体は贖いを表しますが、この語だけから「完全に」を明示することはできません。文脈上の将来的完成は訳文に追加せず、必要なら注解で扱うべきです。
  - severity: medium
    issue: 「…ことへと導きます」が聖霊を明示的な動作主にしている。
    rationale: 原文は「手付金である」ことに続けて εἰς ἀπολύτρωσιν（贖いに向けて）を置き、贖いへの目的・方向を示します。「導く」という動詞はありません。
  - severity: low
    issue: 末尾の「こうして」は原文の目的句を因果・結果として狭めうる。
    rationale: εἰς ἔπαινον は「栄光がほめたたえられるため／栄光の賛美へ」という目的・到達点です。
  revised_text: その方は、私たちの受け継ぐものの手付金であり、神がご自分のものとされたものの贖いに向けたものです。それは、神の栄光がほめたたえられるためです。
  revised_footnotes:
  - marker: a
    text: 「神がご自分のものとされたもの」は、「神の民」とも訳せます。原文は、獲得されたもの、または所有となったものを意味します。
    reason: περιποίησις の指示対象には、神の民という理解を含め、獲得・所有されたものという語義上・解釈上の幅があるため。
  revision_rationale: 原文の二つの εἰς 句を「贖いに向けた」「…ためです」として保持し、訳文に加えられていた「完全に」と「導きます」を除きました。これにより、聖霊が将来の相続の手付金であるという比喩、贖いへ向かう関係、そして神の栄光への賛美という目的を、解釈的に固定せずに表します。
