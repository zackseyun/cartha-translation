id: EPH.1.14
reference: Ephesians 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: ja
  text: その方は、私たちの受け継ぐものの手付金であり、神がご自分のものとされたものの贖いに向けたものです。それは、神の栄光がほめたたえられるためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρραβών
  choice: 手付金
  rationale: 将来の全額受領を確実にする先払いという比喩を保ち、「保証」だけに抽象化しないため。
- source_word: κληρονομία
  choice: 受け継ぐもの
  rationale: 「相続財産」より自然な現代日本語で、神から将来受けるものという意味を表すため。
- source_word: ἀπολύτρωσις
  choice: 完全に贖われること
  rationale: 「贖い」を保持しつつ、すでに与えられた聖霊が将来の完成を保証する文脈を「完全に」で示すため。
- source_word: περιποίησις
  choice: 神がご自分のものとされたもの
  rationale: 獲得・所有されたものという語義を保ち、本文ではそれが人々か相続財産かを過度に限定しないため。
- source_word: εἰς
  choice: ことへと導きます／ため
  rationale: 方向・目標を示す二つの句を、日本語でそれぞれ自然に表現したため。
theological_decisions:
- issue: 「所有されたもの」（τῆς περιποιήσεως）の指示対象
  choice: 神がご自分のものとされたもの
  alternative: 神の民／神の所有となるもの
  rationale: 神に属する民を指す理解が有力だが、語句そのものには「所有・獲得されたもの」という幅があるため、本文では曖昧さを残した。
- issue: 聖霊の人格的な指示
  choice: この方
  alternative: これは／この聖霊は
  rationale: 直前の聖霊を受ける関係代名詞を自然に補い、聖霊を非人格的な物のように表現することを避けた。
- issue: 贖いの時間的完成
  choice: 完全に贖われること
  alternative: 贖い
  rationale: 聖霊が将来受け継ぐものの手付金であるという文脈から終末的完成を示すが、贖いが現在には存在しないという意味にはしない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、「手付金」「贖い」という原文の比喩と神学的語彙を保持した。「へと導きます」は εἰς の方向性を表し、単純な目的だけに狭めない。
