revisions:
- from: 定められた時が満ちたときに実行するため、天にあるものも地にあるものも、すべてのものをメシアにあって一つにまとめる[a]、すなわち、この方にあってまとめるためでした。
  to: 定められた時が満ちるときのためのご計画として、メシアにあって、すなわちこの方にあって、天にあるものも地にあるものも、すべてのものを一つにまとめる[a]ことです。
  rationale: οἰκονομίαを「ご計画」と名詞で訳し、時の満ちることに向けた秩序ある取り計らいという基本義を保った。原文の二つの「〜にあって」を、説明を付加せず「メシアにあって、すなわちこの方にあって」として反復・強調を明示した。「一つにまとめる」は主文で統合的な意味を保ち、総括・頭首性に関する論点は脚注に残した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:34Z'
review_pass:
  verdict: revise
  source_fidelity: 現行訳は「定められた時が満ちたとき」とし、καιροίの定められた時という含意を適切に示している。また、天と地の包括性、およびἐν τῷ Χριστῷ／ἐν αὐτῷの反復を訳出しようとしている。しかしοἰκονομίανを「実行する」と動詞化すると、名詞である「管理・取り計らい・秩序ある計画」の意味と、εἰς οἰκονομίανの構文が失われる。「すなわち」は原文にない説明的な同格関係を強め、後半のἐν αὐτῷは「まとめるため」の反復として扱われているため、原文の強調的な再言及をより正確に反映する必要がある。
  naturalness: 「すべてのものを…一つにまとめる、すなわち、この方にあってまとめるためでした」は、同じ動詞の不自然な重複と係り受けの曖昧さがある。「ご計画」としてοἰκονομίαを名詞で表し、二つの前置詞句を「メシアにあって、すなわちこの方にあって」と連続させると、明瞭な現代標準語となる。
  terminology: Χριστόςは称号として「メシア」が適切である。「一つにまとめる」はἀνακεφαλαιώσασθαιの統合的意味を自然に示すが、頭首性・総括の含意は脚注で保持する。「ご計画」はοἰκονομίαの行政・秩序だった取り計らいの含意を完全には尽くさないため、脚注で「取り計らい／管理」の可能性を示す。
  issues:
  - severity: high
    issue: οἰκονομίανが「実行する」と訳されている。
    rationale: 原語は名詞であり、この箇所では時の満ちることに向けた神の管理・取り計らい・秩序ある計画を指す。「実行するため」は語の品詞と構文を変え、その内容を狭めている。
  - severity: medium
    issue: 「すなわち、この方にあってまとめるためでした」が原文の構造を不自然かつ説明的に処理している。
    rationale: ἐν αὐτῷは原文でメシアへの指示を反復して強調する。「すなわち」は明示されない解説を加え、動詞の反復は日本語としても不自然である。
  - severity: low
    issue: 脚注の「メシアという一つの頭」はやや断定的である。
    rationale: ἀνακεφαλαιόωには「一つの頭のもとに集める」という理解の可能性があるが、主文・脚注ともにその含意を可能性として示すのが適切である。
  revised_text: 定められた時が満ちるときのためのご計画として、メシアにあって、すなわちこの方にあって、天にあるものも地にあるものも、すべてのものを一つにまとめる[a]ことです。
  revised_footnotes:
