id: EPH.1.10
reference: Ephesians 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: ja
  text: 定められた時が満ちるときのためのご計画として、メシアにあって、すなわちこの方にあって、天にあるものも地にあるものも、すべてのものを一つにまとめる[a]ことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべてのものをメシアのもとに総括する」「すべてのものをメシアという一つの頭のもとに集める」。ギリシア語の動詞には、「総括する」と「一つの頭のもとにまとめる」の両方の含みがあります。
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: 実行する
  rationale: 神が定めた秩序ある計画の運営・遂行を表す。日本語では周囲の目的表現と合わせて動詞化することで、意味を保ちつつ自然にした。
- source_word: τοῦ πληρώματος τῶν καιρῶν
  choice: 定められた時が満ちたとき
  rationale: πλήρωμαの「満ちること」と、καιροίが含む節目・定められた時の含意を自然な日本語で表した。
- source_word: ἀνακεφαλαιώσασθαι
  choice: 一つにまとめる
  rationale: 「総括する」と「一つの頭のもとに集める」の双方に開かれた表現を選び、頭首性の含意は脚注に残した。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的・宇宙的範囲を保った。
- source_word: ἐν τῷ Χριστῷ
  choice: メシアにあって
  rationale: ここではΧριστόςが称号として機能するため「メシア」とし、ἐνの結合・領域的な含みを「あって」で保持した。
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς
  choice: 天にあるものも地にあるものも
  rationale: 天上と地上の対照および宇宙的範囲を明瞭で自然な日本語にした。
- source_word: ἐν αὐτῷ
  choice: この方にあって
  rationale: メシアを指す代名詞の反復と強調を保持しつつ、現代日本語で指示対象を明確にした。
theological_decisions:
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: 文脈上、固有名のような用法よりも称号としての意味が前面にあるため。
- issue: ἀνακεφαλαιώσασθαιの意味
  choice: すべてのものを一つにまとめる
  alternative: すべてのものをメシアという一つの頭のもとに集める／すべてを総括する
  rationale: 語が持つ総括と頭首のもとへの統合という重なりを一方に限定せず、別の含意を脚注で示した。
- issue: ἐν Χριστῷおよびἐν αὐτῷの関係
  choice: 「メシアにあって」と「この方にあって」をともに残す
  alternative: 後半を省略して一度だけ訳す
  rationale: 原文の反復とメシアを中心とする強調を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文にふさわしい品位を保った。「経綸」など専門的で古風な語は避け、οἰκονομίαは文脈に即して「実行する」と動詞化した。節単独では前文に続く構文であるため、末尾を「ためでした」として目的句であることを示した。
