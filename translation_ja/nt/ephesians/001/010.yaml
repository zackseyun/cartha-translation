    text: 別訳「すべてのものをメシアのもとに総括する」「すべてのものをメシアという一つの頭のもとに集める」。ギリシア語の動詞には、「総括する」と「一つの頭のもとにまとめる」の両方の含みがあります。
    reason: alternative_reading
  - marker: b
    text: 「ご計画」は、定められた時が満ちることに向けた神の取り計らい、管理、または秩序ある व्यवस्थाを指す語。
    reason: lexical_note
  revision_rationale: οἰκονομίαを「ご計画」と名詞で訳し、時の満ちることに向けた秩序ある取り計らいという基本義を保った。原文の二つの「〜にあって」を、説明を付加せず「メシアにあって、すなわちこの方にあって」として反復・強調を明示した。「一つにまとめる」は主文で統合的な意味を保ち、総括・頭首性に関する論点は脚注に残した。
