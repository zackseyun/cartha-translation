id: EPH.1.5
reference: Ephesians 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: ja
  text: 神は、みこころのよしとされるところに従って、イエス・メシアを通して、私たちを、ご自分のもとへ[b]子として迎え入れるよう[a]、あらかじめ定められました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子として迎え入れる」に当たるギリシア語は、「息子」の身分に置くことを表し、家族に迎え入れられ、相続人となる法的な身分を含みます。別訳「養子とするために」。
    reason: lexical_alternative
  - marker: b
    text: 「ご自分のもとへ」は、「ご自分のために」とも訳せます。ギリシア語は、神へ向かう方向、または神ご自身のためという目的を表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: あらかじめ定めてくださいました
  rationale: προορίζωの「前もって定める」という時間的・意志的な意味を保ちつつ、日本語として自然に表現した。分詞は、長いギリシア語文の統語関係を踏まえ、独立した述語として訳した。
- source_word: εἰς υἱοθεσίαν
  choice: 子として迎えるために
  rationale: υἱοθεσίαは直訳的には「息子としての身分を与えること」を指し、家族への受け入れと法的身分を含む。本文では自然な日本語を優先し、その性別を伴う語形成と相続人としての含意は注で示した。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを通して
  rationale: 属格を伴うδιάの手段・媒介を「通して」で表し、Χριστόςは称号として「メシア」と訳した。
- source_word: εἰς αὐτόν
  choice: ご自分のもとへ
  rationale: 神を目標点とする方向性を表した。εἰςは目的を表して「ご自分のために」とも解し得るため、その曖昧さを注記した。
- source_word: κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ
  choice: みこころの喜びに従い
  rationale: κατάの「〜に従って」と、εὐδοκίαの好意・喜ばしい意向を簡潔に表した。「みこころ」はθέλημαを自然かつ尊厳ある宗教的日本語で示す。
theological_decisions:
- issue: προορίσαςの教理的に争われる意味
  choice: あらかじめ定めて
  alternative: 前もって決めて
  rationale: 原語が明示する事前決定の意味を弱めず、予定に関する特定の体系的説明までは本文に持ち込まない。
- issue: υἱοθεσίαの性別および法的身分の含意
  choice: 子として迎える
  alternative: 養子にする／息子の身分を授ける
  rationale: 現代日本語として理解しやすくしながら、原語の「息子としての身分」と相続上の含意を脚注で保持した。適用対象を男性だけに限定する表現にはしなかった。
- issue: εἰς αὐτόνの方向・目的の曖昧さ
  choice: ご自分のもとへ
  alternative: ご自分のために
  rationale: 方向を第一義として本文に採りつつ、目的を表す可能性も脚注に残した。
- issue: Χριστοῦの称号性
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςを単なる固有名の一部としてではなく称号として意味翻訳した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「みこころ」は一般読者にも通じる定着した語として用い、「予定する」の専門用語化を避けて「あらかじめ定める」とした。節は前後と一続きの長文だが、単独提示でも理解できる日本語文に整えた。
