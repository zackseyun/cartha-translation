id: EPH.1.13
reference: Ephesians 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: ja
  text: この方にあって[a]、あなたがたも、真理のことば、すなわち、あなたがたの救いの良い知らせ[b]を聞き、この方にあって、信じた後、約束の聖霊[c]をもって証印を押されました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この方において」。
    reason: lexical_alternative
  - marker: b
    text: または「あなたがたの救いの福音」。
    reason: lexical_alternative
  - marker: c
    text: または「約束されていた聖霊」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: この方にあって
  rationale: 直前のキリストを指す関係表現であり、パウロに特徴的なキリストとの結びつきを保つ。「この方において」より自然で、単なる「この方を」へ狭めない。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: 前節までの「私たち」に加えて、読者も含まれるという加算の強調を保持する。
- source_word: ἀκούσαντες
  choice: 聞き
  rationale: アオリスト分詞を主動詞に先立つ出来事として自然に表しつつ、厳密な救済順序を必要以上に規定しない。
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: 真理のことば
  rationale: λόγος の「ことば／知らせ」の幅を保ち、パウロ書簡の表現との響きも残す。
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: あなたがたの救いの良い知らせ
  rationale: εὐαγγέλιον を一般読者に明瞭な「良い知らせ」とし、その内容または結果が読者の救いであるという属格表現を保つ。
- source_word: ἐν ᾧ καὶ πιστεύσαντες
  choice: この方にあって信じたとき
  rationale: 二度目の ἐν ᾧ を省略せず、キリストとの結びつきという場所的・関係的な含みを保つ。πιστεύσαντες は主動詞との時間的関係を自然な日本語で示す。
- source_word: ἐσφραγίσθητε
  choice: 証印を押されました
  rationale: 封印、所有、真正性の確認を含む比喩を、現代日本語で理解可能な受動表現として示す。
- source_word: τῷ πνεύματι
  choice: 聖霊によって
  rationale: 与格を手段として自然に表すが、聖霊が証印そのものであるという連合的な含みも文脈上排除しない。
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: 約束の聖霊
  rationale: 圧縮されたギリシア語の属格を形式的に保持し、神が約束された聖霊という理解を可能にする。
theological_decisions:
- issue: 聞くこと、信じること、証印を押されることの関係
  choice: 「聞き……信じたとき……証印を押されました」とし、聞くことを先行させ、信仰と証印の時間的な密接さを示す。
  alternative: 「聞いた後、信じた後に」として、両分詞の先行性をより強く表す。
  rationale: 先行するアオリスト分詞は主動詞に先立つ、またはそれと密接に伴う行為を表し得る。日本語では自然さを保ちながら、聖霊受領の厳密な時間順序について教派的な結論を付加しない。
- issue: 「約束の聖霊」の意味
  choice: 原文の属格構造を残して「約束の聖霊」とする。
  alternative: 「約束されていた聖霊」と明示する。
  rationale: τῆς ἐπαγγελίας は、約束された聖霊、約束に関わる聖霊などの含みを持つ圧縮表現であるため、本文では曖昧さを保ち、説明的な読みを脚注に置く。
- issue: 二度目の ἐν ᾧ の係り先
  choice: 「この方にあって信じた」と訳し、キリストにある領域・関係の中での信仰として表す。
  alternative: 「この方を信じた」とし、信仰の対象を明示する。
  rationale: 原文の ἐν は単純な目的格ではなく、キリストとの結合を示す可能性があるため、その神学的緊張を維持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「この方」は直前のキリストを丁重に指し、「にあって」によって原文の関係的・場所的表現を保持した。「証印」は日常語よりやや文語的だが、聖書的比喩の精度を優先し、「押されました」を添えて理解しやすくした。
