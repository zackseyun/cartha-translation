id: EPH.1.3
reference: Ephesians 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: ja
  text: 私たちの主イエス・メシア[c]の神であり、父である方が、ほめたたえられますように。この方は、メシアにあって、天上の領域[b]で、あらゆる霊的な祝福[a]を私たちに与えてくださいました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊によるあらゆる祝福」とも訳せる。ギリシア語の形容詞は、広く「霊的な」を意味することも、「霊に属する」を意味することもある。
    reason: lexical_alternative
  - marker: b
    text: 「天上の場所で」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 伝統的には「イエス・キリスト」および「キリストにあって」。ギリシア語の称号 Χριστός は、ここではその意味を保つため「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: ほめたたえられますように
  rationale: 神に向けた頌栄的な賛美を表す述語形容詞。現代日本語で自然かつ荘重な祝祷・賛美の形にした。
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 神また父
  rationale: 一つの冠詞のもとに並ぶ二つの名詞を保ち、神であり父であるという関係的な表現を崩さないようにした。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριοςの称号としての力を「主」で保持した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Ἰησοῦは固有名として音写し、Χριστόςは称号の意味を明示する「メシア」とした。日本語では中黒で一続きの呼称として自然に示した。
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: 私たちに与えてくださいました
  rationale: 直訳的な「私たちを祝福した」よりも、後続する「祝福」を目的語として自然に受ける日本語にし、神が祝福を授けたという意味を明確にした。敬意を表す補助動詞を用いた。
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: あらゆる霊的な祝福を
  rationale: πάσῃの包括性とπνευματικῇの意味の幅を保った。「霊的な」は、広く非物質的・霊的という意味にも、御霊に属するという意味にも読める。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上の領域で
  rationale: エフェソ書に特徴的な複数中性形の表現を、単なる個別の「場所」に限定せず、天に属する領域・圏という意味が伝わるように訳した。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: パウロに特徴的な結合・所属・関係を表す簡潔な句を、解釈しすぎず伝統的で理解可能な「にあって」で保持した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: 「イエス・メシア」および「メシアにあって」
  alternative: 「イエス・キリスト」および「キリストにあって」
  rationale: この箇所では称号としての意味がなお認められるため、「油注がれた者」という背景を持つ「メシア」とした。日本語で定着した伝統訳は脚注に示した。
- issue: πνευματικῇの意味
  choice: 霊的な
  alternative: 御霊による／御霊に属する
  rationale: この形容詞は霊的性質を広く指すことも、神の霊との関係を指すこともできる。本文では意味を狭めず、御霊を指す可能性を脚注に残した。
- issue: ἐν Χριστῷの関係性
  choice: メシアにあって
  alternative: メシアとの結びつきによって／メシアのうちに
  rationale: 手段、領域、結合という含みを一つに決めず、パウロの簡潔な表現が持つ神学的な厚みを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、頌栄にふさわしい荘重さを保った。ギリシア語では一続きの文だが、日本語で修飾関係を明確にするため二文に分けた。「にあって」は聖書語として一定の馴染みがあり、ἐν Χριστῷの多義性を過度に解消しないため採用した。
