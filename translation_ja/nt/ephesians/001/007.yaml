  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: ja
  text: 私たちはこの方にあって[a]、その血による贖い、過ち[b]の赦しを、神の恵みの豊かさに応じて得ています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「この方のうちに」。
    reason: lexical_alternative
  - marker: b
    text: 「違反」「背き」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: この方にあって
  rationale: 関係代名詞の先行詞は前節の「愛する方」。日本語では「この方にあって」とすることで、キリストとの結びつきを表すἐνの含意を保ちつつ、自然につなげた。
- source_word: ἔχομεν
  choice: 私たちは…得ています
  rationale: 現在形が示す、今すでに与えられている現実を明瞭な現代日本語で表した。「持っています」より、贖いと赦しについて自然である。
- source_word: ἀπολύτρωσιν
  choice: 贖い
  rationale: 代価を伴う解放という語の重みと、パウロ書簡における神学的用法を保持する。「解放」だけでは代価の含意が弱くなる。
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: その血による
  rationale: 属格を伴うδιάが表す手段を「による」で示し、「血」という犠牲および契約の具体的な表象を言い換えずに残した。
- source_word: ἄφεσιν
  choice: 赦し
  rationale: ここでは背きが免じられることを指すため、現代日本語として明快で聖書的な「赦し」を選んだ。
- source_word: παραπτωμάτων
  choice: 背き
  rationale: 単なる失敗ではなく、神に対する道徳的・関係的な過ちを表せる。「違反」も可能だが、法律用語的な響きが強い。
- source_word: κατὰ τὸ πλοῦτος
  choice: 豊かさに応じた
  rationale: κατάがここで表す基準・尺度を「に応じた」で示し、恵みが豊かさに見合って与えられるという意味を保った。
- source_word: χάριτος αὐτοῦ
  choice: 神の恵み
  rationale: αὐτοῦは文脈上、恵みを与えた神を指す。日本語で曖昧な代名詞を重ねるより、文脈上の指示対象を明示して自然にした。
theological_decisions:
- issue: 「贖い」と「背きの赦し」の関係
  choice: 二つの名詞句を読点で並べ、同格として読める原文の形を保持した。
  alternative: 「贖い、すなわち背きの赦し」と明示する。
  rationale: 後者は前者を説明する同格と解するのが自然だが、「すなわち」を補うと説明関係を原文以上に固定するため、明示的な補語を加えなかった。
- issue: 「その血による」という贖罪表現
  choice: 血という具体的表現をそのまま保持した。
  alternative: 「その死による」または「その犠牲の死による」とする。
  rationale: 原文は明示的に「血」と述べており、これを「死」に置き換えると犠牲・契約に関わる表象を解釈的に平板化するため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「贖い」「赦し」「恵み」など本文の神学的な中核語は格調と相互参照性を保つ語で訳した。長いギリシア語文の一部であることを踏まえつつ、この節単独でも理解しやすいよう二文に分けた。
