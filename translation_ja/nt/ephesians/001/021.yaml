id: EPH.1.21
reference: Ephesians 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: ja
  text: あらゆる支配、権威、力、主権[a]、また、呼ばれるあらゆる名[b]をはるかに超えて高く置かれ、この時代においてだけでなく、来るべき時代においてもそうされたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての君主権、権威、力、主権」。これらのギリシア語は、宇宙的・霊的な勢力を含む、権威の位階や領域を指すことがあります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「与えられるあらゆる称号」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: よりもはるかに高く
  rationale: 位置の高さだけでなく、卓越と優越を表す語の強意を自然な日本語で示す。前節から続く構文にもつながる。
- source_word: πάσης ἀρχῆς
  choice: あらゆる支配
  rationale: ここでのἀρχήは支配する権力・位階を指し得るため、存在者の種類を限定せず、抽象的な権威領域として訳した。
- source_word: ἐξουσίας
  choice: 権威
  rationale: 正当性や行使権を伴う権威を表し、δύναμιςの「力」と区別できる標準的な訳語。
- source_word: δυνάμεως
  choice: 力
  rationale: 能力・勢力を表す一般的で明瞭な訳語であり、「権威」との語義上の違いも保つ。
- source_word: κυριότητος
  choice: 主権
  rationale: 支配権や主としての権能を表す。神への称号「主」と直結させず、権威の類型として読める表現を選んだ。
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: 呼ばれるあらゆる名
  rationale: 「名」と同根の動詞を用いた原文の反復をできるだけ保ち、名、称号、地位のいずれにも限定しない。
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: この時代において
  rationale: αἰώνの時間的意味を保ち、κόσμοςに相当する「世界」と混同しない。
- source_word: ἐν τῷ μέλλοντι
  choice: 来るべき時代において
  rationale: 前句のαἰώνが省略されていることを日本語では補い、現在の時代との対照を明確にした。
theological_decisions:
- issue: ἀρχή、ἐξουσία、δύναμις、κυριότηςが指す存在の性質
  choice: 人間的・霊的存在のいずれかに限定せず、支配や権威の広い類型として訳す。
  alternative: 宇宙的諸勢力、天使的位階、または人間の統治者と明示する。
  rationale: 文脈上は霊的・宇宙的勢力を含む可能性が高いが、原文自体はその存在論的性質を明示していないため、解釈を本文に持ち込まない。
- issue: 「呼ばれるあらゆる名」の範囲
  choice: あらゆる名・称号・地位を包括し得る表現を維持する。
  alternative: 「与えられるあらゆる称号」と限定して訳す。
  rationale: ὄνομαは称号を指し得るものの、原文の広い修辞的表現を狭めないため。
translation_notes:
  register: 明瞭で現代的ながら荘重さを保つ文体。原文は前節の文法構造に続くが、節単独でも理解できるよう、末尾の「そうなのです」で前述のキリストの高い地位を受けた。権威を表す四語は可能な限り区別しつつ、特定の天使論的体系には固定していない。
