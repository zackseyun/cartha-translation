  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: ja
  text: それは、メシアに以前から望みを置いていた私たちが、その方の栄光をほめたたえるための者となるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアに最初に望みを置いた私たちが」。
    reason: προηλπικόταςは、以前から望んでいたことだけでなく、最初に望んだ一群を指すとも解釈できるため。
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: 〜者となるためです
  rationale: 前置詞εἰςと冠詞付き不定詞が表す目的・結果を、自然な現代日本語で示した。単なる存在ではなく、後続のεἰς ἔπαινονとの関係を明確にするため「者となる」とした。
- source_word: ἡμᾶς
  choice: 私たちが
  rationale: ギリシア語では不定詞の意味上の主語として対格だが、日本語では従属節の主語として自然に表した。
- source_word: εἰς ἔπαινον δόξης αὐτοῦ
  choice: その方の栄光をほめたたえる
  rationale: 直訳的な「その方の栄光の賛美のため」を避けつつ、ἔπαινοςとδόξαの双方を保った。「その方」は文脈上の指示対象を維持し、この節だけで固有名を補わない。
- source_word: τοὺς προηλπικότας
  choice: 以前から望みを置いていた
  rationale: 完了分詞と接頭辞προ-が示す先行性、およびその望みの継続的な関わりを表す。「最初に望んだ」という集団間の順序までは本文で断定せず、別訳を脚注に残した。
- source_word: ἐν τῷ Χριστῷ
  choice: メシアに
  rationale: Χριστόςを称号として訳し、希望の対象・基盤を表すἐνを日本語として自然な「〜に望みを置く」に組み込んだ。
theological_decisions:
- issue: προηλπικόταςが単に以前から望んでいたことを指すのか、最初に望んだ一群を特定するのか
  choice: 本文では「以前から望みを置いていた」と慎重に訳す
  alternative: 「メシアに最初に望みを置いた」
  rationale: προ-は時間的先行を示すが、それが救済史上の最初の集団、たとえばユダヤ人信者を明示するかは議論があるため、本文では限定しすぎず、強い解釈を脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら礼拝的な重みを保つ文体。「栄光」「ほめたたえる」「メシア」などの主要な神学語を保持し、節の目的構文が自然に伝わるよう整えた。
