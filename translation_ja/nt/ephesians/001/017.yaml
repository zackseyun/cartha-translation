id: EPH.1.17
reference: Ephesians 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: ja
  text: どうか、私たちの主イエス・メシアの神、栄光の父が、あなたがたに、ご自身を知ることにおいて知恵と啓示の霊[a]を与えてくださいますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」は、神から与えられる知恵と啓示に関わる霊的な態度を指すとも、聖霊を指すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα ... δώῃ
  choice: どうか…与えてくださいますように
  rationale: 前節から続く祈りの内容・目的を、日本語として自然な祈願表現で示す。
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・メシアの神
  rationale: 属格関係を保ち、Χριστόςを称号として「メシア」と訳した。
- source_word: ὁ πατὴρ τῆς δόξης
  choice: 栄光の父
  rationale: 属格表現を直訳に近い形で残し、「栄光に満ちた父」と限定的に解釈しない。
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: 知恵と啓示の霊
  rationale: πνεῦμαが人に与えられる霊的態度を指すか、聖霊を指すかという曖昧さを、日本語の「霊」で保つ。
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: ご自身を深く知るための
  rationale: ἐπίγνωσιςの十分な認識という含みを「深く知る」で表し、ἐνを文脈上の目的・領域として自然な日本語にした。αὐτοῦの指示対象は直近の「父なる神」と理解した。
theological_decisions:
- issue: πνεῦμαが聖霊を指すか、神から与えられる霊・心のあり方を指すか
  choice: 「霊」とし、本文では明示的に「聖霊」としない
  alternative: 「知恵と啓示を与える御霊」または「知恵と啓示の心」
  rationale: 無冠詞のπνεῦμαは両方に理解できるため、原文の神学的な曖昧さを保持する。
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスに付された称号としての意味が明瞭であり、語義を現代の読者に伝える。
- issue: ὁ πατὴρ τῆς δόξηςの属格
  choice: 栄光の父
  alternative: 栄光に満ちた父
  rationale: 原文の属格が持つ幅を保ち、性質を表す属格だけに狭めない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、祈りとしての荘重さを保った。「イエス・メシア」は称号性を示すため中黒で結んだ。
