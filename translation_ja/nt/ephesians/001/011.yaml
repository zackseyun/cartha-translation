id: EPH.1.11
reference: Ephesians 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: ja
  text: この方にあって、私たちもまた神の相続分とされました[a]。私たちは、すべてのことを、ご自分の意志に基づくご計画に従って実現される方の目的に従い、あらかじめ定められていたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちもまた相続分を受けました」。ギリシア語の動詞は、相続分を受けることとも、神に属する相続分とされることとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: この方に結ばれて
  rationale: 関係代名詞が直前のキリストを指すことを保ちつつ、ἐνの結びつきの意味を現代日本語で自然に表した。
- source_word: ἐκληρώθημεν
  choice: 神の相続分とされました
  rationale: 受動形と旧約聖書に見られる神の民を神の相続分とする背景を踏まえた訳。動詞には『相続分を受けた』という解釈も可能なので脚注に残した。
- source_word: προορισθέντες
  choice: あらかじめ定められていた
  rationale: 事前の決定という語義を明確にしながら、特定の予定論体系を訳文に持ち込まない表現とした。
- source_word: κατὰ πρόθεσιν
  choice: 目的により
  rationale: πρόθεσιςが表す意図的な目的・計画を簡潔に表現した。
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: すべてのことを実現される方
  rationale: 神が能動的に働いて成し遂げるという意味と、τὰ πάνταの包括的な範囲を保った。
- source_word: κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ
  choice: ご自分の意志による決定に従って
  rationale: βουλήの熟慮された決定という含みと、θέλημαが神ご自身の意志であることを、自然な日本語で表した。
theological_decisions:
- issue: ἐκληρώθημενの意味
  choice: 信じる者たちは神の相続分、すなわち神に属するものとされた
  alternative: 信じる者たちは相続分を受けた
  rationale: 受動形のκληρόωは、相続分として割り当てられる意味にも、相続分を得る意味にも理解できる。文脈と旧約的背景から前者を本文に採ったが、真正な曖昧さを保つため後者を脚注に示した。
- issue: προορισθέντεςと神の働きの範囲
  choice: 事前の決定と『すべてのこと』という包括的表現をそのまま保つ
  alternative: 救いに関する事柄だけに限定して言い換える
  rationale: 本文自体は範囲を限定していないため、特定の神学体系に沿った限定や説明を加えなかった。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。『この方に結ばれて』により、直前のキリストへの言及とキリストとの結びつきを自然に示した。神学的な専門語を避けつつ、原文の因果・修飾関係と解釈上の緊張を保持した。
