- from: この方に結ばれて、私たちもまた神の相続分とされました[a]。私たちは、ご自分の意志による決定に従ってすべてのことを実現される方の目的により、あらかじめ定められていたのです。
  to: この方にあって、私たちもまた神の相続分とされました[a]。私たちは、すべてのことを、ご自分の意志に基づくご計画に従って実現される方の目的に従い、あらかじめ定められていたのです。
