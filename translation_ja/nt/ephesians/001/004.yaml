id: EPH.1.4
reference: Ephesians 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: ja
  text: それは、神が世界の基が据えられる前から、キリストにあって私たちを選び、私たちが愛のうちに[a]御前で聖なる、傷のない者[b]となるようにされたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「愛のうちに」は次節に結びつけ、「愛のうちに、神は私たちをあらかじめ定め……」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 「傷のない」は「非の打ちどころのない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: （前節から続く文として表現）
  rationale: 前節の祝福の根拠・展開を示す接続語。単独節として不自然な「ちょうど〜ように」は避け、文脈上の連続性を保つ。
- source_word: ἐξελέξατο
  choice: 選び
  rationale: 神の選びを明確に表しつつ、後代の教派的な術語を過度に持ち込まない。
- source_word: ἐν αὐτῷ
  choice: キリストにあって
  rationale: 代名詞の指示対象を文脈から明示し、パウロ特有の結合・領域を示す簡潔な表現を保つ。
- source_word: πρὸ καταβολῆς κόσμου
  choice: 世界が造られる前から
  rationale: 直訳的な「世界の基が据えられる前」より自然で明瞭に、創造以前という時間的意味を伝える。
- source_word: εἶναι ἡμᾶς
  choice: 私たちを…者とすることを
  rationale: 選びの目的を示す不定詞句として自然な日本語にする。「望まれました」は原文にない意味を補うため本文では避けるべきだが、構文完成のため採用した。
- source_word: ἁγίους
  choice: 聖なる
  rationale: 神への帰属と倫理的含意の双方を保つ標準的な訳語。
- source_word: ἀμώμους
  choice: 傷のない
  rationale: 道徳的な非難のなさと、犠牲に用いるものの無傷性という背景の両方を比較的よく保つ。
- source_word: κατενώπιον αὐτοῦ
  choice: 御前で
  rationale: 神の臨在と神に対するあり方を、簡潔で品位ある日本語で示す。
- source_word: ἐν ἀγάπῃ
  choice: 愛のうちに
  rationale: 原文末尾の位置を保ち、前節にかかる可能性と次節にかかる可能性を脚注で示す。
theological_decisions:
- issue: ἐξελέξατοを予定論上の術語として訳すか
  choice: 選び
  alternative: 選定し／選び定め
  rationale: 原文が明言する神の選びは保ちつつ、特定の教派体系を訳語だけで確定しない。
- issue: ἐν ἀγάπῃの統語的係り先
  choice: 第4節末に置き、前の句に結びつける
  alternative: 次節冒頭の「愛によって、あらかじめ定め」と結びつける
  rationale: 原文には真の統語的曖昧さがあるため、本文では語順を保ち、別解を脚注に記す。
- issue: 選びの目的を表す εἶναι の解釈
  choice: …者とすることを
  alternative: …者となるために
  rationale: 目的・結果の幅を完全には限定せず、神の選びと聖性との関係を自然な日本語で表す。
translation_notes:
  register: 現代標準日本語。礼拝朗読にも耐える品位を保ちながら、一般読者に明瞭な表現を優先した。原文は前節から続く長文の一部であるため、接続関係は文脈依存。
