  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: ja
  text: 神は、ご自分の御心の奥義を私たちに知らせてくださいました。それは、彼において定めておられた、ご自分がよしとされることに従ってのことです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσας
  choice: 知らせてくださいました
  rationale: アオリスト能動分詞だが、日本語では前後の長い一文の流れを自然かつ明瞭にするため定動詞として訳した。「明らかにする」よりも、ἡμῖνを伴う「私たちに知らせる」という伝達の意味を直接表す。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: γνωρίζωの間接目的語を表す与格として素直に訳した。
- source_word: τὸ μυστήριον τοῦ θελήματος αὐτοῦ
  choice: ご自分のみこころの奥義
  rationale: μυστήριονは、単に不可解な謎ではなく、かつて隠され今や知らされた神の計画を指す。「奥義」はこの開示された神的秘義という含みを保ち、θέλημαは神の意志を表す自然で敬意ある「みこころ」とした。
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: ご自分がよしとされたことに従って
  rationale: κατάの規準・一致を「従って」で表し、εὐδοκίαの喜びを伴う自由な意向を、現代日本語として自然な「よしとされたこと」で表した。
- source_word: ἣν προέθετο
  choice: あらかじめ定めておられた
  rationale: 関係代名詞ἣνの先行詞はεὐδοκίαであるため、「よしとされたこと」を神が定めたという関係を保った。προτίθεμαιの意図・計画の意味を「定める」で表した。
- source_word: ἐν αὐτῷ
  choice: 彼において
  rationale: 代名詞の指示対象を本文で決めず、原文の曖昧さを保った。「において」は、キリストを領域・媒介として理解する可能性を残す。別解は脚注に示した。
theological_decisions:
- issue: ἐν αὐτῷの指示対象
  choice: 本文では「彼において」とし、指示対象を明示しない。
  alternative: 「キリストにおいて」または再帰的に「ご自分のうちに」
  rationale: 直近の文脈からキリストを指す理解が有力だが、神ご自身を指す再帰的表現と取る解釈もある。原文の代名詞が持つ神学的・統語的な余地を本文で解消せず、脚注で両方を示す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神への敬意を表す補助動詞と「みこころ」「奥義」によって聖書本文としての品位を保った。ギリシア語の分詞構文は日本語で独立した述語に整え、εὐδοκίαと関係節の結びつきが失われないよう前置修飾に組み替えた。
