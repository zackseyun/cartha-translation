revisions:
- from: 神は、ご自分がよしとされ、彼において[a]あらかじめ定めておられたことに従って、ご自分のみこころの奥義を私たちに知らせてくださいました。
  to: 神は、ご自分の御心の奥義を私たちに知らせてくださいました。それは、彼において定めておられた、ご自分がよしとされることに従ってのことです。
  rationale: προέθετοの時間的限定を避けて「定めておられた」とし、εὐδοκίαを「ご自分がよしとされること」と明示して関係節との結び付きを整えました。ἐν αὐτῷの代名詞的曖昧さは本文の「彼において」と脚注で保持しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:31Z'
review_pass:
  verdict: revise
  source_fidelity: 「あらかじめ定めておられたこと」は、προέθετοを時間的な「前もって定める」と限定しており、ここでの「意図する／計画する」の意味を狭めています。また、εὐδοκία（神がよしとされること）を先行詞とする関係節のつながりをより明確にする必要があります。ἐν αὐτῷの指示対象を本文で確定しない方針と脚注の提示は適切です。
  naturalness: 現行文は長い修飾が重なり、「ご自分がよしとされ、彼においてあらかじめ定めておられたこと」の係り受けがやや取りにくくなっています。「知らせてくださいました」は敬意ある聖書日本語として可能ですが、明瞭な現代標準日本語では「知らせてくださいました」より「知らせてくださいました」自体は問題ないものの、文を二文に分けると分詞の従属関係が失われやすいため、一文のまま関係節を整理します。
  terminology: 「みこころ」「奥義」はパウロ書簡の用語として定着しており、本文の格調にも合います。ただし「ご自分のみこころ」より「ご自分の御心」と表記を統一するのが自然です。「よしとされること」はεὐδοκίαの意志的・好意的な意味を保てます。
  issues:
  - severity: medium
    issue: προέθετοを「あらかじめ定めておられた」としている
    rationale: προτίθεμαιはここで神の意図・計画を表し、「あらかじめ」という時間的意味を本文に加える必要はありません。
  - severity: medium
    issue: εὐδοκίαと関係節の係り受けが不明瞭
    rationale: 「ご自分がよしとされ、彼において…こと」は、何が「よしとされ」何が「定められた」のかを読み取りにくくします。εὐδοκίαを「ご自分がよしとされること」とし、それを関係節で修飾する形が原文に忠実です。
  revised_text: 神は、ご自分の御心の奥義を私たちに知らせてくださいました。それは、彼において定めておられた、ご自分がよしとされることに従ってのことです。
  revised_footnotes:
  - marker: a
    text: 「彼において」は、キリストにおいてとも、再帰的に「ご自分のうちに」とも理解できます。
    reason: ἐν αὐτῷの指示対象について、原文にある解釈上の曖昧さを示すため。
  revision_rationale: προέθετοの時間的限定を避けて「定めておられた」とし、εὐδοκίαを「ご自分がよしとされること」と明示して関係節との結び付きを整えました。ἐν αὐτῷの代名詞的曖昧さは本文の「彼において」と脚注で保持しています。
