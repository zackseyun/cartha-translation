id: EPH.1.15
reference: Ephesians 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: ja
  text: このため、私も、主イエスにあるあなたがたの信仰[a]と、すべての聖なる者たちに対する愛[b]について聞き、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主イエスへの信頼」とも訳せる。ギリシア語の語は、文脈によっては「忠実さ」の意味も持つ。
    reason: lexical_alternative
  - marker: b
    text: 「すべての聖徒への愛」とも訳せる。「聖なる者たち」は、神に属する信者たちを指す。なお、「すべての聖なる者たちに対する愛」に当たる語句は、一部の写本にはない。
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: このため
  rationale: 直前の祝福の内容を受けて、パウロの応答の理由を示す推論的な表現として自然に訳した。
- source_word: κἀγώ
  choice: 私も
  rationale: καίとἐγώの融合形が持つ付加の意味を、過度に強調せず簡潔に表した。
- source_word: ἀκούσας
  choice: 聞き
  rationale: パウロを修飾するアオリスト分詞。後続節へつながる原文の構造を保ちつつ、日本語として自然な連用形にした。
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: あなたがたの信仰
  rationale: καθ’ ὑμᾶςを読者に属する信仰と理解し、明瞭で自然な所有表現にした。
- source_word: πίστιν
  choice: 信仰
  rationale: この文脈では主イエスを信頼する読者の関係を指すのが最も自然であり、パウロ書簡で定着した訳語を用いた。
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: 主イエスにある
  rationale: ἐνの表現とパウロ特有の結合・領域の含みを保ち、「に対する」と一義的に解消しなかった。
- source_word: κυρίῳ
  choice: 主
  rationale: イエスの称号としての神学的重みを保つ標準的な訳語を用いた。
- source_word: ἀγάπην
  choice: 愛
  rationale: 現代日本語で明瞭かつ文脈にふさわしい標準的な訳語。
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: すべての聖なる者たちに対する
  rationale: εἰςが示す愛の方向・対象を「に対する」で表し、ἅγιοιの語義を透明に示した。
- source_word: ἁγίους
  choice: 聖なる者たち
  rationale: 後代の列聖概念との混同を避けつつ、神に属する信者たちという語義を一般読者に分かりやすく表した。
theological_decisions:
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼、誠実さ
  rationale: 主イエスとの関係を表すこの構文では「信仰」が最も直接的だが、語自体には「信頼」や文脈によっては「誠実さ」の意味領域もあるため、注で残した。
- issue: ἐν τῷ κυρίῳ Ἰησοῦの関係
  choice: 主イエスにある
  alternative: 主イエスに対する
  rationale: 信仰の対象を明示する解釈も可能だが、原文のἐνを保ち、キリストとの結合またはその領域というパウロ的な含みを狭めない訳を選んだ。
- issue: ἅγιοιの呼称
  choice: 聖なる者たち
  alternative: 聖徒
  rationale: 特別に列聖された一部の人物ではなく、神に属する信者全体を指す文脈を明瞭にした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、書簡としての品位を保った。原文が次節の主動詞へ続く分詞構文であるため、訳文も「聞き、」で終えて連続性を示した。「主イエスにある」はやや聖書的な表現だが、ἐνの神学的・関係的な幅を保持するため採用した。
