reference: Ephesians 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: ja
  text: 神の御心によってメシア・イエスの使徒であるパウロから、[エフェソにいる][a]聖なる者たち、そしてメシア・イエスにあって忠実な人々[b]へ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エフェソにいる」は、重要な初期写本の一部にはありません。そのため、この手紙は当初、エフェソだけでなく、より広い諸教会で回覧するためのものだったと考える見方もあります。
    reason: textual_variant
  - marker: b
    text: 「メシア・イエスを信じる者たち」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 初期キリスト教における委任と権威を伴う職務名であり、日本語で定着した「使徒」が技術的意味を最もよく保つ。
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスの／メシア・イエスにある
  rationale: Χριστόςの称号としての意味を明示するため「メシア」とし、ἐνはパウロ書簡に特徴的な結びつき・関係を保つ「にある」と訳した。
- source_word: διὰ θελήματος θεοῦ
  choice: 神のみこころによって
  rationale: διά＋属格が示す媒介・根拠を自然な日本語で表し、使徒職が神の意志によることを伝える。
- source_word: ἁγίοις
  choice: 聖なる者たち
  rationale: 神のために聖別された共同体という語義を平明に表し、後代の特定の聖人概念との混同を避ける。
- source_word: τοῖς οὖσιν [ἐν Ἐφέσῳ]
  choice: '[エフェソにいる]'
  rationale: 分詞の存在・所在の意味を自然に表し、本文上不確かな地名句は角括弧に入れて不確実性を可視化した。
- source_word: πιστοῖς
  choice: 忠実な人々
  rationale: 「忠実な」と「信じる者」の両義が可能なうち、形容詞的な忠実さを本文に残し、もう一方を脚注で示した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この挨拶では称号としての働きがなお認められるため、「メシア」と訳して油注がれた者という意味を保った。
- issue: ἐν Ἐφέσῳの本文上の有無
  choice: 角括弧付きで本文に保持
  alternative: 「エフェソにいる」を省く
  rationale: 重要な初期写本の一部がこの句を欠くため、一方に決めず本文と脚注で異読を明示した。
- issue: πιστοῖςの意味
  choice: 忠実な人々
  alternative: 信じる者たち
  rationale: 語が持つ忠実さと信仰者という両方の可能性を、本文と脚注に分けて保存した。
- issue: ἁγίοιςとπιστοῖςの統語関係
  choice: 「すなわち」で同じ受取人への並列的説明として表現
  alternative: 「聖なる者たちと忠実な人々」という二群のような表現
  rationale: ギリシア語は同一の受取人を二つの表現で特徴づけるのが自然であり、日本語で二群と誤解されないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡冒頭にふさわしい簡潔で品位ある文体とした。「みこころ」「使徒」は聖書語として広く理解される語を用い、「聖徒」より意味が見えやすい「聖なる者たち」を選んだ。
