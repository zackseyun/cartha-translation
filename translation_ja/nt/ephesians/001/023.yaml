  yaml_path: translation/nt/ephesians/001/023.yaml
  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: ja
  text: この教会は、キリストの体であり、すべてのものをすべてにおいて満たしておられる方[b]の満ち満ちているものです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「すべてを、すべてにおいて満たしておられる方の満ち満ちているもの」。ここで「すべてにおいて」は、「あらゆる点で」または「すべての者のうちに」とも理解できます。
    reason: lexical_alternative
  - marker: b
    text: 「満たしておられる」と訳した分詞は、「満たされている」と理解することも文法上は可能です。ただし、多くはここで能動的な意味に取ります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: この教会は
  rationale: 直前の「教会」を受ける関係代名詞。日本語では指示語を補って文を続けることで、指示対象を明確にした。
- source_word: τὸ σῶμα αὐτοῦ
  choice: キリストの体
  rationale: αὐτοῦの指示対象を文脈に即して「キリスト」と明示し、パウロの身体比喩をそのまま保った。
- source_word: τὸ πλήρωμα
  choice: 満ち満ちたもの
  rationale: 「満ちている状態・満ち満ちたもの」という語義を保ちつつ、教会がキリストによって満たされるのか、ある意味でキリストを満たすものなのかを本文で断定しない表現とした。
- source_word: τοῦ ... πληρουμένου
  choice: 満たしておられる方
  rationale: 形態上は中・受動態だが、この文脈では能動的な意味が最も自然である。受動的理解の可能性は脚注に残した。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的・宇宙的な広がりを明瞭に表した。
- source_word: ἐν πᾶσιν
  choice: すべてにおいて
  rationale: 「あらゆる点で」「すべての者のうちに」などに限定せず、ギリシア語の圧縮された曖昧さを保った。
theological_decisions:
- issue: 教会とキリストに関する πλήρωμα の意味
  choice: 「満ち満ちたもの」とし、両者の関係を説明し切らない
  alternative: 「キリストに満たされるもの」または「キリストを完成させるもの」
  rationale: 原文は複数の理解を許すため、どちらか一方を本文へ織り込まず、神学的緊張を保持した。
- issue: πληρουμένου の態と意味
  choice: 能動的に「満たしておられる方」と訳す
  alternative: 「満たされている方」
  rationale: 分詞は形態上、中・受動態で受動的解釈も文法上可能だが、目的語的な τὰ πάντα と文脈から能動的理解が自然である。異なる理解は脚注で明示した。
- issue: ἐν πᾶσιν の範囲
  choice: 「すべてにおいて」と訳して範囲を限定しない
  alternative: 「あらゆる点で」または「すべての者のうちに」
  rationale: 場所・領域・様態のいずれとも取り得る表現なので、特定の解釈に狭めなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、「体」「満ち満ちたもの」という比喩的・神学的な語を説明的に言い換えすぎないようにした。「すべてのものをすべてにおいて」は意図的にやや荘重で圧縮された表現とし、原文の反復と曖昧さを保った。
