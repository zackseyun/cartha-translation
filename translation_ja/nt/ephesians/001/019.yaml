id: EPH.1.19
reference: Ephesians 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: ja
  text: また、信じる私たちに向けられた神の力が、どれほど並外れて偉大なものであるか[a]、その強さの威力が働くことに応じて、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「信じる私たちに向かう」。別訳「信じる私たちの内に働く」。後者は文脈に基づく解釈的な訳。
    reason: εἰς ἡμᾶςの方向性を本文で保ち、「内に働く」という文脈上の解釈的理解を脚注で示すため。
lexical_decisions:
- source_word: ὑπερβάλλον μέγεθος
  choice: 並外れて偉大なもの
  rationale: ὑπερβάλλονの「通常を越える」意味とμέγεθοςの「偉大さ」を、誇張しすぎず自然な現代日本語で表す。
- source_word: δύναμις
  choice: 力
  rationale: 神の有効な能力を表す基本語として訳し、後続する類義語群の中心語とする。
- source_word: εἰς ἡμᾶς
  choice: 私たちに向けられた
  rationale: εἰςの方向性を保ち、「私たちの内に」や「私たちのために」と意味を限定しない。
- source_word: τοὺς πιστεύοντας
  choice: 信じる私たち
  rationale: 現在分詞の動詞性を保ちつつ、自然な日本語にする。
- source_word: κατά
  choice: …に応じて
  rationale: 基準・対応関係を示すκατάを、日本語として自然に表す。
- source_word: ἐνέργεια
  choice: 働き
  rationale: 実際に作用する活動を表し、現代語の「エネルギー」が持つ物理学的含意を避ける。
- source_word: κράτος
  choice: 勢力
  rationale: 発揮される強大な力を表し、δύναμιςの「力」およびἰσχύςの「力強い」と可能な範囲で区別する。
- source_word: ἰσχύς
  choice: 力強い
  rationale: 内在する強さを修飾表現で示し、原文の属格連鎖を理解可能な日本語に整える。
- source_word: καὶ τί
  choice: また、…どれほど…であるか
  rationale: 前節から続く祈りの目的節として、日本語では疑問詞τίを程度表現「どれほど」で自然に示す。
theological_decisions:
- issue: δύναμις／ἐνέργεια／κράτος／ἰσχύςという力を表す語の重なり
  choice: 「力…力強い勢力の働き」として、関連語を重ねた強調を残す。
  alternative: 「神の絶大な力の働き」など一つの表現にまとめる。
  rationale: パウロの類義語の畳みかけを保持しつつ、各語に固定的な神学的体系を読み込まない。
- issue: εἰς ἡμᾶςにおける神の力の方向
  choice: 「私たちに向けられた」
  alternative: 「私たちの内に働く」または「私たちのための」
  rationale: 前置詞εἰςの方向性を優先し、力が内的に働くのか、受益を主に指すのかを訳文で決め切らない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。節が次節へ続く構文であるため、末尾は読点とした。原文の力を表す語の累積は残しながら、過度に硬い漢語の連続を避けた。
