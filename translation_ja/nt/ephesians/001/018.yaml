id: EPH.1.18
reference: Ephesians 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: ja
  text: あなたがたの心の目が照らされて、神の召しによる希望が何であるか、また、聖なる者たちの間にある[a]神の相続財産[b]が、どれほど栄光に満ち、豊かなものであるかを、あなたがたが知るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なる者たちのうちにある」または「神の聖なる民の間にある」。
    reason: ἐνは「間に」とも「うちに」とも訳し得、ἅγιοιは「聖なる者たち」または「神の聖なる民」と表現できるため。
  - marker: b
    text: 「神の相続財産」は、神に属する相続財産、または神が与える相続財産のいずれにも理解できる。聖なる者たち自身を神の相続財産と理解することもできる。
    reason: αὐτοῦの属格とἐν τοῖς ἁγίοιςとの関係には、原文上、解釈の幅があるため。
lexical_decisions:
- source_word: πεφωτισμένους
  choice: 照らされて
  rationale: 完了受動分詞が示す、照らされた結果として明るくされている状態を、文脈上の目的節につながる自然な日本語で表した。受動態も保持した。
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: あなたがたの心の目
  rationale: 「理解力」などに言い換えず、パウロの印象的な比喩をそのまま保持した。
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: あなたがたが知るためです
  rationale: εἰς τό＋不定詞の目的を、明瞭で自然な日本語の目的表現にした。
- source_word: ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ
  choice: この方の召しによる希望
  rationale: ἐλπίςを「希望」、κλῆσιςをパウロ書簡で重要な「召し」とし、属格関係を過度に説明せず「による」で表した。αὐτοῦは直前の文脈で語られる神を指すが、本文では代名詞性を保つため「この方」とした。
- source_word: ὁ πλοῦτος τῆς δόξης
  choice: どれほど栄光に富んでいるか
  rationale: 直訳的な「栄光の豊かさ」を、τίςが質・程度を問うこの文脈に合わせ、意味を保った自然な日本語にした。
- source_word: τῆς κληρονομίας αὐτοῦ
  choice: この方の相続財産
  rationale: κληρονομίαの相続・受け継ぐ財産という意味を保持した。属格αὐτοῦが、神に属する相続財産か、神から与えられる相続財産かを本文だけで断定しない表現とした。
- source_word: ἐν τοῖς ἁγίοις
  choice: 聖なる者たちの間にある
  rationale: ἐνの共同体的な意味として自然な「間に」を本文に採用し、ἅγιοιは「聖なる者たち」と訳した。「うちに」という可能性は脚注に残した。
theological_decisions:
- issue: 「この方の相続財産」が神ご自身の所有としての民を指すのか、神が信者に授ける相続財産を指すのか
  choice: この方の相続財産
  alternative: この方が与える相続財産／聖なる者たちをこの方の相続財産と見る解釈
  rationale: κληρονομίας αὐτοῦの属格には複数の理解が可能であるため、本文では所有・起源のどちらかに限定せず、脚注で解釈上の幅を明示した。
- issue: ἐν τοῖς ἁγίοιςを場所・共同体の「間に」とするか、内在を含み得る「うちに」とするか
  choice: 聖なる者たちの間にある
  alternative: 聖なる者たちのうちにある／その聖なる民の間にある
  rationale: 共同体の中にある相続財産という読みを自然な本文としつつ、ἐνのより字義的な表現を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「心の目」「召し」「栄光」「相続財産」など原文の主要な比喩と神学語彙を保持した。節単独では前文から続く構文だが、日本語では「ためです」で目的を明示し、可読性を確保した。
