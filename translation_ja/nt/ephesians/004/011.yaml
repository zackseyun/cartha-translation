id: EPH.4.11
reference: Ephesians 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: ja
  text: そして、この方ご自身が、ある人たちを使徒として、ある人たちを預言者として、ある人たちを福音宣教者として、また、ある人たちを牧者[a]と教師として[b]与えられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊飼い」または「牧師」とも訳せる。ギリシア語は、文字どおりには羊を飼う人を表す語である。
    reason: lexical_alternative
  - marker: b
    text: 「牧者」と「教師」の前には共通する一つの冠詞しかないため、両者の役割が特に密接に結びついている可能性がある。ただし、一つの職務を指すと断定する必要はない。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節とのつながりを保つ標準的な接続表現。
- source_word: αὐτὸς
  choice: この方ご自身が
  rationale: 強意的な代名詞の強調を保ちつつ、直前のキリストを自然に指し示す。
- source_word: ἔδωκεν
  choice: 与えられました
  rationale: δίδωμιの基本義を保つ。「任命した」より解釈を狭めず、人々が賜物として与えられたという文脈にも合う。
- source_word: τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς
  choice: ある人たちを使徒として、ある人たちを預言者として、ある人たちを福音宣教者として
  rationale: 冠詞を伴うμέν／δέの配分構文を、自然な日本語の「ある人たちを……として」の反復で表した。
- source_word: ποιμένας
  choice: 牧者
  rationale: 羊を世話する者という比喩を残しながら、教会共同体で人々を養い導く役割を自然かつ簡潔に示す。
- source_word: καὶ διδασκάλους
  choice: また教師として
  rationale: 二つの名詞の密接な結びつきを示しつつ、単一の職務であると断定しない表現にした。
theological_decisions:
- issue: ποιμέναςを伝統的な教会用語「牧師」とするか、原語の羊飼いの比喩を保つか
  choice: 牧者
  alternative: 牧師／羊飼い
  rationale: 「牧師」という後代の制度的職名への限定を避け、「羊飼い」の比喩を保ちながら、この文脈で自然な「牧者」を採用した。
- issue: 「牧者と教師」が一つの複合的役割か、区別可能な二つの役割か
  choice: 牧者また教師として
  alternative: 牧者であり教師である者として／牧者として、また別の人たちを教師として
  rationale: ποιμέναςとδιδασκάλουςの前には共通する一つの冠詞しかなく、両者の密接な関係が示唆される一方、単一の職務とまでは確定できないため、その曖昧さを本文と注で保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、敬意ある叙述調とした。「福音宣教者」は「伝道者」より原語の内容が伝わりやすい表現。「牧者」は比喩性と教会文脈での自然さの釣り合いを図った。
source_grounding:
  english_pob_role: consult_only
