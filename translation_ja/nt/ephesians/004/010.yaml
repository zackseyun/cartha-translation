id: EPH.4.10
reference: Ephesians 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: ja
  text: 下った方こそ、すべての天よりもはるか高く[a]上った方でもあります。それは、すべてのものを満たす[b]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての天の上に」。この表現は、あらゆる天上の領域を越えた高挙を強調しているとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すべてのことを成就する」。ギリシア語の動詞には文脈によって「成就する」の意味もあるが、ここでは「満たす」がより適切と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: 下った方
  rationale: 定冠詞を伴うアオリスト分詞の実体詞的用法を、自然な現代日本語の関係節で表した。動作の主体性と完了した出来事を保つ。
- source_word: αὐτός ἐστιν καὶ
  choice: 方こそ…方でもあります
  rationale: 下降した方と上昇した方が同一であることを強調する αὐτός の力を、「こそ」と「でも」によって自然に示した。
- source_word: ὁ ἀναβὰς
  choice: 上った方
  rationale: ὁ καταβὰς と平行する実体詞的分詞として、対応する簡潔な表現を用いた。
- source_word: ὑπεράνω
  choice: よりもはるか高く
  rationale: 空間的な上方と卓越性の双方を含みうる強意を、日本語として自然に表した。
- source_word: πάντων τῶν οὐρανῶν
  choice: すべての天
  rationale: οὐρανῶν の複数概念と πάντων の包括性を保ち、特定の宇宙論に限定しなかった。
- source_word: ἵνα
  choice: それは…ためです
  rationale: 目的を示す接続詞の働きを明瞭な現代日本語で表し、前文との論理関係を保った。
- source_word: πληρώσῃ
  choice: 満たす
  rationale: 直近の文脈では「あらゆるものに満ちる／満たす」という意味が最も適切である。アオリスト接続法は目的節の日本語表現に自然に組み込んだ。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 対象を人々や宇宙だけに狭めず、ギリシア語の包括的で広い射程を保った。
theological_decisions:
- issue: 下降した方と上昇した方の同一性
  choice: 「下った方こそ…上った方でもあります」と訳し、同一人物であることへの強調を保った。
  alternative: 単に下降と上昇を順に述べ、同一性への強調を弱める訳。
  rationale: αὐτός と反復される定冠詞付き分詞が、下降した方と上昇した方の同一性を明示的に強調しているため。本文を越えた説明は加えていない。
- issue: τὰ πάντα の範囲
  choice: 「すべてのもの」とし、包括的な範囲を保持した。
  alternative: 「すべての人」または「全宇宙」と限定・敷衍する訳。
  rationale: ギリシア語は意図的に広い。特定の対象に限定せず、原文の神学的な広がりと緊張を残した。
- issue: πληρόω の意味
  choice: 「満たす」を本文に採用した。
  alternative: 「成就する」。
  rationale: この文脈では「満たす」が自然だが、「成就する」という語義の可能性も完全には排除せず、脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。過度に教会的な専門語や特定教派の表現を避けつつ、「天」の複数的広がり、「すべてのもの」の包括性、下降と上昇の同一主体への強調を保持した。
