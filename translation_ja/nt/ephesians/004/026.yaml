  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: ja
  text: 怒りなさい。しかし、罪を犯してはなりません。[a] 日が沈むまで怒りを抱いていてはなりません。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「腹を立てても、罪を犯してはなりません」。ギリシア語は文法上「怒りなさい」という命令形だが、文脈上、譲歩を表す命令と理解することもできる。また、詩篇4:4（七十人訳4:5）を踏まえた表現と考えられる。
    reason: alternative_reading_and_cross_reference
  - marker: b
    text: 直訳「あなたがたの怒りの上に、日が沈んではなりません」。
    reason: literal_rendering
  - marker: c
    text: 「怒り」と訳した語は、「憤り」「いら立ち」、または「怒らせるもの、挑発」を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: 怒りなさい
  rationale: 命令法の形を保ち、詩篇4篇（七十人訳4:5）への響きも伝える。「腹を立てても」と条件的に訳す可能性は脚注に示す。
- source_word: μὴ ἁμαρτάνετε
  choice: 罪を犯してはなりません
  rationale: ギリシア語の禁止命令を明瞭で自然な現代日本語にした。
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: 日が沈むまで……てはなりません
  rationale: 直訳的な「太陽が……の上に沈んではならない」より自然に、日没を怒りの期限とする禁止の力を表す。
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: 怒りを抱いていて
  rationale: παροργισμόςは怒り、憤り、刺激・挑発を指し得るが、文脈では持続する怒りの状態と取るのが自然である。日本語では「怒りを抱いている」として継続性を明示した。
theological_decisions:
- issue: 冒頭を怒ることへの命令とするか、条件的な譲歩とするか
  choice: 命令法を保ち「怒りなさい」と訳す
  alternative: 「腹を立てても、罪を犯してはなりません」
  rationale: 原文の命令法と、怒りを直ちに罪と同一視しない一方で罪と持続を禁じる緊張を保持するため。怒り全般を無条件に是認する意味には限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。冒頭の命令形を保持しつつ、「しかし」で後続の禁止との緊張を自然に示した。日没の表現は日本語として理解しやすい時間構文に整えた。
