lexical_decisions:
- source_word: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος
  choice: あらゆる謙遜と柔和をもって
  rationale: μετά＋属格の随伴・態度を「もって」で表し、πάσηςの包括的な強調を「あらゆる」によって保った。「謙遜」と「柔和」は、二つの徳を明確かつ格調を保って伝える現代日本語である。
- source_word: μετὰ μακροθυμίας
  choice: 忍耐をもって
  rationale: μακροθυμίαは、とりわけ他者に対して怒りを遅くし、辛抱強くあることを表す。「忍耐」は簡潔で自然であり、文脈上の対人的な意味も保てる。
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: 互いに忍び合い
  rationale: 現在分詞が表す継続的な相互の受忍を、「互いに」と補助動詞的な「合い」で明示した。「我慢し合い」よりも口語的・否定的な響きが弱く、文体の品位も保つ。
- source_word: ἐν ἀγάπῃ
  choice: 愛のうちに
  rationale: ἐν＋与格が示し得る領域または態度を、直訳性を保つ「愛のうちに」で表した。「愛をもって」も可能だが、原文の前置詞表現との対応を優先した。
theological_decisions:
- issue: ἀγάπηの訳語
  choice: 愛
  alternative: 慈愛
  rationale: 「愛」は現代日本語で明瞭かつ広い語義を保ち、ここで相互に忍び合う行為の領域または態度を表す。特定の神学的含意を不必要に限定しない。
- issue: ἐν ἀγάπῃの係り方
  choice: 「互いに忍び合い」を修飾する「愛のうちに」
  alternative: 節全体の徳目すべてを広く修飾する
  rationale: 語順上、ἐν ἀγάπῃは直前のἀνεχόμενοι ἀλλήλωνと自然に結び付く。ただし広く節全体に関係する可能性を排除するような説明的語句は加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、書簡の勧告にふさわしい dignified な調子を保った。原文は前節の勧告に従属する句であり、末尾の現在分詞も定動詞ではないため、「なさい」を補わず読点で次節へ続く形にした。
