translation:
  language: ja
  text: 主は一人、信仰は一つ、バプテスマは一つです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」に当たるギリシア語は、文脈によっては「誠実さ」または「信頼」とも訳せますが、ここでは共同体を一つにする共有された信仰が最もよく文脈に合います。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: 一人／一つ
  rationale: 三度反復される「一」を保ち、人物を指すκύριοςには「一人」、抽象概念と事柄を指すπίστις、βάπτισμαには「一つ」を用いて、自然な日本語と並行性を両立させた。
- source_word: κύριος
  choice: 主
  rationale: パウロ書簡のこの文脈ではキリストを指す称号と理解するのが最も自然であり、日本語聖書で定着した「主」とした。
- source_word: πίστις
  choice: 信仰
  rationale: ここでは教会を一つに結ぶ、共有された信仰ないし信じる応答を表すと考えられる。「真実」「信頼」の語義もあり得るが、文脈には「信仰」が最も適する。
- source_word: βάπτισμα
  choice: バプテスマ
  rationale: 水に浸す方法などを訳語だけで規定せず、キリスト教の入信のしるしを指す術語として現代日本語で通用する「バプテスマ」を採用した。
theological_decisions:
- issue: 「主」の指示対象
  choice: 称号「主」を保ち、文脈上は最も自然にイエス・キリストを指す。
  alternative: 神一般を指すと読む。
  rationale: 4節の「一つの御霊」、5節の「一人の主」、6節の「すべてのものの父なる一人の神」という流れは御子を示唆するが、訳文には説明を加えず原文の簡潔さを保った。
- issue: 「一つのバプテスマ」の意味
  choice: 様式、効力、儀礼と霊的実質との関係を限定せず、「バプテスマ」と中立的に訳す。
  alternative: 特定の秘跡理解、または比喩的・霊的バプテスマに限定して読む。
  rationale: 本文が明言するのは一致であり、洗礼をめぐる教派的論点をこの節だけで解決してはいないため。
- issue: πίστιςの意味範囲
  choice: 「信仰」
  alternative: 「真実」または「信頼」
  rationale: 語義上の幅は保持すべきだが、この一致を列挙する文脈では共同体が共有する「信仰」が最も自然である。代案は脚注で示した。
translation_notes:
  register: 簡潔な名詞句の三重並行を、明瞭で格調ある現代標準日本語として再現した。「一人／一つ」の使い分けは日本語としての自然さを優先しつつ、「一」の反復を保持する。節単独でも読めるよう丁寧体の「です」を補った。
