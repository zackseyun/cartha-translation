id: EPH.4.31
reference: Ephesians 4:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: ja
  text: あらゆる恨み、憤り、怒り、わめき、悪口[a]を、いっさいの悪意とともに、あなたがたから取り除きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「中傷」または「侮辱的な言葉」。伝統的には「冒瀆」。ここでは、人を傷つける言葉を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: あらゆる恨み
  rationale: πικρίαの比喩的な意味である、心に抱く苦々しい敵意や反感を、現代日本語で明瞭に表す。πᾶσαの包括性も「あらゆる」で保持した。
- source_word: θυμός
  choice: 憤り
  rationale: 激しく燃え上がる感情を表しつつ、後続のὀργή「怒り」と日本語で区別する。
- source_word: ὀργή
  choice: 怒り
  rationale: 一般的・持続的な怒りを自然な現代日本語で表し、θυμόςとの並置を保つ。
- source_word: κραυγή
  choice: わめき
  rationale: この悪徳表では、単なる大声ではなく、敵意を帯びた騒々しい叫びを指す。「わめき」はその否定的含意を簡潔に伝える。
- source_word: βλασφημία
  choice: 悪口
  rationale: 人間関係上の有害な発言という文脈に合い、中傷、侮辱、罵りを含み得る広さを持つ自然な表現とした。神への冒瀆に限定しない。
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: あなたがたから取り除きなさい
  rationale: 受動命令の意味を、日本語として自然な能動命令で表し、共同体の中から排除する趣旨を保持した。
- source_word: σὺν πάσῃ κακίᾳ
  choice: いっさいの悪意とともに
  rationale: κακίαをこの文脈における悪意・害意として取り、σύνの付随関係とπάσῃの包括性を明示した。
theological_decisions:
- issue: βλασφημίαが人への有害な言葉か、神への冒瀆か
  choice: 本文では「悪口」とし、人に向けられる有害な言葉として訳す
  alternative: 冒瀆、または中傷
  rationale: 周囲には共同体内の破壊的な感情と言動が並ぶため、対人発言が第一義と考えられる。ただし語自体にはより広い侮辱的発言の幅があるので、脚注で別訳と伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。悪徳の列挙を読点で簡潔に示し、θυμόςとὀργήは「憤り」「怒り」と訳し分けた。
