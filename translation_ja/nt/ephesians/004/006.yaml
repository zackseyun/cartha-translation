  yaml_path: translation/nt/ephesians/004/006.yaml
  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: ja
  text: 唯一の神、すべての父である方は[a]、すべての上におられ、すべてを通して働いておられ、すべてのうちにおられます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての人の父」または「万物の父」。この節で繰り返される「すべて」に当たるギリシア語には、対象となる名詞が明記されていない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すべての人のうちに」。写本によっては「あなたがたすべてのうちに」とある。
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: ただひとり
  rationale: 直前から続く「一つ／ひとり」という一致の強調を保ちつつ、神が唯一であることを自然な日本語で表す。
- source_word: θεὸς καὶ πατὴρ
  choice: 神また父
  rationale: 神としての呼称と、人格的・関係的な「父」という呼称を並列のまま保持する。
- source_word: πάντων
  choice: すべての
  rationale: 補われる名詞を本文で「人」や「もの」に限定せず、ギリシア語の広がりを保つ。
- source_word: ὁ
  choice: この方は
  rationale: 神また父を受ける説明句を、現代日本語で明瞭かつ尊敬を込めて導く。
- source_word: ἐπὶ πάντων
  choice: すべての上におられ
  rationale: ἐπί＋属格が示す上位性・主権を自然に表す。「何よりも高く」よりも原文の反復を保つ。
- source_word: διὰ πάντων
  choice: すべてを通して働き
  rationale: διά＋属格の媒介・作用の意味を日本語として理解できる形にする。「働き」は明示されないが、神の作用を表すための最小限の補足である。
- source_word: ἐν πᾶσιν
  choice: すべてのうちにおられます
  rationale: 明示されていない対象を限定せず、三つの前置詞句の並行性と広い射程を保つ。
theological_decisions:
- issue: πάντων／πᾶσινの範囲
  choice: 本文では一貫して「すべて」とし、人・信者・万物のいずれかに限定しない。
  alternative: 「すべての人」「すべての信者」「万物」
  rationale: 直接の文脈は教会の一致である一方、ギリシア語には対象となる名詞が明記されていない。本文で範囲を狭めず、原文の広がりと神学的緊張を残す。
- issue: διὰ πάντωνにおける神の関わり方
  choice: 「すべてを通して働き」
  alternative: 「すべてを通しておられ」
  rationale: 後者は日本語として不自然であり、διάが表す媒介・作用を「働き」で明確にする。ただし、特定の働きの内容までは付加しない。
translation_notes:
  register: 明快な現代標準語を用いながら、告白的な文脈にふさわしい品位を保った。「おられる」によって神への敬意を示し、原文の三重の「すべて」は反復して残した。
