  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: ja
  text: 「上った」とは、彼が地の低い所へも下ったということでなければ、何を意味するのでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「低い所、すなわち地上へ」。この表現は単に地上へ下ったことを指すとも、より限定的に死者の領域へ下ったことを指すとも考えられる。
    reason: 原文の属格表現には複数の解釈があり、本文ではその曖昧さを保っているため。
lexical_decisions:
- source_word: Ἀνέβη
  choice: 上った
  rationale: 引用されている語の上方への動きを保ち、対になる「下った」と自然に対応させた。
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: というのは、…ということでなくて、何でしょうか
  rationale: 推論を示す修辞疑問の形を保ちつつ、現代日本語として理解できる表現にした。
- source_word: καὶ κατέβη
  choice: …へも下った
  rationale: καίの付加的意味を「も」で示し、「上った」との対照を保った。
- source_word: εἰς
  choice: …へ
  rationale: 移動の方向を自然な日本語で表した。文脈上、内部への移動を明示しすぎず、解釈上の幅も保てる。
- source_word: τὰ κατώτερα μέρη
  choice: 低い所
  rationale: 比較・垂直方向の含意を保ちながら、「部分」より自然な日本語とした。特定の地下世界を訳文だけで断定しない。
- source_word: τῆς γῆς
  choice: 地の
  rationale: γῆを「地」とし、属格をそのまま連体関係で表すことで、「地に属する低い所」と「低い所、すなわち地」の両解釈の余地を残した。
theological_decisions:
- issue: εἰς τὰ κατώτερα μέρη τῆς γῆς の解釈
  choice: 地の低い所へ
  alternative: 低い所、すなわち地上へ／死者の領域へ
  rationale: この句は、天に対する地上への降下とも、地の下方すなわち死者の領域への降下とも解されうる。本文では一つの教理的解釈に限定せず、注で主要な可能性を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、修辞疑問と上下の対照を保持した。「では」はδὲの論理的なつながりを表し、時間を示す語は加えていない。
