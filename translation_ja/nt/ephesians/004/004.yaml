source:
  edition: SBLGNT
  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: ja
  text: からだは一つ、霊は一つです[a]。あなたがたが召されたのも、あなたがたの召しに伴う一つの希望においてです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「霊」は、文脈上、聖霊を指す可能性が高い。ただし、ギリシア語原文は「霊」と「聖霊」を大文字・小文字で区別しておらず、信者に共通する霊や心のあり方と取る余地もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: 一つ
  rationale: 節全体に繰り返される一致の強調を、同じ語で明確に表した。
- source_word: σῶμα
  choice: からだ
  rationale: 共同体としての比喩を説明に置き換えず、そのまま保った。現代日本語として読みやすいよう平仮名表記とした。
- source_word: πνεῦμα
  choice: 霊
  rationale: 文脈上は聖霊を指す可能性が高いが、ギリシア語自体には大文字・小文字による区別がないため、「霊」として曖昧さを保ち、脚注で説明した。
- source_word: καθὼς καὶ
  choice: それは、あなたがたも……のと同じです
  rationale: 比較の働きと、読み手を含める καί の意味を自然な日本語で表した。
- source_word: ἐκλήθητε
  choice: 召された
  rationale: 受動態を保ち、召した主体を本文以上に明示しなかった。
- source_word: ἐν μιᾷ ἐλπίδι
  choice: 一つの希望にあずかった
  rationale: 直訳的な「一つの希望のうちに」は日本語として不自然なため、召しの領域・共有された希望への参与を自然に表した。
- source_word: τῆς κλήσεως ὑμῶν
  choice: その召しに伴う
  rationale: 属格を、召しと希望との密接な関連を示す表現として訳した。冗長な「あなたがたの」は文脈上明白なので「その」で受けた。
theological_decisions:
- issue: πνεῦμα の指示対象
  choice: 本文では「霊」とし、聖霊との理解を脚注で示す
  alternative: 「聖霊」または「御霊」と明示する
  rationale: 4章4–6節の「一つの主」「一人の神であり父」と並ぶ構成から聖霊を指す可能性が高い。しかし、原文の語形だけでは「霊」と「聖霊」を表記上区別できないため、本文で解釈を確定しすぎないようにした。
- issue: 「一つの希望」と「召し」の関係
  choice: 「その召しに伴う一つの希望」
  alternative: 「召しの一つの希望」または「一つの希望へと召された」
  rationale: 属格の厳密な関係を一義的に限定せず、召しに結びついた希望であることを自然な日本語で示した。
translation_notes:
  register: 明快な現代標準語を用い、荘重さを保ちつつ教会内の専門語に偏らないようにした。「一つ」の反復を残して、節の一致の主題を際立たせた。
