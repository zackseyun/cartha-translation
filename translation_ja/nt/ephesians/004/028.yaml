source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: ja
  text: 盗みをしている人は、もはや盗んではなりません。むしろ、自分の手で良い仕事をして、懸命に働きなさい。必要のある人に分け与えるものを持つためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: 盗みをしている人
  rationale: 冠詞付き現在分詞の実名詞的用法を、人を固定的に「盗人」と呼ぶよりも、継続的・習慣的な行為を表す形で訳した。
- source_word: μηκέτι κλεπτέτω
  choice: もう盗んではなりません
  rationale: μηκέτιの「もはや〜ない」と三人称命令法の禁止命令を、現代日本語で明確に表した。
- source_word: μᾶλλον δὲ κοπιάτω
  choice: むしろ……労苦して働きなさい
  rationale: 強い対照を「むしろ」で示し、κοπιάωに含まれる骨折って働くという含意を「労苦して働く」で保持した。
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: 自分の手で良い働きをして
  rationale: 分詞が労苦の仕方を説明する構造を保ち、τὸ ἀγαθόνを文脈上の有益で正しい仕事として自然に訳した。語順上の異読ではなく語義上の幅を脚注に示した。
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: 分け与えるものを持つため
  rationale: 目的節を明示し、目的語として暗黙に補われる資源・物を「もの」として自然に補った。μεταδίδωμιは自分の持つものを他者と分かち合う意味を「分け与える」で表した。
- source_word: τῷ χρείαν ἔχοντι
  choice: 必要としている人に
  rationale: 与える相手を表す与格と、必要を抱える人を表す分詞句を、簡潔で自然な現代日本語にした。
theological_decisions:
- issue: 労働の倫理的目的
  choice: 盗みに代わる正しい営みとして働き、その実りを必要としている人に分け与えることを目的として示す。
  alternative: 自立または償いをこの節の第一目的として前面に出す。
  rationale: ἵνα以下の明示的な目的節は、労働の目的を困窮者への分与に置く。自活や償いを排除はしないが、本文が明記しないものを主眼として加えない。
translation_notes:
  register: 明確な現代標準日本語を用い、命令の厳粛さを保つため丁寧体で統一した。「労苦して働く」はやや重なる表現だが、κοπιάωの強い努力のニュアンスとἐργαζόμενοςの具体的な働きをともに伝えるため採用した。
