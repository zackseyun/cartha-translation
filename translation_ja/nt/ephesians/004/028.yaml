revisions:
- from: 盗みをしている人は、もう盗んではなりません。むしろ、自分の手で良い働きをして、労苦して働きなさい。[a] それは、必要としている人に分け与えるものを持つためです。
  to: 盗みをしている人は、もはや盗んではなりません。むしろ、自分の手で良い仕事をして、懸命に働きなさい。必要のある人に分け与えるものを持つためです。
  rationale: μηκέτιの継続の停止を「もはや」で表し、三人称命令の一般的な呼びかけを自然な日本語の命令文として維持した。「良い仕事をして、懸命に働きなさい」は、τὸ ἀγαθόνをこの文脈での正しく有益な仕事として表しつつ、κοπιάωの努力を要する含意を「懸命に」で伝える。「必要のある人」はχρείαν ἔχοντιに対応し、目的節は「分け与えるものを持つためです」として保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:04Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な意味は捉えているが、「自分の手で良い働きをして、労苦して働きなさい」は、ἐργαζόμενος（働いて）がκοπιάτω（骨折って働く）のあり方を示す関係を、日本語では二つの別個の命令・動作のように聞かせやすい。また脚注は本文の語句に対する有効な代替を示しておらず、不要である。
  naturalness: 「盗みをしている人」「もう盗んではなりません」は自然である。一方、「良い働きをして、労苦して働きなさい」は重複感が強く、明確な現代標準日本語としては「良い仕事をして、懸命に働きなさい」とするほうが自然である。
  terminology: 「自分の手」「分け与える」は原文の個人的で実際的な労働と分与を適切に表す。「必要としている人」は対象が何を必要としているかを補わせるため、「必要のある人」がより簡潔で原文に近い。
  issues:
  - severity: medium
    issue: 労働を表す句の関係が不自然で重複している。
    rationale: κοπιάτω ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόνは、骨折って働くことを、手で良いこと／良い仕事を行う働きとして説明する。現行訳は「良い働きをする」と「労苦して働く」を並列的に響かせる。
  - severity: low
    issue: 脚注が本文の有効な代替訳として機能していない。
    rationale: 脚注の「自分の手で良いことを行い、労苦して働きなさい」は、本文とほぼ同じ内容をより不自然に言い換えたもので、語義上の重要な別解を明確に示していない。本文を「良い仕事」とする場合でも、ここでは脚注を置かず本文で十分に意味を伝えられる。
  revised_text: 盗みをしている人は、もはや盗んではなりません。むしろ、自分の手で良い仕事をして、懸命に働きなさい。必要のある人に分け与えるものを持つためです。
  revised_footnotes: []
