id: EPH.4.22
reference: Ephesians 4:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: ja
  text: 以前の生き方に関して、欺きの欲望に従って腐敗していく古い人を脱ぎ捨てること[a][b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「古い自分」とも訳せる。直訳は「古い人」。以前の人間的なあり方を指す表現。
    reason: alternative_reading
  - marker: b
    text: 直訳は「欺きの欲望」。欺きに特徴づけられる、または欺きによって形作られる欲望を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: 脱ぎ捨てること
  rationale: 衣服を脱ぐ比喩を保ち、24節の「着る」との対照も自然に示す。不定詞は、前文に続く教えの内容として名詞的に訳した。
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: 以前の生き方に関して
  rationale: ἀναστροφήを日常的かつ倫理的な意味を含む「生き方」とし、κατάはここでは関連・範囲を示すものとして訳した。
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: 古い人
  rationale: ἄνθρωποςの語形とパウロの代表的・人間論的表現を保つ。「古い自分」より原文に近く、男性だけを指す日本語でもない。
- source_word: τὸν φθειρόμενον
  choice: 腐敗していく
  rationale: 現在受動分詞が表す進行中の道徳的な崩壊を示す。「滅びつつある」も可能だが、ここでは倫理的腐敗とのつながりが明瞭な表現を選んだ。
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: 欺きから生じる欲望に従って
  rationale: κατάの規定・支配の関係を「に従って」で表し、属格 τῆς ἀπάτης は欲望が欺きによって形作られる関係として自然な日本語にした。
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον の訳
  choice: 古い人
  alternative: 古い自分
  rationale: この句は男性だけでなく、以前の人間的あり方を代表的に指す。日本語の「人」は性を限定せず、原文のἄνθρωποςと、個人的な「自己」だけには限定されない含みを保てる。
- issue: ἀποθέσθαι の文脈上の働き
  choice: 脱ぎ捨てること
  alternative: 脱ぎ捨てなさい／すでに脱ぎ捨てたこと
  rationale: 不定詞を教えの内容として保ち、命令なのか、回心時の出来事を述べるのかを訳文で一方に決めない。
- issue: φθειρόμενον の時間的・態的含意
  choice: 腐敗していく
  alternative: 滅びつつある
  rationale: 現在受動分詞の継続的過程を表しつつ、受動の行為者を補わず、原文の開放性を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「古い人」「脱ぎ捨てる」という原文の比喩と人間論的表現を保持した。本節単独では文が続くため、末尾を読点として前後の構文との連続性を示した。
