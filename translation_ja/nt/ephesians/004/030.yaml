source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: ja
  text: また、神の聖霊を悲しませてはいけません。あなたがたは、この方にあって、贖いの日に向けて証印を押されたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「贖いの日まで」。ギリシア語は直訳すると「贖いの日へ」で、将来のその日へ向かう意味にも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: 悲しませてはいけません
  rationale: μήを伴う現在命令形の禁止を自然な現代日本語で表し、聖霊に対する人格的・関係的な含みを保った。「悲しませる」は「害する」「怒らせる」などより原語に近い。
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: 神の聖霊
  rationale: τοῦ θεοῦを明示しつつ、日本語で定着した称号「聖霊」を用いた。
- source_word: ἐν ᾧ
  choice: この方のうちに
  rationale: 前置詞ἐνを「うちに」として保持し、文法上は中性である関係代名詞の指示対象が人格的な聖霊であることを「この方」で自然に示した。「この方によって」として手段・行為者に限定することは避けた。
- source_word: ἐσφραγίσθητε
  choice: 証印を押された
  rationale: アオリスト受動を保ち、認証・所有・保護を含み得る印章の比喩を、日本語で理解しやすい「証印を押す」で表した。
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: 贖いの日のために
  rationale: εἰςの目標・到達点を示す用法を「ために」で保持し、単に継続期間を示す「まで」と断定しなかった。「贖いの日」は文脈上、将来の完成を指す。
theological_decisions:
- issue: 聖霊を受ける関係節の人格的表現
  choice: 「この方のうちに」
  alternative: 「その中で」または「この方によって」
  rationale: πνεῦμαに一致する関係代名詞は文法上中性だが、悲しむことのできる聖霊が指示対象であるため人格的に訳した。同時に、ἐνを行為者の「によって」と限定せず、原文の表現を保った。
- issue: 証印と贖いの日との関係
  choice: 「贖いの日のために」
  alternative: 「贖いの日まで」
  rationale: εἰςの目的・方向性を優先し、最終的な贖いへ向けられた証印という意味を示した。救いの保持やその仕組みに関する特定の教理体系までは本文に持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、命令の厳粛さと聖霊への人格的言及を保った。「封印された」も可能だが、現代日本語では閉じ込める意味に取られやすいため、印章の比喩を明確にする「証印を押された」を採用した。脚注記号は本文末に配置し、εἰςの解釈上の幅を示した。
