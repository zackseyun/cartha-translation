  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: ja
  text: 彼らは感覚が鈍くなり[a]、放縦[b]に身を任せ、貪欲に[c]あらゆる汚れた行いを行うようになりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何も感じなくなり」「無感覚になり」。
    reason: lexical_alternative
  - marker: b
    text: または「恥知らずなふるまい」「みだらな行い」。性的な含みを持つこともありますが、より広く無節制な行いを指し得ます。
    reason: lexical_alternative
  - marker: c
    text: または「飽くことなく」「強欲に」。原語は、もっと得ようとする貪欲さを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 彼らは
  rationale: 直前に述べられた異邦人を受ける関係代名詞。日本語では独立した主題「彼らは」とすることで、前節とのつながりを自然に保った。
- source_word: ἀπηλγηκότες
  choice: 感覚が麻痺し
  rationale: 痛みや恥への感覚を失って無感覚になった結果状態を表す完了分詞。単なる感情の乏しさに限定せず、文脈上の道徳的な鈍麻を示せる表現とした。
- source_word: ἑαυτοὺς παρέδωκαν
  choice: 身を任せ
  rationale: 再帰代名詞を伴う動詞が表す、自ら進んで引き渡すことを、自然な現代日本語で表した。
- source_word: τῇ ἀσελγείᾳ
  choice: 放縦に
  rationale: 恥を顧みない無節制なふるまいを広く指す語であり、性的な罪だけに狭めないよう「放縦」とした。
- source_word: εἰς ἐργασίαν
  choice: 重ねるようになりました
  rationale: 目的・帰結を示す εἰς と、行為・実践を意味する ἐργασία を、日本語の流れに合わせて継続的実践として表現した。
- source_word: ἀκαθαρσίας πάσης
  choice: あらゆる汚れた行い
  rationale: πάσης の包括的な範囲を「あらゆる」で示し、抽象名詞 ἀκαθαρσία を文脈に即して具体的かつ自然に表した。
- source_word: ἐν πλεονεξίᾳ
  choice: 貪欲に
  rationale: もっと得ようとする飽くことのない欲望を表す語を、汚れた行いを実践する際の様態として訳した。
theological_decisions:
- issue: ἀπηλγηκότες の道徳的・心理的含意
  choice: 道徳的な感覚を含む鈍麻として「感覚が麻痺し」と訳す
  alternative: 何も感じなくなり／無感覚になり
  rationale: 文脈は神のいのちから離れた結果としての倫理的な無感覚を述べているが、原語にない「良心」を本文へ明示せず、比喩の幅を保った。
- issue: ἀσέλγεια の範囲
  choice: 性的な意味に限定しない「放縦」
  alternative: みだらな行い／好色／恥知らずなふるまい
  rationale: この語は性的な恥知らずさを含み得る一方、より広く無節制な自己放任も表すため、その広がりを保持した。
- issue: ἐν πλεονεξίᾳ の係り方
  choice: あらゆる汚れた行いを実践する際の様態として「貪欲に」
  alternative: 貪欲のうちに／飽くことなく／金銭欲をもって
  rationale: 直近の「行うこと」にかかる様態表現と読むのが自然だが、金銭的な強欲だけには限定せず、飽くことのない欲求という幅を残した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「放縦」「貪欲」によって本文の厳粛な倫理的調子を保った。「良心」や性的罪への限定など、原文に明示されない解釈は本文へ加えず、脚注で語義の幅を示した。
