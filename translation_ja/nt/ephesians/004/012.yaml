  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: ja
  text: 聖なる者たちを整え、奉仕の働きのために備えさせ、メシアの体を築き上げるためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: 整えて
  rationale: καταρτισμόςは、人を務めに適するよう備え、整えることを表す。日本語では動詞化することで、目的を自然かつ明確に示せる。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: パウロが神のために聖別された信者たちを指して用いる表現。後代の列聖者だけを指すとの誤解を避けつつ、原語の「聖」の要素を保つ。
- source_word: εἰς ἔργον διακονίας
  choice: 奉仕の働きに就かせ
  rationale: διακονίαの広い意味を「奉仕」で表し、聖職者だけの職務に限定しない。「に就かせ」は、整えることの目的として奉仕の働きに向かわせる関係を自然な日本語で示す。
- source_word: εἰς οἰκοδομὴν
  choice: 築き上げるため
  rationale: οἰκοδομήの建築的比喩を保ち、共同体を成長・強化する意味が伝わる現代日本語とした。
- source_word: τοῦ σώματος
  choice: 体
  rationale: キリストに属する共同体を指すパウロ的な身体の比喩をそのまま保持する。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςの称号としての意味、すなわち「油注がれた者」を保つため「メシア」とした。日本語の教会用語として一般的な「キリスト」も脚注に示す。
theological_decisions:
- issue: 三つの前置詞句の統語関係
  choice: 聖なる者たちが整えられて奉仕の働きに就き、それがメシアの体を築き上げることへ向かうという進行的な読みを本文に採用した。
  alternative: 三句を並列の目的として、「聖なる者たちを整えるため、奉仕の働きのため、メシアの体を築き上げるため」と読むこともできる。
  rationale: πρός ... εἰς ... εἰς の連鎖には並列と進行の両方の可能性がある。自然な日本語本文には文脈上よく通る進行的理解を採り、別の統語理解を脚注で明示して、教会の奉仕主体をめぐる含意を断定しない。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは所有格の称号として「メシアの体」を指すため、称号性を明示する「メシア」を本文に置き、伝統的な音訳「キリスト」を脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準語。「聖徒」は専門的・伝統的に響きやすいため「聖なる者たち」とし、「教役」など聖職者に限定され得る語を避けて「奉仕」を用いた。
