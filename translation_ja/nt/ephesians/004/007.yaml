source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: ja
  text: しかし、私たち一人一人に、メシア[a]の賜物の量りに応じて、恵みが与えられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストの賜物」とも訳せる。ギリシア語 Χριστοῦ は、称号の意味を表して「メシア」と訳すことも、慣用的に「キリスト」と訳すこともできる。
    reason: Χριστόςの称号としての意味と伝統的な音写の双方を示すため。
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: 私たち一人一人に
  rationale: ἑνίとἑκάστῳを重ねた配分的な強調を保ち、共同体の各人に個別に与えられることを明確にする。
- source_word: δὲ
  choice: しかし
  rationale: 直前の一致の強調から、各人に異なって配分される恵みへ話を展開する穏やかな対照を示す。
- source_word: ἐδόθη
  choice: 与えられました
  rationale: アオリスト受動態を自然な現代日本語の過去受動表現で表す。
- source_word: ἡ χάρις
  choice: 恵み
  rationale: 奉仕のために各人へ与えられる力や賜物という文脈的含意を持つが、パウロの神学的語彙と意味の広がりを保つため「恵み」とする。
- source_word: κατὰ τὸ μέτρον
  choice: 量りに応じて
  rationale: κατάが示す基準・割合と、μέτρονの「量り」という比喩を保つ。
- source_word: τῆς δωρεᾶς
  choice: 賜物
  rationale: 無償で与えられるものを表すδωρεάを、聖書文脈で自然かつ品位ある「賜物」と訳す。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: ここでは称号としての意味が保たれているため、Χριστόςの語義を示す「メシア」とする。属格の関係は限定せず、「メシアの」として原文の幅を残す。
theological_decisions:
- issue: この文脈における「恵み」の意味
  choice: 「恵み」と訳し、各人に配分される奉仕上の賜物・力という文脈的含意を保持する
  alternative: 「奉仕の賜物」または「恵みの賜物」と明示する
  rationale: 4章7–11節は多様な奉仕の賜物へ展開するが、χάρις自体の広い神学的意味を狭めないため、本文では説明を加えない。
- issue: τοῦ Χριστοῦの属格関係
  choice: 「メシアの賜物」とし、所有・起源・授与者のいずれにも開かれた表現を保つ
  alternative: 「メシアが与える賜物」
  rationale: 文脈上はメシアが与える賜物という理解が有力だが、原文の属格はそれを明示していないため、訳文で一義的に確定しない。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての語義が認められるため「メシア」とし、伝統的な音写は脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「恵み」「賜物」「量り」など原文の神学的・比喩的語彙を保持した。「私たち一人一人」で配分の強調を自然に表した。
