id: EPH.4.14
reference: Ephesians 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: ja
  text: それは、私たちがもはや幼子[a]であって、波にもてあそばれ、どんな教えの風にも吹き回され、人々のいかさま[b]や、惑わしの策略へと向けられた悪賢さ[c]によって振り回されることがないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「乳飲み子」とも訳せます。ここでは未成熟な者の比喩です。
    reason: lexical_alternative
  - marker: b
    text: 「いかさま」に当たる語は、直訳すると「人々のさいころ遊び」です。不正なさいころを使うような、ごまかしや策略を表します。
    reason: cultural_note
  - marker: c
    text: 直訳に近くは「惑わしの策略に向けた悪賢さによって」です。この句の関係は圧縮されており、「欺きの策略のための悪賢さ」とも理解できます。「惑わし」は「誤り」「欺き」とも訳せます。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: それは、私たちがもはや…ではなく…ことがないためです
  rationale: ἵναの目的・結果の含みと、μηκέτιの「もはや～ない」を自然な日本語で表した。文脈上、前節を受ける従属的なつながりも「それは」で保持した。
- source_word: νήπιοι
  choice: 幼子
  rationale: 身体的年齢そのものではなく未成熟さを表す比喩であるため、現代日本語で自然かつ品位のある「幼子」とした。
- source_word: κλυδωνιζόμενοι
  choice: 波にもてあそばれ
  rationale: 波に翻弄される海上の比喩を明示し、受動的に揺さぶられる意味を保った。
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: どんな教えの風にも吹き回され
  rationale: 「教えの風」という比喩を維持しつつ、あちこちへ運ばれる受動的な不安定さを自然な日本語で表した。διδασκαλίαは専門的な教義体系に限定せず「教え」とした。
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: 人々のいかさまによって
  rationale: κυβείαは本来さいころ遊びを指し、そこから不正やごまかしを意味する。「いかさま」はその否定的な比喩的意味を簡潔に伝える。
- source_word: ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: 誤りへ導く悪賢い策略によって
  rationale: πανουργίαの非道徳的な巧妙さを「悪賢い」で、μεθοδείαの計画性を「策略」で表した。πλάνηが持つ「誤り」と「惑わし」の両面を一義的に狭めすぎないよう、本文では「誤りへ導く」とした。
theological_decisions:
- issue: διδασκαλίαの訳語
  choice: 教え
  alternative: 教理
  rationale: この語は正式な教理体系だけでなく教える内容一般を指し得るため、宗派的・専門的な限定を避けて「教え」とした。
- issue: πλάνηの意味範囲
  choice: 誤りへ導く
  alternative: 欺きの／惑わしの
  rationale: πλάνηには誤謬、迷い、欺きの意味領域がある。本文は到達点・方向を示し得るπρόςも踏まえて「誤りへ導く」とし、意図的欺瞞だけに限定しなかった。
- issue: πρὸς τὴν μεθοδείανの統語的関係
  choice: 誤りへ導く…策略
  alternative: 欺きの策略に沿って／欺きの企みに向けて
  rationale: 圧縮されたギリシア語の関係を、日本語では目的・方向性として読みやすく表した。ただし別の統語理解が可能なため脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「波」「風」という連続した比喩を保持した。「もてあそばれ」「吹き回され」「振り回される」によって、未成熟な者が外力に翻弄される流れを自然に表現した。
