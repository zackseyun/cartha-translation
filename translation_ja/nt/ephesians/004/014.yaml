  to: それは、私たちがもはや幼子[a]であって、波にもてあそばれ、どんな教えの風にも吹き回され、人々のいかさま[b]や、惑わしの策略へと向けられた悪賢さ[c]によって振り回されることがないためです。
  rationale: 「波」と「風」の比喩、「もはや〜ない」という目的、「人々のいかさま」という意味を維持した上で、末尾を「惑わしの策略へと向けられた悪賢さ」と改めました。これによりπανουργίαとμεθοδείαを区別し、πλάνηおよびπρόςの解釈上の幅を脚注で保持します。
