source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: ja
  text: そのため、こう言われています。「高い所へ上り、彼は捕囚を捕らえ[a]、人々に賜物を与えた[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「捕囚を捕らえ」。原文は同じ語族の語を重ねた力強い表現で、「捕らわれ人たちを捕らえて連れ去り」または「大勢の捕虜を連れ去り」とも訳せる。詩篇68:18を反映している。
    reason: lexical_alternative
  - marker: b
    text: 「人々」は、ここでは性別を問わず人間一般を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: そのため
  rationale: 前節までの議論を受ける推論・帰結の接続を、自然な現代日本語で示す。
- source_word: λέγει
  choice: こう言われています
  rationale: 明示された主語のない引用導入句として、聖書を指すことを示唆しつつ、主語を特定しすぎない表現とした。現在形の継続的な引用機能も保つ。
- source_word: Ἀναβὰς εἰς ὕψος
  choice: 高い所へ上り
  rationale: アオリスト分詞と方向を表す句を簡潔に保ち、詩篇の引用らしい格調を残した。「上った後」として時間関係を過度に限定しない。
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: 捕囚を捕らえ
  rationale: 動詞と同語根の目的語による印象的な表現を日本語でも可能な限り保持し、捕らえられた者の正体や神学的意味を本文で限定しない。
- source_word: ἔδωκεν δόματα
  choice: 賜物を与えた
  rationale: 「与える」という基本義を保ちつつ、文脈上の神からの贈り物にふさわしい自然で dignified な「賜物」を用いた。
- source_word: τοῖς ἀνθρώποις
  choice: 人々に
  rationale: ἄνθρωποι はここでは人間一般を指すと理解できるため、性別を限定しない自然な日本語とした。
theological_decisions:
- issue: 詩篇68:18を踏まえた同語根表現 ᾐχμαλώτευσεν αἰχμαλωσίαν の解釈
  choice: 「捕囚を捕らえ」とし、原文の修辞的な緊張を残す
  alternative: 「捕らわれ人たちを捕らえて連れ去り」または「大勢の捕虜を連れ去り」
  rationale: より平明な訳は可能だが、目的語を具体的な捕虜の集団と断定すると比喩の幅が狭まる。本文では詩篇との語感上のつながりを優先し、代案を脚注に示す。
- issue: τοῖς ἀνθρώποις の性別範囲
  choice: 「人々に」
  alternative: 「人間たちに」または「男たちに」
  rationale: 複数形 ἄνθρωποι は文脈上、人間一般を表し得る。日本語の「人々」は原語の包括的な指示範囲を自然かつ正確に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、聖書引用としての格調と原文の簡潔さを保持した。「捕囚を捕らえ」は日常語としては珍しいが、原文の同語根表現と解釈上の余地を残すため意図的に採用し、脚注で自然な代案を補った。
