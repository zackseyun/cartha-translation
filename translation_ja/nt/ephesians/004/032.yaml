id: EPH.4.32
reference: Ephesians 4:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: ja
  text: 互いに親切で、思いやり深くありなさい。神がキリストにおいてあなたがたを赦してくださったように、互いに赦し合いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνεσθε
  choice: し、…ありなさい
  rationale: 現在命令の継続的な勧めを、自然な日本語の命令表現で示した。
- source_word: εἰς ἀλλήλους
  choice: 互いに
  rationale: 相互的な関係の方向性を、簡潔で自然な日本語で表した。
- source_word: χρηστοί
  choice: 親切に
  rationale: 対人倫理の文脈に最も自然で、善意ある振る舞いを明確に表す。
- source_word: εὔσπλαγχνοι
  choice: 思いやり深く
  rationale: 内から湧く深い同情と慈しみを現代日本語で伝え、「親切」との意味の重複も抑えた。
- source_word: χαριζόμενοι
  choice: 赦し合いなさい
  rationale: 後半の神の行為との比較から、ここでは罪や過ちを赦す意味が明確である。分詞の付随的な勧めを日本語では命令形として自然に表した。
- source_word: ἑαυτοῖς
  choice: 互いに
  rationale: 複数の再帰代名詞が相互的意味で用いられており、日本語では「互いに」が自然である。
- source_word: καθὼς καὶ
  choice: …ように
  rationale: 比較と対応を自然に示す。「も」を機械的に加えると日本語では不自然になり得るため、比較構文全体で意味を担わせた。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 主語を直接的に訳した。
- source_word: ἐν Χριστῷ
  choice: キリストにおいて
  rationale: ἐνの関係的・領域的な幅を保ち、手段を意味する「キリストによって」と断定しなかった。Χριστόςは日本語で定着した称号「キリスト」とした。
- source_word: ἐχαρίσατο
  choice: 赦してくださった
  rationale: 文脈上の赦しを明示し、神から受け手への恩恵的な行為を自然な敬語で表した。
- source_word: ὑμῖν
  choice: あなたがたを
  rationale: 二人称複数を明示し、日本語の「赦す」が取る自然な目的語として表した。
theological_decisions:
- issue: ἐν Χριστῷの解釈
  choice: キリストにおいて
  alternative: キリストによって
  rationale: ἐνを手段に限定せず、キリストとの関係・領域を含み得る原文の幅を保持した。
- issue: Χριστῷの表記
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、日本語聖書・一般日本語で定着した称号形「キリスト」を用いた。「メシア」も語義を示す訳語だが、この句では「キリストにおいて」が自然である。
- issue: χαρίζομαιの恩恵と赦しの含意
  choice: 赦す
  alternative: 恵みを施す
  rationale: 相互の対人関係と神の対応する行為という文脈では赦免の意味が中心であり、抽象的な「恵みを施す」より明確である。
translation_notes:
  register: 明快な現代標準日本語。品位を保ちつつ、長い修飾の連鎖を二文に分けて勧告と根拠を読み取りやすくした。敬語は神の行為にのみ用い、全体を過度に古風にしなかった。
