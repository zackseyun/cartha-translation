  text: and do not give place to the devil[a].
translation:
  language: ja
  text: また、悪魔に機会を与えてはいけません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「悪魔に場所を与えてはいけません」。「場所」は、行動する余地や機会という意味にもなります。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: また、…てはいけません
  rationale: 直前から続く勧告を示す接続の力を「また」で表し、否定命令として自然な現代日本語にした。
- source_word: δίδοτε
  choice: 与えてはいけません
  rationale: δίδωμιの基本義「与える」を保ちつつ、現在命令形の否定を明確で自然な禁止表現にした。
- source_word: τόπον
  choice: 機会
  rationale: 字義は「場所」だが、この語法では相手が行動する余地・機会を指す。「隙」や「足場」より比喩を強めず、現代日本語で意味が明瞭な「機会」とした。字義的表現は脚注に残した。
- source_word: τῷ διαβόλῳ
  choice: 悪魔に
  rationale: 冠詞を伴うδιάβολοςは、ここでは中傷する人一般ではなく、人格的な悪の存在を指す呼称と理解するのが文脈上自然である。日本語の標準的な呼称「悪魔」を用いた。
theological_decisions:
- issue: διάβολοςを普通名詞「中傷する者」とするか、人格的な悪の存在「悪魔」とするか
  choice: 悪魔
  alternative: 中傷する者
  rationale: パウロ書簡の勧告文脈では、この表現は通常、単なる人間の中傷者ではなく人格的な敵対者を指す。本文以上の説明を加えず、想定される指示対象を自然に示すため「悪魔」とした。
translation_notes:
  register: 明瞭で現代的な標準日本語。節の短い禁止命令としての簡潔さと品位を保ち、τόπονの字義と慣用的意味の幅は脚注で示した。
