  text: ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, ⸀Χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: ja
  text: しかし、愛をもって真理を語り[a]、あらゆる面で[b]、頭であるメシアへと成長していきましょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「真実に生き」「真理を実践し」。ギリシア語の動詞は、真実を語ることと、真実に従って行動することの両方を含み得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すべてのことにおいて」。直訳は「すべてのこと」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: 真理を語り
  rationale: この動詞は、真実を語ることだけでなく、真実に生きることも含み得る。直前の偽りの教えや欺きとの対比、および共同体の成長という文脈から、本文では自然な日本語で「真理を語り」とし、より広い意味は脚注に残した。
- source_word: δὲ
  choice: しかし
  rationale: 前節の、教えの風や欺きに翻弄される状態との穏やかな対比を示す。
- source_word: ἐν ἀγάπῃ
  choice: 愛をもって
  rationale: 行為の仕方を表す自然な日本語であり、愛をその営みの領域・態度として示す。
- source_word: αὐξήσωμεν
  choice: 成長していきましょう
  rationale: 一人称複数の勧告的な接続法の力を表す。「していき」は共同体が継続的に成長するという日本語として自然な響きを与える。
- source_word: εἰς αὐτὸν
  choice: その方へと
  rationale: εἰς の方向性を保ち、成長がメシアを目指し、メシアとの結びつきへ向かう比喩を平板化しない。本文では関係節と同格表現に組み込んで「かしらである方、すなわちメシアへと」とした。
- source_word: τὰ πάντα
  choice: あらゆる点で
  rationale: 字義的には「すべてのもの」だが、成長を表す動詞とともに包括的な範囲を示すと理解するのが自然である。別の取り方は脚注に示した。
- source_word: κεφαλή
  choice: かしら
  rationale: 身体の比喩を保ち、「源」や「権威者」など論争のある解釈を本文に持ち込まない。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは「かしらである方」と同格に置かれた称号として機能しているため、「メシア」とした。
theological_decisions:
- issue: ἀληθεύοντες の意味範囲
  choice: 本文では「真理を語り」
  alternative: 「真実に生き」「真理を実践し」
  rationale: 周辺文脈では偽りの教えと欺きが問題にされているため、発言に焦点を置く訳が自然である。しかし、動詞は真実な行動を含み得るので、脚注でその幅を保持した。
- issue: κεφαλή の解釈
  choice: 比喩を保って「かしら」
  alternative: 「源」「支配者」
  rationale: ギリシア語の比喩そのものを訳し、その神学的含意を一つに限定しない。
- issue: εἰς αὐτόν の方向性
  choice: 「メシアへと成長する」
  alternative: 「メシアに向かって成長する」「メシアに至るまで成長する」
  rationale: 方向と関係的な結びつきの両方を含み得る表現として「へと」を用い、到達の程度や合一の仕方を過度に限定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、勧告としての品位とパウロの身体的な成長の比喩を保った。「頭」よりも比喩的・聖書的な用法が明確になる「かしら」を採用し、漢字の「頭」は避けた。
