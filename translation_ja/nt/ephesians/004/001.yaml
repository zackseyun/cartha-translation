id: EPH.4.1
reference: Ephesians 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: ja
  text: ですから、主にあって囚人である私[a]は、あなたがたが受けた召しにふさわしく歩むよう、勧めます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主の囚人である私」または「主のために囚人となっている私」。
    reason: alternative_reading
  - marker: b
    text: 別訳「あなたがたが受けた召しにふさわしい生き方をしてください」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 勧めます
  rationale: 強い牧会的な訴えを表す。現代日本語として自然であり、「お願いします」ほど弱くならず、「命じます」ほど命令的にもならない。
- source_word: οὖν
  choice: ですから
  rationale: ここまでの議論を受けた帰結を明確に示しつつ、現代の標準的な日本語として自然である。
- source_word: δέσμιος
  choice: 囚人
  rationale: 拘束されている者を指す語の直接的な意味を簡潔に保つ。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ特有の表現と意味の幅を保持し、所有・原因・目的のいずれか一つに限定しない。
- source_word: ἀξίως
  choice: ふさわしく
  rationale: 受けた召しに釣り合う生き方という適合性を、明瞭で自然な日本語で表す。
- source_word: περιπατῆσαι
  choice: 歩んでください
  rationale: 生活や行動を「歩む」と表すパウロの比喩を保持しながら、日本語でも生き方を指す表現として理解できる。
- source_word: κλήσεως
  choice: 召し
  rationale: 神からの呼びかけと、それによって与えられた立場を示すパウロ書簡の用法に適した定訳である。
- source_word: ἧς ἐκλήθητε
  choice: あなたがたが召された、その召し
  rationale: κλῆσιςとκαλέωの語のつながりを日本語でも「召し／召された」によって保つ。
theological_decisions:
- issue: ὁ δέσμιος ἐν κυρίῳにおけるパウロの自己描写
  choice: 主にあって囚人である私
  alternative: 主の囚人である私／主のために囚人となっている私
  rationale: 「主にあって」という前置詞句を形式的に保ち、主への所属、主との結びつき、主のための投獄などの可能性を一つに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい品位を保った。「主にあって」「召し」「歩む」は神学的・比喩的な幅を残すため保持し、文を二つに分けて日本語としての読みやすさを確保した。
