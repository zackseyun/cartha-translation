revisions:
- from: ですから、主にあって囚人である私[a]は、あなたがたに勧めます。あなたがたが召された、その召しにふさわしく歩んでください[b]。
  to: ですから、主にあって囚人である私[a]は、あなたがたが受けた召しにふさわしく歩むよう、勧めます[b]。
  rationale: 文を原文の勧告の構造に沿って一文に整え、ぎこちない読点による分断を解消した。「受けた召し」は、召し（κλῆσις）と召されたこと（ἐκλήθητε）の関連を自然な日本語で表す。本文の「主にあって」は保持し、ἐν κυρίῳの所属・関係・目的に関する解釈上の幅を維持した。脚注bの本文アンカーは、「歩む」を「生き方をする」と明示する代替表現に対応する位置へ移した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:50Z'
review_pass:
  verdict: revise
  source_fidelity: 「ですから」はοὖνの推論的な接続を適切に表し、「主にあって囚人である私」はὁ δέσμιος ἐν κυρίῳの解釈の幅を不当に狭めていません。「勧めます」もπαρακαλῶの牧会的な勧告の力に合っています。ただし、後半の「あなたがたが召された、その召し」は不自然な切れ目があり、ギリシア語の関係節が示す意味を明瞭な日本語に整える必要があります。
  naturalness: 現代標準日本語として前半は明瞭です。後半は「召された、その召し」という読点による分断がぎこちなく、読者に一度構文を取り直させます。「受けた召し」とすることで、κλῆσιςとἐκλήθητεの関係（召しを受けたこと）を自然に表せます。
  terminology: 「主」「主にあって」「囚人」「召し」「歩む」はいずれも適切です。「歩む」はπεριπατῆσαιの生き方に関する比喩を保っています。脚注aは本文の幅を保つ代替的理解を示し、脚注bは「歩む」の意を明示する有益な補足です。
