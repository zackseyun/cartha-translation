id: EPH.4.25
reference: Ephesians 4:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: ja
  text: ですから、偽りを捨て、各自、自分の隣人に対して真実を語りなさい。私たちは互いに、からだの一部なのですから。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の勧告から結論を導く推論的接続詞の働きを、明瞭な現代日本語で表した。
- source_word: ἀποθέμενοι
  choice: 捨て
  rationale: アオリスト中動態分詞で、主命令に先立つ放棄を示す。日本語では連用形により「偽りを捨てたうえで真実を語る」という関係を自然に保った。
- source_word: τὸ ψεῦδος
  choice: 偽り
  rationale: 定冠詞付き単数だが、文脈では特定の一つの虚偽より、虚偽・欺きという倫理的悪徳を包括的に指す可能性が高い。
- source_word: λαλεῖτε ἀλήθειαν
  choice: 真実を語りなさい
  rationale: 現在命令形の継続的な倫理命令を、自然で端的な日本語の命令として表した。ἀλήθειαν は対照される「偽り」に応じて「真実」とした。
- source_word: ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ
  choice: 各自、自分の隣人に
  rationale: ἕκαστος の個別的責任を「各自」で示し、μετά＋属格の対人的関係は、日本語の発話表現として自然な「隣人に」で表した。αὐτοῦ は性別を限定せず再帰的関係を明確にする「自分の」とした。
- source_word: ὅτι
  choice: なのですから
  rationale: 命令の根拠を導く因果関係を、説明的かつ勧告にふさわしい日本語で示した。
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: 私たちは互いに、からだの一部なのです
  rationale: μέλη の身体比喩を明示しつつ、「互いの肢体」のような不自然さや誤解を避けた。「互いに」により相互依存を保持した。
theological_decisions:
- issue: ψεῦδος の範囲
  choice: 一般的・包括的な「偽り」と訳す
  alternative: 「その偽り」または「偽りそのもの」
  rationale: 定冠詞はあるが、直近の倫理的勧告では欺瞞一般と真実を語ることが対照されているため。日本語の「偽り」は冠詞の有無を不自然に補わず、この幅を保てる。
- issue: ἐσμὲν ἀλλήλων μέλη の身体・教会論的比喩
  choice: 「私たちは互いに、からだの一部なのです」
  alternative: 「私たちは互いの肢体だからです」
  rationale: 身体の比喩と共同体の相互依存を保持しながら、誰の身体かを本文以上に明示せず、特定の教会論的説明を付加しないため。
- issue: ἕκαστος ... αὐτοῦ の性別表現
  choice: 「各自、自分の隣人に」
  alternative: 「一人ひとり、その人の隣人に」
  rationale: ギリシア語の文法的男性形は会衆全体に対する包括的な代表用法であり、日本語では性別を付加しない「各自」「自分の」が原意を正確かつ自然に伝える。
translation_notes:
  register: 明瞭で現代的ながら、聖書の勧告にふさわしい端正な文体とした。「からだ」は身体比喩であることを読者に自然に示すため平仮名表記とし、原文にない「キリストの」は補わなかった。
