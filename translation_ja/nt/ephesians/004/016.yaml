id: EPH.4.16
reference: Ephesians 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: ja
  text: この方から、体全体は、供給を担うすべてのつなぎ目を通して組み合わされ、一つに結び合わされ、各部分がそれぞれの度合いに応じて働くことによって、体の成長をもたらし、愛のうちに自らを築き上げていく。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ οὗ
  choice: この方から
  rationale: 直前のキリストを指す人格的な関係代名詞を受け、成長の源がキリストであることを明確にする。
- source_word: πᾶν τὸ σῶμα
  choice: 体全体
  rationale: 単数の集合的表現を、自然な現代日本語で表した。
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: 組み合わされ、一つに結び合わされ
  rationale: 各部分が適切に接合されることと、全体が結束させられることの二面を保ち、受動の意味も残した。
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: 支えるすべてのつなぎ目を通して
  rationale: ἁφήの接点・関節の身体比喩と、ἐπιχορηγίαの供給・支えの含意を、過度に解剖学的に限定せず表した。
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: それぞれの部分がその分に応じて働くことにより
  rationale: 各部分の働きがそれぞれに与えられた度合いに対応するという意味を、解釈的な「正しく」を加えず自然に表した。
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: 体を成長させ
  rationale: 体全体を文法上の主体として保ち、成長を生じさせるという句を日本語として簡潔にした。
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ
  choice: 愛のうちに自らを築き上げていく
  rationale: 建築の比喩、再帰的な意味、継続的な成長の方向を保った。
theological_decisions:
- issue: 教会の成長の源と働き手
  choice: 成長はキリストから来る一方、体全体が各部分の働きを通して自らを築き上げると表現する。
  alternative: 成長の働きをキリストだけ、または各部分だけに帰する。
  rationale: ἐξ οὗはキリストを源として示し、主動詞の主体は体全体である。両者の緊張関係を解消せず保った。
- issue: ἁφῆς τῆς ἐπιχορηγίαςの身体比喩
  choice: 支えるすべてのつなぎ目
  alternative: 供給するすべての関節／すべての靱帯／供給のすべての接点
  rationale: 原語は関節、接点、結合部などの幅を持つため、「つなぎ目」で身体的イメージを残しつつ過度な限定を避けた。
translation_notes:
  register: 明瞭で現代的ながら、パウロの長い一文の論理的連続性と身体・建築の二重の比喩を保つ、格調ある標準的な文体。
