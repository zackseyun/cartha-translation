revisions:
- from: この方から、体全体は、支えるすべてのつなぎ目を通して組み合わされ、一つに結び合わされ、それぞれの部分がその分に応じて働くことにより、体を成長させ、愛のうちに自らを築き上げていく。
  to: この方から、体全体は、供給を担うすべてのつなぎ目を通して組み合わされ、一つに結び合わされ、各部分がそれぞれの度合いに応じて働くことによって、体の成長をもたらし、愛のうちに自らを築き上げていく。
  rationale: キリストを源とする関係、受動的に組み合わされ結び合わされる体、各部分に応じた働き、そして体が自らを愛のうちに築き上げるという原文の構造を維持した。「供給を担うつなぎ目」によりἐπιχορηγίαの意味を補い、「それぞれの度合いに応じて」「体の成長をもたらし」により曖昧さを避けた。
