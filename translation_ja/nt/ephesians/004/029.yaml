  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: ja
  text: 悪い言葉は、あなたがたの口から一つも出してはいけません。[a] むしろ、必要に応じて、人を建て上げるのに役立つ良い言葉だけを語り、それが聞く人たちに恵みを与えるようにしなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「腐った言葉を、一つも口から出してはいけません」。ここで「腐った」は、人を害する不健全な言葉を表します。
    reason: lexical_alternative
  - marker: b
    text: 「聞く人たちに益をもたらすように」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: 悪い言葉を、一つも
  rationale: 否定命令のもとにある単数形 πᾶς は「どんな～も」「一つも～ない」という分配的意味を持つ。σαπρός の字義は「腐った」だが、ここでは有害で不健全な発言を指すため、本文では自然な「悪い言葉」とし、鮮烈な原義は脚注に残した。
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: あなたがたの口から出してはいけません
  rationale: 発言が口から出るという身体的比喩を保ちつつ、禁止命令を明瞭な現代日本語にした。ギリシア語では「言葉」が主語だが、日本語では能動表現が自然である。
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: むしろ、…良い言葉を語り
  rationale: λόγος を補う省略構文であり、悪い発言との対照を日本語で自然に示すため「良い言葉」を明示した。
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: 必要に応じて人を建て上げるのに
  rationale: οἰκοδομή の建築比喩を「建て上げる」で保ち、圧縮された属格 τῆς χρείας は「必要に応じて」とした。誰の必要かを限定せず、原文の幅を保つ。
- source_word: ἵνα δῷ χάριν τοῖς ἀκούουσιν
  choice: 聞く人たちに恵みを与えなさい
  rationale: 目的節を日本語の勧告として自然につないだ。χάρις は文脈上「益」も意味し得るが、パウロ書簡に特徴的な「恵み」の語感と、聞き手に及ぶ好意的な働きの両方を残した。
theological_decisions:
- issue: 倫理的勧告における χάρις の訳
  choice: 恵み
  alternative: 益／恩恵
  rationale: ここでは聞き手に良いものをもたらす発言を指し、「益」とも訳せる。しかし「恵み」はパウロの語彙との連続性と、単なる実用性を超えた好意的・恩恵的な響きを保つ。発言自体が救済の恵みを授けるという教義的限定は加えない。
- issue: οἰκοδομή の対象
  choice: 人を建て上げる
  alternative: 徳を高める／教会を建て上げる
  rationale: 文脈では聞き手を強め成長させる意味だが、対象を教会共同体だけに限定していない。「人」を補うことで自然な日本語としつつ、建築比喩を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令の力を保ちながら過度に古風な表現を避けた。「建て上げる」と「恵み」は聖書的な比喩と語彙を保持するが、脚注で意味の幅を示した。
