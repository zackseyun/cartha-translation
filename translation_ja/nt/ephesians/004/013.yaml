id: EPH.4.13
reference: Ephesians 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: ja
  text: 私たち全員が、信仰[a]と神の御子を知ること[b]との一致に達し、一人の成熟した男[c]に至り、メシア[e]の満ち満ちた豊かさの背丈の尺度[d]に達するまでです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は、キリスト者が共有する信仰内容を指すとも、信者の信頼としての信仰を指すとも考えられます。
    reason: alternative_reading
  - marker: b
    text: 「知ること」は、「十分に知ること」または「深く知ること」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は「一人の成熟した男」。男性単数の像によって、教会全体が一つとなって成熟することを表しています。「成熟した大人の状態」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: 「背丈の尺度」は、「成熟の尺度」とも訳せます。原語は年齢、成熟、または背丈を表し得ます。
    reason: lexical_alternative
  - marker: e
    text: ギリシア語は「クリストス」。「キリスト」とも訳せますが、ここでは称号として「メシア」としました。
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: 〜までです
  rationale: 前節から続く働きの到達目標を示す。日本語では文末に置くことで自然に範囲を表した。
- source_word: καταντήσωμεν οἱ πάντες
  choice: 私たち全員が…達し／至り
  rationale: 共同体全体が目標へ到達するという意味を明示し、反復する εἰς に応じて「達し」「至り」を用いた。
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως
  choice: 信仰と…知ることとの一致に
  rationale: 一つの「一致」が信仰と知識の双方に関係するギリシア語の構造を保った。πίστις の客観的・主観的可能性は訳文と脚注で保持した。
- source_word: ἐπιγνώσεως
  choice: 知ること
  rationale: 単なる情報ではなく人格的・十分な認識も含み得る語だが、本文では意味を限定しすぎない自然な表現とした。
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: 神の御子
  rationale: 対象を示す属格として訳し、称号を簡潔かつ敬意ある標準的な日本語で表した。
- source_word: εἰς ἄνδρα τέλειον
  choice: 一人の成熟した人に至り
  rationale: 単数形の男性像が教会全体の成熟を表すことを保つため「一人」を明示した。「完全な」より文脈に合う「成熟した」を選んだ。
- source_word: εἰς μέτρον ἡλικίας
  choice: 成熟の尺度に達する
  rationale: 成長の比喩を自然な日本語で表した。ἡλικία は「背丈」と「成熟」の双方を意味し得るため、別訳を脚注に示した。
- source_word: τοῦ πληρώματος
  choice: 満ち満ちた状態
  rationale: πλήρωμα の充満・完全な満ち方という重みを保ちつつ、日本語として意味が通るよう「状態」を補った。
- source_word: τοῦ Χριστοῦ
  choice: メシア
  rationale: ここでは神に油注がれた方という称号的意味が際立つため「メシア」とした。標準的な別表記「キリスト」を脚注に残した。
theological_decisions:
- issue: τῆς πίστεως の意味
  choice: 「信仰」とし、共有された信仰内容を主に想定する
  alternative: 信者が抱く信頼としての信仰
  rationale: 定冠詞と共同体的一致の文脈は共有された信仰を支持するが、本文では単に「信仰」として両方の可能性を閉ざさない。
- issue: εἰς ἄνδρα τέλειον の共同体的な単数男性像
  choice: 一人の成熟した人
  alternative: 成熟した人間の状態／成熟した大人
  rationale: 教会全体が一人の成熟した人となる原文の印象的な単数像を保持し、個々人だけの成熟と誤読されないよう脚注で説明する。
- issue: τοῦ πληρώματος τοῦ Χριστοῦ の関係
  choice: メシアの満ち満ちた状態
  alternative: メシアに属する満ち満ちたもの／メシアによって満たされた状態
  rationale: 属格が持ち得る関係を特定の教義的説明に固定せず、原文の神学的な含みを残した。
- issue: Χριστοῦ の訳語
  choice: メシア
  alternative: キリスト
  rationale: 称号としての意味を表に出しつつ、日本語で定着した「キリスト」も脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、共同体全体を「一人の成熟した人」として描く原文の比喩を保持した。「御子」は聖書的な荘重さを保ちつつ一般読者にも理解可能な表現である。文脈上この節は前節から続くため、末尾の「までです」で継続構文であることを示した。
