id: EPH.4.18
reference: Ephesians 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: ja
  text: 彼らは知性が暗くされており[a]、その内にある無知のため、また彼らの心[e]のかたくなさ[d]のために、神のいのち[b][c]から遠ざけられています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「知性」は「理解」または「思い」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「遠ざけられています」は「締め出されています」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「神のいのち」は、神に属するいのちとも、神から来るいのちとも理解できる。
    reason: alternative_reading
  - marker: d
    text: 「かたくなさ」は「無感覚」とも訳せる。
    reason: lexical_alternative
  - marker: e
    text: ギリシア語では「心」は単数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: 暗くされており
  rationale: 完了受動分詞が表す、暗くされた結果として今も続く状態を、自然な日本語の受動表現で示した。
- source_word: τῇ διανοίᾳ
  choice: 知性が
  rationale: διάνοιαは思考・理解を担う内的機能を指す。「知性」は認知面を明確にし、「暗くされる」という比喩とも自然につながる。
- source_word: ἀπηλλοτριωμένοι
  choice: 遠ざけられています
  rationale: 完了受動分詞が示す継続的な隔絶状態を表す。「疎外されている」より平明であり、法的な排除だけに意味を限定しない。
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: 神のいのちから
  rationale: 属格を直訳に近く保ち、神に属するいのちとも、神から与えられるいのちとも理解できる原文の幅を残した。
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: その内にある無知のため
  rationale: διά＋対格の原因を「ため」で示し、無知が彼らの内に存在するという限定を簡潔に保持した。
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: 彼らの心のかたくなさのために
  rationale: πώρωσιςの硬化・無感覚という比喩を「かたくなさ」で伝え、καρδίαは内面全体を指す「心」とした。日本語では「彼らの心」が単複を不自然に限定しない。
theological_decisions:
- issue: 「神のいのち」の属格の意味
  choice: 「神のいのち」とし、属格の関係を特定しない
  alternative: 「神から来るいのち」または「神ご自身のいのち」
  rationale: 原文は、神に属するいのちと神から与えられるいのちのいずれにも解し得るため、訳文で一方に限定しない。
- issue: 単数形の「心」と複数の指示対象
  choice: 「彼らの心」
  alternative: 「彼ら一人一人の心」
  rationale: 原文のκαρδίαςは単数形だが複数の人々を受ける。日本語の「彼らの心」は自然で、集合的・代表的な単数を保ちつつ、人数について過度に解釈しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、分詞が描く継続状態と二つの原因句を一文の中で保持した。「いのち」は神学的含意を持つ語として平仮名表記にし、「かたくなさ」は比喩を保ちながら一般読者にも理解しやすい表現とした。
