id: EPH.4.20
reference: Ephesians 4:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: ja
  text: しかし、あなたがたは、そのようにメシアを学んだのではありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「しかし、あなたがたは、そのようにキリストを学んだのではありません」。
    reason: Χριστόςは「メシア」とも、慣用的に「キリスト」とも訳し得るため。
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 二人称複数の明示された代名詞であり、前節までに描かれた人々との対照を表す。日本語でも主語を明示して強調を保った。
- source_word: δὲ
  choice: しかし
  rationale: 前述の異邦人の生き方との対照を示す接続詞として、自然で明確な逆接表現を用いた。
- source_word: οὐχ οὕτως
  choice: そのように…のではありません
  rationale: οὕτωςが指す方法・あり方を保ち、直前に描かれた生き方と、読者がメシアを学んだこととを対比させた。
- source_word: ἐμάθετε
  choice: 学んだ
  rationale: μανθάνωの基本義をそのまま保った。「教えられた」とすると受動の意味を先取りし、「知るようになった」とすると解釈を加えすぎるため避けた。
- source_word: τὸν Χριστόν
  choice: メシアを
  rationale: Χριστόςの称号としての意味を表した。『メシアを学ぶ』という原文の特徴的な言い方は、人物とその教えを切り離さない表現として、説明的に言い換えず保持した。
theological_decisions:
- issue: Χριστόνを称号として訳すか、慣用的な名称として訳すか
  choice: メシア
  alternative: キリスト
  rationale: 定冠詞を伴うΧριστόνの称号的な含意を明瞭に伝えるため「メシア」とした。ただし、この文脈で「キリスト」と訳すことも原語上可能なので脚注に示した。
- issue: 『メシアを学ぶ』という表現の解釈
  choice: 原文どおり人物を目的語とする表現を保持
  alternative: メシアについて学ぶ
  rationale: 原文はτὸν Χριστόνをἐμάθετεの直接目的語としており、「について」を補うと、パウロの意図的で特徴ある表現を通常の知識習得へ狭めるおそれがある。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた文体を採用した。「メシアを学ぶ」という原文の意外性は、自然さのために解消せず保持した。
