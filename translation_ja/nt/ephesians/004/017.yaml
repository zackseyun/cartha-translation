source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: ja
  text: ですから、私はこのことを言い、主にあって証しします。あなたがたはもはや、異邦人がその思いのむなしさの中を歩んでいるように、歩んではなりません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: ですから、私は……こう言い
  rationale: οὖνが前段からの論理的帰結を示すため「ですから」とし、Τοῦτοを日本語として自然な「こう」によってλέγωの目的語として表した。
- source_word: μαρτύρομαι
  choice: 厳かに告げます
  rationale: ここでは法廷的な「証言する」そのものより、主にある者としての重い確言・勧告を表す。「厳かに告げる」は証言的な強さを保ちつつ、現代日本語の勧告文として自然である。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロが語る領域または権威を示す表現の含みを限定せず、伝統的かつ明瞭な訳語で保持した。
- source_word: μηκέτι
  choice: もはや……ない
  rationale: 以前の生き方を今後続けないという時間的否定を明確に表した。
- source_word: ὑμᾶς περιπατεῖν
  choice: あなたがたは……歩んではなりません
  rationale: λέγω καὶ μαρτύρομαιに従属する不定詞の強い勧告の力を「てはなりません」で明示し、περιπατέωの倫理的な「歩み」という比喩を保持した。
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: 異邦人たちが歩むように
  rationale: ἔθνηがここで指すユダヤ人以外の諸民族というパウロ的区分を「異邦人」で表し、宗教的非難を直接加える「異教徒」は本文に採らなかった。καίは比較を強める用法として、日本語では特に語を足さず自然に表した。
- source_word: ἐν ματαιότητι
  choice: むなしさの中を
  rationale: ματαιότηςが表す空虚さ、無益さ、目的を失った状態を、理解しやすく品位のある「むなしさ」で表した。「中を」は「歩む」と結び付け、原文の比喩を自然に保つ。
- source_word: τοῦ νοὸς αὐτῶν
  choice: 彼らの思いの
  rationale: νοῦςは知性だけでなく思考や心的態度を含み得るため「思い」とした。αὐτῶνの指示対象が異邦人たちであることを「彼らの」と明示した。
theological_decisions:
- issue: 主として異邦人から成る読者に対する倫理的対比におけるἔθνη
  choice: 異邦人たち
  alternative: 諸国民／異教徒たち
  rationale: 「異邦人」はパウロにおける民族的・契約史的区分を保つ一方、「異教徒」ほど強い宗教的評価を名詞自体に持ち込まない。ここで非難されるのは以前の異邦人的な歩みであり、あらゆる非ユダヤ人の存在全体についての断定ではない。
- issue: λέγω καὶ μαρτύρομαιに続く不定詞περιπατεῖνの力
  choice: 歩んではなりません
  alternative: 歩まないように
  rationale: 文脈上の使徒的勧告の強さを現代日本語で明確にするため禁止表現を用いたが、独自の教理的概念は付加していない。
- issue: περιπατέωの倫理的比喩
  choice: 歩む
  alternative: 生活する／振る舞う
  rationale: 直前の「歩み」に関する勧告との語彙的連続性を保ち、新しい生き方と以前の生き方を対照するパウロの比喩を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的勧告の厳粛さを保った。「歩む」「主にあって」は聖書的比喩と神学的含意を保持するため採用し、文全体は一般読者にも理解できる語順に整えた。
