  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: ja
  text: もし本当に、あなたがたがキリストを聞き[a]、キリストにあって教えられたのなら――真理がイエスにあるとおりに[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストを聞き」は、ギリシア語では直訳的に「彼を聞き」です。「キリストについて聞き」と理解することもできます。しかし、原文は「〜について」に当たる前置詞を用いず、キリストを直接目的語にしています。
    reason: alternative_reading
  - marker: b
    text: 「キリストにあって」と「イエスにある」は、領域、結びつき、または密接な関係を表し得ます。ギリシア語は、その含みを単に「キリストによって」とするより広く残しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: もし本当に
  rationale: 条件を示す「もし」を保ちながら、γεの軽い強調と、条件が事実であることを期待する修辞的な響きを「本当に」で表した。断定的な「実際」や因果的な「〜なのだから」にはしなかった。
- source_word: αὐτὸν ἠκούσατε
  choice: この方の語りかけを聞き
  rationale: ギリシア語は直訳すれば「この方を聞いた」であり、キリスト本人を直接目的語とする点が際立つ。現代日本語で不自然な「この方を聞き」を避けつつ、単に「この方について聞いた」とせず、聞いた相手がキリストご自身であるという含みを保った。
- source_word: ἐν αὐτῷ
  choice: この方のうちで
  rationale: ἐνを単なる行為者の「この方から／によって」とせず、領域、結びつき、密接な関係を含み得る表現として残した。
- source_word: ἐδιδάχθητε
  choice: 教えられた
  rationale: アオリスト受動態を簡潔な受動表現で再現した。
- source_word: καθώς
  choice: 〜とおりに
  rationale: 先行する教えと、イエスのうちにある真理との対応を示す比較の力を保った。
- source_word: ἀλήθεια
  choice: 真理
  rationale: 冠詞のない名詞を、文脈に適した簡潔で dignified な日本語にした。「現実」と限定せず、倫理的・啓示的な広がりを保った。
- source_word: ἐν τῷ Ἰησοῦ
  choice: イエスのうちに
  rationale: 個人名「イエス」をそのまま保ち、ἐνが表し得る領域、結びつき、体現という幅を狭めなかった。
theological_decisions:
- issue: αὐτὸν ἠκούσατεを「この方について聞いた」とするか、キリストご自身を聞いたという形を保つか。
  choice: この方の語りかけを聞き
  alternative: この方について聞き
  rationale: αὐτόνは前置詞なしの直接目的語であるため、単にキリストについて情報を得たという意味へ平板化しなかった。ただし日本語として意味不明になりやすい逐語訳「この方を聞き」は避けた。
- issue: 二つのἐν句を行為者、結びつき、領域のどれとして表すか。
  choice: この方のうちで／イエスのうちに
  alternative: この方によって／イエスとの結びつきの中に
  rationale: 行為者だけに限定せず、また「結びつき」と一義的に説明し切らず、パウロ的なἐν表現の神学的な幅と緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「真理」「〜のうちに」によって本文の荘重さとパウロ特有の表現を保持した。原文が前節に続く条件節であるため、ダッシュと「〜とおりに」で未完結的なつながりも残している。
