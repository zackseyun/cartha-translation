  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: ja
  text: 平和のきずなの中で、聖霊による一致を保つよう、熱心に努めてください[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一致を保つために、熱心に努めてください」「一致を守り抜くよう励んでください」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「霊の一致」。ここでの「霊」は聖霊を指す可能性が最も高いが、信徒たちの間で共有される霊または心を指すと理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: あらゆる努力をしてください
  rationale: 熱意をもって真剣に励むという現在分詞の力を、1節から続く勧めとして自然な現代日本語で表した。単なる心構えでなく、積極的な努力を示す。
- source_word: τηρεῖν
  choice: 保つため
  rationale: すでに存在するものを守り、維持する意味を表す。信徒が一致を新たに作り出すとの含みを避けた。
- source_word: τὴν ἑνότητα
  choice: 一致
  rationale: 共同体における一つであることを、簡潔で一般的な日本語で表す。
- source_word: τοῦ πνεύματος
  choice: 御霊による
  rationale: 文脈上は聖霊を指す可能性が最も高い。「による」は属格を、御霊に由来する一致として自然に表すが、原文の関係性には一定の幅があるため脚注で補った。
- source_word: ἐν
  choice: の中で
  rationale: 一致が保たれる領域ないし手段を表すἐνの比喩を保った。
- source_word: τῷ συνδέσμῳ
  choice: 結びつき
  rationale: 人々を結び合わせるものという比喩を、現代日本語で理解しやすく表した。
- source_word: τῆς εἰρήνης
  choice: 平和という
  rationale: 平和が人々を結ぶものだという属格の関係を自然な日本語で示した。単純な「平和の結びつき」より意味が明瞭である。
theological_decisions:
- issue: πνεύματοςが指すもの
  choice: 御霊（聖霊）
  alternative: 信徒たちが共有する心、または霊
  rationale: エフェソ4章4節や30節を含む近接文脈では聖霊を指す用法が強い。ただし文法上の別解を完全には排除せず、脚注に記した。
- issue: 一致の性質
  choice: すでに与えられている一致を保つ
  alternative: 信徒が一致を作り出す
  rationale: τηρεῖνは保持・保全を意味し、一致を創出することではなく、既存の一致を守るよう求めている。
- issue: 属格 τοῦ πνεύματος の関係
  choice: 御霊による一致
  alternative: 御霊の一致
  rationale: 起源・付与の意味を自然に伝える訳を本文に採った。ただし原文の属格自体は所有・関係などの幅を持つため、脚注で直訳的な代案を示した。
translation_notes:
  register: 明瞭な現代標準日本語。命令の流れを明示しつつ、荘重さを保った。「御霊」は聖書的な語感を持つが一般読者にも通じ、聖霊への指示を簡潔に示す。「平和という結びつき」は原文の結合の比喩を保ちながら、日本語として意味が取りやすい表現とした。
