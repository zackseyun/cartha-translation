id: EPH.4.24
reference: Ephesians 4:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: ja
  text: そして、神にかたどって、真理に基づく義と聖さのうちに創造された新しい人[a]を身に着けることです。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「新しい自分」または「新しい人格」とも訳せる。直訳は「新しい人」で、直前の「古い人」と対応している。
    reason: lexical_alternative
  - marker: b
    text: 「神にかたどって」は、「神に従って」または「神に倣って」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「真理に基づく義と聖さ」は、より字義的には「真理の義と聖さ」。「真実な義と聖さ」とも解される。なお「義」は文脈により「正義」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: 身に着ける
  rationale: 直前の「脱ぎ捨てる」と対になる衣服の比喩を保ちつつ、現代日本語として自然にした。
- source_word: καινὸν ἄνθρωπον
  choice: 新しい人
  rationale: 「古い人」と対になる原文の人間論的表現と単数形を保った。「新しい自分」も可能だが、ἄνθρωποςとの語彙的対応が弱まるため脚注に示した。
- source_word: κατὰ θεὸν
  choice: 神にかたどって
  rationale: κατάの基準・対応の意味を、分かりやすく簡潔な日本語で表した。「神に従って」などの別解もあり得るため脚注で明示した。
- source_word: κτισθέντα
  choice: 創造された
  rationale: 受動分詞の創造語彙と神学的響きを保持した。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: パウロ書簡での標準的かつ簡潔な訳語。文脈により「正義」の意味も含み得る。
- source_word: ὁσιότητι
  choice: 聖さ
  rationale: 神にかなう清さ・敬虔さを表す語として、一般読者にも理解しやすい現代語を選んだ。
- source_word: τῆς ἀληθείας
  choice: 真理に基づく
  rationale: 属格を起源・基盤として自然な日本語にし、義と聖さの双方にかかる構造を示した。形式的には「真理の義と聖さ」とも訳せる。
theological_decisions:
- issue: 「新しい人」の人間論的表現
  choice: 新しい人
  alternative: 新しい自分／新しい人格
  rationale: 周辺文脈の「古い人」との対応、および原文のἄνθρωποςを保つ。個人の内面だけに限定しない表現でもある。
- issue: κατὰ θεὸνの解釈
  choice: 神にかたどって
  alternative: 神に従って／神に倣って
  rationale: 神を型・基準とする意味を表すが、原句は簡潔で複数のニュアンスを許すため、代案を脚注に残した。
- issue: τῆς ἀληθείαςの係り方
  choice: 真理に基づく義と聖さ
  alternative: 真実な義と聖さ／真理の義と聖さ
  rationale: 属格が「義」と「聖さ」の両方を限定する可能性を保ちながら、日本語として理解しやすくした。「真実な」と断定して質的属格だけに狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「身に着ける」により衣服の比喩を維持し、「新しい人」は文脈上の対句を保つ。属格表現は本文で自然にしつつ、字義的な形と別解を脚注に残した。
