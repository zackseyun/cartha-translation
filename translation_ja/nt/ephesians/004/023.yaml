  text: and to be renewed in the spirit of your mind,[a]
translation:
  language: ja
  text: さらに、あなたがたの思いのあり方[a]において新しくされること。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「あなたがたの思いの霊において」。この句を、あなたがたの思いに関わる御霊によって新しくされること、と理解することもできる。しかし、ここでは聖霊を直接指すというより、思いの内的な性向や方向性を指すと理解するほうが有力である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: 新しくされること
  rationale: 現在受動不定詞の受動性を保ち、前後の不定詞の連なりにも対応させた。「新たにされる」も可能だが、「新しくされる」のほうが平明である。現在形が継続的な過程を示す可能性はあるものの、本文では明示しない。
- source_word: δὲ
  choice: また
  rationale: ここでは強い逆接ではなく、不定詞を連ねる緩やかな接続を表すため、「しかし」ではなく「また」とした。
- source_word: τῷ πνεύματι
  choice: 霊において
  rationale: 与格を、新しくされる領域・側面を示すものとして訳した。直接に聖霊を指すと断定せず、原文の表現と曖昧さを保った。
- source_word: τοῦ νοὸς
  choice: 思いの
  rationale: νοῦςは思考・理解を担う内面的な働きを表す。「思い」は現代日本語として自然で、「霊」との属格関係も保持できる。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: 二人称複数を日本語で明示した。
theological_decisions:
- issue: πνεύματιが聖霊を指すか、人間の内的な霊・心のあり方を指すか
  choice: 「あなたがたの思いの霊」として、人の思いの内的な性向・方向性を第一義的に示す
  alternative: 「御霊によって、あなたがたの思いが新しくされる」とし、聖霊への直接の言及と解する
  rationale: τοῦ νοὸς ὑμῶνはπνεύματιを限定して「あなたがたの思いの霊」というまとまりを成すのが自然である。ただし、「霊」という語が持つ解釈上の余地は脚注に残し、聖霊との関わりを完全には排除しない。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、原文特有の「思いの霊」という緊密で解釈の余地がある表現を保持した。節が前後の不定詞句と連なる構造であるため、「こと」で結んだ。
