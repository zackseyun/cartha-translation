id: EPH.5.6
reference: Ephesians 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: ja
  text: だれにも、むなしい言葉でだまされてはいけません。これらのことのゆえに、神の怒りが不従順の子ら[a]の上に臨むのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「不従順の息子たち」。不従順を特徴とする人々を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ὑμᾶς ἀπατάτω
  choice: だれにも、…欺かれてはいけません
  rationale: 禁止命令の力を自然な現代日本語で表した。受け身の形だが、だれかが聞き手を欺くことを許してはならないという原文の警告を保っている。
- source_word: κενοῖς λόγοις
  choice: むなしい言葉
  rationale: 内容も効力もないというκενοῖςの比喩を保ちつつ、λόγοιςを過度に「議論」などへ限定しない表現。
- source_word: διὰ ταῦτα
  choice: こうしたことのために
  rationale: διά＋対格の原因を明示し、直前に挙げられた行いを指す複数形の指示も保った。
- source_word: ἔρχεται
  choice: 臨む
  rationale: 神の怒りが人々の上に来るという方向性と厳粛な調子を自然な日本語で表し、時を未来だけに限定しない非過去形とした。
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: 神の怒り
  rationale: ὀργήを一般的な「裁き」に弱めず、原文の明確な神的怒りの表現を保持した。
- source_word: ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας
  choice: 不従順の子らの上に
  rationale: ἐπίの到来先を「上に」で示し、セム語的な特徴づけの慣用句は日本語でも理解可能な「不従順の子ら」とし、直訳上の男性形は脚注で明示した。
- source_word: ἀπειθείας
  choice: 不従順
  rationale: 倫理的文脈に即して、従うことを拒む態度を表す標準的な訳語を採用した。
theological_decisions:
- issue: 神の怒りを表すὀργή
  choice: 神の怒り
  alternative: 神の裁き
  rationale: 原文は一般的な裁きではなくὀργήを用いるため、その神学的な強さを和らげなかった。
- issue: τοὺς υἱοὺς τῆς ἀπειθείαςの慣用表現
  choice: 不従順の子ら
  alternative: 不従順を特徴とする人々／不従順の息子たち
  rationale: 「息子たち」という逐語形だけでは日本語で実際の親子関係と誤解されやすい一方、単に「人々」とすると原文の比喩が消えるため、「子ら」を本文に残し、語形と意味を脚注で説明した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、警告と神の怒りについての厳粛さを保つ文体。「です・ます」調で周辺本文との朗読上の自然さを意識した。
