id: EPH.5.28
reference: Ephesians 5:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: ja
  text: 同じように、夫たちも、自分の体を愛するように、自分の妻を愛すべきです。自分の妻を愛する人は、自分自身を愛しているのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: 同じように
  rationale: 直前のキリストの模範と勧めを受けるつながりを、自然な日本語で保つ。
- source_word: ὀφείλουσιν
  choice: 愛すべきです
  rationale: 倫理的な義務を表す直説法の意味を、過度に強い命令形にせず示す。
- source_word: καὶ οἱ ἄνδρες
  choice: 夫たちも
  rationale: καίの付加的な意味を「も」で表し、婚姻の文脈に即してἄνδρεςを「夫たち」とする。
- source_word: ἀγαπᾶν
  choice: 愛する
  rationale: 節内で繰り返されるἀγαπάωの語彙的連続性を保つ。
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: 自分の妻
  rationale: γυναῖκαςを婚姻文脈に即して「妻」とし、再帰的なἑαυτῶνを「自分の」で明示する。日本語では総称的複数に単数形が自然である。
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: 自分の体を愛するように
  rationale: ὡςの比較を「ように」で示し、日本語で必要な述語「愛する」を文脈から補って比較内容を明瞭にする。σώματαは自然な総称として「体」とした。
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: 自分の妻を愛する人
  rationale: 冠詞付き分詞を自然な日本語の「人」で表し、直前の夫への言及により男性であることは文脈上明らかなため、不自然な「男」を補わない。
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: 自分自身を愛している
  rationale: 再帰代名詞の強調を「自分自身」で保ち、現在形の継続・一般的事実に自然な「愛している」を用いる。
theological_decisions:
- issue: 夫婦に向けた性別の明示された勧告
  choice: οἱ ἄνδρεςを「夫たち」と訳し、対象を明示する
  alternative: 「男たち」または性別を中和した表現
  rationale: この箇所は婚姻関係についての勧告であり、γυναῖκεςと対になるἀνήρは夫を意味する。一方、ὁ ἀγαπῶνは日本語として自然な「愛する人」としつつ、その指示対象は文脈によって夫に限定される。
- issue: 妻と自分の体との比較の性質
  choice: 「自分の体を愛するように」と比較として訳す
  alternative: 妻と夫の体が形而上学的に同一であるとの説明を訳文に加える
  rationale: 本文の比較と、妻を愛することが自分自身を愛することになるという論理をそのまま保ち、それ以上の教理的説明は加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。原文の反復する「愛する」と再帰表現を保ち、文末は読者に自然な丁寧体で統一した。
