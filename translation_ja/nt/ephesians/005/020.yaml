id: EPH.5.20
reference: Ephesians 5:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: ja
  text: いつも、すべてのことについて、私たちの主イエス・キリストの名によって、父なる神に感謝しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてのことについて」は、「すべてのものについて」とも訳せる。原語の形だけでは「すべての人のために」という意味も可能だが、文脈上は、あらゆる事柄を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: 感謝しなさい
  rationale: 現在能動分詞で、直前から続く勧告に従属する。日本語では分詞のままでは不自然なため、継続的な勧めとして有限動詞で表した。
- source_word: πάντοτε
  choice: いつも
  rationale: 時を限定しない継続性を、明瞭で自然な現代日本語で表す。
- source_word: ὑπὲρ πάντων
  choice: すべてのことについて
  rationale: πάντων は形態上、男性複数とも中性複数とも解し得るが、文脈上はあらゆる事柄を指す包括的な意味が最も自然である。「すべての人のために」という可能性は脚注に残した。
- source_word: ἐν ὀνόματι
  choice: 名によって
  rationale: 代表、権威、仲介を含み得る聖書的表現を、過度に説明せず自然な日本語で保持した。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριος のキリスト論的称号を「主」とし、ἡμῶν の関係を明示した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 現代日本語で定着した固有名・称号表現を用いた。「イエス・メシア」は日本語では不自然で、Χριστός の称号性も「キリスト」に保たれている。
- source_word: τῷ θεῷ καὶ πατρί
  choice: 父なる神に
  rationale: 一つの冠詞のもとにある θεός と πατήρ を同一の受け手への呼称として理解し、自然で格調ある定型表現にした。
theological_decisions:
- issue: Χριστός の訳し方
  choice: キリスト
  alternative: メシア
  rationale: Χριστός は「油注がれた者／メシア」という称号だが、日本語聖書語として「イエス・キリスト」が明瞭かつ自然であり、称号を人名の姓に変えるものでもない。
- issue: ὑπὲρ πάντων の指示対象
  choice: すべてのことについて
  alternative: すべての人のために
  rationale: 形態上の曖昧さはあるものの、常に感謝するという勧告の流れでは、事情や事柄を包括する中性複数の理解が適切である。別解は脚注で明示した。
- issue: 分詞 εὐχαριστοῦντες の統語的表現
  choice: 勧告を表す「感謝しなさい」
  alternative: 「感謝しつつ」
  rationale: 原文では先行する命令に連なる分詞だが、単節で提示される日本語として意味が完結するよう命令形にした。前後を連続して訳す場合は「感謝しつつ」とする余地がある。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「父なる神」「主」「名によって」という聖書的で格調ある表現を保持した。単独節として読めるよう分詞を命令形で表した。
