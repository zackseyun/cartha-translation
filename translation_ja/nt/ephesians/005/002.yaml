- from: また、メシア[a]も私たちを愛し、私たちのために[b]、芳しい香りとなる神への供え物またいけにえとして、ご自分を献げられたように、愛のうちを歩みなさい。[c]
  to: また、メシア[a]が私たちを愛し、私たちのために[b]、神への、芳しい香りの供え物といけにえとしてご自分を献げられたように、愛のうちに歩みなさい。[c]
  rationale: 助詞を補って「愛のうちに」とし、二つの供犠用語を「供え物といけにえ」と明示的に接続した。「神への、芳しい香りの」を供え物といけにえに係らせることで、εἰς ὀσμὴν εὐωδίαςの供犠的表現を自然な日本語で保った。本文の語順と「〜ように」の比較構文は原文の論理を維持している。
