id: EPH.5.2
reference: Ephesians 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: ja
  text: また、メシア[a]が私たちを愛し、私たちのために[b]、神への、芳しい香りの供え物といけにえとしてご自分を献げられたように、愛のうちに歩みなさい。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「油を注がれた者」という称号。伝統的には「キリスト」とも訳される。
    reason: 称号Χριστόςの意味と一般的な別訳を示すため。
  - marker: b
    text: 「私たちの益のために」または「私たちに代わって」とも訳し得る。
    reason: ὑπὲρ ἡμῶνが文脈上持ち得る受益的・代表的な意味の幅を示すため。
  - marker: c
    text: 「芳しい香り」は、神に受け入れられる供え物を表す旧約聖書の供犠の表現を響かせている。
    reason: この表現の旧約聖書的背景と供犠的含意を伝えるため。
lexical_decisions:
- source_word: περιπατεῖτε
  choice: 歩みなさい
  rationale: パウロが生き方を表すために用いる「歩く」という比喩を保ちつつ、現代日本語でも理解できる命令形とした。
- source_word: ἐν ἀγάπῃ
  choice: 愛のうちを
  rationale: 愛を行動の領域・あり方として示す前置詞句のニュアンスを保った。
- source_word: ὁ Χριστός
  choice: メシア
  rationale: 定冠詞を伴い称号として機能しているため、固有名のような「キリスト」ではなく称号の意味を表した。
- source_word: ἠγάπησεν ἡμᾶς
  choice: 私たちを愛し
  rationale: アオリストの出来事を自然に表し、同節のἀγάπηとの語彙的なつながりも保った。
- source_word: παρέδωκεν ἑαυτὸν
  choice: ご自分を献げられた
  rationale: 自己を引き渡す行為を、直後の供犠的文脈に即して自然な日本語で表した。敬意を示す表現だが、原文にない教理的意味は加えていない。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 受益・代理を含み得るὑπέρの幅を保ち、「身代わりに」と限定しなかった。
- source_word: προσφορὰν καὶ θυσίαν
  choice: 供え物またいけにえ
  rationale: 二つの供犠用語を一語にまとめず、それぞれを訳出した。
- source_word: τῷ θεῷ
  choice: 神への
  rationale: 供え物といけにえの受け手・方向が神であることを簡潔に示した。
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: 芳しい香りとなる
  rationale: 旧約の供犠表現にある具体的な香りの比喩を保ち、εἰςの結果・到達の含みを日本語として自然に表した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは定冠詞を伴う称号として読めるため、その意味を訳出した。日本語で定着した別表記も脚注に示した。
- issue: ὑπὲρ ἡμῶνの供犠的文脈における意味
  choice: 私たちのために
  alternative: 私たちに代わって
  rationale: メシアの自己献身が人々の益となることは明白だが、前置詞そのものを明示的な代償表現に狭めず、代理・受益の両方を含み得る表現とした。
- issue: εἰς ὀσμὴν εὐωδίαςの関係
  choice: 芳しい香りとなる神への供え物またいけにえとして
  alternative: 神への供え物またいけにえとして献げ、芳しい香りとなられた
  rationale: 芳しい香りとなるのがメシア個人だけだと誤解されないよう、自己献身を供え物・いけにえとして描く供犠的表現に結び付けた。同時に、香りの具体的比喩は残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「歩む」「芳しい」「供え物」「いけにえ」によって原文の比喩と荘重さを保持した。長いギリシア語文の論理関係を保つため、「〜ように」を主命令「歩みなさい」の前に置いた。
