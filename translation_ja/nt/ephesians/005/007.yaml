id: EPH.5.7
reference: Ephesians 5:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: ja
  text: ですから、彼らと共にあずかる者となってはいけません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らと共に参加する者」または「彼らと分け前を持つ者」。文脈上、彼らの罪深い行い、またはその結果にあずかることを指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: ～てはいけません
  rationale: 命令法と結びつく否定を、明瞭で自然な現代日本語の禁止表現で示す。
- source_word: οὖν
  choice: ですから
  rationale: 直前の警告（5:3–6）から導かれる結論であることを、自然な接続語で示す。
- source_word: γίνεσθε
  choice: ～者となって
  rationale: 単に現在の状態を表す「～であって」ではなく、そのような者になることを禁じる γίνομαι の変化・成立の意味を保つ。
- source_word: συμμέτοχοι
  choice: 共にあずかる者
  rationale: 他者と何かを共有する者という語義を保ちつつ、「仲間」のように単なる交友関係だけを示す表現を避ける。
- source_word: αὐτῶν
  choice: 彼らと
  rationale: 代名詞が人々を指すことをそのまま保ち、「彼らの行いに」などと対象を明示して原文以上に限定しない。
theological_decisions:
- issue: συμμέτοχοι αὐτῶν が示す参与の範囲
  choice: 「彼らと共にあずかる者」とし、彼らとの参与を一般的に表す。
  alternative: 「彼らの行いに加わる者」または「彼らと同じ報いを受ける者」
  rationale: 文脈上は彼らの罪深い行い、またその結果への参与が含意されるが、ギリシア語本文は参与の対象を明示せず「彼ら」としている。その曖昧さと神学的緊張を残す。
translation_notes:
  register: 明瞭な現代標準日本語。短い警告文としての厳粛さを保ち、「ですから」で前文との論理的つながりを示した。「あずかる」は日常語よりやや格調があるが、共同参与と分け前の両面を無理なく含む。
