id: EPH.5.5
reference: Ephesians 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: ja
  text: このことをよくわきまえておきなさい。すなわち、性的に不道徳な者も、汚れた者も、また貪欲な者、すなわち偶像礼拝者[a]も、だれもメシアと神の王国において相続分を持っていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 中性の関係詞のため、特に「貪欲」を指すと理解することもできます。その場合、意訳して「これは偶像礼拝である」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: よく知っているはずです
  rationale: 二つの「知る」に関わる語を重ねた強調を、自然な現代日本語で表した。「はずです」はここで確信を促す修辞的な言い方であり、不確実性を示すものではない。
- source_word: πόρνος
  choice: 性的に不道徳な者
  rationale: 特定の狭い行為だけに限定せず、性的な不道徳によって特徴づけられる者を明瞭に表す。
- source_word: ἀκάθαρτος
  choice: 汚れた者
  rationale: 倫理的な不浄を指しつつ、「汚れ」が持つ比喩的・宗教的な響きも保つ。
- source_word: πλεονέκτης
  choice: 貪欲な者
  rationale: 他者のものをさらに得ようとする強欲・むさぼりを、簡潔で定着した日本語にした。
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: つまり偶像礼拝者
  rationale: 文脈上、直前の「貪欲な者」を偶像礼拝者と説明する読みを本文に採った。ただし中性関係代名詞による別の構文理解を脚注に残した。
- source_word: κληρονομίαν
  choice: 受け継ぐこと
  rationale: 契約的・終末論的な「相続」の意味を自然な動詞表現で保ち、現在形 οὐκ ἔχει の現状的な否定を「ことがありません」で示した。
- source_word: βασιλείᾳ
  choice: 王国
  rationale: 支配と領域の双方を含みうる、明瞭で標準的な訳語。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは Χριστός が称号として機能しているため、「メシア」とした。
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: メシアと神の
  rationale: 一つの冠詞のもとに置かれた二つの属格を、その関係について争われる統語論的結論を訳文で確定せず、原文どおり並列的に表した。
theological_decisions:
- issue: ὅ ἐστιν εἰδωλολάτρης の指示対象
  choice: 直前の「貪欲な者」を説明する「つまり偶像礼拝者」
  alternative: 「これは偶像礼拝です」とし、特に貪欲そのものを指す
  rationale: 中性の関係代名詞により統語上の緊張がある。コロサイ3:5との並行と直近の文脈から人物への説明を本文に採る一方、抽象的な読みを脚注に保存した。
- issue: 王国の相続からの排除
  choice: 「受け継ぐことがありません」という現在の状態を表す警告
  alternative: 「王国を受け継がないでしょう」という未来表現
  rationale: 原文は未来形ではなく現在形 οὐκ ἔχει であるため、警告を弱めず現在の状態として訳した。
- issue: 「メシアと神」の関係
  choice: 「メシアと神の王国」と直接的に訳す
  alternative: 特定のキリスト論的統語解釈を明示する訳
  rationale: 原文の密接な結びつきを保ちながら、この句だけで論争のある統語論的結論を断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「性的に不道徳」「貪欲」は一般読者に理解可能な倫理語として用い、「メシア」「王国」「受け継ぐ」に原文の称号的・契約的・終末論的な響きを残した。
