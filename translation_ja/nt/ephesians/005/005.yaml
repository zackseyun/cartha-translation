    rationale: εἰδωλολάτρηςは字義上「偶像礼拝者」です。貪欲という行為・性質を指す読みから「偶像礼拝である」と意訳することは可能ですが、その意訳的性格と中性関係詞に基づくことを示すのが正確です。
