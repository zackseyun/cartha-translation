revisions:
- from: このことを、あなたがたはよく知っているはずです。すなわち、性的に不道徳な者、汚れた者、貪欲な者――つまり偶像礼拝者[a]――は皆、メシアと神の王国を受け継ぐことがありません。
  to: このことをよくわきまえておきなさい。すなわち、性的に不道徳な者も、汚れた者も、また貪欲な者、すなわち偶像礼拝者[a]も、だれもメシアと神の王国において相続分を持っていません。
  rationale: 命令的・強調的なγνω識表現を「よくわきまえておきなさい」とし、不確実さを含む「はずです」を除きました。列挙構造を「～も…～も…また～も、だれも」と整え、偶像礼拝者という説明を「貪欲な者」に隣接させました。「王国において相続分を持っていません」により、現在形の否定と「王国における相続」という原文の構造を保ちました。脚注では、本文が採る読みを覆さず、中性関係詞に起因する代替理解を明示しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:16Z'
review_pass:
  verdict: revise
  source_fidelity: 「よく知っているはずです」は、命令的に確信を促すἴστεを、聞き手についての推量・期待を表す日本語に変えてしまっています。また、「つまり偶像礼拝者」を列挙全体にかける現在の置き方は、特に直前の「貪欲な者」を説明する有力な読みを不明瞭にします。修正版は、三つの類型すべてが王国における相続分を持たないこと、また「偶像礼拝者」が特に貪欲な者に関係する本文上の読みを明瞭にします。
