id: EPH.5.11
reference: Ephesians 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: ja
  text: 実を結ばない闇の業に加わってはなりません[a]。それどころか、それらを明るみに出しなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「共にあずからないでください」「仲間になってはなりません」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「それらを戒めなさい」「それらを責めなさい」。原語には、言葉によって誤りを指摘する意味もあるが、この文脈では、その業を光のもとにさらすという意味も含まれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: 加わって
  rationale: 他者と共に何かを分かち合う、またはそれに参与することを表す。「加わる」は、悪い業への実際の関与を現代日本語で自然に示しつつ、「交わり」という語に限定されない原語の幅を保つ。
- source_word: ἔργοις
  choice: 業
  rationale: 行為・働きを指すパウロ書簡の語彙との連続性を保つ。「行い」も可能だが、「業」は簡潔で重みがあり、この比喩的表現にもなじむ。
- source_word: ἀκάρποις
  choice: 実を結ばない
  rationale: 原語の結実の比喩を明確な現代日本語で保ち、直前の「光の実」との対照も伝える。
- source_word: τοῦ σκότους
  choice: 闇の
  rationale: 属格を簡潔に訳し、闇に属する業、闇から生じる業などの関係を一つに限定しない。
- source_word: μᾶλλον δὲ καὶ
  choice: それどころか
  rationale: 単なる不参加との対照に加え、さらに積極的な行動を求める強意を自然な日本語で表す。
- source_word: ἐλέγχετε
  choice: 明るみに出しなさい
  rationale: 誤りを指摘し、暴き、露呈させる語義の幅のうち、周囲の光と闇の文脈に最もよく合う表現を採用する。ただし、言葉による戒めの含意も脚注に残す。
theological_decisions:
- issue: ἐλέγχετεが悪い業に対して求める行為
  choice: それらを明るみに出しなさい
  alternative: それらを戒めなさい／責めなさい
  rationale: 5章8節および13節の光と可視化の主題を保つため、「明るみに出す」を本文とした。一方、原語には罪を指摘して戒める意味もあるため、本文だけでその可能性を排除せず脚注で示す。
- issue: 否定命令と肯定命令の対照の強さ
  choice: 加わってはなりません。それどころか、明るみに出しなさい
  alternative: 加わらず、むしろ戒めなさい
  rationale: 原文は悪への不参加だけでなく、それに対する積極的な働きかけも命じる。「それどころか」により μᾶλλον δὲ καὶ の追加的・対照的な力を示すが、具体的な方法は訳文で付加しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、命令の厳粛さを保った。前半は日本語として自然な禁止表現、後半は明確な命令形とした。「実を結ばない」「闇」「明るみに出す」により、周辺文脈の結実と光・闇の比喩を保持した。
