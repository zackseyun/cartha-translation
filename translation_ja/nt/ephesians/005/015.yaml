  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: ja
  text: ですから、あなたがたが、知恵のない者としてではなく知恵のある者として、どのように歩んでいるかに、細心の注意を払いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε
  choice: よく注意しなさい
  rationale: 現在命令形の継続的な勧告を、共同体全体への自然で明確な命令として表した。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論を受ける推論・帰結のつながりを、現代日本語で明瞭に示す。
- source_word: ἀκριβῶς πῶς
  choice: どのように……か、よく
  rationale: πῶςによる生き方への問いと、ἀκριβῶςの入念な注意という力点をともに保った。
- source_word: περιπατεῖτε
  choice: 歩んでいる／歩みなさい
  rationale: パウロが用いる『歩く』という生活態度の比喩を、日本語で自然な『歩む』として保持した。ギリシア語では一度だが、日本語では対比を明確にするため後半で補った。
- source_word: μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί
  choice: 知恵のない者としてではなく、知恵のある者として
  rationale: ἄσοφοιとσοφοίの対照を対称的に表し、文法上の男性複数形を日本語で不必要に男性限定せず、教会全体への呼びかけとして訳した。
theological_decisions:
- issue: ἄσοφοι／σοφοίの文法上の男性複数形
  choice: 「知恵のない者／知恵のある者」と訳し、性別を限定しない
  alternative: 「知恵のない男たち／知恵のある男たち」
  rationale: この男性複数形は共同体全体を代表的に指し得る。日本語では『者』が原文の包括的な指示範囲を自然に保ち、原文にない男性限定を持ち込まない。
- issue: περιπατεῖτεの生活比喩
  choice: 「歩む」を保持する
  alternative: 「生きる」「生活する」
  rationale: 比喩は文脈上理解可能で、行動・生活全体を含むパウロ的表現を保てる。
translation_notes:
  register: 明瞭で現代的ながら、勧告としての端正さを保つ。「歩む」の比喩を残しつつ、語順と反復を日本語として読みやすく整えた。
