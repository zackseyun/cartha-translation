id: EPH.5.14
reference: Ephesians 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: ja
  text: 'なぜなら、明るみに出されるものはすべて光だからです。[a] それで、こう言われています。

    「眠っている者よ、目を覚ませ。

    死者たちの中から立ち上がれ。

    そうすれば、メシアがあなたを照らす。」[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見えるようにされるものはすべて光です」とも訳せる。「明るみに出される」と訳した語は、「見えるようにされる」「暴かれる」「現される」という意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: この引用の出典は確定していない。聖書の主題、特にイザヤ書60章1節を反映しているとも、初期キリスト者の賛歌であったとも考えられる。
    reason: cross_reference
  - marker: c
    text: ギリシア語は「そのメシア」。伝統的には「キリスト」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν
  choice: ものはすべて
  rationale: 中性単数の冠詞付き分詞と結びつく総称表現として、人格的対象に限定せず広い範囲を保つ。
- source_word: φανερούμενον
  choice: 明るみに出される
  rationale: 受動分詞の「見えるようにされる／暴かれる」という幅を持たせつつ、直前の光による露呈という文脈を自然な日本語で示す。別訳を脚注に残す。
- source_word: φῶς
  choice: 光
  rationale: 比喩を説明的に言い換えず、原文の簡潔で緊張を含む断定を保つ。
- source_word: διὸ
  choice: それで
  rationale: 先行文からの帰結を示しつつ、現代日本語として硬すぎない接続にする。
- source_word: λέγει
  choice: こう言われています
  rationale: ギリシア語で明示されない発言主体や引用元を特定せず、引用導入として自然な受動表現にする。
- source_word: Ἔγειρε, ὁ καθεύδων
  choice: 眠っている者よ、目を覚ませ
  rationale: 実体詞的分詞の呼びかけと覚醒の命令を、明瞭で格調を保った現代日本語にする。
- source_word: ἀνάστα ἐκ τῶν νεκρῶν
  choice: 死者たちの中から立ち上がれ
  rationale: ἐκ と複数形 τῶν νεκρῶν の「死者の中から」という像を明示し、復活と比喩的覚醒の響きを保つ。
- source_word: ἐπιφαύσει σοι
  choice: あなたを照らす
  rationale: 日本語では「あなたの上に輝く」より自然であり、光の比喩を保持する。
- source_word: ὁ Χριστός
  choice: メシア
  rationale: 冠詞を伴い称号として機能しているため、意味を示す「メシア」とする。日本語では称号の前に定冠詞相当語を加えない。
theological_decisions:
- issue: 引用の出典と発言主体
  choice: 「こう言われています」とし、主体を特定しない
  alternative: 「聖書は言っています」「神は言われます」「賛歌にこうあります」
  rationale: λέγει の主体は明示されず、引用元も確定できないため、その開放性を保つ。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは冠詞付きの称号としての性格が明瞭であり、称号の意味を訳出する。
- issue: 「明るみに出されるものはすべて光」の関係
  choice: 原文どおり断定を保つ
  alternative: 「光によってすべてが明らかになる」などと因果関係を補って解釈する
  rationale: πᾶν τὸ φανερούμενον φῶς ἐστιν は解釈上の難所であり、説明を補って一義的に解消せず、原文の神学的・修辞的緊張を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部は短い詩行に分けて荘重さと呼びかけの力を保った。「なぜなら」「それで」により論理関係を明示しつつ、難解な第一文は説明的に解消していない。すべての脚注記号を本文に付した。
