  naturalness: 「しかし、教会がメシアに従うように、妻たちもすべてにおいて夫に従うのです。」は明瞭な現代標準日本語であり、落ち着いた文体も本文の文脈に適している。「夫」は集合的・総称的に用いられており、日本語として不自然ではない。
  terminology: Χριστόςを「メシア」とする方針は提示された翻訳方針と整合し、「キリスト」を別訳として脚注に保持している。「従う」はὑποτάσσεταιの関係的・秩序的な含意を過度に説明せずに伝える。ἐν παντίへの限定的な解釈的補足も加えられていない。
