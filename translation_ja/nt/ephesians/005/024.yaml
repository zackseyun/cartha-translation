id: EPH.5.24
reference: Ephesians 5:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: ja
  text: しかし、教会がメシア[a]に従うように、妻たちもすべてにおいて夫に従うのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。ギリシア語の称号 Χριστός（クリストス）を、ここでは「メシア」と訳した。
    reason: 称号の訳語としての別訳を示すため。
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前節を受けつつ対照を示す接続詞として、現代日本語で自然かつ明瞭である。
- source_word: ὡς ... οὕτως καὶ
  choice: 〜ように、…も
  rationale: ギリシア語の対応する比較構文を、簡潔で自然な日本語として保持する。
- source_word: ἡ ἐκκλησία
  choice: 教会
  rationale: ここではパウロがキリスト者の共同体を指しており、日本語で定着した訳語である。
- source_word: ὑποτάσσεται
  choice: 従う
  rationale: 秩序ある服従を表すが、原語以上に強制的な含意を加えない、平明で関係的な表現である。
- source_word: τῷ Χριστῷ
  choice: メシア
  rationale: Χριστόςはここで称号として機能しているため、その意味を示す「メシア」とした。伝統的な「キリスト」は脚注に示す。
- source_word: αἱ γυναῖκες
  choice: 妻たち
  rationale: 家庭訓の文脈でἀνδράσινと対になっているため、一般的な「女性たち」ではなく婚姻関係を示す。
- source_word: τοῖς ἀνδράσιν
  choice: 夫
  rationale: 家庭訓の文脈では「男性」ではなく「夫」を意味する。日本語では総称的な単数形が自然であり、各妻とその夫との関係も文脈上明らかである。
- source_word: ἐν παντί
  choice: すべてにおいて
  rationale: 表現の広がりを狭めたり説明的な限定を加えたりせず、そのまま保つ。
- source_word: '[αἱ γυναῖκεςに伴う動詞の省略]'
  choice: 従うのです
  rationale: 第二節では動詞が省略されているが、日本語として文を完結させるため、直前のὑποτάσσεταιを補った。命令形や義務表現を新たに加えず、比較構文の陳述調を保った。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名のような用法よりも称号としての働きが明瞭なため、称号の意味を訳出した。一方、日本語の伝統的表記も脚注で保持する。
- issue: 妻についての節に省略された動詞の補い方
  choice: 「従うのです」と補う
  alternative: 動詞を省略したまま「妻たちも…夫に」とする、または「従いなさい」「従うべきです」とする
  rationale: 原文の省略を日本語でそのまま再現すると不自然な断片になりやすい。直前の動詞を補いつつ、原文に明示されていない命令法や義務の助動表現は導入しない。
- issue: ἐν παντίの範囲
  choice: 「すべてにおいて」と限定を加えず訳す
  alternative: 「ふさわしいすべてのことにおいて」などの解釈的限定を加える
  rationale: 原文は単にἐν παντίと述べている。神学的緊張を翻訳段階で解消せず、この節にない限定を挿入しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、家庭訓という文脈にふさわしい落ち着いた文体とした。「服従する」より日常的で過度に強圧的な響きを避ける「従う」を選び、原文の広い表現と神学的緊張は保持した。
