id: EPH.5.27
reference: Ephesians 5:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: ja
  text: それは、キリストご自身が、栄光に輝く[a]教会を、しみも、しわも、またそのようなものも何一つなく、ご自分の前に立たせ、教会が聖なる、傷のない[b]ものとなるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「栄光ある」。ギリシア語の形容詞は、教会の性質とも、栄光に包まれた状態とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「非難されるところのない」。この語は、傷や欠陥がないことと、責められる点がないことの両方を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: 前に立たせ
  rationale: 「そばに置く・立たせる」「差し出す」という語義を踏まえ、キリストが教会をご自分の前に立たせるという提示のイメージを、自然な日本語で保持した。
- source_word: αὐτὸς
  choice: キリストご自身が
  rationale: 明示された強意代名詞の強調を「ご自身が」で表した。文脈上の指示対象であるキリストを補って、日本語での明瞭さを確保した。
- source_word: ἑαυτῷ
  choice: ご自分の前に
  rationale: 再帰代名詞の力を保ち、キリストが教会を他者ではなくご自分の前に立たせるという婚姻的な提示の構図を残した。
- source_word: ἔνδοξον
  choice: 栄光に輝く
  rationale: 教会の栄光ある状態を表す形容詞を、現代日本語として自然で荘重な表現にした。「栄光ある」も可能なため脚注で示した。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: ここでは単なる集会ではなく、神の民の共同体を集合的に指すパウロ書簡の用法であり、定着した訳語を用いた。
- source_word: μὴ ἔχουσαν
  choice: 何一つないものとして
  rationale: 教会が提示される時の状態を描く分詞句を、「ないものとして」として提示の動詞に結び付けた。
- source_word: σπίλον
  choice: しみ
  rationale: 清さと花嫁の比喩における具体的な汚点を表し、「しわ」と自然に並ぶ語を選んだ。
- source_word: ῥυτίδα
  choice: しわ
  rationale: 身体的・花嫁的な比喩を直接保つ、明瞭な対応語である。
- source_word: ἤ τι τῶν τοιούτων
  choice: そのようなものが何一つ
  rationale: 先に挙げた二例に限られない、同種のもの全体への開かれた言及を保持した。
- source_word: ἀλλ’ ἵνα ᾖ
  choice: 教会が…ものとなるため
  rationale: 否定的な状態描写に対置される肯定的な目的を明示した。日本語では主語を補い、二つ目のἵναの目的性を保った。
- source_word: ἁγία
  choice: 聖く
  rationale: 神に属する清さを表す標準的で神学的含意のある訳語を用いた。
- source_word: ἄμωμος
  choice: 傷のない
  rationale: 欠陥や非難される点がないことを表す語を、直前の具体的な清さのイメージと、犠牲的な完全性の含意の双方を残す形で訳した。
theological_decisions:
- issue: 夫キリストと教会の比喩における再帰的な提示
  choice: 「キリストご自身が…ご自分の前に立たせ」とし、強意と再帰性の双方を保持した。
  alternative: 単に「教会を立たせる」とする、または神の前への終末的提示と明示する。
  rationale: ギリシア語はαὐτόςとἑαυτῷをともに明示する。誰の前への提示かを別の神学的構図へ解消せず、本文の緊張をそのまま残した。
- issue: 教会の清さを表す花嫁的・犠牲的イメージ
  choice: 「しみやしわ」と「聖く、傷のない」を併置した。
  alternative: 全体を道徳的な「非難されるところがない」に統一する。
  rationale: 本文は身体的・花嫁的な具体像と、聖さおよび無傷性の語彙を重ねているため、どちらか一方に狭めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、教会を人格化した婚姻的イメージと、聖さ・無傷性を表す荘重さを保った。「ご自身が／ご自分の前に」により原文の強意と再帰性を可視化した。
