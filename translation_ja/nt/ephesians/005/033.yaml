  source_fidelity: 本文は全体として原文の夫婦への個別的な勧めをよく伝えています。しかし、οὕτως（「このように」）が本文から省かれて脚注にのみ置かれており、脚注記号も該当語句に直接付いていません。また、φοβῆται は文脈上の敬意・畏敬の含みを本文では自然な「敬う」で示し、直訳的な「恐れる」は当該箇所の脚注で明示するのが、明瞭な現代標準日本語として適切です。
  naturalness: 「敬う」は「畏れ敬う」より現代語として平明でありつつ、単なる対等な評価以上の敬意を表せます。「一人ひとり」を直接修飾する脚注、および「このように」を本文に置くことで、文の構造と照応関係も明瞭になります。
  terminology: γυνή／ἀνήρ は婚姻文脈に即して「妻／夫」とします。φοβέομαι は「敬う」と訳し、脚注で「恐れる」という字義と畏敬を伴う意味領域を示します。
