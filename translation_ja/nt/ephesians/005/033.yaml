    rationale: 「このように」は前段の愛のあり方を指し戻す語であり、脚注だけで補うのではなく本文にも反映するのが原文への忠実さにかないます。
  - severity: medium
    issue: 脚注記号が該当する語句に付いていない
    rationale: 現行の[a][b]は文末に一括配置されており、「畏れ敬う」「一人ひとり」およびοὕτωςとの対応が不明瞭です。各注を対応する箇所に置く必要があります。
  - severity: low
    issue: 「畏れ敬う」は対象読者にやや古風
    rationale: 意味は可能ですが、明瞭な現代標準日本語では「敬う」のほうが自然です。原語のより字義的な「恐れる」と畏敬の含みは脚注で保持できます。
  revised_text: いずれにせよ、あなたがたも、一人ひとり[a]、自分の妻を自分自身のように、このように[b]愛しなさい。そして妻は、夫を敬いなさい[c]。
