id: EPH.5.33
reference: Ephesians 5:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: ja
  text: いずれにせよ、あなたがたも、一人ひとり[a]、自分の妻を自分自身のように、このように[b]愛しなさい。そして妻は、夫を敬いなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一人ひとり」は、この勧めが夫それぞれに個別に当てはまることを強調する原文の表現です。
    reason: source_emphasis
  - marker: b
    text: 「このように」は、前に述べられた仕方で愛することを指し示します。
    reason: cohesion
  - marker: c
    text: 「敬う」の原語は、字義的には「恐れる」とも訳せます。ここでは、恐怖というより、畏敬を伴う敬意・尊重の意味を含みます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: いずれにせよ
  rationale: 前段の神学的説明を受けて、実際的な総括へ移る語。単純な逆接に限定せず、結論的な移行を自然に示す。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: 読者自身もこの勧めの対象であるという強調を保つ。
- source_word: οἱ καθ’ ἕνα ἕκαστος
  choice: 一人ひとりが
  rationale: 各人に個別に当てはまるという重ねられた分配的表現を、自然な日本語で明示する。
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: 自分の妻を
  rationale: 婚姻の文脈における γυνή の意味と、ἑαυτοῦ の再帰的な所有関係を保つ。
- source_word: οὕτως
  choice: このように
  rationale: 直前までに述べられた愛し方を指し戻す語であるため、その照応を脚注で明示する。本文では「自分自身のように」と続くため、重複を避けて自然にまとめる。
- source_word: ἀγαπάτω
  choice: 愛しなさい
  rationale: 三人称単数の現在命令形を、現代日本語の明確で品位ある命令表現で訳す。
- source_word: ὡς ἑαυτόν
  choice: 自分自身のように
  rationale: 自己を比較基準とする原文の簡潔な表現を保持する。
- source_word: ἡ δὲ γυνὴ
  choice: そして妻は
  rationale: 対をなす第二の勧めへ移る δέ を、自然な接続として表す。
- source_word: ἵνα φοβῆται
  choice: 畏れ敬いなさい
  rationale: φοβέομαι の「恐れる」と「畏敬・尊重」の意味幅を保ちつつ、単なる恐怖と誤解されにくい表現を選ぶ。ἵνα と接続法が命令的に機能することを明確にする。
- source_word: τὸν ἄνδρα
  choice: 夫を
  rationale: 婚姻の文脈における ἀνήρ の意味を自然な日本語で示す。
theological_decisions:
- issue: 夫婦への勧めにおける φοβῆται の訳
  choice: 畏れ敬いなさい
  alternative: 恐れなさい／尊敬しなさい
  rationale: 原語には恐れ、畏敬、敬意という意味幅がある。「尊敬」だけでは語の強さを弱めうる一方、「恐れ」だけでは怯えや威圧を不必要に連想させうるため、「畏れ敬う」により敬意を伴う畏れを表し、脚注で幅を示す。
- issue: 性別を伴う単数形の婚姻上の勧め
  choice: 自分の妻……妻……夫
  alternative: 配偶者同士
  rationale: 原文が夫と妻を性別の明示された関係として語っているため、中性化せず保持する。
- issue: οὕτως の指示範囲
  choice: 前段の愛し方への照応として理解
  alternative: 直後の「自分自身のように」のみを指す
  rationale: 前文脈全体を受ける可能性と直後の比較への結びつきの双方がありうるため、本文で過度に限定せず脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の力を保ちながら威圧的・古風になりすぎない品位ある調子とした。「畏れ敬う」は聖書的な響きを残すが、現代の一般読者にも意味を推測できる表現である。脚注記号は該当箇所の直後に置いた。
