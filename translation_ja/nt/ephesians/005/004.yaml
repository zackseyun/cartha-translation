id: EPH.5.4
reference: Ephesians 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: ja
  text: また、卑わいなことや愚かな話、下品な冗談は、ふさわしいものではありません。むしろ、感謝を述べることです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρότης
  choice: みだらな言動
  rationale: 語義は恥ずべきこと、卑わいさ、品位を欠く言動を含みうる。周囲が発話に関する語であり、最後に感謝の表明と対照されるため、文脈上の発話的側面を示しつつ、行為まで完全には排除しない表現とした。
- source_word: μωρολογία
  choice: 愚かな話
  rationale: μωρός（愚かな）とλογία（話すこと）から成る語の意味を、現代日本語で明瞭かつ自然に表した。
- source_word: ἢ
  choice: や
  rationale: 列挙の最後の項目をつなぐ選言接続詞だが、日本語では禁止される事柄を累加的に自然に列挙するため「や」とした。
- source_word: εὐτραπελία
  choice: 下品な冗談
  rationale: 一般には機知を指す可能性もあるが、ここでは否定的な項目と並び「ふさわしくない」と評価されるため、不適切で品のない冗談という文脈上の意味を示した。
- source_word: ἃ οὐκ ἀνῆκεν
  choice: ふさわしくありません
  rationale: 先行する複数の事柄をまとめて受け、それらが適切でないことを述べる。日本語として簡潔で自然な述語にした。
- source_word: ἀλλὰ μᾶλλον
  choice: むしろ
  rationale: 先の不適切な言動に代わるものを強く対照して提示する機能を自然に表した。
- source_word: εὐχαριστία
  choice: 感謝を口にしなさい
  rationale: 名詞は感謝、感謝の表明を意味する。省略された勧告を日本語で明確にし、前半の発話に関する悪徳との対照を伝えるため、発話としての感謝を明示した。
theological_decisions:
- issue: αἰσχρότηςの範囲
  choice: 発話を中心にしつつ行為も排除しない「みだらな言動」とする
  alternative: 「卑わいな話」として発話だけに限定する、または「恥ずべきこと」として広く訳す
  rationale: 直後の二語と対照項のεὐχαριστίαは発話に強く関係する一方、αἰσχρότης自体はより広い恥ずべき言動を指しうるため、その緊張を残した。
- issue: εὐτραπελίαの道徳的評価
  choice: 「下品な冗談」と否定的に訳す
  alternative: 「機知」「しゃれ」のように中立的または肯定的に訳す
  rationale: 語そのものには機知という用法もあるが、本節では悪徳の列挙に置かれ、「ふさわしくない」と明示されているため、文脈上の否定的意味を採った。
- issue: εὐχαριστίαの統語上の補足
  choice: 「感謝を口にしなさい」と勧告として明示する
  alternative: 原文の名詞的対照を保ち「むしろ感謝です」とする
  rationale: 原文は省略を伴う簡潔な名詞対照だが、日本語で「むしろ感謝」とだけすると意味が不明瞭になる。命令の力は前後の勧告文脈とἀλλὰ μᾶλλονによる代替の対照から補ったもので、感謝の対象を特定してはいない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、節全体を丁寧体で整えた。「みだらな言動」はαἰσχρότηςの広がりと発話文脈の双方を保つ。「感謝を口にしなさい」は日本語で省略を補う動的要素を含むが、神学的な対象や内容は付加していない。
