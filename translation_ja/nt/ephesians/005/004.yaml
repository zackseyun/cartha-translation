  to: また、卑わいなことや愚かな話、下品な冗談は、ふさわしいものではありません。むしろ、感謝を述べることです。
  rationale: 本文の名詞的対照を保つため、εὐχαριστίαを命令文ではなく「感謝を述べることです」としました。αἰσχρότηςは「卑わいなこと」として、文脈上の不適切な発話との関係を損なわずに、原語が持つより広い意味の可能性を残しました。脚注アンカーはそれぞれ「下品な冗談」と、列挙全体を受ける「ふさわしいものではありません」に置きます。
