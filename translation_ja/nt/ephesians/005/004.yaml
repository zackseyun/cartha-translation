  terminology: εὐτραπελία の「下品な冗談」は文脈上適切です。μωρολογία の「愚かな話」も適切です。αἰσχρότης は、特定の性的な「みだらさ」に寄せず、「卑わいなこと」とするのが語義の幅と文脈の双方により安全です。
