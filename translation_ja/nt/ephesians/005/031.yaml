id: EPH.5.31
reference: Ephesians 5:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: ja
  text: このため[a]、男は父と母を離れて妻と結ばれ、二人は一つの肉となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことのために」。ギリシア語のἀντὶ τούτουは、ここでは創世記の引用を理由・結果の関係で導いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: このため
  rationale: 創世記2章24節の引用を導く理由・結果のつながりを、現代日本語で自然に示す。ここでのἀντί＋属格は、単純な代替を表す「これの代わりに」ではない。
- source_word: καταλείψει
  choice: 離れて
  rationale: 親を見捨てるという感情的含意を加えず、親のもとを離れて新しい夫婦の結びつきに入ることを表す。ギリシア語の未来形は、日本語では引用文中の一般的・規範的な叙述として自然な非過去形で表した。
- source_word: ἄνθρωπος
  choice: 男
  rationale: ἄνθρωποςは一般に「人」を意味し得るが、ここでは「その妻」と対をなし、結婚する男性を指しているため、性別を明示した。
- source_word: πατέρα καὶ τὴν μητέρα
  choice: 父と母
  rationale: 原文の家族関係を簡潔で自然な日本語にした。所有関係は主語との文脈から明らかなため、「自分の」を補わない。
- source_word: προσκολληθήσεται
  choice: 妻と結ばれ
  rationale: 密接に付く、結合するという受動形の意味を保ちつつ、結婚の文脈にふさわしい自然で格調ある表現とした。単に物理的に「くっつく」とはしない。
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: 妻
  rationale: γυνήは「女」または「妻」を意味するが、この結婚の文脈では「妻」が明確である。
- source_word: ἔσονται οἱ δύο
  choice: 二人は…となる
  rationale: 字義的には「二人は…であるようになる／…となる」。結合の結果を自然な日本語で示し、原文で明示された「二人」を保持した。
- source_word: εἰς σάρκα μίαν
  choice: 一つの肉
  rationale: 創世記から受け継がれた結婚の結合を表す聖書的表現を保持した。「一つの体」として意味を狭めず、σάρξを「肉」と訳した。
theological_decisions:
- issue: 結婚の引用における性別表現
  choice: 男…妻
  alternative: 人…配偶者
  rationale: 創世記2章24節の引用で、原文は妻と結ばれる男性を描いている。性別を中立化せず、原文の男女の組み合わせを保った。
- issue: εἰς σάρκα μίανにおけるσάρξの訳
  choice: 一つの肉
  alternative: 一つの体
  rationale: ここでのσάρξは罪深い性質を表す比喩ではなく、創世記に由来する身体的・関係的な結合の表現である。後代の神学的意味を持ち込まず、原文の比喩を保持した。
- issue: προσκολληθήσεταιの受動的表現
  choice: 結ばれ
  alternative: 結びつき
  rationale: 原文の受動形を反映し、誰が結ぶのかを訳文で特定しないことで、神的受動か単なる結合かという含みを不必要に決めない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書引用としての簡潔さと格調を保った。「一つの肉」は日常語としては特殊だが、原文の比喩と聖書間のつながりを保持するため採用した。
