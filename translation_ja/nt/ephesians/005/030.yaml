translation:
  language: ja
  text: 私たちはキリストの体を構成する部分だからです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「キリストの肉と骨から成る」と付け加えています。
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: だからです
  rationale: 直前の述べられた事柄の根拠を示す接続詞。日本語では文末の「だからです」とすることで、因果関係を明確かつ自然に表す。
- source_word: μέλη
  choice: 一部
  rationale: 身体を構成する部分を指す複数名詞。ここではパウロの共同体的な身体比喩を保ちつつ、現代日本語で自然な「体の一部」とした。
- source_word: ἐσμὲν
  choice: 私たちは…です
  rationale: 一人称複数・現在形の存在表現を、自然な日本語の判断文として訳した。
- source_word: τοῦ σώματος
  choice: 体の
  rationale: 教会とキリストの結びつきを表す身体比喩を、直接的な「体」で保持した。
- source_word: αὐτοῦ
  choice: キリストの
  rationale: 代名詞の指示対象は文脈上キリストである。日本語では「彼の」よりも指示対象を明示するほうが自然で誤解がないため、固有の指示対象を補った。
theological_decisions:
- issue: 「その肉、その骨の一部である」という長い異読を本文に含めるか
  choice: SBLGNTの短い本文だけを訳し、長い異読は脚注に記す。
  alternative: 私たちはキリストの体、その肉、その骨の一部だからです。
  rationale: 指定されたギリシャ語本文には長い句がないため本文には加えない。一方、写本上の異読として読者に透明性を確保するため脚注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語。「肢体」は教会用語としては定着しているが、一般読者には古風または不透明になり得るため、「体の一部」を採用した。文脈上の指示対象を明確にするため、αὐτοῦは「キリストの」とした。
