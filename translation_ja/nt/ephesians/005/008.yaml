  text: ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: ja
  text: というのも、あなたがたはかつて闇でしたが、今は主にあって光だからです。光の子どもとして歩みなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 意訳「光の子どもとして生きなさい」。原文は「歩みなさい」であり、パウロが生き方を表すためによく用いる比喩です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: でした
  rationale: εἰμίの未完了過去で、過去の状態を直接表す。
- source_word: γάρ
  choice: （訳文では独立した接続語を置かない）
  rationale: 前文への説明・根拠を示すが、日本語では文脈上明らかな場合、独立した「というのも」を置かないほうが自然である。意味上のつながりは保たれる。
- source_word: ποτε
  choice: かつては
  rationale: 過去と現在の対比を簡潔かつ自然に示す。
- source_word: σκότος
  choice: 闇
  rationale: 前置詞のない述語名詞であり、単に「闇の中にいた」とせず、原文の強い同一性・状態の比喩を保つ。
- source_word: νῦν δὲ
  choice: しかし今は
  rationale: 以前の状態と現在の状態との鮮明な対照を表す。
- source_word: φῶς
  choice: 光
  rationale: σκότοςと同様に述語名詞として訳し、「光の中にいる」などに弱めず比喩の力を保つ。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 主との結びつき、また主を領域とするパウロ的表現を簡潔に保つ。「主によって」と因果に限定しない。
- source_word: ὡς
  choice: として
  rationale: 単なる類似ではなく、光の子どもという身分・性質にふさわしい生き方を示す日本語として自然。
- source_word: τέκνα φωτός
  choice: 光の子ども
  rationale: τέκναの性別を限定しない意味を保ち、属格の比喩的表現も維持する。
- source_word: περιπατεῖτε
  choice: 歩みなさい
  rationale: 現在命令形の継続的な倫理的 exhortation を表しつつ、パウロに特徴的な「歩む」という生活の比喩を保つ。
theological_decisions:
- issue: 「かつては闇、今は光」という比喩的な同一性表現
  choice: 「かつては闇でした。しかし今は、主にあって光です」
  alternative: 「かつては闇の中にいましたが、今は光の中にいます」
  rationale: 原文は前置詞句ではなくσκότοςとφῶςを述語名詞として用いる。環境の変化だけでなく、人の状態・あり方の変化を語る強い表現を保つ。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: 新約聖書における神学的な響きを保ち、意味を狭く限定しない標準的な訳語である。
- issue: ἐν κυρίῳの関係性
  choice: 主にあって
  alternative: 主によって
  rationale: 手段や原因だけに限定せず、主との結びつき・領域という原文の幅を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「闇」「光」という原文の簡潔で強い比喩を維持し、「歩みなさい」は本文に残して脚注で意味を説明した。
