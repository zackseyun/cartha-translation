id: EPH.5.3
reference: Ephesians 5:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: ja
  text: しかし、性的不道徳も、あらゆる汚れも、貪欲[b]も、あなたがたの間では、口にされることさえあってはなりません[a]。それが聖なる者たち[c]にふさわしいことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの間では、その名さえ挙げられてはなりません」。
    reason: lexical_alternative
  - marker: b
    text: 「貪欲」は「むさぼり」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「聖なる者たち」とは、後代に列聖された一部の人々ではなく、神の民として聖別された信者たちを指します。
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: 性的不道徳
  rationale: 不正な性行為を広く指す語であり、婚前性交など一種類に狭めず、現代日本語で意味が明瞭になるようにした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の勧めとの穏やかな対照・転換を示す接続として訳した。
- source_word: ἀκαθαρσία πᾶσα
  choice: あらゆる汚れ
  rationale: πᾶσαの包括性を保ち、道徳的な不潔・汚れを広く表す表現とした。
- source_word: ἢ
  choice: も
  rationale: 列挙された禁止対象を日本語として自然につなぎつつ、各項目を並列させた。
- source_word: πλεονεξία
  choice: 貪欲
  rationale: より多くを得ようとする飽くことのない欲望を表す。文脈上、性的欲望だけに限定しなかった。
- source_word: μηδὲ ὀνομαζέσθω
  choice: 口にされることさえあってはなりません
  rationale: 受動命令の強い禁止とμηδέの「さえ」を保つ。単に語彙として言及することの禁止と断定せず、共同体にそのような悪が話題となる形で存在してはならないという含みも残した。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間では
  rationale: 個人の内面ではなく、信者の共同体の中を指す表現として訳した。
- source_word: καθὼς πρέπει
  choice: ふさわしく
  rationale: 身分にかなった適切さという倫理的基準を簡潔に表した。
- source_word: ἁγίοις
  choice: 聖なる者たち
  rationale: 神のために分かたれた信者全体を指す意味を明示し、後代の列聖制度に限定される「聖人」という受け取られ方を避けた。
theological_decisions:
- issue: 性的な悪徳と並ぶπλεονεξίαの意味
  choice: 広い意味の「貪欲」とした。
  alternative: 「むさぼり」、または性的な貪欲に限定する訳
  rationale: 周辺文脈は性倫理を扱うが、この語自体を性的欲望だけに限定する明示的根拠はなく、パウロ書簡でのより広い道徳的意味を保った。
- issue: ἁγίοιςが指す人々
  choice: 信者全体を指す「聖なる者たち」とした。
  alternative: 「聖徒たち」または「聖人たち」
  rationale: 神に属する者として聖別された共同体という意味を示し、後代に列聖された特定の人々という意味を持ち込まないため。
- issue: 「名を挙げるな」という命令の射程
  choice: 「口にされることさえあってはならない」とし、言及と共同体内での悪評の両方を含み得る表現にした。
  alternative: 「その名さえ挙げてはならない」
  rationale: ὀνομαζέσθωは字義的には「名を挙げられる」だが、この文脈では悪徳が共同体内に存在して話題になることまで含み得る。訳文で一方だけに狭めず、注で代案を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。悪徳の列挙は簡潔な並列とし、命令は共同体全体への強い勧告として丁寧体で表現した。末尾の「そうしなさい」は、原文の省略された主節との関係を日本語で補うための最小限の補足だが、直前の禁止命令に自然につながるようにした。
