  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 多くの訳は、21節から「従いなさい」を補って、「妻たちは、自分の夫に、主に対するように従いなさい」と訳します。ギリシア語の22節自体には動詞がなく、直前の句に依存する省略構文です。
    reason: 原文の省略構文と、文脈から補われる意味を説明するため。
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: 妻たちは
  rationale: 家庭に関する勧めの文脈と「自分の夫」という対応表現から、一般的な「女たち」ではなく、婚姻関係を示す「妻たち」とした。主題を示す日本語の「は」により、原文の省略構文も自然に保つ。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 自分の夫に対して
  rationale: ἀνήρ はここでは「夫」を意味し、ἰδίοις はそれぞれの具体的な婚姻関係を示すため「自分の」を残した。動詞が省略されている日本語文で関係を明瞭にするため、与格を「に対して」とした。
- source_word: ὡς
  choice: 〜ように
  rationale: 比較の内容を限定しすぎず、原文の簡潔な比較を自然な現代日本語で表す。
- source_word: τῷ κυρίῳ
  choice: 主に対する
  rationale: パウロ書簡のこの文脈では κύριος は主イエスを指す。「夫に対して」との構文上の対応を明確にするため「主に対する」とした。
- source_word: implicit verb from context
  choice: 本文では補わない
  rationale: 22節自体には動詞がなく、21節の ὑποτασσόμενοι（従い合い）に依存する。原文の省略を保持し、補われる意味は脚注で示す。
theological_decisions:
- issue: 22節にない「従いなさい」を本文で補うか
  choice: 本文では動詞を補わず、省略構文を保つ。
  alternative: 妻たちは、自分の夫に、主に従うように従いなさい。
  rationale: 意味は21節から補えるが、22節のギリシア語本文には動詞が明記されていない。本文で補うと命令形など原文以上の文法的限定を加えかねないため、省略を保ち、脚注で統語関係を説明する。
translation_notes:
