  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: ja
  text: しかし、すべてのものは、光によって明るみに出されると、明らかになります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「光によって明るみに出されるものは、すべて明らかになります」。ギリシア語の分詞と動詞は密接に関係しており、明るみに出す働きに重点を置くことも、その結果として明らかになることに重点を置くこともできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: すべてのもの
  rationale: 冠詞を伴う中性複数形の包括的な範囲を保ち、「すべて」だけよりも文の主語として明確にした。
- source_word: δὲ
  choice: しかし
  rationale: 前節からの穏やかな対照と展開を示す。
- source_word: ἐλεγχόμενα
  choice: 明るみに出されると
  rationale: ἐλέγχωには「責める」「暴く」などの意味があるが、光が作用主体であり、φανεροῦταιが続くため、ここでは隠れていたものが露わにされる意味を自然な日本語で表した。受動の意味も保持している。
- source_word: ὑπὸ τοῦ φωτὸς
  choice: 光によって
  rationale: 属格を伴うὑπόが作用主体を示すことを「によって」で表し、文脈上の定冠的な「光」をそのまま保持した。
- source_word: φανεροῦται
  choice: 見えるものとなります
  rationale: 受動形の結果的意味を反映し、光の比喩に即して、抽象的な「明らかにされる」より可視性を明確にした。
theological_decisions:
- issue: 「光」の指示対象
  choice: 節内では単に「光」とし、指示対象を限定しない。
  alternative: キリスト、福音、道徳的真理、または信者共同体の証しと明示する。
  rationale: 直前の文脈には複数の関連する含意があるが、この節自体は「光」の指示対象を明示していないため、比喩の幅を保った。
- issue: 分詞と主動詞の統語的関係
  choice: 「すべてのものは、光によって明るみに出されると、見えるものとなる」と理解する。
  alternative: 「光によって明るみに出されるものは、すべて見えるものとなる」と理解する。
  rationale: ギリシア語は両者が近接した意味をなし、重点の置き方に幅がある。本文ではτὰ πάνταの包括性を前面に出し、別の係り方を脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「明るみに出す」と「見えるものとなる」を使い分け、原文にある露呈と可視化の密接な関係を保った。
