translation:
  language: ja
  text: メシアを恐れつつ[a]、互いに従いなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアを畏れつつ」または「メシアへの畏敬をもって」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「従いなさい」は分詞形で、直前の文に続いて「互いに従いつつ」とも訳せる。Χριστόςは伝統的には「キリスト」と訳される。
    reason: grammar_and_alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: 従いなさい
  rationale: 現在分詞で、直前の命令とそれに続く分詞の連なりに依存する。日本語では文脈上の勧告を自然に伝えるため命令形とした。ただし、原文が分詞であることは脚注で明示した。
- source_word: ἀλλήλοις
  choice: 互いに
  rationale: 与格の相互代名詞であり、共同体の成員相互の関係を明確に表す。
- source_word: ἐν φόβῳ
  choice: 恐れつつ
  rationale: ἐν＋与格が表す状況・態度を、日本語では自然な付帯状況として表現した。φόβοςの基本的な強さを保ち、「敬意」だけに弱めなかった。
- source_word: Χριστοῦ
  choice: メシアを
  rationale: 属格を、恐れの向かう対象として自然な日本語の目的語で表した。Χριστόςはここで称号として理解できるため「メシア」とした。
theological_decisions:
- issue: 「メシアへの恐れ」の意味
  choice: メシアに向けられた、畏敬を含む恐れ
  alternative: メシアによって生じる恐れ／メシアへの敬意
  rationale: 属格は最も自然には恐れの対象を示す。本文では「恐れ」という強い語を保ちつつ、脚注で「畏れ」「畏敬」の意味域も示し、単なる恐怖とも単なる礼儀とも断定しない。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての働きが認められるため意味を訳した。伝統的な音訳は脚注に残した。
- issue: 分詞ὑποτασσόμενοιと前文の関係
  choice: 日本語本文では文脈上の勧告として「従いなさい」
  alternative: 「互いに従いつつ」
  rationale: ギリシア語は分詞で前の命令的文脈に連なる。単独節としての明瞭さを優先しながら、統語上の連続性と解釈の余地を脚注に保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語。共同体への勧告として端正な調子を保った。「恐れ」は原語の緊張を残し、「メシア」は称号として訳した。
