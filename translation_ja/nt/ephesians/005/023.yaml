id: EPH.5.23
reference: Ephesians 5:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: ja
  text: というのも、夫は妻のかしらであり、メシアも教会のかしらで、ご自身がその体の救い主だからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「かしら」はギリシア語の比喩をそのまま表したものです。ここでは、権威、卓越性、または源を意味すると解釈されることがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: であり
  rationale: 前節の勧めの根拠を示す接続関係は、日本語では文脈と「それは」による説明の流れで自然に表した。必要に応じて「なぜなら」とも訳せる。
- source_word: ἀνήρ / γυνή
  choice: 夫／妻
  rationale: 夫婦への勧めという直近の文脈から、一般的な「男／女」ではなく婚姻関係を表す。
- source_word: κεφαλή
  choice: かしら
  rationale: ギリシア語の身体的比喩を保持し、「権威者」「源」など論争のある特定の解釈に限定しない。
- source_word: ὡς καὶ
  choice: それは…のと同じです
  rationale: 夫婦関係とメシア・教会の関係との類比を明確にしつつ、両者の完全な同一視は避ける。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは称号としての意味が生きているため、「メシア」とした。
- source_word: ἐκκλησία
  choice: 教会
  rationale: パウロ書簡における贖われた共同体を指す、この文脈で最も明瞭な現代日本語。
- source_word: αὐτὸς
  choice: メシアご自身
  rationale: 強意を保ち、救い主である方を明確に示す。
- source_word: σωτήρ
  choice: 救い主
  rationale: 救出と救済の意味を保つ、自然で定着した訳語。
- source_word: σῶμα
  choice: その体
  rationale: 教会を体にたとえるパウロの比喩を維持する。「その」は日本語上の指示を明瞭にするが、所有を過度に補わない。
theological_decisions:
- issue: κεφαλήの意味
  choice: 比喩を「かしら」として保持する
  alternative: 源／指導者／権威を持つ者
  rationale: 語の解釈には議論があるため、本文で一つに決めず、原文の比喩と神学的緊張を残した。
- issue: αὐτὸς σωτὴρ τοῦ σώματος の統語関係
  choice: 独立性のある説明文「メシアご自身が、その体の救い主なのです」
  alternative: 「その体の救い主であるメシアご自身も」と比較構文に密接に組み込む
  rationale: 簡潔な同格的名詞句の強調を自然な日本語で表しつつ、メシアと「救い主」との結び付きを明確にした。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号性を明示するため。ただし日本語教会用語としては「キリスト」も可能。
translation_notes:
  register: 明瞭で現代的かつ品位のある「です・ます」調。説明を担うὅτιは不自然な「なぜなら」の反復を避け、文の論理関係として表現した。本文中の脚注記号[a]は対応箇所に置いた。
