  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: ja
  text: また、酒に酔ってはいけません。そこには放縦があります。むしろ、御霊に満たされなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御霊によって満たされなさい」または「御霊において満たされなさい」とも訳せる。「霊」を人の霊と理解する見方もある。
    reason: πνεύματιの指示対象とἐνの意味関係に解釈上の幅があるため。
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: 酔ってはいけません
  rationale: μήを伴う現在命令形の禁止を、現代日本語で自然に表した。「酔った状態でいてはならない」よりも簡潔で、酩酊に至ることとその状態の双方を含み得る。
- source_word: οἴνῳ
  choice: 酒に
  rationale: 与格は酩酊をもたらす飲み物を示す。「ぶどう酒で」より自然な日本語を優先しつつ、文脈上の酒を明示した。
- source_word: ἐν ᾧ
  choice: それには
  rationale: 関係代名詞が直前の酒を受ける構造を保ち、酒に酔うこととの結びつきも日本語で不自然にならないようにした。
- source_word: ἀσωτία
  choice: 放縦
  rationale: 浪費的で節度を失った生活・行動という倫理的含意を、簡潔で品位ある語によって表した。
- source_word: πληροῦσθε
  choice: 満たされなさい
  rationale: 受動態の命令をそのまま保持した。現在形の継続・反復的な含みは、日本語で「いつも」などを補わず文脈に委ねた。
- source_word: ἐν πνεύματι
  choice: 御霊に
  rationale: 文脈上、聖霊を指す可能性が最も高いため「御霊」とした。「に」は満たすもの・働きかける主体・領域の関係を過度に限定せず表せる。別解は脚注に残した。
theological_decisions:
- issue: πνεύματιの指示対象とἐνの機能
  choice: 御霊に満たされなさい
  alternative: 御霊によって満たされなさい／霊において満たされなさい／霊に満ちた者となりなさい
  rationale: パウロ書簡の文脈では聖霊を指す理解が有力だが、ギリシア語には冠詞がなく、ἐνも手段・領域など複数の関係を表し得る。本文では有力な理解を採り、曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用い、命令の対比を「むしろ」で示した。「放縦」は日常語よりやや格調があるが、ἀσωτίαの道徳的・生活的な無節制を簡潔に伝える語として採用した。
