id: EPH.5.32
reference: Ephesians 5:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: ja
  text: この奥義は偉大です[a]。しかし私は、メシアと教会について語っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この奥義は深遠です」とも訳せます。ギリシア語は直訳すると「大きい、偉大な」で、深さだけでなく、その重要性や偉大さを表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: 奥義
  rationale: パウロ書簡では、単なる不可解な謎ではなく、かつて隠され、神によって明らかにされた真理を指すことが多い。「奥義」はその用法と神学的重みを簡潔に保つ。
- source_word: μέγα
  choice: 偉大です
  rationale: 基本義である「大きい、偉大な」を保ち、「深遠」として意味を知的な深さに限定しない。日本語として理解できる範囲で原文の簡潔さを優先した。
- source_word: δὲ
  choice: しかし
  rationale: 前半の宣言から、パウロが何を念頭に置いて語っているかという説明への、穏やかな対照と転換を示す。
- source_word: λέγω
  choice: 語っているのです
  rationale: 現在形の継続的な語調を保ちつつ、後続する説明を自然な現代日本語で示す。「意味している」と断定するより、原文の発話動詞を維持する。
- source_word: εἰς
  choice: について
  rationale: λέγωに続くこの用法は方向ではなく言及の対象を示すため、自然な日本語の「について」とした。反復された二つのεἰςは、複合対象を結ぶ日本語では一度の「について」で明瞭に表せる。
- source_word: Χριστόν
  choice: メシア
  rationale: ここでは固有名のような「キリスト」よりも称号としての働きが明瞭であるため、「メシア」とした。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: この文脈では、市民集会一般ではなく、神の民の共同体を指すパウロ的用法であり、「教会」が最も明瞭である。
theological_decisions:
- issue: 「この奥義」が何を指すか
  choice: 結婚そのもの、創世記2章24節の引用、またはメシアと教会を指し示す婚姻の予型的意義のいずれかに限定せず、原文どおり「この奥義」とする。
  alternative: 「この奥義」を、夫婦の一体性またはメシアと教会の結合のみに特定して訳す。
  rationale: 原文はまず「この奥義は偉大」と述べ、その後にメシアと教会について語っていると説明する。指示対象の解釈上の幅を翻訳で狭めず、この展開と神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、聖書本文にふさわしい簡潔で品位ある語調とした。「奥義」は日常語ではないが、パウロにおけるμυστήριονの意味を「謎」に矮小化せずに保つ定着語として採用した。
