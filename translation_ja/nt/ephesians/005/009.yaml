  source_fidelity: 本文の「光の実」と異読脚注はSBLGNTのφωτόςと整合し、γάρの説明的機能も保持している。ただし、「善と義と真実となって現れる」は、ἐν＋与格が示す領域・現れ方を、実が三つの性質そのものに変化するかのように表しうる。
  naturalness: 「あらゆる善と義と真実に現れる」は、現代標準語として明瞭であり、三つの徳目が光の実の現れる領域・様態であることを自然に示す。文頭の「というのは」は、前節に従属するγάρを日本語で読みやすく表す。
  terminology: 「光の実」「善」「義」「真実」はいずれも適切である。「義」の脚注で「公正」を保持することも妥当である。異読の「御霊の実」も、本文と混同しない簡潔な表記でよい。
