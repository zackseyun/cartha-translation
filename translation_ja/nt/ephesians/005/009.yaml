  text: ὁ γὰρ καρπὸς τοῦ ⸀φωτὸς ἐν πάσῃ ἀγαθωσύνῃ καὶ δικαιοσύνῃ καὶ ἀληθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/009.yaml
  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: ja
  text: というのは、光の実[a]は、あらゆる善と義[b]と真実に現れるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異読：「御霊の実」。
    reason: textual_variant
  - marker: b
    text: 「義」は「公正」または「正しさ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: からです
  rationale: 直前の勧めを説明する理由を示す接続辞として、文末表現により自然な日本語にした。
- source_word: καρπὸς
  choice: 実
  rationale: 道徳的・霊的な性質を生み出される実にたとえる比喩を保った。
- source_word: τοῦ φωτός
  choice: 光の
  rationale: 8節の「主にあって光」と直接つながる定冠詞付き属格を簡潔に表した。
- source_word: ἐν
  choice: となって現れる
  rationale: ここでは場所よりも、光の実がどのような性質において現れるかを示すと理解し、現代日本語として明瞭にした。字義に近い表現は脚注に残した。
- source_word: πάσῃ
  choice: あらゆる
  rationale: 抽象名詞とともに用いられた包括的な意味を表した。
- source_word: ἀγαθωσύνῃ
  choice: 善
  rationale: 親切だけに限定せず、道徳的な良さと善行を含み得る広い意味を保った。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: 神や人との関係における正しさと公正さの双方を含み得る語として「義」を採用し、別訳を脚注に示した。
- source_word: ἀληθείᾳ
  choice: 真実
  rationale: 客観的な真理と人の誠実さの両方を含み得る広さを保った。
theological_decisions:
- issue: 属格句の本文異読
  choice: 光の実
  alternative: 御霊の実
  rationale: SBLGNTのφωτόςを採用し、8節から続く光の主題を保った。伝承上重要な異読は脚注に示した。
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 公正、正しさ
  rationale: パウロにおける語の神学的・倫理的な幅を狭めず、「公正」という意味の可能性も脚注で保持した。
- issue: ἐνと三つの性質との関係
  choice: 善と義と真実となって現れる
  alternative: 善と義と真実のうちにある
  rationale: 光の実がこれらの性質の領域で示されるという意味を自然に表しつつ、構成要素を厳密に同定しすぎないよう「現れる」とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「光の実」というパウロの比喩と「義」の神学的な幅を保った。「となって現れる」は日本語の自然さを優先した最適等価訳であり、ἐνの形式的な対応は脚注で補った。
