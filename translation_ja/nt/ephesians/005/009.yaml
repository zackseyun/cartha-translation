  rationale: ἐνについての形式的な「～のうちにある」という脚注は、本文を「～に現れる」とする場合には必須ではなく、かえって本文と脚注の関係を不明瞭にするため削除した。「～に現れる」は、光の実が善・義・真実という領域で示されるという本文の意味を、変化・構成への限定なしに自然な日本語で表す。
