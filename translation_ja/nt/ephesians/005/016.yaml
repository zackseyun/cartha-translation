  text: making the most of the time[a], because the days are evil.
translation:
  language: ja
  text: 時を最大限に生かしなさい[a]。日々が悪に満ちているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「時を買い取りなさい」。また、「機会を逃さず十分に生かしなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: 最大限に生かしなさい
  rationale: 字義的には「買い取る／買い上げる」という比喩を含むが、この勧告の文脈では、与えられた時機を逃さず十分に活用する意味。現代日本語として自然な命令表現にし、分詞が前後の勧告に従属する働きを表した。
- source_word: τὸν καιρόν
  choice: 時
  rationale: καιρόςは単なる時間の経過よりも、ふさわしい時機・機会を指しうる。「時」として簡潔さを保ちつつ、その機会性は「最大限に生かす」と脚注で示した。
- source_word: ὅτι
  choice: だからです
  rationale: 勧告の理由を明示する接続表現として、現代日本語で明瞭に訳した。
- source_word: αἱ ἡμέραι
  choice: 今は…時代
  rationale: 直訳は「日々」だが、ここでは人々が置かれている現在の状況・時代を集合的に指す。「今は…時代」とすることで日本語として意味を明瞭にした。
- source_word: πονηραί
  choice: 悪い
  rationale: 道徳的な悪や敵対的な状況を含む語。「困難な」だけでは道徳的含意が弱まるため、「悪い」とした。
theological_decisions:
- issue: ἐξαγοραζόμενοιを救済論的な「贖う」と理解する可能性
  choice: 与えられた時機を十分に活用せよという実践的勧告
  alternative: 時を贖いなさい／時を買い取りなさい
  rationale: 動詞には買い取る比喩があるものの、この勧告的文脈で救済・贖罪を明示するとは限らない。本文では自然な実践的意味を採り、比喩的な別訳は脚注に保存した。
- issue: αἱ ἡμέραιの指示範囲
  choice: 現在の悪い時代・状況
  alternative: 日々そのものが悪い
  rationale: 日という時間単位自体を道徳的に断罪するのではなく、読者が生きる時代や状況を特徴づける表現と理解した。ただし「悪い」という原文の強さは保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語。「悪い時代」は原文の道徳的重みを保ち、「最大限に生かす」は字義的な商取引の比喩より文脈上の慣用的意味を優先した。脚注記号[a]は本文中に配置した。
