  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: ja
  text: ですから、愛されている子どもとして、神に倣う者となりなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神に倣う者でありなさい」。ギリシア語の命令形は、そのような者となることにも、そのあり方を続けることにも重点を置き得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ～者となりなさい
  rationale: γίνομαιの現在命令形が持つ、ある状態へと進み入る勧告の力を「となりなさい」で表した。継続的なあり方を命じる含みもあるため、脚注で別訳を示す。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる推論を示す。現代日本語として明快でありつつ、論理的なつながりを保つ。
- source_word: μιμηταὶ τοῦ θεοῦ
  choice: 神に倣う者
  rationale: μιμητήςの明示的な模倣・範とする意味を「倣う者」で自然に表した。「従う者」では模倣の意味が弱まる。属格 τοῦ θεοῦ は、日本語では対象を示す「神に」とするのが自然。
- source_word: ὡς
  choice: として
  rationale: 愛されている子どもという身分・あり方に即して命令を受ける意味を簡潔に保つ。理由を明示する「なのだから」とまでは訳さず、比較と根拠の間の含みを残す。
- source_word: τέκνα
  choice: 子ども
  rationale: 性別を限定しないτέκναを正確かつ自然に表す。
- source_word: ἀγαπητά
  choice: 愛されている
  rationale: 受けている愛を明確に示す表現。日本語で「愛する子ども」は親が愛する子とも子ども自身が愛するとも取り得るため、受動の意味を明示した。
theological_decisions:
- issue: 神の子どもであることと、神に倣う命令との関係
  choice: すでに愛されている子どもとして神に倣うよう勧められている、と読める訳にした。
  alternative: 愛されている子どもがするように神に倣う、という単純な比較として読むこともできる。
  rationale: ὡς τέκνα ἀγαπητά は命令の仕方または基盤を示し得る。「として」はその幅を保ち、模倣によって神の子どもになるという因果関係を持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用い、「倣う」で原文の模倣の主題を保った。「ですから」により前節との論理的連続を明示し、全体は簡潔で品位ある勧告調とした。
