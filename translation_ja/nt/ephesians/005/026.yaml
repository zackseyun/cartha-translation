  text: ἵνα αὐτὴν ἁγιάσῃ καθαρίσας τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: ja
  text: それは、キリストが教会を、みことばを伴う水の洗いによって清め、聖なるものとするためでした。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「みことばを伴う」は、「みことばによって」とも訳せます。また「みことば」は、「語られたことば」または「知らせ」を意味することもあります。
    reason: alternative_reading
  - marker: b
    text: 「水の洗い」は洗礼を思わせる表現ですが、原文だけでは、ここで洗礼の働きがどのように理解されているかまでは特定できません。
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: 〜するため
  rationale: 目的を導く接続詞の働きを、自然な現代日本語で明確に表す。
- source_word: αὐτὴν
  choice: 教会を
  rationale: 女性単数代名詞の指示対象は文脈上「教会」である。日本語では代名詞「彼女を」が不自然で誤解を招くため、指示対象を明示した。
- source_word: ἁγιάσῃ
  choice: 聖なるものとする
  rationale: 聖別するという意味を保ちつつ、一般の読者にも理解しやすい表現とした。
- source_word: καθαρίσας
  choice: 清め
  rationale: アオリスト分詞が表す、主動詞に伴い、論理上それに先立つ清めの行為を簡潔に示す。日本語では連用形が自然である。
- source_word: τῷ λουτρῷ τοῦ ὕδατος
  choice: 水の洗いによって
  rationale: λουτρόνの洗浄・沐浴の意味と、与格の手段的用法を保つ。「水で洗うこと」よりも原文の名詞構造に近い。
- source_word: ἐν ῥήματι
  choice: みことばを伴う
  rationale: ἐνの手段または付帯状況としての幅を残し、水の洗いとῥῆμαの関係を過度に限定しない。「みことば」は聖書的文脈で自然だが、特定の洗礼定式や教理には限定しない。
- source_word: ῥήματι
  choice: みことば
  rationale: 語られた言葉、言明、知らせという意味の幅を保持する。「福音」や「宣言」と特定することを避けた。
theological_decisions:
- issue: 水の洗いとみことばの関係、および洗礼との関連
  choice: 「みことばを伴う水の洗い」とし、洗礼を想起させる表現を保ちながら、特定の秘跡理解を本文で確定しない。
  alternative: 「みことばによる水の洗礼」または、洗礼との関連を排した純粋な比喩として訳す。
  rationale: 原文は水による洗いという洗礼的イメージを強く喚起するが、その働きや秘跡性の具体的理解までは文法だけで決まらないため。
- issue: ἁγιάσῃとκαθαρίσαςの関係
  choice: 「清め、聖なるものとする」と訳し、清めと聖化を区別しつつ密接に結び付ける。
  alternative: 両者を一つの概念にまとめて「清めて聖別する」とする。
  rationale: 二つの語の固有の意味と、分詞および主動詞の関係を保持するため。
- issue: ῥῆμαの意味範囲
  choice: 本文では「みことば」とする。
  alternative: 「知らせ」「語られたことば」「福音のことば」とする。
  rationale: 原語はより広い意味を持つため、福音宣教や洗礼時の定式などに限定しない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「彼女」を避けて文脈上の指示対象「教会」を明示した。「みことば」は教会的な語感を持つが、一般読者にも通じる表記であり、ῥῆμαの神学的響きと意味の幅を保つ。
