id: EPH.5.29
reference: Ephesians 5:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: ja
  text: というのも、かつて自分の肉体を憎んだ者は一人もいません。むしろ、それを養い、いたわります。メシアも同じように、教会を養い、いたわっておられます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳されます。原文では後半の「養い、いたわっておられます」に当たる動詞が省略されています。
    reason: 称号の伝統的な別訳と、原文の省略表現を示すため。
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: 自分の肉体を憎んだ者は、かつて一人もいません
  rationale: 否定を伴う ποτέ の普遍的な意味を「かつて一人も」と表し、γάρの説明的機能は日本語の自然な文脈上、独立した接続語を置かずに示した。
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: 自分の肉体
  rationale: σάρξはここでは罪深い性質ではなく、自分自身の身体的存在を指す。「肉」より明確で自然な「肉体」とした。
- source_word: ἐμίσησεν
  choice: 憎んだ
  rationale: μισέωの通常の強い意味を直接表す。
- source_word: ἐκτρέφει καὶ θάλπει
  choice: 養い、いたわります
  rationale: ἐκτρέφωの養育・滋養と、θάλπωの温かく優しい配慮を、自然で対をなす日本語で表した。
- source_word: καθὼς καὶ
  choice: も同じように
  rationale: 比較を示す καθώς と付加を示す καίの双方を自然に保持した。
- source_word: ὁ Χριστὸς
  choice: メシア
  rationale: 冠詞を伴う称号としての意味を明示した。日本語では「そのメシア」より「メシア」が自然である。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: パウロ書簡で神の民の共同体を指す慣用的かつ明瞭な訳語を用いた。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは冠詞を伴い称号として機能するため、語義を伝える「メシア」を本文に採用した。
- issue: σάρξの意味
  choice: 肉体
  alternative: からだ／肉
  rationale: この箇所は倫理的な「罪深い性質」ではなく、結婚と身体の比喩における文字どおりの身体的自己を指す。「肉体」はその意味を明瞭に伝える。
- issue: 後半節で省略された動詞の補充
  choice: 養い、いたわっておられます
  alternative: 教会にも同じようにされます
  rationale: 原文は動詞を省略しているが、日本語では具体的な動作を補うほうが自然であり、直前の二動詞だけを補って意味を限定しすぎない形で明示した。
translation_notes:
  register: 明瞭で現代的かつ格調を保った敬体。一般読者に不自然な逐語表現を避けつつ、身体の比喩、メシアという称号、後半の比較関係を保持した。
