  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: ja
  text: 詩と賛歌と霊的な歌をもって互いに語りかけ[a]、心から主に向かって歌い、調べを奏でなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの間で」または「自分たち自身に」。ここでのギリシア語の再帰代名詞は、一般に相互的な意味で「互いに」と理解されます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ほめ歌を歌いなさい」。ギリシア語は歌って賛美すること、または調べを奏でることを表し得ますが、楽器伴奏の有無を必ずしも特定しません。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: 語り合い
  rationale: 分詞の継続的・共同体的な働きを自然な現代日本語で表す。単なる会話に限定せず、歌を介して互いに語りかける意味を保つ。
- source_word: ἑαυτοῖς
  choice: 互いに
  rationale: 複数形の再帰代名詞が相互的に用いられていると理解するのが文脈上自然。ただし再帰的・共同体内的な読みも脚注に残す。
- source_word: ψαλμοῖς
  choice: 詩
  rationale: 歌われる宗教詩を指し、旧約の詩編を含み得るが、それだけに限定しない語として訳す。
- source_word: ὕμνοις
  choice: 賛歌
  rationale: 神をたたえる歌を表す標準的な現代日本語で、ψαλμοῖςおよびᾠδαῖςとの三項の区別を保つ。
- source_word: ᾠδαῖς πνευματικαῖς
  choice: 霊的な歌
  rationale: πνευματικαῖςがᾠδαῖςを修飾する形をそのまま保ち、「御霊に霊感された」とまで限定しない。
- source_word: ᾄδοντες
  choice: 歌い
  rationale: 基本的な語義を簡潔に表し、続くψάλλοντεςと関連しつつ区別される動作として残す。
- source_word: ψάλλοντες
  choice: ほめたたえなさい
  rationale: 新約時代の文脈で歌による賛美を表し得る語として訳し、楽器伴奏の有無を指定しない。日本語では「旋律を奏でる」より自然で礼拝的文脈に適する。
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: 心から
  rationale: 与格を様態として自然に表し、外面的な歌唱だけでなく内面を伴うことを示す。「心の中で」として無声音の行為に限定することを避ける。
- source_word: τῷ κυρίῳ
  choice: 主に向かって
  rationale: 歌と賛美の向けられる相手を明確にしつつ、κύριοςを文脈以上に「主イエス」と明示しない。
theological_decisions:
- issue: ψάλλοντεςと音楽実践の関係
  choice: 「ほめたたえなさい」とし、楽器伴奏を明示しない。
  alternative: 「旋律を奏でなさい」または「楽器を奏でなさい」
  rationale: ψάλλωは歴史的には弦を弾く意味を持ち得るが、この文脈では歌による賛美を表し、楽器を必須とも禁止とも定めない。教派的な音楽観を本文に持ち込まない。
- issue: 「主」の指示対象
  choice: 本文どおり「主」とする。
  alternative: 「主イエス」と明示する。
  rationale: エフェソ書の文脈ではキリストを指す可能性が高いが、この節自体はκύριοςとのみ述べるため、その表現を保つ。
- issue: πνευματικαῖςの意味
  choice: 「霊的な」とする。
  alternative: 「御霊に導かれた」または「御霊に霊感された」
  rationale: 御霊との関係を含み得る曖昧さを保ち、本文が明言しない特定の霊感概念に狭めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「詩・賛歌・霊的な歌」の三項を保持し、共同体内の相互性と主に向けられた心からの賛美を自然に表した。
