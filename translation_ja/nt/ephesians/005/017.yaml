source:
  edition: SBLGNT
  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: ja
  text: ですから[a]、愚かにならず、むしろ主のみこころが何であるかを理解しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このような理由で」。また、「愚かであってはならない」とも訳せるが、ギリシア語の動詞には「なる」という変化の含みがある。
    reason: 接続表現と動詞の語義上の別訳を示すため。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 直前の勧告を受けた推論・理由のつながりを、現代日本語で自然かつ明確に示す。
- source_word: μὴ γίνεσθε
  choice: 愚かな者にならず
  rationale: γίνομαι の「ある状態になる」という変化の含みを保ち、単に「愚かであるな」とはしなかった。
- source_word: ἄφρονες
  choice: 愚かな者
  rationale: 理解や実際的判断を欠くことを表し、後半の「理解しなさい」と明確な対照をなす。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 否定命令と肯定命令との強い対照を、日本語として自然に示す。
- source_word: συνίετε
  choice: 理解しなさい
  rationale: 内容を把握し、わきまえるよう求める命令を明瞭に表す。「見分けなさい」ほど解釈を狭めない。
- source_word: τί τὸ θέλημα
  choice: みこころが何であるか
  rationale: τί が導く間接疑問の構造を保ち、θέλημα を聖書日本語として定着しつつ平易な「みこころ」で表した。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: κύριος を通常の訳語「主」とし、本文が明示しない指示対象を「イエス」または「神」と限定しない。
theological_decisions:
- issue: 「主」（τοῦ κυρίου）の指示対象
  choice: 本文では単に「主」とする。
  alternative: 「主イエス」または「神」と明示する。
  rationale: 文脈上はイエスを指す可能性が高いが、この節のギリシア語自体は κύριος とだけ述べるため、その曖昧さを保った。
- issue: 禁止命令 μὴ γίνεσθε の力点
  choice: 「愚かな者にならず」とし、状態への変化を表す。
  alternative: 「愚かであってはならず」または「愚かなことをやめ」とする。
  rationale: γίνομαι の変化を表す語義を保持し、読者がすでに完全にその状態にあるとも、現在の行為を直ちに中止せよとも断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「みこころ」は宗教的に過度に硬い漢字表記を避けつつ、θέλημα の意味を簡潔に伝える。文全体は一つの対照構文として保った。
