translation:
  language: ja
  text: 何が主に喜ばれることかを吟味しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何が主に喜ばれることかを見極めなさい」または「確かめなさい」。
    reason: δοκιμάζοντεςには、試して吟味する、見極める、確かめるという意味の幅があるため。
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: 吟味しなさい
  rationale: 現在能動分詞で、周囲の勧告の流れに連なっている。文脈上、日本語では命令的に表し、「吟味する」によって、調べて価値や適否を確かめる能動的・評価的な含みを保った。
- source_word: τί
  choice: 何が…ことなのか
  rationale: 間接疑問を自然な現代日本語で表した。
- source_word: ἐστιν
  choice: …なのか
  rationale: 連結辞の働きを、日本語の間接疑問の構文に組み込んだ。
- source_word: εὐάρεστον
  choice: 喜ばれること
  rationale: 主にとって好ましく、受け入れられるものという意味を、関係性の含みを保つ自然な日本語で表した。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: εὐάρεστονに伴う与格を「主に」と訳した。κύριοςの指示対象は本文以上に特定せず、称号をそのまま保った。
theological_decisions:
- issue: κύριοςの指示対象
  choice: 主
  alternative: 主イエス／神
  rationale: ギリシャ語本文はκύριοςという称号のみを用いている。文脈上キリストを指す可能性が高いが、訳文では明示されていない指示対象を補わず、神学的な余地を保った。
translation_notes:
  register: 明瞭で現代的ながら、勧告としての品位を保つ文体。「吟味」は日常語よりやや改まっているが、δοκιμάζωの評価・検証の力を簡潔に伝える。
