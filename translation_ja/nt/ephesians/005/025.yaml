source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: ja
  text: 夫たちよ、メシアも教会を愛し、教会のためにご自分を差し出された[a]ように、自分の妻を愛しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分を引き渡された」。
    reason: παρέδωκεν は「引き渡す」とも訳せる。ここでは自らを他者のために委ねる意味で用いられている。
lexical_decisions:
- source_word: ἄνδρες
  choice: 夫たちよ
  rationale: 直後の γυναῖκας およびエフェソ5章22～33節の婚姻関係の文脈から、一般的な「男たち」ではなく、妻に対する「夫たち」を指す。呼格は「よ」で明示した。
- source_word: ἀγαπᾶτε
  choice: 愛しなさい
  rationale: 現在命令形の継続的な要請を、自然で明確な命令表現にした。後半の ἠγάπησεν との語彙的な対応も「愛する」で保った。
- source_word: τὰς γυναῖκας
  choice: 自分の妻
  rationale: 婚姻の文脈では「妻」を意味する。ギリシア語に所有代名詞はないが、夫たちへの呼びかけと定冠詞により、それぞれの妻を指すため、日本語では「自分の」を補うのが自然である。
- source_word: καθὼς καὶ
  choice: …も…のと同じように
  rationale: καθώς の比較と καί の付加・強調を保ち、キリストの愛が夫たちの愛の模範であることを自然な日本語で示した。
- source_word: ὁ Χριστός
  choice: キリスト
  rationale: Χριστός の称号としての意味を、日本語で定着している聖書用語「キリスト」で表した。日本語では冠詞に相当する語を置かないのが自然である。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: ここでは信者の共同体全体を指すパウロ書簡の神学的用法であり、日本語で定着した「教会」が最も明確である。
- source_word: ἑαυτὸν παρέδωκεν
  choice: ご自分を引き渡された
  rationale: 再帰代名詞による自発的な自己委譲と παραδίδωμι の「引き渡す」という意味を保持した。原文に明記されない贖罪の説明は加えていない。
- source_word: ὑπὲρ αὐτῆς
  choice: 教会のために
  rationale: ὑπέρ＋属格の「～のために／～に代わって」という利益・代理の含みを自然に表した。日本語では女性代名詞を使うと不自然になりやすいため、指示対象の「教会」を繰り返した。
theological_decisions:
- issue: Χριστόςを婚姻と教会の類比の中でどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、日本語では「キリスト」がその称号の標準的で広く理解される表現である。「メシア」も意味上可能だが、本文では自然さと定着度を優先した。
- issue: παρέδωκεν ὑπὲρ αὐτῆς の犠牲的含意の範囲
  choice: 教会のためにご自分を引き渡された
  alternative: 教会のためにご自分を差し出された
  rationale: キリストの自発的な自己委譲と教会のためという方向性を示しつつ、この節の語句を越えて特定の贖罪理論を付加しないようにした。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、命令には端的で品位のある「愛しなさい」を採用した。キリストへの敬意は「ご自分」「された」で表し、過度に古風な文語表現は避けた。
