  naturalness: 現行の末尾は不完結文であり、現代標準日本語として不自然である。比較節を命令に先行させることで、明瞭で自然な文になる。「ご自分を差し出された」は、この文脈で自発的な自己委譲を自然に表し、「引き渡された」よりも日本語で誤解なく読める。
  terminology: ἄνδρες／γυναῖκαςは婚姻関係の「夫たち」「自分の妻」、ἐκκλησίαは共同体としての「教会」とするのが適切である。ὑπὲρ αὐτῆςは指示対象を明示して「教会のために」と訳す。Χριστόςは英語POB監査記録のタイトル方針に合わせて「メシア」とする。
