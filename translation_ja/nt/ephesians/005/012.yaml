  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: ja
  text: 彼らがひそかに行っていること[a]は、口にすることさえ恥ずべきことだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らによってひそかに行われていること」。
    reason: 原文の受け身形をより形式的に反映した別訳。本文は同じ意味を自然な日本語の能動形で表している。
lexical_decisions:
- source_word: τὰ ... γινόμενα
  choice: 行っていること
  rationale: 冠詞を伴う現在分詞の実質名詞的用法を、現代日本語で自然な「こと」として表した。現在分詞の継続的な含みも「行っている」によって保っている。
- source_word: γὰρ
  choice: だからです
  rationale: 直前の勧告を理由づける説明的な接続を、節末の理由表現で自然に示した。
- source_word: κρυφῇ
  choice: ひそかに
  rationale: 人目を避け、隠れて行うという副詞的意味を、明快で自然な現代日本語で表した。
- source_word: ὑπ’ αὐτῶν
  choice: 彼らが
  rationale: ギリシア語では行為者を示すが、日本語では受け身の「彼らによって」より能動形の「彼らが」が自然であり、行為者も明確に保たれる。
- source_word: αἰσχρόν
  choice: 恥ずべきこと
  rationale: 道徳的に恥ずべき、また不名誉であるという評価を、過度に強めず明瞭に表した。
- source_word: καὶ λέγειν
  choice: 口にすることさえ
  rationale: καίの強意的・累加的な働きを「さえ」で示し、λέγεινは対象について語る意味に合う自然な日本語「口にする」とした。
theological_decisions:
- issue: αὐτῶνの指示範囲
  choice: 本文では「彼ら」とし、指示対象を具体化しない
  alternative: 「闇の業を行う者たち」など、文脈上の指示対象を補う
  rationale: 原文は代名詞のみを用いており、その指示対象は周囲の文脈から理解される。本文中で具体化すると、原文にない解釈を加えることになるため避けた。
- issue: γινόμεναとὑπ’ αὐτῶνの態の表現
  choice: 自然な日本語の能動形「彼らが…行っていること」
  alternative: 形式に近い受け身「彼らによって…行われていること」
  rationale: 行為者と行為の関係は変えず、日本語として不必要に硬い受け身を避けた。別訳を脚注に示して形式上の対応も確認できるようにした。
translation_notes:
  register: 明快な現代標準語を用いながら、倫理的な重みを保つため「恥ずべきこと」とした。「口にすることさえ」は自然でありつつ、原文の強意を明瞭に伝える。
