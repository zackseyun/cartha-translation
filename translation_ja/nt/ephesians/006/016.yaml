  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: ja
  text: あらゆる場合に、信仰の盾を取りなさい。その盾によって、悪い者[a]の火のついた矢[b]をすべて消すことができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪」。ギリシア語は抽象的な悪とも理解できるが、この戦いの文脈では人格的な「悪い者」の意味がよく合う。
    reason: alternative_reading
  - marker: b
    text: 「矢」に当たるギリシア語は、投げ矢などを含む飛び道具全般を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: あらゆる場合に
  rationale: 文脈上、武具を身に着けるべき「どんな状況でも」という副詞的な意味に取った。「すべてのものにおいて」という逐語訳より自然で、意味も明確である。
- source_word: ἀναλαβόντες
  choice: 取りなさい
  rationale: アオリスト分詞だが、直前から続く勧告に伴う行為を表すため、日本語では命令形にして勧告の力を明確にした。
- source_word: θυρεὸν τῆς πίστεως
  choice: 信仰の盾
  rationale: θυρεόςは大盾を指し得るが、比喩を簡潔に保つため「盾」とした。πίστιςはこの文脈では神に寄り頼む「信仰」が最も適切である。
- source_word: ἐν ᾧ
  choice: それによって
  rationale: 先行する「盾」を受け、手段を示す用法として自然な日本語にした。
- source_word: δυνήσεσθε
  choice: 消すことができます
  rationale: 未来形の能力・可能を表す意味を、現代日本語で自然な可能表現として示した。
- source_word: βέλη
  choice: 矢
  rationale: 広く飛び道具を指し得る語だが、火をつけて放つという軍事的比喩が明瞭に伝わる「矢」を本文に採用した。
- source_word: τοῦ πονηροῦ
  choice: 悪い者
  rationale: 定冠詞を伴う男性・中性属格単数で、霊的戦いの文脈では人格的な敵を指す理解が最も自然である。ただし抽象的な「悪」の可能性は脚注に残した。
- source_word: πεπυρωμένα
  choice: 火のついた
  rationale: 「火をつけられた」という完了受動分詞の像を、簡潔で自然な日本語で表した。
- source_word: σβέσαι
  choice: 消す
  rationale: 火を消し止める意味を、現代の一般読者に最も分かりやすい語で表した。
theological_decisions:
- issue: τοῦ πονηροῦが人格的な「悪い者」を指すか、抽象的な「悪」を指すか
  choice: 悪い者
  alternative: 悪
  rationale: 霊的な戦いと攻撃の比喩では人格的な敵と読むのが自然である一方、ギリシア語の形だけでは抽象的な理解を完全には排除できないため、別訳を脚注に示した。
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: ここでは神に寄り頼む信仰を防御の盾にたとえていると理解するのが文脈に最もよく合う。「忠実さ」も語義上はあり得るが、この箇所では可能性が低い。
translation_notes:
  register: 明瞭な現代標準日本語を用い、軍事的比喩の力強さと勧告の調子を保った。分詞は前後の勧告とのつながりを踏まえて命令形で表し、「が放つ」は属格関係を自然な日本語にするため補った。
