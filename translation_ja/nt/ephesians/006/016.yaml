  naturalness: 現行文は全体として自然であるが、「悪い者が放つ、火のついた矢」は読点による切れ方がやや不自然である。「その盾によって」「悪い者の火のついた矢」とすれば、照応と修飾関係が明瞭になり、現代標準日本語として滑らかになる。
  terminology: 「信仰」はπίστιςの適切な標準訳であり、「盾」もθυρεόςの比喩を損なわない。「悪い者」は人格的読解を表すが、やや一般的であるため、抽象的な「悪」の可能性を脚注に残すことが重要である。既存脚注はこれを適切に処理している。「矢」の脚注もβέληの広い語義を過不足なく示す。
