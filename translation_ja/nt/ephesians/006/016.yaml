  rationale: 修正は、原文に明示されない「放つ」を除き、τοῦ πονηροῦの属格関係をより忠実に保つためのものである。また、「その盾」により関係代名詞句ἐν ᾧが指す先行詞を明確にした。人格的読解と抽象的読解の両方を扱う脚注、およびβέληの語義範囲を示す脚注は維持した。
