id: EPH.6.13
reference: Ephesians 6:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: ja
  text: ですから、神の武具一式を身に着けなさい[a]。それは、悪しき日に立ち向かい[b][c]、すべてを成し遂げた上で[d]、しっかりと立つことができるようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「神の完全な武具」。原語は、兵士が用いる装備一式を指します。「神の」は、神のものであること、または神から与えられることを含み得ます。
    reason: lexical_alternative
  - marker: b
    text: 「抵抗し」または「立ちはだかり」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「悪しき日」は、特定の終末の日だけでなく、悪や試練が激しくなる時を広く指す可能性があります。
    reason: alternative_reading
  - marker: d
    text: 「すべてを行い終えた上で」とも訳せます。何を「すべて」とするかは、原文では明示されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 直前の勧めを受ける推論的な接続を、明瞭で自然な現代日本語で示す。
- source_word: ἀναλάβετε
  choice: 身に取りなさい
  rationale: 武具を取り上げて装備するという軍事的比喩を自然に表す。「身に着けなさい」より、原語の「取る」という動きを残した。
- source_word: τὴν πανοπλίαν τοῦ θεοῦ
  choice: 神の武具をすべて
  rationale: πανοπλίαが兵士の完全な装備一式を指すことを表すとともに、属格「神の」が所有・供与などのいずれかに限定されないよう保った。
- source_word: ἵνα δυνηθῆτε
  choice: できるためです
  rationale: 目的を表すἵνα節と、能力・可能を表すδύναμαιの双方を自然な日本語で示す。
- source_word: ἀντιστῆναι
  choice: 立ち向かい
  rationale: 敵対するものに抵抗して持ちこたえる軍事的含意を表し、後続のστῆναιとの「立つ」という語感の連なりもある程度保つ。
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: 悪しき日に
  rationale: 特定の終末の日とも、一般的な試練の時とも限定せず、原文の簡潔で開かれた表現を保つ。
- source_word: ἅπαντα κατεργασάμενοι
  choice: すべてを成し遂げた上で
  rationale: 必要なことをすべて行い終える、または成し遂げるという広い意味を保つ。「勝ち抜く」など結果を限定する表現は避けた。
- source_word: στῆναι
  choice: しっかりと立つ
  rationale: 単に直立するのでなく、戦いの中で持ち場を守って立ち続ける文脈上の力を、自然な日本語で示す。
theological_decisions:
- issue: 「悪しき日」の指示対象
  choice: 悪や霊的対立が激しくなる時として一般性を保つ
  alternative: 特定の終末の日、または個人的な試練の日に限定する
  rationale: 原文だけでは一つの時点に限定できないため、解釈上の幅を本文と脚注に残した。
- issue: 「神の武具」の属格の意味
  choice: 「神の」として広く保持する
  alternative: 神が所有する武具、または神が与える武具と明示する
  rationale: ギリシア語属格は所有・起源・供与などの関連する含意を許すため、特定の一義に狭めなかった。
- issue: ἅπαντα κατεργασάμενοιの達成内容
  choice: 「すべてを成し遂げた上で」とし、内容を明示しない
  alternative: すべてに勝利した後、または命じられたことをすべて行った後と限定する
  rationale: 分詞は遂行・達成を表し得るが、目的語ἅπανταの具体的内容は明示されていないため、勝利や従順のどちらかだけに限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。軍事的比喩を維持しつつ、古風すぎる「甲冑」や教派的連想の強い定型表現は避けた。「悪しき日」は聖書的な荘重さと原文の曖昧さを保つため採用した。
