  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: ja
  text: 好意を込めて仕えなさい。人にではなく、主に仕えるように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: 好意を込めて
  rationale: μετά＋属格は態度・仕方を表し、εὔνοιαは善意や進んで相手の益を願う心を指す。「好意を込めて」は内面的な姿勢を自然な現代日本語で表す。
- source_word: δουλεύοντες
  choice: 仕えなさい
  rationale: δουλεύωには奴隷として仕える含意があるが、直前の6章5節で対象が奴隷であることは明示されている。この節では奉仕の態度に焦点があるため、日本語では文脈に即して「仕える」とした。分詞は前節から続く勧告として命令形で表した。
- source_word: ὡς
  choice: 仕えるように
  rationale: 比較・態度を示すὡςを「ように」と訳し、人への奉仕を主に対するものとして行うという意味を保った。「あたかも」を加えると、主への奉仕が単なる仮定であるかのような余分な響きが生じうるため避けた。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: κύριοςはここで地上の主人たちと区別される神的な主、文脈上はキリストを指す。「主人」では対比が曖昧になるため「主」とした。
- source_word: ἀνθρώποις
  choice: 人に
  rationale: ἄνθρωποιはここで性別を限定するのでなく、主と対比される人間を指す。現代日本語の「人」はこの総称的意味を簡潔かつ正確に伝える。
theological_decisions:
- issue: κύριοςと地上の主人との対比
  choice: 主
  alternative: 主人
  rationale: キリストへの究極的な奉仕を表す称号を保ち、周辺文脈の地上の主人との混同を避ける。
- issue: δουλεύοντεςにおける奴隷身分の明示度
  choice: 仕えなさい
  alternative: 奴隷として仕えなさい
  rationale: 奴隷という身分は直前の文脈で明示されており、本節で繰り返すと原文以上に重くなる。この節の焦点である奉仕の態度を自然に示した。
- issue: ὡςの比較が示す奉仕の方向
  choice: 主に仕えるように
  alternative: 主に対するように
  rationale: 日本語では動詞を補うことで意味が明瞭になる。主への奉仕を仮想的なものと断定せず、原文の比較表現を保持する。
translation_notes:
  register: 明快な現代標準日本語としつつ、勧告としての品位を保った。原文は前節に従属する分詞句だが、単独節として自然に読めるよう命令文にした。語順は原文の対比を日本語で明瞭にするため、「人にではなく」を先に置いた。
