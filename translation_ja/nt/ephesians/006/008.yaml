revisions:
- from: あなたがたが知っているとおり、一人一人が、どんな良いことをしても、その報いを主から受けます。奴隷であっても、自由な人であっても同じです。
  to: あなたがたが知っているとおり、奴隷であっても自由な人であっても、一人一人は、自分が行うどんな良いことでも、その善い行いに応じたものを主から受けます。
  rationale: 不定関係節を「自分が行うどんな良いことでも」として譲歩的な曖昧さを避け、κομίσεταιの応答的な意味を「その善い行いに応じたものを…受けます」とした。原文にない「同じです」は削除し、奴隷／自由人の対比を原文どおり主文に従属させた。
