source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: ja
  text: あなたがたが知っているとおり、奴隷であっても自由な人であっても、一人一人は、自分が行うどんな良いことでも、その善い行いに応じたものを主から受けます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδότες
  choice: あなたがたが知っているとおり
  rationale: 前節の勧めを支える分詞であることを示しつつ、日本語として自然につなげた。因果関係を過度に明示する「知っているのだから」は避けた。
- source_word: ἕκαστος
  choice: 一人一人が
  rationale: 個々人それぞれに当てはまるという分配的な強調を保つ。
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: どんな良いことをしても
  rationale: ἄνを伴う不定関係節の「何であれ」という広がりと、ἀγαθόνの倫理的な「良い」を自然な日本語で表した。
- source_word: τοῦτο κομίσεται
  choice: その報いを…受けます
  rationale: τοῦτοが先行する善い行いを指し、κομίσεταιがそれに応じたものを受ける意味を持つため。「報い」は対応関係を簡潔に示すが、厳密な商取引としては表していない。
- source_word: παρὰ κυρίου
  choice: 主から
  rationale: 属格を伴うπαράの源を表す用法を「から」で示し、κύριοςは神的・キリスト論的な重みを保つ「主」とした。
- source_word: δοῦλος
  choice: 奴隷
  rationale: ἐλεύθεροςとの明示的な社会的身分の対比があるため、歴史的現実を弱めない語を選んだ。
- source_word: ἐλεύθερος
  choice: 自由な人
  rationale: 奴隷ではない自由身分の人を指すことが現代日本語で明確になるよう、名詞的に表した。
theological_decisions:
- issue: 奴隷と自由人の身分的対比
  choice: 奴隷であっても、自由な人であっても
  alternative: 僕であっても、自由人であっても
  rationale: δοῦλοςとἐλεύθεροςの対比は当時の法的・社会的身分に関わるため、「僕」でその現実を和らげず、「奴隷」とした。
- issue: κύριοςの指示対象と訳語
  choice: 主
  alternative: 主人
  rationale: 直前の家制度の文脈では「主人」も連想され得るが、報いの源であるκύριοςは神的な主を指す可能性が高い。「主」とすることで、人間の主人に限定せず原文の神学的含意を保った。
- issue: κομίσεταιが示す応報
  choice: その報いを主から受けます
  alternative: それを主から受け返します
  rationale: 行いに対応するものを受ける意味を自然な日本語で示した。「報い」は善行への応答を明らかにする一方、救いを功績で購入するとの含意までは加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、口語的すぎない品位を保った。ギリシア語の「一人一人」を文頭近くに置き、個別性を強調した。「同じです」は、奴隷と自由人の双方に同一の原則が及ぶことを日本語で明確にする補足である。
