source:
  edition: SBLGNT
  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: ja
  text: また、私のためにも祈ってください。私が口を開くときにことばが与えられ、福音の奥義を大胆に知らせることができるように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: 私のためにも
  rationale: 前節から続く祈りの要請として、ὑπέρ＋属格の「私のために／私に代わって」の意味を自然な日本語で表す。καίは「も」で反映した。
- source_word: ἵνα μοι δοθῇ λόγος
  choice: 語るべきことばが与えられ
  rationale: λόγοςは単数だが、ここでは発話の内容・表現を指す。「ことば」は原文に近く、「語るべき」を補って、日本語で神から適切な発言が与えられるという意味を明確にした。
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: 私が口を開くとき
  rationale: 直訳的な比喩を保ちながら、発言を始める時を表す自然な日本語とした。
- source_word: ἐν παρρησίᾳ
  choice: 大胆に
  rationale: παρρησίαが表す、恐れず率直に公に語る態度を簡潔に表す。単なる内面的自信に限定しない。
- source_word: γνωρίσαι
  choice: 知らせることができるように
  rationale: 「知らせる」が基本義を保つ。ἵνα節内で、与えられることばによって知らせるという目的・結果の関係が日本語で明瞭になるようにした。
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: 福音の奥義
  rationale: μυστήριονは単なる不可解な謎ではなく、かつて隠され今や示された神の計画を指すパウロ的用法。「奥義」はこの意味を簡潔に保ち、εὐαγγέλιονは現代日本語でも定着した「福音」とした。
theological_decisions:
- issue: λόγοςが指すもの
  choice: 「語るべきことば」とし、神から与えられる発言内容・表現として訳す
  alternative: 「ことば」「語る力」「メッセージ」
  rationale: 「語る力」では内容面が弱まり、「メッセージ」ではまとまった宣教内容に限定されやすい。「語るべきことば」は、神から適切な発言が与えられるという本文の幅を保つ。
- issue: παρρησίαの意味
  choice: 「大胆に」
  alternative: 「確信をもって」「率直に」
  rationale: 率直さと恐れない公的発言の両面を含めつつ、文脈上の勇気ある宣教を自然に表す。
- issue: μυστήριονの性質
  choice: 「奥義」
  alternative: 「秘義」「神秘」「隠されていた計画」
  rationale: 説明的に解消せず、福音に関する神の啓示された秘密という神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、祈りと宣教の文脈にふさわしい品位を保った。節単独でも読めるよう、前節に含意される祈りの命令を「祈ってください」と補った。
