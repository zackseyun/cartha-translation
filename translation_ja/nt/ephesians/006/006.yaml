  terminology: 「奴隷」は直前の奴隷への勧告という文脈とδοῦλοιの帰属・隷属の力を適切に保つ。「メシア」はΧριστόςの称号的意味を可視化し、脚注の「キリスト」との対応も正確である。「心から」はἐκ ψυχῆςの自然な訳であり、脚注が逐語的表現と代替表現を適切に示している。
