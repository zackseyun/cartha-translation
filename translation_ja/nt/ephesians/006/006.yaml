id: EPH.6.6
reference: Ephesians 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: ja
  text: 人に見られている時だけ仕え[a]、人に気に入られようとする者のようにではなく、メシア[b]の奴隷として、心から[c]神のみこころを行いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「目の奉仕」。人の目がある時だけよく働くこと。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」とも訳せる。ギリシア語「クリストス」は「油注がれた者」、すなわち「メシア」を意味する。
    reason: alternative_reading
  - marker: c
    text: 直訳すると「魂から」。「全身全霊で」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: 人に見られている時だけ仕え
  rationale: 「目」と「奉仕・隷属」から成る語が表す、監督者の目がある時だけよく働く態度を、現代日本語で明瞭に表した。直訳的な「目の奉仕」は日本語では意味が伝わりにくいため脚注に残す。
- source_word: ἀνθρωπάρεσκοι
  choice: 人に気に入られようとする者
  rationale: 人からの評価や好意を得ることを目当てにする者という否定的含意を、自然な現代日本語で示す。
- source_word: δοῦλοι
  choice: 奴隷
  rationale: 直前から実際の奴隷に語りかける文脈であり、メシアへの所属を対比的に示すため、拘束された身分と主人への帰属を保持する。
- source_word: Χριστοῦ
  choice: メシア
  rationale: 「油注がれた者」という称号の意味を示し、メシアへの帰属という文脈上の力を保つ。日本語で一般的な「キリスト」は脚注に併記する。
- source_word: ποιοῦντες
  choice: 行いなさい
  rationale: 分詞は前節から続く命令に従属している。日本語で一節として自然に理解できるよう、文脈上の命令を明示した。
- source_word: θέλημα
  choice: みこころ
  rationale: 神が望み、行うよう求めていることを指す宗教的文脈で、自然かつ簡潔な日本語表現である。
- source_word: ἐκ ψυχῆς
  choice: 心から
  rationale: 直訳は「魂から」だが、内面から真実に、全身全霊で行う意味を自然な日本語で伝える。「魂」という原語上の像は脚注で示す。
theological_decisions:
- issue: 奴隷制の文脈における δοῦλοι の訳語
  choice: メシアの奴隷
  alternative: メシアの僕／しもべ
  rationale: この箇所は直前から文字どおり奴隷に呼びかけ、その地上の身分をメシアへの究極的な帰属によって捉え直している。「奴隷」はその緊張と所有・隷属の比喩を弱めない。
- issue: Χριστοῦ を称号として訳すか、慣用的名称として訳すか
  choice: メシア
  alternative: キリスト
  rationale: Χριστός の称号としての意味を本文で可視化する一方、定着した日本語形「キリスト」も脚注に示し、同一語であることを明らかにする。
- issue: ἐκ ψυχῆς の人間論的語感
  choice: 心から
  alternative: 魂から／全身全霊で
  rationale: 特定の心身二元論を読み込まず、内からの誠実さを日本語として自然に表す。原文の ψυχή は脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「みこころ」は聖書日本語として広く理解される表現を採用した。「人に見られている時だけ」は稀な複合語の意味を本文で明らかにし、語形の比喩は脚注に残した。節単独でも通じるよう、前節から続く命令を「行いなさい」と明示した。
