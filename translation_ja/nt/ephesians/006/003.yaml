  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: ja
  text: そうすれば、あなたにとって物事がうまくいき、地上で長生きするだろう[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その地で」。出エジプト記20章12節と申命記5章16節にある第五の戒めの表現を響かせている可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: そうすれば
  rationale: 目的・結果を導く接続詞。ここでは戒めに伴う約束の内容を自然な日本語で示し、前節とのつながりも明確にする。
- source_word: εὖ σοι γένηται
  choice: あなたに幸いがあり
  rationale: 「物事があなたにとって良くなる／うまくいく」という慣用表現。過度に物質的な繁栄へ限定せず、簡潔で品位ある日本語とした。
- source_word: καὶ
  choice: そして（訳文では読点による並列）
  rationale: 二つの約束を結ぶ単純な等位接続。日本語では読点で自然に並べた。
- source_word: ἔσῃ μακροχρόνιος
  choice: 長く生きることができる
  rationale: 直訳は「長命であるだろう」。述語形容詞の意味を、現代日本語で自然な「長く生きる」として表した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: γῆは「地／土地」の両義性を持つが、本文には特定の契約の土地を示す限定がないため、広い意味を保つ「地上」とした。「その土地で」は十戒との響きを脚注に残す。
theological_decisions:
- issue: ἐπὶ τῆς γῆςが全地を指すか、十戒における約束の土地を指すか
  choice: 地上で
  alternative: その土地で
  rationale: エフェソ書のギリシア語本文には、出エジプト記20:12や申命記5:16に見られる、与えられる土地を特定する表現がない。そのため本文のより広い表現を訳し、十戒との関連から生じる別の可能性は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、約束としての荘重さを保った。「幸い」は単なる成功や物質的繁栄に狭めず、εὖの広い意味を伝える語として採用した。
