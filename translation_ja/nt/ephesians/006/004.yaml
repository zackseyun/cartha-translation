id: EPH.6.4
reference: Ephesians 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: ja
  text: また、父親たちよ、あなたがたの子どもを怒らせてはいけません[a]。むしろ、主の訓練と戒め[b][c]によって育てなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子どもをいら立たせてはいけません」。この動詞は、怒りや憤りを引き起こすことを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「訓練と戒め」は、「養育と諭し」または「しつけと忠告」とも訳せる。「訓練」は形成や矯正を含み、「戒め」は言葉による教導や忠告を含む。
    reason: lexical_alternative
  - marker: c
    text: 「主の」は、訓練と戒めが主から来ること、主に属すること、または主によって方向づけられることを意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: 父親たち
  rationale: 男性複数形で、家庭訓において父親を直接呼びかけているため。「親たち」と一般化しない。
- source_word: παροργίζετε
  choice: 怒らせてはいけません
  rationale: 怒りや憤りを引き起こすという使役的な意味を、自然な現代日本語で明示する。
- source_word: τέκνα
  choice: 子ども
  rationale: 家庭内の子どもを指す通常の複数表現であり、男女双方を含む。
- source_word: ἐκτρέφετε
  choice: 育てなさい
  rationale: 字義的には養うことを含むが、ここでは子育て全体を表すため、文脈に即した自然な訳とする。
- source_word: παιδείᾳ
  choice: 訓練
  rationale: 養育に伴う形成、教育、矯正を含む語であり、「戒め」との組み合わせでも意味の重複を抑えられる。
- source_word: νουθεσίᾳ
  choice: 戒め
  rationale: 言葉による教導、忠告、矯正を表す。単なる情報伝達としての「教え」より、原語の勧告的な力を保つ。
- source_word: κυρίου
  choice: 主の
  rationale: 属格を簡潔に保ち、主から来るもの、主に属するもの、主に従うものという複数の可能性を限定しない。
- source_word: ἐν
  choice: によって
  rationale: 養育の手段・領域を示す文脈として自然な日本語にする。ただし後続する属格の意味は限定しない。
theological_decisions:
- issue: πατέρεςが呼びかける範囲
  choice: 「父親たち」と訳し、原文の男性複数形を保つ。
  alternative: 「親たち」
  rationale: 適用範囲を翻訳段階で広げず、原文が特に父親へ向けている呼びかけを保持する。
- issue: παιδείᾳ καὶ νουθεσίᾳに対するκυρίουの関係
  choice: 「主の訓練と戒め」とし、属格の幅を保つ。
  alternative: 「主から来る訓練と戒め」「主についての訓練と戒め」「主に従った訓練と戒め」
  rationale: κυρίουは起源、所属、性質、方向づけなどを表し得るため、一つの意味に狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「父親たちよ」で直接の呼びかけを示し、「怒らせる」「育てる」で一般読者にも分かりやすくした。「訓練と戒め」は原語二語の形成的側面と勧告的側面を区別しつつ、教派固有の子育て観を持ち込まない表現である。
