  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ja
  text: 私が彼をあなたがたのもとに遣わしたのは、まさにこのためです。あなたがたが私たちの様子[a]を知り、また彼があなたがたの心を励ますためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの事情」または「私たちに関すること」。
    reason: τὰ περὶ ἡμῶνの語義上の幅を示すため。
lexical_decisions:
- source_word: ὃν
  choice: 彼を
  rationale: 前節のティキコを指す男性単数対格の関係代名詞。日本語では文脈を受けて「彼を」とするのが自然。
- source_word: ἔπεμψα πρὸς ὑμᾶς
  choice: 私が彼をあなたがたのもとに遣わした
  rationale: アオリストを自然な過去として訳し、πρόςによる人への方向を「あなたがたのもとに」で明確にした。
- source_word: εἰς αὐτὸ τοῦτο
  choice: まさにこのため
  rationale: αὐτὸ τοῦτοの強調を「まさに」で表し、目的を自然な現代日本語で示した。
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: あなたがたが私たちの様子を知り
  rationale: τὰ περὶ ἡμῶνは私たちに関する事柄や近況を広く指し得る。「私たちの様子」は外的事情だけに限定せず、簡潔で自然。
- source_word: παρακαλέσῃ τὰς καρδίας ὑμῶν
  choice: 彼があなたがたの心を励ます
  rationale: παρακαλέωには慰める、励ます、勧めるなどの幅があるが、この文脈では内面を力づける「心を励ます」が適切。καρδίαの聖書的表現も保持した。
theological_decisions:
- issue: τὰ περὶ ἡμῶνの意味範囲
  choice: 「私たちの様子」
  alternative: 「私たちの事情」または「私たちに関すること」
  rationale: 原文は人物の状態と周囲の事情の双方を含み得るため、「様子」として意味を過度に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「遣わす」は聖書文体として定着しつつ一般読者にも理解可能。二つの目的節を並列させ、原文の構造を自然な日本語で保持した。
