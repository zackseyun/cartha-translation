source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: ja
  text: また、救いのかぶとと、聖霊の剣、すなわち神のことばを受け取りなさい[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「取りなさい」。
    reason: lexical_alternative
  - marker: b
    text: 「神が語られたことば」または「神の語りかけ」とも訳せる。ギリシャ語のῥῆμα（レーマ）は、語られたことばや告げられた内容を強調することがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: 受け取りなさい
  rationale: アオリスト中動態の命令形（二人称複数）。神から備えられた武具を受け取って身に着けるという含みを保ちつつ、現代日本語として自然にした。日本語では目的語ごとに動詞を補い、文意を明確にしている。
- source_word: περικεφαλαίαν
  choice: かぶと
  rationale: 頭部を守る軍装を指す標準的な語。武具の比喩に合う、簡潔で広く理解される訳語である。
- source_word: τοῦ σωτηρίου
  choice: 救いの
  rationale: 「救出」の意味も含み得るが、パウロ書簡における文脈と属格表現の幅を保つ定着した訳語として「救いの」を採用した。
- source_word: μάχαιραν
  choice: 剣
  rationale: 比較的短い刃物を指す場合もあるが、ここでは武具の比喩を自然に伝え、不必要に形状を限定しない「剣」が適切である。
- source_word: τοῦ πνεύματος
  choice: 聖霊の
  rationale: この文脈では人間の霊や抽象的な霊性ではなく、神の霊を指すと読むのが最も自然である。日本語で指示対象を明確にするため「聖霊」とした。
- source_word: ὅ ἐστιν
  choice: すなわち
  rationale: 後続句が「聖霊の剣」の内容を説明する関係を、簡潔で自然な日本語で示す。
- source_word: ῥῆμα θεοῦ
  choice: 神のことば
  rationale: ῥῆμαには語られたことば、発言、告知という含みがあり得るが、「神のことば」はその幅と神学的響きを保ちながら、現代日本語として最も自然である。
theological_decisions:
- issue: τοῦ πνεύματος の指示対象
  choice: 聖霊
  alternative: 人間の霊、または一般的な霊的領域
  rationale: 神の武具という文脈と、続く「神のことば」との結びつきから、神の霊を指すと理解するのが最も自然である。ただし、剣が聖霊に属するのか、聖霊から与えられるのかなど、属格の細かな関係は本文で限定していない。
- issue: 「聖霊の剣」と「神のことば」の関係
  choice: 「すなわち」による説明・同定
  alternative: 単なる付加的説明
  rationale: 中性関係代名詞 ὅ と ἐστιν は、後続の「神のことば」が剣の比喩を説明することを示す。日本語では「すなわち」がこの関係を明瞭に表す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御霊」より一般読者にも指示対象が伝わりやすい「聖霊」を用いた。「言葉」ではなく聖書本文で慣用的な「ことば」と表記した。原文では一つの命令動詞が二つの目的語を支配するが、日本語では長い修飾句による係り受けの曖昧さを避けるため「受け取り」を前半にも補った。
