id: EPH.6.5
reference: Ephesians 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: ja
  text: 奴隷たちよ、地上の主人[a]に、恐れおののきながら、偽りのない心で従いなさい。メシア[b]に従うように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉による主人」。地上の、人間的な関係における主人という意味。
    reason: 「κατὰ σάρκα」の直訳と、その文脈上の意味を示すため。
  - marker: b
    text: ギリシャ語「クリストス」。伝統的には「キリスト」と訳される称号で、「油を注がれた者」、すなわちメシアを意味する。
    reason: 称号としての意味と、一般的な別訳を示すため。
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隷である人たち
  rationale: 所有と拘束の下に置かれた人々を指すため、「僕」や「使用人」で歴史的な社会関係を弱めず、「奴隷」を明示した。呼びかけとして不自然にならないよう「である人たち」を補った。
- source_word: ὑπακούετε
  choice: 従いなさい
  rationale: 継続的な服従を求める現在命令形。現代日本語で明瞭な命令として表した。
- source_word: κατὰ σάρκα κυρίοις
  choice: この世での主人
  rationale: 直訳的な「肉による主人」は現代日本語では意味が取りにくい。ここではメシアとの関係に対し、地上の人間的・一時的な関係における主人を指すため、「この世での」とした。直訳は脚注に示した。
- source_word: μετὰ φόβου καὶ τρόμου
  choice: 恐れおののきつつ
  rationale: パウロ書簡に見られる一組の強調表現の修辞的な力を保ち、簡潔で格調ある日本語にした。
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: 真心から
  rationale: ἁπλότηςが表す偽りのなさ、誠実さ、二心のなさを、自然な現代日本語で表した。
- source_word: ὡς τῷ Χριστῷ
  choice: メシアに従うように
  rationale: ὡςの比較を保ち、地上の主人をメシアと同一視しない表現とした。日本語では動詞を補うことで比較対象を明瞭にした。
theological_decisions:
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςは「油を注がれた者」という称号として機能しているため、その意味を伝える「メシア」とした。伝統的な音写「キリスト」は脚注に示した。
- issue: δοῦλοιが示す身分
  choice: 奴隷である人たち
  alternative: 僕たち／使用人たち
  rationale: 主人の所有と支配の下にある者を扱う家政訓の文脈であり、当時の奴隷制という社会的現実を婉曲化しないため。
- issue: 命令と奴隷制の関係
  choice: 本文の命令をそのまま訳し、制度への一般的承認を補わない
  alternative: 奴隷制を是認または否定する説明を本文に加える
  rationale: この一節は特定の状況にある奴隷へ命じているが、それ自体が奴隷制全般について明示的な評価を述べるわけではない。原文にない神学的結論を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、呼びかけと命令の厳粛さを保った。「恐れおののきつつ」は聖書的な修辞の響きを残すやや格調ある表現。「この世での主人」によって現代の読者にも関係の限定性を伝え、直訳は脚注で保持した。
