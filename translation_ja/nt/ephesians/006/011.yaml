id: EPH.6.11
reference: Ephesians 6:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: ja
  text: 悪魔の策略[b]に対抗して立つことができるように、神のすべての武具[a]を身に着けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「神の武具一式」。ギリシア語は兵士の完全な装備を指します。
    reason: lexical_alternative
  - marker: b
    text: 「策略」は「巧妙なたくらみ」または「欺きの手段」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: 身に着けなさい
  rationale: アオリスト中動態命令法二人称複数。武具を自ら装着せよという命令を、現代日本語で自然かつ明確に表す。
- source_word: πανοπλίαν
  choice: すべての武具
  rationale: 重装歩兵の装備一式を指す語であり、単なる防具だけでなく完全な装備という意味を保つ。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格が示し得る所属・由来を日本語でも限定しすぎずに保つ。
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: 立つことができるように
  rationale: 前置詞と冠詞付き不定詞による目的の意味を自然に表す。
- source_word: στῆναι
  choice: 立つ
  rationale: 敵に対して踏みとどまる軍事的含意は文脈に委ね、本文では原語に即して簡潔に訳す。
- source_word: μεθοδείας
  choice: 策略
  rationale: 悪意ある巧妙な企てや手段を指す語。現代日本語として明瞭で、欺瞞的・敵対的な含意を保つ。
- source_word: τοῦ διαβόλου
  choice: 悪魔
  rationale: この霊的戦いの文脈では、一般的な『中傷する者』ではなく、人格的な悪の敵対者を指す定着した呼称として訳す。
theological_decisions:
- issue: διάβολοςの指示対象
  choice: 人格的な悪の敵対者としての「悪魔」
  alternative: 「中傷する者」
  rationale: エフェソ6章の霊的戦いという直近の文脈は、一般の人間の中傷者ではなく超自然的な敵対者を指す理解を支持する。ただし、この節にない教理的説明は加えない。
- issue: 「神の武具」における属格の関係
  choice: 「神の」として関係を広く保つ
  alternative: 「神から与えられる」
  rationale: τοῦ θεοῦは所有・由来の双方に関わり得るため、どちらか一方に限定せず、原文の幅を残す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「立ち向かう」ではなく「対抗して立つ」とし、στῆναιの『立つ』という比喩を保持した。脚注記号は対応箇所に置き、句点後の[b]は「策略」の語義注であることがやや不明瞭なため、本文内では本来「策略[b]」とするのが望ましい。
