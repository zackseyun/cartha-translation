id: EPH.6.21
reference: Ephesians 6:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: ja
  text: あなたがたも、私の事情と、私が何をしているかを知ることができるように、愛する兄弟であり、主にあって忠実な奉仕者であるティキコが、すべてを知らせます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: 知ることができるように
  rationale: ἵναの目的を自然な日本語で示す。δέの弱い接続は文脈上あえて独立した語にせず、文全体の流れに含めた。
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: あなたがたも…知ることができる
  rationale: καίと明示された代名詞ὑμεῖςによる「あなたがたも」という付加・強調を保持した。
- source_word: τὰ κατ’ ἐμέ
  choice: 私の事情
  rationale: 直訳的には「私に関する事柄」だが、パウロの置かれた状況を広く指し得る慣用表現として、意味を狭めすぎない自然な表現を選んだ。
- source_word: τί πράσσω
  choice: 私が何をしているか
  rationale: πράσσωの現在形を率直に表し、直前の「私の事情」を具体化する関係を「つまり」で明確にした。
- source_word: πάντα γνωρίσει ὑμῖν
  choice: すべてを知らせます
  rationale: γνωρίζωの使役的な意味「知らせる」を簡潔な現代日本語で表した。
- source_word: Τυχικὸς
  choice: ティキコ
  rationale: 日本語聖書で理解しやすい標準的な音写を採用した。
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: 愛する兄弟
  rationale: 共同体における親愛を示すἀγαπητόςと、男性の同労者を指すἀδελφόςを自然かつ正確に表した。
- source_word: πιστὸς διάκονος
  choice: 忠実に仕える者
  rationale: διάκονοςがここで正式な教会職を指すとは断定できないため、奉仕の機能を表しつつ「執事」と限定しない訳とした。πιστόςは奉仕の忠実さとして自然に結び付けた。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡に特徴的な、主との関係・領域を示す表現を伝統的かつ理解可能な日本語で保持した。
theological_decisions:
- issue: ティキコに用いられたδιάκονοςの訳
  choice: 忠実に仕える者
  alternative: 忠実な奉仕者／忠実な執事
  rationale: 文脈はティキコの信頼できる奉仕を述べるが、正式な職制上の「執事」を明確には示さない。「仕える者」はその曖昧さを保ち、役職を読み込まない。
- issue: ἀδελφόςの訳
  choice: 兄弟
  alternative: 同胞
  rationale: ここでは男性である個人の同労者ティキコを指すため、「兄弟」が性別と共同体的関係の双方を正確に表す。
- issue: ἐν κυρίῳの係り先
  choice: 「愛する兄弟」と「忠実に仕える者」から成る人物描写全体に続けて配置
  alternative: 「忠実に仕える者」だけに直接結び付ける
  rationale: ギリシア語では直近のδιάκονοςを修飾すると読むのが自然だが、主にある関係が人物描写全体を包む可能性も排除しない語順とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、書簡の結びにふさわしい端正さを保った。「主にあって」はパウロ的表現の神学的含意を損なわないため保持し、διάκονοςは職制を断定しない表現とした。
