  naturalness: 全体として明瞭な現代日本語ですが、「事情、つまり…」は原文の並列を不必要に狭めます。「事情と、私が何をしているか」とすれば自然で正確です。「主にあって」の位置も、修飾関係が分かる語順に整えることができます。
  terminology: 「ティキコ」「愛する兄弟」「主にあって」は適切です。διάκονοςを「忠実な奉仕者」とすることで、奉仕の役割を示しつつ、後代の固定的職制としての「執事」を断定しません。
