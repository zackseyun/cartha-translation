base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: ja
  text: 私たちの主イエス・メシアを愛するすべての人に、不朽のうちに恵みがありますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「不朽のうちに」。別訳「朽ちない愛をもって」「真実に」「変わることなく」。この簡潔なギリシア語句は、主への愛を修飾するとも、祝福の様態または領域を表すとも理解されうる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ χάρις
  choice: 恵みがありますように
  rationale: 動詞のない祝福の句を、パウロ書簡の結びにふさわしい自然な日本語の祈願表現とした。
- source_word: μετὰ πάντων
  choice: すべての人に
  rationale: μετά＋属格の「共に」を、祝福を願う日本語として自然な「すべての人に」で表した。
- source_word: τῶν ἀγαπώντων
  choice: 愛する…人
  rationale: 現在分詞の実質的な名詞用法を連体修飾で表し、継続的・特徴的な愛を示した。
- source_word: τὸν κύριον ἡμῶν
  choice: 私たちの主
  rationale: κύριοςをキリストへの称号として標準的な「主」と訳した。
- source_word: Ἰησοῦν Χριστόν
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を示すため「メシア」とし、日本語で一続きの名・称号として自然な中黒を用いた。
- source_word: ἐν ἀφθαρσίᾳ
  choice: 朽ちることなく
  rationale: ἀφθαρσίαの不朽・不滅という中核的意味を保ちつつ、何に係るかを完全には明示しない簡潔な副詞句とした。解釈上の幅は脚注に示した。
theological_decisions:
- issue: ἐν ἀφθαρσίᾳの係り先と意味
  choice: 本文では「朽ちることなく」とし、原文の簡潔さと曖昧さを可能な限り保つ
  alternative: 「朽ちない愛をもって」「真実に」「変わることなく」
  rationale: この句は、主への愛の不滅性を表すとも、誠実さを表すとも、祝福が不朽の領域にあることを表すとも理解されうる。本文で一つに限定せず、主な解釈を脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある祝福の文体。「ありますように」で書簡末尾の祈願を表した。「朽ちることなく」はやや格調を保ちながら一般読者にも理解できる表現。
