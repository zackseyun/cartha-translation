id: EPH.6.2
reference: Ephesians 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: ja
  text: 「あなたの父と母を敬いなさい。」これは、約束を伴う最初の戒めです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「約束における最初の戒め」。ここでは、この戒めに約束が伴っているという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: 敬いなさい
  rationale: 現在命令形で、単なる内面的な尊敬にとどまらず、態度と行動に表す継続的な敬意を求める。十戒の引用として定着した自然で重みのある表現。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: あなたの父と母
  rationale: 直接的な親族語を自然な現代日本語で表し、所有代名詞 σου も明示した。
- source_word: ἥτις ἐστὶν
  choice: これは……です
  rationale: 直前に引用された戒め全体を受ける説明として、日本語で明瞭かつ自然にした。
- source_word: ἐντολὴ πρώτη
  choice: 最初の戒め
  rationale: πρώτη の序数的意味を保持し、十戒を背景とするため ἐντολή は「戒め」とした。
- source_word: ἐν ἐπαγγελίᾳ
  choice: 約束を伴う
  rationale: 字義的には「約束における」だが、文脈上はこの戒めに約束が付随することを示す。「伴う」は意味を明瞭にしつつ過度な言い換えを避ける。
theological_decisions:
- issue: 「最初の戒め」と十戒の順序との関係
  choice: 「約束を伴う最初の戒め」と訳し、明示された約束が付随する最初の戒めという自然な理解を示した。
  alternative: 第二の板における最初の戒め／約束における第一の戒め／最も重要な戒め
  rationale: πρώτη は通常、序数の「最初」を表し、「最も重要な」と断定する根拠は乏しい。また、特定の十戒区分を本文に持ち込まず、ἐν ἐπαγγελίᾳ のやや特異な表現は脚注で字義も示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。十戒の引用としての響きを残すため「敬いなさい」「戒め」を用い、説明節は現代日本語として自然な独立文にした。
