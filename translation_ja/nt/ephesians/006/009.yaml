id: EPH.6.9
reference: Ephesians 6:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: ja
  text: 主人たちよ、あなたがたも奴隷たちに同じように接し、脅すことをやめなさい。彼らとあなたがた双方の主が天におられ、その方にはえこひいきがないことを、あなたがたは知っているのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κύριοι
  choice: 主人たち
  rationale: 直前の奴隷に対する人間の主人を指す。古代の家制度における関係を保ちつつ、現代日本語で自然な語を選んだ。
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: あなたがたも奴隷たちに同じようにし
  rationale: 直前の命令との対応と相互性を示す。「同じことをし」では、主人も奴隷と同一の行為をするという不自然な誤解が生じうるため、「同じように」とした。目的語は文脈から「奴隷たち」と明示した。
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: 脅すことをやめなさい
  rationale: ἀνίημι の『やめる、放棄する』という意味と、単数の抽象名詞が表す威嚇の習慣を明確な現代日本語で表した。分詞は主命令に付随する具体的命令として自然に処理した。
- source_word: εἰδότες
  choice: 知っているのです
  rationale: 命令の根拠を示す分詞の因果的な働きを、日本語の説明的な結びで表した。
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: 彼らとあなたがた双方の主
  rationale: καὶ…καὶ の『双方』を明示し、人間の主人も奴隷も同じ天の主のもとにあるという対照を保った。神的な κύριος は「主」とした。
- source_word: ἐν οὐρανοῖς
  choice: 天に
  rationale: ギリシア語では複数形だが、この慣用表現に対応する自然な日本語は「天に」である。
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: その方にはえこひいきがない
  rationale: προσωπολημψία が表す身分や外面による不公平な扱いを、一般読者に明瞭な「えこひいき」で表した。παρ’ αὐτῷ は神の性質・判断にそれがないことを示す「その方には」とした。
theological_decisions:
- issue: 同一節内の人間と神を指す κύριος の訳し分け
  choice: 人間の複数形を「主人たち」、天におられる単数形を「主」とする
  alternative: 両方を「主人」とする
  rationale: 同じ語による修辞的な結びつきは日本語でも共通する「主」の字によってある程度保たれる一方、神を指す箇所を称号として「主」とすることで、地上の主人たちも天の主に従属するという対照を明確にした。
- issue: 「同じように」の内容
  choice: 直前に奴隷へ求めた誠実さと善意に対応する相互的な扱いとして、限定せずに訳す
  alternative: 奴隷に対して具体的に善を行う、または服従するという意味に限定する
  rationale: τὰ αὐτά は直前の勧告を受けるが、主人に全く同一の社会的行為を要求するとは明記されない。原文の簡潔さと解釈上の幅を保った。
- issue: 身分による不公平に関する神の性質
  choice: 「その方にはえこひいきがない」
  alternative: 「その方は人を分け隔てなさらない」
  rationale: 名詞構文を保ち、奴隷と主人の社会的身分に左右されない神の裁きを明確に示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。古代の奴隷制度を現代の雇用関係に置き換えず、歴史的な関係を「主人」「奴隷」として明示した。原文上必要な異読注はなく、本文の理解に不可欠でないため脚注は設けていない。
