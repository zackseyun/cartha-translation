  source_fidelity: 本文はギリシア語の構文と意味を全体として正確に伝えている。「主人たち」と天の「主」の訳し分け、脅迫をやめる命令、双方に共通する天の主、神の不偏性はいずれも適切である。「同じようにし」だけは、πρὸς αὐτούς（彼らに対して）を含む日本語としてやや不自然で、何をするかが文法的にも曖昧に響く。
  naturalness: 「同じように彼らに接し」とすれば、直前の勧告との対応を保ちながら、現代標準日本語として滑らかになる。「えこひいきがない」は明瞭で、ここでは許容できる。
  terminology: 古代の奴隷制という文脈を「奴隷」「主人」によって歴史的に保持している。神を指す κύριος の「主」も適切である。神の不偏性を指す προσωπολημψία は「えこひいきがない」で十分に伝わる。
