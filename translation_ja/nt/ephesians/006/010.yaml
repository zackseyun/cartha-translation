base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: ja
  text: 最後に、主にあって、その強大な力のうちにあって強められなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主にあって強くありなさい」。ギリシア語はこのようにも自然に訳せるが、本文の「強められなさい」は受動的な含みをよりよく保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: 最後に
  rationale: 手紙の結びの勧告へ移る談話標識として、現代日本語で自然かつ明瞭である。「今後は」という時間的意味にも取り得るが、ここでは文脈上、結論部への移行を表すと判断した。
- source_word: ἐνδυναμοῦσθε
  choice: 強められなさい
  rationale: 現在受動・中動命令形の受容的な響きを保ち、自力で奮い立つことよりも、力を受けるよう促されている点を示す。日本語として可能な受動命令を採用した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: ἐν の関係・領域を表す言い方を保ち、「主によって」として手段だけに限定しない。κύριος は通常どおり「主」とした。
- source_word: κράτει τῆς ἰσχύος αὐτοῦ
  choice: その力強い大能
  rationale: κράτος と ἰσχύς が重ねられた強調を、日本語でも「力強い」と「大能」の組み合わせで表した。逐語的な「その力の強さ」より自然でありながら、単に「力」として重なりを消してはいない。αὐτοῦ は直前の「主」を受ける「その」で表した。
theological_decisions:
- issue: ἐνδυναμοῦσθε における力の受け手と源
  choice: 主との関係の中で強められるよう命じる受動的な勧告
  alternative: 「主にあって強くありなさい」という能動的・慣用的な表現
  rationale: 形態上の受動・中動の含みを本文に残し、信者自身の決意だけを強調しない。同時に、力が与えられる仕方について本文以上の教理的限定は加えない。
- issue: κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: パウロ書簡のこの文脈では高く上げられたイエスを自然に指すが、本文に説明的な語を付け加えず、標準的な訳語「主」を用いた。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、勧告の荘重さと原文の力を表す語の重なりを保つため、「大能」を用いた。「強められなさい」は日常会話より改まった表現だが、原文の受動的含意を明示するために採用した。
