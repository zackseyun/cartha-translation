- from: あらゆる祈りと願いをもって、どんな時にも御霊によって[a]祈りなさい。そのために、すべての聖なる者たち[b]のために、ひたすら願い求め、忍耐の限りを尽くして目を覚ましていなさい。[c]
  to: あらゆる祈りと願いをもって、どんな時にも聖霊にあって[a]祈りなさい。また、そのために、すべての聖徒たち[b]のために、あらゆる忍耐と願いをもって目を覚ましていなさい。[c]
  rationale: 「聖霊にあって」によりἐν πνεύματιの意味領域を保ちつつ、脚注で「霊にあって」という一般的な読みの可能性を維持した。後半はἐν πάσῃ προσκαρτερήσει καὶ δεήσειの二つの名詞を「あらゆる忍耐と願いをもって」と並列に訳し、警戒を修飾する原文の構造を明確にした。「聖徒たち」は自然で確立した用語であり、脚注がパウロにおける全信者という範囲を明示する。
