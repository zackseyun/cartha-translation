review_pass:
  verdict: revise
  source_fidelity: 原文は、祈り（προσευχή）と願い・願求（δέησις）を区別しつつ、「どんな時にも」「霊にあって」祈ること、さらに「このことのために」すべての聖徒のため、あらゆる忍耐と願いをもって警戒することを命じる。草案は全体の趣旨をよく伝えるが、「御霊によって」はἐν πνεύματιの『〜にあって／〜のうちで』という表現を手段を示す『によって』へ狭めている。また後半はκαὶ δεήσειを『ひたすら願い求め』として前置し、原文の並列関係と修飾範囲がやや不明瞭になっている。
  naturalness: 「聖なる者たち」は意味は通るものの、この文脈で共同体を指す日本語としてはやや硬く不自然である。「聖徒たち」は定着した聖書用語であり、脚注で対象が全信者であることを明示すれば、後代の限定的用法との混同も避けられる。修正版は長い原文の流れを保ちながら、現代標準日本語として自然に読める。
  terminology: πνεῦμαは文脈上「聖霊」が最も有力だが、無冠詞であるため脚注に別解を残す。「聖霊にあって」はἐνの領域・関係の含みを保つ。「聖徒たち」はἅγιοιに対応し、脚注で『神に属するすべての民、すなわちすべての信者』と説明する。δέησιςは両箇所で「願い」とし、προσευχήの「祈り」と区別する。
  issues:
  - severity: medium
    issue: 「御霊によって」はἐν πνεύματιの前置詞の意味を手段に限定している。
    rationale: ἐνはここでは単純に行為者を示す『〜によって』よりも、『聖霊にあって』という領域・関係を示す表現として訳すのが安全である。聖霊理解自体は文脈上有力だが、脚注で一般的な読みを保持すべきである。
  - severity: medium
    issue: 後半の「ひたすら願い求め、忍耐の限りを尽くして」は、ἐν πάσῃ προσκαρτερήσει καὶ δεήσειの並列を不均衡にし、願いが『目を覚ましている』ことではなく別の動作に係るように読める。
    rationale: 原文は『あらゆる忍耐と願いをもって』という前置詞句で警戒の態度を表す。日本語でも二項を並列して目を覚ますことに係らせるのが、原文の統語と意味を最も明瞭に再現する。
  - severity: low
    issue: 「聖なる者たち」は現代日本語では共同体を指す呼称としてやや不自然である。
    rationale: ἅγιοιに対する定着した聖書用語「聖徒たち」を用い、脚注で全信者を指すことを説明するほうが、自然さと語義の両方を保てる。
