reference: Ephesians 6:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: ja
  text: あらゆる祈りと願いをもって、どんな時にも聖霊にあって[a]祈りなさい。また、そのために、すべての聖徒たち[b]のために、あらゆる忍耐と願いをもって目を覚ましていなさい。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊にあって」とも訳せる。ギリシア語はより一般的にも読めるが、文脈上は聖霊を指す可能性が高い。
    reason: alternative_reading
  - marker: b
    text: 「聖徒たち」とは、神に属するすべての民、すなわちすべての信者を指す。
    reason: lexical_clarification
  - marker: c
    text: 後半は、「あらゆる忍耐を尽くして願い求めつつ、目を覚ましていなさい」とも訳せる。
    reason: syntactic_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: あらゆる祈りと願いをもって
  rationale: διά＋属格の手段の意味を「をもって」で表した。προσευχήを一般的な「祈り」、δέησιςを具体的な求めを示す「願い」と訳し分けた。
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: どんな時にも…祈りなさい
  rationale: 分詞は前節から続く勧告に従属しているため、日本語では命令形として自然に表した。παντὶ καιρῷの包括性は「どんな時にも」で示した。
- source_word: ἐν πνεύματι
  choice: 御霊によって
  rationale: 直前の17節およびエフェソ書全体の用法から聖霊を指す可能性が高い。「御霊」は神の霊を指す自然で荘重な表現であり、ἐνの働き・領域の含みを日本語では「によって」で示した。原文上の別解は脚注に残した。
- source_word: εἰς αὐτὸ
  choice: そのために
  rationale: 祈りに伴う警戒という目的を示す慣用句として、強調を過度に補わず自然な日本語にした。
- source_word: ἀγρυπνοῦντες
  choice: 目を覚ましていなさい
  rationale: 眠らず警戒し続ける意味と、この箇所の見張りのイメージを保持した。
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: ひたすら願い求め、忍耐の限りを尽くして
  rationale: προσκαρτέρησιςの粘り強い持続を「忍耐の限りを尽くして」、δέησιςを「願い求め」と表した。二語の結びつきは密接だが、καίを無視せず双方を明示した。
- source_word: περὶ πάντων τῶν ἁγίων
  choice: すべての聖なる者たちのために
  rationale: ἅγιοιを後代の限定的な称号と誤解されにくい形で訳し、神に属する信者全体を指す語義を保った。
theological_decisions:
- issue: πνεύματιの指示対象
  choice: 聖霊（「御霊によって」）
  alternative: 人の霊、または霊的な態度（「霊によって／心から」）
  rationale: 直前の「御霊の剣」とパウロ書簡における御霊による祈りの用法から、聖霊が最も可能性の高い指示対象である。ただし無冠詞形による真正な曖昧さを脚注で示した。
- issue: ἅγιοιの範囲
  choice: 神に属するすべての信者（「聖なる者たち」）
  alternative: 後代の教会制度で特別に列聖された人々
  rationale: パウロの通常の用法では、特別な一群ではなく神によって聖別された信者共同体全体を指す。
- issue: ἐν πάσῃ προσκαρτερήσει καὶ δεήσειの関係
  choice: 願い求めることと、あらゆる忍耐を密接に結びつけて表現
  alternative: 「あらゆる忍耐と願いをもって」と二項を並列する訳
  rationale: καίによる並列を尊重しつつ、文脈上は忍耐が願いと警戒の持続性を特徴づけるため、日本語では両者の密接な関係が伝わる語順にした。別の統語的表現を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りへの勧告にふさわしい荘重さを保った。長いギリシア語の分詞構文は二文に分け、命令の流れを明確にした。「御霊」は聖霊を示すが、原文の曖昧さは脚注で保持した。
