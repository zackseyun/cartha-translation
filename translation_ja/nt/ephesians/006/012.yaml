id: EPH.6.12
reference: Ephesians 6:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: ja
  text: 私たちの格闘は、血肉[a]を相手にするものではなく、支配者たち、権威者たち、この闇に属する世界の支配者たち[b]、天上の領域にある[c]悪の霊的な勢力を相手にするものだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「血と肉」。ここでは、身体を持つ人間を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「この闇の世界を支配する者たち」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「天上の場所にある」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: 格闘
  rationale: 組み合って戦うことを表す語の比喩性を保つ。「戦い」より具体的でありながら、現代日本語でも理解できる。
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: 血肉を相手にする
  rationale: 原文の「血と肉」という人間を指す慣用表現を簡潔に保つ。日本語では「血肉」とまとめることで自然さを確保し、「罪深い性質」という別の意味には解さない。
- source_word: ἀρχάς
  choice: 支配者たち
  rationale: 文脈上、人間を超えた支配的な諸力を指すが、その性質を必要以上に限定せず、語の統治的意味を示す。
- source_word: ἐξουσίας
  choice: 権威者たち
  rationale: 権威または権限を帯びた存在という意味を保ち、直前の「支配者たち」と区別する。
- source_word: κοσμοκράτορας τοῦ σκότους τούτου
  choice: この闇に属する世界の支配者たち
  rationale: κοσμοκράτορες の「世界を支配する者」という複合語の力と、τοῦ σκότους τούτου の所属・特徴づけの関係をともに表す。「今の」は原文に明示されないため本文に補わない。
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: 悪の霊的な勢力
  rationale: 中性複数の形容詞が実体詞的に用いられ、悪に属する霊的存在・諸力を指す。単なる「霊的なもの」より文脈上の敵対性が明瞭で、「軍勢」とまでは限定しない。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上の領域にいる
  rationale: エフェソ書で繰り返される表現を、場所・領域を示す自然な現代日本語で訳す。ここでは直前の悪の霊的勢力を修飾するものとして表現する。
theological_decisions:
- issue: 列挙された敵対者の性質
  choice: 主として人間を超えた霊的諸力を指す表現とする
  alternative: 人間の支配者や制度を主に指す、または霊的存在とその地上的な現れの双方を含むと読む
  rationale: κοσμοκράτορας と τὰ πνευματικὰ τῆς πονηρίας を含む語句の積み重ねは霊的敵対者を直接指し示す。ただし、それらが地上に現れる可能性までは訳文で否定しない。
- issue: σάρξ の意味
  choice: 「血肉」という慣用表現の一部として身体を持つ人間を指す
  alternative: 「罪深い性質」と解する
  rationale: ここでは αἷμα と結びついて人間を表すため、パウロ書簡に見られる倫理的・神学的な「肉」の用法には置き換えない。
- issue: ἐν τοῖς ἐπουρανίοις の係り先
  choice: 「悪の霊的な勢力」の所在・活動領域を示す
  alternative: 列挙された敵対勢力全体に広く係ると読む
  rationale: 語順上は直前の τὰ πνευματικὰ τῆς πονηρίας に自然に結びつくため本文ではそう示すが、意味上、列挙全体と関連する可能性を排除しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「格闘」「血肉」「天上の領域」によって原文の比喩と荘重さを保った。πρός の反復は、日本語で過度に重くならないよう列挙の末尾で「相手にする」とまとめた。
