revisions:
- from: 私たちの格闘は、血肉[a]を相手にするものではなく、支配者たち、権威者たち、この闇に属する世界の支配者たち[b]、天上の領域にいる[c]悪の霊的な勢力を相手にするものだからです。
  to: 私たちの格闘は、血肉[a]を相手にするものではなく、支配者たち、権威者たち、この闇に属する世界の支配者たち[b]、天上の領域にある[c]悪の霊的な勢力を相手にするものだからです。
  rationale: 本文の意味は維持したまま、天的領域を示す前置詞句の日本語としての自然さを整えた。「ある」は霊的勢力の所在・活動領域を示し、人格的な霊的存在だけに意味を狭めない。脚注cも同じ統語関係を反映するよう修正した。
