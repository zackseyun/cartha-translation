  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: ja
  text: ですから、真理をもって腰に帯を締め[a]、正しさの胸当てを身につけて、立ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「真理の帯を腰に締め」。ギリシア語は直訳すると「真理において（または真理によって）腰を締め」であり、「真理」が帯の内容を表すのか、腰を締める際の手段・領域を表すのかには解釈の幅があります。
    reason: ἐν ἀληθείᾳの機能に関する解釈上の幅を保ちながら、περιζωσάμενοιに含まれる帯を締める動作を自然な日本語で明示するため。
lexical_decisions:
- source_word: στῆτε
  choice: 立ちなさい
  rationale: アオリスト能動命令法二人称複数の簡潔で決然とした命令を表す。「しっかり」は文脈上含意され得るが、この語自体には明示されていないため本文には加えない。
- source_word: οὖν
  choice: ですから
  rationale: 前の勧告を受けた帰結を示す。現代日本語として自然に論理的つながりを保つ。
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: 腰を締め
  rationale: περιζώννυμιの『周りに締める、帯を締める』という動作と、ὀσφύςの腰の部位を簡潔に表す。分詞は後続の分詞とともに主命令に伴う備えとして訳した。
- source_word: ἐν ἀληθείᾳ
  choice: 真理をもって
  rationale: ἐνが手段または領域を表し得る曖昧さをある程度保ち、客観的な真理と誠実さの含意を一方に限定しない。「真理の帯」として、原文に明示されない名詞『帯』を本文へ補うことは避けた。
- source_word: ἐνδυσάμενοι
  choice: 身に着けて
  rationale: 衣服や武具を着用するἐνδύωを、胸当てに適した自然な現代日本語で表す。
- source_word: τὸν θώρακα
  choice: 胸当て
  rationale: 胸部を守る武具という比喩を明瞭に伝える、一般読者に理解しやすい語を選んだ。
- source_word: τῆς δικαιοσύνης
  choice: 正しさの
  rationale: δικαιοσύνηが持つ、神との関係および倫理的な正しさを含み得る幅を日本語の『正しさ』で簡潔に表す。「公正」という可能性は脚注に残す。
theological_decisions:
- issue: 武具の比喩におけるδικαιοσύνηの訳
  choice: 正しさ
  alternative: 公正
  rationale: 本文ではパウロ書簡における広い意味範囲を過度に教理化しない『正しさ』を採用する。一方、社会的・法的な正義ないし公正の側面も原語にあり得るため、脚注で明示する。
- issue: ἐν ἀληθείᾳと武具の関係
  choice: 真理をもって腰を締め
  alternative: 真理を帯として腰に締め
  rationale: 原文は『帯』に相当する名詞を明示せず、ἐνの機能にも幅がある。本文では構文を比較的近く保ち、武具としての帯を明示する解釈は脚注に示す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、命令の荘重さと武具の比喩を保った。二つのアオリスト分詞は、日本語では主命令に先立つ完了だけを強調しすぎないよう、連用形で自然につないだ。
