  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: ja
  text: 子どもたちよ、主にあって、両親に従いなさい。これは正しいことだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: 子どもたちよ
  rationale: 呼びかけの複数形として、家庭の中の子どもたちに直接語りかける力を自然な現代日本語で表す。
- source_word: ὑπακούετε
  choice: 従いなさい
  rationale: 単に話を聞くことではなく、聞いて応じる服従を命じる現在命令形の意味を表す。
- source_word: τοῖς γονεῦσιν ὑμῶν
  choice: 両親に
  rationale: γονεῖς は父母を集合的に指すため、日本語として簡潔で自然な「両親」とした。ὑμῶν は文脈上「あなたがたの」を明示しなくても明白である。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロに特徴的な簡潔な表現を保ち、主との関係の中で、あるいは主に属する者として、という含みを一つに限定しない。
- source_word: δίκαιον
  choice: 正しいこと
  rationale: ここでは道徳的に正当でふさわしいことを意味するため、現代日本語で明快な表現とした。
theological_decisions:
- issue: 「主にあって」（ἐν κυρίῳ）の係り方と範囲
  choice: 命令に結び付けて「主にあって両親に従いなさい」と訳し、意味の幅を脚注で示す。
  alternative: 「主に属する子どもたちは両親に従いなさい」、または「主にあってふさわしいように両親に従いなさい」
  rationale: ギリシア語では命令と結び付くのが自然だが、子どもたちの主との結び付き、服従が行われる領域・あり方、主への忠誠による含意上の限界のいずれを前面に出すかは明示されていない。そのため本文では定型表現を保ち、解釈を一つに固定しない。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ。「子どもたちよ」で直接の呼びかけを示し、「主にあって」はパウロ的な神学表現の余韻と曖昧さを残した。
