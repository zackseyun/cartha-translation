id: EPH.6.23
reference: Ephesians 6:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: ja
  text: 父なる神と主イエス・メシアから、兄弟たちに平安と信仰を伴う愛がありますように。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹に」とも訳せる。ギリシア語は男性複数形の「兄弟たち」だが、信仰者の共同体全体を指すことがある。
    reason: alternative_reading
  - marker: b
    text: 「忠実さを伴う愛」または「信頼を伴う愛」とも訳せる。ここでは通常の訳語である「信仰」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη
  choice: 平安
  rationale: 動詞を伴わない祝福の定型表現であり、日本語では文末の「ありますように」によって祈願の意味を自然に表した。
- source_word: τοῖς ἀδελφοῖς
  choice: 兄弟たちに
  rationale: ギリシア語の男性複数形を保ちつつ、共同体全体を指し得ることを脚注で示した。
- source_word: ἀγάπη
  choice: 愛
  rationale: パウロ書簡での通常の語義と語彙上のつながりを保つ。
- source_word: μετὰ πίστεως
  choice: 信仰を伴う
  rationale: μετά＋属格の随伴の意味を明示した。πίστιςは基本的に「信仰」と訳し、別の語義は脚注に残した。
- source_word: ἀπὸ
  choice: から
  rationale: 祝福の源が父なる神と主イエス・メシアであることを表す。
- source_word: θεοῦ πατρὸς
  choice: 父なる神
  rationale: 原文に「私たちの」はないため補わず、日本語で定着した自然な表現とした。
- source_word: κυρίου
  choice: 主
  rationale: 新約聖書におけるκύριοςの標準的で荘重な訳語。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 主イエス・メシア
  rationale: Χριστόςの称号としての意味を「メシア」で表し、日本語の固有名と称号の連なりとして中黒を用いた。
theological_decisions:
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: 音写によって慣用化した「キリスト」ではなく、原語の称号としての意味を明示した。
- issue: ἀδελφοῖςの性と指示範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原文の男性複数形を本文に反映しながら、信仰共同体の男女全体を含み得ることを脚注で示した。
- issue: πίστιςの意味
  choice: 信仰
  alternative: 誠実／信頼
  rationale: この箇所では通常の意味である「信仰」を本文に置き、語が持ち得る他の意味を脚注で保存した。
- issue: 祝福の構文
  choice: 平安があり、…愛がありますように
  alternative: 平安と、信仰を伴う愛が…からあるように
  rationale: 原文の省略された祈願を自然な日本語として補い、平安と愛の双方が神と主イエス・メシアに由来する構造を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語。書簡末尾の祝福にふさわしい品位を保ち、原文にない「私たちの」は補っていない。脚注記号は該当する二つの語句に対応する。
