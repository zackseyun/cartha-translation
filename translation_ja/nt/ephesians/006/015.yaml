  text: また、平和の福音の備えを足に着け、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「用意」とも訳せる。あるいは、「平和の福音を告げ知らせる用意をして」、または「平和の福音による堅固な足場をもって」という意味の可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: 足を履き固め
  rationale: 履物を足の下に結び付けて身に着けるという語義と、武具の比喩を保つ。「履き固め」によって、行動に備えて確実に履く姿を自然な日本語で表した。
- source_word: τοὺς πόδας
  choice: 足
  rationale: 原文の直接目的語は履物ではなく「足」であり、身体的な比喩を明示した。
- source_word: ἐν
  choice: をもって
  rationale: ここでは装備または手段を表すと考えられるため、文脈に合う荘重で自然な表現とした。
- source_word: ἑτοιμασίᾳ
  choice: 備える用意
  rationale: 基本義である「用意、備え」を保ちつつ、福音によって備えられるという解釈が日本語で伝わるようにした。ただし、宣教への用意か、堅固な足場かという点は本文で限定しない。
- source_word: εὐαγγελίου
  choice: 福音
  rationale: パウロ書簡で定着した神学的な語であり、現代日本語でも理解される。
- source_word: εἰρήνης
  choice: 平和
  rationale: εἰρήνηの標準的な訳語。「福音」を限定する属格として「平和の福音」とした。
theological_decisions:
- issue: ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης の意味
  choice: 平和の福音が備える用意をもって足を装備する
  alternative: 平和の福音を宣べ伝える用意をする／平和の福音が与える堅固な足場を得る
  rationale: 属格連鎖は圧縮されており、宣教への用意、福音による備え、堅固な足場などの解釈が可能である。本文では「宣べ伝える」や「足場」を補わず、原文の曖昧さを脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、武具の比喩にふさわしい品位を保った。「足を履き固め」は直訳的な「足に履物を履き」より簡潔で力強い表現。前後に続く分詞構文の一節であるため、末尾を読点とした。
