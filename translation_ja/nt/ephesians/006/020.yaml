  text: ὑπὲρ οὗ πρεσβεύω ἐν ἁλύσει, ἵνα ἐν αὐτῷ παρρησιάσωμαι ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: ja
  text: その福音の奥義のために、私は鎖につながれながら使節として務めています[a]。私がそのことにおいて、語るべきとおりに大胆に語ることができるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「鎖の中で使節として務めています」。ギリシア語は単数の「鎖」を用いており、拘束されている状況を表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: その福音のために
  rationale: 関係代名詞は中性単数で、直前の「福音の奥義」を受けるのが最も自然である。日本語では指示対象を明らかにするため「その福音」と補った。
- source_word: πρεσβεύω
  choice: 使節となっています
  rationale: 公的に遣わされた代表者として働く意味を保ちつつ、現代日本語として自然にした。
- source_word: ἐν ἁλύσει
  choice: 鎖につながれた
  rationale: 原文は単数形「鎖の中で」。拘束・投獄という現実と鎖の比喩像をともに伝える表現とした。
- source_word: ἵνα
  choice: できるよう
  rationale: 祈りの目的を導く接続表現として自然な日本語にした。
- source_word: ἐν αὐτῷ
  choice: それについて
  rationale: 代名詞は文法的に中性で、福音または福音の奥義を指す。「それにあって」より意味が通じやすく、関係・内容を表す「それについて」とした。
- source_word: παρρησιάσωμαι
  choice: 大胆に語ることができる
  rationale: 率直さ、自由、公然性、勇気を伴う発言を表す動詞であり、文脈に即して「大胆に語る」とした。
- source_word: ὡς δεῖ με λαλῆσαι
  choice: 語るべきように
  rationale: δεῖが示す必要・義務を「べき」で保ち、後続の発話動詞も訳出した。
theological_decisions:
- issue: 関係代名詞 οὗ と代名詞 αὐτῷ の指示対象
  choice: いずれも前節の福音、または「福音の奥義」を指す中性の表現として訳す。
  alternative: 人物を指すものとして「その方のために」「その方にあって」と解する。
  rationale: SBLGNT本文では両代名詞が中性単数であり、前節の「福音の奥義」を受ける解釈が文法上最も自然である。人物を指す読みを本文に持ち込まない。
- issue: ἵνα節と祈りのつながり
  choice: 文脈上省略されている依頼を「祈ってください」と補い、目的節を自然に接続する。
  alternative: 「大胆に語るためです」とだけ訳し、依頼を補わない。
  rationale: 本節は前節から続く祈りの依頼である。日本語で独立した節として意味を明確にするため、文脈上明白な語を補った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、使徒的な使命と投獄の逆説を保った。「アンバサダー」は避け、 dignified かつ一般読者に理解しやすい「使節」を採用した。節単独でも通じるよう前節からの祈りの依頼を末尾に補った。
