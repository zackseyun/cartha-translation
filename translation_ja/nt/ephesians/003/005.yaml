  to: この奥義は、他の世代の人々[a]には、今、聖霊によって[b]神の聖なる使徒たちと預言者たちに啓示されたほどには、知らされていませんでした。
  rationale: 原文の一つの比較節を日本語でも一文に保ち、「今…啓示されたほどには」によって、過去にまったく知らされなかったとは断定しない比較のニュアンスを明示しました。本文を現代標準日本語として自然にしつつ、脚注で「人の子ら」の字義とἐν πνεύματιの解釈上の幅を保持しています。
