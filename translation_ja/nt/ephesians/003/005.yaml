id: EPH.3.5
reference: Ephesians 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: ja
  text: この奥義は、他の世代の人々[a]には、今、聖霊によって[b]神の聖なる使徒たちと預言者たちに啓示されたほどには、知らされていませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では字義的に「人の子ら」。人類一般を指す表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖霊にあって」。ギリシア語の表現は、手段または領域を表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: この奥義は
  rationale: 中性関係代名詞は直前の「奥義」（3:4）を受ける。日本語で関係節のつながりを明瞭かつ自然にするため、先行詞を補って主題化した。
- source_word: ἑτέραις γενεαῖς
  choice: ほかの時代には
  rationale: 与格を時を表す用法と理解し、ἑτέραιςの「ほかの」を保った。「世代」よりも、過去の各時代を指す文脈に自然な「時代」とした。
- source_word: οὐκ ἐγνωρίσθη
  choice: 知らされていませんでした
  rationale: γνωρίζωの受動態が持つ「知らせる」の受動的・使役的意味を保ち、単に「知られていなかった」とはしなかった。
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: 人の子ら
  rationale: 字義的なセム語調の表現を本文に残した。人間一般を指す意味は脚注で示す。
- source_word: ὡς νῦν
  choice: 今のようには
  rationale: 以前には全く知られなかったと断定せず、現在の啓示との様態・程度の比較を保った。
- source_word: ἀπεκαλύφθη
  choice: 啓示されました
  rationale: パウロの啓示用語としての意味と受動態を簡潔に保った。
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: 神の聖なる使徒たちと預言者たちに
  rationale: ἁγίοιςは並列された使徒と預言者の双方にかかるものとして訳した。αὐτοῦは文脈上の所有者を自然な日本語で明示して「神の」とした。
- source_word: ἐν πνεύματι
  choice: 御霊によって
  rationale: 啓示の文脈では聖霊を指す可能性が高い。日本語では手段・働き手を自然に表す「によって」とし、領域を表す「御霊にあって」の可能性を脚注に残した。
theological_decisions:
- issue: πνεύματιの指示対象
  choice: 聖霊（御霊）
  alternative: 人間の霊、または霊的な領域・様態
  rationale: 使徒と預言者への神的啓示という文脈、およびパウロの用法から、聖霊が最も自然である。ただし前置詞ἐνの機能には手段と領域の幅があるため脚注で示した。
- issue: 過去の啓示と現在の啓示の関係
  choice: 「今のようには」と比較の度合いを保持
  alternative: 以前には全く知らされなかった
  rationale: ὡς νῦνは、過去に一切の知識がなかったとの絶対的否定ではなく、現在と同じ仕方または程度ではなかったという比較を表し得るため、その緊張を解消しなかった。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書的な荘重さを保つ文体。「奥義」「御霊」「啓示」は文脈上重要な神学語として採用した。長いギリシア語の関係節は、日本語の可読性のため二文に分け、対比を「しかし今」で明示した。
