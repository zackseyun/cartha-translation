id: EPH.3.17
reference: Ephesians 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: ja
  text: 信仰によって[b]メシア[a]があなたがたの心のうちに住み、あなたがたが愛のうちに[c]根を張り、土台を据えられているためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語Χριστόςは「油を注がれた者」を意味する称号である。
    reason: alternative_reading
  - marker: b
    text: 「信頼によって」とも訳せる。ここでは「信仰によって」が文脈に最もよく合う。
    reason: lexical_alternative
  - marker: c
    text: 「愛のうちに」は、最も自然には「根を張り、土台を据えられている」に係るが、「心のうちに住み」に係ると取ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: 住み
  rationale: 一時的な滞在ではなく、定まって住むことを表す。前の祈願に従属するアオリスト不定詞なので、文末の「ためです」で目的・結果のつながりを示した。
- source_word: τὸν Χριστόν
  choice: メシア
  rationale: 冠詞を伴うΧριστόςがここでは称号として機能しているため、その意味を保つ「メシア」とした。日本語で一般的な「キリスト」も可能なので脚注に示した。
- source_word: διὰ τῆς πίστεως
  choice: 信仰によって
  rationale: διά＋属格が手段を示し、この文脈のπίστιςには「信仰」が最も自然である。「信頼」の含意も脚注に残した。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: あなたがたの心のうちに
  rationale: 「心」は感情だけでなく人の内面全体を指す聖書的表現であり、「うちに」によって内住の意味を自然に表した。
- source_word: ἐν ἀγάπῃ
  choice: 愛のうちに
  rationale: 愛を、根を下ろし土台を据えられている領域・基盤として表す。語順と流れに従い、後続する二つの分詞に結び付けた。
- source_word: ἐρριζωμένοι
  choice: 根を下ろし
  rationale: 完了受動分詞が示す、根付かされた結果として続いている状態を自然な農耕比喩で表した。
- source_word: τεθεμελιωμένοι
  choice: 土台を据えられた者となる
  rationale: 完了受動分詞の建築比喩と受動の意味を保った。「根を下ろす」と並ぶ異なる二つの比喩を混同しない表現とした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは人名化した呼称よりも称号としての意味が前面に出ると判断し、「油注がれた者」という称号の機能を伝える「メシア」を本文に置いた。ただし日本語の伝統的・一般的な表記も脚注で保持した。
- issue: διὰ τῆς πίστεωςにおけるπίστιςの意味
  choice: 信仰によって
  alternative: 信頼によって
  rationale: この句はメシアが信じる者の心に住む手段を表すと読むのが自然である。「忠実さ」と限定する根拠は乏しく、「信頼」という語義上の可能性は脚注に示した。
- issue: ἐν ἀγάπῃの係り先
  choice: 「根を下ろし、土台を据えられた」に係る
  alternative: 「心のうちに住み」に係る
  rationale: 語順と修辞的なまとまりから、愛を二つの分詞的比喩の領域・基盤と読むのが最も自然である。ただしギリシア語の統語上、直前の「住む」に結び付ける余地もあるため脚注で明示した。
- issue: 二つの完了受動分詞の状態性
  choice: 祈りの目的・結果として、読者がその状態に置かれることを表す
  alternative: すでに成立している読者の状態を付帯的に描写する
  rationale: 分詞は完了受動で継続状態を表す一方、前文から続く祈願構文との関係には幅がある。本文は日本語として祈りの流れを明確にしつつ、受動と結果状態を保った。
translation_notes:
  register: 現代標準日本語の明瞭で格調ある文体とした。前節から続く祈願の一部であることを「ためです」で表し、農耕と建築という二つの比喩、および複数形の「あなたがた」を保持した。
