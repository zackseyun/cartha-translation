id: EPH.3.20
reference: Ephesians 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: ja
  text: 私たちのうちに働く力に応じて[b]、私たちが願い求め、思い描くことのすべてを、はるかに超えて[a]行うことのできる方に、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「はるかに超えて」は、「豊かに超えて」または「限りなく超えて」とも訳せる。ギリシア語は、願いや思いを超える程度を強く表している。
    reason: lexical_alternative
  - marker: b
    text: 「力に応じて」は、その力を単なる手段としてではなく、行われることの基準や尺度として示す。
    reason: semantic_clarification
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: 行うことのできる方に
  rationale: 定冠詞を伴う実詞的分詞と与格を、日本語の頌栄の継続として自然に表した。「神」を補わず、指示対象は文脈に委ねた。
- source_word: δὲ
  choice: 無訳
  rationale: ここでは強い対立ではなく頌栄への移行を示す。日本語で「さて」「しかし」を置くと不自然または過剰になるため、文脈上の接続に委ねた。
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: そのすべてをはるかに超えて
  rationale: ὑπέρと強意の副詞ὑπερεκπερισσοῦが表す、限度を大きく上回る意味を、明瞭で自然な現代日本語で保持した。
- source_word: ποιῆσαι
  choice: 行う
  rationale: ποιέωの広い意味を保ち、「成し遂げる」のように結果性を必要以上に限定しない表現とした。
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: 私たちが願い求めること、思い描くこと
  rationale: αἰτέομαιは神への願いを含みうる「願い求める」、νοέωはここでは心に考え得ることを示すため「思い描く」とした。二項の関係は原文のἢに即して並列した。
- source_word: κατὰ τὴν δύναμιν
  choice: 力に応じて
  rationale: κατάの基準・尺度の意味を保ち、単なる手段を示す「力によって」とはしなかった。
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: 私たちのうちに働く
  rationale: 現在進行する有効な働きを簡潔に表した。ἐν ἡμῖνは「私たちの間で」も可能だが、ここでは内に働く意味を第一にした。
theological_decisions:
- issue: 頌栄を受ける方の指示対象
  choice: 「方」とし、「神」を明示的に補わない
  alternative: 「それを行うことのできる神に」
  rationale: 文脈上は神を指すが、この節のギリシア語本文にはθεόςが明記されていないため、実詞的分詞の形を保った。
- issue: 信徒に働く力の位置・範囲
  choice: 「私たちのうちに働く力」
  alternative: 「私たちの間で働く力」
  rationale: ἐν ἡμῖνの内在的・共同体的な広がりを過度に教理化せず、直接的な表現を採用した。
- issue: 願いや思考を超える程度
  choice: 「そのすべてをはるかに超えて」
  alternative: 「限りなく豊かに超えて」
  rationale: 神の力の無限性について本文以上の体系的説明を加えず、強意副詞の非常に強い超過を日本語で明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。21節へ続く頌栄の途中であるため、原文どおり文末を完結させず読点で結んだ。脚注記号は、それぞれ説明対象となる句の直後に置いた。
