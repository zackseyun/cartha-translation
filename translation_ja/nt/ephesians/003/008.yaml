  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: ja
  text: すべての聖なる者たちの中でも最も小さい私に、この恵みが与えられました。それは、異邦人[a]に、メシア[b]の究め尽くせない豊かさを告げ知らせるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。ここでは、特にユダヤ人ではない人々を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「キリスト」。ギリシャ語「クリストス」は「油注がれた者」を意味する称号。
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: 最も小さい者
  rationale: 比較級を重ねたような強意的な形によって表されたパウロの徹底した謙遜を、明瞭で自然な日本語にした。「最も小さい者よりもさらに小さい者」も語形に近いが、日本語では不自然になりやすい。
- source_word: ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する者として聖別された信徒たちを指す。現代の読者に意味が伝わりやすく、後世の特別な聖人という含意を避ける。
- source_word: χάρις
  choice: 恵み
  rationale: 神から無償で与えられる恩恵と、そこから生じる務めの双方を含み得るパウロ的用法を保つ。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人
  rationale: この文脈では地政学的な『諸国民』一般よりも、ユダヤ人ではない諸民族を指す可能性が高い。別訳を脚注に示した。
- source_word: εὐαγγελίσασθαι
  choice: 福音として告げ知らせる
  rationale: 単なる一般的な宣言ではなく、良い知らせを伝えるという動詞の意味を明示する。後続する目的語とも自然につながる。
- source_word: ἀνεξιχνίαστον
  choice: 究め尽くせない
  rationale: 跡をたどって全容を突き止めることができないという語の比喩と、理解し尽くせないほど深いという意味を自然な日本語で表す。
- source_word: πλοῦτος
  choice: 豊かさ
  rationale: 単なる物質的財産ではなく、キリストにある救いの測り知れない充溢を表す比喩として自然である。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: Χριστόςという称号に対応する、日本語聖書で広く理解される形を採用した。称号の意味を示す別訳を脚注に置いた。
theological_decisions:
- issue: Χριστοῦの訳し方
  choice: キリスト
  alternative: メシア
  rationale: このパウロ書簡の文脈では日本語の『キリスト』が自然で、原語の称号に直接対応する。一方、語義は『メシア』すなわち油注がれた者であるため、別訳として明示し、称号性を失わせない。
- issue: χάριςが指す内容
  choice: 恵み
  alternative: 恵みの賜物／務め
  rationale: この恵みには神の恩恵と異邦人への宣教委託が重なっている可能性がある。本文では広い語を保ち、一方だけに限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒の謙遜と宣教委託の荘重さを保った。原文のダッシュが示す説明関係は「それは……ためです」で展開し、日本語として読みやすくした。
