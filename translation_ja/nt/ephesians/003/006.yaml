source:
  edition: SBLGNT
  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: ja
  text: すなわち、異邦人[a]が、福音を通して、メシアであるイエス[b]にあって、共同の相続人となり、同じからだの一員となり、約束にともにあずかる者となることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。ここでは特に、イスラエルとともに神の救いの約束に加えられた非ユダヤ人を指します。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「キリスト・イエス」。「メシア」はギリシア語「クリストス」が表す称号です。
    reason: alternative_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: 異邦人
  rationale: この文脈では地理的な「諸国民」一般ではなく、ユダヤ人とともに神の約束にあずかる非ユダヤ人を指すため。
- source_word: συγκληρονόμα
  choice: 共同の相続人
  rationale: 接頭辞 συν- が示す、他の人々と同じ相続にあずかる意味を明確に表す。
- source_word: σύσσωμα
  choice: 同じからだに属し
  rationale: 一つのからだにともに組み入れられているという比喩を、簡潔で自然な日本語にした。
- source_word: συμμέτοχα
  choice: 約束をともに受ける者
  rationale: 約束への共同参与を表し、前二項との並行性も保つ。
- source_word: τῆς ἐπαγγελίας
  choice: 約束
  rationale: 単数形を保ち、内容を特定の説明で狭めない。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにあって
  rationale: Χριστός の称号としての意味を明示しつつ、ἐν の結合・領域を表すパウロ的表現を保つ。
- source_word: διὰ τοῦ εὐαγγελίου
  choice: 福音を通して
  rationale: 属格を伴う διά の手段・媒介の意味を自然に表す。
- source_word: εἶναι
  choice: となり、…属し、…者となること
  rationale: 前節の「奥義」の内容を説明する不定詞であるため、日本語では説明節として自然に接続した。
theological_decisions:
- issue: Χριστόςを称号として訳すか、慣用的な名称として音写するか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: 異邦人が神の約束に加えられるという救済史的文脈では、油注がれた者という称号の働きが保たれているため。
- issue: ἔθνηの指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: 直前から続くユダヤ人と非ユダヤ人の共同参与が主題であり、ここでは非ユダヤ人を明確に指すため。
- issue: 三つの συν- 複合語の並行性
  choice: 共同の相続人／同じからだに属し／約束をともに受ける者
  alternative: ともに相続する者／一つのからだをなす者／ともに約束にあずかる者
  rationale: 三項の共同性を示しながら、日本語として過度に機械的な反復にならない形で、相続・からだ・参与という異なる比喩を保持した。
translation_notes:
  register: 現代標準語による、明瞭で品位ある文体。前節から続く文法関係を「すなわち」と文末の「ことです」で示した。三つの συν- 複合語の修辞的な並行性を保ちつつ、普通の読者に理解できる自然な日本語とした。
