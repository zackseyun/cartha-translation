base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: ja
  text: このキリストにあって、私たちは、キリストを信じる信仰によって[a]、確信をもって大胆に神に近づくことができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストの忠実さによって」。ギリシア語の表現は、キリストに向けられた信仰とも、キリストご自身の忠実さとも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: このキリストにあって
  rationale: 男性単数の関係代名詞は直前のキリストを指すと見るのが自然であり、キリストとの結びつきを表す「キリストにあって」で訳した。日本語では指示対象を明確にするため「このキリスト」とした。
- source_word: παρρησίαν
  choice: 大胆に
  rationale: 恐れず率直に近づける自由を表す。後続の πεποίθησις（確信）と同じ語にせず、両者の意味の違いを保った。
- source_word: προσαγωγὴν
  choice: 神に近づくこと
  rationale: 神のもとへ近づき、その御前に受け入れられることを指す。目的語の「神」は文脈上補い、現代日本語として自然にした。
- source_word: ἐν πεποιθήσει
  choice: 確信をもって
  rationale: 近づく際の揺るがない確かさを表す自然な日本語であり、παρρησίαν の「大胆に」と区別した。
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: キリストを信じる信仰によって
  rationale: αὐτοῦを目的格的属格と解し、信仰の対象がキリストであることを明示した。ただし主格的属格として「キリストの真実によって」と読む可能性も脚注に残した。
theological_decisions:
- issue: διὰ τῆς πίστεως αὐτοῦ の属格の解釈
  choice: キリストを信じる信仰によって
  alternative: キリストの真実によって
  rationale: この節では信じる者が神に近づけることが焦点であるため、本文では目的格的属格の解釈を採った。しかしギリシア語はキリストご自身の真実・忠実さを指す主格的属格にも解し得るため、その神学的緊張を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、礼拝朗読にも適する品位を保った。「大胆さ」と「確信」を別々の表現で保持し、日本語として自然になるよう「大胆に神に近づくことができます」と構成した。
