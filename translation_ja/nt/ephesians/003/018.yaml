id: EPH.3.18
reference: Ephesians 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: ja
  text: それは、あなたがたがすべての聖なる者たちと共に、幅、長さ、高さ、深さがどれほどであるかを理解するのに十分な力を得るためです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、これら四つの次元が何の幅、長さ、高さ、深さなのかは明示されていません。多くの人は、次節の「キリストの愛」を指すと理解します。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: それは〜ためです
  rationale: 前節から続く祈りの目的・結果を自然な現代日本語で示す。
- source_word: ἐξισχύσητε
  choice: 理解できるほど強められる
  rationale: 必要を満たすだけの力・能力を得るという語義を、後続の不定詞との関係が明確になる形で表した。受動表現は文脈上、力を与える方を暗示するが明示しない。
- source_word: καταλαβέσθαι
  choice: 理解する
  rationale: ここでは霊的な現実を知的・経験的に捉える意味。「把握する」も可能だが、一般読者に明瞭な「理解する」を採用した。
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: すべての聖なる者たちと共に
  rationale: 共同の参与を示す σύν と、パウロ書簡で信徒を指す ἅγιοι の語形を保ちつつ、現代日本語で意味が伝わるようにした。
- source_word: τί
  choice: どれほどであるか
  rationale: 直訳的な「何であるか」より日本語の寸法列に自然であり、四つの次元の広がりを問う趣旨を表す。ただし対象そのものは補わない。
- source_word: τὸ πλάτος
  choice: 幅
  rationale: πλάτος の標準的で現代的な寸法語。文脈によっては「広さ」とも訳せる。
- source_word: μῆκος
  choice: 長さ
  rationale: 標準的な寸法語をそのまま用いた。
- source_word: ὕψος
  choice: 高さ
  rationale: 標準的な寸法語をそのまま用いた。
- source_word: βάθος
  choice: 深さ
  rationale: 標準的な寸法語をそのまま用いた。
theological_decisions:
- issue: 四つの次元が何を指すか
  choice: 本文では「幅、長さ、高さ、深さ」の対象を明示しない。
  alternative: 「キリストの愛の幅、長さ、高さ、深さ」と補う、または神の救いの計画・満ち満ちた豊かさを指すと明示する。
  rationale: ギリシア語本文はこの節で対象を明記していない。次節のキリストの愛が意味を補うと理解できるが、それを本文に挿入すると解釈上の余地を狭めるため、原文の開かれた構文を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖徒」より意味の透明な「聖なる者たち」を採用した。寸法語は平易に統一し、原文が明示しない対象は本文で補わず脚注で説明した。
