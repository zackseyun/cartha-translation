  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: ja
  text: ですから、あなたがたのために私が受けている苦難のことで、どうか落胆しないでください。[a] それは、あなたがたの栄光なのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私自身が苦難の中で落胆しないようにと、私は願っている」と理解することもできる。原文では、落胆しない主体が明示されていない。
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: 「それ」は、「あなたがたのために私が受けている苦難」という事柄全体を指すと理解できる。
    reason: referent_clarification
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の議論から導かれる結論・勧めを、自然な現代日本語で明確に示す。
- source_word: αἰτοῦμαι
  choice: どうか……してください
  rationale: 直訳的な「私は願います」よりも、聞き手への切実な要請として自然に表した。要請の相手である「あなたがた」は文脈から補われる。
- source_word: μὴ ἐγκακεῖν
  choice: 落胆しないでください
  rationale: ἐγκακέωの、勇気を失う、くじけるという意味を、平明かつ品位ある表現で伝える。
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: 私が受けている苦難のことで
  rationale: ἐνはここでは落胆の機会・原因を示すと理解し、日本語として自然に因果・契機の関係を表した。「苦難」はθλῖψιςの深刻さを保つ。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのために
  rationale: パウロの苦難が受取人の益のためであることを簡潔に示す。
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: それは、あなたがたの栄光なのです
  rationale: 単数の関係代名詞が先行する苦難ないし苦難を伴う働き全体を一つの事柄として受ける含みを、「それ」で保った。δόξαは神学的・修辞的な重みを損なわないよう「栄光」とした。
theological_decisions:
- issue: 落胆しない主体
  choice: 文脈上、パウロが受取人たちに落胆しないよう求めているものとして本文を訳す。
  alternative: パウロ自身が苦難の中でくじけないよう願っていると取る余地を認める。
  rationale: 不定詞の主語は明示されていないが、勧告の流れと受取人への配慮から、通常は「あなたがた」が補われる。原文の形式上の余地は脚注に残した。
- issue: ἥτις ἐστὶν δόξα ὑμῶν の指示対象
  choice: パウロが彼らのために受ける苦難、またはその苦難を伴う働きを一つの事柄として指す表現にした。
  alternative: 直前の複数形「苦難」だけを限定的に指すと明示する。
  rationale: ἥτιςは女性単数であり、直前の複数形だけに機械的に対応させず、先行内容全体を概念的に受ける可能性を保つ。「栄光」の理由も救済史的説明へ狭く固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「苦難」「栄光」という主要語の重みを保持した。要請は自然な敬体で表し、原文に残る主語と指示対象の曖昧さは脚注で明示した。
