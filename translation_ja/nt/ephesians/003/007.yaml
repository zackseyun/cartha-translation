source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: ja
  text: 私はこの福音に仕える者となりました。私に与えられた神の恵みの賜物に応じ、神の力の働きに応じてです。—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私はこの福音に仕える者とされました」。
    reason: ἐγενήθηνは「となった」とも、受動的な含みを表して「とされた」とも訳しうるため。
lexical_decisions:
- source_word: οὗ
  choice: この福音に
  rationale: 文脈上、直前の中性名詞 εὐαγγέλιον（福音）を受ける関係代名詞。日本語では「その福音の」とするより、διάκονος との関係を自然に示す「この福音に仕える」とした。
- source_word: ἐγενήθην
  choice: 私は…者となりました
  rationale: γίνομαι のアオリストとして、役割に就いたことを表す。「された」として受動の主体を明示しすぎず、同時に後続する神の恵みと力がその根拠であることを保つ。
- source_word: διάκονος
  choice: 仕える者
  rationale: 奉仕する者という機能的意味を表し、後代の教会職制としての「執事」や、制度的に響きうる「教役者」を避けた。
- source_word: κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι
  choice: 神の恵みの賜物が私に与えられたことによるのであり
  rationale: κατά が示す基準・根拠を「による」で自然に表現し、賜物、恵み、授与の受動性をすべて保持した。
- source_word: κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ
  choice: 神の力の働きによるのです
  rationale: ἐνέργεια を単なる静的な能力ではなく、実際に作用する力として「働き」と訳した。αὐτοῦ の指示対象は文脈上神であるため、日本語で明瞭に「神」とした。
theological_decisions:
- issue: διάκονος が示すパウロの役割
  choice: 仕える者
  alternative: 奉仕者／教役者／執事
  rationale: ここでは福音に対する奉仕の役割が述べられており、正式な教会職を明示してはいないため、職制上の意味を持ち込まない表現を選んだ。
- issue: ἐγενήθην における主体と作用
  choice: …者となりました
  alternative: …者とされました
  rationale: 動詞自体に神の直接的作用を明示しすぎず、周囲の「与えられた」「神の力の働き」によって神の主導性が明確になる構造を保った。
- issue: 二度の κατά の関係
  choice: ともに「…による」と訳す
  alternative: 「…に応じて／…に従って」
  rationale: 恵みの賜物と神の力の働きがパウロの奉仕の根拠・規準であることを自然な日本語で示す。両者の並行性も保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの召命が神の恵みと力に基づくという荘重さを保った。原文末のダッシュは文が次節へ続くことを示すため保持した。
