  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: ja
  text: 私たちの主メシア・イエスにおいて成し遂げられた、永遠の目的に従って。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: 〜に沿う
  rationale: 対格を伴い、基準や一致を表す。「〜に従って」より自然な現代日本語で、前文とのつながりも明確にする。
- source_word: πρόθεσιν
  choice: ご計画
  rationale: 神の意図的な目的・計画を指す。ここでは「目的」よりも、実行に移された意図という文脈に自然に合う。敬意を示す接頭辞を添えた。
- source_word: τῶν αἰώνων
  choice: 永遠の
  rationale: 直訳は「諸時代の」だが、この属格句は時代を超える永続性を表すと理解できる。本文では自然で明瞭な「永遠の」とし、原語の形は脚注に残す。
- source_word: ἣν
  choice: 〜られた
  rationale: 先行詞「ご計画」を受ける関係節を、日本語では連体修飾節として表した。
- source_word: ἐποίησεν
  choice: 成し遂げられた
  rationale: ποιέω の基本義は「行う、作る」だが、「計画」を目的語とするここでは、その計画を実現した意味を自然に表す。
- source_word: ἐν
  choice: 〜において
  rationale: 原語の基本的な位置・領域の表現を保ち、手段を示す「〜を通して」と断定しない。
- source_word: Χριστῷ
  choice: メシア
  rationale: Χριστός が称号として持つ「油注がれた者」というユダヤ的背景を伝える。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 固有名を日本語の標準的な形で表記した。
- source_word: κυρίῳ
  choice: 主
  rationale: κύριος の称号としての意味と新約聖書における神学的重みを保つ。
- source_word: ἡμῶν
  choice: 私たちの
  rationale: 「主」を修飾する一人称複数の所有を明確に表した。
theological_decisions:
- issue: πρόθεσιν τῶν αἰώνων の意味
  choice: 本文では「永遠のご計画」とした。
  alternative: 「諸時代のご計画」「時代を超えたご計画」
  rationale: 原語は字義的には「諸時代の計画」だが、文脈上は神の永遠の計画を表すと解される。自然な本文を優先しつつ、字義的な形を脚注で示して解釈の幅を保った。
- issue: ἐν τῷ Χριστῷ Ἰησοῦ の前置詞の働き
  choice: 「メシア・イエスにおいて」
  alternative: 「メシア・イエスを通して」
  rationale: ἐν には手段の意味もあり得るが、ここでは基本的な「〜において」を保ち、キリストが計画実現の領域なのか手段なのかを本文で一義的に決めない。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは単なる名前の一部というより称号として機能しているため、その意味とユダヤ的背景が伝わる「メシア」とした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「これは」と「ものでした」を補って前後の論述とのつながりを自然にし、暗黙の主語は文脈に基づき「神」と明示した。称号が重なる箇所は読点を置き、「私たちの主、メシア・イエス」として読みやすくした。
