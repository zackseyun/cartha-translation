  to: 私たちの主メシア・イエスにおいて成し遂げられた、永遠の目的に従って。
  rationale: 本文を原文の構文により近づけ、文脈から補った「これは」と明示的な「神が」を除いた。πρόθεσιςは「目的」として直接的に訳し、τῶν αἰώνωνの慣用的理解である「永遠の」は維持した上で、字義的な表現を脚注で示した。脚注アンカーは「メシア[a]・イエスにおいて[b]…永遠の目的[c]」として現行どおり各該当語句に付す。
