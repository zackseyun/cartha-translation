id: EPH.3.21
reference: Ephesians 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: ja
  text: この方に、教会において、またメシア[a]・イエスにおいて、すべての世代にわたり、世々限りなく、栄光がありますように。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト・イエス」とも訳される。ギリシャ語の「クリストス」は「油を注がれた者」、すなわち「メシア」を意味する称号。
    reason: 称号Χριστόςの意味と、日本語で一般的な別訳を示すため。
lexical_decisions:
- source_word: αὐτῷ
  choice: この方に
  rationale: 与格代名詞を保持し、直前の文脈で示された方を指す表現とした。固有名詞を補って指示対象を明示しすぎない。
- source_word: ἡ δόξα
  choice: 栄光がありますように
  rationale: 原文は動詞のない頌栄表現であるため、日本語では願望・帰属の力を自然に示す定型的な表現とした。
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: 教会において
  rationale: ἐκκλησίαをパウロ書簡で定着した「教会」とし、ἐνを「において」と訳して後続句との並行を保った。
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: またメシア・イエスにおいて
  rationale: καίによる並列と二度目のἐνを明示した。Χριστόςは称号としての意味を保つため「メシア」とした。
- source_word: εἰς πάσας τὰς γενεὰς
  choice: すべての世代にわたり
  rationale: 時間的な広がりを表すεἰςと、πάσαςおよびγενεάの意味を明確で自然な日本語にした。
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: 世々限りなく
  rationale: 終わりのない継続を表す強意的な慣用句として、現代日本語でも理解できる荘重な頌栄表現を用いた。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な同意・確証を表す語として、日本語で定着した音写を用いた。
theological_decisions:
- issue: Χριστῷを称号として訳すか、名称化した形で訳すか
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςが「油を注がれた者」という称号であることを読者に伝えつつ、指示対象を変えないため。「キリスト」は脚注に代案として示した。
- issue: 栄光が教会とメシア・イエスの双方に帰されると解するか
  choice: 「教会において、またメシア・イエスにおいて」として、栄光が現れる領域を並列した
  alternative: 「教会とメシア・イエスに栄光がある」とする
  rationale: 二つのἐνを保持し、栄光の帰属先であるαὐτῷと、栄光が示される領域との区別を曖昧にしないため。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、頌栄にふさわしい荘重さを保った。「において」の反復は通常の会話体より硬いが、原文の並行構造と神学的な緊張を保持するために採用した。
