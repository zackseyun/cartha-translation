  naturalness: 全体として明瞭で自然な現代標準日本語であり、頌栄として必要な荘重さもある。「において」の反復と「世々限りなく」は日常会話より文語的だが、この文脈では不自然ではなく、原文の並行性と強調にかなう。
  terminology: ἐκκλησίαを「教会」、δόξαを「栄光」、ἀμήνを「アーメン」とするのはいずれも適切である。Χριστόςを意味を示す「メシア」とし、「キリスト・イエス」を脚注で代案として示す処置は、本文の方針および原語の称号性に合致する。
