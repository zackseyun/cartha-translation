  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: ja
  text: これを読めば、あなたがたはメシア[a]の奥義についての私の洞察を理解することができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語 Χριστός は「油注がれた者」を意味する称号で、伝統的には「キリスト」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: これを読めば
  rationale: πρὸς ὃは直前に書かれた内容を指し、分詞ἀναγινώσκοντεςとともに、読者が理解するための手段を示す。日本語では「これを読めば」が自然で、前文とのつながりも明確になる。
- source_word: δύνασθε
  choice: ことができます
  rationale: 能力・可能性を表す語として、明瞭で現代的な表現を用いた。
- source_word: νοῆσαι
  choice: 知る
  rationale: ここでは、読んでパウロの理解を認識し把握することを表す。「理解する」では直後のσύνεσιςと重複して不自然になるため、「知る」とした。
- source_word: τὴν σύνεσίν μου
  choice: 私の理解
  rationale: σύνεσιςは知的な把握や洞察を指す。「私の理解」は意味を過度に強めず、自然な日本語で所有関係も保つ。
- source_word: ἐν τῷ μυστηρίῳ
  choice: 奥義についての
  rationale: ἐνはここで理解が関わる領域を示す。「についての」により関係を自然に表し、μυστήριονは、神が隠していた後に示された事柄という聖書的含意を保つため「奥義」とした。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςはここで称号として機能するため「メシア」と訳した。属格の関係を限定的に解釈せず、「メシアの」として原文の幅を保った。
theological_decisions:
- issue: τοῦ ΧριστοῦにおけるΧριστόςの訳
  choice: メシア
  alternative: キリスト
  rationale: 油注がれた者という称号の意味が伝わるよう「メシア」とした。伝統的な音写「キリスト」は脚注に示す。
- issue: 「メシアの奥義」という属格の関係
  choice: 「メシアの」として曖昧さを保持
  alternative: 「メシアに関する」または「メシアに属する」
  rationale: τοῦ Χριστοῦは、メシアを内容とする奥義とも、メシアに属する奥義とも取り得るため、本文では一方に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「奥義」によって神学的な重みと原語μυστήριονの含意を保った。語順は日本語として自然になるよう整え、原文の属格が持つ解釈上の幅は残した。
