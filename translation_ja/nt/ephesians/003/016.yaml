source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: ja
  text: その栄光の豊かさに応じて、その御霊を通して、あなたがたを内なる人[a]において力をもって強めてくださいますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「内なる人」。人の内面的な自己を指す代表的単数表現であり、「内面の人」とも訳せる。
    reason: 原文特有の表現が男性だけを意味するものではなく、人の内的側面を指すことを明確にするため。
lexical_decisions:
- source_word: ἵνα δῷ ὑμῖν
  choice: あなたがたを……力強くしてくださいますように
  rationale: 前節から続く祈りの願いとしてἵνα節を「ように」で表した。δῷの授与の意味は、使役的な「してくださる」に自然に織り込み、受益者ὑμῖνを「あなたがた」で明示した。
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: その栄光の豊かさに従い
  rationale: κατάの基準・尺度の意味を「に従い」で保ち、πλοῦτοςとδόξαをそれぞれ「豊かさ」「栄光」とした。
- source_word: δυνάμει κραταιωθῆναι
  choice: 力強くして
  rationale: δυνάμειによる力とκραταιωθῆναιの強化を、日本語で重くなりすぎない「力強くして」にまとめた。神によって強められるという受動的な意味関係は、敬語を伴う使役表現によって保持している。
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: その御霊を通して
  rationale: διά＋属格の手段・媒介を「を通して」で表した。πνεῦμαは文脈上、神の霊を指すため、現代日本語の聖書文体として「御霊」とした。
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: 内なる人において
  rationale: 強められる対象・領域が人の内的自己であることを示す。ἄνθρωποςの代表的単数表現を保つため「内なる人」とし、εἰςの方向性がここでは内的領域への働きを示すことを「において」で自然に表現した。
theological_decisions:
- issue: πνεῦμαの指示対象
  choice: 神の御霊
  alternative: 非人格的な神的力としての霊
  rationale: 「その御霊」という所有表現と、信者を強める神的な働きというパウロ書簡の文脈から、神の霊を指すと判断した。ただし、本文は原文どおり簡潔な「その御霊」にとどめた。
- issue: ἔσω ἄνθρωπονの理解
  choice: 人の内的自己を指す「内なる人」
  alternative: 「内面」または「内なる自己」
  rationale: 身体と切り離された特定の実体と断定せず、人の内側の側面を指すパウロの表現として保持した。男性だけを指す語ではない。
translation_notes:
  register: 明瞭で現代的な祈願文としつつ、「栄光」「御霊」「内なる人」というパウロ書簡の重要語を保持した。前節から続く従属節であるため、神を指す主語を本文に補わず、文末の「くださいますように」で祈りの流れを示した。
