id: EPH.3.3
reference: Ephesians 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: ja
  text: すなわち、啓示によって[a]、奥義が私に知らされたのです[b]。それは、先に少しばかり書いたとおりです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「啓示に従って」または「啓示を通して」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私に啓示された」。ギリシア語は「私に知らされた」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「簡潔に」または「わずかな言葉で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: 啓示によって
  rationale: κατά＋対格がここでは、奥義が知らされた手段・様態を示す。「啓示によって」は自然な現代日本語であり、神からの開示という文脈を保つ。
- source_word: ἐγνωρίσθη μοι
  choice: 私に知らされた
  rationale: γνωρίζωのアオリスト受動態を反映し、明示されていない行為者を補わない。「私に啓示された」も可能だが、直前の「啓示」との重複を避ける。
- source_word: τὸ μυστήριον
  choice: 奥義
  rationale: パウロ書簡で、かつて隠され今や示された神の目的を表す語として、現代の聖書文体で定着した「奥義」を用いる。内容はこの節で先取りして説明しない。
- source_word: καθὼς
  choice: ～とおり
  rationale: 前述の記述との比較・対応を、自然な日本語で示す。
- source_word: προέγραψα
  choice: 先に……書いた
  rationale: この手紙の先行箇所に書いたことを指す時間的意味を簡潔に表す。
- source_word: ἐν ὀλίγῳ
  choice: 少しばかり
  rationale: 短く、わずかな言葉で書いたという句の幅を保つ。「簡潔に」よりも分量の少なさを直接表せる。
theological_decisions:
- issue: パウロにおける μυστήριον の意味
  choice: 「奥義」とし、この節では内容を説明しない
  alternative: 「秘密」「神の隠された計画」
  rationale: 原文は概念を名指すのみで、その内容の詳説は後続文脈に委ねている。「奥義」は、隠されていた神の目的が開示されたという神学的含意を保ちつつ、この節を過度に敷衍しない。
- issue: 受動態で暗示される行為者
  choice: 「知らされた」と受動表現を保つ
  alternative: 「神が私に知らせてくださいました」
  rationale: 文脈上、行為者は神と理解されるが、この節のギリシア語は明示していないため、訳文でも補わない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、書簡にふさわしい品位を保った。「すなわち」は、前節から続く説明関係を示す原文冒頭の従属的な構文を、日本語の単独節として読みやすくするために用いた。すべての脚注記号を対応箇所に配置した。
