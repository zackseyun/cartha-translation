  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: ja
  text: 天と地にあるすべての家族は、この方から名づけられています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天と地にある家族全体は、この方から名づけられています」。または、より解釈的に「天と地にあるすべての父性は、この方からその名を得ています」。
    reason: πᾶσα πατριάは「すべての家族」のほか、「家族全体」と理解される可能性がある。直前のπατήρ（父）との語の響きを重視して、「すべての父性」と解する見方もあるが、πατριάの通常の意味は家族集団であるため、本文では採用しない。
lexical_decisions:
- source_word: ἐξ οὗ
  choice: この方から
  rationale: 属格を伴うἐξの起点・源を表す意味を自然な日本語で示す。先行する「父」を受ける関係代名詞だが、この節だけでも明瞭になるよう「この方」とした。
- source_word: πᾶσα
  choice: すべての
  rationale: 単数名詞に伴う分配的な意味を採り、「一つ一つの／あらゆる家族」に相当する範囲を表す。「一つの大きな家族全体」とする可能性は脚注に残す。
- source_word: πατριά
  choice: 家族
  rationale: 通常は家族集団、氏族、血族を指すため、現代日本語で最も明瞭な「家族」とした。直前のπατήρ（父）との語の響きはあるが、抽象的な「父性」と断定しない。
- source_word: ἐν οὐρανοῖς καὶ ἐπὶ γῆς
  choice: 天と地にある
  rationale: ギリシア語の場所を表す対句を、簡潔で自然な聖書文体として訳した。οὐρανοῖςは複数形だが、日本語では「天」が自然である。
- source_word: ὀνομάζεται
  choice: 名を与えられています
  rationale: 現在受動形の「名づけられる」を表しつつ、ἐξ οὗとの源・由来の関係が日本語で伝わる形にした。「呼ばれています」よりもὄνομαとの語彙的なつながりを保つ。
theological_decisions:
- issue: πᾶσα πατριάが、直前の「父」とどのような関係にあるか
  choice: すべての家族
  alternative: 天と地にある家族全体／天と地のあらゆる父性
  rationale: πᾶσαと単数名詞の組み合わせを分配的に読み、πατριάの通常の社会的意味を保った。神を源とする一つの普遍的家族、またはあらゆる父性の由来という解釈も可能なので、本文で一つに決めず脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、礼拝朗読にも適する落ち着いた文体とした。πατήρとπατριάの語遊びは日本語本文では完全に再現できないため、解釈的な「父性」を本文に持ち込まず脚注に残した。
