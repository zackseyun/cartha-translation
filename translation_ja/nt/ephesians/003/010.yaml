id: EPH.3.10
reference: Ephesians 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: ja
  text: それは今、教会を通して、神の多種多様な知恵[a]が、天上の諸支配者と諸権威[b][c]に知らされるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「多種多様な」は、多くの面を持つこと、また豊かに変化に富むことを表します。別訳「多面的な知恵」。
    reason: lexical_alternative
  - marker: b
    text: 「諸支配者と諸権威」は、天上に属する宇宙的または霊的な諸権力を指すと考えられます。ただし、本文はその正体を具体的に述べていません。
    reason: cultural_note
  - marker: c
    text: 別訳「天上の場所」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 〜ためです
  rationale: 目的を表す接続詞の働きを、前文とのつながりを保つ自然な日本語で示す。
- source_word: γνωρισθῇ
  choice: 知らされる
  rationale: アオリスト受動接続法の受動態と、ἵναに従う目的の意味を保持する。
- source_word: νῦν
  choice: 今
  rationale: 時間を示す副詞を直接的に訳す。
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: 支配者たちと権威ある者たち
  rationale: 天上の支配的・権威的存在を示す語の対を、現代日本語で理解しやすく、かつ存在の正体を過度に限定せずに表す。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上の領域にいる
  rationale: エフェソ書に特徴的な天的領域を示す表現。日本語では対象となる存在に自然に結び付けて訳す。
- source_word: διὰ τῆς ἐκκλησίας
  choice: 教会を通して
  rationale: 属格を伴うδιάの手段・媒介の意味を明確に表す。
- source_word: ἡ πολυποίκιλος σοφία τοῦ θεοῦ
  choice: 神の多種多様な知恵
  rationale: πολυποίκιλοςが表す多面性と豊かな多様性を、古風さを避けた明瞭な日本語で表す。
theological_decisions:
- issue: 「支配者たちと権威ある者たち」の正体
  choice: 天上の領域に属する宇宙的・霊的な権力を指す方向で訳すが、その種類は限定しない。
  alternative: 人間の政治的支配者、または地上と天上の権力を広く含む表現。
  rationale: ἐν τοῖς ἐπουρανίοιςが超人的な権力を強く示唆する一方、本文は「天使」「悪霊」などと明示していないため、その曖昧さを保つ。
- issue: 教会の役割
  choice: 神の知恵が知らされる媒介として「教会を通して」と訳す。
  alternative: 教会自身が能動的に知らせる、と明示する。
  rationale: 受動形γνωρισθῇとδιά句は媒介を示すが、知らせる主体を明記していないため、本文以上に教会の能動性を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。原文の語順を不自然に模倣せず、目的節、媒介、知らされる内容、対象の関係が一読で分かるように整えた。
