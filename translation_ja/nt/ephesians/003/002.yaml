  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: ja
  text: あなたがたはきっと、神があなたがたのために私に与えてくださった恵みを管理する務めについて、聞いたことがあるでしょう[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「もし本当に聞いているなら」。ギリシア語は条件の形を保っていますが、ここではパウロが読者は聞いていると見込んでいる可能性が高い表現です。
    reason: alternative_reading
  - marker: b
    text: 「管理する務め」に当たる語は、「運営」「委託された責任」「管理を任された務め」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: 確かに……はずです
  rationale: 条件の形を日本語で直訳して不自然な疑念を生じさせるより、文脈上パウロが真実と見込んでいる修辞的な仮定を自然に表した。原文の条件的な形は脚注に残した。
- source_word: ἠκούσατε
  choice: 聞いている
  rationale: アオリストの出来事全体を踏まえつつ、過去に聞いたことが現在の認識として続いていることを自然な日本語で示す。
- source_word: οἰκονομίαν
  choice: 委ねられた務め
  rationale: 管理、管理職、委託された責任を表す語であり、ここでは異邦人のためにパウロへ託された働きを指す。「務め」に「委ねられた」を添えて、受託管理の含意を保った。
- source_word: χάριτος τοῦ θεοῦ
  choice: 神の恵み
  rationale: パウロ書簡における語彙上・神学上の連続性を保ち、神から来る恵みを簡潔に表す。
- source_word: τῆς δοθείσης μοι
  choice: 私に与えられた
  rationale: 女性単数属格の分詞は文法上「恵み」を直接修飾し、その恵みがパウロに授けられたことを明示する。
- source_word: εἰς ὑμᾶς
  choice: あなたがたのために
  rationale: 読者へ向けられた方向性と、読者の益のためという文脈上の意味を自然に示す。
theological_decisions:
- issue: 「神の恵みのオイコノミア」の指示内容
  choice: 神の恵みに関してパウロに委ねられた務め
  alternative: 神の救済計画またはその展開そのもの
  rationale: 直後の文脈は異邦人のためにパウロへ与えられた役割を強調する。ただし広い救済計画との関連を排除しないよう、「務め」と訳し、脚注に語義の幅を示した。
- issue: εἴ γε の力
  choice: 真実であると見込んだ修辞的な仮定
  alternative: 「もし本当に聞いているなら」という実質的条件
  rationale: 原文は条件表現を用いるが、文脈上は読者が知っていることを前提としている可能性が高い。本文では自然な推定表現を用い、条件形は脚注に明記した。
- issue: τῆς δοθείσης の修飾先
  choice: 文法上一致する「恵み」を修飾する
  alternative: 意味上、「恵みを委ねられた務め」全体がパウロに与えられたと理解する
  rationale: 分詞は χάριτος と性・数・格が一致するため、統語上は「私に与えられた恵み」と取るのが直接的である。一方、文脈上はその恵みに伴う務めが委ねられたことも含意される。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡としての品位を保つ文体。「委ねられた務め」により、単なる仕事ではなく神から託された責任を表した。節末は日本語として完結させたが、前節から続く挿入的な構文であることを損なわない簡潔さを保った。
