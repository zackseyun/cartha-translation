  to: あなたがたはきっと、神があなたがたのために私に与えてくださった恵みを管理する務めについて、聞いたことがあるでしょう[a][b]。
  rationale: 修飾関係を明確にするため、「神の恵み」を「神があなたがたのために私に与えてくださった恵み」と展開し、その恵みに関する οἰκονομία を「恵みを管理する務め」とした。「神が」は「神の恵み」および受動の「与えられた」に含意される行為者を自然な日本語で明示したものである。εἴ γε の条件形式は脚注に保持し、本文では期待を込めた「きっと…でしょう」として、不要な疑念を避けた。
