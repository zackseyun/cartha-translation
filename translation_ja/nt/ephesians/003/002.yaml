  naturalness: 現行文は修飾語が重なり、「あなたがたのために私に与えられた」が何を修飾するかを一読で取りにくくしています。「聞いているはずです」も、この文脈では「聞いたことがあるでしょう」のほうが自然です。
  terminology: 「神の恵み」はパウロ書簡の重要語として適切です。οἰκονομία はここでは、与えられた恵みに関するパウロの受託的責任を表すため、「恵みを管理する務め」とします。これは「管理」を支配的な意味に限定せず、脚注で「運営」「委託された責任」等の可能性を示します。
