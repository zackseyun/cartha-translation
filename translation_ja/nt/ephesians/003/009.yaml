source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: ja
  text: また、万物を造られた神のうちに、諸時代の初めから隠されていた[b]奥義についての取り計らい[a]がどのようなものかを、すべての人に明らかにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「奥義の運営がどのようなものか」。οἰκονομίαは「管理」「運営」「計画」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「諸時代の初めから」は、「諸時代以来」または、より解釈を加えて「永遠の昔から」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: 明らかにする
  rationale: 光を当てる比喩を自然な現代日本語で表し、後続する内容を人々に見えるようにするという意味を保つ。
- source_word: πάντας
  choice: すべての人に
  rationale: 文脈上、人を指す普遍的な範囲を明示し、日本語として自然な目的語構文にした。
- source_word: τίς ἡ οἰκονομία
  choice: どのように実現されるのか
  rationale: οἰκονομίαが持つ運営・取り計らい・計画の実施という幅を、神の奥義の展開を述べる自然な日本語で表した。単なる内容ではなく、その実現のあり方を示す。
- source_word: μυστήριον
  choice: 奥義
  rationale: かつて隠され、今や啓示された神の目的を指すパウロ的用法を保つ。「秘密」よりも本文の神学的含意に適する。
- source_word: ἀποκεκρυμμένου
  choice: 隠されてきた
  rationale: 完了受動分詞が表す、過去から続く隠された状態を日本語で示す。
- source_word: ἀπὸ τῶν αἰώνων
  choice: 世々にわたって
  rationale: 長い諸時代を通じた秘匿を自然に表しつつ、ギリシア語が明示的に「永遠」と言っている以上には踏み込まない。
- source_word: ἐν τῷ θεῷ
  choice: 神のうちに
  rationale: ἐνの基本的な空間・関係表現を保ち、奥義が単に神のそばにではなく神のうちに隠されていたという表現を維持する。
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: 万物を造られた神
  rationale: 分詞による神の描写を自然な連体修飾で表し、τὰ πάνταを「万物」と簡潔に訳した。
theological_decisions:
- issue: οἰκονομίαと奥義との関係
  choice: 奥義がどのように実現されるのか
  alternative: 奥義の運営／奥義についてのご計画
  rationale: οἰκονομίαの管理・取り計らい・計画という語義範囲を一つの後代的な専門概念に固定せず、奥義が歴史の中で実施されるあり方として表現した。
- issue: ἀπὸ τῶν αἰώνωνの時間的意味
  choice: 世々にわたって
  alternative: 諸時代以来／永遠の昔から
  rationale: 原文は「永遠」を直接述べず「諸時代」を用いるため、長期間という意味を保ちながら永遠性を断定しない。
- issue: 奥義が隠されていた場所・関係
  choice: 神のうちに
  alternative: 神のもとに
  rationale: ἐνの表現を保持し、神の内に秘められていたというパウロの言い回しを弱めない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神については敬意ある表現とした。「奥義」はパウロ書簡に定着した語として保持し、「運営」という硬い直訳は本文では動詞的にほどいた。すべての注記記号を本文中に配置した。
