id: EPH.3.19
reference: Ephesians 3:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: ja
  text: また、知識を超えるメシアの愛を知り、神の満ち満ちた豊かさのすべてに至るまで、あなたがたが満たされますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の満ち満ちた豊かさのすべてで、あなたがたが満たされますように」。ギリシア語は「神の満ち満ちた豊かさのすべてに至るまで満たされる」と読める圧縮された表現であり、完全な満ち満ちた豊かさへ向かうことを強調している可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί τε
  choice: そして、…知り
  rationale: 前節から続く祈りの願いを自然に接続し、不定詞の内容を日本語の祈願文に合わせて表した。γινώσκωは経験的な認識も含み得るため、広がりを保つ「知る」とした。
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην
  choice: 知識を超える…愛
  rationale: γνῶναιとγνώσεωςの語義的なつながりと、「知識を超える愛を知る」という逆説を保持した。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςの称号としての意味を明示しつつ、属格が持つ関係の幅を狭めない表現とした。
- source_word: ἵνα πληρωθῆτε
  choice: こうして、…満たされますように
  rationale: ἵναの目的・結果の流れを「こうして」で示し、受動態と祈願の文脈を「満たされますように」で自然に表した。
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: 神の満ち満ちたものすべてに至るまで
  rationale: εἰςの方向・到達点の含意を「に至るまで」で保ち、πλήρωμαの豊かな充満の意味を現代日本語で伝えた。単純に「神の満ち満ちたものすべてで」として前置詞を平板化することを避けた。
theological_decisions:
- issue: τοῦ Χριστοῦの属格の意味
  choice: 「メシアの愛」とし、属格の関係を形式上保持する
  alternative: 「メシアが注ぐ愛」または「メシアへの愛」
  rationale: 文脈上はメシアが人々に示す愛が有力だが、本文だけで属格の意味を説明的に限定しない。
- issue: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦの解釈
  choice: 「神の満ち満ちたものすべてに至るまで」
  alternative: 「神の満ち満ちたものすべてで満たされる」
  rationale: 圧縮された神学的表現とεἰςの到達点・目標のニュアンスを保持し、人が神と同一になるとの含意を不用意に加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りとしての荘重さを保った。「満ち満ちたもの」は日常語より高い文体だが、πλήρωμαの反復的・包括的な力とパウロの高揚した表現を伝えるため採用した。
