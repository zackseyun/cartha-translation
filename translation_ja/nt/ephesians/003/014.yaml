  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: ja
  text: このため、私は父に向かってひざをかがめます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: このため
  rationale: 直前の文脈を受けて、続く祈りの理由を示す表現。簡潔で自然な現代日本語とした。
- source_word: κάμπτω τὰ γόνατά μου
  choice: 私は……ひざをかがめます
  rationale: 動詞「曲げる」と目的語「私のひざ」から成る身体的イメージを保ちつつ、日本語で祈りの姿勢として自然に伝わる表現とした。「ひざまずきます」より原文の構成を残している。
- source_word: πρὸς τὸν πατέρα
  choice: 父の前に
  rationale: πρόςは祈りが父へ向けられることを示す。日本語では「父にひざをかがめる」より「父の前にひざをかがめる」が自然で、祈りの相手への方向性も表せる。
- source_word: πατέρα
  choice: 父
  rationale: 文脈上、祈りの相手である神を父として指す。日本語では大文字による称号化がないため、端的に「父」とした。
theological_decisions:
- issue: πατέραを神への呼称として訳すか
  choice: 父
  alternative: 父なる神
  rationale: 文脈から指示対象は神であるが、原文には「神」に当たる語がない。「父なる神」と補わず「父」とすることで、神学的な呼称を保ちながら原文以上の明示を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祈りの姿勢を表す原文の身体的描写を残し、過度に古風な「御父」や説明的な補足は避けた。
