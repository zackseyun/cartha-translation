source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: ja
  text: このようなわけで、あなたがた異邦人のために、メシアであるイエス[a]の囚人である私、パウロは――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。
    reason: Χριστόςの伝統的な音写的表現を示すため。
lexical_decisions:
- source_word: Τούτου χάριν
  choice: こういうわけで
  rationale: 前段の論述を受ける推論的な連結表現として、現代日本語で自然に訳した。3:14で同じ表現に戻ることも意識している。
- source_word: ἐγὼ Παῦλος
  choice: 私パウロは
  rationale: 明示された一人称代名詞の強調と、パウロの自己提示を簡潔に保った。日本語として自然になるよう後続の修飾句の後に置いた。
- source_word: ὁ δέσμιος
  choice: 囚人となっている
  rationale: δέσμιοςの拘束されている者という意味を示す。「となっている」により現在の身分・境遇を自然に表すが、鎖という本文にない具体像は加えていない。
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: メシアであるイエスの
  rationale: Χριστόςを称号として訳しつつ、「メシア・イエス」より明瞭で自然な日本語にした。属格の関係は「の」によって保ち、イエスに属する囚人という含みと、イエスへの奉仕ゆえの囚人という含みを狭く限定しない。
- source_word: ὑπὲρ ὑμῶν τῶν ἐθνῶν
  choice: あなたがた異邦人のために
  rationale: ὑπέρの受益・代理的な意味を「ために」で表し、τῶν ἐθνῶνをὑμῶνと同格の「あなたがた異邦人」とした。ここでは地政学的な『諸国民』ではなく非ユダヤ人を指す。
theological_decisions:
- issue: Χριστοῦを称号として訳すか、固有名のように音写するか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: 文脈上Χριστόςはイエスに付された称号として機能するため、本文では意味を示す「メシア」を用いた。教会用語として定着した別表現は脚注に残した。
- issue: 「メシアであるイエスの囚人」という属格の関係
  choice: 関係を限定せず「の囚人」とする
  alternative: メシアであるイエスのゆえに囚人となった者
  rationale: ギリシア語の属格は、パウロがメシアに属する囚人であることと、メシアへの奉仕のゆえに拘束されていることの双方を含み得る。原因だけに限定しない訳を選んだ。
- issue: 1節末の統語的中断
  choice: 文を完結させず長いダッシュで示す
  alternative: 後続節を補って完全文にする
  rationale: 原文はここで文が中断され、3:14で主文が再開される。補語や述語を加えず、その修辞的な中断を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、書簡としての品位を保った。原文の中断構文が読者に分かるよう長いダッシュを用いた。脚注記号[a]は該当語句の直後に置いた。
