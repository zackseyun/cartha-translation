source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: ja
  text: また、十字架を通して両者を一つのからだにおいて神と和解させるため、十字架によって[a]敵意を殺して。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここは「十字架によって」と訳した。原文は「その中で」とも訳せ、代名詞をキリストご自身に結び付けて理解する余地もある。
    reason: ἐν αὐτῷ の前置詞の意味と代名詞の指示対象にある真正な曖昧さを示すため。
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: 和解させ
  rationale: 強意を伴う「和解させる」を、現代日本語で自然かつ神学的方向性を保つ使役表現とした。目的・意図を示す接続法は、文脈に合わせて「ためでした」で表した。
- source_word: τοὺς ἀμφοτέρους
  choice: 両者を
  rationale: 直前の文脈にあるユダヤ人と異邦人の双方を指すため、対象を特定しすぎず原文どおり「両者」とした。
- source_word: ἐν ἑνὶ σώματι
  choice: 一つのからだの中で
  rationale: ἐν の空間的・共同体的含意と「一つのからだ」という比喩を保った。「からだ」は読みやすさを考えて平仮名とした。
- source_word: διὰ τοῦ σταυροῦ
  choice: 十字架を通して
  rationale: 手段を表す διά を自然な日本語で示し、和解が十字架によって実現するという原文の関係を保った。
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: 敵意を殺す
  rationale: ἀποκτείνω の意図的で強い死の比喩を「取り除く」などに弱めず、原文の鮮烈さを保持した。
- source_word: ἐν αὐτῷ
  choice: それによって
  rationale: 直近の「十字架」を受け、手段として理解する英語POBの監査済み判断に沿った。ただし指示対象と前置詞の解釈には幅があるため脚注で示した。
theological_decisions:
- issue: 「一つのからだ」の解釈
  choice: 比喩を説明せず「一つのからだの中で」と保持
  alternative: 「一つの共同体として」または「キリストの一つのからだにおいて」
  rationale: 教会共同体を指す可能性が高いが、本文自体は単に「一つのからだ」と述べるため、解釈を本文へ織り込まなかった。
- issue: ἐν αὐτῷ の指示対象と機能
  choice: 「それによって」とし、十字架を指す手段表現として訳す
  alternative: 「その中で」、または「ご自身において」
  rationale: 最も近い先行詞である「十字架」を受ける理解が自然で、英語POBの最新裁定とも一致する。一方、ギリシア語は別の係り受けも許すため脚注で曖昧さを保存した。
- issue: 和解の方向
  choice: 「両者を…神と和解させ」
  alternative: 「神を両者と和解させ」
  rationale: 対格の「両者」が和解させられる対象であり、与格 τῷ θεῷ が和解の相手を示す構文を反映した。
translation_notes:
  register: 明瞭で現代的ながら尊厳ある文体。前後の文に続く目的節として「ためでした」を用いた。「敵意を殺す」はやや強い比喩だが、原文の死の語彙を意図的に保持している。
