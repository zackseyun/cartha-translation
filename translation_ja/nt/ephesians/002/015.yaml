source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: ja
  text: キリストは、規定という形で示された[a]戒めの律法を無効にされました。それは、両者をご自分にあって一人の新しい人へと創造し、平和を実現するためでした。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「規定という形で示された」は、「規定の中にある」「規定から成る」とも訳せる。伝統的には「儀文」と訳されることがある。
    reason: lexical_alternative
  - marker: b
    text: 「一人の新しい人」は、ユダヤ人と異邦人という二つの集団が一つにされることを表す、単数形の集合的な比喩。「一つの新しい人類」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν
  choice: 規定として示された戒めの律法
  rationale: ἐν δόγμασιν と『戒めの律法』との関係を日本語で明瞭にしつつ、δόγμαの公的な規定・布告という意味を保った。
- source_word: καταργήσας
  choice: 無効にされた
  rationale: 廃棄・無力化を表す強い語だが、対象となる律法について本文以上の神学的範囲を断定しない表現とした。
- source_word: τοὺς δύο
  choice: 二つのものを
  rationale: 直前の文脈にあるユダヤ人と異邦人という二者を受ける。日本語では『二人』だと個人二名に聞こえやすいため、集合的な二者であることを示した。
- source_word: κτίσῃ
  choice: 造り上げる
  rationale: κτίζωの創造の含意を保ち、日本語として目的語と補語の関係を自然にした。
- source_word: ἐν αὑτῷ
  choice: ご自分にあって
  rationale: 再帰的なαὑτῷを明示し、キリストご自身のうちにおける一致という位置・領域の意味を保持した。
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: 一人の新しい人へと
  rationale: 単数のἄνθρωποςによる集合的比喩を本文に残し、『新しい人類』と解釈的に限定しなかった。
- source_word: ποιῶν εἰρήνην
  choice: 平和をもたらしつつ
  rationale: 現在分詞の付帯的・結果的な関係を保ち、自然な現代日本語とした。
theological_decisions:
- issue: ἄνθρωπονの集合的な救済論的比喩
  choice: 一人の新しい人
  alternative: 一つの新しい人類
  rationale: ユダヤ人と異邦人から成る集合体を指すが、原文の単数の『人』という比喩と、その解釈上の広がりを維持した。
- issue: καταργήσαςが律法について持つ効力
  choice: 無効にされた
  alternative: 廃止された
  rationale: 原文の強さを保ちながら、神の律法全般が消滅したという本文外の主張に聞こえる可能性を抑えた。
- issue: ἐν αὑτῷの係り先
  choice: 『造り上げる』に結び付けて『ご自分にあって』
  alternative: 『一人の新しい人』に結び付けて『ご自分にある一人の新しい人』
  rationale: ギリシア語の語順と再帰代名詞を尊重した。ただし、創造の領域と新しい人の存在領域の双方に意味上関わり得るため、その曖昧さを注記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの『一人の新しい人』という荘重な集合的比喩を保持した。節が前後と文法的につながるため、冒頭は連用的にせず、この節だけでも読める文として整えた。
