id: EPH.2.4
reference: Ephesians 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: ja
  text: しかし、あわれみに富む神は、私たちを愛してくださったその大きな愛のゆえに、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の、人間が背きの中で死んでいた状態との強い対照を、自然な現代日本語で示す。
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: あわれみに富む
  rationale: 「あわれみにおいて富んでいる」というギリシア語の比喩を保ちつつ、日本語として簡潔で自然な連体表現にした。
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: その大きな愛のゆえに
  rationale: διά＋対格の理由・原因を「ゆえに」で表し、πολλήνを抽象名詞「愛」に自然に結びつく「大きな」とした。「その」は神を指す。
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: 私たちを愛してくださった
  rationale: ἀγάπηνとἠγάπησενの同根語反復を「愛…愛して」で保持する。神の行為を述べる日本語として「くださった」を用いたが、原文にない追加の行為内容は導入していない。
theological_decisions:
- issue: 「愛」と「愛した」の同根語反復
  choice: 「私たちを愛してくださったその大きな愛」として反復を保つ
  alternative: 「私たちに対する大きな愛」
  rationale: 滑らかさのために反復を省かず、原文の強調を伝えるため。
- issue: あわれみと愛の関係
  choice: 「あわれみに富む」と「大きな愛のゆえに」を別個の表現として保つ
  alternative: 「あわれみ深い愛のゆえに」のように統合する
  rationale: 原文はἔλεοςとἀγάπηを関連させながらも同一化していないため、両概念を区別して残す。
- issue: 文の未完結性
  choice: 節末を読点で終える
  alternative: 補語や主動詞を補って完結させる
  rationale: 2:4はギリシア語で後続節へ続く構文であり、この節だけに原文にない主動詞を補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あわれみ」は聖書語として通用しつつ一般読者にも理解可能で、「富む」という原文の比喩も保持した。節単位では構文が次節へ続くため、読点で終えた。
