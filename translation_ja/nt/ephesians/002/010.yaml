id: EPH.2.10
reference: Ephesians 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: ja
  text: というのも、私たちは神の作品[a]であり、良い行いのために、メシアであるイエスにあって造られたのです。その良い行いは、私たちがその中を歩む[b]ようにと、神があらかじめ備えたものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「作品」は、神が造られたもの、神の手になるものという意味。別訳「神の手によるもの」。
    reason: lexical_alternative
  - marker: b
    text: ここで「歩む」とは、日々そのように生き、行動することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ ... ποίημα
  choice: 神の作品
  rationale: ποίημαは、神によって造られたもの、神の手になるものを指す。「作品」は具体的な被造物という意味を保ちつつ、現代日本語で簡潔に表せる。文脈上のαὐτοῦは神を指すため、「神の」と明示した。
- source_word: κτισθέντες
  choice: 造られた
  rationale: κτίζωのアオリスト受動分詞を受動形で表し、造り主である神の働きを保った。「作品であり」に続けて、キリストにある創造という節の構造を示す。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにあって
  rationale: Χριστόςの称号としての意味を「メシア」で示し、日本語として不自然な「メシア・イエス」を避けた。「にあって」はἐνが示す、メシアとの結びつきの領域・関係を過度に限定せずに保つ。
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: 良い行いのために
  rationale: ἐπί＋与格がここで示す目的・目標を自然に表し、ἔργαの倫理的で具体的な側面を「行い」で伝える。
- source_word: οἷς προητοίμασεν ὁ θεὸς
  choice: その良い行いは……神があらかじめ備えてくださった
  rationale: 関係代名詞οἷςの先行詞が「良い行い」であることを日本語で明確にした。προ-の時間的意味は「あらかじめ」で保持し、「備えてくださった」は神の恵み深い先行的な働きを自然な敬意をもって表す。
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: 私たちがその中を歩むように
  rationale: ἵναの目的を「ように」で表す。περιπατέωのパウロ的な歩行比喩を残し、ἐν αὐτοῖςが良い行いを生活の領域・道筋として示すことを「その中を」で表した。
- source_word: γάρ
  choice: というのも
  rationale: 直前の救いについての説明を受ける理由・説明の接続を、現代日本語で自然に示す。
theological_decisions:
- issue: Χριστῷを称号として訳すか、慣用的な固有名詞形で訳すか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςの「油注がれた者／メシア」という称号性を読者に伝えつつ、称号と人名の関係が明瞭な日本語にした。
- issue: 神があらかじめ備えたものと人間の行いとの関係
  choice: その良い行いは、私たちがその中を歩むようにと、神があらかじめ備えてくださった
  alternative: 神は、私たちが行うべき良い行いをあらかじめ定めた
  rationale: 本文が述べる神の先行的な備えと、信者が実際に歩むという目的の双方を保った。「定めた」や「行うべき」として、予定や義務について本文以上の体系的含意を加えることは避けた。
- issue: περιπατέωの比喩を保持するか、意味を説明的に訳すか
  choice: その中を歩む
  alternative: その良い行いを実践して生きる
  rationale: 生き方・行動を意味することは注で明らかにしつつ、本文ではパウロの「歩む」という比喩と、その良い行いが生活の領域となる表現を保った。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「にあって」「歩む」によって原文の神学的関係とパウロ的比喩を保持した。「メシアであるイエス」は称号の意味を伝えながら、日本語として自然に理解できる形である。
