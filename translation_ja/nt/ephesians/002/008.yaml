id: EPH.2.8
reference: Ephesians 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: ja
  text: あなたがたは、恵みによって、信仰を通して救われたのです。そして、これはあなたがた自身から出たものではなく、神からの贈り物です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これ」は、「信仰」だけでなく、直前の「恵みによって、信仰を通して救われた」という事柄全体を指すと考えられます。ギリシア語の指示代名詞は中性で、「恵み」と「信仰」はいずれも女性名詞です。
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: 恵み
  rationale: パウロ書簡における、神の無償の好意と慈しみを表す定着した訳語であり、過度な言い換えを避けつつ神学的含意を保つ。
- source_word: ἐστε σεσῳσμένοι
  choice: 救われたのです
  rationale: 現在形のεἰμίと完了分詞による迂言的完了で、過去に成し遂げられ現在も効力を持つ救いを表す。日本語では文脈上「救われたのです」が自然であり、完了した行為と現在の状態を含意する。
- source_word: διὰ πίστεως
  choice: 信仰を通して
  rationale: διά＋属格が手段・媒介を示すことを「を通して」で表した。πίστιςはここでは標準的に「信仰」とし、「信頼」や「忠実さ」に限定しない。
- source_word: τοῦτο
  choice: これ
  rationale: 中性指示代名詞であり、女性名詞の「恵み」または「信仰」だけを直接指すより、直前の「恵みによって、信仰を通して救われた」という事柄全体を受ける可能性が高い。簡潔な指示語により原文の余地を保つ。
- source_word: οὐκ ἐξ ὑμῶν
  choice: あなたがた自身から出たものではなく
  rationale: ἐκの起源・源泉の意味を明確にし、この救いの現実が読者自身に由来しないことを自然な現代日本語で表す。
- source_word: θεοῦ τὸ δῶρον
  choice: 神からの贈り物です
  rationale: 属格を起源として自然に表し、直前の事柄が神に由来する贈り物であることを明示する。「賜物」より一般読者に明瞭な「贈り物」を採用した。
theological_decisions:
- issue: τοῦτο（「これ」）が何を指すか
  choice: 直前の「恵みによって、信仰を通して救われた」という救いの現実全体を主に指すものとして訳す。
  alternative: 「信仰」だけ、または「恵み」だけを指すと理解する。
  rationale: τοῦτοは中性であるのに対し、χάριςとπίστιςはいずれも女性名詞であるため、単独の名詞より先行節全体を概念的に受ける理解が自然である。ただし本文では「これ」として、原文に残る指示対象の簡潔さと神学的緊張を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準日本語。「あなたがた」で複数形を明示し、「贈り物」は一般読者への分かりやすさを優先した。原文には脚注標識に当たる語がないため、文末に[a]を置き、節全体に関する注であることを示した。
