  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: ja
  text: あなたがたは、自分たちの背きと罪の中で死んでいました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: 過ち
  rationale: 道を踏み外すこと、違反を表す語として、ἁμαρτίαιςとの並列を保ちつつ自然な現代日本語にした。
- source_word: ἁμαρτίαις
  choice: 罪
  rationale: 神に背く行為や状態を表す標準的かつ明瞭な訳語。
- source_word: νεκρούς
  choice: 死んでいました
  rationale: 文脈上の霊的・比喩的な死を説明で限定せず、原文の強い表現をそのまま保った。
- source_word: τοῖς … καὶ ταῖς …
  choice: …のために
  rationale: 与格が示しうる原因・領域のうち、ここでは死の原因を表す自然な日本語と判断した。
theological_decisions:
- issue: 「死」の性質
  choice: 死んでいました
  alternative: 霊的に死んでいました
  rationale: 原文に「霊的に」に相当する語はないため補わず、意味の広がりと文脈上の神学的緊張を保持した。
- issue: 分詞構文と文の未完結性
  choice: 独立した文として「死んでいました」とした
  alternative: 「死んでいたあなたがたをも」として後続節へつなぐ
  rationale: ギリシア語では後続文へ続く構文だが、指定された節単位で明瞭に読める形とし、英語POBの監査済み判断とも整合させた。
translation_notes:
  register: 明瞭で現代的な標準日本語。「あなたがた」で複数形を明示し、荘重さを保ちながら過度に文語的な表現を避けた。
