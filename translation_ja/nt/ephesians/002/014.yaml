id: EPH.2.14
reference: Ephesians 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: ja
  text: なぜなら、キリストご自身が私たちの平和であり、両者[a]を一つにし、ご自分の肉において[c]、隔ての壁[b]、すなわち敵意を取り壊されたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「両者」とは、直前の文脈ではユダヤ人と異邦人を指す。
    reason: 指示対象を明確にするため。
  - marker: b
    text: 「隔ての壁」は、直訳すると「障壁の中壁（仕切り壁）」。
    reason: μεσότοιχον τοῦ φραγμοῦに含まれる壁と障壁の比喩的表現を示すため。
  - marker: c
    text: 「ご自分の肉において」は、キリストの身体的存在に関わる表現であり、その死を含意すると理解されることがある。原文では、この句および「敵意」を次節の「廃する」に結びつける解釈もある。
    reason: σάρξを本文で解釈的に置き換えず、係り受けに関する解釈上の可能性を保持するため。
lexical_decisions:
- source_word: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν
  choice: 実に、キリストご自身こそ私たちの平和です
  rationale: 強意の αὐτός を「ご自身こそ」で表し、γάρ は直前の叙述を根拠づける流れに合う自然な「実に」とした。文脈上の主語キリストを明示し、εἰρήνη の比喩的な述語表現を保持した。
- source_word: ὁ ποιήσας τὰ ἀμφότερα ἓν
  choice: キリストは、二つのものを一つにし
  rationale: τὰ ἀμφότερα を過度に説明せず「二つのもの」とし、直前の文脈でユダヤ人と異邦人を指すことは脚注で示した。分詞は日本語で自然な連続動作として訳した。
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: 隔てていた仕切りの壁
  rationale: μεσότοιχον と φραγμός の重なりを、日本語として不自然な「隔ての中壁」とせず、壁が分離の障壁であったことが伝わる表現にした。
- source_word: λύσας
  choice: 取り壊されました
  rationale: 壁を解体する文脈で λύω の意味を自然に表す。主語への敬意を示す日本語の慣用に従った。
- source_word: τὴν ἔχθραν
  choice: すなわち敵意
  rationale: 前の障壁を説明する同格と理解し、「すなわち」で関係を明示した。ただし統語上の別解は脚注に残した。
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: ご自分の肉において
  rationale: σάρξ を解釈的な「体」や「死」に置き換えず「肉」とし、キリストの身体性を保った。「において」は手段・領域を断定しすぎず原文の前置詞句を保持する。
theological_decisions:
- issue: 「二つのもの」の指示対象
  choice: 本文では「二つのもの」とし、脚注でユダヤ人と異邦人を示す
  alternative: 「ユダヤ人と異邦人の二つの民」と本文で明示する
  rationale: 直前の文脈から指示対象は明らかだが、原文自体の簡潔さを保ち、説明を本文へ過剰に織り込まないため。
- issue: 「敵意」の統語的位置
  choice: 「仕切りの壁」を説明する同格として訳す
  alternative: 「ご自分の肉において敵意を廃された」と次の節の述語に結びつける
  rationale: 提示された節の句読法では τὴν ἔχθραν が直前の障壁を説明すると読める一方、文は次節へ続き、別の係り受けも可能なので脚注で保持した。
- issue: ἐν τῇ σαρκὶ αὐτοῦ の意味
  choice: 「ご自分の肉において」と形式を保つ
  alternative: 「ご自分の体によって」または「肉体の死によって」
  rationale: キリストの受肉した身体と死を含意するが、原文に「死」は明記されていないため、本文では解釈を限定しない。
translation_notes:
  register: 現代の一般読者に通じる、明快で品位ある文体。強意は「ご自身こそ」、壁の比喩は「隔てていた仕切りの壁」で自然に示した。原文が次節へ続く構造であることを損なわない範囲で、一節として読みやすく整えた。
