source:
  edition: SBLGNT
  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: ja
  text: 私たちが罪過の中で死んでいた時でさえ、神は私たちをメシア[a]とともに生かしてくださいました。――あなたがたは恵みによって救われているのです。――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」はギリシア語 Χριστός の称号としての意味を表す。伝統的には「キリスト」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: 私たちが……死んでいた時でさえ
  rationale: 分詞構文の時間的・譲歩的な響きを、自然な現代日本語で表した。「でさえ」により、直前の文脈にある逆説的な強調も保っている。
- source_word: τοῖς παραπτώμασιν
  choice: 背きの中で
  rationale: 与格を領域・状態として捉え、神への違反を表す παραπτώματα を平易かつ重みのある「背き」とした。原因だけに限定する「背きのために」は避けた。
- source_word: συνεζωοποίησεν
  choice: ともに生かしてくださいました
  rationale: 動詞が含む「生かす」と「ともに」の両要素を保持した。日本語では後続の「メシアとともに」が結びつきを自然に示す。敬意を伴う表現は、神の行為を述べる日本語として自然で格調がある。
- source_word: τῷ Χριστῷ
  choice: メシアとともに
  rationale: 与格を共同・結合の意味に取り、Χριστός の称号としての意味を「メシア」で示した。
- source_word: χάριτί
  choice: 恵みによって
  rationale: 手段を表す与格として訳し、確立した神学用語でありながら現代日本語でも理解できる「恵み」を用いた。
- source_word: ἐστε σεσῳσμένοι
  choice: あなたがたは……救われているのです
  rationale: 迂言的完了形が示す、完了した行為の結果として現在も続く状態を「救われている」で表し、受動態を保持した。
theological_decisions:
- issue: τῷ Χριστῷ の訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味が保たれているため「メシア」とした。伝統的な「キリスト」も可能なので脚注に示した。
- issue: χάριτί ἐστε σεσῳσμένοι の挿入的性格
  choice: 前後をダッシュで囲む独立的な挿入句
  alternative: 前文に滑らかに統合する
  rationale: パウロの唐突で強調的な挿入を保ち、恵みによる救いへの力点を弱めないため。
- issue: 動詞 συνεζωοποίησεν の明示されない主語
  choice: 神
  alternative: 主語を明示しない
  rationale: ギリシア語では直前の文脈から神が主語として継続している。日本語で一節として明瞭に読めるよう主語を補ったが、新たな解釈は加えていない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の救済行為にふさわしい格調を保った。長い一文を句点とダッシュで整理し、原文の挿入的な強調を再現した。
