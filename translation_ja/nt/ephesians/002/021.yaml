  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: ja
  text: キリストにあって、建物全体[a]は組み合わされつつ、主にあって聖なる神殿へと成長していきます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての建物」。このギリシャ語表現は、「建物全体」という集合的な意味にも、「すべての建物」という分配的な意味にも取れます。本文は、文脈にある一つの神殿というイメージに従っています。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: このキリストにあって
  rationale: 関係代名詞の先行詞は直前の隅の親石であるキリスト・イエスが最も自然である。「このキリスト」と明示しつつ、パウロ特有の結合・領域を表す「にあって」を保った。
- source_word: πᾶσα οἰκοδομὴ
  choice: 建物全体
  rationale: 無冠詞単数の πᾶσα οἰκοδομή は「すべての建物」とも読めるが、文脈の一つの民・一つの神殿という比喩には集合的な「建物全体」が適合する。別解は脚注に残した。
- source_word: συναρμολογουμένη
  choice: 組み合わされ
  rationale: 現在受動分詞が示す、各部分が継続的に結合されて一体となる過程を、自然な建築表現で訳した。
- source_word: αὔξει
  choice: 成長していきます
  rationale: 現在形の継続的な発展を示し、建物に有機的な成長を重ねる原文の比喩を保持した。
- source_word: εἰς
  choice: へと
  rationale: 神殿になるという方向・到達点ないし結果を、簡潔に示した。
- source_word: ναὸν ἅγιον
  choice: 聖なる神殿
  rationale: ναός は神殿域全体よりも聖所を指すが、日本語では文脈上自然で一般読者にも明瞭な「神殿」を用い、ἅγιον を「聖なる」とした。
- source_word: ἐν κυρίῳ
  choice: 主にある
  rationale: 領域または主との結合を表し得る幅を狭めず、パウロ書簡にふさわしい定型的で簡潔な表現とした。
theological_decisions:
- issue: ᾧ の先行詞が人格としてのキリストか、建築物・隅石の比喩か
  choice: 人格としてのキリストを指す「このキリストにあって」
  alternative: 「その方において」または非人格的な「その中で」
  rationale: 直前の「キリスト・イエスご自身」と、この段落に反復されるキリストにあるという表現から、人格的な指示が最も自然である。ただし「にあって」として関係・領域の意味幅は保った。
- issue: πᾶσα οἰκοδομὴ が集合的か分配的か
  choice: 集合的な「建物全体」
  alternative: 分配的な「すべての建物」
  rationale: ユダヤ人と異邦人が一つにされ、一つの聖なる神殿として建てられる2章14–22節の統一的なイメージに従った。文法上可能な分配的解釈は脚注で明示した。
translation_notes:
  register: 明瞭で現代的かつ格調を保った敬体。「組み合わされ」「成長していきます」により、進行中の建築と成長の比喩を自然に表現した。
