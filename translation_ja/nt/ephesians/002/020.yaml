  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: ja
  text: 使徒たちと預言者たちの土台[a]の上に建てられており、メシアであるイエス[b]ご自身が、隅の要石です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「使徒たちと預言者たちの土台」は、彼らの証言に関わる土台、彼らが据えた土台、または彼ら自身から成る土台を意味し得ます。ギリシア語の属格は、その関係をこれ以上特定していません。
    reason: lexical_alternative
  - marker: b
    text: 別訳「キリスト・イエス」。ギリシア語の称号 Χριστός（クリストス）は、ここではその意味を表すため「メシア」と訳しました。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: 建てられており
  rationale: アオリスト受動分詞で、読者が神の建物に組み入れられたことを表す。受動の建築比喩と前後の文への接続を保つため、「建てられており」とした。
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: 土台の上に
  rationale: 与格を伴うἐπίは、建物を支える基礎の上という位置・支持関係を表す。「土台の上に」が現代日本語で明瞭である。
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: 使徒たちと預言者たちの
  rationale: 属格の意味を限定せず、「彼らが据えた」「彼ら自身から成る」などと解釈を固定しない形にした。
- source_word: ὄντος
  choice: です
  rationale: 属格絶対構文の関係を、日本語では主節に続く自然な叙述として表した。分詞を機械的に再現せず、建物の比喩における役割を明瞭にした。
- source_word: ἀκρογωνιαίου
  choice: 隅の要石
  rationale: 建物の隅で全体を結び支える重要な石を指す。「隅石」より意味を把握しやすく、「かしら石」など解釈の異なる語を避けた。
- source_word: αὐτοῦ
  choice: ご自身
  rationale: Χριστοῦ Ἰησοῦを強める用法として、人を指す強意を自然な敬意を伴う日本語で表した。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を「メシア」で保ちつつ、日本語として不自然な連結を避けるため「メシアであるイエス」とした。
theological_decisions:
- issue: 「使徒たちと預言者たちの土台」の属格の意味
  choice: 「使徒たちと預言者たちの」と広いまま訳す
  alternative: 「使徒たちと預言者たちが据えた土台」または「使徒たちと預言者たちから成る土台」
  rationale: ギリシア語の属格だけでは、彼らの証言に関係する土台、彼らが据えた土台、彼ら自身が構成する土台のいずれかを厳密に特定できないため、曖昧さを保持した。
- issue: Χριστόςの訳語
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: この建築比喩の文脈では称号としての意味が認識できるため、「メシア」を本文に用い、伝統的な音訳は注に示した。
- issue: ἀκρογωνιαῖοςの建築上の位置
  choice: 隅の要石
  alternative: 隅石、かしら石、頂石
  rationale: 文脈上は土台と建物の比喩であり、隅に置かれて建物を結び合わせる石という理解を採った。「頂石」として建物上部に限定する解釈は本文に持ち込まなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、建築比喩と敬意ある聖書本文の格調を保った。節単独でも読めるよう述語を補いつつ、「建てられており」によって前後の文との継続性を示した。
