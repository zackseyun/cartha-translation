id: EPH.2.18
reference: Ephesians 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: ja
  text: それは、この方を通して、私たち双方が、一つの御霊によって父のみもとに近づくことができるからです[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「というのも、この方を通して…」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「近づくことができる」に当たる語は、「近づく道がある」「導き入れられることが許されている」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「一つの御霊のうちに」。ギリシア語は、御霊が近づくための手段であることも、共に御霊のうちにあることも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: それは…からです
  rationale: 直前の平和と和解の根拠を示す接続を、自然な現代日本語の説明・理由構文で表した。
- source_word: δι’ αὐτοῦ
  choice: この方を通して
  rationale: 属格を伴うδιάの媒介の意味を保ち、文脈上のキリストを、本文にない名を補わずに指し示した。
- source_word: ἔχομεν τὴν προσαγωγὴν
  choice: 近づくことができる
  rationale: 字義的には『近づく道・接近する権利を持つ』という意味であり、父のもとへ近づくことを許された現在の共有現実として、明瞭な日本語にした。
- source_word: οἱ ἀμφότεροι
  choice: 私たち双方
  rationale: ユダヤ人と異邦人という二者を指すが、原文の一人称と簡潔さを保ち、説明語を本文に加えなかった。
- source_word: ἐν ἑνὶ πνεύματι
  choice: 一つの御霊によって
  rationale: ἐνがここで表し得る手段を自然な日本語で示した。『御霊』は、御子を通して御父へ至るという文脈から、聖霊を指す可能性が最も高いことを表す。場所・領域の含みは脚注に残した。
- source_word: πρὸς τὸν πατέρα
  choice: 父のみもとに
  rationale: πρόςの方向性と人格的な臨在への接近を、日本語として自然に表した。原文にない『神』は補わなかった。
theological_decisions:
- issue: 「一つの霊」の指示対象
  choice: 聖霊（御霊）
  alternative: 一致した人間の心・霊
  rationale: 『この方を通して』『一つの御霊によって』『父のみもとに』という構造とエフェソ書の文脈は、聖霊を指すとの理解を強く支持する。ただし『聖』という説明語は本文に加えず、『御霊』で示した。
- issue: προσαγωγήの意味合い
  choice: 父のみもとに近づくことができる
  alternative: 父の前に導き入れられること／父に近づく権利を持つこと
  rationale: 宮廷的または礼拝的な『導き入れ』の含みを排除せず、両者に与えられた継続的な接近の恵みを、一般読者に明瞭な表現で示した。
- issue: ἐνの手段と領域の曖昧さ
  choice: 一つの御霊によって
  alternative: 一つの御霊のうちに
  rationale: 日本語本文では自然さを優先して手段として訳したが、ギリシア語は手段と領域の双方を含み得るため、別訳を脚注に明記した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「この方」「御霊」「父のみもと」で尊厳ある聖書的文体を保った。「私たち双方」は原文の共同性を維持し、二者がユダヤ人と異邦人であるとの説明は本文に足していない。
