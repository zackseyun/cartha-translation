lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: 行いから出たものではありません
  rationale: ἐξの源・起源を表す基本的な意味を「から」で保ちつつ、前節から続く文として自然な日本語にした。「行いによるのではありません」も可能だが、手段の意味に限定しやすい。
- source_word: ἔργων
  choice: 行い
  rationale: 限定のない複数形を、パウロ書簡で自然かつ広く用いられる「行い」とした。「律法の行い」や「善い行い」は原文にない限定を加えるため避けた。
- source_word: ἵνα μή τις
  choice: それは、だれも…ないためです
  rationale: 否定を伴う目的節として表現し、誰をも性別で限定しない自然な現代日本語とした。
- source_word: καυχήσηται
  choice: 誇ることがない
  rationale: καυχάομαιの「誇る」という直接的な意味を保持した。文脈上、単なる内面的な自尊心よりも、自らを誇ることを指す。
theological_decisions:
- issue: 「行い」の範囲
  choice: 限定せず「行い」とする
  alternative: 「律法の行い」「人間の努力」「善い行い」
  rationale: 原文はἔργωνとのみ記しているため、特定の種類の行いに狭めず、簡潔さと解釈上の幅を保った。
- issue: ἐξの意味合い
  choice: 源・起源を前面に出す「から」
  alternative: 手段を前面に出す「によって」
  rationale: ἐκ/ἐξの基本的な源・起源の意味を保持する。ただし、この箇所に手段的な含みを認める解釈も脚注で示した。
