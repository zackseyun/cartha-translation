id: EPH.2.3
reference: Ephesians 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: ja
  text: 彼らの中で、私たちも皆、かつては自分たちの肉の欲望に従って生き、肉と心の欲することを行っていました。そして、ほかの人々と同じように、生まれながらに怒りの子でした。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのようなことの中で」。ギリシア語は、直前に述べられた不従順な人々を指すとも、違反と罪に特徴づけられた領域を指すとも取れます。
    reason: alternative_reading
  - marker: b
    text: ここで「肉」は、単なる身体を指すだけではなく、倫理的な文脈で用いられています。「罪深い性質」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「怒りの子」はギリシア語の表現を保った訳です。「怒りを受ける者」とも解釈できます。また「生まれながらに」は、本来的・自然的な状態を表し、生物学的な出生だけに意味を限定するものではありません。
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ἐν οἷς
  choice: その者たちの中で
  rationale: 直前の「不従順の子ら」を人的な先行詞と見る自然な理解を本文に採った。ただし、違反と罪という領域を指す可能性も注で保持する。
- source_word: ἀνεστράφημέν
  choice: 生き
  rationale: 一定の生活態度や振る舞いを表す中動・受動形の意味を、現代日本語で自然に示す。
- source_word: ἐπιθυμίαις
  choice: 欲望
  rationale: 性的な欲情だけに限定せず、倫理的に乱れた願望全般を表せる語を選んだ。
- source_word: σάρξ
  choice: 肉
  rationale: パウロの特徴的な語を保ち、「罪深い性質」と解釈的に限定しない。身体そのものだけを意味するとの誤解には注意を要する。
- source_word: ποιοῦντες τὰ θελήματα
  choice: 望むことを行って
  rationale: 直訳的な「意志を行う」より自然でありつつ、欲求だけでなく意向が実行に移される意味を表す。
- source_word: διανοιῶν
  choice: 思い
  rationale: 複数形が表す思考や心的傾向を、簡潔で広がりのある日本語にした。
- source_word: τέκνα ὀργῆς
  choice: 怒りの子
  rationale: セム語的な属格表現を保持し、怒りを受ける者という意味だけに解消しない。
- source_word: φύσει
  choice: 生まれながらに
  rationale: 自然的・本来的な状態を日本語で明瞭に示す。ただし、生物学的出生だけに狭めないよう注記する。
- source_word: οἱ λοιποί
  choice: ほかの人々
  rationale: キリストの外にある周囲の人間を比較対象とする表現として自然な日本語を用いた。
theological_decisions:
- issue: 倫理的文脈におけるσάρξ
  choice: 肉
  alternative: 罪深い性質
  rationale: 倫理的な含みは明らかだが、後者ではパウロの人間理解を特定の体系へ狭めるため、原語の比喩と緊張を保った。
- issue: τέκνα φύσει ὀργῆςの意味
  choice: 生まれながらに怒りの子でした
  alternative: 本来、怒りを受ける者でした
  rationale: 原罪、人間の生来の状態、裁きとの関係をめぐる論点を訳文で断定的に整理せず、原文の慣用表現を可能な限り保持した。
- issue: 怒りの主体
  choice: 「怒り」とだけ訳す
  alternative: 神の怒り
  rationale: 文脈上は神の怒りと理解されるが、この節のギリシア語本文には「神の」が明記されていないため補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの「肉」「怒りの子」という神学的に重要な表現を保持した。「欲望のままに生き」「望むことを行う」として反復をやや整理しつつ、ἐπιθυμίαιとθελήματαの区別を残した。
