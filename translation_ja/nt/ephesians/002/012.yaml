id: EPH.2.12
reference: Ephesians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: ja
  text: その時、あなたがたはメシア[a]なしで、イスラエルの共同体から疎外され、約束にかかわる数々の契約[b]に縁のない者であり、希望を持たず、この世にあって神なし[c]であったことを。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語のΧριστόςは「油を注がれた者」という称号で、ここではイスラエルと契約の文脈を踏まえて「メシア」とした。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「約束の数々の契約」。
    reason: lexical_alternative
  - marker: c
    text: 「不敬虔な」とも訳せる。この語は、哲学的な無神論というより、真の神との関係を欠くことを指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: メシアから離れ
  rationale: χωρίς＋属格が表す分離・欠如を自然な日本語で示し、イスラエルと契約という文脈にあるΧριστόςの称号的意味を「メシア」で保った。
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: イスラエルの共同体から疎外され
  rationale: 完了受動分詞が示す、切り離された状態を「疎外され」で表した。πολιτείαは個人の法的な市民権だけでなく、イスラエルの共同体的・政治的秩序を指しうるため「共同体」とした。
- source_word: ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας
  choice: 約束にかかわる数々の契約に縁のない者
  rationale: ξένοιの外部者としての意味を、現代日本語で自然な「縁のない者」とした。διαθηκῶνの複数を「数々の契約」で明示し、属格τῆς ἐπαγγελίαςは関係を断定しすぎない「約束にかかわる」で表した。
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: 希望を持たず
  rationale: 分詞句の描写的な流れを簡潔に保った。
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: この世で神なしに生きていた
  rationale: ἄθεοιを近代的な思想上の「無神論者」とせず、神との関係を欠いた状態として表した。ἐν τῷ κόσμῳは人間が生きる領域を示す自然な「この世で」とした。
- source_word: ὅτι ἦτε τῷ καιρῷ ἐκείνῳ
  choice: その時、あなたがたは……生きていたことを
  rationale: 前節の「覚えていなさい」に従属するὅτι節であることを、文末の「ことを」で保持した。「その時」が過去を明示するため、「かつて」は加えなかった。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: 異邦人、イスラエル、契約が並ぶユダヤ的・契約的文脈では、油注がれた者という称号の意味が前景化しているため。ただし教会で定着した「キリスト」も可能なので脚注に示した。
- issue: ἄθεοιの意味
  choice: 神なしに生きていた
  alternative: 神を持たない者／不敬虔な者／無神論者
  rationale: ここでは哲学的な神存在の否定よりも、真の神との関係を欠く状態が中心と考えられる。「無神論者」という現代的カテゴリーの持ち込みを避けた。
- issue: διαθηκῶν τῆς ἐπαγγελίαςの属格関係
  choice: 約束にかかわる数々の契約
  alternative: 約束の数々の契約
  rationale: 「契約」が複数、「約束」が単数であることを保ちつつ、属格が示す関係を日本語で過度に限定しないようにした。
translation_notes:
  register: 明快な現代標準語を用い、節が前文の「覚えていなさい」に続く従属節であることを「ことを」で示した。「疎外」「契約」など必要な聖書語彙は保ちつつ、「国籍」「無神論者」のように意味を狭めうる語を避けた。
