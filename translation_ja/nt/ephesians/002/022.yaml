  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: ja
  text: この方にあって、あなたがたも共に建て上げられて、聖霊にあって神の住まいとなるのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この建物にあって」。関係代名詞がキリストではなく、建物全体を指す可能性もある。
    reason: alternative_reading
  - marker: b
    text: 別訳「霊において」または「聖霊によって」。この句は、神が住まわれる領域、あるいは聖霊の働きを表す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: この方にあって
  rationale: 直前から続く文脈ではキリストが最も自然な先行詞であり、人格的な指示を明確にしつつ、結合・領域を表すἐνを「にあって」で保った。建物全体を指す可能性は脚注に残した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: 明示された複数二人称の強調と、読者を神の民全体に加えるκαίの付加的な力を自然に表した。
- source_word: συνοικοδομεῖσθε
  choice: 共に建て上げられ
  rationale: 現在受動形の継続的過程と、接頭辞συν-の共同性を表す。「建て上げる」は建造物の比喩に適合する自然な日本語である。
- source_word: εἰς κατοικητήριον τοῦ θεοῦ
  choice: 神の住まいとなっていく
  rationale: εἰςの目標・結果を「となっていく」で表し、現在形の進行性も自然に伝えた。τοῦ θεοῦは、神がそこに住まわれるという関係を簡潔な「神の住まい」で保持した。
- source_word: ἐν πνεύματι
  choice: 御霊による
  rationale: 文脈上、聖霊を指す可能性が最も高い。「による」は共同建造における御霊の働きを自然に示すが、原句には領域を示す「御霊にあって」の可能性もあるため脚注で示した。
theological_decisions:
- issue: ἐν ᾧの先行詞
  choice: キリストを指す「この方にあって」
  alternative: 建物全体を指す「この建物にあって／この建物の中で」
  rationale: 21節からの反復とキリスト中心の文脈により、キリストを先行詞と取るのが自然である。ただし、文法上は建物全体との関連もあり得るため、その曖昧さを脚注に保存した。
- issue: ἐν πνεύματιの意味
  choice: 聖霊の働きを表す「御霊による」
  alternative: 領域を表す「御霊にあって」、または無冠詞的な「霊において」
  rationale: エフェソ書の神殿・内住の文脈では聖霊が最も自然な指示対象である。日本語本文では建造の動作との結び付きを明瞭にしたが、ἐνが持つ領域と手段の重なりを脚注で保持した。
translation_notes:
  register: 明瞭で現代的かつ礼拝朗読にも耐える文体。「御霊」は聖霊を指すことを自然に示す聖書語として用いた。「となっていく」により、共同体が今も建てられているという現在受動形の継続性を表した。
