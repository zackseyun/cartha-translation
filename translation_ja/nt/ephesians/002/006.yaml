  terminology: 「メシア・イエス」は Χριστῷ Ἰησοῦ の称号性を保っており、プロジェクト方針に合う。「よみがえらせる」は復活を明瞭に伝える。「天上の領域」は用語として理解可能である。現行脚注の「天上のもの（ところ）」は、日本語として逐語的すぎ、原語の実体化された形容詞を正確に説明しにくいため、自然な代案に改める。
