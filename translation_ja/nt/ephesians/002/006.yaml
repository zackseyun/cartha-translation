lexical_decisions:
- source_word: συνήγειρεν
  choice: 私たちを彼とともによみがえらせ
  rationale: 接頭辞 συν- が示す、キリストとともに復活させられた共同参与を明示した。「私たち」は前節から補われる目的語であり、「よみがえらせ」は復活の文脈を自然に伝える。
- source_word: συνεκάθισεν
  choice: 彼とともに座らせてくださいました
  rationale: 「ともに座らせる」という使役的意味と συν- の共同性を保った。「王座に着かせた」では含意を確定しすぎるため避けた。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上の領域で
  rationale: 形容詞の中性複数を実体的に用いるエフェソ書特有の表現で、天に属する場所・領域を指す。「天上で」より領域性を伝えつつ、「天上の場所」より自然な現代日本語とした。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστός の称号としての意味を「メシア」で示し、ἐν の結合・参与を表すパウロ的表現を「にあって」で保持した。
- source_word: καὶ … καὶ
  choice: そして…、…
  rationale: 前文との連続と二つの神の行為の並列を、日本語として自然な形で示した。
theological_decisions:
- issue: 複合動詞におけるキリストとの共同参与
  choice: 二つの動詞の双方を「彼とともに」と明示する
  alternative: 「私たちをよみがえらせ、座らせた」として共同性を暗示にとどめる
  rationale: συν- を伴う両動詞は、信徒がキリストの復活と着座に参与することを表す。日本語では「彼とともに」と明示することで原文の意味を過不足なく伝えられる。
- issue: συνεκάθισεν の着座が即位を意味するか
  choice: 「座らせてくださいました」と訳し、即位の含意を確定しない
  alternative: 「王座に着かせてくださいました」
  rationale: 文脈上、支配や高挙との関係はあり得るが、この動詞自体に「王座」は明記されていないため、神学的含意を訳文に追加しない。
- issue: Χριστῷ を称号として訳すか、名称化した形で訳すか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: Χριστός の「油注がれた者／メシア」という称号的意味を読者に直接伝える。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「くださいました」により、文脈上の主語である神の恵み深い行為を自然に受けつつ、節単独でも読みやすくした。「よみがえる」は一般読者への明瞭さを優先して平仮名表記とした。
