  terminology: 「よそ者」「在留外国人」は ξένοι と πάροικοι の区別を保っています。「聖なる者たち」は指示対象を不当に限定せず、神学的にも適切です。「神の家」は οἰκεῖοι の家・家政共同体の比喩を保持します。
