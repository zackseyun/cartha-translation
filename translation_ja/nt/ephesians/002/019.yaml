id: EPH.2.19
reference: Ephesians 2:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: ja
  text: こういうわけで、あなたがたは、もはやよそ者でも在留外国人[a]でもなく、聖なる者たち[b]と共に市民[c]であり、神の家に属する者なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「寄留者」。ギリシア語は、その土地に住んでいても完全な市民としての身分を持たない人を指します。
    reason: lexical_alternative
  - marker: b
    text: 「聖なる者たち」は、特別に列聖された人々という意味ではなく、神に属する聖なる人々を指します。
    reason: cultural_note
  - marker: c
    text: 直訳的には「聖なる者たちの同胞市民」。聖なる者たちと市民権を共有するという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: こういうわけで
  rationale: 直前までの議論から結論を導く二つの推論辞の力を、自然な現代日本語の接続表現で示した。
- source_word: οὐκέτι
  choice: もはや…ない
  rationale: 以前の状態から身分が変化したことを表す時間的否定を明確に伝える。
- source_word: ξένοι
  choice: よそ者
  rationale: 共同体に属さない者という意味を保ちつつ、続く πάροικοι の社会的・法的含意と区別した。
- source_word: πάροικοι
  choice: 在留外国人
  rationale: ある土地に住んでいながら完全な市民権を持たない者という含意を、現代日本語で簡潔に表した。
- source_word: συμπολῖται
  choice: 同じ市民
  rationale: 共に市民権を持つという複合語の意味を自然に表し、聖なる者たちとの共同帰属を示した。
- source_word: τῶν ἁγίων
  choice: 聖なる者たちと
  rationale: 属格を συμπολῖται に伴う共同・連帯の意味として訳し、指示対象を特定の一群に狭めなかった。
- source_word: οἰκεῖοι
  choice: 家の者
  rationale: 同じ家に属する者、家の一員という家族・家政共同体の比喩を簡潔に保持した。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 所属を示す属格として自然に訳し、『神の家の者』という原文の比喩を保った。
theological_decisions:
- issue: 「聖なる者たち」（τῶν ἁγίων）の指示対象
  choice: 指示対象を限定せず「聖なる者たち」とした
  alternative: 「神の民」「すべての信者」「ユダヤ人信者」「御使いたち」などと特定する
  rationale: 文脈は異邦人が神の民に加えられたことを語るが、この語自体がどの範囲を指すかは訳文で狭めず、原文の幅を保つのが適切である。
- issue: οἰκεῖοι τοῦ θεοῦ の比喩
  choice: 神の家の者
  alternative: 神の家族の一員
  rationale: 「家族」と明示すれば関係性は分かりやすいが、οἰκεῖοι は家族だけでなく家に属する者を含み得るため、「家の者」として家・家政共同体の比喩と幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、結論を導く論理、身分の転換、市民権と家という二つの比喩を保持した。「よそ者」「在留外国人」「同じ市民」「神の家の者」という対照が一読して伝わるように整えた。
