revisions:
- from: こういうわけで、あなたがたは、もはやよそ者でも在留外国人[a]でもなく、聖なる者たち[b]と同じ市民[c]であり、神の家の者なのです。
  to: こういうわけで、あなたがたは、もはやよそ者でも在留外国人[a]でもなく、聖なる者たち[b]と共に市民[c]であり、神の家に属する者なのです。
  rationale: 市民権の比喩における共同性を、自然な現代日本語で明確にするため「聖なる者たちと共に市民であり」と改めました。また、家への所属という οἰκεῖοι の比喩を損なわずに読みやすくするため、「神の家に属する者」としました。脚注bは「聖なる」の語義をより直接に示すよう、最小限に整えました。
