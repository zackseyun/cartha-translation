  to: それは、来たるべき諸時代[a]に、メシア・イエス[c]にあって私たちに対する慈しみのうちに、ご自分の恵みの並外れて豊かな富[b]を示すためでした。
  rationale: 修正は、ἐν χρηστότητιの様態・領域の含みを「慈しみのうちに」で保ち、ἐφ’ ἡμᾶςを「私たちに対する」と自然に結びました。また、称号としてのΧριστόςを本文で「メシア」と訳し、πλοῦτοςの「富」の比喩を本文・脚注ともに保持しました。
