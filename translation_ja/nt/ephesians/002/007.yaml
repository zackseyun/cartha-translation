reference: Ephesians 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: ja
  text: それは、来たるべき諸時代[a]に、メシア・イエス[c]にあって私たちに対する慈しみのうちに、ご自分の恵みの並外れて豊かな富[b]を示すためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「来ようとしている諸時代に」。
    reason: lexical_alternative
  - marker: b
    text: 「恵みの測り知れないほど豊かな富」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「メシア」は「油注がれた者」を意味する称号。
    reason: title_clarification
lexical_decisions:
- source_word: ἵνα
  choice: それは〜示すためでした
  rationale: 前節の神の行為が目指す目的・結果を示す接続詞として、目的の力を保ちながら日本語の文脈に自然につながる形にした。
- source_word: ἐνδείξηται
  choice: 示す
  rationale: 公に明らかにし、実証する含みを持つが、現代日本語では「示す」が簡潔で自然である。
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: 来たるべき幾つもの時代に
  rationale: αἰῶσιν の複数を「幾つもの時代」で明示し、ἐπερχομένοις の未来的意味を「来たるべき」で表した。
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: この上なく豊かな富
  rationale: ὑπερβάλλον の「凌駕する、並外れた」と πλοῦτος の富の比喩をともに保つ。多少重層的な表現だが、原文の強調を伝える。
- source_word: τῆς χάριτος αὐτοῦ
  choice: ご自分の恵みの
  rationale: パウロ書簡で中心的な意味を持つ χάρις を、定着した「恵み」で訳した。
- source_word: ἐν χρηστότητι
  choice: 慈しみにより
  rationale: χρηστότης が表す親切、慈愛、寛大な善意を「慈しみ」で表し、ここでは恵みを示す仕方・現れとして理解した。
- source_word: ἐφ’ ἡμᾶς
  choice: 私たちに向けられた
  rationale: ἐπί＋対格の方向性を明示し、神の慈しみが「私たち」に及ぶことを自然な日本語で表した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: キリスト・イエスにあって
  rationale: パウロ特有の結合・領域を表す ἐν Χριστῷ を「にあって」で保ち、Χριστός は称号としての意味を注で明示した。
theological_decisions:
- issue: ἐν χρηστότητι と ἐφ’ ἡμᾶς の統語的関係
  choice: 私たちに向けられた慈しみにより
  alternative: 私たちに対する慈しみのうちに
  rationale: 慈しみが神の恵みを示す仕方であり、同時に私たちへ向けられているという関係を自然な日本語で示した。ギリシア語の「〜において」という表現を機械的には重ねなかった。
- issue: Χριστός を称号としてどう表すか
  choice: 本文では「キリスト・イエス」、注で「メシア」の意味を明示
  alternative: メシアであるイエス
  rationale: 日本語で定着したパウロ書簡の表現と「〜にあって」の神学的含意を保ちつつ、「キリスト」が本来称号であることを注で伝える。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、神の恵みの卓越性を表す原文の荘重さを保った。「来たるべき」「にあって」は聖書的な響きを持つが、一般読者にも理解可能な範囲で用いている。
