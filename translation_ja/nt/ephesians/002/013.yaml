  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: ja
  text: しかし今や、メシアであるイエスにあって[a]、かつて遠く離れていた[b]あなたがたは、メシアの血によって[c]近くなりました[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「メシア・イエスにあって」。伝統的には「キリスト・イエスにあって」とも訳されます。
    reason: lexical_alternative
  - marker: b
    text: 「遠くにいた」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「メシアの血を通して」、または直訳的に「メシアの血のうちに」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: 「近くに来ました」とも訳せます。また、文脈上の働きかけを表して「近くされた」とすることもできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今や
  rationale: δέの対照・転換と、νυνίの強い時間的対比を、前節までの過去の状態とのつながりが明確になる自然な日本語で表した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにあって
  rationale: Χριστόςの称号としての意味を「メシア」で示し、ἐνはパウロ特有の結合・帰属の含みを保つ「にあって」とした。
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: かつて…いたあなたがた
  rationale: 複数の二人称と、ποτεおよび分詞が示す以前の継続的状態を、現代日本語として自然な連体構文で表した。
- source_word: μακρὰν
  choice: 遠く離れていた
  rationale: 空間的比喩と、文脈上の神および契約共同体からの隔たりの双方を保ちつつ、意味を限定しすぎない表現とした。
- source_word: ἐγενήθητε ἐγγὺς
  choice: 近い者となりました
  rationale: γίνομαιの基本的な変化の意味を直接表し、行為者を明示しない原文の形を保った。「者」を補うことで日本語として自然にした。
- source_word: ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: メシアの血によって
  rationale: ἐνを手段と理解し、近い者となることがメシアの血を手段として生じたと表した。「血」は原文の犠牲的・死の含意を説明に置き換えず保持した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名の一部としてではなく称号としての意味が生きているため、「油注がれた者」という救済史的背景を伝える「メシア」とした。
- issue: ἐν Χριστῷ Ἰησοῦの関係性
  choice: メシアであるイエスにあって
  alternative: メシアであるイエスによって／メシア・イエスのうちに
  rationale: 手段だけに限定せず、パウロの結合・領域・帰属を含み得る表現として「にあって」を用いた。
- issue: ἐγενήθητεの態と行為者
  choice: 近い者となりました
  alternative: 近くへ導かれました／近い者とされました
  rationale: 原文は神の働きを文脈上含み得るが、ここで行為者を明示してはいないため、能動的自己達成にも明示的な神的受動にも固定しない「となりました」を選んだ。
- issue: ἐν τῷ αἵματιの機能
  choice: 血によって
  alternative: 血のうちに／血を通して
  rationale: 手段の意味が文脈に最もよく合う。ただし前置詞ἐνには領域的な読みの余地もあるため、脚注で代案を示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「にあって」「血」「近い者」というパウロの神学的・比喩的表現を説明的な言い換えで解消せず保持した。敬体で整え、礼拝朗読にも個人読書にも適する端正な調子とした。
