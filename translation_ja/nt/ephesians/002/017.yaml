  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: ja
  text: そして、キリストは来て、遠く離れていたあなたがた[a]に平和を告げ知らせ、近くにいた人々にも平和を告げ知らせました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「遠く離れていた」人々と「近くにいた」人々は、文脈上、それぞれ異邦人とユダヤ人を指します（エフェソス2:11–13参照）。
    reason: cross_reference
  - marker: b
    text: 別訳「平和を良い知らせとして告げた」。ギリシア語の動詞には「良い知らせを告げる」という意味がありますが、ここで告げられる内容は「平和」です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 来て
  rationale: アオリスト分詞を、主動詞に先立つ動作として自然な日本語で表した。移動のイメージも保っている。
- source_word: εὐηγγελίσατο
  choice: 告げ知らせました
  rationale: この動詞には「良い知らせを伝える」という含意があるが、直接目的語が「平和」であるため、「福音を宣べ伝えた」と語を補わず、告知の意味を自然に表した。
- source_word: εἰρήνην
  choice: 平和
  rationale: 基本的かつ文脈に適した訳語。和解やシャロームの含みを狭めずに保つ。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 与格の間接目的語を直接に訳した。直前の文脈では異邦人読者への呼びかけである。
- source_word: τοῖς μακρὰν
  choice: 遠く離れていたあなたがた
  rationale: 距離を表す比喩を保ちつつ、ὑμῖνとの同格的な関係が日本語で明確になるようにした。
- source_word: τοῖς ἐγγύς
  choice: 近くにいた人々
  rationale: 「遠く離れていた」との対照を保ち、特定の集団名を本文に補わなかった。
- source_word: καὶ ... καὶ
  choice: そして……にも
  rationale: 二つの対象が同じ平和の告知を受けた並列関係を、自然な日本語で示した。
theological_decisions:
- issue: 「遠く離れていた者」と「近くにいた者」の同定
  choice: 本文では距離の比喩を保ち、脚注で文脈上の同定を示す。
  alternative: 「遠く離れていた異邦人」と「近くにいたユダヤ人」と本文で明示する。
  rationale: 2:11–13の文脈ではそれぞれ異邦人とユダヤ人を指すが、本節自体の修辞的表現を保ち、解釈を本文へ織り込まないため。
- issue: 省略された主語の明示
  choice: 「キリスト」を補う。
  alternative: 「彼は」とする。
  rationale: 直前の文脈における主語を日本語で明確にしつつ、新たな解釈を加えない。「彼」より単独の節として理解しやすい。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「宣べ伝える」より広く理解しやすい「告げ知らせる」を用いた。並行構造を保ちながら、日本語として不自然な同一動詞の完全反復は避けた。
