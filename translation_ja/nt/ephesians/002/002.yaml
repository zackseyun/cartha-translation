id: EPH.2.2
reference: Ephesians 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: ja
  text: それらの中で、あなたがたはかつて、この世の時代に従い[a]、空中[b]の権威の支配者、すなわち今、不従順の子ら[c]の中で働いている霊に従って、歩んでいました[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の「時代」（αἰών）は、現在の世を特徴づける時代やあり方を表します。
    reason: lexical_alternative
  - marker: b
    text: 「空中」は、敵対する霊的な力と結びつけられた領域を指す古代の宇宙観に基づく表現です。
    reason: cultural_note
  - marker: c
    text: 「不従順の子ら」とは、不従順によって特徴づけられる人々のことです。
    reason: idiom_clarification
  - marker: d
    text: ここで「歩む」は、日々を生きること、また生き方を表す比喩です。
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἐν αἷς
  choice: それらの中で
  rationale: 女性複数の関係代名詞が前節の「背きと罪」を受けることを保ちつつ、この節を前節から自然につなぐ表現とした。
- source_word: ποτε
  choice: かつて
  rationale: 現在とは異なる過去の生活を簡潔かつ明瞭に示す。
- source_word: περιεπατήσατε
  choice: 歩んでいました
  rationale: 生き方を「歩む」と表すパウロの比喩を保持し、現代日本語でも理解できる表現とした。
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: この世の時代のあり方に従い
  rationale: αἰώνの「時代」とκόσμοςの「世」を区別して示しながら、κατάが表す同調・準拠の意味が自然に伝わるよう「あり方」を補った。
- source_word: ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: 空中の権威を持つ支配者
  rationale: ἄρχωνを「支配者」、ἐξουσίαを「権威」、ἀήρを「空中」とし、属格の連鎖を日本語として理解可能な形に整えた。
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: すなわち今…働いている霊
  rationale: πνεῦμαを聖霊とは区別して「霊」とし、現在分詞の継続的な働きを「今…働いている」で表した。「すなわち」により先行句との説明的関係を示すが、その存在の性質はそれ以上限定しない。
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: 不従順の子らの中で
  rationale: セム語的な「不従順の子ら」という表現を保持し、ἐνの領域的な意味を「中で」とした。
theological_decisions:
- issue: 「今…働いている霊」と「空中の権威を持つ支配者」との関係
  choice: 「すなわち」を用いて、後者が前者を説明する同格的なつながりを示した。
  alternative: 「霊」を支配者とは別個の非人格的な力、または支配者の配下にある力として訳す。
  rationale: 属格の連鎖と冠詞構造は説明的な結びつきを許す。本文は両者を密接に結びつける一方、その霊が支配者自身なのか、その権威を特徴づける力なのかを存在論的に断定しない。
- issue: υἱοῖς τῆς ἀπειθείαςの慣用表現
  choice: 「不従順の子ら」とし、原文の親族比喩を保持した。
  alternative: 「不従順な人々」と意味を明示して訳す。
  rationale: この表現は不従順によって特徴づけられる人々を指す。本文では比喩を残し、脚注で意味を明確にする。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「歩む」「不従順の子ら」など原文の主要な比喩と慣用表現を保持した。長い修飾関係は読点で整理し、荘重さを損なわずに一読して構造を追える文体とした。
