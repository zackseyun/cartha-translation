id: EPH.2.11
reference: Ephesians 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: ja
  text: ですから、思い起こしなさい。かつてあなたがた[a]は、肉において異邦人であり、肉に人の手で施された「割礼」と呼ばれる者たち[c]から、「無割礼」と呼ばれていたことを[b]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「かつて、肉において異邦人であったあなたがた」。ここで「異邦人」は非ユダヤ人を指し、原文では「あなたがた」が強調されています。
    reason: lexical_alternative
  - marker: b
    text: 「割礼」と「無割礼」は、ここでは単なる身体上の説明ではなく、契約と民族に関わる集団の呼称として用いられています。
    reason: cultural_note
  - marker: c
    text: 「肉に人の手で施された『割礼』」は、身体に人の手で施される外面的な割礼を指します。原文の言い方には、そのような外面的呼称に距離を置く響きがある可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の議論を受ける推論的な接続を、現代日本語で自然に示す。
- source_word: μνημονεύετε
  choice: 思い起こしなさい
  rationale: 複数の読者への現在命令であり、単に記憶するだけでなく、以前の状態を意識的に顧みるよう促す語感を表す。
- source_word: ποτὲ ὑμεῖς
  choice: かつてあなたがたは
  rationale: 過去と現在の対比を示しつつ、明示された代名詞ὑμεῖςの強調を保つ。
- source_word: τὰ ἔθνη
  choice: 異邦人
  rationale: ここでは地政学的な『諸国民』ではなく、ユダヤ人との対比における非ユダヤ人を指す。
- source_word: ἐν σαρκί
  choice: 肉において
  rationale: 身体的・民族的な状態を指す表現であり、罪深い性質という意味に限定せず、原文の『肉』を保持する。
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: 「無割礼」と呼ばれていました
  rationale: 身体の状態だけでなく、外部から付された民族的・契約的な呼称であることを引用符と受動表現で示す。
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: いわゆる「割礼」の者たちから
  rationale: 抽象名詞『割礼』が割礼を受けた集団を指す換喩を自然な日本語にしつつ、λεγομένηςが示す修辞的距離を『いわゆる』で残す。
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: 肉に人の手で施された
  rationale: χειροποίητοςの『人の手による』という意味を明示し、外面的・身体的な割礼を指すことを保つ。
theological_decisions:
- issue: 非道徳的文脈におけるσάρξの訳
  choice: 肉において／肉に
  alternative: 身体上は／体に
  rationale: ここでのσάρξは罪性ではなく、身体的かつ社会・民族的な区分を指す。『肉』を残すことで、同じ語を反復する原文とパウロの議論の含みを保持する。
- issue: λεγομένης περιτομῆςの修辞的な力
  choice: いわゆる「割礼」の者たち
  alternative: 「割礼」と呼ばれる者たち
  rationale: 原文は『無割礼と呼ばれる』と『割礼と呼ばれる』を対称的に置き、外面的呼称に一定の距離を取っている可能性がある。『いわゆる』はその含みを残すが、露骨な軽蔑や反ユダヤ的な調子にはしない。
- issue: περιτομήとἀκροβυστίαの集団的用法
  choice: 「割礼」の者たち／「無割礼」
  alternative: 割礼を受けた人々／割礼を受けていない人々
  rationale: 説明的に言い換えすぎず、契約的・民族的な呼称として用いられる二つの語の対照を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い一文の統語関係を読み取りやすくするため読点を用い、次節へ続く構文であることを末尾のダッシュで示した。「肉」「割礼」「無割礼」という主要語は原文の神学的・修辞的緊張を保つため維持した。
