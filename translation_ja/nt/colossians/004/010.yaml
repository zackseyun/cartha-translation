  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: ja
  text: 私と共に捕らわれているアリスタルコが、あなたがたにあいさつを送っています。また、バルナバのいとこ[a]であるマルコも、あなたがたにあいさつを送っています（彼については、あなたがたは指示を受けています。もし彼があなたがたのところに来たなら、迎え入れてください[b]）。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バルナバの甥」とも訳されてきたが、ギリシア語のἀνεψιόςは、この時代には「いとこ」をより正確に表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼を受け入れてください」。ギリシア語の動詞は、客を受け入れてもてなすことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: よろしくと言っています
  rationale: 書簡の挨拶を表す現在形の慣用表現。現代日本語で自然に挨拶の伝言を表しつつ、動詞の直接性を保つ。後半のマルコにも省略された同じ動詞を補った。
- source_word: συναιχμάλωτός
  choice: 私と共に捕らわれている者
  rationale: 共に捕らわれた者を意味する複合名詞。日本語本文では人名に自然につながるよう「私と共に捕らわれているアリスタルコ」とし、捕囚が文字どおりか比喩的かは限定しない。
- source_word: ἀνεψιὸς
  choice: いとこ
  rationale: コイネー・ギリシア語では、広い意味の親族ではなく、より具体的に「いとこ」を指す。「甥」とする古い訳の伝統より語義に忠実である。
- source_word: ἐλάβετε ἐντολάς
  choice: 指示を受けています
  rationale: ἐντολήには命令と指示の意味がある。この訪問者の応接に関する文脈では「指示」が自然であり、権威ある伝達という含みも保てる。
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: もし彼があなたがたのところに来たなら
  rationale: ἐάνとアオリスト接続法による将来の可能性を条件として明瞭に表す。
- source_word: δέξασθε αὐτόν
  choice: 迎え入れてください
  rationale: 旅行者を受け入れる文脈でのδέχομαιの歓待的な意味を、現代日本語で自然に表す。「受け入れる」より対人的な歓迎の響きが明確である。
theological_decisions:
- issue: συναιχμάλωτός μουが示すパウロとアリスタルコの関係
  choice: 「私と共に捕らわれている」と訳し、拘禁の性質を特定しない
  alternative: 「主にあって共に捕らわれている」「苦難を共にする同労者」
  rationale: 原文は「主にあって」などの限定を明記していないため、実際の投獄か比喩的な捕囚かを翻訳で決めず、原文の緊張を保つ。
