id: COL.4.7
reference: Colossians 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: ja
  text: 愛する兄弟、忠実な奉仕者[b]、また主にあって共に仕えるしもべ[c]であるティキコが、私のことをすべて[a]、あなたがたに知らせます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私に関するすべてのことを」または「私の身の上をすべて」。
    reason: lexical_alternative
  - marker: b
    text: 「忠実に仕える者」とも訳せる。ギリシア語の「ディアコノス」は、奉仕者、仕える者を意味し、文脈によっては教会の職務としての「執事」を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳的には「仲間の奴隷」。「共に仕えるしもべ」に当たるギリシア語は、同じ主人に属して仕える者という意味を含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: 私のことをすべて
  rationale: τὰ κατ’ ἐμέはパウロの身の上、事情、近況など、彼に関する事柄を広く指す。「私のことをすべて」はπάνταの包括性を保ちつつ、対象を近況だけに限定しない自然な日本語である。
- source_word: γνωρίσει
  choice: 知らせます
  rationale: γνωρίζωの未来形で、「知るようにする、知らせる」の意。日本語では「知らせます」が明瞭で自然であり、未来の行為は文脈上十分に表される。
- source_word: Τυχικὸς
  choice: ティキコ
  rationale: 人名を日本語の標準的な音写慣行に従って表記した。
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: 愛する兄弟
  rationale: ἀγαπητόςの親愛とἀδελφόςの信仰共同体における関係を、現代日本語で自然かつ品位ある形にした。
- source_word: πιστὸς διάκονος
  choice: 忠実な奉仕者
  rationale: διάκονοςは一般的な奉仕者・仕える者を指し得るほか、文脈によっては教会の職務名にもなり得る。ここでは特定の職制と断定せず、πιστόςと合わせて「忠実な奉仕者」とした。
- source_word: σύνδουλος
  choice: 共に仕えるしもべ
  rationale: σύνδουλοςは、同じ主人に属して仕える仲間を表す。「共に仕える」に共同性を、「しもべ」に従属して仕える関係を反映しつつ、「仲間の奴隷」という不自然さと現代的な誤解を避けた。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡に特徴的な、主との関係またはその領域を示す表現。「主にあって」は神学的な含みを狭めずに保つ。
theological_decisions:
- issue: σύνδουλοςに含まれる従属・隷属の表現
  choice: 共に仕えるしもべ
  alternative: 仲間の奴隷／共に仕える者
  rationale: 語の構成にはδοῦλοςの隷属的な意味があるが、日本語の「奴隷」は現代の制度的・非人道的含意を強く前面に出しやすい。「共に仕えるしもべ」は、主に属して共同で仕えるという関係を本文で示し、より字義的な可能性を脚注に残す。
- issue: ἐν κυρίῳの修飾範囲
  choice: 「共に仕えるしもべ」に隣接させつつ、連続する推薦表現全体にも読める語順
  alternative: 「主にある忠実な奉仕者、また仲間のしもべ」
  rationale: ギリシア語ではἐν κυρίῳが列挙の末尾にあり、直前のσύνδουλοςとの結び付きが強い一方、ティキコの奉仕全体を特徴づけるとも読める。日本語でも範囲を過度に限定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、推薦の温かさと書簡としての品位を保った。「しもべ」は日常語ではないが、ここでは主に属して仕える関係を簡潔に示す語として用い、「共に仕える」を添えて意味を明らかにした。
