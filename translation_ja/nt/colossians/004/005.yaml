  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: ja
  text: 外部の人々[a]に対しては、知恵をもって歩み、好機を十分に生かしなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外部の人々」とは、信じる者の共同体の外にいる人々のこと。
    reason: lexical_alternative
  - marker: b
    text: 直訳「時を買い取って」。ここでは、好機を十分に活用するという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: 知恵をもって
  rationale: 前置詞句が行動の仕方を表すことを自然な現代日本語で示しつつ、σοφίαの名詞としての倫理的な重みを保つ。
- source_word: περιπατεῖτε
  choice: 歩み
  rationale: パウロが生き方を表すために用いる比喩を保持する。「振る舞いなさい」より形式的に原文に近く、日本語の聖書文体でも理解可能である。
- source_word: πρὸς τοὺς ἔξω
  choice: 外の人々に対しては
  rationale: πρόςが示す対人関係上の方向・態度を「に対して」で表し、τοὺς ἔξωを共同体の外にいる人々として訳す。誰を指すかは脚注で明示する。
- source_word: τὸν καιρόν
  choice: あらゆる機会
  rationale: καιρόςは抽象的な時間よりも、ふさわしい時・好機を表す。この連語では日本語として「機会」が意味を明確に伝える。定冠詞を含む単数形は、機会を余さず用いるという慣用的な全体性を「あらゆる」で表した。
- source_word: ἐξαγοραζόμενοι
  choice: 生かしなさい
  rationale: 分詞は主命令に伴う勧告として機能し、ここでは好機を最大限に用いる意味である。「買い取る」という商業的比喩の直訳や、救済論的に聞こえ得る「贖う」を本文では避け、その字義は脚注に残す。
theological_decisions:
- issue: ἐξαγοραζόμενοιを救済論的に読み込む可能性
  choice: 外の人々との関係で、与えられた機会を賢く十分に用いるよう勧める表現
  alternative: 「時を贖う」と直訳し、贖罪・救済の含意を想起させる表現
  rationale: この文脈の動詞は、好機を確保して最大限に活用する慣用的意味であり、贖罪についての教理的主張をしているわけではない。
- issue: τοὺς ἔξωが指す範囲
  choice: 信じる者の共同体の外にいる人々
  alternative: 単に空間的に外にいる人々
  rationale: 定冠詞付きの「外の者たち」は、初期キリスト教の用法では共同体外の人々を指す。ただし本文では簡潔な「外の人々」を保ち、説明を脚注に置く。
translation_notes:
  register: 明快で品位ある現代標準日本語。「歩む」によって原文の生活比喩を保ち、「知恵をもって」で自然さと形式性を両立させた。脚注記号は本文の該当文末に置いた。
