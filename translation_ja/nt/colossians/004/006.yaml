source:
  edition: SBLGNT
  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: ja
  text: あなたがたのことばは、いつも恵みに満ち[a]、塩で味つけされたもの[b]となるようにしなさい。一人ひとりにどのように答えるべきかが分かるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「いつも思いやり深く」。ここで「恵み」は、親切さや好意に特徴づけられた話し方を表すことができます。
    reason: lexical_alternative
  - marker: b
    text: 「塩で味つけされた」は比喩で、話し方がふさわしく、心に届き、知恵あるものであることを表します。味気ない、あるいは人を損なう話し方ではない、という含みがあります。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: あなたがたのことば
  rationale: この文脈では、個々の単語ではなく、信者の話し方や発言全般を指す。「ことば」は自然な日本語で、後半の「答える」ともよくつながる。
- source_word: πάντοτε ἐν χάριτι
  choice: いつも恵みに満ち
  rationale: ἐν χάριτι は、ことばが親切さや好意に特徴づけられることを表し得る一方、パウロ書簡における「恵み」の響きも保つ。「恵みに満ち」はその両義性をある程度残す。
- source_word: ἅλατι ἠρτυμένος
  choice: 塩で味つけされた
  rationale: 塩の比喩を保持し、完了受動分詞が示す、味つけされた状態を自然に表す。
- source_word: εἰδέναι
  choice: そうすれば、…分かります
  rationale: 統語上解釈の難しい不定詞を、先行する勧告の結果として自然な日本語にした。ただし目的とも理解できるため、その可能性は注記する。
- source_word: πῶς δεῖ
  choice: どう…べきか
  rationale: δεῖ が表す必要性・ふさわしさを、過度に強くせずに明確に示す。
- source_word: ἑνὶ ἑκάστῳ
  choice: 一人ひとりに
  rationale: 各個人に応じて答えるという分配的な強調を、自然な日本語で保持する。
- source_word: ἀποκρίνεσθαι
  choice: 答える
  rationale: 対話の中で返答することを指す最も直接的な訳語。
theological_decisions:
- issue: ἐν χάριτι の意味範囲
  choice: 恵みに満ち
  alternative: 親切で／思いやりがあり
  rationale: 対人的な優しさだけに限定せず、神の恵みとの響きも排除しない表現を選んだ。
- issue: εἰδέναι の前文との関係
  choice: 結果を表す「そうすれば」
  alternative: 目的を表す「…分かるためです」または単純な「…分かるように」
  rationale: 不定詞の統語関係には幅がある。本文では日本語として明瞭な結果表現を採用しつつ、注で目的の可能性を示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「味つけ」は日常的に理解しやすく、原文の塩の比喩も保持する。節の命令的性格は「…ようにしなさい」で表した。
