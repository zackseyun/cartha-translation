revisions:
- from: あなたがたのことばが、いつも恵みに満ち[a]、塩で味つけされたものであるようにしなさい。そうすれば、一人ひとりにどう答えるべきかが分かります。
  to: あなたがたのことばは、いつも恵みに満ち[a]、塩で味つけされたもの[b]となるようにしなさい。一人ひとりにどのように答えるべきかが分かるように。
  rationale: 原文の語順と比喩を保ちながら、日本語として不自然な名詞述語の連結を整えた。末尾は「そうすれば」を除き、「…分かるように」とした。これにより εἰδέναι が示す目的・結果の解釈上の幅を不必要に狭めず、命令の聞き手にふさわしい一貫した文体となる。
