  naturalness: 「あなたがたのことばが、…ものであるようにしなさい」は理解できるものの、やや重い。主題を保ったまま「あなたがたのことばは、…ものとなるようにしなさい」とすると、現代標準語としてより滑らかである。
  terminology: 「恵み」は ἐν χάριτι のパウロ的な響きと対人的な graciousness の両方を保てる。「塩で味つけされた」は比喩を保持する自然な表現である。英語監査資料にある塩の比喩の注を追加し、本文アンカーも付す。
