  source_fidelity: 本文はSBLGNTの読み（γνῶτε τὰ περὶ ἡμῶν）を正しく反映し、ティキコを遣わした二つの目的、すなわち読者がパウロたちの状況を知ることと、ティキコが読者の心を励ますことを保持している。写本異読の脚注も本文の読みと適切に対照している。
  naturalness: 「すなわち」を挟み、「知り、彼が…励ますためです」とする現行文は意味は通るが、目的節内で主語が切り替わる箇所としてやや引っかかる。説明語を除き、二つの目的をそのまま並列するほうが明瞭で自然である。
  terminology: 「遣わした」「あなたがた」「私たちの様子」「心を励ます」は、現代標準日本語として理解しやすく、原文の語調と意味領域にもよく対応する。「心」は καρδίας の聖書的・比喩的表現を不必要に解釈しすぎず保持している。
