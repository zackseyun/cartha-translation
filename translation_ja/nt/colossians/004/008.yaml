  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ja
  text: 私が彼をあなたがたのもとに遣わしたのは、まさにこのためです。あなたがたが私たちの様子を知り[a]、彼があなたがたの心を励ますためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちがあなたがたの様子を知り」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: 彼を
  rationale: 前節のティキコを指す男性単数対格の関係代名詞。日本語では文を組み替え、「彼を」と明示するのが自然。
- source_word: ἔπεμψα
  choice: 私が…遣わした
  rationale: アオリスト直説法を素直な過去として訳した。「送った」も可能だが、人を使命をもって派遣する文脈にふさわしい「遣わした」を採用。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのもとに
  rationale: 派遣の方向・相手を表す。現代日本語として自然であり、複数の読者への呼びかけも明確。
- source_word: εἰς αὐτὸ τοῦτο
  choice: まさにこのため
  rationale: αὐτὸ τοῦτοの強調を「まさに」で表し、目的を明瞭にした。
- source_word: ἵνα
  choice: すなわち…ため
  rationale: 目的節を導く機能を保ちつつ、先行する「このため」の内容を自然に説明する構文とした。
- source_word: γνῶτε
  choice: あなたがたが…知り
  rationale: ἵναに従うアオリスト接続法の目的を表現。「知る」は意味を狭めず、本文の読みを明確に保つ。
- source_word: τὰ περὶ ἡμῶν
  choice: 私たちの様子
  rationale: パウロと同行者たちに関する事情や近況を指す慣用句。「私たちの様子」は自然で個人的な響きを保つ。
- source_word: παρακαλέσῃ
  choice: 彼が…励ます
  rationale: 慰める、勧める、力づけるという語義範囲のうち、この使者の訪問と近況報告の文脈には「励ます」が最も広く適合する。
- source_word: τὰς καρδίας ὑμῶν
  choice: あなたがたの心
  rationale: 聖書的な身体・内面表現を保持しつつ、日本語では集合的な単数形「心」が自然。
theological_decisions:
- issue: 目的節における本文異読
  choice: SBLGNTのγνῶτε τὰ περὶ ἡμῶνに従い、「あなたがたが私たちの様子を知り」とする。
  alternative: 「私たちがあなたがたの様子を知り」とする写本異読。
  rationale: 指定された原語本文を本文に採用する一方、知る主体と対象が逆になる重要な異読を脚注に残し、本文伝承上の曖昧さを明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「遣わす」「心を励ます」という聖書本文にふさわしい端正な語調を保った。原文の目的構造は「まさにこのためです。すなわち…ためです」として明示した。
