  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: ja
  text: 愛されている医師ルカとデマスが、あなたがたによろしくと言っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: よろしくと言っています
  rationale: 書簡の挨拶の定型表現として、自然な現代日本語で、同席する者から挨拶を伝える意味を表す。ギリシア語では単数動詞だが、後置された複合主語を日本語ではまとめて受ける。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: 二人称複数で、コロサイの受取人たちを集合的に指すことを明示する。
- source_word: Λουκᾶς
  choice: ルカ
  rationale: 日本語聖書で定着した人名表記を用いる。
- source_word: ἰατρὸς
  choice: 医者
  rationale: 一世紀の職業を指す語として意味を正確に保ちつつ、現代の一般読者に自然で分かりやすい語を選ぶ。
- source_word: ἀγαπητὸς
  choice: 愛する
  rationale: ルカに対する愛情と高い評価を、簡潔で自然な日本語として表す。
- source_word: καὶ
  choice: と
  rationale: ルカとデマスを挨拶の送り手として並列する日本語の助詞。
- source_word: Δημᾶς
  choice: デマス
  rationale: 日本語聖書で定着した人名表記を用いる。
theological_decisions:
- issue: 「愛する」（ὁ ἀγαπητός）が修飾する範囲
  choice: 「愛する医者」はルカだけを説明する。
  alternative: 日本語の語順や読点によっては、愛されているとの説明がデマスにも及ぶように読ませる。
  rationale: ギリシア語の Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς は、二つの冠詞付き同格表現によってルカを「医者」「愛する者」と説明しており、デマスは καὶ で別に並置される。
translation_notes:
  register: 明瞭で自然な現代標準日本語。書簡の挨拶として「よろしくと言っています」を用い、親しみを保ちながらも口語的になりすぎない調子とした。
