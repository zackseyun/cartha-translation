reference: Colossians 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: ja
  text: この挨拶は、私パウロが自分の手で書いたものです。[a] 私の鎖を覚えていてください。[b] 恵みがあなたがたと共にありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「挨拶は、私、パウロ自身の手で」。手紙の結びの挨拶をパウロ自身が自筆で書いたことを指します。
    reason: 原文の省略的な言い回しと、自筆で記したことを示すため。
  - marker: b
    text: 別訳「私の投獄を覚えていてください」「私の束縛を覚えていてください」。直訳は「私の鎖」です。
    reason: δεσμοίの具体的な意味を本文に保ちつつ、拘禁を指す換喩としての用法も示すため。
lexical_decisions:
- source_word: ἀσπασμός
  choice: 挨拶
  rationale: 手紙末尾の結びの挨拶を指す。現代日本語で自然かつ書簡の文脈に合う。
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: 私パウロが自分の手で書いています
  rationale: 動詞の省略されたギリシア語を日本語として補い、パウロ本人の筆跡による結びであることを明確に表す。
- source_word: μνημονεύετέ
  choice: 覚えていてください
  rationale: 現在命令形の継続的な含みを、過度に強調せず自然な日本語で表す。
- source_word: μου τῶν δεσμῶν
  choice: 私が鎖につながれていること
  rationale: δεσμοίの具体的な『鎖』のイメージを保ちつつ、それが拘禁状態を指すことが自然に伝わる形にした。
- source_word: ἡ χάρις
  choice: 恵み
  rationale: 何の恵みかを原文以上に限定せず、パウロ書簡の祝祷表現として簡潔に訳す。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたと共にありますように
  rationale: 無動詞の祝祷文に、日本語で自然な願望表現を補った。ὑμῶνの複数も『あなたがた』で明示した。
theological_decisions:
- issue: 動詞を欠く結びの祝祷
  choice: 恵みがあなたがたと共にありますように
  alternative: 恵みがあなたがたと共にあるように
  rationale: 原文には動詞がないが、日本語の祝祷として自然になるよう願望表現を補った。恵みの主体は原文で明示されないため付加しない。
- issue: 鎖の比喩と拘禁状態
  choice: 私が鎖につながれていること
  alternative: 私の投獄／私の鎖
  rationale: 具体的な鎖の像と、投獄を指す換喩の両方を本文で伝え、どちらか一方に狭めない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、書簡末尾にふさわしい簡潔で品位ある調子と、原文の具体的な『鎖』のイメージを保った。
