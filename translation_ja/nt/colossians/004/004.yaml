translation:
  language: ja
  text: 私が語るべき[b]とおりに、それを明らかにできる[a]ようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それを明らかにする」または「それを知らせる」。「それ」は前節の「キリストの奥義」を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私が語らなければならないとおりに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ～ようにするためです
  rationale: 目的を表す接続詞として、前節から続く祈りの目的を自然な日本語で示した。
- source_word: φανερώσω
  choice: 明らかに示せる
  rationale: 「現す」「明らかにする」「知らせる」という意味範囲を踏まえ、宣教の文脈に合う明瞭な表現とした。接続法は目的構文の中で「～できるように」と表した。
- source_word: αὐτό
  choice: それを
  rationale: 直前の「キリストの奥義」を指す代名詞であるため、ギリシア語どおり代名詞を保った。
- source_word: ὡς
  choice: ～とおりに
  rationale: 語る際の仕方または基準を示す語として訳した。
- source_word: δεῖ
  choice: 語るべき
  rationale: 必要性・義務を表す。日本語では「～しなければならない」より簡潔で、この文脈にふさわしい「べき」を選んだ。
- source_word: με
  choice: 私が
  rationale: δεῖに伴う不定詞の意味上の主語であるため、自然な日本語の主格で表した。
- source_word: λαλῆσαι
  choice: 語る
  rationale: 広い意味の「話す／語る」を保ち、「宣べ伝える」のような文脈上の限定を本文に加えなかった。
theological_decisions:
- issue: αὐτόの指示内容
  choice: 本文では「それ」とし、前節の「キリストの奥義」を指すことを注で示す
  alternative: 本文で「その奥義」と明示する
  rationale: 文脈上の指示対象は明確だが、原文が代名詞を用いていることを尊重し、本文では明示しすぎないようにした。
- issue: δεῖが表す必要性の強さ
  choice: 「語るべき」
  alternative: 「語らなければならない」
  rationale: 神的使命に由来する必要性も含み得るが、原文だけでその性質を限定せず、義務と適切さの両方を表し得る訳語を選んだ。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある標準的な文体とした。前節に従属する目的節であることを示すため文末を「ためです」とし、原文の代名詞と必要性の含みを保った。
