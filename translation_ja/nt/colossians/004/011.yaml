id: COL.4.11
reference: Colossians 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: ja
  text: また、ユストと呼ばれるイエスもいます。割礼を受けた人たちの中で、神の国のための同労者なのは、この人たちだけです[a]。彼らは私にとって慰めとなりました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の国のための同労者のうち、割礼を受けた人たちはこの人たちだけです」。
    reason: 「割礼を受けた人たち」と「この人たちだけが同労者」との係り受けには、別の捉え方も可能であるため。
  - marker: b
    text: 「慰め」は「励まし」とも訳せます。また、「慰めとなりました」は「慰めとなってくれました」「慰めでありました」とも訳せます。
    reason: παρηγορίαには「慰め」「励まし」の意味幅があり、ἐγενήθησανは文脈上「なった」または「そうであった」と表現しうるため。
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: ユストと呼ばれるイエス
  rationale: 新約聖書で定着した人名「イエス」を用い、別名またはローマ名を示す分詞表現を自然に保持した。
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: 割礼の者たちの中で
  rationale: 直訳的な「割礼からの者たち」は日本語では不自然なため、ユダヤ人としての背景を指す表現を保ちつつ、οὗτοι μόνοιとの関係が明瞭になるよう「中で」とした。
- source_word: οὗτοι μόνοι
  choice: この人たちだけです
  rationale: 特定の集団内における排他性を明確に表す、自然な現代日本語とした。
- source_word: συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国のために共に働いている
  rationale: συνεργοίを働きの同労者という意味で動詞的に表し、εἰςの奉仕・目的の方向を「ために」で示した。
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: 彼らは私にとって慰めとなりました
  rationale: γίνομαιのアオリストを「となりました」で反映し、παρηγορίαの主要義である慰めを採った。
theological_decisions:
- issue: 「割礼の者たち」が指す範囲
  choice: ここに挙げられた同労者たちを含む、ユダヤ的背景を持つ人々
  alternative: 特定の「割礼派」、または信仰の有無を問わないユダヤ人一般
  rationale: 文脈では神の国のための同労者が列挙されているが、句そのものを「ユダヤ人信者」や「割礼派」と断定せず、原文の身分標識を保った。
- issue: μόνοιが限定する範囲
  choice: 割礼の者たちの中で、この人たちだけがパウロの同労者である
  alternative: パウロの同労者全体のうち、この人たちだけが割礼の者である
  rationale: 原文はまずοἱ ὄντες ἐκ περιτομῆςを提示し、続くοὗτοι μόνοι συνεργοίがその集団内での限定を示すと読むのが構文上自然である。ただし別の係り受けも脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら手紙本文にふさわしい品位を保った。「同労者」という教会内の専門語を避け、「共に働いている」として一般読者にも理解しやすくした。節が前節から続く列挙であることを「また」で示した。
