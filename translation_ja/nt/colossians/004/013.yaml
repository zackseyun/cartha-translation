  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: ja
  text: というのも、私は、彼があなたがたのために、またラオディキアにいる人々とヒエラポリスにいる人々のために、大変な労苦をしている[a]ことを証言します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大いに骨を折っている」「深く心を砕いている」「激しい苦悩を抱いている」とも訳せる。ギリシア語は骨の折れる労苦を表し、この文脈では、そこから強い心遣いをも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: 証言します
  rationale: 現在能動直説法一人称単数を直接的に表し、パウロ自身による確かな証言であることを保った。
- source_word: γὰρ
  choice: 実際
  rationale: 前節のエパフラスについての叙述を裏づける説明的な接続を、現代日本語で自然に示した。
- source_word: αὐτῷ ... ὅτι
  choice: 彼が……ことを証言します
  rationale: αὐτῷはエパフラスについて好意的な証言をすることを示す。日本語では、その人物をὅτι節の主語「彼」として明示する構文が自然であり、証言の対象と内容の双方を表せる。
- source_word: ἔχει πολὺν πόνον
  choice: 並々ならぬ労苦をしている
  rationale: 直訳的な「多くの労苦を持つ」を避けつつ、πόνοςの基本的な意味である骨の折れる働き・苦労を保った。「並々ならぬ」はπολύνの強さを自然に表す。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのために
  rationale: ὑπέρが示す、受益者のための働きや配慮を簡潔に表した。複数形は「あなたがた」で明示した。
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ラオディキアにいる人々
  rationale: 冠詞と前置詞句が指す現地の人々を、解釈を加えず自然に表した。
- source_word: τῶν ἐν Ἱεραπόλει
  choice: ヒエラポリスにいる人々
  rationale: 直前のラオディキアとの並行を保ち、地名を標準的に音写した。
theological_decisions:
- issue: エパフラスの働きに関する πόνος の意味
  choice: 並々ならぬ労苦
  alternative: 深い心遣い／激しい苦悩
  rationale: 直前の4章12節には祈りにおける奮闘があるため、強い心配や苦悩を含む可能性はある。しかし、πόνοςのより基本的な意味は労苦・骨折りであるため、本文では意味を感情面だけに限定せず、文脈上の広がりを脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、厳粛さを保ちながら過度に文語的な表現を避けた。「並々ならぬ労苦をしている」は原文の強調と具体的な骨折りを自然に伝える。
