id: COL.4.12
reference: Colossians 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: ja
  text: あなたがたの仲間であるエパフラスが、あなたがたにあいさつを送っています。彼はキリストのしもべであり、あなたがたが神のみこころのすべてにおいて、成熟し、十分に確信して[a]立つことができるようにと、いつも祈りの中であなたがたのために力を尽くしています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十分に確信して」は、「十分に確立されて」とも訳せる。
    reason: πεπληροφορημένοιは、十分な確信の状態を表すとも、十分に確立された状態を表すとも理解できるため。
lexical_decisions:
- source_word: ἀσπάζεται ὑμᾶς
  choice: あなたがたによろしくと言っています
  rationale: 書簡末尾の挨拶として、現代日本語で自然かつ個人的な挨拶の力を保つ表現。
- source_word: ὁ ἐξ ὑμῶν
  choice: あなたがたの仲間である
  rationale: エパフラスがコロサイ共同体に属する者であることを、明瞭で自然な日本語で示す。
- source_word: δοῦλος Χριστοῦ
  choice: キリストのしもべ
  rationale: δοῦλοςの所属と全面的な献身を含ませつつ、日本語の聖書文体で理解しやすい「しもべ」を採用した。Χριστοῦには原文にἸησοῦがないため「キリスト」とした。
- source_word: πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν
  choice: いつも…あなたがたのために力を尽くしています
  rationale: ἀγωνίζομαιが表す強い努力や奮闘を保ち、祈りにおける熱心な働きを自然に表現する。
- source_word: ἐν ταῖς προσευχαῖς
  choice: 祈りの中で
  rationale: 複数形が示しうる繰り返しの祈りを文脈上「いつも」で補い、簡潔で自然にした。
- source_word: ἵνα σταθῆτε
  choice: 立つことができるよう
  rationale: 受動形にありうる「立たされる／確立される」という含みを過度に限定せず、原文の「立つ」という像を保持する。
- source_word: τέλειοι
  choice: 成熟した者として
  rationale: この文脈では無欠の完全さより、信仰上の成熟・全き状態を指すと考えられるため。
- source_word: πεπληροφορημένοι
  choice: 十分な確信をもって
  rationale: 完了受動分詞が表す、十分に確信した状態を自然な日本語にした。別の語義可能性は脚注に残す。
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: 神のすべてのみこころのうちに
  rationale: ἐνの関係を同調・内容・領域のいずれか一つに狭めず、原文の幅を保つ表現。
theological_decisions:
- issue: δοῦλοςの訳語
  choice: しもべ
  alternative: 奴隷
  rationale: 語の強い隷属・所属の意味は認めつつ、日本語本文では宗教的献身を自然に伝える「しもべ」を用いた。「奴隷」は社会制度上の響きが前面に出すぎる可能性がある。
- issue: Χριστοῦの訳し方
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςが称号に由来することを踏まえつつ、現代日本語で定着した称号「キリスト」を採用した。原文には「イエス」がないため補わない。
- issue: πεπληροφορημένοιの意味
  choice: 十分な確信をもって
  alternative: 十分に確立されて
  rationale: 確信・確証の語義を本文に採用する一方、状態的に「十分に確立された」と取る可能性を脚注で明示し、解釈上の幅を保つ。
- issue: σταθῆτεの態
  choice: 立つことができるよう
  alternative: 確立されるよう
  rationale: 形態はアオリスト受動だが、ἵστημιの受動形は自動詞的な「立つ」の意味でも用いられる。日本語では像を保持しつつ不自然な受動表現を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「みこころ」「しもべ」によって穏やかな聖書的品位を保った。一文が過度に長くならないよう挨拶部分を分け、祈りの目的節との論理関係は明示した。
