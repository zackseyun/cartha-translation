id: COL.4.1
reference: Colossians 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: ja
  text: 主人たちよ、奴隷たちに、正しく公平な扱いをしなさい。[a] あなたがたにも天に主がおられることを知っているのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正しいことと平等を与えなさい」とも訳せる。「公平」と訳したギリシア語には、「平等」「公正」の意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: 主人である人たち
  rationale: 家庭訓の文脈で、奴隷に対する人間の主人を指す。「主人たち」より自然で、天におられる「主」とも区別できる。
- source_word: τὸ δίκαιον καὶ τὴν ἰσότητα
  choice: 正しく公平な扱い
  rationale: 二つの名詞的表現を、奴隷への待遇を命じる自然な日本語としてまとめた。δίκαιονの正しさとἰσότηςの公平・平等の含意を保つ。
- source_word: τοῖς δούλοις
  choice: 奴隷たちに
  rationale: 主人との社会的・法的関係が明示されているため、「僕」や「使用人」として制度の拘束性を弱めず、「奴隷」と訳す。
- source_word: παρέχεσθε
  choice: 扱いをしなさい
  rationale: 目的語が正しさと公平さであるため、日本語では「正しく公平な扱いをする」とするのが明瞭で自然。命令の力も保持する。
- source_word: εἰδότες
  choice: 知っているのですから
  rationale: 分詞が命令の根拠を示す含みを自然な日本語で表した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたにも
  rationale: 地上の主人たち自身も権威の下にあるというκαίの強調を「にも」で表す。
- source_word: κύριον ἐν οὐρανῷ
  choice: 天に主
  rationale: κύριοςの神学的重みを「主」で保ち、人間の主人と区別する。ἐν οὐρανῷは自然な「天に」とした。
theological_decisions:
- issue: δοῦλοιの社会的身分
  choice: 奴隷たち
  alternative: 僕たち／使用人たち
  rationale: 主人と奴隷の関係そのものが論点であり、拘束された身分を曖昧にしないため。
- issue: ἰσότηταの意味範囲
  choice: 公平な扱い
  alternative: 平等な扱い
  rationale: 文脈上は公正で公平な待遇が自然だが、語には「平等」の可能性もあるため、本文で一義的に消さず脚注に示す。
- issue: 人間のκύριοιと天のκύριοςの訳し分け
  choice: 主人である人たち／主
  alternative: 主人たち／天の主人
  rationale: 原文の語の反復による権威関係は文脈で伝えつつ、天上のキリストへの称号としての「主」を保持する。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある命令文。「主人である人たち」として呼びかけを自然にし、「奴隷」は歴史的関係を婉曲化せず訳した。脚注記号[a]は該当句の直後に置いた。
