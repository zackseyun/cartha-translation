id: COL.4.16
reference: Colossians 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: ja
  text: この手紙があなたがたの間で読まれたら、ラオディキアの教会でも読まれるようにしてください。そしてあなたがたも、ラオディキアからの手紙[a]を読んでください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「ラオディキアからのもの」で、「手紙」は文脈から補われている。この手紙の正体は不明であり、ラオディキア宛ての手紙とは限らない。ラオディキアにあって、そこから届けられる手紙を指す可能性もある。
    reason: historical_and_lexical_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: 読まれた／読んでください
  rationale: ἀναγινώσκωは「読む」を意味し、ここでは集会での朗読が想定される可能性が高い。ただし語そのものに「声に出して」「公に」を必ず明示する要素はないため、本文では自然な「読む」とした。
- source_word: παρ’ ὑμῖν
  choice: あなたがたのところで
  rationale: παρά＋与格の場所的・社会的な意味を表し、コロサイの信徒共同体内で手紙が読まれることを自然な現代日本語で示す。
- source_word: ἡ ἐπιστολή
  choice: この手紙
  rationale: 定冠詞は今送られている本書を指す。日本語では指示性を明らかにした「この手紙」が自然である。
- source_word: ποιήσατε ἵνα
  choice: ～ようにしてください
  rationale: 結果が実現するよう求める命令の力を、直訳的な「行いなさい」ではなく自然な依頼・命令表現で伝える。
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: ラオディキアの人々の教会で
  rationale: Λαοδικέωνを「ラオディキアの人々」と取り、属格を保ちながら、ἐκκλησίαをパウロ書簡で一般的な「教会」と訳した。
- source_word: τὴν ἐκ Λαοδικείας
  choice: ラオディキアからの手紙
  rationale: ギリシア語では直前のἐπιστολήを受けて名詞が省略されているが、日本語で「ラオディキアからのもの」とすると不自然で指示対象も曖昧になるため、「手紙」を補った。ἐκの基本的な方向性である「から」を保持した。
theological_decisions:
- issue: 「ラオディキアからの手紙」の正体
  choice: 既知の文書と同定せず、「ラオディキアからの手紙」と中立的に訳す。
  alternative: ラオディキア宛てのパウロ書簡、ラオディキアから送られた書簡、またはエフェソの信徒への手紙を含む巡回書簡と解する。
  rationale: 本文はその文書とラオディキアとの関係をἐκ（「から」）で示すだけで、宛先、著者、現存文書との同一性を特定していないため、歴史的推定を本文に持ち込まない。
translation_notes:
  register: 明快で現代的ながら、使徒的な指示にふさわしい落ち着いた文体とした。「朗読」ではなく「読む」を用いて、集会での公的朗読という文脈上の含意を保ちつつ、原語以上に限定しないようにした。
