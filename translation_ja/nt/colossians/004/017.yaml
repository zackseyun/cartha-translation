id: COL.4.17
reference: Colossians 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: ja
  text: また、アルキポにこう伝えてください。「主にあって受けた務め[a]を全うするよう、よく心を配りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主から受けた務め」とも訳せる。
    reason: ἐν κυρίῳは字義的には「主にあって」だが、文脈上「主から」という起源の意味を含む可能性があるため。
lexical_decisions:
- source_word: εἴπατε
  choice: 伝えてください
  rationale: 会衆に向けたアオリスト命令法複数。日本語では、アルキポへの言葉を取り次ぐよう求める命令を、自然で明確な敬体で表した。
- source_word: Ἀρχίππῳ
  choice: アルキポ
  rationale: 人名を日本語聖書で一般的な形に音写した。
- source_word: Βλέπε
  choice: よく心を配りなさい
  rationale: 現在命令法単数で、注意を払い続けるよう促す用法。単なる視覚ではなく、託された務めへの継続的な配慮を表す。
- source_word: διακονίαν
  choice: 務め
  rationale: 奉仕、務め、委ねられた役割を指し得る。特定の教会職に限定せず、主に関わる委託された奉仕を自然な日本語で表した。
- source_word: παρέλαβες
  choice: 受けた
  rationale: 自ら選んだのではなく、務めを受領したことを簡潔に保つ。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 前置詞ἐνの基本的な関係性を保ち、主との結びつき・領域を示しつつ、厳密に『主から』という起源だけに限定しない。
- source_word: ἵνα
  choice: 〜するよう
  rationale: 目的を導く接続詞の働きを、自然な現代日本語で表した。
- source_word: πληροῖς
  choice: 全うする
  rationale: 委ねられた務めを十分に遂行し、完成に至らせる意味を簡潔に表す。
theological_decisions:
- issue: ἐν κυρίῳのニュアンス
  choice: 本文では「主にあって」とした。
  alternative: 「主から」
  rationale: ἐνは、アルキポが主との関係の中で務めを受けたことを表し得る一方、文脈上、その務めの究極的な出所が主であるとの含みも持ち得る。本文ではギリシア語の関係的・領域的な表現を保ち、起源の意味だけに限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語の敬体を用い、引用内の勧告は dignified で直接的な命令形とした。「奉仕職」など制度的に限定されやすい語を避け、「務め」で広がりを保った。
