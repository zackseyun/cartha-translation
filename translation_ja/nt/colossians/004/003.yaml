id: COL.4.3
reference: Colossians 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: ja
  text: 同時に、私たちのためにも祈ってください。神が私たちに、みことばを語るための扉を開いてくださるように。すなわち、メシアの奥義を語るためです。この奥義のために、私は捕らわれの身となっています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「みことばを語るための扉」は、「みことばを語る機会」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「捕らわれの身となっています」は、「鎖につながれています」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: また同時に、私たちのためにも祈ってください
  rationale: 前節から続く現在分詞を、日本語では前節の命令を受けた勧めとして自然に表現した。ἅμα καὶの同時性と追加の意味は「また同時に」「にも」で保持した。
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου
  choice: 神が私たちにみことばのための扉を開き
  rationale: ἵνα節を祈りの内容として表し、θύραの比喩を「扉」として残した。λόγοςは宣べ伝えられる福音のことばを指すため、本文では簡潔で聖書的な「みことば」とした。
- source_word: λαλῆσαι
  choice: 語らせてくださるように
  rationale: 開かれる扉の目的を示す不定詞。祈願を表す日本語の構文に合わせつつ、λαλέωの基本義「語る」を保った。
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: メシアの奥義
  rationale: μυστήριονは、かつて隠され今や啓示された神の御計画を指すパウロ的用法に合わせ「奥義」とした。Χριστόςはここで称号として機能するため「メシア」とした。
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: この奥義のために、私は捕らわれの身となっています
  rationale: διά＋対格の原因を「ために」で表し、関係代名詞の指示対象を「この奥義」と明示した。δέδεμαιの完了受動が示す現在の拘束状態を自然な日本語で表現した。
theological_decisions:
- issue: τοῦ Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この箇所のΧριστόςは固有名のように用いられるよりも称号として意味を担っているため、「メシア」とした。
- issue: θύραν τοῦ λόγουの比喩
  choice: みことばのための扉
  alternative: みことばを語る機会
  rationale: 宣教の機会を指す比喩だが、解釈的に言い換えず、原文の「扉」という像を本文に保持した。
- issue: δι’ ὃの先行詞
  choice: この奥義のために
  alternative: このことのために
  rationale: 文法上は直前の「メシアの奥義」を受けるのが最も自然であるため本文で明示したが、より広くその宣教内容を指す可能性は残る。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。前節から続く exhortation を独立して読める形に整えつつ、扉の比喩、奥義という神学的語彙、拘束状態を示す完了受動の含意を保持した。
