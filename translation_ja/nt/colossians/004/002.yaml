  yaml_path: translation/nt/colossians/004/002.yaml
  text: Devote yourselves to prayer[a], staying alert in it with thanksgiving,
translation:
  language: ja
  text: 祈りに専心し、感謝をもって祈りの中で目を覚ましていなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祈りを粘り強く続け、感謝をもってその中で目を覚ましていなさい。」
    reason: προσκαρτερεῖτε は「専心する」のほか「粘り強く続ける」とも訳せる。αὐτῇ（その中で）は祈りを指す。
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: 祈り
  rationale: 定冠詞付きの与格だが、特定の一つの祈りではなく祈りという営みを指すため、自然な日本語で「祈り」とした。
- source_word: προσκαρτερεῖτε
  choice: たゆまず
  rationale: 現在命令形が表す継続的な専心と忍耐を、命令全体に自然につながる「たゆまず祈り」で表した。
- source_word: γρηγοροῦντες
  choice: 目を覚ましていなさい
  rationale: 祈りに伴う警戒と注意深さを表す分詞。字義的な覚醒の響きを保ちつつ、霊的な油断のなさも伝わる慣用的な表現とした。
- source_word: ἐν αὐτῇ
  choice: （祈りにおいて）
  rationale: 代名詞は直前の「祈り」を指す。日本語では明示すると重くなるため、「たゆまず祈り、…目を覚まして」のつながりに含意させた。
- source_word: ἐν εὐχαριστίᾳ
  choice: 感謝をもって
  rationale: 祈りつつ目を覚ましている際の態度・伴うあり方を、自然で品位ある日本語で表した。
