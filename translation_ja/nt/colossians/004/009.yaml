  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: ja
  text: 忠実で愛する兄弟、オネシモも一緒です。彼はあなたがたの一人です。彼らは、こちらのすべての事情をあなたがたに知らせます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: オネシモも一緒です
  rationale: σύνの同伴の意味を自然な日本語で表し、前節のティキコにオネシモが同行することを示す。
- source_word: πιστῷ
  choice: 忠実な
  rationale: 信頼でき、信仰者として忠実であるという倫理的・関係的な意味を保つ。
- source_word: ἀγαπητῷ
  choice: 愛する
  rationale: 書簡に見られる温かな共同体的呼称として、現代日本語で自然かつ品位のある表現とした。
- source_word: ἀδελφῷ
  choice: 兄弟
  rationale: 男性の同信者を指す原文の家族的・教会共同体的表現を、説明的に膨らませず保持する。
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: 彼はあなたがたの仲間です
  rationale: 出身または共同体への帰属を示すἐξ ὑμῶνを、社会的身分などを付加せず自然に表す。
- source_word: γνωρίσουσιν
  choice: 知らせます
  rationale: 「知らせる、明らかにする」の意味を、現代日本語として簡潔に表現する。
- source_word: πάντα ... τὰ ὧδε
  choice: こちらの事情はすべて
  rationale: パウロのいる場所に関する事柄全般を指す表現として、原文にない具体的出来事を補わず自然に訳す。
theological_decisions:
- issue: ἀδελφῷの教会共同体的意味
  choice: 兄弟
  alternative: 信仰の兄弟
  rationale: 同信者を指すことは文脈上明らかだが、原文どおり家族的呼称を保ち、説明語を加えない。
- issue: ἐξ ὑμῶνが示す関係
  choice: あなたがたの仲間
  alternative: あなたがたのうちの一人／あなたがたのところの出身
  rationale: コロサイの共同体への帰属を自然に示しつつ、ピレモン書から社会的身分などの情報を持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語。書簡の温かさと品位を保ちながら、逐語的で不自然な語順を避けた。前節から続く断片的構文は、日本語では独立した文として補整した。
