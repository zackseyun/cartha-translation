  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: ja
  text: ラオディキアにいる兄弟たち、ニンファ[a]、そして彼女の家にある教会に、よろしくお伝えください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「ニンファスと、彼の家にある教会」とするものや、「彼らの家にある教会」とするものがあります。
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: アオリスト中態命令法二人称複数の挨拶を伝える命令。日本語の書簡末尾で自然かつ丁寧な表現とし、命令の力を保った。
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: ラオディキアにいる兄弟姉妹たち
  rationale: ἀδελφοὺςは文法上男性複数だが、パウロ書簡では男女を含む信徒仲間を指し得る。現代日本語でその包括的意味を明瞭に示した。
- source_word: Νύμφαν
  choice: ヌンファ
  rationale: SBLGNTのΝύμφανと女性単数代名詞αὐτῆςに従い、女性名として音写した。男性名とする異読は脚注に示した。
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: 彼女の家にある教会
  rationale: κατ’ οἶκονの慣用的な場所の意味を簡潔に表し、集会がその家で行われるという含意を過度に説明しなかった。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: この書簡文脈ではキリスト者の共同体を指す標準的で自然な訳語。
theological_decisions:
- issue: Νύμφανの性別と、それに対応する所有代名詞の本文異同
  choice: ヌンファ……彼女の家にある教会
  alternative: ヌンファス……彼の家にある教会／彼らの家にある教会
  rationale: 本文はSBLGNTの女性単数αὐτῆςに従う一方、男性単数および複数を支持する写本上の異読を脚注に残し、真正な本文上の不確かさを隠さない。
translation_notes:
  register: 明瞭で現代的な標準日本語。書簡末尾の挨拶として自然な丁寧さと、聖書本文にふさわしい落ち着いた格調を両立させた。脚注記号[a]は該当する節末に置いた。
