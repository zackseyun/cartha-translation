  text: In these things you too once walked[a], when you were living in them.
translation:
  language: ja
  text: あなたがたもかつて、これらのことの中で生きていたとき、それらの中を歩んでいました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたもかつて、これらのことの中で生きていたとき、これらのことの中を歩んでいました」。ギリシア語では、前半は関係代名詞で「それらの中で」と表現されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: そのような歩みを
  rationale: 関係代名詞は直前に挙げられた罪深い行いを指す。日本語で「これらの中を歩む」とすると不自然になりやすいため、比喩としての「歩み」を保ちながら、そうした行いに従った生活態度を自然に表した。より字義的な形は脚注に示した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: καίと明示された代名詞ὑμεῖςによる強調を、「も」によって簡潔に表した。
- source_word: περιεπατήσατε
  choice: 歩みをしていました
  rationale: περιπατέωが表す生き方・行動の比喩を保ち、後続のζάωとの語義上の区別も維持した。
- source_word: ποτε
  choice: かつて
  rationale: 現在とは異なる過去の時期を、格調を損なわない自然な現代日本語で示した。
- source_word: ὅτε
  choice: 時には
  rationale: 以前の行動と、その行動が属していた生活状態とを結ぶ時間関係を明確にした。
- source_word: ἐζῆτε
  choice: 生きていた
  rationale: 未完了過去が示す継続的な過去の状態を表し、περιπατέωの比喩的な「歩み」と区別した。
- source_word: ἐν τούτοις
  choice: これらの中で
  rationale: 直前に列挙された行いを指す指示語とἐνの領域的な表現を保ち、彼らがかつてそのような事柄を生活の場としていたことを示した。
theological_decisions:
- issue: 「歩む」と「生きる」の関係
  choice: 以前の行動様式を「歩み」、その行いの領域にあった継続的状態を「生きていた」と訳し分けた。
  alternative: 両方を「生きる」「生活する」などのほぼ同義の表現にする。
  rationale: περιπατέωとζάωという異なる動詞を反映し、パウロの重層的な倫理描写を保つ一方、そこに特定の教理的解釈を加えないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「歩み」というパウロ的な比喩を残した。「これら」は直前の文脈にある罪深い行いを受ける。語順は日本語として自然になるよう時間節を先に置いた。
