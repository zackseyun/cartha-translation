base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: ja
  text: 妻たちよ、主にあってふさわしいこととして[b]、自分の夫に従いなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自分の夫に服しなさい」。
    reason: lexical_alternative
  - marker: b
    text: 「主にあってふさわしかったこととして」とも訳せる。ギリシア語の動詞は形の上では過去を表すが、ここでは一般的・現在的な意味を持つと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: 妻たちよ
  rationale: 家庭内の関係を扱う文脈で、ἀνδράσιν と対になっているため、一般の「女性たち」ではなく「妻たち」を指す。呼びかけであることを自然な日本語の「よ」で表した。
- source_word: ὑποτάσσεσθε
  choice: 従いなさい
  rationale: 現在命令形が求める継続的な態度を、現代日本語で明瞭かつ自然に表す。「服しなさい」も可能だが、本文では過度に硬い表現を避けた。受け身の「従わせられなさい」という意味にはしていない。
- source_word: τοῖς ἀνδράσιν
  choice: 自分の夫に
  rationale: 家庭訓の文脈では ἀνήρ は「男性」ではなく「夫」を意味する。複数の妻それぞれとその夫との関係を明確にするため、「自分の」を補った。
- source_word: ὡς
  choice: ように
  rationale: ここでは明確な原因を示す「なぜなら」よりも、行為の基準・あり方を示す語として理解し、「ように」とした。
- source_word: ἀνῆκεν
  choice: ふさわしい
  rationale: 形態上は未完了過去だが、この勧告では一般的に妥当することを表す慣用的な用法と見て、現在的な「ふさわしい」とした。過去形の可能性は脚注に残した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 勧告のふさわしさを主との関係の中に位置づける表現として、簡潔で定着した「主にあって」を用いた。単なる一般的な社会規範には言い換えていない。
theological_decisions:
- issue: 勧告の範囲と根拠
  choice: 「主にあってふさわしいように」とし、夫に従うことへの勧告が主との関係によって位置づけられていることを保った。
  alternative: 文化上の一般原則として無条件に述べる、または「主にあって」を妻だけにかける。
  rationale: ギリシア語では ἐν κυρίῳ が「ふさわしい」という判断と密接に結びつく。本文以上の制限や教理を付け加えず、勧告と主への帰属との間にある神学的緊張をそのまま残した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい端正な文体とした。「妻たちよ」で直接の呼びかけを保ち、「従いなさい」は「服しなさい」より一般読者に理解しやすい表現とした。
