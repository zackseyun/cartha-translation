id: COL.3.6
reference: Colossians 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: ja
  text: こうしたことのゆえに、神の怒りが不従順の子ら[a][b]の上に臨もうとしています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「不従順の息子たち」。不従順を特徴とする人々を指す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「不従順の子らの上に」に当たる語句を含まない写本もある。
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: こうしたことのゆえに
  rationale: διάと対格の関係代名詞は原因を表す。直前に列挙された罪を複数として受けることが分かる、自然で格調ある表現とした。
- source_word: ἔρχεται
  choice: 下ろうとしています
  rationale: 現在形の進行・切迫した響きと終末的な方向性を表すため、「来ます」よりも、神の怒りが人々の上に臨むという日本語として自然な表現を採った。
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: 神の怒り
  rationale: ὀργήが持つ、単なる感情にとどまらない神の裁きとしての重みを、簡潔で定着した表現によって保った。
- source_word: ἐπὶ
  choice: の上に
  rationale: 対格を伴い、怒りが向かう対象を示す。裁きがその人々に臨むという原文の方向性を保った。
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: 不従順の子ら
  rationale: 「子ら」はυἱούςを反映しつつ、日本語でもある性質に属する者という聖書的な慣用表現として理解できる。意味は脚注で明示した。
theological_decisions:
- issue: 「不従順の子ら」という慣用句を保持するか、意味を本文で言い換えるか
  choice: 本文では「不従順の子ら」を保持する
  alternative: 神に従わない人々／不従順を特徴とする人々
  rationale: 原文のセム語的な属格表現と「子ら」という比喩を残しつつ、それが性別を限定する語ではなく、不従順を特徴とする人々を指すことを脚注で説明する。
- issue: ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείαςの本文上の不確かさ
  choice: 本文に含め、異読を脚注で示す
  alternative: 「不従順の子らの上に」を本文から省く
  rationale: 提示されたSBLGNTはこの句を本文に置きながら区切り記号で本文上の不確かさを示しているため、採用本文を訳し、写本上の相違を隠さず脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神の怒り」「不従順の子ら」という原文の神学的・比喩的な重みを保った。「下ろうとしています」により、怒りが臨みつつある切迫感を自然な日本語で表した。
