id: COL.3.5
reference: Colossians 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: ja
  text: ですから、地上にある肢体[a]を殺しなさい。すなわち、淫らな行い、汚れ、情欲、悪い欲望、そして貪欲[b]です。この貪欲は偶像礼拝です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのうちにある地上的なもの」。ギリシア語では、より直訳的に「地上にある肢体」。
    reason: lexical_alternative
  - marker: b
    text: 「貪り」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: 殺してしまいなさい
  rationale: 決然とした行為を命じるアオリスト命令形の強さを保ちつつ、現代日本語で明瞭に表した。
- source_word: οὖν
  choice: ですから
  rationale: 前段の議論から導かれる結論であることを、自然な現代日本語で示す。
- source_word: μέλη τὰ ἐπὶ τῆς γῆς
  choice: 地上にある肢体
  rationale: 「肢体」という身体的比喩と「地上にある」という空間的表現を保持し、「地上的な性質」などの解釈を本文に持ち込まない。ギリシア語に所有代名詞はないため「あなたがたの」は補わない。
- source_word: πορνείαν
  choice: 淫らな行い
  rationale: 不適切な性的行為を広く指す語として、古風すぎず一般読者に理解できる表現を選んだ。
- source_word: ἀκαθαρσίαν
  choice: 汚れ
  rationale: パウロ書簡における道徳的な汚れを含む広い語義を簡潔に保つ。
- source_word: πάθος
  choice: 情欲
  rationale: ここでは制御されない不当な欲情を表すため、「情熱」のような肯定的含意を避けた。
- source_word: ἐπιθυμίαν κακήν
  choice: 悪い欲望
  rationale: κακήνによる明示的な道徳的評価をそのまま示す。
- source_word: πλεονεξίαν
  choice: 貪欲
  rationale: より多くを得ようとする飽くなき欲求を、簡潔で定着した日本語で表す。
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: この貪欲は偶像礼拝です
  rationale: 関係代名詞の指示対象を日本語で明確にし、貪欲を偶像礼拝とする断定の強さを保つ。
theological_decisions:
- issue: 「これは偶像礼拝です」の指示対象
  choice: 直前の「貪欲」を指すものとして「この貪欲」と明示する。
  alternative: 前に列挙された悪徳全体を指す。
  rationale: 女性単数の関係代名詞ἥτιςは、最も自然には直前の女性単数名詞πλεονεξίανと一致する。
- issue: 「地上にある肢体」の解釈
  choice: 身体的・空間的比喩を本文に残す。
  alternative: 「あなたがたのうちにある地上的なもの」または「地上的な性質」と意訳する。
  rationale: 原文のμέληとτὰ ἐπὶ τῆς γῆςを保持し、悪徳の列挙をその具体的説明として読める形にすることで、比喩を一つの抽象的解釈に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の強さと原文の身体的比喩を保持した。「肢体」は日常語よりやや荘重だが、μέληの比喩を過度に説明せず伝えるために採用した。列挙部分は「すなわち」で受け、各対格名詞が「地上にある肢体」を具体化する構造を読み取りやすくした。
