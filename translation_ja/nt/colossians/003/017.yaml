    issue: 「ことばによってであれ、行いによってであれ」
    rationale: ἐν λόγῳ ἢ ἐν ἔργῳ のἐνは、この対句では主に「ことばの領域であれ、行いの領域であれ」を示す。「～によって」は手段・原因として読まれやすいため、「ことばであれ、行いであれ」に改める。
  - severity: medium
    issue: 「そして、この方を通して父なる神に感謝しなさい」
    rationale: εὐχαριστοῦντες は主命令を修飾する現在分詞であり、感謝が行為に伴うことを示す。「そして」は順次的な別命令の印象を加えるため、「主イエスを通して父なる神に感謝しつつ」として関係を保つ。
  - severity: low
    issue: 「この方を通して」
    rationale: 敬称として不自然ではないが、直前の固有の称号を受ける箇所では「主イエスを通して」と明示するほうが現代日本語として滑らかであり、代名詞αὐτοῦの指示対象も明確になる。
