revisions:
- from: あなたがたが、ことばによってであれ、行いによってであれ、何をするにしても[a]、すべてを主イエスの名によって行いなさい[b]。そして、この方を通して父なる神に感謝しなさい。
  to: ことばであれ、行いであれ、何をするにしても[a]、主イエスの名によってすべてを行いなさい[b]。主イエスを通して父なる神に感謝しつつ。
  rationale: 原文の二重の包括表現（「何をするにしても」／「すべてを」）を保持しつつ、ἐν λόγῳ ἢ ἐν ἔργῳ を自然で原文に即した日本語に改めた。感謝の分詞は、独立した命令へ強く切り離さず、主命令に伴う態度として「感謝しつつ」とした。「主イエスを通して」は、ギリシア語の代名詞の自然な先行詞を明示するが、仲介という表現を超える神学的説明は加えていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:47Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は原文の包括性、「ことば／行い」の対、主イエスの名において行うこと、父なる神への感謝という主要要素を適切に伝えています。ただし、ἐν λόγῳ ἢ ἐν ἔργῳ は手段を表す「ことばによって／行いによって」よりも、領域・場合を表す「ことばであれ、行いであれ」が適切です。また、εὐχαριστοῦντες は主命令に伴う分詞であり、「そして…感謝しなさい」と独立した順次の命令として結ぶより、「感謝しつつ」とするほうが関係をよく保ちます。
  naturalness: 「この方を通して」は先行する「主イエス」を指すことは明瞭ですが、この文脈の現代標準日本語としては「主イエスを通して」と明示するほうが自然です。語順も、感謝を伴う様態として前置すると、分詞構文を無理なく表せます。
  terminology: 「主イエス」「父なる神」「名によって」は適切です。「名によって」は原語の慣用的な幅を保っており、脚注で可能な含意を示す処理も適切です。
