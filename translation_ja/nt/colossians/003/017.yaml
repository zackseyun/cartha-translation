reference: Colossians 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: ja
  text: ことばであれ、行いであれ、何をするにしても[a]、主イエスの名によってすべてを行いなさい[b]。主イエスを通して父なる神に感謝しつつ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ことばにおいてであれ、行いにおいてであれ」。
    reason: lexical_alternative
  - marker: b
    text: 「名によって」は、「その権威のもとで」または「その方を代表して」という意味を含むことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: 何をするにしても
  rationale: 不定かつ包括的な表現を、現代日本語で自然に伝え、あらゆる行為を含む広がりを保つ。
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: ことばによってであれ、行いによってであれ
  rationale: 発言と実際の行動を対にするギリシア語の簡潔な対照を保ちつつ、日本語として明瞭にした。
- source_word: πάντα
  choice: すべてを
  rationale: 直前の包括的表現を受け、例外なく全体に及ぶ勧告であることを示す。日本語では補った「行いなさい」の目的語として自然に機能する。
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: 主イエスの名によって
  rationale: 権威、代理、帰属を含み得る聖書的な慣用表現の幅を狭めずに保持する。
- source_word: κυρίου
  choice: 主
  rationale: キリストに対する称号としての重みを保つ標準的な訳語である。
- source_word: εὐχαριστοῦντες
  choice: 感謝しなさい
  rationale: ギリシア語では分詞だが、日本語では並列する勧告として表すことで、主たる勧めに伴う継続的な感謝を明瞭かつ自然に伝える。
- source_word: τῷ θεῷ πατρὶ
  choice: 父なる神に
  rationale: θεῷ と同格の πατρί を、現代日本語の定着した簡潔な表現で示す。
- source_word: δι’ αὐτοῦ
  choice: この方を通して
  rationale: 直前の主イエスを指す代名詞であることを日本語で明瞭にし、仲介を表す διά の意味を保持する。
theological_decisions:
- issue: 「主イエスの名によって」の意味範囲
  choice: 慣用表現を本文に保持する。
  alternative: 「主イエスの権威のもとで」または「主イエスを代表して」と明示する。
  rationale: 原句は権威、代理、主への帰属などを含み得るため、一つの解釈に限定せず神学的な広がりを保つ。
- issue: 「この方を通して」の指示対象
  choice: 直前の「主イエス」を指すものとして訳す。
  alternative: 指示対象を明示せず「彼を通して」とする。
  rationale: 統語上もっとも近い先行詞は主イエスであり、父なる神への感謝の仲介者を示す構造を自然に反映する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文では「行いなさい」に当たる動詞が後半で省略されているため、日本語の文として補った。冒頭の重複的な包括表現と、ことば／行いの対句を保ち、後半は過度に長い一文になるのを避けて二文に分けた。
