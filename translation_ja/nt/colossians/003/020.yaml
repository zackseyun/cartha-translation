reference: Colossians 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: ja
  text: 子どもたちよ、すべてのことにおいて両親に従いなさい。これは主にあって[b]喜ばれる[a]ことだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「受け入れられる」。
    reason: lexical_alternative
  - marker: b
    text: 「主にあって」は、主との関係の中で喜ばれることを述べているとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: 子どもたちよ
  rationale: τέκναは性別を限定せず、家庭の中の子どもたちを呼びかける語である。呼格的な用法を「よ」で自然に示した。
- source_word: ὑπακούετε
  choice: 従いなさい
  rationale: ὑπακούωの命令形は、権威ある者の言うことを聞いて従うことを表す。「言うことを聞きなさい」より簡潔で、命令の力も保つ。
- source_word: τοῖς γονεῦσιν
  choice: 両親に
  rationale: γονεῖςは父母を含む「親」を意味する。日本語では複数の親を指す文脈で「両親」が自然である。
- source_word: κατὰ πάντα
  choice: すべてのことにおいて
  rationale: κατάとπάνταはここで服従の範囲を示す。時間的な「いつも」ではなく、事柄の全般を表す訳とした。
- source_word: τοῦτο
  choice: これは
  rationale: 直前に命じられた両親への従順を指す指示語として、ギリシア語の構造を保った。
- source_word: γὰρ
  choice: だからです
  rationale: 命令の根拠を示す説明的な接続関係を、自然な現代日本語で表した。
- source_word: εὐάρεστόν ἐστιν
  choice: 喜ばれること
  rationale: εὐάρεστοςは「喜ばれる」「受け入れられる」を意味する。ここでは評価の積極的なニュアンスを自然に表す「喜ばれる」を採った。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡に特徴的なἐν κυρίῳの関係・領域を示す表現を保ち、「主に喜ばれる」と狭く解釈し切らない訳とした。
theological_decisions:
- issue: 「すべてのことにおいて」という命令の範囲と「主にあって」との関係
  choice: 両方の句をそのまま保ち、「主にあって」を「喜ばれること」に続けて置く。
  alternative: 「主のみこころにかなう限り、すべてのことにおいて」と明示的な制限を加える、または「これは主を喜ばせることだから」と訳す。
  rationale: ギリシア語本文には明示的な例外条項がなく、ἐν κυρίῳを命令に直接結び付けるか、何が喜ばれるかを示す句と見るかには解釈の余地がある。本文にない限定を補わず、主との関係の中に勧告を位置づける表現を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、呼びかけと命令には聖書本文にふさわしい品位を保った。「主にあって」は日常語ではないが、原文のパウロ的表現と解釈上の幅を保つため採用し、脚注で意味を補った。
