  terminology: κύριοςを「主」、Χριστόςを称号性を保つ「メシア」としたことは一貫している。「相続財産」「報い」「仕える」も本文脈にふさわしい。脚注aは「キリスト」という伝統的表現を適切に案内し、脚注bはδουλεύετεが直説法であることを正確に説明している。
