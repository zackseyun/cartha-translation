  source_fidelity: 原文の構文と主要語を適切に反映している。εἰδότεςは「知っているのです」として前節から続く根拠・確認の流れを保ち、ἀπὸ κυρίουは「主から」と訳されている。ἀπολήμψεσθεの未来は、日本語の非過去形を含む「受けることを知っている」により文脈上自然に表される。ἀνταπόδοσιν τῆς κληρονομίαςを「相続財産を報いとして」とするのは、相続財産が報いとして与えられるという自然な理解を明瞭にする訳である。τῷ κυρίῳ Χριστῷとδουλεύετεは、それぞれ「主であるメシアに」「仕えているのです」と忠実に反映されている。
