id: COL.3.24
reference: Colossians 3:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: ja
  text: あなたがたは、主から相続財産を報いとして受けることを知っているのです。あなたがたは、主であるメシア[a]に仕えているのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「主であるキリスト」。
    reason: alternative_reading
  - marker: b
    text: ギリシア語の動詞は直説法で、「仕えなさい」という直接の命令形ではなく、「仕えている」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: 知っているのです
  rationale: 完了能動分詞が前節から続く勧告の根拠を示している。日本語では独立節として自然に読める形にしつつ、「知っている」という状態と文脈上の理由づけを保った。
- source_word: ἀπὸ κυρίου
  choice: 主から
  rationale: ἀπό＋属格が報いの源を示すため、「から」とした。奴隷と主人の文脈でも、ここでは後半のキリスト論的称号とのつながりを保つため「主人」ではなく「主」とした。
- source_word: ἀπολήμψεσθε
  choice: 受ける
  rationale: 未来中動態直説法。日本語では文中の「受けること」により未来の受領を自然に表し、返礼の含意は「報い」で示した。
- source_word: ἀνταπόδοσιν τῆς κληρονομίας
  choice: 相続財産を報いとして
  rationale: 属格を、相続財産そのものが報いであるという同格的・内容的関係として自然な日本語にした。「相続財産の報い」という不明瞭な連結を避けつつ、報いと相続財産の結びつきを保持した。
- source_word: τῷ κυρίῳ Χριστῷ
  choice: 主であるメシアに
  rationale: 与格は δουλεύετε の対象を示す。Χριστόςの称号性を「メシア」で表し、κύριοςとの関係は「主である」と明示した。
- source_word: δουλεύετε
  choice: 仕えているのです
  rationale: 現在能動態直説法二人称複数であり、直接の命令形ではない。前節の勧告を動機づける現在の事実として訳した。
theological_decisions:
- issue: Χριστῷを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この句ではΧριστόςの称号としての意味が生きているため、「メシア」を本文に採用した。伝統的で名辞化した「キリスト」は脚注に示した。
- issue: δουλεύετεの法と発話の力
  choice: 直説法として「仕えているのです」
  alternative: 命令として「仕えなさい」
  rationale: 形態は現在能動態直説法である。文脈上は勧告的な力を帯び得るが、命令形へ変更せず、彼らの真の主を確認する叙述として訳した。
- issue: 報いと相続財産の関係
  choice: 相続財産を報いとして受ける
  alternative: 相続財産の報いを受ける
  rationale: τῆς κληρονομίαςの属格は簡潔で、厳密な分類には余地がある。「報いとして」は相続財産が与えられる報いであるという自然な理解を示すが、功績による賃金という含意を加えない。
translation_notes:
  register: 現代標準日本語の明快で品位ある文体。「相続財産」は一般読者にも理解でき、κληρονομίαの法的・終末論的な響きを保つ。「あなたがた」を反復して後半の直説的確認を明瞭にした。
