  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: ja
  text: 父親たちよ、子どもたちをいらだたせてはいけません。子どもたちが気落ちしない[a]ようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「心がくじけない」。
    reason: ἀθυμέω が表す、勇気や意欲を失って落胆するという語感を示すため。
lexical_decisions:
- source_word: οἱ πατέρες
  choice: 父親たちよ
  rationale: πατέρες はここでは文法的・語彙的に「父親たち」を指す。家庭訓の中で特定の役割に呼びかけているため、「親たち」と一般化しない。
- source_word: μὴ ἐρεθίζετε
  choice: いらだたせてはいけません
  rationale: ἐρεθίζω は人を刺激して悪い反応を引き起こすことを表す。「いらだたせる」は現代日本語として自然で、子どもを繰り返し刺激して反発や落胆へ追いやる含みを伝える。
- source_word: τὰ τέκνα ὑμῶν
  choice: 子どもたち
  rationale: τέκνα は男女を含む子を指す通常の語であり、日本語では「子どもたち」が自然かつ正確である。所有関係は父親への呼びかけと文脈から明らかなため、不自然な「あなたがたの」を省いた。
- source_word: ἵνα μὴ
  choice: しないためです
  rationale: ἵνα μή の目的・意図された結果を、明瞭な現代日本語で表した。
- source_word: ἀθυμῶσιν
  choice: 気落ちしない
  rationale: ἀθυμέω は勇気や意欲を失い、落胆することを意味する。「気落ちする」は内面的に心がくじける意味を簡潔に伝える。
theological_decisions:
- issue: 家庭訓における πατέρες の範囲
  choice: 父親たちへの具体的な呼びかけとして訳す
  alternative: 親たちへの一般的な呼びかけとして訳す
  rationale: ギリシア語は明示的に「父親たち」と述べる。適用をより広く考える余地はあっても、翻訳では原文の特定の呼びかけを保持する。
- issue: ἵνα μή が示す関係
  choice: 父親の行為を禁じる目的として表す
  alternative: 単なる結果として「そうすれば気落ちすることはない」と表す
  rationale: ἵνα μή は目的と意図された結果の両面を帯び得る。「しないためです」は目的を前面に出しつつ、因果的なつながりも保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、家庭訓にふさわしい端正な勧告調とした。「父親たちよ」で原文の直接的な呼びかけを保持し、後半は説明的で自然な敬体に整えた。
