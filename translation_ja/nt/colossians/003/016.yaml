id: COL.3.16
reference: Colossians 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: ja
  text: あらゆる知恵をもって、メシアのことばがあなたがたのうちに豊かに宿るようにしなさい。[a] 詩篇、賛歌、霊の歌をもって、互いに教え、戒め合いなさい。恵みをもって[b]、心で神に向かって歌いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの間に」とも訳せる。ギリシア語の「あなたがた」は複数形であり、メシアのことばが共同体全体のただ中に宿ることにも、信じる者たち一人ひとりの内に宿ることにも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「感謝をもって」とも訳せる。ギリシア語の表現は文脈により、恵み、恵み深さ、感謝を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: メシアのことば
  rationale: λόγοςの広い意味を「ことば」で保ち、属格も「メシアの」として、メシアから来ることば／メシアについてのことばという関係を限定しすぎない。Χριστόςはここでは称号として「メシア」とした。
- source_word: ἐνοικείτω
  choice: 宿るようにしなさい
  rationale: 内に住み続けるという比喩と、継続的な状態を求める現在命令の力を自然な日本語で表す。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちに
  rationale: 複数形を明示しつつ、共同体のただ中と各人の内面の双方を含み得る表現にした。
- source_word: πλουσίως
  choice: 豊かに
  rationale: 充満と豊富さを示す副詞を直接的に表す。
- source_word: ἐν πάσῃ σοφίᾳ
  choice: あらゆる知恵をもって
  rationale: 後続の「教え、戒め合う」に自然につながる一方、ことばを宿らせる営み全体にも関わり得る配置とした。
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: 互いに教え、戒め合いなさい
  rationale: 複数の再帰代名詞が持つ相互的な意味を「互いに」で表し、νουθετέωの矯正的な含みを「戒める」で保つ。
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: 詩篇と賛歌と霊の歌によって
  rationale: 三つの歌の呼称を区別して残し、与格の手段的用法を「によって」で示す。πνευματικαῖςは直近の「歌」を修飾する形で訳した。
- source_word: ἐν χάριτι
  choice: 恵みをもって
  rationale: χάριςの「恵み」と「感謝」の双方が文脈上可能なため、本文では語形に近い訳を採り、別の意味を脚注に示す。
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: あなたがたの心の中で神に向かって
  rationale: 複数形を反映し、歌が心の内から神に向けられるという関係を明確にした。
theological_decisions:
- issue: Χριστοῦを称号として訳すか、慣用的な固有名詞風に訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所では油注がれた者という称号の意味を保つため「メシア」とした。
- issue: ἐν ὑμῖνの共同体的意味と個人的意味
  choice: あなたがたのうちに
  alternative: あなたがたの間に／あなたがた一人ひとりの内に
  rationale: 周囲の相互的な活動は共同体的理解を支持するが、信者各人の内面も排除されないため、両方に開かれた訳と脚注を採用した。
- issue: ἐν χάριτιの意味
  choice: 恵みをもって
  alternative: 感謝をもって
  rationale: 「恵み」「感謝」「好ましさ」の意味領域を一つに断定せず、主要な別訳を脚注に残した。
- issue: ἐν πάσῃ σοφίᾳの統語的な結びつき
  choice: 後続の相互教授に自然につながる位置に置く
  alternative: 「豊かに宿る」を直接修飾する
  rationale: ギリシア語では前後どちらとの結びつきも感じられるため、句読点で一方だけに強く限定しない構成にした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら礼節と格調を保つ文体とした。「宿る」「賛歌」「戒める」など聖書文脈になじむ語を用いる一方、古語的な語尾や過度に教会専門的な表現は避けた。
