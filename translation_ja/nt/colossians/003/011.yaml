id: COL.3.11
reference: Colossians 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: ja
  text: そこには、ギリシア人とユダヤ人、割礼と無割礼、異国人[a]、スキタイ人、奴隷、自由人という区別はありません。むしろ、メシア[b]がすべてであり、すべてのうちにおられるのです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異国人」と訳したギリシア語は、もともとギリシア語を話さない人を外部者として呼ぶ語で、伝統的には「未開人」「野蛮人」とも訳されます。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「クリストス」。ここでは称号として「メシア」と訳しました。伝統的には「キリスト」です。
    reason: lexical_alternative
  - marker: c
    text: 「すべての人のうちに」とも理解できます。ギリシア語の「すべてのうちに」は簡潔で、ここでは新しくされた共同体の全員を指す可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: そこには
  rationale: 直前の「新しい人」という領域を受ける場所的・領域的な表現として、現代日本語で自然に示す。
- source_word: οὐκ ἔνι
  choice: という区別はありません
  rationale: 単に各集団が存在しないという意味ではなく、新しくされた共同体において列挙された区分が決定的ではないという文脈上の意味を明確にする。
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: ギリシア人とユダヤ人
  rationale: 「異邦人」と一般化せず、原文の具体的な民族・文化的対比を保つ。
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: 割礼と無割礼
  rationale: 原文の抽象名詞による簡潔な宗教的・社会的対比を保つ。
- source_word: βάρβαρος
  choice: 異国人
  rationale: ギリシア語を話さない文化的な外部者を指す古代の呼称を、現代日本語で過度に侮蔑的にならない形で表す。古代語の含みは脚注で補う。
- source_word: Σκύθης
  choice: スキタイ人
  rationale: 特定の民族名なので、一般化せず日本語の標準的表記を用いる。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 「自由人」と明示的に対置されており、拘束された法的・社会的身分が重要であるため。
- source_word: ἐλεύθερος
  choice: 自由人
  rationale: 奴隷身分に対する標準的な社会的身分名称として明瞭である。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 列挙された区分と、メシアを中心とする現実との強い対照を自然に示す。
- source_word: τὰ πάντα
  choice: すべて
  rationale: メシアの包括的な重要性を表しつつ、「すべてのもの」などと対象範囲を過度に限定しない。
- source_word: ἐν πᾶσιν
  choice: すべてのうちに
  rationale: 文脈上は共同体のすべての人を指す可能性が高いが、原文の簡潔さと範囲の曖昧さを保つ。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは称号として機能しているため、「油注がれた者」という称号的意味を表す「メシア」とした。伝統的表記は脚注に示す。
theological_decisions:
- issue: ἐν πᾶσιν の範囲
  choice: すべてのうちに
  alternative: すべての人のうちに／すべてのもののうちに
  rationale: 直近の文脈は新しくされた共同体の成員を扱うが、ギリシア語自体は簡潔で、人的範囲に限定する語を明示していない。その開放性を本文に残す。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: 称号としての意味を訳出する一方、日本語で定着した伝統的音写も脚注に示す。
- issue: οὐκ ἔνι と社会的区分
  choice: という区別はありません
  alternative: そこには……ありません
  rationale: 人々そのものの存在を否定するのではなく、古い身分・民族・宗教的区分が新しい人における決定的な区分ではないことを表す。ただし、差異そのものの消滅以上の制度的主張は加えない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。列挙のリズムを保ちながら、「という区別はありません」によって、日本語で人々の存在そのものを否定するように響くことを避けた。「すべてのうちに」は多少凝縮された表現だが、原文の神学的な広がりを保つため採用した。
