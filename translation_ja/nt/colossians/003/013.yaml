  to: 互いに耐え忍び、互いに赦し合いなさい。だれかがだれかに対して不平があるなら、主があなたがたを赦してくださったように、あなたがたも同じようにしなさい。[a]
  rationale: 原文の二つの並列した勧告（ἀνεχόμενοι、χαριζόμενοι）を日本語でも明示的に並べ、ἀλλήλωνの相互性を「互いに耐え忍び」で保ちました。条件節は「だれかがだれかに対して不平があるなら」として、不特定の人どうしの対人的苦情を表します。末尾は原文の動詞省略を尊重しつつ、自然な日本語となるよう「同じようにしなさい」と補い、注で省略を説明します。
  reviewer_model: gpt-5.6-terra
