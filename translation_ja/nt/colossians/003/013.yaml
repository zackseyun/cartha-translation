base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: ja
  text: 互いに耐え忍び、互いに赦し合いなさい。だれかがだれかに対して不平があるなら、主があなたがたを赦してくださったように、あなたがたも同じようにしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、末尾は「あなたがたも同じように」となり、「しなさい」に当たる動詞は文脈から補われます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: 互いに忍耐し
  rationale: 継続的な共同体内の態度を表す分詞句。「我慢する」より品位があり、「耐え忍ぶ」ほど苦難の含みを強めず、他者を受け止める関係的な意味を保つ。
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: 互いに赦し合いなさい
  rationale: この文脈の χαρίζομαι は、受けた非や不満を赦すことを表す。ἑαυτοῖς は共同体内の相互的行為として自然に訳した。前後の分詞は命令的な勧告を担うため、日本語では明示的な勧告形とした。
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: だれかがほかの人に不満を抱いているなら
  rationale: 不特定の条件を保ち、μομφή を対人関係上の非難の理由や苦情を含みうる「不満」とした。「訴え」では公式な告発の響きが強すぎる。
- source_word: καθὼς καὶ ὁ κύριος ἐχαρίσατο ὑμῖν
  choice: 主があなたがたを赦してくださったように
  rationale: 比較関係と、主による先行する赦しを保持した。χαρίζομαι の恵み深い含意は、敬意と恩恵を自然に表す補助動詞「くださった」にも響かせた。
- source_word: οὕτως καὶ ὑμεῖς
  choice: あなたがたも同じようにしなさい
  rationale: 原文では動詞が省略され、文脈から赦す行為が補われる。日本語として文を成立させつつ、原文にない義務の助動詞を加えず、簡潔な命令として表した。
theological_decisions:
- issue: ὁ κύριος の指示対象
  choice: 「主」とし、本文では指示対象を限定しない
  alternative: 「キリスト」または「神」と明示する
  rationale: 文脈上はキリストを指す可能性が高いが、ギリシア語本文は称号「主」のみであるため、そのまま保持して過度な特定を避けた。
- issue: 末尾 οὕτως καὶ ὑμεῖς の省略
  choice: 「あなたがたも同じようにしなさい」とし、行為名を繰り返さない
  alternative: 「あなたがたも赦しなさい」と明示する
  rationale: 原文の簡潔な省略をある程度保ちながら、自然な現代日本語にするため一般動詞を補った。指す行為は直前の赦しで明白である。
- issue: 赦しの勧告の相互性
  choice: 「互いに赦し合いなさい」
  alternative: 「自分たちを赦しなさい」という形式的な反射表現
  rationale: ἑαυτοῖς はここでは共同体構成員相互の行為を表す。自己赦免という神学的意味を持ち込まず、相互性を明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。共同体への継続的な勧告として読みやすくするため、ギリシア語の分詞構文を日本語の命令表現に整えた。「忍耐し」は硬すぎず軽すぎない語調を選び、「赦す」は聖書的な文脈にふさわしい表記とした。
