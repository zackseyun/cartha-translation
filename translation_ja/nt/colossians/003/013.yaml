review_pass:
  verdict: revise
  source_fidelity: 概ね原文に忠実であり、「主」とすること、相互的な赦し、末尾の省略を「同じようにしなさい」で補うことはいずれも適切です。ただし、「互いに忍耐し」はἀνεχόμενοιの対人的な「互いに耐え忍ぶ／忍び合う」意味をやや弱めます。また条件節を二つの勧告の間に置く現行の語順は、原文の並列関係をやや見えにくくします。
  naturalness: 現代標準日本語として読みやすく、敬語を用いた「赦してくださった」も本文の格調に合います。「だれかがだれかに対して不平があるなら」は、原文の不特定性と対人関係上のμομφήを自然に表せます。
  terminology: 「赦す」「主」「あなたがた」は一貫しており、聖書本文として適切です。μομφήは単なる内面的感情としての「不満」よりも、相手に対して抱く「不平」としたほうが「苦情・非難の理由」の意味を保ちます。
  issues:
  - severity: medium
    issue: ἀνεχόμενοιの対人的・相互的な意味が弱い
    rationale: 「互いに忍耐し」は何に対して忍耐するのかが明示されず、ἀλλήλωνにより示される「互いに相手を耐え忍ぶ」関係性が薄くなります。「互いに耐え忍び」とすることでこれを自然に表せます。
  - severity: low
    issue: 条件節の配置により二つの分詞の並列がやや不明瞭
    rationale: 原文は「互いに耐え忍び、互いに赦し合いなさい」に続けて条件を示します。日本語でも二つの勧告を並列してから条件節を置くと、構文と修辞の流れをよりよく保てます。
  - severity: low
    issue: μομφήの訳語
    rationale: 「不満」は主観的な不快感にもなり得ますが、μομφήは相手に対する苦情・非難の理由です。「不平がある」は日常的で、過度に法的な響きを持たずにその意味を表せます。
