id: COL.3.14
reference: Colossians 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: ja
  text: これらすべての上に、愛を身に着けなさい。愛は完全さのきずなです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「完成のきずな」または「成熟のきずな」とも訳せる。
    reason: τελειότηςには「完全さ」「完成」「成熟」という意味の幅があるため。
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: これらすべての上に
  rationale: ἐπί＋与格の表現を、12節から続く衣服の比喩に沿って訳した。愛をほかの徳に加えるという意味と、それらの上にまとうという像の両方を保つ。
- source_word: τὴν ἀγάπην
  choice: 愛
  rationale: ἀγάπηの明瞭で自然な標準訳。文脈では、先に挙げられた徳目をまとめるものとして示される。
- source_word: '[文脈から補う動詞：ἐνδύσασθε（12節）]'
  choice: 身に着けなさい
  rationale: この節には動詞が明示されていないが、対格のτὴν ἀγάπηνは12節の命令形ἐνδύσασθεに依存する。日本語として文を成立させ、衣服の比喩も保つために補った。
- source_word: ὅ
  choice: 愛は
  rationale: 中性単数の関係代名詞ὅは、女性名詞ἀγάπηと文法的に一致せず、愛という概念ないし直前の勧め全体を受けている可能性がある。日本語では「愛は」と受け直すことで自然に説明を続け、指示対象を過度に限定しない。
- source_word: σύνδεσμος
  choice: きずな
  rationale: 物事を結び合わせるものを表す語。現代日本語で理解しやすく、愛が諸徳を一つにするという含みを保つ。「靱帯」はこの文脈では解剖学的すぎる。
- source_word: τῆς τελειότητος
  choice: 完全さの
  rationale: τελειότηςの「完全・完成・成熟」という意味範囲のうち、原文の簡潔さと包括性を保つ表現。「完成」や「成熟」という可能性は注に示した。
theological_decisions:
- issue: 愛が「完全さのきずな」であるという表現の意味
  choice: 「完全さのきずな」と簡潔に訳し、属格の関係を限定しない。
  alternative: 「すべてを完全に結び合わせるきずな」または「成熟をもたらすきずな」
  rationale: τῆς τελειότητοςは、完全さに属するきずな、完全さを生み出すきずな、諸徳を完全な一体へ結ぶきずななど、近接する複数の理解が可能である。本文では原文の緊張と簡潔さを保ち、特定の因果関係に決めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「身に着けなさい」で周辺文脈の衣服の比喩を保ち、「きずな」は漢字の「絆」よりも読みやすさを優先して平仮名表記とした。
