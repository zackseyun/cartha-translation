id: COL.3.8
reference: Colossians 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: ja
  text: しかし今は、あなたがたも、これらすべて、すなわち、怒り、憤り、悪意、中傷、口から出る恥ずべき言葉を捨てなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: 捨てなさい
  rationale: 衣服を脱いで置くことにも用いられる語だが、ここでは悪徳を除き去るよう命じる比喩。簡潔で自然な「捨てなさい」とした。
- source_word: ὀργήν
  choice: 怒り
  rationale: 持続的な怒りや憤りを指し得る一般的な語として訳した。
- source_word: θυμόν
  choice: 憤り
  rationale: 激しく燃え上がる感情を表す語。ὀργήとの重なりを保ちつつ区別できる「憤り」とした。
- source_word: κακίαν
  choice: 悪意
  rationale: 文脈上、一般的な悪そのものより、他者に害を加えようとする悪意を指すと理解した。
- source_word: βλασφημίαν
  choice: 冒瀆
  rationale: 神への冒瀆にも人への中傷にも用いられる語であり、目的語が示されない原文の幅を保つため「冒瀆」とした。
- source_word: αἰσχρολογίαν
  choice: 恥ずべき言葉
  rationale: 卑猥、下品、侮辱的な発言を含み得る広い表現なので、一種類の発言に限定しない訳とした。
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: 口から出る
  rationale: 直訳的な身体表現を自然な日本語にし、発言として外に出すことを明確にした。
theological_decisions:
- issue: βλασφημίαの対象
  choice: 「冒瀆」として対象を限定しない
  alternative: 「中傷」または「神への冒瀆」
  rationale: 原文には対象が明記されておらず、神への不敬と人への悪口の双方を指し得るため、曖昧さを保持した。
- issue: 命令の範囲
  choice: 列挙された悪徳を「これらすべて」として捨てるよう命じる
  alternative: 「あらゆるものを捨てる」と一般化する
  rationale: τὰ πάνταは後続の悪徳一覧を受けるため、その範囲を明確にした。
translation_notes:
  register: 明瞭で現代的かつ dignified な命令文。「口から出る恥ずべき言葉を」を末尾に置き、原文の列挙と強調をできるだけ保った。
