lexical_decisions:
- source_word: τὰ ἄνω
  choice: 上にあるもの
  rationale: 冠詞を伴う中性複数の表現を実体的に訳し、後半の「地上にあるもの」との空間的・宇宙的な対比を保った。
- source_word: φρονεῖτε
  choice: 心を向けなさい
  rationale: 単に知的に考えるだけでなく、思い、態度、関心を継続して向ける命令であることを、自然な現代日本語で表した。
- source_word: μὴ
  choice: ……にではありません
  rationale: 命令そのものを否定するのではなく、その対象を対照的に退ける構文として表現した。
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: 地上にあるもの
  rationale: 前半と対応する実体的な表現とし、原文の具体的な上下の対比を保った。
- source_word: γῆς
  choice: 地上
  rationale: 特定の土地ではなく、「上」と対照をなす地上・地的領域を指すため。
theological_decisions:
- issue: φρονεῖτε が求める姿勢の範囲
  choice: 思考だけでなく、態度や関心を上にあるものへ向ける勧め
  alternative: 天について知的に考えることだけを命じる狭い理解
  rationale: φρονέωには思考、心構え、関心の方向づけが含まれる。「心を向けなさい」はその広がりを保ちつつ、特定の教派的解釈を加えない。
translation_notes:
