id: COL.3.10
reference: Colossians 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: ja
  text: そして、新しい人[a]を身に着けたのです。この新しい人は、その人を創造された方のかたちに従って、知識[b]に至るように新たにされ続けています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「新しい自分」または「新しい者」とも訳せる。原文では「古い人」と対照をなしている。
    reason: lexical_alternative
  - marker: b
    text: 「十分な知識」または「深い知識」という含みを持つこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: 身に着けたのです
  rationale: 衣服を着るという比喩を保ちつつ、アオリスト分詞が前節から続く完了的な行為を表すことを自然な日本語で示す。
- source_word: τὸν νέον
  choice: 新しい人
  rationale: 実体詞的な形容詞を、直前の「古い人」との対照が伝わる形で訳した。個人の内面だけに限定せず、人間存在および共同体的な含みも残す。
- source_word: ἀνακαινούμενον
  choice: 絶えず新たにされています
  rationale: 現在受動分詞の継続性と受動態を明示し、更新が進行中であることを表した。
- source_word: εἰς ἐπίγνωσιν
  choice: 知識に至るよう
  rationale: εἰς の方向・到達点の意味を保つ。「十分な知識」と断定せず、ἐπίγνωσις が持ちうる強意的な含みは脚注に示した。
- source_word: κατ’ εἰκόνα
  choice: かたちに従って
  rationale: κατά の基準・適合の意味を表し、創世記の「神のかたち」への響きを保った。
- source_word: τοῦ κτίσαντος αὐτόν
  choice: これを造られた方
  rationale: 創造者を人格的に指す分詞句を保ち、「これ」が「新しい人」を受けることを示した。敬意を表す日本語として「造られた方」とした。
theological_decisions:
- issue: τὸν νέον の人間論的・共同体的な含み
  choice: 新しい人
  alternative: 新しい自分／新しい者
  rationale: 「新しい自分」よりも原文の「人」の比喩と「古い人」との対照を明確に保ち、個人的な自己意識だけに意味を狭めない。
- issue: ἐπίγνωσις の意味の強さ
  choice: 知識
  alternative: 十分な知識／深い知識
  rationale: 強意的な意味は可能だが必須ではないため、本文では過剰に限定せず、可能なニュアンスを脚注に残した。
- issue: 更新の主体
  choice: 新たにされています
  alternative: 新しくなっていきます
  rationale: 受動態を保つことで、更新を受ける「新しい人」と、その働きを行う創造者との関係を曖昧にしない。
translation_notes:
  register: 現代の標準的な日本語を用い、衣服・創造・かたちという原文の比喩を保った。「絶えず」によって現在分詞の継続性を自然に示し、全体を荘重すぎず礼拝・朗読にも適する文体に整えた。
