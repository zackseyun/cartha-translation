reference: Colossians 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: ja
  text: キリストの平和が、あなたがたの心を治めるようにしなさい[a]。あなたがたは一つのからだとして、その平和へと召されたのです[b]。また、感謝する者となりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「治める」と訳した語には、競技の審判のように「裁定する」「決定する」という含みもあります。
    reason: lexical_alternative
  - marker: b
    text: 「一つのからだとして」は、「一つのからだへと」と理解することもできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ εἰρήνη τοῦ Χριστοῦ
  choice: キリストの平和
  rationale: 属格関係を簡潔に保ち、パウロ書簡における救いと共同体の平和という意味を自然な日本語で表した。Χριστόςは日本語の標準的な聖書用語であり、称号としての意味も保持する「キリスト」とした。
- source_word: βραβευέτω
  choice: 治めるようにしなさい
  rationale: 原語が持つ審判者・裁定者として決定する比喩を背景に、ここでの支配的・決定的な働きを明瞭かつ自然に表す。別のニュアンスは脚注に示した。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: あなたがたの心を
  rationale: 日本語では「心の中で治める」より「心を治める」が自然であり、共同体を構成する各人の内面、意志、感情を指す複数形の含意も「あなたがた」によって保たれる。
- source_word: εἰς ἣν
  choice: その平和へと
  rationale: 関係代名詞の先行詞が「平和」であることを明示し、εἰςの方向・目標の含みを「へと」で保持した。
- source_word: καὶ ἐκλήθητε
  choice: 召されたのです
  rationale: καίの強調的な働きは、日本語の説明的強調「のです」によって自然に表した。受動態は神を明記しない神的受動の形のまま保った。
- source_word: ἐν ἑνὶ σώματι
  choice: 一つのからだのうちにあって
  rationale: ἐνの基本的な位相・領域の意味を保ち、共同体が一つのからだであるという比喩を説明語に置き換えず残した。
- source_word: εὐχάριστοι γίνεσθε
  choice: 感謝する者となりなさい
  rationale: γίνεσθεの「なる」という展開的な語感と、εὐχάριστοιが形容詞で人の性質・姿勢を表すことを、「感謝しなさい」より明示的に保持した。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: キリスト
  alternative: メシア／油注がれた方
  rationale: Χριστόςは称号に由来するが、日本語では「キリスト」が称号として定着しており、本書簡の自然で格調ある文体にも適する。固有名詞化しすぎないよう「キリストの平和」という属格をそのまま保った。
- issue: 「一つのからだ」の指示対象
  choice: 比喩をそのまま保持する
  alternative: 教会と明示する
  rationale: 教会共同体を指すことは文脈上示唆されるが、本文には「教会」という語がないため補わず、パウロのからだの比喩と共同体的一致の含みを保持した。
- issue: 召しの方向と共同体的領域の関係
  choice: 「その平和へと」召され、「一つのからだのうちにあって」とする
  alternative: 「一つのからだへと召された」と結び付ける
  rationale: εἰς ἣνは文法上「平和」を受け、ἐν ἑνὶ σώματιは召しが実現する共同体的な領域を表すと読むのが自然。ただしἐνの方向的理解の可能性は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告の格調を保った。「あなたがた」で複数の共同体的文脈を明示し、「からだ」は生物的身体だけでなく共同体の比喩であることを妨げないよう、ひらがな表記とした。
