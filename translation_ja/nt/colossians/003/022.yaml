id: COL.3.22
reference: Colossians 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: ja
  text: 奴隷である人たち[a]、すべてのことにおいて、この世の主人たち[b]に従いなさい。人に気に入られようとして、人に見られているときだけ仕えるのではなく[c]、心から誠実に、主を畏れつつ従いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷である人たち」――ギリシア語「ドゥーロイ」は「僕」や「仕える者」とも訳せるが、ここでは主人の権威の下に置かれた奴隷を指す。
    reason: lexical_alternative
  - marker: b
    text: 「この世の主人たち」――直訳すると「肉に属する主人たち」。人間社会における主人たちを指し、その権威が「主」の権威とは異なることを示す。「地上の主人たち」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「目への奉仕によってではなく」。人に見られている時だけ働くことを指す。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: 奴隷である人たち
  rationale: δοῦλοι はこの家訓の文脈で主人の権威下にある奴隷を指す。「僕」や「使用人」では古代の隷属関係を弱めるため、社会的実態を明示しつつ、人を物のように響かせない表現とした。
- source_word: ὑπακούετε κατὰ πάντα
  choice: あらゆることにおいて…従いなさい
  rationale: 命令形と κατὰ πάντα の広い範囲を保つ、明瞭で自然な現代日本語。
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: 肉による主人たち
  rationale: κατὰ σάρκα を単に「地上の」と解釈して固定せず、パウロ的な「肉」という語と、人間関係上の主人と「主」との対照を残した。補足脚注で意味を明らかにする。
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: 人目につくときだけ仕えるのではなく
  rationale: 直訳的な「目への奉仕」は現代日本語では不透明なため、見られている時だけ働くという稀な複合語の意味を自然に表した。
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: 人の機嫌を取る者のように
  rationale: 人を喜ばせることだけを目当てにする否定的含意を、通じやすい日本語で表現した。
- source_word: ἐν ἁπλότητι καρδίας
  choice: 真心をもって
  rationale: ἁπλότης はここでは知的な単純さでなく、二心のない誠実さを表す。「真心」は καρδίας も含めて自然に伝える。
- source_word: φοβούμενοι τὸν κύριον
  choice: 主を畏れ
  rationale: 神的称号としての κύριος を「主」とし、φοβέομαι は単なる恐怖にも敬意だけにも狭めず、聖書的な含みを持つ「畏れる」で表した。
theological_decisions:
- issue: 奴隷制の状況における倫理的命令
  choice: 「奴隷」「主人」と訳して古代の隷属関係を明示し、その制度への是認を訳文に付加しない。
  alternative: 現代の雇用関係に合わせて「使用人」「雇い主」とする。
  rationale: 本文は古代奴隷制の現実の中で語っている。雇用用語への置換は歴史的・倫理的緊張を覆い隠す。
- issue: 人間の主人と神的な主の対照
  choice: 前者を「主人たち」、後者を「主」と訳し、区別と対照を明示する。
  alternative: 双方を「主人」として語の反復を優先する。
  rationale: 日本語では神的称号「主」によって指示対象を明確にしながら、κύριος の語義上のつながりも保てる。
- issue: κατὰ σάρκα の意味
  choice: 本文では「肉による」と形式的対応を保ち、脚注で人間的・この世の関係に限られた主人であることを示す。
  alternative: 本文で「地上の」と解釈的に訳す。
  rationale: 「地上の」は分かりやすいが、σάρξ の表現と、権威の限定を示唆する原文の余韻を一つの解釈に固定するため。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。奴隷制という歴史的現実を婉曲化せず、同時に人を非人間化する響きを避けるため「奴隷である人たち」とした。命令の強さ、肉による主人と主との対照、畏れと誠実さの結びつきを保持した。
