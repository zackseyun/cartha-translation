  to: 奴隷である人たち[a]、すべてのことにおいて、この世の主人たち[b]に従いなさい。人に気に入られようとして、人に見られているときだけ仕えるのではなく[c]、心から誠実に、主を畏れつつ従いなさい。
  rationale: 意味の不明瞭な逐語表現「肉による主人たち」を、本文では自然で明瞭な「この世の主人たち」に改め、原語の「肉に属する」という表現および人間の主人と主との対照は脚注に保持した。「人に気に入られようとして」と「主を畏れつつ」により、原文の態度・動機を自然な日本語で表した。奴隷制を現代の雇用関係に置き換えず、本文の歴史的社会関係を明示している。
