  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: ja
  text: 夫たちよ、妻を愛しなさい。妻につらく当たってはいけません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「妻に対して苦々しい思いを抱いてはいけません」。ギリシア語の動詞は、苦々しくなること、または苦々しい態度を取ることを表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: 夫たちよ
  rationale: ἀνήρは「男」と「夫」の両義を持つが、家庭についての勧告という文脈と、対応するτὰς γυναῖκαςにより、ここでは婚姻関係を表す「夫」が明確である。呼びかけの力を「たちよ」で示した。
- source_word: ἀγαπᾶτε
  choice: 愛しなさい
  rationale: ἀγαπάωの基本的な意味と現在命令法の継続的な勧告を、自然で格調ある日本語で直接表す。
- source_word: τὰς γυναῖκας
  choice: 妻
  rationale: γυνήは「女」と「妻」の両義を持つが、夫への家庭訓であるため「妻」を意味する。日本語では各人の妻を指すことが文脈上明白であり、「自分の」を補わず簡潔にした。
- source_word: μὴ πικραίνεσθε
  choice: つらく当たってはいけません
  rationale: πικραίνωは字義的には苦々しくなる、または憤らせることに関係する。πρὸς αὐτάςを伴うこの文脈では、妻に対して苦々しい態度を取り、厳しく扱うことを戒める表現と理解し、自然な日本語で対人的な作用を示した。字義的な別訳は脚注に残した。
- source_word: πρὸς αὐτάς
  choice: 妻に
  rationale: πρός＋対格が態度や行為の向かう相手を示すため、「妻に」として「つらく当たる」の対象を明確にした。
theological_decisions:
- issue: 家庭訓における性別と婚姻関係を明示した呼びかけ
  choice: 「夫たち」と「妻」を保持する。
  alternative: 「男たち」と「女たち」のような広い語にする。
  rationale: ギリシア語の語自体には一般的な男女の意味もあるが、この家庭訓では婚姻関係が明確である。したがって対象を一般化せず、夫に対する妻への責任として訳した。
- issue: πικραίνεσθεの態と意味の幅
  choice: 妻に対する苦々しさが過酷な接し方として現れる対人的意味を「つらく当たる」で表す。
  alternative: 「妻に対して苦々しくなってはいけません」と内面的状態を前面に出す。
  rationale: 中・受動形は「苦々しくなる／憤る」という状態を表し得る一方、πρὸς αὐτάςはその態度が妻へ向かうことを示す。「つらく当たる」は文脈上の対人的力を伝え、別訳の可能性は脚注で保持する。
translation_notes:
  register: 現代標準日本語による、明快で品位ある勧告調。「愛しなさい」と「いけません」を用いて命令の力を保ちつつ、過度に古風な表現は避けた。
