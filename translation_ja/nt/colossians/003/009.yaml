  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: ja
  text: 互いに偽りを言ってはいけません。古い人[b]を、その行いとともに脱ぎ捨てたのですから[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「脱ぎ捨てて」。このギリシア語の分詞は、ここでは命令の理由を示すと考えられますが、時間的な関係として「脱ぎ捨てた後で」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「古い自分」。ギリシア語は「古い人」で、次節の「新しい人」と対をなしています。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: 偽りを言ってはいけません
  rationale: μήを伴う現在命令形を、継続中の行為の中止と限定せず、明確で自然な禁止として訳した。ψεύδομαιの中心的な意味である「偽りを言う」を保っている。
- source_word: εἰς ἀλλήλους
  choice: 互いに
  rationale: 相互関係を表す慣用句であり、日本語では「互いに」が簡潔で自然である。
- source_word: ἀπεκδυσάμενοι
  choice: 脱ぎ捨てたのですから
  rationale: 衣服を脱ぐ比喩とアオリスト分詞の完了した行為を表しつつ、文脈上有力な理由・根拠の関係を自然な日本語で示した。分詞そのものは関係を明示しないため、別解を脚注に残した。
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: 古い人
  rationale: 直訳的な表現を採り、次節の「新しい人」との対応、およびパウロの人間論的な対比を保持した。「古い自分」は分かりやすいが解釈を狭めるため脚注に示した。
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: その行いとともに
  rationale: σύνの随伴関係と、πρᾶξιςが指す行為・実践を簡潔に表した。「その」は「古い人」を受け、別個の男性個人を想起させにくい自然な日本語である。
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον の表現
  choice: 古い人
  alternative: 古い自分／古い人間
  rationale: 「新しい人」との対比を保ち、個人の内面的自己だけに意味を限定しないようにした。ただし、日本語での理解を助けるため「古い自分」を脚注の別訳として示した。
- issue: ἀπεκδυσάμενοι と主節の論理関係
  choice: 理由・根拠として「脱ぎ捨てたのですから」
  alternative: 「脱ぎ捨てて」または「脱ぎ捨てたので」
  rationale: 文脈上、この分詞は命令の根拠を示す可能性が高い。しかしギリシア語分詞自体には接続関係の幅があるため、その曖昧さを脚注で明示した。
translation_notes:
  register: 現代の一般読者に明瞭な丁寧体を用いながら、命令の厳粛さと衣服を脱ぐ比喩を保持した。「古い人」は日常語では年齢を連想させ得るため、脚注で意味を補った。
