id: COL.3.4
reference: Colossians 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: ja
  text: あなたがたのいのちであるキリスト[a]が現れるとき、あなたがたもまた、その方とともに栄光のうちに現れます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア（油注がれた者）」という称号に当たる。
    reason: lexical_alternative
  - marker: b
    text: 「現れます」は「明らかにされます」とも訳せる。原文では、キリストについても、あなたがたについても、同じ語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 〜とき
  rationale: 未来に期待される出来事を導く時の節として、自然な日本語で表した。
- source_word: ὁ Χριστὸς
  choice: キリスト
  rationale: 日本語で定着している称号表現を用いた。語源的には「メシア（油注がれた者）」に相当するため、脚注で示した。
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: 現れる／現れます
  rationale: 同じ動詞語根の反復を同じ日本語で保ち、公に見えるものとなるという意味を自然に表した。形態上は受動態だが、φανερόω の受動形は「現れる」という自動詞的意味を取り得る。
- source_word: ἡ ζωὴ ὑμῶν
  choice: すなわち、あなたがたのいのちである方
  rationale: 原文の同格「キリスト、あなたがたのいのち」を、日本語で関係が明瞭になるよう補足的に表した。
- source_word: τότε καὶ ὑμεῖς
  choice: あなたがたもまた
  rationale: καί の包含・強調と、明示された代名詞 ὑμεῖς の強調を自然に保持した。「とき」と主節の対応が明らかなため、τότε を重ねて「そのとき」とはしなかった。
- source_word: σὺν αὐτῷ
  choice: その方とともに
  rationale: キリストとの密接な共同・参与を表しつつ、尊称を用いた明瞭な日本語とした。
- source_word: ἐν δόξῃ
  choice: 栄光のうちに
  rationale: 前置詞句の形と、終末的な顕現の領域・様態の両義性を保った。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: 「キリスト」は日本語聖書・一般語として定着しているが、称号の意味が見えにくいため、「メシア」を脚注で併記して意味を保持した。
- issue: 「キリスト」と「あなたがたのいのち」の同格関係
  choice: すなわち、あなたがたのいのちである方
  alternative: キリスト、あなたがたのいのち
  rationale: キリスト自身が信徒のいのちであるという強い同一視を弱めず、現代日本語で読み取れる形にした。
- issue: 二つの受動形 φανερωθῇ / φανερωθήσεσθε の解釈
  choice: 両方を「現れる」で対応させる
  alternative: 「現される／明らかにされる」
  rationale: 同語反復を保持しつつ、日本語として自然にした。神的受動と断定せず、誰が顕現を引き起こすかは補わなかった。
- issue: ἐν δόξῃ の係り方
  choice: 「栄光のうちに」を文末に置く
  alternative: 「栄光に包まれて」
  rationale: キリストと信徒がともに現れることにかかる可能性を保ち、「栄光」の具体像を説明しすぎないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなたがた」で複数を明示し、「その方」によって指示対象を明確にした。原文の同格と動詞の反復を保ちつつ、不自然な逐語訳を避けた。
