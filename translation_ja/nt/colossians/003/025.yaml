  text: ὁ ⸀γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ οὐκ ἔστιν προσωπολημψία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: ja
  text: 不正を行う者は、自分が行った不正の報いを受けるからです。[a]そして、えこひいきはありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「自分が行った不正を受け取る」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「人を分け隔てすることはありません」。直訳的には「顔を受け入れることはない」、すなわち外見や地位によって判断しないという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: 不正を行う者は……からです
  rationale: 定冠詞付き現在分詞を、継続的・一般的に不正を行う者を指す名詞句として訳した。γάρは前節の勧めを根拠づけるため、文末の「からです」で自然に表した。
- source_word: κομίσεται
  choice: 報いを受ける
  rationale: この文脈では、自らの行為に応じたものを受け取るという応報的な意味を持つ。「報い」は日本語では良い意味にも悪い意味にもなり得るが、直前の「不正」によって否定的意味が明確になる。
- source_word: ὃ ἠδίκησεν
  choice: 自分が行った不正の
  rationale: 関係代名詞とアオリストを名詞句として自然に再構成し、ἀδικέωの反復を「不正」で保った。「自分が」は行為者本人への帰結であることを明瞭にする。
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: そこにえこひいきはありません
  rationale: προσωπολημψίαは外見や地位によって人を偏って扱うことを表す。「えこひいき」は現代日本語で明快であり、「そこに」によって裁き・応報における無差別性を示す。
theological_decisions:
- issue: 神の裁きと公平さの範囲
  choice: 不正を行う者への公平な応報という一般原則として訳す
  alternative: 終末の裁きだけを指す、または奴隷と主人の社会関係だけに限定する
  rationale: 本文は応報の仕組みや時期、主体を明示していないため、それらを補わず、広い道徳的・神学的警告としての緊張を保った。
- issue: προσωπολημψίαの含意
  choice: 地位や外面的立場によらない公平さを表す「えこひいき」
  alternative: 「人を分け隔てすること」「人を偏り見ること」
  rationale: 文脈上、奴隷か主人かという社会的地位も含み得るが、それだけに限定せず、語の一般的な意味を保った。
translation_notes:
  register: 明快な現代標準日本語を用い、警告としての厳粛さを保った。「不正」を反復して原文の語彙的連結を示しつつ、κομίσεταιは不自然な逐語訳を避けて「報いを受ける」とした。
