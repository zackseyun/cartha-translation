id: COL.3.1
reference: Colossians 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: ja
  text: ですから、もしあなたがたがメシア[b]とともによみがえらされたのなら[a]、上にあるものを求めなさい。そこでは、メシアが神の右に座っておられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたはメシアとともによみがえらされたのですから」とも訳せる。原文は条件の形を保っているが、文脈上、その条件が事実であることを前提としている可能性が高い。
    reason: alternative_reading
  - marker: b
    text: 「メシア」に当たるギリシア語は「クリストス」で、「油を注がれた者」という称号。伝統的には「キリスト」と訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: ですから、もし…のなら
  rationale: 推論を示す οὖν と条件を示す Εἰ の両方を保った。文脈上は条件が真であることを前提としている可能性が高いが、原文の条件形式を訳文から消さない。
- source_word: συνηγέρθητε
  choice: ともによみがえらされた
  rationale: アオリスト受動直説法二人称複数。受動態を明示し、συν- の共同・結合の意味は「メシアとともに」で自然に表した。
- source_word: τῷ Χριστῷ / ὁ Χριστός
  choice: メシア
  rationale: Χριστός の称号としての意味がこの文脈でも働いているため「メシア」とした。日本語で広く定着した「キリスト」も脚注に示した。
- source_word: τὰ ἄνω
  choice: 上にあるもの
  rationale: 冠詞付きの中性複数表現の広がりを保ち、「天上のもの」と限定的に説明しすぎない訳とした。
- source_word: ζητεῖτε
  choice: 求めなさい
  rationale: 現在命令形の基本的な語義を簡潔に表す。継続的な志向は文脈に委ね、「心を向けなさい」などの解釈的な言い換えを避けた。
- source_word: οὗ
  choice: そこでは
  rationale: 「上にある」領域を受ける場所の関係を、自然な日本語で明確にした。
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: 神の右に座っておられます
  rationale: 神の右という王権・高挙の比喩を保ちつつ、καθήμενος を「即位している」と解釈的に強めず「座っている」と訳した。
theological_decisions:
- issue: Εἰ の条件節が持つ力
  choice: 「もし…のなら」と条件形式を保つ
  alternative: 「…されたのですから」と事実を前提とする形にする
  rationale: 文脈上、パウロは読者がメシアとともによみがえらされたことを前提としていると考えられるが、ギリシア語自体は条件形式を用いている。神学的緊張を訳者が解消せず、本文と脚注の組み合わせで伝えた。
- issue: Χριστός の訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のようにのみ機能しているとは限らず、神の右にいる油注がれた者という称号性が意味を持つため「メシア」とした。伝統的な音写「キリスト」は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「よみがえらされた」によって神による受動的な行為を示し、「上にあるもの」「神の右」という原文の空間的・王権的表現を説明的に言い換えず残した。
