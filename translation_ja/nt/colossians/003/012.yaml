id: COL.3.12
reference: Colossians 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: ja
  text: ですから、神に選ばれた者、聖なる者、愛されている者として、深いあわれみ[a]、親切、謙遜、柔和[b]、忍耐[c]を身に着けなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あわれみのはらわた」。心の奥底から湧くあわれみを表す言い回し。
    reason: lexical_alternative
  - marker: b
    text: 「穏やかさ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「寛容」とも訳せる。ここでは特に、人に対して長く耐える態度を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: 身に着けなさい
  rationale: アオリスト中動態命令形。諸徳を衣服のようにまとう比喩を、現代日本語で自然に保つ。
- source_word: οὖν
  choice: ですから
  rationale: 前段を受けた推論・勧告のつながりを、明瞭で格調ある現代語で示す。
- source_word: ὡς
  choice: として
  rationale: 読者がその身分にふさわしく行動するという同一性・資格の意味を保ち、単に原因を表す『なので』とはしない。
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: 神に選ばれた者
  rationale: 神が選ぶ主体であることを明示しつつ、『選民』など特定の体系的含意を帯びやすい表現を避ける。
- source_word: ἅγιοι
  choice: 聖なる者
  rationale: 読者の身分を表す形容詞的な力と、聖別された者という神学的重みを保つ。
- source_word: ἠγαπημένοι
  choice: 愛されている者
  rationale: 完了受動分詞が示す、すでに愛され今もその状態にあることを自然な日本語で表す。
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: 深いあわれみ
  rationale: 字義的には『あわれみの内臓』で、心の奥からのあわれみを表す慣用句。日本語では身体部位を直訳せず、その深さを伝える。
- source_word: χρηστότητα
  choice: 親切
  rationale: パウロの徳目表における倫理的意味を、明快な現代日本語で表す。
- source_word: ταπεινοφροσύνην
  choice: 謙遜
  rationale: へりくだった心の姿勢を表す、自然で定着した現代語。
- source_word: πραΰτητα
  choice: 柔和
  rationale: 弱さではなく、抑制された穏やかさを表す徳として、日本語の聖書語彙にも一般語にも通じる語を採る。
- source_word: μακροθυμίαν
  choice: 寛容
  rationale: 特に他者に対して怒りを遅らせ、長く耐える態度を表すため、一般的な『忍耐』より対人的含意を伝えやすい。
theological_decisions:
- issue: ἐκλεκτοὶ τοῦ θεοῦが表す選び
  choice: 神に選ばれた者
  alternative: 神の選民
  rationale: 本文は神による選びという身分を述べるが、その仕組みや順序までは説明していない。語義を保ちつつ、後代の特定教派の選びの体系を訳文に持ち込まない。
- issue: ἅγιοι καὶ ἠγαπημένοιの統語上の位置づけ
  choice: 『神に選ばれた者』と並ぶ読者の身分として訳す
  alternative: 『神に選ばれた、聖なる、愛されている者』と一続きの修飾にする
  rationale: 三つはいずれも読者の神との関係における身分を示す。日本語では『者』を補って並列関係を明確にし、意味を過度に限定しない。
- issue: πραΰτηςの倫理的含意
  choice: 柔和
  alternative: 優しさ
  rationale: 単なる親しみやすさではなく、力を制御した穏やかな態度という道徳的重みを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告としての格調と衣服の比喩を保持した。徳目は名詞で統一し、原文の列挙構造を再現した。
