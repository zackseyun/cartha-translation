  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: ja
  text: なぜなら、あなたがたは死んだのであり、あなたがたのいのちは、メシア[a]とともに神のうちに隠されています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語「クリストス」は「メシア」とも「キリスト」とも訳せる称号です。
    reason: alternative_reading
  - marker: b
    text: 別訳「隠されたままです」。ギリシア語の完了形は、完了した行為の結果として今も続く状態を表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: あなたがたは死んだ
  rationale: アオリスト直説法二人称複数で、信じる者たちに起きた決定的な過去の出来事を表す。日本語では単純過去が自然であり、原文にない説明を加えない。
- source_word: γάρ
  choice: からです
  rationale: 前節の勧めの根拠を示す接続辞。日本語では文末の「からです」によって説明・理由の関係を明確かつ自然に表した。
- source_word: ἡ ζωὴ ὑμῶν
  choice: あなたがたのいのち
  rationale: ζωήの基本的な意味を保ち、文脈上の神学的内容を本文で説明的に補わない。「いのち」は単なる生存を超えた含みも自然に担える。
- source_word: κέκρυπται
  choice: 隠されています
  rationale: 完了受動直説法が示す、過去の行為によって生じた現在の継続状態を、自然な現代日本語の受動表現で示す。
- source_word: σὺν τῷ Χριστῷ
  choice: メシアとともに
  rationale: σύνの結合・伴いを「とともに」で表し、Χριστόςは「油注がれた者」という称号として「メシア」と訳した。
- source_word: ἐν τῷ θεῷ
  choice: 神のうちに
  rationale: ἐνが示す場所・領域の比喩を保つ。「神とともに」と変えず、原文の「神のうちに」という神学的緊張を保持した。
theological_decisions:
- issue: Χριστῷを称号として訳すか、慣用的な名称として訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所では油注がれた方との結びつきが語られており、称号の意味を明示する「メシア」を本文に採用した。ただし、日本語の教会用語として定着した「キリスト」も正当な訳語なので脚注に示した。
- issue: κέκρυπταιの完了形を行為と状態のどちらに重点を置いて表すか
  choice: 隠されています
  alternative: 隠されたままです
  rationale: ギリシア語完了形は完了した行為の結果として続く現在の状態を表し得る。本文では日本語として自然な現在状態を示し、代案で結果の継続をより明示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「いのち」は聖書的な響きを保ちながら一般読者にも理解できる表記とした。γάρは前節との論理関係を自然に示すため「からです」と文末で訳し、後半は独立した文として読みやすく整えた。
