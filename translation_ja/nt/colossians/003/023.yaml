lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: 何をするにしても
  rationale: 不定の関係表現とἐάνによる一般的・包括的な条件を、自然な現代日本語で表した。
- source_word: ἐκ ψυχῆς
  choice: 心を込めて
  rationale: 字義上は「魂から」だが、ここでは内面からの真実さと全身全霊の取り組みを表すため、日本語として明瞭な「心を込めて」とした。原語の比喩は脚注に残した。
- source_word: ἐργάζεσθε
  choice: 働きなさい
  rationale: 現在命令形の継続的な勧告を保ち、直前の「何をするにしても」を受けられる広い語として選んだ。
- source_word: ὡς τῷ κυρίῳ
  choice: 主に対してするように
  rationale: ὡςが示す行為の姿勢・方向づけを自然に表し、κύριοςはキリストを指す称号として「主」とした。
- source_word: καὶ οὐκ ἀνθρώποις
  choice: 人に対してではなく
  rationale: ἀνθρώποιςは性別を限定せず、人間を主との対比で示す。日本語の「人」がその一般的意味を自然に伝える。
theological_decisions:
- issue: 家の秩序に関する文脈でのκύριοςの訳
  choice: 主
  alternative: 主人
  rationale: 直近の文脈では奴隷と主人が扱われているため「主人」の含みも響き得るが、ここでは人間との対比に置かれたキリストへの称号として「主」が最も自然である。文脈上の語感は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「働きなさい」を反復し、誰に向けて働くかという対比を明確にした。
