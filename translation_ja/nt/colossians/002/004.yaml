id: COL.2.4
reference: Colossians 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: ja
  text: 私がこう言うのは、だれも、もっともらしい議論であなたがたを欺かないようにするためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「説得力のある話で」または「巧みな議論によって」。
    reason: πιθανολογίαには、もっともらしさと説得的な言論・論法の両面があるため。
lexical_decisions:
- source_word: τοῦτο λέγω
  choice: 私がこう言うのは
  rationale: τοῦτοは直前の発言または論旨を指す単数中性の指示語であり、「こう」とすることで範囲を限定しすぎず、λέγωの現在形も自然な現代日本語で表した。
- source_word: ἵνα μηδεὶς
  choice: だれも～ないようにするため
  rationale: ἵναの目的を明示しつつ、μηδεὶςの全面的な否定を自然な日本語の呼応表現で示した。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数であることを日本語で明示した。
- source_word: παραλογίζηται
  choice: 欺かない
  rationale: 誤った推論や論法によって相手を惑わし、欺く意味を、文脈に合う明瞭な現代日本語で表した。単なる誤解や一般的な迷いに弱めなかった。
- source_word: ἐν πιθανολογίᾳ
  choice: もっともらしい議論で
  rationale: ἐνの手段・様態を「で」で示し、πιθανολογίαが表す、一見納得できそうで人を説き伏せる言論を「もっともらしい議論」とした。議論が実際に正しいとは含意しない表現である。
theological_decisions:
- issue: παραλογίζηται ἐν πιθανολογίᾳが警告する対象
  choice: もっともらしい議論による欺き一般への警告として訳す
  alternative: 特定の偽りの哲学、または単なる雄弁への警告と限定する
  rationale: この節自体は特定の思想体系を名指しせず、人を納得させそうな言論による欺きを広く警告しているため、文脈以上の教理的対象を訳文に持ち込まなかった。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、パウロの警告の直接性と落ち着いた品位を保った。「あなたがた」で複数の宛先を明示した。
