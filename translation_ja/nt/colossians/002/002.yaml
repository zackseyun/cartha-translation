reference: Colossians 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: ja
  text: それは、彼らの心が励まされ、彼らが愛のうちに結び合わされて[a]、理解による十分な確信のあらゆる豊かさに達し、神の奥義、メシアを知る[b][c][d]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「結び合わされて」は、「一つにされて」とも訳せる。この動詞は、人々が集められ、緊密に結ばれることを表しうる。
    reason: lexical_alternative
  - marker: b
    text: 「知る」と訳したギリシア語は、文脈によって「深く知る」「十分に知る」という強い意味を帯びることがある。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「神の奥義、メシア」。ギリシア語は簡潔で解釈の難しい表現である。「メシア」を「神の奥義」と同格に理解する読みが有力だが、原文はその関係を明示していない。
    reason: alternative_reading
  - marker: d
    text: 写本によっては、「神、すなわち父とメシアの奥義」など、より長い読みがある。本文は提示されたギリシア語の短い読みに従った。
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: 励まされ
  rationale: 慰めだけに限定せず、内面を力づけ確かなものにするという文脈上の広がりを自然な日本語で表す。
- source_word: καρδίαι
  choice: 心
  rationale: 人の内面を指す聖書的な比喩を保ちつつ、現代日本語として自然である。
- source_word: συμβιβασθέντες
  choice: 結び合わされて
  rationale: ここでは教えられるという意味よりも、続く「愛のうちに」と調和する、互いに一つに結ばれるという関係的な意味が適切である。
- source_word: ἐν ἀγάπῃ
  choice: 愛のうちに
  rationale: 愛が彼らの一致の領域または絆であることを表す。
- source_word: εἰς πᾶν πλοῦτος
  choice: あらゆる豊かさに達し
  rationale: εἰς が示す目標・到達点を「達し」で表し、πλοῦτος の比喩的な豊かさを保持する。
- source_word: πληροφορίας τῆς συνέσεως
  choice: 理解による十分な確信
  rationale: 属格関係を過度に限定せず、理解に伴う満ちた確信という意味を明瞭に表す。
- source_word: ἐπίγνωσιν
  choice: 知る
  rationale: 日本語の名詞の連続を避けて自然にしつつ、対象を確かに認識する意味を伝える。強意の可能性は脚注に示す。
- source_word: μυστηρίου
  choice: 奥義
  rationale: かつて隠され、今や示された神の目的を指すパウロ的用法を保つ。「秘密」よりも神学的文脈に適する。
- source_word: θεοῦ, Χριστοῦ
  choice: 神の奥義、すなわちメシア
  rationale: 短く圧縮されたギリシア語を、Χριστοῦ が「奥義」を同格的に説明するとの理解に基づいて自然な日本語にする。ただし原文の簡潔さと解釈上の余地は脚注で明示する。
theological_decisions:
- issue: τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ における同格関係
  choice: 神の奥義をメシアと同格に理解し、「神の奥義、すなわちメシア」と訳す。
  alternative: 「神の奥義、メシア」と原文の圧縮された形をそのまま残す。または異読に従い「父なる神とメシアの奥義」などとする。
  rationale: 提示された短い本文では Χριστοῦ が「神の奥義」を同格的に特定すると読むのが最も自然である。一方、「すなわち」はギリシア語に明記されていないため、その点を脚注で示して曖昧さを隠さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「奥義」と「メシア」は本文の神学的語彙を保持し、それ以外は名詞句の過度な連鎖を避けて普通の読者にも理解しやすくした。
