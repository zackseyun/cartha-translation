reference: Colossians 2:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: ja
  text: ですから、あなたがたが主であるメシア・イエス[a]を受け入れたように、その方にあって歩みなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「キリスト・イエス」。
    reason: Χριστόςを称号として訳した「メシア」に対する、慣用的な名称形の代替訳。英語POB監査記録の注記にも対応する。
lexical_decisions:
- source_word: Ὡς οὖν
  choice: ですから、…のですから
  rationale: οὖνの推論を冒頭の「ですから」で示し、ὡςが表す、受け入れたことを基準とするつながりを日本語の「…のですから」で自然に表した。両語の機能が日本語では重なるため、逐語的な重複より明瞭さを優先した。
- source_word: παρελάβετε
  choice: 受け入れた
  rationale: アオリスト直説法として過去の受領を示す。教えを伝授された意味もあり得るが、目的語が人格的な「主であるメシア・イエス」であるため、「受け入れた」が自然であり、人格的受容と教えの受領の両面を排除しない。
- source_word: τὸν Χριστὸν Ἰησοῦν τὸν κύριον
  choice: 主であるメシア・イエス
  rationale: 冠詞を伴うΧριστόςの称号性を「メシア」で示し、Ἰησοῦνは固有名として「イエス」とした。τὸν κύριονは同格的にイエスを「主」と特定するため、「主である」と結び付けた。
- source_word: ἐν αὐτῷ
  choice: その方にあって
  rationale: パウロ特有の結合・領域を示す簡潔な表現を保ち、「その方と一つになって」などと解釈的に限定しない。「彼にあって」より現代日本語で指示対象が明瞭で、敬意ある表現とした。
- source_word: περιπατεῖτε
  choice: 歩みなさい
  rationale: 現在命令形の継続的な生き方への命令を表し、行動・生活を歩行にたとえるパウロの比喩を保持した。単なる「生きなさい」より原文の像を残す。
theological_decisions:
- issue: Χριστόςを称号として訳すか、慣用的な名称として音写するか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: この構文ではΧριστόςに冠詞があり、続くἸησοῦνおよびτὸν κύριονとともに称号的な力が明瞭であるため、意味を訳して「メシア」とした。日本語では「メシア・イエス」で称号と固有名の結び付きを簡潔に表せる。
- issue: ἐν αὐτῷの結合言語
  choice: その方にあって
  alternative: その方と結ばれて
  rationale: 原文は簡潔で、領域・関係・結合という含意を持ち得る。「その方にあって」はその神学的な広がりを保ち、特定の説明に狭めない。
- issue: ὡςと命令の関係
  choice: 受け入れたのですから、その方にあって歩みなさい
  alternative: 受け入れたとおりに、その方にあって歩みなさい
  rationale: ὡςには比較の力があるが、この文ではοὖνと結び、過去の受容を現在の歩みの根拠・基準として提示する。「のですから」は自然な日本語で論理的連続を示す一方、厳密な様態の一致だけに限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「メシア」「主」「その方にあって」「歩む」という聖書的・神学的語彙を保った。複数二人称は「あなたがた」と明示し、命令は dignified かつ直接的な「歩みなさい」とした。
