reference: Colossians 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: ja
  text: だれかが、哲学とむなしい欺きによって、あなたがたを捕らわれの身にしないように注意しなさい。それは人間の言い伝えと、この世の根本的な諸原理[a]に従うものであって、キリストに従うものではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この世の霊的諸力」とも訳せる。ギリシア語の表現は、世界の基本原理や構成要素を指す場合と、宇宙的な霊的諸力を指す場合がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: だれかが……しないよう、注意しなさい
  rationale: 命令形による警告を、現代日本語で自然な注意喚起として表した。μή τις が示す、起こり得る脅威も保持している。
- source_word: ἔσται ὁ συλαγωγῶν
  choice: 捕らわれの身にする
  rationale: 戦利品として連れ去るという συλαγωγέω の比喩を、過度に具体化せず明瞭に伝える。
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: 哲学やむなしい欺きによって
  rationale: διά の手段の意味と、φιλοσοφία と κενὴ ἀπάτη の並列を保持した。「哲学」を「むなしい欺き」と同格に限定する解釈は本文に持ち込まない。
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: 人間の言い伝えに従い
  rationale: κατά の規準・一致の意味を「従う」で表し、ἀνθρώπων は性別を限定しない「人間」とした。
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: この世の根本原理に従う
  rationale: στοιχεῖα の「基本的な原理・構成要素」という語義を本文に採りつつ、霊的諸力を指す可能性は脚注に残した。
- source_word: οὐ κατὰ Χριστόν
  choice: キリストに従わない
  rationale: 日本語で定着した称号「キリスト」を用い、κατά の対照を明確に表した。
theological_decisions:
- issue: στοιχεῖα τοῦ κόσμου の意味
  choice: この世の根本原理
  alternative: この世を支配する霊的な力
  rationale: パウロ書簡におけるこの句は、世界の基本原理・構成要素とも宇宙的な霊的諸力とも理解できる。本文では比較的広い「根本原理」を用い、人格的な霊的存在とする重要な別解を脚注に示して曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、警告としての厳粛さを保った。長い修飾関係は原文の論理的対照を崩さない範囲で整理し、「言い伝え」「捕らわれの身」など一般読者に理解しやすい表現を選んだ。
