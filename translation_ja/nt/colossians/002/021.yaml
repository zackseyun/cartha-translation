  text: Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/021.yaml
  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: ja
  text: 「手に取るな[a]。味わうな。触れるな。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「触れるな」。最初の動詞（ἅψῃ）は「触れる」「つかむ」とも訳せるが、後のθίγῃς（「触れる」）との違いを示すため、ここでは「手に取る」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ἅψῃ
  choice: 手に取るな
  rationale: ἅπτωの中動態は「触れる」「つかむ」の意味を持つ。後のθίγῃςとの語の違いを保ちつつ、現代日本語で簡潔な禁止命令とするため「手に取るな」とした。
- source_word: μηδὲ
  choice: ～な。
  rationale: 反復される否定接続詞の累加的な力を、三つの短い禁止文を並べることで自然な日本語に表した。
- source_word: γεύσῃ
  choice: 味わうな
  rationale: γεύομαιの基本義「味わう」をそのまま保ち、「食べる」などに意味を狭めなかった。
- source_word: θίγῃς
  choice: 触れるな
  rationale: θιγγάνωの通常の意味である「触れる」を採用し、最初のἅψῃを「手に取る」とすることで二つの動詞を区別した。
theological_decisions:
- issue: 文脈中の禁止規定の性質
  choice: 解説を加えず、引用のような三つの禁止命令として訳す。
  alternative: 「これを手に取るな、あれを味わうな」のように対象を補う、または人間の規定であることを本文中に明示する。
  rationale: ギリシア語本文は対象を示さない簡潔な禁止命令だけで構成されているため、その唐突さと解釈上の余地を保った。
translation_notes:
  register: 簡潔で強い禁止の連続を、現代標準日本語の常体で表現した。原文の反復的なリズムと引用句のような唐突さを保つため、各命令を短文として区切った。
