id: COL.2.12
reference: Colossians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: ja
  text: あなたがたは、洗礼においてキリストと共に葬られ、その洗礼[a]において、死者の中からキリストをよみがえらせた神の働きへの信仰[b]を通して、またキリストと共によみがえらされたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストにあって」とも訳し得る。この場合、関係代名詞は洗礼ではなくキリストを指す。
    reason: alternative_reading
  - marker: b
    text: 「神の働きへの信頼を通して」とも訳せる。ここで「信仰」と訳したギリシア語には、「信頼」の意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: キリストと共に葬られ
  rationale: アオリスト受動分詞と συν- の共同性を自然な日本語で表した。指示対象は文脈上キリストであり、日本語では代名詞より固有の指示を補う方が明確である。
- source_word: ἐν τῷ βαπτισμῷ
  choice: 洗礼において
  rationale: ἐν の場所・手段の重なりを一方に限定せず、格調を保った自然な表現とした。
- source_word: ἐν ᾧ
  choice: その洗礼において
  rationale: 直近の先行詞 βαπτισμῷ を受ける解釈を本文に採用し、日本語で指示関係を明確にした。キリストを指す可能性は脚注に残した。
- source_word: συνηγέρθητε
  choice: キリストと共によみがえらされた
  rationale: 受動態と συν- の『共に』を明示し、キリストとの結合という文脈を保った。
- source_word: διὰ τῆς πίστεως
  choice: 信じる信仰によって
  rationale: πίστις の基本的な訳語『信仰』を保ちつつ、後続する属格との関係が神の働きへの信頼であることを現代日本語で分かりやすく示した。
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: 神の働き
  rationale: ἐνέργεια を抽象的な能力だけでなく実際に働く力・活動として表し、簡潔で自然な日本語にした。
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: キリストを死者の中からよみがえらせた
  rationale: 神を修飾する分詞句として訳し、ἐκ νεκρῶν の復活表現を自然に保持した。αὐτόν の指示対象は日本語で明確にするため『キリスト』とした。
theological_decisions:
- issue: ἐν ᾧ の指示対象
  choice: 洗礼を指す『その洗礼において』
  alternative: キリストを指す『キリストにあって』
  rationale: 直近の文法的先行詞は βαπτισμῷ であり、構文上これが最も自然である。ただし関係代名詞の形と広い文脈からキリストを指す可能性もあるため、脚注で保持した。
- issue: 洗礼とキリストとの結合の関係
  choice: 洗礼、共に葬られること、共によみがえらされること、信仰を本文どおり密接に結び付ける
  alternative: 秘跡的効力だけを強調する解釈、または純粋な象徴だけに限定する解釈
  rationale: ギリシア語の強い結び付きを弱めず、同時に後代の教派的な効力論を本文へ持ち込まないため。
- issue: πίστις と神の ἐνέργεια の関係
  choice: 神の働きを信じる信仰
  alternative: 神が生み出す信仰、または神の働きそのものの忠実さ
  rationale: 属格は神の働きを信仰の対象として理解するのが文脈上自然であるが、πίστις には『信頼』の含みもあるため脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。『よみがえる』は伝統的に理解されやすい表現として採用し、教派固有の洗礼理解は加えていない。すべての脚注記号を本文に配置した。
