id: COL.2.16
reference: Colossians 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: ja
  text: ですから、だれも、食べ物や飲み物のことで[b]、また、祭り、新月、安息日のことで[c]、あなたがたを裁いてはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれもあなたがたについて判断を下してはなりません」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: すなわち、食べ物や飲み物に関する規定のことです。
    reason: cultural_note
  - marker: c
    text: 「祭り、新月、安息日」という順序は、ユダヤの聖なる暦における年ごと、月ごと、週ごとの行事を思わせます。
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: ですから、だれにも……させてはなりません
  rationale: οὖνの推論的なつながりを「ですから」で示し、μή＋現在命令形と不定代名詞τιςによる禁止を、自然な日本語の「だれにも……させてはなりません」で表した。
- source_word: ὑμᾶς κρινέτω
  choice: あなたがたを裁かせてはなりません
  rationale: κρίνωがここでは、飲食や暦上の遵守を基準に評価し、非難することを指すため、「裁く」を採用した。断罪に限定しすぎず、原文の幅を保つ。
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: 食べ物や飲み物のことで
  rationale: βρῶσιςとπόσιςは行為としての「食べること、飲むこと」も意味し得るが、この列挙では飲食上の事柄・規定というカテゴリーを指すと判断した。反復するἐνは日本語では「ことで」にまとめた。
- source_word: ἐν μέρει ἑορτῆς
  choice: 祭り……のことで
  rationale: ἐν μέρειはここでは「一部分において」ではなく「〜に関して」の慣用表現。ἑορτήは宗教的な祝祭を表す。
- source_word: νουμηνίας
  choice: 新月の祭り
  rationale: 月ごとの新月日に行われる宗教的行事を指すことが読者に明瞭になるよう、「新月」だけでなく「新月の祭り」とした。
- source_word: σαββάτων
  choice: 安息日
  rationale: ギリシア語は複数形だが、日本語では制度・反復的遵守を表す「安息日」が自然であり、祭り・新月・安息日という年次・月次・週次の配列も保たれる。
theological_decisions:
- issue: 列挙された慣行に対する本節の主張範囲
  choice: 飲食および暦上の遵守を理由に、他者が信徒を裁くことを禁じる表現とした。
  alternative: これらの慣行そのものが全面的に廃止された、または本節が人為的・禁欲的規定だけを扱う、と明示する。
  rationale: 本節は直接には、これらの事柄に関して「裁かせてはならない」と命じている。それらの遵守自体の有効性や継続性をこの一節だけで断定せず、神学的な緊張を保った。
- issue: 「祭り、新月、安息日」の関係
  choice: ユダヤの年次・月次・週次の聖なる暦を響かせる並列として訳した。
  alternative: 三項を一般的な休日・天体現象・休息日の意味に弱める。
  rationale: この三項の組み合わせは聖書に見られる祭儀暦の定型的な配列を反映しているため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保った。「裁く」は簡潔で伝統的にも理解しやすいが、評価・非難を含む語義の幅は脚注で補った。脚注記号は該当句の直後に配置し、主文末の[a]で訳語の代案を示した。
