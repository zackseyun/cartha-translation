id: COL.2.3
reference: Colossians 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: ja
  text: この方のうちには、知恵と知識のすべての宝が隠されています[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その奥義のうちには」とも訳せる。関係代名詞の先行詞を、キリストご自身ではなく、より広く「神の奥義」と取る場合。
    reason: alternative_reading
  - marker: b
    text: 「蓄えられています」とも訳せる。ギリシア語の形容詞には、隠されていること、または取っておかれていることを示す含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: この方のうちには
  rationale: 関係代名詞は直前の人格的指示対象であるキリストを受けるのが最も自然であり、ἐν の場所的な含みも保つ。「この方」は明瞭で尊敬を保った現代日本語である。
- source_word: πάντες οἱ θησαυροὶ
  choice: すべての宝
  rationale: 冠詞を伴う複数形の包括的・集合的な意味を自然な日本語で表し、パウロの全面的な主張を保つ。
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: 知恵と知識の
  rationale: σοφία と γνῶσις を区別された関連語として、そのまま二語で表す。
- source_word: ἀπόκρυφοι
  choice: 隠されています
  rationale: 「隠された」という基本義を保ちつつ、εἰσιν と述語形容詞から成る状態を自然な日本語で表す。秘密性か蓄えられた状態かを訳文だけで断定しない。
theological_decisions:
- issue: ἐν ᾧ の先行詞を人格的なキリストとするか、より広く「神の奥義」とするか
  choice: 本文では人格的なキリストを受けて「この方のうちには」とした。
  alternative: 「その奥義のうちには」または「そこには」
  rationale: 直前の最も近い指示対象はキリストであり、文法上も自然である。ただし広い先行詞理解も可能なので脚注に残す。
- issue: ἀπόκρυφοι が秘教的な隠蔽を指すか、キリストのうちに安全に蓄えられていることを指すか
  choice: 中立的に「隠されています」とした。
  alternative: 「蓄えられています」
  rationale: 語自体は隠されていることにも、取っておかれていることにもなり得るため、知恵が信者に到達不能なのか、利用可能な形で保たれているのかを訳文で決めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」によって人格的な先行詞を自然に示し、「〜のうちには」で原文の位置的表現を保った。脚注記号は該当する「隠されています」の直後に配置した。
