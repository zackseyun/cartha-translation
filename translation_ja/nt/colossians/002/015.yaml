  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: ja
  text: 神は、支配者たちと権威者たちを武装解除し、公然とさらし、キリストにおいて彼らを凱旋行列に引き連れました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: 武装を解き
  rationale: 文脈では敵対する霊的諸勢力から力や武具を奪うことを表すと理解し、「武装を解除し」より自然で力強い表現とした。ただし、この中動態には「脱ぎ捨てて」という理解の余地もある。
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: 支配者たちと権威ある者たち
  rationale: パウロ書簡で超自然的な諸勢力を指し得る語を、過度に説明せず原文の称号に沿って訳した。
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: 公然とさらし
  rationale: 見せ物として公に示すという屈辱的な含意を簡潔に伝える。
- source_word: θριαμβεύσας αὐτούς
  choice: 彼らを凱旋行列に引き連れ
  rationale: ローマの凱旋行列で捕虜を連れ歩く比喩を明確にし、単に「勝利した」とするより原語の像を保った。
theological_decisions:
- issue: 動作の主語
  choice: 「神は」を補った
  alternative: 主語を明示せず、キリストを主語として読む
  rationale: 2章12～13節で一連の動作の主語は神であり、14節から続く分詞も神を主語とするのが統語的に自然である。ただし、本節単独ではキリストを主語と理解する解釈も知られている。
- issue: ἐν αὐτῷ の指示対象
  choice: 「この方において」
  alternative: 「それによって」、すなわち十字架によって
  rationale: 男性として理解すればキリストを指す表現となり、英語POBの監査済み判断とも一致する。一方、形態上は中性も可能で、直前の十字架を指す解釈を排除できないため脚注で保持した。
translation_notes:
  register: 現代の一般読者に通じる明瞭で格調ある文体を用いた。「凱旋行列に引き連れ」で古代の勝利の情景を保ちつつ、説明的になりすぎないようにした。
