  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: ja
  text: この方にあって、あなたがたもまた、人の手によらない割礼を受けました。それは、肉の体を脱ぎ捨てることにおける、メシアの割礼です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアの割礼」は、メシアが施す割礼、メシアに属する割礼、またはメシアと結びついた割礼を意味し得ます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: この方にあって
  rationale: 関係代名詞の先行詞であるメシアを指す。メシアとの結びつきを表すἐνの含意を保ちつつ、現代日本語で明瞭にした。
- source_word: περιετμήθητε
  choice: 割礼を受けました
  rationale: アオリスト受動直説法を、完了した受動的出来事として素直に訳した。比喩を説明的に言い換えず、割礼という語を保持した。
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: 人の手によらない割礼
  rationale: 人間が施す儀礼ではないことを示すἀχειροποίητοςの聖書的対比を、自然な日本語で表した。
- source_word: ἐν τῇ ἀπεκδύσει
  choice: 脱ぎ捨てることで
  rationale: ἀπέκδυσιςが持つ、衣を脱ぐように取り去る比喩を保持した。ここでのἐνは、その割礼の内容またはあり方を説明するものとして訳した。
- source_word: τοῦ σώματος τῆς σαρκός
  choice: 肉の体
  rationale: 難解な属格連鎖を簡潔に保ち、単なる肉体か、肉に特徴づけられた存在かを断定しないようにした。
- source_word: σάρξ
  choice: 肉
  rationale: 「罪深い性質」などと解釈的に限定せず、パウロの語彙と意味の幅を保った。
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: メシアの割礼によるもの
  rationale: Χριστόςを称号として「メシア」と訳した。ἐνの手段的な含意を自然な日本語にしつつ、属格が行為者・所属・関連のいずれを表すかは本文だけでは決めず、注で示した。
theological_decisions:
- issue: 「メシアの割礼」の意味
  choice: 本文では「メシアの割礼」として開かれた属格表現を保持する
  alternative: メシアが施す割礼／メシア自身が受けた割礼／メシアに属する割礼
  rationale: τοῦ Χριστοῦは複数の関係を表し得るため、一つの教理的解釈に固定せず、注で可能性を示した。
- issue: 「肉の体」の意味
  choice: 「肉の体」と訳す
  alternative: 肉的な体／罪深い性質／肉に支配された存在
  rationale: τοῦ σώματος τῆς σαρκόςの解釈上の難しさを保ち、後代の異読や特定の人間論を本文に持ち込まないため。
translation_notes:
  register: 明瞭で格調ある現代標準語。「この方」で直前のメシアを受け、「にあって」により結びつきの含意を保持した。長いギリシア語構文は二文に分け、意味関係を読み取りやすくした。
