id: COL.2.1
reference: Colossians 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: ja
  text: というのは、私は、あなたがたのため、ラオディキアにいる人々のため、そして私と直接会ったことのない[a]すべての人々のために、どれほど大きな苦闘をしているかを、あなたがたに知ってほしいのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉において私の顔を見たことのない」。ここで「肉において」は、身体をもって、すなわち直接会うという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: 知ってほしいのです
  rationale: θέλω＋対格＋不定詞を自然な現代日本語にした。γάρは前節との理由・説明のつながりを示すが、日本語では文末の「のです」によってその説明的な連続性を表した。
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: どれほど激しく奮闘しているか
  rationale: ἡλίκονの程度の大きさと、ἀγώνの厳しい努力・闘いの比喩を、自然な日本語で一体的に表現した。単なる心理的な「苦悩」に限定しない。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがた…のために
  rationale: ὑπέρが示す、相手のため・利益のためという方向性を保持した。
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ラオディキアにいる人々
  rationale: 冠詞付き前置詞句の名詞的用法を明確で自然な日本語にした。
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: 見たことのないすべての人々
  rationale: ὅσοιの包括性を「すべて」で示し、完了形ἑόρακανは現在までの経験の欠如として「見たことのない」とした。
- source_word: τὸ πρόσωπόν μου
  choice: 私の顔
  rationale: πρόσωπονの具体的表現を保持し、解釈的な「私に直接」へ置き換えなかった。
- source_word: ἐν σαρκί
  choice: 肉において
  rationale: σάρξの字義を保持した。この箇所では罪深い性質ではなく、身体を伴う現実の対面を指す。
theological_decisions:
- issue: 非比喩的文脈におけるσάρξの訳
  choice: 肉において
  alternative: 直接会って／実際に
  rationale: 身体的・物理的な臨在を指す字義的表現を本文に残し、道徳的な「罪の性質」という意味を持ち込まないため。日本語ではやや硬いが、原文の表現と神学的な語彙上の緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を基本としつつ、書簡としての品位を保った。「肉において」は原文に即して意図的に字義的な表現とした。
