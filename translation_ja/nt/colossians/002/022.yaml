  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: ja
  text: これらはすべて、使えばなくなるものです[a]。それらに関する規定は、人間の戒めと教えに従ったものです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これらはみな、使うとなくなってしまうものです」。原文は、規制の対象となる物が一時的で、使用・消費によってなくなることを簡潔に述べています。
    reason: lexical_alternative
  - marker: b
    text: 「人間の戒めと教え」は、イザヤ29章13節を踏まえた表現と考えられます。これらの規定が神ではなく人間に由来することを強調しています。
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: これらはすべて……ものです
  rationale: 中性複数の関係代名詞は前節で禁じられた物にさかのぼる。日本語では指示語を用いて自然に受け、複数全体を指すことを「すべて」で示した。
- source_word: εἰς φθορὰν τῇ ἀποχρήσει
  choice: 使えばなくなる
  rationale: φθοράは滅び・消滅を、ἀπόχρησιςは使用または使い尽くすことを表す。この文脈では、対象が使用・消費に伴ってなくなるという意味を、明瞭な現代日本語で表した。
- source_word: κατὰ
  choice: に基づく
  rationale: 規定の基準または由来を示すκατάの働きを自然な日本語で表した。
- source_word: ἐντάλματα καὶ διδασκαλίας
  choice: 戒めと教え
  rationale: 規制的な「戒め」と一般的な「教え」の区別を保ち、イザヤ29章13節を思わせる聖書的な語調も残した。
- source_word: τῶν ἀνθρώπων
  choice: 人間の
  rationale: 性別ではなく神との対比における人間的由来が焦点であるため、包括的で自然な「人間の」とした。
theological_decisions:
- issue: 禁じられた物と人間的規定との関係
  choice: 使用すればなくなる物を述べた後、その規制が人間の戒めと教えに基づくことを示す
  alternative: 規制そのものが、使用とともに滅びる事柄に関するものだと一層強く読む
  rationale: ギリシア語はまず前節の禁止対象を受けてその一時性を述べ、次に規定の人間的性格を示すのが自然である。ただし、批判の重点が対象と規定のどちらにあるかを必要以上に限定しない表現にした。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、「戒めと教え」によって聖書的で品位ある語調を保った。「滅びる」よりも、消費される物について自然な「なくなる」を採用した。
