id: COL.2.19
reference: Colossians 2:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: ja
  text: そして、その人は、かしらにしっかり結びついていません[a]。このかしらから、からだ全体が、関節と靱帯を通して必要なものを与えられ、一つに結び合わされて[b]、神からの成長をもって成長していくのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「かしらにしっかりすがっていません」。
    reason: κρατέω は、固くつかむこと、また堅く結びついて離れないことを表しうる。
  - marker: b
    text: 別訳「関節と靱帯を通して養われ、しっかり組み合わされて」。
    reason: 二つの受動分詞には、供給・養育と、結合・統合という意味の幅がある。
  - marker: c
    text: 直訳「神の成長を増し加える」。ここでは、神から来る成長をするという意味と考えられる。
    reason: 「神の」という属格とギリシア語の同語反復を示しつつ、本文では神を成長の源とする文脈上有力な意味を自然な日本語で表す。
lexical_decisions:
- source_word: κρατῶν
  choice: しっかり結びついて
  rationale: 単に触れたり持ったりするのでなく、比喩的に固くつながり続けることを表す。日本語では文脈上「しっかり結びつく」が自然である。
- source_word: κεφαλήν
  choice: かしら
  rationale: 身体の比喩を保ちつつ、文脈上キリストを指す伝統的で明瞭な表現。「頭」よりも人格的な指導者・源としての含みを伝えやすい。
- source_word: ἐξ οὗ
  choice: このかしらから
  rationale: 男性単数の関係代名詞が直前の「かしら」を受け、からだの供給と結合の源を示す。日本語では先行詞を繰り返すことで関係を明確にした。
- source_word: πᾶν τὸ σῶμα
  choice: からだ全体
  rationale: 一つのからだを構成する全体という集合的意味を自然な日本語で表す。
- source_word: ἁφῶν
  choice: 関節
  rationale: 接触点・結合部を意味しうる語であり、身体比喩では「関節」が最も自然。
- source_word: συνδέσμων
  choice: 靱帯
  rationale: 結び合わせるものを指し、身体比喩では「靱帯」が明確で現代的である。
- source_word: ἐπιχορηγούμενον
  choice: 必要なものを与えられ
  rationale: 受動分詞が表す供給・支援を広く保ち、「養われる」だけに限定しない。
- source_word: συμβιβαζόμενον
  choice: 一つに結び合わされて
  rationale: 諸部分が統合され、まとまりを持つようになる受動的な過程を表す。
- source_word: αὔξει
  choice: 成長を遂げる
  rationale: 身体比喩を保ちながら、同語反復を含むギリシア語の構文を自然な日本語にする。
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: 神による成長
  rationale: 属格を神がもたらす成長という起源・作用主体の意味に取りつつ、脚注で直訳の曖昧さも示す。
theological_decisions:
- issue: τὴν αὔξησιν τοῦ θεοῦ における属格の意味
  choice: 神による成長
  alternative: 神の成長／神から来る成長
  rationale: 神ご自身が成長するという意味を避け、からだの成長を神がもたらすという文脈上有力な理解を本文に採用した。ただしギリシア語の属格は簡潔で複数のニュアンスを持ちうるため、直訳を脚注に残した。
- issue: 「かしら」の指示対象
  choice: 本文では固有名を補わず「かしら」とする
  alternative: キリスト
  rationale: 文脈ではキリストを指すが、この節の比喩表現をそのまま保ち、解釈上の固有名補足を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、教会を身体として描く比喩を保持した。「かしら」「からだ」は比喩上の対応を見えやすくするため平仮名表記とし、文脈上省略されている主語は前節とのつながりを明らかにするため「その人」と補った。
