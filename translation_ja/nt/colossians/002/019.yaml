revisions:
- from: そして、その人は、かしらにしっかり結びついていません[a]。このかしらから、からだ全体は、関節と靱帯を通して必要なものを与えられ、一つに結び合わされて[b]、神による成長を遂げるのです[c]。
  to: そして、その人は、かしらにしっかり結びついていません[a]。このかしらから、からだ全体が、関節と靱帯を通して必要なものを与えられ、一つに結び合わされて[b]、神からの成長をもって成長していくのです[c]。
  rationale: 「神による成長」を「神からの成長をもって成長していく」に改め、τοῦ θεοῦ を神が成長の源であることを示す属格として、過度に限定せず自然に訳した。また、主語を「からだ全体が」として文のつながりを整え、脚注cは原文の同語反復と能動形をより正確に説明するよう修正した。
