  terminology: 「かしら」「からだ」はこの比喩の対応を保つ表現として適切であり、キリストという固有名を補わない判断も原文に忠実である。「関節と靱帯」も明確である。脚注cの「直訳」は、αὔξει の能動形と同語反復をより正確に示すよう改める。
