id: COL.2.7
reference: Colossians 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: ja
  text: その方にあって根づかされ、築き上げられ、教えられたとおり、信仰[a]において確かな者とされ、感謝にあふれて歩みなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼において」とも訳せる。また、「忠実さにおいて」の意味に取ることもできる。ギリシア語ピスティスには、信仰、信頼、忠実さという意味があり得るが、ここでは「教えられたとおり」とあるため、教えとして受けた信仰を指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: 根づかされ
  rationale: 完了受動分詞が示す、すでに根づかされて今もその状態にあるという意味を保ち、植物の比喩も残した。
- source_word: ἐποικοδομούμενοι
  choice: 築き上げられ
  rationale: 現在受動分詞の継続的な働きを表し、植物から建築へ移る原文の比喩もそのまま伝える。
- source_word: ἐν αὐτῷ
  choice: この方のうちに
  rationale: 直前の文脈でキリストを指す代名詞を、固有名や称号に置き換えず、敬意を保つ自然な日本語にした。
- source_word: βεβαιούμενοι
  choice: 堅くされ
  rationale: 受動の形を保ちながら、確かなものとされる、揺るがないものとされるという文脈上の意味を簡潔に表した。
- source_word: τῇ πίστει
  choice: 信仰に
  rationale: 定冠詞と後続の『教えられたとおり』から、教えられた信仰の内容または領域を指す可能性が高い。ただし日本語で『その信仰』と限定しすぎず、原語の意味の幅は脚注に示した。
- source_word: καθὼς ἐδιδάχθητε
  choice: 教えられたとおり
  rationale: 比較を示す καθώςと受動態を、明快で自然な日本語で直接表した。
- source_word: περισσεύοντες
  choice: あふれながら
  rationale: 現在分詞が表す継続と、豊かに満ちるという生き生きした比喩を保った。
- source_word: ἐν εὐχαριστίᾳ
  choice: 感謝に
  rationale: εὐχαριστίαを『感謝』とし、περισσεύοντεςとの結びつきを自然な日本語の『感謝にあふれる』で表した。
theological_decisions:
- issue: τῇ πίστει の意味
  choice: 教えられた信仰の内容または領域を主に指す『信仰に』
  alternative: 個人の信頼において／真実さにおいて
  rationale: 定冠詞を伴うことと『教えられたとおり』という句は、内面的な信頼だけでなく、教えとして受けた信仰を指す可能性を高める。一方で πίστις 自体の語義の幅は訳文だけで狭めず、脚注で示した。
- issue: 分詞と前節の命令との統語的関係
  choice: 前節の『歩みなさい』を補って完結した日本語文とする
  alternative: 『感謝にあふれながら』で終える分詞句とする
  rationale: 原文の各分詞は2章6節の περιπατεῖτε に従属する。節単独でも明瞭に読めるよう、その支配動詞を日本語で補ったが、新たな命令を解釈として加えたのではなく、原文の統語関係を明示した。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある標準語とした。受動表現と植物・建築の二つの比喩を保った。節単独で文が完結するよう、前節の支配動詞『歩みなさい』を末尾に補った。
