  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: ja
  text: というのも、キリストのうちには、神性の完全な豊かさが、体をもって[a]宿っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身体的に」とも訳せる。
    reason: σωματικῶςの副詞的な語義を示すため。
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 直前の警告・勧告の根拠を示す因果関係を、現代日本語で自然に表した。
- source_word: ἐν αὐτῷ
  choice: この方のうちには
  rationale: 文脈上キリストを指す。原文にない排他的な意味を加えず、敬意のある自然な指示表現とした。
- source_word: κατοικεῖ
  choice: 宿っている
  rationale: 一時的な訪れではなく、定まって住むという継続的な意味を保つ。
- source_word: πᾶν τὸ πλήρωμα
  choice: 満ち満ちたすべて
  rationale: πᾶνによる全体性と、πλήρωμαの充満・完全な満ち足りをともに表した。
- source_word: τῆς θεότητος
  choice: 神であることの
  rationale: θεότηςは単なる神的性質一般ではなく、神であることそのものを表す強い語であるため、その力を弱めない表現を選んだ。
- source_word: σωματικῶς
  choice: 体をもって
  rationale: 『身体的に、肉体を伴って』という副詞の簡潔な意味を保ち、受肉だけ、または別の特定の教理だけに限定して解釈しないようにした。
theological_decisions:
- issue: θεότηςとσωματικῶςが持つキリスト論的な力
  choice: 神であることの完全な充満が、この方のうちに体をもって宿っている
  alternative: 神的な性質、または神の臨在だけがこの方に宿っている
  rationale: θεότηςは単なる神的属性より強く『神であること』を示し、σωματικῶςはその宿りが身体的であることを示す。原文の強い主張を薄めず、その具体的な含意を必要以上に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さを保った。「この方」は文脈上のキリストを自然に指し、「神であること」はθεότηςの強い意味を一般読者にも伝えるための表現である。
