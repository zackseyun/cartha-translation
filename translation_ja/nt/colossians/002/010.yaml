source:
  edition: SBLGNT
  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: ja
  text: そして、あなたがたは、この方にあって満たされているのです[a]。この方は、あらゆる支配と権威のかしらです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「満ち満ちた者とされている」。ギリシア語は、すでに行われた働きの結果として、今も満たされた状態にあることを表す。
    reason: πεπληρωμένοιの完了受動の状態的な意味と、「満たす」という語彙的主題を保つため。
  - marker: b
    text: 「かしら」はギリシア語の比喩を保った表現。ここでは、この方があらゆる支配と権威の上に立つことを意味する。
    reason: κεφαλήの比喩を本文に残しつつ、文脈上の優越・統御の含意を説明するため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の議論とのつながりを示す接続語として保持した。
- source_word: ἐστὲ … πεπληρωμένοι
  choice: 満たされています
  rationale: 完了受動分詞と現在形の組み合わせが表す、すでになされた働きの結果として今も続く状態を自然な日本語で示し、前節の「満ち満ちていること」との語義的なつながりも保った。
- source_word: ἐν αὐτῷ
  choice: この方にあって
  rationale: キリストとの結びつき・参与を表すパウロの簡潔な表現を保ちつつ、指示対象が人であることを明瞭にした。
- source_word: ὅς ἐστιν
  choice: この方は
  rationale: 関係代名詞がキリストを指すことを、日本語として自然で明瞭な独立文にして表した。
- source_word: ἡ κεφαλή
  choice: かしら
  rationale: 「頭」というギリシア語の比喩を解釈語に置き換えず保持した。「かしら」は比喩的な首位・統率者の意味が伝わりやすい。
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: あらゆる支配と権威
  rationale: 宇宙的・霊的な支配勢力を含み得る包括性を示す一方、人格的存在か権力領域かという表現上の幅を不必要に限定しない訳とした。
theological_decisions:
- issue: キリストにある信徒の「満ちること」の意味
  choice: 信徒がキリストにあって満たされた状態にあることを述べる。
  alternative: 救いに必要なものが何一つ欠けていない／神の満ち満ちたものにあずかっている。
  rationale: いずれか一つの体系的説明に限定せず、πληρόω の受動形と前節から続く「満ち満ちていること」の主題を保った。
- issue: 諸権力に対する κεφαλή の意味
  choice: 本文では「かしら」という比喩を保持し、キリストがあらゆる支配と権威の上に立つことを表す。
  alternative: あらゆる支配と権威の源である。
  rationale: 文脈上は優越・統御の意味が強いが、本文では比喩そのものを残し、脚注でその文脈的含意を説明した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロ書簡にふさわしい簡潔で格調ある文体とした。「この方」を反復して指示対象を明確にし、長い関係節は二文に分けて自然な日本語にした。
