  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: ja
  text: へりくだりと御使いたちへの礼拝を好む者が、あなたがたを失格と判定するのを、許してはなりません[a]。その人は、自分が見たものについて詳しく論じ[b]、自分の肉の思いによって、根拠もなく思い上がっているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたから賞を奪う」とも訳せます。原語には、審判が不利な判定を下して失格にするという含みがあります。
    reason: lexical_alternative
  - marker: b
    text: 「自分が見たものに入り込む」「自分が見たものについて詳しく述べる」とも訳せます。ここで使われるギリシア語の動詞は稀で、意味の確定が困難です。一部の写本は「自分が見てもいないもの」と読める本文を伝えています。また、「御使いたちへの礼拝」は、「御使いたちが行う礼拝」「御使いたちと共にする礼拝」などとも理解できます。
    reason: lexical_alternative_and_textual_variant_and_alternative_reading
lexical_decisions:
- source_word: καταβραβευέτω
  choice: 失格と判定させてはなりません
  rationale: 競技の審判が不利な裁定を下して賞を奪うという含みを保ちつつ、現代日本語で自然な警告表現とした。
- source_word: θέλων
  choice: 好むままに
  rationale: 単なる意志ではなく、列挙される宗教的実践を自ら進んで好むニュアンスを表した。
- source_word: ταπεινοφροσύνῃ
  choice: へりくだり
  rationale: 語の基本義を保ち、見せかけの謙遜や苦行という解釈を本文に織り込まないようにした。
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: 御使いたちへの礼拝
  rationale: 属格を客体的に取り、御使いたちを対象とする礼拝と訳した。ただし文法上の別解は脚注に残した。
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: 自分が見たものに深入りし
  rationale: 稀な動詞ἐμβατεύωの、ある領域へ踏み込む、詳しく立ち入るという像を簡潔に表し、難しさと別訳を脚注で示した。
- source_word: εἰκῇ
  choice: 根拠もなく
  rationale: 思い上がりが正当な理由を欠き、空しいものであることを自然な日本語で表した。
- source_word: φυσιούμενος
  choice: 思い上がっている
  rationale: 膨れ上がる比喩の意味である高慢・自負を、明快な現代日本語にした。
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: 自分の肉の思い
  rationale: νοῦςを「思い」、σάρξを「肉」とし、パウロの人間理解に関わる緊張を「罪深い性質」などの説明的表現で解消しなかった。
theological_decisions:
- issue: θρησκείᾳ τῶν ἀγγέλων の属格の意味
  choice: 御使いたちを対象とする礼拝
  alternative: 御使いたちが行う礼拝／御使いたちと共にする礼拝／御使いたちの宗教
  rationale: 客体的属格が文脈上もっとも直接的だが、主語的・同伴的な理解も文法上可能なので脚注で保った。
- issue: τῆς σαρκὸς αὐτοῦ における σάρξ
  choice: 肉
  alternative: 罪深い性質／人間的な性質
  rationale: 解釈的な教理用語へ置き換えず、原語の身体的・人間的・堕落的含意の重なりを残した。
- issue: ἃ ἑόρακεν の本文異読
  choice: 自分が見たもの
  alternative: 自分が見てもいないもの
  rationale: SBLGNT本文に従い、否定辞を含む異読は意味を大きく変えるため脚注で明示した。
translation_notes:
  register: 明快で格調ある現代標準日本語。長いギリシア語文を二文に分けて理解しやすくしつつ、禁止命令と後続する人物描写の論理関係を保持した。「御使い」「肉」は聖書的語彙として残し、曖昧な属格、稀な動詞、本文異読は脚注で開示した。
