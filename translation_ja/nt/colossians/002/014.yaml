source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: ja
  text: 神は、私たちに不利な、規定による債務証書[a][b]を消し去られました。それは私たちに敵対するものでした。神はそれを十字架に釘づけにして、取り除かれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「債務証書」は、「負債を認める自筆の証書」または広く「手書きの文書」とも訳せる。ギリシア語は、債務や法的義務を記した文書を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「規定による」は、「規定のうちに」または「規定から成る」とも理解できる。債務証書と規定との文法的な関係には解釈の幅がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαλείψας
  choice: 消し去られました
  rationale: 書かれたものをぬぐい消して無効にする比喩を、現代日本語で明確に表す。アオリスト分詞は、文脈上の主体である神の行為として自然な叙述にした。
- source_word: χειρόγραφον
  choice: 債務証書
  rationale: 自筆の債務承認書・法的義務を記した文書という語義と、負債の比喩の双方を簡潔に保つ。技術的な法文書の種類までは限定しない。
- source_word: καθ’ ἡμῶν
  choice: 私たちに不利な
  rationale: 文書が私たちに対して効力を持つという法的・対抗的な含みを自然な日本語で示す。
- source_word: τοῖς δόγμασιν
  choice: 数々の規定による
  rationale: 与格の難しい関係を、債務証書が規定によって成り立つ、または規定に表されているという意味に取った。モーセ律法だけを指すとは訳文で限定しない。
- source_word: ὑπεναντίον
  choice: 敵対する
  rationale: 単に不利である以上に、私たちに逆らい立つという強い対抗関係を保つ。
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: 取り除き
  rationale: 完了形が示す、除去されて現在も効力を失っている結果を文脈で伝える自然な表現。
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: それを……十字架に釘づけにされた
  rationale: 文書を十字架に打ち付ける鮮明な比喩を保持し、分詞は手段・付帯状況として主動詞に結び付けた。
theological_decisions:
- issue: χειρόγραφον τοῖς δόγμασιν の意味
  choice: 数々の規定による、私たちに不利な債務証書
  alternative: モーセ律法そのもの、罪の借用証書、法的な告発状
  rationale: 文書と負債の比喩を保ちつつ、それを特定の律法観・契約観に同一化しない。τοῖς δόγμασιν の統語的な幅は脚注で示す。
- issue: ἦρκεν の主体
  choice: 神
  alternative: 主体を訳文に明示しない
  rationale: 前後の文脈では神が行為者であり、日本語で独立した節として明瞭にするため補った。キリストを主体と断定することは避ける。
- issue: 分詞と完了形の表現
  choice: 消去、除去、釘づけを完了した神の行為として叙述
  alternative: すべてを従属的な連用形のまま訳す
  rationale: 日本語の自然さを優先して文を分けながら、除去の完了と持続的結果、および釘づけによる除去という連関を保った。
translation_notes:
  register: 明快な現代標準日本語を用い、法的文書と十字架という原文の比喩を保った。敬意ある叙述として神の動詞に敬語を用いたが、教派固有の術語は避けた。原文の長い構文は三文に分け、敵対性と除去の論理を読み取りやすくした。
