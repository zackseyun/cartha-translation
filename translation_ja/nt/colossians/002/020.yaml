  rationale: 本文の意味を変更せず、「もろもろの原理」を簡潔な「諸原理」に整えた。脚注aから原語が明示しない「支配する」という含意を除き、議論のあるστοιχεῖαの意味の幅を中立的に保った。また、次節へ続く原文のコロンを訳文にも反映した。
