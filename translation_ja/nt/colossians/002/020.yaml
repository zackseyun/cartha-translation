id: COL.2.20
reference: Colossians 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: ja
  text: もしあなたがたがキリストとともに死んで、この世の諸原理[a]から離れたのなら、なぜ、なおこの世に生きているかのように、規則に従わされているのですか[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この世の霊的な諸力」、または「この世の基本要素」。
    reason: στοιχεῖαは、基礎的な原理や要素、あるいは霊的・宇宙的な力を指し得るため。
  - marker: b
    text: 別訳「なぜ、規則に従っているのですか」。
    reason: δογματίζεσθεは、規則に従わされるという受動的意味にも、自ら規則に服するという意味にも取り得るため。
lexical_decisions:
- source_word: Εἰ
  choice: もし……のなら
  rationale: 条件文の形を保つ。文脈上は事実と見なした問いだが、「既に」を補って断定には変えない。
- source_word: ἀπεθάνετε σὺν Χριστῷ
  choice: キリストとともに死んで
  rationale: アオリストの決定的な出来事と、キリストとの結びつきを簡潔に表す。日本語では「キリスト」が定着した称号表現である。
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: この世のもろもろの原理から離れた
  rationale: ἀπόの分離の意味を「離れた」で明示する。στοιχεῖαの多義性は「原理」を本文に採り、別の可能性を脚注に残す。
- source_word: τί
  choice: なぜ
  rationale: 修辞的疑問を自然な現代日本語で表す。
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: なおこの世に生きているかのように
  rationale: ὡςと分詞が示す想定・比較を保持する。「なお」は、既に死んだという前半との対比を自然に示す。
- source_word: δογματίζεσθε
  choice: 規則に従わされているのですか
  rationale: 中・受動態の形を尊重し、規定による拘束を表す。自発的服従という可能性は脚注に示す。
theological_decisions:
- issue: στοιχεῖα τοῦ κόσμουの意味
  choice: この世のもろもろの原理
  alternative: この世を支配する霊的な力／この世の基本要素
  rationale: 語は基礎的原理・要素にも宇宙的な霊的勢力にも解し得るため、本文で一方に限定せず、主要な別解を脚注に保存する。
- issue: δογματίζεσθεの態
  choice: 規則に従わされている
  alternative: 規則に従っている
  rationale: 形態上の受動的ニュアンスを本文で示しつつ、文脈上可能な再帰的・自発的ニュアンスを脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。修辞的な問いを一文として保ち、次節に続く内容であることは句読法に依存せず訳文自体で自然に示した。
