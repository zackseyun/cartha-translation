  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: ja
  text: これらは、来るべきものの影です。しかし、実体はメシアのものです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「しかし、体はメシアのものです」。
    reason: σῶμα の基本義「体」と、後半で省略されている「である」を補った表現を示すため。
lexical_decisions:
- source_word: ἅ
  choice: これら
  rationale: 前節の食べ物、飲み物、祭り、新月、安息日に関する事柄を受ける中性複数の関係代名詞。日本語では「これら」とすることで、その指示関係を自然に示した。
- source_word: σκιὰ
  choice: 影
  rationale: 単数の述語名詞であり、後半の σῶμα との比喩的な対照をそのまま保つ。
- source_word: τῶν μελλόντων
  choice: 来るべきもの
  rationale: 冠詞付き分詞を実質的な名詞表現として訳した。将来への方向性を保ちつつ、それが終末的事柄かメシアによる成就かを訳文で限定しない。
- source_word: δὲ
  choice: しかし
  rationale: 「影」と「実体」の対照を明確に示す逆接として訳した。
- source_word: σῶμα
  choice: 実体
  rationale: 基本義は「体」だが、ここでは「影」と対置され、影に対応する実在を表す比喩として理解できる。「実体」は現代日本語でこの対照を明瞭に伝える。字義的な「体」も脚注に残した。
- source_word: τοῦ Χριστοῦ
  choice: メシアのもの
  rationale: 属格の簡潔で省略的な表現を所有・帰属として自然な日本語にした。Χριστός はここでは称号として「メシア」と訳した。
theological_decisions:
- issue: 「影」と対照される σῶμα の意味
  choice: 比喩的に「実体」と訳し、より完全な実在がメシアに属することを示す。
  alternative: 字義的に「体」と訳し、解釈を読者に委ねる。
  rationale: 影と、それに対応する実在との対照が文脈上明らかであるため、「実体」が日本語では自然である。ただし σῶμα の通常の語義と、ギリシア語の簡潔さを消さないよう、字義訳を脚注に示した。
- issue: τοῦ Χριστοῦ の統語的関係
  choice: 「実体はメシアのものです」とし、属格を帰属として読む。
  alternative: 「メシアの体」と名詞句として読む。
  rationale: 前半の ἐστιν を後半にも補う並行構造として自然に読めるが、ギリシア語には後半の動詞が明記されていないため、より形式的な可能性を脚注に残した。
translation_notes:
  register: 明快な現代標準語を用い、簡潔で格調を保った。「来るべきもの」は聖書的な響きを持ちながら現代の読者にも理解できる表現。「実体」で比喩を明瞭にしつつ、脚注で「体」という原語の字義と構文上の余地を保持した。
