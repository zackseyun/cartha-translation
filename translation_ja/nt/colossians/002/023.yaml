id: COL.2.23
reference: Colossians 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: ja
  text: これらの規定は、自分で定めた礼拝[a]と謙遜と体の厳しい扱いによって、いかにも知恵があるように見えます[b]。しかし、肉[c]の欲望を抑えるうえでは、何の価値もありません。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自発的な礼拝」。伝統的には「意志による礼拝」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「知恵があるとの評判を得ています」。
    reason: lexical_alternative
  - marker: c
    text: ここで「肉」は、堕落した人間の欲望を指している可能性があります。
    reason: lexical_alternative
  - marker: d
    text: 末尾の原文は解釈が困難です。別訳「肉を満たすことについては、少しも尊ぶべきものではありません」、または「肉を満たすことに対しては、何の価値もありません」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἅτινά
  choice: これらの規定は
  rationale: 直前の「つかむな、味わうな、触れるな」という規定を受ける関係代名詞。日本語では指示対象を明示することで自然なつながりにした。
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: いかにも知恵があるように見えます
  rationale: λόγον ἔχειν が表す評判・外観と、μένによる譲歩的な調子を、実質とは異なる見かけとして自然に表した。
- source_word: ἐθελοθρησκίᾳ
  choice: 独りよがりの礼拝
  rationale: 自分の意志で考案・選択した礼拝という否定的含意を、現代日本語で理解しやすく示した。語が稀で解釈の幅があるため、別訳を脚注に残した。
- source_word: ταπεινοφροσύνῃ
  choice: 謙遜
  rationale: 基本的な語義を保ち、ここでの見せかけまたは苦行的な含みは文脈に委ねた。
- source_word: ἀφειδίᾳ σώματος
  choice: 体の厳しい扱い
  rationale: 身体をいたわらず厳格に扱う苦行的態度を、簡潔かつ自然に表した。
- source_word: οὐκ ἐν τιμῇ τινι
  choice: 何の価値もありません
  rationale: 圧縮された難解な句を、これらの規定には実効性がないという文脈上有力な理解に基づいて訳した。
- source_word: πρὸς πλησμονὴν τῆς σαρκός
  choice: 肉の欲望を抑えるうえでは
  rationale: πρόςを対抗・抑制との関係、πλησμονήを肉の欲求の充足として理解した。原文には「抑える」に相当する動詞が明示されないため、別解の可能性を脚注で示した。
- source_word: σάρξ
  choice: 肉
  rationale: 身体そのものと堕落した人間的欲望との神学的緊張を過度に解消しないよう、伝統的で簡潔な「肉」を本文に置き、文脈上の意味を脚注で補った。
theological_decisions:
- issue: 難解な末尾句 οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός の意味
  choice: 禁欲的規定は肉の欲望を抑える実効的価値を持たない。
  alternative: 「肉を満足させるだけで、少しも尊ぶべきものではない」、または「肉の満足に対抗するため、体を少しも重んじない」。
  rationale: 統語は圧縮されており複数の分析が可能だが、前節から続く人間的な規定への批判と、見かけの知恵との対比には「抑制する価値がない」が最もよく適合する。曖昧さを隠さないため別解を脚注に残した。
- issue: σάρξ の指示内容
  choice: 本文では「肉」とし、欲望との結びつきを文脈と脚注で示す。
  alternative: 「罪深い性質」「人間の欲望」と解釈的に訳す。
  rationale: ここでは堕落した人間の欲求を指す可能性が高いが、身体そのものとの語義上のつながりとパウロ的用語の幅を保持するため、本文で意味を限定しすぎない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保った。「独りよがり」は否定的含意を自然に伝える一方、稀語の解釈を固定しすぎないよう脚注を付した。難解な末尾句は本文を読みやすくしつつ、実在する統語的曖昧さを脚注に保存した。
