id: COL.2.5
reference: Colossians 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: ja
  text: たとえ私が肉体においては離れていても、霊においてはあなたがたと共にいて、喜びながら、あなたがたの秩序と、メシアに対する信仰の堅固さ[a]を見ています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアに対するあなたがたの忠実さの堅固さ」とも訳せる。
    reason: πίστιςには「信仰」のほか、「忠実さ」という意味合いもあり得るため。
lexical_decisions:
- source_word: τῇ σαρκί
  choice: 肉においては
  rationale: ここでのσάρξは倫理的な「罪深い性質」ではなく、身体的なあり方を指す。τῷ πνεύματιとの対照を保つため、直訳調ながら理解可能な「肉において」とした。
- source_word: τῷ πνεύματι
  choice: 霊においては
  rationale: パウロ自身の非身体的な臨在を指す可能性が高いが、聖霊との関わりを完全には排除せず、原文の曖昧さを保った。
- source_word: χαίρων καὶ βλέπων
  choice: 喜びながら…見ています
  rationale: 二つの現在分詞が主動詞と同時進行であることを自然な日本語で示した。
- source_word: τὴν τάξιν
  choice: 秩序
  rationale: 共同体の整然とした良い状態を表す。原文には「良い」に相当する語がないため、評価的意味を過度に補わず「秩序」とした。
- source_word: τὸ στερέωμα
  choice: 堅固さ
  rationale: 固く安定している状態を表し、「信仰」と自然に結びつく語を選んだ。
- source_word: τῆς εἰς Χριστὸν πίστεως
  choice: メシアに対する…信仰
  rationale: εἰςが示す対象・方向性を「に対する」で表し、πίστιςは基本義に従って「信仰」とした。Χριστόςはここで称号として機能するため「メシア」とした。
theological_decisions:
- issue: 「霊において」の指示対象
  choice: パウロが身体的には不在でも、霊において彼らと共にいるという表現
  alternative: 聖霊によって彼らと共にいるという意味
  rationale: 肉と霊の直接的対照はパウロ自身の身体的・非身体的あり方を示唆するが、訳文では聖霊に関する可能性を断定的に排除しない。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名のようにではなく、信仰の対象となる称号として理解できるため。
- issue: πίστιςの意味
  choice: 信仰
  alternative: 忠実さ、真実さ
  rationale: 文脈上「メシアに対する信仰」が最も自然だが、πίστιςには忠実さの意味もあり得るため脚注で保持した。
- issue: βλέπωνの認識様態
  choice: 見ています
  alternative: 認めています、見て取っています
  rationale: 実際の視覚ではなく報告などを通した認識である可能性があるが、原文の比喩性を解消せず「見る」を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。肉と霊の対照は原文に即してやや形式的に保持し、教派的な解釈を加えない。語順は日本語として読みやすく整えつつ、「喜ぶ」と「見る」の同時性、および「秩序」と「堅固さ」という二つの称賛点を保った。
