source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: ja
  text: また、あなたがたは、背きの中にあり、肉体に割礼を受けていない状態[a]で死んでいましたが、神は、私たち[b]のすべての背きを赦して、あなたがたをキリストとともに生かしてくださいました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉体に割礼を受けていない状態」とは、最も直接的には身体に割礼を受けていない状態を指しますが、この文脈では霊的な意味合いも伴っています。
    reason: cultural_note
  - marker: b
    text: ギリシア語は、前半の「あなたがた」から後半の「私たち」へと人称を切り替えています。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: 死んでいた
  rationale: 分詞が表す継続的な状態を自然な現代日本語で示し、文脈上の霊的な死を説明語で限定しない。
- source_word: ἐν τοῖς παραπτώμασιν
  choice: 背きの中にあり
  rationale: ἐνを因果だけに還元せず、違反の領域・状態にあったという比喩を保つ。παράπτωμαは一般読者に明瞭な「背き」とした。
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: 肉に割礼を受けていなかった
  rationale: 字義的な身体の無割礼を自然な日本語で表しつつ、周辺文脈にある霊的含意を本文で断定しない。
- source_word: συνεζωοποίησεν ... σὺν αὐτῷ
  choice: キリストとともに生かし
  rationale: 複合動詞とσύνが示す共同性を「ともに」で保持する。αὐτόςの指示対象は直前の2:12の文脈からキリストであり、日本語では代名詞の曖昧さを避けるため明示した。
- source_word: χαρισάμενος
  choice: 赦してくださいました
  rationale: χαρίζομαιの恵みに基づく赦しを、神の行為にふさわしい自然で敬意ある表現にした。分詞の主動詞との緊密な関係は連用形で表す。
- source_word: ἡμῖν
  choice: 私たちの
  rationale: 前半の二人称複数「あなたがた」から一人称複数「私たち」への原文の移行を保持する。
- source_word: πάντα τὰ παραπτώματα
  choice: すべての背き
  rationale: 最初のπαραπτώματαとの語彙的一貫性と、赦しの全体性を保持する。
theological_decisions:
- issue: τῆς σαρκὸς ὑμῶνにおけるσάρξの意味
  choice: 身体を直接指す「肉」と理解し、「肉に割礼を受けていなかった」と訳す
  alternative: 「罪深い性質の無割礼」など、比喩的意味に限定する
  rationale: 直前の割礼の文脈では身体的な無割礼が最も直接的だが、霊的な響きもある。本文では比喩的解釈に固定せず、注で含意を示す。
- issue: σὺν αὐτῷのαὐτῷの指示対象
  choice: キリスト
  alternative: より広く神を指すとする
  rationale: 2:12の埋葬と復活への参与という直近の文脈により、キリストが最も自然である。
- issue: συνεζωοποίησενの主語
  choice: 神
  alternative: 主語を補わず「ともに生かされました」と受動態で訳す
  rationale: ギリシア語では主語が明示されないが、2:12の「彼を死者の中からよみがえらせた神」が自然な主語である。日本語で構文を明瞭にするため補ったが、文脈に基づく補足である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「背き」を反復して原語の語彙的一貫性を示した。日本語として不自然な名詞句「肉の無割礼」は避け、意味を保って節に展開した。
