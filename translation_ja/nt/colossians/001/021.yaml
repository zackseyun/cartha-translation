id: COL.1.21
reference: Colossians 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: ja
  text: また、かつて疎外され、心において敵対し、悪い行いの中にあったあなたがたをも[a]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文をより語順に沿って訳すと、「また、かつて疎外されていて、心において敵対し、悪い行いの中にあったあなたがたをも」となる。「疎外され」の相手は原文では明記されていない。また、「悪い行いの中に」は、心における敵対と悪い行いとの関係を簡潔に表す原文の表現である。
    reason: 隔絶の相手を本文で補わず、また心の敵対と悪い行いの関係について原文にある曖昧さを保つため。
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: あなたがたをも
  rationale: 前節から続く目的格を保ち、次節の和解の動詞へつながる未完の構文として訳した。「も」は、キリストの和解の働きが読者にも及ぶことを示す καί の文脈的機能を表す。
- source_word: ποτε ὄντας
  choice: かつて…あった
  rationale: 読者の以前の状態を表す時間的・叙述的表現として、現代日本語で自然な形にした。
- source_word: ἀπηλλοτριωμένους
  choice: 神から離れ
  rationale: 完了受動分詞が示す隔絶状態を平易に表した。原文には離れていた相手が明記されていないが、文脈上は神との隔絶なので「神から」を補った。
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: 心において敵対し
  rationale: ἐχθρούς の『敵である／敵対する』という強さと、τῇ διανοίᾳ の領域・観点を保った。「心」は思考や意向を含む διάνοια を一般読者に明瞭に伝える。
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: 悪い行いの中にあった
  rationale: ἐν の曖昧な関係を因果に限定せず、悪い行いが敵対の領域・現れであるという原文の圧縮された表現をできるだけ保持した。
- source_word: ἔργοις
  choice: 行い
  rationale: ここでは「業」より現代的で自然であり、別のパウロ書簡における術語的な『律法の行い』を不必要に連想させにくい。
- source_word: πονηροῖς
  choice: 悪い
  rationale: 道徳的な悪を明瞭かつ平易に表す。
theological_decisions:
- issue: 心の敵対と悪い行いとの関係
  choice: 「心において敵対し、悪い行いの中にあった」
  alternative: 「心で敵対し、悪い行いをしていた」
  rationale: ἐν τοῖς ἔργοις τοῖς πονηροῖς は、敵対が行いに現れたこと、またはその領域を表し得る。明示されていない因果関係や分詞的な動作を加えず、内面と行為の結びつきに残る緊張を保った。
- issue: 隔絶の相手
  choice: 「神から離れ」
  alternative: 「離れ」または「疎外され」
  rationale: ἀπαλλοτριόω 自体は相手を明記しないが、1:20–22の和解の文脈では神からの隔絶を指す。日本語で意味を明瞭にするため補ったが、脚注で原文の簡潔さを示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、前節から次節へ続く長い文の一部であることを目的格「あなたがたをも」と末尾のダッシュで保持した。「疎外されていた」は硬く抽象的なため避け、「神から離れ」とした。
