  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: ja
  text: あなたがたのメシア・イエスにある信仰[a]と、すべての聖なる者たちに対して抱いている愛について聞いたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシア・イエスにある信頼」または「メシア・イエスにある忠実」。ギリシア語の名詞ピスティスは、文脈によりこれらの関連する意味を表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 聞いたからです
  rationale: 前節の感謝の理由を示す分詞として理解し、日本語では文脈上自然な理由節にした。アオリストの先行性も「聞いた」で保っている。
- source_word: πίστιν
  choice: 信仰
  rationale: ἐν Χριστῷ Ἰησοῦと結びつき、メシア・イエスを基盤・領域とする信仰を表すと読む。「信頼」「忠実」の可能性は脚注に残した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: ἐνの関係的・領域的な含みを「にある」で保ち、Χριστόςは称号として「メシア」と訳した。
- source_word: ἀγάπην ἣν ἔχετε
  choice: 抱いている愛
  rationale: 関係節「あなたがたが持っている」を、意味を保ちながら自然な現代日本語にまとめた。
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: すべての聖なる者たちに対して
  rationale: εἰςの方向性を「に対して」で示し、ἅγιοιの語義を透明に伝えるため「聖なる者たち」とした。
theological_decisions:
- issue: Χριστῷを称号として訳すか、慣用的な形で表すか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: Χριστόςの称号としての意味を明示し、固有名のように不透明化しないため。
- issue: πίστιςの意味範囲
  choice: 信仰
  alternative: 信頼、忠実
  rationale: この文脈ではメシア・イエスとの関係における信仰が最も自然だが、語そのものが持つ関連した意味の幅は脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く統語関係を日本語で自然に示すため理由節とし、主要な神学用語の曖昧さは脚注に保存した。
