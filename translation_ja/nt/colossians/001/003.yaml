id: COL.1.3
reference: Colossians 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: ja
  text: 私たちはいつも、あなたがたのために祈るとき、私たちの主イエス・メシア[a]の父である神に感謝しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、伝統的に「イエス・キリスト」。
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: 感謝しています
  rationale: 感謝を表すという語義を、書簡の祈りの文脈に合う自然で品位ある現代日本語で表した。
- source_word: τῷ θεῷ πατρὶ
  choice: 父である神に
  rationale: θεῷ と πατρὶ の同格関係を示しつつ、後続する属格句との関係が日本語で明瞭になるようにした。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主…の
  rationale: κύριος を標準的な称号「主」とし、属格構文を自然な日本語で保持した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語では「イエス・キリスト」が一般読者に最も明瞭な定着形であり、Χριστός の称号的背景を失わずに自然な固有名・称号連鎖として伝える。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続・反復を表す「常に」の意味を、硬すぎない現代標準語で表した。
- source_word: περὶ ὑμῶν
  choice: あなたがたのために
  rationale: 祈りを表す語とともに用いられる περί＋属格を、執り成しの対象を示す自然な日本語にした。
- source_word: προσευχόμενοι
  choice: 祈るとき
  rationale: 現在分詞が主動詞と同時的な状況を示すことを、曖昧さを過度に増やさず自然に表した。
theological_decisions:
- issue: Χριστός の訳し方
  choice: キリスト
  alternative: メシア
  rationale: Χριστός は語義上「メシア」を意味するが、「イエス・キリスト」は現代日本語で広く定着し、この箇所の名・称号連鎖を自然に再現する。「メシア」としての意味を否定する選択ではない。
- issue: 神と父の統語関係
  choice: 私たちの主イエス・キリストの父である神
  alternative: 神、すなわち私たちの主イエス・キリストの父
  rationale: θεῷ と πατρὶ を別個の対象とはせず同格として理解し、日本語では関係節的な表現によって明確にした。
translation_notes:
  register: 明瞭で自然な現代標準日本語。書簡にふさわしい品位を保ちつつ、過度に文語的な「絶えず」「祈りつつ」は避けた。原文は次節へ続くが、本節単独でも読める句点を置いた。
