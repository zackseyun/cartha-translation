    issue: Χριστόςが本文で「キリスト」とされ、称号としての「メシア」の訳出が失われている。
    rationale: 原語ではἸησοῦ Χριστοῦは「イエス・メシア」という名・称号連鎖であり、英語POBの決定も本文を「Jesus the Messiah」としている。日本語の定着形を優先する場合でも、この監査方針に従い本文では称号的意味を可視化し、伝統形を脚注で示すのが適切である。
  - severity: low
    issue: 「いつも」を読点で挟む語順がぎこちなく、主節への係り先が弱い。
