  source_fidelity: ギリシア語は「私たちはいつも感謝する」ことを主節とし、「あなたがたについて祈りつつ／祈るとき」をその状況として添える。草案は神と「父」の同格関係、および「あなたがたのために」の執り成しの意味を正しく伝えている。ただし、Χριστόςを「キリスト」とすることで、監査英訳およびプロジェクト方針がこの文脈で保持する称号的な「メシア」の意味が本文から見えなくなっている。
  naturalness: 草案の読点はやや多く、とりわけ「いつも」の前後の読点は現代日本語として不自然である。「いつも」を主節に近づけ、祈りの句を後置すると、修飾関係が明瞭で自然になる。
  terminology: κύριοςは「主」、θεῷ πατρὶは「父である神」とするのが適切である。Χριστόςは、この箇所では固有名の一部としてのみ扱わず、「メシア」として称号性を表す。日本語で従来定着した「イエス・キリスト」は脚注に残す。
  issues:
