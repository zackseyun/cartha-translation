id: COL.1.9
reference: Colossians 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: ja
  text: このため、私たちも、そのことを聞いた日から、あなたがたのために祈り、願い求めることをやめていません。どうかあなたがたが、あらゆる霊的な[b]知恵と理解において、神のみこころについての知識[a]で満たされますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十分な知識」または「より深い知識」とも訳せる。ギリシア語には、より十分で深い認識という含みがありうる。
    reason: lexical_alternative
  - marker: b
    text: 「霊的な」は、性質が霊的であること、または聖霊によって与えられることを意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: このため
  rationale: 直前に述べられたコロサイの信仰と愛の知らせを受けた因果・推論を、簡潔で自然な日本語で表す。
- source_word: καὶ ἡμεῖς
  choice: 私たちも
  rationale: 祈る側であるパウロと同労者たちを強調して加える καί の含意を保つ。
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: そのことを聞いた日から
  rationale: 継続する祈りの起点を明示する。目的語は前文の知らせを指すため、日本語では「そのこと」を補って自然にした。
- source_word: οὐ παυόμεθα
  choice: やめていません
  rationale: 現在に至るまで途切れず続く行為を、現代日本語で明瞭に表す。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのために
  rationale: 祈りが相手の益のためになされることを自然に表す。
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: 祈り、願い求める
  rationale: 一般的な祈りと具体的な願いを表す二つの分詞をまとめず、それぞれ訳出する。
- source_word: ἵνα πληρωθῆτε
  choice: どうか……満たされますように
  rationale: 祈願の内容を示す ἵνα 節を日本語の祈りにふさわしい形で表し、受動形によって満たす主体を明示しない原文を保つ。
- source_word: τὴν ἐπίγνωσιν
  choice: 知る知識
  rationale: ἐπίγνωσις の認識・知識という意味を保つ。「知識」だけでは日本語で抽象的に響くため、属格句との関係を「神のみこころを知る知識」とした。より深い、十分な知識という語感は脚注に残す。
- source_word: τοῦ θελήματος αὐτοῦ
  choice: 神のみこころ
  rationale: αὐτοῦ の指示対象は文脈上、神であるため、日本語で曖昧にならないよう名詞を補った。「みこころ」は現代の聖書文体で理解される、簡潔で尊厳ある表現。
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: あらゆる霊的な知恵と理解をもって
  rationale: ἐν を随伴・手段的に自然な日本語で表し、πνευματικῇ が「知恵」と「理解」の双方にかかる構造を維持する。
- source_word: σοφίᾳ
  choice: 知恵
  rationale: 実践的・神学的判断を含みうる標準的な訳語。
- source_word: συνέσει
  choice: 理解
  rationale: 物事の関係を把握する力を示し、「知恵」と区別しながら明瞭に並べられる訳語。
theological_decisions:
- issue: ἐπίγνωσις の強意性
  choice: 知識
  alternative: 十分な知識／より深い知識
  rationale: この語には十分な、深い認識という含みがありうるが、本文で「十分な」と断定すると原文が必ずしも要求しない強調を加えるおそれがあるため、可能性を脚注に示す。
- issue: πνευματικῇ の意味と修飾範囲
  choice: 「霊的な」が「知恵」と「理解」の両方を修飾する
  alternative: 御霊によって与えられる知恵と理解
  rationale: 形容詞は性質が霊的であることも、聖霊との関係も示しうる。本文では原文同様に簡潔な形を保ち、聖霊による賜物と明示する解釈は脚注に置く。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、祈願部分には「どうか……ますように」を用いて落ち着いた聖書的品位を保った。「みこころ」は一般読者にも通じる慣用的な聖書語として採用した。脚注記号は該当語の直後に置き、英語相談層で位置がずれていた第一脚注を ἐπίγνωσις に対応する「知識」の後へ正した。
