revisions:
- from: このため、私たちも、そのことを聞いた日から、あなたがたのために祈り、願い求めることをやめていません。どうかあなたがたが、あらゆる霊的な[b]知恵と理解をもって、神のみこころを知る知識[a]に満たされますように。
  to: このため、私たちも、そのことを聞いた日から、あなたがたのために祈り、願い求めることをやめていません。どうかあなたがたが、あらゆる霊的な[b]知恵と理解において、神のみこころについての知識[a]で満たされますように。
  rationale: 安全な最小限の修正として、「知る知識」を自然で原文の属格構造に対応する「…についての知識」に改めた。さらにἐν句を「知恵と理解において」として満たされることの領域・様態に結び付けた。神を明示する補足、受動態、祈願の調子、ならびに二つの語彙的脚注の曖昧さは維持した。
