    issue: 「あらゆる霊的な知恵と理解をもって」の位置
    rationale: 原文ではἐν句が充満の祈願に連なっており、現行の語順でも意味は通るが、日本語では「知識」の手段であるかのように読まれうる。知識の句に添えて「…において」とするほうが構文上の関係を明瞭にできる。
