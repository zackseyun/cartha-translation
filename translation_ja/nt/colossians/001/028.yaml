  to: この方を、私たちは宣べ伝えています。あらゆる知恵をもって、一人ひとりを戒め、一人ひとりを教えています。それは、一人ひとりをキリストにあって成熟した者として差し出すためです。
  rationale: 原文の三重の πάντα ἄνθρωπον を「一人ひとり」の反復で保持したまま、νουθετοῦντες の矯正的な勧告と、παραστήσωμεν の提示の意味をより正確に反映した。τέλειον の「成熟した者」および ἐν Χριστῷ の「キリストにあって」は維持した。
