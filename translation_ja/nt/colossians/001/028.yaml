    issue: 「警告し」は νουθετοῦντες の教育的・矯正的な含意をやや狭くする。
    rationale: νουθετέω は単なる危険警報ではなく、理解に訴えて戒め、正す働きを表す。後続の「教え」との対でも「戒め」が適切である。
  - severity: low
    issue: 「立たせる」は παραστήσωμεν の「提示する」の含意を十分には明示しない。
    rationale: 原語は成熟した者として人を提示することを表す。「差し出す」として提示先を補わずにその像を保つ。
