source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: ja
  text: この方を、私たちは宣べ伝えています。あらゆる知恵をもって、一人ひとりを戒め、一人ひとりを教えています。それは、一人ひとりをキリストにあって成熟した者として差し出すためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: 宣べ伝えています
  rationale: 公に告げ知らせる継続的な働きを、現代日本語の聖書文体として自然かつ明瞭に表す。
- source_word: νουθετοῦντες
  choice: 警告し
  rationale: 誤りや危険を意識させて正す含意を保つ。単なる勧告より強いが、懲戒に限定しない。
- source_word: πάντα ἄνθρωπον
  choice: 一人ひとり
  rationale: 三度の反復が示す例外のない個別的な働きを自然な日本語で表す。性別を限定しない。
- source_word: ἐν πάσῃ σοφίᾳ
  choice: あらゆる知恵をもって
  rationale: ἐνを手段・様態として取り、πάσῃの包括性を保持する。
- source_word: τέλειον
  choice: 成熟した者
  rationale: 文脈上、罪のない完全性より、キリストにある十分な成熟・完成を指すため。
- source_word: παραστήσωμεν
  choice: 立たせる
  rationale: 神の前に差し出す、あるいは立たせるという提示の像を保ちつつ、日本語として簡潔にした。
- source_word: ἐν Χριστῷ
  choice: キリストにあって
  rationale: キリストとの結びつき・領域を示す定型表現であり、単なる手段に狭めない。
theological_decisions:
- issue: τέλειονが表す完成性
  choice: 成熟した者
  alternative: 完全な者
  rationale: 終末的・倫理的な完成の響きを排除はしないが、この文脈では教えによって目指す信仰上の成熟を前面に出す。
- issue: παραστήσωμενの相手が明示されていないこと
  choice: 相手を補わず「立たせる」
  alternative: 神の前に立たせる／ささげる
  rationale: 原文は提示先を明記していないため、神を補って曖昧さを解消しない。
- issue: ἐν Χριστῷの関係性
  choice: キリストにあって
  alternative: キリストによって／メシアにあって
  rationale: 結合・領域の幅を保持する。「キリスト」は日本語読者に最も通用する固有の称号表記。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。πάντα ἄνθρωπονの三重反復は、日本語でも「一人ひとり」を三度繰り返して修辞的強調を保持した。
