  text: ὅτι ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: ja
  text: なぜなら[a]、満ち満ちたもの全体[c]が、この方のうちに住むことをよしとした[b]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「というのも」とも訳せます。この接続詞は、文脈において説明や理由を示す複数の言い方で訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「神は、満ち満ちたもの全体をこの方のうちに住まわせることをよしとした」または「父は……」のように、暗黙の主語を補う訳も多くあります。ギリシア語本文には、その主語が明記されていません。
    reason: alternative_reading
  - marker: c
    text: 「満ち満ちたもの全体」は、神の満ち満ちたものを指すと理解されることがよくあります。コロサイ2章9節参照。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: なぜなら……からです
  rationale: 直前の記述の根拠を示す接続詞として理解し、現代日本語で自然な説明の形にした。「というのも」や「……ので」とも訳し得る。
- source_word: ἐν αὐτῷ
  choice: この方のうちに
  rationale: 代名詞は直前の文脈の御子を指す。「キリスト」などの称号を補わず、男性の人物を指すことが明確になる表現とした。
- source_word: εὐδόκησεν
  choice: よしとした
  rationale: 好意、意向、喜びを伴う是認を表す動詞。「喜んだ」よりも意志的な含みを保ちつつ、原文に明記されない「神」や「父」を主語として補わない。
- source_word: πᾶν τὸ πλήρωμα
  choice: 満ち満ちたもののすべて
  rationale: πᾶν の包括性と πλήρωμα の神学的な重みを保つ。「神の」を本文に補わず、コロサイ2章9節との語のつながりも示せる訳語とした。
- source_word: κατοικῆσαι
  choice: 住むこと
  rationale: 一時的な滞在ではなく、住まいを定めて居住する意味を簡潔に表す。
theological_decisions:
- issue: εὐδόκησεν の明示されない主語
  choice: 「満ち満ちたもののすべてが……よしとした」と訳し、原文の表面上の統語関係を保つ。
  alternative: 「神は、満ち満ちたものをすべてこの方のうちに住まわせることをよしとした」または「御父は……よしとした」
  rationale: ギリシア語には「神」や「父」に当たる明示的な主語がない。一般的な解釈を本文へ補わず、原文にある曖昧さと緊張を残した。
- issue: 「満ち満ちたもの」の内容
  choice: 「神の」を補わず、「満ち満ちたもののすべて」とする。
  alternative: 「神の満ち満ちたもののすべて」または「神の満ち満ちた性質のすべて」
  rationale: 文脈、とりわけコロサイ2章9節は神の満ち満ちたものを強く示唆するが、この節自体には「神の」という属格表現がないため、本文では限定しない。
translation_notes:
  register: 明快な現代標準語を用いながら、神学的な荘重さを保った。「この方」は指示対象への敬意を自然に示し、「満ち満ちたもの」は日常語より高い文体だが、原語の抽象性とコロサイ書内の語彙的連関を保つために採用した。
