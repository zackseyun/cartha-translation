id: COL.1.20
reference: Colossians 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: ja
  text: 神は、御子を通して、御子の十字架の血によって平和をもたらし、御子を通して、地上のものも天上のものも含む万物を御自分と和解させることをよしとされました。[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「万物」は、続く「地上のものも天上のものも」と同じく広い表現である。この節自体は、この和解が最終的な救いとどのように関係するかを明示していない。
    reason: alternative_reading
  - marker: b
    text: 「御子を通して」は、「御子によって」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 写本によっては、二度目の「御子を通して」を欠く。
    reason: textual_variant
  - marker: d
    text: 「天上のもの」に当たるギリシア語は複数形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: 御子を通して
  rationale: διά＋属格の手段・媒介の意味を保つ。「彼」ではなく文脈上の指示対象である御子を明示し、自然な日本語にした。
- source_word: ἀποκαταλλάξαι
  choice: 和解させる
  rationale: 関係の回復を表す使役的な不定詞として訳した。接頭辞の強意を「完全に」と明示することは避けた。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 周辺文脈の創造全体を指す広がりと、地上・天上の対句に合う包括性を簡潔に保つ。
- source_word: εἰς αὐτόν
  choice: 御自分と
  rationale: 19節から続く文の主語を神と理解し、再帰的な方向性を日本語で明確にした。
- source_word: εἰρηνοποιήσας
  choice: 平和をもたらし
  rationale: 和解の手段・根拠となる分詞の働きを自然な連用形で表した。
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: 御子が十字架で流した血によって
  rationale: 「血」と「十字架」をともに保持しつつ、直訳的な「彼の十字架の血」が生む不自然さを避けた。
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: 御子を通して
  rationale: 本文に採用し、反復による御子の媒介的役割を保持した。異読は脚注に示す。
- source_word: εἴτε ... εἴτε
  choice: …も…も
  rationale: 二領域を包括する並列を、日本語として自然な相関表現で示した。
- source_word: τὰ ἐπὶ τῆς γῆς / τὰ ἐν τοῖς οὐρανοῖς
  choice: 地上のもの／天上のもの
  rationale: 宇宙的な対比を簡潔かつ明瞭に表し、οὐρανοῖςの複数形は日本語の慣用上「天上」に包含させた。
theological_decisions:
- issue: τὰ πάνταが示す和解の範囲
  choice: 「万物」と広く訳し、この和解が個々の存在の最終的救いとどう関係するかは本文で限定しない。
  alternative: 「すべての人」、または万物が救済的に最終救済を受けるとの明示
  rationale: ギリシア語と「地上のものも天上のものも」という説明は宇宙的な広がりを持つが、その救済論的帰結まではこの節自体が明示していない。
- issue: εἰς αὐτόνの指示対象
  choice: 神が御子を通して万物を御自分と和解させる、と理解した。
  alternative: 御子が万物を御自分と和解させる。
  rationale: 19節から続く構文では神が意志の主体であるとの理解が最も自然である。ただし御子の媒介的役割は明確に保持した。
- issue: 「十字架の血」の意味
  choice: 「御子が十字架で流した血」と具体的に訳した。
  alternative: 「御子の十字架の死」
  rationale: 原文が明示する「血」と「十字架」を残し、特定の贖罪論へ狭めず、犠牲と歴史的な磔刑の含意を保った。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える文体。「御子」を反復して指示関係を明確にし、「万物」「和解」「十字架で流した血」という神学的に重要な語を保った。ギリシア語の「天」は複数形だが、日本語では不自然な「諸天」を避けて「天上」とした。
