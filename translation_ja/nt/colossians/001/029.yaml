  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: ja
  text: このために[a]、私も労苦し、私のうちに力をもって働いているその方[b]の働きに従って奮闘しています。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この目的のために」または「そのために」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「その方」が神を指すのかキリストを指すのかは、この節では明示されていない。
    reason: alternative_reading
  - marker: c
    text: 「私のうちに力強く働いている」または「私のうちに力をもって働いている」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: このために
  rationale: 直前の宣教の目的を受ける表現。「このために」は、遡及的な指示と目的の含みを自然な日本語で簡潔に表す。
- source_word: καὶ
  choice: も
  rationale: 直前の内容にパウロ自身の労苦を付加する語として、「私も」と表した。
- source_word: κοπιῶ
  choice: 労苦し
  rationale: 疲労を伴うほど懸命に働く意味を保ちつつ、現代日本語として格調のある表現。
- source_word: ἀγωνιζόμενος
  choice: 奮闘しています
  rationale: 競技や戦いを背景とする、力を尽くして取り組むニュアンスを表す。「労苦」と重ねても不自然にならない。
- source_word: κατὰ
  choice: に従って
  rationale: パウロの奮闘がその方の働きに即し、その力を尺度としている関係を保つ。単なる手段を示す「によって」より原文の関係を明確にする。
- source_word: ἐνέργειαν
  choice: 働き
  rationale: 現実に作用する力・活動を意味する。現代的・科学的な含みを帯びやすい「エネルギー」を避け、後続の同根語との響きも保つ。
- source_word: αὐτοῦ
  choice: その方の
  rationale: 代名詞の指示対象を神またはキリストと明示せず、原文の曖昧さを保持する。日本語では単独の「彼の」より自然で敬意ある表現。
- source_word: τὴν ἐνεργουμένην
  choice: 働く
  rationale: 現在分詞が表す継続的な作用を簡潔に示し、名詞「働き」と同根語の反復も日本語で再現する。
- source_word: ἐν ἐμοὶ
  choice: 私のうちに
  rationale: ἐν の最も直接的な意味を保ち、内的な力づけと宣教活動に現れる作用との緊張を解消しない。
- source_word: ἐν δυνάμει
  choice: 力強く
  rationale: この句を働きの様態として自然な日本語で表す。名詞的な形は失われるが、「力をもって」より流麗で意味が明瞭。
theological_decisions:
- issue: αὐτοῦ（「その方の」）の指示対象
  choice: 神ともキリストとも明示せず、「その方の」とする。
  alternative: 「神の働き」または「キリストの働き」と明示する。
  rationale: この節自体は指示対象を名指ししておらず、文脈から複数の理解が可能であるため、翻訳本文で一方に限定しない。
translation_notes:
  register: 明快な現代標準語を用いながら、「労苦」「奮闘」によって原文の強い努力を表した。「働き／働く」という同根語の反復を意図的に残した。脚注記号は本文末に置き、それぞれ語句の選択肢と代名詞の曖昧さを示す。
