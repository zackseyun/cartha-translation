id: COL.1.6
reference: Colossians 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: ja
  text: この福音は、あなたがたのもとに来ており[a]、全世界においても[b]実を結び、成長しています。それと同じように、あなたがたの間でも[c]、あなたがたが聞き、真実に[d]神の恵みを知った日以来、実を結び、成長しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのもとにあります」または「あなたがたの間に到来しました」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「世界中で」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「あなたがたの内でも」。ギリシア語は、共同体の間での働きとも、一人ひとりの内での働きとも理解できる。
    reason: lexical_alternative
  - marker: d
    text: 別訳「真理のうちに」。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: この福音は、あなたがたのところにも届いています
  rationale: 分詞は前節の「福音」を受けているため、日本語では指示語を補って明示した。πάρειμι が表す到来と現在の存在の両面のうち、文脈上の福音の広がりを自然に示す「届いています」とした。
- source_word: καθὼς καὶ
  choice: そして、…ように
  rationale: 反復される比較構造を、日本語で不自然にならない形に整えつつ、世界での働きとコロサイの人々の間での働きとの対応を保った。
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: 全世界で
  rationale: κόσμος の広がりをそのまま保ち、パウロの宣教的で包括的な表現を過度に地理的限定しない訳とした。
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: 実を結び、成長している
  rationale: 現在分詞による継続的な動作と、実を結ぶという農耕的比喩を保持した。日本語では二つの動作を並列して自然に表した。
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: あなたがたの間でも
  rationale: 共同体の中で福音が働いていることを自然に表す。「あなたがたの内でも」という内面的な意味も文法上可能なので脚注に残した。
- source_word: ἀφ’ ἧς ἡμέρας
  choice: …日以来
  rationale: 福音が彼らの間で実を結び成長し始めた時点を示す起点表現として、現代日本語に自然な「日以来」を用いた。
- source_word: ἠκούσατε
  choice: これを聞き
  rationale: 目的語は文脈上、福音または神の恵みについての知らせを指す。日本語でつながりを明確にするため「これを」を補ったが、「初めて」は原文に明示されないので加えなかった。
- source_word: ἐπέγνωτε
  choice: 知った
  rationale: 単なる情報取得以上の認識を含み得るが、「十分に理解した」と強めすぎず、文脈に合う簡潔な表現とした。
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: 神の恵み
  rationale: パウロ書簡における重要な表現を、明瞭で定着した日本語として訳した。
- source_word: ἐν ἀληθείᾳ
  choice: 真実のうちに
  rationale: 「真実に」と様態を表す可能性と、「真理の領域・内容において」という可能性を一方に限定せず、原文の曖昧さを保つ表現とした。
theological_decisions:
- issue: 「全世界」の範囲
  choice: 福音の広範な広がりを表す包括的・修辞的表現として、原文どおり「全世界」と訳す。
  alternative: 当時すでに地球上のあらゆる地域と個人に福音が到達していたという厳密な地理的普遍命題として読む。
  rationale: 訳文では原文の普遍的表現を弱めない一方、その射程を説明的に限定したり、厳密な地理的主張へと強めたりしない。
- issue: ἐν ἀληθείᾳ のニュアンス
  choice: 「真実のうちに」として、様態と領域・内容の両方の可能性を残す。
  alternative: 「真実に」または「真理において」と一義的に訳す。
  rationale: ギリシア語は密接に関連する複数の理解を許すため、本文では解釈を固定せず、脚注で代案を示した。
- issue: 福音が「実を結び、成長する」主体性
  choice: 原文の比喩に従い、福音そのものが実を結び成長すると表現する。
  alternative: 信徒または教会が実を結び成長すると説明的に置き換える。
  rationale: 文法上の主体は前節から続く福音であり、信徒への効果を含意しつつも、主体を解釈によって変更しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神の恵み」「実を結ぶ」などの聖書的表現は品位を保って残した。原文は前節から続く一つの関係節だが、日本語では独立した節として理解できるよう「この福音は」を補い、長文を二文に分けた。比較構造と継続的な動作は保持している。
