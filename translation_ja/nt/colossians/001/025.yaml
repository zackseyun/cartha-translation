source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: ja
  text: 私は、神があなたがたのために私に委ねられた務めに従って、この教会に仕える者となりました。それは、神のことばを全うするためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神のことばを余すところなく知らせるため」「神のことばを完成するため」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: この教会に
  rationale: 女性単数属格の関係代名詞は前節の「教会」を受ける。日本語では関係節をそのまま再現せず、指示語を補って自然に接続した。属格の関係は διάκονος と合わせて「教会に仕える者」と表した。
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: 私は…仕える者となりました
  rationale: γίνομαι の役割に入った意味を「となりました」で保ち、διάκονος は後代の教会職制を連想させる「執事」ではなく、奉仕の意味が明確な「仕える者」とした。明示された ἐγώ は「私は」で表した。
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: 神から私に委ねられた務めに従い
  rationale: οἰκονομία は管理・委託・任務を含む語であり、ここでは神から託された宣教上の責任を指す。「務め」と「委ねられた」を組み合わせ、委託の含意を自然な現代日本語で示した。
- source_word: εἰς ὑμᾶς
  choice: あなたがたのために
  rationale: パウロに委ねられた務めが読者に向けられ、その益となることを明瞭に表す。
- source_word: πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: 神のことばを余すところなく伝える
  rationale: πληρόω の「満たす、完全にする」という核を「余すところなく」に残し、文脈上の宣教・告知の働きを「伝える」で明確にした。ただし「成就する／完成する」の可能性も脚注に残した。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: λόγος の宣べ伝えられるメッセージという意味と、聖書的な語感の双方を保つ標準的な訳語である。
theological_decisions:
- issue: πληρῶσαι τὸν λόγον τοῦ θεοῦ の意味
  choice: 神のことばを余すところなく伝える
  alternative: 神のことばを成就する／完成する
  rationale: 直後の「奥義」の啓示と宣教の文脈では、神のことばを十分に告知する意味が有力で、現代日本語としても理解しやすい。一方、動詞自体には満たす・完成する・成就するという幅があるため、別の可能性を脚注で明示し、神学的な含みを閉じない。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。前節から続く関係代名詞を独立した日本語文として自然に再構成した。「奉仕者」「管理」といった硬い専門語を避けつつ、神から委ねられた責任と教会への奉仕を保持した。
