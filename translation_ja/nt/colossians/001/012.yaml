id: COL.1.12
reference: Colossians 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: ja
  text: 光の中にある聖なる者たちの相続分[b]にあずかる資格を、あなたがた[a]に与えてくださった父に感謝をささげつつ、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「あなたがた」の代わりに「私たち」とあります。
    reason: textual_variant
  - marker: b
    text: 別訳「光の中で聖なる者たちに割り当てられた分」。ギリシア語には、くじで割り当てられる相続地・相続分のイメージがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: 感謝をささげつつ
  rationale: 現在能動分詞の継続的な意味と、前節から続く統語的な流れを保つ。父を与格で示す表現にも自然に対応する。
- source_word: τῷ πατρὶ
  choice: 父に
  rationale: 原文どおり、神という語を補わず、定冠詞を伴う関係的称号として訳す。
- source_word: τῷ ἱκανώσαντι
  choice: 資格を…与えてくださった
  rationale: ἱκανόωの『適任にする、資格を与える』という使役的意味を表し、単なる許可や能力付与に狭めない。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: 提示されたSBLGNT本文の二人称複数を採用する。異読のἡμᾶςは脚注に残す。
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: 相続分にあずかる
  rationale: μερίςとκλῆροςが重ねる割り当て・相続のイメージを、日本語として過度に重複させずに表す。εἰςは資格付与の到達点・目的として捉える。
- source_word: τῶν ἁγίων
  choice: 聖なる者たちの
  rationale: パウロ書簡で神に聖別された民を指す複数形として訳し、『聖人』という限定的に受け取られうる語を避ける。
- source_word: ἐν τῷ φωτί
  choice: 光の中にある
  rationale: 『光』の比喩をそのまま保ち、相続分または聖なる者たちに関係する修飾上の余地を完全には解消しない表現とする。
theological_decisions:
- issue: 目的語代名詞の本文異読
  choice: あなたがた
  alternative: 私たち
  rationale: 提示されたSBLGNTのὑμᾶςを本文に採り、意味のある異読ἡμᾶςは脚注で明示する。
- issue: μερίςとκλῆροςの相続・割り当ての比喩
  choice: 相続分にあずかる
  alternative: 聖なる者たちに割り当てられた分を受ける
  rationale: 終末的相続という文脈と旧約的な割り当ての背景を保ちながら、どちらか一方だけに意味を固定しない。
- issue: ἐν τῷ φωτίの係り方
  choice: 光の中にある聖なる者たちの相続分
  alternative: 聖なる者たちが光の中で受ける相続分
  rationale: 原文の語順に近く、光が聖なる者たちまたはその相続分の領域を示す可能性を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈り・賛歌的文脈にふさわしい品位を保った。分詞による前節からの連続を示すため文末を「つつ」とし、この節だけで完結させていない。脚注記号は対応箇所の直後に[a][b]を置いた。
source_grounding:
  english_pob_role: consult_only
