  to: 神は彼らに、異邦人の間にあるこの奥義の栄光の豊かさがどれほど大きいかを知らせることを望まれました。この奥義とは、あなたがたのうちにおられる[a]メシア、すなわち栄光の望みです。
  rationale: 「異邦人の間にある」を「この奥義」に係らせ、「栄光の豊かさ」としてπλοῦτος τῆς δόξηςの語順と意味関係をより明確にしました。「どれほど大きいか」は「豊かさ」の程度を自然な日本語で問う表現です。本文の「あなたがたのうちに」と脚注の「あなたがたの間に」により、ἐν ὑμῖνの個人的・共同体的な読みの両方を保持しています。
