id: COL.1.27
reference: Colossians 1:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: ja
  text: 神は彼らに、異邦人の間にあるこの奥義の栄光の豊かさがどれほど大きいかを知らせることを望まれました。この奥義とは、あなたがたのうちにおられる[a]メシア、すなわち栄光の望みです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたの間におられる」。ギリシア語は、メシアが信者の内におられることとも、共同体のただ中におられることとも取れます。
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: 彼らに
  rationale: 前節の「聖なる者たち」を受ける与格の関係代名詞であり、γνωρίσαιの知らせる相手として自然に表した。
- source_word: ἠθέλησεν
  choice: 望まれました
  rationale: 神の意志と意向を示すθέλωの意味を保ちつつ、現代日本語として自然で品位ある表現とした。
- source_word: γνωρίσαι
  choice: 知らせる
  rationale: γνωρίζωの基本的な使役的意味「知るようにする」を簡潔に表す。
- source_word: τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου
  choice: この奥義の栄光がどれほど豊かなものであるか
  rationale: 圧縮されたギリシア語構文を、日本語で理解しやすい程度に展開し、「豊かさ」と「栄光」の両要素を保持した。
- source_word: μυστηρίου
  choice: 奥義
  rationale: 人には理解不能な謎ではなく、かつて隠され今や示された神の計画を指すパウロ的用法に適した、定着した聖書語である。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 異邦人の間における
  rationale: 文脈上ἔθνηは非ユダヤ人を指すため「諸国民」ではなく「異邦人」とし、ἐνの集団内・領域内の意味を「間における」で示した。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここでは奥義の内容を特定する称号としての力が明瞭なため、「キリスト」ではなく「メシア」とした。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちにおられる
  rationale: 内住を示し得る直接的な訳を本文に置きつつ、共同体のただ中にいるという可能性は脚注に残した。
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: 栄光の望み
  rationale: 属格の簡潔さと、将来の栄光を待ち望む含意を過度に説明せず保った。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: 説明的同格句の中で称号として機能しているため。「キリスト」も伝統的な音訳として可能だが、ここでは称号性を明示した。
- issue: ἐν ὑμῖνの意味
  choice: あなたがたのうちにおられる
  alternative: あなたがたの間におられる
  rationale: ギリシア語は信者の内住と共同体の中での臨在の双方を許す。本文では前者を直接的に訳し、後者を脚注に示して曖昧さを保存した。
- issue: 「栄光の望み」の属格関係
  choice: 栄光の望み
  alternative: 栄光にあずかる望み
  rationale: 後者は意味を明確にするが解釈を加えるため、本文では原文の緊密で多義的な属格表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「奥義」「栄光の望み」により聖書本文としての品位と原文の神学的密度を保った。神への過剰な敬語化は避け、「望まれました」のみで自然な敬意を示した。
