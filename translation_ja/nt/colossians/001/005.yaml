review_pass:
  verdict: revise
  source_fidelity: 主要な語義と統語関係はおおむね適切です。ἣνが「希望」を受ける点、「福音」が「真理のことば」と同格である点、また天に蓄えられているという比喩は保たれています。しかし、ἐν τῷ λόγῳはここでは「真理のことば、すなわち福音の中で／その中において」とするのがより直接的であり、「福音によって」は手段を強めています。
  naturalness: 現行の「以前すでに」は意味が重複し、「真理のことば、すなわち福音によって聞いていました」はやや硬く、何を聞いたかのつながりも弱くなっています。「この希望について」「福音の中ですでに聞いていました」とすると、明快な現代標準日本語になります。
  terminology: 「希望」「天」「真理のことば」「福音」はいずれも適切で、教派的な含意を加えていません。「天」は本文では自然な単数表現とし、ギリシア語の複数形は脚注で示す方針で問題ありません。
  issues:
  - severity: medium
    issue: ἐν τῷ λόγῳを「福音によって」と訳している。
    rationale: ἐνは「真理のことば、すなわち福音」の中で希望を聞いたという伝達内容・領域を示す。日本語の「〜によって」は福音を手段として前景化し、原文の表現からわずかに離れる。
  - severity: low
    issue: 「以前すでに」が冗長である。
    rationale: προηκούσατεの先行性は「すでに」または「以前」のいずれかで十分に表せる。
  - severity: low
    issue: 脚注bの「または『前もって』」が本文の動詞に対する有用な代替訳として不明瞭である。
    rationale: προηκούσατεは「以前に聞いた／あらかじめ聞いていた」と動詞句として示すのが明確である。
  revised_text: それは、あなたがたのために天に蓄えられている希望のゆえです[a]。あなたがたはこの希望について、真理のことば、すなわち福音の中ですでに聞いていました[b][c]。
