  to: それは、あなたがたのために天に蓄えられている希望のゆえです[a]。あなたがたはこの希望について、真理のことば、すなわち福音の中ですでに聞いていました[b][c]。
  rationale: 原文の希望を先行詞とする関係節を「この希望について」と明示したまま、ἐν τῷ λόγῳを「福音の中で」として原文の結び付きを保ちました。「すでに」によりπρο-の先行性を自然に表し、冗長な「以前すでに」を避けました。
