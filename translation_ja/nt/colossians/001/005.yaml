  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: ja
  text: それは、あなたがたのために天に蓄えられている希望のゆえです[a]。あなたがたはこの希望について、真理のことば、すなわち福音の中ですでに聞いていました[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「もろもろの天に」。ギリシア語は複数形。
    reason: lexical_alternative
  - marker: b
    text: または「以前に聞いていました」「あらかじめ聞いていました」。
    reason: lexical_alternative
  - marker: c
    text: 「真理のことば」は「真理の知らせ」とも訳せる。「福音」は、そのことば（知らせ）が何であるかを示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: 希望のゆえです
  rationale: διά＋対格が表す理由・根拠を明確にし、前節から続く感謝の理由として読める形にした。「希望」はἐλπίςの標準的な訳語である。
- source_word: ἀποκειμένην ὑμῖν
  choice: あなたがたのために…蓄えられている
  rationale: ἀπόκειμαιの「取っておかれている、蓄えられている」という比喩と、ὑμῖνの受益の意味を保った。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天に
  rationale: 原文は複数形だが、現代日本語では「天に」が自然であり、複数形であることは脚注に示した。
- source_word: ἣν
  choice: この希望について
  rationale: 女性単数関係代名詞がἐλπίδα（希望）を直接受けることを、日本語で曖昧にならないよう明示した。
- source_word: προηκούσατε
  choice: 以前すでに…聞いていました
  rationale: προ-が示す先行性を「以前すでに」で表した。日本語では希望を「聞く」際に「について」を補うのが自然である。
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: 真理のことば…によって
  rationale: λόγοςの基本的な表現を保って「ことば」とし、その知らせを通して希望を聞いたという手段的な関係が自然に伝わるよう「によって」とした。
- source_word: τοῦ εὐαγγελίου
  choice: すなわち福音
  rationale: 属格を同格と理解し、「真理のことば」を「福音」が特定している関係を「すなわち」で明示した。εὐαγγέλιονには日本語で広く定着した「福音」を用いた。
theological_decisions:
- issue: 関係節が指すもの
  choice: 聞いた対象を「この希望」とする
  alternative: 福音の内容全体を漠然と指すとする
  rationale: 関係代名詞ἣνは女性単数で、ἐλπίδα（希望）と直接一致するため、その統語関係を本文で明確にした。
- issue: 「天」の数
  choice: 本文では自然な日本語の単数表現「天に」とし、原文の複数形は脚注に示す
  alternative: 「もろもろの天に」など、複数性を本文に明示する
  rationale: 原文の形は脚注で保持しつつ、日本語として不自然な宇宙論的含意を加えないようにした。
- issue: 「真理のことば」と「福音」の関係
  choice: 「福音」を「真理のことば」と同格に読む
  alternative: 「福音の真理のことば」のような所有・限定関係に読む
  rationale: τοῦ εὐαγγελίουは直前の「真理のことば」を言い換えて特定する同格的属格とみるのが文脈上自然であり、「すなわち」で表した。
translation_notes:
  register: 明快で現代的かつ品位ある標準語を用いた。原文が前節に理由をつなぐ構文であるため、独立節としても意味が通るよう冒頭を「それは…ゆえです」とした。「蓄えられている」で比喩を保ち、関係代名詞の先行詞は「この希望」と明示した。
