  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: ja
  text: 多くの時代と世代にわたって隠されていた奥義[a]が、しかし今、神の聖なる者たち[b]に明らかにされました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「秘められた計画」とも訳せます。パウロが言う「奥義」は、限られた者だけの秘伝ではなく、かつて隠され、今は神によって明らかにされた神の目的を指します。
    reason: lexical_alternative
  - marker: b
    text: 「神の聖徒たち」とも訳せます。ここでは、神のものとして取り分けられた信徒たちを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: 奥義
  rationale: パウロにおいて、かつて隠され、今は神によって明らかにされた神の目的・計画を指す語として、簡潔で定着した訳語を採用した。ただし、限られた者だけが知る秘伝という意味に誤解されないよう脚注で説明する。
- source_word: τὸ ἀποκεκρυμμένον
  choice: 隠されていた
  rationale: 完了受動分詞が表す、以前から隠された状態にあったことを、自然な現代日本語で示す。
- source_word: ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν
  choice: 幾つもの時代と世代にわたって
  rationale: αἰῶνεςとγενεαίの並行関係を保ちつつ、日本語として理解しやすく、長期間にわたる隠蔽を表す。原文にない「すべて」は加えない。
- source_word: νῦν δὲ
  choice: 今や
  rationale: 過去の隠蔽と現在の啓示との強い対照を、簡潔で格調ある日本語で表す。
- source_word: ἐφανερώθη
  choice: 明らかにされました
  rationale: アオリスト受動の意味を保持し、啓示の主体を本文に補わずに自然な受動表現とする。
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: 神の聖なる者たちに
  rationale: ἅγιοιを、特別に列聖された少数者ではなく、神のものとして取り分けられた信徒共同体を指す語として訳す。αὐτοῦの指示対象は直前の文脈上の神であるため、日本語では明示した。
theological_decisions:
- issue: μυστήριονの意味
  choice: 奥義
  alternative: 秘められた計画／秘密
  rationale: 神の目的がかつて隠され、今や開示されたというパウロ的な緊張を保つ。「秘密」だけでは日常的で軽く響き、「秘められた計画」は説明的で、直後の「隠されていた」と重複する。
- issue: 「神の聖なる者たち」の範囲
  choice: 神に属する信徒共同体を指す表現として「神の聖なる者たち」
  alternative: 神の民／聖徒たち
  rationale: ἅγιοιの聖別という語義を保ちながら、後代の列聖された特別な人物だけに限定しない。「神の民」は明快だが、聖性の要素が弱まる。
translation_notes:
  register: 明瞭な現代標準語を用い、文末は前後の本文に接続しやすい丁寧体とした。「幾つもの時代と世代にわたって」で原文の二重表現を不自然な直訳にせず保持し、「今や」によって隠蔽と啓示の対照を際立たせた。
