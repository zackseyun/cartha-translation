  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: ja
  text: 御子は、見えない神のかたちであり、すべての被造物の長子です[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「長子」は、最初に生まれた者を指すほか、地位や相続権を持つ者を表すことがある。この句は、「すべての被造物の長子」とも、「すべての被造物に対して長子としての地位を持つ方」とも理解されうる。続く16–17節参照。
    reason: 「長子」と属格の結びつきが持つ意味の幅を示し、御子が被造物の一部であるとの解釈にも、被造物に対する地位を表すとの解釈にも、本文を不用意に固定しないため。
lexical_decisions:
- source_word: ὅς
  choice: 御子は
  rationale: 関係代名詞は直前の「御子」を受ける。日本語では文脈上の指示対象を明示して新しい文とするのが自然である。
- source_word: εἰκὼν
  choice: かたち
  rationale: 神を現し示す「像・イメージ」という比喩を保ちつつ、現代日本語の聖書文体として自然な「かたち」とした。単なる外見という意味に限定しない。
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: 見えない神の
  rationale: ἀόρατοςの「目に見えない」という意味を簡潔に表し、属格関係もそのまま保った。
- source_word: πρωτότοκος
  choice: 長子
  rationale: 第一に生まれた者という語形と、聖書的背景にある地位・相続権の含みを保持する。「最も優れた方」などの解釈的な言い換えは避けた。
- source_word: πάσης κτίσεως
  choice: すべての被造物の
  rationale: 属格を直接反映し、その関係を本文で「その一部」または「その上に立つ者」のどちらかに限定しない。日本語として理解可能な神学用語「被造物」を用いた。
theological_decisions:
- issue: πρωτότοκος πάσης κτίσεωςがキリストと被造物とのどのような関係を表すか
  choice: すべての被造物の長子
  alternative: すべての被造物に先立つ長子／すべての被造物を治める長子
  rationale: ギリシア語の属格を保ち、本文だけで支配・優越の意味に決め切らない。一方、「長子」には誕生順だけでなく地位や相続権を表す用法があり、直後の16–17節は御子と創造との関係をさらに説明するため、その幅を脚注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御子」は直前の文脈を明示し、「かたち」「長子」という主要な比喩を保った。「被造物」はやや神学的だが、πάσης κτίσεωςの包括性と語義を簡潔に伝えるため採用した。
