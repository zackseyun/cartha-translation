source:
  edition: SBLGNT
  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: ja
  text: 神の栄光の威力に応じて、あらゆる力をもって強められ、喜びをもって[a]、あらゆる状況で忍耐と寛容を保てるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「喜びをもって」は、次節の「感謝し」に結び付けて読むこともできます。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: あらゆる力をもって強められ
  rationale: 現在受動分詞が表す継続的な受動の働きを「強められ」で示し、ἐν πάσῃ δυνάμει の手段・領域の意味と包括性を「あらゆる力をもって」で自然に表した。
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: 神の栄光の力強さに応じて
  rationale: κατά の基準・尺度を「に応じて」で表し、δύναμις と κράτος の語の重なりを完全には同一化せず、属格「その方の栄光の」を保持した。「その方」が直前文脈を必要とするため、単独節として明瞭な「神の」を用いた。
- source_word: εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν
  choice: どこまでも耐え忍び、寛容でいられますように
  rationale: εἰς の目的・結果を祈願文として自然に表現した。ὑπομονήは試練の下での堅忍を「耐え忍ぶ」、μακροθυμίαは怒りを遅くして人に忍耐する含意を「寛容でいる」と訳し分け、πᾶσαν の包括性を「どこまでも」に込めた。
- source_word: μετὰ χαρᾶς
  choice: 喜びをもって
  rationale: χαράを名詞として明示し、後続または先行する忍耐・寛容との係り方を過度に限定しない表現とした。
theological_decisions:
- issue: 神の力と栄光の関係
  choice: 神の栄光の力強さに応じて
  alternative: 神の栄光ある力に応じて
  rationale: τὸ κράτος τῆς δόξης αὐτοῦ の属格構造を保ち、δόξαを単なる形容詞「栄光ある」に解消しないことで、力強さと神の栄光との密接だが明示的には説明されない関係を残した。
- issue: μετὰ χαρᾶς の統語的な係り先
  choice: 喜びをもって、どこまでも耐え忍び、寛容でいられますように
  alternative: どこまでも耐え忍び、寛容であり、喜びをもって感謝する
  rationale: 句読点のない原文では「喜びをもって」が1:11の忍耐・寛容に係るか、1:12の感謝に係るかに曖昧さがある。本文ではSBLGNTの句読法および一般的な節区分に従い1:11に含めたが、別の係り方を脚注で明示した。
translation_notes:
  register: 現代の一般読者に明瞭な祈願文としつつ、荘重さを保った。「力」「力強さ」と語を重ね、原文の δύναμις／κράτος の力語彙の畳みかけを反映した。脚注記号[a]は本文末に置いた。
