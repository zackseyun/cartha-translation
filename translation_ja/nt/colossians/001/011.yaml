  source_fidelity: 「神の栄光の力強さ」は κράτος（威力・力能）を「力強さ」という性質語に弱め、また日本語としても係りがやや不明瞭です。「神の栄光の威力に応じて」とすることで、κατά の尺度・基準と τὸ κράτος τῆς δόξης αὐτοῦ の属格構造をより直接に反映できます。また、πᾶσαν ὑπομονὴν καὶ μακροθυμίαν は「どこまでも耐え忍び」とすると「終わりなく」の意味合いが前面に出るため、包括性をより適切に表すよう整えます。
  naturalness: 修正文は現代標準日本語として自然な祈願調を保ちます。「あらゆる状況で忍耐と寛容を保てるように」は、二つの抽象名詞にかかる πᾶσαν の包括性を日本語で明瞭に表します。脚注記号は、係り先が問題となる「喜びをもって」の直後に置きます。
  terminology: δύναμις は「力」、κράτος は「威力」として訳し分けます。ὑπομονή は「忍耐」、μακροθυμία は特に対人関係での辛抱・寛容を含むため「寛容」とします。δόξα は「栄光」を維持します。
