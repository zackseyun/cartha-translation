  - severity: medium
    issue: 「どこまでも耐え忍び」は πᾶσαν の包括性を『時間的に終わりなく』という意味へ寄せている。
    rationale: πᾶσαν は忍耐と寛容の全き・包括的なあり方を修飾する。日本語では「あらゆる状況で忍耐と寛容を保てるように」とするほうが意味を自然に伝える。
  - severity: low
