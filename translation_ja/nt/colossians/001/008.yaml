  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: ja
  text: エパフラスはまた、あなたがたが聖霊にあって持つ愛を、私たちに知らせました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの霊における愛」。ここでの「霊」は聖霊ではなく、愛の霊的な性質または領域を指すとも理解できる。
    reason: πνεύματιは聖霊への言及と理解できる一方、より一般的に霊的な性質・領域を表すとも読めるため。
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: 彼は……知らせてくれました
  rationale: 冠詞付きアオリスト分詞は前節のエパフラスを指す名詞的用法。日本語では主語を補った独立文とし、δηλόωを文脈に即して「知らせる」と訳した。
- source_word: καὶ
  choice: また
  rationale: 前節で述べられたエパフラスの働きに、さらに別の行為を加える添加の働きを自然な日本語で示した。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: エパフラスが知らせた相手であるパウロとその同労者を示す間接目的語として訳した。
- source_word: τὴν ὑμῶν ἀγάπην
  choice: あなたがたの愛
  rationale: 属格代名詞とἀγάπηの関係をそのまま保ち、ἀγάπηは一般的で明瞭な「愛」とした。
- source_word: ἐν πνεύματι
  choice: 御霊にある
  rationale: パウロ書簡で最も可能性の高い聖霊への言及を本文に採りつつ、ἐνの領域・関係の含みを「にある」で保った。冠詞がないため、より一般的な「霊における／霊的な」という理解も脚注に残した。
theological_decisions:
- issue: πνεύματιの指示対象
  choice: 「御霊にある」とし、聖霊を指す可能性が高い読みを本文に置く
  alternative: 「霊における」、すなわち「霊的な愛」
  rationale: この無冠詞形は聖霊を指し得る一方、人の霊や霊的な性質・領域を表す可能性もある。本文で有力なパウロ的用法を示し、別解を脚注に明記して原文の曖昧さを保存した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文としての品位を保つ文体。「御霊」は聖霊への指示を示しつつ、脚注で原文の語義上の幅を保持した。「くれました」は報告がパウロたちに向けられたことを自然に表す。
