id: COL.1.13
reference: Colossians 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: ja
  text: 御父は、私たちを闇の支配権から救い出し、ご自分の愛する御子の王国へ移してくださいました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ご自分の愛の御子」。または「ご自分の愛された御子」。
    reason: 原文の属格表現と、その可能な自然な言い換えを示すため。
lexical_decisions:
- source_word: ἐρρύσατο
  choice: 救い出し
  rationale: 危険や敵対する力から決定的に救出する意味を、現代日本語で自然かつ明確に表す。
- source_word: ἐξουσίας
  choice: 支配権
  rationale: ここでは闇が及ぼす権威・支配する力を指す。「権威」だけより文脈に自然であり、「領域」と限定することも避けられる。
- source_word: σκότους
  choice: 闇
  rationale: 原語の比喩的表現をそのまま保ち、道徳的・霊的意味を本文で説明的に付け加えない。
- source_word: μετέστησεν
  choice: 移してくださいました
  rationale: 一つの支配下から別の王国へ移すという動きを表す。神の行為に対する日本語として自然な敬意を示す。
- source_word: βασιλείαν
  choice: 王国
  rationale: εἰςを伴う移動の比喩に適し、御子が統治する領域とその支配の双方を示唆する。
- source_word: υἱοῦ
  choice: 御子
  rationale: 文脈上、神の独自の子を指すため、現代日本語の聖書文体として自然な「御子」とする。
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: ご自分の愛する御子
  rationale: ギリシア語の属格表現が示す、御父が愛する御子という意味を、日本語で明瞭かつ自然に表す。字義的な構造は脚注に残す。
theological_decisions:
- issue: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ の属格表現
  choice: ご自分の愛する御子
  alternative: ご自分の愛の御子
  rationale: 原文は字義的には「彼の愛の御子」だが、日本語でその形を保つと意味関係が不自然で不明瞭になる。本文では御父の御子への特別な愛を自然に表し、原文の構造と「愛された御子」という可能な表現を脚注に示す。
- issue: 関係代名詞 ὃς の先行詞
  choice: 御父は
  alternative: この方は
  rationale: 直前の1章12節で明示される「御父」を受ける。日本語では関係代名詞を逐語的に再現できないため、指示対象を明示して文を自然に始める。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神を指す「御父」「御子」と敬意を表す補助動詞によって、簡潔で品位ある聖書本文の文体とした。
