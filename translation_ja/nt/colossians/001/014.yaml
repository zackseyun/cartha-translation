  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: ja
  text: この御子にあって、私たちは贖い、罪の赦しを得ています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: この御子にあって
  rationale: 男性単数の関係代名詞は前節の「愛する御子」を指す。「御子にあって」は、単なる手段ではなく、御子との関係・結びつきのうちにあることを保つ。単独節としても指示対象が分かるよう「この御子」とした。
- source_word: ἔχομεν
  choice: 私たちは…得ています
  rationale: 現在形が表す、贖いと赦しを今すでに有している状態を、自然な現代日本語で示す。
- source_word: ἀπολύτρωσιν
  choice: 贖い
  rationale: 解放の意味を含みつつ、パウロ書簡における救済的な重みを保つ定着した訳語。「解放」も可能だが、語の神学的響きを弱めうる。
- source_word: ἄφεσιν
  choice: 赦し
  rationale: 罪を対象とする文脈では「赦し」が最も明瞭で自然。「解放」や「免除」より倫理的・関係的な意味が伝わる。
- source_word: τῶν ἁμαρτιῶν
  choice: 罪の
  rationale: 属格複数を日本語では自然な総称表現「罪の」とし、赦しの対象を明確にした。
theological_decisions:
- issue: 「贖い」と「罪の赦し」の関係
  choice: 同格関係を「贖い、すなわち罪の赦し」と表す。
  alternative: 「贖い、罪の赦し」と並置する。
  rationale: ギリシア語の二つの定冠詞付き名詞句は同格であり、後者がここでの贖いの内容を明示する。日本語では無接続の並置が二項列挙にも読めるため、「すなわち」により原文の同格関係を明確にした。ただし、贖いの概念をあらゆる文脈で罪の赦しだけに限定するものではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御子」「贖い」「赦し」は聖書語として定着しているが、脚注で語義を補った。「得ています」は現在の所有状態を自然に伝える。
