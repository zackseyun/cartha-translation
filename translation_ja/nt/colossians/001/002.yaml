  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: ja
  text: 'コロサイにいる、メシア[c]にあって聖なる、忠実な[a]兄弟たち[b]へ。


    私たちの父である神から、恵みと平安があなたがたにあるように。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信じている」または「信仰を持つ」とも訳せる。ギリシア語πιστοῖςは、信じていることも忠実であることも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 原文は「兄弟たち」。この呼びかけは、女性を含む共同体全体を指している可能性が高い。
    reason: lexical_alternative
  - marker: c
    text: 伝統的な訳では「キリスト」。ギリシア語Χριστόςは「メシア」を意味する称号。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: コロサイにいる……へ
  rationale: 場所を表すἐνを自然な現代日本語で示し、書簡の宛先であることを「へ」で明確にした。
- source_word: ἁγίοις
  choice: 聖なる
  rationale: 神のために取り分けられた者という基本的な意味を保ち、後代の特定の称号を連想させやすい名詞的表現を避けた。
- source_word: πιστοῖς
  choice: 忠実な
  rationale: πιστόςが表し得る忠実さを本文に採用した。ただし「信じる者」という意味も可能なため、脚注で曖昧さを保持した。
- source_word: ἀδελφοῖς
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文に反映した。一方、この呼びかけが共同体の女性も含む可能性を脚注で説明した。
- source_word: ἐν Χριστῷ
  choice: メシアにある
  rationale: Χριστόςを称号として「メシア」と訳し、ἐνが表すメシアとの結びつき・領域の含意を、定着した簡潔な表現「にある」で保った。
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: 恵みと平安があなたがたにあるように
  rationale: 動詞のない挨拶句を、日本語では自然な祝願として表した。恵み、受け手、平安という原文の要素をすべて保持した。
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: 私たちの父である神から
  rationale: πατρὸς ἡμῶνをθεοῦと同格に理解し、「私たちの父なる神」よりも明瞭な現代日本語で表した。
theological_decisions:
- issue: ἐν ΧριστῷにおけるΧριστόςの訳
  choice: メシア
  alternative: キリスト
  rationale: ここでもΧριστόςの称号としての意味を表に出した。日本語で伝統的な「キリスト」も脚注に残した。
- issue: ἀδελφοῖςの性と指示範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／きょうだいたち
  rationale: 原文の文法上の男性複数形を保持しつつ、パウロが女性を含む共同体全体に語りかけている可能性を脚注で明示した。
- issue: πιστοῖςの意味の幅
  choice: 忠実な
  alternative: 信じる／信仰のある
  rationale: 忠実さと信仰のどちらも語義上可能であり、文脈だけで一方に限定できないため、本文と脚注でその緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。教会内でのみ通じやすい「父なる神」は避け、「私たちの父である神」とした。「メシアにある」はパウロ特有の結びつきの表現を簡潔に保つため採用した。
