id: COL.1.16
reference: Colossians 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: ja
  text: というのも、御子にあって、天にあるものも地にあるものも、見えるものも見えないものも、王座であれ、主権であれ、支配であれ、権威であれ、すべてのものが造られたからです。すべてのものは、御子を通して、御子のために造られたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御子のために」は、「御子に向かって」とも訳せます。創造の目標または帰着点が御子であることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 直前の御子の卓越性についての主張に根拠を示す接続であり、因果関係を自然な現代日本語で明示する。
- source_word: ἐν αὐτῷ
  choice: 御子にあって
  rationale: 後半のδι’ αὐτοῦ（御子を通して）との違いを保ち、ἐνを単純に手段の「によって」へ置き換えない。日本語で聖書的な尊厳を保ちつつ、御子との関係・領域を表す。
- source_word: ἐκτίσθη
  choice: 造られた
  rationale: 被動形を保ち、τὰ πάνταの包括的な被造性を明確にする。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 宇宙全体という解釈的な言い換えを避けつつ、原文の包括性を自然に伝える。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天にあるもの
  rationale: ギリシア語は複数形だが、日本語では「天」が自然であり、後続の地との対句も明瞭になる。
- source_word: ἐπὶ τῆς γῆς
  choice: 地にあるもの
  rationale: 天との対比を簡潔かつ自然に示す。
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: 見えるものも見えないものも
  rationale: 実体化された形容詞の対照を、明快な現代日本語で再現する。
- source_word: θρόνοι
  choice: 王座
  rationale: 権威ある地位または権力の階級を指しうる比喩を解釈しすぎず保持する。
- source_word: κυριότητες
  choice: 主権
  rationale: 支配権を持つ勢力・階級を表す語として、ἀρχαίやἐξουσίαιとの語義上の区別を可能な範囲で保つ。
- source_word: ἀρχαί
  choice: 支配
  rationale: 統治する勢力を表し、「権威」と重複しすぎない簡潔な訳語を選ぶ。
- source_word: ἐξουσίαι
  choice: 権威
  rationale: 権限・権威を持つ存在または勢力を示す直接的な訳語である。
- source_word: δι’ αὐτοῦ
  choice: 御子を通して
  rationale: 御子が創造の媒介であることを示すδιάの意味を保つ。
- source_word: εἰς αὐτόν
  choice: 御子のために
  rationale: 創造が御子を目標・帰着点としていることを自然な日本語で表す。方向性をより字義的に表す別訳は脚注に示す。
- source_word: ἔκτισται
  choice: 造られています
  rationale: 完了形が示す、創造されたという出来事とその現在に至る結果状態を日本語の「ています」で表す。
theological_decisions:
- issue: ἐν αὐτῷ／δι’ αὐτοῦ／εἰς αὐτόνという三つの前置詞句に示される御子と創造の関係
  choice: 「御子にあって……御子を通して、御子のために」と訳し、三つの表現を区別する。
  alternative: 「御子によって……御子を通して、御子のために」、または「御子との結びつきの中で……御子を通して、御子へと」
  rationale: 原文が意図的に使い分ける前置詞を一つの手段表現へ平板化せず、創造に対する御子の関係の豊かさと曖昧さを保つ。
- issue: 「王座、主権、支配、権威」が指す存在の性質
  choice: 被造世界に属する権力・権威の諸範疇として訳し、それらが天使的存在か地上的制度かを本文で限定しない。
  alternative: 天使の階級と明示する、または人間の政治権力と明示する。
  rationale: この節自体はこれらを見えないものも含む被造の権威として列挙するが、その範囲を一方に限定してはいない。
translation_notes:
  register: 明快な現代標準語を用いながら、「御子にあって」「御子を通して」という表現で原文の前置詞の区別と神学的な含みを保持した。「王座、主権、支配、権威」は伝統的な荘重さを残しつつ、特定の天使論へ限定しない。原文は一文だが、日本語の可読性のため二文とし、後半の完了形を「造られています」で表した。
