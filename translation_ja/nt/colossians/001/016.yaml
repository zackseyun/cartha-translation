revisions:
- from: というのも、御子にあって、天にあるものも地にあるものも、見えるものも見えないものも、王座であれ、主権であれ、支配であれ、権威であれ、すべてのものが造られたからです。すべてのものは、御子を通して、御子のために造られています。[a]
  to: というのも、御子にあって、天にあるものも地にあるものも、見えるものも見えないものも、王座であれ、主権であれ、支配であれ、権威であれ、すべてのものが造られたからです。すべてのものは、御子を通して、御子のために造られたのです。[a]
