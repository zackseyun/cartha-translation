base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: ja
  text: 神の御心によってメシア・イエスの使徒であるパウロと、兄弟テモテから、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: パウロ
  rationale: 日本語聖書で定着した人名表記。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 単なる使者ではなく、パウロの職務上の自己認識を表す定着した訳語。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア・イエスの
  rationale: Χριστόςの称号としての意味を保ち、属格を自然な日本語で表した。
- source_word: διὰ θελήματος θεοῦ
  choice: 神の御心によって
  rationale: διά＋属格が示す根拠・媒介を「によって」で表し、θέλημαには神への敬意を含む自然な定訳「御心」を用いた。
- source_word: Τιμόθεος ὁ ἀδελφὸς
  choice: 兄弟テモテ
  rationale: 冠詞付きἀδελφόςをキリスト者共同体における呼称として、補足的な所有代名詞を加えず簡潔に表した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この句ではイエスに付された称号としての語義が保たれているため、「メシア」と訳した。
- issue: ὁ ἀδελφόςの関係性
  choice: 兄弟テモテ
  alternative: 私たちの兄弟テモテ
  rationale: ギリシア語に所有代名詞はなく、日本語では「兄弟テモテ」で共同体的な関係を自然に示せるため、明示的な「私たちの」を補わなかった。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡冒頭にふさわしい端正な文体。「から」を補い、差出人句として日本語で自然にした。節末は次節へ続くため読点とした。
