reference: Colossians 1:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: ja
  text: 今、私はあなたがたのために受けている苦しみの中で喜んでいます。そして私は、自分の肉において、メシア[b]の苦難に欠けているところを、そのからだ、すなわち教会のために満たしています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「満たしています」は、「残っている分を満たしている」とも訳せる。この表現は、メシアの贖いの働きが不十分だったことを述べるものではなく、一般には、パウロがメシアとそのからだである教会に関わる苦難に参与していることを指すと理解される。
    reason: alternative_reading
  - marker: b
    text: ギリシア語は「クリストス」。ここでは称号として用いられているため、「メシア」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν χαίρω
  choice: 今、私は……喜び
  rationale: 現在の状況におけるパウロの喜びを、簡潔で自然な日本語で表す。
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: あなたがたのために受けている苦しみを
  rationale: ἐν の領域的な意味を日本語では目的語構文で自然に表し、ὑπέρの受益的意味を「ために」で保持する。苦しみがパウロ自身のものであることは一人称の文脈から補った。
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: 欠けたところを……満たしています
  rationale: 原文の「不足・残りを満たす」という強い比喩と神学的緊張を弱めずに保持する。
- source_word: τῶν θλίψεων τοῦ Χριστοῦ
  choice: メシアの苦難
  rationale: θλίψειςを前半のπαθήματα「苦しみ」と区別して「苦難」とし、Χριστόςの称号としての働きを「メシア」で表す。
- source_word: ἐν τῇ σαρκί μου
  choice: 私の肉において
  rationale: パウロの身体的・現世的存在を指すσάρξを「肉」として明示し、「罪深い性質」という解釈を持ち込まない。
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: メシアのからだ……のために
  rationale: ὑπέρの受益的意味を保ち、αὐτοῦの指示対象を日本語で明瞭にするため「メシア」を補う。
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: すなわち教会
  rationale: 関係節の同定機能を自然な日本語で明確に表す。ἐκκλησίαはパウロの教会論的用法に従い「教会」とする。
theological_decisions:
- issue: 「メシアの苦難の欠けたところ」の意味
  choice: 強い原文表現を本文に残し、パウロがメシアとその教会に結びつく苦難に参与することとして注で説明する。
  alternative: メシアの贖罪的苦しみそのものが不足しており、パウロがそれを補完するという読み。または終末の苦難の定量のみを指すという読み。
  rationale: 原文は「欠けたところを満たす」と明言するため、その緊張を本文で解消しない。一方、θλίψειςという語と「そのからだ、すなわち教会のために」という文脈は、メシアの贖罪の不足よりも、宣教と教会に伴う苦難への参与を支持する。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味が保たれているため、「メシア」と訳す。
translation_notes:
  register: 明瞭で現代的ながら尊厳のある文体。「私の肉において」は日常語としてやや硬いが、σάρξの身体性と原文の比喩を保持するため採用した。脚注記号は該当する主張と語句を含む文末に配置した。
