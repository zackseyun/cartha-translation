revisions:
- from: ただし、あなたがたが信仰にとどまり、土台の上に据えられて堅く立ち、聞いた福音のもたらす希望から離されないでいるならばです。この福音は、天の下のすべての造られたものに[a]宣べ伝えられ、私パウロはその福音に仕える者[b]となりました。
  to: あなたがたが、土台の上に据えられ、堅く立ち、聞いた福音のもたらす希望から離されることなく、信仰にとどまり続けるならばです。この福音は、天の下のすべての被造物に[a]宣べ伝えられたものであり、私パウロはその福音に仕える者[b]となりました。
  rationale: 「ただし」を除き、εἴ γεの条件性を保ちながら、日本語として自然な前節連結の条件節に改めました。「とどまり続ける」によりἐπιμένετεの継続性を表し、「離されることなく」によりμὴ μετακινούμενοιの受動的・継続的な含意を保持しました。福音が宣べ伝えられたことを「この福音は……宣べ伝えられたものであり」として明確にし、脚注ではκτίσιςとδιάκονοςの語彙上の代替を維持しました。
