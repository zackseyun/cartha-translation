id: COL.1.23
reference: Colossians 1:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: ja
  text: あなたがたが、土台の上に据えられ、堅く立ち、聞いた福音のもたらす希望から離されることなく、信仰にとどまり続けるならばです。この福音は、天の下のすべての被造物に[a]宣べ伝えられたものであり、私パウロはその福音に仕える者[b]となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天の下の全被造世界で」。ギリシア語の「クティシス」は、「創造された世界」または「造られたもの」を意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「奉仕者」「働き人」。ここで「仕える者」と訳したギリシア語は、文脈により「奉仕者」や「働き人」を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ただし、……ならばです
  rationale: 実質的な条件を明示しつつ、γεの強調を「ただし」で表した。単なる不確実性にも既成事実にも決めつけない。
- source_word: ἐπιμένετε τῇ πίστει
  choice: 信仰にとどまり
  rationale: 現在形の継続性と、与格が示す信仰という領域・立場を自然な日本語で保持する。
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: 土台の上に据えられて堅く立ち
  rationale: 完了受動分詞の結果状態と基礎の比喩を「据えられて」で示し、ἑδραῖοιの安定性を「堅く立ち」で表す。
- source_word: μὴ μετακινούμενοι
  choice: 離されないでいる
  rationale: 受動的な移動・逸脱の含意と継続的な状態を保つ。
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: 福音のもたらす希望から
  rationale: 属格の関係を過度に限定せず、福音と結びつき福音によって与えられる希望として明瞭にした。
- source_word: τοῦ κηρυχθέντος
  choice: 宣べ伝えられ
  rationale: 福音の公的な告知を表す教会語として定着しつつ、現代日本語でも理解可能な表現。
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: 天の下のすべての造られたものに
  rationale: ἐνを宣教対象を表す用法と取り、κτίσιςを個々の被造物を含む表現にした。語の集合的な「全被造世界」という可能性は脚注に残す。
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: 私パウロはその福音に仕える者となりました
  rationale: 関係代名詞の先行詞を福音として明示し、διάκονοςを制度的役職に限定しない「仕える者」と訳した。
theological_decisions:
- issue: εἴ γεが示す信仰継続の条件
  choice: 「ただし、……ならば」と実質的な条件として訳す
  alternative: 「あなたがたが信仰にとどまっている以上」と確信を前面に出す
  rationale: 本文は継続を条件として提示するが、背教の可能性や最終的堅忍について体系的結論までは述べていないため、その緊張を保持した。
- issue: τῇ πίστειにおけるπίστιςの意味
  choice: 信仰
  alternative: 忠実さ／信頼
  rationale: この文脈では、信者がとどまるべき信仰、または信仰の領域を指すのが自然であり、「忠実さ」に限定しない。
- issue: 福音宣教の普遍的表現
  choice: 天の下のすべての造られたものに宣べ伝えられた
  alternative: 天の下の全被造世界で宣べ伝えられた
  rationale: 宇宙的・普遍的な広がりを保ち、これを地理的な到達範囲についての厳密な命題に狭めない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。長いギリシア語文を二文に分け、条件節と福音についての説明の関係を読み取りやすくした。「土台」「堅く立つ」という比喩は保持し、教派固有の用語や解釈は避けた。
