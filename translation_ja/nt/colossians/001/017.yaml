  text: καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: ja
  text: また、この方ご自身は、すべてのものより先におられ[a]、すべてのものはこの方にあって成り立っています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてのものより先に」は、すべてのものに勝る地位をも含意し得るが、ギリシア語の表現は第一に先行性を示す。
    reason: alternative_reading
  - marker: b
    text: 別訳「すべてのものはこの方にあって一つに保たれています」または「存立しています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: この方
  rationale: 文脈上の御子を指す強調された代名詞。日本語で「彼」とするより自然で敬意があり、「御子」と明示的に言い換えずに原文の代名詞を保つ。
- source_word: πρὸ πάντων
  choice: すべてのものより先に
  rationale: 属格を伴う πρό の第一義である時間的先行性を明確に表し、単なる地位の優越へ狭めない。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 包括的な範囲と周辺文脈での反復を保ち、「被造物」だけに限定しない。
- source_word: ἐν αὐτῷ
  choice: この方にあって
  rationale: ἐν の「中に／領域に」という関係を保つ聖書日本語として自然な表現であり、「この方によって」と道具的意味だけに決めない。
- source_word: συνέστηκεν
  choice: 成り立っています
  rationale: 完了形が示す、成立した結果として現在も存続・結合している状態を表す。「保たれている」ほど作用主体を明示せず、「存立する」「凝集する」より平明である。
theological_decisions:
- issue: πρὸ πάντων におけるキリストと万物の関係
  choice: 「すべてのものより先に」として時間的先在を本文に示す。
  alternative: 「すべてのものの上に」として地位的優越を前面に出す。
  rationale: ギリシア語は第一に先行性を表す。文脈上は卓越性も含意し得るが、それを本文で一義化せず脚注に残す。
- issue: συνέστηκεν の意味合い
  choice: 万物がこの方にあって現在も「成り立っている」とする。
  alternative: 「一つに保たれている」または「存立している」。
  rationale: 宇宙の結合・秩序・存続を含み得る語の幅と、完了形による現在の状態を保ち、存在論的構成か継続的保持かを過度に限定しない。
translation_notes:
  register: 明瞭で現代的かつ荘重な常体寄りの敬体。「この方」で指示対象への敬意と原文の代名詞性を両立し、「にあって」は神学的関係の曖昧さを保ちながら一般読者にも理解できる範囲の表現とした。
