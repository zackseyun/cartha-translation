id: COL.1.18
reference: Colossians 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: ja
  text: また、この方こそ、教会というからだの頭です。この方は始まり[a]であり、死者の中からの初子です。それは、この方ご自身がすべてにおいて第一の地位を占めるようになるためです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「始まり」は、「起源」または「支配者」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「すべてにおいて第一の地位を占めるようになる」は、「あらゆるものの中で第一の地位を占める」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: この方こそ／この方ご自身
  rationale: 強意を、冒頭では「こそ」、結びでは「ご自身」によって自然な日本語で表した。
- source_word: κεφαλή
  choice: 頭
  rationale: キリストと教会の関係を表す比喩を保ち、「権威」または「源」と一義的に限定しない。
- source_word: σῶμα
  choice: 体
  rationale: 「頭」と対になる共同体的な身体の比喩をそのまま保つ。
- source_word: ἐκκλησία
  choice: 教会
  rationale: パウロ書簡の文脈で神の民を指す定着した自然な訳語である。
- source_word: ἀρχή
  choice: 始まり
  rationale: 直後の「死者の中から最初に生まれた方」とのつながりを保ち、復活の新しい秩序を始める方という文脈に適する。語義上可能な「起源」「支配者」は脚注に示した。
- source_word: πρωτότοκος
  choice: 最初に生まれた方
  rationale: 「初子」より一般読者に明瞭で、出生順序と第一位の響きを保つ。ここでは「死者の中から」と結び、復活を指す表現となる。
- source_word: ἐκ τῶν νεκρῶν
  choice: 死者の中から
  rationale: 復活を表すギリシア語の「〜の中から」を明確かつ自然に表した。
- source_word: ἵνα γένηται
  choice: それは〜となるためです
  rationale: 目的を表すἵναと、状態への移行を含むγένηταιを反映した。
- source_word: ἐν πᾶσιν
  choice: すべてにおいて
  rationale: 中性複数として理解し、文脈の包括的な範囲を保った。
- source_word: πρωτεύων
  choice: 第一の者
  rationale: 「第一の地位を占める」という意味を平明に表し、抽象的な教義用語で過度に広げない。
theological_decisions:
- issue: キリストと教会の比喩におけるκεφαλήの意味
  choice: 「頭」という比喩を保持する。
  alternative: 「支配者」または「源」と解釈して訳す。
  rationale: 原文の比喩は権威と起源をめぐる解釈の幅を持つため、訳文で一方に限定しない。
- issue: 復活の文脈におけるἀρχήの意味
  choice: 「始まり」
  alternative: 「起源」または「支配者」
  rationale: 「死者の中から最初に生まれた方」と並ぶため、復活の新しい秩序の始まりという理解が文脈に最もよく合う。ただし語義の幅は脚注で保った。
- issue: πρωτότοκος ἐκ τῶν νεκρῶνの力点
  choice: 「死者の中から最初に生まれた方」とし、復活における先行性と第一位を保つ。
  alternative: 「最初に復活した方」または「死者を治める第一の方」
  rationale: 原文の「生まれた」という比喩を残し、単なる時間的順序にも支配権だけにも狭めない。続く節が第一位を明示している。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、礼拝朗読にも耐える端正な文体とした。「体、すなわち教会」により同格関係を明示した。英語相談訳では脚注[a]の位置が「body」の後にあるが、内容はἀρχήについてなので、日本語本文では「始まり」の直後に置いた。
