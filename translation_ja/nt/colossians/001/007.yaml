    rationale: 「に代わって」は通常、本人に代替して行為する意味を強く示します。ὑπέρ＋属格はここで「私たちのために」または「私たちのためを代表して」と理解でき、本文ではより広く自然な「私たちのために」が安全です。
  - severity: low
