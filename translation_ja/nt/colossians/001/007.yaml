  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: ja
  text: あなたがたは、私たちの愛する奴隷仲間であるエパフラスから、そのように学びました。彼は、私たちのためにメシアに仕える忠実な奉仕者です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: そのように
  rationale: 直前に述べられた福音理解との対応を示す接続語の働きを、自然な日本語で保持する。
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: エパフラスから学びました
  rationale: ἀπόが示す教えの人的な源を「から」で明確にし、アオリストを自然な過去形で訳す。
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: 私たちの愛する奴隷仲間
  rationale: σύνδουλοςが、同じ主人に属する奴隷という共同関係を表すため、「しもべ」に弱めず「奴隷仲間」とした。ἀγαπητόςの親愛も「愛する」で保つ。
- source_word: πιστὸς
  choice: 忠実な
  rationale: ここではエパフラスが委ねられた奉仕を信頼に足る仕方で果たすことを表す。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちに代わって
  rationale: ὑπέρ＋属格の代理・代表の含みを示す。「私たちのために」も可能だが、代表性をより明確にした。
- source_word: διάκονος
  choice: 奉仕者
  rationale: 文脈はメシアへの奉仕を指し、後代の制度的役職名「執事」を必ずしも意味しないため、一般的な「奉仕者」とした。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςを固有名のように処理せず、「油注がれた者」という称号として伝える。
theological_decisions:
- issue: σύνδουλοςに含まれる奴隷身分の比喩
  choice: 奴隷仲間
  alternative: 仲間のしもべ
  rationale: 同じ主人に属する者同士という比喩の強さを保持しつつ、脚注で意味を説明する。
- issue: ὑπὲρ ἡμῶνの意味と本文異読
  choice: 私たちに代わって
  alternative: 私たちのために／あなたがたのために
  rationale: 採用本文のἡμῶνに従い、ὑπέρの代理の含みを訳した。一方、ὑμῶνを支持する写本伝承は意味上重要なので脚注に残す。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは仕える相手を示す称号として機能しているため、称号の意味が伝わる「メシア」とした。
translation_notes:
  register: 明瞭で現代的な敬体を用いた。「奴隷仲間」は日常語としてやや強いが、原語の身分比喩を薄めないため本文に残し、脚注で説明した。二文に分けて日本語の可読性を高めつつ、後半がエパフラスを説明する関係節であることを保った。
