id: COL.1.22
reference: Colossians 1:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: ja
  text: しかし今、神は御子の肉の体において、その死を通して、あなたがたをご自分と和解させてくださいました[a]。それは、あなたがたを聖なる者、傷のない者[b]、訴えられるところのない者として、御前に立たせるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あなたがたは和解させられました」。ギリシア語の動詞は受動態です。
    reason: alternative_reading
  - marker: b
    text: 「傷のない」は「非のない」とも訳せますが、いけにえに傷がないという含みもある語です。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今
  rationale: 前節のかつての状態と現在とを対比する時間的・逆接的な移行を自然な現代日本語で示す。
- source_word: ἀποκατηλλάγητε
  choice: 神は…あなたがたをご自分と和解させてくださいました
  rationale: 形態上はアオリスト受動態二人称複数だが、文脈上の行為者を神として補い、神の主導による完了した和解を明瞭に表す。受動形そのものは脚注に示す。
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: 御子の肉の体において
  rationale: σάρξを比喩的な『罪深い性質』ではなく、死ぬことのできる現実の身体性として訳す。日本語で指示対象を明確にするためαὐτοῦを『御子の』とした。
- source_word: διὰ τοῦ θανάτου
  choice: その死を通して
  rationale: διά＋属格の手段性を保ち、誰の死かを文脈に即して自然に示す。
- source_word: παραστῆσαι
  choice: 御前に立たせる
  rationale: 単なる紹介ではなく、神の前に立つという提示・献呈および審理の含意を自然な日本語で保持する。
- source_word: ἁγίους
  choice: 聖なる者
  rationale: 神のために取り分けられたことと道徳的清さの双方を保持する標準的な訳語。
- source_word: ἀμώμους
  choice: 傷のない者
  rationale: 非難されないという一般的意味だけでなく、いけにえが『傷のない』ものであるという語感を本文で保持する。
- source_word: ἀνεγκλήτους
  choice: 訴えられるところのない者
  rationale: 単なる評判上の『非難の余地がない』よりも、告発を受ける根拠がないという法廷的な含みを区別して表す。
- source_word: κατενώπιον αὐτοῦ
  choice: 御前に
  rationale: 評価と臨在の場を簡潔に表す。文脈上、神の御前と理解して敬語表現を用いる。
theological_decisions:
- issue: ἀποκατηλλάγητεの受動態と行為者
  choice: 本文では神を行為者として明示し、『和解させてくださいました』とする。
  alternative: 『あなたがたは和解させられました』と形式的受動態を保つ。
  rationale: ギリシア語の形は受動態である一方、直前から続く文脈では神が和解の行為者である。自然な日本語を優先しつつ、形態上の曖昧さは脚注で明示する。
- issue: σάρξの意味
  choice: 現実の身体を示す『肉』とする。
  alternative: 『罪深い性質』などの比喩的意味に取る。
  rationale: ここでは死を通してなされた和解が語られており、御子の真の身体性が焦点である。罪性を示す読みは本文から支持されない。
- issue: ἀμώμουςとἀνεγκλήτουςの区別
  choice: 『傷のない者』と『訴えられるところのない者』を用いる。
  alternative: 『非の打ちどころのない者、非難されるところのない者』など、近い意味の一般表現を重ねる。
  rationale: 前者の祭儀的な無傷性と、後者の法廷的な告発不能性をできる限り区別して残す。
- issue: κατενώπιον αὐτοῦの指示対象
  choice: 『御前』と訳し、本文中では名指しを繰り返さない。
  alternative: 『神の御前』または『キリストの前』と明示する。
  rationale: 文脈上は神を指す理解が自然だが、ギリシア語自体は代名詞であるため、訳文では過度な明示を避ける。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。『肉の体』で受肉の具体性を保ち、『傷のない』『訴えられるところのない』によって祭儀的・法廷的な語感を区別した。敬語は神の行為と臨在に限定して用いた。
