  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: ja
  text: 主にふさわしく歩み、あらゆる点で主を喜ばせ[a]、あらゆる良い行いにおいて実を結び、神を知ることにおいて成長するためです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「あらゆる喜ばせることに向けて」です。喜ばせる相手は明記されていませんが、文脈上は「主」を指します。
    reason: lexical_alternative
  - marker: b
    text: 「神についての十分な知識において成長する」とも訳せます。「知識」に当たる語は、より十分な、または深い認識を表すことがあります。また、与格は成長の手段として理解されることもあります。
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: 歩み
  rationale: パウロに特徴的な生活態度の比喩を保ちつつ、現代日本語でも聖書的表現として理解できるため。前節から続く祈りの目的を「ためです」で示した。
- source_word: ἀξίως τοῦ κυρίου
  choice: 主にふさわしく
  rationale: ἀξίωςと属格の関係を自然な日本語で表し、主に属する者として適切な生き方という意味を保った。
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: あらゆる点で主に喜ばれる者となり
  rationale: 直訳的な「すべての喜ばせへ」は日本語では不自然なため、文脈上の含意である「主」を補って目的の方向性を明確にした。補足であることと別訳は脚注に示した。
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: あらゆる良い行いによって
  rationale: ἐνを手段として取り、良い行いを通して実を結ぶという自然な日本語にした。παντίの包括的・配分的な意味を「あらゆる」で表した。
- source_word: καρποφοροῦντες
  choice: 実を結び
  rationale: 1章6節とも響き合う有機的な比喩を保持した。
- source_word: αὐξανόμενοι
  choice: 成長する
  rationale: καρποφοροῦντεςと並行する現在分詞であり、継続的な成長を自然に表す。
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: 神を知る知識において
  rationale: 与格を領域・観点と理解し、「知識において」とした。属格は客観属格として自然に伝わる「神を知る知識」とし、ἐπίγνωσιςの強意的可能性は脚注に残した。
theological_decisions:
- issue: ἀρεσκείανの明示されていない対象
  choice: 本文では文脈上の対象である「主」を補い、「あらゆる点で主に喜ばれる者となり」とする。
  alternative: 「あらゆる喜ばしさを目指して」など、対象を明示しない訳。
  rationale: ギリシア語には目的語が明記されていないが、直前の「主」が明白な指示対象である。日本語として意味を通すため本文では補い、原文の省略は脚注で明示した。
- issue: ἐπίγνωσιςの意味合い
  choice: 本文では「知識」と訳す。
  alternative: 「十分な知識」「深い知識」。
  rationale: 語が十分な、または深い認識を含み得ることを認めつつ、文脈だけではその強意を必須と断定せず、脚注に別訳として保存した。
- issue: τῇ ἐπιγνώσειの与格
  choice: 領域・観点として「知識において」と訳す。
  alternative: 手段として「神を知る知識によって成長する」。
  rationale: 両方が文法的に可能だが、成長という比喩との結びつきから領域・観点の読みを本文に採用し、手段の読みも脚注に示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「歩む」「実を結ぶ」というパウロの比喩は保持した。「主に喜ばれる者となり」は日本語の自然さを優先した補足訳であり、その補足を脚注で透明化した。
