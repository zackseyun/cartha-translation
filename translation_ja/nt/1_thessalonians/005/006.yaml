base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: ja
  text: ですから、ほかの人々のように眠っていてはならず、目を覚ましていましょう[a]。しらふでいましょう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「警戒していましょう」。このギリシア語には、目を覚ましていることと、油断せず見張ることの両方の意味があります。
    reason: lexical_alternative
  - marker: b
    text: または「冷静でいましょう」「自制していましょう」。このギリシア語は、酒に酔わないこと、またそこから転じて、冷静さや節制を保つことを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ですから
  rationale: 二つの推論を示す小辞が前節までの内容から導く結論を、自然な現代日本語で明確に示す。
- source_word: μὴ καθεύδωμεν
  choice: 眠っていないで
  rationale: 勧告を表す接続法と否定を日本語の呼びかけとして自然に表しつつ、文脈上の倫理的・霊的な比喩である「眠り」の像を保持する。
- source_word: ὡς οἱ λοιποί
  choice: ほかの人々のように
  rationale: 直前の文脈で信徒と対比される残りの人々を指す。日本語として明瞭で、不必要な解釈を加えない。
- source_word: ἀλλὰ
  choice: （対照構文）～ないで、～
  rationale: 独立した「しかし」よりも、「眠っていないで、目を覚まし」という日本語の対照構文によって逆接を自然かつ明確に表した。
- source_word: γρηγορῶμεν
  choice: 目を覚まし
  rationale: καθεύδωμενとの眠り・覚醒の対照を保つ。「見張る」「警戒する」という含意もあり得るため脚注に示す。
- source_word: νήφωμεν
  choice: 身を慎んでいましょう
  rationale: 酒に酔わないことを基礎に、冷静さ、節制、精神的覚醒を表す語である。「身を慎む」はその倫理的な広がりを自然な日本語で伝え、単に飲酒だけへ限定しない。
theological_decisions:
- issue: 眠りと覚醒の比喩的な力
  choice: 本文に「眠る／目を覚ます」という像を残し、倫理的・霊的な勧告として提示する。
  alternative: 「無頓着でいないで、警戒していましょう」などと意味を抽象化する。
  rationale: 周辺文脈にある夜と昼、闇と光の対照を保ち、パウロの比喩を訳文で解消しないため。
- issue: νήφωの意味範囲
  choice: 「身を慎む」と訳し、冷静さと節制を含み得る表現にする。
  alternative: 「酔わずにいる」「冷静でいる」「自制する」。
  rationale: この語には文字どおりの酒への節制と、そこから広がる精神的な明晰さ・自制の双方が響き得る。いずれか一方だけに限定しないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。共同体への勧告を「～ていましょう」で表し、眠りと覚醒の比喩を保持した。脚注記号は該当語の直後に配置した。
