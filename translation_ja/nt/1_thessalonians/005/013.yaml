    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: 重んじなさい
  rationale: ここでは、前節で述べられた人々を評価し、敬意を払う意味。現代日本語として自然であり、単なる認識以上の尊重を表す。
- source_word: ὑπερεκπερισσοῦ
  choice: この上なく
  rationale: 接頭辞を重ねた非常に強い強意を、過度に古風にならない日本語で明確に表す。
- source_word: ἐν ἀγάπῃ
  choice: 愛をもって
  rationale: 評価の仕方・態度を示す句として自然で、ἀγάπηの中心語義である「愛」を保持する。
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: その働きのゆえに
  rationale: διά＋対格の理由・根拠を示し、ἔργονを具体的な名詞「働き」として保つ。
- source_word: εἰρηνεύετε
  choice: 平和に過ごしなさい
  rationale: 共同体の中で平和な状態を継続して保つよう求める現在命令の含意を、自然な日本語で表す。
- source_word: ἐν ἑαυτοῖς
  choice: あなたがたの間で
  rationale: 複数の再帰代名詞が指す、共同体内部での相互的な関係を明確にする。
- source_word: καὶ
  choice: （訳出せず）
  rationale: 前節から続く並列関係は日本語では文脈上明らかであり、冒頭の「または」「そして」を置かない方が自然である。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 前節の、共同体の中で労し、導き、戒める人々を受ける代名詞として直接的に訳す。
