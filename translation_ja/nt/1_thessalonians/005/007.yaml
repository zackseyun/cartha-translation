  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: ja
  text: なぜなら、眠る者は夜眠り、酒に酔う者は夜酔うからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: というのも……からです
  rationale: 直前の勧告を支える理由を示す接続語として、説明の働きが自然に伝わる形にした。
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: 眠る者は……眠り
  rationale: 冠詞付き分詞を一般的な人々を指す「眠る者」とし、同じ動詞の反復を保って原文の並行表現を再現した。
- source_word: νυκτὸς
  choice: 夜
  rationale: 副詞的属格の時間的意味を、簡潔で自然な現代日本語で表した。
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: 酒に酔う者は……酔う
  rationale: 酩酊を意味することを明確にするため最初に「酒に」を補い、後半では「酔う」を反復して原文の修辞的並行を保った。
- source_word: καὶ
  choice: （読点による並列）
  rationale: 二つの節の緊密な並行関係を、日本語では読点で自然に連結した。
theological_decisions:
- issue: 睡眠と酩酊を文字どおりの描写として訳すか、霊的比喩として明示するか
  choice: 「眠る」「酒に酔う」という日常的な像をそのまま残す
  alternative: 霊的な無自覚や道徳的放縦を直接表す
  rationale: 文脈では日常の夜の行動が霊的な警戒との対比に用いられている。解釈を本文へ織り込まず、原文の像と神学的含みを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、原文の簡潔さと二つの節の並行性を重視した。「酔っぱらう」は口語性が強いため避け、「酒に酔う」とした。
