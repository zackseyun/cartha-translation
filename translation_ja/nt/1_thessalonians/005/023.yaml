id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: ja
  text: どうか、平和の神ご自身が、あなたがたを完全に聖なる者としてくださいますように。また、あなたがたの霊と魂と体の全体が、完全で、責められるところなく、私たちの主イエス・メシアが来られる時に守られますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊と魂と体」という三つの語が、人間を三つの部分に分ける教えを示すのか、それとも人間全体を強調する表現なのかについては、解釈が分かれています。
    reason: 三項表現を原文どおり保持しつつ、それが特定の人間論を必ずしも確定しないことを示すため。
lexical_decisions:
- source_word: Αὐτὸς δὲ
  choice: どうか、…神ご自身が
  rationale: δέはここで祈願への移行を示すため、日本語では祈願形によって自然に表した。αὐτόςの強意は「ご自身」で保持した。
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: 平和の神
  rationale: 神が平和によって特徴づけられることを示す、パウロ書簡で定着した表現を簡潔に保った。
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: あなたがたを余すところなく聖なるものとしてくださいますように
  rationale: アオリスト希求法の祈願を「くださいますように」で表し、ἁγιάζωの聖性との語彙的つながりとὁλοτελεῖςの完全性をともに保持した。
- source_word: ὁλόκληρον ὑμῶν
  choice: あなたがたの…そのすべてにおいて
  rationale: ὁλόκληρονは後続する霊・魂・体全体の完全性を強調する。日本語の可読性のため三項の後に受けて表した。
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: 霊と魂と体
  rationale: 原文の三つの語と反復される接続関係を簡潔に保持し、人間の構成について特定の体系を翻訳だけで確定しない。
- source_word: ἀμέμπτως…τηρηθείη
  choice: 責められるところのないものとして守られますように
  rationale: 受動態の希求法と、非難される点がない状態を表す副詞を自然な日本語の祈願文にした。
- source_word: ἐν τῇ παρουσίᾳ
  choice: 来られる時まで
  rationale: παρουσίαはここでは主の終末的な到来を指す。「守られる」との日本語上の自然な結びつきを優先して「時まで」としたが、ギリシア語ἐνが厳密には到来時点を示し得るため脚注で別訳を示す。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・メシア
  rationale: κύριοςを「主」、Χριστόςを称号として「メシア」と訳し、属格句の関係を自然な日本語で保った。
theological_decisions:
- issue: 霊・魂・体という三項表現
  choice: 三つの語をそのまま訳しつつ、ὁλόκληρονによる全体性を明示する
  alternative: 三項を人間の三つの独立した構成部分を教える専門的表現と解する、または単に「全存在」と一語にまとめる
  rationale: 本文は三語を明記する一方、それらが厳密な三分説を構成するか、全人格を修辞的に表すかを確定していない。訳文はこの緊張を残す。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςの称号としての意味を明示するため「メシア」とし、日本語で固有名のように連結する際は中黒を用いた。
- issue: παρουσίαとτηρηθείηの時間的関係
  choice: 「来られる時まで…守られますように」
  alternative: 「来られる時に…守られてありますように」
  rationale: 日本語として祈願の継続性を自然に伝える一方、ἐνの字義的な時点表現も妥当なので脚注に残した。
translation_notes:
  register: 現代の一般読者に通じる、礼節ある祈願調を採用した。「聖別する」は簡潔だが教会内の専門語に響きやすいため、「聖なるものとする」とした。「メシア」は称号として明確に示し、「イエス・メシア」は読みやすさのため中黒で結んだ。
