id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: ja
  text: 兄弟たち[a]、私たちはあなたがたに勧めます。秩序を乱す人たちを戒め、気落ちしている人たちを励まし、弱い人たちを支え、すべての人に対して忍耐強くありなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。パウロは会衆全体に呼びかけている。
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: 勧めます
  rationale: この勧告的文脈での、真剣に促す意味を自然な現代日本語で表す。
- source_word: δέ
  choice: （独立した接続語を置かない）
  rationale: ここでは強い逆接ではなく談話の継続・移行を示すため、日本語では無理に接続語を加えないほうが自然である。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を保つ。会衆全体への呼びかけであることは脚注で明示する。
- source_word: νουθετεῖτε
  choice: 戒め
  rationale: 過ちを正すための教えや警告という、矯正的かつ牧会的な意味を表す。
- source_word: ἀτάκτους
  choice: 秩序を乱す人たち
  rationale: 『怠惰な人たち』に限定せず、規律を外れた、秩序を乱すという語の広がりを保つ。
- source_word: παραμυθεῖσθε
  choice: 励まし
  rationale: 優しく語りかけて力づけ、慰める意味を、文脈に合う明瞭な表現で示す。
- source_word: ὀλιγοψύχους
  choice: 気落ちしている人たち
  rationale: 勇気を失い、意気消沈した人々を指す意味を、現代日本語で分かりやすく表す。
- source_word: ἀντέχεσθε
  choice: 支え
  rationale: 属格目的語を伴い、弱い人々にしっかり寄り添って助ける意味を表す。
- source_word: τῶν ἀσθενῶν
  choice: 弱い人たち
  rationale: 身体的・精神的・社会的・信仰上の弱さのいずれかに狭めず、原語の幅を保つ。
- source_word: μακροθυμεῖτε
  choice: 忍耐強くありなさい
  rationale: 人に対して怒りを遅くし、辛抱強く接する継続的態度を明瞭に表す。
- source_word: πρὸς πάντας
  choice: すべての人に対して
  rationale: 命令の対象が例外なくすべての人であることを明示する。
theological_decisions:
- issue: 会衆への呼びかけにおける ἀδελφοί の包括的意味
  choice: 本文では「兄弟たち」とし、会衆全体を指すことを脚注に示す。
  alternative: 「兄弟姉妹たち」
  rationale: 原文の文法的形を本文に残しながら、実際には男女を含む教会全体への呼びかけである可能性が高いことも明確にする。
- issue: 「弱い人たち」の弱さの種類
  choice: 弱さの種類を特定しない。
  alternative: 病弱な人たち、信仰の弱い人たち
  rationale: 文脈だけでは身体的、精神的、社会的、あるいは信仰上の弱さのいずれかに限定できないため、神学的な限定を加えない。
translation_notes:
  register: 明瞭で現代的ながら、勧告としての品位を保った。「秩序を乱す」は語義の幅を残し、「気落ちしている」は古風な「気弱な者」より日常的で明確。「支える」は単発の援助よりも継続して寄り添う含みを表す。脚注記号は関連語である「兄弟たち」の直後ではなく節末に置くと対応が曖昧になるため、本文では当該語直後に置くのが望ましい。
