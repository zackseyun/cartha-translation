  text: Do not despise prophecies[a].
translation:
  language: ja
  text: 預言[a]を軽んじてはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「預言の数々」。または「預言の言葉」。原文では複数形。
    reason: ギリシア語の複数形と、発せられた預言を指し得る語義を示すため。
lexical_decisions:
- source_word: προφητείας
  choice: 預言
  rationale: 複数対格で、抽象的な概念だけでなく、個々に語られる預言を指し得る。日本語では「預言」が自然であり、単複を明示しないため、ギリシア語の複数形については脚注で補う。
- source_word: μὴ
  choice: ～てはいけません
  rationale: 現在命令形を否定する標準的な禁止表現として、強めすぎず、明快な現代日本語にした。
- source_word: ἐξουθενεῖτε
  choice: 軽んじて
  rationale: 価値のないものとみなし、侮って扱うという語義を自然かつ簡潔に表す。「退ける」だけでは、この動詞に含まれる軽蔑的な態度が十分に伝わらない。
theological_decisions:
- issue: 初期キリスト教会の文脈における「預言」の意味
  choice: 「預言」という広い語を保ち、具体的な仕組みや後代の教理的区分に限定しない。
  alternative: 「預言の言葉」または「神からのものとされる言葉」
  rationale: 本文は教会における預言を軽んじないよう命じているが、その性質や継続性について特定の教派的立場を本文に持ち込まず、原語が持つ幅と神学的緊張を保つ。
translation_notes:
  register: 明快で現代的な敬体を用いた。「軽んじてはいけません」は日常的に理解できる一方、聖書本文としての品位も保つ。
