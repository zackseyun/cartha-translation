revisions:
- from: 人々が「平和だ、安全だ[a]」と言っているとき、その時、突然の滅びが、妊婦に産みの苦しみ[b]が襲いかかるように、彼らに襲いかかります。そして、彼らは決して逃れられません[c]。
  to: 人々が「平和だ、安全だ[a]」と言っているそのとき、妊婦を産みの苦しみ[b]が襲うように、突然の滅びが彼らを襲います。彼らは決して逃れられません[c]。
  rationale: 原文のὅταν…τότε（「…するとき、そのとき」）の連関を「…と言っているそのとき」と自然に表現した。ὥσπερ以下の比較は、妊婦に突然かつ不可避に訪れる産みの苦しみの像を保ちつつ、日本語として読みやすい語順にした。οὐ μὴ ἐκφύγωσινの強い未来否定は「決して逃れられません」で維持した。
