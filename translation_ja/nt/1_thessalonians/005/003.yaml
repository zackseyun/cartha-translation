id: 1TH.5.3
reference: 1 Thessalonians 5:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: ja
  text: 人々が「平和だ、安全だ[a]」と言っているそのとき、妊婦を産みの苦しみ[b]が襲うように、突然の滅びが彼らを襲います。彼らは決して逃れられません[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「安心だ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「陣痛」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語では強い否定が用いられており、「決して逃れることはない」という意味。
    reason: source_emphasis
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: 人々が…と言っているとき
  rationale: ὅτανと接続法による未来志向の不定時節を、現代日本語で自然に表した。主語はギリシア語と同様に特定せず、「人々」とした。
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: 平和だ、安全だ
  rationale: εἰρήνηを「平和」、ἀσφάλειαを危険のない状態を表す「安全」とした。標語のような簡潔さを保つため、二語を並列した。
- source_word: αἰφνίδιος…ὄλεθρος
  choice: 突然の滅び
  rationale: αἰφνίδιοςの急激さを「突然の」で保ち、ὄλεθροςは滅亡の様態や永続性を限定せず「滅び」とした。
- source_word: ἐφίσταται
  choice: 襲いかかります
  rationale: 災いが人に突然到来するという文脈上の力を、明瞭で自然な日本語にした。
- source_word: ἡ ὠδὶν
  choice: 産みの苦しみ
  rationale: 出産に伴う痛みを指す語であり、聖書的な比喩の響きと一般読者への分かりやすさを両立させた。「陣痛」も可能。
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: 妊婦に
  rationale: 直訳的には「胎内に［子を］宿している者に」だが、意味を損なわず簡潔で自然な現代語とした。
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: 彼らは決して逃れられません
  rationale: οὐ μήとアオリスト接続法による未来の強い否定を、「決して…ません」で明示した。
theological_decisions:
- issue: 終末的警告におけるὄλεθροςの性質
  choice: 「滅び」と訳し、その具体的な様態や期間は規定しない
  alternative: 「破滅」「滅亡」など、裁きの結果をより限定的に響かせる訳
  rationale: この語は決定的な破局と裁きを示すが、それ自体だけでは消滅や刑罰の様態・期間について特定の教理的結論を要求しないため、本文の厳しさと曖昧さをともに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、警告としての厳粛さを保った。引用部は公的な標語のような簡潔さを残し、文末は丁寧体で統一した。
