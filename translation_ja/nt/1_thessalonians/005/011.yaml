  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: ja
  text: ですから、互いに励まし合い[a]、互いを建て上げなさい。あなたがたが今しているとおりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「互いに勧め合い」とも訳せる。ここで「励ます」と訳した語には、励ますことと強く勧めることの両方の意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す接続語として、論理的つながりを保ちつつ現代日本語で自然に表した。
- source_word: παρακαλεῖτε
  choice: 励まし合い
  rationale: この語には勧告する、励ます、慰めるという意味の幅がある。共同体を互いに強める文脈では「励ます」が広い意味を自然に伝える。相互代名詞と合わせて「励まし合う」とした。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 相互に行為を及ぼすことを自然な日本語で示す。
- source_word: οἰκοδομεῖτε
  choice: 造り上げなさい
  rationale: 建築の比喩を保持し、共同体の成長と強化を表す。単に「強める」とすると原文の比喩が失われるため、「造り上げる」とした。
- source_word: εἷς τὸν ἕνα
  choice: 一人ひとりを
  rationale: 字義的には「一人がその一人を」という個別的な相互性を強調する表現。「互いに」の単純な反復を避けながら、一人一人に向けられる働きを明示した。
- source_word: καθὼς καὶ ποιεῖτε
  choice: 現にあなたがたがしているとおりです
  rationale: καθὼςの比較、καίの「実際に／現に」という肯定的な含み、および現在形が示す継続中の実践を自然な日本語で表した。
