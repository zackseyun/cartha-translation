id: 1TH.5.1
reference: 1 Thessalonians 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: ja
  text: 時と時期[a]については、兄弟たち[b]、あなたがたに何も書き送る必要はありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「時と時期」は、時間の諸期間と定められた時機を組み合わせた表現で、ここでは特に終末に関する文脈で用いられています。
    reason: cultural_note
  - marker: b
    text: 別訳「兄弟姉妹の皆さん」。ギリシア語は「兄弟たち」ですが、信者共同体全体への呼びかけと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 〜については
  rationale: Περὶの話題提示を「〜について」で表し、δέによる話題の移行は係助詞「は」に担わせた。時間を表す「今」を補わず、過度な対比も持ち込まない。
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: 時と時期
  rationale: χρόνοςの時間的な広がりと、καιρόςの特定の時・定められた機会という違いを、簡潔な対句「時と時期」で残した。終末に関する文脈で両語を一つの概念に統合しない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけをそのまま表した。この語が信仰共同体全体を指し得ることは脚注で明示した。
- source_word: οὐ χρείαν ἔχετε
  choice: 必要はありません
  rationale: 必要性がないことを表す定型的な表現として、明瞭で自然な現代日本語にした。
- source_word: ὑμῖν γράφεσθαι
  choice: あなたがたに何も書き送る
  rationale: 原文は字義的には「あなたがたに書かれること」という受動不定詞で、書き手を明示しない。日本語では主語を省略した「あなたがたに何も書き送る」として自然さを保ち、「私が」など原文にない主語を明示しなかった。「何も」は否定文中で、書くべき事柄がないという構文上の意味を自然に示す補足である。
theological_decisions:
- issue: 教会共同体への性別を伴う呼びかけ
  choice: 兄弟たち
  alternative: 兄弟姉妹の皆さん
  rationale: ἀδελφοίの文法上の男性形を本文に保った。一方、この呼びかけが女性を含む信者共同体全体に向けられている可能性が高いことを脚注で示し、包含的な指示範囲を失わないようにした。
- issue: 「時」と「時期」の終末論的含意
  choice: 二語の対句を保持する
  alternative: その時がいつ来るか
  rationale: 原文は出来事の到来時点だけに意味を限定しておらず、χρόνοιとκαιροίを並べている。そのため、解釈的に単純化せず、時間の諸期間と定められた時機の両方を含み得る表現を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒書簡としての簡潔で改まった調子を保った。語順は「時と時期」を先に置いて話題転換を示し、呼びかけを原文に近い位置に残した。
