  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: ja
  text: あなたがた自身、主の日が夜に盗人が来るように来ることを、よく知っているからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: あなたがた自身
  rationale: 動詞にすでに含まれる二人称主語を強調する代名詞であるため、その強調を自然な日本語で明示した。
- source_word: γὰρ
  choice: からです
  rationale: 前節の内容に理由・説明を加える接続辞であり、日本語では文末の「からです」が自然にその説明的機能を表す。
- source_word: ἀκριβῶς
  choice: よく
  rationale: ここでは知識の確かさ・正確さを表す。「正確に」よりも「よく知っている」が現代日本語として自然で、十分な知識があるという意味を保つ。
- source_word: οἴδατε
  choice: 知っている
  rationale: 知識・認識を表す基本的な意味を直接訳した。
- source_word: ὅτι
  choice: とおり
  rationale: 知っている内容を導くὅτιを、日本語では引用の「と」と説明関係を示す「おり」によって自然に表した。
- source_word: ἡμέρα κυρίου
  choice: 主の日
  rationale: 預言的・終末論的な定型表現であり、礼拝の曜日ではなく、主が介入し裁きを行う日を指す表現として簡潔に訳した。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの確立した聖書的称号を、文脈にふさわしい「主」とした。
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: 夜の盗人のように
  rationale: 夜に来る盗人という比喩を簡潔に保ち、予期しない到来という含意を訳文で説明しすぎないようにした。
- source_word: οὕτως
  choice: のように
  rationale: 先行する比喩に対応する様態を示すため、日本語では「のように」に含めて表した。
- source_word: ἔρχεται
  choice: やって来る
  rationale: 未来の出来事を生き生きと述べる現在形を保ちつつ、到来を自然な日本語で表現した。
theological_decisions:
- issue: 終末論的表現 ἡμέρα κυρίου
  choice: 主の日
  alternative: 主の曜日／主日
  rationale: 文脈は礼拝日ではなく、突然訪れる神的介入・裁きの日を扱っているため、預言的背景を持つ「主の日」とした。
- issue: 「夜の盗人のように」という比喩の意味
  choice: 比喩をそのまま保持し、突然で予期しない到来を示唆させる
  alternative: 「だれにも気づかれず突然来る」のように意味を説明して訳す
  rationale: 本文は比喩を提示するのみであり、秘密性や特定の終末論体系まで明示していないため、その神学的含意を訳文で限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「主の日」「夜の盗人」という聖書的表現の格調と比喩を保持した。「あなたがた自身」で原文の強調を残し、「からです」で前節との説明関係を示した。
