  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: ja
  text: 私たちの主イエス・キリストの恵みが、あなたがたとともにありますように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の祝祷において、神から無償で与えられる好意と救いの働きを表す定着した訳語であり、ここでも簡潔かつ神学的な重みを保てる。
- source_word: κυρίου
  choice: 主
  rationale: イエスに対する称号としての κύριος の権威と神学的含意を、現代日本語の聖書文体で自然に保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: Χριστός は本来「油注がれた者／メシア」という称号だが、この定型的な結びの句では「イエス・キリスト」が日本語で広く定着し、固有名に近いまとまりとして自然である。称号の由来を失わせる意図ではない。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたとともにありますように
  rationale: 原文は動詞を省いた祝福の句であるため、願いを表す「ありますように」を補い、日本語として自然な祝祷にした。「あなたがた」により複数形を明示した。
theological_decisions:
- issue: Χριστοῦ を「キリスト」とするか「メシア」とするか
  choice: キリスト
  alternative: メシア
  rationale: このパウロ書簡の定型的な結びでは Ἰησοῦ Χριστοῦ が名に近い一まとまりとして機能しており、日本語では「イエス・キリスト」が最も自然で広く理解される。一方、語源的・称号的意味が「メシア」であることは否定しない。
- issue: 動詞のない祝祷句の表現
  choice: ありますように
  alternative: あるように／ともにある
  rationale: 原文には明示的な動詞がなく、断定とも願望とも形式上は限定されないが、書簡末尾の祝祷という機能を日本語で明確かつ自然に表すため願望形を用いた。
translation_notes:
  register: 明瞭で現代的ながら、書簡末尾の祝福にふさわしい品位を保った。「恵み」「主」「ともにありますように」は一般読者にも理解しやすい定着表現である。
