id: 1TH.5.24
reference: 1 Thessalonians 5:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: ja
  text: あなたがたを召しておられる方は真実な方です。その方が、それを成し遂げてくださいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「真実な方」は「信頼できる方」、「成し遂げてくださいます」は「行ってくださいます」とも訳せる。
    reason: πιστόςとποιέωの語義の幅、および文脈上補われる目的語を示すため。
lexical_decisions:
- source_word: πιστὸς
  choice: 真実な方
  rationale: ここでは述語形容詞として、召す方の変わらない誠実さと信頼性を表す。「真実な方」は神の信実を自然かつ格調を保って示し、「信頼できる方」という意味も含む。
- source_word: ὁ καλῶν
  choice: 召しておられる方
  rationale: 冠詞付き現在分詞を実体詞的に訳し、継続的に召している方を指す現在的な働きを保った。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数であることを日本語で明示し、手紙の共同体全体への呼びかけを保った。
- source_word: ὃς καὶ
  choice: その方が
  rationale: 関係代名詞が直前の「召しておられる方」を受け、その同じ方が行為を成し遂げるという連続性を自然な日本語で示した。καίの強調・継続の含みは、同一主語を明示する構文によって表した。
- source_word: ποιήσει
  choice: それを成し遂げてくださいます
  rationale: 未来形の確実性を表しつつ、直前の23節で祈られた聖別と保全を受ける目的語を「それ」とした。「成し遂げる」は単なる行為以上に、祈られた事柄を実現する文脈に適する。敬語表現は神の恵み深い働きを日本語として自然に示す。
theological_decisions:
- issue: ποιήσειの省略された目的語
  choice: 「それを」とし、直前の祈りで述べられた聖別と保全を指すものとして訳す
  alternative: 目的語を明示せず「その方が行ってくださいます」とする
  rationale: ギリシア語では目的語が省略されているため、その内容を特定しすぎないよう代名詞「それ」にとどめた。これにより23節との結びつきを示しながら、方法や範囲を訳文で補いすぎることを避けた。
- issue: 神の信実と行為の確実性
  choice: 「真実な方です。その方が……成し遂げてくださいます」とする
  alternative: 「信頼できる方なので、必ず実現します」と因果関係を明示する
  rationale: 原文は神の信実と将来の行為を強く結びつけるが、明示的な因果接続詞は置かない。二文を並べることで、その神学的な結びつきと簡潔な断言を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、短い二文によって原文の簡潔さと確信に満ちた調子を保った。「召しておられる」で現在分詞の継続性を示し、「それ」によって省略された目的語を必要以上に限定しないようにした。
