  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: ja
  text: 私は主にかけて[a]、あなたがたに厳命します。この手紙が、すべての兄弟たちに読まれるようにしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主によって」「主の御前で」。ギリシア語の表現は、主を誓いにおいて呼び求める権威、または証人として、厳粛に命じることを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: 厳命します
  rationale: この動詞には、誓いによって相手を固く拘束するという強い意味がある。「厳命します」は現代日本語として自然で、その厳粛な拘束力を表す。誓いの要素は続く「主にかけて」によって明示した。
- source_word: τὸν κύριον
  choice: 主にかけて
  rationale: ἐνορκίζωとともに、主を誓いの権威として呼び求める表現。「主にかけて」は日本語でその厳粛さを簡潔に伝える。ただし「主の御前で」という理解の余地も脚注に残した。
- source_word: ἀναγνωσθῆναι
  choice: 読んで聞かせてください
  rationale: アオリスト受動不定詞で、手紙が人々に読まれることを求める。会衆への手紙の朗読という文脈を自然な日本語で表しつつ、受動構文を不自然に直訳しなかった。
- source_word: τὴν ἐπιστολήν
  choice: この手紙
  rationale: 現在読まれている文書を指すため、現代日本語では「この手紙」が明瞭で自然。「書簡」より一般読者に分かりやすい。
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: 兄弟たち全員
  rationale: πᾶσινの例外のない範囲を「全員」で示し、ἀδελφοῖςの男性複数形を「兄弟たち」と訳した。共同体の女性も含み得る語法であることは脚注で説明した。
theological_decisions:
- issue: 混合された会衆を指す可能性が高いἀδελφοῖςの訳し方
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性複数形を本文に保持し、パウロの用法では女性を含む共同体全体を指し得ることを脚注で明示した。これにより、文法上の形と文脈上の包括性の両方を保存する。
- issue: τὸν κύριονが表す誓いの関係
  choice: 主にかけて
  alternative: 主の御前で
  rationale: 対格は、主を誓いの権威として呼び求める意味に取ることができる。一方、主を証人とする面を「主の御前で」と表す余地もあるため、代案を脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら、使徒の厳粛な命令にふさわしい格調を保った。「誓わせます」のような不自然な直訳を避け、「主にかけて」と「厳命します」の組み合わせで原文の誓約的な力を表現した。
