id: 1TH.5.18
reference: 1 Thessalonians 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: ja
  text: どんな状況でも[a]感謝しなさい。これが、メシアであるイエスにあって[b]、あなたがたに対する神のみこころだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「すべてにおいて」。感謝をする状況を指しており、悪そのものを感謝の対象とするという意味とは限らない。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「キリスト・イエスにあって」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: どんな状況でも
  rationale: ἐν＋与格は、感謝がなされる状況・領域を表すと理解するのが自然である。「すべてのことのゆえに」ではなく、あらゆる状況の中で感謝するという意味を、現代日本語で明確にした。
- source_word: εὐχαριστεῖτε
  choice: 感謝しなさい
  rationale: 現在能動命令法二人称複数。継続的な実践を求める命令だが、日本語では副詞を補わずとも文脈上自然に反復的・持続的な勧めとして読める。
- source_word: τοῦτο
  choice: これが
  rationale: 直前の「どんな状況でも感謝すること」を指す指示語として、原文の簡潔さを保った。
- source_word: γάρ
  choice: だからです
  rationale: 先の命令の根拠を示す接続関係を、自然な日本語の文末表現で表した。
- source_word: θέλημα θεοῦ
  choice: 神のみこころ
  rationale: 神の意志・望みを表す定着した日本語表現。過度に硬い「神の意志」よりも、聖書本文として自然で品位がある。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにあって
  rationale: Χριστόςを称号として「メシア」と訳し、ἐνを残して、パウロに特徴的なメシアとの結びつきを安易に言い換えず保持した。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに対する
  rationale: εἰςが人を目的語に取って示す方向・関係を表し、神のみこころが読者たちに向けられ、彼らに関わるものであることを伝える。
theological_decisions:
- issue: ἐν παντίが、悪を含むすべての事柄そのものへの感謝を命じるか
  choice: どんな状況でも
  alternative: すべてのことについて／すべてにおいて
  rationale: ἐν＋与格は通常、感謝する際の状況・領域を示す。悪そのものを感謝の理由とする解釈を本文に持ち込まず、同時にあらゆる状況での感謝という要求を弱めない。
- issue: Χριστῷを称号として訳すか、伝統的名称で訳すか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: ここでもΧριστόςの称号としての意味は保たれているため「メシア」とした。日本語として明瞭にするため「メシアであるイエス」とし、伝統的な訳語は脚注に示した。
- issue: τοῦτοの指示範囲
  choice: 直前の感謝の命令を指す簡潔な「これ」
  alternative: 5章16～18節の三つの勧め全体を指す
  rationale: 文法上は直前の命令を指すのが最も直接的だが、より広い文脈を含む可能性を断定的な説明で排除せず、原文どおり単純な指示語にとどめた。
translation_notes:
  register: 明瞭で現代的ながら、命令とその根拠を述べる聖書本文としての品位を保った。「にあって」は日常語よりやや聖書的だが、パウロのἐν Χριστῷという神学的に含みのある表現を保存するため採用した。
