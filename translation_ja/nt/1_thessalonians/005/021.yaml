  text: しかし、すべてを吟味し[a]、良いものをしっかり保ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてのことを」とも訳せる。直前の文脈では、特に預言を吟味することが念頭にある。
    reason: πάνταの包括的な意味を保ちつつ、直前の預言に関する文脈との関係を示すため。
lexical_decisions:
- source_word: πάντα
  choice: すべて
  rationale: 中性複数対格の包括的な範囲を自然な現代日本語で保つ。文脈上は預言の言葉が特に念頭にあるが、本文自体が明示的に限定していないため、訳でも狭めない。
- source_word: δὲ
  choice: しかし
  rationale: 直前の命令との穏やかな対照を示す。強すぎる逆接にならないよう、読点を伴う自然な接続とした。
- source_word: δοκιμάζετε
  choice: 吟味し
  rationale: 真偽や価値を確かめるために試し、評価するという現在命令形の継続的な意味を表す。「吟味する」は文脈に適した、明瞭で品位ある語である。
- source_word: τὸ καλὸν
  choice: 良いもの
  rationale: 冠詞を伴う中性単数形容詞の名詞的用法を自然に表し、抽象哲学的な響きを避ける。
- source_word: κατέχετε
  choice: しっかり保ちなさい
  rationale: 吟味の結果、良いものを手放さず保持し続ける命令を表す。「しっかり」により、単なる保存ではなく堅く守る含意を伝える。
theological_decisions:
- issue: 預言と識別の文脈における πάντα の範囲
  choice: 「すべて」と包括的に訳し、直近の文脈、とりわけ預言の言葉の吟味への適用は注で示す。
  alternative: 「すべての預言」または「語られたことをすべて」と限定して訳す。
  rationale: 直前の20節は預言に言及するが、ギリシア語本文は限定する名詞を伴わない πάντα を用いている。本文の広さと文脈上の焦点の両方を保ち、解釈によって命令の範囲を狭めない。
translation_notes:
  register: 明瞭な現代標準語を用い、命令の簡潔さと品位を保った。「吟味する」は日常語よりやや改まっているが、内容を注意深く確かめる意味が明確で、聖書本文の文体にも適する。
