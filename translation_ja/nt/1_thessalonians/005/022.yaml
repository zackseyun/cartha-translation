  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: ja
  text: あらゆる種類の悪から離れていなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あらゆる形の悪」。伝統的には「悪と見えるものすべて」。
    reason: εἴδουςには「種類」「形」の意味があり、伝統的には「見えるもの、外観」と解されてきたため。
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: 離れていなさい
  rationale: 現在命令法・中動態、二人称複数。継続して遠ざかるよう求める命令の力を、自然な現代日本語で表す。
- source_word: ἀπὸ
  choice: から
  rationale: ἀπέχωとともに用いられ、分離・回避の対象を示す。
- source_word: παντὸς
  choice: あらゆる
  rationale: εἴδουςを限定し、一つ一つの種類を漏れなく含む意味を自然に表す。
- source_word: εἴδους
  choice: 種類
  rationale: この文脈では外見だけを指す「見かけ」よりも、「種類・形態」の意味が適切である。
- source_word: πονηροῦ
  choice: 悪
  rationale: εἴδουςに属格で結び付き、「悪の種類」という意味を成す。簡潔で直接的な訳語。
theological_decisions:
- issue: ἀπὸ παντὸς εἴδους πονηροῦにおけるεἴδουςの意味
  choice: あらゆる種類の悪
  alternative: あらゆる形の悪／悪と見えるものすべて
  rationale: εἶδοςはここでは「種類」または「形」と解するのが文脈上自然であり、単に悪く見えるものまで避けよ、という意味に限定しない。伝統的な別訳は脚注で明示する。
translation_notes:
  register: 明瞭で簡潔な現代標準語。命令の継続性を「離れていなさい」で表し、厳粛さを保ちながら日常的に理解できる表現とした。
