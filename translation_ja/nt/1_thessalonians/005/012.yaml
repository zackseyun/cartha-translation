id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: ja
  text: 兄弟たち[a]、あなたがたにお願いします。あなたがたの間で労苦し、主にあってあなたがたを導き[b]、戒めている人たちを認めてください[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「兄弟たち」。ここでは会衆への呼びかけとして、姉妹たちも含み得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「主にあってあなたがたの上に立ち」または「主にあってあなたがたの世話をし」。
    reason: alternative_reading
  - marker: c
    text: 別訳「重んじてください」または「尊敬してください」。字義的には「知ってください」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: お願いします
  rationale: 命令ではなく、牧会的で穏やかな要請を表すため。日本語では主語を明示せずとも一人称複数の働きかけが自然に伝わる。
- source_word: δὲ
  choice: 訳文では明示しない
  rationale: 軽い談話上の移行を示す語であり、この一節だけの日本語では接続語を補わないほうが自然。強い逆接にはしない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を保つ。ただし会衆全体への呼びかけであり、姉妹も含むことを脚注に示す。
- source_word: εἰδέναι
  choice: 認めてください
  rationale: 字義的な「知る」よりも、奉仕者を見分け、その働きをしかるべく認知するという文脈上の意味を表す。「尊敬する」と断定して意味を強めすぎない。
- source_word: κοπιῶντας
  choice: 労苦し
  rationale: 骨折って働くという語の強さと、その奉仕の重みを簡潔に保つ。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 会衆のただ中で行われる働きを自然かつ直接的に表す。
- source_word: προϊσταμένους ὑμῶν
  choice: あなたがたを導き
  rationale: 指導、監督、世話という意味領域のうち、権威と配慮の双方を排除しない表現。固定的な教会制度を読み込まない。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: その指導が主との関係の中で行われることを示す、簡潔で神学的に透明な表現。
- source_word: νουθετοῦντας
  choice: 戒めている
  rationale: 単なる教育ではなく、誤りを正すための助言や警告を含む牧会的働きを表す。
theological_decisions:
- issue: 会衆への呼びかけ ἀδελφοί の範囲
  choice: 本文では「兄弟たち」とし、会衆全体を指し得ることを脚注に示す
  alternative: 兄弟姉妹たち
  rationale: 原文の文法的形を保持しながら、女性信徒を除外する呼びかけではないという文脈上の包摂性も明示する。
- issue: 奉仕者に対する εἰδέναι の意味
  choice: 認めてください
  alternative: 重んじてください／尊敬してください／知ってください
  rationale: 彼らの働きを認知し、しかるべく評価するよう求めているが、服従や崇敬までを明示的に命じてはいない。意味を強めず、語の幅を脚注に残す。
- issue: προϊσταμένους ὑμῶν ἐν κυρίῳ の力点
  choice: 主にあってあなたがたを導き
  alternative: 主にあってあなたがたの上に立ち／世話をし
  rationale: 指導や監督の権威を保ちつつ、特定の教会政治や硬直した上下関係を本文に持ち込まない。「上に立つ」というより直訳的な可能性は脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、牧会的な要請の穏やかさと、奉仕者の労苦・指導・戒めの重みを両立させた。「主にあって」は聖書的な尊厳を保ちつつ一般読者にも理解できる定着表現として採用した。
