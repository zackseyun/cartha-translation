translation:
  language: ja
  text: すべての兄弟たちに、聖なる口づけをもって挨拶しなさい。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての兄弟姉妹」とも訳せる。ここで「兄弟たち」は、女性を含む信仰共同体全体を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「聖なる口づけ」は、キリスト者の交わりと愛情を表す、当時の文化において認められたしるしであった。
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 挨拶しなさい
  rationale: アオリスト中動態命令法二人称複数による直接的な勧め。ἀσπάζομαιの対人的な挨拶の意味を、簡潔で自然な現代日本語の命令表現で示す。
- source_word: ἀδελφοὺς
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文では形式に即して訳す。ただし、ここでは信仰共同体全体、すなわち女性を含む会衆を指し得るため、その可能性を脚注に明記する。
- source_word: πάντας
  choice: すべての
  rationale: 冠詞とἀδελφοὺςに結び付き、対象となる集団の全員を強調するため、「すべての」と訳す。
- source_word: ἐν φιλήματι ἁγίῳ
  choice: 聖なる口づけをもって
  rationale: ἐνはここで挨拶に伴う手段または仕方を示す。φίλημαは「口づけ」、ἅγιοςはそれを信仰共同体にふさわしい聖なる行為として特徴づける。「をもって」は原文との対応を保ちながら、品位ある日本語となる。
theological_decisions:
- issue: 会衆への呼びかけにおけるἀδελφοίの性別を含む範囲
  choice: 本文は「兄弟たち」とする
  alternative: 「兄弟姉妹」または「信徒の皆」
  rationale: 語形は男性複数であるため本文ではその形を保持する一方、当時の用法と文脈上、女性を含む信仰共同体全体を指す可能性が高い。この包括的な指示範囲は脚注に残し、原文の形式と実際の指示対象との緊張を解消せずに示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「口づけ」は「キス」より聖書本文の文体に適し、「接吻」ほど古風・硬質ではない。「をもって」はやや改まった表現だが、短い勧告文の品位とἐνの手段・様態を自然に伝える。
