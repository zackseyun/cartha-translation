id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: ja
  text: しかし、私たちは昼に属する者なのですから、信仰[a]と愛の胸当てを身に着け、救いの希望というかぶとをかぶって、身を慎んでいましょう。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は「信頼」または「忠実さ」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「身を慎む」に当たる語には、「しらふでいる」という意味と、比喩的に「目を覚まし、冷静でいる」という意味があります。
    reason: lexical_range
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: しかし、私たちは
  rationale: δέが直前の「彼ら」との対照を示すため、「しかし」で自然に表した。
- source_word: ἡμέρας ὄντες
  choice: 昼に属する者なのですから
  rationale: 単なる時刻ではなく、昼という領域・側への帰属を表す属格表現である。分詞の論理的な理由の含みも「ですから」で示した。
- source_word: νήφωμεν
  choice: 身を慎んでいましょう
  rationale: νήφωには、酒に酔っていないことと、比喩的に冷静で節度を保つことの両方の響きがある。現代日本語として自然で品位のある表現を本文に採用した。
- source_word: ἐνδυσάμενοι
  choice: 身に着け……かぶり
  rationale: 武具を装う比喩を保ちつつ、主たる勧告に伴う行為として自然な日本語の連用形で表した。
- source_word: θώρακα πίστεως καὶ ἀγάπης
  choice: 信仰と愛の胸当て
  rationale: 武具の比喩と、信仰・愛という構成要素を簡潔に保持した。
- source_word: περικεφαλαίαν ἐλπίδα σωτηρίας
  choice: 救いの希望をかぶととして
  rationale: ギリシャ語では「かぶと」と「救いの希望」が同格であるため、その関係を明瞭で自然な日本語にした。
theological_decisions:
- issue: πίστις の意味
  choice: 信仰
  alternative: 真実／忠実さ、信頼
  rationale: 愛および救いの希望と並ぶ徳目としては「信仰」が最も自然だが、語そのものには「忠実さ」の意味もあり得るため脚注に残した。
- issue: ἡμέρας ὄντες の比喩
  choice: 昼に属する者
  alternative: 昼の者である
  rationale: 倫理的・共同体的な帰属を示す比喩を保ちつつ、それ以上の教理的説明を本文へ加えなかった。
- issue: νήφωμεν の射程
  choice: 身を慎んでいましょう
  alternative: しらふでいましょう／目を覚ましていましょう
  rationale: 直前の夜・眠り・酩酊との対照により、文字どおりの禁酒状態と比喩的な覚醒・節制の両義が響く。本文では意味を一方に限定しすぎない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、軍装と昼夜の比喩を保持した。「胸当て」「かぶと」は一般読者にも理解できる伝統的かつ具体的な武具語である。
