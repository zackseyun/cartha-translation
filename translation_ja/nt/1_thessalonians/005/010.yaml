  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: ja
  text: 私たちのために死なれた方が、私たちが目覚めていても眠っていても、その方と共に生きるように、死なれたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「警戒していても眠っていても」とも理解できる。周囲の文脈にある、目を覚ましているようにとの勧めを響かせている可能性もあるが、ここではおそらく、信者が生きていても死んでいても、という意味である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: 死なれた方
  rationale: 前節の「私たちの主イエス・キリスト」を受けるアオリスト分詞。日本語では敬意を保ちつつ、連体修飾として自然に訳した。
- source_word: περὶ ἡμῶν
  choice: 私たちのために
  rationale: この救済論的文脈では、属格を伴う περί は「〜のために／〜に代わって」の意味を持つ。「ために」は本文以上に代償性を限定せず、自然である。
- source_word: ἵνα
  choice: それは…ためです
  rationale: 目的ないし意図された結果を示す。前文との論理関係を明確にしながら、目的の力を保った。
- source_word: γρηγορῶμεν
  choice: 目覚めていても
  rationale: 字義的な覚醒と比喩的な警戒の両方を帯び得る語。καθεύδωμεν との対を保ち、文脈上の生存という含意も残す。
- source_word: καθεύδωμεν
  choice: 眠っていても
  rationale: 「目覚めている」と自然に対をなし、死を指す比喩を説明的に置き換えず保持する。
- source_word: ἅμα
  choice: 共に
  rationale: σὺν αὐτῷ と結びつき、キリストとの共同の生を表すため、簡潔に「共に」とした。
- source_word: σὺν αὐτῷ
  choice: この方と
  rationale: 直前の「方」を明確に受け、キリストとの結びつき・同伴を表す。ἅμα は別に「共に」と訳した。
- source_word: ζήσωμεν
  choice: 生きる
  rationale: ἵνα に導かれるアオリスト接続法。日本語では「ためです」という目的構文に組み込み、意図された結果を自然に表した。
theological_decisions:
- issue: 「目覚めていても眠っていても」の意味
  choice: 本文では比喩を保持し、主として信者が生きているか死んでいるかを指す含みを注で示す
  alternative: 霊的に目を覚ましているか、油断しているかを指す
  rationale: 直前の5章6～7節では倫理的な警戒の語彙として用いられる一方、4章13～15節とのつながりと「共にこの方と生きる」という結論は、生者と死者の対照を強く示唆する。本文で一方に確定せず、真正な含みを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「死なれた方」「この方」により敬意ある文体を保ちつつ、過度に古風な表現は避けた。脚注記号は該当文全体に関わるため文末に置いた。
