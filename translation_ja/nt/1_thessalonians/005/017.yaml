lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: 絶えず
  rationale: 祈りを中断なく、または習慣的にたゆまず続けることを表す副詞。「絶えず」は簡潔で自然な現代日本語であり、一秒ごとの途切れない発話と限定せずに、ギリシア語の持続的な力を保つ。
- source_word: προσεύχεσθε
  choice: 祈りなさい
  rationale: 二人称複数の現在命令形による勧告。「祈りなさい」が命令の力を自然に伝え、継続性は副詞「絶えず」によって十分に示される。
theological_decisions:
- issue: 命令の実践的な意味
  choice: 祈りを持続的、習慣的に続けるよう促す一般的な勧告として、本文の簡潔な表現を保つ。
  alternative: あらゆる瞬間に途切れなく言葉で祈ることを要求するものと解する。
  rationale: 現在命令形とἀδιαλείπτωςの組み合わせは、祈りへの不断の姿勢と粘り強い実践を促す。ただし翻訳本文では解釈を狭く確定せず、原文の強い表現と含みを保つ。
translation_notes:
  register: 簡潔で格調を保ちつつ、一般の読者に明瞭な現代標準日本語。「絶えず祈りなさい」は原文の語順と強い勧告を自然に再現する。
