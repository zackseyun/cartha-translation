  yaml_path: translation/nt/1_thessalonians/005/025.yaml
  text: Brothers[a], pray for us.
translation:
  language: ja
  text: 兄弟たち[a]、私たちのために祈ってください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兄弟姉妹の皆さん」。この呼びかけは会衆全体を含むと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 兄弟たち
  rationale: ἀδελφόςの呼格複数形。ギリシア語の男性形を本文に保ちつつ、会衆全体への呼びかけである可能性を脚注に示した。
- source_word: προσεύχεσθε
  choice: 祈ってください
  rationale: προσεύχομαιの現在命令法二人称複数。日本語では丁寧な依頼形が、使徒から会衆への簡潔な要請を自然かつ明確に表す。継続の含みは文脈上明示しすぎない。
- source_word: περὶ
  choice: のために
  rationale: 属格ἡμῶνを伴い、祈りの対象・関心を表す。日本語の祈りの依頼として「私たちのために」が自然である。
- source_word: ἡμῶν
  choice: 私たち
  rationale: 一人称複数属格。パウロとその同労者たちを指すが、本文以上に特定せず複数形のまま訳した。
theological_decisions:
- issue: Ἀδελφοίが男性形でありながら、男女を含む会衆全体を指す可能性
  choice: 本文は「兄弟たち」
  alternative: 「兄弟姉妹の皆さん」
  rationale: 原文の文法上の男性形を本文に反映し、文脈上あり得る包括的な指示範囲は脚注で明示して、性別と対象範囲の双方を保った。
translation_notes:
  register: 明瞭で現代的な標準語。短い勧告の直接性を保ちながら、「祈れ」ではなく「祈ってください」として、自然で品位ある呼びかけにした。
