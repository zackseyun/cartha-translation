  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: ja
  text: だれもだれに対しても、悪を悪で返すことがないように気をつけなさい。[a] むしろ、互いに対しても、すべての人に対しても、いつも善を追い求めなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれかが、だれかに悪を悪で返すことのないように、注意しなさい。」
    reason: lexical_alternative
  - marker: b
    text: 「互いに」は仲間の信者を、「すべての人」はそれより広く、あらゆる人を指していると考えられる。
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: 気をつけなさい
  rationale: ここでは単に「見る」ことではなく、共同体全体に注意と責任を促す複数形の命令であるため、自然な現代日本語でその勧告の力を表した。
- source_word: μή τις ... ἀποδῷ
  choice: だれも…返すことがないよう
  rationale: ὁρᾶτεに続く予防的な内容節として、報復が起こらないよう注意せよという意味を明確にした。
- source_word: κακὸν ἀντὶ κακοῦ
  choice: 悪に悪を
  rationale: 報復を表す定型的な句であり、原文の語の反復と倫理的な広がりを保った。
- source_word: τινι
  choice: だれに対しても
  rationale: 報復の相手を示す不定代名詞であり、例外を設けない広い範囲を自然な日本語で示した。
- source_word: πάντοτε
  choice: いつも
  rationale: 時間的な普遍性を簡潔で自然な現代日本語にした。
- source_word: τὸ ἀγαθὸν
  choice: 善
  rationale: 冠詞付き形容詞が実体化され、倫理的に良いもの・ことを指す。文脈上、日本語では「善」が簡潔で格調も保てる。
- source_word: διώκετε
  choice: 追い求めなさい
  rationale: 単に好むのでなく、熱心に努めて求める命令の積極的な力を保った。
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: 互いに、またすべての人に対して
  rationale: 行為の向かう対象を示し、共同体内部の相互関係から、より広い全員へと及ぶ表現をそのまま保った。
theological_decisions:
- issue: 倫理的義務の及ぶ範囲
  choice: 「互いに」と「すべての人」を並べ、共同体内からより広い範囲へ及ぶ読みを保つ。
  alternative: 「すべての人」を信者全員だけに限定する。
  rationale: εἰς ἀλλήλους καὶ εἰς πάνταςは、相互の関係から全員へ範囲を広げるのが自然だが、訳文では説明を加えすぎず原文の並列を保持した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、命令の厳粛さを保った。「追い求めなさい」によってδιώκετεの能動的で持続的な力を表した。すべての脚注記号を本文に配置した。
