source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: ja
  text: なぜなら、神は私たちを御怒りを受けるためではなく、私たちの主イエス・メシア[b]を通して救いを得る[a]ために定められたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救いを自分のものとする」「救いを獲得する」、あるいは「救いに至るまで守られる」とも訳し得る。ギリシア語 περιποίησις は「得る」より広い意味範囲を持つ。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「私たちの主イエス・キリスト」。「メシア」はギリシア語 Χριστός が表す称号の意味を訳したもの。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: だからです
  rationale: 直前の勧めの根拠を示す接続語であるため、因果関係が自然に伝わる文末表現とした。
- source_word: ἔθετο ... εἰς
  choice: 定められたのは……ため
  rationale: ある帰結へと置く、定めるという意味を保ちつつ、「運命づける」のような、原文以上に強い予定論的含意を避けた。日本語の敬語「られる」は神を主語とする尊敬表現であり、受身ではない。
- source_word: ὀργή
  choice: 御怒り
  rationale: パウロの終末論的文脈における神の怒りを直接表す。「裁き」とすると結果まで解釈に含めることになるため避けた。
- source_word: περιποίησις σωτηρίας
  choice: 救いを得る
  rationale: ここでは御怒りとの対照として、救いを獲得することを表す自然な日本語とした。ただし περιποίησις の意味範囲は「所有」や「確保・保全」にも及び得るため、脚注で示した。
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・メシアを通して
  rationale: 属格を伴う διά の手段・媒介を「通して」で表した。Χριστός はここでイエスに付された称号としての意味を保つため「メシア」とした。
theological_decisions:
- issue: ἔθετο に強い予定論的意味を持たせるか
  choice: 定められた
  alternative: 運命づけられた
  rationale: 本文は信者に対する神の目的・定めを述べるが、特定の予定論体系まで明示してはいない。「定める」は主張を保ちながら、原文以上に論争点を解決しない。
- issue: ὀργή が神の怒りか一般的な怒りか
  choice: 御怒り
  alternative: 怒り
  rationale: 神が主語であり、救いと対照される終末論的文脈なので神の怒りを指すと理解した。「御」によってその指示を自然に示す一方、「裁き」とは言い換えなかった。
- issue: Χριστός を称号として訳すか、慣用的な名称として音写するか
  choice: メシア
  alternative: キリスト
  rationale: Ἰησοῦ の後に置かれていても、Χριστός の「油注がれた者」という称号性は保たれている。「キリスト」という伝統的表記は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、因果を表す ὅτι を文末の「だからです」で自然に示した。神を主語とする「定められた」は尊敬表現。対照構造を保ち、教派固有の予定論用語は避けた。
