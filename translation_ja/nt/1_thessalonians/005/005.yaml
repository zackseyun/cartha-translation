  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: ja
  text: というのも、あなたがたは皆、光の子であり、昼の子だからです[a]。私たちは夜にも闇にも属していません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では字義的に「光の息子たち、昼の息子たち」。ここで「息子たち」は、光と昼に属し、それらによって特徴づけられる者たちを指す慣用表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: あなたがたは皆……だからです
  rationale: πάντεςの包括的な強調を「皆」で表し、γάρの直前の文脈を説明する働きを、日本語として自然な文末の「だからです」で示した。
- source_word: υἱοὶ φωτός
  choice: 光の子
  rationale: υἱοίは字義的には「息子たち」だが、ここでは光に属し、光によって特徴づけられる者を表すセム語的な慣用表現である。日本語の「子」はこの所属・性質の比喩を自然に保ち、男性だけを指すとの誤解も避ける。
- source_word: υἱοὶ ἡμέρας
  choice: 昼の子
  rationale: 「光の子」と並行する比喩を保持し、ἡμέραςを「昼」と訳して、後半の「夜」との対照を明確にした。
- source_word: οὐκ ἐσμὲν
  choice: 私たちは……ありません
  rationale: 二人称複数の「あなたがた」から一人称複数の「私たち」へ移る原文の人称変化を、そのまま保持した。
- source_word: νυκτὸς οὐδὲ σκότους
  choice: 夜の者でも、闇の者でも
  rationale: 属格が示す所属・性質を、日本語で自然な「～の者」によって表し、夜と闇の並行関係を保った。
theological_decisions:
- issue: υἱοίの性別を伴う家族的比喩
  choice: 光の子、昼の子
  alternative: 光の息子たち、昼の息子たち
  rationale: ギリシア語の男性複数形を注で明示しつつ、本文では男女を含む共同体全体を指す慣用的意味と比喩を、現代日本語で自然な「子」によって伝えた。
- issue: 二人称から一人称複数への移行
  choice: あなたがたは皆……私たちは……
  alternative: あなたがたは皆……あなたがたは……
  rationale: パウロが読者への直接的な呼びかけから、自分たちを含めた告白へ移る原文の修辞的特徴を平準化せずに保った。
- issue: 夜と闇への所属を表す属格
  choice: 夜の者でも、闇の者でもありません
  alternative: 夜にも闇にも属していません
  rationale: 所属の意味を明瞭にしながら、前半の「光の子、昼の子」と呼応する人物表現を維持した。
translation_notes:
  register: 明快な現代標準日本語を用い、格調を保ちながらも過度に文語的にはしなかった。γάρは独立した「というのは」ではなく文末の「だからです」で自然に接続し、原文の人称変化と光／闇、昼／夜の対照を保持した。
