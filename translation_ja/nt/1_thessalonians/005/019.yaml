  text: Do not quench the Spirit,[a]
translation:
  language: ja
  text: 聖霊を消してはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「霊を消してはなりません」。ギリシア語は一般に「霊」を意味することもありますが、続いて預言に触れていることから、ここでは聖霊を指す可能性が高いと考えられます。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 定冠詞を伴う πνεῦμα は、直後の預言への言及（20節）を踏まえると、ここでは聖霊を指す可能性が最も高い。「御霊」は神の霊を自然かつ簡潔に示す一方、原文自体には大文字・小文字による区別がないため、別解を脚注に残す。
- source_word: μὴ
  choice: ～してはなりません
  rationale: μή と現在命令形による禁止を、勧告調の文脈と現代日本語の丁寧で格調ある文体に合わせて表す。
- source_word: σβέννυτε
  choice: 消して
  rationale: σβέννυμι は火や灯火を『消す』ことを基本義とする。聖霊の働きを抑えるという比喩を説明的に言い換えず、原文のイメージを保つ。
theological_decisions:
- issue: πνεῦμα が指すもの
  choice: 御霊（聖霊）
  alternative: 霊、人の霊、霊的な熱意や賜物
  rationale: 続く『預言を軽んじてはならない』との勧告から、会衆に働く聖霊を指すのが最も自然である。ただし πνεῦμα にはより一般的な『霊』という語義もあるため、その曖昧さを脚注で保持する。
translation_notes:
  register: 明快な現代標準日本語。原文の短く強い禁止命令と、火を消すという比喩を保持した。「御霊」は文脈上の有力な指示対象を示すが、過度に解釈を固定しないよう脚注を付した。
