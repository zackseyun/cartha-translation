source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: ja
  text: しかし、兄弟たち[a]、あなたがたは闇の中にいないので、その日[b]が盗人のようにあなたがたを捕らえることはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ここでは姉妹たちを含め、信徒全体に呼びかける意味にも取れます。
    reason: lexical_alternative
  - marker: b
    text: 直前の文脈では「主の日」を指します。
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: しかし、あなたがたは
  rationale: δέによる直前との対比を「しかし」で示し、明示されたὑμεῖςの強調は「あなたがたは」で保った。日本語として自然にするため、呼びかけを間に置いた。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを字義に即して訳した。会衆全体を含む用法である可能性は脚注に示した。
- source_word: ἐν σκότει
  choice: 闇の中に
  rationale: 道徳的・霊的な無知を示す比喩だが、原文の「闇」という像と神学的含意を保った。
- source_word: ἵνα
  choice: ですから、…ことはありません
  rationale: 彼らが闇の中にいないことと、その日が彼らを捕らえないこととの帰結的なつながりを自然な日本語で表した。目的か結果かを必要以上に限定していない。
- source_word: ἡ ἡμέρα
  choice: その日
  rationale: 定冠詞と直前の文脈によってすでに示されている特定の日を指すため、「その日」とした。本文では「主の日」と補わず、指示対象は脚注で明らかにした。
- source_word: ὡς κλέπτης
  choice: 盗人のように
  rationale: ὡςの比較を保ち、突然訪れるという比喩を自然かつ格調ある日本語で表した。
- source_word: καταλάβῃ
  choice: 捕らえる
  rationale: 追いついて捕らえる、また不意に捕捉するという語感を保った。「不意を突く」などの説明的な訳に狭めなかった。
theological_decisions:
- issue: 混合された会衆に対するἀδελφοίという性別を伴う呼びかけ
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／皆さん
  rationale: 原文の男性複数形を本文に保ちつつ、当時この語が会衆全体を包括的に指し得ることを脚注で示した。
- issue: ἡ ἡμέραが指す終末論的な日
  choice: その日
  alternative: 主の日／かの日
  rationale: 直前の文脈では「主の日」を指すが、この節のギリシア語本文は単に「その日」としている。本文で語を補わず、文脈上の指示対象を脚注で説明した。
- issue: ἵνα節の目的・結果の含み
  choice: ですから、その日が…捕らえることはありません
  alternative: その日が…捕らえるようなことにはなりません
  rationale: 原文が表す論理的な結びつきを保ちながら、目的と結果のどちらか一方に過度に固定しない表現とした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、使徒的な呼びかけと「闇」「盗人」という原文の比喩を保った。「盗人」は「泥棒」よりも聖書本文にふさわしい格調を持つが、現代の読者にも理解可能である。
