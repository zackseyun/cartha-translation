  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: ja
  text: だれもこれらの苦難[b]によって動揺する[a]ことがないようにするためです。あなたがた自身が知っているとおり、私たちはこのことを受けるよう定められているのです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「動揺する」は、「心を乱される」「揺さぶられる」とも訳せる。この動詞はまれで、ほかの文脈では「欺かれる」または「甘言で取り込まれる」という意味を持つこともある。
    reason: lexical_alternative
  - marker: b
    text: 「苦難」は、「患難」または「圧迫」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「定められている」は、直訳的には「置かれている」。「私たちはこのことのために定められている」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: だれも……動揺することがないためです
  rationale: 冠詞付き不定詞を、前節に結びつく目的を表す自然な日本語にした。まれな動詞 σαίνεσθαι は、この文脈では苦難によって心を揺さぶられ、不安定になることを指すと判断し、「動揺する」とした。受動の形は日本語として自然な表現の中に含意させた。
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: これらの苦難によって
  rationale: θλῖψις の圧迫を伴う重い意味を、現代日本語で明確な「苦難」とした。ἐν は状況または契機を表しうるが、「動揺する」との関係を自然に示すため「によって」と訳した。
- source_word: αὐτοὶ
  choice: あなたがた自身が
  rationale: 強意代名詞の強調を保ち、単なる「あなたがた」ではなく「あなたがた自身」とした。
- source_word: γὰρ
  choice: とおり
  rationale: γάρ の説明的なつながりを、日本語では「知っているとおり」という自然な構文で示した。独立した「というのは」を置くより流れが明瞭になる。
- source_word: οἴδατε
  choice: 知っている
  rationale: 完了形の形を持ちながら現在の意味で用いられているため、標準的に「知っている」とした。
- source_word: εἰς τοῦτο
  choice: このことのために
  rationale: 直前の苦難を受ける現実を指す表現として、指示内容を説明しすぎず「このこと」とした。「のために」は原文の方向・割り当ての含みを保つ。
- source_word: κείμεθα
  choice: 私たちは……定められている
  rationale: κεῖμαι の字義は「置かれている」だが、この慣用では割り当てられた状態を表す。「定められている」は受動性と神の秩序の含みを保ちつつ、不自然な直訳を避ける。
theological_decisions:
- issue: εἰς τοῦτο κείμεθα が示す、信者と苦難との関係
  choice: 私たちはこのことのために定められている
  alternative: 私たちはこのことに置かれている／私たちはこのことを受けるよう定められている
  rationale: 苦難が信仰者にとって予期せぬ例外ではなく、その歩みに伴うものだという本文の重みを保った。一方で、行為主体や予定の体系を本文以上に特定せず、特定教派の予定論を読み込まないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい落ち着きと尊厳を保った。前節に依存する目的表現は「ためです」として接続を示し、「苦難」「定められている」によって原文の神学的な重みを過度に古風にならず伝えた。
