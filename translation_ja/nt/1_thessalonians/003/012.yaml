id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: ja
  text: 私たちがあなたがたに対してそうであるのと同じように、主が、あなたがたの、互いに対する愛とすべての人に対する愛を、さらに増し加え、豊かにあふれさせてくださいますように[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、「あなたがた」が「増し加える」と「あふれさせる」の目的語であり、「愛において」が増大する領域を示す。ここでは自然な日本語にするため、「あなたがたの……愛を」と表現している。
    reason: 原文の構文と、日本語訳での構文上の組み替えを正確に示すため。
  - marker: b
    text: ギリシア語の比較句は省略表現で、直訳すると「私たちもあなたがたに対して」となる。意味は前の句から補われる。
    reason: 原文の省略表現と、訳文の「そうである」という最小限の補いを明示するため。
lexical_decisions:
- source_word: ὑμᾶς δὲ
  choice: あなたがたの……愛を
  rationale: ギリシア語では「あなたがた」が二つの使役的な動詞の目的語だが、日本語では愛そのものを目的語にすると、主が彼らの愛を増しあふれさせるという意味を自然かつ明確に表せる。δέは直前からの緩やかな展開を示すため、独立した強い逆接語は置かない。
- source_word: ὁ κύριος
  choice: 主
  rationale: 祈願文における称号として簡潔に保ち、指示対象を訳文で限定しない。
- source_word: πλεονάσαι καὶ περισσεύσαι
  choice: ますます増し加え、豊かにあふれさせてくださいますように
  rationale: 祈願を表すアオリスト希求法を「くださいますように」で示す。近接する二動詞を一語にまとめず、増加と満ちあふれるほどの豊かさという修辞的強調を保つ。
- source_word: τῇ ἀγάπῃ
  choice: 愛を
  rationale: 与格は増加が生じる領域・点を示す。日本語では「あなたがたの愛を」と組み替えることで自然に表現する。
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: 互いに対する愛、またすべての人に対する愛
  rationale: εἰςの方向性を「に対する」で表す。πάνταςは対象を信者または全人類に訳し分けず、「すべての人」と広く保つ。
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: ちょうど私たちも、あなたがたに対してそうであるように
  rationale: 原文の省略表現を「そうである」で補い、私たちの愛も同様だという文脈上の意味を示しつつ、特定の動詞を過度に補わない。
theological_decisions:
- issue: 「主」の指示対象
  choice: 「主」とだけ訳し、明示的に特定しない。
  alternative: 「主イエス」または「神」と補う。
  rationale: κύριοςという本文の称号をそのまま保つ。文脈からキリスト論的に理解し得るが、この節自体には名が明記されていない。
- issue: πάνταςの範囲
  choice: 「すべての人」と広く訳す。
  alternative: 「すべての信者」または特定集団に限定する。
  rationale: 相互の愛からさらに対象を広げる表現だが、原文はその範囲を明示的に限定していないため、開かれた広がりを保つ。
- issue: 終結句の省略
  choice: 「そうである」と最小限に補う。
  alternative: 「愛している」または「愛にあふれている」と動詞を明示する。
  rationale: ギリシア語の「私たちもあなたがたに対して」とだけある省略を可読性のため補いつつ、前の二動詞のどちらを厳密に引き継ぐかは決めない。
translation_notes:
  register: 明瞭な現代標準語を用い、祈願としての荘重さは「くださいますように」で保った。「ますます増し加え、豊かにあふれさせる」は二つの近義動詞による強調を、過度に古風にならない形で再現している。
