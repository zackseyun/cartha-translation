source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: ja
  text: ですから、兄弟たち[a]、私たちは、あらゆる苦境と苦難の中で、あなたがたのことについて、あなたがたの信仰[b]によって慰められました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」はパウロが信徒の集まりに呼びかける際の慣用表現で、女性を含む信仰共同体全体を指すことがあります。
    reason: cultural_note
  - marker: b
    text: 「信仰」は「忠実さ」とも訳せます。ここでは、テサロニケの信徒たちが信仰を守り続けている揺るがなさも含まれていると考えられます。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 直前に述べられたテモテの報告を受ける因果・推論上のつながりを、自然な現代日本語で示す。
- source_word: παρεκλήθημεν
  choice: 慰められました
  rationale: 受動形を保ち、苦境と苦難の中でテサロニケの信徒たちの信仰を知って慰めを受けたという文脈に合わせた。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 呼びかけの男性複数形を本文で明示しつつ、パウロ書簡では会衆全体を指し得ることを脚注に示した。
- source_word: ἐφ’ ὑμῖν
  choice: あなたがたのことで
  rationale: 慰めが何に関して生じたかを表し、苦境や苦難の原因がテサロニケの人々だったとの誤解を避ける。
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: あらゆる苦境と苦難の中にあっても
  rationale: 慰めを受けた状況を示す句として訳し、二つの苦しみを表す名詞を区別して保持した。「中にあっても」は逆境にもかかわらず慰められたという文脈上の関係を自然に示す。
- source_word: ἀνάγκῃ
  choice: 苦境
  rationale: ここでは単なる必要や必然ではなく、圧迫された困難な状態を指すため。
- source_word: θλίψει
  choice: 苦難
  rationale: 圧迫や患難を表す語の重みを保ちながら、現代の一般読者に自然な表現とした。
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: あなたがたの信仰を通して
  rationale: 属格を伴う διά の手段的な意味を保ち、信仰が慰めの媒介となったことを示した。
- source_word: πίστεως
  choice: 信仰
  rationale: πίστις の基本的な意味を採りつつ、この文脈で含み得る「忠実さ・揺るがなさ」のニュアンスを脚注に残した。
theological_decisions:
- issue: πίστις が継続的な信頼と忠実さの双方を含み得ること
  choice: 信仰
  alternative: 忠実さ、信仰を守り続けていること
  rationale: 本文では語の標準的な神学的・語彙的対応である「信仰」を用いる。一方、直前の報告との関係では、信仰に踏みとどまる揺るがなさも含意され得るため、脚注で明示した。
- issue: ἀδελφοί の指示範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原文の男性複数形を本文に保った。ただし、パウロが会衆全体への呼びかけとして用いる慣用表現であり得るため、その包括的な用法を脚注で説明した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の受動態、二つの苦難語、慰めの手段としての信仰を保持した。語順は日本語として理解しやすくしつつ、「あなたがたのことで」が苦難ではなく慰めに関係することを明確にした。
