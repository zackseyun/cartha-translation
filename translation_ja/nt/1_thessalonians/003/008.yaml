translation:
  language: ja
  text: あなたがたが主にあって堅く立っているなら、今、私たちは生きているのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生きている」は、単に肉体的に生存しているという意味ではなく、あなたがたが堅く立っていることを知って新たな生気や励ましを得たことを表す修辞的な言い方と考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ［日本語では独立した接続語を置かず］〜のです
  rationale: 直前の慰め・喜びを説明する理由・内容を導く接続詞。日本語では文末の説明表現により因果・説明のつながりを自然に示せる。
- source_word: νῦν
  choice: 今
  rationale: 現在の時点で新たに得た生気を強調する時間副詞を、そのまま明示した。
- source_word: ζῶμεν
  choice: 私たちは生きていると言える
  rationale: 字義的な「生きている」を保持しつつ、文脈上の修辞的な生気・励ましを自然な日本語で示す。「と言える」は断定の内容を説明的に提示するが、比喩の意味を特定しすぎない。
- source_word: ἐὰν
  choice: 〜なら
  rationale: 条件を表す形を保持し、自然な現代日本語の条件表現とした。
- source_word: ὑμεῖς
  choice: あなたがたが
  rationale: 明示された複数代名詞を訳出し、テサロニケの信徒たちに焦点があることを保った。
- source_word: στήκετε
  choice: 堅く立っている
  rationale: 現在形が示す継続的な堅固さを表し、比喩的な「立つ」という原語の像も保持した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ特有の関係・領域を示す表現を、神学的な広がりを狭めずに保つ定着した日本語とした。
theological_decisions:
- issue: 「今、私たちは生きている」の意味
  choice: 字義的表現を保ちながら、信徒たちの堅固さによって生気と励ましを得たという修辞的表現として読める訳
  alternative: 私たちは元気づけられています／私たちは本当に生きた心地がします
  rationale: 原文の大胆な「生きている」という表現を解釈的な語に置き換えず、肉体的生存だけを意味するとの誤解には脚注で対応した。
- issue: 「主にあって」の意味
  choice: 主との関係・主に属する領域における堅固さ
  alternative: 主と結ばれて／主に忠実に
  rationale: 特定の教派的な忍耐論や結合概念へ限定せず、パウロの表現が持つ神学的な幅を保持した。
- issue: 条件節の修辞的力
  choice: 「〜なら」として条件形式を保持
  alternative: 〜ので／〜であるかぎり
  rationale: ἐὰνの条件性を消さず、同時に信徒の現状への疑念と断定することも避けた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「主にあって」「堅く立つ」というパウロ的表現を保持しつつ、語順を日本語として自然な条件節先行型にした。
