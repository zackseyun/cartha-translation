id: 1TH.3.4
reference: 1 Thessalonians 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: ja
  text: というのも、私たちがあなたがたのもとにいたとき、私たちは苦難[a]に遭うことになると、前もって何度もあなたがたに告げていました。実際にそのとおりになったことは、あなたがたも知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「苦しめられる」または「患難に遭う」とも訳せる。ギリシャ語の動詞は、圧迫、苦悩、または迫害を経験することを表しうる。
    reason: θλίβεσθαιの代替可能な訳語と、その意味領域を示す語彙注。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実際
  rationale: 前節の説明を加えつつ強調する接続表現として、現代日本語で自然な「実際」とした。γάρの説明的な働きとκαίの強意を合わせて表す。
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: あなたがたと一緒にいたとき
  rationale: πρὸς ὑμᾶςはここでは相手のもとにいて共に過ごすことを表すため、自然で関係性も伝わる表現とした。
- source_word: προελέγομεν
  choice: 前もって何度も……話していました
  rationale: προ-の「前もって」と未完了過去の継続・反復的な側面の両方を明示する。「警告していた」は文脈上可能だが、動詞そのものより意味を狭めるため避けた。
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: 私たちは苦難に遭うことになる
  rationale: μέλλομενの予期された将来を「ことになる」で表し、受動不定詞θλίβεσθαιは、圧迫・苦悩・迫害を含みうる「苦難に遭う」とした。
- source_word: καθὼς καὶ ἐγένετο
  choice: そのとおりになった
  rationale: 予告と実際の出来事との一致を、簡潔で自然な日本語で表した。καίの強調は文全体の「実際」と「そのとおり」によって無理なく反映される。
- source_word: καὶ οἴδατε
  choice: あなたがたも知っているとおり
  rationale: 聞き手がその実現を知っているという意味を自然に示す。「も」によりκαίを反映し、何を知っているかは直前の内容から明らかなまま保った。
theological_decisions:
- issue: θλίβεσθαιが表す苦難の性質
  choice: 迫害を含みうる一般的な苦難として「苦難に遭う」
  alternative: 「迫害される」または終末論的な意味合いを帯びうる「患難に遭う」
  rationale: 文脈には反対や迫害が想定されるが、語自体は圧迫、苦悩、困難をより広く表しうる。「迫害」に限定せず、「患難」という専門的・終末論的に響きうる語も避けた。
translation_notes:
  register: 明瞭で現代的ながら、書簡にふさわしい落ち着いた文体。「何度も……話していました」で未完了過去の反復性を示し、原文の意味を過度に専門語化しない。
