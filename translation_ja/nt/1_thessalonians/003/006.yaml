source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: ja
  text: しかし今、テモテがあなたがたのもとから私たちのところに来て、あなたがたの信仰[a]と愛について、また、あなたがたがいつも私たちを好意をもって覚え、私たちがあなたがたに会いたいと切に願っているのと同じように、あなたがたも私たちに会いたいと切に願っていることについて、良い知らせを私たちに伝えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忠実さ」。ギリシア語の「ピスティス」は、信仰、信頼、忠実さを表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: しかし今
  rationale: 直前までの不安から、テモテの報告による安堵へ移る軽い対照と現在時点への転換を自然な日本語で示す。
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: テモテがあなたがたのもとから私たちのところに帰って来て
  rationale: 属格独立構文を自然な節に改めた。πρὸς ἡμᾶς と ἀφ’ ὑμῶν の起点・到着点を保ち、派遣した側への帰着を文脈上自然な「帰って来て」で表す。
- source_word: εὐαγγελισαμένου
  choice: 良い知らせを伝えてくれました
  rationale: ここでは福音宣教そのものではなく、テサロニケの信徒についての喜ばしい報告を指す。語の「良い知らせ」という響きを保持する。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: この文脈では彼らが信仰を保っていることを指すのが自然である一方、「忠実さ」の含意もあり得るため脚注に残す。
- source_word: τὴν ἀγάπην
  choice: 愛
  rationale: ἀγάπηの標準的かつ文脈に適した訳。
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: 私たちを好意をもって覚え
  rationale: 直訳的な「良い記憶を持つ」は不自然なので、肯定的に心に留めている意味を明瞭な現代日本語で表す。
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: 私たちに会いたいと切に願っている
  rationale: ἐπιποθέωの強い、愛情を帯びた願望を「切に願う」で表す。
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: 私たちがあなたがたに会いたいと切に願っているのと同じように
  rationale: 原文で省略された動詞句を日本語で補い、互いに会うことを願う比較関係を明確にする。
theological_decisions:
- issue: πίστιςを「信仰」と「忠実さ」のどちらで訳すか
  choice: 信仰
  alternative: 忠実さ
  rationale: テモテの報告は、試練の中でもテサロニケの人々が信仰にとどまっていることに関するものと読むのが自然である。ただしπίστιςには忠実さ・誠実さの意味領域もあるため、本文で一方に完全に固定せず脚注で代替訳を示す。
translation_notes:
  register: 明瞭で現代的ながら dignified な書簡文体とした。原文は次節へ続く長い構文だが、この節単独でも理解できるよう二文に分け、「伝えてくれました」を補って報告内容の並列関係を明確にした。
