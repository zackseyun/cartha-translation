revisions:
- from: しかし今、テモテがあなたがたのもとから私たちのところに帰って来て、あなたがたの信仰[a]と愛について良い知らせを伝えてくれました。また、あなたがたがいつも私たちを好意をもって覚え、私たちがあなたがたに会いたいと切に願っているのと同じように、私たちに会いたいと切に願っていることも伝えてくれました。
  to: しかし今、テモテがあなたがたのもとから私たちのところに来て、あなたがたの信仰[a]と愛について、また、あなたがたがいつも私たちを好意をもって覚え、私たちがあなたがたに会いたいと切に願っているのと同じように、あなたがたも私たちに会いたいと切に願っていることについて、良い知らせを私たちに伝えました。
  rationale: テモテの移動を原文どおり中立的な「来て」とし、報告内容の二つの要素（信仰と愛／パウロたちへの好意的な記憶と再会への願い）を一つの「良い知らせ」に統合した。相互性を明確にするため比較節後半に「あなたがたも」を置いた。
