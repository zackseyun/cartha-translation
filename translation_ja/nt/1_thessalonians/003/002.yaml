id: 1TH.3.2
reference: 1 Thessalonians 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: ja
  text: そして私たちは、私たちの兄弟であり、メシアの福音において働く神の同労者[a]であるテモテを遣わしました。それは、あなたがたを強め、あなたがたの信仰について励ますためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神と共に働く者」とも訳せる。写本には「神の僕（仕える者）」など、異なる表現を読むものがある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: 遣わしました
  rationale: アオリスト直説法の単純な過去を表し、使者を送る文脈にふさわしい自然で格調ある表現。
- source_word: Τιμόθεον
  choice: テモテ
  rationale: 日本語聖書で定着している標準的な人名表記。
- source_word: ἀδελφὸν ἡμῶν
  choice: 私たちの兄弟
  rationale: 信仰共同体における家族的な比喩と親密さを、解釈的に言い換えず保持する。
- source_word: συνεργὸν τοῦ θεοῦ
  choice: 神の同労者
  rationale: 属格を自然に保ちつつ、SBLGNTの強い表現を弱めない。「神と共に働く者」という理解も可能なため脚注を付す。
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: メシアの福音のために働く
  rationale: ἐνが示す働きの領域を、日本語として自然になるよう明示した。τοῦ Χριστοῦの属格が持つ曖昧さは「メシアの福音」に残した。
- source_word: Χριστοῦ
  choice: メシア
  rationale: この属格構文では称号としての意味が前面にあるため、「キリスト」ではなく称号の意味を明示する。
- source_word: εἰς τὸ στηρίξαι
  choice: 強めるため
  rationale: εἰςと冠詞付き不定詞の目的を明確に表し、στηρίζωの支え固める意味を簡潔に伝える。
- source_word: παρακαλέσαι
  choice: 励ますため
  rationale: 圧迫下の信仰を支える文脈では、勧告・慰めを含み得る語義の中心を「励ます」で自然に表せる。
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: あなたがたの信仰について
  rationale: ὑπέρ＋属格の「～について」を保持する。「信仰のために」も可能だが、目的を重ねて断定しない。
- source_word: πίστεως
  choice: 信仰
  rationale: ここではテサロニケの信徒たちの信頼・信仰を指し、「忠実さ」と狭く限定しない。
theological_decisions:
- issue: συνεργὸν τοῦ θεοῦの訳し方
  choice: 神の同労者
  alternative: 神と共に働く者／神に仕える者
  rationale: 採用本文の強い表現を神学的懸念から弱めず、その緊張を保持する。異読と別の統語的理解は脚注に示す。
- issue: εὐαγγελίῳ τοῦ ΧριστοῦにおけるΧριστοῦ
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての働きが顕著であるため、語義を明示する「メシア」とした。日本語では「キリスト」も広く定着しているが、称号性を優先した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい丁寧さと格調を保った。「神の同労者」という意図的に強い表現は本文に残し、本文批評上および統語上の選択肢を脚注で示した。
