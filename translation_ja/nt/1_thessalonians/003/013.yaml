reference: 1 Thessalonians 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: ja
  text: 私たちの主イエスが、あなたがたの心を、私たちの神であり父である方の前で、聖さにおいて責められるところのないものとして堅くしてくださるように。そのすべての聖なる者たち[a]とともに来られる時に。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのすべての聖徒たち」。ここで「聖なる者たち」が、聖なる人々、天使たち、またはその双方を指すのかは、この箇所では特定できない。
    reason: 原文の指示対象に関する曖昧さと伝統的な別訳を示すため。
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: こうして……堅くしてくださいますように
  rationale: 冠詞付き不定詞が前節から続く目的・結果を表すことを、「こうして」と願望表現で自然に示した。文脈上の主語は主であるため、敬語も用いた。
- source_word: στηρίξαι
  choice: 堅くする
  rationale: 心を強め、揺るがないものにする意味を簡潔に保つ。
- source_word: τὰς καρδίας
  choice: あなたがたの心
  rationale: パウロ書簡における内なる人全体を指す比喩を、日本語でも「心」として保持した。
- source_word: ἀμέμπτους
  choice: 責められるところのないもの
  rationale: 正当な非難を受ける点がないという道徳的・法廷的含意を、明瞭な現代日本語で表した。
- source_word: ἐν ἁγιωσύνῃ
  choice: 聖さにおいて
  rationale: 聖である状態・性質を示す抽象名詞の形を保ち、ἀμέμπτουςとの関係を過度に限定しない。
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: 私たちの神であり父である方の前で
  rationale: 神と父が同一の方を指す構造を明確にしつつ、神の御前という意味を保った。
- source_word: ἐν τῇ παρουσίᾳ
  choice: 来られる時
  rationale: 終末論的文脈での到来を自然な日本語で表した。「臨在」よりも将来の来臨が明確である。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 私たちの主イエス
  rationale: 称号κύριοςを「主」とし、人名を標準的に「イエス」と表記した。
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: そのすべての聖なる者たちとともに
  rationale: ἅγιοιが人間、御使い、または双方を指し得る曖昧さを保ち、「聖徒」より広い表現とした。
theological_decisions:
- issue: 「すべての聖なる者たち」の指示対象
  choice: 人間か御使いかを本文で特定しない
  alternative: 「すべての聖徒たち」または「すべての御使いたち」
  rationale: ἁγίωνはこの終末論的文脈で、聖なる人々、御使いたち、またはその双方を指し得るため、原文の幅を保持した。
- issue: στηρίξαιの行為主体
  choice: 前節の「主」を受け、敬意を伴う願望表現とする
  alternative: 目的を表す非人称的な「堅くするためです」
  rationale: 3:12から続く統語と祈願の流れでは、心を堅くする主体は主と理解するのが自然である一方、節を独立した断定文にはしなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈願としての荘重さを保った。前節に依存する構文であることを「こうして」で示し、「聖なる者たち」は日常的な明瞭さと原文の曖昧さを両立させた。
