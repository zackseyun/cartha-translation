  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: ja
  text: 私たちは、あなたがたの顔を見、あなたがたの信仰に欠けているものを補うことができるようにと、夜も昼もこの上なく切に祈っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの信仰に不足しているものを満たす」。ここでのギリシア語は、信仰においてなお強められ、整えられ、完成される必要のある事柄を広く指すとも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 夜も昼も
  rationale: 時間を表す属格の副詞的用法。継続的・反復的な祈りを表し、原文の語順と強調を自然な日本語で保つ。
- source_word: ὑπερεκπερισσοῦ
  choice: この上なく切に
  rationale: 非常に強い程度を表す副詞。「この上なく」で強意を、「切に」で願い求める祈りのあり方を自然に示す。
- source_word: δεόμενοι
  choice: 祈っています
  rationale: 切実に願い求めることを表す分詞。日本語では強意表現と組み合わせ、「祈っています」とすることで過度に誇張せず祈願の意味を伝える。
- source_word: εἰς τὸ ἰδεῖν
  choice: 見て
  rationale: 目的を表す前置詞付き不定詞。後続の καταρτίσαι と並ぶ願いの内容として、日本語では「見て……補いたいと」と自然につなぐ。
- source_word: ὑμῶν τὸ πρόσωπον
  choice: あなたがたの顔
  rationale: 原文の具体的表現を保持する。直接会うことを意味する慣用的な含みも文脈から理解できる。
- source_word: καταρτίσαι
  choice: 補いたい
  rationale: 整える、完成させる、不足を満たすという意味範囲を持つ。τὰ ὑστερήματα との組み合わせでは「欠けているものを補う」が自然で、信仰を支え強める意図を表せる。
- source_word: τὰ ὑστερήματα
  choice: 欠けているもの
  rationale: 複数形だが、日本語では集合的に「欠けているもの」とするのが自然。欠陥を断定する強い語を避けつつ、不足・未完成の意味を保つ。
- source_word: τῆς πίστεως ὑμῶν
  choice: あなたがたの信仰に
  rationale: 属格を「信仰に欠けているもの」と関係づける。πίστις はこの文脈では、さらに教えられ強められるべき信仰・信頼を指すと理解するのが自然。
theological_decisions:
- issue: πίστις の訳語
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: この箇所ではテサロニケの人々が抱く信仰がさらに補われ、強められることが主眼であり、「信仰」が最も広く自然である。「忠実さ」は行動面に限定しすぎる可能性がある。
- issue: 信仰における不足の性質
  choice: 欠けているものを補う
  alternative: 信仰の欠陥を直す／信仰を完成させる
  rationale: 原文は実際の不足を語る一方、それが重大な欠陥なのか、なお必要な教え・強化・完成なのかを限定していない。その幅を残すため、中立的な表現と注を用いる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りの切実さと使徒的な配慮にふさわしい品位を保った。「顔」は原文の具体性を残し、「欠けているもの」は責める響きを過度に強めず、語義上の幅を脚注で保持した。
