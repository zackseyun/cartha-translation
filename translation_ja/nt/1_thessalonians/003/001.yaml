  text: Διὸ μηκέτι στέγοντες εὐδοκήσαμεν καταλειφθῆναι ἐν Ἀθήναις μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/001.yaml
  text: Therefore[a], when we could bear it no longer, we were pleased to be left alone in Athens[b],
translation:
  language: ja
  text: そこで、もはや耐えきれなくなった私たちは[a]、自分たちだけでアテネに残されることをよしとし[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこで、私たちはもはや我慢できず」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「アテネに自分たちだけで残されるのが最善だと考え」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: そこで
  rationale: 直前の文脈を受けた推論・帰結を示し、日本語で自然に論理のつながりを保つ。
- source_word: μηκέτι στέγοντες
  choice: もはや耐えきれなくなった
  rationale: μηκέτιの限界・継続不能と、στέγωの『耐える、持ちこたえる』という文脈上の意味を自然な日本語で表す。
- source_word: εὐδοκήσαμεν
  choice: よしとし
  rationale: 喜び・意向・好ましい判断を含み得る語であり、単なる実務的決定に狭めず、日本語として自然に意思決定を示す。
- source_word: καταλειφθῆναι
  choice: 残される
  rationale: アオリスト受動不定詞の受動態を保つ。『後に』は原文に明示されないため補わない。
- source_word: ἐν Ἀθήναις
  choice: アテネに
  rationale: 場所を表す標準的で自然な訳。
- source_word: μόνοι
  choice: 自分たちだけで
  rationale: 複数形を明確に保ち、同行者なしに残る意味を自然に表す。
theological_decisions:
- issue: 一人称複数の指示対象と周辺文脈との単数・複数の緊張
  choice: 「私たちは」「自分たちだけで」と複数形を維持する。
  alternative: 書簡上の複数と解して「私は一人で」とする。
  rationale: 原文のεὐδοκήσαμενとμόνοιはいずれも複数形である。歴史的再構成によって単数に調和させず、原文の文法と解釈上の余地を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。3:2へ続くギリシア語の構文を反映して読点で結び、受動態と一人称複数を保持した。
