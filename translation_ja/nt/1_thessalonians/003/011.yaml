source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: ja
  text: どうか、私たちの神であり父である方ご自身[a]と、私たちの主イエスが、私たちがあなたがたのもとへ行く道を整えて[b]くださいますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシャ語では、「道を整えてくださいますように」に当たる動詞が単数形でありながら、「私たちの神であり父である方」と「私たちの主イエス」が並列の主語になっている。
    reason: cross_reference
  - marker: b
    text: 直訳すると、「あなたがたのもとへ向かう私たちの道をまっすぐにしてくださいますように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: ご自身
  rationale: 強意用法を自然な敬語表現で示し、神であり父である方そのものに願いが向けられている強調を保った。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは強い逆接ではなく祈願への緩やかな移行を示すため、日本語で不自然な接続語を加えず、文脈に委ねた。
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: 私たちの神であり父である方
  rationale: θεόςとπατήρが一人の方を指す構造を明確にしつつ、現代日本語として自然で尊厳ある表現とした。
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: 私たちの主イエス
  rationale: 所有表現を保持し、κύριοςを「主」、Ἰησοῦςを「イエス」とする標準的な訳語を用いた。
- source_word: κατευθύναι
  choice: 道を開いてくださいますように
  rationale: アオリスト希求法の祈願を「どうか…くださいますように」で表した。動詞は道をまっすぐにする、進路を整える意を持ち、この文脈では訪問を可能にする「道を開く」が自然である。
- source_word: τὴν ὁδὸν ἡμῶν
  choice: 行く道
  rationale: 実際の旅路と、訪問を実現するための進路の双方を含められる表現とした。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのもとへ
  rationale: テサロニケの信徒たちに向かう方向を、自然な日本語で明示した。
theological_decisions:
- issue: 「私たちの神であり父である方」と「私たちの主イエス」という並列主語に単数動詞が用いられていること
  choice: 両者を明瞭に並べ、一つの祈願の主語として訳した。
  alternative: 動詞を補って二つの別個の祈願にする、または神だけを主たる主語として訳す。
  rationale: ギリシャ語は御父と主イエスを並列し、単数形の希求法動詞を用いる。この注目すべき文法的・神学的緊張を、説明的な教理を本文へ加えずに保持した。
translation_notes:
  register: 明瞭な現代標準日本語。祈願にふさわしい尊敬表現と品位を保ちつつ、過度に文語的な語法は避けた。δεは日本語で明示せず、祈願への移行を文型で示した。
