- from: 私たちは、あなたがたのことで、どのような感謝を神にお返しできるでしょうか。[a] 私たちの神の前で、あなたがたのゆえに喜んでいる、そのすべての喜びに対して。
  to: 私たちは、あなたがたのことで、あなたがたのゆえに私たちの神の前で味わっている、あらゆる喜びについて、どれほどの感謝を神にお返しできるでしょうか。
  rationale: 文を一文に統合して、喜び（ἐπὶ πάσῃ τῇ χαρᾷ）が神に返す感謝の根拠・契機であることを明示しました。「どれほどの感謝」により、τίνα εὐχαριστίανの修辞的な不十分さの含意を自然に表しました。「お返しする」は原文のἀνταποδοῦναιの比喩を保持し、脚注で自然な意訳の選択肢を示しています。
