  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: ja
  text: 私たちは、あなたがたのことで、あなたがたのゆえに私たちの神の前で味わっている、あらゆる喜びについて、どれほどの感謝を神にお返しできるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: どのような感謝を
  rationale: 疑問詞が「感謝」を修飾する形を保ち、神への感謝を十分に表しきれないという修辞疑問の力を伝える。
- source_word: δυνάμεθα … ἀνταποδοῦναι
  choice: お返しできるでしょうか
  rationale: ἀνταποδίδωμιの「返礼として返す」という比喩を残しつつ、現代日本語として自然な修辞疑問にした。神との取引を意味するのではなく、受けた喜びに見合う感謝を返しきれないことを示す。
- source_word: περὶ ὑμῶν
  choice: あなたがたのことで
  rationale: 属格を伴うπερίの「～に関して」を自然に表し、後のδι’ ὑμᾶςとの違いも保った。
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: そのすべての喜びに対して
  rationale: 感謝の根拠・機会を表すἐπίを「～に対して」と訳し、πάσῃの包括性を明示した。
- source_word: ᾗ χαίρομεν
  choice: 喜んでいる、その
  rationale: χαράとχαίρωの同語根による反復を「喜び／喜んでいる」で保った。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのゆえに
  rationale: 対格を伴うδιάの原因を明確に表し、περὶ ὑμῶνと区別した。
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: 私たちの神の前で
  rationale: 神の臨在を表す空間的比喩を簡潔に保持した。
theological_decisions:
- issue: 神に感謝を「返す」という表現の修辞的意味
  choice: 「感謝を神にお返しできるでしょうか」とし、原文の返礼の比喩を保持する。
  alternative: 「どうすれば神に十分感謝できるでしょうか」と意訳する。
  rationale: ἀνταποδοῦναιは返す・報いるという意味を明示するが、修辞疑問であるため、神への文字どおりの債務返済ではなく、感謝の不十分さを強調している。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「喜び／喜んでいる」という原文の反復と、「感謝を返す」という比喩を残した。修辞疑問としての品位を保つため、「いったい」などの補足的強調は加えていない。
