  to: そのため、私もこれ以上耐えられなくなり、あなたがたの信仰[a]がどうなっているかを知るために人を遣わしました。誘惑する者があなたがたを誘惑してしまい、私たちの労苦が無駄[b]になってしまうのではないかと案じたからです。
