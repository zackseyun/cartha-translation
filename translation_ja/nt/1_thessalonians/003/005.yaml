id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: ja
  text: そのため、私もこれ以上耐えられなくなり、あなたがたの信仰[a]がどうなっているかを知るために人を遣わしました。誘惑する者があなたがたを誘惑してしまい、私たちの労苦が無駄[b]になってしまうのではないかと案じたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さ」または「信頼」とも訳せる。ギリシア語は文脈により、これらの重なり合う意味を持ちうる。
    reason: alternative_reading
  - marker: b
    text: 直訳的には「空しく」。すなわち「何の成果もなく」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: そのため
  rationale: 直前の説明を受ける因果的なつながりを、自然な現代日本語で示す。
- source_word: κἀγὼ
  choice: 私も
  rationale: καίの付加的な意味を明示し、パウロ自身の反応であることを保つ。
- source_word: μηκέτι στέγων
  choice: もはや耐えきれなくなって
  rationale: 耐え続けることが限界に達したという分詞表現の意味を自然に表す。
- source_word: ἔπεμψα
  choice: 遣わしました
  rationale: 目的語は本文では明示されていないため、文脈上のテモテをここで補わず、動詞だけで訳す。
- source_word: εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν
  choice: あなたがたの信仰がどうなっているかを知るために
  rationale: 目的を示す構文を保ちつつ、単に情報として信仰を知るのではなく、その状態を確かめようとした文脈を自然に表す。
- source_word: μή πως
  choice: のではないかと心配した
  rationale: 望ましくない事態を案じる含意を、日本語の懸念表現で明確にする。
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: 誘惑する者があなたがたを誘惑し
  rationale: 同根語による「誘惑する者／誘惑する」の反復を保持する。文脈上の悪への誘いを踏まえ、「試す」ではなく「誘惑する」とする。
- source_word: εἰς κενὸν γένηται ὁ κόπος ἡμῶν
  choice: 私たちの労苦が無駄になってしまう
  rationale: κόποςの骨折りを「労苦」で、εἰς κενόνの成果を失う意味を自然な日本語の「無駄になる」で表す。
theological_decisions:
- issue: πίστιςが表す意味の幅
  choice: 信仰
  alternative: 信実、信頼
  rationale: この文脈では、福音に応答して持ち続ける信仰を指すのが最も自然である。ただし語自体が持ちうる「信実」「信頼」の含みは脚注に残し、一義的に限定しない。
- issue: ὁ πειράζωνの指示対象
  choice: 誘惑する者
  alternative: サタン
  rationale: 文脈上サタンを指すと考えられるが、ギリシア語本文は固有名ではなく描写的な呼称を用いるため、その表現を保持する。
- issue: 誘惑と労苦が無駄になることの時間的関係
  choice: 誘惑し、私たちの労苦が無駄になってしまうのではないか
  alternative: 誘惑してしまい、私たちの労苦がすでに無駄になったのではないか
  rationale: ἐπείρασενの過去的な形と、γένηταιによる懸念・可能性を区別し、誘惑が起きた可能性と、その結果として労苦が無駄になる恐れを表す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の同根語反復は「誘惑する者が……誘惑し」として残した。直前の文脈に示される派遣対象を本文には補わず、原文どおり目的語を省略した。
