source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: ja
  text: 私たちは、メシア[b]の使徒として重みのある者となることもできましたが[a]、むしろ、あなたがたの間で優しい者となりました[c]。乳を飲ませる母親が自分の子どもたちを優しくいたわるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「重みのある者となる」。使徒として権威を主張する、要求を課す、または負担となる、という意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「メシア」の伝統的な訳は「キリスト」。
    reason: alternative_reading
  - marker: c
    text: 一部の写本は「優しい者」の代わりに「幼子のような者」と読む。
    reason: textual_variant
lexical_decisions:
- source_word: δυνάμενοι
  choice: こともできましたが
  rationale: ἀλλάとの対比を踏まえ、分詞の譲歩的な働きを自然な現代日本語で表した。
- source_word: ἐν βάρει εἶναι
  choice: 重みのある者となる
  rationale: 直訳的な「重みにおいてある」という比喩を生かし、使徒として権威を行使すること、要求を課すこと、負担となることのいずれかに限定しない表現とした。
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: メシアの使徒として
  rationale: Χριστόςをここでは称号として捉え、「メシア」とした。属格は自然に「メシアの」と訳した。
- source_word: ἀλλὰ ἐγενήθημεν ἤπιοι
  choice: むしろ、…優しい者となりました
  rationale: γίνομαιの「～となる」という動きを残しつつ、ἤπιοιの穏やかで優しい態度を表した。
- source_word: ἐν μέσῳ ὑμῶν
  choice: あなたがたの間で
  rationale: 空間的・関係的な意味を保つ自然な訳。
- source_word: ὡς ἐὰν τροφὸς
  choice: 乳を飲ませる母親が…ように
  rationale: τροφόςは乳を与えて養育する女性を指し得る。後続の「自分の子どもたち」と合せ、母性的な養育の情景を明瞭にした。
- source_word: θάλπῃ
  choice: 優しくいたわる
  rationale: 本来の「温める」から派生した、愛情をもって養い世話する意味を自然な日本語で表した。
- source_word: τὰ ἑαυτῆς τέκνα
  choice: 自分の子どもたち
  rationale: ἑαυτῆςの強調を「自分の」で示し、τέκναを普通の現代語で訳した。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: この句では固有名のような用法よりも称号としての性格が明瞭であるため「メシア」とした。教会で伝統的な「キリスト」は脚注に示した。
- issue: ἐν βάρει εἶναιが示す使徒的立場
  choice: 重みのある者となる
  alternative: 権威を主張する／要求を課す／負担となる
  rationale: 使徒の権威、要求、物質的負担のどれか一つに意味を狭めず、原文の比喩と神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半では原文の「重み」という比喩と解釈上の幅を保持し、後半では授乳しながら自分の子を慈しむ母性的な情景を、臨床的に響きやすい「看護師」ではなく日常的な表現で示した。
