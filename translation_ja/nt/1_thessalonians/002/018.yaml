  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: ja
  text: というのも、私たちはあなたがたのところへ行きたいと願っていたからです。私パウロ自身は、一度ならず二度までも[a]そう願いました。しかし、サタンが私たちを妨げました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一度と二度」。一度以上、幾度もという意味の言い回し。
    reason: 原文の慣用表現の字義的な形と、その文脈上の意味を正確に示すため。
lexical_decisions:
- source_word: διότι
  choice: というのも……からです
  rationale: 直前の内容に理由を添える説明的な接続を、現代日本語で自然に表した。
- source_word: ἠθελήσαμεν
  choice: 行きたいと願っていた
  rationale: θέλωの意志・願望を保ち、「行こうとした」のように実際の試行まで含意しない表現とした。
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: あなたがたのところへ行く
  rationale: テサロニケの人々へ向かう移動をそのまま表し、「訪ねる」「戻る」などの文脈的補足は本文に加えなかった。
- source_word: ἐγὼ μὲν Παῦλος
  choice: 実際、私パウロは
  rationale: 複数形の「私たち」の中からパウロ自身を特に取り出す強調を、自然な日本語で示した。
- source_word: καὶ ἅπαξ καὶ δίς
  choice: 一度ならず二度までも
  rationale: 字義的な「一度も二度も」と、複数回そうしたという慣用的意味の双方が伝わる表現を選んだ。
- source_word: ἐνέκοψεν
  choice: 妨げました
  rationale: 進行を阻害する意味を保ち、完全かつ永久に不可能にしたとまでは言い切らない訳語とした。
- source_word: ὁ Σατανᾶς
  choice: サタン
  rationale: 新約聖書で人格的に言及される固有名・称号として定着した表記を用いた。
theological_decisions:
- issue: パウロたちの旅を妨げた主体としてのサタン
  choice: サタンが私たちを妨げました
  alternative: 敵対者が私たちを阻みました
  rationale: 本文がサタンに明確な主体性を帰していることを保ちつつ、ἐνέκοψενを絶対的・最終的な阻止と強めずに訳した。
translation_notes:
  register: 明快で品位ある現代標準日本語。原文の一文を日本語では三文に分け、複数の「私たち」から「私パウロ」へ焦点が移る構造と、願望と妨害の対照を読み取りやすくした。
