id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: ja
  text: 兄弟たち[a]、あなたがたは、ユダヤにあってメシアであるイエスに属する神の諸教会に倣う者となりました。あなたがたも、自分たちの同胞から、彼らがユダヤ人[c]から受けたのと同じ苦しみを受けたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ここでは男女を含む信徒の共同体全体への呼びかけです。
    reason: inclusive_scope
  - marker: c
    text: 「ユダヤの人々」とも訳せます。ギリシア語は、民族・宗教上の「ユダヤ人」と地域上の「ユダヤの人々」のどちらをも指し得ます。ここで指されるのは、ユダヤの諸教会に苦しみを加えた人々であり、すべてのユダヤ人を意味するとは限りません。
    reason: lexical_and_scope_clarification
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: 倣う者となりました
  rationale: 名詞 μιμηταί の「模倣する者」と、ἐγενήθητε の「〜となった」の双方を保ちつつ、現代日本語として自然にした。単なる「従う者」より明示的な比較を伝える。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを直接に訳した。文脈上は会衆全体への呼びかけであるため、その含意を脚注で明示した。
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: 神の諸教会
  rationale: 複数形を「諸教会」で示し、パウロ書簡における ἐκκλησία の標準的な教会的用法を保った。
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: ユダヤにある
  rationale: 諸教会の所在地を限定する分詞句を、簡潔で自然な連体表現にした。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにあって
  rationale: Χριστός の称号としての意味を「メシア」で明示し、ἐν のパウロ的な結合・帰属の表現は「にあって」で保った。
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: 同じ苦しみを受けた
  rationale: 直訳的な「同じことを苦しんだ」ではなく、πάσχω の苦難の意味と比較関係を明瞭な日本語で表した。
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: 自分たちの同胞
  rationale: ἰδίων の「自分たち自身の」と συμφυλετῶν の同一民族・共同体に属する者という意味を、性別を限定しない自然な語で表した。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人たち
  rationale: 通常の民族・宗教的呼称を採用したが、文脈上、すべてのユダヤ人を一括して指すとは限らない。地理的な「ユダヤの人々」の可能性は脚注に残した。
theological_decisions:
- issue: Χριστῷ を称号として訳すか、慣用的な名称として音写するか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστός の「油を注がれた者／メシア」という称号の意味を本文で可視化した。日本語で定着した「キリスト・イエス」も脚注に示し、同一の称号であることを明らかにした。
- issue: τῶν Ἰουδαίων の指示範囲
  choice: ユダヤ人たち
  alternative: ユダヤの人々
  rationale: 本文では通常の語義を採ったが、この節が非難しているのはユダヤ人全体ではなく、ユダヤの諸教会に苦しみを加えた具体的な人々である。語の地域的意味の可能性も脚注で保持した。
- issue: ἀδελφοί の会衆内での包摂性
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原文の男性複数形を本文に保ちつつ、この呼びかけが通常は男女を含む会衆全体に向けられていることを脚注で補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「にあって」はパウロ書簡の神学的な結合・帰属を保つために用いた。「諸教会」は複数性を簡潔に示す。反ユダヤ的な一般化を避けつつ、原文の曖昧さは脚注に残した。
