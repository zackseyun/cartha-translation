  to: 兄弟たち[a]、あなたがたは、ユダヤにあってメシアであるイエスに属する神の諸教会に倣う者となりました。あなたがたも、自分たちの同胞から、彼らがユダヤ人[c]から受けたのと同じ苦しみを受けたからです。
  rationale: ἐν Χριστῷ Ἰησοῦがユダヤの諸教会に係ることを、日本語で明確にしました。「に属する」はこの文脈の「キリストにあって」という帰属・結合の意味を自然に表します。また、「ユダヤ人たち」を通常の集合的表現である「ユダヤ人」に整えました。本文中に脚注bのアンカーがなかった構造上の不整合も、「メシアであるイエス[b]」として解消しています。
