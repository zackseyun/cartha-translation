  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: ja
  text: このように、あなたがたを深く慕っていた私たちは、神の福音だけでなく、自分たちのいのちまでも、あなたがたに分かち合うことを喜んで願っていました。あなたがたが私たちの愛する者となったからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: このように
  rationale: 直前の乳母または母親のような世話のあり方を受け、そのような態度で行動したことを示す副詞として訳した。
- source_word: ὁμειρόμενοι ὑμῶν
  choice: あなたがたを深く慕っていた
  rationale: まれな分詞が表す強い愛情と切なる思いを、自然な現代日本語で示した。分詞の因果関係を断定せず、原文の構文的な余地を保った。
- source_word: εὐδοκοῦμεν
  choice: 心から願いました
  rationale: 単なる同意ではなく、自ら喜んでそうする意志を表す。日本語では「分かち合いたいと心から願いました」として積極的な意欲を自然に伝えた。
- source_word: μεταδοῦναι
  choice: 分かち合いたい
  rationale: 自分の持つものを相手に与え、ともに共有させる意味を、二つの目的語の双方に適合する語で表した。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 神の福音
  rationale: パウロ書簡で確立した用語「福音」を用い、属格も簡潔に保持した。
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: 自分たちのいのちまでも
  rationale: ここでの ψυχή は非物質的な魂だけを指すのではなく、生きる自分自身を差し出す献身を表す。「自分たち」と「までも」によって再帰代名詞と強調を反映した。
- source_word: διότι
  choice: からです
  rationale: 彼らが福音だけでなく自らをも分かち合おうとした理由を明示する接続として訳した。
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: あなたがたが私たちの愛する者となった
  rationale: 「愛される者／大切な者」という関係的な温かさと、γίνομαι が示す「そうなった」という結果状態を保った。
theological_decisions:
- issue: ψυχάς がここで指すもの
  choice: 「いのち」と訳す
  alternative: 「魂」または「自分自身」
  rationale: 文脈は人間を身体と魂に区分する教説ではなく、使徒たちの人格的・犠牲的な自己献身を述べているため。「いのち」は具体性を保ちつつ、狭い二元論的理解を避ける。
- issue: ὁμειρόμενοι の分詞と主動詞の関係
  choice: 「深く慕っていた私たちは」と訳し、明示的な因果接続を加えない
  alternative: 「あなたがたを慕っていたので」
  rationale: 愛慕が行動の動機であることは文脈上自然だが、分詞自体が因果だけを明示するとは限らないため、原文の含みを残した。
- issue: ἀγαπητοί の対人的な意味
  choice: 「私たちの愛する者」
  alternative: 「私たちに愛されている者」または「私たちにとって大切な者」
  rationale: 神学的な称号として狭く解さず、パウロたちと読者との間に生じた深い愛情を関係的に表した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「福音」は一般的な聖書用語として保持し、感情の強さは「深く慕う」「心から願う」で表現した。原文の温かい牧会的語調を保ちつつ、分詞を因果に限定しなかった。
