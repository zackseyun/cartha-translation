lexical_decisions:
- source_word: παράκλησις
  choice: 勧め
  rationale: 文脈では、聞き手に向けた真剣な訴えや勧告を指す。「慰め」に限定せず、宣教に伴う促しを自然な現代日本語で表す。
- source_word: πλάνης
  choice: 誤り
  rationale: ἐκとともに勧めの源を示し、誤った考えや偽りを表す。意図的な策略を示すδόλοςと区別するため、「欺き」ではなく「誤り」とした。
- source_word: ἀκαθαρσίας
  choice: 汚れた動機
  rationale: ここでは宣教の由来や性質が論じられているため、単に儀礼的不浄と受け取られにくい表現とした。ただし、語そのものは性的な不品行を含み得る広い道徳的汚れを表す。
- source_word: δόλῳ
  choice: 欺きをもって
  rationale: ἐνの様態的な働きを保ち、意図的な策略やごまかしを用いる仕方を表した。
- source_word: ἐκ ... ἐξ ... ἐν
  choice: から出たものでも……から出たものでもなく、……をもって行ったものでも
  rationale: ἐκ/ἐξによる源と、ἐνによる方法・様態の違いを日本語で明示した。
- source_word: γὰρ
  choice: 実に
  rationale: 前節を受けて説明を加える接続の働きを示す。「というのは」より簡潔で、この独立した一節でも自然に読める。
theological_decisions:
- issue: ἀκαθαρσίαの範囲
  choice: 本文では「汚れた動機」とし、特定の性的 misconduct に限定しない
  alternative: 「不品行」「性的な汚れ」「汚れ」
  rationale: この語は性的含意を持ち得るが、本文自体はその種類を特定していない。宣教をめぐる三重の否定という文脈を保ち、狭い告発内容を持ち込まない。
- issue: πλάνηとδόλοςの区別
  choice: 前者を「誤り」、後者を「欺き」とする
  alternative: 両者をともに「欺き／偽り」とする
  rationale: 誤った内容・迷いと、意図的な策略との語義上の緊張を保ち、同義に平板化しない。
