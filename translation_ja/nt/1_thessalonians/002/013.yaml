reference: 1 Thessalonians 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: ja
  text: このため、私たちも絶えず神に感謝しています。あなたがたは、私たちから聞いた神のことば[a]を受けたとき、それを人間のことばとしてではなく、事実そのとおり、神のことばとして[b]受け入れたからです。そのことばはまた、信じているあなたがたのうちで働いています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「私たちから聞いた、神からのことば」。ギリシア語の表現は圧縮されており、語の関係を複数の仕方で自然にほどくことができます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「人間のことばとしてではなく、実際そのとおり、神のことばとして」。
    reason: lexical_alternative
  - marker: c
    text: 「そのことばは」に当たる関係代名詞を神に結びつけ、「その方も、信じているあなたがたのうちで働いておられます」と理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の文脈との因果的なつながりを簡潔に保つ、自然な現代日本語。
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: 私たちも絶えず神に感謝しています
  rationale: 現在形の継続性とἀδιαλείπτωςの反復・持続の意味を、明瞭で自然な表現にした。
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: 私たちから聞いた神のことば
  rationale: 圧縮された属格構文を日本語として自然にほどき、使徒たちを通して聞いたものが神のことばであるという後続の対比を保った。構文上の別のほどき方は脚注に示した。
- source_word: παραλαβόντες ... ἐδέξασθε
  choice: 受けたとき…受け入れた
  rationale: παραλαμβάνωを伝えられたものを受領すること、δέχομαιをそれを肯定的に受容することとして訳し分けた。
- source_word: οὐ λόγον ἀνθρώπων
  choice: 人間のことばとしてではなく
  rationale: ἀνθρώπωνの一般的・質的な意味を性別に限定せず表し、「神のことば」との修辞的対比を維持した。
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: 真にそうであるとおり、神のことばとして
  rationale: 挿入的な断言の力を保ちつつ、日本語で比較の構文が明確になるよう「として」を補った。
- source_word: ὃς καὶ ἐνεργεῖται
  choice: そのことばは…今も働いています
  rationale: 最も自然な先行詞をλόγοςとし、καίと現在形による継続的な働きを「今も」で表した。受動・中動の細かな限定は加えなかった。
- source_word: ἐν ὑμῖν τοῖς πιστεύουσιν
  choice: 信じているあなたがたのうちで
  rationale: 現在分詞の継続的・特徴的な意味を自然な連体節で表し、ἐνを「うちで」とした。
theological_decisions:
- issue: 関係代名詞ὃςの先行詞
  choice: 「神のことば」を受け、「そのことばは…働いています」と訳す。
  alternative: 「神」を受け、「その方は…働いておられます」と理解する。
  rationale: ὃςはλόγοςと性・数が一致し、直前のλόγον θεοῦという句の中心語もλόγονであるため、「ことば」が最も自然な先行詞である。ただしθεόςも男性単数で意味上可能なので、脚注で別解を残した。
- issue: 使徒的宣教におけるλόγος θεοῦ
  choice: 「神のことば」と直訳的に表す。
  alternative: 「神からの知らせ」「神のメッセージ」と訳す。
  rationale: 本文は人間のことばと神のことばを明示的に対比しているため、その語彙的・神学的重みを保った。ただし、この一節が述べる範囲を越えた霊感論は付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ことば」は人間のことば／神のことばの反復と対比が見えるよう統一した。原文の長い一文は、日本語の理解しやすさのため二文に分けたが、感謝の理由を示す論理関係は「からです」で保持した。すべての脚注記号を本文に配置した。
