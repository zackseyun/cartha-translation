source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: ja
  text: しかし、兄弟たち[b]、私たちはほんのしばらくの間、あなたがたから引き離されました[a]。顔を合わせられないという点ではそうでしたが、心まで離れていたのではありません。それだけに、あなたがたの顔を見たいと強く切望して、いっそう熱心に努めました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近く言えば「あなたがたから孤児にされた」。ギリシア語は、近親者を失った者のような痛ましい別離を表す強い語を用いている。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は原文の呼びかけ。ここでは女性を含む信仰共同体全体に呼びかけていると考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: しかし、私たちは
  rationale: δέの穏やかな対比と、明示された主語Ἡμεῖςの強調を、自然な現代日本語で表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を保った。パウロの用法では共同体全体を指す可能性が高いため、その点は脚注で明示した。
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: あなたがたから引き離されていました
  rationale: ἀπορφανίζωが持つ、身内を失って取り残されるような痛ましい別離の含意を、「離される」より強い「引き離される」で表した。孤児・遺された者の比喩は脚注に残した。
- source_word: πρὸς καιρὸν ὥρας
  choice: ほんのしばらく
  rationale: 字義どおりの一時間ではなく、ごく短い期間を表す慣用句として訳した。
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: 離れていたのは顔だけで、心ではありません
  rationale: 身体的な不在と内面的な結びつきの対照を保ち、πρόσωπονの「顔」を後半にも響かせた。
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: いっそう懸命に努めました
  rationale: περισσοτέρωςの比較的強調と、σπουδάζωにある熱意および努力の両面を表した。
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: あなたがたの顔を見る
  rationale: 単に「会う」とせず、原文の「顔」を残して、再会を願う個人的で身体的な表現を保った。
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: 強く切望し
  rationale: ἐπιθυμίαはここでは否定的な欲望ではなく、再会を願う強い思いを指すため、「切望」とした。
theological_decisions:
- issue: ἀδελφοίの性別を伴う呼びかけ
  choice: 兄弟たち
  alternative: 兄弟姉妹の皆さん／信者の皆さん
  rationale: 原文の男性複数形を本文に保ちつつ、この呼びかけが女性を含む信仰共同体全体に及ぶ可能性を脚注で説明し、語形と文脈上の範囲を区別した。
- issue: προσώπῳ οὐ καρδίᾳが示す結びつき
  choice: 離れていたのは顔だけで、心ではありません
  alternative: 姿は見えなくても、心は離れていませんでした
  rationale: 「心」を感情的・霊的な結びつきとして保ちつつ、それ以上の教理的意味を付加せず、原文の簡潔な対照を維持した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文の「顔―心―顔」という反復と対照を見える形で残しつつ、長いギリシア語文を読みやすく三文に分けた。「切望」「懸命に努める」により、感情の強さと実際の努力の両方を示した。
