  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: ja
  text: 兄弟たち、実際、あなたがた自身が知っているとおり、私たちがあなたがたのもとへ行ったことは、無駄ではありませんでした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、この男性形は信仰共同体全体への呼びかけとして用いられることが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: あなたがた自身
  rationale: 強意用法を反映し、テサロニケの信徒自身の直接的な認識を強調する。
- source_word: γὰρ
  choice: 文脈上「とおり」に含意
  rationale: 前節を根拠づける接続である。日本語では独立した「というのは」よりも、「知っているとおり」という自然な構文で論証のつながりを示した。
- source_word: οἴδατε
  choice: 知っている
  rationale: 形は完了形だが現在の認識を表すため、現代日本語の「知っている」とした。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を保つ。同時に会衆全体を指し得ることを脚注で明示する。
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: 私たちがあなたがたのもとへ行ったこと
  rationale: 直訳的な「入って行ったこと」より自然であり、宣教者たちが彼らのもとに到来した出来事を明確に表す。
- source_word: ὅτι
  choice: とおり
  rationale: 知っている内容を導くὅτιを、日本語では「～ことは、知っているとおり」という語順に組み替えて表した。
- source_word: οὐ κενὴ γέγονεν
  choice: 無駄にはなりませんでした
  rationale: κενόςの「空虚な、成果のない、無駄な」という幅を踏まえ、完了形が示す結果的状態も「なりませんでした」で自然に表した。
theological_decisions:
- issue: 混合された信仰共同体へのἀδελφοίという呼びかけ
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 本文では原文の男性形を保持する一方、パウロ書簡では女性を含む信仰共同体全体への呼称となり得ることを脚注に示し、指示対象の広さを失わないようにした。
- issue: οὐ κενὴの意味合い
  choice: 無駄にはなりませんでした
  alternative: 実りのないものではありませんでした
  rationale: 具体的な成果だけに意味を限定せず、「空虚でない、無意味でない、成果を欠かない」という原語の評価的な幅を比較的よく保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。原文の強調は「あなたがた自身」で保持し、ギリシア語の語順は自然な日本語に整えた。
