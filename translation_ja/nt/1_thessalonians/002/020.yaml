  text: For you are our glory and joy[a].
translation:
  language: ja
  text: というのも、あなたがたこそ、私たちの栄光[a]であり、喜びだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「栄光」は「誇り」または「誉れ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがたこそ
  rationale: 明示された二人称複数代名詞の強調を、現代日本語で自然な係助詞「こそ」によって表した。
- source_word: γάρ
  choice: なのです
  rationale: 前節に対する理由・説明の関係を、独立した一節として自然な説明調の文末で示した。
- source_word: ἐστε
  choice: なのです
  rationale: 現在時制の連結動詞を、名詞述語に適した丁寧で断定的な形で表した。
- source_word: ἡ δόξα ἡμῶν
  choice: 私たちの栄光
  rationale: 属格の所有関係をそのまま保ち、δόξαの主要な語義と聖書的な響きを「栄光」で保持した。
- source_word: καὶ ἡ χαρά
  choice: また喜び
  rationale: 二つの並列された述語名詞を明確にし、χαράを活動ではなく心の状態・その源を指す「喜び」とした。
theological_decisions:
- issue: 対人関係を述べる箇所でのδόξαの訳語
  choice: 栄光
  alternative: 誇り、誉れ
  rationale: テサロニケの信徒たちが宣教者たちにとって誉れと喜びであるという意味を保ちつつ、δόξαの広い意味領域と修辞的な重みを保持する。「誇り」に限定して自己満足の含意を強めないため、別訳を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語としつつ、使徒の強い愛情と荘重さを保った。「あなたがたこそ」でὑμεῖςの明示的強調を再現し、「なのです」でγάρの説明的なつながりを自然に示した。
