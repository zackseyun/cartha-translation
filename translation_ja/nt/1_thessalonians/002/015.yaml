  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: ja
  text: その人たちは[c]、主イエスも預言者たちも殺し[a]、私たちを追い出しました[b]。また、神を喜ばせず、すべての人に敵対しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死に至らせた」。この動詞自体は、殺害の動機や法的性格までは明示していない。
    reason: lexical_alternative
  - marker: b
    text: 「追い出す、追放する」という意味。より広い意味の「迫害する」よりも具体的な表現である。
    reason: lexical_alternative
  - marker: c
    text: 「その人たち」とは、文法上、前の節で言及された集団を指す。この表現を、あらゆる時代と場所のすべてのユダヤ人についての一括した記述と読むべきではない。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: 殺し
  rationale: 「殺す、死に至らせる」を意味するアオリスト能動分詞。動機や法的評価を付け加えず、現代日本語で直接的かつ自然に表した。
- source_word: κύριον Ἰησοῦν
  choice: 主イエス
  rationale: κύριοςをキリスト論的称号として「主」とし、人名Ἰησοῦςは日本語の標準的表記「イエス」とした。
- source_word: τοὺς προφήτας
  choice: 預言者たち
  rationale: 定冠詞を伴い、神の預言者として知られる一連の人々を指す。日本語では文脈上明らかなため、定冠詞を別語で補わない。
- source_word: ἐκδιωξάντων
  choice: 追い出しました
  rationale: 一般的な「迫害する」より具体的な、「外へ追いやる、追放する」という動詞の意味を保った。
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: 神を喜ばせず
  rationale: ἀρέσκωと与格θεῷの関係を自然な日本語で表し、現在分詞の継続的・描写的な力を保った。
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: すべての人に敵対しています
  rationale: ἐναντίοςの「反対する、敵対する」という意味を明確で自然な現代日本語にした。
- source_word: τῶν … ἀποκτεινάντων … ἐκδιωξάντων … ἀρεσκόντων … ἐναντίων
  choice: その人たちは…殺し…追い出しました。また…喜ばせず…敵対しています
  rationale: 属格複数の冠詞と分詞の連鎖が前節の指示対象を引き続き描写していることを、「その人たちは」で受けた。日本語の時制と可読性のため、過去の行為と現在的描写を二文に分けた。
- source_word: καὶ
  choice: も／また
  rationale: 反復されるκαίの累加的な力を、対象を結ぶ「も」と、後半の描写を加える「また」で自然に示した。
theological_decisions:
- issue: 分詞句が指す集団の範囲
  choice: 前節で言及された人々を「その人たちは」で受け、彼らについての描写として訳す
  alternative: あらゆる時代・場所のすべてのユダヤ人に対する一般的断罪として訳す
  rationale: ギリシア語の属格冠詞と分詞句は2章14節の先行詞に文法的に結び付いている。本文が述べる非難の緊張は保ちつつ、その範囲を本文以上に普遍化しない。
- issue: 「神を喜ばせず」の意味
  choice: 彼らのあり方・行為が神を喜ばせないという能動表現を保つ
  alternative: 「神に喜ばれず」として、神から受ける評価を前面に出す
  rationale: ἀρέσκωはここで与格θεῷを伴う能動形であり、「神を喜ばせる」の否定として表す方が統語に近い。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「その人たちは」で前節との統語的連続を示し、過去の二つの行為と現在的な二つの描写を読みやすく配置した。
