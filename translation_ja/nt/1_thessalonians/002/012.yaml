id: 1TH.2.12
reference: 1 Thessalonians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: ja
  text: あなたがたを励まし、慰め、強く勧めました。それは、ご自分の国と栄光へとあなたがたを招いておられる神にふさわしく歩む[a]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「歩む」とは、その人の生き方や日々の行いを表す聖書的な比喩です。「生きる」「生活する」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: 励まし
  rationale: 文脈は父親のような継続的な牧会的働きを描く。「励ます」は勧告の意味を含みつつ、家族的な調子を自然に伝える。
- source_word: παραμυθούμενοι
  choice: 慰め
  rationale: 励ましや慰めとなる言葉をかける意。先の語との重なりを保ちながら、そのいたわりのニュアンスを示す。
- source_word: μαρτυρόμενοι
  choice: 強く勧め
  rationale: ここでは単なる証言ではなく、厳粛に言い聞かせ、強く促す意味。「強く勧める」が日本語として明瞭である。
- source_word: εἰς τὸ περιπατεῖν
  choice: 歩むため
  rationale: εἰς＋冠詞付き不定詞の目的・結果の含みを「ため」で表し、περιπατεῖνの聖書的な生活比喩を保持する。
- source_word: ἀξίως τοῦ θεοῦ
  choice: 神にふさわしく
  rationale: ἀξίως＋属格を自然な日本語で表し、神との関係においてふさわしい生き方という原文の構造を保つ。
- source_word: τοῦ καλοῦντος
  choice: 招いておられる
  rationale: 現在分詞の継続的な相を自然な敬語表現で保持する。「招く」は国と栄光への参与を目指す呼びかけを明瞭に示す。
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: ご自分の国と栄光へと
  rationale: ἑαυτοῦの強意的・再帰的意味を「ご自分の」で保持し、一つの前置詞が支配する「国」と「栄光」を並列のまま訳す。
theological_decisions:
- issue: περιπατεῖνの比喩を保持するか、一般的な生活態度として説明的に訳すか
  choice: 本文で「歩む」を保持し、脚注で意味を説明する
  alternative: 生きる／生活する
  rationale: 原文の比喩と聖書内の倫理的表現とのつながりを保持しつつ、現代読者の理解のため脚注を付す。
- issue: τοῦ καλοῦντος ὑμᾶςにおける神の招きの時制・相
  choice: 「招いておられる」と現在の継続性を表す
  alternative: 招かれた／招く
  rationale: 現在分詞を反映しつつ、招きの時点や働き方に関する特定の教理を訳文へ持ち込まない。
- issue: 三つの分詞の関係
  choice: 「励まし、慰め、強く勧めました」と重なり合う三つの働きを並列する
  alternative: 勧め、励まし、証言しました
  rationale: 三語の区別を過度に固定せず、父親のような牧会的働きにおける励まし、慰め、厳粛な促しという重なりを保つ。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。三つの分詞は簡潔な並列とし、直前の文脈から続く完結文として「ました」を補った。「国」はβασιλείαの統治と領域の両義を不必要に限定しない表現である。
