source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: ja
  text: というのも、私たちの希望、喜び、また誇りの冠とは何でしょうか。私たちの主イエスが来られるとき、その御前で、あなたがたこそではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主イエスの臨在のとき」または「主イエスの到来のとき」。ギリシア語の「パルーシア」は「臨在」または「到来」を意味し得る。この文脈では、主イエスが将来来られることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: 何でしょうか
  rationale: 後に「希望」「喜び」「冠」という事柄を表す名詞が続くため、「だれ」ではなく「何」とした。その答えとして人々である「あなたがた」が示される修辞的な意外性は保持した。
- source_word: γὰρ
  choice: というのも
  rationale: 前の文を理由づけて説明する接続を、現代日本語で自然に示した。
- source_word: ἐλπίς
  choice: 希望
  rationale: 将来への確かな期待を表すパウロ書簡の標準的な語義に合う。
- source_word: χαρά
  choice: 喜び
  rationale: 感情的な力を保つ、直接的で自然な訳語である。
- source_word: στέφανος καυχήσεως
  choice: 誇りの冠
  rationale: στέφανοςの栄誉や勝利を示す冠の比喩と、καύχησιςの「誇り」を簡潔に保ち、「喜びの冠」などの解釈的な言い換えを避けた。
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: あなたがたではありませんか
  rationale: 肯定の答えを期待する強い修辞疑問として訳した。καίの強調は日本語の疑問表現全体で示し、不自然な「またあなたがたも」を避けた。
- source_word: ἔμπροσθεν
  choice: その御前にいる
  rationale: 主の面前に立つという関係を明確にしつつ、日本語として自然な形にした。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの新約聖書における標準的な訳語であり、イエスへの告白的な称号としても適切である。
- source_word: παρουσία
  choice: 来られるとき
  rationale: この文脈では主イエスの将来の到来を指すため、一般読者に明瞭な表現とした。一方、「臨在」「到来」という語義の幅は脚注に残した。
theological_decisions:
- issue: 終末論的文脈における παρουσία の訳し方
  choice: 来られるとき
  alternative: 臨在されるとき／到来されるとき
  rationale: 文脈上は主イエスの将来の到来を指すが、παρουσίαそのものには「臨在」「到来」の両面がある。本文では自然で明瞭な日本語を用い、語義上の幅を脚注で保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、修辞疑問と「誇りの冠」という比喩を保持した。「御前」は文体上の品位を保つ一般的な聖書語として用い、全体は過度に古風にならないよう整えた。
