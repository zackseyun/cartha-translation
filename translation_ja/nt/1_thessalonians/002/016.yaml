id: 1TH.2.16
reference: 1 Thessalonians 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: ja
  text: 異邦人が救われるように、私たちが彼らに語るのを妨げ、その結果、彼らはいつも自分たちの罪を満たすことになるのです。しかし、怒りがついに彼らの上に臨みました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ついに」と訳したギリシア語は、「完全に」「すっかり」「最後まで」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「怒り」は神の裁き・怒りを指すと考えられますが、それがすでに起きた歴史上の裁き、将来の最後の裁き、あるいはその両方を指すのかは、ここでは明示されていません。
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: 妨げています
  rationale: 現在分詞が前節から続く行為を描くため、継続的な阻止を自然な現代日本語で表した。法的な禁止に限定しない。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人に
  rationale: ここでは地政学的な「諸国民」ではなく、ユダヤ人以外の人々を指すパウロ的用法である。
- source_word: λαλῆσαι
  choice: 語るのを
  rationale: κωλυόντωνに従属する不定詞を直接的に訳した。語る内容は文脈に委ね、「福音を」などを補わない。
- source_word: ἵνα σωθῶσιν
  choice: 救われるように
  rationale: 受動態接続法による目的節を保ち、救いの主体や内容を狭く規定しない。
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: こうして……満たしている
  rationale: 結果ないし帰結として自然に読める形にし、彼らが意図的に罪を満たそうとしたとの含意を避けつつ、構文の幅を残した。
- source_word: ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας
  choice: 自分たちの罪を満たしている
  rationale: 原文には「量」「枡」などの名詞がないため、それを本文に補わず、「罪を満たす」という聖書的比喩を保持した。
- source_word: πάντοτε
  choice: いつも
  rationale: 持続的・反復的な傾向を示す副詞として簡潔に訳した。
- source_word: ἔφθασεν ἐπ’ αὐτούς
  choice: 彼らの上に臨みました
  rationale: 到来して彼らに及んだことを示す表現とし、「追いついた」など特定の語義に限定しない。
- source_word: ἡ ὀργή
  choice: 神の怒り
  rationale: 定冠詞付きの「怒り」は文脈上、神からの怒り・裁きを指すと考えられるため、日本語で指示対象が明確になるよう「神の」を補った。ただし裁きの具体的形態は規定しない。
- source_word: εἰς τέλος
  choice: ついに
  rationale: 到来の最終的な局面を表す自然な訳を本文に採ったが、「完全に」「最後まで」の可能性も注で示した。
theological_decisions:
- issue: 「怒り」の主体と、それが指す裁きの時期・形態
  choice: 「神の怒り」としつつ、現在の歴史的裁き、終末の裁き、またはその両方かは本文で限定しない
  alternative: 特定の歴史的事件、または最後の審判だけを指すと訳す
  rationale: 文脈上は神の怒りであることが強く示唆される一方、原文は具体的な出来事や時期を明示していないため、その緊張を注で保持した。
- issue: εἰς τὸ ἀναπληρῶσαι の目的・結果の関係
  choice: 「こうして」として帰結を前面に出す
  alternative: 「罪を満たすために」と目的として訳す
  rationale: ギリシア語構文は目的にも結果にもなり得るが、ここで目的とすると当事者の意図まで断定するおそれがある。自然な帰結表現で原文の論理を伝えた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい重みを保った。「異邦人」「救われる」「神の怒り」は一般読者にも理解可能な定着した聖書語彙として採用した。注記マーカーは、関連する最終文の直後に配置した。
