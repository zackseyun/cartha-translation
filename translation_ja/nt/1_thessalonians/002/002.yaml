reference: 1 Thessalonians 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: ja
  text: しかし、あなたがたも知っているとおり、私たちはフィリピで以前に苦しみ、辱めを受けましたが[a]、私たちの神にあって大胆に、大きな苦闘の中で[c]、神の福音をあなたがたに語りました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ひどい扱いを受けました」「侮辱されました」。原語には、横暴に扱われ、公に名誉を傷つけられるという意味が含まれます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私たちの神にあって大胆に語りました」。原語の動詞自体に、大胆に語るという意味が含まれ得ます。本文では、後に続く「語る」に対応させて「大胆に」と訳しました。
    reason: lexical_alternative
  - marker: c
    text: 別訳「激しい争いの中で」「激しい反対を受けながら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし／それでも
  rationale: 前節との強い対照を「しかし」で示し、フィリピでの苦難にもかかわらず語ったという譲歩的なつながりを「それでも」で自然に明示した。
- source_word: προπαθόντες
  choice: 先に……苦しみに遭い
  rationale: アオリスト分詞と προ- の要素が示す、主要動作に先立つ苦難を簡潔に表した。
- source_word: ὑβρισθέντες
  choice: 辱めを受けました
  rationale: 単なる侮辱の言葉だけでなく、横暴な扱いと不名誉を被ったことを含む動詞の意味を保った。
- source_word: καθὼς οἴδατε
  choice: あなたがたも知っているとおり
  rationale: 読者自身の既知の事実に訴える挿入句として、自然な現代日本語にした。
- source_word: ἐν Φιλίπποις
  choice: フィリピで
  rationale: 地名の標準的な日本語表記を用いた。
- source_word: ἐπαρρησιασάμεθα
  choice: 大胆になり
  rationale: 率直に、恐れず語るという意味を示しつつ、後続の λαλῆσαι「語る」と不自然に重複しないようにした。
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: 私たちの神にあって
  rationale: 神との関係・領域・根拠を表し得る ἐν の幅を残し、単に手段を示す「神によって」へ限定しなかった。
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: あなたがたに語りました
  rationale: 日常的な「語る」という動詞を保ち、その内容を「神の福音」が示す構造にした。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 神の福音
  rationale: パウロ書簡で定着した簡潔な表現であり、属格が表す起源・所属などの含みを限定しない。
- source_word: ἐν πολλῷ ἀγῶνι
  choice: 激しい争いの中で
  rationale: ἀγών の持つ闘争、苦闘、対立の意味幅を保ちながら、この文脈の強い反対や困難を自然に表した。
theological_decisions:
- issue: ἐν τῷ θεῷ ἡμῶν の意味合い
  choice: 「私たちの神にあって」とし、神との関係の中にある大胆さを表す
  alternative: 「私たちの神によって」または「私たちの神に信頼して」
  rationale: ギリシア語の ἐν は領域、根拠、手段などを含み得る。「によって」だけでは神を手段・動作主に限定し、「信頼して」では本文に明示されない心理状態を補うため、やや形式的でも原文の幅を残した。
- issue: τὸ εὐαγγέλιον τοῦ θεοῦ の属格
  choice: 「神の福音」として属格の関係を保持
  alternative: 「神からの福音」または「神についての福音」
  rationale: 属格は福音の源、所有、内容との関係を含み得るため、いずれか一つに狭めなかった。
translation_notes:
  register: 明瞭で品位ある現代標準語。「私たちの神にあって」は日常語よりやや格調があるが、原文の関係的・領域的な含みを保つため採用した。二文に分け、苦難と大胆な宣教の対照を読み取りやすくした。
