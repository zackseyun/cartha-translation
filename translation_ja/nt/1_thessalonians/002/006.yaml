  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: ja
  text: また、人からの栄誉[a]を求めることもありませんでした。あなたがたからも、ほかの人々からもです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「栄光」または「称賛」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: 求めることもありませんでした
  rationale: 現在分詞で、前後の文脈にある使徒たちの行動を説明する。日本語では文として自然につながるよう過去の否定表現としたが、「求める」という語で継続的な志向を保った。
- source_word: ἐξ ἀνθρώπων
  choice: 人からの
  rationale: ἄνθρωποιは男性に限定されず、人間一般を指すため、現代日本語の包括的で自然な表現とした。
- source_word: δόξαν
  choice: 栄誉
  rationale: ここでは人から与えられる評価・称賛を指す。「栄光」も基本的な対応語だが、日本語の「人からの栄光」は不自然で神的栄光とも取られやすいため、文脈上明確な「栄誉」を本文に採用した。
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: また…もありませんでした。…からも、…からもです
  rationale: 冒頭のοὔτεが前節から続く否定であることを「また…も」で示し、後二つの並列否定を反復する「からも」で保持した。
- source_word: ἀφ’ ὑμῶν
  choice: あなたがたからも
  rationale: テサロニケの信徒たちへの二人称複数の直接的な呼びかけをそのまま示した。
- source_word: ἀπ’ ἄλλων
  choice: ほかの人々からも
  rationale: テサロニケの信徒以外の人々を指すことが明瞭になる自然な日本語とした。
theological_decisions:
- issue: 求めていなかったδόξαの性質
  choice: 人から受ける栄誉
  alternative: 人から受ける栄光／称賛
  rationale: ἐξ ἀνθρώπωνにより、神の栄光ではなく人間からの評価を意味することが明確である。「栄誉」はこの対人的な意味を自然に表す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。前節から続く文法関係を「また」で示しつつ、この節単独でも理解できる形にした。
