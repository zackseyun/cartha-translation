  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: ja
  text: 私たちが信じているあなたがたに対して[b]、どのように敬虔に[a]、正しく、非難されるところなく振る舞ったかについては、あなたがたも神も証人です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖く」。このギリシア語は、神の前で敬虔に生きることを強調しています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「信じているあなたがたの間で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: あなたがたが証人であり、神も証人です
  rationale: 証人への厳粛な訴えとして、テサロニケの信徒を先に、次いで神を挙げる原文の重点を保った。日本語として明確にするため「です」を補った。
- source_word: ὡς
  choice: どれほど…か
  rationale: ここでは宣教者たちの振る舞いのあり方を導く語であり、三つの副詞が表す様態を自然な日本語で受ける。
- source_word: ὁσίως
  choice: 敬虔に
  rationale: 神の前における信仰深く聖なる振る舞いを表す。現代日本語で理解しやすく、神に向けられた含意も保つ。
- source_word: δικαίως
  choice: 正しく
  rationale: 道徳的に正しく、公正な振る舞いを示す。狭い法廷的意味に限定せず、平明な表現とした。
- source_word: ἀμέμπτως
  choice: 非難されるところなく
  rationale: 正当な非難を受ける余地のない振る舞いという意味を自然に表し、罪のない完全性という意味を過度に付加しない。
- source_word: ὑμῖν
  choice: あなたがたに対して
  rationale: 宣教者たちの行動が信徒との関係において示されたことを表す。「あなたがたの間で」も文脈上可能なので脚注に示した。
- source_word: τοῖς πιστεύουσιν
  choice: 信じているあなたがた
  rationale: 現在分詞の動詞的な力を保ちつつ、それがテサロニケの信徒を指すことを明確にした。
- source_word: ἐγενήθημεν
  choice: 私たちが…振る舞った
  rationale: 三つの様態副詞を伴う文脈では、単なる「なった」ではなく、彼らがどのように行動したかを指すため、自然な日本語で表した。
theological_decisions:
- issue: 使徒たちの行いを表す三つの倫理的副詞
  choice: 宣教者たちが実際に敬虔に、正しく、非難されるところなく振る舞ったという証言として訳す
  alternative: 単なる修辞的な自己弁護と見る、または絶対的で無罪な完全性の主張と見る
  rationale: 本文は人間と神を証人として、実際の生活の誠実さを厳粛に訴えている。一方、「非難されるところなく」に罪のない絶対的完全性まで読み込まず、本文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、厳粛な証言という調子を保った。日本語の自然な語順のため、行動の様態を先に置き、証人への訴えを文末に据えた。
