  text: あなたがたも知っているとおり、私たちは、父親が自分の子どもに接するように、あなたがた一人ひとりに接しました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くすれば、「あなたがたも知っているとおり、あなたがた一人ひとりに対して、父親が自分の子どもに対して……するように」となる。ギリシア語のこの節は省略を含み、動作の内容は前後の文から補われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: …とおり
  rationale: 比較を示しつつ、テサロニケの人々自身が知っている事実に訴える表現として、現代日本語で自然である。
- source_word: οἴδατε
  choice: 知っている
  rationale: 形は完了形だが、ここでは現在の認識を表すため、現在形で訳した。
- source_word: ὡς（第一）
  choice: （「知っているとおり」という構文に統合）
  rationale: 知っている内容を導く働きを、日本語では節全体を「…とおり」とすることで自然に表した。
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: あなたがた一人ひとり
  rationale: 個々人への配慮を強調する分配的な表現を明確に保持する。
- source_word: ὡς（第二）
  choice: …ように
  rationale: 父親と子どもの比喩的比較を自然に示す。
- source_word: πατὴρ
  choice: 父親
  rationale: 冠詞のない名詞による一般的・比較的な用法を、日本語で自然に表した。
- source_word: τέκνα
  choice: 子ども
  rationale: 性別を限定しない広い親族語として訳した。
- source_word: ἑαυτοῦ
  choice: 自分の
  rationale: 一般の子どもではなく、その父親自身の子どもであるという再帰代名詞の強調を保つ。
- source_word: ［文脈から補われる省略された動作］
  choice: 私たちは…に接しました
  rationale: ギリシア語節は省略的で、周囲の文脈に動作の意味を依存する。「接しました」は父親の比喩に合い、特定の一動作に狭めず包括的に表せる。
theological_decisions:
- issue: 省略された動作を補うこと
  choice: 包括的な動詞「私たちは…に接しました」を補う
  alternative: 断片的な構文をそのまま残す、または「勧めました」など特定の動作を補う
  rationale: 原文はこの節だけでは省略的だが、日本語の独立した文として理解可能にする必要がある。周辺には複数の牧会的動作があるため、一つに限定せず広い表現を用いた。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「接しました」を反復して省略構文を補い、父親の比喩との自然なつながりを保った。
