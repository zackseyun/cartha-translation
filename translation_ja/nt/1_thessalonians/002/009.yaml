source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: ja
  text: 兄弟たち[a]、あなたがたは、私たちの労苦と苦闘を覚えているでしょう。私たちは、あなたがたのだれにも負担をかけないよう、夜も昼も働きながら、あなたがたに神の福音を宣べ伝えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兄弟姉妹たち」。ギリシア語は「兄弟たち」だが、会衆全体への包括的な呼びかけであり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: 覚えているでしょう
  rationale: 現在直説法二人称複数を命令ではなく、読者の記憶に訴える陳述として表した。日本語では文脈上「でしょう」を添えると、断定的すぎず自然な呼びかけになる。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文に保った。会衆全体を含む可能性は脚注で示す。
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: 私たちの労苦と苦闘
  rationale: κόποςを骨の折れる働きとして「労苦」、μόχθοςをそれに伴う困難と激しい苦労として「苦闘」とし、並列語の違いを保った。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 夜も昼も
  rationale: 継続的で懸命な働きを表す慣用句を、自然な現代日本語で再現した。
- source_word: ἐργαζόμενοι
  choice: 働きながら
  rationale: 主動詞「宣べ伝えました」に伴う分詞として、同時的な状況を明確にした。文脈上は生活を支える労働を含むが、本文では限定しすぎない。
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: あなたがたのだれにも負担をかけないよう
  rationale: 目的を表す構文を明示し、金銭的・実際的負担の双方を含み得る「負担」とした。
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: あなたがたに…宣べ伝えました
  rationale: κηρύσσωの公に告げ知らせる意味を「宣べ伝える」で表し、εἰςの方向性を「に」で保った。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 神の福音
  rationale: 定着した聖書語「福音」を用い、属格は、起源・所有・内容のいずれかに限定せず「神の」とした。
theological_decisions:
- issue: ἀδελφοίの包括的用法
  choice: 本文では「兄弟たち」とする
  alternative: 「兄弟姉妹たち」
  rationale: 原文の男性複数形を本文に反映しつつ、この呼びかけが会衆全体を含み得ることを脚注で明示して、形態と文脈上の包括性の両方を保った。
- issue: τοῦ θεοῦの属格の意味
  choice: 「神の福音」とし、関係を特定しない
  alternative: 「神からの福音」または「神についての福音」
  rationale: 原文の属格は起源・所有・内容などの含みを持ち得るため、本文で一つに限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「労苦と苦闘」で原文の重ね表現を保持しつつ、「夜も昼も働きながら」で構文関係を自然にした。「宣べ伝える」はやや聖書的だが、κηρύσσωの公的宣言の含意を保ち、一般読者にも理解可能である。
