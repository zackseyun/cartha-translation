  to: しかし私たちは、神に吟味されて福音を委ねられる者として認められたとおりに、人を喜ばせようとしてではなく、私たちの心を吟味しておられる神を喜ばせようとして語っています。[a]
  rationale: 「しかし」と「…とおりに」により、ἀλλὰ καθὼς…οὕτως の逆接を伴う対応を自然な日本語で保った。本文を一文にして λαλοῦμεν の重複を除き、現在分詞 δοκιμάζοντι は「吟味しておられる」として継続的な働きを示した。神を喜ばせるという後半の補いは維持し、その省略は脚注で明示した。
