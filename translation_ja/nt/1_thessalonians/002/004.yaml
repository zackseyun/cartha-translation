id: 1TH.2.4
reference: 1 Thessalonians 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: ja
  text: しかし私たちは、神に吟味されて福音を委ねられる者として認められたとおりに、人を喜ばせようとしてではなく、私たちの心を吟味しておられる神を喜ばせようとして語っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近く言えば、「人を喜ばせる者としてではなく、私たちの心を吟味される神を（喜ばせる者として）」となる。ギリシア語は対比の後半で「喜ばせる」を省いている。
    reason: 原文の圧縮された対比表現を示し、本文で補った語を明らかにするため。
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: 吟味され……認められた
  rationale: 完了受動の、吟味を経て承認され、その結果が今も続いているという意味を表す。「試された」だけでは承認の結果が弱いため、二語で意味の幅を保った。
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: 福音を委ねられる
  rationale: ここでの受動不定詞は「福音を信じる」ではなく、「福音を託される」という意味である。「委ねられる」は、その信託の関係を自然な日本語で示す。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡で定着した訳語であり、単なる知らせを越えた文脈上の厚みも保つ。
- source_word: οὕτως λαλοῦμεν
  choice: そのように語っています
  rationale: 神による承認と委託を受けた者として語る、という前半との対応を明示する。
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: 人を喜ばせようとしてではなく
  rationale: 分詞の目的・姿勢を、現代日本語で誤解なく伝える。単に人へ好意を示すことではなく、人の歓心を得ることを基準に語らないという対比である。
- source_word: ἀλλὰ θεῷ
  choice: 神を喜ばせようとして
  rationale: ギリシア語では後半の「喜ばせる」が省略されているが、日本語で「ではなく、神」とだけすると意味関係が不明瞭になるため、補って訳した。省略形は脚注で示す。
- source_word: τῷ δοκιμάζοντι
  choice: 吟味される
  rationale: 現在分詞が表す継続的な働きを示し、前半の δεδοκιμάσμεθα との語根上のつながりも保つ。神への敬意を表すため尊敬語形とした。
- source_word: τὰς καρδίας ἡμῶν
  choice: 私たちの心
  rationale: 聖書における人格の内面全体を指す表現として「心」を保持し、「思考」や「感情」だけに限定しない。
theological_decisions:
- issue: 人を喜ばせることと神を喜ばせることの対比にある省略表現
  choice: 本文では「人を喜ばせようとしてではなく、……神を喜ばせようとして」と補って訳す
  alternative: 「人を喜ばせる者としてではなく、……神に対して」と圧縮した形を残す
  rationale: 原文は前半にだけ「喜ばせる」を明記し、後半では省いている。日本語で同じ省略をすると、神が語りかける相手であるかのような誤読を招くため、本文では意味を補い、原文の圧縮は脚注に残した。
- issue: 神の吟味と承認の関係
  choice: 「吟味され、……認められた」と訳す
  alternative: 「ふさわしいと認められた」
  rationale: δοκιμάζω には吟味と承認の両面があるが、「ふさわしい」は価値判断を強く言い足す可能性がある。そこで、原語の過程と結果を併記した。
translation_notes:
  register: 明快な現代標準語を用いながら、使徒的証言にふさわしい落ち着いた調子を保った。「吟味」「福音」「心」は文脈上の意味の厚みを保つ語として採用した。
