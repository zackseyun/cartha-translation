  terminology: 「福音」「心」「吟味」は適切である。「委ねられる者として認められた」は、福音を信じる意味ではなく福音を託される意味を正しく表す。脚注は後半の省略を説明するが、「神に対して」だけでは日本語では関係が曖昧になりうるため、補われる内容を明示する。
