  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: ja
  text: というのも、あなたがたも知っているとおり、私たちは決して、へつらいの言葉を用いたことはなく[a]、貪欲を覆い隠すための見せかけを用いたこともありません[b]。神が証人です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「へつらいの言葉のうちに」。または「へつらいをもって」。
    reason: lexical_alternative
  - marker: b
    text: または「貪欲のための口実」または「貪欲の覆い」。「見せかけ」と訳した語には、表向きの理由や覆いという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: これまで一度も……なく
  rationale: ποτέを伴う強い否定を自然な現代日本語で表し、後続のοὔτεとの並列も「……なく、……もありません」で保持した。γάρの説明的なつながりは、この一節だけでは「というのも」を明示すると硬くなるため、文脈に自然に委ねた。
- source_word: ἐν λόγῳ κολακείας
  choice: へつらいの言葉を用いた
  rationale: λόγοςを発言・語りとして、κολακείαを相手の歓心を買う「へつらい」とした。ἐνの様態・手段を日本語の「用いた」で自然に表現した。
- source_word: ἐγενήθημεν
  choice: 用いたことはなく／設けたこともありません
  rationale: 字義的な「なった」ではなく、テサロニケで彼らがどのようなあり方を示したかを述べる文脈に即し、各前置詞句に合わせて自然な動詞へ展開した。
- source_word: καθὼς οἴδατε
  choice: あなたがたも知っているとおり
  rationale: 読者自身の知識に訴える証言的な力を明確にしつつ、自然な日本語とした。
- source_word: ἐν προφάσει πλεονεξίας
  choice: 貪欲を隠す口実を設けた
  rationale: πρόφασιςが偽りの表向きの理由、または覆いを指し得ることを踏まえ、πλεονεξίαという利得への貪欲が隠される構図を明瞭にした。別の統語的理解は脚注に残した。
- source_word: θεὸς μάρτυς
  choice: 神が証人です
  rationale: 所有代名詞を補わず、神に証人として厳粛に訴える簡潔な名詞文を保った。
theological_decisions:
- issue: パウロが否定している言動と動機の範囲
  choice: へつらう言葉と、口実によって覆い隠された貪欲の双方を否定する。
  alternative: あらゆる修辞的工夫の否定、または金銭搾取だけに限定した否定。
  rationale: 本文が具体的に挙げるκολακείαとπλεονεξίαの範囲を保ち、修辞一般への非難に広げず、同時に貪欲を金銭だけへ狭めなかった。
- issue: πρόφασιςとπλεονεξίαの関係
  choice: 貪欲を隠すための口実と理解する。
  alternative: 貪欲に基づく見せかけ、または貪欲の口実。
  rationale: 属格関係には一定の幅がある。本文では自然で文脈に合う隠蔽の意味を採り、脚注で代案を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「へつらい」「貪欲」「証人」により厳粛さを保った。原文の二重の否定を読みやすく並列し、脚注記号[a][b]は対応箇所の本文中に置いた。
