  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: ja
  text: というのも、私たちが主イエスを通して[a]あなたがたにどのような指示を与えたかを、あなたがたは知っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主イエスの権威によって」。
    reason: διὰ τοῦ κυρίου Ἰησοῦ は、主イエスを媒介とすることのほか、その権威に基づくことを表すとも理解できるため。
lexical_decisions:
- source_word: οἴδατε
  choice: 知っている
  rationale: 完了形に由来する οἶδα はコイネー・ギリシア語で現在の意味を持つため、現代日本語では「知っている」が自然である。
- source_word: γὰρ
  choice: からです
  rationale: 前節の勧めの根拠・説明を示す接続語であり、日本語では文末の「からです」でその論理関係を明確に表せる。
- source_word: τίνας παραγγελίας
  choice: どのような指示
  rationale: τίνας の内容・種類を問う働きと、παραγγελία の権威ある訓示という意味を、自然な現代日本語で表す。「命令」も可能だが、ここでは意味の幅を保つ「指示」とした。
- source_word: ἐδώκαμεν ὑμῖν
  choice: 私たちが……与えた
  rationale: δίδωμι のアオリストを素直に「与えた」とし、ὑμῖν は文脈上明らかなため「あなたがたに」を重ねず、日本語として簡潔にした。
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: 主イエスを通して
  rationale: 属格を伴う διά の手段・媒介の意味を直接反映し、主イエスの権威によるという含意を狭く限定せずに保つ。
- source_word: κυρίου Ἰησοῦ
  choice: 主イエス
  rationale: κύριος は標準的に「主」、Ἰησοῦ は「イエス」とし、自然な日本語の称号と固有名の順序に従う。
theological_decisions:
- issue: διὰ τοῦ κυρίου Ἰησοῦ の意味合い
  choice: 主イエスを通して
  alternative: 主イエスの権威によって
  rationale: この句は媒介・手段を直接表しつつ、権威の含意も持ち得る。本文ではギリシア語に形式的に近い表現を採用し、権威に限定する解釈は脚注に残して、真正な意味の幅を保持した。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「あなたがた」「私たち」を用い、原文の説明的接続と語順を日本語として自然な範囲で保持した。
