base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: ja
  text: 神は私たちを、汚れのためにではなく、聖さのうちに召されたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖化のうちに」。原語は「聖さ」という状態も、「聖なる者とされていくこと」も表し得ます。「汚れ」は、文脈上、特に性的な汚れを含む道徳的な汚れを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: （前文とのつながりを文脈に織り込み、独立した「なぜなら」は置かない）
  rationale: γάρは前の勧告の根拠を示す。日本語では節単独で「なぜなら」を置くと不自然になりやすく、「～のは…ためです」という説明構文によって理由づけを自然に表せる。
- source_word: ἐκάλεσεν
  choice: 召された
  rationale: アオリストの出来事性を保ちつつ、神の呼びかけを表す聖書的な語彙「召す」を用いる。召しの作用について後代の教理的限定は加えない。
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: 汚れた生き方のため
  rationale: ἐπί＋与格が示す目的・方向を「ため」で表す。ἀκαθαρσίαは直前の性的文脈を含む道徳的汚れを指すが、それだけに限定せず、「生き方」を補って自然な日本語にした。
- source_word: ἐν ἁγιασμῷ
  choice: 聖なる者となるため
  rationale: ἁγιασμόςが持つ聖さの状態と聖化の過程の両面を、動的な表現で保つ。ἐνは厳密には領域・状態を示し得るが、前半との対比を日本語として明瞭にするため目的表現に整えた。
theological_decisions:
- issue: 神の「召し」の意味
  choice: 信者の聖い生活の根拠となる神の現実の召しとして表すが、その仕組みは限定しない。
  alternative: 一般的な招き、または専門的教理としての不可抗的・有効な召命と明示する。
  rationale: 本文は神の召しを倫理的勧告の根拠としているが、その作用の仕方までは定義していないため、「召す」を保持し、特定教派の体系を持ち込まない。
- issue: ἁγιασμόςの状態性と過程性
  choice: 「聖なる者となる」と訳し、聖さへの方向と形成の過程を表す。
  alternative: 「聖さのうちに」として状態・領域を前面に出す。
  rationale: 原語は「聖さ」と「聖化」の双方を表し得る。本文の対比を自然な現代日本語にしながら、この動的含意を残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「召す」は神の呼びかけを示す定着した聖書語として保持した。「汚れた生き方」は一般読者に意味が通じるよう補足的に具体化し、脚注で原語に近い直訳と語義の幅を示した。
