  text: ですから、これらの言葉によって互いに励まし合いなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらの言葉によって互いに慰め合いなさい」。この動詞には「励ます」「慰める」「勧める」という意味があり、ここでは特に、確かな希望をもって安心させる意味合いがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の、主の来臨と死者の復活についての教えから実践的な結論を導く接続表現として、現代日本語で明確かつ自然である。
- source_word: παρακαλεῖτε
  choice: 励まし合いなさい
  rationale: この動詞は「励ます」「慰める」「勧める」の意味を取り得る。ここでは、亡くなった信者について悲しむ人々に確かな希望を示す文脈なので、「励ます」が慰めを含みつつ語義の幅を適切に保つ。相互代名詞と合わせて自然な日本語の相互表現とした。
- source_word: ἀλλήλους
  choice: 互いに〜合いなさい
  rationale: 命令が共同体の一人一人に向けられ、相互に行われることを、日本語として自然な「互いに」と補助動詞「合う」で明示する。
- source_word: ἐν
  choice: によって
  rationale: ここでは励ましの内容または手段を示す。「によって」は、この言葉を用いて励ますという手段的な意味を明確に表す。
- source_word: τοῖς λόγοις τούτοις
  choice: この言葉
  rationale: 直前に述べられた教え全体を指す。「これらの言葉」も可能だが、日本語ではひとまとまりの知らせを指す単数形「この言葉」が自然で、指示内容も保たれる。
theological_decisions:
- issue: παρακαλεῖτε の牧会的含意
  choice: 励まし合いなさい
  alternative: 慰め合いなさい／勧め合いなさい
  rationale: 直前の復活と再会の希望は、悲しむ人々への慰めであると同時に共同体への励ましでもある。「励ます」はいずれか一方に限定せず、この文脈の牧会的な広がりを保つ。
translation_notes:
  register: 明快な現代標準日本語とし、命令形には共同体に向けた dignified で自然な「〜なさい」を用いた。「互いに励まし合う」は相互性を明瞭に表し、本文の牧会的な温かさも保つ。
