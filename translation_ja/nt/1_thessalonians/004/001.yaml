id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: ja
  text: さて、兄弟たち[a]、私たちは主イエスにあって、あなたがたにお願いします。また、強く勧めます。あなたがたが私たちから受けた、どのように歩んで神に喜ばれるべきかという教えに従って、現にそのように歩んでいるように、さらにいっそう進歩するように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は男性複数形だが、ここでは女性を含む信者共同体全体への呼びかけとして用いられていると考えられる。別訳「兄弟姉妹たち」。
    reason: 語形を保ちながら、文脈上の包括的な指示範囲を明示するため。
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: さて
  rationale: 話題を次の勧告へ移す機能を、現代日本語で自然に表した。「最後に、それでは」とも訳せるが、この後もまとまった議論が続くため、単純な結語と限定しない訳を選んだ。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を保ちつつ、ここでは信者共同体全体への呼びかけであることを脚注で明示した。
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: あなたがたにお願いします。また、強く勧めます
  rationale: 丁重な願いと権威ある勧告という二つの動きを区別して表した。παρακαλοῦμεν はこの文脈では単なる慰めや励ましより強い勧告を示す。
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: 主イエスにあって
  rationale: ἐν の領域・結びつき・権威の含みを狭く決めず、パウロ書簡に自然な表現で保持した。κύριος はキリストへの称号として「主」とした。
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ
  choice: どのように歩んで神に喜ばれるべきか、あなたがたは私たちから教えを受け
  rationale: παραλαμβάνω の、伝えられた教えを受領する意味を「教えを受け」で自然に表し、περιπατεῖν の生活・行動を指す歩行の比喩は「歩む」として残した。δεῖ の道徳的必然性は「べき」で表した。
- source_word: καθὼς καὶ περιπατεῖτε
  choice: 現にそのように歩んでいます
  rationale: 現在形と καί が示す、すでに実践していることへの肯定を明確にした。歩行の比喩も維持した。
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: その歩みにおいて、さらにいっそう励んでください
  rationale: 現在の実践を超えて一層前進するよう求める意味を、自然な日本語の勧告として表した。「その歩みにおいて」を補い、何に励むのかを文脈上明確にした。
theological_decisions:
- issue: テサロニケの信者への性別を伴う呼びかけ
  choice: 本文では「兄弟たち」とし、共同体全体を指し得ることを脚注で示す
  alternative: 「兄弟姉妹たち」または「きょうだいたち」
  rationale: ἀδελφοί の語形を本文で反映しながら、男性だけへの限定と誤解されないよう、当時の複数男性形の包括的用法を注記した。
- issue: イエスに用いられる κύριος
  choice: 主
  alternative: 主人
  rationale: ここではイエスに対するキリスト論的称号であり、「主」が日本語聖書の文体でも明瞭かつ適切である。
- issue: ἐν κυρίῳ Ἰησοῦ が表す関係
  choice: 主イエスにあって
  alternative: 主イエスによって／主イエスの名によって
  rationale: この句には、主との結びつきの中での勧告と主の権威による勧告の双方が響き得るため、一方だけに限定しない表現を選んだ。
translation_notes:
  register: 明瞭で現代的ながら、使徒的勧告にふさわしい品位を保った。「歩む」はパウロの生活比喩として維持し、長いギリシア語構文は日本語で理解しやすい複数の文に分けた。
