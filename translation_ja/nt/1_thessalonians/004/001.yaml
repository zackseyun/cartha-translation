  to: さて、兄弟たち[a]、私たちは主イエスにあって、あなたがたにお願いします。また、強く勧めます。あなたがたが私たちから受けた、どのように歩んで神に喜ばれるべきかという教えに従って、現にそのように歩んでいるように、さらにいっそう進歩するように。
