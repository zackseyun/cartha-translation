reference: 1 Thessalonians 4:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: ja
  text: ですから、これを退ける者は、人を退けるのではなく、ご自分の聖霊をあなたがたにまた与えてくださる神を退けるのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「退ける」は、「無視する」「無効にする」とも訳せる。また、「あなたがたに」の直訳は「あなたがたの中へ」である。
    reason: ἀθετέωの意味の幅と、εἰςの方向性を示すため。
lexical_decisions:
- source_word: τοιγαροῦν
  choice: ですから
  rationale: 直前の勧告から導かれる結論を示す強い推論の接続語として、現代日本語で自然かつ明瞭に表した。
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: 退ける者は……退けている
  rationale: 定冠詞付き分詞の一般的・代表的な意味を「者」で表した。ἀθετέωは権威ある教えを無視する、退ける、無効とみなすという幅を持つが、ここでは人ではなく神を退けるという対比に「退ける」が最もよく合う。
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: 人を退けるのではなく……神を退けている
  rationale: ἄνθρωπονは特定の男性ではなく人間を一般的に指す。「人」と「神」の簡潔な対比を保った。
- source_word: τὸν καὶ διδόντα
  choice: 与えてくださる
  rationale: 現在分詞を神を説明する連体節として訳した。καίは文脈上、神をさらに特徴づける働きをするが、日本語で「また」を明示すると不自然になりやすいため、関係節の流れに含ませた。敬意を表す補助動詞は、神を主語とする自然で品位ある日本語として用いた。
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: ご自分の聖霊
  rationale: αὐτοῦが神を指すことを明確にし、重なりを避けながら自然な日本語にした。この句はパウロの文脈で神の聖霊を指す。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに
  rationale: εἰςは字義的には「中へ」の方向性を持つが、δίδωμιと人を表す対象を伴うこの構文では、日本語の授受表現として「あなたがたに」が自然である。原語の方向性は脚注で示した。
theological_decisions:
- issue: 「ご自分の聖霊」の指示対象
  choice: 神が信じる者たちに与える聖霊を指す表現として訳した。
  alternative: 神から与えられる聖なる霊、あるいは聖なる性質・心的傾向と解する。
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιονという限定された表現は、パウロ書簡の文脈では神の聖霊を自然に指す。本文以上の体系的教義は付加していない。
- issue: ὁ ἀθετῶνの一般的な指示範囲
  choice: 性別を限定しない「退ける者」とした。
  alternative: 「退ける人」または男性を明示する表現。
  rationale: ギリシア語の男性単数形はここでは一般的・代表的であり、男性だけに限定されない。
- issue: 「この教え」の補足
  choice: 前文脈の勧告を指すものとして「この教え」と明示した。
  alternative: 目的語を補わず「これを退ける者」、または「このことを軽んじる者」とする。
  rationale: 原文ではἀθετέωの目的語が明示されず、直前の勧告全体から理解される。日本語では「この教え」を補うことで指示内容を自然に示すが、指示範囲を狭く限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、勧告の厳粛さにふさわしい品位を保った。「ですから」「退けているのです」によって、前文脈からの結論と強調を自然に表現した。
