  to: それから、生きていて残っている私たちは、彼らと同時に、共に雲の中へ引き上げられ[a]、空中へ主に会うために行きます[b]。こうして私たちは、いつまでも主と共にいることになります。
  rationale: 「彼らと同時に、共に」によりἅμα σὺν αὐτοῖςの同時性と共同性を明示しました。「雲の中へ」「空中へ」はεἰςを含む上方への移動の方向を自然な日本語で反映します。「主に会うために行きます」はεἰς ἀπάντησιν τοῦ κυρίουを中立的に訳し、対面後の展開について特定の解釈を読み込みません。
