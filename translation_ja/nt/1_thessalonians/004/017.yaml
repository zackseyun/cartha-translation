source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: ja
  text: それから、生きていて残っている私たちは、彼らと同時に、共に雲の中へ引き上げられ[a]、空中へ主に会うために行きます[b]。こうして私たちは、いつまでも主と共にいることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奪い上げられ」とも訳せます。ギリシア語の動詞は、突然で力強い動きを強調します。
    reason: lexical_alternative
  - marker: b
    text: 「主を迎えるために」とも訳せます。この表現は、来る人を迎えに出ることを指す場合がありますが、この節自体は、この対面を越えた出来事の全体的な順序を明示していません。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: それから
  rationale: 直前の節で述べられた、キリストに属して死んだ人々の復活に続く出来事であることを、自然な現代日本語で示す。
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: 生きていて残っている私たち
  rationale: 主の来臨時になお生きている人々を指す二つの分詞句を保持する。「生き残った」として危難からの生存を不必要に示唆することは避ける。
- source_word: ἅμα σὺν αὐτοῖς
  choice: 彼らと一緒に
  rationale: 復活した人々との同時性と同行の両方を、簡潔で自然に表す。
- source_word: ἁρπαγησόμεθα
  choice: 引き上げられ
  rationale: ἁρπάζωの未来受動形。外から突然かつ力強く移される意味を保ちつつ、特定の終末論体系を訳文に持ち込まない。
- source_word: ἐν νεφέλαις
  choice: 雲の中に
  rationale: 複数形の「雲」という具体的な神顕現的イメージを保つ。日本語では移動動詞との組み合わせとして「雲の中に」が自然である。
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: 主を迎えます
  rationale: 来る者との対面・出迎えを表し得る句を自然な日本語にする。ただし、その後にどこへ向かうかは訳文で補わない。
- source_word: εἰς ἀέρα
  choice: 空中で
  rationale: 対面が行われる場所を自然な日本語で示す。εἰςの方向性は、そこへ引き上げられるという文脈の中で十分に伝わる。
- source_word: καὶ οὕτως
  choice: こうして
  rationale: 先に述べた出来事を経た結果またはあり方を示す。
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: いつまでも主と共にいることになります
  rationale: 将来にわたる継続的な主との交わりという結論を、明確で品位ある現代日本語で表す。
theological_decisions:
- issue: 後世の「携挙」論争と関係するἁρπαγησόμεθαの訳し方
  choice: 引き上げられ
  alternative: 奪い上げられ／さらわれ
  rationale: 受動的で力強い上方への移動を表しながら、出来事の時期や体系的な終末論を訳語だけで確定しない。「携挙」という教義用語も本文には採用しない。
- issue: εἰς ἀπάντησιν τοῦ κυρίουが含み得る出迎えの含意
  choice: 主を迎えます
  alternative: 主に会います／主との出会いのために
  rationale: この句が来訪者を迎えに出る場面に用いられ得ることを反映する一方、対面後の移動先や終末の出来事の全順序はこの節だけでは明記されないため、補わない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「主」「共に」など聖書本文にふさわしい品位を保った。「携挙」のような後世の専門用語を避け、原文が述べる範囲にとどめた。
