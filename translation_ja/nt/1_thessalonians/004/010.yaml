  source_fidelity: 「マケドニア全土にいるすべての兄弟たちに対して」は、εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳを適切に反映しています。「そうしています」も、直前の兄弟愛を指すαὐτόを無理に補足せずに受けています。ただし、「豊かになる」は日本語では物質的な豊かさをまず連想させやすく、περισσεύεινがこの文脈で表す「いっそう増し加わる／さらに豊かに実践する」という勧告を十分明瞭に伝えません。
