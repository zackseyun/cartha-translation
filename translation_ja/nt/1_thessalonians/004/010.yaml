source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: ja
  text: 実際、あなたがたはマケドニア全土にいるすべての兄弟たちに対して、そうしています。また、兄弟たち[a]、私たちはあなたがたに、さらにいっそうそれを行うように勧めます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は同じ信仰を持つ仲間を指し、諸教会の男性と女性の双方を含むと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実際
  rationale: γάρの説明的な働きとκαίの強調を、直前の兄弟愛についての言明を受ける自然な日本語で表した。
- source_word: ποιεῖτε αὐτό
  choice: そうしています
  rationale: 現在形の継続的な実践を表し、αὐτόが直前の兄弟愛の実践を指し戻す働きを保った。
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: すべての兄弟たちに対して
  rationale: εἰςが示す行為の向かう相手を「に対して」で表した。ἀδελφούςの男性複数形は本文で「兄弟たち」とし、文脈上の包括的な範囲は脚注で明示した。
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: マケドニア全土にいる
  rationale: ὅλῃの全域性と、句が兄弟たちを地理的に限定していることを明確にした。
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: しかし……私たちはあなたがたに勧めます
  rationale: δέによる穏やかな転換を「しかし」で示し、παρακαλέωの真剣な勧告の意味を「勧めます」で表した。
- source_word: περισσεύειν μᾶλλον
  choice: さらにいっそう豊かになるよう
  rationale: περισσεύωの増し加わり、あふれるという含みと、μᾶλλονの比較の力を保った。何が豊かになるかは直前の文脈に委ね、原文同様にこの節では補わなかった。
theological_decisions:
- issue: 混成の信仰共同体を指すἀδελφοί／ἀδελφούςの訳
  choice: 兄弟たち
  alternative: 兄弟姉妹／信者たち
  rationale: 原文の男性複数形を本文に保ちつつ、パウロが文脈上、女性を含む信仰共同体全体を指している可能性を脚注で説明した。
- issue: περισσεύεινの内容の明示
  choice: 目的語を補わず「豊かになる」とする
  alternative: 兄弟愛においてますます豊かになる
  rationale: 直前の文脈は兄弟愛を示すが、この節のギリシア語自体はその内容を明示しないため、神学的・解釈的な補足を本文に入れず照応関係を保った。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、使徒的勧告にふさわしい落ち着いた格調を保った。「さらにいっそう豊かになる」は日常語として理解可能でありつつ、原文の増し加わるイメージを残す表現である。
