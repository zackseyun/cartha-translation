  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: ja
  text: あなたがた一人ひとりが、聖さと敬意をもって自分の器[a]を得る[b]すべを知ること、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「器」は、自分の体を指すとも、妻を婉曲に指すとも解釈されます。
    reason: 原語σκεῦοςの指示対象に genuine ambiguity があるため。
  - marker: b
    text: 「得る」と訳した語は、「自分のものとして保つ」または文脈上「制御する」という意味にも理解できます。
    reason: κτᾶσθαιの語義と、「器」の解釈に応じて生じる訳の幅を示すため。
lexical_decisions:
- source_word: σκεῦος
  choice: 器
  rationale: 基本義を保ち、「自分の体」を指すのか「妻」を婉曲に指すのかという原文の解釈上の幅を本文で一方に限定しないため。
- source_word: κτᾶσθαι
  choice: 得る
  rationale: 「獲得する」という語義を自然な日本語で表しつつ、文脈上あり得る「自分のものとして保つ・制御する」という含みは注で示すため。
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: 聖さと敬意をもって
  rationale: ἐνの様態的な働きを日本語らしく表し、ἁγιασμόςの聖別・聖なる生活とτιμήの尊重・誉れを簡潔に保持するため。
- source_word: εἰδέναι
  choice: すべを知る
  rationale: 単なる知識ではなく、どのように行うべきかを心得るという不定詞の用法を表すため。
theological_decisions:
- issue: 「自分の器」が体を指すか妻を指すか
  choice: 本文では「自分の器」として曖昧さを保持する
  alternative: 「自分の体を制御する」または「妻を得る」
  rationale: いずれの解釈にも古くから根拠があり、語句だけでは確定できないため、本文で特定の倫理的・婚姻的解釈に限定しない。
- issue: κτᾶσθαιの動作性
  choice: 「得る」
  alternative: 「保つ」「治める」「制御する」
  rationale: 中動態現在不定詞には獲得・所有の意味領域があり、提供された校訂方針の「acquire」とも整合する。一方、体を指す解釈では制御の意味に理解され得るため、その可能性を注記する。
translation_notes:
  register: 現代標準日本語の明快で品位ある文体。「器」という比喩は原文の曖昧さを保つため意図的に残し、普通の読者には脚注で補足した。原文が前後に従属する不定詞句で末尾がコンマのため、日本語も「こと、」で継続形にした。
