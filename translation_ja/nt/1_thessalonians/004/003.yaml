  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: ja
  text: というのも、神のみこころは、あなたがたが聖なる者として生きること[a]、すなわち、性的不道徳[b]を避けることだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの聖化」または「あなたがたの聖さ」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語「ポルネイア」。不正な性的行為を広く指す語。伝統的には「淫行」。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: みこころ
  rationale: 神の望みと権威ある意志の両面を自然に表す、聖書文体として定着した現代日本語。「願い」では弱く、「目的」では意味を限定しすぎる。
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: あなたがたが聖なる者となること
  rationale: ἁγιασμόςが表す、神のために聖別された状態とそのように生きる歩みを、一般読者にも分かる表現で示す。直後の不定詞句がその倫理的内容を具体化する構造も保つ。
- source_word: ἀπέχεσθαι
  choice: 避けること
  rationale: 不定詞が「聖なる者となること」の内容を説明しているため、「すなわち」で明示した。「避ける」は継続的に身を遠ざける意味を自然に伝える。
- source_word: πορνείας
  choice: 性的不道徳
  rationale: πορνείαは特定の一種類に限られない不正な性的行為を広く指すため、現代日本語でその幅を保つ表現とした。
- source_word: γάρ
  choice: 実に
  rationale: 前節の勧告を受け、その根拠を示す接続を表す。独立して読んでも不自然にならず、説明・強調の働きを保つ。
theological_decisions:
- issue: 倫理的勧告におけるἁγιασμόςの意味
  choice: 「聖なる者となること」とし、後続句がその具体的な倫理内容を示す構造にした。
  alternative: 「聖化」または「あなたがたの聖さ」
  rationale: 位置的身分だけ、あるいは過程だけに限定せず、聖別された状態と生活の双方を含み得る原文の幅を保つため。
- issue: πορνείαの範囲
  choice: 広い意味の「性的不道徳」
  alternative: 「姦淫」「淫行」
  rationale: 原語を婚前性交や姦通など一つの類型に狭めず、不正な性的行為を広く指す語義を維持するため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神についての「みこころ」など品位ある聖書語彙を保持した。「聖化」という専門語は本文では説明的に訳し、脚注に残した。
