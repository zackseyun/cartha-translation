    rationale: ὑπερβαίνεινはこの文脈で兄弟に対する境界侵犯・不当な越権を表しますが、現行の慣用句「一線を越える」は何を越えるのかが曖昧で、「兄弟に対して」との結び付きも自然ではありません。
  - severity: low
    issue: 「報復される方」がやや不自然
    rationale: 受け身形に見え得るため、ἔκδικοςの能動的な司法・報復の役割は「報復を行われる方」としたほうが自然かつ明確です。
