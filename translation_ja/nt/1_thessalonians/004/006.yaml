revisions:
- from: だれも、このことで[a]自分の兄弟[b]に対して一線を越え、つけ込んではなりません。主は、これらすべてのことについて報復される方だからです。私たちが以前にもあなたがたに話し、厳かに警告したとおりです。
  to: だれも、この事柄で[a]自分の兄弟[b]に対して限度を越えたり、不当に利用したりしてはなりません。主は、これらすべてのことについて報復を行われる方だからです。私たちが以前からあなたがたに告げ、厳かに警告していたとおりです。
  rationale: 原文の曖昧さを保ちながら、日本語として不自然な「兄弟に対して一線を越え」を「兄弟に対して限度を越え」に改めました。また、ἔκδικοςが主の行為者性を表すことが分かるよう「報復を行われる方」としました。脚注aは「この事柄」のアンカーに対応しつつ、πλεονεκτεῖνの「欺く」という狭い訳と性的文脈の有力さを、本文以上に断定せず説明しています。
