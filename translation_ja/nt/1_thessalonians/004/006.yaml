  source_fidelity: 本文は原文の二つの不定詞（「限度を越える／不当に利用する」）と、主が報復を行うという警告をおおむね適切に伝えています。ただし「兄弟に対して一線を越え」は日本語として目的・侵害内容の関係がやや不明瞭です。「兄弟に対して限度を越え」とすることで、ὑπερβαίνεινの境界侵犯を過度に限定せず、構文を明確にできます。
  naturalness: 「兄弟に対して一線を越え、つけ込む」は並列関係と係り先が少し取りにくいため、「限度を越えたり、不当に利用したりしてはなりません」とすると、明瞭な現代標準日本語になります。「報復を行われる方」は「報復される方」よりも自然で、主が行為者であることも明確です。
  terminology: 「主」はκύριοςに適切です。「兄弟」は男性単数のἀδελφόςを保持しています。「不当に利用する」はπλεονεκτεῖνの搾取・不当な利得の含みを保ち、金銭的詐欺にも性的搾取にも限定しません。脚注aは「この事柄」の曖昧さと「欺く」という伝統的・狭義の理解を示し、脚注bは「兄弟」の文法性を説明するよう整理します。
  issues:
