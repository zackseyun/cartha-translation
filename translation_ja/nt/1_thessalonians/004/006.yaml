id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: ja
  text: だれも、この事柄で[a]自分の兄弟[b]に対して限度を越えたり、不当に利用したりしてはなりません。主は、これらすべてのことについて報復を行われる方だからです。私たちが以前からあなたがたに告げ、厳かに警告していたとおりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この事柄で兄弟を欺いてはならない」。ギリシア語の表現は、他者を不当に利用することを表し、より狭く「欺く」と理解することもできます。文脈上は性的な不正に関する警告である可能性が高いですが、本文はそれを明示していません。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟」に当たるギリシア語は男性単数形です。ここでは仲間の信者に焦点を当てていると考えられますが、この倫理的警告は共同体内でより広く当てはまり得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: だれも……一線を越え……てはなりません
  rationale: 冠詞付き不定詞が前節から続く勧告内容を表すため、一般的な主体を「だれも」で明示した。ὑπερβαίνωの道徳的な境界を踏み越える比喩は、現代日本語として自然な「一線を越える」で保った。
- source_word: πλεονεκτεῖν
  choice: つけ込む
  rationale: 他者を犠牲にして不当に利を得る、または相手を利用するという広い意味を表す。金銭上の詐欺だけに限定せず、直前の性的倫理の文脈にも適合する。
- source_word: ἐν τῷ πράγματι
  choice: このことで
  rationale: πρᾶγμαのやや一般的な表現を保ちながら、直前の性的な聖さに関する教えを指し示す自然な表現とした。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自分の兄弟
  rationale: ギリシア語の男性単数形をそのまま反映した。ここでは信仰共同体の一員を指す可能性が高い。
- source_word: ἔκδικος κύριος
  choice: 主は……報復される方
  rationale: ἔκδικοςが持つ、不正に対して裁きを執行し報復する者という強い司法的意味を保った。「報い」は肯定的にも受け取られ得るため避けた。
- source_word: περὶ πάντων τούτων
  choice: これらすべてのことについて
  rationale: 議論されている性的な罪と、それに伴う他者への不正を含み得る広い範囲を原文どおり保った。
- source_word: προείπαμεν
  choice: 以前にもあなたがたに話し
  rationale: すでに伝えていたという時間的意味を表し、後続のより強い警告表現との重複を避けた。
- source_word: διεμαρτυράμεθα
  choice: 厳かに警告した
  rationale: διαμαρτύρομαιの、強く証言し厳粛に言い渡す語感を、勧告の文脈に即して表した。
theological_decisions:
- issue: 「このこと」が指す内容と不正の性質
  choice: 3～5節の性的倫理の教えを受け、性的な事柄において兄弟の境界を侵し、その人につけ込むことへの警告と理解できる訳
  alternative: 商取引または一般的な人間関係において兄弟を欺くことへの警告
  rationale: 直前の文脈は聖化、性的な不道徳、聖さと尊厳をもって自分の体を扱うことを論じているため、性的文脈が有力である。ただしπλεονεκτεῖνとπρᾶγμαだけでは詐欺などの一般的な不正も表し得るので、本文では「つけ込む」「このことで」として限定しすぎず、別訳を脚注に残した。
- issue: ἀδελφόςの表現
  choice: 自分の兄弟
  alternative: 仲間の信者／兄弟姉妹
  rationale: 原文の男性単数形を本文に反映した。一方、倫理的警告が共同体内でより広く当てはまり得ることは脚注で示した。
- issue: κύριοςの表現
  choice: 主
  alternative: 主人
  rationale: この文脈では裁きを執行する復活の主を指すと理解され、「主」が語彙的・神学的連続性を最もよく保つ。
- issue: ἔκδικοςの裁きの強さ
  choice: 報復される方
  alternative: 正義を行われる方／罰を下される方
  rationale: 原文の、加害に対して報復し裁きを執行する意味を弱めないため。「罰を下す」より原語の報復的側面を明示しつつ、名詞的で不自然な「復讐者」は避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、勧告と裁きの厳粛さを保った。「一線を越える」「つけ込む」は一般読者に自然で、原文の境界侵犯と搾取の両面を伝える。文末は丁寧体に統一した。
