  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: ja
  text: あなたがたが、外の人々に対して品位をもって歩み、何一つ不足することがないようにするためです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれにも頼る必要がない」。この句は、他人に依存しないことを強調している可能性がある。
    reason: 原文のμηδενόςは「何一つ」とも「だれも」とも解釈でき、文脈上も人への依存を指す読みが成り立つため。
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためです
  rationale: 前節の勧めが目指す目的または結果を示す。日本語では前文とのつながりを明確にしつつ、目的の意味を自然に表す。
- source_word: περιπατῆτε
  choice: 歩みをし
  rationale: パウロ書簡で生き方や日常の振る舞いを表す比喩。「生活し」より原文の比喩を保ちながら、現代日本語でも理解できる表現とした。
- source_word: εὐσχημόνως
  choice: 品位ある
  rationale: 人前でふさわしく、立派に振る舞うという社会的・倫理的な含みを表す。「正しく」では一般的すぎ、「礼儀正しく」では意味を対人作法に狭めすぎる。
- source_word: πρὸς τοὺς ἔξω
  choice: 外の人々に対して
  rationale: キリスト者の共同体の外にいる人々との関係を指す。「未信者」と断定せず、原文の内外を表す言い方を保つ。
- source_word: μηδενὸς χρείαν ἔχητε
  choice: 何一つ不足することがない
  rationale: 必要なものに事欠かないという意味を自然な日本語で表す。μηδενόςは文法上「何ものも」と「だれも」の両方に解し得るため、人への依存を指す可能性は脚注に残す。
theological_decisions:
- issue: μηδενὸς χρείαν ἔχητε の意味
  choice: 物質的・生活上、何一つ不足しないこと
  alternative: だれの世話にもならないこと、またはだれにも頼る必要がないこと
  rationale: 直前の、自分の手で働くようにとの勧めを踏まえると、不必要に他人へ依存せず必要を満たすことが中心にある。ただしμηδενόςは中性にも男性にも取り得るため、本文で人への依存だけに限定せず、別解を脚注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「外の人々」は初期キリスト教共同体の内外という原文の表現を保ち、「品位ある歩み」は生活態度を表す比喩を自然な範囲で維持した。
