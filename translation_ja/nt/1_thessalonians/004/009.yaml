  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: ja
  text: 兄弟愛については[a]、あなたがたに書く必要はありません[b]。あなたがた自身、互いに愛し合うように神に教えられているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟愛」は、ここではより具体的に、信仰を共にする兄弟姉妹への家族的な愛を指します。
    reason: lexical_alternative
  - marker: b
    text: 原文は直訳すると「あなたがたに書く必要はありません」で、「書く」の主体は明記されていません。文脈上はパウロたちが想定されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 〜については
  rationale: 新しい話題への移行を自然な日本語の主題提示で表した。δέの緩やかな接続は「は」によって十分に示されるため、明示的な「さて」「しかし」は加えなかった。
- source_word: φιλαδελφίας
  choice: 兄弟愛
  rationale: 信仰共同体の仲間を家族として捉える語の比喩を保ち、後半のἀγαπᾶν（愛し合う）との語彙上の違いも残した。性別を限定しない共同体的意味は脚注で明示した。
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: あなたがたに書き送る必要はありません
  rationale: 日本語では不定詞の行為者を明示せずとも自然であり、原文が書く主体を明記していない点を保てる。「書き送る」により、手紙で教えを書いて届ける文脈を表した。
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: あなたがた自身が〜からです
  rationale: 重ねられた代名詞の強調を「あなたがた自身」で表し、γάρの理由説明を文末の「からです」で自然に示した。
- source_word: θεοδίδακτοί
  choice: 神から教えられている
  rationale: 「神に教えられた者」という稀な複合形容詞の意味を、明快で自然な受動表現にした。神が教えの源・主体であることを保持している。
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: 互いに愛し合うことを
  rationale: この構文が示す教えの方向・内容を自然な日本語で表した。「互いに」と相互動詞「愛し合う」によってἀλλήλουςの相互性を明瞭にした。
theological_decisions:
- issue: φιλαδελφίαとἀγαπᾶνの語彙上の区別
  choice: 「兄弟愛」と「愛し合う」を使い分ける
  alternative: 両方を一般的な「愛」で表す
  rationale: 前者の家族的・共同体的な含意と、後者のより一般的な愛の動作を平板化せず、同一節内の語彙の変化を保つため。
- issue: γράφεινの明示されていない行為者
  choice: 「あなたがたに書き送る必要はありません」とし、行為者を本文で補わない
  alternative: 「私たちがあなたがたに書き送る必要はありません」または「だれかが書き送る必要はありません」
  rationale: 文脈上はパウロたちが想定される可能性が高いが、原文の不定詞には行為者が明記されていない。日本語では省略しても自然なため、原文の曖昧さを保持した。
- issue: θεοδίδακτοιにおける神の働き
  choice: 「神から教えられている」
  alternative: 「神に教えられた者です」または「神ご自身に教えられています」
  rationale: 神が教える主体であることを明確にしつつ、原文にない追加的な強調や、教えが完了済みであるとの限定を避けた。
translation_notes:
  register: 明快な現代標準日本語を用い、丁寧で格調を保った。「兄弟愛」は聖書的な家族比喩を残すため本文に採用し、現代の読者が男性だけを指すと誤解しないよう脚注を付した。文を二つに分け、理由節を「からです」で結んで論理関係を明瞭にした。
