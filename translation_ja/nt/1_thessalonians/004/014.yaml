id: 1TH.4.14
reference: 1 Thessalonians 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: ja
  text: 実際、私たちがイエスは死んでよみがえったと信じているなら、同じように神も、イエスを通して眠りについた人たち[a][b]を、イエスとともに連れて来てくださるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「眠りについた人たち」。ここで「眠り」は、信仰者の死を表す比喩です。意味を直接表せば、「死んだ人たち」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「イエスにあって眠りについた人たち」とも訳せます。また、この句を後の動詞に結びつけ、「神はイエスを通して、眠りについた人たちをイエスとともに連れて来る」と理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: なぜなら、もし……なら、……からです
  rationale: γάρの理由提示とεἰの条件を一文の中で自然に示し、直前の教えを根拠づける論理を保つ。日本語では実質的な前提にも用いられる条件表現として訳した。
- source_word: πιστεύομεν
  choice: 私たちが……信じている
  rationale: イエスの死と復活について共同体が共有する信仰告白を、現代日本語で明瞭に表す。
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: 死んでよみがえった
  rationale: 二つのアオリストが指す歴史的出来事を簡潔に表し、ἀνέστηの自動詞的な「立ち上がった、よみがえった」という形を保つ。
- source_word: οὕτως καὶ
  choice: それと同じように
  rationale: イエスの死と復活への信仰と、死者に対する神の将来の行為との対応関係を示しつつ、その対応の仕方を必要以上に限定しない。
- source_word: τοὺς κοιμηθέντας
  choice: 眠りについた人たち
  rationale: 死を指す比喩を平板な「死んだ人たち」に置き換えず、将来の復活の希望を背景とするパウロの表現を保持する。
- source_word: διὰ τοῦ Ἰησοῦ
  choice: イエスを通して
  rationale: 属格を伴うδιάの基本的な媒介・手段の意味を反映しながら、句の係り方と意味に残る解釈上の幅は脚注で示す。
- source_word: ἄξει σὺν αὐτῷ
  choice: イエスとともに連れて来てくださる
  rationale: ἄξειの未来とσύνの同伴を自然な日本語で表す。敬語は神を主語とする日本語の聖書文体として用い、意味内容は加えていない。代名詞の指示対象は文脈上イエスであるため、曖昧になりやすい日本語では名を補った。
theological_decisions:
- issue: κοιμηθένταςにおける死の比喩
  choice: 本文で「眠りについた人たち」とし、比喩を保持する。
  alternative: 「死んだ人たち」
  rationale: この比喩は死の現実を否定するものではないが、復活を待つ者について語る文脈で重要である。本文では原文の表現を残し、直接的な意味を脚注で明示する。
- issue: διὰ τοῦ Ἰησοῦの意味と統語的関係
  choice: 本文では「イエスを通して眠りについた人たち」と訳す。
  alternative: 「イエスにあって眠りについた人たち」、または「神はイエスを通して、眠りについた人たちを……連れて来る」
  rationale: この句は、眠りについた人々とイエスとの関係を表すとも、神が彼らを連れて来る際のイエスの媒介を表すとも理解され得る。本文は語順とδιάの代表的な意味を反映し、他の可能性を脚注に残す。
- issue: σὺν αὐτῷの代名詞の指示対象
  choice: 「イエスとともに」と明示する。
  alternative: 「その方とともに」
  rationale: 文脈上の先行詞はイエスが最も自然である。日本語の代名詞では不明瞭になりやすいため固有名を補うが、新たな神学的限定は加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、理由を示す一文として原文の論理構造を保った。「よみがえる」「眠りにつく」は一般読者にも理解できる、尊厳ある聖書的表現である。神を主語とする箇所では自然な敬意表現として「くださる」を用いた。
