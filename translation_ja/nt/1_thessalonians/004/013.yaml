source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: ja
  text: しかし、兄弟たち[b]、眠りについた人々[a]について、あなたがたに知らないままでいてほしくないのです。それは、希望を持たないほかの人々のように、あなたがたが悲しまないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「眠っている人々」。ここでは、死んだ信者たちを「眠り」にたとえている。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は会衆への呼びかけで、女性も含んでいると考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν
  choice: しかし……あなたがたに知らずにいてほしくありません
  rationale: δέを穏やかな転換・対照として「しかし」とし、θέλομεν＋不定詞を自然な日本語で表現した。ἀγνοεῖνは侮蔑的に響きうる「無知である」を避け、「知らずにいる」とした。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを形式上保ちつつ、会衆全体を指しうるパウロ書簡の用法を脚注で説明した。
- source_word: περὶ τῶν κοιμωμένων
  choice: 眠りに就いた人々について
  rationale: 死者を指す「眠り」の比喩を解釈的に「死んだ人々」へ置き換えず保持した。日本語として荘重かつ自然な「眠りに就いた」を用いた。
- source_word: ἵνα μὴ λυπῆσθε
  choice: あなたがたが悲しむことのないため
  rationale: ἵνα＋接続法の目的を表す。悲しみそのものの全面的禁止ではなく、希望のない人々と同じ仕方で悲しまないという文脈上の限定が伝わる語順にした。
- source_word: καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα
  choice: 希望を持たないほかの人々のように
  rationale: οἱ λοιποίと後続の分詞句の関係を明確にし、終末的希望を持たない共同体外の人々との対比を簡潔に表した。
theological_decisions:
- issue: 終末論的文脈における κοιμωμένων の意味
  choice: 「眠りに就いた人々」として眠りの比喩を本文に残す。
  alternative: 「死んだ人々」
  rationale: 復活の希望を論じる箇所で、パウロが意図的に用いた死の比喩を保持し、指示対象は脚注で明らかにするため。
- issue: ἀδελφοί の範囲
  choice: 本文では「兄弟たち」とし、男女を含む会衆への呼びかけである可能性を脚注で示す。
  alternative: 「兄弟姉妹たち」または「皆さん」
  rationale: 原文の文法上の男性複数形を保持しながら、その代表的・包括的用法を注記するため。
- issue: 悲しみの否定の範囲
  choice: 「希望を持たないほかの人々のように」が「悲しむ」を限定する構造を保持する。
  alternative: 信者はいかなる悲しみも抱いてはならないとの読み
  rationale: 本文は悲嘆そのものを絶対的に禁じるより、希望のない人々と同様の悲しみ方をしないよう述べているため。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文にふさわしい落ち着いた品位を保った。「眠りに就く」で原文の比喩を自然に保持し、長い文でも論理関係が追える語順とした。脚注マーカーは対応箇所の直後に置いた。
