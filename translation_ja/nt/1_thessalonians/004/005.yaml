lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: 情欲に駆られてではなく
  rationale: πάθοςとἐπιθυμίαが表す、抑えがたい性的欲望に支配された状態を、現代日本語として自然に表した。否定は前節から続く勧めの仕方を示す。
- source_word: καθάπερ καὶ
  choice: のようにでもなく
  rationale: 前節から続く否定と比較を日本語で明確にし、καίの付加的な力も「でも」によって反映した。
- source_word: τὰ ἔθνη
  choice: 異邦人
  rationale: パウロ書簡で通常、ユダヤ人以外の諸民族を指す語であり、宗教的・民族的区分を過度な侮蔑なく保つ。
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: 神を知らない
  rationale: 分詞句が異邦人の継続的な状態を限定していることを、簡潔な連体修飾で表した。
theological_decisions:
- issue: πάθει ἐπιθυμίαςの意味と二つの名詞の関係
  choice: 情欲に駆られて
  alternative: 情欲の激情のうちに／欲望に燃えて
  rationale: 文脈上は乱れた性的欲望を指す。「情欲に駆られて」は二名詞の意味関係を自然な日本語にしつつ、欲望に支配される強さを保持する。脚注で、より形式的な訳や別の自然な訳の可能性を示す。
- issue: ἔθνηの訳語
  choice: 異邦人
  alternative: 諸国民／異教徒
  rationale: ここでは神を知らない非ユダヤ人を指すパウロ的用法が中心である。「異教徒」は宗教的解釈を強め、「諸国民」は現代日本語では個々の人々を指すことが不明瞭になりやすいため、本文では「異邦人」とした。
translation_notes:
  register: 前節から文法的に続く節であるため、文末を「なく、」として継続性を保った。全体は明瞭で格調ある現代標準日本語とし、「情欲」は性的倫理の文脈を明確にするため採用した。
