id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: ja
  text: というのも、主ご自身が、号令と、大天使の声と、神のラッパとともに、天から降って来られるからです。そして、メシアにあって死んだ人たちが、まずよみがえります[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 伝統的な訳では「キリストにあって死んだ人たちが、まずよみがえります」。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 直前の文に対する説明を導く接続詞の働きを、自然な現代日本語で明示した。
- source_word: αὐτὸς ὁ κύριος
  choice: 主ご自身
  rationale: 強意の αὐτός を「ご自身」で保ち、κύριος は文脈に即して「主」とした。
- source_word: ἐν κελεύσματι
  choice: 号令とともに
  rationale: κέλευσμα は権威ある命令や召集の叫びを表すため、簡潔で自然な「号令」を採用した。
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: 大天使の声とともに
  rationale: φωνή を「声」、ἀρχάγγελος を現代日本語で一般的な「大天使」と訳した。無冠詞であるため特定の大天使とは断定しない。
- source_word: ἐν σάλπιγγι θεοῦ
  choice: 神のラッパの音とともに
  rationale: σάλπιγξ は「ラッパ」。三つの聴覚的しるしが並ぶ文脈上、日本語では「音」を補うことで自然かつ明瞭にした。
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: 天から降って来られる
  rationale: 下降の動きを明確にしつつ、主を主語とする日本語として敬意ある自然な表現にした。
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: メシアにあって死んだ人たち
  rationale: οἱ νεκροί を明瞭な「死んだ人たち」とし、Χριστός は称号としての意味を保つ「メシア」と訳した。「にあって」は関係・結びつきを示す ἐν の含みを過度に限定しない。
- source_word: ἀναστήσονται πρῶτον
  choice: まずよみがえります
  rationale: 中動態形を自動詞「よみがえる」で表し、πρῶτον が次節の生きている者たちとの順序を示すことを「まず」で保持した。
theological_decisions:
- issue: ἐν Χριστῷ における Χριστός の訳
  choice: メシアにあって
  alternative: キリストにあって
  rationale: Χριστός がここで油注がれた方という称号として機能することを示すため「メシア」を本文に採用した。日本語の伝統的で広く知られた表現は脚注に残した。
- issue: 「まず」が示す順序
  choice: 死んだ人たちがまずよみがえる
  alternative: 終末の諸出来事全体の中で最初によみがえる
  rationale: 文脈上、πρῶτον は次節で生き残っている人々が引き上げられることとの順序を示すが、本文ではその比較対象を付加せず、原文の簡潔さと次節への開かれた関係を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の聴覚的な三要素を並列させ、「主ご自身」の強調と、死者が先によみがえる順序を保持した。
