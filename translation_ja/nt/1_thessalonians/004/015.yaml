id: 1TH.4.15
reference: 1 Thessalonians 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: ja
  text: このことを、私たちは主のことばによって[a]、あなたがたにこう言います。主の到来[b]まで生きて残っている私たちは、眠りについた人たち[c]に決して先立つことはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主のことばに基づいて」。ギリシア語は、主イエスのことばを指すとも、主の権威によって与えられた啓示を指すとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「到来」に当たるギリシア語（παρουσία）は、「臨在」または「来訪」とも訳せる。ここでは主が来られる出来事を指す。
    reason: lexical_alternative
  - marker: c
    text: 「眠りについた人たち」は、死んだ信者たちを指す比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: 主からのことばによって
  rationale: ἐνの根拠・手段のニュアンスを自然な日本語で表しつつ、主イエスの既知の発言を指すのか、主の権威による啓示を指すのかを本文だけで限定しない表現とした。
- source_word: παρουσίαν
  choice: 到来
  rationale: この終末論的文脈では、主が将来来られる出来事を指す。「到来」は「来臨」より一般読者に分かりやすく、出来事としての意味も明確である。
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: 生きて残っている私たち
  rationale: 二つの現在分詞を一続きの自然な日本語として訳し、その時まで生存している者という意味を保った。「生き残る」は危難を切り抜ける含みを帯びやすいため避けた。
- source_word: οὐ μὴ φθάσωμεν
  choice: 決して先になることはありません
  rationale: οὐ μήによる強い否定を「決して」で示し、ここでのφθάνωの意味である「先行する」を平明な日本語で表した。
- source_word: τοὺς κοιμηθέντας
  choice: 眠りについた人たち
  rationale: 死者を指す睡眠の比喩を解釈的に「死んだ人たち」と置き換えず、そのまま保持した。
- source_word: κύριος / κυρίου
  choice: 主
  rationale: この節では終末に到来するイエスを指しており、標準的かつ尊厳ある訳語「主」を用いた。
theological_decisions:
- issue: 「主からのことば」の伝達形態
  choice: 主に由来し、その権威に基づくことばであることを示しつつ、伝達形態は確定しない訳とした。
  alternative: 地上のイエスの既知の発言の引用、またはパウロに与えられた直接的・預言的啓示と明示する。
  rationale: ἐν λόγῳ κυρίου自体は発言の権威を示すが、それがどのように伝えられたかまでは特定していないため、原文の曖昧さを保った。
- issue: 「眠りについた人たち」の意味
  choice: 死んだ信者を表す睡眠の比喩を本文に残した。
  alternative: 「死んだ人たち」と説明的に訳す。
  rationale: 復活の希望を背景とするパウロの比喩的表現を保持しつつ、脚注で指示対象を明らかにした。
- issue: 生きて残る者と眠りについた者の順序
  choice: 生存者が死者に先行することを強く否定する原文どおりの表現とした。
  alternative: 復活や携挙の具体的な順序を本文に補って説明する。
  rationale: この節が明言する範囲にとどめ、終末の出来事について本文にない体系的説明を加えなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「来臨」のような教会内で主に使われる語より「到来」を選んだ。文体の尊厳を保ちながら、「決して先になることはありません」と一般読者にも理解しやすい表現にした。
