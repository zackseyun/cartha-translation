id: 1TH.4.11
reference: 1 Thessalonians 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: ja
  text: また、静かに暮らすことを志し、自分のことに専念し、自分の手で働きなさい。これは、私たちがあなたがたに命じたとおりです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: 志し
  rationale: 何かを名誉ある目標とし、その実現に励む意味を表す。「志す」は簡潔で自然であり、静かな生活をあえて目標とするという表現の力も保つ。
- source_word: ἡσυχάζειν
  choice: 静かに暮らす
  rationale: 単に黙ることではなく、騒がず落ち着いた生活を送ることを指す文脈なので、生活様式を明確に表した。
- source_word: πράσσειν τὰ ἴδια
  choice: 自分の務めに励み
  rationale: 直訳的には「自分自身の事柄を行う」。他人のことに干渉せず、自分に属する事柄に取り組むという慣用的意味を、尊厳ある自然な日本語で表す。
- source_word: ἐργάζεσθαι
  choice: 働きなさい
  rationale: 労働することを広く表す一般的な語であり、ここでは勧告の力を日本語の命令形で明示した。
- source_word: ταῖς χερσὶν ὑμῶν
  choice: 自分の手で
  rationale: 与格の手段用法と二人称複数の所有を自然な日本語で表し、自ら労働することへの強調を保つ。
- source_word: καθὼς
  choice: とおり
  rationale: 以前に与えた指示との一致を示す比較表現として自然である。
- source_word: παρηγγείλαμεν
  choice: 命じておいた
  rationale: παραγγέλλω の権威ある指示という力を保ちつつ、過去にすでに伝えた命令であることを「ておいた」で表す。
theological_decisions:
- issue: 使徒的勧告の権威的な強さ
  choice: 「命じておいた」
  alternative: 「教えておいた」「指示しておいた」
  rationale: παραγγέλλω は単なる助言より強い権威ある指示を表すため、その倫理的拘束力を弱めず「命じる」と訳した。
- issue: 静かな生活と勤労の関係
  choice: 三つの並列的な勧告として訳す
  alternative: 「静かにして自分のことを行う」全体を一つの勧告としてまとめる
  rationale: ギリシア語では ἡσυχάζειν、πράσσειν、ἐργάζεσθαι が καί で連結されているため、相互に関係しつつも区別できる三つの行為として提示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、勧告としての品位と権威を保つ文体とした。節頭の καί は前節からの連続を示すため「また」とした。日本語では不定詞の連鎖をそのまま再現すると不自然になるため、最後を「働きなさい」として三項全体に勧告の力が及ぶ形にした。
