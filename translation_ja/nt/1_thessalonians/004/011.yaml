revisions:
- from: また、静かに暮らすことを志し[a]、自分の務めに励み[b]、自分の手で働きなさい。私たちがあなたがたに命じておいたとおりです。
  to: また、静かに暮らすことを志し、自分のことに専念し、自分の手で働きなさい。これは、私たちがあなたがたに命じたとおりです。
  rationale: 「自分の務め」を、原文のより広い意味を保つ「自分のこと」に改めました。「専念する」は、他人の事柄への不必要な介入ではなく自分に属する事柄に取り組むという文脈に自然です。使徒的指示の強さは「命じた」により維持し、「命じておいた」が加える完了・準備的な含みは避けました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:25Z'
review_pass:
  verdict: revise
  source_fidelity: 「自分の務めに励み」は、πράσσειν τὰ ἴδια（自分自身に属する事柄に取り組む）をやや狭く「務め・職務」の意味へ寄せています。原文は職務に限らず、自分の事柄に注意を向けるよう求める表現です。また、三つの不定詞は前節から続く勧告の内容であり、日本語では三項すべてに勧告が及ぶ形を明示するのが適切です。
  naturalness: 「静かに暮らすことを志し、自分のことに専念し、自分の手で働きなさい」は、現代標準日本語として自然で、静かな生活・自己の事柄・労働という並列を明瞭に伝えます。末尾の「これは」を補うことで、「私たちが…命じたとおりです」が日本語として完結します。
  terminology: φιλοτιμεῖσθαιの「志す」、ἡσυχάζεινの「静かに暮らす」、ἐργάζεσθαιの「働く」、παρηγγείλαμενの「命じた」はいずれも適切です。πράσσειν τὰ ἴδιαは、職業上の「務め」に限定しない「自分のことに専念する」とします。
  issues:
  - severity: medium
    issue: 「自分の務めに励み」が原文の範囲を狭める。
    rationale: τὰ ἴδιαは「自分に属する事柄」であり、特定の職務・責務だけを指す語ではない。
  - severity: low
    issue: 三つの勧告の統語的な並列をより明瞭にする必要がある。
    rationale: 最初の二項を連用形、最後を命令形とすること自体は可能だが、「自分のことに専念し」に改め、三項が同じ勧告内容であることを自然に示す。
  revised_text: また、静かに暮らすことを志し、自分のことに専念し、自分の手で働きなさい。これは、私たちがあなたがたに命じたとおりです。
  revised_footnotes:
