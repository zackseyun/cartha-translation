id: 1TH.1.4
reference: 1 Thessalonians 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδότες, ἀδελφοὶ ἠγαπημένοι ὑπὸ ⸀θεοῦ, τὴν ἐκλογὴν ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/004.yaml
  text: For we know[a], brothers loved by God, your election[b],
translation:
  language: ja
  text: 神に愛されている兄弟たち[a]、私たちは、あなたがたが選ばれたこと[b]を知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、パウロの手紙では多くの場合、信仰共同体全体への呼びかけである。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「あなたがたの選び」。ギリシア語は「選び、選出」を意味する名詞であり、ここでは特定の神学体系に限定せず、あなたがたが選ばれたことを指す。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: 私たちは……知っています
  rationale: 原文では完了分詞で、前節から続く文の中で「知っていて／知っているので」という関係を表す。日本語では節単位でも自然に読めるよう定動詞にしたが、原文にない明示的な理由接続詞は加えなかった。
- source_word: ἀδελφοὶ
  choice: 兄弟たち
  rationale: 文法上の男性複数形を保った。パウロ書簡では信仰共同体全体への呼びかけとして用いられることが多いため、その範囲は脚注で示した。
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: 神に愛されている
  rationale: 完了受動分詞が表す、神に愛された結果として今もその状態にあることを、明瞭で自然な現代日本語にした。
- source_word: ἐκλογὴν
  choice: 選ばれたこと
  rationale: 抽象名詞をそのまま「選び」とすると現代日本語では誰が選ぶのか不自然に曖昧になりやすいため、受動表現で内容を明確にした。特定の予定論体系を持ち込まず、名詞「選び」であることは脚注に残した。
- source_word: ὑμῶν
  choice: あなたがたが
  rationale: ἐκλογήにかかる属格を、日本語では「あなたがたが選ばれたこと」という自然な節に組み替えた。
theological_decisions:
- issue: 教理上議論のあるἐκλογήの訳し方
  choice: あなたがたが選ばれたこと
  alternative: あなたがたの選び／神があなたがたを選んだこと
  rationale: 受動表現により選びの対象がテサロニケの信徒たちであることを示しつつ、選びの仕組みや条件、範囲について本文以上の説明を加えない。「神が」を本文中で補う訳も文脈上は妥当だが、当該句には行為者が明記されていないため採用しなかった。
- issue: ἀδελφοίの共同体的な範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原語の男性複数形を本文に保ちつつ、この呼称が通常は女性を含む教会全体に向けられていることを脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。呼びかけを文頭に置き、原文の語順をおおむね保ちながら、日本語として理解しやすい文構造にした。
