  terminology: 「神に感謝しています」「祈りの中で」「覚えています」は、パウロ書簡の祈りと感謝の文脈にふさわしく、教派的な含意を加えません。「覚える」はμνείαν ποιεῖσθαιの祈りの文脈における自然な訳です。
