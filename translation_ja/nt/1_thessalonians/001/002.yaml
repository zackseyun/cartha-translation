source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: ja
  text: 私たちはいつも、あなたがたすべてのことを神に感謝しています。祈りの中で、あなたがたのことを絶えず[a]覚えています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「絶えず」は、祈りの中であなたがたを覚えることにかかるとも、神への感謝全体にかかるとも取れます。
    reason: 原文の副詞ἀδιαλείπτωςの修飾範囲に関する統語上の曖昧さを保ち、根拠の薄い次節への係り受けは示さないため。
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: 私たちは……感謝し
  rationale: 現在能動直説法一人称複数。パウロの感謝の定型に合う自然な現代日本語とし、感謝の向かう相手である神を明示できる形にした。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: εὐχαριστοῦμενに伴う与格で、感謝を受ける方を示す。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的・反復的な時間を表す副詞として、明瞭で自然な現代日本語を選んだ。
- source_word: περὶ πάντων ὑμῶν
  choice: あなたがた皆のことを
  rationale: περί＋属格の関与・関連の意味と、πάντωνの包括性を保った。日本語では「皆さんのために」よりも、感謝の対象となる事柄を自然に示す。
- source_word: μνείαν ποιούμενοι
  choice: あなたがたのことを覚えています
  rationale: 直訳的には「言及することを行いながら」だが、祈りにおいて人を心に留めて取り上げるという慣用表現であるため、通常の日本語として「覚えています」とした。文脈上の目的語「あなたがた」を補った。
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: 祈りの中で
  rationale: ἐπί＋属格がここでは祈りの際・祈りにおいてという場面を示すため、簡潔で自然な表現とした。
- source_word: ἀδιαλείπτως
  choice: 絶えず
  rationale: 完全に一瞬も途切れないという物理的意味より、たゆまず繰り返す持続性を強く表す語。「いつも」と区別しつつ原文の強調を保つ。
theological_decisions:
- issue: ἀδιαλείπτωςの修飾範囲
  choice: 本文では「祈りの中で……覚えています」に結び付く位置に置き、脚注で曖昧さを示す
  alternative: 節全体の感謝に結び付ける、または次節の「覚えている」に結び付ける
  rationale: ギリシア語では副詞の位置により修飾範囲が一義的ではなく、節区切りも後代のものである。本文の日本語としては最も自然な読みを採りながら、他の統語的可能性を排除しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。パウロ書簡の祈りと感謝にふさわしい落ち着いた格調を保ちつつ、「言及する」のような硬い直訳は避けた。
