id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: ja
  text: あなたがたも、激しい苦難の中で、聖霊による喜び[a]をもってみことばを受け入れ、私たちと主に倣う者となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聖霊の喜び」。聖霊から来る喜び、または聖霊が生み出す喜びという意味に取れる。
    reason: 属格が示す関係には、起源・働き・帰属の幅があるため。
lexical_decisions:
- source_word: μιμηταὶ
  choice: 倣う者
  rationale: 単に付き従うことではなく、模範をまねるという明示的な意味を保ちつつ、現代日本語として自然にした。
- source_word: ἐγενήθητε
  choice: となりました
  rationale: ある状態へ移ったことを表すアオリストの変化の意味を、自然な日本語で示した。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: ここではイエスを指す称号としてのκύριοςを、定着した訳語で表した。
- source_word: δεξάμενοι
  choice: 受け入れ
  rationale: 単に受け取るだけでなく、宣べ伝えられたことばを歓迎して受容した文脈上の意味を自然に表した。分詞と主動詞の関係は、日本語の連用形で保った。
- source_word: τὸν λόγον
  choice: みことば
  rationale: ここでは宣べ伝えられた福音の知らせを指すが、パウロの「ことば」という表現を保ち、「知らせ」と限定しすぎないようにした。
- source_word: ἐν θλίψει πολλῇ
  choice: 激しい苦難の中で
  rationale: θλῖψιςの圧迫や苦しみの意味を明確にしつつ、「患難」が帯びうる終末論的な含みを不用意に持ち込まない表現とした。
- source_word: μετὰ χαρᾶς πνεύματος ἁγίου
  choice: 聖霊による喜びをもって
  rationale: 苦難と対照される喜びが聖霊に由来するという可能性の高い意味を、明瞭で自然な日本語にした。属格の幅は脚注に残した。
theological_decisions:
- issue: χαρᾶς πνεύματος ἁγίουにおける属格の関係
  choice: 聖霊によって与えられる、または生じる喜び
  alternative: 字義的には「聖霊の喜び」で、聖霊に属する喜びとも理解できる
  rationale: 厳しい苦難のただ中にある喜びという文脈から、聖霊をその源または働き手と見る解釈が最も自然である。ただし、ギリシア語の属格自体は関係を一義的に限定しないため、脚注でその幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「倣う者」「苦難」「主」によって簡潔さと品位を保った。語順は日本語として自然になるよう整えながら、苦難の中でみことばを受け入れたことが、使徒たちと主に倣う者となったことに結びつく構造を維持した。
