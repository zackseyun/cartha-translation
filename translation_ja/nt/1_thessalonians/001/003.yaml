id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: ja
  text: 私たちの神、また父である方の御前で、あなたがたの信仰の働き、愛の労苦、そして私たちの主イエス・メシアに対する希望に支えられた忍耐を、絶えず覚えています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は、「忠実」または「信頼」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「メシア」は、ギリシア語の称号「クリストス」の訳。別訳「キリスト」。
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: 絶えず覚えています
  rationale: 前節から続く現在分詞で、継続的に覚えていることを自然な日本語で表す。日本語本文を独立して読めるよう述語として整えた。
- source_word: ἔργου τῆς πίστεως
  choice: 信仰から出た働き
  rationale: 属格を、信仰によって生み出される働きと理解した。単なる「信仰の働き」より関係が明瞭でありながら、πίστις自体は「信仰」と訳している。
- source_word: κόπου τῆς ἀγάπης
  choice: 愛による労苦
  rationale: κόποςが含む骨の折れる努力を「労苦」で表し、属格は愛をその源または動機として示す表現にした。
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: 望みを置くことから生まれる忍耐
  rationale: ὑπομονήを圧迫の中で持ちこたえる「忍耐」とし、望みによって生じる関係を示した。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・メシアに
  rationale: この属格句を「望み」の対象と解し、日本語では助詞「に」で自然に示した。Χριστόςは称号として「メシア」と訳した。
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: 私たちの神であり父である方の御前で
  rationale: 神と父が同じ方を指す密接な関係を「神であり父である方」と明示し、ἔμπροσθενは敬意ある自然な表現「御前で」とした。
theological_decisions:
- issue: πίστιςの意味
  choice: 信仰
  alternative: 真実／信頼
  rationale: この文脈では神への信仰が働きを生み出す意味が最も自然だが、「真実」や「信頼」という語義上の可能性も注記に残した。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味を保つため「メシア」とし、日本語で定着した音訳「キリスト」を注記した。
- issue: 三つの属格表現の関係
  choice: 信仰・愛・望みが、それぞれ働き・労苦・忍耐を生み出す関係として訳す
  alternative: 信仰の働き、愛の労苦、望みの忍耐
  rationale: ギリシア語の簡潔な属格には複数の関係が含まれ得る。文脈上は源・動機を表す理解が有力なので本文で自然に示したが、過度な因果表現は避けた。
translation_notes:
  register: 現代標準日本語の明瞭で品位ある文体。パウロの三項構造を保ちつつ、連続する属格を日本語として理解しやすく展開した。「御前」は聖書的な荘重さを保ちながら現代の読者にも通じる表現。
