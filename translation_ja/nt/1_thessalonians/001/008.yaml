id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: ja
  text: というのも、主のことばがあなたがたのところから響き渡っているからです。それはマケドニアとアカイアだけにとどまりません。あらゆる所で、神に向けられたあなたがたの信仰[a]が広く伝わっています。そのため、私たちは何も語る必要がありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神への信仰」とも訳せる。ギリシア語では、より字義的には「神に向かうあなたがたの信仰」。
    reason: πρὸς τὸν θεόνの方向性を示す表現について、自然な代替訳と字義を提示するため。
lexical_decisions:
- source_word: ἐξήχηται
  choice: 響き渡った
  rationale: 音が発信源から力強く鳴り響く比喩を保つ。完了形が示す現在に及ぶ結果は、後続文脈と日本語の叙述によって表した。
- source_word: ὁ λόγος τοῦ κυρίου
  choice: 主のことば
  rationale: パウロ書簡の定型的な表現を保ち、主に属することば／主についてのことばという属格の幅を狭めない。
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: マケドニアとアカイア
  rationale: 地域名の標準的な音写を用いた。
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: あらゆる所に
  rationale: παντίの分配的な意味とτόπῳの具体性を自然な現代日本語で保った。
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: 神に向けられたあなたがたの信仰
  rationale: πρὸςの方向性を保ちつつ、日本語として理解できる形にした。「神への信仰」より明示的だが、意味を「神を信じること」だけに固定しない。
- source_word: ἐξελήλυθεν
  choice: 広く伝わっている
  rationale: 直訳的な「出て行った」は日本語では意味が不明瞭なため、信仰についての知らせが各地に達し、現在も知られているという完了形の結果を自然に表した。
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: そのため、私たちは……必要がありません
  rationale: ὥστεの結果関係と、χρείαν ἔχεινの必要を表す慣用句を自然に再現した。
- source_word: λαλεῖν τι
  choice: 何も語る
  rationale: 否定を伴うτιを日本語の「何も」で表し、語る内容を補わず原文の簡潔さを保った。
theological_decisions:
- issue: πίστιςの訳語
  choice: 信仰
  alternative: 信実、信頼
  rationale: この文脈では、テサロニケの人々が神に向けて示した信じる応答を指すのが最も自然である。ただしπρὸςの方向性を訳文と注で保ち、単なる内面的同意に狭めない。
- issue: ὁ λόγος τοῦ κυρίουの属格
  choice: 主のことば
  alternative: 主についての知らせ
  rationale: 属格が所属・起源・内容のいずれに重きを置くかを訳文で断定せず、定着した表現によって神学的な幅を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「響き渡った」で原文の聴覚的比喩を保持し、「広く伝わっている」で後半の移動表現が文脈上示す周知の結果を自然に表した。主節の「だけでなく」と地理的範囲の「だけにとどまらず」が重なるため、原文の構造は保ちつつ可読性を優先した。
