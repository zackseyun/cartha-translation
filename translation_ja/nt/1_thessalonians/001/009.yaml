id: 1TH.1.9
reference: 1 Thessalonians 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: ja
  text: というのも、人々自身が、私たちがあなたがたのもとへどのように訪れたか[a]、また、あなたがたがどのように偶像を離れて神に立ち帰り[b]、生ける真の神に仕えるようになったか[c]を、私たちについて語り伝えているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちがあなたがたのもとへした到来が、どのようなものであったか」。この表現は、パウロたちの到来のありさまと、その働きがもたらした結果を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「偶像から神へと向きを変え」。ここでの語は、神への回心を方向転換の比喩で表しています。
    reason: alternative_reading
  - marker: c
    text: 「生ける真の神」は、命のない偶像と対照をなしています。エレミヤ書10章10節参照。
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: その人たち自身が
  rationale: 強意代名詞の強調を保ち、パウロたちが自ら宣伝したのではなく、周囲の人々が進んで語っていることを示す。
- source_word: ἀπαγγέλλουσιν
  choice: 語り伝えている
  rationale: 現在形の継続的な報告のニュアンスを表し、知らせが広く伝えられている文脈にも自然に合う。
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: 私たちがあなたがたの間でどのように受け入れられたか
  rationale: εἴσοδοςの字義は「入って行くこと、訪れ」であるが、ここでは到来のありさまとその結果を含む。「受け入れられた」は日本語として自然に文脈上の意味を伝え、字義的表現は脚注に残す。
- source_word: πῶς ἐπεστρέψατε
  choice: どのように…立ち返り
  rationale: 能動形と方向転換の比喩を保つ。「回心した」のような後代の専門用語に限定せず、神へ向きを転じたことを表す。
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: 偶像を離れて神に立ち返り
  rationale: ἀπόとπρόςが示す出発点と到達点の両方を、自然な日本語の語順で明示する。
- source_word: εἰδώλων
  choice: 偶像
  rationale: 礼拝対象となる像や偽りの神々を指す標準的で直接的な訳語。
- source_word: δουλεύειν
  choice: 仕えるようになった
  rationale: 奴隷的奉仕の意味領域を持つ語だが、ここでは偶像を捨てた後の神への献身的奉仕を表す。「仕える」は宗教的忠誠を自然に伝えつつ、文脈以上に隷属の比喩を強めない。
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: 生けるまことの神
  rationale: 命のない偶像と対照される「生きている」と、偽りでなく真正であるという「まこと」の双方を、簡潔で格調ある日本語で表す。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 前節を根拠づけて説明する接続関係を、現代日本語で明確に示す。
theological_decisions:
- issue: ἐπεστρέψατεによる回心表現の主体性と含意
  choice: 「偶像を離れて神に立ち返り」
  alternative: 「偶像から神へと回心させられ」または「回心し」
  rationale: ギリシア語は能動形で方向転換を描くため、その比喩と文法上の形を保つ。回心における神と人との働きに関する体系的結論を、この一語の訳で先取りしない。
- issue: δουλεύεινが表す神への関係
  choice: 「仕える」
  alternative: 「神の奴隷となる」または「礼拝する」
  rationale: 語は奴隷・奉仕の意味領域に属するが、ここでは神への継続的な忠誠と奉仕を指す。「奴隷となる」は比喩を過度に強め、「礼拝する」だけでは生活全体に及ぶ奉仕を狭めるおそれがある。
- issue: 「生けるまことの神」と偶像との対照
  choice: 神が生きておられ、真正な神であるという二つの形容をともに保持する
  alternative: 「唯一の神」または「真実を語る神」
  rationale: 本文は神の唯一性や誠実さだけに意味を限定せず、命のない偶像に対する生ける神、偽りの礼拝対象に対する真正な神という対照を示すため、原文の緊張をそのまま残す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「生けるまことの神」「仕える」には聖書本文にふさわしい簡潔で格調ある表現を用いた。「というのも…からです」により前節との説明的なつながりを明示した。
