  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: ja
  text: パウロ、シルワノ、テモテから、父である神と主イエス・メシアにある、テサロニケの人々から成る教会[a]へ。あなたがたに恵みと平安がありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「教会」は「集会」とも訳せる。ギリシア語エクレーシアは、ここでは集められた共同体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: パウロ
  rationale: 日本語聖書で定着した人名表記。
- source_word: Σιλουανὸς
  choice: シルワノ
  rationale: 本文のΣιλουανόςを直接反映する表記とし、別形Σίλαςに対応する「シラス」とは区別した。
- source_word: Τιμόθεος
  choice: テモテ
  rationale: 日本語聖書で定着した人名表記。
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: ここでは建物ではなく、召し集められた信者の共同体を指す。現代日本語で自然かつ定着した「教会」を採用し、「集会」の可能性を脚注に示した。
- source_word: Θεσσαλονικέων
  choice: テサロニケの人々
  rationale: 属格複数で、テサロニケに属する人々を表す。「テサロニケ人」より明瞭で自然な現代日本語とした。
- source_word: ἐν
  choice: にある
  rationale: 共同体が神と主イエス・メシアとの関係ないし領域の中に存在することを表すが、その含意を「属する」などに限定せず、原文の幅を保つ。
- source_word: θεῷ πατρὶ
  choice: 父である神
  rationale: 原文に「私たちの」に当たる所有語はない。θεῷとπατρὶの同格関係を明瞭に表した。
- source_word: κυρίῳ
  choice: 主
  rationale: 新約聖書におけるκύριοςの定着した訳語であり、尊称としての意味を保つ。
- source_word: Ἰησοῦ Χριστῷ
  choice: 主イエス・メシア
  rationale: Χριστόςの称号としての意味を「メシア」で明示する。日本語では「イエス・メシア」として称号を自然につないだ。
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の挨拶における神学的・書簡的響きを保つ定着した訳語。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在に限られない、聖書的挨拶としての広がりを持つ定着した訳語。
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: 恵みと平安が、あなたがたにありますように
  rationale: 原文は動詞を省略した挨拶文。日本語では祈願として自然に読めるよう「ありますように」を補ったが、補足であることを脚注に示した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この挨拶でも称号の意味は保たれているため、音写的に定着した「キリスト」ではなく意味を示す「メシア」とした。ただし「キリスト」という慣用訳も脚注に示した。
- issue: ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷが表す関係
  choice: 父である神と主イエス・メシアにある
  alternative: 父である神と主イエス・メシアに属する
  rationale: ἐνを「にある」と訳し、神および主イエスとの結合、関係、存在領域という含みを一つに限定しない。また、同じ前置詞が父と主イエスの双方に並列的にかかる構造を保った。
- issue: 挨拶句の省略動詞
  choice: 「ありますように」を補う
  alternative: 「あなたがたに恵みと平安」
  rationale: 原文の名詞的な挨拶を、日本語として明瞭な祈願文にした。神学的な供与主体を本文で明示する語は補わず、原文以上に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。書簡の差出人と宛先が自然に分かるよう「から」「へ」を用いた。固有名は日本語聖書で広く定着した形を基本としつつ、Σιλουανόςは原文の形を反映して「シルワノ」とした。
