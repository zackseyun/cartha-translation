  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: ja
  text: その結果、あなたがたは、マケドニアとアカイアにいるすべての信者にとっての模範[a]となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「手本」「模範例」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: その結果
  rationale: 前節で述べられたみことばの受容と主および使徒たちへの倣いから生じた結果を示す接続表現であり、ギリシア語の結果的用法を明確に伝える。
- source_word: γενέσθαι
  choice: となりました
  rationale: ὥστεに続くアオリスト不定詞の結果的意味を、自然な日本語の定動詞として表した。
- source_word: ὑμᾶς
  choice: あなたがたは
  rationale: 不定詞句の意味上の主語であり、テサロニケの信徒共同体を指す複数形を明示した。
- source_word: τύπον
  choice: 模範
  rationale: 他の信者が倣うべき具体的な手本を意味する。文脈に適した簡潔で格調ある現代日本語として「模範」を選んだ。
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: すべての信者の
  rationale: 実詞的な現在分詞を「信者」と訳し、τύπονとの関係を自然な日本語の「〜の模範」で表した。「すべて」によりπᾶσινを保持した。
- source_word: ἐν τῇ Μακεδονίᾳ καὶ ἐν τῇ Ἀχαΐᾳ
  choice: マケドニアとアカイアにいる
  rationale: 二地域に属する信者を修飾する形に整え、双方の地名と場所の意味を明確に保った。
