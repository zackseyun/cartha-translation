  terminology: 「御子」「イエス」「死者の中からよみがえらせた」「怒り」は定着した適切な聖書用語である。「来たるべき怒り」はやや文語的な語感を持つが、現代日本語でも十分に理解可能で、原文の終末的な含みを限定せずに保っている。
