reference: 1 Thessalonians 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: ja
  text: また、神が死者の中からよみがえらせた御子、すなわち、来たるべき怒りから私たちを救い出してくださるイエスが、天から来られるのを待ち望むようになったのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμένειν
  choice: 待ち望む
  rationale: 単に時間の経過を待つだけでなく、期待をもって待つ意味を自然な現代日本語で表す。前節の「立ち返った」ことの内容を述べる不定詞のつながりは、「ようになったのです」で示した。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 神が…よみがえらせた御子
  rationale: αὐτοῦの指示対象が前節から続く神であることを日本語で明確にしつつ、「御子」というキリスト論的称号を保った。
- source_word: ἐκ τῶν οὐρανῶν
  choice: 天から来られる
  rationale: ギリシア語は直訳すれば「天々から」だが、日本語では「天から」が自然である。待望の対象が天から現れるという関係を、補足的な「来られる」で明瞭にした。
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: 神が死者の中からよみがえらせた
  rationale: ἐκ τῶν νεκρῶνを「死者の中から」とし、復活を表す定着した自然な日本語を用いた。動作主は文脈上の神である。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: τὸν ῥυόμενον
  choice: 救い出してくださる
  rationale: 現在分詞を、イエスを特徴づける連体節として訳した。「救い出す」により危険から解放する能動的意味を保ち、未来時制に限定しなかった。敬語は御子に対する日本語として自然な敬意を示す。
- source_word: ἐκ τῆς ὀργῆς τῆς ἐρχομένης
  choice: 来たるべき怒りから
  rationale: ὀργήをより広い「裁き」に置き換えず「怒り」とし、ἐρχομένηςの終末論的な到来の意味を「来たるべき」で簡潔に表した。
theological_decisions:
- issue: 「来たるべき怒り」の性質
  choice: 「来たるべき怒り」とし、具体的内容を限定しない
  alternative: 最後の審判、終末の患難、またはより一般的な神の怒りのいずれかに明示的に限定する
  rationale: この節自体は怒りの具体的な形や時期を狭く定義していないため、特定の終末論的体系を持ち込まず、原文の重みと幅を保った。
- issue: 現在分詞ῥυόμενονの時間的な力
  choice: 「救い出してくださる」
  alternative: 「救い出してくださることになる」または「今、救い出しておられる」
  rationale: 目的語が未来に来る怒りであるため文脈には未来性があるが、現在分詞はイエスを恒常的に「救い出す方」として特徴づけてもいる。日本語で未来だけに固定しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、御子については「御子」「来られる」「くださる」により品位ある敬語表現とした。文頭の「また」と末尾の「ようになったのです」は、1:9から続く報告内容であることを反映している。
