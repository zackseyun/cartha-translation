id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: ja
  text: 私たちの福音があなたがたに伝わったのは、ただ言葉だけによるのではなく、力と聖霊と、深い確信[a]とを伴っていたからです。私たちがあなたがたの間で、あなたがたのためにどのような者であったかは、あなたがた自身が知っているとおりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十分な確証」または「大いなる確信」とも訳せる。この確信が宣教者、聞き手、あるいは福音が伝わったあり方のどれに属するかは、原文では明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡における使徒的な良い知らせを指す定着した日本語であり、文脈上も自然である。
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: あなたがたに伝わった
  rationale: 直訳的な「あなたがたに生じた」ではなく、福音が宣教を通して彼らのもとに到来したことを自然な日本語で表す。
- source_word: ἐν λόγῳ μόνον
  choice: ただ言葉だけによるのではなく
  rationale: 単なる言語的宣教と、それに伴う力・聖霊・確信との対比を明確にする。
- source_word: ἐν δυνάμει
  choice: 力と
  rationale: 後続する並列句とともに、福音の到来に伴った力を簡潔に表す。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊と
  rationale: パウロの用法と文脈に従い、神の聖霊を指すものとして訳す。
- source_word: πληροφορίᾳ πολλῇ
  choice: 深い確信
  rationale: 十分な確かさ・確信という語義を自然な日本語で表しつつ、その確信の主体を明示せず、原文の曖昧さを保つ。
- source_word: καθὼς οἴδατε
  choice: あなたがた自身が知っているとおり
  rationale: 読者自身の経験的な認識を根拠として示す比較・確認の働きを表す。
- source_word: οἷοι ἐγενήθημεν
  choice: どのような者であったか
  rationale: 宣教者たちの人物・振る舞いの質を指す。日本語では性別を不必要に補わず、複数の一行を一人称複数で自然に受ける。
- source_word: ἐν ὑμῖν δι’ ὑμᾶς
  choice: あなたがたの間で、あなたがたのために
  rationale: 活動の場が彼らのただ中であったことと、その益のためであったことを保つ。
theological_decisions:
- issue: πνεύματι ἁγίῳ の指示対象
  choice: 「聖霊」とし、神の聖霊を指す
  alternative: 聖なる霊、霊的な力や雰囲気
  rationale: パウロにおける通常の用法と、言葉だけでない神的な働きとの対比が、聖霊を指す理解を支持する。
- issue: πληροφορίᾳ πολλῇ の意味と主体
  choice: 「深い確信」と訳し、確信の主体を明示しない
  alternative: 十分な確証、大いなる確信、完全な確信
  rationale: 原文は、宣教者・受け手・宣教の現れ方のいずれに確信が属するかを明記していないため、その幅を残す。
- issue: οἷοι ἐγενήθημεν の表現
  choice: 「どのような者であったか」
  alternative: どのような者となったか、どのような人間であることを示したか
  rationale: 文脈上は宣教者たちが彼らの間で示した人柄と行動を指す。過度に「証明した」という含みを加えず、γίνομαι の広さを保つ。
- issue: δι’ ὑμᾶς の関係
  choice: 「あなたがたのために」
  alternative: あなたがたのゆえに
  rationale: 文脈では宣教者たちのあり方がテサロニケの人々の益に向けられていたという目的・利益の意味が自然だが、原因の含みも語法上は可能である。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある文体。「伝わった」「伴っていた」により日本語としての自然さを確保しつつ、原文の対比と並列を保持した。「あなたがた」を反復して、宛先と共同体の中での宣教者のあり方を明確にした。
