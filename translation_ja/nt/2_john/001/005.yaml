id: 2JN.1.5
reference: 2 John 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: ja
  text: さて今、婦人よ、私はあなたにお願いします。新しい戒めをあなたに書く者としてではなく、私たちが初めから持っていた戒めに基づいてお願いしているのは、私たちが互いに愛し合うことです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτῶ
  choice: お願いします
  rationale: 単なる質問ではなく依頼を表す文脈なので、「お願いします」が現代日本語として自然であり、「勧めます」ほど強くしない。
- source_word: κυρία
  choice: 婦人よ
  rationale: 呼格の「婦人／女主人」を字義的に訳し、個人の女性、教会の比喩、固有名という可能性を本文で決めつけない。
- source_word: ἐντολὴν καινὴν
  choice: 新しい戒め
  rationale: ヨハネ文書における語句の響きを保つ標準的な訳語。
- source_word: γράφων σοι
  choice: あなたに書く
  rationale: 分詞を日本語の対比構文「書くのではなく」に組み込み、自然に表現した。
- source_word: ἣν εἴχομεν
  choice: 私たちが…持っていた戒め
  rationale: 未完了過去 εἴχομεν を反映しつつ、「初めから」と結び、以前から共有していた戒めを表す。
- source_word: ἀπ’ ἀρχῆς
  choice: 初めから
  rationale: ヨハネ文書で繰り返される表現を簡潔かつ一貫して伝える。
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: すなわち、互いに愛し合おうということです
  rationale: ἵνα 節を戒めの内容として示し、接続法の勧告的な響きを「愛し合おう」で保つ。
theological_decisions:
- issue: κυρία の指示対象
  choice: 本文では字義的に「婦人よ」とし、指示対象を特定しない。
  alternative: 地域教会を擬人化した呼称とする、またはキュリアという固有名とする。
  rationale: ギリシア語自体はいずれの理解も許し得るため、本文では曖昧さを保ち、注で可能性を示す。
- issue: ἵνα 節の機能
  choice: 「戒め」の内容を説明しつつ、勧告の響きを持つ表現とする。
  alternative: 目的として「互いに愛し合うためです」と訳す。
  rationale: 関係代名詞が受ける「戒め」の具体的内容を示す理解が文脈上自然だが、ἵνα の目的・勧告的な含みも完全には消さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「婦人よ」は日常語よりやや改まった呼びかけだが、書簡の文体と原文の呼格に適する。
