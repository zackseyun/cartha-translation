id: 2JN.1.4
reference: 2 John 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: ja
  text: あなたの子どもたちの中の何人かが[a]、私たちが父から受けた戒めのとおりに、真理にあって歩んでいるのを[b]見いだして、私は大いに喜びました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたの子どもたちの中から」。原文は、子どもたち全員ではなく、その中の一部を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「真理に従って生活している」。ここでの「歩む」は、生き方や日々の行いを表す比喩です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: 私は大いに喜びました
  rationale: アオリストの喜びの反応と、λίαν の強意を、自然で品位ある現代日本語で表した。
- source_word: εὕρηκα
  choice: 見いだし
  rationale: 完了形が示す、発見とその結果の持続を意識しつつ、文脈に自然な「見いだす」を用いた。
- source_word: ἐκ τῶν τέκνων σου
  choice: あなたの子どもたちの中に
  rationale: ἐκ＋属格の部分を表す用法を保ち、全員とは限らず、その中の者たちを指すことが伝わる表現とした。
- source_word: περιπατοῦντας ἐν ἀληθείᾳ
  choice: 真理のうちを歩んでいる
  rationale: ヨハネ文書に特徴的な倫理的比喩「歩む」を保持し、「真理」を生活の領域・基準として示す表現にした。
- source_word: ἐντολὴν ἐλάβομεν
  choice: 私たちが…受けた戒め
  rationale: 複数主語をそのまま保ち、ヨハネ文書で重要な ἐντολή を「戒め」と訳した。
- source_word: παρὰ τοῦ πατρός
  choice: 父から
  rationale: 原文どおり「父」を保持し、「神」などの説明語を補わなかった。
theological_decisions:
- issue: 「父」の指示対象
  choice: 「父」とのみ訳す
  alternative: 「父なる神」
  rationale: ヨハネ文書の文脈では神を指すが、原文にない「神」を本文へ補わず、称号そのものを保った。
- issue: 「あなたの子どもたち」の範囲
  choice: 「子どもたちの中に」として部分性を示す
  alternative: 子どもたち全員が真理のうちを歩んでいるように訳す
  rationale: ἐκ＋属格は集団の一部を指し、全員であるとは明言していないため。
- issue: 「真理のうち」の意味
  choice: 比喩と意味の広がりを保つ
  alternative: 「誠実に」または「真理に従って生きる」と限定する
  rationale: 単なる誠実さ以上に、啓示された真理に即した生を含み得るため、解釈を一つに狭めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見いだす」「戒め」「歩む」により、ヨハネ文書の語彙的な響きと品位を保った。原文末尾の「父から受けた戒めのとおり」は、日本語で修飾関係が明確になるよう「歩んでいる」の前に置いた。
