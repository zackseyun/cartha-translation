  to: 愛とは、私たちがその方の戒めに従って歩むことです。これが、あなたがたが初めから聞いていたとおりの戒めです。すなわち、あなたがたがそれに従って歩むことです。[a]
  rationale: 原文の「これが戒めです」という提示と、「初めから聞いたとおり」という修飾関係を日本語で明瞭に再現した。「戒め」と「愛」のいずれも取り得る末尾の女性単数代名詞の曖昧さは、本文では直近の「戒め」として自然に訳し、代替理解を脚注に保持した。
