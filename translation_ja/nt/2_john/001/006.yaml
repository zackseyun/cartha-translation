reference: 2 John 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: ja
  text: 愛とは、私たちがその方の戒めに従って歩むことです。これが、あなたがたが初めから聞いていたとおりの戒めです。すなわち、あなたがたがそれに従って歩むことです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の女性単数代名詞は「愛」を指すとも理解できる。その場合、「あなたがたが愛のうちを歩むこと」と訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: 愛
  rationale: ヨハネ文書での語彙的なつながりを保ちつつ、現代日本語で自然かつ明瞭な訳語である。
- source_word: ἵνα περιπατῶμεν
  choice: 私たちが……歩むこと
  rationale: ἵνα がここでは愛の実践的内容を説明していることを示し、「歩む」という倫理的比喩も保持する。
- source_word: περιπατέω
  choice: 歩む
  rationale: 単に「生きる」と平板化せず、節内で繰り返されるヨハネ的な歩行の比喩を保つ。
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: その方の戒めに従って
  rationale: κατά の規範・一致の意味を自然な日本語で表し、複数形は集合的な「戒め」で表現する。
- source_word: ἐντολάς / ἐντολή
  choice: 戒め／その戒め
  rationale: 同一語根のつながりと、複数から単数への修辞的な移行を文脈上できる限り保つ。後半の定冠詞は直前の内容を受ける「その」で表す。
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: あなたがたが初めから聞いていたとおり
  rationale: ヨハネ的な「初めから」を保持し、過去に聞いて以来の既知性が自然に伝わる日本語とする。
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: あなたがたがその中を歩むこと
  rationale: 前置詞句と歩行の比喩を保持する。「その」は直近の女性単数名詞 ἐντολή を受ける本文としつつ、ἀγάπη を指す可能性は脚注に残す。
theological_decisions:
- issue: 末尾の αὐτῇ の指示対象
  choice: 直前の単数形「戒め」を指すものとして本文を構成する
  alternative: 冒頭の「愛」を指し、「愛のうちを歩む」と理解する
  rationale: 文法上最も近い女性単数の先行詞は ἐντολή だが、ἀγάπη も女性単数であり、内容上も密接に結びつくため、曖昧さを脚注で明示する。
translation_notes:
  register: 明瞭で品位ある現代標準語。「歩む」を二度用いて原文の反復と倫理的比喩を保持した。指示対象の曖昧さは本文で一方に限定しすぎず、脚注で明示した。
