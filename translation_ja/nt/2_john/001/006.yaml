  source_fidelity: 後半のギリシア語は「これが戒めです。あなたがたが初めから聞いたとおり、あなたがたがその中を歩むためです」という順序で、「初めから聞いた」ものを「戒め」として提示しています。草案は「…聞いていたとおり、その戒めとは…」と語順と係りを組み替えており、意味は近いものの、原文の提示構造が弱まっています。また、「その中を歩む」は「戒め」を先行詞とする場合、日本語として場所的に響き不自然です。
  naturalness: 「愛とは…ことです」は明快で、「歩む」の反復も適切です。ただし「その中を歩む」は現代標準語では不自然なため、「それに従って歩む」とするのが自然です。後半を「これが…戒めです」として原文の強調と流れを保ちます。
  terminology: 「愛」「戒め」「歩む」はヨハネ文書の語彙的連関を適切に保っています。「その方」はやや婉曲ながら、原文の所有代名詞を不必要に神・キリストのいずれかへ限定しない安全な表現です。
