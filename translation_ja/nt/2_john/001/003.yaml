id: 2JN.1.3
reference: 2 John 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: ja
  text: 恵みとあわれみと平安は、私たちとともに、父なる神から、また父の御子[b]であるイエス・メシア[a]から、真理と愛のうちにあるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イエス・キリスト」。ギリシア語の称号「クリストス」は「油を注がれた者」を意味し、ここでは称号としての意味を示すため「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: 直訳「父の子」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: あります
  rationale: 未来直説法が表す確かな言明を、日本語では文脈上未来も表せる非過去形「あります」で自然に示した。「ありますように」という祈願にはしなかった。
- source_word: μεθ’ ἡμῶν
  choice: 私たちとともに
  rationale: μετά＋属格の基本的な共同・同伴の意味を保ち、書簡の祝福の文脈に合う表現とした。
- source_word: χάρις ἔλεος εἰρήνη
  choice: 恵みとあわれみと平安
  rationale: 三つの主語を原文の順序どおりに保った。「あわれみ」は現代語として理解でき、聖書的な荘重さも保つ。
- source_word: παρὰ θεοῦ πατρός
  choice: 父なる神から
  rationale: παρά＋属格の源を「から」で示した。原文にない「私たちの」は補わず、θεοῦ πατρόςを自然な定着表現で訳した。
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアから
  rationale: παράの源の意味を示し、Χριστόςは固有名ではなく称号として機能するため「メシア」とした。日本語で述語とのつながりを明確にするため「与えられ」を補った。
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: 父の御子である
  rationale: イエス・メシアを父の子と同定する同格関係を、日本語で明瞭かつ自然に表した。「御子」は敬意を含む定着した聖書語である。
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: 真理と愛のうちに
  rationale: ἐν＋与格を「のうちに」とし、冠詞のない二名詞の質的な意味を保った。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςがイエスに付された称号であることを見えやすくした。日本語で広く知られる「キリスト」も脚注に代案として残した。
- issue: 「父の御子」とイエス・メシアの関係
  choice: 「父の御子である」による同格的な同定
  alternative: 「父の御子」をより緩やかな後置修飾として訳す
  rationale: 属格句は直前のイエス・メシアを同定する同格と取るのが最も自然であり、本文以上の教理表現を加えずにそのキリスト論的な力を保つ。
- issue: ἔσταιの発話機能
  choice: 確かな言明として「あります」
  alternative: 祈願として「ありますように」
  rationale: 形態は未来直説法であり、願望法や命令法ではないため、祝福を願う表現に変えず断定性を保った。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、書簡の祝福にふさわしい品位を保った。原文の二度のπαράは「父なる神から、また…イエス・メシアから」と対応させた。日本語では「恵み…は…から…あります」だけでは不自然になりやすいため、源を表す関係を明確にする「与えられ」を最小限補った。
