- from: 長老から、選ばれた婦人[a]とその子どもたちへ。私はあなたがたを真理にあって[b]愛しています。私だけでなく、真理を知るに至ったすべての人も、あなたがたを愛しています――
  to: 長老から、選ばれた婦人[a]とその子どもたちへ。私がその子どもたちを真理にあって[b]愛しているのは、私だけではありません。真理を知るに至ったすべての人もそうです――
  rationale: 愛の直接目的語を「その子どもたち」として、οὓςとτοῖς τέκνοιςの男性複数の照応を反映しました。後半は「そうです」として、原文で省略される「その子どもたちを愛している」を自然に補っています。注bを調整し、ἐν ἀληθείᾳの誠実さを表す読みと「真理」に関わる読みの双方を保存しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:44:41Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の「あなたがたを」は、男性複数の関係代名詞οὓςが直接には男性複数の「子どもたち」（τοῖς τέκνοις）を受ける点を曖昧にして、婦人をも愛の直接目的語に含めています。日本語では「その子どもたち」を明示して原文の文法的照応を保つのが安全です。完了分詞ἐγνωκότεςの「知るに至った」、ἐν ἀληθείᾳの「真理にあって」、および節末の継続を示すダッシュは適切です。
  naturalness: 「その子どもたちを真理にあって愛しているのは、私だけではありません。真理を知るに至ったすべての人もそうです」は、書簡として自然で明瞭です。「そうです」により、後半で原文が省略する動詞と目的語を不必要に繰り返さず補えます。
  terminology: 「長老」「選ばれた婦人」「子どもたち」「真理」はいずれも適切です。「婦人」はやや改まった語ですが、κυρίαへの敬意ある呼びかけとして許容されます。注aは教会を指す可能性と人名キュリアの可能性を適切に保存しています。注bには、様態としての「真実に」だけでなく、ヨハネ文書的な「真理のうちに」という読みも明記するほうが、本文訳の含意に対応します。
  issues:
