  - severity: low
    issue: 注bが「真理にあって」の『真理』という語の領域的・ヨハネ的含意を代替読みに反映していない。
    rationale: ἐν ἀληθείᾳは「真実に」と読める一方、「真理のうちに／真理において」とも読める。後者を注記すれば本文訳が保つ両義性がより明確になる。
