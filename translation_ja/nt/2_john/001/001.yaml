id: 2JN.1.1
reference: 2 John 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: ja
  text: 長老から、選ばれた婦人[a]とその子どもたちへ。私がその子どもたちを真理にあって[b]愛しているのは、私だけではありません。真理を知るに至ったすべての人もそうです――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「選ばれた婦人」は、ある特定の女性を指すとも、一つの教会を女性になぞらえた表現とも考えられます。また、キュリアを人名と見る可能性もあります。
    reason: alternative_reading
  - marker: b
    text: 「真理にあって」は、「真実に」とも、「真理のうちに」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: 長老
  rationale: 書簡冒頭の自称として、単なる年齢よりも、共同体で認められた立場を示す表現と考えられる。「長老」は年齢・尊称・指導的立場の含みを保ちつつ、日本語の聖書文体でも自然である。
- source_word: ἐκλεκτῇ κυρίᾳ
  choice: 選ばれた婦人
  rationale: ἐκλεκτῇを「選ばれた」、κυρίᾳを敬意ある普通名詞「婦人」とした。実在の女性、教会を女性として表した呼称、または固有名「キュリア」の可能性を本文で限定しない。
- source_word: τοῖς τέκνοις αὐτῆς
  choice: その子どもたち
  rationale: τέκναは性別を限定しないため「子どもたち」とした。実子とも、教会の構成員を指す比喩とも読める表現を保つ。
- source_word: οὓς ἐγὼ ἀγαπῶ
  choice: 私はあなたがたを…愛しています
  rationale: 男性複数の関係代名詞は、婦人と子どもたちからなる受取人たち、または子どもたちを人格的に指し得る。日本語では宛先全体を自然に受ける「あなたがた」とし、ἀγαπάωは簡潔に「愛しています」とした。
- source_word: ἐν ἀληθείᾳ
  choice: 真理にあって
  rationale: 誠実に、真実にという様態と、ヨハネ文書に特徴的な「真理」の領域・基準という響きをともに残すため、「真理にあって」とした。
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: 私だけでなく…すべての人も
  rationale: 著者一人に限らず、より広い共同体も愛しているという対比と強調を、自然な日本語の構文で保った。
- source_word: οἱ ἐγνωκότες τὴν ἀλήθειαν
  choice: 真理を知るに至ったすべての人
  rationale: 完了分詞が示す、以前に知るようになり現在も知っている状態を「知るに至った」で表した。「真理」は直前のἀληθείᾳとの語の連関も示す。
theological_decisions:
- issue: ἐκλεκτῇ κυρίᾳの指示対象
  choice: 「選ばれた婦人」と訳し、表面上は女性への呼びかけとしながら、教会の擬人化という可能性も残した。
  alternative: 特定のキリスト者女性、地域教会とその構成員、または「キュリア」という名の女性。
  rationale: ギリシア語だけでは指示対象を確定できないため、本文で一つに限定せず、固有名の可能性を注で示す。
- issue: ἐν ἀληθείᾳの意味
  choice: 「真理にあって」とし、誠実な愛と、真理を基盤・領域とする愛の両方を響かせた。
  alternative: 「心から」「真実に」「真理のうちに」。
  rationale: 単に「心から」とするとヨハネ文書における「真理」の神学的反響が失われる一方、「真理のうちに」だけでは様態の意味が弱まり得るため、両義性を比較的よく保つ表現を採った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、書簡の挨拶にふさわしい簡潔で品位ある調子とした。「婦人」「真理にあって」はやや改まった表現だが、原文の敬意とヨハネ的な語の重なりを保つために採用した。節末は次節へ文が続くことを示すためダッシュで結んだ。
