id: 2JN.1.9
reference: 2 John 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: ja
  text: 先へ進み[a]、メシアの教え[b]にとどまらない人はだれでも、神を持っていません。この教えにとどまる人こそ、父と子の両方を持っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「行き過ぎる」または「先走る」とも訳せる。写本によっては、「先へ進む」に当たる語の代わりに「踏み越える」とある。
    reason: textual_variant
  - marker: b
    text: 「メシアの教え」は、メシアが授けた教えとも、メシアについての教えとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: 先へ進み……者は皆
  rationale: πᾶςと冠詞付き分詞による一般的な表現を「者は皆」とし、προάγωνの前進する比喩を「先へ進み」で保った。文脈上は正しい教えを越えて進む否定的な意味だが、本文では「行き過ぎる」と解釈を限定しなかった。
- source_word: μὴ μένων
  choice: とどまらない
  rationale: ヨハネ文書で重要なμένωの継続・定住の含みを、現代日本語として自然な「とどまる」で表した。
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: メシアの教えに
  rationale: διδαχήは平明な「教え」とした。Χριστόςは称号として「メシア」と訳し、「メシアの教え」という属格表現によって、メシアが授けた教えとメシアについての教えの両方の可能性を残した。
- source_word: θεὸν οὐκ ἔχει
  choice: 神を持っていません
  rationale: ἔχειの強く簡潔な表現を保ち、「神との交わりがありません」などの説明的解釈を本文に加えなかった。
- source_word: ὁ μένων ἐν τῇ διδαχῇ, οὗτος
  choice: その教えにとどまる者こそ
  rationale: 冠詞付き分詞を「者」とし、指示代名詞οὗτοςの強調を係助詞「こそ」で自然に表した。
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: 御父と御子の両方を持っています
  rationale: 相関するκαὶ…καὶを「両方」で示し、「御父」「御子」という人格的称号を明示した。
theological_decisions:
- issue: προάγωνの意味と異読
  choice: 先へ進み
  alternative: 行き過ぎる／先走る／（異読に基づき）教えを踏み越える
  rationale: SBLGNT本文はπροάγωνであり、παραβαίνωνではない。前進の比喩を本文に残しつつ、文脈上の否定的な意味と異読は脚注で示した。
- issue: 「メシアの教え」の属格
  choice: メシアの教え
  alternative: メシアが授けた教え／メシアについての教え
  rationale: τοῦ Χριστοῦは主格的属格とも目的格的属格とも理解できるため、日本語でも両義性を保った。
- issue: Χριστόςの称号
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号として機能しているため「メシア」とした。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、ヨハネ文書の簡潔で断定的な調子を保った。「神を持つ」は日常的には unusual だが、原文の神学的に強い言い方を説明へ置き換えず維持した。
