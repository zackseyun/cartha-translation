  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: ja
  text: というのは、その人にあいさつの言葉をかける者は、その人の悪い行いに加わっているのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λέγων
  choice: 言う者
  rationale: 定冠詞を伴う現在分詞の実名詞的・一般的な用法を、簡潔な現代日本語で表した。
- source_word: γάρ
  choice: からです
  rationale: 前節の禁止の理由を示す説明的な接続の働きを、文末の理由表現で自然に示した。
- source_word: αὐτῷ
  choice: その人に
  rationale: 前節で述べられた人物を指す代名詞であり、文脈上の指示を過度に説明せず明確にした。
- source_word: χαίρειν
  choice: 「ごきげんよう」
  rationale: ここでは「喜ぶ」という字義ではなく、定型的なあいさつとして用いられている。引用形式を保ちつつ、日本語でもあいさつの言葉として理解できる表現を選んだ。
- source_word: κοινωνεῖ
  choice: 加わることになる
  rationale: 与格を伴い、他者の行いへの参与・共有を表す。単なる接触ではなく関与を含む一方、「加担する」ほど解釈を強めない表現とした。
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: その人の悪い行い
  rationale: ἔργαを「行い」、πονηράを道徳的意味の「悪い」とし、修飾関係を明瞭に保った。
theological_decisions:
- issue: あいさつが単なる礼儀を指すのか、歓迎・支持による関与を指すのか
  choice: 本文では定型的なあいさつと悪い行いへの参与との結び付きをそのまま示し、文脈上の歓迎・支持の含みは脚注で説明する。
  alternative: あらゆる場面で礼儀上のあいさつそのものを禁じていると明示する。
  rationale: χαίρειν自体は慣用的なあいさつだが、前節の「家に迎える」こととκοινωνεῖの参与の意味から、偽教師の活動を受け入れ支持する文脈がある。本文には解釈を過剰に織り込まず、緊張を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ごきげんよう」は日常語としてやや改まった響きがあるが、χαίρεινの引用された定型あいさつという性格を保つために採用した。理由を示すγάρは、日本語として自然になるよう文末の「からです」で表した。
