  naturalness: 現行文は明瞭ですが、「失うことなく、十分な報いを受けるためです」では逆接・対比が弱く、目的節としてもやや説明調です。「かえって」を補うことで、現代標準語として自然に対比が伝わります。
  terminology: 「報い」は μισθός にふさわしく、「十分な」は πλήρης の完全さをこの文脈で自然に表します。「労して得たもの」は理解可能ですが、働きの結果を指すことがより明瞭な「労してきた成果」とします。異読の脚注は底本と英語監査記録に整合しています。
