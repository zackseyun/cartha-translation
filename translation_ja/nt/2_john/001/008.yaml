source:
  edition: SBLGNT
  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: ja
  text: 自分自身に気をつけなさい。私たちが労してきた成果を失わず、かえって十分な報いを受けるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちが労してきた成果」ではなく、「あなたがたが労してきた成果」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: 自分自身に気をつけなさい
  rationale: 現在命令形の継続的な警戒と、再帰代名詞によって読者自身へ向けられた注意を、明瞭で自然な現代日本語で表した。
- source_word: ἵνα μὴ ἀπολέσητε
  choice: 失うことなく
  rationale: ἵναと接続法が示す、避けるべき結果を目的表現の中で自然に示した。ここでのἀπόλλυμιは滅ぼすことではなく、労苦の実を失うことを指す。
- source_word: ἃ εἰργασάμεθα
  choice: 私たちが労して得たもの
  rationale: 底本の一人称複数を保持した。ἐργάζομαιの労苦と、その結果として残るものの双方が日本語で伝わるようにした。
- source_word: μισθὸν πλήρη
  choice: 十分な報い
  rationale: μισθόςはこの勧告の文脈では「賃金」より「報い」が自然であり、πλήρηはその報いを欠けなく受ける意味として「十分な」とした。
- source_word: ἀπολάβητε
  choice: 受ける
  rationale: 文脈上明確な「受け取る」の意味を簡潔に表した。「取り戻す」という含意は確定できないため加えなかった。
theological_decisions:
- issue: εἰργασάμεθαの人称に関する本文異読
  choice: 私たちが労して得たもの
  alternative: あなたがたが労して得たもの
  rationale: 提示されたSBLGNT本文は一人称複数であり、著者側の働き人たちの労苦を指すため、これを本文に採用した。読者自身の労苦を指す二人称複数の異読は、意味上重要なので脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。命令の警告性を保ちつつ、過度に古風な「みずからを慎みなさい」などは避けた。脚注記号[a]は本文中に明示した。
