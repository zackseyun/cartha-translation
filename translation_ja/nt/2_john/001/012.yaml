source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: ja
  text: あなたがたに書くことはたくさんありますが、紙と墨で書こうとは思いませんでした。むしろ、あなたがたのところへ行って、顔を合わせて話せることを願っています。あなたがたの喜び[a]が満ちあふれるようにです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちの喜び」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: あなたがたに書きたいことはたくさんありますが
  rationale: 分詞構文の譲歩的な流れを自然な日本語の「ありますが」で表し、Πολλάの複数的な内容を「ことはたくさん」とした。
- source_word: οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος
  choice: 紙と墨で書こうとは思いませんでした
  rationale: βούλομαιの意志を「思う」で表し、διάの手段の意味を「で」によって保った。χάρτηςとμέλανは平明に「紙」と「墨」とした。
- source_word: ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: あなたがたのところへ行き…たいと願っています
  rationale: πρὸς ὑμᾶςの方向性と、訪ねて直接会うという文脈を「ところへ行き」で表した。ἐλπίζωは単なる予定ではなく期待を示すため「願っています」とした。
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: 顔と顔を合わせて話したい
  rationale: 字義的な「口と口」は現代日本語で誤解を招くため、直接対面して語るという慣用的意味を、原文の反復もある程度残す「顔と顔を合わせて」で表した。
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: そうして、あなたがたの喜びが満ちるためです
  rationale: ἵναの目的を「ためです」で示し、完了分詞と接続法が表す満ちた状態を簡潔な「満ちる」で表した。本文のὑμῶνに従い「あなたがたの」とした。
theological_decisions:
- issue: 喜びの主体をめぐる代名詞の本文異読
  choice: あなたがたの喜び
  alternative: 私たちの喜び
  rationale: 提示されたSBLGNT本文のὑμῶνに従った。一方、ἡμῶνを読む写本もあり、喜びの主体に関わるため、異読を脚注に明記した。
translation_notes:
  register: 明瞭で現代的ながら、書簡にふさわしい落ち着いた丁寧体を用いた。「顔と顔を合わせて」は原文の具体性を残しつつ、現代日本語で自然に理解できる表現である。
