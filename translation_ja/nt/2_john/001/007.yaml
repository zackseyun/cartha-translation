reference: 2 John 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: ja
  text: というのも、多くの人を惑わす者が世に出て行ったからです。彼らは、肉体をもって来られるイエス・メシアを告白しません。[a] そのような者こそ、人を惑わす者であり、反キリストです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉体をもって来られたイエス・メシア」とも訳せます。ギリシア語は直訳すると「肉において来る」であり、イエスが真に肉体を備えた人として来られたことを告白する表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 前節の勧めの理由を示す接続語として、説明の流れが明確になる自然な日本語にした。
- source_word: πολλοὶ πλάνοι
  choice: 人を惑わす者が大勢
  rationale: πλάνοςは、単に本人が迷っている人ではなく、他者を誤りへ導く者を指す。後半の単数形とも語彙上のつながりを保った。
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: 世に出て来た
  rationale: 公に活動の場へ出たことを表し、κόσμοςを過度に神学的な『世界体制』などと限定しない。
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: 彼らは……告白しません
  rationale: 冠詞付き分詞が先行する『惑わす者』を説明する構造を、明瞭で自然な文にした。ὁμολογέωの公的に言い表す含みを『告白する』で保持した。
- source_word: Ἰησοῦν Χριστόν
  choice: イエスが……メシアである
  rationale: Χριστόςはここではイエスについて告白される称号として前景化しているため、『キリスト』ではなく称号の意味を示す『メシア』とした。
- source_word: ἐρχόμενον ἐν σαρκί
  choice: 肉体をもって来られる
  rationale: 現在分詞『来る』の形を保ちつつ、ἐν σαρκίが真の身体性を指すことを自然な日本語で表した。完了した過去だけに限定する訳は本文に入れず、脚注で示した。
- source_word: οὗτός ἐστιν
  choice: このような者こそ
  rationale: 複数の者について述べた後の単数指示詞を、該当する一人一人を類型化する表現として自然に再現した。『こそ』により同定の力を表した。
- source_word: ὁ πλάνος
  choice: 人を惑わす者
  rationale: 前半のπλάνοιとの語彙的一貫性を保った。
- source_word: ὁ ἀντίχριστος
  choice: 反キリスト
  rationale: ヨハネ文書で定着した神学用語として、日本語で一般的な『反キリスト』を用いた。
theological_decisions:
- issue: Χριστόςの訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは名前の一部というより、イエスについて告白される称号として機能しているため。
- issue: ἐρχόμενον ἐν σαρκίの時制・相
  choice: 肉体をもって来られる
  alternative: 肉体をもって来られた
  rationale: ギリシア語の現在分詞『来る』を本文で保持し、受肉を過去の完了行為だけに言い換えない。ただし日本語では過去の来臨を指す理解も可能なので脚注に残した。
- issue: σάρξの意味
  choice: 肉体
  alternative: 罪深い性質
  rationale: このキリスト論的文脈では、実際の人間としての身体性を指し、道徳的な罪性を意味しない。
- issue: 単数形 οὗτος の指示
  choice: このような者こそ
  alternative: これこそ
  rationale: 直前の複数の惑わす者のうち、その告白を拒む者を一人ずつ類型として同定する含みを保つ。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、告白、メシア、反キリストという本文上重要な用語を保持した。長い一文は二文に分け、論理関係は『というのも……からです』で明示した。
