source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: ja
  text: だれかがあなたがたのところに来て、この教えを携えて来ないなら[b]、その人を家に迎え入れてはなりません。また、その人に挨拶の言葉をかけてもなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その人に『喜べ』と言ってはならない」。ここで「喜べ」は当時の一般的な挨拶の言葉。したがって「その人に挨拶してはならない」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 文脈上、これは「この教え」を携えずに来る者、すなわち周囲の節に示された使徒的な告白から外れた内容を伝える巡回教師を念頭に置いている可能性が高い。
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: だれかが…なら
  rationale: 不特定の人物について一般的な条件を示す表現として、現代日本語で自然な形にした。
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: あなたがたのところに来て
  rationale: 受け手たちのもとへ来るという移動の意味を直接表し、教会への公式訪問などの解釈は本文に加えなかった。
- source_word: ταύτην τὴν διδαχήν
  choice: この教え
  rationale: διδαχήの内容を指す意味と指示詞ταύτηνを明確に保ち、専門用語的に響きやすい「教理」は避けた。
- source_word: οὐ φέρει
  choice: 携えていない
  rationale: 教えを持って来る、または伝えるために携えて来るという比喩的な用法を、日本語として自然に保った。
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: その人を家に迎え入れてはなりません
  rationale: λαμβάνωの受け入れる意味と、εἰς οἰκίανが示す具体的なもてなしの場面を一続きの自然な日本語で表した。ギリシア語に明示されない所有者は補わず、「家」とした。
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: その人に挨拶の言葉をかけてもなりません
  rationale: χαίρεινが挨拶の定型句として機能し、λέγετεが「言う」を表す構造を反映した。「挨拶してはならない」より原文の語形を残しつつ、日本語として理解できる表現にした。
theological_decisions:
- issue: この教えを携えない者に対する禁止の範囲
  choice: その人物を家に迎え入れず、挨拶の言葉もかけないという原文の具体的な命令をそのまま示した。
  alternative: あらゆる社会的接触を全面的に禁じる、または教会教師として公認する場合だけを禁じる、と明示する。
  rationale: 周辺文脈は使徒的告白から外れた教えを携える巡回教師を念頭に置いている可能性が高いが、本文自体は「家」と「挨拶」という具体的な語だけを用いる。適用範囲を翻訳で狭めたり広げたりせず、解釈上の緊張を保った。
- issue: αὐτόν／αὐτῷの性と数
  choice: その人
  alternative: 彼、またはそのような人々
  rationale: 原文の単数を保ちながら、総称的な条件文に自然な現代日本語とした。男性形を持つギリシア語代名詞を、日本語で不必要に男性限定とはしなかった。
translation_notes:
  register: 明快で品位ある現代標準語。「携える」は日常語よりやや改まっているが、教えを持って来るという原文の比喩に適し、聖書本文の文体としても理解しやすい。「迎え入れる」により家での受け入れともてなしを自然に示した。
