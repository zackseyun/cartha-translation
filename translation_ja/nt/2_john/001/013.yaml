  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: ja
  text: あなたの選ばれた姉妹の子どもたちが、あなたによろしくと言っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: よろしくと言っています
  rationale: 手紙の結びにおける挨拶の伝言を、現代日本語で自然かつ明確に表す。単数動詞だが、中性複数主語との一致はギリシア語として通常であり、日本語では複数主語として訳す。
- source_word: τὰ τέκνα
  choice: 子どもたち
  rationale: 複数形を明示し、字義どおり自然に訳す。
- source_word: τῆς ἀδελφῆς σου
  choice: あなたの姉妹の
  rationale: 「姉妹」が実の姉妹か、信仰共同体を指す比喩かという本文上の含みを保ち、特定の解釈に限定しない。
- source_word: τῆς ἐκλεκτῆς
  choice: 選ばれた
  rationale: ἐκλεκτόςの受動的な意味合いを保ちながら、現代日本語で分かりやすく表す。誰に選ばれたかは本文に明示されないため補わない。
theological_decisions:
- issue: 「選ばれた姉妹」の指示対象
  choice: 「選ばれた姉妹」と訳し、個人か教会かを確定しない
  alternative: 「選ばれた教会」または特定の女性を示す表現にする
  rationale: 原文はἀδελφήを用いており、個人と共同体の双方の理解があり得る。翻訳で曖昧さを解消しない。
- issue: ἐκλεκτήの主体
  choice: 「選ばれた」とだけ訳す
  alternative: 「神に選ばれた」と補う
  rationale: 神による選びが文脈上想定され得るものの、この節では選ぶ主体が明記されていないため、本文には補足しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。結語の挨拶として品位を保ちつつ、硬すぎる「挨拶を送っています」は避けた。「姉妹」の解釈上の余地をそのまま保持する。
