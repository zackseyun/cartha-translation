id: 2JN.1.2
reference: 2 John 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: ja
  text: 私たちのうちにとどまっている[a]真理のゆえです。この真理は、これからも永遠に私たちとともにあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「とどまっている」は「宿っている」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἀλήθειαν
  choice: 真理のゆえです
  rationale: διά＋対格が示す理由・根拠を「ゆえ」とし、前節に述べられた愛の根拠であることを表した。ἀλήθειαは意味を限定せず「真理」とした。
- source_word: τὴν μένουσαν ἐν ἡμῖν
  choice: 私たちのうちにとどまっている
  rationale: 現在分詞μένουσανの継続的な意味を「とどまっている」で表し、ἐν ἡμῖνはヨハネ文書の語法に沿って「私たちのうちに」とした。
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: この真理は、これからも……私たちとともにあります
  rationale: 未来形ἔσταιを「これからも」で明示し、μετά＋属格を自然な日本語の「ともに」で表した。読みやすさのため文を分け、主語「この真理」を補った。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: 時の限りなく続くことを表す定型句として、明瞭で自然な「永遠に」を用いた。
theological_decisions:
- issue: ヨハネ文書における「真理」の意味
  choice: 「真理」とだけ訳し、指示内容を限定しない
  alternative: 「福音の真理」「真実の教え」
  rationale: 文脈上、福音、キリスト、神の啓示に根差す現実などを含みうるが、原文はそれを明示的に限定していないため、その広がりと神学的含意を保った。
- issue: ἐν ἡμῖνの範囲
  choice: 「私たちのうちに」
  alternative: 「私たちの間に」
  rationale: 共同体のただ中という理解も可能だが、ヨハネ文書での内在を示す表現を保ちつつ、個々人と共同体の双方を排除しない訳とした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文としての品位を保つ文体とした。原文では前節に続く理由句だが、単独でも理解できるよう「です」で受け、後半は二文目として整えた。
