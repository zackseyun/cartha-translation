id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: ja
  text: これは、神の正しい裁きのしるしであり、あなたがたが神の国にふさわしいと認められるためのものです[b]。あなたがたは、その神の国のために苦しみを受けてもいるのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「その結果、あなたがたが……ふさわしいと認められることになります」とも訳せる。ギリシア語の構文は、目的または結果を表し得る。
    reason: alternative_reading
  - marker: c
    text: 「その神の国のゆえに」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: しるし
  rationale: 何らかの現実を示す証拠・徴候を表す語。「しるし」は、決定的な「証明」と言い切らず、神の正しい裁きを指し示すという推論的な力を自然な日本語で保つ。ギリシア語は前節に続く動詞のない句なので、「これは……です」を補った。
- source_word: δικαίας κρίσεως
  choice: 正しい裁き
  rationale: δίκαιος が示す道徳的な正しさを明瞭に伝えつつ、現代の一般読者にも自然な聖書語として訳した。
- source_word: εἰς τὸ καταξιωθῆναι
  choice: ふさわしいと認められるため
  rationale: 受動態の καταξιόω は、本質的にふさわしい者へ変えることではなく、ふさわしいと認定することを表す。εἰς τό＋不定詞には目的と結果の両義性があるため、本文では自然な目的表現を採り、別の可能性を脚注に残した。
- source_word: βασιλείας τοῦ θεοῦ
  choice: 神の国
  rationale: 定着した簡潔な表現であり、属格句の意味と聖書的な重みを保つ。
- source_word: ὑπὲρ ἧς
  choice: その神の国のために
  rationale: ὑπέρ＋属格が表す「～のために／～のゆえに」という関係を示す。日本語で関係代名詞の先行詞を明確にするため、「その神の国」と反復した。
- source_word: καὶ πάσχετε
  choice: 苦しみを受けてもいる
  rationale: 現在形が示す継続中の苦難を表し、καί を「も」で保持して前節の苦難とのつながりを示した。
theological_decisions:
- issue: 苦しみと神の国にふさわしいと認められることの関係
  choice: 苦しみは神の正しい裁きを示すしるしであり、その目的または結果として、彼らが神の国にふさわしいと認められると述べる。
  alternative: 苦しみそのものによって神の国に入る資格を獲得する。
  rationale: καταξιωθῆναι は「ふさわしくされる」よりも「ふさわしいと認められる」という受動の認定を表す。本文にある苦しみと認定との緊張関係は保ちつつ、苦しみを功績や代価とする意味は訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、礼拝・公読にも耐える落ち着いた文体とした。長いギリシア語の一文は、日本語で指示関係を明確にするため三文に分けた。「裁き」「神の国」などの主要な聖書用語は保持した。
