- from: これは、神の正しい裁きのしるしです[a]。それは、あなたがたが神の国にふさわしいと認められるためです[b]。その神の国のために、あなたがたは苦しみを受けてもいるのです[c]。
  to: これは、神の正しい裁きのしるしであり、あなたがたが神の国にふさわしいと認められるためのものです[b]。あなたがたは、その神の国のために苦しみを受けてもいるのです[c]。
  rationale: 脚注cから原文にない「支持するために」という限定を除いた。また、εἰς τὸ καταξιωθῆναι の目的／結果の関係を、現代日本語として明瞭な構文に整えた。受動態の「ふさわしいと認められる」を維持し、苦難が入国の功績であるとの意味を加えていない。
