  verdict: revise
  source_fidelity: 本文は主要語句を概ね正確に訳している。「神の正しい裁き」「神の国」「ふさわしいと認められる」は原文に忠実である。ただし、ὑπὲρ ἧς の脚注にある「その神の国を支持するために」は、この文脈での「～のために／～のゆえに」を不必要に限定し、原文の意味範囲を越える。
  naturalness: 三文に分けた訳は明瞭であるが、「それは、…ためです」は、直前の「しるし」との論理関係をやや不自然にし、何が何のためなのかを曖昧にする。「これは…しるしであり、…ためのものです」とすれば、εἰς τὸ 以下が神の正しい裁きのしるしとしての事態に関係することを自然に示せる。
  terminology: 「正しい裁き」「神の国」「ふさわしいと認められる」は明瞭で適切である。「苦しみを受けてもいる」は継続する苦難と καί の「も」を自然に保っている。脚注cの「支持するために」は削除し、「ゆえに／ために」の範囲にとどめるべきである。
  issues:
  - severity: medium
    issue: 脚注cの「その神の国を支持するために」
    rationale: ὑπὲρ ἧς はこの箇所で「その国のために」「その国のゆえに」を表すが、「支持する」は政治的・運動的な含意を加えるため、安全な語彙的代案ではない。
  - severity: low
    issue: 「それは、…ためです」の指示と構文
    rationale: εἰς τό＋不定詞の目的／結果関係を表そうとしているが、日本語では「それ」が何を指すか、また「ため」が何に係るかが少し不明瞭になる。文を整えることで原文の関係をより明瞭にできる。
  revised_text: これは、神の正しい裁きのしるしであり、あなたがたが神の国にふさわしいと認められるためのものです[b]。あなたがたは、その神の国のために苦しみを受けてもいるのです[c]。
