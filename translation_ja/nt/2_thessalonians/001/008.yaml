id: 2TH.1.8
reference: 2 Thessalonians 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: ja
  text: 燃え盛る火の中に現れ[a]、神を知らない者たちと、私たちの主イエスの福音に従わない者たちに報復を加えられます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「火の炎の中に」。この句は前節の「主イエスが天から現れる」ことにかかります。
    reason: lexical_alternative
  - marker: b
    text: 「報いを与えられます」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: 燃え盛る火の中に
  rationale: 「火の炎の中に」という直訳的な重複を避けつつ、φλόξとπῦρが生む強烈で鮮明な火のイメージを自然な現代日本語で保つ。前節から続く主の顕現を修飾するため、「現れ」を補った。
- source_word: διδόντος ἐκδίκησιν
  choice: 報復を加えられます
  rationale: 字義的には「報復を与える」であり、ここでは司法的な処罰を執行する慣用表現。「報復」はἐκδίκησιςの強さを保ち、「加える」は日本語として自然に動作を表す。主を受ける敬語として尊敬形を用いた。
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: 神を知らない者たち
  rationale: οἶδαの現在的な意味を簡潔に表し、知らない状態をそのまま保つ。
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: 従わない者たち
  rationale: ὑπακούωの「聞き従う、服従する」という意味を自然に表す。「従うことを拒む」では意志的拒絶を明示しすぎるため避けた。
- source_word: τῷ εὐαγγελίῳ
  choice: 福音
  rationale: パウロ書簡で反復される定着した用語であり、現代日本語の聖書語彙としても理解可能。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 私たちの主イエスの
  rationale: 属格関係と「主」という称号を保ちながら、自然な日本語の語順にした。
theological_decisions:
- issue: 神的裁きにおけるἐκδίκησιςの性質
  choice: 報復
  alternative: 刑罰／正義の裁き
  rationale: 語の司法的かつ強い意味を弱めずに保つ。「復讐」は私的・感情的な仕返しを連想させやすいため本文では避けるが、「報復」も原文の厳しさを保持する。文脈上、これは主による裁きである。
- issue: 分詞διδόντοςの主語と前節との統語的連続
  choice: 主イエスを主語として「現れ」「加えられます」と補足
  alternative: 名詞句・分詞句のまま断片的に訳す
  rationale: ギリシア語本文は前節の「主イエスの現れ」に続く一文である。単独節として読める日本語にするため述語を補うが、内容上の新情報は加えていない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文が前節から続く統語構造であることを踏まえ、単独の節として成立するよう「現れ」と終止述語を補った。主イエスの動作には自然な尊敬表現を用いた。
