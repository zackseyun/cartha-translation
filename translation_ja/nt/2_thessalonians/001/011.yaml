id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: ja
  text: このためにも、私たちはいつもあなたがたのために、私たちの神があなたがたを召しにふさわしいと認めてくださり[a]、善をなそうとするあらゆる志[b]と信仰の働き[c]を、力をもって完全に実現してくださるよう祈っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「召しにふさわしい者としてくださり」。ギリシア語の動詞は、「ふさわしいと認める」と「ふさわしい者にする」のどちらにも理解できる。
    reason: alternative_reading
  - marker: b
    text: 別訳「あらゆる善の目的」または「善についてのあらゆる志」。
    reason: lexical_alternative
  - marker: c
    text: 「信仰の働き」は、「信仰から生まれる働き」とも理解できる。また、この文脈の「信仰」は「忠実さ」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: このためにも
  rationale: 前節までの内容を受け、その目的・帰結を指す表現として、εἰς の方向性と καὶ の付加的な意味を自然な日本語で保った。
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: 私たちはいつもあなたがたのために祈っています
  rationale: 現在形が示す継続的・習慣的な祈りを「祈っています」で表し、περὶ ὑμῶν は自然に「あなたがたのために」とした。
- source_word: ἵνα
  choice: ～ように、と
  rationale: 祈りの内容と目的の両面を表せる日本語の祈願節とした。
- source_word: ἀξιώσῃ
  choice: ふさわしいと認めてくださり
  rationale: 「ふさわしいと見なす／認める」という評価的意味を本文に採用した。ただし「ふさわしい者にする」という使役的意味も可能なので脚注に残した。
- source_word: τῆς κλήσεως
  choice: 召しに
  rationale: 原文に所有代名詞がないため「神の召し」「あなたがたの召し」と限定せず、文脈上既知の召しを簡潔に表した。
- source_word: ὁ θεὸς ἡμῶν
  choice: 私たちの神
  rationale: 原文の明示的な所有表現を保持した。
- source_word: πληρώσῃ
  choice: 成し遂げてくださる
  rationale: 志と働きの双方を神が実現し、完成へ至らせる意味を自然に表した。
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: あらゆる善い志
  rationale: εὐδοκία を単なる好感情ではなく意志・決意、ἀγαθωσύνης をそれを特徴づける善として理解し、簡潔で明瞭に訳した。属格関係の別解は脚注に示した。
- source_word: ἔργον πίστεως
  choice: 信仰の働き
  rationale: 属格の関係を限定せず、信仰から生じる働き、または信実さに特徴づけられた働きという可能性を残す表現とした。
- source_word: ἐν δυνάμει
  choice: 力をもって
  rationale: 神が志と働きを実現する際の力を表す語句として、直前の二つの目的語全体に自然にかかるよう配置した。
theological_decisions:
- issue: ἀξιώσῃ と神の召しとの関係
  choice: 召しにふさわしいと認めてくださる
  alternative: 召しにふさわしい者としてくださる
  rationale: 本文では評価的意味を採ったが、神が実際にふさわしい者にするという意味もギリシア語上可能である。どちらか一方に神学的意味を固定せず、別解を脚注に保持した。
- issue: ἔργον πίστεως における πίστεως の意味と属格関係
  choice: 信仰の働き
  alternative: 信仰から生まれる働き／信実な働き
  rationale: 「信仰」を基本訳としつつ、働きを生み出す信仰という意味と、信実さに特徴づけられた働きという意味の可能性を排除しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りとしての厳かさを保った。「くださる」を用いて神への祈願であることを自然に示した。原文の長い一文は二文に分けたが、後半を「～ように、と」で閉じて前文の「祈っています」との統語的つながりを明示した。
