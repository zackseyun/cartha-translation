revisions:
- from: このためにも、私たちはいつもあなたがたのために祈っています。私たちの神が、あなたがたを召しにふさわしいと認めてくださり[a]、あらゆる善い志[b]と信仰の働き[c]を、力をもって成し遂げてくださるように、と。
  to: このためにも、私たちはいつもあなたがたのために、私たちの神があなたがたを召しにふさわしいと認めてくださり[a]、善をなそうとするあらゆる志[b]と信仰の働き[c]を、力をもって完全に実現してくださるよう祈っています。
  rationale: 原文の意味と曖昧さを維持したまま、ἵνα節を「祈っています」に直接結び付けた。εὐδοκίαν ἀγαθωσύνηςは「善をなそうとするあらゆる志」として、善への志向を明示しつつ、脚注で目的・志の別表現を保持した。πληρώσῃは二つの目的語に自然に適用できる「完全に実現してくださる」とした。
