id: 2TH.1.7
reference: 2 Thessalonians 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: ja
  text: また、苦しめられているあなたがたには、私たちとともに安らぎを与えてくださいます。それは、主イエスが力ある御使いたち[a]を伴って天から現れる時です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ご自分の力の御使いたち」。この表現は「主の力を帯びた御使いたち」とも理解できます。
    reason: 属格句の形と解釈の幅を示すため。
lexical_decisions:
- source_word: θλιβομένοις
  choice: 苦しめられている
  rationale: 現在受動分詞の継続的な受苦と、他者から圧迫を受けているという受動の意味を保つ。
- source_word: ἄνεσιν
  choice: 安らぎ
  rationale: 圧迫や苦難から解放されることを表す。単なる休息に限定せず、直前の苦しみとの対照が伝わる語を選んだ。
- source_word: μεθ’ ἡμῶν
  choice: 私たちとともに
  rationale: パウロと同労者も同じ安らぎにあずかるという、単純な同伴・共同の意味をそのまま表す。
- source_word: ἐν τῇ ἀποκαλύψει
  choice: 現れる時
  rationale: 出来事を指すἐνの時間的用法を自然な日本語で表した。ἀποκάλυψιςの『覆いが除かれて姿が明らかになる』意味も保つ。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエス
  rationale: κύριοςを新約聖書で定着した称号「主」とし、属格は現れる主体として理解した。
- source_word: ἀπ’ οὐρανοῦ
  choice: 天から
  rationale: ἀπόが示す起点を簡潔かつ自然に表す。
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: 力ある御使いたちを伴って
  rationale: 圧縮された属格表現を、現代日本語で自然な質的表現として訳した。αὐτοῦが示す力は主イエスの力であるため、その逐語的な構造は脚注に示す。
theological_decisions:
- issue: ἀγγέλων δυνάμεως αὐτοῦ の属格関係
  choice: 力ある御使いたち
  alternative: ご自分の力の御使いたち
  rationale: この句は、御使いたちが力強いという質を表すとも、主の力に属し、またはそれを示す御使いたちとも理解できる。本文では自然な質的解釈を採り、属格の曖昧さを脚注に残した。
- issue: ἐν τῇ ἀποκαλύψει の時間的意味
  choice: 主イエスが……現れる時
  alternative: 主イエスの現れにおいて
  rationale: 約束された安らぎが終末におけるイエスの顕現と結び付くことを明確にしつつ、日本語として不自然な名詞句を避けた。
- issue: 前節から補われる授与の主体と動詞
  choice: 安らぎを与えてくださいます
  alternative: 安らぎを
  rationale: 原文は1章6節から続く統語構造で、神が報いることを述べる。単独の節として理解できるよう、文脈上明白な動詞を補ったが、新たな主体や因果関係は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「御使い」「主」によって聖書本文としての品位を保った。前節に統語的に依存する原文を単独でも読める文に整えた。脚注記号は該当する「御使いたち」の直後に置いた。
