  text: εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: ja
  text: あなたがたを苦しめる者たちに苦しみをもって報いることは、神にとって正しいことなのですから。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もし本当に、あなたがたを苦しめる者たちに苦しみをもって報いることが、神にとって正しいのであれば」。
    reason: εἴπερ の条件的な形をより直訳的に示す別訳。本文では、文脈上、真実とみなされた前提を表す用法として訳した。
lexical_decisions:
- source_word: εἴπερ
  choice: …なのですから
  rationale: ここでは、疑わしい条件を提示するというより、真実として前提されている事柄を根拠として述べる修辞的用法と判断した。文脈との論理的つながりを自然な現代日本語で示す。条件的な含みは脚注に残した。
- source_word: δίκαιον
  choice: 正しいこと
  rationale: 神の裁きにおける道徳的・司法的な正当性を表す。「義である」より現代の一般読者に明瞭でありながら、意味の重みを保つ。
- source_word: παρὰ θεῷ
  choice: 神にとって
  rationale: 神の側で、また神の判断に照らして正当であることを自然に表す。「神の前で」も可能だが、この構文では「神にとって」が明瞭である。
- source_word: ἀνταποδοῦναι
  choice: 報いる
  rationale: 受けた行為に対応するものを返すという報償・報復の意味を簡潔かつ品位ある日本語で表す。
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: あなたがたを苦しめる者たちに
  rationale: 迫害や圧迫によって苦痛を与える意味を保ち、続く同語根の θλῖψιν との対応も「苦しめる／苦しみ」で示す。
- source_word: θλῖψιν
  choice: 苦しみをもって
  rationale: 圧迫による苦難を表し、動詞 θλίβουσιν との語の響きの対応を保つ。「患難」は伝統的だが、一般の現代読者にはやや古風である。
theological_decisions:
- issue: 神による報いの性質と時期
  choice: 神が、信徒を苦しめる者たちに苦しみをもって報いることの正当性を述べるが、その時期や具体的な形はこの節だけでは限定しない。
  alternative: 終末における裁きだけを指す、または歴史の中での裁きも含むと明示する。
  rationale: 原文は神の報いが正しいことを断言する一方、この句自体はその執行の時期や様態を詳しく定めていないため、訳文でも限定を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「苦しめる／苦しみ」によって原文の同語根による対応を再現し、節が前後の文に続く理由節であることを文末の「…から」で示した。
