  source_fidelity: 原文の εἴπερ を、文脈上前提として置かれる理由として「…なのですから」と訳しており、条件形式を示す別訳も脚注に保持している。δίκαιον παρὰ θεῷ は「神にとって正しいこと」、ἀνταποδοῦναι は「報いる」、両方の θλίβ- 語は「苦しめる／苦しみ」とされ、意味と語の対応が適切に保たれている。神の報いの時期や形態も付加していない。
  naturalness: 「あなたがたを苦しめる者たちに苦しみをもって報いることは、神にとって正しいことなのですから」は、前後の文に続く理由節として自然で、明瞭な現代標準日本語である。「苦しめる／苦しみ」の反復も、この箇所では原文の対応を伝えるために有効である。
  terminology: 「神にとって正しいこと」は παρὰ θεῷ を不自然に直訳せず、神の判断における正当性を表す。「報いる」は報復・応報という文脈にふさわしい格調を保ち、「苦しみ」は一般読者にも理解しやすい。
