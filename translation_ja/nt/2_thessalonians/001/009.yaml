source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: ja
  text: この者たちは、主の御前から、また主の力の栄光から遠ざけられ、永遠の滅びという刑罰を受けます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この者たちは、主の御前と主の力の栄光からもたらされる、永遠の滅びという刑罰を受けます」。ギリシア語の前置詞は、主の御前からの分離（「主の御前から遠ざけられ」）を表すとも、滅びの源（「主の御前と主の力の栄光からもたらされる」）を表すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: この者たちは
  rationale: 前節で述べられた、神を知らず福音に従わない者たちを受ける。ὅστιςの指示・説明的な働きを、現代日本語で自然に示した。
- source_word: δίκην τίσουσιν
  choice: 罰を受けます
  rationale: 司法的な処罰を被るという連語の意味を明瞭に表す。「代償を払う」よりも、日本語の裁きの文脈で自然である。
- source_word: ὄλεθρον αἰώνιον
  choice: 永遠の滅び
  rationale: 終末的な裁きにおける厳しさと永続性を保ちつつ、滅びの具体的な様態について本文以上の教理的限定を加えない。
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: 主の御前から…遠ざけられ
  rationale: ἀπόを分離・排除の意味に取り、πρόσωπονを慣用的に「御前」とした。「顔から」という不自然な直訳を避ける一方、別の文法的可能性は脚注に残す。
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: またその力の栄光から
  rationale: δόξαを「栄光」、ἰσχύςを「力」とし、主の力に属し、それを現す栄光という属格関係を簡潔に保った。
theological_decisions:
- issue: 終末の裁きに関するἀπόの意味
  choice: 分離・排除、すなわち「主の御前から…遠ざけられ」
  alternative: 起源・源、すなわち「主の御前とその力の栄光からもたらされる滅び」
  rationale: 文脈上、裁きとして主の御前から退けられるという理解が有力であり、日本語としても明瞭である。ただしἀπόには起源を表す可能性もあるため、重要な解釈上の緊張を脚注で明示した。
- issue: 「永遠の滅び」の含意
  choice: 滅びの様態を特定せず「永遠の滅び」と訳す
  alternative: 消滅、または永遠に意識のある刑罰と明示する
  rationale: ギリシア語句そのものは刑罰の永続的・終局的性格を述べるが、その様態をめぐる教理的論争を単独で決着させないため、特定の立場を訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御前」はπρόσωπονの宗教的文脈に適した自然な表現。「遠ざけられ」を補ってἀπόの分離の意味を明示し、別解は脚注に保存した。
