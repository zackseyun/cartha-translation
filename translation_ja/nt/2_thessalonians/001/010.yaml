id: 2TH.1.10
reference: 2 Thessalonians 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: ja
  text: その日、主が来られるのは、ご自分の聖なる者たちの間で栄光を受け、信じたすべての人々の間で驚嘆の的となるためです。[a] あなたがたは、私たちがあなたがたに伝えた証しを信じたからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる者たちの間で」は、「聖なる者たちのうちに」とも訳せる。ギリシア語は、主がご自分の民の間で栄光を受けること、または主の栄光が彼らのうちに現されることの、どちらをも示し得る。
    reason: lexical_alternative
  - marker: b
    text: 原文では「その日」は節末に置かれている。日本語では文頭に置いたが、主の来臨と、それに伴う栄光と驚嘆の出来事全体がその日に起こることを示す。
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: その日、主が来られるのは
  rationale: ὅταν＋アオリスト接続法が指す確定的な将来の出来事を、自然な現代日本語で表した。文脈上の主語を「主」と補い、敬意を示す表現とした。
- source_word: ἐνδοξασθῆναι
  choice: 栄光を受け
  rationale: 受動不定詞の意味と、神的な栄光という語感を保持した。「あがめられ」も可能だが、δόξαとのつながりが明瞭な表現を選んだ。
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: ご自分の聖なる者たちの間で
  rationale: ἅγιοιを専門用語的な「聖徒」に限定せず、明瞭な「聖なる者たち」とした。ἐνは共同体的な場を示す「間で」と訳したが、「彼らのうちに」の可能性は脚注に残した。
- source_word: θαυμασθῆναι
  choice: 驚嘆の的となる
  rationale: 単なる称賛以上に、驚きを伴って仰ぎ見られる受動的意味を自然な日本語で表した。
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: 信じたすべての人々の間で
  rationale: 分詞の動詞的な力を保つため「信者」ではなく「信じたすべての人々」とし、先行するἐν句との並行も保った。
- source_word: ὅτι
  choice: からです
  rationale: テサロニケの人々が「信じた者たち」に含まれる理由を示す因果用法として訳した。
- source_word: ἐπιστεύθη τὸ μαρτύριον ἡμῶν
  choice: 私たちが伝えた証しを信じた
  rationale: ギリシア語は「私たちの証しが信じられた」という受動構文だが、日本語として自然にするため受け手を主語とする能動表現にした。「証し」は使徒的な証言・宣教の意味を保つ。
- source_word: ἐφ’ ὑμᾶς
  choice: あなたがたは、私たちが伝えた
  rationale: 証しがあなたがたに向けて届けられたことを、「伝えた」と受け手「あなたがた」によって明示した。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: その日
  rationale: 終末的な出来事を指す定型的な時間表現として簡潔に訳し、日本語の流れに合わせて冒頭に置いた。
theological_decisions:
- issue: 終末的文脈における「彼の聖なる者たち」の指示対象とἐνの意味
  choice: キリストに属する聖なる民を指すものとして「ご自分の聖なる者たちの間で」と訳した。
  alternative: 「ご自分の聖なる者たちのうちに」とし、彼らを通して主の栄光が現れる意味を前面に出す。または「聖なる者たち」を天上の存在も含み得る表現として読む。
  rationale: 直後の「信じたすべての人々」との並行は信仰者を指す理解を支持する。ただしἐνには「間で」と「うちに」の両義性があるため、後者を脚注で保持した。
- issue: πιστεύσασινとἐπιστεύθηが表す使徒的証言への応答
  choice: 両方を通常の信仰語彙で「信じた」と訳した。
  alternative: 「信頼した」「信仰をもって受け入れた」と訳す。
  rationale: 本文は証しを真実として受け入れたことを述べており、特定の教派的含意を加えず、同根語の対応を保つ「信じる」が適切である。
- issue: 節末の「その日」の係り方
  choice: 「その日」を文頭に置き、主の来臨とそれに伴う栄光・驚嘆の出来事全体を修飾させた。
  alternative: ギリシア語順に従い、節末に「その日に」と置く。
  rationale: 原文の強調を損なわず、日本語で修飾関係が明確になる語順を選んだ。節末配置の可能性は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖徒」より理解しやすい「聖なる者たち」を用い、主への敬意は「来られる」「ご自分」で示した。文脈上、この節は前節から続くため、単独でも読める範囲で主語と因果関係を補った。
