id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: ja
  text: パウロ、シルワノ、テモテから、私たちの父である神と主イエス・メシア[a]にあるテサロニケ人の教会へ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主イエス・キリスト」。ギリシア語の称号 Χριστός は「メシア」とも、伝統的には「キリスト」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: パウロ
  rationale: 新約聖書で定着している、ギリシア語人名の標準的な日本語表記。
- source_word: Σιλουανὸς
  choice: シルワノ
  rationale: 本文のΣιλουανόςを直接反映し、使徒言行録で知られる短縮形「シラス」への調和を避ける。
- source_word: Τιμόθεος
  choice: テモテ
  rationale: 新約聖書で定着している、ギリシア語人名の標準的な日本語表記。
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: パウロ書簡では信徒の共同体を指し、現代日本語で最も自然かつ定着した訳語。
- source_word: Θεσσαλονικέων
  choice: テサロニケ人の
  rationale: 属格複数が都市そのものではなく人々を指すことを保ち、「テサロニケにある」と場所の表現に置き換えない。
- source_word: ἐν
  choice: にある
  rationale: 日本語として自然な形で「中に」という関係を示しつつ、神および主イエス・メシアとの結合、領域、基盤のいずれかに意味を限定しない。
- source_word: θεῷ πατρὶ ἡμῶν
  choice: 私たちの父である神
  rationale: ἡμῶνの明示的な所有関係を保ち、「父なる神」へ平滑化しない。
- source_word: κυρίῳ
  choice: 主
  rationale: イエスに対する称号としてのκύριοςを、日本語聖書で定着した語で表す。
- source_word: Χριστῷ
  choice: メシア
  rationale: 固有名の一部として音写するのでなく、イエスに付された称号として訳す。伝統的な「キリスト」は脚注に示す。
theological_decisions:
- issue: Ἰησοῦ ΧριστῷにおけるΧριστόςの訳し方
  choice: イエス・メシア
  alternative: イエス・キリスト
  rationale: Χριστόςの称号としての意味を「メシア」で明示する一方、定着した伝統訳を脚注に残す。日本語では称号を表すのに英語のような定冠詞を補う必要がない。
- issue: ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷが示す関係
  choice: 私たちの父である神と主イエス・メシアにある
  alternative: 私たちの父である神と主イエス・メシアに属する
  rationale: ἐνを所属だけに限定せず、神と主イエスとの結合、領域、または基盤という圧縮された神学的含意を保つ。
translation_notes:
  register: 明瞭で現代的かつ礼節ある書簡冒頭とした。日本語の慣用に従って差出人の列挙に「から」、宛先に「へ」を補い、原文の簡潔さを保った。
