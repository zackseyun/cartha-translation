id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: ja
  text: 兄弟たち、私たちはいつも、あなたがたのために神に感謝しなければなりません[a]。それはふさわしいことです。なぜなら、あなたがたの信仰がますます成長し、あなたがた一人ひとりが互いに抱く愛が増し加わっているからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、この箇所では女性を含む信仰共同体全体への呼びかけです。別訳「兄弟姉妹たち」。
    reason: lexical_alternative
  - marker: b
    text: 「信仰」は「忠実さ」または「信頼」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: 私たちは…感謝しなければなりません
  rationale: 不定詞とὀφείλομενの組み合わせが表す道義的な務めを、現代日本語で自然に示す。「感謝すべきです」よりも義務の響きが明確だが、絶対的強制を意味する表現にはしていない。
- source_word: πάντοτε περὶ ὑμῶν
  choice: いつも、あなたがたのことで
  rationale: πάντοτεの継続的な時間性と、感謝の理由・対象に関わるπερίの用法を自然な日本語で表す。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を保持する。共同体全体への呼びかけとして女性も含み得ることは脚注で明示する。
- source_word: καθὼς ἄξιόν ἐστιν
  choice: そうするのがふさわしいことだからです
  rationale: 感謝が適切で当然であるという意味を表し、「価値がある」と誤解され得る直訳を避ける。
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: あなたがたの信仰がますます成長し
  rationale: ὑπεραυξάνειの強意を「ますます」で示し、πίστιςは文脈上の標準的な訳語「信仰」とする。
- source_word: πλεονάζει ἡ ἀγάπη
  choice: 愛が増し加わっている
  rationale: 現在形の継続的な増大を表し、先行する「成長」と語調を整える。
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: あなたがた一人ひとりの互いに対する
  rationale: 原文の重ねた分配的強調を「一人ひとり」で自然に伝え、εἰς ἀλλήλουςの相互性を「互いに対する」として保持する。
theological_decisions:
- issue: πίστιςの意味範囲
  choice: 信仰
  alternative: 信実、信頼
  rationale: この文脈ではテサロニケの信徒たちの「信仰」が成長するという理解が最も自然である。ただし語には信実・忠実さの意味もあり得るため、脚注で意味範囲を保持する。
- issue: 混合構成の教会に対するἀδελφοί
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 語形上の男性複数を本文で保ちつつ、当時の共同体全体を包括して呼びかけ得る点を脚注で補う。
- issue: 感謝の義務と適切さの関係
  choice: 感謝しなければなりません…そうするのがふさわしい
  alternative: 感謝すべきです…当然です
  rationale: ὀφείλομενが示す務めとἄξιονが示す適切さを区別し、パウロの感謝が単なる感情ではなく道義的にふさわしい応答であることを表す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、使徒的書簡にふさわしい品位を保った。長いギリシア語の一文を日本語では二文に分け、理由を導く二つの構造を明瞭にした。
