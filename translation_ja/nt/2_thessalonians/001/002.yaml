id: 2TH.1.2
reference: 2 Thessalonians 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ja
  text: 父である神と、主イエス、すなわちメシア[a]から、恵みと平安があなたがたにありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主イエス・キリスト」。ギリシア語の「クリストス」は「油注がれた者」を意味する称号で、「メシア」とも「キリスト」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの挨拶における定型性と、神から与えられる恩恵という神学的な重みの両方を保つ、日本語聖書で定着した訳語。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数二人称の与格を明示し、祝福が受取人に向けられていることを自然な日本語で表す。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在にとどまらず、健全さや安寧を含む挨拶語としての広がりを保つ。
- source_word: ἀπὸ
  choice: から
  rationale: 恵みと平安の源を示す前置詞の働きを直接表す。
- source_word: θεοῦ πατρὸς
  choice: 父である神
  rationale: 底本には「私たちの」に当たる語がないため、それを補わず、πατρόςを神についての呼称として明瞭かつ現代的に表す。
- source_word: κυρίου
  choice: 主
  rationale: イエスの称号としての権威を保ち、新約聖書の文脈で定着した訳語を用いる。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス、すなわちメシア
  rationale: Χριστόςが固有名ではなく「油注がれた者」という称号であることを伝える。「すなわち」によって、現代日本語では不自然になりやすい「イエス・メシア」を避けつつ、イエスとメシアを別人物のように読ませない。
theological_decisions:
- issue: θεοῦ πατρὸςに所有代名詞「私たちの」を補うか
  choice: 父である神
  alternative: 私たちの父である神
  rationale: SBLGNTの提示本文にはἡμῶνがない。パウロの類似した挨拶文から関係的意味は理解できるが、本文にない所有表現を訳文へ明示的に加えず、原文の簡潔さを保つ。
- issue: Χριστόςを称号としてどのように示すか
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςの称号としての意味を読者に伝えるため「メシア」とし、伝統的な音写「キリスト」は脚注に示して双方の理解を可能にする。
- issue: 動詞のないギリシア語の挨拶を日本語でどう表すか
  choice: 恵みと平安があなたがたにありますように
  alternative: あなたがたに恵みと平安
  rationale: 原文は挨拶として願い・祝福を表す名詞句である。日本語では述語を補うことで、その発話機能を明瞭かつ自然に伝える。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、使徒書簡の祝福としての品位を保った。「父なる神」のようなやや文語的な表現を避けて「父である神」とし、原文にない「私たちの」は補わなかった。
