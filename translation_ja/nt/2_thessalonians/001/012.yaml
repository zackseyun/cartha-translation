  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: ja
  text: 私たちの主イエスの御名があなたがたのうちで[a]栄光を受け、あなたがたもその方にあって栄光を受けるように、私たちの神と主イエス・メシアの恵みに基づいて。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの間で」とも訳せる。ギリシア語の前置詞は、この文脈で「あなたがたのうちに」と「あなたがたの間で」のいずれの含みも持ちうる。
    reason: lexical_alternative
  - marker: b
    text: 末尾は「私たちの神」と「主イエス・メシア」を別々の指示対象として理解することも、両者を密接に結び付けた一つの表現として理解することもできる。訳文はこの点を決めつけない。
    reason: alternative_reading
  - marker: c
    text: 「メシア」はギリシア語の称号「キリスト」の意味（油注がれた者）を訳したもの。「キリスト」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: それは〜ためです
  rationale: 前節の祈りが目指す目的・結果を、自然な現代日本語で示す。
- source_word: ἐνδοξασθῇ
  choice: 栄光を受ける
  rationale: 受動態とδόξα語群の神学的重みを保ちつつ、日本語として自然にした。
- source_word: τὸ ὄνομα
  choice: 御名
  rationale: 原文の「名」を保持し、主イエスへの敬意を自然な聖書的日本語で表す。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちで
  rationale: 個々人の内面と共同体の中という両方の含みを残しやすい表現を選んだ。
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: あなたがたも主にあって栄光を受ける
  rationale: 相互的な並行を保つ。αὐτῷは男性形であり、主イエスを指すと理解した。「主」を補って日本語で指示対象を明瞭にした。
- source_word: κατὰ τὴν χάριν
  choice: 恵みによる
  rationale: κατάは基準・根拠を表す。直訳的な「恵みに従って」より自然で、ここでは恩恵を根拠とする意味を伝える。
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: 私たちの神であり主であるイエス・キリストの
  rationale: 単一の冠詞のもとでθεοῦとκυρίουがκαίで結ばれ、同一人物を指すのが最も自然な統語的理解であるため。ただし別々の指示対象と取る伝統的可能性を脚注に示した。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: キリスト
  alternative: メシア
  rationale: 現代日本語の書簡文脈では「イエス・キリスト」が定着した自然な表現である。Χριστόςが「油注がれた者／メシア」という称号であることは脚注で示す。
- issue: αὐτῷの指示対象
  choice: 主イエス
  alternative: 御名
  rationale: 男性形代名詞と相互的な栄光化の構造から、主イエスを指す可能性が強い。
- issue: 末尾の属格句の指示対象
  choice: 「私たちの神であり主であるイエス・キリスト」という一人の指示対象
  alternative: 「私たちの神」と「主イエス・キリスト」という二者
  rationale: ギリシア語の単一冠詞とκαίによる結合は同一指示を強く支持するが、歴史的に別解もあるため脚注で保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御名」「主にあって」は聖書的な語感を保ちながら一般読者にも理解可能な表現とした。原文の目的構文と相互的な栄光化を二文で自然に示した。
