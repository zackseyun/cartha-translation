  source_fidelity: 冒頭の目的節と受動の「栄光を受ける」は適切です。しかし、末尾の属格句を「私たちの神であり主であるイエス・キリスト」として単一人物の同格表現にしたことは、冠詞の用法が議論されるギリシア語の曖昧さを解消しすぎています。また、αὐτῷは形態上、男性・中性のいずれにもなり得るため、「男性形」とする説明は正確ではありません。
  naturalness: 「それは…ためです。これは…ことです」という二文構成はやや説明調で、原文の一続きの目的節を弱めています。一文に整えれば、明瞭な現代標準日本語のまま原文の構造をよりよく反映できます。
  terminology: κύριοςは「主」、χάριςは「恵み」とするのが適切です。Χριστόςはこの箇所では称号として「メシア」と訳すのが英語POBの方針とも整合します。「御名」は敬意ある聖書的用法として許容されます。
