revisions:
- from: それは、私たちの主イエスの御名があなたがたのうちで[a]栄光を受け、あなたがたも主にあって栄光を受けるためです。これは、私たちの神であり主であるイエス・キリストの恵みによることです。[b]
  to: 私たちの主イエスの御名があなたがたのうちで[a]栄光を受け、あなたがたもその方にあって栄光を受けるように、私たちの神と主イエス・メシアの恵みに基づいて。[b][c]
  rationale: 原文の目的節を一文で保ち、末尾の論争のある統語関係を「神であり主である」という同一指示の断定なしに訳しました。「その方にあって」は、文脈上もっとも自然な主イエスへの言及を保ちつつ、αὐτῷの形態について不正確な説明を避けます。称号ΧριστόςはPOBの方針に従い「メシア」とし、代替の慣用訳は脚注に示しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:48Z'
