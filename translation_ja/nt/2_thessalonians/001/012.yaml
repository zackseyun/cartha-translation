    rationale: 与格単数のαὐτῷは男性形・中性形で同形です。文脈上は主イエスを指す理解が最も自然ですが、形態だけを根拠に断定する説明は不正確です。
  - severity: medium
    issue: Χριστόςが「キリスト」と訳され、脚注でのみ「メシア」とされている。
    rationale: 提示されたPOB監査方針では、この称号は「メシア」と訳す扱いです。日本語でも「イエス・メシア」は意味を保つ明瞭な表現です。
