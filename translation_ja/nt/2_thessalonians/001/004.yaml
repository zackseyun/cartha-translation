id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: ja
  text: その結果、私たち自身も、神の諸教会の間で、あなたがたについて誇っています。あなたがたが耐え忍んでいるあらゆる迫害と苦難の中での、あなたがたの忍耐と信仰[a]のゆえです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忠実さ」。ここで「信仰」と訳した語は、苦難の中で変わらず忠実であることも意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: そのため
  rationale: 前節で述べた信仰と愛の成長から生じた結果を、現代日本語で自然に示す。
- source_word: αὐτοὺς ἡμᾶς
  choice: 私たち自身が
  rationale: 代名詞の強調を保ち、パウロと同労者たち自身が誇っていることを明示する。
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: あなたがたのことを誇りにしています
  rationale: 人物を伴うἐνを誇りの対象として捉え、日本語では「誇る」より自然で、肯定的な意味も明瞭な表現とした。
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: 神の諸教会の間で
  rationale: 複数の共同体の中で語っているという範囲を保つ。「諸教会」により複数形を明示した。
- source_word: ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως
  choice: あなたがたが…示している忍耐と信仰のゆえです
  rationale: ὑπέρを誇りの根拠として訳し、後続する状況句との関係を日本語で明瞭にした。
- source_word: ὑπομονῆς
  choice: 忍耐
  rationale: 圧迫の中で持ちこたえる堅忍を表し、一般読者にも理解しやすい語を選んだ。
- source_word: πίστεως
  choice: 信仰
  rationale: 神への信頼・信仰を基本訳としつつ、苦難の文脈で「忠実さ」の含意もあり得るため脚注に残した。
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: あなたがたが受けているあらゆる迫害と苦難の中で
  rationale: 敵対者による「迫害」と、より広い圧迫・困難である「苦難」を区別し、ἐνの状況的意味を「中で」で保った。
- source_word: αἷς ἀνέχεσθε
  choice: あなたがたが受けている
  rationale: 継続中の迫害と苦難に耐えていることを自然な日本語で表す。「忍耐」と「耐えている」の重複を避けつつ、ἀνέχομαιの持ちこたえる含意は文全体で保持した。
theological_decisions:
- issue: 苦難の文脈におけるπίστιςの意味
  choice: 信仰
  alternative: 忠実さ
  rationale: πίστιςはここで、迫害の中でも保たれる神への信仰を指し得る一方、揺るがない忠実さも表し得る。本文では標準的な「信仰」を採用し、意味の幅を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、書簡にふさわしい品位を保った。原文は一続きの文だが、日本語で論理関係を明確にするため二文に分けた。「誇りにしています」は宗教的な専門語に寄りすぎず、原文の強い肯定的評価を自然に伝える。
