reference: 2 Thessalonians 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: ja
  text: そのような人たちに、私たちは主イエス・キリストにあって[a]、静かに働いて自分たちのパンを食べるよう命じ、また勧めます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主イエス・キリストの権威によって」とも訳せます。ギリシア語は、主との結びつきと、主に基づく権威の両方を含み得ます。
    reason: 意味上の別訳
  - marker: b
    text: 直訳は「自分たち自身のパンを食べるよう」。ここで「パン」は、日々の食物や生活の糧を指します。
    reason: 直訳と慣用的意味
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: そのような人たちに
  rationale: 直前に述べられた、秩序を乱して働かない人々を指す。δέはここでは弱い移行・対照であり、日本語では文脈上明らかなため独立した接続語を置かなかった。
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: 命じ、また勧めます
  rationale: παραγγέλλωの権威ある命令と、παρακαλέωの切実な勧告の両方を保った。
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: 主イエス・キリストにあって
  rationale: ἐνが示す、主との結びつきおよび主に基づく権威を一方だけに限定せず表す。Χριστόςは日本語で定着した称号「キリスト」とした。
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: 静かに働き
  rationale: 騒ぎを起こさず、落ち着いた態度で働くことを表す。単なる無言の労働という意味に狭めない。
- source_word: τὸν ἑαυτῶν ἄρτον
  choice: 自分で得たパン
  rationale: 直訳の「自分自身のパン」が指す、自ら働いて得る日々の糧を、具体的な「パン」を残しつつ自然な日本語で表した。
- source_word: ἐσθίωσιν
  choice: 食べるよう
  rationale: 命令と勧告の内容を導くἵνα節の義務的な力を、日本語の「よう命じる」で表した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、日本語では「イエス・キリスト」が称号の意味も保持する定着した表現である。「メシア」と置き換えて不自然にせず、特定教派の用語にも寄せない。
- issue: ἐν κυρίῳの意味
  choice: 主イエス・キリストにあって
  alternative: 主イエス・キリストの権威によって
  rationale: この句には主との関係・領域と主に基づく権威の双方が含まれ得るため、「権威によって」と一義的に限定しなかった。
- issue: 使徒的勧告の力
  choice: 「命じる」と「勧める」の両方を保持
  alternative: 「言い聞かせる」など一語にまとめる
  rationale: 権威ある命令と牧会的な訴えが並置される神学的・修辞的緊張を保つため。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で品位ある「です・ます」調。「にあって」は神学的な含みを保つために用いたが、文全体は平易な語順とした。「静かに」は無言というより、騒がず落ち着いてという文脈的意味である。
