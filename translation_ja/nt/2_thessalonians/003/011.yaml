  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: ja
  text: というのも、あなたがたの中に、秩序を守らずに生活し[a]、少しも働かず、かえって余計なことに手を出している[b]人たちがいると、私たちは聞いているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「怠惰に生活し」または「規律を守らずに生活し」とも訳せます。ギリシア語は、共同体の秩序や期待から外れた行動を表し、この文脈では怠惰な生活も含意し得ます。
    reason: lexical_alternative
  - marker: b
    text: 「少しも働かず」と「余計なことに手を出している」に当たるギリシア語には語遊びがあります。すべき仕事をしないことと、余計なことをしていることとの対照です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: 私たちは聞いている
  rationale: 現在形が示す、現に伝わっている報告または継続して耳にしている状況を自然な日本語で表した。
- source_word: γάρ
  choice: というのも……からです
  rationale: 前の勧告の理由を示す接続関係を、日本語として自然な呼応表現で明示した。
- source_word: τινας
  choice: 人たちがいる
  rationale: 共同体内の特定されていない一部の人々を指す不定代名詞の意味を表した。
- source_word: περιπατοῦντας
  choice: 歩み
  rationale: 生活態度・行動を表す比喩を保持しつつ、聖書文体として理解可能な表現とした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの中に
  rationale: テサロニケの共同体内部にいることを明確にした。
- source_word: ἀτάκτως
  choice: 秩序を乱して
  rationale: 単なる怠惰に限定せず、共同体の秩序や期待から外れた振る舞いという広い語義を保持した。
- source_word: μηδὲν ἐργαζομένους
  choice: 少しも働かず
  rationale: μηδένの全面的な否定を、自然で強調のある日本語にした。
- source_word: ἀλλὰ
  choice: かえって
  rationale: 働かないことと不適切に活動することとの強い対照を表した。
- source_word: περιεργαζομένους
  choice: 余計なことに手を出している
  rationale: 他人事への干渉や不必要な活動という意味を現代日本語で表し、ἐργαζομένουςとの語遊びは脚注で補った。
