translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの「歩む」という生活比喩を保持した。「秩序を乱して」は語義を怠惰だけに狭めず、後続句が具体的な無労働と干渉を示す構造を残している。脚注マーカーは該当箇所に配置し、[b]は文全体の語遊びを説明するため文末に置いた。
