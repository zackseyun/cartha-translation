  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: ja
  text: 私たちは主にあって、あなたがたが私たちの命じることを今も行っており、これからも行うと確信しています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: 確信しています
  rationale: 完了形が表す、すでに生じて現在も続く確信を、自然な現代日本語で示す。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 確信の根拠・領域が主にあることを保ち、「あなたがた」自身への単なる信頼としない。
- source_word: ἐφ’ ὑμᾶς
  choice: あなたがたについて
  rationale: 文脈上、確信が向けられている対象を自然に示しつつ、前置詞句の意味を過度に限定しない。
- source_word: παραγγέλλομεν
  choice: 命じる
  rationale: 使徒的な指示を表す語の強さを保ち、「勧める」と弱めない。
- source_word: καὶ ποιεῖτε καὶ ποιήσετε
  choice: 今も行っており、これからも行う
  rationale: 現在形と未来形の対照を明確で自然な日本語にする。
theological_decisions:
- issue: 確信の根拠
  choice: 「主にあって」とし、確信が主に根差すことを明示する
  alternative: 「主によって」または「主を信じて」
  rationale: ἐν κυρίῳ の曖昧さを不必要に因果関係や心理的信頼へ限定せず、パウロ書簡に特徴的な表現を保つ。
- issue: 命令への服従の時制
  choice: 現在の実行と将来の継続をともに訳出する
  alternative: 「行っているとおり、今後も行う」
  rationale: 原文の現在形と未来形を保持し、将来についての確信を現在の行動だけに還元しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。冒頭の δέ は文脈上の展開を示すため「しかし」とした。ὅτι 以下は「すなわち」で内容節として明確にした。
