id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: ja
  text: 兄弟たち[a]、私たちは、私たちの主イエス・キリスト[b]の名によって、秩序を乱して歩み[c]、彼らが私たちから受けた伝承[d]に従わないすべての兄弟から距離を置く[e]よう、あなたがたに命じます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は男性複数形の語の訳ですが、ここでは教会全体への呼びかけです。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」は「メシア」とも訳せる称号です。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「秩序を乱して歩み」です。ここで「歩む」は生活の仕方を表します。文脈上、「怠惰な生き方をする」という意味を含む可能性があります。
    reason: lexical_alternative
  - marker: d
    text: 「伝承」は、使徒たちから受け渡された教えを指します。写本によっては「あなたがたが私たちから受けた」または「彼が私たちから受けた」とあります。本文は「彼らが私たちから受けた」と読みます。
    reason: textual_variant
  - marker: e
    text: 「身を引く」とも訳せます。ギリシア語は、親しい交わりから自ら距離を置くことを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: 私たちは……命じます
  rationale: 使徒的権威を伴う強い指示を表すため、「勧めます」ではなく「命じます」とした。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形と初代教会の家族的な呼称を保った。呼びかけの対象が教会全体であることは脚注で明示した。
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・キリストの名によって
  rationale: 「名によって」という厳粛な定型表現を保ち、その権威に基づく命令であることを自然な日本語で示した。Χριστόςは日本語で定着している「キリスト」とし、称号の意味を脚注に示した。
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: ……から距離を置く
  rationale: 親しい交わりから身を引く意味を明確にしつつ、本文が明記していない正式な除名という意味までは持ち込まない表現とした。
- source_word: παντὸς ἀδελφοῦ
  choice: すべての兄弟
  rationale: 単数形を含む原文の構造と共同体内の家族的呼称を反映した。日本語では「すべての兄弟」が該当する者を一人残らず指す。
- source_word: ἀτάκτως περιπατοῦντος
  choice: 秩序を乱すような生き方をし
  rationale: 「歩く」が生活態度を表す比喩であることを、現代日本語で分かりやすく表した。「怠惰に」と限定せず、語のより広い意味を保った。
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: 伝承に従わない
  rationale: παράδοσιςの「受け渡されたもの」という意味を保つため「伝承」とした。後代の慣習一般ではなく、使徒たちから伝えられた教えを指す。
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: 彼らが私たちから受けた
  rationale: SBLGNT本文の三人称複数形παρελάβοσανを明示的に訳した。直前の「すべての兄弟」が単数形なので構文はやや不揃いだが、その本文上の難しさを保持した。
theological_decisions:
- issue: Χριστοῦを称号としてどう訳すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは「油を注がれた者／メシア」を意味する称号だが、「イエス・キリスト」は現代日本語で広く定着している。称号の意味を失わせないよう脚注で「メシア」とも訳せることを示した。
- issue: στέλλεσθαι ὑμᾶς ἀπὸが命じる分離の範囲
  choice: 距離を置く
  alternative: 交わりを断つ／離れる
  rationale: 共同体内での懲戒的な距離を表しつつ、正式な除名や一切の接触禁止と断定しないことで、原文が残す範囲の曖昧さを保った。
- issue: ἀτάκτωςの具体的内容
  choice: 秩序を乱すような
  alternative: 怠惰な／規律に従わない
  rationale: 後続文脈では働かないことが問題となるが、この語自体を「怠惰」に限定せず、無秩序・規律違反という広がりを残した。
translation_notes:
  register: 明瞭で現代的ながら、使徒的命令の厳粛さを保つ文体とした。「距離を置く」「生き方」など自然な現代語を用い、「伝承」「主」「キリスト」といった本文上重要な語は格調と意味の連続性を保つため維持した。
