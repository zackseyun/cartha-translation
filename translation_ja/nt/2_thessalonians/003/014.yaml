  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: ja
  text: もし、この手紙によって伝えた私たちの言葉に従わない人がいるなら、その人を心に留め[a]、その人と交わりを持たないようにしなさい[b]。その人が恥ずかしく思うためです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人に特に注意しなさい」「その人を記しておきなさい」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その人と付き合わないようにしなさい」。これは矯正を目的とする措置であり、15節では、その人を敵と見なさず、兄弟として戒めるよう命じられている。
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: 別訳「その人が恥じ入るためです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακούει
  choice: 従わない
  rationale: ὑπακούωは権威ある教えや指示に聞き従うことを表す。ここでは否定形なので「従わない」とした。
- source_word: τῷ λόγῳ ἡμῶν
  choice: 私たちの言葉
  rationale: λόγοςはここで使徒たちの教え・指示を指すが、原文の表現を保ちつつ自然な「私たちの言葉」とした。
- source_word: διὰ τῆς ἐπιστολῆς
  choice: この手紙によって伝えた
  rationale: 属格を伴うδιάの手段・媒体の意味を明示した。「この」は文脈上、読まれている当該の手紙を指す。
- source_word: σημειοῦσθε
  choice: よく見定め
  rationale: 対象者を識別して注意に留める命令。日本語の「印を付ける」では物理的・制裁的に響きやすいため、文脈に即して「よく見定め」とした。
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: 交わりを持たないようにしなさい
  rationale: συναναμίγνυμιは人と交際する、付き合う意。共同体内での関係を制限する命令を、後代の教会法上の専門概念に限定せず表した。
- source_word: ἐντραπῇ
  choice: 恥じ入る
  rationale: 受動形の接続法で、恥を覚える、恥じるという目的を表す。単なる外的な辱めよりも、本人が自覚する含みを伝える。
- source_word: τις / τοῦτον / αὐτῷ
  choice: 人／その人
  rationale: 不定代名詞とそれを受ける指示詞・代名詞の指示関係を、自然で性別を不必要に限定しない日本語で明確にした。
theological_decisions:
- issue: μὴ συναναμίγνυσθαι αὐτῷが命じる措置の性質
  choice: 不従順な共同体の一員との交わりを制限する、矯正を目的とした措置
  alternative: 最も強い意味での正式な破門、または教会的含意のない単なる私的回避
  rationale: 直後の15節はその人を敵と見なさず兄弟として戒めるよう命じるため、最終的な断罪ではなく矯正的な関係制限と読むのが文脈に合う。ただし訳文自体では制度的範囲を限定しない。
- issue: ἐντραπῇの目的
  choice: 本人が恥を自覚することを目的とする
  alternative: 公の屈辱それ自体を目的とする
  rationale: ἵναによる目的節と15節の文脈は、辱めを最終目的とするより、本人の反省と矯正を目指すことを示す。「恥じ入る」はその道徳的な自覚を表すが、本文に明記されない悔い改めまで訳し込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令の厳粛さを保った。「交わり」は共同体的関係を自然に示す聖書語として通用するが、専門的な教会処分の名称にはしていない。原文の目的節は断定的な結果ではなく目的として訳した。
