  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: ja
  text: 私たちの主イエス・キリストの恵みが、あなたがた全員とともにありますように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: 神から無償で与えられる好意と賜物を表すパウロ書簡の定着した語として、祝祷にも自然な「恵み」を採用した。
- source_word: κυρίου
  choice: 主
  rationale: イエスの権威と尊厳を示す称号であり、日本語聖書で定着した「主」が簡潔かつ適切である。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: Ἰησοῦςは固有名として「イエス」、Χριστόςは「油注がれた者」という称号に由来するが、この定型的な結びでは固有名に近い用法でもあるため、現代日本語で広く定着した「イエス・キリスト」とした。称号性を明示する「イエス・メシア」も可能だが、本文では自然さと理解しやすさを優先した。
- source_word: μετὰ πάντων ὑμῶν
  choice: あなたがたすべてとともに
  rationale: μετάと属格の「ともに」を保ち、πάντων ὑμῶνが共同体の全員を含むことを明示した。祝祷として自然になるよう「ありますように」を補った。
theological_decisions:
- issue: Χριστοῦを称号として訳すか、定着した呼称として訳すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςの称号としての意味は保たれているものの、この書簡末尾の定型句では「イエス・キリスト」が一まとまりの呼称に近く機能する。日本語での定着度と礼拝的な自然さを考慮しつつ、称号性を不当に否定しない訳とした。
- issue: 祝祷の省略された動詞の表現
  choice: ありますように
  alternative: あるように
  rationale: 原文は動詞を明示しない名詞文的な祝祷である。日本語では願いであることを自然かつ丁寧に示すため、「ありますように」を補った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡末尾の祝祷にふさわしい簡潔で格調ある文体とした。「あなたがた」は複数の受取人を明確にし、「すべて」を添えて共同体全体への包括性を保った。
