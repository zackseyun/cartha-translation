id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: ja
  text: しかし、主は真実な方です。主はあなたがたを強くし、悪い者から守ってくださいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪から」。ギリシア語 τοῦ πονηροῦ は、男性形の「悪い者」とも、中性形の「悪」とも解釈できます。
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: 真実な方
  rationale: 主が信頼に値し、約束に忠実であることを表す。直前の人間の不信仰との対照も自然に伝わる。
- source_word: δέ
  choice: しかし
  rationale: 直前の「すべての人に信仰があるわけではない」と主の真実さとの対照を明確に示す。
- source_word: ὁ κύριος
  choice: 主
  rationale: 称号をそのまま保ち、文脈上の指示対象を訳文で過度に特定しない。
- source_word: στηρίξει
  choice: 強くし
  rationale: 確立する、堅くする、強めるという意味領域を、牧会的文脈に合う自然な現代日本語で表す。
- source_word: φυλάξει
  choice: 守ってくださいます
  rationale: 見張って保護するという能動的な意味を表し、主を主語とする日本語として敬意を自然に示す。
- source_word: ἀπὸ
  choice: から
  rationale: 危険から離して守るという関係を素直に表す。
- source_word: τοῦ πονηροῦ
  choice: 悪い者
  rationale: 定冠詞付き属格単数は男性形「悪い者」と中性形「悪」双方に解し得る。本文では新約聖書で一般的な人格的理解を採り、別解を脚注に残す。
theological_decisions:
- issue: τοῦ πονηροῦの指示対象
  choice: 悪い者
  alternative: 悪
  rationale: ギリシア語の形は男性と中性の両方に解釈できるため、本文では人格的な読みを採用しつつ、抽象的な読みを脚注で明示して真正な曖昧さを保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。原文の二つの未来動詞を日本語では一続きの約束として表し、敬語は「くださいます」にまとめて自然さを保った。
