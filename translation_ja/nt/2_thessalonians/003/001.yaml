id: 2TH.3.1
reference: 2 Thessalonians 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: ja
  text: 最後に、兄弟たち[a]、私たちのために祈ってください。主のことばが、あなたがたのところでそうであったように、速やかに広まり、あがめられるように[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、会衆全体を代表的に呼びかけている可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳では、「走り、栄光を受けるように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: 最後に
  rationale: 手紙の結びの勧告を導く談話標識として、現代日本語で自然な表現を採用した。
- source_word: προσεύχεσθε
  choice: 祈ってください
  rationale: 現在命令形による継続的な要請を、会衆への丁寧で自然な勧告として表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を保ちつつ、会衆全体を代表的に指し得ることを脚注で示した。
- source_word: περὶ ἡμῶν
  choice: 私たちのために
  rationale: προσεύχομαιとともに用いられるπερί＋属格を、日本語の自然な祈願表現にした。
- source_word: ὁ λόγος τοῦ κυρίου
  choice: 主のことば
  rationale: 聖書的な「ことば」という表現を保ち、主に属する、また主について宣べ伝えられる福音の知らせを指し得る余地を残した。
- source_word: τρέχῃ
  choice: 速やかに広まり
  rationale: 直訳は「走る」だが、ここでは主のことばが迅速に進展する比喩であるため、その意味を明瞭な現代日本語で表した。
- source_word: δοξάζηται
  choice: あがめられる
  rationale: 主のことばが栄誉を受け、ふさわしく受け入れられるという受動態の意味を、宗教的文脈にも自然な語で表した。
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: あなたがたのところでそうであったように
  rationale: テサロニケの信徒たちのもとですでに起きたこととの比較を、原文で省略された述語を補って自然に表した。καίの強意・付加の意味は「そうであったように」という比較の中に含めた。
theological_decisions:
- issue: 会衆への呼びかけἀδελφοίの範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 原文の文法上の男性形を本文で保持しながら、男女を含む会衆全体への代表的呼称であり得ることを脚注で明示した。
- issue: 主のことばが「走る」という比喩
  choice: 速やかに広まり
  alternative: 走り
  rationale: 比喩を逐語的に固定せず、福音が迅速に進展するという意味を明瞭にした。ただし原文の像は脚注に残した。
- issue: δοξάζηταιが主のことばについて用いられる意味
  choice: あがめられる
  alternative: 栄光を受ける／重んじられる
  rationale: 「栄光を受ける」という原義と、人々から尊ばれ受け入れられるという文脈上の意味の双方を保ちやすい表現を選んだ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祈りの要請にふさわしい丁寧さと聖書本文としての品位を保った。「主のことば」は定着した聖書的表現として保持した。
