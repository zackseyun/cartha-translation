  naturalness: 明瞭な現代標準日本語であり、会衆に対する丁寧な要請としても自然である。「速やかに広まり、あがめられる」は文脈上理解可能で、「主のことば」に対する敬意と受容の両面を保つ。
  terminology: 「主のことば」は聖書日本語として定着した表現であり、κύριοςおよびλόγοςの意味領域を不必要に狭めない。「兄弟たち」は原文の男性複数呼格を保持し、会衆全体を含み得る点を脚注で適切に補っている。脚注bも、τρέχῃとδοξάζηταιの直訳的な像を示しており、アンカー位置・内容ともに適切である。
