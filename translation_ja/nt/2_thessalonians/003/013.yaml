  text: ὑμεῖς δέ, ἀδελφοί, μὴ ⸀ἐγκακήσητε καλοποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: ja
  text: しかし、兄弟たち[a]、あなたがたは善を行うことに疲れてはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、信仰者の共同体全体への包括的な呼びかけとして用いられ得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: しかし、あなたがたは
  rationale: δέによる直前の怠惰な人々との対比を「しかし」で示し、明示された代名詞ὑμεῖςの強調を「あなたがたは」で保った。日本語として自然になるよう、呼びかけを両者の間に置いた。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形による呼びかけを直接訳した。会衆全体を含み得る語用論的な広がりは脚注で示した。
- source_word: μὴ ἐγκακήσητε
  choice: 疲れてはなりません
  rationale: μήを伴うアオリスト接続法の禁止を表し、善い行いを続ける中で気力を失い、くじけるというἐγκακέωの意味を、明瞭で自然な現代日本語にした。
- source_word: καλοποιοῦντες
  choice: 善を行うことに
  rationale: 現在分詞が示す継続的な行為と、その行為において疲れないようにとの意味関係を自然に表した。
theological_decisions:
- issue: 会衆への呼びかけにおけるἀδελφοίの範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち
  rationale: 語形上は男性複数の「兄弟たち」だが、パウロの会衆への呼びかけとして女性を含む共同体全体を指し得る。本文では原語の形を保ち、その包括的用法を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「疲れてはなりません」は、単なる身体的疲労ではなく、善い行いを続けるうちに気力を失う意味を文脈上担う。
