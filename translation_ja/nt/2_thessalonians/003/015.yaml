  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: ja
  text: その人を敵と見なしてはならず[a]、むしろ兄弟[b]として戒めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人を敵だと考えてはなりません」。
    reason: lexical_alternative
  - marker: b
    text: ここで「兄弟」は、同じ信仰共同体に属する仲間を指す代表的な表現です。
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: 見なしてはならず
  rationale: ἡγέομαιは、ある人を特定の立場・種類に属する者と判断することを表す。「見なす」は、その評価的な意味を自然な現代日本語で保つ。
- source_word: ἐχθρόν
  choice: 敵
  rationale: 共同体の規律を受ける人を、敵の部類に入れてはならないという対比を明確に表す標準的な訳語。
- source_word: νουθετεῖτε
  choice: 戒めなさい
  rationale: νουθετέωには、誤りを正す目的で警告し、心に言い聞かせる意味がある。「戒める」は、単なる教示より強い是正の意図と、兄弟に対する配慮の双方を簡潔に表せる。
- source_word: ἀδελφόν
  choice: 兄弟
  rationale: 原文の単数男性名詞を保持する。ここでは肉親に限定されず、キリスト者共同体に属する仲間を指すため、その代表的用法を脚注で示す。
- source_word: ὡς
  choice: として
  rationale: 相手をどのような立場の者として認識し、戒めるかを示す二つの対照を自然な日本語で表す。
- source_word: καὶ μὴ ... ἀλλὰ
  choice: しかし、…てはならず、…なさい
  rationale: 直前の規律上の指示を受けながら、敵視と兄弟としての戒めを強く対比する。日本語では「しかし」により文脈上の転換を明瞭にした。
theological_decisions:
- issue: 従わない信徒に対する規律の姿勢
  choice: その人を敵とは見なさず、なお兄弟として是正するよう命じる訳とした。
  alternative: 教会の規律に限らない、一般的な対人関係上の助言として訳すことも考えられる。
  rationale: 直前の3章14節は、手紙の言葉に従わない共同体内の人を問題にしている。「兄弟」という呼称は、距離を置く措置が個人的敵意ではなく、共同体の仲間を正すためのものであることを示す。ただし、訳文自体では教会制度や処分の具体像を補わない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「戒める」により是正的な力を保ちつつ、「兄弟として」との対比によって牧会的な姿勢も示した。命令の複数性は日本語では明示せず、文脈に委ねた。
