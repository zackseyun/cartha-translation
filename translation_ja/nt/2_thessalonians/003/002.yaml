  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: ja
  text: また、私たちが道理に外れた[a]邪悪な人々から救い出されるように。すべての人に信仰[b]があるわけではないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「道理に外れた」は、「不合理な」「不適切な」とも訳せます。ギリシア語は、常識や道理に反することを表します。
    reason: lexical_alternative
  - marker: b
    text: または「すべての人が誠実（または忠実）なわけではないからです」。ギリシア語は直訳すると、「信仰（または誠実さ）はすべての人のものではない」となります。
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: 私たちが救い出されるように
  rationale: ἵναに続くアオリスト受動接続法の目的表現を保ち、敵対する人々から危害を免れる意味を、手段を限定せず自然な日本語で表した。
- source_word: ἀτόπων
  choice: 道理に外れた
  rationale: 「場違いな、不適切な、不合理な」という語義の幅を踏まえ、πoνηρῶνと同義にせず、敵対者の不当で道理に反するあり方を表した。
- source_word: πονηρῶν
  choice: 悪い
  rationale: 一般的な道徳的悪を表す語として明瞭であり、「道理に外れた」と組み合わせても不自然に意味を重複させない。
- source_word: ἀνθρώπων
  choice: 人々
  rationale: ここで性別を特定する文脈上の根拠はなく、複数の敵対者を指す自然な現代日本語とした。
- source_word: πίστις
  choice: 信仰
  rationale: 文脈上、使徒の宣教に敵対する者たちが信仰を持たないことを指す可能性が最も高い。ただし「誠実さ、忠実さ」の可能性も注で残した。
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: すべての人に信仰があるわけではないからです
  rationale: 直訳的には「信仰はすべての人のものではない」という省略的表現である。「すべての人にあるわけではない」として、全員ではないという部分否定を明確に保った。
theological_decisions:
- issue: πίστιςを「信仰」と「誠実さ」のどちらに取るか
  choice: 信仰
  alternative: すべての人が誠実なわけではない
  rationale: 直前の敵対者と宣教の文脈では、彼らが信仰を持たないという理解が自然である。一方、πίστιςには「忠実さ、信頼に値すること」の語義もあるため、曖昧さを注で保存した。
- issue: οὐ ... πάντωνの否定範囲
  choice: すべての人に信仰があるわけではない
  alternative: 信仰は万人のものではない
  rationale: ギリシア語の部分否定を日本語で明確にし、「誰にも信仰がない」という誤読を避けた。
translation_notes:
  register: 明瞭で落ち着いた現代標準日本語。節頭のκαίとἵναが前節の祈りの依頼に続く構造を保つため、「また……ように」とし、本文に「祈ってください」を補わなかった。
