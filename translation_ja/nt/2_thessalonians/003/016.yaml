id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: ja
  text: どうか、平和の主ご自身が、いつも[a]、あらゆるしかたで[b]、あなたがたに平和を与えてくださいますように。主があなたがたすべてと共におられますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「絶えず」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「あらゆる方法で」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: ご自身が
  rationale: 主を強調する用法であり、平和を与える方が主ご自身であることを、自然で敬意ある日本語で表す。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは結びの祝福への穏やかな移行を示す。日本語では「どうか」で祈願の開始が自然に示されるため、「さて」「しかし」などを明示すると不必要に強くなる。
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: 平和の主
  rationale: 属格を説明的に展開せず、称号的な表現を簡潔に保持する。κύριοςは文脈上の称号として「主」と訳す。
- source_word: δῴη
  choice: どうか……与えてくださいますように
  rationale: 祈願・祝福に用いられたアオリスト希求法の願望の力を、現代日本語の自然な祈願表現で示す。
- source_word: τὴν εἰρήνην
  choice: 平和を
  rationale: ギリシア語の冠詞を機械的に反映せず、日本語として自然に、与えられるものを「平和」と表す。
- source_word: διὰ παντὸς
  choice: いつも
  rationale: 時間を通じた継続性を簡潔で自然な日本語で表す。「絶えず」という語義上の別訳は注に残す。
- source_word: ἐν παντὶ τρόπῳ
  choice: あらゆるしかたで
  rationale: τρόποςの方法・様態の幅を保ちつつ、「あらゆる方法で」よりも文脈になじむ自然な表現とする。
- source_word: μετὰ πάντων ὑμῶν
  choice: あなたがたすべてと共に
  rationale: πάντωνの包括性を明示し、共同体の全員を指す複数形の範囲を保つ。
theological_decisions:
- issue: 祝福文における「主」の指示対象
  choice: 本文どおり「主」とし、それ以上の名を補わない。
  alternative: 「主イエス」と明示する、または一般的に「神」と解する。
  rationale: パウロ書簡の文脈では主イエスを指す可能性が高いが、ギリシア語本文はὁ κύριοςとのみ述べる。翻訳では本文の表現と指示上の余地を保持する。
- issue: 最後の無動詞節の力
  choice: 「主が……共におられますように」と祈願的な祝福として訳す。
  alternative: 「主は……共におられます」と直説的な断定として訳す。
  rationale: ギリシア語には動詞が明記されていないが、結びの文脈では慣用的な祝福・願いとして機能するため、日本語では「ように」を補う。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈願文としての品位を保った。「ご自身」「与えてくださいますように」「共におられますように」により敬意ある調子を整えつつ、古風すぎる語法は避けた。
