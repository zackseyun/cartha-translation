source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: ja
  text: 実際、私たちがあなたがたと一緒にいた時にも、私たちはこう繰り返し命じていました。「働こうとしない者は、食べてはならない[a]。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その者を食べさせてはならない」。原文の三人称命令は、当人への命令とも、その者に食べさせないよう共同体に求める言葉とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 原文は「働けない者」ではなく、「働こうとしない者」と述べている。能力の欠如ではなく、意志の欠如を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ～時にも
  rationale: γάρの説明的なつながりは文脈に委ね、καίの強調を「にも」で自然に表した。日本語で「というのも、…時にも」とすると重くなるため、明晰さを優先した。
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: 私たちがあなたがたと一緒にいた時
  rationale: πρόςが人を目的語に取るここでは、その人々のもとにいて共に過ごす意味であり、現代日本語として自然な「一緒にいた」とした。
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: こう繰り返し命じていました
  rationale: τοῦτοが後続内容を指すことを「こう」で示し、παρηγγέλλομενの未完了過去が持つ反復・継続的な命令のニュアンスを「繰り返し…ていました」で表した。
- source_word: εἴ τις οὐ θέλει ἐργάζεσθαι
  choice: 働こうとしない者は
  rationale: θέλειは能力の欠如ではなく意志・意欲を表す。「働けない者」ではなく、自ら働く意志を持たない者を指すことが明確になる表現を選んだ。
- source_word: μηδὲ ἐσθιέτω
  choice: 食べてもならない
  rationale: μηδέを先行する否定と呼応する「～も」で表し、三人称命令法の規範的・命令的な力を「～てはならない」で保持した。
theological_decisions:
- issue: 働く能力がない者と、働く意志がない者の区別
  choice: 「働こうとしない者」とし、意志的な不労を指すようにした。
  alternative: 「働けない者」
  rationale: θέλειは意志を表すため、この言葉を就労不能者にまで広げるのは原文の意味を越える。
- issue: μηδὲ ἐσθιέτωの命令の向き
  choice: 「食べてもならない」として、当人に対する三人称命令として訳した。
  alternative: 「その者に食べさせてはならない」
  rationale: 後者は共同体が食物を与えることへの禁止と明示するが、ギリシア語は単に「その者は食べるな」という形であり、誰が執行するかを限定していない。
translation_notes:
  register: 明快な現代標準語を用いながら、使徒的な命令の厳粛さを保持した。「者」は一般的な人物を指し、性別を限定しない。引用符により、τοῦτοが導く命令内容を明確にした。
