  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: ja
  text: また、私たちはだれからもパンをただで食べることはせず[a]、むしろ、あなたがたのだれにも負担をかけないように、苦労と骨折りを重ねて、夜も昼も働きました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれのパンもただで食べることはせず」。ギリシア語は「パン」という語をそのまま用いていますが、食物や物質的な援助全般を指すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: ただで
  rationale: 贈り物として、または代価を払わずに受ける意味を、自然な現代日本語で表す。文脈上、無償の物質的援助という含みも保たれる。
- source_word: ἄρτον
  choice: パン
  rationale: 字義どおりの具体的表現を保持する。ここでは食物や生活上の支援を広く指し得るため、その点を脚注で補う。
- source_word: παρά τινος
  choice: だれからも
  rationale: 属格を伴う παρά の出所を示す意味と、不定代名詞 τις を自然な否定文として表す。
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: 苦労し骨を折って
  rationale: 近義語を重ねて厳しい労苦を強調する原文の累積的な力を、明瞭で自然な日本語の二重表現で伝える。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 夜も昼も
  rationale: 時間の属格による継続的な働きを、日本語の慣用的な対句で表す。
- source_word: ἐργαζόμενοι
  choice: 働きました
  rationale: 分詞が示す実際の労働を明瞭にし、日本語では主節として自然に構成する。
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: 負担をかけないように
  rationale: 目的を表す構文を保持し、ἐπιβαρέω の経済的・物質的負担という文脈的意味を自然に表す。
- source_word: τινα ὑμῶν
  choice: あなたがたのだれにも
  rationale: 不定代名詞の配分的な意味を明確で自然な日本語にする。
- source_word: οὐδὲ ... ἀλλ’
  choice: また、…ことはせず、…
  rationale: 前文に続く否定と、それに対置される行動を日本語として滑らかに示す。明示的な「しかし」を置かなくても、「せず」によって対照は保たれる。
