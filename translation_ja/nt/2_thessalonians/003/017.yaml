  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: ja
  text: この挨拶は、私パウロ自身の手によるものです。これは、どの手紙にもあるしるしです。[a] 私はこのように書きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「この挨拶は、私パウロ自身の手によるものです。これはどの手紙にもあるしるしです。このように私は書きます」。前半の原文には動詞がなく、パウロ本人の自筆による挨拶であることを示します。最後の句は「このように私は書きます」とも訳せます。
    reason: 前半の動詞を欠く名詞表現と、οὕτως γράφω の語順・係り方に関する翻訳上の幅を示すため。
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: この挨拶
  rationale: 書簡末尾の挨拶を指すため、現代日本語で自然な「この挨拶」とした。
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: 私パウロが自分の手で書いています
  rationale: 直訳的な「私パウロの手による」より自然に、パウロ本人の自筆であることを明示する。原文で補われる「書く」は末尾の γράφω と文脈から明らかである。
- source_word: σημεῖον
  choice: 印
  rationale: ここでは本人の手紙であることを識別・証明するしるしを意味する。「印」は簡潔で広く理解できる。
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: どの手紙にもある
  rationale: πάσῃ の全称的な表現を保ちつつ、自然な現代日本語とした。
- source_word: οὕτως γράφω
  choice: 私はこのように書きます
  rationale: οὕτως の指示的・様態的な意味を保つ直截な訳。自筆の書き方を指す可能性と、定型的な結びを指す可能性を狭めすぎない。
theological_decisions:
- issue: パウロの自筆句が持つ認証の意味
  choice: 「印」として提示し、本人の自筆が手紙を識別する働きを示す
  alternative: 末尾の句を「以上、私が書きました」のように、この手紙だけを指す結語と取る
  rationale: 「どの手紙にもある印」という直前の表現は認証的な機能を示唆するが、οὕτως γράφω が厳密に筆跡、書式、またはこの挨拶の書き方のどれを指すかは限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「自筆」だけに寄せず「自分の手で書いています」として一般読者に意味を明確にし、脚注で原文に近い名詞表現と末尾句の幅を示した。
