source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: ja
  text: どうか主が、あなたがたの心を神の愛に、またメシアの忍耐に向けてくださいますように。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神への愛」とも訳せる。また、「神が注ぐ愛」という意味にも取れる。
    reason: alternative_reading
  - marker: b
    text: 「メシア自身の忍耐」、または「メシアのために耐え忍ぶこと」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: ギリシア語は「クリストス（キリスト）」。「油注がれた者」を意味する称号なので、ここでは「メシア」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 新約聖書における神的・キリスト論的称号としての重みを保ちつつ、指示対象を本文以上に限定しない標準的な訳語。
- source_word: κατευθύναι
  choice: 導いてくださいますように
  rationale: アオリスト能動態希求法が表す祈願を自然な現代日本語で示す。「まっすぐに向ける」という含意も、目的地を示す「へと」と組み合わせて保つ。
- source_word: καρδίας
  choice: 心
  rationale: 思考・意志・感情を含む人間の内面の中心を表す聖書的比喩を維持する。日本語では複数の読者に対しても「あなたがたの心」が自然。
- source_word: ἀγάπην
  choice: 愛
  rationale: ἀγάπηの平明かつ標準的な対応語。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格を直訳的に保ち、神が注ぐ愛、神への愛、神に属する愛という解釈可能性を本文で限定しない。
- source_word: ὑπομονὴν
  choice: 忍耐
  rationale: 圧迫や困難の下で堅く持ちこたえることを表すὑπομονήの標準的で分かりやすい訳語。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςが称号として持つ「油注がれた者」の意味を示すため「メシア」とし、属格の意味関係は限定しない。
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ の属格の曖昧さ
  choice: 「神の愛」と訳し、意味関係を本文で確定しない。
  alternative: 「神への愛」または「神が注ぐ愛」
  rationale: ギリシア語の属格は主体的・客体的その他の理解が可能であり、一つの神学的解釈へ狭めるべきではない。
- issue: τὴν ὑπομονὴν τοῦ Χριστοῦ の属格の曖昧さ
  choice: 「メシアの忍耐」と訳し、意味関係を本文で確定しない。
  alternative: 「メシアが示す忍耐」または「メシアを待ち望む忍耐」
  rationale: メシア自身の忍耐、メシアに向けられた忍耐、メシアに特徴づけられる忍耐などの可能性があるため、本文では曖昧さを保つ。
- issue: Χριστοῦ の訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号として機能しているため、その意味を伝える「メシア」を採用する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祈願を「どうか……くださいますように」で自然に表し、「へ……へと」という原文の並行構造を維持した。属格二箇所の神学的曖昧さは本文と脚注で保持した。
