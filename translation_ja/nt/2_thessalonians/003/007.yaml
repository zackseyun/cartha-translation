lexical_decisions:
- source_word: αὐτοὶ
  choice: あなたがた自身
  rationale: 主語に強調を添え、テサロニケの信徒自身がすでに知っていることを明示する。
- source_word: γὰρ
  choice: からです
  rationale: 前節の勧めに対する説明・根拠を示す接続関係を、日本語では文末の理由表現として自然に表した。
- source_word: οἴδατε
  choice: 知っています
  rationale: 形態は完了形だが現在の認識を表すため、現代日本語の自然な現在表現とした。
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: どのように私たちに倣うべきか
  rationale: πῶςの様態、δεῖの必要・義務、μιμεῖσθαιの模倣という各要素を、簡潔で自然な日本語に保った。
- source_word: ὅτι
  choice: からです
  rationale: 後続節を、彼らが倣い方を知っている根拠として理解し、因果関係を明確にした。
- source_word: οὐκ ἠτακτήσαμεν
  choice: 秩序を乱すような生活をしなかった
  rationale: ἀτακτέωの『規律を外れて振る舞う』という広い意味を保ちつつ、日本語として不自然な『無秩序に振る舞う』を避けた。文脈上の『怠惰でいる』という限定的理解は脚注に残した。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: テサロニケの信徒たちの中での振る舞いを自然かつ正確に表す。
theological_decisions:
- issue: ἀτακτέωの意味範囲
  choice: 秩序や規律から外れた生活全般を指す広い表現
  alternative: 特に『怠けていたのではない』
  rationale: 直近の文脈では働かないことが中心的な問題だが、動詞自体の意味はそれより広い。本文では意味を狭めず、文脈上有力な限定的解釈を脚注で示した。
translation_notes:
  register: 明快な現代標準日本語。使徒的模範への義務を示す品位は保ちつつ、直訳調の硬さを避けた。
