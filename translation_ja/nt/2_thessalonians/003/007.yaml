  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: ja
  text: あなたがた自身、どのように私たちに倣うべきかを知っています。なぜなら、私たちはあなたがたの間で無秩序な振る舞いをしなかった[a]からです。
  philosophy: optimal-equivalence
  footnotes:
