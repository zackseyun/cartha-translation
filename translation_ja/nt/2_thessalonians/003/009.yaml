id: 2TH.3.9
reference: 2 Thessalonians 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: ja
  text: それは、私たちにその権利[a]がないからではなく、私たち自身を、あなたがたが見倣うための模範[b]として示すためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「権威」または「力」とも訳せる。ここでは、支援を受ける正当な資格という意味が文脈に合う。
    reason: lexical_alternative
  - marker: b
    text: 「手本」または「型」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 権利
  rationale: 文脈は、働かずに物質的な支援を受ける正当な資格について述べているため、「権威」や一般的な「力」より「権利」が適切である。
- source_word: ἑαυτοὺς
  choice: 私たち自身を
  rationale: パウロと同労者たちを指す再帰代名詞の強調を保つ。
- source_word: τύπον
  choice: 模範
  rationale: 他者がまねるべき行動の型を表す。現代日本語で自然かつ品位があり、「手本」「型」という語義も含みうる。
- source_word: δῶμεν
  choice: 示す
  rationale: 直訳は「与える」だが、「自分たちを模範として与える」は日本語として不自然であるため、ギリシア語の慣用的な意味を「模範として示す」と表した。
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: あなたがたが見倣うための
  rationale: 目的を表す構文と「私たちをまねる」という意味を、直前の「私たち自身を」に自然に結び付けて表す。
- source_word: οὐχ ὅτι οὐκ ... ἀλλ’ ἵνα
  choice: それは、私たちに…がないからではなく、…ためでした
  rationale: 動機を否定して真の目的を示す対照構造を、明瞭な現代日本語で保つ。
theological_decisions:
- issue: ἐξουσίαν が指す権利の性質
  choice: パウロと同労者たちが支援を受ける正当な権利
  alternative: より広い意味での使徒的権威または力
  rationale: 直前の文脈は、他者に負担をかけず自ら働いたことを扱う。「権利」はその実際的な文脈を伝えつつ、使徒的権威に関するより広い教理を本文に持ち込まない。
- issue: ἵνα と εἰς τὸ μιμεῖσθαι の目的関係
  choice: 彼ら自身を模範として示すことが、読者による見倣いを目的とする
  alternative: 後半を独立した結果の説明として読む
  rationale: 両構文の目的性を保ち、「模範」と「見倣う」の密接な関係が日本語でも明確になるようにした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「見倣う」は「まねる」よりも、模範的な行動を意識的に倣うという文脈に適する。文脈上の過去の行動を受けて文末を「でした」とした。
