  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: ja
  text: また、その者は、滅びつつある者たちに対して[b]、あらゆる不義の欺き[a]をもって来ます。彼らが救われるために[d]、真理への愛を受け入れなかった[c]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不義に属するあらゆる欺き」または「あらゆる不義な欺き」。
    reason: lexical_alternative
  - marker: b
    text: 「滅びつつある者たちの間で」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「受け取らなかった」または「喜んで迎え入れなかった」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: 「彼らが救われるに至るために」とも訳せます。目的または結果の含みがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: 欺き
  rationale: 人を誤らせる働きを表す語であり、文脈に合う自然な日本語として「欺き」を選んだ。
- source_word: ἀδικίας
  choice: 不義の
  rationale: 属格によって欺きの道徳的性質が示されているため、名詞形と神学的含意を保って「不義の」とした。
- source_word: τοῖς ἀπολλυμένοις
  choice: 滅びつつある者たちに対して
  rationale: 現在分詞の進行的な状態を保ち、与格が示す対象・関係を「に対して」で表した。固定的な運命を示す表現にはしなかった。
- source_word: ἀνθ’ ὧν
  choice: からです
  rationale: ここでは、彼らが欺きのもとに置かれることの理由を導く因果的用法として自然に訳した。
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: 真理への愛
  rationale: 日本語では「真理の愛」だと真理が愛するという意味にも取られやすいため、文脈上有力な目的語的属格を「真理への愛」と明確にした。
- source_word: ἐδέξαντο
  choice: 受け入れなかった
  rationale: 単に受領しなかっただけでなく、真理への愛を迎え入れなかったという責任を自然に表す。
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: 彼らが救われるために
  rationale: εἰς＋冠詞付き不定詞が持つ目的・結果の含みを、断定的に狭めすぎず自然な日本語で示した。
theological_decisions:
- issue: 「滅びつつある者たち」を確定した運命として訳すか、進行中の状態として訳すか
  choice: 滅びつつある者たち
  alternative: 滅びに定められた者たち／滅ぼされる者たち
  rationale: 現在中・受動分詞の継続的な側面を保持し、予定や主体について本文以上の体系的解釈を持ち込まないため。
- issue: 「真理への愛」の属格関係
  choice: 真理への愛
  alternative: 真理の愛
  rationale: 文脈上は真理を愛し受け入れることが問題とされている可能性が高い。日本語の「真理の愛」は主語的にも読めて不自然なため、目的語的意味を自然に示した。
- issue: 節頭の καὶ ἐν 以下に明示的な動詞がないこと
  choice: 前節から到来の主語を受け、「現れます」を補った
  alternative: 「また、…あらゆる不義の欺きをもって」と断片のまま訳す
  rationale: ギリシア語では前節の「到来」に係る句だが、日本語で節を独立して読めるよう、文脈から明らかな現れを最小限補った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡にふさわしい落ち着いた敬体とした。「不義」「真理」「救われる」は聖書的な重みを保つ標準的な語を用いた。節頭は前節と文法的に連続するため、独立可読性を得る目的で「現れます」を補っている。
