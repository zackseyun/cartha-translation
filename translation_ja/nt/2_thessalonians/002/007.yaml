source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: ja
  text: 不法の奥義は、すでに働いています。ただ、今それを抑えている者[a]が、その場からいなくなるまで、それを抑えています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今、引き止めている者」。ギリシア語は、この抑える者が誰であるかを明らかにしていません。
    reason: alternative_reading
  - marker: b
    text: 「その場からいなくなるまで」は、「取り除かれるまで」または「中から外れるまで」とも訳せます。ギリシア語は、それがどのように起こるかを明示していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: 奥義
  rationale: 単なる謎ではなく、隠されていながら現に働いている実相を指すパウロ的な語感を保つ。
- source_word: ἐνεργεῖται
  choice: 働いています
  rationale: 不法の奥義がすでに現に作用しているという、継続中の働きを自然な日本語で表す。
- source_word: ἀνομίας
  choice: 不法
  rationale: 神の秩序や律法に逆らうという語義と、周辺文脈との主題的なつながりを保つ。
- source_word: μόνον
  choice: ただ
  rationale: 直前の叙述に制限を加える接続として、簡潔で自然に表す。
- source_word: ὁ κατέχων
  choice: それを抑えている者
  rationale: κατέχω の抑制する意味を示しつつ、その者が誰かを本文以上に特定しない。「それを」は日本語として目的語を補い、不法の働きを受ける。
- source_word: ἄρτι
  choice: 今
  rationale: 抑制が現在行われていることを簡潔に示す。
- source_word: ἕως ἐκ μέσου γένηται
  choice: 道を退くまで
  rationale: その者が妨げる位置からいなくなるという結果を自然に表し、誰かによって排除されるという行為者を明示しない。
theological_decisions:
- issue: ὁ κατέχων（抑えている者）の正体
  choice: 「今それを抑えている者」と一般的に訳し、正体を特定しない。
  alternative: ローマ国家、人間の政府、聖霊、天使的存在、パウロまたは使徒的宣教などと特定する。
  rationale: この節のギリシア語は抑える者に言及するが、その正体を明らかにしていないため、終末論上の論争を訳文で決着させない。
- issue: ἕως ἐκ μέσου γένηται における排除の行為者
  choice: 「道を退くまで」とし、外から排除する行為者を示さない。
  alternative: 「取り除かれるまで」「退けられるまで」と、受動的な排除を明示する。
  rationale: 原文はその者が中から外れた状態になることを表し得るが、誰がそうさせるかは明示していないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準語の丁寧体を用いた。「奥義」はやや格調ある聖書語だが、μυστήριον の神学的な含みを保つため採用した。後半の省略的なギリシア語は、日本語として文を成立させるため「抑え続けます」を補ったが、抑える者の正体と、その者が退く際の行為者は特定していない。
