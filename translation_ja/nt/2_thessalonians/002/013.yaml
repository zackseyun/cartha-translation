revisions:
- from: しかし、主に愛されている兄弟たち[b]、私たちは、あなたがたのことをいつも神に感謝しなければなりません。神が、御霊[c]による聖別と真理への信仰を通して、救いに至る初穂[a]としてあなたがたを選ばれたからです。
  to: しかし、主に愛されている兄弟たち[b]、私たちはいつも、あなたがたのことを神に感謝しなければなりません。神が、聖霊[c]による聖別と真理への信仰によって、あなたがたを救いのために初穂[a]として選ばれたからです。
  rationale: 原文の語順と論理関係を保ちながら、救いが神の選びの目標であることを日本語で明確にした。「聖霊」は現代標準語として自然であり、原語の解釈上の曖昧さは脚注で明示している。異読脚注は、SBLGNT本文と異読の差をより正確に示すよう整えた。
