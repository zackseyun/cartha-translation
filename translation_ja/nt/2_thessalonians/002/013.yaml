id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: ja
  text: しかし、主に愛されている兄弟たち[b]、私たちはいつも、あなたがたのことを神に感謝しなければなりません。神が、聖霊[c]による聖別と真理への信仰によって、あなたがたを救いのために初穂[a]として選ばれたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: いくつかの写本では、「神があなたがたを初めから救いのために選ばれた」とあります。本文はSBLGNTの「初穂」（ἀπαρχήν）に従っています。別の読みは「初めから」（ἀπ’ ἀρχῆς）です。
    reason: textual_variant
  - marker: b
    text: 「兄弟たち」に当たるギリシア語は男性複数形ですが、ここでは信仰共同体全体を指し、女性も含み得ます。
    reason: cultural_note
  - marker: c
    text: 「聖霊」は、ギリシア語の「霊」を聖霊と理解した訳です。この語は単に「霊」とも訳すことができ、人間の霊を指すと見る解釈もあります。
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: しかし、私たちは
  rationale: δέが直前の滅びる者たちとの対照を示し、明示されたἩμεῖςの強調も保つ。日本語では呼びかけを挟みつつ「しかし、…私たちは」とするのが自然。
- source_word: ὀφείλομεν
  choice: 感謝しなければなりません
  rationale: 道徳的な責務・当然な務めを表す。単なる義務感に限定せず、パウロの感謝の定型にも合う現代日本語。
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: あなたがたのことをいつも神に感謝する
  rationale: 与格の対象とπερί句を、自然な日本語の語順で明確に表す。
- source_word: ἀδελφοὶ
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文で直接に反映する。ただし共同体全体への呼びかけであり、女性も含み得ることを脚注で示す。
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: 主に愛されている
  rationale: 完了受動分詞が示す、主の愛を受けた状態が継続していることを、自然で温かみのある日本語で表す。
- source_word: εἵλατο
  choice: 選ばれた
  rationale: αἱρέομαιの中動態を「選ぶ」と訳し、本文が述べる神の選び以上の教派的含意を加えない。神への敬意を表す日本語として尊敬形を用いる。
- source_word: ἀπαρχὴν
  choice: 初穂として
  rationale: SBLGNT本文のἀπαρχήνをそのまま反映する聖書的比喩。「最初の実」より簡潔で、神にささげられる最初の収穫という含意も保持する。異読は脚注に示す。
- source_word: εἰς σωτηρίαν
  choice: 救いに至る
  rationale: εἰςが表す目標・帰結を、日本語で明瞭に示す。
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: 御霊による聖別
  rationale: ἐνを手段として自然に表し、ἁγιασμόςは神のために聖なるものとされることを表す「聖別」とした。文脈上πνεῦμαは聖霊を指す可能性が高いため「御霊」とするが、文法上の別解は脚注に残す。
- source_word: καὶ πίστει ἀληθείας
  choice: 真理への信仰
  rationale: 属格ἀληθείαςを客観的属格と捉え、真理を信仰の対象として示す自然な日本語。
theological_decisions:
- issue: ἐν ἁγιασμῷ πνεύματοςのπνεύματοςが指すもの
  choice: 聖霊（本文では「御霊」）
  alternative: 人間の霊、または明示的に限定しない「霊」
  rationale: パウロの救済論的文脈では、聖別を行う聖霊を指す理解が最も自然である。ただしギリシア語自体には「聖」という修飾語がなく、別解を完全には排除できないため脚注を付す。
- issue: εἵλατο ὑμᾶς ὁ θεὸςの含意
  choice: 神があなたがたを選ばれた
  alternative: 神があなたがたをご自分のものとして取られた／任命された
  rationale: 神の選びという語義を直接に訳し、選びの時期・根拠・仕方について本文にない体系的教義を付加しない。
- issue: ἀπαρχὴνと異読ἀπ’ ἀρχῆς
  choice: 初穂として
  alternative: 初めから
  rationale: 指定されたSBLGNT本文のἀπαρχήνに従う。一方、古く重要な異読が意味を大きく変えるため、脚注で明示する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒書簡にふさわしい端正さを保った。「初穂」「聖別」は聖書的・神学的な語だが、原文の比喩と概念を簡潔に保持するため採用し、必要な曖昧さと異読は脚注で説明した。
