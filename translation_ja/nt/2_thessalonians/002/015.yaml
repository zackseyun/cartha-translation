source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: ja
  text: ですから、兄弟たち[a]、堅く立ち、口頭であれ私たちの手紙であれ、あなたがたが教えられた言い伝えを固く守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは会衆全体への呼びかけと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ですから
  rationale: 二つの推論を示す小辞が、直前までの議論から結論を導く働きをしているため。現代日本語で自然にその論理的つながりを表す。
- source_word: ἀδελφοί
  choice: 兄弟たち[a]
  rationale: ギリシア語の男性複数呼格を本文に反映した。会衆全体を指す可能性が高いことは脚注で明示する。
- source_word: στήκετε
  choice: しっかり立ち
  rationale: 継続して揺るがずにいるよう求める現在命令形の力を、自然な日本語で表した。
- source_word: κρατεῖτε
  choice: 固く守りなさい
  rationale: 単に保持するだけでなく、離さず堅持するという動詞の強さを表す。
- source_word: τὰς παραδόσεις
  choice: 言い伝え
  rationale: 人から人へ伝え渡されたものという語義を保つため。「教え」だけでは、受け渡されたという含意が弱くなる。ここでは口頭と書面の双方による使徒的な伝達を指す。
- source_word: ἃς ἐδιδάχθητε
  choice: あなたがたが教えられた
  rationale: 受動形を保ち、テサロニケの信徒たちが教えを受けた側であることを明確にした。
- source_word: εἴτε διὰ λόγου
  choice: 口頭であれ
  rationale: 手紙との対比から、λόγος はここでは話されたことばを指す。日本語では「口頭で」が簡潔で明瞭。
- source_word: εἴτε δι’ ἐπιστολῆς ἡμῶν
  choice: 私たちの手紙であれ
  rationale: 口頭による伝達と、著者たちからの書面による伝達との対比を自然に示す。単数の「手紙」も保持した。
theological_decisions:
- issue: 後代の使徒的伝承をめぐる議論で用いられる παράδοσις の訳
  choice: 言い伝え
  alternative: 教え／指示
  rationale: 原文は、受け渡されたものを明示し、それが口頭と書面の双方で伝えられたと述べる。「言い伝え」はその語義を保持する一方、この節が明言していない後代の伝承の範囲や権威について、特定教派の結論を持ち込まない。
- issue: 男女を含む可能性が高い会衆への ἀδελφοί という呼びかけ
  choice: 兄弟たち[a]
  alternative: 兄弟姉妹の皆さん
  rationale: 本文では男性複数形を反映しつつ、パウロが会衆全体に呼びかけている可能性が高いことを脚注で補い、原文の形と文脈上の指示対象の両方を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の力を保ちながら過度に古風な表現を避けた。「言い伝え」はやや改まった聖書的文脈にも適合し、口頭・書面の双方で伝えられた内容を指すよう文脈で限定されている。
