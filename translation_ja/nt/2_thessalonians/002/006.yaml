  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: ja
  text: そして今、あなたがたは、彼が彼自身の時に[b]現されるために、何が彼を引き止めているのかを知っています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何が彼を抑えているのか」。ギリシア語は中性の表現を用いており、ここでは引き止めているものの正体を明らかにしていない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼に定められた時に」。ギリシア語の表現には、ふさわしい時、または定められた時という意味があり得る。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: 何が彼を引き止めているのか
  rationale: 中性単数の冠詞付き分詞を、主体を特定しない「何が」で表した。「引き止める」は、抑制する、妨げるという意味を自然な現代日本語で伝え、抑止するものの正体を限定しない。目的語の「彼」は直後の αὐτόν と文脈上の対象を明確にするため補った。
- source_word: οἴδατε
  choice: あなたがたは知っています
  rationale: 完了形に由来する現在的な意味を素直に表し、読者が以前の教えによってすでに知っていることへの言及を保った。
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: 彼が……現されるために
  rationale: εἰς＋冠詞付き不定詞の目的・結果の含みを「ために」で表した。受動態を保つことで、彼を現す主体を本文以上に特定しない。
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: 自分の時に
  rationale: ἑαυτοῦ の再帰的な意味を「自分の」で保ち、καιρός をまず「時」と訳した。「定められた時」という可能な含意は注に示し、本文では解釈を狭めない。
- source_word: νῦν
  choice: 今
  rationale: 単純な時間副詞として、文脈に自然な「今」とした。
- source_word: αὐτόν
  choice: 彼
  rationale: 前節までに述べられ、やがて現される男性の人物を指す代名詞として訳し、その人物の正体について新たな説明を加えなかった。
theological_decisions:
- issue: 引き止めているものの正体
  choice: 中性表現を「何が」と訳し、その正体を特定しない。
  alternative: ローマの秩序・政府、聖霊、天使的存在、神の定めまたは摂理などと明示する。
  rationale: この節自体は引き止めるものを同定しておらず、τὸ κατέχον は中性である。長く議論されてきた解釈を訳文に持ち込まず、原文の曖昧さを保つ。
- issue: 終末論的文脈における καιρός の意味
  choice: 本文では「自分の時」とする。
  alternative: 「彼に定められた時」「ふさわしい時」とする。
  rationale: καιρός には定められた、またはふさわしい時という含みがあり得るが、本文ではより広い表現を用い、その含みは注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた語調を保った。長いギリシア語文の論理関係を一文のまま示し、抑止する主体と時の性質について原文が残す曖昧さを注で補った。
