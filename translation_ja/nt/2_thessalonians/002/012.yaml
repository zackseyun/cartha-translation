id: 2TH.2.12
reference: 2 Thessalonians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: ja
  text: それは、真理を信じず、不義を喜んだ者がみな、裁かれるためです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪に定められる」。ギリシア語の動詞は字義的には「裁かれる」ですが、この文脈では不利な裁きを含意し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは～ためです
  rationale: 前文との目的・結果のつながりを示しつつ、どちらか一方に限定しすぎない自然な日本語とした。
- source_word: κριθῶσιν
  choice: 裁かれる
  rationale: κρίνωの基本的な司法的意味を保つ。文脈上は不利な裁きを含意するが、本文では「罪に定められる」と断定して意味を強めない。
- source_word: πάντες
  choice: みな
  rationale: 後続する「者」を受け、対象の全体を簡潔で自然に表す。
- source_word: οἱ μὴ πιστεύσαντες
  choice: 信じず…者
  rationale: 冠詞付きアオリスト分詞の実体詞的用法を日本語の連体節で表した。「真理」を目的語とするため、「信頼せず」より「信じず」が自然である。
- source_word: τῇ ἀληθείᾳ
  choice: 真理を
  rationale: πιστεύωに伴う与格を日本語では目的格で自然に表し、定冠詞の指示性を踏まえて福音に関わる特定の真理を示す「真理」とした。
- source_word: ἀλλὰ
  choice: ～ず、…
  rationale: 日本語では否定形と肯定形を並べることで強い対照が自然に伝わるため、独立した「しかし」を置かず構文上の対比として表した。
- source_word: εὐδοκήσαντες
  choice: 喜んだ
  rationale: 単なる知的承認ではなく、好み、満足する意志的・感情的な態度を簡潔に示す。
- source_word: τῇ ἀδικίᾳ
  choice: 不義を
  rationale: 道徳的悪、不正、正しさに反することを含むパウロ的な神学的語調を保つ。
theological_decisions:
- issue: κριθῶσινを一般的な「裁かれる」とするか、否定的結果を明示する「罪に定められる」とするか
  choice: 裁かれる
  alternative: 罪に定められる
  rationale: 直前までの文脈は明らかに否定的だが、κρίνω自体はより広く「裁く」を意味する。原文以上に結末を明示せず、文脈が持つ断罪の含みを保った。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある文体。「不義」は日常語よりやや高い語調だが、原文の道徳的・神学的広がりを保つため採用した。
