  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: ja
  text: その者の到来は、サタンの働きによるもので、あらゆる力と、しるしと、偽りの不思議な業を伴います[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「到来」は、「現れること」または「臨在」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「あらゆる力と、しるしと、偽りの不思議な業をもって（または、において）」。「偽りの」は「不思議な業」だけでなく、列挙された力・しるし・不思議な業の全体を特徴づけている可能性もあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: その者の
  rationale: 属格の関係代名詞は前節の「不法の者」を受ける。日本語では指示語で受けて「その者の」とするのが自然で、属格のつながりも保てる。
- source_word: παρουσία
  choice: 到来
  rationale: 終末論的な文脈で人物がやって来て姿を現すことを指すため、「到来」とした。単なる静的な存在に限定しない。
- source_word: κατ’ ἐνέργειαν
  choice: 働きによるものであり
  rationale: κατάはここで様態・規準・対応関係を表し、その到来がサタンの活動に即して起こることを示す。「働きによる」は作用の意味を保ちつつ現代日本語として明瞭である。
- source_word: Σατανᾶ
  choice: サタン
  rationale: 新約聖書で一般的な固有名の音写を採用した。属格はその働きがサタンに属し、またはサタンから出ることを示す。
- source_word: ἐν πάσῃ δυνάμει
  choice: あらゆる力と…を伴います
  rationale: ἐνはここで到来に伴う手段・様態を導く。「あらゆる力」として、δύναμιςを直ちに「奇跡」に限定しない。
- source_word: σημείοις
  choice: しるし
  rationale: 何かを示し、裏づける現象を表す標準的な訳語。超自然的現象か単なる偽装かは訳文で決めない。
- source_word: τέρασιν
  choice: 不思議な業
  rationale: 驚異を引き起こす異常な出来事を、現代日本語で分かりやすく表した。「しるし」と対をなす語感も保つ。
- source_word: ψεύδους
  choice: 偽りに満ちた
  rationale: 属格は少なくとも「不思議な業」を偽りによって特徴づけ、文脈上は列挙全体にも及び得る。「偽物」と断定せず、虚偽・欺瞞との結びつきを示す表現とした。
theological_decisions:
- issue: サタンに由来する現象の性質
  choice: 力やしるしや不思議な業が偽りに特徴づけられていることを示し、それらが単なる手品か実在する超自然的現象かは断定しない。
  alternative: すべて偽物の奇跡であると訳す、またはサタンが行う真正の奇跡であると明示する。
  rationale: ギリシア語本文は到来をサタンの働きと結びつけ、力・しるし・不思議な業をψεύδουςで特徴づけるが、その現象の存在論的性質までは説明していないため、緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体とした。「到来」「しるし」は文脈上必要な品位を保ち、「不思議な業」で一般読者にも意味が伝わるようにした。
