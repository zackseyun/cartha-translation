id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: ja
  text: だれにも、どのような方法でも、欺かれてはいけません。その日は、まず反逆[a]が起こり、不法の者[b]、すなわち滅びの子が明らかにされなければ、来ません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「背教」または「離反」とも訳せる。このギリシア語は決定的な反逆を指し、宗教的な離反を意味すると理解されることも多い。
    reason: alternative_reading
  - marker: b
    text: 写本によっては「不法の者」ではなく「罪の人」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: 欺かれて
  rationale: 人を欺き、惑わすことを表す動詞。警告として自然な現代日本語になるよう受動表現を用いた。
- source_word: κατὰ μηδένα τρόπον
  choice: どんな仕方によっても
  rationale: いかなる方法の欺きも許してはならないという強調を保つ表現。
- source_word: ὅτι
  choice: からです
  rationale: 先の禁止命令の理由を導く接続語として、文末で自然に因果関係を示した。
- source_word: ἐὰν μὴ ἔλθῃ
  choice: 来ないかぎり、来ない
  rationale: 必要な先行条件を示す構文。最初の「来ないかぎり」は二つの出来事を条件とし、後の「来ない」の主語には前節から「その日」を補った。
- source_word: ἀποστασία
  choice: 反逆
  rationale: 反乱、離反、背教を含み得る語。宗教的背教だけに意味を限定せず、決定的な反逆という広い意味を保った。
- source_word: πρῶτον
  choice: まず
  rationale: 出来事の順序を明確に示す自然な日本語。
- source_word: ἀποκαλυφθῇ
  choice: 現れ
  rationale: 隠れていた者が明らかにされることを表す受動形。日本語では「現れる」が自然であり、顕現の意味も保てる。
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: 不法の人
  rationale: 底本のἀνομίαςを直接反映し、特定の男性的人物を指す単数形も保った。
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: 滅びの子
  rationale: 滅びによって特徴づけられる、または滅びに定められた者を表すセム語的表現。その比喩的な形を保った。
theological_decisions:
- issue: 「来ない」の省略された主語
  choice: 直前の文脈から「その日」を明示した
  alternative: 主語を補わず、「なぜなら、まず……でなければ」と省略を保つ
  rationale: ギリシア語では前節の「主の日」が文脈上明白だが、日本語では主語を補うほうが論理を誤解なく伝えられる。
- issue: ἀποστασίαの意味
  choice: 「反逆」
  alternative: 「背教」または「離反」
  rationale: 反逆一般にも宗教的離反にも用い得るため、本文では広い意味を採り、より限定的な理解は脚注に残した。
- issue: τῆς ἀνομίαςの本文異読
  choice: SBLGNTに従い「不法の人」
  alternative: 異読に従い「罪の人」
  rationale: 提示された底本はἀνομίας（不法）を採用しているため本文でこれに従い、写本上の異読は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、警告の厳粛さを保った。「滅びの子」は原文のセム語的表現と神学的含意を保持するため直訳調を残している。脚注記号は、それぞれが説明する「反逆」と「不法の人」の直後に置いた。
