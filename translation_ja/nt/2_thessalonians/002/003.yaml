  to: だれにも、どのような方法でも、欺かれてはいけません。その日は、まず反逆[a]が起こり、不法の者[b]、すなわち滅びの子が明らかにされなければ、来ません。
  rationale: 条件節を「まず反逆が起こり、不法の者…が明らかにされなければ」として、ἐὰν μὴ以下が「その日」の到来に必要な二つの先行条件であることを明確にした。「明らかにされる」はἀποκαλυφθῇの受動的な意味を保つ。「反逆」と「滅びの子」は、論争のある解釈を本文で狭めず、原文の表現と曖昧さを維持している。脚注記号は説明対象の直後に置き、異読脚注も本文の改訂語に合わせた。
