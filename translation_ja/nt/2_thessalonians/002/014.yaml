source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: ja
  text: 神は、私たちが告げた福音を通して、あなたがたをこの救いへと召してくださいました。そのためです。すなわち、私たちの主イエス・キリストの栄光を得るためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主イエス・キリストの栄光を自分のものとするため」、または「その栄光にあずかるため」とも訳せる。
    reason: περιποίησιςには「獲得」「所有」の意味幅があり、文脈上は栄光への参与も含み得るため。
lexical_decisions:
- source_word: εἰς ὃ
  choice: このために
  rationale: 直前の救いと聖別の内容を受け、その目的・到達点を示す関係表現。日本語では「このために」が自然で、指示内容を過度に限定しない。
- source_word: ἐκάλεσεν ὑμᾶς
  choice: あなたがたを召してくださいました
  rationale: パウロ書簡における救いへの神の「召し」を保ちつつ、その効力について特定の教派的説明を加えない。文脈上の主語である神を補って明確にした。
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: 私たちが告げた福音を通して
  rationale: διά＋属格の手段を「通して」で表現。「私たちの福音」は別種の福音という意味ではなく、使徒たちが宣べ伝えた福音なので、日本語では関係を明示した。
- source_word: εἰς περιποίησιν
  choice: 得るため
  rationale: 目的を示す εἰς と、獲得・所有を表し得る περιποίησις を簡潔に表現した。「所有するため」も可能だが、δόξαとの結び付きでは「得る」が自然。
- source_word: δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・キリストの栄光
  rationale: 属格の連鎖を自然な日本語で保った。Χριστόςは日本語で定着した称号表現「キリスト」とし、主の栄光を得る／共有するという終末論的含意を訳文で狭く限定しない。
theological_decisions:
- issue: 神の召しの性質
  choice: 「召してくださいました」と訳す
  alternative: 「有効に召した」／「招いた」
  rationale: 原文は神の救済的な召しを述べるが、その効力を教義用語で限定せず、単なる招待にも弱めない。
- issue: περιποίησις と「栄光」の関係
  choice: 「栄光を得るため」
  alternative: 「栄光を自分のものとするため」／「栄光にあずかるため」
  rationale: 語の獲得・所有の幅を保つ。「あずかる」は文脈上妥当だが、共有という解釈を本文で明示しすぎるため脚注に置いた。
- issue: Χριστοῦ の訳語
  choice: 「キリスト」
  alternative: 「メシア」
  rationale: 日本語の現代的な聖書文体では「イエス・キリスト」が自然かつ広く理解され、Χριστόςの称号性も保持できる。特定教派の理解は加えない。
translation_notes:
  register: 明快で現代的な標準日本語。神への敬意を示すため「召してくださいました」としつつ、過度に古風な語法は避けた。長いギリシア語文を二文に分け、「すなわち」で二つの εἰς 句の目的関係を明確にした。
