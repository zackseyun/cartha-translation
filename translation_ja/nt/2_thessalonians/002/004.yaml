id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: ja
  text: 神と呼ばれるあらゆるもの、または礼拝の対象となるあらゆるものに敵対し、それらすべての上に自らを高く上げる者であり、その結果、神の神殿[a]に座って、自分が神であることを示します。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の聖所」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「自分が一柱の神であることを示します」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: 逆らう者
  rationale: 冠詞付き現在分詞の実質的な名詞用法を保ち、原文に明示されていない称号を持ち込まず、継続的な敵対の意味を自然な日本語で表す。
- source_word: ὑπεραιρόμενος ἐπὶ
  choice: 自らをその上に高く上げる
  rationale: 中動態的な自己高揚と、ἐπί＋対格が示す優越の方向を明示する。
- source_word: πάντα λεγόμενον θεὸν
  choice: あらゆる、神と呼ばれるもの
  rationale: λεγόμενονを『呼ばれる』と訳し、それらが真に神であると本文が認定しているかのような含みを避ける。
- source_word: σέβασμα
  choice: 礼拝の対象
  rationale: 神格に限らず宗教的崇敬を受けるものを広く指し得る語義を、現代日本語で明瞭に表す。
- source_word: ὥστε ... καθίσαι
  choice: ついには…座り
  rationale: ὥστε＋不定詞が示す結果を自然に表し、自己高揚の帰結として神殿に座る行為をつなぐ。
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: 神の神殿に
  rationale: ναόςの聖所・神殿という意味を保ちつつ、比喩か文字どおりかを訳文で決めない。εἰςの方向性は、日本語では着座の到達場所を示す『に』で自然に表す。
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: 自分こそ…であると示します
  rationale: 公然と自分をそのような者として提示する意味を表し、単なる口頭の宣言に狭めない。係助詞『こそ』により自己主張の強さを自然に示す。
- source_word: ὅτι ἔστιν θεός
  choice: 自分こそ神である
  rationale: 文脈上の頂点となる神への僭称として定冠的に訳す一方、無冠詞θεόςに基づく『一柱の神』の可能性は脚注に残す。
theological_decisions:
- issue: 末尾の無冠詞 θεός を『神』とするか『一柱の神』とするか
  choice: 神
  alternative: 一柱の神
  rationale: 神の神殿に座るという直前の描写と結び付いた最高度の神的僭称として『神』が文脈に最も適する。ただし無冠詞であるため、不定的に理解する可能性を脚注で保存する。
- issue: ναόςを『神殿』とするか『聖所』とするか
  choice: 神殿
  alternative: 聖所
  rationale: ναόςは神殿の中心的聖所を指し得るが、『神殿』は現代日本語で明瞭であり、文字どおりの建物か比喩的な聖なる領域かという解釈を不必要に限定しない。
translation_notes:
  register: 明瞭で現代的ながら、終末論的・冒瀆的な場面にふさわしい荘重さを保った。分詞が連なるギリシア語を日本語では二つの文に分け、論理的な進行を明確にした。原文の解釈上の幅は脚注に保存した。
