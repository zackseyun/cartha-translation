reference: 2 Thessalonians 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: ja
  text: そしてその時、不法の者が現されます。主イエスは、その者を御自分の口から出る息[a]によって殺し、御自分の来臨の現れによって無力にします[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御自分の口から出る霊」。ギリシア語は「息」と「霊」のどちらも意味し得るが、ここでは「息」がこの表現に最もよく合う。
    reason: lexical_alternative
  - marker: b
    text: 別訳「御自分の臨在の現れによって」。ここで「来臨」と訳したギリシア語は、「臨在」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: 現されます
  rationale: 未来受動形を保ち、不法の者が姿を現すのではなく、明らかにされることを表した。行為者は本文で明示されていないため補わない。
- source_word: ὁ ἄνομος
  choice: 不法の者
  rationale: 冠詞付き形容詞の名詞的用法を反映し、この節にない「人」を補わず、文脈上の特定の存在を示した。
- source_word: ὁ κύριος Ἰησοῦς
  choice: 主イエス
  rationale: 称号と固有名を、新約聖書で定着した自然な日本語で表した。
- source_word: ἀνελεῖ
  choice: 殺し
  rationale: この文脈では命を奪うことを意味するため、婉曲化せず、現代日本語で明確に表した。
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: 御自分の口から出る息によって
  rationale: πνεῦμαの「息」の意味とこの慣用的な表現を自然な日本語にし、イザヤ11章4節を思わせる裁きの描写も保った。「霊」の可能性は脚注に残した。
- source_word: καταργήσει
  choice: 無力にされます
  rationale: 消滅そのものよりも、力を失わせ、効力をなくすという語義を表した。日本語では目的語との関係が明確になるよう再帰的敬語を用いた。
- source_word: τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ
  choice: 御自分の来臨が現れることによって
  rationale: ἐπιφάνειαの「現れ」と、終末論的文脈でのπαρουσίαの「来臨」をともに保持しつつ、不自然な名詞の連鎖を避けた。「臨在」の語義は脚注に残した。
theological_decisions:
- issue: 終末時の敵対者の呼称
  choice: 不法の者
  alternative: 不法の人
  rationale: この節はὁ ἄνομοςという名詞化された形容詞を用いているため、周辺節のより長い呼称を持ち込まず、本文の形を保った。
- issue: 主イエスが勝利する手段
  choice: 御自分の口から出る息によって
  alternative: 御自分の口から出る霊によって
  rationale: この表現では「息」がより自然だが、πνεῦμαには「霊」の意味もあるため、解釈を完全には閉じず脚注に示した。
- issue: παρουσίαの意味
  choice: 来臨
  alternative: 臨在
  rationale: 終末論的文脈では到来を指す「来臨」が最も自然である一方、語の範囲にある「臨在」を脚注に保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ「です・ます」調とした。「御自分」は主イエスへの敬意を自然に示す表記。ギリシア語の二つの未来動詞は日本語では文末の「ます」によって一続きの未来の行為として読める。
