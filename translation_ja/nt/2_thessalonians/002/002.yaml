id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: ja
  text: 霊によるもの[a]であれ、ことばによるものであれ、私たちから出たかのような手紙によるものであれ、「主の日はすでに来ている[b]」という知らせによって、すぐに思いを揺るがされて動揺したり、慌てたりしないでください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「霊的な告知」「預言的な啓示」。
    reason: lexical_alternative
  - marker: b
    text: または「主の日は今、現に到来している」。ギリシア語の完了形は、主の日がすでに到来し、その状態が現在に及んでいるという主張を表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: すぐに
  rationale: 二つの不定詞を修飾し、急速に動揺させられないようにとの警告を自然に表す。
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: 平静を失って動揺したり
  rationale: 直訳的な「思いから揺り動かされる」では日本語として不自然なため、定まった判断や心の落ち着きから外される比喩的意味を保った。
- source_word: θροεῖσθαι
  choice: 慌てたり
  rationale: 不安や恐れによって騒ぎ立つ心理的反応を、現代日本語で簡潔に表す。
- source_word: πνεύματος
  choice: 霊によるもの
  rationale: 冠詞のない名詞の字義を保ち、預言的・霊的な告知という文脈上の意味は脚注に示す。
- source_word: λόγου
  choice: ことばによるもの
  rationale: 手紙と対置される口頭の発言・知らせを指し得るが、原語の広さを残すため「ことば」とした。
- source_word: ἐπιστολῆς
  choice: 手紙
  rationale: 書面による通信を表す自然な現代語。
- source_word: ὡς δι’ ἡμῶν
  choice: 私たちから来たかのような
  rationale: パウロたちに由来すると偽って主張された手紙、という含意を自然に表す。
- source_word: ἐνέστηκεν
  choice: すでに来ている
  rationale: 完了形が示す、到来した結果として今ここにあるという主張を表す。「すでに」は文脈上の含意を明確にする。
- source_word: ἡμέρα τοῦ κυρίου
  choice: 主の日
  rationale: 終末論的な定型表現であり、週ごとの礼拝日ではない。
theological_decisions:
- issue: 終末論的主張における ἐνέστηκεν の意味
  choice: すでに来ている
  alternative: すでに到来している／今ここにある
  rationale: 完了形は到来と、その結果としての現在性を併せ持つ。「すでに来ている」は自然な日本語で両面を伝え、現在性の強い訳は脚注に残す。
- issue: 三つの情報源の一つとしての πνεύματος の意味
  choice: 霊によるもの
  alternative: 霊的な告知／預言的な啓示／御霊によるもの
  rationale: 本文では原語の曖昧さを保ち、必ずしも聖霊そのものを指すと限定しない。文脈上あり得る伝達形態は脚注に示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「平静を失って動揺する」により原文の揺さぶられる比喩と νοῦς の定まった心・判断の含意を自然に伝えた。三つの情報源の並列は「であれ」を反復して保持した。
