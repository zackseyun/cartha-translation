id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: ja
  text: さて、兄弟たち[a]、私たちの主イエス・メシアが来られることと、私たちが彼のもとに集まること[b]について、あなたがたにお願いします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」はパウロの呼びかけの言葉で、ここでは女性を含む信徒共同体全体に語りかけていると考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「集まること」は「集められること」とも訳せます。ギリシア語は、だれが集めるのかを明示していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: お願いします
  rationale: ここでは命令ではなく、牧会的な願い・訴えを導入する。「お願いします」は現代日本語として自然で、穏やかな力を保つ。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、関連する新しい話題への移行を示すため、「さて」とした。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを語形に即して訳した。文脈上は女性を含む信徒共同体全体への呼びかけと考えられるため、その点を脚注で示す。
- source_word: ὑπὲρ
  choice: について
  rationale: 受益の「ために」ではなく、これから扱う事柄を導く用法である。
- source_word: παρουσίας
  choice: 来られること
  rationale: 終末論的文脈では、単なる「存在」よりも主の将来の到来を表す。「再臨」は解釈を明示しすぎるため避けた。
- source_word: κυρίου
  choice: 主
  rationale: 権威を示す称号と新約聖書における神学的な響きを保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を明示し、固有名のイエスと中黒で自然につないだ。伝統的な「イエス・キリスト」も可能である。
- source_word: ἐπισυναγωγῆς
  choice: 集められること
  rationale: 信徒が一つに集められることを表す。日本語では受身形により、集合をもたらす働きが暗示される一方、その主体を本文以上に特定しない。
- source_word: ἐπ’ αὐτόν
  choice: みもとに
  rationale: キリストへ向かって集められる方向性を、敬意ある自然な日本語で表す。
theological_decisions:
- issue: Χριστοῦを含む称号の訳し方
  choice: イエス・メシア
  alternative: イエス・キリスト
  rationale: ここではΧριστόςの称号性が保たれているため、その意味を訳出した。「キリスト」は広く定着した音写的表現だが、本文では称号の意味を優先した。
- issue: ἀδελφοίの範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／皆さん
  rationale: 原文の男性複数形を保ちつつ、共同体全体を指す可能性は脚注で明示した。
- issue: 「来臨」と「集められること」の関係
  choice: 二つを「と」で並列する
  alternative: 来臨の時に私たちが集められること／来臨、すなわち私たちが集められること
  rationale: 原文はκαίで二項を結ぶだけで、両者の厳密な時間的・論理的関係を規定していない。特定の終末論的枠組みを持ち込まず、並列を保った。
- issue: ἐπισυναγωγῆςの態の表現
  choice: 私たちがみもとに集められること
  alternative: 私たちがみもとに集まること
  rationale: 名詞自体は文法上、能動・受動を明示しない。「集められる」は神による集合という文脈上自然な含意を持つが、より中立的には「集まる」も可能であるため、脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「主」「みもと」など聖書本文にふさわしい穏やかな荘重さを保った。「再臨」など解釈を固定しうる専門語は避け、原文の二項並列と曖昧さを維持した。
