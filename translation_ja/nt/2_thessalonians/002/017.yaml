  text: παρακαλέσαι ὑμῶν τὰς καρδίας καὶ ⸀στηρίξαι ἐν παντὶ ⸂ἔργῳ καὶ λόγῳ⸃ ἀγαθῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: ja
  text: あなたがたの心を励まし[a]、あらゆる良い行いと良い言葉において、あなたがたを強めてくださいますように[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの心を慰め」または「あなたがたの心に勧めを与え」。原語は、励ます、慰める、勧める、という意味を持ち得る。
    reason: lexical_alternative
  - marker: b
    text: 「強める」は、「堅くする」「確かなものとする」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: 励まし
  rationale: 「慰める」「勧める」をも含み得る語だが、16節の「永遠の励まし」を受けつつ意味の幅を保てる自然な表現として「励ます」を選んだ。
- source_word: καρδίας
  choice: 心
  rationale: 感情だけでなく思考や意志を含む内なる人を指す聖書的表現として、「心」を保持した。
- source_word: στηρίξαι
  choice: 強めてくださいますように
  rationale: 「堅くする」「確かなものとする」の意を持つ。祈願の文脈で、忠実な行いと言葉のうちに揺るがない者とする意味を自然な日本語で表した。
- source_word: ἐν παντὶ
  choice: あらゆる…において
  rationale: 強められる領域を示すἐνの用法を保ち、παντίの包括性を「あらゆる」で表した。
- source_word: ἔργῳ
  choice: 働き
  rationale: 行為・業を表す語であり、λόγῳとの対句を明瞭にするため「働き」とした。
- source_word: λόγῳ
  choice: 言葉
  rationale: ここでは行為と対になる発言・語ることを指す。「言葉」は簡潔で原文の対句を保つ。
- source_word: ἀγαθῷ
  choice: 良い
  rationale: ἔργῳとλόγῳの双方に意味上かかる形容詞として、広い意味を保つ直接的な訳語を用いた。
- source_word: ὑμῶν
  choice: あなたがたの／あなたがたを
  rationale: 最初は「心」にかかる複数属格として訳し、後半では日本語でστηρίξαιの対象を明確にするため「あなたがたを」と補った。
theological_decisions:
- issue: καρδίαを現代心理学的な語に置き換えるか
  choice: 心
  alternative: 内なる人／思い
  rationale: 知性や感情の一面だけに限定せず、聖書的な人間理解の比喩と意味の広がりを保つため。
- issue: στηρίξαιの確立・堅固化の含意をどう表すか
  choice: 強める
  alternative: 堅くする／確かなものとする
  rationale: 自然で分かりやすい現代日本語を用いつつ、信者を確固たる者にするという結果を表すため。
- issue: 祈願の主語を17節内に補うか
  choice: 主語を補わず、敬語と願望表現で前節からのつながりを示す
  alternative: 主ご自身が／神が
  rationale: 原文では主語が16節の「私たちの主イエス・キリストと、私たちの父である神」から継続するため、17節単独で一方だけに限定する補足を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準語。原文では二つの不定詞が16節から続く祈願を構成するため、「くださいますように」で結んだ。「働きと言葉」は原文の順序を保持し、「良い」が両方にかかるようにした。
