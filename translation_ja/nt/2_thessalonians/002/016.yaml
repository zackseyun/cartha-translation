id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: ja
  text: どうか、私たちの主イエス・メシアご自身と私たちの父なる神が、私たちを愛し、恵みによって永遠の励まし[a]と確かな希望を与えてくださったように、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慰め」または「慰めと励まし」とも訳せる。
    reason: παράκλησιςには、励まし、慰め、慰安という意味領域があるため。
lexical_decisions:
- source_word: Αὐτὸς
  choice: ご自身
  rationale: 強意用法を自然な敬語表現で保ち、願いの主体である主イエス・メシアの直接的な働きを強調する。
- source_word: δὲ
  choice: 無訳
  rationale: 穏やかな談話上の移行を示すが、日本語で「さて」「しかし」を明示すると不必要に強くなるため、願いを表す「どうか」に自然に接続させた。
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς
  choice: 私たちの主イエス・メシア
  rationale: κύριοςを「主」、Χριστόςを称号として「メシア」とし、現代日本語で明瞭な形にした。
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: 父なる神
  rationale: 神が私たちの父であるという同格的内容を、日本語の聖書文体として自然かつ簡潔に表す。文脈上の「私たち」は先行句と関係節によって十分明らかである。
- source_word: ὁ ἀγαπήσας ἡμᾶς
  choice: 私たちを愛し
  rationale: アオリスト分詞を過度に時制限定せず、完了した神の愛の行為として自然に表した。
- source_word: δοὺς
  choice: 与えてくださった
  rationale: 先行する分詞と並ぶアオリスト分詞を連体節として訳し、神の恵み深い行為にふさわしい自然な敬語を用いた。
- source_word: παράκλησιν αἰωνίαν
  choice: 永遠の励まし
  rationale: παράκλησιςの文脈上の主要義を「励まし」とし、αἰώνιοςの持続性を「永遠の」で保持した。慰めという語義の可能性は脚注に残す。
- source_word: ἐλπίδα ἀγαθὴν
  choice: 良い希望
  rationale: 原文の簡潔な形と肯定的な質をそのまま保ち、説明的な言い換えを避けた。
- source_word: ἐν χάριτι
  choice: 恵みによって
  rationale: 励ましと希望が与えられる手段または根拠を示す用法として自然に訳した。
theological_decisions:
- issue: 単数形の分詞「愛し、与えた」と、並列された「主イエス・メシア」と「父なる神」との関係
  choice: 日本語では関係節を「父なる神」に最も自然に結び付けつつ、並列された二者を一つの願いの主語として保持する。
  alternative: 関係節が主イエスと父なる神の双方を明示的に修飾するよう「お二方は」と補う。
  rationale: ギリシア語は二つの並列主語の後に単数形の修飾語を置いており、その神学的含意を説明的補足で一義化すべきではない。日本語として不自然な曖昧さを増やさず、原文の構造上の緊張も過度に解消しない形とした。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、祈願文にふさわしい品位を保つ。「どうか」で次節へ続く願いを示し、本節が文として未完であることも保持した。
