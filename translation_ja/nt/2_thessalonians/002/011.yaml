id: 2TH.2.11
reference: 2 Thessalonians 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: ja
  text: このため、神は、彼らがその偽りを信じるように、彼らに惑わしの働き[a]を送ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「惑わす力」「欺きの作用」。伝統的には「強い惑わし」とも訳される。
    reason: ἐνέργειαν πλάνηςは、惑わしを生じさせる作用または力を表し得るため。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前に述べられた真理への拒絶を受ける因果関係を、簡潔かつ明確に示す。
- source_word: πέμπει
  choice: 送ります
  rationale: 神を主語とする現在直説法の直接的な行為を弱めず、現代日本語として自然に表した。
- source_word: ἐνέργειαν πλάνης
  choice: 惑わしの働き
  rationale: ἐνέργειαとπλάνηという二つの名詞の関係を保ちつつ、実際に作用する惑わしという意味を表す。能動的な惑わす力とも、惑わしを特徴とする作用とも取れる余地を残した。
- source_word: εἰς τὸ πιστεῦσαι
  choice: 信じるように
  rationale: 目的と結果のどちらにも開かれた原文の構文を、どちらか一方に限定せず表現した。
- source_word: τῷ ψεύδει
  choice: その偽りを
  rationale: 冠詞付き単数形の特定性を「その」で示し、文脈上の偽りを指すことを保った。
theological_decisions:
- issue: 裁きとして人を頑なにすることにおける神の行為
  choice: 神は…惑わしの働きを送ります
  alternative: 神は惑わしの働きが彼らに及ぶのを許されます／神は彼らを惑わしに引き渡されます
  rationale: 原文は神をπέμπει（送る）の明示的な主語としているため、単なる許可へと弱めない。人間による真理の拒絶と神の裁きとの間にある神学的緊張を、そのまま残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の直接的な行為と原文の目的・結果の曖昧さを保持した。「惑わしの働き」は日常語よりやや荘重だが、原文の名詞構造を可視化するために採用した。
