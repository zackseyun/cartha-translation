lexical_decisions:
- source_word: μνημονεύετε
  choice: 覚えていないのですか
  rationale: 現在形を修辞疑問として自然な現代日本語にし、以前の教えが記憶にあるはずだという含みを保つ。
- source_word: ἔτι ὢν πρὸς ὑμᾶς
  choice: 私がまだあなたがたのもとにいたとき
  rationale: ἔτιの継続の意味と、πρὸς ὑμᾶςが表す彼らのもとでの個人的な滞在を、自然な時間節で表す。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数指示詞を保ち、直前の文脈で扱われた一連の事柄を指す表現とする。
- source_word: ἔλεγον
  choice: 繰り返し話していた
  rationale: 未完了過去の継続的・反復的な側面を明示する。単に一度『話した』のではなく、滞在中に教えていたという含みを伝える。
- source_word: ὅτι
  choice: のを
  rationale: 記憶の内容を導くὅτι節を、日本語では名詞化した節として自然に表す。
