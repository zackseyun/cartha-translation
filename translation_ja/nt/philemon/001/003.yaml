  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ja
  text: 私たちの父である神と、メシアである主イエス[a]から、あなたがたに恵みと平安がありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主イエス・キリスト」。ギリシア語の「クリストス」は、「メシア」という称号としても、文脈によっては「キリスト」という名に近い形でも用いられます。
    reason: Χριστόςが称号的にも名称的にも機能し得る曖昧さを示すため。
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の挨拶としての働きと、神から与えられる恵みという神学的な含みの両方を保つ、自然で定着した訳語。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数形の二人称与格を明示し、宛先となる共同体全体への挨拶であることを保った。
- source_word: εἰρήνη
  choice: 平安
  rationale: 挨拶の意味と、ヘブライ語のシャロームを思わせる幅広い含意を保つ定着した聖書語。
- source_word: ἀπὸ
  choice: から
  rationale: 恵みと平安の源が神と主イエスであることを示す。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 私たちの父である神
  rationale: πατρὸς ἡμῶνをθεοῦと同格に取り、標準的なパウロの表現を、現代日本語で誤解なく示した。
- source_word: κυρίου
  choice: 主
  rationale: 敬称としての意味と、パウロ書簡におけるキリスト論的な重みを保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシアである主イエス
  rationale: Ἰησοῦは固有名として「イエス」、Χριστοῦは称号の意味を明らかにするため「メシア」とした。日本語として自然になるよう「メシアである主イエス」と構成した。
theological_decisions:
- issue: Χριστοῦを称号として訳すか、慣用的な「キリスト」とするか
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςは「油注がれた者／メシア」という称号に由来する。この箇所では定型的な名の一部のようにも機能し得るため別訳を脚注に残しつつ、本文では称号の意味が読者に伝わる訳を採用した。
- issue: 動詞のない挨拶句の表現
  choice: 「ありますように」を補う
  alternative: 「恵みと平安」だけを名詞句として置く
  rationale: ギリシア語には動詞が明記されていないが、祝福を願う挨拶としての意味を自然な現代日本語で表すため、補語を加えた。
translation_notes:
  register: 明瞭で現代的ながら礼節ある書簡の挨拶調とした。「あなたがた」で原文の複数を保ち、「恵み」「平安」「主」は一般読者にも通じる定着した聖書語として用いた。
