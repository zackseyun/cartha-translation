  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: ja
  text: ですから、あなたが私を仲間と見なしているなら、私を迎えるのと同じように、彼を迎えてください。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ οὖν
  choice: ですから、…なら
  rationale: 推論を示すοὖνと条件を示すεἰの結び付きを、前の訴えとの論理的つながりが分かる自然な日本語で表した。
- source_word: με ἔχεις κοινωνόν
  choice: あなたが私を仲間と見なしている
  rationale: κοινωνόςは何かを共にする者、参与者、仲間を指す。「仲間」は共有された交わりと対等な関係を自然に伝え、「見なしている」はἔχειςを含む句の慣用的な意味を表す。
- source_word: προσλαβοῦ
  choice: 迎えてください
  rationale: προσλαμβάνομαιには、好意をもって受け入れる、迎え入れるという意味がある。文脈上、オネシモをパウロ自身と同じように受け入れるよう求める対人的な響きを自然に表した。
- source_word: αὐτὸν
  choice: 彼を
  rationale: 文脈上オネシモを指す男性単数対格代名詞を、そのまま明瞭に訳した。
- source_word: ὡς ἐμέ
  choice: 私を迎えるように
  rationale: ὡςによる比較を日本語として明確にするため、命令の動詞を補った。オネシモをパウロ自身と同じように迎えるという要請を保持している。
theological_decisions:
- issue: κοινωνόςが表すパウロとフィレモンの関係
  choice: 仲間
  alternative: 協力者／共にあずかる者
  rationale: 共有された参与と関係性を示しつつ、特定の教派的・制度的意味を持ち込まない。「協力者」では共同作業に狭まりやすく、「共にあずかる者」は原語に近いが本文として硬いため、「仲間」を採用した。
translation_notes:
  register: 明瞭で現代的ながら品位のある依頼表現とした。「受け入れてください」も可能だが、προσλαβοῦの好意的・対人的な含意とὡς ἐμέの自然な比較を伝えるため、「迎えてください」を用いた。
