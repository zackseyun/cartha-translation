id: PHM.1.7
reference: Philemon 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: ja
  text: 兄弟よ、私はあなたの愛のゆえに、大きな喜びと励ましを得ました。聖なる者たちの心[a]が、あなたを通して安らぎを得ているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「内臓」。ここでは、深い感情や内なる思いを指す慣用表現。
    reason: 原語σπλάγχναの身体的比喩と意味の幅を示すため。
lexical_decisions:
- source_word: χαρὰν
  choice: 喜び
  rationale: χαράの標準的な意味を、現代日本語で自然かつ簡潔に表す。
- source_word: πολλὴν ἔσχον
  choice: 大きな……を得ました
  rationale: ἔσχονはここでは喜びと励ましを経験したことを表す。「大きな」はπολλήνの程度を自然な日本語で示す。
- source_word: παράκλησιν
  choice: 励まし
  rationale: 慰め、励ましの両義があり得るが、フィレモンの愛によってパウロが力づけられたという文脈に適する。
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: あなたの愛によって
  rationale: ἐπί＋与格の根拠・原因の意味を示し、喜びと励ましがフィレモンの愛から生じたことを自然に表す。
- source_word: σπλάγχνα
  choice: 心
  rationale: 字義的には内臓だが、深い感情や内なる思いを指す慣用表現であるため、日本語では「心」とした。字義的ニュアンスは脚注に残す。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: 神のために聖別された信徒たちというパウロの共同体用語を保ちつつ、後代の列聖制度との混同を避ける。
- source_word: ἀναπέπαυται
  choice: 安らぎを得た
  rationale: 休息や安堵を与えられるという語義を表す。完了形が示す結果的状態も、日本語の文脈から読み取れる表現とした。
- source_word: διὰ σοῦ
  choice: あなたを通して
  rationale: διά＋属格の媒介・手段の意味を保つ。
- source_word: ἀδελφέ
  choice: 兄弟よ
  rationale: キリスト者共同体における男性への直接の家族的呼びかけを、そのまま明示する。
theological_decisions:
- issue: τῶν ἁγίωνの訳し方
  choice: 聖なる者たち
  alternative: 聖徒たち／神の民
  rationale: 神に属する者としての信徒という意味を透明に示し、特定教派の用法や後代の列聖概念を持ち込まない。
- issue: σπλάγχναの身体的比喩
  choice: 心
  alternative: 心の奥底／内なる思い
  rationale: 原語は身体内部を用いた比喩で、深い感情と内的存在を指す。本文では自然な「心」とし、原語の具体性を脚注で示す。
- issue: ἀναπέπαυταιの完了形
  choice: 安らぎを得た
  alternative: 安らぎを得ています／元気づけられました
  rationale: フィレモンを通して与えられた安堵という出来事を表しつつ、その結果が続いている含みを妨げない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。パウロの親しい呼びかけは「兄弟よ」とし、感情表現は過度に口語化せず自然に整えた。
