base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: ja
  text: 私は、私の子[a]、すなわち私が鎖につながれている間に[b]もうけたオネシモのことで、あなたにお願いします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の子」「もうけた」は、パウロとオネシモの霊的な親子関係を表す出生の比喩。「私が父となった子」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「鎖につながれている間に」は「投獄されている間に」とも訳せる。ギリシア語は実際の鎖・束縛という具体的な像を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ σε
  choice: あなたにお願いします
  rationale: 命令ではなく、個人的で切実な依頼を表す。現代日本語として自然で、フィレモンに対するパウロの関係的な語調を保つ。
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: 私の子……のことで
  rationale: περί＋属格の「～について／～のことで」を自然に表し、τέκνονの親愛を込めた親子の比喩を「子」で保持する。「息子」として性別を語に加えることは避けた。
- source_word: ὃν ἐγέννησα
  choice: 生んだ
  rationale: γεννάωの出生・生殖の比喩を直接保つ。男性であるパウロが用いることで比喩性も明らかになり、「信仰に導いた」などの説明を本文へ持ち込まない。
- source_word: ἐν τοῖς δεσμοῖς
  choice: 鎖につながれた身で
  rationale: δεσμοίの具体的な「鎖、束縛」の像を残しつつ、それが投獄状態を指すことを自然な日本語で伝える。
- source_word: Ὀνήσιμον
  choice: オネシモ
  rationale: 日本語聖書で一般的な表記に従って人名を音写した。
theological_decisions:
- issue: パウロとオネシモの関係の性質
  choice: 「私の子」「生んだ」という霊的親子関係の比喩をそのまま保つ
  alternative: 「獄中で信仰に導いたオネシモ」または「獄中で父となったオネシモ」
  rationale: 文脈上はパウロを通してオネシモに霊的な変化が生じたことが強く示唆されるが、ギリシア語本文は回心を明示せず、出生の比喩で関係を語っている。その含みと神学的緊張を訳文でも保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、手紙にふさわしい親愛と品位を保った。「懇願します」は原文以上に強く響き得るため避け、「お願いします」とした。語順は、修飾関係が日本語で明瞭になるよう整えた。
