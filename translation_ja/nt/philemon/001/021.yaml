  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: ja
  text: あなたの従順を確信して、私はあなたに書きました。あなたが、私の言うこと以上のことさえしてくれると知っているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私が言っていることを越えて」とも訳せる。パウロは、フィレモンが自分の具体的な願い以上のことをするとほのめかしている可能性があるが、それが何かは本文に明記されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: 確信して
  rationale: 完了分詞が表す、すでに確立された信頼と確信の状態を、自然な現代日本語で表した。
- source_word: τῇ ὑπακοῇ σου
  choice: あなたが従ってくれると
  rationale: ὑπακοήの「従うこと、従順」の力を保ちつつ、フィレモンへの直接的な語りかけとして自然にした。単なる好意的な返答へ弱めてはいない。
- source_word: ἔγραψά σοι
  choice: 私はあなたにこう書きました
  rationale: 書簡的アオリストを日本語の過去形で訳し、この手紙に記している内容を指す「こう」を補って自然な文脈を示した。
- source_word: εἰδὼς
  choice: 分かっているからです
  rationale: パウロが確かな認識をもって書いているという分詞の付帯的・理由的な働きを明瞭に表した。
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: 私が言う以上のことさえ
  rationale: ὑπέρ＋対格の「何を越えて／何より多く」という比較的な意味と、καίの強調を保持した。具体的に何を期待しているかは限定しない。
- source_word: ποιήσεις
  choice: あなたはしてくれる
  rationale: ποιέωの広い意味を保ち、期待を込めた未来表現として自然な日本語にした。行為の内容は原文どおり開かれたままにした。
theological_decisions:
- issue: ὑπακοήが示すパウロの訴えに対する応答の性質
  choice: 「あなたが従ってくれる」と訳し、従順・服従の意味を保持した。
  alternative: 「応じてくれる」「承諾してくれる」
  rationale: 原語は単なる好意的応答より強い「従うこと」を表す。ただし日本語で不必要に威圧的にならないよう、関係的な期待を示す「くれる」を用いた。
- issue: 「私が言う以上」の具体的含意
  choice: 何をさらに行うのかを明示せず、開かれた表現のままにした。
  alternative: オネシモを解放すること、または寛大に迎えることを明記する。
  rationale: そのような含意はあり得るが、本文は具体的内容を述べていないため、解釈上の緊張と曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的ながら、書簡としての品位を保つ文体。「確信して」と「分かっている」により原文の二つの分詞を反映し、パウロの強い期待を自然に示した。脚注記号[a]は、その説明対象である開かれた表現を含む文の末尾に置いた。
