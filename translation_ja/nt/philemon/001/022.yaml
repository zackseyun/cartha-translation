source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: ja
  text: それと同時に、私のための宿泊場所も用意しておいてください。皆さんの祈りによって、私は皆さんに恵みとして与えられることを願っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私は皆さんに恵みとして与えられる」。ギリシア語の語は「恵みとして、無償に与える」という含みをもつ。神が与える方であることが暗示されている可能性がある。文脈上、パウロが解放されて彼らのもとへ戻ることを指すと考えられる。
    reason: lexical_and_theological_clarification
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: 同時に
  rationale: 前の依頼にもう一つの依頼を添える接続表現として、重複感を避けつつ自然な現代日本語にした。καίの付加的な意味は文脈上の「同時に」に含まれる。
- source_word: ἑτοίμαζέ μοι
  choice: 私のために…用意しておいてください
  rationale: 命令の実際的な内容と、話者のために前もって準備する含みを自然に表す。
- source_word: ξενίαν
  choice: 宿
  rationale: 語は歓待そのもの、または客のための滞在場所を指し得る。ここでは「用意する」と結び付くため具体的な宿泊場所が自然だが、宿泊用の一室に限定しない「宿」とした。
- source_word: ἐλπίζω γὰρ ὅτι
  choice: …ことを願っているからです
  rationale: γάρによる理由説明と、ἐλπίζωが示す期待・希望を、丁寧な依頼に続く自然な日本語で表した。
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: 皆さんの祈りによって
  rationale: διά＋属格が表す手段・媒介を保持した。複数形のὑμῶνは共同体を含むため「皆さん」とした。
- source_word: χαρισθήσομαι ὑμῖν
  choice: 私が恵みとして皆さんに与えられる
  rationale: 未来受動形を保ち、χαρίζομαιの無償の恵みとして与えるという含みも表した。神の働きが暗示されるが、原文に明示されない主語は補わない。
theological_decisions:
- issue: χαρισθήσομαιの受動態と暗示される行為者
  choice: 「恵みとして…与えられる」とし、受動態と恵みの含みを保つ
  alternative: 「皆さんのもとへ帰れる」「釈放されて皆さんのところへ行ける」
  rationale: 文脈上はパウロの釈放と帰還が想定され得るが、原文はそれらを明言しない。神を行為者として暗示する神的受動の可能性も保ち、解釈を本文で限定しない。
translation_notes:
  register: 明瞭で丁寧な現代標準日本語。パウロの実際的な依頼には「用意しておいてください」を用い、後半では受動表現をあえて保持して原文の恵みと神的行為者の含みを残した。
