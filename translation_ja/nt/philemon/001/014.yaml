id: PHM.1.14
reference: Philemon 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: ja
  text: しかし、あなたの同意なしには[a]、何一つしたくありませんでした。それは、あなたの善い行い[b]が、強いられたもののようではなく、自発的なものとなるためです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの承認なしには」または「あなたの考えを聞かずには」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたの善意」または「あなたの親切」。ギリシア語は、この件に関するフィレモンの善い行為を指すことも、より抽象的にその善意を指すこともできる。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「しかし、自発的なものとして」。すなわち「自ら進んで行うものとして」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: あなたの同意なしには
  rationale: γνώμηには「考え、判断、意向、同意」の幅があるが、ここではパウロがフィレモンの意思を無視して行動しないという文脈なので、「同意」が関係的・意志的な意味を自然に表す。
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: 何一つしたくありませんでした
  rationale: θέλωの意志・願望のニュアンスを保ち、「決めた」として決定行為を過度に強調しない。
- source_word: ἵνα μὴ ... ἀλλὰ
  choice: それは、…ではなく、…となるためです
  rationale: 目的を示すἵναの働きと、否定・対比の構造を明瞭な現代日本語で表す。
- source_word: ὡς κατὰ ἀνάγκην
  choice: 強いられたもののようではなく
  rationale: ἀνάγκηをこの文脈での圧力・強制として訳し、ὡςの「そのような性格を帯びる」という含みも「もののよう」で保持する。
- source_word: τὸ ἀγαθόν σου
  choice: あなたの善い行い
  rationale: 中性形の名詞的用法を、この件に関してフィレモンが行う善い行為として表す。ただし抽象的な「善意、親切」の可能性は注で残す。
- source_word: κατὰ ἑκούσιον
  choice: 自発的なもの
  rationale: 強制との対比を簡潔に示し、自ら進んで行うという意味を自然な日本語で表す。
theological_decisions:
- issue: フィレモンの応答の性質
  choice: 具体的な行為の内容を特定せず、「善い行い」が強制ではなく自発的であることを示す。
  alternative: 「善意」または「親切」と抽象的に訳す。
  rationale: 本文の重点は応答の具体的内容ではなく、その応答が強制によらず自由な意思から出ることにある。ギリシア語が行為の詳細を明示していないため、訳文でもそれを補いすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「何一つしたくありませんでした」でパウロ自身の意志を表し、「強いられたもののようではなく／自発的なもの」で原文の対比と含みを保った。
