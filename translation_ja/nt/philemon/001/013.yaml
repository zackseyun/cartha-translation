id: PHM.1.13
reference: Philemon 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: ja
  text: 私は彼をそばに置いておきたいと思っていました。福音にかかわる拘束の中で、彼があなたに代わって私に仕えるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「福音の鎖の中で」。これは、福音のために受けている拘束・投獄を指すとも理解できます。
    reason: τοῦ εὐαγγελίουの簡潔な属格表現が持つ幅を本文で保ちつつ、δεσμοίの「鎖／拘束」という具体的表現と、有力な因果的理解を示すため。
lexical_decisions:
- source_word: ὃν
  choice: 彼を
  rationale: 男性単数の関係代名詞で、直前のオネシモを指す。日本語では文を改めて「彼を」とするのが自然で明確。
- source_word: ἐβουλόμην
  choice: 置いておきたいと思っていました
  rationale: 過去におけるパウロの願望・意向を表す未完了過去の働きを、自然な現代日本語で示す。
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: そばに置いておく
  rationale: オネシモを自分のもとに引き留めておくという意味を、所有的に響きすぎない自然な表現で訳す。
- source_word: ἵνα
  choice: それは……ためでした
  rationale: 目的を導く接続詞の機能を明示する。
- source_word: ὑπὲρ σοῦ
  choice: あなたに代わって
  rationale: オネシモの奉仕がフィレモン自身の奉仕を代理するという文脈上の含意を示す。単なる利益の意味に限定しない。
- source_word: μοι διακονῇ
  choice: 私に……仕えてもらう
  rationale: διακονέωの奉仕・世話をするという広い意味を保ち、教会職制に限定される語を避ける。ἵνα節の目的に沿って日本語として自然に表現した。
- source_word: ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου
  choice: 福音のゆえにつながれている私に
  rationale: δεσμοίの拘束・投獄の具体性を「つながれている」で保ち、属格 τοῦ εὐαγγελίου は文脈上有力な原因の意味として本文に表した。
theological_decisions:
- issue: τοῦ εὐαγγελίου が δεσμοῖς に対して持つ意味
  choice: 福音のゆえにつながれている
  alternative: 福音の鎖につながれている／福音に伴う投獄の中で
  rationale: この属格は、福音を宣べ伝えたために受けた拘束を指す可能性が高い。ただし、簡潔なギリシア語表現が持つ連関の幅を脚注で示した。
- issue: ὑπὲρ σοῦ の代理性と受益性
  choice: あなたに代わって
  alternative: あなたのために
  rationale: 直後の14節でパウロがフィレモンの善意と承諾を重視するため、ここではオネシモがフィレモンに代わって奉仕するという代理性が前景化している。ただし、ὑπέρに含まれ得る受益の意味を排除する教理的主張ではない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、私信としての温かさと使徒パウロの品位を保った。「そばに置いておく」は「引き留める」より強制的な響きを抑え、「仕えてもらう」は目的節を自然に表す。脚注記号[a]は該当文末に配置した。
