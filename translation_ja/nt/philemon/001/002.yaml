source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: ja
  text: また、姉妹アピア、私たちの戦友アルキポ、そしてあなたの家にある教会へ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: アフィア
  rationale: ギリシャ語の人名を、現代日本語で一般的な聖書固有名詞の表記に従って音写した。
- source_word: τῇ ἀδελφῇ
  choice: 姉妹
  rationale: 字義は「その姉妹」。ここでは実の姉妹とは限らず、キリスト者としての家族的関係を表す呼称である。「私たちの」は本文にないため補わない。定冠詞は日本語では明示しないのが自然である。
- source_word: Ἀρχίππῳ
  choice: アルキポ
  rationale: ギリシャ語の人名を日本語の慣用的な聖書表記に従って音写した。
- source_word: τῷ συστρατιώτῃ ἡμῶν
  choice: 私たちと共に戦う兵士
  rationale: 「共に」を表す接頭辞と「兵士」から成る語の軍事的比喩を保持しつつ、ἡμῶνとの関係を自然な日本語で示した。
- source_word: τῇ κατ’ οἶκόν σου ἐκκλησίᾳ
  choice: あなたの家にある教会
  rationale: 集まる場所としての家と、そこに属する信者の共同体の両面を明示しすぎずに表す。「家で集まる教会」も可能だが、原文には「集まる」に相当する動詞がない。
- source_word: καὶ
  choice: また／そして
  rationale: 宛先を順に加える反復構造を、日本語として読みやすい接続表現で保った。
theological_decisions:
- issue: ἀδελφῇに所有表現を補うか
  choice: 「姉妹」とし、「私たちの」を本文に補わない
  alternative: 「私たちの姉妹」
  rationale: 提示されたSBLGNT本文はτῇ ἀδελφῇであり、ἡμῶνを含まない。キリスト者の家族的結びつきを示す語義は保ちつつ、異読による所有表現は脚注に置いた。
- issue: συστρατιώτῃの軍事的比喩を保持するか
  choice: 「共に戦う兵士」
  alternative: 「同労者」「戦友」
  rationale: パウロの比喩的表現にある「兵士」の像を保持した。「同労者」では軍事的比喩が失われ、「戦友」では現代日本語における実戦経験の含意が強くなりうる。
- issue: ἐκκλησίᾳを共同体としてどう表すか
  choice: 「教会」
  alternative: 「集まり」「会衆」
  rationale: この書簡の文脈では、家を場所として集うキリスト者共同体を指す。「教会」は建物だけでなく共同体も表す定着した訳語であり、特定の教派制度を読み込まない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。1節から続く宛先の列挙として「また」で始め、各受取人を簡潔に並べた。固有名詞は日本語聖書で定着した形を用い、軍事的比喩と家の教会という原文の表現を保持した。
