  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: ja
  text: この私パウロが、自分の手で書きました。私が返済します。もっとも、あなたが自分自身をも私に負っていることは、あえて言いません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: 書きます
  rationale: 形はアオリストで「書きました」とも訳せるが、書簡の中で自筆の保証に注意を向ける表現として、現代日本語では「書きます」が自然である。時制の形は脚注で示した。
- source_word: τῇ ἐμῇ χειρί
  choice: 自分の手で
  rationale: パウロ本人が自筆していることを強調する句。「自筆で」も可能だが、原文の「手」を保ちながら自然な日本語とした。
- source_word: ἀποτίσω
  choice: 私が返します
  rationale: 前節で想定されている損害や負債をパウロが弁済するとの将来の約束を、簡潔に表した。目的語は文脈上明らかなため、日本語では省いた。
- source_word: ἵνα μὴ λέγω σοι
  choice: あえて言いません
  rationale: 厳密な目的というより、実際には内容を述べながら「言わないでおく」とする修辞的な言い回しである。控えめな皮肉を自然な日本語で保った。
- source_word: σεαυτόν
  choice: あなた自身さえも
  rationale: καίによる強調を「さえも」で示し、金銭以上に本人まで負っているという強い表現を保った。
- source_word: προσοφείλεις
  choice: 私に負っている
  rationale: 何かをさらに負っているという負債の比喩を保持した。「借りがある」よりも、パウロに対して本人自身を負うという原文の強い言い方を明確に残す。
theological_decisions:
- issue: 「あなた自身さえも私に負っている」という負債の内容
  choice: 個人的・比喩的な負い目をそのまま示し、その根拠は特定しない。
  alternative: ピレモンの回心、救い、身体的生命、または一般的な恩義を指すと明示する。
  rationale: 原文は負い目を強く述べるが、その具体的な由来を説明していない。本文が残す含みと神学的緊張を維持するため、特定の解釈を補わない。
translation_notes:
  register: 明瞭で現代的だが、個人的保証と修辞的な含みを損なわない端正な文体とした。「自分の手で」「負っている」により原文の具体性と負債の比喩を保持した。
