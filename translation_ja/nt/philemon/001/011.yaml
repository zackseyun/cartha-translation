  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: ja
  text: 彼は、以前はあなたにとって役に立たなかったのですが[a]、今ではあなたにとっても私にとっても役に立ちます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: パウロはおそらく、「役に立つ」「有益な」という意味に関係するオネシモの名を踏まえて、言葉遊びをしています。
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: 彼は……者でしたが
  rationale: 前節のオネシモを受ける対格の定冠詞を、日本語では文脈を継ぐ「彼は」とし、形容詞を「者」で名詞化して自然な文にした。
- source_word: ποτέ
  choice: かつては
  rationale: νυνὶ（「今では」）との時間的対照を明確かつ簡潔に表す。
- source_word: σοι
  choice: あなたにとって
  rationale: ἄχρηστονとの関係を、現代日本語で自然な評価の表現として示す。
- source_word: ἄχρηστον
  choice: 役に立たない
  rationale: 「有用でない」という基本義を平明に表し、εὔχρηστονとの対照とオネシモの名に関わる言葉遊びを保つ。
- source_word: νυνὶ δὲ
  choice: しかし……今では
  rationale: 過去との時間的・逆接的な対照を自然な日本語で示す。文中では接続助詞「が」と「今では」の組み合わせで表現した。
- source_word: σοὶ καὶ ἐμοὶ
  choice: あなたにも私にも
  rationale: 二つの与格を並列の「にも……にも」で明確に示し、双方に当てはまることを表す。
- source_word: εὔχρηστον
  choice: 役に立つ
  rationale: 現代日本語で分かりやすく、ἄχρηστον（「役に立たない」）との語形・意味上の対照を保つ。
theological_decisions:
- issue: オネシモという名に関係する可能性のある言葉遊びと、彼の変化
  choice: 本文では「役に立たない／役に立つ」という単純な対照を保つ
  alternative: 「今では真に有益な者」など、言葉遊びや変化を説明的に前景化する
  rationale: ギリシア語本文は対照そのものを明示するが、その含意を説明的に展開してはいない。直截な訳によって文学的効果を保ち、本文以上の解釈を加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、書簡としての落ち着いた品位を保った。「有用でない／有用である」より日常的で理解しやすい「役に立たない／役に立つ」を採用し、原文の対句も保持した。
