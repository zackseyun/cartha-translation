source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: ja
  text: もはや奴隷としてではなく、奴隷以上の者、すなわち愛する兄弟としてです。彼は私にとってとりわけ愛する兄弟ですが、肉においても[a]、主においても、あなたにとってはなおさらです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「肉において」は、「罪深い性質において」という意味ではなく、この世での人間的・社会的な関係において、あるいは実際の生活において、という意味だと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι ὡς δοῦλον
  choice: もはや奴隷としてではなく
  rationale: οὐκέτιの時間的な変化を「もはや」で示し、当時の拘束された社会的身分が文脈上重要であるため、δοῦλοςを「奴隷」と訳した。ὡςの「〜として」も保持した。
- source_word: ὑπὲρ δοῦλον
  choice: 奴隷以上の者
  rationale: ὑπέρがここで身代わりではなく、身分・価値を越える比較を表すことを自然な日本語で示した。
- source_word: ἀδελφὸν ἀγαπητόν
  choice: 愛する兄弟
  rationale: 信仰共同体における家族的関係を表す「兄弟」を保ち、ἀγαπητόςを簡潔で自然な「愛する」とした。
- source_word: μάλιστα ἐμοί
  choice: 私にとってとりわけそうですが
  rationale: μάλισταの程度の強調を「とりわけ」で表し、後続の比較へ自然につないだ。
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: あなたにとってはなおさらです
  rationale: 修辞的な比較の強まりを、日本語として自然な「なおさら」で表した。
- source_word: ἐν σαρκὶ
  choice: 肉においても
  rationale: 地上の、身体的・社会的関係を指す可能性を踏まえつつ、パウロの表現とその含みを本文に保持した。誤解を避けるため脚注を付した。
- source_word: ἐν κυρίῳ
  choice: 主においても
  rationale: キリストとの結びつき、また信仰上の関係を示すパウロ特有の領域表現を、過度に説明せず保持した。
theological_decisions:
- issue: オネシモの文脈における δοῦλος の訳語
  choice: 奴隷
  alternative: 僕／仕える者
  rationale: この手紙ではオネシモの拘束された社会的身分と、その身分を越えた受け入れが中心的である。「奴隷」とすることで歴史的現実と「奴隷以上」という対比を明確に保った。
- issue: ἐν σαρκὶ καὶ ἐν κυρίῳ の意味
  choice: 肉においても、主においても
  alternative: この世の関係においても、主にある関係においても／実際の生活においても、主にあっても
  rationale: 地上の社会的・身体的関係と、主にある信仰上の関係の双方を指すと考えられるが、本文では原文の表現と神学的な含みを保ち、解釈を一つに限定しなかった。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語を用いた。「奴隷」は歴史的・社会的現実を曖昧にしないため採用。「肉において」はパウロの表現を保ち、脚注で文脈上の意味を補った。原文の長い構文は、読みやすさのため日本語では複数の文に分けた。
