  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: ja
  text: 主イエス・キリストの恵みが、あなたがたの霊とともにありますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがた」は複数形。結びの祝福がフィレモン一人だけでなく、この手紙を受け取る人々にも及ぶことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の祝祷で神から与えられる慈愛と祝福を表す定着した訳語であり、文脈に自然である。
- source_word: κυρίου
  choice: 主
  rationale: イエスに対する称号としての重みを保ちつつ、現代日本語の聖書表現として明瞭である。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語では「キリスト」が称号としても広く理解され、結びの定型句を自然かつ荘重に表せる。
- source_word: μετὰ
  choice: とともにありますように
  rationale: 動詞のないギリシア語の祝祷文に、願いを表す日本語の述語を補って自然にした。
- source_word: πνεύματος
  choice: 霊
  rationale: 受取人たちの内なる人を指す可能性が高いが、「霊」として原文の簡潔さと一定の含みを保った。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: 二人称複数であることを本文で明示し、祝福がフィレモン一人だけでなく手紙の受取人たちに及ぶことを示した。
theological_decisions:
- issue: Χριστοῦを結びの祝祷でどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςの称号性は認められるが、日本語では「イエス・キリスト」が称号を含む定着した形であり、この祝祷句では自然さと荘重さを保つ。
- issue: 「あなたがたの霊」の指示対象
  choice: 受取人たちの霊／内なる人
  alternative: 聖霊
  rationale: 複数の所有代名詞「あなたがたの」が受取人側の霊を強く示すため、「聖霊」と断定せず、原文どおり「霊」とした。
- issue: 動詞のない祝祷句の扱い
  choice: 「ありますように」を補う
  alternative: 「ともに」だけで終える
  rationale: ギリシア語の願望的な祝祷の働きを、明瞭で自然な日本語として表すためである。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祝祷にふさわしい簡潔で荘重な調子とした。「あなたがた」によって原文の複数形を本文で可視化した。
