id: PHM.1.1
reference: Philemon 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: ja
  text: メシアであるイエス[b]の囚人パウロ[a]と、兄弟テモテから、私たちの愛する同労者フィレモンへ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアであるイエスのために囚人となっているパウロ」とも訳せる。ギリシア語の属格は、イエスとの関係またはイエスのゆえの投獄を示し得る。
    reason: alternative_reading
  - marker: b
    text: ギリシア語は「キリスト」。ここでは称号としての意味を表すため「メシア」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: 囚人
  rationale: 拘束され、投獄されている者を表す名詞であり、簡潔で自然な対応語とした。後続する属格との関係は本文で限定しすぎず、注で別の理解を示す。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語として自然に個人名イエスへ結び付けた。
- source_word: ὁ ἀδελφός
  choice: 兄弟
  rationale: 信仰共同体における家族的な呼称を簡潔に保った。日本語では所有代名詞を補わなくても共同体的関係が自然に伝わる。
- source_word: ἀγαπητῷ
  choice: 愛する
  rationale: 受取人に対する温かな愛情を、現代日本語で自然かつ品位ある形で表した。
- source_word: συνεργῷ
  choice: 同労者
  rationale: 共に働く者という意味と、パウロ書簡における宣教・奉仕の含みを簡潔に伝える語を選んだ。
- source_word: ἡμῶν
  choice: 私たちの
  rationale: パウロとテモテを差出人とする複数形を保持し、ἀγαπητῷとσυνεργῷの双方にかかる関係を表した。
- source_word: Φιλήμονι
  choice: フィレモンへ
  rationale: 書簡冒頭の宛先を示す与格を、日本語の書簡形式に自然な「へ」で表した。
- source_word: καὶ Τιμόθεος
  choice: と、兄弟テモテ
  rationale: テモテをパウロと並ぶ差出人として示し、原文の同格的な「兄弟」という呼称も保持した。
theological_decisions:
- issue: Χριστόςを称号としてどう訳すか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: この挨拶ではΧριστόςの称号としての意味がなお明瞭であるため、「油注がれた者」という称号性を伝える「メシア」を本文に採用した。慣用的な「キリスト」も注で示し、固有名のように一義化しない。
- issue: Χριστοῦ Ἰησοῦが囚人との関係を何によって示すか
  choice: メシアであるイエスの囚人
  alternative: メシアであるイエスのために囚人となっている者
  rationale: ギリシア語属格は、イエスとの所属・関係とも、イエスのゆえの投獄とも理解できる。本文では簡潔な属格表現を保ち、因果的理解を注に示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡冒頭にふさわしい簡潔で品位ある文体とした。「同労者」はやや改まった語だが、共同の働き、とりわけ宣教・奉仕の含みを保つため採用した。
