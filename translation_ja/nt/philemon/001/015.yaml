  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: ja
  text: というのも、おそらくこのために、彼はしばらくの間あなたから引き離されたのでしょう。あなたが彼を永遠に得るためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼がしばらくの間あなたのもとを去ったのでしょう」。ギリシア語は「引き離された」という受動形で、直接の責任を婉曲に述べると同時に、神の摂理が働いていた可能性も残しています。
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: もしかすると
  rationale: パウロが断定を避け、控えめに推し量っている語調を自然な現代日本語で表す。
- source_word: γὰρ
  choice: （文脈上の説明関係として表現）
  rationale: 前節を受ける説明の働きは文全体の流れに織り込み、日本語として不自然な接続を避ける。
- source_word: διὰ τοῦτο
  choice: …のは、…ためだった
  rationale: 理由ないし目的を示す構造を、日本語の「のは…ため」という対応で明示する。
- source_word: ἐχωρίσθη
  choice: 引き離された
  rationale: 受動態を保ち、オネシモ自身の離去とも神の摂理的な働きとも明言しない原文の曖昧さを残す。
- source_word: πρὸς ὥραν
  choice: しばらくの間
  rationale: 文字どおりの「一時間」ではなく、限られた期間を表す慣用的な意味を自然に伝える。
- source_word: ἵνα
  choice: …ため
  rationale: 目的または意図された結果を示す接続関係を明瞭にする。
- source_word: αἰώνιον
  choice: 永遠に
  rationale: 一時的な別離との対照を保ち、時間的持続と霊的含意の双方を排除しない。
- source_word: αὐτὸν
  choice: 彼を
  rationale: 文脈上オネシモを指す直接目的語として明確に訳す。
- source_word: ἀπέχῃς
  choice: 取り戻す
  rationale: 再び彼を自分のもとに得るという文脈上の意味を簡潔で自然な日本語にする。
theological_decisions:
- issue: 受動態 ἐχωρίσθη が暗示する行為者
  choice: 「引き離された」と受動態で訳し、行為者を特定しない。
  alternative: 「彼が去った」または「神が彼を引き離した」
  rationale: 原文はオネシモの責任を婉曲に扱いつつ、神の摂理を暗示する余地も残す。どちらか一方に決めず、その神学的緊張を保持する。
- issue: ἵνα が示す目的と摂理
  choice: 「…ためだったのかもしれません」と、目的を示しながら推量として訳す。
  alternative: 神の明確な計画として断定する。
  rationale: 目的構文は保つが、τάχα による控えめな推量を文末にも反映し、神の意図をパウロが断定しているようには訳さない。
translation_notes:
  register: 明瞭で現代的ながら、書簡にふさわしい落ち着いた敬体を採用した。「もしかすると」と「かもしれません」が重なるが、原文の控えめな推量を文全体に自然に及ぼし、目的を断定しすぎないために用いた。
