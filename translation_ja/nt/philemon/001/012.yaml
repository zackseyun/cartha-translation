base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: ja
  text: そのオネシモを、あなたのもとへ送り返します。[a] 彼は、すなわち私の心そのものです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「送り返しました」とも訳せる。ギリシア語のアオリストは、手紙を受け取る側の時点から「送り返します」と表すこともできる。
    reason: ἀνέπεμψάの時制表現に関する別訳の可能性を示すため。
  - marker: b
    text: 「心」に当たる語は、直訳すると「内臓」。深い愛情や慈しみを表す慣用語。
    reason: σπλάγχναの身体的比喩の字義と慣用的意味を示すため。
lexical_decisions:
- source_word: ὃν
  choice: そのオネシモを
  rationale: 男性単数の関係代名詞で、直前のオネシモを指す。日本語では指示対象を補って明示するほうが自然である。
- source_word: ἀνέπεμψά
  choice: 送り返します
  rationale: ἀναπέμπωのアオリストで、「元の相手のもとへ返す」の意。手紙とともにオネシモを送り返すという書簡上の視点を、自然な現在形で表した。
- source_word: σοι
  choice: あなたのもとへ
  rationale: 送り返す相手を示す二人称単数与格。「あなたに」より、帰る先としてのニュアンスが自然に伝わる。
- source_word: αὐτόν
  choice: そのオネシモを／彼は
  rationale: 原文では代名詞を重ねてオネシモ本人を強調する。日本語では名を明示し、次の説明を「彼は」と受けることで、その強調と自然さを両立させた。
- source_word: τοῦτ’ ἔστιν
  choice: いわば
  rationale: 前の人物を比喩的に言い換える説明句。直訳的な「すなわち」も可能だが、「私の心そのもの」という比喩へ自然につなぐため「いわば」とした。
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: 私の心そのもの
  rationale: σπλάγχναは字義的には内臓だが、ここでは深い愛情の座を表す慣用表現。「心そのもの」は、パウロがオネシモを自分の最も大切な存在として送り出す強い情愛を明瞭に伝える。
theological_decisions:
- issue: σπλάγχναの人間論的比喩
  choice: 「私の心そのもの」と慣用的に訳す
  alternative: 「私の内臓」「私の深い愛情」
  rationale: これは教理上の限定ではなく、古代語の身体的比喩を現代日本語で理解できる形にする語彙的判断である。「内臓」では意味が伝わりにくく、「深い愛情」ではオネシモ本人をパウロ自身の心と同一視する比喩の強さが弱まる。
- issue: アオリストἀνέπεμψάの時制表現
  choice: 書簡の送達場面を踏まえて「送り返します」
  alternative: 「送り返しました」または「送り返した」
  rationale: ギリシア語アオリスト自体は過去形で訳し得るが、手紙を携える人物について、受取人の視点を先取りする書簡的アオリストと理解できる。日本語の現在形はその状況を自然に表しつつ、過去時制の可能性は注で保持する。
translation_notes:
  register: 明瞭で現代的だが品位ある標準日本語。「オネシモ」を補って指示対象を明らかにし、短い二文に分けて原文の強調を伝えた。脚注記号[a]は本文中に明示した。
