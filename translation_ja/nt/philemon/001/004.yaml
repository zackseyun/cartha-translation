base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: ja
  text: 私は、祈るときにはあなたのことを覚え[a]、いつも私の神に感謝しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「祈りの中であなたのことに言及し」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: 感謝しています
  rationale: 現在形の継続的・習慣的な響きを自然な現代日本語で表し、神への感謝という直接的な意味を保った。
- source_word: τῷ θεῷ μου
  choice: 私の神に
  rationale: 与格が感謝の向けられる相手を示すため「に」とし、μου の個人的・信仰的な表現を「私の」で保持した。
- source_word: πάντοτε
  choice: いつも
  rationale: 習慣的な一貫性を、平明で自然な副詞によって表した。
- source_word: μνείαν σου ποιούμενος
  choice: あなたのことを覚え
  rationale: この慣用句は字義的には「あなたのことに言及し」だが、祈りの文脈では「覚える」が、祈りのうちに相手を心に留めて神の前に取り上げる意味を自然に伝える。字義的な表現は脚注に残した。
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: 祈るときには
  rationale: ἐπί＋属格がここでは祈りの機会・時を示すため、直訳調を避けつつ「私の祈りにおいて」の意味を明瞭に表した。動詞の主語から「私」は自然に理解される。
theological_decisions: []
