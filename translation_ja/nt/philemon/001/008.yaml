id: PHM.1.8
reference: Philemon 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: ja
  text: ですから、私はメシアにあって[a]、あなたにふさわしいこと[b]を大胆に命じることもできますが、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストにあって」とも訳せる。ギリシア語Χριστόςは「油を注がれた者」という称号で、「メシア」に相当する。
    reason: 称号の別訳を示すため。
  - marker: b
    text: 別訳「当然なこと」「適切なこと」。
    reason: τὸ ἀνῆκονの語義の幅を示すため。
lexical_decisions:
- source_word: Διό
  choice: ですから
  rationale: 直前の感謝と祈りを受けて結論へ進む推論的な接続を、自然な現代日本語で示す。
- source_word: πολλὴν ... παρρησίαν
  choice: 十分な確信
  rationale: παρρησίαが表す大胆さ、率直に語る自由、確信の幅を保ちつつ、命じる権限について述べる文脈に自然に合わせた。「十分な」はπολλήνの強意を表す。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςの称号としての意味を示し、ἐνのパウロ的な関係・領域の表現を「あって」で狭く限定せずに保つ。
- source_word: ἔχων
  choice: 持っていますが
  rationale: 9節の願いへ続く譲歩的な対比を「が」で示す。節をまたぐ未完の構文も保持する。
- source_word: ἐπιτάσσειν σοι
  choice: あなたに…命じる
  rationale: ἐπιτάσσωの権威を伴う指示という強さと、σοιの受け手を明確に表す。
- source_word: τὸ ἀνῆκον
  choice: ふさわしいこと
  rationale: 状況や務めに照らして適切なこと、当然なことを意味する表現として、過度に義務へ限定しない自然な訳とした。
theological_decisions:
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名ではなく称号として機能するため、その称号性が明瞭な「メシア」を本文に用いた。日本語で定着した「キリスト」も可能なので脚注に示した。
- issue: ἔχωνの論理的関係
  choice: 譲歩的に「持っていますが」
  alternative: 理由として「持っているので」
  rationale: 9節の「愛のゆえに、むしろお願いします」との対比が譲歩的理解を支持する。ただし対比は次節で完成するため、本節末を「が」で開いたままにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。次節へ続くギリシア語の譲歩構文を反映し、文末を「が、」として未完のまま保った。「大胆さ」を直訳的に強調するより、命じることのできる率直さと権限を自然に表す「十分な確信」を採用した。
