source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: ja
  text: あなたの信仰の交わりが、私たちのうちにある、メシアに関わるあらゆる良いものを十分に認識することによって、効果を発揮するように[a][b][c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの信仰を分かち合うこと」または「あなたの信仰による協力」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「信仰」と訳した語は、文脈によっては「忠実さ」または「信頼」を意味することもある。
    reason: alternative_reading
  - marker: c
    text: 写本によっては、「私たちのうちに」ではなく「あなたのうちに」とある。
    reason: textual_variant
  - marker: d
    text: 「メシアに関わる」は、「メシアのための」または「メシアに向けられた」とも理解できる。この句を「効果を発揮する」に結び付ける解釈も可能である。
    reason: ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: 〜となりますように
  rationale: 直前の祈りの内容を受ける目的・願望のニュアンスを、日本語として自然な祈願表現で示した。
- source_word: κοινωνία τῆς πίστεώς σου
  choice: あなたの信仰の交わり
  rationale: κοινωνίαの「交わり・分かち合い・参与」という幅を保ち、信仰を伝える行為だけに限定しない訳とした。属格の関係は原文同様に曖昧さを残した。
- source_word: πίστεώς
  choice: 信仰
  rationale: この文脈で基本的な意味を採用した。「真実」「忠実」の可能性は注で示す。
- source_word: ἐνεργὴς γένηται
  choice: 力あるものとなりますように
  rationale: 「有効になる」より自然で品位ある日本語とし、実際に働きを生じるというἐνεργήςの意味を表した。
- source_word: ἐν ἐπιγνώσει
  choice: 深く知ることによって
  rationale: ἐπίγνωσιςの十分な認識という含みを「深く知る」で表し、ἐνはここでは手段を示すと解した。ただし「知ることにおいて」も可能である。
- source_word: παντὸς ἀγαθοῦ τοῦ ἐν ἡμῖν
  choice: 私たちのうちにある…あらゆる良いもの
  rationale: 限定句を「良いもの」に結び付け、SBLGNTのἡμῖνをそのまま「私たち」とした。
- source_word: εἰς Χριστόν
  choice: メシアに向かう
  rationale: εἰςの方向・目的・関係の曖昧さを「に向かう」で比較的よく保った。Χριστόςは称号として「メシア」と訳した。
theological_decisions:
- issue: κοινωνία τῆς πίστεώς σουの意味
  choice: 「あなたの信仰の交わり」
  alternative: 「あなたの信仰を分かち合うこと」「あなたの信仰による協力」
  rationale: この難解な句を伝道行為または共同体的参与の一方だけに限定せず、原文の意味の幅を保った。
- issue: ἐν ἐπιγνώσειの機能
  choice: 手段として「深く知ることによって」
  alternative: 領域として「深い知識において」
  rationale: 交わりが実効的になる手段を述べる理解が文脈に合うが、前置詞ἐν自体は領域的にも理解できる。
- issue: εἰς Χριστόνの係り先と意味
  choice: 「あらゆる良いもの」を修飾する方向・目的表現
  alternative: 主節の「力あるものとなる」に結び付け、「メシアのために有効になる」と理解する
  rationale: 語順上は直前の名詞句に結び付けるのが自然だが、原文は圧縮されており、統語と意味には不確定さが残るため注記した。
- issue: ἐν ἡμῖνの本文
  choice: 「私たちのうちに」
  alternative: 異読「あなたのうちに」
  rationale: 指定されたSBLGNT本文のἡμῖνを採用し、異読は脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祈りの文としての品位を保った。「交わり」は一般語として通じる範囲で、κοινωνίαの共同性と参与性を残すために用いた。
