source:
  edition: SBLGNT
  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: ja
  text: 愛のゆえに、むしろお願いします[a]。年老いた者であり、今はメシア・イエス[c]の囚人でもある、このパウロとして――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「愛のために、むしろお願いします」。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は「キリスト・イエス」。ここでは「キリスト」を称号として「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: 愛のゆえに
  rationale: διά＋対格の理由・動機を表す働きを保ちつつ、現代日本語として簡潔で品位ある表現とした。
- source_word: μᾶλλον παρακαλῶ
  choice: むしろお願いします
  rationale: 8節の「命じる」こととの対比を「むしろ」で示し、παρακαλῶは権威による命令ではなく、愛に基づく個人的な懇願として訳した。
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: ほかならぬ私パウロが……者として
  rationale: やや省略的な自己言及を、日本語で理解できる形にしながら、後続する二つの自己描写へつながる構造を保った。
- source_word: πρεσβύτης
  choice: 年老いた者
  rationale: 通常の年齢に関する意味を採用した。「大使」は別語πρεσβευτήςとの関連から提案される異読的解釈であり、本文の語形からは「年老いた者」が自然である。
- source_word: νυνὶ δὲ καὶ δέσμιος
  choice: 今では……囚人でもある
  rationale: νυνίの時間的強調とκαίの追加の意味を示し、δέσμιοςを直接的に「囚人」と訳した。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエスの
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語で「メシア・イエス」と機械的に並べるより自然な形にした。属格が示す所属・関係は「の」によって保持した。
theological_decisions:
- issue: πρεσβύτηςの意味
  choice: 年老いた者
  alternative: 大使、または長老
  rationale: 本文の語は通常「年老いた男性」を意味するπρεσβύτηςである。「大使」は類似した別語πρεσβευτήςに基づく提案であり、「長老」とすると教会職制を不必要に持ち込むため、本文の素直な年齢表現を採用した。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスに付された称号としての意味がなお認められるため、「メシア」とした。ただし、日本語で定着した「キリスト」も可能な訳として脚注に示した。
- issue: 「メシアであるイエスの囚人」の関係
  choice: 属格の関係を限定せず「の」で表す
  alternative: メシアであるイエスのために投獄された者
  rationale: Χριστοῦ Ἰησοῦは所属、仕える関係、または彼のゆえの投獄を含み得る。本文だけで一つに限定せず、神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら、私的な手紙にふさわしい丁寧さとパウロの厳粛な自己描写を保った。原文がダッシュで次節へ続くため、訳文も長いダッシュで未完の流れを示した。「ほかならぬ」はτοιοῦτος ὢν ὡς Παῦλοςの強調的・自己言及的な調子を自然な日本語で伝えるために用いた。
