- source_word: Μᾶρκος
  choice: マルコ
  rationale: 新約聖書で定着している日本語表記を用い、人物名を音写した。
- source_word: Ἀρίσταρχος
  choice: アリスタルコ
  rationale: 新約聖書で広く用いられる日本語表記によって人物名を音写した。
- source_word: Δημᾶς
  choice: デマス
  rationale: 原語の人物名に対応する、定着した日本語表記を用いた。
- source_word: Λουκᾶς
  choice: ルカ
  rationale: 新約聖書で定着している日本語表記を用いた。
- source_word: οἱ συνεργοί μου
  choice: 私の同労者
  rationale: συνεργόςは、ともに働く仲間を指す。「同労者」は共同の働きに携わる関係を簡潔かつ dignified に表し、教会文脈でも理解されやすい。μουはパウロとの関係を示す「私の」とした。
- source_word: Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς, οἱ συνεργοί μου
  choice: 私の同労者であるマルコ、アリスタルコ、デマス、ルカからもよろしく
  rationale: 原文は前節の挨拶表現に続く動詞省略の名詞句である。日本語では文脈上補われる挨拶を明示し、「からもよろしく」として自然な完全文にした。οἱ συνεργοί μουは四名全員を説明する同格表現なので、名簿の前に置いた。
