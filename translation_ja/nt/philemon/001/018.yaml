  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: ja
  text: しかし、もし彼があなたに何か不正を行った、あるいはあなたに何か借りがあるなら、それを私の勘定につけてください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それを私の勘定に計上してください」。この動詞には、ある金額や責任を人の勘定につけるという会計上の意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: しかし、もし
  rationale: δέの穏やかな対照と、εἰの条件を自然な現代日本語で示す。
- source_word: τι ἠδίκησέν σε
  choice: 彼があなたに何か不正を働いた
  rationale: ἀδικέωの意味を、物質的損害だけに限定せず、広く不当な行為を表す言い方で訳した。τιは「何か」に反映した。
- source_word: ἢ ὀφείλει
  choice: 何か借りがある
  rationale: ὀφείλωがここで示す負債・債務の含みを、分かりやすく簡潔に表した。相手は文脈上「あなた」であるため、日本語では重複を避けて省略した。
- source_word: τοῦτο ἐμοὶ ἐλλόγα
  choice: それを私の勘定につけてください
  rationale: ἐλλογέωの会計上の比喩を明示し、パウロがその負担を自分に付けるよう求めていることを自然な日本語で伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、丁寧な命令形によって手紙にふさわしい品位を保った。「勘定」は会計の比喩を保持し、「不正を働く」は行為の内容を窃盗などに限定しない。
