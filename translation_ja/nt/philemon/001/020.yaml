  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: ja
  text: そうです、兄弟よ。主にあって、私はあなたから益を受けたいのです[a]。メシアにあって[c]、私の心[b]を安らがせてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたから喜びを得たい」とも取れる。この動詞には「益を得る、恩恵を受ける」という意味があり、パウロはオネシモという名と「有益」という意味を響かせている可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の内臓」。深い感情や内なる自己を指す慣用表現で、ここでは「私の心」と訳した。
    reason: lexical_alternative
  - marker: c
    text: 「キリストにあって」とも訳せる。「メシア」と「キリスト」は、いずれも「油注がれた者」という称号を表す。
    reason: translation_alternative
lexical_decisions:
- source_word: ναί
  choice: そうです
  rationale: 直前までの訴えを受け、親しみを込めて念を押す語。現代日本語で自然な肯定表現とした。
- source_word: ἀδελφέ
  choice: 兄弟よ
  rationale: 男性単数への呼びかけであり、同じ信仰共同体に属する者としての親しい関係を保つ。
- source_word: ἐγώ σου ὀναίμην
  choice: あなたから益を受けさせてください
  rationale: ὀνίνημιの「益を得る、恩恵を受ける」という意味と、願いを表す希求法を反映した。オネシモの名との語呂合わせの可能性は脚注に残した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡に特徴的な、主との結びつきの中で行われることを示す表現。「主によって」と限定せず、原文の幅を保った。
- source_word: ἀνάπαυσόν
  choice: 安らがせてください
  rationale: 休息や安心を与えるよう求めるアオリスト命令形。7節との語のつながりを保ちつつ、対人関係の文脈に自然な表現とした。
- source_word: μου τὰ σπλάγχνα
  choice: 私の心
  rationale: 字義的には内臓を指すが、ここでは深い感情や内なる自己を表す慣用句であるため、自然な日本語の「心」とした。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςの称号としての意味を示すため「メシア」とし、その方との結びつきの中で、という句の意味を保った。
theological_decisions:
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: 語は「油注がれた者」という称号であり、ここでも共同体を形づくる方としての称号性を保つ。「キリスト」は伝統的で自然な別訳として脚注に示した。
- issue: κυρίῳの訳語
  choice: 主
  alternative: 主人
  rationale: ここではパウロがイエスに用いる称号として理解するのが自然であり、「主人」では奴隷制の文脈に不必要に限定されるため「主」とした。
- issue: ἐνを伴う二つの句
  choice: 「主にあって」「メシアにあって」
  alternative: 「主によって」「メシアによって」
  rationale: 手段だけでなく、主・メシアとの関係やその支配領域の中でという意味も持ち得るため、日本語聖書で定着しつつ意味の幅を残す「にあって」を用いた。
translation_notes:
  register: 親しいが真剣な個人的訴えとして、丁寧な依頼形を用いた。「兄弟よ」は現代の日常会話より格調があるが、書簡の直接的な呼びかけと聖書本文としての品位を両立させる。二つの「にあって」を反復し、原文の神学的な枠組みを見える形で保った。
