source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: ja
  text: メシア・イエス[a]にあって私と共に囚われているエパフラスが、あなたによろしくと言っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（伝統的な表現）「キリスト・イエスにあって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: よろしくと言っています
  rationale: ἀσπάζομαι はここでは挨拶を伝えることを表す。日本語の書簡として自然で、三人称単数の主語にも合う表現とした。
- source_word: σε
  choice: あなたに
  rationale: 二人称単数の目的語で、直接の宛先であるフィレモンを指すため、単数性が明瞭な「あなたに」とした。
- source_word: Ἐπαφρᾶς
  choice: エパフラス
  rationale: 人名を日本語で慣用的に音写した。
- source_word: ὁ συναιχμάλωτός μου
  choice: 私と共に囚われている
  rationale: συναιχμάλωτος の「共に捕らわれた者、同囚の者」という意味を保ちつつ、現代日本語として自然な連体表現にした。単に同じ信仰を持つ仲間という意味には弱めなかった。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: ἐν を「にあって」として、パウロに特徴的なメシアとの結びつきを表す含意を保持した。Χριστός はここでは称号性を保つ「メシア」とし、Ἰησοῦ は「イエス」と音写した。伝統的な「キリスト・イエス」は脚注に示した。
theological_decisions:
- issue: パウロの定型句 ἐν Χριστῷ Ἰησοῦ における Χριστῷ の訳
  choice: メシア
  alternative: キリスト
  rationale: この句では Χριστός の称号としての神学的重みがなお認められるため「メシア」とした。ただし、日本語聖書で定着した「キリスト」も正当な訳なので脚注に残した。
- issue: ἐν Χριστῷ Ἰησοῦ と「共に囚われている」の関係
  choice: 「メシア・イエスにあって」が同囚者としてのエパフラスを特徴づける語順を保持
  alternative: 「メシア・イエスのために私と共に囚われている」
  rationale: ἐν を原因・目的の「ために」と断定せず、「にあって」と訳して、メシアとの結びつきと投獄との関係に残る原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、書簡の結びにふさわしい自然さと品位を保った。「よろしくと言っています」は口語的すぎない一般的な挨拶伝達表現である。脚注記号は対応する句「メシア・イエス」の直後に置いた。
