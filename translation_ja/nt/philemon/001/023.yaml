  terminology: 人名「エパフラス」、称号を反映する「メシア」、および定型句の関係を保つ「にあって」は一貫している。伝統的な「キリスト・イエスにあって」を示す脚注も、本文の選択を損なわず適切である。脚注記号は該当句の直後に正しく置かれている。
