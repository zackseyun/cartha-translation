source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: ja
  text: 主イエスに対して、またすべての聖徒に対して、あなたが抱いている愛と信仰について、聞いているからです。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 意味を明確にして訳すなら、「主イエスに対するあなたの信仰と、すべての聖徒に対するあなたの愛」。
    reason: alternative_reading
  - marker: b
    text: 「あなたが示している忠実さ」とも訳せる。ギリシア語は、信仰、信頼、忠実さを意味し得る。
    reason: lexical_alternative
  - marker: c
    text: 別訳「あなたの愛と、あなたが抱いている信仰」。
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: 聞いているからです
  rationale: 現在分詞を前節の感謝の理由を示すものと理解し、日本語では因果関係を明示した。継続的に評判を耳にしているという現在的な意味も保っている。
- source_word: ἀγάπην
  choice: 愛
  rationale: ἀγάπηの基本的で自然な訳語。ここでは主イエスおよび聖徒への関係をめぐる曖昧さを本文で限定しない。
- source_word: πίστιν
  choice: 信仰
  rationale: πίστιςの標準的な訳語を採用した。文脈上「忠実さ」の含みもあり得るため、脚注に別訳を示した。
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: 主イエスに向け
  rationale: 人物を対象とするπρόςの方向性を保ち、後続のεἰςとの前置詞上の違いも日本語で可能な範囲で表した。
- source_word: κύριον
  choice: 主
  rationale: イエスに対するキリスト論的称号κύριοςの標準的な訳語。
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: すべての聖徒に対して
  rationale: 関係の向かう対象を自然な日本語で示しつつ、πάνταςを「すべての」と明示した。
- source_word: ἁγίους
  choice: 聖徒
  rationale: パウロ書簡における信者共同体の呼称として簡潔で定着した訳語を用いた。
theological_decisions:
- issue: 「愛」と「信仰」を後続する二つの前置詞句にどう関連づけるか
  choice: 本文では、愛と信仰の両方が「主イエスに向け」「すべての聖徒に対して」に続くギリシア語の表面的な構造を保った。
  alternative: 意味を配分し、「主イエスに対する信仰と、すべての聖徒に対する愛」とする。
  rationale: 配分的な理解はパウロ神学や7節との対応によく合うが、原文は二つの名詞を先に置き、その後に二つの前置詞句を明示的な振り分けなしで続ける。本文では曖昧さと緊張を保ち、自然な配分解釈は脚注に示した。
- issue: この文脈におけるπίστιςの意味
  choice: 信仰
  alternative: 忠実さ
  rationale: 標準的な訳語は「信仰」だが、πίστιςには信頼や忠実さの意味領域もある。本文で一義的に決めず、語義上の別訳を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、「主」「聖徒」「信仰」という新約聖書の主要語彙を保持した。前節から続く理由節なので「からです」で結び、原文の構文的・神学的な曖昧さを本文で解消しすぎないようにした。
