  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: ja
  text: 私は、あの光の輝きのために目が見えなかったので[a]、一緒にいた人たちに手を引かれて、ダマスコに入りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あの光の栄光のゆえに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ οὐκ ἐνέβλεπον
  choice: しかし、私は……目が見えなくなったので
  rationale: ἐμβλέπωは「見る、目を向ける」を意味するが、ここでは直前の強烈な光によって視覚を失った結果を表す。未完了過去の状態を、日本語では文脈に即して「目が見えなくなった」と自然に表現した。ὡςは後続の出来事の理由を示し、δέは物語を継続しつつ軽い転換を表すため、「しかし……ので」とした。
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: あの光の輝きのために
  rationale: δόξαは字義的には「栄光」だが、ここでは視力を奪う光の放射的なまばゆさを指す。「輝き」は物理的な作用と非凡な光の性質をともに自然に伝える。ἐκείνουは「あの」で保持した。字義的な別訳は脚注に示す。
- source_word: χειραγωγούμενος
  choice: 手を引かれて
  rationale: 語に含まれる「手で導く」という具体的な像を、現代日本語で簡潔かつ自然に保持する。受動分詞の同時的状況も表している。
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: 一緒にいた人たちに
  rationale: σύνειμιの「共にいる、同行する」を透明に訳し、集団の関係を「仲間」などと限定しすぎない表現にした。
- source_word: ἦλθον εἰς Δαμασκόν
  choice: ダマスコに入りました
  rationale: εἰςが示す都市の内側への移動を「入る」で保持した。演説中の叙述として、明瞭で品位ある丁寧体を用いた。
theological_decisions:
- issue: 神的顕現を思わせる文脈におけるδόξαの訳語
  choice: 輝き
  alternative: 栄光
  rationale: この文ではδόξαが、パウロの視力を奪った光の可視的な放射を直接表しているため、「輝き」とした。ただし「栄光」という語の神学的含意を排除せず、原語により直訳的な表現を脚注に残して、文脈上の緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体。法廷・群衆への弁明という場面にふさわしい落ち着いた品位を保ちつつ、「手を引かれて」という具体的で分かりやすい表現を用いた。
