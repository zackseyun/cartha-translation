  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: ja
  text: 私が旅をしてダマスコに近づいていたとき、正午ごろ、突然、天から強い光[a]が私の周りに閃いたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな光」とも訳せる。ギリシア語の表現は、光の規模または強さを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: 私が……ころ、……のことでした
  rationale: 出来事を導入する表現を、証言の流れに合う自然な現代日本語にした。δέの弱い接続は文脈に委ね、原文にない明示的な時間副詞は加えていない。
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: 旅をしてダマスコに近づいたころ
  rationale: 二つの現在分詞が示す進行中の移動と接近を自然に表した。ダマスコはἐγγίζωの与格目的語である。
- source_word: περὶ μεσημβρίαν
  choice: 正午ごろ
  rationale: περίが示すおおよその時刻を簡潔に表した。
- source_word: ἐξαίφνης
  choice: 突然
  rationale: 出来事の唐突さをそのまま伝える標準的な訳語。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 単なる気象上の空に限定せず、啓示的な出来事の源を示しうるοὐρανόςの含みを保った。
- source_word: περιαστράψαι
  choice: 私の周りを照らした
  rationale: 複合動詞が示す、光が周囲を照らす空間的な意味を明確にした。突然性は直前の「突然」で表されている。
- source_word: φῶς ἱκανὸν
  choice: 強い光
  rationale: ἱκανόςがここで示す相当な規模または強度を、自然な日本語で表した。語の幅は脚注に残した。
- source_word: περὶ ἐμέ
  choice: 私の周りを
  rationale: 光が話者を取り囲むように照らしたことを自然な空間表現で示した。
theological_decisions:
- issue: ἐκ τοῦ οὐρανοῦにおけるοὐρανός
  choice: 天から
  alternative: 空から
  rationale: 使徒言行録の用法とパウロの啓示的体験という文脈を踏まえ、単なる大気中の現象に狭めない「天」を採用した。ただし、訳文自体に追加の教理的説明は加えていない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、パウロが公の場で証言している文脈に合う落ち着いた丁寧さを保った。脚注記号は、その対象である「強い光」の直後に置いた。
