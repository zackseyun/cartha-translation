id: ACT.22.4
reference: Acts 22:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: ja
  text: 私はこの道を、死に至るまで迫害し、男も女も縛って牢に引き渡しました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この道」は、使徒言行録でイエスに従う信仰とその人々を指す呼び名として用いられています。「死に至るまで」は、迫害が死に及ぶほど徹底していたことを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: この道
  rationale: ὁδόςの字義的な「道」を保ちつつ、使徒言行録でイエスに従う信仰と共同体を指す呼称として用いられる含みも自然に伝える。日本語では大文字による固有呼称化ができないため、文脈に委ねる。
- source_word: ἐδίωξα
  choice: 迫害し
  rationale: ここでは中立的な「追う」ではなく、信徒に対する敵対的な追及を表すため。
- source_word: ἄχρι θανάτου
  choice: 死に至るまで
  rationale: 迫害が死に及ぶほど徹底していたことを表しつつ、パウロ自身が全員を殺したとまでは断定しない。
- source_word: δεσμεύων
  choice: 縛って
  rationale: 逮捕という制度的な言い換えよりも、原語の具体的な身体拘束の像を保つ。
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: 牢に引き渡しました
  rationale: 拘束した人々を収監のために引き渡した動きを、自然な現代日本語で表す。φυλακάςは複数形だが、日本語では総称的な「牢」が自然であり、複数の施設を明示する必要はない。
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: 男も女も
  rationale: 迫害が性別を問わず及んだという原文の強調を簡潔に保持する。
theological_decisions:
- issue: ἡ ὁδόςを普通名詞として訳すか、キリスト教運動の呼称として明示するか
  choice: 「この道」と訳し、説明的な言い換えを本文に加えない
  alternative: 「この信仰の道」「この運動」
  rationale: 使徒言行録ではキリストに従う信仰・共同体の呼称として機能するが、原語自体の比喩と簡潔さを保つ。日本語には英語の大文字表記に相当する自然な標識がないため、固有呼称性を過度に補わない。
- issue: ἄχρι θανάτουが迫害の目的、結果、程度のどれを表すか
  choice: 「死に至るまで」とし、範囲・程度の含みを保持する
  alternative: 「殺そうとして」「死刑に追いやり」
  rationale: 原文は迫害の致命的な極限を示すが、目的や個々の結果を一義的に限定しないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「収監する」のような硬い行政語を避け、原文の具体性を生かして「縛って牢に引き渡す」とした。
