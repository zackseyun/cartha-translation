  source_fidelity: 原文の構文と語義は概ね適切に反映されている。ἀπέστησαν ἀπ’ αὐτοῦは「彼から離れた」、μέλλοντες...ἀνετάζεινは「取り調べようとしていた者たち」、Ῥωμαῖοςは法的身分を明示する「ローマ市民」とするのが文脈に即している。完了形のδεδεκώςは、千人隊長がすでにパウロを縛ったという先行行為を示すため、「縛っていたこと」がより直接的である。
  naturalness: 全体として明瞭な現代標準日本語である。ただし「恐ろしくなった」はこの文脈ではやや口語的で、責任ある軍司令官の反応には「恐れを抱いた」が自然である。また「しかも」は原文の二つのὅτι節を、単なる並列以上に強調・累加するため、用いない方がよい。
  terminology: 「千人隊長」は日本語聖書で定着したχίλιαρχοςの訳語であり、脚注の補足も適切である。「ローマ市民」「取り調べ」も文脈に合う。脚注aは直前の節に基づく手段の明示として有益であり、本文の意味を過度に限定していない。
