  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: ja
  text: そこで、彼を取り調べようとしていた者たちは、すぐに彼から離れた。[a] 千人隊長[b]も、彼がローマ市民であること、また自分が彼を縛っていたことを知ると、恐れを抱いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでは、より具体的には「むちで打って取り調べようとしていた者たち」。ギリシア語は公的な取り調べを表し、その手段がむち打ちであったことは直前の節から分かる。
    reason: lexical_alternative
  - marker: b
    text: ローマ軍の指揮官の称号。字義的には「千人隊長」だが、実際に指揮した兵員数は一定ではなかった。
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: そこで……すぐに
  rationale: οὖνが直前の発言を受けた結果・展開を示すことを「そこで」で表し、εὐθέωςの即時性を「すぐに」で自然に伝える。
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: 彼から離れた
  rationale: 彼に対する取り調べを中止し、その場から退いたことを簡潔で自然な日本語にする。
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: 彼を取り調べようとしていた者たち
  rationale: μέλλωの目前の意図を「ようとしていた」で表し、ἀνετάζωは公的な尋問・取り調べを指すため「取り調べる」とした。直前の文脈が示すむち打ちという手段は脚注で明示する。
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍のtribunus militumに相当する役職について、日本語聖書・歴史用語として通用し、語の構成も反映する名称を採用した。
- source_word: ἐφοβήθη
  choice: 恐ろしくなった
  rationale: 事実を知った時点で恐れが生じたというアオリストの反応を、自然な日本語で表す。
- source_word: ἐπιγνοὺς
  choice: 知って
  rationale: 新たに事実を認識したことを表す分詞を、主動詞の原因にも時にも読める簡潔な接続で訳す。
- source_word: Ῥωμαῖός ἐστιν
  choice: 彼がローマ市民であること
  rationale: ここで問題となるのは民族ではなく法的身分なので「ローマ人」ではなく「ローマ市民」とし、間接内容の中でも原文の現在形に対応する「である」を用いる。
- source_word: αὐτὸν ἦν δεδεκώς
  choice: 自分が彼を縛ってしまったこと
  rationale: 完了分詞が示す、縛った行為とその結果が残る状態を「縛ってしまった」で表す。「自分が」は主語が千人隊長であることを日本語で明瞭にする。
theological_decisions:
- issue: ローマ市民を縛ったことと千人隊長の恐れの関係
  choice: 原文どおり、彼がローマ市民であることと、自分が彼を縛ったことの二点を並記する。
  alternative: 縛ること自体が違法だったと本文中で説明する。
  rationale: 本文は千人隊長の恐れの法的背景を明示的には説明していないため、解釈的な法的断定を加えず、物語上の緊張を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての品位を保った。「しかも」によって、ローマ市民だと判明したことに加え、すでに縛っていた事実が恐れを強めたという καὶ ὅτι の流れを自然に示した。
