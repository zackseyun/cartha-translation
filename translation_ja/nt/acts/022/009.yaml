source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: ja
  text: 私と一緒にいた人たちは、光は見たが、私に話しかけていた人の声は聞かなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「声を理解しなかった」の意とも取れる。使徒9:7では、同行者たちは音または声を聞いたと記されている。音は聞こえても、語り手の言葉は理解できなかったという違いである可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: 私と一緒にいた人たちは
  rationale: 冠詞付き分詞構文を自然な現代日本語で表し、原文に明示されていない「男たち」は補わない。δέの対比的な働きは後続の「が」で示す。
- source_word: τὸ μὲν φῶς
  choice: 光は
  rationale: φῶςを直接「光」と訳す。μένと後続のδέによる対比を係助詞「は」と接続助詞「が」で表し、本文にない「まばゆい」は加えない。
- source_word: ἐθεάσαντο
  choice: 見た
  rationale: θεάομαιの知覚の意味を、意図的に見つめたことまで含意しない自然な語で表す。
- source_word: τὴν δὲ φωνὴν
  choice: 声は
  rationale: φωνήには「音」の意味もあるが、ここでは「私に語りかけていた方」と限定されるため「声」とする。対比は「は」で保つ。
- source_word: οὐκ ἤκουσαν
  choice: 聞かなかった
  rationale: ἀκούωの基本的な意味を本文に採用する。「理解しなかった」という可能性は、使徒9:7との緊張関係とともに脚注に残す。
- source_word: τοῦ λαλοῦντός μοι
  choice: 私に語りかけていた方の
  rationale: μοιを「私に」、現在分詞λαλοῦντοςの進行的な側面を物語上の過去に合わせて「語りかけていた」と表す。属格は「方の声」という自然な連体関係で示す。
theological_decisions:
- issue: 同行者が声を聞いたかどうかについての使徒9:7との見かけ上の緊張
  choice: 本文では「声は聞かなかった」と訳す。
  alternative: 「声を理解しなかった」または「話の内容を聞き取れなかった」
  rationale: この節の表面的で最も直接的な意味を保ち、並行記事との緊張を本文で解消しない。一方、ἀκούωが文脈によって理解を含み得ること、またφωνήが「声／音」の幅を持つことを脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「おられた」のような敬語を原文以上に加えず、「方」によって人物を指す自然さと敬意を保った。μέν…δέの明確な対比は「光は見たが、…声は聞かなかった」で再現した。
