id: ACT.22.12
reference: Acts 22:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: ja
  text: 律法に従う敬虔な人で、そこに住むすべてのユダヤ人[a]から評判のよかった、アナニアという人が一人、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方出身者」とも訳せる。ここでは、そこに住むユダヤ人共同体を指すと考えられる。
    reason: Ἰουδαῖοςには、民族的・宗教的な「ユダヤ人」と、地理的出身を指す「ユダヤ地方出身者」の両方の用法があり得るため。
lexical_decisions:
- source_word: Ἁνανίας
  choice: アナニア
  rationale: 新約聖書の人名として定着した日本語音写を用いた。
- source_word: δέ
  choice: （訳語を明示しない）
  rationale: ここでは穏やかな談話上の移行を示す。日本語では前後の文脈と語順によって十分に表せるため、「さて」などを加えず自然につないだ。
- source_word: τις ἀνὴρ
  choice: …という人
  rationale: 特定の男性を初めて紹介する表現。「ある人、アナニア」より自然な現代日本語として、固有名と結び付けて表した。
- source_word: εὐλαβὴς κατὰ τὸν νόμον
  choice: 律法に従って敬虔に生き
  rationale: εὐλαβήςの敬虔さが律法との関係で規定されていることを保ちつつ、日本語で人物の生活態度として自然に伝えた。
- source_word: μαρτυρούμενος
  choice: 評判のよかった
  rationale: 周囲の人々から好意的な証言を受けていたことを、明瞭で自然な日本語にした。
- source_word: ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων
  choice: そこに住むすべてのユダヤ人から
  rationale: κατοικούντωνの居住の意味とπάντωνの包括性を保った。「そこ」は文脈上のダマスコを指す。
theological_decisions:
- issue: Ἰουδαίωνの訳し方
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: ここではダマスコに居住する共同体が問題となっており、地理的出身よりも民族的・宗教的共同体としての意味が前面に出ている。ただし語そのものが持ち得る地理的用法は脚注で示した。
- issue: 節末の統語的継続
  choice: 読点で次節へつなぐ
  alternative: 「アナニアという人がいました」と文を完結させる
  rationale: ギリシャ語では本節が次節の定動詞へ続く名詞句であるため、存在文を補わず、原文の継続構造を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「敬虔」は宗教的文脈で広く理解される語として保持した。本節が次節へ続く原文の構造を読点で示している。
