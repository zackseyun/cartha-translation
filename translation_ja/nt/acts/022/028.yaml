source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: ja
  text: しかし、千人隊長は答えた。「私は多額の金を払って、この市民権を得たのだ。」しかし、パウロは言った。「私は生まれながらにして、この市民権を持っている。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「しかし私は、生まれたのです」。市民権を持つ者として生まれたことは、文脈から補っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍でおよそ千人を指揮する高級将校を指す歴史的な称号として、日本語聖書で定着し、簡潔でもある。
- source_word: πολλοῦ κεφαλαίου
  choice: 多額の金を払って
  rationale: 多額の金銭的負担によって、という慣用的な意味を自然な現代日本語で表す。属格の手段・代価の含みを明示するが、具体的な取得経路までは限定しない。
- source_word: τὴν πολιτείαν ταύτην
  choice: この市民権
  rationale: 文脈上、政治生活一般ではなくローマの法的な市民身分を指す。指示語 ταύτην も「この」によって保持する。
- source_word: ἐκτησάμην
  choice: 得た
  rationale: 自分のものとして取得したことを表す中動態を、自然で過度に限定しない「得た」で訳す。「買った」では動詞自体の意味を狭めすぎる。
- source_word: καὶ γεγέννημαι
  choice: 生まれながらにその市民権を持っています
  rationale: 完了形が示す出生に由来する現在の身分を自然に表し、文脈上省略された市民権を補った。καί の強調と対比は「生まれながらに」で伝える。
- source_word: δέ
  choice: しかし／すると
  rationale: 最初の δέ は直前との対照を「しかし」で、パウロの発言を導く δέ は会話の自然な進行を「すると」で表した。
- source_word: ἔφη
  choice: 言った
  rationale: 付加的な修辞的強さを持ち込まず、一般的な発話動詞として訳す。
theological_decisions:
- issue: パウロの市民権が出生時からのものだったことの表現
  choice: 「生まれながらにその市民権を持っています」とし、現在も保持する法的身分を明示した
  alternative: 直訳的に「私は生まれたのです」として目的語を省略する
  rationale: ギリシア語では市民権が文脈から補われるが、日本語でそのまま省略すると意味が不明瞭になる。市民権の由来について本文以上の歴史的推測は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。軍職名は歴史的な正確さと日本語読者への定着を考慮して「千人隊長」とした。パウロの返答は、購入による取得との簡潔な対比が伝わるよう自然な日本語に整えた。
