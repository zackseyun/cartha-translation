  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: ja
  text: 主は私に言われた。「行きなさい。わたしがあなたを遠く異邦人たちのもとへ遣わすからだ。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「遠く諸国民のもとへ」とも訳せる。
    reason: ἔθνη は「異邦人たち」と「諸国民」のいずれも意味し得る。また μακρὰν と εἰς ἔθνη の関係を反映した別訳を示す。
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: 私に言われた
  rationale: πρός＋対格を伴う λέγω が、相手に向けた直接話法を導入している。話者は文脈上、主であるため、日本語では敬意を表す「言われた」とした。
- source_word: Πορεύου
  choice: 行きなさい
  rationale: πορεύομαι の現在中動態命令形で、ここでは出発・移動を命じる自然な表現。「行きなさい」が明快で現代的である。
- source_word: ὅτι
  choice: からだ
  rationale: 命令の理由を導く因果的用法。引用文の中で自然な日本語となるよう「〜からだ」とした。
- source_word: ἐγὼ
  choice: わたしが
  rationale: ギリシア語では明示された代名詞に強調がある。日本語でも主格助詞「が」を用いて、遣わす主体を示した。
- source_word: εἰς ἔθνη
  choice: 異邦人たちのもとへ
  rationale: 使徒言行録の宣教文脈では、ἔθνη は地政学的な諸国民というより、ユダヤ人以外の人々を指す。「異邦人たち」で歴史的・神学的対比を保ち、「のもとへ」で自然な行き先を表した。
- source_word: μακρὰν
  choice: 遠く
  rationale: 遣わされる距離の遠さを表す副詞として、簡潔で自然な「遠く」とした。
- source_word: ἐξαποστελῶ
  choice: 遣わす
  rationale: ἐξαποστέλλω の未来形。使命を帯びて送り出す文脈に合う、格調を保った標準的な「遣わす」を採用した。日本語では意志・未来が文脈から明らかである。
- source_word: σε
  choice: あなたを
  rationale: 遣わされる対象を示す二人称単数対格をそのまま明示した。
theological_decisions:
- issue: 使徒的宣教の文脈における ἔθνη の訳
  choice: 異邦人たち
  alternative: 諸国民
  rationale: ここではパウロがユダヤ人以外の人々へ遣わされることが焦点であり、「異邦人たち」が文脈上の区別を明確に伝える。一方、「諸国民」も語義上可能なので脚注に残した。
- issue: 発話者の明示
  choice: 主
  alternative: 彼
  rationale: ギリシア語本文の主語は直前文脈から補われるが、使徒22:18の「主」が継続する。日本語で「彼」とすると指示対象が不自然かつ曖昧になるため、文脈上の指示対象を「主」と明示した。
translation_notes:
  register: 明快な現代標準語を用いながら、神の発話にふさわしい簡潔で dignified な調子を保った。「わたし」は引用中の主の一人称として平仮名表記とし、「遣わす」は宣教委任の含意を過度に説明せず自然に伝える。脚注記号 [a] は本文に明示した。
