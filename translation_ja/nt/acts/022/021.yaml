  naturalness: 本文は明快な現代標準語として自然であり、「主は私に言われた」「行きなさい」「〜からだ」の調子も文脈に適している。「すると」を省けば、前後関係を不必要に限定せず、さらに自然で簡潔になる。
  terminology: 「主」は直前の文脈で明らかな発話者を自然に示し、「異邦人たち」はこの使徒言行録の宣教文脈におけるἔθνηの適切な訳語である。「遣わす」もἐξαποστέλλωにふさわしい。脚注の「諸国民」は有効な語彙的代案である。
