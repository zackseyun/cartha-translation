  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: ja
  text: また、あなたの証人ステファノの血が流されていたとき[a]、私自身もそばに立って、彼を殺すことに賛同し、彼を殺す者たちの上着を預かっていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証人」は「殉教者」とも訳せる。ギリシア語は証言する者を意味し、キリスト教では後に、その証言のために死ぬ者を特に指すようになった。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: 流されていた
  rationale: 未完了過去の受動態が表す進行中の出来事を自然な日本語で示す。「注ぎ出されていた」も可能だが、血については「流される」が明瞭であり、受動の比喩も保つ。
- source_word: αἷμα
  choice: 血
  rationale: 文脈に即した直接的で標準的な訳。
- source_word: μάρτυρός
  choice: 証人
  rationale: 基本的な語義を優先する。死をもって証言した者という後代の「殉教者」の意味合いは文脈上重要なため、脚注に示す。
- source_word: ἐφεστὼς
  choice: そばに立って
  rationale: その場に居合わせ、近くに立っていたことを具体的かつ自然に表す。
- source_word: συνευδοκῶν
  choice: それに賛同し
  rationale: 単なる同席ではなく、殺害を是認していたという積極的な同意を示す。目的語は文脈からステファノの殺害を指すため「それに」と補った。
- source_word: φυλάσσων
  choice: 見張っていました
  rationale: 衣服を預かって守る行為を自然に表す。「守っていました」より場面に即している。
- source_word: ἱμάτια
  choice: 上着
  rationale: 石打ちの際に脱いだ外衣を指すと考えられ、一般読者に分かりやすい具体的な訳。
- source_word: ἀναιρούντων
  choice: 殺す
  rationale: ここでは人を死に至らせる意味。「処刑する」は公的・法的含意を加え、「殺害する」はやや名詞的で硬いため、簡明な「殺す」とした。
- source_word: αὐτὸς
  choice: 私自身も
  rationale: 主語の強調を「自身」で保ち、καίの付加的な意味を「も」で示す。
theological_decisions:
- issue: ステファノを指す μάρτυς の訳
  choice: 証人
  alternative: 殉教者
  rationale: 当時の基本的な語義である「証人」を本文に置き、後代に定着した「殉教者」というキリスト教的用法を本文へ遡及的に固定しない。ただし、ここでは証言ゆえの死が語られるため、その含意を脚注で保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの告白の厳粛さを保った。「私自身も」「賛同し」により、原文の自己関与と責任の強調を再現した。
