  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: ja
  text: あなたは、あなたが見たこと、聞いたことについて、すべての人に対して、その方の証人となるからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その方のための証人」または「その方についての証人」とも訳せます。ギリシア語の与格は、ここではその方のために証言することと、その方に関して証言することの両方に近い意味合いを持ちます。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の命令・委任を説明する接続辞として、理由・説明の働きを自然な現代日本語で表した。
- source_word: ἔσῃ μάρτυς
  choice: 証人となる
  rationale: 未来形を「となる」で示し、μάρτυςの証言者としての意味を簡潔かつ格調を保って訳した。
- source_word: αὐτῷ
  choice: この方の
  rationale: 文脈上、主イエスを指す。「この方の」は、イエスについて、またイエスのために証言するという近接した含意を日本語で過度に限定せず保持できる。
- source_word: πρὸς πάντας ἀνθρώπους
  choice: すべての人に対して
  rationale: πρόςの方向・対象を「に対して」で表し、πάντας ἀνθρώπουςを性別を限定しない自然な日本語にした。
- source_word: ὧν ἑώρακας καὶ ἤκουσας
  choice: 自分が見たこと、聞いたことについて
  rationale: 属格関係を証言の内容として自然に表した。ギリシア語の完了形とアオリストの違いは、日本語で不自然に時制を作り分けず、実体験に基づく証言という意味を保った。
theological_decisions:
- issue: αὐτῷが示す証言の関係
  choice: 「この方の証人」とし、主イエスに属し、そのために、またその方について証言する含みを保持する
  alternative: 「この方のための証人」または「この方に対する証人」
  rationale: 与格はここで、証人が誰のためのものか、誰に関わるものかという近接した複数の理解を許す。「この方の証人」は日本語として自然で、いずれか一つに狭く固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「この方」で指示対象への敬意と文脈上の明確さを保った。「すべての人」は原文の男性複数形が人間一般を指すことを自然に表すため、性別に関する注は不要と判断した。
