id: ACT.22.3
reference: Acts 22:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: ja
  text: 「私はユダヤ人です。キリキアのタルソで生まれましたが、この町で育ち、ガマリエルの足もとで[a]、父祖伝来の律法を厳格に守るよう教育を受けました。今日の皆さんと同じように、神に熱心でした。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「足もとで」は、教師のもとで弟子として教えを受けることを表す言い方。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: ユダヤ人
  rationale: ἀνήρは成人男性を示すが、日本語の「ユダヤ人の男」は不自然であり、話者が男性であることも文脈上明白なため、自然な「ユダヤ人」とした。
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: キリキアのタルソで生まれました
  rationale: 出生地と属州名の関係を簡潔かつ自然に表した。
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: しかし、この都で育ち
  rationale: 出生地との対比を「しかし」で示し、ἀνατρέφωを養育・成長の意味で訳した。
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: ガマリエルの足もとで
  rationale: 教師のもとで弟子として学ぶという歴史的な比喩表現を本文に保持し、脚注で意味を補った。
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: 厳密に従って教育を受けました
  rationale: 教育・訓練を表すπεπαιδευμένοςと、正確さ・厳格さを表すἀκρίβειαの双方を、現代日本語として明瞭に表した。
- source_word: τοῦ πατρῴου νόμου
  choice: 先祖伝来の律法
  rationale: πατρῷοςの先祖から受け継いだものという意味を自然に示す。ギリシア語自体には一人称複数の所有表現がないため、「私たちの」は補わなかった。
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: 神に対して熱心な者でした
  rationale: 神への強い熱意を表しつつ、「熱心党員」という政治的・党派的意味を持ち込まない表現とした。
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: 今日の皆さんと同じように
  rationale: 聴衆全員の現在の熱意と自分を重ねるパウロの修辞を自然な日本語で保った。
theological_decisions:
- issue: πατρῴου νόμουに話者と聴衆の共有財産という意味を明示的に加えるか
  choice: 先祖伝来の律法
  alternative: 私たちの父祖の律法
  rationale: 共有されたユダヤ的背景は文脈から伝わるが、原文に「私たちの」に相当する語はない。そこで連帯感を失わず、所有主体を過度に明示しない訳を選んだ。
- issue: ζηλωτήςを党派名のように訳すか
  choice: 神に対して熱心な者
  alternative: 神のための熱心党員
  rationale: ここでは神への熱意を述べており、特定の政治集団への所属を断定する根拠はないため、一般的な意味を保持した。
- issue: ガマリエルとの師弟関係を比喩のまま示すか
  choice: ガマリエルの足もとで
  alternative: ガマリエルのもとで
  rationale: 原文の具体的な教育場面のイメージを残し、その慣用的意味は脚注で明らかにした。
translation_notes:
  register: 演説としての丁寧さを保ちながら、一般の読者に分かりやすい現代標準日本語とした。「都」は直前の文脈で指されるエルサレムを表す。長いギリシア語の一文は、日本語で意味関係を明瞭にするため二文に分けた。
