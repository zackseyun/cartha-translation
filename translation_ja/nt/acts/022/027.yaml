source:
  edition: SBLGNT
  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: ja
  text: そこで千人隊長が近寄ってパウロに言った。「教えてくれ。あなたはローマ市民なのか。」パウロは「そうです」と答えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: 近寄って
  rationale: 千人隊長がパウロのもとへ移動してから話しかけたことを、自然な日本語で表す。
- source_word: δὲ
  choice: そこで
  rationale: 強い対比ではなく、直前の出来事を受けた物語の進行を示すため。後半のδέは日本語の文の流れに含め、独立した接続語にはしない。
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍のコホルスを指揮する将校を表す語で、使徒言行録の歴史的文脈を保ちつつ、日本語聖書で定着した簡潔な訳語を採用する。
- source_word: εἶπεν αὐτῷ
  choice: パウロに言った
  rationale: αὐτῷの指示対象を明示し、日本語で自然に発話の相手を示す。
- source_word: Λέγε μοι
  choice: 教えてくれ
  rationale: 直訳的な「私に言え」より自然であり、命令形による直接的な問いかけの力を保つ。
- source_word: σὺ
  choice: あなたは
  rationale: 明示された代名詞の強調を、日本語では主題を明示することで無理なく表す。
- source_word: Ῥωμαῖος
  choice: ローマ市民
  rationale: 形容詞の名詞的用法であり、この文脈では民族的な「ローマ人」一般ではなく法的な市民身分を指すため、現代日本語で誤解の少ない表現とする。
- source_word: Ναί
  choice: そうです
  rationale: 単純な肯定を、直前の「なのか」という問いに自然に応答する現代日本語で表す。
theological_decisions: []
translation_notes:
  register: 明快で現代的ながら品位ある叙述とした。「千人隊長」は歴史的な役職名として保持し、Ῥωμαῖοςは周辺文脈が示す法的身分を明瞭にするため「ローマ市民」と訳した。
