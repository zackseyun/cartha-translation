  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: ja
  text: そして私は、その方が私にこう言われるのを見ました。「急いで、すぐにエルサレムから出なさい。彼らは、私についてのあなたの証言を受け入れないからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν αὐτὸν λέγοντά μοι
  choice: 主が私にこう言うのを見ました
  rationale: 不定詞と分詞から成る構文を、直前から続く幻の報告として自然な日本語にした。αὐτόνの指示対象は文脈上「主」だが、日本語で単に「彼」とすると不自然で指示が曖昧になりすぎるため、文脈上明白な指示対象を補った。
- source_word: Σπεῦσον καὶ ἔξελθε ἐν τάχει
  choice: 急いで、すぐに……出なさい
  rationale: Σπεῦσονとἐν τάχειが重ねて表す切迫感を、冗長にならない現代日本語で保持した。
- source_word: ἐξ Ἰερουσαλήμ
  choice: エルサレムから出なさい
  rationale: ἐξが示す都市の内から外への移動を明示した。
- source_word: οὐ παραδέξονταί
  choice: 受け入れない
  rationale: παραδέχομαιはここで証言を好意的に受容する意。日本語では「受け入れる」が目的語「証言」と自然に結びつく。
- source_word: σου μαρτυρίαν περὶ ἐμοῦ
  choice: 私についてのあなたの証言
  rationale: μαρτυρίαの証言・証しという意味のうち、受容の対象となる宣言的内容を明確に表す「証言」を選んだ。περὶ ἐμοῦは自然に「私についての」とした。
theological_decisions:
- issue: 幻の中で語るαὐτόνの指示対象
  choice: 主
  alternative: 彼
  rationale: 原文は代名詞だが、直前の文脈では語り手が主であることが明白である。日本語の「彼」はこの文脈で不自然かつ過度に曖昧になるため、指示対象を「主」と明示した。「イエス」とまでは特定表現を強めない。
- issue: μαρτυρίαの訳語
  choice: 証言
  alternative: 証し
  rationale: 宗教的な定型表現に限定せず、パウロが見聞きしたことを公に述べる法廷的・宣教的含意を保つため「証言」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令の二重の緊迫感を保持しつつ、過度に古風な「速やかに」などは避けた。
