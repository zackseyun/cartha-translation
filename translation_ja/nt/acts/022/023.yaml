- source_word: βαλλόντων
  choice: まき散らして
  rationale: ちりを空中へ激しく投げ上げる群衆の動作を自然に表し、直前の「投げ」との不自然な反復も避けた。
- source_word: εἰς τὸν ἀέρα
  choice: 空中に
  rationale: 方向を示す前置詞句を正確かつ自然に訳し、「空」よりもἀήρに近い表現とした。
