source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: ja
  text: 千人隊長は、パウロを兵営[a]の中へ連れて行くよう命じた。そして、人々がなぜあのようにパウロに対して叫び続けていたのかを突き止めるため、鞭で彼を取り調べるようにと命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陣営」または「要塞」とも訳せる。ここでは、エルサレムにあったローマ軍の駐屯施設を指す。
    reason: cultural_note
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍の高級将校を指す、使徒言行録で定着した歴史的名称。単に「指揮官」とするより役職を明確に示す。
- source_word: παρεμβολή
  choice: 兵営
  rationale: 基本義は「陣営」だが、ここではエルサレムにあるローマ軍の駐屯施設を指すため、現代日本語では「兵営」が自然である。
- source_word: εἰσάγεσθαι
  choice: 中へ連れて行く
  rationale: 受動不定詞の意味を、日本語の命令表現の中で自然に示し、外から軍施設内へ移すことも明確にした。
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: 鞭打って取り調べる
  rationale: ἀνετάζωの取り調べ・尋問という意味と、複数与格μάστιξινが示す手段である鞭打ちの両方を、簡潔で明瞭な日本語にした。
- source_word: ἐπιγνῷ
  choice: 突き止める
  rationale: 目的節における、事情を調査して確かめようとする意味を自然に表す。
- source_word: δι’ ἣν αἰτίαν
  choice: なぜ
  rationale: 原因・理由を問う句を明瞭な現代日本語にした。「罪状」とすると、原文に明示されない法的意味を加えるおそれがある。
- source_word: οὕτως
  choice: あのように
  rationale: 群衆の叫び方を指し示す副詞の働きを保ち、文脈上の強い騒ぎも自然に伝える。
- source_word: ἐπεφώνουν αὐτῷ
  choice: パウロに向かって叫び立てていた
  rationale: 未完了過去が表す継続的な叫びと、文脈上の敵対的な激しさを示す。「パウロ」は日本語で指示対象を明確にするため代名詞を固有名詞で受けた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語を用いた。ギリシア語の長い一文は、命令とその具体的内容を読み取りやすくするため二文に分けた。鞭打ちが単なる刑罰ではなく尋問の手段である点を本文と脚注の双方で保持した。
