  terminology: 「千人隊長」「兵営」はこの箇所のローマ軍事的文脈にふさわしい。「パウロに対して叫び続けていた」は、αὐτῷの敵対的な向きと未完了形の継続性を無理なく示す。脚注の用語とアンカーは本文に対応している。
