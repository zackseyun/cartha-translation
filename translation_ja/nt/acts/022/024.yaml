- from: 千人隊長は、パウロを兵営[a]の中へ連れて行くよう命じた。そして、なぜ人々があのようにパウロに向かって叫び立てていたのかを突き止めるため、鞭打って取り調べる[b]ようにと言った。
  to: 千人隊長は、パウロを兵営[a]の中へ連れて行くよう命じた。そして、人々がなぜあのようにパウロに対して叫び続けていたのかを突き止めるため、鞭で彼を取り調べるようにと命じた。
