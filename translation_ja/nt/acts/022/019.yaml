  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: ja
  text: 私は言いました。『主よ、私が会堂から会堂へと、あなたを信じる人々を投獄し、打ちたたいていたことは、彼ら自身が知っています。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: そこで私は言いました
  rationale: καὶ ἐγώの軽い強調を「私は」で保ち、物語の流れを示すκαίは自然な日本語として「そこで」とした。εἶπονは単純に「言いました」と訳した。
- source_word: Κύριε
  choice: 主よ
  rationale: 復活したイエスへの呼びかけであり、κύριοςの敬意とキリスト論的含意を過不足なく保つ。
- source_word: αὐτοὶ ἐπίστανται
  choice: 彼ら自身が知っています
  rationale: αὐτοίの明示的な強調を「自身」で表し、ἐπίστανταιは明瞭な「知っています」とした。
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: 投獄し、打ちたたいていた
  rationale: 迂言的未完了過去が示す継続的・反復的な過去の行為を「していた」で表現した。δέρωは司法的なむち打ちに限定せず、身体的暴行を示す「打ちたたく」とした。
- source_word: κατὰ τὰς συναγωγὰς
  choice: 会堂から会堂へと
  rationale: κατά＋複数対格の配分的用法を、複数の会堂にまたがる反復行為として自然かつ明確に表した。
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: あなたを信じる人々
  rationale: ἐπί＋対格が示す、イエスへ向けられた信頼・信仰を、現代日本語で自然な「あなたを信じる」とした。
theological_decisions:
- issue: イエスへの呼称κύριος
  choice: 主よ
  alternative: 先生よ／主人よ
  rationale: 文脈上、パウロが幻の中で復活したイエスに呼びかけている。「主」は敬意と本文のキリスト論的重みを保つが、それ以上の教義的説明は加えない。
- issue: πιστεύοντας ἐπὶ σέが表す信仰
  choice: あなたを信じる人々
  alternative: あなたに信頼する人々／あなたに信仰を置く人々
  rationale: 「信じる」は信仰と信頼の双方を含み得る自然な表現で、原文の意味を不必要に限定しない。
- issue: 迫害行為の時制・相
  choice: 投獄し、打ちたたいていた
  alternative: 投獄し、打ちたたくのが常でした
  rationale: 原文の継続的・習慣的な過去を「ていた」で保持し、習慣性だけに限定する明示的な補足は避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの弁明にふさわしい丁寧で格調ある語調とした。「会堂から会堂へと」によって配分的意味を本文内で明示できるため、脚注は不要と判断した。
