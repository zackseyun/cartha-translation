source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: ja
  text: このことについては、大祭司も長老会全体も証言できます。私は彼らからダマスコの兄弟たちへの手紙を受け取り、そこにいる者たちをも縛った者たちとしてエルサレムへ連行し、処罰を受けさせようとして、ダマスコへ向かっていました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς καὶ
  choice: このことは、…も
  rationale: 直前の主張に対する裏づけを導入する確認的な働きを、自然な日本語で示す。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 当時のユダヤ教における祭司長の単数の称号として定着した訳語。
- source_word: μαρτυρεῖ μοι
  choice: 私のために証言できます
  rationale: 現在形による証言可能な裏づけを表し、与格 μοι の支持的な含みも保つ。
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: 長老会全体
  rationale: 個々の老人ではなく長老から成る合議体を指すため、簡潔で明瞭な制度的表現とした。
- source_word: παρ’ ὧν
  choice: 彼らから
  rationale: 大祭司と長老会を集合的に受ける自然な日本語。
- source_word: ἐπιστολάς
  choice: 手紙
  rationale: 基本的な語義を保ち、公的な権限を伴うことは文脈に委ねる。
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: ダマスコの兄弟たちへの
  rationale: πρός の宛先を明示し、男性複数形 ἀδελφούς をそのまま『兄弟たち』とした。ここではダマスコ側の同胞または協力者を指すと考えられる。
- source_word: ἐπορευόμην
  choice: ダマスコへ向かっていた
  rationale: 未完了過去が表す進行中の移動を自然に表現する。
- source_word: ἄξων
  choice: 連行し…ようと
  rationale: 移動動詞に伴う未来分詞の目的用法を示し、拘束者をエルサレムへ連れて行く強制性を文脈に即して表す。
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: そこにいる者たち
  rationale: ダマスコにいる対象者を指す実体詞的な分詞句を明瞭に訳す。
- source_word: δεδεμένους
  choice: 縛って
  rationale: 完了受動分詞が示す拘束状態を、連行という動作との自然なつながりの中で表す。鎖という具体物までは補わない。
- source_word: ἵνα τιμωρηθῶσιν
  choice: 処罰を受けさせようと
  rationale: 目的を示す ἵνα と受動態を保ち、具体的な刑罰内容は限定しない。
theological_decisions:
- issue: ἀδελφοί がより広い共同体を指し得る文脈での訳し方
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／同胞たち
  rationale: 原文の男性複数形を本文では『兄弟たち』とし、特定の集団理解を訳文に過度に持ち込まない。この節では大祭司らから手紙を受け取る宛先なので、信者共同体ではなく同胞または会堂関係者である可能性が高く、『兄弟姉妹』という補足はかえって誤解を招き得る。
translation_notes:
  register: 明瞭な現代標準語を用いながら、法的・公的場面にふさわしい端正さを保った。目的を表す要素が連続するため、『縛って…連行し、処罰を受けさせようと』とまとめ、日本語としての流れを整えた。
