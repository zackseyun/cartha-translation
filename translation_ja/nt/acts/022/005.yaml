revisions:
- from: このことは、大祭司も長老会全体も、私のために証言できます。私は彼らからダマスコの兄弟たちへの手紙を受け取り、そこにいる者たちをも縛ってエルサレムへ連行し、処罰を受けさせようと、ダマスコへ向かっていたのです。
  to: このことについては、大祭司も長老会全体も証言できます。私は彼らからダマスコの兄弟たちへの手紙を受け取り、そこにいる者たちをも縛った者たちとしてエルサレムへ連行し、処罰を受けさせようとして、ダマスコへ向かっていました。
  rationale: 拘束の完了状態を自然な日本語で示すため「縛った者たちとして」とし、καίの累加的な要素を「者たちをも」で反映した。「このことについては」として、証言がパウロの直前の発言を裏づけることを明瞭にした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:41Z'
review_pass:
  verdict: revise
  source_fidelity: 「縛って」は、δεδεμένους（完了受動分詞）が表す、すでに拘束された状態を、パウロがその場で行う動作のように読ませ得ます。「縛った者たちを」として拘束状態を明示するほうが原文に忠実です。また、ἄξων に続く καί は「者たちをも」で保持するのがよいです。
  naturalness: 全体として明瞭で公的な場面に合う日本語です。ただし「私のために証言できます」はやや直訳調で、μαρτυρεῖ μοι がここで担う、直前の発言を裏づける証言という意味は「このことについて証言できます」のほうが自然です。
  terminology: 「大祭司」「長老会全体」「ダマスコ」「エルサレム」「処罰」は適切です。「兄弟たち」はἀδελφούςを過度に解釈せず保っています。この箇所の宛先をキリスト者共同体や男女を含む集団と本文で特定する必要はありません。
  issues:
  - severity: medium
    issue: δεδεμένους の状態性が「縛って」で十分に表れていない
    rationale: δεδεμένουςは完了受動分詞であり、対象者が拘束された状態にあることを示す。「縛った者たちを」とすれば、原文が鎖などの具体的手段を指定していない点も保てる。
  - severity: low
    issue: ἄξων に伴う καί の反映が弱い
    rationale: 「そこにいる者たちをも」として「also」の要素を保つのがよい。
  - severity: low
    issue: 「私のために証言できます」がやや不自然
    rationale: この文脈では、大祭司と長老会がパウロの直前の主張の証人となることを述べる。「このことについて証言できます」が明瞭である。
  revised_text: このことについては、大祭司も長老会全体も証言できます。私は彼らからダマスコの兄弟たちへの手紙を受け取り、そこにいる者たちをも縛った者たちとしてエルサレムへ連行し、処罰を受けさせようとして、ダマスコへ向かっていました。
  revised_footnotes: []
