  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: ja
  text: そこで私は答えた。「主よ[a]、あなたはどなたですか。」すると、彼は私に言った。「私は、あなたが迫害しているナザレ人イエス[b]である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主よ」と訳したギリシア語は、「あなたさま」など、相手に敬意を表す呼びかけとしても用いられる。
    reason: alternative_reading
  - marker: b
    text: 別訳「ナザレのイエス」。語形を反映して「ナザレ派のイエス」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: 私は答えた
  rationale: アオリスト形を、直接話法への導入として自然で標準的な日本語にした。
- source_word: Τίς εἶ
  choice: あなたはどなたですか
  rationale: 問いの内容を保ちつつ、未知の相手への敬意を示す自然な現代日本語とした。
- source_word: κύριε
  choice: 主よ
  rationale: κύριος の称号としての意味を本文に残す一方、敬称としての可能性は脚注に示した。
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: すると、その方は私に言った
  rationale: τε の接続的な働きを「すると」で表し、話者がまだ名乗る前であるため代名詞は敬意を伴う「その方」とした。
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: 私は…イエスである
  rationale: 明確な自己同定を簡潔に保持した。
- source_word: ὁ Ναζωραῖος
  choice: ナザレ人
  rationale: 地名との関係を示す呼称を簡潔に表し、ギリシア語の形を比較的よく保つ。別訳は脚注に示した。
- source_word: ὃν σὺ διώκεις
  choice: あなたが迫害している
  rationale: διώκω の敵対的な追及という文脈上の意味と、現在進行中の行為を表す現在形を保持した。
theological_decisions:
- issue: サウロの呼びかけ κύριε の訳
  choice: 主よ
  alternative: あなた様／旦那様に相当する敬称
  rationale: 復活したイエスを指す物語上の響きを保ちながら、この時点のサウロが話者の正体をまだ知らず、単なる敬称として用いた可能性も脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。直接話法は自然な敬体と常体を組み合わせ、原文の自己同定の厳粛さを保った。
