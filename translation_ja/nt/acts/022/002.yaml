  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: ja
  text: 人々は、パウロがヘブライ語[a]で自分たちに語りかけていると聞くと、いっそう静かになった。そして彼は言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アラム語で」の可能性もある。ギリシア語原文は「ヘブライ語で」としているが、この文脈ではユダヤ地方で用いられたセム系の言葉を指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: 聞くと
  rationale: アオリスト分詞の時を表す働きを自然な現代日本語で示す。δὲはここでは強い逆接ではなく場面の展開を示すため、独立した「しかし」は置かない。
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: ヘブライ語で
  rationale: 原文が明示する「ヘブライの言語」を本文に保つ。文脈上アラム語を指す可能性は脚注で示す。
- source_word: προσεφώνει αὐτοῖς
  choice: 自分たちに語りかけている
  rationale: 未完了形による継続中の発話と、聴衆に向けられた言葉であることを自然に表す。αὐτοῖςは群衆側の視点に合わせて「自分たちに」とした。
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: いっそう静かになった
  rationale: 直訳的には「さらに静けさを与えた」だが、沈黙が深まったことを現代日本語の自然な表現で伝える。
- source_word: καὶ φησίν
  choice: そこでパウロは言った
  rationale: 歴史的現在を日本語の物語として自然な過去形にし、主語を補って次の発言への移行を明確にする。接続詞καίは文脈上「そこで」と表した。
theological_decisions:
- issue: 「ヘブライ語」の指示対象
  choice: 本文では「ヘブライ語」を保持する
  alternative: 当時のユダヤ地方のセム系日常語である「アラム語」と訳す
  rationale: Ἑβραΐδι διαλέκτῳという原文の表現を優先しつつ、実際の指示対象がアラム語である可能性を脚注に残して、歴史言語学上の曖昧さを解消しすぎない。
translation_notes:
  register: 明快で自然な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた語調を保った。「演説している」よりも原語の広い意味を保つ「語りかけている」を採用した。
