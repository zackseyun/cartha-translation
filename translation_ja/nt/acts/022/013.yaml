  register: 明瞭で現代的かつ品位ある標準語。語り手の引用内の敬体に合わせて「言いました」「見ました」とし、直接話法は簡潔に保った。脚注標識は、二度用いられる同一動詞の語義をまとめて説明できるよう節末に置いた。
