  text: ἐλθὼν πρὸς ⸀ἐμὲ καὶ ἐπιστὰς εἶπέν μοι· Σαοὺλ ἀδελφέ, ἀνάβλεψον· κἀγὼ αὐτῇ τῇ ὥρᾳ ἀνέβλεψα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: ja
  text: 彼は私のところに来て、そばに立ち、私に言いました。「兄弟サウロ、目が見えるようになりなさい。」そして、まさにその時、私は目が見えるようになり、彼のほうを見ました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見上げました」とも訳せます。ただし、ここでは失明が癒やされる文脈なので、「目が見えるようになった」という意味に取っています。ギリシア語の同じ動詞が、直前の「目が見えるようになりなさい」にも使われています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: 彼は私のところに来て
  rationale: アオリスト分詞の先行動作と、πρός＋対格が示すパウロへの接近を、自然な日本語の叙述で表した。
- source_word: ἐπιστάς
  choice: そばに立ち
  rationale: 近くに来て立つという空間的意味を簡潔に保持した。
- source_word: Σαοὺλ ἀδελφέ
  choice: 兄弟サウロ
  rationale: 呼格による親しい同胞・信仰共同体的な呼びかけを、過度な解釈を加えず直訳的に表した。
- source_word: ἀνάβλεψον
  choice: 目が見えるようになりなさい
  rationale: 語には「見上げる」の意味もあるが、失明と回復の文脈では視力の回復を命じる意味が自然である。
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: まさにその時
  rationale: 出来事が起きた時点を強調する表現。日本語では「その時刻に」より自然で、即時性も伝わる。
- source_word: ἀνέβλεψα
  choice: 目が見えるようになり
  rationale: 同節の命令形と対応させ、視力が回復したことを明確にした。
- source_word: εἰς αὐτόν
  choice: 彼を見ました
  rationale: 回復した視線がアナニアへ向けられたことを自然な日本語で表現した。
- source_word: κἀγώ
  choice: すると、私は
  rationale: καίとἐγώの結合を、前の発言に続く結果として自然に接続した。
