  text: Ἤκουον δὲ αὐτοῦ ἄχρι τούτου τοῦ λόγου καὶ ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες· Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον, οὐ γὰρ καθῆκεν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: ja
  text: 人々はこの言葉までは彼の話を聞いていたが、声を張り上げて言った。「こんな男は地上から取り除け。[a] 生きていてよいはずがない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、彼を殺せ、という要求。直訳的には「このような者を地上から取り去れ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: 聞いていた
  rationale: 未完了過去の継続的な動作を表し、この発言までは聴衆が聞き続けていたことを示す。
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: この言葉までは
  rationale: λόγοςはここでは単独の語ではなく、直前の発言内容ないし発言の一点を指す。「この言葉」は日本語でその両方を自然に含みうる。
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: 声を張り上げて
  rationale: 直訳的な比喩を保ちつつ、大声で叫び始めたことを自然な現代日本語で表す。
- source_word: Αἶρε ἀπὸ τῆς γῆς
  choice: 地上から取り除け
  rationale: 敵意を帯びた命令としてαἴρωを「取り除け」と訳し、ἀπὸ τῆς γῆςの「地上から」を保持する。文脈上は死を要求する表現である。
- source_word: τὸν τοιοῦτον
  choice: こんな男
  rationale: 対象を軽蔑して指す語感を、過度に古風または俗悪にならない自然な表現で伝える。
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: 生きていてよいはずがない
  rationale: καθήκωが表す「ふさわしい、当然である」という規範的判断と、群衆の「生かしてはおけない」という意図を簡潔に表す。単なる許可の否定に狭めない表現とした。
