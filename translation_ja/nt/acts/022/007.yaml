  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: ja
  text: 私は地面に倒れ、私にこう語りかける声を聞いた。『サウロ、サウロ、なぜ私を迫害するのか。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: 私は…倒れ
  rationale: πίπτωのアオリスト能動直説法一人称単数。出来事を簡潔に述べる自然な日本語として「倒れ」とした。
- source_word: τε
  choice: 独立には訳出しない
  rationale: 前節との緩やかな接続を示す小辞であり、日本語では文脈と後続の連用形によって流れが十分に表される。
- source_word: εἰς τὸ ἔδαφος
  choice: 地面に
  rationale: 倒れる到達点を示す表現で、この場面では「地面に」が自然かつ明確である。
- source_word: ἤκουσα φωνῆς
  choice: 声を聞いた
  rationale: ἀκούωに属格目的語が続く構文。発話内容が直後に示されるため、φωνήは「声」と訳すのが適切である。
- source_word: λεγούσης μοι
  choice: 私にこう語りかける
  rationale: φωνῆςを修飾する現在分詞と与格μُοιの関係を保ち、声が本人に向けて語ったことを自然に表す。「こう」は後続する直接話法を受ける。
- source_word: Σαοὺλ Σαούλ
  choice: サウロ、サウロ
  rationale: 人名を一般的な日本語聖書表記で音写し、呼びかけの反復をそのまま保持した。
- source_word: τί
  choice: なぜ
  rationale: 行為の理由を問う用法であり、日本語では「なぜ」が自然である。
- source_word: με
  choice: 私を
  rationale: 話者自身を指す直接目的語を、説明的な言い換えをせずそのまま保持した。
- source_word: διώκεις
  choice: 迫害するのか
  rationale: διώκωの現在能動直説法二人称単数。この文脈では敵対的に苦しめる意味の「迫害する」が適切であり、現在形の継続的な行為は日本語の文脈で伝わる。
theological_decisions:
- issue: 信者たちに対するサウロの行為と、声の話者自身との関係
  choice: 一人称目的語「私を」を説明なしに保持する。
  alternative: 「私の民を」「私に従う者たちを」などと説明的に展開する。
  rationale: 話者が信者への迫害を自分自身への迫害として語ることに、この節の神学的な力と緊張がある。原文の直接的な「私を」を保ち、解釈によって解消しない。
translation_notes:
  register: 明瞭で現代的ながら、直接話法の荘重さを保つ標準的な日本語。「どうして」よりも簡潔で格調のある「なぜ」を用いた。
