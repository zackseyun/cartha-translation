- from: さあ、なぜためらっているのですか。[a] 立ち上がって、バプテスマを受け、御名を呼び求めて、あなたの罪を洗い去りなさい。[b]
  to: では今、なぜためらっているのですか。[a] 立ち上がって、バプテスマを受け、その方の名を呼び求めて、あなたの罪を洗い去りなさい。[b]
  rationale: καὶ νῦν の時間的・談話的な移行を「では今」で明示し、τί μέλλεις の遅延を戒める慣用的意味を保ちました。二つの命令と分詞の構文関係は、本文では「呼び求めて」として開いたままにし、注で可能な理解を示しています。αὐτοῦ は、敬称を補う「御名」ではなく「その方の名」として訳し、本文が固有名・称号を明示していない点を保持しました。
