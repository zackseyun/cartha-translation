id: ACT.22.16
reference: Acts 22:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: ja
  text: では今、なぜためらっているのですか。[a] 立ち上がって、バプテスマを受け、その方の名を呼び求めて、あなたの罪を洗い去りなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜ遅れているのですか」。
    reason: lexical_alternative
  - marker: b
    text: 「その方の名を呼び求めて」は、「その方の名を呼び求めながら」または「その方の名を呼び求めることによって」と理解することもできる。ギリシア語は、バプテスマ、罪を洗い去ること、その方の名を呼び求めることの厳密な関係を一義的には定めていない。
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: なぜためらっているのですか
  rationale: 疑問詞を伴う μέλλω はここでは将来の意図を尋ねるより、遅延を戒める慣用的表現。現代日本語で切迫感を自然に表す。
- source_word: ἀναστὰς
  choice: 立ち上がって
  rationale: アオリスト分詞を後続の命令に伴う動作として訳し、ギリシア語の連続性を保つ。
- source_word: βάπτισαι
  choice: バプテスマを受け
  rationale: アオリスト中動態命令を、日本語で自然な受動的表現にした。教会用語として定着しつつ、洗礼方式を特定しない「バプテスマ」を用いる。
- source_word: ἀπόλουσαι
  choice: 洗い去りなさい
  rationale: 罪を目的語とする ἀπολούομαι の洗浄・除去の比喩を直接保つ。
- source_word: τὰς ἁμαρτίας σου
  choice: あなたの罪
  rationale: ἁμαρτία の通常の意味を解釈的に広げず、そのまま訳す。
- source_word: ἐπικαλεσάμενος
  choice: 御名を呼び求めて
  rationale: 分詞を「て」形で訳し、付帯状況・手段・時間のいずれかに限定しすぎないようにした。ἐπικαλέομαι の祈願的な含意は「呼び求める」で表した。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 御名
  rationale: 直訳は「その方の名」だが、文脈上の主を指す敬意ある自然な日本語として「御名」とした。明示的に「主」や「イエス」を補わない。
theological_decisions:
- issue: バプテスマ、罪を洗い去ること、御名を呼び求めることの関係
  choice: 命令の連続と分詞のつながりを保ち、その厳密な神学的関係を訳文で規定しない。
  alternative: バプテスマ自体を罪が洗い去られる手段と明示する、または御名を呼び求めることだけをその手段と明示する。
  rationale: ギリシア語は二つの命令と分詞を結びつけるが、分詞の関係を手段だけに限定してはいない。論争のある教理を訳文で決着させず、原文の緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら、使徒言行録の弁明場面にふさわしい端正さと緊迫感を保った。「さあ」で καὶ νῦν の移行と切迫感を表し、敬体はアナニアの直接の呼びかけとして自然に整えた。
