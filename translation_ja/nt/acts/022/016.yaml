  timestamp: '2026-07-17T10:25:51Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な命令の連なりと、ἐπικαλεσάμενος（「呼び求めて」）が関係を限定しない分詞である点はよく保たれています。ただし、αὐτοῦ は「彼／その方の」という代名詞であり、「御名」は敬称を加えるうえ、指示対象をやや定型的に固定して響かせます。「その方の名」とするほうが、本文の代名詞表現と文脈上の指示をより忠実に保てます。
  naturalness: 「では今、なぜためらっているのですか」は明瞭で自然です。「立ち上がって、バプテスマを受け、その方の名を呼び求めて、あなたの罪を洗い去りなさい」は、呼び求めることと洗い去ることの文法的関係を日本語として過度に限定せず、緊迫した呼びかけとしても自然です。
  terminology: 「バプテスマ」は方式を特定しない教会用語として適切です。「罪」も ἁμαρτίας の通常の訳として適切です。「御名」は避け、本文どおり「その方の名」とします。
  issues:
