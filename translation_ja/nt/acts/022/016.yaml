    issue: 「御名」が原文の代名詞 αὐτοῦ にない敬称的ニュアンスを加えている。
    rationale: 文脈上の指示対象を明示しすぎず、かつ原文の「彼の名」という表現を保つため、「その方の名」がより適切です。
  - severity: low
    issue: 注aの別訳「何をためらっているのですか」は、本文の「なぜためらっているのですか」との差が小さく、τί μέλλεις の慣用的な『遅れ』の意味を十分には示していない。
    rationale: 「なぜ遅れているのですか」とすれば、同じ慣用句の自然な別表現として機能します。
