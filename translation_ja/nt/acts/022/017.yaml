  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: ja
  text: さて、私がエルサレムに戻り、神殿の境内で祈っていたとき、私の身に起こったことがあります。私は恍惚状態に入った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「トランス状態に入った」。ギリシア語は、通常とは異なる幻視的な意識状態に入ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: さて、私は……とき、……た
  rationale: 出来事の推移を示す定型表現を、日本語で不自然な「私に起こった」とせず、場面転換を示す「さて」と時間節を用いて自然に表した。
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: 私がエルサレムに戻り
  rationale: アオリスト分詞が主要な出来事に先行する帰還を表すことを、後続の「祈っていたとき」と組み合わせて明確にした。
- source_word: καὶ προσευχομένου μου
  choice: 祈っていたとき
  rationale: 属格独立構文が主要な出来事と同時進行の動作を示すため、継続性のある自然な日本語とした。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内で
  rationale: ἱερόνは内陣そのものではなく神殿域・境内を指すため、その区別を本文で簡潔かつ正確に示した。
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: 私は幻に心を奪われた
  rationale: 直訳的な「忘我状態になった」より自然で品位があり、使徒言行録における幻視を伴う特殊な意識状態への移行を表す。ただし経験の仕組みまでは断定しない。
theological_decisions:
- issue: ἐκστάσειが表すパウロの経験の性質
  choice: 幻に心を奪われた
  alternative: 恍惚状態になった／夢心地になった
  rationale: 本文は祈りの最中の幻視的状態を述べるが、その心理的・生理的仕組みを定義しない。「幻に心を奪われた」は文脈に即しつつ、余分な教理的説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語。口語的すぎる「トランス状態」は避け、物語として自然で品位のある表現を採用した。ἱερόνの範囲は「神殿の境内」と本文で明示した。
