id: ACT.22.26
reference: Acts 22:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: ja
  text: 百人隊長はこれを聞くと、千人隊長のところへ行って報告した。「何をなさろうとしているのですか。この人はローマ市民ですから。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: これを聞くと
  rationale: アオリスト分詞が主動詞に先立つ状況を示すため、自然な時間的つながりとして訳した。
- source_word: ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の役職を表す、日本語聖書で定着した明瞭な訳語。
- source_word: προσελθὼν
  choice: ところへ行って
  rationale: 上官に近づく動きを、現代日本語として自然に表した。
- source_word: χιλιάρχῳ
  choice: 千人隊長
  rationale: ローマ軍の χιλίαρχος を表す定着した訳語であり、役職の階級差も伝わる。
- source_word: ἀπήγγειλεν
  choice: 報告した
  rationale: 情報を上官に伝達する軍務上の文脈に適した訳。
- source_word: λέγων
  choice: 「……」
  rationale: 日本語では直接話法を主動詞「報告した」に続けることで、分詞の機能を自然に表せる。
- source_word: Τί μέλλεις ποιεῖν;
  choice: 何をなさろうとしているのですか
  rationale: μέλλω＋不定詞が持つ、意図された行為と差し迫った行為の両面を過度に一方へ限定しない表現。
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: この人は
  rationale: 当該人物を指す自然で中立的な現代日本語。γάρ の理由説明は、日本語では文脈と文の連続によって十分明瞭なため、接続語を補わなかった。
- source_word: Ῥωμαῖός ἐστιν
  choice: ローマ市民です
  rationale: この法的・軍事的文脈では民族や居住地ではなくローマ市民権の保持を意味するため、その含意を明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。百人隊長が上官に話す場面なので、「なさろうとしているのですか」「です」という丁寧語を用いた。原文の意味上の情報は本文で十分に表現できるため、脚注は設けていない。
