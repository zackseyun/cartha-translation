base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: ja
  text: 男性の皆さん、兄弟たち、父たち。今、あなたがたに申し上げる私の弁明をお聞きください。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: 兄弟であり父である皆さん
  rationale: Ἄνδρεςは成人男性への呼びかけを導く語であり、日本語では独立して「男たち」とすると不自然になる。ἀδελφοίとπατέρεςの親愛と敬意を保ちつつ、現代の公的な呼びかけとして自然にした。
- source_word: ἀκούσατέ
  choice: お聞きください
  rationale: アオリスト命令形の直接的な要請を、聴衆への敬意を伴う自然な現代日本語で表した。
- source_word: μου ... ἀπολογίας
  choice: 私の弁明
  rationale: ἀπολογίαは謝罪ではなく、自らの立場や行為を説明して擁護する発言を指すため、「弁明」とした。属格μουはその弁明の話し手を示す。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたに申し上げる
  rationale: 弁明が聴衆に向けられていることを示す。日本語では「あなたがたへの弁明」より、発話行為として表すほうが自然である。
- source_word: νυνὶ
  choice: 今
  rationale: これから直ちに行う弁明への注意を促す語として、簡潔に訳した。
