  naturalness: 現代標準日本語として自然です。「祭司長たちと最高法院全体に招集を命じ」は、誰に集まるよう命じたのかがやや曖昧なので、「祭司長たちと最高法院全体を召集するよう命じた」とすると明確です。
  terminology: 「千人隊長」「祭司長たち」「最高法院」は公的・叙述的な文体に適しています。「最高法院」にはサンヘドリンを説明する脚注を付すのが有益です。「ユダヤ人たち」は原文のἸουδαίωνを保つ訳として妥当であり、特定の告発者を指す文脈は注記で限定できます。
