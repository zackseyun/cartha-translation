id: ACT.22.30
reference: Acts 22:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: ja
  text: しかし翌日、千人隊長は、パウロがユダヤ人たち[a]から何のことで訴えられているのかを確かめたいと思い、彼の拘束を解いた。そして祭司長たちと最高法院[b]全体を召集するよう命じ、パウロを連れて下り、彼らの前に立たせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人たち」は、この文脈ではパウロを告発した人々を指しており、すべてのユダヤ人を一括して指すものではない。原語は「ユダヤ人たち」であり、「ユダヤ人の指導者たち」または「ユダヤ地方の人々」と訳すこともできる。
    reason: lexical_alternative
  - marker: b
    text: 「最高法院」は、エルサレムに置かれていたユダヤ人の最高評議機関で、サンヘドリンとも呼ばれる。
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: しかし翌日
  rationale: 時間を表す与格句を自然な日本語で「翌日」とし、δέによる場面の転換を軽い逆接の「しかし」で示した。
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: 確かめたいと思い
  rationale: 「確実なことを知ろうと望んで」という意味を、目的と確実性の双方が伝わる自然な日本語にした。
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: ユダヤ人たちから何のことで訴えられているのか
  rationale: 受動構文と、訴えの内容を問う表現を保った。「ユダヤ人たち」は文脈上パウロを告発した人々を指すが、本文では語の範囲を解釈的に狭めなかった。
- source_word: ἔλυσεν αὐτόν
  choice: 彼を解放した
  rationale: λύωは「ほどく」とも訳せるが、拘束下にあったパウロについて実際的な意味を明瞭に表す「解放した」とした。
- source_word: ἐκέλευσεν συνελθεῖν
  choice: 招集を命じ
  rationale: 権限をもって集合を命じたことを、公的な場面に合う簡潔な表現で示した。
- source_word: τοὺς ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形のἀρχιερεῖςを、ユダヤの指導的祭司層を表す標準的な日本語で訳した。
- source_word: πᾶν τὸ συνέδριον
  choice: 最高法院全体
  rationale: συνέδριονがここではエルサレムのユダヤ最高評議機関を指すため、一般的な「議会」より具体的な「最高法院」を用い、πᾶνを「全体」で示した。
- source_word: καταγαγὼν τὸν Παῦλον
  choice: パウロを連れて下り
  rationale: 要塞など高い場所から会合の場所へ移動したことを示す方向語「下り」を保持した。
- source_word: ἔστησεν εἰς αὐτούς
  choice: 彼らの前に立たせた
  rationale: パウロを彼らの面前に立たせたという使役的な意味を自然に表した。
theological_decisions:
- issue: Ἰουδαίωνの指示範囲
  choice: ユダヤ人たちから
  alternative: ユダヤ人の指導者たちから／ユダヤ地方の人々から
  rationale: 原文の民族・地域名称を本文に保ちつつ、文脈上は全ユダヤ人ではなくパウロを告発した特定の人々を指すことを脚注で明示し、不当な一般化を避けた。
- issue: συνέδριονの訳語
  choice: 最高法院
  alternative: 議会／サンヘドリン
  rationale: 固有の統治機関を指す文脈を明確にしながら、音写語だけに頼らず一般読者にも機能が伝わる訳語を選んだ。
translation_notes:
  register: 明瞭で現代的かつ公的場面にふさわしい文体とした。「千人隊長」は直前の文脈から補った主語で、原文の三人称単数の指示対象を日本語で明確にしている。脚注記号は、それぞれ「ユダヤ人たち」と「最高法院」に対応するため、本文では該当語の直後に置くのが望ましい。
