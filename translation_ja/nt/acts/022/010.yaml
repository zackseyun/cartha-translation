source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: ja
  text: そこで私は、「主よ、私は何をすべきでしょうか[a]」と言いました。すると主は私に言われました。「立ち上がってダマスコへ行きなさい。そこで、あなたが行うよう定められているすべてのことについて、あなたに告げられるでしょう[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は何をしたらよいでしょうか」。
    reason: lexical_alternative
  - marker: b
    text: 「あなたに割り当てられているすべてのこと」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: 私は何をすべきでしょうか
  rationale: 熟慮を表すアオリスト接続法の問いを、次に取るべき行動への指示を求める自然な現代日本語で表した。
- source_word: κύριε / ὁ δὲ κύριος
  choice: 主よ／主は
  rationale: ダマスコ途上の文脈でイエスに用いられる称号としての重みを保ち、「先生」などに弱めない。
- source_word: Ἀναστὰς πορεύου εἰς Δαμασκόν
  choice: 立ち上がってダマスコへ行きなさい
  rationale: Ἀναστὰς と命令形 πορεύου の連続動作を、明快で自然な命令として訳した。εἰς の方向性は「へ」で表した。
- source_word: κἀκεῖ σοι λαληθήσεται
  choice: そこで……告げられるでしょう
  rationale: 未来受動形と与格 σοι を、告げる主体を原文どおり明示しない日本語の受動表現で保った。
- source_word: περὶ πάντων ὧν τέτακταί σοι ποιῆσαι
  choice: あなたが行うよう定められているすべてのことについて
  rationale: 完了受動形 τέτακταί の、すでに定められ今も効力を持つ含意を「定められている」で表し、神学的体系を過度に読み込まないようにした。
theological_decisions:
- issue: τέτακταί が示す神の指示と召命の強さ
  choice: あなたが行うよう定められている
  alternative: あなたに割り当てられている／あなたが行うよう命じられている
  rationale: パウロの行動があらかじめ定められていることを保ちつつ、「命じられている」ほど命令の側面に限定せず、予定についても本文以上に断定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、主の言葉には簡潔で厳かな調子を保った。話者が告げられる内容と、その内容があらかじめ定められているという原文の受動表現を維持した。
