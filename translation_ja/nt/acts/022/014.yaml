id: ACT.22.14
reference: Acts 22:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: ja
  text: すると彼は言った。「私たちの父祖の神は、ご自分のみこころを知り、正しい方[b]を見、その方の口から声を聞くようにと、あなたを選び定められた[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「選ばれた」とも訳せる。このギリシア語は、ある務めのために人を選び、任命することを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「正しい方」は、ここではイエスを指す称号。「義なる方」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: 選び定められた
  rationale: 選ぶことと、ある務めのために定めることの両面を表す。時間的な先行を必要以上に読み込まず、後続する三つの不定詞が示す目的とのつながりも保つ。
- source_word: γνῶναι
  choice: 知り
  rationale: 神のみこころを知るという目的を、簡潔で自然な現代日本語で表す。文脈上は「知るようになる」も可能だが、本文では過度に限定しない。
- source_word: τὸ θέλημα αὐτοῦ
  choice: ご自分のみこころ
  rationale: θέλημαの「意志・望み・目的」を広く保つ聖書的かつ自然な表現。「ご自分」は主語である神を明確に指す。
- source_word: ἰδεῖν
  choice: 見
  rationale: 基本義を平明に表し、過度に古風な「見奉る」「仰ぎ見る」などを避ける。
- source_word: τὸν δίκαιον
  choice: 正しい方
  rationale: δίκαιοςの意味を保ちながら、人物を指す称号として自然な日本語にした。「義人」では一般的な人物類型と誤解されやすく、「義なる方」は現代語としてやや硬い。
- source_word: ἀκοῦσαι φωνὴν
  choice: 声を聞く
  rationale: 冠詞のないφωνήを日本語で過度に特定せず、口から発せられる言葉として自然に表す。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: その方の口から
  rationale: 原文の具体的な「口から」を保持する。「その方」は直前の「正しい方」を自然に受ける一方、原文の代名詞表現以上の説明を加えない。
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 私たちの父祖の神
  rationale: イスラエルの契約的な歴史との連続性を示す定型表現を保持する。「父祖」はπατέρωνの男性形と代表的・祖先的用法の双方を簡潔に伝える。
theological_decisions:
- issue: τὸν δίκαιονをキリスト論的な称号として訳すか、単なる描写として訳すか
  choice: 文脈上イエスを指す称号として「正しい方」と訳す
  alternative: 「正しい者」または「義なる方」
  rationale: 使徒言行録3:14、7:52にも対応する称号的用法があり、「正しい方」はその働きを示しつつ、語義そのものを越えた説明を本文に加えない。
- issue: πατέρωνを性別に中立な「先祖」とするか
  choice: 「父祖」と訳す
  alternative: 「先祖」
  rationale: 原文の男性形と、イスラエルの父祖を想起させる契約的な言い回しを保つため。ただし現代の読者にも理解できる語を用いる。
- issue: ἐκ τοῦ στόματος αὐτοῦのαὐτοῦが誰を指すか
  choice: 直前の「正しい方」を自然に受ける「その方」とする
  alternative: 神を指すものとして「神の口から」と明示する
  rationale: 文法上もっとも近い先行詞は「正しい方」であり、パウロが復活したイエスの声を聞いたという文脈にも合う。ただし固有名を補わず、原文の代名詞表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「父祖」「みこころ」により聖書本文としての品位と契約的響きを保った。日本語として自然になるよう主動詞「選び定められた」を文末に置き、原文の三つの目的（知る・見る・聞く）の並行関係を維持した。
