  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: ja
  text: しかし、兵士たちが革ひもでパウロを引き伸ばしていると、パウロはそばに立っていた百人隊長に言った。「ローマ市民であり、しかも有罪判決を受けていない者を、あなたがたがむち打つことは許されているのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: 革ひもでパウロを引き伸ばした
  rationale: προτείνω の「前方に伸ばす、引き伸ばす」と、ἱμάς の「革ひも」を明示し、むち打ちのため体を固定する場面を自然な日本語で表した。代名詞は文脈上の指示対象を明確にするため「パウロ」とした。
- source_word: ἑστῶτα
  choice: そばに立っていた
  rationale: 完了分詞が示す、その場に立って居合わせる様子を簡潔に表す。
- source_word: ἑκατόνταρχον
  choice: 百人隊長
  rationale: ローマ軍の階級を表す日本語として定着した、正確で理解しやすい訳語。
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: ローマ市民で……者
  rationale: 字義は「ローマ人である人」だが、この法的な問いではローマ市民権による保護が要点であるため、「ローマ市民」と明示した。「者」により ἄνθρωπον の存在も自然に反映した。
- source_word: ἀκατάκριτον
  choice: 有罪判決を受けていない
  rationale: 単に無罪であるという意味ではなく、司法上まだ有罪と宣告されていない状態を明確に表す。
- source_word: ἔξεστιν ὑμῖν
  choice: ……てもよいのですか
  rationale: 法的に許されているかを問う表現として、現代日本語で自然でありながら、パウロの鋭い合法性への問いを保つ。
- source_word: μαστίζειν
  choice: むち打つ
  rationale: 拷問を伴う厳しい鞭打ちを指す語として、明瞭で一般に理解できる表現。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、法的な緊張感とパウロの丁寧だが鋭い問いを保持した。「しかも」は καί が二つの法的条件、すなわちローマ市民であることと未決であることを重ねる働きを自然に示す。
