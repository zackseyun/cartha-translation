source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: ja
  text: すると看守は、この伝言をパウロに伝えた。「行政官たちが、あなたがたを釈放するようにと知らせてきました。ですから今、出て来て、安心してお行きください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: 伝えた
  rationale: 知らせや言葉を取り次ぐ動作を、物語文として自然で明確な現代日本語にした。
- source_word: ὁ δεσμοφύλαξ
  choice: 看守
  rationale: この文脈では牢獄を管理する者を指す。「牢番」より現代的で、職務も明確である。
- source_word: τοὺς λόγους τούτους
  choice: この言葉
  rationale: 複数形の λόγους は伝達内容を指す集合的表現であり、日本語では「この言葉」が自然で、原文の表現にも近い。
- source_word: Ἀπέσταλκαν
  choice: 知らせてきました
  rationale: 目的語が明示されない「遣わした」を、文脈上の伝言の送付として自然に表現した。完了形の現在への関わりは「てきました」で示した。
- source_word: οἱ στρατηγοί
  choice: 行政官たち
  rationale: フィリピの都市当局者を指す。専門的な「法務官」や古風な「長官」より一般読者に理解しやすく、統治上の役職も示せる。
- source_word: ἵνα ἀπολυθῆτε
  choice: あなたがたを釈放するようにと
  rationale: 拘禁から解放するという受動接続法の内容を、日本語の伝言表現として明確にした。二人への複数形も保持した。
- source_word: νῦν οὖν
  choice: ですから今
  rationale: οὖν の推論と νῦν の時間的移行を、自然な語順でともに保持した。
- source_word: ἐξελθόντες πορεύεσθε
  choice: 出て来て、…お帰りください
  rationale: 分詞と命令形が示す連続動作を自然な日本語にした。看守から囚人への発話なので「出て来て」が視点に合い、「帰る」はその場を立ち去る意味を明瞭にする。
- source_word: ἐν εἰρήνῃ
  choice: 安心して
  rationale: 単に争わずにというより、無事に、心配なく立ち去ることを許す定型的な別れの表現として自然に訳した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。公的な伝言であるため看守の引用部は丁寧体としつつ、過度に官僚的・古風な語調は避けた。「安心してお帰りください」は ἐν εἰρήνῃ の別れの慣用性を自然に伝える。
