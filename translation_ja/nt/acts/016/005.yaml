base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: ja
  text: こうして諸教会は、信仰において強められ、日ごとに数を増していった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は、諸教会に共有されたキリスト教の信仰を指すとも、より一般的に、信じる者たちの信頼が強められたことを指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: こうして
  rationale: 直前の物語を受けた推移と結果の要約を、現代日本語で自然に示す。ここでの μέν は明示的な対比訳を必要としない。
- source_word: ἐκκλησίαι
  choice: 諸教会
  rationale: 使徒言行録の文脈では各地のキリスト者共同体を指す。「諸」により複数形を簡潔に表した。
- source_word: ἐστερεοῦντο
  choice: 強められ
  rationale: 未完了過去の受動態が示す継続的な働きを保つ。「確立される」も可能だが、後続する τῇ πίστει との結びつきには「強められる」が自然。
- source_word: τῇ πίστει
  choice: その信仰において
  rationale: 定冠詞を踏まえ、諸教会が共有するキリスト教信仰を主に指す訳とした。ただし、信頼としての「信仰」も排除できないため注で示す。
- source_word: ἐπερίσσευον
  choice: 増していった
  rationale: 未完了過去が示す継続的な増加を自然な日本語で表す。
- source_word: τῷ ἀριθμῷ
  choice: 人数を
  rationale: 増加が数の面で起きたことを、日本語では「人数を増す」と具体的かつ自然に表した。
- source_word: καθ’ ἡμέραν
  choice: 日ごとに
  rationale: 日々繰り返される継続的な増加を簡潔に表す。
theological_decisions:
- issue: 定冠詞を伴う πίστις の意味
  choice: その信仰＝諸教会が共有するキリスト教信仰
  alternative: 信仰＝信者たちの神への信頼
  rationale: 定冠詞と教会共同体の文脈は共有された信仰内容・信仰生活を指す理解に傾くが、主観的な信頼という意味も文法上可能であるため、本文で一義的に固定せず脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その信仰」は定冠詞を反映しつつ、脚注で原文の意味上の幅を保存した。二つの未完了過去は「強められ」「増していった」により継続性を表した。
