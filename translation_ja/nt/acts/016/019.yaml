  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: ja
  text: しかし、彼女の主人たちは、自分たちが稼ぎを得る望みが失われた[a]のを見て、パウロとシラスを捕らえ、広場にいた当局者たち[b]の前へ引きずって行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼らの稼ぎの望みが出て行った」。直前に霊が彼女から「出て行った」と述べる箇所と同じ動詞が使われている。
    reason: lexical_alternative
  - marker: b
    text: ここで「当局者たち」と訳した語は、都市の統治者や当局者を指す一般的な語。次の節では、より具体的な官職を表す別の語が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: 彼女の主人たち
  rationale: 奴隷の女性を所有し支配していた者たちを指す。文脈上の経済的搾取を含みつつ、κύριοι の基本的な関係性を自然な日本語で示す。
- source_word: ἐξῆλθεν
  choice: 消え去った
  rationale: 直訳的には「出て行った」。直前に霊が出て行った出来事との語の響きをある程度保ちながら、利益への期待が失われたことを明瞭に表す。
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: もうける望み
  rationale: ἐλπίς の「望み」を保ち、ἐργασία がここでは仕事一般でなく、占いによる収益・稼ぎを指すことを平明に表す。
- source_word: ἐπιλαβόμενοι
  choice: 捕らえ
  rationale: 敵対的に力ずくでつかんだ行為を、簡潔で自然な日本語にした。
- source_word: εἵλκυσαν
  choice: 引きずって行き
  rationale: ἕλκω の強制的に引っ張る意味を保持し、乱暴な扱いを伝える。
- source_word: ἀγορὰν
  choice: 広場
  rationale: ἀγορά は市場であると同時に都市の公的な集会・司法の場でもある。この場面では当局者の前へ連行する公的空間なので「広場」が自然。
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: 役人たちの前に
  rationale: ἄρχοντες は都市の統治当局者を指す一般語。次節のより具体的な官職名と区別し、「役人たち」とした。
theological_decisions:
- issue: ἐξῆλθεν による直前の悪霊退出との言葉の響き
  choice: 「消え去った」として、期待が失われた意味と退出の比喩を両立させる
  alternative: 「なくなった」と完全に慣用化する
  rationale: 著者が同じ動詞を用いた可能性のある文学的な響きを、過度に不自然にならない範囲で残す。教理的な意味を付加しない。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、叙事の緊迫感と公的な場面にふさわしい品位を保った。「もうけ」は平明だが俗に傾きすぎず、所有者たちの経済的動機を明確にする。
