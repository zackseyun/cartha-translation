  source_fidelity: 主要な語義は適切です。οἱ κύριοι αὐτῆς を「彼女の主人たち」としたこと、利益を得る見込みの喪失、パウロとシラスを力ずくで連行したこと、ἀγορά を公的な「広場」としたことは、文脈と原文に忠実です。ただし原文は「広場へ引きずって行き、役人たちの前に連れ出した」という二段階の動作を述べるのではなく、役人たちのいる広場へ引きずって行った、という一続きの連行を表します。
