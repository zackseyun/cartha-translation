  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: ja
  text: 二人は牢を出ると、リディアのところへ行った。そして、兄弟たち[a]に会って励ました後、そこを立ち去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は男性複数形だが、男女を含む仲間の信者たちを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: 二人は牢を出ると
  rationale: アオリスト分詞を、後続する主動詞に先立つ出来事として自然な時間節で表した。文脈上の主語パウロとシラスを、日本語で明確にするため「二人」とした。
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: リディアのところへ行った
  rationale: 人を目的語とする εἰσέρχομαι πρός は、その人を訪ねて行く意味を表す。「家」を本文に補わず、原文に即しつつ自然な日本語とした。
- source_word: ἰδόντες
  choice: 会って
  rationale: ここでの「見る」は面会・再会の文脈にあるため、日本語では「会う」が自然である。後続の励ましとの時間的連続も保った。
- source_word: παρεκάλεσαν
  choice: 励ました
  rationale: παρακαλέω の「勧める・慰める・励ます」という幅を過度に限定せず、この釈放後の牧会的な場面に適する包括的な表現を選んだ。
- source_word: τοὺς ἀδελφούς
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文に反映した。ただし、信仰共同体の男女を含み得る用法であることを脚注で示した。
- source_word: ἐξῆλθαν
  choice: そこを立ち去った
  rationale: 単なる退出だけでなく、この場を離れたという物語上の動きを自然に示す。「そこ」は文脈上リディアのもとを指す。
theological_decisions:
- issue: 信者集団を指す ἀδελφοί の性を含む範囲
  choice: 本文は「兄弟たち」とし、包括的用法を脚注で示す
  alternative: 「兄弟姉妹たち」または「信者たち」
  rationale: 語形を本文に保ちながら、この男性複数形が男女を含む仲間の信者を指し得るという原語上の意味範囲も失わないため。
translation_notes:
  register: 明瞭で現代的かつ落ち着いた物語文。「牢」「立ち去った」により簡潔さと品位を保ち、原文にない「リディアの家」は補わなかった。
