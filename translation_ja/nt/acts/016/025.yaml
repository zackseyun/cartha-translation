  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: ja
  text: 真夜中ごろ、パウロとシラスは祈りながら、神を賛美する歌を歌っていた。囚人たちは二人の声を聞いていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二人の声にじっと耳を傾けていた」とも訳せる。ギリシア語の動詞は、注意深く、あるいは熱心に聞くことを含意し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: 真夜中ごろ
  rationale: κατά＋時を表す対格が示す「およそ、そのころ」の幅を「ごろ」で自然に表した。δέは軽い接続であり、日本語本文では明示しなくても文脈上の流れが保たれる。
- source_word: Παῦλος καὶ Σιλᾶς
  choice: パウロとシラス
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: προσευχόμενοι
  choice: 祈りながら
  rationale: 現在分詞が主動詞ὕμνουνと同時進行の行為を表すため、継続性を自然な現代日本語で示した。
- source_word: ὕμνουν τὸν θεόν
  choice: 神を賛美する歌を歌っていた
  rationale: ὑμνέωは単に歌うことではなく、賛美の歌を歌うことを指す。未完了過去の継続的な動作も「歌っていた」で表した。
- source_word: ἐπηκροῶντο
  choice: 聞いていた
  rationale: 未完了過去による継続的な聴取を簡潔に表した。この動詞に含まれ得る熱心・注意深い聴取の含意は脚注に残した。
- source_word: οἱ δέσμιοι
  choice: 囚人たち
  rationale: 拘束されている者を指す文脈上、明瞭で自然な標準日本語とした。
- source_word: αὐτῶν
  choice: 二人の声を
  rationale: 聞く対象がパウロとシラスであることを日本語として自然に示した。「声」は祈りと歌の双方を包含し、歌だけに限定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文としての簡潔さと品位を保った。祈りと賛美が継続していたことを示しつつ、両者の関係を必要以上に神学的に規定していない。脚注記号[a]は、その対象となる「聞いていた」の直後に置いた。
