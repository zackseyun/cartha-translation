lexical_decisions:
- source_word: παρελθόντες
  choice: 通り過ぎ
  rationale: アオリスト能動分詞で、目的格の「ミシア」を伴う。そこにとどまらず先へ進んだことを自然に表しつつ、「通過した」と「そばを過ぎた」の両方に開かれた表現とした。
- source_word: δὲ
  choice: そこで
  rationale: 弱い接続を表し、前節からの物語の流れと結果的な展開を、強い対比を持ち込まず自然な日本語で示す。
- source_word: τὴν Μυσίαν
  choice: ミシア
  rationale: 地域名として、日本語聖書で一般的な音写を用いる。
- source_word: κατέβησαν
  choice: 下って行った
  rationale: καταβαίνω の方向性を保ち、海岸方面または低地への移動を示し得る表現とする。話者の視点を不必要に置かないよう「下って来た」ではなく「下って行った」とした。
- source_word: εἰς Τρῳάδα
  choice: トロアスへ
  rationale: 目的地への移動を現代日本語で自然に示す。「中へ」という含意を過度に明示しない。
