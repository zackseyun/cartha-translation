  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: ja
  text: しかしパウロは大声で叫んだ。「自分を傷つけてはいけない。私たちはみな、ここにいるのだから。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν ... φωνῇ μεγάλῃ
  choice: 大声で叫んだ
  rationale: 緊迫した場面での強い発声を表す動詞と様態の句を、重複感のない自然な現代日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 前節で看守が自害しようとした動きに対し、パウロがそれを制止する対照と展開を示す。
- source_word: λέγων
  choice: 直接話法で表現
  rationale: 発言内容を導く分詞は、日本語では独立した『言って』を置かず、叫んだ内容を直接続けるのが自然である。
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: 自分を傷つけてはいけない
  rationale: 字義的には『自分に何も悪いことをするな』という広い表現だが、この文脈では自傷・自害の制止を意味する。『傷つける』は具体性を保ちつつ、死に限定しすぎない。
- source_word: ἅπαντες
  choice: みな
  rationale: その場にいた者が一人も欠けていないという全体性を、自然で簡潔な日本語で示す。
- source_word: γάρ
  choice: 独立した理由文として接続語を省略
  rationale: 後半が制止の理由であることは文脈上明瞭であり、日本語の直接話法では『私たちはみな、ここにいる』と続ける方が切迫した発言として自然である。
- source_word: ἐνθάδε
  choice: ここに
  rationale: 場所を示す副詞を、標準的で自然な日本語にした。
- source_word: ὁ Παῦλος
  choice: パウロ
  rationale: 固有名を日本語聖書で一般的な慣用表記に従って音写した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、緊迫した場面に合う簡潔な直接話法とした。『自害するな』とはせず、原文のより広い表現を反映して『自分を傷つけてはいけない』とした。
