source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: ja
  text: 安息日に、私たちは門の外、川のほとりへ出て行った。そこには祈りの場所[a]があると思っていた。そして座って、集まっていた女性たちに話していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこには祈りがあると思っていた」。ギリシア語は、祈りそのものを指すことも、祈りのために設けられた場所を指すこともある。ここでは文脈上、「祈りの場所」が適切と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: 安息日に
  rationale: コイネー・ギリシア語の慣用表現として安息日を指す。日本語では「安息日に」が自然で明確である。
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: 私たちは門の外へ出て
  rationale: 動詞とἔξωが示す外向きの移動を自然な日本語で表した。「町」は文脈上想定されるが、原文に明示されないため補わなかった。
- source_word: παρὰ ποταμόν
  choice: 川のほとりに行った
  rationale: παρά＋対格が示す川沿いの場所への移動を、「川のほとりに行った」と明確にした。
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: そこに祈りの場所があると思っていた
  rationale: νομίζωは「思う、推測する」。προσευχήは祈りそのものと祈りのための場所の両義があるが、川辺の所在地を述べる文脈では「祈りの場所」が最も適切である。別義は脚注に残した。
- source_word: καὶ καθίσαντες
  choice: そして腰を下ろし
  rationale: アオリスト分詞が主動詞に先立つ動作を示すことを、自然な動作の順序として表現した。
- source_word: ἐλαλοῦμεν
  choice: 話をした
  rationale: λαλέωの対人的な発話を自然な日本語にした。未完了過去の継続性は日本語で「話していた」とも訳せるが、この文脈では「話をした」でも一定時間の語りかけを自然に含意する。
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: 集まっていた女たちに
  rationale: συνέρχομαιが示す集合を表し、分詞の結果状態を「集まっていた」で自然に示した。
theological_decisions:
- issue: この場面における προσευχή の意味
  choice: 「祈りの場所」と訳す
  alternative: 「祈り」または制度的名称としての「会堂」
  rationale: 川辺にある集合場所を述べる文脈とヘレニズム期ユダヤ語法から、場所を指す可能性が高い。ただし語自体には抽象的な「祈り」の意味もあるため脚注で明示し、「会堂」という過度に制度的な解釈は本文に持ち込まなかった。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語を用いた。「女たち」は原文のγυναιξίνを直接反映する。「腰を下ろし」は「座って」より自然な叙述調とし、過度に古風な表現は避けた。
