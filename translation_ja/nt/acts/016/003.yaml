  naturalness: 全体に明瞭で現代標準語として自然である。ただし、「迎え入れ」はこの叙述では不必要に意味を限定するため、「連れて行き」のほうが自然かつ原文に近い。
  terminology: 「パウロ」「ユダヤ人」「割礼」「ギリシア人」はいずれも標準的で適切である。「ギリシア人」を「異邦人」と置き換えず、脚注で文脈上の含意だけを示す方針も適切である。
