  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: ja
  text: パウロは彼を同行させたいと思った[a]。そこで彼を連れて行き、その地方にいたユダヤ人たちのために[b]、彼に割礼を施した。彼の父がギリシア人[c]であったことを、彼らは皆知っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼と共に出て行く」。ここでは旅に出ることを指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ユダヤ人たちのことを考えて」または「ユダヤ人たちがいたために」。
    reason: lexical_alternative
  - marker: c
    text: 「ギリシア人」は、この文脈では父がユダヤ人ではなかったことを示すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: 彼を
  rationale: 直前に登場するテモテを指す対格の指示代名詞。日本語では文脈上明確なので、過度な強調を避けて「彼を」とした。
- source_word: ἠθέλησεν
  choice: …たいと思った
  rationale: θέλωの意志・願望を、現代日本語として自然に表した。決意の強さを原文以上に限定しない。
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: 彼を連れて旅に出る
  rationale: 字義は「彼と共に出て行く」だが、ここでは宣教旅行への出発を指す慣用的表現。日本語では主語の異なる二つの「彼」による曖昧さを避け、「彼を連れて」とした。
- source_word: λαβὼν
  choice: 彼を迎え入れ
  rationale: 先行するアオリスト分詞。単なる物理的な「取る」ではなく、同行者として受け入れる文脈を自然に表す。
- source_word: περιέτεμεν
  choice: 彼に割礼を施した
  rationale: περιτέμνωを婉曲化せず、標準的な日本語で直接訳した。行為者がパウロであることは文脈から明らかである。
- source_word: διὰ τοὺς Ἰουδαίους
  choice: ユダヤ人たちのために
  rationale: 対格を伴うδιάは理由・動機を示す。「ために」は配慮と事情の双方を表し得るため、原文の動機を一義的に決めすぎない。別訳を脚注で示した。
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: その地方にいた
  rationale: 当地のユダヤ人を限定する分詞句。複数形τόποιςを日本語で自然な集合的表現「地方」とした。
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: 皆が知っていたからである
  rationale: γάρの説明機能とἅπαντεςの包括性を保ち、前文の行為の理由を明示した。
- source_word: Ἕλλην
  choice: ギリシア人
  rationale: 基本的な民族・文化的呼称をそのまま訳した。この文脈では非ユダヤ人であることも含意し得るが、「異邦人」と断定しない。
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: 彼の父が…である
  rationale: ὑπάρχωはここでは存在・身分を表し、日本語では単純なコピュラ表現が自然である。
theological_decisions:
- issue: テモテへの割礼とユダヤ人への配慮との関係
  choice: 地元のユダヤ人がテモテの父の出自を知っていたことを理由とする実際的行為として訳す。
  alternative: 割礼が救いや契約上の身分に必要だった、またはパウロが信者一般に割礼を神学的に是認した、と解する。
  rationale: 本文が明示するのは、当地のユダヤ人と彼らの知識が動機だったという点だけである。割礼の救済論的位置づけやパウロの全般的方針を訳文に持ち込まず、他の新約箇所との緊張も保持する。
translation_notes:
  register: 明瞭で現代的かつ格調を保った叙述体。原文の因果関係を保ちつつ、神学的動機を訳文で過度に確定しない。「割礼」は一般的な聖書用語としてそのまま用いた。
