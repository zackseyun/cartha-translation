revisions:
- from: パウロは、彼を連れて旅に出たいと思った[a]。そこで彼を迎え入れ、その地方にいたユダヤ人たちのために[b]、彼に割礼を施した。彼の父がギリシア人[c]であることを、皆が知っていたからである。
  to: パウロは彼を同行させたいと思った[a]。そこで彼を連れて行き、その地方にいたユダヤ人たちのために[b]、彼に割礼を施した。彼の父がギリシア人[c]であったことを、彼らは皆知っていたからである。
  rationale: 「迎え入れ」を、λαμβάνωの基本的意味と文脈上の行為順序を保つ「連れて行き」に改めた。また、「彼らは皆」として、父がギリシア人であることを知っていた者が直前の当地のユダヤ人たちであることを日本語でも明瞭にした。動機を救済論的・教義的に解釈する表現は加えていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:08:54Z'
