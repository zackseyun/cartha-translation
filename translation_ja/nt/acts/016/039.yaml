  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: ja
  text: 長官たちはやって来て、二人に丁重に頼み[a]、二人を連れ出してから、この町から立ち去ってほしいと願った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「懇願し」「なだめて」とも訳せる。このギリシア語は文脈によって「慰める」の意味にもなるが、ここでは長官たちが二人に融和的、低姿勢に働きかけたことを表すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「頼んだ」とも訳せる。ギリシア語の動詞は未完了形で、願い続けたことや繰り返し願ったことを示す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: やって来て
  rationale: アオリスト分詞が示す先行動作を、自然な現代日本語の接続形で表した。
- source_word: παρεκάλεσαν
  choice: 丁重に頼み
  rationale: παρακαλέωには「勧める・懇願する・慰める」など幅がある。ここでは長官たちが不当な扱いの後にパウロとシラスへ融和的かつ低姿勢に働きかける文脈なので、「丁重に頼む」とした。謝罪そのものを明示する語ではないため、「謝った」とは断定しなかった。
- source_word: αὐτούς
  choice: 二人に
  rationale: 文脈上の指示対象であるパウロとシラスを、曖昧にならない自然な日本語で示した。
- source_word: ἐξαγαγόντες
  choice: 外へ連れ出した
  rationale: ἐξάγωの物理的な移動を明確にしつつ、アオリスト分詞の動作順序を日本語の独立した述語で自然に表した。
- source_word: ἠρώτων
  choice: 繰り返し願った
  rationale: ἐρωτάωの未完了過去が表し得る継続・反復と、文脈上の丁重な要請を反映した。ただし反復の含意は必須ではないため脚注を付した。
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: この町から立ち去ってほしい
  rationale: 不定詞が依頼の内容を示す構文を、日本語の依頼表現として自然に訳した。「この町」は定冠詞付きの「町」を当該の町として明示する。
