translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、行政官の低姿勢と一連の動作を読み取りやすくした。「丁重に頼む」は語義を「謝罪」に限定せず、原文の幅を脚注に残す。主語の「長官たち」と目的語の「二人」は前後の文脈から補って明示した。
