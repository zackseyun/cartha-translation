  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: ja
  text: 夜、パウロに幻が現れた。あるマケドニア人の男が立って、彼に訴えかけていた。「マケドニアへ渡って来て、私たちを助けてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅραμα
  choice: 幻
  rationale: 使徒言行録で神から示される視覚的な啓示を表す標準的な語として、自然で簡潔な「幻」を採用した。
- source_word: διὰ νυκτός
  choice: その夜
  rationale: 夜の間に起きたことを示す時間表現。文脈に自然な現代日本語とし、夢であったとは限定しない。
- source_word: τῷ Παύλῳ ὤφθη
  choice: パウロに幻が現れた
  rationale: ὁράω の受動形と与格を、日本語で自然な出現表現にした。「パウロによって見られた」より明瞭で、啓示の現れという性格も保つ。
- source_word: ἀνὴρ Μακεδών τις
  choice: あるマケドニア人の男
  rationale: ἀνήρ の男性を明示する意味と、τις の不特定性を「ある」で表した。
- source_word: ἑστώς
  choice: 立って
  rationale: 幻の中で男が立っている姿勢を自然に描写する。後続する分詞と合わせて継続的な場面を示す。
- source_word: παρακαλῶν
  choice: 懇願していた
  rationale: 助けを求める文脈では、単なる勧めより切実な訴えを表す。「嘆願」より日常的でありながら品位を保つ。
- source_word: λέγων
  choice: こう…していた
  rationale: 直接話法を導入する分詞を、日本語では「こう懇願していた」と一体化して自然に表現した。
- source_word: Διαβάς
  choice: 渡って来て
  rationale: 命令形に伴うアオリスト分詞の慣用的な力を、話者側への移動を示す「渡って来て」で表した。地理的な横断の含意も保つ。
- source_word: εἰς Μακεδονίαν
  choice: マケドニアへ
  rationale: 目的地への移動を自然な日本語で示す。「の中へ」はこの文脈では不自然に強い。
- source_word: βοήθησον ἡμῖν
  choice: 私たちを助けてください
  rationale: 直接的な援助の要請を明瞭に表す。丁寧な依頼形によって、懇願する発話として自然にした。
theological_decisions:
- issue: ὅραμα と ὤφθη が表す経験の性質
  choice: パウロに実際に幻が現れたこととして訳し、その現象の厳密な様態は限定しない。
  alternative: 夢、内面的な印象、客観的な顕現と特定する。
  rationale: 本文は夜に「幻が現れた」と述べるだけで、夢であったか、外的な顕現であったかを説明していないため、その曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語部分は簡潔に、男の訴えは切実さが伝わる丁寧な依頼として訳した。「見ると」は幻の内容への自然な移行を示す補助表現である。
