source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: ja
  text: それから、二人を自分の家に連れて上がり、食事を出した。神を信じた彼は、家中の者たちとともに大いに喜んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家中の者たちとともに」は、家の者全員が喜びに加わったことを表すと理解できる。一方、この句が家の者たちも信仰を共有したことを含意すると見る解釈もある。ギリシア語の「神を信じた」は単数形で、直接には看守を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: 案内すると
  rationale: 直訳的には「上へ連れて行って」。牢から家へ移した空間的な動きを文脈に即して自然な日本語で表し、主動詞に先立つ分詞の順序を「すると」で保った。
- source_word: εἰς τὸν οἶκον
  choice: 家に
  rationale: 定冠詞付きの「家」は文脈上、看守の家を指す。日本語では所有者を補わずとも明らかなので、簡潔に「家に」とした。
- source_word: παρέθηκεν τράπεζαν
  choice: 食事を出した
  rationale: 字義的には「食卓を用意した」だが、食事を供したことを表す慣用表現。現代日本語で自然にその意味を伝える。
- source_word: ἠγαλλιάσατο
  choice: 大いに喜んだ
  rationale: 強くあふれる喜びを表す動詞の強意を、明瞭で品位ある日本語にした。
- source_word: πανοικεὶ
  choice: 家中の者たちとともに
  rationale: 「全家を挙げて／家の者全員とともに」を意味する副詞。喜びに家の者たちも加わったという最も直接的な係り方を表す。
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: 神を信じる者となった彼は
  rationale: 完了分詞の、信じるに至った出来事とその継続する結果を表現する。単数男性形なので、まず看守を指すことを明示しつつ、因果関係を本文で過度に固定しない。
theological_decisions:
- issue: 家の者たちが「喜んだこと」と「信じたこと」のどちらに参与したか
  choice: 本文では、家中の者たちが看守とともに喜び、単数形の分詞に従って看守が神を信じる者となった、と訳す。
  alternative: 家の者全員も神を信じ、皆で喜んだ、と理解する。
  rationale: πανοικεὶ は最も自然には ἠγαλλιάσατο を修飾し、πεπιστευκώς は単数男性形で看守に一致する。ただし文脈と語順から、家全体の信仰を含意すると読む余地もあるため、脚注で曖昧さを保存した。
translation_notes:
  register: 明瞭な現代標準日本語。叙述の流れを自然にしつつ、喜びの強さと完了分詞の継続的結果を保った。世帯全体の信仰については本文で断定せず、原文の統語上の緊張を脚注に残した。
