revisions:
- from: 彼女は何日もの間、これを繰り返していた。パウロはすっかり悩まされ、振り向いてその霊[b]に言った。「イエス・メシア[a]の名によって命じる。この女から出て行け。」すると、霊はまさにその時、出て行った。
  to: 彼女は何日もの間、これを繰り返していた。パウロはひどく苦しみ、振り向いてその霊[b]に言った。「メシアであるイエス[a]の名によって命じる。彼女から出て行け。」すると、霊はまさにその時、出て行った。
  rationale: 原文の意味を変更せず、διαπονηθείςの心理的負担をより直接に表し、女性代名詞への不要な距離感を除いた。また、Χριστόςを「メシア」とする方針を保ちながら、日本語として称号関係が明瞭な語順に整えた。脚注記号はそれぞれ「イエス」と「霊」に対応している。
