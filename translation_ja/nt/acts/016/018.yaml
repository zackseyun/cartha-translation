id: ACT.16.18
reference: Acts 16:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: ja
  text: 彼女は何日もの間、これを繰り返していた。パウロはひどく苦しみ、振り向いてその霊[b]に言った。「メシアであるイエス[a]の名によって命じる。彼女から出て行け。」すると、霊はまさにその時、出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエス・キリストの名によって」。ギリシア語のΧριστός（クリストス）は「メシア」を意味する称号。
    reason: 称号Χριστόςについて、日本語で定着した別表記を示すため。
  - marker: b
    text: ギリシア語は単に「その霊」。文脈上、女奴隷に取りついていた占いの霊を指す。
    reason: 原文が「悪霊」などの限定語を用いていないことと、文脈上の指示対象を明確にするため。
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: 何日もの間、これを繰り返していた
  rationale: 未完了過去ἐποίειが表す、過去に継続・反復していた行為を、自然な現代日本語で明示した。
- source_word: διαπονηθεὶς
  choice: すっかり悩まされ
  rationale: 単なる軽い苛立ちではなく、繰り返される行為によって強く苦慮し、耐えかねる状態になったことを表す。怒りや同情のどちらかに限定しない表現とした。
- source_word: ἐπιστρέψας
  choice: 振り向いて
  rationale: 発言に先立つパウロの身体的な向き直りを簡潔かつ自然に表した。
- source_word: τῷ πνεύματι
  choice: その霊
  rationale: 原文どおり「霊」とし、「悪霊」や「悪鬼」という限定を本文に加えなかった。定冠詞と文脈上の特定性は「その」で表した。
- source_word: Παραγγέλλω σοι
  choice: 命じる
  rationale: 霊に対する権威ある命令として、簡潔で力のある日本語を選んだ。目的内容は続く直接命令「出て行け」で自然に示した。
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: イエス・メシアの名によって
  rationale: ἐν ὀνόματιを権威に基づく命令の定型表現「名によって」とし、Χριστόςは称号としての意味が見える「メシア」とした。
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: この女から出て行け
  rationale: 霊に向けた命令として自然な日本語にし、ἀπ’ αὐτῆςの女性代名詞は文脈上の対象を明確にする「この女」とした。
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: 霊はまさにその時、出て行った
  rationale: 省略された主語を日本語では「霊」と補い、αὐτῇ τῇ ὥρᾳの強調された即時性を「まさにその時」で保持した。
theological_decisions:
- issue: 命令句におけるΧριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスに付された称号として機能しているため、その意味を明示する「メシア」を本文に採用した。日本語で定着した「キリスト」は脚注に示した。
- issue: τῷ πνεύματιを悪しき存在と明示するか
  choice: その霊
  alternative: 悪霊／悪鬼
  rationale: この節の原文は修飾語なしにπνεῦμαとだけ記す。直前の文脈で占いの霊であることは分かるが、本文には原文以上の限定を加えなかった。
- issue: 霊が出た時点の表現
  choice: まさにその時
  alternative: その時刻に／即座に
  rationale: αὐτῇ τῇ ὥρᾳの字面と即時性の双方を保ち、「一時間以内」という誤解を避ける自然な日本語とした。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、命令場面の厳粛さと力を保った。「すっかり悩まされ」は、軽い苛立ちにも同情的な悲嘆にも一方的に固定せず、διαπονηθείςの強い心理的負担を伝える。脚注記号は該当語「メシア」「霊」の直後に配置した。
