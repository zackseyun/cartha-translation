  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: ja
  text: そこからフィリピへ行った。そこはマケドニアの一地区にある主要な都市[a]で、ローマの植民市である。[b] 私たちはこの町に幾日か滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「マケドニアのその地区の第一の都市」。ギリシア語の表現は解釈が難しく、「第一」は地位、重要性、または順序を指す可能性がある。
    reason: alternative_reading
  - marker: b
    text: ローマの支配下で特別な地位を与えられた植民市のこと。
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: そこからフィリピへ行った
  rationale: ギリシア語には移動動詞が明記されていないが、前節から続く旅程の省略表現である。日本語では文として自然かつ明瞭にするため「行った」を補った。地名は日本語聖書で定着した「フィリピ」とした。
- source_word: ἥτις ἐστὶν
  choice: そこは…であった
  rationale: 関係節を日本語として読みやすい独立文にし、都市についての説明という機能を保った。物語の時制に合わせて「であった」とした。
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: マケドニアのその地方の主要な都市
  rationale: πρώτη は「第一の」「主要な」のいずれとも理解し得る難しい語である。本文では、確定しにくい行政上の首都という意味を断定せず、卓越性を表す「主要な」を採用した。μερίς はここではマケドニア内の地域区分を指すため「その地方」とした。
- source_word: κολωνία
  choice: ローマの植民都市
  rationale: この語はフィリピが有したローマ植民市としての法的・政治的地位を指す。「植民地」では領域を想起させやすいため、都市の身分を明確にする「植民都市」とし、歴史的指示対象である「ローマ」を明示した。
- source_word: ἦμεν ... διατρίβοντες
  choice: 私たちは…滞在した
  rationale: 迂言的な未完了形が表す一定期間の継続を、自然で格調を保つ「滞在した」で表した。
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: この町に
  rationale: 指示語 ταύτῃ を「この」で保ち、直前のフィリピを指すことを明確にした。前文の「都市」との過度な反復を避けて「町」とした。
- source_word: ἡμέρας τινάς
  choice: 幾日か
  rationale: 期間が特定されていないことを保ち、「数日」ほど厳密な印象を与えない自然な日本語とした。
theological_decisions:
- issue: フィリピを説明する πρώτη の意味
  choice: 本文では「主要な都市」とする
  alternative: 「その地方の第一の都市」
  rationale: πρώτη が順位、重要性、旅程上の順序のどれを表すかは確定しにくい。本文は歴史的に議論のある行政的地位を断定せず、卓越性を伝える訳とし、字義的な別訳を注記して原文の曖昧さを保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、旅程記述の簡潔さと『私たち』資料の一人称を保持した。「主要な都市」は自然な本文としつつ、πρώτη の真正な曖昧さを脚注に残した。
