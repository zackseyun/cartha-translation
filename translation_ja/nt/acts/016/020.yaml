id: ACT.16.20
reference: Acts 16:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: ja
  text: そして二人を行政官たち[a]の前に引き出して、こう言った。「この者たちはユダヤ人[b]であり、私たちの町をひどく騒がせています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「法務官たち」とも訳せる。フィリピのようなローマ植民市の行政を担った高官。
    reason: cultural_note
  - marker: b
    text: 「ユダヤ地方の人々」とも訳せる。ここでは、民族的・宗教的な帰属を問題にした告発として「ユダヤ人」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: 前に引き出して
  rationale: アオリスト分詞が主動詞「言った」に先立つ動作を表す。拘束された二人を当局者のもとへ連行する文脈を、自然な日本語で示した。
- source_word: στρατηγοῖς
  choice: 行政官たち
  rationale: ローマ植民市フィリピの都市行政を担った高官を指す。「長官」より職務が伝わりやすく、専門的な称号については脚注で補った。
- source_word: ἐκταράσσουσιν
  choice: ひどく騒がせています
  rationale: 町に深刻な動揺や混乱を引き起こしているとの告発を表す現在形。接頭辞の強意を「ひどく」で示しつつ、現代日本語として自然にした。
- source_word: ἡμῶν τὴν πόλιν
  choice: 私たちの町
  rationale: 属格ἡμῶνの所有・連帯意識を保持し、告発者たちの市民的な帰属意識を自然に表した。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人
  rationale: この離散地の文脈では、地理的出身だけでなく民族的・宗教的帰属を示す語として理解するのが最も自然である。別訳の可能性は脚注に残した。
- source_word: ὑπάρχοντες
  choice: であり
  rationale: 二人がユダヤ人であることを告発の背景・根拠として添える分詞の簡潔な結び付きを保った。「なので」として因果を強く確定することは避けた。
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: この者たち
  rationale: パウロとシラスという男性二人を指す。告発の場にふさわしい指示的な響きを保ち、「こいつら」のような過度に侮蔑的な口調は加えなかった。
theological_decisions:
- issue: 敵対的な民族・宗教上の告発におけるἸουδαῖοιの訳
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: フィリピでは、ローマ市民としての地域的自己意識と対照させた民族的・宗教的な告発と読むのが自然である。ただし、これは告発者の発言であり、語り手がユダヤ人一般を非難しているのではない。
- issue: ὑπάρχοντεςが示す論理関係
  choice: 「ユダヤ人であり」と並置的に訳す
  alternative: 「ユダヤ人なので」と明示的な理由に訳す
  rationale: ユダヤ人であることが告発の根拠として機能する含みはあるが、分詞自体の関係を明示的な因果に限定せず、原文の簡潔さと緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法廷への連行と告発という場面に合う、簡潔で品位ある叙述にした。引用文では告発者の排他的な市民意識を保つ一方、原文以上の侮蔑表現は加えていない。
