revisions:
- from: 彼がその幻を見ると、私たちはすぐにマケドニアへ向かおうとした。神が彼らに福音を告げるために私たちを召してくださったのだと判断したからである。
  to: 彼がその幻を見たとき、私たちはすぐにマケドニアへ出発しようとした。神が彼らに福音を告げ知らせるために私たちを召されたのだと判断したのである。
  rationale: 「見たとき」により、幻を見る出来事が後続の行動に先立つ時間関係を明確にした。「出発しようとした」は ζητέω＋不定詞の企図・努力と ἐξελθεῖν の出発・移動を自然に表す。後半は、神が福音を告げ知らせるために一行を召された、と彼らが幻から結論したという原文の構造を直接示す。本文に注記を必要とするほどの曖昧さや本文異読はない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:56Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な意味は原文に忠実であり、「彼」から「私たち」への移行、即時性、マケドニアへの移動、幻から導かれた推論、神の召し、福音を告げる目的を保っている。ただし、συμβιβάζοντες は主節に伴う推論を表すため、「…からである」よりも「…と判断した」と直接結ぶほうが構文関係を明確に保てる。
  naturalness: 現行文は理解可能だが、第二文の「判断したからである」はやや説明的で硬く、前文との論理的なつながりも原文より強い因果説明に聞こえる。推論内容を「…のだと判断した」とするほうが、明瞭な現代標準日本語として自然である。
  terminology: 「幻」「福音」「召す」は本文の文脈に適する。「神が…召してくださった」も不自然ではないが、神を主語とする尊敬補助動詞を避け、「神が…召された」とすれば、落ち着いた聖書的文体を保ちながら簡潔になる。「福音を告げ知らせる」は εὐαγγελίσασθαι の告知行為をより明示する。
  issues:
  - severity: low
    issue: συμβιβάζοντες のつながりが「…からである」として独立した因果説明になっている。
    rationale: 原文は「マケドニアへ行こうとした」行動に伴う推論を分詞で表す。日本語では「…と判断した」と続けるほうが、推論の内容と行動との関係を過不足なく表せる。
  - severity: low
    issue: 「神が…召してくださった」は敬意を表すが、本文としてはやや重い。
    rationale: 「神が私たちを召された」とすれば、神の主導的な召命を維持しつつ、現代日本語の聖書本文として簡潔で安定した文体になる。
  revised_text: 彼がその幻を見たとき、私たちはすぐにマケドニアへ出発しようとした。神が彼らに福音を告げ知らせるために私たちを召されたのだと判断したのである。
  revised_footnotes: []
