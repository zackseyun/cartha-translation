id: ACT.16.10
reference: Acts 16:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: ja
  text: 彼がその幻を見たとき、私たちはすぐにマケドニアへ出発しようとした。神が彼らに福音を告げ知らせるために私たちを召されたのだと判断したのである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: 彼が……見ると
  rationale: 穏やかな物語の継続と時間的関係を、自然な現代日本語で表す。
- source_word: τὸ ὅραμα
  choice: その幻
  rationale: 文脈上すでに示された啓示的な幻を指すため、「その」を添えた。
- source_word: εὐθέως
  choice: すぐに
  rationale: 行動の即時性を明瞭かつ自然に伝える。
- source_word: ἐζητήσαμεν ἐξελθεῖν εἰς Μακεδονίαν
  choice: 私たちは……マケドニアへ向かおうとした
  rationale: ζητέω＋不定詞の企図・努力を「向かおうとした」で表し、ἐξελθεῖν εἰς の移動方向を自然な日本語にした。
- source_word: συμβιβάζοντες
  choice: 判断したからである
  rationale: 幻を根拠に推論して結論に達した意味を表す。日本語では理由節として結ぶと文の論理関係が明確になる。
- source_word: προσκέκληται ἡμᾶς ὁ θεὸς
  choice: 神が……私たちを召してくださった
  rationale: 神の先行する召しと、その結果が現在に及ぶ完了形の含みを保つ。「召す」は神による任命・招集に適した尊敬表現。
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: 彼らに福音を告げるために
  rationale: 動詞の意味を簡潔に表し、αὐτούςを福音告知の相手として自然に訳した。
theological_decisions:
- issue: 一人称複数「私たち」への叙述上の移行
  choice: 「私たちは」と明示して保持する
  alternative: 非人称的に言い換える
  rationale: 原文の明示的な一人称複数を保ちつつ、著者論について本文以上の解釈を加えない。
- issue: 神の導きを表す προσκέκληται
  choice: 「神が……私たちを召してくださった」
  alternative: 「神が私たちを導いておられる」
  rationale: 原語は一般的な導きではなく、呼び寄せる・召すという神の主体的行為を表す。
- issue: 完了形 προσκέκληται の時間的含意
  choice: 「召してくださった」
  alternative: 「召しておられる」
  rationale: 幻に先行する召しとその継続的効力を文脈から伝える。日本語では過去形が自然であり、判断の根拠としてなお有効であることは文全体から分かる。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「福音」「召す」は一般読者にも比較的通じる定着した聖書語として採用した。原文の「彼」から「私たち」への人称移行をそのまま保持した。
