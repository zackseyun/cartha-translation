  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: ja
  text: また彼らは、私たちローマ人には[a]受け入れることも行うことも許されていない慣習を宣べ伝えています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私たちがローマ人であるので」「ローマ人である私たちにとって」。ギリシア語の分詞句は、告発者たちがこれらの慣習を退ける理由として挙げている。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節から告発内容を続ける接続語として、現代日本語で自然な「また」とした。
- source_word: καταγγέλλουσιν
  choice: 宣べ伝えています
  rationale: 公に告げ知らせるという動詞の意味を保ちつつ、「教えている」「勧めている」ほど解釈を加えない表現とした。
- source_word: ἔθη
  choice: 慣習
  rationale: 共同体に定着した習わしや実践を指すため、「慣習」が文脈に適する。
- source_word: οὐκ ἔξεστιν
  choice: 許されていない
  rationale: 法的または社会的に認められないという告発者側の主張を表し、「違法である」と断定して実際のローマ法をめぐる問題を解決しないようにした。
- source_word: παραδέχεσθαι
  choice: 受け入れること
  rationale: 慣習を有効なものとして受容する意味を、広がりを残して自然に表す。
- source_word: οὐδὲ ποιεῖν
  choice: 行うことも
  rationale: 慣習を実行する意味であり、日本語では先行する否定と合わせて「受け入れることも行うことも」とするのが自然である。
- source_word: Ῥωμαίοις οὖσιν
  choice: 私たちがローマ人である以上
  rationale: 分詞句が告発者の挙げる禁止の理由を示すことを明確にしつつ、「ローマ人として」などの可能な表現は注で示した。
theological_decisions:
- issue: 告発における禁止の性質
  choice: 「許されていない」として法的・社会的な禁止の響きを保つが、その主張を語り手が事実として認定しているとは表現しない。
  alternative: 「違法である」または「正しくない」とする。
  rationale: 本文は告発者の発言を報告している。「違法」は実際のローマ法上の判断を強めすぎ、「正しくない」は法的・公的な響きを弱める。
translation_notes:
  register: 明快な現代標準日本語を用い、告発の公的・法的な調子を保った。「宣べ伝える」はやや改まった語だが、καταγγέλλω の公的に告知する含意に適し、聖書本文としても理解可能である。
