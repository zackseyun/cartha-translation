id: ACT.16.16
reference: Acts 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: ja
  text: さて、私たちが祈りの場所へ向かっていたとき、ピュトンの霊[a]につかれた、ある奴隷の少女が私たちに出会った。彼女は占い[b]をして、主人たちに多くの利益をもたらしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「占いの霊」。ギリシア語は「ピュトンの霊」で、神託や占いと結びついた文化的に固有の表現です。
    reason: 文化固有語の説明と解釈的別訳の提示。
  - marker: b
    text: 別訳「卜占を行い」。
    reason: μαντεύομαι のより形式的な語義を示す。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: さて、…とき
  rationale: ルカ文書に多い出来事の導入を、古風な逐語表現を避けつつ自然な物語上の転換として表した。
- source_word: πορευομένων ἡμῶν
  choice: 私たちが…向かっていたとき
  rationale: 属格絶対構文が示す、主出来事と同時進行の背景動作を継続的に表した。
- source_word: εἰς τὴν προσευχὴν
  choice: 祈りの場所へ
  rationale: 定冠詞を伴う προσευχή は、この文脈では祈る行為だけでなく、祈りのために定められた場所を指す可能性が高い。
- source_word: παιδίσκην τινά
  choice: 一人の奴隷の少女
  rationale: παιδίσκη の若い女性という含意と隷属的身分の双方を示す。複数の主人が彼女から利益を得ている文脈にも合う。
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: ピュトンの霊につかれた
  rationale: 文化的に固有な πύθων を保持しつつ、霊を有している状態を自然な日本語で表した。単なる能力ではなく霊的存在との関係を示す。
- source_word: ὑπαντῆσαι ἡμῖν
  choice: 私たちに出会った
  rationale: 出来事を導く不定詞を、日本語の主たる述語として簡潔に表した。意図的に会いに来たかどうかは断定しない。
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: 多くの利益をもたらしていた
  rationale: 経済的収益と未完了過去の継続性を明確に表した。
- source_word: τοῖς κυρίοις αὐτῆς
  choice: 主人たちに
  rationale: ここでの κύριοι は神的称号ではなく、奴隷の少女に所有権・支配権を行使する複数の者を指す。
- source_word: μαντευομένη
  choice: 占いをして
  rationale: 予言的・託宣的な卜占行為を、現代の一般読者に分かりやすい語で表した。
theological_decisions:
- issue: πνεῦμα πύθωνα の文化的・霊的含意をどう表すか
  choice: ピュトンの霊
  alternative: 占いの霊
  rationale: ギリシア語にある文化固有の名称を本文に残し、一般化した解釈は脚注に置くことで、原文の異質さと意味の幅を保持した。
- issue: παιδίσκη の隷属的身分を明示するか
  choice: 奴隷の少女
  alternative: 召使いの少女
  rationale: 複数の主人が少女の活動から収益を得るという搾取の文脈上、隷属的身分を明示するのが適切である。
- issue: 霊を「持つ」という表現をどう自然化するか
  choice: 霊につかれた
  alternative: 霊を持つ
  rationale: 日本語として霊的支配・憑依を自然に示す一方、悪霊論の詳細や本人の責任について本文以上の断定は加えない。
translation_notes:
  register: 明快な現代標準日本語を用い、物語文として自然でありながら品位を保った。「ピュトン」は読者に馴染みが薄いため脚注で説明し、「奴隷」は文脈上重要な社会的身分を曖昧にしないため採用した。
