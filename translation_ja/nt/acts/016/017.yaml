source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: ja
  text: この女性は、パウロと私たちの後をついて来ながら、こう叫び続けた。「この人たちは、いと高き神の奴隷であり、あなたがたに救いの道[a]を告げ知らせている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救いの道」と訳したギリシア語では「道」に冠詞がなく、「一つの救いの道」とも「その救いの道」とも理解し得る。日本語の本文は、そのどちらにも限定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: 後について来て
  rationale: 接頭辞を含む動詞の「後について行く」という意味を自然な日本語で表した。未完了過去の主動詞と結びつく継続性は「叫び続けた」によって文全体に反映した。
- source_word: ἔκραζεν
  choice: 叫び続けた
  rationale: 未完了過去が示す継続・反復と、動詞が持つ大声で叫ぶ意味をともに表す。
- source_word: δοῦλοι
  choice: 奴隷
  rationale: 単なる奉仕者ではなく神に属する者という所有・従属関係を保つため、「僕」や「仕える者」ではなく「奴隷」とした。
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: いと高き神
  rationale: 神の称号としての最上級を、現代日本語でも理解できる荘重な定型表現で示した。
- source_word: καταγγέλλουσιν
  choice: 告げ知らせている
  rationale: 公に宣言・布告する意味と現在時制の進行性を、平明な日本語で表した。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 告知の聞き手を示す複数二人称与格として訳した。
- source_word: ὁδὸν σωτηρίας
  choice: 救いの道
  rationale: 無冠詞のὁδόνは必ずしも不定を意味せず、日本語には冠詞の区別もないため、定・不定を過度に固定せず自然に曖昧さを保つ。
theological_decisions:
- issue: ὁδὸν σωτηρίαςの定性
  choice: 救いの道
  alternative: 救いに至る一つの道／その救いの道
  rationale: ギリシア語の無冠詞名詞句だけから不定または定と断定できない。日本語の無冠詞表現「救いの道」は両方の可能性を自然に保持し、この節だけで排他性または非排他性を明示しない。
- issue: δοῦλοιが表す神への関係
  choice: いと高き神の奴隷
  alternative: いと高き神の僕／仕える者
  rationale: 現代日本語では強い語だが、原語が示す隷属と所属を弱めず、話者の発言にある神学的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、神の称号には定着した荘重な表現「いと高き神」を用いた。「奴隷」は原語の所有・従属の含意を保つ意図的な直截表現。引用の後に脚注記号を置き、対象が「救いの道」であることを明確にした。
