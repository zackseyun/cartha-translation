id: ACT.16.32
reference: Acts 16:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: ja
  text: そして二人は、彼と、その家にいたすべての人に、主のことば[a]を語った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主についての知らせ」。ギリシア語の「主のことば」は、主に属することば、主から来ることば、または主についてのことばを意味し得る。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「彼に、その家にいたすべての人と一緒に、主のことばを語った」。
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: 語った
  rationale: λαλέωのアオリスト能動態。ここでは福音の内容を相手に伝える行為を表す。「宣べ伝えた」では公的な布告の含みが強くなりすぎるため、自然で十分に重みのある「語った」とした。
- source_word: αὐτῷ
  choice: 彼に（「彼と……人に」の形で表現）
  rationale: 看守を指す与格であり、λαλέωの伝達相手を示す。日本語では後続する聞き手とまとめ、「彼と、その家にいたすべての人に」とした。
- source_word: τὸν λόγον
  choice: ことば
  rationale: ここでは語られた福音の知らせを指す。新約聖書に共通するλόγοςの表現を保ちつつ、現代日本語で硬すぎない「ことば」とした。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: 属格が、主から来ることば、主に属することば、または主についてのことばを示し得るため、「主についての」と限定せず、原文の幅を保つ「主の」とした。
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: その家にいたすべての人に
  rationale: σύνは直訳すれば「……と一緒に」だが、文脈上は家にいた全員もことばを聞く相手である。日本語では受け手として自然に明示し、原文の構造は脚注に残した。
- source_word: οἰκίᾳ
  choice: 家
  rationale: οἰκίαは建物としての家と家の者たちの双方を表し得る。ここでは「その家にいた人々」という原文の具体的な言い方を保った。
theological_decisions:
- issue: 「主のことば」（τὸν λόγον τοῦ κυρίου）の属格の含み
  choice: 「主のことば」とし、関係を限定しない
  alternative: 「主についての知らせ」または「主からのことば」
  rationale: ギリシア語の属格は、ことばが主から来ること、主に属すること、または主を内容とすることを示し得る。本文では一つに決めず、脚注で可能性を示した。
- issue: 家にいた人々が語りかけの対象であったか、単に同席していたか
  choice: 彼と家にいたすべての人を、ことばを語られた相手として表現した
  alternative: 「彼に、その家にいたすべての人と一緒に、主のことばを語った」
  rationale: σύνの形式自体は「一緒に」だが、文脈と構文から、家にいた人々も聞き手に含まれるのが自然である。ただし原文に近い構文を脚注に掲げた。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、「主」「ことば」「語った」によって使徒言行録にふさわしい落ち着いた格調を保った。「二人」は直前のパウロとシラスを受ける複数主語を自然に示す。
