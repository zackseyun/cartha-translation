base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: ja
  text: すると突然、大きな地震が起こり、そのため牢獄の土台が揺れ動いた。たちまち、すべての扉が開き、全員の鎖が外れた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全員の拘束具が緩んだ」とも訳せる。ギリシア語の「δεσμά」は拘束具や鎖を意味し、「ἀνέθη」は「緩んだ」「解かれた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: 突然
  rationale: 出来事の唐突さを示す副詞であり、現代日本語の物語文として自然にその勢いを伝える。
- source_word: σεισμὸς ἐγένετο μέγας
  choice: 大きな地震が起こり
  rationale: γίνομαιを伴う表現を自然な日本語にしつつ、μέγαςを過度に解釈せず「大きな」とした。
- source_word: ὥστε σαλευθῆναι
  choice: 牢獄の土台が揺れ動いた
  rationale: ὥστεの結果の意味を、前件から続く日本語の叙述で明確に表した。受動形は日本語では自然な自動詞表現にした。
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: 牢獄の土台
  rationale: θεμέλιαを建造物の基礎部分として「土台」、δεσμωτήριονを明瞭で品位ある「牢獄」と訳した。
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 直ちに生じたことを表す副詞。冒頭の「突然」と語調を変えながら即時性を保つ。
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: すべての扉が開き
  rationale: 受動態の形を日本語で不自然に強調せず、出来事として自然な「開き」で表し、πᾶσαιの包括性を保った。
- source_word: πάντων τὰ δεσμὰ
  choice: 全員の鎖
  rationale: πάντωνを囚人全員を指す所有関係として簡潔に訳し、δεσμάは拘束具を具体的に示す「鎖」とした。
- source_word: ἀνέθη
  choice: 外れた
  rationale: 拘束具が緩められ、解かれた結果を簡潔に表す。動作主を本文以上に特定しない。
