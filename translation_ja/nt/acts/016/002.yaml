id: ACT.16.2
reference: Acts 16:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: ja
  text: 彼は、リステラとイコニオンにいる兄弟たちから良い評判を得ていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ここでは、その土地にいる仲間の信者たちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 彼は
  rationale: 関係代名詞は前節のテモテを指す。単独の節として自然な現代日本語になるよう、「彼は」とした。
- source_word: ἐμαρτυρεῖτο
  choice: 良い評判を得ていた
  rationale: μαρτυρέωの未完了過去・受動態で、周囲から継続的に好意的な証言を受けていたことを表す。直訳的な「証言されていた」より文脈上の意味が明瞭である。
- source_word: ὑπὸ
  choice: から
  rationale: 受動態に伴う行為者を示す。日本語では評判の出どころを自然に表す「から」が適切である。
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: リステラとイコニオンにいる
  rationale: 定冠詞を伴う前置詞句が「兄弟たち」を限定し、両都市にいる共同体を指す構造を保った。
- source_word: ἀδελφῶν
  choice: 兄弟たち
  rationale: ギリシャ語の男性複数形を本文に反映した。初期キリスト教共同体では男女を含む仲間の信者を指し得るため、その含意を脚注で示した。
theological_decisions:
- issue: キリスト者共同体を指すἀδελφῶνの性別表現
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 本文では原文の男性複数形を保ちつつ、この語が共同体の男女双方を含み得ることを脚注で明示し、語形と文脈上の包括性の双方を保持した。
translation_notes:
  register: 明瞭で自然な現代標準語を用いた。「良い評判を得ていた」により、未完了過去の継続的な評判と受動的な意味を簡潔に表した。地名は一般的な聖書表記に従った。
