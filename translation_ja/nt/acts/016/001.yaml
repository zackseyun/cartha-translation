id: ACT.16.1
reference: Acts 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: ja
  text: パウロはまた、デルベとリステラに到着した。すると、そこにテモテという一人の弟子がいた。彼は、信者[a]であるユダヤ人の母と、ギリシア人の父との子であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忠実なユダヤ人女性」。ここで「信者」と訳したギリシア語には、「忠実な」という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν
  choice: 行った
  rationale: この旅行記事では、ある場所に到着することを表す。直前から旅を続けるパウロの動きを、現代日本語として自然に示した。主語の「パウロ」は文脈から補った。
- source_word: δὲ καὶ
  choice: さらに
  rationale: 物語の継続と追加の意味を簡潔に表した。
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: デルベに行き、リステラにも行った
  rationale: 二つの地名の前に繰り返される εἰς と、両方を訪れた旅程を自然な日本語で表した。
- source_word: καὶ ἰδοὺ
  choice: すると
  rationale: 注意を新しい人物へ向ける談話上の働きを保ちつつ、「見よ」のような不自然に古風な表現を避けた。
- source_word: μαθητής τις ἦν ἐκεῖ
  choice: そこに……一人の弟子がいた
  rationale: τις が導入する、まだ名を挙げられていない特定の人物を「一人の」で示し、ἐκεῖ の場所の情報も保持した。
- source_word: ὀνόματι Τιμόθεος
  choice: テモテという
  rationale: 名前を示す与格表現を、明瞭で自然な現代日本語にした。
- source_word: γυναικὸς Ἰουδαίας πιστῆς
  choice: 母は信者であるユダヤ人で
  rationale: πιστή はこの文脈ではキリストを信じる者を指す可能性が高い。「信仰深い」ではなく「信者」として共同体上の意味を明確にした。
- source_word: πατρὸς δὲ Ἕλληνος
  choice: 父はギリシア人だった
  rationale: 「息子」に続く省略的な属格句を日本語の独立した述語に展開し、δέ の対照を「母は……で、父は……」という構文で表した。Ἕλλην は広い意味の「異邦人」ではなく「ギリシア人」とした。
theological_decisions:
- issue: テモテの母を修飾する πιστῆς の意味
  choice: 信者である
  alternative: 忠実な
  rationale: πιστός には「信じている」と「忠実な」の両義があるが、使徒言行録における用法と、弟子テモテの家族背景を紹介する文脈では、キリストを信じる者という意味がより自然である。ただし語彙上可能な別解は脚注に残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「見よ」の直訳は避けながら、人物の登場を際立たせる ἰδού の働きを「すると」で示した。民族的背景の対照は、簡潔な並列構文によって保持した。
