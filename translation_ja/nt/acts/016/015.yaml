revisions:
- from: 彼女とその家の者たちがバプテスマを受けると、彼女はこう言って私たちを招いた。「私を主に忠実な者[a]とお認めになるのでしたら、私の家に来て、お泊まりください。」こうして彼女は熱心に迫り、私たちを承知させた。
  to: 彼女とその家の者たちがバプテスマを受けると、彼女はこう言って私たちを招いた。「あなたがたが私を主に忠実な者[a]とお認めくださったのでしたら、私の家に来て、お泊まりください。」彼女は強く勧めて、私たちを承諾させた。
  rationale: 条件節を「お認めくださったのでしたら」として、完了形κεκρίκατέが示す既になされた判断を反映した。また、結語を「強く勧めて、私たちを承諾させた」と改め、παρεβιάσατοの粘り強い強い勧めと、その結果として一行が応じたことを、現代日本語としてより自然に表した。本文が明示しない家の者たちの構成や信仰状態については補っていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:55Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として原文の出来事と語義をよく伝えている。οἶκοςを前半では家に属する人々、後半では住居として訳し分けた点、またπαρεβιάσατοの強い勧めを物理的強制にしない点は適切である。ただし、κεκρίκατέ（完了形）の「あなたがたが私を…と判断した」という条件の内容が、「お認めになるのでしたら」では現在・将来の判断のようにも読め、やや弱まる。
  naturalness: 明瞭な現代標準日本語で、丁寧な招待の口調も自然である。「熱心に迫り、私たちを承知させた」は意味は通るが、「承知させた」はやや不自然で、相手が同意した結果を硬く説明する響きがある。「私たちはついに応じた／彼女は私たちを強く勧めて承諾させた」のほうが自然である。
  terminology: 「バプテスマ」「主」は一貫しており問題ない。「主に忠実な者」はπιστήの有力な訳語だが、「主を信じる者」という脚注代案との対応を保つため、本文は維持できる。脚注の「信じている」は形容詞の可能性として不自然ではないが、この構文では「信じる者」のほうが明確である。
  issues:
  - severity: medium
    issue: κεκρίκατέの完了相が訳文で十分に表れない。
    rationale: κεκρίκατέは「あなたがたが（すでに）判断した／認めた」の意であり、「お認めになるのでしたら」は未確定の現在・将来判断にも読める。日本語では「お認めくださったのでしたら」とすれば、完了した評価を自然に反映できる。
  - severity: low
    issue: 「私たちを承知させた」がやや不自然。
    rationale: παρεβιάσατοは強く押して相手を応じさせたことを示す。日本語では「強く勧めて、私たちを承諾させた」または「強く勧めたので、私たちは承諾した」がより自然である。
