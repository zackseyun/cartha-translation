source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: ja
  text: 彼女とその家の者たちがバプテスマを受けると、彼女はこう言って私たちを招いた。「あなたがたが私を主に忠実な者[a]とお認めくださったのでしたら、私の家に来て、お泊まりください。」彼女は強く勧めて、私たちを承諾させた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主を信じる者」。ギリシア語の形容詞には、「忠実な」「信頼できる」「信じる者」という意味がある。
    reason: πιστήの語義上の幅を保ち、文脈上可能な別訳を示すため。
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: 彼女とその家の者たちがバプテスマを受けると
  rationale: 単数形の受動動詞はまず彼女を受けるが、続く「その家の者たちも」を含めた出来事として、自然な日本語の複数表現にした。οἶκος はここでは建物でなく家に属する人々を指す。構成員の年齢や信仰状態は本文が明記しないため補わない。
- source_word: παρεκάλεσεν
  choice: 私たちを招いた
  rationale: 宿泊を求める具体的な文脈では「招いた」が自然である。結びの強い動詞との違いを保つため、ここでは過度に強い語を避けた。
- source_word: πιστὴν τῷ κυρίῳ
  choice: 主に忠実な者
  rationale: πιστή が持つ「忠実な・信頼できる・信じる者」という意味の幅のうち、与格 τῷ κυρίῳ との関係を自然に示しつつ、信仰と忠誠の両面を残す表現とした。別の可能性は脚注に示す。
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: 私の家に来て、お泊まりください
  rationale: ここでの οἶκος は先の用例と異なり、実際の住居を指す。分詞と命令形の連続を、丁寧な招待として自然な現代日本語にした。
- source_word: παρεβιάσατο ἡμᾶς
  choice: 彼女は熱心に迫り、私たちを承知させた
  rationale: παραβιάζομαι の強い働きかけを示しながら、物理的強制と誤解されやすい「強制した」は避けた。最終的に一行が招待に応じたことも表す。
theological_decisions:
- issue: 彼女の家の者たちのバプテスマから導かれ得る後代の教派的推論
  choice: 「彼女とその家の者たちがバプテスマを受けると」と、物語の報告だけを訳す
  alternative: 幼児が含まれた、または全員が個別に信仰告白したと訳文で示唆する
  rationale: 本文は家に属する者たちの構成、年齢、各人の信仰状態を説明していないため、いずれの立場も訳文に持ち込まない。
- issue: πιστή における信仰と忠実さの関係
  choice: 主に忠実な者
  alternative: 主を信じる者／主の前に信頼できる者
  rationale: ギリシア語形容詞は信じること、忠実であること、信頼に値することの意味領域を持つ。「忠実」は関係的・倫理的含意を保ち、脚注で信仰者という解釈も明示する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「バプテスマ」は初期キリスト教の行為を指す一般的な聖書用語として保持した。「家の者たち」と「私の家」を訳し分け、人々の集団と住居の違いを明確にした。
