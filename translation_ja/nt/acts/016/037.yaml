id: ACT.16.37
reference: Acts 16:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: ja
  text: しかし、パウロは彼らに言った。「彼らは、ローマ市民である私たちを、有罪判決も受けていないのに[a]、公然と打って牢に入れた。それなのに今、ひそかに私たちを追い出そうというのか。いや、そうはいかない。彼ら自身が来て、私たちを連れ出すのだ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「有罪判決を受けていない私たちを」。
    reason: lexical_alternative
  - marker: b
    text: 「連れ出す」は「外へ導き出す」「外へ伴い出す」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη πρὸς αὐτούς
  choice: 彼らに言った
  rationale: 物語中の標準的な発話表現として、簡潔で自然な過去形にした。
- source_word: Δείραντες ἡμᾶς δημοσίᾳ
  choice: 私たちを、公衆の面前で打ちたたいて
  rationale: アオリスト分詞の先行動作を日本語の連用形で表した。δείρω は刑罰として打つことを指し得るが、方法を限定しすぎない「打ちたたく」とした。δημοσίᾳ の公然性は「公衆の面前で」で明示した。
- source_word: ἀκατακρίτους
  choice: 裁判で有罪とすることもなく
  rationale: 語の中心義は「有罪判決を受けていない」。法的手続きを経ないまま処罰されたという文脈上の訴えを明瞭にしつつ、「裁判なしに」より原語の判決面を保った。
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: ローマ市民である私たちを
  rationale: 直訳的な「ローマ人である者たち」ではなく、この抗議の核心である法的身分を「ローマ市民」とした。ἀνθρώπους は日本語では重複するため代名詞に統合した。
- source_word: ἔβαλαν εἰς φυλακήν
  choice: 牢に入れた
  rationale: 日本語では「牢に投げ込んだ」も可能だが、βάλλω の慣用的な収監の意味を自然かつ簡潔に表した。
- source_word: λάθρᾳ ἡμᾶς ἐκβάλλουσιν
  choice: ひそかに私たちを追い出そうというのか
  rationale: λάθρᾳ は「ひそかに」、ἐκβάλλω は単なる釈放でなく厄介払いする響きを持つため「追い出す」とした。現在形の切迫感は「追い出そうというのか」で表した。
- source_word: οὐ γάρ
  choice: 断じて許さない
  rationale: 強い拒絶を、現代日本語で自然かつ威厳ある表現にした。字義的には「いや、そうはいかない」に近い。
- source_word: ἐλθόντες αὐτοὶ
  choice: 彼ら自身がここへ来て
  rationale: αὐτοὶ の強調を「自身」で保持し、移動先は文脈上の牢であるため、日本語として自然な「ここへ」を補った。
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: 私たちを連れ出すがよい
  rationale: 三人称命令の要求を「～するがよい」で表し、ἐξάγω の「外へ導き出す」を「連れ出す」とした。
theological_decisions:
- issue: パウロのローマ人としての法的身分
  choice: 「ローマ市民」と明示する
  alternative: 「ローマ人」
  rationale: ここでの主眼は民族的出自ではなく、むち打ちや拘禁に関する法的保護を伴う市民身分である。文脈に即して法的意味を明確にした。
- issue: ἀκατακρίτους の法的意味
  choice: 「裁判で有罪とすることもなく」
  alternative: 「裁判もせずに」または「有罪判決を受けていないのに」
  rationale: 原語は「有罪と宣告されていない」を意味する。「裁判で」を加えることで現代の読者に法的状況を伝えつつ、有罪判決の欠如という語義を保持した。
- issue: パウロの拒絶の強さ
  choice: 「断じて許さない」
  alternative: 「いや、そうはいかない」
  rationale: οὐ γάρ の強い否定を保持した。権力への反抗という教義的含意を加えず、この場面での不当な扱いに対する拒絶として表現した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法的抗議の厳粛さとパウロの強い拒絶を保った。「公衆の面前」「断じて許さない」「連れ出すがよい」により威厳を持たせつつ、古語調には寄せすぎていない。
