id: ACT.16.14
reference: Acts 16:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: ja
  text: さて、テアティラの町出身で紫布を商う、リディアというある女性が、耳を傾けていた。彼女は神を敬う人[a]であった。主は彼女の心を開き、パウロが語ることに注意を向けるようにされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を礼拝する人」とも訳せる。この表現は、イスラエルの神を信奉していた異邦人を指す場合がある。
    reason: 語義の別訳と歴史的・宗教的含意を示すため。
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: さて、……女が
  rationale: καίの物語を進める働きとτιςの不定性を、現代日本語として自然な導入で表した。「ある女」と逐語的にするよりも、後続する固有名によって人物が初めて紹介される流れを自然に保つ。
- source_word: ὀνόματι Λυδία
  choice: リディアという名の
  rationale: ὀνόματιと人名から成る表現を、明瞭で自然な日本語にした。
- source_word: πορφυρόπωλις
  choice: 紫布を商う
  rationale: 紫に染めた布または紫染めの商品を扱う商人を指す。商品を衣服に限定せず、一般読者にも分かりやすい「紫布」とした。
- source_word: πόλεως Θυατείρων
  choice: テアティラ市出身で
  rationale: 属格が表す出自を自然な日本語で示し、「市」によりπόλιςも反映した。
- source_word: σεβομένη τὸν θεόν
  choice: 神を敬う人
  rationale: イスラエルの神を崇敬する異邦人を指し得る表現。本文では専門的な呼称に固定せず、礼拝と敬虔の含意を自然に伝える。
- source_word: ἤκουεν
  choice: 話を聞いていた
  rationale: 未完了過去の継続的な様相を「聞いていた」で表した。目的語は文脈と後半の「パウロの語ること」から自然に補った。
- source_word: ὁ κύριος
  choice: 主
  rationale: κύριοςの通常の聖書的訳語を用い、指示対象を「神」または「主イエス」と本文で限定しなかった。
- source_word: διήνοιξεν τὴν καρδίαν
  choice: 彼女の心を開き
  rationale: 内面的な受容を可能にするという原文の比喩を、そのまま自然な日本語で保持した。
- source_word: προσέχειν
  choice: 注意を向けるように
  rationale: 注意を集中して心に留める意味を表す。「応じる」では結果を読み込みすぎるため避けた。
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: パウロの語ることに
  rationale: 受動分詞句の内容とパウロの行為者性を、簡潔で自然な日本語にした。進行中の発話であることは現在形の連体表現「語る」によって示した。
theological_decisions:
- issue: ὁ κύριοςの指示対象
  choice: 「主」とだけ訳す
  alternative: 「主イエス」または「神」
  rationale: ギリシア語本文はὁ κύριοςとのみ記す。使徒言行録ではキリストを指し得る一方、ここでは神的働きが前面に出ているため、本文以上に指示対象を限定せず、原文の開かれた表現を保った。
- issue: σεβομένη τὸν θεόνが一般的な描写か、一定の宗教的立場を表す呼称か
  choice: 本文を「神を敬う人」とし、異邦人信奉者を指し得ることを脚注で示す
  alternative: 「神を礼拝していた」または専門的呼称としての「神を恐れる人」
  rationale: この句は礼拝・崇敬の行為を述べると同時に、イスラエルの神を信奉する異邦人を指す半ば定型的な表現である可能性がある。本文ではその両面を閉ざさず、脚注で歴史的含意を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体とした。一文が過度に長くならないよう二つに分けたが、出来事の順序と主の働きとの結びつきは保った。脚注記号は、その説明対象である「神を敬う人」の直後に置いた。
