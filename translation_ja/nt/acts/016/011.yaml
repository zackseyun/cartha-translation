id: ACT.16.11
reference: Acts 16:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: ja
  text: そこで私たちはトロアスから船出し、サモトラケへまっすぐ航行し、翌日にはネアポリスへ向かった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: 船出し
  rationale: ἀνάγωの航海用法「沖へ出る、出帆する」を、分詞による行為の連続を保ちながら自然な現代日本語で表した。
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語上の展開を示す。強い論理的帰結に限定せず、旅程の進行に合う表現とした。
- source_word: ἀπὸ Τρῳάδος
  choice: トロアスから
  rationale: ἀπόの出発点を明示し、地名Τρῳάςは慣用的な日本語音写とした。
- source_word: εὐθυδρομήσαμεν
  choice: まっすぐ航行し
  rationale: 追い風などで針路を変えず直航するという語の方向的・航海的意味を保った。原文の一人称複数も「私たちは」で明示した。
- source_word: εἰς Σαμοθρᾴκην
  choice: サモトラケへ
  rationale: εἰςの目的地を「へ」で示し、地名を日本語の慣用形で音写した。
- source_word: τῇ δὲ ἐπιούσῃ
  choice: 翌日には
  rationale: 時間を示す与格表現を自然に訳し、δέによる次の旅程への軽い移行も文の連続によって表した。
- source_word: εἰς Νέαν Πόλιν
  choice: ネアポリスへ向かった
  rationale: 省略された航行動詞を日本語では補って目的地への移動を明瞭にした。Νέα Πόλιςは意味訳せず、確立した地名として音写した。
