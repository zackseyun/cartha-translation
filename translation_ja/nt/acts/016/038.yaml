revisions:
- from: すると、警吏たちはこの言葉を行政官たち[a]に伝えた。行政官たちは、二人がローマ人[b]だと聞いて恐れた。
  to: そこで、杖を持つ役人たち[c]は、この言葉を市の執政官たち[a]に報告した。執政官たちは、彼らがローマ人[b]であると聞いて恐れた。
  rationale: 原語の制度的・具体的語彙を、現代日本語で理解可能な範囲で本文に反映した。「ローマ人」は字義どおりに保ち、ローマ市民権という文脈上の含意は脚注で説明した。また、原文に明示されない「二人」は「彼ら」に改めた。
