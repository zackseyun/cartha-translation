  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: ja
  text: そこで、杖を持つ役人たち[c]は、この言葉を市の執政官たち[a]に報告した。執政官たちは、彼らがローマ人[b]であると聞いて恐れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「市の執政官たち」は、στρατηγοίを訳した語。ローマ植民市フィリピの主要な都市公職者を指す。
    reason: cultural_note
  - marker: b
    text: 直訳は「ローマ人」。この法的文脈では、ローマ市民としての保護された身分が含意されている。
    reason: lexical_alternative
  - marker: c
    text: 「杖を持つ役人たち」は、執政官に仕え、権威のしるしとして杖を携えた随員を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 伝えた
  rationale: 使者が受けた内容を公的な上位者へ報告する場面。現代日本語として自然であり、伝達の意味を明確に表す。
- source_word: στρατηγοῖς
  choice: 行政官たち
  rationale: ローマ植民市フィリピの主要な都市役人を指す。専門的な官職名に限定せず、公的権限を持つ役人であることが分かる表現とした。
- source_word: ῥαβδοῦχοι
  choice: 警吏たち
  rationale: 行政官に仕え、杖を携えた執行吏を指す。直訳の「杖持ち」より役割が伝わりやすく、文脈にも合う。具体的な文化的背景は脚注で補う。
- source_word: τὰ ῥήματα ταῦτα
  choice: この言葉
  rationale: 直前に告げられた発言内容を指す。複数形を日本語で不自然に再現せず、集合的に「この言葉」とした。
- source_word: ἐφοβήθησαν
  choice: 恐れた
  rationale: 彼らが知らせを受けて恐怖を抱いたというアオリストの反応を、解釈を加えず簡潔に表す。
- source_word: ἀκούσαντες
  choice: 聞いて
  rationale: 分詞の時間的・因果的つながりを自然な日本語で示し、知らせを聞いたことが恐れの契機であることを保つ。
- source_word: Ῥωμαῖοί
  choice: ローマ人
  rationale: ギリシア語の字義を保つ。法的文脈ではローマ市民であることを意味するため、その点は脚注で説明する。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述調。「二人」を補って、ローマ人である者がパウロとシラスだと日本語で明確にした。警吏の歴史的役割は本文の可読性を優先し、必要な背景を語彙判断で示した。
