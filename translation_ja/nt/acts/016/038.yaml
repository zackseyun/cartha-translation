  naturalness: 「そこで」「報告した」「…であると聞いて恐れた」は明瞭で自然な現代標準日本語です。「杖を持つ役人」は多少説明的ですが、歴史的職掌を過度に専門用語化せず、原語の具体性を保てます。
  terminology: στρατηγοίは「市の執政官たち」とし、都市の指導的公職者であることを本文と注で示します。ῥαβδοῦχοιは「杖を持つ役人たち」とし、注で執政官の随員であることを説明します。Ῥωμαῖοιは本文では「ローマ人」を維持し、市民権という法的含意は注に留めます。
