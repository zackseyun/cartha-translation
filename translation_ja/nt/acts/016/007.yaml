  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: ja
  text: しかし、彼らがミシアまで来たとき、ビティニアへ入ろうとしていたが、イエスの霊は彼らがそこへ行くのを許さなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: 来ると
  rationale: アオリスト分詞の時間的用法を、出来事の順序が自然に伝わる現代日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 物語の展開における緩やかな対照を示す。直前の旅程から、進路を阻まれる出来事への転換を明確にする。
- source_word: κατὰ τὴν Μυσίαν
  choice: ミシア地方まで
  rationale: 地理的表現として、ミシアの境域に達したことを自然に示す。ただし、κατάの厳密な含意には「近く」「沿い」などの可能性もあるため、脚注で曖昧さを保持した。
- source_word: ἐπείραζον
  choice: 入ろうとした
  rationale: 未完了過去が示す企て・試みを簡潔な日本語で表した。継続性を強調する「入ろうとしていた」も可能だが、文脈では実行を試みたことが中心である。
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: ビティニア地方へ入ろう
  rationale: εἰςによる地域内部への移動と、πορεύομαιの旅・進行の意味を自然に表した。
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: それを許さなかった
  rationale: ἐάωの「許す」を過度に強めずに訳し、「それ」で彼らがビティニアへ入る企てを受けた。
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: イエスの霊
  rationale: 原文の珍しいキリスト論的表現をそのまま保持し、「聖霊」などのより一般的な表現へ同化させなかった。
theological_decisions:
- issue: τὸ πνεῦμα Ἰησοῦ の訳し方
  choice: イエスの霊
  alternative: 聖霊／御霊
  rationale: 原文は明示的に「イエスの」と述べるため、その語形と神学的な含みを保持し、説明的な調和を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、地名には「地方」を添えて地域名であることを分かりやすくした。「イエスの霊」は原文特有の表現として保持した。
