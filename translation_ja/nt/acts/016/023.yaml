  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: ja
  text: そして、二人を何度も打ちたたいた後[a]、牢に投げ込み[b]、牢番に、二人を厳重に監禁しておくよう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「多くの打撃を加えた」。むちなど、打つために用いた物はここでは特定されていない。
    reason: lexical_alternative
  - marker: b
    text: 「拘禁所」とも訳せる。原語は一般に人を拘禁する場所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: 何度も打ちたたいた
  rationale: 多数の打撃が加えられたことを自然な現代日本語で表し、道具や刑罰の具体的な形式は限定しない。
- source_word: τε
  choice: そして
  rationale: 前の出来事に続く叙述を結ぶ接続の働きを明示する。
- source_word: ἐπιθέντες
  choice: …後
  rationale: 主動詞に先立つ分詞の時間的関係を日本語として自然に示す。打撃を加える意味は「打ちたたいた」に含めた。
- source_word: ἔβαλον εἰς φυλακήν
  choice: 牢に投げ込み
  rationale: βάλλωの力強く乱暴な響きを「投げ込み」で保ち、φυλακήは簡潔に「牢」とした。
- source_word: παραγγείλαντες
  choice: 命じた
  rationale: 権威を伴う指示であることを明確に表す。
- source_word: δεσμοφύλακι
  choice: 牢番に
  rationale: 囚人の監視を担当する者を、簡潔で文脈に適した日本語で表す。
- source_word: ἀσφαλῶς τηρεῖν
  choice: 厳重に見張るよう
  rationale: 囚人の安全ではなく、逃亡を許さず確実に拘禁する意味を表す。
- source_word: αὐτοῖς / αὐτούς
  choice: 二人を
  rationale: 文脈上のパウロとシラスを指すことを、日本語で曖昧にならないよう示す。
