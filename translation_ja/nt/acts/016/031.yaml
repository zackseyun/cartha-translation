  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: ja
  text: 彼らは言った。「主イエスを信じなさい。[a] そうすれば、あなたも、あなたの家の者たちも[b]救われます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼しなさい」とも訳せる。ここでいう信仰は、主イエスに向けられた信頼を含む。
    reason: lexical_alternative
  - marker: b
    text: 「家の者たち」は、建物としての家ではなく、家族や同居者から成る家の共同体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 二人は言った
  rationale: οἱは文脈上パウロとシラスを指すため、日本語では「二人」と明示した。δέはここでは弱い接続であり、強い逆接を加えず自然な叙述とした。
- source_word: Πίστευσον ἐπὶ τὸν
  choice: を信じなさい
  rationale: πιστεύωとἐπί＋対格は、信仰が向けられる対象を表す。現代日本語では「～を信じる」が最も自然で、決定的な応答を求めるアオリスト命令形も「信じなさい」で簡潔に表せる。
- source_word: κύριον Ἰησοῦν
  choice: 主イエス
  rationale: κύριοςの尊称的・神学的な重みを「主」で保ち、固有名Ἰησοῦςは標準的に「イエス」とした。
- source_word: σωθήσῃ
  choice: 救われます
  rationale: σῴζωの未来受動形。福音宣教の文脈に適した定訳「救われる」を用い、一時的な救出だけに意味を狭めない。
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: あなたも、あなたの家の者たちも
  rationale: οἶκοςはここでは建物ではなく、その人に属する家族・同居者を含む家の共同体を指す。「家の者たち」は現代日本語でその人的範囲を明確にしつつ、救いがどのような仕方で各人に及ぶかを訳文で決めつけない。
theological_decisions:
- issue: 「あなたと、あなたの家の者たち」に及ぶ約束の範囲
  choice: 本人と家の者たちの双方を率直に含める一方、家長一人の信仰だけで全員が自動的に救われるとは訳文に加えない。
  alternative: 家長の信仰によって家全体が自動的に救われると明示する、または家の者たちへの約束を弱めて個人だけに限定する。
  rationale: ギリシア語は看守とその家の者たちを約束の範囲に含めるが、この一節だけでは各人の信仰との関係や後代の教派的論争を決着させていない。原文の包括性と緊張をそのまま保った。
translation_notes:
  register: 明快で現代的な標準語を用いながら、命令と約束の荘重さを保った。「そうすれば」によって命令と未来の約束の関係を自然に示し、「あなたも、あなたの家の者たちも」と並列を明確にした。
