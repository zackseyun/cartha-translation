id: ACT.16.22
reference: Acts 16:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: ja
  text: 群衆も一斉に二人に襲いかかった[a]。長官たちは二人の衣服をはぎ取り、棒で打つよう命じていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人に敵対して立ち上がった」。ギリシア語の動詞は、群衆が一団となって敵対行動に出たことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「長官」は、ローマ植民市フィリピの都市行政官を指す。より専門的には「法務官」。
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: 一斉に……襲いかかった
  rationale: σύνの共同性と、敵対して立ち向かうἐφίστημιの力を、自然な現代日本語で表した。「立ち上がった」だけでは敵対行動が弱く響くため、「襲いかかった」とした。
- source_word: ὄχλος
  choice: 群衆
  rationale: 文脈上は敵対的だが、語そのものを「暴徒」として感情的に強めず、通常の意味を保った。
- source_word: κατ’ αὐτῶν
  choice: 二人に
  rationale: 敵対の向きを示すκατάを「に襲いかかった」という日本語の構文に組み込んだ。αὐτῶνは文脈上パウロとシラスを指すため、「二人」と明示した。
- source_word: στρατηγοὶ
  choice: 長官たち
  rationale: フィリピのローマ植民市における都市行政官を指す。本文では読みやすい一般名称を用い、厳密な歴史的背景は注に示した。
- source_word: περιρήξαντες
  choice: はぎ取り
  rationale: 主動詞に先立つ分詞であり、処罰の前に衣服を取り除いた動作を表す。「引き裂く」と断定するより、処罰準備として衣服を脱がせた文脈に合う「はぎ取る」を選んだ。
- source_word: αὐτῶν τὰ ἱμάτια
  choice: 二人の衣服
  rationale: 所有者がパウロとシラスであることを明確にし、ἱμάτιαを自然で品位ある現代語「衣服」とした。
- source_word: ἐκέλευον
  choice: 命じていた
  rationale: 未完了過去の進行的な場面描写を保ち、命令が発せられている最中であることを表した。
- source_word: ῥαβδίζειν
  choice: 棒で打つ
  rationale: 棒による身体刑という具体性を保った。「むち打つ」では鞭を用いた刑と誤解されうるため避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。連続するκαίは、日本語の自然な叙述に合わせて二文に分けた。敵対行動とローマ式の棒打ちの具体性を保ちつつ、過度に古風または専門的な語を本文では避けた。
