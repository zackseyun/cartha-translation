  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: ja
  text: 彼らは町々を巡りながら、エルサレムにいる使徒たちと長老たちによって定められていた規定[a]を守るように伝えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「決議」「決定」。ギリシア語ドグマタは、エルサレムの使徒たちと長老たちが定めた、守るべき取り決めを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: 町々を巡りながら
  rationale: 未完了過去が表す、複数の町を次々に通って旅する継続的な動きを、自然な現代日本語で表した。
- source_word: παρεδίδοσαν
  choice: 伝えた
  rationale: 権威ある決定を受け渡し、周知する意味。日本語の「手渡した」では物理的な受け渡しに偏りやすいため、文脈に即して「伝えた」とした。
- source_word: αὐτοῖς
  choice: 人々に
  rationale: 代名詞の指示対象は各地の信徒たちと考えられるが、「信徒」「教会」と限定せず、自然な日本語に必要な範囲で一般的に表した。
- source_word: φυλάσσειν
  choice: 守るようにと
  rationale: 決定事項に従い、継続して遵守する意味を明確かつ平易に表した。
- source_word: δόγματα
  choice: 決定した事柄
  rationale: 使徒会議で正式に定められた決定を指す。「教義」という後代の専門的含意を避けつつ、文脈上の公的な決定であることを表す。
- source_word: κεκριμένα
  choice: 決定した
  rationale: 完了受動分詞と行為者を、日本語では自然な能動構文に組み替え、すでに成立した決定であることを示した。
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: 使徒たちと長老たち
  rationale: 使徒言行録における定着した呼称を用い、エルサレムの指導者たちという文脈を保った。
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: エルサレムにいる
  rationale: 前置詞句が使徒たちと長老たちの双方を修飾することが明瞭になるよう訳した。
- source_word: ὡς δὲ
  choice: 巡りながら
  rationale: 物語の進行を示す接続と同時進行の時間関係を、日本語では従属節の「ながら」で自然に表した。
theological_decisions:
- issue: エルサレム会議の決定の権威
  choice: 「決定した事柄」と訳し、正式に成立して遵守すべき決定であることを文全体で示した。
  alternative: 「規定」「決議」
  rationale: δόγματα の公的・権威的な性格は「守るように」との組み合わせで保持しつつ、「教義」のような後代の教会用語を持ち込まず、決定内容の性質を過度に限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「町々」「使徒たち」「長老たち」により聖書本文としての品位を保ちつつ、過度に古風または教会制度的な表現は避けた。
