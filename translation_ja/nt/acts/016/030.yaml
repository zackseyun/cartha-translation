id: ACT.16.30
reference: Acts 16:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: ja
  text: そして二人を外へ連れ出して、こう言った。「皆さま[b]、救われるためには、私は何をしなければなりませんか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「救われるために、私は何をする必要がありますか」。
    reason: δεῖ ποιεῖν の必要性を表す別の言い方を示すため。
  - marker: b
    text: ここで「皆さま」と訳したギリシア語は、相手への丁寧な呼びかけであり、神を指す称号「主」ではない。
    reason: κύριοι の文脈上の社会的用法を明確にするため。
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: 二人を外へ連れ出して
  rationale: アオリスト分詞は、主動詞「言った」に先立つ動作を表す。「彼ら」は文脈上パウロとシラスなので、自然な日本語として「二人」とした。ἔξωの方向性は「外へ」で保持した。
- source_word: ἔφη
  choice: こう言った
  rationale: 未完了形だが、物語中の発話導入として単純過去相当の働きをするため、自然な「こう言った」とした。
- source_word: Κύριοι
  choice: 皆さん
  rationale: κύριοςの呼格複数形で、ここではパウロとシラスへの丁寧な呼びかけであり、神的称号ではない。現代日本語で敬意を保ちつつ過度に古風でない「皆さん」とした。
- source_word: τί με δεῖ ποιεῖν
  choice: 私は何をしなければなりませんか
  rationale: δεῖが表す必要性と、μεによる話者自身への焦点を明示した。日本語として自然な疑問文にした。
- source_word: ἵνα σωθῶ
  choice: 救われるためには
  rationale: ἵνα節の目的を示し、σωθῶの受動態を「救われる」で保持した。「ためには」は主節の必要性の問いと自然につながる。
theological_decisions:
- issue: 牢番の問いにおける σωθῶ の意味
  choice: 救われる
  alternative: 助け出される／救出される
  rationale: σῴζωには危険からの救出と広い意味での救いの両方があり得るが、使徒たちの証言への反応であり、直後の16章31節へ続く文脈では「救われる」が最も適切である。救いの仕組みについて特定の教派的説明は訳文に加えない。
- issue: Κύριοι の身分・神学的含意
  choice: 人への丁寧な呼びかけとして「皆さん」
  alternative: 主よ／主人たちよ
  rationale: 複数形でパウロとシラスに向けられているため、神的称号「主」とは解さない。社会的な敬意だけを自然な日本語で表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語としての簡潔さと牢番の切迫した丁寧な問いを保った。「皆さん」は男性二人への呼びかけとして性別を過度に前面化せず、敬意を自然に表す。脚注[a]は内容に対応する問いの末尾に置き、[b]は呼称の直後に置いた。
