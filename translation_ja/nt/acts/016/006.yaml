id: ACT.16.6
reference: Acts 16:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: ja
  text: そして彼らは、聖霊によってアジア[a]でことばを語るのを禁じられ、フリギアとガラテヤの地域[b]を通って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「アジア」は、現代のアジア大陸ではなく、小アジア西部にあったローマ帝国のアジア属州を指す。
    reason: cultural_note
  - marker: b
    text: 別訳「フリギア・ガラテヤ地方」。ギリシア語の構文は、一つの地域名称を指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: 通って行った
  rationale: ある地域を通過して進むという διέρχομαι の方向性を、自然な現代日本語で表した。
- source_word: δὲ
  choice: そして
  rationale: 物語を穏やかに先へ進める接続辞として、目立ちすぎない「そして」とした。
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: フリギアとガラテヤの地域
  rationale: χώρα の「地域」という意味を明示しつつ、二地域を指すとも、一つの複合的な地域名を指すとも理解し得る原文の構文上の幅を脚注とともに保った。
- source_word: κωλυθέντες
  choice: 禁じられ
  rationale: κωλύω のアオリスト受動分詞。単なる困難ではなく、語ることが許されなかったという明確な制止を表す。主動詞との時間的・因果的関係を過度に限定しない連用形とした。
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: 聖霊によって
  rationale: ὑπό＋属格が示す行為主体を明確にし、現代日本語で定着した「聖霊」を用いた。
- source_word: λαλῆσαι
  choice: 語ること
  rationale: 「宣べ伝える」と意味を狭めず、λαλέω の基本的な意味を保ちながら、文脈にふさわしい自然な表現とした。
- source_word: τὸν λόγον
  choice: みことば
  rationale: ルカ文書でキリスト教の知らせを指す定型的な用法を踏まえつつ、「福音」や「神のことば」と原文以上に明示せず、現代の聖書日本語として理解可能な表現を選んだ。
- source_word: ἐν τῇ Ἀσίᾳ
  choice: アジアで
  rationale: 固有名をそのまま訳し、現代の大陸との違いは脚注で説明した。
theological_decisions:
- issue: 制止する主体としての聖霊
  choice: 聖霊によって
  alternative: 霊によって
  rationale: 定冠詞と形容詞を伴う τὸ ἅγιον πνεῦμα は、ルカ文書において聖霊を指す。受動表現の行為主体も明確に保ち、本文にない説明は加えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。一行の移動、聖霊の制止、場所の順を自然な一文にまとめた。「禁じられ」は分詞の関係を必要以上に因果または時間順へ固定しない。
