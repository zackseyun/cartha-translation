  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: ja
  text: 夜が明けると、行政官たちは杖を持つ随員たち[a]を遣わして、「あの男たちを釈放せよ」と伝えさせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「杖を持つ者たち」。ローマの行政官に仕え、権威のしるしである杖を携えた公的な随員。「リクトル」とも呼ばれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: 夜が明けると
  rationale: 属格独立構文による時の移行を、現代日本語で自然かつ簡潔に表す。δὲの物語上のつながりも文脈の流れに含ませた。
- source_word: ἀπέστειλαν
  choice: 遣わして
  rationale: ἀποστέλλωのアオリストを表し、公的な使者を送る場面にふさわしい、明瞭で品位ある語を選んだ。
- source_word: οἱ στρατηγοὶ
  choice: 行政官たち
  rationale: ピリピのローマ植民市における都市行政の官職を指し、通常の意味での軍司令官ではない。「行政官」は役職の性格を一般読者に明確に伝える。
- source_word: τοὺς ῥαβδούχους
  choice: 警吏たち
  rationale: 字義は「杖を持つ者たち」で、ローマの行政官に仕える公的随員を指す。本文では職務が伝わる「警吏」とし、具体的な語義と歴史的背景を脚注に残した。
- source_word: λέγοντες
  choice: 「……」と言わせた
  rationale: 分詞が使者に託した伝言内容を導くことを、日本語の自然な使役表現で明示した。
- source_word: Ἀπόλυσον
  choice: 釈放せよ
  rationale: 拘禁中の者を解放する命令なので、法的・拘禁上の文脈に適した「釈放」を用いた。単数命令形は、伝言の受け手である看守への命令として訳文に自然に反映した。
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: あの者たち
  rationale: パウロとシラスを指す距離表現を保ちつつ、命令文に合う自然な日本語とした。
