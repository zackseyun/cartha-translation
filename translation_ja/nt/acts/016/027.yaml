id: ACT.16.27
reference: Acts 16:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: ja
  text: 看守は目を覚まし、牢の扉が開いたままになっているのを見て[a]、剣を抜き、自害しようとしていた[b]。囚人たちが逃げ去ったと思ったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「牢の扉が開けられたままなのを見て」。ギリシア語の完了受動分詞は、扉が開けられ、その状態が続いていたことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「剣」と訳したギリシア語 μάχαιρα は、短剣など、より短い刃物を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: 目を覚まし
  rationale: 目覚めた状態になることを表す自然な現代日本語で、起動的な意味を保つ。
- source_word: ὁ δεσμοφύλαξ
  choice: 看守
  rationale: 囚人を監督する係を指す。日本語では「牢番」より現代的で自然な「看守」が明瞭。
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: 牢の扉が開いているのを見ると
  rationale: 完了受動分詞が示す、開けられた結果として扉が開いた状態にあることを自然に表す。
- source_word: σπασάμενος τὴν μάχαιραν
  choice: 剣を抜き
  rationale: σπάομαι と μάχαιρα の組み合わせを、武器を鞘などから抜く動作として簡潔に表す。μάχαιρα の幅は注で示す。
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: 自害しようとした
  rationale: 差し迫った自己殺害の意図を、文脈に適した簡潔で dignified な日本語で表す。
- source_word: νομίζων
  choice: 思ったのである
  rationale: 開いた扉から看守がそう推測したことが、自害しようとした理由であると明確にする。
- source_word: ἐκπεφευγέναι
  choice: 逃げてしまった
  rationale: 完了不定詞が示す、逃亡がすでに成し遂げられたとの認識を表す。「しまった」は看守にとって重大な事態である含みも自然に伝える。
- source_word: τοὺς δεσμίους
  choice: 囚人たち
  rationale: 拘束されて牢に収容されていた人々を、現代日本語で明瞭に指す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、叙述の緊迫感と品位を両立させた。「牢番」は避けて「看守」とし、原文の分詞連鎖は日本語として自然な因果関係になるよう整えた。
