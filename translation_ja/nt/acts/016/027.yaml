- from: 看守は目を覚まし、牢の扉が開いているのを見ると[a]、剣を抜き、自害しようとした[b]。囚人たちが逃げてしまったと思ったのである。
  to: 看守は目を覚まし、牢の扉が開いたままになっているのを見て[a]、剣を抜き、自害しようとしていた[b]。囚人たちが逃げ去ったと思ったのである。
  rationale: 完了受動分詞が表す扉の継続状態を本文でより明瞭にし、μέλλω の「まさに～しようとしていた」という未然・切迫の意味を保持した。また、完了不定詞については、原文にない遺憾の含みを避けながら逃亡の完了を表すようにした。
