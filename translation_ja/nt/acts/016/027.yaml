  terminology: 『看守』は δεσμοφύλαξ に対する明瞭な現代語です。μάχαιρα を本文で『剣』とし、短い刃物の可能性を注記する扱いも適切です。『自害』はこの文脈に合う品位ある表現ですが、進行・切迫を表す補助表現を加える必要があります。
