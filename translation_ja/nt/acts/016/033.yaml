  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: ja
  text: そして彼は、その夜のその時刻に二人を連れて、二人の傷を洗った。そして彼自身も、彼の家の者も皆[a]、すぐに洗礼を受けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼の家の者」は、家族に限らず、彼の家に属する人々を広く指し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν αὐτοὺς
  choice: 二人を連れて行き
  rationale: 目的地や『脇へ』という意味を補わず、看守がパウロとシラスを伴って傷を洗うという動作の流れを自然な日本語で示す。
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: その夜のその時刻に
  rationale: 夜中であったことと、直ちに行動したことを強調する原文の時間表現を保つ。
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: 傷を洗った
  rationale: 直訳的には『傷から洗った』に近いが、傷についた血や汚れを洗ったという文脈上の意味を、過度な補足なしに自然に表す。
- source_word: ἐβαπτίσθη
  choice: 洗礼を受けた
  rationale: 受動態を保ちつつ、現代日本語の聖書用語として明瞭に表現し、洗礼の方式は特定しない。
- source_word: οἱ αὐτοῦ πάντες
  choice: 彼の家の者も皆
  rationale: 核家族だけに限定せず、彼の家に属する人々という広がりを保持する。
- source_word: παραχρῆμα
  choice: すぐに
  rationale: 行動の即時性を、明瞭で自然な現代日本語で示す。
theological_decisions:
- issue: οἱ αὐτοῦ πάντες が指す範囲と洗礼
  choice: 「彼の家の者も皆」とし、年齢、個々の信仰告白、洗礼の方式を明記しない。
  alternative: 「彼の家族も皆」または「彼に属する者たちも皆」
  rationale: 原文は看守と彼に属する者たち全員が洗礼を受けたと述べるが、その構成員の年齢や洗礼の方式は説明していないため、後代の教派的結論を読み込まない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「その夜のその時刻」で原文の時間的な強調を残し、「それから」で一連の動作を読みやすくした。脚注記号は対応箇所である「彼の家の者も皆」の後に置くのがより局所的だが、文末配置でも節全体への注として機能する。
