  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: ja
  text: そこで、看守は明かりを求めて中へ駆け込み、恐れおののきながら、パウロとシラスの前にひれ伏した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 強い逆接ではなく物語の進展を示すため、直前の出来事を受ける自然な接続とした。
- source_word: αἰτήσας
  choice: 持って来させると
  rationale: 看守が複数の明かりを求めたという先行動作を、文脈に即して自然な日本語で表した。
- source_word: φῶτα
  choice: 明かり
  rationale: 複数形だが、種類をランプやたいまつに限定せず、複数の光源を集合的に表せる日本語とした。
- source_word: εἰσεπήδησεν
  choice: 中へ駆け込み
  rationale: 内側へ突然勢いよく入る動きを、現代日本語で明瞭に表した。
- source_word: ἔντρομος γενόμενος
  choice: 恐れおののきながら
  rationale: 恐怖によって身体が震える状態を表す慣用的で簡潔な訳とし、γενόμενοςを不自然に逐語化しなかった。
- source_word: προσέπεσεν
  choice: 前にひれ伏した
  rationale: 相手の前に身を低くして倒れ伏す動作を示す一方、礼拝であるとは断定しない表現を選んだ。
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: パウロとシラスの前に
  rationale: 与格をπροσέπεσενとの関係で自然に表し、「足もと」など原文にない身体的位置は加えなかった。
theological_decisions:
- issue: 看守がパウロとシラスの前でした動作の性質
  choice: 恐怖と切迫した敬意を伴う身体動作として「前にひれ伏した」と訳す
  alternative: パウロとシラスを礼拝した
  rationale: προσπίπτωは懇願、畏敬、動揺などから人の前に伏すことを表し得るが、この箇所だけで宗教的礼拝とは確定できないため、その含みを訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用い、物語の緊迫感と原文の動作の順序を保った。「看守」は前後の文脈で明らかな主語を補ったもの。句読点は日本語として自然に整えた。
