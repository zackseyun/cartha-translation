revisions:
- from: 看守は、このような命令を受けると、二人を奥の牢に投げ込み、足を足かせ[a]にしっかり固定した。
  to: 看守は、このような命令を受けて、二人を牢の奥の区画に投げ込み、二人の足を木製の足かせ[a]にはめて固定した。
  rationale: 先行動作を示す分詞を「受けて」と訳し、内側の拘禁場所を「牢の奥の区画」とした。さらに、ξύλονを木製の足かせとして本文に明示し、「はめて固定した」により足と拘束具の関係を自然な日本語で表した。脚注は字義と文化的背景を補う内容として維持した。
