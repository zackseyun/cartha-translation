  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: ja
  text: 看守は、このような命令を受けて、二人を牢の奥の区画に投げ込み、二人の足を木製の足かせ[a]にはめて固定した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「木に」。ここでは、足を固定する木製の拘束具を指す。
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: このような命令
  rationale: 権威ある者からの指示を表す語であり、文脈に即して自然な現代日本語の「命令」とした。
- source_word: λαβὼν
  choice: 受けると
  rationale: アオリスト分詞が主動詞に先立つ動作を示すため、自然な時間的つながりを保った。
- source_word: ἔβαλεν
  choice: 投げ込み
  rationale: βάλλωの力強い語感を残し、二人への過酷な扱いを表した。
- source_word: ἐσωτέραν φυλακήν
  choice: 奥の牢
  rationale: 比較級ἐσωτέρανは、牢獄のより内側にある厳重な区画を指す。「奥の牢」は明瞭で自然である。
- source_word: ἠσφαλίσατο
  choice: しっかり固定した
  rationale: 拘束具によって動かないよう確実に留めた意味を明示した。中動態は、看守が責任をもって処置したこととして自然に訳した。
- source_word: τοὺς πόδας αὐτῶν
  choice: 足
  rationale: πούςの通常の意味をそのまま採用し、日本語では所有関係が文脈上明白なため「彼らの」を省いた。
- source_word: εἰς τὸ ξύλον
  choice: 足かせに
  rationale: ξύλονは字義的には「木・木製の物」だが、牢獄の文脈では足を拘束する木製器具を指すため、機能が伝わる「足かせ」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語の厳しい動作を「投げ込み」で保持した。主語は直前の文脈で示される牢の看守であるため「看守」と明示した。「二人」はパウロとシラスを指す。
