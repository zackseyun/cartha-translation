  text: And all the believers were together and had all things in common,[a]
translation:
  language: ja
  text: 信者たちは皆、共に集まり、すべての物を共有していた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同じ場所に集まり」。このギリシア語表現は、共にいること、または一か所に集まることを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 皆
  rationale: 名詞的に用いられた分詞「信じた人たち」全体を指す語として、簡潔で自然な「皆」とした。
- source_word: δὲ
  choice: （訳出せず）
  rationale: ここでは強い対比ではなく物語の緩やかな継続を示すため、日本語では接続詞を置かないほうが自然である。
- source_word: οἱ πιστεύοντες
  choice: 信じた人たち
  rationale: 信仰者の共同体を指す名詞的現在分詞。文脈上、キリストを信じるようになった人々を自然に表す。
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: 一つに集まり
  rationale: この表現には、共にいることと同じ場所に集まることの両方の含みがある。「一つに集まり」は共同性と集合の意味を保つ。場所を明示する読みは脚注に示した。
- source_word: εἶχον
  choice: 共有していた
  rationale: 未完了過去の継続的・習慣的な状態を「していた」で表した。
- source_word: ἅπαντα κοινά
  choice: すべての物を共有していた
  rationale: 所有物を共同のものとしていたという意味を、現代日本語で明瞭に表す。「すべて」を無限定に理念化せず、文脈に即して「物」とした。
theological_decisions:
- issue: 共同生活の性格
  choice: 信じた人々が所有物を共有していた事実の記述として訳す。
  alternative: すべてのキリスト者共同体に特定の経済制度を命じる規範として読む。
  rationale: ギリシア語本文は彼らの行動を叙述しており、命令や普遍的規定を明示してはいない。訳文では制度的・政治的な解釈を付加せず、記述性を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、共同体の結びつきと実際に集まっていた可能性の双方を損なわないようにした。
