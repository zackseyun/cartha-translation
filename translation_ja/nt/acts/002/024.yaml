id: ACT.2.24
reference: Acts 2:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: ja
  text: 神は、死の苦しみ[a]を解き放って、この方をよみがえらせました。この方が死に捕らわれたままでいることは、あり得なかったからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「苦しみ」と訳した語は、特に「産みの苦しみ、陣痛」を指すこともあります。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「それによって捕らわれていること」。この「それ」は、最も自然には「死」を指します。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: この方を
  rationale: 前節のイエスを受ける関係代名詞。日本語では独立した関係節を不自然に直訳せず、文脈上の指示を保つ「この方」とした。
- source_word: ἀνέστησεν
  choice: よみがえらせました
  rationale: 神がイエスを死者の中から起こしたことを表す使役的な動詞。現代日本語で明瞭であり、「復活させた」のような後代の術語に限定しすぎない。
- source_word: λύσας
  choice: 解いて
  rationale: λύωの「解く、ほどく、解放する」という具体的な像を保ち、主動詞に伴う行為として訳した。
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: 死の苦しみ
  rationale: ὠδίνは激しい苦痛、特に産みの苦しみを意味し得る。本文では死の拘束との関連が明瞭な「死の苦しみ」とし、出産の痛みという語義は脚注に残した。
- source_word: καθότι
  choice: からです
  rationale: 先行する神の行為の理由を示す接続表現として、自然な現代日本語にした。
- source_word: οὐκ ἦν δυνατὸν
  choice: あり得なかった
  rationale: 「可能ではなかった」という非人称的な意味を、説明調を保った自然な日本語で表した。
- source_word: κρατεῖσθαι
  choice: 捕らわれたままでいる
  rationale: 受動形が示す、力の下に拘束され続ける意味を明示する。「捕らわれる」に「ままでいる」を加え、継続して保持される含意を表した。
- source_word: ὑπ’ αὐτοῦ
  choice: 死に
  rationale: 代名詞の最も自然な先行詞である「死」を日本語では明示し、何に捕らわれるのかを明瞭にした。字義的な代名詞表現は脚注で示す。
theological_decisions:
- issue: ὑπ’ αὐτοῦの指示対象
  choice: 「死」を指すものとして本文に明示
  alternative: 字義的には「それによって」または、文法上は男性形の別の指示対象を想定する余地
  rationale: 直前の属格名詞 θανάτου が最も近く、文意にも適合する先行詞である。死がイエスを保持できなかったという対比を自然に表しつつ、原文が代名詞であることを脚注に残した。
- issue: ὠδῖναςの意味
  choice: 本文は「苦しみ」
  alternative: 「産みの苦しみ」「陣痛」
  rationale: 文脈では死に伴う苦痛または死の拘束を表す理解が自然だが、語そのものには出産の痛みという明確な語義があるため、その像を脚注で保存した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。神を主語とする叙述には丁寧体を用い、原文の「解く」と「捕らえる」という拘束の像を保った。二文に分けて理由節を読みやすくしたが、論理関係は「からです」で維持した。
