  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: ja
  text: ペトロは、ほかにも多くの言葉で厳かに証言し、彼らに繰り返し勧めて言った。「この曲がった世代から救われなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: ほかにも多くの言葉をもって
  rationale: ἑτέροις と πλείοσιν の双方を保ちつつ、手段・様態を表す与格を自然な現代日本語で示す。
- source_word: διεμαρτύρατο
  choice: 厳かに証言し
  rationale: διαμαρτύρομαι の強調された証言・証しの含意を保ち、単なる警告には限定しない。
- source_word: παρεκάλει
  choice: 繰り返し勧めて
  rationale: 未完了過去の継続・反復性と、παρακαλέω の勧告の力を明示する。
- source_word: αὐτοὺς
  choice: 彼らに
  rationale: ペトロの聞き手を指す目的語を、日本語の自然な格関係に合わせて表す。
- source_word: Σώθητε
  choice: 救われなさい
  rationale: σῴζω のアオリスト受動命令形を受動表現として保持し、聞き手への現実の呼びかけも示す。
- source_word: ἀπὸ
  choice: から
  rationale: 分離を表す基本的な意味を簡潔に示す。
- source_word: γενεᾶς
  choice: 世代
  rationale: 同時代の人々を指す γενεά の語義と聖書的な表現を保つ。
- source_word: σκολιᾶς
  choice: 曲がった
  rationale: σκολιός の比喩的な像を直接保ち、道徳的な歪みを過度に説明せずに表す。
theological_decisions:
- issue: Σώθητε における態と主体性
  choice: 救われなさい
  alternative: 自分を救いなさい／救い出されなさい
  rationale: ギリシア語の受動態を保ち、人間が自力で救済を成し遂げるという含意を持ち込まない。一方、命令形が示す応答への切実な呼びかけも保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「厳かに証言し」は原語の強い証言の響きを保ち、「繰り返し勧めて」で未完了過去の継続性を自然に表した。受動命令形は日本語でも無理なく「救われなさい」とし、神学的緊張を解消しない。
