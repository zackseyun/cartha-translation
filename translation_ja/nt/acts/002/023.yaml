id: ACT.2.23
reference: Acts 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: ja
  text: この方は、神の定められた計画と予知に基づいて引き渡されました。あなたがたは、不法な者たちの手[a]によってこの方を十字架に釘づけにし、殺したのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「不法な者たちの手によって」。ギリシア語の「手」は単数形。
    reason: διὰ χειρὸς ἀνόμωνの慣用的な媒介表現と、χείρが単数形であることを示すため。
  - marker: b
    text: 別訳「死に至らせたのです」。
    reason: ἀναιρέωには「殺す」のほか、「死に至らせる／処刑する」の訳語の幅があるため。
lexical_decisions:
- source_word: τοῦτον
  choice: この方
  rationale: 直前まで語られているイエスを指す指示代名詞の力を保ちつつ、現代日本語として自然で敬意ある表現とした。
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: 定められた計画に従って
  rationale: ὡρισμένῃの「定められた」とβουλήの「計画・意図」を明示し、与格はここでは基準・対応を表す「に従って」とした。
- source_word: καὶ προγνώσει τοῦ θεοῦ
  choice: 神の……予知
  rationale: πρόγνωσιςの時間的な先知を保つ簡潔な訳。属格τοῦ θεοῦは「計画」と「予知」の双方にかかる。
- source_word: ἔκδοτον
  choice: 引き渡されました
  rationale: 処分のため他者の手に渡される意味を自然な日本語で表し、引き渡した直接の主体は本文以上に特定しない。
- source_word: διὰ χειρὸς ἀνόμων
  choice: 不法な者たちの手を借りて
  rationale: διά＋属格の媒介的な働きを「手を借りて」で表し、ἀνόμωνは「不法な者たち」として、単に一般的な悪人とはしなかった。
- source_word: προσπήξαντες
  choice: 十字架に釘づけにし
  rationale: 動詞の「打ち付ける、釘づけにする」という意味と、この文脈で暗示される十字架刑を明確にした。
- source_word: ἀνείλατε
  choice: 殺したのです
  rationale: ペトロが聴衆に向ける直接的な告発を保つ。「死刑にした」よりも広く直接的な表現である。
theological_decisions:
- issue: 神の主権的な計画と人間の責任の関係
  choice: 神の定められた計画と予知に従って引き渡されたことと、聴衆が不法な者たちを介して殺した責任の双方を明言した。
  alternative: 神の決定性を弱める訳、または殺害の責任を不法な者たちだけに負わせる訳。
  rationale: ギリシア語は神の計画と予知を述べる一方、二人称複数の「あなたがたは殺した」によって聴衆の責任も明示しているため、その緊張を解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教としての厳粛さと直接性を保った。「それなのに」により、神の計画の中で引き渡された事実と、聴衆の責任を問う後半との対照を自然に示した。
