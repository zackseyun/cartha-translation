  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: ja
  text: パルティア人、メディア人、エラム人、またメソポタミア、ユダヤ、カパドキア、ポントス、アジア州[a]に住む者たち、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「アジア州」は、小アジア西部にあったローマ帝国の属州で、現代のアジア大陸全体を指すものではない。
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: パルティア人
  rationale: 民族名の日本語での標準的な表記を用いた。
- source_word: Μῆδοι
  choice: メディア人
  rationale: 古代メディアの民を指す民族名として、一般的な日本語表記を用いた。
- source_word: Ἐλαμῖται
  choice: エラム人
  rationale: エラム地方の民を指す民族名として、一般的な日本語表記を用いた。
- source_word: οἱ κατοικοῦντες
  choice: 住む者たち
  rationale: 冠詞付き現在分詞の実体詞的用法を保ち、現代日本語として自然に表現した。
- source_word: τὴν Μεσοποταμίαν
  choice: メソポタミア
  rationale: 地名の標準的な日本語表記。
- source_word: Ἰουδαίαν
  choice: ユダヤ
  rationale: ここでは地域名を表すため、日本語聖書で定着した地名表記を採用した。
- source_word: τε καὶ
  choice: また…、…
  rationale: 列挙を結ぶ軽い付加・連結の含みを「また」で示しつつ、不自然な逐語訳を避けた。
- source_word: Καππαδοκίαν
  choice: カパドキア
  rationale: 地域名の標準的な日本語表記。
- source_word: Πόντον
  choice: ポントス
  rationale: 地域名の標準的な日本語表記。
- source_word: τὴν Ἀσίαν
  choice: アジア州
  rationale: 現代の大陸との混同を避け、当時のローマ属州を指すことを本文で簡潔に明確化した。
theological_decisions: []
