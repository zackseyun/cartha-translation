  register: 人々と地域の列挙を明瞭に保ち、現代の一般読者に通じる標準的で端正な日本語とした。節が次節へ続くため、末尾は読点とした。英語相談層の脚注記号には内容とのずれが見られたため、原文上の地理的明確化が必要な「アジア州」に[a]を付した。
