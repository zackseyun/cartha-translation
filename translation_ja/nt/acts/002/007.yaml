source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: ja
  text: 人々は非常に驚き、不思議に思って言った。「見なさい[a]、話しているこの人たちは皆、ガリラヤ人ではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ほら」「見よ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: すっかり驚き
  rationale: 強い驚きや我を忘れるほどの驚愕を表す未完了形。現代日本語として自然にその強さを伝えるため、「すっかり驚き」とした。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは物語を緩やかに進める接続辞。日本語では接続語を置かないほうが自然であり、文脈上の連続性も保たれる。
- source_word: καὶ
  choice: 、
  rationale: 二つの反応を累加的に結ぶ語。日本語では読点による連結で自然に表した。
- source_word: ἐθαύμαζον
  choice: 感嘆して
  rationale: 驚きつつ感心する、驚嘆する意。先行するἐξίσταντοとの重なりを保ちながら、同じ語の単純な反復を避けた。
- source_word: λέγοντες
  choice: 言った
  rationale: 発言内容を導く現在分詞。日本語の物語文として自然な定動詞にした。
- source_word: Οὐχ
  choice: ではないか
  rationale: 肯定の答えを予期する否定疑問を、日本語の「ではないか」で表した。
- source_word: ἰδοὺ
  choice: ほら
  rationale: 聞き手の注意を促す語。古風になりすぎない明瞭な現代日本語を選び、「見よ」などの可能性は脚注に示した。
- source_word: πάντες οὗτοί
  choice: この人たちは皆
  rationale: その場で指し示されている集団全体を表す。原文にない社会的評価は加えず、自然な日本語の語順にした。
- source_word: οἱ λαλοῦντες
  choice: 話している
  rationale: 実際に進行中の発話を表す実体詞的現在分詞を、継続相のある日本語で訳した。
- source_word: Γαλιλαῖοι
  choice: ガリラヤ人
  rationale: 地域的出自を示す呼称を、そのまま標準的な日本語表記で訳した。
theological_decisions:
- issue: 「ガリラヤ人」に伴う社会的・地域的含意
  choice: 地域名だけを訳し、驚きの理由を補足しない
  alternative: 「無学なガリラヤ人」「北方出身のガリラヤ人」などと説明を加える
  rationale: 本文は彼らがガリラヤ人であることへの驚きを示すが、その理由を教育、身分、訛りなどに明示的に結び付けてはいないため、推測を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、叙事本文にふさわしい落ち着いた調子を保った。「ほら」は注意喚起として自然であり、より文語的な選択肢を脚注に残した。
