  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: ja
  text: しかも、その日々に、わたしの男の奴隷にも、女の奴隷にも[a]、わたしの霊から注ぎ出そう[b]。すると、彼らは預言するだろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの男のしもべにも、女のしもべにも」とも訳せる。ギリシア語は「しもべ」と「奴隷」のどちらをも意味し得るが、ここでは社会的に低い身分であることを保つため「奴隷」とした。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は直訳すると「わたしの霊から注ぎ出そう」である。慣用的には「わたしの霊を注ぎ出そう」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: しかも
  rationale: 直前の内容を受けつつ、社会的に低い立場の者にまで及ぶことを強調する語調を、自然な現代日本語で表す。
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: わたしの奴隷である男にも女にも
  rationale: δοῦλος／δούληが示す隷属的で低い社会的身分と、男性形・女性形の明示的な対をともに保持する。「男の奴隷、女の奴隷」より自然な日本語とした。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: あの日々には
  rationale: 指示語と時間表現を保ち、文脈上の将来的・預言的な時を自然に示す。
- source_word: ἐκχεῶ
  choice: 注ぎ出す
  rationale: 液体を豊かに注ぐ比喩を保持し、未来の行為は引用中の預言的現在に近い日本語表現で示す。
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: わたしの霊から
  rationale: ἀπόの起点・源を明示し、単純に「わたしの霊を」と置き換えず、原文のやや特異な表現を保つ。
- source_word: προφητεύσουσιν
  choice: 彼らは預言する
  rationale: 未来形の内容を文脈上明瞭な日本語で表し、「預言する」という聖書用語を不要に言い換えない。
theological_decisions:
- issue: δοῦλος／δούληの社会的身分と性別の区別
  choice: わたしの奴隷である男にも女にも
  alternative: わたしのしもべである男にも女にも
  rationale: この箇所では男女双方の奴隷を明示することにより、霊の賜物が低い社会的身分にも及ぶ意外性が強調されるため、「奴隷」が原文の力をよりよく保つ。
- issue: ἀπὸ τοῦ πνεύματός μουの表現
  choice: わたしの霊から
  alternative: わたしの霊を
  rationale: 原文のἀπόを明示し、神の霊から注ぎ出されるという比喩的な緊張を解消しない。より慣用的な訳は脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。預言の引用として簡潔な文体を用い、男女の区別と奴隷身分の社会的重みを明示した。「わたしの霊から」は日本語として意図的にやや異質だが、原文のἀπόを保持するため採用した。
