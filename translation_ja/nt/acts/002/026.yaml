id: ACT.2.26
reference: Acts 2:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: ja
  text: このため、私の心は喜び、私の舌は喜びに躍った。その上、私の肉体も希望のうちにとどまるだろう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「希望のうちに住まう」。または「希望のうちに安らう」。
    reason: κατασκηνώσει は「住む、宿営する」を基本義とする。文脈上「安らう」と訳すこともあるが、本文では居住・滞在の像を保った。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の内容を根拠・原因として受ける表現。推論だけでなく因果の力を簡潔に保つ。
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: 私の心は喜び
  rationale: 受動形を日本語で自然な状態表現とし、「心」という聖書的な人間理解の語を保持する。
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: 私の舌は歓喜した
  rationale: 強い喜びを表す動詞を「歓喜した」とし、γλῶσσα は発声を指す詩的換喩として「舌」をそのまま保つ。
- source_word: ἔτι δὲ καὶ
  choice: その上、…も
  rationale: 記述をさらに進め、強調して付け加える働きを自然な日本語で示す。
- source_word: ἡ σάρξ μου
  choice: 私の肉体
  rationale: ここでの σάρξ は倫理的な「罪深い性質」ではなく、死にさらされる身体的存在を指す。「肉」より誤解が少なく、なお身体性を明確に保つ。
- source_word: κατασκηνώσει
  choice: 安らう
  rationale: 原義には宿営する、住まうという像があるが、この詩的な死と希望の文脈では、安心して身を置く含意を自然に表す。「住む」も可能であるため脚注に示す。
- source_word: ἐπ’ ἐλπίδι
  choice: 希望のうちに
  rationale: 希望を拠り所または領域とする曖昧さを保ち、復活を本文へ明示的に補わない。
theological_decisions:
- issue: 復活の文脈における σάρξ の訳
  choice: 私の肉体
  alternative: 私の肉／私の体
  rationale: 語はここで身体的存在を指し、「罪深い性質」という倫理的意味ではない。「肉体」は現代日本語で身体性を明確にしつつ、復活後の状態まで先取りして限定しない。
- issue: κατασκηνώσει ἐπ’ ἐλπίδι の含意
  choice: 希望のうちに安らう
  alternative: 希望をもって住まう
  rationale: 死をめぐる引用の中で、希望に支えられた安全な滞在という像を表す。ただし復活という解釈を本文に直接加えず、文脈に委ねる。
translation_notes:
  register: 現代標準日本語。詩篇引用にふさわしい簡潔で格調ある調子を保ちつつ、「歓喜」「肉体」以外は一般読者にも明瞭な語を用いた。
