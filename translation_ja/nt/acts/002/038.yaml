base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: ja
  text: ペトロは彼らに言った。「悔い改めなさい。そして、あなたがた一人ひとりが、罪の赦しのために、メシアであるイエスの名によって洗礼を受けなさい。[a] そうすれば、あなたがたは聖霊という賜物を受けるでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪の赦しのために」はギリシア語を直接的に訳したものです。ここで洗礼が罪の赦しとどのように関係するかについては解釈が分かれますが、訳文はその議論に特定の結論を与えていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: 悔い改めなさい
  rationale: 複数へのアオリスト命令として、思考だけでなく生き方の転換を求める決定的な呼びかけを、現代日本語で簡潔に表す。
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: あなたがた一人ひとりが…洗礼を受けなさい
  rationale: 三人称単数の受動命令と「一人ひとり」という配分的表現を、日本語の自然な命令文で保持する。
- source_word: ἐπὶ τῷ ὀνόματι
  choice: 名によって
  rationale: 洗礼の文脈で、名に基づくこと、権威、告白などの含意を一つに限定せずに表せる自然な訳語。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語で人名との関係が自然に伝わる形とした。
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: 罪の赦しを得るために
  rationale: εἰςの目的・到達点を自然な日本語で表す一方、洗礼と赦しの厳密な神学的関係を訳文でそれ以上規定しない。ギリシア語の複数形は、日本語では集合的に自然な「罪」で表した。
- source_word: λήμψεσθε
  choice: 受けます
  rationale: 未来直説法の約束を、先行する命令を受ける自然な日本語の帰結表現「そうすれば」とともに示す。
- source_word: τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: 聖霊という賜物
  rationale: 属格が贈り物の内容を示す可能性を自然に表現し、聖霊ご自身が与えられるという読みを明確にする。
theological_decisions:
- issue: 洗礼と罪の赦しの関係（εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν）
  choice: 「罪の赦しを得るために」と直接的に訳す
  alternative: 「罪が赦されたので」「罪の赦しに向けて」
  rationale: εἰςの目的・到達点を保ちつつ、洗礼の効力、順序、象徴性をめぐる教派的な結論は付加しない。注で解釈上の幅を明示する。
- issue: Χριστοῦの訳し方
  choice: 「メシアである」と称号の意味を訳出する
  alternative: 「キリスト」
  rationale: 使徒言行録2章の宣教文脈ではメシア称号としての働きが明瞭であり、その意味を普通の読者に伝える。
- issue: τοῦ ἁγίου πνεύματοςの属格
  choice: 「聖霊という賜物」と同格・内容を示す表現にする
  alternative: 「聖霊の賜物」
  rationale: 文脈上、受ける賜物が聖霊ご自身であるという自然な理解を日本語で明瞭にする。「聖霊が与える賜物」とは訳さない。
translation_notes:
  register: 明快な現代標準日本語を用い、命令と約束の力を保った。「バプテスマ」ではなく一般読者に理解しやすい「洗礼」、「御霊」ではなく現代的で標準的な「聖霊」を採用した。
