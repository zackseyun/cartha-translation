id: ACT.2.22
reference: Acts 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: ja
  text: イスラエルの男たちよ、この言葉を聞いてください。ナザレ人イエス[a]は、神によってあなたがたに証しされた一人の人間です。神はこの方を通して、あなたがたのただ中で、力ある業と不思議としるし[b]を行われました。あなたがた自身が知っているとおりです――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ナザレのイエス」。ギリシア語のΝαζωραῖοςは、ナザレとの結びつきを示す呼び名であり、複数の自然な訳し方が可能です。
    reason: lexical_alternative
  - marker: b
    text: 別訳「奇跡と不思議としるし」。ギリシア語のδυνάμεσιは、ここでは神の力が現れた業を指し、「力ある業」または文脈に即して「奇跡」と訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: イスラエルの男たちよ
  rationale: 男性複数の呼びかけであるἄνδρεςと、民族を示すἸσραηλῖταιの双方を明示する。現代日本語として理解しやすく、性別を中性化しない。
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: この言葉を聞いてください
  rationale: 注意して聞くよう求める命令を、演説にふさわしい明瞭で丁寧な現代語にした。「言葉」はλόγουςを過度に「メッセージ」と解釈しない。
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: ナザレ人イエス
  rationale: Ναζωραῖοςの出身・呼称としての働きを保ち、日本語の聖書文体でも自然な形とした。
- source_word: ἄνδρα
  choice: 一人の人
  rationale: イエスの人間性を明記するἄνδραを省略せず、現代日本語で自然に表した。
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: 神からあなたがたに示された
  rationale: ἀποδείκνυμιの公に示す・確証する意味を「示された」で表し、ἀπὸ τοῦ θεοῦをその源・行為者として保った。
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: 力ある業と不思議としるし
  rationale: 三語の並列を維持し、δυνάμειςを文字どおりの「力」だけでなく、力の現れである行為として理解できるよう「力ある業」とした。
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: 神がこの方を通して……行った
  rationale: 神を行為の主体、イエスを媒介者として示すギリシア語の構造を明確に保った。
- source_word: ἐν μέσῳ ὑμῶν
  choice: あなたがたのただ中で
  rationale: 聞き手の間で公然と行われたことを表す慣用句の具体性を保った。
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: あなたがた自身が知っているとおりです
  rationale: 強意のαὐτοίを「自身」で明示し、聞き手自身の知識に訴える語調を再現した。
theological_decisions:
- issue: ἄνδραが示すキリストの人間性
  choice: 本文に「一人の人」を明記する
  alternative: 「方」だけで表す、または省略する
  rationale: 原文はイエスを明確にἄνδραと呼ぶ。この表現を保つことで、他の新約聖書のキリスト論を否定または説明し尽くすことなく、この節自身が語る真の人間性をそのまま伝える。
- issue: 奇跡の行為主体と媒介
  choice: 「神がこの方を通して……行った」とする
  alternative: 「イエスが行った」と主体を置き換える
  rationale: 原文は神を主語とし、δι’ αὐτοῦによってイエスを媒介者としている。この節固有の神学的表現を、より広いキリスト論によって平板化しない。
- issue: 文の継続性
  choice: 節末をダッシュで閉じ、次節への継続を示す
  alternative: この節だけで完全に文を終える
  rationale: 原文ではἸησοῦνが次節へ続く構文の目的語であり、本節は意味上の説明を挟みながら文が継続している。日本語の可読性のため述語を補いつつ、ダッシュで未完の流れを示した。
translation_notes:
  register: ペトロの公的な呼びかけにふさわしく、明瞭で品位のある現代標準語を用いた。「聞いてください」は命令の力を保ちながら、日本語で不必要に尊大にならない演説調である。「しるし」は宗教的な専門語として読める一方、一般読者にも理解できる表記とした。
