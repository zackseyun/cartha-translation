revisions:
- from: イスラエルの男たちよ、この言葉を聞いてください。ナザレ人イエス[a]は、神がこの方を通してあなたがたのただ中で行った力ある業[b]と不思議としるしによって、神からあなたがたに示された一人の人です。あなたがた自身が知っているとおりです――
  to: イスラエルの男たちよ、この言葉を聞いてください。ナザレ人イエス[a]は、神によってあなたがたに証しされた一人の人間です。神はこの方を通して、あなたがたのただ中で、力ある業と不思議としるし[b]を行われました。あなたがた自身が知っているとおりです――
  rationale: 原文のἀποδεδειγμένον ἀπὸ τοῦ θεοῦを、「神によって…証しされた」として、公に立証・保証されたという意味と神の行為者性を明確にした。「一人の人間」によりἄνδραを自然な日本語で保持した。二つの文に分けたが、内容上は原文の修飾関係を保ち、末尾のダッシュによって次節へ続く構文を示す。注bを三項表現に対応させた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:54Z'
review_pass:
  verdict: revise
  source_fidelity: 概ね原文に忠実で、神を業の主体、イエスを媒介者として明示し、三つの語の並列と聞き手への強調も保たれています。ただし「神から…示された」は、ἀπὸ τοῦ θεοῦ の行為者・保証者としての含意をやや弱くし、「示された」もἀποδεδειγμένονの公的な立証・証明の意味を十分には表しません。
  naturalness: 全体として明瞭な現代標準語です。「一人の人」はやや重く不自然なので「一人の人間」とし、分詞句の受け身は「神によって…証しされた」とするほうが自然で意味も明確です。節が次節へ続くことを示すダッシュは維持できます。
  terminology: 「イスラエルの男たち」「ナザレ人イエス」「不思議としるし」は適切です。「力ある業」はδύναμιςの文脈上の意味をよく表します。注bは本文の三項表現に対応する代替訳として整える必要があります。
  issues:
  - severity: medium
    issue: 「神からあなたがたに示された」
    rationale: ἀπὸ τοῦ θεοῦはここで神による公的な保証・立証を表す。「神から」は起点・由来として読まれやすく、受動態の行為者としての神を弱める。「示された」も単なる顕現・紹介の意味になりうるため、「神によって…証しされた」とする。
  - severity: low
    issue: 「一人の人」
    rationale: ἄνδραを保持している点は正しいが、現代日本語ではこの位置の「一人の人」はやや不自然である。「一人の人間」は人間性を明示しつつ自然である。
  - severity: medium
    issue: 注bが本文および英語監査記録の代替訳範囲と対応していない
    rationale: δυνάμεσιだけの訳語として「奇跡」を示すと、本文の「力ある業」との関係が不明確であり、英語側の注が示す三語全体の代替表現も反映しない。「奇跡と不思議としるし」を代替訳として示す。
