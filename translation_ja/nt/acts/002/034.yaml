id: ACT.2.34
reference: Acts 2:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: ja
  text: 'というのも、ダビデは天に上ったのではありません[a]。しかし、彼自身こう言っています。


    「主は私の主に言われた。


    『私の右に座っていなさい。』」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 詩篇110:1。ヘブライ語本文では、最初の「主」は神名YHWHを表している。
    reason: 引用元のヘブライ語本文における神名の背景を示すため。
lexical_decisions:
- source_word: ἀνέβη
  choice: 上ったのではありません
  rationale: アオリストの出来事を文脈に即して否定し、天への上昇を表す自然な日本語とした。
- source_word: τοὺς οὐρανούς
  choice: 天に
  rationale: ギリシア語は複数形だが、日本語の聖書的・一般的表現では「天」が自然であり、意味を損なわずに伝えられる。
- source_word: λέγει δὲ αὐτός
  choice: しかし、彼自身がこう言っています
  rationale: δέの緩やかな対照を「しかし」で示し、強意のαὐτόςを「彼自身」として保持した。現在形も「言っています」として、引用される聖書の発言を現在に提示する働きを保った。
- source_word: ὁ κύριος
  choice: 主
  rationale: ギリシア語本文のκύριοςを「主」と訳した。引用元のヘブライ語で神名YHWHに当たることは脚注で示した。
- source_word: τῷ κυρίῳ μου
  choice: 私の主に
  rationale: 二つ目のκύριοςも「主」とし、所有を明示するμουを「私の」で表した。
- source_word: Κάθου
  choice: 座っていなさい
  rationale: 現在命令形が示す着座とその状態の継続を、自然で威厳ある日本語で表した。
- source_word: ἐκ δεξιῶν μου
  choice: 私の右に
  rationale: 権威と栄誉の場所を指す慣用表現として、現代日本語で自然な「私の右に」とした。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の主張に理由を与える接続機能を、節冒頭の自然な日本語で明示した。
theological_decisions:
- issue: 詩篇110:1の引用における二つのκύριοςの訳し分け
  choice: 本文ではどちらも「主」とする（「主は私の主に言われた」）。
  alternative: 第一の語だけを神名と分かる形で「ヤハウェ」または「主」と特別に表記する。
  rationale: 使徒言行録のギリシア語本文は両方にκύριοςを用いているため、本文では同じ「主」で対応させた。一方、引用元のヘブライ語では第一の語が神名YHWHであるという重要な背景を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、詩篇引用には簡潔で威厳ある調子を保った。ギリシア語の複数形「天々」を直訳する不自然さは避け、「天」とした。引用符は発言内引用の階層が分かるように二重構造にした。
