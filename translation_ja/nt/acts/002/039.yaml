source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: ja
  text: この約束は、あなたがたとあなたがたの子どもたち、また遠くにいるすべての人[a]、すなわち、私たちの神である主がお召しになるすべての人[b]のためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「遠く離れているすべての人」。この表現は、地理的に遠い人、神の民から遠い人、またはその両方を指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「私たちの神である主がお召しになるすべての人（の限りで）」。ギリシア語は、不定ながら包括的な範囲を表す。
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: （文脈上の理由説明として文全体に反映）
  rationale: 前節の勧めを根拠づける接続詞。日本語では独立した「なぜなら」を置くと硬くなるため、説明を続ける文として自然に表した。
- source_word: ἐπαγγελία
  choice: 約束
  rationale: 直前の聖霊の賜物と関係するが、原文は賜物そのものではなく「約束」と述べているため、そのまま訳した。
- source_word: τέκνοις
  choice: 子どもたち
  rationale: 家族的な意味を自然に保ち、年齢や後代の子孫に限定しすぎない現代日本語とした。
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: 遠くにいるすべての人
  rationale: 地理的な隔たりにも、神の民からの隔たりにも解し得る表現なので、どちらかに限定しない訳とした。
- source_word: ὅσους ἂν προσκαλέσηται
  choice: お召しになる人すべて
  rationale: 不定ながら包括的な範囲を表す構文を「人すべて」で示した。「ご自分のもとへ」は中動態から推測可能だが明示されていないため本文には補わなかった。
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: 私たちの神である主
  rationale: κύριοςとὁ θεὸς ἡμῶνの同格関係、および一人称複数の所有表現を明確かつ自然に保持した。
theological_decisions:
- issue: 「遠くにいる人々」の範囲
  choice: 離散のユダヤ人または異邦人の一方に限定せず、「遠くにいるすべての人」とした。
  alternative: 遠方に住む離散のユダヤ人／契約から遠い異邦人／その双方
  rationale: この句は地理的距離と契約的隔たりの双方を響かせ得るが、この節だけでは対象を狭く確定できないため、原文の広がりを保った。
- issue: 神の召しの性質
  choice: 「主がお召しになる」とし、召しの働き方を限定しなかった。
  alternative: 救いを確実にもたらす召し／一般的な招き
  rationale: 原文は約束の対象を神が召す人々と結びつけるが、この箇所自体はその召しの仕組みを定義していないため、特定の救済論を持ち込まなかった。
- issue: ὅσους節と「遠くにいるすべての人」の関係
  choice: 「すなわち」で説明・限定の関係を示した。
  alternative: 同格を明示せず、「主がお召しになる限りの人々」と後置する
  rationale: ギリシア語の後置句が約束の対象範囲を説明する働きを、日本語で理解しやすく示した。ただし統語上の表現差は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「お召しになる」は神の行為にふさわしい敬意を示しつつ、教派固有の意味づけを避ける。「に与えられています」は日本語として対象関係を明確にするための補足であり、約束の内容や実現時期を限定しない。
