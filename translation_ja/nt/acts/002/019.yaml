  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: ja
  text: また、わたしは天の上に驚くべき出来事を、地の下にしるしを示す。血と火と、煙の立ちこめる霧を。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: 現す
  rationale: 直訳は「与える」だが、日本語で「不思議な業やしるしを与える」は意味が取りにくい。預言的文脈で、神がそれらを生じさせて目に見えるものとする意味を自然に伝えるため「現す」とした。
- source_word: τέρατα
  choice: 不思議な業
  rationale: 驚異を引き起こす異常な現象を指す。「奇跡」では意味が狭すぎるため、宇宙的な現象も含みうる「不思議な業」とした。
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: 上の天に
  rationale: ἄνω と κάτω の上下の対比を保ち、οὐρανόςを預言的・宇宙的な文脈にふさわしく「天」と訳した。
- source_word: σημεῖα
  choice: しるし
  rationale: 単なる異常現象ではなく意味を帯びた徴候であることを示す、聖書で定着した自然な訳語。
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: 下の地に
  rationale: 天との宇宙的な対比を保つため γῆ を「地」とし、κάτωを明示した。
- source_word: αἷμα
  choice: 血
  rationale: 終末的な描写の具体性と鮮烈さをそのまま保つ直接的な訳。
- source_word: πῦρ
  choice: 火
  rationale: 預言の元素的で鮮烈なイメージを保つ直接的な訳。
- source_word: ἀτμίδα καπνοῦ
  choice: 立ち上る煙
  rationale: 字義的には「煙の蒸気／もや」。日本語として不自然な「煙の蒸気」を避けつつ、煙が蒸気やもやのように立ち上る可視的な像を表した。字義的な形は脚注に残した。
theological_decisions:
- issue: ヨエル書引用における宇宙的な場所の表現
  choice: 上の天……下の地
  alternative: 上の空……下の地上
  rationale: οὐρανόςには「空」の意味もあるが、ここでは終末的なしるしが天と地の対をなしている。預言の宇宙的な広がりを狭めないよう「天／地」を採用した。
- issue: 血・火・煙と直前の「しるし」との関係
  choice: すなわち……である
  alternative: 読点だけで並べる
  rationale: ギリシア語は接続詞なしに具体例を並べており、同格・説明の関係が自然である。日本語では「すなわち」を補ってその関係を明瞭にしたが、三つの現象の解釈自体は限定していない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、預言の荘重さと「上の天／下の地」という対句を保った。「しるし」は聖書的な用語としてひらがな表記とし、「不思議な業」と区別した。
