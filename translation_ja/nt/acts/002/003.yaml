  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: ja
  text: すると、火のような舌が分かれて彼らに現れ、彼ら一人ひとりの上にとどまった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「分かれた火のような舌」または「まるで火のような舌」。ギリシア語の表現は、それが目に見えて現れたことと、人々の間に分かれて行き渡ったことの両方を際立たせている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: 現れ
  rationale: 受動形だがここでは「見えるようになった、現れた」という自動詞的な意味。自然な日本語で、目に見える現象の出現を表す。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 現象が誰に現れたかを示す与格を直接的に訳した。
- source_word: διαμεριζόμεναι
  choice: それぞれに分かれて
  rationale: γλῶσσαιを修飾する現在分詞で、分かれる過程または人々への分配を示す。「それぞれに」によって配分の含意を自然に表しつつ、過度に限定しない。
- source_word: γλῶσσαι
  choice: 舌
  rationale: 炎のような舌状の外観と、後続する言語・発話との語彙的なつながりをともに保つ。「炎」と意訳して多義性を失わせない。
- source_word: ὡσεὶ πυρός
  choice: 火のような
  rationale: ὡσεὶの比喩を明示し、現象が文字どおり火であったとは断定しない。
- source_word: ἐκάθισεν
  choice: とどまった
  rationale: 単数形を日本語では主語を明示せずに受け止め、現象が各人の上に落ち着いたという像を自然に表す。「座った」はこの文脈では不自然。
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: 一人ひとりの上に
  rationale: 全員への個別的な分配を強調する表現を、明瞭で自然な日本語にした。
theological_decisions:
- issue: 五旬祭に現れたしるしの性質
  choice: 「火のような舌」とし、目に見える比喩的な形象と発話への語彙的連関を保つ。
  alternative: 「炎」または「火のような言語」
  rationale: 原文はγλῶσσαιと比較を示すὡσεὶを用いる。文字どおりの火とも、単なる言語とも決めつけず、原文の像と緊張を保つ。
- issue: 単数動詞ἐκάθισενと複数の「舌」の関係
  choice: 日本語では主語を補わず「とどまった」と訳し、単数・集合的な捉え方の曖昧さを残す。
  alternative: 「それらはとどまった」または「それがとどまった」
  rationale: 原文の動詞は単数だが、先行する「舌」は複数である。日本語の主語省略を用いることで、原文の統語上の緊張を不必要に解消しない。
translation_notes:
  register: 明瞭な現代標準日本語。聖書本文としての品位を保ちながら、古風な「〜ごとき」「各々」などは避けた。「すると」は前節からの出来事の進行を自然に受ける。
