  yaml_path: translation/nt/acts/002/035.yaml
  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: ja
  text: わたしがあなたの敵たちを、あなたの足台とするまで。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「わたしがあなたの敵たちを、あなたの足の足台として置くまで」。
    reason: lexical_alternative
  - marker: b
    text: 詩篇110篇1節を引用している。そこでは、王の即位と敵の服従が描かれている。
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: まで
  rationale: 将来のある時点まで、直前の状態が続くことを示す。日本語では文末の「まで」が自然かつ簡潔に時間的意味を表す。
- source_word: θῶ
  choice: とする
  rationale: τίθημι は基本的に「置く」だが、目的格補語 ὑποπόδιον を伴うこの構文では「敵たちを足台とする」が自然で、原文の比喩も保持できる。
- source_word: τοὺς ἐχθρούς σου
  choice: あなたの敵たち
  rationale: 複数形と所有関係を明示し、個人的な敵対と王に逆らう者たちという詩篇の含意の双方を保つ。
- source_word: ὑποπόδιον
  choice: 足台
  rationale: 足を載せる台を指す標準的な訳語であり、王による服従・征服の具体的な比喩を保持する。
- source_word: τῶν ποδῶν σου
  choice: あなたの足台
  rationale: 直訳的には「あなたの足の足台」だが、日本語では重複して不自然なため、複合語「足台」に足の意味を含ませ、「あなたの足台」と自然に表現した。
theological_decisions:
- issue: 詩篇110篇1節の王的な服従の比喩
  choice: 「あなたの敵たちを、あなたの足台とする」と具体的な比喩を保持する。
  alternative: 「あなたの敵たちを完全に服従させる」と意味を説明して訳す。
  rationale: 原文は詩篇110篇1節を引用し、王の即位と敵の服従を足台の像で表している。解釈的な言い換えを本文に持ち込まず、メシア的・王的な響きを読者がたどれるようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「足台」という聖書的な具体像を残しつつ、「あなたの足の足台」という不自然な重複は本文で避けた。
