  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: ja
  text: そして、こうなる。主の名を呼び求める者はだれでも救われる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この句はヨエル書3章5節（英語聖書では2章32節）を踏まえている。ヨエル書では「主」はヤハウェを指すが、ここでペテロは、イエスについての宣言の中でこの言葉を引用している。
    reason: 引用元と章節区分を明確にしつつ、「主」の指示対象について本文が保つ文脈上の含意を説明するため。
lexical_decisions:
- source_word: καὶ ἔσται
  choice: そして、…
  rationale: ヨエル書からの引用の流れを「そして」で受け、ἔσται は後続する出来事を導く表現として、日本語では不自然な逐語訳を避けて文全体の未来表現に反映した。
- source_word: πᾶς ὃς ἐὰν
  choice: …者は、だれでも
  rationale: 不定の条件と普遍的な範囲の双方を、明確で自然な現代日本語で示す。
- source_word: ἐπικαλέσηται
  choice: 呼び求める
  rationale: 単に名を口にするのでなく、礼拝的な信頼をもって助けを求めるという聖書的用法を表す。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 「主の名を呼び求める」という聖書固有の表現と、その契約的・礼拝的含意を保つ。
- source_word: κυρίου
  choice: 主
  rationale: κύριος を通常どおり「主」とし、その指示対象を本文で限定しない。
- source_word: σωθήσεται
  choice: 救われる
  rationale: σῴζω の未来受動形。救出と救済の含意を保つ、日本語聖書として自然な訳語である。未来の確実性は文脈と述語形で表される。
theological_decisions:
- issue: 使徒言行録に引用されたヨエル書の「主」が誰を指すか
  choice: 本文では「主」と訳し、指示対象を特定しない。
  alternative: ヨエル書の原文脈ではヤハウェを指す一方、使徒言行録ではイエスを中心とするペトロの宣言の中で引用されている。
  rationale: ギリシア語本文は κύριος とだけ記す。訳文で一方に限定せず、引用元と使徒言行録の文脈が生む神学的緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書引用にふさわしい簡潔で格調ある調子を保った。「呼び求める」により、単なる発声ではなく信頼と祈願を伴う意味を表した。
