  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: ja
  text: さて、エルサレムには、世界中のあらゆる国々の出身で、敬虔なユダヤ人の男たちが住んでいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「世界中のあらゆる国々」は、世界全体を指す聖書の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: さて、…住んでいた
  rationale: δέは物語を先へ進める緩やかな接続辞であるため、自然な日本語の場面転換を示す「さて」で表した。時間を意味する「今」は加えていない。
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: エルサレムには…住んでいた
  rationale: κατοικοῦντεςは一時的な滞在よりも居住を表す。「住んでいた」はその継続的な意味を自然な現代日本語で伝える。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人
  rationale: 「天下のあらゆる国から来た」という文脈では、地域的な「ユダヤ地方の人々」より、民族的・宗教的意味の「ユダヤ人」が適切である。
- source_word: ἄνδρες εὐλαβεῖς
  choice: 敬虔な…男たち
  rationale: ἄνδρεςの男性を明示する意味を保ち、εὐλαβεῖςを神への畏敬と信心を表す標準的な「敬虔な」で訳した。
- source_word: ἀπὸ παντὸς ἔθνους
  choice: あらゆる国から来た
  rationale: ἀπόの出身・由来を日本語で明確にするため「から来た」とした。ἔθνοςはここでは世界各地の国々・諸民族を指す。
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: 天下の
  rationale: 直訳的な「天の下の」に対応する聖書的な世界全体の表現として、現代日本語でも理解できる「天下の」を採用した。誇張を含む慣用表現であることは脚注で示す。
theological_decisions:
- issue: Ἰουδαῖοιの意味
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: 彼らが「あらゆる国から来た」とされるため、ユダヤ地方の住民だけでなく、離散地出身の民族的・宗教的ユダヤ人を指すと読むのが文脈上自然である。
- issue: ἄνδρεςの性別表現
  choice: 男たち
  alternative: 人々
  rationale: 原文は一般的な「人々」ではなく男性を表すἄνδρεςを用いているため、その限定を中性化せず保持した。
- issue: 居住と出身地の関係
  choice: エルサレムに住み、あらゆる国から来た
  alternative: 祭りのため一時的にエルサレムに滞在していた
  rationale: κατοικοῦντεςは通常、居住を表す。ἀπόは彼らの出身を示し得るので、世界各地を出身としつつ当時エルサレムに住んでいたという原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、物語文としての品位を保った。「敬虔」「天下」は一般読者にも理解可能な範囲の聖書的語調として採用した。原文の語順を日本語として自然に組み替え、「ユダヤ人の男たち」に「敬虔な」と「あらゆる国から来た」の両方が掛かるようにした。
