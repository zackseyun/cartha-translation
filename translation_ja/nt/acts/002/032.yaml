  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: ja
  text: 神はこのイエスをよみがえらせました[a]。この方について、私たちは皆、証人です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「よみがえらせました」は、ここでは死者の中から復活させたことを指します。
    reason: ἀνέστησεν がこの文脈で復活を表すことを示すため。
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: このイエス
  rationale: 指示詞 τοῦτον の強調と、直前に語られたイエスを具体的に指す働きを、自然な日本語で保持する。
- source_word: ἀνέστησεν
  choice: よみがえらせました
  rationale: ここでは神を主語とする他動詞で、文脈上イエスの復活を指す。「復活させました」も可能だが、「よみがえらせました」は動詞としての具体性を保ち、現代の読者にも明瞭である。
- source_word: ὁ θεός
  choice: 神は
  rationale: 明示された主語をそのまま保持し、日本語の主題・主格として自然に示す。
- source_word: οὗ
  choice: そのことの
  rationale: 文法上は「その方の」も可能だが、証言の焦点は直前に述べられた復活の出来事にあるため、自然な日本語では「そのことの証人」とする。指示対象に解釈上の余地があるため脚注で代案を示す。
- source_word: πάντες ἡμεῖς
  choice: 私たちは皆
  rationale: πάντες と明示的な ἡμεῖς による強調を、自然な日本語語順で保持する。
- source_word: ἐσμεν μάρτυρες
  choice: 証人です
  rationale: μάρτυρες が名詞であることを反映し、「証しします」ではなく「証人です」と訳す。
theological_decisions:
- issue: 復活を表す語法
  choice: 神は、このイエスをよみがえらせました
  alternative: 神は、このイエスを復活させました
  rationale: イエスの復活を神の行為として明示する原文の主張を直接保ち、付加的な教理説明は持ち込まない。
- issue: 証言の対象
  choice: そのことの証人
  alternative: その方の証人
  rationale: οὗ は文法的にはイエスを受ける男性単数属格だが、意味上はイエスの復活について証言することを表す。「そのこと」は日本語として明瞭であり、形式的な代案は脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。過度に文語的な「甦らせた」は避け、一般読者に理解しやすい「よみがえらせました」を採用した。指示詞の力を保つため「このイエス」を残した。
