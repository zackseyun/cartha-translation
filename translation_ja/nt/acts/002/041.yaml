id: ACT.2.41
reference: Acts 2:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: ja
  text: そこで、彼のことばを受け入れた人々はバプテスマを受け、その日、およそ三千人[a]が加えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「およそ三千の魂」。ギリシア語の「魂」は、ここでは人間を数える一般的な言い方。
    reason: ψυχαίの字義的表現と、文脈上の慣用的な意味の両方を示すため。
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: そこで、…人々は
  rationale: 前の説教を受けた結果と物語の進行を自然に示す。「それゆえ」より現代日本語の叙述に適する。
- source_word: ἀποδεξάμενοι
  choice: 受け入れた
  rationale: 単に聞いたのではなく、語られた内容を好意的に受容したことを表す。
- source_word: τὸν λόγον αὐτοῦ
  choice: 彼のことば
  rationale: 文脈上はペトロの告げたメッセージを指すが、λόγοςとの対応を保ちつつ日本語として通じる表現とした。
- source_word: ἐβαπτίσθησαν
  choice: バプテスマを受け
  rationale: 受動の出来事を直接表し、方法や効力について特定の教派的理解を加えない。
- source_word: προσετέθησαν
  choice: 加えられた
  rationale: 共同体への加入が文脈上示唆される一方、原文には加えられた先が明記されていないため、目的語を補わない。
- source_word: ψυχαὶ
  choice: 人
  rationale: ここでは人間を数える慣用的用法なので、現代日本語で自然な助数表現「三千人」とした。字義的な語感は脚注に残す。
- source_word: ὡσεὶ τρισχίλιαι
  choice: およそ三千人
  rationale: ὡσείの概数を「およそ」で明示し、自然な日本語で人数を表した。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: その日
  rationale: 時を表す句を簡潔で自然な現代日本語にした。
theological_decisions:
- issue: 「加えられた」先を明示するか
  choice: 「加えられた」のまま明示しない
  alternative: 「彼らの仲間に加えられた」または「教会に加えられた」
  rationale: 文脈は信者の共同体への加入を示すが、この節のギリシア語自体にはその対象が明記されていないため、本文の含みを保った。
- issue: ψυχαίの人間論的な含意
  choice: 本文では慣用的意味の「人」とし、字義的表現を脚注に示す
  alternative: 本文を「魂」とする
  rationale: この複数形は人を数える表現として用いられている。「魂」とすると、現代日本語では肉体と分離した非物質的存在についての主張と過度に受け取られうるため、意味を自然に伝えつつ原語を脚注で透明化した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「バプテスマ」は行為の様式や神学的効力を限定せず、教会用語として広く認識される語を用いた。「彼」は直前の文脈におけるペトロを指す。
