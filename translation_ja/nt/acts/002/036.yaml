  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: ja
  text: ですから、イスラエルの全家は、確かに知りなさい。神は、あなたがたが十字架につけたこのイエスを、主またメシア[a]とされたのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語は「クリストス」で、ここでは油を注がれた者という称号の意味を表すため、「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: 「主またメシアとされた」は、文脈では神によるイエスの高挙を述べる表現であり、それ自体でイエスの本質が変化したことを述べるものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: 確かに
  rationale: 確実性を強調する副詞の力を、自然で明瞭な現代日本語で表した。
- source_word: οὖν
  choice: ですから
  rationale: 直前までの復活と高挙についての論証を受けた帰結であることを明確にした。
- source_word: γινωσκέτω
  choice: 知りなさい
  rationale: 三人称単数の命令法がイスラエル全体に向けられているため、勧告に弱めず命令の力を保った。
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: イスラエルの家のすべての者
  rationale: 契約共同体を表す「家」の比喩を残しつつ、現代日本語で対象が人々であることを明瞭にした。
- source_word: κύριον
  choice: 主
  rationale: 高く上げられた権威を表し、直前の詩篇引用にある「主」との響き合いも保つ。
- source_word: Χριστόν
  choice: メシア
  rationale: イスラエルに対するペトロの宣言では称号としての意味が前面に出ているため、「メシア」とした。
- source_word: ἐποίησεν
  choice: された
  rationale: 「任命した」などに狭めず、ποιέωの広い語義を保つ「する」を用いた。日本語では目的語と補語を伴う「主ともメシアともされた」により、ある地位・役割に置く意味が自然に伝わる。
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: このイエス
  rationale: 歴史上の特定のイエスを指し示す指示表現の強調を簡潔に保った。
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: あなたがたが十字架につけた
  rationale: 聞き手の関与を突きつける直接的な語調を保った。
theological_decisions:
- issue: 「神が主ともメシアともされた」とキリスト論との関係
  choice: 原文どおり「された」と訳し、文脈上、神がイエスを高く上げ、救済史においてその地位を公に示されたこととして注で説明した。
  alternative: 「任命された」「お立てになった」と訳して誤解を避ける、またはイエスの本質がこの時点で変化したと読む。
  rationale: ἐποίησενの語感を訳文から消さず、同時に、この節がイエスの神的本質の変化を述べると断定しない。原文自体が持つ簡潔さと神学的緊張を本文に残した。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: 「イスラエルの家」に対する宣言であり、固有名の一部というより、油注がれた者という称号の機能が明瞭だからである。別訳は注記した。
translation_notes:
  register: 明瞭な現代標準語を用い、ペトロの結論を示す厳粛さと命令の強さを保った。「イスラエルの家」は聖書的な共同体表現として残し、「のすべての者」を添えて自然な理解を助けた。
