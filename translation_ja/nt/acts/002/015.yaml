  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: ja
  text: というのも、この人たちは、あなたがたが思っているように酔っているのではありません。今は一日の第三時[a]だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ユダヤ人の時刻の数え方では、午前九時ごろ。
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ～のではありません
  rationale: οὐの否定を明確に表し、γάρの説明的な働きは、前の節への応答として文脈と後続の「だからです」によって自然に伝えた。
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: あなたがたが思っているように
  rationale: ὑπολαμβάνετεの「そう考える、推測する」という意味と、ὑμεῖςによる直接の呼びかけを、平明な現代日本語で保った。
- source_word: οὗτοι
  choice: この人たち
  rationale: 指示対象である一群を自然に示し、原文に明記されていない性別を加えない表現とした。
- source_word: μεθύουσιν
  choice: 酔っている
  rationale: 文脈では酩酊している状態についての非難を指すため、日本語で最も自然な状態表現を用いた。
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: 今はまだ一日の第三時だからです
  rationale: 二つ目のγάρが示す理由を「だからです」で明示した。「今はまだ」は、朝の早い時刻を理由として提示する語用論的含意を自然に伝え、「一日の第三時」は原文の時刻表現を本文に保持する。
- source_word: ὥρα τρίτη
  choice: 一日の第三時
  rationale: 古代ユダヤの時刻表現を現代時刻へ本文中で置き換えず、換算は脚注で示した。
