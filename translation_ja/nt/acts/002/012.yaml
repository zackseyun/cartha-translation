  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: ja
  text: 人々は皆、驚き、戸惑って、互いに「これはいったいどういうことなのか」と言っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 驚き
  rationale: 文脈では、奇跡的な出来事に接した人々の強い驚きを表す。未完了時制の継続的な状態は、後続の動詞と文末の「言い合っていた」によって自然に示した。
- source_word: δὲ
  choice: （無訳）
  rationale: ここでは物語を進める弱い接続辞であり、日本語では明示しないほうが自然である。強い逆接にはしなかった。
- source_word: πάντες
  choice: 人々は皆
  rationale: 直前の群衆を受けつつ、πάντεςの全体性を明確に表した。
- source_word: διηπόρουν
  choice: 戸惑って
  rationale: 何が起きているのか理解できず、判断に迷う状態を自然な現代日本語で表す。「当惑して」より日常的で明瞭である。
- source_word: ἄλλος πρὸς ἄλλον
  choice: 互いに
  rationale: 相互に語り合うことを簡潔で自然な日本語にした。
- source_word: λέγοντες
  choice: 言い合っていた
  rationale: 分詞が示す同時進行の発話と、主動詞群の未完了時制による継続性を自然に表した。疑問文の内容から「尋ね合っていた」も可能だが、原語の中立的な「言う」を保持した。
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: これはいったいどういうことなのだろう
  rationale: τί θέλει + 不定詞は、出来事の意味や意義を問う慣用表現である。「何であろうとしているのか」という逐語訳は日本語では誤解を招くため、驚きと困惑を伴う問いとして自然に訳した。
