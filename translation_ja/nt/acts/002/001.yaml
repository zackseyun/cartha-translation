reference: Acts 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: ja
  text: 五旬祭の日を迎えたとき[a]、皆は同じ場所に一緒にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「五旬祭の日が満ちつつあったとき」。または「五旬祭の日が満ちたとき」。
    reason: συμπληροῦσθαιは、時が満ちる過程または定められた日が到来することを表し得るため。
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: 日を迎えた
  rationale: ἐν τῷ＋現在不定詞の時間表現を、日の到来・成就を示す自然な日本語で表した。原文には「満ちる／完了する過程」の響きもあるため、脚注で示した。
- source_word: πεντηκοστῆς
  choice: 五旬祭
  rationale: 過越祭から数えて五十日目に祝われるユダヤ教の祭りを指す、新約聖書の文脈に適した日本語名称。「聖霊降臨祭」は後代のキリスト教的名称なので用いない。
- source_word: πάντες
  choice: 皆
  rationale: 直前の文脈で示された集団の全員を簡潔に表す。
- source_word: ὁμοῦ
  choice: 集まっていた
  rationale: 一同が共にいたことを自然な日本語で表す。
- source_word: ἐπὶ τὸ αὐτό
  choice: 同じ場所に
  rationale: この句の場所的な意味を保ち、ὁμοῦの共同性と合わせて自然な文にした。
theological_decisions:
- issue: ἦσανの明示されていない主語の範囲
  choice: 皆は
  alternative: 彼らは皆
  rationale: 主語は直前の文脈から補われる。日本語ではπάντεςを主題として「皆は」とすることで、特定の集団を新たに断定せず、物語の連続性を保った。
- issue: πεντηκοστήの名称
  choice: 五旬祭
  alternative: 聖霊降臨祭
  rationale: この時点で本文が指すのはユダヤ教の祭りであり、後の出来事に基づくキリスト教的名称を先取りしない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「五旬祭」は一般読者にはやや馴染みが薄いが、歴史的・宗教的対象を正確に示す名称として保持した。「同じ場所に集まっていた」によりὁμοῦとἐπὶ τὸ αὐτόの意味を重ねすぎずに両方反映した。
