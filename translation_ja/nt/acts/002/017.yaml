id: ACT.2.17
reference: Acts 2:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: ja
  text: '「終わりの日々に、こうなる」と神は言われる。


    「わたしは、わたしの霊から[b]、すべての人[a]の上に注ぎ出す。


    あなたがたの息子たちと娘たちは預言し、


    あなたがたの若い男たちは幻を見、


    あなたがたの年老いた男たちは夢を見る。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「すべての肉の上に」で、人類を広く指す預言的な表現。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「わたしの霊を」と訳されることが多いが、ギリシア語は字義的には「わたしの霊から」とある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: 終わりの日々には
  rationale: 終末的な時を指す定着した表現を保ちつつ、「最後の日」と単数化せず、ギリシア語の複数形を反映した。
- source_word: λέγει ὁ θεός
  choice: と神は言われる
  rationale: 預言の引用を導く現在時制の定型句として、現代日本語で品位ある敬語表現にした。
- source_word: ἐκχεῶ
  choice: 注ぐ
  rationale: 液体を注ぐという具体的な比喩を簡潔に保持した。未来の意味は「こうなる」という導入と文脈によって明らかである。
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: わたしの霊から
  rationale: 目的格の「霊を」に均さず、起点・源を示すἀπόをあえて保持した。日本語ではやや異例だが、原文の特徴を伝える。
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: すべての肉なる者の上に
  rationale: ヨエル書に由来する預言的な比喩と「上に」という方向性を保持した。「すべての人」という意味は脚注で示した。
- source_word: προφητεύσουσιν
  choice: 預言し
  rationale: 専門的・神学的意味を薄めず、標準的な訳語を用いた。
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: あなたがたの息子も娘も
  rationale: 男女双方が明示される対句を保ちながら、日本語として不自然な所有表現の反復は避けた。
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: 若者
  rationale: ここでは娘たちに対する包括語ではなく男性の若者を指すが、日本語の「若者」は文脈上自然であり、続く「老人」と年齢上の対比をなす。
- source_word: ὁράσεις ὄψονται
  choice: 幻を見る
  rationale: 同語根を重ねたギリシア語を、日本語の自然な連語で表した。
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: 老人
  rationale: 職務上の「長老」ではなく、「若者」と対照される高齢の男性を表すため。
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: 夢を見る
  rationale: 夢に関する同語根の表現を、自然な日本語で意味と並行法を保って訳した。
theological_decisions:
- issue: 「すべての肉」（πᾶσαν σάρκα）の範囲と比喩性
  choice: 本文で「すべての肉なる者」とし、人類を広く指す預言的表現を保持する。
  alternative: すべての人／全人類
  rationale: 聖霊が性別や年齢を越えて与えられる広がりを示しつつ、ヨエル書との語句上の結びつきと身体的比喩を失わないため。
- issue: πνεῦμαの指示対象
  choice: 「わたしの霊」と訳す。
  alternative: わたしの息／わたしの精神
  rationale: 話者である神に属し、預言を可能にするものとして描かれているため、文脈上は神の霊を指す。人格性や位格について本文以上の説明は加えない。
- issue: ἀπὸ τοῦ πνεύματός μουの部分・起点表現
  choice: 「わたしの霊から」としてἀπόを保持する。
  alternative: わたしの霊を
  rationale: 「霊の一部分だけ」という教義的含意を断定せず、原文にある起点表現の曖昧さを残すため。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、預言の引用にふさわしい簡潔で荘重な調子を採用した。「肉なる者」と「霊から」は原文の特徴を保つため意図的にやや異質な表現とし、脚注で意味を補った。詩的な並行法が見えるよう改行した。
