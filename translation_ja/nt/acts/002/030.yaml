  source_fidelity: ギリシア語は、ダビデが預言者であり、神が彼に誓いをもって誓い、彼の身体的・系譜的子孫を彼の王座に据えると約束されたことを知っていた、という内容である。草案はこの因果関係、誓いの強調、据えるという使役的意味を適切に伝えている。ただし、日本語の連続する「彼」は直前の「神」を指すとも読め、二つの αὐτοῦ が指すダビデを明示するほうが原文の指示対象を確実に保てる。
