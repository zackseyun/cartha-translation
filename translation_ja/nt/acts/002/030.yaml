id: ACT.2.30
reference: Acts 2:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: ja
  text: そこで、ダビデは預言者であり、神が彼に誓いをもって、ダビデの子孫の一人[a]をダビデの王座に着かせると誓われたことを知っていたので、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の腰の実から」。すなわち、ダビデの血統から出る者。
    reason: 原文の具体的な身体比喩と系譜的意味を示すため。本文で明示した指示対象（ダビデ）に合わせ、脚注の説明も明確化する。
lexical_decisions:
- source_word: προφήτης
  choice: 預言者
  rationale: 神からの啓示を受けて語る者を表す標準的な訳語である。
- source_word: οὖν
  choice: そこで
  rationale: 直前のダビデについての論述を受け、その事情から次の発言へ進む推論的なつながりを自然な日本語で示す。
- source_word: ὑπάρχων
  choice: 預言者であり
  rationale: 状況ないし理由を示す分詞を、続く分詞と並行する自然な日本語の従属構文で表した。文脈上の主語ダビデを明示した。
- source_word: εἰδὼς
  choice: 知っていたので
  rationale: ダビデが誓いの内容を認識していたことを表し、ὑπάρχωνとともに後続内容の背景・理由を構成する。
- source_word: ὅρκῳ ὤμοσεν
  choice: 誓いをもって……誓われた
  rationale: 同語根を重ねる原文の厳粛さを保ちつつ、神への敬意を示す日本語にした。
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: 彼の子孫の一人
  rationale: 腰の実という身体的比喩が示す血統上の子孫を、現代日本語で明瞭に表した。字義的表現は脚注に残した。
- source_word: καθίσαι
  choice: 着かせる
  rationale: 神がその子孫を王座に据えるという使役的意味を保持する。
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: 彼の王座に
  rationale: 最後のαὐτοῦは文脈上ダビデを指すと理解し、王位継承の表現として訳した。
theological_decisions:
- issue: ダビデへの王朝的約束とメシア的適用
  choice: 約束をダビデの子孫が彼の王座に着くこととして訳し、この節に「メシア」を補わない。
  alternative: 「メシアを彼の王座に着かせる」と意訳する。
  rationale: 周囲の文脈はこの誓いをイエスに適用するが、本節自体はダビデの血統と王座という約束の語句で述べているため、その表現を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。使徒言行録2:29から続く長い文の途中であることを示すため、末尾は読点とした。主語の曖昧さを避けるため、文脈上のダビデを明示した。
