id: ACT.2.29
reference: Acts 2:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: ja
  text: 兄弟たち[a]、族長ダビデについて、皆さんに率直に申し上げることが許されています。彼は死んで葬られ、その墓は今日まで私たちの間にあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「男たち、兄弟たち」。同胞のイスラエル人に対する改まった呼びかけです。
    reason: ギリシア語の二重の男性呼格を、日本語本文では自然な一つの呼びかけとして訳したため。
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟である皆さん
  rationale: 二重の男性呼格による、同胞のイスラエル人への改まった呼びかけ。日本語で「男たち、兄弟たち」と逐語化すると不自然なため、男性形と同胞への呼びかけを保ちながら自然に表現した。
- source_word: ἐξὸν εἰπεῖν
  choice: 私は……申し上げることができます
  rationale: 単なる能力ではなく、遠慮なく語ってよいという許容・自由を表す。「申し上げる」は聴衆への公的な発言にふさわしい。
- source_word: μετὰ παρρησίας
  choice: はっきり
  rationale: παρρησίαが表す率直で公然とした語りを自然な現代日本語で示す。ここでは「大胆に」よりも、ためらわず明言する文脈に適する。
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: 族長ダビデについて
  rationale: πατριάρχηςの歴史的称号を「族長」とし、本文にない「私たちの」は補わない。
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: 彼は死んで葬られ
  rationale: 二つの事実をともに断定するκαί…καίの力は、連続する二動詞で自然に伝わる。「死にもした」のような不自然な強調は避けた。
- source_word: τὸ μνῆμα αὐτοῦ
  choice: その墓
  rationale: μνῆμαはここで、当時なお知られていた埋葬所・墓を指す。
- source_word: ἔστιν ἐν ἡμῖν
  choice: 私たちの間にあります
  rationale: 話し手と聴衆の共同体・所在地の中に現存するというἐν ἡμῖνの意味を保つ。
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: 今日まで
  rationale: 発言時まで墓が存在し続けているという時間的継続を自然に表す。
theological_decisions:
- issue: 冒頭の男性複数呼格の扱い
  choice: 兄弟である皆さん
  alternative: 兄弟たち／兄弟姉妹の皆さん／男たち、兄弟たち
  rationale: ギリシア語はἄνδρεςとἀδελφοίという二つの男性複数呼格を明示する。日本語では二語を逐語的に並べず、男性形と同胞への改まった呼びかけを本文で保持する。聴衆の範囲を本文だけで男女包括的と断定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、公の説教にふさわしい丁寧さと威厳を保った。「はっきり申し上げる」で許容と率直さを一まとまりに表現した。
