id: ACT.2.33
reference: Acts 2:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: ja
  text: こうして、神の右に上げられ[a]、父から聖霊の約束[b]を受けたイエスは、あなたがた自身が見、聞いているこのことを注ぎ出したのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の右の手によって上げられ」。ギリシア語の与格は、上げられた位置とも、上げた力・手段とも理解できます。
    reason: alternative_reading
  - marker: b
    text: 「聖霊の約束」は、聖霊そのものが約束された賜物であるとも、聖霊についての約束であるとも理解できます。別訳「約束されていた聖霊」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: 神の右に
  rationale: 与格を場所・到達点として理解し、直後の詩篇110篇の引用につながる即位・高挙の主題を自然に表す。「神の右の手によって」という手段の理解も可能なので脚注に残した。
- source_word: οὖν
  choice: こうして
  rationale: 直前の復活についての論証を受け、その帰結を示す。現代日本語の説教的文脈で自然に論理的つながりを表す。
- source_word: ὑψωθεὶς
  choice: 上げられ
  rationale: アオリスト受動分詞として、神による高挙を簡潔に表す。文脈上、単なる物理的上昇ではなく栄誉ある地位への高挙を含む。
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: 聖霊の約束
  rationale: 属格表現の形を保ち、聖霊そのものが約束された賜物なのか、聖霊についての約束なのかという原文の幅を本文で閉じない。脚注で両義性を説明した。
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: 父から…受けた
  rationale: παρά＋属格の起点を「父から」で表し、主動詞に先立つ分詞の動作を自然な日本語にした。
- source_word: ἐξέχεεν
  choice: 注いだ
  rationale: アオリスト直説法の完了した行為を表し、その現前する結果は続く「今見たり聞いたりしている」によって示す。
- source_word: τοῦτο ὃ
  choice: このことを
  rationale: 指示語の簡潔さを保ち、「聖霊」や「賜物」と説明的に限定しすぎない。関係節は日本語では前置修飾にした。
- source_word: ὑμεῖς
  choice: あなたがた自身
  rationale: 明示された代名詞の強調を「自身」で保持する。
- source_word: βλέπετε καὶ ἀκούετε
  choice: 今見たり聞いたりしている
  rationale: 現在形が表す群衆の目前の知覚を「今」と進行的表現で明確にした。「たり…たり」は二つの知覚事象を自然にまとめる。
theological_decisions:
- issue: τῇ δεξιᾷ τοῦ θεοῦを「神の右に」と場所的に取るか、「神の右の手によって」と手段的に取るか
  choice: 神の右に
  alternative: 神の右の手によって
  rationale: 周囲の高挙・即位の主題、とりわけ続く詩篇110篇の引用には場所的理解がよく合う。ただしギリシア語の与格は手段とも解し得るため、別訳を脚注に保存した。
- issue: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίουが、約束された賜物としての聖霊を指すか、聖霊についての約束を指すか
  choice: 聖霊の約束
  alternative: 約束されていた聖霊
  rationale: 原文の属格は両方の理解を許す。「聖霊の約束」として曖昧さを保持しつつ、後続の「注いだ」は聖霊の授与を強く示す。父から受けて注ぐ子という文中の区別もそのまま保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い分詞構文は日本語の主題を明確にするため「イエスは」を補った。「このこと」は原文の指示語の余白を保ち、過度な説明を避けた。
