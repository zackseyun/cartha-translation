  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: ja
  text: 神を賛美し、民全体から好意を持たれていた。主は日々、救われつつある人々を加えておられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の句ἐπὶ τὸ αὐτόは、「一緒に」または「同じ場所に」とも訳せる。この箇所では「加える」という動詞との関係から、既存の共同体に加える意に理解されることが多いが、その意味や係り方には議論がある。
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: 神を賛美し
  rationale: 現在分詞が表す共同体の継続的な営みを、自然で簡潔な日本語で表した。
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: 民全体から好意を持たれていた
  rationale: ἔχειν χάριν πρός は通常、相手に好意を示すことではなく、相手から好意や支持を得ていることを表す。「民全体」により定冠詞付きの λαός と ὅλον を反映した。
- source_word: ὁ δὲ κύριος
  choice: 主は
  rationale: κύριος を文脈に沿って「主」とし、δέ は日本語の文の流れの中で無理に接続語を補わず表した。
- source_word: προσετίθει
  choice: 加えておられた
  rationale: 未完了過去の反復・継続的な動作を「ておられた」で示し、主を主語とする文にふさわしい敬意も自然に表した。
- source_word: τοὺς σῳζομένους
  choice: 救われつつある人々
  rationale: 現在受動分詞の進行的・過程的な含みを保ち、「救われた人々」という完了状態に限定しなかった。
- source_word: καθ’ ἡμέραν
  choice: 日々
  rationale: 日ごとに繰り返されるという分配的な意味を、簡潔で自然な日本語にした。
- source_word: ἐπὶ τὸ αὐτό
  choice: 彼らの仲間に
  rationale: προσετίθει の補語として、既存の共同体への加入を表す可能性が最も高い。「人数に」より自然で、原文に明示されない数の概念を避けた一方、句自体の別の意味は脚注に残した。
theological_decisions:
- issue: τοὺς σῳζομένους における救いの相と神学的含意
  choice: 救われつつある人々
  alternative: 救われた人々／救われる人々
  rationale: 現在受動分詞が救いを進行中の受動的出来事として提示する点を保った。救いの秩序や完了時点について特定の教派的結論を加えてはいない。
- issue: ἐπὶ τὸ αὐτό の解釈
  choice: 彼らの仲間に
  alternative: 一緒に／同じ場所に
  rationale: 「加える」という動詞との結び付きから共同体への加入と解するのが文脈上自然だが、この句には場所的・集合的な意味もあり得るため、本文だけで曖昧さを消さず脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文としての品位を保った。「救われつつある」はやや改まった表現だが、原文の現在受動分詞の相を明確に伝えるため採用した。
