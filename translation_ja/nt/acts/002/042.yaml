  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: ja
  text: 彼らは、使徒たちの教え、交わり[a]、パンを裂くこと[b]、祈り[c]に、ひたすら励んでいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「分かち合い」「参与」「共同の交わり」。
    reason: lexical_alternative
  - marker: b
    text: 「パンを裂くこと」は一般の共同の食事を指すこともあるが、ここでは主の晩餐を含むと理解する人も多い。
    reason: alternative_reading
  - marker: c
    text: 原文は定冠詞付きの複数形。定められた祈りの時や形式を指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: ひたすら励んでいた
  rationale: ἦσανと現在分詞による迂言的な未完了形が表す、過去における継続的・習慣的な行為を「励んでいた」で示し、προσκαρτερέωの粘り強く専心する意味を「ひたすら」で補った。
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: 使徒たちの教え
  rationale: διδαχήを現代日本語で自然な「教え」とし、属格は使徒たちが授けた教えを表す自然な連体修飾で訳した。
- source_word: τῇ κοινωνίᾳ
  choice: 交わり
  rationale: 共同の参与、分かち合い、共同生活を含み得る広い語義を、日本語の聖書文脈でも理解されやすい「交わり」で保った。物質的共有や儀礼的聖餐だけに限定しない。
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: パンを裂くこと
  rationale: ルカ文書に見られる表現を具体的なまま訳し、通常の共同の食事か主の晩餐を含む行為かを本文で断定しないようにした。
- source_word: ταῖς προσευχαῖς
  choice: 祈り
  rationale: 複数・定冠詞付きで、一定の祈りの時や形式を指す可能性があるが、日本語本文で「定められた祈り」と限定せず、含意を注に残した。
theological_decisions:
- issue: κλάσει τοῦ ἄρτουが主の晩餐を明示的に指すか
  choice: 「パンを裂くこと」と広く訳す
  alternative: 「主の晩餐」「聖餐」、または主の晩餐を含む共同の食事
  rationale: この表現は共同の食事にも、キリスト者の文脈では主の晩餐を含む食事にも用い得る。原文だけでは儀礼的意味に限定できないため、宗派的な解釈を本文に持ち込まず、可能性を注記した。
- issue: κοινωνίαを物質的共有または聖餐的交わりに限定するか
  choice: 広い共同参与を表す「交わり」
  alternative: 「分かち合い」「共同参加」「聖餐」「財産の共有」
  rationale: 文脈上、信者たちの共同生活と相互参与を広く指し、物質的・霊的な分かち合いを含み得る。特定の一面への限定を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ひたすら励んでいた」により継続性と献身を自然に示した。列挙のまとまりが読み取りやすいよう読点を置き、各注記記号を対応する語句の直後に配置した。
