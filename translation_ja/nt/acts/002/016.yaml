lexical_decisions:
- source_word: ἀλλὰ
  choice: いや
  rationale: 直前の人々の誤解を打ち消して訂正する強い逆接。日本語では「しかし」よりも、応答としての「いや」が文脈に自然である。
- source_word: τοῦτό
  choice: これは
  rationale: その場で起きている現象を指す指示語として、簡潔で自然な表現。
- source_word: ἐστιν
  choice: です
  rationale: 解釈的な「意味します」を避け、原文の連結辞の素直な意味を保つ。
- source_word: τὸ εἰρημένον
  choice: 語られたこと
  rationale: 冠詞付き完了受動分詞の名詞的用法と受動態を、自然な現代日本語で表す。
- source_word: διὰ
  choice: を通して
  rationale: 属格を伴い、人間である預言者が言葉の媒介者であることを示す用法を明示する。
- source_word: τοῦ προφήτου
  choice: 預言者
  rationale: ヨエルの役割を簡潔かつ忠実に示す。日本語では固有名の前の定冠詞を別個に訳さない。
- source_word: Ἰωήλ
  choice: ヨエル
  rationale: 日本語聖書で定着している人名表記を用いる。
theological_decisions:
- issue: διὰ τοῦ προφήτου Ἰωήλ における預言者の媒介
  choice: 預言者ヨエルを通して
  alternative: 預言者ヨエルによって
  rationale: διά＋属格が示し得る媒介性を保ち、ヨエルを言葉の究極的な源と断定せず、同時に本文が明記しない霊感理解を付加しない。
