  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: ja
  text: この音が起こったとき、群衆が集まり、戸惑った。それぞれが、彼らが自分自身の方言[a]で話しているのを聞いていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の言語」とも訳せる。ギリシア語は言語を広く指すこともあるが、ここでは「方言」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: この音が起こると
  rationale: 属格独立構文の時間的関係を自然な日本語で示した。φωνήはここでは声と限定せず、ペンテコステの聞こえる現象を指す「音」とした。
- source_word: συνῆλθε τὸ πλῆθος
  choice: 群衆が集まって来て
  rationale: 人々が一か所へ集まった動きを表し、現代日本語として自然な表現にした。
- source_word: συνεχύθη
  choice: 戸惑った
  rationale: 混乱し、どう理解すべきか分からない状態を表す。過度に激しい騒乱を意味させず、文脈に合う語を選んだ。
- source_word: ἤκουον εἷς ἕκαστος
  choice: それぞれが……聞いていた
  rationale: εἷς ἕκαστοςの個別的・分配的な強調と、未完了過去ἤκουονの継続的な様相を保持した。
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: 自分の方言
  rationale: διάλεκτοςは言語一般をも指し得るが、地域的・母語的な話し方を表す語感を保つため「方言」とした。
- source_word: λαλούντων αὐτῶν
  choice: 彼らが話している
  rationale: 先行文脈の話し手たちを指す代名詞を保ち、本文以上に「使徒たち」と限定しなかった。
theological_decisions:
- issue: 話し手たちが話したものと、聞き手が認識したものとの関係
  choice: それぞれが、自分の方言で彼らが話しているのを聞いていた
  alternative: 彼らがそれぞれの母語を話しているのを聞いた
  rationale: 原文は各人が自分固有のδιάλεκτοςで聞いたと述べるが、その現象の仕組みを発話側または聴取側に限定して説明しない。訳文でもその曖昧さを保った。
- issue: εἷς ἕκαστοςの性表現
  choice: それぞれが
  alternative: 一人ひとりが、彼自身の方言で
  rationale: ギリシア語の男性単数形は混合集団に対する分配表現として機能する。日本語では性を付加せず「それぞれ」とすることで、個別性を保ちながら不必要な男性限定を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の継続相と分配的強調を不自然にならない範囲で反映し、現象の仕組みについて本文が明示しない点は補足しなかった。
