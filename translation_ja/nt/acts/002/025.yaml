  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: ja
  text: 'ダビデはこの方について、こう言っています。


    「私は絶えず主を目の前に見ていた。[a]


    主が私の右におられるので、


    私は揺るがされない。」[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私はいつも主を予見していた」。ギリシャ語の動詞は文脈によって「前もって見る」という意味にもなるが、ここでは「絶えず」「目の前に」という表現から、主をいつも目の前に見続ける意味が適切である。
    reason: lexical_alternative
  - marker: b
    text: 詩篇16:8からの引用。ヘブライ語本文では、ここに神の固有名が用いられている。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: この方について、こう言っています
  rationale: εἰς αὐτόνはここでは直接の呼びかけではなく、この方に関して語るという引用導入の用法。現在形も自然な日本語で保った。
- source_word: Προορώμην
  choice: 見ていた
  rationale: 未完了過去の継続的な意味は「絶えず」と組み合わせて表現した。語自体には「前もって見る」の可能性もあるため脚注に残した。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριοςを通常どおり「主」とし、引用中の指示対象を本文で限定しない。
- source_word: ἐνώπιόν μου διὰ παντός
  choice: 絶えず…目の前に
  rationale: ἐνώπιόν μουの空間的比喩とδιὰ παντόςの継続性を、明瞭で自然な日本語にした。
- source_word: ἐκ δεξιῶν μού
  choice: 私の右に
  rationale: 右側にいることを表す慣用句。支えや保護の含意を説明的に本文へ加えず、位置の比喩を保持した。
- source_word: ἵνα μὴ σαλευθῶ
  choice: 私は揺るがされない
  rationale: 受動態の比喩を保った。ἵνα節はこの文脈で結果・目的を含みうるため、自然な日本語の帰結表現とした。
theological_decisions:
- issue: 引用された詩篇における「主」の指示対象
  choice: 本文では単に「主」とする
  alternative: 「主なる神」または「メシア」と明示する
  rationale: ペトロはこの詩篇をキリスト論的に用いるが、ギリシャ語本文はκύριονである。指示対象を翻訳本文で確定せず、引用の神学的緊張を保つ。
- issue: ἵνα μὴ σαλευθῶの目的・結果関係
  choice: 「ので、私は揺るがされない」
  alternative: 「私が揺るがされないためである」
  rationale: ἵναは目的または結果を表しうる。ここでは右におられることから生じる安定を自然に表しつつ、過度な説明を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分には簡潔で格調のある詩的な行分けを採用した。「この方」は直前までの文脈で語られるイエスを指すが、引用中の「主」は解釈的に置き換えなかった。
