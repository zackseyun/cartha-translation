  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: ja
  text: そして、すべての人に恐れが生じた[a]。また、使徒たちを通して、多くの不思議なわざとしるしが行われていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての人が畏れに包まれた」。ギリシア語では、直訳すると「すべての魂に恐れが生じた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο δὲ ... φόβος
  choice: すると、…恐れが生じた
  rationale: 未完了過去は、恐れが生じて人々を包むようになったことを表す。「すると」は、強い対比ではなく物語の展開を示す δέ を自然に伝える。
- source_word: πάσῃ ψυχῇ
  choice: すべての人に
  rationale: 直訳は「すべての魂に」だが、ここで ψυχή は一人一人の人を指す。現代日本語では「すべての人に」が意味を明瞭かつ自然に伝える。
- source_word: φόβος
  choice: 恐れ
  rationale: 神の働きを前にした畏怖を含み得るが、「畏敬」と限定せず、恐怖と畏怖の両方に開かれた原語の幅と緊張を保つ。
- source_word: πολλά τε τέρατα καὶ σημεῖα
  choice: また、…多くの不思議な業としるし
  rationale: τε は前文への追加を示すため「また」とした。τέρατα は驚異を引き起こす業、σημεῖα は意味を指し示す徴という区別を保つ。
- source_word: διὰ τῶν ἀποστόλων
  choice: 使徒たちを通して
  rationale: 属格を伴う διά の媒介・手段の意味を保ち、使徒たち自身を究極的な行為者と断定しない。
- source_word: ἐγίνετο
  choice: 行われていた
  rationale: 二つ目の未完了過去は、不思議な業としるしが継続または反復して起きていたことを表す。文脈上の媒介表現と調和する自然な日本語とした。
theological_decisions:
- issue: 使徒的なしるしに対する φόβος のニュアンス
  choice: 恐れ
  alternative: 畏れ／畏敬の念
  rationale: 神的な働きへの反応として畏怖を含み得る一方、原語は通常の「恐れ」も表す。「畏敬」と解釈的に限定せず、両義的な緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、聖書本文にふさわしい端正さを保った。「不思議な業としるし」は対句の意味上の区別を維持し、「恐れ」には脚注を付して原語の幅を示した。
