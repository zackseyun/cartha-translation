  source_fidelity: 原文の先行するアオリスト分詞（「前もって見て」）、復活について語ったこと、χριστός、οὔτε…οὔτεの二重否定、ハデスへの放置／遺棄と肉体の腐敗否定を、意味を損なわずに再現している。「死者の世界」はᾅδηςを最終的な刑罰の場と混同させず、文脈に適切である。
  naturalness: 「彼はこのことを前もって見て、…語った。すなわち、…」は明瞭な現代標準日本語であり、引用内容を導く「すなわち」も自然である。「肉体も朽ちることがなかった」は「腐敗を見る」という慣用的表現を分かりやすく伝えている。
  terminology: χριστόςを、この文脈で称号性を示す「メシア」とする選択は適切であり、脚注で慣用訳「キリスト」も示されている。σάρξを具体的身体性を表す「肉体」としたこと、ᾅδηςを「死者の世界」としたことも、過度の教義的含意を加えない適切な処理である。
