id: ACT.2.31
reference: Acts 2:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: ja
  text: 彼はこのことを前もって見て、メシア[a]の復活について語った。すなわち、メシアは死者の世界に見捨てられず[b]、その肉体も朽ちることがなかった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「クリストス」。ここでは称号としての意味を表すため「メシア」とした。伝統的には「キリスト」。
    reason: alternative_reading
  - marker: b
    text: 「死者の世界へ見捨てられず」とも訳せる。ギリシア語の「ハデス」は死者の領域を指し、必ずしも最終的な裁きの場所を意味しない。
    reason: lexical_and_cultural_note
  - marker: c
    text: 直訳では「その肉は腐敗を見なかった」。すなわち、肉体が朽ちることを経験しなかったという意味。
    reason: literal_rendering
lexical_decisions:
- source_word: προϊδὼν
  choice: このことを前もって見て
  rationale: アオリスト分詞の先行性と「前もって認識する」という意味を保つ。「このこと」は直前の文脈を受ける補足で、現代日本語として自然にした。
- source_word: ἐλάλησεν περὶ τῆς ἀναστάσεως
  choice: 復活について語った
  rationale: περί＋属格の「〜について」と、λαλέωの「語る」を簡潔に再現した。
- source_word: τοῦ χριστοῦ
  choice: メシア
  rationale: ここでは詩編に預言された油注がれた者という称号性が強いため、「キリスト」より「メシア」を採用した。
- source_word: οὔτε ἐγκατελείφθη εἰς ᾅδην
  choice: 死者の世界に見捨てられず
  rationale: ἐγκαταλείπωの受動態を「見捨てられる」とし、ᾅδηςは最終的な裁きの場所との混同を避けて「死者の世界」と訳した。εἰςは字義的には方向を示し得るが、この引用では状態・到達点を含む表現として日本語の「に」が自然である。
- source_word: ἡ σὰρξ αὐτοῦ
  choice: その肉体
  rationale: σάρξはここで倫理的・比喩的意味ではなく、死と復活に関わる身体を指す。日本語の「肉」より自然で、身体性も明確な「肉体」とした。
- source_word: εἶδεν διαφθοράν
  choice: 朽ちることがなかった
  rationale: 字義的な「腐敗を見る」はセム語的な言い回しであり、ここでは肉体が腐敗を経験しなかったという意味を、自然な日本語で表した。
theological_decisions:
- issue: Χριστόςの称号性
  choice: メシア
  alternative: キリスト
  rationale: ペトロが聖書に基づいて約束された油注がれた者を論じる箇所なので、固有名のような「キリスト」ではなく称号としての意味を明示した。
- issue: ᾅδηςの訳語
  choice: 死者の世界
  alternative: ハデス
  rationale: ᾅδηςはここで死者の領域を指し、最終的な刑罰の場所を特定する語ではない。「死者の世界」はその区別を普通の読者に明確に伝える。
- issue: σάρξの身体性
  choice: 肉体
  alternative: 肉
  rationale: 罪深い性質などの比喩ではなく、メシアの身体が朽ちなかったことを述べるため、具体的な身体性を保つ訳語を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」でὅτι以下が復活について語った内容であることを示した。原文のοὔτε…οὔτεの対応は「〜ず、…も〜なかった」で自然に表現した。
