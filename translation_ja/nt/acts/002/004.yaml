  terminology: 「聖霊」は使徒言行録2章の指示対象に適切であり、特定教派に偏った語法ではない。「ほかのことば」はγλώσσαιの語義幅を本文で過度に限定せず、脚注が「舌／言語」の可能性と後続文脈を適切に補っている。
