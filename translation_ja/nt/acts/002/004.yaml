id: ACT.2.4
reference: Acts 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: ja
  text: 彼らは皆、聖霊に満たされ、聖霊が語らせるままに、ほかのことば[a]で話し始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ほかの舌」。ギリシア語のこの語は「舌」と「言語」のどちらも意味し得る。続く文脈では、聞いた人々がそれぞれ自分の言語として理解したことが示される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: 満たされ
  rationale: πίμπλημιのアオリスト受動態を、聖霊によって力を与えられるという文脈に即して、自然かつ定着した表現で訳した。
- source_word: πάντες
  choice: 皆
  rationale: その場にいた一同の全体を指す簡潔で自然な訳。
- source_word: πνεύματος ἁγίου
  choice: 聖霊に
  rationale: 冠詞はないが、使徒言行録の文脈では約束され、語る力を与える神の聖霊を指す。日本語では固有の指示対象として「聖霊」とした。
- source_word: ἤρξαντο λαλεῖν
  choice: 話し始めた
  rationale: ἄρχομαιと不定詞による動作の開始を、自然な現代日本語で表した。
- source_word: ἑτέραις γλώσσαις
  choice: ほかのことばで
  rationale: γλῶσσαが「舌」と「言語」の双方を表し得ることを踏まえ、「異言」という専門的・教派的に受け取られ得る語を避けつつ、直後の文脈による説明に開かれた表現とした。脚注で語義を明示する。
- source_word: καθὼς
  choice: ままに
  rationale: 聖霊が可能にする仕方・程度に応じて語ったという関係を、簡潔な日本語で表す。
- source_word: ἐδίδου
  choice: 語らせる
  rationale: 未完了過去の継続的な授与・働きかけを、日本語では使役表現に組み込み、聖霊による継続的な発話の賦与を自然に示した。
- source_word: ἀποφθέγγεσθαι αὐτοῖς
  choice: 聖霊が語らせる
  rationale: 「彼らに発言を与える」という逐語的で不自然な表現を避け、公に声を出して語ることを聖霊が可能にしたという意味を保った。
theological_decisions:
- issue: πνεύματος ἁγίουを人格的な神の聖霊への言及として訳すか、一般的な「聖なる霊」とするか。
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 直後のτὸ πνεῦμαが発話を可能にする主体として描かれ、使徒言行録2章全体でもイエスが約束した神の霊を指しているため。本文が示す以上の教理的説明は加えていない。
- issue: γλώσσαιςを「言語」と確定するか、「異言」など語形に近い表現にするか。
  choice: ほかのことば
  alternative: ほかの言語／異なる舌／異言
  rationale: 原語が持つ「舌」と「言語」の語義幅を本文だけで性急に狭めず、同時に現代日本語として理解可能な表現を選んだ。続く2:6–11では聞き手が自分たちの言語として理解したことが明らかになるため、その情報を脚注に示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「御霊」のような教会内に偏りやすい語や、「異言」のように特定の神学的理解を想起させやすい専門語を避けた。前後の主語の明確さを保つため、後半でも「聖霊」を繰り返した。
