id: ACT.2.46
reference: Acts 2:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: ja
  text: そして彼らは、日々、心を一つにして神殿の境内に通い続け、家々でパンを裂き[a]、喜びと飾り気のない心[b]をもって食事[c]をともにしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「パンを裂く」は通常の共同の食事を指し得るが、主の晩餐も含むと理解する人もいる。
    reason: alternative_reading
  - marker: b
    text: 別訳「純真な心」または「誠実な心」。この語には寛大さの含意があるとも考えられる。
    reason: lexical_alternative
  - marker: c
    text: 直訳「食物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 日々
  rationale: κατά＋対格の反復・分配的意味を、簡潔で自然な現代日本語で表す。
- source_word: προσκαρτεροῦντες
  choice: 集まり続け
  rationale: 継続的に専念・持続する意味を保ちつつ、後続する場所句「神殿の境内に」と自然につなげた。
- source_word: ὁμοθυμαδόν
  choice: 心を一つにして
  rationale: 共同性だけでなく、意志や目的の一致を表す語として自然で格調ある表現を選んだ。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内に
  rationale: ἱερόνは内陣そのものではなく神殿域全体を指すため、「境内」で区別を明示した。
- source_word: κλῶντές ... ἄρτον
  choice: パンを裂き
  rationale: ルカ文書に特徴的な表現を保持し、通常の共同の食事と主の晩餐の響きの双方を残した。
- source_word: κατ’ οἶκον
  choice: 家々で
  rationale: κατάの分配的意味を表し、複数の家を場として繰り返し行われたことを自然に示す。
- source_word: μετελάμβανον τροφῆς
  choice: 食事を共にしていた
  rationale: 未完了過去の継続性と、食物にあずかる共同的な文脈を自然な日本語で表した。
- source_word: ἐν ἀγαλλιάσει
  choice: 喜びをもって
  rationale: 高揚した喜びを示すが、日本語で過度に誇張せず明瞭に伝える。
- source_word: ἀφελότητι καρδίας
  choice: 飾り気のない心をもって
  rationale: 単純さ、率直さ、純真さを含む語義の幅を保ち、「誠実」や「寛大」だけに限定しない。
theological_decisions:
- issue: 「パンを裂く」を主の晩餐と明示するか
  choice: 本文では「パンを裂き」と表現を保持する。
  alternative: 通常の共同食だけを指すと訳す、または主の晩餐と明示する。
  rationale: 直後のτροφῆςは通常の食事を支持する一方、この定型表現には主の晩餐との響きもあり得る。本文で一方に限定せず、脚注で解釈の幅を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神殿の境内」「パンを裂く」など原文上重要な区別と慣用表現を保持した。文末は物語叙述にふさわしい「していた」とし、未完了過去の継続性を示した。
