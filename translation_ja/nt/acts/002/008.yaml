  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: ja
  text: それなのに、どうして私たちはそれぞれ、自分が生まれた土地のことばで聞いているのだろうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それぞれ、自分が生まれた所の言語（または方言）で聞いているのだろうか。」
    reason: διάλεκτοςには「言語」と「方言」の両義があり、ἐν ᾗ ἐγεννήθημενのより字義的な表現も提示するため。
lexical_decisions:
- source_word: πῶς
  choice: どうして…のだろうか
  rationale: 驚きを伴う問いを、自然な現代日本語の疑問表現で示す。
- source_word: ἡμεῖς … ἕκαστος
  choice: 私たちはそれぞれ
  rationale: ἡμεῖςの明示的な「私たち」と、ἕκαστοςの分配的な「それぞれ」をともに保持する。
- source_word: ἀκούομεν
  choice: 聞いている
  rationale: 現在形を文脈に即して進行中の知覚として自然に表す。何を聞くかを補わず、原文の簡潔さを保つ。
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: 自分が…土地のことばで
  rationale: διάλεκτοςは「言語」と「方言」の幅を持つため、どちらかに狭く限定しにくい「土地のことば」とし、ἰδίᾳの固有性を「自分が」で表す。
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: 生まれ育った
  rationale: 字義的には「その中で私たちが生まれた」だが、出生地に結びつく言語環境を日本語で明瞭に伝えるため「生まれ育った」とした。厳密な直訳は脚注に示す。
- source_word: καί
  choice: それなのに
  rationale: 前節の驚きに続く問いとして、単なる並列の「そして」よりも文脈上の意外性を自然に示す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある疑問文とした。「土地のことば」により、現代日本語で技術的に響きやすい「方言」と、範囲が広い「言語」の間にある原語の幅を保った。脚注記号[a]を本文に明記した。
