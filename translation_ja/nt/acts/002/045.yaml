  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: ja
  text: そして、財産や持ち物[a]を売り、それらをすべての人に、それぞれの必要に応じて分け与えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「財産」は土地などの資産を、「持ち物」は所有する品々を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: 財産
  rationale: 取得・所有された資産、とりわけ土地などの財産を指し得る語。「財産」とすることで、後続の「持ち物」と一定の区別を保った。
- source_word: ὑπάρξεις
  choice: 持ち物
  rationale: 所有している品や資産一般を表す。「持ち物」は現代日本語として自然で、前の「財産」よりも身の回りの所有物を連想させる。
- source_word: ἐπίπρασκον
  choice: 売り
  rationale: 未完了過去の継続的・反復的な側面は、文末の「分け与えていた」と連動させ、必要に応じて売ることが続いていたという文脈で表した。
- source_word: διεμέριζον
  choice: 分け与えていた
  rationale: 共同体の人々に配分する行為を自然に表し、未完了過去による継続・反復も「ていた」で保持した。
- source_word: αὐτά
  choice: （文脈上省略）
  rationale: ギリシア語では財産や持ち物、またはそれを売って得たものを受ける代名詞だが、日本語で「それらを」とすると品物自体だけを指す印象が強い。目的語を自然に省略し、指示対象の曖昧さを保った。
- source_word: πᾶσιν
  choice: すべての人に
  rationale: 共同体の文脈における受け手を広く示す与格を、そのまま明確に表した。
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: 必要のある人がいれば、その必要に応じて
  rationale: 不定条件の「誰かに必要がある場合」と、必要に即した配分の両方を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: 信者たちによる財産共有の性質
  choice: 必要が生じるたびに売却と分配が行われていた継続的・反復的な実践として訳した。
  alternative: 全財産の一括処分または私有財産の全面的廃止を明示する訳。
  rationale: 未完了過去の二つの動詞は継続・反復を示すが、本文は私有の全面廃止や、すべてのキリスト者への普遍的制度を明言していないため、その点を訳文に加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叙述の品位を保った。「分け与えていた」により継続的・反復的な行為を示し、「必要のある人がいれば、その必要に応じて」により条件と配分基準を明確にした。
