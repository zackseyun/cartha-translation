id: ACT.2.14
reference: Acts 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: ja
  text: しかし、ペテロは十一人とともに立ち、声を張り上げて彼らに語った。「ユダヤの皆さん[a]、またエルサレムに住むすべての皆さん、このことを知ってください。そして、私の言葉に耳を傾けてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ユダヤの男性たち」。または「ユダヤ人の男性たち」。
    reason: ἄνδρεςが男性への呼びかけであることを示すとともに、Ἰουδαῖοιが民族・宗教的な「ユダヤ人」と地理的な「ユダヤの人々」のいずれにも訳し得る語であることを保持するため。
lexical_decisions:
- source_word: Σταθεὶς
  choice: 立ち
  rationale: アオリスト分詞がペテロの姿勢と公に語り始める場面を示す。「立ち」は簡潔で自然であり、「立ち上がり」として起立動作を必要以上に明示しない。
- source_word: δὲ
  choice: しかし
  rationale: 前節の嘲笑する者たちの発言を受けた対照的な展開を示す。
- source_word: σὺν τοῖς ἕνδεκα
  choice: 十一人とともに
  rationale: σύν＋与格の同伴を直接表し、ペテロがほかの十一人と一緒にいたことを明確にする。
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: 声を張り上げて
  rationale: 公衆に届くよう声を大きくする慣用表現として、現代日本語で自然に表した。怒りの含意は加えていない。
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: 人々に語った
  rationale: 公に、はっきりと発言する意味を保ちつつ、この動詞だけから霊感や預言性を明示しない。「人々」は直前の群衆を指す代名詞を自然に補う。
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: ユダヤ人の皆さん[a]
  rationale: 呼びかけとして自然で丁重な現代日本語を用いた。ἄνδρεςの男性限定は本文だけでは見えにくいため、脚注で明示した。Ἰουδαῖοιはこの文脈では地理的な「ユダヤ地方の人々」より、民族・宗教的呼称の「ユダヤ人」が自然である。
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: エルサレムに住んでいるすべての方々
  rationale: 現在分詞の継続的な居住とπάντεςの包括性を明確にし、呼びかけにふさわしい丁重さを保った。
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: このことを知ってください
  rationale: 命令的なἔστωとγνωστόνによる告知を、硬すぎない明瞭な現代日本語で表した。
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: 私の言葉に耳を傾けてください
  rationale: 単に音を聞くのでなく注意深く聞くよう促すアオリスト命令形の力を、「耳を傾ける」で自然に表した。ῥήματαは解釈的な「メッセージ」ではなく「言葉」とした。
theological_decisions:
- issue: Ἄνδρεςの性別を日本語でどう表すか
  choice: 本文は「ユダヤ人の皆さん」とし、脚注で「男性」を明示する
  alternative: ユダヤ人の男性の皆さん
  rationale: 原文のἄνδρεςは成人男性への呼びかけだが、「ユダヤ人の男性の皆さん」は現代日本語の演説として不自然に響く。本文の自然さを保ちつつ、原文の性別情報を脚注で失わないようにした。
- issue: ἀπεφθέγξατοに霊感・預言の意味を明示するか
  choice: 語った
  alternative: 霊に動かされて宣言した
  rationale: この動詞は重みのある公的発言に使われ得るが、語そのものだけで霊感を明示するのは解釈の追加となるため避けた。
- issue: Ἰουδαῖοιを民族的呼称と地理的呼称のどちらで訳すか
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: エルサレムに集まった聴衆への定型的な呼びかけとしては民族・宗教的呼称が自然である。ただし語形上は「ユダヤの者たち」という地理的な響きもあり得るため、その可能性を排他的な教理判断には用いない。
translation_notes:
  register: 公の演説にふさわしい品位を保ちながら、現代の一般読者に分かりやすい丁寧な呼びかけとした。「声を張り上げる」「耳を傾ける」によって公的発言の力強さと注意深く聞くよう求める調子を表した。
