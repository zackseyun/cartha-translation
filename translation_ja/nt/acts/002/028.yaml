  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: ja
  text: あなたは私にいのちに至る道々を知らせてくださいました[a]。あなたの御前で、私を喜びで満たしてくださいます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いのちの道々」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたの御顔とともに」。「御顔」は神の臨在を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: あなたは私に…知らせてくださいました
  rationale: アオリスト能動直説法二人称単数と与格を明示しつつ、神への語りかけとして自然で品位ある敬語にした。単なる「知る」ではなく、知らせるという使役的意味を保つ。
- source_word: ὁδοὺς ζωῆς
  choice: いのちに至る道
  rationale: ὁδούςの複数性は日本語では無標でも表せる。「いのちの道」も可能だが、現代日本語で意味を明瞭にするため、生命へ導くという含意を「に至る」で表した。ただし属格の幅を限定しすぎないよう脚注に直訳寄りの別訳を示す。
- source_word: πληρώσεις με εὐφροσύνης
  choice: 私を喜びに満たしてくださいます
  rationale: 未来形を文脈に即して非過去形で表し、πληρόωと内容を表す属格の構造を「喜びに満たす」と自然に再現した。εὐφροσύνηは晴れやかな喜びを指すが、明快な「喜び」を選んだ。
- source_word: μετὰ τοῦ προσώπου σου
  choice: 御前で
  rationale: 字義は「あなたの顔とともに」だが、神の顔がその臨在を表す慣用句である。「御前で」は簡潔で自然な日本語であり、神の直接的な臨在との関係を保つ。字義的表現は脚注に残した。
theological_decisions:
- issue: 神の臨在を表す「顔」の慣用句
  choice: 御前で
  alternative: あなたの御顔とともに
  rationale: 神との直接的な交わりにある喜びという神学的含意を保ちつつ、不自然な逐語訳を本文に持ち込まない。原語の「顔」は脚注で明示した。
- issue: ὁδοὺς ζωῆςの属格関係
  choice: いのちに至る道
  alternative: いのちの道々
  rationale: 生命によって特徴づけられる道とも生命へ至る道とも取り得るが、引用元の文脈に適する自然な日本語として方向性を示した。原語に近い曖昧な別訳を脚注に置き、解釈の幅を残した。
translation_notes:
  register: 明瞭な現代標準語を用い、神への二人称表現には敬意を示す補助動詞を採用した。「いのち」は聖書文体として認知されつつも平易な表記。詩編引用としての並行性を保つため二文に分けた。
