- from: あなたは私に、いのちに至る道を知らせてくださいました[a]。御前で、私を喜びに満たしてくださいます[b]。
  to: あなたは私にいのちに至る道々を知らせてくださいました[a]。あなたの御前で、私を喜びで満たしてくださいます[b]。
  rationale: 原文の複数形ὁδοὺςを「道々」で明示し、ζωῆςを「いのちに至る」と本文で自然に表しながら、より字義的で幅のある「いのちの道々」を脚注に維持しました。後半は「喜びで満たす」として自然な日本語に改め、「あなたの御前で」により神への直接の呼びかけと臨在の慣用表現を明瞭にしました。未来形πληρώσειςは「満たしてくださいます」で保持しています。
