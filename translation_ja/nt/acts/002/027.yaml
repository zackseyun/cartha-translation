id: ACT.2.27
reference: Acts 2:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: ja
  text: あなたは私の魂をハデス[a]に見捨てず、あなたの聖なる方[b]が朽ち果てる[c]のをお許しにならないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引用元のヘブライ語では「シェオル」。ギリシア語本文では「ハデス」。いずれもここでは死者の領域を指す。
    reason: alternative_reading
  - marker: b
    text: 別訳「あなたに忠実な者」。
    reason: lexical_alternative
  - marker: c
    text: 身体が腐敗し、朽ちることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: 置き去りにせず
  rationale: ある場所や状態に残して見捨てるという語感を保ちつつ、現代日本語として自然にした。
- source_word: τὴν ψυχήν μου
  choice: 私の魂
  rationale: ψυχήには「命」「自分自身」の意味もあり得るが、詩編引用の表現と含意を過度に限定せず保持するため「魂」とした。
- source_word: εἰς ᾅδην
  choice: ハデスに
  rationale: ギリシア語本文のᾅδηςを「地獄」や「墓」と同一視せず、死者の領域を指す語として音写した。εἰςは日本語の「置き去りにする」と組み合わせて自然な「に」とした。
- source_word: δώσεις ... ἰδεῖν
  choice: …ままにはされない
  rationale: 字義的な「見ることを与える」ではなく、許容を表す慣用表現として、朽ちることを許さない意味が自然に伝わる形にした。
- source_word: τὸν ὅσιόν σου
  choice: あなたの聖なる方
  rationale: ὅσιοςの聖さ・敬虔さ・忠実さの語域を踏まえ、文脈上のキリスト論的響きを保つ一方、固有の称号と断定しすぎない表記にした。
- source_word: ἰδεῖν διαφθοράν
  choice: 朽ち果てる
  rationale: διαφθοράの文脈上の身体的腐敗を、現代日本語で明瞭かつ品位ある表現にした。「滅び」として意味を広げすぎない。
theological_decisions:
- issue: 復活の文脈におけるᾅδηςの訳
  choice: ハデス
  alternative: 死者の国／シェオル／墓
  rationale: 後代の「地獄」の教理的連想を持ち込まず、ギリシア語本文の死者の領域という表現を保持した。引用元のヘブライ語については脚注で「シェオル」を示す。
- issue: τὸν ὅσιόν σουのキリスト論的同定
  choice: あなたの聖なる方
  alternative: あなたに忠実な者／あなたの敬虔な者
  rationale: 使徒言行録2章ではこの詩編がイエスの復活に適用されるため、その響きを保ちつつ、ὅσιοςが持つ「忠実な者」という可能性も脚注に残した。
- issue: ψυχήの人間論的含意
  choice: 魂
  alternative: 命／私自身
  rationale: 中間状態について本文以上の体系的主張を加えず、引用文の伝統的な重みと原語の曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、詩編引用としての格調を保った。「ハデス」は説明的に意訳せず脚注で補い、「朽ち果てる」によって身体的腐敗を自然に表した。すべての脚注記号を該当箇所の直後に配置した。
