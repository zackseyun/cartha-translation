lexical_decisions:
- source_word: ἕτεροι
  choice: ほかの人々
  rationale: 形容詞の名詞的用法で、群衆の中の別の一群を指す。現代日本語として自然である。
- source_word: δὲ
  choice: しかし
  rationale: 直前の驚きや問いに対する、この一群の嘲笑的な反応との対照を明確にする。
- source_word: διαχλευάζοντες
  choice: あざけって
  rationale: 軽蔑を込めて嘲笑する意味を、簡潔で品位ある現代語で表す。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去が示す継続的または反復的な発言を表す。
- source_word: ὅτι
  choice: 「……」
  rationale: 発言内容を導く語であり、日本語では直接話法が自然である。
- source_word: Γλεύκους
  choice: 甘いぶどう酒
  rationale: γλεῦκοςは甘みのある新しいぶどう酒を指すため、単なる『酒』や時期だけを表す『新しいぶどう酒』より語義を明確に伝える。
- source_word: μεμεστωμένοι εἰσίν
  choice: 酔っているのだ
  rationale: 字義的には『満たされている』だが、飲酒による状態を嘲っている文脈では『酔っている』が自然で明瞭である。完了分詞と現在形が示す現時点の状態も保つ。
