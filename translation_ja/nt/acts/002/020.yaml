id: ACT.2.20
reference: Acts 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: ja
  text: 主の大いなる、輝かしい[a]日が来る前に、太陽は闇に変えられ、月は血に変えられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「明らかな」「目立った」。
    reason: ἐπιφανῆは、輝かしさだけでなく、はっきり現れていることや際立っていることも表し得るため。
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: 変えられる
  rationale: 未来受動の意味と、太陽および月が別の状態へ移されるという預言的な表現を保つ。後半ではギリシア語で動詞が省略されているが、日本語では意味を明瞭にするため補った。
- source_word: εἰς σκότος
  choice: 闇に
  rationale: εἰςが示す結果の状態を、自然な日本語で表した。
- source_word: εἰς αἷμα
  choice: 血に
  rationale: 「血のような色」などと説明的に言い換えず、原文の強烈な預言的比喩をそのまま保った。
- source_word: πρὶν ἢ ἐλθεῖν
  choice: 来る前に
  rationale: 一つの出来事が主の日の到来に先立つという時間関係を、簡潔で自然な日本語にした。
- source_word: ἡμέραν κυρίου
  choice: 主の日
  rationale: 旧約の預言を背景とする定着した聖書的表現を保ち、曜日を指す表現との混同も避けた。
- source_word: μεγάλην
  choice: 大いなる
  rationale: μέγαςの基本義を保ちつつ、預言の格調にふさわしい現代日本語とした。
- source_word: ἐπιφανῆ
  choice: 輝かしい
  rationale: この語が持ち得る、目に際立つことや壮麗さという意味領域を、終末的文脈で自然に表した。ただし「明らかな」「目立った」という語義も脚注に残した。
theological_decisions:
- issue: ヨエル書を引用する文脈におけるἡμέραν κυρίουの訳
  choice: 主の日
  alternative: 主のための日／主に属する日
  rationale: 神の決定的な介入を指す預言的慣用句を保持し、後代の特定の曜日を指す用法を持ち込まないため。
- issue: 終末的文脈におけるἐπιφανῆの意味
  choice: 輝かしい
  alternative: 明らかな／目立った
  rationale: 壮麗さと顕現性の双方を含み得る語であるため、本文では自然で格調ある訳を採り、別の正当な意味を脚注で明示して曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「闇」「血」「主の日」という預言的な語調と比喩の強さを保持した。「大いなる」は日常語よりやや格調が高いが、この引用の荘重さに適している。
