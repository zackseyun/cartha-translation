id: ACT.2.37
reference: Acts 2:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: ja
  text: 人々はこれを聞いて、心を刺され、ペトロとほかの使徒たちに言った。「兄弟たち、私たちはどうすればよいのでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: 人々はこれを聞いて
  rationale: アオリスト分詞の時間的・因果的なつながりを自然な日本語で示した。「これ」は直前のペトロの説教を文脈から補った。δέはここでは強い対比ではなく談話の進行を示すため、独立した接続語は置かなかった。
- source_word: κατενύγησαν τὴν καρδίαν
  choice: 心を刺され
  rationale: 鋭い痛みを受ける比喩を保ち、深い内的衝撃や罪の自覚を表す。ただし、本文自体が明示しない特定の心理・神学的説明は加えなかった。
- source_word: εἶπόν τε
  choice: 言った
  rationale: λέγωを直接訳し、続く発言が問いであることから「尋ねた」と解釈的に言い換えることは避けた。τεによる密接な連続は日本語の文の流れで表した。
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: ペトロとほかの使徒たちに
  rationale: λοιπούςを「ほかの」とし、ペトロと残りの使徒たちが発言の相手であることを明確にした。
- source_word: Τί ποιήσωμεν
  choice: 私たちはどうすればよいのでしょうか
  rationale: 熟慮を表すアオリスト接続法を、取るべき行動を問う現代日本語として訳した。
- source_word: ἄνδρες ἀδελφοί
  choice: 兄弟たち
  rationale: 二語から成る慣用的な呼びかけを、日本語で不自然な重複を避けて訳した。文法上の男性形を保持しつつ、本文だけで対象範囲を断定的に広げなかった。
theological_decisions:
- issue: 心を刺されたという表現の解釈
  choice: 比喩を保って「心を刺され」とする
  alternative: 「深く心を痛め」「強く罪を悟らされ」
  rationale: 原文は鋭い内的衝撃を表すが、その感情や作用を一つの神学的説明に限定していないため、比喩と緊張を保持した。
- issue: ἄνδρες ἀδελφοίの対象範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹の皆さん／男性の兄弟たち
  rationale: 原文は文法上男性形の慣用的呼称である。「兄弟姉妹」と明示的に拡張することも、「男性」に限定することも避け、原文に近い呼称を採用した。
translation_notes:
  register: 明瞭で現代的ながら dignified な標準日本語。「どうすればよいのでしょうか」により切迫した問いを丁寧かつ自然に表現した。固有名は一般的な聖書表記として「ペトロ」を用いた。
