  source_fidelity: ギリシア語の地名列挙を過不足なく訳している。τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην を「キレネ方面のリビア地方」としたのは、κατά の地理的関係を限定しすぎず適切に保つ。οἱ ἐπιδημοῦντες Ῥωμαῖοι も「滞在中のローマ人」により、一時的に当地にいる者という分詞の含意を保持している。
  naturalness: 「フリギアとパンフィリア、エジプトとキレネ方面のリビア地方、また滞在中のローマ人、」は、前後に連なる出身地・集団の列挙として自然である。末尾の読点も、この節が文中の列挙の一部であることに合う。
