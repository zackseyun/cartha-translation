id: ACT.2.10
reference: Acts 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: ja
  text: フリギアとパンフィリア、エジプトとキレネ方面のリビア地方[a]、また滞在中のローマ人[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キレネ周辺のリビア地方」。
    reason: κατὰ Κυρήνην は、キレネに近い地域、またはキレネを中心とする一帯を指すとも取れる。
  - marker: b
    text: すなわち、ここに一時滞在しているローマ人。別訳「ローマから来ている人々」。
    reason: ἐπιδημοῦντες は一時的な滞在を表すが、Ῥωμαῖοι をローマ人という集団名と見るか、ローマから来た人々と明示するかで表現が分かれる。
lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: フリギアとパンフィリア
  rationale: 二つの地域名を、日本語で一般的な音写により示した。τε καὶ は地名の列挙として自然な「と」で結んだ。
- source_word: Αἴγυπτον
  choice: エジプト
  rationale: 国名の標準的な日本語表記を用いた。
- source_word: τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην
  choice: キレネ方面のリビア地方
  rationale: μέρη は複数の地域・一帯を指すため「地方」とし、κατὰ Κυρήνην はキレネとの地理的関係を示すが範囲を限定しすぎない「方面の」で表した。
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: 滞在中のローマ人
  rationale: ἐπιδημοῦντες が、その場所に一時的に滞在していることを表すため、「滞在中」とした。Ῥωμαῖοι は簡潔に「ローマ人」と訳した。
theological_decisions: []
