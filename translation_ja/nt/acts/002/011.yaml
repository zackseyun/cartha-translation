  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: ja
  text: ユダヤ人もユダヤ教への改宗者も、クレタ人もアラビア人も――私たちは、あの人たちが神の偉大なみわざを私たち自身の言語[a]で語っているのを聞いている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は「舌」とも訳せる。ギリシア語は「舌」と「言語」のどちらも意味し得るが、ここでは聞き手がそれぞれ理解できる言語を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: ユダヤ人
  rationale: ここではユダヤ地方の住民だけでなく、各地から来たユダヤ人を指すため、現代日本語で民族・宗教共同体を表す標準的な語を用いた。
- source_word: τε καὶ
  choice: も……も
  rationale: Ἰουδαῖοί と προσήλυτοι の組み合わせを、日本語で自然な並列として示した。
- source_word: προσήλυτοι
  choice: ユダヤ教への改宗者
  rationale: 異邦人からユダヤ教に加わった人々であることを、一般読者にも明確に伝える表現とした。
- source_word: Κρῆτες
  choice: クレタ人
  rationale: クレタ島の住民を表す現代日本語の標準的な名称。
- source_word: Ἄραβες
  choice: アラビア人
  rationale: 古代の地域的呼称として自然であり、現代の国民概念との不用意な同一視も避けやすい。
- source_word: ἀκούομεν
  choice: 聞こえる
  rationale: 話者たちが現に耳にしている驚きを、日本語の自然な知覚表現で示した。
- source_word: λαλούντων αὐτῶν
  choice: あの人たちが……語っているのが
  rationale: ἀκούομεν に伴う属格分詞の構造を自然な日本語にし、αὐτῶν が直前の諸民族ではなく、群衆が指している話者たちを指すことを明瞭にした。
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: 私たち自身の言語
  rationale: ἡμετέραις の強調を「自身の」で保ち、文脈上 γλῶσσα が聞き分けられる人間の言語を指すことを明確にした。語の字義的な別訳は脚注に残した。
- source_word: τὰ μεγαλεῖα τοῦ θεοῦ
  choice: 神の偉大なみわざ
  rationale: 神に属する、または神が行った偉大な事柄・行為を表す語として、聖書本文にふさわしく、かつ理解しやすい表現を選んだ。
theological_decisions:
- issue: 五旬節の記事における γλώσσαις の意味
  choice: 聞き手が理解できる人間の言語
  alternative: 非人間的または恍惚的な「異言」
  rationale: 直近の文脈では、多地域から来た人々がそれぞれ自分の言語で聞いていることが強調される。後代の異言論を持ち込まず、この場面の叙述上の意味を訳文に反映した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「みわざ」により神の行為を語る箇所の品位を保った。原文冒頭は前節から続く民族一覧なので、日本語では「いる」を補い、続く驚きとの関係を「それなのに」で自然に示した。脚注記号は内容に対応する「言語」の直後に置いた。
