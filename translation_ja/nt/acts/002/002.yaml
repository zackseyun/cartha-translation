  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: ja
  text: すると突然、天から、激しく吹きすさぶ風のような音が起こり[a]、彼らが座っていた家全体に満ちた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「力強く吹き渡る風のような音が起こり」。ギリシア語は、その音を力強く動く空気になぞらえており、実際に風が吹いたとは明言していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 起こり
  rationale: ἦχοςを主語とする出来事の発生を、現代日本語の自然な物語表現で示す。「あった」より動的で、「生じた」より平明。
- source_word: ἄφνω
  choice: 突然
  rationale: 出来事の唐突さを簡潔かつ標準的に表す。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 単なる空というより、ルカ文書で含意される天的な起源を保つ。
- source_word: ἦχος
  choice: 響き
  rationale: 音響現象を自然に表し、「物音」のような否定的含意や、「轟音」のような過度の限定を避ける。
- source_word: ὥσπερ
  choice: ような
  rationale: 風そのものではなく、音を風にたとえる直喩であることを明示する。
- source_word: φερομένης
  choice: 吹きつける
  rationale: 運ばれ、進んでくる空気の動きを日本語として自然に表現する。受動的な字義を機械的に再現せず、πνοήとの結びつきを反映する。
- source_word: πνοῆς
  choice: 風
  rationale: ここではβιαίαςおよび聴覚的な比喩と結びつき、人の息よりも動く空気としての風が適切。
- source_word: βιαίας
  choice: 激しく
  rationale: 力強く激しい性質を表す。日本語では「激しい風」より「激しく吹きつける風」とすることで、修飾関係を自然にした。
- source_word: ἐπλήρωσεν
  choice: 満ちた
  rationale: ギリシア語ではその響きが家全体を満たしたことを示す。日本語では自動詞表現が自然で、主語の連続性も保てる。
- source_word: ὅλον τὸν οἶκον
  choice: 家全体
  rationale: ὅλονの全体性を簡潔に保持する。οἶκοςはこの文脈では建物・部屋を含み得るが、限定せず「家」とした。
- source_word: οὗ ἦσαν καθήμενοι
  choice: 彼らが座っていた
  rationale: 継続中の姿勢を表す迂言的構文を、明瞭な現代日本語で再現する。
theological_decisions:
- issue: 風にたとえられた現象の性質
  choice: 激しく吹きつける風のような響き
  alternative: 実際の激しい風が家を満たした
  rationale: ὥσπερは比較を示しており、本文が明言するのは風そのものではなく、風のような響きである。実際に風が存在したかどうかは断定しない。
translation_notes:
  register: 明瞭で現代的ながら、出来事の荘厳さを損なわない文体とした。「響き」により聴覚的現象を示し、「ような」で原文の比較を明確に保持した。
