  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: ja
  text: そこでフィリポ[a]は言った。「心を尽くして信じるなら、洗礼を受けてもよいでしょう。」すると彼は答えた。「私は、イエスがメシアであり、神の子であると信じます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、3世紀のパピルス写本や4世紀のシナイ写本・バチカン写本を含む最古級のギリシア語写本、および初期のコプト語訳にはありません。一方、ビザンチン系多数本文とラテン語伝承にはあり、2世紀後半のエイレナイオスや3世紀のキプリアヌスなどの初期教父文献にも引用されています。学者の間では、初期の洗礼式で用いられた信仰告白の定型句が、後に使徒言行録の物語本文へ取り入れられたものと説明されることがよくあります。
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: 受けることができます
  rationale: 非人称動詞は許可・可能を表す。直前の洗礼の申し出を補って、洗礼を受けられるという意味を自然な日本語で示した。
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: 心を尽くして
  rationale: 全人格的で真実な信頼を表す聖書的慣用句として、自然で格調のある表現を選んだ。
- source_word: Πιστεύω
  choice: 私は…と信じます
  rationale: 告白の文脈における信仰と同意を、現代日本語で明確に表す。
- source_word: Χριστόν
  choice: メシア
  rationale: 称号としての意味を明示し、固有名の一部のように扱うことを避けた。
theological_decisions:
- issue: 告白における述語の関係と語順
  choice: イエスが神の子、メシアである
  alternative: イエス・キリストが神の子である
  rationale: ギリシア語は『イエス・メシアが神の子である』とも『イエスが神の子、メシアである』とも統語的に理解しうる。本文の語順と英語POBの監査判断を踏まえ、二つの称号を並べる形で曖昧さを過度に解消しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語。会話として自然でありながら、聖書本文にふさわしい簡潔さと品位を保った。「受けることができます」は文脈上の洗礼を補うが、本文中で不要に反復しない表現とした。
