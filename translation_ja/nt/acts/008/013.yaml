id: ACT.8.13
reference: Acts 8:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: ja
  text: シモン自身もまた信じ、洗礼を受けた後はフィリポのそばにとどまり続けた。そして、しるしや大きな力の現れ[a]が起こるのを目の当たりにして、驚いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな奇跡」とも訳せる。ギリシア語は、奇跡だけでなく、力の現れや力ある業を表すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: 自身も
  rationale: αὐτόςの強調とκαίの付加の意味をともに保ち、シモンもまた応答したことを明確にする。
- source_word: ἐπίστευσεν
  choice: 信じ
  rationale: 動詞が明言する範囲にとどめ、シモンの信仰が真正であったかどうかを訳文で決着させない。
- source_word: βαπτισθεὶς
  choice: 洗礼を受けた後は
  rationale: アオリスト受動分詞が主節の継続的行為に先立つことを、自然な日本語で示す。
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: ずっとフィリポについていた
  rationale: 迂言的未完了形の継続性と、フィリポのもとにとどまり続けた意味を平明に表す。
- source_word: θεωρῶν
  choice: 目の当たりにして
  rationale: 単なる視認以上に、起きていることを継続して注視していた含みを自然に表す。
- source_word: σημεῖα
  choice: しるし
  rationale: 出来事の啓示的・証示的な性格を保つ、定着した訳語である。
- source_word: δυνάμεις μεγάλας
  choice: 大いなる力の業
  rationale: 神的な力の顕現を表す語の性格を保ちつつ、直ちに「奇跡」と限定しない。
- source_word: γινομένας
  choice: 行われる
  rationale: しるしと力の業がシモンの見ているところで生じていたことを表す。
- source_word: ἐξίστατο
  choice: 驚嘆していた
  rationale: 未完了形が示す継続的な驚きを保ち、強い驚愕を簡潔に表現する。
theological_decisions:
- issue: シモンの「信じた」ことを真正な回心と断定するか
  choice: 限定を加えず「信じ」と訳す
  alternative: 「真に信じた」「信じると告白した」「表面的に信じた」
  rationale: 本文はシモンが信じて洗礼を受けたと述べる一方、後続の物語は解釈上の緊張を残す。訳文では真正・不真正のいずれも付加しない。
- issue: δυνάμεις μεγάλαςを「奇跡」と限定するか
  choice: 大いなる力の業
  alternative: 大いなる奇跡
  rationale: 文脈上は奇跡的な働きを指すが、δύναμιςが持つ「力の現れ」という語感を本文に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ところが」で叙述の転換を示し、「ずっと」「目の当たりにして」により継続的な動作を自然に表した。固有名は「フィリポ」とした。
