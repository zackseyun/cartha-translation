  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: ja
  text: さて、敬虔な男たちはステファノを葬り[a]、彼を悼んで大いに嘆き悲しんだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ステファノの遺体を引き取って葬り」または「ステファノを葬るために運び」。ギリシア語の動詞は、埋葬そのものだけでなく、遺体を引き取り、運び、葬る支度をすることにも重点を置き得る。
    reason: lexical_alternative
  - marker: b
    text: この表現は、心の内の悲しみだけでなく、声を上げるなど、公に表された激しい哀悼を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: 葬り
  rationale: 文脈上、死後の遺体を引き取り、埋葬する一連の行為を指す。「葬る」は自然な日本語でその到達点を表すが、動詞自体は遺体を運ぶ、または埋葬の準備をする面も含み得るため、脚注で補う。
- source_word: δέ
  choice: しかし
  rationale: 直前のステファノの死と、それに続く敬虔な人々の行動との穏やかな対照・場面転換を示す。
- source_word: ἄνδρες εὐλαβεῖς
  choice: 敬虔な人々
  rationale: ἄνδρεςは成人男性を指すが、日本語の「人々」はここでその集団を自然に表現できる。εὐλαβεῖςの宗教的な畏敬と信心深さは「敬虔な」で保持する。
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: 激しく嘆き悲しんだ
  rationale: 直訳的な「大きな哀悼を行った」より自然であり、μέγανの強さと、κοπετόςが示し得る外に表れた激しい悲嘆を伝える。
- source_word: ἐπ’ αὐτῷ
  choice: 彼のために
  rationale: 哀悼表現に伴うἐπί＋与格を、現代日本語で自然な「彼のために」とした。「彼を思って」「彼の死を悼んで」に近い意味である。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、叙述の厳粛さを保った。「激しく嘆き悲しんだ」により、原文の慣用表現を不自然な名詞構文にせず伝えた。すべての脚注標識を本文中に配置した。
