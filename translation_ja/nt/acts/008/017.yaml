  text: τότε ⸀ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς, καὶ ἐλάμβανον πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: ja
  text: そこで、二人は彼らに手を置き、彼らは聖霊を受けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そこで、二人は彼らに手を置いており、彼らは聖霊を受けていた」とも訳せる。原文の二つの動詞はいずれも未完了過去形で、文脈に応じて継続的または反復的な動作を表しうる。
    reason: 原文の二つの未完了過去形が持つアスペクト上の可能性を示すため。
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 直前の祈りに続いて起こったことを示す時間的・叙事的な接続語。日本語の物語文として自然に展開を示す。
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: 二人が彼らに手を置くと
  rationale: 「手を置く」はこの身ぶりを表す定着した自然な日本語。「二人」は文脈上のペトロとヨハネを指す複数主語を明確にする。接続助詞「と」により、続く聖霊の受領との時間的な結びつきを示すが、因果関係の仕組みまでは断定しない。
- source_word: ἐλάμβανον
  choice: 受けた
  rationale: 未完了過去形だが、日本語の叙事文では単純な過去形が最も自然。継続・反復の可能性は脚注で明示し、「受け始めた」のような起動相を本文に付加しない。
- source_word: πνεῦμα ἅγιον
  choice: 聖霊
  rationale: ルカ文書のこの文脈では、信じる者に与えられる神の霊を指す。日本語では固有の指示対象として「聖霊」とするのが自然であり、不定冠詞に相当する表現は加えない。
theological_decisions:
- issue: πνεῦμα ἅγιονが神の聖霊を指すか、不定の「聖なる霊」を指すか
  choice: 聖霊
  alternative: 一つの聖なる霊
  rationale: 使徒言行録の直近の文脈では、使徒たちが人々のために受けるよう祈った神の霊を指している。「聖霊」はその指示対象を自然に表し、本文を越える教理的説明は加えない。
- issue: 二つの未完了過去形のアスペクトを日本語でどう表すか
  choice: 本文では自然な叙事過去とし、未完了過去形であることを脚注で示す
  alternative: 二人は彼らに次々と手を置き、彼らは聖霊を受けていった
  rationale: 二つの動詞はいずれも継続または反復を表しうるが、文脈だけではその細かな様態を一つに限定できない。本文で「次々と」を補わず、脚注で原文のアスペクト上の幅を保持する。
- issue: 手を置くことと聖霊を受けることの関係
  choice: 「手を置くと」で時間的な連続を示す
  alternative: 手を置いたので
  rationale: 原文のκαίは二つの出来事を結ぶが、明示的な因果説明はしていない。「ので」を避け、出来事の連続と密接な関連だけを表す。
translation_notes:
  register: 明快で現代的な標準日本語を用い、礼拝朗読にも耐える簡潔で品位ある文体とした。「按手」のような専門語は避け、一般読者に分かる「手を置く」を用いた。
