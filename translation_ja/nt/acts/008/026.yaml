  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: ja
  text: 主の天使がフィリポにこう語った。「立って、南へ向かい[a]、エルサレムからガザへ下る道に行きなさい。」その道は人けがない。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「真昼に」。ギリシア語は方向（「南へ」）とも時刻（「正午に」）とも取れる。
    reason: alternative_reading
  - marker: b
    text: あるいは「そこは荒れ野である」。道そのものに人けがないという意味ではなく、その道が荒れ野の地域を通るという意味とも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: 主の使いが
  rationale: ἄγγελος はこの文脈では神から遣わされた超自然的な「使い」を指す。冠詞がないため「主の使い」とし、特定の存在として過度に限定しない。δέ は場面の移行を担うが、日本語で接続語を補わなくても自然に伝わるため明示しない。
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: フィリポにこう語った
  rationale: 直訳的な「語り、言った」という重複を避けつつ、フィリポへの発話と、後に続く直接話法を自然に示す。
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: 立って、…行きなさい
  rationale: 二つの命令を保ち、Ἀνάστηθι が行動開始を促す表現であることを、現代日本語として自然に表す。
- source_word: κατὰ μεσημβρίαν
  choice: 南へ向かい
  rationale: 移動命令と結び付くため方向を示す「南」が文脈上有力。ただし「真昼に」という時間的解釈も可能なので脚注に残す。
- source_word: ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: エルサレムからガザへ下る道に行きなさい
  rationale: 高地のエルサレムからの地理的下降を「下る」で保ち、ἐπί による道への移動を自然な日本語で表す。
- source_word: αὕτη ἐστὶν ἔρημος
  choice: その道は人けがない
  rationale: 女性形 αὕτη は女性名詞 ὁδός（道）を受ける可能性が高い。「人けがない」は ἔρημος の無人・寂寥の意味を明瞭に伝える。一方、「荒れ野」を指す可能性は脚注に示す。
theological_decisions:
- issue: 「主の使い」の同定
  choice: 本文が述べる範囲にとどめ、「主の使い」と訳す
  alternative: 「神から遣わされた天使」、または特定の顕現者として解する
  rationale: κυρίου は使いが主に属する、または主から遣わされたことを示すが、その存在について本文以上の神学的同定を要求しない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、命令と語りの簡潔で格調ある調子を保った。直接話法は命令の終わりで閉じ、最後の文は語り手による地理的説明として示した。
