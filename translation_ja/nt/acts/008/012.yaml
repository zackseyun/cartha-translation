  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: ja
  text: しかし、フィリポが神の国とイエス・キリストの名について福音を告げるのを信じたとき、男も女もバプテスマを受けていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ
  choice: しかし、…と
  rationale: ὅτεの時を示す働きは、前節からの展開の中で「信じ」に伴う文脈として自然に表し、δέの穏やかな対比は「しかし」で保持した。
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: フィリポを信じ
  rationale: 与格を伴うπιστεύωは、ここではフィリポを救いの対象として信仰する意味ではなく、福音を告げる者としてその言葉を信じることを表す。「フィリポを信じ」は簡潔で、後続句が信じた内容を示す。
- source_word: εὐαγγελιζομένῳ
  choice: 福音を告げる
  rationale: 現在分詞がフィリポを修飾し、彼が良い知らせを宣べ伝えていたことを表す。現代日本語の聖書文体として明瞭な「福音を告げる」とした。
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: 神の国とイエス・キリストの名について
  rationale: περί＋属格の話題提示を「について」で表し、二つの内容を並列のまま保持した。ὄνομαは人物、その権威、啓示されたあり方を含み得るため、「名」を言い換えず残した。
- source_word: ἐβαπτίζοντο
  choice: バプテスマを受けていった
  rationale: 未完了過去の継続的・反復的な様相を、次々に人々が応答したことを自然に示す「受けていった」で表した。受動の意味も「受ける」によって保持される。
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: 男も女も
  rationale: τε…καίによる両群の明示的な包含を、簡潔で自然な現代日本語で表した。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστοῦの訳
  choice: イエス・キリスト
  alternative: メシアであるイエス／イエス・メシア
  rationale: 日本語では「イエス・キリスト」が、Χριστόςの称号としての由来を保ちながら最も広く理解される定着表現である。「メシアであるイエス」は称号性を明示するが、原文にない説明を本文へ加え、属格の連続を重くするため採らなかった。
- issue: 「名」の意味範囲
  choice: 名をそのまま保持
  alternative: 権威／イエス・キリストご自身
  rationale: ὄνομαは単なる呼称に限らず、人格・権威・明らかにされた身分を含み得る。特定の一義に解消せず、原文の神学的な広がりを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒言行録にふさわしい簡潔で品位ある叙述とした。「バプテスマ」は宗教用語として一般に定着しており、「洗礼」より原語との対応が見えやすい。未完了過去は不自然な直訳を避けて「受けていった」で示した。
