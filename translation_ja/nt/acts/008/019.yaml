  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: ja
  text: こう言った。「私が手を置く人がだれでも聖霊を受けるように、この権威[a]を私にも与えてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「力」。ギリシア語エクスーシアは、委ねられた権威、権利、または行為する力を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: こう言った
  rationale: 現在分詞は前節の動作に伴ってシモンの発言を導入する。日本語では「こう言った」とするのが自然で、物語上のつながりも明確になる。
- source_word: Δότε
  choice: 授けてください
  rationale: δίδωμι のアオリスト命令法複数。求めているものが権威であるため、単なる「与えて」より「授けてください」が自然であり、複数の相手への依頼も丁寧な表現で伝える。
- source_word: κἀμοί
  choice: 私にも
  rationale: καί と ἐμοί の融合形で、シモン自身も同じ権威を得たいという追加・包含の意味を明確に表す。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 行為する権限・資格・委ねられた力を表す語である。文脈上は実効的な力も含むが、δύναμις などの「力」をより直接表す語との語彙的区別を保つため「権威」とした。
- source_word: ταύτην
  choice: この
  rationale: シモンが直前に目撃した特定の権威を指す指示語として、そのまま明確に訳した。
- source_word: ἵνα
  choice: 〜られるよう
  rationale: シモンがその権威を求める目的を示す。日本語では目的節を主節の前に置くことで、自然かつ明瞭に表現できる。
- source_word: ᾧ ἐὰν
  choice: 人はだれでも
  rationale: 関係代名詞と ἐάν の組み合わせが表す不定・一般的条件を自然な現代日本語で表した。
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: 私が手を置く
  rationale: 按手という具体的な動作を解釈的に言い換えず、原文の身体的表現を保った。
- source_word: λαμβάνῃ
  choice: 受けられる
  rationale: ἵνα に従う現在接続法で、意図された結果が可能になることを、日本語の可能表現で自然に示した。
- source_word: πνεῦμα ἅγιον
  choice: 聖霊
  rationale: 冠詞はないが、使徒言行録の文脈では神の霊を指す固有の指示対象である。日本語では「聖霊」が自然であり、不定の「ある聖なる霊」とは訳さない。
theological_decisions:
- issue: 無冠詞の πνεῦμα ἅγιον を不定の存在として訳すか
  choice: 聖霊
  alternative: ある聖なる霊
  rationale: 使徒言行録の文脈では神の霊を指している。無冠詞であることだけを理由に不定表現にすると、物語の指示対象を誤って伝えるため。
- issue: ἐξουσία が権限を指すか、作用する力を指すか
  choice: 権威
  alternative: 力
  rationale: この文脈では聖霊を受けさせる実効的な力が含意される一方、語そのものは権限・資格・行為する権威を表し得る。本文では「権威」として語彙的区別を保ち、「力」の可能性は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、依頼として自然な丁寧さを持たせた。語順は日本語として読みやすいよう目的節を先に置いたが、原文の目的関係と焦点は保持している。
