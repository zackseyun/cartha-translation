base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: ja
  text: すると、霊がフィリポに言った。「この馬車に近づき、そのそばに付きなさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この馬車に近づき、そのそばを離れずにいなさい。」
    reason: κολλήθητιには、しっかり付く、そばにとどまるという意味合いがあるため。
lexical_decisions:
- source_word: εἶπεν
  choice: 言った
  rationale: 物語の中で直接話法を導くアオリストとして、現代日本語で最も自然な表現。
- source_word: δὲ
  choice: すると
  rationale: 強い対比ではなく物語の進行を示しており、直前の出来事を受けた展開を自然に表す。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 本文に「聖」を補わず、神からの導きを与える人格的主体を指す定冠詞付きの表現を簡潔かつ尊厳ある日本語で示す。
- source_word: τῷ Φιλίππῳ
  choice: フィリポに
  rationale: 与格の間接目的語を自然に表し、人名は日本語聖書で広く通用する形とした。
- source_word: Πρόσελθε
  choice: 近寄って
  rationale: 馬車の方へ移動して接近するよう命じるアオリスト命令形の意味を明確に表す。
- source_word: κολλήθητι
  choice: 付いて行きなさい
  rationale: κολλάομαιが表す密着・近接の含みを保ちつつ、走行中の馬車に寄り添って進むという文脈に自然な日本語とした。単なる参加を意味する「加わりなさい」は避けた。
- source_word: τῷ ἅρματι τούτῳ
  choice: あの馬車に
  rationale: ἅρμαはこの場面では乗用の馬車。「あの」は、話者とフィリポの視界にある対象を指し示す日本語として自然であり、τούτῳの指示機能を保つ。
theological_decisions:
- issue: τὸ πνεῦμαの指示対象
  choice: 「御霊」とし、聖霊を指すと理解できる表現にする
  alternative: 「聖霊」と明示する、または「霊」とする
  rationale: 使徒言行録では、このように信徒へ神的な指示を与える「御霊」は聖霊を指すと考えられる。ただしギリシア語本文にはἅγιονがないため、「聖」を補わず原文の表現を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神的主体には「御霊」を用いて聖書本文としての品位を保った。命令文は過度に硬くせず、場面の動きを理解しやすくした。
