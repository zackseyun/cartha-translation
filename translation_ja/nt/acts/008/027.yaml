source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: ja
  text: そこでフィリポは立ち上がり、出かけた。すると、見よ、エチオピア人の男がいた。彼は宦官[a]で、エチオピア人の女王カンダケ[b]に仕える高官であり、女王のすべての財宝を管理していた。彼は礼拝するためエルサレムに来ていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「宦官」に当たるギリシア語は、文脈によっては広く「宮廷役人」を指すこともある。ただし、ここでは文字どおりの意味である可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 「カンダケ」は個人名ではなく、女王に用いられた王朝的な称号であった可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: 立ち上がって出かけた
  rationale: 分詞に続く主動詞の動作順を保ちつつ、現代日本語の自然な物語表現とした。
- source_word: ἰδοὺ
  choice: すると見よ
  rationale: 場面に新たな人物を鮮明に導入する注意喚起の機能を明示した。「見よ」によってルカの語り口を保ち、「すると」で日本語の流れを整えた。
- source_word: ἀνὴρ Αἰθίοψ
  choice: エチオピア人の男
  rationale: 民族的出自だけに縮約せず、ἀνήρが明示する男性であることも保持した。
- source_word: εὐνοῦχος
  choice: 宦官
  rationale: 第一義的な身体的・社会的意味を本文に採用した。官職一般を指す可能性は脚注で示し、後続のδυνάστηςとの重複を避けた。
- source_word: δυνάστης
  choice: 高官
  rationale: 権力と高い地位を持つ人物を、主権者と誤解させず簡潔に表す。
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: エチオピア人の女王カンダケ
  rationale: 属格関係を自然な日本語にし、Αἰθιόπωνの民族複数形も反映した。カンダケが王朝的称号である可能性は脚注に残した。
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: その全財産を管理していた
  rationale: ἐπὶが示す管理責任とγάζαが示す財宝・富を自然に表した。制度的な「国庫」まで限定せず、語義の幅を保った。
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: 礼拝するためエルサレムに来ていた
  rationale: 完了過去の先行性と未来分詞の目的用法を、自然な日本語で保持した。
theological_decisions:
- issue: εὐνοῦχοςを身体的意味の「宦官」とするか、一般的な「宮廷役人」とするか
  choice: 本文では「宦官」
  alternative: 宮廷役人
  rationale: 語の基本義を保ち、この人物の身体的・社会的境遇を曖昧にしない。官僚としての地位はδυνάστηςを「高官」と訳すことで別に示されているため、εὐνοῦχοςまで官職名に一般化しない。
- issue: γάζαを「国庫」と制度的に限定するか、「財産」とするか
  choice: その全財産
  alternative: その全財宝／国庫
  rationale: 文脈上は王室財務の管理を指すが、原語は財宝・富・宝庫の幅を持つ。「財産」は管理対象を明瞭にしつつ、近代的な国家制度としての国庫に過度に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ἰδοὺは「見よ」として聖書物語の注意喚起を保った。「宦官」「高官」を併置して原文の二つの身分描写を区別し、文が過度に長くならないよう複数文に分けた。
