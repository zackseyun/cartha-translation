id: ACT.8.16
reference: Acts 8:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: ja
  text: というのは、聖霊がまだ彼らのだれの上にも降っておらず[a]、彼らはただ主イエスの名によって洗礼を受けていただけだったからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らのだれの上にも落ちていなかった」。ここでは、聖霊が人に臨むことをいう。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「主イエスの名へと」。原文の表現は、主イエスの名との関わりに入る洗礼を指す慣用表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: まだ……ておらず
  rationale: その時点まで出来事が起きていなかったことを、自然な現代日本語で表す。
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: 彼らのうちのだれにも
  rationale: ἐπίが示す「人の上に臨む」という方向性は動詞「降る」に担わせ、対象の範囲を明瞭にした。
- source_word: ἐπιπεπτωκός
  choice: 降っておらず
  rationale: ἐπιπίπτωの空間的イメージを保ちつつ、聖霊が人に臨むことを表す使徒言行録の文脈に合う自然な表現とした。完了形の結果状態も「ておる」で反映した。
- source_word: μόνον
  choice: ただ……だけ
  rationale: 聖霊がまだ降っていないことと、すでに洗礼を受けていたこととの限定・対照を明確にする。
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: 洗礼を受けていただけだった
  rationale: 完了分詞と未完了過去の迂言形が示す、先に洗礼を受け、その状態にあったことを自然な日本語で表した。
- source_word: εἰς τὸ ὄνομα
  choice: 名へと
  rationale: εἰςの方向性を保持し、単に「名によって」として洗礼の執行文句に限定することを避けた。日本語ではやや特異な表現となるため注で説明した。
- source_word: κυρίου Ἰησοῦ
  choice: 主イエス
  rationale: κύριοςを「主」とし、称号と固有名の結びつきを簡潔に保った。
theological_decisions:
- issue: ἐπιπεπτωκόςの省略された主語
  choice: 直前の節を受けて「聖霊」と明示する
  alternative: 日本語でも主語を省略する
  rationale: ギリシア語では主語が省略されているが、直前の8章15節に「聖霊」が明示されており、指示対象は文脈上明らかである。日本語本文でも誤解を避けつつ、新たな解釈を加えない。
- issue: 洗礼と「名」の関係を表すεἰς
  choice: 「主イエスの名へと」と方向性を残す
  alternative: 「主イエスの名によって」または「主イエスの名の中へ」
  rationale: この節自体が後代の洗礼執行文句や秘跡理解を決着させるかのように訳さず、εἰςの比喩的・関係的な幅を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖霊」は直前の文脈から補い、「降る」によって原語の空間的比喩を残した。「名へと」は通常の日本語としてやや異質だが、原文のεἰςを平板化せず、注で意味の幅を支えた。
