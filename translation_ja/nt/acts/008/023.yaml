  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: ja
  text: 私は、あなたが苦い胆汁[a]と不義の束縛[b]の中にいることが分かるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「苦い胆汁」は、毒のような苦味を思わせる鮮烈な比喩。旧約聖書の表現を響かせている可能性がある（申命記29章18節〔七十人訳〕参照）。
    reason: cross_reference
  - marker: b
    text: 別訳「不義の鎖」「悪の足かせ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς
  choice: ～の中に
  rationale: ὁρῶ σε ὄνταと結びつき、シモンが置かれている状態・領域を表すため、日本語では「～の中にいる」とした。
- source_word: γὰρ
  choice: ～からです
  rationale: 直前のペトロの叱責の理由を示す接続辞なので、文末の理由表現として自然に訳した。
- source_word: χολὴν πικρίας
  choice: 苦味の胆汁
  rationale: χολήの具体的で強烈な比喩を「苦しみ」などに平板化せず、属格πικρίαςも保って「苦味の胆汁」とした。毒を思わせる旧約的表現の響きを残している。
- source_word: σύνδεσμον ἀδικίας
  choice: 不義の束縛
  rationale: σύνδεσμοςは縛るもの・結びつけるものを表し、ἀδικίαはここでは道徳的な不義を指す。「不義による束縛」と断定せず、属格の関係の曖昧さを保った。
- source_word: ὁρῶ
  choice: 私には分かる
  rationale: ここでは肉眼で見ることより、相手の状態を見抜く意味合いが強い。「見える」より自然な現代日本語で識別の意味を表した。
- source_word: σε ὄντα
  choice: あなたが～の中にいること
  rationale: 目的格と分詞の構文を、日本語で自然な内容節として表現した。
theological_decisions:
- issue: シモンの霊的・道徳的状態を描く二つの比喩
  choice: 「苦味の胆汁」と「不義の束縛」という原文の比喩を保持した。
  alternative: 「苦い毒に満ち、罪のとりこになっている」のように意味を説明して訳す。
  rationale: 原文はシモンの状態を強烈な比喩で述べるが、その比喩を教理的説明に展開してはいない。現在の束縛された状態という厳しさと、表現上の含みをともに残すためである。
- issue: ἀδικίαςの属格の関係
  choice: 「不義の束縛」とし、不義が束縛の性質・原因・領域のいずれであるかを限定しなかった。
  alternative: 「不義による束縛」または「不義へと縛る鎖」と明示する。
  rationale: ギリシア語の簡潔な属格表現には複数の理解があり、本文だけでは一つに決めきれないため、その緊張を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、「胆汁」「不義」「束縛」という重みのある語で原文の厳粛で強烈な比喩を保った。語順は日本語として自然になるよう、理由を示す「からです」を文末に置いた。
