  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: ja
  text: しかしシモンは、使徒たちが手を置くことによって霊[a]が与えられるのを見ると、彼らに金を差し出し、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊」。ギリシア語本文は単に「霊」だが、文脈では聖霊を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 見ると
  rationale: アオリスト分詞を、シモンが見たことに続いて金を差し出したという時間的な流れを自然に示す表現とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の出来事からシモンの反応へ移る軽い対照・展開を示す。
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: 使徒たちが手を置くことによって
  rationale: διά＋属格の手段性を保ちつつ、「按手」のような専門語を避け、現代の一般読者に明瞭な表現とした。属格関係も、手を置く主体が使徒たちであることが自然に分かる形にした。
- source_word: δίδοται
  choice: 与えられる
  rationale: 歴史的現在の受動態を日本語の文脈に自然な非過去形で表し、御霊を与える究極的主体を本文以上に特定しない。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 原文は「聖なる」を明記せず「その霊」とするが、文脈上は聖霊を指す。「御霊」は神の霊を示しつつ、原文の簡潔さを保つ。別訳を脚注に示した。
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: 彼らに金を差し出し
  rationale: προσφέρωの提示・提供の意味と、αὐτοῖςの間接目的語を明瞭に表す。「差し出す」は支払いを申し出る文脈に自然であり、χρήματαは一般的な「金」とした。
theological_decisions:
- issue: τὸ πνεῦμα の指示対象
  choice: 御霊（文脈上、聖霊）
  alternative: 聖霊
  rationale: 8章15–17節の文脈では聖霊を指すことが明白だが、この節のギリシア語は ἅγιον を伴わない。本文では原文の簡潔さを保ち、脚注で明示的な別訳を示す。
- issue: 御霊が与えられる際の使徒たちの位置づけ
  choice: 使徒たちが手を置くことによって御霊が与えられる
  alternative: 使徒たちが手を置いて御霊を授ける
  rationale: 原文の受動態と διά＋属格による手段の表現を保ち、使徒たちを御霊の究極的な授与者とは言い切らない。秘跡的・反秘跡的な結論を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「手を置く」として専門用語を避けた。節末は次節へ続く原文の統語と提示された英語POBに合わせ、読点で閉じた。
