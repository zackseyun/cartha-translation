source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: ja
  text: 実に、汚れた霊につかれていた多くの人から、汚れた霊が大声で叫びながら[a]出て行った。また、体が麻痺した人や足の不自由な人も多く癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、「叫びながら」は最も自然には汚れた霊を説明している。
    reason: 分詞が何を修飾するかを明示し、原文の統語上の判断を読者に知らせるため。
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα
  choice: 汚れた霊につかれていた多くの人から
  rationale: γάρは前節の説明を導くが、日本語では独立した節の冒頭に「というのも」を置くと重くなるため、文脈上の連続に委ねた。「汚れた霊を持つ」を直訳せず、憑依を表す自然な「つかれていた」とした。
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: 霊が大声で叫びながら
  rationale: 分詞 βοῶντα は中性複数 πνεύματα ἀκάθαρτα と一致するため、叫ぶ主体を霊として明示した。φωνῇ μεγάλῃ は自然な現代日本語の「大声で」とした。
- source_word: ἐξήρχοντο
  choice: 出て行った
  rationale: 悪霊追放の場面における「人から出る」という動きを自然に表し、未完了過去の反復・進行的背景は「多くの人から」という文脈で十分伝わるため単純過去とした。
- source_word: παραλελυμένοι
  choice: 体が麻痺した人
  rationale: 完了受動分詞が示す継続的な身体状態を、一般読者に明瞭で尊厳を損なわない表現で示した。
- source_word: χωλοὶ
  choice: 足の不自由な人
  rationale: 歩行に障害のある状態を、現代日本語で自然かつ配慮のある表現にした。
- source_word: ἐθεραπεύθησαν
  choice: 癒やされた
  rationale: 治療・回復を表す受動態を保ち、聖書物語で自然な「癒やされた」とした。
theological_decisions:
- issue: 叫びながら出て行った主体
  choice: 汚れた霊が叫びながら、人々から出て行った
  alternative: 霊につかれた人々が叫び、霊が出て行った
  rationale: βοῶντα は文法上 πνεύματα ἀκάθαρτα と自然に一致し、福音書・使徒言行録の悪霊追放場面にも合致する。ただし伝承本文の統語には難しさがあるため、脚注で主体の判断根拠を示した。
translation_notes:
  register: 明快な現代標準日本語。悪霊追放の描写では主体を明示しつつ、過度に説明的にならないよう整えた。身体状態については、意味を保ちながら現代の一般読者に自然で尊厳ある語を選んだ。
