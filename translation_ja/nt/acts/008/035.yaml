id: ACT.8.35
reference: Acts 8:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: ja
  text: そこでフィリポは口を開き、この聖書の箇所から説き起こして、イエスについての福音を彼に告げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: 口を開き
  rationale: 語義と物語の荘重さを保ちつつ、日本語でも「語り始める」という慣用的な意味が自然に伝わる。
- source_word: δὲ
  choice: そこで
  rationale: 直前の問いと招きに応じてフィリポが語り始めるという、物語上の展開と応答のつながりを自然に示す。
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: この聖書の箇所から説き起こして
  rationale: ἀπόが示す出発点を「から」で保持する。「説き起こして」は、その箇所を起点に説明を展開したことを明瞭に表す。
- source_word: γραφῆς
  choice: 聖書の箇所
  rationale: γραφήはここで聖なる書を指すが、指示語ταύτηςと文脈上引用された特定箇所を受けるため、「聖書」だけでなく「聖書の箇所」とするのが日本語では明確である。
- source_word: εὐηγγελίσατο
  choice: 福音を…告げた
  rationale: 良い知らせを宣べ伝えるという動詞の力を、現代日本語で簡潔かつ聖書文体として自然に表す。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 原文の代名詞をそのまま反映し、本文にない名詞を補わない。
- source_word: τὸν Ἰησοῦν
  choice: イエスについての
  rationale: εὐαγγελίζομαιに伴う対格が告知内容を示す構文を、日本語で自然に表現し、イエスが福音告知の中心であることを保持する。
theological_decisions:
- issue: εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν の意味
  choice: イエスについての福音を彼に告げた
  alternative: 彼にイエスを福音として告げた／彼にイエスを宣べ伝えた
  rationale: 原文は「イエス」を福音告知の内容・中心として置く。選択した訳は、イエス自身が告知の焦点であることを保ちながら、現代日本語として意味を明瞭にする。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒言行録の物語にふさわしい端正さを保った。「口を開き」は原文の表現を保持し、「説き起こして」によって単なる開始ではなく、その聖書箇所を出発点とした説明であることを自然に示した。英語POBの脚注記号は内容との対応がずれているように見えるため、原文上必要な異読・語義注がない本節では脚注を設けていない。
