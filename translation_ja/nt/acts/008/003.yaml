  rationale: λυμαίνομαιの強い継続的な害悪、κατὰ τοὺς οἴκουςの配分的・反復的な意味、σύρωの強制性、παραδίδωμιの引き渡しという流れを保った。一方、εἰσπορεύομαιに不法侵入の意味を付加する「押し入り」と、σύρωに「外へ出す」を明示的に加える「引きずり出す」は、原文により近い表現へ改めた。脚注のアンカーと内容は、それぞれλυμαίνομαιおよび家々へ入る表現に適切に対応している。
