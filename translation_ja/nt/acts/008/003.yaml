  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: ja
  text: しかしサウロは教会を荒らし回っていた[a]。家々に入っては[b]、男も女も引きずって、牢へ引き渡していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「教会を荒廃させていた」。原語は、単に迫害する以上に、激しく傷つけ荒らすことを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「家々に」。原語の表現は、次々と複数の家に入って行ったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: 荒らし回っていた
  rationale: 未完了過去が示す継続的・反復的な行為と、単なる「迫害する」より強い、共同体を激しく傷つけ荒廃させる語感を、自然な現代日本語で表した。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: ここでは建物ではなく、キリストを信じる者たちの共同体を指す。使徒言行録の文脈と日本語の定着した用法に従った。
- source_word: κατὰ τοὺς οἴκους
  choice: 家から家へと
  rationale: κατά＋複数形の配分的な意味を表し、サウロが次々と複数の家に入ったことを明確にした。
- source_word: εἰσπορευόμενος
  choice: 押し入り
  rationale: 基本義は「入る」だが、人々を強制的に連行する文脈から、侵入の強圧性を自然に伝える「押し入る」とした。
- source_word: σύρων
  choice: 引きずり出しては
  rationale: σύρωの強制的に引きずる語感と、家から連れ出す反復行為を表した。「しては」により、そのたびに投獄した流れも示した。
- source_word: ἄνδρας καὶ γυναῖκας
  choice: 男も女も
  rationale: 性別を問わず連行した範囲の広さを、簡潔で強調のある日本語にした。
- source_word: παρεδίδου
  choice: 引き渡していた
  rationale: 公的な拘束へ渡す意味を保ちつつ、未完了過去の継続・反復性を「していた」で表した。
- source_word: εἰς φυλακήν
  choice: 牢に
  rationale: φυλακήがここで示す拘禁・投獄を、簡潔で明瞭な日本語で表した。
theological_decisions:
- issue: 回心前のサウロの行為の激しさ
  choice: 教会を荒らし回っていた
  alternative: 教会を迫害していた
  rationale: ἐλυμαίνετοは一般的な「迫害する」より強く、共同体に激しい損害を与える意味を持つため、その深刻さを弱めずに訳した。同時に、教会が実際に滅ぼされたと断定する訳は避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、暴力性と反復性を弱めないようにした。「教会」は建物ではなく信者共同体を指す。文を二つに分け、原文の主節と分詞句の関係を読みやすく示した。
