  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: ja
  text: 二人はそこへ下って行き、その人たちが聖霊を受けるように祈った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: 二人は
  rationale: 直前の節に出るペトロとヨハネを受ける関係代名詞。日本語では指示対象を「二人」と明示して文を続けるのが自然である。
- source_word: καταβάντες
  choice: そこへ下って行き
  rationale: アオリスト分詞が主動詞に先立つ動作を表す。等位的に訳して自然な流れを保ちつつ、動作の順序も示した。「そこへ」は文脈上のサマリアを指す。
- source_word: προσηύξαντο
  choice: 祈った
  rationale: 特別な相の含意を加えず、一般的で明瞭な祈りの行為として訳した。
- source_word: περὶ αὐτῶν
  choice: その人たちが…受けるように
  rationale: 祈りの対象となる人々を、目的節の主語として自然な日本語に組み込み、彼らのための執り成しであることを表した。
- source_word: ὅπως λάβωσιν
  choice: 受けるように
  rationale: 祈りの目的を示すὅπωςと接続法を、祈願内容として自然な日本語で表した。不確実性を余分に加えていない。
- source_word: πνεῦμα ἅγιον
  choice: 聖霊
  rationale: 使徒言行録のこの文脈では、信じる者に与えられる神の霊を指す。日本語では固有の指示対象として通常「聖霊」と訳す。
theological_decisions:
- issue: πνεῦμα ἅγιονが一般的な「聖なる霊」か、神の聖霊か
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 使徒言行録の物語文脈では、信じた人々が受ける神の霊を指しているため。「聖霊」はその指示対象を示すが、本文にない教理的説明は付加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。「下って行き」によって原文の移動表現と先行動作を保ち、「その人たち」で直前のサマリアの信者たちを自然に受けた。
