  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: ja
  text: 彼は言った。「だれかが私を導いてくれる人がいなければ、どうして理解できるでしょうか。」そしてフィリポに、馬車に上がって自分と一緒に座るよう頼んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: どうして分かるでしょうか
  rationale: 直訳的には「どうしてできるでしょうか」だが、直前の問いが聖書本文を理解しているかを問うものであるため、日本語では省略された内容を「分かる」と補うのが自然である。「でしょうか」により、ἄνを伴う希求法が表す条件付きの可能性・困難さを保った。
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: だれかが導いてくれなければ
  rationale: ὁδηγέωの「道案内する」と「理解へ導く」の両義性を保つため、「説明する」と限定せず「導く」とした。受益表現「くれる」により、この文脈で助けを必要としていることを自然に示した。
- source_word: παρεκάλεσέν
  choice: 頼んだ
  rationale: ここではフィリポを同席へ招く丁重な要請を表す。「懇願した」ほど強くせず、「招いた」だけに限定もしない自然な訳語として「頼んだ」を選んだ。
- source_word: τε
  choice: そして
  rationale: 節を軽く結ぶ接続小辞であり、明確な時間的順序を過度に強調せず、自然な物語の連続を示す。
- source_word: ἀναβάντα
  choice: 馬車に上がって
  rationale: ἀναβαίνωの上方への移動を「上がる」で保った。目的地の「馬車」は直接この節に明記されないが、直前の文脈により明白で、日本語では補うと自然である。
- source_word: καθίσαι σὺν αὐτῷ
  choice: 自分と一緒に座るよう
  rationale: σύνの共同性を素直に「一緒に」で表し、「隣に」と位置関係を狭く解釈することを避けた。
- source_word: Φίλιππον
  choice: フィリポ
  rationale: 現代日本語の聖書で広く通用する人名表記を用いた。
theological_decisions:
- issue: 聖書理解における人間の導きの必要性
  choice: 原文どおり、話者自身についての条件付きの問いとして訳した。
  alternative: 一般原則として、聖書は必ず権威ある解釈者なしには理解できない、と読めるよう訳す。
  rationale: 本文はこの人物がこの箇所を理解するために導きを必要としていることを述べるが、普遍的・制度的な解釈原理を明言してはいないため、教派的含意を付加しない。
translation_notes:
  register: 明快で現代的だが口語に崩しすぎない、丁寧で品位ある叙述と会話にした。原文の導きの比喩は保持しつつ、日本語で意味が通るよう目的語を「分かる」と文脈から補った。
