source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: ja
  text: しかし、ペトロは彼に言った。「あなたの銀[a]は、あなたもろとも滅びてしまえ。神の賜物を金銭で手に入れられると思ったからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銀」は、当時、金銭を指す一般的な言い方でもあった。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: 銀
  rationale: 文字どおりの「銀」を保ち、当時の銀貨・金銭を指す具体的な表現として訳した。後半の χρημάτων は「金」とし、原文の語の変化も反映する。
- source_word: σὺν σοὶ
  choice: おまえもろとも
  rationale: 金銭とシモン自身を一つにして告げる厳しい宣告を、自然で力のある日本語で表す。
- source_word: εἴη εἰς ἀπώλειαν
  choice: 滅びてしまえ
  rationale: 希求法による強い願望・呪詛的宣告を命令形に近い日本語で表しつつ、最終的な永遠の刑罰まで明示しない。
- source_word: δωρεὰν τοῦ θεοῦ
  choice: 神の賜物
  rationale: 「神から与えられるもの」という宗教的文脈にふさわしく、現代日本語でも理解できる「賜物」を採用した。
- source_word: ἐνόμισας
  choice: 思った
  rationale: 「考える、思い込む」の意味を簡潔で直接的な現代日本語にした。
- source_word: διὰ χρημάτων
  choice: 金で
  rationale: 手段を示す διά 属格を自然な日本語で表現した。
- source_word: κτᾶσθαι
  choice: 手に入れられる
  rationale: 「獲得する、入手する」の意味を平明に表し、「買う」と訳して商取引の意味を原文以上に限定することを避けた。
- source_word: δὲ
  choice: しかし
  rationale: 直前のシモンの申し出に対するペトロの対照的な応答を明確にする。
theological_decisions:
- issue: ペトロがシモンとその金銭に告げた言葉の効力
  choice: 滅びを願い告げる厳しい宣告として「おまえの銀は、おまえもろとも滅びてしまえ」と訳す
  alternative: 滅びの単純な予告、または地獄・永遠の断罪を明示する表現
  rationale: εἴη は希求法であり、単なる未来予告より願望・宣告の力を持つ。一方、ἀπώλεια だけから最終的な永遠の刑罰を断定せず、原文の神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、ペトロの激しい叱責を保つため二人称は「おまえ」とした。「銀」と「金」を使い分けて原文の ἀργύριον と χρήματα の語彙的差異を反映し、文体には聖書本文としての簡潔さと品位を持たせた。
