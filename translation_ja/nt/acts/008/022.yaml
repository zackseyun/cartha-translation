id: ACT.8.22
reference: Acts 8:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: ja
  text: だから、この悪から悔い改め、主に祈りなさい。もしかすると、あなたの心に抱いた思い[a]が赦されるかもしれません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたの心の企てが赦されるかもしれません」。
    reason: ἐπίνοιαは「思い」のほか、意図的な「企て」を表すこともあるため。
lexical_decisions:
- source_word: μετανόησον
  choice: 悔い改め
  rationale: 決然とした応答を求めるアオリスト命令形であり、単なる意見の変更ではなく、悪から立ち返る道徳的・霊的意味を保つ。
- source_word: οὖν
  choice: だから
  rationale: 直前のペトロの叱責を受けた帰結を、明瞭で自然な現代日本語で示す。
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: この悪から
  rationale: ἀπόの離脱の方向性を保ち、κακίαを一般的な道徳的悪として簡潔に表す。σουは文脈上「あなたが行っているこの悪」に含意される。
- source_word: δεήθητι
  choice: 祈りなさい
  rationale: 切実に願い求める命令だが、主を目的語とする宗教的文脈では「祈る」が自然である。
- source_word: τοῦ κυρίου
  choice: 主に
  rationale: κύριοςの標準的な聖書用語を用い、それが父なる神か主イエスかを訳文で限定しない。
- source_word: εἰ ἄρα
  choice: もしかすると……かもしれない
  rationale: 赦しの可能性を示しつつ結果を確約しない、原文の慎重で条件的な言い方を自然な日本語で保つ。
- source_word: ἀφεθήσεταί σοι
  choice: あなたに赦されるかもしれない
  rationale: 未来受動態を受動表現で保ち、赦す主体を明示せず、神による赦しを含意させる。日本語本文では「あなたの……思いが赦される」として与格を自然に統合した。
- source_word: ἡ ἐπίνοια τῆς καρδίας σου
  choice: あなたの心に抱いた思い
  rationale: ἐπίνοιαは思考だけでなく意図・企ても含み得る。自然な日本語では「心に抱いた思い」とし、その内面的・意志的含みを残す。
theological_decisions:
- issue: 赦しの可能性に関する確実性の度合い
  choice: ペトロは悔い改めと祈りを命じつつ、赦しを条件的な可能性として述べる。
  alternative: 悔い改めれば赦しが確実に与えられるとする読み、または赦しは不可能に近いとする読み。
  rationale: εἰ ἄραと未来受動態の組み合わせは慎重な表現であり、確約にも絶望にも解消しない。
- issue: 「主」が指す対象
  choice: 「主」とのみ訳し、指示対象を限定しない。
  alternative: 「主イエス」または「神」と明示する。
  rationale: この箇所自体はκύριοςとだけ述べているため、翻訳で特定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。「悔い改め」「主」「赦す」は聖書本文にふさわしい簡潔で dignified な語調を保つ。条件表現を重ねる日本語は原文の慎重さを伝えるため意図的に採用した。
