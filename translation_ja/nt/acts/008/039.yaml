  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: ja
  text: 二人が水から上がると、主の霊がフィリポを突然連れ去った[a]。宦官はもう彼を見ることはなかったが、喜びながら自分の道を進んで行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「フィリポをさらって行った」。このギリシア語動詞は、突然、力強く移されることを強調し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: 二人が水から上がると
  rationale: 複数形を「二人」で明示し、ἐκの起点と上向きの移動を自然な日本語で表す。洗礼の方法について本文以上のことは示さない。
- source_word: πνεῦμα κυρίου
  choice: 主の霊
  rationale: ルカ文書で神の霊による働きを指す自然な表現であり、人格的な神の働きを保ちつつ「聖霊」と補足しない。
- source_word: ἥρπασεν
  choice: 突然連れ去った
  rationale: ἁρπάζωが含む急激で力強い移動を「突然」で示し、「連れ去った」によって不必要に暴力的な響きを避ける。
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: もう彼を見ることはなかった
  rationale: その時以後、宦官がフィリポを見なかったという意味を明瞭で自然な日本語にする。
- source_word: ὁ εὐνοῦχος
  choice: 宦官
  rationale: 原文の明示的な呼称を直接訳し、先行する物語との連続性を保つ。
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: 自分の道を進んで行った
  rationale: 未完了過去が示す旅の継続を「進んで行った」で表し、ὁδόςの道程と旅の双方の含みを保つ。
- source_word: χαίρων
  choice: 喜びながら
  rationale: 現在分詞が示す、旅を続ける際の伴随的な状態を動詞的に表す。
theological_decisions:
- issue: πνεῦμα κυρίουが聖霊を指すのか、非人格的な力を指すのか
  choice: 人格的な神の働きを表す「主の霊」
  alternative: 主からの霊、または非人格的な神的力
  rationale: ルカ文書の用法と動作主としての文法的位置から、神の霊が行為する表現と理解するのが自然である。ただし本文では原語に対応して「聖霊」と言い換えず、「主の霊」とする。
- issue: ἥρπασενが奇跡的で急激な移動をどの程度明示するか
  choice: 「突然連れ去った」として急激さと神的介入を示す
  alternative: 「連れ去った」のみ、または「さらった」として力強さを前面に出す
  rationale: 主の霊が動作主であるため神的介入は文脈上明らかであり、「突然」によって語の急激さを伝える。「さらった」は暴力的・犯罪的な含みが強いため避ける。
translation_notes:
  register: 明瞭な現代標準日本語。叙事の格調を保ちながら、文を二つに分けて読みやすくした。「宦官」は歴史的役職・身分を示す標準的な訳語として維持した。
