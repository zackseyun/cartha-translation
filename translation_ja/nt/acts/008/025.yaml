  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: ja
  text: そこで彼らは、力強く証しし、主のことばを語ってから、エルサレムへ戻る途中、サマリア人の村々の多くで福音を伝えていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: 厳かに証しをし
  rationale: 真剣で重みのある証言という語感を保ちつつ、文脈上「警告」に限定しない表現とした。
- source_word: λαλήσαντες
  choice: 語った
  rationale: 目的語「主のことば」と自然に結びつく、過度な解釈を加えない訳語。
- source_word: τὸν λόγον τοῦ κυρίου
  choice: 主のことば
  rationale: 宣教の文脈における λόγος の伝統的かつ明瞭な表現であり、κύριος の神学的含意も保つ。
- source_word: ὑπέστρεφον
  choice: 帰る途中
  rationale: 未完了過去が示す進行中の帰路を自然な日本語で表した。
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: サマリア人の多くの村々でも
  rationale: 属格による民族との関係を明示し、帰路における追加的な宣教を示す τε を「でも」で自然に表した。
- source_word: εὐηγγελίζοντο
  choice: 福音を告げた
  rationale: 「良い知らせを伝える」という動詞の意味を、現代日本語で定着した簡潔な聖書用語により表した。進行・反復性は「多くの村々」と帰路の叙述から読み取れる。
theological_decisions:
- issue: 省略された複数主語の同定
  choice: 「二人」とした
  alternative: 「彼ら」とする
  rationale: ギリシア語は複数主語を明示しないが、直前の文脈ではペテロとヨハネの二人を指すことが明白である。固有名を補わず、自然な日本語に必要な範囲で人数だけを示した。
- issue: κύριος の指示対象
  choice: 「主」とし、指示対象を訳文で限定しない
  alternative: 「イエス」または「神」と明示する
  rationale: 属格 τοῦ κυρίου が誰を直接指すかを本文以上に特定せず、原文の神学的余韻を保った。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「厳かに証しをし」は原語の強意を反映し、「帰る途中」で未完了過去の進行性と、村々での宣教が帰路に行われた流れを自然に示した。
