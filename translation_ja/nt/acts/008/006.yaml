  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: ja
  text: 群衆は、フィリポが語ることを聞き、彼が行っていたしるしを見て、心を一つにして[a]、彼の語ることに注意を傾けていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「皆そろって」。ギリシア語は、一致した共通の反応を強調している。
    reason: lexical_alternative
  - marker: b
    text: 別訳「心を留めていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: 注意を傾けていた
  rationale: 「注意を向ける、心を留める」という意味を自然な現代日本語で表し、未完了過去の継続的な様相も「ていた」で示した。
- source_word: δὲ
  choice: （明示せず）
  rationale: 弱い物語接続辞であり、日本語では接続語を置かないほうが前後の流れを自然に保てる。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: 集まった多数の人々を指す。日本語では単数形でも集合を表せるため、ギリシア語の複数を不自然に明示しなかった。
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: フィリポの語ること
  rationale: 受動表現を日本語として自然な能動表現にしつつ、語られた内容を指す分詞の意味を保った。「教え」や「福音」と限定する解釈は加えていない。
- source_word: ὁμοθυμαδὸν
  choice: 心を一つにして
  rationale: 群衆の一致した共有の反応を表す。単に同時性を示す「一緒に」より、語の持つ結束の意味をよく伝える。
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: 聞き、……見て
  rationale: ἐν τῷ＋不定詞を、この場面で注意を向ける契機・状況を示す自然な日本語にした。αὐτούςは不定詞の意味上の主語として群衆を指すと理解し、「彼らが」に相当する主語は日本語では省略した。
- source_word: τὰ σημεῖα
  choice: しるし
  rationale: σημεῖονの標準的な訳語であり、出来事の指し示す性格を保つ。「奇跡」として意味を一つに限定しなかった。
- source_word: ἃ ἐποίει
  choice: 彼が行っていた
  rationale: 主語がフィリポであることを明示し、未完了過去が示す継続・反復的な行為を「行っていた」で表した。
theological_decisions:
- issue: σημεῖαの解釈範囲
  choice: しるし
  alternative: 奇跡／奇跡的なしるし
  rationale: 文脈上は超自然的な業を指すが、原文はその業が何かを指し示すという神学的含意を持つため、「奇跡」だけに狭めなかった。
- issue: αὐτούςの統語的役割
  choice: 群衆を指す不定詞の意味上の主語として訳す
  alternative: フィリポを指す目的語として「彼の話を聞き」と訳す
  rationale: SBLGNTの複数対格αὐτούςは、文脈上、聞きかつ見る群衆を指す不定詞の主語と解するのが形態上自然である。英語相談訳の単数「him」には従わず、提示された原文を優先した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「しるし」は聖書語として定着しているため平仮名表記を採用した。文の中心である「注意を傾けていた」を末尾に置き、聞くことと見ることがその状況・契機であるという原文の関係を保った。
