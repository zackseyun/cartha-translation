  source_fidelity: 原文の主要要素を適切に反映している。「群衆」「心を一つにして」「フィリポが語ること」「しるし」「注意を傾けていた」は、それぞれὄχλοι、ὁμοθυμαδόν、τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου、σημεῖα、未完了過去のπροσεῖχονに対応する。ἐν τῷ＋不定詞句も、「聞き、…見て」により注意を向ける場面・契機として自然に表現されている。SBLGNTの複数対格αὐτούςは統語上難しいが、訳文は不必要に「彼を」と単数化せず、主語を省略して文脈上の内容を聞くこととして処理しており、無理な確定を避けている。
  naturalness: 明快で自然な現代標準日本語である。「心を一つにして、…注意を傾けていた」という語順も、群衆の一致した反応を十分に伝える。語る内容と聞くことの近接による多少の反復は、原文における「語られていること」と「聞くこと」の対応を保つため許容できる。
  terminology: 「フィリポ」は標準的な人名表記であり、「しるし」はσημεῖαを「奇跡」に狭めずに訳す適切な聖書用語である。「注意を傾けていた」もπροσέχωの継続的な注意・傾聴を自然に表す。
