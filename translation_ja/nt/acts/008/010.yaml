  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: ja
  text: 人々はだれもが彼に注目し、「この人こそ、『大いなるもの』と呼ばれる神の力だ」と言っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: 皆彼に注目し
  rationale: προσέχωはこの文脈で、ある人に注意を向け、その言動を重く受け止めることを表す。「注目する」は、単なる一瞥より強く、帰依までを含意しない自然な現代語である。
- source_word: πάντες
  choice: 皆
  rationale: 群衆全体に及ぶことを明示する簡潔な表現とした。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: 身分の低い者から高い者まで
  rationale: 直訳的な「小さい者から大きい者まで」が指す社会的範囲を、現代日本語で誤解なく伝える。年齢や体格の意味に限定しない。
- source_word: λέγοντες
  choice: と言っていた
  rationale: 主動詞と同時に継続していた発言として、文脈に自然な過去進行的表現にした。
- source_word: Οὗτός
  choice: この人こそ
  rationale: 指示対象がシモンという人物であることを明確にし、「こそ」で群衆の強い同定の語調を自然に表した。
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: 神の力
  rationale: 定冠詞を伴う称号的な形を踏まえつつ、日本語として過度に不自然な表現にせず、群衆がシモンを神的な力そのものと同定している主張を保った。
- source_word: ἡ καλουμένη Μεγάλη
  choice: 『大いなるもの』と呼ばれる
  rationale: καλουμένηの受動的な命名の意味と、女性形のΜεγάληが「力」に対応する称号的用法を保つ。「大いなるもの」は呼称らしさを示しつつ、説明的に言い換えすぎない。
theological_decisions:
- issue: 群衆の発言を正式な神的称号として訳すか、シモンについての説明的主張として訳すか
  choice: 「この人こそ、『大いなるもの』と呼ばれる神の力だ」
  alternative: 「この人こそ、いわゆる『神の大いなる力』だ」
  rationale: 本文は群衆がシモンについて語った内容を報告しており、語り手がその主張を承認しているわけではない。引用として明示し、神的称号らしさと文法上の曖昧さの双方を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「身分の低い者から高い者まで」によって慣用句の社会的広がりを伝え、引用部では群衆の強い主張を示しながら、語り手自身の承認とは区別した。
