  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: ja
  text: 彼は帰る途中、馬車に座って、預言者イザヤの書を読んでいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「声に出して読んでいた」とも考えられる。古代には声に出して読むことが多かったが、ここで用いられたギリシア語の動詞自体は、音読であることを明示していない。
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: 彼は帰る途中で
  rationale: ἦνと現在分詞による迂言形が示す、過去に進行中の帰路を自然な日本語で表した。「家へ」は文脈上考えられるが、原文に明記されていないため加えない。τέは文脈上、独立した接続語にせず自然に処理した。
- source_word: καθήμενος
  choice: 座り
  rationale: 旅の最中の姿勢を簡潔に表す。日本語では後続する動作と自然につなげた。
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: 自分の馬車に
  rationale: ἐπίの字義的な「上に」よりも、乗り物について自然な日本語の「馬車に」を採用した。αὐτοῦは主語自身を指すため「自分の」とした。
- source_word: ἀνεγίνωσκεν
  choice: 読んでいた
  rationale: 未完了過去の継続的な動作を保つ。古代には音読が一般的だった可能性があるが、動詞自体はここで音読を明示しないため、本文には「声に出して」を加えない。
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: 預言者イザヤの書
  rationale: ギリシア語は字義的には「預言者イザヤを読んでいた」だが、日本語では人物そのものを読むとは通常言わないため、イザヤの著作を指す換喩を明確にして自然に表した。
