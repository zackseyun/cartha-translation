  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: ja
  text: しかし、フィリポはアゾトにいたところを見いだされた[a]。そして、町々を通りながら、カイサリアに着くまで、すべての町に福音を告げ知らせていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アゾトに現れた」。ギリシア語は直訳すると「アゾトにいたところを見いだされた」。文脈上、神によって突然移されたことを暗示している可能性があるが、ここでは明言されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節で御霊がフィリポを連れ去ったことを受ける、穏やかな転換・対照を示す。
- source_word: εὑρέθη εἰς Ἄζωτον
  choice: アゾトにいるのを見いだされた
  rationale: 受動形「見いだされた」と、結果としての所在を表す εἰς を保ち、突然の移動を明示的に解釈しすぎないようにした。
- source_word: διερχόμενος
  choice: そこから各地を通りながら
  rationale: 移動しつつ福音を告げたという同時進行の分詞の働きを、自然な日本語で表した。
- source_word: εὐηγγελίζετο
  choice: 福音を告げ知らせた
  rationale: 継続・反復的な宣教を示す未完了過去の文脈を踏まえつつ、現代日本語で理解しやすく格調のある表現とした。
- source_word: τὰς πόλεις πάσας
  choice: すべての町で
  rationale: 道中の町々を残らず巡って宣教したという集合的・分配的意味を表す。日本語では宣教の場所として「で」が自然である。
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν
  choice: カイサリアに着くまで
  rationale: 継続する旅と宣教の終点を示す構文を、簡潔で自然な日本語にした。
theological_decisions:
- issue: εὑρέθηを、奇跡的な出現・移送と明示して訳すか
  choice: 本文では中立的な受動表現「いるのを見いだされた」を保つ
  alternative: 「アゾトに現れた」「気がつくとアゾトにいた」
  rationale: 文脈は神による突然の移動を強く示唆するが、ギリシア語自体は「見いだされた」と述べる。本文ではその含みを残し、解釈を断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、地名は一般的な聖書表記「アゾト」「カイサリア」とした。「福音を告げ知らせた」は教会用語として定着した「福音」を保ちながら、動作を分かりやすく表す。
