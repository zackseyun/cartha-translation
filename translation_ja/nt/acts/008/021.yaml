id: ACT.8.21
reference: Acts 8:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: ja
  text: このことに関して、あなたには何の関係も取り分もない。あなたの心が神の前に正しくないからだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: 何の関わりも、受ける分もない
  rationale: μερίςは「関わり・分」、κλῆροςは「割り当てられた分・受ける分」を表す。二語の重なりを保ちつつ、現代日本語で自然にした。
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: このことについて
  rationale: λόγοςはここでは直前の発言・問題となっている事柄を指すため、「このこと」とした。ἐνの関係性は「について」で表した。
- source_word: ἡ καρδία σου
  choice: あなたの心
  rationale: καρδίαは人格の内面、意志や動機の中心を指すが、原文の比喩を保って「心」とした。
- source_word: εὐθεῖα ἔναντι τοῦ θεοῦ
  choice: 神の前に正しくない
  rationale: εὐθεῖαの「まっすぐな、正しい」とἔναντιの「前で／御前で」を、簡潔で聖書的かつ自然な日本語にした。
theological_decisions:
- issue: μερὶςとκλῆροςの関係
  choice: 「関わり」と「受ける分」を併記する
  alternative: 「何の分け前も権利もない」または一語で「何の関係もない」
  rationale: 原文の並列と相補的な意味を保持し、単なる法的権利や救いの相続分だけに限定して解釈しないため。
- issue: 「このこと」の指示対象
  choice: 曖昧さを保つ
  alternative: 「この務め」「この福音」「この聖霊の賜物」
  rationale: λόγοςの指示対象を特定の教理的対象に狭めず、文脈から理解できる形にした。
- issue: 神の前で心が正しくないことの意味
  choice: 原文どおり評価を述べるにとどめる
  alternative: 不信仰、未回心、邪悪な動機などと明示する
  rationale: 節自体が明示しない霊的状態を断定せず、神に対する内面の不正をそのまま残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒による厳粛な叱責の調子を保った。「分け前と割り当て」のような不自然な逐語訳は避けたが、原文の二重表現は保持した。
