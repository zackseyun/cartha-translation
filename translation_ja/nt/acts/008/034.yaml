base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: ja
  text: そこで、宦官はフィリポに答えて言った。「お願いしますが[a]、預言者はこのことを、だれについて語っているのでしょうか。自分自身についてですか。それとも、ほかのだれかについてですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「どうか教えてください」。ギリシア語の表現は丁重な願いを表し、より強い懇願としても訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: そこで、…尋ねた
  rationale: 分詞と発話動詞を重ねるギリシア語の語法を、現代日本語の自然な物語文として一つの発話導入にまとめた。δὲは強い対立ではなく、話の進行を示す「そこで」とした。
- source_word: ὁ εὐνοῦχος
  choice: 宦官
  rationale: 語が明示する人物の身体的・社会的な身分を一般的な「役人」に置き換えず、そのまま保持した。
- source_word: τῷ Φιλίππῳ
  choice: フィリポに
  rationale: 発話の相手を示す与格を、自然な日本語の助詞「に」で表した。
- source_word: Δέομαί σου
  choice: お伺いしますが
  rationale: 丁重な依頼の力を自然な現代日本語で表し、文脈以上に切迫した調子にはしなかった。より強い懇願とも取り得るため脚注を付した。
- source_word: περὶ τίνος
  choice: だれについて
  rationale: περί＋属格が示す話題・言及対象を明確に表した。
- source_word: ὁ προφήτης
  choice: 預言者
  rationale: 定冠詞を伴う呼称を、直前に読まれていたイザヤを指す「預言者」として訳した。
- source_word: λέγει τοῦτο
  choice: ここで…語っている
  rationale: τοῦτοが直前の引用箇所を指すことを日本語で自然に示すため「ここで」とし、現在形は引用文の内容を問う「語っている」で表した。
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: 自分自身についてですか。それとも、ほかのだれかについてですか
  rationale: 預言者本人と別の人物との対比を明瞭に保ち、原文の二者択一の問いを自然な日本語にした。
