id: ACT.8.1
reference: Acts 8:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: ja
  text: 'サウロは、ステファノが殺されることに賛同していた。[a]


    その日、エルサレムにある教会に対して激しい迫害が起こり、使徒たちを除く全員が、ユダヤとサマリアの各地に散らされた。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「殺されること」は、「処刑されること」「死ぬこと」、また、より解釈を加えれば「殺害されること」とも訳せる。ギリシア語は、彼を死に至らせる行為を指す。
    reason: ἀναίρεσιςの語義の幅と、各日本語訳が伴い得る法的・解釈的含意を示すため。
lexical_decisions:
- source_word: Σαῦλος
  choice: サウロ
  rationale: 新約聖書の人物名として定着した日本語音写を用いた。
- source_word: συνευδοκῶν
  choice: 賛同していた
  rationale: ἦνとの組み合わせが表す継続的・同時的な是認を、直接の実行への参加まで含意させずに表した。
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: ステファノが殺されること
  rationale: ἀναίρεσιςが指す『死に至らせる行為』を明示しつつ、『処刑』が含み得る法的正当性や、『殺人』が含み得る強い法的評価を本文に持ち込まない。αὐτοῦの指示対象は直前の文脈のステファノであり、日本語での誤解を避けるため固有名を補った。
- source_word: Ἐγένετο
  choice: 起こり
  rationale: 迫害の発生を自然で簡潔な現代日本語で表した。
- source_word: διωγμὸς μέγας
  choice: 激しい迫害
  rationale: μέγαςが示す規模・重大さを、日本語として自然な連語で表した。
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: エルサレムにある教会に対して
  rationale: 迫害の向けられた対象と、その教会の所在地を明確に保った。
- source_word: πάντες δὲ διεσπάρησαν
  choice: 全員が…散らされた
  rationale: 受動態と『皆』の強い包括性を保ち、直後の使徒たちの例外規定につなげた。
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: ユダヤとサマリアの各地に
  rationale: χώραの複数形が表す地域的な広がりを、簡潔で自然な地理表現にした。
- source_word: πλὴν τῶν ἀποστόλων
  choice: 使徒たちを除く
  rationale: πλήνによる明示的な例外を直接表した。
theological_decisions:
- issue: ステファノの死に関するἀναίρεσιςの訳
  choice: ステファノが殺されること
  alternative: ステファノが処刑されること／ステファノの死／ステファノの殺害
  rationale: 原語が示す、彼を死に至らせる行為を保ちつつ、その法的正当性や犯罪性について原語以上の判断を本文で加えないため。
- issue: πάντεςの範囲
  choice: 使徒たちを除く全員
  alternative: 信者たちは皆／すべての人
  rationale: 本文自身が使徒たちを例外としているため、その限定を明示しながらπάντεςの包括的な力を保った。ここでの全員は文脈上、エルサレムの教会に属する人々を指す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、簡潔ながら品位のある叙述調とした。冒頭のδέは不必要な『さて』を加えず、文脈上のつながりに委ねた。脚注記号は語義説明の対象である第一文末に置いた。
