id: ACT.8.33
reference: Acts 8:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: ja
  text: '彼が辱められたとき、公正な裁きは彼から奪われた。[b]

    彼の世代のことを、だれが語れるだろうか。[a]

    彼の命は地上から取り去られるからだ。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼の子孫」または「彼と同時代の人々」。ギリシア語の「世代」は、イザヤ53章の引用にある曖昧さを保っている。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「彼の裁きは奪われた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: 辱められたとき
  rationale: 屈辱・卑下の状態を表す語を、受難の文脈に即して明瞭で自然な現代日本語にした。「へりくだり」のように自発的な謙遜とも読める表現は避けた。
- source_word: κρίσις
  choice: 公正な裁き
  rationale: ここでは法的な裁きだけでなく、受けるべき正義ある扱いが奪われた含意がある。「公正な」を添えて日本語でその法的・道徳的側面を自然に示し、別訳を脚注に残した。
- source_word: ἤρθη
  choice: 奪われた
  rationale: αἴρω の受動形が表す除去・剝奪を簡潔に表現した。
- source_word: γενεὰν
  choice: 世代
  rationale: 子孫、同時代の人々などに解し得る γενεά の曖昧さを、可能な限り形式的に保持した。
- source_word: διηγήσεται
  choice: 語れるだろうか
  rationale: 詳しく物語る、述べるという意味を、修辞疑問として自然な日本語にした。
- source_word: αἴρεται
  choice: 取り去られる
  rationale: 現在受動形の生々しさを保ちつつ、「地上から」と自然につながる表現にした。
- source_word: γῆς
  choice: 地上
  rationale: ここでは土地というより地上の生から除かれることを指すため、日本語の慣用に合う「地上」とした。
- source_word: ζωὴ
  choice: 命
  rationale: イザヤ書引用の受難・死の文脈における身体的生命を、自然な日本語で示した。
theological_decisions:
- issue: 「彼の世代」（τὴν γενεὰν αὐτοῦ）の解釈
  choice: 本文では「彼の世代」として曖昧さを保持する。
  alternative: 「彼の子孫」または「彼と同時代の人々」
  rationale: イザヤ53章からの引用であるこの句は解釈が難しく、子孫、同時代人、あるいは彼の時代を指し得る。本文で一つに限定せず、代案を脚注に示した。
- issue: κρίσις の意味
  choice: 「公正な裁き」
  alternative: 「裁き」
  rationale: 文脈上、単に判決が取り去られたというより、公正な司法的扱いを奪われた意味が考えられる。ただし語自体は「裁き」とも訳せるため、その簡潔な訳を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イザヤ書引用としての荘重さと修辞疑問の調子を保った。過度に古風な語法や教派固有の表現は避けた。
