  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: ja
  text: エルサレムにいた使徒たちは、サマリアの人々が神のことばを受け入れたと聞き、ペテロとヨハネを彼らのもとへ遣わした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: 聞き
  rationale: アオリスト分詞を主動詞に先立つ状況として自然な連用形で表した。δέは弱い叙事的接続であり、日本語では明示しなくても文脈上の展開が保たれるため、接続語を加えなかった。
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: エルサレムにいた使徒たち
  rationale: 使徒たちの所在地を明確にしつつ、現代日本語として自然な語順にした。
- source_word: δέδεκται
  choice: 受け入れた
  rationale: δέχομαιの完了形が示す、すでに成立し結果が存続している受容を、従属節内の自然な日本語で表した。「受けた」よりも、宣べ伝えられたことばを歓迎して受容した意味が明瞭である。
- source_word: ἡ Σαμάρεια
  choice: サマリア
  rationale: 地名を住民の集合的呼称として用いる原文の換喩を保持し、「サマリア人」と限定的に言い換えなかった。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: λόγοςの基本的な語感と聖書的な響きを保ちつつ、現代日本語で定着した表現とした。ここでは宣べ伝えられた神からの知らせを指す。
- source_word: ἀπέστειλαν
  choice: 遣わした
  rationale: 使徒たちが二人を使命を帯びて派遣した文脈にふさわしい、簡潔で品位ある表現を選んだ。
- source_word: πρὸς αὐτοὺς
  choice: 彼らのもとへ
  rationale: πρόςの方向性を自然に示し、集合名詞的な「サマリア」がその住民を指すことも文脈上明らかにした。
- source_word: Πέτρον καὶ Ἰωάννην
  choice: ペテロとヨハネ
  rationale: 日本語聖書で広く定着している人名表記を採用した。
theological_decisions:
- issue: 「サマリア」の換喩
  choice: サマリアが神のことばを受け入れた
  alternative: サマリア人たちが神のことばを受け入れた
  rationale: 原文は地域名を集合的に用いているため、その形を保持した。住民を指すことは「彼らのもとへ」によっても明らかであり、対象を不必要に狭めない。
- issue: λόγοςの訳語
  choice: 神のことば
  alternative: 神の知らせ／神のメッセージ
  rationale: 宣教内容を指すことは文脈上明らかだが、「ことば」とすることで原語の形と神学的な含みを保ち、説明的な言い換えを避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい簡潔で品位ある文体とした。「遣わした」「ことば」は伝統的な響きを持つが、一般読者にも十分理解できる。
