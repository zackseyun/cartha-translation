id: ACT.8.4
reference: Acts 8:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: ja
  text: こうして、散らされた人々は各地を巡りながら、ことばを福音として伝えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「ことばを福音として告げ知らせた」。ここでの動詞には「良い知らせを告げる」という意味がある。文脈上、「ことば」はイエス・キリストについての知らせを指す。
    reason: 語彙上の別訳と、εὐαγγελιζόμενοι が持つ「良い知らせを告げる」という含意、および τὸν λόγον との関係を説明する。
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: こうして
  rationale: 直前に述べられた迫害と離散を受け、その結果として話が進むことを自然な現代日本語で示す。μένはここで後続の展開を整える談話上の働きを持つため、独立した語としては訳出しない。
- source_word: διασπαρέντες
  choice: 散らされた人々
  rationale: 迫害によって各地へ散らされたという受動の意味と、主動詞に先立つ出来事を保つ。文脈上、散らされた信者たちを指す。
- source_word: διῆλθον
  choice: 各地を巡り
  rationale: 単に一地点を通過したのではなく、場所から場所へ移って行った含意を、簡潔で自然な日本語にする。
- source_word: εὐαγγελιζόμενοι
  choice: 福音として告げ知らせた
  rationale: この分詞に内在する「良い知らせを告げる」という意味を保ちつつ、τὸν λόγονを直接の内容として自然に結び付ける。移動しながら告げたという付帯状況は「巡り」との連結で表す。
- source_word: τὸν λόγον
  choice: そのことば
  rationale: ギリシア語の簡潔な「ことば」を保ち、定冠詞の文脈指示を「その」で示す。「神のことば」は本文にない語を補うため避け、「知らせ」は意味を先取りしすぎるため注で説明する。
theological_decisions:
- issue: εὐαγγελιζόμενοι τὸν λόγον の関係
  choice: そのことばを福音として告げ知らせた
  alternative: そのことばを告げ知らせた／福音の知らせを宣べ伝えた
  rationale: τὸν λόγονは動詞の直接目的語であり、「ことばについての福音」という属格関係ではない。一方、動詞自体に「良い知らせを告げる」という意味があるため、「福音として」によって両方の要素を保持する。
- issue: 「そのことば」の指示内容
  choice: 本文では簡潔な表現を保ち、注でイエスについての知らせと説明する
  alternative: イエスについての知らせ
  rationale: 文脈上はキリストについての使信を指すが、本文で明示すると原文以上に解釈を展開するため、原文の表現を残して注記する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「福音」は一般読者にも説明可能な聖書語として用い、「宣べ伝える」のようなやや古い教会語は避けた。
