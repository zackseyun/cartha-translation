  naturalness: 全体は読みやすく、引用の並行法も保たれている。ただし「別訳『屠りへ』」は現代日本語として不自然で、読者に有用な代替訳になっていない。本文を一文の並行構文に整えると、「ように」と結論部「そのように」の連関も明瞭になる。
  terminology: 「聖書の箇所」「羊／子羊」「毛を刈る者」「口を開かない」は適切である。「屠る」は文脈に必要な具体性を保つが、本文では「屠られるために」、脚注では「屠り場へ」を代替表現として示す。キリスト論的な同定は本文に加えない。
