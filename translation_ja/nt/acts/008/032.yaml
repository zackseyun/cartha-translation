  to: '彼が読んでいた聖書の箇所は、こうであった。


    「彼は、屠られるために引かれて行った羊のように[a]、

    また、その子羊の毛を刈る者の前で黙っている子羊のように[b]、

    そのように口を開かない。」'
  rationale: 場所を限定する「屠り場へ」を本文から外し、ἐπὶ σφαγήνの意味を自然かつ過度に限定せずに表す「屠られるために」を採用した。脚注aは自然な日本語の代替訳へ改めた。引用の比較構文を明確にするため「そのように」を補ったが、これはοὕτωςを明示したものであり意味の追加ではない。κείραντος αὐτόνの目的語関係も本文と脚注で明瞭にした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:15Z'
