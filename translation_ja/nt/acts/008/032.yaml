id: ACT.8.32
reference: Acts 8:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: ja
  text: '彼が読んでいた聖書の箇所は、こうであった。


    「彼は、屠られるために引かれて行った羊のように[a]、

    また、その子羊の毛を刈る者の前で黙っている子羊のように[b]、

    そのように口を開かない。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「屠り場へ」。
    reason: ἐπὶ σφαγήνは屠りという出来事へ向かうことを表す。この文脈では「屠られるために」とも「屠り場へ」とも表現できる。
  - marker: b
    text: 直訳「その子羊の毛を刈る者の前で、声を出さない子羊のように」。
    reason: κείραντος αὐτόνは「その子羊を刈る者」、ἄφωνοςは字義的に「声がない／声を出さない」を表す。
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: 聖書の箇所
  rationale: περιοχήはここでは読まれていた特定の一節・箇所を指し、γραφήは文脈上、聖なる書を指す。「聖書の箇所」は自然な現代日本語で両語の意味を簡潔に表す。
- source_word: ἀνεγίνωσκεν
  choice: 読んでいた
  rationale: 未完了過去の継続的な動作を自然に表す。
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: 彼は羊のように、屠り場へ引かれて行った
  rationale: ὡςの比喩、ἤχθηの受動、処刑・屠殺へ向かうἐπὶ σφαγήνを保持する。「屠り場」は到達点を明確にしつつ、引用文としての格調も保つ。
- source_word: ἀμνὸς
  choice: 子羊
  rationale: 広義のπρόβατον「羊」と区別し、若い羊を表す語義を保持する。
- source_word: ἐναντίον τοῦ κείραντος αὐτόν
  choice: 毛を刈る者の前で
  rationale: 分詞κείραντοςを「毛を刈る者」と訳し、羊毛を刈る場面を明瞭にする。目的語αὐτόνは日本語では文脈上明らかなため重ねて明示しない。
- source_word: ἄφωνος
  choice: 黙っている
  rationale: 字義的には「声を出さない」だが、この比喩では沈黙を表すため、自然な日本語とした。
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: 彼は口を開かない
  rationale: 現在形ἀνοίγειを現在形で保ち、引用における鮮明な表現を維持する。οὕτωςの比較上の結論は、直前の「ように」と改行・統語によって自然に示される。
theological_decisions:
- issue: イザヤ53章のメシア的引用と、文脈におけるイエスへの適用
  choice: 引用そのものは比喩の形のまま訳し、節内でイエスを明示しない
  alternative: 「イエスは」などを補い、苦難のしもべとの同定を明示する
  rationale: 後続文脈はこの箇所をイエスについて解き明かすが、本節自体は聖書の引用を提示している。原文にない同定を訳文へ加えず、文脈が示すキリスト論的つながりを保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。導入部は散文として自然にし、引用部は詩的な並行関係が見えるよう改行した。「屠り場」「毛を刈る者」は一般読者にも理解でき、原文の具体的な比喩を保つ語を選んだ。脚注記号[a][b]は該当箇所に置いた。
