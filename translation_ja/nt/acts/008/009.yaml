  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: ja
  text: シモンという名のある男が、それ以前からその町にいて、魔術[a]を行ってサマリアの人々を驚かせ、「自分は偉大な者だ」と言っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「魔法を使い」。ギリシア語は、魔術的な技を行うことを意味する。
    reason: lexical_alternative
  - marker: b
    text: 別訳「自分は大人物だと言っていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: ある男が
  rationale: Ἀνήρの男性を明示し、τιςの不定性を「ある」で表した。δέはここでは弱い場面展開の接続辞であり、日本語で不自然な接続語を加えず、文脈に委ねた。
- source_word: ὀνόματι Σίμων
  choice: シモンという名の
  rationale: 固有名を音写し、ὀνόματιを自然な現代日本語で表した。
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: それ以前からその町にいて
  rationale: προϋπάρχωの先行性と未完了過去の継続的な背景を「それ以前から」で示し、定冠詞のある町を直前の文脈に即して「その町」とした。
- source_word: μαγεύων
  choice: 魔術を行い
  rationale: 魔術的な技を実践するという語義を明確にしつつ、その力の由来や真偽を本文以上に断定しない表現とした。
- source_word: ἐξιστάνων
  choice: 驚かせ
  rationale: 使役的な意味「驚嘆させる、仰天させる」を、平明で自然な語にした。
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: サマリアの民
  rationale: ここでのἔθνοςは政治的な「国家」より、集合としての住民・民衆を指すため「民」とした。
- source_word: λέγων εἶναί τινα ἑαυτὸν μέγαν
  choice: 自分は偉大な者だと言っていた
  rationale: ἑαυτόνの自己指示とμέγανの偉大さ・重要さを保ち、τιναを日本語として自然な「者」で表した。自称の内容を訳文だけで「豪語した」などと評価しないようにした。
theological_decisions:
- issue: シモンの行為の性格づけ
  choice: 「魔術を行い」と訳し、行為の超自然的な由来を特定しない
  alternative: 「妖術を使い」「悪霊の力で奇術を行い」
  rationale: 本文はシモンが魔術的な技を行ったと述べるが、その力を悪霊、詐術、単なる手品のいずれかに限定してはいないため、物語上の緊張を保った。
- issue: シモンの自己評価
  choice: 「自分は偉大な者だと言っていた」
  alternative: 「自分は大人物だと豪語していた」
  rationale: 自己高揚は内容から伝わるため、λέγωνを評価的な「豪語する」に強めず、原文の陳述に近い表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さを損なわない範囲で簡潔にした。原文の分詞が連なる構造は日本語の連用形で保ち、未完了過去の背景的・継続的な含みを文末の「言っていた」と「それ以前から」で表した。
