  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: ja
  text: フィリポはサマリアの町へ下って行き、その人々にメシアを宣べ伝えた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「サマリアのある町」。ギリシア語は、サマリアの特定の町を指すとも、サマリア地方にある一つの町を指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: （訳出せず）
  rationale: 弱い物語上の接続を表す語であり、この一節を自然な現代日本語にするため、明示的な接続詞を置かなかった。対比の意味は強調しない。
- source_word: κατελθὼν
  choice: 下って行き
  rationale: κατέρχομαιの方向性を保ちつつ、アオリスト分詞を主動詞に先立つ一連の動作として自然に表した。
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: サマリアの町
  rationale: 定冠詞を伴うπόλιςと属格Σαμαρείαςを形式に即して訳した。ただし、特定の町かサマリア地方にある一つの町かは解釈の余地があるため、別訳を脚注に示した。
- source_word: ἐκήρυσσεν
  choice: 宣べ伝えた
  rationale: 公に告げ知らせるκηρύσσωの意味を、聖書文体として品位を保ちながら現代の読者にも通じる表現で示した。
- source_word: αὐτοῖς
  choice: その人々に
  rationale: 与格代名詞が宣べ伝える相手を示すことを明確にした。日本語で指示対象が自然に分かるよう「その人々」とした。
- source_word: τὸν χριστόν
  choice: メシア
  rationale: 冠詞を伴い、宣教内容を示す文脈で称号として機能しているため、固有名詞化した「キリスト」ではなく称号の意味を表す「メシア」とした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト／そのキリスト
  rationale: ここではフィリポが宣べ伝えた対象を示す称号として用いられており、ユダヤ的な「油注がれた者」という背景と称号性を保つため「メシア」とした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「宣べ伝えた」は一般語よりやや聖書的だが、κηρύσσωの公的な告知の含みを簡潔に伝える。地名表現の曖昧さは本文で断定的に解消せず、脚注に保持した。
