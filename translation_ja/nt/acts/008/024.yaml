source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: ja
  text: しかし、シモンは答えた。「あなたがたが私のために主に祈ってください。あなたがたが言ったことが何一つも私の身に降りかからないように。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: 答えた
  rationale: 分詞と定動詞を組み合わせた慣用的な発話導入であり、日本語では重ねずに「答えた」とするのが自然で、応答の意味も保てる。
- source_word: δὲ
  choice: しかし
  rationale: ペトロの厳しい勧告からシモンの応答へ移る際の軽い対照を示す。
- source_word: Δεήθητε
  choice: 祈ってください
  rationale: 複数形の命令で、ここでは主への執り成しを求めている。丁寧な依頼表現が文脈に合う。
- source_word: ὑμεῖς
  choice: あなたがたが
  rationale: 明示された複数代名詞の強調を、主語を省略せず示した。シモンが相手自身に祈るよう求めていることを保つ。
- source_word: ὑπὲρ ἐμοῦ
  choice: 私のために
  rationale: 祈りにおける代理・執り成しを自然な現代日本語で表す。
- source_word: πρὸς τὸν κύριον
  choice: 主に
  rationale: 祈りの向けられる相手を示す。κύριοςは原文の特定度を保って「主」とした。
- source_word: ὅπως
  choice: 〜ように
  rationale: 求める祈りの目的ないし内容を、日本語の自然な目的表現で示す。
- source_word: μηδὲν ... ὧν εἰρήκατε
  choice: あなたがたが言ったことの何一つも
  rationale: 関係代名詞の属格構文を、「言ったこと」のうち何一つも、という意味が明確になるよう訳した。完了形の現在的な関連性は文脈上自然に伝わる。
- source_word: ἐπέλθῃ ἐπ’ ἐμὲ
  choice: 私の身に降りかからない
  rationale: 災いや裁きが人に及ぶという厳粛な含みを保ち、「起こらない」よりも原文の比喩的な動きを伝える。
theological_decisions:
- issue: τὸν κύριον（「主」）が具体的に誰を指すか
  choice: 「主」とのみ訳し、指示対象を限定しない。
  alternative: 「神」または「主イエス」と明示する。
  rationale: 原文はκύριοςとのみ述べており、この箇所だけでは神か復活したイエスかを翻訳で限定する必要がない。原文の曖昧さと神学的な緊張を保つ。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、警告された裁きへの恐れが伝わるよう「身に降りかかる」という厳粛な表現を採用した。引用内では明示的なὑμεῖςを「あなたがたが」と表し、相手に執り成しを求める強調を保った。英語相談層の脚注は本文と実質的に同じ語順上の言い換えであり、日本語では意味上の異読を生まないため、脚注を設けなかった。
