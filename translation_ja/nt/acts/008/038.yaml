id: ACT.8.38
reference: Acts 8:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: ja
  text: そこで彼は馬車を止めるよう命じた。フィリポと宦官は二人とも水の中へ下り[a]、フィリポは彼に洗礼を授けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「水のところまで下り」。ただし、ギリシア語の前置詞は通常、水の中への移動を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: 命じた
  rationale: 権威をもって指示する意を保ちつつ、現代日本語として自然で簡潔な表現。
- source_word: στῆναι τὸ ἅρμα
  choice: 馬車を止めるよう
  rationale: 直訳的な「馬車を立たせる」ではなく、乗り物を停止させるという文脈上の意味を自然に表した。
- source_word: ἅρμα
  choice: 馬車
  rationale: 古代の車両を指す語で、この旅行場面では日本語の「馬車」が明瞭。「戦車」では軍用車両との誤解を招きやすい。
- source_word: κατέβησαν
  choice: 下り
  rationale: καταβαίνω の下降の意味を簡潔に保持した。
- source_word: ἀμφότεροι
  choice: 二人とも
  rationale: 両者がともに水へ下りたという明示的な強調を保つ。
- source_word: εἰς τὸ ὕδωρ
  choice: 水の中へ
  rationale: εἰς の通常の方向性を反映する。ただし、この句だけで洗礼の方式を決定するものとはしない。
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: フィリポと宦官
  rationale: 二人の当事者を明示し、直前の「二人とも」と合わせて原文の強調を自然な日本語で再現した。
- source_word: εὐνοῦχος
  choice: 宦官
  rationale: 語の通常の意味と物語上の呼称の連続性を保つ。「高官」だけでは身体的・社会的含意が失われる。
- source_word: ἐβάπτισεν
  choice: 洗礼を授けた
  rationale: 日本語で定着した非宗派的な聖書用語を用い、洗礼の具体的方式を訳文で断定しない。
- source_word: αὐτόν
  choice: 彼に
  rationale: 洗礼を受けた対象が宦官であることを自然な日本語で示す。
theological_decisions:
- issue: 洗礼の方式を訳文で確定するか
  choice: 「水の中へ下り」「洗礼を授けた」と訳し、方向性は保つが方式を付加しない。
  alternative: 「水辺まで下り」と弱める、または「浸した」と訳して浸礼を明示する。
  rationale: 原文は二人が水の中へ移動したことと、フィリポが宦官に洗礼を施したことを述べるが、その表現以上に後代の教派的結論を加えるべきではない。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述。「そこで」で物語の進行を自然につなぎ、「フィリポは」を補って最後の動作主を日本語で明確にした。
