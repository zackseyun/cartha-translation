  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: ja
  text: 二人が道を進んでいると、水のある所に差しかかった。すると宦官が言う。「ご覧ください、水があります。私が洗礼を受けることを、何が妨げるのでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  choice: 宦官
  rationale: 身分・役職を表す原語を簡潔に保ち、文脈上すでに特定されている人物として訳した。
- source_word: Ἰδοὺ ὕδωρ
  choice: 見てください。水があります。
  rationale: ἰδούの注意喚起と、目前に水を見つけた驚き・即時性を自然な現代日本語で表した。
- source_word: βαπτισθῆναι
  choice: 洗礼を受ける
  rationale: 受動不定詞の意味を保ち、キリスト教文脈で広く通用する標準的な表現を採用した。
- source_word: φησιν
  choice: 言った
  rationale: 原文の歴史的現在は物語を生き生きとさせる用法であり、日本語では前後の過去叙述に合わせるほうが自然である。
theological_decisions:
- issue: 洗礼を妨げる条件の含意
  choice: 「何が妨げるでしょうか」と問いをそのまま訳し、条件や回答を補わない
  alternative: 信仰告白など、後代の写本にある8章37節の内容をここへ補う
  rationale: SBLGNT本文は問いだけを記しているため、その開放性と修辞的な力を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「二人」は動詞の複数形と直前の文脈を自然に示すために補った。引用内は宦官がフィリポに語りかける場面として丁寧体にした。
