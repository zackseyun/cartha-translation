- from: 二人が道を進んでいると、ある水辺に来た。すると宦官は言った。「見てください。水があります。私が洗礼を受けるのを、何が妨げるでしょうか。」
  to: 二人が道を進んでいると、水のある所に差しかかった。すると宦官が言う。「ご覧ください、水があります。私が洗礼を受けることを、何が妨げるのでしょうか。」
  rationale: 地形を限定する「水辺」を、原文のτι ὕδωρにより忠実な「水のある所」に改めた。また、歴史的現在φησινを「言う」とし、問いのτί（何が）を明示した。洗礼の条件や、本文にない信仰告白は補っていない。
