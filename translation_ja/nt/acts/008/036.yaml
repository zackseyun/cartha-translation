  naturalness: 「水のある所に差しかかった」は現代標準日本語として自然で、原文の意味も過不足なく表します。発話は丁寧な呼びかけを保ちつつ、「何が妨げるのでしょうか」で原文の「何が」を明確に反映します。
  terminology: 「宦官」「洗礼を受ける」は、原語とキリスト教文脈に適した標準的な訳語です。
