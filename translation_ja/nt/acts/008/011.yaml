revisions:
- from: 人々が彼に心を奪われていたのは、彼が長い間、魔術によって人々を驚嘆させていたからである。[a]
  to: 人々が彼に注目していたのは、彼がかなり長い間、魔術によって人々を驚かせてきたからである。[a][b]
  rationale: 「心を奪われていた」を「彼に注目していた」に改め、προσέχωの基本的意味を保ちつつ未完了過去の継続を自然に表した。「かなり長い間」でἱκανῷ χρόνῳの相当な長さを反映し、「驚かせてきた」で完了不定詞が示す先行する継続的な影響を表した。「魔術」は、行為の実態を詐術・超自然的活動のいずれかに決めつけない。脚注を本文の語彙的代替に整合するよう改め、魔術についての代替も補った。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:58Z'
review_pass:
  verdict: revise
  source_fidelity: 「心を奪われていた」は、προσέχωの「注意を向ける／耳を傾ける」を、強い魅惑・支配の意味へと拡張しており、ἐξεστακέναι（驚かせる）の内容とも重なります。「彼に注目していた」のほうが、継続を表す未完了形προσεῖχονと、理由を示すδιὰ τὸ…ἐξεστακέναιを区別して忠実に表せます。「かなり長い間」「魔術」「驚かせてきた」はそれぞれἱκανῷ χρόνῳ、ταῖς μαγείαις、完了不定詞の文脈上の先行性・持続する結果を自然に反映します。
  naturalness: 「人々が彼に注目していたのは、彼がかなり長い間、魔術によって人々を驚かせてきたからである」は明瞭な現代標準語です。「人々」の反復は原文のαὐτούςを曖昧にせず、短い一節では不自然ではありません。
  terminology: 「魔術」はμαγείαιςを過度に特定せずに表す適切な語です。「魔法」よりも宗教的・実践的な含みを保ち、「妖術」や「呪術」ほど解釈的・評価的になりません。
  issues:
