  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: ja
  text: 人々が彼に注目していたのは、彼がかなり長い間、魔術によって人々を驚かせてきたからである。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「長い間」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「魔術的な行いによって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: 心を奪われていた
  rationale: ここでは単に注意を向けるだけでなく、シモンに強く引きつけられて従っていた文脈である。未完了過去の継続性も「〜ていた」で表した。
- source_word: αὐτῷ
  choice: 彼に
  rationale: προσέχωの与格目的語であり、シモンを指す。
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: 長い間…からである
  rationale: διά＋冠詞付き不定詞は理由を示し、ἱκανῷ χρόνῳは相当な期間を表す。自然な日本語として「長い間」とした。
- source_word: ταῖς μαγείαις
  choice: 魔術によって
  rationale: 複数形は魔術的な行為・実践を指す。「魔術」は、手品か超自然的な行為かを本文以上に断定しない。
- source_word: ἐξεστακέναι
  choice: 驚嘆させていた
  rationale: ἐξίστημιの完了不定詞は、人々を非常に驚かせ、その影響が続いていたことを示す。「驚嘆させる」は「魅了する」や「惑わす」よりも原因を過剰に解釈しない。
- source_word: αὐτούς
  choice: 人々を
  rationale: 直訳の「彼らを」よりも、日本語では指示対象を明示する方が自然であり、前文の人々を指す。
theological_decisions:
- issue: シモンの μαγείαις の性質
  choice: 「魔術」と訳し、その実態を断定しない
  alternative: 「妖術」「魔法」「手品」
  rationale: 本文は魔術的実践とそれが人々に与えた驚嘆を述べるが、詐術か超自然的活動か、またはその両方かをこの節だけでは特定しない。「魔術」はその緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい端正な文体とした。「心を奪われていた」は前後の文脈における継続的な傾倒を自然に表す。脚注記号は本文中に配置した。
