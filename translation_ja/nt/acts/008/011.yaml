    rationale: この表現は「注意を向ける、耳を傾ける」以上に、魅了されて心を支配される意味を含む。原文では人々が彼に注目していたことと、魔術によって驚かされていたことが区別されているため、訳文でも区別するのがよい。
  - severity: low
    issue: 期間表現の脚注が本文との差を十分に示していない
    rationale: 本文の「長い間」と脚注の「かなり長い間」は近接するが、ἱκανῷ χρόνῳの「相当の期間」という含みを本文で「かなり長い間」と明示し、脚注を「長い間」とするほうが選択肢として明確である。
  - severity: low
    issue: μαγείαιςに対応する訳語の代替を示す脚注がない
    rationale: 英語監査記録では「sorceries」が語彙上の代替として示されている。日本語でも「魔術的な行い」を脚注に置けば、複数形・実践の含みを補助でき、本文の意味を変更しない。
  revised_text: 人々が彼に注目していたのは、彼がかなり長い間、魔術によって人々を驚かせてきたからである。[a][b]
