id: ACT.8.30
reference: Acts 8:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: ja
  text: そこでフィリポは走り寄り、その人が預言者イザヤの書を読んでいるのを耳にして、言った。「あなたは、読んでいることが本当に分かりますか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたは、読んでいることが果たして分かりますか。」ギリシア語の二つの小辞は、この問いに強調を添えています。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: 走り寄り
  rationale: 相手のいる所へ素早く駆け寄る動作を表すアオリスト分詞の鮮明さを、自然な日本語で保った。
- source_word: δὲ
  choice: そこで
  rationale: ここでは物語の進行と直前の命令を受けた行動を示すため、文脈上自然な接続表現とした。
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: その人が…読んでいるのを耳にして
  rationale: 属格分詞構文が、読んでいる最中の声をフィリポが聞いたことを表す。「声に出して」は明記せず、聞こえたことだけを自然に示した。
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: 預言者イザヤの書
  rationale: 原文は直訳すれば「預言者イザヤ」だが、ここではその著作を読むという換喩である。日本語で人そのものを読むとの誤解を避けつつ意味を明確にした。
- source_word: εἶπεν
  choice: 言った
  rationale: 基本的な語義を保ち、続く疑問文によって問いかけであることが明らかになる訳とした。
- source_word: Ἆρά γε
  choice: 本当に…ますか
  rationale: 二つの小辞が問いに添える探るような強調を、現代日本語で自然に表した。
- source_word: γινώσκεις
  choice: 分かりますか
  rationale: ここでは読んでいる内容の意味を理解しているかを問うため、「知っていますか」ではなく「分かりますか」とした。
- source_word: ἃ ἀναγινώσκεις
  choice: 読んでいること
  rationale: 関係代名詞が指す読書内容と、現在進行中の行為を簡潔な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述とした。「その人」は直前の文脈にいるエチオピア人を指す。原文の「読む／理解する」による語感を、日本語の「読んでいることが分かる」で可能な限り保った。
