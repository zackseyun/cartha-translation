reference: Acts 28:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: ja
  text: その場所の周辺には、島の首長[a]で、プブリオという名の人が所有する土地[b]があった。彼は私たちを迎え入れ、三日間、親切にもてなしてくれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「島の第一人者」または「島の有力者」とも訳せる。ギリシア語は、その島で指導的または最高位にある人物を指すと考えられる。
    reason: alternative_reading
  - marker: b
    text: 「領地」または「地所」とも訳せる。原語は付近にある所有地を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: その場所の周辺には
  rationale: περὶ τὸν τόπον ἐκεῖνονの空間的意味を自然な現代日本語で表した。δέは穏やかな叙述の接続であり、この一節だけでは明示的な接続語を置かなくても流れを損なわない。
- source_word: ὑπῆρχεν χωρία
  choice: 土地があった
  rationale: ὑπῆρχενを存在表現「あった」とし、χωρίαは周辺にある複数区画または一まとまりの所有地を指し得るため、数を不自然に明示しない集合的な「土地」とした。
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: 島の首長
  rationale: πρῶτοςは単なる順序の「第一」ではなく、島で最高位または指導的地位にある人物を表す。公的称号か一般的な身分表示かは断定せず、「首長」で簡潔に示した。
- source_word: ὀνόματι Ποπλίῳ
  choice: プブリオという名の人
  rationale: ὀνόματιと与格による名前の導入を自然に表現した。Πόπλιοςは日本語聖書で一般的な形「プブリオ」とした。
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: 私たちを迎え入れ
  rationale: 客として受け入れる意味を保ち、後続の宿泊を伴う歓待と自然につながる表現とした。
- source_word: τρεῖς ἡμέρας
  choice: 三日間
  rationale: 時間の幅を示す対格を標準的な日本語で表した。
- source_word: φιλοφρόνως ἐξένισεν
  choice: 親切にもてなしてくれた
  rationale: φιλοφρόνωςの好意的で丁重な態度と、ξενίζωの客として宿泊させ歓待する意味を、自然で明瞭な一続きの表現にした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「首長」は地位の高さを示しつつ、厳密な官職名であったかどうかを本文で断定しない。主語関係が明確になるよう二文に分けた。
