lexical_decisions:
- source_word: ὅθεν
  choice: そこから
  rationale: 物語における場所の移行を、指示対象を保ちながら自然な現代日本語で表した。
- source_word: περιελόντες
  choice: 錨を上げて
  rationale: 航海の文脈で、船をつなぎ止めていたものを取り除いて出航する動作を表す。より一般的な「船出して」の可能性は脚注に残した。
- source_word: κατηντήσαμεν
  choice: 着いた
  rationale: 目的地への到着を表す動詞であり、簡潔で自然な日本語とした。
- source_word: Ῥήγιον
  choice: レギオン
  rationale: 古代の地名をギリシア語の発音に沿って音写した。
- source_word: μετὰ μίαν ἡμέραν
  choice: 一日たって
  rationale: 経過した時間を明確かつ自然な日本語で示した。
- source_word: ἐπιγενομένου νότου
  choice: 南風が吹き始めたので
  rationale: 属格独立構文が示す状況と、航行が進んだ背景的な因果関係を自然に表現した。
- source_word: δευτεραῖοι
  choice: 二日目には
  rationale: 出発後の二日目に到着したという時間関係を明示した。
- source_word: ἤλθομεν
  choice: 着いた
  rationale: 目的地を伴う移動動詞を、日本語の文脈では到着として自然に表した。
- source_word: Ποτιόλους
  choice: ポテオリ
  rationale: 古代の地名をギリシア語形に沿って音写した。
