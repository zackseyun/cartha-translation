id: ACT.28.20
reference: Acts 28:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: ja
  text: ですから、このような理由で、皆さんにお会いしてお話しするため、来ていただきたいとお願いしたのです。というのも、私はイスラエルの望み[a]のために、この鎖を身に帯びているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルが抱く望み」。イスラエルへの契約に基づく約束や復活に関わる望みを指すと考えられる。
    reason: 属格表現の幅と、この句が含みうる契約的・復活的な意味を示しつつ、本文では解釈を限定しないため。
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: こういうわけで
  rationale: 原因を示す句と推論を示すοὖνを、日本語として不自然に重ねず、一つの自然な接続表現で示した。直前の説明を受ける論理関係を保っている。
- source_word: παρεκάλεσα
  choice: お願いした
  rationale: この文脈では、ローマ在住のユダヤ人指導者たちとの面会を求めたことを指す。「懇願した」ほど強くせず、「招いた」とも限定しない自然な表現とした。
- source_word: ἰδεῖν καὶ προσλαλῆσαι
  choice: 皆さんにお会いして話をしたい
  rationale: ἰδεῖνの直接性と、προσλαλῆσαιが示す対話的な語りかけを、自然な現代日本語で表した。
- source_word: ἕνεκεν γὰρ
  choice: というのも、～のために…からです
  rationale: γάρの説明的な働きとἕνεκενの原因・理由をともに明示し、パウロが鎖を身につけている理由とのつながりを保った。
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: イスラエルの望み
  rationale: 属格表現を簡潔に保ち、それがイスラエルに属する望み、イスラエルが抱く望み、あるいはイスラエルに約束された望みのいずれを強調するかを本文で限定しない。
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: この鎖を身につけている
  rationale: ἅλυσινの単数形と、περίκειμαιの「身の周りに帯びている」という具体的な像を保った。「鎖につながれている」と意訳して拘束の仕方を過度に特定することを避けた。
theological_decisions:
- issue: 「イスラエルの望み」の意味
  choice: 本文では「イスラエルの望み」と簡潔に訳し、解釈を展開しない。
  alternative: 「イスラエルに約束された望み」「イスラエルが抱く復活の望み」「イスラエルのメシア待望」
  rationale: この表現は契約の約束、復活、メシアにかかわる望みを想起させるが、ギリシア語本文はその内容をここで明示していない。特定の教理的説明に狭めず、含意と緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの説明の論理と拘束状態を表す具体的な像を保った。「皆さん」「お会いして」「お願いした」により、相手への礼節が感じられる自然な語調とした。
