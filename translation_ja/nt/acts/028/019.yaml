  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: ja
  text: しかし、ユダヤ人が反対したので[a][b]、私はカエサルに上訴せざるを得ませんでした。とはいえ、自分の民族を訴える理由が何かあったわけではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ人が私に反対し続けたので」または「ユダヤ人が反論したため」。
    reason: lexical_alternative
  - marker: b
    text: ここでの「ユダヤ人」は、この法的な争いでパウロに反対したユダヤ人を指し、すべてのユダヤ人を一括して指す表現ではない。
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: 反対したため
  rationale: 属格独立構文の現在分詞が、パウロの上訴を促した事情を示す。法的な文脈にも合い、単なる言葉上の反論に限定しない自然な訳とした。
- source_word: δὲ
  choice: しかし
  rationale: 前節からの展開に軽い対照を加える接続詞として訳した。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人たち
  rationale: 原文の表現を不必要に「指導者」などへ限定せず保持した。文脈上はパウロに反対したユダヤ人を指すことを脚注で明示する。
- source_word: ἠναγκάσθην
  choice: せざるを得ませんでした
  rationale: 受動形が表す外的な圧力と必要性を、明瞭で自然な現代日本語にした。
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: 皇帝に上訴する
  rationale: ローマ皇帝への法的な上訴を表す定型的用法。日本語では称号としての意味が明確な「皇帝」を用いた。
- source_word: οὐχ ὡς
  choice: とはいえ、…わけではありません
  rationale: 上訴の動機について誤解を退ける説明であることを、自然な日本語で示した。
- source_word: τοῦ ἔθνους μου
  choice: 自分の民族
  rationale: パウロ自身が属する民族的・共同体的なまとまりを指す。「国」よりも、この文脈での帰属関係を明確に表す。
- source_word: ἔχων τι κατηγορεῖν
  choice: 訴える理由が何かあった
  rationale: κατηγορεῖν の法廷的意味を保ちつつ、「何か非難したいこと」ではなく、告発・訴追の根拠を持つという構文の意味を自然に表現した。
theological_decisions:
- issue: 民族的・宗教的に敏感になり得る「ユダヤ人たち」の指示範囲
  choice: 本文では原文どおり「ユダヤ人たち」とし、文脈上の範囲を脚注で説明する。
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」と訳す。
  rationale: 原文は指導者に限定しておらず、地理的呼称とも確定できない。この箇所ではパウロに反対した当事者を指し、全ユダヤ人を一括して述べるものではないため、その点は本文を改変せず脚注で明らかにした。
- issue: 「自分の民族を訴える」の意味
  choice: パウロの上訴が同胞への告発を目的としたものではない、という否定を保持する。
  alternative: パウロには同胞を非難する意図が全くなかった、と内面的意図に限定する。
  rationale: 原文は「訴える何かを持っている」という法廷的表現であり、感情や内面の意図だけに狭めず、告発の理由・根拠がないという意味を保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。パウロの丁寧な語り口に合わせて敬体を用い、法廷的な語彙として「上訴」「訴える理由」を採用した。脚注記号は本文中に[a][b]の順で配置した。
