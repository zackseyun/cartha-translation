source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: ja
  text: しかし、私たちは、あなた自身から、あなたの考えを聞くのがよいと思っています。この一派[a]については、至る所で反対の声が上がっていることを、私たちは知っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「党派」「運動」。ここでのギリシア語 αἵρεσις（ハイレシス）は、後代の専門的な意味での「異端」とは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: 適切だと思います
  rationale: この文脈では、価値を要求するというより、話を聞くことがふさわしいとの丁寧で公的な判断を表す。現代日本語として自然な形でその語調を保った。
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: あなたから直接聞く
  rationale: παρά＋属格が示す、パウロ本人を情報源として聞くという含みを「直接」で明確にした。
- source_word: ἃ φρονεῖς
  choice: あなたがどう考えているのか
  rationale: φρονέωはここで見解や考え方を指すため、特定の教説に狭めず自然に訳した。
- source_word: αἱρέσεως
  choice: 一派
  rationale: ここでは後代の教義上の専門語としての「異端」ではなく、社会的・宗教的な集団や運動を指す。「一派」はその意味を簡潔に伝える。
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: 私たちは知っている
  rationale: ギリシア語の非人称的構文を日本語でそのまま再現すると硬く不自然になるため、意味と公的な語調を保つ自然な能動表現とした。
- source_word: πανταχοῦ
  choice: 至る所で
  rationale: 場所的な広がりを示す語の範囲を、簡潔で格調のある現代日本語で表した。
- source_word: ἀντιλέγεται
  choice: 反対の声が上がっている
  rationale: 単なる抽象的な敵対ではなく、人々が口に出して反対しているという受動形の言語的ニュアンスを自然な日本語で示した。
theological_decisions:
- issue: αἵρεσιςの訳語
  choice: 一派
  alternative: 異端
  rationale: この箇所は、外部から見たキリスト教の集団・運動を指しており、後代の教会用語としての教義的な「異端」を意味するとは限らない。そのため、時代錯誤となる限定を避けた。
- issue: ἀντιλέγεταιの意味範囲
  choice: 反対の声が上がっている
  alternative: 非難されている／反対されている
  rationale: 動詞には「言い返す、反対を唱える」という発話の含みがある。「非難」に限定せず、発言による反対と一般的な反対の双方が読み取れる表現を選んだ。
translation_notes:
  register: 丁寧な対話の場面に合う「です・ます」調を用い、公的で落ち着いた語調とした。「あなたから直接」で情報源の強調を示しつつ、全体は一般の現代日本語読者に明瞭な文に整えた。
