  source_fidelity: 全体として原文の内容をよく伝えている。「一派」とし、「異端」という後代の専門的含意を避けた点、また πανταχοῦ と ἀντιλέγεται を「至る所で反対の声が上がっている」とした点は適切である。ただし、「あなたから直接」の「直接」は、παρὰ σοῦ が示す「あなた本人から」の含みとしては可能でも、原文にない対比をやや強く加える。また「聞くのが適切だと思います」は意味は通るが、日本語として少し説明的である。
