  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: ja
  text: 互いに意見が一致しないまま、パウロが最後に一言[a]こう述べた後、人々は立ち去って行った。「聖霊は、預言者イザヤを通して、あなたがたの父祖[b]に正しく語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「一つの言葉」。ここでは、別れ際の結びの発言を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「先祖」。ギリシア語は「父たち」で、イスラエルの先人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: 互いに意見が一致しないまま
  rationale: 相互の不一致という状態を表す分詞構文を、因果関係に限定せず、自然な現代日本語で表した。
- source_word: ἀπελύοντο
  choice: 帰りかけていた
  rationale: 未完了過去が示す、集まりが解散して人々が立ち去りつつある場面を表す。文脈上「解散させられた」ではなく、自ら帰途につく意味と判断した。
- source_word: εἰπόντος τοῦ Παύλου ῥῆμα ἓν
  choice: そのとき、パウロは最後に一言こう述べた
  rationale: 属格独立構文を自然な時間節にし、字義的な「一つの言葉」が結びの発言として機能することを「最後に一言」で示した。
- source_word: Καλῶς
  choice: まことに正しく
  rationale: 発言の適切さ・正しさを肯定する副詞の力を明確にしつつ、引用導入としての厳粛さも保った。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 神的な主体を指す定冠詞付きの句に対する、日本語聖書で明瞭かつ一般的な訳語。
- source_word: ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου
  choice: 預言者イザヤを通して……語られた
  rationale: διά属格が示す媒介を「通して」で保持した。「語られた」は聖霊を人格的な発話主体として示す尊敬表現であり、受動態を意味しない。
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: あなたがたの父祖に
  rationale: イスラエルの先人を指す男性複数形の歴史的・系譜的含意を、現代日本語で自然な「父祖」によって保った。
theological_decisions:
- issue: 「あなたがたの父たち」の指示対象
  choice: あなたがたの父祖
  alternative: あなたがたの先祖
  rationale: πατέρεςの父系的・聖書史的な表現を保ちつつ、「父たち」という不自然な直訳を避けた。「先祖」も意味上可能なので脚注に示した。
- issue: 預言における聖霊とイザヤの関係
  choice: 聖霊は、預言者イザヤを通して……語られた
  alternative: 聖霊は、預言者イザヤによって……語られた
  rationale: 本文が聖霊を発話主体、イザヤを媒介者として明示している構造を保持した。「通して」は道具・媒介を自然に表し、イザヤ自身の主体性を否定する以上の説明を加えない。
- issue: καλῶςによる評価
  choice: まことに正しく
  alternative: よくぞ
  rationale: 聖霊の言葉が正しかったという評価を明示した。「よくぞ」は称賛や感嘆の含みが強いため採らなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「帰りかけていた」によって未完了過去の進行的な場面を示し、分詞構文は因果と時間のどちらかに過度に限定しないよう「一致しないまま」とした。引用は次節へ続くため、閉じかぎ括弧を置いていない。
