  source_fidelity: 「ある者たちは……ほかの者たちは」が οἱ μὲν…οἱ δέ の集団内の対照を適切に表す。「語られていることに納得した」は、τοῖς λεγομένοις に対する ἐπείθοντο の応答を、救済論的な「信じた」と同一視せずに自然な日本語で再現している。「信じなかった」は ἠπίστουν の否定的応答を、原文が明示しない意図的拒絶へ強めずに保っている。未完了相の継続性は日本語では明示しなくても許容される。
  naturalness: 明瞭で現代標準語として自然であり、聖書本文にふさわしい落ち着いた文体である。「語られていること」はやや字義的ではあるが、不自然ではなく、進行中の発話内容という原文の現在分詞の含みを保つ。
  terminology: 「納得した」と「信じなかった」の語彙的な区別は、説得・確信に至ることと信じないことを対照させる原文の表現に適切である。教義的な結論を付加していない。固有名詞や専門的神学用語、脚注アンカーを必要とする箇所はない。
