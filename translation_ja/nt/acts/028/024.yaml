id: ACT.28.24
reference: Acts 28:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: ja
  text: そして、ある者たちは語られていることに納得したが、ほかの者たちは信じなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείθοντο
  choice: 納得した
  rationale: 未完了過去の中・受動形が表す、語られた内容によって説得される反応を自然な現代日本語で示す。「信じた」とはせず、直ちに救済論的な意味へ限定しない。日本語では進行性をあえて明示しなくても、文脈上の応答として十分に伝わる。
- source_word: τοῖς λεγομένοις
  choice: 語られていることに
  rationale: 現在受動分詞の継続的な発言内容を反映し、「語られたこと」よりも、その場で続いている語りを表す。日本語では「納得する」が通常「に」を取るため、自然な統語にした。
- source_word: ἠπίστουν
  choice: 信じなかった
  rationale: ἀπιστέωの基本的な否定的応答を、拒絶の意志まで読み込まずに表す。「信じようとしなかった」では原文以上に意志性を強めるため避けた。未完了過去の継続・反復的側面は文脈に委ねる。
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ある者たちは……が、ほかの者たちは
  rationale: 集団内で応答が分かれたことと、μέν…δέの対照を明瞭で自然な日本語にする。
- source_word: καὶ
  choice: そして
  rationale: 前節の叙述との連続を保ちつつ、過度な因果関係を付加しない接続表現。
theological_decisions:
- issue: 応答の対照が持つ意味
  choice: 一方は語られた内容に納得し、他方は信じなかったという、その場での異なる応答として訳す。
  alternative: 前者を救いに至る信仰者、後者を意図的に拒絶した者として明示する。
  rationale: 原文は応答の相違を述べるが、各人の究極的な霊的状態や、後者の意志的拒絶をこの節だけで明示してはいないため。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての落ち着きを保つ。「説得されていた」は形式的には近いものの、日本語では不自然になりやすいため「納得した」とした。
