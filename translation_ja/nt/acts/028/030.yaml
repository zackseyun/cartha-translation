  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: ja
  text: パウロは丸二年間、自分の借りた住まいに滞在し[a]、訪ねて来る人を皆、迎え入れた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の借家に」「自分の借りた宿所に」。ギリシア語のミストーマは、賃借した住居や宿所を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼のところに入って来る人を皆」。住まいを訪れて中に入る様子を表していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: 滞在し
  rationale: この文脈では、ある場所にとどまって暮らすことを表す。現代日本語として自然であり、「住んだ」ほど居住の意味に限定しない。
- source_word: δὲ
  choice: （訳文では明示しない）
  rationale: ここでは強い対比ではなく、物語を緩やかに進める接続辞である。日本語では文脈上明らかなため、接続語を加えないほうが自然である。
- source_word: διετίαν ὅλην
  choice: 丸二年間
  rationale: 二年という期間全体を強調するὅληνを、簡潔で自然な日本語で表す。
- source_word: ἐν ἰδίῳ μισθώματι
  choice: 自分で借りた住まいに
  rationale: μίσθωμαは賃借した住居・宿所を指す。「自分で」はἰδίῳが示す本人側の住まいであることを自然に伝え、「借家」より住居の形態を限定しない。
- source_word: ἀπεδέχετο
  choice: 迎え入れた
  rationale: 未完了過去形が示す継続的・反復的な行為と、訪問者を受け入れる含意を、日本語で自然に表す。
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: 訪ねて来る人を皆
  rationale: εἰσπορεύομαιの「中に入って来る」という空間的含意を、「迎え入れた」と組み合わせて自然に示す。πρός αὐτόνは「訪ねて来る」に含めた。
