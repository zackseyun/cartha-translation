  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: ja
  text: この民の心は鈍くなり、耳では鈍く聞き、目を閉じた。そうでなければ[a]、目で見、耳で聞き、心で悟り、立ち返り[b]、わたしが彼らを癒やすだろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らが目で見、耳で聞き、心で悟り、立ち返り、わたしが彼らを癒やすことがないように」。ここで用いられたギリシア語の接続表現は、イザヤ書からのこの引用では、より強い目的・防止の意味を帯びることがある。
    reason: alternative_reading
  - marker: b
    text: 「立ち返る」は、「向きを変える」「帰る」、また文脈によっては「悔い改める」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: 鈍くなり
  rationale: 直訳的には「厚くなった／肥えた」だが、心の感受性が失われたという比喩的意味を、現代日本語で自然に保つ。
- source_word: καρδία
  choice: 心
  rationale: 聖書的な人間理解の語を保ち、後半の「心で悟り」との語彙的統一も維持する。
- source_word: βαρέως ἤκουσαν
  choice: 耳では聞き取りにくくなり
  rationale: 字義的な「重く聞いた」を不自然な日本語にせず、聞く力が鈍いという意味を表す。文脈上の状態を自然に示すため「なり」とした。
- source_word: ἐκάμμυσαν
  choice: 目を閉じてしまった
  rationale: 彼ら自身が目を閉じたという能動性を明確にしつつ、完了した行為の結果を自然な日本語で示す。
- source_word: μήποτε
  choice: そうでなければ
  rationale: 目的・防止を示し得る接続表現の神学的緊張を一義的に解消せず、読みやすい帰結表現とした。より強い「〜することがないように」の可能性は脚注に示す。
- source_word: συνῶσιν
  choice: 悟り
  rationale: 単なる知的理解以上に心による認識を表し、簡潔で格調ある日本語とする。
- source_word: ἐπιστρέψωσιν
  choice: 立ち返って
  rationale: 方向転換・帰還という比喩を保ち、「悔い改める」と狭く規定しない。別訳を脚注に示す。
- source_word: ἰάσομαι
  choice: わたしが彼らを癒やすことになる
  rationale: μήποτε以下との連関を条件的な帰結として表しつつ、未来形の意味を保持する。
theological_decisions:
- issue: イザヤ引用における神の意図と民の責任
  choice: 本文では「そうでなければ」とし、民が自ら目を閉じたことと、癒やしに至り得る帰結を示す
  alternative: 「彼らが見て、聞いて、悟り、立ち返り、わたしが癒やすことがないように」
  rationale: μήποτεは防止・目的の強い含みを持ち得るため、その可能性を脚注に残し、神の裁きと人間の責任の緊張を本文だけで解消しない。
- issue: ἐπιστρέψωσινの回心的意味
  choice: 立ち返る
  alternative: 向きを変える／帰る／悔い改める
  rationale: 神への方向転換を含み得る語義を保ちながら、特定の教派的表現や、原語以上に限定的な解釈を持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、預言書引用にふさわしい簡潔さと格調を保った。「耳では聞き取りにくくなり」は、原文の「重く聞いた」という比喩を日本語として理解可能にした表現。脚注記号[a][b]は、それぞれ関連箇所に対応させて本文末尾に置いた。
