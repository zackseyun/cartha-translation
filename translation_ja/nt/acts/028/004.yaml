id: ACT.28.4
reference: Acts 28:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: ja
  text: 島の人々[a]は、その生き物が彼の手からぶら下がっているのを見ると、互いに言った。「この男はきっと人殺しだ。海から無事に助かったのに、〈正義〉[b]が生きることを許さなかったのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「異国語を話す人々」。ここでは、ギリシア語を話さない島の現地住民を指し、「野蛮な人々」という意味ではない。
    reason: lexical_alternative
  - marker: b
    text: 原語は「正義」。ここでは、悪人に報いを下す力として擬人化されているらしい。島民が女神のような存在を念頭に置いていた可能性もある。
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: 島の人々
  rationale: 当時のギリシア語で、ギリシア語を話さない現地住民を指す語。現代日本語の「野蛮人」が帯びる道徳的な軽蔑の意味を避け、文脈上の指示対象を自然に示した。
- source_word: κρεμάμενον
  choice: ぶら下がっている
  rationale: 生き物がパウロの手から垂れ下がる、またはそこに取り付いた状態を視覚的に表し、姿勢を必要以上に限定しない。
- source_word: τὸ θηρίον
  choice: その生き物
  rationale: 原語は獣や動物を表す一般語であり、この語自体は「まむし」と特定していないため、包括的な表現を保った。
- source_word: Πάντως
  choice: きっと
  rationale: 目の前の出来事から話者たちが下した強い確信を、自然な直接話法で表した。
- source_word: φονεύς
  choice: 人殺し
  rationale: 殺人を犯した者を指す語。会話として自然で、意味も明確な現代日本語を選んだ。
- source_word: διασωθέντα
  choice: 無事に助かった
  rationale: 危険を切り抜けて無事に至ったことを表す。日本語では受動形を機械的に再現せず、海難から生還した意味を自然に伝えた。
- source_word: ἡ δίκη
  choice: 〈正義〉
  rationale: 単なる抽象概念というより、悪事に報復する力として擬人化されている可能性を山括弧で示しつつ、特定の女神名と断定しなかった。
- source_word: ζῆν οὐκ εἴασεν
  choice: 生きることを許さなかった
  rationale: 原文の「生きるのを許さなかった」という表現を保ち、島民が蛇の出来事を死の宣告と見なした推論を過度に説明しなかった。
- source_word: ἐκ τῆς θαλάσσης
  choice: 海から
  rationale: 前置詞の基本的な起点の意味を簡潔に表し、διασῴζωが含む危険からの生還という意味と重複させなかった。
theological_decisions:
- issue: δίκηの擬人化
  choice: 本文では〈正義〉とし、注で報復的正義の擬人化である可能性を説明する
  alternative: 「正義」「復讐の女神」「女神ディケー」
  rationale: 島民の異教的な世界観を報告する発言であって、語り手がそれを承認しているとは限らない。擬人化を見える形で保ちながら、特定の神格との同定は避けた。
- issue: 島民の発言における死の確定性
  choice: 「生きることを許さなかった」と原文の完結的な言い方を保つ
  alternative: 「生かしてはおかないのだ」「死なせようとしている」
  rationale: パウロがまだ生きているという場面上の緊張を、未来表現で解消せず、島民がすでに結論を下した原文の語り方を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、直接話法には島民の確信が伝わる自然な口調を採用した。一方、〈正義〉の擬人化と、まだ生きているパウロについて「生きることを許さなかった」と言う原文の緊張は残した。
