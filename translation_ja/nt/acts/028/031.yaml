source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: ja
  text: 神の国を宣べ伝え、主イエス・キリストについて教えた。まったく大胆に、少しも妨げられることなく。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσων
  choice: 宣べ伝え
  rationale: 公に告げ知らせる継続的な活動を表し、説教という特定の形式に限定しない自然な聖書語として訳した。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: βασιλείαが持つ領域と支配の両面を保ちつつ、現代日本語で定着した自然な表現を採った。
- source_word: διδάσκων
  choice: 教え続けた
  rationale: 現在分詞が示す継続的な活動を日本語の叙述として明示した。
- source_word: τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: 主イエス・キリストについて
  rationale: τὰ περὶは日本語では簡潔な「について」が自然であり、κύριοςを称号「主」として保持した。Ἰησοῦ Χριστοῦは新約聖書のこの定型的な結合における日本語の慣用に従い「イエス・キリスト」とした。
- source_word: μετὰ πάσης παρρησίας
  choice: 実に大胆に
  rationale: παρρησίαの、恐れず公然と語る意味を「大胆に」で表し、πάσηςの強意を「実に」で自然に示した。
- source_word: ἀκωλύτως
  choice: 少しも妨げられることなく
  rationale: 使徒言行録を締めくくる語の強調を保つため、否定の強意を伴う自然な表現とし、結尾近くに置いた。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστόςの訳し方
  choice: イエス・キリスト
  alternative: メシアであるイエス／主イエス・メシア
  rationale: Χριστόςは本来「油注がれた者／メシア」という称号だが、Ἰησοῦ Χριστοῦという無冠詞の定型的結合では名前に近い呼称としても機能し得る。日本語本文では自然で広く理解される「イエス・キリスト」を採り、称号性を一方的に排除する説明は加えない。
- issue: ἀκωλύτωςが修飾する範囲
  choice: 宣教と教えの活動全体が妨げられなかったことを表す
  alternative: 直前の「大胆に」のみを限定する
  rationale: 文末の副詞として、並列されたκηρύσσωνとδιδάσκωνによる活動全体を締めくくると理解するのが統語的・談話的に自然である。
translation_notes:
  register: 明快で格調ある現代標準日本語。原文では前節に従属する二つの現在分詞だが、単独節として読めるよう継続相を「教え続けた」で示した。原文末尾のἀκωλύτωςの劇的な効果を日本語でも保つため、「少しも妨げられることなく、実に大胆に」とまとめた。
