  source_fidelity: 「無事に救われた後」は、διασωθέντες の受動的な安全な救出・生還と、それが「知った」出来事に先行することを適切に表している。「こうして」は文頭のΚαὶに対応し、「後」はτότεを含む出来事の順序を自然な日本語で示す。「その島がマルタと呼ばれていることを知った」はἐπέγνωμεν、ἡ νῆσος、Μελίτη、現在受動のκαλεῖταιを過不足なく反映している。
