id: ACT.28.1
reference: Acts 28:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: ja
  text: こうして無事に救われた後[a]、私たちは、その島がマルタ[b]と呼ばれている[c]ことを知った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「無事に難を逃れた後」または「助かった後」。ギリシア語は、危険をくぐり抜けて無事に救われたことを表しうる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「メリテ」。伝統的に、現在のマルタ島とされている。
    reason: cultural_note
  - marker: c
    text: 直訳「その島はマルタと呼ばれている」。ギリシア語では現在形の受動態。
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: 無事に救われた後
  rationale: アオリスト受動分詞が、難をくぐり抜けて安全に救出されたことと、それが「知った」より前の出来事であることを表すため。受動の含みを保ちつつ、難破直後の文脈に自然な日本語とした。
- source_word: τότε
  choice: こうして…後
  rationale: 出来事の順序を示す語。日本語では冒頭の「こうして」と「後」によって、救出後に島名を知ったという時間的推移を自然に示した。
- source_word: ἐπέγνωμεν
  choice: 私たちは…ことを知った
  rationale: ここでは島の名という情報をその時点で知るに至ったことを表す。「分かった」も可能だが、端正な叙述として「知った」を選んだ。
- source_word: Μελίτη
  choice: マルタ
  rationale: ギリシア語名 Μελίτη の指す島について、日本語で定着している名称を用いた。
- source_word: ἡ νῆσος
  choice: その島
  rationale: 直前までの難破と上陸の文脈で、彼らが到着した特定の島を指すため、「その島」が自然である。
- source_word: καλεῖται
  choice: 呼ばれている
  rationale: 現在受動形を保ち、その島がその名で呼ばれているという状態を表した。過去叙述の中でも日本語として自然である。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語の順序と受動表現を保った。「救われた」はこの文脈では遭難からの安全な救出を指し、神学的な意味に限定しない。
