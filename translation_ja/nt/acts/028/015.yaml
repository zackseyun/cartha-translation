source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: ja
  text: そこから、兄弟たち[a]は私たちのことを聞き、アピオの市場と三軒宿まで私たちを迎えに来た。パウロは彼らを見ると、神に感謝し、勇気を得た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、同じ信仰を持つ仲間を指す一般的な呼び方で、文脈によっては女性も含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: そこから
  rationale: καίを含む物語の連続性は日本語の文脈に自然に織り込み、ἐκεῖθενの場所的移行を簡潔に表した。
- source_word: οἱ ἀδελφοὶ
  choice: 兄弟たち
  rationale: 同じ信仰を持つ仲間を指す初期キリスト教の呼称として、ギリシア語の男性複数形を保った。文脈上女性を含み得ることは脚注で明示した。
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: 私たちのことを聞き
  rationale: 分詞の時間的・先行的関係を自然な日本語で示し、τὰ περὶ ἡμῶνを過度に具体化せず「私たちのこと」とした。
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: 私たちを迎えに来てくれた
  rationale: 出向いて到着者を迎えるという定型表現の意味を自然に示す。「くれた」は語り手側へ好意的に出迎えた方向性を日本語で表す。
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: アピオの市場と三軒宿まで
  rationale: ἄχριの到達範囲を「まで」で保持した。地名は意味の分かる慣用的な日本語形とした。
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: パウロは彼らを見ると
  rationale: 関係代名詞の指示対象を「彼ら」で明示し、分詞を自然な時間節として訳した。
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: 神に感謝し
  rationale: 与格の対象を明示し、主動詞へ先行する行為として簡潔に表した。
- source_word: ἔλαβε θάρσος
  choice: 勇気を得た
  rationale: 直訳的な「勇気を受けた」に近い意味を自然な現代日本語で保ち、単なる外的な励まし以上にパウロ自身が勇気づけられたことを示す。
theological_decisions:
- issue: ἀδελφοίが男女を含む信徒集団を指し得ること
  choice: 本文では「兄弟たち」とし、包括的用法を脚注で説明する
  alternative: 「兄弟姉妹たち」または「信者たち」
  rationale: 原文の語形と初期キリスト教の呼称を保持しつつ、女性が除外されるとの誤解を脚注で避ける。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「アピオの市場」「三軒宿」は読者に意味が伝わる伝統的な地名表記を採用した。
