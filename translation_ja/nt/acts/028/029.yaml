lexical_decisions:
- source_word: Καὶ ταῦτα αὐτοῦ εἰπόντος
  choice: パウロがこれらのことを語り終えると
  rationale: 属格絶対構文を自然な時間節として訳した。αὐτοῦの指示対象は文脈上パウロなので、現代日本語で明確にした。「語り終える」は発言後の展開を示すアオリスト分詞の完了的な前後関係を表す。
- source_word: ἀπῆλθον
  choice: 立ち去った
  rationale: その場を去る動作を、物語文として自然かつ品位ある現代日本語で表した。
- source_word: πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν
  choice: 互いに激しく論じ合いながら
  rationale: 直訳的な「自分たちの間に大きな議論を持ちながら」を避け、συζήτησιςの議論・論争という幅を保ちつつ、πολλήが示す強さを「激しく」で表した。「論じ合う」は単なる会話より強い対立を示すが、暴力的な口論とまでは限定しない。
