  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節全体は、現存する最初期のギリシア語写本（3世紀のパピルス74、4世紀のシナイ写本とバチカン写本を含む）および初期のコプト語訳にはありません。一方、ビザンティン系の多数写本や初期のラテン語訳・シリア語訳にはあります。ユダヤ人たちが立ち去る場面を補って物語を整えるため、後代の写字生が加えた可能性があります。
