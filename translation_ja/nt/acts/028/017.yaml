id: ACT.28.17
reference: Acts 28:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: ja
  text: 三日後、パウロはユダヤ人の主だった人々[a]を呼び集めた。彼らが集まると、パウロはこう言った。「兄弟たち[b]、私は、民にも先祖から受け継いだ慣習[c]にも何一つ反することをしていないのに、エルサレムから囚人としてローマ人の手に引き渡されました[d]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ人の指導者たち」「ユダヤ人の中の有力者たち」。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、パウロが呼び集めたユダヤ人の主だった男性たちへの呼びかけ。
    reason: cultural_note
  - marker: c
    text: 別訳「先祖伝来の慣習」。
    reason: lexical_alternative
  - marker: d
    text: 直訳「エルサレムから、囚人としてローマ人の手に引き渡されました」。
    reason: translation_note
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: 三日後
  rationale: Ἐγένετο δὲはルカに多い物語の推移表現であり、日本語では独立して「さて、事が起こった」とせず、時を示す句と一体にして自然に表した。
- source_word: συγκαλέσασθαι αὐτὸν
  choice: パウロは…呼び集めた
  rationale: 不定詞構文を自然な定動詞文にした。文脈上の主語を固有名で明示し、συν-が示す集合の意味を「呼び集めた」で表した。
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: ユダヤ人の主だった人々
  rationale: πρῶτοςは順序ではなく地位・有力さを示す。「主だった人々」は特定の公職名に限定せず、社会的に有力な代表者たちを表せる。
- source_word: συνελθόντων δὲ αὐτῶν
  choice: 彼らが集まると
  rationale: 属格絶対を自然な時の従属節として訳した。
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: 兄弟たち、私は
  rationale: ἄνδρες ἀδελφοίは男性のユダヤ人指導者たちへの敬意と同胞意識を伴う呼びかけ。「兄弟たち」で自然に表し、明示されたἘγώも保持した。
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: 何一つ反することをしていないのに
  rationale: 文脈上の譲歩的な力を「のに」で示し、無実でありながら引き渡されたという対照を保った。
- source_word: τῷ λαῷ
  choice: 民
  rationale: 文脈上はユダヤの民を指す。原文に所有詞がないため「私たちの民」とは補わなかった。
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: 先祖から受け継いだ慣習
  rationale: πατρῷοςが示す先祖伝来の性格を、現代日本語で明瞭に表した。
- source_word: δέσμιος
  choice: 囚人として
  rationale: 拘束された身分・状態を表す述語的な語であり、「囚人として」が後続の受け身表現に自然につながる。
- source_word: ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: エルサレムで…ローマ人の手に引き渡されました
  rationale: παραδίδωμιの法的・拘禁的文脈を「引き渡す」で表し、εἰς τὰς χεῖραςの比喩も「手に」と保持した。ἐξ Ἱεροσολύμωνは引き渡しの出発点を示すが、日本語では出来事の場所として「エルサレムで」が自然で、ローマ側への移送との関係も文脈上明らかである。
theological_decisions:
- issue: 直接呼格ἀδελφοίの訳
  choice: 兄弟たち
  alternative: 同胞の皆さん
  rationale: 呼びかけの対象は呼び集められた男性のユダヤ人有力者たちであるため、文法的性と同胞としての連帯をともに保った。
- issue: 分詞οὐδὲν ἐναντίον ποιήσαςの論理関係
  choice: 譲歩（「何一つ反することをしていないのに」）
  alternative: 付帯・先行状況（「何一つ反することをせず」）
  rationale: パウロの無実と、それにもかかわらずローマ人へ引き渡されたことの緊張が談話の中心にあるため、譲歩として表した。
- issue: 受動形παρεδόθηνの含意
  choice: 行為者を補わず「引き渡されました」
  alternative: ユダヤ人により引き渡されました
  rationale: この節自体は引き渡した主体を明示しない。歴史的・神学的責任主体を訳文で限定しないため、原文どおり受動表現を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、使徒言行録の法的弁明にふさわしい落ち着いた格調を保った。直接話法では丁寧体を用い、パウロの敬意ある語調を示した。
