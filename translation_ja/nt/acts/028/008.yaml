id: ACT.28.8
reference: Acts 28:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: ja
  text: さて、プブリウスの父は、熱病と赤痢に苦しめられ[a]、床についていた。パウロはその人のもとに入り、祈ってから、彼に両手を置いて癒やした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「熱病と赤痢に悩まされ」。ギリシア語の分詞は、これらの病に苦しめられている状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: さて、…ていた
  rationale: ルカ文書に見られる出来事導入の表現。日本語では「次のことが起こった」と逐語的にせず、接続語「さて」と文全体で自然に新しい場面を導入した。
- source_word: πατέρα τοῦ Ποπλίου
  choice: プブリウスの父
  rationale: ギリシア語の属格関係を、明瞭で自然な日本語にした。
- source_word: πυρετοῖς
  choice: 繰り返す熱
  rationale: 原文の複数形を生かし、一度限りの発熱ではなく、熱が反復して起こる状態を自然な日本語で表した。
- source_word: δυσεντερίῳ
  choice: 赤痢
  rationale: 語の通常の医学的意味を、現代日本語で理解しやすい病名として訳した。
- source_word: συνεχόμενον
  choice: 苦しめられ
  rationale: 病に捕らえられ、悩まされ続けている状態を表す分詞の意味を簡潔に反映した。別訳の余地は脚注に示した。
- source_word: κατακεῖσθαι
  choice: 床についていた
  rationale: 病気のため横たわっていることを示しつつ、完全に寝たきりだったとまでは限定しない表現とした。
- source_word: πρὸς ὃν…εἰσελθὼν
  choice: その人のもとに入り
  rationale: パウロが病人のいる場所へ入ったという方向性と動作を、自然な日本語で表した。
- source_word: προσευξάμενος
  choice: 祈ってから
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、行為の順序を明確にした。
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: 彼に両手を置いて
  rationale: 原文の複数形「手」を「両手」として明示し、癒やしに伴う身ぶりを自然に表現した。
- source_word: ἰάσατο αὐτόν
  choice: 癒やした
  rationale: 身体的な病から回復させたという直接的な意味を保ち、原文にない仕方や即時性は付け加えなかった。
theological_decisions:
- issue: パウロによる癒やしの性質
  choice: 祈り、両手を置く行為、癒やしという順序をそのまま述べる
  alternative: 「奇跡的に癒やした」または医療的な回復として説明する
  rationale: 本文はパウロの祈りと行為を通して癒やされたことを述べるが、「奇跡的」「秘跡的」「医療的」などの解釈上の限定は加えていないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「床についていた」は病状と姿勢を自然に伝え、「繰り返す熱」で原文の複数形を可読性を損なわず反映した。固有名は一般的な表記「プブリウス」とした。
