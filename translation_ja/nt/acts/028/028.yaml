  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: ja
  text: ですから、あなたがたはこのことを知っておきなさい。この神の救い[a]は異邦人に送られたのです。彼らも耳を傾けるでしょう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神からのこの救い」。ギリシア語の属格は、神に属する救いとも、神から来る救いとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らも聞くでしょう」。ここで用いられた動詞は、文脈により、単に「聞く」とも、受け入れる姿勢で「耳を傾ける」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: ですから、あなたがたに知っておいてほしい
  rationale: οὖνの推論を「ですから」で示し、γνωστὸν…ἔστω ὑμῖνの公的な告知表現を、現代日本語として自然でありながら明確な「知っておいてほしい」とした。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人に
  rationale: 使徒言行録のこの文脈では、ユダヤ人との対比にある非ユダヤ人を指すため、「諸国民」より「異邦人」が明確である。
- source_word: ἀπεστάλη
  choice: 送られた
  rationale: アオリスト受動態が表す、すでになされた送り出しを簡潔に示す。行為者を補わず、原文の受動表現を保った。
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: 神のこの救い
  rationale: σωτήριονを解釈的な「救いの知らせ」とせず「救い」と訳し、τοῦ θεοῦも「神の」として、起源・所有・性格に関する属格の幅を保った。
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: 彼らは耳を傾けるであろう
  rationale: ἀκούωの単なる聴取以上の受容的な含みを文脈に沿って「耳を傾ける」とした。「であろう」で未来形を表し、救済への応答を必要以上に断定していない。
theological_decisions:
- issue: σωτήριονの意味
  choice: 「救い」と訳す
  alternative: 「救いの知らせ」
  rationale: 文脈には宣教が含まれるが、原語そのものは救いを指す。「知らせ」と限定せず、神の救いの働きという広がりを保つ。
- issue: τοῦ θεοῦの属格
  choice: 「神の」として関係を限定しない
  alternative: 「神からの」
  rationale: 属格は救いの源を示すとも、神に属する救いを示すとも理解できるため、本文ではその曖昧さを保持する。
- issue: ἀκούσονταιの力
  choice: 受容性を含む「耳を傾ける」
  alternative: 中立的な「聞く」
  rationale: 直前までの拒絶との対比から受容的に聞く意味が考えられるが、回心や救済の成立までを訳文に加えてはいない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの結論的で公的な告知の調子を保った。「救い」「異邦人」など定着した聖書語彙は維持しつつ、文構造は読みやすく整えた。
