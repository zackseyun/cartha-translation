  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: ja
  text: そこで私たちは兄弟たち[a]を見つけ、彼らとともに七日間滞在するよう招かれた。こうして私たちはローマに着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは男女を含む信者仲間全体を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: そこで
  rationale: 直前に述べられたプテオリを指す場所の関係副詞。現代日本語の物語文として自然な「そこで」とした。
- source_word: εὑρόντες
  choice: 見つけ
  rationale: 主節と同じ主語を持つアオリスト分詞。先行する出来事を保ちつつ、自然な連用形で表した。
- source_word: ἀδελφοὺς
  choice: 兄弟たち
  rationale: 語形上の意味を保つとともに、使徒言行録の文脈では通常、キリストを信じる仲間を指す。包含範囲は脚注で示した。
- source_word: παρεκλήθημεν
  choice: 招かれた
  rationale: παρακαλέωの受動形。ここでは現地の信者たちが宿泊を求め、もてなした文脈なので、「勧められた」よりも「招かれた」が自然である。
- source_word: παρ’ αὐτοῖς
  choice: 彼らのもとに
  rationale: παρά＋与格が表す、彼らと共にその場所に滞在する関係を自然な日本語で示した。
- source_word: ἐπιμεῖναι
  choice: 滞在する
  rationale: 旅行と宿泊の文脈に即し、「とどまる」より具体的で自然な語を選んだ。
- source_word: ἡμέρας ἑπτά
  choice: 七日間
  rationale: 時間の長さを表す対格を、日本語で明確な期間表現にした。
- source_word: καὶ οὕτως
  choice: こうして
  rationale: 旅程の進展と、そのような経過を経た到着を示す接続表現として簡潔に訳した。
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: 私たちはローマに着いた
  rationale: εἰςを伴うἔρχομαιが目的地への到着を表すため、日本語では「着いた」と明示した。語り手を含む一人称複数も保持した。
theological_decisions:
- issue: ἀδελφοὺςが指す人々
  choice: 現地のキリスト信者たちを指す「兄弟たち」
  alternative: 実の兄弟たち、または広くユダヤ人同胞を指す
  rationale: 使徒言行録の旅程記事における用法と、七日間の滞在に招く共同体的な文脈から、現地の信者たちと理解するのが最も自然である。ただし本文では語の形を保ち、男女を含み得ることを脚注で説明した。
translation_notes:
  register: 明快で現代的ながら品位ある叙述調。「そこで」「こうして」で旅程の流れを示し、「彼らのもとに滞在するよう招かれた」として受動表現と歓待の含意を自然に保った。
