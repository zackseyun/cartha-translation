source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: ja
  text: 三か月後、私たちは、島で冬を越していたアレクサンドリアから来た船で出航した。その船は「ディオスクロイ」を標章としていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ディオスクロイ」は、ギリシア・ローマ神話におけるゼウスの双子の息子、カストルとポルックスを指す。
    reason: 固有名の指示対象を一般読者に示すため。
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: 三か月後
  rationale: μετά＋対格は期間経過後を表す。δέは軽い接続であり、日本語では明示しないほうが自然である。
- source_word: ἀνήχθημεν
  choice: 私たちは……出航した
  rationale: 航海用語として「沖へ出る、船出する」の意。現代日本語の旅行記述として「出航した」が明瞭である。
- source_word: ἐν πλοίῳ … Ἀλεξανδρίνῳ
  choice: アレクサンドリアの船で
  rationale: πλοῖονは船、Ἀλεξανδρῖνοςはアレクサンドリアとの所属・出所を示す。「アレクサンドリア船」より自然で、原文の修飾関係も保つ。
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: 島で冬を越していた
  rationale: παραχειμάζωの完了分詞は、その船が島に留まって冬を過ごした状態を表す。直前の文脈から島はマルタ島だが、本文では原文どおり「島」とした。
- source_word: παρασήμῳ
  choice: 船印が付いていた
  rationale: 船を識別する標章・徽章・像を指し得る。具体的に船首像と断定せず、意味範囲を保ちながら一般読者にも分かる表現とした。
- source_word: Διοσκούροις
  choice: 「ディオスクロイ」
  rationale: ギリシア語固有名を音写し、異教の神話的名称を解釈的に「双子の神々」と置き換えない。意味は脚注で説明する。
theological_decisions:
- issue: 異教の船印 Διοσκούροις の表現
  choice: 「ディオスクロイ」
  alternative: 「双子の神々」／「カストルとポルックス」
  rationale: 本文は異教的な船印を事実として報告するだけで、肯定も否定もしていない。固有名の音写により原文への近さを保ち、脚注で神話上の同定を示す。
- issue: παράσημος の具体的形態
  choice: 船印
  alternative: 船首像
  rationale: 語は標章、徽章、船名を示す像などを表し得るため、船首の彫像と断定しない表現を採用した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、旅行記として簡潔かつ品位ある文体にした。「船印」はやや馴染みの薄い語だが、「船の標章」より簡潔で文脈上理解可能であり、παράσημοςを「船首像」と過度に限定することも避けられる。
