  naturalness: 「船印」は現代標準日本語ではなじみが薄く、何を指すかも直ちには分かりにくい表現です。「標章とする船」は自然で簡潔です。また「アレクサンドリアから来た船」は、形容詞Ἀλεξανδρίνῳの出所・所属の意味を明示しつつ自然です。
