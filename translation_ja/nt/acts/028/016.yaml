  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: ja
  text: 私たちがローマに入ると、パウロは、自分を見張る兵士と共に、一人で住むことを許された。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: すると
  rationale: Ὅτεの時間的関係を「すると」で自然に示し、δὲの軽い接続機能も文脈に溶け込ませた。
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: 私たちがローマに入ると
  rationale: 一人称複数を明示し、εἰσέρχομαιの移動の意味を「入る」で直接的に表した。
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: パウロは……許された
  rationale: 受動形による許可を保ちつつ、現代日本語として自然な主語構文にした。
- source_word: μένειν
  choice: 滞在すること
  rationale: この文脈では、単にその場に残ることよりもローマでの居所・滞在を指すため、「滞在する」が明確で自然である。
- source_word: καθ’ ἑαυτόν
  choice: 一人で
  rationale: 他の囚人とは別に過ごす意味を簡潔に表す。ただし兵士が同伴していたという後続句との緊張を保つため、「共にではあるが」を添えた。
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: 自分を監視する兵士と共にではあるが
  rationale: σύνの同伴を明示し、φυλάσσωは拘禁下の見張りという文脈から「監視する」とした。定冠詞付きの兵士は、その時パウロを担当していた特定の兵士として表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、歴史叙述にふさわしい落ち着いた文体と受動表現を保った。「一人で」と「兵士と共に」の見かけ上の緊張は、他の囚人とは別に滞在できたが監視は受けていたという原文の構造を崩さず表現した。
