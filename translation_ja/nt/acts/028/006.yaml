id: ACT.28.6
reference: Acts 28:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: ja
  text: 人々は、彼の体が腫れ上がるか、突然倒れて死ぬだろうと思っていた。しかし、長い間待って、注意して見ていたが、彼の身には何も異常なことが起こらなかったので[a]、考えを変え、彼は神の一人だと言い始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼の身には何も普通ではないことが起こらなかったので」または「彼の身には何も悪いことが起こらなかったので」。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: 思っていた
  rationale: 未完了過去の継続的な予期を、自然な現代日本語で表す。
- source_word: πίμπρασθαι
  choice: 体が腫れ上がる
  rationale: 蛇にかまれた文脈では、燃えることではなく身体が腫れることを指す。「体」を補って意味を明瞭にした。
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: 突然倒れて死ぬ
  rationale: ἄφνωの突然性と、倒れた結果として死ぬという表現をともに保つ。
- source_word: ἐπὶ πολὺ
  choice: 長い間
  rationale: 観察と待機が相当の時間続いたことを簡潔に表す。
- source_word: προσδοκώντων καὶ θεωρούντων
  choice: 待って見ていても
  rationale: 待ち受けながら注意深く観察していたという二つの分詞の意味を、自然な接続で保持する。
- source_word: μηδὲν ἄτοπον
  choice: 何も異常なことが
  rationale: ἄτοποςの「普通でない、異常な」という幅を保ち、「害」などに限定しない。
- source_word: μεταβαλόμενοι
  choice: 考えを変え
  rationale: 彼らの判断が反転したことを明瞭に示す。
- source_word: ἔλεγον
  choice: 言い始めた
  rationale: 未完了過去が示し得る、新たな発言の開始と継続を自然に表す。
- source_word: θεόν
  choice: 神の一人
  rationale: 無冠詞であり、多神教的な島民の理解を報告する文脈なので、唯一神との同一視を避けつつ日本語として自然に表す。
theological_decisions:
- issue: αὐτὸν εἶναι θεόνを、パウロに関する後代のキリスト教的主張を持ち込まずに訳すこと
  choice: 彼は神の一人だ
  alternative: 彼は神だ／彼は神的な者だ
  rationale: 物語は島民の誤った多神教的結論を報告している。無冠詞のθεόνと文脈を踏まえ、「神の一人」とすることで、唯一の神であるとの告白との混同を避ける。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文としての品位を保った。「彼の身に」は影響がパウロ本人に及ぶことを自然に示し、「神の一人」は島民の多神教的枠組みを明確にする。
