  to: 人々は、彼の体が腫れ上がるか、突然倒れて死ぬだろうと思っていた。しかし、長い間待って、注意して見ていたが、彼の身には何も異常なことが起こらなかったので[a]、考えを変え、彼は神の一人だと言い始めた。
