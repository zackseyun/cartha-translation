id: ACT.28.2
reference: Acts 28:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: ja
  text: 土地の人々[a]は、私たちに並々ならぬ親切[b]を示してくれた。降り続く雨と寒さのために、火をたき、私たち全員を迎え入れてくれたのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「バルバロイ」。当時は主にギリシア語を話さない人々を指す語で、ここでは島の住民のことであり、必ずしも「野蛮な人々」という意味ではない。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「普通ではない親切」。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: 土地の人々
  rationale: 当時のギリシア語では主にギリシア語を話さない人々を指す語であり、この文脈では島の住民を意味する。現代日本語の「野蛮人」が帯びる侮蔑的な意味を本文に持ち込まないよう、「土地の人々」とした。
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: 並々ならぬ親切
  rationale: οὐ τὴν τυχοῦσαν は「普通ではない」、φιλανθρωπία は人への思いやりや親切を表す。「並々ならぬ親切」は否定を含む原文の慣用的な強調を、自然で品位ある日本語で伝える。
- source_word: παρεῖχον
  choice: 示してくれた
  rationale: φιλανθρωπία とともに用いられ、親切を差し伸べることを表す。日本語の自然な連語として「親切を示す」とし、受益者である「私たち」の視点を「くれた」で表した。
- source_word: ἅψαντες πυρὰν
  choice: 火をたき
  rationale: 火をつけて燃やす行為を表す。具体的な規模を「たき火」や「大火」と限定せず、簡潔な「火をたく」とした。
- source_word: προσελάβοντο
  choice: 迎え入れてくれた
  rationale: ここでは人々を好意的に受け入れて世話する意味。「迎え入れる」は、単に近くへ呼ぶ以上の歓待の含みを自然に伝える。
- source_word: πάντας ἡμᾶς
  choice: 私たち全員
  rationale: πάντας の包括性と強調を明確に保った。
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: 降り続く雨のために
  rationale: ἐφεστῶτα は、雨が到来して現に続いている状況を表す。「降り続く」により、その場を襲っている継続的な雨を簡潔に示した。
- source_word: διὰ τὸ ψῦχος
  choice: 寒さのために
  rationale: ψῦχος の気候上の寒さを直接的かつ自然に訳した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然な流れを保った。「並々ならぬ」はやや格調を備えつつ一般読者にも理解でき、原文の否定表現による強調をよく伝える。
