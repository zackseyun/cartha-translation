translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「彼ら」は島の住民を受け、「私たち」は語り手を含む一行を指す。原文の具体的な厚意を保ちながら、日本語として不自然な同語反復は脚注に残した。
