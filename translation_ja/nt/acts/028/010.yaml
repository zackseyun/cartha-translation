  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: ja
  text: 彼らはまた、私たちに多くの敬意を表し[a]、私たちが出帆するときには[b]、必要な物を船に積み込んでくれた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「多くの敬意をもって私たちを敬った」。
    reason: lexical_alternative
  - marker: b
    text: または「沖へ船を出すときには」。ここで使われている語は、船で航海を始めることを表す航海用語。
    reason: lexical_alternative
  - marker: c
    text: または「必要な物を私たちに用意してくれた」。ギリシア語では、より直訳的には「必要のための物を載せた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: さまざまな形で私たちに敬意を表し
  rationale: 語源を同じくする名詞と動詞の反復を不自然な日本語で再現せず、多くの具体的な敬意の表明を受けたという意味を明瞭に伝える。
- source_word: ἀναγομένοις
  choice: 私たちが船出するときには
  rationale: ἀνάγωの航海用法である「沖へ出る、出帆する」を、文脈に即した自然な日本語で表す。
- source_word: ἐπέθεντο
  choice: 船に積んでくれた
  rationale: 動詞自体は「載せた、置いた」だが、航海の文脈から暗示される船を補い、受益的な行為も自然な日本語の補助動詞で示す。
- source_word: τὰ πρὸς τὰς χρείας
  choice: 必要な物
  rationale: 直訳的な「必要のための物」を簡潔で自然に表しつつ、物資を指す中性複数の具体性を保つ。
