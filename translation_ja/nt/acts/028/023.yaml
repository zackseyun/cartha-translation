id: ACT.28.23
reference: Acts 28:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: ja
  text: そこで彼らはパウロと日を決め、その日には、さらに多くの人が彼の滞在先にやって来た。パウロは朝から晩まで、神の国について厳かに証しし、モーセの律法と預言者たちに基づいてイエスについて彼らを説得しながら、詳しく説明した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らを説得しようとしながら」とも訳せる。原語は説得の働きかけを表し、その結果を明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: 彼らはパウロと日を決め
  rationale: 会う日を取り決めるという慣用的な意味を、自然な現代日本語で表した。文脈上の指示対象を明確にするため、αὐτῷを「パウロと」とした。
- source_word: ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν
  choice: 彼の宿にやって来た
  rationale: ξενίαは宿泊場所・滞在先を指す。「宿」は簡潔で自然であり、移動を表すεἰςも保っている。
- source_word: πλείονες
  choice: さらに多くの人
  rationale: 単なる「多くの人」ではなく、前の場面より人数が増えたという比較の含みを保持した。
- source_word: ἐξετίθετο
  choice: 詳しく説明した
  rationale: 内容を順序立てて提示し解き明かす継続的な行為を表す。日本語では文末に置き、文全体を自然にまとめた。
- source_word: διαμαρτυρόμενος
  choice: 厳かに証しし
  rationale: 強く、真剣に証言する語感を保持した。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 原文に忠実で、日本語聖書でも理解されやすい定着した表現。
- source_word: πείθων τε αὐτοὺς
  choice: 彼らを説得しようとしながら
  rationale: πείθωの働きかけを表しつつ、全員を実際に説得できたとは断定しない。ただし「説得して」と訳すことも可能なため注記した。
- source_word: περὶ τοῦ Ἰησοῦ
  choice: イエスについて
  rationale: 説明と説得の内容を明瞭かつ自然に示す。
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: モーセの律法と預言者たちの書に基づいて
  rationale: ἀπόが論証の資料・根拠を示すことを明確にした。「預言者たちの書」は人そのものではなく預言書群を指す文脈を自然に伝える。
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: 朝から晩まで
  rationale: 時間の長さを簡潔で自然な日本語で表した。
theological_decisions:
- issue: 神の国についての証しと、イエスについての説得との関係
  choice: 一続きの説明の中で、神の国を証しし、イスラエルの聖書に基づいてイエスについて説得を試みたと訳す。
  alternative: 二つを相互に関係しない別個の話題として読む。
  rationale: ギリシア語の構文は両者を同じ継続的な解説活動の中に結びつけているが、その神学的関係を本文以上に詳しく規定してはいない。
- issue: πείθωνが説得の成功を含意するか
  choice: 「説得しようとしながら」として、説得の働きかけを示す。
  alternative: 「説得しながら」として、より形式的に訳す。
  rationale: 後続文脈では聞き手の反応が分かれるため、全員への説得成功を暗示しない表現を選んだ。ただし原語自体は単に「説得して」とも訳せるので脚注で示す。
translation_notes:
  register: 明瞭で現代的ながら、使徒言行録の叙述にふさわしい品位を保った。「厳かに証しする」「神の国」「モーセの律法と預言者たちの書」は宗教的内容を正確に伝えつつ、一般の読者にも理解できる表現とした。
