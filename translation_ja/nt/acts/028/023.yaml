  - severity: low
    issue: τῶν προφητῶν を「預言者たちの書」としている。
    rationale: 文脈上は聖書の預言書群を含む定型表現であるが、原文は「預言者たち」と言う。日本語でも「モーセの律法と預言者たち」として定型を保持でき、「書」を補う必要はない。
