  to: そこで彼らはパウロと日を決め、その日には、さらに多くの人が彼の滞在先にやって来た。パウロは朝から晩まで、神の国について厳かに証しし、モーセの律法と預言者たちに基づいてイエスについて彼らを説得しながら、詳しく説明した。[a]
