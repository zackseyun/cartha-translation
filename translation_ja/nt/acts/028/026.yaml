id: ACT.28.26
reference: Acts 28:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: ja
  text: こう言って、[a]「この民のもとへ行って、告げなさい。『あなたがたは確かに聞くが、決して悟らない。確かに見るが、決して見抜かない。[b]』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確かに聞く」は、直訳すると「聞くことによって、あなたがたは聞く」。イザヤ書からのギリシア語引用に保たれた、ヘブライ語的な強調表現である。後半の「確かに見る」も同様。
    reason: lexical_alternative
  - marker: b
    text: または「確かに見ても、決して見ない」。ギリシア語は視覚に関する語を反復しているが、文脈上、最後の語は内面的な認識を含みうる。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: こう言った
  rationale: 現在分詞で前節の発言動詞につながるが、日本語では引用導入として自然な独立節にした。
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: この民のところへ行って
  rationale: 預言的な集合名詞 λαός を「民」とし、移動先を表す πρὸς を自然な日本語で示した。
- source_word: εἰπόν
  choice: 告げなさい
  rationale: 直接引用を導く命令。単なる発声以上に、民へ言葉を伝える文脈に合う。
- source_word: Ἀκοῇ ἀκούσετε
  choice: 確かに聞く
  rationale: 同語根を重ねるセム語的強調を、現代日本語で明瞭な「確かに」によって表した。直訳的構造は脚注に示す。
- source_word: οὐ μὴ συνῆτε
  choice: 決して悟らない
  rationale: οὐ μή の強い否定を「決して」で表し、συνίημι の理解・把握の意味を「悟る」とした。
- source_word: βλέποντες βλέψετε
  choice: 確かに見る
  rationale: 見る行為の反復による強調を自然な日本語で示し、聴覚句との並行を保った。
- source_word: οὐ μὴ ἴδητε
  choice: 決して見抜かない
  rationale: 同じ視覚領域の語彙を保ちながら、文脈上の内面的な認知を「見抜く」で表現した。単純な「見ない」も可能なので脚注に残した。
theological_decisions:
- issue: イザヤ書引用における外的な聴覚・視覚と内的理解の対比
  choice: 「聞く／悟る」「見る／見抜く」と訳す
  alternative: 最後も「見る」と訳して語彙反復を前面に出す
  rationale: 感覚的に接していながら意味を把握しないという緊張を示しつつ、原文の視覚語彙のつながりも「見る／見抜く」で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。預言的な集合表現として「この民」を維持し、強い否定は「決して」で統一した。脚注 b の対象箇所を示すため、本文の「見抜かない」に [b] を付す必要があるため、最終本文は「決して見抜かない。[b]」とするのが望ましい。
