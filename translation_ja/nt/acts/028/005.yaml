  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: ja
  text: そこでパウロは、その生き物[a]を火の中へ振り落として、何の害も受けなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その獣」または「その動物」とも訳せる。ギリシア語は一般的な語だが、文脈では蛇を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: そこでパウロは
  rationale: 定冠詞を代名詞的に取り、直前の文脈が指すパウロを日本語では明示した。μέν οὖνの穏やかな叙述の継続・移行は「そこで」で自然に表した。
- source_word: ἀποτινάξας
  choice: 振り落としたが
  rationale: 振り払って離す動作を自然な日本語で表した。分詞の動作は主動詞より先に起こるが、日本語では動作を順に並べることでその関係が明瞭になる。
- source_word: τὸ θηρίον
  choice: その生き物
  rationale: θηρίονはこの文脈では前節の蛇を指す一方、語自体はより一般的な動物・生き物を表すため、特定しすぎない訳語を採用した。定冠詞は既出の対象を示す「その」で表した。
- source_word: εἰς τὸ πῦρ
  choice: 火の中へ
  rationale: εἰςと対格が示す方向性を「へ」で表し、対象が火中へ落ちたことを明確にした。
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: 何の害も受けなかった
  rationale: πάσχωとοὐδὲν κακόνの組み合わせを、負傷や悪影響がなかったことを表す自然で簡潔な日本語にした。
