  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: ja
  text: パウロが枯れ枝をひと抱え集めて火にくべると、熱のために[a]一匹のまむしがはい出し、彼の手に取りついた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「熱から」。ここでは、火の熱がまむしのはい出した原因を表すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: または「彼の手にかみついた」。原語は広く「しっかりつかむ、取りつく」という意味で、かんだことを明示するとは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: 集めて
  rationale: 属格独立構文のアオリスト分詞で、パウロが燃料となる枝をひとまとめにした先行動作を表す。ここでは字義的な「より合わせる」より「集める」が文脈に合う。
- source_word: φρυγάνων τι πλῆθος
  choice: 枯れ枝をひと抱え
  rationale: φρύγανα は燃料にする乾いた小枝や柴を指し、τι πλῆθος は不特定のまとまった量を表す。「ひと抱え」は量のまとまりを自然な日本語で示す。
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: 火にくべると
  rationale: 燃料を火の上に置く動作を、現代日本語で自然な「火にくべる」とした。二つのアオリスト分詞に続く主節との時間的な流れも「と」で明確になる。
- source_word: ἔχιδνα
  choice: 一匹のまむし
  rationale: 一般的な蛇ではなく毒蛇の一種を指す語なので、日本語で具体的かつ通用する「まむし」とした。
- source_word: ἀπὸ τῆς θέρμης
  choice: 熱のために
  rationale: ἀπό は字義的には「熱から」とも訳せるが、ここでは熱が蛇の出てきた原因を表すと理解するのが自然である。原語の形を脚注に残した。
- source_word: ἐξελθοῦσα
  choice: はい出し
  rationale: 蛇が隠れていた枝などから外へ出る動きを自然に表す。アオリスト分詞の連続性は「出し」で主動詞につないだ。
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: 彼の手にかみついた
  rationale: καθάπτω は「取りつく、しっかりつかむ」を広く意味し、蛇については「かみつく」が文脈上自然。ただし動詞自体は咬傷を明示しないため、より形式的な訳を脚注に示した。
