  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: ja
  text: このことが起こった後、島にいたほかの病人たちもやって来て、癒やされた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: このことがあってから
  rationale: 属格絶対による時間的な移行を、直前の出来事を受ける自然な現代日本語で表した。δέは独立した逆接としてではなく、物語の展開に含めた。
- source_word: οἱ λοιποὶ οἱ ἐν τῇ νήσῳ
  choice: 島にいたほかの…人々
  rationale: 直前に癒やされた人物以外の、島にいる人々を指す関係を簡潔に保った。
- source_word: ἔχοντες ἀσθενείας
  choice: 病気を抱える人々
  rationale: 直訳的な「病気を持つ」の意味を保ちながら、現代日本語として自然な表現にした。複数形は日本語で不自然にならないよう集合的に表した。
- source_word: προσήρχοντο
  choice: やって来て
  rationale: 文脈上パウロのもとへ近づいて来たことを自然に表しつつ、原文に明示されない目的語「彼のもとに」は補わなかった。
- source_word: ἐθεραπεύοντο
  choice: 癒やされた
  rationale: 受動態を保持し、治療または超自然的な癒やしのどちらかに不必要に限定しない語を選んだ。
- source_word: καὶ
  choice: も
  rationale: 直前の癒やしに続いて島のほかの病人にも同じことが起きたという付加の意味を表した。
