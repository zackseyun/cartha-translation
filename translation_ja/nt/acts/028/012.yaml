lexical_decisions:
- source_word: καταχθέντες
  choice: 入港し
  rationale: 航海の文脈における κατάγω の分詞で、船が港に着くことを表す。「入港し」は海事的な意味を自然かつ簡潔に伝える。
- source_word: εἰς Συρακούσας
  choice: シラクサに
  rationale: εἰς は到着先を示す。日本語では港町への到着を「シラクサに入港する」と表すのが自然である。地名は一般的な日本語表記に従った。
- source_word: ἐπεμείναμεν
  choice: そこに…滞在した
  rationale: 「とどまる、滞在する」の意味。「そこに」は直前のシラクサを自然に受け、文脈上含意される場所を明確にする。
- source_word: ἡμέρας τρεῖς
  choice: 三日間
  rationale: 対格による時間の継続を、日本語で自然に「三日間」と表した。
