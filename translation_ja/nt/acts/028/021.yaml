  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: ja
  text: しかし彼らは彼に言った。「私たちは、あなたについてユダヤから何の手紙も受け取っていません。また、来た兄弟たち[a]のうち、だれ一人として、あなたについて悪いことを報告したり、悪く言ったりしていません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ユダヤから来たユダヤ人仲間を指す可能性がある。原文は、彼らがキリスト者であるかどうかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: すると彼らは彼に言った
  rationale: δέを、対話の応答を自然につなぐ「すると」とした。πρὸς αὐτόνは簡潔に「彼に」と訳し、原文にない固有名を補わなかった。
- source_word: Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: 私たちは、あなたについてユダヤから何の手紙も受け取っていません
  rationale: 強調されたἩμεῖςを「私たちは」と明示し、γράμματαは文脈上の書簡を指すため「手紙」とした。最初のοὔτεは日本語の自然な否定表現「何の…も…ない」で表した。
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: こちらに来た同胞のうち、だれ一人として
  rationale: παραγενόμενοςの到着の意味を「こちらに来た」で表した。ἀδελφοίはこの文脈では同じユダヤ人を指し得るため、キリスト者に限定して聞こえやすい「兄弟」より「同胞」を選び、その含意は脚注で示した。τιςは否定文中なので「だれ一人として」と自然に訳した。
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν
  choice: あなたについて何か悪いことを報告したり、話したりはしませんでした
  rationale: ἀπαγγέλλωとλαλέωの違いを「報告する」「話す」として残した。πονηρόνは中性単数で内容を指すため「何か悪いこと」とした。
theological_decisions:
- issue: τῶν ἀδελφῶνが指す人々
  choice: 本文では「同胞」とし、ユダヤ人の仲間を自然に指し得る表現にした
  alternative: 「兄弟たち」と訳し、キリスト者の兄弟を指す可能性を前面に出す
  rationale: 話者はローマのユダヤ人指導者であり、ユダヤから来た人々について述べている。原文は彼らをキリスト者と明示していないため、特定の宗教集団に限定せず、脚注で字義と曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法的・公的な応答にふさわしい落ち着いた語調を保った。「だれ一人として」と並列否定を用い、原文のοὔτε…οὔτεの構造を自然な日本語で再現した。
