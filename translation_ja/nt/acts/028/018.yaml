  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: ja
  text: 彼らは私を取り調べ、私に死刑に値する罪状がまったくなかった[a]ので、私を釈放しようとしました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私に死刑を科す根拠が何もなかったので」。
    reason: αἰτία θανάτουは、死刑に値する「罪状」とも、死刑を科すための法的「根拠」とも理解できる司法的表現である。
lexical_decisions:
- source_word: οἵτινες
  choice: 彼らは
  rationale: 前節に出るローマ人を受ける関係代名詞だが、日本語では文脈を自然につなぐ代名詞として表現した。ὅστιςの質的な含みはここでは強調しない。
- source_word: ἀνακρίναντές με
  choice: 私を取り調べた上で
  rationale: アオリスト分詞による主動詞に先立つ行為を示し、司法的な調査・審問の文脈も伝える。
- source_word: ἐβούλοντο ἀπολῦσαι
  choice: 釈放しようとしました
  rationale: 未完了過去の意向を自然な日本語で表し、ἀπολύωの拘禁から解放するという法的意味を「釈放」で明確にした。
- source_word: διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί
  choice: 私には死刑に当たる罪状が何もなかったので
  rationale: διάを伴う冠詞付き不定詞の理由を「ので」で示す。αἰτίαは司法的な「罪状」、θανάτουは死刑相当、ἐν ἐμοίは「私には」と訳し、法的根拠がないことを自然に表した。
theological_decisions: []
