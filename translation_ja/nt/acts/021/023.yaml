  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: ja
  text: だから、私たちが言うとおりにしてください。私たちのところには、誓願を立てている男性が四人います。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「誓願を持っている」。「誓願を立てている」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 前後の文脈からはナジル人に類する誓願が考えられるが、この節そのものは単に「誓願」とだけ述べている。
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν ποίησον
  choice: だから、…してください
  rationale: οὖνの推論的なつながりを「だから」で示し、τοῦτοの内容は後続の関係節に含めて、命令を自然で明瞭な日本語にした。
- source_word: ὅ σοι λέγομεν
  choice: 私たちが言うとおりに
  rationale: 直訳的な「私たちがあなたに言うことを」より自然で、命令の内容を示す関係節の働きを保つ。
- source_word: εἰσὶν ἡμῖν
  choice: 私たちのところには…います
  rationale: 存在文と与格を、単なる所有に限定せず、その共同体に属する者がいるという含みを持つ自然な日本語で表した。
- source_word: ἄνδρες τέσσαρες
  choice: 四人の人
  rationale: 文脈上は男性を指すが、日本語では「四人の人」が自然であり、人数と人物を明確に示す。
- source_word: εὐχὴν ἔχοντες ἀφ’ ἑαυτῶν
  choice: 自ら誓願を立てている
  rationale: 「誓願を持つ」という継続状態と、ἀφ’ ἑαυτῶνが示す本人たち自身に関わる意味を、過度に専門化せず自然に表した。
theological_decisions:
- issue: 誓願の種類
  choice: 本文では単に「誓願」とする
  alternative: 「ナジル人の誓願」と特定する
  rationale: 周辺文脈はナジル人に類する誓願を示唆し得るが、この節のεὐχή自体は種類を明示していないため、本文では一般的な表現を保った。
- issue: ἀφ’ ἑαυτῶνの解釈
  choice: 「自ら」と訳す
  alternative: 「自分たちの身に負っている」「自分たち自身のための」
  rationale: この句の細かな関係には解釈の余地があるため、本人たち自身に属する誓願であることを示しつつ、目的や儀礼上の仕組みを断定しない表現を選んだ。
translation_notes:
  register: 明瞭で現代的な標準語を用い、会議での直接的な勧告として丁寧な命令形にした。「誓願」は聖書的・宗教的文脈にふさわしい品位を保ちながら、特定の誓願制度を本文に持ち込まない語として採用した。
