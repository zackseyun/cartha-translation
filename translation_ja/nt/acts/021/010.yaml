  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: ja
  text: 私たちがそこに幾日も滞在している間に、ユダヤからアガボという預言者が下って来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: 私たちがそこに…滞在していると
  rationale: 現在分詞属格複数による属格独立構文で、時間的背景を示す。直前から続く「私たち」段落の文脈に従い、暗黙の主語を「私たち」とした。「滞在していると」は継続と、その間に次の出来事が起きたことを自然な日本語で表す。
- source_word: δὲ
  choice: …と
  rationale: δέの穏やかな談話上の移行は、属格独立構文の時間的関係と合わせて日本語の接続助詞「と」に織り込んだ。強い逆接にはしない。
- source_word: ἡμέρας πλείους
  choice: 幾日も
  rationale: 時間の幅を表す対格。πλείουςは比較級の形だが、ここでは一定の日数にわたる滞在を表す慣用的な用法と判断した。「幾日も」は日数を不必要に特定せず、継続の含みを保つ。
- source_word: κατῆλθέν
  choice: 下って来た
  rationale: κατέρχομαιの方向表現を保持した。ユダヤから海岸部のカイサリアへ向かう地理的・慣用的な「下る」と、語り手側への接近を示す「来た」を組み合わせた。
- source_word: τις
  choice: （不定冠詞に相当する無標の導入）
  rationale: 日本語には不定冠詞がないため、「アガボという預言者」と新しい人物を無標で導入し、τιςの不定性を自然に表した。「ある」を加えることも可能だが、やや文語的になるため避けた。
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: ユダヤから
  rationale: 起点を示すἀπόを簡潔に「から」と訳し、地名Ἰουδαίαには現代日本語の聖書用語として通用する「ユダヤ」を用いた。
- source_word: προφήτης
  choice: 預言者
  rationale: 人物の公に認識された役割を示す標準的な訳語。説明的な言い換えは必要ない。
- source_word: ὀνόματι Ἅγαβος
  choice: アガボという
  rationale: ὀνόματιを用いた「名を〜という」の慣用表現。現代日本語では「アガボという預言者」が自然で明瞭である。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔かつ品位ある調子にした。「下って来た」により原文の方向性を保ち、「幾日も」により滞在の継続を自然に表現した。注記を要する本文異読や神学的曖昧さは本節にはないため、脚注は付していない。
