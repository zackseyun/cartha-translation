source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: ja
  text: 翌日、私たちは出発してカイサリアに着いた。そして、七人[a]の一人である伝道者フィリポの家に入り、フィリポのもとに滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、以前エルサレムで奉仕のために選ばれた七人の一人（使徒言行録6:3–6参照）。
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: 翌日
  rationale: 物語の時間的な進行を、簡潔で自然な現代日本語で表す。δέは独立した接続語として強調せず、文脈の流れに含めた。
- source_word: ἐξελθόντες
  choice: 出発して
  rationale: 前の滞在地を離れて旅を続ける動作を自然に表し、後続の主動詞との順序も保つ。
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: カイサリアに着いた
  rationale: 目的地への到着を表す文脈なので、日本語では「来た」より「着いた」が視点に依存せず明瞭である。
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: 家に入り
  rationale: 原文の移動と行為の順序を保ちながら、自然な連用形で訳した。
- source_word: Φιλίππου τοῦ εὐαγγελιστοῦ
  choice: 伝道者フィリポ
  rationale: εὐαγγελιστήςの奉仕上の呼称を、現代日本語で通用する「伝道者」とした。固有名は一般的な聖書表記「フィリポ」を用いた。
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: 七人の一人である
  rationale: 使徒言行録6章の七人への歴史的な言及を保持しつつ、特定の教会職制名を付加しない。
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: 彼のもとに滞在した
  rationale: 旅の途上でフィリポの歓待を受けて泊まった意味を、過度に限定せず自然に表す。
theological_decisions:
- issue: 「七人」の位置づけ
  choice: 七人の一人である
  alternative: 七人の執事の一人である
  rationale: 本文は「七人」とのみ述べており、「執事」という後代の職制的理解を訳文に持ち込まない。使徒言行録6章との関連は脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。旅行記の簡潔な叙述を維持し、原文の一人称複数形を明示した。脚注記号は説明対象である「七人」の直後ではなく節末に置いたが、本文中に確実に表示している。
