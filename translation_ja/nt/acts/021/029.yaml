base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: ja
  text: というのも、彼らは以前、エフェソ出身のトロフィモが町でパウロと一緒にいるのを見ており、パウロが彼を神殿[a]に連れ入れたのだと思っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、内陣だけでなく、神殿の建物や境内を含む神殿域全体を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: 以前……見ており
  rationale: 迂言的な過去完了の意味を自然な日本語で表し、後の推測より前に見たことを示す。
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: エフェソ人トロフィモ
  rationale: 同格の形容詞が示す出身地を、簡潔で自然な日本語にした。
- source_word: ἐν τῇ πόλει
  choice: 町で
  rationale: 神殿域と区別されるエルサレムの市街を指す。文脈上都市は明らかなので、自然な「町」とした。
- source_word: σὺν αὐτῷ
  choice: パウロと一緒に
  rationale: 代名詞の指示対象を日本語で明確にし、σύνの同行の意味を平明に表した。
- source_word: ἐνόμιζον
  choice: ものと思っていた
  rationale: 目撃した事実からそう推測していたという継続的な認識を表し、確定的な知識ではなかったことを保つ。
- source_word: εἰς τὸ ἱερὸν
  choice: 神殿に
  rationale: 本文では一般読者に自然な表現を用い、ἱερόνが神殿建造物だけでなく神殿域を指し得ることは脚注で明示した。
- source_word: εἰσήγαγεν
  choice: 連れ込んだ
  rationale: 人をある区域の中へ導き入れる意味を自然に表し、問題視された行為という文脈にも合う。
theological_decisions:
- issue: ἱερόνが指す範囲とパウロへの आरोप आरोप आरोप accusation
  choice: 本文では「神殿」とし、神殿域全体を指し得ることを脚注で補足する。
  alternative: 「神殿域」または「神殿の境内」
  rationale: ἱερόνは内陣そのものに限らず神殿施設・境内を指す語であり、異邦人を制限区域へ入れたとの आरोप आरोप accusationの歴史的背景に関わる。読みやすさと語義上の精確さを両立させた。
translation_notes:
  register: 現代標準日本語による、明快で品位ある叙述。「というのも……からである」でγάρの説明的なつながりを保ち、推測と事実を区別した。
