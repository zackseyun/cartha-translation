  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: ja
  text: 私たちがこれらのことを聞いたとき、私たちも現地の人々も、パウロがエルサレムへ上らないようにと、彼に強く願い続けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「パウロがエルサレムへ上らないようにと、彼に懇願し続けた」。この動詞は、勧めることから切実に願うことまでを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: 私たちがこれらのことを聞くと
  rationale: ὡςは時間的状況を示し、δέは穏やかな話の進行を担う。ταῦταの複数性を「これらのこと」で保ち、直前の預言内容を指す表現とした。
- source_word: παρεκαλοῦμεν
  choice: 懇願した
  rationale: この文脈のπαρακαλέωは、単なる勧告よりも切実な願いを表す。「懇願した」は、パウロを引き止めようとする一同の強い訴えを自然な日本語で伝える。未完了過去の継続的な含みは文脈に委ねた。
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: 私たちもその土地の人々も
  rationale: 語り手側の一行と現地の人々という二つの集団がともに願ったことを、τε καὶに対応する「も……も」で表した。
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: 上って行かないよう、パウロに
  rationale: παρακαλέωに続く属格の冠詞付き不定詞を、願いの内容として自然な日本語にした。αὐτόνの指示対象は文脈上明白なパウロであり、日本語では代名詞より固有名のほうが明瞭である。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムへ
  rationale: 目的地を示すεἰςを自然な日本語の「へ」で訳した。
theological_decisions:
- issue: エルサレムへの移動を表す方向表現
  choice: エルサレムへ上って行く
  alternative: エルサレムへ行く
  rationale: 原文のἀναβαίνεινを保ち、エルサレムへの旅に用いられる「上る」という方向表現を反映した。地理的・慣用的表現であり、神学的意味を付加しない。
- issue: παρακαλέωの訴えの強さ
  choice: 懇願した
  alternative: 強く勧めた／願った
  rationale: 文脈では、アガボの預言を聞いた一同がパウロの旅を思いとどまらせようとしており、切実な願いが認められる。ただし動詞自体には「勧める」「願う」の幅があるため、脚注で代案を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい落ち着いた語調と、原文の方向表現「上る」を保った。脚注記号は該当文末に置いた。
