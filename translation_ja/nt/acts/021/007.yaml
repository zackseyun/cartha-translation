id: ACT.21.7
reference: Acts 21:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: ja
  text: 私たちは、ティルスからの航海を終えてプトレマイスに着き、兄弟たち[a]にあいさつをして、彼らのもとに一日滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兄弟姉妹たち」。ギリシア語は「兄弟たち」だが、この男性複数形は、より広く信者仲間を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: 私たちは
  rationale: 明示された代名詞により旅の一行を主語として示す。δέは叙述の移行・継続を表すが、日本語では文脈の流れに吸収し、不要な逆接を加えない。
- source_word: τὸν πλοῦν διανύσαντες
  choice: 航海を終えて
  rationale: διανύωの「完了する」とπλοῦςの「航海」を保ちつつ、分詞が示す先行動作を自然な現代日本語で表す。
- source_word: ἀπὸ Τύρου
  choice: ティルスからの
  rationale: ἀπόが示す出発点を直接表す。地名は現代日本語で明瞭な音写とした。
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: プトレマイスに着き
  rationale: 移動文脈におけるκαταντάωの「到着する」と、εἰςの目的地を自然に表現する。
- source_word: ἀσπασάμενοι
  choice: あいさつをして
  rationale: ἀσπάζομαιの通常の意味である「挨拶する」を採り、先行する動作として滑らかにつなぐ。
- source_word: τοὺς ἀδελφοὺς
  choice: 兄弟たち
  rationale: 男性複数形を本文で保持する。同時に、初期キリスト教共同体では男女を含む信者仲間を指し得るため、その語用上の幅を脚注で示す。
- source_word: ἐμείναμεν ἡμέραν μίαν
  choice: 一日滞在した
  rationale: μένωを旅行・宿泊の文脈に合う「滞在する」とし、時間の幅を表す対格ἡμέραν μίανを「一日」と訳す。
- source_word: παρ’ αὐτοῖς
  choice: 彼らのもとに
  rationale: παρά＋与格が表す、人々のところにいて共に過ごすという場所的・関係的意味を表す。
theological_decisions:
- issue: キリスト者共同体を指すἀδελφοὺςの訳
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性複数形を本文で明示的に保持しつつ、この語が文脈上、女性を含む信者仲間全般を指し得るという真正な意味範囲を脚注に残す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、旅行記としての簡潔な叙述と品位を保った。分詞の連続は「終えて」「あいさつをして」により時間的順序が分かる形にした。
