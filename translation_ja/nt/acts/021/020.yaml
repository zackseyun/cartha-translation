  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: ja
  text: 彼らはこれを聞くと、神をあがめ、パウロに言った。「ご覧なさい、兄弟よ。ユダヤ人の中に、信じた者が何万もいます[a]。皆、律法に熱心です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何万人も」とも訳せる。ギリシア語は一万の単位を表すことも、より一般的に非常に大勢を表すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞くと
  rationale: アオリスト分詞の時間的関係を自然な日本語で表し、目的語は直前の報告から「これ」と補った。
- source_word: ἐδόξαζον τὸν θεόν
  choice: 神をあがめ
  rationale: 神に栄光を帰すという δοξάζω の意味と宗教的な重みを、明瞭で自然な日本語にした。
- source_word: εἶπόν τε αὐτῷ
  choice: パウロに言った
  rationale: 代名詞 αὐτῷ の指示対象を文脈に即してパウロと明示し、τέ の接続を自然な叙述として表した。
- source_word: Θεωρεῖς
  choice: ご覧のとおり
  rationale: 目の前の明らかな状況へ注意を促す現在形の修辞的用法を自然に表した。
- source_word: ἀδελφέ
  choice: 兄弟よ
  rationale: 特定の男性であるパウロへの単数呼格を保持した。
- source_word: πόσαι μυριάδες
  choice: 幾万となく
  rationale: μυριάς が一万単位にも非常に多数という強調にもなり得ることを反映し、数を過度に限定しない自然な表現とした。
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: ユダヤ人の中には
  rationale: ここでは地理的なユダヤ地方の住民よりも、民族的・宗教的集団としてのユダヤ人を指す可能性が高い。
- source_word: τῶν πεπιστευκότων
  choice: 信じた者
  rationale: 完了分詞が示す、信仰に入って現在もその状態にある者たちを、簡潔な日本語で表した。
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: 皆が律法に熱心です
  rationale: ὑπάρχω の連結的機能と ζηλωτής の強い献身を自然に表し、νόμος は文脈上モーセの律法を指すため「律法」とした。
theological_decisions:
- issue: ἐν τοῖς Ἰουδαίοις の指示範囲
  choice: ユダヤ人の中には
  alternative: ユダヤ地方の人々の中には
  rationale: 文脈は、信じたユダヤ人がなおモーセの律法に熱心であることを扱っており、地理だけに限定しない民族的・宗教的意味が適切である。
- issue: μυριάδες の数量的な強さ
  choice: 幾万となく
  alternative: 何万人も／非常に大勢
  rationale: 原語は厳密な一万の複数単位とも、非常に多数という表現とも理解できる。「幾万となく」は大きな数の強調を保ちながら厳密な人数を断定しない。
- issue: τοῦ νόμου の指示対象
  choice: 律法
  alternative: モーセの律法／トーラー
  rationale: 文脈上モーセの律法を指すが、本文では簡潔な伝統的日本語「律法」で十分明瞭であり、宗派的な含意を加えない。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、使徒言行録の公的で品位ある叙述調を保った。「兄弟よ」は呼格を明示し、「幾万となく」で原語の誇張的にも厳密にも取り得る数量表現を保持した。
