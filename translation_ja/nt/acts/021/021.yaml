id: ACT.21.21
reference: Acts 21:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: ja
  text: ところが彼らは、あなたが異邦人の間にいるすべてのユダヤ人に、モーセから離れるように[a][b]教え、自分の子どもたちに割礼を施さず、慣習に従って生活しないようにと言っている、とあなたについて伝え聞いています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「モーセからの離反を教え」。ギリシア語は「離反、放棄」を意味する名詞アポスタシアを用いている。
    reason: lexical_alternative
  - marker: b
    text: ここで「モーセ」は、モーセの律法と祖先伝来のユダヤ人の生活慣習を代表している。
    reason: cultural_note
  - marker: c
    text: 「伝え聞いています」は、口頭で伝えられた情報を受け取っていることを表す。
    reason: lexical_note
lexical_decisions:
- source_word: κατηχήθησαν
  choice: 聞かされています
  rationale: ここでは受動形で、パウロについて一定の内容を伝えられていることを表す。現在も影響している報告として、自然な日本語にした。
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: モーセから離れるように
  rationale: ἀποστασίαは離反・放棄を意味する名詞だが、日本語では「離れるように」と動詞化することで、告発の意味を明瞭かつ自然に伝えられる。「モーセ」という原文の換喩は本文に残した。
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: 異邦人の間にいるすべてのユダヤ人
  rationale: 諸国民の間に離散して暮らすユダヤ人を指す。ἔθνηは使徒言行録の文脈に合わせて「異邦人」とした。
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: 子どもに割礼を施さず
  rationale: τὰ τέκναを原文どおり「子ども」とし、実際の対象を説明的に「息子」と狭めなかった。αὐτούςが示す所有関係は文脈上、日本語で明らかなため明示していない。
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: 慣習に従って生活することもない
  rationale: περιπατεῖνの生活・行動を表す比喩的用法を、現代日本語で自然な「生活する」とした。ἔθεσινは祖先伝来のユダヤ人の慣習を指す。
theological_decisions:
- issue: パウロがモーセに対する離反を教えているという告発の性格
  choice: 「モーセから離れるように教え」と、告発内容として訳す
  alternative: 「モーセへの背教を教え」または「モーセの律法を捨てるように教え」
  rationale: この節は人々がパウロについて聞かされていた内容を報告しており、その告発が事実だと本文自体が断定しているわけではない。「律法」と補わず原文の「モーセ」を保ち、神学的な結論を先取りしない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、告発としての重みを保った。「背教」のような専門的・神学的に限定されやすい語は本文で避け、注で原語の名詞性と語義を示した。
