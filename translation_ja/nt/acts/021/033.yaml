source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: ja
  text: そこで千人隊長[a]は近寄ってパウロを捕らえ、二本の鎖[b]でパウロを縛るよう命じた。そして、パウロが何者で、何をしたのかと尋ねていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「千人隊長」はローマ軍の軍事指揮官を指す。原語は字義的には「千人の指揮官」。
    reason: lexical_alternative
  - marker: b
    text: 「二本の鎖」は、パウロがエルサレムで縛られるという使徒21:11の預言を想起させている可能性がある。
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍の歩兵大隊を指揮する高級将校を表す。原語の字義を保ちつつ、使徒言行録の文脈で軍の指揮官であることが伝わる訳語とした。
- source_word: ἐγγίσας
  choice: 近寄って
  rationale: 主動作に先立って接近したことを示すアオリスト分詞を、自然な日本語の連用表現で示した。
- source_word: ἐπελάβετο αὐτοῦ
  choice: パウロを捕らえ
  rationale: 身柄を物理的に押さえる逮捕の文脈を明確に表した。代名詞は、日本語で指示対象が曖昧にならないよう固有名詞で示した。
- source_word: ἐκέλευσε δεθῆναι
  choice: 縛るよう命じた
  rationale: 権威ある命令と、パウロが拘束される受動的な内容の双方を自然な日本語で表した。
- source_word: ἁλύσεσι δυσί
  choice: 二本の鎖
  rationale: 拘束に用いる鎖を意味する語を直接的に訳し、数詞「二」を保持した。
- source_word: ἐπυνθάνετο
  choice: 尋ねていた
  rationale: 未完了過去が示す進行中または反復的な問いただしを「ていた」で保持した。
- source_word: τίς εἴη
  choice: 何者で
  rationale: 過去時制の発話に従う間接疑問の希求法を、日本語として自然な間接疑問にした。
- source_word: τί ἐστιν πεποιηκώς
  choice: 何をしたのか
  rationale: 完了した行為とその時点で残る関係を示す迂言的完了を、文脈に即した自然な日本語で表した。
theological_decisions:
- issue: 「二本の鎖」と直前の預言（使徒21:11）との関係
  choice: 本文では単に「二本の鎖」と訳し、関連の可能性は脚注にとどめる
  alternative: 本文で預言の成就であると明示する
  rationale: 本文自体は二本の鎖を報告するだけで、著者がここで明示的に預言への照応を述べてはいないため、可能な響きを断定しない。
translation_notes:
  register: 明瞭で現代的な叙事文としつつ、軍の官職名には本文の歴史的背景を保てる「千人隊長」を採用した。二度の代名詞は指示対象の混同を避けるため「パウロ」と明示した。
