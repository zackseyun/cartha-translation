id: ACT.21.38
reference: Acts 21:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: ja
  text: 「では、あなたは、少し前に反乱を起こし、四千人の暗殺者たち[a]を荒れ野へ連れ出した、あのエジプト人ではないのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「短剣を持つ者たち」。ギリシア語では「シカリ派の者たち」で、短剣を隠し持って襲撃することで知られた集団。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: では、…ではないのか
  rationale: 相手がギリシア語を話したことから千人隊長が推論し、驚きを込めて確認する否定疑問文として自然に表した。
- source_word: ὁ Αἰγύπτιος
  choice: あのエジプト人
  rationale: 定冠詞が、話者に知られた特定の人物を指すため、「あの」によって既知で悪名高い人物という含みを伝えた。
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: 少し前に
  rationale: 直訳的な「これらの日々より前」ではなく、近い過去を示す慣用的な意味を明瞭な現代日本語で表した。
- source_word: ἀναστατώσας
  choice: 反乱を起こし
  rationale: 政治的・社会的騒乱という文脈に即し、単なる混乱ではなく蜂起を引き起こした意味を簡潔に示した。
- source_word: ἐξαγαγὼν
  choice: 連れ出した
  rationale: 一団を率いてある場所から荒れ野へ移動させたことを自然な日本語で表した。
- source_word: εἰς τὴν ἔρημον
  choice: 荒れ野へ
  rationale: 砂漠に限定されない無人の荒涼地を表し、聖書文体にもなじむ語を選んだ。
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: 四千人の…たち
  rationale: 定冠詞のある特定の集団を日本語では文脈と語順によって自然に表し、人数を明示した。
- source_word: τῶν σικαρίων
  choice: 暗殺者たち
  rationale: 短剣を隠し持って襲撃した集団を現代の一般読者に直ちに理解できる語で示し、歴史的名称と字義は脚注に残した。
