  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: ja
  text: 町全体が騒然となり、民衆が一斉に駆け集まった[a]。人々はパウロを捕らえ、神殿の境内[b]の外へ引きずり出した。すると、門[c]はすぐに閉じられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民衆が一斉に押し寄せた」。原文は、人々が急に一か所へ集まる様子を表す。
    reason: lexical_alternative
  - marker: b
    text: ここで「神殿」と訳される語は、内陣だけでなく、庭を含む神殿の境内全体を指す。
    reason: cultural_note
  - marker: c
    text: 直訳「扉」。この文脈では、神殿境内への出入口の「門」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη τε ἡ πόλις ὅλη
  choice: すると、町全体が騒然となり
  rationale: κινέωの受動形を都市全体の動揺・騒乱を表す慣用的な用法として取り、自然な現代日本語で表現した。τεは物語の連続を示す「すると」に吸収した。
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: 民衆が一斉に駆け集まった
  rationale: συνδρομήが表す、人々が急に一か所へ殺到する動きを明確に伝える。単なる群衆の形成より、語の動的な意味を保つ。
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: 人々はパウロを捕らえて
  rationale: ἐπιλαμβάνομαιの物理的かつ強制的な把握を「捕らえる」で表し、分詞の先行・付帯状況を「て」で自然につないだ。
- source_word: εἷλκον αὐτὸν
  choice: 外へ引きずり出した
  rationale: ἕλκωの強制的に引く意味を「引きずり出す」で表した。未完了過去の進行性は日本語では文脈上十分に伝わり、ここで「引きずっていた」とすると場面の進展が不自然になるため完結的に訳した。
- source_word: ἔξω τοῦ ἱεροῦ
  choice: 神殿の境内から外へ
  rationale: ἱερόνは内陣だけでなく神殿の建物・庭を含む境内全体を指すため、「神殿」だけより範囲を正確に示す「神殿の境内」とした。
- source_word: εὐθέως
  choice: すぐに
  rationale: 即時性を明快で自然な現代日本語によって表した。
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: 門はすぐに閉じられた
  rationale: θύραιは字義的には扉だが、この神殿境内への出入口という文脈では「門」が自然である。受動態は行為者を補わず「閉じられた」として保持した。
