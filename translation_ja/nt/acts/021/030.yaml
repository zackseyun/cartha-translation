  rationale: 冒頭の接続語を省き、原文の穏やかな叙述的連結を自然な日本語で表した。「神殿の境内の外へ」として原文の「神殿の外へ」を明確に反映した。脚注cは、門という訳語を支える語義上の代替説明に整え、特定の歴史的解釈を断定しない表現に改めた。
