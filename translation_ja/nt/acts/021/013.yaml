id: ACT.21.13
reference: Acts 21:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: ja
  text: そこでパウロは答えた。「あなたがたは、泣いて私の心を打ち砕いて、何をしているのですか。[a] 私は、主イエスの御名のために、エルサレムで縛られることだけでなく、死ぬことさえも覚悟しています。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心を打ち砕く」と訳したギリシア語は、単に悲しませる以上に、内面を砕くほどの強い苦しみを表します。
    reason: lexical_alternative
  - marker: b
    text: 「御名」は、主イエスご自身だけでなく、その権威や、イエスと結びついた働きを指す聖書的な表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: そこでパウロは答えた
  rationale: τότεの場面展開を自然な日本語の「そこで」で示し、ἀπεκρίθηは標準的な発話導入の「答えた」とした。
- source_word: Τί ποιεῖτε
  choice: なぜ…するのですか
  rationale: 直訳的には「何をしているのですか」だが、後続する分詞と結びついた抗議の問いとして、日本語では「なぜ…するのですか」が自然である。
- source_word: κλαίοντες
  choice: 泣いて
  rationale: 継続的な行為を自然な現代日本語で表し、場面の感情的な重みも保つ。
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: 私の心を打ち砕こうとする
  rationale: συνθρύπτωの強い破砕の比喩を「打ち砕く」で保持した。文脈上、彼らの意図というより行為の効果を表すため、「しようとする」は日本語の自然さのための表現であり、脚注で補う。
- source_word: δεθῆναι
  choice: 縛られる
  rationale: 受動不定詞の基本義を保ち、「投獄される」と狭く解釈しない。
- source_word: ἀποθανεῖν
  choice: 死ぬ
  rationale: 基本義を簡潔に表す。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムで
  rationale: 受難が起こる場所を示す文脈では、日本語の「で」が自然であり、行き先としての不自然な「へ」を避ける。
- source_word: ἑτοίμως ἔχω
  choice: 覚悟しています
  rationale: 単なる準備状態を超えて、拘束と死を受け入れる決意を示す文脈に自然な表現。基本的な「用意ができています」より格調と感情的強さを保つ。
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: 御名のためなら
  rationale: ὑπέρの目的・献身の意味を「ため」で示し、「名」という聖書的換喩を「御名」として保持する。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエス
  rationale: κύριοςをキリスト論的称号として「主」と訳し、弱めたり説明的に言い換えたりしない。
theological_decisions:
- issue: イエスに対するκύριοςの訳語
  choice: 主イエス
  alternative: 師イエス
  rationale: ここでκύριοςはイエスの称号であり、標準的かつ神学的重みを保つ「主」が適切である。
- issue: 「御名」という換喩の保持
  choice: 主イエスの御名のため
  alternative: 主イエスご自身のため
  rationale: 原文はイエスの人格、権威、彼と結びつく働きを含み得る「名」という聖書的表現を用いるため、その幅を説明的な一義に狭めない。
- issue: パウロの準備・決意の強さ
  choice: 覚悟しています
  alternative: 用意ができています
  rationale: ἑτοίμως ἔχωは準備が整っていることを表すが、死をも受け入れる発言では日本語の「覚悟」が文脈的な力を適切に伝える。ただし殉教願望までは付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、パウロの厳粛な決意と「御名」の聖書的な響きを保持した。「打ち砕く」は原文の強い比喩を残し、全体は朗読にも適する自然で dignified な調子とした。
