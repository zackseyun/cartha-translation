id: ACT.21.26
reference: Acts 21:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: ja
  text: そこでパウロはその人たちを連れて、翌日、彼らと共に身を清め、神殿の境内[a]に入った。そして、清めの期間が満了すること、すなわち彼ら一人一人のために供え物が献げられる時までであることを届け出た。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」とも訳せる。ギリシア語は内陣だけでなく、神殿の境内を含む施設全体を指す。
    reason: lexical_clarification
  - marker: b
    text: 直訳に近くは「清めの日々の満了を届け出た。そのことは、彼ら一人一人のために供え物が献げられる時までであった」。ギリシア語の「時まで」が「満了」または「届け出た」という行為のどちらに主に関わるかには、構文上の含みがある。
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: その人たちを連れ
  rationale: παραλαμβάνωの同行させる意味を自然な日本語で表し、直前の文脈で特定される男性たちを指すことを示す。
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: 翌日
  rationale: 直後の日を表す慣用的な時の表現として簡潔で自然。
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: 彼らとともに身を清めてから
  rationale: 儀礼的な清めであることを保ちつつ、ἁγνισθείςの受動形が文脈上パウロ自身の清めへの参加を表すことを自然に訳す。
- source_word: εἰσῄει
  choice: 入った
  rationale: 未完了過去の背景的・進行的な相を日本語で不自然に強調せず、後続する分詞の行為を伴う出来事として明瞭に表す。反復的に出入りしたとまでは本文から確定できない。
- source_word: τὸ ἱερόν
  choice: 神殿の境内
  rationale: ἱερόνは内陣だけでなく神殿複合施設を指すため、「神殿」単独より範囲を明確にする。
- source_word: διαγγέλλων
  choice: 届け出た
  rationale: 神殿で清めの日程を正式に知らせる手続き的な文脈に合い、単なる一般的な『告げた』より具体的。
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: 清めの期間が満了する日
  rationale: 直訳的な『清めの日々の満了』を、期間の終点を示す自然な現代日本語にする。
- source_word: ἕως οὗ προσηνέχθη
  choice: 供え物が献げられる時までの
  rationale: ἕως οὗを清め期間の終点と結びつけ、προσφέρωの祭儀的な受動を「献げられる」と表す。ギリシア語構文の解釈上の難しさは脚注で示す。
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: 彼ら一人一人のために
  rationale: ὑπέρの代理・利益の関係と、各人ごとであることを明瞭に保つ。
- source_word: ἡ προσφορά
  choice: 供え物
  rationale: 特定の種類のいけにえに限定しない一般的な祭儀用語として訳す。
theological_decisions:
- issue: パウロの神殿儀礼への参加の神学的評価
  choice: ユダヤ人の清めの手続きに参加した出来事として、そのまま叙述する。
  alternative: この行為がキリスト者にとって神殿儀礼の継続的有効性を肯定または否定するものと訳文で示す。
  rationale: この節は行為を叙述するだけで、その広い神学的評価を明言していないため、特定の教派的結論を持ち込まない。
- issue: ἕως οὗ以下と『満了』の統語的関係
  choice: 各人の供え物が献げられる時を清め期間の終点として読む。
  alternative: パウロが、清めの期間の満了と、各人の供え物が献げられる時とを別々に届け出たと読む。
  rationale: ギリシア語は圧縮されており関係に一定の曖昧さがある。本文では自然な主要解釈を採り、別解を脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、神殿儀礼の場面にふさわしい品位を保った。「身を清める」「供え物を献げる」「届け出る」により、祭儀性と手続き性を自然に伝える。
