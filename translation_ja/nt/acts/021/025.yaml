id: ACT.21.25
reference: Acts 21:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: ja
  text: 信仰に入った異邦人については、偶像にささげたもの、血、絞め殺したもの、性的な不道徳を避けるようにと決定し、私たちは知らせを送りました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν
  choice: 信仰に入った異邦人については
  rationale: πεπιστευκότωνの完了形が示す、信仰に至って現在もその状態にある人々という含みを、自然な現代日本語で表した。δέは話題の転換と緩やかな対比を「については」で示した。
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: 私たちは……書き送りました
  rationale: 明示されたἡμεῖςを訳出する。ἀπεστείλαμενの目的語は原文では省略されているが、使徒15章の書面を指す文脈が明白なため、「手紙」という名詞を補わず、自然な「書き送る」で伝達行為を表した。
- source_word: κρίναντες
  choice: 決定して
  rationale: 協議の末になされた正式な判断を表す。分詞の主動詞に先立つ意味関係を、日本語では順接によって自然に示した。
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: 避けるように
  rationale: 自らを守って遠ざけるという再帰的な含みを、列挙された禁止事項に適した簡潔な日本語で表した。
- source_word: τό τε εἰδωλόθυτον
  choice: 偶像に献げたもの
  rationale: 偶像への供犠に関係する食物を指すが、原文同様に「食物」や「肉」へ限定しすぎない表現とした。
- source_word: αἷμα
  choice: 血
  rationale: 原文の簡潔な語をそのまま保ち、本文中で摂取に限定する説明を加えなかった。
- source_word: πνικτόν
  choice: 絞め殺したもの
  rationale: 血抜きせず窒息させて殺した動物を指す語を、列挙の並行性を保って訳した。
- source_word: πορνείαν
  choice: 性的不品行
  rationale: 不適切な性行為を広く指す語であり、婚前性交など一種類に狭めず、現代日本語で品位を保つ表現とした。
theological_decisions:
- issue: 使徒会議による禁止事項の性格と適用期間
  choice: 四つの禁止事項を本文どおり率直に列挙し、その理由や適用期間を限定しない。
  alternative: 一時的な食卓交わりのための配慮、または永続的で普遍的な規定のいずれかとして明示する。
  rationale: この節自体は以前の決定内容を報告するだけで、その神学的根拠や継続期間を説明していないため、特定の教派的解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的ながら、使徒会議の正式な決定を伝える場面にふさわしい品位を保った。「書き送りました」は文脈上の書面を自然に示しつつ、原文にない「手紙」を明示的に補わない表現である。
