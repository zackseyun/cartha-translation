base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: ja
  text: 千人隊長の許可を得ると、パウロは階段の上に立ち、民に向かって手で合図をした。すっかり静かになると、彼はヘブライ語[a]で彼らにこう語りかけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: アラム語とも考えられる。ギリシア語原文は「ヘブライの言語（方言）で」と述べているが、この文脈では、一般にアラム語と呼ばれる当地方のセム系言語を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: そこで、千人隊長が許可すると
  rationale: 属格絶対構文の主語は直前の文脈にいる千人隊長である。日本語では主語を明示し、時間的なつながりを「許可すると」で自然に表した。
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: 階段の上に立ち
  rationale: 完了分詞が表すパウロの位置を簡潔に描写した。ἀναβαθμοίは兵営へ通じる階段を指す。
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: 民に向かって手で合図をした
  rationale: κατασείωは、群衆を静めたり発言を始めたりするための手振りを表す。「民」はλαόςの語義を保ち、「手で合図」によって動作を明確にした。
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: すっかり静かになると
  rationale: 静けさが生じたことを表す属格絶対構文を、現代日本語として自然に表現した。πολλῆςの強意は「すっかり」で伝えた。
- source_word: προσεφώνησεν
  choice: 彼らに語りかけた
  rationale: 公に聴衆へ呼びかける意味を、硬すぎず品位のある日本語で表した。目的語は文脈上の民を受けて「彼ら」とした。
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: ヘブライ語で
  rationale: 原文の表現を本文に保持した。この語が当時のアラム語を指す可能性は脚注で示し、本文で一方に決めなかった。
- source_word: λέγων
  choice: 語りかけた。
  rationale: 次節から始まる直接話法を導く分詞。日本語では節末の「語りかけた」に統合し、引用内容が次節へ続くことを自然に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙述の品位を保った。「民」は原語λαόςに対応させ、「群衆」よりも原文に近い語を選んだ。原文末のλέγωνは次節の発言を導くため、日本語では「語りかけた」で文を結んだ。
