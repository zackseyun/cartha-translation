source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: ja
  text: 翌日、パウロは私たちと一緒にヤコブのもとへ入って行った。長老たちは皆、そこにいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「長老たちは皆、やって来た」または「長老たちは皆、集まった」とも訳せる。ギリシア語の動詞は、到着にもその場にいることにも重点を置きうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: 翌日
  rationale: 「次の／続く日」を表す慣用的な時の表現。現代日本語では「翌日」が簡潔で自然である。δέはここでは場面の推移を示すため、独立した接続語を置かなくても文脈上十分に伝わる。
- source_word: εἰσῄει
  choice: 行った
  rationale: 内へ向かう動きを表すが、πρὸς Ἰάκωβονと結び付くこの訪問場面では「ヤコブのところへ行った」が自然であり、単に「訪ねた」として目的を明示しすぎることも避けられる。
- source_word: σὺν ἡμῖν
  choice: 私たちと一緒に
  rationale: 同行を明確に表す。日本語では「私たちと」だけより「一緒に」を添えるほうが自然である。
- source_word: πρὸς Ἰάκωβον
  choice: ヤコブのところへ
  rationale: 人を目指す移動を自然な日本語で表す。「ヤコブを訪ねて」では、原文に明記されない訪問目的をやや強く補うため避けた。
- source_word: πάντες τε
  choice: 長老たちも皆
  rationale: τέの穏やかな連結を「も」で表し、πάντεςの全体性を「皆」で保持した。
- source_word: παρεγένοντο
  choice: そこに来ていた
  rationale: 動詞が持つ「到着した」と「その場にいた」の両面を日本語で自然に保つ。完了した到来の結果としての在席を示し、純粋な状態表現に限定しない。
- source_word: οἱ πρεσβύτεροι
  choice: 長老たち
  rationale: エルサレム教会の公認された指導者を指すが、後代の特定教派の職制を持ち込まず、語の一般的な教会的意味を保つ。
theological_decisions:
- issue: Ἰάκωβονの人物同定と役割
  choice: 本文では単に「ヤコブ」とする。
  alternative: 「主の兄弟ヤコブ」または「エルサレム教会の指導者ヤコブ」と補う。
  rationale: 文脈上はエルサレム教会の指導者ヤコブと考えられるが、この節自体は説明を加えていないため、本文に人物同定や肩書を補わない。
- issue: οἱ πρεσβύτεροιの教会職としての意味
  choice: 「長老たち」と訳し、特定の教派的職制には限定しない。
  alternative: 「司祭たち」「教会指導者たち」と訳す。
  rationale: 語は教会の公認された指導者を指すが、「長老たち」が原語の意味を透明に保ち、後代の制度や特定教派の理解を持ち込まない。
- issue: παρεγένοντοの到着と在席の含意
  choice: 「そこに来ていた」とし、到着とその結果としての在席をともに含ませる。
  alternative: 「そこにいた」または「やって来た」と一方に絞る。
  rationale: 原語は到来にも在席にも焦点を置き得るため、どちらかだけに限定せず、自然な日本語で意味の幅を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「私たち」は使徒言行録の一人称複数の語りをそのまま保つ。日本語として不自然な「中へ入った」は避け、人物を訪れる場面に即して「ヤコブのところへ行った」とした。
