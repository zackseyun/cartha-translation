id: ACT.21.28
reference: Acts 21:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: ja
  text: 彼らは叫んだ。「イスラエルの皆さん、助けてください！ この男は、民と律法とこの場所に反対することを、至る所で、すべての人に教えている者です。そのうえ、ギリシア人を神殿区域[a]にまで連れ込み、この聖なる場所を汚しました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿区域」と訳したギリシア語ἱερόνは、内なる聖所だけでなく、庭を含む神殿区域全体を指します。
    reason: ἱερόνが神殿複合区域を指すこと、および内なる聖所を指すναόςとの語彙上の区別を明確にするため。
lexical_decisions:
- source_word: κράζοντες
  choice: 彼らは叫んだ
  rationale: 現在分詞が告発の仕方を示す。日本語では主文に続けて「叫んだ」とすることで、公然とした切迫した叫びを自然に表した。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: イスラエルの皆さん
  rationale: 男性への呼びかけだが、直訳的な「イスラエルの男たち」は現代日本語では不自然である。対象を曖昧にせず、群衆への公的な呼びかけとして自然にした。
- source_word: βοηθεῖτε
  choice: 助けてください！
  rationale: 目的語を補わず、命令形の切迫感を保った。
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: この男は…者です
  rationale: 人物を指し示す強い告発の調子を、日本語の係り受けに合う形で保持した。
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: 私たちの民と律法とこの場所に逆らうことを
  rationale: κατά＋属格の対立・敵対の意味を「逆らう」で表した。「民」は文脈上イスラエルの民を指すため、告発者の視点を明確にする「私たちの」を補った。νόμοςはこの文脈ではモーセの律法を指す。
- source_word: πάντας πανταχῇ διδάσκων
  choice: 至る所で、すべての人に…教えている
  rationale: πάνταςとπανταχῇの双方の包括性を保ち、自然な日本語の語順にした。
- source_word: ἔτι τε καὶ
  choice: そのうえ…まで
  rationale: さらなる重大な आरोपを加える累加・強調の働きを表した。
- source_word: Ἕλληνας
  choice: ギリシア人たち
  rationale: より広い「異邦人」ではなく、原文の具体的な民族呼称を保持した。
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: 神殿の境内にまで連れ込み
  rationale: ἱερόνは内陣だけでなく神殿複合区域を指すため、「神殿の境内」とした。εἰσήγαγενの使役を加えない「連れ込み」が自然である。
- source_word: κεκοίνωκεν
  choice: 汚しました
  rationale: 祭儀的文脈で「俗なもの・汚れたものにする」を意味する。現代日本語で明瞭な「汚す」を採用した。
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: この聖なる場所
  rationale: 指示語と祭儀的な聖性をともに保持した。
theological_decisions:
- issue: τοῦ νόμουの指示対象
  choice: 律法
  alternative: おきて／法
  rationale: エルサレム神殿をめぐる文脈では、一般的な法ではなくユダヤ人の律法、特にモーセの律法を指す。「律法」は日本語聖書で定着し、ここでも明確である。
- issue: ἱερόνの範囲
  choice: 本文を「神殿の境内」とし、注で神殿区域全体を指し得ることを明示
  alternative: 神殿
  rationale: ναόςとの区別を保ち、ギリシア人立ち入りの告発が神殿区域に関するものだったことを歴史的・語彙的に明確にした。
- issue: 告発内容の真偽
  choice: 告発者の主張としてそのまま訳す
  alternative: 誤った告発であることを本文で示す
  rationale: この節は群衆の告発を報告しており、語り手による評価を本文へ付加すべきではない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、公的な告発の切迫感と聖なる場所をめぐる厳粛さを保った。「イスラエルの皆さん」は、男性複数への呼びかけを日本語として自然に表す。本文の脚注記号[a]は「神殿」に付した。
