source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: ja
  text: 私たちは彼らから引き離されるようにして別れ、船出した後、まっすぐ航行してコスに着き、翌日にはロドスに、そこからパタラに着いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: そして
  rationale: この構文は次の出来事への時間的・叙事的移行を示す。日本語では後続する完了的な別離と船出を順に述べることで時間関係が明らかなため、簡潔な「そして」とした。
- source_word: ἀναχθῆναι
  choice: 船出した
  rationale: 航海用語として「沖へ出る、出帆する」を意味する。現代日本語で自然かつ明瞭な「船出した」とした。
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: 彼らを振り切るようにして別れ
  rationale: ἀποσπάω が持つ「引き離す、引きちぎる」という強さと、別れのつらさを保ちつつ、日本語として自然に表現した。受動・再帰の形を過度に限定しないよう「振り切るようにして」とした。
- source_word: εὐθυδρομήσαντες
  choice: まっすぐ航行して
  rationale: 直進する航路を取るという航海上の意味を、自然で品位ある現代日本語にした。
- source_word: ἤλθομεν εἰς
  choice: 着き／向かった
  rationale: 旅程の文脈に応じ、最初の目的地には「着き」、後続の省略された動詞を補う箇所では「向かった」として自然な流れを作った。
- source_word: Κῶ
  choice: コス
  rationale: ギリシア語 Κῶς の現代日本語で一般的な地名表記。
- source_word: τῇ δὲ ἑξῆς
  choice: 翌日には
  rationale: 「その次の日に」を意味する時間表現を、簡潔で自然な日本語にした。
- source_word: Ῥόδον
  choice: ロドス
  rationale: ギリシア語地名の日本語で一般的な音写。
- source_word: κἀκεῖθεν
  choice: そこから
  rationale: καί と ἐκεῖθεν の結合が示す旅程の連続を自然に表した。
- source_word: Πάταρα
  choice: パタラ
  rationale: ギリシア語地名の標準的な日本語音写。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、旅程の簡潔さと航海描写を保った。「振り切るようにして」により、直前の人々との別離が容易でなかったという原文の強い語感を伝えた。
