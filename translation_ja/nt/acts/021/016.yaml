  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: ja
  text: カイサリアから来た弟子たちの何人かも、私たちと一緒に行き、私たちが泊まることになっていた、キプロス出身のムナソンという人のもとへ案内してくれた。[a] ムナソンは初期からの弟子であった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちを、泊まることになっていたムナソンのもとへ連れて行った」。または「私たちをムナソンの家へ案内した」。ギリシア語の分詞と宿泊を表す動詞の係り方には、互いに近い意味の中で多少異なる理解が可能である。
    reason: lexical_alternative
  - marker: b
    text: 別訳「古くからの弟子」または「長年の弟子」。ムナソンがこの運動の初期から弟子であったこと、あるいは弟子として長い年月を過ごしていたことを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν
  choice: カイサリアの弟子たちも何人か、私たちと一緒に来た
  rationale: 属格の部分表現を「何人か」で明示し、συνῆλθον と σὺν ἡμῖν が表す旅への同行を自然な日本語にした。
- source_word: ἄγοντες
  choice: 案内してくれた
  rationale: 目的地である宿泊先へ一行を連れて行く文脈を表す。分詞は前文に続く独立文として処理し、日本語として読みやすくした。
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: 私たちが泊まることになっていた……のもとへ
  rationale: ξενίζω の客として宿泊する意味と、接続法が示す予定・目的を自然に表現した。「もと」はムナソン本人またはその家での滞在を過度に限定しない。
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: キプロス出身のムナソンという人
  rationale: τινι による初出人物の導入を「という人」で表し、Κυπρίῳ は明瞭な現代日本語の「キプロス出身」とした。
- source_word: ἀρχαίῳ μαθητῇ
  choice: 初期からの弟子
  rationale: 運動の早い時期からの弟子とも、長年の弟子とも理解できる時間的含意を保ち、「最初の弟子」のような過剰な歴史的断定を避けた。
theological_decisions:
- issue: ἀρχαίῳ μαθητῇ の時間的意味
  choice: 初期からの弟子
  alternative: 古くからの弟子／長年の弟子
  rationale: 初期の時代に弟子となった可能性と、弟子歴が長いという含みの双方をある程度保つ。「最初期の弟子」と断定しない。
- issue: παρ’ ᾧ ξενισθῶμεν と ἄγοντες の構文関係
  choice: 泊まることになっていたムナソンのもとへ案内した
  alternative: ムナソンを連れて来た／ムナソンの家へ連れて行った
  rationale: 主要な構文理解に従いつつ、ギリシア語が許す密接に関連した解釈の幅は脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、旅の叙述にふさわしい落ち着いた文体とした。長い修飾連鎖を避けるため二文に分け、原文の情報関係は維持した。
