id: ACT.21.5
reference: Acts 21:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: ja
  text: その滞在の日々を終える時になると、私たちはそこを出て、旅を続けた。皆が妻や子どもたちと一緒に、町の外まで私たちを見送った[a]。そして私たちは浜辺[b]にひざまずいて祈った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見送るために付き添った」とも訳せる。ギリシア語の動詞は、旅立つ人を送り出すため途中まで同行することを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「岸辺」または「海辺」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: その滞在の日々を終える時になると
  rationale: ἐγένετο＋不定詞が示す時の到来と、ἐξαρτίζωの「完了する」という意味を保った。「滞在」は直前の文脈から補い、「その日々」が滞在期間を指すことを自然な日本語で明確にした。
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: 私たちはそこを出て、旅を続けた
  rationale: 出発を表す分詞と、継続的な移動を表す未完了過去の双方を、自然な叙述として訳した。
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: 皆が……私たちを見送った
  rationale: προπέμπωは、旅立つ人に別れを告げるため途中まで同行することを表し得る。文脈に即した簡潔で自然な日本語として「見送った」を採用し、同行の含意は脚注に示した。
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: 妻や子どもたちと一緒に
  rationale: πάντωνが男性複数形であり、信者たちが家族を伴って見送る場面なので、γυναιξίは「女性たち」より「妻たち」の意味が自然である。日本語では個々の妻を表すため単数形の「妻」を用いた。
- source_word: ἕως ἔξω τῆς πόλεως
  choice: 町の外まで
  rationale: 町の境界を越えた地点まで同行したという方向と到達範囲を、簡潔かつ正確に表した。
- source_word: θέντες τὰ γόνατα
  choice: ひざまずいて
  rationale: 字義的には「ひざを置いて」だが、祈る姿勢を表す慣用句なので、現代日本語の自然な表現とした。
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: 浜辺に
  rationale: αἰγιαλόςは海辺の浜または岸を指す。「浜辺」は明瞭で場面に適し、可能な別訳を脚注に示した。
- source_word: προσευξάμενοι
  choice: 祈った
  rationale: 一人称複数の旅程記事に合わせて主語を「私たち」とし、先行する分詞の動作を日本語では主節として自然に表した。
theological_decisions: []
