  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: ja
  text: 人々がパウロを殺そうとしていたその時、エルサレム全体が混乱に陥っているとの報告が、部隊の千人隊長[a]のもとに届いた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「千人隊長」は、ローマ軍の部隊（コホルス）を指揮する将校、トリブヌスに相当する。
    reason: cultural_note
  - marker: b
    text: 「届いた」は、直訳では「上って行った」。
    reason: translation_note
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: 人々がパウロを殺そうとしていたその時
  rationale: 属格絶対構文と現在分詞が示す、主動詞と同時進行中の企てを自然な現代日本語で表した。代名詞は単独節としての明瞭さのため文脈上の指示対象「パウロ」とした。
- source_word: ἀνέβη φάσις
  choice: 知らせが……もとに届いた
  rationale: 字義的には「知らせが上って行った」だが、日本語では到達を表すこの言い方が自然である。上方の兵営へ伝わったという空間的含意は脚注で示した。
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: 部隊の千人隊長
  rationale: χιλίαρχος はローマ軍の高級将校を、σπεῖρα はその指揮下の部隊を指す。「千人隊長」は使徒言行録の歴史的用語として簡潔であり、厳密な職制は脚注で補った。
- source_word: ὅτι ὅλη συγχύννεται Ἰερουσαλήμ
  choice: エルサレム中が騒乱状態にあるとの
  rationale: 「エルサレム全体」という換喩的表現を「エルサレム中」とし、συγχύννεται の混乱・動揺・騒擾の幅を保ちながら、暴徒の騒ぎという文脈に適する「騒乱状態」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。群衆の進行中の殺害企図と、都全体に及ぶ騒擾を簡潔に描く。脚注記号は該当語句の直後に配置した。
