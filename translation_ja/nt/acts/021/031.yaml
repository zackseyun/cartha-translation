- from: 人々がパウロを殺そうとしていたその時、エルサレム中が騒乱状態にあるとの知らせが、部隊の千人隊長[a]のもとに届いた。[b]
  to: 人々がパウロを殺そうとしていたその時、エルサレム全体が混乱に陥っているとの報告が、部隊の千人隊長[a]のもとに届いた。[b]
