review_pass:
  verdict: revise
  source_fidelity: 主文は、殺害しようとする進行中の企て、司令官への報告、エルサレム全体の騒擾というギリシア語の骨格をおおむね正確に伝えている。ただし、συγχύννεται は第一義的に「混乱に陥る／混乱している」であり、「騒乱状態」は文脈上あり得てもやや限定的・強い。また脚注bの「神殿域から高い位置にある兵営へ」は本文の語句そのものからは確定できない歴史的再構成である。
  naturalness: 「知らせが、…のもとに届いた」は自然である。「エルサレム中が騒乱状態にある」は理解可能だが、「エルサレム全体が混乱に陥っている」のほうが原語の意味の幅を保ち、明瞭な現代標準日本語としても自然である。
  terminology: 「千人隊長」は使徒言行録で定着した訳語として維持できる。ただし、脚注aの「軍団司令官に属する高級将校」はこの節のχίλιαρχοςの説明として不正確かつ不要に限定的である。ローマ軍のコホルス（部隊）を指揮するトリブヌス相当の将校と簡潔に説明するのが適切である。
  issues:
  - severity: medium
    issue: 「騒乱状態」がσυγχύννεταιをやや狭く、強く解している。
    rationale: この動詞は混乱・動揺・錯乱状態を表す。暴動そのものを意味する語ではないため、「混乱に陥っている」として文脈上の騒擾を含みつつ語義の幅を残す。
  - severity: medium
    issue: 脚注bが「上って行った」を特定の地理的経路・高低差として説明している。
    rationale: ἀνέβη φάσις は「報告が上った」という表現だが、この節だけから神殿域を出発点とし兵営が高所にあったことまでは確定できない。直訳上の表現であることだけを記す。
  - severity: medium
    issue: 脚注aの職制説明が不正確である。
    rationale: 「軍団司令官に属する高級将校」という説明はχίλιαρχοςの訳注として適切でない。本文はσπεῖραの指揮官と述べるため、その範囲で説明する。
