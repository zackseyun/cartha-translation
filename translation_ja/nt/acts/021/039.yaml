source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: ja
  text: しかし、パウロは言った。「私はユダヤ人で、キリキアのタルソの市民です。タルソは決して名の知れない都市ではありません。どうか、人々に話すことをお許しください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: 私は…ユダヤ人で
  rationale: 日本語では「ユダヤ人の男」とすると不自然で、話者自身が男性であることも文脈上明らかなため、「ユダヤ人」と自然に表現した。μένの強調は、自己紹介全体の明確な言い切りによって伝えた。
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: キリキアのタルソ出身
  rationale: 都市名と属州名の関係を現代日本語で明瞭に示しつつ、後続のπολίτηςと不自然に重複させない表現とした。
- source_word: οὐκ ἀσήμου πόλεως
  choice: れっきとした都市
  rationale: 否定を用いた控えめな誇示という原文の語用論的な力を、自然な日本語で表した。「名もない町ではない」では都市の評価が曖昧または皮肉に響きやすいため避けた。
- source_word: πολίτης
  choice: 市民
  rationale: 単なる居住者ではなく、都市への公的な帰属を示す語として訳した。
- source_word: δέομαι δέ σου
  choice: お願いです
  rationale: 軍の指揮官に対する切実で丁寧な願いを、過度に古風にならない現代日本語で表した。
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: 話すことをお許しください
  rationale: 許可を求める命令形を、相手への敬意を保つ丁寧な依頼として訳した。
- source_word: πρὸς τὸν λαόν
  choice: 人々に
  rationale: λαόςの共同体的な含みを保ち、「群衆」と狭く限定しなかった。
theological_decisions:
- issue: Ἰουδαῖοςの意味
  choice: ユダヤ人
  alternative: ユダヤ地方の人
  rationale: パウロは出身都市を別にキリキアのタルソと明示しているため、ここでは地理的な「ユダヤ地方の人」よりも民族的・宗教的帰属を示す「ユダヤ人」が適切である。
- issue: οὐκ ἀσήμου πόλεωςの控えめな誇示
  choice: れっきとした都市
  alternative: 名もない町ではない／取るに足りない都市ではない
  rationale: タルソの地位を主張する原文の含意を保ちながら、日本語として誤解の少ない表現を選んだ。特定の歴史的評価を原文以上に加えて「有名な都市」「重要な都市」とはしなかった。
translation_notes:
  register: 現代標準日本語による、丁寧で威厳のある公的発言の調子。軍の指揮官への敬意と、パウロの出自に関する自信の双方が自然に伝わるようにした。
