  to: しかし、パウロは言った。「私はユダヤ人で、キリキアのタルソの市民です。タルソは決して名の知れない都市ではありません。どうか、人々に話すことをお許しください。」
  rationale: 「決して名の知れない都市ではありません」により、οὐκ ἀσήμουの否定を用いた控えめな強調を自然な現代日本語で保った。「タルソの市民」として、πολίτηςが指す都市的市民資格を明瞭にした。二文に分けることは日本語の自然さのためであり、原文の内容や強調を追加・削減しない。
