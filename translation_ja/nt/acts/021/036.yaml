  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: ja
  text: というのも、大勢の民衆が、「あの者を連れ去れ！【a】」と叫びながら、後をついて来ていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθει
  choice: ついて来ていた
  rationale: 未完了時制が表す、過去に継続していた動作を自然な日本語で示す。文脈上、群衆は連行されるパウロの後について来ている。
- source_word: γὰρ
  choice: からである
  rationale: 直前の出来事を説明する接続関係を保持する。
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: 民衆の群れ
  rationale: πλῆθοςの集合的な意味とτοῦ λαοῦの限定を保ちつつ、「暴徒」のような原文以上に否定的な語感を避ける。
- source_word: κράζοντες
  choice: 叫びながら
  rationale: 群衆がついて来るのと同時に行っていた、激しい発声を伴う動作として表す。
- source_word: Αἶρε αὐτόν
  choice: あいつを葬れ！
  rationale: この文脈のαἴρωは単なる持ち上げではなく、敵意を込めて相手を排除せよと要求する慣用的表現である。使徒言行録22章22節との呼応も踏まえ、死を求める含意を自然で切迫した日本語にした。
