review_pass:
  verdict: revise
  source_fidelity: 「あいつを葬れ」は、Αἶρε αὐτόν（『彼を取り去れ／連れ去れ』）が直接表す要求を越えて、殺害・埋葬を命じる意味に限定している。この箇所の語そのものは敵対的な排除要求だが、死刑要求を語彙的に明示してはいない。未完了形ἠκολούθειの継続性と、γάρの説明的なつながりは保てる。
  naturalness: 「民衆の群れ」も理解可能だが、明快な現代標準語としては「大勢の民衆」がより自然である。「後をついて来ていた」は叙事文に自然で、継続的に追従していた様子を示す。
  terminology: πλῆθος τοῦ λαοῦは「大勢の民衆」として、原文にない「暴徒」という評価を加えずに表せる。αἶρε αὐτόνは「あの者を連れ去れ」とし、敵意を保ちつつ殺害という限定を避ける。
  issues:
  - severity: high
    issue: 「葬れ！」が原文以上に殺害・埋葬の意味を付加している。
    rationale: αἴρωはここで『取り去る』『除く』という排除要求であり、文脈上の敵意は強いものの、この命令形だけで『葬る』と訳すと意味を過度に限定する。
  - severity: low
    issue: 「民衆の群れ」はやや重複的で不自然である。
    rationale: πλῆθοςの集合性は「大勢の民衆」で自然に表せる。
  revised_text: というのも、大勢の民衆が、「あの者を連れ去れ！【a】」と叫びながら、後をついて来ていたからである。
