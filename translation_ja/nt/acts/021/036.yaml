revisions:
- from: 民衆の群れが、「あいつを葬れ！」と叫びながら、ついて来ていたからである。
  to: というのも、大勢の民衆が、「あの者を連れ去れ！【a】」と叫びながら、後をついて来ていたからである。
  rationale: 命令を「連れ去れ」として、敵対的な排除の要求を明確に訳しつつ、原文が明示しない殺害・埋葬の意味を加えないようにした。注で「除け」という直截な代案を示し、αἴρωの幅を保った。
  reviewer_model: gpt-5.6-terra
