  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: ja
  text: 互いに別れを告げて[a]、私たちは船に乗り込んだ。彼らは自分たちの所へ戻った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このギリシア語表現は、挨拶を交わすことにも、別れを告げることにも用いられる。ここでは出発の文脈から「別れを告げて」と訳した。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「自分たちのものへ」。ここでは、自分たちの所、家、または居所へ戻ることを表す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: 互いに別れの挨拶をして
  rationale: 動詞は挨拶にも別れにも用いられるが、ここでは双方が別々の方向へ出発する文脈なので、別れの意味が自然である。相互代名詞も「互いに」で保持した。
- source_word: ἐνέβημεν
  choice: 私たちは船に乗り込んだ
  rationale: 船などに入る、乗り込むことを表す。航海の場面に自然で、動作も明確な現代日本語とした。
- source_word: πλοῖον
  choice: 船
  rationale: 小舟から船まで指し得る語であるため、規模を不必要に限定しない一般的な「船」とした。
- source_word: ὑπέστρεψαν
  choice: 帰って行った
  rationale: 元いた場所へ戻る意味を、話者たちと別れて去る場面に即した自然な日本語で表した。
- source_word: εἰς τὰ ἴδια
  choice: それぞれ自分の家へ
  rationale: 直訳では「自分たちのもの・場所へ」だが、自分の家や居所へ戻ることを表す慣用句である。複数の人々についての表現なので「それぞれ」を補い、日本語として明瞭にした。
