  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: ja
  text: しかし、群衆の中では、ある者はあることを、別の者は別のことを叫んでいた。千人隊長は騒ぎのために確かなこと[a]を知ることができなかったので、パウロを兵営[b]へ連れて行くよう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「事の真相」「確実なこと」。
    reason: lexical_alternative
  - marker: b
    text: 「兵営」はローマ軍の駐屯施設を指す。ここでは、神殿域に隣接していた要塞内の軍施設と考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν
  choice: ある者はこう、別の者はああと叫び続けていた
  rationale: ἄλλοι…ἄλλο τι の対照を自然な日本語で表し、未完了過去の継続的な叫びを「叫び続けていた」で示した。
- source_word: ἐν τῷ ὄχλῳ
  choice: 群衆の中では
  rationale: ὄχλοςを敵意まで過度に含意しない中立的な「群衆」とし、相異なる叫びが群衆内で上がっていたことを示した。
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: 千人隊長は…知ることができなかったので
  rationale: 属格独立構文の因果的な状況を自然に表した。αὐτοῦの指示対象は文脈上の千人隊長であり、日本語での不自然な代名詞の連続を避けた。
- source_word: τὸ ἀσφαλές
  choice: 確かなところ
  rationale: 「確実で信頼できる事柄」という語義を保ち、「事実」と断定して意味を狭めすぎない表現とした。
- source_word: διὰ τὸν θόρυβον
  choice: 騒ぎのために
  rationale: θόρυβοςが単なる音ではなく、混乱した騒動を指すことを簡潔に表した。
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: パウロを…連れて行くよう命じた
  rationale: 受動不定詞を自然な日本語の命令表現にし、実行者は原文同様に明示しなかった。αὐτόνの指示対象は文脈上パウロである。
- source_word: εἰς τὴν παρεμβολήν
  choice: 兵営へ
  rationale: この文脈では神殿域に接するローマ軍の駐屯施設を指すため、「陣営」より恒久的な軍事施設を想起させる「兵営」とした。
