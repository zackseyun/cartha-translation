  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: ja
  text: 七日間が終わろうとしていたころ、アジア州から来たユダヤ人たちは、神殿の境内[c]で彼を見て、群衆全体をあおり立て[a]、彼に手をかけた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆全体を混乱に陥れ」。このギリシア語動詞は、群衆をあおり立てることにも、混乱させることにも重点を置き得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼を捕らえた」。原文は直訳すると「彼の上に手を置いた」で、ここでは力ずくで彼をつかまえることを表す慣用表現。
    reason: lexical_alternative
  - marker: c
    text: ここで「神殿の境内」と訳したギリシア語は、内殿だけでなく、庭を含む神殿域全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: 七日間が終わろうとしていたころ
  rationale: μέλλωと不定詞が示す切迫した時点と、συντελεῖσθαιの「完了する」という意味を、自然な現代日本語で表した。文脈上の清めの期間であることは本文に補わず、「七日間」とした。
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: アジア州から来たユダヤ人たち
  rationale: Ἀσίαは現代のアジア大陸全体ではなくローマ属州アジアを指すため、「アジア州」として現代読者の誤解を避けた。
- source_word: θεασάμενοι αὐτὸν
  choice: 彼を見つけ
  rationale: θεάομαιの視認の意味と、それが直後の行動の契機となった流れを簡潔に表した。目的語の指示対象は原文どおり代名詞で保持した。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内
  rationale: ἱερόνは内殿に限らず神殿域全体を指す。「神殿」だけより場所を正確に示しつつ、自然な日本語となるよう「神殿の境内」とした。
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: 群衆全体をあおり立て
  rationale: συγχέωには混乱させる意味と騒ぎ立たせる意味の幅がある。この暴動場面では群衆を扇動する動きが自然だが、「混乱に陥れた」という可能性は脚注に残した。
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: 彼を取り押さえた
  rationale: 直訳的な「彼に手をかけた」は現代日本語では殺害をほのめかしかねないため、強制的に身柄を押さえる慣用句の意味を明確にした。より広い「捕らえた」も脚注で示した。
