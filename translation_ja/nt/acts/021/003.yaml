  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: ja
  text: キプロス島を見つけ、それを左手にして、私たちはシリアへ航海を続け、ティルスに着いた。[a] そこでは船が積み荷を降ろしていたからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ティルスへ下った」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「船はそこで積み荷を降ろされていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: 見えてくると
  rationale: キプロス島が視界に入ったことを表すアオリスト分詞を、主動詞に先立つ出来事として自然な現代日本語で表した。
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: その島を左手に見ながら
  rationale: εὐώνυμονの「左側に」という航海上の位置関係を明確にしつつ、専門的な船舶用語を避けた。
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: シリアへ向けて航海を続け
  rationale: 未完了過去が描く航行の継続を「航海を続け」で自然に反映した。
- source_word: κατήλθομεν εἰς Τύρον
  choice: ティルスに入港した
  rationale: κατέρχομαιの字義は「下って行く／来る」だが、海路の文脈では港に着くことを表すため、日本語では「入港した」が明瞭である。字義的な表現は脚注に残した。
- source_word: ἀποφορτιζόμενον
  choice: 積み荷を降ろしていた
  rationale: ἦνとの迂言的構文を継続中の動作として訳した。中動態・受動態の形には「荷を降ろしていた」と「荷降ろしされていた」の両方の理解があり得るため、別訳を脚注に示した。
- source_word: τὸν γόμον
  choice: 積み荷
  rationale: γόμοςは船で運ばれる貨物を指し、現代日本語では「積み荷」が自然で正確である。
theological_decisions: []
translation_notes:
  register: 明瞭で品位のある現代標準日本語を用いた。航海の経路が無理なく伝わるようにしつつ、ギリシア語の方向表現と態の曖昧さは脚注に残した。
