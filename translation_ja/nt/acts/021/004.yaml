revisions:
- from: 弟子たちを捜し出し、私たちはそこに七日間滞在した。彼らは御霊を通して、エルサレムへ上って行かないよう、パウロに繰り返し告げていた。[a]
  to: 弟子たちを見つけ出して、私たちはそこに七日間滞在した。彼らは聖霊によって、パウロにエルサレムへ上って行かないよう繰り返し言っていた。[a]
  rationale: 「御霊」を、現代日本語の聖書翻訳でより広く通用し、原文の文脈上の指示対象を明確にする「聖霊」に改めた。「通して」は媒介を表す訳として可能だが、「によって」は διὰ＋属格の手段・媒介を自然に表す。脚注は、本文の構文上は聖霊による禁止の発言として読める一方、聖霊による苦難の予告から弟子たちが勧告を導いたとの解釈もありうることを、いずれかに決めずに示す。
