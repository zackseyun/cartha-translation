source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: ja
  text: 弟子たちを見つけ出して、私たちはそこに七日間滞在した。彼らは聖霊によって、パウロにエルサレムへ上って行かないよう繰り返し言っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の理解も可能である。聖霊がパウロに待ち受ける苦難を示し、それを受けて弟子たちが、エルサレムへ行かないよう勧めた、と解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνευρόντες
  choice: 捜し出し
  rationale: ἀνάを伴う動詞が含み得る、捜した末に見つけるという含意を簡潔に表す。アオリスト分詞の先行動作は、自然な連用形で示した。
- source_word: τοὺς μαθητάς
  choice: 弟子たち
  rationale: 使徒言行録における μαθητής の定着した意味を保ち、「信者たち」へ一般化しない。
- source_word: ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά
  choice: 私たちはそこに七日間滞在した
  rationale: αὐτοῦ を場所を示す「そこに」とし、対格の期間を「七日間」で明示した。ἐπιμένω は現代日本語で品位のある「滞在した」とした。
- source_word: οἵτινες
  choice: 彼らは
  rationale: 先行する弟子たちを受ける関係を、読みやすい独立文として表した。
- source_word: ἔλεγον
  choice: 繰り返し告げていた
  rationale: 未完了過去の継続・反復の含みを表す。単発の「告げた」にはしない。
- source_word: διὰ τοῦ πνεύματος
  choice: 御霊を通して
  rationale: διά＋属格の媒介・手段を保持する。「聖なる」は本文に明記されていないため補わず、文脈上神の霊を指すことを「御霊」で自然に示した。
- source_word: μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα
  choice: エルサレムへ上って行かないよう
  rationale: 不定詞を発言内容として訳し、エルサレムへの移動に用いられる方向表現「上る」を保った。
theological_decisions:
- issue: 御霊による発言と、パウロのエルサレム行きとの関係
  choice: 御霊を通して、エルサレムへ上って行かないよう…告げていた
  alternative: 御霊によって苦難を知らされ、弟子たちが行かないよう勧めた
  rationale: 本文の文法上は「行かないよう」という発言が「御霊を通して」なされたと読めるため、それを本文に保つ。一方、使徒19:21、20:22–23との緊張から、御霊が苦難を示し、弟子たちが禁止を導き出した可能性も脚注で示し、断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「御霊」は神の霊を指す伝統的で簡潔な語だが、文法上の曖昧さと使徒言行録内の神学的緊張は脚注によって保持した。
