  text: τί οὖν ἐστιν; πάντως ⸀ἀκούσονται ὅτι ἐλήλυθας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: ja
  text: では、どうすればよいでしょうか。あなたが来たことを、彼らは必ず聞くでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「では、何なのか」。このギリシア語の言い回しは、この状況を踏まえてどうすべきかを問うもの。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: では、どうすればよいでしょうか。
  rationale: 字義的には「では、何なのか」だが、文脈では、この状況を受けて取るべき対応を問う慣用的な表現。現代日本語で談話上の働きを自然に示した。
- source_word: πάντως
  choice: 必ず
  rationale: 後続する出来事が確実に起こることを強める副詞として理解し、簡潔で自然な「必ず」とした。
- source_word: ἀκούσονται
  choice: 彼らは…聞くでしょう
  rationale: 未来中動態形だが、ここでは能動的な意味。主語は文脈上のユダヤ人信者たちを指すため、「彼ら」を補った。
- source_word: ὅτι
  choice: …ことを
  rationale: 聞く内容を導く接続詞であり、理由を表す「なぜなら」ではない。日本語では内容節を「ことを」で示した。
- source_word: ἐλήλυθας
  choice: あなたが来た
  rationale: ἔρχομαιの完了形で、パウロが来て今そこにいるという結果状態を含む。日本語では自然さを優先して「来た」とし、文脈によって現在への結果を伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、会議の場での丁寧で落ち着いた問いかけとして「でしょうか」を採用した。後半は原文の確実性と未来性を保った。
