base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: ja
  text: 私たちがエルサレムに着くと、兄弟たち[a]は喜んで迎えてくれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、より広く信仰を共にする仲間を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: 私たちが……着くと
  rationale: 属格独立構文が到着時の状況を示しているため、現代日本語として自然な時間表現にした。δέはここでは談話を進める働きが中心であり、独立した接続語にはしなかった。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムに
  rationale: εἰςは到着先を示すため、日本語の到着表現に自然な助詞「に」で表した。
- source_word: ἀσμένως
  choice: 喜んで
  rationale: 歓迎する際の喜びや快い意志を表す副詞として、原語に近く自然な訳語を選んだ。
- source_word: ἀπεδέξαντο
  choice: 迎えてくれた
  rationale: 人を好意的に受け入れる意味を、来訪者側の視点を保つ自然な日本語で表した。単なる「受け入れた」より、歓待の場面に適している。
- source_word: οἱ ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文で保持した。初期キリスト教共同体の仲間全般を指し、女性を含み得ることは脚注で示した。
theological_decisions:
- issue: エルサレムのキリスト者共同体を指すἀδελφοίの性別表現
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性複数形を保ちつつ、その語が共同体の女性を含む場合があるという実際の指示範囲は脚注に残した。「信者たち」とすると家族的な比喩が失われるため採用しなかった。
translation_notes:
  register: 明快で自然な現代標準語を用い、簡潔ながら叙事文として品位のある調子にした。「迎えてくれた」により、同行者を含む一人称複数の視点を自然に保った。
