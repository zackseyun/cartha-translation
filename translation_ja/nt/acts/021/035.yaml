  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: ja
  text: パウロが階段に差しかかると[a]、群衆の暴力のため、兵士たちは彼を担いで運ぶことになった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この「階段」は、ローマ軍の兵営へ上る階段を指すと考えられる（使徒21:34、37参照）。
    reason: cross_reference
  - marker: b
    text: 別訳「彼は兵士たちに担がれて運ばなければならなかった」。ギリシア語の表現は、群衆の暴力によって生じた結果的な必要性を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: すると
  rationale: 時間的な展開を自然な現代日本語で示す。δέの軽い接続機能は、独立した逆接語を置かず文脈の流れに含めた。
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: 階段に差しかかる
  rationale: γίνομαιとἐπί＋対格による、ある場所に到達するという慣用的な意味を表す。「差しかかる」は階段に至った場面を自然に描く。
- source_word: ἀναβαθμούς
  choice: 階段
  rationale: 上へ通じる段または階段を指す。文脈上、ローマ軍の兵営へ上る階段と考えられるが、その特定は本文に付加せず注に示した。
- source_word: συνέβη
  choice: ことになった
  rationale: 直訳的な「起こった」より自然であり、群衆の暴力の結果としてその事態が生じたことを表す。同時に、文脈上含まれ得る必要性も過度に断定しない。
- source_word: βαστάζεσθαι
  choice: 担がれて運ばれる
  rationale: 現在受動不定詞の受動性と、実際に運ばれている動作を明確に表す。「担がれる」だけで生じ得る曖昧さを「運ばれる」で補った。
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: 兵士たちに
  rationale: 受動文の行為者を自然な日本語で示した。στρατιῶταιの基本義をそのまま「兵士たち」とした。
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: 群衆の暴力のため
  rationale: διά＋対格の原因と、βίαの「暴力・力」を簡潔に保持する。「暴徒」として敵意を名詞側に加えず、否定的な意味は「暴力」に担わせた。
