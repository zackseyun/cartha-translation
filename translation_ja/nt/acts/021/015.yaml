lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: この日々の後
  rationale: μετά＋対格の時間的用法を保ち、直前に述べられた滞在期間を指す表現として訳した。δὲはここでは弱い叙述上の接続なので、独立した接続語にはしなかった。
- source_word: ἐπισκευασάμενοι
  choice: 旅支度を整え
  rationale: この分詞は荷造りに限定されず、旅に向けた準備全般を表し得る。文脈を明らかにしつつ意味を狭めすぎない自然な日本語とした。
- source_word: ἀνεβαίνομεν
  choice: 上って行った
  rationale: 未完了過去形による過去の旅程叙述として訳し、エルサレムへの移動に伴う方向・上行のニュアンスを保持した。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムへ
  rationale: εἰςが示す目的地への移動を、現代日本語の旅行叙述で自然な助詞「へ」によって表した。
