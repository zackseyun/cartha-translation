  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: ja
  text: その数日が過ぎてから、私たちは旅支度を整えて[a]、エルサレムへ上って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
