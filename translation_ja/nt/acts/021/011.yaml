  terminology: 「帯」「聖霊」「ユダヤ人たち」「異邦人の手に」「引き渡す」は、いずれも現代日本語の聖書翻訳として適切である。「人」はἀνήρの男性性を語彙上明示しないが、直前のパウロの帯という文脈によって指示対象は明瞭であり、ここでは不忠実とはならない。
