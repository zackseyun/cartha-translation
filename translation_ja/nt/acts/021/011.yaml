id: ACT.21.11
reference: Acts 21:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: ja
  text: そして彼は私たちのところに来て、パウロの帯を取り、自分の足と手を縛って言った。「聖霊はこう言う。『この帯の持ち主である人を、エルサレムでユダヤ人たちはこのように縛り、異邦人の手に引き渡す。』」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζώνην
  choice: 帯
  rationale: 腰に巻く帯やベルトを指す。古代の衣服に即し、現代日本語でも明瞭な「帯」とした。
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: 自分の足と手を縛って
  rationale: 再帰代名詞ἑαυτοῦは分詞の主語であるアガボを指すのが自然であり、象徴的行為として自分自身を縛ったことを明示する。δέωは後半にも反復されるため、どちらも「縛る」で対応させた。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言者的な告知定型を保ちつつ、神である聖霊への敬意を自然な現代日本語の敬語で表した。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語の聖書・キリスト教用語として標準的で、原文の指示対象を過不足なく表す。
- source_word: Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη
  choice: この帯の持ち主である人を
  rationale: 直訳的な「この帯がその人のものである、その人を」という関係を、意味を変えず自然な日本語にした。ἀνήρの男性性は文脈上パウロを指すことから明らかであり、「男」よりも格調と自然さのある「人」を選んだ。
- source_word: οὕτως
  choice: このように
  rationale: 直前の象徴的な自己拘束と、これから起こる拘束との対応を明確に示す。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文は指導者などに限定していないため、その範囲を狭めずに訳した。複数主体であることも自然に示した。
- source_word: παραδώσουσιν
  choice: 引き渡す
  rationale: 敵対する側の権力下へ移すというπαραδίδωμιの意味を、現代日本語で自然に表す。
- source_word: εἰς χεῖρας ἐθνῶν
  choice: 異邦人の手に
  rationale: 非ユダヤ人を指すἐθνῶνを文脈に即して「異邦人」とし、「手に」という原文の支配・権力を表す比喩も保持した。
theological_decisions:
- issue: 聖霊による預言の告知定型
  choice: 聖霊はこう言われる
  alternative: 聖霊が言われることはこうである
  rationale: Τάδε λέγειの聖書的な預言定型と権威ある直接発話を保ち、説明的に弱めないため。
- issue: ἑαυτοῦの指示対象
  choice: アガボが自分の足と手を縛った
  alternative: アガボがパウロの足と手を縛った
  rationale: 再帰代名詞は分詞δήσαςの暗黙の主語であるアガボを自然に指す。原文の象徴的な自己拘束をそのまま伝える。
- issue: 「ユダヤ人たち」の範囲
  choice: 原文どおりユダヤ人たちとする
  alternative: ユダヤ人の指導者たち
  rationale: 本文には指導者への限定がなく、歴史的・神学的解釈を訳文に加えないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言的発言には簡潔で荘重な調子を保った。語順は日本語として自然に整え、象徴的行為と預言の「このように」という対応、および「異邦人の手に」という聖書的比喩を保持した。
