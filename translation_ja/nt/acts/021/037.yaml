source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: ja
  text: パウロが兵営[a]へ連れて行かれようとしていたとき、彼は千人隊長[b]に言った。「あなたに何か申し上げてもよろしいでしょうか[c]」すると千人隊長は言った。「ギリシア語を知っているのか」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兵営」はローマ軍の駐屯施設を指し、ここでは要塞内の軍用区画と考えられる。
    reason: cultural_note
  - marker: b
    text: 「千人隊長」はローマ軍の軍事官職を指す。「司令官」とも訳せる。
    reason: cultural_note
  - marker: c
    text: 直訳に近くは、「私があなたに何か言うことは許されていますか」。本文は、許可を求める丁寧な日本語で表した。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: 連れて行かれようとしていたとき
  rationale: μέλλωが表す切迫した時点と、εἰσάγεσθαιの受動態を保ち、分詞構文を自然な日本語の時の節にした。
- source_word: παρεμβολή
  choice: 兵営
  rationale: このエルサレムの文脈ではローマ軍の駐屯施設を指す。「宿営地」より常設の軍事施設に適し、「要塞」ほど建造物全体に意味を限定しない。
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍の上級指揮官を指す語として、使徒言行録の歴史的背景と語の字義を伝える定着した訳語を採用した。実際の厳密な兵員数を断定する表現ではない。
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: あなたに何かお話ししてもよろしいでしょうか
  rationale: ἔξεστινの許可を求める意味とτιの「何か」を保ちつつ、ギリシア語の条件文型による丁寧な問いを自然な現代日本語にした。
- source_word: Ἑλληνιστὶ γινώσκεις
  choice: ギリシア語を知っているのか
  rationale: Ἑλληνιστίは「ギリシア語で」、γινώσκειςは「知っている」を基本義とする。言語能力を問う自然な日本語として訳し、「話せるのか」と能力だけに狭めなかった。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、軍事用語には歴史的な響きを残した。パウロの問いは上官への丁寧な依頼として訳し、千人隊長の返答は驚きを含み得る簡潔な口調にした。
