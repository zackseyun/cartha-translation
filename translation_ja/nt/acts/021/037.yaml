revisions:
- from: パウロが兵営[a]の中へ連れて行かれようとしていたとき、彼は千人隊長[b]に言った。「あなたに何かお話ししてもよろしいでしょうか[c]。」すると千人隊長は言った。「ギリシア語を知っているのか。」
  to: パウロが兵営[a]へ連れて行かれようとしていたとき、彼は千人隊長[b]に言った。「あなたに何か申し上げてもよろしいでしょうか[c]」すると千人隊長は言った。「ギリシア語を知っているのか」
  rationale: 意味内容は維持したまま、「兵営へ」として自然な日本語に整え、上官への丁寧な発話を「申し上げる」で明確にした。あわせて疑問文の句読点を日本語として自然な形に改め、脚注cを原文のμoi（私に）とἔξεστιν（許されている）をより正確に反映する説明へ修正した。
