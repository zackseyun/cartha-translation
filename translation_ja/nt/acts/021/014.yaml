  to: しかし、パウロが説得に応じようとしなかったので、私たちは静かになり、「主のみこころが行われますように」と言った[a]。
  rationale: 主動詞ἡσυχάσαμενを「静かになり」として前面に置き、εἰπόντεςを「と言った」と続けることで、原文の主動詞と分詞の関係を日本語でより自然に反映した。脚注はἡσυχάσαμενの文脈上の含意を、本文の意味を増さずに示すよう整えた。
