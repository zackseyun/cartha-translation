  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: ja
  text: しかし、パウロが説得に応じようとしなかったので、私たちは静かになり、「主のみこころが行われますように」と言った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「説得を続けるのをやめて黙った」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: しかし、パウロが説得に応じようとしなかったので
  rationale: 属格独立構文を後続する行動の理由・状況として自然な日本語にした。文脈上の指示対象を「パウロ」と明示し、継続的に説得されても応じない意志を表す現在分詞の含みを「応じようとしなかった」で示した。
- source_word: ἡσυχάσαμεν
  choice: 口をつぐんだ
  rationale: 説得を続けるのをやめて静かになったことを表す。アオリストの動作開始・成立を簡潔で自然な日本語にした。
- source_word: εἰπόντες
  choice: と言って
  rationale: 主動詞に伴うアオリスト分詞を日本語の接続表現で示し、この言葉を述べた後に口をつぐんだという自然な流れを保った。
- source_word: Τοῦ κυρίου
  choice: 主の
  rationale: κύριοςを通常の聖書用語である「主」とし、指示対象を本文以上に限定しなかった。
- source_word: τὸ θέλημα
  choice: みこころ
  rationale: θέλημαの「意志、望まれること」を、祈りと服従の文脈に適した、現代日本語でも通用する敬意ある表現で訳した。
- source_word: γινέσθω
  choice: 行われますように
  rationale: 現在命令形が表す願いと服従を自然な祈願表現で示した。「実現しますように」よりも、神の意志への服従という聖書的な言い回しを保つ。
theological_decisions:
- issue: κύριοςの訳語と指示対象
  choice: 主
  alternative: 主人
  rationale: この文脈では主イエスを指す可能性が高いが、ギリシア語本文は名を明示していないため、訳文でも「主」にとどめた。
- issue: 「主のみこころ」と出来事の関係
  choice: 主のみこころが行われますように
  alternative: 主のみこころどおりになりますように
  rationale: 話者たちの服従を表す祈願として訳し、パウロに起こる個々の出来事が何であるかを訳文側で断定しないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祈願句には「みこころ」「行われますように」という品位ある聖書的表現を採用した。「どうしても」などの強調語は原文に明示されていないため加えなかった。
