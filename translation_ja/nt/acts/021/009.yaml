  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: ja
  text: この人には、預言する四人の処女の娘がいた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「未婚の娘」とも訳せる。
    reason: παρθένοιは第一義的には「処女の」を表すが、未婚の若い女性という社会的含意を持つ場合もあるため。
lexical_decisions:
- source_word: τούτῳ
  choice: この人には
  rationale: 直前に言及されたフィリポを指す与格であり、日本語では存在・所有を表す「この人には」が原文の構文を自然に保つ。
- source_word: δὲ
  choice: （訳出せず）
  rationale: ここでは軽い継続を示す接続辞であり、日本語では文脈の流れだけで十分に表せる。
- source_word: ἦσαν ... θυγατέρες
  choice: 娘が…いた
  rationale: 与格と存在動詞による所有表現を、日本語の自然な存在構文で表した。
- source_word: τέσσαρες
  choice: 四人
  rationale: 娘の人数を示す基数詞。日本語では人を数える助数詞を用いる。
- source_word: παρθένοι
  choice: 未婚の
  rationale: 女性の性的純潔を直接には表し得る語だが、婚姻していない若い女性という社会的含意もある。本文では現代日本語として自然な「未婚の」とし、より字義的な訳を脚注に残す。
- source_word: προφητεύουσαι
  choice: 預言をしている
  rationale: 娘たちを修飾する現在能動分詞であり、継続的または特徴的な活動を表すため、「預言をしている」とした。
theological_decisions:
- issue: 女性たちのπαρθένοιという身分と預言活動との関係
  choice: 本文では「未婚の」、脚注では「処女である」
  alternative: 本文で「処女である娘」または「処女の娘」とする
  rationale: 本文は彼女たちの身分と預言活動を併記するだけで、両者の神学的関係を説明していない。「未婚の」は後代の処女性評価を持ち込まず社会的含意を自然に伝え、語のより直接的な意味は脚注で明示する。
translation_notes:
  register: 明快な現代標準日本語。「預言」は聖書文脈で定着した語として用い、簡潔で品位のある文体にした。
