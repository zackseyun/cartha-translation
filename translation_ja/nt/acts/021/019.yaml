source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: ja
  text: 彼らに挨拶をした後、パウロは、神が異邦人たち[a]の間で、パウロの奉仕を通してなさったことを、一つ一つ詳しく語った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「諸民族の間で」とも訳せる。ここでは、ユダヤ人ではない人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 「順を追って説明した」とも訳せる。ギリシア語は、一つ一つ取り上げて詳しく報告したことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: 挨拶をした後
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、自然な現代日本語で出来事の順序を明示した。
- source_word: ἐξηγεῖτο
  choice: 詳しく語った
  rationale: この未完了過去形は、ある程度の時間をかけて報告したことを示し得る。日本語では「詳しく語った」とし、続く「一つ一つ」と合わせて継続的で詳細な報告を表した。
- source_word: καθ’ ἓν ἕκαστον
  choice: 一つ一つ
  rationale: 個々の事柄を順に取り上げるという分配的な意味を、簡潔で自然に表した。
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: 神が……行われたこと
  rationale: 本文が神を行為の主体としている点を保持した。神への敬意を表す通常の日本語として「行われた」を用いた。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 異邦人たちの間で
  rationale: この文脈の ἔθνη は地政学的な諸国ではなく、ユダヤ人以外の人々を指す。「異邦人」は新約聖書の文脈に適合し、注で意味を明確にした。
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: 自分の奉仕を通して
  rationale: διά＋属格の手段性を「通して」で表した。διακονία はここではパウロの宣教上の働きを指すが、制度的な職位を不必要に含意しない「奉仕」を選んだ。
- source_word: αὐτοῦ
  choice: 自分の
  rationale: 文脈上、奉仕の担い手は報告しているパウロである。日本語では主語に帰属することを自然に示すため再帰表現を用いた。
theological_decisions:
- issue: 宣教の働きにおける神とパウロの行為主体性
  choice: 神を行為の主体とし、パウロの奉仕をその手段として表現した。
  alternative: パウロ自身が異邦人の間で成し遂げたこととして表現する。
  rationale: ὁ θεὸς が ἐποίησεν の明示的な主語であり、διὰ τῆς διακονίας αὐτοῦ はパウロの奉仕を手段として示す。神の主体性と人間の奉仕の双方を、本文の関係どおりに保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「パウロ」は直前の文脈で明らかな主語を日本語で補い、読みやすくした。「異邦人」は一般読者には注を要する聖書語彙であるため、脚注で説明した。
