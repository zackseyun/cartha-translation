  to: 彼らに挨拶をした後、パウロは、神が異邦人たち[a]の間で、パウロの奉仕を通してなさったことを、一つ一つ詳しく語った[b]。
  rationale: 本文の意味は維持したまま、「自分の奉仕」を「パウロの奉仕」に改め、神の行為とパウロの奉仕との手段的関係を明確にした。語順も「神が異邦人たちの間で、パウロの奉仕を通してなさったこと」として、原文の神的主体性と奉仕の手段性を読み取りやすくした。脚注アンカーと脚注内容は適切であるため保持した。
