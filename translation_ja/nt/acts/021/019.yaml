  terminology: 「異邦人」は新約の文脈に適した定着した訳語であり、脚注の補足も有用である。「奉仕」はδιακονίαの広い意味を保ち、制度的職位を過度に示唆しない。「なさった」は神を主語とする自然な敬意表現だが、神の行為主体性を変えない。
