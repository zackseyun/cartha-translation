  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: ja
  text: そこで千人隊長は直ちに兵士たちと百人隊長たちを率い、群衆のところへ駆け下りた。群衆は千人隊長[a]と兵士たちを見ると、パウロを殴るのをやめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「千人隊長」はローマ軍の一部隊（コホルス）を指揮する将校。実際に常に千人を率いていたという意味ではない。「軍の司令官」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: 直ちに
  rationale: 行動の即時性と緊迫感を、格調を保った自然な現代日本語で表す。
- source_word: παραλαβὼν
  choice: 率い
  rationale: 兵士と百人隊長を伴って現場へ向かったことを、軍指揮官という文脈に即して簡潔に示す。
- source_word: στρατιώτας
  choice: 兵士たち
  rationale: 個々の軍人を指す通常の意味を明確に表す。
- source_word: ἑκατοντάρχας
  choice: 百人隊長たち
  rationale: ローマ軍の役職名として日本語聖書・歴史叙述で定着した訳語を用い、複数形も明示する。
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: 群衆のところへ駆け下りた
  rationale: 高所にある兵営方面から急いで下ったという移動の速さと方向を保ち、ἐπ’ αὐτούςの対象は文脈上の群衆として自然に明示する。
- source_word: χιλίαρχον
  choice: 千人隊長
  rationale: ローマ軍のコホルスを指揮する高級将校を表す伝統的で透明性の高い訳語を採用する。厳密な兵員数を常に意味するとは限らないため脚注を付す。
- source_word: ἐπαύσαντο
  choice: やめた
  rationale: 継続していた行為が停止したことを平明な現代日本語で示す。
- source_word: τύπτοντες
  choice: 殴る
  rationale: 反復的な打撃を伴う暴力を自然に表し、単発にも聞こえうる「打つ」より継続中の暴行という文脈に適する。
