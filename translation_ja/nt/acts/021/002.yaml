  text: καὶ εὑρόντες πλοῖον διαπερῶν εἰς Φοινίκην ἐπιβάντες ἀνήχθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: ja
  text: そして、フェニキアへ渡る船を見つけ、それに乗り込んで出航した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρόντες
  choice: 見つけ
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、自然な日本語の連用形で順序を表した。
- source_word: πλοῖον
  choice: 船
  rationale: 地中海を航行する船舶を指す、この文脈で最も自然な一般語。
- source_word: διαπερῶν
  choice: 渡る
  rationale: 現在分詞として船の航路を描写する「向こうへ渡る」という動的な意味を保ち、「行きの」とだけ意訳することを避けた。
- source_word: εἰς Φοινίκην
  choice: フェニキアへ
  rationale: εἰςが示す目的地を、現代日本語で自然な方向表現「へ」によって示した。
- source_word: ἐπιβάντες
  choice: それに乗り込んで
  rationale: 航海の文脈における「乗船する」の意味を明確にし、先行する船を「それ」で受けた。
- source_word: ἀνήχθημεν
  choice: 出航した
  rationale: 航海用法のἀνάγωは「沖へ出る、船出する」を意味するため、簡潔で自然な「出航した」とした。
