source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: ja
  text: この人たちを連れて行き、彼らと共に身を清めなさい。そして、彼らが頭をそることができるように、彼らの費用を負担しなさい。そうすれば、あなたについて聞かされている事柄[a]には何の根拠もないこと、また、あなた自身も律法を守って歩んでいる[b]ことを、皆が知るでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたについて教えられている事柄」。ギリシア語の動詞は「教える」と「知らせる」のどちらの意味にもなり得る。ここでは、パウロについて広まっていた話を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「律法を守りながら、（基準に）沿って歩んでいる」。すなわち、律法を守ることに即した生き方をしているという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: この人たちを連れて行き
  rationale: 直前の四人を指すτούτουςを自然に明示し、付帯分詞を後続する命令と一続きの指示として訳した。
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: 一緒に身を清め
  rationale: 儀礼的な清めに加わることを示す。日本語では「身を清める」が再帰的な意味と宗教的文脈を自然に伝える。
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: 彼らの費用を負担しなさい
  rationale: 彼らのために必要な支出を引き受ける意味を明確にした。誓願に伴う費用という限定は本文に補わない。
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: そうすれば、彼らは頭をそることができ
  rationale: ἵναと未来形による目的・結果を日本語で自然に表した。単数形の「頭」は各人に配分される意味なので、日本語でも「頭」とした。
- source_word: γνώσονται πάντες
  choice: 皆が知るでしょう
  rationale: 未来の帰結を明瞭に表す。
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: あなたについて聞かされていること
  rationale: κατηχέωには「教える」と「知らせる」の幅がある。この文脈ではパウロについて広まった情報・報告を指すため「聞かされている」とし、語義の幅を脚注で示した。
- source_word: οὐδέν ἐστιν
  choice: 何の根拠もなく
  rationale: 報告内容が事実に基づかないという文脈上の意味を、明快な現代日本語で表した。
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: あなた自身も律法を守って歩んでいる
  rationale: στοιχέωの「基準に沿って歩む」とφυλάσσωの「守る」の両方を保ち、「あなた自身も」でκαὶ αὐτόςの付加と強調を表した。
theological_decisions:
- issue: この物語におけるパウロと律法の関係
  choice: あなた自身も律法を守って歩んでいる
  alternative: あなた自身も秩序正しく歩み、律法を守っている
  rationale: ここでは、清めへの参加と費用負担によって人々がパウロの実際の行動について何を知るかが語られている。パウロの律法理解全般をこの一節で体系的に解決せず、物語上の主張と神学的緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「律法」は文脈上のユダヤの律法を指すが、「モーセの律法」とは補足しない。命令の連続と、その結果として皆が知るという論理の流れを自然に示した。
