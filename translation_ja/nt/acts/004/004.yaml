id: ACT.4.4
reference: Acts 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: ja
  text: しかし、その知らせ[a]を聞いた人々の多くが信じた。そして、男たちの数はおよそ五千人になった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ことば」。ここでは、使徒たちが告げた知らせを指す。
    reason: lexical_alternative
  - marker: b
    text: 原文は「男たちの数」。共同体全体の男女を合わせた人数ではなく、男性を数えた数字である可能性が高い。
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 不特定ながら相当数であることを自然な現代日本語で表し、文脈上の人々を明示する。
- source_word: δὲ
  choice: しかし
  rationale: 直前の逮捕と反対にもかかわらず、多くの人が信じたという対照を示す。
- source_word: ἀκουσάντων τὸν λόγον
  choice: みことばを聞いた人々
  rationale: アオリスト分詞の先行する行為を日本語の語順で自然に表す。λόγοςはここでは使徒たちが告げたことば・知らせを指すが、「みことば」とすることで原語の語彙的含みを保つ。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: 目的語を補わず、原文の簡潔さと、何をどのように信じたかについての余白を保つ。
- source_word: ἐγενήθη
  choice: なった
  rationale: 結果としてその人数に達したことを、過度な解釈を加えず自然に表す。
- source_word: ὁ ἀριθμὸς τῶν ἀνδρῶν
  choice: 男たちの数
  rationale: ἀνήρの男性を指す語義を保持し、「人々」や「信者たち」へ中性化しない。
- source_word: ὡς χιλιάδες πέντε
  choice: およそ五千人
  rationale: 数詞の前のὡςが示す概数を「およそ」で明確に表す。日本語では人数の助数詞「人」を用いる。
theological_decisions:
- issue: τῶν ἀνδρῶνにおける男性限定の数え方
  choice: 「男たちの数」と明示する
  alternative: 「人々の数」または「信じた人々の数」
  rationale: 原文のἀνδρῶνは通常、一般的な人間ではなく男性を指す。この節の数が共同体全体を含むかどうかを断定せず、数え方の男性形を本文に残す。
- issue: ἐπίστευσανの信仰内容・対象
  choice: 「信じた」と簡潔に訳す
  alternative: 「信仰に入った」または「その知らせを信じた」
  rationale: 原文は目的語を明示しないため、キリストへの信仰という文脈上の意味を認めつつも、本文では対象や神学的定式を補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「みことば」は聖書語として通用する一方、意味範囲を脚注で補った。「男たち」は原文の性別指定を保持し、概数は「およそ」で示した。
