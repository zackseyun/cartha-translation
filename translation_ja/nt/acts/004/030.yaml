  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: ja
  text: あなたが癒やしのために御手を伸ばされるときに、あなたの聖なるしもべ[a]イエスの名によって、しるしと不思議な業が起こるようにしてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの聖なる子イエス」とも訳せる。ギリシア語のパイスは「子」と「しもべ」のいずれも意味し得るが、ここでは使徒言行録に見られるイザヤ書の「主のしもべ」の表現を踏まえ、「しもべ」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ τὴν χεῖρά σου ἐκτείνειν σε
  choice: あなたが御手を伸ばし
  rationale: ἐν τῷ＋不定詞の同時的・状況的な意味を文脈に即して表した。「御手」は神の働きと力を示す聖書的表現を保つ。
- source_word: εἰς ἴασιν
  choice: 癒やしのために
  rationale: εἰς＋対格が示す目的を明確にし、ἴασιςを自然な現代日本語で表した。
- source_word: σημεῖα καὶ τέρατα
  choice: しるしと不思議な業
  rationale: 使徒言行録で繰り返される定型的な組み合わせを保ちつつ、τέραταを単なる感情としての「驚き」と誤解しにくい形にした。
- source_word: γίνεσθαι
  choice: 起こるようにしてください
  rationale: 祈願文の統語に合わせ、出来事が生じることを願う意味を自然な日本語で示した。神が直接それを『行う』と原文以上に限定しない。
- source_word: διὰ τοῦ ὀνόματος
  choice: 名によって
  rationale: διά＋属格の媒介・手段を表し、「名」に伴う権威と働きという聖書的含意を説明的に言い換えず保持した。
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: あなたの聖なるしもべイエス
  rationale: παῖςには「子」と「しもべ」の両義があるが、使徒言行録3章以来のイザヤの主のしもべへの響きを踏まえ、本文では「しもべ」とした。
theological_decisions:
- issue: イエスに用いられたπαῖςの訳
  choice: しもべ
  alternative: 子
  rationale: 語義上は両方が可能だが、この箇所と使徒言行録3章にはイザヤの「主のしもべ」の言語との関連が認められるため、「しもべ」を優先した。語彙上の曖昧さは脚注に残した。
- issue: しるしと不思議な業の行為主体
  choice: 起こるようにしてください
  alternative: 行われるようにしてください
  rationale: γίνεσθαιは「生じる、起こる」を表し、祈り全体では神の働きが前提にある一方、受動表現によって原文に明示されない行為主体を補いすぎないようにした。
translation_notes:
  register: 明瞭で現代的ながら祈りにふさわしい格調を保った。「御手」「しもべ」は聖書的な響きを残し、「癒やし」「しるしと不思議な業」は一般読者にも理解できる表現とした。脚注記号[a]は曖昧なπαῖςの訳語に対応する文末に置いた。
