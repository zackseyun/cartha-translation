  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: ja
  text: もし私たちが今日、体の弱い人に施した善い行い、すなわちこの人が何によって癒やされたかについて取り調べを受けているのなら、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「救われた」または「健やかにされた」。ギリシア語の動詞には、救うこと、助け出すこと、癒やすことの意味がある。ここでは直近の文脈が身体の癒やしを指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: 取り調べを受けている
  rationale: 司法的・公的な尋問の含みを保ちつつ、「裁判にかけられている」ほど意味を限定せず、現代日本語として明瞭に表した。
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: 善い行いについて
  rationale: ἐπί＋与格が示す取り調べの根拠・事由を表し、人に益を与える行為を意味する εὐεργεσία の肯定的な響きと、善行が問題にされる皮肉を保った。
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: 病弱な人に行った
  rationale: 属格句を善い行いの受益者として自然な日本語に組み込み、ἀσθενής の身体的な弱さを示しつつ、本文以上に具体的な障害名へ限定しなかった。
- source_word: ἐν τίνι
  choice: 何によって
  rationale: 手段・媒介・働き手のいずれにも開かれたギリシア語の表現を保ち、次節が答えを明らかにする余地を残した。
- source_word: σέσωσται
  choice: 癒やされた
  rationale: 直近の文脈では足の不自由だった人の身体的回復を指すため自然な訳とした。ただし σῴζω の「救う」という広い意味は脚注で保持した。
theological_decisions:
- issue: 癒やしの文脈における σέσωσται（σῴζω）の訳
  choice: 癒やされた
  alternative: 救われた／健やかにされた
  rationale: この節の直接の指示対象は身体を回復した人なので、本文では身体的治癒を明確にした。一方、使徒言行録で重要な「救い」との語義的重なりを消さないよう脚注に別訳を示し、神学的な含みを過度に限定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「もし～のであれば」は次節へ続く条件節として未完の構造を保つ。「この人」を残して原文の指示語を反映した。
