  to: 信じた人々の集まりは、心も魂も一つであった[a]。だれ一人として、自分の持ち物を自分だけのものだとは言わず[b]、すべてのものが彼らの間で共有されていた。
  rationale: 本文は、πλῆθοςに対応する語を「群れ」から自然な「集まり」に改めた。脚注aはψυχήを「思い」と置換していたため、「魂」を保つ別訳に修正した。それ以外は、原文の継続的な叙述と、排他的所有を主張しない共有の描写を適切に伝えているため維持した。
