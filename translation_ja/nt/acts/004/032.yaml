  source_fidelity: 原文の主要な意味内容はおおむね正確に反映している。「自分だけのもの」はἴδιονの排他的・私的な含意を適切に表し、共有を制度論として過度に解釈していない。ただし、πλῆθοςを「群れ」とするのは日本語では不自然で、場合によっては動物の群れを連想させうる。
  naturalness: 「信じた人々の群れ」より「信じた人々の集まり」のほうが、明瞭な現代標準日本語として自然であり、πλῆθοςが指す一団・多数の人々にもよく対応する。本文の他の部分は平明で自然である。
  terminology: 「心」「魂」「自分だけのもの」「共有」は、原文の比喩、ψυχή、ἴδιον、κοινάをそれぞれ過度に説明せずに保っている。脚注aの「心と思い」はψυχή（魂／命）を「思い」に置き換えるため、代案としても適切でない。
