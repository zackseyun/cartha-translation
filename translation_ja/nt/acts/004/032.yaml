id: ACT.4.32
reference: Acts 4:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: ja
  text: 信じた人々の集まりは、心も魂も一つであった[a]。だれ一人として、自分の持ち物を自分だけのものだとは言わず[b]、すべてのものが彼らの間で共有されていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「心も魂も一致していた」。
    reason: 「心も魂も一つ」という比喩的表現を、原文の二つの名詞を保ちながら自然に言い換える選択肢を示すため。
  - marker: b
    text: 「自分の持ち物」に当たるギリシア語は単数形で、共同体の一人一人について述べている。別訳「自分の所有物を自分のものだと主張せず」。
    reason: 原文の分配的な単数表現と、ἔλεγεν（言っていた）をより含意的に表す別訳を示すため。
lexical_decisions:
- source_word: πλήθους
  choice: 群れ
  rationale: かなりの人数から成る集団を表す語であり、文脈上の共同体として自然な現代日本語にした。
- source_word: τῶν πιστευσάντων
  choice: 信じた人々
  rationale: アオリスト分詞の動詞性を保ち、単に「信者たち」と名詞化せずに表した。
- source_word: καρδία καὶ ψυχὴ μία
  choice: 心も魂も一つ
  rationale: 内面と生そのものに及ぶ深い一致を示す二つの名詞を保ち、比喩を説明的な表現に置き換えなかった。
- source_word: οὐδὲ εἷς
  choice: だれ一人…ず
  rationale: 一人の例外もなかったという強調を、自然な日本語の否定構文で表した。
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: 自分の持ち物
  rationale: 各人に属する所有物を指す属格表現と分配的単数を、性別を限定しない自然な日本語で表した。
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: 自分だけのものだとは言わず
  rationale: ἴδιονが示す私有・専有の含みを「自分だけのもの」で表し、「放棄した」など本文にない行為を加えなかった。
- source_word: πάντα κοινά
  choice: すべてのものが彼らの間で共有されていた
  rationale: 「すべてが彼らに共通であった」という述語構造と共同性を明瞭にしつつ、現代日本語として理解しやすくした。
theological_decisions:
- issue: エルサレムの信徒共同体における財産の共有
  choice: 各人が所有物を自分だけのものと見なさず、共同体内で共有していたという記述として訳した。
  alternative: 「すべてを共同所有していた」と制度的所有形態を明示する訳、または共有の意味を弱める訳。
  rationale: 本文は排他的な所有の主張がなかったことと、すべてが κοινά であったことを述べるが、後代の政治制度や教会制度を特定してはいない。その緊張を解消せずに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「心」「魂」「共有」という原文の主要語を保った。文体は平明かつ品位ある叙述調とし、特定の政治思想・教派的制度を連想させる専門語は避けた。
