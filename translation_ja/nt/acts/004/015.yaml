    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: 命じると
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、権威ある命令とその後の展開を自然な日本語で示した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の公のやり取りから、議会内部の協議へ場面が転じる軽い対照を表す。
- source_word: αὐτοὺς
  choice: 二人に
  rationale: 指示対象であるペトロとヨハネを、文脈上明瞭で自然な日本語にした。
- source_word: ἔξω τοῦ συνεδρίου
  choice: 議会の外へ
  rationale: συνέδριονはユダヤ人の統治評議会またはその会議を指し得る。ここでは二人が会議の場から退出させられる意味を簡潔に表した。
- source_word: ἀπελθεῖν
  choice: 出るよう
  rationale: κελεύσαντεςを補う不定詞として、ἔξωと合わせ「外へ出るよう」と自然に訳した。
- source_word: συνέβαλλον
  choice: 協議し始めた
  rationale: この文脈では互いに意見を出し合い検討する意味。未完了過去の進行性と場面の開始を自然に表した。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 相互に協議することを示す簡潔な日本語表現。
