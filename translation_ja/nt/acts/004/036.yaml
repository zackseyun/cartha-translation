  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: ja
  text: さて、使徒たちにバルナバと呼ばれたヨセフ――バルナバとは、訳せば「励ましの子」[a]という意味である――は、レビ人で、キプロス生まれであり、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「勧めの子」または「慰めの子」とも訳せる。ギリシア語の語には、励まし、勧め、慰めという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: ヨセフ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、共同体全体の記述から具体例へ移る穏やかな談話上の転換を示す。
- source_word: ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: 使徒たちにバルナバと呼ばれていた
  rationale: ἐπικληθεὶςは付加された呼び名を表し、ἀπόはその呼称の発信元が使徒たちであることを示す。自然な日本語の受け身で表現した。
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: バルナバとは、訳せば……という意味である
  rationale: セム語系の名についてルカがギリシア語で説明する注釈的な働きを明確にした。
- source_word: υἱὸς παρακλήσεως
  choice: 励ましの子
  rationale: υἱόςの比喩的な『子』を保ち、παράκλησιςの広い意味領域のうち、現代日本語で包括的かつ分かりやすい『励まし』を本文に採用した。
- source_word: Λευίτης
  choice: レビ人
  rationale: 部族的・宗教的帰属を示す定着した日本語表現。
- source_word: Κύπριος τῷ γένει
  choice: キプロス生まれ
  rationale: τῷ γένειが表す出生・出自を簡潔で自然な日本語にした。単なる後代の国籍概念には狭めていない。
theological_decisions:
- issue: バルナバの名の説明におけるπαράκλησιςの意味
  choice: 本文では「励まし」とする
  alternative: 「勧め」または「慰め」
  rationale: παράκλησιςには、人を励ますこと、強く勧めること、慰めることが含まれ得る。この節だけでは一つに限定できないため、本文には広く理解しやすい語を置き、他の可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文が次節へ続く構文であるため、完結させず読点で終えた。挿入説明はダッシュで区切り、長い主語の構造を読み取りやすくした。
