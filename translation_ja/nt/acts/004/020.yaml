  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: ja
  text: 私たちが見たこと、聞いたことを、語らずにはいられないのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちは、見たこと、聞いたことを語らないことができません」。
    reason: 原文の否定を重ねた構造を示し、本文の自然な日本語との対応を明らかにするため。
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: 語らずにはいられない
  rationale: 直訳的な二重否定「語らないことができない」の意味を保ちつつ、現代日本語で自然に、語ることを抑えられないという強い不能を表す。単なる意志や決意には弱めない。
- source_word: γὰρ
  choice: のです
  rationale: 前節の命令に応じて理由を示す説明的な接続関係を、日本語では文末の「のです」によって自然に表した。独立した「なぜなら」は、この短い発言ではやや重い。
- source_word: ἡμεῖς
  choice: 私たちは／自分たちが
  rationale: 明示された主語の軽い強調を「私たちは」で示し、関係節内では再帰的な「自分たちが」により、使徒自身の目撃と聴聞であることを明確にした。
- source_word: ἃ
  choice: こと
  rationale: 中性複数関係代名詞が指す、見聞した事柄や内容を自然な日本語の「こと」で表した。
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: 見たこと、聞いたこと
  rationale: 二つのアオリストを並列の過去形として訳し、目撃と聴聞に基づく証言の力を保った。
- source_word: λαλεῖν
  choice: 語る
  rationale: 単に発声するのではなく、見聞した事柄を告げ知らせる文脈に適する、自然で品位のある語を選んだ。
theological_decisions:
- issue: 使徒たちが語ることの不可避性
  choice: 語らずにはいられない
  alternative: 語らないつもりはない／語るべきである
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν は、単なる拒否や義務の表明ではなく、沈黙することができないという不能を直接表すため、その緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語。公の場での使徒の応答にふさわしい品位を保ちながら、不自然な二重否定は本文で慣用表現に整えた。「のです」により前文への理由説明を示す。
