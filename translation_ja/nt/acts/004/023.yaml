  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: ja
  text: 釈放された二人は、自分たちの仲間[a]のところへ行き、祭司長たちと長老たちが二人に言ったことをすべて報告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「自分たちに属する人々」。または「自分たちの人々」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: 釈放されると
  rationale: アオリスト受動分詞で、主動詞に先立つ出来事を示す。拘束下から解かれた法的・行政的文脈に「釈放」が適し、「すると」で自然に時間的前後関係を表した。
- source_word: δὲ
  choice: 独立した訳語を置かない
  rationale: 弱い接続辞であり、日本語では冒頭の「釈放されると」が叙述の連続を十分に示すため、別に「さて」「そして」を加えなかった。
- source_word: ἦλθον πρὸς
  choice: のところへ行き
  rationale: ἔρχομαι は視点により「来る／行く」と訳し得るが、ここでは物語の視点が目的地に固定されていないため、「行き」が自然である。πρός＋対格の方向性も表している。
- source_word: τοὺς ἰδίους
  choice: 自分たちの仲間
  rationale: 直訳は「自分たちの者たち」。ここではペトロとヨハネが属する信徒共同体・同輩を指すが、「仲間」は家族や民族に限定せず、文脈上の結びつきを自然に表せる。原文の省略的表現は脚注で示した。
- source_word: ἀπήγγειλαν
  choice: 報告した
  rationale: 情報を持ち帰って伝える意味であり、当局から言われた内容を共同体に知らせる場面に「報告した」が適切である。
- source_word: ὅσα
  choice: ことをすべて
  rationale: 関係代名詞の包括的な意味を、日本語として自然な「言ったことをすべて」で表した。
- source_word: πρὸς αὐτοὺς
  choice: 二人に
  rationale: λέγω とともに用いられた πρός＋対格は発話の相手を示す。日本語では「彼らに」だと直前の複数集団と混同しやすいため、文脈上の指示対象であるペトロとヨハネを「二人」と明示した。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: ユダヤの指導的祭司層を表す複数形の標準的な訳。複数の大祭司が同時に在職したという意味に読ませない。
- source_word: οἱ πρεσβύτεροι
  choice: 長老たち
  rationale: 単なる年長者ではなく、ここでは公的に認められたユダヤ人指導者を指すため、制度的呼称である「長老たち」とした。
- source_word: εἶπαν
  choice: 言った
  rationale: ギリシア語のアオリストを簡潔な過去形で表した。日本語では報告内容を示す従属節と主節の関係から先行性が明らかであり、過去完了に相当する補足表現は不要である。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「彼ら」の連続による指示の曖昧さを避け、文脈上ペトロとヨハネを指す箇所は「二人」とした。τοὺς ἰδίους の指示範囲は本文で「仲間」と自然に表しつつ、原文の簡潔さを脚注に残した。
