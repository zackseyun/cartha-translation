  text: その時、ペトロは聖霊に満たされて、彼らに言った。「民の支配者たち、長老たちよ、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 直前の問いかけを受けて次の出来事を導く時間的な談話標識。現代日本語の物語文として自然である。
- source_word: Πέτρος
  choice: ペトロ
  rationale: ギリシア語名 Πέτρος の標準的な日本語表記。
- source_word: πλησθεὶς
  choice: 満たされて
  rationale: πίμπλημι のアオリスト受動分詞。聖霊を満たす内容として示す属格構文に合わせ、受動の意味を自然な日本語で保つ。
- source_word: πνεύματος ἁγίου
  choice: 聖霊に
  rationale: πλησθεὶς と結びついて、何に満たされたかを示す。使徒言行録の文脈では神の聖霊を指す。
- source_word: εἶπεν πρὸς αὐτούς
  choice: 彼らに言った
  rationale: 相手に向けた発言を表す簡潔で自然な叙述。
- source_word: Ἄρχοντες τοῦ λαοῦ
  choice: 民の指導者たち
  rationale: ἄρχοντες は統治・司法上の権威を持つ者たちを指す。「支配者」より呼びかけとして自然で、「指導者」によって公的地位を表す。λαός はここではイスラエルの民を指すが、原文どおり明示的な限定を加えない。
- source_word: πρεσβύτεροι
  choice: 長老たち
  rationale: 単に年長の男性ではなく、公認された共同体の役職者を指す文脈なので「長老」とする。
theological_decisions:
- issue: πνεύματος ἁγίου の指示対象
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 使徒言行録では証言と発言のために人を満たす神の霊を指しており、日本語聖書で確立した固有の呼称「聖霊」が文脈に適する。
- issue: πλησθεὶς の時間的・論理的関係
  choice: 聖霊に満たされて
  alternative: 聖霊に満たされると
  rationale: 分詞は主動詞に先立つ状況を表し得るが、因果や明確な時間順序を必要以上に確定せず、付帯状況として自然に表す。
translation_notes:
  register: 明快な現代標準日本語としつつ、公的な場での荘重な呼びかけを保った。節が次節へ続くため、末尾は閉じ引用符を置かず、呼びかけの継続を示す。
