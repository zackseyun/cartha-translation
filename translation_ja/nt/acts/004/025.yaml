id: ACT.4.25
reference: Acts 4:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: ja
  text: あなたは[a]、聖霊を通して、私たちの父であり、あなたのしもべであるダビデの口により、こう言われました。\n\n「なぜ諸国の民は荒れ狂い、\n\nもろもろの民はむなしいことを企てたのか。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「私たちの父」を欠いています。その場合、導入部は「あなたは、聖霊を通して、あなたのしもべダビデの口により、こう言われました」となります。
    reason: textual_variant
  - marker: b
    text: あるいは「むなしいことを思い巡らした」。このギリシア語動詞は「思い巡らす」という意味にも、文脈によって「企てる」という意味にもなります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: あなたは
  rationale: 前節で呼びかけられている神を受ける関係表現として、日本語では主語を明示する「あなたは」が自然である。本文上不確かな「私たちの父」の句は脚注に残した。
- source_word: διὰ ⸂πνεύματος ἁγίου⸃
  choice: 聖霊によって
  rationale: 属格を伴うδιάが示す手段・媒介を簡潔に表し、聖霊への明示的な言及も保持する。
- source_word: στόματος Δαυὶδ
  choice: ダビデの口を通して
  rationale: 預言の言葉がダビデを媒介として語られたという聖書的表現を、現代日本語で理解しやすく訳した。
- source_word: παιδός σου
  choice: あなたのしもべ
  rationale: παῖςには「子」と「しもべ」の両義があるが、ここでは神に仕えるダビデを指すため「しもべ」が文脈に適する。
- source_word: εἰπών
  choice: こう言われました
  rationale: 引用を導くアオリスト分詞を、日本語として自然な定形動詞にした。神への敬意を表す文脈に合わせて敬語を用いた。
- source_word: Ἱνατί
  choice: なぜ
  rationale: 理由を問う疑問詞を簡潔かつ直接的に訳した。
- source_word: ἐφρύαξαν
  choice: 荒れ狂い
  rationale: 諸国の反抗的で騒然とした動きを表す語の強さを保持した。
- source_word: ἔθνη
  choice: 諸国の民
  rationale: ここでは宗教社会的区分としての「異邦人」より、詩篇の背景に沿う広い意味の諸国民を指す。
- source_word: λαοὶ
  choice: もろもろの民
  rationale: 複数形と詩的並行法を保ちつつ、「諸国の民」との不自然な反復を避けた。
- source_word: ἐμελέτησαν
  choice: 企てた
  rationale: 本来「思い巡らす」ことも表すが、敵対する諸国民という文脈では計画・画策の意味が自然である。語義の幅は脚注に示した。
- source_word: κενά
  choice: むなしいこと
  rationale: 空虚さと結局は成就しない無益さの双方を含む、自然で格調ある表現である。
theological_decisions:
- issue: 引用導入部の本文異同
  choice: 本文では「私たちの父」を含めず、前節の神を受けて「あなたは」と訳す。
  alternative: 「私たちの父、あなたのしもべダビデの口を通し、聖霊によって、こう言われました」とする。
  rationale: 「τοῦ πατρὸς ἡμῶν」は本文上不確かで、SBLGNTの配置も難解である。争点を本文で不自然に断定せず、異読を脚注に明記して可読性と検証可能性を両立させた。
- issue: ἐμελέτησανの文脈的意味
  choice: 敵対的な計画を示す「企てた」とする。
  alternative: 中立的・内面的な行為として「思い巡らした」とする。
  rationale: 詩篇引用における諸国民の反抗という文脈では「企てた」が適するが、動詞本来の語義の幅を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、詩篇引用には「諸国の民」「もろもろの民」「むなしい」など適度に格調ある語を用いた。神への直接の呼びかけを受ける文脈なので「言われました」と敬意を示した。
