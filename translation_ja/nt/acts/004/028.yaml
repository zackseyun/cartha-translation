translation:
  language: ja
  text: あなたの御手と御計画が、起こるようにあらかじめ定めておられたすべてのことを行うためでした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「前もって決めておられた」とも訳せる。ギリシア語の動詞は、事前に決定することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: 行うためでした
  rationale: 不定詞の目的・結果の含みを、直前の「集まった」に自然につながる形で表した。「行う」は原語の基本的な意味を保つ。
- source_word: ὅσα
  choice: ことを、すべて
  rationale: 中性複数の包括的な範囲を、自然な現代日本語で明確に表した。
- source_word: χείρ
  choice: 御手
  rationale: 神の力や働きを指す具体的な聖書的比喩を保ちつつ、神に対する敬意を自然に示した。
- source_word: βουλή
  choice: 御計画
  rationale: 熟慮された意図・企図を表す語として明瞭であり、「みこころ」よりも計画性を具体的に伝える。
- source_word: προώρισεν
  choice: あらかじめ定めておられた
  rationale: 事前の決定という原語の強い意味を保つ。日本語では「予定していた」よりも、単なる見込みではない決定性を明確にできる。
- source_word: γενέσθαι
  choice: 起こるようにと
  rationale: ここでは出来事が生じることを指すため、事象的な意味を自然な日本語で表した。
theological_decisions:
- issue: 神の主権と人間の責任に関わる προώρισεν の訳
  choice: あらかじめ定めておられた
  alternative: 前もって決めておられた
  rationale: 神がイエスの受難に関する出来事を事前に定めていたという本文の強い主張を保つ一方、それが人間の責任とどう両立するかについては説明を加えず、本文の緊張をそのまま残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御手」は定着した聖書的比喩として保持し、それ以外は過度に古風な表現を避けた。文末は直前の文脈にある「集まった」を受ける目的表現として整えた。
