  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: ja
  text: また、癒やされたその人が二人と一緒に立っているのを見て、彼らは何も反論できなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「それに反論することができなかった」、あるいは「反対して言えることが何もなかった」。
    reason: ἀντειπεῖνは単なる返答ではなく、反対して述べること、反論することを表しうるため。
lexical_decisions:
- source_word: τε
  choice: また
  rationale: 直前の叙述を受けて展開を続ける接続小辞。日本語では過度に強調せず、自然に連結する「また」とした。
- source_word: τὸν ἄνθρωπον
  choice: その人
  rationale: 前の文脈ですでに特定されている、癒やされた男性を指す。現代日本語では「その人」が自然であり、性別は文脈から明らかである。
- source_word: βλέποντες
  choice: 見て
  rationale: 主動詞と同時の状況を表す現在分詞を、自然な連用形で表した。
- source_word: σὺν αὐτοῖς
  choice: 二人と一緒に
  rationale: σύνは同行・同席を表す。αὐτοῖςが文脈上ペトロとヨハネを指すため、曖昧な「彼ら」より自然で明確な「二人」とした。
- source_word: ἑστῶτα
  choice: 立っている
  rationale: ἵστημιの完了分詞が示す、立った状態にあることを自然な日本語で表した。
- source_word: τεθεραπευμένον
  choice: 癒やされた
  rationale: θεραπεύωの完了受動分詞で、すでに癒やされ、その結果が続いている人を指す。奇跡的治癒の文脈に適した「癒やす」を用いた。
- source_word: οὐδὲν εἶχον ἀντειπεῖν
  choice: 何も言い返すことができなかった
  rationale: 直訳的には「反対して言うべきことを何も持たなかった」。反論・反対の応答ができないという意味を、自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、議会側が目の前の証拠によって反論できなくなったという叙述の緊張を保った。「癒やされた」は聖書の奇跡物語にふさわしい品位を保ちつつ、一般読者にも理解しやすい表現である。
