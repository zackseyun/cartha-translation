  to: 地上の王たちは立ち構え、支配者たちは共に集まり、主とそのメシアに敵対した。
  rationale: 未完結の接続表現を「敵対した」という終止述語に改め、κατάが二度示す主とそのメシアへの敵対を自然な一文で表した。「共に集まり」はἐπὶ τὸ αὐτόの共同性を保持する。「メシア」は詩篇2篇の「油を注がれた者」という称号的・旧約的背景を保ち、脚注で「キリスト」を代替訳として示す。
