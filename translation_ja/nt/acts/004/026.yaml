  terminology: 「主」「メシア」は適切である。αὐτοῦは「そのメシア」として主を先行詞に明瞭に示せる。脚注の「主のクリストス」はギリシア語原形の説明として不正確かつ日本語としても不自然なので、χριστόςの基本義と句全体の意味を正確に説明する。
