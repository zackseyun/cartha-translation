  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: ja
  text: 地上の王たちは立ち構え、支配者たちは共に集まり、主とそのメシアに敵対した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέστησαν
  choice: 立ち構え
  rationale: 単に立っていたというより、詩篇2篇2節を踏まえた意図的な敵対姿勢を表すため。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: βασιλεῖςの具体的な政治的称号を保ち、γῆはこの文脈で世界的な広がりを持つため「地上」とした。
- source_word: οἱ ἄρχοντες
  choice: 支配者たち
  rationale: 王たちとの並行関係を保ちつつ、統治権を持つ者という意味を明確に伝える。
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: 一つに集まった
  rationale: 受動形を日本語で不自然にしない範囲で表し、同じ目的のもとに結集した含みを保つ。
- source_word: κατὰ
  choice: 逆らい
  rationale: 二度の前置詞が示す敵対的な対抗関係を、明瞭で自然な日本語にした。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 神を指す聖書的称号としての重みを保つ。
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: 主のメシア
  rationale: αὐτοῦが主を指す関係を明示し、Χριστόςが詩篇引用において称号として機能することを表す。
theological_decisions:
- issue: 詩篇2篇の引用におけるΧριστόςの訳語
  choice: メシア
  alternative: キリスト／油を注がれた者
  rationale: ここでは固有名のような用法よりも、神によって立てられた「油を注がれた者」という旧約的称号の意味が前面に出ているため。「キリスト」も新約で定着した同じ語の訳として注記する。
- issue: αὐτοῦが示す所属関係
  choice: 主のメシア
  alternative: その方のメシア
  rationale: 代名詞の指示対象を日本語で明瞭にしつつ、メシアが主に属し、主によって立てられた者であるという原文の関係を保つ。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、詩篇引用としての荘重さと並行表現を保った。「立ち構え」は敵対の意図を、「一つに集まった」は結束を自然に表す。
