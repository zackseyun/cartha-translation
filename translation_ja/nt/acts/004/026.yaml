  source_fidelity: 原文の政治的並行「地上の王たち／支配者たち」、敵対の対象「主とそのメシア」、および詩篇2篇の引用という枠組みは適切に捉えている。「立ち構え」もπαρέστησανの意図的な敵対姿勢をよく表す。ただし、現行の末尾「主に逆らい、主のメシアに逆らって。」は日本語として述語が完結せず、原文の文としての完結性を損なう。
