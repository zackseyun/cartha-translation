source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: ja
  text: 畑を持っていた彼は、それを売り、代金を持って来て、使徒たちの足もとに置いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: 自分の畑を持っていたので
  rationale: 属格独立構文が示す背景的な事情を、自然な現代日本語で表した。ὑπάρχω と与格 αὐτῷ の組み合わせは、彼に畑が属していたことを表す。「ので」は文脈上の事情・契機を示すが、強い因果関係までは含意しない。
- source_word: ἀγροῦ
  choice: 畑
  rationale: ἀγρός の具体的な土地のイメージを保つ最も直接的な訳語。「土地」も可能だが、本文ではより具体的な「畑」とした。
- source_word: πωλήσας
  choice: それを売り
  rationale: アオリスト分詞が後続する主要動詞に先行する行為を表すため、連用形によって自然に順序を示した。「それ」は直前の畑を受ける。
- source_word: ἤνεγκεν
  choice: 持って来て
  rationale: φέρω の移動と搬入の意味を自然な日本語で示し、売却代金を使徒たちのもとへ届けたことを表す。
- source_word: τὸ χρῆμα
  choice: その代金
  rationale: χρῆμα は一般には「金銭」だが、ここでは畑を売って得た金を指す。「代金」は文脈上の指示対象を明確にしつつ、売却額の全額か一部かについて本文以上のことを明言しない。
- source_word: ἔθηκεν
  choice: 置いた
  rationale: τίθημι の基本的な意味を簡潔に表し、足もとに実際に置くという具体的な描写を保った。
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: 使徒たちの足もとに
  rationale: 原文の空間的で象徴性も帯びる表現をそのまま保った。「使徒たちに渡した」と意訳せず、献金を彼らの管理に委ねる場面の具体性を残した。
theological_decisions:
- issue: 金銭を使徒的権威のもとに差し出す物理的表現を保つか
  choice: 「使徒たちの足もとに置いた」と具体的な表現を維持した。
  alternative: 「使徒たちに渡した」と意味だけを訳す。
  rationale: 原文は実際の提示行為を描くと同時に、その管理を使徒たちに委ねる含みを持つ。具体的な比喩・動作を保つことで、余分な教会制度上の主張を加えずに物語の力を伝えられる。
- issue: 「その代金」が売却額の全額であると訳文で断定するか
  choice: 全額を意味する「売却代金のすべて」などは加えず、「その代金」とした。
  alternative: 「売って得た金をすべて」と明示する。
  rationale: 定冠詞付き τὸ χρῆμα は当該の金銭を指すが、この一節だけでは「全額」という語を明示していないため、本文以上に限定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。物語文として簡潔にしつつ、「使徒たちの足もと」という原文の具体的で荘重な描写を保持した。
