  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: ja
  text: そして彼らを呼び入れ、「イエスの名によって[a]、いっさい語ることも教えることもしてはならない」と命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスの名によって、何一つ口にすることも、教えることもしてはならない」とも訳せる。
    reason: τὸ καθόλουとμὴ φθέγγεσθαιの結び付き方、およびφθέγγομαιの語感についての訳語上の別案を示すため。
lexical_decisions:
- source_word: καλέσαντες αὐτοὺς
  choice: 二人を呼び入れ
  rationale: アオリスト分詞を主動詞に先立つ行為として自然に表した。αὐτούςは文脈上ペトロとヨハネの二人を指し、審議の場へ再び入らせる状況を「呼び入れ」で明確にした。
- source_word: παρήγγειλαν
  choice: 命じた
  rationale: 権威をもって厳しく指示する動詞の力を、現代日本語で簡潔かつ格調を保って表す。
- source_word: τὸ καθόλου
  choice: いっさい
  rationale: 禁止を全面的に強める表現であり、「いっさい」はその強意を自然に伝える。
- source_word: μὴ φθέγγεσθαι
  choice: 語ることもしてはならない
  rationale: φθέγγομαιの「声を発する、語る」という広い意味を保ち、単に特定形式の公的宣教だけに狭めない。
- source_word: μηδὲ διδάσκειν
  choice: 教えることもしてはならない
  rationale: μηδέが加える第二の禁止を「も」で並列し、語ることと教えることの双方が禁じられたことを示す。
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: イエスの名によっては
  rationale: イエスの名を根拠・権威・主題として語り教える意味を含む定型的で自然な表現。「は」によって禁止対象との結び付きを明瞭にした。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 現代日本語で定着した固有名詞の表記を用いた。
theological_decisions:
- issue: イエスに結び付く証言への禁止の範囲
  choice: イエスの名によって語ることと教えることの双方を全面的に禁じる命令として訳す
  alternative: 公の宣教だけを禁じる命令と限定して訳す
  rationale: τὸ καθόλουとμὴ φθέγγεσθαι μηδὲ διδάσκεινの組み合わせは強い包括的禁止を示す。本文にない限定を加えず、発言と教示の両方に及ぶ広さを保った。
- issue: 「イエスの名」の関係
  choice: 「イエスの名によって」とし、権威・根拠・関連の含みを残す
  alternative: 「イエスについて」または「イエスの権威によって」と一義的に明示する
  rationale: ἐπὶ τῷ ὀνόματιは複数の意味合いを帯び得るため、一つに狭めず、日本語の聖書表現としても自然な言い方を採った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、公的な命令場面にふさわしい簡潔で威厳ある調子とした。「いっさい」は漢字を避けて読みやすくし、引用文によって命令内容を明瞭に示した。
