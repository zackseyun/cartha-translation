id: ACT.4.16
reference: Acts 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: ja
  text: 彼らはこう言った。「この者たちをどうしたらよいだろうか。彼らを通して、広く知られたしるしが起こったことは、エルサレムに住むすべての人に明らかであり、私たちもそれを否定できない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: 彼らは言った
  rationale: 前文の動作に伴う現在分詞だが、日本語では独立した叙述として表すほうが自然で、協議の発言内容への導入も明瞭になる。
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: あの者たちをどうすべきだろうか
  rationale: 一人称複数の熟慮的接続法を「どうすべきだろうか」で表した。文脈上はペトロとヨハネを指すが、「者たち」は性別を不必要に強調せず、評議会側の距離を置いた言い方も保つ。
- source_word: ὅτι μὲν γὰρ
  choice: （後続の説明構文で表現）
  rationale: 理由提示と強調を、独立した不自然な「実に、なぜなら」ではなく、「ことは…であり」という日本語の説明構文に織り込んだ。
- source_word: γνωστὸν σημεῖον
  choice: 広く知られたしるし
  rationale: γνωστόςの「知られている、公に認知された」という意味を、後続の「すべての人に明らか」と調和する形で表した。「しるし」はσημεῖονの神学的含意を保つ。
- source_word: γέγονεν
  choice: 行われた
  rationale: この文脈では「しるしが起こった」より自然であり、完了した出来事の現存する結果を後続文が示している。受動的な日本語表現により、行為者を本文以上に特定しない。
- source_word: δι’ αὐτῶν
  choice: 彼らを通して
  rationale: διά＋属格の媒介・手段を保ち、使徒たちを独立した力の源とする含みを避ける。
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: エルサレムに住むすべての人に明らかであり
  rationale: 与格が示す認知の範囲とφανερόνの公然性を、明快で自然な現代日本語で表した。
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: 私たちもそれを否定できない
  rationale: ギリシア語で省略された目的語を直前の事実を指す「それ」で補い、否認不能という意味を明確にした。「も」は、住民に明白である以上、評議会自身にも否定できないという流れを自然に示す。
theological_decisions:
- issue: 公の奇跡という文脈におけるσημεῖονの性質
  choice: しるし
  alternative: 奇跡
  rationale: ルカ文書におけるσημεῖονは、出来事そのものを超えて神の働きを指し示す含みを持つ。「奇跡」と限定せず「しるし」とすることで、原語の神学的幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。評議会内の協議として自然に読めるようにしつつ、原文の理由説明、媒介表現、公然性を保持した。
