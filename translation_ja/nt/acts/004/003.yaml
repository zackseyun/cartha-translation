  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: ja
  text: そして、彼らを捕らえ[a]、翌日まで拘留した[b]。すでに夕方になっていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼らに手をかけ」。ここでは、敵意をもって身柄を押さえることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「監視下に置いた」とも訳せる。原文は拘束して見張ることを述べるが、具体的な収容施設までは示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: 彼らを捕らえ
  rationale: 直訳は「彼らに手をかけ」であり、敵対的な文脈では身柄を押さえることを表す慣用句。現代日本語では「捕らえ」が自然にその意味を伝える。原語の比喩的表現は脚注に残す。
- source_word: αὐτοῖς
  choice: 彼らを
  rationale: 文脈上、ペトロとヨハネを指す複数代名詞。日本語では「捕らえる」の目的語として助詞「を」を用いる。
- source_word: ἔθεντο εἰς τήρησιν
  choice: 拘留した
  rationale: τήρησιςは監視下に置いて身柄を拘束することを表すが、具体的な施設までは特定しない。「拘留した」は法的・公的な身柄拘束を簡潔に示し、「牢に入れた」と過度に限定しない。
- source_word: εἰς τὴν αὔριον
  choice: 翌日まで
  rationale: 物語の時間関係を自然かつ明確に表す。
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: すでに夕方になっていたからである
  rationale: γάρによる理由説明と、ἤδηの「すでに」、ἑσπέραの「夕方」を明示的に保つ。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準日本語を用いつつ、叙事文としての品位を保った。「捕らえ」「拘留した」により行為の公的・強制的性格を自然に示し、原語の慣用表現と施設に関する非限定性は脚注で補った。
