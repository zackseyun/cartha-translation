source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: ja
  text: 二人が人々を教え、イエスにおいて死者の中からの復活を告げ知らせていたので、彼らはひどくいら立っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの場合の、死者の中からの復活を告げ知らせていた」。ギリシア語の「イエスにおいて」は、復活がイエス自身の復活において示されたことを特に指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: ひどくいら立っていた
  rationale: 強い不快感や苛立ちを表す分詞。単なる「困っていた」より感情の強さを示しつつ、「激怒していた」ほど過度に限定しない。
- source_word: διὰ τὸ διδάσκειν
  choice: 教えていたので
  rationale: διάと冠詞付き不定詞が表す原因・理由を、自然な日本語の理由節で示した。
- source_word: αὐτοὺς
  choice: 二人が
  rationale: 直前の文脈で言及されたペトロとヨハネを受ける代名詞であり、日本語で指示対象を明確にするため「二人」とした。固有名を補わず、文脈上の照応を保つ。
- source_word: τὸν λαὸν
  choice: 民を
  rationale: λαόςの集合的な意味を保ち、単なるその場の「群衆」より広い含みを持つ、聖書本文として自然で簡潔な語を選んだ。
- source_word: καταγγέλλειν
  choice: 宣べ伝えていた
  rationale: 公に告知する意味を表し、現代日本語の聖書文体として理解しやすく、一定の品位も保つ。
- source_word: ἐν τῷ Ἰησοῦ
  choice: イエスにあって
  rationale: ἐνの意味を「によって」「イエスの場合に」と一義的に決めず、イエスにおいて示された復活、またはイエスを中心とする復活の宣言という幅を保持する。
- source_word: ἀνάστασιν
  choice: 復活
  rationale: 死から起こされることを表す定着した語であり、本文の神学的重みを自然に伝える。
- source_word: τὴν ἐκ νεκρῶν
  choice: 死者の中からの
  rationale: ἐκ νεκρῶνが字義的には死者たちの中から起こされることを示すため、「死人から」より原文の集合的な含みを明示した。
theological_decisions:
- issue: ἐν τῷ Ἰησοῦと復活宣言との関係
  choice: 「イエスにあって」とし、イエスにおいて復活が示されるという開かれた表現を保つ。
  alternative: 「イエスの場合に」または「イエスによって」
  rationale: ἐνはここで、イエス自身の復活という実例を指すとも、イエスを通して復活が宣言されることを指すとも理解し得るため、本文では解釈を一つに固定しない。
- issue: 「死者の中からの復活」の範囲
  choice: イエス自身の復活と、彼において確証されるより広い復活の宣言の双方を許す。
  alternative: イエス自身の復活だけを指す、または終末の一般的復活だけを指す。
  rationale: 原文はその範囲を明示的に限定しておらず、文脈上重なり得る二つの含意を訳文でも保持する。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、公的な宣言の場面にふさわしい品位を保った。「民」「宣べ伝える」「イエスにあって」は聖書語として定着しているが、全体の構文を簡潔にして理解しやすくした。
