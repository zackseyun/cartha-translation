  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: ja
  text: 彼らの中には、困っている人が一人もいなかった。土地や家を所有していた人は皆、それらを売り、売却した物の代金[a]を持って来ていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「売却された物の価格」。ここでは、売却によって得た代金を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: 一人もいなかった……からである
  rationale: γάρの説明・理由を示す働きを文末の「からである」で表し、οὐδέの強調は「一人も……ない」で自然に再現した。
- source_word: ἐνδεής
  choice: 乏しい人
  rationale: 必要なものを欠いている人を指し、経済的な「貧しい人」だけに意味を狭めない表現とした。
- source_word: ὅσοι
  choice: 人々は皆
  rationale: 土地や家の所有者という範囲に属する人々を包括する語であり、「皆」によってその分配的な広がりを示した。
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: 土地や家を所有している人々
  rationale: κτήτορεςを自然な現代日本語の「所有している人々」とし、χωρίωνは文脈上、畑に限定せず不動産としての区画を表せる「土地」とした。
- source_word: πωλοῦντες ἔφερον
  choice: それを売り……持って来ていた
  rationale: 分詞と未完了過去の組み合わせが示す反復的・継続的な行為を、連用形と「ていた」で自然に表した。
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: 売れた物の代金
  rationale: τιμάςは字義的には「価格」だが、ここでは売却によって得た金額を指すため、日本語では「代金」が明確で自然である。受動分詞の指示対象を限定しすぎないよう「物」とした。
theological_decisions:
- issue: 財産売却の範囲と反復性
  choice: 「所有している人々は皆、それを売り……持って来ていた」
  alternative: 「全員がすべての土地や家を一度に売った」
  rationale: 本文は該当する所有者たちの行動を反復的に描くが、各人が全財産を一度に売却したとは明言しない。そのため、共同体の実践を示しつつ、本文以上の制度化や絶対化を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「からである」によって説明文としての格調と前節との論理的つながりを保った。「乏しい人」は日常的に理解でき、かつ原語の意味を経済的貧困だけに限定しない。
