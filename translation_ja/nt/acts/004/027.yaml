id: ACT.4.27
reference: Acts 4:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: ja
  text: 実際、この都で、ヘロデとポンティオ・ピラトは、異邦人たちとイスラエルの民[b]とともに、あなたが油を注がれたあなたの聖なるしもべイエス[a]に敵対して集められました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの聖なる子イエス」とも訳せる。ギリシア語のπαῖςは「しもべ」と「子」のどちらをも意味し得るが、ここではイザヤ書の「主のしもべ」への響きから「しもべ」とした。
    reason: lexical_alternative
  - marker: b
    text: 「諸国民とイスラエルの民」とも訳せる。ギリシア語では「異邦人／諸国民」も「イスラエルの民」も複数形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: 集められました
  rationale: アオリスト受動態を保ち、敵対する者たちが一つに集結した出来事として表した。受動の行為者は本文が明示しないため、補わない。
- source_word: γὰρ / ἐπ’ ἀληθείας
  choice: 実際
  rationale: 前節の聖書引用を現実の出来事によって説明するつながりと、「まさに事実として」という強調を、自然な一語で表した。
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: この都で
  rationale: 指示表現をそのまま保ち、文脈上のエルサレムを訳文中で明示的に補わない。
- source_word: ἐπὶ τὸν
  choice: …に敵対して
  rationale: 敵意ある集合を表す文脈でのἐπί＋対格の対抗的な意味を明確にした。
- source_word: τὸν ἅγιον παῖδά σου
  choice: あなたの聖なるしもべ
  rationale: παῖςには「しもべ」と「子」の両義があるが、使徒言行録3―4章およびイザヤ書の主のしもべとの響きを踏まえて「しもべ」を本文に採用し、別訳を注記した。
- source_word: ὃν ἔχρισας
  choice: あなたが油を注がれた
  rationale: χρίωの具体的表現を保ち、神による聖別・任命とメシア的な響きを伝える。「メシアとされた」とは意訳しない。
- source_word: ἔθνεσιν
  choice: 異邦人たち
  rationale: イスラエルとの対比が明瞭なため、単なる政治的な「諸国民」よりも民族・宗教的区別を伝える「異邦人」を選んだ。
- source_word: λαοῖς Ἰσραήλ
  choice: イスラエルの諸民
  rationale: λαοῖςが複数形である点を「諸民」で保った。自然な別表現と原語の形は注記した。
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: ヘロデとポンティオ・ピラト
  rationale: 固有名詞を標準的な日本語表記とし、τε καὶの連結を自然な「と」で表した。
theological_decisions:
- issue: イエスを指すπαῖςの訳
  choice: しもべ
  alternative: 子
  rationale: この祈りはイザヤ書の「主のしもべ」を想起させ、使徒言行録内の同語の用法とも一致する。一方、「子」という語義も真正な可能性として脚注に残し、「御子」としての意味を本文に持ち込まない。
- issue: ἔθνεσινとイスラエルの対比
  choice: 異邦人たち
  alternative: 諸国民
  rationale: 「イスラエルの諸民」と並置されているため、ここでは非ユダヤ人を示す対比が前景化している。ただし「諸国民」という原語に近い別訳を脚注で示した。
- issue: 受動態συνήχθησανの行為者
  choice: 集められました
  alternative: 集まりました
  rationale: 原文の受動態を保つ一方、誰が集めたのかは明示しない。神的受動と断定することも、人々の自発的集合へ限定することも避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら祈りの場面にふさわしい品位を保った。「都」「聖なるしもべ」「油を注ぐ」は聖書的な響きを残しつつ理解可能な表現である。語順は日本語として自然になるよう主語群を先に置き、関係節は「イエス」の前に配置した。
