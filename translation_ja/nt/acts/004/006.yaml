  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: ja
  text: （また、大祭司アンナス、カイアファ、ヨハネ、アレクサンドロ、さらに大祭司の家系に属する者は皆[a]、）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大祭司一族の者たち」。
    reason: γένοςは「家系」「一族」「血統」を意味し得るため、自然な別表現を示す。
lexical_decisions:
- source_word: Ἅννας
  choice: アンナ
  rationale: 新約聖書で定着している日本語表記を用い、人名として音写した。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: アンナに同格で付された称号をそのまま訳し、当時の現職者をめぐる歴史的事情によって本文を補正しない。
- source_word: Καϊάφας
  choice: カイアファ
  rationale: 日本語聖書で広く定着している人名表記を採用した。
- source_word: Ἰωάννης
  choice: ヨハネ
  rationale: 日本語聖書で定着している人名表記を採用した。
- source_word: Ἀλέξανδρος
  choice: アレクサンドロ
  rationale: ギリシア語名に対応する、日本語聖書で慣用的な表記を採用した。
- source_word: ὅσοι ἦσαν
  choice: 属する者たちも皆
  rationale: 数量を表す関係表現を自然な現代日本語にしつつ、該当者全員という意味を「皆」で保持した。
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: 大祭司の家系に属する者たち
  rationale: γένοςの家系・血縁集団という意味と、ἀρχιερατικόςの大祭司職との関係を明確かつ自然に表した。単に祭司職に就く者という意味には狭めていない。
theological_decisions:
- issue: 当時の大祭司職をめぐる歴史的事情がある中で、アンナを「大祭司」と呼ぶ表現
  choice: 大祭司アンナ
  alternative: 元大祭司アンナ／祭司長アンナ
  rationale: ギリシア語本文はアンナにὁ ἀρχιερεύςという称号を明示的に付している。「元」を補ったり別の職名に置き換えたりせず、本文にある歴史的緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文が前後の文に続く列挙句であることを、読点と括弧によって保持した。
