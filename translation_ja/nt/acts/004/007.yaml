id: ACT.4.7
reference: Acts 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: ja
  text: そして、二人を会議のただ中に立たせてから、議員たちは尋ねていた[a]。「あなたがたは、何の力によって、あるいは何の名によって、このことをしたのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「尋ね始めた」「問いただした」。ギリシア語の未完了過去は、尋ねる行為が続いていたこと、またはその行為が始まったことを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: 立たせて
  rationale: アオリスト分詞が、尋問に先立つ状況的な動作を表す。「立たせて」は自然な日本語で動作の順序を示す。
- source_word: αὐτοὺς
  choice: 二人を
  rationale: 代名詞の指示対象は直前の文脈におけるペトロとヨハネであり、日本語では「彼らを」より「二人を」のほうが明瞭で自然である。
- source_word: ἐν τῷ μέσῳ
  choice: 中央に
  rationale: 直訳的には「真ん中に」。会議のただ中に立たせた尋問場面を、解釈を加えすぎず簡潔に表す。
- source_word: ἐπυνθάνοντο
  choice: 尋ねていた
  rationale: 未完了過去の継続的な側面を保つ。「尋ね始めた」も可能だが、起動相を確定せず原文の幅を残す。
- source_word: Ἐν ποίᾳ δυνάμει
  choice: 何の力によって
  rationale: ἐν の手段的用法を日本語の「によって」で表し、δύναμις は ἐξουσία と区別して「権威」ではなく「力」とする。
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: また何の名によって
  rationale: ἤ はここでは問いの二つの要素を並べるため、自然な日本語として「また」を用いる。「名によって」は代理権や名の行使を含む聖書的表現を保つ。
- source_word: ἐποιήσατε τοῦτο
  choice: このことをした
  rationale: アオリストを単純な過去として訳し、癒やしやしるしと説明を補わず、原文の指示表現を保つ。
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された二人称代名詞の強調を、主題提示の「は」によって無理なく反映する。
theological_decisions:
- issue: δύναμις を「力」とするか「権威」と解釈するか
  choice: 力
  alternative: 権威
  rationale: 原語は通常「力」を意味する δύναμις であり、後続の「名」が代理的権威の観念を担いうる。両者を区別して原文の問いの構造を保つ。
- issue: 「何の名によって」が名の単なる特定か、権威・代理性を含むか
  choice: 「名によって」と訳し、含意を限定しない
  alternative: 「だれの権威で」と説明的に訳す
  rationale: 「名」は権威、代理、名の呼び求めを含みうるため、説明的な一義化を避けて原文の神学的な幅を保つ。
translation_notes:
  register: 明瞭で現代的ながら、法廷的な尋問場面にふさわしい端正な文体。「中央」は会議の構成員たちのただ中という空間的位置を保ち、「あなたがたは」で原文の代名詞の強調を表した。
