  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: ja
  text: この方こそ、建てる者であるあなたがたによって退けられ、隅の要となる石となられた石です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「隅石」または「頂石」とも訳せる。直訳すると「隅の頭」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: この方こそ
  rationale: 直前の文脈でイエスを強く指し示す指示代名詞。人物への敬意を保つ自然な日本語とし、強調も「こそ」で表した。
- source_word: ὁ λίθος
  choice: 石
  rationale: 詩篇118篇22節への言及と建築の比喩をそのまま保つ標準的な訳語。
- source_word: ὁ ἐξουθενηθεὶς
  choice: 退けられた
  rationale: 価値のないものとして扱う、軽んじるという含みを持つが、建築比喩では採用せず退けるという結果を明瞭に表す。
- source_word: ὑφ’ ὑμῶν
  choice: あなたがたに
  rationale: 二人称複数への直接的な非難を明示する。
- source_word: τῶν οἰκοδόμων
  choice: 建築する者たち
  rationale: 同格的に「あなたがた」を建築者と呼ぶ原文の比喩と語順上の結びつきを保つ。
- source_word: ὁ γενόμενος
  choice: となった方
  rationale: アオリスト分詞が示す地位の転換を自然な日本語で表し、冒頭の「この方」と対応させる。
- source_word: εἰς κεφαλὴν γωνίας
  choice: 隅の親石
  rationale: 字義的には「隅の頭」。建物の要となる顕彰された石を示す慣用句として、日本語の聖書的・建築的表現を用いつつ、建築上の厳密な位置に関する曖昧さは注で示す。
theological_decisions:
- issue: 詩篇118篇22節の建築的比喩
  choice: 隅の親石
  alternative: 隅石、頂石、字義的には「隅の頭」
  rationale: イエスを、建築者に退けられながら要の石とされた方として示す引用の逆転を保つ。基礎の隅石か上部の頂石かという正確な建築上の指示対象は断定せず、代案を注記する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「この方こそ」でペトロの強い同定を表し、建築比喩と詩篇引用の響きを保持した。
