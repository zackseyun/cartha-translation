id: ACT.4.24
reference: Acts 4:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: ja
  text: 彼らはこれを聞くと、心を一つにして神に向かって声を上げ、こう言った。「主権者よ[a]、あなたこそ、天と地と海と、その中のすべてのものを造られた方です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主人よ」とも訳せる。ギリシア語はデスポタで、絶対的な権威を持つ主人を表し、通常「主」と訳されるキュリオスとは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞くと
  rationale: アオリスト分詞の時間的な働きを自然な日本語で表した。「これを」は直前の報告を指す文脈上の補足である。
- source_word: ὁμοθυμαδόν
  choice: 心を一つにして
  rationale: 単に同時に祈ったというだけでなく、一致した思いで行動したことを表す。現代日本語として明瞭で、祈りの文脈にも合う。
- source_word: ἦραν φωνήν
  choice: 声を上げ
  rationale: ギリシア語は単数形の「声」を用い、集団が一つになって祈る様子を描く。日本語でも単数の「声」でそのまとまりを自然に保持できる。
- source_word: πρὸς τὸν θεόν
  choice: 神に向かって
  rationale: 祈りが神に向けられたことを明示する自然な訳。
- source_word: Δέσποτα
  choice: 主権者よ
  rationale: 絶対的な権威を持つ主人・支配者を指す呼称であり、κύριοςに通常対応する「主」との語彙上の違いを保つ。「主人よ」よりも、神への呼びかけとして自然で尊厳がある。
- source_word: σὺ ὁ ποιήσας
  choice: あなたこそ、…造られた方です
  rationale: 代名詞と冠詞付き分詞による強調と同定を、「あなたこそ」と「方です」で明瞭に表した。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: 天と地と海
  rationale: 聖書の創造表現として定着し、原文の三領域を簡潔に保つ。
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: その中のすべてのもの
  rationale: 天・地・海に存在する被造物全体を指す包括的な表現を、明瞭な現代日本語にした。
theological_decisions:
- issue: 神への呼称 Δέσποτα の訳
  choice: 主権者よ
  alternative: 主人よ／主よ
  rationale: 神の絶対的権威を表しつつ、κύριοςの通常訳である「主」との区別を残した。「主人よ」は語義に近いが、現代日本語の祈りでは不自然になりやすい。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、共同体の一致した祈りと神への厳粛な呼びかけを保った。「心を一つにして」は意味を明確にする慣用的表現であり、「主権者よ」はやや改まった語だが、この神への呼称が持つ権威の含意に適している。
