id: ACT.4.22
reference: Acts 4:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: ja
  text: この癒やしのしるし[a]がその身に起こった人は、四十歳を超えていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「癒やしというしるし」、または「癒やしの奇跡」とも訳せる。
    reason: 「しるし」と「癒やし」の属格関係、およびσημεῖονの文脈上の訳し方に複数の自然な可能性があるため。
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: 四十歳を超えていた
  rationale: 比較級を伴う年齢の慣用表現を、現代日本語で自然かつ正確に表した。単に「四十歳だった」ではなく、四十歳より上であることを保持している。
- source_word: γὰρ
  choice: からである
  rationale: 前節の結論を支える説明理由を示す接続機能を、日本語の文末表現で自然に示した。
- source_word: ὁ ἄνθρωπος
  choice: 人
  rationale: 文脈上は特定の男性を指すが、日本語では関係節に続く「人」が簡潔で自然であり、指示対象も明確である。
- source_word: ἐφ’ ὃν
  choice: その身に
  rationale: しるしの出来事がその人に及んだというἐπίの関係を、日本語で理解しやすく表した。
- source_word: γεγόνει
  choice: 起こった
  rationale: γίνομαιの出来事中心の表現を保ち、原文に明示されない行為者を「行われた」などによって補わないようにした。前時性は文脈と「起こった」によって十分に伝わる。
- source_word: τὸ σημεῖον τοῦτο
  choice: この…しるし
  rationale: σημεῖονの証拠的・啓示的な含みを保つため「奇跡」ではなく「しるし」とした。
- source_word: τῆς ἰάσεως
  choice: 癒やしの
  rationale: ἴασιςの意味を明瞭に伝えつつ、属格の結びつきが持つ幅を残した。
theological_decisions:
- issue: 奇跡の文脈におけるσημεῖονの訳語
  choice: しるし
  alternative: 奇跡／不思議な業
  rationale: ルカがこの出来事を単なる驚異ではなく、意味を指し示す出来事として記す語感を保持するため。
- issue: γεγόνειにおける行為者の明示
  choice: 起こった
  alternative: 行われた／なされた
  rationale: 原文は行為者を文法上明示していないため、神または使徒の働きという文脈的理解を訳文そのものに過度に織り込まず、出来事に焦点を置いた。
- issue: τῆς ἰάσεωςとσημεῖονの関係
  choice: 癒やしのしるし
  alternative: 癒やしというしるし／癒やしの奇跡
  rationale: 属格の関係を簡潔に保ち、「癒やしを内容とするしるし」と「癒やしによって示されたしるし」の双方に開かれた表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説明を示すγάρは文末の「からである」で表した。「その身に」はやや品位を保ちながらも一般読者に理解できる表現であり、原文のἐφ’ ὃνの関係を不自然な直訳にせず保持している。
