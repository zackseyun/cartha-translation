  source_fidelity: 「四十歳を超えていた」はἐτῶν ... πλειόνων τεσσεράκονταを正確に表す。「この癒やしのしるし」はτὸ σημεῖον τοῦτο τῆς ἰάσεωςの「しるし」を保持し、「その身に起こった」はἐφ’ ὃν γεγόνειの、当人に生じた出来事という焦点を損なわない。「からである」はγάρの前節への説明的なつながりを適切に反映している。
  naturalness: 全体として明瞭な現代標準日本語である。「その身に」はやや格調のある言い方だが、不自然ではなく、当該のしるしがその人に及んだことを簡潔に示している。
  terminology: 「癒やし」「しるし」は一貫して適切であり、σημεῖονを単に「奇跡」と限定しない訳語選択は原文の含意に忠実である。脚注も本文の訳を補助し、本文の意味を変更していない。
