  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: ja
  text: 主よ、そして今、彼らの脅しに目を留め、あなたのしもべたち[a]が少しも恐れずにあなたのことばを語れるようにしてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの奴隷たち」とも訳せる。ギリシア語のドゥーロスは、主人に属する者を指す。ここでは神にへりくだって仕える祈りの文脈から「しもべたち」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: 今
  rationale: 祈りがこれまでの出来事と聖書の引用から現在の願いへ移ることを示す慣用的な表現。日本語では接続詞を明示せず「今」とするのが自然である。
- source_word: κύριε
  choice: 主よ
  rationale: 神への直接の呼びかけであり、新約聖書の祈りの語調に合う。
- source_word: ἔπιδε ἐπὶ
  choice: 目を留め
  rationale: 単に見るだけでなく、脅しに注意を向けて顧みるよう願う表現。原文の視覚的比喩と祈願の調子を保つ。
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: 彼らの脅し
  rationale: 複数形は、日本語では集合的な「脅し」で自然に表せる。
- source_word: δὸς
  choice: できるようにしてください
  rationale: 直訳は「与えてください」だが、後続の不定詞が示す行為を可能にしてほしいという祈願を、自然な現代日本語で表す。
- source_word: τοῖς δούλοις σου
  choice: あなたのしもべたち
  rationale: 神に属し、従って仕える者という関係を表す。祈りの文脈では「しもべ」が自然だが、原語が隷属・所有の含意を持ち得ることを脚注で示す。
- source_word: μετὰ παρρησίας πάσης
  choice: あらゆる大胆さをもって
  rationale: παρρησίαの恐れのない率直さ・大胆さを表し、πάσηςの強意も保持する。
- source_word: λαλεῖν
  choice: 語れる
  rationale: 基本義である「話す、語る」を保つ。「宣べ伝える」とすると原文以上に宣教的意味を明示するため避ける。
- source_word: τὸν λόγον σου
  choice: あなたのことば
  rationale: 神からの知らせ・宣教の内容を指すが、聖書的な響きと原語への透明性を保つため「ことば」とする。
theological_decisions:
- issue: 神との関係における δοῦλος の訳語
  choice: あなたのしもべたち
  alternative: あなたの奴隷たち／あなたに属する者たち
  rationale: δοῦλοςは主人に属する者を指し、「奴隷」とも訳せる。ここでは祈りにおける神への服従と奉仕が前景化しているため本文は「しもべ」とし、より強い所有・隷属の含意を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、共同体の祈りにふさわしい簡潔で品位ある調子とした。「しもべ」「ことば」は聖書的な語感を保つため平仮名表記を採用した。
