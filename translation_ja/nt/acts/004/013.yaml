id: ACT.4.13
reference: Acts 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: ja
  text: ペトロとヨハネの大胆さを目の当たりにし、二人が正式な教育を受けていない一般の人だと分かると、彼らは驚いた。そして、二人がイエスと共にいた者たちだと分かった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεωροῦντες
  choice: 目の当たりにし
  rationale: 単に一瞥したのではなく、二人の様子を注意深く見て反応したという文脈上の含みを、自然な日本語で表した。
- source_word: παρρησίαν
  choice: 大胆さ
  rationale: 公然と臆せず語る勇気と率直さの双方を含み、使徒言行録での語義にも合う。
- source_word: καταλαβόμενοι
  choice: 分かると
  rationale: 観察を通して二人の立場を理解したことを、簡潔で自然に表した。
- source_word: ἀγράμματοί
  choice: 正式な学問を修めていない
  rationale: 現代的な意味で読み書きができないという断定を避け、律法学者やラビとしての正式な教育を受けていないという趣旨を明確にした。
- source_word: ἰδιῶται
  choice: 普通の人
  rationale: 公的・専門的な地位を持たない一般人という対比を表し、無知・愚鈍という不当な軽蔑的含意を避けた。
- source_word: ἐθαύμαζον
  choice: 驚いた
  rationale: 二人の大胆さと社会的・教育的背景との対照に対する継続的な驚きを、明快な現代日本語で表した。
- source_word: ἐπεγίνωσκόν
  choice: 気づいた
  rationale: 二人とイエスとの過去の関係を認知した、または見抜いたという意味を自然に表す。
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: イエスと共にいたこと
  rationale: 現在の大胆さの背景として、以前イエスに同行していた関係を回顧していることを示す。
- source_word: δὲ ... τε
  choice: 無標の接続と「そして」
  rationale: 物語を進める軽い接続機能を日本語の語順と文の連続で表し、原文にない強い逆接や明示的な時間語を加えなかった。
theological_decisions:
- issue: ペトロとヨハネの社会的・教育的な位置づけ
  choice: 「正式な学問を修めていない普通の人」
  alternative: 「無学な素人」または「文字を知らない者、私人」
  rationale: ἀγράμματοι καὶ ἰδιῶται は、二人に知性や識字能力がなかったと断定するよりも、正式な学問的訓練と公的な専門家としての地位がなかったことを示す。宗教指導者たちとの対照を保ちつつ、現代日本語で生じやすい過度な侮蔑の響きを避けた。
- issue: イエスとの関係を認めた主体の理解
  choice: 文脈上の指導者たちを「彼ら」として明示
  alternative: 主語を省略する
  rationale: ギリシア語では動詞に主語が含まれ、直前の文脈から議会側の人々を指す。日本語で指示関係を明瞭にするため「彼ら」を補ったが、新たな集団は導入していない。
translation_notes:
  register: 明快な現代標準日本語を用い、荘重さを保ちながら過度に文語的な表現を避けた。「正式な学問を修めていない」で意味を説明的に補い、「普通の人」で非専門家としての立場を自然に示した。
