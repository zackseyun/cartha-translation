    reason: ἀγράμματοι と ἰδιῶται の字義に近い別訳を示すとともに、現代語で「無学」が識字不能や知的欠如を意味すると受け取られうることを避けるため。
  revision_rationale: 原文の二つの認知動詞を区別した。καταλαβόμενοιは二人の教育的・社会的背景を理解したこと、ἐπεγίνωσκονは二人をイエスと共にいた者として認めたことを指す。後者を「…者たちだと分かった」として、過去のイエスとの関係を識別した含意を明示した。
