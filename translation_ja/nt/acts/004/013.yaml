revisions:
- from: ペトロとヨハネの大胆さを目の当たりにし、二人が正式な学問を修めていない普通の人[a]だと分かると、彼らは驚いた。そして、二人がイエスと共にいたことに気づいた。
  to: ペトロとヨハネの大胆さを目の当たりにし、二人が正式な教育を受けていない一般の人だと分かると、彼らは驚いた。そして、二人がイエスと共にいた者たちだと分かった。
  rationale: 原文の二つの認知動詞を区別した。καταλαβόμενοιは二人の教育的・社会的背景を理解したこと、ἐπεγίνωσκονは二人をイエスと共にいた者として認めたことを指す。後者を「…者たちだと分かった」として、過去のイエスとの関係を識別した含意を明示した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:23Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として原文の出来事の順序と意味をよく伝えている。「気づいた」はἐπεγίνωσκον（二人を、イエスと共にいた者として認めた）の識別・認知の意味をやや弱めるため、より明確な表現に改めるのが安全である。
  naturalness: 明快な現代標準日本語である。「目の当たりにし」「大胆さ」は自然である。一方、末尾は「…ことに気づいた」より「…者たちだと分かった」のほうが、二人の身元・過去の関係を認めたという文脈に自然に合う。
  terminology: 「正式な教育を受けていない一般の人」は、ἀγράμματοι καὶ ἰδιῶταιについて、識字不能や知的欠如を断定せず、指導者層との教育的・社会的対比を適切に伝える。「普通の人」より「一般の人」のほうが、ἰδιῶταιの非専門家・非指導者という対比をやや明瞭にする。
  issues:
  - severity: medium
    issue: ἐπεγίνωσκονの認知・識別の含意が弱い
    rationale: 「二人がイエスと共にいたことに気づいた」は事実への単なる気づきとして読める。原文は、彼らがペトロとヨハネをイエスと共にいた者として認めたことを表す。
  - severity: low
    issue: ἰδιῶταιの社会的対比
    rationale: 「普通の人」でも大意は通るが、「一般の人」は宗教的・公的な専門家や指導者ではないという文脈上の対比をより自然に保持する。
  revised_text: ペトロとヨハネの大胆さを目の当たりにし、二人が正式な教育を受けていない一般の人だと分かると、彼らは驚いた。そして、二人がイエスと共にいた者たちだと分かった。
  revised_footnotes:
