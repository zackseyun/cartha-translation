id: ACT.4.31
reference: Acts 4:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: ja
  text: 彼らが祈ると、彼らの集まっていた[a]場所が揺れ動いた。そして、一同は聖霊に満たされ、神のことばを大胆に[b]語っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「集められていた」。ギリシア語は、彼らが集まった状態にあったことを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「確信をもって」または「率直に」。この語は、恐れず公然と語ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: 彼らが祈り終えると
  rationale: 属格独立構文のアオリスト分詞が示す先行・時間関係を、自然な現代日本語で表した。「願い求める祈り」という語義を文脈上の「祈る」に含ませた。
- source_word: ἐσαλεύθη
  choice: 揺れ動いた
  rationale: 場所が物理的な揺れを受けたことを明確にし、受動形を日本語で自然な自動詞表現にした。
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: 彼らの集まっていた場所
  rationale: ἦσανと完了分詞による、彼らが集まった状態にあったことを表す。行為者を特定する受動的含意は断定しない。
- source_word: ἐπλήσθησαν ἅπαντες τοῦ ἁγίου πνεύματος
  choice: 一同は聖霊に満たされ
  rationale: 全員性と受動の意味を保ち、ルカ文書で繰り返される聖霊充満の表現を日本語の定着した自然な言い方で訳した。
- source_word: ἐλάλουν
  choice: 語り続けた
  rationale: 未完了過去が示す継続的な発話を表し、「語り始めた」という起動の意味は加えなかった。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 宣べ伝えられる神からの知らせを指すルカ文書の重要な表現を保ちつつ、自然な日本語にした。
- source_word: μετὰ παρρησίας
  choice: 大胆に
  rationale: 恐れず、公然と率直に語る態度を文脈に即して簡潔に表した。
theological_decisions:
- issue: 聖霊に満たされるという表現
  choice: 一同は聖霊に満たされ
  alternative: 一同は聖霊によって満たされ
  rationale: 属格を内容として理解するルカの慣用表現に沿った。聖霊による力づけを示す一方、特定の教派における「第二の体験」などの体系を本文に持ち込まない。
- issue: ἐλάλουνの時制・相
  choice: 語り続けた
  alternative: 語った
  rationale: 未完了過去の継続性を反映し、祈りと聖霊充満に続く証言が持続していたことを示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ことば」は聖書的な慣用を保つため平仮名表記とした。英語相談訳では脚注記号の位置と脚注内容に不一致が見られたため、原文上の該当語句である「集まっていた」と「大胆に」にそれぞれ配置した。
