id: ACT.4.10
reference: Acts 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: ja
  text: あなたがたすべてと、イスラエルの民全体に、知っておいてください。この人があなたがたの前に健やかな姿で[c]立っているのは、あなたがたが十字架につけ、神が死者の中からよみがえらせた、ナザレのイエス・メシア[a]の名によるのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ナザレのイエス・キリスト」とも訳せる。ギリシア語「クリストス」は、「メシア」という称号としても、名前に近い「キリスト」としても訳し得る。
    reason: alternative_reading
  - marker: b
    text: 「この方によって」とも訳せる。ギリシア語の表現は、直前に述べられたその名を指すとも、イエスご自身を手段として指すとも理解できる。
    reason: lexical_alternative
  - marker: c
    text: 「健康な」「すっかり治った」とも訳せる。ギリシア語は、身体が正常で健全な状態にあることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: 知っていただきたい
  rationale: 公の宣言を表す命令的な構文を、現代日本語として自然かつ威厳のある言い方で表した。
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: あなたがたすべてと、イスラエルの民全体に
  rationale: 目の前の聴衆と、より広いイスラエルの民という二重の対象を保持した。
- source_word: ἐν τῷ ὀνόματι
  choice: の名による
  rationale: 癒やしをもたらした力・権威・手段を示す句として、日本語で自然に伝わる表現を選んだ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を保ち、固有名のようにのみ扱わないよう「メシア」と訳した。
- source_word: τοῦ Ναζωραίου
  choice: ナザレ人
  rationale: 出身・呼称の双方を含み得るギリシア語の形を簡潔に保った。
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: あなたがたが十字架につけ
  rationale: 聴衆に向けられた直接的な告発を弱めずに訳した。
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: 神が死者の中からよみがえらせた
  rationale: 神の行為主体性と復活の主張を明示し、ἐκ νεκρῶνを「死者の中から」と表した。
- source_word: ἐν τούτῳ
  choice: この方によって
  rationale: 直前のイエスを指す道具的表現と解したが、「この名によって」の可能性を脚注に残した。
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: この人は健やかな姿であなたがたの前に立っている
  rationale: 完了形が示す、癒やされた結果として現在立っている状態を自然な日本語で表した。
- source_word: ὑγιής
  choice: 健やかな姿で
  rationale: 身体が回復し、正常な状態にあることを明瞭に表した。
theological_decisions:
- issue: Χριστοῦを称号として訳すか、名前の一部として音写するか
  choice: メシア
  alternative: キリスト
  rationale: イスラエルの指導者たちへの宣言という文脈では称号性が生きているため、「メシア」とした。別訳を脚注に示した。
- issue: ἐν τούτῳの指示対象
  choice: この方によって
  alternative: この名によって
  rationale: 男性単数の指示代名詞が直前のイエスを指すと解し得る一方、先行する「名によって」を受ける可能性もあるため、本文で一方を採りつつ脚注で曖昧さを保持した。
- issue: 復活表現
  choice: 神が死者の中からよみがえらせた
  alternative: 神が死者の中から起こした
  rationale: 日本語で復活を自然に表しながら、神が行為者であることと、死者の領域からの復活という原文の内容を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、公の弁明にふさわしい格調を保った。直接的な告発と復活宣言を弱めず、語義上の曖昧さは脚注に残した。
