source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: ja
  text: しかし、ペテロとヨハネは彼らに答えた。「神の前で、あなたがたの言うことを聞くよりも、神の言うことを聞くほうが正しいか、あなたがた自身で判断しなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: しかし、ペトロとヨハネは
  rationale: δέが示す、当局者の命令に対する穏やかな対立を、自然な現代日本語の「しかし」で表した。
- source_word: ἀποκριθέντες ... εἶπον πρὸς αὐτούς
  choice: 彼らに答えた
  rationale: 分詞と定形動詞を重ねるセム語的影響のある表現である。日本語で「答えて言った」とすると冗長になりやすいため、応答と発言の両方を自然に含む「答えた」とした。
- source_word: δίκαιόν
  choice: 正しい
  rationale: 神の評価の前で何が正当かを問う語であり、道徳的・裁判的な含みを保ちながら、直接話法として明快な「正しい」を用いた。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前で
  rationale: 神の臨在と評価のもとで、という意味を簡潔かつ格調を保って表す。
- source_word: ἀκούειν
  choice: 言うことを聞く
  rationale: ἀκούωの基本義「聞く」を保ちつつ、日本語では人の「言うことを聞く」が命令や権威に従う含みも自然に帯びるため、文脈上の意味を過度に限定せず表せる。
- source_word: μᾶλλον ἢ
  choice: よりも…ほうが
  rationale: 二者のどちらに耳を傾けるかを比較するギリシア語構文を、自然な日本語の比較構文で表した。
- source_word: κρίνατε
  choice: あなたがた自身で判断しなさい
  rationale: 命令形の直接的な挑戦を保ち、「自身で」によって聞き手自身に評価を委ねる談話上の力を明示した。
theological_decisions:
- issue: ἀκούεινを、神と人間の権威への服従を対比する語として明示的に「従う」と訳すか
  choice: 本文では「言うことを聞く」とした
  alternative: 「あなたがたに従う」「あなたがたの言うことに従う」
  rationale: 文脈は明らかに服従を問題としているが、原文は明示的な服従動詞ではなくἀκούωを用いる。「言うことを聞く」は語の聴覚的表現と服従の含みの双方を保ち、原文の表現上の緊張を解消しない。
translation_notes:
  register: 明快な現代標準日本語を用い、直接話法には簡潔で格調ある調子を保った。「御前」のような文語的・宗教的表現は避けて「神の前」とし、命令形は原文の率直さを保つため「判断しなさい」とした。
