  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: ja
  text: 翌日、彼らの指導者たち、長老たち、律法学者たちがエルサレムに集められた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「集まった」または「参集した」。ギリシア語の動詞は受動形で、「集められた」という形になっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （独立した「そして、…ということが起こった」は置かず、文全体を「翌日、…集められた」と構成）
  rationale: この語句は物語を次の出来事へ進める定型表現。日本語で逐語的に「そして、…ということが起こった」とすると不自然に重くなるため、出来事を直接述べる構文でその機能を表した。
- source_word: ἐπὶ τὴν αὔριον
  choice: 翌日
  rationale: 「次の日に／翌日に」を表す慣用句。簡潔で自然な現代日本語とした。
- source_word: συναχθῆναι
  choice: 集められた
  rationale: アオリスト受動不定詞の受動形を保ちつつ、会合のため一か所に集まる意味を表した。自然な「集まった」も可能なので脚注に示した。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 属格代名詞を明示して原文の関係性を保ったが、この節だけでは指示対象を限定しない。
- source_word: τοὺς ἄρχοντας
  choice: 指導者たち
  rationale: この文脈ではユダヤ社会の統治・指導に当たる者たちを指す。「支配者たち」より現代日本語で自然であり、政治的権限だけに狭めない。
- source_word: τοὺς πρεσβυτέρους
  choice: 長老たち
  rationale: 単なる年長者ではなく、共同体で公的役割を担う者たちを指す定着した訳語。
- source_word: τοὺς γραμματεῖς
  choice: 律法学者たち
  rationale: 当時の書記・律法専門家という制度的役割を、現代の単なる筆写者と誤解されにくい日本語で表した。
- source_word: ἐν Ἰερουσαλήμ
  choice: エルサレムに
  rationale: 集合が行われた場所を自然な日本語の助詞「に」で示した。
theological_decisions:
- issue: αὐτῶνの指示対象
  choice: 「彼らの」と訳し、代名詞を保持する
  alternative: 代名詞を省く、または「ユダヤ人の」と明示する
  rationale: 原文は関係を示す代名詞を含むが、この節自体ではその先行詞を明示していない。したがって、特定の集団へ解釈を狭めず曖昧さを残した。
- issue: συναχθῆναιの受動性
  choice: 「集められた」として受動形を保つ
  alternative: 「集まった」「参集した」
  rationale: 原文の動詞は受動形であるためそれを本文に反映した。ただし、誰が集めたかを神学的に特定せず、自然な自発的集合として理解する余地も脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語。物語の流れを妨げる古風な定型句は避けつつ、制度的な称号と原文の受動形を保持した。「指導者たち、長老たち、律法学者たち」と並列を明確にした。
