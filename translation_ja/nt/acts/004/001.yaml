id: ACT.4.1
reference: Acts 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: ja
  text: 彼らが人々に話していると、祭司たち、神殿の守衛長[b]、サドカイ人が彼らのところへやって来た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「近づいて来た」「そばに立った」とも訳せる。ギリシア語の動詞は、突然やって来ることや近づくことを表し得る。この文脈では、当局者たちが話を中断させるように現れたことを示している。
    reason: lexical_alternative
  - marker: b
    text: 「神殿の守衛長」は、神殿の境内の秩序と警備を担当した役人。
    reason: cultural_note
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: 彼らが……語っていると
  rationale: 属格独立構文を、同時進行と次の出来事への移行を自然に示す時間節で表した。δέは独立した語を加えず、文の展開に織り込んだ。
- source_word: πρὸς τὸν λαὸν
  choice: 民に
  rationale: λαόςの基本的な意味を保ち、神殿に集まっていた人々を「群衆」と限定しすぎない簡潔な表現とした。
- source_word: ἐπέστησαν αὐτοῖς
  choice: 彼らのところへやって来た
  rationale: 動詞が表し得る到来・接近を自然な日本語で示しつつ、「詰め寄った」のような敵対性を本文だけから過度に読み込まないようにした。
- source_word: οἱ ἱερεῖς
  choice: 祭司たち
  rationale: 原文はἀρχιερεῖς（祭司長たち）ではなくἱερεῖςなので、階級を付加せず訳した。
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: 神殿の守衛長
  rationale: 神殿域の秩序と警備を担う指揮官の職を、過度に説明的にならず理解できる日本語で表した。
- source_word: οἱ Σαδδουκαῖοι
  choice: サドカイ派の人々
  rationale: 集団名を標準的に音写し、日本語として複数の人物を指すことが明確になるよう「派の人々」とした。
theological_decisions:
- issue: 当局者たちの到来に含まれる敵対的ニュアンス
  choice: 「やって来た」と中立的に訳す
  alternative: 「詰め寄った」「押しかけて来た」
  rationale: 後続の文脈では反対の姿勢が明らかになるが、この動詞自体は到来や接近を表し得るため、この節だけで敵意を強く確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文として簡潔かつ品位ある調子にした。注記記号は、それぞれが説明する語句の直後に配置した。
