id: ACT.4.12
reference: Acts 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: ja
  text: ほかのだれによっても、救いはありません。私たちが救われなければならない名として人々の間に与えられた名は、天の下、この名のほかにはないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: 救い
  rationale: 直前の癒やしを含む救出の含意を保ちつつ、この宣教文脈での包括的・神学的な意味を自然に表す。
- source_word: ἐν ἄλλῳ οὐδενί
  choice: ほかのだれにも
  rationale: 人物についての排他的主張を明示し、日本語として自然に表現する。後続の「名」との結びつきも保たれる。
- source_word: ὄνομα
  choice: 名
  rationale: 「人物」や「権威」と説明的に置き換えず、人格、権威、明らかにされた存在を含み得る聖書的な表現を保持する。
- source_word: ὑπὸ τὸν οὐρανόν
  choice: 天の下で
  rationale: 世界全体、人間の領域を指す慣用表現を、荘重さを損なわずに保持する。
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: 人々の間に与えられていない
  rationale: ἐν の「間に」という関係を保ち、ἀνθρώποις が性別を限定せず人類一般を指すことを現代日本語で明確にする。
- source_word: ἐν ᾧ
  choice: この名によって
  rationale: 関係代名詞の先行詞が「名」であることを明らかにし、救いの手段・根拠としての関係を自然な日本語で示す。本文では語順を整え「救われるために必要な名」とした。
- source_word: δεῖ σωθῆναι ἡμᾶς
  choice: 人が救われるために必要な
  rationale: δεῖ の必然性を「必要な」で保持する。ἡμᾶς は直訳すれば「私たち」だが、日本語では後続の「人々」と合わせ、人間一般への適用が自然に伝わるよう「人が」とした。
theological_decisions:
- issue: イエスに関する救いの排他性
  choice: 「ほかのだれにも救いはありません」と無条件の排他性を保持する。
  alternative: 「ほかに救いの道はありません」
  rationale: ギリシア語は救いが「ほかのだれにも」ないと人物に即して述べ、天の下にほかの名がないことを根拠とするため、抽象的な「道」へ置き換えない。
- issue: 「名」の意味
  choice: 比喩を説明せず「名」と訳す。
  alternative: 「人物」または「権威」
  rationale: 原文の「名」は人格、権威、明らかにされたアイデンティティを含み得るため、その神学的な広がりを訳文で一つに限定しない。
- issue: ἀνθρώποις の包括性
  choice: 「人々」と訳す。
  alternative: 「人間の間に」「人類に」
  rationale: 語はここで男女を含む人間一般を指す。現代日本語の「人々」は自然で包括的であり、不要な性別限定を導入しない。
- issue: ἡμᾶς の扱い
  choice: 日本語の一般主体として「人が」と表す。
  alternative: 「私たちが」
  rationale: 原文の一人称複数は保持可能だが、発言の普遍的射程と日本語の自然さを優先した。ただし話者を含む意味を排除するものではない。
translation_notes:
  register: 明快な現代標準日本語を用い、宣言の荘重さと排他的な力を保った。「天の下」「名」は聖書的表現として残しつつ、文構造は普通の読者が一読して理解できるよう整えた。
