id: ACT.4.35
reference: Acts 4:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: ja
  text: そして、それを使徒たちの足もとに置いていた[a][b]。それは、それぞれの必要に応じて、一人ひとりに分け与えられていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「使徒たちの前に」。ギリシア語は直訳すると「使徒たちの足もとに」であり、売却したものの代金を使徒たちの管理に委ねる情景を保っている。
    reason: lexical_alternative
  - marker: b
    text: 「それ」は前の節にある、売ったものの代金を指す。原文では、「置いていた」ものと「分け与えられていた」ものが明示されていない。
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: 置いていた
  rationale: 未完了過去の継続・反復的な側面を自然な日本語で表し、共同体の中で繰り返し行われていた行為を示す。
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: 使徒たちの足もとに
  rationale: 使徒たちの管理に委ねるという含意を保ちつつ、ギリシア語の具体的な身体イメージをそのまま伝える。
- source_word: διεδίδετο
  choice: 分け与えられていた
  rationale: 未完了過去の受動態を保ち、継続的・慣習的な分配を表す。分配者を本文以上に特定しない。
- source_word: ἑκάστῳ
  choice: 一人ひとりに
  rationale: 個々の人への分配という与格単数の配分的な意味を、明瞭で自然な現代日本語にする。
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: それぞれの必要に応じて
  rationale: 必要の有無や程度に対応して分配されたという比例・対応関係を簡潔に表す。
- source_word: τις
  choice: それぞれ
  rationale: 特定の男性ではなく、不定・一般的な個人を指すため、性別を限定しない表現とした。
- source_word: χρείαν
  choice: 必要
  rationale: 文脈上の物質的な必要を過度に限定せず、χρείαの一般的な意味を明瞭に伝える。
theological_decisions:
- issue: 置かれ、分配されたものを明示するか
  choice: 指示語「それ」で前節から受け、具体的な名詞は補わない。
  alternative: 「代金」または「売却代金」と明示する。
  rationale: ギリシア語では目的語・主語が省略され、前節の文脈に委ねられている。「それ」とすることで日本語としての明瞭さを確保しながら、本文以上に対象を限定しない。
- issue: 使徒たちの足もとという表現を比喩化するか
  choice: 具体的な像を残して「使徒たちの足もとに」とする。
  alternative: 「使徒たちの前に」または「使徒たちに委ねて」とする。
  rationale: 使徒たちの権限・管理下に置く含意はあるが、原文の具体的な表現を消さず、解釈を訳文に置き換えない。
translation_notes:
  register: 明瞭で現代的かつ格調を保った叙述。「置いていた」「分け与えられていた」により二つの未完了過去の継続・反復性を示した。脚注記号は英語監査層の内容順に合わせ、該当句の直後に[a][b]として配置した。
