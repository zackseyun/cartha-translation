source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: ja
  text: そこで彼らは、二人をさらに脅したうえで[a]、釈放した。民衆を恐れて、二人をどう処罰するか、その手だてを見いだせなかったのである。起こったことのゆえに、皆が神をあがめていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もう一度脅した上で」または「さらに脅しを加えた上で」。ギリシア語は、それまでの脅しに加えて、さらに、あるいはいっそう強く脅したことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: さらに脅した上で
  rationale: πρόςを伴う複合動詞が、すでになされた脅しに加えて、さらに脅すことを表す点を自然な日本語で示す。
- source_word: ἀπέλυσαν
  choice: 釈放した
  rationale: 拘束下にあった二人を権力者が解放する司法的・拘禁的文脈に合う。
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: 二人をどう処罰すればよいか分からなかった
  rationale: 直訳的には「彼らをどのように処罰するかについて何も見いだせず」。日本語では、処罰の方法・手立てを見いだせない意味を明瞭に表す。
- source_word: διὰ τὸν λαόν
  choice: 民衆のために
  rationale: διά＋対格の理由・原因を保持する。λαόςは、その場の群衆だけでなく権力者を制約した民一般を指すため「民衆」とした。
- source_word: πάντες
  choice: 皆
  rationale: 文脈上の人々を包括的に指す自然で簡潔な表現。
- source_word: ἐδόξαζον τὸν θεόν
  choice: 神をあがめていた
  rationale: δοξάζωの神に栄誉を帰す意味を、現代日本語で自然かつ荘重に表し、未完了過去の継続的様相も「ていた」で示す。
- source_word: ἐπὶ τῷ γεγονότι
  choice: 起こったことのゆえに
  rationale: 完了分詞が指す、すでに生じて現在にも意義を持つ出来事を示し、ἐπίの根拠・理由の意味を表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、司法的文脈では「釈放」「処罰」を採用した。「あがめる」によって聖書的な尊厳を保ちつつ、一般読者にも理解しやすくした。原文の因果関係が追いやすいよう文を分けた。
