id: ACT.4.33
reference: Acts 4:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: ja
  text: 使徒たちは大きな力をもって、主イエスの復活について証しを続けていた。そして、大きな恵み[a]が彼ら一同の上にあった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「大きな好意」。ギリシア語の「カリス」は「恵み」とも「好意」とも訳せる。ここでは、神からの恵み、人々から彼らに向けられた好意、またはその両方を指す可能性がある。
    reason: χάριςの語義と、その恵み・好意の源について原文が明示しない曖昧さを保持するため。
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: 大きな力をもって
  rationale: 与格を手段・様態として捉え、使徒たちの証言に伴う力を自然に表した。「力」はルカ文書における δύναμις の語感を保ちつつ、奇跡だけに意味を限定しない。
- source_word: ἀπεδίδουν
  choice: 証しを続けていた
  rationale: μαρτύριον と結びつく慣用を「証しをする」と訳し、未完了過去の継続的・反復的な様相を「続けていた」で示した。
- source_word: τὸ μαρτύριον
  choice: 証し
  rationale: 法廷的な「証言」に限定せず、使徒たちが公に伝える witness/testimony の意味を、現代日本語の聖書文体として明瞭な「証し」で表した。
- source_word: τῆς ἀναστάσεως
  choice: 復活について
  rationale: 属格を証しの内容と理解し、自然な現代日本語で「について」とした。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの
  rationale: κύριος を「主」とし、復活がイエスの復活であることを原文どおり示した。
- source_word: χάρις μεγάλη
  choice: 大きな恵み
  rationale: χάρις の神からの恵みを含み得る語感と、共同体に及ぶ好意・厚意の意味の広がりを保ちやすい「恵み」を本文に採用した。別訳可能性は脚注で明示した。
- source_word: ἐπὶ πάντας αὐτούς
  choice: 彼ら一同の上にあった
  rationale: ἐπί の「上に及ぶ／とどまる」という空間的比喩と、πάντας の全員性を保った。
theological_decisions:
- issue: χάρις の意味とその源
  choice: 「恵み」と訳し、神の恵みを含み得る広い表現を保つ
  alternative: 「好意」または「厚意」とし、人々からの好意を前面に出す
  rationale: 原文は χάρις の源を明示しておらず、神の恵みと周囲から寄せられる好意の双方を含む可能性がある。本文で一方に限定せず、脚注で語義の幅を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「主」「証し」「恵み」など定着した聖書語彙を節度をもって採用した。「大いなる」のような古風な表現は避け、「大きな」とした。
