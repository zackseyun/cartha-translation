id: ACT.4.17
reference: Acts 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: ja
  text: しかし、このことがこれ以上民衆の間に広まらないように、今後この名によって誰にも語ってはならないと、彼らを脅そう[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「厳しく警告しよう」。原語は、当局が相手を威嚇するという強い意味を持つ。
    reason: 「脅す」という基本義と、文脈上可能な「厳しく警告する」という訳語の幅を示すため。
lexical_decisions:
- source_word: διανεμηθῇ
  choice: 広まらない
  rationale: 受動形の字義は「分配される、行き渡る」だが、文脈上は使徒たちの出来事と教えが民衆の間に伝播することを指すため、自然な日本語の「広まる」とした。
- source_word: ἐπὶ πλεῖον
  choice: これ以上
  rationale: 現状を越えてさらに拡大するという比較・継続の意味を簡潔に保つ。
- source_word: εἰς τὸν λαόν
  choice: 民衆の間に
  rationale: λαόςはここでは広く一般の人々、とりわけユダヤの民を指す。「民衆」は公的な議会場面にも合い、伝播の範囲を自然に表す。
- source_word: ἀπειλησώμεθα
  choice: 脅そう
  rationale: この動詞の基本義は単なる注意ではなく「脅す、威嚇する」であり、当局による強制的な措置という場面の力を直接表す。日本語では後続する禁止内容とも自然につながる。
- source_word: μηκέτι λαλεῖν
  choice: 今後…語ってはならない
  rationale: μηκέτιの「もはや、これからはもう…ない」という時間的な禁止を、現代日本語で明確にした。
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: この名によって
  rationale: ἐπί＋与格は、この名を根拠・権威として語る意味を帯びる。「によって」は単なる話題としてではなく、その名に基づく発言であることを表す一方、具体的関係を過度に限定しない。
- source_word: μηδενὶ ἀνθρώπων
  choice: 誰にも
  rationale: 禁止表現の中で、発言の相手が一人も例外なく含まれることを自然な日本語で表す。
theological_decisions:
- issue: 議会の対応におけるἀπειλησώμεθαの強さ
  choice: 「脅そう」と訳し、当局による威嚇の意味を本文に保つ。
  alternative: 「警告しよう」
  rationale: 原語は公権力による強制と威嚇を明示する。「警告」は日本語として自然だが、行為の強さを弱める可能性があるため、より直接的な「脅そう」を採用した。
- issue: 「この名」と発言行為との関係
  choice: 「この名によって」
  alternative: 「この名について」「この名のもとで」
  rationale: 表現には名を唱えること、名に結びついて語ること、その権威に基づくことが重なり得る。「によって」は権威・根拠の含意を保ちつつ、解釈を特定の教理に固定しない。
translation_notes:
  register: 現代の標準的な日本語を用い、議会の協議としての厳粛さを保った。「民衆」「語る」はやや格調を持たせつつ一般読者にも理解しやすい語。「脅そう」は原語の強制的な響きを明確にする。
