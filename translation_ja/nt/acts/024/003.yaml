  text: πάντῃ τε καὶ πανταχοῦ ἀποδεχόμεθα, κράτιστε Φῆλιξ, μετὰ πάσης εὐχαριστίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: ja
  text: 私たちは、あらゆる点で、また至る所で、深い感謝をもってこれを認めております、フェリクス閣下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντῃ
  choice: あらゆる点で
  rationale: 方法や時間ではなく「すべての点・面で」という広がりを表し、πανταχοῦとの対を保つ。
- source_word: τε καὶ
  choice: また
  rationale: 二つの副詞句を自然な日本語で結び、その相関的な働きを示す。
- source_word: πανταχοῦ
  choice: 至る所で
  rationale: 場所の普遍的な広がりを明確かつ自然に表す。
- source_word: ἀποδεχόμεθα
  choice: このことを……認めております
  rationale: 受け入れる、歓迎するという語義もあるが、ここではフェリクスに帰される恩恵を公に承認する法廷弁論上の意味が適切。目的語は直前の内容を受けて「このこと」と補う。
- source_word: κράτιστε
  choice: 閣下
  rationale: 高官に対する敬称として、現代日本語で自然かつ威厳ある表現。字義的な「最も優れた」より役職上の呼びかけを適切に伝える。
- source_word: Φῆλιξ
  choice: フェリクス
  rationale: 日本語聖書で自然な慣用的音写。
- source_word: μετὰ πάσης εὐχαριστίας
  choice: 心からの感謝をもって
  rationale: πάσηςが示す十分な程度を、硬すぎない現代日本語で表す。
