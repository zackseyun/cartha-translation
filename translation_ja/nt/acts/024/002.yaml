  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: ja
  text: そして、パウロが呼び出されると、テルトロは彼を訴え始め、こう述べた。「閣下のおかげで、私たちは大いに平和を享受しており、また閣下のご配慮によって、この国民に改革が行われています。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「改革」は、「改善」または「是正措置」とも訳せる。また「ご配慮」は、「先見の明」または「周到な統治」とも訳せる。
    reason: διορθωμάτωνとπρονοίαςの意味の幅を示し、後者が神学的な「摂理」ではなく、統治者の行政的な先慮を指すことを明確にするため。
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: そして、パウロが呼び入れられると
  rationale: 属格独立構文が主動作の状況を示す。法廷の場面に即して「呼び入れられる」とし、代名詞の指示対象であるパウロを日本語では明示した。
- source_word: ἤρξατο κατηγορεῖν
  choice: 訴え始め
  rationale: 開始を表す構文を保ち、法的な告発の文脈に自然な「訴える」を用いた。
- source_word: ὁ Τέρτυλλος
  choice: テルティロ
  rationale: 人名 Τέρτυλλος を日本語聖書で通用する形に音写した。
- source_word: λέγων
  choice: こう述べた
  rationale: 後続する演説内容を自然な現代日本語で導入する。
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: 閣下のおかげで、私たちは長く平和を享受しており
  rationale: τυγχάνω＋属格を「享受する」とし、法廷で総督に向けた丁重で追従的な語調を「閣下」によって表した。πολλῆς は量の多さを示すが、平和については日本語で自然な「長く」とした。
- source_word: διορθωμάτων γινομένων
  choice: さまざまな改革が行われています
  rationale: διόρθωμα の行政的な是正・改善という意味を「改革」で表し、複数形は「さまざまな」によって反映した。γίνομαι は過度に行為者を補わず「行われる」とした。
- source_word: τῷ ἔθνει τούτῳ
  choice: この国民のために
  rationale: ここでの ἔθνος はローマ統治下のユダヤ民族・国民を指す。「国」より人々を指す語義を保つため「国民」とし、与格の受益的な関係を「ために」で示した。
- source_word: διὰ τῆς σῆς προνοίας
  choice: 閣下のご配慮によって
  rationale: πρόνοια は統治者の先を見越した配慮・行政を指す。神学的な含意を帯びやすい「摂理」を避け、文脈上自然で敬意ある「ご配慮」とした。
theological_decisions:
- issue: 人間の統治者について用いられた πρόνοια の訳
  choice: ご配慮
  alternative: 先見の明／摂理
  rationale: ここではフェリクスの統治を持ち上げる政治的・法廷的な賛辞であり、神の支配を意味するとは限らない。「ご配慮」は行政上の先慮を示しつつ、不要な神学的意味を持ち込まない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。テルティロが総督フェリクスに向ける追従的で丁重な法廷演説として「閣下」を補った。節は次節へ続く従属的な発言なので、閉じた完結文にせず引用を継続させる形とした。
