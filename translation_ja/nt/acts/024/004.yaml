  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: ja
  text: しかし、これ以上あなたのお時間を取らないために[a]、どうか、ご寛容をもって[b]、私どもの話を手短にお聞きくださるようお願いいたします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これ以上あなたをお引き止めしないために」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ご厚意により」「寛大なお取り計らいによって」。ギリシア語は、公正さ、温和さ、また裁定における寛大さを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: しかし、……ないために
  rationale: δέの穏やかな転換を「しかし」で示し、ἵνα μήの目的を現代日本語として自然な「……ないために」で表した。
- source_word: ἐπὶ πλεῖόν
  choice: これ以上
  rationale: 時間や程度がさらに増すことを表す慣用句であり、この場面では総督の時間をこれ以上費やさせないという意味に適する。
- source_word: σε ἐγκόπτω
  choice: あなたのお時間を取る
  rationale: ἐγκόπτωの「妨げる、引き止める」という意味を、法廷で相手の時間を費やさせるという文脈に即して、明瞭で丁重な日本語にした。
- source_word: παρακαλῶ
  choice: どうか……お願いいたします
  rationale: 単なる依頼よりも丁重な懇願を表す語調を保ち、改まった場にふさわしい表現とした。
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: 私どもの話を……お聞きくださる
  rationale: 属格目的語ἡμῶνを日本語で自然な「私どもの話を」とし、相手への敬意を示す敬語で訳した。
- source_word: συντόμως
  choice: 手短に
  rationale: 発言の簡潔さを表し、口頭での陳述に自然な日本語とした。
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: ご寛容をもって
  rationale: ἐπιείκειαが含む公正さ、温和さ、情状を酌む寛大さのうち、司法的な場面での寛大な取り計らいを保つ表現とした。
