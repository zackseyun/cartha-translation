  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: ja
  text: 何年もたって、私は自分の民のために施し[a]を行い、ささげ物を献げるために来ました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「施し」は、困っている人々への慈善的な贈り物や援助を指す。
    reason: ἐλεημοσύναςが指す困窮者への慈善的援助という具体的意味を、本文の簡潔さを保ちながら明確にするため。
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: 何年もたってから
  rationale: διά＋属格の時間表現を、ある年月が経過した後という意味に取り、πλειόνωνの比較級的な形を文脈に即して「何年も」と自然に表した。δέは弱い接続辞であり、日本語ではあえて訳語を置かなくても文脈上のつながりが保たれる。
- source_word: ἐλεημοσύνας
  choice: 施し
  rationale: 困窮者への慈善的な贈り物・援助を指す語であり、簡潔で現代日本語として通じる「施し」とした。
- source_word: ποιήσων
  choice: 施しをし
  rationale: ποιέωの字義は「する／作る」だが、ἐλεημοσύναςとの結びつきでは「施しをする」という慣用的な意味になるため、日本語でも自然な連語にした。
- source_word: εἰς τὸ ἔθνος μου
  choice: 自分の民に
  rationale: ここでἔθνοςはパウロ自身が属するユダヤの民を指す。「民族」よりも本人との結びつきと受益者としての意味が自然に伝わる「自分の民」とした。
- source_word: παρεγενόμην
  choice: 来ました
  rationale: 到着してその場に至ったことを表す。原文に明示されない「戻る」を加えず、簡潔に「来ました」とした。
- source_word: προσφοράς
  choice: ささげ物
  rationale: 神への奉献物を含み得る語だが、原文は種類を限定していないため、広がりを保つ「ささげ物」とした。
theological_decisions:
- issue: エルサレムでのパウロの慈善行為の性質
  choice: ἐλεημοσύναςを「施し」と訳す
  alternative: 貧しい人々への贈り物／慈善の贈り物
  rationale: 特定の教会制度や教理を読み込まず、困窮者への具体的な援助という語義を簡潔に示すため。
- issue: 「施し」と「ささげ物」の関係
  choice: 二つを並列の目的として訳す
  alternative: 両方を一括して「持って来た」と訳す
  rationale: 原文のκαίによる並列と、慈善的援助と奉献物との語義上の区別を保ち、両者を同一視しないため。
translation_notes:
  register: 法廷でのパウロの弁明にふさわしい、簡潔で落ち着いた敬体とした。古風な宗教用語を避けつつ、「ささげ物」によって神殿に関わる含意を残した。
