lexical_decisions:
- source_word: παρ’ οὗ
  choice: 本人から
  rationale: παρά＋属格の起点・情報源を表す意味を保ちつつ、同じ人物を指す「この者」の反復を和らげ、パウロ本人から事情を確認できるという意味を自然な日本語で示した。
- source_word: δυνήσῃ
  choice: お確かめになれます
  rationale: 未来における能力・可能性を表す。「できます」よりも、総督への発言にふさわしい敬意を自然に示した。
- source_word: αὐτὸς
  choice: あなたご自身で
  rationale: 主語を強調する代名詞であり、フェリクス自身が調べることを明示するため「ご自身で」とした。
- source_word: ἀνακρίνας
  choice: 取り調べれば
  rationale: 司法的文脈での審問・尋問を表す。時または手段として理解できる分詞の幅を保ちつつ、日本語では条件表現で自然につないだ。
- source_word: περὶ πάντων τούτων
  choice: これらすべての事柄について
  rationale: περί＋属格の「〜について」と、πάντων τούτωνの複数・包括性をそのまま表した。
- source_word: ἐπιγνῶναι
  choice: 確かめる
  rationale: 法的な場面で、調査によって事実を知る・確認する意味を表す。「知る」より文脈に適し、「究明する」ほど意味を強めない。
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: 私たちがこの者を告発している
  rationale: κατηγορέω＋属格による告発の法的意味を明示し、一人称複数の主語も保持した。日本語では関係節を「事柄」に前置した。
