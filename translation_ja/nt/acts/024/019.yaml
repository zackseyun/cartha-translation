source:
  edition: SBLGNT
  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: ja
  text: しかし、アジア州から来たユダヤ人が何人かいます。もし私に対して何か訴えることがあるのなら、その人たちがあなたの前に出て、私を告発すべきでした。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アジア州」は、小アジア西部にあったローマ帝国の属州を指し、現代のアジア大陸全体のことではない。
    reason: cultural_note
  - marker: b
    text: 「告発する」は、「訴えを起こす」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: しかし、…何人かいます
  rationale: δὲの文脈上の対比を「しかし」で示し、τινὲςを不特定の複数を表す自然な日本語「何人か」で訳した。動詞を欠く名詞句には、発話時にその者たちが存在することを示す「います」を補った。
- source_word: ἀπὸ τῆς Ἀσίας
  choice: アジア州出身の
  rationale: ここでのἈσίαは現代の大陸ではなくローマ属州を指すため、本文で誤解を避けつつ簡潔に明示した。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人
  rationale: 民族・宗教共同体に属する人々を表す通常の現代日本語とした。
- source_word: οὓς ἔδει ἐπὶ σοῦ παρεῖναι
  choice: 彼らこそ、あなたの前に出て…すべきでした
  rationale: ἔδειの未完了過去が表す、果たされなかった義務・適切さを「すべきでした」で保持した。ἐπὶ σοῦは裁判官である総督の面前に出る法廷的表現として訳し、οὓςの焦点は「彼らこそ」で自然に示した。
- source_word: κατηγορεῖν
  choice: 私を告発する
  rationale: 法廷で相手を訴える意味を持つ語なので、法律的文脈にも合い、一般読者にも明瞭な「告発する」を選んだ。
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: もし私に対して何か訴えることがあるのなら
  rationale: εἴと希求法ἔχοιενの条件的・潜在的な響きを「もし…あるのなら」で表した。「何か」は原文の広い表現を保ちつつ、πρὸς ἐμέを文脈に即して「私に対して」とした。
theological_decisions: []
translation_notes:
  register: 法廷での弁明にふさわしい端正さを保ちながら、現代の一般読者が無理なく理解できる語順と表現にした。長いギリシア語文は二文に分けたが、対比、条件、果たされなかった義務という論理関係は保持した。
