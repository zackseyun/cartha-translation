  timestamp: '2026-07-17T18:09:24Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として原文に忠実ですが、μετακαλέσομαί（「呼び寄せる／召喚する」）に「また」を加える根拠はこの節にはありません。また、δικαιοσύνηを「正しさ」とするほうが、倫理的な正しさと神との関係における正しさの両面を保ちつつ、現代日本語として「正義」よりも狭義の社会的公正に寄りません。
  naturalness: 「恐ろしくなり」も意味は通じますが、「恐れを感じて」のほうが現代標準日本語として自然です。「今のところは帰りなさい」も可能ですが、拘束・聴聞の場面でのπορεύουには「今は行ってよい」が自然です。
  terminology: ἐγκράτειαの「節制」と、μέλλοντος κρίματοςの「来たるべき裁き」は適切です。δικαιοσύνηは定訳的な「義」を避ける場合、「正しさ」が明瞭で意味の幅を保ちます。
  issues:
  - severity: medium
    issue: 「また呼ぶことにする」
    rationale: μετακαλέσομαίは「（こちらへ）呼び寄せる、召喚する」を表す将来形であり、この文脈で時間的反復を表す「また」は明示されていません。さらに「ことにする」は将来の意志・約束をやや弱めます。
  - severity: low
    issue: δικαιοσύνηを「正義」とすること
    rationale: 誤訳ではありませんが、現代日本語の「正義」は社会的・法的公正の意味に寄りやすい語です。原語の倫理的・宗教的な「正しさ」の幅を明瞭にするため「正しさ」とします。
  - severity: low
    issue: 「恐ろしくなり」および「帰りなさい」
    rationale: 原意は保たれていますが、「恐れを感じて」「今は行ってよい」のほうが自然で、場面にも適合します。
  revised_text: しかし、パウロが正しさと節制と来たるべき裁きについて論じていると、フェリクスは恐れを感じて答えた。「今は行ってよい。都合のよい時が来たら、あなたを呼び寄せよう。」
  revised_footnotes: []
