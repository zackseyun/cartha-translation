revisions:
- from: しかし、パウロが正義と節制と来たるべき裁きについて論じていると、フェリクスは恐ろしくなり、答えた。「今のところは帰りなさい。機会を得たら、また呼ぶことにする。」
  to: しかし、パウロが正しさと節制と来たるべき裁きについて論じていると、フェリクスは恐れを感じて答えた。「今は行ってよい。都合のよい時が来たら、あなたを呼び寄せよう。」
  rationale: 原文の三つの論題、フェリクスの恐れ、当面の退去命令、後日の召喚という流れを保った。「また」を除き、将来形 μετακαλέσομαί の意志を「呼び寄せよう」で直接表した。原文も英語監査文も脚注を必要とする曖昧さを本文で解消していないため、脚注は不要である。
