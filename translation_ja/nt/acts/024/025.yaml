language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: ja
  text: しかし、パウロが正しさと節制と来たるべき裁きについて論じていると、フェリクスは恐れを感じて答えた。「今は行ってよい。都合のよい時が来たら、あなたを呼び寄せよう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: 論じている
  rationale: 単なる一方的な説教ではなく、論述・対話を含み得る語なので、「論じる」とした。
- source_word: δικαιοσύνης
  choice: 正義
  rationale: この文脈では、人の正しい行いと神の正しい基準の双方を含み得るため、意味を狭めない「正義」とした。
- source_word: ἐγκρατείας
  choice: 節制
  rationale: 欲望や衝動を抑える自己統制を表す、簡潔で定着した訳語を用いた。
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: 来たるべき裁き
  rationale: μέλλοντοςが修飾する将来のκρίμαを、厳粛さを保ちながら自然な日本語で表した。
- source_word: ἔμφοβος γενόμενος
  choice: 恐ろしくなり
  rationale: フェリクスが恐れにとらわれた状態になったことを、現代の平明な表現で示した。
- source_word: Τὸ νῦν ἔχον
  choice: 今のところは
  rationale: 現時点についての退去命令であり、後の召喚との対比を自然に表す。
- source_word: καιρὸν μεταλαβών
  choice: 機会を得たら
  rationale: 都合のよい時・好機を得るという意味を、原文以上に動機を限定せず表した。
- source_word: μετακαλέσομαί σε
  choice: また呼ぶことにする
  rationale: 自分のもとへ呼び寄せる意を自然に表し、接頭辞の反復的な響きも「また」で反映した。
theological_decisions:
- issue: δικαιοσύνηの範囲
  choice: 「正義」として倫理的・神学的な幅を残す
  alternative: 「義」または「正しい生活」
  rationale: 「義」は宗教的専門語に寄りやすく、「正しい生活」は倫理面に限定しやすいため、裁きとの関連も保てる「正義」を選んだ。
- issue: 来たるべき裁きの主体・時期
  choice: 原文どおり主体や具体的時期を補わない
  alternative: 「神の最後の裁き」
  rationale: 文脈上は神の終末的裁きが想定されるが、この節自体に明記されていない情報を本文へ加えないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法廷・総督をめぐる場面にふさわしい節度ある格調を保った。発話は自然にしつつ、フェリクスの恐れと先延ばしの対照を明確にした。
