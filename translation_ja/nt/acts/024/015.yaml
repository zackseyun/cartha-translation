revisions:
- from: そして私は、神に望みを抱いています。それは、この人たち自身も待ち望んでいるものです。すなわち、正しい者も正しくない者も復活する時が来る、という望みです。[a]
  to: 私は神に希望を置いています。この人たち自身もまた待ち望んでいる、正しい者にも正しくない者にも復活が起こるという希望です。[a]
  rationale: 希望の対象を「正しい者にも正しくない者にも復活が起こるという希望」として明示し、ἣνが指す希望と、προσδέχονταιによる共有された期待を自然に結び付けた。「にも…にも」によりδικαίων τε καὶ ἀδίκωνの双方性を保ち、復活の時期・順序・裁きについては何も付加していない。脚注記号は語義の代替が関わる「待ち望んでいる」の直後に置くのが理想だが、本文の句読点上、当該希望全体に係る形でも参照可能である。
