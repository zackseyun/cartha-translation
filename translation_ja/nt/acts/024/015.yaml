  text: ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, ἀνάστασιν μέλλειν ⸀ἔσεσθαι δικαίων τε καὶ ἀδίκων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: ja
  text: 私は神に希望を置いています。この人たち自身もまた待ち望んでいる、正しい者にも正しくない者にも復活が起こるという希望です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この人たち自身も受け入れている」とも訳せる。この動詞は、ある事柄を受け入れることと、それを期待して待つことの両方を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: 神に望みを抱いています
  rationale: 名詞ἐλπίςと分詞ἔχωνの表現を生かしつつ、εἰς τὸν θεόνが示す望みの向かう対象を、自然な現代日本語で表した。文脈上、主節に続く分詞であるため「そして」を補った。
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: それは、この人たち自身も待ち望んでいるものです
  rationale: ἣνを先行する「望み」に結び付け、καίとαὐτοὶ οὗτοιの強調を「この人たち自身も」で保持した。προσδέχομαιは将来の出来事を期待して待つ意味がこの文脈に自然であり、「待ち望む」とした。
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: 復活する時が来る
  rationale: ἀνάστασιςを標準的な「復活」で表し、μέλλειν ἔσεσθαιの将来的実現を「時が来る」で自然に示した。差し迫った時期までは断定しない。
- source_word: δικαίων τε καὶ ἀδίκων
  choice: 正しい者も正しくない者も
  rationale: τε καίが示す両群の包括を「も……も」で保持し、δικαίωνとἀδίκωνの対照を明瞭で平易な日本語にした。
theological_decisions:
- issue: 復活の範囲
  choice: 正しい者も正しくない者も復活する
  alternative: 道徳的区別を明示しない一般的な復活
  rationale: 原文はδικαίων τε καὶ ἀδίκωνと二つの群を明記しているため、その双方を保持した。復活の時期、順序、裁きとの関係については本文以上に規定しない。
- issue: προσδέχονταιが表す共有点
  choice: この人たち自身も待ち望んでいる
  alternative: この人たち自身も受け入れている
  rationale: 動詞には「待ち望む」と「受け入れる」の両面があり得る。ここでは復活という将来の事柄への共有された期待を自然に表す「待ち望む」を本文に採用し、別の語義を脚注に残した。
translation_notes:
  register: 法廷でのパウロの発言として dignified だが平易な現代標準日本語を用いた。「義人／不義な者」より一般読者に明瞭な「正しい者／正しくない者」を採用し、神学的な範囲や時系列を補足しなかった。脚注記号[a]は本文中に明示した。
