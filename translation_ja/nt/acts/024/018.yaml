  text: ἐν ⸀αἷς εὗρόν με ἡγνισμένον ἐν τῷ ἱερῷ, οὐ μετὰ ὄχλου οὐδὲ μετὰ θορύβου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: ja
  text: そうした中で、彼らは神殿で清めを済ませていた私を見つけました[a]。私は群衆も騒ぎも伴っていませんでした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのようなことをしている間に」。ギリシア語の関係句は、より直訳的には「その中で」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「清めを済ませる」とは、律法に基づく儀礼上の清めを行うこと。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: その最中
  rationale: 直前に述べた献金と供え物に関わる一連の出来事を受ける関係句。曖昧な先行内容を過度に特定せず、時間的・状況的な意味を自然な日本語で表した。
- source_word: εὗρόν με
  choice: 私を見つけました
  rationale: 神殿でパウロに出会ったことを表す文脈上の標準的な意味。「発見した」より自然で、法廷での陳述にも適する。
- source_word: ἡγνισμένον
  choice: 身を清めていた
  rationale: 完了受動分詞が示す、儀礼的な清めを済ませた状態を表す。「清められていた」では外部からの作用が不自然に強くなるため、ユダヤ教の清めの手続きを行った状態として自然に訳した。儀礼的意味は脚注で明示した。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόνは内陣に限定されず神殿域全体を指し得るため、標準的で過度に限定しない「神殿」とした。
- source_word: οὐ μετὰ ὄχλου
  choice: 私には群衆も伴っておらず
  rationale: μετάの随伴の意味を明示し、パウロが群衆を引き連れていなかったという弁明を自然に表した。「暴徒」はὄχλοςを強く解釈しすぎる。
- source_word: οὐδὲ μετὰ θορύβου
  choice: 騒ぎも起こしていませんでした
  rationale: θόρυβοςの騒動・混乱という意味を法廷弁論の文脈に即して表した。字義的には「騒ぎを伴わず」だが、日本語では主体との関係を自然に補った。
