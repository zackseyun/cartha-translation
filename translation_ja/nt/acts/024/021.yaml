  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: ja
  text: あるいは、私が彼らの中に立って大声で叫んだ、この一つの発言について以外にあるでしょうか。『死者の復活[a]について、私は今日、あなたがたの前で裁かれているのです。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死者の中からの復活」。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: 一言
  rationale: ここでは声そのものより、続くὅτι節に内容が示される特定の発言を指す。「この一言」はμιᾶς ταύτηςの単一性も自然な日本語で表す。
- source_word: ἐκέκραξα
  choice: 大声で叫んだ
  rationale: κράζωの、声を張り上げて公に発言する強さを保つ。
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: 彼らの間に立っていた時に
  rationale: 分詞の状況的な用法と、ἐν αὐτοῖςの空間的意味を明示する。
- source_word: ἀναστάσεως νεκρῶν
  choice: 死者の復活
  rationale: 属格を素直に表し、特定の一人だけでなく、文脈上の一般的な復活をめぐる争点を保持する。別の統語的理解は脚注に示す。
- source_word: κρίνομαι
  choice: 裁かれている
  rationale: 現在受動態の法廷的意味を保ち、現在進行中の審理を表す。
- source_word: ἐφ’ ὑμῶν
  choice: あなたがたの前で
  rationale: 法廷・権威者の前に立つ意味を表し、聞き手だけが裁きの直接の主体だと断定しない。
- source_word: ἢ
  choice: あるいは
  rationale: 前節から続く弁明の選択的な接続を保ち、「ただし」を補って例外と断定しすぎない。
- source_word: μιᾶς ταύτης
  choice: この一言
  rationale: 一つだけの特定の発言であることを、簡潔で自然な日本語にまとめる。
- source_word: σήμερον
  choice: 今日
  rationale: 時間を表す標準的で明瞭な訳。
theological_decisions:
- issue: 争点となった復活の範囲
  choice: 「死者の復活」とし、一般的な表現を保つ。
  alternative: イエスの復活を特に指すものとして訳す。
  rationale: περὶ ἀναστάσεως νεκρῶνは文言上一般的である。使徒言行録全体ではイエスの復活と結びつくが、この節だけで対象を限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、法廷での弁明にふさわしい端正さを保った。「一言」と「大声で叫んだ」を組み合わせ、φωνήが発言内容を指すこととκράζωの強さをそれぞれ表した。
