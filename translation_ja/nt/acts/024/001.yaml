  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: ja
  text: 五日後、大祭司アナニアは、数人の長老たちと、テルトロという弁論家[a]を伴って下って来た。彼らは総督の前でパウロを訴えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「テルトロという弁護人」とも訳せる。ギリシア語は、公の場で話す弁論家、または法廷で代理を務める者を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: 五日後
  rationale: μετά＋対格は経過時間を表す。δέの軽い叙述上の接続は、日本語では文脈に委ね、不要な接続語を加えない。
- source_word: κατέβη
  choice: 下って来た
  rationale: エルサレムからカイサリアへの移動について、καταβαίνωの方向性を自然な日本語で保持する。
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: 大祭司アナニア
  rationale: 当時のユダヤ教の大祭司職を指すため、定着した訳語と人名表記を用いる。
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: 数人の長老たちと
  rationale: τινῶνの不特定性を「数人の」で示す。ここでのπρεσβύτεροιはユダヤ人共同体の指導者であり、「長老」が適切である。
- source_word: ῥήτορος Τερτύλλου τινός
  choice: テルトロという弁論家[a]
  rationale: ῥήτωρは公的・法廷的な場の弁論家または代弁者を指しうる。「という」で人名との同格関係を自然に示し、語義の幅は脚注に残す。τινόςの不特定性は、この人物を初めて紹介する「という」によって自然に表す。
- source_word: οἵτινες ἐνεφάνισαν
  choice: 彼らは……訴えた
  rationale: 一行全体を受ける複数主語を明示し、ἐμφανίζωの法廷的用法を現代日本語の「訴える」で表す。
- source_word: τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: 総督の前でパウロを訴えた
  rationale: ἡγεμώνはローマの総督を指す。κατά＋属格の敵対的・司法的意味を「パウロを訴えた」で明確にし、与格は法的な申し立ての場を示す「総督の前で」とする。
theological_decisions: []
