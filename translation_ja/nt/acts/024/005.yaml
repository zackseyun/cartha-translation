id: ACT.24.5
reference: Acts 24:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: ja
  text: 実際、私たちはこの男が疫病のような者で、全世界にいるすべてのユダヤ人の間に騒乱を引き起こし、さらにナザレ人派の首謀者であると認めました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: 疫病のような者
  rationale: 字義は「疫病・災厄」。人に対する強い侮蔑的な比喩であることを、現代日本語で明確に伝える。
- source_word: κινοῦντα στάσεις
  choice: 騒乱を引き起こし
  rationale: στάσις は文脈上、単なる不安ではなく、反乱・暴動を含み得る社会的騒乱を指す。複数形の広がりも自然に表せる。
- source_word: τὴν οἰκουμένην
  choice: 世界中
  rationale: 当時の「人の住む世界」、特にローマ世界全域を指す慣用表現。日本語では簡潔で自然な表現を採る。
- source_word: πρωτοστάτην
  choice: 首謀者
  rationale: 先頭に立つ者、指導的扇動者という告発の含意を保つ。
- source_word: αἱρέσεως
  choice: 一派
  rationale: 当時の用法では党派・分派を意味し、後代の教理的な「異端」と断定しない。
- source_word: τῶν Ναζωραίων
  choice: 「ナザレ人たちの派」と呼ばれる
  rationale: 告発者側による集団名であることが自然に分かるようにしつつ、地名由来の呼称を保持する。
theological_decisions:
- issue: αἵρεσις を「異端」と訳すか
  choice: 一派
  alternative: 異端
  rationale: 本文は法廷での告発を記録しているが、その集団の教理を神学的に異端と裁定してはいないため。
- issue: 「ナザレ人たち」の指示対象
  choice: 告発者側の呼称としてそのまま保持
  alternative: キリスト教徒／クリスチャン
  rationale: 後代の一般名称に置き換えず、歴史的な告発の言葉遣いを保つ。
translation_notes:
  register: 法廷での告発として、強い非難調を保ちながらも、現代の一般読者に明瞭で dignified な標準日本語とした。γάρ は前文を受ける理由提示として「実際」、εὑρόντες は調査・確認を主張する語調を「私たちが調べたところ」で表した。
