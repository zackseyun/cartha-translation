  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: ja
  text: しかし、千人隊長ルシヤがやって来て、大きな力を用いて、彼を私たちの手から連れ去りました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、6節の後半および8節の前半とともに、現存する初期のギリシア語写本（3世紀のパピルス74、4世紀のシナイ写本とバチカン写本を含む）や初期のコプト語訳にはありません。一方、ビザンチン系多数本文、ラテン語伝承、後代のギリシア語写本には保存されています。これは、ローマ軍の指揮官が介入した経緯をフェリクスの前で語る初期の編集上の補足とみなされることがあります。
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: やって来て
  rationale: アオリスト分詞は、リシアがその場に来たことを示す。日本語の自然な叙述として、後続の動作につなげた。
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍の高級将校を指す語。原語の階級名を保ちつつ、現代の一般読者にも役職だと分かる表現とした。
- source_word: μετὰ πολλῆς βίας
  choice: 強引に
  rationale: 大きな物理的強制力をもって行動したことを簡潔かつ自然に表す。「暴力を振るって」として悪意まで断定することは避けた。
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: 彼を私たちの手から連れ去りました
  rationale: ἀπάγωの「連れて行く、連れ去る」と、ἐκ τῶν χειρῶν ἡμῶνの比喩的な支配・拘束の表現を保った。目的語「彼」は文脈上パウロを指す。
