  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: ja
  text: さて、二年が過ぎると、フェリクスの後任にはポルキウス・フェストゥスが就いた。フェリクスはユダヤ人たちに好意を示そうとして[a]、パウロを拘束されたままにしておいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人たちの好意を得ようとして」とも訳せる。このギリシア語表現は、相手に好意・恩恵を示すこととも、その好意を得ようとすることとも理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: さて、二年が満ちると
  rationale: 属格独立構文の時間的関係を自然な日本語で示しつつ、πληρωθείσης の「満ちる」という語感を保った。δὲ は場面の推移を示す「さて」とした。
- source_word: ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον
  choice: フェリクスの後任にはポルキウス・フェストゥスが就いた
  rationale: 直訳的な「フェリクスは後継者を得た」ではなく、官職の交代を明瞭で自然な現代日本語にした。
- source_word: θέλων τε
  choice: フェリクスは…しようとして
  rationale: 分詞が主動作の動機を示すことを、自然な因果・目的関係として表現した。
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: ユダヤ人たちの歓心を買おうとして
  rationale: 文脈上、フェリクスがユダヤ人たちの好意を得ようとした意味を自然に表す。同時に、相手に恩を施す意味にも取り得るため脚注で保持した。
- source_word: κατέλιπε
  choice: 残した
  rationale: 官職を去る際、パウロをその状態のままにしたことを簡潔に表した。
- source_word: τὸν Παῦλον δεδεμένον
  choice: パウロを拘束されたまま
  rationale: 完了受動分詞が示す継続中の被拘束状態を保ち、「鎖」や「投獄」と過度に具体化しなかった。
theological_decisions:
- issue: χάριτα καταθέσθαι の意味上の幅
  choice: ユダヤ人たちの歓心を買おうとして
  alternative: ユダヤ人たちに恩を施そうとして
  rationale: この表現は相手の好意を得ることとも、相手に恩恵を与えることとも理解できる。本文では政治的動機が明瞭な前者を採り、後者を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、歴史叙述にふさわしい落ち着いた文体とした。人名は日本語聖書で一般的な音写に従った。
