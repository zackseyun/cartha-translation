  text: ὃς καὶ τὸ ἱερὸν ἐπείρασεν βεβηλῶσαι, ὃν καὶ ⸀ἐκρατήσαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: ja
  text: この者は神殿を汚そうとまでし、私たちは彼を捕らえました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、ここに、彼らが自分たちの律法に従ってパウロを裁こうとしたことや、千人隊長リシアが彼らの手からパウロを連れ去ったことなどを含む、より長い本文があります。
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: この者は
  rationale: 直前のパウロを受ける関係代名詞。単独の節としても告発の口調が自然に伝わるよう、「この者は」とした。
- source_word: καὶ
  choice: まで
  rationale: ここでは告発を強める添加・強意の働きがあり、「神殿を汚そうとまでした」とすることで自然な現代日本語に表した。
- source_word: τὸ ἱερὸν
  choice: 神殿
  rationale: ἱερόνは内陣だけでなく神殿境内を含む複合施設を指し得るが、日本語では文脈上「神殿」が簡潔で通用する。
- source_word: ἐπείρασεν
  choice: そうとした
  rationale: この文脈では「試みる、企てる」の意。後続する不定詞と合わせ、未遂の告発であることを明確にした。
- source_word: βεβηλῶσαι
  choice: 汚す
  rationale: 神聖な場所を冒瀆し、儀礼的に汚すという意味。「冒瀆する」より一般読者に明快でありつつ、神殿の清浄性に関する告発を保つ。
- source_word: ὃν
  choice: 彼を
  rationale: 先行詞であるパウロを目的語として受ける。現代日本語として自然に明示した。
- source_word: ἐκρατήσαμεν
  choice: 捕らえました
  rationale: κρατέωの「つかまえる、拘束する」という語感を保つ。「逮捕しました」ほど公的・法的な手続を前提としない表現を選んだ。
theological_decisions:
- issue: 使徒24:6の短い本文と後代の長い異読
  choice: SBLGNTにある「私たちは彼を捕らえました」までを本文として訳す
  alternative: 「私たちの律法に従って裁こうとしたが、千人隊長リシアが来て、私たちの手から彼を奪った」などに相当する長い本文を加える写本がある
  rationale: 指定されたギリシア語本文は短い読みであるため、それをそのまま本文に採用する。長い読みは本文へ混入せず、重要な異読として脚注に示す。
translation_notes:
  register: 明快で現代的だが、法廷での告発にふさわしい節度ある文体。「この者」で告発者の距離感を表し、文末は周辺文脈と接続できる形にした。
