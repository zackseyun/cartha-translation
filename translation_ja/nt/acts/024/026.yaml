  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: ja
  text: それと同時に、フェリクスは、金銭がパウロから自分に渡されることを期待していた[a]。そのため、パウロをより頻繁に呼び寄せて、彼と話をしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は、より具体的には「パウロから賄賂をもらえると期待していた」という意味である。ギリシア語は単に「金銭」としている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: それと同時に
  rationale: 直前の出来事と並行していたことを、自然な現代日本語で示す。
- source_word: ἐλπίζων
  choice: 期待していた
  rationale: 継続中の期待を表す現在分詞を、物語の時制に合わせて表現する。
- source_word: χρήματα
  choice: 金
  rationale: 文脈上は賄賂が暗示されるが、原語自体は一般的な「金銭」を意味するため、本文では限定しない。
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: パウロから金をもらえるものと
  rationale: 受け身の意味関係と、パウロが金銭の出所であることを、自然な日本語で保持する。
- source_word: διὸ καὶ
  choice: そのため
  rationale: 金銭への期待と、その後の反復行動との因果関係を明確にする。καίの付加的な含みは、文脈上日本語に明示しなくても保たれる。
- source_word: πυκνότερον
  choice: 以前より頻繁に
  rationale: 比較級を明確に伝える。「より頻繁に」だけでは比較対象が不自然になり得るため、「以前より」を補う。
- source_word: μεταπεμπόμενος
  choice: 呼び寄せては
  rationale: 人を自分のもとへ来させるという中動態の意味と、反復性を自然に表す。
- source_word: ὡμίλει αὐτῷ
  choice: 彼と話をしていた
  rationale: 一方的な演説ではなく、会話を交わしていたことを平明に示す。
theological_decisions:
- issue: フェリクスの腐敗した動機を本文で「賄賂」と明示するか
  choice: 本文では原語どおり「金」とし、賄賂の含意は注で示す
  alternative: パウロから賄賂をもらえるものと期待していた
  rationale: 文脈は賄賂を強く示唆するが、χρήματαそのものは単に「金銭」を意味する。原文の語彙的な幅を保ちつつ、読者に文脈上の意味を知らせる。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「フェリクス」を補って主語を明確にし、後半の代名詞が誰を指すか分かりやすくした。
