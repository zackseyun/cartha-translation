base_translation:
  language: en
  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: ja
  text: ユダヤ人たちもこの告発に加勢し[a]、これらのことはそのとおりだと主張した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ともに攻撃を加え」とも訳せる。
    reason: συνεπιτίθεμαιは、他者とともに攻撃に加わることを表す。ここでは法廷で、先行する告発に加勢することを指す。
lexical_decisions:
- source_word: συνεπέθεντο
  choice: この訴えに加わり
  rationale: この動詞には、他者とともに攻撃に加わるという敵対的な含みがある。ここは法廷で告発内容を支持する場面なので、「訴えに加わる」として司法的文脈を明確にしつつ、その共同的・敵対的な動きを保った。語のより直接的な攻撃のニュアンスは脚注に示した。
- source_word: δὲ καὶ
  choice: も
  rationale: δέは穏やかに叙述を進め、καίはテルティロの告発にユダヤ人たちが加わったことを示す。日本語では「も」によって両者の働きを自然に表した。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: この審理の場にいるユダヤ人の一団を指す。「ユダヤ人たち」は民族・宗教的呼称として自然であり、「告発者たち」と限定する解釈を本文に加えない。
- source_word: φάσκοντες
  choice: 主張した
  rationale: 単に発言したのではなく、告発を支持して事実だと言い張る法廷上の行為を表すため「主張した」とした。
- source_word: ταῦτα οὕτως ἔχειν
  choice: これらのことはそのとおりだ
  rationale: 直訳的な「これらのことがこのようにある」は不自然であるため、「事実はそのとおりである」というギリシア語の慣用的意味を自然な現代日本語で表した。「これらのこと」により、直前の一連の告発を広く受ける原文の指示性を保った。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、法廷場面にふさわしい落ち着いた文体とした。「そのとおりだ」は現代語として自然でありながら、くだけすぎない。
