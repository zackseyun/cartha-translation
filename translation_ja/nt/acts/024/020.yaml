  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: ja
  text: あるいは、私が議会の前に立ったときにどんな不正行為を見いだしたのか、この人たち自身に言わせればよいのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「最高法院（サンヘドリン）の前に」。ギリシア語の「シュネドリオン」は、ここではユダヤ人の最高議会を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: そうでなければ
  rationale: パウロの弁明で、直前の訴えに代わる証言を求める選択肢を導入しているため。日本語では単独の「または」より文脈上自然。
- source_word: αὐτοὶ οὗτοι
  choice: ここにいるこの人たち自身
  rationale: 指示の力と強意の代名詞をともに保ち、目の前の告発者たちを指すことが明瞭になる表現。
- source_word: εἰπάτωσαν
  choice: 言ってもらえばよいのです
  rationale: 三人称命令の法廷的な要求を、現代日本語で自然かつ明確に表した。
- source_word: τί εὗρον
  choice: どんな…を見つけたのか
  rationale: 具体的に何を不正として認めたのかを問いただす意味を保持する。
- source_word: ἀδίκημα
  choice: 不正
  rationale: 違法行為にも一般的な過ちにもなり得る語の幅を保ち、「犯罪」と限定しすぎない。
- source_word: στάντος μου
  choice: 私が…立ったとき
  rationale: 属格独立的なアオリスト分詞の時間的関係を簡潔に示す。
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: 最高法院の前に
  rationale: ここではユダヤ人の最高評議機関を指すため、一般読者にも機関の性格が伝わる慣用的な訳語を採用した。
