  text: Ἀπεκρίθη ⸀τε ὁ Παῦλος νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν· Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν τῷ ἔθνει τούτῳ ἐπιστάμενος ⸀εὐθύμως τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: ja
  text: 総督がパウロに話すように合図すると、パウロは答えた。「あなたが長年にわたりこの民の裁判官であることを知っておりますので、私は喜んで[a]自分について弁明いたします。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「確信をもって」。この語は、単なる喜びだけでなく、進んで行う心構えや勇気、確信を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε ὁ Παῦλος
  choice: パウロは答えた
  rationale: ἀποκρίνομαιを自然な語りの日本語で「答えた」とした。τεの軽い接続は、直前の時間節から主節へ自然につながる構文によって表した。
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: 総督がパウロに話すよう合図すると
  rationale: 属格独立構文を時間節として訳した。νεύωはうなずきに限らず身ぶりによる合図も表し得るため、「合図する」とした。代名詞の指示対象は日本語で明確にするため「パウロ」とした。
- source_word: ἡγεμόνος
  choice: 総督
  rationale: この文脈ではローマの属州統治者フェリクスを指すため、現代日本語で明確な官職名「総督」を用いた。
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: 長年
  rationale: 過去から継続する長い期間を、簡潔で自然な日本語にした。
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: あなたが長年この民の裁判を務めてこられた
  rationale: κριτήςの司法的意味を保持しつつ、日本語では人物を直接「裁判官である」とするより、統治者として裁判を担ってきたことを自然に表した。完了的な継続は「務めてこられた」で示した。
- source_word: τῷ ἔθνει τούτῳ
  choice: この民
  rationale: ἔθνοςは「民族・国民」を意味し、ここではユダヤの民を指す。「この国民」より自然で、民族共同体への言及も保つ「この民」とした。
- source_word: ἐπιστάμενος
  choice: 承知していますので
  rationale: パウロが弁明に進む根拠を示す分詞であるため、理由関係が自然に伝わる「ので」を用いた。法廷にふさわしい丁寧な語調として「承知しています」とした。
- source_word: εὐθύμως
  choice: 喜んで
  rationale: 進んで行う心構え、快活さ、確信を含み得る語である。本文では自然な「喜んで」を採り、別の有力な含意を脚注に残した。
- source_word: τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι
  choice: 自分について弁明いたします
  rationale: ἀπολογέομαιの法廷的な意味を「弁明する」で保持した。τὰ περὶ ἐμαυτοῦは、パウロに関する訴えや事柄を包括する「自分について」とした。
