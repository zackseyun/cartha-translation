  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: ja
  text: あなたにもお確かめいただけることですが[a]、私は礼拝するためにエルサレムへ上ってから、まだ十二日しかたっていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたにも調べて確認できることですが」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: あなたがお確かめになれることですが
  rationale: 属格独立構文と δύναμαι＋不定詞が表す、総督自身が事実関係を確認できるという状況的な意味を、法的な文脈に合う自然な敬語で表した。「ので」として明確な理由に限定することは避けた。
- source_word: ἐπιγνῶναι
  choice: お確かめになれる
  rationale: 単に「知る」ではなく、日数に関する事実を調べて確認するという文脈上の意味を表す。
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: まだ十二日しかたっていません
  rationale: 直訳的には「私には十二日より多い日数はない」という経過時間の慣用表現であり、「十二日を超えていない」という意味を自然な現代日本語にした。
- source_word: ἀφ’ ἧς
  choice: ～てから
  rationale: 時間幅の起点を示す前置詞句を、日本語で自然に表した。
- source_word: ἀνέβην
  choice: 上って
  rationale: エルサレムへ向かうことを「上る」と表す原文の慣用的な方向表現を保持した。
- source_word: προσκυνήσων
  choice: 礼拝のために
  rationale: 未来分詞の目的用法を明示した。礼拝の対象は原文では明記されていないため、「神」を補わなかった。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムへ
  rationale: 都市を目的地とする εἰς を自然な日本語で表した。
