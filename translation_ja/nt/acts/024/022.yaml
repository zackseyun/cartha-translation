  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: ja
  text: しかしフェリクスは、その道についてより詳しい知識を持っていたので、彼らの審理を延期して[a]、こう言った。「千人隊長リシアスが下って来たら、あなたがたの件を裁決する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの訴訟手続きを延期して」。ギリシア語の動詞は、司法上の措置を先送りする、または審理を延期することを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτούς
  choice: 彼らの審理を延期して
  rationale: 動詞は司法上の判断を先送りすることを表し、αὐτούςは当事者たちを直接指す。日本語では「彼らを延期した」とは言えないため、対象を保ちながら法的文脈を自然に示す「彼らの審理を延期した」とした。
- source_word: ἀκριβέστερον εἰδὼς
  choice: かなり詳しく知っていたので
  rationale: 比較級の副詞が示す、相対的に正確で詳しい知識を自然な日本語で表し、分詞の理由を示す働きも「ので」で明確にした。
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: この道について
  rationale: 「道」は使徒言行録でキリスト者の運動を指す呼称として用いられる。「この」は日本語で呼称としての意味を自然に示す文脈補充であり、固有名詞化しすぎない表記とした。
- source_word: Ὅταν ... καταβῇ
  choice: 下って来たら
  rationale: 将来の特定の到着を条件的に表す。καταβαίνωの地理的表現を「下って来る」として保持した。
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍の tribunus に相当する役職を、使徒言行録の文脈で理解しやすく、語の構成にも即した伝統的な日本語名称で表した。
- source_word: διαγνώσομαι
  choice: 裁決しよう
  rationale: 法的な審理を踏まえて決定する意味を、単なる検討ではなく司法判断であることが明確な語で表した。
- source_word: τὰ καθ’ ὑμᾶς
  choice: あなたがたの件
  rationale: 直訳的には「あなたがたに関する事柄」。法的文脈を自然に伝えつつ、「事件」や「訴訟」ほど限定しない「件」とした。
