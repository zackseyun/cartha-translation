  to: しかしフェリクスは、その道についてより詳しい知識を持っていたので、彼らの審理を延期して[a]、こう言った。「千人隊長リシアスが下って来たら、あなたがたの件を裁決する。」
  rationale: 人名を原語に即して「リシアス」に訂正した。比較級ἀκριβέστερονを「より詳しい知識」として反映し、「この道」を原文の定冠詞により近い「その道」へ改めた。注記bは「道」が通常の道路ではなく、本文脈で用いられる運動の呼称であることを簡潔に示すために追加した。
