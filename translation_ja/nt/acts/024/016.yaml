id: ACT.24.16
reference: Acts 24:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: ja
  text: このため、私自身も、神に対しても人々に対しても、いつも良心にやましいところがないよう努めています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このため
  rationale: 直前に述べられた復活の希望を受け、そのことを理由・背景として示す推論的な表現。現代日本語では「このため」が簡潔で自然。
- source_word: καὶ αὐτὸς
  choice: 私自身も
  rationale: καίの付加的意味と、αὐτόςによる主語の強調の両方を自然な日本語で保つ。
- source_word: ἀσκῶ
  choice: 努めています
  rationale: 継続的に励み、実践するという意味を表す。文脈上、単なる訓練よりも道徳的な努力を示す「努める」が適切。
- source_word: ἀπρόσκοπον συνείδησιν
  choice: 良心にやましいところがない
  rationale: ἀπρόσκοποςは、つまずきや非難の原因がないことを示す。「責められるところのない良心」より、明瞭で自然な現代日本語として表現した。
- source_word: ἔχειν
  choice: …がないよう
  rationale: ἀσκῶに従属する目的的な不定詞を、日本語では「…よう努める」として自然に表す。
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: 神に対しても人々に対しても
  rationale: πρόςの関係・責任の方向を「に対して」で示す。ἀνθρώπουςはここでは人間一般を指すため、現代日本語の「人々」が正確で自然。
- source_word: διὰ παντός
  choice: いつも
  rationale: 継続的・恒常的な時間を、平明な現代日本語で表す。
theological_decisions:
- issue: ἀπρόσκοπονを良心との関係でどう表すか
  choice: 良心にやましいところがない
  alternative: 責められるところのない良心を持つ
  rationale: 神と人々との双方に関わる道徳的・関係的な潔白を表しつつ、罪が全くないという体系的主張へ過度に拡張しない表現とした。
- issue: ἀνθρώπουςの包括的意味
  choice: 人々
  alternative: 人間
  rationale: 文法上は男性複数形だが、ここでは男女を含む人間一般を代表的に指す。日本語では「人々」が性別を限定せず、原意を自然に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「私自身も」で原文の強調と付加を残し、「神に対しても人々に対しても」の並行構造を明示した。注を必要とするほどの本文上の異読や、日本語で保持すべき重大な語義上の曖昧さはない。
