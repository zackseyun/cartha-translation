id: ACT.24.14
reference: Acts 24:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: ja
  text: しかし私は、あなたにこのことを認めます。すなわち、彼らが「一派」[a]と呼んでいる「道」に従って、私は父祖たちの神[b]に仕え、律法と預言者たちの書に記されているすべてのことを信じています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「分派」とも訳せる。ここでのギリシア語は党派や集団を指し、後代の教理的な意味での「異端」とは限らない。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「父祖に属する神」または「先祖伝来の神」。イスラエルの父祖たちが礼拝してきた神を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: 認めます
  rationale: 法廷でパウロが公然と事実を認める場面に合い、罪の自白という含みを不必要に加えない。
- source_word: κατὰ τὴν ὁδόν
  choice: この道に従って
  rationale: ὁδόςが使徒言行録における初期のキリスト者の運動の呼称であることを保ち、κατάの規範・方向に沿う意味も自然に表す。
- source_word: αἵρεσιν
  choice: 一派
  rationale: 当時の文脈では集団・党派を指し、後代の教理的な「異端」という意味を持ち込まない。
- source_word: λατρεύω
  choice: 仕え
  rationale: 神への礼拝的奉仕を表す語であり、日本語では「神に仕える」が宗教的奉仕と礼拝の双方を自然に含む。
- source_word: τῷ πατρῴῳ θεῷ
  choice: 先祖からの神
  rationale: 「祖先伝来の、先祖に属する神」という形容詞の意味を保ち、原文にない所有代名詞を補わない。
- source_word: πιστεύων
  choice: 信じています
  rationale: 現在分詞の継続的な意味を自然な日本語の述語として表し、神への奉仕と聖書への信頼を結び付ける。
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: 記されているすべてのこと
  rationale: 完了受動分詞が示す、書かれて今も記録として存在する内容の総体を明確に表す。
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις γεγραμμένοις
  choice: 律法に沿って、また預言者たちの書に記されている
  rationale: 本文上の非対称な構文を反映し、前半のκατάを「律法に沿って」、後半のἐνを「預言者たちの書に」と訳し分ける。
theological_decisions:
- issue: 「この道」とイスラエルの信仰との関係
  choice: パウロは「この道」に従うことを、先祖伝来の神への奉仕および律法と預言者への信頼と連続するものとして述べる。
  alternative: キリスト者の道をユダヤ教とは別個の宗教として対置する。
  rationale: 原文は「この道」を先祖からの神へのλατρεύωと、律法および預言者に記された事柄への信仰に直接結び付けており、後代の宗教的分離を持ち込むべきではない。
- issue: λατρεύωの礼拝的含意
  choice: 「神に仕える」とし、礼拝と奉仕の幅を残す。
  alternative: 「礼拝する」として祭儀・崇敬の側面を前面に出す。
  rationale: λατρεύωには宗教的礼拝・奉仕の意味がある。「仕える」は日本語で神への献身的奉仕を自然に表しつつ、意味を礼拝行為だけに狭めない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、法廷での弁明にふさわしい端正さを保った。「この道」は歴史的呼称として括弧で示し、「一派」は相手側の呼称であることが分かるよう引用符を付した。原文末尾の継続する構文は、日本語では一節として完結する形に整えた。
