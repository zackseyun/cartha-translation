  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: ja
  text: また彼らは、私がだれかと議論したり[a]、群衆を騒がせたり[b]しているのを、神殿でも、会堂でも、町のどこでも見つけたのではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれかと論じ合ったり」または「だれかと話し合ったり」。ギリシア語の動詞は、話し合うことにも議論することにも用いられる。ここでは、公の騒ぎを起こしたという嫌疑をパウロが否定している。
    reason: lexical_alternative
  - marker: b
    text: 別訳「群衆を集めたり」。ギリシア語の表現は群衆の騒ぎを引き起こすことを指すが、必ずしも暴動にまで至ったことを意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόνはここでは内陣に限定されず神殿域を指すが、日本語では文脈上自然な「神殿」で表せる。
- source_word: εὗρόν με
  choice: 私が…しているところを見つけた
  rationale: 対格の代名詞と分詞を伴う構文を、告発者がその行為を現認していないという法廷での趣旨が明確になる自然な日本語にした。
- source_word: πρός τινα διαλεγόμενον
  choice: だれかと議論したり
  rationale: διαλέγομαιには話し合う、論じ合う、議論するという幅がある。騒乱の嫌疑を否定する文脈に合う「議論する」を採り、過度に敵対的な「言い争う」は避けた。
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: 群衆を騒がせたり
  rationale: 群衆の騒ぎや騒動を引き起こすことを表す。「暴動を起こす」ほど強くせず、公の騒乱という含意を自然に伝える。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 会堂でも
  rationale: ユダヤ人の集会・礼拝の場所を指す標準的な訳語として「会堂」を用いた。
- source_word: κατὰ τὴν πόλιν
  choice: 町のどこでも
  rationale: κατάの場所的・分布的な意味を、町の各所を含む全面的な否定として自然に表した。
