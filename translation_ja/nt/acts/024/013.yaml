  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: ja
  text: また、彼らは、今、私を告発している事柄を、あなたに立証することもできません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立証する」は、「提示する」または「示す」とも訳せる。ギリシア語の動詞は、何かを提示したり確かなものとして示したりすることを意味し、ここでは告発を裏づけるという法的な意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: また…もできません
  rationale: 前節から続く否定を示す接続表現。日本語として自然に、追加的な否定の意味を保つ。
- source_word: παραστῆσαι
  choice: 立証する
  rationale: 基本的には「提示する」「示す」の意味を持つが、ここでは総督の前で訴えを裏づける法廷文脈なので、「立証する」が最も明確で自然。語義の幅は脚注に残した。
- source_word: δύνανταί
  choice: できません
  rationale: 能力・可能性を表す動詞を、現代日本語の自然な可能表現で訳した。
- source_word: σοι
  choice: あなたに
  rationale: フェリクスを指す与格を直接的に訳した。法廷の文脈は本文から明らかなため、「あなたの前で」とは意訳しなかった。
- source_word: περὶ ὧν
  choice: 事柄を
  rationale: 告発の対象となっている諸事を指す関係表現。日本語では後続の「訴えている」と「立証する」の双方に自然につながるよう「事柄を」とした。
- source_word: νυνὶ
  choice: 今
  rationale: 現在行われている告発を示す時間副詞を簡潔に訳した。
- source_word: κατηγοροῦσίν μου
  choice: 私を訴えている
  rationale: 法的な告発を表す動詞と、その対象を表す属格代名詞を、法廷文脈に合う自然な日本語で訳した。
