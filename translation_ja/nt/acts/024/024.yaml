source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: ja
  text: 数日後、フェリクスは自分の妻で、ユダヤ人であるドルシラとともに来て、パウロを呼び寄せ、メシア・イエスへの信仰[a]についてパウロの話を聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア・イエスへの信頼」とも訳せる。ギリシア語の「信仰」に当たる語は、「信頼」の意味を帯びることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: 数日後
  rationale: μετά＋対格の時間表現を自然な現代日本語で表した。δέの軽い接続機能は文脈上あえて独立した語にせず、叙述の流れに含めた。
- source_word: παραγενόμενος
  choice: やって来た
  rationale: フェリクスの到来を示す付帯状況的な分詞。硬すぎない叙述表現とした。
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: 自分の妻ドルシラとともに
  rationale: σύνの同伴とἰδίᾳの所有・強調をともに保った。日本語として人物関係が明瞭になる語順を採った。
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: ユダヤ人である
  rationale: ドルシラを修飾する分詞句を、民族的・宗教的帰属の双方を過度に限定しない通常の表現で訳した。
- source_word: μετεπέμψατο
  choice: 呼び寄せ
  rationale: 人を迎えにやって呼ぶ意の中動態を、自然な日本語で簡潔に表した。
- source_word: ἤκουσεν αὐτοῦ
  choice: 彼の話を聞いた
  rationale: 属格を伴うἀκούωはここでは継続的に耳を傾ける意味合いを持つ。単なる音声知覚ではなく、パウロの話を聞いたことが伝わる表現とした。
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: メシア・イエスへの信仰について
  rationale: περί＋属格を「について」、πίστις＋εἰς＋対格を信仰の向かう対象として「への信仰」とした。Χριστόςの称号性を「メシア」で表し、原文の語順も保った。
theological_decisions:
- issue: Χριστὸν Ἰησοῦνの訳し方
  choice: メシア・イエス
  alternative: キリスト・イエス／メシアであるイエス
  rationale: Χριστόςはこの箇所でも称号としての意味が生きているため「メシア」と訳した。「メシアであるイエス」も意味を明示できるが、原文の簡潔さと語順を優先した。
- issue: τῆς εἰς Χριστὸν Ἰησοῦν πίστεωςの理解
  choice: メシア・イエスへの信仰
  alternative: メシア・イエスへの信頼
  rationale: πίστις＋εἰς＋対格は、ここではイエスを対象とする信仰を最も自然に表す。「信頼」という語義上の可能性も注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。固有名は一般的な聖書表記に従い、Χριστόςは称号として「メシア」と訳した。「自分の妻」はἰδίᾳの強調を保つため残した。
