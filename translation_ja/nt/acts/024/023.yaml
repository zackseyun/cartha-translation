  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: ja
  text: そこで彼は百人隊長に、パウロを拘禁しておく一方で、ある程度の自由を認め、パウロの仲間たち[a]が彼の世話をするのを、だれであれ妨げないようにと命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼に属する者たち」。パウロの家族に限らず、仲間や支援者を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος τῷ ἑκατοντάρχῃ
  choice: 百人隊長に……命じた
  rationale: 分詞構文を自然な日本語の叙述に改めた。ἑκατοντάρχηςはローマ軍の役職を表す標準的な「百人隊長」とした。
- source_word: τηρεῖσθαι αὐτόν
  choice: パウロを拘禁しておく
  rationale: 文脈上、単に見張るのでなく監視下に留め置くことを表す。日本語では目的語を明確にするため固有名を補った。
- source_word: ἔχειν τε ἄνεσιν
  choice: ある程度の自由を与え
  rationale: ἄνεσιςは安楽、緩和、拘束からの一定の自由を含み得る。完全な釈放ではなく、拘禁条件の緩和であることを示した。
- source_word: μηδένα κωλύειν
  choice: 誰も妨げないように
  rationale: 否定の普遍性を保ちつつ、命令内容として自然な日本語にした。
- source_word: τῶν ἰδίων αὐτοῦ
  choice: 彼の身内の者
  rationale: 字義的には「彼自身の者たち」。血縁者に限定せず、親しい仲間や支援者を含み得る表現として「身内の者」を選び、注で範囲を示した。
- source_word: ὑπηρετεῖν αὐτῷ
  choice: 世話をする
  rationale: ここでは実際的な奉仕や必要品の提供を指すと考えられるため、宗教的含意を過度に持たせず平明に訳した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、法的・歴史的叙述にふさわしい落ち着いた文体とした。「一方」で拘禁と待遇緩和の対照を自然に示した。
