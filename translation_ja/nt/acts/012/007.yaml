id: ACT.12.7
reference: Acts 12:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: ja
  text: すると、見よ、主の使いがそばに立ち[a]、牢の一室に[b]光が輝いた。その使いはペトロの脇腹をたたいて起こし、「急いで立ち上がりなさい」と言った。すると、鎖が彼の両手から外れて落ちた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「突然現れ」。このギリシア語動詞は、そばに立つことに加え、突然そこに現れることを表す場合がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳「部屋に」。この語は一般に部屋や居室を指すが、ここでは牢獄内の一室のこと。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: すると見よ
  rationale: 注意を促して場面を鮮明にする談話標識の力を保ちつつ、物語の進行に自然につなげた。
- source_word: ἄγγελος κυρίου
  choice: 主の使い
  rationale: 属格構文を自然な日本語で表し、主に属する、または主から遣わされた使者という意味を保った。
- source_word: ἐπέστη
  choice: そばに立ち
  rationale: 近くに立つ意味を本文に採りつつ、突然現れる含意もあり得るため脚注で示した。
- source_word: φῶς ἔλαμψεν
  choice: 光が輝いた
  rationale: 名詞と動詞を素直に訳し、暗い獄中で光が現れた情景を簡潔に伝えた。
- source_word: ἐν τῷ οἰκήματι
  choice: 牢の一室に
  rationale: 語自体は部屋・居室を広く指すため「一室」とし、牢獄という文脈を「牢の」で明示した。
- source_word: πατάξας
  choice: たたいて
  rationale: 単なる軽い接触と限定せず、起こすために身体を打ったという動作を自然な強さで表した。
- source_word: τὴν πλευρὰν
  choice: 脇腹
  rationale: 身体の側面を指す語を、現代日本語で具体的かつ自然に訳した。
- source_word: ἤγειρεν αὐτὸν
  choice: 起こし
  rationale: ここでは眠っているペトロを目覚めさせる文脈なので、「起こす」が適切である。
- source_word: Ἀνάστα
  choice: 立ち上がりなさい
  rationale: 起き上がるよう命じるアオリスト命令を、明瞭で自然な命令表現にした。
- source_word: ἐν τάχει
  choice: 急いで
  rationale: 即時性と切迫感を簡潔な現代日本語で表した。
- source_word: ἐξέπεσαν ... αἱ ἁλύσεις
  choice: 鎖が…外れて落ちた
  rationale: 鎖が突然手から離れて落下したという動きを明示した。
- source_word: ἐκ τῶν χειρῶν
  choice: 彼の両手から
  rationale: χείρを解剖学的に「手首」と限定せず「手」と訳し、複数形を「両手」で表した。
theological_decisions:
- issue: ἄγγελος κυρίου における κύριος の訳
  choice: 主
  alternative: 主人
  rationale: 新約聖書における標準的な称号として「主」を用い、本文が明示しない教派的含意は加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」でルカの生き生きとした注意喚起を保持した。天使の出現、光、鎖の解放という劇的な展開は簡潔な叙述で表した。
