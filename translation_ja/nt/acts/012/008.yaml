  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: ja
  text: そこで御使いがペテロに言った。「帯を締め、履物を履きなさい。」ペテロはそのとおりにした。御使いは言う[b]。「上着を羽織り[c]、私について来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ギリシア語は「言う」。物語を生き生きと描く歴史的現在。
    reason: lexical_alternative
  - marker: c
    text: 別訳「上着を体に巻きつけ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: 御使い
  rationale: 直前の牢獄で超自然的に現れた天上の存在を指すため、日本語聖書で定着し、一般の使者とも区別できる「御使い」とした。
- source_word: Ζῶσαι
  choice: 帯を締め
  rationale: ζώννυμι の中動態命令は、行動できるよう腰の帯を締める具体的な動作を表す。古風な「腰に帯を締めよ」より簡潔で自然な表現とした。
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: 履物を履きなさい
  rationale: σανδάλια はサンダル類の履物だが、現代日本語の「サンダル」は現代的な形状を強く連想させうるため、文脈に適した「履物」とした。動詞は自然な「履く」で表した。
- source_word: ἐποίησεν δὲ οὕτως
  choice: ペテロはそのとおりにした
  rationale: οὕτως は直前の二つの命令への服従をまとめる。「彼」では指示対象が曖昧になりうるため、文脈上の主語ペテロを明示した。
- source_word: λέγει
  choice: 言う
  rationale: ギリシア語の歴史的現在を保ち、場面の生き生きとした語り口を伝えるため、過去形に均さず現在形とした。
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: 上着を身にまとい
  rationale: ἱμάτιον は外衣を指し、περιβάλλω は体の周りに掛ける・まとう動作を表す。「外套」より平明で、「着る」だけより原語の動作を反映する。
- source_word: ἀκολούθει μοι
  choice: 私について来なさい
  rationale: ἀκολουθέω の基本的な「後について行く」を保ちつつ、この場面で実際に移動する命令として自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準語。命令は「なさい」で統一した。主語の混同を避けるためペテロと御使いを適宜明示した。英語版の脚注aに相当する内容は本文の「帯を締め」で十分明確なため付さず、本文に存在する脚注記号と脚注一覧を一致させた。
