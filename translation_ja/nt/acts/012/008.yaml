  naturalness: 明瞭な現代標準語で、命令の「なさい」も一貫している。「上着を身にまとい」は意味が通るが、「上着を羽織り」のほうが、外衣を身に掛ける περιβαλοῦ の動作を自然に表す。
  terminology: 「御使い」はこの文脈の天的存在を指す訳語として適切である。「上着」はἱμάτιονの外衣性をやや弱くしうるものの、「羽織り」と組み合わせることで外に掛ける衣の性格を十分表せる。神学的に問題となる語はない。
