translation:
  language: ja
  text: ペトロが門口の戸をたたくと、ロデという若い女の召使い[a]が応じるためにやって来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女奴隷」とも訳せる。ギリシア語のπαιδίσκηは、家庭で仕える若い女性を指し、その身分が奴隷である場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: ペトロが……たたくと
  rationale: アオリスト分詞とδέが示す物語上の次の出来事を、自然な日本語の時間表現「すると」に相当する「たたくと」で表した。主語は直前の文脈からペトロと明示した。
- source_word: θύραν τοῦ πυλῶνος
  choice: 門口の戸
  rationale: θύρα（戸）とπυλών（門を備えた入口・門口）の双方を保ちつつ、家の外側の入口を指す自然な日本語とした。
- source_word: προσῆλθε
  choice: 出て来た
  rationale: 戸をたたく音に応じて家の中から入口へ近づく場面なので、日本語では「出て来た」が自然である。
- source_word: παιδίσκη
  choice: 女中
  rationale: 若い女性の家内使用人または奴隷を指し得る語。本文では家庭内での役割を明瞭に示す「女中」とし、法的身分の可能性は脚注に残した。
- source_word: ὑπακοῦσαι
  choice: 応対に
  rationale: 基本的には「聞く・応じる」だが、戸口での呼びかけやノックに応答するという文脈上の慣用的意味を表した。
- source_word: ὀνόματι Ῥόδη
  choice: ロデという名の
  rationale: 人名を導入する与格表現を自然な日本語にした。Ῥόδηは日本語聖書で定着した表記「ロデ」とした。
