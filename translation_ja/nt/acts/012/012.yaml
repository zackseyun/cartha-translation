  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: ja
  text: ペトロはこのことを悟ると、マルコと呼ばれていたヨハネの母マリアの家に行った。そこには大勢の人が集まっていて、祈っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: 事情を悟り
  rationale: 文脈上、ペトロが御使いの去った後に自分の置かれた状況を十分に理解したことを表す。目的語を「事情」と補い、自然な日本語にした。
- source_word: τε
  choice: そこで
  rationale: 弱い叙述上の接続を表し、直前の出来事を受けた行動として自然につなぐ。
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: 家に行った
  rationale: ある場所へ向かう移動を、物語の視点に合う現代日本語で表した。
- source_word: τῆς Μαρίας τῆς μητρὸς Ἰωάννου
  choice: ヨハネの母マリア
  rationale: どのマリアかを示す属格関係を簡潔かつ明確に保持した。
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: マルコと呼ばれていた
  rationale: ヨハネがマルコという別名で呼ばれていたことを示す。原文に明示されない「また」を加えなかった。
- source_word: οὗ
  choice: そこには
  rationale: マリアの家を受ける場所の関係表現を、自然な日本語の文として示した。
- source_word: ἱκανοὶ
  choice: 大勢の人
  rationale: かなりの人数を表す複数形の語義を、平明な日本語で表した。
- source_word: συνηθροισμένοι
  choice: 集まって
  rationale: すでに集合してその状態にあったことを文脈上十分に伝える自然な表現とした。
- source_word: καὶ προσευχόμενοι
  choice: 祈っていた
  rationale: その場で継続中だった祈りの行為を表した。
