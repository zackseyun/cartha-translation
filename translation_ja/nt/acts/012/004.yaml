  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: ja
  text: 彼を捕らえた後、牢に入れ、兵士の組を四組[a]に引き渡して、彼を見張らせた。過越の祭り[b]の後で、彼を民衆の前に引き出すつもりだったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「兵士の四人組を四組」。すなわち、四人ずつの四組である。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の「パスカ」は「過越の祭り」を意味する。古い翻訳の中には、ここを「復活祭」と訳すものもある。
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: 捕らえると
  rationale: アオリスト分詞が主動詞に先立つ出来事を示すため、拘束してから投獄したという順序を自然な日本語で表した。
- source_word: ἔθετο εἰς φυλακήν
  choice: 牢に入れ
  rationale: 投獄を表す慣用的な句。物語の格調を保ちつつ、現代の読者にも明瞭な表現とした。
- source_word: παραδοὺς
  choice: 引き渡して
  rationale: 兵士たちの監視下へ移したという拘束上の意味を保つ。
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: 四人一組の兵士四組
  rationale: τετράδιονが四人から成る一組を指すことを本文で明確にし、合計十六人の交替部隊という構成を過不足なく示した。
- source_word: φυλάσσειν αὐτόν
  choice: 見張らせた
  rationale: 引き渡した目的を使役表現で自然に示した。
- source_word: βουλόμενος
  choice: つもりだった
  rationale: ヘロデの計画的な意図を示しつつ、感情的な願望までは付加しない表現とした。
- source_word: μετὰ τὸ πάσχα
  choice: 過越の祭りの後で
  rationale: πάσχαの通常の歴史的・ユダヤ的意味を日本語の標準的な聖書用語で表した。
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: 彼を民衆の前に引き出す
  rationale: 公の場へ連れ出す意味を表しつつ、本文が明示していない正式な裁判や処刑を訳文に付け加えないようにした。
- source_word: λαῷ
  choice: 民衆
  rationale: 公衆として集まる人々を指す文脈に合い、単なる民族的呼称とも区別できる自然な語を選んだ。
theological_decisions:
- issue: πάσχαの訳語
  choice: 過越の祭り
  alternative: 復活祭
  rationale: ギリシア語πάσχαはここでユダヤ教の過越の祭りを指す。後代の一部の翻訳伝統に見られる「復活祭」は本文の歴史的・語彙的意味を直接表さないため、本文には採用しない。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で品位ある物語調。ギリシア語本文で明示されていない主語名は補わず、日本語で自然に省略した。脚注記号は対応箇所の直後に置いた。
