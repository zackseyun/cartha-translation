  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: ja
  text: そして、ヨハネの兄弟であるヤコブを剣で殺した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死刑にした」または「処刑した」とも訳せる。ギリシア語は、ヤコブを死に至らせたことを述べている。前後の文脈からは、公的な処刑だった可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: 殺した
  rationale: ここでは人を死に至らせることを表す。文脈上は公権力による処刑の可能性が高いが、動詞そのものは法的手続きを明示しないため、本文では自然で直接的な「殺した」とした。
- source_word: δὲ
  choice: そして
  rationale: 物語を先へ進める弱い接続を表す。強い対比を加えず、前節からの流れを自然に示す。
- source_word: Ἰάκωβον
  choice: ヤコブ
  rationale: 新約聖書の人名として日本語で定着した表記を用いた。
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: ヨハネの兄弟ヤコブ
  rationale: どのヤコブかを特定する同格表現。原文の関係を保ちつつ、日本語として自然な語順にした。
- source_word: μαχαίρῃ
  choice: 剣で
  rationale: μάχαιραは剣または短剣を指し、ここでは手段を表す与格である。具体的な殺害手段をそのまま示した。
theological_decisions:
- issue: ヘロデの行為の性質
  choice: 法的な処刑とは限定せず、「殺した」と訳す。
  alternative: 「処刑した」と訳し、公権力による刑の執行を前面に出す。
  rationale: 周辺の文脈は公的迫害を示唆するが、ἀνεῖλεν自体は死に至らせたことを述べるにとどまる。本文が明示しない法的含意を加えず、可能な理解を脚注に残した。
translation_notes:
  register: 明快で現代的な標準日本語を用い、簡潔で厳粛な物語調を保った。「兄弟」は原文に忠実だが、日本語では兄か弟かを特定しない。
