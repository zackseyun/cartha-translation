source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: ja
  text: ヘロデがペトロを引き出そうとしていた[a]、まさにその夜、ペトロは兵士二人の間で、二本の鎖でつながれたまま眠っていた。戸口の前では、番兵たちが牢を見張っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人々の前に連れ出そうとしていた」とも訳せる。このギリシア語の動詞は、公の場や裁判のために人を連れ出すことを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「牢を警備していた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: ～しようとしていた
  rationale: 間近に迫った行為を表すμέλλωの意味を、自然な現代日本語で示す。意図だけでなく切迫性も含み得る。
- source_word: προαγαγεῖν αὐτόν
  choice: ペトロを引き出す[a]
  rationale: 拘禁場所から公の場または裁きの場へ連れ出す動きを簡潔に表す。目的は本文で限定せず、語義の幅を注で示す。
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: まさにその夜
  rationale: 指示語ἐκείνῃの特定性と、物語上の緊迫感を自然に反映する。
- source_word: κοιμώμενος
  choice: 眠っていた
  rationale: 継続中の動作を表す分詞のニュアンスを保つ。
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: 二人の兵士の間で
  rationale: 空間関係を明確かつ自然に表す。
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: 二本の鎖につながれ
  rationale: 完了受動分詞が示す拘束された状態と、二本の鎖という手段を簡潔に表す。
- source_word: φύλακες
  choice: 番兵たち
  rationale: 牢の警備に当たる者という文脈に合い、一般読者にも明確な語を選ぶ。
- source_word: πρὸ τῆς θύρας
  choice: 戸口の前では
  rationale: πρό＋属格の空間的意味を直接反映する。
- source_word: ἐτήρουν τὴν φυλακήν
  choice: 牢を見張っていた[b]
  rationale: τηρέωの継続的な監視・警備の意味を表し、φυλακήはこの文脈で拘禁施設として訳す。別訳を注記する。
