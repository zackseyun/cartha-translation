  register: 明快で格調を保った現代標準日本語。原文の進行中の状況を「～していた」でそろえ、ペトロの拘束と厳重な監視を過度な説明なしに描く。接続辞δέは、日本語で不要な談話標識を加えず、文の流れによって表した。
