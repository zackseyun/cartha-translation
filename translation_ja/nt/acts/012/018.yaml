  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: ja
  text: 夜が明けると、ペテロがいったいどうなったのかと、兵士たちの間に少なからぬ騒ぎが起こった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: 夜が明けると
  rationale: 属格絶対による時の表現を、現代日本語で自然な従属節として訳した。δέの場面転換は文脈上十分に伝わるため、明示的な「さて」は加えない。
- source_word: τάραχος οὐκ ὀλίγος
  choice: 少なからぬ騒ぎ
  rationale: οὐκ ὀλίγοςの緩叙法を保ちつつ、τάραχοςを文脈に合う「騒ぎ」とした。「大騒ぎ」より原文の修辞をよく反映する。
- source_word: ἐν τοῖς στρατιώταις
  choice: 兵士たちの間に
  rationale: στρατιώταιςの基本義を「兵士たち」とし、ἐνが示す、騒ぎの生じた集団内という関係を「間に」で表した。
- source_word: τί ἄρα
  choice: いったいどうなったのかと
  rationale: 間接疑問に含まれる推量と困惑のニュアンスを、自然な日本語の「いったい」で表した。
- source_word: ὁ Πέτρος
  choice: ペトロ
  rationale: 日本語聖書で広く通用する人名表記を用いた。
- source_word: ἐγένετο
  choice: どうなったのか
  rationale: 人物を主語とするτί … ἐγένετοは「何になったか」ではなく「どうなったか／何が起きたか」という慣用的意味であり、その意味を自然に表した。
