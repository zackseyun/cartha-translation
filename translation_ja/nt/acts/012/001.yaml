id: ACT.12.1
reference: Acts 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: ja
  text: そのころ、ヘロデ王は、教会に属する人々のうち何人かに危害を加えようとして、手を出した[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その時」「その時分」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「手を置いた」。ここでは、教会に属する人々に対して敵対的な行動に出たことを表す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「苦しめようとして」「害を加えようとして」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: そのころ
  rationale: κατάを伴う時の表現を、厳密な一点ではなくその前後を含み得る自然な日本語として訳した。δέの軽い叙述上の移行は、日本語では明示せず文脈に委ねた。
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: 手をかけた
  rationale: 字義的な「手を置いた」ではなく、敵対的な行動に出たことを示す慣用表現として訳した。「逮捕した」だけに限定せず、後続の目的不定詞が示す危害の幅を保つ。
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: ヘロデ王
  rationale: ギリシア語では同格的な語順だが、現代日本語で自然な称号付き固有名詞とした。
- source_word: κακῶσαί
  choice: 苦しめようとして
  rationale: 危害や虐待を加える意味を自然に表しつつ、「迫害する」という宗教的・専門的な含意を動詞自体に過度に読み込まない。目的を表す不定詞の力も保持した。
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: 教会に属する何人か
  rationale: 共同体に属する人々のうちの一部を指すことが明確になる、自然な日本語とした。
theological_decisions:
- issue: ἐκκλησίαの訳語
  choice: 教会
  alternative: 集会／会衆
  rationale: 使徒言行録のこの文脈ではキリスト者の共同体を指す。「教会」は現代日本語で標準的かつ明瞭であり、建物だけを意味するものとして限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「手をかけた」は文脈上の敵対性を保つが、それだけでは逮捕に限定しない。脚注によって原文の慣用性と語義の幅を示した。
