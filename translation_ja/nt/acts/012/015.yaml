id: ACT.12.15
reference: Acts 12:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: ja
  text: だが、彼らは彼女に言った。「あなたは気がどうかしている。」それでも彼女は、確かにそうなのだと言い張った。彼らは言い続けた。「彼の御使いなのだ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼の守護天使」「彼の代理の御使い」、また一部の解釈では「彼の霊（亡霊）」を意味するとされることもある。ギリシア語は単に「彼の御使い」と記している。
    reason: 原文が説明していない「彼の御使い」の関係について、可能な解釈を示しつつ、本文では曖昧さを保つため。
lexical_decisions:
- source_word: Μαίνῃ
  choice: あなたは気が変になっている
  rationale: 相手の主張を正気でないとして退ける口語的な非難。「狂っている」よりも過度に攻撃的・臨床的にならず、現代日本語で原文の強い驚きと否定を伝える。
- source_word: διϊσχυρίζετο
  choice: 言い張った
  rationale: 未完了過去が示す継続的な強い主張を自然な日本語で表す。直前の「それでも」と合わせ、反対されても主張を続けたことを示す。
- source_word: οὕτως ἔχειν
  choice: 確かにそうなのだと
  rationale: 「そのような状態である／そのとおりである」という慣用表現を、彼女が自分の報告の真実性を強く主張した文脈に即して訳す。
- source_word: ἔλεγον
  choice: 言い続けた
  rationale: 未完了過去の継続・反復性を明示し、彼らが同じ説明を繰り返していた様子を保つ。
- source_word: ἄγγελός
  choice: 御使い
  rationale: この文脈では人間の使者より超自然的存在を指す可能性が高い。聖書日本語として通用しつつ、語自体が持つ「使者」の含みも保ちやすい「御使い」を採用する。
- source_word: αὐτοῦ
  choice: 彼の
  rationale: 属格を簡潔な所有表現として訳し、原文どおり、その関係の具体的意味までは本文で限定しない。
theological_decisions:
- issue: 「彼の御使い」の意味
  choice: 本文では「彼の御使い」と直訳的に保つ。
  alternative: 彼の守護天使／彼を代表する御使い／彼の霊または亡霊
  rationale: ギリシア語は単に「彼の御使い」と述べ、その存在とペテロとの関係を説明していない。特定の天使論や死者観を本文へ持ち込まず、解釈候補は脚注に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語の会話としての勢いと品位を保った。「気が変になっている」は強い否定だが、現代の医学用語のようには響かない表現。「御使い」は聖書文体として自然で、本文の神学的曖昧さを維持する。
