  source_fidelity: ギリシア語の反復・継続を表す未完了形（διϊσχυρίζετο、ἔλεγον）と、「彼の御使い」という未解説の表現は、概ね適切に保持されている。ただし、文頭の「すると」はδέの対比・応答の働きよりも場面展開を強く示すため、「だが」がより近い。
  naturalness: 「あなたは気が変になっている」は現代標準日本語としてやや不自然であり、精神状態への不必要に強い烙印のようにも響きうる。「気がどうかしている」のほうが、この会話における慣用的で自然な非難として適切である。また「それは彼の御使いだ」より「彼の御使いなのだ」のほうが、原文の名詞述語を自然に表す。
  terminology: 「御使い」はこの文脈で自然な聖書用語であり、ἄγγελοςの超自然的な意味を適切に示す。「彼の御使い」は、関係性を説明しない原文の曖昧さを保っている。脚注では「代表する」より「代理の」とするほうが現代日本語として明瞭である。
