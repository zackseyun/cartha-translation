  to: だが、彼らは彼女に言った。「あなたは気がどうかしている。」それでも彼女は、確かにそうなのだと言い張った。彼らは言い続けた。「彼の御使いなのだ[a]。」
  rationale: 本文を自然な現代標準日本語へ整えつつ、相手の報告を退ける強い発言、ロデの継続的な主張、彼らの反復する発言を保持した。「彼の御使い」は解釈的に限定せず、脚注でも候補を断定しない形にした。
