  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: ja
  text: 群衆は叫び続けた。「神の声だ。人間の声ではない！」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の声」は、「ある神の声」とも、「（唯一の）神の声」とも理解できる。ギリシア語はどちらを指すか明示しないが、この場面では、群衆がヘロデを神のようにたたえた言葉と考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: 群衆
  rationale: ここでは正式な政治団体ではなく、その場に集まった民衆を指すため、現代日本語として自然な「群衆」とした。
- source_word: ἐπεφώνει
  choice: 叫び続けた
  rationale: 未完了過去の継続的・反復的な様相を表し、一度だけ叫んだのではなく歓声を上げ続けたことを伝える。
- source_word: Θεοῦ
  choice: 神の
  rationale: 無冠詞であり、異教的な文脈では特定の唯一神よりも「ある神」の意が有力。ただし日本語の「神の」はそれ自体で定・不定を明示しないため、原文の曖昧さを保てる。脚注で二つの理解を説明する。
- source_word: φωνὴ
  choice: 声
  rationale: 名詞表現を保ち、直後のἀνθρώπουとの対照を明確にする。日本語では「これは」を補って感嘆的な発言として自然にした。
- source_word: ἀνθρώπου
  choice: 人間の声
  rationale: 神との対照を自然な現代日本語で明瞭に示す。「人の」よりも神対人間という区別が伝わりやすい。
theological_decisions:
- issue: Θεοῦを特定の「神」とするか、不特定の「ある神」とするか
  choice: 本文では定・不定を明示しない「神の」とし、文脈上の有力な意味を脚注で示す
  alternative: 「ある神の声だ」または「神の声だ」と特定的に解する
  rationale: ギリシア語は無冠詞で、異教的な群衆がヘロデを神格化して歓呼する文脈では「ある神」の意が有力である。一方、日本語では冠詞がなく、「神の」と訳すことで原文が許す曖昧さを不自然なく保持できる。
translation_notes:
  register: 明快で現代的ながら、叙事本文にふさわしい品位を保った。「これは」を補い、日本語の直接話法として自然にした。脚注記号[a]は引用文の直後に配置した。
