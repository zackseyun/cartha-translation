source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: ja
  text: こうして、ペテロは牢に入れられていた。しかし教会は、彼のために神に熱心に[a]祈り続けていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「熱心に」は、「切に」または「絶えず」とも訳せる。ギリシア語は、祈りの強さ、あるいは粘り強い持続を強調し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: 拘禁されていた
  rationale: 未完了過去の受動態が表す継続的な拘束を自然な日本語で示す。「見張られていた」よりも、原文が拘禁の方法を特定していない点を保てる。
- source_word: ἐν τῇ φυλακῇ
  choice: 牢に
  rationale: 文脈上、拘禁場所である牢獄を指す。現代語として簡潔で、物語文の格調も保つ。
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: 祈り続けていた
  rationale: ἦνと現在分詞による迂言的構文の継続性を、日本語では「続けていた」で明確に表す。受動的な英語表現を直訳せず、祈る主体を主語にして自然にした。
- source_word: ἐκτενῶς
  choice: 熱心に
  rationale: 祈りの強さ、または持続的な切実さを表す自然な訳。どちらか一方に限定しすぎない。
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: 教会は
  rationale: 行為主体を日本語の主語として示す。ここでの「教会」は制度や建物ではなく、キリスト者の共同体を指す。
- source_word: πρὸς τὸν θεὸν
  choice: 神に
  rationale: 祈りの向かう相手を自然な日本語で表す。
- source_word: περὶ αὐτοῦ
  choice: 彼のために
  rationale: 文脈上の執り成しを自然に示す。指示対象は直前のペテロ。
- source_word: μὲν οὖν ... δὲ
  choice: こうして……しかし
  rationale: 物語の進展と、ペテロの拘禁に対する教会の祈りという穏やかな対照を表す。
theological_decisions:
- issue: ἐκκλησίαの訳語
  choice: 教会
  alternative: 集会／会衆
  rationale: ここではペテロのために祈るキリスト者共同体を指す。日本語聖書で定着し、文脈にも自然な「教会」を用いるが、建物や後代の制度を意味するものとは限定しない。
- issue: ἐκτενῶςが示す祈りのあり方
  choice: 熱心に
  alternative: 絶えず／切に
  rationale: 語は強度と持続性の双方を含み得るため、本文では広く受け止められる「熱心に」とし、継続性は動詞表現「祈り続けていた」で補う。
translation_notes:
  register: 明瞭な現代標準語による、簡潔で品位ある物語文。「拘禁」はやや公的な語だが、ἐτηρεῖτοの受動性と継続性を過度な説明なしに表す。
