  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: ja
  text: しかし、ヘロデはペテロを捜したが、見つけられなかった。そこで番兵たちを取り調べ、彼らを連行するよう命じた。[a] それから、ユダヤからカイサリアへ下って行き、そこに滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らが連行されるよう命じた」。この文脈では、処刑のために連行することを意味する可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν
  choice: ペテロを捜しても見つけられなかったので
  rationale: 二つのアオリスト分詞が示す、捜索とその失敗という先行動作を、現代日本語として自然な因果・時間の流れで表した。代名詞の指示対象は直前の文脈からペテロであるため、明瞭さを優先して固有名を補った。
- source_word: ἀνακρίνας
  choice: 取り調べ
  rationale: 公的・司法的な吟味や尋問を表し得る語であり、番兵に対する公式な追及という文脈に適する。
- source_word: τοὺς φύλακας
  choice: 番兵たち
  rationale: ペテロの監視を任されていた者たちを指すため、役目が明瞭な「番兵」とした。
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: 処刑するために連行するよう命じた
  rationale: 字義的な「連行されるよう命じた」を保ちつつ、この文脈で強く含意される処刑を本文で明示した。ただし原文自体は殺害を直接表す動詞を用いていないため、脚注でその点を示した。
- source_word: κατελθὼν ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: ユダヤからカイサリアへ下って行き
  rationale: 内陸のユダヤから沿岸のカイサリアへの移動を表す地理的な「下る」を保持した。
- source_word: διέτριβεν
  choice: そこに滞在した
  rationale: 未完了過去が示す継続的な滞在を、簡潔で自然な日本語にした。
theological_decisions:
- issue: ἀπαχθῆναι が処刑を明示するか
  choice: 本文では「処刑するために連行する」とし、含意を明瞭にする
  alternative: 「連行するよう命じた」とだけ訳す、または「死刑にするよう命じた」と訳す
  rationale: 原語は字義上「連れ去る／連行する」だが、逃亡した囚人を担当していた番兵へのヘロデの処置という物語上の文脈では、処刑を意味する可能性が高い。動作の比喩的・慣用的な含意を示しつつ、原文の表現との差を脚注で透明にした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、歴史叙述にふさわしい落ち着いた文体と原文の出来事の順序を保った。
