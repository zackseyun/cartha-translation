  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: ja
  text: しかし、ペテロは戸をたたき続けていた[a]。人々が戸を開けると[b]、彼を見て非常に驚いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「戸をたたき続けた」「しきりに戸をたたいていた」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「人々は開けて、彼を見、非常に驚いた」。原文には「戸」に当たる語はないが、文脈から補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: たたき続けていた
  rationale: 未完了過去ἐπέμενενの継続・反復の力と、同時的な分詞κρούωνを、自然な現代日本語で一体として表した。文脈上、戸をたたく意味である。
- source_word: ἀνοίξαντες
  choice: 人々が戸を開けると
  rationale: アオリスト分詞を時間的な従属節として訳した。原文に目的語は明示されないが、直前の戸口での出来事から「戸」を補うと日本語として明瞭になる。
- source_word: εἶδαν αὐτόν
  choice: 彼を見て
  rationale: 物語文における通常の意味を簡潔に表し、不要な解釈を加えなかった。
- source_word: ἐξέστησαν
  choice: 非常に驚いた
  rationale: 強い驚きを示す語であり、「非常に」を添えて強度を保ちつつ、現代の一般読者に自然な表現とした。
- source_word: δὲ
  choice: しかし／（接続関係として処理）
  rationale: 最初のδὲは前節の状況との対照を示すため「しかし」とした。二つ目は日本語の「〜すると」という構文の中で自然に処理した。
- source_word: Πέτρος
  choice: ペテロ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
