id: ACT.12.11
reference: Acts 12:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: ja
  text: ペトロは我に返って[a]言った。「今、はっきり分かった。主が御使いを遣わし、ヘロデの手から[b]、またユダヤの民が期待していたすべてのことから[c]、私を救い出してくださったのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正気に戻って」または「自分を取り戻して」。
    reason: lexical_alternative
  - marker: b
    text: 「ヘロデの手」は、ヘロデの権力または支配を意味する。
    reason: cultural_note
  - marker: c
    text: 直訳「ユダヤの民のすべての期待から」。民がペトロに起こると期待していたすべてのことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: 我に返って
  rationale: 幻のような体験の後、ペトロが十分な意識を取り戻したことを表す慣用句。ギリシア語の比喩を保ちつつ、現代日本語として自然である。
- source_word: ἀληθῶς
  choice: はっきり
  rationale: ペトロが今や確かなこととして認識した、という強調を自然な日本語で表す。
- source_word: ἐξαπέστειλεν
  choice: 遣わし
  rationale: この文脈では、主が御使いを派遣したことを表す。「遣わす」は聖書本文にふさわしい品位を保ちながら、現代日本語でも理解できる。
- source_word: κύριος
  choice: 主
  rationale: 指示対象を神または復活したイエスに限定せず、原文の κύριος をそのまま保つ。
- source_word: ἄγγελον
  choice: 御使い
  rationale: 物語の文脈では天的存在を指すため、一般的な「使者」ではなく「御使い」とした。
- source_word: ἐξείλατό με
  choice: 私を救い出してくださった
  rationale: 危険と支配からの救出を明確に表す。主を主語とするため、自然な敬意を示す補助動詞を用いた。
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: ヘロデの手から
  rationale: 「手」が権力や支配を意味する原文の比喩を保持し、日本語でも理解可能な表現とした。
- source_word: πάσης τῆς προσδοκίας
  choice: 期待していたすべてのことから
  rationale: 直訳的な「すべての期待から」では対象が不明瞭になるため、民がペトロに起こると予期していた事柄を指すことが分かる形にした。
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: ユダヤの民が
  rationale: 属格を日本語の主語として展開し、自然で明瞭な表現にした。「ユダヤ人たちの民」のような不自然な逐語訳を避けた。
theological_decisions:
- issue: κύριος の指示対象
  choice: 主
  alternative: 神／復活したイエス
  rationale: 本文は κύριος とだけ述べ、指示対象を明示していない。「主」と訳すことで、原文の曖昧さと神学的緊張を保持する。
- issue: ユダヤの民の「期待」の内容
  choice: 期待していたすべてのこと
  alternative: ペトロの処刑を期待していたこと
  rationale: 文脈上はペトロに下される処置を指す可能性が高いが、本文は処刑と明言しないため、具体化しすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「主」「御使い」「遣わす」によって聖書本文としての品位を保った。「我に返る」「ヘロデの手」は原文の比喩を残し、脚注で意味を補足した。
