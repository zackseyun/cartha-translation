  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: ja
  text: そして、それがユダヤ人たち[a]に喜ばれるのを見て、さらにペテロも捕らえた。（そのころは種なしパンの祭りの期間であった[b]。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」、また文脈を限定して「ユダヤ人の指導者たち」とも訳し得る。ギリシア語には文脈によりこれらの意味があるが、ここでは単に「ユダヤ人たち」と記されている。
    reason: lexical_alternative
  - marker: b
    text: 過越の祭りに続き、種を入れないパンを食べて守った祭りの期間。
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: そして、…のを見て
  rationale: アオリスト分詞を、次の行為に先立つヘロデの認識として自然な日本語で表した。δέの叙述上のつながりも「そして」で示した。
- source_word: ἀρεστόν ἐστιν
  choice: 喜ばれる
  rationale: 「喜ばしい、気に入る」という意味を、行為が人々の歓心を買ったことが伝わる自然な受け身表現で表した。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たち
  rationale: 本文自体は指導者層やユダヤ地方の住民に限定していないため、広い語義を保った。集合を一枚岩に見せにくくするため「たち」を添えた。
- source_word: προσέθετο συλλαβεῖν
  choice: さらに…も捕らえた
  rationale: 「加えて～した」というギリシア語の慣用を日本語の叙述として簡潔に表し、καίの追加の意味と合わせて示した。
- source_word: καὶ Πέτρον
  choice: ペテロも
  rationale: 前節のヤコブに加えてペテロが次の対象となったことを「も」で保持した。
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: そのころは種なしパンの祭りの期間であった
  rationale: 時間的背景を示す挿入句として訳し、ἄζυμαを過越そのものに置き換えず、祭りの固有の名称を保持した。
theological_decisions:
- issue: 使徒言行録における Ἰουδαίοις の範囲
  choice: ユダヤ人たち
  alternative: ユダヤ地方の人々／ユダヤ人の指導者たち
  rationale: 文脈上はエルサレム周辺の反対者、とりわけ指導者層が想定される可能性があるが、本文は明示的に限定していない。その曖昧さを保つため、本文では基本的な語義を採った。
- issue: τῶν ἀζύμων の祭期名
  choice: 種なしパンの祭り
  alternative: 過越祭
  rationale: 原文は関連する過越ではなく、明確に「種なしパン」の日々を指す。両者を同一視せず、原文の祭期名を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体。歴史的・文化的用語は保持しつつ、一般読者に理解できるよう脚注で補った。
