id: ACT.12.21
reference: Acts 12:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: ja
  text: 定められた日に、ヘロデは王の装束[a]を身にまとい、壇上の席[b]に着くと、彼らに向かって演説をしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「王の衣」とも訳せる。ギリシア語は、王にふさわしい華やかな衣服を指す。
    reason: lexical_alternative
  - marker: b
    text: 「裁きの座」または「演壇」とも訳せる。ギリシア語のβῆμαは、公的な座席や高く設けられた壇を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: 定められた日に
  rationale: τακτόςが示す、あらかじめ決められた日という意味を簡潔に表す。文頭のδέはここでは日本語に独立した接続語を加えず、叙述の流れの中で表現した。
- source_word: ἐνδυσάμενος
  choice: 身にまとい
  rationale: アオリスト中動態分詞が表す、ヘロデ自身が衣服を着たという先行動作を自然な日本語で示す。
- source_word: ἐσθῆτα βασιλικὴν
  choice: 王の装束
  rationale: 王にふさわしい衣服・盛装を指す表現として、格調を保ちつつ過度に具体化しない訳語を選んだ。
- source_word: καθίσας
  choice: 席に着くと
  rationale: 先行するアオリスト分詞の動作順序を自然に示し、単に腰を下ろしただけでなく公的な席に就いた文脈にも合う。
- source_word: ἐπὶ τοῦ βήματος
  choice: 壇上の席
  rationale: βῆμαが指し得る高く設けられた壇と公的な座席の両面を保ち、ここを司法手続きと断定しない表現とした。
- source_word: ἐδημηγόρει
  choice: 演説をしていた
  rationale: 民衆の前で公に語るという動詞の意味と、未完了過去が表す継続中の動作を伝える。
- source_word: πρὸς αὐτούς
  choice: 彼らに向かって
  rationale: 聴衆への発話の方向を明確に表す。
theological_decisions:
- issue: βῆμαの公的・司法的含意
  choice: 壇上の席
  alternative: 裁きの座／演壇
  rationale: 王の公式な登場という含意は保つが、この場面を裁判と断定せず、また単なる演説台にも限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「王の装束」「壇上の席」で公的場面にふさわしい品位を持たせた。分詞の連続は日本語として自然な動作順序に組み替え、未完了過去は「していた」で表した。
