base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: ja
  text: しかしペトロは、手で合図して、彼らに静かにするよう求め、主がどのように自分を牢から連れ出したかを彼らに説明した。そして、「このことをヤコブと兄弟たち[a]に知らせてください」と言った。それから、そこを出て別の場所へ向かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、文脈によっては、より広く信者の共同体を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: 静かにするよう手で合図し
  rationale: 手の動作によって一同に沈黙を求めたことを、動作と目的の双方が明確な自然な日本語で表した。
- source_word: διηγήσατο
  choice: 説明した
  rationale: 出来事を順序立てて詳しく語った含意があり、この文脈では「説明した」が自然である。
- source_word: πῶς
  choice: どのように
  rationale: 主による救出の経緯・方法を導入する語として、原文の表現を保った。
- source_word: ὁ κύριος
  choice: 主
  rationale: κύριοςの称号をそのまま保ち、具体的な指示対象を訳文で限定しない。
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: 牢から連れ出してくださった
  rationale: ἐξάγωの移動を伴う救出を「連れ出す」で表し、主の行為に対する日本語として自然な敬意表現を用いた。φυλακήは拘禁施設を指すため「牢」とした。
- source_word: Ἀπαγγείλατε
  choice: 知らせてください
  rationale: 重要な出来事を伝達する命令を、引用内で自然かつ明瞭な丁寧表現にした。
- source_word: Ἰακώβῳ
  choice: ヤコブ
  rationale: 新約聖書の日本語で定着した人名表記を採用した。
- source_word: τοῖς ἀδελφοῖς
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文で保持し、文脈上より広い信者共同体を含む可能性は脚注に示した。
- source_word: ἐξελθὼν ἐπορεύθη
  choice: そこを出て……向かった
  rationale: 現在地から出たことと別の場所へ移動したことの両方を、重複感のない自然な日本語で表した。
- source_word: εἰς ἕτερον τόπον
  choice: 別の場所へ
  rationale: 行き先を特定しない原文の曖昧さを保持した。
theological_decisions:
- issue: κύριοςの指示対象
  choice: 「主」と訳し、指示対象を限定しない
  alternative: 「主イエス」または「神」と明示する
  rationale: 使徒言行録では復活したイエスを指す可能性がある一方、本文はκύριοςとのみ記しているため、訳文もその神学的な余地を保つ。
- issue: τοῖς ἀδελφοῖςが指す範囲
  choice: 本文は「兄弟たち」とする
  alternative: 「兄弟姉妹たち」または「信者たち」とする
  rationale: 語形上の男性複数を保持しつつ、信者共同体全体を指し得る語用論的可能性を脚注で示す。
translation_notes:
  register: 明快で現代的ながら品位ある物語文とした。ペトロは直前の文脈から明らかなため主語を補い、発話は日本語として自然な丁寧命令にした。脚注記号[a]は該当語の直後に置いた。
