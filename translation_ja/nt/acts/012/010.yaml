- from: 彼らは第一、第二の見張り所を通り過ぎ、市内へ通じる鉄の門まで来た。門はひとりでに彼らのために開いた。二人は外へ出て、一つの通りを進んだ[a]。するとすぐに、御使いは彼から離れた。
  to: 彼らは第一と第二の見張り所を通り過ぎ、市へ通じる鉄の門に来た。その門はひとりでに彼らの前で開いた。彼らは外に出て、一つの通りを進んだ[a]。するとすぐに、天使は彼のもとを去った。
