id: ACT.12.10
reference: Acts 12:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: ja
  text: 彼らは第一と第二の見張り所を通り過ぎ、市へ通じる鉄の門に来た。その門はひとりでに彼らの前で開いた。彼らは外に出て、一つの通りを進んだ[a]。するとすぐに、天使は彼のもとを去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一つの通りを」は、一つの通りに沿って進んだという意味のほか、一つの通りに相当する距離を進んだという意味にも取れる。
    reason: 原文の対格句ῥύμην μίανが経路または距離を表し得るため、その曖昧さを保持する。
lexical_decisions:
- source_word: διελθόντες
  choice: 通り過ぎ
  rationale: アオリスト分詞が主動詞に先立つ動作を示すため、自然な日本語の連用形で出来事の順序を表した。
- source_word: φυλακὴν
  choice: 見張り所
  rationale: ここでは第一、第二と数えられる警備地点を指すと考えられる。「見張り」だけより場所の意味が明確で、複数の牢獄を指すとの誤解も避けられる。
- source_word: πύλην τὴν σιδηρᾶν
  choice: 鉄の門
  rationale: 材質を示す形容を簡潔で自然な現代日本語にした。
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: 市内へ通じる
  rationale: 門が町への出入り口となっていることを表す分詞句を、日本語で自然な連体修飾にした。
- source_word: αὐτομάτη
  choice: ひとりでに
  rationale: 外から人が開けることなく門が開いたという意味を保ち、現代の機械式自動ドアを連想させやすい「自動的に」は避けた。
- source_word: ἠνοίγη αὐτοῖς
  choice: 彼らのために開いた
  rationale: 受動形の出来事と、彼らにとって門が開かれたことを表す与格の含意を、自然な日本語で示した。
- source_word: ῥύμην μίαν
  choice: 一つの通りを
  rationale: 語の基本的な意味である「通り、路地」を保った。対格は進んだ距離を示す可能性があるため、その点は脚注で明示した。
- source_word: εὐθέως
  choice: するとすぐに
  rationale: 物語上の即時的な展開を、過度に硬くならない明瞭な表現で示した。
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: 御使いは彼から離れた
  rationale: 御使いがペトロのもとを去ったという原文の簡潔な叙述を保ち、原因や移動の仕方を補わなかった。
theological_decisions:
- issue: 門が開いた性質
  choice: 門はひとりでに彼らのために開いた
  alternative: 門は自動的に彼らのために開いた
  rationale: 原文は門が人手によらず開いたことを描くが、その仕組みは説明しない。「ひとりでに」により奇跡的な出来事をそのまま伝え、機械的な仕掛けとの誤解を避けた。
- issue: φυλακήが指すもの
  choice: 第一、第二の見張り所
  alternative: 第一、第二の見張り
  rationale: 脱出の文脈では、順に通過する警備地点を指すと読むのが自然である。ただし警備体制の具体的構造は本文以上に規定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「御使い」は聖書物語に適した一般的な語として採用し、古風すぎる構文は避けた。短い文に分けて脱出場面の進行を読み取りやすくした。
