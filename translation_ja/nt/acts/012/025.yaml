  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: ja
  text: しかし、バルナバとサウロは、その務めを果たした後、マルコと呼ばれていたヨハネを連れてエルサレムに戻った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「エルサレムに」ではなく「エルサレムから」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: 戻った
  rationale: ὑποστρέφωのアオリストを、簡潔で自然な日本語で「戻った」とした。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムに
  rationale: 提示されたSBLGNT本文のεἰςが通常表す方向をそのまま訳した。文脈上の難しさはあるが、本文を別異読に置き換えず、異読は脚注に示した。
- source_word: πληρώσαντες τὴν διακονίαν
  choice: その務めを果たして
  rationale: πληρόωの「成し遂げる、果たす」とδιακονίαの「奉仕、務め」を自然に組み合わせた。文脈上は援助を届ける働きだが、原文より具体化しすぎない表現とした。
- source_word: διακονίαν
  choice: 務め
  rationale: 「奉仕」や「働き」も可能だが、ここでは委ねられた奉仕活動を含みつつ、教会制度上の特定の職務に限定しない「務め」を選んだ。
- source_word: συμπαραλαβόντες
  choice: その際、…を連れて行った
  rationale: 主動詞に伴う分詞の行為を、現代日本語で関係が明瞭になるよう独立した文で表した。「その際」により付随する行為であることを保った。
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: マルコと呼ばれていたヨハネ
  rationale: 受動分詞ἐπικληθένταを「呼ばれていた」と訳し、ヨハネがマルコという名でも呼ばれていたことを、原文にない説明を加えず表した。
theological_decisions:
- issue: 行き先・出発地を示す本文異読
  choice: エルサレムに戻った
  alternative: エルサレムから戻った
  rationale: 提示されたSBLGNT本文はεἰς Ἰερουσαλήμ（「エルサレムに」）なので、それを本文に採用した。一方、ἐξ Ἰερουσαλήμ（「エルサレムから」）とする写本は物語の流れにも関わるため、脚注に明記して解釈上・本文上の緊張を残した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文にふさわしい落ち着いた文体とした。原文の分詞構文は、意味関係を保ちつつ読みやすい二文に分けた。
