id: ACT.12.9
reference: Acts 12:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: ja
  text: そこでペトロは外に出て、ついて行った。しかし、御使いを通して起こっていることが現実だとは分からず、幻を見ているのだと思っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 外に出て
  rationale: アオリスト分詞を、後続する継続的な動作に先立つ自然な連用表現とした。
- source_word: ἠκολούθει
  choice: ついて行った
  rationale: 未完了過去の継続性は文脈上明らかであり、現代日本語の物語文として自然に表現した。目的語は直前の御使いという文脈から理解できるため補わない。
- source_word: οὐκ ᾔδει
  choice: 分からず
  rationale: ペトロが出来事の現実性を認識していなかったことを、平明な現代日本語で表した。
- source_word: ἀληθές
  choice: 現実だ
  rationale: 幻との対比にあるため、命題的な「真実」より、実際に起きていることを示す「現実」が適切。
- source_word: τὸ γινόμενον
  choice: 起こっていること
  rationale: 冠詞付き現在分詞が表す進行中の出来事を自然に保持した。
- source_word: διὰ τοῦ ἀγγέλου
  choice: 御使いを通して
  rationale: 属格を伴うδιάの媒介・作用主体の含みを保持し、御使いの独立した力を過度に強調しない。
- source_word: ἐδόκει
  choice: 思っていた
  rationale: ペトロのその時点での認識・思い込みを表し、未完了過去の状態的な含みも自然に示す。
- source_word: ὅραμα
  choice: 幻
  rationale: 新約聖書での啓示的・超自然的な視覚経験を表す、簡潔で定着した訳語。
- source_word: βλέπειν
  choice: 見ている
  rationale: ἐδόκειに従属する不定詞を、日本語では引用節として自然に表し、経験の進行性も保持した。
theological_decisions:
- issue: 御使いの行為の性質
  choice: 御使いを通して
  alternative: 御使いによって
  rationale: διά＋属格が持つ媒介的作用のニュアンスを残しつつ、御使いの力や役割について本文以上の神学的断定を避けた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「御使い」「幻」によって聖書本文としての品位を保った。「しかし」でペトロの行動と認識の対照を明確にした。
