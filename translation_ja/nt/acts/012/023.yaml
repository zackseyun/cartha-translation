  source_fidelity: 原文の順序と因果関係を正確に保っている。「直ちに」は παραχρῆμα、「主の使い」は無冠詞の ἄγγελος κυρίου、「打った」は結果を先取りしない ἐπάταξεν に適切に対応する。「神に栄光を帰さなかったからである」は ἀνθ’ ὧν 以下の裁きの理由を明瞭に示す。「虫に食われる身となり、息絶えた」は γενόμενος σκωληκόβρωτος と ἐξέψυξεν を区別し、打たれた時点で即死したとは過度に限定していない。
  naturalness: 明瞭な現代標準日本語であり、短い文への分割も読みやすい。「すると直ちに」は出来事の接続と即時性をともに表すため許容される。「虫に食われる身となり」はやや文語寄りだが、本文の厳粛さに合い、意味も明確である。
  terminology: 「主の使い」「神に栄光を帰す」は本文脈にふさわしく、特定教派の解釈を導入しない。「息絶えた」は ἐξέψυξεν の表現性を保つ自然な訳語である。
