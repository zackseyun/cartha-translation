id: ACT.12.23
reference: Acts 12:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: ja
  text: すると直ちに、主の使いが彼を打った。彼が神に栄光を帰さなかったからである。そして彼は、虫に食われる身となり[a]、息絶えた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「虫に食われて」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「死んだ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: すると直ちに
  rationale: 出来事が間を置かず起きたことを表す副詞。前の場面からの展開を示す δέ も「すると」で自然に反映した。
- source_word: ἐπάταξεν
  choice: 打った
  rationale: 「打つ、打ち据える」を表す。死は後の ἐξέψυξεν で明記されるため、ここで「打ち倒した」と結果まで先取りしない。
- source_word: ἄγγελος κυρίου
  choice: 主の使い
  rationale: 冠詞のない ἄγγελος を、日本語で自然な聖書語彙「使い」によって訳した。「主の御使い」より現代的で明瞭である。
- source_word: ἀνθ’ ὧν
  choice: からである
  rationale: ここでは裁きの理由を示す慣用表現であり、前文を受ける因果関係を明確に表した。
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: 神に栄光を帰さなかった
  rationale: 神に属する誉れを神に認め、帰するという意味を、日本語の定着した自然な表現で伝える。
- source_word: γενόμενος σκωληκόβρωτος
  choice: 虫に食われる身となり
  rationale: γενόμενος の変化と σκωληκόβρωτος の生々しい意味を保ちつつ、日本語として不自然な「虫食いになり」を避けた。
- source_word: ἐξέψυξεν
  choice: 息絶えた
  rationale: 文字どおりには生命の息が尽きることを表す動詞で、「死んだ」より原語の表現性を保ちながら現代日本語でも明瞭である。
theological_decisions:
- issue: 記されている裁きの性質と時間的関係
  choice: 主の使いがヘロデを打ったことを神の裁きとして示し、その理由を神に栄光を帰さなかったことに置く。ただし、打たれた瞬間に死亡したとは限定しない。
  alternative: 自然死を宗教的言語で描いたと解すること、または使いに打たれた瞬間に死亡したと明示すること。
  rationale: 本文は使いによる打撃とその理由を明記する一方、続く分詞「虫に食われる身となり」と定動詞「息絶えた」の厳密な医学的・時間的経過までは説明していない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神に栄光を帰す」「息絶える」によって聖書本文にふさわしい品位を保った。短い因果文に分け、裁きの突然性と理由を読み取りやすくした。
