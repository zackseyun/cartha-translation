  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: ja
  text: そして、ペテロの声だと分かると、喜びのあまり門[a]を開けもせず、中へ駆け込んで、ペテロが門の前に立っていると知らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「門」は、通りから敷地内へ入る門口、または外戸を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου
  choice: ペテロの声だと分かると
  rationale: 声を聞いてそれがペテロのものだと認識したことを、自然な現代日本語で表した。アオリスト分詞の先行・状況的関係も「すると」で簡潔に示している。
- source_word: ἀπὸ τῆς χαρᾶς
  choice: 喜びのあまり
  rationale: 前置詞句の原因を明確にし、喜びが大きいために門を開け忘れたという文脈を自然に伝える。
- source_word: οὐκ ἤνοιξεν
  choice: 開けもせず
  rationale: ἀνοίγωの基本義「開ける」を保ち、「鍵を開ける」など原文にない具体化を避けた。「もせず」は喜びのあまり取るべき行動を取らなかったという語りの意外性を表す。
- source_word: πυλῶνα / πυλῶνος
  choice: 門
  rationale: πυλώνは街路から敷地内へ入る門・戸口を指し得る。本文では簡潔で自然な「門」とし、範囲は注で補った。
- source_word: εἰσδραμοῦσα
  choice: 中へ駆け込んで
  rationale: 内向きの移動を表す接頭辞 εἰσ- と、走ることを表す語義をともに反映し、物語の素早い動きを保った。
- source_word: ἀπήγγειλεν
  choice: 知らせた
  rationale: 報告・告知を表す動詞を、家庭内の場面に合う自然な日本語で訳した。「報告した」より硬さを抑えつつ、単に「言った」より告知の意味を明確にした。
- source_word: ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος
  choice: ペテロが門の前に立っていると
  rationale: 完了不定詞の結果状態を「立っている」で表し、πρό＋属格の位置関係を「門の前に」と明示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、喜びによる慌ただしさと物語の軽快な展開を保った。「開けもせず」「駆け込んで」により自然な叙述としつつ、原文の因果関係、方向性、ペテロが立っている状態を省略していない。
