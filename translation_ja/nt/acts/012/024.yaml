  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: ja
  text: しかし、神のことばはますます広がり、増えていった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγος
  choice: ことば
  rationale: ルカが繰り返し用いる「神のことば」という表現を保ち、神から宣べ伝えられる知らせという広い意味を伝えるため。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 神に属し、神から来ることばを示す属格として素直に訳した。
- source_word: ηὔξανεν
  choice: ますます広がり
  rationale: 未完了過去の継続的な進展を自然な日本語で表し、ここでの「ことば」の成長を、その伝播として明確にした。
- source_word: ἐπληθύνετο
  choice: 信じる人々の数も増えていった
  rationale: 直訳では「増し加わっていた」だが、使徒言行録6:7に見られる同様の表現と文脈から、ことばの広がりに伴って人々が増えるという含意を自然な日本語で示した。
- source_word: δὲ
  choice: しかし
  rationale: 直前に語られたヘロデの最期と、神のことばの進展との対照を明示した。
theological_decisions:
- issue: 「神のことば」をより説明的に「神の知らせ」と訳すか
  choice: 神のことば
  alternative: 神の知らせ
  rationale: ルカに特徴的な定型表現と聖書内の響きを保ちつつ、脚注で文脈上の意味を示すため。
- issue: 増えたものを明示するか
  choice: 信じる人々の数も増えていった
  alternative: 神のことばは広がり、増し加わっていった
  rationale: ギリシア語では主語が「神のことば」のままだが、二つの動詞による比喩的表現は、宣教の拡大と共同体の増加を指すと理解できる。ただし原文の表現を残す訳も可能なので脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いた。「御言葉」ではなく「ことば」として一般読者への分かりやすさを優先しつつ、「神のことば」という聖書的な定型表現を保持した。
