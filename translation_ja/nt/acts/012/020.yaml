source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: ja
  text: さて、ヘロデはティルスとシドンの人々に激しい怒りを抱いていた[a]。しかし彼らは心を一つにしてヘロデのもとに来て、王の寝室を管理するブラストを説得したうえで、和平を求めていた。彼らの地方は、王の領地から食糧の供給を受けていたからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ティルスとシドンの人々に敵意を燃やしていた」。原語は、激しい怒りや敵対を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼らの地方が王の領地から養われていた」。ティルスとシドンの地域が、王の支配地から食糧を得ていたことをいう。
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: 激しい怒りを抱いていた
  rationale: 激しい怒り、または敵対的な状態を表す語。日本語として自然でありながら、その強さを保つ。
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: ティルスとシドンの人々
  rationale: 両都市の住民を指す民族・地域呼称を、現代日本語で明瞭に表す。
- source_word: ὁμοθυμαδόν
  choice: 心を一つにして
  rationale: 単に一緒に来たというだけでなく、目的と意志の一致を表す。
- source_word: παρῆσαν πρὸς αὐτόν
  choice: ヘロデのもとに来て
  rationale: 誰を指すかを文脈から補って明確にし、接近・出頭の意味を自然に表す。
- source_word: πείσαντες
  choice: 説得したうえで
  rationale: 主動詞に先立つ行為であることを自然な日本語で示す。
- source_word: Βλάστον
  choice: ブラスト
  rationale: 人名を日本語の慣用的な音写で表す。
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: 王の侍従
  rationale: 字義的には王の寝室をつかさどる者であり、王の私室に近侍する宮廷官を簡潔に表す。
- source_word: ᾐτοῦντο εἰρήνην
  choice: 和平を願い求めた
  rationale: 継続的・切実な請願の含みと、政治的な平和関係を求める意味を表す。
- source_word: διὰ τὸ τρέφεσθαι
  choice: 食糧の供給を受けていたから
  rationale: 理由を示す構文と、食べさせられる・養われるという受動の意味を、経済的供給の文脈に即して表す。
- source_word: αὐτῶν τὴν χώραν
  choice: 彼らの地方
  rationale: ティルスとシドン周辺の地域・領域を指すため、「国」より過度に近代国家を連想させない表現を選ぶ。
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: 王の領地から
  rationale: 実体詞的に用いられた形容詞で、王に属する土地・領域を指す。日本語では「王の領地」と補うのが明瞭。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、歴史叙述にふさわしい品位を保った。「さて」はδέの場面転換・接続機能を表す。「王の侍従」は古すぎる専門語を避けつつ宮廷職を示す表現とした。
