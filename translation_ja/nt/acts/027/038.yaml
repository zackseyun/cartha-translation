  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: ja
  text: そして、十分に食べた後[a]、彼らは小麦[c]を海に投げ捨てることで、船を軽くし始めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食物で満腹になった後」「食べて満たされた後」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「船を軽くしていった」または「船を軽くした」。ギリシア語の未完了過去は、動作の進行または開始を強調している可能性がある。
    reason: lexical_alternative
  - marker: c
    text: 別訳「穀物」。ギリシア語はより広く穀物を指すこともあるが、ここでは小麦を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: 十分に食べると
  rationale: 食物によって満たされ、満足した状態になったことと、アオリスト分詞の時間的なつながりを、自然な現代日本語で表した。
- source_word: δὲ
  choice: そして
  rationale: 物語を先へ進める穏やかな接続を表す。
- source_word: ἐκούφιζον
  choice: 軽くし始めた
  rationale: 未完了過去が示し得る動作の開始または進行のうち、本文では開始のニュアンスを採った。別の可能性は注記した。
- source_word: τὸ πλοῖον
  choice: 船
  rationale: 航海の文脈に適した、自然で標準的な訳語。
- source_word: ἐκβαλλόμενοι
  choice: 投げ捨て
  rationale: 船を軽くする手段を示す現在分詞を、簡潔な連用形で表した。
- source_word: τὸν σῖτον
  choice: 小麦
  rationale: σῖτοςは穀物一般を指すこともあるが、この文脈では小麦である可能性が高いため、具体的な語を本文に採った。
- source_word: εἰς τὴν θάλασσαν
  choice: 海に
  rationale: 方向を表す句を、海上の文脈に即して直接的に訳した。
