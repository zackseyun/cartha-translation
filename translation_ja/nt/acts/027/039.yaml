base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: ja
  text: 夜が明けると、彼らはその陸地を見分けることができなかった。しかし、浜のある入り江を見つけ、できるなら、そこに船を浜に乗り上げさせようと考えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: 夜が明けると
  rationale: 直訳的な「昼になると」より自然な現代日本語で、日の到来を表す。δέは弱い物語上の移行なので、独立した接続語を加えず文脈に織り込んだ。
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: 彼らはその陸地がどこなのか分からなかった
  rationale: ἐπιγινώσκωの「見分ける、特定する」という意味を、この場面に即して自然に表現した。γῆは「陸地」とし、「海岸」と限定しすぎないようにした。
- source_word: κόλπον δέ τινα κατενόουν
  choice: しかし、浜のある入り江が目に留まり
  rationale: κόλποςを航海文脈に適した「入り江」、τιναを不定の「ある」で表した。κατανοέωの注意深く認める意味は「目に留まる」で自然に伝えた。
- source_word: ἔχοντα αἰγιαλόν
  choice: 浜のある
  rationale: αἰγιαλόςを具体的な「浜」と訳し、原文に明示されない「砂浜」などの情報は加えなかった。
- source_word: εἰς ὃν
  choice: そこへ
  rationale: εἰςの方向性を保ちつつ、先行する「入り江」を自然に指す表現とした。
- source_word: ἐβουλεύοντο εἰ δύναιντο
  choice: できれば、…ようと考えた
  rationale: βουλεύομαιの計画・意図と、εἰ＋希求法による可能性の留保を、流暢な日本語で保持した。
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: 船を乗り上げさせよう
  rationale: ἐξωθέωがこの航海文脈で表す、船を岸へ押しやって座礁・着浜させる動作を簡潔に表した。
