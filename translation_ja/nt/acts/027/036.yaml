  yaml_path: translation/nt/acts/027/036.yaml
  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: ja
  text: すると、皆が元気を出し、彼ら自身も食事を取った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼ら自身も」は、ほかの人々がパウロにならって食事を取ったことを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: 元気を取り戻し
  rationale: 「意気が上がる、元気になる」という状態の変化を、遭難の危機にある文脈に即して自然な現代日本語で表す。「陽気になる」では軽すぎるため避けた。
- source_word: δὲ
  choice: すると
  rationale: 強い逆接ではなく、パウロの言葉と行動を受けた物語の展開を示す接続として訳した。
- source_word: γενόμενοι
  choice: 取り戻し
  rationale: εὔθυμοι と結びついて新たな状態に入ったことを示す。日本語では「元気を取り戻す」と一体に表現するのが自然である。
- source_word: πάντες
  choice: 皆
  rationale: 船にいた一同全体を簡潔かつ明確に示す。
- source_word: καὶ αὐτοὶ
  choice: 自分たちも
  rationale: パウロが先に食べたのに続き、ほかの者たち自身も食事を取ったという添加と強調を保持する。
- source_word: προσελάβοντο
  choice: 取った
  rationale: τροφῆς とともに「食事を取る」という自然な日本語の慣用表現にした。単に「食べた」とするより原文の表現に近い。
- source_word: τροφῆς
  choice: 食事
  rationale: この文脈では摂取する食物を指す。「食事を取る」という自然な連語を優先した。
