base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: ja
  text: ですから、何か食べるよう、あなたがたに勧めます。これは、あなたがたが助かるために必要なことです。[a] あなたがたのだれ一人も、頭の髪の毛一本たりとも失うことはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これは、あなたがたの救いのためです」。ここで「助かる」と訳したギリシア語は、「救い」「救出」「保全」を意味し得る。この文脈では、海難を生き延びることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前までの状況を受けた推論・結論を、自然な現代日本語で示す。
- source_word: παρακαλῶ
  choice: 勧めます
  rationale: 強い促しを含みながらも、命令ではなく真剣な勧告であることを表す。
- source_word: μεταλαβεῖν τροφῆς
  choice: 何か食べる
  rationale: 直訳的な「食物を取る」より自然で、栄養を取るという具体的な意味を明瞭に伝える。
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: これは、あなたがたが助かるために必要なことです
  rationale: 海難からの生存・救出という文脈を明示しつつ、πρόςが示す利益・目的とὑπάρχειの趣旨を自然な日本語にする。σωτηρίαの語義の幅は脚注に残す。
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: あなたがたのうち、だれ一人として……ないからです
  rationale: 否定の分配的な強調と、γάρによる理由説明を日本語として明確に表す。
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: 髪の毛一本も頭から
  rationale: 完全な無事を保証する慣用的表現を、原文の具体的な像を保って訳す。
- source_word: ἀπολεῖται
  choice: 失われることはない
  rationale: 髪の毛を主語とする文脈でἀπόλλυμιの「失われる」という意味を自然に表し、単に「抜け落ちる」と限定しない。
theological_decisions:
- issue: σωτηρίαの文脈上の意味
  choice: 海難から助かること、身体的な生存・保全
  alternative: 霊的な「救い」
  rationale: 直前直後では嵐と難船の危険の中で全員が生き延びることが問題となっているため、本文では身体的な救出を示す。ただし語自体は「救い」とも訳せるので、その語義上の幅を脚注で保存する。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、パウロの真剣な勧告と全員の無事を保証する厳粛な調子を保った。
