base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: ja
  text: 彼らはその小舟を引き上げると、補強用の綱を船体に巻き付けて補強した。また、スルティス[a]に乗り上げるのを恐れ、船具を降ろし[b]、そのまま流されていった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: スルティスは、北アフリカ沿岸の、浅瀬や砂州の多い危険な海域。
    reason: cultural_note
  - marker: b
    text: 「船具を降ろし」に当たるギリシア語は直訳すると「用具を降ろし」。何を指すかは確定できず、「帆具を降ろし」または「海錨を降ろし」とも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: その小舟を引き上げると
  rationale: 関係代名詞ἣνは前節の小舟を指す。日本語では指示対象を明示し、アオリスト分詞の先行動作を「すると」で自然に表した。
- source_word: βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον
  choice: 補強用の綱を使って船体を下から締めた
  rationale: βοήθειαιは本来「助け、支え」だが、ここでは船体を補強するために巻く綱を指す。ὑποζωννύωの「下から帯で締める」という像を保ちつつ、現代の読者に分かる表現とした。
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: スルティスに乗り上げるのを
  rationale: ἐκπίπτωはこの航海文脈で、浅瀬へ吹き流されて座礁する危険を表す。「乗り上げる」は簡潔で自然な海事表現である。
- source_word: χαλάσαντες τὸ σκεῦος
  choice: 船具を降ろし
  rationale: σκεῦοςは広く「用具、装備」を意味し、ここで具体的に何を指すかは不確かである。海錨などに限定せず、原文の曖昧さを保った。
- source_word: οὕτως ἐφέροντο
  choice: そのまま流されていった
  rationale: 未完了過去の受動形が示す、外力によって継続的に運ばれる動きを自然な日本語で表した。
theological_decisions: []
