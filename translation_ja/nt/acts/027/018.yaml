  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: ja
  text: 私たちが激しい嵐にひどく翻弄されていたので、翌日、彼らは積み荷を海に投げ捨てた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σφοδρῶς
  choice: 激しい
  rationale: 嵐の作用の甚だしさと危険な勢いを、自然な現代日本語で表す。
- source_word: χειμαζομένων
  choice: 嵐にもまれ続けていた
  rationale: 嵐に遭って苦しめられている受動的・継続的な状況を表し、属格独立構文を理由を示す従属節として訳した。
- source_word: ἡμῶν
  choice: （主語を文脈上省略）
  rationale: 日本語では直前から続く一行の状況が明らかなため、「私たちは」を明示せずとも自然に伝わる。
- source_word: τῇ ἑξῆς
  choice: 翌日
  rationale: 「その次の日」を簡潔で自然な日本語にした。
- source_word: ἐκβολὴν
  choice: 積み荷を海に投げ捨てる
  rationale: 船を軽くするための海事上の投棄を指す名詞であり、文脈上含意される積み荷を補って動詞表現にした。
- source_word: ἐποιοῦντο
  choice: 始めた
  rationale: 未完了過去形が示す進行的な行為を、物語上の開始として自然に表した。ただし単に「投げ捨てていた」とする余地もある。
