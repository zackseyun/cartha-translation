  text: そこで兵士たちは、小舟[a]の綱を断ち切り、小舟を流れ去るに任せた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小舟」は、本船に付属していた小型の舟を指す。別訳「ボート」「本船の小艇」。
