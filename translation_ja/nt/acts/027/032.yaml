lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語上の次の行動を示す時系列と結果のつながりを、自然な現代日本語で表す。
- source_word: ἀπέκοψαν
  choice: 断ち切り
  rationale: 綱を切断して小舟を船から離す具体的な動作を明確に表す。
- source_word: οἱ στρατιῶται
  choice: 兵士たちは
  rationale: 主語を簡潔かつ正確に訳す。
- source_word: τὰ σχοινία
  choice: 綱
  rationale: 船舶の係留に用いる縄・ロープを指す文脈に適した日本語。
- source_word: τῆς σκάφης
  choice: 小舟
  rationale: 本船に付属する小型の舟を指し、本船との区別も自然に伝わる。
- source_word: εἴασαν
  choice: そのまま…に任せた
  rationale: ἐάωの『そうなるに任せる』という使役・許容の意味を日本語らしく表現する。
- source_word: αὐτὴν
  choice: （省略）
  rationale: 日本語では直前の『小舟』を受ける目的語を明示しなくても自然で、指示対象も明確である。
- source_word: ἐκπεσεῖν
  choice: 流れ去る
  rationale: ἐκπίπτωの基本像を踏まえつつ、綱を切られた小舟が船から離れていく海事文脈で自然な表現とする。『落ちて離れる』という字義的可能性は脚注に残す。
