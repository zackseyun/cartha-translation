  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: ja
  text: 彼らにこう言った。「皆さん、私の見るところ、この航海は、積み荷や船だけでなく、私たちの命にも、災難と大きな損失をもたらすことになりそうです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「危害と多大な損害を伴って」。ギリシア語の「私たちの魂」は、この文脈では難船と死の危険にさらされる「私たちの命」を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: 彼らにこう言った
  rationale: 分詞を文脈に沿った継続的な叙述として自然な日本語の定形動詞で表し、発言の導入であることを明確にした。
- source_word: Ἄνδρες
  choice: 皆さん
  rationale: 男性たちへの呼びかけだが、日本語で「男たちよ」とすると不自然で過度に古風になるため、船上の一同に向けた丁寧な呼びかけとして表した。
- source_word: θεωρῶ
  choice: 私の見るところ
  rationale: 単なる視覚ではなく、状況を観察して下す判断・見通しを表す。断定しすぎず、話者の認識であることも保つ。
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: 災難と大きな損失を伴い
  rationale: ὕβριςはここでは道徳的な「傲慢」ではなく、航海に伴う苛酷な災害・損傷を指す。ζημίαとの重なりを残しつつ、自然な航海文脈にした。
- source_word: τοῦ φορτίου καὶ τοῦ πλοίου
  choice: 積み荷や船
  rationale: φορτίονを海運文脈に即して「積み荷」とし、両者が損失の及ぶ対象であることを後続の述語で示した。
- source_word: τῶν ψυχῶν ἡμῶν
  choice: 私たちの命
  rationale: ψυχήはこの難船と死亡の危険という文脈では、人間の非物質的部分ではなく生命を意味する。
- source_word: μέλλειν ἔσεσθαι τὸν πλοῦν
  choice: この航海は…ことになりそうです
  rationale: μέλλωが示す予測・切迫性を保ちながら、θεωρῶに続く見通しとして自然な日本語にした。
theological_decisions:
- issue: ψυχήを「魂」と訳すか「命」と訳すか
  choice: 命
  alternative: 魂
  rationale: ここで問題となっているのは難船による生命の喪失であり、霊魂についての教理的区別を述べる箇所ではないため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、警告の厳粛さを保った。「皆さん」は男性の船員たちへの呼びかけを日本語として自然に表し、「ことになりそうです」によって観察に基づく予測であることを保持した。
