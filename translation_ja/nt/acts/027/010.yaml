  to: 彼らにこう言った。「皆さん、私の見るところ、この航海は、積み荷や船だけでなく、私たちの命にも、災難と大きな損失をもたらすことになりそうです[a]。」
  rationale: 文の骨格を原文により近く整え、航海が積み荷、船、そして人命に災難と損失をもたらすという警告を明示した。脚注は、原文の ὕβρις／ζημία の別の訳し方と、ψυχή の文脈上の意味を一つにまとめ、本文の脚注アンカーを一つに整理した。
