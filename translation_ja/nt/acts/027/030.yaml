  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: ja
  text: ところが船員たちは、船から逃げ出そうとして、小舟[a]を海に降ろし、船首から錨を降ろそうとしているふりをしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小舟」は、本船に備えられた小型の舟を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: τῶν δὲ ναυτῶν
  choice: ところが船員たちは
  rationale: δέの場面上の対照を「ところが」で示し、ναῦταιは現代日本語で自然な「船員」とした。
- source_word: ζητούντων φυγεῖν ἐκ τοῦ πλοίου
  choice: 船から逃げ出そうとして
  rationale: ζητέω＋不定詞が表す企てを自然に表現し、φυγεῖνは船を見捨てようとする文脈に即して「逃げ出す」とした。
- source_word: χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν
  choice: 小舟を海に降ろしていた
  rationale: σκάφηは本船に備えられた小型艇を指すため「小舟」とし、χαλάωは「降ろす」と訳した。分詞の時間関係は、企てが進行していた文脈を自然な日本語で示した。
- source_word: προφάσει ὡς
  choice: ふりをし
  rationale: 表向きの理由が本心を隠す偽装であることを、明快で自然な日本語にした。
- source_word: ἐκ πρῴρης
  choice: 船首から
  rationale: πρῷραの標準的で広く理解される航海用語として「船首」を採用した。
- source_word: ἀγκύρας μελλόντων ἐκτείνειν
  choice: 錨を降ろす
  rationale: 直訳的には錨を「延ばし出す／繰り出す」意だが、この航海文脈では日本語として自然な「錨を降ろす」とした。μέλλωの意図・切迫性は「ふりをし」という構文の中に反映した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、航海用語は一般読者にも分かる「船員」「船首」「錨」とした。偽装と逃亡の意図が一読して分かるよう語順を整えつつ、原文の分詞構文が示す同時的な展開を保持した。
