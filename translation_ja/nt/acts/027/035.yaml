id: ACT.27.35
reference: Acts 27:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: ja
  text: こう言ってから、パウロはパンを取り、皆の前で神に感謝をささげた。そしてパンを裂き、食べ始めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: こう言ってから
  rationale: 直前の発言を受けるταῦταと、主動詞に先立つアオリスト分詞の時間的順序を、自然な現代日本語で表した。δέは独立した逆接語にせず、物語の流れの中に反映した。
- source_word: λαβὼν ἄρτον
  choice: パンを取り
  rationale: 無冠詞のἄρτονを「一個のパン」などと限定せず、簡潔に訳した。
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: 神に感謝をささげた
  rationale: εὐχαριστέωの基本義と、神を明示する与格を保ちつつ、品位ある自然な日本語とした。
- source_word: ἐνώπιον πάντων
  choice: 皆の前で
  rationale: その行為が一同の見ている公の場でなされたことを、簡潔かつ明瞭に表した。
- source_word: κλάσας
  choice: パンを裂き
  rationale: 日本語で対象を明確にするため「パン」を補い、後続する食事に先立つ動作として訳した。
- source_word: ἤρξατο ἐσθίειν
  choice: 食べ始めた
  rationale: ἄρχομαιと不定詞による開始の意味をそのまま自然に表した。
- source_word: implicit subject
  choice: パウロは
  rationale: ギリシア語では文脈上明らかな主語が省略されているが、日本語で読み手が動作主を即座に把握できるよう、直前の文脈に基づいて明示した。
theological_decisions:
- issue: 「パンを取る―感謝する―裂く―食べる」という一連の動作に聖餐を想起させる響きがある可能性
  choice: 船上での食事を描く通常の物語表現として訳し、聖餐であるとは明示しない。
  alternative: 伝統的な聖餐制定句にさらに近い定型表現を用い、典礼的な響きを強める。
  rationale: 語句の連なりには聖餐記事との類似があるが、本文自体はこの食事を主の晩餐と明言していない。そこで、その連想の可能性を妨げず、同時に特定の教理的解釈も訳文へ持ち込まない表現とした。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語としての簡潔さと聖書本文にふさわしい品位を両立させた。「そして」で最後の動作群を区切り、長い連鎖を読みやすくした。
