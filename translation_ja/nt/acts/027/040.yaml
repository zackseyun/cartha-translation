source:
  edition: SBLGNT
  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: ja
  text: 錨を切り離して海に残し、同時に舵を固定していた綱を解き[a]、風に向けて前帆を上げて[b]、砂浜へ向かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「舵をつないでいた帯」または「舵の留め具」とも訳せる。ギリシア語は、操舵装置を固定していたものを指す、まれな航海用語。
    reason: lexical_alternative
  - marker: b
    text: 「上帆」または「船首の帆」とも訳せる。このギリシア語の航海用語がどの帆を指すかは確定できない。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες ... τὰς ἀγκύρας
  choice: 錨を切り離して
  rationale: περιαιρέωは取り除く、外すという意味。続く「海に残し」と合わせ、船から錨を切り離した行為を自然な日本語で表した。切断方法そのものは明示しない。
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: 海に残し
  rationale: ἐάωの「そのままにする、放置する」という意味を、直前の複数の錨を目的語として簡潔に表した。
- source_word: ἅμα
  choice: 同時に
  rationale: 錨を処置する動作と、舵の綱を解く動作が並行していたことを明示する。
- source_word: ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: 舵を固定していた綱を解き
  rationale: ἀνίημιは緩める、解放するの意。ζευκτηρίαはまれな航海用語で、舵装置を結び留めていたものを指すと考えられるため、機能が伝わる訳とした。
- source_word: ἐπάραντες
  choice: 上げて
  rationale: 帆を掲げる動作として自然で明快な表現を採用した。
- source_word: τὸν ἀρτέμωνα
  choice: 前帆
  rationale: 船首側の帆を指す可能性が高い航海用語だが、厳密な種類には不確かさがあるため、本文では一般的な訳を用い、脚注で留保した。
- source_word: τῇ πνεούσῃ
  choice: 風を受けるように
  rationale: 女性形分詞に省略された名詞を風と理解し、帆を吹く風に向けて上げたという航海上の意味を自然に表した。
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: 砂浜へ向かった
  rationale: κατέχωの航海上の「針路を取る」という意味と、αἰγιαλόςの浜辺・砂浜という意味を簡潔に表現した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、航海場面の具体性と文の緊迫した流れを保った。まれな航海用語二語の不確かさは、本文を過度に専門的にせず脚注で示した。英語相談層で錨の後に置かれていた脚注は内容上ζευκτηρίαςに関するため、日本語稿では対応する「綱」の位置に付した。
