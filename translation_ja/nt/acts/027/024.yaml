id: ACT.27.24
reference: Acts 27:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: ja
  text: こう言った。「パウロ、恐れることはない。あなたはカエサルの前に立たなければならない。見よ、神は、あなたと一緒に航海している者を皆、あなたに与えてくださった。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: 恐れることはない
  rationale: 禁止命令を、慰めと励ましを含む自然な現代日本語で表した。
- source_word: Καίσαρί
  choice: カエサル
  rationale: ローマ皇帝の称号を、聖書訳で定着した音写により表した。
- source_word: δεῖ παραστῆναι
  choice: 前に立たなければならない
  rationale: 神的必然性を示す δεῖ と、出廷して面前に立つことを示す παραστῆναι を保った。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を促し、続く神の約束を強調する間投詞として明示した。
- source_word: κεχάρισταί σοι
  choice: あなたに与えてくださった
  rationale: χαρίζομαι の恵み深く与える含意と完了形の確定性を、敬意を伴う自然な表現で示した。
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: あなたと一緒に航海している者を皆
  rationale: 同行者ではなく、同じ船で航海中の全員を指す原文の範囲を明確にした。
theological_decisions:
- issue: 神が同船者たちをパウロに『与えた』ことの意味
  choice: 比喩を保って「あなたに与えてくださった」と訳す
  alternative: 「あなたと一緒にいる者を皆、助けることにされた」
  rationale: 文脈上は全員の命を救う約束だが、原文は救出を直接表す語ではないため、神学的意味を訳文内で限定せず、χαρίζομαι の表現を保持した。
translation_notes:
  register: 天使の告知にふさわしい簡潔で格調ある現代標準語。「見よ」は日常語より荘重だが、ἰδοὺ の談話上の強調を明確に保つため採用した。
