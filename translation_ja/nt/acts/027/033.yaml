  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: ja
  text: 夜が明けようとするまで、パウロは皆に食事を取るよう勧め続け、こう言った。「今日で十四日、あなたがたは待ち続け、何も食べず、何一つ口にしないままでいます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ
  choice: ……ころまで
  rationale: 継続する行為の時間的な限界を示す表現として、後続の「夜が明けようとする」と自然につながる形にした。
- source_word: ἡμέρα ἤμελλεν γίνεσθαι
  choice: 夜が明けようとする
  rationale: 直訳的には「昼になろうとしていた」。日本語では、夜明けが間近であることを自然かつ明確に表す。
- source_word: παρεκάλει
  choice: 勧め続け
  rationale: 未完了過去の継続・反復の含みを示し、単に一度勧めたのではないことを表した。
- source_word: ἅπαντας
  choice: 皆に
  rationale: 船上にいる全員を指す包括性を、簡潔で自然な日本語で表した。
- source_word: μεταλαβεῖν τροφῆς
  choice: 何か食べるよう
  rationale: 食物を取るという意味を、現代日本語で自然に表現した。
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: 今日でもう十四日間
  rationale: 今日が十四日目に当たるという原文の時間的強調を、自然な日本語にした。
- source_word: προσδοκῶντες
  choice: 先行きを案じながら
  rationale: 基本的な期待・待機の意味を保ちつつ、嵐の中で成り行きを待つ文脈上の不安を表した。語自体はより中立的にも理解できるため脚注を付した。
- source_word: ἄσιτοι διατελεῖτε
  choice: 何も食べず……ままでいます
  rationale: 食べない状態が長期間継続して現在に至っていることを表す。宗教的・自発的な断食を連想させる「断食」は避けた。
- source_word: μηθὲν προσλαβόμενοι
  choice: 何一つ口にしない
  rationale: 直前の「何も食べず」と重なる原文の反復を残しつつ、同じ語句の不自然な重複を避けた。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、叙事文としての落ち着きとパウロの切迫した勧めを保った。原文にある「食べず」と「何一つ口にしない」の意味上の反復も残した。
