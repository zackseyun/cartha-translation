id: ACT.27.43
reference: Acts 27:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: ja
  text: しかし百人隊長は、パウロを救いたいと思い、彼らの企てを阻止した[a]。そして、泳げる者たちに、まず船から飛び込んで陸に上がるよう命じた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「彼らがその意図を実行するのを妨げた」。前の節にある、兵士たちが囚人を殺そうとした企てを指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「まず身を投げ出して、陸へ上がるように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の将校職を表す、日本語聖書および歴史叙述で定着した明確な訳語。
- source_word: βουλόμενος
  choice: 救いたいと思い
  rationale: 分詞が表す百人隊長の願望・意図を、決意の強さを過度に限定せず自然な日本語で示す。
- source_word: διασῶσαι
  choice: 救う
  rationale: ここではパウロの命を危害から守ることを指すため、「救う」が簡潔で文脈に合う。
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: 彼らの企てを阻止した
  rationale: 兵士たちが前節で抱いた意図を実行に移させなかったことを明確かつ自然に表す。
- source_word: ἐκέλευσέν τε
  choice: そして…命じた
  rationale: 百人隊長が権限をもって指示したことを表す。τεの接続も自然な文の連続として示した。
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: 泳げる者たち
  rationale: 船上の人々のうち泳ぐ能力のある一群を、簡潔で現代的な日本語で示す。
- source_word: ἀπορίψαντας
  choice: 船から飛び込んで
  rationale: 字義は「身を投げ出して」だが、この海難の場面で船から水中へ飛び込む動作を自然に表した。
- source_word: πρώτους
  choice: まず
  rationale: 泳げる者たちが他の者に先立って行動する順序を示す。
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: 陸に上がる
  rationale: 水中から陸地へ出るという方向と到達動作を、簡潔で自然な日本語にした。
