translation_notes:
  register: 明瞭な現代標準日本語を用い、航海場面の緊迫感とパウロの穏やかな叱責を保った。「皆さん」は現代日本語の公的な呼びかけとして自然であり、原文が男性集団に向けた発言であることを不必要に古風な語調で強調しない。
