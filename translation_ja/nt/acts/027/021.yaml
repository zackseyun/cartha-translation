source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: ja
  text: 長い間食事を取らない状態が続いた後[a]、パウロは一同の中に立って言った。「皆さん、あなたがたは私の忠告に従い[b]、クレタから船出しないでいるべきでした。そうしていれば、この損傷と損失[c]を免れられたのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「長い断食が続いていた後」。ギリシア語は、食物がないことにも、自ら食を断つことにも用いられる。ここでは嵐の中で長く食事を取れなかった状態を指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私に従って」。この語には、指示や権威に従う意味もある。ここではパウロの助言を受け入れることを指す。
    reason: lexical_alternative
  - marker: c
    text: 「損傷」と「損失」という二語は、船などが受けた物理的な損傷と、積み荷などの物的損失を区別している可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: 人々が長い間、食事を取らずにいたとき
  rationale: 属格独立構文を発言時の状況として自然に表した。ἀσιτίαは食物の欠乏にも断食にもなり得るため、嵐の文脈で最も自然な「長く食べていない」状態を本文とし、意図的な断食の可能性は脚注に残した。
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: パウロは彼らの中に立って
  rationale: パウロが一同の中で立ち、皆に向けて話す場面を、簡潔で自然な日本語にした。
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: 皆さん、…べきでした
  rationale: ὦ ἄνδρεςは乗船中の男性たちへの呼びかけだが、日本語で「男たちよ」は不自然に響くため、敬意を保つ「皆さん」とした。ἔδειの過去における義務・妥当性は「べきでした」で表した。
- source_word: πειθαρχήσαντάς μοι
  choice: 私の言うことを聞いて
  rationale: πειθαρχέωには「従う」「命令に服する」の含意があるが、ここではパウロの助言を受け入れることを指すため、権威関係を過度に強めない自然な表現とした。別訳を脚注に示した。
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: クレタから船出しないでいる
  rationale: ἀνάγωの航海上の意味「出帆する、沖へ出る」を明確に表した。
- source_word: κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: そうしていれば、この損傷と損失を免れられた
  rationale: κερδαίνωは直訳では「得る」だが、損害を目的語とするここでは「被らずに済む、免れる」という慣用的意味。ὕβριςとζημίαの二語は一語にまとめず、「損傷」と「損失」として区別を保った。
