  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: ja
  text: というのも、今夜、私が属し、また礼拝している[a]神の御使いが私のそばに立ち、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「礼拝している」は「仕えている」とも訳せる。ギリシア語は、神にささげる宗教的奉仕や礼拝を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: 私のそばに立って
  rationale: 空間的にそばに立ったという意味を保ち、超自然的な出現を必要以上に説明しない。文は次節へ続くため、接続形とした。
- source_word: γάρ
  choice: というのも
  rationale: 前後の文脈で、パウロの確信の根拠を説明する接続機能を自然な現代日本語で示す。
- source_word: ταύτῃ τῇ νυκτί
  choice: 今夜
  rationale: 発話時に直結する『この夜』の意味を、簡潔で自然な日本語として表す。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格が御使いの所属を示すことを、その後の関係節との結びつきを保ちながら表す。
- source_word: οὗ εἰμι
  choice: 私が属し
  rationale: 直訳的には『私がその方のものである』。所有・帰属の意味を、現代日本語で明瞭かつ過度な解釈を加えず示す。
- source_word: ᾧ καὶ λατρεύω
  choice: また礼拝している
  rationale: λατρεύω が神にささげる宗教的奉仕を表すため、『礼拝する』を本文に採用し、『仕える』という可能性を注に残す。
- source_word: ἄγγελος
  choice: 御使い
  rationale: この神的な啓示の文脈では人間の使者ではなく天的存在を指す。日本語聖書として品位があり、一般にも理解可能な語を用いる。
theological_decisions:
- issue: οὗ εἰμι の訳し方
  choice: 私が属し
  alternative: 私がその方のものであり
  rationale: 神への帰属を自然に表しつつ、原文以上の教理的含意を付加しない。
- issue: λατρεύω の訳し方
  choice: 礼拝している
  alternative: 仕えている
  rationale: 神に対する宗教的奉仕という語義を明確にする。『仕える』も可能であり、礼拝より広い奉仕の含みを伝えるため注記する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文は次節の発言内容へ続くため、この節も読点で終える。『今夜』を動詞の近くに置き、日本語として自然な情報配列にした。
