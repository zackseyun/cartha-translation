id: ACT.27.22
reference: Acts 27:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: ja
  text: しかし今、私はあなたがたに、勇気を出すよう勧めます[a]。あなたがたのうち、いのちを失う者は一人もいません[b]。失われるのは、この船だけです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「元気を出すように」または「勇気を保つように」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたがたのうち、いのちの損失は一つもありません」。ここで「いのち」と訳したギリシア語は、特に「魂」を意味するのではなく、身体的な生命を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: しかし今
  rationale: 直前までの危機的状況と勧告を受け、現在の勧めへ転じる表現として、καίも文脈上の転換を示す自然な日本語にした。
- source_word: παραινῶ
  choice: 勧めます
  rationale: 助言と強い励ましの両面を持つ語。威圧的になりすぎない、品位ある現代日本語を選んだ。
- source_word: εὐθυμεῖν
  choice: 勇気を出す
  rationale: 危機の中で気を強く保ち、元気づくことを表す。「元気を出す」も可能だが、嵐と難船の文脈では「勇気」が適切。
- source_word: ἀποβολὴ ψυχῆς
  choice: いのちを失う
  rationale: ここでψυχήは非物質的な「魂」に限定されず、身体的生命を指す。日本語として自然な動詞表現にした。
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: あなたがたのうち、いのちを失う者は一人もいません
  rationale: 集団の中から一人も死亡しないという強い否定を、明確で自然な日本語にした。
- source_word: πλὴν τοῦ πλοίου
  choice: 失われるのは、この船だけです
  rationale: 字義的には「船を除いて」だが、生命と船をそのまま同列に置く不自然さを避け、船だけが失われるという対照を明示した。
theological_decisions:
- issue: ψυχήの意味
  choice: いのち
  alternative: 魂
  rationale: この難船の文脈では人の身体的生命を意味し、魂の滅びについて述べているのではない。
- issue: 船の喪失と人命の喪失の対照
  choice: 人命は一人も失われず、船だけが失われると表現
  alternative: あなたがたのうち、船以外には何の損失もない
  rationale: 原文の簡潔でやや圧縮された例外表現を、日本語で意味が誤解されないように展開しつつ、内容上の対照を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、パウロの落ち着いた力強い励ましを丁寧体で表現した。「いのち」は聖書本文としての品位と可読性を両立させるため平仮名表記とした。
