source:
  edition: SBLGNT
  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: ja
  text: 何日もかけてゆっくり航行し、苦労してクニドス沖まで来た。風が私たちの進行を許さなかったので、私たちはサルモネ沖でクレタ島の風下側を航行した[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「風が私たちを許さなかった」。ここでは、風のために前進または接近することができなかったという意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「クレタ島の下を航行した」。島を風よけにして、その風下側を進んだという航海上の表現。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: 幾日もの間
  rationale: ἐν＋時間の与格が示す、長い日数にわたる航行の遅延を自然な現代日本語で表す。
- source_word: βραδυπλοοῦντες
  choice: ゆっくりと航行し
  rationale: 船で進む速度が遅かったことを表し、続く μόλις の「ようやく」と区別する。
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: ようやくクニドス沖にたどり着いた
  rationale: μόλις の困難の末に達した含意と、κατά＋対格が示す沿岸地点の沖・正面という地理的関係を、日本語として明瞭に表す。
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: 風に行く手を阻まれたため
  rationale: 属格独立構文の理由を明示しつつ、προσεάω が文脈上表す、風が接近・前進を許さなかった意味を簡潔に伝える。
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: クレタ島の風下側を航行した
  rationale: ὑποπλέω の航海用法、すなわち島を風よけにしてその風下側を進むことを表す。
- source_word: κατὰ Σαλμώνην
  choice: サルモネ岬沖を通って
  rationale: 沿岸の目印に対する船の位置・航路を示す κατά を自然な航海表現で訳す。サルモネがクレタ島東端の岬であることも明確にする。
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: クニドス／クレタ／サルモネ
  rationale: 現代日本語で一般的または自然な地名表記を用いる。
