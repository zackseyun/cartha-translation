revisions:
- from: 幾日もの間、私たちはゆっくりと航行し、ようやくクニドス沖にたどり着いた。しかし、風に行く手を阻まれたため[a]、サルモネ岬沖を通って、クレタ島の風下側を航行した[b]。
  to: 何日もかけてゆっくり航行し、苦労してクニドス沖まで来た。風が私たちの進行を許さなかったので、私たちはサルモネ沖でクレタ島の風下側を航行した[a][b]。
  rationale: κατὰ Σαλμώνηνを航路の別段階ではなく、クレタ島の風下側を航行した場所として示すよう改めた。あわせて、μόλιςの困難のニュアンスと、風が進行を許さなかったという原文の表現を明瞭にし、脚注から根拠のない「予定していた方向」という補足を除いた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:05Z'
