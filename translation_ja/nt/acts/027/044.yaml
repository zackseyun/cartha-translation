  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: ja
  text: 残りの者たちは、ある者は板に、ある者は船からの物に乗って、陸へ行くようにした。こうして、全員が無事に陸へたどり着いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「全員が陸へ無事に救い出された」または「全員が無事に岸へ逃れた」。ここで「無事にたどり着いた」と訳したギリシア語の動詞は、難船から身体的に救い出されることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: 残りの者たちは
  rationale: 前節ですでに述べられた泳げる者たち以外の、残った人々を指す。現代日本語として自然で、集団の残余という意味を保つ。
- source_word: οὓς μὲν ... οὓς δὲ
  choice: ある者は……ある者は
  rationale: 残りの人々を二つの समूहに分ける相関表現を、簡潔で自然な日本語にした。
- source_word: ἐπὶ σανίσιν
  choice: 板に乗り
  rationale: σανίςは板または厚板を意味する。海難の場面に合い、原文が明示しない材質や用途は加えない。
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: 船から出た物につかまって
  rationale: τινωνの不特定性を「物」で保ち、船の破片と断定しすぎないようにした。ἐπίはこの文脈で、それを浮き具として用いたことが伝わるよう「つかまって」と表現した。
- source_word: οὕτως
  choice: こうして
  rationale: 直前に述べられた方法を受けて結果を導く機能を、自然な物語文で表した。
- source_word: ἐγένετο
  choice: （こうして）……たどり着いた
  rationale: 結果が実現したことを示す構文であり、日本語では独立した「起こった」を置かず、結果文全体で自然に表した。
- source_word: πάντας διασωθῆναι
  choice: 全員が無事に……たどり着いた
  rationale: διασῴζωはここでは難船からの身体的な救出・生還を指す。「無事に」で危険を切り抜けた意味を示し、受動形を逐語的に再現して不自然になることを避けた。
- source_word: ἐπὶ τὴν γῆν
  choice: 陸へ
  rationale: 海との対比におけるγῆを、簡潔で文脈に即した日本語で表した。
theological_decisions:
- issue: διασωθῆναιが持ち得る救済上の含意
  choice: 全員が無事に陸へたどり着いた
  alternative: 全員が陸へ救われた／全員が無事に岸へ逃れた
  rationale: 文脈は難船からの身体的な生還であり、霊的救済を述べてはいない。主文ではその意味を明確にしつつ、脚注で原語の「救われる」に近い訳も示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、海難場面の緊迫感に合う簡潔で品位ある物語調とした。節頭は前節から続く構文だが、単独でも理解できるよう「陸へ向かった」を補った。原文の不特定な「船からの物」は、具体的に「破片」と断定せずに残した。
