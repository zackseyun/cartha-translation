  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: ja
  text: その翌日、私たちはシドンに寄港した。ユリウスはパウロを親切に扱い[a]、友人たちのところへ行って世話を受けること[b]を許した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「親切に扱い」は「人道的に扱い」とも訳せる。囚人であるパウロに対するユリウスの思いやりある振る舞いを表す。
    reason: lexical_alternative
  - marker: b
    text: 「世話を受ける」は「必要な配慮を受ける」または「援助を受ける」とも訳せる。ギリシア語の表現は、友人たちから必要な助けを受けることを広く指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: その翌日
  rationale: 物語の時間的な連続を示す慣用表現として、自然かつ明確に訳した。
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: 私たちはシドンに寄港した
  rationale: κατάγωはこの航海記事では船が港に入ることを表すため、一般的な「着いた」より海事的な意味を明確にした。
- source_word: φιλανθρώπως … χρησάμενος
  choice: パウロを親切に扱い
  rationale: 与格の人物に対して好意的・人道的に振る舞うという分詞句を、現代日本語で自然に表した。
- source_word: ἐπέτρεψεν
  choice: 許した
  rationale: 権限を持つユリウスが外出を認めたという許可の意味を簡潔に示した。
- source_word: πρὸς τοὺς φίλους πορευθέντι
  choice: 友人たちのところへ行って
  rationale: 定冠詞付きの「友人たち」は文脈上パウロの友人たちを指す。分詞は、許可された行為として自然な日本語の連用表現にした。
- source_word: ἐπιμελείας τυχεῖν
  choice: 世話を受ける
  rationale: 必要な配慮、援助、世話を得るという幅のある表現を、過度に具体化せず自然な日本語で表した。
