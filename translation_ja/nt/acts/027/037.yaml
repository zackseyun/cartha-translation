  text: There were 276 persons in the ship in all[a].
translation:
  language: ja
  text: 船にいた私たちは、全部で二百七十六人であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「魂」という語を用いているが、ここでは船にいた人々、すなわち乗船者を数える表現である。肉体と区別された非物質的な魂を指すものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: 私たちは…であった
  rationale: 一人称複数形を明示し、著者を含む乗船者全体について述べる原文の形を保った。
- source_word: δὲ
  choice: （独立した訳語を置かない）
  rationale: ここでは弱い接続・叙述の継続を示すため、日本語では文脈上自然に省略できる。
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: 全部で…人
  rationale: ψυχαίはこの文脈では非物質的な「魂」ではなく、人を数える表現である。πᾶσαιは「全部で」に反映した。
- source_word: ἐν τῷ πλοίῳ
  choice: 船にいた
  rationale: 乗船していたことを自然な現代日本語で表した。
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: 二百七十六人
  rationale: 原文の正確な人数を、日本語本文に適した漢数字で示した。
theological_decisions:
- issue: ψυχαίの意味
  choice: 人
  alternative: 魂
  rationale: ここでは乗船者の総数を述べており、人間の非物質的側面について教える表現ではない。ただし直訳上の語を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の一人称複数を保持しつつ、「魂」という直訳が日本語で神学的な誤解を招かないよう本文では助数詞「人」を用いた。
