  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: ja
  text: ですから、皆さん、勇気を出しなさい。私は神を信じています[a]。私に告げられたとおりになると信じています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私は神に信頼しています」とも訳せる。ギリシア語の表現は、神への信頼と、神が語られたことを信じる意味の両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の神の約束を受けた結論・勧めであることを、自然な現代日本語で明確に示す。
- source_word: εὐθυμεῖτε
  choice: 勇気を出しなさい
  rationale: 危機の中で気を強く持つよう促す命令を、明快で自然に表す。
- source_word: ἄνδρες
  choice: 皆さん
  rationale: 船上の一同への直接の呼びかけとして自然な日本語を用いる。文脈上の聴衆は男性だが、「男たちよ」は現代日本語では不自然に響く。
- source_word: πιστεύω τῷ θεῷ
  choice: 私は神を信じています
  rationale: 与格を伴うπιστεύωが持つ、神を信頼し、その語られた言葉を真実として受け入れる意味を保つ。
- source_word: ὅτι
  choice: からです
  rationale: ここでは信じる内容を導くὅτιだが、日本語では後続内容を理由として配置すると、同じ論理関係を自然に表せる。
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: 告げられたとおりになる
  rationale: 将来の出来事が告知された内容に一致することを、重複を避けつつ明確に表す。
- source_word: λελάληταί μοι
  choice: 私に告げられた
  rationale: 完了受動の、すでに語られて今なお効力を持つ知らせを、自然な受動表現で示す。語り手である神は文脈から理解されるため補わない。
theological_decisions:
- issue: πιστεύω τῷ θεῷ の訳し方
  choice: 私は神を信じています
  alternative: 私は神に信頼しています／私は神の言葉を信じています
  rationale: 原文は神への人格的信頼と、神が語った内容を真実と認めることの両方を含み得る。「神を信じています」はその緊張を保ち、「神の言葉」を本文に補わない。
translation_notes:
  register: 明快で品位ある現代標準語。危機の場面での直接的な励ましを保ちつつ、「男たちよ」のような直訳調は避けた。
