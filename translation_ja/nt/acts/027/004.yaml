  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: ja
  text: そこから船出し、風が行く手を阻んでいたので、キプロス島の風下側を航行した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キプロス島の風を避けられる側に沿って航行した」とも訳せる。ギリシア語の動詞は、島の風下側を航行することを表す航海用語。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: そこから
  rationale: καίを日本語では文脈上あえて明示せず、ἐκεῖθενを自然な現代語で表した。直前から続く航海の流れは十分に保たれる。
- source_word: ἀναχθέντες
  choice: 船出し
  rationale: 航海用法のἀνάγωは「沖へ出る、出航する」の意。錨を上げたと限定せず、先行する分詞の動作を簡潔に表した。
- source_word: ὑπεπλεύσαμεν
  choice: 風下側を航行した
  rationale: 島の風を避けられる側を進むことを表す航海用語として、正確さと現代日本語での理解しやすさを両立させた。
- source_word: τὴν Κύπρον
  choice: キプロス島
  rationale: 現代日本語で定着した地名に「島」を添え、地理的対象を明確にした。
- source_word: διὰ τὸ ... εἶναι
  choice: ので
  rationale: διάと冠詞付き不定詞が示す理由を、自然な因果表現で示した。
- source_word: τοὺς ἀνέμους ... ἐναντίους
  choice: 風が行く手を阻んでいた
  rationale: 直訳的な「風が反対だった」より自然であり、航行に対して風が逆らっていたという文脈上の意味を明瞭に伝える。明示されていない「私たち」を不必要に補わない。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、航海記事としての簡潔さと品位を保った。「風下側」はやや専門的だが正確であるため本文に採用し、脚注で平易な言い換えを示した。
