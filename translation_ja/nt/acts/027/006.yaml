  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: ja
  text: そこで百人隊長は、イタリアへ向かって航行していたアレクサンドリアの船を見つけ、私たちをその船に乗せた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: そこで
  rationale: καί と ἐκεῖ の結合形で、「そしてそこで」というつながりを表す。日本語では「そこで」とすることで、前後の連続性と場所の意味を自然に示せる。
- source_word: εὑρὼν
  choice: 見つけ
  rationale: 主動詞に先立つアオリスト分詞であり、百人隊長が船を見つけた後に一行を乗せたという動作の順序を、自然な連用形で表した。
- source_word: ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の階級を指す標準的で定着した訳語であり、歴史的な役職名を保持する。
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: アレクサンドリアの船
  rationale: 形容詞 Ἀλεξανδρῖνον は船がアレクサンドリアに属する、または同地を出所とすることを示す。「アレクサンドリアの船」はその幅を保つ自然な表現である。
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: イタリアへ向かって航行していた
  rationale: 現在分詞 πλέον と方向を示す εἰς により、その船がイタリアを目的地として航行中であったことを明示する。
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: 私たちをその船に乗せた
  rationale: ἐμβιβάζω の使役的な意味、すなわち人を船に乗り込ませることを、明瞭で自然な現代日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、航海記事にふさわしい簡潔で落ち着いた文体とした。「航行していた」により πλέον の継続的な動作を表しつつ、過度に専門的な海事用語は避けた。
