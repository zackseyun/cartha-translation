  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: ja
  text: 十四日目の夜になり、私たちがアドリアの海[a]を流されていたとき、真夜中ごろ、船員たちはどこかの陸地が自分たちに近づいているのではないかと思い始めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代の「アドリア」は、現代のアドリア海だけでなく、この地域の中央地中海の海域をより広く指すことがありました。
    reason: cultural_note
  - marker: b
    text: 直訳すると、「船員たちは、どこかの陸地が自分たちに近づいていると思い始めた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: 十四日目の夜になり
  rationale: 嵐の中で過ぎた日数の十四日目に当たる夜が来たことを、自然な日本語の時の表現で示す。
- source_word: διαφερομένων ἡμῶν
  choice: 私たちが…流されていた
  rationale: 現在受動分詞が表す、風波によって制御できないまま運ばれている継続的な動きを保持する。
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: アドリアの海
  rationale: 古代の地理名称であり、現代のアドリア海より広い海域を指し得るため、現代の範囲に限定しすぎない表現とした。
- source_word: κατὰ μέσον τῆς νυκτός
  choice: 真夜中ごろ
  rationale: 夜の中ほどという意味と、κατάがもつおおよその時刻の含みを自然に表す。
- source_word: ὑπενόουν οἱ ναῦται
  choice: 船員たちは…ように感じ始めた
  rationale: 未完了過去の進行・起動的な含みと、確定ではない推測を表す。周囲の兆候から察知したという文脈にも合う。
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: どこかの陸地が近づいている
  rationale: 陸地を不定の主体として『彼らに近づく』と捉えるギリシア語の構図と、τινάの不確定性を保持する。
theological_decisions: []
