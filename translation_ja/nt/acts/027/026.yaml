  text: But we must run aground on some island[a].
translation:
  language: ja
  text: しかし、私たちはどこかの島に漂着しなければなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どこかの島に乗り上げなければなりません」。
    reason: ἐκπεσεῖν は航海の文脈で、島へ流れ着くこと、または船が島に乗り上げて座礁することを表し得るため。
lexical_decisions:
- source_word: δέ
  choice: しかし
  rationale: 直前の発言との緩やかな対照を自然な現代日本語で示す。
- source_word: εἰς νῆσον τινα
  choice: どこかの島に
  rationale: τινα が示す島の不特定性と、εἰς の方向性を自然に表す。
- source_word: δεῖ ἡμᾶς
  choice: 私たちは…なければなりません
  rationale: 必要・必然を表す δεῖ と、不定詞の意味上の主語 ἡμᾶς を明確で自然な日本語にする。
- source_word: ἐκπεσεῖν
  choice: 打ち上げられる
  rationale: この航海文脈で、船が島の岸へ押し流されて座礁する出来事を表す。受動的な成り行きも保つ。
theological_decisions:
- issue: δεῖ が示す必然性の性質
  choice: 「なければなりません」とし、必然性だけを示す
  alternative: 神の定めとして明示する
  rationale: 文脈上は神の告知に基づく必然性だが、この節自体はその主体を明言しないため、訳文で補わない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「打ち上げられる」を本文に置いて原文の受動的なニュアンスを保ち、より船そのものに焦点を当てる「乗り上げる」を脚注に示した。
