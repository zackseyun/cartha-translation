  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: ja
  text: そして、私たちは苦労してその島の岸に沿って航行し、「良い港」と呼ばれるある場所に着いた。その近くにはラサヤという町があった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόλις
  choice: 苦労しながら
  rationale: 航行が困難を伴い、ようやく進めたという意味を、自然な現代日本語で表す。
- source_word: παραλεγόμενοι αὐτὴν
  choice: その島の岸沿いを進み
  rationale: παραλέγομαιの航海用語としての意味を明示し、αὐτήνが直前の文脈にあるクレタ島を指すことを自然に示す。『進み』は船による移動という文脈で十分明瞭である。
- source_word: ἤλθομεν εἰς τόπον τινὰ
  choice: 所に着いた
  rationale: τινάの不特定性は、日本語では『所』によって自然に保たれる。ἤλθομενは目的地への到達を表すため『着いた』とした。
- source_word: καλούμενον Καλοὺς Λιμένας
  choice: 「良い港」と呼ばれる
  rationale: 地名の意味を伝えつつ固有名として引用符で示す。Καλοὺς Λιμέναςは複数形だが、場所名として日本語で定着しやすい『良い港』を採用した。
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: その近くにはラサヤという町があった
  rationale: 関係節を自然な日本語の独立文にし、冠詞のない πόλις を『町』、固有名を『ラサヤという』として導入した。
