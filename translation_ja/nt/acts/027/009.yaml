  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: ja
  text: かなりの時が過ぎ、すでに断食[a]も過ぎて航海が危険になっていたので、パウロは人々にこう忠告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「断食」とは、おそらく年に一度のユダヤ教の贖罪日の断食を指す。この断食の時期が過ぎるころには、地中海での航海は危険になっていた。
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: かなりの時が過ぎ
  rationale: 属格絶対構文が示す相当な時間の経過を、自然で明瞭な現代日本語で表した。
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: 航海は危険になっていた
  rationale: πλοῦςを船そのものではなく海路の航行と捉え、ἐπισφαλήςが表す危険な状態を文脈に即して訳した。
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: すでに「断食の日」も過ぎていて、…ので
  rationale: διά＋冠詞付き不定詞の理由を示す働きと、καίの「〜も」、完了不定詞の既に過ぎ去った意味を保った。
- source_word: τὴν νηστείαν
  choice: 「断食の日」
  rationale: 定冠詞付き単数形は周知のユダヤ教の断食日、通常は贖罪日を指す。本文では固有の呼称らしさを示しつつ、具体的説明は脚注に置いた。
- source_word: παρῄνει
  choice: 忠告した
  rationale: 助言する、勧告するという語義を簡潔に表し、続く直接話法を自然に導入した。未完了時制の進行性を日本語で不自然に強調しない。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こう忠告した」は次節の発言へ続くことを自然に示す。脚注記号は節末に置き、断食日の文化的・季節的背景を説明した。
