  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: ja
  text: そして、水深を測ったところ、水深は二十オルギュイアだった。少し進んで、もう一度水深を測ったところ、水深は十五オルギュイアだった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βολίσαντες
  choice: 水深を測ると
  rationale: 鉛のおもりを付けた測深索を投じて海の深さを測る行為を指す。具体的な器具は脚注に示し、本文では現代の一般読者に明瞭な表現とした。
- source_word: εὗρον
  choice: ～であった
  rationale: 測定して判明した結果を自然な日本語で報告する。直訳的な「見いだした」より文脈に適する。
- source_word: ὀργυιὰς
  choice: オルギュイア
  rationale: 古代の長さの単位を現代の単位へ換算せず音写し、原文の数値を保持する。概算値は脚注で説明する。
- source_word: εἴκοσι
  choice: 二十
  rationale: 数詞を直接訳した。
- source_word: βραχὺ διαστήσαντες
  choice: 少し進んでから
  rationale: 短い距離を隔てる、すなわち船が少し先へ進んだことを示す文脈的で自然な表現。
- source_word: πάλιν
  choice: もう一度
  rationale: 測深行為の反復を明確に表す。
- source_word: δεκαπέντε
  choice: 十五
  rationale: 数詞を直接訳した。
- source_word: καὶ ... δὲ ... καὶ
  choice: そして……。……から、もう一度……
  rationale: 強い対比ではなく、出来事の継起と反復を示す接続関係として自然な日本語にした。
