  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: ja
  text: さて、私たちがイタリアへ船出することが決まったとき、パウロとほかの数人の囚人は、アウグストゥス隊[a]の百人隊長ユリウスに引き渡された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「皇帝の隊」。固有名として「セバステ隊」とすることもできる。ギリシア語の名称はアウグストゥス、すなわち皇帝に関係するが、具体的にどの部隊を指すかは確定していない。
    reason: σπείρης Σεβαστῆςの正確な歴史的同定には不確かさがあり、本文の名称訳に代わる理解を示すため。
lexical_decisions:
- source_word: Ὡς δὲ ἐκρίθη
  choice: さて、…ことが決まると
  rationale: ὡς はここで時を表す接続詞として「…すると／…と」と訳し、δέ の物語を進める働きは自然な「さて」で示した。ἐκρίθη の受動態による公的な決定という含みを「決まる」で保った。
- source_word: τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν
  choice: 私たちがイタリアへ船で向かうこと
  rationale: 属格の冠詞付き不定詞を決定の内容として訳した。ἀποπλεῖν の海路で出発する意味を「船で向かう」とし、ἡμᾶς の一人称複数を明示した。
- source_word: παρεδίδουν
  choice: 引き渡された
  rationale: 拘束下の者を正式に移管する意味を「引き渡す」で表した。ギリシア語では主語が明示されないため、日本語では囚人を主語とする受動文にして、特定されていない行為者を補わないようにした。未完了過去の叙述は、日本語で自然な過去形によって表した。
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: パウロとほかの数人の囚人
  rationale: τε…καί の結合を自然な「…と…」で示した。τινας は不特定の複数を表すため「数人」、ἑτέρους はパウロ以外の者を指すため「ほかの」とした。
- source_word: ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ
  choice: ユリウスという百人隊長に
  rationale: ローマ軍の職名 ἑκατοντάρχης は定着した訳語「百人隊長」とし、ὀνόματι の命名表現は自然な「…という」で表した。
- source_word: σπείρης Σεβαστῆς
  choice: 皇帝直属隊
  rationale: σπεῖρα はローマ軍の歩兵部隊を指し、Σεβαστή は皇帝アウグストゥスに結び付く称号・名称である。「皇帝直属隊」は現代日本語で関係性を伝えるが、部隊の正確な歴史的同定には不確かさがあるため、直訳的な可能性を脚注に示した。
theological_decisions:
- issue: σπείρης Σεβαστῆς という歴史的に不確かな部隊名の訳し方
  choice: 皇帝直属隊
  alternative: アウグストゥス隊／セバステ隊
  rationale: 教理上の争点ではないが、Σεβαστή が皇帝に関連する称号であることを本文で分かりやすく伝えつつ、固有の部隊名であった可能性と正確な同定の不確かさを脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、歴史叙述にふさわしい落ち着いた文体とした。「さて」は原文の δέ が持つ場面転換・物語進行の働きを示すもので、時間副詞の「今」を補ったものではない。
