source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: ja
  text: 幾日もの間、太陽も星も姿を見せず、激しい嵐がなおも私たちを襲っていたため、それ以後、私たちが助かる[a]望みはすべて次第に失われていった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救われる」とも訳せる。ギリシア語の動詞は「救う」「助け出す」の両方の意味を持つが、ここでは嵐から命が助かることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: 姿を見せず
  rationale: 太陽や星が見えるようになることを表す分詞を、否定表現の中で自然な現代日本語にした。航海上、天体を観測できなかった状況も伝わる。
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: 幾日もの間
  rationale: かなりの日数にわたる継続を、簡潔で自然な日本語で表した。
- source_word: χειμῶνός τε οὐκ ὀλίγου
  choice: 激しい嵐
  rationale: χειμώνはこの海上の文脈では荒天・嵐を指す。οὐκ ὀλίγουは直訳すれば「小さくない」だが、日本語ではその緩叙を機械的に残すより「激しい」とする方が意味と強調を明瞭に伝える。
- source_word: ἐπικειμένου
  choice: 襲い続けた
  rationale: 嵐が重くのしかかり、継続して迫っていたことを、分詞の継続的な意味が伝わる形で表した。
- source_word: λοιπὸν
  choice: とうとう
  rationale: 長引く荒天の結果、希望を失う段階に至ったという推移を自然に示す。
- source_word: περιῃρεῖτο
  choice: 失われていった
  rationale: 未完了過去の受動形が示す進行的な過程を表し、希望が一時に消えたのではなく次第に取り去られたことを伝える。
- source_word: ἐλπὶς πᾶσα
  choice: 望みはすべて
  rationale: 希望が全面的に失われたというπᾶσαの総体性を保つ。
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: 私たちが助かる
  rationale: 冠詞付き不定詞が望みの内容を示す構造を自然な日本語にし、海難から生き延びるという身体的救出の意味を明確にした。
theological_decisions:
- issue: 海難の物語におけるσῴζεσθαιの意味
  choice: 海で死ぬことを免れて助かること
  alternative: 救われること
  rationale: 使徒27章の直接の文脈は嵐と難船からの生存であり、ここでの動詞は霊的救済ではなく身体的な救出・保全を指す。「助かる」はその意味を自然に表しつつ、脚注で原語のより広い語義を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、海難場面の切迫感と、希望が徐々に失われる未完了過去のニュアンスを保った。
