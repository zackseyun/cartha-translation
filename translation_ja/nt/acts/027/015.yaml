  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: ja
  text: そこで、船は風に巻き込まれ、風に向かって進むことができなかったので、私たちは風に逆らうのをやめ、流されていった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναρπασθέντος
  choice: 巻き込まれ
  rationale: アオリスト受動分詞が示す、船が外力によって急に捕らえられたことを自然な日本語で表す。「吹き流され」は後続する移動の描写まで先取りするため避けた。
- source_word: πλοίου
  choice: 船
  rationale: 物語の海上文脈におけるπλοῖονの明快で自然な現代日本語。
- source_word: μὴ δυναμένου
  choice: できなかった
  rationale: 能力・可能性の否定を、読みやすい定形動詞で表した。
- source_word: ἀντοφθαλμεῖν
  choice: 風に向かって進む
  rationale: 文字どおりには「面と向かう」意を持つ航海用語であり、ここでは船が風上へ船首を向けて進むことを指す。単に「風に立ち向かう」より具体的で自然。
- source_word: ἀνέμῳ
  choice: 風
  rationale: 語自体は「風」であり、文脈上の暴風を訳語に過度に織り込まない。
- source_word: ἐπιδόντες
  choice: 抵抗をやめ
  rationale: 目的語が明示されない航海文脈で、風に逆らう試みを放棄して身を任せたことを表す。「船を任せ」は補足的であり、「譲った」は日本語では不明瞭。
- source_word: ἐφερόμεθα
  choice: 流されるままになった
  rationale: 未完了過去受動が示す、外力による継続的な移動を自然に表す。日本語では「流された」だけより、先行するἐπιδόντεςとの結びつきも明瞭になる。
- source_word: δέ
  choice: しかし
  rationale: 直前の航行の試みと、船が風に捕らえられた展開との軽い対照を示す。
