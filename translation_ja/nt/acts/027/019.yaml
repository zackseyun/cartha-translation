  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: ja
  text: 三日目には、彼らは自分たちの手で船の装備を海に投げ捨てた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
