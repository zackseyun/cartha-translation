lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: 三日目には
  rationale: 序数を伴う与格の時を表す用法として、文脈上補われる「日」を明示し、自然な日本語にした。
- source_word: αὐτόχειρες
  choice: 自分たちの手で
  rationale: 彼ら自身が直接作業を行ったという強調を保ち、原語の字義にも沿う表現とした。
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: 船の装備
  rationale: 海事文脈におけるσκευήを、特定の索具だけに狭めず、船に備わる器具・設備を広く指しうる「装備」とした。
- source_word: ἔρριψαν
  choice: 海に投げ捨てた
  rationale: 動詞自体は「投げた」だが、嵐の中で船を軽くする文脈から船外へ捨てたことを自然に明示した。日本語では「海に」が明瞭である。
