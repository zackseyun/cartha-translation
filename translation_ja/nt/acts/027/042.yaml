  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: ja
  text: 兵士たちは、囚人たちを殺すことに決めた。泳いで逃げる者が一人も出ないようにするためであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: 決めた
  rationale: 直訳的な「計画が生じた」よりも、兵士たちの間で殺害方針がまとまったことを自然な現代日本語で表す。
- source_word: τοὺς δεσμώτας
  choice: 囚人たち
  rationale: この文脈では拘束され護送中の者たちを指すため、一般読者に明瞭な「囚人」を用いる。
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: 泳いで逃げる
  rationale: ἐκκολυμβάωの泳いでその場を離れる動作と、διαφεύγωの逃げ切る意図を、重すぎない自然な日本語にまとめる。
- source_word: μή τις
  choice: 一人も…ないように
  rationale: 否定を伴う目的・懸念を表し、誰か一人でも逃亡する事態を防ぐ意図を明確にする。
theological_decisions:
- issue: μή節の機能
  choice: 「一人も出ないようにするため」と目的・予防の意図として訳す
  alternative: 「だれかが…逃げるといけないと考えた」と懸念として訳す
  rationale: μή＋接続法は警戒・防止の含みを持つ。ここでは囚人殺害という計画の目的を自然に示しつつ、逃亡が実際に起きたとは読ませない。
translation_notes:
  register: 明瞭で現代的だが、物語本文としての落ち着いた文体を保った。「ところが」等はδὲの対照性を強く固定するため本文には加えず、文脈上の移行は語順と文の切れ目に委ねた。
