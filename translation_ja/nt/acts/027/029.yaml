  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: ja
  text: どこかの険しい場所に乗り上げるのではないかと恐れ、船尾から四つの錨を下ろし、夜が明けるようにと祈り続けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「日が来ることを祈り続けた」。「願い続けていた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί τε μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: そして、岩礁のある場所に乗り上げるのではないかと恐れ
  rationale: 分詞が示す後続行為の動機を自然な日本語で表した。τραχεῖς τόπους は危険な荒い海底・岩場を指しうるため、「岩礁のある場所」とし、ἐκπέσωμεν の海事的意味を「乗り上げる」で表現した。
- source_word: ἐκ πρύμνης
  choice: 船尾から
  rationale: πρύμνα の船舶用語としての意味を、現代日本語の簡潔で正確な語で示した。
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: 四つの錨を下ろし
  rationale: 錨を海中へ投じる行為を日本語の自然な海事表現で訳し、分詞の先行動作も保持した。
- source_word: ηὔχοντο
  choice: 祈り続けた
  rationale: εὔχομαι の祈願の意味を採り、未完了過去が示す継続的な祈りを「続けた」で表した。
- source_word: ἡμέραν γενέσθαι
  choice: 夜が明けるように
  rationale: 直訳は「昼となること」だが、この夜間の航海場面では夜明け・ daylight の到来を意味するため、自然な現代日本語とした。
theological_decisions:
- issue: ηὔχοντο が祈りか単なる願望か
  choice: 祈り続けた
  alternative: 待ち望んでいた／願っていた
  rationale: 通常の語義として「祈る」が十分に支持され、切迫した文脈にも適合する。ただし、ここでは祈りの対象が明示されていないため、その点を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、海事用語の「船尾」「錨」は保持した。「岩礁のある場所」は τραχεῖς τόπους の危険な岩場・荒い場所という幅を過度に限定しない表現。「祈り続けた」により未完了過去の継続性を反映した。
