  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: ja
  text: しかし、百人隊長は、パウロの言うことよりも、操舵手と船主のほうをより信頼した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、百人隊長は、パウロの言うことよりも、操舵手と船主のほうにより説得された。」
    reason: ἐπείθετοは、この文脈で「信頼した」のほか、「説得された」とも訳せるため。
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の役職を表す、聖書翻訳で定着しつつ現代日本語でも理解可能な名称。
- source_word: κυβερνήτῃ
  choice: 船を操る者
  rationale: 船の操舵・航行を担う者を指す。ναύκληροςとの役割の違いを保ち、「船長」と断定することを避けた。
- source_word: ναυκλήρῳ
  choice: 船主
  rationale: 船の所有者または運航責任者を指す語で、κυβερνήτηςと区別するため簡潔に「船主」とした。
- source_word: μᾶλλον ἐπείθετο
  choice: いっそう従った
  rationale: πείθωの受動・中動的な「説得される、信頼して従う」という幅と、μᾶλλονの比較を自然な日本語で表す。
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: パウロの言うこと
  rationale: 冠詞付き受動分詞が指すパウロの発言・助言を、自然で明瞭な日本語にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前のパウロの警告と百人隊長の反応との対照を明示する。
- source_word: ἢ
  choice: よりも
  rationale: μᾶλλονと組み合わされた比較を直接表す。
