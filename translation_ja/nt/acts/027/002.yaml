source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: ja
  text: そこで私たちは、アジア州[a][b]の諸地方へ向かう予定のアドラミティオンの船に乗り込み、出航した。テサロニケ出身のマケドニア人アリスタルコも、私たちと一緒だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「アジア」は、現在のアジア大陸ではなく、小アジア西部にあったローマ帝国の属州アジアを指す。
    reason: cultural_note
  - marker: b
    text: 「アジア州沿岸の港々へ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: 船に乗り込み
  rationale: 航海の文脈で船に乗ることを表す分詞。主動詞「出航した」に先立つ動作として自然に示した。
- source_word: δὲ
  choice: そこで
  rationale: 強い対比ではなく物語の進行と前節からのつながりを示すため、自然な接続表現とした。
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: アドラミティオンの船
  rationale: 形容詞は船の所属地または出港地を示す。「アドラミティオン船」より一般読者に分かりやすい属格表現を選んだ。
- source_word: μέλλοντι πλεῖν
  choice: 航行する予定の
  rationale: μέλλω＋不定詞が示す目前の予定・意図を、船の旅程として自然な日本語で表した。
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: アジア州の各地へ
  rationale: τόπουςを「各地」と訳し、κατάの地理的・分布的な意味を保った。航海上は沿岸の港々が想定されるが、それを本文で断定せず脚注に代案を示した。
- source_word: Ἀσίαν
  choice: アジア州
  rationale: 現代の大陸との混同を避け、ここで指されるローマ属州であることを簡潔に明示した。歴史地理の詳細は脚注で補った。
- source_word: ἀνήχθημεν
  choice: 出航した
  rationale: 港から沖へ船を出すことを表す定型的な航海用語であり、現代日本語では「出航した」が簡潔で自然。
- source_word: ὄντος σὺν ἡμῖν
  choice: も、私たちと一緒だった
  rationale: 属格独立構文が添える同伴の状況を独立文として自然に表現し、「も」によって同行者であることを示した。
- source_word: Ἀριστάρχου Μακεδόνος Θεσσαλονικέως
  choice: テサロニケ出身のマケドニア人アリスタルコ
  rationale: 地域名と都市名の関係を明確にしつつ、現代日本語として自然な同格表現にした。
theological_decisions: []
