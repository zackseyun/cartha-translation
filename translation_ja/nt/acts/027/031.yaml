id: ACT.27.31
reference: Acts 27:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: ja
  text: パウロは百人隊長と兵士たちに言った。「この人たちが船にとどまらなければ、あなたがたは助かることはできません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: 百人隊長
  rationale: ローマ軍の階級を表す、日本語聖書で定着した簡潔な訳語。
- source_word: οὗτοι
  choice: この人たち
  rationale: 直前に船から逃れようとしていた船員たちを指す。日本語として自然に指示対象を示しつつ、「船員」と明示して原文以上に限定することは避けた。
- source_word: μείνωσιν
  choice: とどまらなければ
  rationale: μένωの「その場にとどまる」という意味を、条件節に適した自然な日本語で表した。
- source_word: πλοίῳ
  choice: 船
  rationale: 航海中の大型船を指す文脈に合い、現代日本語で自然かつ明瞭。
- source_word: σωθῆναι
  choice: 助かる
  rationale: ここでは難船の危険から生き延びるという身体的救出を指す。「救われる」も可能だが、日本語では神学的救済と受け取られやすいため、文脈上の意味を明瞭にした。
- source_word: οὐ δύνασθε
  choice: 助かることができません
  rationale: 能力・可能性の否定を直接保ち、警告の強さを伝える。単に「助かりません」とするより δύνασθε を明示的に反映する。
theological_decisions:
- issue: σωθῆναι が身体的救助を指すか、より広い「救い」を指す語形を保つか
  choice: 助かる
  alternative: 救われる
  rationale: σῴζω は広く「救う」を意味するが、直近の文脈は難船からの生存である。日本語の「救われる」が帯びやすい永遠の救済という含意を不用意に招かず、ここでの具体的意味を自然に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、パウロの切迫した警告を直接的かつ品位ある文体で表現した。
