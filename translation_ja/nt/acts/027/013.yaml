  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: ja
  text: 南風が穏やかに吹き始めると、彼らは自分たちの意図どおりになったと考え、錨を上げて[a]、クレタ島に沿って、より岸近くを航行した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「持ち上げて」。航海の文脈では、錨を上げて出航することを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: 穏やかに吹き始めた
  rationale: ὑποπνέωが表す風の弱く穏やかな吹き方を示し、文脈上の開始のニュアンスも自然な日本語で表した。
- source_word: νότου
  choice: 南風
  rationale: νότοςはここでは南から吹く風を指す。日本語では不定冠詞に相当する表現を加えず、「南風」とするのが自然である。
- source_word: δόξαντες
  choice: 考え
  rationale: 外見ではなく、一行の主観的な判断を表しているため、平明な「考え」とした。
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: 思惑どおりになった
  rationale: 直訳的には自分たちの意図・計画を掌握した、すなわち実現できる状況を得たとの判断を表す。「思惑どおりになった」は、好都合な風を得て計画を遂行できると見込んだ文脈を簡潔に伝える。
- source_word: ἄραντες
  choice: 錨を上げて
  rationale: αἴρω自体は「持ち上げる」だが、この航海文脈では省略された目的語である錨を上げて出航することを指す。
- source_word: ἆσσον
  choice: 海岸近く
  rationale: 比較的な近さを表す副詞であり、沿岸航行の文脈では岸に近い航路を取ったことを示す。
- source_word: παρελέγοντο τὴν Κρήτην
  choice: クレタ島の海岸近くを航行した
  rationale: παραλέγομαιの航海用法は海岸に沿って進むことを表す。目的語は文字どおりには「クレタ島」だが、日本語では「海岸近く」として沿岸航行を明確にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な叙述体としつつ、航海場面にふさわしい「錨」「航行」を用いた。「思惑どおりになった」は、風を得て自分たちの計画が実現可能になったと船員たちが判断したことを自然に表す。
