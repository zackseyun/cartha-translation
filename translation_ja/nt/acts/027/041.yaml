  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: ja
  text: ところが、二つの海が出会う場所[a]に入り込んで、彼らは船を座礁させた。船首はしっかりと食い込んで動かないままであったが、船尾は激しい力によって壊れていった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二つの海の間にある場所」。このギリシア語表現は珍しく、水路、砂州、または二つの水域や潮流が出会う場所を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: 乗り上げ
  rationale: 不意に不利な場所へ行き当たった状況を示す分詞。後続の座礁とのつながりを自然な日本語で表しつつ、衝突などに限定しない。
- source_word: τόπον διθάλασσον
  choice: 二つの海が出会う場所
  rationale: 稀なδιθάλασσοςの「二つの海に関わる」という像を保ち、砂州や水路と断定しない。語義の不確かさは脚注で示す。
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: 船を座礁させてしまった
  rationale: ἐπικέλλωの航海用語としての意味を、現代日本語で明瞭に表す。「しまった」は意図的な浜揚げではなく、危機的状況での結果であることを自然に示す。
- source_word: πρῷρα
  choice: 船首
  rationale: 船の前部を表す標準的で分かりやすい航海用語。
- source_word: ἐρείσασα
  choice: 突き刺さったまま
  rationale: 船首が固く食い込んで固定された状態を具体的かつ自然に表す。
- source_word: ἔμεινεν ἀσάλευτος
  choice: 動かなくなった
  rationale: 船首が固定され、動かない状態が続いたことを明快な現代日本語で示す。
- source_word: πρύμνα
  choice: 船尾
  rationale: 船の後部を表す標準的な航海用語。
- source_word: ἐλύετο
  choice: 壊れ始めた
  rationale: 未完了過去の進行的な解体・崩壊を表す。完全に壊れたと断定せず、進行中の過程を示す。
- source_word: ὑπὸ τῆς βίας
  choice: 激しい力を受けて
  rationale: βίαの「力・激しさ」を保持し、ギリシア語本文に明示されない「波」を本文へ補わない。文脈上の力の由来は理解可能である。
