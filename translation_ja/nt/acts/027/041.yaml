    rationale: περιπεσόντες はその場所に不意に遭遇・入り込む状況を、ἐπέκειλαν は船を座礁させる行為を表す。「乗り上げ」は後者を先取りして二重にし、「しまった」は原文にない評価的含意を加える。
  - severity: low
    issue: 「壊れ始めた」
    rationale: ἐλύετο は未完了形で、船尾が壊されつつある、または壊れていく継続的過程を描く。「壊れていった」は進行性をより直接的に示す。
