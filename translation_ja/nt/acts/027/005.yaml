  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: ja
  text: キリキアとパンフィリアの沖合の外海を航行して[a]、私たちはリキアのミラに着いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリキアとパンフィリアに沿う外海を航行して」。この表現は、両地域の海岸に沿った、またはその沖合の航路を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「リキアのミラに下った」。ギリシア語の動詞は字義的には「下った」を意味するが、旅行の文脈では到着を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: 外海
  rationale: 一般的な「海」よりも、陸地から離れた開けた海域を指す語感を簡潔に表す。
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: キリキアとパンフィリアに沿う
  rationale: 地理的用法のκατάは、これらの地域の海岸沿い、またはその沖を進む航路を示す。本文では自然な日本語として「に沿う」とし、別訳を脚注に示す。
- source_word: διαπλεύσαντες
  choice: 航行し
  rationale: アオリスト分詞が主動詞に先立つ航海を表すため、連用形によって「航行した後、ミラへ下った」という順序を自然に伝える。
- source_word: κατήλθομεν
  choice: 私たちは…へ下った
  rationale: 移動・到着を表し得る動詞だが、原文の方向感覚を残して「下った」と訳す。通常の到着表現は脚注に示す。
- source_word: Μύρα τῆς Λυκίας
  choice: リキアのミラ
  rationale: 属格がミラの属する地域を示すため、日本語で自然な地名表現とした。
- source_word: τε
  choice: 訳語を明示しない
  rationale: 前節との緩やかな接続を示す小辞であり、日本語では文脈と文の流れによって十分に表される。
