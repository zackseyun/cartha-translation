  text: ところが、間もなく、「エウラクィロン」と呼ばれる暴風が、その島から激しく吹き下ろしてきた。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「エウロクリュドン」となっている。
    reason: textual_variant
  - marker: b
    text: 「猛烈な北東風」とも訳せる。この名は北東から吹く嵐の風を指すと考えられるが、ギリシャ語本文では固有名として示されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: 間もなく
  rationale: 短い時間の後を表す慣用的な時間表現を、簡潔で自然な現代日本語にした。
- source_word: δὲ
  choice: ところが
  rationale: 物語を進めつつ、直前の順調な航行から事態が急変する対照を自然に示す。
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: その島から激しく吹き下ろしてきた
  rationale: 風が高地のあるクレタ島側から船へ激しく下って来たという文脈上有力な理解を採用した。動詞の勢いは「激しく」で表したが、κατάと代名詞の関係には別解もあるため脚注に残した。
- source_word: ἄνεμος τυφωνικὸς
  choice: 台風のような風
  rationale: τυφωνικόςが表す旋風を伴う猛烈な嵐の性質を、現代の厳密な気象区分と同一視せず、分かりやすく比喩的に表した。
- source_word: ὁ καλούμενος
  choice: と呼ばれる
  rationale: 名称を導入する標準的な分詞表現を自然な日本語にした。
- source_word: Εὐρακύλων
  choice: エウラクィロン
  rationale: SBLGNT本文の固有名詞を翻訳語に置き換えず、ギリシャ語の形に即して音写した。
