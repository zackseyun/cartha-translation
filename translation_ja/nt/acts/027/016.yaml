  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: ja
  text: しかし、カウダ[a]と呼ばれる小島の風下側に回り込んだ後、私たちはかろうじて船の小舟を確保することができた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「カウダと呼ばれる小島の陰を通過した後」。ギリシア語は、風を避けられる島の風下側へ進むことを表す航海用語を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: 小島
  rationale: νησίονの指小的な語感を簡潔で自然な現代日本語で表す。「ある」は日本語では必須でなく、ここでは省いても不定性は保たれる。
- source_word: δέ
  choice: しかし
  rationale: 穏やかな場面転換と、嵐の中で一時的に島陰へ入ったこととの対照を示す。
- source_word: ὑποδραμόντες
  choice: 陰に入るように航行した後
  rationale: 航海用語として、風を避けられる島の風下側へ進んだ意味を、過度に専門的にならない形で示す。別訳を脚注に残す。
- source_word: καλούμενον Καῦδα
  choice: カウダと呼ばれる
  rationale: 島名を示す分詞表現を素直に訳した。固有名は本文系に従い「カウダ」と音写する。
- source_word: ἰσχύσαμεν μόλις
  choice: ようやく…することができた
  rationale: 大きな困難を伴いながら、かろうじて実現したという意味を自然な日本語で表す。
- source_word: περικρατεῖς γενέσθαι
  choice: 確保する
  rationale: 小舟をつかまえて制御下に置くことを、この航海状況に合う簡潔な語で表す。
- source_word: τῆς σκάφης
  choice: 船の小舟
  rationale: 本船に付属し、おそらく曳航されていた小型艇を指すことが明確になる。「ボート」よりも本文の格調になじむ。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、航海上の動きを理解できる程度に明示した。「陰」は島が風よけになる意味であり、脚注でより専門的な「風下側」という別訳を示した。
