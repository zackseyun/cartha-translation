  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: ja
  text: しかし、その港は冬を越すのに適していなかったので、大多数は、何とかフェニクスに着き、そこで冬を越すことができればと考え、そこから出航することを決めた[a]。フェニクスは、南西と北西に面した[b]クレタ島の港である[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そこから沖へ出て」とも訳せる。ギリシャ語の動詞は、船が岸を離れて海へ出ることを表す航海用語。
    reason: lexical_alternative
  - marker: b
    text: 最後の方角を示す句の意味は確定しにくい。伝統的には「南西と北西に面した」と訳されるが、後者をより具体的に「西北西」と理解する見方もある。
    reason: lexical_alternative
  - marker: c
    text: フェニクスはクレタ島にあった港。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνευθέτου
  choice: 適していなかった
  rationale: 目的にかなわず不向きであることを表す。現代日本語として自然で、港そのものが使用不能だったという過度な意味を避ける。
- source_word: λιμένος
  choice: 港
  rationale: 航海記事における停泊地を自然かつ簡潔に表す。
- source_word: πρὸς παραχειμασίαν
  choice: 冬を越すのに
  rationale: その港に冬の間とどまる目的への適否を、明瞭な現代日本語で示す。
- source_word: οἱ πλείονες
  choice: 大多数の者
  rationale: 比較級の実詞的用法が示す、集団内のより多い側を表す。単なる「多くの者」より多数決的な文脈を明確にする。
- source_word: ἔθεντο βουλήν
  choice: 決めた
  rationale: 直訳的には「方針を立てた」だが、ここでは集団として結論を出したことを自然に表す。
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: そこから出航し
  rationale: ἀνάγωの航海上の用法を自然な日本語で表す。「沖へ出る」も可能なため脚注を付す。
- source_word: εἴ πως δύναιντο
  choice: 何とか…よう
  rationale: εἴ πωςと希求法が示す、不確実ながら実現を期待する含みを保持する。
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: フェニクスに着いて
  rationale: 目的地への到着を平明に表し、地名はギリシャ語の音に沿って転写する。
- source_word: παραχειμάσαι
  choice: そこで冬を越そう
  rationale: 目的として意図された越冬を表す。文脈上の意志を自然な日本語の「よう」で示す。
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: 南西と北西に面した
  rationale: 港の向きに関する伝統的理解を本文に採る。ただしχῶροςの厳密な方角と地形上の解釈には不確実性があるため脚注で明示する。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。航海用語は専門的になりすぎない「出航」を用い、εἴ πωςと希求法の不確実な期待は「何とか…よう」で保った。原文の長い一文は、地名説明を独立文にして読みやすくした。すべての脚注記号を該当箇所に配置した。
