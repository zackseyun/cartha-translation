  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: ja
  text: 数日たって、アグリッパ王とベルニケは、フェストに挨拶するためカイサリアに到着した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: 数日たって
  rationale: 属格独立構文による時間的背景を、現代日本語で自然かつ簡潔に表した。δέの軽い接続の働きは文脈上明らかであり、独立した接続詞を加えない。
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: アグリッパ王
  rationale: 実際の王号を保持しつつ、日本語で自然な「固有名＋王」の語順とした。
- source_word: Βερνίκη
  choice: ベルニケ
  rationale: ギリシア語の音形に沿った、日本語聖書で通用する表記を採用した。英語で生じるBernice/Bereniceの綴りの違いは、日本語訳では注記を要しない。
- source_word: κατήντησαν
  choice: 到着した
  rationale: 目的地に至る移動を表す文脈で、アオリストの出来事を自然に表す。
- source_word: εἰς Καισάρειαν
  choice: カイサリアに
  rationale: 移動の到達先を示すεἰςを、日本語の到着構文に合う助詞「に」で表した。
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: フェストに挨拶するため
  rationale: 分詞が表す付帯状況ないし目的のうち、到着の意図を自然に示す読みを採用した。「表敬訪問する」は宮廷的含意を加えすぎるため避けた。
- source_word: Φῆστον
  choice: フェスト
  rationale: ローマ人総督の名として定着した日本語音写を用いた。
