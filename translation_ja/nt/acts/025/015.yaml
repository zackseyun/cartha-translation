id: ACT.25.15
reference: Acts 25:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: ja
  text: この人のことについては、私がエルサレムに着いたとき、祭司長たちとユダヤ人の長老たちが私に訴え出て、彼に対する有罪判決を求めました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼に対する断罪」または「彼を有罪とする判決」。
    reason: καταδίκηは、彼に不利な司法上の有罪判断・断罪を指す。
lexical_decisions:
- source_word: περὶ οὗ
  choice: この人のことについては
  rationale: 直前から話題となっているパウロを指す関係表現を明示し、日本語の談話として自然な主題提示にした。
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: 私がエルサレムに着いたとき
  rationale: 属格独立構文の時を表す働きと、γίνομαι＋εἰςが示す到着の意味を明瞭に表した。
- source_word: ἐνεφάνισαν
  choice: 私に訴え出て
  rationale: 権力者に案件を申し立てる法的・行政的文脈を自然に表す。「知らせた」よりも、後続する有罪判決の要求とのつながりが明確である。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 単独の大祭司ではなく、祭司階級の指導者たちを指す標準的な訳語。
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: ユダヤ人の長老たち
  rationale: 属格がどの共同体の長老かを限定していることを、原文に沿って表した。
- source_word: αἰτούμενοι
  choice: 求めました
  rationale: 主動詞に伴う要求行為を、現代日本語で簡潔かつ明瞭に表した。
- source_word: κατ’ αὐτοῦ
  choice: 彼に対する
  rationale: 法的措置がパウロに向けられた敵対的なものであることを表した。
- source_word: καταδίκην
  choice: 有罪判決
  rationale: 単なる非難ではなく司法上の不利な判断を求めたという法的意味を自然な日本語で示す。刑罰そのものまで特定しない。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、フェストゥスによる公的な弁明にふさわしい端正さを保った。「訴え出て」「有罪判決」により法的文脈を自然に示した。
