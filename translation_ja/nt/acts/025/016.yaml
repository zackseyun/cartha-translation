  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: ja
  text: 私は彼らに、ローマ人の慣例では、告発された者が告発者たちと直接対面し、その告発について弁明する機会を得るまでは、だれであれ引き渡すことはない、と答えました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「引き渡す」は、「だれかを好意として与える」とも訳せる。ギリシア語の動詞には、告発者の求めに応じて人を引き渡すという意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: 慣例
  rationale: 確立された慣行を表し、法的・行政的文脈にも自然に合う。
- source_word: Ῥωμαίοις
  choice: ローマ人の
  rationale: 与格を、ローマ人に属する司法上の慣例として自然な日本語で表した。
- source_word: χαρίζεσθαί
  choice: 引き渡す
  rationale: 要求に応じて人を恩恵として渡すという文脈上の意味を、司法場面で明瞭に表す。語に含まれ得る『好意として与える』という含意は脚注に残した。
- source_word: τινα ἄνθρωπον
  choice: だれであれ
  rationale: この法的文脈では不定・一般的な人を指すため、性別を不必要に限定せず自然に表した。
- source_word: ὁ κατηγορούμενος
  choice: 訴えられた者
  rationale: 告発を受けている当事者を表す分詞を、過度に専門的でない法的表現で訳した。
- source_word: κατὰ πρόσωπον
  choice: 直接対面し
  rationale: 告発者と本人が面と向かうことを表す慣用句の力を、自然な現代日本語で伝える。
- source_word: τόπον τε ἀπολογίας λάβοι
  choice: 弁明する機会を得る
  rationale: τόποςの比喩的な『機会』と、ἀπολογίαの法的な自己弁護を簡潔に表した。
- source_word: περὶ τοῦ ἐγκλήματος
  choice: その訴えについて
  rationale: ἔγκλημαの法的な告発・訴因を、一般読者にも分かりやすい『訴え』で表した。
