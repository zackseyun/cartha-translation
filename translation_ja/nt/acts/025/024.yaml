  - severity: low
    issue: 呼びかけの接続と「群衆全体」の語順
    rationale: 「また、」および「ユダヤ人の群衆全体」は不自然ではないが、現代標準日本語の公的発話として「ならびに」「ユダヤ人の全群衆」のほうが滑らかである。
