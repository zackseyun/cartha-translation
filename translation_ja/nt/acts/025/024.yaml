  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: ja
  text: フェストは言った。「アグリッパ王、ならびに私たちと共に出席しておられる皆さん、この男をご覧ください。この男のことで、ユダヤ人の全群衆が、エルサレムでもここでも私に訴え出て、もはや生きていてはならないと叫んでいるのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησιν
  choice: 言った
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、現代日本語の物語では過去形が自然であり、出来事の時制を明確に伝える。
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: 私たちと共にここにおられる皆さん
  rationale: 共同の臨席を表す分詞を保ちつつ、ἄνδρεςの呼びかけを、現代日本語の公的な場にふさわしい自然な敬称で表した。
- source_word: θεωρεῖτε τοῦτον
  choice: この男をご覧ください
  rationale: 直説法の形だが、フェストが一同の注意をパウロへ向ける発言として、日本語では丁寧な提示表現が自然である。
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: ユダヤ人の群衆全体
  rationale: πλῆθοςの集合的な『群衆』とἅπανの全体性をともに表し、すべてのユダヤ人個人を例外なく指す表現にはしなかった。
- source_word: ἐνέτυχόν μοι
  choice: 私に訴え出て
  rationale: 権力者に申し立てを行う法的・公的な文脈を、現代日本語で明瞭に表す。
- source_word: βοῶντες
  choice: 叫んだ
  rationale: 大声で強く要求したという語の鮮明さを簡潔に保持する。
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: もう生かしておくべきではない
  rationale: δεῖの必要・当然性とμηκέτιの『もはや～ない』を保ち、処刑という具体的手段までは補わない。
theological_decisions:
- issue: 敵対的な法廷文脈における「ユダヤ人」への言及
  choice: τῶν Ἰουδαίωνを「ユダヤ人」と訳し、πλῆθοςを「群衆」として集合的な反対勢力を示す
  alternative: 「すべてのユダヤ人」または「ユダヤ人指導者たち」
  rationale: 原文の民族・政治的名称を狭めたり言い換えたりせず保持する一方、フェストの集合的・修辞的な要約を、全ユダヤ人への普遍的断定として読ませないため。
- issue: 死を求める主張の強さ
  choice: 「もう生かしておくべきではない」
  alternative: 「もう生きていてはならない」
  rationale: δεῖが表す必要・当然性を保ちつつ、明示されていない法的判決や処刑方法を訳文に持ち込まない。
translation_notes:
  register: 公的な聴聞の場にふさわしい、明瞭で丁寧な現代標準日本語。王への敬称と会衆への呼びかけを自然にしつつ、フェストの発言の強い調子を保持した。
