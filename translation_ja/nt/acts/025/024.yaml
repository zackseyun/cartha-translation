revisions:
- from: フェストは言った。「アグリッパ王、また、私たちと共にここにおられる皆さん、この男をご覧ください。この男のことで、ユダヤ人の群衆全体が、エルサレムでもここでも私に訴え出て、もう生かしておくべきではないと叫んだのです。」
  to: フェストは言った。「アグリッパ王、ならびに私たちと共に出席しておられる皆さん、この男をご覧ください。この男のことで、ユダヤ人の全群衆が、エルサレムでもここでも私に訴え出て、もはや生きていてはならないと叫んでいるのです。」
  rationale: 原文の歴史的現在φησινは、現代日本語の叙述として自然な過去形「言った」とした。一方、発言内の現在形θεωρεῖτεに対する提示表現「ご覧ください」と、現在の場での発言を表す「叫んでいる」は保持した。死を求める句は、他者が生存を許すという含みを避け、「もはや生きていてはならない」と改めた。脚注を必要とする本文上の曖昧さや本文アンカーはない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:40Z'
