  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: ja
  text: しかし私は、これらの事柄についての審理をどう進めるべきか判断に迷ったので、エルサレムへ行き、そこでこれらの件について裁判を受けることを望むかどうか、彼に尋ねました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし私は、これらの事柄をめぐる論争の扱いに困っていたので、彼に、エルサレムへ行って、そこでこれらの件について裁かれる意思があるかどうか尋ねました。」
    reason: ζήτησιςは「審理」のほか「論争」「問題」とも取れ、βούλοιτοは「望む」だけでなく「意思がある」とも訳せるため。
lexical_decisions:
- source_word: ἀπορούμενος
  choice: 判断に迷ったので
  rationale: この分詞は当惑・不確かさを表し、文脈上は後続する問いの理由を示す。自然な日本語で因果関係も明示した。
- source_word: τὴν περὶ τούτων ζήτησιν
  choice: これらの事柄をどう審理すべきか
  rationale: ζήτησιςは問い、論争、調査・審理を表し得る。司法的文脈を踏まえて「審理」とし、不自然な「これらについての審理に迷う」を避けるため、意味を保って疑問節として表現した。
- source_word: ἔλεγον εἰ βούλοιτο
  choice: 望むかどうか、彼に尋ねました
  rationale: ἔλεγονは字義的には「言っていた」だが、εἰ以下が間接疑問なので、日本語では「尋ねた」が明確。βούλοιτοの意志・希望を「望む」で表した。
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: エルサレムへ行き
  rationale: 移動を表す一般的な動詞として簡潔かつ自然に訳し、地名は慣用表記を用いた。
- source_word: κἀκεῖ κρίνεσθαι περὶ τούτων
  choice: そこでこれらの件について裁判を受ける
  rationale: κρίνεσθαιは司法的に裁かれることを指す。この場面では「裁判を受ける」が現代日本語として明確であり、περὶ τούτωνの反復も保持した。
theological_decisions: []
