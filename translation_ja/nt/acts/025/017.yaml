  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: ja
  text: そこで、彼らがここに集まったとき、私は少しも延期せず、翌日、裁判席に着き[a]、その男を連れて来るよう命じました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「法廷の壇上に座って」とも訳せる。ギリシア語のβῆμαは、裁判を行う者が着く公式の裁判席、またはその席が設けられた壇を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων οὖν ἐνθάδε
  choice: そこで、彼らがここに集まって来ると
  rationale: 属格独立構文を自然な時の節として訳し、οὖνの談話上のつながりを「そこで」で示した。ἐνθάδεは場所を表す「ここに」とした。
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: 私は少しも先延ばしにせず
  rationale: 訴訟手続きを延期しなかったという慣用的な意味を、明瞭な現代日本語で表した。
- source_word: τῇ ἑξῆς
  choice: 翌日
  rationale: 文脈上、直後の日を指す時間表現として簡潔に訳した。
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: 裁判席に着いて
  rationale: βῆμαはこの文脈では長官が裁判を行う公式の席または法廷壇を指す。「裁判席に着く」は行為と司法的背景を自然に伝える。
- source_word: ἐκέλευσα ἀχθῆναι
  choice: 連れて来るよう命じました
  rationale: 公的命令を表すἐκέλευσαと、ἄγωの受動不定詞を、日本語では使役の対象を省いた自然な命令表現で示した。
- source_word: τὸν ἄνδρα
  choice: その男
  rationale: パウロを指す既知の人物であることを「その」で示しつつ、「被告」など原文に明示されない情報は加えなかった。
