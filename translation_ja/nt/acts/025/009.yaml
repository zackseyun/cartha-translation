  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: ja
  text: しかし、フェストはユダヤ人たちに便宜を図ろうとして[a]、パウロに答えて言った。「エルサレムに上り、そこでこれらの件について、私の前で裁判を受けたいか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ユダヤ人たちに好意を示そうとして」。文脈上、フェストがパウロを訴えていたユダヤ人側の指導者や告発者に便宜を図ろうとしたことを表す。ここで「ユダヤ人たち」は、すべてのユダヤ人を一括して指すものではない。
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 「私の前で裁かれたいか」または「私の前で審理を受けたいか」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: しようとして
  rationale: 現在分詞が表すフェストの動機を、自然な現代日本語で示す。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たち
  rationale: 原文の広い民族・宗教的呼称を保持する。ただし文脈上は、訴えを進めていたユダヤ人側の指導者・告発者を指すことを脚注で明確にする。
- source_word: χάριν καταθέσθαι
  choice: 歓心を買おうとして
  rationale: 好意を与えて相手の支持や好感を得ようとする法廷政治上の含意を簡潔に表す。「取り入ろうとして」ほど露骨に不純な動機を断定しない。
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: パウロに答えて言った
  rationale: 原文の応答を導く叙述形式を保つ。日本語ではやや重複的だが、明瞭で聖書叙述として自然な範囲にある。
- source_word: Θέλεις
  choice: 受けたいか
  rationale: 後続する不定詞と合わせ、パウロの意向を直接尋ねる問いとして自然に訳す。
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: エルサレムへ上り
  rationale: 地理的・慣用的な『上る』を保持する。
- source_word: περὶ τούτων
  choice: これらの件について
  rationale: 係争中の事柄を指す広い表現を保ち、「告発」など原文にない限定を避ける。
- source_word: κριθῆναι
  choice: 裁判を受ける
  rationale: 司法的文脈での受動形を、現代日本語で明確かつ自然に表す。「裁かれる」よりも有罪判決の含みが弱い。
- source_word: ἐπ’ ἐμοῦ
  choice: 私の前で
  rationale: フェストの面前または権限下で審理される意味を保ち、彼が単独で判決するとの限定を避ける。
theological_decisions:
- issue: 「ユダヤ人たち」の反ユダヤ的な一般化としての誤読
  choice: 本文では原語 τοῖς Ἰουδαίοις に対応する「ユダヤ人たち」を保持し、脚注で文脈上の指示対象を限定する。
  alternative: ユダヤ人の指導者たち／ユダヤ人の告発者たち
  rationale: 原文の語を解釈的に狭めずに訳しつつ、すべてのユダヤ人を一括して指すとの誤読を防ぐ。
- issue: フェストが担う司法上の役割
  choice: 「私の前で」とし、面前または権限下という幅を保持する。
  alternative: 私によって／私の権限のもとで
  rationale: ἐπ’ ἐμοῦ が、フェスト自身による裁定か、彼が主宰する審理かを厳密には限定しないため、曖昧さを残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。法廷場面であることが伝わるよう κριθῆναι は「裁判を受ける」とした。語順は原文の展開をおおむね保ちつつ、日本語として自然になるよう問いの中心を末尾に置いた。
