  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: ja
  text: そこでフェストは言った。「あなたがたのうち有力な者たちは、私と一緒に下って行き、もしその男に何か非があるなら、彼を訴えなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὖν
  choice: そこで…者たちが
  rationale: οὖνは直前の発言を受けた推論・展開を示すため、自然な物語文として「そこで」とした。定冠詞は形容詞 δυνατοί を名詞化する働きとして構文全体で表した。
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: あなたがたのうち、力のある者たち
  rationale: δυνατοίには「有力な」「権限のある」「能力のある」の幅がある。「力のある」はその曖昧さを比較的保ち、単に旅行可能な者とも社会的有力者とも断定しない。文脈上は代表として告発できる者たちを指す。
- source_word: φησίν
  choice: フェストは言った
  rationale: 歴史的現在の挿入句「彼は言う」を、日本語の物語として自然な過去形の発話導入に明示した。話者名は文脈からフェストである。
- source_word: συγκαταβάντες
  choice: 私と一緒に下って行き
  rationale: σύνの共同性を「私と一緒に」で示し、エルサレムからカイサリアへ向かう慣用的な地理表現 καταβαίνω を「下って行く」とした。完了後に主動詞へつながる分詞は日本語の連用形で表した。
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: もしあの男に何か不正があるなら
  rationale: 条件と不定性を保ち、ἄτοπονを犯罪と断定しすぎない「不正」とした。ἐν τῷ ἀνδρίは日本語では「男に…ある」と自然に表現し、法律上の訴因そのものへ意味をずらさないようにした。定冠詞を伴う距離のある言及は「あの男」とした。
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: 告発しなさい
  rationale: 三人称複数の命令を、発話相手への自然な日本語の命令として表現した。κατηγορέωの法的文脈を「告発する」で示し、対象は直前の「あの男」から明白なため重複を避けた。
theological_decisions: []
