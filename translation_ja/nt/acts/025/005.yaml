- from: そこでフェストは言った。「あなたがたのうち、力のある者たち[a]が私と一緒に下って行き、もしあの男に何か不正があるなら、告発しなさい[b]。」
  to: そこでフェストは言った。「あなたがたのうち有力な者たちは、私と一緒に下って行き、もしその男に何か非があるなら、彼を訴えなさい。」
  rationale: 原文の三人称複数命令の構造を日本語で明確にし、τῷ ἀνδρίに「あの」という原文にない指示性を加えないよう改めた。有力さ・権限・能力の間にあるδυνατοίの語義上の幅は、本文で文脈に適した訳語を選び、脚注で保持した。脚注bのアンカーは、対象を明示した「彼を訴えなさい」の直後に置く。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:32Z'
review_pass:
  verdict: revise
  source_fidelity: 動詞κατηγορείτωσανは三人称複数の命令（「彼らに告発させよ／彼らは訴えるがよい」）である。本文の「告発しなさい」は日本語では発話相手である「あなたがた」への二人称命令となり、ギリシア語の「あなたがたの中の有力な者たち」を主語とする構文がやや曖昧になる。また、定冠詞つきのτῷ ἀνδρίを「あの男」とする根拠は薄く、「その男」がより忠実である。δυνατοίはこの行政・法的文脈では「有力な者たち」が最も自然だが、脚注で能力・権限の含みを保持する。
  naturalness: 「あなたがたのうち有力な者たちは、私と一緒に下って行き、……彼を訴えなさい」は、現代標準日本語として明瞭で、引用内の命令の対象と行為者も自然に伝える。「何か非があるなら」はἄτοπονの広い意味を保ち、「不正」よりも特定の不正行為や不公正という含みを避けられる。
  terminology: κατηγορέωは法的な訴追・告発を指すため、本文では自然な法的表現「訴える」を用いた。脚注に「告発する」を代案として示す。δυνατοίを「有力な者たち」としつつ、社会的地位・権限・能力のいずれかに限定しないことを脚注で明記する。
  issues:
  - severity: medium
    issue: 「告発しなさい」が二人称命令として読める。
    rationale: κατηγορείτωσανは三人称複数命令であり、「あなたがたのうち有力な者たち」が告発する主体であることを日本語でも明確にする必要がある。
  - severity: low
    issue: 「あの男」が原文以上の指示的・距離的なニュアンスを加える。
    rationale: τῷ ἀνδρίは定冠詞つきの「その男」であり、指示詞「あの」を要求しない。
  - severity: low
    issue: 「力のある者たち」は日本語では身体的な力も想起させ、行政・法廷場面ではやや不自然である。
    rationale: δυνατοίの語義の幅は脚注で保留しつつ、文脈上自然な「有力な者たち」とするのがよい。
  revised_text: そこでフェストは言った。「あなたがたのうち有力な者たちは、私と一緒に下って行き、もしその男に何か非があるなら、彼を訴えなさい。」
  revised_footnotes:
  - marker: a
    text: 「有力な者たち」は、「権限のある者たち」「力のある者たち」または「能力のある者たち」とも訳せる。ギリシア語は、権力、社会的地位、または能力を表しうる。
    reason: lexical_alternative
