source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: ja
  text: そこで翌日、アグリッパとベルニケは、たいへん華やかに[a]、千人隊長たちと町の有力者たち[b]とともに審問の場に入った。フェストゥスの命令で、パウロが連れて来られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大いに華美を尽くして」。
    reason: φαντασίαには、公の場での華やかな見せ方、壮観、または仰々しい演出という含みがあるため。
  - marker: b
    text: 別訳「町の名士たち」「町の主だった人々」。
    reason: κατ’ ἐξοχήνは、その町で際立った地位や名望を持つ人々を表すため。
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: そこで翌日
  rationale: 時間を表す与格句を自然な日本語で「翌日」とし、οὖνは物語の進行と前節からのつながりを示す「そこで」で表した。
- source_word: ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης
  choice: アグリッパとベルニケは……やって来て
  rationale: 属格絶対構文を日本語の連用表現に改め、両者が来場した動きを明確にした。固有名詞は日本語で定着した音写を用いた。
- source_word: μετὰ πολλῆς φαντασίας
  choice: たいそう華やかな威儀をもって
  rationale: φαντασίαがここで表す、公の場における華美で堂々とした見せ方を訳出した。「威儀」に「華やかな」を添え、単なる威厳ではなく外面的な華やかさを保った。
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: 謁見の間に入った
  rationale: ἀκροατήριονは公式に話を聞くための会場を指す。この場面の王侯・総督を交えた公的会見に合い、現代日本語でも理解しやすい「謁見の間」とした。
- source_word: σύν τε χιλιάρχοις
  choice: 千人隊長たち……とともに
  rationale: χιλίαρχοςはローマ軍の高級将校を指すが、原語の位階を反映する聖書用語として明瞭な「千人隊長」を採用した。τεは後続するもう一つの集団との並列を「や」で自然に示した。
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: 町の有力者たち
  rationale: κατ’ ἐξοχήνの「際立った地位にある」という意味を、自然で簡潔な「有力者」で表した。ἀνδράσινの男性複数は、日本語では文脈上人物集団として無標に表現した。
- source_word: κελεύσαντος τοῦ Φήστου
  choice: フェストゥスが命じると
  rationale: 属格絶対構文を、命令に続いて直ちにパウロが連行された流れを示す自然な時間表現にした。
- source_word: ἤχθη ὁ Παῦλος
  choice: パウロが連れて来られた
  rationale: ἄγωの受動態が示す、他者に伴われて入場させられたことを明確にした。単なる自発的な入場とはしなかった。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語の一文は、内容上の転換点で二文に分け、公式な場面の荘重さと物語の読みやすさを両立させた。
