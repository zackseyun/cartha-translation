  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: ja
  text: さて、フェストゥスは属州に入ってから[a]三日後、カイサリアからエルサレムへ上った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「属州に到着してから」または「属州の統治に着任してから」。ギリシア語の表現は、フェストゥスが属州に入ったことを指し、統治を開始したことも含意し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: さて
  rationale: 前の文脈を受けて物語を進める接続語。強い因果関係を加えず、現代日本語で自然な叙述の流れを示す。
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: 属州に入ってから
  rationale: 分詞の時間的関係と「足を踏み入れる、入る」という基本義を保つ。属州への到着だけでなく、統治への着任を含意し得るため、その幅は脚注で示す。
- source_word: ἐπαρχείᾳ
  choice: 属州
  rationale: ローマ帝国の行政区を指す歴史的に適切な標準訳。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 三日後
  rationale: 対格を伴う μετά の時間的用法を、簡潔で自然な日本語にした。
- source_word: ἀνέβη
  choice: 上った
  rationale: エルサレムの標高と、同地へ向かう際の慣用的な移動表現を保持する。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムへ
  rationale: 目的地を示す自然な日本語。
- source_word: ἀπὸ Καισαρείας
  choice: カイサリアから
  rationale: 出発地点を明確に示す。
- source_word: Φῆστος
  choice: フェストゥス
  rationale: ギリシア語名 Φῆστος の標準的な日本語音写。
