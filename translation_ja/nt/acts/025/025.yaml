  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: ja
  text: しかし私は、彼が死に値することを何もしていないと判断しました。しかし、彼自身が皇帝[a]に上訴したため、彼を送ることに決めました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アウグストゥス」。ギリシア語の称号「セバストス」は、ここではローマ皇帝を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: 判断しました
  rationale: 審理を経てフェストが到達した司法上の認定を、現代日本語で自然に表す。正式な判決とまでは限定しない。
- source_word: μηδὲν ἄξιον αὐτὸν θανάτου πεπραχέναι
  choice: 彼が死に値することを何もしていない
  rationale: 対格＋不定詞を内容節として訳し、死刑に相当する行為がなかったという意味を、原文の広さを保って表す。
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: ところが、彼自身が…上訴したので
  rationale: 属格独立構文の事情・理由を示し、αὐτοῦ τούτουの強調を「彼自身」で保持する。δέは前文との展開上の対照を「ところが」で示す。
- source_word: τὸν Σεβαστόν
  choice: 皇帝
  rationale: Σεβαστόςはここではローマ皇帝を指す称号であり、現代の一般読者に指示対象が明確となる訳語を用いる。
- source_word: ἔκρινα πέμπειν
  choice: 彼を送ることに決めました
  rationale: ἔκριναの手続き上の決定を自然に表し、πέμπεινの目的語は文脈から「彼を」と補う。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、公的な場でのフェストの発言にふさわしい丁寧で dignified な文体として「です・ます」調を採用した。「死刑に値する」と限定せず「死に値する」として、原文の表現を保った。
