  to: そこで、祭司長たちとユダヤ人の有力者たちは、フェストゥスにパウロに対する訴えを申し立て[a]、彼にしきりに願い出た。
  rationale: 語順を調整して、パウロに対する訴えをフェストゥスへ申し立てたことと、続いてフェストゥスに願い出たことを明確にした。「パウロに対する訴えを申し立てる」は、ἐνεφάνισανの法的文脈における含みを表しつつ、正式な告訴・起訴という特定の制度的行為には限定しない。「しきりに」はπαρεκάλουνの未完了形が示す継続・反復の含みを自然に補う。脚注も訳文の表現と整合するよう、代替訳の受け手をフェストゥスとして明示した。
