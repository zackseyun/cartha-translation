  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: ja
  text: そこで、祭司長たちとユダヤ人の有力者たちは、フェストゥスにパウロに対する訴えを申し立て[a]、彼にしきりに願い出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「パウロについて知らせて」「フェストゥスの前にパウロに対する訴えを持ち出して」。このギリシア語動詞は、ある事柄を権威者に知らせることを意味し、この文脈では法的な含みを持つと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: 訴え出て
  rationale: 権威者に事柄を申し立てる語であり、この文脈では κατὰ τοῦ Παύλου と結びついて法的・敵対的な含みを持つ。「告訴した」と形式を限定しすぎず、単なる「知らせた」以上の意味を表す。
- source_word: τέ
  choice: そこで
  rationale: 前節からの物語の流れを受ける接続辞。日本語では「そこで」が自然に展開を示す。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: エルサレムの祭司階級の指導者層を指す、新約聖書で定着した自然な訳語。
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: ユダヤ人の有力者たち
  rationale: πρῶτοι の社会的・政治的に高い地位を表し、単なる一般的な指導者より原文の含意を保つ。
- source_word: κατὰ τοῦ Παύλου
  choice: パウロを
  rationale: ἐνεφάνισάν を「訴え出る」と訳すため、その対象を日本語では目的語として表現した。原文の敵対的方向性は動詞との組み合わせに保持される。
- source_word: παρεκάλουν
  choice: 願い出た
  rationale: 総督に対する要請という文脈に適し、懇願から要請までを含み得る語の強さを自然に表す。未完了時制の継続的な働きは、次節へ続く文脈から理解できるため、不自然な補足は避けた。
- source_word: αὐτόν / αὐτῷ
  choice: フェストゥスに
  rationale: 二つの代名詞はいずれも文脈上フェストゥスを指す。日本語で指示対象を明確にし、重複を避けて一度明示した。
