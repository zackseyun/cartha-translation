id: ACT.25.10
reference: Acts 25:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: ja
  text: しかし、パウロは言った。「私はカエサルの法廷[a]に立っています。ここで裁かれるべきなのです。ユダヤ人に対して、私は何一つ不正を働いていません。あなたご自身もよくご存じのとおりです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「法廷」と訳したギリシア語は、公的な裁判官席、またはそこで開かれる裁判の場を指します。
    reason: lexical_alternative
  - marker: b
    text: 「よく」に当たる語は、直訳すれば「よりよく」です。
    reason: source_ambiguity
lexical_decisions:
- source_word: βῆμα
  choice: 法廷
  rationale: 公的な裁判官席そのものと、そこで営まれる司法の場の両方を指し得る。ここではローマ皇帝の権威に属する裁判の場を、現代日本語で明瞭に示す「法廷」とした。
- source_word: Καίσαρος
  choice: カエサルの
  rationale: 皇帝の称号として用いられているが、歴史的・法的なローマの背景とギリシア語の表現を保つため、「皇帝」と一般化せず「カエサル」とした。
- source_word: ἑστώς εἰμι
  choice: 私は…立っています
  rationale: 完了分詞とεἰμίによる迂言表現が示す、パウロの現在の法的立場を自然に表す。
- source_word: οὗ
  choice: ここで
  rationale: 直前の「カエサルの法廷」を受け、その法廷こそ裁判を受けるべき場だという主張を自然な日本語で示す。
- source_word: δεῖ κρίνεσθαι
  choice: 裁かれるべきなのです
  rationale: 法的手続き上の必要性と正当な管轄を表しつつ、原文の受動表現を保つ。
- source_word: οὐδὲν ἠδίκησα
  choice: 何一つ不正を働いていません
  rationale: 道徳的な加害と法的な違反の双方を含み得るἀδικέωの幅を保ちながら、明瞭で自然な日本語とした。
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: あなたご自身もよくご存じのとおりです
  rationale: καὶ σὺの強調を「ご自身も」で、強い認識を「よくご存じ」で表した。κάλλιονは形の上では比較級なので、その点を脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法廷での答弁にふさわしい端正さを保った。「カエサル」は歴史的称号として残し、パウロが現在その司法権のもとに立っているという原文の力点を維持した。
