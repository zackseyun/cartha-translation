  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: ja
  text: パウロは弁明して言った。「私は、ユダヤ人の律法に対しても、神殿に対しても、カエサルに対しても、何一つ罪を犯していません。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は、ユダヤ人の律法にも、神殿にも、カエサルにも、何一つ違反していません。」
    reason: ἥμαρτονは法廷の文脈では「違反する」「罪を犯す」の意味にも理解できるため。
lexical_decisions:
- source_word: τοῦ Παύλου ἀπολογουμένου
  choice: パウロは弁明して言った
  rationale: 属格独立構文が法廷でのパウロの応答を導入している。ἀπολογέομαι の法廷的意味を「弁明」で保ちつつ、ὅτι が導く発言内容へ日本語として自然につなげた。
- source_word: ὅτι
  choice: 「……」という直接話法
  rationale: ここでは弁明の内容を導く接続詞であり、日本語では引用符を用いた直接話法が明瞭で自然である。
- source_word: νόμον τῶν Ἰουδαίων
  choice: ユダヤ人の律法
  rationale: 属格構造を保ち、民族的・宗教的な含意を必要以上に限定しない標準的な表現とした。
- source_word: ἱερόν
  choice: 神殿
  rationale: 内陣だけでなく神殿域を指し得る語であり、文脈上は一般的な「神殿」が簡潔で適切である。
- source_word: Καίσαρα
  choice: 皇帝
  rationale: Καῖσαρ はこの法廷的・政治的文脈ではローマ皇帝を表す称号であり、現代日本語の読者に指示対象が明確になるよう訳した。
- source_word: τι ἥμαρτον
  choice: 何一つ罪を犯していません
  rationale: τι による包括的な否定を「何一つ」で示し、ἁμαρτάνω の道徳的語感を「罪を犯す」として保持した。完了的な結果を含むアオリストは、現在の弁明として自然な丁寧体で表した。
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ……に対しても、……に対しても、……に対しても
  rationale: 三項すべてに及ぶ否定を、日本語で明瞭かつ均衡の取れた反復構文にした。
theological_decisions:
- issue: ἥμαρτον の法的意味と道徳的意味
  choice: 罪を犯していません
  alternative: 違反をしていません／何も悪いことをしていません
  rationale: 文脈は法廷であるが、原語は一般に「罪を犯す」を意味する ἁμαρτάνω である。純粋な法律用語に狭めず、原語にある道徳的含意と法廷的緊張を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法廷での弁明にふさわしい端正さを保った。発言は丁寧体とし、三重の οὔτε を反復によって明示した。
