id: ACT.25.21
reference: Acts 25:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: ja
  text: しかし、パウロが皇帝[a]の裁決を受けるまで拘禁されるよう上訴したので、私は彼をカエサルのもとに送るまで拘禁しておくよう命じました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「尊厳者」。ギリシア語「セバストス」は、ローマ皇帝の称号「アウグストゥス」に相当する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: 上訴した
  rationale: ローマの司法上の文脈で、上位の権威に正式な審理を求める行為を表すため、「訴えた」よりも法的意味が明確な「上訴した」とした。
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: 拘禁される／拘禁しておく
  rationale: ここでは保護や監視ではなく、公的な身柄拘束を指す。同じ動詞の反復を保ちつつ、日本語として自然になるよう受動形と使役的表現を用いた。
- source_word: διάγνωσιν
  choice: 裁決
  rationale: 司法的な判断・決定を意味する語であり、「裁判」ほど手続きに限定せず、「判決」ほど最終的・有罪宣告的に響かない表現を選んだ。
- source_word: Σεβαστοῦ
  choice: 皇帝
  rationale: ここでは個人名ではなく、ローマ皇帝の称号「尊厳者（アウグストゥス）」を指す。本文では現代日本語で明瞭な「皇帝」とし、原語の称号を脚注に示した。
- source_word: ἀναπέμψω
  choice: 送る
  rationale: 上位の帝国権威のもとへ移送する意味だが、日本語では文脈上「送る」で方向と目的が十分明瞭である。
- source_word: πρὸς Καίσαρα
  choice: カエサルのもとに
  rationale: Καίσαρが皇帝の称号として用いられている歴史的表現を保持し、単なる方向ではなく人物のもとへの移送であることを自然に示した。
theological_decisions: []
translation_notes:
  register: フェストゥスによる公的な説明として、明瞭で dignified な現代標準日本語を用いた。「拘禁」を反復して原文の語彙的一貫性を保ち、「皇帝」と「カエサル」の使い分けも原文に従った。
