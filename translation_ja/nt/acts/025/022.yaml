  text: Ἀγρίππας δὲ πρὸς τὸν ⸀Φῆστον· Ἐβουλόμην καὶ αὐτὸς τοῦ ἀνθρώπου ἀκοῦσαι. ⸀Αὔριον, φησίν, ἀκούσῃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: ja
  text: そこでアグリッパはフェストに言った。「私自身も、その人の話を聞いてみたい。」[a] フェストは言う。「明日、彼の話を聞くことになる。」[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私も、その人の話を聞いてみたい」とも訳せる。καὶ αὐτόςは「私自身」を強調するとも、ほかの人に加えて「私も」という意味を強めるとも取れる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は歴史的現在の「言う」を用いている。「言った」と訳すこともできる。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「彼から聞く」。ここでは、その人が直接話すのを聞くという意味になり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Φῆστον
  choice: そこでアグリッパはフェストに言った
  rationale: δέを物語の進行を示す「そこで」とし、発話動詞が省略されたギリシア語の表現を日本語では自然に「言った」と補った。人名は慣用的に音写した。
- source_word: Ἐβουλόμην
  choice: 聞いてみたい
  rationale: 未完了過去形はここでは控えめな希望の表明として機能すると考え、現代日本語の自然な「～てみたい」で表した。単純な過去の願望と断定しない。
- source_word: καὶ αὐτὸς
  choice: 私自身も
  rationale: καίの付加的意味「も」とαὐτόςの強意「自身」の両方を保持し、アグリッパ自身も聞きたいという含みを表した。
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: その男の話を聞く
  rationale: 属格を伴うἀκούωは人の発言を直接聞く意味になり得るため、日本語では「その男の話を聞く」と自然に表した。司法的な「審問する」まで意味を限定しない。
- source_word: Αὔριον, φησίν
  choice: フェストは言う。『明日』
  rationale: φησίνの歴史的現在を「言う」として保持し、日本語で話者が明確になるよう「フェストは」を補った。
- source_word: ἀκούσῃ αὐτοῦ
  choice: その男の話を聞くことができます
  rationale: 未来形を文脈上の許可・機会を含む自然な日本語で表した。属格構文は「彼を聞く」ではなく「その男の話を聞く」とした。
