  text: そこでフェストゥスは、パウロはカイサリアで拘留されており、自分も間もなく出発する予定だ、と答えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: 拘留されており
  rationale: 受動不定詞で、囚人として監視下に置かれている状況を自然かつ明確に表す。
- source_word: ἐν τάχει
  choice: 間もなく
  rationale: 時間的に近いことを示す句を、現代日本語で簡潔に表す。
- source_word: ἐκπορεύεσθαι
  choice: 出発する
  rationale: その場所へ向けてフェストゥス自身が出向くことを表す文脈に適し、単なる「去る」より日本語として自然。
- source_word: εἰς Καισάρειαν
  choice: カイサリアで／そこへ
  rationale: 本文形の対格は、τηρεῖσθαιとの構文上「カイサリアで」と理解されるが、フェストゥスの移動先も文脈上カイサリアなので、後半では「そこへ」と補って自然な日本語にした。
