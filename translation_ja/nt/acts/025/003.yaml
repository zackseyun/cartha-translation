  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: ja
  text: 彼らはパウロに不利となる便宜を求め、彼をエルサレムに呼び寄せてほしい[a]と願い出た。その間、道中で彼を殺すために待ち伏せを企てていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼をエルサレムへ移送させてほしい」。ギリシア語の動詞は、「呼び寄せる」とも「移送させる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι
  choice: 願い出た
  rationale: 前節の主語を受ける現在分詞。日本語では文脈上の主要動作として自然に表し、正式な要請という含みも保った。
- source_word: χάριν κατ’ αὐτοῦ
  choice: パウロに不利な特別の計らいとして
  rationale: αἰτεῖν χάρινの「便宜・恩恵を求める」という慣用的意味と、κατάの敵対的な方向性を併せて表した。「特別の計らい」は行政官に求めた便宜を現代日本語で明確にする。
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: パウロをエルサレムに呼び寄せてほしい
  rationale: ὅπως節を要請の内容として自然に表した。μεταπέμπομαιの「人を遣わして呼び寄せる／連れて来させる」という使役的な意味を「呼び寄せる」で簡潔に保つ。代名詞の指示対象は文脈上パウロであり、日本語での混同を避けるため固有名を用いた。
- source_word: ἐνέδραν ποιοῦντες
  choice: 待ち伏せを企てていた
  rationale: 分詞が示す、要請と並行して進めていた付随的な企てを表す。「企てる」は、まだ実行前の計画であることに適する。
- source_word: ἀνελεῖν αὐτόν
  choice: 彼を殺そうと
  rationale: ἀναιρέωのこの文脈での直接的な意味を「殺す」とし、不定詞の目的を「ようと」で表した。
- source_word: κατὰ τὴν ὁδόν
  choice: 道中で
  rationale: 移送の途中という意味を、簡潔で自然な現代日本語にした。
