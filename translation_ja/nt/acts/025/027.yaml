  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: ja
  text: 囚人を送る際に、その者に対する告発内容も[a]示さないのは、私には道理に合わないように思われます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その者に対する告発内容も明記しない」。
    reason: σημᾶναιは「示す」のほか、「正式に知らせる」「明記する」とも訳せる。
lexical_decisions:
- source_word: ἄλογον
  choice: 道理に合わない
  rationale: 理性や筋道を欠くことを表す語。行政・司法上の判断という文脈に合い、現代日本語として自然で、強すぎる「ばかげている」を避ける。
- source_word: δοκεῖ μοι
  choice: 私には思われます
  rationale: 非人称的な構文と、話者個人の控えめな評価を保つ。
- source_word: πέμποντα
  choice: 送るのに
  rationale: 主語である話者が囚人を送る際の状況を表す分詞を、日本語で自然な付帯状況として訳す。
- source_word: δέσμιον
  choice: 囚人
  rationale: 拘束され、当局の管理下にある者を指す司法文脈での標準的な訳語。
- source_word: μὴ καὶ
  choice: も示さない
  rationale: καίの付加的な力を「も」で示し、囚人を送る一方で必要な情報を添えない不合理を表す。
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: その者に対する訴えの内容
  rationale: αἰτίαの司法的意味を保ちつつ、複数形が含みうる個々の訴因・告発事項を自然な日本語で表す。
- source_word: σημᾶναι
  choice: 示す
  rationale: 知らせる、明示するという意味を簡潔に表し、どの程度詳細に特定するかという原語の幅を狭めない。
