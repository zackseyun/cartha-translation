  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: ja
  text: ところが、彼らがパウロと争っていたのは、彼ら自身の宗教[a]や、死んだあるイエスという者についてのいくつかの争点でした。パウロは、そのイエスが生きていると主張していたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼ら自身の迷信」とも訳せる。ギリシア語は、中立的な「宗教」を意味することも、部外者がやや否定的に「迷信」と呼ぶ意味になることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: 争っていた…いくつかの問題
  rationale: 単なる質問ではなく、当事者間で争われている論点を表す。日本語では文全体を「争っていたのは…問題」と組み立て、対立的な含みを自然に示した。
- source_word: δέ
  choice: ところが
  rationale: 直前でフェストが予想していた犯罪の告発と、実際に提示された宗教上の論点との対照を表す。
- source_word: τινα
  choice: いくつかの
  rationale: 問題の数や内容を特定しない不定の意味を、自然な現代日本語で表した。
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: 彼ら自身の宗教[a]に関する
  rationale: δεισιδαιμονία は中立的な「宗教」から否定的な「迷信」まで意味し得る。本文では過度に侮蔑的にせず「宗教」とし、フェストの距離感を「彼ら自身の」で保った。
- source_word: εἶχον πρὸς αὐτόν
  choice: 彼らがパウロと争っていた
  rationale: パウロを相手とする係争を表す句として、法的意味を過度に限定せず自然に訳した。代名詞は日本語で参照先が明瞭になるよう「パウロ」とした。
- source_word: καὶ περί τινος Ἰησοῦ
  choice: あるイエスという者について
  rationale: τινος が示すフェストの疎遠で不特定的な言及を、「ある…という者」で保持した。
- source_word: τεθνηκότος
  choice: すでに死んだ
  rationale: 完了分詞が示す、死んだ結果としての状態を表し、後続する「生きている」と明確に対照させた。
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: パウロは、そのイエスが生きていると主張していた
  rationale: φάσκω の、話者が真偽を保証せず他者の言明を報告する含みを「主張していた」で表した。これはフェストの視点を保つ。
theological_decisions:
- issue: フェストの発言における δεισιδαιμονία の訳
  choice: 宗教
  alternative: 迷信／宗教的慣行
  rationale: 異教徒の行政官がユダヤ人の信仰を外部から述べているため距離や軽い見下しの可能性はあるが、現代日本語の「迷信」は否定性が強すぎる。本文は「宗教」とし、語義上の別の可能性を脚注に残した。
- issue: 復活についての言明の位置づけ
  choice: パウロは、そのイエスが生きていると主張していた
  alternative: パウロは、そのイエスが生きていると言っていた
  rationale: ここでは復活そのものを語り手が直接断言しているのではなく、フェストがパウロの言明を報告している。したがって、フェストの留保された視点を保持しつつ、復活を否定する訳にもならない表現とした。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。フェストの部外者としての距離感は「彼ら自身の」「あるイエスという者」「主張していた」で表し、語順は日本語として理解しやすい二文構成に整えた。
