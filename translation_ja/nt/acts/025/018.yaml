  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: ja
  text: 彼について、告発者たちが立ったとき、私が予想していたような悪事[a]については、何一つ告発を持ち出しませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が予想していたような犯罪については、何一つ告発を持ち出しませんでした」。ギリシア語は「悪い事柄」を意味し、正式に定められた犯罪だけでなく、より広く不正な行いを指す可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: （文脈上、「彼について」を後続の罪状表現に統合）
  rationale: 関係代名詞の指示対象はパウロ。日本語では「彼について」を独立させるより、「悪事については、何一つ罪状を」と構成するほうが自然で、法廷でパウロに対して出された訴えという関係も保たれる。
- source_word: σταθέντες
  choice: 立ち上がったものの
  rationale: アオリスト分詞を法廷で訴えを述べるために立った場面として訳した。主節の否定との対照を自然に示すため「ものの」を用いた。
- source_word: οἱ κατήγοροι
  choice: 訴える者たち
  rationale: 法的に告発する者を指す。「検察官」ほど制度的役職に限定せず、現代日本語で理解しやすい。
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: 何一つ罪状を申し立てませんでした
  rationale: 法廷文脈の「罪状・訴因を持ち出す」という意味を、明瞭で自然な法的表現にした。強い否定 οὐδεμίαν は「何一つ」で表した。
- source_word: ὧν ἐγὼ ὑπενόουν
  choice: 私が予想していたような
  rationale: ὑπονοέω は疑う・推測する意。ここではフェストが告発内容を事前に想定していたという文脈なので、「予想していた」が自然。未完了過去の継続的な事前予想は「していた」で示した。
- source_word: πονηρῶν
  choice: 悪事
  rationale: 中性複数の substantival 用法を、犯罪に限定しすぎない「悪事」とした。法廷文脈に適合しつつ、形式的に定義された犯罪のみを意味するとは断定しない。
theological_decisions: []
translation_notes:
  register: 現代標準日本語による、明瞭で品位のある法廷叙述。「ところが」で前後の対照を示し、「罪状を申し立てる」で法的場面を明確にした。脚注標識 [a] は本文中に配置した。
