  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: ja
  text: もし私が不正を行っており、死に値することを何か行ったのであれば、死ぬことを拒みはしません。しかし、この人たちが私について告発していることに何の根拠もないのであれば、だれも彼らに好意を示すために私を彼らに引き渡すことはできません。[a] 私はカエサルに上訴します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれも、彼らを喜ばせるために私を彼らに引き渡すことはできません」とも訳せる。ギリシア語の動詞には、好意として、または便宜を図るために人を引き渡すという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: 悪事を働いており
  rationale: 現在形の継続的・状態的な含みを保ちつつ、道徳的かつ法的な不正を自然な現代日本語で表した。
- source_word: ἄξιον θανάτου
  choice: 死に値する
  rationale: 死刑に相当する重大性を示しながら、原文の評価的表現を過度に法制用語へ限定しない。
- source_word: πέπραχά τι
  choice: 何か行った
  rationale: 完了した行為の現在的な関係を文脈全体で示し、τιの不特定性を保った。
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: 死ぬことを拒みはしません
  rationale: παραιτοῦμαιの「辞退する、拒む」という意味を直接に反映し、有罪なら死を受け入れるという条件的発言を保った。
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: この人たちが私を訴えている事柄に何の根拠もない
  rationale: 告発内容に実質がないという意味を自然な法的日本語で表し、「虚偽」と断定する以上の意味を加えないようにした。
- source_word: χαρίσασθαι
  choice: 彼らへの好意として私を引き渡す
  rationale: 単なる引き渡しではなく、相手に恩恵・便宜を与えるための譲渡という語義を本文に明示した。
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: 私はカエサルに上訴します
  rationale: ローマ皇帝への正式な法的上訴を示す定型的で明瞭な表現とした。
- source_word: μὲν οὖν ... δὲ
  choice: もし…のであれば…しかし…のであれば
  rationale: 二つの条件を対照させる議論の構造を、自然な日本語の条件節と逆接で再現した。
theological_decisions:
- issue: 死刑への言及と上訴が持つ司法的含意
  choice: パウロは、真に死に値する罪を犯しているなら死を拒まないと条件付きで述べる一方、根拠のない告発によって告発者側へ引き渡されることを拒み、皇帝へ上訴する。
  alternative: パウロは手続きの正当性を一切認めず、純粋に修辞的に語っている。
  rationale: 原文は条件文として死の受容を述べ、同時に不当な引き渡しを否定している。より広い死刑論や政治神学を本文へ持ち込まず、司法上の緊張をそのまま保った。
translation_notes:
  register: 明瞭で現代的ながら、法廷での厳粛な発言にふさわしい丁寧体を用いた。「カエサル」は固有の称号として保持し、「上訴する」で法的文脈を明確にした。
