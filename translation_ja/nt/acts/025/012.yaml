source:
  edition: SBLGNT
  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: ja
  text: そこでフェストゥスは、評議会と協議した上で答えた。「あなたはカエサルに上訴した。カエサルのもとへ行くことになる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「カエサルの前に出ることになる」。この表現には、上訴した者が皇帝の法廷に出るという法的な意味がある。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の時間的な進行と、パウロの上訴を受けた次の展開の双方を自然に示す。
- source_word: συλλαλήσας
  choice: 協議した上で
  rationale: アオリスト分詞による主動詞以前の行為を示し、単に話すだけでなく相談・協議する含意を表す。
- source_word: μετὰ τοῦ συμβουλίου
  choice: 評議会と
  rationale: 行政・司法上の案件を審議する一団を指す語として自然であり、原文に明示されない所有表現は加えない。
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 法的な場面の簡潔で改まった応答を、現代日本語で自然に表す。
- source_word: Καίσαρα
  choice: カエサル
  rationale: ローマ皇帝の称号を音写し、歴史的・法的文脈を保持する。
- source_word: ἐπικέκλησαι
  choice: 上訴した
  rationale: 完了形の法的用法を反映し、カエサルの裁判権に訴えたことを明確に示す。
- source_word: ἐπὶ Καίσαρα
  choice: カエサルのもとへ
  rationale: πορεύσῃと結びつく移動先として自然に訳しつつ、単なる地理的移動ではなく権威者のもとへ赴く含意を保つ。
- source_word: πορεύσῃ
  choice: 行くことになる
  rationale: 未来形を、決定された法的帰結として自然な日本語で表す。「送られる」のような原文にない受動性は加えない。
