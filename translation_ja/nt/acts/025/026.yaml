id: ACT.25.26
reference: Acts 25:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: ja
  text: この人について、私の主君[a]に書き送るべき確かなことが何もありません。そこで私は、この人を皆さまの前に、特にアグリッパ王、あなたの前に連れ出しました。これは、取り調べ[b]が行われた後で、私が書くべきことを得るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の主君」は、ここではローマ皇帝を指す公的な敬称です。ギリシア語は通常の敬称κύριοςを用いています。
    reason: alternative_reading
  - marker: b
    text: 「取り調べ」は「審理」または「司法上の調査」とも訳せます。パウロの事件についての法的な調査を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: 確かなこと
  rationale: 「確実で、根拠のある事柄」を表す。行政・司法上の報告に記せる確かな内容がないという文脈に合う。
- source_word: τῷ κυρίῳ
  choice: わが主
  rationale: 皇帝を指す公的な敬称だが、原文の κύριος の語形を保ち、「わが主」とした。文脈上、宛先が皇帝であることは明らかである。
- source_word: προήγαγον αὐτόν
  choice: 彼を……連れ出しました
  rationale: 人を公の場へ連れ出す、または出頭させる意味を自然な日本語で表した。
- source_word: ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ
  choice: 皆さんの前に、ことに……あなたの前に
  rationale: 複数の聴衆と、単数のアグリッパへの特別な呼びかけとの対照を明示した。
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: 取り調べが行われた後
  rationale: ἀνάκρισις の司法的な調査・審理の意味を、現代日本語で分かりやすく表した。
- source_word: σχῶ τί γράψω
  choice: 何か書くべきことを得られる
  rationale: 直訳的な構造と、公式報告に記す材料を得るという意味の両方を保った。
theological_decisions:
- issue: 非神学的・皇帝文脈における κύριος の訳
  choice: わが主
  alternative: 皇帝陛下
  rationale: ここで κύριος は神やキリストではなくローマ皇帝を指す。指示対象を説明的に置き換えず、原語の敬称を保つことで、同語の語彙的連続性と歴史的な公用表現を伝える。
translation_notes:
  register: フェストゥスの公的・司法的な発言にふさわしい、明瞭でやや改まった現代標準日本語とした。「皆さん」と「あなた」で複数形と単数形の対照を保ち、「アグリッパ王」を呼格として読める語順にした。
