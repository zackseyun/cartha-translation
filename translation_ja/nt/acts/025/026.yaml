revisions:
- from: この人について、わが主に書き送るべき確かなことが何もありません。そこで、取り調べが行われた後、何か書くべきことを得られるように、彼を皆さんの前に、ことにアグリッパ王、あなたの前に連れ出しました。
  to: この人について、私の主君[a]に書き送るべき確かなことが何もありません。そこで私は、この人を皆さまの前に、特にアグリッパ王、あなたの前に連れ出しました。これは、取り調べ[b]が行われた後で、私が書くべきことを得るためです。
  rationale: 原文の語順と論理関係に従い、フェストゥスがまずパウロを聴衆、とりわけアグリッパの前に連れ出し、その目的が、取り調べの後に皇帝への報告に書く内容を得ることにある、と明示した。複数の聴衆とアグリッパ個人の対照を保持し、英語監査資料に対応する二つの注も付した。
