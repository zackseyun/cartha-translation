  naturalness: 「わが主」は現代標準日本語では古風で、神学的用法も連想されやすいため、公的・帝国的な文脈を示す「私の主君」がより明瞭です。また、目的節を独立させることで、公的発言として自然で分かりやすい流れになります。
  terminology: ἀνάκρισιςは「取り調べ」で適切です。κύριοςはここでは皇帝を指す敬称であり、本文では「私の主君」とし、注で皇帝を指すことを明示します。アグリッパの王号も適切です。
