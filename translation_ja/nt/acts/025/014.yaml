  to: さて、彼らがそこに何日も[a]滞在していたので、フェストはパウロの件[b]を王に提示し[c]、こう言った。「フェリクスが囚人のまま残していった人が一人います。」
  rationale: 原文が明示しない主語人数を特定しないよう「彼ら」に改め、ἀνέθετο の正式な提示の含みを「王に提示し」で表した。さらに、完了受動分詞と δέσμιος の関係を自然な日本語で保つため、「囚人のまま残していった人」とした。脚注のアンカーと内容は各該当語句に対応しており、保持した。
