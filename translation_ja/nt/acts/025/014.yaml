  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: ja
  text: さて、彼らがそこに何日も[a]滞在していたので、フェストはパウロの件[b]を王に提示し[c]、こう言った。「フェリクスが囚人のまま残していった人が一人います。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何日も」は「数日」とも訳せる。ここでの比較級は、必ずしもほかの日数との明示的な比較を表さない。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「パウロに関する事柄」。文脈上、パウロの法的な案件を指す。
    reason: lexical_alternative
  - marker: c
    text: 「王に報告し」とも訳せる。ギリシア語には、検討を求めて事柄を提示するという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: 何日も
  rationale: 比較級が期間を表す対格とともに用いられ、文脈上、厳密な比較というより相当の日数を表す。「何日も」は滞在が続いたことを自然な日本語で伝える。
- source_word: διέτριβον
  choice: 滞在している
  rationale: διατρίβωは、ある場所で時を過ごす、滞在することを表す。複数形の動詞に合わせ、文脈上のアグリッパとベルニケを「二人」とした。
- source_word: ἀνέθετο
  choice: 持ち出し
  rationale: 単なる情報伝達ではなく、相手の考慮を求めて事柄を提示する含みを保つ。現代日本語として自然な「持ち出す」を採用した。
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: パウロの件
  rationale: パウロに関する諸事情を指し、文脈上は訴訟案件である。「件」は簡潔で自然だが、原文以上に法的意味へ限定しない。
- source_word: Ἀνήρ τίς ἐστιν
  choice: 男が一人います
  rationale: 不定だが特定の人物を導入する表現。日本語では「ある男がいます」より「男が一人います」が自然な口頭報告になる。
- source_word: καταλελειμμένος ὑπὸ Φήλικος δέσμιος
  choice: フェリクスが囚人として残していった
  rationale: 完了受動分詞が示す、フェリクスによって残され、その状態が続いていることを表す。「置き去り」は不必要に否定的な感情を含み得るため避けた。
- source_word: τῷ βασιλεῖ
  choice: 王に
  rationale: 原文は固有名を繰り返さず「王」としており、前後の文脈からアグリッパを指すことが明らかなため、そのまま訳した。
