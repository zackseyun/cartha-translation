source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: ja
  text: 彼が到着すると、エルサレムから下って来たユダヤ人たちは彼を取り囲み、多くの重大な訴えを申し立てたが、それを証明することはできなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: 彼が到着すると
  rationale: 属格独立構文の時間的関係を自然な現代日本語で表し、到着後に告発者たちが行動したという流れを保つ。
- source_word: περιέστησαν αὐτὸν
  choice: 彼を取り囲み
  rationale: 動詞の「周囲に立つ／取り囲む」という意味を簡潔に表す。法廷で圧力をかける姿勢も文脈上感じられるが、敵意を説明として付加しない。
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: エルサレムから下って来たユダヤ人たち
  rationale: Ἰουδαῖοι は「ユダヤ人」または「ユダヤ地方の人々」となり得るが、ここではエルサレムから来たユダヤ人の告発者を指す。「下って来た」はエルサレムからの移動を表す原文の慣用的な地理表現を保つ。
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: 多くの重大な訴え
  rationale: αἰτιώματα の法的な告発・訴因という意味と、βαρέα の重大さを、明瞭で自然な法廷語彙によって示す。
- source_word: καταφέροντες
  choice: 申し立てた
  rationale: 法的文脈で告発や訴えを持ち出す意味を表す。「訴え」と自然に結び付く現代日本語を選ぶ。
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: それを証明することはできなかった
  rationale: ἰσχύω＋不定詞の能力の否定と、ἀποδείκνυμι の「証明する」を明確に表す。未完了過去の継続的な不首尾は、日本語では文脈に即した「できなかった」で自然に伝わる。
theological_decisions: []
