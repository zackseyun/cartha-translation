id: ACT.25.6
reference: Acts 25:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: ja
  text: フェストは彼らのもとに長くても八日か十日滞在した後、カイサリアへ下った。翌日、裁判席に着き[a]、パウロを連れて来るよう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裁判の壇に座り」とも訳せる。ギリシア語の「ベーマ」は、公的な裁判を行うための席または壇を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: フェストは彼らのもとに……滞在した後
  rationale: 分詞が示す先行動作を自然な日本語の時間表現にした。「彼らのもとに」は、直前に言及された人々のいる場所で時を過ごしたという意味を保つ。主語の「フェスト」は文脈から補い、代名詞だけの場合の曖昧さを避けた。
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: 長くても八日か十日
  rationale: 否定を伴う比較級が示す上限と、「八日か十日」という概数的な言い方の両方を保った。
- source_word: καταβὰς εἰς Καισάρειαν
  choice: カイサリアへ下った
  rationale: エルサレムからカイサリアへの移動を表す原文の方向語を保持した。地名は現代日本語の聖書で通用する「カイサリア」とした。
- source_word: τῇ ἐπαύριον
  choice: 翌日
  rationale: 到着の次の日を簡潔で明確な現代日本語で表した。
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: 裁判席に着き
  rationale: βῆμαがこの文脈で指す、公的な裁判を行うための席または壇を「裁判席」と表現した。分詞は後続の命令に先立つ動作として自然につないだ。
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: パウロを連れて来るよう命じた
  rationale: 受動不定詞を日本語で自然な使役的命令表現にし、法廷へ移送させる場面を明確にした。
theological_decisions: []
