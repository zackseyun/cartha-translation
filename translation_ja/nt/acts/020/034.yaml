  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: ja
  text: あなたがた自身が知っているとおり、この手が、私自身の必要と、私と一緒にいた人たちの必要とを満たしたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「この手が、私の必要と、私と一緒にいた人たちの必要とに仕えた」。ギリシア語の動詞は実際的な奉仕・援助を表し、ここでは手による働きが必要を満たしたことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: あなたがた自身
  rationale: 動詞に添えられた主格代名詞の強調を保ち、聞き手自身が直接知っていることを示す。
- source_word: γινώσκετε
  choice: 知っている
  rationale: 現在形が表す、パウロの行動について聞き手が現に有している知識を自然な現代日本語で表す。
- source_word: ταῖς χρείαις μου
  choice: 私の必要のために
  rationale: χρεία はここで生活上・物質上の必要を指す。「必要」は意味を限定しすぎず、自然である。
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: 私と一緒にいた人たち
  rationale: 冠詞付き分詞句を関係的に訳し、「仲間」など関係性を特定する語を補わない。
- source_word: ὑπηρέτησαν
  choice: 働いて仕えた
  rationale: 実際の労働による奉仕という文脈を明らかにしつつ、動詞の基本的な「仕える、助ける」という像を残す。「養った」と断定するより原文の幅を保つ。
- source_word: αἱ χεῖρες αὗται
  choice: この両手
  rationale: 指示詞の生々しい強調と、パウロが自ら手を動かして働いたことを自然な日本語で伝える。日本語では身体部位として「両手」が慣用的である。
