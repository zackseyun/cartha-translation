  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤγαγον δὲ τὸν παῖδα ζῶντα, καὶ παρεκλήθησαν οὐ μετρίως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: ja
  text: 人々はその若者を生きたまま連れて行き、大いに慰められた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大いに」は、直訳すると「ほどほどではなく」。非常に深く慰められたことを表す言い回し。
    reason: 原文の緩叙法οὐ μετρίωςの字義と強調を示すため。
lexical_decisions:
- source_word: ἤγαγον
  choice: 連れて行き
  rationale: ἄγωは「導く、連れて行く、連れて来る」を意味する。ここでは目的地を本文以上に特定せず、文脈に合う自然な日本語とした。
- source_word: παῖδα
  choice: 若者
  rationale: παῖςには「子ども、少年、若い者、しもべ」などの意味がある。ここでは9節でνεανίας（若者）と呼ばれたエウティコを指すため、「若者」が文脈に最も適する。
- source_word: ζῶντα
  choice: 生きたまま
  rationale: 分詞は若者が連れて行かれた時の状態、すなわち「生きている」ことを表す。「生き返った」として出来事の解釈を直接訳文へ加えることは避けた。
- source_word: παρεκλήθησαν
  choice: 慰められた
  rationale: παρακαλέωは「励ます、慰める」など広い意味を持つ。転落して死んだと思われた若者が生きていたという直前の文脈では、安堵を伴う「慰められた」が適切である。
- source_word: οὐ μετρίως
  choice: 大いに
  rationale: 字義的には「ほどほどではなく」という緩叙法で、程度が非常に大きいことを表す。現代日本語で意味が明瞭な「大いに」とした。
theological_decisions:
- issue: ζῶνταが復活または蘇生を明示するか
  choice: 「生きたまま」として、生存状態を訳す
  alternative: 「生き返った若者を」
  rationale: 原文のζῶντα自体は「生きている」という状態を述べる。前後の物語が持つ神学的含意を否定せず、同時にこの語だけに「生き返った」という出来事を明示させない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「並々ならず」は原文の表現に近いが、日常の読者により直接伝わる「大いに」を本文に採用した。
