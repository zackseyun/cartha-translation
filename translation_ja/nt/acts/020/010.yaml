  to: しかし、パウロは下に降り、彼の上に覆いかぶさり[a]、抱きしめて言った。「取り乱さないでください。彼には命があるのです[b]。」
  rationale: 原文の身体的な動作の順序と強さを保ちながら、現代日本語として明瞭な表現に整えた。「彼には命があるのです」は、英語の「his life is in him」と同様に、出来事の機序を説明せず、生存の宣言として原文の曖昧さを保存する。
