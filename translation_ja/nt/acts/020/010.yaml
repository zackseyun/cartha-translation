id: ACT.20.10
reference: Acts 20:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: ja
  text: しかし、パウロは下に降り、彼の上に覆いかぶさり[a]、抱きしめて言った。「取り乱さないでください。彼には命があるのです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼の上に倒れかかった」。パウロがその若者の上に身を重ねる身体的な動作を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼の命は彼の内にある」。この言葉は、その若者が実はまだ死んでいなかったとも、命が回復されたとも理解できる。ギリシア語の表現自体は、どちらかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: 下に降り
  rationale: 上階から降りる方向性を保ちつつ、分詞を後続動作と自然につないだ。
- source_word: δὲ
  choice: しかし
  rationale: 若者が死んだと判断された直前の記述に対し、パウロの対応へ移る緩やかな対照を示す。
- source_word: ἐπέπεσεν αὐτῷ
  choice: その若者の上に身を伏せ
  rationale: 単なる接触以上の身体動作を表し、預言者による回復の物語を思わせる表現上の響きも損なわない。日本語で「上に倒れかかった」と誤解されないよう「身を伏せ」とした。
- source_word: συμπεριλαβὼν
  choice: 抱きかかえて
  rationale: 相手を腕で包む身体的な動作を、明瞭で自然な現代日本語で表した。
- source_word: Μὴ θορυβεῖσθε
  choice: 騒がないでください
  rationale: θορυβέωが表す動揺と騒ぎの双方を含み、集まった人々に対する命令として自然である。
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: 彼の命は
  rationale: ここでは若者の生死が問題であるため、ψυχήを「魂」と専門的に限定せず「命」とした。
- source_word: ἐν αὐτῷ ἐστιν
  choice: 彼の内にあります
  rationale: ギリシア語の簡潔な状態表現を保ち、命が残っていたのか回復したのかを訳文で決めない。
theological_decisions:
- issue: 生死の文脈における ψυχή の意味
  choice: 「命」と訳す。
  alternative: 「魂」
  rationale: 文脈の焦点は若者の身体的な生死にある。「命」はこの語の自然な用法を反映し、本文が前面に出していない人間論を持ち込まない。
- issue: 若者が実際には死んでいなかったのか、命を回復されたのか
  choice: 「彼の命は彼の内にあります」とし、本文では中立性を保つ。
  alternative: 「彼は生きています」または「彼の命は戻りました」
  rationale: 原文は命が彼の内にあると述べるが、それが命の存続を指すのか回復を指すのかを明示しないため、その緊張を保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、叙事本文にふさわしい落ち着いた語調と原文の曖昧さを保った。「若者」は文脈上の指示対象を自然に示す補足である。
