reference: Acts 20:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: ja
  text: 彼はそこで三か月を過ごした。シリアへ船出しようとしていたとき、ユダヤ人たち[a]が彼に対して陰謀を企てたので、マケドニアを通って帰ることにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人たち」は、ここではパウロに陰謀を企てた特定の人々を指しており、すべてのユダヤ人を一括して指すものではない。
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: 彼はそこで三か月を過ごした
  rationale: ποιέωと期間を表す対格の組み合わせを「（期間を）過ごす」と訳した。「そこで」は前節のギリシア滞在を受けて日本語のつながりを明確にする補足。
- source_word: γενομένης ἐπιβουλῆς αὐτῷ ὑπὸ τῶν Ἰουδαίων
  choice: ユダヤ人たちが彼に対して陰謀を企てたので
  rationale: 属格独立構文の状況的・因果的関係を自然な日本語で示した。ἐπιβουλήは人に危害を加えるための「陰謀」を意味する。
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: シリアへ船出しようとしていたとき
  rationale: μέλλωの切迫した予定と、航海文脈でのἀνάγωの「船出する」という意味をともに表した。
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: 帰ることにした
  rationale: 決意に至ることを表す慣用的な構文を、明瞭で自然な日本語にした。
- source_word: διὰ Μακεδονίας
  choice: マケドニアを通って
  rationale: 属格を伴うδιάが示す経路をそのまま表した。
theological_decisions:
- issue: 対立記事における「ユダヤ人たち」の指示範囲
  choice: 本文では原文どおり「ユダヤ人たち」とし、文脈上の範囲を脚注で説明する。
  alternative: 「ユダヤ人の反対者たち」または「一部のユダヤ人たち」と本文で限定する。
  rationale: 原文は定冠詞付きのτῶν Ἰουδαίωνを用いており、本文に「一部」や「反対者」を加えると明示されていない限定を持ち込む。一方、民族全体への一般化を避けるため、使徒言行録の当該文脈に即した説明を脚注に置いた。
translation_notes:
  register: 現代の一般読者に分かりやすい標準的な文体を用いつつ、歴史叙述としての落ち着きを保った。長いギリシア語の一文は、時間関係を明確にするため日本語では二文に分けた。
