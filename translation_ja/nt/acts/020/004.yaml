  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: ja
  text: ピュロスの子でベレア出身のソパテロ、テサロニケの人々の中からはアリスタルコとセクンド[a]、デルベ出身のガイオとテモテ、またアジア州出身のティキコとトロフィモ[b]が、彼に同行していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「テサロニケの人々の中から、アリスタルコとセクンド」。すなわち、二人はテサロニケ出身者である。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「アジア州」はローマ帝国の属州であり、現代のアジア大陸全体を指すものではない。
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: 同行していた
  rationale: 未完了過去形が表す、旅に付き添っていた継続的な状況を、自然な現代日本語で表した。
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: ピュロスの子でベレア出身のソパトロ
  rationale: Πύρρουを父称「ピュロスの子」、Βεροιαῖοςを出身地「ベレア出身」として明示した。
- source_word: Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: テサロニケの人々の中からはアリスタルコとセクンド
  rationale: 属格複数形の字義的な集団表現を保ち、二人がテサロニケの人々に属することを示した。
- source_word: Γάϊος Δερβαῖος καὶ Τιμόθεος
  choice: デルベ出身のガイオとテモテ
  rationale: Δερβαῖοςはガイオだけを修飾する配置なので、「デルベ出身」をガイオにのみ結び付けた。テモテの出身地は本文から補わない。
- source_word: Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος
  choice: またアジア州出身のティキコとトロフィモ
  rationale: Ἀσιανοίが指すローマ属州アジアを、現代の大陸名との混同を避けて「アジア州」とした。
- source_word: δέ ... δέ ... δέ
  choice: …からは…、…、また…
  rationale: 列挙を進める反復的なδέを、日本語で不自然にならない範囲で対比・添加として表した。
theological_decisions: []
translation_notes:
  register: 人名と地名は日本語聖書で広く用いられる音写を採用した。長い名簿を一文として読みやすく整えつつ、各出身地がどの人物に掛かるかを原文どおりに保った。
