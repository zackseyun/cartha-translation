  text: They all wept a great deal, threw their arms around Paul’s neck, and kept kissing him.
translation:
  language: ja
  text: 一同は激しく泣き、パウロの首に抱きつき、何度も口づけした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: 一同は激しく泣き
  rationale: 存在表現を自然な日本語の動作表現にしつつ、πάντωνの全員性とἱκανόςが示す激しい泣き方を保った。δέは物語を進める軽い接続であり、独立した訳語を置かなくても文脈上の機能が伝わる。
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: パウロの首を抱いて
  rationale: 直訳的な「首の上に倒れかかる」ではなく、抱擁を表す慣用的動作として自然に訳しながら、原文の「首」という具体的な描写を残した。
- source_word: κατεφίλουν αὐτόν
  choice: 何度も口づけした
  rationale: καταφιλέωの強い、または繰り返す接吻という含みと、未完了過去の継続・反復性を「何度も」で明示した。「口づけ」は場面にふさわしい品位を保つ。
