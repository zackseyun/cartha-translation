  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: ja
  text: ミレトスから、パウロはエフェソへ送って、教会の長老たちを呼び寄せた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「エフェソへ送って、教会の長老たちを呼び寄せた」。ギリシア語は何を送ったかを明示していないが、エフェソへ連絡を送り、長老たちに来るよう求めたことを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: さて、パウロはミレトスから
  rationale: ἀπό＋属格は出発点を示すため「ミレトスから」とした。δέは弱い接続を表すので、文脈の移行を自然に示す「さて」で表現した。日本語では主語を明確にするため、直前の文脈から「パウロ」を補った。
- source_word: πέμψας εἰς Ἔφεσον
  choice: エフェソへ人を遣わし
  rationale: アオリスト分詞は主動詞に先行する行為を表す。目的地を示す εἰς は「へ」とし、何を遣わしたかは明示されないものの、長老たちへの連絡という文脈を自然に伝えるため「人を」を補った。
- source_word: μετεκαλέσατο
  choice: 呼び寄せた
  rationale: 中動態の動詞は、自分のもとへ来るよう求めることを表す。「召集した」より威圧的・制度的な響きを避けつつ、移動を伴う意味を明確にするため「呼び寄せた」とした。
- source_word: τοὺς πρεσβυτέρους
  choice: 長老たち
  rationale: ここでは単なる年長者ではなく、教会の公認された指導者を指す。「長老」は後代の特定教派の制度を持ち込まず、初期教会における役割を表せる標準的な訳語である。
- source_word: τῆς ἐκκλησίας
  choice: 教会の
  rationale: ルカ文書のこの文脈では、キリスト者の共同体を指すため「教会」とした。
theological_decisions:
- issue: πρεσβυτέρους が指す者
  choice: 教会の指導者である「長老たち」
  alternative: 会衆の年長者たち／プレスビュテロイ
  rationale: 使徒言行録では πρεσβύτεροι が諸教会の指導者を指して用いられる。この訳は後代の特定の教会制度を前提とせず、語の役割上の意味を保つ。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「呼び寄せた」により、単なる呼びかけではなく、パウロのもとへ来るよう求めた意味を自然に示した。
