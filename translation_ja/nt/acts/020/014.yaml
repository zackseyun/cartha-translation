  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: ja
  text: 彼がアソスで私たちと合流すると[a]、私たちは彼を船に乗せ、ミティレネに着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アソスで私たちに会うと」または「アソスで私たちと落ち合うと」。ギリシャ語の動詞は、会うことや一緒になることを表し得る。ここでは、パウロがそこで一行に再び加わったという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: 合流すると
  rationale: この旅行記の文脈では、パウロがアソスで船旅の一行と落ち合い、再び行動を共にしたことを表す。「合流する」は、単に会っただけでなく一行に加わったという含みを自然に伝える。
- source_word: ἡμῖν
  choice: 私たちと
  rationale: 船で移動していた語り手を含む一行を指す与格で、日本語では「合流する」に合わせて「私たちと」とした。
- source_word: εἰς τὴν Ἆσσον
  choice: アソスで
  rationale: 前置詞 εἰς は通常方向を示すが、ここでは合流が実現した場所を日本語として自然に「アソスで」と表した。
- source_word: ἀναλαβόντες
  choice: 彼を船に乗せ
  rationale: 直前からの航海文脈により、一行がパウロを船に迎え入れたことを指す。日本語で明瞭になるよう、含意される「船」を明示した。
- source_word: αὐτόν
  choice: 彼を
  rationale: 直前の文脈に登場するパウロを指すため、代名詞で自然に訳した。
- source_word: ἤλθομεν
  choice: 着いた
  rationale: 目的地への移動の完了を表すアオリストであり、日本語の旅行記として「着いた」が自然である。
- source_word: εἰς Μιτυλήνην
  choice: ミティレネに
  rationale: 目的地を示す標準的な方向表現として訳した。地名はギリシャ語の発音に沿って「ミティレネ」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある旅行記調とした。「船に乗せ」は原文に明示されない船を文脈から補うが、ἀναλαβόντες の航海上の意味を普通の読者に明確に伝える。
