  to: そして今、私はあなたがたを神とその恵みのことば[a]に委ねます。このことばには、あなたがたを育て上げ、聖なる者とされたすべての人々と共に受ける相続分を与える力があります。
  rationale: 主本文は、直近の先行詞である「その恵みのことば」が力を持つという読みを保ちます。その一方、原文で可能な、神を「力のある方」とする読みは完全な代替訳として脚注に示します。「あなたがたを育て上げ」により文脈上含意される目的語を自然に補い、「聖なる者とされたすべての人々と共に受ける相続分」により、聖別された者たちの中で与えられるκληρονομίαを明瞭に表しました。
