  source_fidelity: 主本文は、παρατίθεμαιを「委ねます」とし、「神」と「その恵みのことば」の双方に託す構文、およびτῷ δυναμένῳを直近の「ことば」に関係づける理解を適切に反映しています。ただし、「人を造り上げ」は文脈上の受け手である「あなたがた」を不必要に一般化し、また「受け継ぐものを与える」はκληρονομίαの「相続分」という意味と、ἐν τοῖς ἡγιασμένοις πᾶσινの共同体的範囲との結び付きをやや不明瞭にしています。
  naturalness: 「聖なるものとされたすべての人々」は、人に対して「もの」を用いるため不自然です。「聖なる者とされたすべての人々」が自然です。また、「人を造り上げ、……人々の間で受け継ぐものを与える」は日本語として係り受けが取りにくいため、受益者と相続分の関係を明瞭にする必要があります。
  terminology: 「恵みのことば」「委ねます」はこの文脈にふさわしく、現代標準日本語としても適切です。οἰκοδομῆσαιには比喩的な「育て上げる」を用い、κληρονομίαには具体的内容を教理的に限定しない「相続分」を用います。「聖なる者とされた」は完了受動分詞の意味をよく保ちます。
