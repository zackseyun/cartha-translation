id: ACT.20.32
reference: Acts 20:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: ja
  text: そして今、私はあなたがたを神とその恵みのことば[a]に委ねます。このことばには、あなたがたを育て上げ、聖なる者とされたすべての人々と共に受ける相続分を与える力があります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして今、私はあなたがたを神とその恵みのことばに委ねます。神には、あなたがたを育て上げ、聖なる者とされたすべての人々と共に受ける相続分を与える力があります」。原文の「力のある方／もの」は、主に神を指すとも取れます。
    reason: τῷ δυναμένῳは、直近の「その恵みのことば」に係るとも、神に主として係るとも文法上取り得るため。
lexical_decisions:
- source_word: παρατίθεμαι
  choice: 委ねます
  rationale: 中動態が表す、相手を他者の配慮と守りに託す意味を、自然で格調ある現代日本語で示す。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: παρατίθεμαιに続く与格で、委ねる相手を明確に示す。
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: その恵みのことばに
  rationale: 属格構造を保ち、λόγοςが宣べ伝えられることば・知らせを指し得る余地と神学的な重みを残す。
- source_word: τῷ δυναμένῳ
  choice: このことばには……力があります
  rationale: 直近の先行詞である「その恵みのことば」を主本文の指示対象としつつ、可能・能力の意味を自然な日本語にする。神を指す可能性は脚注に残す。
- source_word: οἰκοδομῆσαι
  choice: 人を造り上げ
  rationale: 明示されていない目的語を一般的な「人」として補い、霊的に育て上げる比喩を保ちながら、日本語として目的語なしの不自然さを避ける。
- source_word: δοῦναι τὴν κληρονομίαν
  choice: 受け継ぐものを与える
  rationale: κληρονομίαの相続・分け前という含意を、普通の読者に理解しやすい表現で伝える。受領者は文脈上明らかなため、過度に補わない。
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: 聖なるものとされたすべての人々の間で
  rationale: 完了受動分詞の、聖別された状態に置かれているという意味を動詞的に保ち、ἐνの共同体・範囲を「間で」で表す。
theological_decisions:
- issue: τῷ δυναμένῳ（力のあるもの）の指示対象
  choice: 主本文では直近の「その恵みのことば」を指すものとして訳す。
  alternative: 神を主な指示対象として「神には……力があります」と取る。
  rationale: 与格単数分詞は統語上どちらにも関連づけ得る。直近の先行詞を採る一方、相続を与える人格的主体として神を指す理解も十分可能なので脚注で明示し、原文の曖昧さを保存する。
- issue: κληρονομίαの性質
  choice: 「受け継ぐもの」とし、内容を特定しない。
  alternative: 「御国」「永遠のいのち」などと具体化する。
  rationale: 文脈には終末的な分け前という含意があるが、原文自体は内容を明示しないため、教理的な具体化を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒の厳粛な告別のことばにふさわしい品位を保った。「ことば」は聖書的な響きを残すため平仮名表記とし、「聖なるものとされた」はἡγιασμένοιςの受動性と完了的状態を反映した。
