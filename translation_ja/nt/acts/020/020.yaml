  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: ja
  text: 私は、あなたがたの益になることは何一つ差し控えず、あなたがたに伝え、公の場でも家々でも教えました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπεστειλάμην
  choice: 差し控えず
  rationale: 中動態の「身を引く、控える、ためらって差し控える」という意味を、文脈に即した自然な現代日本語で表す。
- source_word: τῶν συμφερόντων
  choice: あなたがたの益になること
  rationale: συμφέρω の「有益である、ためになる」という広い意味を保ち、霊的利益に限定する語を本文へ加えない。
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: 伝え
  rationale: ὑποστέλλω に続く否定付き冠詞不定詞は、益になることを告げるのを差し控えなかったという内容を示す。日本語では二重否定を整理して自然に表した。
- source_word: ἀναγγεῖλαι
  choice: 伝え
  rationale: 「知らせる、告げる、報告する」の意。後続の「教える」と区別しつつ、宣教文脈にも適する一般的で明瞭な語を選んだ。
- source_word: διδάξαι
  choice: 教えました
  rationale: διδάσκω の基本義をそのまま明確に表す。ἀναγγεῖλαι と並ぶ二つ目の不定詞であることも保持した。
- source_word: δημοσίᾳ
  choice: 公の場でも
  rationale: 人々に開かれた公的な場所・状況を示す副詞的用法を、自然な日本語で表した。
- source_word: κατ’ οἴκους
  choice: 家々でも
  rationale: κατά と複数対格の分配的意味を簡潔に保持する。「一軒一軒」と断定するより、複数の家を巡る働きを自然に示す。
- source_word: ὡς
  choice: （前文から続く内容として訳文には独立表示せず）
  rationale: ὡς は20節単独では前節の想起内容を導く接続語である。日本語の節単位では「私は」で受ける方が自然で、命題内容は失われない。
theological_decisions:
- issue: 「益になること」の範囲
  choice: 広い意味の「あなたがたの益になること」を維持
  alternative: 「霊的に有益なこと」「救いに必要なこと」などに限定する
  rationale: 文脈上は霊的・牧会的な益が中心だが、原語自体はより広い。本文では限定を加えず、解釈上の余地を保つ。
- issue: 家々での教えの形態
  choice: 「家々でも」と訳す
  alternative: 「一軒一軒訪問して」「家庭集会で」
  rationale: 分配的な表現は保持するが、訪問伝道や家庭集会など特定の実施形態に限定しない。
translation_notes:
  register: 明快な現代標準日本語。説教・朗読にも耐える品位を保ちながら、古風な「はばからず」等は避けた。前節から続く従属構文を節単位で自然な独立文に整えた。
