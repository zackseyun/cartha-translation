source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: ja
  text: そして今、聞いてください。私は霊に縛られて[a]エルサレムへ向かっています。そこで何が私の身に起こるのか、私は分かりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖霊に縛られて」とも、パウロ自身の霊に縛られてとも理解できます。また、「聖霊によって強く促されて」という意味に理解することもできます。
    reason: ギリシア語の「霊」が聖霊を指すかパウロ自身の霊を指すか、また「霊に」の関係をどう理解するかに曖昧さがあるため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 話の転換点で聞き手の注意を促す語の力と厳粛さを保った。現代日本語ではやや格調があるが、演説中の強調として理解できる。
- source_word: δεδεμένος
  choice: 縛られて
  rationale: δέωの完了受動分詞が持つ「縛られた状態にある」という比喩を保ち、「促されて」「強いられて」のように意味を一つに限定しない。
- source_word: τῷ πνεύματι
  choice: 霊に
  rationale: この与格句が聖霊を指すのかパウロ自身の霊を指すのか、また領域・状態か作用者かを一義的に決められないため、日本語本文でも「霊に」として曖昧さを保った。使徒言行録の文脈上は聖霊である可能性が高い。
- source_word: πορεύομαι
  choice: 向かっています
  rationale: エルサレムを目指して進む現在の動きと意志を、自然な現代日本語で表した。
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: そこで何が私の身に起こるのか
  rationale: 直訳的には「そこで私に出会うこと」だが、将来待ち受ける出来事を指す慣用的な表現として自然に訳した。
- source_word: μὴ εἰδώς
  choice: 分かりません
  rationale: 主文に自然につなげ、パウロが今後の出来事を知らないという意味を明瞭にした。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 日本語で定着している標準的な地名表記を用いた。
theological_decisions:
- issue: τῷ πνεύματιが指すもの
  choice: 本文では「霊に」とし、聖霊とパウロ自身の霊のどちらにも取り得る形を保つ
  alternative: 「聖霊に縛られて」または「自分の霊に縛られて」；作用を明示するなら「聖霊に促されて」
  rationale: 使徒言行録におけるπνεῦμαの用法と直後の文脈は聖霊を有力にするが、ギリシア語の句そのものはパウロ自身の霊という理解を排除せず、「促されて」と訳すと縛る比喩と構文上の余地を狭めるため。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、ἰδοὺは演説の厳粛な注意喚起を示す「見よ」で保持した。「霊に縛られて」はやや比喩的だが、原文の像と解釈上の緊張を残している。
