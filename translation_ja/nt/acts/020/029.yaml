id: ACT.20.29
reference: Acts 20:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: ja
  text: 私は、私が去った後[a]、凶暴な狼[b]があなたがたの中に入り込み、群れに容赦しないことを知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「私の到着の後」または「私が来た後」。ここでは文脈上、「私が去った後」という意味。
    reason: lexical_alternative
  - marker: b
    text: 別訳「荒々しい狼」。ギリシア語の形容詞は、厳しく、苛烈で、乱暴な性質を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: 私は知っています
  rationale: パウロの確信ある認識を、明瞭で自然な現代日本語で表す。
- source_word: εἰσελεύσονται
  choice: 入り込み
  rationale: 共同体の内側へ侵入する動きを示し、狼と群れの比喩にも自然に合う。
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: 私が去った後
  rationale: ἄφιξιςは通常「到着・来訪」を表し得るが、ここではパウロがいなくなった後の危険を警告する文脈なので、文脈上の意味を採った。
- source_word: λύκοι βαρεῖς
  choice: 凶暴な狼ども
  rationale: βαρεῖςの厳しさ、苛烈さ、危険性を現代日本語で伝えつつ、原文の狼の比喩を保持する。
- source_word: εἰς ὑμᾶς
  choice: あなたがたの中に
  rationale: 共同体の中へ侵入するという方向性を明確に表す。
- source_word: μὴ φειδόμενοι
  choice: 容赦しない
  rationale: 群れを傷つけることを差し控えない苛酷さを、簡潔で自然な日本語にする。
- source_word: τοῦ ποιμνίου
  choice: 群れ
  rationale: 教会共同体を指す牧羊の比喩を解釈で置き換えず、そのまま保持する。
theological_decisions:
- issue: 「狼」の比喩が指す対象
  choice: 本文では「狼」の比喩を保持する
  alternative: 偽教師、迫害者、破壊的な者たちと明示する
  rationale: この節自体は狼の正体を明示していないため、特定の対象に限定せず、原文の修辞的力と曖昧さを保つ。
- issue: ἄφιξιςの文脈上の意味
  choice: 「私が去った後」
  alternative: 「私が到着した後」「私が来た後」
  rationale: 語の通常の意味には「到着」があるものの、この談話ではパウロが彼らのもとを離れた後に起こる危険が問題となっているため、文脈上の意味を本文に採用し、字義的な可能性を注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「狼」「群れ」という対応する比喩を維持し、「狼」が誰を指すかは本文で説明しない。「狼ども」は複数かつ敵対的な比喩の迫力を自然に表す。
