source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: ja
  text: 一方、私たちは先に船へ行き、アソスに向けて出航した。そこで、パウロを船に乗せるつもりだった。パウロ自身が陸路を行くつもりだったので、あらかじめそのように手はずを整えていた[a]のである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「パウロ自身は歩いて行くつもりだった」とも訳せる。また、「そのように手はずが整えられていた」と受動的に訳すこともできる。ギリシア語のπεζεύεινは船旅に対する陸路の移動を表し、徒歩を指す可能性がある。διατεταγμένος ἦνは形の上では受動態である。
    reason: lexical_and_grammatical_alternatives
lexical_decisions:
- source_word: προελθόντες
  choice: 先に船へ行き
  rationale: アオリスト分詞が主動詞に先立つ行為を示し、語り手たちがパウロより先行したことを自然な日本語で表す。
- source_word: ἀνήχθημεν
  choice: 出航した
  rationale: 航海の文脈における定着した意味「沖へ出る、船出する」を簡潔に表す。
- source_word: ἐπὶ τὴν Ἆσσον
  choice: アソスに向けて
  rationale: 航海の目的地を示す方向表現として自然である。地名Ἆσσοςは「アソス」と音写する。
- source_word: μέλλοντες ἀναλαμβάνειν τὸν Παῦλον
  choice: パウロを船に乗せるつもりだった
  rationale: μέλλωの意図と、航海文脈でのἀναλαμβάνωの「乗船させる、拾って乗せる」という意味を明示する。
- source_word: ἐκεῖθεν
  choice: そこで
  rationale: 字義的には「そこから」だが、日本語ではアソスを乗船地点として「そこで」とするのが自然であり、文脈上の意味を保つ。
- source_word: διατεταγμένος ἦν
  choice: そのように手はずを整えていた
  rationale: 迂言的な過去完了受動形を踏まえつつ、文脈上パウロが事前に計画した可能性を本文に採る。「手はず」は旅程上の取り決めを自然に表す。
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: パウロ自身は陸路を行くつもりで
  rationale: αὐτόςの強調を「自身」で示し、πεζεύωが船旅と対照される陸上移動を表すため「陸路を行く」とした。徒歩に限定する可能性は注で示す。
- source_word: δὲ
  choice: 一方
  rationale: 語り手の一行とパウロの別行動という穏やかな対照を、現代日本語で明確に示す。
