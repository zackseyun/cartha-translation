  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: ja
  text: パウロはそれらの地方を通り、多くの言葉をもって[a]人々を励ました後、ギリシアに着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「長々と」、または「多くの勧めをもって」とも訳せる。ギリシア語を直訳すると「多くの言葉をもって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: 巡り
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、「巡り……後」として自然な日本語で順序を示した。各地を通って行く含意も保っている。
- source_word: τὰ μέρη ἐκεῖνα
  choice: それらの地方
  rationale: μέρηの地理的な意味を、現代日本語で明瞭な「地方」とした。
- source_word: παρακαλέσας
  choice: 励ました
  rationale: παρακαλέωは励ます、勧める、慰めるなどの幅を持つ。ここでは信徒を力づける巡回の文脈に合い、意味を過度に狭めない「励ました」を選んだ。
- source_word: αὐτοὺς
  choice: 人々を
  rationale: 指示対象は直前の地方にいる信徒たちである。日本語では裸の「彼ら」より文脈上自然な「人々」とした。
- source_word: λόγῳ πολλῷ
  choice: 多くの言葉をもって
  rationale: 直訳的な語形を保ちつつ、十分な語りや長い勧めという含意は脚注で示した。
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: ギリシアに着いた
  rationale: 地域への移動と到着を自然な日本語で表した。εἰςの方向性を反映している。
- source_word: δὲ
  choice: （明示せず）
  rationale: 弱い接続辞であり、日本語では分詞構文を「……後」とまとめることで文脈の推移を自然に表した。
