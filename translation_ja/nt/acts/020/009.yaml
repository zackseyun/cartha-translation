  naturalness: 「窓のところに腰掛けていた」でも意味は通るが、「窓に腰掛けていた」のほうが、転落に至る位置を簡潔かつ自然に描写する。「長く話している間に」は明瞭な現代標準日本語であり、原文の中立的な語調にも合う。
  terminology: 「エウティコ」「パウロ」「青年」「深い眠り」「死んだ状態」は適切である。「死んだ状態で抱き上げられた」はνεκρόςを弱めず、αἴρωの基本的な受動の意味を保つ。注は代替の語義を示すが、「運び上げられた」より、方向を不必要に限定しない「運び去られた」がよい。
