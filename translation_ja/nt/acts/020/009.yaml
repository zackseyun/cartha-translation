source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: ja
  text: さて、エウティコという一人の青年が窓に腰掛けていた。パウロが長く話している間に、彼は深い眠りに沈み、眠りに負けて三階から下へ落ち、死んだ状態で抱き上げられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「死んだ状態で運び去られた」。ギリシア語の動詞は、「抱き上げられた」とも「運び去られた」とも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος
  choice: 腰掛けていた
  rationale: 現在分詞が示す継続的な姿勢を、自然な現代日本語で表した。
- source_word: τις νεανίας
  choice: 一人の青年
  rationale: τις の不定性を「一人の」で表し、νεανίας は年若い男性を指す自然な語として「青年」とした。
- source_word: ὀνόματι Εὔτυχος
  choice: エウティコという
  rationale: 「名をエウティコという」に相当する内容を、簡潔で自然な日本語にした。
- source_word: ἐπὶ τῆς θυρίδος
  choice: 窓のところに
  rationale: θυρίς は窓または窓の開口部を指す。転落する位置関係を保ちつつ、原文以上に「窓枠」と限定しない訳とした。
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: 深い眠りに沈み
  rationale: 眠りに圧倒されていく進行的な様子を、簡潔で視覚的な表現にした。
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: パウロが長々と話しているうちに
  rationale: 属格絶対構文の同時性と、ἐπὶ πλεῖον が表す長時間の発話を自然に表した。διαλέγομαι はここでは「論じる」と限定せず「話す」とした。
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: 眠りに負けて
  rationale: 先の進行的描写が決定的な状態に至ったことを、現代日本語で自然に表した。
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: 三階から下へ落ち
  rationale: τρίστεγον を建物の第三層として「三階」、κάτω の下方への動きを「下へ」で明示した。
- source_word: ἤρθη νεκρός
  choice: 死んだまま抱き上げられた
  rationale: αἴρω の受動を、人が倒れた場所から持ち上げられる場面に即して「抱き上げられた」とした。νεκρός は不確実性を加えず、明確に「死んだ」と訳した。
theological_decisions:
- issue: νεκρόςを「仮死状態」「死んだよう」と弱めるか
  choice: 死んだまま
  alternative: 死んだような状態で／死んだものと思われて
  rationale: ギリシア語本文は不確実性を示す修飾なしに νεκρός と断定しているため、その叙述を保った。後続文との神学的・物語的緊張を訳で解消しない。
- issue: ἤρθηの具体的な動作
  choice: 抱き上げられた
  alternative: 運び上げられた／取り上げられた
  rationale: 動詞には「持ち上げる」「運び去る」の幅がある。本文では直後の身体への対応として自然な「抱き上げられた」を採用し、別の可能性を注記した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として読みやすくしながら、分詞構文の進行と転落の因果関係を保った。「死んだ」は原文どおり断定的に訳し、解釈による緩和を避けた。
