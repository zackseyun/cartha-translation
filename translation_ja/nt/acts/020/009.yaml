revisions:
- from: さて、エウティコという一人の青年が窓のところに腰掛けていた。パウロが長々と話しているうちに、彼は深い眠りに沈み、眠りに負けて三階から下へ落ち、死んだまま抱き上げられた[a]。
  to: さて、エウティコという一人の青年が窓に腰掛けていた。パウロが長く話している間に、彼は深い眠りに沈み、眠りに負けて三階から下へ落ち、死んだ状態で抱き上げられた[a]。
  rationale: 原文の叙述順序、眠りが深まって転落に至る因果関係、およびνεκρόςの断定を維持した。時間の長さを表すἐπὶ πλεῖονに評価的な響きを加えないよう「長々と」を「長く」に改め、脚注ではαἴρωの代替的な意味を空間方向を限定せずに示した。
