  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: ja
  text: 彼らは、彼が「もう彼の顔を見ることはないだろう」と語った言葉のことで、とりわけ悲しんだ。そして彼を船まで見送った。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: または「彼に付き添って船まで行った」。この動詞には、敬意を込めて同行し、送り出す意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: 深く悲しんだ
  rationale: 感情的な痛みや苦悩を表す分詞。別れの場面に合う自然な日本語とし、文脈上の主語を補って述語化した。
- source_word: μάλιστα
  choice: とりわけ
  rationale: 悲しみの最大の理由を示す語として、明瞭で品位のある現代日本語を選んだ。
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: 彼が語った言葉に
  rationale: λόγοςを「言葉」として保ち、過去完了の先行性は日本語の文脈で自然に伝わる「語った」で表した。原因を表すἐπίは「に」で簡潔に示した。
- source_word: οὐκέτι μέλλουσιν
  choice: もう…ことはないだろう
  rationale: οὐκέτιの「もはや／もう～ない」と、μέλλωが示す当時の視点からの予想・将来を「だろう」で自然に表した。「二度と」として意味を不必要に強めることは避けた。
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: 彼の顔を見る
  rationale: πρόσωπονの具体的で親密な表現を省略せず、「彼を見る」と平板化しなかった。θεωρέωはこの文脈では「見る」が自然。
- source_word: προέπεμπον
  choice: 見送った
  rationale: 同行して送り出す別れの行為を、現代日本語で自然な「見送った」とした。未完了形の継続性は場面の流れから理解できる。
- source_word: εἰς τὸ πλοῖον
  choice: 船まで
  rationale: 移動の到達点を示すεἰςを、日本語では自然な「まで」で表した。πλοῖονは航海の文脈に合う「船」とした。
