  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: ja
  text: 一行は先に行き、トロアスで私たちを待っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「この人たちは先に行って、トロアスで私たちを待っていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: 一行は
  rationale: 直前に名を挙げられた同行者たちを指す男性複数の指示代名詞。日本語では「この人たちは」より、文脈上の集団を自然に指す「一行は」とした。
- source_word: δὲ
  choice: 明示しない
  rationale: 弱い接続を示す語であり、日本語では文脈の流れだけで十分に表せるため、接続詞を補わなかった。
- source_word: προσελθόντες
  choice: 先に行き
  rationale: ここでは後続する語り手側に先行して目的地へ行ったことを表す分詞と理解し、自然な旅行叙述として訳した。
- source_word: ἔμενον
  choice: 待っていた
  rationale: 基本義は「とどまる」だが、目的語「私たち」を伴うこの文脈では到着を待つ意味になる。未完了過去の継続的な様態も表した。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 一人称複数の対格代名詞をそのまま訳した。
- source_word: ἐν Τρῳάδι
  choice: トロアスで
  rationale: 場所を表す前置詞句。現代日本語の自然な助詞「で」を用いた。
