  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: ja
  text: ただ、聖霊が町々で[a]私に証しして、「鎖と苦難が私を待ち受けている」と告げておられることだけは分かっています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「町から町へ」、または「どの町でも」とも訳せる。ギリシア語は、行く先々の町で証言が繰り返されることを表す。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本では、「私を」に当たる語の有無や位置がわずかに異なるが、鎖と苦難がパウロを待ち受けているという意味は変わらない。
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: ただ、…ことだけは
  rationale: 前節の内容に対する唯一の例外・限定を示す。日本語では文脈を補って「ことだけは分かっています」とすることで、自然にその機能を表した。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 神の霊を指す定冠詞付きの句に対する、現代日本語の標準的な訳語。
- source_word: κατὰ πόλιν
  choice: 町々で
  rationale: 単数名詞を伴うκατάの配分的用法を、場所を移すたびに繰り返される証言として簡潔に表す。「どの町でも」ほど例外のない普遍性を強調しない。
- source_word: διαμαρτύρεταί μοι
  choice: 私にはっきりと証しし
  rationale: διαμαρτύρομαιの強い証言のニュアンスと、μοιの受け手を表す。「警告する」では内容を解釈しすぎるため避けた。
- source_word: λέγον
  choice: 告げておられる
  rationale: 聖霊の証言内容を導入する現在分詞。主節と合わせ、繰り返し続く証言を自然な敬語表現で示した。
- source_word: δεσμὰ
  choice: 鎖
  rationale: 拘束や投獄を指し得るが、原語の具体的な像を保った。
- source_word: θλίψεις
  choice: 苦難
  rationale: 圧迫、苦しみ、患難を表す語。現代日本語で自然かつ重みがあり、宗派的な専門語にもなりにくい。
- source_word: με
  choice: 私を
  rationale: 採用本文では「苦難」と結びついて、鎖と苦難がパウロを待つという意味になる。
- source_word: μένουσιν
  choice: 待ち受けている
  rationale: ここでは将来パウロに用意されている、待っているという意味。「残る」より文脈に即して自然。
theological_decisions:
- issue: 「聖霊」の主体性
  choice: パウロに証しし、告げる主体として訳す
  alternative: 非人格的な霊的影響として表す
  rationale: 本文は聖霊を証言し語る主体として文法的に提示しているため、そのまま保持した。これを超える教理的説明は本文に加えていない。
- issue: πλὴν ὅτιの省略された関係
  choice: 「ことだけは分かっています」と文脈を補う
  alternative: 「ただし」とだけ訳して前節への依存を強く残す
  rationale: 前節の「何が起こるか分からない」に対する例外であることを明確にしつつ、聖霊の証言内容そのものを「分かっている」と表した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、聖書本文にふさわしい落ち着いた格調を保った。「はっきりと」はδιαμαρτύρεταιの強意を反映する。「鎖」は具体像を残し、「苦難」はθλίψειςの重さを自然に伝える。脚注記号は該当箇所と文末に配置した。
