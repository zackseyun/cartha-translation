  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: ja
  text: 彼らがパウロのもとに来たとき、パウロは彼らに言った。「私がアジア州[a]に足を踏み入れた最初の日からずっと、あなたがたと共にどのように過ごしていたか[b]は、あなたがた自身が知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アジア州」は、現代のアジア大陸ではなく、小アジア西部にあったローマ帝国の属州を指す。
    reason: cultural_note
  - marker: b
    text: 別訳「ずっとあなたがたと共にいたか」。ギリシア語の表現は、パウロの生活態度を指すとも、彼らと絶えず共にいたことを指すとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: 彼らがパウロのもとに来ると
  rationale: 移動して本人のもとに到着したことを自然な日本語で表した。日本語では代名詞だけだと指示対象が曖昧になりやすいため、文脈上の人物名「パウロ」を補った。
- source_word: Ὑμεῖς ἐπίστασθε
  choice: あなたがた自身が知っています
  rationale: 明示された主語代名詞 Ὑμεῖς の強調を「自身」で保ち、ἐπίστασθε は当人たちが実際に承知していることを示す「知っています」とした。
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: 足を踏み入れた最初の日から
  rationale: ἐπιβαίνω の「足を踏み入れる」という具体的な像と、起点を示す二つの前置詞句の働きを保った。
- source_word: εἰς τὴν Ἀσίαν
  choice: アジア州
  rationale: ここでの Ἀσία は現代の大陸ではなくローマ属州を指すため、日本語本文では誤解を避ける自然な歴史地名「アジア州」とした。
- source_word: μεθ’ ὑμῶν τὸν πάντα χρόνον
  choice: ずっとあなたがたと共に
  rationale: 全期間にわたる継続を「ずっと」で表し、μετά の共同・同伴の意味を「共に」で保った。
- source_word: πῶς ... ἐγενόμην
  choice: どのように過ごしてきたか
  rationale: 単なる所在だけでなく、彼らの間でのパウロのあり方や振る舞いも含み得る表現として訳した。ただしギリシア語の幅は注で明示した。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準語を用い、演説としての品位を保った。引用は次節へ続くため閉じかぎ括弧を置いていない。「アジア州」は日本語読者の地理的誤解を避けるため本文で明示し、注で歴史的範囲を説明した。
