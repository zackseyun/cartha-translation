  text: 私たちが集まっていた階上の部屋には、たくさんの灯火[a]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「たいまつ」とも訳せる。ギリシア語は携帯できる灯火を広く指し得るが、ここでは屋内なので「灯火」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （明示せず）
  rationale: 弱い接続辞であり、この場面描写では日本語に接続語を補わなくても文脈が自然につながる。強い対比や時間的な「さて」を不必要に持ち込まない。
- source_word: λαμπάδες
  choice: ともしび
  rationale: λαμπάςは油ランプやたいまつなどの灯火を指し得る。屋内の階上の部屋という文脈には「ともしび」が自然であり、器具そのものだけでなく点火された灯火も表せる。語義の幅は脚注に残す。
- source_word: ἱκαναὶ
  choice: たくさんの
  rationale: ここでは灯火の数が相当に多いことを表す。「十分な」ではなく、数量を自然な現代日本語で示す。
- source_word: ἐν τῷ ὑπερῴῳ
  choice: 階上の部屋には
  rationale: ὑπερῷονは家屋の上階にある部屋を指す。「階上の部屋」は明瞭で、過度に古風ではない。
- source_word: οὗ
  choice: （そこに）私たちが集まっていた
  rationale: 場所を示す関係副詞を、日本語では連体修飾「私たちが集まっていた階上の部屋」として自然に表した。
- source_word: συνηγμένοι
  choice: 集まっていた
  rationale: 完了受動分詞が表す、集まった結果その場に会している状態を、文脈に即して自然に表す。
- source_word: ἦσαν ... ἦμεν
  choice: ともっていた……集まっていた
  rationale: 二つの未完了過去形による背景描写を「～ていた」で表した。最初のἦσανは日本語では存在の「あった」よりも、灯火の自然な状態描写「ともっていた」とした。
