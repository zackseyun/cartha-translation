  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: ja
  text: しかし私たちは、種なしパンの祭りの期間が終わってからフィリピを船で出発し、五日でトロアスにいる彼らのもとに着いた。そこで七日間滞在した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: 船で出発し
  rationale: ἐκπλέωが船による出航を表すため。現代日本語として自然で、出発地から船で発ったことを明確にする。
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: 種なしパンの祭りの期間が終わってから
  rationale: 字義は「種なしパンの日々の後」。ユダヤの祭りの期間を指すことを明確にしつつ、期間終了後という時間関係を自然な日本語で示す。
- source_word: ἀπὸ Φιλίππων
  choice: フィリピを
  rationale: 日本語では移動動詞「出発する」とともに起点を「を」で示すのが自然である。地名は慣用表記「フィリピ」とする。
- source_word: ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα
  choice: トロアスにいる彼らのもとに着いた
  rationale: πρὸς αὐτούςの人物への到達と、εἰς τὴν Τρῳάδαの目的地を一つの自然な日本語表現にまとめる。「合流した」という文脈上の含意は訳文に加えない。
- source_word: ἄχρι ἡμερῶν πέντε
  choice: 五日で
  rationale: 到着までの旅程の所要期間を示す表現として簡潔で自然。「五日以内に」では五日未満も含む期限表現に聞こえやすいため避ける。
- source_word: οὗ
  choice: そこで
  rationale: 直前のトロアスを受ける場所の関係副詞を、文を分けた自然な日本語で表す。
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: 七日間滞在した
  rationale: διατρίβωの旅行文脈での「その場所にとどまる」という意味と期間を、明瞭で品位ある現代日本語で表す。
theological_decisions: []
