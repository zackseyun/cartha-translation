  text: こう言ってから、パウロは皆とともにひざまずいて祈った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （独立した訳語を置かず、文脈上「こう言ってから」に含める）
  rationale: 物語を継続する単純な接続辞。日本語では冒頭の「そして」を省くほうが自然であり、出来事の連続性は後続の表現で十分に示される。
- source_word: ταῦτα εἰπὼν
  choice: こう言ってから
  rationale: アオリスト分詞は主動詞に先立つ行為を表す。「こう」は直前の発言を自然に指し、「言ってから」は時間的順序を明確に伝える。
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: ひざまずいて
  rationale: 直訳すれば「自分のひざを置いて」だが、ひざまずく動作を表す慣用表現。「ひざまずいて」は誇張なく自然に意味を伝える。
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: 皆とともに
  rationale: σύν＋与格は同伴を示し、πᾶσινはその場の全員を強調する。「皆とともに」は簡潔で品位のある現代日本語。
- source_word: προσηύξατο
  choice: 祈った
  rationale: 祈ることを表す標準的な動詞であり、アオリストの出来事を自然な過去形で訳す。
- source_word: αὐτοῦ（θεὶς τὰ γόνατα αὐτοῦ）
  choice: パウロは
  rationale: ギリシャ語では代名詞により直前から継続する主語を示すが、日本語で「彼は」とするより、談話上の主語パウロを明示したほうが単独の節としても明瞭である。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「ともに」により共同の祈りであることを保ちつつ、原文にない情緒や儀礼的含意は加えていない。
