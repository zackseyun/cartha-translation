  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: ja
  text: 週の初めの日[a]、パンを裂くために私たちが集まっていたとき、パウロは翌日に出発する予定だったので、人々に語りかけており、その話を真夜中まで続けた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の慣用表現で、「週の第一日」、すなわち日曜日を指す。
    reason: idiom_clarification
  - marker: b
    text: 「パンを裂く」は、共に食事をすることを指す場合があり、主の晩餐を含意する場合もある。
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: 週の初めの日
  rationale: 「週の第一日」を意味するコイネー・ギリシア語の慣用表現。現代日本語として明瞭で、安息日そのものとの誤解を避ける。δέの弱い接続は、日本語では文脈上あえて明示しない。
- source_word: συνηγμένων ἡμῶν
  choice: 私たちが……集まっていたとき
  rationale: 属格独立構文が示す背景的状況と、一人称複数の語りを保持する。
- source_word: κλάσαι ἄρτον
  choice: パンを裂くために
  rationale: 目的を表す不定詞を明示しつつ、共同の食事と主の晩餐の含みの双方を残す原文の慣用句を保持する。
- source_word: διελέγετο αὐτοῖς
  choice: 人々に語りかけ
  rationale: 未完了過去の継続性は後続の「続けた」と合わせて表し、διαλέγομαιの対人的な語りを自然な日本語にする。αὐτοῖςは集まった人々を指すが、それ以上に限定しない。
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: 翌日に出発することになっていたので
  rationale: μέλλωの近接した予定を表し、分詞が文脈上持つ理由の含みも自然に示す。「出て行く」より旅行文脈に適した「出発する」を用いる。
- source_word: παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου
  choice: 話を真夜中まで続けた
  rationale: παρατείνωの「長く延ばす」とλόγοςの発話内容を、過度に説教用語へ限定せず簡潔で自然に表す。
theological_decisions:
- issue: 「パンを裂く」の意味
  choice: 「パンを裂く」と訳し、意味を限定しない
  alternative: 「主の晩餐を行う」／「食事を共にする」
  rationale: 使徒言行録におけるこの表現は共同の食事を指し得ると同時に、主の晩餐の含みも持ち得る。本文が明示しない教派的な限定を避ける。
- issue: μέλλων以下とパウロの発話との論理関係
  choice: 「翌日に出発することになっていたので」と理由の含みを示す
  alternative: 「翌日に出発するつもりで」と付帯状況として訳す
  rationale: 分詞は文法上、意図・予定を述べながら、話を長く続けた事情も示し得る。日本語本文では自然な因果関係を示しつつ、脚注で付帯状況的な訳を掲げる。
translation_notes:
  register: 明瞭な現代標準日本語。叙事文として落ち着いた格調を保ち、「パンを裂く」という初期キリスト教的慣用表現は解釈を狭めずに残した。
