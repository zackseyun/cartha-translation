id: ACT.20.1
reference: Acts 20:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: ja
  text: 騒動が収まった後、パウロは弟子たちを呼び寄せ、彼らを励まし、別れの挨拶をして[a]、マケドニアへ向けて出発した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「挨拶をして」。このギリシア語は通常、挨拶することを意味するが、出発の場面では別れの挨拶をすることも表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: 騒動が収まった後
  rationale: μετάと冠詞付き不定詞による時間表現を自然な日本語で示した。θόρυβοςは直前のエフェソでの群衆騒動を指すため、「騒動」とした。
- source_word: μεταπεμψάμενος
  choice: 呼び寄せ
  rationale: 人を遣わして自分のもとに来させるという中動態の意味を、簡潔で自然な日本語にした。
- source_word: τοὺς μαθητὰς
  choice: 弟子たち
  rationale: 使徒言行録でイエスに従う者を指すルカの用語を保持した。
- source_word: παρακαλέσας
  choice: 彼らを励まし
  rationale: παρακαλέωには勧告、慰め、励ましの幅がある。騒動後の別れという文脈で、意味を過度に限定しない「励ます」を選んだ。
- source_word: ἀσπασάμενος
  choice: 別れの挨拶をして
  rationale: 基本義は挨拶することだが、出発の文脈では別れを告げる行為を表し得る。文脈上の含意を自然に表しつつ、脚注で語義の幅を示した。
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: マケドニアへ向けて出発した
  rationale: ἐξέρχομαιと移動を表す不定詞の連なりを、目的地への出立として簡潔かつ自然に訳した。
