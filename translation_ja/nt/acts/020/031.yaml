    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の警告を受けた結論であることを、自然な現代日本語で示す。
- source_word: γρηγορεῖτε
  choice: 目を覚ましていなさい
  rationale: 現在命令形が表す継続的な警戒を保ち、聖書的な比喩も伝わる表現とした。
- source_word: μνημονεύοντες
  choice: 覚えていなさい
  rationale: 分詞を日本語では並列する命令として自然に表しつつ、警戒する際にパウロの模範を心に留めるというつながりを保った。
- source_word: τριετίαν
  choice: 三年の間
  rationale: 時間の広がりを表す対格を、自然な期間表現にした。
- source_word: νύκτα καὶ ἡμέραν
  choice: 夜も昼も
  rationale: 原文の語順を保ちながら、絶え間ない働きを自然に表す。
- source_word: οὐκ ἐπαυσάμην
  choice: 戒め続けた
  rationale: 否定を伴うπαύομαιの『やめなかった』という継続性を、日本語では補助動詞『続けた』によって簡潔に表した。
- source_word: μετὰ δακρύων
  choice: 涙を流しながら
  rationale: 直訳的な『涙とともに』より自然で、パウロの深い感情を明確に伝える。
- source_word: νουθετῶν
  choice: 戒め
  rationale: 思いに働きかける教えと矯正的な警告の両面を含み得る語として、簡潔で尊厳ある日本語を選んだ。
- source_word: ἕνα ἕκαστον
  choice: 一人一人を
  rationale: 個々人に向けられたパウロの配慮を示す分配的な強調を保った。
theological_decisions:
- issue: νουθετῶνの牧会的な意味合い
  choice: 戒め
  alternative: 警告し／諭し
  rationale: 単なる情報伝達でも危険の告知だけでもなく、矯正と教えを伴う個人的な働きという幅を保つため。
translation_notes:
  register: 明瞭で現代的かつ格調を保つ文体。原文の継続的警戒、三年間にわたる不断の働き、涙を伴う個人的な牧会の重みを自然な日本語で表した。
