id: ACT.20.24
reference: Acts 20:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: ja
  text: しかし、私は自分の命を少しも惜しいとは思いません。[a] ただ、自分の走る道のり[b]を走り終え、主イエスから受けた務め、すなわち神の恵みの福音を証しする[c]務めを果たすことができさえすればよいのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の魂を、自分にとって大切なものとは思いません」とも訳せる。ここでは、使命を果たすためには死をも辞さないという文脈から「命」とした。
    reason: lexical_alternative
  - marker: b
    text: 「自分の競走」とも訳せる。ギリシア語は、完走すべき道のりや競走を指す。
    reason: lexical_alternative
  - marker: c
    text: 「証言する」、または「厳かに証言する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: 自分の命を少しも惜しいとは思いません
  rationale: 「自分にとって価値あるものと見なさない」という評価の意味を保ちつつ、死をも辞さない文脈に合う自然な現代日本語とした。命そのものに客観的価値がないと言っているような誤解も避ける。
- source_word: ψυχήν
  choice: 命
  rationale: ここでは非物質的な「魂」よりも、苦難や死に直面しているパウロの地上の生命を指す。
- source_word: ὡς τελειῶσαι
  choice: 最後まで果たすことができさえすればよい
  rationale: 圧縮された構文が表す、これこそがパウロの最大の願いであるという限定的・目的的な力を自然に示す。
- source_word: δρόμον
  choice: 走る道のり
  rationale: 完走を目指す競走または進むべき行程の比喩を保ち、「走路」のような硬さを避けた。
- source_word: διακονίαν
  choice: 務め
  rationale: 主イエスから委ねられた奉仕・使命を、教会用語に過度に限定せず明確に表す。
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: 主イエスから受けた
  rationale: 属格を伴う παρά が示す源を明確にし、κύριος を称号「主」として保持する。
- source_word: διαμαρτύρασθαι
  choice: 証しする
  rationale: 真剣かつ厳粛に証言する意味を、一般読者にも理解しやすい表現で示す。
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: 神の恵みの福音
  rationale: 属格連鎖を保ち、福音が神の恵みによって特徴づけられるのか、神の恵みを内容とするのかを一方に限定しない。
theological_decisions:
- issue: ψυχή が指すもの
  choice: 命
  alternative: 魂
  rationale: この箇所の焦点は、使命を全うするために死をも恐れない姿勢であり、身体と魂の区別ではない。
- issue: ὡς τελειῶσαι の力
  choice: できさえすればよい
  alternative: 果たすためです
  rationale: 単なる目的だけでなく、ほかのことを顧みないパウロの切なる願いを表す一方、原文の圧縮された構文を教理的に解消しない。
- issue: τῆς χάριτος τοῦ θεοῦ の属格関係
  choice: 神の恵みの福音
  alternative: 神の恵みについての福音
  rationale: 原文が許す「恵みを内容とする福音」と「恵みによって特徴づけられる福音」の含みを残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「惜しいとは思いません」と「できさえすればよい」により、自己軽視ではなく使命を最優先する発言として自然に読めるようにした。「務め」「福音」「恵み」は広く定着した語として用いた。
