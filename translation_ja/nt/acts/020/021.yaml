  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: ja
  text: 神に対する悔い改めと、私たちの主イエスへの信仰[a]について、ユダヤ人にもギリシア人にも、厳粛に証言してきました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの主イエスへの信頼」。
    reason: πίστιςはここで「信仰」とも、人格的な「信頼」とも訳し得るため。
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: 厳かに証ししてきました
  rationale: 単なる報告ではなく、重みをもって強く証言する語感を「厳かに証しする」で表した。分詞は直前の文脈に従い、日本語では継続的な過去の行為として自然に整えた。
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: ユダヤ人にもギリシア人にも
  rationale: τε καὶ の包括的な対応を「にも……にも」で示し、Ἕλληνεςを一般化して「異邦人」とせず、ルカの語を保って「ギリシア人」とした。
- source_word: μετάνοιαν
  choice: 悔い改め
  rationale: 単なる考え直しではなく、道徳的・霊的な方向転換を含む新約聖書上の意味を、現代日本語で定着した「悔い改め」で表した。
- source_word: εἰς θεόν
  choice: 神に向かう
  rationale: εἰς が示す方向性を保ち、悔い改めが神を目指して向きを変えることであることを表した。
- source_word: πίστιν
  choice: 信仰
  rationale: ここでは対象が明示されており、「信仰」が自然で格調を保つ。「信頼」も可能なので脚注に残した。
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: 私たちの主イエスへの
  rationale: πίστιςと結び付くεἰςを、日本語で信仰の対象を自然に示す「への」とした。κύριοςはキリスト論的な称号を保って「主」とした。
theological_decisions:
- issue: πίστιςの訳語
  choice: 私たちの主イエスへの信仰
  alternative: 私たちの主イエスへの信頼
  rationale: イエスが信仰の対象として明示されるため、本文では伝統的かつ自然な「信仰」を採用した。ただし、人格的に信頼する含意も語義上可能なので脚注に示した。
- issue: μετάνοια εἰς θεόνの方向性
  choice: 神に向かう悔い改め
  alternative: 神に対する悔い改め
  rationale: εἰςの方向性を明示しつつ、「神に立ち返る」とまで意味を補わず、原文の簡潔さと神学的含みを保った。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、「主」「悔い改め」「厳かに証しする」によって聖書本文にふさわしい品位を保った。原文の「神へ」と「主イエスへ」という並行する方向性が見える語順にした。
