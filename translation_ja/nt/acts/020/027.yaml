  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: ja
  text: 私は、神のご計画全体をあなたがたに告げることをためらわなかったからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神のみ旨全体」または「神のご意図全体」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ὑπεστειλάμην
  choice: 私は……ためらわなかったからです
  rationale: γάρが前節の内容の根拠を示すことを「からです」で自然に表した。ὑποστέλλωの中動態は、ある行為から身を引く、尻込みする意だが、現代日本語では「ためらわなかった」が文脈に適し、20節との表現上の対応も保てる。
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: 告げることを
  rationale: 否定を伴う冠詞付き不定詞は、ὑποστέλλωの内容を示す。「告げる」はἀναγγέλλωの報告・宣言の意味を、教えを伝えるこの文脈で明瞭かつ自然に表す。
- source_word: πᾶσαν
  choice: すべてを
  rationale: 単数のβουλή全体を余すところなく告げたという完全性を表す。
- source_word: τὴν βουλὴν τοῦ θεοῦ
  choice: 神のご計画
  rationale: βουλήは熟慮された意図、目的、計画、み旨を表し得る。「ご計画」は現代日本語で自然かつ荘重であり、神の救いの意図を狭く限定しすぎない。敬意を示す接頭辞「ご」を用いた。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 告げる相手であるエフェソの長老たちへの複数二人称を明示する。
theological_decisions:
- issue: βουλή τοῦ θεοῦの意味範囲
  choice: 神のご計画
  alternative: 神のみ旨／神のご意図
  rationale: βουλήは神の定め、救いの目的、意志などにまたがる語である。「ご計画」を本文に採用しつつ、脚注で「み旨」「ご意図」を示して、本来の意味の幅と神学的緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話的になりすぎない品位を保った。「ためらわなかった」は理解しやすさを優先しつつ、行為から身を引かなかったという原文の含意を伝える。
