  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: ja
  text: それからパウロは上に戻り、パンを裂いて[a]食べ、夜明けまで長い間話をしてから、こうして出発した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「パンを裂く」という表現は、共に食事をすることを指す場合がある。ここでは主の晩餐も含まれていたと理解する人もいる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναβὰς
  choice: 上に戻り
  rationale: 直訳は「上って」だが、直前にパウロが階下へ降りたという物語の流れを踏まえ、元いた上階へ戻る動きを自然な日本語で表した。
- source_word: κλάσας τὸν ἄρτον
  choice: パンを裂いて
  rationale: 定冠詞を伴う具体的な動作を保ちつつ、通常の食事か主の晩餐かを本文で決めつけない表現とした。
- source_word: γευσάμενος
  choice: 食べた
  rationale: γεύομαι は字義的には「味わう」だが、食事の文脈では食物を口にすること、食事をすることを表し得る。「味見した」という不自然な含みを避けた。
- source_word: ἐφ’ ἱκανόν
  choice: 長い間
  rationale: 相当な時間の継続を表す慣用句を、明瞭で自然な現代日本語にした。
- source_word: ὁμιλήσας
  choice: 語り合い
  rationale: 一方向の説教と断定せず、長く話すことや会話することを表す語の相互的なニュアンスを反映した。
- source_word: ἄχρι αὐγῆς
  choice: 夜明けまで
  rationale: αὐγή の時間的意味を簡潔かつ自然に表した。
- source_word: οὕτως ἐξῆλθεν
  choice: こうして出発した
  rationale: οὕτως が直前までの一連の出来事を受けることを「こうして」で残し、ἐξῆλθεν は文脈に即して「出発した」とした。
theological_decisions:
- issue: κλάσας τὸν ἄρτον が主の晩餐を明示するか
  choice: 「パンを裂いて」と中立的に訳した。
  alternative: 「主の晩餐を行い」など、聖餐を明示する訳。または単なる共同の食事と明示する訳。
  rationale: 使徒言行録においてこの表現は主の晩餐を連想させ得るが、本節だけでは通常の食事や食卓の交わりを排除できない。原文の神学的な余地を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「語り合い」により会話・談話の性格を残し、「こうして」によって原文の叙述上のつながりも保持した。
