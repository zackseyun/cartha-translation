  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: ja
  text: 私は、あらゆる謙遜と涙と、ユダヤ人たち[b]の陰謀によって私の身に降りかかった試練[a]の中で、主に仕えてきました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」または「試み」とも訳せる。ここでは、反対者の陰謀から生じた外的な苦難を指す。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「ユダヤ人たち」とは、パウロに陰謀を企てた特定のユダヤ人の反対者たちを指し、すべてのユダヤ人について述べたものではない。
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: 仕え
  rationale: 現在分詞は、パウロが継続して主に献身的に奉仕してきたあり方を表す。日本語では「仕える」が自然で、奴隷身分を不必要に前面化しない。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: κύριοςの称号をそのまま保ち、指示対象を本文以上に限定しない。
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: あらゆる謙遜をもって
  rationale: πάσηςの包括的・強意的な力と、μετάが示す奉仕の姿勢を保つ。
- source_word: δακρύων
  choice: 涙を流し
  rationale: 具体的な複数名詞「涙」の情感を保ちつつ、現代日本語として自然な表現にした。
- source_word: πειρασμῶν
  choice: 試練
  rationale: この文脈では罪への内的誘惑より、敵対者の陰謀から生じた外的な苦難を指す。語が持ち得る別の意味は脚注で示す。
- source_word: τῶν συμβάντων μοι
  choice: 私の身に降りかかった
  rationale: パウロに起きた試練であることを、明瞭かつ自然な日本語で表す。
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: 陰謀によって
  rationale: ἐνはここで、試練が生じた事情ないし手段を示すと理解できるため、因果・手段的な関係を明確にした。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人たちの
  rationale: 語の通常の意味を保持する。ただし、文脈上はパウロに陰謀を企てた特定の反対者たちであり、全ユダヤ人を指すものではないことを脚注で明示する。
theological_decisions:
- issue: 「ユダヤ人たち」を反ユダヤ的に一般化して読む可能性
  choice: 本文では原語どおり「ユダヤ人たち」とし、脚注で特定の反対者を指すと説明する
  alternative: ユダヤ人の指導者たち／ユダヤ地方の人々
  rationale: Ἰουδαίων自体は指導者に限定されず、この離散地での対立という文脈では「ユダヤ地方の人々」も適切でない。原文の表現を保ちながら、その指示範囲を文脈に即して限定する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「あらゆる謙遜」で原文の強意を保ち、「涙を流し」で自然な日本語にした。文として成立させるため、現在分詞の連続を「歩んできました」にまとめた。脚注記号[a][b]は本文中に配置した。
