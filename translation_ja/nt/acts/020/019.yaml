- from: あらゆる謙遜をもって主に仕え、涙を流し、ユダヤ人たちの陰謀によって私の身に降りかかった試練[a]の中を歩んできました[b]。
  to: 私は、あらゆる謙遜と涙と、ユダヤ人たち[b]の陰謀によって私の身に降りかかった試練[a]の中で、主に仕えてきました。
  rationale: 原文の現在分詞δουλεύωνを「主に仕えてきました」として文の中心に保ち、謙遜・涙・試練をその奉仕に伴う状況として自然に接続した。「歩む」という追加比喩を除き、試練の語義に関する注記と、「ユダヤ人たち」が全ユダヤ人への一般化ではないことを示す注記を維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:07Z'
