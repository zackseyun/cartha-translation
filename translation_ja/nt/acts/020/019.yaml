  naturalness: 現代標準日本語として「試練の中で、主に仕えてきました」は自然で明瞭であり、原文の「仕える」ことを、謙遜・涙・試練に伴われた奉仕として表せる。
  terminology: 「主」「謙遜」「試練」は文脈と標準的な聖書日本語の用法に適する。「ユダヤ人たち」は原語の語彙的対応を保ち、特定の敵対者をいうとの注記も必要かつ適切である。
