source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: ja
  text: そして今、よく聞いてください。私は知っています。神の国を宣べ伝えながら皆さんの間を巡り歩いた皆さんは、もう二度と私の顔を見ることがないでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: そして今、見なさい
  rationale: 談話の転換を示す「そして今」と、注意を促す命令的間投詞「見なさい」によって、原文の強い呼びかけを保った。
- source_word: διῆλθον
  choice: 巡り歩いた
  rationale: 各地を通って活動したという移動の広がりを自然な日本語で表した。
- source_word: κηρύσσων
  choice: 宣べ伝えながら
  rationale: 公に告げ知らせる継続的な活動を示し、分詞と主動詞の同時的関係も保った。
- source_word: τὴν βασιλείαν
  choice: 御国
  rationale: 定冠詞を伴う「王国／支配」を、文脈上神の国を指す簡潔で尊厳ある慣用表現とした。原文には「神の」が明示されないため補わなかった。
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: もはや私の顔を見ることがないでしょう
  rationale: 「もはや」と未来形を反映し、再会しないことを表す原文の顔を見るという表現を維持した。
theological_decisions:
- issue: 「御国」の指示対象
  choice: 原文どおり「神の」を明示せず「御国」とした
  alternative: 「神の国」
  rationale: 使徒言行録の文脈では神の国を指すが、この節のギリシア語本文は単に「その国／御国」としているため、明示的な補足を避けた。
- issue: パウロの確信の強さ
  choice: 「私は知っています」と断定的に訳した
  alternative: 「私は思っています」
  rationale: οἶδα は認識・確信を明確に表すため、その強さを弱めなかった。
translation_notes:
  register: 現代標準日本語による、明快で尊厳ある公的な語り口。「見よ」ではなく「見なさい」として現代の読者に通じやすくしつつ、ἰδοὺ の注意喚起を省略しなかった。
