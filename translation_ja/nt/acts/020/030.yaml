source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: ja
  text: あなたがた自身の中からも、曲がったことを語り、自分たちに従わせるために弟子たちを引き離そうとする男たちが現れます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ゆがめられたこと」または「倒錯したこと」とも訳せる。
    reason: διεστραμμέναは「曲げられた／ゆがめられた事柄」を指し、真理や正しい道からの逸脱を広く表す。
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: あなたがた自身の中からも
  rationale: ἐξと強意のαὐτῶνにより、脅威が共同体内部から生じることが強調されているため。「自身の中から」でその強意を保った。
- source_word: ἀναστήσονται
  choice: 現れます
  rationale: ここでの未来形は、人々が立ち上がるという身体動作よりも、共同体内に出現することを表す。「現れます」は自然な現代日本語で予告の意味を伝える。
- source_word: ἄνδρες
  choice: 者たち
  rationale: ギリシア語は男性を指すが、日本語で「男たちが現れる」とすると性別そのものへの不自然な強調が生じる。この文脈では内部から現れる人物を自然に表し、複数性は「者たち」で保持した。
- source_word: λαλοῦντες διεστραμμένα
  choice: 曲がったことを語って
  rationale: διεστραμμέναは、真っすぐなものから逸脱し、ゆがめられた事柄を広く指す。「曲がったこと」は比喩の力を保ち、特定の異端内容に限定しない。
- source_word: τοῦ ἀποσπᾶν
  choice: 引き離そうとする
  rationale: 属格冠詞付き不定詞の目的的意味と、ἀποσπάωの分離させる比喩をともに表した。
- source_word: τοὺς μαθητὰς
  choice: 弟子たち
  rationale: 使徒言行録におけるイエスの弟子・従う者を表す定着した用語として訳した。
- source_word: ὀπίσω ἑαυτῶν
  choice: 自分たちの後に
  rationale: 追随・忠誠を示す慣用表現。「自分たちの後に」により、彼らが自分への追随者を作ろうとする意味を保つ。
theological_decisions:
- issue: 偽教師たちが語る内容の性質
  choice: 曲がったこと
  alternative: ゆがんだこと／邪悪なこと
  rationale: 原文は教理的または道徳的な逸脱を広く警告しており、特定の異端や罪に限定していない。「曲がったこと」はその幅と比喩を保つ。
- issue: ἄνδρεςの性別表現
  choice: 者たち
  alternative: 男たち
  rationale: 原語は男性名詞だが、日本語の「男たち」は性別を対照的に強調しやすい。文脈上の人物指示を自然に伝えることを優先し、性別を否定する語には置き換えず「者たち」とした。
- issue: 弟子たちを離反させる意図
  choice: 自分たちの後に引き離そうとする
  alternative: 自分たちに従わせるために弟子たちを引き離す
  rationale: 目的は明示しつつ、何から引き離すのかを訳文で補わず、原文の省略と緊張を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。文脈上、長老たちへの直接の警告であることを「あなたがた自身」で強調した。脚注記号は該当節末に配置した。
