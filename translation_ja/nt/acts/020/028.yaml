revisions:
- from: あなたがた自身と群れ全体に、よく注意を払いなさい。聖霊は、その群れの中であなたがたを監督者に任命されました。それは、神がご自分の御子の血によってご自分のものとされた、神の教会[a]を牧するためです。[b]
  to: あなたがた自身と群れ全体に、よく注意を払いなさい。聖霊は、その群れの中にあなたがたを監督者として任命し、神の教会[a]を牧するようにされました。その教会は、神がご自分の御子[b]の血によってご自分のものとされたものです。
  rationale: 聖霊を任命の行為者とする原文の構文を回復し、監督者を任命することの目的が神の教会を牧することにあると明示しました。神が教会を獲得したという関係節は独立した文にして、日本語の係り受けの曖昧さを避けました。τοῦ ἰδίουを本文では「御子」と明瞭に訳しつつ、その補いと伝統的な別解を該当箇所の脚注に残しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:14Z'
review_pass:
  verdict: revise
  source_fidelity: 冒頭の命令、群れ、聖霊による任命、監督者、牧する務め、神の教会、血を通した獲得という要素はおおむね適切です。しかし「聖霊は…任命されました」は受け身となっており、原文の能動態（聖霊が任命した）を反転させています。また「それは…牧するためです」は、教会を牧する主体が監督者であるという原文の目的構文を不明瞭にしています。
  naturalness: 「聖霊は…任命されました」は現代日本語としても不自然で、意図する意味にもなりません。二文目を「任命し、…牧するようにされました」として、任命と目的を自然かつ明確に結びます。「牧する」は教会的文脈で定着した語として維持できます。
  terminology: 「監督者」「神の教会」「御子」「血」は適切です。「ご自分の御子」はτοῦ ἰδίουの有力な理解を明瞭な日本語で表すものですが、原文が「御子」と明記しない点、および「ご自身の血」という伝統的理解は脚注で保持すべきです。本文異読「主の教会」の脚注も適切です。
  issues:
  - severity: high
    issue: 「聖霊は、その群れの中であなたがたを監督者に任命されました」が受け身である
    rationale: ἔθετοは能動態であり、聖霊があなたがたを監督者として置いた／任命した、という意味です。日本語の「任命されました」は聖霊が任命を受けた意味になり、主語と行為者を逆転させます。
  - severity: medium
    issue: 「それは、神が…神の教会を牧するためです」が牧する主体と目的関係を曖昧にする
    rationale: ποιμαίνεινは聖霊が監督者として置いた人々に課される目的・務めです。神が教会を獲得したことは関係節であり、神が牧するためという意味ではありません。
  revised_text: あなたがた自身と群れ全体に、よく注意を払いなさい。聖霊は、その群れの中にあなたがたを監督者として任命し、神の教会[a]を牧するようにされました。その教会は、神がご自分の御子[b]の血によってご自分のものとされたものです。
