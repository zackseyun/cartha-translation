id: ACT.20.28
reference: Acts 20:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: ja
  text: あなたがた自身と群れ全体に、よく注意を払いなさい。聖霊は、その群れの中にあなたがたを監督者として任命し、神の教会[a]を牧するようにされました。その教会は、神がご自分の御子[b]の血によってご自分のものとされたものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「神の教会」ではなく、「主の教会」とあります。
    reason: textual_variant
  - marker: b
    text: 原文を直訳に近く訳すと「ご自分の者の血によって」です。「御子」は原文に明記されていませんが、そのように理解できます。伝統的には「ご自身の血によって」とも訳されます。
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: よく注意を払いなさい
  rationale: 継続的な警戒を求める現在命令の力を、現代日本語で自然に表した。軍事的な響きの強い「警戒せよ」は避けた。
- source_word: παντὶ τῷ ποιμνίῳ
  choice: 群れ全体
  rationale: ποίμνιον の牧会的比喩を「群れ」として保ち、παντί を「全体」で明示した。
- source_word: ἐν ᾧ
  choice: その群れの中で
  rationale: 監督者たちが群れの外に立つのではなく、その中に置かれたという位置関係を保った。
- source_word: ἔθετο
  choice: 任命されました
  rationale: ここでの τίθημι は、ある役割に据えることを意味するため、「置かれた」より職務上の意味が明確な「任命」を用いた。
- source_word: ἐπισκόπους
  choice: 監督者
  rationale: 後代の特定の教会制度を前提とする称号を避け、見守り指導する役割を表す語を選んだ。
- source_word: ποιμαίνειν
  choice: 牧する
  rationale: 羊の群れを世話するという原文の比喩を保ちつつ、教会について用いられる品位ある日本語とした。
- source_word: τὴν ἐκκλησίαν τοῦ θεοῦ
  choice: 神の教会
  rationale: 本文の θεοῦ に従った。κύριου（主の）という重要な異読は脚注に示した。
- source_word: περιεποιήσατο
  choice: ご自分のものとされた
  rationale: 中動態が示す「自分のために獲得する」という意味を自然な日本語で表し、商取引の比喩を必要以上に強める「買い取る」は避けた。
- source_word: διὰ τοῦ αἵματος
  choice: 血によって
  rationale: διά＋属格の手段・媒介を表し、犠牲と贖いに関わる「血」という表現をそのまま保った。
- source_word: τοῦ ἰδίου
  choice: ご自分の御子の
  rationale: ἴδιος を名詞的に「ご自分の者」と理解し、その指示対象を自然な日本語で「御子」と補った。原文に「御子」が明記されていないことと、伝統的な別解は脚注で明示した。
theological_decisions:
- issue: τοῦ αἵματος τοῦ ἰδίου の指示対象と構文
  choice: ご自分の御子の血によって
  alternative: ご自身の血によって／ご自分の者の血によって
  rationale: 「ご自分の者の血」という逐語訳は日本語では未完結で意味が取りにくい。ἴδιος を名詞的に用いた「ご自分の者」、すなわち御子への言及と理解して本文を自然にしつつ、「御子」は原文に明記されていないこと、および「ご自身の血」という伝統的理解を脚注に残し、神学的な緊張を隠さなかった。
- issue: τοῦ θεοῦ の本文異読
  choice: 神の教会
  alternative: 主の教会
  rationale: 指定されたSBLGNT本文の θεοῦ を採用し、κύριου を読む写本の異読を脚注に保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令と牧会的比喩の品位を保った。「監督者」「牧する」は教会的文脈に適した語だが、後代の特定教派の制度を読み込まないようにした。本文中の脚注記号[a][b]は、それぞれ対応箇所に配置した。
