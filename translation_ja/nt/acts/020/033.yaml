  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: ja
  text: 私は、だれの銀も金も衣服も欲しませんでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου
  choice: 銀
  rationale: 金や衣服と並ぶ具体的な財物として、原語の字義と列挙の形を保つ。
- source_word: χρυσίου
  choice: 金
  rationale: 銀、衣服と並ぶ価値ある所有物を表す自然で直接的な訳。
- source_word: ἱματισμοῦ
  choice: 衣服
  rationale: 現代日本語で自然かつ明瞭であり、財物の一つとしての衣類を広く表せる。
- source_word: οὐδενὸς
  choice: だれの～も
  rationale: 属格の所有関係を日本語で明示し、他人の財物を意味することを自然に表す。
- source_word: ἐπεθύμησα
  choice: 欲しがりませんでした
  rationale: 文脈上の不正な物欲を示しつつ、「むさぼる」ほど解釈を強めすぎない、明瞭な現代語表現。
- source_word: ἢ ... ἢ ... ἢ
  choice: ～も～も～も
  rationale: 否定文における反復的な列挙を、日本語として自然な形で保持する。
theological_decisions:
- issue: 物質的所有物に関するἐπιθυμέωの倫理的含意
  choice: 「欲しがる」と訳し、他人の財物を求める否定的な文脈を表す。
  alternative: 「むさぼる」または「欲する」
  rationale: パウロが金銭的利得を求めなかったことを弁明する文脈に合う。「むさぼる」は倫理的非難をより強く明示し、「欲する」は現代の日常語としてやや硬いため、本文では「欲しがる」を採用し、語義の幅を脚注で示す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、銀・金・衣服という具体的な三項列挙と、過去の自己証言としての時制を保った。
