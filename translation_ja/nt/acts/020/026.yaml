  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: ja
  text: ですから、私は今日、あなたがたに証言します。私はすべての人の血について責任がありません[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「すべての人の血から清い」。このギリシア語の言い回しは、他者について罪や責任を負わないことを意味します。
    reason: lexical_alternative
  - marker: b
    text: この表現は、血の責任を問われる見張り人についてのエゼキエル書の描写を踏まえていると考えられます（エゼキエル3:18–19、33:6–9参照）。
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: ですから
  rationale: 直前の発言から結論を導く接続を、現代日本語で自然に示す。
- source_word: μαρτύρομαι
  choice: 証言します
  rationale: 厳粛な自己証言という語感を保つ。
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: 今日この日に
  rationale: 単なる「今日」よりも原文の荘重で証言的な言い回しを映す。
- source_word: καθαρός εἰμι ἀπὸ τοῦ αἵματος πάντων
  choice: 私はすべての人の血について責任がありません
  rationale: 「血から清い」という原文の比喩が示す、他者に関する罪責・責任を負わないという意味を、明瞭な現代日本語で表す一方、「血」を残して聖書的な響きを保つ。
- source_word: πάντων
  choice: すべての人
  rationale: 文脈上、人々を指す男性複数属格の広い範囲を自然に明示する。
theological_decisions:
- issue: 「すべての人の血から清い」の意味
  choice: パウロは警告し教える務めを果たしたため、他者の滅びについて責任を負わないという意味
  alternative: 誰かの肉体的な死に直接加担していないという限定的な意味
  rationale: 直後の「神のご計画のすべて」を告げたとの説明、およびエゼキエルの見張り人の血責任という背景に合致する。ただし「血」を本文に残し、比喩と聖書間の響きを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「今日この日に」「証言します」によって原文の厳粛さを保った。「血について責任がありません」は日本語として理解しやすく、原文の血責任の比喩も残す。
