  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: ja
  text: そして、そこから船出して、翌日、キオス島の向かい[a]に着いた。その次の日にはサモス島に寄港し[b]、さらにその翌日、ミレトスに着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キオス島の沖合」とも訳せる。ギリシア語は島の向かいに位置したことを示し、必ずしも上陸したことを意味しない。
    reason: lexical_alternative
  - marker: b
    text: 「サモス島に船を寄せた」とも訳せる。航海で船を岸や港につけ、立ち寄ることを表す語。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: そこから
  rationale: καίとἐκεῖθενの融合形。日本語では前後の旅程の連続が文脈から明らかなため、自然な「そこから」で出発点を示した。
- source_word: ἀποπλεύσαντες
  choice: 船出し
  rationale: 航海に出ることを表すアオリスト分詞であり、主動詞に先行する行為として簡潔な連用形で訳した。
- source_word: τῇ ἐπιούσῃ
  choice: 翌日
  rationale: 次の日を示す時間の与格表現。現代日本語で自然かつ明瞭な形とした。
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: キオス島の向かい側に着いた
  rationale: καταντάωの到着の意味と、ἄντικρυςが示す島に相対する位置を保った。上陸したとは限定していない。
- source_word: τῇ δὲ ἑτέρᾳ
  choice: その次の日には
  rationale: 旅程における次の日への進行を自然な日本語で明示した。
- source_word: παρεβάλομεν εἰς Σάμον
  choice: サモス島に寄港し
  rationale: παραβάλλωは航海文脈で船を岸や港につける、立ち寄ることを表すため、「寄港する」とした。
- source_word: τῇ δὲ ἐχομένῃ
  choice: さらにその翌日
  rationale: 日程がもう一日先へ進むことを、先行する二つの日付表現と区別しながら明瞭に示した。
- source_word: ἤλθομεν εἰς Μίλητον
  choice: ミレトスに着いた
  rationale: 目的地への到着を表す旅程文脈に即し、自然な日本語にした。
- source_word: Χίου / Σάμον / Μίλητον
  choice: キオス島／サモス島／ミレトス
  rationale: 地名を標準的な日本語表記で音写し、島であるキオスとサモスには理解を助ける「島」を添えた。
