id: ACT.20.16
reference: Acts 20:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: ja
  text: パウロは、アジア州[a]で時間を費やさないように、エフェソを通り過ぎて航行することを決めていた。というのも、できれば五旬祭の日にエルサレムにいるために[b]、旅を急いでいたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アジア州」は、現代のアジア大陸ではなく、小アジア西部にあったローマ帝国の属州を指す。
    reason: cultural_note
  - marker: b
    text: 「五旬祭の日にエルサレムに到着する」とも訳せる。ギリシア語の表現は、その日までに到着してそこにいることにも、その日に到着することにも重点を置き得る。
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: 決めていた
  rationale: 過去完了の意味を、物語のこの時点より前になされた決定として自然な日本語で表した。
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: エフェソには寄らずに航行する
  rationale: 海路でそばを通過する意味を保ちつつ、寄港を避けたという文脈上の含意が明瞭になる自然な表現とした。
- source_word: χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ
  choice: アジア州で時間を取られないよう
  rationale: χρονοτριβέωの「時間を費やす、長引く」を、旅程上の遅れを示す自然な日本語で表した。「州」を補って古代ローマの属州であることを明示した。
- source_word: ἔσπευδεν
  choice: 旅を急いでいた
  rationale: 未完了過去が示す継続的な切迫を保ち、旅行の文脈を自然に示した。
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: できれば
  rationale: 実現可能性についての留保を簡潔で自然な日本語にした。
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: 五旬祭の日には
  rationale: ユダヤ教の祭りとして定着した名称を用い、時を示す対格は「には」で表した。
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: エルサレムに着いていたい
  rationale: エルサレムへの到着とその日にそこにいることの双方を含み得るギリシア語の幅を、日本語の完了状態を表す形で可能な限り保った。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 現代日本語の聖書で一般的な地名表記を採用した。
theological_decisions:
- issue: 五旬祭の日とエルサレム到着の時間関係
  choice: 五旬祭の日にはエルサレムに着いていたい
  alternative: 五旬祭の日にエルサレムに着きたい
  rationale: 原文は、その日までに到着して滞在していることにも、その日に到着することにも重点を置き得るため、本文では完了状態を示し、別の可能性を注で示した。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての落ち着きと品位を保った。「アジア」は現代的な誤解を避けるため本文で「アジア州」とし、時間表現の曖昧さは注で保持した。
