  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: ja
  text: 私は、あらゆる点であなたがたに示しました――このように労苦して弱い人たちを助け[a]、また、主イエスご自身が「受けるよりも与えるほうが幸いである」と言われたことばを覚えていなければならないことを。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弱い人たちを支え」。このギリシア語の動詞には、一時的に助けるだけでなく、継続して支える意味もあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: あらゆる点で
  rationale: ὑπέδειξαを修飾する副詞的用法と捉え、パウロが自らの行動の全面にわたって模範を示したことを自然な日本語で表した。
- source_word: ὑπέδειξα
  choice: 模範を示しました
  rationale: 文脈では口頭で教えただけでなく、働き方を実例として示した意味が強いため、「示した」より具体的に訳した。
- source_word: οὕτως κοπιῶντας
  choice: このように労苦して
  rationale: οὕτωςの指示性とκοπιάωの骨の折れる働きという含意をともに保った。
- source_word: δεῖ
  choice: なければなりません
  rationale: 義務・必要を表す語の力を明確にしつつ、先行する「あなたがた」を文脈上の主体として自然に補った。
- source_word: ἀντιλαμβάνεσθαι
  choice: 助け
  rationale: 援助する、支えるという意味を平明に表した。継続的な支援の含みは脚注に残した。
- source_word: τῶν ἀσθενούντων
  choice: 弱い人たち
  rationale: 身体的、経済的、社会的、霊的な弱さのいずれかに限定せず、原語の広さを保った。
- source_word: μνημονεύειν
  choice: 覚えていなければなりません
  rationale: 一度思い出すだけでなく、心に留め続ける意味にも自然に対応する表現とした。
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: 主イエスご自身が語られた…ことば
  rationale: 日本語では引用内容を先に置く構造が自然であり、αὐτόςの強調も「ご自身」で保持した。
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: 受けるよりも与えるほうが幸いである
  rationale: 比較構文を明瞭に保ち、μακάριονを聖書的な響きのある「幸い」と訳した。
theological_decisions:
- issue: 「弱い人たち」の範囲
  choice: 弱さの種類を限定しない「弱い人たち」
  alternative: 貧しい人たち／病人／信仰の弱い人たち
  rationale: ἀσθενούντωνは意味範囲が広く、この文脈だけでは特定の種類の弱さに絞れないため、曖昧さを保持した。
- issue: イエスのことばの導入における強調
  choice: 「主イエスご自身が語られた」
  alternative: 「主イエスが言われた」
  rationale: αὐτόςの明示的な強調を保持し、このことばが主イエス本人に帰されている点を示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、演説の結びにふさわしい品位を保った。「労苦」「幸い」は原文の力と聖書的な調子を維持するため採用した。引用部は日本語として自然になるよう前置した。
