  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: ja
  text: 夜が明けると、ユダヤ人たちは[a]陰謀を企て、自分たちに呪いをかけて誓いを立てた。「パウロを殺すまでは、食べることも飲むこともしない」と。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「ユダヤ人たち」とは、ユダヤ民族全体ではなく、この陰謀に加わった特定の人々を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: 夜が明けると
  rationale: 属格独立構文による時の移行を、自然な現代日本語で表した。
- source_word: ποιήσαντες συστροφὴν
  choice: 共謀し
  rationale: 暗殺を目的とする組織的な結託を簡潔に表す。「暴徒となり」では騒乱の意味が強すぎる。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たちは
  rationale: 原文の明示的な表現を本文に保つ一方、文脈上は民族全体ではなく陰謀に加わった特定の者たちを指すことを脚注で明確にする。
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: 自らを呪いのもとに置いた
  rationale: 誓いを果たせなければ自分に裁きが下るよう求める、自己呪詛を伴う誓約の意味を保つ。
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: 食べることも飲むこともしないと言って
  rationale: 誓約の内容を示す不定詞構文と、μήτε…μήτε の対になった否定を自然に表した。
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: パウロを殺すまでは
  rationale: 誓約が解かれる時点を示す節として訳し、原文の目的達成まで継続する意味を保持した。
