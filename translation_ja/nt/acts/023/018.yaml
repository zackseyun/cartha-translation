id: ACT.23.18
reference: Acts 23:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: ja
  text: そこで彼は若者を連れて千人隊長[a]のところへ行き、こう言った。「囚人のパウロが私を呼び寄せ、この若者をあなたのところへ連れて行くよう私に頼みました。この若者には、あなたに話すことがあるのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「千人隊長」はローマ軍の指揮官。伝統的には「護民官」とも訳される。
    reason: χιλίαρχοςの歴史的役職を、本文の定着した訳語を保ったまま簡潔に説明するため。
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: 若者を連れて
  rationale: παραλαμβάνωの分詞を、後続する移動と自然につながる日本語で表現した。αὐτόνが指す若者を明示し、単に「受け取って」とする不自然さを避けた。
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: 千人隊長のところへ行き
  rationale: ἄγωはここでは若者を伴って目的地へ移動することを表す。「連れて」を直前で用いたため、重複を避けつつ移動先を明確にした。χιλίαρχοςは使徒言行録で定着した歴史的役職名「千人隊長」とした。
- source_word: φησίν
  choice: こう言った
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語文として自然な過去形にした。直接話法が続くため「こう」を補った。
- source_word: Ὁ δέσμιος Παῦλος
  choice: 囚人のパウロ
  rationale: δέσμιοςは拘束・収監されている者を指し、この文脈では「囚人」が明快である。
- source_word: προσκαλεσάμενός με
  choice: 私を呼び寄せ
  rationale: パウロが話者を自分のもとへ来させたという方向性を「呼び寄せ」で簡潔に示した。
- source_word: ἠρώτησεν
  choice: 頼みました
  rationale: ここでἐρωτάωは質問ではなく依頼を表すため、「尋ねました」ではなく「頼みました」とした。
- source_word: τοῦτον τὸν νεανίαν
  choice: この若者
  rationale: νεανίαςは若い男性を指す。「青年」も可能だが、年齢幅を狭めすぎず自然な「若者」を採用した。
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: この若者には、あなたに話すことがあるのです
  rationale: 分詞句が若者を修飾する関係を明確にした。因果接続を過度に強めず、「話したい」ではなく、原文の「話すべき何かを持っている」に近い「話すことがある」とした。
