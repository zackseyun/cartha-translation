id: ACT.23.23
reference: Acts 23:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: ja
  text: そこで千人隊長は、百人隊長のうち二人を呼び寄せて、こう命じた。「夜の第三時から[a]カイサリアまで行けるように、兵士二百人、騎兵七十人、それに槍兵二百人[b]を用意せよ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 夜の第三時、すなわち日没からおよそ三時間後で、現在の午後九時ごろ。
    reason: 古代の時刻表現を現代の読者向けに説明するため。
  - marker: b
    text: 別訳「右手の護衛兵二百人」。ここで「槍兵」と訳した語は稀な語で、正確な意味は不明。
    reason: δεξιολάβουςの語義と兵種の特定に不確かさがあるため。
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: 呼び寄せて
  rationale: 自分のもとへ召し寄せるという中動態の意味を、自然な現代日本語で表した。
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: 百人隊長のうち二人
  rationale: τινας はここでは不特定性を添えるが、日本語では「うち二人」で十分自然に伝わる。ἑκατοντάρχης はローマ軍の階級名として「百人隊長」とした。
- source_word: Ἑτοιμάσατε
  choice: 用意せよ
  rationale: 軍事的な命令の直接性と品位を保つ命令表現。
- source_word: στρατιώτας διακοσίους
  choice: 兵士二百人
  rationale: 後続する騎兵およびδεξιολάβοιと区別される一般の兵士を指す。
- source_word: ὅπως πορευθῶσιν
  choice: 行けるように
  rationale: ὅπως＋接続法の目的を表しつつ、日本語の命令文として自然にした。
- source_word: ἕως Καισαρείας
  choice: カイサリアまで
  rationale: ἕως＋属格が示す到達範囲を「まで」で明確に表した。
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: 騎兵七十人
  rationale: 軍隊の文脈に適した簡潔で現代的な名称。
- source_word: δεξιολάβους διακοσίους
  choice: 槍兵二百人
  rationale: 稀な軍事用語で正確な兵種は不明だが、文脈上理解しやすい伝統的な訳語を本文に採用し、不確かさを脚注に示した。
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: 今夜の第三時から
  rationale: ἀπόの起点の意味を「から」で保持し、出発ないし行動開始の時刻を示す表現とした。文脈上の「今夜」を補って自然な命令にした。
theological_decisions: []
translation_notes:
  register: 明快で品位ある現代標準日本語。軍の命令として簡潔な「用意せよ」を用いた。古代の時刻表現と稀な兵種名は本文に残し、必要な説明と語義上の不確かさを脚注で示した。
