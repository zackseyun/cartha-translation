  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: ja
  text: パウロがこう話していると、ファリサイ派とサドカイ派の間に争い[b]が起こり、一同[a]は二つに分かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「群衆」または「大勢の人々」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「対立」または「不和」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: パウロがこう話していると
  rationale: 現在分詞を伴う属格独立構文の同時進行性を「話していると」で表した。αὐτοῦの指示対象は文脈上パウロであり、現代日本語で明瞭にするため固有名を補った。
- source_word: ἐγένετο
  choice: 起こり
  rationale: στάσιςが生じたことを表すため、自然な物語表現である「起こる」とした。
- source_word: στάσις
  choice: 争い
  rationale: ここでは二派の間に生じた論争・対立を指す。「争い」は意味の幅を保ちつつ、現代の一般読者にも明快である。
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ファリサイ派とサドカイ派の間に
  rationale: 属格が示す対立当事者を、日本語として自然な「AとBの間に」で表した。
- source_word: ἐσχίσθη
  choice: 二つに分かれた
  rationale: σχίζωの受動形が表す集団の分裂を、文脈に即して明瞭に表現した。
- source_word: τὸ πλῆθος
  choice: 一同
  rationale: 無作為な群衆ではなく、その場に集まっていた人々全体を指すため「一同」とした。「群衆」という訳も可能である。
