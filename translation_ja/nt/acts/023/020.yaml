id: ACT.23.20
reference: Acts 23:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: ja
  text: 彼は言った。「ユダヤ人たち[a]は、最高法院[b]がパウロについてさらに詳しく調べようとしているかのように、明日、パウロを最高法院へ連れて下ろしてほしいと、あなたに願い出ることを申し合わせました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「ユダヤ人たち」は、すべてのユダヤ人ではなく、パウロを殺す計画に関わった特定の人々を指す。
    reason: 文脈上の指示範囲を明確にし、集団全体への不当な一般化を避けるため。
  - marker: b
    text: 「最高法院」は、ユダヤ人の統治と宗教上の問題を扱った議会、すなわちサンヘドリン。
    reason: συνέδριον の制度上の具体的な指示対象を説明するため。
lexical_decisions:
- source_word: συνέθεντο
  choice: 話を決めています
  rationale: 中態の συντίθεμαι が表す、共に合意して計画を定めたという意味を自然な日本語で示す。語そのものに「陰謀」の意味を過度に持ち込まず、悪意は文脈に委ねた。
- source_word: τοῦ ἐρωτῆσαί σε
  choice: あなたに頼むことで
  rationale: 定冠詞付き不定詞が合意の内容を表す。ここでの ἐρωτάω は、単なる質問ではなく行為を求める依頼なので「頼む」とした。
- source_word: καταγάγῃς
  choice: 連れて下る
  rationale: κατά- の下方への移動を保ち、パウロを兵営側から会議の場へ移送することを表した。
- source_word: συνέδριον
  choice: 最高法院
  rationale: 一般的には「議会」も意味するが、ここではエルサレムのユダヤ人統治機関であるサンヘドリンを指すため、日本語聖書で理解されやすい「最高法院」とした。
- source_word: ὡς
  choice: つもりであるかのように
  rationale: 表向きの目的、あるいは口実を導く用法を反映しつつ、明示された以上に説明を加えない表現とした。
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι
  choice: 何かをもっと詳しく調べるつもり
  rationale: τι の不定性、ἀκριβέστερον の比較級、また πυνθάνομαι の問い調べて確かめる意味をそれぞれ保った。μέλλον はここでは将来の意図として自然に表した。
- source_word: Οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の民族・宗教集団名を狭めずに訳した。ただし、この箇所ではパウロに対する計画に加わった特定の人々を指すため、脚注で文脈上の範囲を明示した。
theological_decisions:
- issue: 敵対的文脈における「ユダヤ人たち」の指示範囲
  choice: 本文では原文どおり「ユダヤ人たち」とし、脚注で文脈上の限定を示す
  alternative: ユダヤ人の指導者たち
  rationale: 原文は指導者に明示的に限定していないため、その限定を本文へ持ち込まない。一方、全ユダヤ人を一括して指すとの誤読を避けるため、文脈上は陰謀に関与した特定の一団であることを注記した。
- issue: ὡς が示す表向きの目的と欺瞞性
  choice: 「つもりであるかのように」
  alternative: 「調べるという口実で」
  rationale: 文脈には欺瞞があるが、「口実」と断定的に言い換えるよりも、原文の比較・様態表現を保ち、読者が文脈から意図を理解できる形にした。
translation_notes:
  register: 現代の一般読者に理解しやすい丁寧で格調ある叙述とした。「連れて下る」で原文の方向性を保ち、「何かをもっと詳しく」で τι と比較級の意味を明示した。
