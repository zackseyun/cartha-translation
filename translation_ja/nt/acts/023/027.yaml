  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: ja
  text: この人はユダヤ人たち[a]に捕らえられ、彼らに殺されそうになっていました。私は、彼がローマ人であると知り、部隊とともに出向いて、彼を救い出しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々」。ギリシア語は、民族・宗教的な意味でのユダヤ人を指すことも、地理的な意味でユダヤ地方の人々を指すこともある。ここでは、エルサレムでパウロに敵対したユダヤ人の一団を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: 捕らえられ
  rationale: 敵対する群衆に拘束されたことを表す。正式な法的逮捕を含意しすぎない、自然な受動表現とした。
- source_word: Ἰουδαίων
  choice: ユダヤ人たち
  rationale: ここではエルサレムでパウロに敵対したユダヤ人の一団を指すと考えられる。民族・宗教的意味と地理的意味の幅があるため、別訳を脚注に残した。
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: 殺されそうになっていました
  rationale: μέλλωと不定詞による切迫性、および文脈上のἀναιρέωの『殺す』という意味を、明瞭で自然な日本語にした。
- source_word: ἐπιστὰς
  choice: 駆けつけ
  rationale: ἐφίστημιがここで表す急な到着と介入の含みを簡潔に伝える。
- source_word: σὺν τῷ στρατεύματι
  choice: 部隊を率いて
  rationale: στράτευμαは軍事的な一隊を指す。日本語では随伴関係を自然に示しつつ、部隊規模を限定しない表現とした。
- source_word: ἐξειλάμην
  choice: 彼を救い出しました
  rationale: 差し迫った危険から救出するという中態ἐξαιρέωの意味を明確に表す。
- source_word: μαθὼν
  choice: 彼がローマ人であると知り
  rationale: 分詞が文面上示す付帯・先行関係を保った。周辺の物語との時間的緊張は訳文で修正しない。
- source_word: Ῥωμαῖός ἐστιν
  choice: 彼がローマ人である
  rationale: 法的文脈ではローマ市民であることを含意するが、原文の直接的な表現を保ち、『市民』を本文に補わなかった。
theological_decisions:
- issue: 千人隊長の手紙における歴史的・修辞的な自己提示
  choice: 彼がローマ人だと知ってから救出した、という手紙の文面をそのまま訳す。
  alternative: 使徒言行録21―22章の経緯に合わせ、ローマ人だと知った時点を訳文で調整する。
  rationale: この節はクラウディウス・リシア自身の報告であり、自分の行動を有利に描いている可能性がある。翻訳では周辺記事との緊張を解消せず、ギリシア語本文の叙述を保持する。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で格調を保った文体。長いギリシア語構文は日本語として読みやすい二文に分けた。「そこで」は明示的な逆接を加えず、救出行動への自然な展開を示す。
