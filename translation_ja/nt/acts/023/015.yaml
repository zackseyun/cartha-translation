  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: ja
  text: ですから今、あなたがたは最高法院とともに、彼についてさらに詳しく調べるつもりであるかのように、彼をあなたがたのもとへ連れて来るよう、千人隊長に知らせてください。私たちは、彼が近づく前に彼を殺す用意ができています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: 申し出てください
  rationale: 権威者に案件を正式に知らせることを表す。文脈上はパウロの移送を求める申し出なので、現代日本語として自然にその伝達行為を示す。
- source_word: χιλιάρχῳ
  choice: 千人隊長
  rationale: ローマ軍の χιλίαρχος を表す、新約聖書の文脈で明確かつ定着した役職名。
- source_word: σὺν τῷ συνεδρίῳ
  choice: 最高法院とともに
  rationale: ここで συνέδριον はユダヤの統治・司法会議を指す。「最高法院」は固有の機関であることを明確にしつつ、専門語「サンヘドリン」を避ける。
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: 彼をあなたがたのところへ連れて来るよう
  rationale: κατάγω の移動の意味を自然な日本語で表す。接頭辞の「下へ」という方向性は本文では不自然になりやすいため脚注で示す。
- source_word: ὡς μέλλοντας
  choice: つもりであるかのように
  rationale: 表向きの意図と実際の意図との食い違いを示す ὡς と分詞の含意を、明示しすぎず保持する。
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: もっと詳しく調べる
  rationale: 司法的な調査・吟味と比較級の意味を、明瞭で自然な現代日本語にする。「より正確に判断する」という可能性もあるが、文脈では調査の意味が前面に出る。
- source_word: τὰ περὶ αὐτοῦ
  choice: 彼について
  rationale: 「彼に関する事柄」を簡潔で自然な日本語にし、対象が本人とその案件の双方を含み得る余地を残す。
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: 彼が近づく前に
  rationale: ἐγγίζω の空間的な「近づく」を保持する。文脈上は「到着する前に」の意味にもなる。
- source_word: ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν
  choice: 殺す用意をしておきます
  rationale: 殺害への準備が整っていることを明瞭に表す。ἀναιρέω に「暗殺」や「殺害」の道徳的評価を余分に加えない。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述。共謀者が最高法院側に語りかける命令・依頼の調子を保ち、偽りの司法的口実と殺害計画との対比を明確にした。
