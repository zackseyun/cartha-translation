  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: ja
  text: そこで千人隊長は若者の手を取って脇へ退き、二人だけで尋ねた。「私に報告することは何か。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: 若者の手を取り
  rationale: 属格を伴うἐπιλαμβάνομαιは手を取ることを表す。日本語として自然で、強くつかむという含みを不必要に加えない。文脈上の指示対象を明確にするため、αὐτοῦを「若者の」とした。
- source_word: δὲ
  choice: そこで
  rationale: ここでは物語を次の動作へ進める接続辞であり、文脈上の応答的な流れを自然に示す。
- source_word: ὁ χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍の高級将校を指す語であり、使徒言行録の歴史的背景を保ちつつ、日本語聖書で理解可能な役職名とした。
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: 人目を避けて脇へ連れて行き
  rationale: ἀναχωρέωの「その場から離れる」とκατ’ ἰδίανの「内々に、私的に」を自然な日本語で表した。目的語はギリシア語では明示されないが、手を取った相手と共に移動したことが文脈から明白である。
- source_word: ἐπυνθάνετο
  choice: 尋ねた
  rationale: 未完了過去は質問に入る場面を描くが、日本語では単純な「尋ねた」が最も自然であり、継続性を過度に明示しない。
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: 私に知らせたいこととは、何か
  rationale: ἔχεις＋不定詞を、この文脈では伝える内容を持っているという意味に取り、ἀπαγγέλλωの報告・伝達の意味を「知らせる」で表した。「しなければならない」という義務を不必要に読み込まない。
