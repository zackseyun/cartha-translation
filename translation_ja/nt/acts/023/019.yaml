  source_fidelity: 「若者の手を取り」はἐπιλαβόμενος τῆς χειρὸς αὐτοῦを適切に表し、「千人隊長」もχιλίαρχοςの歴史的役職を自然に保っています。しかし、「私に知らせたいこと」はἔχεις ἀπαγγεῖλαί μοιを、相手の意志・希望（「たい」）として表しており、原文の「あなたが私に報告すべき／報告することとして持っている事柄」という問いからずれます。また「人目を避けて」は、私的にという意味をおおむね伝えるものの、発覚を避けるという含みを加え得ます。
  naturalness: 全体は明瞭な現代標準日本語です。ただし、質問の「私に知らせたいこととは、何か」はやや硬く、かつ「たい」が発話者ではなく若者の希望を表すため、意図した意味としても読みにくくなっています。「私に報告することは何か」のほうが簡潔で自然です。
  terminology: 「千人隊長」は定着した分かりやすい訳語であり、変更不要です。ἀπαγγεῖλαιはこの軍事・公的な場面では「知らせる」より「報告する」が適切です。神学用語上の問題はありません。
