  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: ja
  text: 私は、この人が彼らの律法をめぐる諸問題[a]について訴えられていたが、死刑や拘禁[b]に値する罪状は何もないことを知りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの律法をめぐる争点」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「鎖」。ここでは拘束または投獄を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: 知りました
  rationale: 調査の結果として得た判断を表す。日本語では「分かりました」も可能だが、書簡中の報告として「知りました」が簡潔で自然。
- source_word: ἐγκαλούμενον
  choice: 訴えられていた
  rationale: 告発を受けていたことを示す受動分詞の意味を保ち、継続していた状況を「ていた」で表した。
- source_word: περὶ ζητημάτων
  choice: 諸問題について
  rationale: ζητήματα は議論や争いの対象となる複数の問題を指す。「諸問題」は複数性を保ちつつ、争点という含みは脚注で示す。
- source_word: τοῦ νόμου αὐτῶν
  choice: 彼らの律法をめぐる
  rationale: ローマ側の話者がユダヤ人の律法を「彼らの律法」と呼ぶ視点を保持した。「をめぐる」により属格が示す領域・関連を自然な日本語で表した。
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: 死刑や拘禁に値する……何もない
  rationale: θάνατος の司法的意味を「死刑」、δεσμοί の鎖・束縛から生じる拘禁の意味を「拘禁」とした。文字どおりの「鎖」は脚注に残す。
- source_word: ἔχοντα ἔγκλημα
  choice: 罪状は何もない
  rationale: 有罪認定ではなく、この人物に該当する告発事由・罪状がないとの判断を表す。「罪がない」よりも司法的文脈と ἔγκλημα の告発内容という意味を保つ。
theological_decisions: []
translation_notes:
  register: ローマ軍司令官による公式書簡として、明瞭でやや改まった現代標準語を用いた。「律法」はユダヤ教の νόμος を指す定着した聖書用語として保持し、「罪状」「拘禁」によって司法的な文脈を明確にした。
