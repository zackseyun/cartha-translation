  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: ja
  text: そこでパウロは百人隊長の一人を呼び寄せて言った。「この若者を千人隊長のところへ連れて行ってください。この若者には、千人隊長に報告したいことがあります。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せて
  rationale: 自分のところへ呼ぶという中動態の意味を、自然な現代日本語で表した。
- source_word: δὲ
  choice: そこで
  rationale: 強い対比ではなく、直前の出来事を受けた物語の進行と結果を示す接続として訳した。
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: 百人隊長の一人
  rationale: ローマ軍の歴史的な階級を、日本語聖書で定着し一般にも理解しやすい名称で表した。
- source_word: ἔφη
  choice: 言った
  rationale: 物語中の発話を導く一般的な動詞として簡潔に訳した。
- source_word: νεανίαν
  choice: 若者
  rationale: 若い男性を指す語を、文脈上自然で簡潔な現代日本語にした。
- source_word: ἄπαγε
  choice: 連れて行ってください
  rationale: 相手をある人物のもとへ導く命令を自然に表し、百人隊長への依頼として丁寧体を用いた。
- source_word: πρὸς τὸν χιλίαρχον
  choice: 千人隊長のところへ
  rationale: χιλίαρχοςの軍事的称号を字義に即した定着訳で示し、既出の特定人物であることも文脈に委ねた。
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: お伝えしたいことがあるそうです
  rationale: ἔχει＋不定詞の『することがある』という意味と、ἀπαγγέλλωの情報を伝達・報告する意味を自然な日本語で表した。パウロが若者から聞いた内容を取り次ぐ発話なので『そうです』を補い、誰の意向かを明確にした。
theological_decisions: []
