  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: ja
  text: 「あなたを訴える者たちも到着したら、あなたの言い分を十分に聞こう」と彼は言った。[a] そして、パウロをヘロデの官邸[b]で監視下に置くよう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの件を十分に審理しよう」とも訳せる。ギリシア語の動詞には、相手の言い分を十分に聞く、聞き通すという含みがあり、ここでは法的な聴取の文脈で用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「官邸」は、ローマ総督の公邸または司令部を指す。ここでは、カイサリアにあったヘロデの宮殿が総督の官邸として用いられていた可能性が高い。
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: あなたの言い分を十分に聞こう
  rationale: διακούω は「最後まで聞く、十分に聴取する」という含みを持ち、ここでは司法的な審理を表す。「言い分」は σου の指す本人の陳述を自然な日本語で明示する。
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: あなたの告訴人たちも到着したら
  rationale: ὅταν＋接続法の将来的条件を「到着したら」で表し、καί の「も」を保持する。κατήγοροί は法的文脈に合わせて「告訴人たち」とした。
- source_word: κελεύσας
  choice: そして、…よう命じた
  rationale: アオリスト分詞を物語の流れに即して独立した定動詞として訳し、先行する発言に続く命令を自然に示す。
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: ヘロデの官邸に
  rationale: πραιτώριον は総督の公邸・司令部を指す。音写より意味が通じやすい「官邸」を採り、ヘロデに属した建物であることを属格のまま示す。
- source_word: φυλάσσεσθαι αὐτόν
  choice: パウロを…留置する
  rationale: φυλάσσεσθαι は監視下に置く拘禁を表すため「留置する」とした。αὐτόν の指示対象は文脈上パウロであり、日本語で明確にした。
theological_decisions:
- issue: διακούω の強意的な含み
  choice: 十分に聞こう
  alternative: 審理しよう／言い分を聞こう
  rationale: 単なる ἀκούω と異なる「十分に、最後まで聞く」という語感を本文に反映した。ただし全面的な正式裁判を意味すると断定する「審理」は避けた。
translation_notes:
  register: 明瞭で現代的な標準語を用い、総督の司法的発言には簡潔で威厳ある調子を保った。「プラエトリウム」という馴染みの薄い音写を避け、本文では「官邸」とし、歴史的背景を脚注で補った。
