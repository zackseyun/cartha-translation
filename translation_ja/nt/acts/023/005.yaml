id: ACT.23.5
reference: Acts 23:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: ja
  text: パウロは言った。「兄弟たち、私は、その人が大祭司であるとは知りませんでした。『あなたの民の指導者を悪く言ってはならない』[a]と書かれているからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの民の指導者をののしってはならない」。
    reason: κακῶς λέγεινは、広く「悪く言う」とも、より強く「ののしる」とも訳し得るため。
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: そこでパウロは言った
  rationale: τέは物語を穏やかにつなぐ接続辞であり、日本語では「そこで」によって直前の出来事を受けた発言として自然に示した。
- source_word: Οὐκ ᾔδειν
  choice: 知りませんでした
  rationale: οἶδαのこの形が表す過去時点での認識の欠如を、明快で自然な現代日本語にした。認識できなかった理由までは本文に加えない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数呼格を保ち、議会の構成員に対するパウロの呼びかけとして訳した。
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: あの方が大祭司だとは
  rationale: ἐστίνの現在的な内容を日本語の引用内容として「だ」と表し、職位は定着した語「大祭司」とした。「あの方」は文脈上の人物を自然に指し、敬意を過度に付加しない範囲の指示表現である。
- source_word: γέγραπται γὰρ
  choice: と書かれているからです
  rationale: 完了受動の継続的効力を「書かれている」で保ち、γάρによる理由説明を「からです」とした。
- source_word: Ἄρχοντα
  choice: 指導者
  rationale: 共同体を治める立場の者を指す一般的な語として、現代日本語で理解しやすい「指導者」を採用した。
- source_word: τοῦ λαοῦ σου
  choice: あなたの民の
  rationale: 契約共同体を含み得るλαόςを、聖書引用にふさわしい簡潔な「民」で表した。
- source_word: οὐκ ἐρεῖς κακῶς
  choice: 悪く言ってはならない
  rationale: 命令の働きをする未来形を禁止表現で訳し、κακῶςの広い意味を保った。より強い「ののしる」に限定しない。
theological_decisions:
- issue: パウロが大祭司を知らなかったという発言の解釈
  choice: 「大祭司だとは知りませんでした」と解釈を加えずに訳す
  alternative: 「大祭司だとは気づきませんでした」または皮肉として表す
  rationale: 原文は、人物を識別できなかったのか、職位を知らなかったのか、別の含みがあるのかを明示しないため、その緊張と曖昧さを保持した。
- issue: 聖書引用におけるκακῶςの強さ
  choice: 「悪く言ってはならない」
  alternative: 「ののしってはならない」
  rationale: κακῶςは悪意ある発言や非難を広く指し得る。「ののしる」は可能だが意味を強い罵倒に狭める恐れがあるため、本文では広い訳を採用し、脚注に代案を示した。
- issue: ἀδελφοίの対象範囲
  choice: 「兄弟たち」
  alternative: 「皆さん」または「兄弟姉妹たち」
  rationale: この場面では議会に向けた男性複数形の直接呼格であり、原文の性と呼びかけの調子を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、法廷・議会場面と聖書引用にふさわしい品位を保った。引用文は古語調を避け、「民」「大祭司」など定着した聖書語彙を用いた。
