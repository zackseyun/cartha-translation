id: ACT.23.32
reference: Acts 23:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: ja
  text: 翌日、彼らは騎兵たちにパウロとともに先へ行かせ、自分たちは兵営[a]へ戻った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「宿営地」。ギリシア語は軍隊の宿営地または兵営を意味する。ここではエルサレムにあるローマ軍の兵営を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: 翌日
  rationale: 定型的な時の表現を、自然で簡潔な現代日本語にした。δέは弱い物語上の接続であり、日本語では明示しなくても流れが保たれる。
- source_word: ἐάσαντες
  choice: 行かせ
  rationale: ἐάωの「許す、行かせる」という使役的意味を保ち、分詞が主動詞に先立つ行為を表すことが文脈から自然に分かる形にした。
- source_word: τοὺς ἱππεῖς
  choice: 騎兵たち
  rationale: 馬に乗った兵士を指す軍事用語として、明瞭で一般にも理解しやすい訳語を選んだ。
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: パウロとともに先へ行かせ
  rationale: 騎兵がパウロの護送を続け、ほかの兵士が引き返したという動きを「先へ行く」で自然に示した。αὐτῷの指示対象は文脈上パウロなので、日本語で明示した。
- source_word: ὑπέστρεψαν
  choice: 戻った
  rationale: 元の場所へ引き返す動作を、自然な叙述表現で訳した。
- source_word: εἰς τὴν παρεμβολήν
  choice: 兵営へ
  rationale: παρεμβολήは宿営地または軍隊の駐屯施設を表す。ここではエルサレムのローマ軍施設を指す文脈に合う「兵営」としたが、語の幅は注で保持した。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。原文で主語が省略されているため「彼ら」とし、直前の文脈にいる兵士たちを受ける形にした。対して、代名詞αὐτῷは日本語での指示を明確にするため「パウロ」とした。
