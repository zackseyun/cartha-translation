  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: ja
  text: ですから、彼らに説得されないでください。彼らの中の四十人以上の者たちが、パウロを待ち伏せしています。彼らは、パウロを殺すまでは食べも飲みもしないと、自分たちに呪いを招く誓いを立てており[a]、今や用意を整えて、あなたからの約束[b]を待っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「自分たちを呪いの下に置いた」。誓いを果たせなければ自分たちに呪いが下ることを願う、厳粛な誓約を意味する。
    reason: lexical_alternative
  - marker: b
    text: 文脈上、彼らの要請に対する千人隊長の同意または許可を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: 言うことを聞き入れないでください
  rationale: 受動形の「説得されるな」が文脈上表す、彼らの要請に動かされて応じるなという意味を、自然な現代日本語で示した。
- source_word: ἐνεδρεύουσιν
  choice: 待ち伏せしています
  rationale: 単なる陰謀ではなく、襲撃のために待ち伏せするという具体的な意味を保った。
- source_word: ἐξ αὐτῶν
  choice: 彼らのうち
  rationale: 待ち伏せする者たちが、先に述べられた集団の中から出ていることを明示した。
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: 四十人を超える者たち
  rationale: 比較表現と人数を正確に保ちつつ、自然な日本語とした。
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: 破れば呪いを受ける誓いを立てています
  rationale: 自己に呪いを課す誓約という語義を明確にし、単なる誓いより強い原文の含意を保った。完了的な結果が現在続いていることも「立てています」で表した。
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: 食べも飲みもしない
  rationale: 二重の否定的並列を簡潔で自然な日本語にした。
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: パウロを殺すまでは
  rationale: ἀναιρέωのこの文脈での暴力的な殺害の意味を明示した。代名詞は日本語での指示対象の明瞭さのため固有名に置き換えた。
- source_word: εἰσιν ἕτοιμοι
  choice: 準備を整え
  rationale: 彼らがすでに実行可能な状態にあることを、後続の分詞と自然につないだ。
- source_word: προσδεχόμενοι
  choice: 待っています
  rationale: 期待を伴って待つという分詞の意味を自然に表現した。
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: あなたからの承諾
  rationale: ἐπαγγελίαの基本義は「約束」だが、ここでは千人隊長が要請を認める返答・承認を指すため、文脈上自然な「承諾」とした。脚注で直訳的な選択肢を示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、警告の切迫感と待ち伏せの具体性を保った。「彼」「彼ら」の連続による曖昧さを避けるため、対象を「パウロ」と明示した。
