  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: ja
  text: パウロは最高法院をじっと見つめて言った。「兄弟たち、私は今日に至るまで、神の前で、良心に少しもやましいところなく生きてきました[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の前で市民として生きてきました」とも訳せる。ギリシア語の動詞には、市民として生きるという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: じっと見つめて
  rationale: 視線を向け続ける強意を保ちつつ、現代日本語として自然に表した。
- source_word: τῷ συνεδρίῳ
  choice: 最高法院
  rationale: この文脈ではユダヤ人の統治・司法機関を指すため、日本語で機関の性格が伝わる慣用的な名称を用いた。
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟たち
  rationale: 男性から成る評議員への定型的な呼びかけを、過度に逐語的な「兄弟である男たち」を避けて自然に訳した。
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: 全く良心に恥じることなく
  rationale: πάσῃの包括的な強意と、良い良心をもって行動したという意味を明瞭な日本語で示した。罪のない完全さそのものを断定する表現にはしていない。
- source_word: πεπολίτευμαι
  choice: 歩んできました
  rationale: 完了形が示す過去から現在までの生き方を表し、動詞にあり得る市民的含意は脚注に残した。
- source_word: τῷ θεῷ
  choice: 神の前で
  rationale: 神との関係および神のまなざしのもとでの生き方という文脈上の意味を自然に表した。
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: 今日に至るまで
  rationale: 過去から発言時までの継続を、簡潔で格調ある現代日本語にした。
theological_decisions:
- issue: πεπολίτευμαιによるパウロの自己記述
  choice: 神の前での生き方についての一般的・倫理的な主張として訳す
  alternative: 「神の前で市民として振る舞ってきた」と市民的含意を本文に明示する、または絶対的な無罪・無欠性の主張として強く訳す
  rationale: πολιτεύομαιには市民生活の含意があり得るが、ここでは良心との結びつきから、神の前での生き方が中心である。本文はその意味を自然に示し、市民的含意を脚注で保存した。また「良い良心」を罪のない完全さへ拡張しなかった。
translation_notes:
  register: 明瞭で現代的ながら、法廷での厳粛な発言にふさわしい丁寧体とした。「最高法院」は固有のユダヤ評議会を指す日本語の慣用名として用いた。脚注記号[a]は該当する動詞句の直後に置いた。
