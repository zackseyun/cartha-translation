  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: ja
  text: 総督は手紙を読み、パウロがどの属州の出身かと尋ね、キリキア出身だと分かると、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: 手紙を読み
  rationale: アオリスト分詞。直前の文脈にある手紙を指すため、日本語では目的語を補って自然にした。
- source_word: δὲ
  choice: 明示的には訳さない
  rationale: ここでは弱い接続を表し、日本語では文の流れによって十分に示される。
- source_word: καὶ ἐπερωτήσας
  choice: パウロがどの属州の出身かと尋ね
  rationale: καίで連なるアオリスト分詞を、自然な動作の順序として訳した。問いの主語と対象は文脈から「総督」と「パウロ」を補った。
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: どの属州の出身か
  rationale: ἐπαρχίαはローマの行政区である属州を指す。「出身か」はἐκとἐστίνの意味を明瞭で自然な日本語にする。
- source_word: καὶ πυθόμενος
  choice: 分かると
  rationale: 情報を尋ねて知るに至ったことを表す分詞。後続節へつながる未完の構文を自然に保持するため条件・時のつながりを示した。
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: キリキア出身だと
  rationale: ἀπόは場所的起源を示す。日本語では「出身」として簡潔に表した。
- source_word: Κιλικίας
  choice: キリキア
  rationale: 地名Ciliciaの日本語聖書で一般的な音写。
