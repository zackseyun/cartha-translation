  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: ja
  text: また、彼らがどのような罪状で彼を訴えているのかを知ろうとして、私は彼を彼らの評議会[a]へ連れて下りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの最高法院（サンヘドリン）」。ギリシア語は「会議、評議会」を意味し、この文脈ではエルサレムのユダヤ人統治評議会を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: また、…知りたいと思い
  rationale: 分詞が表す千人隊長の動機と、τέの緩やかな接続を、自然な現代日本語で表した。ἐπιγινώσκωには正確に知る含みもあり得るが、ここでは文脈上「知りたい」で十分に伝わる。
- source_word: τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: 彼らがどのような理由で彼を訴えているのか
  rationale: αἰτίαの法的な含意を「訴えている」との組み合わせで示しつつ、「どのような理由で」により告発の根拠を知ろうとした意味を明瞭にした。未完了過去ἐνεκάλουνは、継続中の訴えとして「訴えている」とした。
- source_word: κατήγαγον
  choice: 連れて行きました
  rationale: 語自体には「下へ連れて行く」という方向性があるが、日本語で「下へ」を明示すると不自然または過度に地理的な意味を生じやすいため、移送の意味を自然に表した。
- source_word: τὸ συνέδριον αὐτῶν
  choice: 彼らの最高法院
  rationale: この文脈ではエルサレムのユダヤ人統治評議会を指すため、固有の機関として日本語聖書で理解されやすい「最高法院」を採用した。ただし語そのものは一般に「会議・評議会」を意味し得るため、脚注で代案を示した。
theological_decisions: []
