id: ACT.23.6
reference: Acts 23:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: ja
  text: しかしパウロは、一方がサドカイ派で、もう一方がファリサイ派であることを知ると、最高法院[a]で声を上げた。「皆さん、兄弟たち、私はファリサイ派の者であり、ファリサイ派の人々の子です[b]。私は、希望と死者の復活について裁かれているのです[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「評議会で」。ここではユダヤの最高評議機関、最高法院を指す。
    reason: lexical_alternative
  - marker: b
    text: 「ファリサイ派の両親を持つ者です」または「代々ファリサイ派の者です」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: 「死者の復活という希望について、私は裁かれているのです」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: 知ると
  rationale: アオリスト分詞がパウロの発言に先立つ事情を示すため、自然な時間・理由の流れを保つ「知ると」とした。
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: 一方が…もう一方が
  rationale: 議員たちが二つの集団に分かれていたことを、現代日本語で明瞭に表す。
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: サドカイ派／ファリサイ派
  rationale: ユダヤ教内の党派を示す日本語聖書で定着した名称を用いた。
- source_word: ἔκραζεν
  choice: 声を上げた
  rationale: 公の場で大声を発したという κράζω の強さを保ちつつ、過度に口語的にならない表現とした。
- source_word: ἐν τῷ συνεδρίῳ
  choice: 最高法院
  rationale: この文脈の συνέδριον はユダヤの最高評議機関を指す。一般名詞としての訳語は脚注に示した。
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟である皆さん
  rationale: 同胞への男性複数呼格であることを保ちながら、「男たち、兄弟たち」という不自然な逐語訳を避けた。
- source_word: Φαρισαῖός εἰμι
  choice: 私はファリサイ派の者
  rationale: 現在形によるパウロの自己認識をそのまま明瞭に表した。
- source_word: υἱὸς Φαρισαίων
  choice: ファリサイ派の者たちの子
  rationale: 複数属格 Φαρισαίων と「子」という家族的比喩を残し、両親、祖先、党派的継承のいずれかに限定しない。
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: 希望と死者の復活について
  rationale: ἐλπίδος と ἀναστάσεως が καί で並列されている形を保ちつつ、νεκρῶν が自然に「復活」にかかる日本語とした。両者を一つの概念として読む可能性は脚注に示した。
- source_word: κρίνομαι
  choice: 裁かれている
  rationale: 現在受動態が示す進行中の司法的審理を、形式と意味の両面を保って訳した。
theological_decisions:
- issue: υἱὸς Φαρισαίων の意味
  choice: 「ファリサイ派の者たちの子」とし、家族的な言い回しを保持した。
  alternative: 「ファリサイ派の両親を持つ者」「代々ファリサイ派の者」
  rationale: ギリシャ語の複数形は、両親、祖先、あるいは党派的伝統との結びつきを示し得るため、本文で一つに限定しない。
- issue: 「希望」と「復活」の関係
  choice: 「希望と死者の復活」と並列して訳した。
  alternative: 「死者の復活という希望」
  rationale: 原文は ἐλπίδος と ἀναστάσεως を καί で結ぶが、一つの復活の希望を表す重言法的な読みも可能である。本文では統語形を保ち、別解を脚注に置いた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法廷での発言にふさわしい品位を保った。「兄弟である皆さん」は同胞への呼びかけを自然に表し、「裁かれている」は司法的状況と現在受動態を保持する。曖昧さのある二箇所は本文で解消せず、脚注で主要な別解を示した。
