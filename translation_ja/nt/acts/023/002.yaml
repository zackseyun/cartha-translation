  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: ja
  text: ところが、大祭司アナニアは、そばに立っていた者たちに、パウロの口を打つよう命じた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「口を平手で打つよう」とも訳せる。ギリシア語の動詞は広く「打つ」ことを表し、「平手で打つ」は文脈上あり得るが、意味をより具体的に限定する訳である。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: すると
  rationale: 直前のパウロの発言を受けた急な反応を示す。強い逆接に限定せず、物語の自然な展開として表した。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 当時の祭司職の称号として、日本語聖書で定着し、意味も明確な訳語。
- source_word: Ἁνανίας
  choice: アナニア
  rationale: 人名を日本語で一般的な音写にした。
- source_word: ἐπέταξεν
  choice: 命じた
  rationale: 権威をもって指示する動詞の強さを、自然で簡潔な現代日本語で示した。
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: そばに立っていた者たちに
  rationale: アナニアの近くに立っていた人々という空間的意味を保った。文脈上の付き添いや役職までは特定しない。
- source_word: τύπτειν
  choice: 打つ
  rationale: 殴打一般を表し得る語なので、平手打ちなど具体的な方法を本文では限定しなかった。
- source_word: αὐτοῦ τὸ στόμα
  choice: パウロの口を
  rationale: 原文は直訳すれば『彼の口を』。日本語では指示対象を明示して曖昧さを避けつつ、身体部位を直接目的語とする原文の構造を自然に表した。
