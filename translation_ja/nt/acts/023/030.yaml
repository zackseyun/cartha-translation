  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: ja
  text: しかし、その男に対する陰謀があるとの知らせを受けたので、私は直ちに彼をあなたのもとへ送り、告発者たちにも、彼に対する訴えをあなたの前で述べるよう命じました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηνυθείσης
  choice: 知らせを受けたので
  rationale: アオリスト受動分詞の属格独立構文を、主節の理由・契機を自然に示す表現とした。受動の意味も保っている。
- source_word: ἐπιβουλῆς
  choice: 陰謀
  rationale: 人に危害を加えるための企てを指す。具体的な「待ち伏せ」に限定せず、文脈に合う公的な語調を保つ。
- source_word: εἰς τὸν ἄνδρα
  choice: この男に対する
  rationale: εἰς が示す敵意の方向を「に対する」で表した。直前まで言及されているパウロを指すため、日本語では「この男」が明瞭である。
- source_word: ἔσεσθαι
  choice: あるとの
  rationale: 未来不定詞が示す、陰謀が生じるとの通報内容を簡潔に表す。日本語では未来性が文脈上十分伝わる。
- source_word: ἐξαυτῆς
  choice: 直ちに
  rationale: 即時性を明確にし、公文書調にも適した現代標準語である。
- source_word: ἔπεμψα πρὸς σέ
  choice: 私は直ちに彼をあなたのもとへ送り
  rationale: 目的語はギリシア語では省略されるが、文脈上パウロであるため「彼」を補い、πρὸς σέを自然に表した。
- source_word: παραγγείλας
  choice: 命じました
  rationale: 権威をもって指示する意味を保ちつつ、分詞の付帯動作を主節と連結した。
- source_word: κατηγόροις
  choice: 告発者たち
  rationale: 法廷的文脈に即して、パウロを訴える者たちを明確に表す。
- source_word: λέγειν πρὸς αὐτὸν
  choice: 彼に対する訴えを……述べる
  rationale: 字義的には「彼に向かって／彼に対して語る」だが、法廷文脈では告発内容を陳述することを指すため、意味を明瞭にした。
- source_word: ἐπὶ σοῦ
  choice: あなたの前で
  rationale: 総督フェリクスの面前、すなわちその裁定の場で述べるという司法的含意を、簡潔に保った。
theological_decisions: []
translation_notes:
  register: ローマ軍司令官から総督への書簡として、明瞭で端正な現代日本語を用いた。「この男」は原文の定冠詞付きἀνήρを反映しつつ、過度に尊称化しない公的な語調を保つ。「訴えを述べる」は法廷的意味を自然に伝える。
