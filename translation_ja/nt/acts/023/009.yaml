language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: ja
  text: すると、大きな叫び声が上がり、ファリサイ派に属する律法学者のうち数人が立ち上がって、激しく言い争った。「この人には何も悪いところが見当たらない。だが、もし霊か天使が彼に語りかけたのなら――」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語本文では、「だが、もし霊か天使が彼に語りかけたのなら――」という条件節のまま、文が突然途切れている。
    reason: 原文の未完結な構文を説明するため。
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: 激しい叫び声
  rationale: κραυγήの「叫び声・騒がしい叫び」と μεγάληの強さを、自然な現代日本語で表した。文脈上、単なる大声よりも議場の騒然とした声を示す。
- source_word: ἀναστάντες
  choice: 立ち上がって
  rationale: 発言・反論のために立ったという身体動作をそのまま保つ。
- source_word: τινὲς τῶν γραμματέων
  choice: 律法学者のうち数人
  rationale: γραμματεύςはこのユダヤ議会の文脈では律法に通じた書記・学者を指す。「律法学者」は現代の一般読者に役割が伝わりやすく、τινέςの部分性も「うち数人」で明示した。
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: ファリサイ派に属する
  rationale: μέροςはここでは党派・陣営を表す。所属関係を簡潔で自然に示した。
- source_word: διεμάχοντο
  choice: 激しく言い争った
  rationale: 動詞が表す強い反論・論争と、未完了過去の継続的な激しさを日本語で自然に伝える。
- source_word: Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: この人には何も悪いところが見当たらない
  rationale: 司法的な「罪状なし」に限定しすぎず、κακόνの非難すべき点・悪事という幅を保った自然な表現。
- source_word: εἰ δὲ
  choice: もし……なら
  rationale: 接続辞δέの転換を文脈に沿って表しつつ、原文の未完結な条件節を補完せず保持する。
- source_word: πνεῦμα
  choice: 霊
  rationale: 無冠詞でἄγγελοςと並置されているため、ここでは特定の聖霊と断定せず、一般的な霊的存在として読める「霊」とした。
- source_word: ἐλάλησεν αὐτῷ
  choice: 彼に語りかけた
  rationale: λαλέω＋与格の意味を自然に表し、霊的存在からパウロへの発話という方向を明確にした。
- source_word: ἄγγελος
  choice: 御使い
  rationale: 超自然的存在を指す文脈であり、人間の使者ではない。「御使い」は聖書本文として品位を保ちながら理解可能な語。
theological_decisions:
- issue: πνεῦμαが聖霊を指すか、一般的な霊的存在を指すか
  choice: 特定せず「霊」と訳す
  alternative: 「御霊」または「聖霊」
  rationale: 「霊か御使い」という対比は霊的存在の分類を示すのが自然であり、聖霊と断定する根拠は十分でない。日本語の「霊」は原文の曖昧さを保つ。
- issue: 末尾の未完結な条件節
  choice: 文を補わず、長いダッシュで中断を示す
  alternative: 「もし霊か御使いが彼に語りかけたのだとしたら、どうだろう」のように修辞疑問として完結させる
  rationale: ギリシア語本文は条件節の帰結を述べずに突然終わる。補完によって解釈を固定せず、原文の緊張と中断を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、議会での激しい対立にふさわしい品位ある叙述とした。「律法学者」「ファリサイ派」は一般的な聖書用語として保持し、末尾は原文どおり未完結にした。
