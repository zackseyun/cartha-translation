id: ACT.23.8
reference: Acts 23:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: ja
  text: というのも、サドカイ派は、復活も天使も霊もないと言うのに対し、ファリサイ派はその両方[a]を認めているからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の理解「三つすべて」。すなわち、復活、天使、霊を指す。ギリシア語は字義どおりには「両方」といい、最も直接的には「天使」と「霊」を指すが、文脈から三つすべてを含むと理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: サドカイ派
  rationale: ユダヤ教内の集団名として、現代日本語の聖書用語で広く通用する表記を用いた。
- source_word: μὲν γὰρ
  choice: というのも
  rationale: 直前の出来事に対する説明・理由を導く接続として、γάρの機能を自然な日本語で表した。μένは後続のδέとの対照に反映した。
- source_word: λέγουσιν
  choice: 言っている
  rationale: 各派の一般的な見解を述べる現在形として、継続的な立場を自然に示した。
- source_word: μὴ εἶναι
  choice: ない
  rationale: 存在または実在を否定する不定詞節を、簡潔で自然な日本語にした。
- source_word: ἀνάστασιν
  choice: 復活
  rationale: ここでは個別の一事件ではなく、復活という現実・教理の範疇を指す。定着した訳語を採用した。
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: 御使いも霊も
  rationale: μήτε…μήτεの並列否定を「も…もない」で再現し、単数名詞は種類・存在の総称として自然に表した。ἄγγελοςは文脈上、天的存在を指すため「御使い」とした。
- source_word: Φαρισαῖοι
  choice: ファリサイ派
  rationale: ユダヤ教内の集団名として、現代日本語で広く通用する表記を用いた。
- source_word: ὁμολογοῦσιν
  choice: 認めている
  rationale: ここでは真実として肯定する意味であり、宗教的な「告白する」や罪を「白状する」という含みを避けた。
- source_word: τὰ ἀμφότερα
  choice: その両方
  rationale: ギリシア語の「両方」をそのまま保ち、直前の対を指すという最も直接的な読みを本文に反映した。三項すべてを指す可能性は注に残した。
theological_decisions:
- issue: ファリサイ派が認める「両方」の範囲
  choice: 直前に対として挙げられた御使いと霊の両方
  alternative: 復活、御使い、霊の三つすべて
  rationale: 原文は「すべて」や「三つ」ではなくτὰ ἀμφότερα（その両方）を用いるため、本文では直前のμήτε…μήτεによる「御使い」と「霊」の対を指す表現を保持した。一方、文脈上ファリサイ派が復活も認めることは明らかであるため、三項を包括する理解も注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも…からである」で説明文としてのつながりを示し、「…も、…も…ない」で原文の列挙と否定を読みやすく再現した。注記号[a]は節全体、とりわけ「その両方」に関する注であることが分かるよう文末に置いた。
