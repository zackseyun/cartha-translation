  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: ja
  text: 彼らは祭司長たちと長老たちのところへ行って、こう言った。「私たちは、パウロを殺すまでは何一つ口にしないと、自らに呪いを課して固く誓いました[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「私たちは自分たちを呪いの下に置きました」。ギリシア語は、破れば自分に災いが及ぶことを覚悟した誓いを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 彼らは
  rationale: 前節の陰謀に加わった者たちを受ける関係代名詞。日本語の物語として自然に文を始めつつ、指示対象を保つ。
- source_word: προσελθόντες
  choice: ところへ行って
  rationale: 主動詞「言った」に先立つ接近を表すアオリスト分詞。文脈では祭司長たちと長老たちのもとへ出向く意味が自然である。
- source_word: τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις
  choice: 祭司長たちと長老たち
  rationale: 第二神殿期のユダヤ社会における公的指導者層を指す標準的な訳語を用いた。
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: 自らに呪いを課して固く誓いました
  rationale: 同語根の名詞と動詞による強調を、自己に災いを招くことを条件とした厳粛な誓いとして明確に表した。「アナテマ」のような後代の教会用語は避けた。
- source_word: μηδενὸς γεύσασθαι
  choice: 何一つ口にしない
  rationale: 「何も味わわない／口にしない」という表現。食物を断つ意味を自然な現代日本語で示しつつ、μηδενόςの強調を「何一つ」で保った。
- source_word: ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον
  choice: パウロを殺すまでは
  rationale: 誓いの期限となる企図された出来事を直接的に訳した。「殺す」は法的・道徳的評価を訳語に付加しない。
theological_decisions:
- issue: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς の誓願表現
  choice: 自らに呪いを課して固く誓いました
  alternative: 自分たちをアナテマの下に置きました／厳粛な誓いを立てました
  rationale: ここでの表現は後代の教会的な破門宣告ではなく、誓いを破れば自分たちに災いが及ぶことを含む自己呪詛的な誓願である。呪いの要素と誓いの厳粛さの双方を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、語りの簡潔さと誓願の厳粛さを両立させた。「何一つ口にしない」は原文の「味わう」の比喩性を自然に伝える。
