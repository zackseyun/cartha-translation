  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: ja
  text: 騎兵たちはカイサリアに入ると、総督に手紙を届け[a]、パウロも彼の前に連れて来た[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「総督に手紙を手渡し」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「パウロを総督の前に立たせた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 一行は
  rationale: 前節の騎兵たちを受ける関係代名詞。日本語では主語を「一行」として自然につなぐ。
- source_word: εἰσελθόντες
  choice: 入ると
  rationale: 主動詞に先立つアオリスト分詞を、自然な時間的従属節で表した。
- source_word: Καισάρειαν
  choice: カイサリア
  rationale: 地名の標準的な日本語音写。本文では海港都市であることを補足しない。
- source_word: ἀναδόντες
  choice: 届け
  rationale: 公文書を行政官に正式に差し出す文脈を、明快で自然な語で表す。
- source_word: ἐπιστολήν
  choice: 手紙
  rationale: この公的な書状にも通用する、一般的で分かりやすい訳語。
- source_word: ἡγεμόνι
  choice: 総督
  rationale: ローマ属州の統治者フェリクスを指す文脈に適した標準的な訳語。
- source_word: παρέστησαν
  choice: 前に連れて来た
  rationale: 人を権威者の面前に立たせる法的・公的な場面を自然な日本語で表す。
- source_word: καὶ
  choice: も
  rationale: 手紙を届けることに加えてパウロを引き渡したという付加関係を示す。
- source_word: Παῦλον
  choice: パウロ
  rationale: Παῦλοςの標準的な日本語音写。
- source_word: αὐτῷ
  choice: 彼の前に
  rationale: 総督を指す与格代名詞。παρέστησανとの組み合わせを日本語で明示的かつ自然に表した。
