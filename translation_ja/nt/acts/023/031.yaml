  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: ja
  text: そこで兵士たちは、命じられたとおりにパウロを引き取り、夜のうちにアンティパトリスまで連れて行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: そこで兵士たちは
  rationale: οὖνの物語上の展開・帰結を「そこで」で自然に示す。μένは次節との対照を準備する談話標識であり、日本語では独立して訳出しない。
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: 命じられたとおりに
  rationale: διατάσσωの完了受動分詞が示す、すでに彼らに下された命令とその受動性を簡潔に保つ。
- source_word: ἀναλαβόντες τὸν Παῦλον
  choice: パウロを引き取り
  rationale: 先行する付帯動作を示し、兵士たちがパウロの身柄を受け取った文脈にも自然に合う。「護送する」ほどの説明的含意は加えない。
- source_word: ἤγαγον
  choice: 連れて行った
  rationale: 目的地への移動を表すἄγωを、話者の視点を不必要に固定せず、護衛下の人物について自然な日本語で表す。
- source_word: διὰ νυκτός
  choice: 夜のうちに
  rationale: 夜間に行われたことを示す慣用句として訳し、夜通し全行程を移動したとの含意は避ける。
- source_word: Ἀντιπατρίδα
  choice: アンティパトリス
  rationale: 地名を日本語で一般的な形に音写する。
