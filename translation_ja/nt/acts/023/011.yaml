id: ACT.23.11
reference: Acts 23:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: ja
  text: さて、その翌日の夜、主はパウロのそばに立って言われた。「勇気を出しなさい。あなたがエルサレムでわたしについて証しした[a]ように、ローマでも証ししなければならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証しした」と後の「証ししなければならない」に当たるギリシャ語の動詞は、同じ「証言・証し」の語族に属する。前者は「厳粛に証言した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: さて、その翌日の夜
  rationale: ἐπιοῦσαはここで「次の、翌日の」を意味する。δέは強い対比ではなく物語を進める軽い接続として「さて」とした。
- source_word: ἐπιστὰς αὐτῷ
  choice: パウロのそばに立って
  rationale: ἐφίστημιの、近くに来て立つという具体的な像を保った。日本語で指示対象を明確にするため、代名詞αὐτῷは文脈上の人物名「パウロ」で表した。「現れて」とはせず、現前の仕方を不必要に解釈しない。
- source_word: ὁ κύριος
  choice: 主
  rationale: 定冠詞付きκύριοςを、使徒言行録の文脈にふさわしい簡潔で尊厳ある呼称「主」とした。
- source_word: Θάρσει
  choice: 勇気を出しなさい
  rationale: θαρσέωの命令形が表す励ましを、明瞭な現代日本語で表した。「元気を出しなさい」も可能だが、ここでは危険に直面するパウロへの勇気の促しが明確である。
- source_word: διεμαρτύρω
  choice: 証しした
  rationale: διαμαρτύρομαιは厳粛に証言する、証しするという意味を持つ。後続のμαρτυρῆσαιとの語族上のつながりを日本語でも「証し」で保ち、本文が明示しない強調語は加えなかった。
- source_word: τὰ περὶ ἐμοῦ
  choice: わたしについて
  rationale: 直訳的な「わたしに関する事柄を」より自然でありつつ、イエスに関する証しという指示内容をそのまま保つ。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムで
  rationale: 都市名とともに用いられたεἰςは、ここではすでに行われた証言の場所を示すため、日本語では「で」が自然である。
- source_word: οὕτω
  choice: ように
  rationale: エルサレムでの証しとローマでの証しの対応関係を、比較構文「したように」で自然に表した。
- source_word: σε δεῖ
  choice: しなければならない
  rationale: δεῖが示す必要性を明確にしつつ、「定められている」など、本文以上に予定や運命の機序を規定する表現を避けた。
- source_word: καὶ εἰς Ῥώμην μαρτυρῆσαι
  choice: ローマでも証ししなければならない
  rationale: καίの追加の意味を「でも」で示し、μαρτυρέωを先行するδιαμαρτύρομαιと同じく「証しする」と訳した。
theological_decisions:
- issue: ὁ κύριοςが指す方
  choice: 本文では「主」とし、発言内容と使徒言行録の文脈から復活したイエスを指すものとして訳す
  alternative: 「主イエス」と明示する
  rationale: ギリシャ語本文はὁ κύριοςとのみ記し、その方が「わたしについて」と語る。文脈上の指示対象はイエスだが、訳文では原文にない固有名を呼称へ加えず、本文の表現を保った。
- issue: δεῖが表す必要性
  choice: 「しなければならない」
  alternative: 「そうなるよう定められている」または「する必要がある」
  rationale: 使徒言行録におけるδεῖは神的な必要性を帯びうるが、この節はその実現機序を説明していない。そこで必要性は明瞭に表しながら、運命論や特定の予定理解へ狭めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、主の励ましと宣教の必然性を簡潔で尊厳ある直接話法として表した。「勇気を出しなさい」は日常的すぎず古風すぎない勧告表現であり、「証し」は本節内の語彙的連関と宗教的文脈の双方に適している。
