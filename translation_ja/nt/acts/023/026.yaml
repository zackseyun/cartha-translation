  rationale: 人名を現代日本語で一般的な形に音写した。
- source_word: χαίρειν
  choice: ご挨拶申し上げます
  rationale: 書簡冒頭の定型的な挨拶であり、字義的な「喜べ」ではなく、差出人から受取人への公式文書にふさわしい日本語にした。
