- source_word: διασώσωσι
  choice: 無事に送り届ける
  rationale: 危険から守りつつ目的地まで到着させる意味を、移動と安全の双方が伝わる表現で示した。
- source_word: πρὸς
  choice: のもとへ
  rationale: 人物を目的地とする方向性を自然な日本語で表した。
- source_word: ἡγεμόνα
  choice: 総督
  rationale: ローマ属州の統治官という文脈に即した、明確で一般的な訳語である。
