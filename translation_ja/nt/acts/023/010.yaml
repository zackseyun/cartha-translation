  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: ja
  text: 激しい争いが起こると[a]、千人隊長は、パウロが彼らに引き裂かれるのではないか[b]と恐れた。そこで部隊に、下りて行って彼らの中からパウロを力ずくで連れ出し、兵営[c]へ連れて行くよう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「争い」と訳した語は、「対立」「騒動」、文脈によっては「反乱」を意味することもある。
    reason: lexical_alternative
  - marker: b
    text: 「引き裂かれる」は、「ばらばらにされる」とも訳せるほど強い表現。
    reason: lexical_alternative
  - marker: c
    text: 「兵営」と訳した語は、字義的には「宿営地」または「軍営」を意味する。ここではエルサレムに置かれたローマ軍の宿営施設を指す。
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: ところが、激しい争いが起こり
  rationale: 属格独立構文を状況を示す節として訳した。στάσιςは対立、騒動、反乱にもなり得るが、ここでは議会内の激しく暴力的な対立を表すため「激しい争い」とした。δέは場面の展開を示す「ところが」で表した。
- source_word: φοβηθεὶς
  choice: 恐れた。そこで
  rationale: 分詞が後続する命令の動機を示すことが明確になるよう、日本語では文を分けて因果関係を自然に表した。
- source_word: ὁ χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍の部隊指揮官を指す定着した訳語であり、原語の軍事的階級を保つ。
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: パウロが彼らに引き裂かれるのではないか
  rationale: μήを伴う接続法が表す懸念を「のではないか」とし、διασπάωの暴力的で生々しい語感を「引き裂かれる」で保った。
- source_word: ἐκέλευσεν τὸ στράτευμα
  choice: 兵士たちに……命じた
  rationale: στράτευμαは集合体としての軍勢を指すが、命令を実行する者たちとして自然な日本語になるよう「兵士たち」とした。ἐκέλευσενは軍事的文脈に即して「命じた」と訳した。
- source_word: καταβὰν
  choice: 下りて行って
  rationale: 兵営のある高所から議会の場へ向かう空間的移動を保持した。
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: 彼らの中からパウロを力ずくで連れ出し
  rationale: ἁρπάζωの強制的・迅速な奪取の含みを「力ずくで連れ出し」で表し、ἐκ μέσου αὐτῶνを「彼らの中から」と明示した。
- source_word: ἄγειν τε εἰς τὴν παρεμβολήν
  choice: 兵営へ連れて行く
  rationale: ἄγωは護送する文脈に自然な「連れて行く」とし、παρεμβολήはエルサレムのローマ軍宿営施設を指すため「兵営」とした。
