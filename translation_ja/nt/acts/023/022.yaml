source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: ja
  text: そこで千人隊長は若者を帰らせ、こう命じた。「このことを私に知らせたとは、だれにも話すな。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千人隊長
  rationale: ローマ軍のコホルス級部隊を指揮する将校を表す定着した聖書用語であり、原語の職位を簡潔に保つ。
- source_word: ἀπέλυσε
  choice: 帰らせ
  rationale: 拘束からの釈放ではなく、面会を終えて若者を退出させる文脈を自然な現代日本語で表す。
- source_word: νεανίσκον
  choice: 若者
  rationale: 比較的若い男性を指す語であり、年齢を少年に限定せず自然に表現できる。
- source_word: παραγγείλας
  choice: 命じた
  rationale: 軍の指揮官が秘密を守るよう明確な指示を与える場面なので、命令の力を保つ。
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: だれにも話すな
  rationale: 情報を他人に漏らさないよう禁じる意味を、簡潔で自然な直接話法にする。
- source_word: ἐνεφάνισας
  choice: 知らせた
  rationale: 情報を権威者に伝えて明らかにする意味を表し、「報告した」ほど公的な手続きに限定しない。
- source_word: ταῦτα
  choice: このこと
  rationale: 原文は複数形だが、直前に伝えられた一連の情報を日本語で自然にまとめて指す。
- source_word: πρὸς ἐμέ
  choice: 私に
  rationale: 情報伝達の向かう相手を示す πρός を自然な日本語で表す。
