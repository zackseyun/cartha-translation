  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: ja
  text: 近くに立っていた人たちは言った。「神の大祭司を侮辱するのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神の大祭司をののしるのか」。
    reason: λοιδορέωは、言葉で侮辱する、悪く言う、ののしることを表すため。
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: すると、そばに立っていた人たちが
  rationale: 実詞的に用いられた分詞を「そばに立っていた人たち」とし、その場でパウロの近くにいた人々を自然な現代日本語で表した。δέは場面の応答を示す「すると」で訳した。
- source_word: εἶπαν
  choice: 言った
  rationale: アオリスト直説法による物語の進行を、簡潔な過去形で表した。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: この文脈ではユダヤ人の大祭司を指すため、日本語聖書で定着し、かつ正確な語を用いた。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格を簡潔に表し、大祭司という職が神との関係において呼ばれていることを保った。
- source_word: λοιδορεῖς
  choice: 侮辱する
  rationale: 言葉によって悪しざまに言う、ののしるという意味を、明瞭で現代的な「侮辱する」で表した。継続相を不必要に強調せず、非難を込めた問いとして自然にした。
theological_decisions:
- issue: τοῦ θεοῦが大祭司に付される意味
  choice: 「神の大祭司」と訳し、本文が示す職務上の神との関係をそのまま表した。
  alternative: 「神に属する大祭司」「神に仕える大祭司」
  rationale: 原文は当人の行為に対する神の是認まで明言していない。「属する」「仕える」などの説明を加えず、原文の簡潔さと含みを保った。
translation_notes:
  register: 明瞭で現代的ながら品位のある語調とした。問いの鋭い非難は「のか」で表し、過度に古風な表現は避けた。
