source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: ja
  text: するとパウロは彼に言った。「神があなたを打とうとしておられる、白く塗られた壁よ。あなたは律法に従って私を裁く席に着きながら、律法に背いて私を打たせるように命じるのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神はあなたを打たれる」。ギリシア語は直訳すると「神があなたを打とうとしておられる」で、行為が差し迫っていることを強調している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: 神があなたを打とうとしておられる
  rationale: μέλλει＋不定詞が表す、差し迫った行為の意味を保った。単純な未来とも理解できるため、別訳を脚注に示した。
- source_word: τοῖχε κεκονιαμένε
  choice: この白く塗った壁よ
  rationale: κεκονιαμένεの完了受動分詞と、相手を壁にたとえる鋭い呼びかけを明示した。日本語で意味を説明しすぎず、原文の比喩を保持した。
- source_word: κάθῃ
  choice: 座っていながら
  rationale: 裁判の席に着いているという具体的な姿を保ちつつ、後続する矛盾への非難が自然に伝わる形にした。
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: 律法に従って私を裁くために
  rationale: κατάが示す規範・基準の意味を「律法に従って」で表し、裁判的文脈を保った。
- source_word: παρανομῶν
  choice: 律法に背いて
  rationale: 直前の「律法に従って」との意図的な対照を、簡潔で明瞭な日本語にした。
- source_word: κελεύεις με τύπτεσθαι
  choice: 私を打つよう命じる
  rationale: κελεύωの命令の強さと、τύπτεσθαιの受動的な内容を自然な日本語の使役表現で示した。
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: するとパウロは彼に言った
  rationale: τότεの物語上の進行を「すると」で自然に表し、余分な解釈を加えなかった。
theological_decisions:
- issue: 「神があなたを打とうとしておられる」という発言の性質
  choice: 差し迫った神の行為を告げる断定として訳す
  alternative: 「神があなたを打たれますように」という願望・呪詛として訳す
  rationale: μέλλει＋不定詞は通常、願望ではなく、これから起ころうとしている行為を述べる。パウロの発言の道徳的評価は訳文に加えず、本文の緊張を残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、法廷的な語調とパウロの鋭い非難を保持した。「律法に従って／律法に背いて」の対照を明確にし、比喩は説明に置き換えず原文どおり残した。
