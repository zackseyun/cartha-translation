  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: ja
  text: ところが、パウロの姉妹の息子[a]は、待ち伏せ[b]のことを聞くと、やって来て、兵営[c]に入り、パウロに知らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「パウロの甥」。原文は「パウロの姉妹の息子」と明記しており、「姉妹」は姉または妹のいずれかを特定しない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「陰謀」または「企て」。ギリシア語は、より具体的には身を潜めて待ち伏せすることを指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「陣営」。この文脈では、ローマ軍の兵営を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: 聞きつけると
  rationale: アオリスト分詞が主動詞に先立つ時を表す。単なる聴聞よりも、秘密の計画を知ったという文脈に自然で、後続動作との時間関係も明確にする。
- source_word: δὲ
  choice: ところが
  rationale: 物語の展開を示しつつ、直前の陰謀が発覚するという軽い対照を自然な現代日本語で表す。
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: パウロの姉妹の息子
  rationale: 原文が明示する親族関係をそのまま保つ。「甥」より具体的で、姉または妹のどちらかを不必要に限定しない。
- source_word: τὴν ἐνέδραν
  choice: 待ち伏せ
  rationale: ἐνέδραの具体的な意味である、身を潜めて襲う企てを保つ。「陰謀」や「計画」より原語の像に近い。
- source_word: παραγενόμενος
  choice: やって来て
  rationale: 到着してその場に現れたことを表す分詞を、後続の行為と自然につながる形で訳す。
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: 兵営にやって来て中に入り
  rationale: παρεμβολήは「陣営」と「兵営」の両義を持つが、エルサレムでローマ軍の管理下にある文脈では「兵営」が最も自然。「中に入り」によりεἰσελθώνの移動を明示する。
- source_word: ἀπήγγειλεν
  choice: 知らせた
  rationale: 得た情報を相手に伝達する意味を、簡潔で自然な日本語にする。目的語は直前の「待ち伏せのこと」から明らかなため繰り返さない。
- source_word: τῷ Παύλῳ
  choice: パウロに
  rationale: 与格の間接目的語を直接的に訳す。
