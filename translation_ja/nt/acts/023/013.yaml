  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: ja
  text: この陰謀を企てた者たちは、四十人を超えていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: 四十人を超えていた
  rationale: 比較級πλείουςと数詞τεσσεράκονταの組み合わせは「四十を超える」の意。文脈上、数えられているのは人なので、日本語では助数詞「人」を補うのが自然である。
- source_word: συνωμοσίαν
  choice: 陰謀
  rationale: 秘密の合意・共謀を表す語であり、現代日本語では「陰謀」が簡潔で的確。「誓いを立てた陰謀」とすると、この語自体を越えて前後の文脈を取り込むため避けた。
- source_word: ποιησάμενοι
  choice: 加わった
  rationale: 直訳は陰謀を「作った／行った」者だが、日本語では「この陰謀に加わった者」が自然で、共謀を成立させた当事者であることを表す。中動態分詞の参与的な含みとも調和する。
- source_word: ἦσαν δὲ
  choice: 〜いた
  rationale: 存在を表すἦσανを自然な日本語の文末述語で表した。δέは軽い接続であり、この一節では明示しなくても談話の流れを損なわない。
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: この陰謀に加わった者
  rationale: 冠詞付き分詞句を名詞的に「〜した者」と訳し、指示詞ταύτηνも「この」として保持した。
