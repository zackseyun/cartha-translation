  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: ja
  text: 彼らは、ステファノが語っていた知恵と、彼がそれによって語っていた聖霊[a]に対抗することができなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖霊」を「霊」と訳し、ステファノ自身の霊を指すと理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἴσχυον
  choice: できなかった
  rationale: 未完了過去形が表す、その場で続いていた無力さを、自然な現代日本語で示す。
- source_word: ἀντιστῆναι
  choice: 対抗する
  rationale: 議論の中で相手に立ち向かい、持ちこたえる意味を文脈に即して表す。単なる反対より、応答しきれない含みを保つ。
- source_word: τῇ σοφίᾳ
  choice: 知恵
  rationale: 定冠詞は、ステファノの語りに現れていた特定の知恵を文脈上示すが、日本語では無理に指示語を補わず自然に表す。
- source_word: τῷ πνεύματι
  choice: 御霊
  rationale: 使徒6:5などの直近の文脈から聖霊を指す可能性が高いため、「御霊」とする。ただし人間の霊を指す可能性は脚注に残す。
- source_word: ᾧ ἐλάλει
  choice: その語りを導く
  rationale: 関係代名詞の与格を、御霊がステファノの継続的な発言を可能にし導いたこととして自然に表す。原文の係り方には圧縮があるため、過度に厳密な手段・主体の区別は付け加えない。
theological_decisions:
- issue: πνεύματιが聖霊を指すか、ステファノ自身の霊を指すか
  choice: 御霊
  alternative: 霊
  rationale: ステファノが聖霊に満ちていたという直前の記述と、知恵と御霊が彼の語りの力として並ぶことから、聖霊と解するのが文脈上有力である。しかし語形だけでは人間の霊も排除できないので、脚注で保持する。
translation_notes:
  register: 明快な現代標準日本語を用い、「御霊」で聖霊への有力な文脈的理解を示した。「その語りを導く」は直訳的な関係節を自然な日本語に整えつつ、御霊と語りの結び付きを保つ。
