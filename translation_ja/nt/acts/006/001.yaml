id: ACT.6.1
reference: Acts 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: ja
  text: そのころ、弟子たちの数が増えていく中で、ヘレニストたち[a]からヘブライ人たちに対する不平が起こった。ヘレニスト側のやもめたちが、日ごとの分配で見過ごされていた[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「ヘレニストたち」と「ヘブライ人たち」。おそらく、前者は主にギリシア語を話すユダヤ人、後者は主にアラム語またはヘブライ語を話すユダヤ人を指す。
    reason: cultural_note
  - marker: b
    text: 別訳「日ごとの奉仕において顧みられていなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: そのころ
  rationale: 物語の時間的背景とδέの緩やかな展開を、明瞭で自然な現代日本語で表す。明示的な「今」を補わない。
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: 弟子の数が増えていく中で
  rationale: 属格絶対による背景状況と、人数が継続的に増加していたことを自然に示す。
- source_word: ἐγένετο γογγυσμός
  choice: 不満の声を上げた
  rationale: γογγυσμόςの「つぶやき、不平、苦情」の幅を踏まえ、具体的な訴えが表面化した文脈に合う表現とした。
- source_word: τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους
  choice: ギリシア語系のユダヤ人たちがヘブライ語系のユダヤ人たちに対して
  rationale: 両者が初期共同体内のユダヤ人集団であることを一般読者に明確にしつつ、言語・文化的区別として理解される蓋然性を反映する。原語の集団名は脚注で示す。
- source_word: παρεθεωροῦντο
  choice: 見過ごされていた
  rationale: 未完了過去受動態が表す継続的状況を保ち、意図的差別とまでは断定しない。「顧みられていなかった」も可能である。
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: 日々の分配で
  rationale: διακονία自体は広く「奉仕」を意味し得るが、やもめへの物質的な支援という文脈では「分配」が具体的で自然である。
- source_word: αἱ χῆραι αὐτῶν
  choice: 自分たちのやもめたち
  rationale: αὐτῶνがヘレニスト側を指すことを明確にし、その集団に属するやもめについての訴えであることを表す。
theological_decisions:
- issue: ἙλληνισταίとἙβραῖοιという集団名の解釈
  choice: 本文では「ギリシア語系のユダヤ人」「ヘブライ語系のユダヤ人」とし、原語により近い集団名を脚注に残す。
  alternative: 「ヘレニストたち」と「ヘブライ人たち」
  rationale: 言語的区別は有力だが完全に定義されているわけではないため、本文の可読性を確保しつつ、脚注で原語の歴史的呼称と解釈上の幅を示す。
- issue: παρεθεωροῦντοが意図的な差別を含意するか
  choice: 「見過ごされていた」とし、意図性を断定しない。
  alternative: 「ないがしろにされていた」
  rationale: 原文は継続的に顧みられない状態を示すが、その原因や故意性は明示しない。より強い非難を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙事文として落ち着いた格調を保った。「やもめ」は聖書文脈で定着した語だが、現代の読者にも意味が通る範囲で保持した。集団間の緊張を誇張せず、原文の継続的な問題状況を示した。
