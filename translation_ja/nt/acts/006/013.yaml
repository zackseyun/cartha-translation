id: ACT.6.13
reference: Acts 6:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: ja
  text: 彼らはまた、偽りの証人たちを立てた。彼らはこう言った。「この男は、この聖なる場所[a]と律法に逆らうことを言うのをやめません[b][c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その聖なる場所」とも訳せる。ここでは神殿を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「語ることをやめない」。または「絶えず語っている」。
    reason: lexical_alternative
  - marker: c
    text: 「この聖なる場所と律法に逆らって語り続ける」とも訳せる。ギリシア語では、直訳すれば「言葉を語る」に当たる表現が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: 立てて
  rationale: 裁きの場で証人を出廷させ、証言者として立たせることを表す。敵対者たちが意図的に証人を立てたという文脈にも自然に合う。
- source_word: τε
  choice: また
  rationale: 先行する行為に別の行為を付け加える接続の働きを、明瞭な現代日本語で示す。
- source_word: μάρτυρας ψευδεῖς
  choice: 偽りの証人たち
  rationale: 虚偽の証言をする者という法的意味を保ちつつ、「偽証人」よりも一般読者に直ちに理解しやすい表現とした。
- source_word: λέγοντας
  choice: こう言わせた
  rationale: ἔστησανとの構文上の結び付きを自然な日本語にし、立てられた証人が続く告発を述べたことを示す。使役表現は、彼らが証人を立てたという主節との関係を明瞭にする。
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: この男
  rationale: 告発の場における直接的でやや突き放した言い方を保ち、「こいつ」ほど口語的・侮蔑的にはしない。
- source_word: οὐ παύεται
  choice: やめません
  rationale: 継続している行為が止まらないという現在形の意味を、平明で自然な現代日本語にした。
- source_word: λαλῶν ῥήματα
  choice: 言葉を語ること
  rationale: 明示された目的語ῥήματαを「言葉」として残し、告発者が問題視する発言内容を表した。日本語で多少重みのある表現だが、法的な告発の調子に適う。
- source_word: κατὰ
  choice: 逆らう
  rationale: 属格を伴うκατάがこの敵対的な告発では反対・攻撃の方向を示すため、「について」ではなく「逆らう」とした。
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: この聖なる場所
  rationale: ギリシア語に指示代名詞はないが、発言の場で明確に意識されている神殿を指すため、日本語では「この」が自然である。
- source_word: τοῦ νόμου
  choice: 律法
  rationale: 文脈上モーセの律法を指すため、聖書日本語で一般的かつ明確な「律法」を用いた。
theological_decisions:
- issue: 「聖なる場所」と「律法」の指示対象
  choice: 「この聖なる場所」と「律法」とし、本文では神殿およびモーセの律法と説明的に言い換えない。
  alternative: 「この神殿」と「モーセの律法」と明示する。
  rationale: 直近の文脈ではエルサレム神殿とモーセの律法を指すが、原文の告発文が用いる表現を保持し、本文で解釈を過度に展開しない。神殿という指示対象は脚注で明確にする。
- issue: 告発の強さ
  choice: 「逆らう言葉を語る」とし、原文の敵対的な法廷調を保つ。
  alternative: 「冒瀆する」「中傷する」など、行為をさらに強く規定する語を用いる。
  rationale: 原文はκατὰと「言葉を語る」によって反対する発言を示すが、ここ自体では「冒瀆」などの強い専門語を用いていない。偽証の内容を報告する本文の緊張を保ちつつ、告発を増幅しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法廷での敵対的な告発にふさわしい引き締まった調子を保った。「この男」は直接的だが過度に俗悪ではなく、「偽りの証人」「律法」は一般読者にも理解できる聖書的・法的語彙である。
