revisions:
- from: ところが、「解放奴隷の会堂」[a]と呼ばれる会堂に属する人々のうち、キレネ人、アレクサンドリア人、またキリキア州とアジア州[b]の出身者たちが立ち上がり、ステファノと議論した。
  to: ところが、「解放奴隷の人々、キレネ人、アレクサンドリア人、およびキリキアとアジアから来た人々の会堂」[a]と呼ばれる会堂の者たちの中から、ある者たちが立ち上がり、ステファノと論じ合った。[b]
  rationale: 原文の単数「会堂」と、その直後に続く複数の属格による名称・関連づけを、「…の会堂」として一まとまりに訳した。その上で「その会堂の者たちの中から、ある者たち」として、反対した者が会堂全体ではないことを明示した。会堂が一つか複数かという統語上・歴史上の議論を本文で過度に決着させず、脚注で注意を促した。「論じ合った」はσυζητοῦντεςの対立的な言語行為を自然に表す。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:09Z'
