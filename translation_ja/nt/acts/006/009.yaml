source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: ja
  text: ところが、「解放奴隷の人々、キレネ人、アレクサンドリア人、およびキリキアとアジアから来た人々の会堂」[a]と呼ばれる会堂の者たちの中から、ある者たちが立ち上がり、ステファノと論じ合った。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「リベルティノイ、キレネ人、アレクサンドリア人、およびキリキアとアジアから来た人々の会堂」。リベルティノイは解放奴隷を指す語。列挙された人々と会堂との正確な関係については解釈の議論がある。
    reason: lexical_alternative
  - marker: b
    text: ここでの「アジア」は、現代のアジア大陸全体ではなく、小アジア西部にあったローマ帝国の属州を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν δέ
  choice: ところが、…立ち上がり
  rationale: δέによる反対方向への展開を「ところが」で示し、ἀνέστησανの具体的な動作と敵対的な含みを「立ち上がり」で保った。
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: 会堂に属する人々のうち…者たち
  rationale: 部分属格を日本語で自然に表し、反対したのが会堂全体ではなく、その一部であることを明確にした。
- source_word: συναγωγῆς τῆς λεγομένης
  choice: …と呼ばれる会堂
  rationale: ユダヤ人の集会または集会所を指す標準的な訳語「会堂」を用い、名称を示す分詞を素直に訳した。
- source_word: Λιβερτίνων
  choice: 解放奴隷の会堂
  rationale: ラテン語libertiniに由来し、奴隷身分から解放された者またはその子孫を指す集団名。「自由人」より歴史的意味が明確である。
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: キレネ人、アレクサンドリア人
  rationale: 各都市の出身者を示す民族・地域呼称として、簡潔で一般的な形を採った。
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: キリキア州とアジア州の出身者たち
  rationale: ἀπόの出身地の意味を明示した。両地名に「州」を添え、当時のローマ属州であることが本文でも分かるようにした。
- source_word: συζητοῦντες τῷ Στεφάνῳ
  choice: ステファノと議論した
  rationale: 文脈上は中立的な会話ではなく論争だが、「言い争った」とまで強めず、継続的な言語的対立を「議論した」で表した。
theological_decisions:
- issue: 列挙された諸集団が一つの会堂に属したのか、複数の会堂を指すのか
  choice: 一つの会堂に属する諸出身集団として訳す
  alternative: 出身集団ごとに複数の会堂があったと解して訳す
  rationale: 本文ではσυναγωγῆςが単数であり、後続の属格句をその会堂に関係する人々の列挙として読めるため。ただし統語上の議論があるので、訳文以上の断定は加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、物語の転換と論争の緊張を保った。固有名は一般的な聖書表記を採用し、歴史的に誤解されやすい名称と地名は脚注で説明した。
