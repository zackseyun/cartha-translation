source:
  edition: SBLGNT
  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: ja
  text: さて、ステファノは恵みと力に満ち[a]、民の間で大いなる不思議としるしを行っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「恵みと力に満ち」の代わりに「信仰と力に満ち」とするものがあります。
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: さて
  rationale: 強い対比ではなく、物語を先へ進める緩やかな接続を表す。日本語では「さて」が自然に談話の転換・進行を示す。
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: 恵みと力に満ち
  rationale: 属格を伴う πλήρης の、これらの性質で満たされているという意味を自然な日本語で表す。
- source_word: χάριτος
  choice: 恵み
  rationale: SBLGNTの χάριτος を直接反映し、神からの恩恵という含意も保つ。異読「信仰」は脚注に示す。
- source_word: δυνάμεως
  choice: 力
  rationale: 奇跡的な働きに現れる力を指す文脈に適し、簡潔で自然な訳語である。
- source_word: ἐποίει
  choice: 行っていた
  rationale: 未完了過去の継続的・反復的な側面を表す。
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: 大いなる不思議としるし
  rationale: τέρατα の驚異を生む性格と σημεῖα の指し示す働きを区別して保ち、μεγάλα が両者にかかることを表す。
- source_word: ἐν τῷ λαῷ
  choice: 民の間で
  rationale: その働きが行われた範囲を自然に示す。「民」はルカ文書における λαός の共同体的な響きを保つ。
theological_decisions:
- issue: χάριτος（恵み）と πίστεως（信仰）の本文異読
  choice: 恵み
  alternative: 信仰
  rationale: 指定されたSBLGNT本文の χάριτος に従う。一方、解釈上意味のある異読 πίστεως は排除せず、脚注に保存する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「大いなる」は聖書文体としての品位を保ちつつ理解しやすい表現。「しるし」は単なる奇跡一般に還元せず、出来事が何かを指し示す含意を残す。脚注記号は該当する異読箇所の直後ではなく節末に置き、本文の流れを妨げないようにした。
