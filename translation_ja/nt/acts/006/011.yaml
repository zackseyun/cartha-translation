  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: ja
  text: そこで彼らは、何人かの男たちをひそかにそそのかして[a]、こう言わせた。「私たちは、彼がモーセと神を冒瀆する言葉を語るのを聞いた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「裏で働きかけて」または「ひそかに言い含めて」。このギリシア語動詞には、人を陰でそそのかすという意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 直前の出来事を受けて次の行動へ進む物語上の時間的・論理的つながりを、自然な日本語で示す。
- source_word: ὑπέβαλον
  choice: ひそかにそそのかして
  rationale: 人に不正な発言をさせるよう裏で働きかける、 covertで使役的な含意を表す。「買収した」とまでは本文が明示しないため避けた。
- source_word: ἄνδρας
  choice: 何人かの男たち
  rationale: ἀνήρの男性を指す語義を保ちつつ、不特定複数であることを自然に示す。
- source_word: λέγοντας
  choice: こう言わせた
  rationale: ὑπέβαλονに続く分詞を、その働きかけの結果として発言させたという自然な日本語の使役表現にした。
- source_word: Ἀκηκόαμεν
  choice: 私たちは…聞いた
  rationale: 完了形は聞いた結果を現在の証言として提示するが、日本語では「聞いた」が最も自然で、その証言上の効力も文脈から明らかである。
- source_word: αὐτοῦ λαλοῦντος
  choice: あの男が…語るのを
  rationale: 聞いた対象となる継続的な発話を自然に表す。αὐτοῦは告発者の距離を帯びた指示として「あの男」とした。
- source_word: ῥήματα βλάσφημα
  choice: 冒瀆する言葉
  rationale: βλάσφημοςの宗教的・法的な告発の重みを保ち、日本語として自然な動詞的連体修飾で表した。
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: モーセと神を
  rationale: 敵対的な発言の向かう対象を「冒瀆する」の目的語として明確に表す。語順は原文どおりモーセ、神の順を保つ。
theological_decisions:
- issue: ステファノに対する告発の性質
  choice: 「モーセと神を冒瀆する言葉」と、告発内容としてそのまま報告する。
  alternative: 「モーセと神をそしる言葉」
  rationale: βλάσφημαの宗教的・法的な強さを保つ一方、引用文として提示することで、語り手が告発を真実と認定しているかのようには訳さない。
- issue: 「モーセと神」の順序
  choice: 原文の順序を保つ。
  alternative: 日本語の慣用に合わせて「神とモーセ」とする。
  rationale: 告発者がモーセを先に挙げる特徴的な順序には文脈上の意味があり得るため、解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、聖書叙事にふさわしい品位を保った。「冒瀆」は常用的な表記の「瀆」を用いる。告発内容は直接話法で明確にし、本文の脚注記号[a]を該当語句の直後に置いた。
