  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: ja
  text: しかし、私たちは祈りと、みことばを伝える務めに専念します。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「みことばの奉仕」。ギリシア語の語は「奉仕」または「務め」と訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 明示された一人称複数代名詞の対比的な強調を、自然な日本語の主題提示で表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前に他の人々へ食卓の務めを委ねる提案との対比を明確にする。
- source_word: τῇ προσευχῇ
  choice: 祈り
  rationale: προσκαρτερέωの対象を示す与格であり、「祈りに専念する」という自然な結び付きを採った。
- source_word: διακονίᾳ
  choice: 仕える務め
  rationale: 「奉仕」と「務め」の双方を含み得る語義を、日本語で行為としての奉仕性と委ねられた働きの両面が伝わるように表した。
- source_word: τοῦ λόγου
  choice: みことばに
  rationale: ここでは宣べ伝えられる神のことばを指す。「みことば」は初期キリスト教的な用法を保ちつつ、単なる一般的な発言との混同を避ける。属格関係は自然な日本語として「みことばに仕える」とした。
- source_word: προσκαρτερήσομεν
  choice: 専念します
  rationale: 未来直説法が示す決意と、継続して励む意味を、明瞭で現代的な表現にした。
theological_decisions:
- issue: 直前の食卓への奉仕との対比における διακονία の訳
  choice: みことばに仕える務め
  alternative: みことばの奉仕／みことばの務め
  rationale: 使徒の働きを単なる地位や聖職制度としてではなく、みことばに仕える働きとして示す。同時に、直前の食卓への奉仕と同じ奉仕の意味領域に属することを保ち、聖職者と信徒の固定的区分を本文へ持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「みことば」は宗教的文脈で広く理解される表記とし、「専念します」によって使徒たちの継続的な決意を自然に表現した。
