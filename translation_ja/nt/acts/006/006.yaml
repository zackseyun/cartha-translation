    issue: 後半の行為者が日本語では直前の「人々」と読まれやすい。
    rationale: ギリシア語では主語が明示されないが、使徒たちの前に人々が立たされ、その使徒たちが祈って手を置くという文脈である。日本語で主語を省くと、前節からの統語的な主語継続により別の意味になり得るため、「使徒たちは」を補う必要がある。
  - severity: low
    issue: 脚注記号が文末にあり、どの語句への注かがやや分かりにくい。
    rationale: '[a]は「立たせた」、[b]は「手を置いた」の直後に置くと、脚注の対象が明確になる。'
  revised_text: 人々は彼らを使徒たちの前に立たせた[a]。使徒たちは祈ってから、彼らの上に手を置いた[b]。
