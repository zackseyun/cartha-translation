revisions:
- from: 人々は彼らを使徒たちの前に立たせた。[a] そして祈ってから、彼らの上に手を置いた。[b]
  to: 人々は彼らを使徒たちの前に立たせた[a]。使徒たちは祈ってから、彼らの上に手を置いた[b]。
  rationale: 後半の主語を「使徒たち」と明示して、日本語の自然な主語継続が生む誤解を防いだ。これは儀礼行為の神学的意味を付加するものではなく、当該文脈での行為者を明瞭にする最小限の補足である。本文の語彙と両脚注の内容は維持し、脚注記号のみ該当表現の直後へ移した。
