reference: Acts 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: ja
  text: 人々は彼らを使徒たちの前に立たせた[a]。使徒たちは祈ってから、彼らの上に手を置いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人々は彼らを使徒たちに引き合わせた」。
    reason: lexical_alternative
  - marker: b
    text: 「手を置く」ことは、公の任命や祝福を表す場合がある。ここでギリシア語はその行為を記しているが、教会制度上の意味をそれ以上明確には定めていない。
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: 彼らを
  rationale: 前節で選ばれた七人を指す男性複数の関係代名詞。日本語では文脈上明確な「彼らを」とし、「七人」や「人々」を本文に補わず、原文の簡潔さを保った。
- source_word: ἔστησαν
  choice: 立たせた
  rationale: ἵστημιの他動詞的用法を直接表す。「使徒たちの前に立たせた」は、彼らをその場に進み出させたことを自然に伝える。提示・紹介の含意は脚注に示した。
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: 使徒たちの前に
  rationale: ἐνώπιονの「面前に、前で」という空間的・対人的意味を簡潔に表し、ἀπόστολοιは使徒言行録で定着した呼称「使徒」とした。
- source_word: προσευξάμενοι
  choice: 祈ってから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すと自然に理解されるため、現代日本語で順序が明瞭な「祈ってから」とした。
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: 彼らの上に手を置いた
  rationale: ギリシア語が記す身体的・儀礼的行為をそのまま描写し、按手礼、任命、祝福など特定の教会制度上の意味を本文で付加しない。日本語の聖書文体として自然な「手を置く」を用いた。
theological_decisions:
- issue: 手を置く行為の性格
  choice: 「彼らの上に手を置いた」と行為そのものを描写する
  alternative: 「彼らを任命した」または「彼らを按手して職に就けた」
  rationale: 原文は手を置く行為を明記するが、ここでその教会制度上の意味を一義的に定義してはいない。特定の教派的理解を本文に持ち込まないため、解釈的な言い換えを避けた。
- issue: 祈り、手を置いた主体
  choice: 第二文では主語を明示せず、原文の省略を保つ
  alternative: 「使徒たちは祈って、彼らの上に手を置いた」
  rationale: 文脈上は使徒たちを主体と理解するのが自然だが、ギリシア語では προσευξάμενοι と ἐπέθηκαν の主語が明記されていない。日本語でも主語を補わず、原文の表現上の余地を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「これらの者」のような硬い直訳調を避け、前節とのつながりが自然な「彼ら」を採用した。第二文の主語は原文同様に明示せず、解釈を過度に固定しない。
