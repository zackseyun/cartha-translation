id: ACT.6.15
reference: Acts 6:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: ja
  text: 議会[a]で席に着いていた人々は皆、彼をじっと見つめた。そして、彼の顔がまるで天使の顔のように見えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「サンヘドリン」とも訳せる。ギリシア語は、ユダヤ人の統治と司法に関わる議会を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: じっと見つめた
  rationale: 一瞥ではなく、注意を集中して見続ける動作を、自然な現代日本語で表す。
- source_word: πάντες οἱ καθεζόμενοι
  choice: 座っていた人々は皆
  rationale: πάντεςの全体性と、καθεζόμενοιが描く着席した情景の両方を保持する。
- source_word: συνεδρίῳ
  choice: 議会
  rationale: ユダヤ人の統治・司法機関を指すが、本文では一般名称として訳し、固有の歴史的名称は脚注に示す。
- source_word: πρόσωπον
  choice: 顔
  rationale: ここではステファノの目に見える顔を指すため、明快で自然な語を用いる。
- source_word: ὡσεὶ
  choice: まるで…のように
  rationale: 同一性ではなく類似を示す比喩表現として訳す。
- source_word: ἀγγέλου
  choice: 天使
  rationale: この文脈では人間の使者ではなく、超自然的な存在を指すと理解するのが自然である。
theological_decisions:
- issue: 「天使の顔のよう」の比較が具体的に何を意味するか
  choice: ステファノの顔が天使の顔に似て見えたという比喩にとどめ、類似の性質を特定しない。
  alternative: 輝き、穏やかな無実さ、または天的な権威を明示する。
  rationale: ギリシア語本文は類似を述べるだけで、それが輝き、平静、威厳のどれであるかを規定していないため、曖昧さを保つ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。ギリシア語の分詞を日本語では連続する二文に展開し、視線を向けた後に見えたものを自然な叙述順で示した。
