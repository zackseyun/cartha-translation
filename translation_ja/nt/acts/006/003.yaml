id: ACT.6.3
reference: Acts 6:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: ja
  text: さて、兄弟たち[a]、あなたがたの中から、評判のよい[b]、霊と知恵に満ちた[c]七人の男性を選びなさい。私たちは、その人たちをこの務め[d]に任命します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は原文の男性複数形を訳したもの。この呼びかけは、信者共同体全体を含む場合がある。
    reason: cultural_note
  - marker: b
    text: 別訳「良い証しを受けている」。人々から良い評価・証言を受けていることをいう。
    reason: lexical_alternative
  - marker: c
    text: 文脈上、「霊」は神の霊を指すと理解されることが多い。原文は直訳すると「霊と知恵に満ちた」であり、「聖なる」に当たる語はない。
    reason: alternative_reading
  - marker: d
    text: 「この務め」は、文脈では毎日の食物の分配に関する実務を指す（使徒6:1–2）。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: 選びなさい
  rationale: 共同体が適任者を見定めて選出するよう求める中動態命令形。日本語では「選びなさい」が自然で、文脈上の選考の意味を明確に伝える。
- source_word: δέ
  choice: そこで
  rationale: 前節の提案を受けて会衆が取るべき行動へ移る推移・帰結を自然に示す。「しかし」とするほど強い逆接ではない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を保持する。文脈上、呼びかけが信者共同体全体を含む可能性はあるが、本文ではそれを明示的に拡張しない。
- source_word: ἄνδρας
  choice: 男子
  rationale: ἀνήρはここで成人男性を明示するため、一般的な「人々」ではなく性別を保つ。「男子」は人数表現「七人」と自然に結び付く。
- source_word: ἐξ ὑμῶν
  choice: あなたがたの中から
  rationale: 選ばれる者が共同体内部の者であることを明確に表す。
- source_word: μαρτυρουμένους
  choice: 評判がよく
  rationale: 他者から好意的な証言を受けているという意味を、現代日本語で自然に表す。「良い証しを受けている」は直訳的だが分かりにくい。
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: 御霊と知恵に満ちた
  rationale: ルカ文書の文脈では神の霊を指す可能性が高いため「御霊」とする一方、原文に「聖なる」に当たる語がないことは脚注で示す。
- source_word: καταστήσομεν
  choice: 任命します
  rationale: ある責任ある役割に正式に立てる意味を自然かつ簡潔に表す。
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: この務めに
  rationale: 直前の毎日の分配に関する実務上の責任を指す。任命先の役目として自然な日本語にした。
theological_decisions:
- issue: πνεύματοςが一般的な霊を指すか、神の聖霊を指すか
  choice: 御霊
  alternative: 霊／聖霊
  rationale: 使徒言行録における用法と奉仕者の資格という文脈から神の霊を指す蓋然性が高い。ただし原文にはἁγίου（聖なる）がないため、本文で「聖霊」と補わず、脚注で原文上の幅を示した。
- issue: ἀδελφοίの呼びかけの範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者の皆さん
  rationale: 文法上の男性形を本文に保ちつつ、当時の共同体への呼びかけとして女性を含み得ることを脚注で説明する。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも適する品位ある文体。「御霊」は聖書語として通用し、原文に「聖なる」がない点を保てる。「男子」はἀνήρの性別指定を明確にするため採用した。
