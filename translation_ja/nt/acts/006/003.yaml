  to: さて、兄弟たち[a]、あなたがたの中から、評判のよい[b]、霊と知恵に満ちた[c]七人の男性を選びなさい。私たちは、その人たちをこの務め[d]に任命します。
  rationale: 成人男性を明示するἄνδραςを現代日本語として正確な「男性」に改め、δέの控えめな推移を「さて」で表した。また、πνεύματοςに原文上ない敬称・神学的明示を加えず本文を「霊」としつつ、ルカ文書の文脈に基づく理解を脚注に保持した。英語POB監査記録にあるἀδελφοίの文化的注記も追加し、脚注アンカーを本文と対応させた。
