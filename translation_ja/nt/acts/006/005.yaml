  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: ja
  text: この提案は一同の賛同を得た。そこで彼らは、信仰[a]と聖霊に満ちた人であるステファノ、フィリポ、プロコロ、ニカノル、ティモン、パルメナ、そしてアンティオキア出身のユダヤ教への改宗者[b]であるニコラオを選んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さ」とも訳せる。ギリシャ語は、信仰、信頼、忠実さを表し得る。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「改宗者」とは、異邦人からユダヤ教に改宗した人のこと。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: この提案
  rationale: 直前に使徒たちが示した具体的な方針を指すため、抽象的な「言葉」ではなく、文脈に即して「提案」とした。
- source_word: ἤρεσεν … ἐνώπιον παντὸς τοῦ πλήθους
  choice: 一同の賛同を得た
  rationale: 直訳調の「群衆全体の前で喜ばれた」を避け、集まっていた全員がその提案をよいと認めたという意味を自然な現代日本語で表した。πλῆθοςには後代の制度的な教会用語を持ち込まず、「一同」とした。
- source_word: ἐξελέξαντο
  choice: 彼らは…選んだ
  rationale: 共同体が自分たちの中から選定したことを、簡潔で自然な表現にした。
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: 信仰と聖霊に満ちた人
  rationale: 文法上の不規則な格の一致を日本語に持ち込まず、ステファノを特徴づける句として明確に表した。ἀνήρの男性性は人名と文脈から明らかであり、日本語として硬い「男」を避けて「人」とした。
- source_word: πίστεως
  choice: 信仰
  rationale: ここではステファノの神への信頼を表すと考えるのが自然である。ただし「忠実さ」の意味も取り得るため脚注に残した。
- source_word: πνεύματος ἁγίου
  choice: 聖霊
  rationale: 使徒言行録の用法に従い、単なる霊的資質ではなく神の聖霊を指すものとして訳した。
- source_word: προσήλυτον
  choice: ユダヤ教への改宗者
  rationale: 異邦人からユダヤ教に加わった者を指す歴史的意味を、現代の一般読者に分かる形で明示した。
- source_word: Ἀντιοχέα
  choice: アンティオキア出身
  rationale: ニコラオとアンティオキアとの地理的な結びつきを自然な日本語で表した。
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: ステファノ、フィリポ、プロコロ、ニカノル、ティモン、パルメナ、…ニコラオ
  rationale: 日本語聖書で理解されやすい慣用的な音写を用い、ギリシャ語の接続詞の反復は自然な列挙に整えた。
theological_decisions:
- issue: ステファノを特徴づける πίστις の意味
  choice: 信仰
  alternative: 忠実さ
  rationale: この文脈では神への信頼に満ちているという理解が自然だが、語そのものは忠実さをも表し得るため、その可能性を脚注で保存した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。冒頭は原文の意味関係を保ちながら「一同の賛同を得た」と自然に表現した。七人の名は一つのまとまりとして読みやすく列挙し、ニコラオの出身地と宗教的背景がどちらも明確にかかる語順にした。
