  terminology: 「この場所」「破壊する」「慣習」「モーセ」は適切である。「ナザレのイエス」はὁ Ναζωραῖοςの地名に基づく指示を自然に表し、「この」による告発者の指示的な強調も維持する。逐語的な「ナザレ人イエス」は注記に残す。
