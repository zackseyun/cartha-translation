id: ACT.6.14
reference: Acts 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: ja
  text: というのは、私たちは彼が「このナザレのイエス[a]は、この場所[b]を破壊し、モーセが私たちに伝えた慣習[c]を変える」と言うのを聞いたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「このナザレ人イエス」。
    reason: lexical_alternative
  - marker: b
    text: 「この場所」は神殿を指す。
    reason: cultural_note
  - marker: c
    text: 別訳「モーセが私たちに伝えた伝統」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: 私たちは……聞いた
  rationale: 完了形には現在に及ぶ結果の含みがあるが、法廷で直接耳にしたとの主張を自然な現代日本語で表すため「聞いた」とした。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の告発内容を根拠づける説明の機能を明確に表した。
- source_word: αὐτοῦ λέγοντος
  choice: 彼がこう言うのを
  rationale: 聞いた発言を直接引用へ自然につなぎつつ、彼自身が語るのを聞いたという構文を保った。
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: このナザレ人イエス
  rationale: οὗτοςの強調と、告発者側のよそよそしく敵対的にも響く呼称を保つ。「ナザレのイエス」も可能なため注記した。
- source_word: καταλύσει
  choice: 破壊し
  rationale: 神殿を指す「この場所」との組み合わせでは、取り壊す、破壊するという意味が最も自然である。
- source_word: τὸν τόπον τοῦτον
  choice: この場所
  rationale: 文脈上は神殿を指すが、原文の一般的な名詞τόποςを解釈的に限定せず訳した。
- source_word: ἀλλάξει
  choice: 変える
  rationale: ἀλλάσσωの未来形を簡明に表した。
- source_word: τὰ ἔθη
  choice: 慣習
  rationale: 共同体に受け継がれた宗教的・社会的な習わしを表す。制度化された「伝承」に限定しない語を選んだ。
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: モーセが私たちに伝えた
  rationale: παραδίδωμιが表す、受け継ぐべきものを引き渡す意味を自然に表現した。「伝承した」ほど専門的にせず、継承の含みを保った。
theological_decisions:
- issue: 「この場所」が指すもの
  choice: 本文では「この場所」とし、神殿への言及を暗示にとどめた。
  alternative: 「この神殿」または「この聖所」
  rationale: 文脈上の指示対象は神殿だが、原文はτὸν τόπον τοῦτον（この場所）であり、告発者の実際の言い方を保つため。
- issue: イエスに対する告発の語調
  choice: 「このナザレ人イエス」として指示語と呼称を保った。
  alternative: 「ナザレのイエス」
  rationale: 告発者の敵対的で距離を置く語調を消さず、同時に原文以上の侮蔑表現は加えないため。
- issue: 「慣習」とモーセの関係
  choice: 「モーセが私たちに伝えた慣習」と訳した。
  alternative: 「モーセが私たちに伝承した伝統」
  rationale: 本文は告発者の主張を報告しており、律法と後代の伝承との関係を翻訳で整理せず、ἔθηとπαρέδωκενの幅を保つため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、法廷での告発にふさわしい格調を保った。直接引用を用いて長い従属構文を自然に整理し、告発者の「この」という強い指示と「ナザレ人」という呼称の語調を残した。
