  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: ja
  text: そこで彼らは、民衆と長老たちと律法学者たちをあおり立てた。そして、ステファノに近づいて彼を捕らえ、最高法院[a]へ連れて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「議会」。ギリシア語は一般に会議・評議会を意味するが、ここではユダヤ人の最高評議機関を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: あおり立てた
  rationale: 人々の感情をかき立て、行動へ動かす使役的な意味を自然な現代日本語で表す。暴力そのものまで明示しない。
- source_word: τε
  choice: そこで
  rationale: 弱い接続辞であり、直前の企てを受けた物語上の展開・帰結を日本語として自然に示す。
- source_word: τὸν λαὸν
  choice: 民衆
  rationale: ここでは一般の人々・公衆を指すため、「民」より現代日本語で明瞭な「民衆」とした。
- source_word: τοὺς πρεσβυτέρους
  choice: 長老たち
  rationale: 単なる高齢者ではなく、ユダヤ社会の公認された指導者層を指す歴史的呼称を保つ。
- source_word: τοὺς γραμματεῖς
  choice: 律法学者たち
  rationale: 書記一般ではなく、聖書と律法に通じた専門家を指すことが普通の読者にも明確になる訳語を採る。
- source_word: ἐπιστάντες
  choice: 襲いかかって
  rationale: 突然迫るという語感と、直後の強制的な拘束を踏まえた敵対的な動きを簡潔に表す。
- source_word: συνήρπασαν
  choice: 捕らえ
  rationale: 力ずくで確保する意味を自然に表し、「引きずった」のような明示されていない移動様態は加えない。
- source_word: ἤγαγον
  choice: 連れて行った
  rationale: 先行する拘束を受け、本人の自由意思によらない移送を自然な日本語で示す。
- source_word: τὸ συνέδριον
  choice: 最高法院
  rationale: エルサレムのユダヤ人統治・司法会議を指す歴史的な固有性を表す、日本語聖書で理解可能な呼称を用いる。
theological_decisions:
- issue: συνέδριον の制度的同定
  choice: 最高法院
  alternative: 議会／最高議会
  rationale: 神学的教派性ではなく歴史的・司法的な同定である。長老と律法学者が関与するエルサレムの文脈では、ユダヤ人の最高評議機関を指す可能性が高い。ただし原語自体の一般的な意味も脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、司法的場面にふさわしい品位を保った。「最高法院」は歴史的制度を示し、別訳を脚注に置いた。
