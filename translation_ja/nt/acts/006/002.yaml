review_pass:
  verdict: approve
  source_fidelity: 原文の構文と意味を適切に反映している。「十二人」「弟子たち一同」「神のことば」「食卓の世話」という対応は、πλῆθος、λόγος、διακονεῖν τραπέζαιςの集合性・実務性を損なわない。「差し置いて」はκαταλείψανταςの文脈上の優先対象を छोड़れる／放置する含意を自然に表す。
  naturalness: 明瞭で自然な現代標準日本語である。「そこで」「呼び集めて、こう言った」および公的発言としての丁寧体も文脈に合う。「食卓の世話をする」は、直訳的すぎず、本文だけで食事給仕に限定しない表現として機能している。
  terminology: 「十二人」は原文の定着した呼称を保ち、「使徒」を補っていない。「神のことば」はλόγος τοῦ θεοῦの標準的で広がりを保つ訳語である。「ふさわしいことではありません」はἀρεστόνの適否・妥当性を表し、実務奉仕そのものを価値の低いものとする含意を避けている。
