id: ACT.6.2
reference: Acts 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: ja
  text: そこで、十二人は弟子たち一同[a]を呼び集めて、こう言った。「私たちが神のことばを差し置いて、食卓の世話をする[c]のは、ふさわしいことではありません[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弟子たちの全員」または「大勢の弟子たち」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「適切ではありません」または「受け入れられることではありません」。
    reason: lexical_alternative
  - marker: c
    text: 共同体の食事に伴う給仕や、食料・資金などの実際的な分配を担うことを指す。
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: 呼び集めて
  rationale: 中動態アオリスト分詞が主要動作に先立つ招集を表すため、集会として呼び寄せる意味を自然な現代日本語で示した。
- source_word: δὲ
  choice: そこで
  rationale: 強い逆接ではなく、直前の問題を受けた物語の展開と対応を示している。
- source_word: οἱ δώδεκα
  choice: 十二人
  rationale: 使徒集団の定着した呼称を反映しつつ、原文に明示されていない「使徒」を補わなかった。
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: 弟子たち一同
  rationale: πλῆθος の集合的な広がりを、古風にならず明瞭な日本語で表した。全員を指すか大勢の集団を指すかには幅があるため脚注を付した。
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: ふさわしいことではありません
  rationale: ここでは好感よりも、役割と優先順位に照らした適否を述べている。「正しくない」よりも、実務奉仕そのものを道徳的に否定する含みが少ない。
- source_word: ἡμᾶς καταλείψαντας
  choice: 私たちが…差し置いて
  rationale: καταλείπω の「後に残す、離れる」という強さを保ちつつ、この文脈で神のことばを優先対象から外すことを自然に表現した。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 使徒言行録で宣べ伝えられる神からの知らせを指し得る一方、広い神学的響きも保持する標準的な訳語とした。
- source_word: διακονεῖν
  choice: 世話をする
  rationale: ここでは実際的な奉仕を表すため、後代の教会職制を連想させ得る専門語を避けた。
- source_word: τραπέζαις
  choice: 食卓
  rationale: 原文の具体的な「卓」を残した。食事の給仕だけでなく共同体の食料・資金の分配を含む可能性は脚注で説明した。
theological_decisions:
- issue: 神のことばへの使徒的専念と実務奉仕との関係
  choice: 「ふさわしいことではありません」と訳し、使徒たち自身の召命と責任の優先順位として表現した。
  alternative: 「正しいことではありません」または「喜ばしいことではありません」
  rationale: 本文は実務奉仕の価値を低く評価するのではなく、責任の分担を論じている。「ふさわしい」はその区別を示しながら、原語の適否・受容可能性という幅を保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。発言は丁寧体とし、共同体に向けた公的な言葉として自然に整えた。「十二人」「神のことば」「食卓」という原文の主要な表現を保ちながら、不自然な逐語訳は避けた。
