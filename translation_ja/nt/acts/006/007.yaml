id: ACT.6.7
reference: Acts 6:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: ja
  text: こうして、神のことばは広まり続け、エルサレムでは弟子の数が大いに増えていった。また、多くの祭司たちが信仰に従うようになっていった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰に従っていた」。ここでの「信仰」は、内面的に信頼する行為だけでなく、宣べ伝えられた信仰の教えを指すことがある。
    reason: ὑπήκουον の未完了過去の継続・進展の含みと、τῇ πίστει の客観的・主観的用法の両方を示すため。
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 神から告げられた宣教の内容を指す聖書的な表現を保ちつつ、「発言」「知らせ」「福音」のいずれか一つに意味を限定しない。
- source_word: ηὔξανεν
  choice: 広まり続け
  rationale: 未完了過去が示す継続的な進展を表す。日本語では「ことばが増える」より「ことばが広まる」のほうが自然で、宣教の伸展という文脈にも合う。
- source_word: ἐπληθύνετο
  choice: 増えていった
  rationale: 未完了過去の継続性と、弟子の数が次第に増加したことを自然な日本語で表す。ηὔξανενとは異なる表現にして、二つの動詞を平板化しない。
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: 弟子の数
  rationale: 原文の構造を明瞭に反映し、ルカ文書で重要な μαθηταί を「弟子」と訳す。
- source_word: ἐν Ἰερουσαλὴμ
  choice: エルサレムでは
  rationale: 場所を示す句を、日本語の情報構造に合う主題提示として訳した。
- source_word: σφόδρα
  choice: 大いに
  rationale: 増加の著しさを、簡潔で品位ある現代日本語で表す。
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: また、大勢の祭司たちが
  rationale: πολύς ὄχλος の集合的かつ多数である意味を「大勢」で自然に表し、τε の接続も「また」で明示する。ここでの祭司はユダヤの神殿祭司を指す。
- source_word: ὑπήκουον
  choice: 従うようになった
  rationale: 与格を伴う「従う／服従する」の意味を保ち、未完了過去と回心の文脈から、多くの祭司が次々にその状態へ入ったという進行的な含みを表す。
- source_word: τῇ πίστει
  choice: その信仰
  rationale: 定冠詞を踏まえ、単なる内面的な信頼だけでなく、受け入れられた信仰の内容、すなわち宣べ伝えられた教えを指し得る客観的な用法を保つ。「キリスト教信仰」と説明的に限定することは避ける。
theological_decisions:
- issue: τῇ πίστει における πίστις の意味
  choice: その信仰
  alternative: 信仰／信仰の教え
  rationale: 定冠詞と「従う」という動詞の組み合わせは、主観的な信頼行為よりも、信じ受け入れるべき宣教の内容を指す可能性が高い。ただし原文は単に πίστις としており、その両義性を本文と注で残した。
- issue: ὑπήκουον の相と回心の含み
  choice: 従うようになった
  alternative: 従っていた
  rationale: 未完了過去は継続的な服従そのものとも、祭司たちが次々に従う者となった過程とも理解できる。文脈上は後者を本文に採りつつ、前者を注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「神のことば」「弟子」「祭司」「信仰」などの主要語は伝統的で広く理解される語を採用し、三つの未完了過去は「広まり続け」「増えていった」「従うようになった」と、単調さを避けつつ継続・進展を表した。
