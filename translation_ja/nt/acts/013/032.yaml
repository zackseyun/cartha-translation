  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: ja
  text: 私たちも、父祖たちになされた約束を、良い知らせとしてあなたがたに告げ知らせています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「先祖たち」。ギリシア語は「父たち」で、イスラエルの父祖を指す契約史的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: も
  rationale: 直前の証言とのつながりを保ちつつ、続く明示的な「私たち」に自然に結び付ける。文脈上、「そして」より日本語として滑らかである。
- source_word: ἡμεῖς
  choice: 私たち
  rationale: 明示された代名詞の存在を訳出する。「私たち自身も」は日本語では過度に対比的になり得るため、καίを「も」としてその強調を自然に表した。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: εὐαγγελιζόμεθαの知らせを受ける複数の相手を、自然な間接目的語として表す。
- source_word: εὐαγγελιζόμεθα
  choice: 良い知らせを……告げ知らせています
  rationale: 良い知らせを伝えるという動詞の意味を明示し、「福音を宣べ伝える」のような教会用語だけに依存しない表現とした。現在形の継続的・現時点的な響きも保持する。
- source_word: τὴν ... ἐπαγγελίαν
  choice: 約束という良い知らせ
  rationale: 原文では「約束」がεὐαγγελιζόμεθαの内容であるため、その関係を日本語で自然に示す。「約束についての」では内容関係が弱くなり得る。
- source_word: πρὸς τοὺς πατέρας
  choice: 父祖たちに
  rationale: πρόςが示す約束の受け手を表し、πατέρεςの男性的・契約史的な家系表現を「先祖」へ一般化せず保持する。
- source_word: γενομένην
  choice: なされた
  rationale: 約束が父祖たちになされたことを表す。「成就した」とはせず、次節の内容を先取りしない。
theological_decisions:
- issue: πατέρεςの訳し方
  choice: 父祖たち
  alternative: 先祖たち
  rationale: イスラエルの先人を指す契約史的な男性家系語の響きを保つ。「先祖たち」も意味上可能だが、原語の父系的表現を一般化するため脚注に示す。
- issue: 約束と良い知らせの関係
  choice: 約束という良い知らせ
  alternative: 約束についての良い知らせ
  rationale: 対格の「約束」自体が告げ知らされる内容であるという構文を保つ一方、その約束の成就についての知らせという文脈的含みを過度に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒の宣言にふさわしい端正さを保った。「良い知らせを告げ知らせる」は語根的な反復感が日本語でも許容範囲にあり、原語のεὐαγγελίζομαιの意味を一般読者に明示する。
