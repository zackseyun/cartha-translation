  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: ja
  text: 異邦人たちはこれを聞くと[a]、喜び、主のことばをあがめた。そして、永遠のいのちに定められていた人は皆、信じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これ」は文脈から補った語。後半は別訳「永遠のいのちへと心が向いていた人は皆、信じた」。ギリシア語の分詞には異なる解釈があるが、受動態として「定められていた」とするのが最も直接的である。
    reason: 文脈上の補足語を明示し、神学的に議論のあるτεταγμένοιについて、本文の受動的な訳を維持したまま代替解釈を示すため。
lexical_decisions:
- source_word: ἀκούοντα
  choice: これを聞くと
  rationale: 現在分詞を主動詞の状況を示す副詞的表現として訳した。「これ」は直前に語られた内容を自然な日本語で受けるために補った。
- source_word: τὰ ἔθνη
  choice: 異邦人たち
  rationale: 使徒言行録の文脈では、ユダヤ人と区別される非ユダヤ人を指すため、「諸国民」より「異邦人たち」が明確で自然である。
- source_word: ἔχαιρον
  choice: 喜び始め
  rationale: 未完了過去の継続的または起動的なニュアンスを、文脈に即して自然に表した。
- source_word: ἐδόξαζον
  choice: あがめた
  rationale: δοξάζωの「栄光を帰す、たたえる」の意味を、目的語が「主のことば」であることを踏まえ、現代日本語として自然かつ荘重に表した。未完了過去の継続性は、先行する「喜び始め」と一連の反応をなす文脈で示される。
- source_word: τὸν λόγον τοῦ κυρίου
  choice: 主のことば
  rationale: λόγοςが宣べ伝えられた知らせを指す一方、聖書的表現と神学的含意を保つため「ことば」とした。κύριοςは「主」とした。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: アオリスト直説法を簡潔に訳し、原文にない説明を加えなかった。
- source_word: ὅσοι
  choice: 人は皆
  rationale: 数量的な包括性を自然な日本語で明確に表す。
- source_word: τεταγμένοι
  choice: 定められていた
  rationale: τάσσωの完了受動分詞を受動として保ち、先行して定められた状態にあったことを表す。「心が向いていた」という解釈は脚注に残した。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 永遠のいのちに
  rationale: εἰςの方向・帰着または目的を簡潔に保つ。「永遠のいのちのために」より日本語として自然である。
theological_decisions:
- issue: τεταγμένοιが神による任命を示すのか、人の内的傾向を示すのか
  choice: 永遠のいのちに定められていた
  alternative: 永遠のいのちへと心が向いていた
  rationale: 完了受動分詞の最も直接的な読みを本文に採用しつつ、誰が定めたかや予定論の体系までは本文に補わない。解釈上の別案は脚注に示し、神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「主のことば」「永遠のいのち」など定着した聖書語彙の品位を保った。「いのち」は単なる生存以上の神学的含意を伝えるため、ひらがな表記とした。
