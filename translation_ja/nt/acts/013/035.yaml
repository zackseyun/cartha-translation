id: ACT.13.35
reference: Acts 13:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: ja
  text: 'ですから、別の詩篇[a]でもこう言っています。

    「あなたは、あなたの聖なる者[b]が朽ちる[c]のをお許しにならない。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「別のもの（ところ）で」。または「別の箇所で」「別の節で」。原文には「詩篇」という語はありません。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたに忠実な者」。
    reason: lexical_alternative
  - marker: c
    text: または「腐敗する」「朽ち果てる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ですから
  rationale: 直前の聖書引用から次の証拠へ論を進める推論的な接続を、現代日本語で明確に表す。
- source_word: καὶ
  choice: でも
  rationale: 別の聖書箇所を追加の証拠として挙げる働きを自然な日本語で示す。
- source_word: ἐν ἑτέρῳ
  choice: 別の詩篇で
  rationale: ギリシア語は名詞を省いて単に「別のもの（ところ）で」とするが、引用元が詩篇16篇であるため、文脈上暗黙の内容を補って読者に明確にした。より字義的な選択肢は脚注に残す。
- source_word: λέγει
  choice: こう言っています
  rationale: 現在形の引用導入句を保つ。日本語では主語を明示せず、神が言うのか聖書が言うのかという原文上の余地を残した。
- source_word: Οὐ δώσεις
  choice: お許しにならない
  rationale: δίδωμιと不定詞の構文はここでは「許す、…させる」の意味であり、敬意を含む自然な日本語にした。
- source_word: τὸν ὅσιόν σου
  choice: あなたの聖なる者
  rationale: ὅσιοςの神への聖さ・忠実さを表す語義を保ちつつ、使徒言行録の文脈でイエスに適用される表現として訳した。日本語では大文字による指示対象の明示は行わない。
- source_word: ἰδεῖν
  choice: …のを
  rationale: 字義は「見る」だが、「朽ちるのを見る」は日本語では本人が観察する意味にも取られやすい。許可構文全体を「朽ちるのを許す」として、経験する意味を自然に伝えた。
- source_word: διαφθοράν
  choice: 朽ちる
  rationale: 復活を論じる文脈における身体の腐敗を、普通の現代日本語で簡潔に表す。名詞を含むギリシア語構文は日本語では動詞化した。
theological_decisions:
- issue: 詩篇引用中のὅσιοςが指す者
  choice: 「あなたの聖なる者」と訳す
  alternative: 「あなたに忠実な者」
  rationale: 語には「聖なる」と「忠実な」の両面がある。パウロがこの箇所をイエスの復活に適用する文脈を踏まえつつ、語義を狭めすぎない伝統的で明瞭な表現を本文に採用し、別訳を脚注に示した。
- issue: ἐν ἑτέρῳで省略された名詞
  choice: 「別の詩篇」と補う
  alternative: 「別の箇所」または「別の節」
  rationale: 原文の省略を日本語で補い、実際の引用元が詩篇であることを明確にする。ただし原文自体は「詩篇」と明記しないため、その点を脚注に示した。
- issue: λέγειの暗黙の主語
  choice: 日本語でも主語を明示しない
  alternative: 「神は言っています」または「聖書は言っています」
  rationale: ギリシア語の動詞には主語が明記されず、神または聖書を指し得る。どちらかに限定せず、原文の曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書引用としての品位を保った。「ですから」で論証の流れを示し、引用導入句では原文どおり主語を限定しない。神に向けた二人称とその行為には「あなた」「お許しになる」を用いた。
