id: ACT.13.6
reference: Acts 13:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: ja
  text: 二人は島全体を通ってパフォスまで行き、魔術師であり、偽預言者でもある、バルイエス[a]という名のあるユダヤ人を見つけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バルイエス」はバルイエスとも表記される。この名は、「イエスの子」または「ヨシュアの子」を意味するセム語系の父称を反映している可能性が高い。
    reason: 固有名は本文で音写したまま、表記上の代替形と語源的な可能性を注で示すため。
lexical_decisions:
- source_word: διελθόντες
  choice: 通って……まで行き
  rationale: アオリスト分詞が主動詞に先立つ移動を表すため、島を横断して目的地に至ったことが自然に伝わる表現とした。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは物語を穏やかに進める接続辞であり、日本語では文脈上、接続語を置かないほうが自然である。
- source_word: ὅλην τὴν νῆσον
  choice: 島全体
  rationale: 島を広く横断したという原文の範囲を簡潔に保つ。
- source_word: ἄχρι Πάφου
  choice: パフォスまで
  rationale: 移動の到達点を示すἄχριを、自然な地理表現で訳した。
- source_word: εὗρον
  choice: 出会った
  rationale: 単に捜して発見したとは限らないため、物語中で人物に遭遇したことを自然に示す表現とした。
- source_word: ἄνδρα τινὰ
  choice: ある……人
  rationale: τινάの不定かつ個別化する働きを日本語の「ある」で保持した。
- source_word: μάγον
  choice: 魔術師
  rationale: この文脈では魔術を行う者を指す。「博士」では意味がずれ、「魔法使い」よりも「魔術師」が現代日本語の聖書文体に適する。
- source_word: ψευδοπροφήτην
  choice: 偽預言者
  rationale: 預言者を自称またはそのように振る舞いながら偽りであるという原語を直接的に表す。
- source_word: Ἰουδαῖον
  choice: ユダヤ人
  rationale: ここでは人物の民族的・宗教的帰属を示す実詞的用法であり、地理的な「ユダヤ地方の人」に限定する根拠はない。
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: バルイエスという名の
  rationale: ギリシア語の命名表現を自然な日本語にし、固有名は翻訳せず音写した。
theological_decisions:
- issue: 固有名Βαριησοῦの訳し方
  choice: バルイエス
  alternative: イエスの子／ヨシュアの子
  rationale: セム語系の父称として「イエス（またはヨシュア）の子」を意味する可能性が高いが、本文では固有名として機能しているため音写し、意味は注に示した。
- issue: μάγοςの意味範囲
  choice: 魔術師
  alternative: 博士／呪術師
  rationale: この箇所の否定的文脈は秘術・魔術の実践者を示すが、原語以上に悪質性を限定する語を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然でありながら品位を保った。「魔術師」「偽預言者」「ユダヤ人」という同格要素は、日本語で人物像を把握しやすい語順にまとめた。
