  to: 二人は島全体を通ってパフォスまで行き、魔術師であり、偽預言者でもある、バルイエス[a]という名のあるユダヤ人を見つけた。
  rationale: 主動詞εὗρονを「見つけた」として原文の探索・発見の語感を保ち、原文にない「そこで」を除きました。同格の「魔術師」「偽預言者」「ユダヤ人」と固有名を、現代日本語で無理なく読める語順に整えています。注は本文の音写を維持しつつ、英語監査記録にある表記の代替形と、語源的意味が確定ではないことを反映しました。
