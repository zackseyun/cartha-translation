  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: ja
  text: それから彼らは王を求め、神は彼らに、キシュの子でベニヤミン族出身のサウロを四十年間お与えになった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「四十年間」について、旧約聖書の年代記述との関係に疑問が生じると見る人もいる。本訳は、ここに記されたルカの表現をそのまま保っている。
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: そしてその後
  rationale: 直訳的な「そこから」も可能だが、ここでは歴史の順序をつなぐ移行表現として理解するのが自然であり、現代日本語では「そしてその後」が明瞭である。空間的な含みもあり得るため脚注に残した。
- source_word: ᾐτήσαντο βασιλέα
  choice: 彼らが王を求めた
  rationale: 中動態による自分たちのための願いを自然に表す。「要求した」では語調を強めすぎるため、「求めた」とした。
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: 神は彼らに…お与えになった
  rationale: 明示された主語と与える行為を保持し、神への敬意を示す自然な日本語の敬語表現とした。「任命した」のように意味を狭めない。
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: キシュの子サウロ
  rationale: 標準的な父称表現として簡潔に訳した。固有名は日本語聖書で一般的な表記を用いた。
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: ベニヤミン族の人
  rationale: 出身部族を示すἐκの意味を自然な日本語で表し、ἄνδραがサウロ個人を説明する同格句であることを保った。
- source_word: ἔτη τεσσεράκοντα
  choice: 四十年間
  rationale: 対格による期間表現を明示し、直前の神がサウロを与えたという節に係る語順を保った。
theological_decisions:
- issue: ἔτη τεσσεράκονταが示す期間
  choice: サウロが王として与えられた期間を「四十年間」と訳す。
  alternative: 歴史的要約全体に緩やかに関係する期間と捉える。
  rationale: ギリシア語では直前の、神がサウロを与えたという節に係るのが最も自然である。旧約の年代資料との関係を本文で調整せず、ルカの表現をそのまま保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「お与えになった」は神を主語とする日本語として自然な敬意表現であり、過度に古風な文体は避けた。
