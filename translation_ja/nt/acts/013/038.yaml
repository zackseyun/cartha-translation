  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: ja
  text: ですから、兄弟たち[a]、あなたがたに知っておいてください。この方[b]によって、罪の赦しがあなたがたに告げ知らされています。また、モーセの律法によっては義と認められることができなかった、あらゆる事柄から――[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この呼びかけは、集まっていた聴衆全体を含む意味で「兄弟姉妹の皆さん」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直前に語られたイエスを指す。
    reason: cross_reference
  - marker: c
    text: 提示されたギリシア語本文はここで文が完結しておらず、次の句へ続く。一般的な節区分では、「また」以下は13章39節に属する。
    reason: source_text_note
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: ですから、…あなたがたに知っておいていただきたい
  rationale: οὖνの論理的つながりと、γνωστὸν … ἔστωの宣言的な命令の力を、明瞭で自然な現代日本語にした。
- source_word: ἄνδρες ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形による同胞への呼びかけを簡潔に保った。聴衆全体を包括する可能性は脚注に示した。
- source_word: διὰ τούτου
  choice: この方を通して
  rationale: 直前に言及されたイエスを指す男性単数の指示代名詞であるため、指示性と敬意を自然な日本語で表した。
- source_word: ἄφεσις ἁμαρτιῶν
  choice: 罪の赦し
  rationale: この文脈での確立した意味を、一般読者にも明瞭な表現で示した。
- source_word: καταγγέλλεται
  choice: 告げ知らされている
  rationale: 現在受動形が表す公の宣言・布告の意味を保った。
- source_word: ἐν νόμῳ Μωϋσέως
  choice: モーセの律法によっては
  rationale: ἐνがここで手段または領域を表すことを日本語の助詞「によって」で自然に示し、対照を表す「は」を添えた。
- source_word: δικαιωθῆναι
  choice: 義と認められる
  rationale: 法廷的・神学的含意を保ちつつ、「義とされる」より意味の伝わりやすい現代日本語を選んだ。
- source_word: ἀπὸ πάντων ὧν
  choice: すべてのことから
  rationale: 後続するδικαιωθῆναιとの関係を日本語として組み替え、「律法によっては義と認められなかったすべてのことから」という構造を保った。
theological_decisions:
- issue: δικαιωθῆναιの訳し方
  choice: 義と認められる
  alternative: 義とされる／正しいと宣告される
  rationale: 単なる道徳的改善に解消せず、神の法廷的な承認を含む語義を明瞭に表した。
- issue: ἄνδρες ἀδελφοίの対象範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹の皆さん
  rationale: 原文の男性形を本文に保ちながら、集まった聴衆への包括的呼称である可能性を脚注で確保した。
- issue: 提示されたギリシア語本文と節範囲の不一致
  choice: 提示本文にある語だけを訳し、未提示の結語を補わない
  alternative: 英語POBに従って「信じる者は皆、義と認められます」を補う
  rationale: 提示されたSBLGNT本文はκαὶ ἀπὸ πάντων以下で次節へ入りながら、文を完結させるἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦταιを含まない。原語資料を優先し、未提示のギリシア語を本文へ silently 補わず、継続をダッシュと脚注で明示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。説教における厳粛な告知の調子を保ちつつ、古風な文語は避けた。提示された原文が通常の節境界を越えて未完のまま終わるため、長いダッシュで継続を示した。
