  verdict: revise
  source_fidelity: 本文の「彼らが出て行く時」は、Ἐξιόντων ... αὐτῶν の曖昧な指示対象を保っている。「次の安息日に」「これらの言葉」も原文に忠実である。しかし、後続の「しきりに願った」は日本語では先行する「彼ら」をそのまま主語として受け取られやすく、また「自分たちに」は願った者と受益者の同一性を強く示す。そのため、属格独立構文の人物と παρεκάλουν の（原文で明示されない）主語との関係にある曖昧さを十分には保てない。
  naturalness: 「彼らが出て行く時」は自然である。一方、主語を省略した「しきりに願った」は、直前の「彼ら」との同一主語解釈をほぼ避けられない。「…という願いがしきりに出された」とすることで、明瞭な現代標準語を保ちながら、本文が明示しない願い手を特定しない。
  terminology: 「安息日」「これらの言葉」は適切である。「語ってほしい」は λαληθῆναι の受動不定詞を、日本語の依頼内容として自然に表す。
