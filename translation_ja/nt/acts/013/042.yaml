  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: ja
  text: 彼らが出て行く時[b][a]、次の安息日にこれらの言葉を自分たちに語ってほしいという願いが、しきりに出された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、より明確に「パウロとバルナバが出て行く時、人々は、次の安息日にこれらの言葉を自分たちに語ってほしいと願った」とあります。
    reason: textual_variant
  - marker: b
    text: 別訳「彼らが立ち去ろうとしていた時、来たる安息日にこれらのことを自分たちに語ってほしいという願いが出された」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: 出て行く時
  rationale: 現在分詞を伴う属格独立構文を自然な時の節として訳し、動作の進行性を保った。「立ち去る時」も可能だが、やや解釈的である。
- source_word: δὲ
  choice: （時の節に吸収）
  rationale: ここでは弱い接続を示すため、日本語では独立した接続詞を置かず、時の節として自然に表した。
- source_word: αὐτῶν
  choice: 彼らが
  rationale: 本文が固有名を明示していないため、「パウロとバルナバ」などと特定せず、代名詞のまま訳した。
- source_word: παρεκάλουν
  choice: しきりに願った
  rationale: 未完了過去の継続・反復性と、単なる依頼より強い懇願のニュアンスを表した。
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: 次の安息日に
  rationale: この慣用句は、間に来る安息日、すなわち次の安息日を指す。現代日本語で明瞭な表現を採った。
- source_word: λαληθῆναι
  choice: 語ってほしい
  rationale: 受動不定詞を日本語の依頼表現として自然に転換しつつ、発話を表す語義を保った。
- source_word: αὐτοῖς
  choice: 自分たちに
  rationale: 依頼している側を受ける間接目的語として自然に表した。指示対象を固有の集団名で特定していない。
- source_word: τὰ ῥήματα ταῦτα
  choice: これらの言葉
  rationale: 直前の会堂での説教を指すが、「この教え」などと解釈的に言い換えず、ῥήματαの語義に近く訳した。
theological_decisions:
- issue: 節中の代名詞および省略された主語の指示対象
  choice: 本文では「彼ら」以外の主体を明示せず、「願った」の主語も日本語として省略し、原文の指示対象の曖昧さを残した。
  alternative: 「人々がパウロとバルナバに願った」などと主体と相手を明示する。
  rationale: この節には本文異同と解釈上の難しさがあり、誰が退出し、誰が願ったかについて読みが分かれる。採用されたギリシア語本文は固有名を明示しないため、翻訳本文でも一つの解釈に限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会堂での語りにふさわしい落ち着いた文体とした。「しきりに願った」で未完了過去の継続性を示し、主語の省略によって原文の genuine な曖昧さを保持した。
