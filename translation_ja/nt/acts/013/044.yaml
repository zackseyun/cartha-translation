source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: ja
  text: 次の安息日[a]に、町のほとんどすべての人が、主のことば[b]を聞くために集まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「来たる安息日」または「続く安息日」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「主のことば」は、「主からのメッセージ」、また文脈上「主についてのメッセージ」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: 次の安息日には
  rationale: ἐρχομένῳ は「来たる」「続く」を表し、与格句は時を示す。日本語では「次の安息日」が自然であり、別の表現可能性は脚注に残した。δέ はここでは場面の推移として語順と「には」に織り込み、機械的に接続詞を加えなかった。
- source_word: σχεδὸν πᾶσα ἡ πόλις
  choice: 町中の人がほとんど皆
  rationale: 直訳的な「ほとんど町全体」ではなく、集まった主体が住民であることを自然な日本語で明示しつつ、「町を挙げて」と言えるほどの広がりと、σχεδόν の「ほとんど」を保持した。
- source_word: συνήχθη
  choice: 集まった
  rationale: συνάγω のアオリスト受動形はここで自動詞的に、人々が一か所に集ったことを表す。「集合させられた」とはしなかった。
- source_word: ἀκοῦσαι
  choice: 聞くために
  rationale: 不定詞が集まった目的を表すため、目的節として明確に訳した。
- source_word: τὸν λόγον
  choice: ことば
  rationale: λόγος はここでは宣べ伝えられる知らせを指すが、使徒言行録に反復される表現とのつながりを保つため「メッセージ」と解釈的に限定せず、「ことば」とした。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: κύριος を標準的に「主」と訳し、属格の意味を「主からの」または「主についての」の一方に限定しない形を本文に残した。
theological_decisions:
- issue: κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: 初期キリスト教の宣教用語としての響きを保ち、本文が明示しない限定を加えないため。
- issue: 「主のことば」における属格の意味
  choice: 主のことば
  alternative: 主からの知らせ／主についての知らせ
  rationale: この属格は、ことばの源・帰属と内容に重なり合う含みを持ちうる。「主のことば」という簡潔な表現でその余地を保ち、可能な理解を脚注に示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、礼拝朗読にも耐える簡潔で品位ある文体にした。「町中の人がほとんど皆」により、全住民一人残らずという厳密な断定ではなく、原文の広い誇張表現を再現した。
