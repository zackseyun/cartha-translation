id: ACT.13.1
reference: Acts 13:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: ja
  text: さて、アンティオキアにある教会には、預言者と教師たちがいた。すなわち、バルナバ、「ニゲル」と呼ばれていたシメオン[a]、キレネ出身のルキオ[b]、領主ヘロデの親しい仲間であったマナエン[c]、そしてサウロである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ニゲル」はラテン語で「黒い」を意味する名です。ここでは固有の呼び名として音写しています。
    reason: lexical_alternative
  - marker: b
    text: キレネは北アフリカにあった都市です。
    reason: cultural_note
  - marker: c
    text: 別訳「領主ヘロデとともに育った者」または「領主ヘロデの乳兄弟」。原語は、ともに育った者を指す場合があり、単なる親しい仲間より具体的な関係を含む可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: さて、……いた
  rationale: Ἦσανを存在表現「いた」で訳し、δέは弱い談話上の接続として「さて」で示した。時間的な「今」を意味させない。
- source_word: κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: アンティオキアにある教会には
  rationale: アンティオキアに存在する地域教会を指す句として、自然な現代日本語にした。
- source_word: προφῆται καὶ διδάσκαλοι
  choice: 預言者や教師たち
  rationale: 教会内でその働きを担う二つの集団を示す。日本語の列挙として自然になるよう「や」を用いた。
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: 「ニゲル」と呼ばれていたシメオン
  rationale: Συμεώνをシメオンと音写し、Νίγερは異名・呼称として翻訳せず音写した。
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: キレネ出身のルキオ
  rationale: Κυρηναῖοςがキレネ出身者を表すことを、現代日本語で明確にした。
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: 領主ヘロデ
  rationale: τετραάρχηςはローマ支配下の地方統治者の称号であり、日本語聖書で理解しやすい「領主」とした。本文にない「アンティパス」は補わない。
- source_word: σύντροφος
  choice: 一緒に育てられた
  rationale: 語の中心的な含意である共同養育・同じ環境での成育を示しつつ、養兄弟という特定の制度的関係までは断定しない。
theological_decisions:
- issue: アンティオキア教会における預言者と教師の位置づけ
  choice: 「預言者や教師たち」と役割名をそのまま訳す
  alternative: 後代の制度的な聖職位として訳す
  rationale: 本文は彼らの働きを示すが、後代の教職制度や序列までは定義していないため。
- issue: マナエンとヘロデの関係
  choice: 「一緒に育てられた」
  alternative: 「乳兄弟」「親しい友」「幼なじみ」
  rationale: σύντροφοςは共同養育を含意し得る一方、厳密な血縁・乳兄弟関係や単なる友情を確定できない。本文では共同の育ちを示し、可能な解釈の幅を注で保った。
translation_notes:
  register: 明快で格調を保った現代標準日本語。人名は一般的な日本語聖書表記に従った。列挙を「すなわち」で導き、原文の構造を読みやすく再現した。脚注記号は説明対象の直後に置いた。
