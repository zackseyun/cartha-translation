  to: さて、アンティオキアにある教会には、預言者と教師たちがいた。すなわち、バルナバ、「ニゲル」と呼ばれていたシメオン[a]、キレネ出身のルキオ[b]、領主ヘロデの親しい仲間であったマナエン[c]、そしてサウロである。
