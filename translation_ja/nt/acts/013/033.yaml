id: ACT.13.33
reference: Acts 13:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: ja
  text: '神は、イエスを起こし立てることによって[b]、このことを私たちの子孫のために実現されました[a]。第二の詩編にもこう書かれています。


    「あなたはわたしの子。今日、わたしはあなたを生んだ。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本には「私たち、すなわち彼らの子孫のために」とあります。
    reason: textual_variant
  - marker: b
    text: 「イエスを死者の中からよみがえらせることによって」とも訳せます。ギリシア語の表現は、イエスを起こし立てる、または任命するという意味にも取れます。
    reason: alternative_reading
lexical_decisions:
- source_word: ταύτην
  choice: このこと
  rationale: 直前に述べられた約束を指す代名詞であるため、本文にない名詞を補わず、自然な日本語で受けた。
- source_word: ἐκπεπλήρωκεν
  choice: 実現してくださいました
  rationale: 完了形が表す、成し遂げられて現在も効力を持つ行為を示す。「約束を実現する」という文脈にも自然に合う。神への敬意を表すため敬語を用いた。
- source_word: τοῖς τέκνοις ἡμῶν
  choice: 私たちの子孫のために
  rationale: τέκνα はここでは世代上の『子孫』を指し、与格は受益者として訳した。底本文の ἡμῶν をそのまま反映し、異読は脚注に示した。
- source_word: ἀναστήσας Ἰησοῦν
  choice: イエスを立てることによって
  rationale: ἀνίστημι が持ち得る、人物を起こし立てる／世に遣わす意味を簡潔に表した。死者からの復活を指す可能性は脚注で明示し、本文だけで解釈を固定しないようにした。
- source_word: γέγραπται
  choice: 書かれています
  rationale: 聖書引用を導入する定型表現として自然であり、完了形が示す、書かれた言葉の継続的な効力も伝える。
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: 第二の詩編
  rationale: ギリシア語の序数表現に沿いつつ、現代日本語の聖書用語として明瞭にした。
- source_word: Υἱός μου εἶ σύ
  choice: あなたはわたしの子
  rationale: 簡潔で自然な語順を採り、父子関係の宣言を解釈的に拡張せず保持した。
- source_word: σήμερον γεγέννηκά σε
  choice: わたしは今日、あなたを生んだ
  rationale: γεννάω の基本義を直接表し、詩編2:7の王的・キリスト論的含意を説明的な訳語で限定しないようにした。日本語では過去形が完了した行為を自然に伝える。
theological_decisions:
- issue: ἀναστήσας Ἰησοῦν の意味
  choice: 本文では「イエスを立てることによって」とし、神がイエスを起こし立てた／世に遣わした意味を保った。
  alternative: 「イエスを死者の中からよみがえらせることによって」
  rationale: 直後の節は復活を明示する一方、使徒言行録では同じ動詞が指導者や救い主を起こし立てる意味でも用いられる。本文で一方に決めず、復活の読みを脚注に残した。
- issue: 「今日、あなたを生んだ」のキリスト論的意味
  choice: 詩編の引用を直接訳し、説明を加えなかった。
  alternative: 即位、養子とすること、または復活による公的な顕示を明示する訳
  rationale: 詩編2:7の引用自体が持つ神学的緊張を保ち、翻訳によって後代の論争や特定の教派的解釈を決着させないため。
translation_notes:
  register: 明瞭な現代標準語を用い、聖書引用には簡潔で格調ある調子を保った。「御子」「もうけた」など日常の読者に分かりにくい語を避けつつ、詩編引用の簡潔さと神学的余韻を残した。脚注記号は該当箇所の直後に配置した。
