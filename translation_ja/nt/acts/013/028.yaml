id: ACT.13.28
reference: Acts 13:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: ja
  text: そして、死刑に値する理由が何も見つからなかったのに[a]、彼らはピラトに、彼を処刑するよう求めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死刑に当たる罪状が何も見つからなかったのに」または「死刑にする法的根拠が何も見つからなかったのに」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼を死刑にするよう求めた」または「彼を殺すよう求めた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前から続く物語の流れを、解釈を加えず自然な現代日本語で示す。
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: 死刑に値する理由が何も
  rationale: αἰτίαはこの司法的文脈では「理由」「罪状」「根拠」を表し、θανάτουと結びついて死刑に相当する根拠を意味する。「死の理由」という誤解を避けつつ、原文の法的含意を伝える。
- source_word: εὑρόντες
  choice: 見つからなかったのに
  rationale: アオリスト分詞の先行的な状況を表しつつ、死刑の根拠がないにもかかわらず処刑を求めたという文脈上の譲歩的な対照を自然に明示する。
- source_word: ᾐτήσαντο
  choice: 求めた
  rationale: 正式な権力者への要求という場面に適し、「頼んだ」より司法的文脈になじむ一方、「請願した」ほど硬すぎない。
- source_word: Πιλᾶτον
  choice: ピラト
  rationale: 日本語聖書で広く定着している人名表記を用いる。
- source_word: ἀναιρεθῆναι αὐτόν
  choice: 彼を処刑するよう
  rationale: ἀναιρέωはここでは殺す、死に至らせる意であり、ローマ総督に対する司法的要求という文脈から「処刑する」が最も明確で自然である。受動不定詞の内容は、日本語ではピラトへの依頼内容として能動的に表すのが自然である。
theological_decisions:
- issue: 分詞句の譲歩的関係を明示するか
  choice: 死刑に値する理由が何も見つからなかったのに
  alternative: 死刑に値する理由が何も見つからず
  rationale: 分詞そのものは状況を示すが、文脈には、根拠を見いだせなかったにもかかわらず処刑を求めたという明白な緊張がある。「のに」はその対照を自然に保ち、動機などを付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「死刑に値する理由」は一般読者にも理解しやすく、司法的含意も保持する。主語「彼ら」と目的語「彼」は原文に沿って保ち、文脈上の指示対象を訳文内で不必要に特定し直していない。
