id: ACT.13.45
reference: Acts 13:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: ja
  text: しかし、ユダヤ人たちは[a]群衆を見て、ねたみに満たされ[b]、パウロが語っていたこと[c]に反論し、冒瀆しながら語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「ユダヤ人たち」は、この場面でパウロに反対した現地の一団を指し、ユダヤ人全体を指すものではない。
    reason: cultural_note
  - marker: b
    text: 「熱心に満たされ」とも訳せる語だが、ここでは文脈から「ねたみ」の意味と考えられる。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「パウロによって語られていることに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 見て
  rationale: アオリスト分詞を主動詞に先立つ状況として自然に表し、「群衆を見たとき」の意味を簡潔に伝える。
- source_word: δὲ
  choice: しかし
  rationale: 直前の人々の好意的な反応から敵対へ転じる対照を明確にする。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の明示的な呼称を保ち、指導者だけに限定しない。文脈上の範囲は脚注で明確にする。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語では集合を指す「群衆」が自然であり、多数の集まりを十分に表す。
- source_word: ἐπλήσθησαν ζήλου
  choice: ねたみに満たされ
  rationale: ζῆλοςには「熱心」と「ねたみ」の両義があるが、群衆を見た後の反論と冒瀆という敵対的文脈では「ねたみ」が適切。原語の「満たされる」という比喩も保持する。
- source_word: ἀντέλεγον
  choice: 反論し
  rationale: 未完了形の継続的な対抗発言を自然な日本語で示す。後続する分詞と並べ、彼らの振る舞いを一続きに描く。
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: パウロの語ることに
  rationale: 冠詞付き受動分詞が指すパウロの発言内容を、自然な能動表現で訳す。進行中の発言との同時性も表せる。
- source_word: βλασφημοῦντες
  choice: 冒瀆の言葉を口にした
  rationale: 対象を原文以上に特定せず、βλασφημέωの宗教的・侮辱的な強さを保ちながら、現代日本語として意味が通る表現にする。
theological_decisions:
- issue: οἱ Ἰουδαῖοιをユダヤ人全体への非難と誤読する可能性
  choice: 本文では「ユダヤ人たち」と訳し、脚注でこの場面の特定の集団であることを示す
  alternative: ユダヤ人の指導者たち／ユダヤ地方の人々
  rationale: 原文は指導者に限定しておらず、地理的な「ユダヤ地方の人々」と断定する根拠もない。一方、この物語内の呼称を全時代のユダヤ人全体へ一般化することも本文の範囲を超える。
- issue: ζῆλοςの両義性
  choice: 本文は「ねたみ」
  alternative: 熱心
  rationale: 反論と冒瀆を伴う敵対的な文脈は否定的意味を強く支持するが、語そのものが持つ別の意味は脚注に残す。
- issue: βλασφημοῦντεςの対象
  choice: 対象を補わず「冒瀆の言葉を口にした」
  alternative: 神を冒瀆した／パウロをののしった
  rationale: 原文は目的語を明示しないため、神、福音、パウロのいずれかに限定せず、行為の重大さだけを伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。「冒瀆」はやや文語的だが、原語の宗教的・倫理的な重みを伝えるため採用し、「言葉を口にした」を添えて理解しやすくした。
