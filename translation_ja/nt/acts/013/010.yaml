source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: ja
  text: そして言った。「あらゆる欺きと悪巧みに満ちた者、悪魔の子、あらゆる正しさ[a]の敵よ、主のまっすぐな道を曲げ続けるのをやめないのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「正義」。ギリシア語は、文脈により道徳的な正しさ、または正義を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: あらゆる欺きに満ちた
  rationale: πλήρης＋属格の「～に満ちた」を保ち、παντόςの包括性を「あらゆる」で、δόλοςの欺瞞・策略の意味を「欺き」で表した。
- source_word: πάσης ῥᾳδιουργίας
  choice: あらゆる悪巧み
  rationale: ῥᾳδιουργίαは単なる一般的な悪ではなく、無節操で卑劣な行為や企みを指すため、現代日本語で鋭い非難を伝える「悪巧み」とした。
- source_word: υἱὲ διαβόλου
  choice: 悪魔の子
  rationale: 「子」を直訳的に保ち、悪魔への帰属または道徳的類似を表す聖書的な言い回しの強さを維持した。
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: あらゆる正しさの敵
  rationale: δικαιοσύνηの道徳的な正しさという広がりを、一般読者にも理解しやすい「正しさ」で表した。「正義」も可能なので脚注に残した。
- source_word: οὐ παύσῃ
  choice: いつまでたってもやめないのか
  rationale: 否定を伴う未来形の修辞疑問が持つ強い叱責を、自然な現代日本語の問いとして表した。「決してやめないのか」ほど断定的にはせず、継続への非難を示した。
- source_word: διαστρέφων
  choice: 曲げる
  rationale: まっすぐなものを歪めるという比喩を、「道」と自然に結び付く「曲げる」で保持した。
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: 主のまっすぐな道
  rationale: ὁδοίの比喩的な「道」と、εὐθείαςの直線性・正しさの両義を保つため「まっすぐな道」とした。κύριοςは「主」とした。
- source_word: Ὦ
  choice: 者よ
  rationale: 強い直接呼びかけを、古風すぎる「ああ」を避けつつ、連続する非難の末尾に「よ」を置いて自然かつ厳粛に示した。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 正しさ
  alternative: 正義
  rationale: ここでは神の道に反する人物への道徳的非難が中心であり、「正しさ」が意味範囲を自然に伝える。一方、δικαιοσύνηには「正義」の含意もあるため、その可能性を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接的な叱責の厳しさと聖書本文としての品位を保った。「悪魔の子」「主」は簡潔で定着した表現として維持した。
