  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: ja
  text: 彼らが、彼について書かれていたことをすべて実行し終えた後、彼を木[a]から降ろし、墓に納めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十字架」とも訳せる。ギリシア語のξύλονは「木」を意味し、木製の処刑具を指すこともある。また、申命記21章23節を響かせている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: すると
  rationale: 時間的なつながりと物語の進行を、現代日本語で簡潔かつ自然に示す。
- source_word: ἐτέλεσαν
  choice: 成し遂げる
  rationale: 人々を主語として、書かれていた事柄を最後まで実行したという完遂の意味を保つ。「成就させる」よりも、彼らの行為に焦点を置く文脈に自然である。
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: 彼について書かれていたことをすべて
  rationale: 完了受動分詞が示す、以前から書かれた状態にあった事柄を表し、包括性も保持する。
- source_word: καθελόντες
  choice: 彼を木から降ろし
  rationale: 主動詞に先行する分詞を、日本語では一連の動作として自然に表す。目的語のイエスは文脈から補う。
- source_word: ἀπὸ τοῦ ξύλου
  choice: 木から
  rationale: ξύλονの語形を尊重し、木製の処刑具を指す用法と、申命記21章23節を想起させる可能性を残す。一般的な文脈的訳「十字架」は脚注に示す。
- source_word: ἔθηκαν εἰς μνημεῖον
  choice: 墓に納めた
  rationale: 遺体を墓に置く場面を、現代日本語で自然かつ荘重に表す。
theological_decisions:
- issue: 受難記事におけるξύλονの訳し方
  choice: 木
  alternative: 十字架
  rationale: 原文はσταυρόςではなくξύλονであるため、その語彙上の特徴と、木に掛けられた者に関する聖書的響きの可能性を本文に残す。一方、処刑具としての意味を明確にする一般的な訳は脚注で示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語とした。「墓に納めた」によって埋葬の場面を自然に示しつつ、原文の簡潔な叙述を保った。
