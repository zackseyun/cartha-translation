  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: ja
  text: 神は、約束に従って、この人の子孫からイスラエルに救い主イエスをもたらされました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου
  choice: この人の
  rationale: 直前のダビデを指す属格の指示代名詞。日本語でも指示関係を明確にしつつ、「子孫」と自然につなげた。
- source_word: ἀπὸ τοῦ σπέρματος
  choice: 子孫から
  rationale: σπέρμαはここではダビデの血統・子孫を表す。「種」では現代日本語で不自然になりやすいため、系譜的意味を明瞭に伝える「子孫」とした。
- source_word: κατ’ ἐπαγγελίαν
  choice: 約束に従って
  rationale: 先の約束との一致を表す句。定冠詞のない原文を尊重して「その約束」と限定せず、簡潔に訳した。
- source_word: ἤγαγεν
  choice: 送られました
  rationale: 基本義は「連れて来る、もたらす」。ここでは神がイスラエルに救い主を与えたことを自然な日本語で表す。「起こされた」は復活との混同を招きうるため避けた。
- source_word: τῷ Ἰσραήλ
  choice: イスラエルに
  rationale: 与格を素直に「イスラエルに」とし、受益の含みも保った。
- source_word: σωτῆρα
  choice: 救い主
  rationale: 救済者・解放者を意味する称号であり、このキリスト論的文脈では日本語の定着した表現「救い主」が適切。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 固有名詞として標準的な日本語表記を用いた。
theological_decisions:
- issue: イエスとダビデへの約束との関係
  choice: 神が約束に従い、ダビデの子孫からイエスをイスラエルに送ったと訳す。
  alternative: 「ダビデへの約束を実現して」など、約束の対象と成就を明示する。
  rationale: 文脈上はダビデに関する約束が念頭にあるが、原文はここで約束の対象を明記していない。説明を加えず、ダビデの子孫と約束との結び付きをそのまま保った。
translation_notes:
  register: 明瞭で現代的な標準日本語とし、説教中の叙述にふさわしい丁寧体を採用した。「この人」は直前のダビデを受けるため、文脈上明確である。
