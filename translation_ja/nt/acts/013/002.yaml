source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: ja
  text: 彼らが主に仕え[a]、断食していたとき、聖霊が言われた。「さあ、バルナバとサウロを、わたしのために、わたしが彼らを召した働きのために取り分けなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主を礼拝し」。このギリシア語動詞は、礼拝的・祭儀的な含みをもつ奉仕を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: 仕え
  rationale: 礼拝・祭儀的な含みを伴いうる奉仕を表す。本文では意味を「礼拝」だけに限定せず、主に向けられた奉仕として自然に訳した。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: 与格が示す奉仕の向かう相手を、簡潔で自然な日本語で表した。
- source_word: νηστευόντων
  choice: 断食していた
  rationale: 二つの分詞が示す同時進行の行為を、「仕え」と並行させつつ時間節として表した。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語の標準的な訳語を用い、語った主体として直接示した。
- source_word: Ἀφορίσατε δή
  choice: さあ、…取り分けなさい
  rationale: ἀφορίζωの特別な目的のために分ける意を「取り分ける」で示し、δήの促し・切迫感を「さあ」で明示した。
- source_word: μοι
  choice: わたしのために
  rationale: 取り分ける目的が語り手である聖霊に向けられていることを自然に表した。
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: バルナバとサウロ
  rationale: 日本語聖書で広く定着した人名表記を採用した。
- source_word: εἰς τὸ ἔργον
  choice: 働きに就かせるため
  rationale: ἔργονの広い意味を「働き」で保ち、εἰςが示す目的を日本語として明瞭にした。
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: わたしが彼らを召した
  rationale: 完了形が示す、すでになされた召しとその現在的な効力を自然な日本語で表した。関係代名詞の構造は「働き」を修飾する形で保持した。
theological_decisions:
- issue: λειτουργούντωνが共同体の礼拝的文脈で持つ意味
  choice: 主に仕え
  alternative: 主を礼拝し
  rationale: この語には礼拝・祭儀的な奉仕の含みがあるが、正式な典礼行為だけに狭める必要はない。「仕え」は奉仕という基本義を保ち、脚注で礼拝的含意を示す。
- issue: 聖霊が語る主体として描かれていること
  choice: 聖霊が言われた
  alternative: 聖霊によって告げられた
  rationale: ギリシア語は聖霊を発話の主体として直接提示しているため、これを受動表現などで弱めず保持した。敬意を表す自然な日本語として「言われた」を用いた。
- issue: ἀφορίσατε … εἰς τὸ ἔργονの委任の性格
  choice: わたしのために取り分けなさい。…働きに就かせるためである
  alternative: 任命しなさい／聖職に就けなさい
  rationale: 特定の目的への選別・派遣を表す一方、本文自体は按手礼、叙階、特定の教会職を明記しないため、後代の制度的意味を持ち込まない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接話法には簡潔で重みのある調子を保った。δήは省略せず「さあ」で表し、原文の促しを反映した。脚注記号[a]は該当語の直後に置いた。
