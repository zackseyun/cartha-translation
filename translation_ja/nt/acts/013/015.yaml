id: ACT.13.15
reference: Acts 13:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: ja
  text: 律法と預言者の書が朗読された後、会堂の責任者たちは彼らに伝言を送り、こう伝えた。「兄弟の皆さん[a]、民に向けて何か励ましの言葉[b]があるなら、お話しください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「男たち、兄弟たち」。敬意と親しみを込めた、男性への呼びかけ。
    reason: lexical_alternative
  - marker: b
    text: 別訳「勧めの言葉」。ギリシア語の表現には、励ましと勧告の両方の意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: 朗読
  rationale: 会堂で聖書が声に出して読まれる行為を表すため、単なる「読書」ではなく「朗読」とした。
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: 律法と預言者の書
  rationale: 会堂で朗読される聖書の二つの区分を指す。「預言者」だけでは人物を指すようにも読めるため、日本語では「預言者の書」として文書群であることを明確にした。
- source_word: ἀπέστειλαν … πρὸς αὐτοὺς
  choice: 彼らに伝言して
  rationale: 直訳は「彼らのもとへ送った」だが、後続の直接話法から、何らかの手段で言葉を伝えたという意味を自然な日本語で示した。使者が誰であったかは本文にないため、「人を遣わして」とは限定しなかった。
- source_word: οἱ ἀρχισυνάγωγοι
  choice: 会堂の責任者たち
  rationale: 会堂の礼拝運営を担う複数の役職者を指す。現代の一般読者に分かりやすく、政治的支配者との誤解を避ける表現とした。
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟の皆さん
  rationale: 男性の同胞に対する、敬意と親近感を伴う呼びかけ。日本語として自然な呼称を本文に置き、原文の明示的な男性形は脚注で示した。
- source_word: λόγος παρακλήσεως
  choice: 励ましの言葉
  rationale: παράκλησις は励ましと勧告の双方を含み得る。この場面で自然かつ広い意味を保つ「励まし」を本文に採用し、「勧め」を脚注に示した。
- source_word: πρὸς τὸν λαόν
  choice: 民に向けて
  rationale: 話の対象となる会衆を示す句。「民」という語を保ちつつ、日本語で宛先が明確になるようにした。
- source_word: λέγετε
  choice: お話しください
  rationale: 複数の訪問者に、会衆へ語るよう招く命令形。場面に適した丁寧な依頼表現とした。
theological_decisions:
- issue: 会堂での呼びかけにおける性別表現
  choice: 兄弟の皆さん
  alternative: 兄弟姉妹の皆さん
  rationale: Ἄνδρες ἀδελφοί は文法上も語義上も男性への呼びかけであり、ここでは語るよう招かれたパウロ一行に向けられているため、性別を一般化しなかった。
- issue: παράκλησις の意味幅
  choice: 励ましの言葉
  alternative: 勧めの言葉
  rationale: この語は慰め・励ましだけでなく勧告や訓戒も表し得るため、一方に限定せず脚注で別訳を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会堂での公的な場面にふさわしい品位を保った。「会堂司」のような専門的で古風な語を避け、「会堂の責任者たち」とした。原文の曖昧さは、本文と脚注を組み合わせて保持した。
