  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: ja
  text: その後、彼らは断食し、祈り、二人に手を置いた後、二人を送り出した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人を行かせた」「二人を去らせた」。ここでは、バルナバとサウロが宣教のために出発するのを共同体が認め、送り出したという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 直前の聖霊の指示を受けて次に行われたことを示す。時間的な順序と文脈上のつながりの両方を自然な日本語で表す。
- source_word: νηστεύσαντες
  choice: 断食して
  rationale: 主動詞に先立つ準備行為を表すアオリスト分詞。後続の祈りと並べ、簡潔で自然な連続動作として訳す。
- source_word: προσευξάμενοι
  choice: 祈り
  rationale: 断食および按手と並ぶ準備行為として、現代日本語で自然に表す。
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: 二人の上に手を置いて
  rationale: 具体的な所作を保ち、按手が持つ教会的・神学的意味を訳文だけで限定しない。「二人」は文脈上のバルナバとサウロを指す。
- source_word: ἀπέλυσαν
  choice: 二人を送り出した
  rationale: 基本的には解放する、立ち去らせる意を持つが、この宣教派遣の文脈では「送り出した」が自然。ただし語の幅は脚注に残す。
- source_word: αὐτοῖς
  choice: 二人の上に
  rationale: 按手の対象であるバルナバとサウロを明確にし、日本語で代名詞の指示が曖昧になるのを避ける。
theological_decisions:
- issue: 手を置く行為の性格
  choice: 行為そのものを「二人の上に手を置いて」と記述し、特定の儀礼的意味を付加しない。
  alternative: 「任命した」「按手礼を行った」「祝福した」などと解釈を明示する。
  rationale: 本文は断食、祈り、手を置くこと、送り出すことを報告するが、それを特定の聖礼典論や叙任制度として定義してはいないため。
- issue: ἀπέλυσανにおける派遣主体の含意
  choice: 文脈に即して「送り出した」とする一方、語義上の「行かせた／解放した」を脚注で示す。
  alternative: 共同体が宣教命令の究極的な主体であることを強く示す訳、または単に解散させたとする訳。
  rationale: 直前では聖霊が二人を取り分けるよう命じており、13:4では二人が聖霊によって送り出されたとされる。共同体の行為と聖霊の主導との緊張を訳で解消しない。
translation_notes:
  register: 明快な現代標準日本語。儀礼を表す専門語「按手」は本文では避け、原文の具体的な動作をそのまま示した。「彼ら」と「二人」を使い分け、アンティオキアの共同体とバルナバ、サウロとの関係を明瞭にした。
