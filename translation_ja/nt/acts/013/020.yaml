  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: ja
  text: およそ四百五十年にわたりました。[a] その後、神は預言者サムエルに至るまで、さばき人たちをお与えになりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の訳では、この期間を後の文に結び付けて、「神はおよそ四百五十年の間、預言者サムエルに至るまで、さばき人たちをお与えになりました」とします。ここでのギリシア語の語句の結び付きと句読法については議論があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: およそ
  rationale: 数詞に伴って概数であることを示すため、現代日本語で自然な「およそ」とした。
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: 四百五十年にわたりました
  rationale: 与格による時間的な広がりを自然な日本語で表し、独立した期間の叙述として訳した。
- source_word: καὶ μετὰ ταῦτα
  choice: その後
  rationale: 出来事の順序を明確かつ簡潔に示す。「これらのことの後」より自然な現代日本語を選んだ。
- source_word: ἔδωκεν
  choice: お与えになりました
  rationale: δίδωμιの基本義「与える」を保ちつつ、行為者が神であることにふさわしい自然な敬意表現とした。
- source_word: κριτὰς
  choice: さばき人たち
  rationale: イスラエル王国成立以前の指導者を指す歴史的用語であり、現代の司法官を思わせる「裁判官」を避けた。「士師」より一般読者に意味が伝わりやすい。
- source_word: ἕως
  choice: 時まで
  rationale: さばき人が与えられた時期の終点を自然な日本語で示した。
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: 預言者サムエル
  rationale: 属格の同格表現が示すサムエルの役割を、日本語で自然な肩書きの語順にした。
theological_decisions:
- issue: 「およそ四百五十年」という期間句をどこに結び付けるか
  choice: 指定されたSBLGNT本文の区切りに従い、期間句を先行内容に関係する独立した叙述として訳し、その後に「その後、神は…さばき人たちを…」を置いた。
  alternative: 「神はおよそ四百五十年の間、預言者サムエルの時まで、さばき人たちをお与えになりました」と、四百五十年をさばき人の時代に直接結び付ける。
  rationale: この箇所のギリシア語本文と句読法には議論がある。本文では提示されたSBLGNTの配置を尊重し、別の結び付け方は脚注に残して曖昧さを隠さない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「さばき人」は当時のイスラエルの指導者を表し、現代の裁判官との混同を避ける表現とした。期間句の難しさは本文で断定的に解消せず、脚注で代表的な別解を示した。
