id: ACT.13.47
reference: Acts 13:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: ja
  text: '主が私たちにこう命じておられるからです。

    「わたしはあなたを諸国の民の光[a]として立てた。

    あなたが地の果てにまで[b]救いとなるためである。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「異邦人の光」。ギリシャ語は「諸国の民」と「異邦人」のどちらの意味にもなり得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「地の最も遠い所にまで」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: からです。こう
  rationale: γάρの理由を示す働きを「からです」で明示し、οὕτωςは続く引用を導く自然な日本語として「こう」とした。
- source_word: ἐντέταλται
  choice: 命じておられる
  rationale: 完了形が示す、すでに与えられ現在も効力を持つ命令を表す。尊敬表現も日本語の「主」に自然に対応する。
- source_word: ὁ κύριος
  choice: 主
  rationale: 引用された聖書の権威ある神的発言者を指す語として、簡潔で定着した訳語を用いた。
- source_word: Τέθεικά σε
  choice: わたしはあなたを…立てた
  rationale: τίθημιの完了形が示す確立された任命を、「立てた」で簡潔に表した。単数二人称を維持している。
- source_word: εἰς φῶς ἐθνῶν
  choice: 諸国の民の光として
  rationale: εἰςの任命・結果の意味を「として」で表し、ἐθνῶνはイザヤ書引用の広い諸民族的含意を保つため「諸国の民」とした。
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: あなたが…救いとなるためである
  rationale: τοῦを伴う不定詞の目的・結果の働きを「ため」で表した。「救いとなる」は、本人が救いなのか救いの手段なのかを説明的に限定せず、原文の簡潔さを保つ。
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: 地の果てにまで
  rationale: 地上の最遠部に至る広がりを、現代日本語で自然かつ格調を保って表した。
theological_decisions:
- issue: イザヤ書の僕への言葉をパウロとバルナバの宣教に適用する仕方
  choice: 引用内の「あなた」を単数のまま保ち、使徒たちとの関係を説明的に補わない。
  alternative: 「私たち」を直接任命する言葉として複数形に言い換える、または引用の話者と受け手を本文中で明示する。
  rationale: ギリシャ語本文は聖書を単数二人称のまま引用し、僕の使命と使徒的宣教との神学的関係を暗黙のままにしているため、その緊張を保持した。
- issue: εἰς σωτηρίανにおける人物と救いの関係
  choice: 「救いとなる」
  alternative: 「救いをもたらす」
  rationale: 「救いをもたらす」は手段・働きとして解釈する度合いが強い。「救いとなる」は原文の前置詞句の凝縮性を保ち、関係を過度に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書引用には簡潔で格調ある文体を採用した。「命じておられる」で命令の継続的効力を表し、引用の単数二人称と救いをめぐる原文の含みを保った。
