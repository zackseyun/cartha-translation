  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: ja
  text: その方が来られる[a]前に、ヨハネはイスラエルの民すべてに、悔い改めのバプテスマ[b]を宣べ伝えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方の到来に先立って」。ギリシア語は字義的には「その方の到来の面前に」といい、誰かの到来より前であることを表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 別訳「悔い改めのためのバプテスマ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: 宣べ伝えていた
  rationale: 公に告げ知らせることを表す動詞として自然であり、アオリスト分詞が示す、主節の出来事に先立つヨハネの宣教を文脈に即して表現した。時間的先行は「前に」で明示されるため、「あらかじめ」を重ねなかった。
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: その方が来られる前に
  rationale: 直訳的には「その方の到来の面前に」だが、誰かの到来に先立つことを示す慣用表現である。日本語では敬意を含む「その方が来られる前に」が自然で、文脈上の指示対象を保つ。
- source_word: εἰσόδου
  choice: 来られる
  rationale: 語義は「入ること、到来」。ここでは救い主の到来を指すため、名詞的な「到来」より平明で自然な動詞表現とした。
- source_word: βάπτισμα μετανοίας
  choice: 悔い改めのバプテスマ
  rationale: 属格の関係を「の」で保持し、悔い改めとバプテスマの関係を一義的に目的・結果へ限定しない。「バプテスマ」は新約聖書の儀礼を指す語として明確である。
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: イスラエルの民すべてに
  rationale: πᾶςとλαόςの双方を保ち、告知の受け手を示す与格を「に」で自然に表した。
- source_word: Ἰωάννου
  choice: ヨハネ
  rationale: 日本語聖書で定着した人名表記。
theological_decisions:
- issue: 「その方」の指示対象
  choice: 代名詞的な「その方」を用い、文脈上イエスを指す形を保つ
  alternative: この節で「イエス」と明示する
  rationale: 使徒13:23–25では指示対象は救い主イエスだが、この節のギリシア語本文は固有名を繰り返していない。文脈的明瞭さを保ちつつ、原文にない明示を避けた。
- issue: βάπτισμα μετανοίας における属格の関係
  choice: 「悔い改めのバプテスマ」
  alternative: 「悔い改めのためのバプテスマ」
  rationale: 属格は関連・性質・目的などの幅を持ちうるため、本文では関係を狭く確定せず、代案を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒言行録の演説にふさわしい落ち着いた格調を保った。「宣べ伝える」「悔い改め」「バプテスマ」は一般的な聖書語彙として採用し、過度に古風な語順や表現は避けた。
