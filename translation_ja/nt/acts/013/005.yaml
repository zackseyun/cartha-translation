  terminology: 「サラミス」「ヨハネ」「ユダヤ人」「神のことば」は標準的で一貫した用語である。「助手」はὑπηρέτηςの補佐者・随行者というこの文脈の意味に適切であり、脚注もその意味幅を補っている。
