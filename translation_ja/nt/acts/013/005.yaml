  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: ja
  text: 一行がサラミスに着くと、ユダヤ人の諸会堂で神のことばを宣べ伝えた。また、ヨハネを助手として連れていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨハネを助け手として伴っていた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: サラミスに着くと
  rationale: 場所を示すἐν句を伴うγίνομαιのアオリスト分詞を、到着と後続行為の時間的関係が自然に伝わるよう訳した。主語は文脈上のバルナバとサウロであり、日本語では簡潔に「一行」とした。
- source_word: κατήγγελλον
  choice: 宣べ伝えた
  rationale: 公に告げ知らせる反復的・継続的な行為を表す未完了過去。日本語聖書として自然でありつつ、説教という形式だけに限定しない表現を選んだ。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 属格構文を簡潔かつ伝統的に保ち、「ことば」が神からの知らせ・啓示を指し得る余地を残した。
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: ユダヤ人の諸会堂で
  rationale: 複数形を「諸会堂」で明示し、民族的・宗教的集団を指すἸουδαίωνを文脈に即して「ユダヤ人」とした。
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: また、ヨハネを…連れていた
  rationale: δέとκαίの付加・軽い転換を「また」で表した。日本語では「持っていた」ではなく、同行者について自然な「連れていた」とした。
- source_word: ὑπηρέτην
  choice: 助手として
  rationale: 従属的な奉仕者・補助者を意味する語。奴隷的含意を不必要に加えず、旅と宣教の文脈に合う「助手」を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語としつつ、「神のことば」「宣べ伝えた」「諸会堂」によって聖書本文にふさわしい品位を保った。ὑπηρέτηςの意味幅は脚注で示した。
