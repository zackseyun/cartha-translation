  source_fidelity: 原文の時間分詞γενόμενοι ἐν Σαλαμῖνιを「サラミスに着くと」と自然に表し、未完了過去κατήγγελλονも「宣べ伝えた」として文脈上適切に訳している。「ユダヤ人の諸会堂で」「神のことば」も、それぞれἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων、τὸν λόγον τοῦ θεοῦに忠実である。εἶχον…Ἰωάννην ὑπηρέτηνは「ヨハネを助手として連れていた」とされ、同行し補佐する人物であったという意味を過度に限定せず伝えている。
