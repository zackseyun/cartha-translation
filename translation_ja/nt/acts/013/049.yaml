  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: ja
  text: そして、主のことばはその地方全体に広められていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主の知らせ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: 広められていった
  rationale: 未完了過去の受動形が表す、過去における継続的な広がりと受動の意味を自然な日本語で保持した。
- source_word: δὲ
  choice: こうして
  rationale: 物語を穏やかに先へ進め、直前の出来事を受ける接続として自然に表した。強い逆接にはしなかった。
- source_word: ὁ λόγος
  choice: ことば
  rationale: 文脈上は宣べ伝えられた知らせを指すが、使徒言行録に繰り返される λόγος の表現と神学的響きを保つため「ことば」とした。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: 属格の簡潔さを保ち、復活した主に属する、また主についてのことばという含みを狭めずに残した。
- source_word: δι’ ὅλης
  choice: 全体に
  rationale: διά＋属格による地域全域への広がりと、ὅλης の包括性を明瞭で自然な日本語にした。
- source_word: τῆς χώρας
  choice: その地方
  rationale: 現代の国家ではなく周辺一帯の地理的範囲を指すため、「国」ではなく「地方」とした。定冠詞は文脈上の地域を示す「その」で表した。
theological_decisions:
- issue: κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: 使徒言行録におけるキリスト論的・聖書的な響きを保ち、単なる権威者という意味に狭めないため「主」とした。
- issue: ὁ λόγος τοῦ κυρίου の意味範囲
  choice: 主のことば
  alternative: 主の知らせ
  rationale: 文脈上「知らせ」を意味し得るが、「主に属することば」と「主についての知らせ」の含みを一方に限定せず、ルカ文書の反復表現も保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「広められていった」により継続的な受動動作を示した。
