id: ACT.13.13
reference: Acts 13:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: ja
  text: パウロの一行[a]はパフォスから船出して[b]、パンフィリアのペルゲに着いた。しかし、ヨハネは一行を離れ、エルサレムへ帰った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「パウロの周りの人々」。別訳「パウロとその同行者たち」。
    reason: lexical_alternative
  - marker: b
    text: このギリシア語は「沖へ出る」「出帆する」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: 船出して
  rationale: 航海の文脈で「沖へ出る、出帆する」を意味するため、海路での出発を自然な現代日本語で表した。
- source_word: οἱ περὶ Παῦλον
  choice: パウロの一行
  rationale: 直訳的には「パウロの周りの人々」で、パウロと行動を共にする一団を指す。「パウロの一行」は簡潔で自然であり、パウロが中心人物として示される表現も保つ。
- source_word: ἦλθον
  choice: 着いた
  rationale: 移動の到着点が明示されているので、日本語の旅行記事として自然な「着いた」とした。
- source_word: Πέργην τῆς Παμφυλίας
  choice: パンフィリアのペルゲ
  rationale: 属格がペルゲの所在地域を示すことを、地名として自然な形で表した。
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: 一行を離れ
  rationale: ヨハネが彼らのもとから去ったことを表しつつ、その動機や道徳的評価を訳文に加えない中立的な表現とした。
- source_word: ὑπέστρεψεν
  choice: 帰った
  rationale: 元の場所へ戻ることを意味する語であり、エルサレムへの帰還を自然な日本語で表した。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 日本語で定着している標準的な地名表記を用いた。
theological_decisions:
- issue: ヨハネが一行を離れたことへの評価
  choice: 「一行を離れ」と中立的に訳す
  alternative: 「一行を見捨てて」「一行から離反して」
  rationale: この節自体はヨハネの動機や行為への評価を明示していない。後の文脈から否定的含意を先取りせず、本文の抑制を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、旅行記事として自然な流れを保った。「しかし」によりヨハネの別行動との対照を示す一方、その行為への評価は加えていない。
