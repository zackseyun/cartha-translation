id: ACT.13.11
reference: Acts 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: ja
  text: 「今、見よ、主の御手があなたの上にある。あなたは目が見えなくなり、しばらくの間、太陽を見ることができなくなる。」するとたちまち、かすみと闇が彼の上に降りかかった。彼はあちこち歩き回りながら、手を引いてくれる人を探していた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν ἰδοὺ
  choice: さあ、見よ
  rationale: νῦνと注意喚起のἰδούを、現代日本語でも宣告の切迫感が伝わる形で保持した。
- source_word: χεὶρ κυρίου ἐπὶ σέ
  choice: 主の御手があなたの上にある
  rationale: 神の能動的な力と、ここでは裁きを表す聖書的比喩を、説明的に言い換えず保持した。
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: あなたは目が見えなくなり、太陽を見ることができない
  rationale: 失明の到来と、太陽さえ見えない状態を自然な日本語で明示した。
- source_word: ἄχρι καιροῦ
  choice: しばらくの間
  rationale: 終わりの時点を特定しない、一時的な期間という意味を自然に表した。
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 裁きが即座に実現したことを、簡潔で格調ある現代語で表した。
- source_word: ἀχλὺς καὶ σκότος
  choice: かすみと闇
  rationale: 視界を曇らせるものと暗黒という二つの像を区別して保持した。
- source_word: ἔπεσεν ἐπ’ αὐτόν
  choice: 彼を覆った
  rationale: 日本語で『かすみと闇が彼の上に降りかかった』とする不自然さを避けつつ、突然襲った状態を表した。
- source_word: περιάγων
  choice: あちこち歩き回った
  rationale: 移動して回るという分詞の意味を保ち、文脈から推測される『手探りで』までは本文に加えなかった。
- source_word: ἐζήτει χειραγωγούς
  choice: 手を引いてくれる人を求めて
  rationale: χειραγωγόςの、単なる案内人ではなく手を取って導く人という具体的意味を表した。
theological_decisions:
- issue: 「主の御手」の性質
  choice: 比喩を「主の御手」として保持する
  alternative: 「主の裁き」「主があなたを打つ」と解釈的に訳す
  rationale: 文脈上は神の裁きとして働くが、原文の比喩そのものを残し、意味を一つの説明に置き換えないため。
- issue: 失明の期間
  choice: 「しばらくの間」とし、一時的だが不特定の期間を示す
  alternative: 「ある時まで」「定めの時まで」
  rationale: ἄχρι καιροῦは期限の存在を示すものの、その長さや神学的に定められた特定時点までは明示しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宣告の厳粛さを保った。「御手」は聖書的比喩として通用するため残し、過度に古風な語順や説明的な神学用語は避けた。
