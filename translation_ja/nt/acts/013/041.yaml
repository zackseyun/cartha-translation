source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: ja
  text: 見よ、侮る者たちよ。驚き、滅びよ[a]。わたしはあなたがたの時代に、一つのわざを行っている。それは、だれかが詳しく語って聞かせても、あなたがたが決して信じないようなわざである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅びよ」は、「消え去れ」または「滅ぼされよ」とも訳せる。ギリシア語は消失または破滅に至ることを表し、ここでは厳しい警告の響きを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: 見よ
  rationale: 注意を強く促す複数形の命令。引用聖句としての荘重さと切迫感を保つ。
- source_word: οἱ καταφρονηταί
  choice: 侮る者たち
  rationale: 軽視だけでなく、軽蔑して退ける意味を自然な現代日本語で表す。「あざける者たち」も可能だが、語そのものは嘲笑行為に限定されない。
- source_word: θαυμάσατε
  choice: 驚け
  rationale: 命令形の鋭さと、預言的文脈における驚愕の響きを簡潔に伝える。
- source_word: ἀφανίσθητε
  choice: 滅びよ
  rationale: 消失・破滅を表す受動命令であり、この警告の裁きの響きを保つ。「消え去れ」より文脈に即しているが、語義上の幅は脚注で示す。
- source_word: ἔργον
  choice: わざ
  rationale: 神の重大な行為を指す文脈に適し、聖書引用として自然でありながら現代の読者にも理解できる。
- source_word: ἐργάζομαι ἐγώ
  choice: わたしが…行う
  rationale: 明示されたἐγώの強調を「わたしが」で表し、現在形は目前の神の働きを告げる日本語として訳す。
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: あなたがたの時代に
  rationale: 直訳的な「あなたがたの日々に」より自然に、聞き手の生きる時代に起こるという切迫性を表す。
- source_word: οὐ μὴ πιστεύσητε
  choice: 決して信じない
  rationale: οὐ μήと接続法による強い否定を明瞭に表す。
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: たとえ誰かが詳しく語って聞かせても
  rationale: ἐκδιηγέομαιの「十分に詳しく物語る」という含みを保ち、条件節が強い不信を際立たせるため、日本語では譲歩的に自然に表現する。
theological_decisions:
- issue: ハバクク書からの引用に含まれる裁きの警告
  choice: 「滅びよ」として厳しい警告を保持する
  alternative: 「消え去れ」または「打ちのめされよ」
  rationale: ἀφανίσθητεには消失と破滅の幅があるが、使徒言行録の文脈では神のわざを拒む者への厳粛な警告として機能する。特定の裁きの様態までは付加しない。
- issue: 神のわざに対する不信の強さ
  choice: 「決して信じない」と訳す
  alternative: 「信じないだろう」
  rationale: οὐ μήの強調を弱めず、同時に不信の理由や予定論的説明を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、預言書引用の荘重さと連続する命令形の鋭さを保持した。「見よ」「わざ」はやや聖書的だが、一般読者にも通じる語として採用。脚注記号[a]は該当する「滅びよ」の直後ではなく文末配置を避けるべき余地があるものの、本稿では節全体に関わる語義注として文末に置いた。
