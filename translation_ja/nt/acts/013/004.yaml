  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: ja
  text: こうして、聖霊によって送り出された彼らは、セレウキアへ下り、そこからキプロスへ船出した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ μὲν οὖν
  choice: こうして二人は
  rationale: 前節で言及されたバルナバとサウロを受け、明示的な代名詞の軽い強調と、μὲν οὖν が示す物語の進展・帰結を自然な日本語で表した。日本語では単なる「彼ら」より「二人」が指示対象を明確にする。
- source_word: ἐκπεμφθέντες
  choice: 送り出され
  rationale: アオリスト受動分詞の受動性を保ち、主動詞に先立つ派遣を日本語の連用形で簡潔に表した。
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: 聖霊によって
  rationale: 属格を伴う ὑπό の行為者表示を「によって」で明示した。使徒言行録の文脈では人格的に働く神的主体を指すため、標準的な「聖霊」とした。
- source_word: κατῆλθον εἰς Σελεύκειαν
  choice: セレウキアへ下り
  rationale: κατέρχομαι の下降・海岸方面への移動という具体性を「下り」で保ち、目的地を「へ」で自然に示した。
- source_word: ἐκεῖθέν τε ἀπέπλευσαν εἰς Κύπρον
  choice: そこからキプロスへ船出した
  rationale: ἐκεῖθεν の出発点、τε の接続、ἀποπλέω の船で出発する意味を、自然な叙述の「そこから…船出した」で表した。
theological_decisions:
- issue: ἁγίου πνεύματος の訳し方
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 冠詞を伴う句が、宣教者を送り出す人格的な行為者として描かれていることを踏まえ、使徒言行録における通常の指示対象を自然に示す「聖霊」とした。三位一体について本文以上の説明は訳文に加えていない。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。地名は日本語で定着した「セレウキア」「キプロス」を用いた。原文の受動態と移動の順序を保ちつつ、日本語として不自然な分詞構文は避けた。
