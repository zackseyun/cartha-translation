  language: ja
  text: しかし、神はこの方を死者の中からよみがえらせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の、人々がイエスを木から降ろして墓に納めたという行為と、続く神の行為との鮮明な対照を自然な日本語で示す。
- source_word: θεὸς
  choice: 神
  rationale: 行為の主体である神をそのまま明確に表す。
- source_word: ἤγειρεν
  choice: よみがえらせた
  rationale: 復活の文脈におけるἐγείρωの使役的な意味を明瞭に伝え、神がイエスを復活させたことを表す。
- source_word: αὐτὸν
  choice: この方を
  rationale: 直前から言及されているイエスを指す代名詞。日本語では単なる「彼を」よりも、指示対象を保ちつつ尊厳ある自然な表現となる。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: ἐκの「中から」とνεκρῶνの複数形を保ち、死者たちの中から起こされたという原文の表現を自然な日本語で伝える。
theological_decisions:
- issue: 復活の表現
  choice: 神はこの方を死者の中からよみがえらせた
  alternative: 神はこの方を死からよみがえらせた
  rationale: 原文は復活を神の働きとして明示する。「死者の中から」はἐκ νεκρῶνの形を反映し、身体的・歴史的な復活という文意を、解釈を付け加えずに伝える。
translation_notes:
  register: 明快で現代的な標準語を用いた。「しかし」で文脈上の対照を示し、「この方」によって指示対象への敬意と文章の自然さを保った。
