source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: ja
  text: しかし、ユダヤ人たちは、神を敬う身分の高い女性たち[a]と町の有力者たちを扇動し、パウロとバルナバに対する迫害を引き起こして、二人をその地方[b]から追い出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を畏れる女性たち」とも訳せる。この表現は、イスラエルの神を礼拝し、会堂と関わりを持っていた異邦人女性を指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「彼らの領域から」または「彼らの境界の外へ」とも訳せる。原語は境界線、またはその内側の地域を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: しかし、ユダヤ人たちは
  rationale: δέによる直前の肯定的な展開との対照を、自然な物語上の転換として示す。
- source_word: παρώτρυναν
  choice: 扇動し
  rationale: 女性たちと町の有力者たちを敵対的な行動へ駆り立てた、能動的な働きかけを簡潔に表す。
- source_word: τὰς σεβομένας γυναῖκας τὰς εὐσχήμονας
  choice: 神を敬う身分の高い婦人たち
  rationale: σεβομέναςの宗教的敬虔さと、εὐσχήμοναςの社会的地位・名望の双方を保持する。「神を敬う」はイスラエルの神を礼拝する会堂関係者という可能性を示すが、厳密な身分区分までは本文で断定しない。
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: 町の有力者たち
  rationale: 町で第一級の地位にある男性たちを指す。日本語では「有力者たち」が自然であり、文脈上の公的・社会的影響力を伝える。
- source_word: ἐπήγειραν διωγμὸν
  choice: 迫害を引き起こして
  rationale: 迫害が生じるよう仕向けた使役的な意味を明確にし、同じ文中のπαρώτρυνανとの語彙上の区別も保つ。
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: パウロとバルナバに対する
  rationale: 迫害の敵対的な対象を自然な日本語で明示する。
- source_word: ἐξέβαλον αὐτοὺς
  choice: 二人を…追い出した
  rationale: 強制的な排除を表すἐκβάλλωの力を保ちつつ、代名詞の指示対象を日本語で明確にする。
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: その地方から
  rationale: ὅριαは境界そのものにも、その境界内の地域にもなり得る。ここでは追放の範囲を自然に表しつつ、別訳を脚注に残す。
theological_decisions:
- issue: σεβομέναςを宗教的な集団名としてどこまで特定するか
  choice: 神を敬う
  alternative: 敬虔な／神を畏れる
  rationale: 使徒言行録ではイスラエルの神を礼拝する異邦人の会堂関係者を指す場合があるが、本文だけで正式な身分区分を断定せず、宗教的な意味を自然に表した。
- issue: τοὺς πρώτουςの男性性の扱い
  choice: 町の有力者たち
  alternative: 町の有力な男たち
  rationale: ギリシア語は男性複数形で、実際に男性の都市有力者を指す可能性が高い。一方、日本語の「有力者」は文脈に即して自然で、原文にない説明的な性別表現を加えずとも社会的集団を正確に表せる。
translation_notes:
  register: 明快な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた格調を保った。「婦人たち」は社会的地位の高い成人女性という文脈に適し、「扇動」「迫害」「追い出した」で敵対行為の段階と強さを明確にした。
