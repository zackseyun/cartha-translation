source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: ja
  text: この民、イスラエルの神は、私たちの父祖[a]を選び、エジプトの地に寄留していた間にこの民を大いなるものとし[b]、高く上げた御腕をもって[c]、彼らをそこから導き出した[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちの父たち」。すなわち「私たちの先祖」。
    reason: lexical_alternative
  - marker: b
    text: 「この民を高め」とも、「この民を増やし」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳すると「高い腕をもって」。神が力強く救い出すことを表す、出エジプトの物語に由来する言い回し。
    reason: cultural_note
  - marker: d
    text: 「彼らをそこから連れ出した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: この民イスラエルの神
  rationale: 「イスラエル」を「この民」と同格的に保ち、ギリシア語の語順と構造を、日本語として理解できる形で反映した。
- source_word: ἐξελέξατο
  choice: 選び
  rationale: 中動態の含意を過度に明示せず、文脈に即して自然に訳した。
- source_word: τοὺς πατέρας ἡμῶν
  choice: 私たちの父祖
  rationale: πατέρεςの男性的・家族的表現を保ちつつ、契約史上の先祖を指す現代日本語として自然な「父祖」を選んだ。
- source_word: τὸν λαὸν ὕψωσεν
  choice: この民を大いなるものとし
  rationale: ὑψόωが持ち得る「高める」と「増大させる」の両方向を、いずれか一方に限定しすぎない表現とした。
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: エジプトの地に寄留していた間に
  rationale: παροικίαの、よその土地に外国人として滞在する含意と、γῆが明示されていることを保った。
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: 高く上げた御腕をもって
  rationale: 出エジプト伝承に由来する「高い腕」という比喩を残し、神の力強い救出を表す慣用句であることは注で示した。
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: 彼らをそこから導き出した
  rationale: ἐξάγωの方向性を「導き出す」で表し、女性代名詞αὐτῆςが指すエジプトを日本語では自然に「そこ」とした。
theological_decisions:
- issue: イスラエルの先祖を表すπατέρες
  choice: 父祖
  alternative: 先祖／父たち
  rationale: 原語の男性的・父系的表現を消さず、同時に現代日本語で不自然な「父たち」を避けた。
- issue: エジプト滞在中のὕψωσενの意味
  choice: 大いなるものとし
  alternative: 高め／増やし
  rationale: 社会的な高揚か人口的な増加かを本文で断定せず、原語の意味の幅と神学的緊張を保った。
- issue: βραχίων ὑψηλόςの比喩
  choice: 高く上げた御腕
  alternative: 力強い御腕
  rationale: 神の力を意味する慣用表現だが、出エジプト伝承との言語的つながりを保つため比喩を本文に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「父祖」「寄留」「御腕」によって聖書の歴史叙述にふさわしい品位を保った。文末は常体とし、過度な敬語化や教派固有の語法を避けた。
