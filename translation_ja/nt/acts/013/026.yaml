id: ACT.13.26
reference: Acts 13:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: ja
  text: 兄弟たち、アブラハムの家系に連なる子ら、また、あなたがたの中で神を畏れる方々、この救いのことばは、私たちに送られました。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「男たち、兄弟たち」。ギリシア語の呼びかけは男性形ですが、集まったより広い聴衆を含み得ます。
    reason: lexical_alternative
  - marker: b
    text: 「神を畏れる方々」は、イスラエルの神を礼拝し、会堂に連なっていた異邦人を指す呼称である可能性があります。
    reason: cultural_note
  - marker: c
    text: 「ことば」は「知らせ」「メッセージ」とも訳せます。また、一部の古代写本は「私たちに」ではなく「あなたがたに」と読みます。
    reason: textual_and_lexical_note
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟たち
  rationale: 呼びかけとして自然で簡潔な現代日本語。ギリシア語は男性形だが、集会のより広い聴衆を含み得るため、その点は脚注に示す。
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: アブラハムの家系に連なる子ら
  rationale: υἱοίの親族的表現とγένοςの血統・民族的系譜の意味を保ちつつ、日本語で不自然な「家系の息子たち」を避ける。
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: あなたがたの中で神を畏れる方々
  rationale: 歴史的な半専門用語に限定せず、神への敬虔な畏れを表す記述的な意味を保持する。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 送付の到達先を示す与格を明示する。本文異読により「私たちに」と「あなたがたに」があり得るため、脚注で示す。
- source_word: ὁ λόγος
  choice: ことば
  rationale: λόγοςの語義を比較的形式的に保ちつつ、ここでは告げられた知らせ・メッセージを指すことを脚注で補う。
- source_word: τῆς σωτηρίας ταύτης
  choice: この救いの
  rationale: 属格の関係を解釈しすぎず、「この救いについてのことば」と「この救いをもたらすことば」の含みを残す。
- source_word: ἐξαπεστάλη
  choice: 送られました
  rationale: アオリスト受動の完了した出来事を自然な日本語の過去形で表す。
theological_decisions:
- issue: φοβούμενοι τὸν θεόνが歴史的集団名か一般的描写か
  choice: 「神を畏れる方々」と記述的に訳す
  alternative: 「神を畏れる異邦人たち」「神を敬う人々」
  rationale: 会堂に連なる異邦人を指す可能性は高いが、本文自体は民族を明示しないため、訳文では限定せず文化的背景を脚注に置く。
- issue: Ἄνδρες ἀδελφοίの性別と聴衆範囲
  choice: 「兄弟たち」
  alternative: 「兄弟姉妹の皆さん」「皆さん、兄弟たち」
  rationale: 原文の男性形を保ちながら、呼びかけが集まった聴衆全体に及び得ることを脚注で明示する。
- issue: ἡμῖνの本文異読
  choice: SBLGNT本文に従い「私たちに」
  alternative: 「あなたがたに」
  rationale: 指定された原文のἡμῖνを採用する。一方、重要な写本にはὑμῖνもあるため、真正な本文上の不確かさを脚注で保存する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。説教中の直接的な呼びかけとして適度な敬意を保つ。「畏れる」は単なる恐怖ではなく敬虔な畏敬を示すため漢字表記とした。
