  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: ja
  text: 彼は、属州総督セルギウス・パウルスと一緒にいた。セルギウス・パウルスは思慮深い人であった[a]。この総督はバルナバとサウロを呼び寄せ、神のことばを聞きたいと願った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「理解力のある人」「賢明な人」。
    reason: lexical_alternative
  - marker: b
    text: 「神のことば」は「神からの知らせ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: 地方総督
  rationale: ローマ属州の官職名を指す。日本語で理解しやすく、単なる一般的な「総督」より官職上の意味を示すため「地方総督」とした。
- source_word: σὺν
  choice: そばにいた
  rationale: ここではバルイエスが地方総督と行動を共にし、その周辺にいたことを自然な日本語で表す。関係の具体的性質は本文以上に限定しない。
- source_word: ἀνδρὶ συνετῷ
  choice: 思慮深い人
  rationale: συνετόςが表す理解力、賢明さ、分別の幅を保ち、単なる知能の高さや道徳的徳目だけに限定しない表現とした。
- source_word: οὗτος
  choice: 総督は
  rationale: 指示代名詞の指示対象を明確にし、日本語で不自然な「この人は」を避けつつ、人物描写後の話題の再開を示す。
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: 自分のもとへ呼ぶという中動態分詞の意味を自然に示す。権威者の主導性は表すが、「召喚」のような強制性は加えない。
- source_word: ἐπεζήτησεν
  choice: 聞きたいと願った
  rationale: 熱心に求める、望むという語感を表し、日本語では後続の不定詞と一体にして自然に訳した。
- source_word: ἀκοῦσαι
  choice: 聞きたい
  rationale: 神のことばを受けて聞く意を直接的に表す。文脈上の意欲はἐπεζήτησενと合わせて示した。
- source_word: λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 「神からの知らせ」という意味を含みつつ、原文の属格構造と聖書で定着した表現を保つ。
- source_word: Σεργίῳ Παύλῳ
  choice: セルギウス・パウルス
  rationale: ギリシア語形に基づき、現代日本語で一般的な聖書固有名詞の表記を用いた。
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: バルナバとサウロ
  rationale: 固有名詞として日本語聖書で広く認識される音写を用いた。
theological_decisions:
- issue: λόγον τοῦ θεοῦの訳し方
  choice: 神のことば
  alternative: 神からの知らせ
  rationale: 宣べ伝えられる神のメッセージを指すが、「神のことば」は原文に形式的に近く、意味を特定の教義的概念へ狭めない。別訳で伝達内容としての意味を示す。
- issue: セルギウス・パウルスを評するσυνετόςの含意
  choice: 思慮深い人
  alternative: 理解力のある人／賢明な人
  rationale: 知的理解力と実際的な分別の双方があり得るため、「思慮深い」を採り、脚注で語義の幅を保存した。信仰上または道徳上の評価に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「地方総督」でローマの官職を示し、二度目は「総督」として指示対象を明確にした。原文の一文を日本語では二文に分け、人物関係と主語の移行を読み取りやすくした。すべての脚注記号を対応箇所の本文に付した。
