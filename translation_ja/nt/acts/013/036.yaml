id: ACT.13.36
reference: Acts 13:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: ja
  text: ダビデは、自分の世代において神のご計画に仕えた後[d]、眠りに就き[a]、先祖たちのもとに加えられ[b]、朽ちることを経験しました[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「眠りに就く」は、死ぬことを婉曲に表す聖書的な言い方です。
    reason: cultural_note
  - marker: b
    text: 直訳は「先祖たちのもとに加えられ」。死んで先祖の列に加わったことを表す、ヘブライ語的な言い回しです。
    reason: lexical_alternative
  - marker: c
    text: すなわち、その体が朽ちたということです。次の節との対比を参照。
    reason: cross_reference
  - marker: d
    text: この部分は、「神のご計画に従って自分の世代に仕えた後」とも訳せます。
    reason: ambiguity_note
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: 自分の世代において
  rationale: 与格句を、ダビデが仕えた時代・歴史的範囲を示すものとして訳した。「自分の世代のために」と受益者を明示する解釈は本文に固定せず、別訳を脚注に示した。
- source_word: ὑπηρετήσας
  choice: 仕えた後
  rationale: アオリスト分詞が後続する主要動詞に先立つ行為を表すため、自然な日本語で順序を明示した。「奉仕した」よりも教会用語的な響きが弱く、原語の広い意味に合う。
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: 神のご計画に
  rationale: βουλήが表す神の意図・目的・計画を、現代の一般読者に明瞭な「ご計画」で表した。与格をὑπηρετήσαςに結び付ける本文理解を採用しつつ、統語上可能な別の係り受けは脚注に残した。
- source_word: ἐκοιμήθη
  choice: 眠りに就き
  rationale: 死を表す聖書的な婉曲表現を保ちながら、日本語として自然で格調のある言い方を選んだ。
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: 先祖たちのもとに加えられ
  rationale: 死んで先祖の列に加わることを表すセム語的表現を、原文の受動形と比喩を保って訳した。意味は脚注で説明した。
- source_word: εἶδεν διαφθοράν
  choice: 朽ち果てました
  rationale: 直訳的な「朽ちを見た」は日本語では誤解されやすいため、ダビデの体が腐敗を経験したという意味を自然に表した。次節との対比も保たれる。
theological_decisions:
- issue: ダビデの死を表す婉曲表現
  choice: 眠りに就き
  alternative: 死に
  rationale: 原文は直接的な死の動詞ではなくκοιμάομαιを用いる。復活や死後の状態について本文以上の説明を加えず、原文の比喩だけを保持した。
- issue: 神のβουλήの訳語
  choice: 神のご計画
  alternative: 神の御心／神の目的
  rationale: 神の意図と定めを表しつつ、特定の教理体系に狭めない明瞭な現代語とした。
- issue: 二つの与格句の係り受け
  choice: 自分の世代において神のご計画に仕えた
  alternative: 神のご計画に従って自分の世代に仕えた
  rationale: 本文ではἰδίᾳ γενεᾷを時代的範囲、τῇ τοῦ θεοῦ βουλῇを「仕える」の対象として読んだ。ただしギリシア語には別の係り受けの余地があるため、脚注で明示し、解釈を一つに固定しない。
- issue: 朽ちるものの理解
  choice: 朽ち果てました
  alternative: 朽ちることを経験しました
  rationale: 文脈上は遺体の腐敗を指す。本文に「体」を補って限定することは避け、脚注で意味を説明した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「眠りに就く」「先祖たちのもとに加えられる」という原文の聖書的比喩は保持した。「ご計画」は平易さと尊敬表現を両立させ、全体を朗読にも適した簡潔で格調ある文体に整えた。
