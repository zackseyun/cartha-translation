source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: ja
  text: そこで、パウロは立ち上がり、手で合図をして言った。「イスラエルの男性の皆さん、また神を畏れる方々[a]、聞いてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を畏れる方々」は、「神を畏れる人々」（God-fearers）と呼ばれることもある。会堂と関わりを持ち、イスラエルの神を礼拝していた異邦人を指す可能性が高い。
    reason: 語句の歴史的・社会的背景を補い、イスラエル人とは区別される第二の聴衆である可能性を、本文に断定として持ち込まずに示すため。
lexical_decisions:
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: 文脈では、語り始める前にパウロが実際に立った動作を表す。現代日本語として自然で、具体的な動きを保つ。
- source_word: δὲ
  choice: そこで
  rationale: ここでは強い対比ではなく、物語の進行を示す接続辞であるため、「そこで」とした。
- source_word: κατασείσας τῇ χειρὶ
  choice: 手で合図をして
  rationale: 発言に先立ち、注意を促したり静粛を求めたりする身振りを自然な日本語で表す。「手を振って」では不必要に大きな動作を連想させるため避けた。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: イスラエルの皆さん
  rationale: 男性への呼びかけを含む表現だが、日本語で「イスラエルの男たち」とすると不自然で粗い響きになる。会堂での公的な呼びかけとして自然で敬意のある表現を選んだ。
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: 神を畏れる方々
  rationale: 分詞の動詞的な意味を保ちつつ、会堂に集う第二の聴衆への敬意ある呼びかけとして訳した。「畏れる」は単なる恐怖ではなく、神への畏敬を示す。
- source_word: ἀκούσατε
  choice: 聞いてください
  rationale: 注意深く耳を傾けるよう求める命令である。直接性を保ちつつ、日本語の公的な呼びかけとして自然な形にした。
theological_decisions:
- issue: イスラエル人と、神を畏れる第二の集団への呼びかけ
  choice: 「イスラエルの皆さん、そして神を畏れる方々」
  alternative: 「イスラエル人の男性たち、また神を畏れる人々」
  rationale: 原文は民族的イスラエル人と、「神を畏れる」と描写される別の集団を区別している。後者は会堂と関わりを持つ異邦人を指す可能性が高いが、本文では技術的な呼称に固定せず、原文の描写的表現を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、公の場での演説にふさわしい落ち着いた調子と敬意を保った。「畏れる」は聖書的な神への畏敬を自然に表す語として採用した。
