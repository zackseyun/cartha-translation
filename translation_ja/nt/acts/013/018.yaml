lexical_decisions:
- source_word: καί
  choice: そして
  rationale: 歴史的叙述を継続する接続詞として、自然な現代日本語の「そして」とした。
- source_word: ὡς
  choice: 約
  rationale: 期間がおおよそであることを示すため、簡潔な「約」で近似の含意を保った。
- source_word: τεσσερακονταετῆ χρόνον
  choice: 四十年の間
  rationale: 四十年に及ぶ期間を表す語句であり、日本語として自然に期間を示した。
- source_word: ἐτροποφόρησεν
  choice: 耐え忍ばれた
  rationale: SBLGNT本文のτροποφορέωが示す「辛抱して耐える」という意味を、神を主語とする文脈にふさわしい自然で品位ある日本語で表した。異読の養育的な意味は脚注に残した。
- source_word: αὐτοὺς
  choice: 彼らを
  rationale: 荒野にいたイスラエルの民を指す直接目的語として訳した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: イスラエルの荒野の旅という聖書的・地理的背景を保つ標準的な表現を用いた。
theological_decisions:
- issue: 荒野における神のイスラエルへの行為
  choice: 彼らを耐え忍ばれた
  alternative: 彼らを養われた／世話をされた
  rationale: 提示されたSBLGNT本文ἐτροποφόρησενは「耐え忍ぶ」を支持するため、本文では民の反抗に対する神の忍耐を弱めずに訳した。一方、「養う」を意味するἐτροφοφόρησενを読む写本もあるので、その異読は脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、歴史叙述として簡潔かつ品位ある調子にした。神を主語とする敬語は「耐え忍ばれた」にとどめ、過度に古風な表現は避けた。
