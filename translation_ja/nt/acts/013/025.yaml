source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: ja
  text: ヨハネは自分の務めを終えようとしていたとき、繰り返しこう言っていた。「あなたがたは、私を何者だと思っているのですか。私はその方ではありません。[a] しかし、見なさい。私の後から来られる方がいます。私は、その方の足の履物を解くにも値しません。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より明示的に言えば、「私はメシアではありません」。ギリシア語では否定される身分が省略されていますが、文脈はメシアを指していると考えられます。
    reason: alternative_reading
  - marker: b
    text: 写本や翻訳によっては「その方の履物のひもを解く」と、より具体的に訳されています。しかし、ここで採用したギリシア語本文には「ひも」に当たる語はなく、直訳的には「その方の足の履物を解く」です。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: 自分の務めを終えようとしていた
  rationale: δρόμοςの「走路」という比喩がここでは神から託された生涯の働きを指すため、現代日本語で明瞭な「務め」とした。未完了過去ἐπλήρουは、完了へ向かう進行を「終えようとしていた」で表した。
- source_word: ἔλεγεν
  choice: 繰り返しこう言っていた
  rationale: 未完了過去が示しうる継続的・反復的な証言を自然な日本語で表した。
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: あなたがたは、私を何者だと思っているのですか
  rationale: τίと不定詞構文が問う、ヨハネに帰されている身分・正体を、自然で明瞭な日本語にした。ὑπονοεῖτεの推測・想定の意味も「思っている」に含ませた。
- source_word: οὐκ εἰμὶ ἐγώ
  choice: 私はその方ではありません
  rationale: 原文では否定される身分が省略されている。「その方」によって文脈上の期待された人物を指しつつ、「メシア」と明示して原文以上に限定することを避けた。
- source_word: ἀλλ’ ἰδοὺ
  choice: しかし、見なさい
  rationale: ἰδούの注意喚起の力を保ち、古語的な表現を避けた。
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: 私の後から来られる方がいます
  rationale: 現在形の切迫感を保ちながら、日本語では暗黙の主語を「方」として補い、後続の敬意ある表現と調和させた。
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: その方の足の履物を解く
  rationale: 本文にない「ひも」を加えず、ὑπόδημαを包括的な「履物」とした。τῶν ποδῶνも「足の」として残し、λύωは文脈に即して「解く」と訳した。
- source_word: ἄξιος
  choice: 値しません
  rationale: 行為をするに足る資格・ふさわしさがないという謙遜を、自然な日本語で表した。
theological_decisions:
- issue: οὐκ εἰμὶ ἐγώでヨハネが否定する身分
  choice: 本文では「私はその方ではありません」とし、否定対象を明示しすぎない
  alternative: 「私はメシアではありません」
  rationale: 文脈はメシアを強く示唆するが、ギリシア語自体は補語を省略している。その含みと神学的緊張を本文に保ち、注で有力な指示対象を説明した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒言行録の公的な説教にふさわしい品位を保った。ヨハネの発言は丁寧体とし、来る方への敬意は「来られる方」「その方」で自然に表した。
