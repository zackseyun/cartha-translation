  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: ja
  text: しかし、パウロとも呼ばれるサウロは、聖霊に満たされて、彼をじっと見つめ、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: サウロ
  rationale: ギリシア語の人名を、日本語聖書で広く定着している形で音写した。
- source_word: δέ
  choice: しかし
  rationale: 直前の出来事からサウロの応答へ移る際の、穏やかな対照と展開を表す。
- source_word: ὁ καὶ Παῦλος
  choice: すなわちパウロとも呼ばれていた人
  rationale: サウロがパウロという別名も持っていたことを示す同格表現として自然に訳した。「呼ばれていた」は原文に明示された動詞ではないが、日本語では二つの名の関係を明瞭に表せる。
- source_word: πλησθεὶς
  choice: 満たされ
  rationale: πίμπλημιのアオリスト受動分詞の受動的意味を保ち、後続の行為とのつながりを自然な日本語で示す。
- source_word: πνεύματος ἁγίου
  choice: 聖霊に
  rationale: 「満たす」と組み合わせ、日本語として自然な助詞「に」を用いた。使徒言行録の文脈では神の聖霊を指す。
- source_word: ἀτενίσας
  choice: じっと見つめて
  rationale: 視線を一点に定めて注意深く見るという語の強さを、明瞭な現代日本語で表した。
- source_word: εἰς αὐτόν
  choice: 彼を
  rationale: ἀτενίζωとの構文を、日本語で自然な目的語として訳した。文脈上「彼」はエリマを指す。
theological_decisions:
- issue: πνεύματος ἁγίου の指示対象
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 使徒言行録における用法と、力を与えられるこの場面の文脈から、神の聖霊を指すと判断した。
- issue: ὁ καὶ Παῦλος における二つの名の関係
  choice: パウロとも呼ばれていた
  alternative: すなわちパウロでもある
  rationale: 同一人物の別名であることを自然に示す一方、改名が起きたとは訳文に持ち込まないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文は次節へ続くため、節末を読点として統語的な連続性を保った。
