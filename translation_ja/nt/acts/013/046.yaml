  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: ja
  text: そこで、パウロとバルナバは大胆に言った。「神の言葉は、まずあなたがたに語られなければなりませんでした。あなたがたがそれを退け、自分自身を永遠の命にふさわしくない者と判断しているので、見なさい、私たちは異邦人[a]のほうへ向かっています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。ここでは会堂にいるユダヤ人の聴衆との対比で非ユダヤ人を指すため、本文では「異邦人」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: 大胆に
  rationale: παρρησιάζομαιが表す、恐れず率直に語る態度を自然な日本語で示す。分詞は主動詞εἶπανの様態として訳した。
- source_word: Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι
  choice: まずあなたがたに語られる必要がありました
  rationale: 与格ὑμῖν、順序を示すπρῶτον、必要性を表すἀναγκαῖον、受動不定詞λαληθῆναιを明確に保った。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神の言葉
  rationale: 神からの宣言・知らせを指す定着した聖書表現を用い、「言葉」が持つ幅を保った。
- source_word: ἀπωθεῖσθε
  choice: 退け
  rationale: 押しのけて拒むという動詞の強さを簡潔に表す。現在形の継続的な局面は、後続の現在表現を含む文脈から理解できる。
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: 自分自身を…ふさわしくない者と判断しています
  rationale: κρίνετεの判断・判定の含意と、ἑαυτούςの再帰性を明示し、話者が一方的に彼らを断罪しているようには訳さない。
- source_word: τῆς αἰωνίου ζωῆς
  choice: 永遠の命に
  rationale: ἀξίουςに伴う属格を、日本語で自然な「～にふさわしい」の形にした。
- source_word: ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη
  choice: 見なさい。私たちは異邦人の方へ向かいます
  rationale: ἰδούの注意喚起を明示し、στρέφομαιの方向転換を「方へ向かう」で表した。τὰ ἔθνηは会堂の聴衆との対比から「異邦人」とした。
theological_decisions:
- issue: τὰ ἔθνηの救済史的・民族的な指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: 直前の会堂の聴衆であるユダヤ人との対比では、地理的な諸国家よりも非ユダヤ人を指すため。ただし語そのものが「諸国民」とも訳せることを脚注に残した。
- issue: οὐκ ἀξίους κρίνετε ἑαυτοὺςの判断主体
  choice: 聞き手が自分自身をふさわしくない者と判断している
  alternative: パウロが聞き手を客観的にふさわしくないと宣告している
  rationale: ギリシア語はκρίνετεの主語を聞き手とし、再帰代名詞ἑαυτούςを目的語に置く。彼らの拒絶が自らへの判断となるという構造を保った。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、使徒たちの公的で毅然とした発言にふさわしい品位を保った。「見なさい」はἰδούの強い注意喚起を残すための意図的な表現。
