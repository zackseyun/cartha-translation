  naturalness: 「また、…ことについては、こう言っておられます」はやや硬く不自然です。「さらに、…ことについて、神はこう言っておられます」とすると、明瞭な現代標準日本語になり、引用導入としても自然です。「死者の中から」は復活文脈で自然です。
  terminology: 「復活させた」「朽ち果てる」は文脈に適しています。「恵み」はὅσιαの契約的恩恵を表し得ますが、「ダビデに約束した」と本文で固定せず、「ダビデに関する」として省略的な関係を保持します。脚注で「ダビデに約束した」という理解を代替訳として示します。
