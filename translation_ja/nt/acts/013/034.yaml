  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: ja
  text: 'さらに、神がこの方を、二度と朽ち果てることのない者として死者の中から復活させたことについて、こう言っておられます。


    「わたしは、ダビデに関する聖なる、確かな恵みを、あなたがたに与える。」[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「ダビデの聖なる、確かなもの」。イザヤ55:3を踏まえた表現で、「ダビデに約束した聖なる確かな恵み」または、伝統的に「ダビデの確かな慈しみ」とも訳される。「ダビデの」が示す関係は原文では明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: 神がこの方を死者の中から復活させ
  rationale: 主語は直前の文脈から神であり、ἐκ νεκρῶνを伴うἀνέστησενは復活を明確に表す。「この方」は説教中の指示対象であるイエスを保ちつつ、αὐτόνを自然に表現する。
- source_word: μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν
  choice: もはや朽ちることに戻らないようにされた
  rationale: μηκέτιの「もはや～ない」とὑποστρέφεινの「戻る」を保ち、διαφθοράをこの復活の文脈に即して身体の「朽ち」とした。μέλλονταの未来的含意は、復活後には朽ちへ戻らないという自然な日本語で表した。
- source_word: οὕτως εἴρηκεν
  choice: こう言っておられます
  rationale: 完了形が示す、聖書の言葉が今も効力を持つ含意を、現在にも及ぶ丁寧な表現で示した。
- source_word: Δώσω ὑμῖν
  choice: わたしは……あなたがたに与える
  rationale: 未来の約束を明瞭かつ自然な現代日本語で表した。
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: ダビデに約束した聖なる確かな恵み
  rationale: イザヤ55:3を背景とする省略的で難解な句。τὰ ὅσιαを契約に伴う聖なる恩恵、τὰ πιστάを確実で信頼できるものとして表し、「ダビデの」が意味し得る関係を文脈上自然な「ダビデに約束した」とした。ただし原文の関係表現には幅があるため脚注を付した。
theological_decisions:
- issue: τὰ ὅσια Δαυὶδ τὰ πιστάにおけるダビデとの関係と内容
  choice: ダビデに約束した聖なる確かな恵み
  alternative: ダビデの聖なる確かなもの／ダビデに与えられた確かな慈しみ
  rationale: パウロはイザヤ55:3を引用し、復活とダビデに関わる確実な契約的恩恵を結び付けている。本文では意味が伝わるよう「恵み」としたが、ギリシア語自体は「祝福」「慈しみ」「約束」などの一語を明示せず、ダビデとの関係も省略的なので、脚注で曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教中の聖書引用にふさわしい品位を保った。「腐敗」は道徳的意味に取られやすいため、身体的な朽壊を示す「朽ち」を採用した。引用句の省略性と解釈幅は本文で過度に説明せず、脚注で示した。
