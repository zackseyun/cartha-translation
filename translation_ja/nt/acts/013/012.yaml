id: ACT.13.12
reference: Acts 13:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: ja
  text: その時、属州総督は起こったことを見て、主の教え[a]に驚嘆し、信じた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主からの教え」、または「主についての教え」とも理解できる。ギリシャ語の属格には複数の解釈が可能である。
    reason: alternative_reading
  - marker: b
    text: ギリシャ語では、何を、または誰を信じたのかは明示されていない。
    reason: theological_ambiguity
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の次の出来事を示す時間的・継起的な副詞として、簡潔で自然な日本語にした。
- source_word: ἰδὼν
  choice: 見て
  rationale: ὁράωのアオリスト分詞。主動詞に先立つ、またはそれと密接に結びついた出来事を、日本語の接続形で自然に表した。
- source_word: ὁ ἀνθύπατος
  choice: 属州総督
  rationale: ローマの元老院属州を治めた proconsul を指す官職名。単なる「総督」より歴史的な役職を明確に示す。
- source_word: τὸ γεγονός
  choice: 起こったこと
  rationale: γίνομαιの完了分詞を名詞的に用いた表現で、すでに生じた出来事を指す。自然な日本語で完了した事態を表した。
- source_word: ἐπίστευσεν
  choice: 信じた
  rationale: πιστεύωのアオリストで、目的語は明示されていない。文脈以上の対象を補わず、原文の簡潔さを保った。
- source_word: ἐκπλησσόμενος
  choice: 驚嘆し
  rationale: 強い驚きを表す現在分詞。信じた際の付随的な状態・事情として、流れのよい日本語にした。
- source_word: ἐπὶ τῇ διδαχῇ
  choice: 教えに
  rationale: ἐπί＋与格は驚きの根拠または契機を示す。「教えに驚嘆する」はその関係を自然に表す。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: 属格を簡潔な「の」で訳し、その教えが主に由来するのか、主に属するのか、主についてのものかという解釈の幅を本文で限定しすぎないようにした。
theological_decisions:
- issue: 目的語を伴わない πιστεύω の意味
  choice: 「信じた」とし、信仰の対象を本文に補わない。
  alternative: 「主を信じた」「福音を信じた」「信仰に入った」
  rationale: 文脈はキリスト者としての信仰を示唆するが、ギリシャ語は目的語を明示していない。文脈に理解を委ね、原文以上に特定しない。
- issue: τοῦ κυρίου が διδαχή に対して持つ属格のニュアンス
  choice: 「主の教え」と訳し、注で複数の理解を示す。
  alternative: 「主からの教え」「主についての教え」
  rationale: 属格は起源・所有・内容などに理解でき、一つに断定すると原文の含みが失われるため。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「属州総督」でローマの官職としての歴史的精度を確保しつつ、文全体は一般読者にも理解しやすい簡潔な語順とした。
