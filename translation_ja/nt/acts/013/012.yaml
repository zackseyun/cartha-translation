  terminology: 「属州総督」は一般的な「総督」より原語のローマ官職名をよく反映する。「主」はκύριοςの一貫した訳語として適切である。「主の教え」は属格の起源・所属・内容に関する解釈の幅を本文で不必要に限定していない。
