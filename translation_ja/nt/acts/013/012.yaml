  source_fidelity: 「属州総督」はἀνθύπατος（プロコンスル）の歴史的に特定された官職を適切に表す。「起こったことを見て」はἰδὼν τὸ γεγονόςの完了した出来事を見たという関係を自然に再現している。「信じた」は目的語を補わず、ἐπίστευσενの簡潔さと文脈上の含みを保っている。「主の教えに驚嘆し、信じた」は、ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίουを無理なく訳している。
