id: ACT.13.8
reference: Acts 13:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: ja
  text: しかし、魔術師エリマ[b]は――この名は「魔術師」と訳される――二人に反対し、属州総督を信仰から遠ざけようとしていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰から」は、「この信仰から」、または「信じることから」とも取れる。ギリシア語は、キリストへの信仰そのものと、信じる応答との両方を含み得る。
    reason: alternative_reading
  - marker: b
    text: 「エリマ」は、翻訳または解釈された名として説明されているが、その正確な語源は明らかでない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: 反対し……していた
  rationale: 未完了時制が示す継続的な抵抗を、自然な現代日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の好意的な受け入れとの対照を明確に示す。
- source_word: αὐτοῖς
  choice: 二人に
  rationale: 文脈上のパウロとバルナバを指す複数代名詞であり、日本語では「彼ら」より「二人」が自然で、指示対象を必要以上に本文へ補わない。
- source_word: Ἐλύμας ὁ μάγος
  choice: 魔術師エリマ
  rationale: μάγοςの意味範囲を過度に悪意あるものへ狭めず、現代の読者に分かりやすく表した。固有名は「エリマ」と音写した。
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: その名はこのように訳される
  rationale: 名前の翻訳または解釈を述べる挿入句として、原文の曖昧さを保った。
- source_word: ζητῶν
  choice: ようとしていた
  rationale: 反対行為に伴う意図・企てを自然な日本語で表し、継続性も示した。
- source_word: διαστρέψαι ... ἀπὸ
  choice: ……から遠ざける
  rationale: 人をある対象からそらすという文脈上の意味を明瞭に伝える。
- source_word: τὸν ἀνθύπατον
  choice: 地方総督
  rationale: ローマ属州のproconsulを指す官職名。一般読者への明瞭さを優先しつつ、単なる統治者ではなく地方行政官であることを示した。
- source_word: ἀπὸ τῆς πίστεως
  choice: 信仰から
  rationale: 定冠詞を伴うπίστιςはキリストへの信仰、またはその信仰内容を指し得るが、日本語では「信仰」が両方の含みを保ちやすい。
theological_decisions:
- issue: πίστιςの指示内容
  choice: 信仰から
  alternative: この信仰から／信じることから
  rationale: 文脈上はキリストへの信仰を指す可能性が高い一方、信じる応答そのものから遠ざける意味も排除できないため、本文では曖昧さを保ち、脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の継続的な反対を「反対し……していた」で表し、説明的挿入句にはダッシュを用いた。脚注記号は本文末尾に配置した。
