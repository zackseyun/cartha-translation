  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: ja
  text: そして、カナンの地で七つの民族を滅ぼし、その土地をイスラエルに相続地として与えられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その土地を相続地として割り当てられた」。ギリシャ語の動詞は、相続地として分配する、あるいは割り当てることを強調する場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: 滅ぼし
  rationale: καθαιρέωのアオリスト分詞は、ここでは神がカナンの諸民族を征服によって取り除いたことを指す。「滅ぼし」は文脈上の強さを保ち、現代日本語として明瞭である。
- source_word: ἔθνη ἑπτὰ
  choice: 七つの民族
  rationale: ἔθνηは「国々」とも訳せるが、土地に住む集団を指すこの歴史的文脈では「民族」が自然であり、近代的な国家制度を不必要に連想させない。
- source_word: ἐν γῇ Χανάαν
  choice: カナンの地で
  rationale: γῇを明示的に反映しつつ、動作の場所を表すἐνを自然な日本語の「で」で訳した。
- source_word: κατεκληρονόμησεν
  choice: 相続地として与えられた
  rationale: この動詞には、相続財産として割り当てる、分配するという意味がある。本文では相続の主題を保ち、文脈上の受け手であるイスラエルを補って自然に表現した。
- source_word: τὴν γῆν αὐτῶν
  choice: その土地
  rationale: αὐτῶνは直前の七民族を受ける。「彼らの土地」よりも、日本語では指示対象が明確で自然な「その土地」とした。
theological_decisions:
- issue: 二つの動作の主語と、相続地を受けた者
  choice: 神を両方の動作の主語とし、イスラエルを土地の受け手として本文に補う。
  alternative: 「その土地を相続地として割り当てられた」とし、受け手を明示しない。
  rationale: 直前から続くイスラエル史の叙述では神が主語である。ギリシャ語には間接目的語が明記されていないが、歴史的文脈上、受け手はイスラエルであるため、これは教理的な付加ではなく意味を自然な日本語で明確にする補足である。
- issue: κατεκληρονόμησενの意味の幅
  choice: 相続地として与えられた
  alternative: その土地を相続地として割り当てられた
  rationale: 写本上採用された動詞は、相続として与えることと割り当て・分配の双方を含み得る。本文では自然さを優先し、分配の含意は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「与えた」ではなく「与えられた」として、神への敬意を表す聖書翻訳として自然な敬語を用いた。脚注記号[a]は該当する動詞句の直後に置いた。
