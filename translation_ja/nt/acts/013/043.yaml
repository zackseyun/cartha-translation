source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: ja
  text: 会堂の集まりが終わると[a]、ユダヤ人と敬虔な改宗者たちのうち、多くの人がパウロとバルナバについて行った。二人は彼らに語りかけ、神の恵みにとどまるよう勧め続けた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「会堂の集まりが解散すると」。ギリシア語は文脈上、建物そのものではなく、集まっていた会衆または集会が解散したことを指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神の恵みにとどまるよう説得し続けた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: 会堂の集まりが終わると
  rationale: 属格独立構文が示す先行状況を自然に表した。ここでの συναγωγή は建物よりも集まった会衆またはその集会を指すため、「会堂の集まり」とした。λυθείσης は集会の解散・終了を表す。
- source_word: ἠκολούθησαν
  choice: ついて行った
  rationale: 集会後にパウロとバルナバの後について行く動作を直接的かつ自然に表す。
- source_word: πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: ユダヤ人と、敬虔な改宗者たちのうち、多くの人
  rationale: πολλοὶ に続く二つの部分属格を両群にかかる形で明示した。προσήλυτος はユダヤ教への改宗者を指し、σεβομένων はその敬虔さを表す。
- source_word: οἵτινες προσλαλοῦντες αὐτοῖς
  choice: 二人は彼らに語りかけ
  rationale: οἵτινες の先行詞がパウロとバルナバであることを日本語で明確にし、分詞を主動詞に伴う行為として自然に表した。προσλαλεῖν の、相手に向けてさらに語る含みを「語りかける」で示した。
- source_word: ἔπειθον
  choice: 勧め続けた
  rationale: 未完了過去の継続性を「続けた」で表した。ここでは不定詞の内容が勧告的なので、単に「説得した」より「勧めた」が文脈に合う。
- source_word: αὐτοὺς προσμένειν τῇ χάριτι τοῦ θεοῦ
  choice: 神の恵みにとどまるよう
  rationale: προσμένειν の「とどまる、持続する」を保ち、与格を「恵みに」で表した。「神の恵み」が神の恩恵そのものと、それに形づくられる領域の双方を含み得る余地を残した。
theological_decisions:
- issue: 「神の恵みにとどまる」の意味
  choice: 神の恵みにとどまる
  alternative: 神の恵みの知らせを信じ続ける／神の好意の中にとどまる
  rationale: 原文は、神の恵みそのもの、恵みによる生の領域、また恵みの福音への継続を含み得る。特定の教理的解釈に限定せず、原文の神学的な広がりを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、礼拝・聖書朗読に適する落ち着いた文体とした。「シナゴーグ」ではなく一般読者に通じる「会堂」を採用し、意味上必要な「集まり」を補った。
