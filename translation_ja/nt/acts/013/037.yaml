source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: ja
  text: しかし、神がよみがえらせた方は、朽ち果てることがなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「腐敗（朽敗）を見ることがなかった」。ギリシア語は、ここでは遺体の腐敗・朽敗を指す。「見る」は、それを経験するという意味の表現である。この語は詩篇16篇10節のギリシア語訳でも用いられている。
    reason: διαφθοράの文脈上の意味と、「見る」という原文の表現を示し、詩篇16篇10節との語彙的なつながりを保持するため。
lexical_decisions:
- source_word: ὃν
  choice: 方
  rationale: 直前から論じられているイエスを指す関係代名詞。日本語では敬意を伴う「方」で人物を自然に示し、関係節「神がよみがえらせた」で限定する。
- source_word: δὲ
  choice: しかし
  rationale: 前節で、ダビデが朽ち果てたことを述べたのに対し、神がよみがえらせた方はそうではなかったという対比を明確にする。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 定冠詞付きの θεός を、現代日本語で自然な固有的呼称「神」とした。
- source_word: ἤγειρεν
  choice: よみがえらせた
  rationale: ダビデの死と朽敗との対比、および直前の復活論証から、ここでは死者の中から起こす意味が文脈上明確である。「復活させた」よりも動詞的で平明な表現を選んだ。
- source_word: οὐκ εἶδεν
  choice: …ことがなかった
  rationale: 字義的には「見なかった」だが、「朽ち果てるのを見なかった」は現代日本語では不自然になりやすい。経験・遭遇を表すセム語的な言い回しの意味を自然に伝える。
- source_word: διαφθοράν
  choice: 朽ち果てる
  rationale: この文脈では遺体の腐敗・朽敗を指す。「腐敗」より平明で、詩篇引用との語彙的つながりも保てる。「滅び」の可能性は脚注に残す。
theological_decisions:
- issue: ἤγειρεν の復活の意味
  choice: 神がイエスを死者の中からよみがえらせたことを表す
  alternative: 神がイエスを立てた、または世に現したことを表す
  rationale: 直前ではダビデが死んで朽ち果てたことが語られ、ここでは朽ち果てなかった方と対比されている。そのため、この箇所では復活の意味が文脈によって決定的である。
- issue: οὐκ εἶδεν διαφθοράν の表現
  choice: 朽ち果てることがなかった
  alternative: 朽ち果てるのを見なかった
  rationale: 原文の「見る」という比喩的表現を逐語的に再現するより、その意味である「経験しなかった」を自然な日本語で示す。ただし、διαφθοράの語義の幅は脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「方」は指示対象であるイエスへの自然な敬意を示すが、原文にない称号は加えていない。
