id: ACT.13.22
reference: Acts 13:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: ja
  text: そして、神は彼を退けると[a]、彼らのためにダビデを王として立てた。神はダビデについて証言し、こう言った。「わたしはエッサイの子ダビデを見いだした。彼はわたしの心にかなう人で[b]、わたしの望むことをすべて行う[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼」はサウルを指す。別訳「彼を王位から退けると」。
    reason: 文脈上の指示対象と、動詞が王位からの排除を含み得ることを明示するため。
  - marker: b
    text: 直訳に近くは「わたしの心に沿う人」。
    reason: 「心にかなう」が表す原語の構造と、神の意向への適合という含みを示すため。
  - marker: c
    text: 「望むこと」に当たるギリシア語は複数形で、神のさまざまな意向を指す。
    reason: 日本語では形の上で見えにくい原語の複数性を示すため。
lexical_decisions:
- source_word: μεταστήσας
  choice: 退けると
  rationale: 文脈上、神がサウルを王位から退けたことを表す。「罷免する」ほど政治的に限定せず、原語の広がりを保った。
- source_word: ἤγειρεν
  choice: 立てた
  rationale: ここでは指導者を起こし、王として立てる意味。「王として」が復活の意味ではないことを明確にするため、自然な日本語の「立てた」とした。
- source_word: αὐτοῖς
  choice: 彼らのために
  rationale: イスラエルの民のために王を立てたという利益・目的を示す与格の含みを表した。
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: ダビデについて証言し、こう言った
  rationale: 関係代名詞の指示対象を明示し、証言の対象がダビデであることを自然な日本語で表した。
- source_word: Εὗρον
  choice: 見いだした
  rationale: 神がダビデを選び出したという完了した行為を、聖書的な格調を保つ「見いだした」で表した。
- source_word: τὸν τοῦ Ἰεσσαί
  choice: エッサイの子ダビデ
  rationale: 省略された親子関係を、日本語で明瞭かつ慣用的に補った。
- source_word: κατὰ τὴν καρδίαν μου
  choice: わたしの心にかなう
  rationale: 直訳的な「わたしの心に従う」より自然であり、単なる感情的な親近感ではなく、神の心・意向との適合を表す。
- source_word: πάντα τὰ θελήματά μου
  choice: わたしの望むことをすべて
  rationale: 複数形 θελήματα が示す神のさまざまな意向や望みを、日本語として自然な複数的表現で保持した。
theological_decisions:
- issue: ダビデが「神の心にかなう人」であることの意味
  choice: わたしの心にかなう人
  alternative: わたしの心のままになる人／わたしと心を同じくする人
  rationale: 神との感情的な親密さだけに狭めず、神の意向にかなう人物という原文の幅を保った。
- issue: 神がダビデを「立てた」の意味
  choice: ダビデを王として立てた
  alternative: ダビデを王に任命した／ダビデを王として起こした
  rationale: 神による選びと登用を示しつつ、復活を意味するとの誤解を避け、特定の王権神学を過度に読み込まない表現とした。
- issue: πάντα τὰ θελήματά μου の複数性
  choice: わたしの望むことをすべて
  alternative: わたしの意志をすべて／わたしの望みをことごとく
  rationale: 神の意志を抽象的な単数概念に平滑化せず、複数形が示す個々の意向を自然な日本語で表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「見いだした」「証言し」などに適度な格調を保った。引用内の一人称は神の発言として「わたし」を用いた。固有名詞は一般的な聖書表記の「ダビデ」「エッサイ」とした。
