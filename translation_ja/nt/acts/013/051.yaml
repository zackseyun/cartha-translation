  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: ja
  text: しかし二人は、彼らに対して足のちりを払い落とし、イコニオンへ向かった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 足のちりを払い落とすことは、その人々との関係を断ち、知らせを拒んだ彼らに対する証しとする象徴的な行為でした。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: しかし二人は
  rationale: δέの穏やかな対照を「しかし」で示し、冠詞付き分詞の主語が直前のパウロとバルナバであることを、自然な日本語として「二人」と明示した。
- source_word: ἐκτιναξάμενοι
  choice: 払い落とし
  rationale: ἐκτινάσσωは振って除く動作を表す。足のちりについては「払い落とす」が現代日本語として自然で、力を加えて取り除く意味も保つ。アオリスト分詞は、主動詞に先立つ動作として連用形で表した。
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: 足のちりを
  rationale: κονιορτόςを一般的で正確な「ちり」とし、属格句は日本語の自然な結び付きで「足のちり」とした。
- source_word: ἐπ’ αὐτοὺς
  choice: 彼らに対して
  rationale: ἐπί＋対格が持つ、この象徴的行為の向けられた相手と対抗的な含みを保つ。「抗議して」や「証しとして」と解釈を本文へ加えず、「彼らに対して」とした。
- source_word: ἦλθον
  choice: 向かった
  rationale: 目的地への移動を示す文脈なので、日本語では「行った」よりも旅程を自然に表す「向かった」とした。
- source_word: εἰς Ἰκόνιον
  choice: イコニオンへ
  rationale: εἰςの目的地への方向を助詞「へ」で表し、地名は一般的な日本語音写「イコニオン」とした。
theological_decisions:
- issue: 足のちりを払い落とす象徴的行為
  choice: 本文では「彼らに対して足のちりを払い落とし」と行為と方向だけを訳す。
  alternative: 「彼らへの証しとして」または「彼らを裁くしるしとして」と意味を本文中で明示する。
  rationale: この行為には関係を断つことや拒絶した者への証言という背景があるが、ギリシア語本文は行為とその対象のみを明記する。解釈を本文で一義的に決めず、文化的意味は注に置いた。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「二人」で指示対象を自然に示し、象徴行為の意味は本文に過剰に織り込まず注で説明した。
