  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: ja
  text: ですから、預言書の中で語られていることが、あなたがたの身に降りかからないよう、気をつけなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「預言者たちの中で」。文脈上、これから引用される警告が預言書に記されていることを指すと考えられる。別訳「預言者たちによって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: 気をつけなさい
  rationale: 二人称複数の現在命令形が持つ警告の力を、明瞭で自然な現代日本語で表す。
- source_word: οὖν
  choice: ですから
  rationale: 直前の宣告を受けた論理的帰結を示しつつ、口頭説教として自然な接続にする。
- source_word: μὴ ἐπέλθῃ
  choice: 身に降りかからないよう
  rationale: 命令形に続くμήとアオリスト接続法による否定的警告を表し、ἐπέρχομαιが含む災い・裁きの到来を自然に伝える。
- source_word: τὸ εἰρημένον
  choice: 語られていること
  rationale: 冠詞付き完了受動分詞の実詞的用法を表す。完了の継続的効力を日本語で過度に明示せず、今も書中にある言葉として自然に読める形にする。
- source_word: ἐν τοῖς προφήταις
  choice: 預言者たちの書に
  rationale: ἐνの場所的意味と、直後にハバクク書が引用される文脈を踏まえ、預言書群の中に記された警告を指すことが分かるようにする。
theological_decisions:
- issue: 「預言者たち」の指示対象
  choice: 預言者たちの書、すなわち預言書群を指す表現
  alternative: 人間である預言者たちを、発言の主体として指す表現
  rationale: 直後にハバクク書から引用されるため、主眼は預言者による行為者性よりも、預言書に記された言葉にある。ただし脚注で「預言者たちによって」という可能性も示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。説教の流れに合う「ですから」を用い、警告の切迫感は「気をつけなさい」で保った。脚注記号は節末に置き、本文の読みやすさを損なわないようにした。
