  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: ja
  text: この方は、この方と共にガリラヤからエルサレムへ上った人々に、何日にもわたって姿を現した[a]。その人々は今、民[b]に対してこの方の証人となっている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何日にもわたって彼らに見られた」。ギリシア語の動詞は、特に復活後の顕現を述べる文脈で、このようにより直訳的にも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここでの「民」は、文脈上、特にユダヤの民、すなわちイスラエルを指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: この方は
  rationale: 直前の文脈で言及されたイエスを受ける関係代名詞。節単独でも指示関係を保ちつつ、原文にない固有名を補わない表現とした。
- source_word: ὤφθη
  choice: 姿を現した
  rationale: ὁράωのアオリスト受動形だが、復活後の顕現を述べる文脈では「現れた」の意味で慣用的に用いられる。自然な日本語として「姿を現した」とし、より形式的な受動訳は脚注に示した。
- source_word: ἐπὶ ἡμέρας πλείους
  choice: 何日にもわたって
  rationale: 対格を伴うἐπίが表す時間的継続を、日という単位を保ちながら自然に表現した。
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: 一緒に上った人々に
  rationale: 接頭辞συν-による同行の意味と、エルサレムへ「上る」という移動表現を保持した。
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: ガリラヤからエルサレムへ
  rationale: 出発地と目的地を明確かつ直接的に訳した。
- source_word: οἵτινες
  choice: その人々は
  rationale: 先行する同行者たちを改めて特定し、その人々こそ現在の証人であるというつながりが自然に伝わるようにした。
- source_word: νῦν εἰσὶ
  choice: 今、…となっている
  rationale: 過去の顕現と対照される現在の証人としての立場を表す。日本語として「今、…である」より自然な継続状態の表現を用いたが、変化そのものを強調する意図はない。
- source_word: μάρτυρες αὐτοῦ
  choice: この方の証人
  rationale: 属格が示す、彼に属し彼について証言する証人という関係を簡潔に保持した。
- source_word: πρὸς τὸν λαόν
  choice: 民に対して
  rationale: 証言が向けられる相手を示すπρόςの方向性を表現した。
- source_word: λαόν
  choice: 民
  rationale: 文脈上はイスラエルの民を指す可能性が高いが、原文自体は明示的に限定していないため、本文では解釈的な展開を避けた。
theological_decisions:
- issue: 復活後の顕現を表すὤφθηの解釈
  choice: 姿を現した
  alternative: 彼らに見られた
  rationale: 復活顕現の文脈における自然な語義を本文に採用しつつ、受動形を形式的に反映する訳も脚注に残して、表現上の幅を保持した。
- issue: 「民」の範囲
  choice: 民
  alternative: イスラエルの民
  rationale: 文脈はユダヤ人・イスラエルを強く示唆するが、λαόςそのものには明示的な限定語がないため、本文では一般形を保ち、文脈上の指示対象を脚注で説明した。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準語。「この方」で直前のイエスへの指示を保ち、「一緒に上った」でエルサレムへの旅の表現を自然に残した。脚注記号は関連語句の直後に配置した。
