  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: ja
  text: 一行はペルガからさらに進んで、ピシディアのアンティオキア[a]に着いた。そして安息日に会堂に入り、席に着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ピシディア地方のアンティオキア」。ギリシア語は直訳すると「ピシディアのアンティオキア」。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: 一行は
  rationale: 明示された代名詞を旅を共にする一行として自然に表し、δέによる物語の継続は文脈と「そして」で示した。強い対比を不必要に加えない。
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: ペルガからさらに進んで
  rationale: διέρχομαιが旅行記事で表す、ある地点から先へ進む動きを、自然な現代日本語で表した。
- source_word: παρεγένοντο
  choice: 着いた
  rationale: 旅行の文脈における「到着する」の意味を簡潔に表した。
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: ピシディアのアンティオキア
  rationale: 同名の町を地域名によって特定するギリシア語の表現を、日本語で明瞭に再現した。属格的な日本語表現が行政上の厳密な所属を意味するとは限らないため、別訳を脚注に示した。
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: 会堂に入り
  rationale: 分詞を主動詞と連続する動作として自然に訳した。συναγωγήはこの文脈ではユダヤ人の礼拝・集会の場所を指すため「会堂」とした。
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: 安息日に
  rationale: 複数形σαββάτωνを含む定型的な時間表現を、慣用的な単数の「安息日」で訳した。
- source_word: ἐκάθισαν
  choice: 席に着いた
  rationale: 座る動作を表すアオリストを、会堂内の場面に合う自然で品位ある日本語とした。
theological_decisions: []
