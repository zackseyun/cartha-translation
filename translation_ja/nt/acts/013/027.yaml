id: ACT.13.27
reference: Acts 13:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: ja
  text: エルサレムに住む人々とその指導者たちは、この方[a]を認めず、また、安息日ごとに朗読される預言者たちの声[b]を理解せず、この方を罪に定めることによって、それらの声を成就させたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この人」。ギリシア語には「この者／この方」に当たる指示代名詞があり、話者がイエスを明確に指し示している。
    reason: lexical_alternative
  - marker: b
    text: 「預言者たちの言葉」とも訳せる。直訳は「預言者たちの声」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλὴμ
  choice: エルサレムに住む人々
  rationale: 実質名詞として働く分詞を、現代日本語で自然かつ明瞭に表した。
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: その指導者たち
  rationale: エルサレムの民を治め、司法的判断にも関わった指導層を指す。文脈上、「支配者たち」より自然である。
- source_word: τοῦτον
  choice: この方
  rationale: 明示された指示代名詞の指示性を保ちつつ、イエスを指す日本語として品位ある表現にした。単なる「彼」よりギリシア語の強調が伝わる。
- source_word: ἀγνοήσαντες
  choice: 見分けることができず／理解しないまま
  rationale: この分詞は「この方」と「預言者たちの声」の双方を目的語に取ると理解した。人物については正体を認め損なう意味を「見分ける」で、預言については意味を悟らないことを「理解しない」で自然に表した。
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: 預言者たちの声
  rationale: φωνάςの比喩的で生き生きした表現を保持し、朗読を通して聞かれる預言者の証言を示した。
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: 安息日ごとに朗読される
  rationale: 会堂で公に読み上げられる継続的慣行を、簡潔で自然な日本語にした。
- source_word: κρίναντες
  choice: この方を罪に定めることによって
  rationale: ここでのκρίνωは一般的な判断ではなく、イエスに対する有罪宣告を指す。分詞と主動詞の手段的関係も保持した。
- source_word: ἐπλήρωσαν
  choice: 成就させた
  rationale: 預言が彼らの行為によって実現したことを示す、聖書文脈で明瞭な訳語である。
- source_word: γὰρ
  choice: （文脈上の説明関係として反映）
  rationale: 単独節として不自然な「というのは」を置かず、前節を説明する論理関係は文の説明的な調子に反映した。
theological_decisions:
- issue: イエスについての無知の性質
  choice: この方を見分けることができず
  alternative: この方を知らず
  rationale: イエスの存在自体を知らなかったという意味に限定せず、その正体を認識できなかったという文脈的緊張を保った。
- issue: ἀγνοήσαντεςの目的語の範囲
  choice: イエスと預言者たちの声の双方にかかる
  alternative: イエスだけにかかる
  rationale: ギリシア語ではτοῦτονとτὰς φωνὰςがκαίで結ばれ、同じ分詞の目的語となるのが自然である。彼らがイエスだけでなく、毎週読まれる預言の意味も悟らなかったことを訳文に明示した。
- issue: 預言の成就と人間の責任
  choice: 罪に定めることによって、その預言を成就させた
  alternative: 罪に定め、預言を成就させた
  rationale: 彼らの有罪宣告そのものが預言成就の手段となったという関係を示しつつ、その行為の責任と預言の成就をどちらも保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、説教中の説明としてふさわしい品位を保った。「この方」と「その預言」により日本語の指示関係を明確にし、原文の分詞構造は自然な従属表現へ組み替えた。
