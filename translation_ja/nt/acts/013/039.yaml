  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: ja
  text: この方によって、信じる者は皆、義と認められるのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この方にあって、信じる者は皆、義と認められるのです」。ギリシア語の表現は、直訳的には「この方において／この方によって」で、イエスを指します。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: この方によって
  rationale: 直前の文脈で語られているイエスを指す人称的・照応的な表現として理解した。「この方にあって」も可能だが、ここでは自然な現代日本語と手段的な含みを考慮して「この方によって」とした。
- source_word: πᾶς ὁ πιστεύων
  choice: 信じる者は皆
  rationale: 冠詞付き現在分詞の一般的・実名詞的な働きを、簡潔で自然な日本語にした。信仰の対象は文脈上明らかなため補わなかった。
- source_word: δικαιοῦται
  choice: 義と認められる
  rationale: δικαιόω の法廷的含意を保ちつつ、現代日本語で理解しやすい表現とした。「正しい者とされる」より簡潔で、「無罪とされる」ほど意味を狭めない。
theological_decisions:
- issue: ἐν τούτῳ の指示対象と用法
  choice: イエスを指す「この方によって」
  alternative: 「この方にあって」／「このことによって」
  rationale: 直前で罪の赦しがイエスを通して告げ知らされると述べられており、人を指す解釈が談話の流れに最も合う。ただし前置詞句には「この方にあって」という訳し方もあるため、脚注で示した。
- issue: パウロ的文脈における δικαιοῦται
  choice: 義と認められる
  alternative: 「正しい者とされる」／「無罪とされる」
  rationale: 律法との対照を含む文脈における法廷的意味を保持し、道徳的変化だけを意味するようには訳さなかった。同時に「無罪宣告」だけに意味を限定することも避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」でイエスへの敬意と指示対象の明確さを両立し、「義と認められる」で神学的・法廷的含意を保った。
