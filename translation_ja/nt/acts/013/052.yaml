id: ACT.13.52
reference: Acts 13:52
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵ ⸀τε μαθηταὶ ἐπληροῦντο χαρᾶς καὶ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: ja
  text: 弟子たちは喜びと聖霊に満たされ続けていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弟子たちは喜びと聖霊に満たされていた」。ギリシア語の未完了過去形は、継続的または反復的に満たされていたことを示し得る。
    reason: 時制・アスペクト上の別訳
lexical_decisions:
- source_word: οἵ τε μαθηταὶ
  choice: 弟子たちは
  rationale: τεは前の物語を受けて叙述を継続するが、日本語では文脈上、接続語を明示しない方が自然である。μαθηταίは定着した訳語「弟子たち」とした。
- source_word: ἐπληροῦντο
  choice: 満たされ続けていた
  rationale: 未完了過去・受動態が示す、過去における継続的または反復的な満たしを、自然な日本語で表した。
- source_word: χαρᾶς
  choice: 喜びと
  rationale: πληρόωに続く属格は満たす内容を表すため、「喜びに満たされる」と訳す。「聖霊」と並列されているので助詞「と」で結んだ。
- source_word: πνεύματος ἁγίου
  choice: 聖霊に
  rationale: 使徒言行録の文脈では、教会の宣教に働く神の聖霊を指す。日本語では冠詞を必要とせず、定着した「聖霊」とした。
theological_decisions:
- issue: πνεύματος ἁγίουを人格的な神の霊と取るか、非人格的な「聖なる霊」と取るか
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 使徒言行録における一貫した用法と直近の宣教文脈は、神の聖霊を指す読みを支持する。
- issue: 喜びと聖霊をともに「満たす内容」として並列するか
  choice: 喜びと聖霊に満たされる
  alternative: 喜びに満ち、聖霊に満たされる
  rationale: 原文はχαρᾶςとπνεύματος ἁγίουをκαίで結び、一つの動詞ἐπληροῦντοに従属させているため、その統語的な緊張を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「満たされ続けていた」により原文の未完了的な側面を可視化しつつ、脚注でより簡潔な訳の可能性も示した。
