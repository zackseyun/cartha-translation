  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: ja
  text: さて、兄弟たち[a]、今、私は、あなたがたが無知のうちにあのようなことをしたことを知っています。あなたがたの指導者たちも同様でした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兄弟姉妹の皆さん」。ギリシア語は「兄弟たち」だが、男女を含むより広い集まりへの代表的な呼びかけである可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: さて今
  rationale: καίのつながりとνῦνの時間的・談話的移行を、現代日本語で自然に示す。直前の告発から現在の訴えへの転換を保つ。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 呼格複数の字義を保った呼びかけ。文脈上、より広い男女の聴衆を代表的に指し得ることは脚注で示す。
- source_word: οἶδα
  choice: 私は知っています
  rationale: ペトロが知っていると明言する直接的な表現を保つ。日本語の語順では目的内容の後に置くのが自然である。
- source_word: κατὰ ἄγνοιαν
  choice: 無知のために
  rationale: 知識・理解の欠如が行為に関係していたことを表す一方、罪責が完全に免除されたとは含意しない。
- source_word: ἐπράξατε
  choice: あのようなことをした
  rationale: 動詞自体に明示的な目的語はないが、直前に述べられたイエスへの行為を自然に受ける。「あのようなこと」は内容を過度に限定しない。
- source_word: ὥσπερ καὶ
  choice: も同様でした
  rationale: 民衆だけでなく指導者たちも同じく無知のうちに行動したという比較と追加を、自然な日本語で表す。
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: あなたがたの指導者たち
  rationale: エルサレムの政治的・宗教的権威者を指す。日本語の「支配者」より文脈に自然で、権威ある指導層という意味を保つ。
theological_decisions:
- issue: 無知への言及が罪責を免除する表現になるか
  choice: 「無知のために」とし、無知が行為の一因であることを認めつつ、全面的な免責とはしない。
  alternative: 「知らずにした」「知らなかったのでした」
  rationale: この節は無知を認めるが、19節ではなお悔い改めを求める。無罪と断定することも、無知の要素を弱めることもせず、その緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「さて今」で談話の転換を示し、「あのようなこと」で前節までの行為を自然に受ける。
