id: ACT.3.25
reference: Acts 3:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: ja
  text: あなたがたは、預言者たちの子ら[a]であり、神があなたがたの先祖と結ばれた契約の子らです。神はアブラハムにこう言われました。「あなたの子孫[b]によって、地上のすべての氏族が祝福を受ける。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「息子たち」。ここでは、預言者の語った約束と、神が先祖たちと結ばれた契約を受け継ぐ者たちを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「種」。アブラハムの子孫を集合的に指すことができ、聖書の文脈では一人の代表者を指す含みも持ち得る。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: 子ら
  rationale: 原語の「息子たち」という比喩を保ちつつ、日本語では性別を必要以上に限定せず、預言者の約束と契約を受け継ぐ者という文脈上の意味を表す。
- source_word: προφητῶν
  choice: 預言者たちの
  rationale: 属格を素直に訳す。「預言者たちの子ら」は個々の預言者の実子ではなく、その約束を受け継ぐ者たちを指す。
- source_word: διαθήκης
  choice: 契約
  rationale: アブラハムと先祖たちへの約束という聖書的文脈に最も適した訳語。
- source_word: διέθετο
  choice: 結ばれた
  rationale: 契約を制定することを表す中動態を、現代日本語の自然な「契約を結ぶ」という表現で訳した。
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: あなたがたの先祖たちと
  rationale: 契約締結の相手を示す関係的な意味を自然な日本語で表す。「父祖」より一般読者に明瞭な「先祖」を選んだ。
- source_word: λέγων πρὸς Ἀβραάμ
  choice: 神はアブラハムにこう言われました
  rationale: 分詞構文の主語を明示し、引用へのつながりを自然な独立文として表した。
- source_word: σπέρματί
  choice: 子孫
  rationale: 「種」に由来し、集合的な子孫を指しながら単数の代表者を指す余地も残る語として、日本語で最も自然である。
- source_word: ἐνευλογηθήσονται
  choice: 祝福を受ける
  rationale: 未来受動の意味を明瞭な現代日本語で表す。日本語では引用内の未来も非過去形で自然に示される。
- source_word: πατριαὶ
  choice: 氏族
  rationale: 家系で結ばれた集団を表す語の意味を保つ。「民族」ほど広く解釈せず、「家族」より集団的な範囲を示す。
- source_word: γῆς
  choice: 地上
  rationale: アブラハムへの約束が持つ普遍的な範囲を示し、特定の「土地」に限定しない。
theological_decisions:
- issue: υἱοὶ の代表的男性表現
  choice: 子ら
  alternative: 息子たち／子どもたち
  rationale: 契約の相続者を表す「子」という比喩を保持する。「息子たち」では現代日本語で男性だけに限定されやすく、「子どもたち」では幼さが前面に出るため、「子ら」とし、原語の形と含意を注で示す。
- issue: σπέρμα が持つ集合的・単数代表的な含み
  choice: 子孫
  alternative: 種／一人の子孫
  rationale: アブラハムの子孫全体を指し得ると同時に、一人の代表者を指す可能性も排除しない。「一人の子孫」は単数に決めすぎ、「種」は現代日本語では不自然である。
- issue: ἐν τῷ σπέρματί σου の関係
  choice: あなたの子孫によって
  alternative: あなたの子孫において／あなたの子孫のうちに
  rationale: 祝福がアブラハムの子孫を媒介として諸氏族に及ぶ意味を自然な日本語で示す。「において」は形式的には近いが、一般読者には不自然で意味が不明瞭になりやすい。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「契約の子ら」という原文の比喩は保持し、誤解しやすい点を脚注で補った。引用は自然な直接話法とし、旧約の約束としての荘重さを残した。
