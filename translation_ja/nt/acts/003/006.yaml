source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: ja
  text: しかし、ペトロは言った。「銀も金も、私にはない。だが、私が持っているもの、それをあなたに与える。ナザレ人イエス・メシア[a]の名によって、歩きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・キリスト」とも訳せる。ギリシア語の「クリストス」は「メシア」を意味する称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: 銀や金
  rationale: 原文が明示する二つの金属を保ちつつ、日本語で財貨全般を表す自然な並列表現とした。
- source_word: οὐχ ὑπάρχει μοι
  choice: 私にはない
  rationale: 所有を表すギリシア語の構文を、簡潔で自然な現代日本語にした。
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: だが、私にあるものをあなたにあげよう
  rationale: 欠如との対照と τοῦτο の指示的な強調を日本語の語順で自然に表した。
- source_word: ἐν τῷ ὀνόματι
  choice: 名によって
  rationale: 名に伴う権威・力の含意を保ち、文脈に適した自然な日本語とした。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστός を称号として訳し、その意味を明示した。日本語では固有名と称号のまとまりを中黒で示した。
- source_word: τοῦ Ναζωραίου
  choice: ナザレ人
  rationale: 出身地との関連を示す形容的呼称を、現代日本語で簡潔かつ通例的に表した。
- source_word: περιπάτει
  choice: 歩きなさい
  rationale: 現在命令形の直接的な命令を、過度に開始相を補わずに訳した。
theological_decisions:
- issue: 名の定型句における Χριστοῦ の訳
  choice: メシア
  alternative: キリスト
  rationale: この癒やしの宣言では称号としての意味が明瞭なため「メシア」とし、伝統的な音訳「キリスト」は脚注に残した。
- issue: ἐν τῷ ὀνόματι の権威的含意
  choice: 名によって
  alternative: 権威によって
  rationale: 原文の神学的な表現を保持し、権威だけに意味を限定しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。直接話法の力強さを保ち、古風すぎる言い回しは避けた。
