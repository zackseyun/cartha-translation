  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: ja
  text: ペテロとヨハネは、祈りの時刻、すなわち第九時[a]に、神殿へ上って行っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 現在の時刻では、午後三時ごろ。
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: （訳出せず）
  rationale: ここでは物語を穏やかに進める接続辞であり、日本語で「さて」「しかし」などを明示すると意味を強めすぎるため、文脈上自然に省いた。
- source_word: ἀνέβαινον
  choice: 上って行くところだった
  rationale: 未完了過去の進行的な側面を表しつつ、神殿へ向かうことを示す「上る」の方向性も保った。
- source_word: εἰς τὸ ἱερὸν
  choice: 神殿へ
  rationale: ἱερόνは内陣だけでなく神殿境内を指し得るが、本文では簡潔で一般的な「神殿」とした。
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: 祈りの時刻である…に
  rationale: 定められた祈りの時刻との時間的関係を、現代日本語として明瞭に表した。
- source_word: τὴν ἐνάτην
  choice: 第九時
  rationale: 当時の時刻表現を本文に保持し、現代の時刻への換算は脚注に置いた。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、「第九時」という原文の文化的表現を保持した。「神殿」は一般読者に分かりやすい語とし、必要以上に「境内」と限定しなかった。
