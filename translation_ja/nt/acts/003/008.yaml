id: ACT.3.8
reference: Acts 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: ja
  text: そして彼は躍り上がって立ち、歩き始めた。それから二人と一緒に神殿の境内に入り、歩いたり跳びはねたりしながら、神を賛美していた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: 躍り上がって
  rationale: 立ち上がる際の勢いある跳躍を表す分詞。直後の「立ち」と自然につながり、癒やされた人の即座の身体反応を保つ。
- source_word: τὸ ἱερόν
  choice: 神殿の境内
  rationale: ここでの ἱερόν は聖所建物そのものではなく、出入り可能な神殿域全体を指すため。
- source_word: ἁλλόμενος
  choice: 跳びはねたり
  rationale: 歩行と並べられた反復的な跳躍を自然な現代日本語で表し、先の「躍り上がって」との語義上のつながりも残す。
- source_word: αἰνῶν τὸν θεόν
  choice: 神を賛美していた
  rationale: 未完了的な一連の動作を表す分詞列に合わせ、継続する賛美として訳す。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語を用いた。「彼」は直前の文脈の人物を指し、「二人」は複数代名詞 αὐτοῖς がペトロとヨハネを指すことを日本語で明瞭にした。動作の喜びと勢いを保ちつつ、過度に口語的な表現は避けた。
