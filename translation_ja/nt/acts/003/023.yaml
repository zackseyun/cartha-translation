  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: ja
  text: そして、あの預言者に聞き従わない者はみな、民の中から完全に滅ぼされる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民の中から断たれる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: 者はみな
  rationale: 直訳は「すべての魂」だが、この慣用では一人ひとりの人を指す。日本語では「者はみな」とすることで、人間を霊肉に分ける含意を持ち込まず、自然に全称性を表せる。
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: 聞き従わない
  rationale: 不定関係節で「だれであれ～しない者」を表す。ἀκούω は単に音声を聞くことだけでなく、応答して従うことを含み得る。契約的な引用文脈に合う「聞き従う」を用いた。
- source_word: τοῦ προφήτου ἐκείνου
  choice: あの預言者
  rationale: 直前に語られたモーセのような預言者を指す特定表現。「預言者」を固有の称号とはせず、指示語によって特定性を保った。
- source_word: ἐξολεθρευθήσεται
  choice: 完全に滅ぼされる
  rationale: 未来受動形で、徹底した除去・滅亡という強い意味を持つ。「完全に滅ぼされる」はその強さを保つ。「断ち滅ぼされる」も背景となる聖書的表現を反映するため脚注に示す。
- source_word: ἐκ τοῦ λαοῦ
  choice: 民の中から
  rationale: ἐκ は民の内部から取り除かれることを示す。「民の中から」は共同体からの除去という空間的・共同体的含意を自然に保つ。原文にない所有表現は補わない。
theological_decisions:
- issue: 申命記18章を背景とする警告における裁きの性質
  choice: 「完全に滅ぼされる」として、厳しい滅亡・除去を表しつつ、その時期や様態は限定しない。
  alternative: 契約共同体からの除名、または終末の最終的な神の裁きと明示する。
  rationale: 本文は預言者に聞き従わない者への厳しい裁きを明言するが、それが一時的、契約的、終末的のいずれであるかを完全には定義していない。翻訳では動詞の強さと「民の中から」という共同体的表現をともに保ち、特定の教理体系に狭めない。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「聞き従う」により応答を伴う聴取を表し、「完全に滅ぼされる」で原語の強さを保持した。脚注標識 [a] は本文中に配置した。
