  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: ja
  text: しかし、あなたがたは聖なる正しい方を拒み、殺人者を自分たちに与えるよう[a]願ったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈を明示すれば、「あなたがたに釈放するよう」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: しかし、あなたがたは
  rationale: δέの対照を「しかし」で表し、明示されたὑμεῖςの直接的な強調を「あなたがたは」で保った。
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: 聖なる正しい方
  rationale: 定冠詞を伴う二つの形容詞が一人の人物を指す名詞的表現であるため、「方」を補い、イエスを指す称号的な響きを保った。
- source_word: ἠρνήσασθε
  choice: 拒み
  rationale: ἀρνέομαιは「否認する」「拒絶する」「関係を認めない」の意を持つ。ここでは、ピラトの前でイエスを退けた行為を自然な日本語で表す「拒む」とした。
- source_word: ᾐτήσασθε
  choice: 願った
  rationale: αἰτέωの「求める、願う」という意味を表し、後続の不定詞と自然につながる形にした。
- source_word: ἄνδρα φονέα
  choice: 人殺しの男
  rationale: ἄνδραとφονέαの双方を明示し、聖なる正しい方との意図的な対照を保った。
- source_word: χαρισθῆναι ὑμῖν
  choice: 自分たちに与えるよう
  rationale: χαρίζομαιの受動不定詞が持つ「好意として与える、認める」の広い語義に近く訳した。司法的文脈での具体的意味は脚注に示した。
theological_decisions:
- issue: 「聖なる正しい方」のキリスト論的な力
  choice: イエスを指す称号的な一まとまりの表現として訳す
  alternative: 単に「聖く正しい人」と描写的に訳す
  rationale: ギリシア語では定冠詞を伴う二形容詞が名詞的に用いられ、一人の人物を指している。「方」によってその力を示しつつ、本文以上の教理的説明は加えない。
- issue: χαρισθῆναιの司法的含意
  choice: 本文では広い語義に沿って「与えるよう」とする
  alternative: 文脈を明示して「釈放するよう」とする
  rationale: 動詞自体は「好意として与える、許す」という広い意味を持つが、この場面ではバラバの釈放を指す。そのため本文は原語に近くし、具体的含意を脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準語を用いた。「人殺しの男」はやや強いが、ἄνδρα φονέαの二語を反映し、イエスとの鋭い対照を保持する。脚注記号は節末に置き、直前の「与える」の文脈的意味を説明する。
