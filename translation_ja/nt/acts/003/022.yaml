id: ACT.3.22
reference: Acts 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: ja
  text: モーセは確かにこう言いました。「主なる神[b]は、あなたがたの兄弟の中から[a]、私のような預言者をあなたがたのために立ててくださる。その人があなたがたに語ることは、何であれ、すべて聞き従いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの同胞であるイスラエル人の中から」とも訳せる。ギリシア語は男性親族語である「兄弟」を、契約共同体の同胞を代表する意味で用いている。
    reason: lexical_alternative
  - marker: b
    text: ここで使徒言行録は申命記18章15節を一部異なる語句で引用している。特に、この節のギリシア語は「主なる神」としており、「あなたがたの神、主」とはしていない。
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語で定着している人名表記。
- source_word: μὲν
  choice: 確かに
  rationale: 談話を進めつつモーセの発言を際立たせる小辞の働きを、過度に重くならない形で表した。
- source_word: εἶπεν ὅτι
  choice: こう言いました。「…」
  rationale: 引用導入句を、明瞭で自然な日本語の直接話法とした。
- source_word: Προφήτην
  choice: 預言者
  rationale: 冠詞のない名詞であり、固有の称号「かの預言者」とはせず、申命記への言及が持つ意義も損なわない表現とした。
- source_word: ἀναστήσει
  choice: 立ててくださる
  rationale: ここでは第一義的に、神が預言者を起こし任命することを表す。「復活させる」と限定せず、申命記の引用との語義的つながりを保った。
- source_word: κύριος ὁ θεὸς
  choice: 主なる神
  rationale: 二つの語を自然な日本語で結び、使徒言行録本文にない「あなたがたの」を補わなかった。
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: あなたがたの兄弟の中から
  rationale: ἐκの『中から』と、男性複数の親族語ἀδελφῶνを保持した。文脈上は同胞イスラエル人を指す。
- source_word: ὡς ἐμέ
  choice: 私のような
  rationale: モーセと来るべき預言者との比較をそのまま表した。
- source_word: αὐτοῦ ἀκούσεσθε
  choice: その人が…語ることは…聞き従いなさい
  rationale: 未来形が引用文中で帯びる命令的・契約的な力を表し、単に音声を聞くのでなく従順に耳を傾ける意味を明確にした。
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: あなたがたに語ることは、何であれ、すべて
  rationale: κατὰ πάνταと不定関係節の包括性を、明快で自然な現代日本語で保持した。
theological_decisions:
- issue: 申命記18章の引用とメシア的同定
  choice: 本文では「預言者」と訳し、「メシア」や称号としての「かの預言者」を補わない。
  alternative: 「かの預言者」または「メシアである預言者」と解釈的に訳す。
  rationale: ペトロは文脈上この言葉をイエスに適用するが、この節のギリシア語自体は「預言者」と述べているため、その緊張を保った。
- issue: ἀδελφῶνの範囲
  choice: 「兄弟」とし、同胞イスラエル人という代表的・契約共同体的意味を脚注で示す。
  alternative: 本文で「同胞のイスラエル人」と意訳する。
  rationale: 原文の男性親族語を保持しながら、文脈上の民族的範囲を誤解されないよう脚注で明らかにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書引用としての品位を保った。「立ててくださる」は神を主語とする自然な敬意表現であり、「聞き従いなさい」はἀκούωの服従を伴う意味を明確にする。脚注記号は説明対象の直後に配置した。
