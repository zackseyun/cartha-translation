  text: καὶ εἶδεν ⸂πᾶς ὁ λαὸς αὐτὸν⸃ περιπατοῦντα καὶ αἰνοῦντα τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: ja
  text: 民は皆、その人が歩きながら神を賛美しているのを見た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: （文脈上、独立した接続語としては訳出しない）
  rationale: 前後の出来事を結ぶ標準的な接続詞。日本語では文頭の「そして」を置かなくても自然に物語の連続性が伝わるため、明示しない。
- source_word: εἶδεν
  choice: 見た
  rationale: 癒やされた人の姿と行動を民が目にしたことを、簡潔で自然に表す。
- source_word: πᾶς ὁ λαὸς
  choice: 民は皆
  rationale: 単なる群衆ではなく、集合体としての人々を指す λαός の語感を「民」で保ち、πᾶς の全体性を「皆」で表す。
- source_word: αὐτὸν
  choice: その人が……しているのを
  rationale: 前節までに登場した癒やされた人を指す。日本語では知覚構文として「その人が〜しているのを見た」とするのが自然。
- source_word: περιπατοῦντα
  choice: 歩きながら
  rationale: 現在分詞が示す、目撃時に進行していた歩行を表す。癒やしの結果である歩行を明確に保つ。
- source_word: καὶ αἰνοῦντα
  choice: 神を賛美している
  rationale: 二つの現在分詞は並列だが、日本語では「歩きながら神を賛美している」とすると、同時に目撃された二つの動作を自然に表せる。
- source_word: τὸν θεόν
  choice: 神を
  rationale: 賛美の対象を明確にする、現代標準日本語の自然な表現。
theological_decisions: []
