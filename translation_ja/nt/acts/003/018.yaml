id: ACT.3.18
reference: Acts 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: ja
  text: しかし神は、ご自分のメシア[b]が苦しみを受けることを、すべての預言者の口を通して[a]あらかじめ告げておられ、それをこのようにして実現された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての預言者を通して」。ギリシア語は直訳すると「すべての預言者の口を通して」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「ご自分のキリスト」。ここでは Χριστός が称号として用いられているため「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節で述べられた人々の行為と、神がそれを通して預言を実現されたこととの対照を自然に示す。
- source_word: προκατήγγειλεν
  choice: あらかじめ告げておられ
  rationale: προ-の時間的な先行性と、καταγγέλλωの公に告げる意味の双方を明確に伝える。
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: すべての預言者の口を通して
  rationale: 『口を通して』という聖書的な具体表現を保ちつつ、神が預言者たちを介して語ったことが現代日本語でも理解できる形にした。
- source_word: παθεῖν
  choice: 苦しみを受けること
  rationale: 不定詞が事前に告げられた内容を表すことを自然な日本語にした。原文だけでは明示されない必然性を『苦しまなければならない』として加えていない。
- source_word: τὸν χριστὸν αὐτοῦ
  choice: ご自分のメシア
  rationale: Χριστόςはここでは称号として機能しているため『メシア』とした。αὐτοῦは神に属し、神によって立てられたメシアであることを示す所有表現として訳した。
- source_word: ἐπλήρωσεν
  choice: 実現された
  rationale: 神が預言として告げた事柄を現実の出来事として成就したという意味を、一般の読者にも明瞭な現代日本語で表す。
- source_word: οὕτως
  choice: このようにして
  rationale: 直前までに述べられた出来事を指し、それが神の予告を実現する仕方であったことを示す語順と表現にした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト／油を注がれた方
  rationale: この箇所では固有名のようにではなく、神に立てられた者を指す称号として用いられている。ペトロの語りのユダヤ的・預言的文脈を保つため『メシア』とした。
- issue: παθεῖνに含まれる様態
  choice: メシアが苦しみを受けること
  alternative: メシアが苦しまなければならないこと
  rationale: この不定詞は預言の内容を示すが、それ自体で義務や必然を明示してはいないため、神学的必然性を訳文で過度に補わない。
- issue: οὕτωςが示す関係
  choice: それをこのようにして実現された
  alternative: こうして実現された
  rationale: 神が人々の行為を是認したと断定するのではなく、直前に述べられたメシアの苦難を通して、あらかじめ告げた事柄が実現したという原文の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、『預言者の口を通して』という原文の聖書的比喩は保持した。神を主語とする動詞には敬意を示す自然な表現を用い、全体を簡潔で朗読しやすい一文に整えた。
