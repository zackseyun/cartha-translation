base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: ja
  text: ペテロはヨハネとともに、その人をじっと見つめて言った。「私たちを見なさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: じっと見つめて
  rationale: 単に見るのではなく、注意を集中して見つめる動作を表す。日本語として自然な連用表現にした。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは物語を緩やかに進める接続辞であり、日本語では訳出しないほうが自然で、強い対比も生じない。
- source_word: σὺν τῷ Ἰωάννῃ
  choice: ヨハネとともに
  rationale: σύν＋与格が示す同伴を明確に表し、ヨハネもその場で行動を共にしていることを保つ。
- source_word: εἶπεν
  choice: 言った
  rationale: この文脈における通常の発話を、明快で自然な現代日本語で表す。
- source_word: Βλέψον
  choice: 見なさい
  rationale: 相手に自分たちへ注意を向けるよう求める直接的な命令を、自然で過度に荒くない日本語で表す。
- source_word: εἰς ἡμᾶς
  choice: 私たちを
  rationale: 見る対象を示す εἰς を、日本語の「見る」が通常取る目的格で自然に表現する。
- source_word: εἰς αὐτόν
  choice: その人を
  rationale: ἀτενίζω の集中した視線の対象を示す。直前の文脈で示された男性を指すため、「その人」とした。
