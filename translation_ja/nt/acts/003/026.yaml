id: ACT.3.26
reference: Acts 3:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: ja
  text: 神は、まずあなたがたのために、ご自分のしもべ[a]を起こして[b]、その方を遣わされました。それは、あなたがた一人ひとりをあなたがた自身の悪い行いから立ち返らせることによって、あなたがたを祝福するためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分の子」。ギリシア語のπαῖςは「しもべ」と「子」のどちらも意味しうるが、ここではイザヤ書の「主のしもべ」が背景にあると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「起こして」は、死者の中から復活させたことを指すとも、しもべとして立てた、または世に現れさせたことを指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: まずあなたがたのために
  rationale: 与格が示す受益・方向性と、ユダヤ人聴衆への救済史上の優先を、自然な日本語で表した。
- source_word: ἀναστήσας
  choice: 起こし
  rationale: 死者の中から復活させる意味と、神がしもべを立てる・出現させる意味の双方を排除せず、原文の含みを保つ。
- source_word: τὸν παῖδα αὐτοῦ
  choice: ご自分のしもべ
  rationale: παῖςには「子」の意味もあるが、使徒言行録の文脈とイザヤ書の「主のしもべ」を背景に、「しもべ」が最も適切である。
- source_word: ἀπέστειλεν αὐτόν
  choice: その方を遣わされました
  rationale: 神による派遣を明確にしつつ、敬意ある現代日本語にした。
- source_word: εὐλογοῦντα ὑμᾶς
  choice: あなたがたを祝福するためでした
  rationale: 分詞を派遣の目的・結果として自然な日本語にし、祝福が聴衆に向けられていることを保った。
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: あなたがた一人ひとりを…立ち返らせることによって
  rationale: ἐν＋冠詞付き不定詞の手段の意味と、ἕκαστονの個別的・分配的な力を明示した。
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: 悪い行いから
  rationale: 複数形のπονηρίαιが示す具体的な悪の現れを、過度に硬くならない現代日本語で表した。文脈上、それが聴衆自身の行いであることは「あなたがた一人ひとり」によって明らかである。
theological_decisions:
- issue: ἀναστήσαςが復活を指すのか、しもべを立てることを指すのか
  choice: 本文では「起こし」とし、意味を限定しない
  alternative: 「死者の中から復活させ」「立てて／お立てになり」
  rationale: この語はイエスの復活を響かせうる一方、約束された預言者・しもべを神が立てるという文脈も持つ。どちらか一方に限定せず、原文の神学的緊張を保った。
- issue: παῖςのキリスト論的な含み
  choice: しもべ
  alternative: 子
  rationale: イザヤ書の「主のしもべ」の背景を保ち、この節で用いられていない「御子」という明示的な父子関係の表現を持ち込まないため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「しもべ」は日常語では古風だが、聖書におけるイザヤ書との連関を保つため採用した。神を主語とする「遣わされました」は尊敬表現であり、過度に文語的にならない形に整えた。
