review_pass:
  verdict: revise
  source_fidelity: 'δέξασθαι has heaven as its active subject: heaven must receive him. The draft''s passive 「天に受け入れられて」 reverses that grammatical relationship. The revision makes 天 the explicit subject while retaining the divine necessity of δεῖ and the temporal limit ἄχρι χρόνων. 「すべてのものの回復」 retains the inclusive and deliberately unspecified scope of ἀποκαταστάσεως πάντων. The relative clause is retained in a form consistent with the English POB audit trail, without resolving the debated syntactic nuance beyond the source wording.'
  naturalness: 「天は、この方を…受け入れていなければなりません」 is clear, idiomatic modern Japanese and more accurately expresses the Greek construction than the passive phrasing. 「ご自分の聖なる預言者たち」 naturally renders αὐτοῦ while maintaining the reverent but nonsectarian register.
  terminology: 「回復」 appropriately renders ἀποκατάστασις without imposing a doctrinal account of its extent. 「聖なる預言者たち」 and 「口を通して」 accurately preserve the source’s wording and register.
  issues:
  - severity: medium
    issue: 「天に受け入れられていなければなりません」は受動表現である。
    rationale: 原文では οὐρανός（天）がδέξασθαι（受け入れる）の意味上・文法上の主語であり、この方が天を受け入れる側ではなく、天がこの方を受け入れる側である。受動形はこの関係を曖昧にし、構文上の忠実さを損なう。
  - severity: low
    issue: αὐτοῦ（彼の／ご自分の）が本文に明示されていない。
    rationale: 日本語では省略も可能だが、「ご自分の」を補うことで、神に属する預言者という原文の限定を明瞭に保てる。
  revised_text: 天は、この方を、神が昔からご自分の聖なる預言者たちの口を通して語られた、すべてのものの回復の時まで、受け入れていなければなりません。
