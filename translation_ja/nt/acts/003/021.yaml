revisions:
- from: この方は、神が昔から聖なる預言者たちの口を通して語られた、すべてのものが回復される時まで、天に受け入れられていなければなりません。
  to: 天は、この方を、神が昔からご自分の聖なる預言者たちの口を通して語られた、すべてのものの回復の時まで、受け入れていなければなりません。
  rationale: 天を能動的な主語として明示して、δεῖ οὐρανὸν … δέξασθαι の構文と意味を回復した。回復の範囲および関係節の解釈上の余地は、本文に教義的説明を加えず保持している。
  reviewer_model: gpt-5.6-terra
