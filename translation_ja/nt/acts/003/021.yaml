id: ACT.3.21
reference: Acts 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: ja
  text: 天は、この方を、神が昔からご自分の聖なる預言者たちの口を通して語られた、すべてのものの回復の時まで、受け入れていなければなりません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: この方は
  rationale: 直前のイエスを受ける関係代名詞。日本語では文脈上の指示を明示し、敬意ある「この方」とした。
- source_word: δεῖ ... δέξασθαι
  choice: 受け入れられていなければなりません
  rationale: δεῖの必然性と、天を意味上の主語とするδέξασθαιを保つ。「とどめておく」など原文にない拘束の含意は加えない。
- source_word: ἄχρι χρόνων
  choice: 時まで
  rationale: 複数形χρόνωνは回復に定められた時期・時代を表すが、日本語では自然な集合的表現「時」とした。
- source_word: ἀποκαταστάσεως πάντων
  choice: すべてのものが回復される
  rationale: ἀποκατάστασιςの回復・復興の意味とπάντωνの広がりを保つ。何がどの範囲で回復されるかは限定しない。
- source_word: διὰ στόματος
  choice: 口を通して
  rationale: 預言者を神の発言の媒介とする原文の慣用表現を保持した。
- source_word: ἀπ’ αἰῶνος
  choice: 昔から
  rationale: はるか以前からという時間的意味を、現代日本語で明瞭かつ簡潔に表す。
theological_decisions:
- issue: 「すべてのものの回復」の範囲
  choice: すべてのものが回復される
  alternative: 万物が元どおりになる
  rationale: 原文の包括的な表現を保ちながら、その範囲を普遍的救済や宇宙的刷新など特定の教義に限定しない。「元どおり」は以前の状態への単純な復帰を強く示し得るため避けた。
- issue: 関係節 ὧν の係り方
  choice: 神が…語られた、すべてのものが回復される時
  alternative: 神が…語られたことについて、すべてのものが回復される時
  rationale: 属格関係代名詞ὧνをπάντωνに直接結び付ける本文の形を優先し、英語POBの監査済み判断とも整合させた。ただしギリシア語には「それらについて」と理解する余地もある。
- issue: 天がキリストを受け入れる期間
  choice: 天に受け入れられていなければなりません
  alternative: 天はこの方を受け入れていなければなりません
  rationale: 天を擬人化した原文構造を日本語で自然に表し、神的必然性を維持する。キリストが天に拘束されるという含意は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説教調や教派固有の用語を避けた。敬体で品位を保ちつつ、「回復」の神学的な広がりと関係節の緊張を過度に説明的な本文で解消しないようにした。
