source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: ja
  text: 人々は、彼が施しを求めて神殿[a]の「美しい門」のところに座っていたあの人だと分かった。そして、彼の身に起こったことに、驚きと驚愕で満たされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」に当たるギリシア語は、内陣そのものではなく、境内を含む神殿施設全体を指す語です。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: 見覚えており、…と分かった
  rationale: 未完了過去の継続的な認知と、文脈上の身元確認を自然な日本語で表した。
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: 施しを求めて…いつも座っていた人
  rationale: 冠詞付き分詞の人物描写と、以前からの習慣的な行為を明示した。
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ
  choice: 神殿の「美しい門」のところに
  rationale: 門の名称としてのὩραίαを引用符で示し、ἱερόνは境内を含む神殿施設を指し得ることを注で補った。
- source_word: θάμβους καὶ ἐκστάσεως
  choice: 驚きと茫然自失の思い
  rationale: 二語を同義に平板化せず、θάμβοςの驚嘆とἔκστασιςの我を失うほどの衝撃を区別した。
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: 彼の身に起こったことに
  rationale: 完了分詞が示す、起こって現在も結果が明白な出来事を簡潔に表した。
