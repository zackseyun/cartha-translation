revisions:
- from: 人々は彼を見覚えており、この人こそ、施しを求めて神殿の「美しい門」のところにいつも座っていた人だと分かった。そして、彼の身に起こったことに、驚きと茫然自失の思いで満たされた。[a]
  to: 人々は、彼が施しを求めて神殿[a]の「美しい門」のところに座っていたあの人だと分かった。そして、彼の身に起こったことに、驚きと驚愕で満たされた。
  rationale: 認知表現を一つにまとめて、群衆が癒やされた人物を、門のそばで施しを求めていた既知の人として確認したことを明瞭にしました。「いつも」を除いて原文が明示しない頻度を避け、「驚きと驚愕」でθάμβοςとἔκστασιςの重なりつつ異なる強さを自然に表しました。脚注内容は適切なので、アンカーのみ該当語へ移しました。
