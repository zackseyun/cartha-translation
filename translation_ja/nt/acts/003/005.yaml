  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: ja
  text: そこで、その人は、二人から何かを受け取ることを期待して、二人にじっと注意を向けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人をじっと見つめた」。
    reason: ἐπεῖχενはこの文脈で、相手に注意を向けること、または注視することを表し得るため。
lexical_decisions:
- source_word: ὁ δὲ
  choice: そこで、その人は
  rationale: δέは物語を穏やかに進める接続語であり、直前の命令を受けた反応として「そこで」が自然である。ὁは足の不自由な男性を指すため、明確さを考慮して「その人」とした。
- source_word: ἐπεῖχεν
  choice: じっと…注意を向けた
  rationale: ここでは相手に注意を向ける意味である。未完了過去が示す持続的な注視・注意を「じっと」で表した。単に見る動作だけに限定しない訳である。
- source_word: αὐτοῖς
  choice: 二人に
  rationale: 指示対象はペトロとヨハネである。日本語では文脈を明確にするため「彼らに」ではなく「二人に」とした。
- source_word: προσδοκῶν
  choice: 期待して
  rationale: 何かを受け取れるとの予期を伴って注意を向けたことを表す現在分詞であり、「期待して」が自然である。
- source_word: τι
  choice: 何か
  rationale: 受け取る物を特定しない不定代名詞として、その非特定性を保った。文脈上は施しが想定されるが、本文には補わなかった。
- source_word: παρ’ αὐτῶν
  choice: 二人から
  rationale: 属格を伴うπαράは受け取る物の出所を示すため、「二人から」とした。
- source_word: λαβεῖν
  choice: もらえるものと
  rationale: 施しを受ける場面に即して、λαβεῖνの受領の意味を自然な現代日本語で表した。「受け取ることを」より平明である。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、物語文としての品位を保った。「何か」を残して原文の非特定性を維持し、施しという解釈を本文に明示的には加えていない。
