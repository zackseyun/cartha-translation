id: ACT.3.2
reference: Acts 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: ja
  text: そして、生まれつき足の不自由なある男が、運ばれていた。人々は毎日、神殿の境内に入る人たちから施しを求めるために、この男を「美しい」と呼ばれる神殿の門のところに置いていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」と訳したギリシア語は、内陣だけでなく、庭や回廊を含む神殿の境内全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: 男
  rationale: 不定だが特定の人物を物語に導入する表現。日本語では「ある男」も可能だが、文脈上「男」で自然にその機能を果たす。
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: 生まれつき足の不自由な
  rationale: 字義的には「母の胎から足の不自由な者であった」。日本語では「生まれつき」が意味を明確に伝え、現代的で尊重ある表現として「足の不自由な」を用いた。
- source_word: ἐβαστάζετο
  choice: 運ばれて来た
  rationale: 未完了過去の受動形。場面への導入として進行中の動作を自然に表し、次の習慣的行為にもつながる。
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: 人々は毎日……置き
  rationale: 複数主語の未完了過去が示す反復・習慣を「毎日」と「置き」で自然に表した。
- source_word: θύραν τοῦ ἱεροῦ
  choice: 神殿の門
  rationale: 公共の建築物の出入口なので θύρα は「門」。ἱερόν は神殿建物だけでなく境内を含む神殿域を指す。
- source_word: τὴν λεγομένην Ὡραίαν
  choice: 「美しい」と呼ばれる
  rationale: 門の名称を示す形容詞を字義に沿って訳し、その名称性を引用符で明示した。
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: 施しを求めさせていた
  rationale: 目的を表す不定詞を、男をそこに置いた人々との関係が自然に伝わる使役表現にした。「施し」は当時の貧者への金品の贈与を簡潔に表す。
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: 神殿の境内に入る人たちに
  rationale: παρά＋属格の求める相手を日本語の「に」で表現し、二度目の ἱερόν は内陣ではなく神殿域であることが明確になるよう「神殿の境内」とした。
theological_decisions: []
