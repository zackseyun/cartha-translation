  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: ja
  text: ですから、あなたがたの罪がぬぐい去られるように、悔い改め、立ち返りなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「消し去られる」。
    reason: ἐξαλείφωが持つ、書かれたものや汚れをぬぐって除く比喩を示す語彙上の別訳。
lexical_decisions:
- source_word: μετανοήσατε
  choice: 悔い改めて
  rationale: 決定的な応答を求めるアオリスト能動命令形。単なる考えの変更に狭めず、道徳的・契約的な重みを保つ、日本語として定着した表現を選んだ。
- source_word: οὖν
  choice: ですから
  rationale: 直前の論証から導かれる結論を、明瞭で自然な現代日本語で示す。
- source_word: ἐπιστρέψατε
  choice: 立ち返りなさい
  rationale: μετανοήσατεと並ぶアオリスト能動命令形。受動的に響く「回心させられなさい」を避け、神への回帰を示唆する方向性を保ちつつ、原文に明記されていない目的語「神」を本文へ補わない。
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: そうすれば……消し去られます
  rationale: 冠詞付き不定詞を伴うπρόςが示す目的・結果のつながりを、自然な日本語で表した。目的と結果の境界を過度に教理化せず、命令への応答と罪の除去との密接な関係を保つ。
- source_word: ἐξαλειφθῆναι
  choice: 消し去られます
  rationale: ἐξαλείφωの受動不定詞が持つ、記録や汚れをぬぐって除く比喩を、分かりやすい現代日本語で表す。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 複数形だが、日本語では集合的に「あなたがたの罪」とするのが自然で、個々の罪過を含む広い意味も保てる。
theological_decisions:
- issue: 悔い改め・立ち返りと罪の除去との関係
  choice: 「そうすれば、あなたがたの罪は消し去られます」とし、命令への応答と罪の除去との目的・結果の結びつきを示す。
  alternative: 「あなたがたの罪が消し去られるために」として、目的を前面に出す。
  rationale: この節は悔い改めと立ち返りを、罪が除かれることに結びつけるが、救いの秩序や因果の仕組みを詳述してはいない。そのため、関係を保ちながら特定の教派的体系を読み込まない。
- issue: 立ち返る相手の明示
  choice: 原文に目的語がないため、「神に」を本文には補わない。
  alternative: 文脈上の方向を明確にするため「神に立ち返りなさい」とする。
  rationale: 神への立ち返りは文脈上自然だが、原文の省略を保持し、翻訳上の補足によって曖昧さを狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「悔い改める」「立ち返る」は聖書語として定着しているが、一般読者にも理解可能である。原文の一文を日本語では二文に分け、論理関係を「そうすれば」で明示した。
