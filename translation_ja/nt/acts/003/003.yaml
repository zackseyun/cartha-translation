  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: ja
  text: この人は、ペテロとヨハネが神殿[a]に入ろうとしているのを見て、施しを求めていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、神殿の建物内部の聖所だけでなく、境内を含む神殿域全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: この人は
  rationale: 前節の、生まれつき足の不自由な人を受ける関係代名詞。単独の節として自然につながるよう「この人は」とした。
- source_word: ἰδὼν
  choice: 見て
  rationale: アオリスト分詞が示す時間的な関係を、自然な日本語の接続表現で示した。
- source_word: Πέτρον καὶ Ἰωάννην
  choice: ペテロとヨハネ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: μέλλοντας εἰσιέναι
  choice: 入ろうとしている
  rationale: μέλλωと不定詞が表す、まさに入ろうとしていたという切迫した動作を自然に表した。意図だけに限定しない。
- source_word: εἰς τὸ ἱερὸν
  choice: 神殿に
  rationale: 本文では簡潔で一般に理解しやすい「神殿」とし、ἱερόνが建物内部の聖所ではなく境内・神殿域を指すことを脚注で明示した。
- source_word: ἠρώτα
  choice: 求めた
  rationale: 未完了過去はその場での継続的・反復的な求めを背景に持つが、日本語で「求め続けた」とすると過度に強調されるため、文脈上自然な「求めた」とした。
- source_word: ἐλεημοσύνην λαβεῖν
  choice: 施しを求めた
  rationale: 「施しを受けることを頼んだ」という内容を、日本語で簡潔かつ自然に表現した。「施し」は貧しい人への金品の寄付という語義に合う。
