source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: ja
  text: そして、その人の右手を取って、彼を立ち上がらせた。すると、たちまち彼の足と足首[a]は強くなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「くるぶしの骨」。
    reason: σφυδρά は足首の部位を指し、骨に焦点を置く訳も可能である。
lexical_decisions:
- source_word: πιάσας
  choice: 取って
  rationale: 身体をつかんで支える動作を、善意の文脈に合う自然な現代日本語で表した。「つかんで」も可能だが、ここでは「手を取る」が明瞭で穏当である。
- source_word: τῆς δεξιᾶς χειρός
  choice: 彼の右手を
  rationale: 属格を、動詞「取る」と自然につながる目的語として訳した。日本語では文脈上、右手がその人のものであることを「彼の」で明示するのが自然である。
- source_word: ἤγειρεν αὐτόν
  choice: 立ち上がらせた
  rationale: ἐγείρωの「起こす、立たせる」という身体的動作を、この場面に即して明瞭に表した。単なる援助を意味する「立つのを助けた」ほど説明的にはしない。
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 治癒が即時に起きたことを、簡潔で品位のある日本語で示す。
- source_word: ἐστερεώθησαν
  choice: 強くなった
  rationale: 足の支持部分に力が与えられた結果を自然に表す。ギリシア語は受動形だが、日本語の「強められた」は不自然になりやすく、行為者を明示せず結果を保つ表現とした。
- source_word: αἱ βάσεις αὐτοῦ
  choice: 彼の足
  rationale: βάσειςは身体を支える部分を指し、この文脈では自然に「足」と訳せる。「足の裏」では意味を狭めすぎる。
- source_word: τὰ σφυδρά
  choice: くるぶし
  rationale: 足首周辺またはその骨・関節を指す語として、一般読者に分かりやすい「くるぶし」を採用した。より解剖学的な「くるぶしの骨」は脚注に残した。
theological_decisions:
- issue: 治癒の描写とその行為者
  choice: 身体が即座に強くなったという具体的な結果をそのまま記す。
  alternative: 「癒やされた」と言い換える、または神が強くしたと本文中で明示する。
  rationale: この節は治癒を足とくるぶしの強化として描いており、奇跡の仕組みや行為者を当該節の文言以上に説明していない。その含意は文脈に委ねる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の迅速な展開を「すると、たちまち」で表した。身体的な動作と治癒の結果を簡潔に保ち、過度に医学的または教理的な説明は加えていない。英語資料では脚注記号の位置と脚注内容が一致していないため、語義上対応する「くるぶし」に記号を付した。
