id: ACT.3.20
reference: Acts 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: ja
  text: それは、主の御前から新たな力を得る時が訪れ、また、あなたがたのためにあらかじめ定められた[a]メシアであるイエスを、主が遣わすためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたに定められた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: こうして……ためです
  rationale: 前節の悔い改めへの呼びかけに続く目的・結果を表す。ἄνを伴う接続法の含みは、後続する「訪れ」「遣わしてくださるため」によって自然に保った。
- source_word: ἔλθωσιν
  choice: 訪れ
  rationale: 時が「来る」という表現を、現代日本語として自然で品位のある「訪れる」とした。接続法は目的節全体で表現した。
- source_word: καιροὶ
  choice: 時
  rationale: καιρόςが表す時期・好機・季節を過度に限定せず、広い意味を保つ。
- source_word: ἀναψύξεως
  choice: 安らぎ
  rationale: 休息、慰め、回復をもたらすrefreshmentの意味を、解釈を狭めすぎない自然な日本語で表した。
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: 主の御前から
  rationale: πρόσωπονの字義である「顔」を日本語の慣用的な聖書表現「御前」で表し、主の臨在から来るという意味を保った。
- source_word: ἀποστείλῃ
  choice: 主が遣わしてくださる
  rationale: 文脈上の主語を日本語で明示し、遣わす行為を自然に表した。接続法の目的・結果の関係は文末の「ためです」で示した。
- source_word: προκεχειρισμένον
  choice: 定めておられた
  rationale: 完了分詞が示す先立つ選定・任命と、その効力が続く含みを自然な日本語で保った。
- source_word: ὑμῖν
  choice: あなたがたのために
  rationale: 与格を受益の意味に取りつつ、「あなたがたに」も可能であるため脚注に残した。
- source_word: χριστὸν
  choice: メシア
  rationale: ここでは固有名の一部というより称号として機能しており、ユダヤ的文脈と称号の意味を明確にする。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 人名の標準的な日本語表記。
theological_decisions:
- issue: χριστὸνを称号として訳すか、伝統的な「キリスト」とするか
  choice: メシア
  alternative: キリスト
  rationale: この箇所ではχριστόςはイエスに付されるメシア的称号として用いられているため、その意味が伝わる「メシア」とした。
- issue: προκεχειρισμένον ὑμῖνの意味
  choice: あなたがたのために定めておられた
  alternative: あなたがたに定めておられた／あなたがたのためにあらかじめ定めておられた
  rationale: 与格の受益的理解を本文に採り、完了分詞の先行性は「定めておられた」で表した。与格の別解と、接頭辞の時間的含意を明示する訳は脚注に保存した。
- issue: ἀναψύξεωςが指す救済論的・終末論的内容の範囲
  choice: 安らぎ
  alternative: 回復／新たにされること
  rationale: 語が持つ休息・慰め・活力回復の幅を保ち、特定の終末論的体系や霊的再生だけに限定しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「主の御前」「遣わす」によって聖書本文としての品位を保った。「安らぎ」は日常的に理解でき、同時に休息・慰め・回復という原語の幅を残す。脚注記号は、それが説明する「定めておられた」の直後に置いた。
