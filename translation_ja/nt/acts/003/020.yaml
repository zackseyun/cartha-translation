revisions:
- from: こうして、主の御前から安らぎの時が訪れ、また、あなたがたのために定めておられた[a]メシア、イエスを、主が遣わしてくださるためです。
  to: それは、主の御前から新たな力を得る時が訪れ、また、あなたがたのためにあらかじめ定められた[a]メシアであるイエスを、主が遣わすためです。
  rationale: 原文の目的構文を保ちつつ、追加的な恩恵表現を除いた。προκεχειρισμένον の「前もって定める」という語義を本文に反映し、与格 ὑμῖν の「あなたがたに」という可能な訳は脚注に残した。「新たな力を得る時」は、ἀνάψυξις の安らぎ・回復・元気づけの幅を、特定の神学的解釈に限定せず明瞭な現代語で表す。
