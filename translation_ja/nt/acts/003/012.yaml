id: ACT.3.12
reference: Acts 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: ja
  text: ペトロはこれを見て、民衆に答えた。「イスラエルの皆さん、なぜこのことに驚くのですか。また、まるで私たち自身の力や敬虔さ[b]でこの人を歩かせたかのように、なぜ私たちをじっと見つめるのですか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なぜ私たちに目を据えているのですか」とも訳せる。この動詞は、視線を集中して見続けることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「信心深さ」とも訳せる。ペトロは、この人の癒やしが使徒たち自身の宗教的熱心さや霊的資質によって生じたのではないと否定している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: これを見て
  rationale: アオリスト分詞を、ペトロが群衆の反応を見た後に語り始めたことが自然に伝わる連用形で訳した。「これ」は直前の文脈にある群衆の反応を指す。
- source_word: δὲ
  choice: ところが
  rationale: 群衆の反応からペトロの応答へ移る、穏やかな転換と対照を表す。
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: 民衆に答えた
  rationale: 明示された質問はないが、ἀποκρίνομαι は状況への応答を導入できる。「答えた」は原文の応答表現を保つ。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: イスラエルの皆さん
  rationale: 公の場における呼びかけとして、現代日本語で自然かつ敬意のある表現を選んだ。ἄνδρες の男性形を直訳した「イスラエルの男たちよ」は日本語では不自然で、聴衆の範囲まで不必要に限定して聞こえるため採らなかった。
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: なぜこのことに驚くのですか
  rationale: θαυμάζω の驚き・驚嘆の意味を明瞭に表し、「このこと」は起きた癒やしを指す。
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: なぜ私たちをじっと見つめるのですか
  rationale: ἀτενίζω が表す、視線を集中して持続的に見るニュアンスを「じっと見つめる」で伝えた。
- source_word: ἰδίᾳ δυνάμει
  choice: 自分の力
  rationale: ἰδίᾳ が強調する、彼ら自身に属する力という意味を簡潔に示す。
- source_word: εὐσεβείᾳ
  choice: 敬虔さ
  rationale: 神への畏敬に根差す信心深さという宗教的意味を保ちつつ、現代日本語で通じる語を選んだ。
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: この人を歩かせた
  rationale: 完了分詞が示す、すでに生じた結果を自然な日本語で表現した。「この人」は文脈上の癒やされた男性を指す。
theological_decisions:
- issue: εὐσεβείᾳ が使徒自身の宗教的功徳を癒やしの原因とする含みを持つか
  choice: 敬虔さ
  alternative: 信心深さ／信仰深さ
  rationale: ペトロは、癒やしが使徒たち自身の霊的資質によって起きたという見方を否定している。「敬虔さ」は宗教的側面を保つ一方、後代の功徳論などを本文に持ち込まない。
- issue: 男性形の呼びかけ Ἄνδρες Ἰσραηλῖται の日本語表現
  choice: イスラエルの皆さん
  alternative: イスラエルの男たちよ
  rationale: 原文には男性形があるが、日本語の自然な公的呼称では文法的性を同じ仕方で表示できない。「男たちよ」は不自然で、実際の聴衆を男性だけと断定する度合いが原文以上に強くなり得るため、慣用的な呼びかけを採った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、公の説教にふさわしい落ち着いた語調を保った。修辞疑問は「なぜ……のですか」で統一した。英語参照層では脚注記号の位置と内容にずれが見られたため、日本語稿では [a] を ἀτενίζετε の訳語に、[b] を εὐσεβείᾳ の訳語に正しく対応させた。
