  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: ja
  text: また、サムエルをはじめ、その後に続く預言者たちのうち、語った者たちは皆、この日々について告げ知らせました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この日々」は、ここでペトロが語っている成就の時期を指します。「この時代」とも訳せます。
    reason: alternative_reading
  - marker: b
    text: 「告げ知らせました」は、「宣べ伝えました」とも訳せます。文脈に即して「予告しました」と訳すこともできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: また、すべての預言者も
  rationale: δέは強い対比ではなく談話をつなぐ働きと見て、「また」で自然に示した。πάντεςは「すべて」と明示した。
- source_word: ἀπὸ Σαμουὴλ
  choice: サムエルをはじめ
  rationale: ἀπόが人物の連続における起点を示すため、現代日本語で明確な「サムエルをはじめ」とした。
- source_word: τῶν καθεξῆς
  choice: その後に続いて
  rationale: καθεξῆςの順序・継続の意味を保ち、後続のὅσοι ἐλάλησανと自然につながる形にした。
- source_word: ὅσοι ἐλάλησαν
  choice: 語ったすべての
  rationale: ὅσοιの包括的な範囲と、ἐλάλησανの単純な「語る」を保った。
- source_word: καὶ κατήγγειλαν
  choice: も……告げ知らせました
  rationale: καταγγέλλωの公に告知する意味を「告げ知らせる」で表し、文脈から「予告する」と限定することは避けた。καίは係助詞「も」で反映した。
- source_word: τὰς ἡμέρας ταύτας
  choice: この日々
  rationale: 字義的な時間表現を保ち、ペトロが語る現在の成就の時期を指すという含みを本文で説明しすぎないようにした。
theological_decisions:
- issue: 預言者たちが指し示した救済史上の時期
  choice: この日々
  alternative: この時代／この時期
  rationale: メシアに関わる成就の期間を指すと考えられるが、原文の「日々」という表現を維持し、終末論的含意を本文で明示しすぎないようにした。
- issue: κατήγγειλανの預言文脈での意味
  choice: 告げ知らせました
  alternative: 予告しました
  rationale: 「予告」は未来予言の意味を強く確定するため避け、動詞自体の広い「告知する、公に宣べる」という意味を残した。
translation_notes:
  register: 明瞭で現代的かつ端正な敬体。ギリシア語の長い構造を日本語として読みやすくまとめつつ、預言者の範囲を示す包括性と、「この日々」「告げ知らせる」に残る意味の幅を保持した。
