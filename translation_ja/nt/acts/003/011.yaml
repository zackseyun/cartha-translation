  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: ja
  text: その人がペトロとヨハネをしっかりつかんでいると[a]、民衆は皆、非常に驚いて、ソロモンの回廊と呼ばれる場所にいた彼らのもとへ一斉に駆け寄った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人がペトロとヨハネにすがりついていると」。ギリシア語の動詞には、しっかり握る、または離れないようにつかまるという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「回廊」は、神殿の境内にあった屋根付きの列柱廊を指す。ここは伝統的に「ソロモンの回廊」と呼ばれていた。
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: その人が……しっかりつかまっていると
  rationale: 属格独立構文の現在分詞が示す同時進行を自然な日本語で表した。κρατέωの、しっかり握る・離さずつかまるという語感を保ちつつ、感情的な動機までは読み込まない。
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: ペトロとヨハネ
  rationale: 人名は日本語聖書で広く通用する標準的な音写を用いた。
- source_word: συνέδραμεν
  choice: 一斉に駆け寄った
  rationale: 共に走って集まるという複合動詞の意味を、集団の急速な移動と合流の両方が伝わる自然な日本語で表した。
- source_word: πᾶς ὁ λαὸς
  choice: 民衆は皆
  rationale: λαόςを文脈上その場にいた人々として訳し、πᾶςの包括性を「皆」で明示した。
- source_word: πρὸς αὐτούς
  choice: 彼らのところへ
  rationale: 人物へ向かう移動を表すπρόςを、自然な方向表現で訳した。
- source_word: ἐπὶ τῇ στοᾷ
  choice: ……回廊……場所で
  rationale: στοάは屋根のある列柱廊を指す。「回廊」は神殿境内の建築空間として理解しやすく、ἐπίの位置的用法は日本語の文構成に合わせて「そこは……場所」とした。
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: 「ソロモンの回廊」と呼ばれる
  rationale: 名称であることを明確にし、日本語では所有格だけで省略せず建築名を補って自然にした。
- source_word: ἔκθαμβοι
  choice: 非常に驚き
  rationale: 強い驚きを表す語の強度を「非常に」で保ち、主文に自然に接続した。
