revisions:
- from: その人がペトロとヨハネにしっかりつかまっていると[a]、民衆は皆、非常に驚き、彼らのところへ一斉に駆け寄った。そこは「ソロモンの回廊」と呼ばれる場所であった[b]。
  to: その人がペトロとヨハネをしっかりつかんでいると[a]、民衆は皆、非常に驚いて、ソロモンの回廊と呼ばれる場所にいた彼らのもとへ一斉に駆け寄った[b]。
  rationale: 原文の語順を機械的に再現するのではなく、場所句を「彼らのもとへ駆け寄った」という出来事に自然に結び付けた。「をしっかりつかんでいる」により、κρατέωが表す物理的にしっかり保持する意味を、感情的動機を付加せずに明示した。脚注aは本文の訳語に合わせて保持し、脚注bは場所名と建築用語の理解に必要な説明として維持した。
