id: ACT.3.15
reference: Acts 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: ja
  text: しかし、あなたがたは命の創始者[a]を殺しましたが、神はこの方を死者の中からよみがえらせました。私たちはそのことの証人です[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「命の君」「命の導き手」または「命の先駆者」とも訳せる。ギリシア語の語には、物事を始める者、先頭に立つ者、卓越した者という意味の幅がある。
    reason: lexical_alternative
  - marker: b
    text: 「私たちはこの方の証人です」とも訳せる。ギリシア語は、よみがえらされた方自身を指すとも、その復活の事実を指すとも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の文脈に続けつつ、「命の創始者を殺した」という逆説的な対照を自然な日本語で示す。
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: 命の創始者
  rationale: ἀρχηγόςが持つ起源・先導・卓越の幅のうち、この文脈で際立つ命の源を始める者という含意を明瞭に伝える。同時に、別の語義の可能性は脚注に残す。
- source_word: ἀπεκτείνατε
  choice: あなたがたは…殺しました
  rationale: 動詞の直接性を保ち、「処刑した」や「殺害した」のような追加的な法的・道徳的含意を避ける。
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: 死者の中からよみがえらせました
  rationale: 神を主語とする他動的な復活表現を保ち、ἐκ νεκρῶνを字義と日本語の自然さの両面から表す。
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: 私たちはそのことの証人です
  rationale: οὗを直前の復活の出来事に結び付ける自然な日本語とし、名詞述語による証人としての強調を保つ。指示対象の曖昧さは脚注で明示する。
theological_decisions:
- issue: キリスト論的称号ἀρχηγόςの訳
  choice: 命の創始者
  alternative: 命の君／命の導き手／命の先駆者
  rationale: 語に含まれる起源と指導の両面を一語で完全には再現できないため、命との属格関係に最も自然で、殺された方が命に関わる根源的な方であるという逆説を伝える訳を本文に置き、他の可能性を脚注に残す。
- issue: 関係代名詞οὗの指示対象
  choice: 復活の出来事を指す「そのこと」
  alternative: よみがえらされた方を指す「この方」
  rationale: ギリシア語は復活した方自身とも、その復活の事実とも取り得る。日本語本文では直前の出来事を受ける自然な表現を選び、真正な曖昧さを脚注で保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒の告発と証言の厳粛さを保った。「よみがえらせました」は神の働きを明示し、「証人です」は原文の名詞表現を維持する。脚注記号は該当する称号と証言節の後に配置した。
