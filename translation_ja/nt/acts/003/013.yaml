id: ACT.3.13
reference: Acts 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: ja
  text: アブラハム、イサク、ヤコブの神、私たちの父祖の神は、ご自分のしもべイエス[a]に栄光をお与えになりました。あなたがたはこの方を引き渡し、ピラトが釈放しようと決めていたとき、その面前でこの方を拒みました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ご自分の子イエス」とも訳せる。ギリシア語のパイス（παῖς）は「子」と「しもべ」のどちらの意味にもなり得るが、ここではイザヤ書に描かれる主のしもべを踏まえた表現と考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: アブラハム、イサク、ヤコブの神
  rationale: 出エジプト記3章6節を響かせる契約的な定型句を保ちつつ、日本語として自然な列挙にした。
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 私たちの父祖の神
  rationale: πατέρωνの祖先・族長を指す聖書的な響きを「父祖」で簡潔に表した。
- source_word: ἐδόξασεν
  choice: 栄光をお与えになりました
  rationale: δοξάζωの神学的な重みを保持し、神を主語とする現代日本語として自然な敬意を表した。アオリストは完了した神の行為として訳した。
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: そのしもべイエス
  rationale: παῖςには「子」と「しもべ」の両義があるが、イザヤ書の主のしもべへの可能性の高い暗示を踏まえて「しもべ」を本文に採用した。
- source_word: παρεδώκατε
  choice: 引き渡し
  rationale: 司法当局への移送という文脈に合い、「裏切った」と意味を狭めずにπαραδίδωμιを表す。
- source_word: ἠρνήσασθε
  choice: 拒みました
  rationale: この場面では、ピラトの前でイエスを自分たちの者として認めず退けた行為を自然に表す。「否認しました」より現代日本語として明瞭である。
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: ピラトの面前で
  rationale: 「ピラトの顔の前で」という原語の対面的・公然たる含みを、簡潔で品位ある日本語にした。
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: ピラトが釈放しようと決めていたのに
  rationale: 属格独立分詞を譲歩的に理解すると、ピラトの決定と群衆の拒絶との対照が明確になる。「釈放」は司法的文脈に適する。
theological_decisions:
- issue: イエスに用いられたπαῖςの訳
  choice: しもべ
  alternative: 子
  rationale: 語自体の両義性は注で明示しつつ、使徒言行録3章に見られるイザヤ書の「主のしもべ」との関連を本文に反映した。これを「子」として、別語で表される神の御子という概念に自動的に同一化しない。
- issue: κρίναντοςの論理関係
  choice: 譲歩的な「決めていたのに」
  alternative: 時間的な「決めたとき」
  rationale: ギリシア語の分詞そのものは論理関係を明示しないが、ピラトが釈放を決めたことと、聞き手がその面前でイエスを拒んだことの強い対照を日本語で自然に示した。原文に残る幅は判断事項として記録する。
- issue: ἐδόξασενの時間表現
  choice: 栄光をお与えになりました
  alternative: 栄光をお与えになっています
  rationale: ギリシア語アオリストを、完結した出来事として過去形で示し、その現在的意義を日本語の時制によって過度に補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、契約的・聖書的な響きのある「父祖」「しもべ」「栄光」を保持した。「御子」は原語の曖昧さを解消しすぎるため避けた。
