id: ACT.3.16
reference: Acts 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: ja
  text: そして、その方の名を信じる信仰に基づいて、その名が、あなたがたの見て知っているこの人を強くしました[a]。また、その方を通しての信仰が、あなたがた全員の目の前で、この人にこの完全な回復を与えたのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その方の名への信仰に基づいて、その名が……この人を強くしました」。ここで、いずれの「信仰」についても、その主体は明記されていません。
    reason: grammatical_ambiguity
  - marker: b
    text: 「完全な回復」は、「完全な健全さ」または「完全な健康」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ
  choice: その方の名を信じる信仰に基づいて
  rationale: ἐπί＋与格の根拠・基盤の意味を「に基づいて」で示す。属格は日本語として自然な「名を信じる」としたが、信仰の主体は特定しない。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: その名
  rationale: ルカが強調する「名」を保ち、イエスの人格と権威を表す換喩を「イエス自身」などに言い換えない。
- source_word: ἐστερέωσεν
  choice: 強くしました
  rationale: 身体を堅固にし、力を与えたという具体的な回復を明瞭に表す。
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: 見て知っている
  rationale: 群衆が現に見ており、以前からその人を知っているという公的な確認を簡潔に保つ。
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: その方を通して与えられる信仰
  rationale: δι’ αὐτοῦの媒介・作用を示しつつ、信仰がイエスを通して生じる、または働くという含みを残す。「与えられる」は日本語の明瞭さのための補足であり、信仰の主体は明示しない。
- source_word: ὁλοκληρίαν
  choice: 完全な健康
  rationale: 文脈上の身体的な全快と完全な健全さを、一般読者に明瞭な表現で示す。
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: あなたがた全員の目の前で
  rationale: 癒やしが公然と起こり、全員が確認できるという証拠性を自然な日本語で表す。
theological_decisions:
- issue: 信仰の主体と、癒やしにおける働き手
  choice: 信仰の主体を特定せず、イエスの名が人を強くし、その方を通しての信仰が完全な健康を与えたとする。
  alternative: 癒やされた人の信仰、使徒たちの信仰、またはイエスが生じさせる信仰と明示する。
  rationale: ギリシア語は誰の信仰かを明記していないため、その神学的緊張を訳文でも解消しない。
- issue: 「名」の換喩的意味
  choice: 「その名」を本文に残す。
  alternative: 「イエスご自身」または「その名の力」と説明的に訳す。
  rationale: 「名」はイエスの人格と権威を指し示すが、使徒言行録における特徴的で神学的な語法を保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文に二度現れる「名」と「信仰」の反復を保ち、信仰の主体やδι’ αὐτοῦの神学的含意を過度に限定しない。
