  text: そして、これに預言者たちの言葉も一致しています。こう書かれているとおりです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: ヤコブが先の発言に預言書の裏づけを加える流れを、自然な接続で示す。
- source_word: τούτῳ
  choice: このことと
  rationale: 中性単数の指示代名詞が直前の事柄を広く指すことを保ち、具体的な解釈に限定しない。συμφωνέωの与格補語として、日本語では「このことと」が自然である。
- source_word: συμφωνοῦσιν
  choice: 一致しています
  rationale: 現在形の「一致する、調和する」を、明瞭で品位ある現代日本語で表す。
- source_word: οἱ λόγοι
  choice: 言葉
  rationale: 文書として伝わる預言者たちの発言を直接的に表す。
- source_word: τῶν προφητῶν
  choice: 預言者たちの
  rationale: 属格による帰属・由来を自然な日本語の連体修飾で示す。
- source_word: καθὼς
  choice: …とおり
  rationale: 先に述べた内容と、続く聖書引用との対応を示す比較表現として自然である。
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 完了受動形の定型的な聖書引用句を、現在も有効な記述として自然に表す。続く引用を指す「こう」を補う。
theological_decisions:
- issue: τούτῳが指す内容
  choice: 「このこと」とし、直前の主張または出来事を広く指す表現にする
  alternative: 異邦人の回心、ペトロの発言、神の計画などに明示的に限定する
  rationale: ギリシア語は指示対象を具体的に名指ししていないため、その曖昧さを保ち、特定の神学的解釈を訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語。引用導入句の直前なので、文末は後続箇所へのつながりを示す形にした。原文の前置されたτούτῳの焦点は「このことと」を文頭近くに置いて保った。
