  naturalness: The draft is generally clear, but 「このことと預言者たちの言葉とは一致しています」 is slightly stiff and can momentarily suggest that the two items are simply identical. Using 「これに…も一致しています」 is more idiomatic for agreement with a preceding matter and better reflects the Greek syntax.
