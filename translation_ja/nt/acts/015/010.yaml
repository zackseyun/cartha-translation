id: ACT.15.10
reference: Acts 15:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: ja
  text: では今、なぜあなたがたは、私たちの先祖も私たちも負うことのできなかったくびき[b]を弟子たちの首に負わせて、神を試す[a]のですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜ神を試みにかけるのですか。」
    reason: lexical_alternative
  - marker: b
    text: 「くびき」は、課せられた義務を表す比喩。ここでは、弟子たちに負わせようとしていた要求を指す。
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: それなのに今
  rationale: 直前の神の働きを受けた推論・転換を示す。日本語では反語的な問いへのつながりが自然になるよう「それなのに今」とした。
- source_word: τί πειράζετε τὸν θεόν
  choice: なぜあなたがたは…神を試すのですか
  rationale: τίを理由を問う反語的な「なぜ」とし、πειράζω＋対格が表す「試す／試みにかける」を簡潔に保った。
- source_word: ἐπιθεῖναι
  choice: 負わせて
  rationale: 神を試す行為の内容・手段を示す不定詞。くびきという比喩に合わせ、単なる設置ではなく他者に担わせる意味を自然に表した。
- source_word: ζυγὸν ἐπὶ τὸν τράχηλον
  choice: 首に…くびきを負わせて
  rationale: くびきと首の鮮明な比喩を保持しつつ、現代日本語として自然な語順にした。
- source_word: τῶν μαθητῶν
  choice: 弟子たち
  rationale: 使徒言行録における標準的で明瞭な訳語。
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: 私たちの先祖も私たちも…なかった
  rationale: πατέρεςはここではイスラエルの過去の世代を指すため、現代日本語で誤解の少ない「先祖」とした。οὔτε…οὔτεは「も…も…なかった」で自然に再現した。
- source_word: ἰσχύσαμεν βαστάσαι
  choice: 負いきれなかった
  rationale: 能力を表すἰσχύωと、くびきを担うβαστάζωを一体として訳し、担い通すことができなかったという意味と比喩を保った。
theological_decisions:
- issue: 「くびき」が具体的に何を指すか
  choice: 本文では「くびき」という比喩をそのまま保持し、弟子たちに課される義務以上には限定しない。
  alternative: モーセ律法全体、または割礼とそれに伴う規定を明示する。
  rationale: 文脈は異邦人信者に課そうとしている要求を扱うが、この節自体は比喩で述べている。訳文で特定の教理的範囲に狭めない。
- issue: 神を「試す」の含意
  choice: 「神を試す」と訳し、反抗・挑戦の含意を本文の文脈に委ねる。
  alternative: 「神を試みにかける」または「神に逆らう」と説明的に訳す。
  rationale: πειράζωの語義を保ち、「逆らう」と解釈し切ることを避ける。
translation_notes:
  register: 明瞭な現代標準日本語。反語的な問いの厳粛さを保ち、「くびき」の比喩を解釈語に置き換えず残した。「先祖」はπατέρεςの歴史的な集合指示を自然に伝える。
