  text: しかし、シラスはそこにとどまるのがよいと思った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、現存する最古のギリシア語写本の一部、たとえば4世紀のシナイ写本とバチカン写本、および初期のコプト語訳にはありません。一方、ビザンティン系の多数写本、一部の後代のアレクサンドリア系・西方系写本、ラテン語訳およびシリア語訳の伝承にはあります。33節ではユダとシラスが送り出されたと読めるのに、40節でシラスがアンティオキアにいてパウロと同行することになるため、その事情を説明するために後代の写字生が加えた可能性があると考えられています。
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε (δοκέω)
  choice: よいと考えた
  rationale: 与格の「τῷ Σίλᾳ」を伴う非人称的な表現で、「シラスには……するのがよいと思われた」、すなわち「シラスは……するのがよいと考えた」という意味。日本語として自然にしつつ、「決意した」とまで意志の強さを限定しない訳とした。
- source_word: ἐπιμεῖναι (ἐπιμένω)
  choice: とどまる
  rationale: ある場所に引き続きいることを表す。文脈上、アンティオキアに残ることを指すため、「とどまる」が簡潔で格調も保てる。
- source_word: αὐτοῦ
  choice: そこに
  rationale: 場所を表す副詞用法で、直前の文脈にあるアンティオキアを受ける。「そこに」として指示関係を保った。
- source_word: δέ
  choice: しかし
  rationale: 前節で送り出されたこととの対照を示す接続として訳出した。ただし本文異同により物語上のつながり自体が二次的である可能性は脚注で明示する。
