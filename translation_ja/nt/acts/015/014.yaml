id: ACT.15.14
reference: Acts 15:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: ja
  text: シメオン[a]は、神が初めて異邦人[b]を顧み、その中から御名のための民[c]を取り出されたことを語りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シモン」とも呼ばれます。ここでヤコブは「シメオン」という形を用いています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「諸国民の中から」。ここではユダヤ人以外の人々を指します。
    reason: lexical_alternative
  - marker: c
    text: すなわち、神に属し、神の御名と結び付けられた民。
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: シメオン
  rationale: 本文の固有名詞の形を保ち、より一般的な「シモン」に同化させない。
- source_word: ἐξηγήσατο
  choice: 語りました
  rationale: 直前に行われた報告を述べる語であり、現代日本語として自然にその内容を伝える。
- source_word: καθὼς
  choice: ことを
  rationale: ここでは報告の内容を導く用法なので、日本語では引用内容を「こと」で受けるのが自然である。
- source_word: πρῶτον
  choice: 初めて
  rationale: 神が異邦人に目を向けられた最初の出来事であることを簡潔に示す。
- source_word: ἐπεσκέψατο
  choice: 顧み
  rationale: 単に見ることではなく、関心と目的をもって訪れ、配慮する含みを保つ。
- source_word: λαβεῖν
  choice: 取り出された
  rationale: 目的を表す不定詞の「取る」を保ちつつ、ἐξ ἐθνῶνとの関係を自然な日本語で示す。
- source_word: ἐξ ἐθνῶν
  choice: 異邦人を……その中から
  rationale: 使徒15章のユダヤ人と非ユダヤ人の対比を明確にし、ἐξの『中から』という意味も明示する。
- source_word: λαὸν
  choice: 民
  rationale: 民族集団だけでなく、神に属する共同体という聖書的な響きを保つ。
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: 御名のための
  rationale: 『ご自分のため』と意訳せず、神の名に結び付けられた民という契約的表現を保つ。
theological_decisions:
- issue: ἐξ ἐθνῶνを「諸国民」とするか「異邦人」とするか
  choice: 異邦人
  alternative: 諸国民
  rationale: 使徒15章の直接の論点は非ユダヤ人が神の民に加えられることであり、「異邦人」が文脈上の対比を最も明確にする。
- issue: τῷ ὀνόματι αὐτοῦを「ご自分のため」と言い換えるか
  choice: 御名のための
  alternative: ご自分のものとなる
  rationale: 原文の神学的に重みのある『名』の表現を残し、その意味を本文で一義的に限定しない。
- issue: ἐπεσκέψατοの神の働きをどこまで説明的に訳すか
  choice: 顧み
  alternative: 助けるために訪れ
  rationale: 恵み深い関与という含みを保ちながら、原文が明示しない働きの内容を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会議でのヤコブの発言にふさわしい落ち着いた丁寧体とした。「御名」は聖書的な響きを保つために採用したが、脚注で意味を補った。
