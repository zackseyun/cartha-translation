  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: ja
  text: 聖霊と私たちは、次の必要な事柄以外には、あなたがたにこれ以上の重荷を負わせないことがよいと判断しました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊と私たちは、あなたがたにこれ以上の重荷を負わせないことに決めました」。原文の表現は、「よいと判断した」とも「決定した」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「次の必要な事柄」は、「次の不可欠な事柄」または「次の必要な要求」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: よいと判断しました
  rationale: 決定・承認を表す慣用句として、協議の末の判断という含みを自然な現代日本語で表す。「よいと思いました」より決定性を保ちつつ、本文以上に強い権威表現にはしない。
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: 聖霊と
  rationale: ἔδοξεν の判断主体を示す与格。日本語では「聖霊と私たちは」と並列することで、聖霊の人格的な関与と原文の協調関係を明確に表せる。
- source_word: καὶ ἡμῖν
  choice: 私たちは
  rationale: 聖霊と並ぶ判断主体として明示し、自然な日本語の主題構文に整えた。
- source_word: μηδὲν πλέον
  choice: これ以上の…ない
  rationale: 比較の意味を保持し、追加的な負担を否定する自然な日本語とした。
- source_word: ἐπιτίθεσθαι
  choice: 負わせない
  rationale: βάρος と結びつく比喩を日本語の「重荷を負わせる」で自然かつ簡潔に再現する。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 重荷を課される受け手を明示する標準的な複数二人称表現。
- source_word: βάρος
  choice: 重荷
  rationale: 異邦人信者に課される義務を指す比喩を保ち、聖書文体としても一般読者に理解しやすい語を採用した。
- source_word: πλὴν
  choice: …のほかには
  rationale: 否定文に続く例外を明示し、「これらを超えて」という範囲の限定を自然に表す。
- source_word: τούτων τῶν ἐπάναγκες
  choice: 次の必要な事柄
  rationale: 直後の節に列挙される規定を指すため「次の」を補って指示関係を明瞭にし、「必要な事柄」によって義務の性格を過度に解釈しない。
theological_decisions:
- issue: 聖霊と会議の決定との関係
  choice: 「聖霊と私たちは…よいと判断しました」とし、両者が並んで承認したという構文を保つ。
  alternative: 「聖霊に導かれて、私たちは決定しました」または単なる人間的合意として訳す。
  rationale: 原文は聖霊と「私たち」を同じ ἔδοξεν の与格補語として並べる。因果関係や導きの仕方を補わず、聖霊の人格的関与と会議の判断の緊張をそのまま示す。
- issue: 異邦人信者に対する決定の拘束範囲
  choice: 列挙される必要事項以外には「これ以上の重荷」を負わせないという限定として訳す。
  alternative: あらゆる義務の全面否定、またはモーセ律法全体の包括的賦課と解する。
  rationale: μηδὲν πλέον と πλὴν の対照は、負担を特定の必要事項に限定する。後代の律法と恵みに関する体系を本文へ持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会議文書にふさわしい落ち着いた格調を保った。「聖霊と私たちは」という原文に近い語順を生かし、神学的な共同承認を説明的に言い換えすぎない。脚注標識は本文末に対応順で配置した。
