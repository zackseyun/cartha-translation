  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: ja
  text: そして、二人の間に激しい対立が起こり、その結果、二人は互いに別れた。[a] バルナバはマルコを連れて、キプロスへ船出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「激しい争い」。このギリシア語は、強い刺激や憤り、また激しい衝突を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: そこで、…が起こり
  rationale: 物語を進めて新たな事態の発生を示す。δέを強い逆接にはせず、自然な叙述の接続とした。
- source_word: παροξυσμὸς
  choice: 激しい意見の衝突
  rationale: 単なる内面的ないらだちではなく、パウロとバルナバの間に生じた強い対立を、現代日本語で明確に表す。
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: ついに互いに別れることになった
  rationale: ὥστεと不定詞が表す程度・結果の関係を自然な日本語で示し、対立の結果として二人が別行動を取ったことを伝える。
- source_word: τόν τε Βαρναβᾶν
  choice: バルナバは
  rationale: τεは次節に続く分岐した行動の第一項を導く。日本語では主題として示すことで、次節への流れを保つ。
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: マルコを連れて
  rationale: 分詞の付随的な動作と、παραλαμβάνωの『同行させる』意味を簡潔かつ自然に表す。本文どおり名は『マルコ』とし、『ヨハネ・マルコ』とは補わない。
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: キプロスへ船出した
  rationale: ἐκπλέωが含む、船で出発するという意味と、εἰςが示す目的地を自然に表す。
theological_decisions:
- issue: 使徒的同労者間の対立の描写
  choice: 「激しい意見の衝突」と率直に訳す
  alternative: 「激論」「強い反目」
  rationale: 実際に起きた深刻な対立を和らげたり道徳的評価を加えたりせず、同時に語義以上に敵意を強調しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、聖書叙事としての落ち着きと品位を保った。「ついに」によって程度から結果へのつながりを示し、原文の緊張を解消せずに伝えた。
