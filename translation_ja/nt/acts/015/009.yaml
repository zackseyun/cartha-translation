  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: ja
  text: そして神は、信仰によって[a]彼らの心を清めた上で、私たちと彼らとの間に何の区別も設けられませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「信仰を通して」。ギリシア語の与格は、手段や媒介を表すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: 何の区別も設けず
  rationale: οὐθένとδιακρίνωの組み合わせを、神が両者を差別的に扱わなかったことを示す自然な現代日本語で表した。
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: 私たちと彼らとの間に
  rationale: μεταξύとτε…καίが示す二者間の関係を、簡潔で自然な日本語にした。
- source_word: τῇ πίστει
  choice: 信仰によって
  rationale: 与格を手段・媒介として理解し、πίστιςを基本的な訳語である「信仰」とした。
- source_word: καθαρίσας
  choice: 清められました
  rationale: 分詞の行為を日本語では主節と滑らかに結び、宗教的・道徳的な清めを示す語感を保持した。主語である神への敬意を自然な敬語で示した。
- source_word: τὰς καρδίας αὐτῶν
  choice: 彼らの心を
  rationale: καρδίαが指す内なる人を、聖書日本語として定着しつつ現代にも明瞭な「心」で表した。
theological_decisions:
- issue: τῇ πίστειの解釈
  choice: 信仰によって
  alternative: 信仰を通して
  rationale: ギリシア語の与格は手段または媒介を表し得る。本文では自然な「によって」を採用するが、「を通して」も可能であり、因果関係の細部を過度に限定しないよう脚注に残した。
- issue: καθαρίσαςと主動詞の関係
  choice: 区別も設けず、…清められました
  alternative: 彼らの心を清めて、私たちと彼らを区別されませんでした
  rationale: アオリスト分詞の時間的・論理的関係は厳密には一義的でないため、明確な時間順序を付加せず、二つの行為を自然に接続した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「彼ら」は文脈上の異邦人を指す。神を主語とする動詞には自然な敬語を用いた。
