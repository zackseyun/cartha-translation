  naturalness: 「さあ」「見てみよう」は会話として不自然ではないが、明瞭な現代標準語の聖書本文としてはやや口語的である。「では」と「見よう」にすると、提案を促す δή と勧奨の接続法を自然かつ節度ある調子で表せる。また「すべての町の兄弟たち」とすることで、どの町の人々を訪ねるのかが日本語で明確になる。
  terminology: 「パウロ」「バルナバ」「主」「主のことば」「兄弟たち」は適切であり、用語上の変更は不要である。「兄弟たち」の包括的用法を説明する脚注も、本文の男性形を保持しつつ想定される混合の信者共同体を読者に知らせており、適切である。
