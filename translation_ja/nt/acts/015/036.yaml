id: ACT.15.36
reference: Acts 15:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: ja
  text: 数日後、パウロはバルナバに言った。「では、戻って、主のことばを宣べ伝えたすべての町の兄弟たち[a]を訪ね、彼らがどうしているかを見よう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、男女を含む信者全体を指す場合がある。ギリシア語では男性形の語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: 数日後
  rationale: μετάと対格の時を表す語句による後続時を、期間の不確定さを保ちながら自然な日本語で表した。
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: さあ、戻って……訪ね……見てみよう
  rationale: 分詞Ἐπιστρέψαντεςを「戻って」とし、勧奨の接続法ἐπισκεψώμεθαを「訪ね……見てみよう」と訳した。δήの提案を促す語感は「さあ」で表した。
- source_word: τοὺς ἀδελφοὺς
  choice: 兄弟たち
  rationale: 原文の男性複数の家族的呼称を本文に保持した。男女を含む信者共同体を指し得ることは脚注で明示した。
- source_word: κατὰ πόλιν πᾶσαν ἐν αἷς
  choice: ……すべての町で
  rationale: κατάの配分的意味と、関係代名詞が複数の町を受ける構造を、簡潔で自然な表現にした。
- source_word: κατηγγείλαμεν τὸν λόγον τοῦ κυρίου
  choice: 主のことばを宣べ伝えた
  rationale: καταγγέλλωの公に告げ知らせる意味を「宣べ伝える」で示し、λόγος τοῦ κυρίουは伝統性と明瞭さを兼ねる「主のことば」とした。
- source_word: πῶς ἔχουσιν
  choice: 彼らがどうしているか
  rationale: 人々の状態や近況を問う慣用表現を、牧会的な関心を過度に説明せず自然な日本語にした。
theological_decisions:
- issue: ἀδελφοίが男女を含む共同体を指し得ること
  choice: 本文は「兄弟たち」とし、包括的用法の可能性を脚注に記す
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性形かつ家族的な比喩を保持しつつ、実際の指示範囲が男性だけに限定されない可能性も読者に示すため。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: この文脈では宣べ伝えられたことばに関わる称号であり、新約聖書での神学的含意と日本語聖書の定着した用法を保つ「主」が適切である。
translation_notes:
  register: 明瞭な現代標準語を用い、会話は自然でありながら軽すぎない調子にした。「さあ」でδήの促しを示し、「見てみよう」で勧奨の語調を保った。脚注記号は、それが説明する「兄弟たち」の直後に置いた。
