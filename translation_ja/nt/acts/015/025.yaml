  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: ja
  text: 私たちは心を一つにして、数名の男性[a]を選び、私たちの愛するバルナバとパウロとともに、あなたがたのもとへ遣わすことがよいと判断しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語はここで、成人男性を表す語を用いています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: よいと判断しました
  rationale: 共同体の協議による承認・判断を表す定型的な言い回しとして、単なる印象にも強い命令にもならない自然な日本語を採った。
- source_word: γενομένοις ὁμοθυμαδόν
  choice: 心を一つにし
  rationale: γενομένοιςが示す一致に至ったことと、ὁμοθυμαδόνの一致した思いを、簡潔で自然な表現にした。
- source_word: ἐκλεξαμένοις
  choice: 選んで
  rationale: πέμψαιとの連続を日本語で自然に表し、選出して派遣するという動作関係を保った。
- source_word: ἄνδρας
  choice: 何人かの男子
  rationale: 文脈上ユダとシラスを指し、ἀνήρがここで成人男性を明示するため、「人々」ではなく性別を保持した。「何人か」は日本語として複数を自然に示す。
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: あなたがたのもとへ遣わす
  rationale: 派遣の目的地を明確にしつつ、書簡にふさわしい品位ある現代語とした。
- source_word: σὺν
  choice: とともに
  rationale: バルナバとパウロが選ばれた男子に同行するという単純な随伴関係を表した。
- source_word: ἀγαπητοῖς ἡμῶν
  choice: 私たちの愛する
  rationale: 共同体からの親愛を表すἀγαπητόςの温かさと品位を保った。
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: バルナバとパウロ
  rationale: 日本語聖書で一般的な人名表記を用いた。
theological_decisions:
- issue: エルサレムからの手紙における共同体的な協議の調子
  choice: 「私たちは……よいと判断しました」
  alternative: 「私たちは決定しました」
  rationale: ἔδοξεν ἡμῖνは共同の承認・判断を表すが、この節だけで強い権威的命令の響きを加えないため。
- issue: ὁμοθυμαδόνが表す一致
  choice: 「心を一つにし」
  alternative: 「全員一致で」
  rationale: 一致を明確にしつつ、制度的な採決による全会一致とまでは限定しない表現にした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、教会書簡としての落ち着いた品位を保った。「そこで」は前節までの協議を受ける日本語上の接続として補った。
