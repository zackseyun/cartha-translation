id: ACT.15.35
reference: Acts 15:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: ja
  text: しかし、パウロとバルナバはアンティオキアにとどまり[a]、ほかにも多くの人々とともに、主のことば[c]を教え、良い知らせとして伝えていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アンティオキアでしばらく過ごし」。ギリシア語の動詞は、一定期間そこにとどまることを表すことがある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「福音を告げ知らせていた」。ギリシア語は、良い知らせを告げ知らせることを意味する。
    reason: lexical_alternative
  - marker: c
    text: 「主のことば」は使徒言行録でよく使われる表現。「主のメッセージ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: とどまり
  rationale: 未完了過去形が示す、一定期間そこに滞在し続けたことを、自然で簡潔な日本語で表した。
- source_word: διδάσκοντες
  choice: 教え
  rationale: 滞在中に継続して行っていた活動を表す分詞を、主動詞と自然につながる連用形で訳した。
- source_word: εὐαγγελιζόμενοι
  choice: 良い知らせとして宣べ伝えていた
  rationale: 動詞が持つ「良い知らせを告げる」という意味を明示しつつ、目的語である「主のことば」と自然に結び付けた。
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: ほかの多くの人々とともに
  rationale: パウロとバルナバ以外にも多くの人々が同じ働きに加わっていたという付加的な意味を保った。
- source_word: τὸν λόγον
  choice: ことば
  rationale: 使徒言行録に繰り返される「主のことば」という表現との文学的・神学的連続性を保った。「知らせ」「メッセージ」も文脈上可能である。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: κύριοςを通常の称号「主」として訳し、その指示対象を本文以上に限定しなかった。
theological_decisions:
- issue: 「主のことば」における「主」の指示対象
  choice: 「主」と訳し、指示対象を限定しない
  alternative: 「主イエスのことば」または、より広く「神である主のことば」と明示する
  rationale: 使徒言行録では「主」が特にイエスを指すことが多いが、原文はκύριοςという称号のみを用いているため、翻訳で解釈を付加せず曖昧さを保った。
- issue: τὸν λόγονと二つの分詞との関係
  choice: 「主のことば」を、教えることと良い知らせとして宣べ伝えることの双方の内容として示す
  alternative: 「教える」と「福音を宣べ伝える」を別個の目的語を取る活動として表す
  rationale: 原文ではτὸν λόγον τοῦ κυρίουがδιδάσκοντεςとεὐαγγελιζόμενοιの後に置かれ、両方に関係すると自然に理解できるため、その統語的つながりを保った。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準語を用いた。「宣べ伝える」は聖書表現として定着している一方、「良い知らせとして」を添えて一般の読者にも意味が分かるようにした。継続を表す未完了過去形は「とどまり」と「宣べ伝えていた」で自然に示した。
