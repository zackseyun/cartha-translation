  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: ja
  text: そこで、使徒たちと長老たちは、この問題について検討するために集まった[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「招集された」または「一堂に会した」とも訳せる。ギリシア語の動詞は形の上では受動態だが、この文脈では一同が会合したことを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「この言葉について見るため」。ここで「言葉」は、話し合われている問題や論点を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: 集まった
  rationale: アオリスト受動形だが、この文脈では一同が会合したことを自然に表す。「集められた」として受動性を不必要に強調せず、共同で集まる意味を保った。
- source_word: τε
  choice: そこで
  rationale: 直前の論争を受けて会合が開かれたという、軽い接続と物語の進展を自然な日本語で示す。
- source_word: οἱ ἀπόστολοι
  choice: 使徒たち
  rationale: 使徒として認められた指導者たちを指す、定着した明確な訳語である。
- source_word: οἱ πρεσβύτεροι
  choice: 長老たち
  rationale: 単に年長の男性ではなく、共同体で指導的役割を担う人々を指す。後代の特定教派の職制を持ち込まない訳語である。
- source_word: ἰδεῖν
  choice: 検討するために
  rationale: 字義的には「見る」だが、ここでは争点を調べ、熟慮するという審議的な意味を表す。「決定する」と結果を先取りせず、目的を明確に伝える。
- source_word: περὶ τοῦ λόγου τούτου
  choice: この問題について
  rationale: λόγος はここでは「言葉」そのものではなく、直前に提起された論点・案件を指すため、「問題」が文脈に即して明瞭である。
theological_decisions:
- issue: エルサレムの会合における πρεσβύτεροι の制度的含意
  choice: 「長老たち」と訳し、共同体で認められた指導者であることを示す
  alternative: 後代の教会制度における専門的な職名として「司祭たち」または「プレスビュテロイ」とする
  rationale: 本文はエルサレム教会の指導者を示すが、後代の特定の教会政治や職制までは規定していない。
- issue: 会合の審議目的
  choice: 「この問題について検討するために」
  alternative: 「この問題を決定するために」
  rationale: ἰδεῖν はこの段階で問題を取り上げて調べ、考慮することを表す。「決定する」では結論があらかじめ定まっていたかのように手続き上の意味を強めすぎる。
translation_notes:
  register: 明瞭で現代的かつ端正な叙述体。「使徒」「長老」は一般に定着した聖書用語として保持し、「検討する」で会合の審議的性格を自然に表した。
