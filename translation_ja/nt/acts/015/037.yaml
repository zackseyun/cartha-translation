base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: ja
  text: しかし、バルナバは、マルコと呼ばれるヨハネも一緒に連れて行きたいと思っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: バルナバ
  rationale: 固有名詞として、日本語聖書で広く定着している音写を用いた。
- source_word: δὲ
  choice: しかし
  rationale: 直前のパウロの提案を受けつつ、ここから両者の意向の違いが示されるため、穏やかな対照を明確にした。
- source_word: ἐβούλετο
  choice: 望んでいた
  rationale: 未完了過去形が表す、当時持続していた意向を自然な現代日本語で表した。「決めていた」とするほど強い決意には限定しない。
- source_word: συμπαραλαβεῖν
  choice: 連れて行こうと
  rationale: 同行者として一緒に連れて行くという複合動詞の意味を、簡潔で自然な日本語にした。
- source_word: καὶ
  choice: も
  rationale: 目的語に添えられた付加の意味を、「ヨハネも」と自然に表した。
- source_word: Ἰωάννην
  choice: ヨハネ
  rationale: 固有名詞として、日本語で定着している音写を用いた。
- source_word: τὸν καλούμενον Μᾶρκον
  choice: マルコと呼ばれていたヨハネ
  rationale: ヨハネを別名によって特定する分詞句として訳した。καίの「も」をこの句内の「また」に移さず、原文の統語的位置を保った。
- source_word: Μᾶρκον
  choice: マルコ
  rationale: 固有名詞として、日本語で定着している音写を用いた。
