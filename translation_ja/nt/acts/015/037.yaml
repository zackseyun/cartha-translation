  source_fidelity: 原文は「バルナバは（対して）、マルコと呼ばれるヨハネも一緒に連れて行きたいと望んでいた」という内容である。草案は主要な意味を正確に伝えているが、「呼ばれていた」は原文の現在分詞（「呼ばれる／呼ばれている」）よりも過去の呼称であったことを示しうる。
