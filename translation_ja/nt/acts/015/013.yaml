  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: ja
  text: 一同が話し終えて黙ると[a]、ヤコブが答えた。「兄弟の皆さん[b]、私の言うことを聞いてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一同が黙った後で」。このギリシア語表現は、先に話していた人々が発言をやめた後の時点を示す。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「男たちよ、兄弟たちよ」。男性複数形を用いた改まった呼びかけである。
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: 一同が話し終えて静かになると
  rationale: μετά＋冠詞付き不定詞の後続時を「～すると」で表し、σιγάωがここでは先の発言者たちが話すのをやめて静かになることを指す点も明示した。
- source_word: ἀπεκρίθη
  choice: 答えて言った
  rationale: ἀποκρίνομαιの応答の意味を「答えて」で保ち、後続するλέγωνと合わせて日本語として自然な発話導入にした。
- source_word: Ἰάκωβος
  choice: ヤコブ
  rationale: ギリシア語名Ἰάκωβοςを、日本語聖書でこの人物に用いられる慣用的な表記「ヤコブ」とした。
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟の皆さん
  rationale: 二つの男性複数呼格から成る改まった呼びかけを、現代日本語で自然かつ丁重に表した。字義的な男性形については脚注で明示した。
- source_word: ἀκούσατέ μου
  choice: 私の言うことを聞いてください
  rationale: 注意して聞くよう求める命令の力を、自然で丁重な現代日本語で表した。
theological_decisions:
- issue: 公的な集会での男性形の呼びかけ
  choice: 本文を「兄弟の皆さん」とし、男性形であることを脚注に示す
  alternative: 「男たちよ、兄弟たちよ」
  rationale: ἄνδρεςとἀδελφοίはいずれも男性複数形だが、日本語で両語を逐語的に重ねると不自然で、原文の定型的な呼びかけの機能が伝わりにくい。「兄弟の皆さん」は男性への呼びかけを保持しつつ自然であり、形態上の情報と集会の文脈は脚注で保った。
translation_notes:
  register: 明瞭で品位ある現代標準語。議事の場での丁重な発言として、「聞いてください」を用いた。固有名は日本語の慣用表記に従った。
