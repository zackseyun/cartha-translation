revisions:
- from: すると、会衆全体は静まり返り、バルナバとパウロが、神が彼らを通して異邦人[a]の間で行われたしるしと不思議について語るのに耳を傾けた。
  to: すると、会衆全体は静まり返り、バルナバとパウロが、神が彼らを通して異邦人[a]の間で行ったしるしと不思議について語るのを聞いていた。
  rationale: 修正は日本語の自然さとアスペクトの反映に限る。「聞いていた」により、会衆がバルナバとパウロの報告を継続して聞いたというἤκουονの描写を保った。「神が……行った」により、神をἐποίησενの能動的主語として明瞭にしつつ、「彼らを通して」による二人の媒介的役割を維持した。脚注の語義上の選択肢とアンカーは保持した。
