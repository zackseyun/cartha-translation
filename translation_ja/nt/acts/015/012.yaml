id: ACT.15.12
reference: Acts 15:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: ja
  text: すると、会衆全体は静まり返り、バルナバとパウロが、神が彼らを通して異邦人[a]の間で行ったしるしと不思議について語るのを聞いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。ここでは、エルサレム会議の文脈から、特に異邦人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: 静まり返り
  rationale: アオリストの出来事としての推移を自然な日本語で表し、会衆が沈黙に入ったことを示す。
- source_word: πᾶν τὸ πλῆθος
  choice: 会衆全体
  rationale: エルサレムで審議のために集まった一同を指すため、「群衆」より場面に適した表現とした。
- source_word: ἤκουον
  choice: 耳を傾けた
  rationale: 未完了過去が示す継続的で注意深い聴取を、自然な日本語で表す。
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: バルナバとパウロ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: ἐξηγουμένων
  choice: 語る
  rationale: 詳しく報告する、物語るという意味を保ちつつ、過度に説明的にならない自然な表現とした。
- source_word: ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα
  choice: 神が……行われたしるしと不思議について
  rationale: ὅσαが導く報告内容を日本語として明瞭にし、「しるしと不思議」を神が行った事柄として結び付ける。神への敬意を示す通常の日本語として「行われた」を用いた。
- source_word: σημεῖα καὶ τέρατα
  choice: しるしと不思議
  rationale: ルカ文書に特徴的な対句を簡潔に保ち、「奇跡的な」など原文にない説明を加えない。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 異邦人の間で
  rationale: エルサレム会議の文脈では非ユダヤ人を具体的に指す。「諸国民」という語義上の可能性は脚注に残す。
- source_word: δι’ αὐτῶν
  choice: 彼らを通して
  rationale: διά＋属格の媒介性を保ち、神が主たる行為者で、バルナバとパウロがその働きの媒介者であることを明示する。
theological_decisions:
- issue: 使徒の宣教における神の主体性
  choice: しるしと不思議を行った主体を神とし、バルナバとパウロを「彼らを通して」と媒介者として表す。
  alternative: バルナバとパウロをしるしと不思議の主要な行為者として表す。
  rationale: ὁ θεὸςがἐποίησενの文法上の主語であり、δι’ αὐτῶνは彼らの媒介的役割を示すため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会議の厳粛さに合う品位を保った。「会衆」「しるしと不思議」は聖書的文脈に定着しつつ一般読者にも理解可能な語として採用した。
