id: ACT.15.8
reference: Acts 15:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: ja
  text: そして、人の心をご存じの神は、私たちに与えたのと同じように、彼らにも聖霊を与えることによって、彼らに証しをされました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: 人の心を知っておられる
  rationale: 「心を知る者」を意味する複合語。神の属性を保ちつつ、現代日本語として自然な連体修飾で表した。「人の心」は内面を指す。
- source_word: θεὸς
  choice: 神
  rationale: 標準的な訳語。καρδιογνώστηςを神にかかる説明として訳した。
- source_word: ἐμαρτύρησεν αὐτοῖς
  choice: 彼らのために証しをされました
  rationale: μαρτυρέωの証言・立証の意味を保った。与格αὐτοῖςは、神が彼らを受け入れたことを証明したという文脈から「彼らのために」とした。
- source_word: δοὺς
  choice: 与えることによって
  rationale: 分詞が、神がどのように証しをしたかという手段を示すことを明確にした。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語の標準的な聖書用語。
- source_word: καθὼς καὶ ἡμῖν
  choice: 私たちに与えたのと同じように
  rationale: ギリシア語では省略されている「与えた」を日本語で補い、彼らと私たちへの賜物が同様であるという比較を自然に示した。
theological_decisions:
- issue: 聖霊の賜物によって示された、彼らに対する神の証言
  choice: 神が彼らにも聖霊を与えたこと自体が、彼らのための証しとなったと表現する。
  alternative: 「彼らに証しされた」と方向だけを逐語的に示す。
  rationale: 与格には解釈上の幅があるが、直後の「聖霊を与えることによって」と議論の文脈から、彼らを承認する証言という意味が自然である。彼らを本文中で「異邦人」と明示せず、指示対象は文脈に委ねた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「知っておられる」「証しをされました」で神への敬意を自然に表しつつ、過度に古風な表現は避けた。
