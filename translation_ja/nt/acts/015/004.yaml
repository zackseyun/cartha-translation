id: ACT.15.4
reference: Acts 15:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: ja
  text: 彼らはエルサレムに到着すると、教会、使徒たち、長老たちに迎え入れられ、神が彼らと共になさった[a]すべてのことを報告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神が彼らを通してなさった」、または「神が彼らの間でなさった」とも訳せる。ギリシア語は直訳すると「神が彼らと共になさった」。
    reason: 原文のμετ’ αὐτῶνは「彼らと共に」を基本義とするが、文脈上、彼らを手段とする働き、または彼らの間での働きを含意しうるため。
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: 彼らはエルサレムに到着すると
  rationale: アオリスト分詞の時間的な働きを、現代日本語で自然な「到着すると」によって表した。δέは弱い接続辞であり、独立した語を加えず文の流れに含めた。
- source_word: παρεδέχθησαν
  choice: 迎え入れられ
  rationale: 共同体による好意的な受け入れを表す受動形として、自然でありながら原文の態を保つ表現を選んだ。
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: 教会、使徒たち、長老たちに
  rationale: 受動文における受け入れ手を「に」で示した。三者を並列し、原文の区分を保った。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: ここではキリスト者の共同体を指す一般的かつ文脈に適した訳語である。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: 単なる年長者ではなく共同体の公認された指導者を指すため、教派固有の制度用語を避けつつ「長老たち」とした。
- source_word: ἀνήγγειλάν τε
  choice: 報告した
  rationale: 情報を詳しく伝える意味と、エルサレムの共同体および指導者たちへの報告という文脈に合う。τεの連結機能は日本語の連用構造で表した。
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: 神が……なさったすべてのこと
  rationale: ὅσαの包括性を「すべてのこと」で示し、神を主語とする敬意ある自然な日本語として「なさった」とした。
- source_word: μετ’ αὐτῶν
  choice: 彼らと共に
  rationale: μετά＋属格の基本的な意味を保持し、神の働きが彼らを通して行われたのか、彼らの間で行われたのかを本文で一方に限定しない。
theological_decisions:
- issue: μετ’ αὐτῶνが示す神の働きと人間の関与
  choice: 神が彼らと共になさった
  alternative: 神が彼らを通してなさった／神が彼らの間でなさった
  rationale: 神を第一の行為者として保ちながら、宣教者たちとの関わりを示す原文の幅を残した。「通して」として道具的意味に限定することも、「間で」として場所・集団内の意味に限定することも避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙事文として簡潔かつ品位ある調子にした。受動形と神を主語とする表現を保ち、教派固有の解釈を加えていない。
