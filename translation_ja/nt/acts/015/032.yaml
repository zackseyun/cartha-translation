base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: ja
  text: ユダとシラスは、自分たちも預言者であり、長く語って兄弟たち[a]を励まし、力づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、女性を含む信者の共同体全体を指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: ユダとシラス
  rationale: 新約聖書の人名として日本語で定着した表記を用い、τε καὶによる二人の結びつきは自然な「と」で表した。
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: 自分たちも預言者であったので
  rationale: αὐτοὶの強調とκαίの「も」を保ち、分詞句が後続の働きの背景・理由を示すことを自然な日本語で表した。
- source_word: διὰ λόγου πολλοῦ
  choice: 多くの言葉をもって
  rationale: 「多くの言葉・語りによって」という原文の具体的な表現を保ちつつ、長く十分に語った意味が伝わるようにした。
- source_word: παρεκάλεσαν
  choice: 励まし
  rationale: παρακαλέωが持ち得る勧告・慰めの幅を残しながら、この文脈で分かりやすい「励ます」を選んだ。
- source_word: τοὺς ἀδελφοὺς
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文に保った。この語が女性を含む信仰共同体全体を指し得ることは脚注で示した。
- source_word: ἐπεστήριξαν
  choice: 力づけた
  rationale: 信仰や共同体を堅固にする意味を、現代日本語として自然な「力づけた」で表し、先行する「励まし」と別の動作であることも保った。
theological_decisions:
- issue: 混合された信仰共同体におけるἀδελφοὺςの訳し方
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 文法上の男性複数形を本文で明示しつつ、初期キリスト教の用法では共同体全体を包括的に指し得るため、その可能性を脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「多くの言葉をもって」は原文の表現を尊重したやや改まった言い回しであり、「励まし、力づけた」は二つの動作を簡潔に区別している。
