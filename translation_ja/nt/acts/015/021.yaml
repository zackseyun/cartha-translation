- from: というのも、モーセは昔から、どの町にも彼を宣べ伝える人々を持っており、安息日ごとに会堂で朗読されているからです。[a]
  to: というのも、モーセには遠い昔から、どの町にもモーセを宣べ伝える人々がおり、会堂では安息日ごとに朗読されているからです。[a]
  rationale: ἔχειの表現を日本語として自然な存在構文に改めた。「モーセ」という換喩は本文に残しつつ、日本語では不自然な「彼」を「モーセ」の反復に置き換えた。分詞の因果的・説明的なつながりは、文全体の「というのも…からです」によって示し、分詞自体に過度に限定的な接続詞を加えていない。
