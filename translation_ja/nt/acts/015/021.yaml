  source_fidelity: 原文の主語「モーセ」と、それがモーセに帰される書・律法を指す換喩は、本文と注で保持されている。ただし、現行の「彼を宣べ伝える人々を持っており」はギリシア語のἔχειを逐語的に写したため日本語として不自然であり、「モーセには…人々がおり」とするほうが、継続的に宣べ伝える者が存在するという意味を正確に伝える。ἀναγινωσκόμενοςの受動・継続の意味も維持する。
  naturalness: 「モーセには、遠い昔から、どの町にもモーセを宣べ伝える人々がおり」は明瞭な現代標準日本語であり、換喩を保ちながら不自然な代名詞連続を避ける。「会堂では安息日ごとに朗読されている」は、会堂での定期的朗読を自然に表す。
  terminology: 「モーセ」「宣べ伝える」「会堂」「安息日」は日本語聖書で広く通用する用語である。「モーセを宣べ伝える」は換喩として意図的に保持し、脚注でモーセの書または律法を指すことを説明する。
  issues:
