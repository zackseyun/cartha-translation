    rationale: 原文の人称代名詞を日本語でそのまま「彼」とすると、人物モーセとその書・律法という換喩の関係がかえって読みにくくなる。同じ名詞を反復して「モーセを」とし、脚注で換喩を説明しても、原文の意味を損なわない。
  revised_text: というのも、モーセには遠い昔から、どの町にもモーセを宣べ伝える人々がおり、会堂では安息日ごとに朗読されているからです。[a]
