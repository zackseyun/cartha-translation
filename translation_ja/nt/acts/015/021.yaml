source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: ja
  text: というのも、モーセには遠い昔から、どの町にもモーセを宣べ伝える人々がおり、会堂では安息日ごとに朗読されているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、「モーセは……彼を宣べ伝える人々を持っており……朗読されている」と表現されています。ここで「モーセ」は、モーセに結び付けられた書、または律法を指す換喩です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で定着した人名表記を用い、原文の換喩的な主語を保持した。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の判断に理由を添える接続関係を、自然な現代日本語で明示した。
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: 昔から
  rationale: 古い世代以来継続しているという時間的意味を、簡潔で自然な日本語にした。
- source_word: κατὰ πόλιν
  choice: どの町にも
  rationale: κατάの配分的な意味を表した。
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: 彼を宣べ伝える人々
  rationale: 原文の『彼』を保ち、κηρύσσωの公に告げ知らせる意味を表した。
- source_word: ἔχει
  choice: 持っており
  rationale: 現在形の継続的状態を、先行する『昔から』との組み合わせで自然に示した。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 会堂で
  rationale: ユダヤ人の集会・礼拝の場であるシナゴーグを、日本語聖書で一般的な『会堂』とした。
- source_word: κατὰ πᾶν σάββατον
  choice: 安息日ごとに
  rationale: 繰り返しを示す配分表現を自然に再現した。
- source_word: ἀναγινωσκόμενος
  choice: 朗読されている
  rationale: 受動分詞の継続的な状況を表し、モーセがその書を指すという原文の換喩を保持した。
theological_decisions:
- issue: 『モーセ』の換喩的用法
  choice: 本文では『モーセ』『彼』を保つ
  alternative: 『モーセの律法』または『モーセの書』と明示する
  rationale: 原文は人物名と代名詞を用いてその著作・律法を指しているため、その表現を本文に残し、意味は脚注で説明した。
- issue: 分詞ἀναγινωσκόμενοςの関係
  choice: 主節に理由を添える日本語構文の中で『朗読されている』と訳す
  alternative: 『朗読されながら』または独立した文として訳す
  rationale: 分詞自体の意味を過度に限定せず、節全体が前文への根拠となる談話上の関係を自然に表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、理由を述べる文としての格調を保った。『彼』は日本語ではやや特異だが、原文の換喩と擬人的表現を保存するため採用し、脚注で補った。
