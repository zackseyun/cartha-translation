id: ACT.15.29
reference: Acts 15:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: ja
  text: 偶像に献げられた食物[a]、血、絞め殺されたもの[b]、性的な不道徳[c]を避けることです。これらのことを避けて身を守るなら、あなたがたは正しく行うことになります。では、お元気で。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「偶像に献げられたもの」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「絞め殺された肉」または「絞め殺された動物」。
    reason: lexical_alternative
  - marker: c
    text: このギリシア語は広く性的な不道徳を指し得るが、ここではレビ記の禁止事項を背景に、より限定的な意味に取る解釈もある。
    reason: alternative_reading
  - marker: d
    text: ギリシア語では手紙を結ぶ慣用表現。別訳「ごきげんよう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: 避ける
  rationale: 列挙された事柄から離れているよう求める不定詞。現代日本語として明快で、禁止の内容を簡潔に示す。
- source_word: εἰδωλοθύτων
  choice: 偶像に献げられた食物
  rationale: 偶像礼拝において供えられた物、とりわけ食物を指す。文脈上の意味を明確にしつつ、脚注でより広い直訳も示す。
- source_word: αἵματος
  choice: 血
  rationale: 原文の簡潔な語形をそのまま保ち、食物規定に限定する説明を本文へ補わない。
- source_word: πνικτῶν
  choice: 絞め殺されたもの
  rationale: 形容詞の名詞的用法を保ち、血抜きされていない肉という解釈を本文で明示しすぎない。
- source_word: πορνείας
  choice: 不道徳な性行為
  rationale: 特定の一種類の性行為に狭めず、πορνείαの広い意味を自然な現代日本語で表す。
- source_word: ἐξ ὧν διατηροῦντες ἑαυτούς
  choice: これらのことから自分自身を守るなら
  rationale: 分詞構文を自然な条件表現とし、再帰的な『自分自身』と、列挙事項から身を守る意味を保つ。
- source_word: εὖ πράξετε
  choice: よいことです
  rationale: 命令に従うことが適切で望ましいという慣用的意味を、硬すぎない明瞭な日本語で表す。繁栄の約束とは限定しない。
- source_word: ἔρρωσθε
  choice: では、お元気で
  rationale: 字義的な『強くあれ』ではなく、手紙の慣用的な結びとして機能することを日本語の自然な結語で表す。
theological_decisions:
- issue: 使徒会議の決定における πορνεία の範囲
  choice: 特定の違反に限定せず「不道徳な性行為」と広く訳す。
  alternative: 「淫行」、またはレビ記18章に関連する禁じられた婚姻・性的関係に限定する。
  rationale: この語は広い性的な不道徳を表し得る一方、文脈上レビ記の禁止事項を特に指すとの解釈もある。節自体は範囲を明示的に限定しないため、本文では広い語義を保ち、解釈上の可能性を脚注に示す。
translation_notes:
  register: 明快な現代標準日本語を用い、使徒たちの書簡の指示として簡潔かつ品位ある調子にした。最後は日本語の手紙として自然な結語にした。
