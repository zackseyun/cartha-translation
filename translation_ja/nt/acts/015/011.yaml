id: ACT.15.11
reference: Acts 15:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: ja
  text: しかし私たちは、主イエスの恵みによって、彼らと同じように救われると信じています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「しかし、主イエスの恵みによって救われると私たちは信じている。彼らも同じ仕方で〔救われる〕」。原文は、ユダヤ人である「私たち」が異邦人である「彼ら」と同じ仕方で救われる、という比較の方向を示している。
    reason: 原文の省略された動詞を角括弧で示しつつ、比較の方向を明確にするため。
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の「くびき」を負えなかったという発言と強く対照させる接続詞として、自然な現代日本語にした。
- source_word: διὰ τῆς χάριτος
  choice: 恵みによって
  rationale: 属格を伴うδιάが表す手段を、簡潔で自然な日本語で示した。
- source_word: χάριτος
  choice: 恵み
  rationale: ここでは、救いをもたらす主イエスの無償の恩恵を指す標準的な訳語が適切である。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの
  rationale: 属格を「恵み」にかけ、その恵みが主イエスに属し、主イエスから与えられることを表した。
- source_word: πιστεύομεν
  choice: 私たちは…信じています
  rationale: 内容を示す不定詞と結び付く確信を、明瞭な現代日本語で表した。
- source_word: σωθῆναι
  choice: 救われると
  rationale: アオリスト受動不定詞を日本語の引用節として自然に訳し、時制を本文以上に限定しなかった。
- source_word: καθ’ ὃν τρόπον
  choice: 同じように
  rationale: 方法・様態の比較を明確に示した。
- source_word: κἀκεῖνοι
  choice: 彼らも
  rationale: καίの「も」を保持し、文脈上の異邦人を指す代名詞として訳した。
theological_decisions:
- issue: 比較の方向
  choice: 「私たち」が救われる仕方を「彼ら」に照らして述べるギリシア語の方向を維持した。
  alternative: 「彼らは私たちと同じように救われる」とする。
  rationale: 語順と統語は、ユダヤ人である「私たち」が異邦人である「彼ら」と同じ仕方で救われる、という強調を持つ。異邦人がユダヤ人になる必要はないという文脈上の力点を反転させないためである。
- issue: 救いと恵みの関係
  choice: 救いが主イエスの恵みによることだけを明示した。
  alternative: 「恵みだけにより、信仰だけを通して」などの教理的定式を補う。
  rationale: 本文にある恵みと信じることを訳しつつ、本文が明言しない後代の定式や救済論的順序は加えない。
- issue: σωθῆναιの時間的含意
  choice: 「救われる」とし、未来を明示しなかった。
  alternative: 「救われることになる」「救われるだろう」と未来を明示する。
  rationale: 不定詞そのものには明示的な未来形がなく、文脈上は将来的な完成を含み得るものの、日本語本文では原文の幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「私たち」を明示して比較の方向を保ち、後半を独立した短文にして、原文の省略を不自然に補いすぎず日本語として読める形にした。
