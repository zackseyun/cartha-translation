  source_fidelity: 「私たちのもとから出て行ったある者たち」は τινὲς ἐξ ἡμῶν ἐξελθόντες を、出所・離脱の両面を損なわずに表している。「言葉によって…動揺させ、…心をかき乱した」は λόγοις、ἐτάραξαν、ἀνασκευάζοντες の手段と攪乱の強調を適切に反映する。「私たちは彼らに何も指示していませんでした」は οἷς οὐ διεστειλάμεθα の先行詞と無許可性を明確にする。文末の読点は次節へ続く原文の構文を保持するため妥当である。
