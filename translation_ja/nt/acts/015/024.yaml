  terminology: ψυχή を本文で「心」としたのは、この文脈での内面・人格の攪乱を自然に伝える適切な訳である。脚注は「魂」という直訳と語義の広がりを示しており、特定の教理的理解を押しつけていない。「指示」は διαστέλλομαι の命令・指図の意味を過不足なく表す。
