id: ACT.15.24
reference: Acts 15:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: ja
  text: 私たちのもとから出て行ったある者たちが、言葉によってあなたがたを動揺させ、あなたがたの心[a]をかき乱したと聞きましたので――私たちは彼らに何も指示していませんでした[b]――、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたの魂」。ここでは感情だけでなく、あなたがたの内面、また人そのものを指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私たちは彼らに何も命じていませんでした」。
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐπειδὴ
  choice: 聞きましたので
  rationale: 後続する決定の根拠を示す因果関係を保ち、24節が25節へ続く構文であることを自然な日本語で表した。
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: 私たちのもとから出て行ったある者たち
  rationale: ἐξ ἡμῶνを出所・所属集団として表し、ἐξελθόντεςの移動の意味も明示した。
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: 言葉によってあなたがたを動揺させ
  rationale: λόγοιςの手段を明示しつつ、ταράσσωが表す不安や混乱を引き起こす意味を現代日本語で表した。
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: あなたがたの心をかき乱した
  rationale: ἀνασκευάζωの強い攪乱・混乱の意味を保ち、ψυχήをこの文脈で人の内面全体を指す自然な「心」とした。
- source_word: οἷς οὐ διεστειλάμεθα
  choice: 私たちは彼らに何も指示していませんでした
  rationale: 指示の受け手が問題の者たちであることを明確にし、エルサレム側が彼らを派遣・承認していなかったという否定を、余分な接続関係を加えずに表した。
theological_decisions:
- issue: 問題を起こした者たちに使徒側の指示・承認があったか
  choice: 私たちは彼らに何も指示していませんでした
  alternative: 私たちは彼らに何も命じていませんでした
  rationale: 本文は彼らがエルサレムの指示のもとで行動したことを明確に否定する。「指示」はδιαστέλλομαιの命令・指図の意味を保ちながら、不必要に軍事的な響きを加えない。
- issue: ψυχήを「魂」とするか、文脈的に「心」とするか
  choice: あなたがたの心
  alternative: あなたがたの魂
  rationale: ここでは身体と対立する独立した実体について教える表現ではなく、聞き手の内面・人格を指す。「心」は現代日本語でその作用を自然に伝え、脚注で語義の幅を示した。
translation_notes:
  register: 公的な書簡にふさわしい明瞭で品位ある現代標準日本語とした。24節から25節へ続く因果構文を「ので」と読点で保持し、挿入的な否認はダッシュで区切って係り受けを明確にした。
