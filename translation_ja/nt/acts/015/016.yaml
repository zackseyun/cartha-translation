id: ACT.15.16
reference: Acts 15:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: ja
  text: これらのことの後、わたしは戻って来る。そして、倒れたダビデの天幕[a][b]を建て直す。その壊れた部分を建て直し、それを立て直す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天幕」は「幕屋」とも訳せる。ギリシア語は「天幕」または「幕屋」を意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「ダビデの天幕」は、ダビデの系統または王国に関わる回復を表す預言的な比喩である。
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: これらのことの後
  rationale: 複数形の指示表現を保ちながら、時間的な移行を明確に表した。「その後」も可能だが、原文の形をよりよく映す表現を採った。
- source_word: ἀναστρέψω
  choice: わたしは戻って来る
  rationale: ここでは一般的な「向きを変える」ではなく「戻る、帰って来る」の意味。神の一人称による約束を自然な日本語で保持した。
- source_word: ἀνοικοδομήσω
  choice: 建て直す
  rationale: 「再び建てる」を意味する複合動詞であり、再建の比喩を簡潔に伝える。原文で二度用いられているため、訳文でも反復を保った。
- source_word: σκηνὴν Δαυὶδ
  choice: ダビデの天幕
  rationale: σκηνήの具体的な比喩を残し、王家・王国と直接言い換えることを避けた。「天幕」は現代日本語で意味を取りやすく、「幕屋」より宗教用語的な響きが弱い。
- source_word: τὴν πεπτωκυῖαν
  choice: 倒れた
  rationale: 完了分詞が示す、倒れた結果としての状態を簡潔に表す。
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: その崩れた所
  rationale: 取り壊され、崩された部分を指す中性複数の集合的意味を自然に表した。「廃墟」よりも天幕の損壊箇所とのつながりが明瞭である。
- source_word: ἀνορθώσω αὐτήν
  choice: 元どおりにする
  rationale: 動詞には「まっすぐにする、起こす、回復する」の意味がある。倒れた天幕を再建した結果として回復させることを、過度に抽象化せず自然に表した。
theological_decisions:
- issue: 「ダビデの天幕」の比喩的意味
  choice: 本文では「ダビデの天幕」という比喩をそのまま保持する。
  alternative: 「ダビデの家」「ダビデの王朝」など、指示対象を直接訳す。
  rationale: この表現はダビデの系統または王国に関わる回復を示唆するが、ギリシア語本文は具体的な天幕の比喩を保持している。解釈を本文に織り込まず、比喩の神学的広がりを残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、預言の引用にふさわしい簡潔で荘重な調子を保った。原文の再建を表す動詞の反復と、「天幕」という比喩を維持した。
