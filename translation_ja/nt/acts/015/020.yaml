  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: ja
  text: ただ、偶像にかかわる汚れ[a]、性的な不道徳[b]、絞めて殺したもの[c]、血を避けるよう、彼らに書き送ることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「偶像による汚れ」。これを「偶像に供えた食物」と限定して訳す場合もあるが、ここで用いられているギリシア語の表現はそれより広い。
    reason: lexical_alternative
  - marker: b
    text: 別訳「淫行」。ギリシア語は広く性的な不道徳を指し得るが、ここでは特に禁じられた性的結合を指すと理解する見方もある。
    reason: alternative_reading
  - marker: c
    text: 直訳「絞めて殺したもの」。血を十分に抜かずに殺した動物の肉を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: 書き送る
  rationale: 書面で指示を伝えるという文脈上の意味を、自然な現代日本語で表す。単なる「伝える」よりも書簡の意味を保つ。
- source_word: ἀπέχεσθαι
  choice: 避ける
  rationale: 自ら遠ざかり、控えることを求める中動態の意味を、明瞭で自然な日本語にした。
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: 偶像にかかわる汚れ
  rationale: 祭儀的な汚れという語義と、偶像との由来・関連を保ちつつ、「偶像に供えた食物」だけに限定しない。
- source_word: πορνείας
  choice: 性的な不道徳
  rationale: 広い性的非道徳を表し得る語の幅を保ち、婚前性交や特定の禁じられた婚姻関係だけに狭めない。
- source_word: τοῦ πνικτοῦ
  choice: 絞め殺したもの
  rationale: 名詞化された形をできるだけ保ち、原文に明示されない「肉」を本文で補わない。文化的背景は脚注で示す。
- source_word: τοῦ αἵματος
  choice: 血
  rationale: 原文どおり簡潔に訳し、ここで食用などの用途を本文に付加しない。
theological_decisions:
- issue: 偶像に関する禁止の範囲
  choice: 偶像にかかわる汚れ
  alternative: 偶像に供えた食物
  rationale: 原文はより限定的な「偶像に供えた物」という語ではなく、「偶像にかかわる汚れ」を意味する表現を用いるため、その広がりを残した。
- issue: πορνείαの範囲
  choice: 性的な不道徳
  alternative: 淫行／禁じられた性的結合
  rationale: 一般的な性的罪を指すのか、律法で禁じられた特定の結合を指すのかを本文だけで決着させず、語の幅を保持した。
- issue: 列挙された禁止事項の拘束性と期間
  choice: 原文どおり避けるべき事柄として列挙
  alternative: 一時的な食卓交わりの規定／全時代に普遍的な命令
  rationale: この節自体は命令の神学的な期間や全範囲を説明していないため、いずれの立場も訳文に織り込まなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会議の決定を伝える文脈にふさわしい落ち着いた文体とした。「ただ、…ことです」は前節の判断内容を受ける不定詞構文のつながりを表す。
