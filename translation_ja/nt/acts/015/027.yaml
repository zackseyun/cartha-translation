  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: ja
  text: そこで私たちは、ユダとシラスを遣わしました。二人自身が、同じことを口頭で伝えます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「言葉によって」。ここでは、手紙に加えて口頭でも伝えることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: 遣わしました
  rationale: ギリシア語の完了形が示す、遣わした行為の現在への関わりは文脈上明らかであり、現代日本語では自然な過去形で表した。
- source_word: οὖν
  choice: そこで
  rationale: 直前の協議と決定を受けた帰結を、書簡として自然な日本語で示す。
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: ユダとシラス
  rationale: 日本語聖書で広く用いられる標準的な音写を採用した。
- source_word: αὐτοὺς
  choice: 二人も自ら
  rationale: 書面だけでなく、遣わされた本人たちも直接確認するという代名詞の強調を保つ。
- source_word: διὰ λόγου
  choice: 口頭で
  rationale: 直前の手紙との対照を明確にし、話された言葉による伝達を簡潔で自然な現代日本語にした。
- source_word: ἀπαγγέλλοντας
  choice: 伝えます
  rationale: 現在分詞が、遣わされた二人のこれからの行為を表すため、日本語では独立した述語として自然に表した。
- source_word: τὰ αὐτά
  choice: 同じこと
  rationale: 書面に記された内容と同一の事柄を指す表現を、解釈的に『知らせ』などと限定せず保持した。
theological_decisions:
- issue: 書面と使者による口頭の証言との関係
  choice: 二人も自ら、同じことを口頭で伝える
  alternative: 二人が口頭で同じ知らせを伝える
  rationale: αὐτούς の強調と τὰ αὐτά の幅を保ち、使者が手紙の内容を直接確認する構図を、過度な神学的意味づけなしに示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。書簡の論理的な流れを保ちつつ、ギリシア語の分詞構文は日本語として読みやすい二文にした。
