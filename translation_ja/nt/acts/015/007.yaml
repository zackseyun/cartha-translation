revisions:
- from: 長い議論の末、ペトロは立ち上がって彼らに言った。「兄弟たち、皆さんが知っているとおり、以前、神はあなたがたの間で私を選び、私の口を通して異邦人[a]が福音のことばを聞き、信じるようにされました。[b]」
  to: 多くの議論があった後、ペトロは立ち上がって彼らに言った。「兄弟たち、あなたがたも知っているとおり、ずっと以前から、神はあなたがたの中から私を、私の口を通して異邦人[a]が福音のことばを聞いて信じるために、選ばれました[b]。」
  rationale: 「多くの議論」で原文の量的表現を保ち、呼びかけから原文にない「皆さん」を除きました。本文は、神がペトロを選んだという文脈上有力で自然な理解を採用し、その選びの目的を「聞いて信じるために」として原文の不定詞に対応させました。構文上、選びの目的語を異邦人が聞き信じる出来事と取る可能性は脚注に明示し、曖昧さを保存しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:39Z'
