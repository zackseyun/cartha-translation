id: ACT.15.7
reference: Acts 15:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: ja
  text: 多くの議論があった後、ペトロは立ち上がって彼らに言った。「兄弟たち、あなたがたも知っているとおり、ずっと以前から、神はあなたがたの中から私を、私の口を通して異邦人[a]が福音のことばを聞いて信じるために、選ばれました[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「諸国民」。ここではユダヤ人以外の人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ずっと以前から、神はあなたがたの中で、異邦人が私の口を通して福音のことばを聞いて信じることをお選びになりました」。原文では「選んだ」に関わる語句の係り方が明示されていない。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: 長い議論の末
  rationale: 属格独立構文が示す先行事情を自然な日本語で表す。ζήτησις はこの文脈では真剣な協議・論争を指すため、「議論」とした。
- source_word: ἀναστὰς
  choice: 立ち上がって
  rationale: 発言に先立つペトロの具体的な動作をそのまま表す。
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟たち、皆さん
  rationale: 男性複数形の呼びかけと共同体的な親しさを「兄弟たち」で保ち、「皆さん」によって日本語として自然に聴衆へ呼びかける形にした。
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: 以前
  rationale: 直訳の「昔の日々から」は日本語では過度に古い時代を連想させる。ここではコルネリウスの出来事を含む初期の時期を振り返る表現なので、自然で過剰に限定しない「以前」とした。
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: 神はあなたがたの間で私を選び
  rationale: 本文の語順では選ばれた目的語が明示されないが、続く「私の口を通して」からペトロが選ばれたという意味が文脈上明らかである。「あなたがたの間で」は ἐν ὑμῖν の幅を保つ。
- source_word: διὰ τοῦ στόματός μου
  choice: 私の口を通して
  rationale: ペトロを語る器として描く原文の生き生きした比喩を保持する。
- source_word: τὰ ἔθνη
  choice: 異邦人
  rationale: エルサレム会議の文脈ではユダヤ人以外の諸民族を指すため、日本語聖書語として理解される「異邦人」が適切である。より一般的な「諸国民」の可能性は脚注に示す。
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: 福音のことば
  rationale: λόγος と εὐαγγέλιον の双方を明示し、ルカの表現の形式的な響きを保ちながら現代日本語として理解できる形にした。
- source_word: ἀκοῦσαι ... καὶ πιστεῦσαι
  choice: 聞き、信じる
  rationale: 並列された二つの不定詞を簡潔に対応させ、原文にない神学的展開を加えない。
theological_decisions:
- issue: Ἄνδρες ἀδελφοί の性別を伴う呼称
  choice: 兄弟たち、皆さん
  alternative: 兄弟たち／兄弟姉妹の皆さん
  rationale: 原文の男性複数形を「兄弟たち」で保持しつつ、現代日本語の呼びかけとして不自然にならないよう「皆さん」を添えた。「兄弟姉妹」とすると原文に明示されない女性形を補うことになるため採らない。
- issue: τὰ ἔθνη の救済史的な指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: 直近の論点は非ユダヤ人信者の受け入れであり、「異邦人」がユダヤ人との対比を明確に伝える。ただし語自体には「諸国民」の意味もあるため脚注で示す。
- issue: ἐξελέξατο の省略された目的語と構文
  choice: 神はあなたがたの間で私を選び…聞き、信じるようにされました
  alternative: 神はあなたがたの間で、私の口を通して異邦人が…することをお選びになりました
  rationale: ギリシア語は構文上複数の取り方が可能だが、ペトロを神の選ばれた使者と理解する読みが続く διὰ τοῦ στόματός μου とよく調和する。別の構文理解を脚注に残し、曖昧さを隠さない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「ペトロ」「福音」「異邦人」は日本語の聖書読者に広く通用する語を用いた。「昔から」は過度に遠い過去を示し得るため「以前」とし、構文上の真正な曖昧さは脚注に保存した。
