  source_fidelity: ギリシア語の論理的帰結（διὸ）、「私が判断する」（ἐγὼ κρίνω）、共同体に向けられた否定不定詞の実践的内容、異邦人の中から来て神へ向きを変える人々、という文の主要要素を適切に伝えている。「私の判断では、…べきではありません」は、一人称の判断を保ちながら、日本語として方針提案の力を自然に表す。
