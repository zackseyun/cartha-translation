  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: ja
  text: ですから、私の判断では、異邦人の中から神に立ち帰る人々を悩ませるべきではありません[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異邦人」は、字義的には「諸国民」とも訳せる。ここでは、神に立ち帰る非ユダヤ人を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ですから私は、異邦人の中から神に立ち帰る人々を悩ませないようにすべきだと判断します」。
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す推論の接続語として、現代日本語で自然かつ明瞭である。
- source_word: ἐγὼ κρίνω
  choice: 私の判断では
  rationale: 一人称単数の明示と、ヤコブが熟慮した判断を述べる語感を保つ。単なる個人的感想には弱めない。
- source_word: μὴ παρενοχλεῖν
  choice: 悩ませるべきではありません
  rationale: παρενοχλέωが表す、困難を加えたり煩わせたりする意味を自然な日本語で示す。判断の実践的・共同体的な効力も伝える。
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: 異邦人の中から…人々
  rationale: ἀπόの出自・所属のニュアンスと、対象が具体的な人々であることを保つ。
- source_word: ἐθνῶν
  choice: 異邦人
  rationale: このユダヤ人キリスト者の文脈では非ユダヤ人を指すため、日本語聖書で一般的かつ明瞭な表現を採る。字義的には「諸国民」も可能なので注記する。
- source_word: ἐπιστρέφουσιν ἐπὶ τὸν θεόν
  choice: 神に立ち帰る
  rationale: 神へ向きを変えるという回心の動きを保ち、現在分詞の進行的・継続的な含みも日本語の連体表現で自然に表す。
theological_decisions:
- issue: ヤコブ個人の判断と会議への提案という共同体的効力の関係
  choice: 「私の判断では、…べきではありません」
  alternative: 「私は、…悩ませないことに決めます」／「私は、…悩ませないようにすべきだと判断します」
  rationale: ἐγὼ κρίνωの一人称単数を明示しつつ、否定不定詞が共同体の取るべき方針を内容としていることを表す。最終決定者として断定する読みや、単なる私見に限定する読みを避ける。
- issue: ἐπιστρέφουσινの回心表現
  choice: 「神に立ち帰る」
  alternative: 「神に立ち向かう」／「神に帰依する」
  rationale: 神への方向転換という比喩を維持し、後代の制度的・宗派的含意を持ち込みにくい表現とする。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、会議でのヤコブの発言にふさわしい落ち着いた格調を保った。「立ち帰る」は聖書的な響きを持つが、方向転換の比喩が一般読者にも理解可能である。
