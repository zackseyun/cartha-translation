  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: ja
  text: しかしパウロは、パンフィリアで彼らのもとを離れ[a]、その働きに一緒に行かなかったこの人を、連れて行くべきではないと強く主張した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らを見捨てた」とも訳せる。ギリシア語は、単に離れたことだけでなく、離反したという否定的な意味を帯びる場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: 強く主張した
  rationale: 未完了形は、パウロが継続して示した強い判断を表す。単なる好みより強い一方、現代日本語として自然に論争の文脈を伝える。
- source_word: ἀποστάντα
  choice: 彼らのもとを離れ
  rationale: ἀφίσταμαιの基本的な『離れる、立ち去る』を保ち、本文では『見捨てる』という否定的評価を断定しない。より強い訳は脚注に示す。
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: パンフィリアで彼らのもとを離れ
  rationale: 二つのἀπόが表す人的な分離と地理的な出発点を、日本語で不自然にならない形にまとめた。ここでは既出の出来事（使徒13:13）に照らし、パンフィリアが離脱の場所であることを明瞭にした。
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: 一緒に行かなかった
  rationale: 旅と宣教の文脈における同行を、平明で自然な日本語で表した。
- source_word: εἰς τὸ ἔργον
  choice: その働きに
  rationale: 定冠詞を『その』で受け、特定の宣教の務めを指すことを示しつつ、『宣教』と限定的に言い換えすぎない。
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: この人を、連れて行くべきではない
  rationale: 否定不定詞がパウロの判断内容であることと、συμπαραλαμβάνωの『一緒に連れて行く』という意味を自然に表す。τοῦτονの指示性は『この人』で保持した。
