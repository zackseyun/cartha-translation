  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: ja
  text: こうして彼らは送り出されて[a]、アンティオキアへ下って行った[b]。そして人々を集めると[c]、その手紙を手渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「解散して」または「帰ることを許されて」。ギリシア語は、正式に送り出されることにも、その場を去ることを許されることにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 「下って行った」は、標高の高いエルサレムからアンティオキアへ向かう地理的な方向を反映していると考えられる。
    reason: cultural_note
  - marker: c
    text: 直訳「大勢の人々」。文脈上、アンティオキアに集まった信者たちを指す。「会衆」または「集まり」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: 送り出されて
  rationale: 正式にその場から去らせる、または派遣する含みを持つ。文脈ではエルサレムの集まりから任務を帯びて出発するため、「解放されて」より「送り出されて」が自然である。
- source_word: κατῆλθον
  choice: 下って行った
  rationale: エルサレムからアンティオキアへの地理的な下降を示す方向性を保ちつつ、現代日本語として自然にした。
- source_word: συναγαγόντες
  choice: 集めると
  rationale: 主動詞に先立つ動作を簡潔かつ自然に示す。
- source_word: τὸ πλῆθος
  choice: 一同
  rationale: アンティオキアで集められた信者たちの全体を指すと見られるが、制度的な「教会」や正式な「会衆」と断定せず、集合体を自然に表す。
- source_word: ἐπέδωκαν
  choice: 手渡した
  rationale: 手紙を相手に引き渡す具体的な行為を明瞭に表す。「届けた」も可能だが、集まった一同への提示をより直接的に示す。
- source_word: ἐπιστολήν
  choice: その手紙
  rationale: 前文脈で作成された特定の書簡を指す定冠詞を「その」で表し、現代的な語を用いた。
