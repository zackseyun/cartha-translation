source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: ja
  text: 私たちの主イエス・キリスト[b]の御名のために、自分たちの命を懸けてきた[a]人たちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「自分たちの命を引き渡した」。ここでは、死に至り得る危険に身をさらしたという意味。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」は「メシア（油を注がれた者）」を意味する称号。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: 人たち
  rationale: 直前のバルナバとパウロを指す複数形。日本語では性別を不自然に強調せず、具体的な複数の人物を自然に表せる。
- source_word: παραδεδωκόσι
  choice: 命を懸けた
  rationale: 原義は「引き渡した」だが、τὰς ψυχὰς αὐτῶνとの結び付きでは、死に至り得る危険に身をさらしたことを表す。「命を投げ出した」では実際に死んだとも受け取られ得るため、「命を懸けた」とした。
- source_word: τὰς ψυχὰς αὐτῶν
  choice: 命
  rationale: ここでψυχήは非物質的な「魂」ではなく、危険にさらされる生命を指す。日本語では「自分たちの」を明示しなくても意味が明確である。
- source_word: ὑπὲρ
  choice: のために
  rationale: 属格を伴い、動機・大義を示す。自然な日本語で「のために」とした。
- source_word: τοῦ ὀνόματος
  choice: 御名
  rationale: 単なる呼称だけでなく、その方自身、権威、誉れを含み得る聖書的表現を保つ。敬意ある現代日本語として「御名」とした。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριοςの称号としての重みを保ち、標準的で明瞭な表現とした。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語で定着している称号表現を用いる。キリストは固有名の姓ではなく、「メシア」を意味する称号であることを脚注で明示した。
theological_decisions:
- issue: παραδεδωκόσι τὰς ψυχὰς αὐτῶνが実際の死を意味するか、死の危険に身をさらしたことを意味するか
  choice: 命を懸けた
  alternative: 命を投げ出した／命を引き渡した
  rationale: バルナバとパウロはこの時点で生存しているため、実際に命を失ったとは断定できない。一方、原文の強い自己献身と危険の含意は「命を懸けた」で保った。
- issue: Χριστοῦを日本語でどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςが「油注がれた者」、すなわちメシアという称号である点を保ちつつ、日本語本文では広く定着した「キリスト」を用い、その称号性を脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「主」「御名」によって原文の荘重さと聖書的響きを保った。文末の「です」は、原文が前節から続く構文であることを日本語の独立した節として自然に示すために補った。
