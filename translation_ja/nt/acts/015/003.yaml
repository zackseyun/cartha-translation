  terminology: 「教会」「異邦人たち」「回心」はこの文脈に適切であり、特定教派の教義を不当に読み込んでいない。「回心」の字義寄りの代替を脚注aで示し、「兄弟たち」の包括的な指示対象を脚注bで明示している。脚注記号はいずれも対応語の直後に正しく置かれている。
