  source_fidelity: 本文はギリシア語の構文と意味をよく反映している。οὖνは「こうして」、ὑπὸ τῆς ἐκκλησίας προπεμφθέντεςは「教会に送り出され」、未完了形διήρχοντοは「通って行き」と自然に表されている。τε … καίの両地域の結び付きも「フェニキアとサマリアの両地方」で保持される。ἐκδιηγούμενοιの詳しい報告、異邦人のἐπιστροφή、そして聞き手側に生じた大きな喜びも損なわれていない。
