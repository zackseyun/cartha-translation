id: ACT.15.3
reference: Acts 15:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: ja
  text: こうして彼らは教会に送り出され、フェニキアとサマリアの両地方を通って行き、異邦人たちの回心[a]を詳しく語った。そして、すべての兄弟たち[b]に大きな喜びをもたらした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「異邦人たちが（神に）立ち返ったこと」。
    reason: lexical_alternative
  - marker: b
    text: ここで「兄弟たち」は、女性を含む信者たち全般を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: 送り出され
  rationale: 旅立つ者を見送り、必要な助けを与えて先へ送り出す語感を、文脈に即した自然な日本語で表した。同行や護送までは明示しない。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 使徒言行録のこの文脈ではキリスト者の共同体を指すため、現代日本語で定着した「教会」とした。
- source_word: διήρχοντο
  choice: 通って行き
  rationale: 二つの地域を通過しつつ旅を続けた未完了過去の継続的な動きを表す。
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: フェニキアとサマリアの両地方
  rationale: τε … καίによる二地域の緊密な並列を「両地方」で明確にした。
- source_word: ἐκδιηγούμενοι
  choice: 詳しく語った
  rationale: 単に告げるだけでなく、十分に物語り報告する複合動詞の強意を反映した。
- source_word: τὴν ἐπιστροφὴν τῶν ἐθνῶν
  choice: 異邦人たちの回心
  rationale: ここでは非ユダヤ人が福音に応答して神へと向きを変えた出来事を指す。「回心」は宗教的な転回を簡潔に伝え、より字義的な表現は脚注に残した。
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: 大きな喜びをもたらした
  rationale: ποιέωと名詞による使役的な表現を、自然な日本語で再現した。
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: すべての兄弟たち
  rationale: 原文の男性複数形を本文に保った。共同体の女性も含み得る用法であることは脚注で明示した。
theological_decisions:
- issue: 異邦人の受け入れに関わるἐπιστροφήの訳
  choice: 回心
  alternative: 異邦人たちが（神に）立ち返ったこと
  rationale: 宗教的・共同体的な転回を自然に伝えつつ、後代の特定の回心論を読み込まない。動作性の強い字義的な別訳を脚注に示した。
- issue: 混合共同体を指し得るἀδελφοίの訳
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の形を本文で保持しながら、この男性複数形が文脈上は女性を含む信者一般を指し得ることを脚注で補った。
translation_notes:
  register: 明快で現代的かつ品位ある叙述体。「こうして」でοὖνの文脈上の帰結を示し、地域名には「両地方」を添えて自然な日本語にした。脚注記号[a]と[b]は、それぞれ該当する「回心」と「兄弟たち」の直後に置いた。
