  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: ja
  text: 人々はそれを読んで、その励ましを受けて喜んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その勧めを受けて喜んだ」または「その慰めを受けて喜んだ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: それを読み
  rationale: アオリスト能動分詞で、主動詞に先立つ行為を表す。目的語は直前の文脈にある手紙なので、日本語では「それ」を補った。
- source_word: δὲ
  choice: （明示せず）
  rationale: 軽い接続・展開を示す語だが、日本語では文脈上、接続詞を置かないほうが自然であり、意味上の対比も過度に強めない。
- source_word: ἐχάρησαν
  choice: 喜んだ
  rationale: χαίρωのアオリストで、ここでは能動的な意味を持つ。「喜んだ」は自然な現代日本語で感情の動きを保つ。
- source_word: ἐπὶ
  choice: ～を
  rationale: 与格を伴い、喜びの根拠・契機を示す。日本語の「その励ましを喜んだ」で、原因に基づく喜びを簡潔に表した。
- source_word: τῇ παρακλήσει
  choice: その励まし
  rationale: παράκλησιςには「励まし」「勧め」「慰め」などの意味がある。この文脈では、手紙の内容が共同体を力づけたことを表す「励まし」が最も包括的で自然。「その」は手紙に由来することを示す。
theological_decisions:
- issue: παράκλησιςの意味の幅
  choice: 励まし
  alternative: 勧め／慰め
  rationale: 語の意味を特定の教義的方向へ限定せず、手紙が与えた力づけを広く表す語を本文に採用し、他の可能性は脚注に残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語。原文の簡潔さを保ちつつ、直前の手紙を指す目的語を補った。脚注記号を本文末に置き、παράκλησιςの語義の幅を示した。
