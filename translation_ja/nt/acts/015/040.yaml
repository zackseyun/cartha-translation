id: ACT.15.40
reference: Acts 15:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: ja
  text: しかし、パウロはシラスを選び、兄弟たち[b]によって主の恵みに委ねられて[a]、出発した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主の恵みに託されて」。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、文脈によっては女性を含む信者の共同体全体を指すことがある。
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節でバルナバが出発したこととの穏やかな対照を示すため。
- source_word: ἐπιλεξάμενος
  choice: 選び
  rationale: パウロ自身が出発に先立ってシラスを選んだことを、自然な日本語で表す。
- source_word: Σιλᾶν
  choice: シラス
  rationale: 人名として一般的な日本語音写を用いる。
- source_word: ἐξῆλθεν
  choice: 出発した
  rationale: 旅行・宣教の叙述における『出て行く、旅立つ』という意味を自然に表す。
- source_word: παραδοθεὶς
  choice: 委ねられて
  rationale: 受動分詞の意味を保ち、共同体によって主の恵みに託されたことを表す。
- source_word: τῇ χάριτι
  choice: 恵みに
  rationale: 神学的な名詞 χάρις を説明的に言い換えず、そのまま保持する。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: κύριος の称号を保持し、イエスか父なる神かを本文以上に特定しない。
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: 兄弟たちによって
  rationale: 行為者を示すὑπό句を明示し、ἀδελφῶνの文法上の男性複数形を本文に保つ。共同体全体を含み得ることは脚注で示す。
theological_decisions:
- issue: 「主」の指示対象
  choice: 「主」とのみ訳す
  alternative: 「主イエス」または「神」
  rationale: 原文はκύριοςとだけ記しており、指示対象を明示していないため、その曖昧さを保持する。
- issue: 「兄弟たち」の範囲
  choice: 本文では「兄弟たち」とし、包括的な用法の可能性を脚注で示す
  alternative: 「兄弟姉妹」または「信者たち」
  rationale: 原語の男性複数形を保ちながら、初期キリスト教共同体において女性を含む信者全体を指し得ることも伝える。
- issue: 主の恵みに委ねるという表現
  choice: 「主の恵みに委ねられて」
  alternative: 「主の恵みに託されて」
  rationale: 共同体がパウロを主の恵みに委ねたという原文の受動表現を保ち、単なる推薦という意味に限定しない。
translation_notes:
  register: 明快で現代的かつ品位ある標準語を用いた。「しかし」で前節との対照を示し、分詞関係は日本語の語順に整えつつ、誰が誰を何に委ねたかを明示した。
