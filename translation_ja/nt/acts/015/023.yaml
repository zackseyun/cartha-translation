id: ACT.15.23
reference: Acts 15:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: ja
  text: '彼らに託して、次のように書き送った[a]。


    「使徒たちと長老たちである兄弟たち[b]から、アンティオキア、シリア、キリキアにいる異邦人出身の兄弟たち[c]へ。ご挨拶を送ります。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼らの手を通して」。ここでは、手紙を彼らに託して届けさせた、という意味。
    reason: lexical_alternative
  - marker: b
    text: 別の理解では、「兄弟たち」は「長老たち」だけを説明し、「使徒たちと長老である兄弟たち」と読むこともできる。原文では、この「兄弟たち」が長老たちだけにかかるのか、使徒たちと長老たちの双方にかかるのかが明確でない。
    reason: alternative_reading
  - marker: c
    text: ここでの「兄弟たち」は、女性を含む信者共同体全体を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: 次のように書き送った
  rationale: アオリスト分詞は前節の主動詞に伴う行為を表す。日本語では独立した述語にして、手紙の本文を導く自然な表現とした。
- source_word: διὰ χειρὸς αὐτῶν
  choice: 彼らに託して
  rationale: 直訳は「彼らの手を通して」だが、ここでは選ばれた使者たちに手紙を託したことを示す慣用句である。字義的表現は脚注に残した。
- source_word: ἀπόστολοι
  choice: 使徒たち
  rationale: エルサレムの公認された使者・指導者を指す標準的な訳語。
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: 長老である兄弟たち
  rationale: 第二の冠詞がなく、ἀδελφοίをπρεσβύτεροιと同格に取る構文を反映した。「年長の兄弟」という日本語上の誤解を避けつつ、両語の関係を明示する。別の区切り方は脚注に示した。
- source_word: ἀδελφοῖς
  choice: 兄弟たち
  rationale: 原文の男性複数形を保った。この呼称が女性を含む信者共同体全体を指し得ることは脚注で説明した。
- source_word: τοῖς ἐξ ἐθνῶν
  choice: 異邦人出身の
  rationale: ἐξと属格が示す出自を自然な日本語で表し、受取人が異邦諸民族の出身者であることを保持した。
- source_word: χαίρειν
  choice: 挨拶を送ります
  rationale: 命令としての「喜べ」ではなく、古代書簡冒頭の定型的な挨拶として訳した。
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: アンティオキア、シリア、キリキアにいる
  rationale: κατάと対格による場所・分布を、宛先の所在地を示す明瞭な現代日本語にした。
theological_decisions:
- issue: 混合共同体への呼称ἀδελφοί
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原語の語形を本文に保ちながら、実際の指示対象には女性も含まれ得ることを脚注で明らかにし、性別範囲を不当に限定しない。
- issue: πρεσβύτεροι ἀδελφοίの統語関係
  choice: 長老である兄弟たち
  alternative: 使徒たちと長老たち、すなわち兄弟である私たち
  rationale: 無冠詞のἀδελφοίをπρεσβύτεροιへの同格表現として読む形を本文に採った。ただし、ἀδελφοίを使徒と長老の双方にかかる呼びかけ・同格と理解する余地を脚注に残し、送り手の構成を教派的に決めつけない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。書簡の宛名部分は「〜から、〜へ。挨拶を送ります」という日本語の形式に整えた。地名は現代の聖書読者に一般的な表記を用い、原文の統語上の曖昧さは本文と脚注の組み合わせで保持した。
