id: ACT.15.17
reference: Acts 15:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: ja
  text: それは、人々の中の残された者たち、すなわち、わたしの名で呼ばれるすべての異邦人[a][b]が、主を尋ね求めるためである。これらのことを行われる主が、こう言われる[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異邦人」は「国々」とも訳せる。ギリシア語 ἔθνη には両方の意味があるが、ここではエルサレム会議が非ユダヤ人の受け入れを論じているため、「異邦人」とした。
    reason: alternative_reading
  - marker: b
    text: 直訳すると「わたしの名がその上に呼ばれている」。神の名を帯び、神に属する者とされていることを表す言い回し。
    reason: lexical_alternative
  - marker: c
    text: この箇所はアモス書9章12節を、ギリシア語聖書に反映された形で引用している。そこでは、主の名を帯びる国々、すなわち異邦人に焦点が置かれている。
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: それは〜ためである
  rationale: 目的または意図された結果を導く表現として、文脈とのつながりと目的性を自然な日本語で示した。
- source_word: ἐκζητήσωσιν
  choice: 尋ね求める
  rationale: 単なる探索以上に、主を切に求める含みを保ちつつ、過度に強調しない自然な表現とした。
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: 人々のうち残された者たち
  rationale: κατάλοιποι の「残っている者」という意味と、ἀνθρώπων の性別を限定しない人間一般の意味を保った。
- source_word: τὸν κύριον
  choice: 主
  rationale: 聖書の引用における κύριος の標準的で簡潔な訳語を用いた。
- source_word: πάντα τὰ ἔθνη
  choice: すべての異邦人
  rationale: エルサレム会議では非ユダヤ人の受け入れが中心的な論点であるため、文脈上の意味を明確にした。「すべての国々」という可能性は脚注に残した。
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: わたしの名で呼ばれる
  rationale: 神の名による所属・同定を表すギリシア語の慣用句を自然な日本語にした。字義に近い形は脚注で示した。
- source_word: λέγει κύριος ποιῶν ταῦτα
  choice: これらのことを行う主が、こう言われる
  rationale: 預言引用の定型句と、現在分詞が示す主の働きを明確に保った。
theological_decisions:
- issue: ἔθνη が「異邦人」と「国々」のどちらを意味するか
  choice: 異邦人
  alternative: 国々
  rationale: 直近の文脈は非ユダヤ人が神の民に加えられることを扱っているため「異邦人」としたが、預言的背景にある広い意味を脚注に保持した。
- issue: 神の名が人々の上に呼ばれるという表現
  choice: わたしの名で呼ばれる
  alternative: わたしの名がその上に呼ばれている
  rationale: 所属と神との結びつきを示す慣用的意味を読みやすく表現しつつ、原文特有の比喩を脚注で明示した。
- issue: οἱ κατάλοιποι τῶν ἀνθρώπων の集合的・性別非限定の意味
  choice: 人々のうち残された者たち
  alternative: 人類の残りの者
  rationale: 男性だけを指すとの誤解を避け、人間一般の中の残された者という意味を保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、預言引用にふさわしい落ち着きと品位を保った。「人々」「異邦人」により性別および民族的な指示対象を明確にし、原文の目的構文、並列関係、神の名による所属という含意を過度に解釈せず表現した。
