id: ACT.15.1
reference: Acts 15:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: ja
  text: さて、ユダヤから下って来たある人々が、兄弟たち[a]にこう教えていた。「モーセの慣習に従って割礼を受けなければ、あなたがたは救われることができない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「兄弟姉妹」。ギリシア語は「兄弟たち」だが、ここでは信仰者の共同体を男女を含めて指している可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: さて
  rationale: 物語の次の出来事を導く接続語。日本語では「そして」よりも自然に場面の展開を示しつつ、強い因果関係を加えない。
- source_word: τινες
  choice: ある人々
  rationale: 特定されていない複数の人物を表す。「何人か」も可能だが、「ある人々」は後続する行動主体を自然に導入する。
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: ユダヤから下って来た
  rationale: ユダヤからアンティオキアへの移動を表す分詞句。「下る」という原文の地理的・物語的表現を保ち、日本語では連体修飾として自然にした。
- source_word: ἐδίδασκον
  choice: 教えていた
  rationale: 未完了過去の継続的・反復的な側面を保つ。
- source_word: τοὺς ἀδελφοὺς
  choice: 兄弟たち[a]
  rationale: 原文の男性複数形を直接反映する一方、信仰共同体全体を含む可能性を脚注で示す。
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: 割礼を受けなければ
  rationale: 否定条件と受動形を、明瞭で自然な現代日本語にした。
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: モーセの慣習に従って
  rationale: ἔθοςを「慣習」とし、与格が示す基準・規範を「に従って」で表した。「律法」と言い換えず、原文の語彙を保つ。
- source_word: οὐ δύνασθε σωθῆναι
  choice: あなたがたは救われない
  rationale: 能力・可能性の否定を日本語として自然に表し、この論争でのσωθῆναιの救済論的意味を「救われる」で保った。
theological_decisions:
- issue: エルサレム会議をめぐる論争におけるσωθῆναιの意味
  choice: 救われない
  alternative: 助け出されない
  rationale: 文脈は割礼が救いに必要かどうかをめぐる論争であり、「救われる」が語の救済論的な力を保つ。話者たちの主張として提示し、その正当性を翻訳自体で判定しない。
- issue: ἀδελφοὺςの包摂範囲
  choice: 兄弟たち[a]
  alternative: 兄弟姉妹たち／信者たち
  rationale: 本文では原文の男性複数形を保ちつつ、当時の信仰共同体を包括的に指す可能性を脚注で明示する。
translation_notes:
  register: 明瞭な現代標準語を用い、物語文として自然でありながら荘重さを保った。「モーセの慣習」「割礼」「救われる」という重要語は説明的に言い換えず、原文の神学的緊張を保持した。
