  to: パウロとバルナバと彼らとの間に少なからぬ対立と論争が起こったので[a]、人々は、この問題[c]についてエルサレムの使徒たちと長老たちのもとへ、パウロとバルナバ、およびその中からほかの数人を上らせること[b]に決めた。
