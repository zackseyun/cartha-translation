id: ACT.15.2
reference: Acts 15:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: ja
  text: パウロとバルナバと彼らとの間に少なからぬ対立と論争が起こったので[a]、人々は、この問題[c]についてエルサレムの使徒たちと長老たちのもとへ、パウロとバルナバ、およびその中からほかの数人を上らせること[b]に決めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「少なくない対立と論争」。否定を用いて強く肯定する表現で、争いが深刻であったことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「上る」は、エルサレムへ向かう旅についてギリシア語で一般に用いられる表現。
    reason: cultural_note
  - marker: c
    text: 「この件」または「この論点」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: ところが、…起こったので
  rationale: 属格絶対構文の状況・原因的な働きを自然な日本語で表し、δέは直前の主張に続く展開として「ところが」とした。
- source_word: στάσεως καὶ ζητήσεως
  choice: 対立と論争
  rationale: στάσιςの深刻な不和・対立と、ζήτησιςの言葉による論議を区別しつつ、対になった表現を保った。
- source_word: οὐκ ὀλίγης
  choice: 少なからぬ
  rationale: 規模や深刻さを強調する原文の緩叙法を保った。
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: パウロとバルナバと彼らとの間に
  rationale: 論争の双方を示す構文として訳した。「彼ら」は直前の節でユダヤから来た人々を指す。
- source_word: ἔταξαν
  choice: 上らせることに決めた
  rationale: 共同体が代表者を選んで派遣する決定を表す。制度的な含意を必要以上に強める「任命した」は避けた。
- source_word: ἀναβαίνειν
  choice: 上らせる
  rationale: エルサレムへの移動に慣用的に用いられる「上る」という原語の表現を保持した。
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: 自分たちの中からほかの数人
  rationale: 地元の集団から追加の代表者が選ばれたことを、性別などを補わずに表した。
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: 使徒たちと長老たち
  rationale: 使徒言行録における認知された呼称を、定着した日本語で訳した。
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: この問題について
  rationale: 論争の対象となっている事柄を、明瞭で現代的な表現にした。
theological_decisions:
- issue: 論争当事者の特定
  choice: パウロとバルナバと「彼ら」との間の論争とした。
  alternative: パウロとバルナバが彼らと激しく論じ合った、と動作主体をより明示する訳。
  rationale: 「彼ら」は直前の節でユダヤから来た人々を指すと読めるが、原文どおり代名詞を保ち、対立の責任を一方だけに帰さないようにした。
- issue: ἔταξανの共同体的・制度的含意
  choice: 人々が代表者たちを上らせることに決めた。
  alternative: 人々が代表者たちを任命した／上るよう定めた。
  rationale: 共同体による秩序ある派遣を示しながら、特定の教会政治制度まで原文に読み込まない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「少なからぬ」「上る」によって原文の修辞と慣用表現を残した。「使徒」「長老」は定着した聖書用語として保持し、全体は公的朗読にも適する落ち着いた文体とした。
