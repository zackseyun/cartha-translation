id: ACT.15.22
reference: Acts 15:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: ja
  text: そこで、使徒たちと長老たちは、教会全体とともに、自分たちの中から何人かの男性を選び、パウロとバルナバとともにアンティオキアへ遣わすのがよいと判断した。選ばれたのは、バルサバと呼ばれるユダとシラスで、二人は兄弟たち[a]の間で指導的な立場にあった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は、女性を含む信者の共同体全体を指している可能性が高い。
    reason: cultural_note
  - marker: b
    text: 別訳「兄弟たちの間の指導者であった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξε
  choice: よいと判断した
  rationale: 協議の結果として適切だと認めたという語感を保ちつつ、単なる印象にも形式的な決議にも偏らない自然な日本語とした。
- source_word: πρεσβυτέροις
  choice: 長老たち
  rationale: 初代教会の指導者を表す、日本語聖書で定着した明瞭な表現。
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: 教会全体とともに
  rationale: 使徒と長老だけでなく、エルサレムの信仰共同体全体がこの判断に加わったことを、特定の教会政治制度に結び付けずに示す。
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: 自分たちの中から何人かの男性を選び
  rationale: ἄνδραςの男性を指す意味と、ἐξ αὐτῶνの共同体内部からの選出という意味を明示した。日本語として人数が複数であることも自然に伝える。
- source_word: πέμψαι εἰς Ἀντιόχειαν σὺν τῷ Παύλῳ καὶ Βαρναβᾷ
  choice: パウロとバルナバに同行させてアンティオキアへ遣わす
  rationale: σύνの同伴関係を明確にし、遣わされる者たちがパウロとバルナバに同行するという関係を自然な日本語で表した。
- source_word: Ἰούδαν τὸν καλούμενον Βαρσαββᾶν
  choice: バルサバと呼ばれるユダ
  rationale: 分詞καλούμενονの説明的な意味を簡潔に保った。
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: 二人は兄弟たちの間で指導的な立場にあった
  rationale: ἡγουμένουςが示す、共同体内で認められた指導的役割を表しつつ、必ずしも正式な役職名であったとは断定しない。
theological_decisions:
- issue: 決定への教会全体の参与範囲
  choice: 使徒たちと長老たちが、教会全体とともに判断したと訳す
  alternative: 使徒と長老だけが正式に決め、教会全体は同席したにすぎないと読む
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳは、教会全体をἔδοξε以下の判断と行動に参与する者として含めるのが最も自然である。ただし、特定の教会統治形態までは本文に持ち込まない。
- issue: ἀδελφοῖςの範囲
  choice: 本文では「兄弟たち」とし、共同体全体を指し得ることを脚注で示す
  alternative: 本文で「兄弟姉妹」または「信者たち」とする
  rationale: 原文の男性複数形を本文に保ちながら、初期キリスト教の用法では女性を含む信仰共同体全体を指し得るという文脈上の含意も失わない。
- issue: ἡγουμένουςが正式な役職名かどうか
  choice: 「指導的な立場にあった」と訳す
  alternative: 「指導者であった」と訳す
  rationale: 共同体内で実際に指導的役割を担っていたことは示すが、本文が明記しない固定的・制度的な役職名に限定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、教会文書としての落ち着きと品位を保った。「よいと判断した」により共同の熟慮を表し、「指導的な立場」により役割の実質を示しつつ制度化しすぎない表現とした。
