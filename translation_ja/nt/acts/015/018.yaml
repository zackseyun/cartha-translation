translation:
  language: ja
  text: 昔から知られている[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、より長く「永遠の昔から知られている」、または「これらのことを昔から知らせておられる方」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: 知られている
  rationale: この無動詞節で述語的に働く形容詞を、受動的な状態を表す自然な現代日本語で訳す。「知らせている」では原文に明示されない動作の意味を加えるため避けた。
- source_word: ἀπ’
  choice: から
  rationale: 時間的な起点を示すἀπόの基本的な意味を簡潔に表す。
- source_word: αἰῶνος
  choice: 昔
  rationale: ここでは遠い過去・古くからの時を示す慣用的用法として理解し、「昔から」と自然に訳す。「永遠」は本文の短い異読本文以上に時間範囲を限定し得るため、脚注に残す。
theological_decisions:
- issue: この圧縮された節における、知られていることの時間的範囲
  choice: 古くから知られているという簡潔な陳述として訳し、永遠の予知についての強い教理的言い換えには広げない。
  alternative: 「永遠の昔から知られている」、または「これらのことを昔から知らせておられる方」
  rationale: SBLGNT本文はγνωστὰ ἀπ’ αἰῶνοςと非常に短い。したがって、その簡潔さを保ち、長い異読や神学的推論に由来する語句を本文へ補わない。異読は脚注で示す。
translation_notes:
  register: 簡潔で格調を保ちつつ、一般の読者にも理解しやすい現代標準日本語。「昔から」は原文の圧縮された表現を自然に再現する。
