source:
  edition: SBLGNT
  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: ja
  text: しばらく滞在した後、彼らは兄弟たち[a]から平安のうちに、自分たちを遣わした人々のもとへ送り出された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは信仰共同体全体を含めて指していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: しばらく滞在した後
  rationale: 直訳的には「時を過ごして」だが、一定期間その場所にとどまるという慣用的な意味を、自然な現代日本語で表した。ギリシア語に明示されない場所を示す語は補わなかった。
- source_word: δὲ
  choice: （無訳）
  rationale: 物語を穏やかに進める接続辞であり、日本語では明示しないほうが自然なため、文の流れによって表した。
- source_word: ἀπελύθησαν
  choice: 送り出され
  rationale: 拘束からの解放ではなく、共同体が使者たちを丁重に送り出す場面なので、「解放された」「退出を許された」より文脈に適する。受動態も保持した。
- source_word: μετ’ εἰρήνης
  choice: 平安のうちに
  rationale: 争いなく、共同体の好意と祝福を伴って送り出されたことを示す慣用句として、聖書的な響きと自然さを両立させた。
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: 兄弟たち
  rationale: 原文の男性複数形を本文に反映した。ただし、この文脈では信仰共同体全体を包括的に指す可能性が高いため、脚注で示した。
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: 自分たちを遣わした人々のもとへ帰って行った
  rationale: 冠詞付き分詞を「遣わした人々」とし、πρόςの到達方向を「もとへ」で表した。「帰って行った」の「帰って」は文脈上の帰還を自然に示す補足である。
theological_decisions:
- issue: ἀδελφοίの包括的意味
  choice: 本文では「兄弟たち」とし、脚注で「兄弟姉妹」を含む共同体を指しうることを示す
  alternative: 本文で「兄弟姉妹」または「信者たち」と訳す
  rationale: 原文の文法上の男性形を見える形で保ちながら、当時の用法における共同体全体への包括的な指示も失わないため。教派固有の解釈には依存しない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「平安のうちに」「遣わした」は聖書本文にふさわしい語感を保ちつつ、一般の読者にも理解できる表現とした。
