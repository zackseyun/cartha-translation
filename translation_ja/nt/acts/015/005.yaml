  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: ja
  text: しかし、ファリサイ派[a]に属し、信じるようになっていた者たちの中から、ある者たちが立ち上がって言った。「彼らに割礼を施し、モーセの律法を守るよう命じなければならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファリサイ派という一派」。ここで用いられているギリシア語は、認知された集団や学派を指し、後代の専門的な意味での「異端」とは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: 立ち上がって
  rationale: 集会の中で発言するために立つという物語上の動作を、意味を加えすぎず自然な日本語で表す。
- source_word: τινες
  choice: 数人
  rationale: 不定複数代名詞を自然に表し、原文に明示されない性別は付加しない。
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: ファリサイ派の者たちのうち
  rationale: αἵρεσιςを、後代の教義的な「異端」ではなく、認知された集団・学派への所属として訳す。属格とἀπόが示す集団内の出自も「の者たちのうち」で表した。
- source_word: πεπιστευκότες
  choice: 信じるようになっていた
  rationale: 完了分詞の、以前に信じるに至り、その状態にあるという含みを保ち、単に「信者」と名詞化して本文の緊張を弱めない。
- source_word: λέγοντες
  choice: 言った
  rationale: 発言内容を導入する中立的な表現とし、原文にない「主張した」「強く求めた」などの調子を加えない。
- source_word: δεῖ
  choice: なければならない
  rationale: 必要性を表す非人称動詞の強さを自然な日本語で保ち、その必要性の根拠や主体は原文同様に明示しない。
- source_word: περιτέμνειν αὐτούς
  choice: 彼らに割礼を施し
  rationale: 対象を明示した能動不定詞を直接的に訳す。文脈上の「彼ら」は異邦人から信仰に入った者たちを指すが、本文では代名詞のまま保つ。
- source_word: παραγγέλλειν τε τηρεῖν
  choice: 守るよう命じ
  rationale: παραγγέλλωの権威ある命令の力と、τηρέωの律法を守り行う意味を簡潔に表す。τεは日本語の構文内で二つの要求を結びつける。
- source_word: τὸν νόμον Μωϋσέως
  choice: モーセの律法
  rationale: 属格構文を明瞭かつ慣用的に訳し、専門用語的な言い換えを避ける。
theological_decisions:
- issue: ユダヤ教内の集団を指すαἵρεσιςの訳語
  choice: 派
  alternative: 宗派
  rationale: ここでは後代のキリスト教用語としての「異端」ではなく、ファリサイ派という認知された集団を指す。「派」は現代日本語で自然であり、否定的な教義判断を持ち込まない。別訳の可能性は脚注で示す。
- issue: πεπιστευκότεςが示す信仰と律法要求の併存
  choice: 信じるようになっていた
  alternative: 信者となっていた
  rationale: 彼らが信じた者でありながら、異邦人への割礼と律法遵守を要求したという本文の歴史的・神学的緊張を解消せず、完了分詞を動詞的に表す。
- issue: δεῖが表す必要性の根拠
  choice: なければならない
  alternative: 必要がある
  rationale: 話者たちの強い必要性の主張を保つ一方、それが神の命令なのか彼ら自身の判断なのかを訳文で決めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、集会での発言として読める簡潔で品位ある文体にした。引用文では二つの要求を自然にまとめつつ、割礼を施すことと律法を守るよう命じることの双方を保持した。
