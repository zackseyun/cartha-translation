  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: ja
  text: リダとシャロン[a]に住む人々は皆、彼を見て、主に立ち返った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シャロン地方」または「シャロン平野」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「主の方へ向きを変えた」という意味。「主に帰った」または、より解釈を加えて「主を信じるようになった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: 見て
  rationale: アオリスト形は、癒やされたアイネアを人々が実際に見たことを表す。「目にした」も可能だが、「見て」が簡明で自然。後続の動作と「見て、…立ち返った」とつないだ。
- source_word: πάντες οἱ κατοικοῦντες
  choice: 住む人々は皆
  rationale: 冠詞付き現在分詞の実質名詞用法を自然な現代日本語で表し、πάντεςの包括性を「皆」で保持した。
- source_word: Λύδδα
  choice: リダ
  rationale: 地名の日本語における標準的な音写。
- source_word: τὸν Σαρῶνα
  choice: シャロン
  rationale: シャロン地方またはシャロン平野を指す地名。本文では簡潔に音写し、ギリシア語の冠詞は日本語に再現しない。地域・平野という含みは脚注に示した。
- source_word: οἵτινες
  choice: （人々は皆）…立ち返った
  rationale: 先行する住民たちを受け、その結果としての行動を述べる。日本語では独立した関係節を立てず、一続きの述語として自然に表した。
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: 主に立ち返った
  rationale: 主への方向転換、すなわち悔い改めと信仰の応答を表す聖書的な言い回し。「改宗した」のように後代の専門用語へ狭めず、原文の方向性の比喩を保った。
- source_word: κύριον
  choice: 主
  rationale: 文脈上は復活したイエスを指すと考えられるが、原文どおり称号だけを訳し、「主イエス」とは補わない。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文では「主」とのみ訳す。
  alternative: 「主イエス」
  rationale: 使徒言行録9章の文脈ではイエスを指す可能性が高いが、ギリシア語本文は τὸν κύριον とだけ記すため、指示対象を本文中で明示的に補わない。
- issue: ἐπέστρεψαν の意味合い
  choice: 「立ち返った」
  alternative: 「向きを変えた」「帰依した」「改宗した」
  rationale: 主への霊的な方向転換を保ちつつ、制度的な所属変更や特定の回心論を過度に持ち込まない。「立ち返る」は以前の信仰状態への復帰を連想させる余地もあるため、語義の幅を脚注で示す。
- issue: πάντες と οἵτινες の関係
  choice: リダとシャロンに住む人々は皆、見て、立ち返ったと読む。
  alternative: 住民のうち、主に立ち返った者たちが彼を見たと限定的に読む。
  rationale: 文法上、οἵτινες は直前の πάντες οἱ κατοικοῦντες 全体を受けるのが最も自然であり、物語上も包括的な結果として提示されている。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」は直前の文脈に登場する、癒やされたアイネアを受ける。地名は一般的な聖書日本語の音写を用い、回心を表す句は教派固有の専門語を避けた。
