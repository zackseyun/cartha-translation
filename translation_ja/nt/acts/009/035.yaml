  naturalness: 明瞭な現代標準日本語であり、地名の扱い、読点、文の流れはいずれも自然である。「立ち返った」は聖書文脈で広く通用する日本語で、本文の格調を不必要に古風にはしていない。
  terminology: 「主」は κύριος の適切な基本訳である。「立ち返った」は ἐπέστρεψαν の方向転換・回心の含意を保ちつつ、「改宗した」などの制度的・教理的に狭い表現を避けている。脚注bは『帰った』という復帰の含みや解釈的な表現を代替案として区別しており、本文に余分な神学的限定を加えていない。
