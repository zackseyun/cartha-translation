  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: ja
  text: 彼が旅をしていて、ダマスコに近づいていたとき、突然、天[a]からの光が彼の周りを照らした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「空」。ギリシア語のοὐρανόςは「天」と「空」のどちらも意味しうるが、ここでは光の神的な源を示す「天」の可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: 彼が旅をして
  rationale: ἐν＋冠詞付き不定詞が表す同時進行を、現代日本語で自然な「旅をして」で表した。δέは穏やかな物語上の接続であり、独立した語を補わなくても文脈上十分に伝わる。
- source_word: ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: ダマスコに近づいたときのことである
  rationale: ルカに特徴的なἐγένετοの出来事導入を「ときのことである」で残しつつ、現在不定詞ἐγγίζεινが示す接近途上の場面を自然な日本語にした。与格は到達ではなく、ダマスコへの接近を示す。
- source_word: ἐξαίφνης τε
  choice: 突然
  rationale: 出来事の急な発生を明確に表す。τεの軽い接続関係は、前後する二文の連続によって自然に示した。
- source_word: περιήστραψεν
  choice: 彼の周りにぱっと輝いた
  rationale: περίを含む動詞が示す、周囲を包むように光る様子と、アオリストおよび文脈上の突発性を「周りにぱっと輝いた」で表した。
- source_word: φῶς
  choice: 光
  rationale: 日本語では不定冠詞に相当する語を補わず、「光」とするのが自然である。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 啓示的な場面であるため、οὐρανόςの主要な意味として「天」を採用した。ただし「空」という語義も脚注に残した。
theological_decisions:
- issue: 啓示的文脈におけるοὐρανόςの意味
  choice: 天から
  alternative: 空から
  rationale: ルカの物語では神的な顕現として描かれているため、「天」が文脈上もっとも適切である。一方、語そのものには「空」の意味もあるため、代替訳を脚注で明示した。
translation_notes:
  register: 明快な現代標準語を用いながら、物語導入のἐγένετοを「ときのことである」で可視化した。荘重さを保ちつつ過度に古風な表現は避け、光が突然周囲を包む動きを「ぱっと輝いた」で伝えた。脚注記号は該当語「天」の直後に置いた。
