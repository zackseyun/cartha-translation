source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: ja
  text: リダはヨッパに近かったので、弟子たちは、ペテロがそこにいると聞き、二人の人を彼のもとに遣わして、「ためらわずに、私たちのところまで来てください」[a]と頼んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「遅れずに、私たちのところまで来てください」。この動詞は、ためらうことも、ぐずぐずして遅れることも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: リダはヨッパに近かったので
  rationale: 属格独立構文が示す背景事情を自然な日本語で表し、弟子たちが使者を送った理由として読める文脈上の因果関係も保った。δὲはここでは独立した「さて」とせず、文の流れに溶け込ませた。
- source_word: Λύδδας / Ἰόππῃ
  choice: リダ／ヨッパ
  rationale: 新約聖書のギリシア語地名に基づく、日本語で定着した音写を用いた。
- source_word: οἱ μαθηταί
  choice: 弟子たち
  rationale: 使徒言行録における信者共同体の成員を指す標準的で明確な訳語。
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: ペテロがそこにいると聞き
  rationale: アオリスト分詞の先行的な事情を簡潔に示した。「そこ」は直前のリダを指す。
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: 二人の人を彼のもとに遣わして
  rationale: 使者として送る行為を、文脈にふさわしい自然で品位ある表現にした。ἄνδραςは成人男性とも解し得るが、この箇所では性別を過度に前景化しない「人」とした。
- source_word: παρακαλοῦντες
  choice: 頼んだ
  rationale: ここでは懇願ないし強い要請を表す。日本語の直接話法と組み合わせて、誇張せず切実な依頼を伝える。
- source_word: Μὴ ὀκνήσῃς
  choice: ためらわずに
  rationale: ὀκνέωの中心的な意味である「ためらう、尻込みする」を直接表した。文脈上は「遅れずに」の含みもあり、その語義幅を脚注で示した。
- source_word: διελθεῖν ἕως ἡμῶν
  choice: 私たちのところまで来てください
  rationale: 話し手のいるヨッパへの移動を、依頼として自然な日本語で表した。ἕωςの「…まで」のニュアンスも保持した。
theological_decisions: []
