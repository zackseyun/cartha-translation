id: ACT.9.41
reference: Acts 9:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: ja
  text: そしてペトロは彼女に手を差し伸べ、彼女を起き上がらせた。[a] それから、聖なる者たちとやもめたちを呼び、彼女が生きている姿を彼らに見せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立たせた」または「助け起こした」とも訳せる。原語は、人を起こす、あるいは立たせることを表し、この文脈では死者が生き返ることを表す言葉とも響き合っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: 彼女に手を差し伸べ
  rationale: 直訳的な「手を与える」では不自然なため、助け起こすために手を出すというギリシア語の所作を、明瞭で自然な現代日本語にした。
- source_word: ἀνέστησεν
  choice: 彼女を起き上がらせた
  rationale: 「起こす・立たせる」という使役的意味を保ちつつ、直前に死から生き返った文脈に響く表現とした。復活そのものをこの動詞だけに過度に担わせず、身体を起こす動作も伝える。
- source_word: φωνήσας
  choice: 呼び
  rationale: 聖なる者たちとやもめたちをその場へ呼び寄せる先行動作を簡潔に表した。
- source_word: τοὺς ἁγίους
  choice: 聖なる者たち
  rationale: 初期キリスト者を指す呼称の語義を保持した。「信者たち」は分かりやすいが、原語の「聖」の要素を失うため採らなかった。
- source_word: τὰς χήρας
  choice: やもめたち
  rationale: 前の文脈で重要な役割を持つ女性たちを、聖なる者たちとは別に挙げる原文の区別を保った。
- source_word: παρέστησεν αὐτὴν ζῶσαν
  choice: 彼女が生きている姿を彼らに見せた
  rationale: παρίστημιの「人前に出す、提示する」と、ζῶσανの述語的な「生きている」を自然な日本語で一体として表現した。単に「見せた」だけでなく、「生きている姿」によって奇跡の結果を明確にした。
theological_decisions:
- issue: 復活の文脈における ἀνέστησεν の表現
  choice: 起き上がらせた
  alternative: 立たせた／助け起こした／よみがえらせた
  rationale: この時点で彼女が生き返る出来事は前節に描かれており、ここではペトロが手を差し伸べて身体を起こす動作が前面にある。ただし「起き上がらせた」は復活語彙との響きを残す。「よみがえらせた」では、この節の動作を復活そのものと断定して重ねるおそれがある。
translation_notes:
  register: 明瞭で品位ある現代標準語。「聖徒」は教会用語としては定着しているが、一般読者にも語義が伝わるよう「聖なる者たち」とした。「寡婦」より自然で物語調になじむ「やもめ」を用いた。
