  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: ja
  text: ペトロは彼に言った。「アイネア、メシアであるイエスがあなたを癒やしてくださる。起きて、自分で寝床を整えなさい。」すると彼は、すぐに起き上がった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰᾶταί
  choice: 癒やしてくださる
  rationale: 現在形の宣言として、癒やしがイエスによって行われることを自然な日本語で表した。完了形に限定せず、発話によって現実となる力も保つ。
- source_word: Ἰησοῦς Χριστός
  choice: イエス・キリスト
  rationale: 日本語で定着した称号を含む表記。ここでのΧριστόςの称号性を失うわけではなく、現代日本語の聖書用語として明瞭である。
- source_word: ἀνάστηθι
  choice: 起きて
  rationale: 寝たきりの人物への命令として自然であり、続く寝床を整える行為にも滑らかにつながる。
- source_word: στρῶσον σεαυτῷ
  choice: 自分で寝床を整えなさい
  rationale: στρώννυμιの『寝具を広げる、整える』という意味と、σεαυτῷが示す本人の関与をともに表す。『自分のために』よりも、この文脈では回復した本人が自ら行う意味が自然に伝わる。
- source_word: εὐθέως
  choice: すぐに
  rationale: 即時性を、明瞭で自然な現代日本語で示す。
- source_word: ἀνέστη
  choice: 起き上がった
  rationale: 命令への即座の応答と身体的な起立を自然に表す。
- source_word: Αἰνέα
  choice: アイネア
  rationale: ギリシア語の人名を日本語で一般的な形に音写した。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: イエス・キリスト
  alternative: メシアであるイエス
  rationale: Χριστόςは『油注がれた者／メシア』という称号だが、日本語では『イエス・キリスト』が称号を含む定着表現である。本文の簡潔な癒やしの宣言を保ち、特定の教派的解釈を加えない。
translation_notes:
  register: 明瞭な現代標準日本語。会話は自然にしつつ、奇跡の宣言にふさわしい簡潔で品位ある調子を保った。接続詞καίは文脈上『そこで』『すると』と訳し分けた。
