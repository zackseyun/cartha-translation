  yaml_path: translation/nt/acts/009/019.yaml
  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: ja
  text: 食事を取ると、サウロは力を取り戻した。それから数日の間、ダマスコにいる弟子たちと共に過ごした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: 食事を取ると
  rationale: アオリスト分詞による先行動作を自然な日本語で示す。τροφήはここでは食物・食事を指し、実際に食べたことを含意する。
- source_word: ἐνίσχυσεν
  choice: 力を取り戻した
  rationale: 絶食で衰弱していた文脈に即し、自動詞的・結果的な意味を明瞭に表す。
- source_word: Ἐγένετο δὲ
  choice: それから…過ごした
  rationale: ここでは出来事の発生を強調するより、物語を次へ進める移行表現として機能する。日本語では滞在を表す「過ごした」に組み込むと自然である。
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: ダマスコにいる弟子たちと共に
  rationale: μετά＋属格の交わり・同行の意味と、弟子たちの所在地を保つ。
- source_word: ἡμέρας τινάς
  choice: 数日の間
  rationale: 期間を表す対格で、日数を特定しない比較的短い期間を自然に示す。
