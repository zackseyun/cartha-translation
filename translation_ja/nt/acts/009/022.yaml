  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: ja
  text: しかしサウロはますます力を増していき、イエスこそメシア[a]であることを論証することで、ダマスコに住むユダヤ人たちを当惑させていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語「クリストス」は「油を注がれた者」を意味する称号。ここではそのユダヤ的なメシアの意味を示すため、「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: ますます力を増し
  rationale: 比較の強まりと未完了時制の継続的な進展を、自然な現代日本語で表す。受動・中動の含みを過度に限定せず、力の源も明示しない。
- source_word: συνέχυννεν
  choice: 困惑させた
  rationale: 議論を通して相手を混乱させ、応答に窮させる強い効果を表す。単なる心理的な「混乱」より文脈に適する。
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: ダマスコに住むユダヤ人たち
  rationale: 対象がユダヤ人一般ではなく、ダマスコ在住の人々であることを明確に保つ。
- source_word: συμβιβάζων
  choice: 論証して
  rationale: 諸点を結び合わせて結論を示すという、議論上・証明上の働きを簡潔に表す。
- source_word: οὗτός ἐστιν ὁ χριστός
  choice: イエスこそメシアである
  rationale: οὗτόςの指示的・強調的な力を「こそ」で表す。日本語では文脈上の指示対象を「この方」とするより「イエス」と明示した方が自然であり、意味も明確になる。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名的な「キリスト」ではなく、約束された油注がれた者を指す称号として用いられている。
theological_decisions:
- issue: Χριστόςという称号の訳
  choice: メシア
  alternative: キリスト
  rationale: 定冠詞を伴う称号で、イエスが待望の油注がれた者であるとの主張を表すため、「メシア」と訳す。別訳も脚注に示す。
- issue: サウロが増した「力」の源
  choice: 源を明示せず「力を増し」
  alternative: 力づけられ
  rationale: ἐνεδυναμοῦτοは中動・受動の形であり、神による力づけを含み得るが、本文自体は行為者を明記しない。その曖昧さを保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、議論の緊張感を保った。「論証して」はやや改まった語だが、συμβιβάζωνの論理的・証明的な含意を正確かつ簡潔に伝える。
