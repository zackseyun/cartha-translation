  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: ja
  text: そのころ、彼女は病気になり、死んだ。人々は彼女を洗ってから、階上の部屋[a]に安置した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上の間」とも訳せる。ギリシア語は、単に建物の上階にある部屋を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: そのころ
  rationale: 出来事を導入するἐγένετοと穏やかな接続を示すδὲを、日本語で不自然に逐語訳せず、時間表現と合わせて簡潔な物語の移行として表した。
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: 彼女は病気になり、死んだ
  rationale: ギリシア語では対格不定詞構文だが、現代日本語では二つの出来事を順に述べる形が自然であり、発病後に死亡したという流れも保たれる。
- source_word: λούσαντες
  choice: 彼女を洗ってから
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、「洗ってから」とした。文脈上は死後に体を洗うことだが、本文では原文どおり目的語を「彼女」としている。
- source_word: ἔθηκαν αὐτὴν
  choice: 安置した
  rationale: τίθημιの「置く」という意味を、死者を部屋に置く葬送前の文脈に即して、自然で丁重な日本語にした。
- source_word: ἐν ὑπερῴῳ
  choice: 階上の部屋
  rationale: ὑπερῷονは建物の上階にある部屋を指す。「階上の部屋」は特定の著名な部屋を暗示せず、空間的意味を明確に伝える。
theological_decisions:
- issue: ὑπερῴῳを伝統的な「上の間」とするか、一般的な上階の部屋として表すか
  choice: 階上の部屋
  alternative: 上の間／二階の部屋
  rationale: 原文は冠詞を伴わず、特定の場所ではなく上階にある部屋を示す。「階上の部屋」は建物が厳密に二階建てだったと限定せず、原文の幅を保つ。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、死者の扱いには「安置した」という丁重で自然な語を選んだ。注記記号は、英語相談層で誤って「彼女を洗って」の後に置かれているが、注の対象である「階上の部屋」の直後に置いた。
