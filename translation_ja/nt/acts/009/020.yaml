id: ACT.9.20
reference: Acts 9:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: ja
  text: そしてすぐに諸会堂で、イエスこそ神の子であると宣べ伝え始めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: すぐに
  rationale: 行動の即時性を、現代日本語として自然で明瞭に表す。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 諸会堂で
  rationale: 場所を表す前置詞句と複数形を保ち、複数のユダヤ教会堂での活動であることを示す。
- source_word: ἐκήρυσσεν
  choice: 宣べ伝え始めた
  rationale: κηρύσσωの公に告げ知らせる意味を「宣べ伝える」で表し、直前の「すぐに」と物語上の新たな行動の開始を自然に示す。未完了過去の継続的側面とも矛盾しない。
- source_word: τὸν Ἰησοῦν … ὅτι οὗτός ἐστιν
  choice: イエスこそ…であると
  rationale: 「イエス」を宣教の対象・内容として保ちつつ、οὗτόςの指示的・強調的な力を係助詞「こそ」で自然に表す。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 定冠詞を伴うキリスト論的称号を、日本語で定着した簡潔かつ直接的な表現にする。
theological_decisions:
- issue: サウロの宣教におけるキリスト論的称号
  choice: 神の子
  alternative: 神の御子
  rationale: ὁ υἱὸς τοῦ θεοῦを解釈的に拡張せず直接訳す。「御子」も可能だが、「神の子」のほうが原文の語構成を明瞭に保ち、一般読者にも理解しやすい。
- issue: οὗτόςの強調
  choice: イエスこそ
  alternative: この方が
  rationale: 単なる代名詞に弱めず、直前のイエスを特定して「この方こそ」と告白する力を日本語の「こそ」で保つ。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で格調を保ちつつ、教会内だけで通じる過度に特殊な表現は避けた。「宣べ伝える」は公的宣教を表す聖書語として現在も理解可能であり、κηρύσσωの意味に適している。
