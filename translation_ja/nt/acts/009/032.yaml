  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: ja
  text: さて、ペテロが各地[a]を巡り歩いていたとき、リダに住む聖徒たちのところにも下って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「すべてのものを通って」。何を指すかは原文で明示されていないが、文脈上、ペテロが諸地域、または諸共同体を巡回していたことを指すと理解される。
    reason: διὰ πάντωνの省略された指示対象について、本文の自然な文脈的訳を保ちつつ原文の曖昧さを明示するため。
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: 各地を巡り歩く中で
  rationale: πάντωνが何を指すかは文法上明示されていないが、文脈上は人々全員よりも諸地域を巡回することを表すと考えられる。日本語では不自然な「すべてを通って」を避けつつ、その巡回の意味を簡潔に示した。
- source_word: τοὺς ἁγίους
  choice: 聖徒たち
  rationale: 初期キリスト者を指す定着した聖書語であり、「聖なる者たち」という原語の含意も保つ。
- source_word: κατελθεῖν
  choice: 下って行った
  rationale: 移動を表す原語の方向性を保持した。
- source_word: Λύδδα
  choice: リダ
  rationale: 地名の現代日本語における一般的な聖書表記を採用した。
theological_decisions:
- issue: 「聖徒たち」の指示対象
  choice: 聖徒たち
  alternative: 信徒たち／聖なる者たち
  rationale: 語の神学的・共同体的な呼称を弱めず、特定教派に限定されない伝統的表現を用いた。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、物語の移行を示す δέ は「さて」で表した。文体は平易だが、聖書本文としての品位を保っている。
