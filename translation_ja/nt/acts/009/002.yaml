id: ACT.9.2
reference: Acts 9:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: ja
  text: そして、ダマスコの諸会堂宛ての手紙を彼に求めた。それは、『道』[a]に属する者を見つけたなら、男であれ女であれ、縛ったままエルサレムへ連行するためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「道」は、初期のキリスト教運動を指す呼び名。「道に属する者」または「この道に従う者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: 彼に求めた
  rationale: αἰτέωとπαρά＋属格の組み合わせを、依頼先を明示する自然な日本語で表した。文脈上の人物は前節の大祭司だが、本節のギリシア語どおり代名詞を保った。
- source_word: ἐπιστολὰς
  choice: 手紙
  rationale: 文脈上は協力や権限を求める書状だが、語自体が明示する範囲を越えて「逮捕状」などとはしなかった。
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: ダマスコにある諸会堂への
  rationale: 二つの前置詞句の関係を明確にし、手紙の宛先がダマスコ所在の複数の会堂であることを自然な日本語で示した。
- source_word: ὅπως ἐάν
  choice: それは、……見つけたなら、……するため
  rationale: ὅπωςの目的とἐάν＋接続法の条件性をともに保持した。
- source_word: τινας τῆς ὁδοῦ ὄντας
  choice: この道に属する者
  rationale: 属格を伴う存在表現を「属する」と訳し、初期キリスト教運動の呼称「道」を説明的に言い換えすぎないようにした。日本語では指示性が自然に伝わるよう「この道」とした。
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: 男でも女でも
  rationale: 男女双方が対象であることを明示しつつ、条件文の流れに合う自然な日本語とした。
- source_word: δεδεμένους ἀγάγῃ
  choice: 縛って……連行する
  rationale: δέωの拘束状態とἄγωの強制的移送という文脈を簡潔に表した。「鎖」は原文に明示されないため加えなかった。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムへ
  rationale: 都市を目的地とするεἰςを、自然な方向表現「へ」で訳した。
theological_decisions:
- issue: τῆς ὁδοῦという初期の運動名の訳し方
  choice: この道に属する者
  alternative: 「道」の者、この道に従う者
  rationale: 「道」という歴史的呼称を保ち、「キリスト教徒」など後代の一般名称に置き換えなかった。「属する」は原文の属格関係を示し、「従う」より解釈を抑えている。
- issue: ἄνδρας τε καὶ γυναῖκαςの明示性
  choice: 男でも女でも
  alternative: 男女を問わず、男も女も
  rationale: サウロの拘束対象が男性だけでなく女性にも及んだという原文の強調を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「諸会堂」は複数形を簡潔に示すため採用。「連行する」は逮捕後の強制的な移送という文脈を自然に伝える。脚注標識は該当表現の直後ではなく節末に置き、本文の読みやすさを優先した。
