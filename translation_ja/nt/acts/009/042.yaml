  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: ja
  text: このことはヨッパ全域に知れ渡り、多くの人が主を信じた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: このことは…知れ渡り
  rationale: 非人称的な構文を自然な日本語にしつつ、前節までの出来事が広く知られるようになったという結果を表した。明示されていない行為者は補わない。
- source_word: δὲ
  choice: （文脈に溶け込ませ、独立した接続語を置かない）
  rationale: ここでは物語を緩やかに進める接続辞であり、日本語では前後の連続性によって自然に表せる。
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: ヨッパ全域に
  rationale: κατά＋属格の分布的意味とὅληςの包括性を、簡潔で自然な表現で保持した。
- source_word: Ἰόππης
  choice: ヨッパ
  rationale: 新約聖書の地名として定着した日本語表記を採用した。
- source_word: ἐπίστευσαν πολλοὶ
  choice: 多くの人が…信じた
  rationale: 実質名詞的なπολλοίを日本語で明確に「多くの人」とし、アオリストの出来事性を簡潔な過去形で表した。
- source_word: ἐπὶ τὸν κύριον
  choice: 主を信じた
  rationale: πιστεύω＋ἐπί（対格）が示す信頼の対象を、現代日本語で自然な「主を信じる」とした。
- source_word: κύριον
  choice: 主
  rationale: 使徒言行録における尊称および神学的重みを保つ標準的な訳語である。
theological_decisions:
- issue: πιστεύω＋ἐπὶ τὸν κύριονの訳し方
  choice: 主を信じた
  alternative: 主に信頼を置いた
  rationale: 主を信仰・信頼の対象としたことを自然に表しつつ、本文以上に特定の教理的定式へ狭めない。
- issue: κύριοςの訳し方
  choice: 主
  alternative: 主人
  rationale: イエスに用いられる称号のキリスト論的含意を保持し、「主人」よりも原文の用法に適合する。
translation_notes:
  register: 明快な現代標準日本語。物語文として簡潔でありながら品位を保ち、「知れ渡る」によって出来事が地域全体へ広まった結果を自然に表現した。
