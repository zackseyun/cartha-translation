id: ACT.9.21
reference: Acts 9:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: ja
  text: 彼の話を聞いた人々は皆驚き、こう言っていた。「この人は、エルサレムで、この名を呼び求める人たち[a]を荒らし回った者ではないか。また、彼らを縛ったまま祭司長たちのもとへ連行するために、ここへ来ていたのではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この名」はイエスの名を指す。「名を呼び求める」は、その名に助けを求め、その名を公に告白することを表す聖書的な言い方。別訳「この名を唱える人たち」。
    reason: 語句の意味と暗示された指示対象を説明し、原文の慣用表現を本文に残すため。
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 驚き
  rationale: 強い驚きを表す未完了過去形。日本語では文脈上の継続性を保ちつつ、自然で明瞭な「驚き」とした。
- source_word: πάντες οἱ ἀκούοντες
  choice: 彼の話を聞いた人々は皆
  rationale: 分詞の目的語は文脈上サウロであるため、「彼の話」を補って自然な日本語にした。
- source_word: πορθήσας
  choice: 荒らし回った
  rationale: 単なる「迫害した」より強く、破壊的な加害を表す語。「滅ぼした」では殺害や完全な絶滅まで示唆し得るため、強さを保ちながら過剰に限定しない表現を選んだ。
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: この名を呼び求める人たち
  rationale: 名に訴え、その名を告白して礼拝するという聖書的な慣用表現を保持した。「この名」の指示対象も本文では明示せず、原文の修辞を保った。
- source_word: εἰς τοῦτο ἐληλύθει
  choice: そのために、ここへ来ていた
  rationale: εἰς τοῦτο の目的の意味と、ἐληλύθει の過去の到着を振り返る時制を自然な日本語で表した。本文では後続する目的節を先に訳し、「連行するために」と具体化した。
- source_word: δεδεμένους αὐτοὺς ἀγάγῃ
  choice: 彼らを縛って…連行する
  rationale: 拘束された状態で権威者のもとへ連れて行く意味を、現代日本語で明確に表した。拘束手段を「鎖」と限定しなかった。
- source_word: ἐπὶ τοὺς ἀρχιερεῖς
  choice: 祭司長たちのもとへ
  rationale: 複数形は大祭司職を含む祭司長層・祭司長権威者を指す。「もとへ」は移送先としての権威者を自然に表す。
theological_decisions:
- issue: τὸ ὄνομα τοῦτο の指示対象を本文で明示するか
  choice: 「この名」を保持する
  alternative: 「イエスの名」と明示する
  rationale: 文脈上はイエスの名を指すが、原文は指示対象を暗示にとどめる。その簡潔で修辞的な言い方を本文に残し、脚注で説明した。
- issue: πορθήσας の強さ
  choice: 「荒らし回った」と訳す
  alternative: 「迫害した」または「滅ぼした」
  rationale: 一般的な迫害より強い破壊性を伝えつつ、全員を殺害・絶滅させたとの意味に固定しないため。
- issue: 発言全体の疑問文としての形
  choice: 二つの修辞疑問として訳す
  alternative: 後半を平叙文として訳す
  rationale: Οὐχ で始まる問いの流れに後半の καί が続き、英語相談層と同様、驚きを表す二つの修辞疑問として読むのが自然である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、群衆の驚きと修辞疑問の勢いを保った。「祭司長たち」「連行する」は歴史的・司法的な場面にふさわしい、平易で品位ある語調である。
