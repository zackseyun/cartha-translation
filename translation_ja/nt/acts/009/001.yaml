reference: Acts 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: ja
  text: さて、サウロはなおも主の弟子たちに対する脅しと殺害を吐き出すようにして、大祭司のもとへ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: さて
  rationale: 直前の物語からサウロへ場面を戻す、穏やかな転換・再開を自然な日本語で示す。強い逆接ではないため「しかし」より適切。
- source_word: ἔτι
  choice: なおも
  rationale: これまで続いていたサウロの敵意が継続していることを表す。
- source_word: ἐμπνέων
  choice: 息づかせ
  rationale: 脅しと殺意が呼吸そのもののようにサウロを満たしているという鮮烈な比喩を、日本語として理解可能な形で保持する。
- source_word: ἀπειλῆς καὶ φόνου
  choice: 脅しと殺意
  rationale: 属格をἐμπνέωνの内容として訳す。φόνοςは殺害・殺人を表すが、ここでは未遂の段階であるため、行為そのものを断定する「殺人」より、殺害へ向かう意志を示す「殺意」が文脈上自然。
- source_word: εἰς τοὺς μαθητὰς τοῦ κυρίου
  choice: 主の弟子たちに対する
  rationale: 敵対的な内容が弟子たちへ向けられていることを「に対する」で明確にする。属格τοῦ κυρίουは弟子たちの帰属を示す。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: ルカ文書のこの文脈ではイエスを指す称号として自然であり、κύριοςの標準的で尊厳ある訳語を用いる。
- source_word: προσελθὼν τῷ ἀρχιερεῖ
  choice: 大祭司のもとへ行った
  rationale: 近づく動作を自然な日本語で表す。原文では分詞で次節の主動詞に従属するが、節区切りに合わせて完結した文とした。
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 当時のユダヤ教における単数の役職名として定着した訳語。
theological_decisions:
- issue: τοῦ κυρίουにおけるκύριοςの指示対象と訳語
  choice: 主
  alternative: 主人
  rationale: 使徒言行録の直近の文脈ではイエスを指す称号と理解するのが自然であり、「主」はその称号性と神学的含意を過不足なく保つ。
- issue: φόνοςを実行済みの殺人として訳すか、殺害への意志として訳すか
  choice: 殺意
  alternative: 殺人／殺害
  rationale: サウロが弟子たちに向けて抱き、脅しとともに『息づかせて』いるものを表すため、実行済みの行為を示唆せず、原語の暴力的・道徳的重みを保つ「殺意」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、原文の「呼吸する」という強烈な比喩を「息づかせ」で保持した。文体は物語として自然かつ格調を失わないものとし、節単独でも読めるよう末尾を完結させた。
