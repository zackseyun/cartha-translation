  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: ja
  text: すると、主は彼に言われた。「立って、『まっすぐ』と呼ばれる通りへ行き、ユダの家で、サウロという名のタルソ出身の人を捜しなさい。というのも、見よ、彼は祈っている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 新約聖書における称号としての標準的な訳語であり、この節では明示されていない「イエス」を本文に補わず、原文の簡潔さを保つ。
- source_word: Ἀναστὰς πορεύθητι
  choice: 立って……行き
  rationale: 分詞と命令形が一続きの行動開始を表すため、自然な現代日本語の命令として訳した。
- source_word: ῥύμην
  choice: 通り
  rationale: 都市内の街路を指す語として、明瞭で一般的な日本語を選んだ。
- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: 『まっすぐ』と呼ばれる通り
  rationale: Εὐθεῖαν が通りの名称として機能することと、「呼ばれる」という原文の構文をともに示す。
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: ユダの家で
  rationale: 捜す場所を表す ἐν を、現代日本語で自然かつ簡潔に表した。
- source_word: ζήτησον
  choice: 捜しなさい
  rationale: ζητέω の探索・照会の意味を保ち、「見つけなさい」のように結果まで含意しない訳とした。
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: サウロという名のタルソ出身の人
  rationale: ὀνόματι が名前を、Ταρσέα が出身地を示すことを自然な日本語で明示した。
- source_word: ἰδοὺ γὰρ
  choice: 見よ、
  rationale: ἰδού の注意喚起を保持した。γάρ の理由提示は、命令に続く文脈上のつながりによって表し、日本語として不自然な「というのは、見よ」を避けた。
- source_word: προσεύχεται
  choice: 祈っている
  rationale: 現在進行中のサウロの行為を自然な日本語で表した。
theological_decisions:
- issue: κύριος の指示対象
  choice: 本文では「主」とのみ訳す
  alternative: 「主イエス」と明示する
  rationale: 文脈上は復活したイエスを指すが、この節のギリシア語本文は κύριος とだけ記すため、節内で名を補わない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「見よ」はやや高い文体だが、ἰδού の注意喚起を保つため採用した。固有の通り名は名称であることが分かるよう括弧を付した。
