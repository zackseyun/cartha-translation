base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: ja
  text: ペトロはヨッパでかなりの日の間、皮なめし職人のあるシモン[a]のもとに滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「あるシモンの家に」。ギリシア語は、ある人のもとで、またはその人の家に滞在することを示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: とどまり……滞在した
  rationale: ἐγένετο＋不定詞を逐語的に「起こった」とせず、継続して滞在したことを自然な日本語で表した。日本語では主語を文脈から補い、ペトロを明示した。
- source_word: δὲ
  choice: （無訳）
  rationale: 弱い物語接続辞であり、この一節を単独で読んでも不自然にならないよう、明示的な接続語を置かなかった。
- source_word: ἡμέρας ἱκανὰς
  choice: かなりの日数
  rationale: ἱκανάが示す相当の期間を保ちつつ、具体的な長さを確定しない表現とした。
- source_word: ἐν Ἰόππῃ
  choice: ヨッパに
  rationale: 地名Ἰόππηを日本語で慣用的な「ヨッパ」と音写した。
- source_word: παρά τινι Σίμωνι
  choice: シモンという人の家に
  rationale: παρά＋与格がここでは人のもと、すなわちその家での宿泊を示すため、日本語で自然に場所を明示した。τινιの不特定性は「という人」で表した。
- source_word: βυρσεῖ
  choice: 皮なめし職人
  rationale: βυρσεύςは獣皮をなめす職人を具体的に指す。「革職人」より原語の職能を正確に表す。
