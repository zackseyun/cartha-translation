source:
  edition: SBLGNT
  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: ja
  text: そこでペトロは、アイネアという人に出会った。彼は八年もの間、寝床[a]に横たわっており、体が麻痺していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「敷物」または「粗末な寝床」とも訳せる。
    reason: κραβάττοςが指す簡素な寝具の語義範囲を示すため。
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: そこでペトロは……出会った
  rationale: δέとἐκεῖを自然な物語の継続を示す「そこで」で表し、εὗρενは人との遭遇に適した「出会った」とした。動詞の主語は直前の文脈上ペトロなので、日本語で明確に補った。
- source_word: ἄνθρωπόν τινα ὀνόματι Αἰνέαν
  choice: アイネアという人
  rationale: τιςは、それまで登場していなかった特定の人物を導入する働きを持つ。「ある人」を重ねるよりも、「アイネアという人」が現代日本語として自然で、その談話上の機能も保つ。
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: 八年もの間
  rationale: 継続期間を表す句。「もの」を添えて長期にわたる状態を自然に示すが、原文にない評価を過度に加えない。
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: 寝床に横たわっており
  rationale: 「寝たきり」と意訳せず、横たわる姿とκραβάττοςの具体像を本文に残した。κραβάττοςは簡素な寝具や敷物を指し得るため、訳語の幅を脚注で示す。
- source_word: ὃς ἦν παραλελυμένος
  choice: 体が麻痺していた
  rationale: 完了受動分詞が表す継続的な麻痺状態を、明瞭で自然な現代日本語にした。病状を特定の医学的診断へ狭めない。
theological_decisions: []
translation_notes:
  register: 明瞭で落ち着いた現代標準語。原文の具体的な「横たわる」「寝床」という描写と、麻痺という状態説明の両方を保った。
