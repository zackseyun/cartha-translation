  text: καὶ ἦν ἡμέρας τρεῖς μὴ βλέπων, καὶ οὐκ ἔφαγεν οὐδὲ ἔπιεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: ja
  text: そして、彼は三日間、目が見えず[a]、食べることも飲むこともしなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「見ていなかった」。この表現は、サウロが見ることのできない状態にあったことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: 三日間、彼は…
  rationale: ἡμέρας τρεῖςは時間の幅を表す対格であり、現代日本語では「三日間」とするのが自然。ἦνは後続の分詞とともに継続した状態を表すため、「彼は目が見えず」と表現した。
- source_word: μὴ βλέπων
  choice: 目が見えず
  rationale: 直訳的には「見ていない」だが、文脈上は見る能力を失った状態を指す。「盲目だった」と断定的な名詞・形容表現にせず、原文の分詞表現が示す状態を自然な日本語で保持した。
- source_word: οὐκ ἔφαγεν οὐδὲ ἔπιεν
  choice: 食べることも飲むこともしなかった
  rationale: 二つの否定された動作を、οὐδέの連結を反映する「…も…も」で自然に表した。アオリストは三日間に起きなかった事実として訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、簡潔で尊厳ある叙述調とした。「目が見えず」により、原文の字義と文脈上の意味を両立させた。
