  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: ja
  text: すると、すぐに彼の目からうろこのようなものが落ち[a]、再び見えるようになった。彼は立ち上がって、洗礼を受けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「うろこのようなものが彼の目から落ちた」。ギリシア語は比較を用いており、それが実際のうろこだったと断定してはいない。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: すぐに
  rationale: 出来事が直ちに起こったことを、自然な現代日本語で明確に表す。
- source_word: ἀπέπεσαν
  choice: 落ち
  rationale: 目から離れて落ちたというἀποπίπτωの意味を、後続の「目から」と合わせて簡潔に表す。
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: 彼の目から
  rationale: 所有者と起点を自然な日本語で示す。
- source_word: ὡς λεπίδες
  choice: うろこのようなもの
  rationale: ὡςの比較表現を保ち、実際のうろこだったと断定せず、λεπίδεςの具体的な像も伝える。
- source_word: ἀνέβλεψεν
  choice: 再び見えるようになった
  rationale: 失明から視力を回復した文脈でのἀναβλέπωの意味を、平明な日本語で表す。
- source_word: τε καὶ
  choice: （文を分けて順序を示す）
  rationale: 連続する動作を、日本語では文の配列によって自然に示す。
- source_word: ἀναστάς
  choice: 立ち上がって
  rationale: 次の動作へ移る先行動作を、自然な接続表現で表す。
- source_word: ἐβαπτίσθη
  choice: 洗礼を受けた
  rationale: 受動形を日本語の定着した表現で訳し、洗礼の方式を本文で限定しない。
theological_decisions:
- issue: βαπτίζωを教派的に偏らず訳すこと
  choice: 洗礼を受けた
  alternative: 浸された
  rationale: 原文はこの箇所で施行方式を特定していないため、日本語で広く定着した「洗礼を受けた」を用い、特定の方式を持ち込まない。
- issue: ὡς λεπίδεςが実物のうろこか、外観の描写か
  choice: うろこのようなもの
  alternative: うろこのように
  rationale: ὡςが示す比較を保持し、実物のうろこだったと断定せずに原文の描写的な余地を残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「すると、すぐに」で前後との連続と即時性を示し、「再び見えるようになった」で視力回復を平易に表した。
