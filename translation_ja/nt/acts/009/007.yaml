  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: ja
  text: 彼に同行していた男たちは、声[a]は聞こえていたが、だれも見えず、ものも言えないまま立っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「音」とも訳せる。ギリシア語の語は「声」と「音」のどちらも意味し得る。使徒22:9参照。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: 男たちは
  rationale: οἱ ἄνδρεςを自然に「男たち」と訳した。δέは弱い接続・対照を示すが、この一文だけで不自然な接続語を補わず、「は」によって場面の焦点の移行を表した。
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: 同行していた
  rationale: συνοδεύωは旅に伴うことを表す。「同行していた」は旅の文脈を保ちつつ、簡潔で自然な現代日本語である。
- source_word: εἱστήκεισαν
  choice: 立っていた
  rationale: ἵστημιの過去完了形はここで状態を表す。「立っていた」は、本文に明記されていない「立ち尽くした」「立ち止まった」などの含意を加えない。
- source_word: ἐνεοί
  choice: ものも言えずに
  rationale: ἐνεόςは口がきけない、または驚きなどで言葉を失った状態を表す。「ものも言えずに」は一時的に発話できない様子を自然に伝え、「唖然」のように原因を断定しない。
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: 声は聞こえても
  rationale: φωνήの基本的な意味である「声」を本文に採用した。属格を伴うἀκούωは聞こえたものの性質をここだけで決定しないため、使徒22:9との関係を説明的に調和させず、原文の緊張を保った。μένとδέの対照は「は……ても」で表した。
- source_word: μηδένα δὲ θεωροῦντες
  choice: だれも見えず
  rationale: μηδέναは人を指す「だれも」、θεωρέωはここでは視覚的に見ることを表す。「だれも見えず」は簡潔で自然であり、「姿」のような原文にない語を補わない。
theological_decisions:
- issue: 使徒9:7と22:9において、同行者が何を聞いたかをめぐる見かけ上の緊張
  choice: 本文ではφωνήを「声」と訳し、語義上の別案を脚注に示す
  alternative: 本文で「物音」と訳し、22:9との整合が明瞭になるようにする
  rationale: φωνήには「声」と「音」の双方の語義があるが、この箇所で一方を選ぶことによって二つの記事を説明的に調和させるべきではない。基本的な訳語「声」を本文に置き、真正な語義上の幅と本文間の緊張を脚注によって読者に開示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書叙事にふさわしい落ち着いた文体とした。「ものも言えずに」は一般読者に理解しやすく、過度に古風でも説明的でもない。脚注記号[a]は対象語「声」の直後に置いた。
