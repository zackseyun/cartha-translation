id: ACT.9.5
reference: Acts 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: ja
  text: そこで彼は言った。「主よ[a]、あなたはどなたですか。」すると、その方は言った。「わたしは、あなたが迫害しているイエスである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主よ」は、文脈によっては単に敬意を表す呼びかけ（「先生」「閣下」など）の意味にもなり得る。ギリシア語κύριεは、「主」への呼びかけにも一般的な敬称にも用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: 言った
  rationale: アオリストの標準的な物語叙述として訳した。日本語では文脈に応じて主語を補い、最初は「彼」、二度目は応答者を明確にするため「その方」とした。
- source_word: δέ
  choice: そこで／すると
  rationale: 弱い接続を表す語であり、対立よりも発話の連続を示すため、自然な物語の流れに合わせて訳し分けた。
- source_word: Τίς εἶ
  choice: あなたはどなたですか
  rationale: 問いの意味を直接保ちつつ、天から語る相手への敬意が自然に伝わる現代日本語とした。
- source_word: κύριε
  choice: 主よ
  rationale: κύριοςの基本的な訳語を保ち、啓示的な文脈にも適合させた。ただし、この時点では敬称としても理解できるため脚注で曖昧さを示した。
- source_word: Ἐγώ εἰμι
  choice: わたしは…である
  rationale: 強調された一人称代名詞とコピュラによる自己同定を明確に表し、それ以上の神学的含意は付加しなかった。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: ὃν σὺ διώκεις
  choice: あなたが迫害している
  rationale: 関係節を日本語の連体修飾として自然に組み替えた。明示されたσὺは「あなた」で表し、現在形は継続中の敵対行為として「迫害している」とした。
- source_word: διώκεις
  choice: 迫害している
  rationale: この文脈では単なる追跡ではなく、イエスに属する者たちへの継続的な敵対行為を指すため。
theological_decisions:
- issue: 話者の正体が明かされる前のサウロの呼びかけκύριε
  choice: 主よ
  alternative: だんな様／あなた様
  rationale: κύριεは敬意ある呼びかけにも「主」への呼びかけにもなり得る。本文では標準訳「主よ」を採り、サウロがこの時点ですでに完全な信仰告白をしていたと断定しないよう、敬称の可能性を脚注に残した。
- issue: イエスを迫害するという自己同定
  choice: わたしは、あなたが迫害しているイエスである
  alternative: わたしはイエスだ。あなたはわたしを迫害している
  rationale: 原文の関係節を保ち、イエスと迫害される者たちとの結びつきを説明で解消せず、その神学的緊張をそのまま示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなたはだれですか」より敬意のある「どなたですか」を用い、応答者は正体が直後に明かされる流れを損なわないよう「その方」とした。脚注記号[a]は該当する「主よ」の直後に置いた。
