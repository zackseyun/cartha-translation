  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: ja
  text: そして彼はここで、祭司長たちから、あなたの名を呼び求める者を皆縛る権限を与えられています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの名を呼ぶ者すべて」。このギリシア語表現は、しばしば祈りの中で人を呼び求めることを表す聖書の慣用句です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: ここでも
  rationale: 場所を示す「ここ」に、直前まで述べられたエルサレムでの行為との対比を自然に示す日本語の助詞「も」を添えた。
- source_word: ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων
  choice: 権限を、祭司長たちから与えられています
  rationale: ἐξουσίαは公的に委任された「権限」。παρά＋属格はその出所を示す。日本語では「権限を持っています」より、委任元との関係が明瞭になる受け身表現が自然。
- source_word: δῆσαι
  choice: 縛り上げる
  rationale: 実際には逮捕を含意するが、原文の「縛る」という具体的な像を保持した。
- source_word: πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου
  choice: あなたの名を呼び求める者を皆
  rationale: 冠詞付き分詞を「者」とし、πάνταςを「皆」で表した。「名を呼び求める」は、祈りや嘆願においてその方を呼ぶ聖書的慣用を保つ。
theological_decisions:
- issue: イエスに向けられた「あなたの名を呼び求める」の意味
  choice: 「あなたの名を呼び求める」を本文に保持する
  alternative: 「あなたに祈る」「あなたの権威に訴える」
  rationale: この表現は祈りにおける呼びかけと帰依を含み得るが、どちらか一方だけに狭めず、イエスに向けられた原文の神学的重みと含意を保つ。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての品位を保つ文体。「縛り上げる」により原文の像を残し、「呼び求める」により祈り・嘆願の含意を過度に説明せず伝えた。
