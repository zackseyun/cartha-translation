base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: ja
  text: しかし、サウロは地面から起き上がった。目は開いていたのに、何も見えなかった。[a] そこで彼らは彼の手を取って導き、ダマスコに連れて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼の目が開かれた状態で、何も見えなかった」。目が開いているのに見えないという対照が、ギリシア語の構文によって際立っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: 起き上がった
  rationale: ここではアオリスト受動形が自動詞的に用いられ、倒れていた地面から立ち上がる動作を表す。現代日本語として自然な「起き上がった」とした。
- source_word: ἀπὸ τῆς γῆς
  choice: 地面から
  rationale: γῆはこの場面では、サウロが倒れていた地面を指し、「大地」や地理的な「土地」ではない。
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: 目は開いていたのに
  rationale: 属格絶対構文は付帯状況を示すが、ここでは目が開いていることと見えないこととの対照が重要であるため、文脈上の譲歩的な含みを自然に表した。
- source_word: οὐδὲν ἔβλεπεν
  choice: 何も見えなかった
  rationale: 視覚を全く失っていた状態を、自然な日本語で直接表す。
- source_word: χειραγωγοῦντες
  choice: 彼の手を引いて
  rationale: χειραγωγέωは、助けを必要とする人を手を取って導く具体的な動作を表す。「手を引いて」によりその像を保持した。
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: ダマスコへ連れて行った
  rationale: 町の中へ導き入れたことを表す。日本語では目的地を「へ」で示す表現が自然であり、直前の「手を引いて」と合わせて移動の様子も明確になる。
- source_word: δὲ
  choice: しかし／そこで
  rationale: 三つのδέは物語の進行や軽い対照を示す。日本語ではすべてを機械的に訳さず、冒頭の転換を「しかし」、最後の結果的進行を「そこで」で表した。
- source_word: Σαῦλος
  choice: サウロ
  rationale: 日本語聖書で広く定着した音写を用いた。
- source_word: Δαμασκόν
  choice: ダマスコ
  rationale: 日本語聖書で広く定着した地名表記を用いた。
