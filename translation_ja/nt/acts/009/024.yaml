  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: ja
  text: しかし、彼らのたくらみはサウロに知られた。彼らはまた、サウロを殺すために、昼も夜も門[a]を見張っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は複数形「門」。文脈上、ダマスコの町の門を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: 知られた
  rationale: アオリスト受動形を簡潔に保ち、たくらみがサウロの知るところとなったことを、知らせた主体を補わずに表す。
- source_word: ἐπιβουλή
  choice: たくらみ
  rationale: 敵意ある計画を指し、後半の殺害目的にも自然につながる現代日本語。
- source_word: παρετηροῦντο
  choice: 見張っていた
  rationale: 未完了過去の継続的な監視を表す。「警備していた」よりも観察・監視という動詞の中心的意味に近い。
- source_word: πύλας
  choice: 門
  rationale: ギリシア語は複数形だが、日本語では都市の出入口を集合的に「門」とするのが自然。都市の門であることは文脈上明らかなので本文では補わない。
- source_word: ἡμέρας τε καὶ νυκτός
  choice: 昼も夜も
  rationale: 絶え間ない監視を自然な日本語で表す。
- source_word: ὅπως
  choice: 〜ようと
  rationale: 殺害を目的とする節であることを、自然かつ明瞭に示す。
- source_word: ἀνέλωσιν
  choice: 殺そう
  rationale: この文脈でのἀναιρέωの意味を婉曲化せず、明確に表す。
- source_word: δὲ
  choice: しかし
  rationale: 陰謀に対して、それがサウロに知られたという軽い対照と物語の展開を示す。
- source_word: καὶ
  choice: （文脈により無標）
  rationale: 門の監視がたくらみの具体的な実行であるため、日本語では独立した「また」を置かなくても付加的関係が自然に伝わる。
