id: ACT.9.25
reference: Acts 9:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: ja
  text: しかし、彼の弟子たちは夜のうちに彼を連れ、大きなかごに入れて、城壁を通してつり降ろした[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「城壁の開口部を通して」。ギリシア語は直訳すると「城壁を通して」であり、城壁に設けられた窓や開口部を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では、「降ろした」と「つり降ろして」に当たる二つの表現が重ねて用いられ、逃がした方法が生き生きと描かれている。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: 彼を連れ
  rationale: この文脈では、弟子たちが逃亡のために彼を引き受けて伴ったことを表す。日本語として自然であり、単なる「つかむ」に限定しない。
- source_word: δὲ
  choice: しかし
  rationale: 直前の殺害計画に対し、弟子たちによる救出へと話が転じる軽い対照を示す。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 彼の弟子たち
  rationale: 属格代名詞 αὐτοῦ を明示し、μαθηταί の通常の訳語「弟子たち」を用いた。誰の弟子かについて本文の表現以上に解釈を加えない。
- source_word: νυκτός
  choice: 夜のうちに
  rationale: 時を表す属格を、逃亡が夜間に行われたことが明瞭な現代日本語で表した。
- source_word: διὰ τοῦ τείχους
  choice: 城壁を通して
  rationale: διά＋属格の「通って」という方向を保つ。実際には城壁の窓や開口部を指す可能性が高いが、ギリシア語に明記されない語を本文へ補わず、注で説明した。
- source_word: καθῆκαν αὐτόν
  choice: つり降ろした
  rationale: 高所から下へ降ろす動作を明確にし、かごと縄などを用いた場面に自然な表現とした。
- source_word: χαλάσαντες
  choice: つり降ろした（καθῆκαν と合わせて表現）
  rationale: καθῆκαν と意味が重なる分詞で、降ろした方法を描く。日本語本文では不自然な重複を避けて一つの述語にまとめ、原文の二重表現は注で示した。
- source_word: ἐν σπυρίδι
  choice: 大きなかごに入れて
  rationale: σπυρίς は人を入れられるほどの大型のかごを指し得る。「大きな」によってその実際的な大きさを示した。ἐν は、この逃亡の手段としてかごの中に入れたことが自然に伝わる形で訳した。
theological_decisions:
- issue: οἱ μαθηταὶ αὐτοῦ の所属関係
  choice: 「彼の弟子たち」と訳す
  alternative: 「弟子たち」または「彼に従う人々」
  rationale: αὐτοῦ を省かず、原文が示す所有・関係を保持する一方、この人々の身分や集団的所属について本文以上の説明を加えない。
translation_notes:
  register: 明瞭で現代的ながら、物語本文にふさわしい落ち着いた文体とした。「城壁を通して」はやや直訳的だが、原文の曖昧さを保ち、具体的な開口部の可能性は脚注に委ねた。
