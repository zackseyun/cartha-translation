  source_fidelity: 原文の主要要素を忠実に保持している。δέの物語上の対照、αὐτοῦを含む「彼の弟子たち」、夜間の行動、διὰ τοῦ τείχουςの意図的に具体化されない表現、そして人を入れ得るσπυρίςが適切に訳出されている。καθῆκανとχαλάσαντεςの重複的な降下表現は、日本語本文では自然さのため一つの述語に統合し、脚注でその点を明示している。
  naturalness: 「しかし、彼の弟子たちは夜のうちに彼を連れ、大きなかごに入れて、城壁を通してつり降ろした」は明瞭な現代標準日本語であり、叙述としても落ち着いている。「城壁を通して」は日本語としてやや逐語的だが、原文の「壁の開口部」を明記しない曖昧さを適切に保っており、脚注の補足とよく釣り合っている。
  terminology: 「弟子たち」「城壁」「つり降ろした」「大きなかご」は文脈と用語の双方に適する。「彼の弟子たち」は、彼らの具体的な集団的所属を不必要に限定せずにαὐτοῦを反映している。
