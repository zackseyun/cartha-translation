revisions:
- from: そこでペトロは立ち上がり、彼らと一緒に出かけた。ペトロが到着すると、人々は彼を階上の部屋へ案内した。やもめたちは皆、泣きながら彼のそばに立ち[a]、ドルカス[c]が彼女たちと一緒にいた間に作っていた肌着や上着[b]を見せた。
  to: そこでペトロは立ち上がり、彼らと一緒に出かけた。ペトロが到着すると、彼らは彼を階上の部屋へ連れて行った。やもめたちは皆、泣きながら彼のそばに立ち[a]、ドルカス[c]が彼女たちと一緒にいた間に作っていた肌着や上着[b]を見せた。
  rationale: 主語を文脈どおり「彼ら」に戻し、ἀνήγαγονの移動・上昇の意味を「階上の部屋へ連れて行った」で明示した。衣服注は語義上の区別を保ちつつ、古代の着用法を過度に固定しない表現に改めた。その他の表現は原文の時制・場面描写と現代日本語の自然さをよく保っている。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:21:48Z'
