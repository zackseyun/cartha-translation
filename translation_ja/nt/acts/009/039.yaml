  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: ja
  text: そこでペトロは立ち上がり、彼らと一緒に出かけた。ペトロが到着すると、彼らは彼を階上の部屋へ連れて行った。やもめたちは皆、泣きながら彼のそばに立ち[a]、ドルカス[c]が彼女たちと一緒にいた間に作っていた肌着や上着[b]を見せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼の前に立ち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「肌着」と「上着」は、二つの異なるギリシア語の衣服名を訳したもの。前者は身体に近い衣、後者は外側にまとう衣を指すことがある。
    reason: cultural_note
  - marker: c
    text: ドルカスはギリシア語名。9章36節では、アラム語名のタビタとも呼ばれている。
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: 応答して行動を起こす動きを自然な現代日本語で表した。
- source_word: συνῆλθεν αὐτοῖς
  choice: 彼らと一緒に出かけた
  rationale: 使者たちに同行したという文脈上の意味を明確にした。
- source_word: παραγενόμενον
  choice: ペトロが到着すると
  rationale: 分詞の時間的関係を自然に表し、ギリシア語の関係代名詞構文が日本語で曖昧にならないよう主語を補った。
- source_word: ἀνήγαγον
  choice: 彼を……へ案内した
  rationale: 階上への移動を含むが、その方向は「階上の部屋へ」で十分明らかなため、自然な「案内した」とした。
- source_word: ὑπερῷον
  choice: 階上の部屋
  rationale: 建物の上階にある部屋を、古風すぎない表現で示した。
- source_word: παρέστησαν αὐτῷ
  choice: 彼のそばに立ち
  rationale: 悲しむやもめたちがペトロの傍らに集まった場面として自然に訳しつつ、「彼の前に立った」という解釈可能性は注に残した。
- source_word: πᾶσαι αἱ χῆραι
  choice: やもめたちは皆
  rationale: 全員であったという強調を保ち、「やもめ」は聖書本文として通用する簡潔な語とした。
- source_word: κλαίουσαι
  choice: 泣きながら
  rationale: 継続中の嘆きを、本文の動作との同時性が分かる形で表した。
- source_word: ἐπιδεικνύμεναι
  choice: 見せた
  rationale: 衣類をペトロの目に示した行為を平明に訳した。
- source_word: χιτῶνας καὶ ἱμάτια
  choice: 肌着や上着
  rationale: 古代の内側に着る衣と外側に着る衣の区別を、現代の読者にも理解しやすい語で示した。
- source_word: ὅσα ἐποίει
  choice: 作っていた
  rationale: 未完了過去が表し得る継続・反復の含みを保ち、「いつも作っていた」などと習慣性を断定することは避けた。
- source_word: μετ’ αὐτῶν οὖσα
  choice: 彼女たちと一緒にいた間に
  rationale: ドルカスがやもめたちの共同体の中にいた時を指す表現を、死を直接補わずに訳した。
