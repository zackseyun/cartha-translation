id: ACT.9.40
reference: Acts 9:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: ja
  text: しかし、ペトロは全員を外に出し、ひざまずいて祈った。それから遺体のほうを向いて、「タビタ、起きなさい[a]」と言った。すると彼女は目を開き、ペトロを見ると、身を起こした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「立ち上がりなさい」。ギリシア語の命令はどちらにも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: 全員を外に出し
  rationale: その場にいた人々を皆、部屋の外へ出したという具体的な動作を、必要以上に強制的な表現にせず自然に示す。
- source_word: θεὶς τὰ γόνατα
  choice: ひざまずいて
  rationale: 祈りの姿勢を表すギリシア語の慣用表現を、現代日本語で簡潔かつ自然に訳した。
- source_word: προσηύξατο
  choice: 祈った
  rationale: προσεύχομαι の標準的な意味を、文脈に余分な含意を加えず表す。
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: 遺体のほうを向いて
  rationale: ペトロが身体へ向き直ったという動作を保つ。「遺体」はこの時点で死んでいるタビタの身体を指す自然な日本語であり、「死体」よりも場面の品位に適する。
- source_word: Ταβιθά
  choice: タビタ
  rationale: 人名を日本語の一般的な音写で示す。
- source_word: ἀνάστηθι
  choice: 起きなさい
  rationale: 横たわった状態から起きることを命じる語を、厳粛さを損なわない明瞭な現代日本語で表す。復生の文脈との響きを保ちつつ、訳語自体に解釈を加えすぎない。
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: 彼女は目を開き
  rationale: 原文の動作を直接的かつ自然に表す。
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: ペトロを見ると
  rationale: 分詞が示す時間的な流れを、日本語で自然な従属節として表した。
- source_word: ἀνεκάθισεν
  choice: 身を起こした
  rationale: 横たわった姿勢から上体を起こして座る動作を自然に表す。「座った」だけでは姿勢の変化が不明瞭になりうるため、「身を起こした」とした。
- source_word: δὲ
  choice: しかし／すると
  rationale: 最初の δέ は直前の場面からの転換を「しかし」で示し、後の δέ は出来事の進展を「すると」で自然に表した。
theological_decisions:
- issue: 復生の場面における命令 ἀνάστηθι の訳し方
  choice: 起きなさい
  alternative: 立ち上がりなさい
  rationale: この命令には「起きる」「立ち上がる」の双方に通じる語義がある。「起きなさい」は、死から命へ戻されるこの場面の響きを保ちながら、身体姿勢を立位に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。動作の順序を簡潔に示し、奇跡の場面に不必要な説明や教派的解釈を加えていない。
