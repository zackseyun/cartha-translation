id: ACT.9.26
reference: Acts 9:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: ja
  text: 彼はエルサレムに着くと、弟子たちの仲間に加わろうとした[a]。しかし皆は、彼が弟子であるとは信じなかったので、彼を恐れていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弟子たちに結び付こうとした」。
    reason: κολλάομαιの「結び付く、固く結合する」という語感をより直訳的に示すため。
lexical_decisions:
- source_word: Παραγενόμενος δὲ εἰς Ἰερουσαλήμ
  choice: 彼はエルサレムに着くと
  rationale: アオリスト分詞が主動詞に先立つ状況を示すため、自然な現代日本語で時間的関係を表した。δὲは物語を進める軽い接続であり、独立した接続語を置かなくても流れが保たれる。
- source_word: ἐπείραζεν
  choice: 加わろうとした
  rationale: 未完了過去が表す進行中の試みを「〜ようとした」で簡潔に表現した。ここでのπειράζωは「誘惑する」ではなく「試みる」の意味である。
- source_word: κολλᾶσθαι τοῖς μαθηταῖς
  choice: 弟子たちの仲間に加わる
  rationale: κολλάομαιには「結び付く、付き従う」という強い結合の含みがあるが、この文脈では弟子たちの共同体に受け入れられようとする行為を自然に表す「仲間に加わる」とした。制度的な加入手続きまでは含意させない。
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: しかし皆は……彼を恐れていた
  rationale: καὶがここでは直前の試みと周囲の反応との対照的な展開を導くため「しかし」とした。未完了過去は継続していた恐れを「恐れていた」で表した。
- source_word: μὴ πιστεύοντες
  choice: 信じなかったので
  rationale: 現在分詞が彼らの恐れの理由を示しているため、因果関係が明瞭な現代日本語にした。
- source_word: ὅτι ἐστὶν μαθητής
  choice: 彼が弟子であるとは
  rationale: ギリシア語の現在形ἐστίνを日本語でも「である」として保ち、彼が現に弟子であるという主張を彼らが信じなかったことを示した。
- source_word: μαθητής
  choice: 弟子
  rationale: 使徒言行録で一貫して用いられる、学び従う者を指す標準的で明確な訳語である。
theological_decisions:
- issue: サウロがエルサレムの信徒たちとの間に求めた関係の性質
  choice: 「弟子たちの仲間に加わろうとした」と訳し、共同体との結び付きを表した。
  alternative: 「弟子たちに結び付こうとした」「弟子たちと行動を共にしようとした」
  rationale: 本文は弟子たちに受け入れられ、彼らと交わろうとする試みを述べているが、後代の制度的な教会員資格や特定の儀礼を明示してはいない。そのため共同体的な意味を保ちつつ、制度的含意を加えない表現を選んだ。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、物語文にふさわしい落ち着いた格調を保った。「皆」が弟子たちを指すことは直前の文脈に委ね、原文にない説明は加えていない。
