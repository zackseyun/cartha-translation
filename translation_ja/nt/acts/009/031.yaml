id: ACT.9.31
reference: Acts 9:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: ja
  text: こうして、ユダヤ、ガリラヤ、サマリアの全域にある教会[a]には平安があり、教会は築き上げられていった。そして、主を畏れ、聖霊の励まし[b]を受けて、その数を増していった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「教会」ではなく「諸教会」とある。
    reason: textual_variant
  - marker: b
    text: 「聖霊の慰め」または「聖霊の勧め」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: 教会
  rationale: SBLGNTの単数形に従い、三地方に広がる教会全体を集合的単数として表した。日本語では後続箇所で「教会」を補うことで指示対象を明確にした。
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: ユダヤ、ガリラヤ、サマリアの全域にある
  rationale: 属格を伴うκατάの地域的・分布的意味と、ὅληςの「全域」を自然な現代日本語で表した。
- source_word: εἶχεν εἰρήνην
  choice: 平安があり
  rationale: εἰρήνηを「平安」とし、迫害からの安息だけに狭めず、共同体の安定も含み得る表現とした。
- source_word: οἰκοδομουμένη
  choice: 築き上げられていった
  rationale: 現在受動分詞の継続性と建築の比喩を保ちつつ、日本語として自然な叙述にした。
- source_word: πορευομένη
  choice: 歩み
  rationale: 生活態度を表す比喩を保持し、聖書文体としても現代日本語としても理解可能な「歩む」を採用した。
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: 主を恐れて
  rationale: 定着した聖書的表現を保ち、畏敬と従順を含むφόβοςの幅を訳文だけで一義的に狭めないようにした。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの標準的な訳語を用い、文脈上の指示対象を原文以上に特定しなかった。
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: 聖霊の励ましを受けて
  rationale: παράκλησιςの中心的な文脈適合義として「励まし」を選び、与え手を表す属格を自然な日本語で明示した。「慰め」「勧め」の可能性は脚注に残した。
- source_word: ἐπληθύνετο
  choice: その数を増していった
  rationale: 未完了過去の継続的な数量増加を明確かつ自然に表した。日本語では教会自体が「増える」とすると諸教会の増加とも読めるため、「その数」で構成員の増加を示した。
theological_decisions:
- issue: ἐκκλησίαの数と指示範囲
  choice: 三地方に広がる集合的単数の「教会」
  alternative: 異読に基づく複数の「諸教会」
  rationale: 提示されたSBLGNT本文は単数であり、関連する分詞と動詞も単数であるため本文では「教会」とした。重要な複数形異読は脚注に示した。
- issue: 「主を恐れる」の意味
  choice: 畏敬と従順を含む表現として直訳的に保持
  alternative: 「主を畏敬する」または恐怖としての理解
  rationale: 聖書的な定型表現の神学的な幅を保ち、単なる恐怖にも一般的敬意にも限定しなかった。
- issue: 聖霊に関わるπαράκλησιςの意味
  choice: 励まし
  alternative: 慰め、または勧め
  rationale: 平安、建て上げ、増加という文脈では「励まし」が自然だが、語の意味領域には「慰め」「勧め」も含まれるため脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「平安」「築き上げる」「主を恐れて歩む」など原文の比喩と聖書的な響きを保った。長いギリシア語文は二文に分け、主語の曖昧化を避けるため二文目に「教会」を補った。
