source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: ja
  text: しかし、アナニアは答えた。「主よ、私はこの男について、エルサレムであなたの聖徒たち[a]にどれほど多くの悪いことをしたかを、多くの人から聞いています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの聖なる者たち」とも訳せる。
    reason: ἅγιοιは字義的には「聖なる者たち」であり、新約聖書では主に属する信者を指して「聖徒たち」と訳されることが多い。
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: しかし、アナニアは答えた
  rationale: δέはここで、主の命令に対するアナニアのためらいを伴う応答という軽い逆接を示すため、「しかし」とした。ἀπεκρίθηは簡潔に「答えた」と訳した。
- source_word: Κύριε
  choice: 主よ
  rationale: 直前の幻の中でアナニアが復活したイエスに呼びかけているため、敬意と物語上の神学的重みを保つ標準的な訳語とした。
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: 私は多くの人から…聞いています
  rationale: ἀπὸ πολλῶνは文脈上、人々から情報を得たことを表す。アオリストの出来事と、その情報が今もアナニアの判断に影響していることを自然な日本語で示すため「聞いています」とした。
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: この男が
  rationale: 日本語では、聞いた内容を表す従属節の主語として組み替えるのが自然である。「この男」により指示語とἀνήρの率直な響きを保った。
- source_word: ὅσα κακὰ
  choice: どれほど多くの悪いこと
  rationale: ὅσαの程度・数量の含みと、κακάの道徳的に悪く有害な行為という意味を、平明な現代日本語でともに表した。
- source_word: τοῖς ἁγίοις σου
  choice: あなたの聖なる者たち
  rationale: 名詞化されたἅγιοιを字義に沿って訳し、彼らが主に属することを示す「あなたの」も保持した。教会用語の「聖徒」だけに限定しない表現とした。
- source_word: ἐποίησεν
  choice: した
  rationale: 広い意味を持つποιέωを過度に強めず、「悪いこと」と自然に結び付く基本的な動詞で訳した。
- source_word: ἐν Ἰερουσαλήμ
  choice: エルサレムで
  rationale: 行為がなされた場所を示す標準的な処格表現とした。
theological_decisions:
- issue: アナニアの呼びかけΚύριεの指示対象と意味
  choice: イエスへの呼びかけとして「主よ」
  alternative: 単なる敬称として「先生」または「ご主人様」
  rationale: 直近の文脈では、幻の中でアナニアに語っているのは復活したイエスである。「主よ」はこの文脈を自然に示しつつ、本文以上の教理的説明を加えない。
- issue: τοῖς ἁγίοις σουが指す人々
  choice: 「あなたの聖なる者たち」として、主に属する信者たちを指す表現を保持
  alternative: 「あなたの民」または教会用語としての「あなたの聖徒たち」
  rationale: 「聖なる」という語義と「あなたの」という帰属を明示し、一般化しすぎる「民」は避けた。一方、特定の伝統における聖人概念へ狭めない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、主への呼びかけとアナニアの慎重な応答にふさわしい品位を保った。「どれほど多くの悪いこと」は原文の数量・程度の含みを残しつつ、専門的または古風な語を避けている。
