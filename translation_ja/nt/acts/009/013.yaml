  to: しかし、アナニアは答えた。「主よ、私はこの男について、エルサレムであなたの聖徒たち[a]にどれほど多くの悪いことをしたかを、多くの人から聞いています。」
  rationale: 「この男について」と「…したかを」を用いて、περὶ τοῦ ἀνδρὸς τούτουとὅσα κακὰ…ἐποίησενの関係を自然な日本語で明確にしました。「聖徒たち」を本文に採用しつつ、原語の字義的な表現は脚注に保持しました。意味、数量・程度の含み、主への帰属、および原文の不確定性は変更していません。
