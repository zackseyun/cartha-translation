  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: ja
  text: しかし、立ち上がって町に入りなさい。そうすれば、あなたが何をしなければならないか、告げられる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたが何を行う必要があるかが、あなたに語られる」。
    reason: 原文の未来受動形と δεῖ の構文を示すための直訳的別案。
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: サウロの問いから命令へ転じる逆接を、簡潔で自然な現代日本語で示す。
- source_word: ἀνάστηθι
  choice: 立ち上がって
  rationale: 倒れていたサウロに対するアオリスト命令形を、文脈に即した自然な表現で訳す。
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: 町に入りなさい
  rationale: 移動先を示す εἰς と命令形の力を保ちつつ、明瞭な日本語にする。
- source_word: λαληθήσεταί σοι
  choice: 告げられる
  rationale: 未来受動形と行為者を明示しない原文の間接性を保つ。「語られる」より、この文脈で伝達の意味が自然に伝わる。
- source_word: ὅ τί
  choice: 何を
  rationale: 伝えられる内容を導く関係・疑問的表現を、自然な間接疑問として訳す。
- source_word: σε δεῖ ποιεῖν
  choice: あなたが何をしなければならないか
  rationale: δεῖ の必要・義務の強さを「しなければならない」で保ち、その必要の由来は本文以上に限定しない。
theological_decisions:
- issue: 神の導きという文脈における δεῖ の力
  choice: しなければならない
  alternative: する必要がある
  rationale: 使徒言行録で δεῖ はしばしば強い必要性や義務を表す。「しなければならない」はその力を保つ一方、その必要性がどのような仕方で生じるかまでは本文以上に説明しない。
translation_notes:
  register: 明瞭で現代的ながら品位のある命令表現とした。行為者を補わず、原文の受動表現が持つ曖昧さを保持した。
