  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: ja
  text: さて、ダマスコにアナニアという名の弟子がいた。主は幻の中で彼に、「アナニア」と言われた。彼は、「はい、主よ。ここにおります」と答えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: さて、…いた
  rationale: ἦνは人物の存在を示し、δέは穏やかな場面転換を表す。「さて」で物語上の転換を自然に示し、時間的な「今」は加えない。
- source_word: τις μαθητὴς
  choice: 弟子が
  rationale: τιςは新しい人物を不定に導入する。日本語では「ある弟子」も可能だが、後続の固有名によって十分に不定性が示されるため、自然な「弟子が」とした。
- source_word: ἐν Δαμασκῷ
  choice: ダマスコに
  rationale: ἐν＋与格の場所を表す用法。地名は日本語で慣用的な「ダマスコ」とした。
- source_word: ὀνόματι Ἁνανίας
  choice: アナニアという名の
  rationale: 命名を表す与格ὀνόματιを、明瞭で自然な日本語にした。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 彼に…言われると
  rationale: λέγω＋πρόςの直接的な発話を表す。主への敬意から尊敬表現を用い、日本語の文脈に合わせて従属節に整えた。
- source_word: ἐν ὁράματι
  choice: 幻の中で
  rationale: 主がアナニアに語りかけた場・様態を示す。視覚的な啓示を表すὅραμαには「幻」が簡潔で適切。
- source_word: ὁ κύριος
  choice: 主
  rationale: 定冠詞を伴うκύριοςであり、文脈上、復活したイエスを指す。「主」は固有の称号として自然。
- source_word: Ἰδοὺ ἐγώ
  choice: はい
  rationale: 直訳的な「見よ、私です」ではなく、呼びかけに対する注意・応答・用意を示す定型句の機能を、現代日本語の自然な返答で表した。
- source_word: κύριε
  choice: 主よ
  rationale: 呼格であり、幻の中で語る主への呼びかけなので「あなた」「先生」ではなく「主よ」とした。
theological_decisions:
- issue: 幻の中のὁ κύριος／κύριεが指す相手
  choice: いずれも復活したイエスを指す「主」
  alternative: 一般的な神への呼称、またはκύριεを敬称として訳す
  rationale: 使徒9章の続く文脈では、語り手はサウロについてアナニアに命じる主であり、復活したイエスとして理解される。ただし本文には「イエス」を補わず、原文の称号「主」を保った。
translation_notes:
  register: 明瞭な現代標準日本語。物語の転換を「さて」で示し、神的な話者には自然な敬語を用いた。アナニアの応答は古風な「ご覧ください、私です」を避け、定型句の機能を「はい」で簡潔に伝えた。
