revisions:
- from: そこでアナニアは出かけて行って、その家に入った。そしてサウロの上に両手を置いて言った。「兄弟サウロ。主が私を遣わされました。あなたが来る途中、その道であなたに現れたイエスです。あなたが再び見えるようになり、聖霊に満たされるためです。」
  to: そこでアナニアは出かけて行って、その家に入った。そしてサウロの上に両手を置いて言った。「兄弟サウロ、あなたが来ていた道であなたに現れた主イエスが、あなたが再び見えるようになり、聖霊に満たされるために、私を遣わされました。」
  rationale: 不自然で文法的にも不完全な二文を、原文の同格構造に対応する自然な一文へ改めた。「主イエス」が遣わした方であり、視力の回復と聖霊で満たされることが遣わした目的であることを明示した。原文の語順上の強調を機械的に再現するよりも、同格関係と目的節の統語的明瞭さを優先している。
