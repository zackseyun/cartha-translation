  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: ja
  text: そこでアナニアは出かけて行って、その家に入った。そしてサウロの上に両手を置いて言った。「兄弟サウロ、あなたが来ていた道であなたに現れた主イエスが、あなたが再び見えるようになり、聖霊に満たされるために、私を遣わされました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: そこでアナニアは出かけて行って
  rationale: δέによる物語の進展と直前の命令を受けた流れを「そこで」で示し、ἀπῆλθενは自然な日本語の「出かけて行って」とした。
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: その家に入った
  rationale: 定冠詞を、文脈上特定されている家を指す「その家」として自然に表した。
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: サウロの上に両手を置いて
  rationale: 複数形のτὰς χεῖραςを「両手」とし、付帯動作を「置いて」で表した。代名詞は日本語で対象が明確になるよう「サウロ」とした。
- source_word: Σαοὺλ ἀδελφέ
  choice: 兄弟サウロ
  rationale: 呼格の直接的な呼びかけと、アナニアが示す受容と親しい結びつきを保持した。
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: 主が私を遣わされました
  rationale: 完了形の現在に及ぶ結果は文脈上明らかなため、日本語では自然な敬語表現とした。主語「主」と目的語「私」を明示した。
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: あなたに現れたイエスです
  rationale: Ἰησοῦςが「主」を同定する同格であることを保持しつつ、原文の中断的な語順と強調を日本語で再現した。ὀφθείςはこの顕現の文脈で「現れた」とした。
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: あなたが来る途中、その道で
  rationale: ὁδόςの文字どおりの「道」を残し、未完了過去ἤρχουの進行中の移動を「来る途中」で自然に表した。
- source_word: ὅπως
  choice: ためです
  rationale: 主が遣わした目的を示す接続表現として明確で自然な日本語にした。
- source_word: ἀναβλέψῃς
  choice: 再び見えるようになり
  rationale: 失われた視力の回復を表す文脈上の意味を明確にした。
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: 聖霊に満たされる
  rationale: 受動態を保ち、属格は日本語の定着した表現「聖霊に満たされる」で自然に表した。
theological_decisions:
- issue: Ἰησοῦςとὁ κύριοςの同格関係
  choice: 「主が私を遣わされました。…イエスです」とし、イエスが主を同定することを示す
  alternative: 「あなたに現れた主イエスが、私を遣わされました」
  rationale: 原文はまず「主が私を遣わした」と述べ、その後に「イエス、あなたに現れた方」と同格的に置く。自然さを保ちながら、この談話上の順序と強調を過度に平板化しないようにした。
- issue: 冠詞のないπνεύματος ἁγίουの解釈
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 使徒言行録の文脈では神の霊を指す固有的な表現であり、日本語では「聖霊」が明確かつ自然である。冠詞の欠如から不定の霊を想定する必要はない。
- issue: ἀδελφέが示す関係
  choice: 兄弟サウロ
  alternative: サウロ兄弟
  rationale: この呼びかけが示す受容と共同体的な親しさを保ちつつ、原文の名の後に呼格が来る強い呼びかけを、日本語で格調のある聖書的表現として伝えた。
translation_notes:
  register: 明瞭な現代標準語を基調としながら、直接話法には簡潔で dignified な調子を保った。原文にある「主…イエス」という後置同格を、二文に分けることで不自然な長い挿入を避けつつ保持した。
