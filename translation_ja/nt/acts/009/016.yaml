  text: For I will show him how much he must suffer for my name[a].
translation:
  language: ja
  text: なぜなら、わたしは彼に、彼がわたしの名のためにどれほど苦しまなければならないかを示すからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの名ゆえに」または「わたしの名のためを思って」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: わたしが
  rationale: 明示された一人称代名詞の強調を保った。
- source_word: γὰρ
  choice: からである
  rationale: 直前の発言に対する理由・根拠を示す接続の働きを、自然な日本語で表した。
- source_word: ὑποδείξω
  choice: 示す
  rationale: 「示す、知らせる」という意味を簡潔に保ち、未来の意味は文脈上の発言として自然に伝わる形にした。
- source_word: αὐτῷ
  choice: 彼が…ことを（示す）
  rationale: ギリシア語では「彼に」だが、日本語では従属節の主語を「彼が」とすることで、意味を自然に表した。
- source_word: ὅσα
  choice: どれほど
  rationale: ここでは苦しみの内容を列挙するより、その大きさ・程度を表すと理解するのが自然である。
- source_word: δεῖ
  choice: なければならない
  rationale: 必要性を明確に示しつつ、それが予定・任命などのどの性質の必要性かを訳文で限定しない。
- source_word: ὑπὲρ
  choice: のために
  rationale: 理由、関わり、利益・目的を含みうる幅を保つ自然な訳語とした。
- source_word: τοῦ ὀνόματός μου
  choice: わたしの名
  rationale: 「名」が本人、その権威、また公の告白を指しうる聖書的な含みを保持した。
- source_word: παθεῖν
  choice: 苦しむ
  rationale: πάσχωの基本的で自然な意味をそのまま表した。
theological_decisions:
- issue: δεῖが表す必要性の性質
  choice: なければならない
  alternative: 苦しむことになっている／苦しむよう定められている
  rationale: 原文は必要性を述べるが、それが摂理的必然、明示的な予定、任命のいずれであるかをこの語だけで特定していないため、神学的緊張を保った。
- issue: 「わたしの名のために」の意味範囲
  choice: わたしの名のために
  alternative: わたしの名ゆえに／わたしの名を代表して
  rationale: イエスへの忠誠ゆえの苦しみと、その名のための苦しみの双方を含みうる表現を本文に置き、別のニュアンスを脚注に示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、語り手の厳粛な宣言に合う格調を保った。「わたし」は平仮名表記とし、本文の神学的含意を不必要に限定しない表現を選んだ。
