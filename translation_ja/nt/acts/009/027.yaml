source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: ja
  text: しかし、バルナバはサウロを連れて使徒たちのところへ行き、サウロが道中で主を見たこと、主が彼に語りかけたこと、またダマスコでイエスの名によって大胆に語ったことを、彼らに詳しく話した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: サウロを引き受けて
  rationale: ἐπιλαμβάνομαιの「つかむ、伴う」という具体性と、この文脈でバルナバがサウロを支援して受け入れた含意を、自然な現代日本語で表す。「捕らえて」のような敵対的意味は避ける。
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: 使徒たちのところへ連れて行き
  rationale: ἄγωの「導く、連れて行く」を素直に表し、バルナバがサウロを使徒たちに引き合わせた動作を明確にする。
- source_word: διηγήσατο αὐτοῖς
  choice: 彼らに詳しく話した
  rationale: διηγέομαιは出来事を順序立てて語る、詳しく物語ることを表すため、単なる「話した」よりも語の力を反映する。
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: 道中で…こと
  rationale: ここでὁδόςは宗教運動としての「この道」ではなく、ダマスコへの旅路を指す。「道中で」は日本語として簡潔で自然。
- source_word: εἶδεν τὸν κύριον
  choice: サウロが主を見た
  rationale: κύριοςを称号として「主」とし、ギリシア語のアオリストを報告内容の自然な日本語で表す。日本語では主語を補わないと、直前のバルナバが見たようにも読めるため「サウロ」を明示する。
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: 主が彼に語りかけた
  rationale: 直前の「主」をἐλάλησενの主語として明示し、αὐτῷはサウロを指す「彼」とする。「語りかけた」は対人的な発話を自然に示す。
- source_word: ἐπαρρησιάσατο
  choice: 大胆に語った
  rationale: παρρησιάζομαιの、恐れず自由に公然と語る意味を保つ。「宣べ伝えた」と限定せず、原語の表現上の幅を残す。
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: イエスの名によって
  rationale: 「名において」も可能だが、「名によって」はイエスとの結びつきや権威を示す聖書的表現を保ちながら、現代日本語として理解しやすい。
theological_decisions:
- issue: 「主」の指示対象
  choice: 復活したイエスを指す称号として「主」と訳す
  alternative: 一般的な神への言及とみなす
  rationale: 使徒言行録9章のダマスコ途上の出来事では、サウロに現れて語った方はイエスであり、同節末尾の「イエスの名」もその理解を支える。ただし訳文では説明的に「主イエス」とせず、原文どおり「主」を保つ。
- issue: 「イエスの名によって」の意味
  choice: 慣用句を保持し、権威・帰属・告白の含みを開いたままにする
  alternative: 「イエスの権威によって」または「イエスについて」と解釈的に限定する
  rationale: ἐν τῷ ὀνόματιは複数の関連する含意を持ち得るため、一つに絞らず、自然な日本語の聖書的慣用表現で再現する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「サウロ」を二度補って人物関係を明確にしつつ、原文の三つの報告内容と接続関係を保持した。脚注は不要。
