  source_fidelity: 「引き受けて」は現代日本語では責任・仕事などを引き受ける意味が前面に出やすく、ἐπιλαβόμενος αὐτόν（彼を取り、連れて）の具体的な動作を十分に表さない。その他の三つの報告内容、主語関係、「主」、および「イエスの名によって」は原文に忠実である。
  naturalness: 全体は明瞭な現代標準日本語である。ただし「サウロを引き受けて」はこの場面では不自然で誤解を招き得る。「連れて行き」とすることで、バルナバがサウロを使徒たちのもとへ伴った行為を自然に示せる。
  terminology: 「バルナバ」「サウロ」「使徒」「主」「ダマスコ」「イエス」は適切である。「イエスの名によって」はἐν τῷ ὀνόματιの含意を不必要に限定せず、適切に保持している。
