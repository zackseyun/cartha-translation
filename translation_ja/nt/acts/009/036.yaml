  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: ja
  text: ヨッパに、タビタ[a]という名の女性の弟子がいた。タビタは、訳すとドルカスと呼ばれる。彼女は良い行いと施しを数多く行っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ドルカス」はタビタに対応するギリシア語の名で、「ガゼル」を意味する。
    reason: 二つの固有名の対応関係と語義を説明するため。
lexical_decisions:
- source_word: μαθήτρια
  choice: 女性の弟子
  rationale: 女性形の名詞であることを日本語でも明示する。単に「弟子」でも文脈上女性と分かるが、この語形が持つ情報を自然に保持できる。
- source_word: ὀνόματι Ταβιθά
  choice: タビタという名の
  rationale: 人名を導入する与格の慣用表現を、自然な現代日本語で表した。
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: この名は、訳すとドルカスという
  rationale: セム語名に対応するギリシア語名を示す翻訳説明であり、単なる語義説明にせず、命名表現も保持した。
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: 良い行いをいつも数多くしていた
  rationale: 直訳的な「良い行いに満ちていた」は日本語では不自然になりやすいため、習慣的かつ豊富な実践という意味を後続の未完了過去と合わせて表した。
- source_word: ἐλεημοσυνῶν
  choice: 人々を助ける施し
  rationale: 困窮者への慈善的な施しを指す語である。「施し」だけでは現代日本語で意味や響きが狭くなり得るため、目的を補って明瞭にした。
- source_word: ὧν ἐποίει
  choice: いつも数多くしていた
  rationale: 未完了過去が示す継続的・習慣的な行為を「いつも…していた」で表した。
- source_word: δέ
  choice: （独立した接続語は置かない）
  rationale: 物語を進める弱い接続辞であり、この一節を自然な日本語で始める際には無理に「さて」などを補わない。
- source_word: Ἐν Ἰόππῃ
  choice: ヨッパに
  rationale: 地名を日本語聖書で一般的な形に音写し、場所を表す句として簡潔に訳した。
theological_decisions:
- issue: μαθήτριαの女性形
  choice: 女性の弟子
  alternative: 弟子
  rationale: 新約聖書でこの箇所にのみ現れる女性形が明示する情報を保ちつつ、特別な役職名や教派的含意は加えない。
- issue: ἐλεημοσυνῶνの意味範囲
  choice: 人々を助ける施し
  alternative: 慈善の行い／憐れみの行い
  rationale: 金銭だけに限定しすぎず、困窮者への具体的な援助という語の中心的意味を分かりやすく示す。
- issue: πλήρηςと未完了過去の関係
  choice: いつも数多くしていた
  alternative: 良い行いと施しに満ちていた
  rationale: 人格評価だけでなく、実際に繰り返し行っていたという本文の緊張を保持するため、πλήρηςの豊かさとἐποίειの継続性を一体として訳した。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述。「女性の弟子」で原文の女性形を保持し、「いつも数多くしていた」で習慣的な慈善活動を自然に表した。
