  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: ja
  text: サウロはエルサレムで彼らと共に出入りし、主の名によって大胆に語っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: 彼らと共に
  rationale: 継続的な交わりと行動上の結びつきを自然な日本語で表し、「滞在していた」という原文以上の居住的含意は加えない。
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: 行き来し
  rationale: 直訳的な「入り、また出て」は日本語では対象地点が曖昧で不自然なため、反復的で自由な往来を示す対句の慣用的意味を簡潔に表す。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムで
  rationale: ここでは移動の到達点というより、行き来して活動する場所を示しているため、場所を表す「で」とする。
- source_word: παρρησιαζόμενος
  choice: 大胆に語っていた
  rationale: 公然と、恐れずに語る継続的な行為を表す。日本語として定着した「大胆に語る」は、率直さと勇気の双方を保つ。
- source_word: ἐν τῷ ὀνόματι
  choice: 名によって
  rationale: 権威、代表、告白という幅を狭めずに保てる聖書的表現であり、日本語としても自然である。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: 原文の称号を固有名に置き換えず、そのまま「主」と訳す。文脈上の指示対象はイエスである。
theological_decisions:
- issue: 「主」が指す方
  choice: 本文では称号「主」を保持する。
  alternative: 「イエス」と明示する。
  rationale: ギリシア語本文はἸησοῦではなくκυρίουである。使徒言行録における称号の神学的響きと、原文の表現を保つため、指示対象を固有名に置き換えない。
translation_notes:
  register: 明快な現代標準日本語。物語文として品位を保ちつつ、「行き来し」でギリシア語の対句を自然に表現した。未完了過去と現在分詞の継続性は「語っていた」によって示し、「彼らと共に」と「行き来し」を同一の継続的活動としてまとめた。
