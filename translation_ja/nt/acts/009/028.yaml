  terminology: 「主」は κύριος の称号を保ち、「主の名によって」は ἐν τῷ ὀνόματι の意味の幅を不必要に限定しません。「大胆に語っていた」は παρρησιαζόμενος の公然性・恐れなさと継続性を適切に表します。
