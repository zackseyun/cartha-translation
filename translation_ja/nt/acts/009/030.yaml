  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: ja
  text: 兄弟たちはこのことを知ると[a]、彼をカイサリアへ連れて下り、タルソへ送り出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは信者の共同体を広く指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: このことを知ると
  rationale: アオリスト分詞が、続く行動のきっかけとなった事情を示す。目的語は前節の殺害計画を文脈から補い、「このこと」とした。
- source_word: οἱ ἀδελφοὶ
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文では形に即して訳した。この語が信者共同体を広く指し得ることは脚注で示す。
- source_word: κατήγαγον
  choice: 連れて下り
  rationale: κατά-が表す方向性を保ち、内陸のエルサレムから海岸のカイサリアへ向かう移動を自然な日本語で表した。
- source_word: Καισάρειαν
  choice: カイサリア
  rationale: 日本語聖書で一般的な地名表記を採用した。
- source_word: ἐξαπέστειλαν
  choice: そこから……送り出した
  rationale: 単なる派遣ではなく、カイサリアからさらに目的地へ送り出す物語上の動きを表した。「そこから」は原文に明示されないが、二段階の移動関係を自然に示す。
- source_word: Ταρσόν
  choice: タルソ
  rationale: 日本語聖書で一般的な地名表記を採用した。
theological_decisions:
- issue: 混成の信者共同体を指し得る ἀδελφοί の訳
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／仲間の信者たち
  rationale: 本文では男性複数形を保ちつつ、この文脈で女性を含む信者共同体全体を指す可能性を脚注に明記し、語形と指示範囲の緊張を残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「連れて下り」で原文の方向性を保ち、「送り出した」で ἐξαποστέλλω の送り出すニュアンスを表した。
