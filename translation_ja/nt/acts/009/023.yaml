base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: ja
  text: かなりの日が過ぎると、ユダヤ人たちは[a]サウロを殺そうと共謀した。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「ユダヤ人たち」は、サウロに敵対した特定の人々を指しており、すべてのユダヤ人を例外なく指すものではない。
    reason: cultural_note
  - marker: b
    text: 「共謀した」は「一緒に謀った」とも訳せる。また「かなりの日が過ぎると」は、直訳では「かなりの日々が満ちつつあった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί
  choice: かなりの日数が過ぎたころ
  rationale: 時間の経過を表す構文として自然な現代日本語にした。ἡμέραι ἱκαναίは単なる「十分な日数」ではなく、相当の期間を指すため「かなりの日数」とした。ἐπληροῦντοの字義的な「満たされていた／満了しつつあった」は脚注で示す。
- source_word: συνεβουλεύσαντο
  choice: 共謀した
  rationale: 共同で相談したことに加え、殺害という敵意ある目的を含む文脈を簡潔に伝える。「一緒に謀った」も可能なため脚注に示す。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の表現を不当に「指導者たち」などへ限定せず保持する。ただし文脈上、全ユダヤ人を例外なく指すのではないことを脚注で明確にする。
- source_word: ἀνελεῖν αὐτόν
  choice: サウロを殺そうと
  rationale: ἀναιρέωの生命を奪う意味を直接的な「殺す」で表した。αὐτόνの指示対象は文脈上サウロであり、日本語では名を補うほうが明瞭で自然である。
theological_decisions:
- issue: 敵対的文脈における οἱ Ἰουδαῖοι の訳
  choice: ユダヤ人たち
  alternative: ユダヤの指導者たち／ユダヤ地方の人々
  rationale: 原文は対象を指導者に限定しておらず、「ユダヤ地方の人々」とする地理的限定もこの節だけからは確定できない。そのため本文では原文の広さを保ちつつ、実際の指示対象がサウロに敵対した特定の人々であり、全ユダヤ人ではないことを注記した。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、物語文にふさわしい簡潔で dignified な調子を保った。脚注記号は該当表現の直後に置いた。
