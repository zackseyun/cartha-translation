  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: ja
  text: しかし、主は彼に言った。「行きなさい。この人は、わたしの名を異邦人[a]や王たち、またイスラエルの子ら[b]の前に携えるために、わたしが選んだ器なのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。ここでは、イスラエルの民以外の人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエルの子ら」は、イスラエルの民を指す聖書の伝統的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 物語の中で復活したイエスを指す称号として、自然で定着した訳語を用いた。
- source_word: Πορεύου
  choice: 行きなさい
  rationale: 命令の力を保ちつつ、現代日本語として自然で明快にした。
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: わたしが選んだ器
  rationale: σκεῦος の比喩を「器」として保ち、ἐκλογῆς と μοι が示す主による選びと帰属を、過度に教理化せず自然な日本語で表した。
- source_word: τοῦ βαστάσαι τὸ ὄνομά μου
  choice: わたしの名を…携えて行くために
  rationale: 目的を表す不定詞を明示し、使命において主の名を公に担い運ぶという比喩的な響きを保った。
- source_word: ἐνώπιον
  choice: …の前に
  rationale: 公に証しする場面に合い、原文の空間的・対人的表現を簡潔に保つ。
- source_word: ἐθνῶν
  choice: 異邦人
  rationale: 「イスラエルの子ら」と対置される文脈では、非ユダヤ人を指す「異邦人」が最も自然である。字義的な別訳は脚注に示した。
- source_word: βασιλέων
  choice: 王たち
  rationale: 複数形を保ち、一般化せず字義どおりに訳した。
- source_word: υἱῶν Ἰσραήλ
  choice: イスラエルの子ら
  rationale: 原文の男性複数の家族的表現を見える形で保った。これはイスラエルの民を指す聖書的な慣用表現であることを脚注で補った。
- source_word: τε ... καὶ ... τε
  choice: …や…、また…
  rationale: 三つの対象群の連結を、日本語として不自然に粒立てすぎない形で表した。
theological_decisions:
- issue: ἐκλογῆς（選び）を後代の予定論的体系へ過度に結び付ける可能性
  choice: 「わたしが選んだ器」
  alternative: 「わたしの選びの器」／「選びの器」
  rationale: 本文が明言するのは、この人物が使命のために主から選ばれたということである。「わたしが選んだ器」はその主張を保ちつつ、救済論上の特定体系まで訳文に持ち込まない。
- issue: σκεῦος の比喩を機能的に解消するか
  choice: 「器」
  alternative: 「道具」／「手段」
  rationale: 「器」は人が神の目的のために用いられるという原文の比喩と神学的緊張を保つ。「道具」では日本語で非人格的・軽蔑的な響きが強くなり得る。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「主」「わたしの名」「器」「イスラエルの子ら」という聖書的な語感を保った。「携えて行く」は βαστάζω の運搬のイメージと宣教上の使命の双方が伝わる表現とした。
