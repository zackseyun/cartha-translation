base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: ja
  text: 彼はギリシア語を話すユダヤ人たち[a]に語りかけ、論じ合っていた。ところが、彼らは彼を殺そうとしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「ヘレニストたち」。使徒言行録の文脈では、一般にギリシア語を話すユダヤ人たちを指すと理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: 語り……していた
  rationale: 未完了過去の継続的・反復的な動作を、後続の動詞と合わせて「していた」で表した。
- source_word: τε καὶ
  choice: 語り、議論を交わし
  rationale: 二つの並列された動作を、現代日本語として自然な読点と連用形で結んだ。
- source_word: συνεζήτει
  choice: 議論を交わしていた
  rationale: 単なる会話ではなく、相手との活発な論争・討論を表す語であるため。
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: ギリシア語を話すユダヤ人たちに……議論を交わしていた
  rationale: πρόςが対人的なやり取りを示すことを、日本語では「に語り」と「議論を交わす」の組み合わせで自然に表現した。
- source_word: Ἑλληνιστάς
  choice: ギリシア語を話すユダヤ人たち
  rationale: 使徒言行録の文脈では、一般の異邦人ではなく、ギリシア語を常用するユダヤ人集団を指すと考えられる。一般読者に意味が直接伝わる表現を本文に置いた。
- source_word: οἱ δὲ
  choice: ところが、彼らは
  rationale: δέによる敵対的な展開への転換を明確に示した。
- source_word: ἐπεχείρουν
  choice: 企てていた
  rationale: 実行に着手しようとする意図と未完了過去の継続性をともに表した。
- source_word: ἀνελεῖν αὐτόν
  choice: 彼を殺そうと
  rationale: この文脈でἀναιρέωは「殺す」を意味するため、明快で直接的な現代日本語とした。
theological_decisions:
- issue: Ἑλληνιστάςの指す集団
  choice: ギリシア語を話すユダヤ人たち
  alternative: ヘレニストたち／ギリシア語を話す人々／ギリシア人たち
  rationale: 使徒言行録6章1節などの用法から、ここではギリシア語を常用するユダヤ人集団を指す可能性が最も高い。ただし原語自体は社会言語的な呼称なので、その点を脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用い、叙事の継続性と後半の敵対的転換を保った。「ヘレニスト」という専門的で分かりにくい呼称は脚注に置き、本文では意味を明示した。
