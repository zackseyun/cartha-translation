id: ACT.9.12
reference: Acts 9:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: ja
  text: そしてサウロは幻の中で、アナニアという名の人が入って来て、サウロが再び見えるようになるために彼に手を置くのを見た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: 見た
  rationale: アオリストの過去の出来事を、現代日本語で自然に表した。文脈上、幻はすでに与えられているが、日本語では単純過去でも現在との関連が失われない。
- source_word: ἐν ὁράματι
  choice: 幻の中で
  rationale: 見たことの領域・媒体を示す前置詞句を、明快で一般的な聖書語彙で表した。
- source_word: ἄνδρα … Ἁνανίαν ὀνόματι
  choice: アナニアという名の人
  rationale: 人物を名によって特定するギリシア語の表現を、自然な現代日本語にした。
- source_word: εἰσελθόντα
  choice: 入って来て
  rationale: 幻の中でアナニアが中へ入る動作を、視点に即した自然な連用表現で示した。
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: サウロに手を置く
  rationale: 複数形の「手」は日本語の慣用表現では「手を置く」とするのが自然である。αὐτῷの指示対象を文脈に基づいてサウロと明示し、代名詞の混乱を避けた。
- source_word: ὅπως ἀναβλέψῃ
  choice: 目が再び見えるようになるために
  rationale: ὅπωςの目的を保ち、治癒の文脈におけるἀναβλέπωを「再び見えるようになる」と明快に訳した。
theological_decisions:
- issue: 手を置く行為の神学的意味をどこまで明示するか
  choice: サウロに手を置く
  alternative: サウロを癒やすために手を置く
  rationale: 原文は身体的な行為と視力回復の目的を述べるが、その行為を特定の秘跡、按手礼、あるいは独立した治癒方法とは定義していないため、その意味を付加しなかった。
- issue: 視力回復をアナニアの直接的な作用として表すか
  choice: 目が再び見えるようになるために
  alternative: 目を再び見えるようにしてくれるために
  rationale: 原文の従属節では、再び見えるようになる主体はサウロである。アナニアを直接の治癒主体と断定する使役・恩恵表現を避け、目的節の形を保った。
translation_notes:
  register: 常体を用い、現代の一般読者に明快でありながら聖書本文として落ち着いた調子にした。代名詞をそのまま重ねると日本語では指示対象が曖昧になるため、文脈上の指示対象である「サウロ」を明示した。
