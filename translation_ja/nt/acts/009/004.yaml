id: ACT.9.4
reference: Acts 9:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: ja
  text: そして地面に倒れると、彼は自分に語りかける声を聞いた。「サウロ、サウロ、なぜわたしを迫害するのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: 地面に倒れると
  rationale: アオリスト分詞と方向を表す前置詞句を、先行する動作として自然な現代日本語で表した。「地面」はこの場面に即し、「倒れると」は主動詞との時間的な流れを示しつつ、原因などを付加しない。
- source_word: ἤκουσεν φωνὴν
  choice: 声を聞いた
  rationale: 後続する直接話法から、φωνήは単なる音ではなく、言葉を発する「声」を指す。
- source_word: λέγουσαν αὐτῷ
  choice: 自分に語りかける
  rationale: αὐτῷがサウロを指すことを日本語で明確にし、単なる発話ではなく彼に向けられた言葉であることを自然に表す。
- source_word: Σαοὺλ Σαούλ
  choice: サウロ、サウロ
  rationale: 人名を一般的な新約聖書の表記で音写し、強調と呼びかけの情感を帯びる反復を保持した。
- source_word: τί με διώκεις
  choice: なぜわたしを迫害するのか
  rationale: τίはこの構文では理由を問う「なぜ」。διώκειςは文脈上、信者への継続的で敵対的な追及を表すため「迫害する」とした。現在形の継続性は日本語では文脈と動詞によって十分に伝わる。
theological_decisions:
- issue: 語り手とサウロが攻撃している人々との同一視
  choice: 「わたし」を説明的に言い換えず、そのまま保持する。
  alternative: 「わたしの民を」「わたしに従う者たちを」などと補足する。
  rationale: 原文は語り手自身を直接目的語とし、迫害される共同体との強い同一視を示す。解釈的説明を本文に加えず、その神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「語りかける」によりλέγουσαν αὐτῷを簡潔かつ自然に表現し、直接話法は厳粛な問いとして「〜のか」を用いた。
