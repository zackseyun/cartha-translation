id: ACT.26.18
reference: Acts 26:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: ja
  text: 彼らの目を開き、彼らが闇から光へ、サタンの支配[a]から神へと立ち返り、罪の赦しと、わたしへの信仰によって聖なる者とされた人々の中で受け継ぐ分[b]とを得るためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「サタンの権威」または「サタンの勢力」とも訳せる。ギリシア語は、権威、支配権、または支配領域を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「相続分」または「割り当てられた分」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: 彼らの目を開き
  rationale: 目が開かれるという具体的な比喩を保ち、「理解させる」などと説明的に限定しない。
- source_word: τοῦ ἐπιστρέψαι
  choice: 彼らが……立ち返り
  rationale: 目的を表す不定詞として訳し、ἐπιστρέφωの方向転換・回心の含意を自然な日本語で保つ。受動的な「改宗させられる」とはしない。
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: 闇から光へ
  rationale: 原文の対照的な比喩を簡潔にそのまま保つ。
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: サタンの支配
  rationale: ἐξουσίαは権威、支配権、勢力圏を表し得る。この文脈では、そこから神へ立ち返るという移行を自然に示す「支配」を採用する。
- source_word: ἐπὶ τὸν θεόν
  choice: 神へと
  rationale: 方向転換を示す文脈に合わせ、神に向かうことを簡潔に表す。
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: ……得るため
  rationale: 第二の目的を示す不定詞を自然な日本語で表し、赦しと受け継ぐ分が授けられるものであることを保つ。
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: 罪の赦し
  rationale: 新約聖書で定着しており、現代日本語でも明瞭な表現。
- source_word: κλῆρον
  choice: 受け継ぐ分
  rationale: 割り当てられた分と相続財産の双方の含みを、一般読者に分かりやすい日本語で表す。
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: 聖なる者とされた人々の中で
  rationale: 完了受動分詞が示す、聖なる者とされた結果が続いている状態を保つ。単に「聖徒」として固定的な称号にはしない。
- source_word: πίστει τῇ εἰς ἐμέ
  choice: わたしへの信仰によって
  rationale: πίστιςを「信仰」とし、εἰς ἐμέがその対象をイエスに定めていることを明示する。語順と統語関係に従い、「聖なる者とされた」に結び付ける。
theological_decisions:
- issue: πίστει τῇ εἰς ἐμέ の解釈
  choice: わたしへの信仰によって
  alternative: わたしを信頼することによって
  rationale: ここは属格句をめぐる論争的な構文ではなく、信仰の対象が「わたし」であることを明示する表現である。「信仰」は原語の宗教的・関係的な幅を保つ。
- issue: πίστει τῇ εἰς ἐμέ が修飾する語句
  choice: 聖なる者とされた人々を修飾する
  alternative: 彼らが赦しと受け継ぐ分を得る手段と読む
  rationale: 語順と冠詞を伴う表現は直前の τοῖς ἡγιασμένοις と密接に結び付くため、その関係を日本語でも保つ。ただし信仰と救いの諸益との神学的関係を否定する意図ではない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、宣教委任の荘重さを保った。「目」「闇」「光」という原文の比喩は説明に置き換えず、そのまま生かした。脚注記号は、それぞれ実際に説明する「支配」と「受け継ぐ分」の直後に置いた。
