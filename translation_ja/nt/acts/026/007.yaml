id: ACT.26.7
reference: Acts 26:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: ja
  text: 私たちの十二部族[a]は、夜も昼もひたすら神に仕え[b]ながら、その約束にあずかることを望んでいます。王よ、私はこの望みのことでユダヤ人たちから訴えられているのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「十二部族から成る私たちの民」。原文は単数形の集合名詞で、イスラエルを十二部族の民として一つに捉えています。
    reason: lexical_alternative
  - marker: b
    text: 「仕える」は、神にささげる宗教的奉仕または礼拝を表す語です。「神を礼拝しながら」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: ここで「ユダヤ人たち」とは、法廷でパウロを告発している人々を指しており、すべてのユダヤ人を一括して述べたものではありません。
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: その約束に
  rationale: 関係代名詞の先行詞は前節の「約束」。εἰς の目標・到達点の意味を「に」で示し、文脈上の指示対象を自然な日本語で明示した。
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: 私たちの十二部族
  rationale: 集合的単数でイスラエルの十二部族全体を指す。日本語では「十二部族」が自然であり、複数集団ではなく一つの民を集合的に指し得る。
- source_word: ἐν ἐκτενείᾳ
  choice: ひたすら
  rationale: 熱心さと絶え間ない専心を簡潔な現代日本語で表す。
- source_word: νύκτα καὶ ἡμέραν
  choice: 夜も昼も
  rationale: ギリシア語の語順を保ちつつ、継続的な奉仕を示す自然な日本語とした。
- source_word: λατρεῦον
  choice: 神に仕えながら
  rationale: 神に向けられた宗教的奉仕・礼拝を表す語。文脈上明らかな対象である「神」を補い、広い奉仕の意味を保った。
- source_word: ἐλπίζει καταντῆσαι
  choice: 到達することを望んでいます
  rationale: καταντάω の目標に達するという方向性を保持し、約束の成就にあずかる期待を過度に具体化せず表した。
- source_word: περὶ ἧς ἐλπίδος
  choice: この望みのことで
  rationale: περί＋属格の「〜に関して」を自然な法廷文脈の日本語で表し、原因を断定する訳にはしなかった。
- source_word: ἐγκαλοῦμαι
  choice: 訴えられている
  rationale: 法的な告発を受けている場面に適した、明瞭な現代日本語。
- source_word: ὑπὸ Ἰουδαίων
  choice: ユダヤ人たちから
  rationale: 行為者を表すὑπόを「から」とし、無冠詞複数を特定の告発者たちとして文脈的に読める形にした。全ユダヤ人を一括して指す表現ではないことを脚注で明確にする。
- source_word: βασιλεῦ
  choice: 王よ
  rationale: アグリッパ王への直接の呼びかけを、簡潔で格調ある呼格として保持した。
theological_decisions:
- issue: λατρεῦον の暗黙の対象
  choice: 「神に仕えながら」として神を明示
  alternative: 「礼拝しながら」または対象を補わず「仕えながら」
  rationale: 原文に神を表す名詞はないが、イスラエルの宗教的奉仕という文脈では神が対象である。明示は新たな神学的主張を加えるものではなく、日本語の明瞭さのためである。
- issue: 望みの指示内容
  choice: 前節の「約束」と結び付けるが、その内容を本節で具体化しない
  alternative: 「復活の望み」と明示する
  rationale: 周辺文脈には復活の主題があるが、本節自体はその内容を言い直していないため、原文の連結と含みを保った。
- issue: 十二部族の集合性
  choice: 「私たちの十二部族」
  alternative: 「十二部族から成る私たちの民」
  rationale: 原文の集合的単数を踏まえつつ、日本語で過度に説明的にならない表現を選んだ。別訳は脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法廷での弁明にふさわしい簡潔な格調を保った。「王よ」で直接呼びかけの修辞性を残し、「ひたすら」「夜も昼も」で継続的で熱心な奉仕を自然に表現した。
