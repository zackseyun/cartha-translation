  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: ja
  text: 私たちが皆、地に倒れたとき、私はヘブライ語[a]で私に語りかける声を聞いた。「サウロ、サウロ、なぜ私を迫害するのか。突き棒に逆らって蹴るのは、あなたにとってつらいことだ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アラム語」とも考えられる。ギリシア語の表現は字義的には「ヘブライの言語（方言）で」。
    reason: alternative_reading
  - marker: b
    text: 家畜を追い立てるための先のとがった棒を蹴ると、自ら傷つく。抵抗しても自分を苦しめるだけだ、という格言。
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: 私たちが皆、地に倒れたとき
  rationale: 属格絶対を自然な時の従属節とし、πάντων と ἡμῶν による「私たち全員」を保った。アオリスト分詞は、声を聞くことに先立つ出来事として表した。
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: 私は……私にこう語りかける声を聞いた
  rationale: φωνή は後続する直接話法から「音」ではなく「声」とした。λέγουσαν πρός με は、声がパウロ本人に向けられていることを自然な日本語で示した。
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: ヘブライ語で
  rationale: ギリシア語本文の字義を本文に残した。使徒言行録におけるこの表現をアラム語と理解する可能性は注で示し、本文では確定しなかった。
- source_word: Σαοὺλ Σαούλ
  choice: サウロ、サウロ
  rationale: 人名の反復をそのまま保ち、呼びかけの強調を再現した。日本語で一般的な新約聖書の表記「サウロ」を用いた。
- source_word: τί με διώκεις;
  choice: なぜ私を迫害するのか
  rationale: 現在形の継続的な敵対行為を、簡潔で自然な直接話法として表した。
- source_word: σκληρόν σοι
  choice: あなたにとってつらいことだ
  rationale: σκληρόν の「厳しい、つらい」という幅を保ちつつ、与格 σοι を「あなたにとって」と明示した。単に行為が難しいという意味に狭めず、抵抗によって本人が苦痛を負う格言の含みを残した。
- source_word: πρὸς κέντρα λακτίζειν
  choice: 突き棒を蹴る
  rationale: κέντρα は家畜を追うための先のとがった棒を指す。「突き棒」とすることで具体物を示し、λακτίζειν の「蹴る」と格言的比喩を保った。意味は注で補った。
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ が指す言語
  choice: 本文では「ヘブライ語」
  alternative: 「アラム語」
  rationale: 原文は字義的には「ヘブライの言語／方言」と述べる。一世紀の言語状況を踏まえてアラム語を指すとする理解もあるが、本文で一方に決めず、代案を脚注に残した。
- issue: 突き棒の格言の解釈
  choice: 比喩を本文に保ち、含意を脚注で説明
  alternative: 「抵抗しても自分を傷つけるだけだ」と本文で意訳
  rationale: 原文の鮮明な格言表現と、その解釈上の余地を保持するため。脚注では当時の家畜追いの背景と一般的な含意のみを説明し、特定の教理的意味を加えない。
translation_notes:
  register: 明瞭で現代的ながら、直接話法の厳粛さを保つ文体とした。「サウロ、サウロ」の反復と「突き棒を蹴る」という比喩は原文に即して維持し、現代の読者に必要な言語的・文化的情報は脚注に置いた。
