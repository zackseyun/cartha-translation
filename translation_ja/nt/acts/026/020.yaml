id: ACT.26.20
reference: Acts 26:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: ja
  text: しかし私は、まずダマスコの人々に、またエルサレムとユダヤ全地方の人々に、さらに異邦人[a]に、悔い改めて神に向き直り、悔い改めにふさわしい行い[b]をするよう宣べ伝えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「諸国民」。ここではユダヤ人ではない人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 「悔い改めにかなう行い」とも訳せる。悔い改めに伴い、それに適合する行動を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の「従わなかったのではない」という趣旨を受ける対照を、自然な日本語で示す。
- source_word: τοῖς ἐν Δαμασκῷ
  choice: ダマスコにいる人々に
  rationale: 場所にいる人々を指す与格の意味を明示し、宣教の対象として自然に表した。
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: まずダマスコにいる人々に、次いでエルサレムに
  rationale: πρῶτονとτε καὶが示す順序と追加を、日本語で分かりやすく表した。
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: さらにユダヤ全地方の人々
  rationale: χώραを広い地理的範囲として「地方」とし、宣教対象が人々であることを補って自然にした。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人
  rationale: エルサレムとユダヤに続く文脈では、非ユダヤ人を指す語として「異邦人」が正確で定着している。
- source_word: ἀπήγγελλον
  choice: 宣べ伝えました
  rationale: 宣教の場面における公の告知を表し、現代日本語としても聖書的な品位を保つ。
- source_word: μετανοεῖν
  choice: 悔い改めて
  rationale: 単なる考え直しではなく、神に向かう文脈での全面的な悔い改めを表す標準的な訳語。
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: 神に立ち返り
  rationale: 神の方へ向きを変える意味を自然に表す。「戻る」と限定して異邦人にも以前の所属を前提とすることは避けた。
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: 悔い改めにふさわしい行い
  rationale: ἄξιαの適合・相応の意味とἔργαの実践的な意味を、功績性を付加せずに表した。
- source_word: πράσσοντας
  choice: するように
  rationale: 不定詞二つに続く分詞を、悔い改めと神への転回に伴う実践として自然な日本語に統合した。
theological_decisions:
- issue: 悔い改め、神への転回、行いの関係
  choice: 悔い改めて神に立ち返り、それにふさわしい行いをするよう宣べ伝えた、と訳す。
  alternative: 行いを悔い改めそのものの内容、または神に受け入れられる功績的根拠として明示する。
  rationale: 原文はμετανοεῖνとἐπιστρέφεινを告知された応答として置き、分詞πράσσονταςによって、それに伴う行動を述べる。因果関係や功績性を本文以上に断定せず、両者の密接な関係を保った。
- issue: ἐπιστρέφεινの方向性
  choice: 「神に立ち返り」とする。
  alternative: 「神のもとに戻り」とし、以前の関係への復帰を強調する。
  rationale: 「立ち返る」は日本語で悔い改めと方向転換を表せる一方、異邦人全員に以前の契約的所属があったとまでは限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒の弁明としての品位を保った。「宣べ伝える」「悔い改める」「立ち返る」は一般読者にも理解可能な定着表現である。脚注記号は該当語句の直後と節末に置いた。
