  naturalness: 「正気ではない」「多くの学問があなたを狂気へと駆り立てている」は、現代標準日本語として明快であり、フェストゥスの大声の非難も保ちます。
  terminology: ἀπολογουμένου の法的・公的な弁明の含意を「弁明をしている」で保持します。γράμματα はこの文脈では「学問」とするのが適切です。「狂気」は原文の μαίνῃ／μανίαν の反復した強い非難を保ちます。
