  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: ja
  text: パウロがこのようなことを弁明しているとき、フェストゥスは大声で言った。「パウロ、あなたは正気ではない。多くの学問があなたを狂気へと駆り立てている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: 弁明していると
  rationale: 属格独立構文による同時進行を自然な日本語で示しつつ、法廷・公的場面で申し開きをするという語の意味を保った。
- source_word: μεγάλῃ τῇ φωνῇ
  choice: 大声で
  rationale: 声の大きさを表す様態の与格を、明快で自然な現代日本語にした。
- source_word: φησιν
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語文として自然な過去形にした。
- source_word: Μαίνῃ
  choice: 気が狂っている
  rationale: 単なる興奮や愚かさではなく、正気を失っているとの強い断定を明確に表した。
- source_word: τὰ πολλά ... γράμματα
  choice: 学問のしすぎ
  rationale: γράμματα は文脈上、個々の文字や文書ではなく学識・学問を指す。τὰ πολλά の量的な強調と、原因を非難するフェストゥスの口調を自然に表した。
- source_word: εἰς μανίαν περιτρέπει
  choice: 気が狂ってしまったのだ
  rationale: 狂気の状態へ追いやるという結果的意味を自然な日本語で表現した。直前の Μαίνῃ との反復も保持した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。フェストゥスの突然の強い遮りを、短い断定文と「大声で」で再現した。「おまえ」は公的な場での非難の鋭さを示すが、過度に俗悪な表現は避けた。
