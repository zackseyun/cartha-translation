id: ACT.26.10
reference: Acts 26:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: ja
  text: 私もエルサレムでこのようなことを行いました。祭司長たちから権限を受けて、聖なる人々[a]の多くを牢に閉じ込めただけでなく、彼らが殺されるときには、彼らに反対する票[b]を投じました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる人々」とは、神に属する人々、すなわちイエスを信じる人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「票を投じました」。正式な裁決で票を投じたことを意味する可能性も、彼らの死に賛成したことを表す言い方である可能性もある。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: 私は…実際にそのとおりにしました
  rationale: 直前の迫害行為を受ける関係代名詞節を、現代日本語で自然な回顧表現として訳した。καίの強意も「実際に」で表した。
- source_word: πολλούς τε τῶν ἁγίων
  choice: 聖なる者たちの多く
  rationale: ἅγιοιの基本的意味と、神に属する共同体を指す用法を保つ。「聖徒」より一般読者に意味が伝わりやすく、後代の列聖概念も避けられる。
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: 牢に閉じ込めた
  rationale: κατακλείωの「閉じ込める」という具体的な力を保った。φυλακαῖςは複数形だが、日本語では総称的な「牢」が自然である。
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: 祭司長たちから権限を受け
  rationale: 行為の根拠を示す分詞句として訳した。ἐξουσίαはここでは公的な許可・権限を表す。
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: 彼らが死刑にされるとき
  rationale: 受動分詞の時間的関係を明示し、ἀναιρέωの死に至らせる意味を表した。「処刑」より原文の制度的詳細を過度に限定しない。
- source_word: κατήνεγκα ψῆφον
  choice: 彼らに反対する票を投じました
  rationale: ψῆφοςの具体的な「票」と、καταφέρωを伴う投票表現を保持した。「反対する」は迫害と死刑の文脈から含意される方向性を自然な日本語で補った。
theological_decisions:
- issue: ἅγιοιが指す人々
  choice: 「聖なる者たち」とし、イエスを信じる神の民を指すことを注で説明
  alternative: 「聖徒」「信者たち」「神の民」
  rationale: 共同体全体を指す語義を保ちつつ、特別に列聖された一部の人々という後代的な含意を避ける。
- issue: κατήνεγκα ψῆφονの厳密な含意
  choice: 本文では「票を投じた」と訳し、正式な投票か同意の比喩かという余地を注で保持
  alternative: 「殺害に賛成した」
  rationale: 原文の投票語彙をそのまま生かし、パウロの正確な公的地位や制度上の場を本文だけから断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。パウロの告白の重さを保ちつつ、長いギリシア語文を二文に分けて読みやすくした。
