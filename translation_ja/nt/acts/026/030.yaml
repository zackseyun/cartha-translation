  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: ja
  text: それから、王と総督、ベルニケ、また彼らと同席していた人々が立ち上がった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέστη
  choice: 立ち上がった
  rationale: ここでは席から立つ身体動作を表す。公的な場面にも合う自然な現代日本語とした。
- source_word: τε
  choice: それから／また
  rationale: 最初の τε は物語の進行を示す「それから」で表し、後の τε は列挙をつなぐ「また」に反映した。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: ギリシア語は固有名ではなく称号を用いているため、そのまま「王」とした。
- source_word: ὁ ἡγεμὼν
  choice: 総督
  rationale: 使徒言行録の文脈ではローマの属州統治者を指すため、日本語で歴史的・行政的に明確な「総督」とした。
- source_word: Βερνίκη
  choice: ベルニケ
  rationale: ギリシア語 Βερνίκη に即した、日本語聖書で一般的な音写を採用した。
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: 彼らと同席していた人々
  rationale: 共に座っていたという意味を保ちつつ、社会的身分や役割を推測せず自然な日本語にした。
- source_word: καὶ
  choice: と／、
  rationale: 列挙の加算関係を、日本語として自然な並列表現で示した。
