base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: ja
  text: こうしたことが理由で[a]、ユダヤ人たちが神殿の境内で[b]私を捕らえ、殺そうとしていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このために」「こうしたことのゆえに」。
    reason: lexical_alternative
  - marker: b
    text: ここで「神殿」と訳したギリシア語は、内側の聖所だけでなく、境内を含む神殿域全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: こうしたことのために
  rationale: ἕνεκαと属格は原因・理由を表す。直前までに述べられたパウロの宣教と行動を受ける後方照応を保った。
- source_word: με
  choice: 私を
  rationale: συλλαβόμενοιの目的語である一人称単数対格を、そのまま自然な日本語にした。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人たちは
  rationale: 事件に加わったユダヤ人の反対者たちを指す。日本語には冠詞がないため、文脈上の特定集団を示す「は」を用いたが、ユダヤ人全体を指す表現とはしていない。
- source_word: συλλαβόμενοι
  choice: 捕らえ
  rationale: 敵対的に取り押さえる、捕らえるという意味を明瞭に表す。「逮捕し」では公的な法執行という含みが強すぎる。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内で
  rationale: ἱερόνは内陣だけでなく神殿域全体を指すため、日本語で建物内部と誤解されにくい「神殿の境内」とした。
- source_word: ἐπειρῶντο
  choice: しようとした
  rationale: 未完了過去が表す、実行を試みていたという局面を自然な日本語で示した。
- source_word: διαχειρίσασθαι
  choice: 殺そう
  rationale: この文脈では暴力によって殺すことを意味する。法的・道徳的評価を余分に加える「殺害する」「謀殺する」より、平明な「殺す」を選んだ。
theological_decisions:
- issue: 論争的文脈におけるἸουδαῖοιの指示範囲
  choice: 「ユダヤ人たちは」と訳し、文脈上、パウロを捕らえた特定の反対者たちを指すものとした。
  alternative: 「ユダヤの人々は」または「ユダヤ人が」
  rationale: 歴史的な当事者を消さず、同時にユダヤ人全体への非難へ広げないよう、指示範囲を文脈に委ねた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法廷でのパウロの弁明にふさわしい落ち着いた語調とした。「のです」により、直前の説明を受けた理由提示として自然につないだ。
