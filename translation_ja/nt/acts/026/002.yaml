  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: ja
  text: アグリッパ王よ、ユダヤ人たちから訴えられているすべての事柄について、今日あなたの前で弁明しようとしていることを、私は幸いに思います。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵まれている」とも訳せる。ここでは、アグリッパの前で弁明できることを幸運であり光栄なことと考えている、という意味である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: すべての事柄について
  rationale: περί＋属格が示す主題を「～について」で表し、πάντωνの包括性も「すべて」で保持した。
- source_word: ἐγκαλοῦμαι
  choice: 訴えられている
  rationale: 法的な場面で正式な非難・告発を受けていることを表す現在形として、自然な現代日本語を選んだ。
- source_word: ὑπὸ Ἰουδαίων
  choice: ユダヤ人たちから
  rationale: ὑπόの行為主体を「から」で示した。文脈上はパウロを訴えているユダヤ人たちを指し、民族全体への一括した非難とはしない。
- source_word: βασιλεῦ Ἀγρίππα
  choice: アグリッパ王よ
  rationale: 呼格による直接の呼びかけを、現代日本語でも明確かつ荘重に表した。
- source_word: ἥγημαι ἐμαυτὸν
  choice: 私は、自分を…と思います
  rationale: ἡγέομαιと再帰代名詞の構造を保ちつつ、「考えます」より自然な発言調の「思います」とした。
- source_word: μακάριον
  choice: 幸いだ
  rationale: この法廷的文脈では、神学的意味に限定せず、好都合で恵まれた立場にあるとの意味を表せる。「幸せだ」よりも品位と文脈適合性が高い。
- source_word: ἐπὶ σοῦ
  choice: あなたの前で
  rationale: 聴聞の相手であるアグリッパの面前で弁明するという法廷的意味を簡潔に表した。
- source_word: μέλλων
  choice: することになっている
  rationale: これから間もなく行う予定・成り行きを示す μέλλω の将来的な力を保持した。
- source_word: σήμερον
  choice: 今日
  rationale: 時間を示す副詞をそのまま自然な現代日本語で訳した。
- source_word: ἀπολογεῖσθαι
  choice: 弁明する
  rationale: 自らの訴えに答えて正式に弁護の陳述をするという法廷的意味を表す。
theological_decisions:
- issue: μακάριον の意味範囲
  choice: 幸いだ
  alternative: 祝福されている／恵まれている
  rationale: この箇所では、アグリッパの前で弁明できる有利さ・光栄を述べる用法が中心と考えられるが、語の持つ「恵まれた」含意を脚注で残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、王への直接の呼びかけと法廷での正式な弁明という場面にふさわしい品位を保った。原文の長い語順を過度に崩さず、日本語として追いやすい構文に整えた。
