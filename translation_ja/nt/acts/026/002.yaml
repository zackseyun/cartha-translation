- from: アグリッパ王よ、ユダヤ人たちから訴えられているすべての事柄について、今日あなたの前で弁明することになっている私は、自分を幸いだ[a]と思います。
  to: アグリッパ王よ、ユダヤ人たちから訴えられているすべての事柄について、今日あなたの前で弁明しようとしていることを、私は幸いに思います。[a]
  rationale: 原文の法廷的語彙と文の情報構造を維持しつつ、μέλλων の目前性を「弁明しようとしている」で明示した。「幸いに思います」は、ἡγέομαι ἐμαυτὸν μακάριον の意味を自然な日本語の評価表現として伝える。脚注は「恵まれている」という語義上の代替を残しながら、この文脈での「幸運・光栄」の意味を明確にした。
