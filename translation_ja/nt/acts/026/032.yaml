  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: ja
  text: そこでアグリッパはフェストに言った。「この人は、カエサルに上訴していなければ、釈放されることができたのに。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 物語の進行と、審議を受けた結論の提示を自然な日本語で示す。
- source_word: ἔφη
  choice: 言った
  rationale: 未完了過去形だが、ここでは物語における通常の発言導入として機能するため、自然な単純過去とした。
- source_word: Ἀπολελύσθαι
  choice: 釈放される
  rationale: ἀπολύωの法的文脈での「自由にする、釈放する」を表す。正式な無罪判決まで意味する「無罪とされる」は避けた。
- source_word: ἐδύνατο
  choice: こともできた
  rationale: 実現しなかった過去の可能性を表しつつ、ギリシア語の能力・可能性の含みを保つ。
- source_word: ὁ ἄνθρωπος οὗτος
  choice: この人
  rationale: 指示語の力を保ち、現代日本語で不必要に粗く響く「この男」を避けた。
- source_word: εἰ μὴ
  choice: していなければ
  rationale: 反実仮想的な条件を自然な日本語で明確に表す。
- source_word: ἐπεκέκλητο
  choice: 上訴して
  rationale: ローマ法上、カエサルに裁きを求める行為を表す文脈的に正確な法律用語。
- source_word: Καίσαρα
  choice: カエサル
  rationale: 皇帝という説明語に置き換えず、本文の歴史的・法的な称号を保持する。
