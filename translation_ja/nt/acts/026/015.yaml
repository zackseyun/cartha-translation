  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: ja
  text: 私は言った。『主よ、あなたはどなたですか。』[a] すると、主は言われた。『私は、あなたが迫害しているイエスである。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先生、あなたはどなたですか」とも訳せる。ギリシア語のκύριεは敬意を表す呼びかけとしても用いられるが、ここでは天から語る方が直ちにイエスと名乗るため、本文では「主よ」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: そこで私は言いました
  rationale: δέはここでは強い対比ではなく、物語を進める軽い接続を表す。「そこで」によって直前の出来事を受けた自然な流れを示し、ἐγώは日本語でも主語を明示してパウロ自身の証言としての語りを保った。
- source_word: Τίς εἶ, κύριε;
  choice: 主よ、あなたはどなたですか
  rationale: τίς εἶを現代日本語の丁寧で自然な問いとして訳した。κύριεは敬称として「先生」「あなた様」の可能性もあるが、天から現れた話者が直ちにイエスと名乗り、続いてὁ κύριοςと特定される文脈から、本文では「主よ」とした。
- source_word: ὁ δὲ κύριος εἶπεν
  choice: すると、主は言われました
  rationale: δέは応答の展開を示すため「すると」とした。ὁ κύριοςは特定された話者を指すので「主」と訳し、敬意を伴う自然な日本語として「言われました」を用いた。
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: 私はイエスである
  rationale: 明確な自己同定として訳した。明示されたἘγώは「私は」で表しつつ、「ほかならぬ」など原文以上の強調は加えなかった。発話の荘重さを保つため常体の「である」とした。
- source_word: ὃν σὺ διώκεις
  choice: あなたが迫害している
  rationale: διώκειςの現在時制と継続中の敵対行為を「迫害している」で表した。σὺは「あなた」と明示したが、「あなたこそ」のような過度の対照的強調は加えなかった。
theological_decisions:
- issue: サウロの呼びかけにおけるκύριεの訳
  choice: 主よ
  alternative: あなた様／先生
  rationale: κύριεは一般的な敬称にもなり得るため、その語義上の幅を脚注に残した。一方、この天的顕現では話者が直ちにイエスと名乗り、語り手もὁ κύριοςと呼ぶので、本文の「主よ」が文脈に最も適する。
- issue: ὁ κύριοςによる話者の特定
  choice: 主
  alternative: その方
  rationale: 定冠詞付きのκύριοςは、すでに呼びかけられた天的な話者を特定している。「主」と訳すことで原文の称号を保持しつつ、本文が示す以上の体系的な説明は加えない。
translation_notes:
  register: パウロの証言部分は丁寧な叙述体とし、引用されたイエスの自己宣言は簡潔で荘重な常体とした。「どなたですか」により、現代の読者に自然でありながら敬意のある問いを表現した。
