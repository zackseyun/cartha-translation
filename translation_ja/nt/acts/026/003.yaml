  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: ja
  text: とりわけ、あなたがユダヤ人のすべての慣習と論争をよくご存じだからです。[a] ですから、どうか忍耐強く私の話をお聞きくださるようお願いいたします。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ人に関するすべての慣習と論争」。
    reason: lexical_alternative
  - marker: b
    text: 「お願いいたします」に当たるギリシア語は、切実な願いを表す。別訳「お願いします」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα γνώστην ὄντα σε
  choice: とりわけ、…よくご存じだからです
  rationale: μάλισταの強調と、分詞句が示す理由を自然な現代日本語で表した。「専門家」として過度に限定せず、アグリッパの深い知識を示す。
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: ユダヤ人の間のあらゆる慣習
  rationale: κατὰ Ἰουδαίουςを、ユダヤ人に関わる領域を示す表現として訳した。「ユダヤ人のあらゆる慣習」も可能であるため注記した。
- source_word: τε καὶ ζητημάτων
  choice: や論争
  rationale: τε καὶによる二項の連結を日本語の「や」で自然に表し、ζητήματαはこの弁明の文脈で争点となっている問題を指すため「論争」とした。
- source_word: διὸ
  choice: ですから
  rationale: アグリッパの知識を根拠として次の願いを導く推論を明確に表す。
- source_word: δέομαι
  choice: どうか…お願いいたします
  rationale: 切実で丁重な依頼を、現代日本語として自然かつ品位ある表現にした。「お願いします」より改まっているが、「懇願します」ほど強く限定しない。
- source_word: μακροθύμως ἀκοῦσαί μου
  choice: 忍耐強く私の話をお聞きくださる
  rationale: μακροθύμωςの忍耐・寛容の含意と、ἀκούω＋属格の「人の話を聞く」という意味を明瞭に表した。
