  - severity: low
    issue: 「ユダヤ人の間の」
    rationale: 原文はユダヤ人に関わる慣習・争点を指し得るため、「間の」は論争をユダヤ人内部に限定するようにも読める。本文ではより広く「ユダヤ人の」とし、別訳で代案を示す。
