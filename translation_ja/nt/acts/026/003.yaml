  naturalness: 法廷でアグリッパ王に語る丁重な口調は自然である。「忍耐強く私の話をお聞きくださるようお願いいたします」も明快な現代標準語として適切である。
  terminology: 「慣習」「論争」は、ἔθηとζητήματαをこの文脈で無理なく表す。「ユダヤ人の間の」は可能だが、κατὰ Ἰουδαίουςの広い「ユダヤ人に関する／ユダヤ人の」の意味を狭くしないよう、本文では「ユダヤ人の」とする。
