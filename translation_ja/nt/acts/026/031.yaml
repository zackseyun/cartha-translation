  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: ja
  text: 彼らはそこを退いた後、互いに話し合っていた。「この人は、死刑または投獄[a]に値することを何もしていない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「鎖」または「拘束」。ここでは司法上の拘禁、すなわち投獄を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: その場を退くと
  rationale: アオリスト分詞が、主動詞に先立ってその場から離れたことを示す。現代日本語として自然に順序関係を表した。
- source_word: ἐλάλουν πρὸς ἀλλήλους λέγοντες
  choice: 互いに語り合って言った
  rationale: 未完了過去の継続的・相互的な会話を「語り合って」で表し、λέγοντες が導く発言内容を「言った」で自然につないだ。
- source_word: Οὐδὲν ... ἄξιον
  choice: …に値するようなことは何も…ない
  rationale: 刑罰に相当する行為が一切ないという構文の意味を、明瞭な現代日本語で保持した。
- source_word: θανάτου ἢ δεσμῶν
  choice: 死刑や投獄
  rationale: 司法的文脈で、θάνατος は死刑、δεσμοί は文字どおりには拘束具・鎖だが、ここでは拘禁を指すため「投獄」とした。文字どおりの像は脚注に残した。
- source_word: τι πράσσει
  choice: …ようなことは何もしていない
  rationale: πράσσει の一般的な「行う」を過度に犯罪行為へ限定せず、現在形を自然な日本語で表した。
- source_word: ὁ ἄνθρωπος οὗτος
  choice: この人
  rationale: パウロを指す表現として、現代日本語で自然かつ中立的な「この人」を採用した。
