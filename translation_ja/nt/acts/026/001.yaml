  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: ja
  text: そこでアグリッパはパウロに言った。「自分を弁護して話すことを許す。」するとパウロは手を伸ばして、弁明した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη
  choice: そこでアグリッパはパウロに言った
  rationale: δέを場面の進行を示す「そこで」とし、πρὸς τὸν Παῦλον ἔφηを自然な現代日本語の発話表現で訳した。
- source_word: Ἐπιτρέπεταί σοι
  choice: 許す
  rationale: ギリシア語は非人称的な受動表現だが、日本語では許可を与える主体を含意する簡潔な能動表現が自然であり、公的な語調も保てる。
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: 自分のために発言すること
  rationale: ὑπέρの「～のために／～を擁護して」という幅を保ち、法的弁明に限定しすぎない表現とした。
- source_word: τότε
  choice: すると
  rationale: 直後の動作への時間的推移を、自然な物語接続で表した。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 手を差し伸べ
  rationale: 身体動作を過度に「身ぶり」と解釈せず、原文に沿って具体的に訳した。
- source_word: ἀπελογεῖτο
  choice: 弁明した
  rationale: 法的・公的な自己弁護を表す中動態動詞として訳し、未完了過去に明示されない「始めた」という起動相は加えなかった。
theological_decisions:
- issue: ἀπελογεῖτοの法廷的含意
  choice: 弁明した
  alternative: 自分を弁護した
  rationale: 公的な審理の文脈を示しつつ、パウロが非を認めて言い訳したかのような含みを避けた。神学的な有罪・無罪を訳文自体で決めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。アグリッパの許可は簡潔な公的発言とし、パウロの動作と弁明を過剰に補足せず表現した。
