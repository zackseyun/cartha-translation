  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: ja
  text: こうしたことをしている間に[a]、私は祭司長たちから権限と委任を受けて、ダマスコへ向かっていましたが、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「そのようなことの中で」。直前に述べられた、パウロの行動と意図を受けています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: こうして
  rationale: 直訳は「そのようなことの中で」だが、直前に述べた迫害の行動と意図を受けて話を進める表現として、自然な日本語の「こうして」とした。指示内容を「使命」などに限定しない。
- source_word: πορευόμενος εἰς τὴν Δαμασκὸν
  choice: ダマスコへ向かっていました
  rationale: 現在分詞が表す移動中の状況を自然な日本語で示す。「へ」により目的地を表し、まだ到着前である文脈にも合う。
- source_word: μετ’ ἐξουσίας καὶ ἐπιτροπῆς
  choice: 権限と委任を受け
  rationale: ἐξουσίαは行使を認められた公的な権限、ἐπιτροπήは託された任務・正式な委任を指す。両語の重なりを保ちつつ、日本語として自然になるよう「受け」を補った。
- source_word: τῆς τῶν ἀρχιερέων
  choice: 祭司長たちから
  rationale: 属格はここで権限と委任の出所を示すため、「から」と訳した。ἀρχιερεῖςは大祭司を中心とする祭司指導層を指す慣用的な「祭司長たち」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ公的証言にふさわしい文体。「権限」と「委任」を区別して原文の並列表現を保った。節末は次節へ続く構文であるため、「が、」として継続を示した。
