source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: ja
  text: そして私は、すべての会堂で、何度も彼らを罰し、冒瀆するよう無理に迫ろうとしました。また、彼らに対して激しく怒り狂い、外の町々にまで[a]彼らを迫害し続けました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「外の町々にまで」。おそらくユダヤの外にある町々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: すべての会堂で
  rationale: κατά＋対格の分配的・場所的な働きを自然な日本語で表し、各地の会堂で繰り返された行為という範囲を保つ。
- source_word: πολλάκις τιμωρῶν
  choice: 何度も罰しては
  rationale: πολλάκιςの反復性と、主動詞と同時的・手段的な分詞τιμωρῶνを、「～しては」によって簡潔に表す。
- source_word: ἠνάγκαζον
  choice: 言わせようとしました
  rationale: 未完了過去の反復的・企図的な含みを保ち、強制の試みを表す。強制そのものは、文脈上「罰しては」によっても示される。
- source_word: βλασφημεῖν
  choice: 冒瀆の言葉を言わせる
  rationale: 目的語が明示されていないため、イエスへの冒瀆などと限定せず、発話を表す不定詞の意味を明瞭な現代日本語で伝える。
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: 彼らに対して激しく怒り狂い
  rationale: περισσῶςの強意とἐμμαινόμενοςの猛烈で狂暴な敵意を、精神疾患を連想させる表現にせず伝える。
- source_word: ἐδίωκον
  choice: 迫害し続けました
  rationale: 使徒言行録におけるδιώκωの迫害という文脈的意味と、未完了過去の継続・反復性を保つ。
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: 国外の町々にまで
  rationale: ἔξωを当時のユダヤの領域外という文脈で自然に表す。ただし字義的には「外の町々」であり得るため脚注を付す。
theological_decisions:
- issue: βλασφημεῖνの対象
  choice: 「冒瀆の言葉を言わせる」とし、対象を明示しない
  alternative: 「イエスを冒瀆させる」「キリスト者の信仰告白を呪わせる」
  rationale: 文脈上はイエスまたはキリスト教信仰への冒瀆が強く示唆されるが、ギリシア語本文は対象を明示していないため、その曖昧さを保つ。
- issue: ἠνάγκαζονの成否
  choice: 「言わせようとしました」として企図を表す
  alternative: 「無理やり言わせました」
  rationale: 未完了過去は反復・継続的な強制行為を表し得る一方、その試みが常に成功したとは断定しない。原文の相的な幅を尊重する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「会堂」「冒瀆」「迫害」は聖書文脈で定着した語として用い、文全体は一般読者にも追いやすい語順に整えた。脚注記号[a]は対応箇所である文末に置いた。
