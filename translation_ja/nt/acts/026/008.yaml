revisions:
- from: 神が死者たちをよみがえらせるということが、なぜあなたがたには信じられないと判断されるのでしょうか。
  to: もし神が死者をよみがえらせるなら、それがなぜあなたがたの間で信じがたいことだと判断されるのでしょうか。
  rationale: The revision restores the conditional form of εἰ, expresses the communal evaluative setting of παρ’ ὑμῖν, and uses natural modern Japanese while retaining the passive evaluative force of κρίνεται. No footnote is needed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys God raising the dead and the rhetorical question, but it recasts εἰ as a content-nominal clause (「ということが」). The Greek retains an explicit εἰ clause, naturally represented here by 「もし／〜なら」. Also, παρ’ ὑμῖν is more directly conveyed by 「あなたがたの間で」 than 「あなたがたには」, which can imply merely personal inability to believe.
  naturalness: The proposed revision is clear, modern, and suitably formal for Paul's forensic speech. 「信じがたいことだと判断される」 idiomatically expresses ἄπιστον κρίνεται without making the phrase sound like an individual psychological incapacity.
  terminology: 「死者をよみがえらせる」 is established, understandable Japanese for νεκροὺς ἐγείρει. Japanese does not require 「たち」 to represent the Greek plural here; omitting it is more natural and does not restrict the referent.
  issues:
  - severity: medium
    issue: The εἰ clause is not represented as a conditional clause.
    rationale: 「神が…よみがえらせるということが」 turns the clause into a nominal topic. 「もし神が…よみがえらせるなら」 preserves the overt conditional framing of εἰ and aligns with the English audit trail's “if God raises the dead.”
  - severity: low
    issue: παρ’ ὑμῖν is rendered as 「あなたがたには」.
    rationale: While possible in context, this can suggest that each listener personally finds it unbelievable. 「あなたがたの間で」 more plainly preserves the social/group sphere expressed by παρά with ὑμῖν.
  revised_text: もし神が死者をよみがえらせるなら、それがなぜあなたがたの間で信じがたいことだと判断されるのでしょうか。
  revised_footnotes: []
  revision_rationale: The revision restores the conditional form of εἰ, expresses the communal evaluative setting of παρ’ ὑμῖν, and uses natural modern Japanese while retaining the passive evaluative force of κρίνεται. No footnote is needed.
