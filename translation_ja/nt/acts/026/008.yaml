id: ACT.26.8
reference: Acts 26:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: ja
  text: もし神が死者をよみがえらせるなら、それがなぜあなたがたの間で信じがたいことだと判断されるのでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: なぜ
  rationale: ここでは理由を問う疑問表現であり、日本語として自然な「なぜ」とした。
- source_word: ἄπιστον
  choice: 信じられない
  rationale: 「信用できない」ではなく、死者の復活を信じ難いものとみなす意味を表す。
- source_word: κρίνεται
  choice: 判断される
  rationale: 受動態を保ち、「みなされる」よりも原文の判断という語感を明示した。
- source_word: παρ’ ὑμῖν
  choice: あなたがたには
  rationale: 聞き手側の評価・判断を示す日本語として自然であり、英語監査層の「by you」の趣旨も保持する。
- source_word: εἰ
  choice: ということが
  rationale: この文脈のεἰは、神が死者をよみがえらせるという事柄を疑問の対象として提示する。日本語では条件節の「もし」よりこの形が自然で、真偽を否定的に処理しない。
- source_word: νεκροὺς
  choice: 死者たちを
  rationale: 複数形を反映し、一般的な死者の復活を指すことを示す。
- source_word: ἐγείρει
  choice: よみがえらせる
  rationale: 他動詞・現在形の意味を保ち、神が死者を起こす行為を明確にする。
theological_decisions:
- issue: εἰ節が仮定か内容提示か
  choice: 「神が死者たちをよみがえらせるということが」
  alternative: 「もし神が死者たちをよみがえらせるなら」
  rationale: 形式上の条件性を強めすぎず、パウロが神の復活の力を疑わしい仮説として提示しているとの誤解を避けつつ、原文の問いの緊張を保つ。
- issue: 復活の対象の範囲
  choice: 「死者たち」
  alternative: 「死人」または単数的・抽象的な「死者」
  rationale: νεκρούςの複数を可視化し、特定個人だけに限定せず一般的な死者の復活を表す。
translation_notes:
  register: 法廷での弁明にふさわしい、明瞭でやや改まった現代標準語。「でしょうか」により修辞疑問としての丁寧さと力を保った。
