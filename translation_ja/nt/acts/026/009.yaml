id: ACT.26.9
reference: Acts 26:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: ja
  text: そこで私は、かつては、ナザレ人イエスの名に敵対して[a]、多くのことを行わなければならないと思っていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ナザレのイエスの名に逆らって」。
    reason: 「ナザレ人」と「ナザレの」、およびἐναντίαの「敵対して／逆らって」という訳語上の選択肢を示すため。
lexical_decisions:
- source_word: Ἐγὼ
  choice: 私自身も
  rationale: 明示された代名詞の強調を「私自身」で表し、文脈上の対比・継続を自然な「も」で補った。
- source_word: μὲν οὖν
  choice: そこで、…もかつては
  rationale: οὖνの談話上の展開を「そこで」で示し、μένの軽い対照性は「も」「かつては」によって日本語として自然に表した。後続のδέを明示的に先取りしすぎない表現とした。
- source_word: ἔδοξα ἐμαυτῷ
  choice: 思っていました
  rationale: 自分自身の判断・認識を表す慣用句として自然な現代日本語を採用した。ἐμαυτῷの自己言及的な力は「私自身」にも反映されている。
- source_word: πρὸς τὸ ὄνομα
  choice: 名に逆らって
  rationale: ἐναντία πρᾶξαιと結び付く敵対的方向性を簡潔に表しつつ、「名」という聖書的表現を保持した。
- source_word: ὄνομα
  choice: 名
  rationale: 人物、権威、公的な告白を含み得る比喩的な広がりを狭めず、原文の表現を保った。
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: ナザレ人イエス
  rationale: 出身・呼称を示すΝαζωραῖοςを、簡潔で聖書本文として定着した自然な日本語にした。
- source_word: δεῖν
  choice: 行わなければならない
  rationale: パウロが当時、自らに課されていると考えた必要・義務を表す。客観的な神的必然と断定せず、認識動詞の範囲内に置いた。
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: 逆らって、多くのことを行う
  rationale: πολλάの複数的な行為とἐναντίαの敵対性をともに保持し、具体的行為を原文以上に限定しなかった。
theological_decisions:
- issue: イエスに関する「名」の意味
  choice: 「名」をそのまま保持する
  alternative: 「イエスの権威」「イエスの教え／運動」などと解釈して訳す
  rationale: 「名」はイエス本人、その権威、評判、公的告白などを代表し得るため、一つの神学的含意に限定しない。
- issue: δεῖνが示す必要性の主体
  choice: 「思っていました」の内容として「行わなければならない」と訳す
  alternative: 神から定められた客観的必然として「行うべきであった」と訳す
  rationale: ここで語られているのは回心前のパウロ自身の判断であり、その義務感を本文が是認しているとは限らない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、回想であることが自然に伝わるよう「かつては」「思っていました」とした。「ナザレ人イエス」「名」は簡潔で品位ある聖書的表現として保持した。
