  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: ja
  text: さて、私が若いころから、自分の同胞の間でも、またエルサレムでも、初めから送ってきた生活ぶり[a]を、ユダヤ人は皆知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私の生活の仕方」。「生活ぶり」「生き方」とも訳せる。単に生きていたことではなく、どのような生活をしていたかを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: どのように生きてきたか／その生活
  rationale: 単なる生存ではなく、生き方や生活の歩みを指す。日本語では文脈に即して動詞表現と受け直しを組み合わせ、意味を明確かつ自然に伝えた。
- source_word: ἐκ νεότητος
  choice: 私が若いころから
  rationale: パウロの生活の歩みが知られていた時期の起点を、自然な現代日本語で示す。
- source_word: ἀπ’ ἀρχῆς
  choice: 初めから
  rationale: 原文の時間的な強調を簡潔に保つ。
- source_word: γενομένην
  choice: 送ってきた
  rationale: βίωσινを修飾し、特定の場所で営まれた生活を表すため、日本語で自然な『生活を送る』という表現にした。
- source_word: ἐν τῷ ἔθνει μου
  choice: 同胞の間で
  rationale: ἔθνοςはここで近代的な国家ではなく、パウロ自身の民族・民を指す。『同胞』によって帰属関係を自然に表した。
- source_word: ἔν τε Ἱεροσολύμοις
  choice: またエルサレムで
  rationale: τεの付加・並列の働きを『また』で表した。
- source_word: ἴσασι
  choice: 知っています
  rationale: 完了形でありながら現在の状態を表すοἶδαの用法に従い、現在形で訳した。
- source_word: πάντες Ἰουδαῖοι
  choice: ユダヤ人は皆
  rationale: 原文の包括的な表現を弱めず、日本語として自然な語順にした。
- source_word: μὲν οὖν
  choice: さて
  rationale: 弁明の流れを受けて次の点へ移る談話上の働きを、過度に因果関係を強めずに示す。
