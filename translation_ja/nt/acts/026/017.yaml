translation:
  language: ja
  text: わたしは、あなたを民[a]から、また異邦人たちから救い出し、彼らのもとへ遣わす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「民」は、異邦人との対比からユダヤの民を指す。別訳「わたしは、あなたをユダヤの民から、また異邦人たちから救い出し、彼らのもとへ遣わす。」
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: 救い出し
  rationale: ἐξαιρέωの現在中分詞で、敵対する者たちの中から保護し救い出す働きを表す。文脈上、後続する定動詞「遣わす」に伴う日本語として自然に接続した。
- source_word: τοῦ λαοῦ
  choice: この民
  rationale: 異邦人との対比からユダヤの民を指すが、原文は単に定冠詞付きの「民」とするため、解釈を本文に過度に織り込まず、話の文脈を示す「この」を添えた。
- source_word: τῶν ἐθνῶν
  choice: 異邦人たち
  rationale: ユダヤ人との対比におけるἔθνηは非ユダヤ人を指す。「諸国民」よりも文脈上の意味が明確で、複数性も示せる。
- source_word: εἰς οὓς
  choice: 彼らのもとへ
  rationale: 派遣を表すἀποστέλλωに伴う方向を、現代日本語で自然に表した。関係代名詞の先行対象が異邦人たちであることも明瞭にした。
- source_word: ἀποστέλλω
  choice: 遣わす
  rationale: 使命を与えて派遣するという語義と、イエスによる委任の荘重さを保つ。「遣わしている」より、この直接話法の任命・派遣の宣言に自然である。
theological_decisions:
- issue: 「この民」の指示対象
  choice: 本文では「この民」とし、ユダヤの民という理解は脚注に示す。
  alternative: 「ユダヤの民」または「イスラエルの民」
  rationale: 異邦人との対比により指示対象はほぼ明らかだが、ギリシア語本文は「ユダヤ」や「イスラエル」を明記していないため、その簡潔さを保持した。
- issue: ἐξαιρούμενόςが表す救出と派遣の関係
  choice: 「救い出し、……遣わす」とし、救出の約束と派遣の使命をともに保持する。
  alternative: 「取り出して」または単に「守って」
  rationale: この語は単なる選別や一般的保護より、危険からの救出を表す。一方、救出が迫害の不在を意味するとは本文から断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、召命の言葉にふさわしい格調を保った。「異邦人たち」で複数の集団を示し、「遣わす」は聖書的文脈でも一般読者に理解できる語として採用した。脚注標識[a]は本文の該当文末に置いた。
