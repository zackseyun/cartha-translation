source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: ja
  text: そして今、私は、神が私たちの父祖[a]になさった約束に基づく希望のゆえに、裁判を受けています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「先祖」。ギリシア語は直訳すると「私たちの父たち」で、イスラエルの父祖を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: そして今
  rationale: 直前の弁明を現在の裁判の理由へつなぐ移行表現として、自然かつ明瞭に訳した。
- source_word: ἐπ’ ἐλπίδι
  choice: 希望のゆえに
  rationale: ἐπί＋与格が示す根拠・原因を表し、パウロが裁判を受けている理由であることを明確にした。
- source_word: τῆς … ἐπαγγελίας
  choice: 約束に基づく希望
  rationale: 属格が「希望」と「約束」を結び付けていることを保ちつつ、日本語として意味が通るよう「に基づく」で関係を表した。約束の実現内容までは補っていない。
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: 私たちの父祖になさった約束
  rationale: εἰςが示す約束の向かう相手を、自然な日本語で表した。
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: 神が…なさった
  rationale: 約束の起源・主体が神であることを能動文で明確にし、「なさった」により現代的でありながら敬意ある文体とした。
- source_word: πατέρας ἡμῶν
  choice: 私たちの父祖
  rationale: 字義的な男性複数と、イスラエルの契約史における先人を指す含意を保つ。「父たち」より自然で、「先祖」より原語の形を反映する。
- source_word: ἕστηκα κρινόμενος
  choice: 裁判を受けています
  rationale: ἕστηκαの現在的な状態とκρινόμενοςの司法的意味を、日本語の法廷文脈で自然に一体化して表した。
theological_decisions:
- issue: 「私たちの父祖」の指示対象
  choice: イスラエルの父祖、すなわち契約の約束を受けた先人たち
  alternative: ユダヤ民族の先祖一般
  rationale: 文脈はイスラエルに与えられた神の約束を想起させるが、具体的な人物や範囲を本文で限定せず、原文の表現を保った。
- issue: 「約束」と「希望」の関係
  choice: 約束に基づく希望
  alternative: 約束が実現するとの希望
  rationale: 後者は約束の実現という含意を明示するが、原文自体は属格によって両者を結び付けるにとどまるため、過度な解釈を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法廷での弁明にふさわしい端正さを保った。「なさった」は神の行為への敬意を示すが、古風に過ぎない表現は避けた。
