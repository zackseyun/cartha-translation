source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: ja
  text: しかし、パウロは言った。「短い時間であれ、長い時間であれ[a]、あなただけでなく、今日わたしの話を聞いているすべての人が、この鎖は別として、わたしのようになることを、神に願いたいと思います。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もう少しであれ、すっかりであれ」。ギリシア語のこの表現は解釈が難しく、程度、労力、または時間や範囲を指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: 神に祈ります
  rationale: ἄνを伴う希求法は控えめな願望を表し、τῷ θεῷによってその願いが神に向けられていることが明示される。日本語では「神に祈ります」が簡潔で自然であり、単なる願望以上の祈りの含意を伝える。
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: 短い時であれ長い時であれ
  rationale: 解釈の難しい対句であるが、直前のアグリッパの発言とのつながりを踏まえ、時間・範囲に関する対照として読める形にした。他の可能性は脚注に残し、曖昧さを隠さない。
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: あなただけでなく、今日私の話を聞いている人が皆
  rationale: 「あなただけでなく、すべての人も」という強調構造と、現在話を聞いている人々を指す分詞の意味を、自然な現代日本語で表した。
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: 私のようになってくださること
  rationale: γενέσθαιの結果状態への変化を「なる」で表し、聞き手への丁寧さを「くださる」によって自然に示した。パウロが自分と同じ者になるよう願う内容を簡潔に保つ。
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: この鎖だけは別として
  rationale: παρεκτόςの除外を明確にし、δεσμοίは投獄の状況を具体的に示す「鎖」とした。「だけは別として」は、パウロが自分の信仰上の状態を望みつつ拘束は望まないという対比を自然に伝える。
theological_decisions:
- issue: 直前のアグリッパの言葉との関係におけるἐν ὀλίγῳ καὶ ἐν μεγάλῳの解釈
  choice: 時間の長短を示す「短い時であれ長い時であれ」
  alternative: 「もう少しであれ、すっかりであれ」または「わずかな労力であれ、多くの労力であれ」
  rationale: この句は時間、程度、労力のいずれを指すか議論がある。本文には文脈に適合する時間的理解を採用しつつ、断定しすぎないよう別の可能性を脚注に示した。教理的な結論を本文へ持ち込まず、原文の解釈上の緊張を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法廷でのパウロの発言にふさわしい落ち着いた品位を保った。「私の話を聞いている」は日常的で理解しやすく、「この鎖だけは別として」は原文の機知と切実さを簡潔に伝える。
