source:
  edition: SBLGNT
  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: ja
  text: そこでアグリッパはパウロに言った。「短い間に、あなたは私を説得してキリスト者にしようとしている。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「もう少しで、あなたは私を説得して私をキリスト者にするところだ」。ギリシア語の「短い間に」は、短い時間を指す場合と、程度が小さいことを指す場合がある。この発言は、「こんな短い間で私をキリスト者にできると思うのか」という皮肉な問いとも読めるが、語調が真剣か皮肉かは明確ではない。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: そこでアグリッパは
  rationale: δέは弱い接続辞であり、ここでは強い対比を持ち込まず、自然な話の展開を示す「そこで」とした。固有名詞に付く冠詞は訳出しない。
- source_word: πρὸς τὸν Παῦλον
  choice: パウロに言った
  rationale: 発話を導く省略表現として、現代日本語で自然になるよう「言った」を補った。
- source_word: Ἐν ὀλίγῳ
  choice: 短い間に
  rationale: 時間または程度の小ささを表し得る曖昧な句である。本文では時間的な意味を直接反映し、別の可能性は脚注に残した。
- source_word: με πείθεις
  choice: 私を説得して…しようというのか
  rationale: 現在形のπείθειςが示す進行中の働きかけを自然な日本語で表した。疑問の語調は文脈上可能だが確定的ではないため、脚注で平叙的な理解も示した。
- source_word: Χριστιανὸν
  choice: キリスト者
  rationale: 当時の呼称としてのΧριστιανόςを、現代日本語で明瞭かつ簡潔な「キリスト者」とした。
- source_word: ποιῆσαι
  choice: …にしよう
  rationale: 目的語をある身分・状態にするという結果的意味を保った。日本語では「キリスト者にする」が原文の使役的表現を自然に反映する。
theological_decisions:
- issue: アグリッパの返答の語調と意味
  choice: 短時間で自分をキリスト者にしようとするのか、という問いとして訳す
  alternative: 「短い間に、あなたは私を説得してキリスト者にする」「もう少しで、あなたは私を説得してキリスト者にする」
  rationale: Ἐν ὀλίγῳは時間にも程度にも解し得て、発言の語調も真剣、回避的、皮肉のいずれとも断定できない。本文は文脈に合う自然な問いとして示しつつ、脚注で平叙的な読みと「もう少しで」という読みを明記し、解釈上の緊張を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準日本語を用いた。「クリスチャン」より原語の称号として落ち着きのある「キリスト者」を採用した。本文の疑問形は日本語の対話として自然だが、原文に疑問詞や疑問標識がないため、脚注で平叙文の可能性を明示した。
