  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: ja
  text: アグリッパ王よ、あなたは預言者たちを信じますか。[a] 私は、あなたが信じていることを知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「預言者たちの言葉を受け入れますか」または「預言者たちを信頼しますか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: 信じますか／信じている
  rationale: 現在能動直説法二人称単数。最初は直接の問いとして「信じますか」、反復箇所は継続的な認識を自然な日本語で表す「信じている」とした。
- source_word: βασιλεῦ Ἀγρίππα
  choice: アグリッパ王よ
  rationale: 呼格を明示しつつ、現代日本語で荘重さを保つ自然な呼びかけとした。人名は慣用的に音写した。
- source_word: τοῖς προφήταις
  choice: 預言者たちを
  rationale: πιστεύωの与格目的語で、預言者本人およびその証言を真実として受け入れる意味。原文の簡潔さを保ち、「預言書」や「預言者の言葉」と限定しなかった。
- source_word: οἶδα
  choice: 知っています
  rationale: 完了形ながら現在の意味を持つため、パウロの確信を弱めず、率直に「知っています」と訳した。
- source_word: ὅτι
  choice: ことを
  rationale: 知っている内容を導く接続詞を、日本語の内容節として自然な「ことを」で表した。
theological_decisions:
- issue: 「預言者たちを信じる」の意味
  choice: 預言者たちとその証言を真実として受け入れる意味を保つ
  alternative: 「預言書を信じる」「預言者たちに信頼する」「預言者たちの言葉を受け入れる」
  rationale: πιστεύω＋与格はここで預言者たちの証言を信じ、受け入れることを示す。ただし、服従や救済的信仰まで明示する表現にはせず、パウロの修辞的な問いに含まれる神学的緊張を残した。
- issue: 二度目の πιστεύεις の強調
  choice: 「信じている」と反復する
  alternative: 「確かに信じている」「信じておられる」
  rationale: ギリシア語には英語の強意助動詞に相当する独立要素がないため、「確かに」を補わず、動詞の反復そのものによる強調を保った。また、王への敬意を過度な敬語で補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語。王への呼びかけには「よ」を用いて原文の呼格と場面の荘重さを示し、本文全体は過度に古風または敬語的にならないよう整えた。
