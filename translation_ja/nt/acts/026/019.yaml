  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: ja
  text: ですから、アグリッパ王よ、私は天からの幻に背きませんでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅθεν
  choice: ですから
  rationale: 直前に語られたパウロの出会いと任命を受けた帰結を示す。現代日本語で論理的なつながりを自然かつ明確に表す。
- source_word: βασιλεῦ Ἀγρίππα
  choice: アグリッパ王よ
  rationale: 呼格による直接の呼びかけと王の称号を、簡潔で品位ある日本語で保持する。
- source_word: οὐκ ἐγενόμην ἀπειθὴς
  choice: 背きませんでした
  rationale: ここでは、天から与えられた使命に従わない者とはならなかった、という意志的な不服従の否定を表す。「不従順ではありませんでした」より自然な発話として訳す。
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: 天からの幻に
  rationale: ὀπτασίαを超自然的な「幻」とし、οὐρανίῳが示し得る起源を「天からの」で明示する。与格はἀπειθήςの対象として「に」で表す。
theological_decisions:
- issue: ダマスコ途上でのパウロの経験の性質
  choice: 天からの幻
  alternative: 天的な幻／天からの現れ
  rationale: ὀπτασίαそのものの表現範囲にとどまり、経験の存在論的性質をそれ以上規定しない。「天からの」はοὐρανίῳの起源の含意を自然に示すが、天的性格という含意も排除しない。
translation_notes:
  register: 明瞭な現代標準日本語。法廷で王に直接語りかける場面にふさわしい敬意と品位を保ちつつ、過度に古風な表現は避けた。
