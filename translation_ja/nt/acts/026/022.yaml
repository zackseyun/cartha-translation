id: ACT.26.22
reference: Acts 26:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: ja
  text: こうして私は、神からの助けを受けて、今日に至るまで立ち続け、身分の低い人にも高い人にも[a]証しをしています。そして、預言者たちとモーセが、やがて起こると語ったこと以外は、何も語っていません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「小さい者にも大きい者にも」。あらゆる社会的身分の人を指す表現。
    reason: cultural_note
  - marker: b
    text: 別訳「預言者たちとモーセが、起こると語ったことを越えては、何も語っていません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: 神からの助け
  rationale: 属格句が助けの源を明示しているため、「神からの助け」と自然かつ明確に訳した。
- source_word: τυχὼν
  choice: 受けて
  rationale: ここでの τυγχάνω は「得る、受ける」の意味。分詞の関係を保ちつつ現代日本語として自然にした。
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: 今日に至るまで立ち続け
  rationale: 完了形が示す、過去から現在まで保たれている状態を「立ち続け」で表した。法廷で証言する現在の姿とも調和する。
- source_word: μαρτυρόμενος
  choice: 証しをしています
  rationale: 継続中の証言行為を表し、法廷的含意と宗教的な証言の双方を保つ。
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: 身分の低い人にも高い人にも
  rationale: 直訳的な「小さい者と大きい者」では日本語で意味が曖昧になりやすいため、社会的地位を指す慣用表現として明示した。
- source_word: οὐδὲν ἐκτὸς λέγων ὧν
  choice: こと以外は、何も語っていません
  rationale: ἐκτός の除外・限界の意味を自然な日本語で保持した。
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: 預言者たちとモーセ
  rationale: ギリシア語の語順と、τε ... καί による結合を保った。
- source_word: μελλόντων γίνεσθαι
  choice: やがて起こる
  rationale: 預言者たちの発言時点から見た将来性を示し、差し迫った時期や必然性を過度に読み込まない表現とした。
theological_decisions:
- issue: パウロの証言とイスラエルの聖書との連続性
  choice: 預言者たちとモーセが語ったこと以外は何も語っていない、という強い連続性の主張として訳す
  alternative: 聖書とおおむね一致しているという一般的な主張として弱める
  rationale: οὐδὲν ἐκτὸς λέγων は内容上の明確な限定を表すため、その強さを保持した。
- issue: 「立つ」の含意
  choice: 神の助けによって今日まで立ち続け、証言しているという表現を保持する
  alternative: 単に「生き延びてきた」または「務めを続けてきた」と解釈的に訳す
  rationale: ἕστηκα は生存、堅持、法廷に立つことなどを響かせ得るため、一つに限定せず「立ち続け」とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、法廷での証言にふさわしい落ち着きと品位を保った。「立ち続け」は原文の比喩的・法廷的な広がりを残し、「身分の低い人にも高い人にも」は慣用句の意味を本文で理解できるようにした。
