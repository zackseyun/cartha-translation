    rationale: ὀφθήσομαί σοιは「私はあなたに現れるだろう」であって、「私が何かをあなたに見せる」という能動的・使役的表現ではない。この変更は将来の顕現を「示す行為」にしてしまう。
  - severity: low
    issue: 脚注の代案が本文の修正前の解釈に依存している
    rationale: 本文を「私があなたに現れる」と直すなら、脚注はその訳を単なる代案として掲げるのでなく、圧縮された二つの関係節の関係を説明する内容に改めるのがよい。
