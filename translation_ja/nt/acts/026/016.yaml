id: ACT.26.16
reference: Acts 26:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: ja
  text: しかし、立ち上がって、自分の足で立ちなさい。私があなたに現れたのは、あなたを、あなたが私を見たことと、これから私があなたに現れることについての奉仕者また証人として任命するためである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、「あなたが私を見たこと」と「これから私があなたに現れること」を受ける関係節が簡潔に並べられている。その正確な文法上の結び付きには解釈の余地がある。
    reason: 原文の圧縮された関係節の構造を示しつつ、未来のὀφθήσομαίを「現れる」と正確に訳すため。
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: 立ち上がって、自分の足で立ちなさい
  rationale: 二つの命令と身体的な描写を保ちつつ、現代日本語として明瞭にした。
- source_word: εἰς τοῦτο γὰρ ὤφθην σοι
  choice: 私があなたに現れたのは……ためである
  rationale: 目的を導く構文として自然にまとめ、ὤφθην の顕現の意味を「現れた」で保持した。
- source_word: προχειρίσασθαί σε
  choice: あなたを……として任命する
  rationale: 単なる選択ではなく、役割への正式な任命を表す。
- source_word: ὑπηρέτην
  choice: 奉仕者
  rationale: 従属して務める者という意味を保ち、「しもべ」より現代的で、「助手」より使命の重みを伝える。
- source_word: μάρτυρα
  choice: 証人
  rationale: 見聞きしたことを証言する者を指す標準的で明確な訳語。
- source_word: ὧν τε εἶδές με
  choice: あなたが私を見たこと
  rationale: 本文の με を反映し、圧縮された関係節を日本語で理解可能な形にした。
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: これから私があなたに現して見せること
  rationale: 未来の顕現を表す一方、日本語で単に「現れること」とした場合に生じる関係節の不自然さを避けた。ただし解釈を含むため脚注で直訳的可能性を示す。
theological_decisions:
- issue: ὤφθην / ὀφθήσομαί の啓示的表現
  choice: 現在の顕現は「現れた」、将来については「現して見せる」と訳す
  alternative: 「私はあなたに見られた／見られるだろう」または双方を「現れた／現れる」とする
  rationale: 復活したイエスによる人格的な顕現と任命を保ち、単なる内面的印象には還元しない。未来句のギリシア語が持つ圧縮と曖昧さは脚注で明示する。
translation_notes:
  register: 明瞭で現代的かつ荘重な命令・任命の文体。「奉仕者また証人」は二つの役割が一人に与えられることを簡潔に示す。
