revisions:
- from: しかし、立ち上がって、自分の足で立ちなさい。私があなたに現れたのは、あなたを、あなたが私を見たことと、これから私があなたに現して見せることとの奉仕者また証人として任命するためである。[a]
  to: しかし、立ち上がって、自分の足で立ちなさい。私があなたに現れたのは、あなたを、あなたが私を見たことと、これから私があなたに現れることについての奉仕者また証人として任命するためである。[a]
  rationale: 将来の顕現を表す受動形を「現して見せる」とする解釈的な能動表現を避け、「私があなたに現れる」と原文に即して修正した。証人となる対象については、ギリシア語の圧縮と曖昧さを保つため、「二つのことについて」と自然な日本語で表し、脚注で構文上の余地を説明した。
