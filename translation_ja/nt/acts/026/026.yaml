reference: Acts 26:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: ja
  text: 王はこれらのことについてご存じです。そして私は、その王に臆することなく率直に語っています[a]。これらのことは何一つ王の目を逃れてはいないと、私は確信しています[b]。これは片隅で行われたことではないからです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自由に語っています」または「大胆に語っています」とも訳せる。ギリシア語は、隠さず、率直に、確信をもって語ることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「王に知られていないことは何一つありません」または「王が気づいておられないことは何一つありません」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「片隅で行われた」とは、人目につかない所で秘密裏に行われた、という意味の慣用的な表現。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: ご存じです
  rationale: 知識や事情への通暁を表す動詞。王に直接語りかける文脈に合う自然な敬意を保ちつつ、単純明快に訳した。
- source_word: περὶ τούτων
  choice: これらのことを
  rationale: περί＋属格が示す話題・対象を、現代日本語として自然に表した。指示内容の範囲は原文どおり限定しない。
- source_word: παρρησιαζόμενος
  choice: 臆することなく率直に
  rationale: 公然と、自由に、確信をもって語るという含意を、一語に狭めず自然な日本語で表した。
- source_word: πρὸς ὃν ... λαλῶ
  choice: 私は王に……語っています
  rationale: 発言の相手が王であることを明示し、ギリシア語の関係節を自然な日本語の独立文に組み替えた。
- source_word: λανθάνειν ... αὐτὸν
  choice: 王の目を逃れてはいない
  rationale: 『人に気づかれない』という λανθάνω の構文を、日本語の慣用的で明瞭な表現にした。
- source_word: οὐ πείθομαι οὐθέν
  choice: 何一つ……ないと、私は確信しています
  rationale: 強い否定と話者の確信を、日本語で誤解なく表した。
- source_word: πεπραγμένον
  choice: 行われた
  rationale: 完了した行為を指す πράσσω の完了分詞を簡潔に表現した。
- source_word: ἐν γωνίᾳ
  choice: 片隅で
  rationale: 秘密裏・人目につかない所で、という比喩的意味を持つ原文の像を保持した。
- source_word: τοῦτο
  choice: これ
  rationale: 何を指すかを狭く特定せず、原文の幅を保った。
theological_decisions:
- issue: 「これ」（τοῦτο）が指す出来事の範囲と、その公然性
  choice: 「これ」と訳し、イエスに関する出来事や運動、パウロの件のどこまでを含むかを限定しない。
  alternative: イエスの死と復活だけを指すと明示する、またはキリスト教運動全体を指すと明示する。
  rationale: この節自体は指示対象の範囲を厳密に定めていないため、公に知られた出来事であるという主張を保ちつつ、神学的に狭く確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法廷で王に直接弁明する場面にふさわしい丁寧さと格調を保った。「ご存じです」は王への敬意を自然に示すが、過度に古風な宮廷語は避けた。
