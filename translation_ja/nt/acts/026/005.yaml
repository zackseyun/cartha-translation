  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: ja
  text: 彼らは以前から私を知っています[a]。彼らが証言する意思があるなら、私が私たちの宗教の中で最も厳格な一派であるファリサイ派の者として生きてきたことを証言できるでしょう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「初めから」。または「ずっと前から」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「一派」「党派」を意味する語。ここでは、後代の専門的な意味での「異端」ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές με
  choice: 以前から私のことを知っています
  rationale: 過去から続く面識を自然な現代日本語で表した。ここでの προγινώσκω は、神学的な意味での「予知」ではなく、パウロを以前から知っていたことを指す。
- source_word: ἄνωθεν
  choice: 以前から
  rationale: この文脈では「上から」ではなく、早い時期からの知己を示す。「初めから」「ずっと前から」という語義上の幅は脚注に残した。
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: 証言する気があるなら
  rationale: θέλωσι の意志・意思を明示し、裁判的文脈に合うよう μαρτυρεῖν を「証言する」とした。
- source_word: ἀκριβεστάτην
  choice: 最も厳格な
  rationale: 宗教的一派の規律と実践の厳格さを表す最上級として、明快で自然な表現を選んだ。
- source_word: αἵρεσιν
  choice: 一派
  rationale: 当時のユダヤ教内部の集団・党派を指すため、後代の教理的非難を帯びる「異端」を避けた。
- source_word: τῆς ἡμετέρας θρησκείας
  choice: 私たちの宗教の中で
  rationale: パウロが共有するユダヤ教的伝統に自らを含めている点を保ちつつ、一派との関係が日本語で明瞭になるようにした。
- source_word: ἔζησα Φαρισαῖος
  choice: ファリサイ派の者として生活していた
  rationale: 過去の生き方を要約するアオリストと、述語的な Φαρισαῖος の意味を自然な日本語で表した。
theological_decisions:
- issue: ユダヤ教の歴史的文脈における αἵρεσις の訳
  choice: 一派
  alternative: 異端、党派
  rationale: ここではファリサイ派というユダヤ教内部の認知された集団を指しており、後代の専門的・否定的な意味での「異端」を意味しない。「一派」は歴史的意味を保ちながら現代日本語として自然である。
translation_notes:
  register: 明瞭で現代的な標準語を用い、法廷での証言という場面にふさわしい落ち着いた文体とした。原文の長い一文は日本語の理解しやすさのため二文に分けたが、条件節と証言内容の論理関係は保持した。
