  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: ja
  text: しかしパウロは言った。「フェストゥス閣下、私は正気を失っているのではありません。真実で、健全な判断に基づく言葉を語っているのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前のフェストゥスの非難に対する明確な反論を示す接続として、自然な日本語の「しかし」を用いた。
- source_word: μαίνομαι
  choice: 気が狂っている
  rationale: 精神の正常さを失っているとの非難を表す語であり、現代日本語で直接的かつ明瞭に伝わる表現とした。
- source_word: φησίν
  choice: 言った
  rationale: 形は歴史的現在だが、日本語の物語文として自然な過去形で訳した。
- source_word: κράτιστε
  choice: 閣下
  rationale: 高官への格式ある敬称を、日本語で自然かつ簡潔に表す。原語の最上級形を逐語的に再現するより、呼びかけとしての機能を優先した。
- source_word: ἀληθείας
  choice: 真実
  rationale: 属格を「真実の言葉」という形で保ち、発言内容の真実性を示した。
- source_word: σωφροσύνης
  choice: 健全な判断
  rationale: 正気、節度、思慮深さを含み得る語である。ここでは狂気との対比を保ちながら、理性的で節度ある発言を表す「健全な判断」とした。
- source_word: ῥήματα
  choice: 言葉
  rationale: 原文の複数名詞を自然な日本語の集合的な「言葉」で表した。
- source_word: ἀποφθέγγομαι
  choice: 語っている
  rationale: 声に出して明確に述べる意を持つが、文脈上過度に強めず、継続中の発言として自然に訳した。
theological_decisions:
- issue: σωφροσύνης が表す範囲
  choice: 健全な判断
  alternative: 正気／節度／健全な精神
  rationale: 狂気への反論という文脈と、発言の理性的・節度ある性質の双方を保持するため。特定の神学的含意には限定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、法廷で高官に答える場面にふさわしい品位を保った。「フェストゥス閣下」は敬意ある正式な呼びかけとして処理した。
