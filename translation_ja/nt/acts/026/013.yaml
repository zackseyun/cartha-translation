  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: ja
  text: 王よ、私は真昼に、道を進んでいる途中で、天からの光が太陽の輝きよりもまさり[a]、私と同行者たちの周りを照らしていたのを見ました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「太陽の輝きを超えて」。その光が太陽の輝きよりも強かったことが強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: 真昼のこと
  rationale: 属格による時の表現を、日の盛りを明確に示す自然な現代日本語とした。
- source_word: κατὰ τὴν ὁδὸν
  choice: 道を進んでいる途中で
  rationale: 単なる場所だけでなく、旅の途上という文脈を自然に表す。
- source_word: εἶδον
  choice: 私は…見ました
  rationale: 知覚を表す単純過去として、直接的かつ平明に訳した。
- source_word: βασιλεῦ
  choice: 王よ
  rationale: アグリッパへの呼格を保持し、荘重だが理解しやすい直接呼びかけとした。
- source_word: οὐρανόθεν
  choice: 天からの
  rationale: 単に空中からというより天的な起源を表し得る語であり、使徒言行録の啓示的文脈に即して訳した。
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: 太陽の輝きにもまさり
  rationale: ὑπέρの超越・凌駕の意味とλαμπρότηςの「輝き」をともに明示しつつ、自然な日本語にした。
- source_word: φῶς
  choice: 光
  rationale: パウロが見た現象を簡潔に導入する。日本語では不定冠詞を補う必要がない。
- source_word: περιλάμψαν
  choice: 周りを照らしました
  rationale: 複合動詞の周囲を包むように照らす意味を保ち、修飾関係を日本語の述語として自然に再構成した。
- source_word: με καὶ τοὺς σὺν ἐμοὶ πορευομένους
  choice: 私と同行していた者たちの周りを
  rationale: 光がパウロだけでなく同行者たちをも取り巻いたことを明確に保つ。
theological_decisions:
- issue: 幻視的文脈におけるοὐρανόθενの訳
  choice: 天からの
  alternative: 空からの
  rationale: この語は物理的な空を指す可能性もあるが、啓示的遭遇の文脈とルカ文書の用法から、天的起源を含意する「天から」が最も適切である。出来事の性質をそれ以上には規定しない。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある法廷弁明の語調。「王よ」で呼格を保ち、それ以外は過度に文語的な表現を避けた。脚注標識は該当する光の描写の後に置いた。
