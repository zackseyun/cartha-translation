id: ACT.26.23
reference: Acts 26:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: ja
  text: すなわち、メシアが苦しみを受けること[a]、また、死者の中から最初に復活する者として[b]、民にも異邦人にも[c]光を告げ知らせることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。ここでは、預言された油注がれた者を表す称号として「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: または「死者の復活において最初の者」。原文は復活における先行性を述べるが、その詳細は明示しない。
    reason: translation_alternative
  - marker: c
    text: 「民」は、ここでは「異邦人」との対比から、ユダヤの民、すなわちイスラエルを指すと考えられる。
    reason: lexical_clarification
lexical_decisions:
- source_word: παθητὸς
  choice: 苦しみを受ける
  rationale: この形容詞は、苦しみを受けうること、または苦しむ定めにあることを表す。ここでは預言の内容を要約しているため、自然な動詞表現とした。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 預言者とモーセが語った油注がれた者の称号として機能しているため、「キリスト」ではなく「メシア」とした。
- source_word: πρῶτος
  choice: 最初の者
  rationale: 復活における先行性を明示する語を保った。
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: 死者の復活による
  rationale: ギリシア語の圧縮された名詞表現と、「最初の者」が何に関して最初なのかという構造を保つため、このように訳した。
- source_word: φῶς
  choice: 光
  rationale: 啓示、救い、希望を含みうる聖書的比喩を解釈で狭めず、そのまま保った。
- source_word: μέλλει καταγγέλλειν
  choice: 告げ知らせる
  rationale: μέλλω＋不定詞が示す将来または定められた働きを、預言内容の要約として自然に表した。
- source_word: τῷ τε λαῷ
  choice: 民にも
  rationale: 異邦人との対比からイスラエルの民を指す可能性が高いが、本文では原文の一般的な語を保持した。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人にも
  rationale: 民との対比がユダヤ人と非ユダヤ人の対照を示すため、日本語で明確な「異邦人」とした。
- source_word: τε ... καὶ
  choice: にも……にも
  rationale: 二つの受け手を並列する相関構文を自然な日本語で表した。
theological_decisions:
- issue: 復活の表現とメシア論的含意
  choice: 「死者の復活による最初の者」として、復活における先行性を保つ
  alternative: 「死者の中から最初に復活する者」または「終末の復活の初穂」
  rationale: 原文は先行性を述べるが、それ以前の一時的な蘇生との関係や、二度と死なない復活であることまでは明示しないため、本文で教理的説明を補わない。
- issue: 「民」の範囲
  choice: 本文では「民」とし、異邦人との対比によりユダヤの民を示唆する
  alternative: 「ユダヤ人」または「イスラエルの民」
  rationale: λαόςの語形を保ちつつ、文脈上の指示対象は脚注で説明することで、原文以上に限定しない。
- issue: 二つのεἰ節の関係
  choice: 「苦しみを受けること、そして……告げ知らせること」と並列する
  alternative: 条件文として「もしメシアが苦しむ者であるなら、もし……」とする
  rationale: ここでεἰは、パウロが預言の内容として問われる二点を間接的に提示する用法であり、日本語では内容列挙として訳すのが自然である。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。使徒26章の長い弁明文に接続する内容列挙として「すなわち」で導入した。「死者の復活による最初の者」はやや凝縮された表現だが、原文の曖昧さと神学的緊張を保持するため採用した。
