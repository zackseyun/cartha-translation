  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: ja
  text: パウロがアテネで彼らを待っていた間、町が偶像であふれている[b]のを見て、パウロの霊は彼の内で激しくかき立てられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「激しい憤りを覚えた」「心をかき乱された」。ギリシア語の動詞は、鋭く強い内的動揺を表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「町が偶像に満ちている」「町全体が偶像に覆われている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: 待っていた
  rationale: 継続中の待機を表す分詞を、時間的状況が自然に伝わる現代日本語にした。
- source_word: παρωξύνετο
  choice: 激しくかき立てられた
  rationale: 未完了過去の継続的な内的反応と、鋭い刺激・動揺という動詞の強さを保つ。「悲しんだ」だけには限定しない。
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: その霊
  rationale: パウロ自身の内なる霊を指す所有表現を直接反映し、「心」と言い換えて語の含みを狭めることを避けた。
- source_word: ἐν αὐτῷ
  choice: 内で
  rationale: 反応がパウロの内面で起きたことを簡潔に示し、原文の内的所在の強調を残した。
- source_word: θεωροῦντος
  choice: 見て
  rationale: 同時進行の観察を自然に表し、単なる一瞥よりも、目にして認識したという文脈に適合させた。
- source_word: κατείδωλον
  choice: 偶像であふれている
  rationale: 町の至る所に偶像がある状態を、意味を過度に解釈せず明瞭な現代日本語で表した。
- source_word: τὴν πόλιν
  choice: 町
  rationale: 直前のアテネを指す原文の普通名詞を保持した。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは強い逆接ではなく物語の推移を担うため、日本語では時間節から自然に文を始め、不要な「さて」「しかし」を補わなかった。
theological_decisions:
- issue: 「霊」の指示対象
  choice: パウロ自身の人間の霊として訳す
  alternative: 聖霊による促しを示す表現と解する
  rationale: 「その霊」という所有表現と「彼の内で」という句は、パウロの内的反応を直接示す。本文が聖霊を明示していないため、その解釈を訳文に加えない。
- issue: パウロの内的反応の性質
  choice: 「激しくかき立てられた」とし、怒り・憤り・苦悩のいずれか一つに限定しない
  alternative: 「憤った」または「心を痛めた」
  rationale: παρωξύνετο は鋭い内的刺激を表すが、感情の種類を一語に固定すると原文の幅を狭めるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その霊は内で」は原文の「彼の霊が彼の内で」という重なりを簡潔に残しつつ、聖霊への言及を訳文で補わない。脚注記号は、それぞれ対応する語句の直後に配置した。
