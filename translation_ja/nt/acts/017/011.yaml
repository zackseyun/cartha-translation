id: ACT.17.11
reference: Acts 17:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: ja
  text: この人たちは、テサロニケにいる人々よりも高潔な人々だった[a]。というのも、彼らは非常な熱意をもってことばを受け入れ[b]、それらのことがそのとおりかどうかを確かめるため、毎日、聖書を調べていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「身分が高かった」。原語は、称賛に値する心や態度を指すことも、高い家柄や社会的身分を指すこともできる。ここでは前者の可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 別訳「知らせを歓迎した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: よりも高潔な心を持っていた
  rationale: 語義には高い身分と称賛に値する人柄の両方があり得るが、続く節が熱心な受容と聖書の吟味によって彼らの姿勢を説明しているため、本文では人格・態度を表す訳を採った。比較級も「よりも」で明示した。
- source_word: οἵτινες
  choice: （文を分けて）あふれる熱意をもって…のである
  rationale: 関係代名詞が、高潔だと評価された理由を説明している。日本語では文を分け、文末の「のである」によって説明的なつながりを自然に示した。
- source_word: ἐδέξαντο τὸν λόγον
  choice: ことばを受け入れ
  rationale: δέχομαιの受容・歓迎の意味を「受け入れ」で表し、λόγοςは使徒言行録における語の響きを保つため「ことば」とした。直ちに無批判な同意を意味するとは限定せず、続く吟味との緊張も残した。
- source_word: μετὰ πάσης προθυμίας
  choice: あふれる熱意をもって
  rationale: προθυμίαの意欲、進んで応じる姿勢を自然な現代日本語で表し、πάσηςの強意も「あふれる」によって反映した。
- source_word: τὸ καθ’ ἡμέραν
  choice: 毎日
  rationale: 日ごとの継続・習慣を簡潔で自然な日本語にした。
- source_word: ἀνακρίνοντες
  choice: 調べていた
  rationale: 注意深く検討・吟味する意味を、聖書を対象とする文脈に自然な「調べる」で表した。単なる閲読ではなく検証する行為であることは、後続の「そのとおりかどうか」によって明確になる。
- source_word: τὰς γραφὰς
  choice: 聖書
  rationale: この文脈ではユダヤ人の聖なる諸文書を指すため、現代日本語で定着した「聖書」とした。
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: それらのことが果たしてそのとおりかどうか
  rationale: 間接疑問の意味を保ち、「果たして」によって実際に検証していた含みを自然に示した。「真実か」と断定的に言い換えず、原文の「そのようであるか」を反映した。
theological_decisions:
- issue: εὐγενέστεροιが示す高潔さの性質
  choice: 称賛に値する心・姿勢
  alternative: 家柄や社会的身分の高さ
  rationale: 後続部分が彼らの熱心な受容と聖書による検証を述べており、その態度が評価の根拠だと読むのが文脈上自然である。ただし身分を指し得る語義は脚注に残した。
- issue: λόγοςの訳語
  choice: ことば
  alternative: 知らせ／メッセージ
  rationale: 使徒言行録におけるλόγοςの語彙的・神学的連続性を保ちつつ、文脈で理解可能な表現とした。特定の教派的含意を付加しない。
- issue: 受容と吟味の関係
  choice: 「受け入れ」と「調べる」を併記し、両方を保持
  alternative: 初めから全面的に信じた、または疑って退けようとしたと解釈する
  rationale: 原文は熱心な受容と日々の検証を並べており、その緊張をどちらか一方に解消しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文としての品位を保った。「高潔な心」は原語の肯定的評価を残し、「素直」「偏見がない」など解釈を狭める語を避けた。冒頭のδέは日本語で不自然な接続語を加えず、前後関係の中で処理した。
