id: ACT.17.1
reference: Acts 17:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: ja
  text: 彼らはアンフィポリスとアポロニアを通って、テサロニケに来た。そこにはユダヤ人の会堂があった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: 通り抜け
  rationale: このアオリスト分詞は主動詞に先立つ移動を表す。二都市を経由したことを、自然な日本語で簡潔に示す。
- source_word: δὲ
  choice: 訳出しない
  rationale: ここでは弱い物語上の接続を示すため、現代日本語では明示しないほうが自然である。
- source_word: τὴν Ἀμφίπολιν καὶ τὴν Ἀπολλωνίαν
  choice: アンフィポリスとアポロニア
  rationale: 地名を日本語で一般的な音写にした。目的格は「通り抜け」の目的語として表した。
- source_word: ἦλθον εἰς Θεσσαλονίκην
  choice: テサロニケに来た
  rationale: 単純な移動を表すἔρχομαιと、目的地を示すεἰςを直接的かつ自然に訳した。
- source_word: ὅπου ἦν
  choice: そこには……があった
  rationale: 場所を示す関係副詞節を、明快な現代日本語の独立文として表した。
- source_word: συναγωγὴ τῶν Ἰουδαίων
  choice: ユダヤ人の会堂
  rationale: συναγωγήは文脈上ユダヤ教の礼拝・集会の場所を指すため「会堂」とし、属格はその共同体との所属・関係を表す「ユダヤ人の」とした。ギリシア語ではσυναγωγήに冠詞がないが、日本語は冠詞を持たないため、不自然な数量表現を加えなかった。
theological_decisions:
- issue: Ἰουδαίωνの指示範囲
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: ここではテサロニケの会堂に関係する民族的・宗教的共同体を指し、ユダヤ地方の住民に限定されない。
- issue: 無冠詞のσυναγωγή
  choice: 会堂
  alternative: 一つの会堂
  rationale: ギリシア語の無冠詞性を日本語で数量表現に変換すると、「複数のうちの一つ」という含意を不必要に加える可能性があるため、中立的に訳した。
translation_notes:
  register: 明快で品位のある現代標準語。主語は直前の文脈を受ける複数人物であるため「一行」と補い、機械的な代名詞を避けた。地名は新共同訳などで広く定着した表記に従った。
