  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: ja
  text: そして、ヤソンとほかの者たちから保証金[a]を取ったうえで、彼らを釈放した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「十分な額」。おそらく、平穏な行動を保証するために差し入れた法的な誓約金または保証金。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: 取ったうえで
  rationale: アオリスト分詞が主動詞に先立つ行為を示しているため、自然な現代日本語で行為の順序を保った。
- source_word: τὸ ἱκανὸν
  choice: 保証金
  rationale: 直訳は「十分なもの（額）」だが、この司法・行政上の文脈では、秩序ある行動を担保するために差し入れられた金銭的保証を指す可能性が高い。「保釈金」ほど制度を限定せず、法的・金銭的意味を明瞭に伝える。
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: ヤソンとほかの者たちから
  rationale: 属格を伴う παρά の出所の意味と、λοιπῶν が指す同じ一団の残りの者たちを、自然な日本語で表した。
- source_word: ἀπέλυσαν
  choice: 釈放した
  rationale: 拘束されていた者を公的権限者が解放する司法的文脈に合う。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 拘束されていたヤソンとほかの者たちを受ける複数代名詞として明示した。
