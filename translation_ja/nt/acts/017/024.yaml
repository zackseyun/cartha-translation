id: ACT.17.24
reference: Acts 17:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: ja
  text: 世界とその中のすべてを造られた神は、天と地の主であり、人の手で造られた神殿[a]には住んでおられません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間が造った神殿」。直訳は「手で造られた神殿」で、人の手によって建てられた神殿を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: 造られた
  rationale: 神を修飾するアオリスト分詞を、自然な連体節で表した。「創造された」よりも ποιέω の基本的な語感に近い。
- source_word: τὸν κόσμον
  choice: 世界
  rationale: ここでは被造世界全体を指す。現代日本語で明瞭かつ広い意味を保てる。
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: その中のすべて
  rationale: κόσμος の中にある一切を包括する表現として、簡潔で自然な日本語にした。
- source_word: ὑπάρχων κύριος
  choice: 主であり
  rationale: 神が天と地の主であるという継続的な状態を表し、分詞を理由を示す表現へ限定しない。
- source_word: οὐρανοῦ καὶ γῆς
  choice: 天と地の
  rationale: κύριος にかかる属格を、日本語の定着した対句で表した。
- source_word: χειροποιήτοις
  choice: 人の手で造られた
  rationale: 人間の手による制作物という意味を明示し、創造主との対比を保った。
- source_word: ναοῖς
  choice: 神殿
  rationale: 神が宿る聖所としての ναός を、文脈に合う一般的で明瞭な語で訳した。
- source_word: κατοικεῖ
  choice: 住んでおられません
  rationale: 継続して住むことを表す κατοικέω の意味を保ちつつ、神についての自然で丁重な現代日本語とした。
theological_decisions:
- issue: 神の超越性と神殿への局在
  choice: 創造主であり天と地の主である神は、人間が造った神殿には住んでいないと直接述べる。
  alternative: 神は神殿に閉じ込められない、と説明的に言い換える。
  rationale: 原文の直接的な主張を保ち、「閉じ込められない」という解釈的な補足を本文に加えないため。
- issue: ὑπάρχων の論理関係
  choice: 「主であり」として状態を表す。
  alternative: 「主なのだから」として理由を明示する。
  rationale: 分詞が持ち得る含みを因果関係に限定せず、原文の曖昧さを保つため。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。神への敬意を自然に示すため「造られた」「住んでおられません」を用いたが、原文にない神学的説明は加えていない。
