source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: ja
  text: しかし、何人かの男たちはパウロと行動を共にするようになり[a]、信じた。その中には、アレオパゴスのディオニュシオス[b]、ダマリスという名の女性、またその二人と共にほかの人々もいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「パウロに結び付いて」。このギリシア語は、パウロと親しく結び付き、行動を共にするようになったことを示す。
    reason: lexical_alternative
  - marker: b
    text: 原語の呼称は、アレオパゴス評議会の構成員、またはアレオパゴスに関係する人物を指す可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: しかし、何人かの男たちは
  rationale: δὲが直前の人々の反応との穏やかな対照を示すため「しかし」とし、明示的に男性を指すἄνδρεςは「男たち」と訳した。
- source_word: κολληθέντες αὐτῷ
  choice: パウロに加わって
  rationale: κολλάομαιが表す、ある人に結び付いて行動を共にするという親密な関係を、自然な日本語で表した。代名詞の指示対象は文脈上パウロであるため、固有名を補った。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: 何を信じたかを本文以上に限定せず、宣教への応答としての信仰を簡潔に表した。
- source_word: ἐν οἷς καὶ
  choice: その中には
  rationale: 信じた人々の中から具体的な人物を挙げる関係節を、自然な日本語にした。καὶの付加的意味もこの表現に含まれる。
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: アレオパゴス議員のディオニュシオス
  rationale: Ἀρεοπαγίτηςを一般的に理解されるアレオパゴス評議会の構成員として訳した。ただし、この呼称がより広く同機関に関係する人物を指す可能性は注で残した。
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: ダマリスという名の女性
  rationale: 人物の性別と名前を明示する原文を、明瞭で自然な現代日本語にした。
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: 彼らと共にほかの人々も
  rationale: 名を挙げられた二人以外にも同行する信者たちがいたことを、原文の付加と同伴の意味を保って表した。
theological_decisions:
- issue: πιστεύωが示す応答の性質
  choice: 信じた
  alternative: 信仰に入った
  rationale: 文脈上、パウロの宣教に対する真正な信仰を示すが、この節自体は信仰内容を詳述していない。「信じた」は、その神学的含みを弱めず、本文以上の定式を加えない。
- issue: κολληθέντεςとἐπίστευσανの関係
  choice: パウロに加わって信じた
  alternative: パウロに付き従い、信じた
  rationale: 人間であるパウロとの結び付きと、宣教内容を信じたことを区別できる語順を保ち、信仰の対象がパウロであるかのような表現を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。語順は日本語として自然に整えつつ、男性を指す語、パウロとの人的な結び付き、信仰という応答、二人の固有名、およびほかの信者たちの存在を明示した。
