  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: ja
  text: 死者の復活について聞くと、ある者たちはあざ笑ったが、ほかの者たちは、「またこのことについて、あなたの話を聞こう」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: 聞くと
  rationale: アオリスト分詞の時間的状況を自然な日本語で示す。δὲの軽い展開は文脈と後続の対比で十分に表されるため、独立した接続語は加えない。
- source_word: ἀνάστασιν νεκρῶν
  choice: 死者の復活
  rationale: 冠詞のない句を概念として簡潔に訳し、死者が復活するという内容を過不足なく保つ。
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ある者たちは……が、ほかの者たちは
  rationale: 二群の対照を明確かつ自然に表す。
- source_word: ἐχλεύαζον
  choice: あざ笑った
  rationale: 嘲弄する反応を明瞭に表す。未完了過去の継続性を日本語で不自然に強調せず、開始の意味も付加しない。
- source_word: Ἀκουσόμεθά σου
  choice: あなたの話を聞くことにしよう
  rationale: 属格の人称代名詞を伴うἀκούωを、日本語で自然な『あなたの話を聞く』として表し、未来形の意向的な響きを『ことにしよう』で示す。
- source_word: περὶ τούτου καὶ πάλιν
  choice: このことについては、また
  rationale: 話題を示すπερὶ τούτουと、再度・後の機会を示すκαὶ πάλινの双方を本文中に明示する。
theological_decisions:
- issue: 異教的背景の聴衆に対する復活表現の意味
  choice: 死者の復活
  alternative: 死者の中からの復活
  rationale: ἀνάστασιν νεκρῶνはここでは死者一般に関わる復活という概念を自然に表す。個別の人物が『死者の中から』復活するという意味に限定せず、本文の神学的含意を敷衍しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙述には簡潔さと品位を保った。καὶ πάλινは省略せず『また』として本文に反映した。
