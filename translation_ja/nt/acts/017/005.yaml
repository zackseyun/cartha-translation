  to: しかし、ユダヤ人たちはねたみを抱き、市場にいた何人かの悪い男たちを仲間に加え、暴徒を集めて町を騒がせていた。そしてヤソンの家へ行き、彼らを民会[a]へ引き出そうとした。
  rationale: 複数代名詞を「彼ら」として保持し、ζητέω＋不定詞を「引き出そうとした」と訳して、原文の構文と曖昧さを保った。「家へ行き」は到来を過剰に強調せず、「暴徒を集め」は自然な現代日本語である。脚注のアンカーと内容は維持できる。
