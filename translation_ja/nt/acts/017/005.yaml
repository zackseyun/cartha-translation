id: ACT.17.5
reference: Acts 17:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: ja
  text: しかし、ユダヤ人たちはねたみを抱き、市場にいた何人かの悪い男たちを仲間に加え、暴徒を集めて町を騒がせていた。そしてヤソンの家へ行き、彼らを民会[a]へ引き出そうとした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「公の集会」または「民衆の前」とも訳せる。ギリシア語の「デーモス」は、単なる不特定の群衆ではなく、公に集まった市民団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: ねたみに駆られ
  rationale: 行動の動機となったねたみを自然な現代日本語で表す。アオリスト分詞の先行性を踏まえつつ、文脈に合う動的な表現とした。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の民族・宗教的呼称を狭めずに訳す。文脈上はテサロニケの特定のユダヤ人集団を指し、すべてのユダヤ人を指すものではない。
- source_word: προσλαβόμενοι
  choice: 仲間に引き入れて
  rationale: 自分たちの側に加える中動態の含意を表し、正式な雇用までを意味する「雇う」は避けた。
- source_word: τῶν ἀγοραίων
  choice: 市場にいた
  rationale: 市場・広場にたむろしていた者という可能性を残しつつ、「ならず者」などの解釈を語そのものに重ねない。
- source_word: ἄνδρας τινὰς πονηρούς
  choice: 何人かの悪人
  rationale: τινάςの不特定性とπονηρούςの明確な否定的評価を簡潔に保つ。日本語では文脈上「人」が男性を含み、重複を避けて自然にした。
- source_word: ὀχλοποιήσαντες
  choice: 暴徒を作り
  rationale: 単なる群衆の形成ではなく、敵対的な騒擾集団を作ったという文脈上の含意を表す。
- source_word: ἐθορύβουν τὴν πόλιν
  choice: 町を騒乱に陥れた
  rationale: θορυβέωの騒ぎ・混乱を引き起こす意味を明確にし、未完了過去の進行性は一連の叙述の中で自然な日本語にまとめた。
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: ヤソンの家に押しかけ
  rationale: 到着・接近を表す語に、敵対的な群衆という文脈を加味した自然な表現。ただし家を実際に襲撃・破壊したとまでは断定しない。
- source_word: ἐζήτουν
  choice: 捜した
  rationale: 家にいるはずの者を見つけ出して連行しようとした継続的な行為を表す。単に「試みた」として捜索の含みを失わないようにした。
- source_word: αὐτούς
  choice: 二人
  rationale: 直前の文脈にあるパウロとシラスを受ける複数代名詞を、日本語で指示対象が分かるよう人数で示すが、固有名は補わない。
- source_word: προαγαγεῖν
  choice: 引き出そうと
  rationale: 家の中から公の場へ連れ出すという方向性と、企図された行為であることを表す。
- source_word: εἰς τὸν δῆμον
  choice: 民会の前に
  rationale: δῆμοςを不特定の群衆ではなく、市民の公的集会・政治的共同体として表す。「前に」は公の審理に引き出す自然な日本語。
theological_decisions:
- issue: 対立記事における οἱ Ἰουδαῖοι の訳し方
  choice: ユダヤ人たち
  alternative: ユダヤ人の指導者たち／ユダヤ地方の人々
  rationale: 原文は指導者に限定しておらず、地理的出身を前面に出してもいないため、語義に忠実な呼称を採用する。ここでの指示対象がテサロニケの一部のユダヤ人であることは文脈によって限定される。
- issue: δῆμος の制度的性格
  choice: 民会
  alternative: 民衆／公の集会
  rationale: 単なる人だかりではなく、公的に集まる市民団を指す可能性が高いため「民会」とした。ただし制度上の厳密な形態には幅があるので脚注で説明する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語の緊迫感と公的・政治的な場面を保った。「民会」はやや歴史的な語だが、δῆμοςの制度的意味を簡潔に伝えるため採用し、脚注で補った。
