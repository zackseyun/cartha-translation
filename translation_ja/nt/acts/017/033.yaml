- source_word: ὁ Παῦλος
  choice: パウロ
  rationale: 日本語聖書で定着している固有名の慣用表記を用いた。ギリシア語の冠詞は日本語では明示しない。
- source_word: ἐξῆλθεν
  choice: 出て行った
  rationale: ἐξέρχομαιの具体的な退出の動きを保ち、後続する「彼らの中から」と自然につなげた。
- source_word: ἐκ μέσου αὐτῶν
  choice: 彼らの中から
  rationale: 集まっていた人々のただ中から離れたことを、現代日本語で簡潔に表す。
