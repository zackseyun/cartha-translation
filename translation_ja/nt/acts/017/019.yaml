  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: ja
  text: そこで彼らはパウロをつかまえ、アレオパゴス[a]へ連れて行き、こう言った。「あなたが語っているこの新しい教えがどのようなものか、知ることができるでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アレオパゴス」は、丘そのものを指す場合と、その名で知られる評議会を指す場合がある。「アレスの丘」とも訳せる。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: 連れて
  rationale: この動詞は「つかむ」「捕らえる」「連れて行く」などの幅を持つ。ここでは相手側の物理的な主導を示しつつ、逮捕と断定するほどの敵意を加えない「連れて」とした。
- source_word: τε
  choice: そこで
  rationale: 前節からの緩やかな物語上の展開を、現代日本語で自然に示す。
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: アレオパゴスへ
  rationale: 地名と、それに結びつく評議会のどちらを指す可能性も残すため、固有名を音写した。
- source_word: ἤγαγον
  choice: 行き
  rationale: ἐπιλαβόμενοι と合わせて「連れて…行き」とし、目的地への移動を自然な日本語で表した。
- source_word: λέγοντες
  choice: こう言った
  rationale: 主動作に伴う発言を、日本語の物語文として自然に接続した。
- source_word: Δυνάμεθα γνῶναι
  choice: 聞かせてもらえませんか
  rationale: 字義的には「知ることができますか」だが、文脈では教えの内容を説明してほしいという丁寧な依頼であるため、その発話機能を自然な日本語で表した。
- source_word: καινὴ
  choice: 新しい
  rationale: 聞き手にとって新奇な教えであることを、広い意味を保つ一般的な語で表した。
- source_word: ἡ ὑπὸ σοῦ λαλουμένη
  choice: あなたが語っているその
  rationale: ギリシア語は受動表現だが、日本語では能動形のほうが自然であり、行為者と継続中の発話という内容は保たれる。
- source_word: διδαχή
  choice: 教え
  rationale: 「教理」ほど専門的・教派的な響きを持たず、一般の読者に明瞭な訳語である。
- source_word: τίς
  choice: どのようなものか
  rationale: ここでは教えの正体や内容を尋ねており、単純な「何か」より自然にその問いを表す。
theological_decisions:
- issue: パウロがアレオパゴスへ連れて行かれた際の強制性
  choice: 相手側が主導して連れて行ったが、逮捕とは断定しない
  alternative: 「捕らえて」として正式な拘束を示す／「案内して」として単なる丁重な招待を示す
  rationale: ἐπιλαμβάνομαι には物理的に手をかける含みがあり得る一方、直後の問いは関心を示している。したがって、敵意や礼節の度合いを本文以上に確定しない。
- issue: Ἄρειος Πάγος の指示対象
  choice: 「アレオパゴス」と固有名で訳し、場所か評議会かを本文で限定しない
  alternative: 「アレスの丘」という場所／「アレオパゴス評議会」という組織
  rationale: この名称は丘そのものと、それに関係する評議会の双方を指し得るため、原文の曖昧さを保った。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文として品位のある常体を採用した。問いかけは丁寧な依頼として自然な敬語にし、アレオパゴスの歴史的な指示対象と、連行の強制性については原文の曖昧さを保った。
