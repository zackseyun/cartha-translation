revisions:
- from: こうして、神は無知であった時代を見過ごしてこられましたが、今は、すべての場所ですべての人に、悔い改めるよう命じておられます。[a]
  to: こうして、神は無知の時代を見過ごされましたが、今は、どこにいるすべての人にも悔い改めるよう命じておられます。[a]
  rationale: 過去のアオリスト分詞ὑπεριδώνと現在のπαραγγέλλειの対照を、「見過ごされましたが、今は」で明瞭にした。また、πανταχοῦの普遍的な場所的範囲を、現代日本語として自然な「どこにいるすべての人にも」で表した。脚注は「見過ごす」が是認を意味するとの誤解を防ぎつつ、本文以上の教理的結論を加えないよう維持した。
