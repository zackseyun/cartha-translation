  terminology: 「神」「無知の時代」「見過ごす」「悔い改める」「命じる」は、いずれも本文の語義と現代標準日本語の聖書的文脈に適しています。「悔い改める」はμετανοεῖνを単なる思考変更へ狭めずに保つ適切な定着語です。
