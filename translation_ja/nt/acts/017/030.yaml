  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: ja
  text: こうして、神は無知の時代を見過ごされましたが、今は、どこにいるすべての人にも悔い改めるよう命じておられます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見過ごされました」は、神がその無知や罪を是認したという意味ではなく、直ちに裁かず忍耐されたことを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: こうして、無知であった時代を
  rationale: μὲν οὖνによる論述の移行と、過去と現在の緩やかな対照を「こうして」と後続の「が」で自然に示した。「無知」は内容を「神について」と限定せず、原文の簡潔さを保つ。
- source_word: ὑπεριδὼν
  choice: 見過ごしてこられましたが
  rationale: 神がかつて直ちに裁かず忍耐されたことを示しつつ、是認したという意味にはしない。「が」によりτὰ νῦνとの対照を明確にした。
- source_word: τὰ νῦν παραγγέλλει
  choice: 今は、…命じておられます
  rationale: 過去の時代との時間的対照と、παραγγέλλειの強い命令の意味を、自然で敬意ある現代日本語で表した。
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: すべての場所ですべての人に
  rationale: ἄνθρωποιを男性に限定せず人間一般として訳し、πάνταςとπανταχοῦの二重の普遍性を保持した。
- source_word: μετανοεῖν
  choice: 悔い改めるよう
  rationale: 思考の変化だけでなく、生き方と方向の転換を含む宣教上の意味を保つ定着した日本語聖書用語を用いた。
theological_decisions:
- issue: 神が「無知であった時代」を見過ごしたことの意味
  choice: 直ちに裁かず忍耐されたという含みを保つ
  alternative: 罪を無視した、または無知を全面的に免責したと読む
  rationale: ὑπεριδώνの語義と、現在の悔い改めへの命令との緊張を保ち、神が偶像礼拝を是認したとは訳文で断定しない。
- issue: 悔い改めの命令の範囲
  choice: すべての場所にいるすべての人
  alternative: 男性のみ、または異邦人のみに限定する
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦは人類全般に及ぶ包括的な表現である。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「悔い改める」は一般語よりやや聖書的だが、μετανοεῖνの認識的・道徳的転換を簡潔に保つため採用した。脚注記号は節末に置き、「見過ごす」の誤解を防いだ。
