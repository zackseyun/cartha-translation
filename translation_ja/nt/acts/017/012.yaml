source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: ja
  text: そこで、彼らのうち多くの人が信じた。また、社会的地位の高いギリシア人女性や男性も少なくなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「社会的地位の高い」は、「有力な」または「品位のある」とも訳せる。「少なくなかった」は、かなりの人数がいたことを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: そこで、…多くの人が
  rationale: μὲν οὖνが前節を受けた推論的・移行的なつながりを示すため、「そこで」とし、πολλοίを「多くの人」と訳した。
- source_word: ἐξ αὐτῶν
  choice: 彼らのうち
  rationale: 直前に言及された人々の中から、という部分を表す属格的意味を自然な日本語で保持した。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: 信じた対象は文脈から理解されるが、この節では明示されないため、説明を加えず簡潔に訳した。
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: ギリシア人女性たち
  rationale: 婚姻関係は示されていないためγυναικῶνを「妻」ではなく「女性たち」とし、Ἑλληνίδωνによる民族的・文化的同定を保った。
- source_word: τῶν εὐσχημόνων
  choice: 社会的地位の高い
  rationale: この文脈では、品位だけでなく社会的な身分や有力さを表す語として理解しやすい表現を選んだ。
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: 男性たちも、少なくなかった
  rationale: οὐκ ὀλίγοιの婉曲的強調を「多かった」と平板化せず、「少なくなかった」として保持した。καίは追加を自然に示す「も」とした。
theological_decisions:
- issue: ἐπίστευσανに信仰対象やキリスト教的内容を明記するか
  choice: 信じた
  alternative: 福音を信じた／キリストを信じた
  rationale: 目的語は文脈上含意されるものの、この節自体には明記されていないため、原文の簡潔さと開かれた表現を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文として落ち着きのある文体とした。「少なくなかった」によりルカ的な婉曲表現を残し、εὐσχήμωνの社会的含意は本文と脚注で示した。
