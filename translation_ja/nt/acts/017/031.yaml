id: ACT.17.31
reference: Acts 17:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: ja
  text: なぜなら、神は、ご自分が任命した一人の人によって、義をもって[a]人の住む世界を裁く日を定め、その人を死者の中から復活させることによって、すべての人に確かな証拠をお与えになった[b]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義をもって」または「公正に」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「すべての人に確証をお与えになった」とも訳せる。字義的には「すべての人に信頼を与えた」だが、ここでは復活によって保証または証拠を与えたという意味。
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: なぜなら〜からです
  rationale: 前節の悔い改めへの命令の根拠を示す因果関係を、自然な現代日本語で明示する。
- source_word: ἔστησεν ἡμέραν
  choice: 日を定め
  rationale: ἵστημιの「設定する、定める」という意味と、裁きの日が確定していることを簡潔に伝える。
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: 裁く日
  rationale: μέλλειは神の定まった将来の行為を表す。日本語では「裁こうとしている」よりも、文全体の「日を定めた」に将来性を担わせる方が自然である。
- source_word: τὴν οἰκουμένην
  choice: 人の住む世界
  rationale: 単なる宇宙ではなく、人間の居住世界を指す語義と普遍的範囲を保つ。
- source_word: ἐν δικαιοσύνῃ
  choice: 義をもって
  rationale: δικαιοσύνηの基本的な意味を保持しつつ、公正な裁きの仕方を示す自然な日本語とした。「正義をもって」も可能なので脚注に示す。
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: ご自分が定めた一人の人によって
  rationale: ἀνήρの男性を示す語義と、無冠詞表現を「一人の人」で保ち、ὁρίζωを「定める」と訳した。文脈上の指示対象を訳文でイエスと明示しすぎない。
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: すべての人に確かな証拠をお与えになった
  rationale: この連語でπίστιςは「信仰」そのものより、保証・確証・証拠の意味を持つ。「確かな証拠」で復活が公的な確証であることを表す。直訳寄りの可能性は脚注に残す。
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: その人を死者の中から復活させることによって
  rationale: 分詞を証拠を与えた手段として訳し、ἐκ νεκρῶνの複数形の表現を「死者の中から」で保持する。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 義をもって
  alternative: 正義をもって／公正に
  rationale: 神学的に重要な「義」を本文に保つ一方、裁きの文脈では正義・公正という意味合いもあるため脚注で示す。
- issue: πίστις（πίστιν παρασχὼν）の意味
  choice: 確かな証拠
  alternative: 確証／保証／信頼すべき根拠（字義的には「信」を与える）
  rationale: παρέχωとの結び付きと復活という文脈から、神が任命した裁き主について万人に確証を与えたという意味を優先する。ここを「信仰を与えた」とすると、万人への信仰付与という別の神学的主張に読み違えられうる。
- issue: ἀνήρの性別と不定性
  choice: 一人の人
  alternative: その人／一人の男性
  rationale: 男性を指すἀνήρを中性的に薄めず、同時に日本語で不自然になりやすい「一人の男性」を避けた。無冠詞であることも「一人の」によって表す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神を主語とする動詞には敬語を用いた。原文の長い一文と因果構造を保ちながら、日本語として追いやすい語順に整えた。脚注記号[a][b]は該当箇所に置いた。
