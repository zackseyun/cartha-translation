source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: ja
  text: ヤソンが迎え入れた[a]この者たちは皆、カエサルの諸命令[b]に背いて行動し、イエスという別の王[c]がいると言っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「受け入れた」「泊めた」。ギリシア語は、客を受け入れてもてなすことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: または「布告」「定め」。ここでは公的な決定、命令、規定を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳「別の王」。「カエサルとは別の王がいる」という、カエサルの支配に対抗する主張だという告発を表す。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: 迎え入れた
  rationale: 客として受け入れ、もてなしたという含みを自然な現代日本語で表す。完了形が示す、受け入れたことの現在に及ぶ結果も文脈上保たれる。
- source_word: ἀπέναντι τῶν δογμάτων Καίσαρος
  choice: カエサルの定めに背く
  rationale: ἀπέναντιはここで反対・違反を表し、δόγματαは皇帝に関わる公的な決定や命令を指す。「定めに背く」は法的な告発の響きを明確かつ平易に伝える。
- source_word: πράσσουσι
  choice: 行いをし
  rationale: 継続的な行動を述べる現在形の力を保ち、単なる思想ではなく実際の行為として告発されていることを示す。
- source_word: βασιλέα ἕτερον
  choice: 別の王
  rationale: βασιλεύςを具体的な「王」とし、ἕτερονが示す、カエサルとは別の競合する王という告発の政治的含意を保つ。
- source_word: λέγοντες εἶναι Ἰησοῦν
  choice: イエスという……がいると言っています
  rationale: 分詞と不定詞による間接話法を自然な日本語に組み替えつつ、王がイエスであるという同定を明瞭にする。
- source_word: οὗτοι πάντες
  choice: この者たちは皆
  rationale: 指示性と、全員を一括して告発する πάντες の強調をともに保持する。
theological_decisions:
- issue: イエスを王とする告発の政治的意味
  choice: 「別の王」と明示し、カエサルの権威に対抗する主張として告発された緊張を保つ。
  alternative: 「別の指導者」などと訳して政治的含意を弱める。
  rationale: 本文はカエサルの定めと「王」を直接結びつけているため、霊的な意味だけに限定せず、告発が持つ政治的・神学的緊張をそのまま残す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、法的告発の調子にふさわしい品位を保った。「カエサル」は新約聖書の歴史的称号として保持し、「この者たち」は告発者の発言に合う中立的でやや公的な表現とした。
