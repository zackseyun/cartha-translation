id: ACT.17.18
reference: Acts 17:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: ja
  text: また、エピクロス派とストア派の哲学者たちのうち何人かも、パウロと議論を交わしていた[a]。ある者たちは、「この受け売り屋は[b]、何を言おうとしているのか」と言い、ほかの者たちは、「異国の神々[c]を宣べ伝える者らしい」と言った。パウロがイエスと復活[d]についての良い知らせを伝えていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「語り合っていた」または「論じ合っていた」とも訳せる。ギリシア語の動詞は、積極的な対話にも論争にも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 「受け売り屋」に当たる語は、文字どおりには「種を拾う者」。ここでは、思想の断片を拾い集め、それを言い触らす者を見下して呼ぶ表現である。
    reason: cultural_note
  - marker: c
    text: 「異国の霊的存在」または「見知らぬ神々」とも訳せる。ここでは、後のキリスト教用語でいう悪霊とは限らず、アテネ人の宗教観における未知の神的存在を指すと考えられる。
    reason: alternative_reading
  - marker: d
    text: パウロが「イエスと復活」を告げていたため、アテネ人は「復活」をもう一柱の神格の名だと誤解したのではないか、と考える解釈もある。
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: パウロと議論を交わしていた
  rationale: この文脈の動詞は、対話から論争までを含み得る。「議論を交わす」は哲学者との能動的な意見交換を自然に表しつつ、敵対的な論争だけに限定しない。
- source_word: σπερμολόγος
  choice: 受け売り屋
  rationale: 元来「種を拾う者」を指し、そこから、思想の断片を拾い集めて言い触らす者を侮蔑的に呼ぶ語となった。「受け売り屋」は、その軽蔑と、借り物の知識を語るという含意を簡潔に伝える。
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: 何を言おうとしているのか
  rationale: ἄνを伴う希求法が示す、距離を置いた推量と軽蔑的な響きを、自然な現代日本語で表した。
- source_word: Ξένων δαιμονίων
  choice: 異国の神々
  rationale: ここではアテネの異教的な枠組みで未知の神的存在を指しており、キリスト教的な意味での悪霊に限定しない。「異国の神々」は話者の認識を自然に表す。
- source_word: καταγγελεὺς
  choice: 宣べ伝える者
  rationale: 公に告知する者という意味を、明瞭で格調を保った日本語にした。
- source_word: εὐηγγελίζετο
  choice: 良い知らせを告げ知らせていた
  rationale: 単なる説教ではなく「良い知らせを告げる」という動詞固有の意味を明示した。
- source_word: ἀνάστασιν
  choice: 復活
  rationale: ルカの説明ではパウロが告げていた内容を表す普通名詞として訳した。擬人化された固有名のようには扱わず、アテネ人が別の神格と誤解した可能性は注で示す。
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: エピクロス派とストア派の哲学者たち
  rationale: 二つの哲学学派の名称と「哲学者」を明確に保つ、自然な日本語表現である。
theological_decisions:
- issue: 異教徒の発言における δαιμόνια の訳
  choice: 異国の神々
  alternative: 異国の霊的存在／異国の悪霊ども
  rationale: 話者であるアテネ人の宗教的範疇では未知の神的存在を意味し得るため、後代のキリスト教的な「悪霊」の意味を本文に持ち込まない。語の幅は注に残す。
- issue: ἀνάστασιν を擬人化された神格名として扱うか
  choice: 普通名詞「復活」
  alternative: 神格名としての「復活」
  rationale: 本文はルカによるパウロの宣教内容の説明として読むのが直接的である。一方、アテネ人が「イエス」と「復活」を二柱の神格と誤解した可能性は排除せず、注記する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、哲学的な論議と公的な宣教にふさわしい落ち着いた格調を保った。「受け売り屋」は口語的だが、この箇所の侮蔑的な発言を伝えるため意図的に採用した。
