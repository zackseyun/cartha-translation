- source_word: τοὺς πολιτάρχας
  choice: 町の役人たち
  rationale: マケドニア地方の都市行政官の称号を、現代の一般読者に分かる機能的な表現で訳した。厳密な地方称号については脚注で補う。
- source_word: ἀκούοντας ταῦτα
  choice: これらのことを聞いた
  rationale: 現在分詞を自然な時の関係として表し、対格複数形なので群衆と町の役人たちの双方にかかる形を保った。ταῦταの複数性も「これらのこと」で反映した。
