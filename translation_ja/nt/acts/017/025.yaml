    reason: lexical_alternative
  revision_rationale: πᾶσιとτὰ πάνταの両方の包括性を保ちつつ、日本語での受け手と与えられるものの混同を避けた。「すべての者」は原文の無限定な「すべてに」を人間だけに明示的に限定せずに表し、「そのほかすべてのもの」は命と息に加わる包括的な贈与を明瞭にする。脚注も自然な現代日本語に整えた。
