source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: ja
  text: また、何かを必要としているかのように、人の手によって仕えられることもありません[a]。神ご自身が、すべての者に命と息と、そのほかすべてのものを与えておられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人の手によって礼拝されることもありません」。ギリシア語の動詞は、宗教的な文脈で行われる奉仕や世話を表すことがあります。ここでは、神が人間の奉仕によって必要を満たしていただく方ではない、という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: また～こともありません
  rationale: 前節から続く否定を、現代日本語で自然に示す。
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: 人の手によって
  rationale: 具体的な原文の比喩を保ち、人間による宗教的奉仕という文脈を伝える。
- source_word: θεραπεύεται
  choice: 仕えられる
  rationale: ここでは「癒やされる」ではなく、必要を満たすための奉仕や世話を受ける意。礼拝に限定せず、原語の幅を保つ。
- source_word: προσδεόμενός τινος
  choice: 何かを必要としているかのように
  rationale: 分詞の含む理由・想定のニュアンスを保ち、神が欠乏ゆえに奉仕を受けるのではないという対比を表す。
- source_word: αὐτὸς
  choice: 神ご自身が
  rationale: 強意を明示し、奉仕を必要とする者ではなく、逆に与える方であるという対照を保つ。日本語で指示対象も明確にする。
- source_word: διδοὺς
  choice: 与えておられる
  rationale: 分詞の継続的・説明的関係を自然な述語として表し、前文の理由を示す。
- source_word: πᾶσι
  choice: すべてのものに
  rationale: 人間だけに狭めず、原文の広い適用範囲を保つ。
- source_word: ζωὴν
  choice: 命
  rationale: πνοήと並び、被造物の生命が神に由来することを表す標準的な訳。
- source_word: πνοὴν
  choice: 息
  rationale: 「命」との組み合わせでは生命を支える呼吸を指すのが自然であり、「霊」とは訳さない。
- source_word: καὶ τὰ πάντα
  choice: と、すべてのもの
  rationale: 命と息に加え、必要な一切を神が与えるという総括的な力を保持する。前のπᾶσιとの反復も原文に沿って残す。
theological_decisions:
- issue: θεραπεύεταιを明示的な礼拝用語で訳すか、より広い奉仕の語で訳すか
  choice: 仕えられる
  alternative: 礼拝される／世話を受ける
  rationale: 文脈は、人間の宗教的な奉仕によって神の必要が満たされるのではないという神の自足性を論じている。「仕えられる」は祭儀的奉仕を含みつつ、内面的礼拝だけに意味を狭めない。
- issue: πᾶσιの範囲
  choice: すべてのものに
  alternative: すべての人に
  rationale: 宇宙論的な文脈と原語の限定されない表現を尊重し、人間だけに狭めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「仕えられる」はやや改まった受け身だが、原文の神学的対比と宗教的文脈を保つため適切。πᾶσιとτὰ πάνταの反復は、日本語でも「すべてのものに」「すべてのものを」と残した。
