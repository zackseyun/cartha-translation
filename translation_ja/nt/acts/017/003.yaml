revisions:
- from: 聖書を解き明かし、証拠を挙げて、メシア[a]は苦しみを受け、死者の中からよみがえらなければならなかったこと、そして、「私があなたがたに宣べ伝えているこのイエスこそ、メシアなのです」と説いた。[b]
  to: 説明し、論証して、メシア[a]が苦しみを受け、死者の中からよみがえらなければならなかったこと[b]、また、私があなたがたに告げ知らせているこのイエスこそがメシアであることを示した。
  rationale: 原文の二つの内容節（「メシアが…必要だったこと」と「このイエスこそがメシアであること」）を並列して明示した。「示した」は、διανοίγων と παρατιθέμενος の説明・提示／論証という働きを日本語で自然に受ける。直接話法は原文が要求しないため、内容節として訳し、ὃν ἐγὼ καταγγέλλω ὑμῖν は「私があなたがたに告げ知らせているこのイエス」と保持した。脚注bは復活動詞の直後に移した。
  reviewer_model: gpt-5.6-terra
