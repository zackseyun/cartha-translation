id: ACT.17.3
reference: Acts 17:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: ja
  text: 説明し、論証して、メシア[a]が苦しみを受け、死者の中からよみがえらなければならなかったこと[b]、また、私があなたがたに告げ知らせているこのイエスこそがメシアであることを示した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。この節の二つの用例はいずれも、固有名ではなく「油を注がれた者」という称号。
    reason: alternative_reading
  - marker: b
    text: 原文では「よみがえる」は能動形。新約聖書のほかの箇所では、神がイエスを死者の中からよみがえらせたとも述べられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: 聖書を解き明かし
  rationale: 直前の「聖書に基づいて」と結びつき、聖書の意味を開いて明らかにする行為を自然な現代日本語で表す。目的語の「聖書」は文脈から補った。
- source_word: παρατιθέμενος
  choice: 証拠を挙げて
  rationale: 資料や根拠を人々の前に提示して論証する意味を、形式的な「置いて」より明瞭に表す。
- source_word: τὸν χριστόν / ὁ χριστός
  choice: メシア
  rationale: 二例とも固有名の一部ではなく、待望された油注がれた者を指す称号として用いられている。
- source_word: ἔδει
  choice: なければならなかった
  rationale: 聖書に基づく必然性を表す未完了過去の非人称表現を、過去の必要として明確に訳す。
- source_word: παθεῖν
  choice: 苦しみを受け
  rationale: 受難を含む πάσχω の標準的な意味を、自然で荘重な日本語にする。
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: 死者の中からよみがえら
  rationale: 能動不定詞を能動的な「よみがえる」で表し、ἐκ νεκρῶν の字義的な複数表現も「死者の中から」として保持する。
- source_word: καταγγέλλω ὑμῖν
  choice: あなたがたに宣べ伝えている
  rationale: 公に告げ知らせる現在形の継続的な響きを保ち、宗教的文脈でも一般読者に理解できる表現とした。
theological_decisions:
- issue: Χριστόςを称号としてどう訳すか
  choice: 二か所とも「メシア」
  alternative: 二か所とも「キリスト」
  rationale: この節の論旨は、聖書が示す待望の油注がれた者の受難と復活、そしてその者がイエスであることにあるため、称号性が明瞭な「メシア」を本文に置く。伝統的な訳語は脚注に残す。
- issue: ἀναστῆναιの態
  choice: 「よみがえる」という能動表現
  alternative: 「よみがえらされる」または「復活させられる」
  rationale: この節のギリシア語は能動不定詞であり、その形を優先する。他箇所にある神がイエスをよみがえらせたという表現を否定するものではない。
- issue: 発話部分の統語的提示
  choice: 「このイエスこそ、メシアなのです」と直接話法で表す
  alternative: このイエスがメシアであることを説いた、という間接話法
  rationale: 原文は内容節であり直接・間接の形式を厳密には指定しないが、日本語ではパウロの宣言の焦点を明瞭にするため引用形が自然である。意味内容は変えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「解き明かす」「宣べ伝える」によって聖書本文にふさわしい品位を保った。節が前節から続く分詞構文であるため、日本語では主動詞「説いた」を末尾に補い、独立しても読める文に整えた。脚注記号は本文中の対応箇所に置いた。
