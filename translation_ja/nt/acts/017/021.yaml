  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: ja
  text: アテネ人は皆、またそこに滞在していた外国人たちも、何かもっと新しいこと[a]を話したり聞いたりすることにしか、時間を費やしていなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は比較級を用いており、直訳すれば「何かもっと新しいこと」。文脈上、「何か新しいこと」とも理解でき、次々に新しい話題を求める傾向を表していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: アテネ人は皆
  rationale: πάντεςの全称を明示しつつ、δὲはここでは強い逆接ではなく説明的な脇注への緩やかな移行なので、日本語では無理に接続語を置かず文脈に委ねた。
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: そこに滞在していた外国人たち
  rationale: ἐπιδημέωの、その土地に一時滞在しているという含みを保ち、永住者に限定しない表現とした。
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: それ以外には、時間を使っていなかった
  rationale: 未完了過去の習慣的・継続的な様相と、ほかのことには時間を充てなかったという慣用的意味を、平明な現代日本語で表した。
- source_word: λέγειν τι ἢ ἀκούειν
  choice: 何か…を話したり聞いたりする
  rationale: 二つの不定詞を並列の「たり」で自然に対応させた。τιは後続するκαινότερονと一体で「何か…こと」とした。
- source_word: τι καινότερον
  choice: 何かもっと新しいこと
  rationale: 比較級καινότερονを「もっと新しい」として残し、次々に新奇な話題を求める含みを伝えた。日本語では比較対象が明示されなくても自然に理解できる。
