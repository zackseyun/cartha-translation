  naturalness: 現行の「シラスとテモテに、できるだけ早く…来るようにとの指示を受けると」は、「シラスとテモテ」が指示を受けたようにも一瞬読める。「宛てに」として係り先を明確にし、分詞の先行関係は「受けて」で自然に表す。
