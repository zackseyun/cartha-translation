  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: ja
  text: パウロを案内した人々は、彼をアテネまで連れて行った。そして、シラスとテモテ宛てに、できるだけ早くパウロのもとへ来るようにという指示[a]を受けて、出発した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「命令」とも訳せる。原語は、指示だけでなく、権威を伴う命令を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: 送り届ける
  rationale: この文脈では、パウロに付き添い、安全に目的地まで連れて行く行為を表す。現代日本語として自然で、単なる同行以上の役割も伝える。
- source_word: ἤγαγον
  choice: 連れて行った
  rationale: 人であるパウロを目的地のアテネまで導いた完了的な移動を、自然な日本語で表す。
- source_word: ἕως Ἀθηνῶν
  choice: アテネまで
  rationale: ἕωςが示す到達範囲を簡潔に保ち、同行者がその地点までパウロを連れて行ったことを表す。
- source_word: λαβόντες ἐντολήν
  choice: 指示を受けると
  rationale: 分詞の時間的関係を自然に表す。ἐντολήには命令の意味もあるが、ここでは同労者への伝言内容を託された文脈に適した「指示」とした。語の強さの幅は脚注に示す。
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: シラスとテモテに
  rationale: 指示の受け手を明確にする自然な日本語であり、後続する内容節との関係も分かりやすい。
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: できるだけ早くパウロのもとへ来るように
  rationale: ὡς τάχισταの切迫感を「できるだけ早く」で表す。日本語では代名詞の指示対象を明確にするため、αὐτόνを「パウロ」とした。
- source_word: ἐξῄεσαν
  choice: 出発した
  rationale: 指示を受けた後にその場を去って帰途についた場面を、簡潔で自然な物語表現にした。
