  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: ja
  text: そこでパウロは、アレオパゴスの中央に立って言った。「アテネの皆さん、私は、皆さんがあらゆる点で非常に信心深い[a]方々だと見受けます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「迷信深い」、または「より信心深い」とも訳せる。このギリシア語は、否定的にも肯定的にも受け取ることができる。
    reason: 語義の両義性と比較級の含みを示し、パウロの語調を一つに決めすぎないため。
lexical_decisions:
- source_word: Σταθεὶς
  choice: 立って
  rationale: 場面を設定するアオリスト分詞を、自然な日本語の連用形で表した。姿勢と発言への移行を簡潔に保っている。
- source_word: δὲ
  choice: そこで
  rationale: 物語の緩やかな展開を示す接続辞として、逆接を強めず、直前の文脈から演説への移行を自然に示す。
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: アレオパゴスの中央に
  rationale: 字義どおりの場所的表現を保ち、「評議会の前で」と解釈的に限定することを避けた。
- source_word: Ἀρείου Πάγου
  choice: アレオパゴス
  rationale: ギリシア語の固有名を現代日本語で一般的な音写にし、ラテン文化由来の別称に置き換えなかった。
- source_word: ἔφη
  choice: 言った
  rationale: 物語中の発言導入として簡潔で自然な現代日本語にした。
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: アテネの皆さん
  rationale: 呼びかけの力を自然な日本語で表した。原文のἄνδρεςは男性形だが、この公的な聴衆への定型的呼称を「男たち」とすると現代日本語では不自然で、不要に性別を強調するため避けた。
- source_word: κατὰ πάντα
  choice: あらゆる点で
  rationale: 観察の範囲が全面的であることを、自然かつ明確に表す。
- source_word: ὡς
  choice: と
  rationale: θεωρῶが認識した内容を導く形として、日本語の引用助詞「と」で自然に構成した。
- source_word: δεισιδαιμονεστέρους
  choice: 非常に信心深い
  rationale: 肯定的な「信心深い」と否定的な「迷信深い」の両義性を持ち得る比較級である。本文では演説冒頭の修辞的な含みを保つ比較的中立な表現を採り、否定的・比較的な可能性は脚注に示した。
- source_word: θεωρῶ
  choice: 見受けます
  rationale: 観察に基づく判断を表す動詞の意味と、公的演説にふさわしい丁寧で自然な語調を両立させた。
theological_decisions:
- issue: パウロがアテネ人の宗教性をどう評価しているか（δεισιδαιμονεστέρουςの語調）
  choice: 本文では比較的中立ないし肯定的な「非常に信心深い」とする
  alternative: 「迷信深い」または「ほかの人々以上に信心深い」
  rationale: このギリシア語は肯定的にも否定的にも解し得て、文脈上も演説冒頭の修辞的な慎重さがある。本文で非難と断定せず、本来の神学的・修辞的な緊張を脚注とともに保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、公的演説にふさわしい品位を保った。「見受けます」によって丁寧な演説調を示し、過度に古風な呼格や文語表現は避けた。
