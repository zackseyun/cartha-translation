id: ACT.17.17
reference: Acts 17:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: ja
  text: そこでパウロは、会堂ではユダヤ人や神を敬う人々[a]と論じ合い、また広場[b]では毎日、そこに居合わせた人々と論じ合っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を畏れる人々」とも訳せる。ここでは、ユダヤ教の礼拝に加わっていた異邦人を指す。
    reason: lexical_alternative
  - marker: b
    text: この「広場」（アゴラ）は、売買の場所であるだけでなく、人々が集まる公共の市民空間でもあった。
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: 論じ合っていた
  rationale: 未完了過去が示す継続・反復と、対話しつつ論証する意味の両方を表す。「議論していた」より対話性を保ち、「話し合っていた」より論証的な含みを伝える。
- source_word: μὲν οὖν
  choice: そこで
  rationale: 前の文脈を受けて話を進める接続を、現代日本語として自然に示す。
- source_word: ἐν τῇ συναγωγῇ
  choice: 会堂では
  rationale: ここではユダヤ人の礼拝と教育の場である会堂を指す。対照を示す μὲν と後続の市場との対応を「では」で表した。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人
  rationale: この文脈ではユダヤ地方出身者に限定せず、会堂にいたユダヤ人共同体を指す。
- source_word: τοῖς σεβομένοις
  choice: 神を敬う人々
  rationale: 原文では目的語が明記されないが、使徒言行録における用法と会堂の文脈から「神」を補う。「敬う」は礼拝・崇敬の意味を自然に伝え、技術的呼称に限定しすぎない。
- source_word: ἐν τῇ ἀγορᾷ
  choice: 広場では
  rationale: ἀγορά は売買の場所であると同時に、市民が集まる公共空間でもあった。「市場」だけでは商業施設の印象に狭まりやすいため「広場」とし、文化的背景を脚注で補う。
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: 毎日
  rationale: 日ごとの反復を明快で自然な現代日本語で表す。語順上、この句は広場での活動に結び付けた。
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: そこに居合わせた人々と
  rationale: 偶然その場にいた、またはそこで出会った人々という広い意味を保つ。「通行人」では対象を狭めすぎる。
theological_decisions:
- issue: τοῖς σεβομένοις の暗黙の目的語と集団の性格
  choice: 本文を「神を敬う人々」とし、脚注でユダヤ教の礼拝に加わっていた異邦人を指す用法を説明する。
  alternative: 「神を畏れる人々」または「敬虔な人々」
  rationale: 原文に θεόν はないものの、使徒言行録の会堂文脈では神を崇敬する非ユダヤ人を指す定着した用法である。本文は普通の読者に意味が通じる表現とし、呼称の含みは脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、会堂と広場の対照が見える文型にした。未完了過去は「論じ合っていた」で継続・反復を示し、文体は平易だが聖書本文としての品位を保った。
