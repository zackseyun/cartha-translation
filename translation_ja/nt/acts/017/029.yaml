  source_fidelity: 原文の論理（οὖν）、理由を表す分詞（ὑπάρχοντες）、および「考えるべきではない」という義務的否定は保たれています。しかし本文の「金や銀や石、すなわち…像」は、素材の列挙と人の技術・考案による彫像との関係がやや不明瞭です。また「神たるもの」は現代標準日本語としてやや不自然です。
  naturalness: 「私たちは神の子孫なのですから」は「である」が省かれているため、丁寧体として少し収まりがよくありません。「神の子孫であるのですから」とするのが自然です。「神という存在」はτὸ θεῖονの哲学的で広い語調を保ちながら、現代日本語として明瞭です。
