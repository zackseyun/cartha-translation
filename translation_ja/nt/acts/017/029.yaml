id: ACT.17.29
reference: Acts 17:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: ja
  text: ですから、私たちは神の子孫であるのですから、神という存在[a]を、金や銀や石で、人間の技術と考案によって作られた彫像[b]に似たものと考えるべきではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神性」「神的なもの」。ギリシア語は広く神的なものを指す表現で、ここではパウロの議論における真の神を指す。
    reason: lexical_alternative
  - marker: b
    text: または「刻まれたもの」「彫刻」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: 子孫
  rationale: 神に由来する者としての人間という文脈上の関係を表し、民族的な「種族」や狭い家族関係を避ける。
- source_word: οὖν
  choice: ですから
  rationale: 直前の引用と議論から導かれる結論であることを、明瞭で自然な現代日本語で示す。
- source_word: ὑπάρχοντες
  choice: なのですから
  rationale: この分詞は文脈上、理由を示すと解されるため、因果関係を自然に表す。
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: 考えるべきではありません
  rationale: 単なる不可能性ではなく、そう考えることの不適切さを示す義務表現を保つ。
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: 金や銀や石
  rationale: 原文に列挙された三つの素材をそのまま明示する。
- source_word: χαράγματι
  choice: 刻まれた像
  rationale: 彫刻・刻印によって作られた物という意味を、偶像制作の文脈に即して明瞭に表す。
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: 人間の技術と考案によって
  rationale: 制作の技能と、心に思い描いて設計する働きの両面を保つ。「考案」は単なる空想より制作意図に適する。
- source_word: τὸ θεῖον
  choice: 神たるもの
  rationale: 神的存在・神性を指す幅のある中性名詞を、真の神を論じる文脈に置きながら、過度に人格化または抽象化せず表す。
theological_decisions:
- issue: 哲学的な語調を持つ τὸ θεῖον の訳し方
  choice: 神たるもの
  alternative: 神性／神という存在
  rationale: パウロが異教的背景を持つ聴衆にも通じる広い表現を用いつつ真の神を指しているという緊張を保つ。「神性」だけでは性質に限定されやすく、「神という存在」は人格的意味を強めるため、本文では幅を残した。
- issue: 神の γένος であるという表現
  choice: 神の子孫
  alternative: 神の一族／神から出た者
  rationale: 人間が神と同質である、または神々であるという主張に訳文で解消せず、直前の詩的引用を受けた由来・親縁の比喩を保つ。
translation_notes:
  register: 丁寧体による明瞭で格調ある現代標準日本語。アレオパゴス演説の論理的・哲学的な語調を保ちつつ、専門用語や古語を避けた。すべての脚注標識を本文中に配置した。
