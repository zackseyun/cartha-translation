  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: ja
  text: ところが、彼らを見つけられなかったので、ヤソンと何人かの兄弟たち[a]を町の役人たち[b]の前に引きずって行き、叫んだ。「世界[c]をかき乱してきた者たちが、ここにも来ている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ここではイエスを信じる仲間を指す。文脈によっては女性も含み得る表現である。
    reason: lexical_alternative
  - marker: b
    text: 原語は「ポリタルケス」。マケドニア地方で用いられた、都市の行政官を指す称号である。
    reason: cultural_note
  - marker: c
    text: 直訳は「人の住む世界」。当時知られていた文明世界、とりわけローマ世界を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες δὲ αὐτοὺς
  choice: しかし、彼らを見つけられなかったので
  rationale: アオリスト分詞が主動作に先立つ事情を示すため、自然な理由・状況表現とした。δέは直前との展開を示す「しかし」で表した。
- source_word: ἔσυρον
  choice: 引きずって行き
  rationale: σύρωが持つ、力ずくで引っ張るという身体的・強制的な響きを保った。
- source_word: τινας ἀδελφοὺς
  choice: 兄弟たち数人
  rationale: 信仰共同体の仲間を指す用法だが、原文の親族語の比喩を残した。日本語では「数人の兄弟たち」より「兄弟たち数人」が自然である。
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: 町の役人たちの前へ
  rationale: πολιτάρχηςはマケドニア地方の都市行政官の称号。固有の称号を音写せず、その公的機能を明瞭に伝えた。ἐπίの移動と出頭の含意を「前へ」で表した。
- source_word: βοῶντες
  choice: こう叫んだ
  rationale: 大声で公然と訴える動作を、簡潔で力強い現代日本語にした。
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: 世界中を騒がせてきた者たち
  rationale: ἀναστατόωの社会をかき乱し騒動を起こす意味を保ちつつ、日本語で誤解されやすい直訳的な「世界をひっくり返す」は避けた。完了的な結果が現在まで及ぶ告発の調子を「てきた」で示した。
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: 者たちが、ここにも来ています
  rationale: πάρειμιの到来後そこにいるという意味を自然に表し、καίを「にも」として、騒ぎがこの町にまで及んだという告発の強調を保った。
