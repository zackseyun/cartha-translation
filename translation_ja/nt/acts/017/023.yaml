revisions:
- from: というのも、私は町を巡りながら、あなたがたの礼拝の対象をよく見ているうちに、「知られざる神に」と刻まれた祭壇まで見つけたからです。そこで、あなたがたが知らずに礼拝しているもの、それを私はあなたがたに告げ知らせます。
  to: というのも、私は通りながら、あなたがたの礼拝の対象を注意深く見て回っていると、「知られていない神に」と刻まれた祭壇まで見つけたからです。そこで、あなたがたが知らずに礼拝しているもの、それを私はあなたがたに告げ知らせます。
  rationale: 原文の構文と強調を保ったまま、移動と観察の場面を自然な現代日本語に整えた。「もの、それを」によりὃ…τοῦτοの中性・前置強調を維持し、「知られていない神に」により銘文の定・不定を日本語で決めつけないようにした。
