id: ACT.17.23
reference: Acts 17:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: ja
  text: というのも、私は通りながら、あなたがたの礼拝の対象を注意深く見て回っていると、「知られていない神に」と刻まれた祭壇まで見つけたからです。そこで、あなたがたが知らずに礼拝しているもの、それを私はあなたがたに告げ知らせます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενος
  choice: 町を巡りながら
  rationale: 現在分詞の継続的な動作を自然な日本語で表した。文脈上、アテネ市内を通って見て回ることを指すため「町を」を補った。
- source_word: ἀναθεωρῶν
  choice: よく見ている
  rationale: 単に目に入るのでなく、注意深く観察する意味を「よく見る」で明瞭にした。
- source_word: τὰ σεβάσματα ὑμῶν
  choice: あなたがたの礼拝の対象
  rationale: 崇敬される宗教的事物を広く指す語であり、「神殿」「偶像」などに狭めず訳した。
- source_word: βωμὸν
  choice: 祭壇
  rationale: 宗教的供犠・奉献のための altar を表す標準的な訳語。
- source_word: ἐπεγέγραπτο
  choice: 刻まれた
  rationale: 祭壇上の銘文にふさわしい日本語とし、過去完了的な先行性は文脈上自然に伝わる形にした。
- source_word: Ἀγνώστῳ θεῷ
  choice: 知られざる神に
  rationale: 奉献銘の簡潔で荘重な調子を保った。冠詞のないギリシア語は日本語では定・不定を明示せず自然に保持できる。
- source_word: ὃ οὖν
  choice: そこで、…もの、それを
  rationale: οὖνの推論的な展開を「そこで」で示し、中性関係代名詞ὃを人格化せず「もの」とした。
- source_word: ἀγνοοῦντες
  choice: 知らずに
  rationale: 分詞が礼拝の仕方・状況を示すことを簡潔に表し、「知られざる」との修辞的つながりも保った。
- source_word: εὐσεβεῖτε
  choice: 礼拝している
  rationale: 宗教的な敬虔・崇敬を実践する意味を、この文脈で最も明瞭な現代日本語にした。
- source_word: καταγγέλλω
  choice: 告げ知らせます
  rationale: 公に宣言し伝える意味を、硬すぎず dignified な表現で示した。
theological_decisions:
- issue: 中性関係代名詞ὃの指示対象
  choice: 「あなたがたが知らずに礼拝しているもの」と非人格的に訳す
  alternative: 「あなたがたが知らずに礼拝している方」
  rationale: 原文は中性関係代名詞を用いており、この時点で指示対象を明示的に人格化していない。パウロの修辞的な出発点と神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、演説としての品位を保った。「知られざる神に」は祭壇銘らしい簡潔さを優先し、「もの、それを」で原文の前置・強調構文を再現した。
