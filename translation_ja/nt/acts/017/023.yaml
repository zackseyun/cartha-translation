    issue: διερχόμενοςの「町を巡りながら」
    rationale: アテネという文脈には合うが、原語は単に通り過ぎる・通って行くことを述べており、「町を巡る」はわずかに具体化している。
  - severity: low
    issue: 「よく見ているうちに」の表現
    rationale: 原文の二つの現在分詞が表す移動と注意深い観察の同時性を、日本語としてより自然に表せる。
  - severity: low
    issue: 「知られざる神に」の現代性
    rationale: 不正確ではないが文語的である。対象方針の明瞭な現代標準日本語には「知られていない神に」がより適する。
  revised_text: というのも、私は通りながら、あなたがたの礼拝の対象を注意深く見て回っていると、「知られていない神に」と刻まれた祭壇まで見つけたからです。そこで、あなたがたが知らずに礼拝しているもの、それを私はあなたがたに告げ知らせます。
