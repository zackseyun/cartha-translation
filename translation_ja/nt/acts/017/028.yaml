id: ACT.17.28
reference: Acts 17:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: ja
  text: 「私たちはこの方のうちに生き、動き、存在しているからです。あなたがたの詩人の中にも、こう言った人たちがいます。『私たちもまた、この方の子孫なのですから。』」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: この方のうちに
  rationale: 直前の神を指す代名詞を、敬意を保ちながら明確にした。「うちに」は、場所だけでなく、神に依存する生の領域・基盤という原文の幅を保つ。
- source_word: ζῶμεν καὶ κινούμεθα καὶ ἐσμέν
  choice: 生き、動き、存在している
  rationale: 三つの並列を保ち、ἐσμένを単なる繋辞ではなく絶対的用法の「存在している」と訳した。
- source_word: τινες τῶν καθ’ ὑμᾶς ποιητῶν
  choice: あなたがたの詩人の中にも……人たち
  rationale: τινεςの複数性と不特定性、およびκαίの「～も」を自然な日本語で示した。καθ’ ὑμᾶςは聴衆側に属する詩人という意味で「あなたがたの詩人」とした。
- source_word: γένος
  choice: 子孫
  rationale: ここでは神に由来する一族・血統という詩的表現であり、「子孫」が引用文として自然である。ただし、生物学的な神性の継承を説明的に付加しない。
theological_decisions:
- issue: 「この方のうちに」の意味
  choice: 神への存在的依存を含み得る表現をそのまま保持する
  alternative: 「この方によって」または「この方のおかげで」
  rationale: ἐν αὐτῷを因果・手段だけに限定せず、パウロの表現が持つ空間的・関係的・存在論的な幅を残した。
- issue: 「子孫」の神学的含意
  choice: 詩人からの引用を説明せず、そのまま「子孫」とする
  alternative: 「神の子ども」または「神によって造られた者」
  rationale: γένοςの比喩的・詩的緊張を保ち、人間が神と同質である、または救済上の意味で神の子であるとの解釈を訳文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、演説としての格調を保った。引用符で詩人の言葉を明示し、原文の三項並列と論証の流れを維持した。
