source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: ja
  text: 彼らのうち何人かは説得されて、パウロとシラスに加わった。さらに、神を敬うギリシア人が大勢、また有力な女性も少なくない数が、パウロとシラスに加わった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には、「パウロとシラスに割り当てられた」。ここでは、彼らの側についた、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: 彼らのうちの何人か
  rationale: 部分を表す表現を自然な現代日本語で示し、前節の会堂の聴衆を受ける形を保った。
- source_word: ἐπείσθησαν
  choice: 説得され
  rationale: πιστεύωではなくπείθωが使われているため、「信じた」と明示せず、受動形と語彙上の区別を保った。
- source_word: προσεκληρώθησαν
  choice: 加わった
  rationale: パウロとシラスの側に結び付けられ、仲間となったという文脈上の意味を、明瞭で自然な日本語にした。
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: パウロとシラスに
  rationale: 動詞との関係を示す与格を、日本語の「に」で自然に表した。
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: 神を敬うギリシア人
  rationale: 使徒言行録で、イスラエルの神を礼拝しユダヤ教の会堂に関わっていた異邦人を指す文脈的意味を、過度な専門用語を避けて表した。
- source_word: πλῆθος πολὺ
  choice: 大勢
  rationale: 人数が多いことを簡潔で自然な現代日本語にした。
- source_word: γυναικῶν τε τῶν πρώτων
  choice: 身分の高い女性
  rationale: πρῶτοςがここでは時間的な「最初」ではなく、社会的地位や有力さを指すことを示した。
- source_word: οὐκ ὀλίγαι
  choice: 少なくなかった
  rationale: ルカの婉曲的な強調を平板な「多く」にせず、その修辞を保った。
- source_word: τε ... τε
  choice: また…も…、…も
  rationale: 最初の集団に二つの集団を付加する構造を、日本語として読みやすく示した。
theological_decisions:
- issue: ἐπείσθησανを回心や信仰を明示する語で訳すか
  choice: 説得され
  alternative: 信じた／納得した
  rationale: 宣教への応答という文脈は認めつつも、原文はπιστεύωではなくπείθωであるため、語彙上の緊張を保ち、明示的な信仰語を補わなかった。
- issue: σεβομένων Ἑλλήνωνの宗教的立場をどこまで明示するか
  choice: 神を敬うギリシア人
  alternative: 敬虔なギリシア人／神を礼拝するギリシア人
  rationale: 対象となる神が原文では明示されない一方、使徒言行録の会堂文脈ではイスラエルの神を敬う異邦人を指す。日本語では目的語なしの「敬う」が不自然なため、文脈上の対象を最小限に明示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「説得され」は原文の受動形と語彙を保つ。「身分の高い」は社会的卓越性を表し、「少なくなかった」は原文の婉曲表現を維持する。
