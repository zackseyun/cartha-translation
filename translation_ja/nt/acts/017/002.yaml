  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: ja
  text: パウロはいつものように[a]彼らのところに入り、三度の安息日にわたって[b]、聖書に基づいて彼らと論じ合った[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「パウロの習慣に従って」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「三度の安息日に」。
    reason: lexical_alternative
  - marker: c
    text: または「彼らと話し合った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: パウロはいつものように
  rationale: κατάとεἴωθαの完了分詞による慣用表現が示す、パウロの確立した習慣を、自然で明瞭な現代日本語で表した。
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: 彼らのところに入り
  rationale: εἰσέρχομαιの入るという移動の意味と、πρὸς αὐτούςの方向性を保った。会堂という場所は直前の文脈で分かるが、本節には明記されていないため補わなかった。
- source_word: ἐπὶ σάββατα τρία
  choice: 三回の安息日にわたって
  rationale: 三つの安息日の機会に及ぶ時間的・反復的な広がりを明確にし、三日連続との誤解を避けた。
- source_word: διελέξατο
  choice: 論じ合った
  rationale: διαλέγομαιがここで表す、理由を示しながら相手と応答的に議論する行為を簡潔に表した。敵対的な口論に限定せず、単なる一方的説教にもしていない。
- source_word: ἀπὸ τῶν γραφῶν
  choice: 聖書に基づいて
  rationale: ἀπόが示す、聖書を議論の出発点・根拠とする意味を自然な日本語で表した。複数形γραφαίは文脈上、権威ある聖なる文書群を指す。
theological_decisions:
- issue: 会堂での活動における「彼ら」の指示対象
  choice: 本文では「彼ら」を保持する
  alternative: 「会堂に入った」または「そこにいたユダヤ人たちのところに行った」と明示する
  rationale: 直前の文脈から会堂とその集まりが指示対象だと分かるが、本節自体は代名詞を用いる。本文にない対象を限定せず、原文の照応関係を保った。
- issue: διαλέγομαιの行為の性質
  choice: 「論じ合った」とし、相互的で理由に基づく議論を表す
  alternative: 「説教した」または「言い争った」
  rationale: 原語は対話・論証を含み得るが、一方的な説教や敵対的口論のいずれかに限定してはいないため、その幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「安息日」「聖書」は一般的な聖書用語として保持した。「論じ合った」により論証性と対話性を両立させ、過度に敵対的な響きを避けた。
