  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: ja
  text: あなたは、私たちの耳に耳慣れないことをいくつか持ち込んでいるからです。[a] ですから、これらが何を意味するのかを、私たちは知りたいのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「いくつか異質なこと」「いくつか珍しいこと」。ギリシア語は、聞き手にとって新しい、または異質であるために耳慣れないものを表し得る。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の表現は逐語的には「これらは何であろうとするのか」に近い。ここでは「これらが何を意味するのか」「どのような意味を持つのか」という慣用的な言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: 何か耳慣れないこと
  rationale: 聞き手にとって新奇・異質であるという意味を自然な現代日本語で表し、不定の τινα も「何か」によって保持する。
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: 私たちの耳に……持ち込んでいる
  rationale: 「耳へ運び入れる」という原文の身体的比喩を保ちつつ、日本語として理解できる表現にする。
- source_word: βουλόμεθα οὖν γνῶναι
  choice: そこで……私たちは知りたいのです
  rationale: οὖν の推論的なつながりを「そこで」で示し、βούλομαι と γινώσκω の意志と認識の意味を平明に訳す。
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: それが何を意味するのか
  rationale: 字義的には「これらが何であろうとしているのか」だが、ここでは話の意味・趣旨を問う慣用表現として訳す。
- source_word: γάρ
  choice: からです
  rationale: 前節の問いの理由を説明する接続関係を日本語の文末表現で明示する。
