id: ACT.17.10
reference: Acts 17:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: ja
  text: 兄弟たち[a]はすぐに、夜のうちに[b]パウロとシラスの二人をベレアへ送り出した。二人は到着すると、ユダヤ人の会堂[c]に入って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、より広い信仰共同体を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「夜に」。夜間に行われたことを表す。
    reason: lexical_alternative
  - marker: c
    text: 「ユダヤ人の会堂」は、「ユダヤ教の会堂」とも訳せる。ここではベレアのユダヤ人共同体の会堂を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: 兄弟たち
  rationale: 原文の男性複数形と、信仰共同体の家族的な呼称を保った。文脈上は女性を含む共同体全体を指す可能性があるため、脚注で示した。
- source_word: εὐθέως
  choice: すぐに
  rationale: 行動の迅速さを、明瞭で自然な現代日本語で表した。
- source_word: διὰ νυκτός
  choice: 夜のうちに
  rationale: 夜間に送り出したという時間的意味を自然に表し、「夜通し」という不要な含意を避けた。
- source_word: ἐξέπεμψαν
  choice: 送り出した
  rationale: ἐκπέμπωの「外へ送り出す」という意味を保ちつつ、危険から逃がしたことまでは訳文に付加しなかった。
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: パウロとシラスの二人
  rationale: τε…καίが両名を明示する働きを「二人」で自然に表した。
- source_word: Βέροιαν
  choice: ベレア
  rationale: 地名を日本語の聖書で広く用いられる形に音写した。
- source_word: οἵτινες παραγενόμενοι
  choice: 二人は到着すると
  rationale: 関係代名詞と分詞が示す主語の継続および出来事の時間的順序を、自然な日本語の叙述にした。
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: ユダヤ人の会堂
  rationale: 属格構文を明瞭に保ち、ベレアのユダヤ人共同体の会堂を指す表現とした。
- source_word: ἀπῄεσαν
  choice: 入って行った
  rationale: εἰςが示す会堂の中への移動を日本語で明示した。未完了過去の細かな相的ニュアンスは、ここでは通常の物語進行として自然に訳した。
theological_decisions:
- issue: 混成共同体を指し得るἀδελφοὶの訳
  choice: 兄弟たち
  alternative: 兄弟姉妹／信者たち
  rationale: 原文の男性複数形と家族的比喩を本文で保持した。一方、文脈上は女性を含む信仰共同体を指し得るため、その包摂的な可能性を脚注に残した。
- issue: τῶν Ἰουδαίωνの表現
  choice: ユダヤ人の
  alternative: ユダヤ教の
  rationale: 原文の民族・共同体を表す属格をそのまま示した。この句は当地の会堂共同体を特定するものであり、否定的な神学的評価を加えるものではない。
translation_notes:
  register: 明瞭で現代的ながら、聖書叙述にふさわしい落ち着いた文体とした。「兄弟たち」「ユダヤ人の会堂」は原文に近い表現を本文に置き、現代の読者が誤解し得る点を脚注で補った。
