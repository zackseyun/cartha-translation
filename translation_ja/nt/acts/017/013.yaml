id: ACT.17.13
reference: Acts 17:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: ja
  text: ところが、テサロニケのユダヤ人たちは、ベレアでもパウロによって神のことばが宣べ伝えられたことを知ると、そこにもやって来て、群衆を扇動し、混乱させた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: ところが、…知ると
  rationale: δέによる直前との緩やかな対照と、ὡςの時を示す働きを、自然な日本語の従属構文で表した。
- source_word: ἔγνωσαν
  choice: 知ると
  rationale: γινώσκωのアオリストは、ここでは情報を得て知るに至ったことを指す。
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: テサロニケから来たユダヤ人たち
  rationale: 出身地または来訪元によって限定された特定の集団であり、ユダヤ人一般を指すとの誤解を避ける。
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: ベレアでも
  rationale: καίが追加の場所を示し、テサロニケだけでなくベレアでも宣教が行われたことを表す。
- source_word: κατηγγέλη
  choice: 宣べ伝えられた
  rationale: καταγγέλλωの受動形が示す公の告知を、聖書文脈に適しつつ現代日本語でも理解できる表現にした。
- source_word: ὑπὸ τοῦ Παύλου
  choice: パウロによって
  rationale: 受動構文における行為者を明示するὑπό＋属格をそのまま反映した。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 神からの宣べ伝えられる知らせという意味を保ち、λόγοςを単に一般的な『話』へ狭めない定着した表現を採用した。
- source_word: ἦλθον κἀκεῖ
  choice: そこにもやって来て
  rationale: κἀκεῖの『そこにも』という追加の意味を保ち、反対活動がベレアにまで及んだことを自然に示す。
- source_word: σαλεύοντες
  choice: 扇動し
  rationale: 人々を揺さぶって公の不穏を引き起こす文脈上の意味を簡潔に表す。
- source_word: καὶ ταράσσοντες
  choice: 騒ぎ立たせた
  rationale: σαλεύωと重なりながらも、混乱や動揺を生じさせる第二の動作として訳し分けた。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: ὄχλοιを中立的に表し、『暴徒』のような原文以上の評価を加えない。
theological_decisions:
- issue: ὁ λόγος τοῦ θεοῦの訳し方
  choice: 神のことば
  alternative: 神からの知らせ
  rationale: 神に由来する宣教の内容という文脈と、この句が持つ神学的な響きの双方を保ちつつ、後代の限定的な専門概念を持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文としての品位を保った。『ユダヤ人たち』は『テサロニケから来た』によって明確に限定した。二つの現在分詞は、日本語では主動詞に連なる二つの行為として『扇動し、騒ぎ立たせた』とした。注を要するほど重大な本文上・意味上の曖昧さはないため、脚注は付していない。
