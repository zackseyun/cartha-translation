source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: ja
  text: 神を求めさせるためでした。もしかすると、手探りで神を捜し求め[a]、見いだすかもしれません。しかし実際、神は私たち一人ひとりから遠く離れてはおられません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手探りで捜し求め」は、暗闇や限られた知覚の中で、触れて探すというギリシア語の比喩を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν τὸν θεόν
  choice: 神を求めさせるためでした
  rationale: 不定詞が前節に続いて神の目的を表すことを、文脈上独立して読める自然な日本語にした。定冠詞は日本語では明示しない。
- source_word: εἰ ἄρα γε
  choice: もしかすると……ことがあるかもしれません
  rationale: 人が神を見いだすことについての試行的・不確定な響きを保つ。
- source_word: ψηλαφήσειαν αὐτόν
  choice: 手探りで神を捜し求め
  rationale: ψηλαφάω が持つ、限られた知覚の中で触れて探る比喩を自然な現代日本語で表した。目的語を「神」と反復し、代名詞による曖昧さを避けた。
- source_word: καὶ εὕροιεν
  choice: 見いだすことがあるかもしれません
  rationale: ψηλαφήσειαν と並ぶ希求法の不確定性を保ちつつ、格調ある自然な表現とした。
- source_word: καί γε
  choice: しかし実際
  rationale: 人間の手探りとは対照的に神の近さを断言する、譲歩的かつ強意的な移行を示した。
- source_word: οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: 私たち一人ひとりから遠く離れてはおられません
  rationale: ἑνὸς ἑκάστου の個別的・配分的強調を「一人ひとり」で保ち、οὐ μακράν を自然な敬体で表した。
- source_word: ὑπάρχοντα
  choice: おられません
  rationale: 神が現実に遠くないという分詞の叙述的意味を、日本語の有限述語として表した。
theological_decisions:
- issue: 神への人間の探求と神の近さ
  choice: 「もしかすると」「手探りで」によって人間の認識の限界と探求の不確かさを保ち、「しかし実際」によって神が近いという確言を対置した。
  alternative: 探求の比喩を弱めて「神を求め、見いだすため」と滑らかに訳す。
  rationale: 原文は、人間が手探りする不確かさと、神が各人から遠くないという事実を同時に述べる。どちらか一方を弱めず、その神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語の敬体。神については自然な敬意を示す「おられません」を用いた。原文が前節から続く不定詞句であるため、冒頭を「神を求めさせるためでした」として文脈との連続性を明示した。脚注記号は対応する概念を含む文末に置いた。
