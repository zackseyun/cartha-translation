source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: ja
  text: そのとき、兄弟たちはすぐにパウロを海まで行かせるために送り出した[b][a]。一方、シラスとテモテは二人ともそこにとどまった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、信者たちを集合的に指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「海へ」または「海の方へ」とも訳せる。ギリシア語の表現は、海岸までの移動を示す可能性があるが、それ以上の行程は明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: そこで……すぐに
  rationale: 物語の時間的展開と行動の迅速さを、現代日本語として自然に表す。
- source_word: ἐξαπέστειλαν
  choice: 送り出した
  rationale: その場所から出発させたという複合動詞の含みを、簡潔で自然な日本語で表す。
- source_word: οἱ ἀδελφοὶ
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を本文で保持する。この語が信者共同体を集合的に指し、女性を含み得ることは脚注で示す。
- source_word: πορεύεσθαι
  choice: 行かせるために
  rationale: 送った目的を表す不定詞として構文上の関係を明確にする。
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: 海辺まで
  rationale: 海そのものではなく海岸までの移動を示し得る表現として、ἕωςの到達限界を保ちつつ自然な日本語にする。移動方向・到達点に関する幅は脚注に残す。
- source_word: ὑπέμεινάν
  choice: とどまった
  rationale: ここでは苦難に耐える意味ではなく、その場所に引き続き滞在する意味である。
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: シラスとテモテは二人とも
  rationale: τε……καὶの対をなす強調を、日本語の「二人とも」で明瞭に表す。
- source_word: ἐκεῖ
  choice: そこに
  rationale: 直前までの場所を指す標準的な場所表現。
theological_decisions:
- issue: 信者共同体を指すἀδελφοίの訳し方
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性複数形を本文に反映しながら、文脈上は女性を含む信者たち全体を指し得ることを脚注で明示し、範囲を不当に限定しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ。「海辺まで」により原文の到達範囲を自然に示し、曖昧さは脚注で保存した。脚注記号は英語版の対応を保つため本文中で[b][a]の順とした。
