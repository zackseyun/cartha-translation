  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: ja
  text: 神は、一人の人からあらゆる民族を造り、全地の上に住まわせ、あらかじめ定められた時期と、彼らの居住地の境界とをお定めになりました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「一人から」ではなく「一つの血から」としています。本文はSBLGNTの「一人から」という読み方に従い、日本語として意味を明確にするため「人」を補っています。
    reason: textual_variant
  - marker: b
    text: 別訳「彼らのために定められた時期」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: 造り出し
  rationale: 文脈上、神が一つの起源から諸民族を生じさせたことを表す。「創造し」ほど無からの創造に限定せず、ποιέωの広い意味を保つ。
- source_word: ἐξ ἑνὸς
  choice: 一人の人から
  rationale: ギリシア語は直訳すれば「一人から」。日本語では人間を指すことを自然に明示しつつ、「血」という異読は本文に取り入れない。
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: あらゆる民族
  rationale: ἔθνοςの複数の民・民族という意味を保ち、ἀνθρώπωνは文脈上自明なため、不自然な「人間のあらゆる民族」とはしない。
- source_word: κατοικεῖν
  choice: 住まわせました
  rationale: ποιέωに依存する不定詞を使役的な構文として自然な日本語にし、人々が地上に居住するようにされた意味を表す。
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: 地の全面に
  rationale: πρόσωπονの「面・表面」という比喩を簡潔に保ち、παντόςを「全面」で表す。
- source_word: ὁρίσας
  choice: お定めになりました
  rationale: 時期と境界を設定する神の行為を表す。敬語は日本語の聖書文体として主語である神への自然な敬意を示す。
- source_word: προστεταγμένους καιρούς
  choice: それぞれに定められた時期
  rationale: καιροίを意味ある時期・期間として訳し、分詞の「指定された、定められた」を保持する。「それぞれに」は諸民族との関係を文脈から補う。
- source_word: τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν
  choice: その居住地の境界
  rationale: ὁροθεσίαの地理的な境界設定を「境界」、κατοικίαを簡潔な「居住地」で表す。単数形の集合的用法も自然な日本語にする。
theological_decisions:
- issue: ἐξ ἑνὸςで省略されている指示対象を明示するか
  choice: 一人の人から
  alternative: 一人から／一人の祖先から
  rationale: 本文は「血」を含まないため異読を採用しない。一方、日本語の「一人の人」は人類の共通の起源を明瞭にしながら、特定人物の名や追加の解釈を持ち込まない。
- issue: 神が定めた「時期」と「境界」の関係
  choice: それぞれに定められた時期と、その居住地の境界とをお定めになりました
  alternative: 彼らのために時期と居住地の境界を定めました
  rationale: προστεταγμένουςが直接修飾するのはκαιρούςであることを保ちつつ、ὁρίσαςが時期と境界の双方にかかる構造も示す。神の摂理が具体的に何を意味するかは本文以上に限定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、演説中の神について述べる箇所にふさわしい品位を保った。「地の全面」は原文の聖書的比喩を残しつつ理解可能な表現とした。
