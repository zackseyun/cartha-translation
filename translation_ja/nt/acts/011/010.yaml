  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: ja
  text: このことが三度起こり、そして、すべてが再び天へ引き上げられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「すべてが再び天に取り上げられた」。
    reason: ἀνεσπάσθη の「取り上げられた」という訳語の可能性と、ἅπαντα の包括的で限定しない意味を示すため。
lexical_decisions:
- source_word: τοῦτο
  choice: このこと
  rationale: 直前に述べられた幻の出来事を指す。「幻」と明示せず、指示語の範囲を保った。
- source_word: δὲ
  choice: そして（「その」の前の接続として表現）
  rationale: 物語を穏やかにつなぐ接続辞であり、日本語では後半を「そのすべてが」と続けることで自然に接続関係を表した。
- source_word: ἐγένετο
  choice: あり
  rationale: 出来事が生じたことを表す。ここでは反復との結びつきが自然な「三度あり」とした。
- source_word: ἐπὶ τρίς
  choice: 三度
  rationale: 同じ出来事が三回繰り返されたことを、簡潔で現代的な日本語で示す。
- source_word: ἀνεσπάσθη
  choice: 引き上げられた
  rationale: 外からの力による上方への動きを示す受動態を保ち、動作主は補わなかった。
- source_word: πάλιν
  choice: 再び
  rationale: 先に天から降りて来たものがもう一度上へ移されたという反復・回帰を表す。
- source_word: ἅπαντα
  choice: そのすべて
  rationale: 中性複数の包括性を保ち、「布」や「動物」だけに指示対象を限定しない。
- source_word: εἰς τὸν οὐρανόν
  choice: 天へ
  rationale: εἰς の方向性を「へ」で表し、幻の文脈における οὐρανός を「天」と訳した。
theological_decisions:
- issue: ペトロの幻の報告における ἅπαντα の指示対象
  choice: 「そのすべて」と広く訳し、指示対象を限定しない。
  alternative: 「それは全部」「すべての動物」「布ごと」
  rationale: ギリシア語は包括的だが、この節では何を具体的に指すかを狭く明示していないため、その曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔かつ品位ある調子にした。受動態と指示対象の曖昧さを保持している。
