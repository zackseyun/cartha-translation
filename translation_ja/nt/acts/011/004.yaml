  text: ἀρξάμενος ⸀δὲ Πέτρος ἐξετίθετο αὐτοῖς καθεξῆς λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: ja
  text: そこでペテロは、彼らに事の次第を順を追って[a]、次のように説明し始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「順序立てて」または「一つ一つ順に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: 説明し始めた
  rationale: 主動詞に伴う副詞的なアオリスト中動分詞。日本語では「説明し始めた」と主動詞に組み込み、自然に開始の意味を表した。
- source_word: δὲ
  choice: そこで
  rationale: 直前の非難を受けてペテロが応答する場面への移行を示す。強い対立を加えすぎず、文脈上の応答関係を自然に表す。
- source_word: Πέτρος
  choice: ペテロ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ἐξετίθετο
  choice: 事の次第を…説明し
  rationale: この文脈では、出来事を詳しく述べて明らかにする意。「説明する」を基本とし、目的語が明示されていないため、文脈から「事の次第」を補った。未完了過去の進行的な面は、続く直接話法全体が説明内容となることで伝わる。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: ペテロを非難した直前の人々を指す与格複数代名詞を、そのまま自然な日本語で表した。
- source_word: καθεξῆς
  choice: 順を追って
  rationale: 物事を順序立てて述べる意味を、明瞭で自然な現代日本語で表す。「初めから」と限定せず、語が本来持つ順序性を保持した。
- source_word: λέγων
  choice: （後続する直接話法として表現）
  rationale: 発言内容を導入する現在分詞。日本語では文末の「言った」を重ねず、この節を完結させ、次節以降の直接話法によって機能を表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての落ち着きと品位を保った。「事の次第」は目的語を自然に補い、出来事の経緯を説明する文脈を示す。原文末の λέγων は次節の直接話法へ導くため、日本語では独立した「こう言った」を置かずに処理した。
