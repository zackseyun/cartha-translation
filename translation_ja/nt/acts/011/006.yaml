id: ACT.11.6
reference: Acts 11:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: ja
  text: その中をじっと見つめ、注意深く観察していると、地上の四つ足の動物、野獣、地を這うもの、そして空の鳥を見ました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν
  choice: その中を
  rationale: 直前の入れ物状の大きな布を受ける。ἀτενίζωとともに視線の方向を示し、単に「それを」ではなく内部をのぞき込む場面を自然に表す。
- source_word: ἀτενίσας
  choice: じっと見つめ
  rationale: 集中して視線を注ぐ意味を、明瞭で自然な現代日本語にした。アオリスト分詞の先行動作も保つ。
- source_word: κατενόουν
  choice: よく確かめると
  rationale: 注意深く観察し認識しようとする継続的な働きを表す。直前の「じっと見つめ」との不自然な重複を避けつつ、続くεἶδονと区別した。
- source_word: εἶδον
  choice: 見えました
  rationale: 実際に目にしたことを端的に示す。日本語では「確かめると……見えました」とすることで自然な出来事の進行を表せる。
- source_word: τὰ τετράποδα τῆς γῆς
  choice: 地上の四つ足の動物
  rationale: 語の分類的な表現とτῆς γῆςを保ちつつ、一般読者に分かりやすい語を用いた。
- source_word: τὰ θηρία
  choice: 野獣
  rationale: 野生の獣を指す語として、四つ足の動物という広い分類との区別を簡潔に保つ。
- source_word: τὰ ἑρπετά
  choice: 地を這うもの
  rationale: 「爬虫類」より広い原語の範囲を保ち、創造・清浄規定に見られる聖書的な分類表現も反映する。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: 具体的な動物の列挙なので、τοῦ οὐρανοῦを「空」とし、自然で分かりやすく訳した。
theological_decisions: []
translation_notes:
  register: ペトロが出来事を報告する文脈に合わせ、丁寧体で統一した。列挙には簡潔で dignified な分類語を用い、原文の観察の段階（見つめる、確かめる、見る）が日本語として不自然にならない範囲で伝わるようにした。
