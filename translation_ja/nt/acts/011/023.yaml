source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: ja
  text: 彼は到着し、神の恵み[a]を見て喜び、皆に、心を固く定めて主にとどまる[b]よう励まし続けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の恵み」は、彼らの間に目に見える形で現れた、神の恵み深い働きを指しているとも考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「主にとどまる」は、「主に献身し続ける」または「主に忠実であり続ける」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: 到着して
  rationale: アオリスト分詞が示すバルナバの到着を、自然な現代日本語で表した。
- source_word: ἰδὼν
  choice: 目にすると
  rationale: 通常の視覚表現を保ちつつ、現地で神の働きの現れを認めたという文脈にも自然に合う。
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: 神の恵み
  rationale: 神の恵み深い働きという神学的な含みを保ち、「神がなさったこと」と説明的に限定しなかった。
- source_word: ἐχάρη
  choice: 喜び
  rationale: 動詞の意味を簡潔で品位ある現代日本語にした。
- source_word: παρεκάλει
  choice: 励まし続けた
  rationale: 未完了時制の継続・反復性を「続けた」で示した。παρακαλέωは勧告を含むが、ここでは共同体を支える積極的な働きかけとして「励ます」が自然である。
- source_word: πάντας
  choice: 皆を
  rationale: 文脈上の信者全員を、原文の簡潔さを保って表した。
- source_word: τῇ προθέσει τῆς καρδίας
  choice: 心を固く定めて
  rationale: πρόθεσιςの「決意・意図」と、καρδίαの内面的な意志を、直訳調を避けながら一体的に表した。
- source_word: προσμένειν
  choice: とどまる
  rationale: 与格の「主」と結びつき、主との結びつきを持続する意味を保持した。「献身する」などで解釈を狭めず、継続・忠実という含みを文脈に残した。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: κύριοςを定訳の「主」とし、使徒言行録の文脈で復活したイエスを指す称号をそのまま保った。
theological_decisions:
- issue: 「神の恵み」が文脈で指すもの
  choice: 目に見える形で現れた神の恵み深い働きを含み得る表現として「神の恵み」を保持
  alternative: 「神がなさったこと」「神の好意」
  rationale: 原文は神の働きの証拠を見たことを含意し得るが、単に出来事へ言い換えず、χάριςの神学的な広がりを保った。
- issue: προσμένειν τῷ κυρίῳ の意味
  choice: 主との結びつきを持続する「主にとどまる」
  alternative: 「主に献身し続ける」「主に忠実であり続ける」
  rationale: 継続する結びつき、献身、忠実さのいずれも含み得るため、本文では比較的形式対応的な表現を採り、代案を脚注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「心を固く定めて」により決意の強さを自然に表し、「主にとどまる」により原文が持つ継続的な結びつきと解釈上の幅を保った。句末の読点ではなく日本語として完結する句点を用いた。
