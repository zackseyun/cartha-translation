id: ACT.11.24
reference: Acts 11:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: ja
  text: というのも、彼は善い人で、聖霊と信仰[a]に満ちていたからである。そして、大勢の人々が主に加えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さ」または「信頼」とも訳せる。ギリシア語ピスティスはこれらの意味も持ち得るが、本文では基本的な訳語である「信仰」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からである
  rationale: 直前のバルナバについての記述を説明する接続語として、理由・説明の働きを自然な日本語で表した。
- source_word: ἀνὴρ ἀγαθὸς
  choice: 善い人
  rationale: バルナバの道徳的な資質を表す簡潔な訳。「立派な人」よりも原語の基本的意味を直接保つ。
- source_word: πλήρης πνεύματος ἁγίου
  choice: 聖霊に満ちていた
  rationale: 属格を伴う πλήρης の意味を自然に表し、Luke-Actsでの πνεῦμα ἅγιον を神の聖霊への言及として訳した。
- source_word: πίστεως
  choice: 信仰
  rationale: πίστις の基本的な訳語を採用した。ただし、この人物描写では「忠実さ」の含意も可能なため、脚注で残した。
- source_word: ὄχλος ἱκανὸς
  choice: 大勢の人々
  rationale: ὄχλος の集団性と ἱκανός の相当な数を、明快で自然な現代日本語にした。
- source_word: προσετέθη ... τῷ κυρίῳ
  choice: 主に加えられた
  rationale: 受動態と明示された対象「主に」を保ち、「教会に加わった」と解釈的に置き換えなかった。
theological_decisions:
- issue: πνεύματος ἁγίου の指示対象
  choice: 神の聖霊
  alternative: 聖なる霊、または聖い心的態度
  rationale: Luke-Actsにおける通常の用法と文脈に基づき、人格的な神の聖霊への言及として訳した。
- issue: πίστεως の意味合い
  choice: 信仰
  alternative: 忠実さ、信頼
  rationale: 「信仰」がこの語の基本的で文脈にも適合する訳だが、バルナバの人格描写では「忠実さ」も排除できないため、脚注で曖昧さを示した。
- issue: προσετέθη の結び付く対象
  choice: 人々が主に加えられた
  alternative: 人々が教会・共同体に加えられた
  rationale: 教会共同体への加入は含意され得るが、原文が明記する対象は「主」であるため、その表現を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、説明を表す冒頭の ὅτι は「というのも……からである」とした。聖書的な受動表現「主に加えられた」は、多少独特でも原文の対象を保つため維持した。
