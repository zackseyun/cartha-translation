  yaml_path: translation/nt/acts/011/025.yaml
  text: Then he went out to Tarsus to look for Saul,[a]
translation:
  language: ja
  text: それからバルナバは、サウロを捜すためにタルソスへ出かけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「サウロを捜し出すために」。
    reason: ἀναζητῆσαιは「捜す」を基本とし、文脈によっては捜して見つけ出すという含みをもって訳すこともできる。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 向かった
  rationale: アオリストのἐξέρχομαιは直訳すれば「出て行った」だが、目的地を示すεἰς Ταρσόνと結びついているため、自然な現代日本語で移動を表す「向かった」とした。
- source_word: δὲ
  choice: そこで
  rationale: ここでは強い対比ではなく物語を進める緩やかな接続を表すため、「しかし」ではなく「そこで」とした。
- source_word: εἰς Ταρσόν
  choice: タルソスへ
  rationale: 移動の目的地を示すεἰςを、日本語として自然な方向助詞「へ」で表した。地名は慣用的に「タルソス」と音写した。
- source_word: ἀναζητῆσαι
  choice: 捜し出すために
  rationale: 目的を表す不定詞。ἀναζητέωには単に探すだけでなく、捜して見つけ出そうとする含みがあるため、「捜し出す」とした。
- source_word: Σαῦλον
  choice: サウロ
  rationale: 固有名を日本語聖書で広く用いられる形に音写した。
- source_word: implicit subject
  choice: バルナバは
  rationale: ギリシャ語では動詞の主語が省略されているが、直前の文脈上バルナバである。日本語で単独の節として明瞭に読めるよう補った。
theological_decisions: []
