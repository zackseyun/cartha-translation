  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: ja
  text: そのころ、預言者たちがエルサレムからアンティオキアに下って来た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エルサレムからアンティオキアに下って行った」。ギリシア語の動詞は「下って来た」とも「下って行った」とも訳せる。ここでは到着地を視点として「下って来た」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: そのころ
  rationale: 物語上の時を示す句として、現代日本語で自然かつ簡潔に表した。δέの軽い接続は文脈に委ね、独立した接続語を加えなかった。
- source_word: κατῆλθον
  choice: 下って来た
  rationale: κατέρχομαιの移動と下降の意味を保ちつつ、到着地アンティオキアを視点として自然な日本語の「来た」を用いた。「下って行った」も文法上可能なので注記した。
- source_word: ἀπὸ Ἱεροσολύμων
  choice: エルサレムから
  rationale: ἀπόによる起点を「から」で表した。ギリシア語の地名は形態上複数形だが、日本語では通常の単数地名を用いる。
- source_word: προφῆται
  choice: 預言者たち
  rationale: 初代教会における役割の範囲を狭く規定せず、一般的で伝統的な対応語を用いた。複数形は「たち」で明示した。
- source_word: εἰς Ἀντιόχειαν
  choice: アンティオキアに
  rationale: 都市への移動の到達点を、自然な日本語の助詞「に」で表した。
theological_decisions:
- issue: エルサレムおよびアンティオキアの教会における「預言者」の性格
  choice: προφῆταιを限定せず「預言者たち」と訳す。
  alternative: 預言をする教師たち／霊感を受けた使者たち
  rationale: 本文自体は彼らの務めの厳密な範囲を定義していないため、旧約型の正典的預言者とも、単なる説教者とも決めつけず、神学的な幅を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、短い叙述文としての品位を保った。「アンティオキア」は日本語聖書で広く認知される地名表記。「そのころ」は原文の時間枠を自然に示し、δέを過度に訳出しない。
