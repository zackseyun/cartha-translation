  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: ja
  text: ところが、ペテロがエルサレムに上ると、割礼に属する者たち[a]は彼と言い争っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「割礼からの者たち」。割礼を受けた信者たち、または割礼との結び付きを重んじる人々を指す可能性がある。ギリシア語は、割礼との結び付きによってこれらの人々を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ところが、…すると
  rationale: δέによる物語の展開と軽い対照を「ところが」で示し、ὅτεを日本語として自然な「…すると」で表した。
- source_word: ἀνέβη
  choice: 上る
  rationale: エルサレムへ向かうことを「上る」と表す原文の慣用的・地理的表現を保持した。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 地名の標準的な日本語表記を用いた。
- source_word: διεκρίνοντο
  choice: 異議を唱えた
  rationale: この文脈では内心の疑いではなく、ペテロに向けた反対・論争を表す。未完了過去の継続的な含みは文脈に委ねつつ、単なる批判よりも対立的な発言であることを自然な日本語で示した。
- source_word: πρὸς αὐτόν
  choice: 彼に
  rationale: 論争の向けられた相手がペテロであることを簡潔に表し、原文以上に敵意を強めないようにした。
- source_word: οἱ ἐκ περιτομῆς
  choice: 割礼を受けている者たち
  rationale: 直訳的な「割礼からの者たち」が、割礼との結び付きによって特定される人々を指すことを、明瞭な現代日本語で表した。正式な党派であったと断定する表現は避けた。
theological_decisions:
- issue: οἱ ἐκ περιτομῆς が指す集団の範囲
  choice: 割礼との結び付きによって識別される、エルサレムの信者たちの中の人々
  alternative: ユダヤ人信者全般、または後代的な意味での正式な「割礼派」
  rationale: 原句は割礼を識別標識として人々を示すが、すべてのユダヤ人信者を意味するのか、組織化された党派を意味するのかまでは明示しない。その曖昧さを本文と脚注で保った。
translation_notes:
  register: 明瞭で現代的だが、聖書本文にふさわしい落ち着いた文体とした。「ところが」で直前の出来事との軽い対照を示し、「異議を唱えた」で公然と反対した状況を自然に表現した。
