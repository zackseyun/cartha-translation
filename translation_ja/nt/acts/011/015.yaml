  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: ja
  text: 私が話し始めたとき[a]、聖霊は、初めに私たちの上に降ったのと同じように、彼らの上に降りました。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が話し始めると」。原文は、私が話し始めた時点と同時に起きたことを示す。
    reason: lexical_alternative
  - marker: b
    text: 「初めに」は、おそらく弟子たちに初めて聖霊が注がれた五旬節の出来事を指す（使徒2章参照）。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: 私が話し始めると
  rationale: ἐν＋冠詞付き不定詞は同時的な時を表す。日本語の「始めると」は、ペトロが話し始めたその時に出来事が起きたことを自然に示す。「話し始めた時」とも訳せるため脚注に示した。δέはここでは物語を進める接続であり、独立した「しかし」は置かない。
- source_word: λαλεῖν
  choice: 話し始める
  rationale: λαλέωはここで聴衆に向かって語る行為を指す。現代日本語として平明な「話す」を用いた。
- source_word: ἐπέπεσεν
  choice: 降りました
  rationale: ἐπιπίπτω＋ἐπίは、使徒言行録で聖霊が人々の上に力強く臨むことを表す。「降る」は比喩を保ちつつ、自然で簡潔である。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語の聖書用語として定着し、原文の指示対象を明確に表す。
- source_word: ἐπ’ αὐτούς
  choice: 彼らの上に
  rationale: ἐπίの空間的比喩を保ち、後半の「私たちの上に」との明示的な対応を維持した。
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: 私たちの上に降ったのと、まったく同じでした
  rationale: ὥσπερの強い対応を「まったく同じ」で表し、καίの「私たちにも」という包含的な比較を文脈上自然な日本語にした。省略された動詞「降った」を補って比較関係を明確にした。
- source_word: ἐν ἀρχῇ
  choice: 初めに
  rationale: 創造の始まりではなく、彼らが聖霊を受けた初めの時を指す文脈に適する。特定の出来事への同定は本文で断定せず、原文の簡潔さを保った。
theological_decisions:
- issue: ἐν ἀρχῇ（「初めに」）の指示対象
  choice: 本文では「初めに」と幅を残し、ペトロたちが聖霊を受けた最初の出来事への言及として訳す
  alternative: 五旬節の時に
  rationale: 文脈上は使徒言行録2章の五旬節を指す可能性が高いが、原文は出来事の名称を明記していない。本文で特定しすぎず、脚注で可能性を説明する。
- issue: 聖霊が「降る」という表現の保持
  choice: 降りました
  alternative: 臨みました
  rationale: 原文のἐπέπεσενが持つ鮮明な比喩と、彼らと私たちとの対応を保つ。「臨む」も自然だが、比喩を弱める可能性がある。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、証言としての丁寧体を採用した。「彼らの上に／私たちの上に」の並行と「降る」という原文の比喩を保持した。
