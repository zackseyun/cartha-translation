id: ACT.11.22
reference: Acts 11:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: ja
  text: 彼らについての知らせがエルサレムの教会の耳に入り[a]、教会はバルナバをアンティオキアまで遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らについての知らせが、エルサレムの教会に聞こえてきた」。直訳「その知らせは、エルサレムにある教会の耳へと聞かれた」。
    reason: 原文の受動表現と「耳へ」という慣用的な言い回しを示すため。
lexical_decisions:
- source_word: ἠκούσθη
  choice: 耳に入り
  rationale: 受動形の「聞かれた」と εἰς τὰ ὦτα の慣用表現を合わせ、知らせが教会に伝わったことを自然な現代日本語で表した。
- source_word: ὁ λόγος
  choice: 知らせ
  rationale: ここでは発言や神学的な「ことば」ではなく、アンティオキアで起きたことについて伝わった情報を指す。
- source_word: εἰς τὰ ὦτα
  choice: 耳に入り
  rationale: 情報が人のもとに届くというギリシア語の比喩を、日本語でも自然な形で残した。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 使徒言行録におけるキリスト者の共同体を表す、一般的で定着した訳語を用いた。
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: エルサレムの
  rationale: どの教会かを特定する分詞句を、意味を損なわず自然な日本語に簡潔化した。
- source_word: περὶ αὐτῶν
  choice: 彼らについての
  rationale: 代名詞の指示対象を訳文で限定せず、原文の曖昧さを保った。文脈上は直前に述べられた人々を指すと考えられる。
- source_word: ἐξαπέστειλαν
  choice: 遣わした
  rationale: 任務を帯びて人を送り出す意味を、物語文として自然かつ品位ある語で表した。
- source_word: Βαρναβᾶν
  choice: バルナバ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ἕως Ἀντιοχείας
  choice: アンティオキアまで
  rationale: ἕως が示す到達範囲を「まで」で明示し、単なる目的地表現に弱めなかった。
theological_decisions:
- issue: 「遣わした」の主語
  choice: エルサレムの教会全体を受けて「教会は」と明示した。
  alternative: 教会内の使徒や長老など、特定の指導者たちが遣わしたと解する。
  rationale: 直近の明示的な主体は「エルサレムの教会」であり、本文は使徒や長老に限定していないため、特定の統治主体を補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「教会」「遣わした」など聖書物語にふさわしい落ち着いた語調を保った。δὲ はここで強い時間的意味を持たないため、独立した「さて」「その時」などを補わなかった。
