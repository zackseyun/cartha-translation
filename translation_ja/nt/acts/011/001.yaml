  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: ja
  text: さて、使徒たちと、ユダヤ全土にいた兄弟たちは、異邦人たちも神のことばを受け入れたと聞いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は「兄弟姉妹」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは信仰を同じくする人々を広く指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: 聞いた
  rationale: 知らせを耳にしたことを表すアオリストであり、自然で簡潔な訳。
- source_word: δὲ
  choice: さて
  rationale: 強い対比ではなく物語の場面転換を示すため、現代日本語で自然な接続語とした。
- source_word: οἱ ἀπόστολοι
  choice: 使徒たち
  rationale: 使徒言行録における定着した呼称を用いた。
- source_word: οἱ ἀδελφοὶ
  choice: 兄弟たち
  rationale: 原文の男性複数形を保つ一方、信仰共同体の仲間を広く指し得る点を脚注で示した。
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: ユダヤ全土にいる
  rationale: κατάの分布的な意味を「全土」で表した。
- source_word: καὶ τὰ ἔθνη
  choice: 異邦人たちも
  rationale: 文脈上、非ユダヤ人を指し、καίの付加的な強調を「も」で保持した。
- source_word: ἐδέξαντο
  choice: 受け入れた
  rationale: 宣べ伝えられた神のことばを肯定的に受容したことを自然に表す。日本語では主節との前後関係が明らかなため過去形で十分である。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 初期キリスト教の宣教内容を指す定型的な聖書表現と神学的含意を保持した。
theological_decisions:
- issue: 混合した信仰共同体を指し得る ἀδελφοὶ の訳
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の文法上の男性複数形を本文で保ちつつ、女性を含む信仰の仲間一般を指す可能性を脚注で明示し、意味範囲を狭めないようにした。
translation_notes:
  register: 明快で格調ある現代標準日本語。地理的な広がりと、異邦人も受容したという驚きを簡潔に保持した。
