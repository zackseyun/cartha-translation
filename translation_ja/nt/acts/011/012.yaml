source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: ja
  text: そして、霊は私に、何の分け隔てもせずに彼らと一緒に行くようにと言いました[a]。この六人の兄弟たちも私と一緒に来て、私たちはその人の家に入りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「少しもためらわず」または「少しも疑わず」。ギリシア語の分詞は、分け隔てをしないこととも、ためらうことや疑うこととも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: 霊
  rationale: 啓示によって導く主体として聖霊を指すが、原文に「聖なる」は明記されていないため、「聖霊」と補わず「霊」とした。
- source_word: εἶπεν ... μοι
  choice: 私に…と言いました
  rationale: 指示を伝える構文として自然な現代日本語にしつつ、原文の「言う」という表現を保った。
- source_word: συνελθεῖν αὐτοῖς
  choice: 彼らと一緒に行く
  rationale: ここでは、訪ねて来た人々に同行することを表すため、明瞭で自然な表現とした。
- source_word: μηδὲν διακρίναντα
  choice: 何の分け隔てもせず
  rationale: ユダヤ人と異邦人との境界が問題となる文脈に合い、「区別しない」という意味を表す。ただし「ためらわず」「疑わず」の可能性も脚注に残した。
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: この六人の兄弟たち
  rationale: οὗτοιを「この」で明示し、実際に同行した男性の信徒たちを指すἀδελφοίを「兄弟たち」とした。
- source_word: εἰσήλθομεν
  choice: 私たちは…入りました
  rationale: 一人称複数を明示し、物語文として自然に訳した。
- source_word: εἰς τὸν οἶκον τοῦ ἀνδρός
  choice: その人の家に
  rationale: 特定の男性を指すτοῦ ἀνδρόςを、前後関係に沿った自然な日本語で表した。
theological_decisions:
- issue: μηδὲν διακρίνανταの意味
  choice: 何の分け隔てもせず
  alternative: ためらわず／疑わず
  rationale: ペトロが異邦人の家に入ったことを弁明する文脈では、人々の間に区別を設けないという意味が強い。一方、語形上は「ためらわない」「疑わない」とも解し得るため、本文で一つに固定し切らず脚注に別訳を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の丁寧な語り口を保った。「霊」は原文にない「聖なる」を補わず、文脈上の指示対象を保持する訳語である。
