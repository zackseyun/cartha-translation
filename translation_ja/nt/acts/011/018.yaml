id: ACT.11.18
reference: Acts 11:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: ja
  text: 人々はこれを聞くと静まり、神をあがめて言った。「それでは、神は異邦人にも、いのちに至る悔い改めをお与えになったのだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: 人々はこれを聞くと
  rationale: アオリスト分詞の時間的な働きを自然な現代日本語で表した。δέは弱い接続辞なので、独立した語を置かず文の流れに吸収した。ταῦταはペテロの直前の報告全体を指すため「これ」とした。
- source_word: ἡσύχασαν
  choice: 静まり
  rationale: 反論をやめて静かになったことを表す。「黙った」も可能だが、「静まり」は、それまでの異議や騒ぎが収まった推移を簡潔に伝える。
- source_word: ἐδόξασαν τὸν θεόν
  choice: 神をあがめて
  rationale: ルカ文書におけるδοξάζωの宗教的な重みを保ちつつ、現代日本語として自然な表現にした。
- source_word: λέγοντες
  choice: 言った
  rationale: 分詞構文を日本語の自然な連用関係として表し、続く直接話法を導いた。
- source_word: Ἄρα καὶ
  choice: それでは、…にも
  rationale: Ἄραの推論・帰結を「それでは」で表し、καίの包摂的な強調を「にも」で保持した。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人にも
  rationale: この文脈では地政学的な「諸国民」ではなく、ユダヤ人ではない人々を指すため「異邦人」とした。
- source_word: τὴν μετάνοιαν
  choice: 悔い改めを
  rationale: μετάνοιαは単なる知的な「考えの変更」に限定されず、神への方向転換を含む定着した聖書用語なので「悔い改め」とした。ギリシア語の定冠詞は日本語では明示しない方が自然である。
- source_word: εἰς ζωὴν
  choice: いのちに至る
  rationale: εἰςの方向・目標・結果の幅を保ち、「いのちへと至る」という関係を自然な日本語で示した。
- source_word: ἔδωκεν
  choice: お与えになった
  rationale: 神を主語とする敬意を自然な日本語で表しつつ、悔い改めが神から与えられたという本文の構造を保持した。アオリストは素直に過去形で訳した。
theological_decisions:
- issue: 悔い改めが神から与えられること
  choice: 「神は…悔い改めをお与えになった」と訳し、悔い改めを神の賜物として提示する本文の言い方を保持した。
  alternative: 「神は…悔い改める機会をお与えになった」
  rationale: 原文の直接目的語は「悔い改め」であり、「機会」を補うと意味を限定するため避けた。同時に、人間の応答をめぐる包括的な教理までは本文に加えていない。
- issue: μετάνοια εἰς ζωήνの関係
  choice: 「いのちに至る悔い改め」
  alternative: 「いのちのための悔い改め」または「いのちへの悔い改め」
  rationale: εἰςが示し得る目標・方向・結果の重なりを、「に至る」によって過度に断定せず自然に表した。
translation_notes:
  register: 明快な現代標準日本語を用い、礼拝朗読にも適する簡潔で品位ある文体とした。「いのち」は、この文脈で救いにかかわる生命の含意を保つため、ひらがな表記とした。
