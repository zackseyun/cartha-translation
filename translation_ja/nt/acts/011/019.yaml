  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: ja
  text: さて、ステファノをめぐって起こった苦難[a]のために散らされた人々は、フェニキア、キプロス、アンティオキアにまで行き、ユダヤ人だけに[c]ことば[b]を語っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「苦難」は「迫害」とも訳せる。ギリシア語は、苦しみ、圧迫、困難、また文脈によっては迫害を表す。
    reason: lexical_alternative
  - marker: b
    text: ここで「ことば」とは、イエスについて宣べ伝えられた知らせを指す。「メッセージ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は宣教の相手を強く限定しており、「ユダヤ人だけに」という意味。
    reason: lexical_emphasis
lexical_decisions:
- source_word: διασπαρέντες
  choice: 散らされた人々
  rationale: アオリスト受動分詞の受動性を保ちつつ、前の出来事を受ける自然な日本語とした。
- source_word: θλίψεως
  choice: 苦難
  rationale: 敵対や迫害を含み得る一方、語自体の幅広い意味である苦しみ・圧迫を不必要に狭めない。
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: ステファノのことで起こった
  rationale: ステファノをめぐる一件に関連して苦難が生じたという、ἐπί＋与格の関連・契機の含みを自然に表した。
- source_word: διῆλθον ἕως
  choice: …にまで行き
  rationale: 移動の地理的な広がりを簡潔に示す。
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: フェニキア、キプロス、アンティオキア
  rationale: 現代日本語の聖書・地名表記として明瞭な音写を用いた。
- source_word: μηδενὶ λαλοῦντες
  choice: …だけに…を語っていた
  rationale: 日本語では否定表現を重ねず、後続の例外・限定句と一体化して自然に表現した。
- source_word: τὸν λόγον
  choice: みことば
  rationale: 使徒言行録で繰り返される宣教内容の定型的表現を保ち、具体的意味は脚注で補った。
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: ユダヤ人だけに
  rationale: εἰ μήとμόνονによる聞き手の強い限定を、自然で明確な日本語で表した。
theological_decisions:
- issue: ステファノの件に続く敵対の性質
  choice: 本文ではθλῖψιςを「苦難」とする。
  alternative: 迫害
  rationale: 文脈は迫害を含むが、原語そのものは苦しみや圧迫を広く表すため、その語義を狭めない。
- issue: 使徒言行録におけるτὸν λόγονの意味
  choice: 本文では「みことば」とする。
  alternative: メッセージ／イエスについての知らせ
  rationale: ルカの反復的な用語法を本文に残し、それが宣べ伝えられた知らせを指すことを脚注で明示する。
- issue: 宣教対象の限定
  choice: 「ユダヤ人だけに」と明示する。
  alternative: ユダヤ人に
  rationale: εἰ μὴ μόνονの強い限定を省略せず、当時この一団が語った対象についての叙述として保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「さて」で直前の物語への接続を示し、「散らされた」「にまで」によって原文の受動性と地理的広がりを保持した。脚注マーカーは各注の対象語句の直後に置いた。
