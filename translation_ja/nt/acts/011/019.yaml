  to: さて、ステファノをめぐって起こった苦難[a]のために散らされた人々は、フェニキア、キプロス、アンティオキアにまで行き、ユダヤ人だけに[c]ことば[b]を語っていた。
  rationale: 意味内容は保持したまま、ステファノとの関係をより自然な日本語で表し、「みことば」の教会内的・尊敬語的な響きを避けて「ことば」とした。さらに、脚注cをその説明対象である「ユダヤ人だけに」の直後へ移した。本文の「語っていた」は既存の読みやすい表現として維持できるが、翻訳注の選択理由は継続相を積極的に主張しないよう調整すべきである。
