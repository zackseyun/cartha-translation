id: ACT.11.26
reference: Acts 11:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: ja
  text: そして、彼を見つけると、アンティオキアに連れて行った。それから二人は丸一年、教会の人々と共に集まり[a]、大勢の人々を教えた。弟子たちが初めて「クリスチャン」と呼ばれた[b]のは、アンティオキアであった。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「教会の集まりに加わり」。ここで「教会」は建物ではなく、信じる人々の共同体を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「クリスチャンと呼ばれた」。誰がこの呼び名を付けたかは明記されていない。
    reason: cultural_note
  - marker: c
    text: 別訳「大勢の人々を教え、アンティオキアで弟子たちは初めてクリスチャンと呼ばれた」。
    reason: previous_rendering
lexical_decisions:
- source_word: εὑρὼν
  choice: 彼を見つけると
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、自然な時間表現として訳した。文脈上、目的語はサウロである。
- source_word: ἤγαγεν
  choice: 連れて来た
  rationale: アンティオキアを物語上の到着点として示す日本語として自然であり、単なる『導いた』より文脈に合う。
- source_word: ἐγένετο δὲ αὐτοῖς καὶ ἐνιαυτὸν ὅλον
  choice: それから二人は丸一年
  rationale: ギリシア語の慣用的な出来事導入を不自然に直訳せず、バルナバとサウロの二人を明示し、期間を保持した。
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: 教会の人々と共に集まり
  rationale: ἐκκλησίαを建物ではなく信徒共同体として理解し、共同体と共に集まった意味を明確にした。受動形のニュアンスより、日本語として自然な出来事の叙述を優先した。
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: 大勢の人々を教えた
  rationale: ἱκανόςが表す相当な人数を、現代日本語で自然な『大勢』により表した。ὄχλοςはここでは単なる雑然とした群衆というより、多数の人々を指す。
- source_word: χρηματίσαι
  choice: 呼ばれた
  rationale: この文脈では名称を付される、あるいはその名で呼ばれることを意味する。誰が名付けたかは本文が明示しないため、受動表現を保った。
- source_word: πρώτως
  choice: 初めて
  rationale: その呼称が最初に用いられた場所を示す副詞として、簡潔で自然に訳した。
- source_word: Χριστιανούς
  choice: クリスチャン
  rationale: 語源を説明的に訳すより、定着した集団名として現代日本語で広く通用する呼称を採用した。
theological_decisions:
- issue: Χριστιανούςを、Χριστόςの称号的意味との関係でどう訳すか
  choice: クリスチャン
  alternative: キリスト者／メシア派の者たち
  rationale: ここではΧριστόςそのものを称号として述べているのではなく、弟子たちに付された集団名Χριστιανοίである。『クリスチャン』は日本語で定着しており、『メシア派』は本文にない宗派的含意を加えかねない。
- issue: χρηματίσαιの呼称の主体
  choice: 主体を明示せず『呼ばれた』とする
  alternative: 人々からそう呼ばれた／神によってその名を与えられた
  rationale: 語そのものは公的な呼称・名称付与を表し得るが、本文は命名主体を特定しない。神的託宣の意味や外部者によるあだ名という理解を訳文で確定しない。
- issue: ἐν τῇ ἐκκλησίᾳのἐκκλησία
  choice: 『教会の人々』として共同体を指す
  alternative: 教会で／集会で
  rationale: 初期キリスト教のἐκκλησίαは通常、建物ではなく共同体・会衆を指す。場所としての教会堂を連想させない表現にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の主語を分かりやすくするため『二人』を補い、ἐκκλησίαが建物と誤解されないよう『教会の人々』とした。末尾は焦点化構文にして、アンティオキアが最初の呼称の場所であることを自然に強調した。
