  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: ja
  text: 彼らはそのとおりに行い、バルナバとサウロに託して[a]、それを長老たちに送りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「バルナバとサウロの手を通して」。ここは使者・媒介を表し、「バルナバとサウロを通して」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: そこで彼らは、そのとおりにし
  rationale: 関係代名詞ὃは前節で決めた救援を指す。日本語では逐語的な「それを行い」より「そのとおりにし」が自然であり、καίの物語上のつながりは「そこで」で表した。
- source_word: ἀποστείλαντες
  choice: それを送りました
  rationale: アオリスト分詞を主動詞と一体の行為として自然な日本語に組み替えた。目的語はギリシア語では文脈上省略されているため、内容を限定しすぎない「それ」を補った。
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: 長老たちに
  rationale: πρεσβύτεροιは共同体の指導者を指す。「長老」は現代日本語の聖書用語として明瞭で定着している。
- source_word: διὰ χειρὸς Βαρναβᾶ καὶ Σαύλου
  choice: バルナバとサウロに託して
  rationale: 「手を通して」というギリシア語の慣用句が示す使者としての媒介を、自然な現代日本語で表した。字義的表現は脚注に残した。
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: バルナバとサウロ
  rationale: 固有名詞は日本語聖書で一般的な音写を用いた。
