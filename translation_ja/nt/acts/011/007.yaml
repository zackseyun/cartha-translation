  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: ja
  text: また私は、私に語りかける声を聞きました。『立ち上がって、ペトロ、殺して食べなさい。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: 立ちなさい
  rationale: 分詞を伴う命令的表現であり、ここでは自然な日本語の直接命令として表した。「起きなさい」も可能だが、文脈上は立ち上がる動作を明確にする。
- source_word: θῦσον
  choice: 屠って
  rationale: 食用にするため動物を殺すことを表す語なので、「殺して」より具体的な「屠って」とした。祭儀的な「いけにえとして献げる」という意味に限定しない。
- source_word: φάγε
  choice: 食べなさい
  rationale: 単純な命令の意味を、明瞭で自然な現代日本語で保持した。
theological_decisions:
- issue: θῦσον に祭儀的意味を持たせるか
  choice: 「屠って」とし、食用のために殺す意味を示す
  alternative: 「いけにえとして献げて」または「殺して」
  rationale: この文脈では動物を食べるために殺す指示であり、祭儀的犠牲に限定すると原文以上の神学的含意を加えることになる。一方、「屠る」は対象が動物であることを自然に示す。
translation_notes:
  register: ペトロ自身の回想として丁寧体を用い、引用内の命令は明快で dignified な現代標準日本語とした。固有名は一般的な日本語聖書表記「ペトロ」を採用した。
