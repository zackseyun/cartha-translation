  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: ja
  text: しかし、私は言いました。『決してそんなことはありません、主よ。俗なものや汚れたものは、これまで一度も私の口に入ったことがありません。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: とんでもありません
  rationale: 強い拒絶を、現代日本語で自然かつ敬意を保つ表現にした。
- source_word: κύριε
  choice: 主よ
  rationale: 呼びかけの形を保ち、使徒言行録の文脈に即した標準的な訳語とした。
- source_word: κοινὸν ἢ ἀκάθαρτον
  choice: 汚れたものや清くないもの
  rationale: κοινόςの祭儀的な意味を「汚れた」、ἀκάθαρτοςを「清くない」と訳し、近接する二語を区別しつつ並列表現を保った。
- source_word: οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου
  choice: 私はこれまで一度も口に入れたことがありません
  rationale: 原文の「私の口に入った」を、日本語で食物について自然な能動表現にし、οὐδέποτεの全面否定を明示した。
- source_word: ὅτι
  choice: （文を区切って理由を続ける）
  rationale: 理由を示す接続を、日本語では直前の強い拒絶に続く説明として自然な独立文にした。
theological_decisions:
- issue: κοινόςとἀκάθαρτοςの祭儀的含意
  choice: 「汚れたものや清くないもの」として二つの形容を保持する
  alternative: 「俗なものや汚れたもの」／「汚れたもの」と一括する
  rationale: 食物規定を背景とする区別を示しつつ、二語を一つに統合して原文の重なりや緊張を消さないため。
translation_notes:
  register: 明瞭な現代標準日本語。ペトロの強い拒絶と主への敬意を両立させ、引用内の理由説明は自然な日本語になるよう文を区切った。
