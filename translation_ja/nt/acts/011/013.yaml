  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: ja
  text: そして彼は私たちに、自分の家に天使が立っていて、こう言うのを見た次第を話しました。「ヨッパへ遣わし、ペテロと呼ばれるシモンを呼び寄せなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: 話しました
  rationale: 情報を伝え、出来事の次第を報告する意味。現代日本語の物語文として自然で、過度に公的な響きのある「報告しました」を避けた。
- source_word: δὲ
  choice: そして
  rationale: 強い対照ではなく、物語を進める緩やかな接続を表す。
- source_word: πῶς
  choice: …次第を
  rationale: 単なる「…ということ」ではなく、どのように見たかという内容・経緯のニュアンスを保つ。
- source_word: τὸν ἄγγελον
  choice: 御使い
  rationale: 文脈上特定される天的な使者を指す。日本語では定冠詞を別語で明示せず、文脈に委ねる。「御使い」は聖書文体として通用しつつ簡潔。
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: 自分の家の中に
  rationale: αὐτοῦが報告者コルネリウスを指すことを日本語で明瞭にし、物理的な場所を表す。
- source_word: σταθέντα
  choice: 立っていて
  rationale: 御使いの姿勢・現れた状態を自然な日本語で表し、続く発話の分詞と滑らかにつなぐ。
- source_word: εἰπόντα
  choice: こう言うのを
  rationale: σταθένταとともにεἶδενに係る分詞であることを保ち、直接話法へ自然に導く。
- source_word: Ἀπόστειλον
  choice: 人を遣わし
  rationale: 目的地だけを伴う他動詞を日本語として自然にするため、ギリシア語で暗黙の使者を「人」として補った。関連節の具体的な人数や身分は持ち込まない。
- source_word: εἰς Ἰόππην
  choice: ヨッパへ
  rationale: 都市への方向・目的地を明確に表す慣用的な訳。地名は日本語聖書で定着した「ヨッパ」とする。
- source_word: μετάπεμψαι
  choice: 呼び寄せなさい
  rationale: 使いを送ってその人に来てもらう意味を簡潔かつ自然に表す。「召喚しなさい」ほど権威的な含意を加えない。
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: ペテロと呼ばれるシモン
  rationale: シモンを、通称として用いられるペテロという名で特定する原文の構造を明瞭に保つ。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒言行録の証言・報告場面にふさわしい落ち着いた敬体とした。「御使い」は定着した聖書語だが、文全体は古風にならないよう整えた。原文のμετάπεμψαιは「使いを送って呼ぶ」の意を「呼び寄せる」で十分に表せるため、英語版の語法上の代案に対応する脚注は日本語では設けない。
