  to: そして彼は私たちに、自分の家に天使が立っていて、こう言うのを見た次第を話しました。「ヨッパへ遣わし、ペテロと呼ばれるシモンを呼び寄せなさい。」
  rationale: 原文で明示されない「人」を削除し、ἀπόστειλονの目的語の省略を日本語でも保ちました。「御使い」を「天使」として、意味を変えずに現代標準語としての明瞭さと中立性を高めました。ほかの要素、すなわち報告の内容を導く「次第」、天使が立って語る情景、ヨッパ、シモンの通称ペテロは保持しています。英語版の「summon / send for」の語法上の代案は、日本語の「呼び寄せる」で十分に自然に表されるため、脚注は不要です。
