base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: ja
  text: しかし、天から再び声が答えた。「神が清めたものを、あなたは俗なものとして扱ってはならない。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「汚れたものとして扱ってはならない」または「不浄なものと呼んではならない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: ἀποκρίνομαιのアオリストで、物語の先行する発言への応答を自然に表す。
- source_word: φωνὴ
  choice: 声
  rationale: 話者を本文以上に特定せず、ギリシア語の主語を簡潔に保持する。
- source_word: ἐκ δευτέρου
  choice: もう一度
  rationale: 「二度目に」を意味する慣用句。現代日本語の物語文として自然である。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: この文脈のοὐρανόςは単なる空ではなく、神の領域としての「天」を指す。
- source_word: Ἃ
  choice: ものを
  rationale: 中性複数関係代名詞が指す一般的な対象を、日本語では自然な包括表現「もの」で示す。
- source_word: ὁ θεὸς
  choice: 神が
  rationale: 主語を明確に示す標準的な訳。
- source_word: ἐκαθάρισεν
  choice: 清めた
  rationale: καθαρίζωの完了した行為を簡潔に表し、祭儀的な清さの含意も保つ。
- source_word: σὺ
  choice: あなたは
  rationale: 明示された二人称代名詞の強調を、日本語の主題提示によって一定程度保持する。
- source_word: μὴ κοίνου
  choice: 俗なものとしてはならない
  rationale: κοινόωが示す「共通の、聖別されていないものとする」という純潔区分の語感を保ちつつ、禁止命令として自然な日本語にする。
theological_decisions:
- issue: κοινόωにおける清浄規定上のニュアンス
  choice: 俗なものとしてはならない
  alternative: 汚れたものと見なしてはならない／不浄なものと呼んではならない
  rationale: 神が「清めた」ことと、人がそれをκοινόςと扱うことの対比を保つため、「汚れた」に一本化しない。「俗」は「聖別されていない、普通の領域に属する」という概念を比較的よく保持するが、現代読者には意味が取りにくいため脚注で解釈的な代案を示す。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「すると」で物語の応答関係を示し、「俗なもの」は純潔区分の緊張を保つため脚注で補足した。
