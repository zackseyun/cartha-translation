id: ACT.11.29
reference: Acts 11:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: ja
  text: そこで弟子たちは、それぞれの暮らし向きに応じて[a]、ユダヤに住む兄弟たち[b]に援助を送ることに決めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「各人がどれほど豊かであったかに応じて」とも訳せる。すなわち、各人の資力や経済的余裕に応じて、という意味。
    reason: 原語εὐπορέωが、各人の経済的余裕・資力を表すことを示すため。
  - marker: b
    text: 「兄弟たち」は、ユダヤにいる仲間の信徒たちを指し、女性を含むキリスト者共同体全体を意味し得る。
    reason: 原文の男性複数形を保ちながら、初期キリスト教での包摂的な用法を説明するため。
lexical_decisions:
- source_word: μαθητῶν
  choice: 弟子たち
  rationale: 使徒言行録におけるイエスに従う者たちの標準的な呼称として、自然で定着した訳語を用いた。
- source_word: καθὼς εὐπορεῖτό τις ... ἕκαστος αὐτῶν
  choice: それぞれの暮らし向きに応じて
  rationale: εὐπορέωが示す経済的な余裕や資力と、ἕκαστοςの配分的な意味を合わせて表した。「力に応じて」よりも金銭的事情が明確で、「資力に応じて」よりも現代の一般読者に分かりやすい。
- source_word: ὥρισαν
  choice: 決めた
  rationale: ここでは、一定の方針を定め、実行を決断したことを表す。現代日本語として自然な「決めた」とした。
- source_word: εἰς διακονίαν πέμψαι
  choice: 援助を送る
  rationale: 直訳的には「奉仕のために送る」だが、文脈ではユダヤの信徒への実際的な支援を指す。日本語では目的語を補って「援助を送る」とするのが自然であり、支援の具体的形態までは限定しない。
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: ユダヤに住む
  rationale: 分詞句を簡潔で自然な現代日本語にした。
- source_word: ἀδελφοῖς
  choice: 兄弟たち
  rationale: 原文の男性複数形による家族的呼称を本文に保った。初期キリスト教共同体全体を含み得る点は脚注で示す。
theological_decisions:
- issue: ἀδελφοῖςがユダヤのキリスト者共同体を指す範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信徒たち
  rationale: ギリシア語の男性複数形を本文では保持しつつ、この語が男女を含む共同体の仲間を指し得ることを脚注で明示し、原文の形と文脈上の包摂性の双方を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「暮らし向き」は日常的に理解しやすく、ここでの経済的な含意も伝える。「援助」は飢饉を見越した実際的支援という文脈に適合するが、金銭や物資など具体的形態は限定しない。
