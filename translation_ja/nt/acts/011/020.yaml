id: ACT.11.20
reference: Acts 11:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: ja
  text: しかし、その中にはキプロスとキレネ出身の男たちが何人かいた。彼らはアンティオキアに来ると、ギリシア語を話すユダヤ人たち[a]にも語りかけ、主イエスについての福音を告げ知らせていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「ギリシア語を話すユダヤ人たち」ではなく「ギリシア人たち」とある。その読みが原文なら、彼らはギリシア語を話すユダヤ人だけでなく、異邦人にも語っていたことになる。
    reason: textual_variant
lexical_decisions:
- source_word: τινες ... ἄνδρες
  choice: 男たちが何人か
  rationale: τινεςの不特定の一部という意味と、ἄνδρεςが成人男性を指すことの両方を、自然な現代日本語で保持した。
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: キプロスとキレネ出身の
  rationale: 出身地を表す形容詞を、日本語で自然な地名＋「出身」の形にした。
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: アンティオキアに来ると
  rationale: アオリスト分詞の時間的関係を簡潔に表した。
- source_word: ἐλάλουν
  choice: 語りかけ
  rationale: 未完了過去が示す継続的・反復的な働きは、文末の「告げ知らせていた」と合わせて表現した。πρόςを伴うため、聞き手に向けて語る意味を「語りかけ」で示した。
- source_word: καὶ πρὸς
  choice: にも
  rationale: καίの付加的な意味を「も」で表し、宣教の対象がさらに広がったことを示した。
- source_word: τοὺς Ἑλληνιστάς
  choice: ギリシア語を話すユダヤ人たち
  rationale: SBLGNT本文のἙλληνιστάςが通常指す意味を、音写語ではなく一般読者に明瞭な表現で訳した。異読Ἕλληναςは脚注に保持した。
- source_word: εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν
  choice: 主イエスについての福音を告げ知らせていた
  rationale: εὐαγγελίζομαιの福音告知の意味と、その内容・中心が主イエスであることを自然な日本語で表した。κύριοςはキリスト論的称号として「主」とした。
theological_decisions:
- issue: τοὺς Ἑλληνιστάςと異読Ἕλληναςの読み
  choice: 本文ではSBLGNTの「ギリシア語を話すユダヤ人たち」を採用
  alternative: 「ギリシア人たち」、すなわち異邦人
  rationale: どちらの読みかによって、ここで福音を聞いた人々がギリシア語を話すユダヤ人なのか異邦人なのかが変わる。指定された原文本文に従いつつ、物語上・神学上重要な異読を脚注で明示し、緊張を解消しないようにした。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。長いギリシア語の一文は日本語で読みやすい二文に分けたが、論理関係と未完了過去の継続性を保持した。
