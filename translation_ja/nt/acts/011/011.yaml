  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: ja
  text: すると、まさにその時、カイサリアから私のもとへ遣わされた三人の男が、私たちのいた家にやって来ました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίによる物語の展開と、ἰδούが新たな重要事態へ注意を促す力を保つ。現代日本語ではやや荘重だが、聖書本文として明瞭である。
- source_word: ἐξαυτῆς
  choice: ちょうどその時
  rationale: 直前の幻と使者の到着との時間的な一致を表し、「直ちに」と断定するよりも「まさにその時／たった今」の語感を自然に伝える。
- source_word: τρεῖς ἄνδρες
  choice: 三人の男
  rationale: 人数と男性であることをそのまま明示する。
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: 家に到着しました
  rationale: この文脈でのἐφίστημιは、その場所にやって来て居合わせることを示すため、直訳的な「家の上に立った」ではなく自然な到着表現とする。
- source_word: ἐν ᾗ ἦμεν
  choice: 私たちのいた
  rationale: 滞在中だった可能性を含みつつ、原文が明示しない継続的宿泊までは補わない。
- source_word: ἀπεσταλμένοι
  choice: 遣わされて
  rationale: 到着に先立って派遣されたことと受動の意味を保つ。
- source_word: ἀπὸ Καισαρείας πρός με
  choice: カイサリアから私のもとに
  rationale: 出発地と、ペトロを送り先・目的人物とする方向性を明瞭に示す。
theological_decisions: []
