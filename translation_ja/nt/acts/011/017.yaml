id: ACT.11.17
reference: Acts 11:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: ja
  text: それで、神が、主イエス・メシアを信じた私たちに与えてくださったのと同じ賜物を彼らにも与えてくださったのなら、いったい私が何者で、神を妨げることができたでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: 同じ賜物
  rationale: ἴσηνは比較される賜物の等しさを表す。文脈上、神が異邦人にもユダヤ人信者と同じ聖霊の賜物を与えたことを自然に示す。
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: 主イエス・メシアを信じた私たち
  rationale: アオリスト分詞πιστεύσασινをἡμῖνにかかる連体修飾として訳し、時を明示しすぎず原文の構造と曖昧さを保った。ἐπὶ＋対格は信頼の向かう対象として「を信じた」とした。
- source_word: κύριον
  choice: 主
  rationale: イエスに対する称号としてのκύριονを、現代日本語の聖書的かつ自然な表現で訳した。
- source_word: Χριστόν
  choice: メシア
  rationale: ここではイエスに付される意味ある称号としての力が保たれているため、音訳的な「キリスト」ではなく語義を示す「メシア」とした。
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: いったい私が何者で、…できたでしょうか
  rationale: 強調されたἐγώと修辞疑問による自己卑下を自然な日本語で再現し、過去の状況をἤμηνと「できた」で示した。
- source_word: κωλῦσαι τὸν θεόν
  choice: 神を妨げる
  rationale: 神の働きに反対することは神ご自身を妨げることに当たる、という原文の印象的な直接目的語構文を保持した。
theological_decisions:
- issue: πιστεύσασινとἡμῖνの関係
  choice: 「信じた私たち」と連体的に訳す
  alternative: 「私たちが信じた時に」と時間的に訳す
  rationale: 分詞はἡμῖνと一致しており、連体的な訳は原文に近い。「信じた時に」とすると賜物授与との時間関係を原文以上に確定する可能性があるため避けた。
- issue: Χριστόνの称号性
  choice: メシア
  alternative: キリスト
  rationale: この句ではΧριστόςの称号としての意味がなお明瞭であり、「メシア」とすることでそのユダヤ的・救済史的含意を保つ。
- issue: κωλῦσαι τὸν θεόνの直接的表現
  choice: 神を妨げる
  alternative: 神のなさることに逆らう
  rationale: 解釈的に言い換えず、異邦人を拒むことが神ご自身を妨げることになるという原文の強い神学的主張を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、ペトロの修辞疑問の厳粛さを保った。「賜物」「主」は一般読者にも理解可能な聖書語として採用し、文全体は過度に文語的にならないよう整えた。
