base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: ja
  text: その人はあなたにことばを語ります。そのことばによって、あなたとあなたの家の者全員が救われます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そのことばの中で」または「そのことばを通して」とも訳せる。ギリシア語の表現は、そのことばが救いのもたらされる手段であることを示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: その人が
  rationale: 前節で言及された人物を受ける関係代名詞。日本語では文脈上の指示を明示して「その人が」とするのが自然。
- source_word: λαλήσει ῥήματα πρὸς σὲ
  choice: あなたにことばを語り
  rationale: λαλέωの「語る」と、ῥήματαの具体的な「ことば」を保ち、πρόςの聞き手への方向を「あなたに」で表した。
- source_word: ἐν οἷς
  choice: そのことばによって
  rationale: ἐνの手段的用法を自然な日本語で示す。「それによって」より指示内容が明確になるよう「そのことば」を補った。
- source_word: σωθήσῃ
  choice: 救われます
  rationale: σῴζωの未来受動。福音を聞くという使徒言行録の文脈に即して、救済の意味を明確に保った。
- source_word: σὺ καὶ πᾶς ὁ οἶκός σου
  choice: あなたもあなたの家の者も皆
  rationale: 明示されたσὺを「あなたも」で保ち、οἶκοςを建物ではなく家に属する人々として訳した。「皆」はπᾶςの範囲を表す。
theological_decisions:
- issue: コルネリウスの家に関する「救われる」の意味
  choice: 「救われます」と訳し、語られることばを通して救いが来ることを示す。
  alternative: 「助け出されます」
  rationale: この文脈のσῴζωには救済の意味があるが、救いの仕組みに関してこの節が述べていない後代の教理的説明は加えない。
- issue: 「あなたの家の者も皆」の範囲
  choice: 家に属する者全体を指す集合的表現として訳す。
  alternative: 「あなたの全家族」
  rationale: 本文の家全体への約束を保ちつつ、各人の応答をめぐる特定教派の理解や、無条件の自動的救済を訳文に持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「言葉」ではなく本文内で柔らかく読みやすい「ことば」を採用し、未来形は丁寧体の「救われます」で表した。
