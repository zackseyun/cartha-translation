source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: ja
  text: 主の御手は彼らとともにあり、多くの人々が信じて主に立ち返った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: 主の御手
  rationale: 主の力ある働きや恵みを表す聖書的な比喩を保ちつつ、現代日本語の聖書文体として自然で荘重な表現とした。
- source_word: κύριος
  choice: 主
  rationale: 文脈上イエスを指す可能性が高いが、ギリシア語本文は κύριος とだけ記すため、「主」として指示対象の含みを保った。
- source_word: μετ’ αὐτῶν
  choice: 彼らとともにあった
  rationale: μετά＋属格の基本的な意味を反映し、宣教者たちに主の臨在と助力が伴っていたことを表す。
- source_word: πολύς τε ἀριθμός
  choice: 多くの人
  rationale: 直訳的な「大きな数」より自然な日本語で、人数の多さを明確に伝える。
- source_word: ὁ πιστεύσας
  choice: 信じて
  rationale: アオリスト分詞と主動詞の関係は、先行または付随する行為のどちらにも理解し得るため、本文では自然な接続形を用い、解釈上の幅を脚注で示した。
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: 主に立ち返った
  rationale: 主への方向転換・回心を表しつつ、本文に明記されない「悔い改め」を補わない。「戻った」よりも、以前の所属を前提としにくい表現である。
theological_decisions:
- issue: 二つの「主」の指示対象
  choice: どちらも「主」と訳し、イエスまたは神と明示しない。
  alternative: 文脈に基づいて「イエス」と訳す。
  rationale: 使徒言行録の文脈ではイエスを指す可能性があるが、原文の κύριος が持つ表現上の開放性を保つため。
- issue: 信じることと主に立ち返ることの時間的・論理的関係
  choice: 「信じて主に立ち返った」とし、厳密な順序を断定しない。
  alternative: 「信じた人々が主に立ち返った」または「信じた結果、主に立ち返った」。
  rationale: ὁ πιστεύσας はアオリスト分詞であり、主動詞との関係を先行と見ることはできるが、明確な因果関係まで本文に加えるべきではない。
translation_notes:
  register: 明快な現代標準日本語を基調とし、「御手」「主に立ち返る」によって聖書的な比喩と宗教的な荘重さを保った。理由を明示する接続「ので」は、καί の文脈上の連続を自然な日本語にしたものだが、因果を過度に強めない読みも可能である。
