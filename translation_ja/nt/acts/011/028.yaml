source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: ja
  text: その中の一人、アガボという人が立ち上がり、全世界[a]に大飢饉が起ころうとしていることを、聖霊によって示した。この飢饉はクラウディウスの時代に起こった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「人の住む全世界」。ルカ文書では、より限定してローマ世界全体を指す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: 集会の中で発言のために立つ動作を自然な現代日本語で表し、原語の動作性を保つ。
- source_word: ἐσήμανεν
  choice: 示した
  rationale: 「しるしによって知らせる、示す、明らかにする」という語義を保ちつつ、預言という解釈語を本文に加えない。
- source_word: διὰ τοῦ πνεύματος
  choice: 御霊によって
  rationale: 属格を伴うδιάの手段・媒介を「によって」で表す。使徒言行録の預言的文脈では聖霊を指すと判断し、敬意ある慣用表現「御霊」を用いる。
- source_word: λιμὸν μεγάλην
  choice: 大きな飢饉
  rationale: 形容詞μεγάληνの基本的意味「大きな」を透明に反映し、「深刻な」と解釈的に狭めない。
- source_word: μέλλειν ἔσεσθαι
  choice: 起ころうとしている
  rationale: μέλλωと不定詞による近接した未来・予期された出来事の意味を自然に表す。
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: 全世界
  rationale: οἰκουμένηは字義的には「人の住む世界」で、文脈によりローマ世界を指し得る。本文では自然な「全世界」とし、範囲の曖昧さを脚注で保持する。
- source_word: ἥτις ἐγένετο
  choice: この飢饉は…実際に起こった
  rationale: 関係節を日本語として明瞭な独立文にし、先行詞が飢饉であることを明示する。「実際に」は予告の成就を示す関係節の談話的働きを自然に伝える。
- source_word: ἐπὶ Κλαυδίου
  choice: クラウディウスの時代に
  rationale: 統治者名を伴うἐπί＋属格の時間的用法を、補足的な「治世」を加えず平明に表す。
theological_decisions:
- issue: διὰ τοῦ πνεύματοςの「霊」が何を指すか
  choice: 聖霊を指すものとして「御霊」と訳す
  alternative: 特定性を弱めて「霊によって」とする
  rationale: 使徒言行録の預言的啓示の文脈における定冠詞付き「霊」は通常、聖霊を指す。ただし原語に「聖なる」という形容詞はないため、本文では日本語の慣用的な「御霊」にとどめる。
- issue: οἰκουμένηの範囲
  choice: 本文では「全世界」とし、脚注で「人の住む全世界」およびローマ世界の可能性を示す
  alternative: 本文を「ローマ世界全体」に限定する
  rationale: 語は広く人の住む世界を表し得る一方、ルカ文書ではローマ帝国圏を念頭に置く場合がある。本文で一方に限定せず、原文の幅を保つ。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「アガボ」「クラウディウス」は一般的な聖書固有名詞表記を採用した。長いギリシア語文は二文に分け、予告とその成就の関係を読みやすくした。
