  text: λέγοντες ὅτι ⸂Εἰσῆλθες πρὸς ἄνδρας ἀκροβυστίαν ἔχοντας καὶ συνέφαγες⸃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: ja
  text: こう言った。「あなたは割礼を受けていない男たち[a]のところに入り、一緒に食事をした。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「包皮を持つ男たち」。割礼というユダヤ人の契約のしるしを持たない者、すなわち異邦人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 現在分詞で前節の発言者たちの行為を受け、その非難の内容を導入する。日本語では文脈に自然につながるよう「こう言った」とした。
- source_word: ὅτι
  choice: 「…」
  rationale: 直接話法を導く用法なので、日本語では引用符で表した。
- source_word: Εἰσῆλθες πρὸς
  choice: …のところに入った
  rationale: 人を目的語とする πρός と εἰσέρχομαι の組み合わせは、その人々のいる場所へ入り、交わりを持ったことを表す。「のところに入り」は移動と訪問先の双方を自然に伝える。
- source_word: ἄνδρας
  choice: 男たち
  rationale: ἀνήρ はここでは成人男性を指すため、一般的な「人々」ではなく性別を保った。
- source_word: ἀκροβυστίαν ἔχοντας
  choice: 割礼を受けていない
  rationale: 字義的には「包皮を持つ」で、ユダヤ的な契約のしるしを欠く者という非難を表す。単に「異邦人」と解釈せず、原文の契約的・社会的含意を保った。
- source_word: συνέφαγες αὐτοῖς
  choice: 一緒に食事をした
  rationale: 共に食べることを表す複合動詞。日本語として自然で、食卓の交わりに対する非難も明確になる。
theological_decisions:
- issue: ἀκροβυστίαν ἔχοντας を「異邦人」と解釈的に訳すか、無割礼を明示するか
  choice: 割礼を受けていない男たち
  alternative: 異邦人たち
  rationale: 発言者の非難は民族区分だけでなく、契約のしるしである割礼と交わりの境界に焦点を置いているため、その表現を本文に残した。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準語。「食べた」より「食事をした」を用い、食卓を共にしたことへの非難が自然に伝わるようにした。
