  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: ja
  text: そこで私は、主の言葉を思い出した。主はこう言われた。「ヨハネは水でバプテスマを授けたが、あなたがたは聖霊によって[a]バプテスマを授けられる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊の中で」。ギリシア語の前置詞は、手段を表す「によって」とも、領域を表す「中で」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην δὲ
  choice: その時、私は…思い出した
  rationale: ἐμνήσθηνは意味上能動の「思い出した」。δέはここでは強い対比ではなく、物語の展開を示すため「その時」とした。
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: 主の言葉
  rationale: ῥῆμαはここでは後続の引用を指す「言葉」。κύριοςはイエスを指し、その権威を保つ「主」とした。
- source_word: ὡς ἔλεγεν
  choice: 主はこう言われた
  rationale: 日本語では主語を補って引用を導くのが自然である。未完了過去の相は文脈上、習慣的反復を明示せず、過去の発言として自然に表した。尊敬表現は「主」にふさわしい現代標準語の文体を保つ。
- source_word: Ἰωάννης μὲν ἐβάπτισεν ὕδατι
  choice: ヨハネは水でバプテスマを授けたが
  rationale: μὲν…δὲの対比を「…が」で表した。ὕδατιは手段を示す与格として「水で」とし、βαπτίζωは文脈上確立した用語「バプテスマを授ける」とした。
- source_word: ὑμεῖς δὲ βαπτισθήσεσθε
  choice: あなたがたは…バプテスマを授けられる
  rationale: 明示された複数代名詞を「あなたがた」とし、未来受動態を「授けられる」で保持した。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊によって
  rationale: ἐνはこの句で領域・媒体または手段を表しうる。本文では自然な日本語として手段的な「によって」を採用し、別の可能性を脚注に残した。
theological_decisions:
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: ここではイエスの権威ある言葉を指すため、神学的含意と新約での用法を保つ「主」が適切である。
- issue: ἐν πνεύματι ἁγίῳにおけるἐν
  choice: 聖霊によって
  alternative: 聖霊の中で
  rationale: ギリシア語のἐνは手段的にも場所・領域的にも理解できる。日本語本文では自然な「によって」を用いる一方、曖昧さを過度に解消しないよう別訳を脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。引用部は自然な口調としつつ、原文の水と聖霊の対比、未来受動、前置詞の解釈上の幅を保持した。
