source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: ja
  text: 「私はヨッパの町で祈っていました。そのとき、我を忘れた状態で幻を見ました。何かの物[a]が、大きな布のように四隅で下ろされ、天から降りて来て、私のところまで届いたのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何かの器」または「何かの入れ物」とも訳せる。ギリシア語は、物、道具、器、容器などを広く指し得る語を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: 私はヨッパの町で祈っていました
  rationale: 明示された一人称主語と「町」を保ちつつ、継続中の祈りを自然な現代日本語で表した。
- source_word: ἐν ἐκστάσει
  choice: 我を忘れた状態で
  rationale: 通常の意識から外れた幻視状態を表し、「恍惚」が帯びやすい感情的・神秘主義的な含意を避けた。
- source_word: ὅραμα
  choice: 幻
  rationale: 使徒言行録の啓示的な視覚経験を示す標準的で簡潔な訳語。
- source_word: σκεῦός τι
  choice: 何かの物
  rationale: σκεῦοςは物、道具、器、容器などを指し得る広い語なので、後続の比喩より先に形状や用途を限定しないようにした。
- source_word: ὡς ὀθόνην μεγάλην
  choice: 大きな布のように
  rationale: ὀθόνηの大きな布・シーツ状のものという像を、素材を不必要に限定せず自然に表した。
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: 四隅でつり下げられ、天から降りて来て
  rationale: 四つの端で下ろされている像と、天から下降する動きを日本語として分かりやすく示した。
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: 私のところまで届いた
  rationale: ἄχριが示す到達点を明示し、単に近づいたのではなくペトロのいる所まで来たことを表した。
theological_decisions:
- issue: 幻視経験を表すἐκστάσειとὅραμαの区別
  choice: 我を忘れた状態で幻を見ました
  alternative: 恍惚状態で幻を見ました／夢心地になって幻を見ました
  rationale: 意識状態と、そこで見た幻とを別々に保った。「恍惚状態」は感情的高揚や後代の神秘思想を連想させやすく、「夢心地」は夢やぼんやりした状態と誤解され得るため避けた。
translation_notes:
  register: 明瞭で現代的な丁寧体を用いた。ペトロが自分の経験を説明する場面として自然な口調を保ちつつ、幻視の叙述にふさわしい品位を維持した。
