source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: ja
  text: そこで、もしデメトリオと彼と一緒にいる職人たちが、だれかに対して訴えがあるのなら、裁判期日は設けられており[a]、地方総督もいる[b]。互いに告訴すればよい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「法廷は開廷中であり」。ギリシア語の表現は、公式に招集された司法手続き・裁判期日を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「地方総督たちも対応できる状態にいる」。原文は複数形であり、属州の行政上の職務を一般的に指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: だから、もし……のなら
  rationale: οὖνの推論・移行の働きを「だから」で示し、εἰを「もし」、μένを条件節と主節の自然な対応の中で表した。
- source_word: Δημήτριος
  choice: デメトリオ
  rationale: 現代日本語の聖書で一般的なギリシア人名の音写を用いた。
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: 彼と一緒にいる職人たち
  rationale: τεχνῖταιを文脈に合う「職人たち」とし、σὺν αὐτῷを関係性を特定しすぎない形で保持した。
- source_word: ἔχουσιν πρός τινα λόγον
  choice: だれかに対して訴えがある
  rationale: 法的な苦情・案件を持つという慣用的意味を、現代日本語で明瞭に表した。
- source_word: τινα
  choice: だれか
  rationale: 一般的な法的手続きを述べる不定代名詞として自然な表現を選んだ。
- source_word: ἀγοραῖοι ἄγονται
  choice: 裁判は開かれており
  rationale: 公式に設定された法廷・裁判期日が開かれているという制度的意味を示し、受動的な表現も保った。
- source_word: ἀνθύπατοί εἰσιν
  choice: 地方総督たちもいる
  rationale: ローマ属州のproconsulを日本語聖書で通用する「地方総督」とし、原文の複数形を保持した。
- source_word: ἐγκαλείτωσαν
  choice: 告訴すればよい
  rationale: 法廷で正式に訴えを起こす命令の意味を、文脈に即した自然な勧告表現で示した。
- source_word: ἀλλήλοις
  choice: 互いに
  rationale: 相互を相手として法的手続きを取るという原文の相互代名詞を簡潔に保持した。
