id: ACT.19.1
reference: Acts 19:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: ja
  text: アポロがコリントにいた間に、パウロは内陸の地方[a]を通ってエフェソに来て、何人かの弟子[b]に出会った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「内陸の地方」は、「上方の地方」または「奥地」とも訳せる。海岸沿いの道ではなく、高地を通る内陸路を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: ここでは、誰の「弟子」なのかは明示されていない。続く節から、彼らがヨハネの洗礼と関係していたことが分かる。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （独立した定型句としては訳出せず、文全体を自然な物語の移行として表現）
  rationale: 物語を進める定型的な表現である。日本語で「さて、次のようなことが起こった」と逐語的にすると重くなるため、時間節から自然に本文へつなげ、その談話機能を文全体で表した。
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: アポロがコリントにいた間に
  rationale: ἐν τῷ＋不定詞が表す同時性を、明瞭で自然な現代日本語の時間表現で示した。
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: 内陸の地方を通って
  rationale: ἀνωτερικάには字義的に「上方の」という意味があるが、ここでは海岸部に対する内陸・高地の経路を指す可能性が高い。「内陸の地方」は地理的な意味を自然に伝え、別訳は脚注に残した。
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: エフェソに来て
  rationale: 移動先を示すεἰςと、物語の基準点へ来る動きを簡潔に表した。
- source_word: καὶ εὑρεῖν
  choice: 出会った
  rationale: εὑρίσκωの基本義は「見つける」だが、人を目的語とするこの文脈では「出会う」が自然であり、意図的に捜し出したとの含みを不要に加えない。
- source_word: τινας μαθητάς
  choice: 何人かの弟子
  rationale: τιναςの不定性を「何人かの」で表し、μαθητάςは特定の所属を補わず「弟子」とした。
theological_decisions:
- issue: μαθητάςが誰の弟子であるか
  choice: 本文では単に「弟子」とする
  alternative: 「ヨハネの弟子」または「イエスの弟子」と明示する
  rationale: ギリシャ語本文は所属を特定していない。続く節でヨハネの洗礼との関係が明らかになるため、この節の段階では曖昧さを保ち、先回りして特定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文として簡潔かつ品位ある調子にした。原文の地理表現と「弟子」の未特定性は脚注を用いて保持した。
