  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: ja
  text: 彼は、彼らとこのような仕事に携わる職人たちを集めて、言った。「皆さん、ご承知のとおり、私たちの豊かさはこの仕事から来ています。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちはこの商売から富を得ています」。
    reason: ἐργασίαは「仕事」「商売」、εὐπορίαは「豊かさ」「富」を意味し得るため、商業的な意味合いをより明示する訳を示す。
lexical_decisions:
- source_word: συναθροίσας
  choice: 集めて
  rationale: アオリスト分詞の主動詞に先立つ動作を自然な日本語の連用形で表し、招集した意味を保った。
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: このような仕事に携わる職人たち
  rationale: ἐργάτας の「働く者」を文脈に即して「職人たち」とし、περὶ τὰ τοιαῦτα の曖昧さを「このような仕事に携わる」で保った。
- source_word: Ἄνδρες
  choice: 皆さん
  rationale: 男性複数への呼びかけだが、現代日本語で自然かつ丁重な集団呼称とした。文脈上、呼びかけの対象が男性の同業者であることは明らかである。
- source_word: ἐπίστασθε
  choice: ご承知のとおり
  rationale: 聞き手がすでに知っている事柄への訴えを、自然で格調ある日本語にした。
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: この仕事のおかげで
  rationale: 商業活動を指す ἐργασία を「仕事」とし、収入源を表す ἐκ の関係を「おかげで」で明確にした。
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: 私たちが豊かに暮らせる
  rationale: εὐπορία の繁栄・裕福さを、単なる売上や所得に限定せず、現代日本語で自然に表した。
theological_decisions: []
