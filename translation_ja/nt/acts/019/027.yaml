id: ACT.19.27
reference: Acts 19:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: ja
  text: 私たちのこの仕事が悪評を受けるおそれがあるだけではありません。偉大な女神アルテミスの神殿も取るに足りないものと見なされ、全アジアと全世界[a]が拝む彼女の威光[b]も、失われようとしているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「人の住む世界」。このギリシア語は、特に当時広く知られていたローマ世界を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: または「壮麗さ」「偉大さ」。アルテミスの高い地位や華々しい威容を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: おそれがある
  rationale: 危険や可能性にさらされていることを表す現在形の動詞を、自然な現代日本語で示す。
- source_word: τὸ μέρος
  choice: この仕事
  rationale: 直訳的な「部分」ではなく、文脈上、デメトリオたちの職業・生業を指すため。
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: 悪評を受ける
  rationale: 非難や不名誉な評価に至る意味を、商売上・社会上の信用低下を含みうる表現で伝える。
- source_word: ἱερὸν
  choice: 神殿
  rationale: エフェソのアルテミスに属する聖域・神殿を指し、日本語で最も明瞭な呼称である。
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: 取るに足りないものと見なされ
  rationale: 「無に等しいものとして評価される」という受動的な評価の意味を保つ。
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: 彼女の威光まで失われようとしています
  rationale: 圧縮され難解な構文を、アルテミスがその高い地位・壮麗さを奪われようとしている意味に取り、切迫性を示す μέλλειν も反映する。
- source_word: ὅλη ἡ Ἀσία
  choice: 全アジア
  rationale: ここでは一般にローマ属州アジアを指すが、話者の修辞的な広がりを保つ。
- source_word: ἡ οἰκουμένη
  choice: 全世界
  rationale: 人の住む世界、とりわけ当時知られたローマ世界を指しうる語を本文では自然に訳し、限定的な語義は脚注で示す。
- source_word: σέβεται
  choice: 拝んでいる
  rationale: アルテミスへの宗教的崇敬・礼拝を表す語として、発言の文脈に適した自然な表現である。
theological_decisions:
- issue: 異教の宗教用語を、弱めることも是認することもなく訳すこと
  choice: 偉大な女神アルテミス……全アジアと全世界が拝んでいる
  alternative: いわゆる偉大な女神アルテミス……全アジアと全世界が崇敬している
  rationale: これはデメトリオの発言として報告されている。原文にない距離化表現を加えず、話者の主張をそのまま伝える。
- issue: τῆς μεγαλειότητος と καθαιρεῖσθαι の難解な関係
  choice: 彼女の威光まで失われようとしています
  alternative: 彼女自身もその偉大さから引きずり降ろされようとしています
  rationale: 属格の関係には構文上の難しさがあるため、女神の威光・高い地位が失われるという中心的意味を明瞭にしつつ、過度に具体化しない。
translation_notes:
  register: デメトリオの危機感を帯びた演説として、明瞭で格調ある現代標準日本語にした。「女神」「拝む」は話者の異教的主張を報告する語であり、訳文自体の是認を意味しない。
