status: reviewed
revisions:
- from: そればかりか、私たちのこの仕事が悪評を受けるおそれがあるだけでなく、偉大な女神アルテミスの神殿も取るに足りないものと見なされ、さらに、全アジアと全世界[a]が拝んでいる彼女の威光[b]まで失われようとしています。
  to: 私たちのこの仕事が悪評を受けるおそれがあるだけではありません。偉大な女神アルテミスの神殿も取るに足りないものと見なされ、全アジアと全世界[a]が拝む彼女の威光[b]も、失われようとしているのです。
  rationale: 原文の「…だけでなく、…も」という並列を、現代日本語で自然かつ明瞭な二文に整えた。神殿が無価値と見なされることと、アルテミスの威光が失墜しようとしていることの二つの危機を保持し、原文にない神学的評価は加えていない。脚注アンカーと脚注内容は本文の語義に適合している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:52Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な意味は適切に伝えている。ただし、冒頭の「そればかりか…だけでなく」は、οὐ μόνον…ἀλλὰ καὶ（「…だけでなく、…も」）の対比構文として不自然であり、修正が必要である。後半の「彼女の威光まで失われようとしている」は、καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς が表す威光・偉大さの失墜という趣旨を無理なく保持している。
  naturalness: 「そればかりか」と「だけでなく」の併用は現代標準日本語として流れが悪く、文の論理関係も曖昧にする。「…だけではありません。…も…」とすることで、危機感を帯びた演説の調子を保ちながら明瞭になる。相対節の「全アジアと全世界が拝む彼女の威光」は自然である。
  terminology: 「偉大な女神アルテミス」「神殿」「拝む」は、異教の話者の発言を不必要に距離化せずに報告しており適切である。「アジア」は原文の修辞的表現を保つため本文ではこのままとし、「全世界」の限定的語義は脚注で補う。
  issues:
  - severity: medium
    issue: 冒頭の接続構文が不自然
    rationale: 「そればかりか」は追加を導く表現である一方、「…だけでなく」は「…だけでなく、…も」という対比を要求するため、「そればかりか、…だけでなく」は重複して不自然である。原文の οὐ μόνον…ἀλλὰ καὶ を明瞭に反映する構文へ改める。
  revised_text: 私たちのこの仕事が悪評を受けるおそれがあるだけではありません。偉大な女神アルテミスの神殿も取るに足りないものと見なされ、全アジアと全世界[a]が拝む彼女の威光[b]も、失われようとしているのです。
  revised_footnotes:
