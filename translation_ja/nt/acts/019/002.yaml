reference: Acts 19:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: ja
  text: そこで、パウロは彼らに言った。「あなたがたは、信じたとき[a]、聖霊を受けましたか。」彼らは彼に答えた。「いいえ、聖霊がおられるということさえ聞いていません。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたは信じた後で、聖霊を受けましたか」。ギリシア語の分詞は、時間的な関係について多少異なる理解が可能である。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖霊がおられるかどうかさえ聞いていません」。文脈を補って「聖霊が与えられたことさえ聞いていません」と理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: そこでパウロは彼らに言った
  rationale: τέは前の叙述との軽い接続を示すため、「そこで」で自然につないだ。主語は直前の文脈からパウロであり、日本語で明確にした。
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: あなたがたは信じたとき、聖霊を受けましたか
  rationale: アオリスト分詞πιστεύσαντεςと主動詞ἐλάβετεの時間的関係を「信じたとき」とし、厳密な前後関係や同時性を断定しない表現にした。
- source_word: πνεῦμα ἅγιον
  choice: 聖霊
  rationale: この文脈では神の聖霊を指す。日本語の標準的な聖書用語として「聖霊」を用いた。
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: 彼らは答えた
  rationale: δέは応答への穏やかな移行を示す。省略された発話動詞を日本語では自然に「答えた」と補った。
- source_word: Ἀλλ’ οὐδ’
  choice: いいえ、…さえ…ません
  rationale: 強められた否定を、現代日本語の自然な応答と取り立て表現で示した。
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: 聖霊がおられるということさえ聞いていません
  rationale: οὐδὲ εἰの簡潔で曖昧さを含む表現を、存在を述べる直接的な理解に沿って訳した。「与えられた」とは本文に明記されていないため本文には加えない。
theological_decisions:
- issue: 信仰と聖霊を受けることの時間的関係
  choice: 「信じたとき」
  alternative: 「信じた後で」または「信じると同時に」
  rationale: πιστεύσαντεςは時間的関係を示し得るが、詳細な順序をそれ自体で確定しない。特定の教派的結論を持ち込まず、原文の幅を保つ。
- issue: 弟子たちが聖霊について聞いていなかったことの意味
  choice: 「聖霊がおられるということさえ聞いていません」
  alternative: 「聖霊がおられるかどうかさえ聞いていません」または「聖霊が与えられたことさえ聞いていません」
  rationale: 原文は簡潔で、存在・認知を述べる読みと間接疑問的な読みの余地がある。「与えられた」は文脈的解釈として可能だが明示されていないため、脚注にとどめる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話は自然にしつつ品位を保った。「おられる」は聖霊への敬意を自然に表す。脚注記号は該当箇所に置き、原文にある時間的・統語的な曖昧さを保持した。
