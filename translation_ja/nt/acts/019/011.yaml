id: ACT.19.11
reference: Acts 19:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: ja
  text: 神はパウロの手を通して、並外れた奇跡を行っておられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ありふれたものではない力ある業」。
    reason: 「奇跡」「並外れた」とした語句の字義的な形とニュアンスを示すため。
lexical_decisions:
- source_word: Δυνάμεις
  choice: 奇跡
  rationale: 複数形の δύναμις はここでは抽象的な「力」ではなく、神の力が現れる具体的な出来事を指すため、現代日本語で明瞭な「奇跡」とした。
- source_word: τε
  choice: （訳文では独立した接続語を置かない）
  rationale: 前後を結ぶ接続の働きは日本語の物語の流れで十分に伝わり、文頭に「そして」を置くより自然である。
- source_word: οὐ τὰς τυχούσας
  choice: 並外れた
  rationale: 直訳的には「ありふれたものではない」であり、奇跡の並々ならぬ性質を自然な日本語で表すため「並外れた」とした。字義的な表現は脚注に残した。
- source_word: ὁ θεὸς
  choice: 神は
  rationale: ギリシア語で神が明示的な主語であり、奇跡を行う主体が神であることを保持した。
- source_word: ἐποίει
  choice: 行っておられた
  rationale: 未完了過去の継続・反復的な側面を「行っておられた」で示し、神を主語とする文にふさわしい自然で品位ある敬語表現とした。
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: パウロの手を通して
  rationale: διά＋属格の媒介性と「手」という具体的な原文表現を保ち、パウロが神の働きの媒介者であることを明確にした。
- source_word: Παύλου
  choice: パウロ
  rationale: 日本語聖書で定着した標準的な人名表記を用いた。
theological_decisions:
- issue: 奇跡を行う主体
  choice: 神が奇跡を行い、パウロはその媒介者であると訳す。
  alternative: パウロが奇跡を行ったと訳す。
  rationale: ὁ θεὸς が ἐποίει の文法上の主語で、διὰ τῶν χειρῶν Παύλου はパウロを媒介として示す。原文の主体と媒介者の区別を保った。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、聖書本文としての品位を保った。「行っておられた」は継続的な過去の働きと神への敬意を自然に表す。
