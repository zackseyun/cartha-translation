source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: ja
  text: 「実際、私たちは今日のことで暴動のかどで告発されるおそれがあります[a]。この騒然とした集まり[b]について説明できる根拠が何もないからです。」こう言って、彼は集会[c]を解散した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「暴動」は「騒乱」または「反乱」とも訳せる。ギリシア語は重大な市民的騒乱を指すことがあるが、ここでは公衆の騒ぎという直近の文脈から「暴動」とした。
    reason: lexical_alternative
  - marker: b
    text: 「騒然とした集まり」は「騒動」または「群衆」とも訳せる。ギリシア語は混乱した人の集まりを指し、この節後半の、より正式な「集会」とは異なる語である。
    reason: lexical_alternative
  - marker: c
    text: 「集会」と訳した語は、ほかの箇所でしばしば「教会」と訳されるのと同じギリシア語だが、ここではエフェソの市民の集会を指す。
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: おそれがある
  rationale: 現在直面している危険を、自然な現代日本語で表す。
- source_word: ἐγκαλεῖσθαι
  choice: 罪に問われる
  rationale: 行政・司法上の告発を受けるという法的含意を保つ。
- source_word: στάσεως
  choice: 暴動
  rationale: 公の秩序を乱す騒乱を指す文脈に適し、「反乱」ほど政治的意味を強めない。
- source_word: περὶ τῆς σήμερον
  choice: 今日の出来事のことで
  rationale: 省略を含むギリシア語句の指示内容を、日本語で自然に明示する。
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: この騒ぎには何の正当な理由もなく
  rationale: 理由・根拠が存在しないことを表す属格独立構文を、法的文脈も踏まえて訳す。
- source_word: ἀποδοῦναι λόγον
  choice: 申し開きができない
  rationale: 当局に対して説明し責任を果たす慣用的・法的意味を自然な日本語で示す。
- source_word: συστροφῆς
  choice: 騒動
  rationale: 騒然とした群衆の集まりを指し、後続のより正式なἐκκλησίαと区別する。
- source_word: ἐκκλησίαν
  choice: 集会
  rationale: ここでは教会ではなく、エフェソの公的な集まりを指すため。
- source_word: ἀπέλυσεν
  choice: 解散させた
  rationale: 集会を終わらせ、人々を帰らせたという文脈に自然に合う。
- source_word: καὶ γὰρ
  choice: 実際
  rationale: 直前の警告を理由づけて強調する接続表現として、簡潔で自然に訳す。
