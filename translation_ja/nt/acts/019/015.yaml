id: ACT.19.15
reference: Acts 19:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: ja
  text: しかし、悪霊は彼らに答えた。「イエスのことは知っている。パウロのことも知っている[a]。だが、おまえたちは何者だ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、イエスについての「知っている」（γινώσκω）と、パウロについての「知っている」（ἐπίσταμαι）に異なる動詞が使われている。後者は「知っている」「心得ている」などとも訳せるが、ここで意味の違いがどの程度意図されているかは明確でない。
    reason: 二つのギリシア語動詞の語彙上の相違を示しつつ、日本語本文に不自然または過度に解釈的な区別を持ち込まないため。
lexical_decisions:
- source_word: ἀποκριθὲν δὲ ... εἶπεν αὐτοῖς
  choice: しかし、…彼らに答えた
  rationale: 分詞と定形動詞を重ねたギリシア語の慣用的な発話導入を、現代日本語として自然な一つの表現にまとめた。δὲの対照・展開は「しかし」で示し、αὐτοῖςの複数も「彼らに」で保持した。
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: 悪霊
  rationale: この文脈では、邪悪な霊的存在を指す定着した明瞭な日本語である。
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: イエスのことは知っている
  rationale: 前置された目的語の強調を「は」で表し、γινώσκωを基本的な意味の「知っている」とした。
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: パウロのことも承知している
  rationale: 前半とは異なる動詞が使われていることを日本語にも反映しつつ、パウロを認知しているという意味を過度に限定しない表現とした。
- source_word: ὑμεῖς δὲ τίνες ἐστέ;
  choice: だが、おまえたちは何者だ
  rationale: 強調された複数代名詞ὑμεῖςと対照のδὲを「だが、おまえたちは」で表した。「何者だ」は身元を問いただす場面の強い調子に合う。
theological_decisions:
- issue: 悪霊がイエスとパウロを知ることを表す二つの動詞（γινώσκω、ἐπίσταμαι）の区別
  choice: 「知っている」と「承知している」を使い分ける
  alternative: 両方を「知っている」と訳す、または後者を「知っている」と注記する
  rationale: 原文の語の違いを見える形で残す一方、悪霊の知識の程度や性質について、本文以上の教理的差異を読み込まないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。悪霊の発話は、相手を見下して問いただす文脈に合わせて「おまえたち」「何者だ」としたが、過度に俗悪な口調にはしていない。
