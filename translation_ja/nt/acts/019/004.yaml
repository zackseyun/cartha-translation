  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: ja
  text: そこでパウロは言った。「ヨハネは悔い改めの洗礼を授け[a]、自分の後に来る方、すなわちイエスを信じるようにと、人々に告げたのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「洗礼を施した洗礼」という同族語を重ねる表現。日本語では自然な表現として「悔い改めの洗礼を授け」と訳している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: 悔い改めの洗礼を授け
  rationale: 「洗礼を授ける」は現代日本語として自然であり、同族語を重ねるギリシャ語の構文と、μετάνοια が示す洗礼の性格・内容を明確に伝える。
- source_word: τῷ λαῷ
  choice: 人々に
  rationale: 文脈上の集合的な対象を自然に表し、「イスラエルの民」と明示して原文以上に限定することを避ける。
- source_word: λέγων
  choice: 告げた
  rationale: 洗礼を授けることに伴ってヨハネが語った内容を導く分詞として訳した。
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: 自分の後に来る方を信じる
  rationale: πιστεύω と εἰς の結び付きを日本語の「～を信じる」で自然に表し、μετ’ αὐτόν の継起の意味を「自分の後に」とした。
- source_word: ἵνα πιστεύσωσιν
  choice: 信じるようにと
  rationale: 発言内容と意図の双方を含み得る ἵνα の働きを、過度に一方へ限定せず自然な日本語で示す。
- source_word: τοῦτ’ ἔστιν
  choice: すなわち
  rationale: 後に来る方をイエスと明示する説明句を簡潔に表す。
- source_word: εἰς τὸν Ἰησοῦν
  choice: イエスを信じる
  rationale: 前節の πιστεύω を補って理解し、原文にない「キリスト」などの称号は加えない。
theological_decisions:
- issue: ヨハネの洗礼とイエスへの信仰との関係
  choice: ヨハネは悔い改めを特徴とする洗礼を授けながら、後に来るイエスを信じるよう人々に告げた。
  alternative: ヨハネの洗礼そのものがキリスト教的信仰を生じさせた、と解釈的に補う。
  rationale: 構文はヨハネの洗礼と、それに伴う宣言を関連付けるが、洗礼の効力について本文以上の教理的結論は述べないため、その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「方」により指示対象への自然な敬意を示しつつ、原文にない称号や教理的説明は加えていない。
