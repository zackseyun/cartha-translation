  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: ja
  text: 人々はこれを聞くと、主イエスの名によってバプテスマを受けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「主イエスの名へと」。
    reason: εἰς τὸ ὄνομα の方向性を帯びた表現を示すため。本文では日本語として自然な慣用表現を用いる。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞くと
  rationale: アオリスト分詞の時間的な働きを自然な日本語で表した。「これ」はギリシア語では明示されていないが、直前のパウロの言葉を受ける文脈上の目的語として補った。
- source_word: δὲ
  choice: （独立した接続語を置かず）
  rationale: 弱い叙述上の接続であり、日本語では「聞くと」という連接によって流れが十分に示されるため、別に「そして」を加えなかった。
- source_word: ἐβαπτίσθησαν
  choice: バプテスマを受けた
  rationale: アオリスト受動態を、日本語聖書で定着しつつ現代語としても明瞭な表現で訳した。
- source_word: εἰς τὸ ὄνομα
  choice: 名へと
  rationale: εἰς の方向性と、名への帰属・結びつきを含み得る曖昧さを保つため、「名によって」と道具・権威の意味に限定せず「名へと」とした。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの
  rationale: κύριοςをイエスの称号として「主」とし、属格関係を自然な日本語の「の」で表した。
theological_decisions:
- issue: バプテスマと「名」との関係
  choice: 主イエスの名へと
  alternative: 主イエスの名によって
  rationale: 原文の εἰς τὸ ὄνομα が持つ方向性を保持し、後代の典礼的定型や特定の教理的説明に一義化しないようにした。慣用的な訳は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「名へと」は日常語としてはやや異例だが、原文の方向性と神学的な含みを不用意に解消しないために採用した。
