  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: ja
  text: また、魔術を行っていた者のうち相当数の者が、書物を持ち寄り、皆の見ている前で焼いていた。[a] それらの値を合計してみると、銀五万に相当することが分かった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の表現は直訳すると「風変わりなこと」「特殊なこと」を行っていた者となる。この文脈では、呪文などに関わる魔術的な実践を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「銀五万」。どの貨幣単位を指すかは、原文には明記されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: 大勢
  rationale: 人数が相当数に上ったことを自然な現代日本語で表す。
- source_word: τὰ περίεργα πραξάντων
  choice: 魔術を行っていた者
  rationale: 直訳的には「奇異なこと／特殊なことを行った者」だが、魔術文書と悪霊を扱う文脈では魔術的実践を指す。
- source_word: συνενέγκαντες τὰς βίβλους
  choice: 書物を持ち寄り
  rationale: 各人が所有する文書を一か所へ運び集めた具体的な動作を簡潔に示す。βίβλουςは形態を限定せず「書物」とした。
- source_word: κατέκαιον
  choice: 焼いた
  rationale: 未完了過去は進行・継続的様相を持ちうるが、日本語では一連の出来事として「焼いた」が自然であり、行為の実行を明確にする。
- source_word: ἐνώπιον πάντων
  choice: 皆の見ている前で
  rationale: 焼却が公然と行われたことを、明瞭で自然な日本語で表す。
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: その値段を合計すると
  rationale: 文書それぞれの金銭的評価額を計算して合計した意味を表す。
- source_word: ἀργυρίου μυριάδας πέντε
  choice: 銀貨五万枚分
  rationale: μυριάδας πέντεは五万を意味する。ἀργύριονの厳密な貨幣単位は本文に示されないため、「銀貨」としつつ「分」で評価額であることを表した。
theological_decisions:
- issue: τὰ περίεργαが指す実践の性質
  choice: 魔術
  alternative: 呪術／秘術／奇異な行い
  rationale: 直前の悪霊、祈祷師、呪文に関する文脈と、ここで焼かれる書物から、単なる珍しい行為ではなく魔術的実践を指す。ただし特定の後代の宗教分類は持ち込まない。
- issue: 書物焼却の評価
  choice: 行為を叙述するにとどめる
  alternative: 悔い改めや改宗の意味を訳文中で明示する
  rationale: 文脈から宗教的転換は推測できるが、この節自体は書物を持ち寄って焼いた事実を述べており、動機の説明を訳文へ加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文として簡潔かつ品位ある調子にした。「皆の見ている前で」により公開性を保ち、貨幣単位の不確定性は脚注で示した。
