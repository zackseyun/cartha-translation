  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: ja
  text: それからパウロは会堂に入り、三か月にわたって大胆に語り、神の国について論じ、人々を説得し続けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: それからパウロは…入り
  rationale: δέは物語を進める緩やかな接続として「それから」とし、アオリスト分詞は主動詞に先立つ状況を自然な日本語で表した。主語のパウロは直前の文脈から補った。
- source_word: τὴν συναγωγήν
  choice: 会堂
  rationale: ここではユダヤ人のシナゴーグを指す。使徒言行録の文脈で定着した簡潔な訳語「会堂」を用いた。
- source_word: ἐπαρρησιάζετο
  choice: 大胆に語り
  rationale: 未完了形が示す継続的な公然かつ恐れない発言を、「三か月にわたって」と結びつけて表した。
- source_word: ἐπὶ μῆνας τρεῖς
  choice: 三か月にわたって
  rationale: 対格を伴うἐπίが表す継続期間を、自然な現代日本語で明示した。
- source_word: διαλεγόμενος
  choice: 論じ
  rationale: 一方的な演説に限らず、説明や議論を交わす含みを保つため「論じ」とした。
- source_word: πείθων
  choice: 人々を説得しようとした
  rationale: 目的語は原文で明示されないが会堂の聴衆を指すため「人々」を補った。現在分詞は説得の働きかけを表すが、全員が実際に納得したとは断定しないよう意図・努力を表した。
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: 神の国について
  rationale: περί＋属格を「について」、定着した神学的表現βασιλεία τοῦ θεοῦを「神の国」と訳した。
theological_decisions:
- issue: πείθωνが説得の試みを表すか、成立した結果まで含むか
  choice: 説得しようとした
  alternative: 説得した／説得しながら
  rationale: 文脈は働きかけを確実に示す一方、聴衆全員が説得されたという結果までは述べない。日本語では結果の断定を避け、原文の活動面を表す訳が適切である。
- issue: βασιλεία τοῦ θεοῦの意味範囲
  choice: 神の国
  alternative: 神の支配／神の統治
  rationale: βασιλείαには支配・統治の含みもあるが、「神の国」は新約聖書の鍵語として自然で広く理解され、その意味幅を不必要に狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。分詞が連なるギリシア語の構造を、日本語では「入り、…語り、…論じ」と滑らかにつないだ。脚注を必要とする重大な本文異読や、本文だけでは保持できない決定的な語義の曖昧さはない。
