  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: ja
  text: しかし、パウロが民衆の集まり[a]の中に入ろうとしたとき、弟子たちは彼を中に入らせなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「民会の中」とも、「群衆の中」とも訳せる。ギリシア語のδῆμοςは、この市民的な状況では、集まった公衆または市民の公的な集会を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου δὲ
  choice: しかし、パウロが
  rationale: δέの穏やかな対比を「しかし」で示し、固有名Παῦλοςは日本語で定着した「パウロ」とした。
- source_word: βουλομένου εἰσελθεῖν
  choice: 入ろうとしたとき
  rationale: 属格独立構文を自然な時の従属節とし、βούλομαιが表す意志・意図を「入ろうとした」で簡潔に伝えた。
- source_word: εἰς τὸν δῆμον
  choice: 民衆の集まりの中に
  rationale: δῆμοςはこの市民的文脈で、集まった公衆または民会を指し得る。「民衆の集まり」は制度的な民会と一般の群衆の両方に開かれた表現であり、「中に」によってεἰςの方向性を示した。
- source_word: οὐκ εἴων αὐτὸν
  choice: 彼を行かせなかった
  rationale: ἐάωの未完了過去が表す継続的な制止を、自然な日本語で表現した。直前の「入ろうとした」と結びつき、弟子たちがパウロの入場を阻んだことが明瞭になる。
- source_word: οἱ μαθηταί
  choice: 弟子たち
  rationale: μαθηταίの弟子・従う者という意味を保ち、原文にない所有関係を補わなかった。
