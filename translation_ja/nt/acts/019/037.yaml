  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: ja
  text: あなたがたがここに連れて来たこの人たちは、神殿を荒らす者でもなければ、私たちの女神を冒瀆する者でもないのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάγετε
  choice: 連れて来た
  rationale: アオリストの完了した行為を、集会の場に彼らを連行したという文脈に即して自然な日本語で表した。
- source_word: γὰρ
  choice: 文末の「のです」
  rationale: 直前の発言を支える理由説明の機能を、日本語では接続詞を立てず説明調の文末によって自然に示した。
- source_word: τοὺς ἄνδρας τούτους
  choice: ここに…この人たち
  rationale: ἄνδραςを文脈に即して「人たち」とし、τούτουςの指示性とその場にいることを「ここに」「この」で明示した。男性であることは文脈上明らかだが、日本語の「男たち」は不必要に性別を強調するため避けた。
- source_word: οὔτε ... οὔτε
  choice: …でもなければ、…でもない
  rationale: 二重の並列否定を、明瞭で自然な現代日本語の相関表現で保持した。
- source_word: ἱεροσύλους
  choice: 神殿荒らし
  rationale: 神殿の財物を奪う者、または聖所を冒す者を指す語を簡潔に表す。「神殿泥棒」よりも、窃盗に限定されない冒瀆的含意を保てる。
- source_word: βλασφημοῦντας
  choice: 冒瀆する者
  rationale: 女神に対して侮辱的・不敬な言葉を語る行為を、宗教的文脈に適した現代日本語で表した。
- source_word: τὴν θεὸν ἡμῶν
  choice: 私たちの女神
  rationale: 文脈上の指示対象はエフェソのアルテミスであり、θεόςはここでは女性神を指す。日本語では「女神」とすることで誤解なく指示対象を示せる。
theological_decisions:
- issue: アルテミスを指す θεὸν ἡμῶν の訳し方
  choice: 私たちの女神
  alternative: 私たちの神
  rationale: 発言者は異教都市エフェソの書記官で、アルテミスに言及している。「女神」は文脈上の指示対象を正確に伝え、聖書の神への言及との混同を避ける。これは異教信仰への同意ではなく、語彙的・文脈的判断である。
translation_notes:
  register: 公的な集会を鎮める書記官の発言として、明瞭で落ち着いた説明口調にした。「冒瀆」はやや格調のある語だが、宗教的・法的な非難を簡潔かつ正確に伝え、現代の一般読者にも理解可能である。
