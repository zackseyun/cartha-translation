id: ACT.19.10
reference: Acts 19:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: ja
  text: このことが二年間続いたので、アジア州[a]に住むすべての人々が、ユダヤ人もギリシア人も、主のことばを聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「アジア州」は、現代のアジア大陸ではなく、小アジア西部にあったローマ帝国の属州を指す。
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: このことが…続いた
  rationale: ἐγένετο自体は「起こった」「行われた」とも訳せるが、ここでは前節のパウロの教える働きを受け、その継続期間を述べているため、「続いた」が文脈に即して自然である。
- source_word: ἐπὶ ἔτη δύο
  choice: 二年間
  rationale: 時間を表すἐπίと対格は継続期間を示すため、簡潔に「二年間」とした。
- source_word: ὥστε
  choice: ので
  rationale: 先行する活動から生じた結果を示す。日本語では「ので」によって因果・結果の流れを自然に表した。
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: アジア州に住むすべての人々
  rationale: πάνταςの包括性とκατοικοῦνταςの居住の意味を保った。Ἀσίαが当時のローマ属州を指すことを明確にするため「アジア州」とし、注で補足した。
- source_word: ἀκοῦσαι
  choice: 聞いた
  rationale: ὥστεに続くアオリスト不定詞が表す結果を、余分な意味を加えず直接的に訳した。
- source_word: τὸν λόγον
  choice: ことば
  rationale: 「知らせ」も可能だが、使徒言行録に繰り返されるλόγοςの表現と神学的な響きを保つため「ことば」とした。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: 属格をλόγονに結びつけ、「主のことば」とした。κύριοςは定着した尊称である「主」と訳した。
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: ユダヤ人もギリシア人も
  rationale: τε καὶが二つの集団をともに含めることを、自然な日本語の「も…も」で表した。
theological_decisions:
- issue: Ἀσίαの地理的範囲
  choice: 本文を「アジア州」とし、ローマ属州を指すことを注記する
  alternative: 単に「アジア」として注でのみ説明する
  rationale: 使徒言行録におけるἈσίαは通常、現代の大陸ではなく小アジア西部のローマ属州を指す。「州」を補うことで現代日本語での誤解を避けつつ、歴史的指示対象を保った。
- issue: πάνταςの普遍表現
  choice: 「すべての人々」として原文の包括的表現を保持する
  alternative: 広範な伝播を表す慣用的誇張として「至る所の人々」などと緩和する
  rationale: 原文のπάνταςをそのまま保持し、その修辞的範囲を翻訳で狭めたり説明的に解消したりしない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体と「主のことば」という反復的な聖書用語を保った。
