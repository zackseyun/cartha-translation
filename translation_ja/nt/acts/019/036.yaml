  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: ja
  text: したがって、これらのことに反論の余地はないのですから、あなたがたは落ち着いていなければならず、軽率な行動は何一つしてはなりません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: 否定できない
  rationale: 反論や否認の余地がないことを表す。文脈上、町の書記が直前の主張を確定した事実として扱っている語調を、自然な現代日本語で示す。
- source_word: οὖν
  choice: ですから
  rationale: 直前の論述から勧告を導く推論の接続を明確にし、公的な演説にふさわしい丁寧で自然な表現とした。
- source_word: ὄντων τούτων
  choice: これらのことは…のですから
  rationale: 属格絶対構文の理由・根拠を示す働きを、日本語の因果表現で自然に表した。
- source_word: δέον ἐστίν
  choice: …べきであり
  rationale: 必要性・義務を示す非人称表現を、聴衆への勧告として自然かつ十分な強さを持つ日本語にした。
- source_word: κατεσταλμένους ὑπάρχειν
  choice: 冷静でいる
  rationale: 鎮まった状態にあることを表し、単なる沈黙ではなく、興奮を抑えて落ち着いているという文脈上の意味を伝える。
- source_word: μηδὲν προπετὲς πράσσειν
  choice: 軽率なことを何一つしてはなりません
  rationale: 性急で向こう見ずな行動を全面的に禁じる表現。μηδένの否定の範囲と、προπετέςの衝動的・性急な含意を保った。
