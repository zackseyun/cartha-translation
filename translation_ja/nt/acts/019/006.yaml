  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: ja
  text: パウロが彼らに手を置いたとき、聖霊が彼らの上に臨み、彼らは異言[a]を語り、預言した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸言語で」。ギリシア語は「舌」または「言語」を意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: パウロが彼らに手を置くと
  rationale: 属格独立構文のアオリスト分詞を自然な時の節として訳した。「手を置く」は原文の慣用表現を明瞭に保つ。
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: 聖霊が彼らの上に臨み
  rationale: ἔρχομαι と ἐπί が表す、聖霊が彼らの上に来るという方向性を、日本語で自然かつ荘重な「臨む」によって表した。
- source_word: γλώσσαις
  choice: 異言
  rationale: 語義には「舌」と「言語」の両面があり、この箇所だけでは既知の人間言語か別種の発話かを確定できない。「異言」を本文に置き、可能な別訳を脚注で示す。
- source_word: ἐλάλουν τε ... καὶ ἐπροφήτευον
  choice: 異言を語り、預言した
  rationale: 二つの未完了過去動詞が示す継続的な発話を、日本語の物語として自然な並列で表した。τε ... καί の密接な結び付きも「〜し、〜した」で保った。
- source_word: ἐπροφήτευον
  choice: 預言した
  rationale: 動詞が直接示す預言的発話を、定着した明瞭な表現で訳した。
theological_decisions:
- issue: 使徒19:6における γλώσσαις の性質
  choice: 本文では「異言」とし、その具体的性質を限定しない。
  alternative: 「さまざまな言語で」と訳し、理解可能な人間の諸言語を前面に出す。
  rationale: γλῶσσα は「舌」または「言語」を意味し得る。この節だけでは論争のある発話の性質を決定できないため、本文と脚注によって原文の幅を保った。
- issue: 聖霊が彼らの上に来たことと按手との関係
  choice: 出来事の時間的連続を「手を置くと、聖霊が……臨み」と記述する。
  alternative: 按手が聖霊授与を必然的に生じさせたと明示する。
  rationale: 本文は出来事の順序を語るが、その因果関係や後代の教理的仕組みまでは説明していないため、原文を越えた説明を加えない。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で品位ある叙述とした。「異言」「預言」は聖書文脈で定着した語だが、「異言」には脚注を付して原語の語義の幅を示した。
