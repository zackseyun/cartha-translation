  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: ja
  text: こうして町全体は混乱に包まれた。人々は、パウロの旅の同行者であるマケドニア人ガイオとアリスタルコを力ずくで捕らえ[a]、一斉に劇場へなだれ込んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ひったくるように連れ去り」「引きずって連れて行き」。ギリシア語は、二人を力ずくで捕らえることを表す。文脈上、群衆は二人を捕らえたうえで劇場へ突入した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: 町中が混乱に満ち
  rationale: 受動形の意味を保ちつつ、日本語として自然に町全体に混乱が広がったことを表す。「騒動」よりも συγχύσεως の混乱・無秩序という語義を直接反映した。
- source_word: ὥρμησάν
  choice: なだれ込んだ
  rationale: 群衆が勢いよく劇場へ突進した動きを、現代日本語で力強く自然に表す。
- source_word: ὁμοθυμαδόν
  choice: 一団となって
  rationale: この暴動の文脈では調和した一致ではなく、群衆が一斉に行動したことを示すため、「心を一つにして」を避けた。
- source_word: θέατρον
  choice: 劇場
  rationale: 公共の劇場を指す語の標準的な訳。原語以上に限定的な「円形劇場」とはしない。
- source_word: συναρπάσαντες
  choice: 引きずって行き
  rationale: 暴力的に捕らえることと、劇場へ連行する動きの双方を表す。原語には「捕らえる」「ひったくるように連れ去る」という幅もあるため注を付した。
- source_word: Γάϊον καὶ Ἀρίσταρχον Μακεδόνας
  choice: マケドニア人ガイオとアリスタルコ
  rationale: 人名と地理的出自を明確かつ自然な日本語で表した。
- source_word: συνεκδήμους Παύλου
  choice: パウロの旅の同行者
  rationale: パウロと共に旅をしていた者という関係を、簡潔で自然な現代日本語にした。
- source_word: τε
  choice: こうして／接続関係として表現
  rationale: 前節から続く展開と二つの出来事の連結を、日本語の語順と接続によって自然に示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、暴徒の混乱と急激な動きを品位を損なわずに描写した。「一団となって」は ὁμοθυμαδόν を肯定的・宗教的な一致と誤解させないための文脈的表現。
