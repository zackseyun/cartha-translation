base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: ja
  text: そのころ、その道をめぐって、ただならぬ騒ぎが起こった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: 起こった
  rationale: 出来事の発生を表す γίνομαι の事象的な意味を、自然な日本語で明確に伝える。
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: 弱い談話接続辞であり、日本語では「そのころ」から始めることで自然な物語の進行が保たれる。逆接を示す必要はない。
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: そのころ
  rationale: 「その時期に」を意味する時間表現。現代日本語の物語文として簡潔で自然である。
- source_word: τάραχος
  choice: 騒ぎ
  rationale: 混乱や動揺を広く表し、後続の展開に先立って「暴動」と限定しすぎない。
- source_word: οὐκ ὀλίγος
  choice: ただならぬ
  rationale: 直訳的な「小さくない」より自然でありながら、控えめな否定によって大きさを強調する原文の修辞的効果を伝える。
- source_word: περὶ
  choice: をめぐって
  rationale: 騒ぎの争点・原因となった事柄を示す περί＋属格の関係を自然に表す。
- source_word: τῆς ὁδοῦ
  choice: この道
  rationale: 使徒言行録で繰り返しキリスト者の運動を指す呼称。日本語では大文字による固有名詞化ができないため、文脈的な指示性を示す「この」を用い、脚注で説明する。
theological_decisions:
- issue: τῆς ὁδοῦ をキリスト者の運動の呼称としてどう表すか
  choice: この道
  alternative: その道／道
  rationale: 原文の定冠詞を機械的に「その」とせず、既知の運動を指す呼称であることが日本語読者に伝わる「この道」とした。ただし一般的な生き方・道との語義上のつながりは残し、脚注で用法を明示する。
translation_notes:
  register: 明瞭で現代的な標準日本語。物語文として自然な語順を採用しつつ、「道」という使徒言行録特有の表現と、οὐκ ὀλίγος の強調を保った。
