  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: ja
  text: このことは、エフェソに住むすべてのユダヤ人とギリシア人に知れ渡った。そして、彼らすべてに恐れが臨み[a]、主イエスの名があがめられていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「恐れが彼らすべてに降りかかった」。この「恐れ」は畏怖を含むことがある。
    reason: lexical_alternative
  - marker: b
    text: または「主イエスの名が高くされた」「大いに尊ばれていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: このこと
  rationale: 単数の指示代名詞で、直前に記された出来事を指す。日本語では「このこと」が明確で自然。
- source_word: ἐγένετο γνωστὸν
  choice: 知れ渡った
  rationale: 「知られるようになった」という起点的な意味を、出来事が広く周知されたことを表す自然な日本語で示す。
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: ユダヤ人にもギリシア人にも、皆に
  rationale: γνωστόνに関係する与格を「皆に」で表し、τε καὶによって並べられた両集団を「にも……にも」で明示する。
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: エフェソに住む
  rationale: κατοικέωの居住の意味を、現代日本語で簡潔かつ自然に表す。修飾はユダヤ人とギリシア人の双方にかかる。
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: 彼らすべてに恐れが臨み
  rationale: ἐπιπίπτωの「上に降りかかる」という比喩を「臨む」で保ちつつ、聖書的な文体としても理解できる表現にした。
- source_word: φόβος
  choice: 恐れ
  rationale: 文脈上、恐怖だけでなく畏怖を含み得るため、意味を一方に限定しない広い語を選ぶ。
- source_word: ἐμεγαλύνετο
  choice: あがめられていった
  rationale: 未完了過去の継続的・進展的な様相と受動の意味を表し、単なる評判以上に、公に重んじられたことを自然に示す。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 「評判」などに言い換えず、本文の「名」を保持して、その人物、権威、誉れに関わる聖書的な含意を残す。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの
  rationale: κύριοςをキリスト論的称号として「主」と訳し、属格関係を自然な日本語で表す。
theological_decisions:
- issue: イエスを指すκύριοςの訳
  choice: 主
  alternative: 主人
  rationale: この文脈ではイエスへの称号として用いられているため、限定的な社会的関係を連想させる「主人」ではなく、聖書的・キリスト論的な響きを保つ「主」とする。
- issue: τὸ ὄνομαを字義どおり「名」とするか、慣用的に「評判」とするか
  choice: 主イエスの名があがめられていった
  alternative: 主イエスの評判が高まっていった
  rationale: 「名」には人物そのもの、権威、誉れが結びついており、「評判」だけに狭めると本文の神学的・文学的含意が失われるため、「名」を保持する。
- issue: φόβοςを恐怖か畏敬かに限定するか
  choice: 恐れ
  alternative: 畏敬の念
  rationale: 直前の出来事による強い恐怖と、主イエスへの畏怖の双方が文脈上あり得る。本文では一方に限定せず、原語の幅を保つ。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「恐れが臨む」「主イエスの名」のような本文の比喩と聖書的な響きは保持した。「あがめられていった」により、未完了過去の継続・進展を過度に説明的にならず表した。
