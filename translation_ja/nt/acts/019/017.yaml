  naturalness: 「ユダヤ人にもギリシア人にも、皆に知れ渡った」は、「皆に」が前の二つの並列に重なり、係り方がやや不自然である。「エフェソに住むすべてのユダヤ人とギリシア人に知れ渡った」とすると、πᾶσινが両集団全体を修飾することが明瞭で自然になる。
