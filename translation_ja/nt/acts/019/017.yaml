  rationale: 包括的なπᾶσινの係り先を自然な日本語で明確化し、ἐμεγαλύνετοの未完了形を、進展を必要以上に読み込まずに受動的・継続的に表すよう整えた。脚注アンカーは本文中の「恐れ」と「主イエスの名」にそれぞれ対応している。
