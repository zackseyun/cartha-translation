id: ACT.19.9
reference: Acts 19:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: ja
  text: ところが、ある者たちはかたくなになり、従おうとせず[a]、群衆の前で「道」[b]を悪く言った。そこでパウロは彼らから離れ、弟子たちを彼らから分け、ティラノの講堂[c]で毎日論じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信じようとせず」または「説得に応じず」。
    reason: lexical_alternative
  - marker: b
    text: 「道」は、使徒言行録で初期のキリスト者の運動を指す呼び名。
    reason: cultural_note
  - marker: c
    text: 別訳「ティラノの学校」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: かたくなになり
  rationale: 未完了時制が示す継続的・進行的な抵抗を、主体の責任を必要以上に限定せず自然な日本語で表す。
- source_word: ἠπείθουν
  choice: 従おうとせず
  rationale: 不信と不従順の両面を持ちうる語であり、ここでは説得に応じない意志的な抵抗を保つ表現とした。別訳は脚注に示す。
- source_word: κακολογοῦντες
  choice: 悪く言った
  rationale: 公衆の面前で敵対的に非難する行為を、法的な意味の『中傷』に狭めず明瞭に表す。
- source_word: τὴν ὁδὸν
  choice: 「この道」
  rationale: 使徒言行録でイエスに従う運動を指す呼称として用いられることを、引用符によって示す。ギリシア語には指示詞がないため、本文の『この』は日本語で呼称を自然に示す働きをする。
- source_word: ἐνώπιον τοῦ πλήθους
  choice: 群衆の前で
  rationale: 反対行為が公然と行われたことを簡潔に伝える。
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: 彼らから離れ
  rationale: 敵対者たちからの決定的な離脱を自然な日本語で表す。
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: 弟子たちを別にし
  rationale: 弟子たちを反対者から意図的に分けたことを表し、単なる場所の移動には限定しない。
- source_word: καθ’ ἡμέραν
  choice: 毎日
  rationale: 日ごとに繰り返された活動を簡潔に表す。
- source_word: διαλεγόμενος
  choice: 論じた
  rationale: 説明、対話、説得を伴う理性的な討論を示す。日本語の『論じた』は一方的演説にも限定されない。
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: ティラノの講堂で
  rationale: σχολήは学校または講義に用いる場所を指しうる。この文脈では現代の制度的な学校との誤解を避け、『講堂』とした。人名は日本語の慣用に従って音写した。
theological_decisions:
- issue: τὴν ὁδὸνを運動の呼称として訳すか
  choice: 「この道」
  alternative: 一般的な意味の「道」
  rationale: 使徒言行録ではこの表現がイエスに従う人々とその信仰を指す認識可能な呼称として繰り返し現れる。引用符でその用法を示しつつ、後代の教派的名称は持ち込まない。
- issue: ἠπείθουνに含まれる不信と不従順の関係
  choice: 従おうとせず
  alternative: 信じようとせず／説得に応じず
  rationale: 語の意志的・倫理的な響きを本文に保ち、不信または説得拒否という可能な訳は脚注で明示して意味を一つに固定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、叙事本文にふさわしい簡潔で品位ある調子とした。原文では行為者が文脈から明らかだが、日本語での明瞭さのため「パウロ」を補った。
