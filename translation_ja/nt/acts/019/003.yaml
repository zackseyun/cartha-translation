id: ACT.19.3
reference: Acts 19:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: ja
  text: そこで彼は言った。「では、あなたがたは何のバプテスマを受けたのですか。」彼らは言った。「ヨハネのバプテスマです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、問いは「では、何の中へバプテスマを受けたのですか」、答えは「ヨハネのバプテスマの中へです」。原文は問いと答えで同じ前置詞を繰り返している。
    reason: 原文の前置詞εἰςの反復と、その逐語的な方向・領域のニュアンスを示すため。
lexical_decisions:
- source_word: εἶπέν τε
  choice: そこで彼は言った
  rationale: λέγωを「言う」とし、軽い接続を表すτεは、直前の対話を受ける自然な日本語「そこで」で表した。
- source_word: Εἰς τί οὖν
  choice: では、何のバプテスマを
  rationale: οὖνの推論的なつながりは「では」で表した。εἰς τίを機械的に「何の中へ」とすると日本語では不自然になるため、問いの意味と答えとの対応を保って「何のバプテスマを」とした。前置詞εἰςの反復は脚注で示した。
- source_word: ἐβαπτίσθητε
  choice: バプテスマを受けたのですか
  rationale: アオリスト受動形を、日本語で儀式を受けることを自然に表す「バプテスマを受ける」と訳した。
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: ヨハネのバプテスマです
  rationale: Ἰωάννουをβάπτισμαにかかる属格として素直に「ヨハネのバプテスマ」とした。日本語では質問から述語を補えるため、重い反復を避けて「です」とした。
- source_word: βάπτισμα
  choice: バプテスマ
  rationale: 文脈上、ヨハネに結びつく特定の儀式を指す定着した聖書用語として「バプテスマ」を用いた。「洗いの儀式」などの説明的な言い換えは避けた。
theological_decisions:
- issue: 問いと答えで反復されるεἰςを本文にどの程度表すか
  choice: 本文では自然な日本語として「何のバプテスマ」「ヨハネのバプテスマ」とし、反復は脚注で明示する
  alternative: 「何の中へバプテスマを受けたのか」「ヨハネのバプテスマの中へ」と逐語的に訳す
  rationale: 逐語訳は日本語では意味が取りにくく、特定のバプテスマ神学をかえって連想させかねない。本文の問いと答えの対応を明瞭にしつつ、原文が同じ前置詞を反復する事実を脚注に残すことで、原文の概念的な含みを断定せずに保った。
translation_notes:
  register: 現代の一般読者に理解しやすい丁寧な会話文とした。「洗礼」ではなく、原語βάπτισμαとの対応が明確で、この文脈の儀式名として中立性を保ちやすい「バプテスマ」を採用した。
