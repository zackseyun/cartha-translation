  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: ja
  text: 群衆の中から、アレクサンドロスが前に出された[a]。ユダヤ人たちが彼を前に押し出したためである。アレクサンドロスは手で合図し、集会[b]に向かって弁明しようとした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆の中から、アレクサンドロスを前に連れ出した。ユダヤ人たちが彼を前に出したのである」。ギリシア語では、アレクサンドロスを公衆の前に出すことを表す、意味の近い二つの動詞が用いられている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「民衆」。ここでの語には、公的に集まった市民という意味合いがあり、前半の「群衆」とは別の語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: 前に連れ出した
  rationale: ἐκ τοῦ ὄχλουおよび人を目的語とするこの場面では、群衆の中から公の場へ連れ出す動作を表す。「前に」を補い、続く類義動詞とのつながりを明確にした。
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: ユダヤ人たちが彼を押し出したのである
  rationale: 属格独立構文を、先の出来事の事情を説明する独立文として自然な日本語にした。「押し出した」は、公衆の前へ出したという状況的な力を示しつつ、暴力までは含意しない。
- source_word: κατασείσας τὴν χεῖρα
  choice: 手で合図し
  rationale: 注意を引くための手の動作を簡潔に表した。静粛を求めた可能性はあるが、原文に明示されないため訳文には加えなかった。
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: 弁明しようとした
  rationale: 意志・企図を示し、実際に弁明を遂行したとは述べない未完了形の含みを保った。「弁明」は公の場で自己の立場を説明する語感を伝える。
- source_word: τῷ δήμῳ
  choice: 集会に向かって
  rationale: δῆμοςの公的・市民的な集まりという含みを保ち、前半の一般的なὄχλος「群衆」と区別した。「に向かって」により、集会を相手に発言しようとしたことを自然に示した。
- source_word: ὄχλου
  choice: 群衆
  rationale: 一般の人だかりを表す自然な現代日本語であり、後のδῆμοςとの語義上の違いも保てる。
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: アレクサンドロ
  rationale: ギリシア語名の日本語での標準的な音写を用いた。
