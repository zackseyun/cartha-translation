source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: ja
  text: すると、悪い霊が宿っていたその男は彼らに飛びかかり[a]、その二人を圧倒し[b]、彼らに打ち勝ったので、彼らは裸で、傷を負ったまま、その家から逃げ出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼らに襲いかかり」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語本文はここで「二人」と明記しています。周辺の文脈ではスケワの息子たちが二人より多く言及されていますが、本文のこの表現をそのまま訳しています。
    reason: textual_narrative_tension
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: 飛びかかり
  rationale: 突然跳びかかって襲う激しい動作を表し、文脈に合う自然で鮮明な日本語とした。
- source_word: ὁ ἄνθρωπος
  choice: その男
  rationale: 男性単数の人物を指し、直前の文脈を受けるため「その男」とした。
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: 悪い霊が宿っていた
  rationale: 霊がその男の内にいたという原文の表現を保ちつつ、現代日本語として自然にした。「取りつかれた」という専門化した表現は避けた。
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: 悪い霊
  rationale: この悪霊追放の文脈における πονηρός の有害で邪悪な性格を、明瞭で一般的な表現にした。
- source_word: κατακυριεύσας
  choice: 圧倒して
  rationale: 相手を力で制圧し、支配下に置く意味を簡潔に表す。
- source_word: ἀμφοτέρων
  choice: その二人
  rationale: 原文が明示する「双方、二人とも」を保持し、前後との緊張を解消しない。
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: 打ち負かした
  rationale: 彼らに対して優勢となり、勝ったことを自然な日本語で表す。直前の「圧倒して」と意味は近いが、原文の二段階の叙述を残した。
- source_word: γυμνούς
  choice: 裸のまま
  rationale: 衣服がない結果状態を明示する原文を、そのまま自然に表した。
- source_word: τετραυματισμένους
  choice: 傷を負って
  rationale: 傷つけられ、その状態にあることを示す完了受動分詞の結果性を表した。
- source_word: ἐκφυγεῖν
  choice: 逃げ出した
  rationale: 危険から逃れ、家の外へ出たという移動と脱出の両面を簡潔に表す。
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: その家から
  rationale: 既出の特定の家を出たことを、自然な日本語の起点表現で示した。
theological_decisions:
- issue: 悪い霊と男との関係の表現
  choice: 悪い霊が宿っていたその男
  alternative: 悪い霊に取りつかれた男
  rationale: 原文は霊が男の内にいたと述べる。「宿っていた」はその空間的表現を保ち、後代の専門用語によって意味を限定しすぎない。
- issue: より大きな集団との関係における ἀμφοτέρων の範囲
  choice: その二人
  alternative: 彼ら全員
  rationale: 周辺文脈ではスケワの息子たちが複数言及される一方、この節の本文は明確に「二人とも」とする。その緊張を均さず、原文どおり二人を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙事の勢いを保つため二文に分けた。「悪霊」ではなく原文の構造に近い「悪い霊」とし、「圧倒して打ち負かした」によって κατακυριεύσας と ἴσχυσεν κατ’ αὐτῶν の重なりを消さずに表現した。
