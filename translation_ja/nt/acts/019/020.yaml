id: ACT.19.20
reference: Acts 19:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: ja
  text: このようにして、主の言葉は力強く広まり、勢いを増していった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主の言葉は力をもって広まり、強くなっていった」。κατὰ κράτος は「力強く」「力をもって」と訳すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: このようにして
  rationale: 直前に述べられた出来事を受け、その結果または進展の仕方を示す。日本語として自然で、推論的・結果的な力を保つ。
- source_word: κατὰ κράτος
  choice: 力強く
  rationale: 力や強い働きを表す慣用句として副詞的に訳した。「大いに」も可能だが、「力強く」は κράτος の力の含意を明確に伝える。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: ギリシア語どおり称号を「主」とし、本文では指示対象を「イエス」と明示しない。
- source_word: ὁ λόγος
  choice: 言葉
  rationale: ここでは宣べ伝えられた福音の知らせを指すが、使徒言行録で繰り返される表現を保つため「言葉」とした。
- source_word: ηὔξανεν
  choice: 広まり
  rationale: 「成長する、増大する」という継続的な進展を、宣教の知らせについて自然な日本語で表す。未完了過去の継続性は文末の「ていった」にも反映した。
- source_word: ἴσχυεν
  choice: 勢いを増していった
  rationale: 「強くある、力を持つ」の意味を保ちつつ、言葉が有効に前進していたことを自然に表す。「勝利を収めた」では解釈を強く限定しすぎるため避けた。
theological_decisions:
- issue: τοῦ κυρίου における「主」の指示対象
  choice: 本文では単に「主」と訳す。
  alternative: 「主イエス」
  rationale: 文脈上は主イエスを指す可能性が高いが、ギリシア語本文は「主」とだけ述べるため、その表現上の余地を保った。
- issue: ἴσχυεν が表す言葉の進展
  choice: 「勢いを増していった」とし、力ある前進を表す。
  alternative: 「勝利を収めていた」「打ち勝っていた」
  rationale: 文脈的には優勢になる意味を含み得るが、ἰσχύω の基本的な「強くある」という幅を保ち、勝利という解釈に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。二つの未完了過去動詞が示す継続的な進展を「広まり、勢いを増していった」で表し、同義的な重なりも残した。
