source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: ja
  text: ところが、町の書記官は群衆を静めてから、こう言った。「エフェソの皆さん、エフェソの町が、偉大なアルテミスと天から落ちたもの[a]の神殿の守護を担う町[b]であることを、知らない者がいったいどこにいるでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天から落ちた像」とも訳せる。この語は、空から落ちたと信じられていた物を指す。ここではアルテミスに関係する祭儀上の像または聖物を指す可能性があるが、原文は対象を明示していない。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「神殿の守護者」。この語は、神殿や祭儀の管理・保護を担うものとして認められた都市を表す称号である。「偉大なアルテミス」と「天から落ちたもの」は原文で並列されており、両者が一つの神殿で共に祭られたことまでは本文で明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: 静めてから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、自然な日本語で時間的な順序を明示した。
- source_word: ὁ γραμματεὺς
  choice: 町の書記官
  rationale: ここではユダヤ教の律法学者ではなく、エフェソの都市行政を担う官職を指す。
- source_word: Ἄνδρες Ἐφέσιοι
  choice: エフェソの皆さん
  rationale: 市民への公的な呼びかけとして、現代日本語で自然かつ品位ある表現を採った。男性形の直訳「エフェソの男たち」は、この演説場面では不自然に性別を強調する。
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: 知らない者がいったいどこにいるでしょうか
  rationale: 誰もが知っているという反語の力を、自然な日本語の修辞疑問で保持した。
- source_word: τὴν Ἐφεσίων πόλιν
  choice: エフェソ人の町
  rationale: 属格を明示しつつ、日本語として理解しやすい形にした。
- source_word: νεωκόρον
  choice: 神殿の守護者
  rationale: 都市が神殿または祭儀の公認の管理・保護者であることを表す称号。単なる建物の番人と誤解されにくい表現を選んだ。
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: 偉大なアルテミス
  rationale: エフェソで用いられた尊称を、そのまま話者の言葉として訳した。
- source_word: τοῦ διοπετοῦς
  choice: 天から落ちたもの
  rationale: 語そのものは空から落ちた対象を指すが、像か石かを明示しない。本文では曖昧さを保ち、補足を脚注に置いた。
theological_decisions:
- issue: 異教の祭儀に関する主張の扱い
  choice: 話者の主張として「偉大なアルテミスと天から落ちたもの」と率直に訳す
  alternative: 「天から落ちたアルテミス像」または「ゼウスから落ちた聖石」と具体化する
  rationale: この節は町の書記官の発言を報告しており、語り手がその宗教的主張を真実として承認しているわけではない。また、διοπετέςの対象を像や石に限定せず、原文の曖昧さを残した。
- issue: νεωκόροςが修飾する範囲
  choice: 町がアルテミスおよび天から落ちたものを祭る神殿の守護者であると表現する
  alternative: 町がアルテミスの神殿だけを守護し、天から落ちたものを別個に守護すると表現する
  rationale: 属格句の並列を保ちつつ、日本語では両者が同じ祭儀・神殿に結びつくことが自然に伝わるようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用い、公的演説にふさわしい品位を保った。「エフェソの皆さん」は呼びかけとして自然にし、修辞疑問には丁寧体を用いた。異教的主張は話者の発言として忠実に示し、διοπετέςの実体については本文で断定しない。
