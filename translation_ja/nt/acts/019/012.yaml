id: ACT.19.12
reference: Acts 19:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: ja
  text: そのため、パウロの体[a]から手ぬぐいや仕事用の前掛け[b]までが病人のもとへ運ばれると、病気は彼らから去り、悪霊も出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の肌から」。
    reason: χρώςは字義的には体の表面、すなわち「皮膚、肌」を意味する。本文では自然な日本語として「体」とした。
  - marker: b
    text: 「前掛け」とも訳せる。原語は、手仕事の際に身に着ける作業着または前掛けを指す。
    reason: 珍しい借用語であり、具体的な衣類の形には幅があるため。
lexical_decisions:
- source_word: ὥστε
  choice: そのため
  rationale: 直前に述べられた並外れた奇跡の結果を導く接続表現として、結果の意味を自然な日本語で示す。
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: 病人のもとへ
  rationale: 病んでいる人々を指す分詞と、品物がそこへ運ばれる方向性を明確かつ自然に表す。
- source_word: ἀποφέρεσθαι
  choice: 運ばれる
  rationale: パウロのもとから病人のもとへ品物が持って行かれたことを、受動の形を保ちながら自然に表現する。
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: パウロの体から
  rationale: χρώςの字義は「皮膚、肌」だが、この文脈では身体に接していた物を指すため、「体から」が日本語として自然である。字義は脚注に残す。
- source_word: σουδάρια
  choice: 手ぬぐい
  rationale: 汗や顔を拭くための布を指す語として、簡潔で理解しやすい対応語を選ぶ。
- source_word: σιμικίνθια
  choice: 仕事用の前掛け
  rationale: 手仕事の際に用いる前掛けまたは作業着を指す語であるため、用途を明示しつつ過度な説明を避ける。
- source_word: ἀπαλλάσσεσθαι
  choice: 去り
  rationale: 病気が人々から離れたという原文の描写を、そのまま自然な日本語で表す。
- source_word: νόσους
  choice: 病気
  rationale: 複数形で種々の疾病を指すが、日本語では集合的に「病気」とするのが自然である。
- source_word: πνεύματα τὰ πονηρά
  choice: 悪霊
  rationale: 敵対的な霊的存在を表す定着した明瞭な訳語である。
- source_word: ἐκπορεύεσθαι
  choice: 出て行った
  rationale: 悪霊が人から退出するという新約聖書で一般的な表現を、直接的に保つ。
theological_decisions:
- issue: パウロの体に接した布を介して起きた癒やしと悪霊の退出の性質
  choice: 物品が運ばれた結果として病気が去り、悪霊が出て行ったという物語の記述をそのまま訳す。
  alternative: 聖遺物崇敬や特定の秘跡的効力を示唆する、または出来事を単なる象徴として弱める。
  rationale: 本文は奇跡的な出来事を率直に述べるだけで、その仕組みや後代の宗教実践について説明していない。そのため、特定の教理を付加せず、超自然的主張も弱めない。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述体とした。「そのため」で前節との結果関係を示し、「まで」で通常なら意外に思われる品物さえ用いられたという καί の強調を表した。
