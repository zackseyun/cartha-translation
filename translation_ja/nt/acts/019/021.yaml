id: ACT.19.21
reference: Acts 19:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: ja
  text: これらのことが終わった後、パウロは霊において[a]、マケドニアとアカイアを通ってからエルサレムへ行くことを心に決めた。そして、「そこに着いた後、私はローマも訪れなければならない」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊において」は、「自分の霊において」、すなわち「心のうちで」とも訳せる。ギリシア語は、パウロ自身の内なる決意を指すとも、聖霊の導きを指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: 終わると
  rationale: ここでは、先に述べられた一連の出来事が完了したことを表す。預言の「成就」ではなく、事柄が一区切りついたという自然な日本語にした。
- source_word: ἔθετο
  choice: 心に決めた
  rationale: 中動態の慣用的な意味である、自ら目的を定めるという強い意志を、明瞭で自然な日本語で表した。
- source_word: ἐν τῷ πνεύματι
  choice: 御霊によって
  rationale: ルカ文書における聖霊の導きという用法を踏まえて本文では聖霊を指す訳を採用した。ただし、パウロ自身の内なる思いを指す可能性も脚注に残した。
- source_word: διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν
  choice: マケドニアとアカイアを通って
  rationale: 分詞がエルサレムへの移動に先立つ経路を示すため、日本語では旅程として自然な「通って」とした。
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: エルサレムへ行こう
  rationale: 移動を表す一般的な動詞を、決意の内容として自然につながる形で訳した。
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: そこへ行った後
  rationale: 同地に到着し、そこにいることになった後という時間関係を、文脈上明瞭な日本語で表した。
- source_word: δεῖ με
  choice: 私は…なければならない
  rationale: ルカ文書でしばしば神的な目的を帯びる必要性を、単なる希望ではなく強い必然として保持した。
- source_word: Ῥώμην ἰδεῖν
  choice: ローマも見る
  rationale: ἰδεῖν の字義を保ちつつ、目的地としてローマを訪れる含意も自然に伝わる表現とした。
theological_decisions:
- issue: ἐν τῷ πνεύματι の指示対象
  choice: 御霊によって
  alternative: 自分の霊において／心のうちで
  rationale: ギリシア語には所有代名詞がなく、聖霊の導きとパウロ自身の内的決意の双方が文法上可能である。本文ではルカ文書の語法を踏まえて聖霊を採用し、 genuine ambiguity を脚注で保持した。
- issue: δεῖ が表す必要性
  choice: 見なければならない
  alternative: 見る必要がある
  rationale: δεῖ の強い必然性を保った。これが神の計画による必要性か、パウロ自身が感じた使命上の必要性かは本文で明示せず、原文の含みを残した。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、使徒言行録にふさわしい落ち着いた文体とした。「御霊」は聖霊を指す伝統的で簡潔な表現だが、指示対象の曖昧さは脚注で明示した。地名は現代日本語の標準的な表記を用いた。
