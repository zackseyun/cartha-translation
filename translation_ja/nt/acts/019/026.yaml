  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: ja
  text: あなたがたが見聞きしているとおり、このパウロは、エフェソだけでなく、アジア州[a]のほとんど全域で、かなり大勢の人々を説き伏せて考えを変えさせ、「人の手で造られるもの[b]は神々ではない」と言っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「アジア」は、現在のアジア大陸ではなく、エフェソを含むローマ帝国のアジア属州を指す。
    reason: historical_geography
  - marker: b
    text: 直訳に近くは「手を通して生じるもの」。人の手仕事で造られた偶像を指す。
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: あなたがたが見聞きしているとおり
  rationale: 二つの現在形による、聴衆自身が目にし耳にしている公然の事実への訴えを、自然な現代日本語の「見聞きしている」で表した。
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: エフェソだけでなく、アジア州のほとんど全域で
  rationale: 属格を場所の意味に解し、σχεδόνを「ほとんど」、当時のἈσίαをローマ属州として「アジア州」とした。
- source_word: ὁ Παῦλος οὗτος
  choice: このパウロ
  rationale: 指示詞οὗτοςが演説中に帯びる突き放した調子を、過度に侮蔑的な語を加えずに保った。
- source_word: πείσας μετέστησεν
  choice: 説き伏せて離反させ
  rationale: 説得によって従来の立場から移らせたという動作の関係を保つ。「惑わした」では話者の評価を強く加えすぎるため避けた。
- source_word: ἱκανὸν ὄχλον
  choice: かなり多くの人々
  rationale: ὄχλοςを文脈上の人数として自然に表し、ἱκανόςが示す無視できない規模を「かなり多く」で伝えた。
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: 人の手で造られるもの
  rationale: 人間の手仕事によって生じる偶像を指す慣用的表現を、対象を勝手に限定しすぎない形で訳した。
- source_word: οὐκ εἰσὶν θεοὶ
  choice: 神々ではない
  rationale: 複数形θεοίを保ち、人が造った対象の神的地位を直接否定する述語表現とした。
theological_decisions:
- issue: 人の手で造られた対象への否定の範囲
  choice: 「人の手で造られるものは神々ではない」と、その神的地位を否定する
  alternative: 「手造りの神々は本当の神々ではない」
  rationale: 原文は人工物が神々であることを否定する。「本当の」を補うと、原文にない限定や神々の分類を持ち込むおそれがあるため避けた。
- issue: μετέστησενが表す転向の評価
  choice: 離反させ
  alternative: 惑わした
  rationale: 話者はパウロを非難しているが、動詞自体は立場を移らせることを表す。「惑わした」は真偽について翻訳者の判断を強く加えるため採らなかった。
translation_notes:
  register: 告発演説としての勢いと「このパウロ」という突き放した調子を保ちつつ、一般の読者に明瞭な現代標準語とした。「見聞きしている」「説き伏せて離反させ」により、原文の修辞的な訴えと動作の流れを自然に表現した。
