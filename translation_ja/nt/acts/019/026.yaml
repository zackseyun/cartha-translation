  to: あなたがたが見聞きしているとおり、このパウロは、エフェソだけでなく、アジア州[a]のほとんど全域で、かなり大勢の人々を説き伏せて考えを変えさせ、「人の手で造られるもの[b]は神々ではない」と言っています。
