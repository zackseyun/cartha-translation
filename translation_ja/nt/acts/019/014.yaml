base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: ja
  text: ユダヤ人の祭司長であるスケワという人には七人の息子がいて、彼らはこれを行っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大祭司」とも訳せる。ギリシア語は、大祭司を指すことも、高位の祭司や祭司長をより広く指すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: いて
  rationale: 未完了形の存在表現を、物語を自然に継続する日本語で表した。δέはここで強い対比ではないため、独立した接続語を加えなかった。
- source_word: τινος Σκευᾶ
  choice: スケワという人
  rationale: τινοςが示す不特定性を保ちつつ、「あるスケワ」より自然な現代日本語とした。
- source_word: Ἰουδαίου
  choice: ユダヤ人の
  rationale: ここでは地理的出身に限定せず、民族的・宗教的帰属を表す。
- source_word: ἀρχιερέως
  choice: 祭司長
  rationale: 単数の大祭司という公職に断定せず、高位祭司層の人物をも指し得る語義を反映した。
- source_word: ἑπτὰ υἱοὶ
  choice: 七人の息子
  rationale: 数と親子関係を明瞭で自然な日本語にした。
- source_word: τοῦτο ποιοῦντες
  choice: 彼らもこれを行っていた
  rationale: 直前に述べられた行為を指す単数指示詞と、継続的な行為を表す分詞を反映した。「も」は文脈上、同じ行為への参与を自然に示す。
theological_decisions:
- issue: スケワに関するἀρχιερεύςの意味
  choice: 祭司長
  alternative: 大祭司
  rationale: この語は大祭司を指すこともあるが、高位祭司層の者を広く指す場合もある。スケワが唯一の公職としての大祭司だったと断定せず、原文の語義の幅を保つため本文では「祭司長」とした。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述調。「彼らも」を補って直前の文脈とのつながりを自然にし、脚注記号[a]を本文中に明示した。
