id: ACT.19.39
reference: Acts 19:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: ja
  text: しかし、さらに何かを求めるなら、正式な民会[a]で解決されることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「法にかなった民会」または「正規の集会」とも訳せる。ギリシア語は、法に従って正式に開かれる市民の集会を指しており、教会のことではない。
    reason: 語義上の別訳と、非教会的な市民文脈の明確化
lexical_decisions:
- source_word: περαιτέρω
  choice: これ以上
  rationale: 現在扱われている事柄に加えて、さらに先のことを表す比較的な意味を、自然な現代日本語で示す。
- source_word: ἐπιζητεῖτε
  choice: 求める
  rationale: 「探し求める」「要求する」「追求する」という幅を保ち、文脈以上に法的な申し立てへ限定しない。
- source_word: ἐννόμῳ
  choice: 正規の
  rationale: 法に従って正式に招集された市民集会を指すため、「合法的な」より自然で、通常の手続きに沿った公的集会という意味を伝える。
- source_word: ἐκκλησίᾳ
  choice: 民会
  rationale: ここではキリスト教会ではなく、エフェソの市民による公的集会を指す。「民会」は都市の政治的・市民的な集会であることを明確にする。
- source_word: ἐπιλυθήσεται
  choice: 解決されることになります
  rationale: 未来受動形を保ちつつ、案件が正式な手続きによって処理・解決されるという文脈を自然に表す。
- source_word: τι
  choice: 何か
  rationale: 条件節中の不定代名詞として、追加の案件を限定せずに表す。
theological_decisions:
- issue: 非キリスト教的な市民文脈におけるἐκκλησίαの訳語
  choice: 民会
  alternative: 集会／教会
  rationale: 指示対象はエフェソのキリスト者共同体ではなく、法に従って招集される市民の公的集会である。「教会」は誤解を招き、「集会」だけでは市民的性格が弱いため、「民会」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「正規の民会」により、法的に正式な市民集会という背景を簡潔に示した。
