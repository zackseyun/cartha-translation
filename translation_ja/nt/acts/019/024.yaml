source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: ja
  text: というのも、デメテリオというある銀細工人が、アルテミスの銀製の神殿[a]を作り、職人たちに少なからぬ仕事[b]をもたらしていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アルテミスの銀製の小神殿」または「アルテミス神殿の銀製模型」。ギリシア語は「神殿、聖所」を意味する語を用いており、ここではアルテミス崇拝に関係する小型の銀製品を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「少なくない仕事」。相当な仕事量、商売、または収益を意味する控えめな言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: というのも……からである
  rationale: 直前の叙述に理由や背景を加える接続機能を、自然な現代日本語で明示した。
- source_word: Δημήτριος τις ὀνόματι
  choice: デメトリオという
  rationale: 人名をギリシア語から音写し、τιςとὀνόματιによる新人物の導入を自然な日本語にまとめた。
- source_word: ἀργυροκόπος
  choice: 銀細工人
  rationale: 銀を加工する職人を表す、明確で一般的な日本語である。
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: アルテミスの銀製の小神殿
  rationale: ναόςの神殿・聖所という意味を保ちつつ、商業的に製作される小型の品であるという文脈上の意味を示した。形状を『模型』と断定せず、脚注で語義の幅を明らかにした。
- source_word: παρείχετο
  choice: もたらしていた
  rationale: 未完了過去の継続的・習慣的な働きを『していた』で表し、仕事を職人たちに提供していたという関係を自然に訳した。
- source_word: τοῖς τεχνίταις
  choice: 職人たちに
  rationale: この商売に携わる熟練労働者を、簡潔で自然な語で表した。
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: 少なからぬ仕事
  rationale: 原文の緩叙法を保持した。ἐργασίαには仕事・商売・収益の意味領域があるため、本文では過度に『利益』へ限定しなかった。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。説明を導くγάρを文頭と文末の呼応で表し、原文の緩叙法とναόςの解釈上の幅は本文と脚注で保持した。
