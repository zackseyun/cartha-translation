id: ACT.19.13
reference: Acts 19:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: ja
  text: さて、各地を巡り歩くユダヤ人の悪霊払いをする者たちの中にも、悪い霊につかれている人々[a]に対して主イエスの名を唱えようとした者たちがいた。彼らは、「パウロが宣べ伝えているイエスによって、おまえたちに厳命する[b]」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「悪い霊を持っている人々」。
    reason: 原文は人々が悪い霊を「持つ」と表現しており、霊の影響や支配の程度を明示していないことを示すため。
  - marker: b
    text: または「イエスによって、おまえたちを誓わせる」。
    reason: ὁρκίζωは、相手を誓いのもとに置いて厳粛に命じることを表すため。
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: 唱えようとする者たちがいた
  rationale: 試みる、着手するという意味を保ちつつ、日本語の文脈では「名を唱えようとする」と自然に表現した。成功したとは含意しない。
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: 各地を巡り歩くユダヤ人の祈祷師たちの中にも…者たちがいた
  rationale: τινεςを一部の者、καίを「にも」、περιερχομένωνを「各地を巡り歩く」とした。ἐξορκιστήςは悪霊を追い払う者を指すが、現代日本語で過度に専門的にならない「祈祷師」を採用した。
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: …に向かって…名を唱える
  rationale: 単に名を口にするのでなく、悪霊に対してその名を用いる祈祷的行為を表す。「名によって命じる」と重ねず、原文の「名」を明示した。
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: 悪い霊につかれている人々
  rationale: 字義は「悪い霊を持つ人々」。日本語として明瞭な表現にしたが、完全な支配を断定する「悪霊に取りつかれた」より抑制的な「つかれている」とした。字義的表現は脚注に示す。
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの名
  rationale: κύριοςの敬称・神学的重みを「主」で保ち、日本語で定着した「主イエス」とした。
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: イエスによって、おまえたちに命じる
  rationale: ὁρκίζωは誓いによって厳粛に命じること。現代の読者に意味が通る「…によって命じる」を本文に置き、誓約的なニュアンスを脚注で補った。複数形ὑμᾶςは霊たちへの呼びかけとして「おまえたち」とした。
- source_word: ὃν Παῦλος κηρύσσει
  choice: パウロが宣べ伝えている
  rationale: κηρύσσειの公に告げ知らせる意味を、聖書文体として明瞭で自然な「宣べ伝える」で表した。
theological_decisions:
- issue: τοῦ κυρίου Ἰησοῦにおけるκύριοςの訳
  choice: 主イエス
  alternative: 主人であるイエス
  rationale: ここでのκύριοςはキリストへの称号として敬意と神学的含意を持つため、定着した「主」を用いた。
- issue: 悪い霊と人との関係をどこまで明示するか
  choice: 悪い霊につかれている人々
  alternative: 悪い霊に完全に支配された人々／悪い霊を持つ人々
  rationale: 原文は字義的には「悪い霊を持つ人々」で、支配の程度までは明示しない。自然な日本語にしながら、原文以上に状態を限定しない表現を選んだ。
- issue: ὁρκίζωの誓約的な強さ
  choice: 命じる
  alternative: 誓って命じる／厳命する
  rationale: 本文の可読性を優先して「命じる」とし、その命令がイエスの名による厳粛な誓約・命令であることを脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら、物語の厳粛さを保つ文体。「祈祷師」はἐξορκιστήςの役割を一般読者に伝え、「おまえたち」は悪い霊に向けた複数形の強い呼びかけを表す。
