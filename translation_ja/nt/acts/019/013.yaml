revisions:
- from: ところが、各地を巡り歩くユダヤ人の祈祷師たちの中にも、悪い霊につかれている人々[a]に向かって主イエスの名を唱えようとする者たちがいた。彼らは、「パウロが宣べ伝えているイエスによって、おまえたちに命じる[b]」と言った。
  to: さて、各地を巡り歩くユダヤ人の悪霊払いをする者たちの中にも、悪い霊につかれている人々[a]に対して主イエスの名を唱えようとした者たちがいた。彼らは、「パウロが宣べ伝えているイエスによって、おまえたちに厳命する[b]」と言った。
  rationale: 接続詞δέの過度な逆接を避け、ἐξορκισταίの意味を「悪霊払いをする者たち」と明確にした。「唱えようとした」はἐπεχείρησανの試行性を保持する。「厳命する」はὁρκίζωの正式で強い命令を本文で表し、誓約的な含意は脚注で補った。脚注aは本文の自然な表現が原文の字義より強く読まれないよう保持した。
