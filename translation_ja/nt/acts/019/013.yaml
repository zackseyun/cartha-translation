review_pass:
  verdict: revise
  source_fidelity: δέ is better represented without the adversative force of 「ところが」. More importantly, ἐξορκιστῶν specifically denotes practitioners of exorcism, so 「祈祷師」 is too broad. The revised wording specifies their activity while retaining the source's description. The attempted nature of ἐπεχείρησαν, the invocation of the name of the Lord Jesus over afflicted people, and the formal force of ὁρκίζω are retained.
  naturalness: The revision uses clear contemporary Japanese. 「各地を巡り歩く」 and 「悪霊払いをする者たち」 are readily understood without relying on a potentially misleading technical title. 「厳命する」 gives the direct speech a suitably solemn, forceful register without archaic obscurity.
  terminology: 「主イエス」 appropriately renders τοῦ κυρίου Ἰησοῦ. 「悪い霊」 faithfully renders πνεύματα πονηρά. 「悪霊払いをする者たち」 is more semantically precise than 「祈祷師」 for ἐξορκισταί. The main text avoids asserting a stronger model of possession than the Greek's literal 「having evil spirits」; the idiomatic wording is qualified by a literal footnote.
  issues:
  - severity: medium
    issue: 「ところが」がδέに不要な逆接を加えている。
    rationale: δέはここでは物語の進行・軽い接続を示すことができ、先行文との明確な対立を要求しない。
  - severity: medium
    issue: ἐξορκιστῶνを「祈祷師」としている。
    rationale: 「祈祷師」は祈願・占い・儀礼を行う人も含みうる広い語であるのに対し、ἐξορκισταίは悪霊を追い出す／祓う活動をする者を指す。
  - severity: low
    issue: 「命じる」だけではὁρκίζωの厳粛な誓約的強さが弱い。
    rationale: 「厳命する」とし、脚注で「誓わせる」という語義上の代案を示すことで、現代日本語の明瞭さと原語の強さを両立できる。
