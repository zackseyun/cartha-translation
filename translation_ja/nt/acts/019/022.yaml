source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: ja
  text: そこで、パウロは、自分に仕えている者たちのうち二人、テモテとエラストをマケドニアへ派遣し、本人はしばらくアジア州[a]にとどまった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「アジア州」は、小アジア西部にあったローマ帝国の属州であり、現代のアジア大陸全体を指すのではない。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: 遣わし
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、日本語では連用形により「遣わしてから、とどまった」という自然な時間的順序を示した。
- source_word: δὲ
  choice: そこで
  rationale: 強い逆接ではなく物語を進める軽い接続であり、直前の計画を受ける文脈にも合う。
- source_word: εἰς τὴν Μακεδονίαν
  choice: マケドニアへ
  rationale: 地域を目的地とする方向性を、現代日本語で自然な「へ」によって表した。
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: 自分に仕えていた者たちのうち二人
  rationale: διακονέω の奉仕するという動詞的意味を保ち、特定の職制を意味する「執事」や、解釈を加える「助手」は避けた。αὐτῷ の対象も明示した。
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: テモテとエラスト
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: αὐτὸς
  choice: 自分自身は
  rationale: 派遣された二人とパウロ本人との対比を示す、明示的な代名詞の強調を保持した。
- source_word: ἐπέσχεν χρόνον
  choice: しばらく……にとどまった
  rationale: 一定期間その場所に滞在するという慣用的な意味を、明瞭で自然な現代日本語にした。
- source_word: εἰς τὴν Ἀσίαν
  choice: アジア州に
  rationale: ἐπέσχεν χρόνον と結びつくため位置を表す「に」とし、現代の大陸との混同を避けるため歴史的なローマ属州であることを本文で簡潔に示した。
