base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: ja
  text: これを聞くと、彼らは激しい怒りでいっぱいになり[a]、「エフェソ人のアルテミスは偉大だ！」と叫び続けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「激しい怒りに満たされ」「怒り狂い」。ギリシア語は直訳すると「怒りでいっぱいになり」で、非常に強い怒りを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: これを聞くと
  rationale: アオリスト分詞が主動詞に先立つ状況を示す。目的語は文脈から補い、自然な現代日本語とした。
- source_word: δὲ
  choice: （訳語を置かない）
  rationale: ここでは弱い接続を示し、日本語では分詞句から主節への流れによって十分に表せる。
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: 激しい怒りでいっぱいになり
  rationale: 「θυμόςで満ちた者となる」という構文を自然な日本語で表しつつ、怒りの強さと状態の変化を保持した。
- source_word: ἔκραζον
  choice: 叫び続けた
  rationale: 未完了過去の継続的・反復的な響きを明示した。
- source_word: λέγοντες
  choice: 「……」と
  rationale: 叫びの内容を導く分詞を、日本語の自然な引用構文で表した。
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: 偉大なのは、エフェソ人のアルテミスだ！
  rationale: 述語を先に置く歓呼の強調を保ち、Ἐφεσίωνを都市名ではなく住民を指す属格複数として訳した。
- source_word: Ἄρτεμις
  choice: アルテミス
  rationale: 女神の固有名を日本語で一般的な形に音写した。
theological_decisions:
- issue: 異教の女神への歓呼を報告する表現
  choice: 「偉大なのは、エフェソ人のアルテミスだ！」
  alternative: 「エフェソ人のアルテミスは偉大だ！」
  rationale: 群衆の発言を直接話法として忠実に報告し、翻訳者による是認も否定も本文へ付け加えない。語順による歓呼の強調も保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、群衆の継続的な叫びと歓呼の調子を保った。「エフェソ人」はἘφεσίωνの形態を正確に反映する。
