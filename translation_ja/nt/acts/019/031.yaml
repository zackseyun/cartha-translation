  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: ja
  text: また、アジア州のアシアルケス[a]の中にも、パウロの友人である者が何人かいて、人を遣わし、劇場へ行かないよう彼に強く勧めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アシアルケス」は、ローマ属州アジアに関係する有力な公職者・指導者を指す歴史的な呼称。
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν
  choice: また、アジア州の高官たちの中にも……何人かいて
  rationale: τινέςの不特定複数を「何人か」、καίの意外性を含む追加の含意を「にも」で表した。Ἀσιάρχαιはローマ属州アジアに関係する有力な公職者を指すため、分かりやすさを優先して「アジア州の高官たち」とした。
- source_word: ὄντες αὐτῷ φίλοι
  choice: パウロの友人である者が
  rationale: 代名詞の指示対象を日本語で明確にしつつ、φίλοιの関係的な意味をそのまま「友人」とした。分詞句は主節に自然に組み込んだ。
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: 人を遣わして
  rationale: πέμπωには目的語が明示されていないが、文脈上は使者を送って伝言したことを表す。原文にない「伝言」を直接補うより、「人を遣わして」として行為を明示した。
- source_word: παρεκάλουν
  choice: 強く勧めた
  rationale: παρακαλέωの切実な勧告を表す。未完了過去の継続性は日本語では文脈上自然に理解できるため、過度に「繰り返し」と限定しなかった。
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: 劇場に入っていかないよう
  rationale: 直訳的には「自分自身を劇場へ与えない」で、自らを危険な群衆の中にさらさないことを意味する。日本語では目的地への進入を自然に表す「入っていかないよう」とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然でありながら品位を保った。「劇場」は上演施設というより、大群衆が集まる公共施設としての古代の劇場を指す。
