id: ACT.19.18
reference: Acts 19:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: ja
  text: また、信じた人々のうち大勢がやって来て、自分たちの行い[a]を告白し、明らかにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちがしてきたこと」、または「自分たちの慣行」。
    reason: πρᾶξιςは個々の行為にも、繰り返される実践・慣行にもなり得るため。
lexical_decisions:
- source_word: πολλοί τε
  choice: また、…大勢が
  rationale: τέの穏やかな継続・接続の働きを「また」で示し、πολλοίを自然な数量表現「大勢」で訳した。
- source_word: τῶν πεπιστευκότων
  choice: 信じた人々のうち
  rationale: 完了分詞が示す、すでに信じて今もその状態にある人々という含みを保ちつつ、現代日本語として簡潔にした。
- source_word: ἤρχοντο
  choice: やって来て
  rationale: 未完了過去の進行的・反復的な情景を文脈上自然に表す。「次々と」は可能だが、反復性を強めすぎるため採らない。
- source_word: ἐξομολογούμενοι
  choice: 告白し
  rationale: 何を告白したかを罪だけに限定せず、認めて言い表すという語義を直接表した。
- source_word: ἀναγγέλλοντες
  choice: 明らかにした
  rationale: 知らせる、報告するという意味を、隠されていた行為を公にする文脈に即して自然に表現した。
- source_word: τὰς πράξεις αὐτῶν
  choice: 自分たちの行い
  rationale: πρᾶξιςの広い意味を保ち、文脈上の魔術的な行為に限定しすぎない。「彼らの」より再帰的な「自分たちの」が日本語では指示関係を明瞭にする。
theological_decisions:
- issue: πεπιστευκότωνを固定的な集団名として訳すか、信じたという先行行為を表すか
  choice: 信じた人々
  alternative: 信者たち
  rationale: 完了分詞の形を反映し、先に信じるに至った人々であることを示す一方、教会用語として固定化された呼称を持ち込まない。
- issue: τὰς πράξεις αὐτῶνを罪、魔術の行為、または一般的な行いのどれとして訳すか
  choice: 自分たちの行い
  alternative: 自分たちの魔術的な行い／自分たちの罪
  rationale: 直近の文脈は魔術との関わりを示唆するが、原語自体はより広い。本文では広さを保ち、脚注で「してきたこと」「慣行」という可能性を示す。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての落ち着いた格調を保った。「やって来て」は口語的すぎず、ἤρχοντοの継続的な動きを自然に伝える。
