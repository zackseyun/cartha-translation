source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: ja
  text: そこで、ある者はあることを、別の者は別のことを叫び続けていた。集会[a]は混乱しており、大半の人々は、なぜ集まったのか分かっていなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「集まり」または「群衆」とも訳せる。ギリシア語は「エクレシア」だが、ここでは教会ではなく、市民の集会を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: そこで、ある者たちはあることを、ほかの者たちは別のことを叫び続けていた
  rationale: ἄλλοι…ἄλλο τι の分配的な対照を明確にし、未完了過去形 ἔκραζον の継続的で騒然とした動作を「叫び続けていた」で表した。μὲν οὖν は文脈に自然な「そこで」とした。
- source_word: ἐκκλησία
  choice: 集会
  rationale: ここではキリスト教会ではなく、集まった市民の会衆・集会を指す。「集会」は語の公的な含みを保ちつつ、現代日本語として自然である。
- source_word: συγκεχυμένη
  choice: 混乱しており
  rationale: 完了分詞が示す、混乱に陥った結果としての状態を簡潔に表した。
- source_word: οἱ πλείους
  choice: 大半の者
  rationale: 実体詞的に用いられた比較級が示す「多数者、大部分」を、集まった人々に自然に結び付けた。
- source_word: τίνος ἕνεκα
  choice: 何のために
  rationale: 理由または目的を問う表現の幅を保つ。「なぜ」も可能だが、「何のために」は原文の構造と目的の含みをよりよく伝える。
- source_word: συνεληλύθεισαν
  choice: 集まったのか
  rationale: 文脈上、集会に集結したことを自然に表す。過去完了の先行性は、日本語では主節との時間関係によって十分に伝わる。
theological_decisions:
- issue: ἐκκλησία の意味領域
  choice: 本文では「集会」とし、市民の集まりを指すことを注で明示する
  alternative: 「教会」または「群衆」
  rationale: この場面はエフェソの騒動に集まった市民についてであり、「教会」は文脈に不適切。「群衆」は可能だが、ἐκκλησία の集会としての性格が弱くなる。
translation_notes:
  register: 明快な現代標準日本語を用い、騒動の継続性と集会全体の混乱を自然に表現した。「さえ」は、多くの参加者が集合理由そのものを知らなかったという叙述上の強調を日本語で伝える。
