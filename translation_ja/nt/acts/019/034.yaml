base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: ja
  text: しかし、彼がユダヤ人[a]だと分かると、皆が一つの声となって、二時間ほど叫び続けた。「エフェソ人のアルテミスは偉大だ！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人」。ギリシア語はどちらの意味にもなり得るが、ここでは民族的・宗教的な意味の可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: 気づくと
  rationale: アオリスト分詞の先行・時間的状況を自然な現代日本語で表し、群衆がアレクサンドロの身元を認識したことを示す。
- source_word: δὲ
  choice: しかし
  rationale: 直前の発言の試みに対する展開上の逆転・対照を明確にする。
- source_word: Ἰουδαῖός
  choice: ユダヤ人
  rationale: エフェソという離散地の文脈では、地理的な『ユダヤ地方の人』より民族宗教的な意味が自然である。
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: 皆が声を一つにし
  rationale: 直訳的な『全員から一つの声が起こった』という比喩を、日本語として自然に保ちつつ、群衆の一致した叫びを表す。
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: 二時間ほど
  rationale: ὡς が数量表現に添える概数の意味を『ほど』で示す。
- source_word: κραζόντων
  choice: 叫び続けた
  rationale: 現在分詞が示す継続的な叫びを、日本語の補助表現『続けた』で明確にする。
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: 偉大なのは、エフェソ人のアルテミスだ！
  rationale: 文頭の Μεγάλη による歓呼の強調と、Ἐφεσίων の所属・結びつきを自然な日本語で表す。
theological_decisions:
- issue: Ἰουδαῖος の訳語
  choice: ユダヤ人
  alternative: ユダヤ地方の人
  rationale: ここで群衆が反応しているのはアレクサンドロの民族宗教的な帰属である可能性が高い。ただしギリシア語自体が地理的意味も持ち得るため、脚注で代案を示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。群衆の一体性と長時間続く熱狂を自然な日本語で伝え、歓呼は力強い口調とした。
