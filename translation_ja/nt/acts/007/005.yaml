revisions:
- from: 神は、その地では何一つ彼に相続地をお与えにならず、足の踏み場ほどの土地さえお与えになりませんでした[a]。しかし、その地を彼の所有として、また彼の後の子孫にも与えると約束されました。その時、彼にはまだ子どもがいなかったのです[b]。
  to: 神は、その地に彼の相続地を少しも、足の踏み場ほどさえ、お与えになりませんでした[a]。しかし、その地を彼の所有地として、また彼の後の子孫に与えると約束されました。その時、彼には子どもがいなかったのです[b]。
  rationale: 不自然な語順を改め、「相続地を少しも、足の踏み場ほどさえ」という否定の強調を明確にしました。「所有地として」は土地の約束という文脈で自然かつ原文に忠実です。子どもがいなかったことは、本文では時間的に表し、脚注で可能な譲歩的理解を保持しました。
