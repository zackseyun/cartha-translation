id: ACT.7.5
reference: Acts 7:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: ja
  text: 神は、その地に彼の相続地を少しも、足の踏み場ほどさえ、お与えになりませんでした[a]。しかし、その地を彼の所有地として、また彼の後の子孫に与えると約束されました。その時、彼には子どもがいなかったのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「足一歩分の場所さえ」。ごくわずかな土地を表す慣用句です。
    reason: lexical_alternative
  - marker: b
    text: 「彼には子どもがいなかったにもかかわらず」とも訳せます。ギリシア語の構文は時間的にも取れますが、文脈には譲歩の意味合いもあります。
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: 相続地
  rationale: 土地について受け継ぐ割り当てという契約的・法的含意を保ち、一般的な「財産」より文脈に合う。
- source_word: οὐδὲ βῆμα ποδός
  choice: 足の踏み場ほどの土地さえ
  rationale: 直訳的な像を生かしつつ、ごくわずかな土地すらないことを表すギリシア語の慣用句として自然な日本語にした。
- source_word: ἐπηγγείλατο
  choice: 約束されました
  rationale: 神を主語とする敬語表現により、原文の約束という明確な行為を簡潔に伝える。
- source_word: εἰς κατάσχεσιν
  choice: 所有として
  rationale: その地を確かな所有物として与えるという結果・目的を明瞭に表す。
- source_word: σπέρματι
  choice: 子孫
  rationale: 単数形で集合的意味を持つ語を、現代日本語で自然な集合名詞として表した。
- source_word: μετ’ αὐτόν
  choice: 彼の後の
  rationale: アブラハムに続く世代であることを簡潔に示す。
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: その時、彼にはまだ子どもがいなかった
  rationale: 属格独立分詞の状況的・時間的意味を本文では保持し、「まだ」によって文脈上の逆説を自然に示す。譲歩的訳の可能性は脚注に残す。
- source_word: τέκνου
  choice: 子ども
  rationale: 「息子」に限定されないτέκνονの広い意味を正確に保つ。
theological_decisions:
- issue: 約束の時点でアブラハムに子どもがいなかったことの時間的・譲歩的ニュアンス
  choice: その時、彼にはまだ子どもがいなかった
  alternative: 彼には子どもがいなかったにもかかわらず
  rationale: 属格独立分詞そのものは時間・状況を表し得るため、本文ではより中立的な時間的表現を採用した。同時に「まだ」で約束との緊張を示し、明示的な譲歩訳は脚注に掲げた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の行為には穏やかな敬語を用いた。長いギリシア語文を三文に分け、朗読時にも理解しやすくした。
