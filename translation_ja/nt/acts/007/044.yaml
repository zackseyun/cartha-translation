revisions:
- from: 私たちの父祖には、荒野で「あかしの幕屋」[a]がありました。それは、モーセに語っておられた方[b]が、彼の見た型どおりに造るよう命じられたものです。
  to: 私たちの父祖には、荒野に「あかしの幕屋」[a]がありました。これは、モーセに語っていた方[b]が、モーセの見た型に従ってそれを造るよう命じたとおりです。
  rationale: モーセが型を見たことを明示して、日本語でのみ生じる代名詞の曖昧さを解消した。あわせて、幕屋とモーセへの製作命令との対応を「命じたとおりです」として直接表した。話者の名は原文どおり明示せず、既存の用語と脚注アンカーを保持した。
