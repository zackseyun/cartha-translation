  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: ja
  text: 私たちの父祖には、荒野に「あかしの幕屋」[a]がありました。これは、モーセに語っていた方[b]が、モーセの見た型に従ってそれを造るよう命じたとおりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「証しの天幕」。契約のあかしに結びつく聖所を指します。
    reason: lexical_alternative
  - marker: b
    text: 「モーセに語った方」とも訳せます。文脈上は神を指しますが、ギリシャ語本文は話者の名を明示していません。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: 「あかしの幕屋」
  rationale: σκηνήは移動式の聖所を指す文脈なので、日本語で定着し内容も明確な「幕屋」とした。τοῦ μαρτυρίουは契約のあかしに結びつく属格表現であり、「あかしの」と簡潔に保った。
- source_word: τοῖς πατράσιν ἡμῶν
  choice: 私たちの父祖には
  rationale: イスラエルの先祖たちを指す男性複数形を踏まえ、現代日本語で自然かつ格調のある「父祖」とした。与格は所有を表すἦνとともに「父祖には……がありました」と訳した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: 聖書の地理的・歴史的文脈に定着した「荒野」を用い、幕屋が存在した場所を自然に示した。
- source_word: καθὼς διετάξατο
  choice: ……よう命じられた
  rationale: καθώςが示す指示との一致は、後続の「型どおりに」によって日本語として明瞭に表した。διατάσσομαιの権威ある指示を「命じる」で訳した。
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: モーセに語っておられた方
  rationale: 実体詞的現在分詞の形を保ち、話者を神または主と明示せず原文の含意を保持した。敬語は神的話者を示唆する文脈にふさわしい日本語表現である。
- source_word: ποιῆσαι αὐτὴν
  choice: 造るよう
  rationale: 幕屋の制作・建造を自然に表す「造る」を採用した。目的語は日本語では文脈上明白なため省略した。
- source_word: κατὰ τὸν τύπον ὃν ἑωράκει
  choice: 彼の見た型どおりに
  rationale: τύποςを、示された原型・設計の意味を保つ「型」とした。ἑωράκειの過去完了的な先行性は、日本語では連体修飾「見た」によって自然に示される。
theological_decisions:
- issue: 「モーセに語っていた方」の指示対象
  choice: 「モーセに語っておられた方」として明示しない
  alternative: 「神がモーセに語り」「主がモーセに語り」
  rationale: ギリシャ語は話者の名を挙げず、実体詞的分詞ὁ λαλῶνで表す。文脈上は神を指すが、本文以上に明示せず、原文の表現を保った。
- issue: σκηνὴ τοῦ μαρτυρίουの表現
  choice: 「あかしの幕屋」
  alternative: 「証言の天幕」「あかしの天幕」
  rationale: これは契約のあかしと結びつくイスラエルの聖所を指す。日本語聖書で理解可能な慣用表現を用いつつ、「あかし」を平仮名にして一般読者にも読みやすくした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、演説文にふさわしい穏やかな格調を保った。「父祖」「幕屋」「型」は聖書的文脈を損なわず一般読者にも理解可能な語として選んだ。
