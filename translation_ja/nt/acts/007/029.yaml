id: ACT.7.29
reference: Acts 7:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: ja
  text: この言葉を聞いて、モーセは逃げ、ミディアンの地で寄留者となった[a]。そこで彼は二人の息子をもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ミディアンの地で外国人として暮らした」。ここで「寄留者」と訳した語は、自分の国ではない土地に住む人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: 逃げ
  rationale: φεύγωのアオリストとして、危険を避けてその場を離れたことを簡潔かつ自然に表す。
- source_word: δὲ
  choice: （独立した接続語を置かず、文脈上の展開で表現）
  rationale: ここでは前の出来事を受けた物語の進行を示すため、日本語では「この言葉を聞いて」というつながりの中に自然に織り込んだ。
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: この言葉を聞いて
  rationale: 直訳的な「この言葉によって」より自然で、直前の発言が逃亡の契機となったことを示す。ただし明示的な因果に限定しすぎない。
- source_word: ἐγένετο πάροικος
  choice: 寄留者となった
  rationale: 自分の故郷ではない土地に住む者というπάροικοςの意味を、聖書的な品位を保ちつつ簡潔に表す。
- source_word: ἐν γῇ Μαδιάμ
  choice: ミディアンの地で
  rationale: γῇを反映し、地理的表現を省略せず訳した。
- source_word: οὗ
  choice: そこで
  rationale: 先行するミディアンの地を受け、その場所で次の出来事が起きたことを自然な日本語で示す。
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 男性であるモーセを主語として、二人の息子の父となった意味を自然な現代日本語で表す。
- source_word: υἱοὺς δύο
  choice: 二人の息子
  rationale: 語句の直接的で自然な訳。
theological_decisions: []
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「寄留者」は日常語よりやや聖書的だが、πάροικοςが持つ『よその土地に住む者』という含意を簡潔に保つため採用し、脚注で説明した。
