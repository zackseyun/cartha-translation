id: ACT.7.49
reference: Acts 7:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: ja
  text: 『天はわたしの王座、地はわたしの足台である。わたしのために、あなたがたはどのような家を建てるのか、と主は言われる。あるいは、わたしの安息の場所はどこか。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: 天
  rationale: 地と対置された神の領域を指すため、「空」ではなく、宇宙的・神学的な意味を自然に表す「天」とした。
- source_word: θρόνος
  choice: 王座
  rationale: 王としての支配を示す比喩を明確に保つため、「王座」とした。
- source_word: γῆ
  choice: 地
  rationale: 天と対をなす宇宙的範囲なので、「土地」ではなく「地」とした。
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: わたしの足台
  rationale: 「私の足の足台」という原語の明示的な「足」は、日本語では「足台」に含まれるため、冗長さを避けつつ比喩を保持した。
- source_word: ποῖον
  choice: どのような
  rationale: 単なる特定ではなく、種類・性質を問う修辞的な力を表す。
- source_word: οἶκον
  choice: 家
  rationale: 文脈上は神殿を含意するが、原文の一般語を保ち、解釈を本文に持ち込まないため「家」とした。
- source_word: οἰκοδομήσετέ
  choice: 建てるのか
  rationale: 未来形の修辞疑問を、現代日本語で自然な問いとして表した。
- source_word: κύριος
  choice: 主
  rationale: 新約ギリシア語本文のκύριοςを標準的に「主」と訳し、引用文中の神の発言者を示した。
- source_word: τόπος
  choice: 場所
  rationale: 一般的で自然な対応語であり、原文の広がりを保つ。
- source_word: κατάπαυσις
  choice: 安息
  rationale: 単なる休憩よりも、神が住まいに留まり休むという聖書的響きを保つため「安息」とした。
theological_decisions:
- issue: イザヤ書の引用におけるκύριοςの表記
  choice: 主
  alternative: 主なる神／ヤハウェ
  rationale: 使徒言行録の直接の原文はκύριοςであるため、「主」と訳した。旧約引用であることから固有名を補ったり、「主なる神」と説明的に広げたりしなかった。
- issue: οἶκοςが指す対象
  choice: 家
  alternative: 神殿
  rationale: 文脈では神殿が念頭にあるが、原文はοἶκοςであり、神を人の建物に限定できるかという緊張を保つため、解釈的な「神殿」に置き換えなかった。
- issue: κατάπαυσιςの意味合い
  choice: 安息
  alternative: 休む所／住まい
  rationale: 「休息」と場所の両面を含み得る語を「安息」とし、神の住まいだけに意味を限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、預言書引用にふさわしい簡潔で格調ある調子を保った。修辞疑問は「どのような家を建てるのか」「場所はどこか」と直接的に表現した。
