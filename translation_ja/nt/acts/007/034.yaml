id: ACT.7.34
reference: Acts 7:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: ja
  text: 『わたしは、エジプトにいるわたしの民が虐げられているのを確かに見た[a]。また、彼らのうめきを聞き、彼らを救い出すために下って来た。さあ、来なさい。あなたをエジプトへ遣わそう。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「苦しめられているのを」「圧迫されているのを」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: 確かに見た
  rationale: 分詞と定動詞を重ねたセム語的な強調表現を、現代日本語として自然な強調にした。出エジプト記3章7節との響きも保つ。
- source_word: κάκωσιν
  choice: 虐げられている
  rationale: 過酷で不当な扱いや圧迫を表す語。名詞を自然な日本語の受け身表現にし、政治的な意味だけに狭めないようにした。
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: エジプトにいるわたしの民
  rationale: 所在を示す修飾関係と「わたしの民」という契約的な響きをそのまま保った。
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: 彼らのうめき
  rationale: 単数形の代名詞は集合体としての民を受けるため、日本語では複数を示す「彼ら」とした。「うめき」は苦難の中から出る声を明確に表す。
- source_word: κατέβην
  choice: 下って来た
  rationale: 神が介入するために『下る』という擬人的・顕現的な表現を説明に置き換えず保持した。
- source_word: ἐξελέσθαι
  choice: 救い出す
  rationale: 危険や圧迫から取り出して救うという中動態の意味を、明瞭で自然な現代日本語で表した。
- source_word: δεῦρο
  choice: さあ、来なさい
  rationale: モーセを前へ促す指示的な呼びかけを、命令の力を保ちながら自然に表した。
- source_word: ἀποστείλω
  choice: 遣わそう
  rationale: 未来形による派遣の宣言を、神の委任・派遣という文脈にふさわしい格調ある日本語にした。「遣わす」は聖書的文脈でも一般読者に理解できる。
- source_word: εἰς Αἴγυπτον
  choice: エジプトへ
  rationale: 目的地を示す εἰς を自然な日本語で表した。
theological_decisions:
- issue: 神が『下って来た』という擬人的表現
  choice: 下って来た
  alternative: 介入するために来た
  rationale: 原文の神的降下の表現を比喩として説明したり、教理的に言い換えたりせず、その緊張を保持した。
- issue: ἐξελέσθαι が表す救出
  choice: 救い出す
  alternative: 解放する
  rationale: 圧迫からの解放という含意はあるが、政治的・社会的解放だけに意味を限定せず、原語の広い救出の意味を保った。
- issue: ἀποστείλω の発話機能
  choice: 遣わそう
  alternative: 遣わす
  rationale: 未来形を神の派遣の意志・宣言として訳した。許可を求めるような意味や、特定の召命論を付加していない。
translation_notes:
  register: 神の直接話法として簡潔さと威厳を保ちつつ、現代の一般読者に明瞭な標準日本語とした。ἰδὼν εἶδον の強調は「確かに」で表し、κατέβην の擬人的表現は保持した。英語資料の脚注bは本文の「come」に付されながら内容が「deliver/rescue」の異読となっており不整合なため採用せず、原文上意味のある κάκωσις の語彙的選択肢のみ脚注化した。
