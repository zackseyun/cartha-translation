source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: ja
  text: 族長たちはヨセフをねたんで、彼をエジプトへ売り渡しました。そして、神は彼と共におられました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: 族長たち
  rationale: ここではヤコブの息子たちを、イスラエルの祖となった者たちとして指す。「族長たち」は歴史的・神学的な意味を保ちつつ、現代日本語でも通用する。
- source_word: ζηλώσαντες
  choice: ねたみ
  rationale: ζηλόω はこの文脈ではヨセフへの嫉妬・ねたみを表し、分詞は売り渡した動機を示す。「ねたみ」は自然で簡潔にその感情を伝える。
- source_word: ἀπέδοντο
  choice: 売り渡しました
  rationale: 創世記の背景と目的地を示す句から、単なる引き渡しではなく売却を意味する。「売り渡す」は取引と裏切りの双方を明確に表す。
- source_word: εἰς Αἴγυπτον
  choice: エジプトへ
  rationale: εἰς の方向・移動を自然な日本語で表す。ヨセフが最終的にエジプトへ連れて行かれたことを簡潔に示す。
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: 神は彼と共におられました
  rationale: 神の臨在を述べる簡潔な原文を保つ。「おられました」は神に対する現代日本語の穏当で格調ある敬語表現である。
theological_decisions:
- issue: 苦難の中にあるヨセフと神の臨在
  choice: しかし、神は彼と共におられました
  alternative: そして、神は彼と共におられました
  rationale: καί は通常「そして」だが、兄弟たちによる裏切りと神の臨在との文脈上の対照を、日本語で自然に示すため「しかし」とした。神の摂理について本文以上の説明を加えず、苦難にもかかわらず神が共にいたという緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。説教調の補足を避けつつ、聖書本文としての品位を保った。「族長」は専門性があるが、この箇所の歴史的意味を正確に伝える一般的な聖書用語として採用した。
