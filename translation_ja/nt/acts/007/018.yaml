  text: ἄχρι οὗ ἀνέστη βασιλεὺς ἕτερος ⸂ἐπ’ Αἴγυπτον⸃, ὃς οὐκ ᾔδει τὸν Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: ja
  text: ヨセフを知らない別の王がエジプトを治めるようになるまで。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヨセフを知らない別の王がエジプトの上に立つまで」。ここでの「立つ」は、王が現れる、または支配するようになることを表すとも訳せる。「ヨセフを知らない」には、ヨセフを認めない、または顧みないという含みもあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: そしてついに
  rationale: 直前から続く状況が新王の登場まで継続したという時間的な限界を、独立した日本語の節として自然に示す。
- source_word: ἀνέστη
  choice: 治めるようになった
  rationale: 字義は「立ち上がった」だが、ここでは王が現れて支配権を持つようになったことを表す慣用的用法。現代日本語ではこの文脈上の意味を明瞭に伝える。
- source_word: βασιλεὺς ἕτερος
  choice: 別の王
  rationale: ἕτεροςによる先の支配者との区別を簡潔に保ち、βασιλεύςを直接的に「王」と訳す。
- source_word: ἐπ’ Αἴγυπτον
  choice: エジプトを治める
  rationale: 王とともに用いられたἐπί＋対格が、エジプトに対する統治権を示すため。
- source_word: οὐκ ᾔδει τὸν Ἰωσήφ
  choice: ヨセフを知らない
  rationale: 原文の基本的な意味を保ちつつ、単なる面識の欠如だけでなく、ヨセフを認めず顧みない含意も排除しない。
theological_decisions:
- issue: 王がヨセフを「知らない」ことの意味
  choice: 知らない
  alternative: 認めない／顧みない
  rationale: 歴史的知識の欠如か、ヨセフとその功績を承認しないことかを本文だけで限定せず、原文の曖昧さを保持する。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「そしてついに」により前節からの時間的推移を示し、「治めるようになった」で王の即位・台頭という文脈上の意味を伝えた。原文の字義と「知らない」の含意は脚注で保持した。
