  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: ja
  text: ヤコブはエジプトへ下り、彼と私たちの父祖たちは亡くなりました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの先祖」とも訳せる。ギリシア語は直訳すると「私たちの父たち」で、イスラエルの父祖を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: 下り
  rationale: καταβαίνωの方向的な意味を保ち、エジプトへの移動を表す聖書の地理的慣用にも合う自然な日本語とした。
- source_word: Ἰακὼβ
  choice: ヤコブ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: εἰς Αἴγυπτον
  choice: エジプトへ
  rationale: 移動の到達先を自然な現代日本語で示す。「中へ」まで明示すると日本語では過剰になるため、「へ」とした。
- source_word: ἐτελεύτησεν
  choice: 亡くなりました
  rationale: 死を表す標準的な語。ステファノの演説にふさわしい丁寧で dignified な語調を保つ。
- source_word: αὐτὸς καὶ οἱ πατέρες ἡμῶν
  choice: そこで亡くなりました。私たちの父祖たちも亡くなりました
  rationale: ギリシア語の「彼自身と私たちの父たち」を、日本語として不自然な並列を避けつつ、ヤコブと父祖たちの双方が死んだことを明確に表した。「そこで」は文脈上エジプトを指す。
- source_word: οἱ πατέρες ἡμῶν
  choice: 私たちの父祖たち
  rationale: ここではイスラエルの歴史上の男性の先祖たちを指すため、「先祖」より原語の父系的表現を残す「父祖」を選んだ。
theological_decisions:
- issue: イスラエルの祖先を指す πατέρες の訳し方
  choice: 私たちの父祖たち
  alternative: 私たちの先祖たち
  rationale: ステファノがイスラエルの父祖と自らを歴史的に結び付ける表現であり、原語の男性形と族長史的な響きを保つ。「先祖たち」も意味上は可能なので脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語。ステファノの演説として丁寧で格調ある語調を用いた。原文の一文を日本語では二文に分け、重複する動詞を補って意味関係を明確にした。
