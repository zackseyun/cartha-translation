  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: ja
  text: そのころ、彼らは子牛を造り、その偶像にいけにえを献げ、自分たちの手で造ったものを喜んでいました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: 子牛を造り
  rationale: 動詞が表す「子牛を造る」を簡潔に訳した。続く「その偶像」が宗教的性格を明示するため、ここで「子牛の偶像」と重ねる必要はない。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: そのころ
  rationale: 直訳は「その日々に」だが、物語上の時を自然な現代日本語で示す表現とした。
- source_word: ἀνήγαγον θυσίαν
  choice: いけにえを献げ
  rationale: 祭儀の文脈における慣用的な意味を明確に伝える。「献げる」は礼拝行為を自然かつ荘重に表す。
- source_word: τῷ εἰδώλῳ
  choice: その偶像に
  rationale: 定冠詞を受け、直前の子牛を指す特定の偶像として訳した。εἴδωλονの否定的な宗教的含意も保持する。
- source_word: εὐφραίνοντο
  choice: 喜んでいました
  rationale: 未完了過去の継続的な相を、日本語の「ていました」で自然に示した。
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: 自分たちの手で造ったものを
  rationale: ギリシア語の直訳的な「自分たちの手の業」は聖書的反偶像表現を強く保つ一方、現代日本語では意味が取りにくい。「自分たちの手で造ったもの」として手製の偶像を喜ぶ皮肉と批判を明瞭に伝えた。
theological_decisions:
- issue: 偶像礼拝を非難する語調
  choice: 「偶像」を明記し、「自分たちの手で造ったもの」とする
  alternative: 「像」「自分たちの手の業」
  rationale: ステファノの言葉にある偶像礼拝への批判を弱めず、同時に普通の現代日本語として明瞭にした。
- issue: ἐνが示す喜びの対象・領域
  choice: 「自分たちの手で造ったものを喜んでいました」
  alternative: 「自分たちの手の業の中で喜んでいました」
  rationale: ここでのἐνは、造った物をめぐって喜ぶことを表し得る。日本語では対象を示す「を」が自然であり、偶像を造ったことへの歓喜という文脈を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「偶像」「いけにえを献げる」により宗教的・告発的な調子を保った。「そのころ」は自然な物語表現であり、「喜んでいました」は未完了過去の継続性を反映する。
