  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: ja
  text: しかし、彼が外に置かれたとき、ファラオの娘が彼を拾い上げ[a]、自分の息子として[b]育てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「引き取って」。このギリシア語動詞は、外に置かれた幼子を取り上げることを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「彼女自身のために、息子として」。または「息子として」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: 外に捨て置かれた
  rationale: 幼子が人目にさらされる場所へ出されたことを表す受動分詞。動機を「遺棄」と断定しすぎず、当時の幼児遺棄の含意も伝える。
- source_word: δὲ
  choice: しかし
  rationale: 前節の危機からファラオの娘による救出へ転じる、物語上の対照を自然に示す。
- source_word: ἀνείλατο
  choice: 拾い上げ
  rationale: ここでは、外に置かれた幼子を取り上げることを指す。後続の「息子として育てた」と区別し、「養子にした」と先取りして訳さない。
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: ファラオの娘
  rationale: 属格関係を明瞭で自然な現代日本語にした。
- source_word: ἀνεθρέψατο
  choice: 育てた
  rationale: 子どもを養育し、成長させることを表す自然な現代語。
- source_word: ἑαυτῇ εἰς υἱόν
  choice: 自分の息子として
  rationale: 直訳的な「自分のために息子として」より自然で、彼女との親子としての関係・身分を明確に表す。
- source_word: αὐτοῦ / αὐτόν
  choice: 彼／彼を
  rationale: 文脈上モーセを指す代名詞を、簡潔かつ明瞭に訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「外に捨て置かれた」は歴史的な幼児遺棄の状況を伝えつつ、原語以上に動機を断定しない表現とした。「拾い上げ」と「息子として育てた」を分け、救い上げる行為とその後の養育・親子関係を区別した。
