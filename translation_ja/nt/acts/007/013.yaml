  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: ja
  text: 二度目に来たとき、ヨセフは兄弟たちに自分の正体を明かし[a]、ヨセフの一族[b]のことがファラオに知られるようになりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ヨセフは兄弟たちに知られた（認められた）」。ギリシア語の動詞は受動形ですが、文脈ではヨセフが自分の正体を明かしたことを指します。
    reason: lexical_alternative
  - marker: b
    text: 「一族」は「親族」または「血筋」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: 二度目に来た時
  rationale: 定冠詞付きの序数詞が「二度目の時」を表す。文脈上、兄弟たちがエジプトへ再び来た時を指すため、「来た」を補って自然で明確な日本語とした。
- source_word: ἀνεγνωρίσθη
  choice: 自分の身を明かし
  rationale: 形態上は受動形で、「知られた／認められた」と訳し得るが、創世記の背景ではヨセフが自ら正体を明かした出来事を指す。受動形の余地は脚注に残した。
- source_word: ἀδελφοῖς
  choice: 兄弟たち
  rationale: ここではヨセフの男性のきょうだいたちを指すため、具体的な指示対象に即して「兄弟たち」とした。
- source_word: φανερὸν ἐγένετο
  choice: 知られるようになりました
  rationale: それまで知られていなかった事柄が明らかになり、認知されるに至ったことを自然な日本語で表す。
- source_word: γένος
  choice: 一族
  rationale: ここではヨセフの血縁集団・親族を指す。「家族」より広い範囲を含み得る原語の意味を保つため「一族」とした。
- source_word: τῷ Φαραώ
  choice: ファラオに
  rationale: 与格は、その事柄を知るに至った者を示すため、「ファラオに」と訳した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、物語叙述にふさわしい端正な敬体とした。「ファラオ」は現代日本語で広く通用する表記を採用した。脚注記号は関連する語句の直後に置いた。
