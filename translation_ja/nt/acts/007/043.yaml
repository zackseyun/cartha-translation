id: ACT.7.43
reference: Acts 7:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: ja
  text: あなたがたは、モロクの天幕と、ライファンという神の星[a]、すなわち、あなたがたがそれらを拝むために造った像[c]を担ぎました。そして、わたしはあなたがたをバビロンのかなたへ追放します。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: アモス5:26のヘブライ語本文にある「あなたがたの神」という表現を反映し、「あなたがたの神ライファン」と訳すものもあります。使徒言行録の本文は「ライファンという神」です。
    reason: alternative_reading
  - marker: b
    text: 使徒言行録の本文は「バビロンのかなたへ」となっています。引用元のアモス5:27は、一般に「ダマスコのかなたへ」と訳されます。
    reason: cross_reference
  - marker: c
    text: 「形」または「表象」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: 担ぎました
  rationale: 礼拝用の物を持ち上げて運ぶ意味を、文脈に即して簡潔に表す。「受け入れた」といった解釈は加えない。
- source_word: σκηνὴν
  choice: 天幕
  rationale: σκηνήの基本義を保つ。「幕屋」では正統な礼拝施設を連想させやすく、「神殿」は説明的すぎるため避けた。
- source_word: Μολὸχ
  choice: モロク
  rationale: ギリシア語の固有名を日本語で慣用的に音写した。
- source_word: ἄστρον
  choice: 星
  rationale: 語の直接的な意味を採用し、本文では「星の像」や「星印」と限定しない。
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: 神ライファンの
  rationale: 使徒言行録のギリシア語本文にある所有表現をそのまま反映し、「あなたがたの」を本文に補わない。
- source_word: Ῥαιφάν
  choice: ライファン
  rationale: SBLGNTのギリシア語形Ῥαιφάνを音写した。
- source_word: τύπους
  choice: 像
  rationale: τύποςには「形」「型」「表象」などの幅があるが、ここでは人が造って拝む礼拝対象を指すため、「像」が明瞭で自然。ただし語義の幅は脚注に残す。
- source_word: προσκυνεῖν αὐτοῖς
  choice: それらを拝むために
  rationale: 宗教的文脈でのπροσκυνέωを「拝む」とし、αὐτοῖςの複数指示も「それら」で明示した。
- source_word: μετοικιῶ
  choice: 強制移住させます
  rationale: 移住させるという使役と、捕囚・追放の強制性を現代日本語で表す。「移住させる」だけでは自発的な移住とも受け取られうる。
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: バビロンよりさらに遠くへ
  rationale: ἐπέκειναの「越えて、その先へ」という方向を自然な日本語で表し、地名は使徒言行録本文どおりバビロンとした。
theological_decisions:
- issue: ステファノの引用にある捕囚先が、アモス書の形と異なること
  choice: バビロンよりさらに遠くへ
  alternative: ダマスコよりさらに遠くへ
  rationale: 使徒言行録のギリシア語本文は明確に「バビロン」と読むため、アモス5:27に合わせて本文を調和させず、相違を脚注で示した。
- issue: 神名に付く所有表現
  choice: 神ライファン
  alternative: あなたがたの神ライファン
  rationale: 使徒言行録の提示本文に従い、所有代名詞を補わない。旧約引用の背景に由来する別の訳し方は脚注に残した。
translation_notes:
  register: 明快な現代標準語を用いながら、引用預言としての重みを保つ丁寧体とした。「天幕」「像」「拝む」は一般読者にも理解しやすく、過度に教派的・専門的な語を避けている。
