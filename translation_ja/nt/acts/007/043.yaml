    issue: 「バビロンよりさらに遠くへ」がἐπέκειναの表現を比較的・説明的にしている
    rationale: ἐπέκεινα Βαβυλῶνοςは「バビロンの向こうへ／かなたへ」です。「よりさらに」は基準との距離比較を補います。
