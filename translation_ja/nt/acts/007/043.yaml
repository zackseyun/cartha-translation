revisions:
- from: あなたがたは、モロクの天幕と、神ライファンの星[a]、すなわち、それらを拝むために自分たちで造った像[c]を担ぎました。そして、わたしはあなたがたをバビロンよりさらに遠くへ強制移住させます。[b]
  to: あなたがたは、モロクの天幕と、ライファンという神の星[a]、すなわち、あなたがたがそれらを拝むために造った像[c]を担ぎました。そして、わたしはあなたがたをバビロンのかなたへ追放します。[b]
  rationale: 原文の構文と語義をより直接に反映させるため、「自分たちで」を「あなたがたが」に改めました。神名句は、定冠詞を伴うτοῦ θεοῦ Ῥαιφάνを自然な日本語で示す「ライファンという神」とし、本文に「あなたがたの」を補わない点を維持しました。ἐπέκειναの空間的表現は「バビロンのかなたへ」として、比較的な補足を避けました。脚注はアモスのヘブライ語本文との相違を正確かつ中立的に示しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:33Z'
review_pass:
  verdict: revise
  source_fidelity: 概ね原文に忠実です。ἀνελάβετεは「担ぎました」、σκηνήは「天幕」、τύπουςはこの文脈で「像」、μετοικιῶは強制的な追放・移住として適切に訳されています。ただし、τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς は「あなたがたがそれらを拝むために造った像」であり、「自分たちで」は原文にない強調なので除くのが安全です。またἐπέκειναは「バビロンのかなたへ／バビロンの向こうへ」であり、「バビロンよりさらに遠くへ」は比較対象を含意してやや説明的です。
  naturalness: 現行文は明快で読みやすい一方、「神ライファン」は日本語では同格関係が一読でやや取りにくく、「ライファンという神の星」とするとτοῦ θεοῦ Ῥαιφάνの構造が自然に伝わります。「バビロンのかなたへ追放します」は現代標準語として自然で、強制性と預言的な宣告を保ちます。
  terminology: 「モロク」「天幕」「星」「像」「拝む」は適切です。「ライファン」はギリシア語形に基づく音写として許容されます。脚注aの「所有表現」は、使徒言行録本文に所有表現があるかのようにも読めるため、「アモスのヘブライ語本文の『あなたがたの神』という表現」と明示する必要があります。
