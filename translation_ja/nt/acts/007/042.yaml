id: ACT.7.42
reference: Acts 7:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: ja
  text: 'しかし、神は背を向け、天の万象に仕えるように、彼らを引き渡されました[a]。預言者たちの書[c]にこう書かれているとおりです。


    『イスラエルの家よ、あなたがたは荒野で四十年の間、

    わたしに、ほふった供え物やいけにえを献げたのか。』[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天の万象を礼拝するように、彼らを引き渡された」とも訳せる。ここで「天の万象」は、崇拝の対象とされた天体や、それに結び付けられた天上の諸力を指し得る聖書的表現。
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: アモス5章25節からの引用。
    reason: cross_reference
  - marker: c
    text: 「預言者たちの巻物に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστρεψεν
  choice: 背を向け
  rationale: 神が単に向きを変えたのではなく、反逆に応じて関係的に退かれたという文脈上の裁きの含みを、簡潔な日本語で表す。
- source_word: παρέδωκεν αὐτοὺς
  choice: 彼らを…ままにされました
  rationale: 裁きとして彼らをその選んだ偶像礼拝へ引き渡す意味を表しつつ、神が罪を積極的に行わせたとの印象を避ける。
- source_word: λατρεύειν
  choice: 仕える
  rationale: 宗教的奉仕と礼拝の双方を含み得る語なので、本文では意味を狭めない「仕える」とし、礼拝の可能性を脚注で示す。
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: 天の万象
  rationale: 天体およびそれと結び付けられた天的勢力を指す聖書的表現として、現代日本語で理解しやすく、指示対象を星だけに限定しない。
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: 預言者たちの書に
  rationale: βίβλοςの「書物／巻物」の幅を保ちながら、ここでは十二小預言書を含む預言書集を自然に指せる表現とする。
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: わたしに…献げたのか
  rationale: 否定の答えを予期する修辞疑問を、日本語でも断定的に解消せず疑問形のまま保つ。
- source_word: σφάγια καὶ θυσίας
  choice: ほふった供え物やいけにえ
  rationale: σφάγιαの屠殺された供え物という具体性と、θυσίαςの一般的な犠牲・いけにえの意味を区別して表す。
- source_word: οἶκος Ἰσραήλ
  choice: イスラエルの家よ
  rationale: 共同体全体への預言的呼びかけを保つ定着した聖書表現。
theological_decisions:
- issue: 裁きにおける神の行為
  choice: 「背を向け、彼らを…ままにされた」とし、反逆に対する司法的な放任・引き渡しを表す。
  alternative: 神が彼らに偶像礼拝を積極的に行わせた、と読む。
  rationale: 連続する二動詞は神の裁きを示すが、神を偶像礼拝の創始者とする必要はない。原文の厳しさを保ちつつ、因果関係を過剰に規定しない。
- issue: 「天の万象」の指示対象
  choice: 天体と、それに関連して崇拝された天的勢力の双方に開かれた表現とする。
  alternative: 星だけ、または天使だけに限定する。
  rationale: στρατιὰ τοῦ οὐρανοῦは聖書中で幅のある定型句であり、この文脈では天体崇拝を中心としながらも厳密な対象を限定しない。
- issue: アモス5:25の修辞疑問
  choice: 否定の答えを予期する疑問として、そのまま疑問形で訳す。
  alternative: 「献げなかった」と断定文にする。
  rationale: μήの語用論的な方向性は明らかだが、引用が持つ修辞的緊張を残すため、本文で答えを明文化しない。
translation_notes:
  register: 明瞭で現代的ながら、演説中の預言書引用にふさわしい荘重さを保った。「ほふった」は日常語よりやや格調があるが、σφάγιαの屠殺の含意を伝えるために用いた。引用部は詩行として改行し、呼びかけと修辞疑問を際立たせた。
