revisions:
- from: そして、ひざまずくと、大声で叫んだ。「主よ、この罪を彼らに負わせないでください[a]。」こう言って、彼は眠りについた[b]。
  to: そして、ひざまずいて、大声で叫んだ。「主よ、この罪を彼らの責任として問わないでください[a]。」こう言って、彼は眠りについた[b]。
  rationale: 主な修正は、罪を他者に負担させるようにも読める「彼らに負わせない」を、「彼らの責任として問わない」に改めた点である。これにより、原文の『罪を彼らに対して計上しない』という願いを、現代日本語で自然かつ過度な教義的含意なく表す。その他の表現と脚注アンカーは原文への忠実さおよび文体の自然さを保っている。
