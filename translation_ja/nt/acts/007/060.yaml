id: ACT.7.60
reference: Acts 7:60
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: ja
  text: そして、ひざまずいて、大声で叫んだ。「主よ、この罪を彼らの責任として問わないでください[a]。」こう言って、彼は眠りについた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この罪を彼らの責任としないでください」または「この罪を彼らの勘定に入れないでください」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「眠りについた」。死を表す慣用的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: そして、ひざまずくと
  rationale: 直訳的な「ひざを置く」は、ひざまずく動作を表す慣用句である。δέは物語の進行を示す「そして」とし、分詞構文は自然な時間的つながりを表す「～すると」で訳した。
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: 大声で叫んだ
  rationale: κράζωの強い発声とφωνῇ μεγάλῃの明示的な強調を、簡潔で自然な現代日本語で保った。
- source_word: Κύριε
  choice: 主よ
  rationale: 文脈上イエスに向けられた呼びかけであり、新約聖書における称号としてのκύριοςを尊厳ある定訳で表した。
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: この罪を彼らに負わせないでください
  rationale: στήσῃςがここで持つ、罪を相手の責任として据える、または勘定に入れるという意味を自然な日本語で表した。ταύτηνの指示性も「この」によって明示した。
- source_word: καὶ τοῦτο εἰπὼν
  choice: こう言って
  rationale: 直前の祈りの言葉を指すτοῦτοと、その後に続く出来事との時間的つながりを簡潔に表した。
- source_word: ἐκοιμήθη
  choice: 彼は眠りについた
  rationale: 死を表すκοιμάομαιの睡眠の比喩を平板な「死んだ」に置き換えず、日本語でも理解可能な形で保持した。
theological_decisions:
- issue: ἐκοιμήθηにおける死の婉曲表現
  choice: 彼は眠りについた
  alternative: 彼は死んだ
  rationale: ギリシア語本文が用いる睡眠の比喩とその神学的余韻を保ちつつ、脚注で死を意味することを明確にした。
- issue: ステファノの祈りにおけるΚύριεの呼びかけ
  choice: 主よ
  alternative: 主人よ
  rationale: 直前の文脈では呼びかけの相手がイエスであり、「主よ」は称号としての意味と礼拝的な響きを保つ。本文が明示する以上の説明は加えなかった。
- issue: 罪を彼らに『負わせない』という願い
  choice: この罪を彼らに負わせないでください
  alternative: この罪を彼らの勘定に入れないでください
  rationale: 法廷的・会計的な含みを残しながら、特定の贖罪論や罪の転嫁に関する体系的教義を本文へ持ち込まない自然な表現を選んだ。
translation_notes:
  register: 明瞭で現代的かつ尊厳ある文体とした。祈りは丁寧な願いの形にし、大声での叫びとの緊張を保った。睡眠による死の比喩は本文に残し、意味を脚注で補った。
