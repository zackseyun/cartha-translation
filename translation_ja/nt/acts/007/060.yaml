  terminology: 「主よ」はκύριεに適切であり、前節から示される呼びかけの相手について本文以上の解釈を加えていない。「眠りについた」はἐκοιμήθηの比喩を保持しており、脚注も適切である。罪の扱いは「負わせる」より「責任として問う」の方が、原文の勘定・帰責の比喩に近い。
