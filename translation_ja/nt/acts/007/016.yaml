source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: ja
  text: そして彼らはシケムへ運ばれ、アブラハムがハモルの子らからシケムで銀の代価で買った墓に葬られました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ステファノの表現は、創世記23章の、アブラハムがマクペラでエフロンから埋葬地を買った記事と、創世記33章19節の、ヤコブがシケム近くの土地をハモルの子らから買った記事を想起させます。本文末尾の「シケムで」は、ギリシア語では「ハモル」にかかるとも、購入の場所を示すとも理解できます。
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: 移され
  rationale: μετατίθημιのアオリスト受動態で、族長たちの遺骸が別の場所へ移されたことを表す。簡潔で自然な受動表現とした。
- source_word: Συχὲμ / Συχέμ
  choice: シケム
  rationale: 日本語聖書で広く通用する地名表記。
- source_word: ἐτέθησαν
  choice: 葬られました
  rationale: 直訳は「置かれた」だが、墓を目的地とする埋葬の文脈では「葬られた」が自然で意味を明確に伝える。
- source_word: μνήματι
  choice: 墓
  rationale: 埋葬場所を指す一般的で明瞭な日本語。
- source_word: ᾧ
  choice: （アブラハムが…買った）墓
  rationale: 関係代名詞が「墓」を修飾する構造を、日本語では連体修飾節として自然に表した。
- source_word: ὠνήσατο
  choice: 買った
  rationale: 売買による取得を表す基本的な意味を、現代日本語で平明に訳した。
- source_word: τιμῆς ἀργυρίου
  choice: 銀を支払って
  rationale: 銀による代価を表す属格句。直訳調の「銀の代価で」より自然でありつつ、銀が支払われたことを保持する。
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: ハモルの子らから
  rationale: παρά＋属格の出所を「から」で示し、υἱῶνの複数形も保持した。
- source_word: ἐν Συχέμ
  choice: シケムのハモル
  rationale: 語順上「ハモル」に結び付けて「シケムのハモル」とした。ただし、この句は取引の場所を示すとも理解できるため、その統語的な余地は注記判断の対象となり得る。
theological_decisions:
- issue: 創世記の埋葬地購入記事との歴史的緊張
  choice: ギリシア語本文どおり、アブラハムがシケムでハモルの子らから墓を買ったというステファノの言葉を本文に保持する。
  alternative: 創世記33:19のヤコブによる購入、または創世記23章のアブラハムによるマクペラの購入に合わせて本文を調和させる。
  rationale: 翻訳本文は関連する旧約記事に合わせて修正せず、現存するギリシア語本文を忠実に示す。読者が比較できるよう、歴史的緊張は脚注で説明する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、語り手の丁寧な演説調に合わせて「葬られました」とした。本文の歴史的緊張は調和させず、脚注で関連箇所を示した。
