id: ACT.7.31
reference: Acts 7:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: ja
  text: モーセはそれを見て、その光景[a]に驚いた。よく見ようと近づくと、主[b]の声がした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幻」とも訳せる。ギリシア語は、目に見える現れや幻を指し得る。ここではモーセが目の前の現象を見ているため、「光景」とした。
    reason: lexical_alternative
  - marker: b
    text: この場面は出エジプト記3章を踏まえているが、ここのギリシア語本文は「主」（κύριος）と記している。
    reason: theological_clarity
lexical_decisions:
- source_word: ἰδὼν
  choice: それを見て
  rationale: アオリスト分詞を主動詞に先立つ時の関係として自然な日本語にした。「それ」は直後の「光景」と文脈上の燃える柴を受ける。
- source_word: ἐθαύμασεν
  choice: 驚いた
  rationale: θαυμάζωがここで表す驚きと感嘆を、現代の一般読者に明瞭な語で表した。
- source_word: τὸ ὅραμα
  choice: その光景
  rationale: ὅραμαは「幻」とも訳せるが、ここではモーセが目の前の現象を見て近づく場面なので、「光景」が文脈に自然である。語の幅は脚注に残した。
- source_word: προσερχομένου δὲ αὐτοῦ
  choice: 近づくと
  rationale: 属格独立構文の時間的・付随的関係と、対象へ向かう動きを簡潔な日本語で表した。
- source_word: κατανοῆσαι
  choice: よく見ようと
  rationale: 注意深く観察するという視覚的な意味を、目的を示す自然な表現で訳した。
- source_word: ἐγένετο φωνὴ
  choice: 声がした
  rationale: ἐγένετοと名詞による出来事の発生を、日本語で声の出現を表す自然な言い方にした。「聞こえた」として知覚を明示的に加えることは避けた。
- source_word: κυρίου
  choice: 主
  rationale: ギリシア語κύριοςを「主」と訳した。出エジプト記3章との関連から神名を示す表記も想定され得るが、本文のギリシア語の形を優先した。
theological_decisions:
- issue: 神顕現の文脈におけるκύριοςの表記
  choice: 主
  alternative: 神名を明示する表記（「主」）
  rationale: この箇所は出エジプト記3章を踏まえるが、ギリシア語本文は神名そのものではなくκύριοςであるため、訳文では「主」とした。神名との関連は脚注で説明した。
translation_notes:
  register: 明瞭な現代標準語を用い、説教内の物語として簡潔で dignified な調子を保った。「驚嘆した」のような硬い表現を避けつつ、口語的になりすぎない文体とした。
