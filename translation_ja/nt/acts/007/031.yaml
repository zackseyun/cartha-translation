  source_fidelity: 「それを見て」はἰδὼνの先行する行為を自然に表し、「その光景に驚いた」はἐθαύμασεν τὸ ὅραμαを適切に再現している。「よく見ようと近づくと」は属格独立とκατανοῆσαιの目的を明確に保つ。「主の声がした」はἐγένετο φωνὴ κυρίουの出来事を自然な日本語で表し、声の主を「主」として保持している。
  naturalness: 明瞭な現代標準語であり、叙述は簡潔で不自然な直訳調がない。「よく見ようと近づくと、主の声がした」という流れも自然である。
  terminology: κύριοςを「主」としたのは、ギリシア語本文に即し、出エジプト記への暗示を訳文で過度に解釈しない適切な処理である。「光景」は当該の目に見える現象という文脈に合い、可能な別訳「幻」は脚注で適切に示されている。
