    rationale: ἀναστήσειは字義的には「起こす／起こされる」であり、ὑμῖνがすでに「あなたがたのために」を表す。「くださる」は神への敬語として不自然ではないが、恩恵性を追加的に響かせるため、「起こされる」のほうが原文に近く明快である。
