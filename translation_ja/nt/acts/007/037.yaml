id: ACT.7.37
reference: Acts 7:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: ja
  text: この人こそ、イスラエルの人々[a]に、『神はあなたがたのために、あなたがたの同胞の中から[b]、私のような預言者[c]を起こされる』と言ったモーセです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「イスラエルの子ら」。ギリシア語は男性複数形である。「イスラエルの民」または「イスラエル人」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここで「同胞」と訳した語は、直訳では「兄弟たち」であり、同じイスラエルの民に属する人々を指す。
    reason: cultural_note
  - marker: c
    text: 申命記18章15節を踏まえ、「あの預言者」と解する訳もある。しかし、ギリシア語本文はここでは無冠詞で、単に「預言者」としている。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: この人こそ……あのモーセです
  rationale: 指示詞と冠詞を伴う同定の強調を、自然な現代日本語の「この人こそ」「あのモーセ」で表した。
- source_word: ὁ εἴπας
  choice: 言った
  rationale: モーセを限定するアオリスト分詞を、日本語では連体修飾節として自然に訳した。
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: イスラエルの子ら
  rationale: υἱοῖςの語形と旧約引用の響きを保つ。通常の日本語では「イスラエルの民」とも訳せるため注記した。
- source_word: Προφήτην
  choice: 預言者
  rationale: 無冠詞名詞であり、特定の称号と断定せず、そのまま「預言者」とした。日本語では不定冠詞を補わない。
- source_word: ἀναστήσει
  choice: 立ててくださる
  rationale: この預言的文脈で、神が預言者を起こし任命する働きを表す慣用的かつ自然な訳。神を主語とする引用内の敬意も自然な日本語で示した。
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: あなたがたの同胞の中から
  rationale: ἐκの集団内部からという意味を明示し、ἀδελφῶνの民族的・同族的意味を現代日本語で誤解なく伝える。
- source_word: ὡς ἐμέ
  choice: 私のような
  rationale: モーセとの類似を示す比較句を直接かつ自然に訳した。
theological_decisions:
- issue: 申命記18章15節の引用とメシア的意義
  choice: 本文では「預言者」と訳し、称号化しない
  alternative: 「あの預言者」または「預言者なる方」
  rationale: 使徒言行録の文脈ではイエスへの適用が重要だが、ギリシア語のΠροφήτηνは無冠詞である。本文で解釈を先取りせず、キリスト論的意義は文脈に委ねる。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「この人こそ……あのモーセ」で原文の強い同定を保ち、引用部は聖書的な響きを残しつつ一般読者にも理解しやすくした。
