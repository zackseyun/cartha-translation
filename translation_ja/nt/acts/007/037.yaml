  to: この人こそ、イスラエルの人々[a]に、『神はあなたがたのために、あなたがたの同胞の中から[b]、私のような預言者[c]を起こされる』と言ったモーセです。
  rationale: 本文を自然な現代標準日本語に整えつつ、原文の強調と引用の構造を保った。「イスラエルの人々」は本文の読みやすさを優先し、υἱοῖςの語形は脚注に保存した。ἀναστήσειは「起こされる」として、神が一人の預言者を起こすという原文の表現を直接反映した。脚注アンカーは各注記の対象語に対応している。
