  source_fidelity: 主要な内容は原文に忠実である。οὗτόςの強調、モーセによる発言、イスラエルの子ら、同胞の中から、モーセとの比較はいずれも適切に表されている。ただし、ἀναστήσει はこの引用では「起こされる」とするほうが「raise up」の語義をより直接に保つ。「立ててくださる」は任命の意味に寄り、さらに敬語の恩恵表現が ὑμῖν（あなたがたのために）と重なっている。
  naturalness: 「イスラエルの子ら」は意味は通るものの、明瞭な現代標準日本語としてはやや直訳調である。本文は「イスラエルの人々」とし、原語が男性形の「子ら」である点は注記で保持するのが自然である。「この人こそ……と言ったモーセです」は、不要な「あの」を用いずとも原文の同定・強調を自然に表せる。
  terminology: 「預言者」は無冠詞のΠροφήτηνを不必要に称号化せず、適切である。「同胞」はここでのἀδελφῶν、すなわち同じイスラエルの民に属する者という意味に合う。脚注では「あの預言者」という解釈的訳の可能性を、本文の無冠詞形と区別して示す。
