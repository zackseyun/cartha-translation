  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: ja
  text: 「彼らが仕える[a]国を、わたしが裁く」と神は言われた。「その後、彼らは出て来て、この場所でわたしを礼拝する[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らが奴隷として仕える国」「彼らが隷属する国」。ギリシア語は「仕える」という動詞を用いているが、文脈ではエジプトでの奴隷状態を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「わたしに仕える」。ここで用いられているギリシア語は、神にささげる宗教的奉仕や礼拝を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: 国
  rationale: ここではアブラハムの子孫を隷属させる政治的共同体、すなわちエジプトを指すため、現代日本語で自然な「国」とした。
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: 彼らが奴隷として仕える
  rationale: δουλεύωの基本的な「仕える」という動詞表現を保ちつつ、文脈上の強制的な隷属を「奴隷として」によって明示した。
- source_word: κρινῶ ἐγώ
  choice: わたしが裁く
  rationale: κρίνωの司法的な意味を「裁く」で保ち、明示されたἐγώの強調は主格助詞「が」によって自然に表した。
- source_word: ὁ θεὸς εἶπεν
  choice: と神は言われた
  rationale: 引用途中の発話者表示として自然な日本語の語順を用いた。神への敬意を示しつつ簡潔な聖書叙述となる表現にした。
- source_word: μετὰ ταῦτα
  choice: その後
  rationale: 複数指示語を逐語的に「これらのことの後」とせず、出来事の順序を明瞭に伝える自然な現代日本語とした。
- source_word: ἐξελεύσονται
  choice: そこから出て来て
  rationale: 隷属していた国からの脱出を表す。日本語では起点を補うことで出エジプトの動きを明確にした。
- source_word: λατρεύσουσίν μοι
  choice: わたしを礼拝する
  rationale: 神に向けられたλατρεύωは宗教的奉仕を表すため、現代の読者に明確な「礼拝する」を採用した。
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: この場所で
  rationale: 場所を示す表現を簡潔かつ直接的に訳し、指示対象を本文以上に限定しなかった。
theological_decisions:
- issue: 奴隷状態の文脈におけるδουλεύωの訳し方
  choice: 奴隷として仕える
  alternative: 仕える／隷属する
  rationale: 単に「仕える」では自発的奉仕とも読めるため、エジプトでの強制的隷属という文脈を示した。一方、動詞を名詞的な「奴隷にされる」だけに置き換えず、原文の「仕える」という構造も保った。
- issue: 神に対するλατρεύωの訳し方
  choice: 礼拝する
  alternative: 仕える／礼拝をささげる
  rationale: ここでは一般的な労働ではなく神への宗教的奉仕を意味する。「礼拝する」はその意味を明瞭に伝え、特定教派の儀礼理解を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神の直接話法には「わたし」を用い、過度に古風な語尾を避けた。二つの「仕える」に相当する異なるギリシア語の意味の違いを、本文と脚注で示した。
