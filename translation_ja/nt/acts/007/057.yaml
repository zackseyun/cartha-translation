  source_fidelity: ギリシア語の動作連鎖（大声で叫ぶ、耳をふさぐ、一団となって彼に向かって突進する）を正確に反映している。「ステファノ」は直前の文脈から明らかな指示対象を自然に明示しており、意味を付加していない。「襲いかかった」はὥρμησαν ἐπ’ αὐτόνの敵対的で勢いある対人的動きを適切に表す。
  naturalness: 明瞭で現代標準日本語として自然な物語文である。「大声で叫び、自分たちの耳をふさぐと、…襲いかかった」という連続した描写も読みやすい。
