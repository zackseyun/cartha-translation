  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: ja
  text: しかし彼らは大声で叫び、自分たちの耳をふさぐと、心を一つにして[a]ステファノに襲いかかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一斉に」。ギリシア語は、彼らが同じ思いで一致して行動したことを強調する。
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: 叫び
  rationale: アオリスト分詞の付帯的・先行的な動作を、日本語では後続動作と自然につながる連用形で表した。「叫ぶ」は大声を発する意味を保ち、感情の種類を過度に限定しない。
- source_word: δὲ
  choice: しかし
  rationale: ステファノの幻の告白に対する群衆の敵対的反応への転換を示すため、軽い対照を自然な日本語で表した。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 直訳的な「大きな声で」より簡潔で自然でありながら、声の大きさを明確に保持する。
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: 自分たちの耳をふさぐと
  rationale: 聞くまいとして耳を閉ざす動作を、現代日本語で明瞭に表す。「自分たちの」は再帰的な αὐτῶν を自然に反映する。
- source_word: ὥρμησαν
  choice: 襲いかかった
  rationale: 人に向かう突然で勢いのある敵対的動きを自然に表す。単なる「駆け寄った」では文脈上の攻撃性が弱く、「突進した」より一般読者に平明である。
- source_word: ὁμοθυμαδὸν
  choice: 心を一つにして
  rationale: 単なる同時性ではなく、意志や目的を共有した一致した行動を示す副詞の含意を保持する。
- source_word: ἐπ’ αὐτόν
  choice: ステファノに
  rationale: ἐπί＋対格が示す、彼に向けられた動きを「襲いかかる」の対象として自然に表した。代名詞より固有名を補うことで、日本語での指示対象を明瞭にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「心を一つにして」は一致した敵対行動という原文の緊張を保ち、脚注で簡潔な別訳を示した。
