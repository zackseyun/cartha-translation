revisions:
- from: 「だれがあなたを支配者や裁判官に任命したのか」と言って彼らが退けた、このモーセを、神は、柴の中で彼に現れた御使いの手によって、支配者また解放者[a]として遣わしたのである。
  to: 「だれがあなたを支配者や裁判官に任命したのか」と言って彼らが退けたこのモーセを、神は、柴の中で彼に現れた御使いの手によって、このモーセを支配者として、また解放者[a]として遣わしたのである。
  rationale: 二度目の「このモーセを」を補い、原文の反復と、民の拒絶と神の派遣との対照を保持した。「支配者として、また解放者として」は、καὶ … καὶ による二つの役割の並列を明確にする。脚注は本文の「解放者」を維持しながら、贖いの語感を持つ自然な代替訳を示すよう整えた。
