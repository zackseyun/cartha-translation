    rationale: ギリシア語は「このモーセを」と「この者を」を反復し、拒絶された当人こそ神が遣わした者であることを際立たせる。日本語でも「このモーセを」を二度用いることで、この修辞的対照を無理なく保てる。
  - severity: low
    issue: 脚注の別訳「贖う者」はやや説明的で、日本語の役割名としては不自然さがある。
    rationale: 「贖い手」は λυτρωτής に対応する自然な名詞であり、本文の「解放者」と区別しつつ、原語にあり得る贖いの含意を適切に示せる。
