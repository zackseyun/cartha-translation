  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: ja
  text: 「だれがあなたを支配者や裁判官に任命したのか」と言って彼らが退けたこのモーセを、神は、柴の中で彼に現れた御使いの手によって、このモーセを支配者として、また解放者[a]として遣わしたのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「贖い手」。原語は、束縛から解き放ち、自由にする者を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: 退けた
  rationale: モーセの権威を認めず拒絶したという文脈上の意味を、自然で明確な日本語で表す。
- source_word: κατέστησεν
  choice: 任命した
  rationale: 支配者・裁判官という地位に就けることを問う表現なので、職務への任命を明確に示す。
- source_word: ἄρχοντα
  choice: 支配者
  rationale: 権威を行使する者という公的な意味を保ち、節内で同じ語が繰り返される修辞も維持する。
- source_word: δικαστήν
  choice: 裁判官
  rationale: 裁きを行う者を指す語として、現代日本語で直接的かつ明瞭である。
- source_word: λυτρωτήν
  choice: 解放者
  rationale: 拘束や苦境から自由にする者という語義と、出エジプトの文脈におけるモーセの役割を自然に表す。「贖い主」はキリスト論的称号として意味を狭めるおそれがあるため本文では避けた。
- source_word: ἀπέσταλκεν
  choice: 遣わした
  rationale: 神から使命を与えられて送られたことを表す、聖書文脈にふさわしい自然な訳語である。ギリシア語完了形の結果的意義は文脈に委ねた。
- source_word: σὺν χειρὶ
  choice: 御使いの手によって
  rationale: 媒介・手段を示すセム語的表現を保ち、御使いを介した神の働きを明示する。
- source_word: ἀγγέλου
  choice: 御使い
  rationale: 柴の中でモーセに現れた天的存在を指すため、日本語聖書で定着した表現を用いる。
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: 柴の中で彼に現れた
  rationale: 受動形の分詞を日本語では自然な「現れた」とし、原文にない「燃える」は補わない。
- source_word: Τοῦτον ... τοῦτον
  choice: このモーセを…このモーセを
  rationale: ギリシア語の反復による強調は、日本語では前置された長い目的語全体と「神は」の対照によって表した。文中で不自然に「この人」を重ねることは避けた。
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: 支配者また解放者として
  rationale: 二つの役割を並列して強調する反復の力を、「また」によって簡潔に保つ。
theological_decisions:
- issue: 救済史におけるモーセの役割を示す λυτρωτής の訳
  choice: 解放者
  alternative: 贖う者／贖い主
  rationale: この語には代価による解放を含み得る広がりがあるが、ここでは神がモーセをイスラエル解放の担い手として遣わしたことが前景にある。「解放者」はその意味を明瞭にしつつ、モーセに特定のキリスト論的称号を直接当てはめることを避ける。別訳は脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「御使い」「遣わした」など聖書叙述にふさわしい品位を保った。原文の長い前置目的語を維持し、民が退けた当のモーセを神が遣わしたという対照を際立たせた。
