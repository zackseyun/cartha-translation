  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: ja
  text: 『わたしはあなたの父祖の神、アブラハムとイサクとヤコブの神である。』モーセは恐れおののき、よく見ようとはしなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「詳しく調べようとはしなかった」「注意深く観察しようとはしなかった」。ギリシア語の動詞は、よく見ることにも、注意深く考察することにも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: わたしは、あなたの父祖たちの神…である
  rationale: 動詞のない神の自己宣言に、日本語として必要な「である」を補った。Ἐγώの明示による強調を「わたしは」で保ち、πατέρωνは契約史的な響きを保ちながら現代日本語で自然な「父祖たち」とした。
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: アブラハムとイサクとヤコブの神
  rationale: 三つの名を結ぶ反復的なκαίを「と…と…」で表し、引用句の調子を保った。
- source_word: ἔντρομος … γενόμενος
  choice: 恐れおののき
  rationale: 恐怖と震えを伴う状態になったことを、簡潔で格調ある自然な日本語で表した。分詞構文は後続動作との連続が分かるように処理した。
- source_word: οὐκ ἐτόλμα
  choice: …ようとはしなかった
  rationale: τολμάωの「敢えてする」という意味と未完了過去の持続的なためらいを、日本語として自然に表した。
- source_word: κατανοῆσαι
  choice: よく見よう
  rationale: この文脈では対象を注意深く見る意味が中心であるため「よく見る」とした。ただし、詳しく調べる・注意深く観察するという語義の幅は脚注に残した。
theological_decisions:
- issue: 出エジプト記からの神の自己宣言をどう表すか
  choice: わたしは、あなたの父祖たちの神…である
  alternative: わたしこそ、あなたの先祖たちの神…である
  rationale: 強意の代名詞を保ちつつ、「わたしこそ」として原文以上の排他的強調を加えることは避けた。また「父祖たち」は族長たちとの契約を想起させる表現を保つ。
- issue: モーセが敢えてしなかった行為の解釈
  choice: よく見ようとはしなかった
  alternative: 詳しく調べようとはしなかった
  rationale: 燃える柴という視覚的文脈に即して具体的な意味を本文に採用したが、κατανοέωが注意深い観察や考察をも表し得る曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書引用としての品位と反復の調子を保った。「父祖たち」は一般的な「先祖たち」よりやや荘重だが、この契約史的文脈では理解可能で適切である。
