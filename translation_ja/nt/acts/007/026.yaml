  - severity: low
    issue: Ἄνδρεςに対応する本文上の呼びかけがない
    rationale: 「二人とも」は対象が二人であることを示すが、呼びかけの語としてのἌνδρεςを本文では表していない。「皆さん」は現代日本語として自然で、男性複数への呼びかけという原文の機能をおおむね保てる。
