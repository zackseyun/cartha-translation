  to: 翌日、モーセは争っている二人のところに現れ、二人を仲直りさせようとし[a]、こう言った。「皆さん、あなたがたは兄弟同士だ[b]。なぜ互いに不当に扱うのか。」
  rationale: 本文の意味を変えず、συνήλλασσενとεἰπώνの関係を明瞭にした。「皆さん」によりἌνδρεςの呼びかけを自然な現代日本語で本文にも反映し、「不当に扱う」でἀδικέωの対人的な不正をより直接に表した。脚注のアンカーと内容はいずれも保持し、脚注bは本文の「兄弟同士」を補足する。
