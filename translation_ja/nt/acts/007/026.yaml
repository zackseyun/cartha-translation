  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: ja
  text: 翌日、モーセは争っている二人のところに現れ、二人を仲直りさせようとし[a]、こう言った。「皆さん、あなたがたは兄弟同士だ[b]。なぜ互いに不当に扱うのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仲直りさせていた」とも訳せる。ギリシャ語の未完了過去は継続中の行為を表し得るが、次節で拒まれることから、ここでは仲直りさせようとする試みを表すと考えられる。
    reason: 時制・相の解釈上の別訳
  - marker: b
    text: 直訳は「男たちよ、あなたがたは兄弟だ」。ここでの「兄弟」は、同じ民に属する同胞であることを指す。
    reason: 呼びかけの字義と文化的意味の説明
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: 翌日
  rationale: 時間を表す与格句を、前日の出来事に続くことが明確な自然な現代日本語で表した。
- source_word: ὤφθη
  choice: 現れ
  rationale: ὁράωのアオリスト受動形は物語では自動詞的に「現れる」の意を持つため、「見られた」より自然である。
- source_word: αὐτοῖς μαχομένοις
  choice: 争っている二人のところに
  rationale: 与格分詞の同時進行の意味を保ち、文脈上の二人を明示して自然な日本語にした。
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: 二人を仲直りさせようとして
  rationale: 未完了過去を、次節で拒絶されることに合う試みの用法として訳した。「仲直り」はεἰς εἰρήνηνが示す平和な関係への移行を自然に表す。
- source_word: Ἄνδρες
  choice: 二人とも
  rationale: 直訳の「男たちよ」は現代日本語では不自然なため、二人への直接の呼びかけとして訳した。字義的形は脚注に示した。
- source_word: ἀδελφοί ἐστε
  choice: あなたがたは兄弟同士だ
  rationale: 同じイスラエル民族に属する者としての結びつきへの訴えを、自然かつ明確に表した。
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: なぜ互いに不当なことをするのか
  rationale: ἀδικέωの「害する／不正を行う」という倫理的含意を残しつつ、相互代名詞ἀλλήλουςを明示した。
theological_decisions:
- issue: ἀδελφοίが指す関係
  choice: 民族的同胞関係を含む「兄弟同士」
  alternative: 実の兄弟
  rationale: 文脈では争う二人のイスラエル人への呼びかけであり、血縁上の実兄弟に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、語り口の品位を保った。「男たちよ」のような硬く不自然な直訳は本文で避けつつ、原文の形を脚注に残した。
