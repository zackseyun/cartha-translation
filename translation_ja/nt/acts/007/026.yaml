  naturalness: 全体として明瞭な現代標準語である。「二人とも」は自然だが、Ἄνδρεςという呼びかけの内容を本文から完全に退かせるため、「皆さん」のような自然な呼びかけを置くほうが、脚注への依存を減らしつつ原文に近い。
  terminology: 「兄弟」は原文のἀδελφοίに対応し、脚注で同胞関係を説明しているため適切である。「不当なことをする」も意味は通るが、「互いに不当に扱う」のほうがἀδικεῖτεの対人的な不正という意味を日本語でより直接的に表せる。
