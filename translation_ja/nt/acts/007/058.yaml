id: ACT.7.58
reference: Acts 7:58
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: ja
  text: そして彼らは、彼を町の外へ追い出し、石を投げつけていた。証人たちは、自分たちの上着[a]を、サウロと呼ばれる若者の足もとに置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「衣服」または「外套」。ギリシア語は広く外衣を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: 追い出し
  rationale: アオリスト分詞が主動詞に先立つ強制的な排除を表すため、日本語では動作の順序が自然に伝わる連用形とした。
- source_word: ἔξω τῆς πόλεως
  choice: 町の外へ
  rationale: 内側から外側への移動を「へ」で明確にし、ἐκβαλόντεςとの結び付きを自然に表した。
- source_word: ἐλιθοβόλουν
  choice: 石を投げつけていた
  rationale: 未完了過去の継続的な相を「ていた」で示し、石打ちが進行中だったことを保った。
- source_word: οἱ μάρτυρες
  choice: 証人たち
  rationale: ここでは処刑に関わる法的な証人を指し、後代の「殉教者」という意味は文脈に合わない。
- source_word: ἀπέθεντο
  choice: 置いた
  rationale: 衣服を外して傍らに置く行為を、後続の「足もとに」と自然に結び付く簡潔な語で表した。
- source_word: τὰ ἱμάτια αὐτῶν
  choice: 自分たちの上着
  rationale: αὐτῶνの再帰的な関係を「自分たちの」で明示し、ἱμάτιαを一般的な外衣として分かりやすく訳した。語の範囲は脚注で示した。
- source_word: παρὰ τοὺς πόδας
  choice: 足もとに
  rationale: 人の足のそばに物を置くことを表す、自然な現代日本語とした。
- source_word: νεανίου
  choice: 若者
  rationale: 比較的若い男性を指す語として、簡潔で現代的な表現を採用した。
- source_word: καλουμένου Σαύλου
  choice: サウロと呼ばれる
  rationale: 分詞の受動的な形を保ちつつ、名前を紹介する自然な日本語とした。
theological_decisions:
- issue: 処刑の場面における μάρτυρες の意味
  choice: 法的な意味で「証人たち」と訳す
  alternative: 「殉教者たち」
  rationale: この物語の文脈では、証言を行い石打ちに関与する者たちを指す。後代に発達した「殉教者」の意味を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二つの節を原文どおり順に示し、未完了過去の進行性を「石を投げつけていた」で表した。
