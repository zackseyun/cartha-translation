  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: ja
  text: そこで彼は言った。「兄弟である皆さん、また父である方々[a]、聞いてください。栄光の神は、私たちの父祖アブラハムがメソポタミアにいた時、彼がハランに住む前に[b]、彼に現れました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くすれば「男性たち、兄弟たち、父たち」。ギリシア語の呼びかけは明示的に男性形を用いる格式ある表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ハランに居住する前に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: そこで彼は言った
  rationale: δέはここでは軽い談話上の接続を示す。「そこで」は直前の問いに対するステファノの応答を自然に導き、ἔφηを「言った」と簡潔に訳す。
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: 兄弟である皆さん、また父である方々
  rationale: 議会と聴衆に向けた、明示的に男性を指す敬意ある呼びかけ。「兄弟たち、父たち」という不自然な逐語訳を避けつつ、ἀδελφοίとπατέρεςの関係的意味と男性性を保つ。ἄνδρεςは呼格定型句の一部として日本語の「皆さん」に吸収した。
- source_word: ἀκούσατε
  choice: 聞いてください
  rationale: 注意を促す命令。現代日本語で自然な丁寧さを持たせながら、公式の場での呼びかけにふさわしい直接性を保つ。
- source_word: Ὁ θεὸς τῆς δόξης
  choice: 栄光の神
  rationale: 属格構造を保ち、旧約聖書を思わせる表現上の響きを「栄光に満ちた神」などの説明的な形に解消しない。
- source_word: ὤφθη
  choice: 現れました
  rationale: 神の顕現を表す文脈でのὁράωの受動形。「ご自身を啓示した」は解釈を加えるため避け、自然で原文に近い表現とした。
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: 私たちの父祖アブラハムに
  rationale: 共同体がアブラハムを祖先として認める表現。「父」だけでは実父と誤解され得るため、日本語で自然な「父祖」を用いる。文中では代名詞「彼に」で受け、重複を避けた。
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: メソポタミアにいた時
  rationale: 分詞の時間的・状況的用法を、明瞭で自然な現代日本語にした。
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: 彼がハランに住み着く前に
  rationale: κατοικέωは「住む」と「定住する」の幅を持つ。ここでは移住の展開を示す文脈に合う「住み着く」を本文に採り、より中立的な代案を注記する。
theological_decisions:
- issue: 男性に限定された呼びかけの訳し方
  choice: 兄弟である皆さん、また父である方々
  alternative: 男性の皆さん、兄弟たち、父たち
  rationale: 原文が男性を明示する点を中性化せずに保つ一方、ἄνδρεςを独立した第三の呼称として不自然に逐語訳しない。
- issue: θεὸς τῆς δόξηςという神の称号
  choice: 栄光の神
  alternative: 栄光に満ちた神
  rationale: 原文の属格構造と聖書内の響きを保ち、形容的な言い換えによって解釈を狭めない。
- issue: アブラハムへの神の顕現
  choice: 彼に現れました
  alternative: ご自身を彼に現されました
  rationale: 中動的・再帰的な意味を補わず、ὤφθηの一般的な神顕現用法を簡潔に表す。
translation_notes:
  register: 明瞭な現代標準語を用い、議会での弁明にふさわしい丁寧で格調ある語調とした。聖書的称号「栄光の神」は簡潔に保持し、呼びかけは日本語として自然になるよう整えた。
