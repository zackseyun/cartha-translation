  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: ja
  text: 彼らはこれを聞くと、心を切り裂かれたような激しい憤りに駆られ、ステファノに向かって歯ぎしりした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: 彼らはこれを聞くと
  rationale: 分詞の時間的・状況的な働きを自然な日本語で表した。δέはここでは軽い展開を示すため、独立した接続語を置かず「と」による文の流れに含めた。ταῦταは直前のステファノの発言全体を指す。
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: 心を切り裂かれるように憤り
  rationale: διεπρίοντοの「切り裂かれる／のこぎりでひかれる」という鮮烈な比喩と、文脈上の激しい怒りの双方を伝える。「胸を刺される」だけでは悔悟とも受け取られやすいため、ここでは感情の方向を明示した。
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: 歯ぎしりした
  rationale: 怒りや敵意を示す慣用的で鮮明な動作として、現代日本語でも自然な表現を選んだ。
- source_word: ἐπ’ αὐτόν
  choice: ステファノに向かって
  rationale: 敵意ある動作の方向を表す。日本語では代名詞の「彼」より、指示対象であるステファノを明示するほうが分かりやすい。
