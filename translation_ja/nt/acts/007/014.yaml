  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: ja
  text: そこでヨセフは人を遣わし、父ヤコブと親族一同を呼び寄せた。全部で七十五人であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旧約聖書の一部の箇所では、合計が「七十人」とされている（例えば、創世記46章27節と出エジプト記1章5節のヘブライ語本文）。ここで使徒言行録は「七十五人」としている。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: 人を遣わし
  rationale: 目的語は明示されていないが、後続の「呼び寄せた」と結び付く使者派遣の行為を、自然な日本語で表した。
- source_word: δὲ
  choice: そこで
  rationale: 物語の進展と前後のつながりを示す接続辞として、現代日本語で滑らかな「そこで」を用いた。
- source_word: μετεκαλέσατο
  choice: 呼び寄せた
  rationale: 人を遣わして自分のもとへ来させる意味を簡潔に表し、「召喚した」のような強い公的含意を避けた。
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: 父ヤコブ
  rationale: 同格関係を日本語として自然かつ明瞭に表した。
- source_word: πᾶσαν τὴν συγγένειαν
  choice: 親族一同
  rationale: 血縁集団全体を指す語を、古風にならず、範囲の広さも保つ表現とした。
- source_word: ἐν ψυχαῖς
  choice: 全部で…人
  rationale: 直訳的な「魂」ではなく、人数を数える慣用表現として自然に訳した。
- source_word: ἑβδομήκοντα πέντε
  choice: 七十五
  rationale: ギリシア語本文の数をそのまま保持した。
theological_decisions:
- issue: 創世記・出エジプト記の本文伝承と人数が異なること
  choice: 七十五人
  alternative: 七十人
  rationale: 使徒言行録のギリシア語本文は明確に「七十五」とするため、本文ではこれを保持し、ヘブライ語本文に基づく旧約箇所の「七十」との相違は脚注で示した。調和のための改変は行っていない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「人を遣わし」と「呼び寄せた」により原文の二つの動作を保ち、「親族一同」で συγγένεια の集合的な意味を自然に表現した。
