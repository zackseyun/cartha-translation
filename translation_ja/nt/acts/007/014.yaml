  source_fidelity: 原文は「ヨセフは（使いを）送り、父ヤコブと親族全体を呼び寄せた。人数は七十五人」と述べる。訳文は、ἀποστείλας と μετεκαλέσατο の二つの動作を「人を遣わし」「呼び寄せた」として保ち、親族集団と七十五人という人数を正確に伝えている。「人を遣わし」は原文で明示されない目的語を文脈上自然に補う表現であり、意味を不当に限定しない。
  naturalness: 「そこでヨセフは人を遣わし、父ヤコブと親族一同を呼び寄せた。全部で七十五人であった。」は明瞭で自然な現代標準日本語である。「親族一同」は集合としての συγγένεια によく対応し、「全部で…人」は ἐν ψυχαῖς の人数を数える用法を自然に表す。
  terminology: 固有名詞「ヨセフ」「ヤコブ」は標準的である。「親族一同」は家族を狭く限定せず、πᾶσαν τὴν συγγένειαν の範囲を適切に表す。脚注は使徒言行録の「七十五人」を本文に維持しつつ、ヘブライ語本文における「七十人」との相違を非調和的・中立的に説明している。
