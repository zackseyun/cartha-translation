base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: ja
  text: 彼が四十歳になろうとしていたころ、彼の兄弟たち、すなわちイスラエルの子らを訪ねようという思いが、彼の心に起こった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼の心に上った」。内から起こった思いや決意を表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: 彼が四十歳になろうとしていたころ
  rationale: 時間的な移行と、四十年という期間が満ちつつあるという未完了形の含みを、自然な現代日本語で表した。単に「四十歳になった時」と断定するより原文の進行的な表現を保つ。
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: 思いが、その心に起こった
  rationale: 内的な意志・決意を表す慣用句だが、「決心した」と平板化せず、心に上るという原文の比喩を理解可能な日本語で残した。
- source_word: ἐπισκέψασθαι
  choice: 訪ねよう
  rationale: 文脈上、同胞のもとへ行ってその様子を見ることを指す。「訪ねる」は簡潔で自然であり、気遣いや顧みの含みも文脈から読み取れる。
- source_word: τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ
  choice: 兄弟であるイスラエルの子ら
  rationale: 「兄弟」と、それを同格的に特定する「イスラエルの子ら」をともに保持し、血縁的・民族的な仲間を指す原文の表現を再現した。
theological_decisions:
- issue: 男性形の親族・民族呼称
  choice: 兄弟であるイスラエルの子ら
  alternative: 同胞であるイスラエル人たち
  rationale: 原文の男性複数形と聖書的な家族表現を保持しつつ、ここで指すのがモーセの同胞イスラエル人であることを同格表現で明らかにした。男性だけに限定する意図を付加しない。
- issue: モーセの内的意志の表現
  choice: 思いが、その心に起こった
  alternative: 決心した
  rationale: 意志や決意を含み得るが、原文の比喩と、その強さに関する余地を残すため、断定的な心理説明に置き換えなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「イスラエルの子ら」は日常語より聖書的な表現だが、原文の同格構造と民族的・家族的な響きを保つため採用した。脚注記号は対応箇所に置いた。
