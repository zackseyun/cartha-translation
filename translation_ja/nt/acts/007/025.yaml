revisions:
- from: モーセは、神が自分の手を通して同胞たちに救いを与えておられることを、彼らも理解していると思っていた。しかし、彼らは理解しなかった。[a]
  to: モーセは、神がモーセの手を通して同胞たちに救い[a]を与えていることを、彼らが理解していると思っていた。しかし、彼らは理解しなかった。
  rationale: 「自分の手」を「モーセの手」に改め、原文の代名詞が指すモーセを明示した。これにより、救いを与える主体は神であり、モーセはその媒介者であるという構文上の関係を保持する。「おられる」は原文にない敬語的なニュアンスを加えるため「いる」とし、脚注記号は説明対象の「救い」に付した。
