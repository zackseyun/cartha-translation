  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: ja
  text: モーセは、神がモーセの手を通して同胞たちに救い[a]を与えていることを、彼らが理解していると思っていた。しかし、彼らは理解しなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「救い」は、「解放」または「救出」とも訳せる。ここでは、神がモーセを通してイスラエルを圧迫から解放することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: 思っていた
  rationale: 未完了過去の背景的・継続的な認識を自然な現代日本語で表す。文脈上は「考えていた」より、期待を含む「思っていた」が明快。
- source_word: συνιέναι / συνῆκαν
  choice: 理解している／理解しなかった
  rationale: 同根の動詞の反復を保ち、モーセの思いと実際との対照を明確にする。
- source_word: ἀδελφοὺς
  choice: 同胞たち
  rationale: ここでは実の兄弟ではなく、モーセと同じイスラエル民族に属する人々を指すため、日本語で自然かつ性別を不必要に限定しない民族的な親族表現とした。
- source_word: διὰ χειρὸς αὐτοῦ
  choice: 自分の手を通して
  rationale: 神の働きの媒介者・手段としてのモーセを表すヘブライ的な身体比喩を保持する。「彼を通して」より原文の像が伝わる。
- source_word: δίδωσιν
  choice: 与えておられる
  rationale: 歴史的現在の形を踏まえつつ、過去の場面における進行中の神の働きを表す。神への敬意を示す日本語として補助動詞を敬語化した。
- source_word: σωτηρίαν
  choice: 救い
  rationale: 語の広い意味範囲と使徒言行録における神学的響きを保ちながら、この文脈ではイスラエルの具体的な解放・救出を指すことを脚注で示す。
- source_word: αὐτοῖς
  choice: 同胞たちに
  rationale: 救いを受ける者を明示し、日本語の授与構文として自然にした。
theological_decisions:
- issue: モーセの文脈における σωτηρία の訳
  choice: 救い
  alternative: 解放／救出
  rationale: 原語は具体的な危難からの救出にも、より広い神の救いにも用いられる。「救い」を本文に置いて語の神学的広がりを残し、直近の文脈ではエジプトの圧迫からの解放を指すことを脚注で補う。
- issue: 神の働きとモーセの媒介
  choice: 神が自分の手を通して…与えておられる
  alternative: 神が自分によって…与える
  rationale: 救いの主体は神であり、モーセはその手段・媒介者であるという原文の関係を、そのまま保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「同胞たち」により民族的な兄弟関係を自然に表し、「自分の手を通して」で原文の比喩を保持した。脚注記号は本文中に配置した。
