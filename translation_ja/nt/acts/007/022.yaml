source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: ja
  text: モーセはエジプト人のあらゆる知恵について教育を受け、言葉にも行いにも[a]力がありました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「話すことにも行動にも力がありました。」
    reason: λόγοις καὶ ἔργοις は、具体的な「言葉と行い」とも、活動領域としての「話すことと行動」とも表現できるため。
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: 学び
  rationale: 受動形は教育・訓練を受けたことを表す。日本語では「教育を受け」も可能だが、「あらゆる知恵を学び」とするほうが自然で、学んだ内容との結びつきも明瞭である。
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: エジプト人のあらゆる知恵
  rationale: πάσῃ の広がりと、Αἰγυπτίων が示す帰属・源を保った。ここで「知恵」は知識だけでなく、エジプトの学問や教養を含みうる。
- source_word: δυνατὸς
  choice: 力がありました
  rationale: 「有力でした」より平易で、「優れていました」より原語の力強さを保つ。「言葉にも行いにも」と自然に結びつく。
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: その言葉にも行いにも
  rationale: λόγοις と ἔργοις の対句を「言葉／行い」で保った。αὐτοῦ を両方にかかる所有表現「その」として明示した。
- source_word: αὐτοῦ
  choice: その
  rationale: モーセ自身の言葉と行いを指す代名詞として訳出した。日本語で「彼の」を反復するより自然で、指示対象も明確である。
theological_decisions:
- issue: λόγοις におけるモーセの力と出エジプト記4章10節との緊張
  choice: 「その言葉にも行いにも力がありました」と本文どおりに訳す
  alternative: 出エジプト記4章10節と調和させ、「影響力があった」などと限定的に意訳する
  rationale: ステファノの発言をそれ自体の表現に即して訳し、モーセが自ら口下手だと述べる箇所との緊張を翻訳によって解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「知恵」「言葉」「行い」という聖書的な対句と格調を保った。敬体で統一した。
