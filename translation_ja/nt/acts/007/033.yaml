id: ACT.7.33
reference: Acts 7:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: ja
  text: すると、主は彼に言われた。「足から履物を脱ぎなさい。あなたが立っている場所は聖なる地だからである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 神を指す尊称として、新約ギリシア語のκύριοςを自然で伝統的な「主」と訳した。本文自体に神名はないため、「主なる神」などの補足はしない。
- source_word: Λῦσον
  choice: 脱ぎなさい
  rationale: 字義的には「解きなさい」だが、履物を目的語とする文脈では、求められている行為を現代日本語で自然に表す「脱ぎなさい」が適切である。
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: 足から履物を
  rationale: ὑπόδημαは文法上単数だが、集合的に履物を指し得る。複数形の「足」との不自然な組み合わせを避けつつ、原文を過度に複数化しない「履物」を採用した。
- source_word: ὁ τόπος ἐφ’ ᾧ ἕστηκας
  choice: あなたが立っている場所
  rationale: 完了形ἕστηκαςの現在の状態を「立っている」で表し、ἐφ’ ᾧは日本語で自然な関係表現にした。
- source_word: γῆ ἁγία
  choice: 聖なる地
  rationale: γῆはこの局所的な場面では「地面」または「地」を意味する。「聖なる地」は簡潔で格調があり、その場所が神聖であるという述語的意味を保つ。
theological_decisions:
- issue: 出エジプト記の神顕現を引用する箇所でのκύριοςの訳
  choice: 主
  alternative: 主なる神／ヤハウェ
  rationale: 使徒言行録のギリシア語本文はκύριοςであり、神名そのものを記してはいない。「主」とすることで原文を優先しつつ、神への畏敬と聖書内の連続性を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発話には簡潔で荘重な調子を持たせた。原文の単数形ὑπόδημαは、日本語で数を明示しない集合的な「履物」により自然に保持した。
