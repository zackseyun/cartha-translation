  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: ja
  text: 「かたくなで、心も耳も割礼を受けていない者たちよ。あなたがたはいつも聖霊に逆らっている。あなたがたの先祖[a]と同じように、あなたがたもそうしている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたの父たち」。ここでは以前の世代、すなわち先祖を指す。
    reason: 原語の男性複数形 πατέρες と、文脈上の指示対象を示すため。
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: 首をこわばらせ
  rationale: 「首の硬い」という聖書的な比喩を、現代日本語で理解できる動作表現として保った。「頑固な」とだけ訳して比喩を消すことは避けた。
- source_word: ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν
  choice: 心にも耳にも割礼を受けていない者たち
  rationale: 契約と預言者的叱責を背景とする「割礼」の比喩を保持し、与格を関係・領域を表す「にも」で自然に示した。
- source_word: ἀεὶ
  choice: いつも
  rationale: 継続して繰り返される反抗を、簡潔で自然な現代日本語で表した。
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: 聖霊
  rationale: 使徒言行録の文脈における、定冠詞を伴う神の聖霊への標準的な訳語を用いた。
- source_word: ἀντιπίπτετε
  choice: 逆らっている
  rationale: 単なる不賛成ではなく、能動的かつ持続的に対抗する意味を自然に表す。
- source_word: οἱ πατέρες ὑμῶν
  choice: あなたがたの父祖
  rationale: 直訳的な「父たち」の男性形と、過去の世代を指す文脈上の意味の両方を、日本語の聖書的かつ理解しやすい語で示した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたもそうしている
  rationale: 前節の動詞「逆らっている」を補って比較を日本語として完結させ、原文の強調された「あなたがたも」を保持した。
theological_decisions:
- issue: 「聖霊」の指示対象
  choice: 人格的な神の聖霊
  alternative: 一般的な神的影響力または聖なる性向
  rationale: 使徒言行録でこの定冠詞付き表現は通常、人格的に働く聖霊を指す。日本語の標準的表記「聖霊」は、原文にない説明を加えずにその文脈を反映する。
- issue: 割礼を用いた契約的比喩
  choice: 心と耳が「割礼を受けていない」という比喩を保持
  alternative: 「心を閉ざし、耳を貸さない」などの解釈的表現
  rationale: この叱責はイスラエルの聖書に見られる契約的・預言者的言葉を意図的に響かせているため、一般的な心理描写に置き換えない。
- issue: 先祖を表す男性形
  choice: 父祖
  alternative: 先祖
  rationale: πατέρες の「父たち」という形を反映しつつ、ここでイスラエルの以前の世代を指す意味が自然に伝わる表現とした。脚注で直訳を明示した。
translation_notes:
  register: 強い預言者的叱責の調子を保ちつつ、過度に古風な「うなじのこわい」などは避けた。「者たちよ」によって直接呼びかけの厳粛さを示し、全体は明快な現代標準日本語とした。
