  - severity: low
    issue: 「父祖」が明快な現代標準日本語としてやや専門的
    rationale: 意味は通るが、本文では「先祖」がより自然である。πατέρες の男性形および直訳は、英語監査記録と同様に脚注で示せる。
  revised_text: 「かたくなで、心も耳も割礼を受けていない者たちよ。あなたがたはいつも聖霊に逆らっている。あなたがたの先祖[a]と同じように、あなたがたもそうしている。」
  revised_footnotes:
