- from: 「首をこわばらせ、心にも耳にも割礼を受けていない者たちよ。あなたがたはいつも聖霊に逆らっている。あなたがたの父祖[a]と同じように、あなたがたもそうしている。」
  to: 「かたくなで、心も耳も割礼を受けていない者たちよ。あなたがたはいつも聖霊に逆らっている。あなたがたの先祖[a]と同じように、あなたがたもそうしている。」
  rationale: 冒頭を「かたくなで」に改め、Σκληροτράχηλοι が表す強い預言者的非難を、身体的な動作描写に曖昧化せず明快な現代日本語で表した。「心も耳も割礼を受けていない」は契約的比喩を保持する。「先祖」は本文の自然さを優先し、原語の「父たち」は脚注で明示した。
