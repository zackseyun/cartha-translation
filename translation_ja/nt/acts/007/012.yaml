  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: ja
  text: しかし、ヤコブはエジプトに穀物[a]があると聞き、私たちの父祖を初めてそこへ遣わしました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「食糧」。ギリシア語の「シティア」は、より広く食糧や備蓄を指すこともありますが、この文脈では穀物を指す可能性が高いでしょう。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 聞き
  rationale: アオリスト分詞の時間的な働きを、主動詞に先立つ出来事として自然な日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 物語の流れにおける緩やかな転換と、直前の飢饉との対照を示す。強すぎる逆接にはならない文脈で用いた。
- source_word: ὄντα σιτία εἰς Αἴγυπτον
  choice: エジプトに穀物があると
  rationale: ἀκούωに続く対格＋分詞の間接話法を、自然な日本語の引用内容として表した。εἰς Αἴγυπτονはこの文脈では所在地を表すものとして訳した。
- source_word: σιτία
  choice: 穀物
  rationale: 語は広く食糧や備蓄を指し得るが、ヨセフ物語の飢饉と買い出しの文脈では「穀物」が最も具体的で自然である。広い意味は脚注に残した。
- source_word: ἐξαπέστειλεν
  choice: そこへ遣わしました
  rationale: 旅に送り出す意味を「遣わしました」で表し、目的地は日本語で自然になるよう「そこへ」で明示した。
- source_word: τοὺς πατέρας ἡμῶν
  choice: 私たちの父祖
  rationale: イスラエルの歴史を自らの民の物語として語る男性の先祖への呼称を保持した。「先祖」よりも原文の父系的・家族的な表現に近い。
- source_word: πρῶτον
  choice: 初めて
  rationale: 後に続く二度目の訪問に対する最初の派遣であることを、簡潔で自然な日本語で示した。
theological_decisions:
- issue: τοὺς πατέρας ἡμῶν の訳し方
  choice: 私たちの父祖
  alternative: 私たちの先祖／族長たち
  rationale: ここでは一般的な祖先全体ではなく、ヤコブの息子たちという男性の先人を指すため、原文の男性・家族的表現を保った。「族長たち」は説明的すぎるため避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書の歴史叙述にふさわしい落ち着いた文体とした。「父祖」「遣わしました」によって原文の家族的表現と派遣のニュアンスを保った。
