id: ACT.7.55
reference: Acts 7:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: ja
  text: しかし、聖霊に満たされていたステファノは、天をじっと見つめ[a]、神の栄光と神の右に立っておられるイエスとを見た[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天を一心に見上げ」。
    reason: lexical_alternative
  - marker: b
    text: 「神の右」は、最高の栄誉と権威の座を表す聖書的な言い回し。
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων δὲ
  choice: しかし、…満たされていたステファノは
  rationale: δέが直前の群衆との対照を示すため「しかし」とした。ὑπάρχωνは継続中の状態を表す分詞なので「満たされていた」とし、日本語で主語を明確にするため文脈上のステファノを補った。
- source_word: πλήρης πνεύματος ἁγίου
  choice: 聖霊に満たされていた
  rationale: 「聖霊で満ちていた」も可能だが、現代日本語として自然で、ルカ文書に見られる神の霊に満たされた状態を明確に伝える表現を採った。
- source_word: ἀτενίσας εἰς τὸν οὐρανόν
  choice: 天をじっと見つめ
  rationale: ἀτενίζωの集中的に目を向ける意味を「じっと見つめ」で表し、幻の文脈におけるοὐρανόςを「空」ではなく「天」とした。
- source_word: εἶδεν δόξαν θεοῦ
  choice: 神の栄光…を見た
  rationale: 主要動詞εἶδενを平明な「見た」とし、δόξαν θεοῦは語順と意味を素直に保って「神の栄光」とした。
- source_word: Ἰησοῦν ἑστῶτα
  choice: 立っておられるイエス
  rationale: ἑστῶταが示す立った姿勢を保持した。イエスへの自然な敬意を表す現代標準日本語として「おられる」を用いたが、姿勢以上の解釈は加えていない。
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: 神の右に
  rationale: ἐκ δεξιῶνはここでは位置を表す定型表現であり、字義的な「右から」ではなく「右に」とした。「右の手」とせず、神の右側という位置的比喩を自然に表した。
theological_decisions:
- issue: πνεύματος ἁγίουが指すもの
  choice: 聖霊
  alternative: 聖なる霊
  rationale: ルカ文書の用法と直近の文脈では、単なる聖なる性質や心的状態ではなく神の霊を指す。「聖霊」は日本語聖書で確立した明瞭な呼称であり、本文以上の教派的説明を加えない。
- issue: 神の右に立つイエスの描写
  choice: 神の右に立っておられるイエス
  alternative: 神の右から立っているイエス
  rationale: 神とイエスの区別、およびイエスが立っているという本文の描写をそのまま保持した。ἐκ δεξιῶνの慣用的な位置表現は「神の右に」と訳し、栄誉と権威の含意は脚注で説明した。
- issue: ἑστῶταの姿勢が持つ意味
  choice: 立っておられる
  alternative: 立ち上がっておられる
  rationale: 本文は立っている状態を述べるが、いつ、なぜ立ったかは明示しない。「立ち上がった」として歓迎、証言、裁きなど特定の神学的解釈を読み込むことを避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語文の流れを保ちつつ、分詞を日本語の連用表現に整えた。「ステファノ」は原文で省略された主語を直前の文脈から明示したもの。脚注記号は該当表現の直後に配置した。
