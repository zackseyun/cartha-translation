id: ACT.7.6
reference: Acts 7:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: ja
  text: しかし、神はこう語られました。「彼の子孫は異国の地で寄留者となり[a]、人々はその子孫を奴隷にして、四百年の間、虐待する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「子孫」は集合的な意味で単数形が用いられ、これを受ける代名詞も単数形になっている。意味としては、「彼の子孫たちは異国の地で寄留者となり、人々は彼らを奴隷にして虐待する」とも表せる。
    reason: 集合的単数の名詞と、それに一致する単数代名詞というギリシア語の文法的関係を正確に示すため。
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεός
  choice: しかし、神はこう語られました
  rationale: δέを穏やかな展開・対照を示す「しかし」とし、οὕτωςも「こう」と明示した。神の発言には自然で格調のある敬語を用いた。
- source_word: τὸ σπέρμα αὐτοῦ
  choice: 彼の子孫
  rationale: σπέρμαはここではアブラハムから出る後代を集合的に指す。「種」という直訳を避け、現代日本語で意味が明瞭な「子孫」とした。
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: 異国の地で寄留者となり
  rationale: πάροικοςの、自己の故郷ではない場所に住む者という意味を「寄留者」で表し、ἀλλοτρίαが示す自分たちのものではない土地を簡潔に「異国の地」とした。
- source_word: δουλώσουσιν αὐτό
  choice: 人々はその子孫を奴隷にして
  rationale: δουλόωの強制的な隷属化を「奴隷にする」と明示した。主語はギリシア語と同じく特定せず「人々」とし、集合単数の目的語は「その子孫」と反復して不自然な物扱いを避けた。
- source_word: κακώσουσιν
  choice: 虐待する
  rationale: 害を加え、ひどく扱う意味を、明瞭で現代的な「虐待する」で表した。
- source_word: ἔτη τετρακόσια
  choice: 四百年の間
  rationale: 期間を示す対格を自然な日本語で表した。
theological_decisions:
- issue: アブラハムの「子孫」を表す集合単数
  choice: 本文では「子孫」を用い、目的語でも「その子孫」として集合的指示を保った
  alternative: 「子孫たち」「彼ら」と複数化する、または「種」「それ」と逐語的に訳す
  rationale: ギリシア語のσπέρμαとαὐτόは単数形だが集合的に子孫全体を指す。日本語では「子孫」自体が単複を限定しないため、原文の集合性を保ちつつ、不自然な「それ」や物を指すような表現を避けられる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「寄留者」により聖書本文としての格調とπάροικοςの居住者としての意味を保った。神の発話導入には「語られました」を用いた。脚注記号[a]は本文中に配置済み。
