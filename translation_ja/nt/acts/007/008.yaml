id: ACT.7.8
reference: Acts 7:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: ja
  text: そして神は彼に、割礼の契約を与えられた。こうしてアブラハムはイサクをもうけ、八日目に彼に割礼を施した。イサクはヤコブをもうけ、ヤコブは十二人の族長をもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: 割礼の契約
  rationale: διαθήκηを聖書史上の文脈に即して「契約」とし、属格περιτομῆςは契約を特徴づけるものとして簡潔に「割礼の契約」と訳した。
- source_word: οὕτως
  choice: こうして
  rationale: 契約の授与と、その後のイサク誕生・割礼を結ぶ結果的・叙述的な働きを、自然な現代日本語で表した。
- source_word: ἐγέννησεν
  choice: もうけた
  rationale: 男性を主語とする系譜上の生殖・父系関係を、古風な「生んだ」「生ませた」を避けつつ自然に表現した。後続の省略節にも補って訳した。
- source_word: περιέτεμεν
  choice: 割礼を施した
  rationale: 日本語の聖書・宗教文脈で明瞭かつ品位のある標準的表現を採用した。
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: 八日目に
  rationale: 時間を示す与格句を自然に訳し、原文に明示されない「誕生後」は補わなかった。
- source_word: πατριάρχας
  choice: 族長
  rationale: イスラエル十二部族の祖となる人物を指す聖書史上の定着した日本語であり、「家長」より文脈に適する。
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: イサク／ヤコブ
  rationale: 日本語聖書で広く定着した固有名表記に従った。
theological_decisions:
- issue: アブラハム契約への言及の特定性
  choice: 「割礼の契約」
  alternative: 「割礼による一つの契約」／「割礼をしるしとする契約」
  rationale: 創世記17章の特定の契約を指す文脈を保ちつつ、「しるし」という説明を本文へ加えず、属格の簡潔さを維持した。
- issue: γεννάωの系譜的表現
  choice: 各節で「もうけた」を補う
  alternative: 「生んだ」／「父となった」／後半を名詞句のままにする
  rationale: 男性系譜の意味を自然な現代日本語で示し、ギリシア語で省略されている動詞を日本語の明瞭さのため補った。
- issue: 神を主語とする敬語
  choice: 「与えられた」
  alternative: 「与えた」
  rationale: 日本語の聖書文体として自然な尊敬表現を用いたが、内容上の情報は追加していない。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、説教調や過度な古語を避けた。「そして」の反復は冒頭だけに抑え、系譜部分は短い並列文として原文の進行を保った。代名詞の曖昧さを避けるため、οὕτως以後の主語「アブラハム」を文脈から明示した。
