source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: ja
  text: その後、彼はカルデア人の地を出て、ハランに住みました。そして、そこから、父が死んだ後[b]、神[a]は彼を、あなたがたが今住んでいるこの地へ移されたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼を移した」。ギリシア語では主語が明記されていないが、文脈上は神を指す。
    reason: lexical_alternative
  - marker: b
    text: ステファノは、この移住が父の死後に起こったと述べている。関連する年代については創世記11章32節、12章4節を参照。
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 物語の次の出来事を導く時間的・叙述的な接続を、現代日本語で自然に示す。
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: カルデア人の地を出て
  rationale: アオリスト分詞が主動詞に先行する出来事を表すことを保ちつつ、「カルデア」へ縮約せず、γῆ Χαλδαίωνの表現を反映した。
- source_word: κατῴκησεν ἐν Χαρράν
  choice: ハランに住みました
  rationale: κατοικέωの定住・居住の意味を、古風にならない明瞭な敬体で表した。
- source_word: κἀκεῖθεν
  choice: そして……そこから
  rationale: καίとἐκεῖθενの両要素を反映し、前の居住地ハランからの移動であることを明確にした。
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: 父が死んだ後
  rationale: μετάを伴う冠詞付き不定詞が示す時間的順序を、そのまま自然な日本語の節で表した。
- source_word: μετῴκισεν αὐτὸν
  choice: 神は彼を……移された
  rationale: μετοικίζωの使役的な移住の意味を表した。ギリシア語では主語が明記されないが、直前の文脈上の行為者である神を本文に補い、その点を注で明示した。
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: あなたがたが今住んでいるこの地へ
  rationale: 移動の到達点を示すεἰςと、聞き手が現在居住する地を指す関係節を、重複を避けた自然な日本語で表した。
theological_decisions:
- issue: μετῴκισενの明示されていない主語
  choice: 文脈上の主語として「神は」を本文に補う
  alternative: 主語を補わず、「彼を移された」または「彼を移した」と訳す
  rationale: ギリシア語の動詞は三人称単数だが主語を明記していない。直前の文脈では神がアブラハムに命じて導く行為者であるため、明瞭さのため「神」を補った。ただし原文上の省略を脚注で保持した。
- issue: 創世記との年代上の緊張
  choice: 「父が死んだ後」という使徒言行録本文の順序を変更せず訳す
  alternative: 創世記11:32、12:4との調和を図るよう言い換える
  rationale: ステファノの発言に記された時間的順序をそのまま保ち、翻訳によって見かけ上の緊張を解消しない。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた敬体。地名・民族名は一般的な聖書表記を用い、古風な「住まった」「移し置いた」などは避けた。原文の叙述順序と、主語省略および年代に関する緊張は脚注を添えて保持した。
