  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: ja
  text: 人々がステファノに石を投げつけている間、ステファノは呼びかけて言った[a]。「主イエスよ、私の霊をお受けください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「（主を）呼び求めて言った」。ギリシア語の分詞は、祈願として呼びかける、または呼び求めることを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: 石を投げつけている
  rationale: 未完了時制が表す進行中の行為を、自然な現代日本語で示す。「石打ちにしていた」よりも、その場で石を投げ続ける動作が明瞭である。
- source_word: ἐπικαλούμενον
  choice: 主に呼びかけて
  rationale: この分詞はステファノがイエスに直接訴え、祈り求めていることを表す。「呼びかける」は現代日本語として自然であり、目的語「主に」を補うことで、その祈願の向かう相手を文脈どおり明確にする。語の持つ「祈り求める／御名を呼ぶ」という含みは脚注に残す。
- source_word: λέγοντα
  choice: 言った
  rationale: ἐπικαλούμενονと並ぶ分詞を、日本語の自然な叙述として「呼びかけて言った」とした。
- source_word: Κύριε Ἰησοῦ
  choice: 主イエスよ
  rationale: κύριοςの敬意とキリスト論的重みを保ちつつ、呼格を「よ」で自然に示す。
- source_word: δέξαι
  choice: お受けください
  rationale: 祈願におけるアオリスト命令形を、荘重かつ自然な敬語表現で訳す。
- source_word: τὸ πνεῦμά μου
  choice: 私の霊
  rationale: 死に際して委ねられるステファノ自身の霊を指す。意味を狭める「命」ではなく、原語に対応する標準的な表現を用いる。
theological_decisions:
- issue: ステファノの言葉が復活したイエスへの祈り・呼び求めであることをどう表すか
  choice: 「主に呼びかけて言った」とし、直接の呼びかけ「主イエスよ」を保持する
  alternative: 「呼び声を上げて言った」または「呼び求めて言った」
  rationale: 本文はステファノがイエスに直接「私の霊をお受けください」と願う姿を示す。「呼び声を上げて」だけでは祈願の対象が曖昧になりうる一方、「祈って」と断定すると語義を一段具体化するため、本文では「主に呼びかけて」とし、より明示的な語義を脚注で示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「石を投げつけている間」で進行中の場面を示し、祈願は「お受けください」として自然な敬意を保った。
