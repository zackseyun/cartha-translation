source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ja
  text: アロンにこう言いました。「私たちに先立って進む神々を、私たちのために造ってください。というのも、私たちをエジプトの地から導き出したこのモーセが、どうなったのか分からないのですから。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: そしてアロンにこう言いました
  rationale: 分詞で前節の動作に続く発言を導入しているため、文脈との連続を「そして」で示し、「こう言いました」で引用を自然に導入した。
- source_word: Ποίησον ἡμῖν
  choice: 私たちのために造ってください
  rationale: 命令形を、アロンへの要求として自然な丁寧命令で表した。「造る」は、像を作る文脈にも適する。
- source_word: θεοὺς
  choice: 神々
  rationale: 原語は「偶像」ではなく θεός の複数形であり、出エジプト記の表現と民の主張を保つため、解釈語に置き換えなかった。
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: 私たちに先立って進む
  rationale: 「導く」と解釈的に言い換えず、前方を進むという προπορεύομαι の空間的意味を明示した。
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: このモーセという男は……が
  rationale: οὗτος の距離を置いた、やや軽んじる響きを「という男」で自然に示し、γάρ の理由説明は日本語の文脈に合わせて逆接的な節のつながりに組み込んだ。
- source_word: ἐξήγαγεν ἡμᾶς
  choice: 私たちを……導き出しました
  rationale: ἐξάγω の移動と先導の意味をともに保つ自然な表現とした。
- source_word: ἐκ γῆς Αἰγύπτου
  choice: エジプトの地から
  rationale: γῆς を省かず、原文の明示的な表現を保った。
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: どうなったのか分かりません
  rationale: 「彼に何が起きたか」の意を、現代日本語で自然かつ簡潔に表した。
theological_decisions:
- issue: 偶像礼拝の文脈における θεοὺς の訳
  choice: 神々
  alternative: 偶像
  rationale: 語り手による評価語へ置き換えず、民自身の要求と出エジプト記への語句上の連関を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、引用内は民がアロンに語る場面に合う丁寧な要求形とした。「このモーセという男」で原文の距離的・軽蔑的になり得る語感を示しつつ、過度に俗悪な表現は避けた。
