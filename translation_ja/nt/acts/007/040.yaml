  to: アロンにこう言いました。「私たちに先立って進む神々を、私たちのために造ってください。というのも、私たちをエジプトの地から導き出したこのモーセが、どうなったのか分からないのですから。」
  rationale: 分詞εἰπόντεςは「アロンにこう言いました」として自然に引用を導入した。θεοὺςは「神々」、οἳ προπορεύσονται ἡμῶνは「私たちに先立って進む」として語義を維持した。γάρを「というのも／のですから」で理由として明示し、οὗτοςは「このモーセ」として距離を置く語感を保った。
