  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: ja
  text: そして彼は言った。「見てください。天が開かれていて[a]、人の子[b]が神の右に立っているのが見えます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「すでに開かれた状態で」。ギリシア語の完了受動分詞は、天がすでに開かれ、その状態がステファノの幻の中で続いていることを示す。
    reason: lexical_alternative
  - marker: b
    text: 「人の子」はメシア的な称号として知られ、ダニエル書7章13節を踏まえた表現である。
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見てください
  rationale: 注意を促す感動詞として、ステファノの切迫した呼びかけを現代日本語で自然に表した。「見よ」より平明でありながら、発言の強さを保つ。
- source_word: θεωρῶ
  choice: 見えます
  rationale: 現在形が示す継続中の知覚を自然な日本語で表す。目的内容を「〜のが見えます」とまとめ、幻の描写であることを過度に解釈せず示した。
- source_word: τοὺς οὐρανοὺς
  choice: 天
  rationale: ギリシア語は複数形だが、日本語では神的領域を指す聖書的かつ自然な表現として「天」が適切である。「空」では神学的な響きが弱まる。
- source_word: διηνοιγμένους
  choice: 開かれていて
  rationale: 完了受動分詞が示す、開かれた結果としてその状態が続いていることを、自然な継続表現で示した。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: ダニエル書とのつながりとメシア的称号としての意味を保つ、定着した直訳を採用した。
- source_word: ἐκ δεξιῶν
  choice: 神の右に
  rationale: 名誉と権威の位置を表す聖書的表現を簡潔に保持した。「右側に」として空間的意味だけに狭めることを避けた。
- source_word: ἑστῶτα
  choice: 立っている
  rationale: 本文が明示する姿勢をそのまま訳し、キリストが座しているとする他の箇所に合わせて変更しなかった。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格を日本語の自然な連体修飾として直接訳した。
theological_decisions:
- issue: キリスト論的称号 υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  alternative: 人間のような者
  rationale: 伝統的かつ原語に近い称号を保持し、ダニエル7章とのメシア的な連関を明確に残した。解釈的な言い換えで称号性を弱めなかった。
- issue: 高く上げられたイエスの姿勢
  choice: 神の右に立っている
  alternative: 神の右に座っている
  rationale: 本文の「立っている」をそのまま保持し、より一般的な「座っている」という表現に調和させず、この節固有の神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、幻の荘厳さとステファノの切迫した口調を保った。「天」「人の子」「神の右」は聖書的な語感を維持し、「立っている」という本文特有の表現を調和化せず残した。
