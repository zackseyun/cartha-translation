  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: ja
  text: エジプト全土とカナンは、飢饉と大きな苦難に見舞われ、私たちの父祖[a]は食べ物を得ることができませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私たちの先祖」。ギリシア語は「私たちの父たち」といい、イスラエルの父祖を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: すると、…起こり
  rationale: ἦλθενは飢饉の発生を表す慣用的な用法として「起こり」とし、δέは物語の展開を自然に示す「すると」で表した。強い対比は持ち込まない。
- source_word: λιμὸς
  choice: 飢饉
  rationale: 広域に及ぶ深刻な食糧不足を指すため、現代日本語で明確な「飢饉」とした。
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: エジプト全土とカナンに
  rationale: ἐπί＋対格が示す地域的な広がりを「全土」と「に」で自然に表した。ὅληνは文法上エジプトを直接修飾するため、「全土」はエジプトに付した。
- source_word: θλῖψις μεγάλη
  choice: 大きな苦難
  rationale: 飢饉に伴う深刻な窮迫を広く表し、終末論的な専門語に限定しない訳とした。
- source_word: οὐχ ηὕρισκον
  choice: 見つけることができませんでした
  rationale: 未完了過去が示す継続的・反復的な入手不能の実際的な意味を自然な日本語で表した。
- source_word: χορτάσματα
  choice: 食べ物
  rationale: 食糧や糧を広く指す語であり、「穀物」や「飼料」に狭めず、一般読者に明瞭な表現とした。
- source_word: οἱ πατέρες ἡμῶν
  choice: 私たちの父祖
  rationale: イスラエルの男性の先祖たちを指すπατέρεςの性別を保ちつつ、日本語で歴史的祖先を自然かつ厳かに示す「父祖」とした。
theological_decisions:
- issue: 祖先を表す男性形の保持
  choice: 私たちの父祖
  alternative: 私たちの先祖
  rationale: ギリシア語は明示的に男性複数形πατέρεςを用い、イスラエルの父祖を指す。「父祖」はその男性的・救済史的な指示を保ちながら、現代日本語でも理解できる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒言行録の歴史叙述にふさわしい落ち着いた文体とした。「襲いました」は飢饉に伴う苦難の到来を自然に表すが、原文の並列関係を損なわないよう独立した出来事として訳した。
