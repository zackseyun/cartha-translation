  rationale: 原文の飢饉と苦難の並列関係を保つため、両地域が「飢饉と大きな苦難に見舞われ」たとした。χορτάσματαを得られないという継続的な窮乏は、自然な日本語で「食べ物を得ることができませんでした」と表した。父祖の語彙注を該当語の直後に移してアンカーを整えた。
