    rationale: 語彙代替を示す注は、地名ではなく「父祖」に直接アンカーを置く必要がある。
  revised_text: エジプト全土とカナンは、飢饉と大きな苦難に見舞われ、私たちの父祖[a]は食べ物を得ることができませんでした。
