  - severity: low
    issue: 「食べ物を見つける」が日本語ではやや不自然である
    rationale: οὐχ ηὕρισκον χορτάσματαは危機の中で食糧を確保・入手できなかったという意味であり、「食べ物を得ることができませんでした」が自然である。
  - severity: medium
