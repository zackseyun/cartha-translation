  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: ja
  text: この王は、私たちの民を巧みに欺き[a]、私たちの先祖を虐待して、彼らの乳飲み子を捨てさせ[b]、その乳飲み子が生かしておかれないようにしました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪賢く扱い」。ギリシア語は、策略や欺きを用いて相手を不当に扱うことを表します。
    reason: lexical_alternative
  - marker: b
    text: 乳飲み子を屋外などに置き去りにし、死ぬに任せることを指します。
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: この王
  rationale: 直前に言及された別の王を指す指示代名詞。日本語では文脈上の人物を明確にするため「この王」とした。
- source_word: κατασοφισάμενος
  choice: 巧みに欺き
  rationale: 相手に対して悪意ある知恵や策略を用いる意味を、自然な現代日本語で表した。「巧みに扱い」では否定的含意が弱いため、欺瞞性を示した。
- source_word: τὸ γένος ἡμῶν
  choice: 私たちの民
  rationale: ここではイスラエル民族共同体を指す。「民族」より語りの流れに自然で、「人種」という現代的含意も避けられる。
- source_word: ἐκάκωσεν
  choice: 虐待して
  rationale: 害を加え、ひどく扱うことを表す。後続する乳児遺棄の文脈に即して、強い加害性を保った。
- source_word: τοὺς πατέρας
  choice: 私たちの先祖たち
  rationale: 直訳的な「父たち」より、イスラエルの前世代を指す意味が現代日本語で明確になる。ギリシア語の複数形も反映した。
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: その乳飲み子を捨てさせ
  rationale: 直訳は「彼らの乳児を捨てられた状態にすること」。τοῦ ποιεῖν が手段または結果を表す曖昧さを保ちつつ、王の政策が先祖たちに乳児を遺棄させたという自然な日本語にした。ἔκθετα の歴史的意味は注で補う。
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: 生かしておかれないように
  rationale: 目的または結果を表し得る構文と受動態を保持し、乳児が生存できないことを意図した行為であると伝える。
theological_decisions:
- issue: 乳児遺棄における行為主体と強制性
  choice: 「捨てさせ」
  alternative: 「捨てるように仕向け」／「捨てさせることで」
  rationale: ギリシア語の ποιεῖν は使役的に理解できるが、明示的な「強制する」という動詞はない。そのため、王の責任を示しつつ、原文以上に強制の様態を限定しない表現とした。
- issue: εἰς τό 構文の目的・結果
  choice: 「生かしておかれないように」
  alternative: 「そのため生き延びられなくなりました」
  rationale: 目的と結果の双方の含みを残せる「ように」を採用し、王の殺害意図を否定も過度に断定もしない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、ステファノの演説にふさわしい端正さを保った。「乳飲み子」はβρέφηの幼さを示しつつ、聖書本文として自然な語調を保つ。
