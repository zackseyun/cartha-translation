    rationale: 「生かしておかれないようにしました」だけでは、誰が生かしておかれないのかが日本語として明示されません。原文では乳飲み子（τὰ βρέφη）がζῳογονεῖσθαιの対象なので、「その乳飲み子が」を補って指示対象を明確にします。
  - severity: low
    issue: 「先祖たち」の重複的な複数標示
    rationale: ギリシア語は複数形ですが、日本語の「先祖」は通常集合名詞として自然に用いられます。「私たちの先祖」としても意味の範囲は保たれ、より平明です。
