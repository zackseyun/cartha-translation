source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: ja
  text: この人が彼らを導き出し、エジプトの地と紅海[a]と荒野で、四十年にわたって不思議としるしを行いました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「葦の海」と訳すこともあります。ギリシア語本文は「紅海」（Ἐρυθρὰ Θάλασσα）で、新約聖書と七十人訳がイスラエルの渡った海を指す際に用いる標準的な呼称です。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: この人が
  rationale: 直前まで語られているモーセを指す指示代名詞の強調を保ちつつ、現代日本語として自然にした。「彼は」ではステファノの修辞的な指示性が弱くなる。
- source_word: ἐξήγαγεν αὐτούς
  choice: 彼らを導き出し
  rationale: ἐξάγωの「外へ導く」という意味と、出エジプトにおけるモーセの働きを簡潔に表す。
- source_word: ποιήσας
  choice: 行いました
  rationale: 主動詞と同じ主体であるモーセが不思議としるしを行ったことを示す。日本語では分詞構文を独立した述語として表し、文全体を自然にした。
- source_word: τέρατα καὶ σημεῖα
  choice: 不思議としるし
  rationale: 驚嘆を引き起こす業と、それが指し示す意味という語の区別を保ち、ルカ文書での定型的な組み合わせにも合わせた。
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: エジプトの地で
  rationale: γῇを反映し、紅海、荒野へと続く三つの地理的表現を保つ。本文では並列を自然にするため「エジプトの地と紅海と荒野で」とまとめた。
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: 紅海で
  rationale: ギリシア語の通常の意味と新約聖書・七十人訳で定着した呼称をそのまま訳した。日本語本文では「紅海」とし、ヘブライ語背景に基づく別称は脚注に示した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: イスラエルの放浪の場を表す聖書的な用語として自然であり、砂地だけを連想させる「砂漠」より範囲が適切である。
- source_word: ἔτη τεσσεράκοντα
  choice: 四十年にわたって
  rationale: 期間を表す対格を自然な日本語で明示し、不思議としるしが荒野の期間にも及んだという文の流れを保つ。
theological_decisions:
- issue: 出エジプトにおけるモーセの主体性と神の働きの関係
  choice: モーセを指す「この人」を文の主体として保ち、「導き出し」「行いました」と訳す。
  alternative: 「彼は」として指示の強調を弱める、または神だけを明示的な行為主体として補う。
  rationale: 本文はモーセを人間の行為主体として述べるが、神から独立した力を主張してはいない。原文の表現を保ち、神学的説明を本文へ補わない。
- issue: 「紅海」と「葦の海」の関係
  choice: ギリシア語本文に従って「紅海」を本文に置く。
  alternative: ヘブライ語の伝統的表現を踏まえて「葦の海」を本文に置く。
  rationale: Ἐρυθρὰ Θάλασσαの直接的かつ定着した訳は「紅海」である。一方、「葦の海」は背景理解に有用なため脚注で示し、両者を無理に同一化または対立させない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ステファノの演説にふさわしい端正さを保った。「この人が」で指示の力を残し、「不思議としるし」はルカ文書の語彙を一貫して訳せる表現とした。
