  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: ja
  text: そして、ある人が不当な扱いを受けているのを見て、その人をかばい、エジプト人を打つことによって、虐げられているその人のために報復しました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「虐げられているその人のために正義を行いました」。ギリシア語の表現は、報復すること、または被害者の権利を回復することを意味し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: 見て
  rationale: アオリスト分詞を、後続する行動のきっかけを示す自然な日本語の連用形で表した。
- source_word: τινα ἀδικούμενον
  choice: 虐げられている人
  rationale: 不定代名詞の不特定性を「人」で保ち、受けている不正な扱いを文脈に即して「虐げられている」と表した。
- source_word: ἠμύνατο
  choice: その人を助け
  rationale: 攻撃を受けている者を守り、加勢するという中動態動詞の意味を、平明な現代日本語で示した。
- source_word: ἐποίησεν ἐκδίκησιν
  choice: その人のために報復しました
  rationale: この慣用表現が持つ報復・雪辱・正義の執行という幅を踏まえ、行為の対象ではなく被害者のための行動であることを明示した。別訳は脚注に示した。
- source_word: τῷ καταπονουμένῳ
  choice: 虐げられていた人のために
  rationale: 与格の受益的な関係と、過酷な扱いを受けている者という意味を保った。日本語では同一人物を指すことが分かるように表現した。
- source_word: πατάξας τὸν Αἰγύπτιον
  choice: エジプト人を打って
  rationale: πατάσσω自体は「打つ」を意味するため、文脈上の致死的結果を本文に過剰に織り込まず、原語の表現を保った。
theological_decisions:
- issue: モーセの行為におけるἐκδίκησιςの意味合い
  choice: 「報復しました」とし、被害者のための行為であることを明示する
  alternative: 「正義を行いました」「雪辱を果たしました」
  rationale: 語には報復と権利回復・正義の執行の両面がある。「報復」は原語の強さを保つ一方、「その人のために」によって私怨とは限定せず、別訳で司法的・擁護的な含意も保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての簡潔さと聖書本文にふさわしい品位を保った。「打って」は原語に忠実であり、出エジプト記2章が示す死の結果を本文で明示的に補わない。
