id: ACT.7.10
reference: Acts 7:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: ja
  text: そして、彼をあらゆる苦難から救い出し[a]、エジプト王ファラオの前で彼に好意[b]と知恵を与え、彼をエジプトと王の全家を治める者[c]に任命しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼をあらゆる悩みから解放し」。
    reason: lexical_alternative
  - marker: b
    text: ここでの「好意」は、ファラオから好意的に見られることを意味する。別訳「恵み」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「彼をエジプトと王の全家をつかさどる者に任命しました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: 救い出し
  rationale: 危険や苦境からの積極的な救出を表す中動態の意味を、自然で明瞭な現代日本語で示す。
- source_word: θλίψεων
  choice: 苦難
  rationale: ヨセフが経験した圧迫、困難、苦しみを広く指し、文脈にない終末論的含意を持ち込まない。
- source_word: χάριν
  choice: 好意
  rationale: ここでは神学用語としての「恵み」よりも、ファラオの前でヨセフが受ける好意的な評価・取り扱いを指す。
- source_word: σοφίαν
  choice: 知恵
  rationale: ファラオに認められた実際的な識別力を含む語として、直接的で自然である。
- source_word: ἐναντίον Φαραὼ βασιλέως Αἰγύπτου
  choice: エジプト王ファラオの前で
  rationale: 人物の面前・目の前という関係を簡潔に保ちつつ、原文の称号の語順を自然な日本語にする。
- source_word: κατέστησεν
  choice: 任命しました
  rationale: 権威ある職務・地位に就けたことを明確に表す。
- source_word: ἡγούμενον
  choice: 治める者
  rationale: 統治権を行使する者という広い意味を保ち、「総督」のような特定の官職名に狭めない。
- source_word: ἐπ’ Αἴγυπτον
  choice: エジプトを治める
  rationale: ἐπί＋対格が示す支配領域を、日本語では動詞との自然な結び付きによって表す。
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: 王の全家
  rationale: οἶκοςは建物だけでなく王の家・家政組織全体を指す。「彼の」ではヨセフを指すと誤解されやすいため、文脈上の指示対象を「王」と明示する。
theological_decisions:
- issue: 節全体の省略された主語
  choice: 神を明示せず、日本語でも前節から続く省略主語として保つ
  alternative: 「神は」を補う
  rationale: 単数動詞の主語は前節の神であることが自然だが、この節自体には θεός がなく、明示を避けることで原文の談話構造を保つ。
- issue: αὐτοῦ（「その全家」）の指示対象
  choice: ファラオを指すものとして「王の全家」とする
  alternative: 代名詞のまま「彼の全家」とする
  rationale: 創世記41:40以下の背景と直前のファラオへの言及から、ファラオの家を指すのが自然である。日本語の「彼」では直近の目的語ヨセフと誤読されやすいため、指示対象を明らかにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い並列構文は原文の三つの動作を維持しつつ、「治める者」で日本語として自然に統合した。「ファラオ」は一般読者にも通じる慣用表記を採用した。
