  text: Did not my hand make all these things?[a][b]
translation:
  language: ja
  text: 「これらすべてを造ったのは、わたしの手ではないか。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらすべてを造ったのは、わたしではないか。」
    reason: lexical_alternative
  - marker: b
    text: この言葉はイザヤ書66章2節を踏まえている。
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: ではないか
  rationale: 肯定の答えを期待する修辞疑問であるため、現代日本語でその力を自然に保つ「ではないか」とした。
- source_word: ἡ χείρ μου
  choice: わたしの手
  rationale: 神の働きを表す比喩だが、イザヤ書66章2節の具体的な擬人的表現と引用の響きを保つため、字義どおりに訳した。
- source_word: ἐποίησεν
  choice: 造った
  rationale: 文脈は神による創造を指すため、「作った」よりも創造の含意が明確で、なお自然な「造った」とした。
- source_word: ταῦτα πάντα
  choice: これらすべて
  rationale: 指示語と包括性の両方を簡潔で自然な日本語に反映した。
theological_decisions:
- issue: 神についての擬人的表現
  choice: 神の創造の働きを指す「わたしの手」を本文に残す
  alternative: 「これらすべてを造ったのは、わたしではないか」と動的に訳す
  rationale: イザヤ書66章2節を受けた聖書的イメージと修辞的な力を保ち、抽象的な解釈を本文へ持ち込まないため。
translation_notes:
  register: 明瞭で格調のある現代標準語。「わたしの手」という原文の具体的表現を保ちつつ、日本語として自然な焦点構文の修辞疑問に整えた。
