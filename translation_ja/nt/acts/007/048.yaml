  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: ja
  text: しかし、いと高き方は、人の手で造ったものの中には住まわれません[a]。預言者が言っているとおりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人の手で造られた神殿には」。ギリシア語はより広く「人の手で造ったものの中には」という意味ですが、直近の文脈では神殿が念頭にあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: ソロモンが神殿を建てたという直前の記述との強い対比を、自然な現代日本語で示す。
- source_word: ὁ ὕψιστος
  choice: いと高き方
  rationale: 神を指す称号としての働きを保ちつつ、原文に明記されていない「神」を補わない。
- source_word: ἐν χειροποιήτοις
  choice: 人の手で造ったものの中には
  rationale: 複数形の形容詞が名詞的に用いられた広い表現を保つ。文脈上は神殿が念頭にあるが、本文を「神殿」に限定しない。
- source_word: κατοικεῖ
  choice: 住まわれません
  rationale: 神の住まい・臨在をめぐる文脈に適した「住む」を用い、敬意を表す自然な主語敬語と否定形で訳す。
- source_word: καθὼς
  choice: 〜とおり
  rationale: 続く預言者の引用が直前の主張を裏づける対応関係を明確にする。
- source_word: ὁ προφήτης λέγει
  choice: 預言者がこう言っている
  rationale: 原文どおり預言者名を補わず、現在形の引用導入を自然な日本語で表す。「こう」により後続する引用を導く。
theological_decisions:
- issue: χειροποιήτοιςの指示対象を本文で「神殿」に限定するか
  choice: 「人の手で造ったもの」という広い表現を保つ
  alternative: 「人の手で造った神殿」または「人の手で造った聖所」
  rationale: 直近の文脈は神殿についてだが、ギリシア語自体はより広く、人間が造った宗教的構造物や物に対する批判的含意も保ちうるため。
- issue: ὁ ὕψιστοςに「神」を補うか
  choice: 称号のみの「いと高き方」とする
  alternative: 「いと高き神」
  rationale: 指示対象が神であることは明白だが、原文にθεόςはなく、称号の簡潔さを保存するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「住まわれません」は神を主語とする敬語として自然であり、過度に古風な文語は避けた。後続の引用を導くため、節末は「こう言っているとおりです」とした。
