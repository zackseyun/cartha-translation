  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: ja
  text: しかし、ソロモンが神のために家[a]を建てました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神殿」。ギリシア語は「家」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: ソロモン
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: δὲ
  choice: しかし
  rationale: 前後の論旨にある穏やかな対比を明示しつつ、説話の流れを保つ。
- source_word: οἰκοδόμησεν
  choice: 建てました
  rationale: 建物を実際に建造したことを表す語であり、現代日本語で自然かつ直接的である。
- source_word: αὐτῷ
  choice: 神のために
  rationale: 代名詞の指示対象である神を日本語では明示し、「その方のために」より自然にした。与格が示す、神のための建造という意味を保つ。
- source_word: οἶκον
  choice: 家
  rationale: 文脈上は神殿を指すが、原文の一般名詞を保ち、神の『家』と次節の主張との緊張を残す。
theological_decisions:
- issue: οἶκονを「家」とするか「神殿」とするか
  choice: 家
  alternative: 神殿
  rationale: 原文は神殿を指す専用語ではなく「家」を意味するοἶκοςを用いている。その語遣いを保つことで、人が神のために家を建てたという表現と、いと高き方は人の手で造ったものには住まないという続く主張との神学的緊張を維持する。
translation_notes:
  register: 明瞭な現代標準日本語。敬体で説教の語り口に合わせ、「神」を補って代名詞の指示を自然にした。原文の簡潔さと尊厳を保った。
