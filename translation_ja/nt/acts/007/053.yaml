translation:
  language: ja
  text: あなたがたは、御使いたちを通して律法を受けたのに[a]、それを守りませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御使いたちの取り決めに従って」または「御使いたちの指示に従って」。ギリシア語の句は解釈が難しいが、律法が御使いたちの関与を伴って授けられたことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: あなたがたは
  rationale: 直後の二人称複数の動詞と結びつき、ステファノが聞き手を直接、非難を込めて指していることを自然な日本語で表す。
- source_word: ἐλάβετε
  choice: 受けた
  rationale: 律法を授けられたことを表し、自発的に受け入れたという含みを不必要に加えない。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 文脈上モーセの律法を指すため、日本語の聖書用語として明瞭な「律法」とする。
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: 御使いたちの指示によって
  rationale: 難解な句の「指示・定め・配列」という幅を踏まえ、御使いたちが律法授与に関与したという中心的意味を示しつつ、仲介の仕組みを過度に限定しない。別訳を脚注に残す。
- source_word: ἀγγέλων
  choice: 御使いたち
  rationale: ここでは人間の使者ではなく、律法授与に関与する天的存在を指す。現代日本語の聖書文体として「御使い」を用いる。
- source_word: οὐκ ἐφυλάξατε
  choice: それを守りませんでした
  rationale: φυλάσσωは律法を目的語とするとき「守る、遵守する」の意味。「それを」を補って対象を明確にする。
theological_decisions:
- issue: εἰς διαταγὰς ἀγγέλωνにおける御使いの関与
  choice: 律法は御使いたちの指示に関わる仕方で受けられた
  alternative: 「御使いたちを通して定められた律法を」「御使いたちの取り計らいによって律法を」
  rationale: 原文は律法授与への御使いの関与を示すが、διαταγαίとεἰςの厳密な関係や仲介の様態は明確でない。そのため本文では自然な表現を選び、他の可能性を脚注で示して曖昧さを保持する。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、ステファノの直接的な非難の調子を保った。「のに」によって、律法を受けたことと守らなかったことの強い対照を自然に表現した。
