revisions:
- from: それを、私たちの先祖たちは受け継ぎ、ヨシュア[a]とともに携え入れました。それは、神が私たちの先祖の前から追い払われた諸民族の地を占領した時のことで、幕屋はダビデの時代までそこにありました。[b]
  to: 私たちの先祖は、それを受け継ぎ、ヨシュア[a]とともに、神が私たちの先祖の前から追い払われた諸民族を征服した際に携え入れました。これはダビデの時代まで続きました。
  rationale: 原文の歴史的指示対象と、διαδεξάμενοιの「受け継ぐ」という含意を保持した。「諸民族の地」という非明示の補足と、「そこに」という場所の補足を除いた。末尾の省略的な χρονικός表現は、日本語として必要な最小限の補いで「これは…まで続きました」とした。脚注bは、本文にあった不必要に具体的な補足を前提としているため削除した。
