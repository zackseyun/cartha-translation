id: ACT.7.45
reference: Acts 7:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: ja
  text: 私たちの先祖は、それを受け継ぎ、ヨシュア[a]とともに、神が私たちの先祖の前から追い払われた諸民族を征服した際に携え入れました。これはダビデの時代まで続きました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨシュア」に当たるギリシア語名は「イエス」と同じ形です。ここではヌンの子ヨシュアを指します。
    reason: 原語の名称上の曖昧さを示しつつ、文脈上の指示対象を明確にするため。
lexical_decisions:
- source_word: ἣν
  choice: それを
  rationale: 前節の「証しの幕屋」を受ける女性単数関係代名詞。日本語では文脈上の指示対象を「それ」で明示した。
- source_word: εἰσήγαγον
  choice: 携え入れました
  rationale: εἰσάγωの「中へ持ち込む」の意を、幕屋という目的語に自然な日本語で表した。
- source_word: διαδεξάμενοι
  choice: 受け継ぎ
  rationale: διαδέχομαιが示す先代からの継承を明示し、分詞の主動詞に先行する関係も保った。
- source_word: οἱ πατέρες ἡμῶν
  choice: 私たちの先祖たち
  rationale: ここでは実父ではなくイスラエルの先人を指すため、現代日本語で明瞭な「先祖」を用いた。本文では自然さのため「私たちの先祖たち」とした。
- source_word: μετὰ Ἰησοῦ
  choice: ヨシュアとともに
  rationale: Ἰησοῦςはイエスとヨシュアに共通するギリシア語名だが、モーセ後の土地取得という歴史的文脈ではヌンの子ヨシュアを指す。
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: 諸民族の地を占領した時
  rationale: κατάσχεσιςの取得・占有の意味を時間的状況として自然に訳した。属格τῶν ἐθνῶνは、追い払われた諸民族がいた土地の取得を指すと理解できるが、ギリシア語の圧縮を補う「地」は文脈上の補足である。
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: 神が…追い払われた
  rationale: ἐξωθέωの排除・駆逐の意味を「追い払う」で表した。神への敬語は日本語聖書文として自然な尊敬表現による。
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: 私たちの先祖の前から
  rationale: セム語的な「顔の前から」という表現を、意味を損なわない自然な日本語にした。
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: ダビデの時代まで
  rationale: 直訳的で明瞭な時間表現。何がそこまで存続したかはギリシア語で省略されているため、本文では文脈上「幕屋は…そこにありました」と補い、注記した。
theological_decisions:
- issue: Ἰησοῦの指示対象
  choice: ヌンの子ヨシュア
  alternative: イエス
  rationale: 綴りは同一だが、モーセに続く土地進入の場面なので歴史上のヨシュアが明白な指示対象である。脚注で原語上の同形性を示した。
- issue: διαδεξάμενοιの意味
  choice: 幕屋を先代から受け継いだ
  alternative: 順番に、または交代して携え入れた
  rationale: 語が持つ継承・受領の含意を本文に明示し、世代的連続性を保った。
- issue: ἕως τῶν ἡμερῶν Δαυίδの統語的補足
  choice: 幕屋がダビデの時代までそこにあったと補う
  alternative: 補足せず「ダビデの時代まで」とだけ続ける
  rationale: 原文は省略的で、幕屋の存続期間を指すと自然に理解される。日本語の独立した節として明瞭にするため補ったが、脚注で原文の省略を明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語一文を二文に分け、歴史的叙述を読みやすくした。「父祖」ではなく一般読者に自然な「先祖」を採用し、「幕屋」は前節からの指示対象として二文目で明示した。
