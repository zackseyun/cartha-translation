  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: ja
  text: 私たちの先祖は、彼に従おうとせず、かえって彼を退け[a]、心の中ではエジプトへと向きを変えました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼を押しのける」とも訳せる。ギリシア語の動詞には、モーセを脇へ押しやるという具体的な響きがある。
    reason: lexical_alternative
  - marker: b
    text: 彼らはまだ荒野にいながら、内心ではエジプトへ帰ることを望んだ、という意味。
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: 彼に
  rationale: 単数与格の関係代名詞で、直前のモーセを指す。日本語では「彼に従う」とすることで、与格の関係を自然に表した。
- source_word: οὐκ ἠθέλησαν
  choice: 従おうとせず
  rationale: 否定された θέλω は、単なる不履行ではなく意志的な拒否を表す。「従おうとしなかった」より文脈上簡潔で自然な「従おうとせず」とした。
- source_word: ὑπήκοοι γενέσθαι
  choice: 従おうと
  rationale: 直訳は「従順な者となること」だが、日本語で自然に意志的拒否を示すため「従おうと」とした。γενέσθαι の変化の含みは明示しないが、句全体の意味を保つ。
- source_word: οἱ πατέρες ἡμῶν
  choice: 私たちの先祖
  rationale: イスラエルの祖先を指す。現代日本語では「父祖」より明快で、「私たちの父たち」より自然な「先祖」を選んだ。
- source_word: ἀπώσαντο
  choice: 彼を退け
  rationale: 押しのけるという具体的含意を持ちながら、ここではモーセの権威と導きを拒絶する意味。「退ける」は身体的・関係的な両面を残す。
- source_word: ἐστράφησαν
  choice: 戻ってしまいました
  rationale: エジプトへの方向転換・逆戻りを表す。完了的な転回と否定的な文脈を自然に伝えるため「戻ってしまいました」とした。
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: 心の中では
  rationale: καρδία は願望や意志を含む内面を指す。「心の中」は聖書的比喩を保ち、「では」により実際の所在地との対照を自然に示す。
- source_word: εἰς Αἴγυπτον
  choice: エジプトへ
  rationale: εἰς の方向性を「へ」で表した。「戻る」が帰還の意味を担うため、「エジプトへ戻る」と自然に訳した。
theological_decisions:
- issue: イスラエルがエジプトへ戻ったことの性質
  choice: 「心の中ではエジプトへ戻ってしまいました」とし、内面的な願望と忠誠の逆転を示す。
  alternative: 「心をエジプトに向けました」「心の中でエジプトに帰りました」
  rationale: 「心の中で」という明示句により、荒野にいながら内面では出エジプトを逆行したという緊張を保つ。単なる郷愁とも実際の移動とも限定しない。
translation_notes:
  register: 明快な現代標準日本語を用い、説教者ステファノの丁寧な叙述に合わせて敬体とした。「先祖」「退ける」「心の中」など、一般読者に理解しやすく、かつ品位のある語を選んだ。
