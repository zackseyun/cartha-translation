  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: ja
  text: さて、神がアブラハムに約束しておられた約束の時が近づくにつれて[a]、民はエジプトで増え、数多くなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神がアブラハムに告げておられた約束」または「神がアブラハムに確約しておられた約束」とも訳せる。ここで用いられたギリシア語の動詞には、約束を明言し、確約するという意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: さて、〜につれて
  rationale: καθώςの時間的な進行を「〜につれて」で表し、δέの穏やかな話題の展開を「さて」で示した。強い逆接は文脈上不要である。
- source_word: ἤγγιζεν
  choice: 近づく
  rationale: 未完了過去が示す進行中の接近は、「〜につれて」という構文全体で自然に表した。
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: その約束の時
  rationale: χρόνοςを一般的な「時」、ἐπαγγελίαを「約束」と訳し、「定められた時」や「成就の時」など原文に明示されない意味を本文へ加えなかった。
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: 神がアブラハムに約束しておられた
  rationale: この文脈のὁμολογέωは、アブラハムに対する神の明言された約束を指す。「約束しておられた」は自然な日本語であり、特定の誓約行為まで意味する「誓う」は避けた。
- source_word: ηὔξησεν ὁ λαὸς
  choice: 民は…増え
  rationale: λαόςをイスラエルという集合的な「民」とし、αὐξάνωの増加を簡潔に「増え」と表した。
- source_word: καὶ ἐπληθύνθη
  choice: 数多くなっていった
  rationale: 先行する「増え」との語彙上の違いを保ちつつ、民の人数が多くなったことを明確にした。文脈上の進展も自然に伝える。
- source_word: ἐν Αἰγύπτῳ
  choice: エジプトで
  rationale: 場所を示すἐνを、日本語として自然な助詞「で」により表した。
theological_decisions:
- issue: 神のアブラハムへの約束に関するὡμολόγησενの訳
  choice: 約束しておられた
  alternative: 告げておられた／確約しておられた／誓っておられた
  rationale: ὁμολογέωには公に認める、明言するという含みがあるが、ここではἐπαγγελίαとの関係から「約束する」が明瞭である。「誓う」は原文より強い誓約の意味を持ち込みうるため採用しなかった。
translation_notes:
  register: 現代標準日本語の平明で品位ある語調とした。「約束」の反復は日本語ではやや目立つが、原文のἐπαγγελίαと、それを受ける動詞の関係を明示し、意味を「成就」と解釈して補わないため保持した。
