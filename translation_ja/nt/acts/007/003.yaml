  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: ja
  text: そして彼に言った。「あなたの土地を出て、親族[a]から離れ、わたしがあなたに示す土地へ来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身内」または「一族」とも訳せる。ギリシア語は、血縁で結ばれた人々や親族集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: 彼に言った
  rationale: ギリシア語の代名詞を固有名に置き換えず、文脈上の指示対象を保った自然な叙述とした。
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: あなたの土地を出て
  rationale: ἐξέρχομαι と ἐκ の外へ出る動きを明確にしつつ、γῆを現代の国家概念に限定しない「土地」とした。
- source_word: ἐκ τῆς συγγενείας σου
  choice: 親族から離れ
  rationale: συγγένειαが指す血縁者・親族集団を「親族」で表した。日本語では土地と同じく「出る」を重ねるより、「から離れ」とする方が意味が明瞭で自然である。
- source_word: δεῦρο εἰς τὴν γῆν
  choice: 土地へ来なさい
  rationale: δεῦροの話者を基準とする「来る」という直示的なニュアンスを保ち、εἰςによる到達方向を「へ」で自然に示した。
- source_word: ἣν ἄν σοι δείξω
  choice: わたしがあなたに示す
  rationale: ἄνを伴う接続法の未来志向を、日本語では不必要な不確実性を加えず現在形による自然な未来表現で伝えた。
