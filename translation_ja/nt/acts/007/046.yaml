  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: ja
  text: ダビデは、神の前に恵みを受け、ヤコブの神のための住まい[a]を見いだすことを願い求めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤコブの神のための幕屋」とも訳せる。
    reason: σκήνωμαは「住まい」のほか、「幕屋」と訳すことも可能であるため。
lexical_decisions:
- source_word: ὃς
  choice: このダビデは
  rationale: 関係代名詞の先行詞は直前のダビデである。単独の節としても指示対象が明確になるよう「このダビデは」とした。
- source_word: εὗρεν χάριν
  choice: 恵みを受け
  rationale: 「恵みを見いだす」は神から好意を受けることを表す慣用句であり、現代日本語として自然な「恵みを受け」とした。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前に
  rationale: 神の御前・神の目に、という関係を簡潔に保つ表現である。
- source_word: ᾐτήσατο
  choice: 願い求めた
  rationale: 単なる質問ではなく、神に願い出る意味を自然に表す。
- source_word: εὑρεῖν
  choice: 見いだしたい
  rationale: 原語の「見つける、見いだす」を保ちつつ、願いの内容を示す日本語の構文にした。「用意する」と解釈して言い換えることは避けた。
- source_word: σκήνωμα
  choice: 住まい
  rationale: 特定の建造物に限定されない「居所」の意味を明瞭に表す。文脈上は幕屋も考えられるため、別訳を脚注に示した。
- source_word: τῷ θεῷ Ἰακώβ
  choice: ヤコブの神のために
  rationale: 与格を「〜のために」と訳し、聖書で定着した契約的呼称「ヤコブの神」を保った。
theological_decisions:
- issue: ダビデが願った建造物の性質
  choice: 「住まい」とし、幕屋や神殿のいずれかに限定しない
  alternative: 「幕屋」または「家」
  rationale: σκήνωμαは広く住まい・居所を指し得る。次節でソロモンが「家」を建てたと述べられるため、ここで特定の構造物に狭めず、ステファノの叙述にある含みを残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神の前に」「ヤコブの神」「願い求めた」によって聖書本文にふさわしい端正さを保った。
