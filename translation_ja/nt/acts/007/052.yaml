revisions:
- from: あなたがたの父祖[a]が迫害しなかった預言者が、一人でもいたでしょうか。父祖たちは、「正しい方」[b]が来られることを前もって告げた人々を殺しました。そして今や、あなたがたはその方を裏切る者[c]、殺人者となりました。
  to: あなたがたの父祖[a]が迫害しなかった預言者が、一人でもいたでしょうか。父祖たちは、正しい方[b]が来られることを前もって告げた人々を殺しました。そして今や、あなたがたはその方を裏切り、殺した者[c]となりました。
  rationale: 「裏切る者、殺人者」という不均衡な名詞句を、「その方を裏切り、殺した者」として自然な日本語に改めた。これは προδόται と φονεῖς が指す、聞き手による裏切りと殺害という二重の告発を保持する。称号表現の引用符も外したが、意味や称号性は変更していない。
