id: ACT.7.52
reference: Acts 7:52
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: ja
  text: あなたがたの父祖[a]が迫害しなかった預言者が、一人でもいたでしょうか。父祖たちは、正しい方[b]が来られることを前もって告げた人々を殺しました。そして今や、あなたがたはその方を裏切り、殺した者[c]となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先祖」とも訳せる。ギリシア語は直訳すると「父たち」。
    reason: lexical_alternative
  - marker: b
    text: 「義なる方」または「正義の方」とも訳せる。ここではイエスを指す称号。
    reason: lexical_alternative
  - marker: c
    text: 直訳では「裏切り者、殺人者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: 迫害しなかった預言者が、一人でもいたでしょうか
  rationale: 部分属格を日本語の反語として自然に表し、迫害を免れた預言者は一人もいなかったという強い非難を保った。
- source_word: ἐδίωξαν
  choice: 迫害しなかった
  rationale: ここでは預言者に対する敵対的な追及・抑圧を指すため、「迫害する」が文脈に最も合う。
- source_word: οἱ πατέρες ὑμῶν
  choice: あなたがたの父祖
  rationale: 単なる直系の父ではなく、聞き手の先人たちを指す。「父祖」は原文の「父たち」と、世代を越えた責任の連続性を比較的よく保つ。
- source_word: ἀπέκτειναν
  choice: 殺しました
  rationale: 明快な現代日本語で、原文の直接的で厳しい告発を弱めない。
- source_word: τοὺς προκαταγγείλαντας
  choice: 前もって告げた人々
  rationale: προ- の時間的な先行性と、告知するという動作の双方を明示した。
- source_word: περὶ τῆς ἐλεύσεως
  choice: 来られること
  rationale: 「正しい方」の到来について事前に告げたという意味を、自然な日本語の従属節で表した。
- source_word: τοῦ δικαίου
  choice: 「正しい方」
  rationale: 冠詞付き単数で、文脈上イエスを指す称号的表現である。「義人」よりも特定の人物への敬意と称号性を伝えやすく、現代の一般読者にも明瞭である。
- source_word: νῦν
  choice: 今や
  rationale: 父祖の過去の行為と、聞き手の現在の罪責との対比を強く保った。
- source_word: προδόται
  choice: 裏切る者
  rationale: 政治的な「反逆者」という含みを避け、当人を裏切って敵に渡す行為に焦点を置いた。
- source_word: φονεῖς
  choice: 殺人者
  rationale: 単なる「殺した者」ではなく、道徳的責任を問う原文の非難を表す。
- source_word: ἐγένεσθε
  choice: となりました
  rationale: ある時点でそのような者になり、その状態にあるという結果を自然な日本語で表した。
theological_decisions:
- issue: τοῦ δικαίου のキリスト論的な称号性
  choice: 「正しい方」
  alternative: 「義なる方」／「正義の方」
  rationale: 文脈では預言者たちが到来を告げた特定の人物、すなわちイエスを指す。引用符によって称号性を示しつつ、原文以上の教派的説明は加えない。
- issue: 聞き手と父祖の罪責の関係
  choice: 父祖の迫害・殺害と、聞き手の裏切り・殺害を区別して並置する
  alternative: 両者を一つの集団的罪責として言い換える
  rationale: 原文は「あなたがたの父祖」と「今や、あなたがた」を対照させるため、その歴史的連続性と主体の区別をともに保持した。
- issue: προδόται と φονεῖς の罪責表現
  choice: 裏切る者、殺人者
  alternative: 裏切り者、殺害者
  rationale: イエスが引き渡され、殺されたことへの直接的な告発を保つ一方、「反逆者」のような政治的意味には限定しない。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。反語の力、父祖と聞き手の対比、告発の厳しさを保った。「義なる方」のような古風な宗教語は本文では避け、代案として脚注に示した。
