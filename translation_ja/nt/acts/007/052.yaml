  naturalness: 「あなたがたの父祖が迫害しなかった預言者が、一人でもいたでしょうか」は自然で明瞭である。「その方を裏切る者、殺人者」は並列名詞句としてはやや不均衡なので、「その方を裏切り、殺した者となりました」とするほうが現代標準日本語として滑らかであり、原文の二つの責任を明瞭に保つ。
  terminology: 「父祖」はこの文脈で適切であり、脚注の「先祖」も有益である。「正しい方」は τοῦ δικαίου の称号的用法を平明に表す。本文で敬称の「方」を用いる以上、引用符は不要であり、引用符を外したほうが通常の日本語表記に合う。
