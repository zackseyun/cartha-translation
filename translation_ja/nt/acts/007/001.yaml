  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: ja
  text: そこで大祭司は言った。「これらのことは、そのとおりなのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これはそのとおりなのか」。意味を明示すれば「これらの告発は事実なのか」。
    reason: 「これらのこと」は直前の告発を指すが、複数を保つか日本語で一括して表すか、また指示対象を明示するかに訳の幅があるため。
lexical_decisions:
- source_word: Εἶπεν
  choice: 言った
  rationale: λέγωのアオリストとして、ギリシア語の叙述形式を保つ標準的な訳。後に疑問文が続くが、「尋ねた」と解釈的に言い換えない。
- source_word: δὲ
  choice: そこで
  rationale: 前節までの告発を受けた物語の進行を、自然な現代日本語で示す。
- source_word: ὁ ἀρχιερεύς
  choice: 大祭司
  rationale: この審理の場で発言する単数の祭司長を指す標準的な訳語。
- source_word: Εἰ
  choice: ～なのか
  rationale: 直接疑問を導くεἰを、日本語の自然な真偽疑問として表した。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前に述べられた複数の告発内容を指す。本文では「これらの告発」と限定せず、原文の指示表現の幅を保つ。
- source_word: οὕτως ἔχει
  choice: そのとおりなのか
  rationale: 「そのような状態にある／そのとおりである」という慣用的意味を、簡潔で自然な日本語にした。
