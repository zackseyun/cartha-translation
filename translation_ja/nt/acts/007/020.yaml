id: ACT.7.20
reference: Acts 7:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: ja
  text: そのころ、モーセが生まれた。彼は神の目に美しい子であった。[a] そして三か月の間、父の家で育てられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神にとって美しかった」とも訳せる。「美しい」に当たるギリシア語は「立派な」「容姿の美しい」という意味にもなりうるが、原文には神への言及が明記されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: そのころ
  rationale: 時間を示す慣用表現として、文脈とのつながりを保ちながら自然な現代日本語とした。
- source_word: ἐγεννήθη
  choice: 生まれた
  rationale: 誕生の文脈におけるγεννάωのアオリスト受動形を、日本語で自然に表した。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ἀστεῖος τῷ θεῷ
  choice: 神の目に美しい子であった
  rationale: ἀστεῖοςの美しさという基本義と、τῷ θεῷによる神の評価・観点を明示的に保った。「子」は誕生直後の文脈から自然に補った。
- source_word: ὃς
  choice: そして
  rationale: 関係代名詞の指示対象は直前のモーセで明白なため、日本語では主語を重ねず、独立した文として自然につないだ。
- source_word: ἀνετράφη
  choice: 育てられた
  rationale: 養育されることを表す受動形を保ち、家庭内での養育に合う明瞭な表現とした。
- source_word: μῆνας τρεῖς
  choice: 三か月の間
  rationale: 期間を自然な日本語で明示した。
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: 父の家で
  rationale: 原文の父および家への言及を簡潔かつ自然に保持した。
theological_decisions:
- issue: ἀστεῖος τῷ θεῷの意味
  choice: 神の目に美しい子であった
  alternative: 神にとって美しかった／非常に美しい子であった
  rationale: 神への明示的な言及を落とさず、神の観点・評価を表す表現とした。同時に、「特別に選ばれた」など原文以上の神学的意味は加えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「神の目に」により、直訳調の「神に美しい」を避けつつ、原文の神への明示的言及を保持した。
