  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: ja
  text: ところが、隣人に不正を働いていた者は、モーセを押しのけて[a]言った。「だれがあなたを、私たちの支配者や裁判官に任命したのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「突きのけて」。このギリシア語は、力を込めた身体的な動作、または相手を退ける拒絶を強調する場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: 不正を働いていた
  rationale: 現在分詞の継続的な側面と、ἀδικέωが表す不正・加害の意味を自然な日本語で保つ。
- source_word: τὸν πλησίον
  choice: 隣人
  rationale: 「近くにいる者」「隣人」という標準的な意味を保ち、文脈上の同胞という限定を本文に過度に持ち込まない。
- source_word: ἀπώσατο
  choice: 押しのけて
  rationale: 身体的に押しやる動作と、相手を退ける拒絶的な含みの両方を表せる。
- source_word: αὐτόν
  choice: モーセを
  rationale: 日本語では代名詞のままだと指示対象が曖昧になりやすいため、直前の文脈で指されるモーセを明示した。
- source_word: κατέστησεν
  choice: 任命した
  rationale: 人を権威ある地位に据えるという使役的な意味を、現代日本語で自然に表す。
- source_word: ἄρχοντα
  choice: 支配者
  rationale: 権威をもって治める者という語義を直接的に示し、δικαστήςとの並列も保つ。
- source_word: δικαστὴν
  choice: 裁判官
  rationale: 争いを裁く公的権威を表す語として明確であり、「支配者」との区別も伝わる。
- source_word: ἐφ’ ἡμῶν
  choice: 私たちの支配者や裁判官
  rationale: 「私たちの上に立つ」という権威関係を、日本語の自然な所有・関係表現によって示す。
