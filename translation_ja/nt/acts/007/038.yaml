id: ACT.7.38
reference: Acts 7:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: ja
  text: この人こそ、荒野の集会[a]で、シナイ山で彼に語っていた御使いと、私たちの父祖たち[b]と共にいた人です。彼は、私たちに与えるために、生きたことば[c]を受けました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「会衆」とも訳せます。伝統的には「荒野の教会」と訳されてきました。
    reason: alternative_reading
  - marker: b
    text: 「私たちの父祖たち」はイスラエルの先祖たちを指します。「私たちの先祖たち」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「生けることば」、または「命を与える神託」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: 集会
  rationale: 荒野に集められたイスラエルの民を指す基本的な語義を表し、後代の制度的な「教会」という意味を不必要に持ち込まないため。
- source_word: ἐρήμῳ
  choice: 荒野
  rationale: イスラエルの荒野の旅という聖書的背景に最も自然に合い、「砂漠」より広い原語の意味を保つため。
- source_word: ἀγγέλου
  choice: 御使い
  rationale: シナイ山の文脈では人間の使者ではなく天的存在を指すと理解されるため。
- source_word: λαλοῦντος
  choice: 語っていた
  rationale: 分詞の継続的な様相を自然な日本語で保つため。
- source_word: ὄρει Σινᾶ
  choice: シナイ山
  rationale: 地名の標準的で自然な日本語表現。
- source_word: πατέρων ἡμῶν
  choice: 私たちの父祖たち
  rationale: イスラエルの先祖を指す男性形の表現を保ちつつ、現代日本語で単なる実父との混同を避けるため。
- source_word: ἐδέξατο
  choice: 受けました
  rationale: モーセが神から啓示を受領したことを簡潔かつ明確に表すため。
- source_word: λόγια
  choice: 御言葉
  rationale: 通常の発言ではなく神からの言葉を指す語であることを、「神託」より自然で品位ある日本語によって示すため。
- source_word: ζῶντα
  choice: 生ける
  rationale: 「命を与える」と意味を限定せず、原文の「生きている」という鮮烈で神学的に含みのある表現を保つため。
- source_word: δοῦναι
  choice: 与えるために
  rationale: 受領の目的を示す不定詞を、自然かつ明確に表すため。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: ステファノが聴衆をイスラエルの契約の歴史に含めて語る原文の一人称複数を保持するため。
- source_word: ὁ γενόμενος
  choice: いた人
  rationale: その場に身を置いていたことを示す表現として、「生じた」のような逐語訳を避け、文脈に即した自然な日本語にするため。
theological_decisions:
- issue: 荒野のイスラエルに関するἐκκλησίαを「教会」と訳すか
  choice: 集会
  alternative: 会衆／教会
  rationale: ここでは荒野に集められたイスラエルを指しており、後代の教会制度との同一視を訳文だけで確定しないため。
- issue: λόγια ζῶνταを解釈的に「命を与える言葉」とするか
  choice: 生ける御言葉
  alternative: 生きている神の言葉／命を与える御言葉
  rationale: 言葉そのものが「生ける」とされる原文の緊張と豊かさを保ち、それが生命を持つのか生命を与えるのかを一方に限定しないため。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「御使い」「生ける御言葉」によって聖書本文としての品位を保った。「この人こそ」でοὗτόςの強調を示し、二文に分けて長いギリシア語構文を読みやすくした。
