id: ACT.7.30
reference: Acts 7:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: ja
  text: 四十年が満ちたとき[a]、シナイ山の荒野で、一人の御使いが柴の燃える炎の中に現れた[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「四十年が過ぎた後」。直訳的には「四十年が満ちたとき」。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「柴の火の炎の中に」。柴と結びついた炎を指し、出エジプト記3章2節を踏まえている。
    reason: cross_reference
  - marker: c
    text: 出エジプト記3章2節の「主の使い」と結びつけて理解する解釈もあるが、使徒言行録のここでは単に「御使い」と記されている。
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: 四十年が満ちたとき
  rationale: 属格独立構文の時間的意味と πληρόω の「満ちる」という語感を保ちつつ、自然な日本語にした。
- source_word: ὤφθη αὐτῷ
  choice: 現れた
  rationale: ὤφθη は神的・天的な顕現について自動詞的に用いられており、文脈上モーセへの出現であることは明らかなので、冗長な「彼に」を省いた。
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: シナイ山の荒野で
  rationale: 属格を自然な連体修飾として訳し、出エジプト記の舞台にふさわしい「荒野」を用いた。
- source_word: ἄγγελος
  choice: 一人の御使い
  rationale: この文脈では人間の使者でなく天的存在を指す。「一人の」により不定性を示し、原文にない「主の」を加えなかった。
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: 柴の燃える炎の中に
  rationale: 圧縮された属格表現を日本語で理解しやすくし、柴に結びついた火の炎という像を保った。
theological_decisions:
- issue: 顕現した ἄγγελος の同定
  choice: 「一人の御使い」とし、本文ではそれ以上同定しない
  alternative: 「主の御使い」
  rationale: 使徒言行録のギリシア語本文は単に ἄγγελος とあり、「主の」という限定を持たない。出エジプト記3章との関係は注で示し、本文では神学的同定を追加しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御使い」は聖書文体として広く理解される語を採用し、原文の不定性を「一人の」で示した。注記記号は該当箇所に配置した。
