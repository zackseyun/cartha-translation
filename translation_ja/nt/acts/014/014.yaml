  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: ja
  text: しかし、使徒たち、すなわちバルナバとパウロは、それを聞くと、衣を引き裂き[a]、群衆の中へ飛び込んで[b]、大声で叫びながら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 衣を引き裂くことは、悲嘆や戦慄、また神を汚すような敬意に対する抗議を示す慣習的なしるしであった。
    reason: cultural_note
  - marker: b
    text: 別訳「群衆の中へ駆け込んで」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: これを聞くと
  rationale: アオリスト分詞の時間的な働きを自然な現代日本語で表し、聞いた後に行動したという順序を保つ。
- source_word: δὲ
  choice: しかし
  rationale: 群衆がいけにえを献げようとした直前の場面と、二人の強い反応との対照を示す。
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: 使徒であるバルナバとパウロ
  rationale: 同格表現に従い、この文脈でバルナバとパウロが「使徒」と呼ばれていることを明確に保つ。
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: 衣を引き裂き
  rationale: 悲嘆、恐れ、冒瀆への抗議などを表す慣習的動作を、簡潔で格調を保った日本語にする。
- source_word: ἐξεπήδησαν εἰς τὸν ὄχλον
  choice: 群衆の中へ飛び出して
  rationale: ἐκ の方向感を含む動詞が表す、突然で勢いのある移動と、εἰς が示す群衆の中への動きをともに表す。
- source_word: κράζοντες
  choice: 大声で叫んだ
  rationale: 現在分詞が示す、移動に伴う強く大きな発声を自然な日本語で表す。
theological_decisions:
- issue: 「使徒」がバルナバとパウロを指すこと
  choice: 「使徒であるバルナバとパウロ」と訳す
  alternative: 「使徒たち、バルナバとパウロ」または、使徒を十二人に限定する解釈を訳文に持ち込む
  rationale: ギリシャ語の同格表現は、この箇所でバルナバとパウロを使徒として示している。使徒職の範囲をめぐる後代の教理的判断で本文を狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「衣」「使徒」など聖書本文にふさわしい簡潔で品位ある語を選んだ。動作の切迫感は「飛び出して」「大声で叫んだ」で表した。
