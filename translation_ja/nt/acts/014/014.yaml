  source_fidelity: 本文は概ねギリシャ語に忠実であり、バルナバとパウロを「使徒」とする同格関係、衣を裂く行為、群衆の中への緊急の移動を保っている。ただし、ἐξεπήδησαν は「群衆の中へ飛び出して」より「群衆の中へ飛び込んで」の方が、日本語で移動の到達点を明確にしつつ、突然で勢いのある動きを適切に表す。また κράζοντες は次節に続く同時的な現在分詞なので、「叫びながら、」として継続を明示する。
  naturalness: 「使徒たち、すなわちバルナバとパウロ」とすると同格が明瞭で、現代標準日本語としても自然である。「それを聞くと」は前節の出来事を受ける表現として自然である。文末を読点で保留し、次節の発話へつなげる。
