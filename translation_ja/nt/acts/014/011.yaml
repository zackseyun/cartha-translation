  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: ja
  text: 群衆はパウロがしたことを見ると、声を張り上げ、リカオニア語でこう言った。「神々が人間のようになって、私たちのところに降りて来た！」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: 群衆は…見ると
  rationale: τέによる物語の継続と、アオリスト分詞ἰδόντεςの時間的関係を、自然な現代日本語の「見ると」で表した。ὄχλοιは複数形だが、日本語の集合名詞「群衆」で十分に意味が伝わる。
- source_word: ὃ ἐποίησεν Παῦλος
  choice: パウロがしたこと
  rationale: 直前の奇跡を指す関係節を簡潔に訳し、本文にない「奇跡」という説明は加えなかった。
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: 声を張り上げ
  rationale: 直訳的な「声を上げ」より大声で叫ぶ含意が明確でありつつ、原文の比喩的表現を保つ。
- source_word: Λυκαονιστί
  choice: リカオニア語で
  rationale: 言語を表す副詞を、現代日本語で明瞭な表現にした。
- source_word: Οἱ θεοὶ
  choice: 神々が
  rationale: 群衆が信じる複数の異教神を指すため、複数性を明示する「神々」とした。
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: 人間のような姿になって
  rationale: 受動形の分詞が表す「人間に似たものとなる」という意味を保ちつつ、日本語として自然にした。「人間の姿で」だけでは変化・成立の含みが弱くなるため、「なって」を用いた。
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: 私たちのところに降りて来られた
  rationale: καταβαίνωの下降の意味を「降りて来る」で保持した。群衆が神々について語る直接話法なので、自然な敬意を示す「来られた」を用いたが、神学的な真実性を訳文自体が認定するものではない。
theological_decisions:
- issue: 群衆の異教的理解を、キリスト教の受肉教理と混同させずに表すこと
  choice: 神々が人間のような姿になって…降りて来られた
  alternative: 神々が人間の姿で…降りて来られた
  rationale: ὁμοιωθέντεςの「似たものとなった」という含みを残し、群衆自身の誤った解釈としてそのまま提示した。「受肉した」などの教義的用語は避けた。
translation_notes:
  register: 明瞭で自然な現代標準日本語。群衆の興奮は「声を張り上げ」で表し、直接話法には場面に即した品位を持たせた。原文に説明上の重要な異読や、日本語本文だけでは保持しにくい必須の曖昧さがないため、脚注は付していない。
