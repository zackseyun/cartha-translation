  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: ja
  text: そして、ペルガでみことばを語った後、アタリアへ下って行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 旅行記事をつなぐ通常の接続として、自然な現代日本語の「そして」とした。
- source_word: λαλήσαντες
  choice: 語った後
  rationale: アオリスト能動分詞が主動詞に先立つ行為を表すため、「語った後」として時間的関係を自然に示した。「宣べ伝えた」も文脈上可能だが、λαλέω自体より強い意味を加えない。
- source_word: τὸν λόγον
  choice: みことば
  rationale: 初代教会の宣教内容を指す定型的な用法を保つため「みことば」とした。「主の」は原文にないため補わない。
- source_word: ἐν Πέργῃ
  choice: ペルガで
  rationale: 都市における行為の場所を示すἐνを、日本語として自然な助詞「で」で表した。
- source_word: κατέβησαν
  choice: 下って行った
  rationale: καταβαίνωの下降移動を明示し、内陸のペルガから沿岸のアタリアへの地理的移動にも適合する。「行った」により物語の視点を保った。
- source_word: εἰς Ἀττάλειαν
  choice: アタリアへ
  rationale: 目的地を示すεἰςを、自然な日本語の方向助詞「へ」で表した。
- source_word: implicit plural subject
  choice: 二人は
  rationale: ギリシア語動詞の三人称複数の主語は直前の文脈におけるパウロとバルナバである。日本語で主語を明確にしつつ、固有名を再挿入せず「二人」とした。
