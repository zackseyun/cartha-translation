  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: ja
  text: 二人は彼らのために、教会ごとに長老たちを任命し[a]、断食を伴って祈った後、彼らが信じていた主に彼らを委ねた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「長老たちを選び」。このギリシア語動詞は、文脈によっては挙手による選出を意味することがあるが、ここでは単に任命することを指す可能性もある。
    reason: alternative_reading
  - marker: b
    text: 「彼ら」は信徒たち全体を指すと考えられるが、新たに任命された長老たちを指す可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: 任命し
  rationale: この文脈では、選んで職に就ける行為を表す。語の歴史的背景には挙手による選出の含みもあり得るが、ここで具体的な手続きは明示されていないため、「任命する」とした。
- source_word: κατ’ ἐκκλησίαν
  choice: それぞれの教会で
  rationale: κατάと単数名詞の組み合わせが持つ配分的な意味を、自然な日本語で表した。
- source_word: πρεσβυτέρους
  choice: 長老たち
  rationale: 単なる年長者ではなく、各教会の公認された指導者を指す教会的文脈である。
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: 断食をして祈ったうえで
  rationale: 祈りに断食が伴ったことと、主動詞に先立つ行為であることを自然に示す。νηστειῶνの複数形は日本語では慣用的に「断食」とした。
- source_word: παρέθεντο
  choice: 委ねた
  rationale: 人々を主の守りと配慮に託すという中動態の関係的な意味を明瞭に表す。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: παρατίθημιの与格として、委ねる相手を示す。κύριοςは教会的称号として「主」とした。
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: 彼らが信じてきた主
  rationale: 完了過去形が示す、それ以前に始まり、その時点まで続く信頼を「信じてきた」で表した。関係代名詞の先行詞は自然に「主」である。
- source_word: αὐτοῖς ... αὐτοὺς
  choice: 彼らのために……彼らを
  rationale: 原文の代名詞表現を保ち、後半のαὐτούςが信徒全体を指すか、新任の長老たちを指すかという曖昧さを本文で限定しないようにした。
theological_decisions:
- issue: χειροτονήσαντεςが示す教会統治上の選任方法
  choice: 長老たちを任命し
  alternative: 長老たちを挙手で選び／選出し
  rationale: この語には挙手による選出という歴史的用法があるが、コイネー期には一般に選任・任命を意味し得る。この節だけでは具体的な教会政治の方式を確定できないため、中立的な訳を採用した。
- issue: παρέθεντο αὐτοὺςのαὐτούςの指示対象
  choice: 本文では「彼ら」として曖昧さを保持し、文脈上は信徒・諸教会全体を第一候補とする
  alternative: 新たに任命された長老たちだけを指す
  rationale: 直前には長老たちがあるため後者も可能だが、段落全体は弟子たちと諸教会を扱っている。訳文で一方に固定せず、注で代案を示す。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「二人」は直前の文脈にいるパウロとバルナバを自然に受ける。二つのアオリスト分詞と主動詞の順序を「任命し、断食をして祈ったうえで、……委ねた」で示した。原文上の曖昧さは代名詞と脚注によって保持した。
