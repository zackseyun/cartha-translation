id: ACT.14.22
reference: Acts 14:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: ja
  text: 弟子たちの心を強め、信仰にとどまるよう励まし、「私たちは多くの苦難を通って神の国に入らなければならない」と語った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: 強め
  rationale: 弟子たちをさらに堅固にする継続的な働きを、自然で簡潔な現代日本語で表す。
- source_word: τὰς ψυχὰς
  choice: 心
  rationale: ここでは弟子たちの内面・人格全体を指す。「魂」も可能だが、心身二元論を不必要に連想させず、文脈に自然な「心」とした。
- source_word: τῶν μαθητῶν
  choice: 弟子たち
  rationale: イエスに従う者を表す新約聖書の定着した訳語。
- source_word: παρακαλοῦντες
  choice: 励まし
  rationale: 慰めを伴う勧告という幅を保ち、この文脈での支援的な促しを自然に表す。
- source_word: ἐμμένειν
  choice: とどまる
  rationale: あるものの中に堅くあり続ける意味を、簡潔に保持する。
- source_word: τῇ πίστει
  choice: 信仰に
  rationale: 定冠詞は共有されたキリスト教信仰を示しうるが、日本語では「その信仰」とすると指示性が過度に強くなりうるため、「信仰に」として客観的内容と信頼の双方の余地を残す。
- source_word: διὰ πολλῶν θλίψεων
  choice: 多くの苦難を通って
  rationale: θλῖψιςの圧迫・患難・苦しみの重さを、一般読者に明瞭な「苦難」で表す。διά＋属格の経路的意味は「通って」とした。
- source_word: δεῖ ἡμᾶς
  choice: 私たちは…なければならない
  rationale: 必然・必要を明確に表しつつ、その神学的仕組みを本文以上に説明しない。
- source_word: εἰσελθεῖν εἰς
  choice: 入る
  rationale: 日本語では「神の国に入る」が自然であり、移動先を示すεἰςも助詞「に」に反映される。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配とその領域の両面を含みうる、明瞭で定着した訳語。
theological_decisions:
- issue: τῇ πίστει の意味
  choice: 信仰に
  alternative: その信仰に／信仰を持ち続ける
  rationale: 定冠詞による共有された信仰内容の可能性を認めつつ、日本語で不自然な限定を加えない。「とどまる」によって、単なる一時的信頼ではなく継続性も示す。
- issue: δεῖ の必然性
  choice: 入らなければならない
  alternative: 入ることになっている／入る必要がある
  rationale: 原文の強い必要性を保つが、苦難が救いの功績条件であるとも、特定の予定論的機構を示すとも付加しない。
- issue: 苦難と神の国への प्रवेशの関係
  choice: 多くの苦難を通って神の国に入る
  alternative: 多くの患難を経なければ神の国に入れない
  rationale: διάの経路的関係を保持し、「苦難を功績として条件化する」という原文にない含意を避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。分詞の連鎖は日本語の叙述として「強め、…励まし、…と語った」と整えた。引用符を用いて、ὅτι以下が彼らの語った内容であることを明示した。
