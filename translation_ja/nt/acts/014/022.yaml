  source_fidelity: 原文の三つの現在分詞（「強め」「励まし」「語る」）を、日本語の連続した叙述として適切に反映している。「多くの苦難を通って」は διὰ πολλῶν θλίψεων の経路的な意味を保ち、「入らなければならない」は δεῖ の必要・必然を過不足なく表す。「信仰にとどまる」も ἐμμένειν τῇ πίστει に自然に対応する。
  naturalness: 「弟子たちの心を強め、信仰にとどまるよう励まし、…と語った」は明瞭で自然な現代標準日本語である。引用符によって ὅτι 以下が語られた内容であることも分かりやすい。
  terminology: 「弟子たち」「信仰」「苦難」「神の国」はいずれも定着した適切な訳語である。「心」はこの文脈の ψυχάς を日本語として無理なく表し、特定の人間論を不必要に固定しない。
