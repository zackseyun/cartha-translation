- source_word: κἀκεῖ
  choice: そして、そこでも
  rationale: καίとἐκεῖの結合語であり、物語のつながりを示す「そして」と、「そこでも」という付加の含みの両方を自然な日本語で表した。
- source_word: εὐαγγελιζόμενοι
  choice: 福音を宣べ伝えて
  rationale: εὐαγγελίζωは良い知らせを告げること、特に福音を伝えることを意味する。使徒言行録の文脈に適した、明確で品位ある定着表現を採用した。
- source_word: ἦσαν
  choice: していた
  rationale: 現在分詞との迂言的な未完了過去構文を、日本語の継続的な過去を表す「していた」で自然に訳した。主語は前節のパウロとバルナバなので「二人」と明示した。
