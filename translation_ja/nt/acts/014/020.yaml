id: ACT.14.20
reference: Acts 14:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: ja
  text: しかし、弟子たちがパウロの周りに集まると[a]、彼は立ち上がって町に入った[b]。そして翌日、バルナバと一緒にデルベへ向かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弟子たちが彼を取り囲むと」。
    reason: lexical_alternative
  - marker: b
    text: 「立ち上がって」は「起き上がって」とも訳せる。ギリシア語は復活を表す場合にも用いられるが、ここではそれを明示せず、まず身体的に起き上がったことを述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: 周りに集まると
  rationale: κυκλόωは「取り囲む、周囲を囲む」を表す。ここでは敵対的な含みを避けつつ、弟子たちがパウロの周囲を囲んだ状況を自然な現代日本語で示した。属格絶対の先行動作は「集まると」で表現した。
- source_word: δὲ
  choice: しかし
  rationale: 前節でパウロが石打ちにされ、死んだものと思われて町の外へ引きずり出されたこととの意外な展開を、穏やかな逆接として示す。
- source_word: τῶν μαθητῶν
  choice: 弟子たち
  rationale: 使徒言行録における μαθητής の定着した訳語を用いた。
- source_word: ἀναστὰς
  choice: 立ち上がって
  rationale: ἀνίστημιの通常の身体動作を表す。文脈上、驚くべき回復ではあるが、語そのものが復活や神による蘇生を明示しているとは限定しない。
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: 町に入った
  rationale: εἰσέρχομαι と εἰς の移動方向を簡潔で自然な日本語にした。
- source_word: τῇ ἐπαύριον
  choice: 翌日
  rationale: 「次の日に」を意味する時間表現を自然な日本語で簡潔に表した。
- source_word: ἐξῆλθεν ... εἰς Δέρβην
  choice: デルベへ向かった
  rationale: 直訳は「デルベへ出て行った」。日本語では出発地が文脈上明らかであり、目的地への移動を自然に示す「向かった」とした。
- source_word: σὺν τῷ Βαρναβᾷ
  choice: バルナバと一緒に
  rationale: σύν＋与格の同行を明瞭に表した。
- source_word: Δέρβην
  choice: デルベ
  rationale: 地名 Derbe の日本語聖書で一般的な音写を採用した。
theological_decisions:
- issue: ἀναστὰςが復活または奇跡的蘇生を示すか
  choice: 通常の身体動作として「立ち上がって」と訳す
  alternative: 「起き上がって」「よみがえって」「立たされて」
  rationale: ἀναστὰςはそれ自体では「立ち上がる、起き上がる」という通常の動作を表し得る。直前の石打ちという文脈は驚異的な回復をうかがわせるが、本節は復活や受動的に生き返らされたことを明言していないため、その神学的可能性を訳文で確定しない。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ文体とした。原文では代名詞のみだが、日本語では直前の文脈から指示対象を明確にするため「パウロ」を補った。「しかし」「そして」により原文の談話展開を保持した。
