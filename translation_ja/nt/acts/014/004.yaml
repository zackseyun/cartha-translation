id: ACT.14.4
reference: Acts 14:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: ja
  text: しかし、町の人々は二つに分かれ[a]、ある者たちはユダヤ人の側につき、ほかの者たちは使徒たちの側についた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「町の群衆は分裂した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: 二つに分かれ
  rationale: σχίζωの受動形で、「裂かれた、分裂した」の意。ここでは町の人々が二派に分かれたことを、自然な日本語で表した。
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: 町の人々
  rationale: πλῆθοςは「大勢の人、群衆」を表すが、ここでは一時的に集まった群衆よりも、町の住民たちを広く指すため、「町の人々」とした。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの宣教としるしに対する町の反応が分裂であったことを示す、穏やかな対照として訳した。
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ある者たちは……ほかの者たちは
  rationale: 二つの対照的な集団を示す相関表現を、明瞭で自然な日本語にした。
- source_word: σὺν
  choice: の側につき
  rationale: 単なる同伴ではなく、この文脈では支持や陣営への帰属を示すため、「共にいた」より意味が伝わりやすい表現を選んだ。
- source_word: Ἰουδαίοις
  choice: ユダヤ人
  rationale: 本文は指導者に限定していないため、一般的な集団名としてそのまま訳した。
- source_word: ἀποστόλοις
  choice: 使徒たち
  rationale: 使徒言行録で定着した語であり、この箇所ではパウロとバルナバを指す物語上の呼称を保持した。
theological_decisions:
- issue: 「使徒たち」が指す者
  choice: パウロとバルナバに対する物語上の呼称として「使徒たち」を保持する
  alternative: より一般的に「遣わされた者たち」または「使者たち」と訳す
  rationale: 同じ章の14節でルカはバルナバとパウロを明確に「使徒たち」と呼んでいる。本文の語を直接訳し、使徒職について本文以上に狭い教理的定義を持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、叙述にふさわしい落ち着いた文体とした。「の側につき」を反復して、二陣営への分裂を明確に示した。
