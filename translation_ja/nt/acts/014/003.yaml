id: ACT.14.3
reference: Acts 14:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: ja
  text: そこで二人はかなり長い間そこにとどまり、主により頼んで大胆に語った。[a] 主は、ご自分の恵みのことばを証しし、二人の手を通してしるしと不思議な業が行われるようにしておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主にあって大胆に語った」、または「主を根拠として大胆に語った」とも訳せる。ギリシア語は、その大胆さが主に基づくこと、または主との関係の中で発揮されたことを表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: かなり長い間
  rationale: 相当な長さの期間を表す慣用句。過度に期間を限定せず、現代日本語として自然に訳した。
- source_word: διέτριψαν
  choice: そこにとどまり
  rationale: ある場所で時を過ごす、滞在するという文脈上の意味を明確にした。
- source_word: παρρησιαζόμενοι
  choice: 大胆に語った
  rationale: 恐れず、公然と語るという動詞の意味を、使徒言行録の宣教文脈に即して表した。
- source_word: ἐπὶ τῷ κυρίῳ
  choice: 主により頼んで
  rationale: ἐπί＋与格が示し得る根拠・依拠の意味を自然な日本語で表した。方向・奉仕を主に押し出す「主のために」より、原文の依拠性をよく保持する。別の理解は脚注に残した。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: κύριοςの称号をそのまま保ち、原文にない「イエス」を補わなかった。
- source_word: τῷ μαρτυροῦντι
  choice: 証しし
  rationale: 主が宣教の間、継続してそのことばを確証していたという証言・立証の含意を保った。
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: ご自分の恵みのことば
  rationale: 属格構文を保ち、神の恵みに関する、また恵みに特徴づけられた宣教のことばという含みを残した。
- source_word: διδόντι
  choice: 行われるようにしておられた
  rationale: 主がしるしと不思議な業の生起を授け、可能にしていたことを自然な日本語で示した。
- source_word: σημεῖα καὶ τέρατα
  choice: しるしと不思議な業
  rationale: 定型的な聖書表現の二要素を保ちつつ、「不思議」だけで対象が曖昧にならないよう「業」を補った。
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: 二人の手を通して
  rationale: 二人が手段として用いられたことを示す具体的な原文表現を保持した。
theological_decisions:
- issue: 「主」の指示対象
  choice: 原文どおり「主」とし、固有名を補わない
  alternative: 「主イエス」または「神」
  rationale: 文脈上は復活したイエスを指す可能性が高いが、ギリシア語本文はκύριοςのみであり、訳文で指示対象を原文以上に限定しない。
- issue: ἐπὶ τῷ κυρίῳ の意味
  choice: 「主により頼んで」
  alternative: 「主にあって」または「主のために」
  rationale: この句は根拠・依拠・領域などを表し得る。「より頼んで」は依拠の意味を明瞭にしつつ、別の可能性を脚注で保持した。
- issue: 主が恵みのことばを証しする方法
  choice: しるしと不思議な業を行わせることを、主の継続的な証しとして表す
  alternative: 二つの独立した主の行為として弱く結びつける
  rationale: 二つの現在分詞は同じ「主」に係り、奇跡の付与が恵みのことばへの神的な確証となっている構文関係を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御言葉」のような教会内に限定されやすい語形を避けて「ことば」とし、「しるしと不思議な業」は聖書的な連語を保った。主語の切り替わりを明確にするため二文に分け、「二人」を補って代名詞の指示を明瞭にした。
