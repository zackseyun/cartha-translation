id: ACT.14.17
reference: Acts 14:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: ja
  text: それでも神は、ご自分についての証しがないままにはされませんでした[a]。すなわち、善いことを行い、天からあなたがたに雨を降らせ、実りの季節[b]を与え、食物と喜びであなたがたの心を満たしてくださったのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ご自分についての証言がないままにはされませんでした」。ギリシア語は、神がご自分がどのような方かを示す証しを欠かされなかったことを表しています。
    reason: lexical_alternative
  - marker: b
    text: 直訳「実を結ぶ季節」。
    reason: lexical_alternative
  - marker: c
    text: 写本によっては「私たちの心」。SBLGNT本文は「あなたがたの心」としています。
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: それでも
  rationale: 前節の「諸国民がそれぞれ自分の道を歩むままにされた」という内容を受ける譲歩の力を、自然な現代日本語で示す。
- source_word: ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: ご自分についての証しがないままにはされませんでした
  rationale: 「証しのない」と再帰代名詞の関係を明示し、神がご自分について証しを残されたという意味を保つ。「証拠」と限定せず、証言・証しの含みを残した。
- source_word: ἀγαθουργῶν
  choice: 善いことを行い
  rationale: 神の具体的な恵み深い働きを表す現在分詞を、簡潔かつ尊厳ある表現で訳した。後続の分詞群がその内容を説明する構造も保った。
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: 天からあなたがたに雨を降らせ
  rationale: οὐρανόθενの神を指し示す聖書的表現として「天から」を採用。複数形ὑετούςは日本語では集合的な「雨」が自然であり、δίδωμιは文脈上「雨を降らせる」と表現した。
- source_word: καιροὺς καρποφόρους
  choice: 実りの季節
  rationale: καιρόςの季節・時期という意味と、καρποφόροςの実を結ぶ性質を、農耕的背景が伝わる自然な日本語で表した。
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: 食物と喜びであなたがたの心を満たしてくださった
  rationale: 「心を満たす」という原文の比喩を維持し、τροφῆςとεὐφροσύνηςをそれぞれ「食物」「喜び」とした。尊敬補助動詞により、語り手が神の恵みを述べる自然な日本語にした。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: SBLGNT本文の二人称複数をそのまま反映した。異読の一人称複数は脚注で示す。
theological_decisions:
- issue: 自然と摂理における神の自己証言
  choice: 雨、実り、食物、喜びという善い働きを、神がご自分について与えた証しとして訳す
  alternative: これらを神学的意味を伴わない自然現象としてのみ表現する
  rationale: 再帰代名詞αὑτόνとἀμάρτυρον、および神の行為を述べる分詞群は、摂理的な恵みが神ご自身についての証しであることを示す。節が述べる範囲を越えて体系化はしない。
- issue: 「心を満たす」の対象
  choice: SBLGNTに従い「あなたがたの心」
  alternative: 異読に従い「私たちの心」
  rationale: 採用本文のὑμῶνを本文に反映し、ὑμῶνとἡμῶνの本文異同は脚注で明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神の恵みを語る箇所にふさわしい品位を保った。「証し」「天から」「心を満たす」という原文の主要な比喩と聖書的語感を維持し、分詞の連鎖は日本語で理解しやすい説明構造に整えた。
