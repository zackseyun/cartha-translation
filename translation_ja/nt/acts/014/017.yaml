  source_fidelity: 本文はSBLGNTの語順・構文関係を自然な日本語で十分に反映している。「それでも」はκαίτοιの譲歩、「ご自分についての証しがないままにはされませんでした」はοὐκ ἀμάρτυρον ἑαυτὸν ἀφῆκενの再帰的な意味を保つ。善を行うこと、天からの雨、実りをもたらす季節、食物と喜びで心を満たすことという分詞連鎖も正確である。本文の二人称複数「あなたがたの心」と、異読の一人称複数を扱う脚注も適切である。
