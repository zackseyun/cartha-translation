- from: ところが、異邦人とユダヤ人が、その指導者たちと一緒になって、二人をひどい目に遭わせ、石で打とうと動き出したとき、[a]
  to: そのとき、異邦人とユダヤ人が、彼らの指導者たちとともに、二人を虐待し、石で打とうとする企てが起こったとき、[a]
