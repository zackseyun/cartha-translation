  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: ja
  text: そのとき、異邦人とユダヤ人が、彼らの指導者たちとともに、二人を虐待し、石で打とうとする企てが起こったとき、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「企て」は「襲撃の動き」または「突進」とも訳せる。ギリシア語のὁρμήは、激しい動きや襲撃を表すことがある。ここでは、続く「虐待すること」と「石で打つこと」が意図された行為として示されているため、「企て」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: ところが、…動き出したとき
  rationale: ὡςの時間的意味とδέの緩やかな展開・対照を自然な日本語で示し、ἐγένετοをὁρμήと一体の出来事として表した。
- source_word: ὁρμὴ
  choice: 動き出した
  rationale: 敵対者たちの激しい動きの開始を表しつつ、後続の不定詞が示す行為をこの時点ですでに完遂したとはしない。『企てた』よりも、ὁρμήが持ち得る実際の突進・襲撃の含みを残す。
- source_word: τῶν ἐθνῶν τε καὶ Ἰουδαίων
  choice: 異邦人とユダヤ人が
  rationale: ἔθνηはユダヤ人との対比から『異邦人』とし、τε καίによる双方の関与を並列で明確にした。
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: その指導者たちと一緒になって
  rationale: ἄρχοντεςの権威ある立場を平易に表し、σύνによる共同関与を示した。『その』が異邦人とユダヤ人双方にどう配分されるかは限定しない。
- source_word: ὑβρίσαι
  choice: ひどい目に遭わせ
  rationale: 侮辱だけに限定せず、傲慢で暴力的な虐待を含み得る広い意味を、現代日本語として自然に表した。
- source_word: καὶ λιθοβολῆσαι
  choice: 石で打とうと
  rationale: 投石による攻撃を明示しつつ、『殺そうと』を加えず、本文が結果を明記していない点を保持した。
- source_word: αὐτούς
  choice: 二人を
  rationale: 直前の文脈におけるパウロとバルナバを指すことを、日本語で曖昧にならないよう明示した。
