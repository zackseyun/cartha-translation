  source_fidelity: 本文は敵対行為が未完了である点と、異邦人・ユダヤ人および彼らの指導者たちの共同関与を概ね捉えている。ただし「動き出した」は主語となる人々の行動開始を強く前景化し、ὁρμή（敵対的な企て・襲撃の動き）が「起こった」という構文上の中心をやや見えにくくする。
  naturalness: 「二人をひどい目に遭わせ、石で打とうと動き出した」は理解可能だが、目的語を伴う連用形と「動き出す」の結び付きが少しぎこちない。「～し、～しようとする企てが起こった」とすると、現代標準日本語として明瞭で、原文の構文にも近い。
  terminology: 「異邦人」「ユダヤ人」は文脈に適合する。「指導者たち」はἄρχοντεςの平易な訳として許容できる。「虐待する」はὑβρίσαιの侮辱的・暴力的な虐待を含み得る幅を保ち、「石で打つ」は死に至る結果を本文以上に補わない。
  issues:
