    rationale: ἐγένετο ὁρμήは、敵対者たちが単に動き始めたというより、虐待と投石を目的とする敵対的な動き／企てが起こったことを述べる。日本語でも「企てが起こった」とするほうが、後続不定詞との関係を明確にし、行為の未完了性を保てる。
  - severity: low
    issue: 冒頭の「ところが」はδέの対照をやや強く表す。
    rationale: δέはここで次の展開を導く穏やかな接続であり、「そのとき」または無標の接続のほうが過度な逆接を避けられる。
