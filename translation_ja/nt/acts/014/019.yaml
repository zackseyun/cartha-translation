  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: ja
  text: ところが、アンティオキアとイコニオンからユダヤ人たちがやって来て、群衆を説き伏せた。そしてパウロを石打ちにし、死んだものと思って[a]、町の外へ引きずり出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼が死んでしまったと思って」。ギリシア語が明示しているのは彼らの判断であり、パウロが実際に死んだかどうかではない。
    reason: 「死んだものと思って」が攻撃者たちの推測を表し、実際の死亡を断定しないことを明確にするため。
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: ところが、……やって来て
  rationale: δέが示す、それまでの展開からの逆転を「ところが」で表し、ἐπέρχομαιは敵対者が他都市から到来したという文脈に即して自然な「やって来て」とした。
- source_word: ἀπὸ Ἀντιοχείας καὶ Ἰκονίου
  choice: アンティオキアとイコニオンから
  rationale: 二都市を出発地として明確に示す。固有名詞は現代日本語の聖書で通用する音写を用いた。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: ここではユダヤ地方の住民に限定されず、ユダヤ人である反対者たちを指す。「たち」により、この節の特定の一団であることを自然に表した。
- source_word: πείσαντες τοὺς ὄχλους
  choice: 群衆を説き伏せた
  rationale: πείθωはここで群衆を自分たちの側へ動かす働きかけを表す。「説得した」よりも、反対者が群衆を取り込んだ文脈を自然に伝える「説き伏せた」を選んだ。複数形ὄχλουςは日本語では集合的な「群衆」が自然である。
- source_word: λιθάσαντες τὸν Παῦλον
  choice: パウロを石打ちにし
  rationale: λιθάζωの暴力的行為を簡潔かつ慣用的に表す。分詞の行為が引きずり出すことに先立つ流れも保持した。
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: 町の外へ引きずり出した
  rationale: σύρωの強制的で暴力的な動作を「引きずり出した」で表し、移動の到達点を「町の外へ」と明示した。未完了形は物語上の自然さを優先して単純過去で訳した。
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: 死んだものと思って
  rationale: νομίζωが攻撃者側の判断・推測を示すことを保持する。完了不定詞τεθνηκέναιは死の結果状態を含むが、日本語では「死んだものと思って」が自然であり、実際に死亡したとの断定を避けられる。
theological_decisions:
- issue: パウロが実際に死亡したと本文が述べているか、それとも攻撃者たちが死亡したと思っただけか
  choice: 本文は攻撃者たちの認識として「死んだものと思って」と訳す。
  alternative: パウロが実際に死に、その後生き返ったと読む解釈もある。
  rationale: ギリシア語はνομίζοντεςによって彼らの判断を報告しており、パウロの実際の死亡を直接叙述してはいない。そのため、本文以上の神学的結論を訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、暴力的な出来事を婉曲化せず、同時に原文が残す事実認定の余地を保った。「町」「群衆」「引きずり出した」など一般読者に分かりやすい語を選び、全体は聖書本文にふさわしい簡潔で品位ある叙述とした。
