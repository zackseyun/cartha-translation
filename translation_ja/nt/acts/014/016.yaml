  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: ja
  text: 過ぎ去った世代には、神はすべての国々が自分たちの道を歩むのを許しておられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての異邦人が自分たちの道を進むのを許しておられた」。
    reason: ἔθνηは文脈によって「異邦人」とも訳せ、πορεύεσθαιは「進む」、εἴασενは「許す」とも表現できるため。
lexical_decisions:
- source_word: ὃς
  choice: 神は
  rationale: 関係代名詞の指示対象は前節の「生ける神」。日本語では文脈上の主語を明示して新しい文として自然につなげた。
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: 過ぎ去った時代には
  rationale: γενεαίは「世代」も意味するが、ここでは過去の歴史的期間を広く指す。「過ぎ去った時代」はπαρῳχημέναιςの完了的なニュアンスを保ちつつ自然である。
- source_word: εἴασεν
  choice: ままにしておかれた
  rationale: 許容を表し、神がその道を是認したという含意を避ける。尊敬表現により神を主語とする日本語として整えた。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々
  rationale: ἔθνηの民族・諸国民という集合的範囲を保つ。「異邦人」は可能だが、この句単独ではユダヤ人との対比を前面に出しすぎる。
- source_word: πορεύεσθαι ταῖς ὁδοῖς αὐτῶν
  choice: それぞれ自分の道を歩む
  rationale: 道を歩むという比喩を保持し、生き方や行動の方向を表す。複数の諸国民に対応して「それぞれ」を補い、αὐτῶνの帰属を自然に示した。
theological_decisions:
- issue: 神の許容と是認の区別
  choice: 「ままにしておかれた」として、神の許容・不介入を表す
  alternative: 「認められた」または「そうさせた」として、是認や積極的な決定を強く示す
  rationale: εἴασενは許すことを意味する。諸国民の道への道徳的是認や、神による因果的決定まで本文に読み込まず、神の主権と人間の責任の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神を主語とする箇所には自然な敬語を用いた。「自分の道を歩む」という聖書的比喩を保ち、過度な解釈語への置換を避けた。
