  naturalness: 明瞭な現代標準日本語であり、叙述として自然である。「イコニオンでは」で場面を提示し、「二人は一緒に…入り」と続ける流れも滑らかである。「そのように」は原文のοὕτωςが具体化しない語り方を保っている。
  terminology: 「会堂」「ユダヤ人」「ギリシア人」「信じた」はいずれも適切で、神学的・解釈的な補足を加えていない。「ギリシア人」はἝλληνεςを「異邦人」と広く解釈せずに訳す点でも適切である。脚注はτῶν Ἰουδαίωνの属格表現に関する有用な訳語上の選択肢を示し、本文の意味を変更しない。
