id: ACT.14.1
reference: Acts 14:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: ja
  text: イコニオンでは、二人は一緒にユダヤ人の会堂[a]に入り、そのように語ったので、ユダヤ人もギリシア人も大勢が信じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ教の会堂」。ギリシア語は直訳すると「ユダヤ人たちの会堂」。
    reason: 属格表現「ユダヤ人たちの」を、所属を表す「ユダヤ人の」と取るか、性格を表す「ユダヤ教の」と取るかという訳語上の選択肢を示すため。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （独立した語句としては訳出せず）
  rationale: 物事の発生そのものを強調するより、物語を進める構文である。日本語では「イコニオンでは」という場面提示によって自然に転換を表し、原文にない明示的な「さて」「その時」を加えない。
- source_word: ἐν Ἰκονίῳ
  choice: イコニオンでは
  rationale: 場所を示す句。日本語では主題化して新しい場面を自然に提示した。地名は慣用的に音写した。
- source_word: κατὰ τὸ αὐτό
  choice: 一緒に
  rationale: ここではパウロとバルナバが共同で行動したことを表すと解するのが自然である。「同じように」より文脈に適合する。
- source_word: εἰσελθεῖν αὐτοὺς
  choice: 二人は……入り
  rationale: ἐγένετο に従属する不定詞構文を自然な日本語の定形節にした。代名詞の指示対象が明瞭になるよう「二人」とした。
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: ユダヤ人の会堂
  rationale: 属格 τῶν Ἰουδαίων を明示しつつ、日本語として通じる形にした。「ユダヤ教の会堂」も意味上可能なので脚注に示した。
- source_word: λαλῆσαι
  choice: 語った
  rationale: 使徒たちがそこで語り、宣べ伝えたことを示す。目的語を補わず、原文の簡潔さを保った。
- source_word: οὕτως ὥστε
  choice: そのように語ったので
  rationale: 語り方と、その結果として人々が信じたこととの結び付きを保つ。「そのように」は原文同様、具体的な方法を説明し切らない。
- source_word: πιστεῦσαι
  choice: 信じた
  rationale: πίστ- 語群の基本的な意味をそのまま表し、「何を信じたか」を本文に補わない。
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: ユダヤ人もギリシア人も
  rationale: τε καὶ による両集団の並列を自然な日本語で明示した。Ἕλληνες を解釈的に「異邦人」とせず、「ギリシア人」とした。
- source_word: πολὺ πλῆθος
  choice: 大勢
  rationale: 非常に多くの人々が信じたという数量的強調を、現代日本語で自然かつ簡潔に表した。
theological_decisions:
- issue: 回心の記事における πιστεῦσαι の意味
  choice: 信じた
  alternative: 信仰に入った／その知らせを信じた
  rationale: ここでは使徒たちの宣教に対する応答を述べるが、目的語は明記されていない。そのため、「知らせ」を補ったり回心過程を詳述したりせず、動詞の基本的な意味と原文の余白を保った。
- issue: Ἕλληνες が指す集団
  choice: ギリシア人
  alternative: 異邦人
  rationale: 文脈上、非ユダヤ人を指す可能性はあるが、語そのものは Ἕλληνες である。民族的・宗教的範囲を訳文で確定せず、原語に近い表現を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔で dignified な調子を保った。「二人」は直前の文脈にいるパウロとバルナバを指す。原文の結果構文と曖昧さを保ちながら、過度に逐語的な語順は避けた。
