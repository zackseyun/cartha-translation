  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: ja
  text: 二人はそのことに気づき[a]、リカオニアの町々、すなわちリステラとデルベ、そしてその周辺の地方へ逃れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのことを悟り」「それを察知し」。ギリシア語の分詞は、前節に述べられた危険に気づいたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: そのことに気づき
  rationale: アオリスト分詞は、前節に述べられた危険な企てを察知したことを表す。目的語は文脈から補い、「そのことに気づき」とすることで自然な日本語にした。
- source_word: κατέφυγον
  choice: 逃れた
  rationale: 危険を避けて安全な場所へ急いで移ったことを表す。「避難した」より直接的で、逃走と避難先への移動の両面を保つ。
- source_word: εἰς
  choice: へ
  rationale: 移動の目的地を示すため、日本語では「へ」が自然である。
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: リカオニアの町々
  rationale: 属格の地域的関係を保ちつつ、複数形を「町々」で明示した。
- source_word: Λύστραν καὶ Δέρβην
  choice: リステラとデルベ
  rationale: 地名の標準的な日本語音写を用い、直前の「町々」の同格説明として示した。
- source_word: τὴν περίχωρον
  choice: その周辺の地方
  rationale: 名詞的に用いられた περίχωρος を、二つの町を取り巻く広い地域として自然に表した。
- source_word: καὶ ... καὶ
  choice: すなわちリステラとデルベ、そして
  rationale: 最初の連結部分が町々の具体名を示し、次の καί が周辺地域を追加する構造を、現代日本語で明確にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述体。「二人」は直前の文脈にいるパウロとバルナバを受ける。「しかし」は、原文の分詞構文が前節との対照的な展開を担うことを日本語で自然に示すため補った。
