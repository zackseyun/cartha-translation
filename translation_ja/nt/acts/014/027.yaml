id: ACT.14.27
reference: Acts 14:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: ja
  text: 二人は到着すると、教会の人々を集め、神が彼らと共になさったこと[a]をすべて、また、異邦人に信仰の門を開いてくださったことを報告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神が彼らを通してなさったこと」とも訳せる。ギリシア語では、より直訳的には「神が彼らと共になさったこと」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: 到着すると
  rationale: アオリスト分詞が主動詞に先立つ出来事を示すため、自然な現代日本語で時間的関係を表した。
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: 教会の人々を集め
  rationale: ἐκκλησίαは当地のキリスト者共同体を指す。「教会を集め」よりも、建物ではなく人々の集まりであることが明瞭になる表現を選んだ。
- source_word: ἀνήγγελλον
  choice: 報告した
  rationale: 宣教旅行で起きたことを共同体に詳しく伝える文脈に適する。未完了過去の継続的な語りは、日本語では文脈上自然な単純過去で表した。
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: 神が彼らと共になさった
  rationale: μετάの基本的な連合の意味「共に」を保ち、神が彼らを通して行ったと道具的意味に限定しなかった。敬意を示すため「なさった」とした。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人に
  rationale: 使徒言行録の文脈では、地政学的な諸国民よりも非ユダヤ人を指すため、「異邦人」が適切である。
- source_word: θύραν πίστεως
  choice: 信仰の門
  rationale: 原文の比喩と属格表現を保ち、信仰へ至る機会または入口という含みを不用意に一つへ限定しない。
- source_word: ἤνοιξεν
  choice: 開いてくださった
  rationale: 神を主語とする完了した行為を自然な日本語で表し、恩恵的な行為への敬意を「くださった」で示した。
theological_decisions:
- issue: μετ’ αὐτῶνが示す神と使徒たちの働きの関係
  choice: 神が彼らと共になさった
  alternative: 神が彼らを通してなさった／神が彼らの間でなさった
  rationale: 原文の「共に」という連合的表現を維持し、使徒たちを神の働きの道具と明示する解釈にも、彼らの周囲での出来事に限定する解釈にも決めなかった。
- issue: ἔθνεσινの指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: この物語ではユダヤ人との対比における非ユダヤ人の包含が中心であり、「異邦人」がその意味を明確に伝える。
- issue: θύραν πίστεωςの属格の意味
  choice: 信仰の門
  alternative: 信仰へ至る門／信仰のための門
  rationale: 属格が持ちうる関係を説明的に一つへ固定せず、原文の比喩と神学的な広がりを保った。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも適する品位ある文体とした。「二人」は直前の文脈にいるパウロとバルナバを受ける。「教会の人々」により、建物ではなく集められた共同体を示した。脚注標識は該当節の末尾に置き、本文中に明示した。
