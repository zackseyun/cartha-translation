  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: ja
  text: 大声で言った。「自分の足でまっすぐ立ちなさい。」すると、その人は跳び上がり、歩き始めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すると、その人は跳び上がって、歩いていた。」最後の動詞は未完了過去形で、歩く動作の継続、またはその開始を表している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: 大声で
  rationale: 様態を表す与格句を、明瞭で自然な現代日本語にした。公に響く力強い発声も保っている。
- source_word: Ἀνάστηθι
  choice: 立ちなさい
  rationale: 足を使えなかった人に、立った姿勢を取るよう命じる文脈に最も直接的である。「起きなさい」よりも続く姿勢の表現とよく合う。
- source_word: ἐπὶ τοὺς πόδας σου
  choice: 自分の足で
  rationale: 字義的な「あなたの足の上に」は日本語では不自然なため、自力で両足に立つことを自然に示す表現とした。
- source_word: ὀρθός
  choice: まっすぐ
  rationale: 直立した姿勢を表し、「立ちなさい」を自然に修飾する現代日本語である。
- source_word: ἥλατο
  choice: 跳び上がり
  rationale: 突然の跳躍を表す動詞の鮮明さを保ち、癒やしへの即時の反応を過度な説明なしに描く。
- source_word: περιεπάτει
  choice: 歩き始めた
  rationale: 未完了過去が文脈上表しうる動作の開始と継続を、自然な物語文として表した。ただし「歩いていた」という継続的な理解も可能なので脚注に示した。
theological_decisions:
- issue: 奇跡の描写と姿勢への命令
  choice: 身体的な命令と即座の反応を、そのまま具体的に訳す。
  alternative: 癒やしの性質や神学的意味を訳文中で説明する。
  rationale: ギリシア語本文は命令、その人の跳躍、歩行を直接叙述している。本文にない教理的説明を加えず、奇跡の具体性を保つ。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で dignified な物語調。「まっすぐ自分の足で立ちなさい」は原文の命令と直立姿勢を保ち、「跳び上がり」で動作の鮮明さを伝える。
