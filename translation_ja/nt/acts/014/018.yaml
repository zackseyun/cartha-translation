  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: ja
  text: こう言っても、二人は群衆が自分たちにいけにえを献げるのを、かろうじてやめさせることができた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: こう言っても
  rationale: καί は文脈上、譲歩・強調の含みを帯び、「これらのことを言いながら」よりも「こう言っても」が自然で、説得の困難さを表す。
- source_word: μόλις
  choice: かろうじて…ことができた
  rationale: 「やっとのことで」「辛うじて」という意味を、現代日本語で明瞭に伝える。
- source_word: κατέπαυσαν
  choice: やめさせることができた
  rationale: 使役的な「制止した／やめさせた」を表し、μόλις と組み合わせて困難の末に実現したことを示す。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: 複数形だが、集合的な人々を指す自然な日本語として「群衆」とした。
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: 自分たちにいけにえを献げるのを
  rationale: 否定を伴う属格不定詞は κατέπαυσαν の内容を示し、群衆が二人に犠牲を献げる行為をやめさせたという意味。αὐτοῖς はパウロとバルナバを指すため「自分たちに」とした。
theological_decisions:
- issue: 群衆が献げようとした対象
  choice: 自分たちに
  alternative: 彼らに／二人に
  rationale: αὐτοῖς の指示対象がパウロとバルナバであることを自然に示しつつ、二人が語り手ではない日本語文でも誤読されにくい。二人が礼拝を拒んだという本文の趣旨を保つ。
translation_notes:
  register: 明快で現代的かつ品位ある叙述。「いけにえ」は一般読者に通じやすいよう平仮名表記とし、原文の簡潔さを保った。
