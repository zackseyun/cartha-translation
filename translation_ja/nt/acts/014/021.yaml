  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: ja
  text: そして、その町で福音を伝え、多くの人を弟子にした後、彼らはリステラ、イコニオン、アンティオキアへ戻った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: 福音を告げ
  rationale: εὐαγγελίζωの「良い知らせを伝える」という意味を、現代日本語で簡潔かつ自然に表す。「福音」は本文の宣教的文脈を保ち、「宣べ伝える」より一般読者にも理解しやすい。アオリスト分詞の主動詞に先立つ働きは、後続の「してから」で表した。
- source_word: τε
  choice: そして
  rationale: 前の文脈と分詞句を軽く結ぶ接続機能を、自然な物語の流れとして示した。
- source_word: τὴν πόλιν ἐκείνην
  choice: その町で
  rationale: 文脈上デルベを指す指示表現。「町」はπόλιςの自然な訳であり、日本語では宣教が行われた場所として「で」を用いるのが明瞭。
- source_word: μαθητεύσαντες
  choice: 多くの人を弟子にして
  rationale: μαθητεύωの使役的な意味、すなわち人々を弟子とすることを直接表す。単に教えたという意味には狭めない。
- source_word: ἱκανοὺς
  choice: 多くの人
  rationale: ここでは人数が相当数に上ったことを表すため、簡潔で自然な「多くの人」とした。
- source_word: ὑπέστρεψαν
  choice: 彼らは…引き返した
  rationale: 旅程を逆にたどって戻ったことを表す。「引き返した」は、直前までの宣教地から既訪の町々へ戻る動きを明瞭にする。ギリシア語の三人称複数を「彼らは」で示した。
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: リステラ、イコニオン、アンティオキアへと
  rationale: 各地が帰路の目的地であることを「へと」で自然に示し、列挙された旅程の順序を保持した。日本語では格助詞の反復を避けても三つの目的地は明瞭である。
