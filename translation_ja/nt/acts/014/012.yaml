id: ACT.14.12
reference: Acts 14:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: ja
  text: 人々は、バルナバをゼウス、パウロをヘルメスと呼んでいた[a]。パウロが主な話し手だったからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語本文は「ゼウス」「ヘルメス」。古い訳の中には、対応するローマ神話の名「ユピテル」「メルクリウス」を用いるものもある。
    reason: alternative_reading
  - marker: b
    text: 直訳すると「話において先頭に立つ者だった」。「主たる話し手だった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: 呼んでいた
  rationale: 未完了過去の継続的な様相を自然な日本語で表し、人々がそのように呼んでいた状況を示す。
- source_word: τε
  choice: （無訳）
  rationale: 前節との緩やかな接続を表す小辞だが、日本語では文脈上明らかであり、訳出しないほうが自然である。
- source_word: Δία
  choice: ゼウス
  rationale: ギリシア語本文にある神名をそのまま用い、ローマ神話の対応名「ユピテル」に置き換えない。
- source_word: Ἑρμῆν
  choice: ヘルメス
  rationale: ギリシア語本文にある神名をそのまま用い、ローマ神話の対応名「メルクリウス」に置き換えない。
- source_word: ἐπειδὴ
  choice: からである
  rationale: 人々がパウロをヘルメスと呼んだ理由を明確に示す因果表現である。
- source_word: αὐτὸς
  choice: パウロが
  rationale: 直前のパウロを指す強調的な代名詞を、日本語では名を明示することで曖昧さなく表す。
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: 話を主導していた
  rationale: 直訳的には「話の先頭に立つ者」。パウロが主要な話し手であったことを、役職名に狭めず自然に表現する。
theological_decisions:
- issue: 異教の神々の名の訳し方
  choice: ゼウス、ヘルメス
  alternative: ユピテル、メルクリウス
  rationale: 本文が用いるギリシア神名を優先し、後代のラテン語訳・翻訳伝統に由来するローマ神名を本文へ持ち込まない。
- issue: ὁ ἡγούμενος τοῦ λόγου の意味
  choice: 話を主導していた
  alternative: 主たる話し手だった／代弁者だった
  rationale: パウロが発言の中心だったことを示しつつ、「代弁者」という固定的な役割や神学的含意を不必要に加えない。
translation_notes:
  register: 明快で現代的な標準語を用いた。「呼んでいた」で未完了過去を表し、後半は理由を自然に際立たせるため独立した文とした。神名は一般的な日本語表記を採用し、説明は脚注に置いた。
