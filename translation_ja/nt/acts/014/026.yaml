source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: ja
  text: そこから二人は船でアンティオキアへ向かった。そこは、二人が成し遂げた[b]働きのために、神の恵みに委ねられていた[a]場所であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の恵みに託されていた」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「完遂した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: そこから
  rationale: 接続と出発地点の両方を、自然な日本語で簡潔に表した。
- source_word: ἀπέπλευσαν
  choice: 船で……戻った
  rationale: 海路で出発したことを示す動詞の意味を「船で」に保ち、文脈上、派遣元アンティオキアへの帰還であることを自然に表した。
- source_word: εἰς Ἀντιόχειαν
  choice: アンティオキアへ
  rationale: 移動の到着先を示す εἰς を「へ」で表し、地名は慣用的に音写した。
- source_word: ὅθεν
  choice: そこは……所であった
  rationale: アンティオキアが以前の委託の場所であったことを明示しつつ、「そこから」という起点の含意を文脈に残した。
- source_word: ἦσαν παραδεδομένοι
  choice: 委ねられた
  rationale: 神の恵みのもとに託されたという受動の意味を保ち、特定の教会制度を示唆する語を避けた。「所であった」により、旅立ちに先立つ出来事であることを表した。
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: 神の恵みに
  rationale: 与格の関係を「に」で直接表し、神の恵みという神学的表現を簡略化せず保持した。
- source_word: εἰς τὸ ἔργον
  choice: その働きのために
  rationale: 目的を示す εἰς を「ために」で表し、ἔργον は宣教などと限定せず、広い意味を保つ「働き」とした。
- source_word: ὃ ἐπλήρωσαν
  choice: 二人が成し遂げた
  rationale: その働きを完遂したという πληρόω の意味を表し、関係代名詞の結び付きを自然な連体修飾にした。
theological_decisions:
- issue: アンティオキアで二人に対して行われた以前の行為の性質
  choice: 神の恵みに委ねられた
  alternative: 神の恵みに託された／推薦された
  rationale: 本文は二人が神の恵みのもとに引き渡され、託されたことを述べる。「委ねられた」は神の恵みへの依存を示しつつ、特定教派の任命・派遣制度を読み込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。パウロとバルナバを指す主語は、日本語として自然な「二人」とした。原文の長い一文は二文に分けたが、アンティオキアが委託の起点であり、働きが成し遂げられたという論理関係を保持した。
