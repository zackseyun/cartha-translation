  text: And they stayed with the disciples for no little time[a].
translation:
  language: ja
  text: そして二人は、弟子たちと共に少なからぬ間を過ごした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より平易には「かなり長い間」または「かなりの間」。ギリシア語は「少なくない時間」という緩叙法を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: 過ごした
  rationale: 未完了過去形は、ある場所で時を過ごし続けたことを表す。「過ごした」は日本語として自然で、継続的な滞在の意味も文脈上伝わる。
- source_word: δὲ
  choice: そして
  rationale: 弱い接続を表し、物語の自然な継続として訳した。
- source_word: χρόνον οὐκ ὀλίγον
  choice: 少なからぬ時
  rationale: 「少なくない時」という緩叙法を保ちつつ、格調ある現代日本語とした。より平易には「かなり長い間」と訳せる。
- source_word: σὺν τοῖς μαθηταῖς
  choice: 弟子たちと共に
  rationale: σύν＋与格の基本的な意味「〜と共に」をそのまま表す。文脈上、現地の信者たちを指す。
