    rationale: ἐνέγκαςは単に運ぶ／持って行くことを表すため、「運び」とするほうが中立的である。
  - severity: low
    issue: 「すると」は前節からの強い結果・転換をやや示唆する。
    rationale: ὅ τεは主として物語の継続であり、「そして」がより直接的である。
