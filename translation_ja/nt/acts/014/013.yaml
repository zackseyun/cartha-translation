- from: すると、町の外に神殿があるゼウスの祭司は、雄牛と花輪[a]を門のところへ運んで来て、群衆と一緒にいけにえを献げようとした。[b]
  to: そして、町の外に神殿があるゼウス[b]の祭司は、雄牛と花輪[a]を門のところへ運び、群衆と一緒にいけにえを献げようとした。
  rationale: 脚注bを原文の修飾関係に合わせて訂正し、「町の前」の位置関係を「町の外」と断定しすぎないようにした。本文の文脈的補いは維持しつつ、接続表現と移動表現をより中立的で自然なものに改めた。
