  naturalness: 「そして」はὅ τεの単純な物語継続を自然に表す。「運び」は、話者の位置へ「運んで来た」とする不必要な直示的含意を避け、現代標準日本語として滑らかである。
  terminology: 「ゼウス」「祭司」「雄牛」「花輪」「いけにえを献げる」は、この異教祭儀の文脈を過不足なく表す。「飾り輪」はστέμματαの有効な代案である。
