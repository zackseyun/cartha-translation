  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: ja
  text: そして、町の外に神殿があるゼウス[b]の祭司は、雄牛と花輪[a]を門のところへ運び、群衆と一緒にいけにえを献げようとした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「飾り輪」とも訳せる。祭儀に用いる花輪や飾りを指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「町の前にいるゼウス」。この表現はゼウスを修飾する。町の前方、あるいは町の外にあったゼウスの神殿または聖所によってゼウスを呼んだ表現と理解されることが多い。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: すると
  rationale: 物語を継続しつつ、直前の出来事を受けた展開を自然な現代日本語で示す。
- source_word: ἱερεὺς τοῦ Διὸς
  choice: ゼウスの祭司
  rationale: 本文のギリシア神名 Ζεύς を保ち、ローマ名ユピテルには置き換えない。
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: 町の外に神殿がある
  rationale: 文法上はゼウスを修飾する表現だが、神殿ないし聖所の所在地によって神を示す言い方と理解される。日本語で意味が通るよう「神殿」を補った。
- source_word: ταύρους
  choice: 雄牛
  rationale: 犠牲として用いられる雄の牛を直接的に表す。
- source_word: στέμματα
  choice: 花輪
  rationale: 祭儀や行列に用いる輪・飾りを、一般読者に分かりやすく表す。
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: 門のところへ
  rationale: 移動を表す文脈に合わせて方向を示し、複数形の πυλῶνας は日本語で自然な集合的単数とした。
- source_word: ἐνέγκας
  choice: 運んで来て
  rationale: 雄牛と花輪を門へ持って来たという先行・背景動作を自然に表す。
- source_word: σὺν τοῖς ὄχλοις
  choice: 群衆と一緒に
  rationale: 祭司が集まった人々と共同して行おうとしたことを明確にする。ギリシア語の複数形は日本語では集合名詞「群衆」が自然。
- source_word: ἤθελεν θύειν
  choice: いけにえを献げようとした
  rationale: θέλω＋不定詞の意図を表し、θύω の祭儀的意味を明確にする。
theological_decisions:
- issue: τοῦ ὄντος πρὸ τῆς πόλεως の含意された指示対象
  choice: ゼウスの神殿が町の外にあるという意味を本文で明示した。
  alternative: 「町の前にいるゼウス」または「町の前のゼウス」と、原文の形をより直接に残す。
  rationale: 原文は直訳すれば「町の前にいるゼウス」だが、古代の用法と祭儀の文脈では、町の前方ないし外にあるゼウスの神殿・聖所を指す可能性が高い。曖昧さは脚注で保存する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いけにえを献げる」は祭儀的文脈を明確にし、「群衆」は原文の複数形を日本語として自然にまとめた。すべての脚注記号を本文に配置した。
