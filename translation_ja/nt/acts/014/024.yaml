lexical_decisions:
- source_word: καὶ
  choice: こうして
  rationale: 直前から続く旅程を自然な現代日本語で結ぶ。単なる並列の「そして」も可能だが、ここでは物語の進行を表す。
- source_word: διελθόντες
  choice: 通り
  rationale: アオリスト能動分詞で、主動詞ἦλθονに先立つ移動を表す。日本語では連用形により、簡潔かつ自然に時間的な順序を示せる。
- source_word: τὴν Πισιδίαν
  choice: ピシディア
  rationale: 地域名を日本語で一般的な聖書地名表記に従って音写した。対格は移動経路を示す。
- source_word: ἦλθον
  choice: 来た
  rationale: ἔρχομαιの基本的な移動の意味を保つ。文脈上の主語はパウロとバルナバなので、日本語で明確にするため「二人は」と補った。
- source_word: εἰς τὴν Παμφυλίαν
  choice: パンフィリアに
  rationale: εἰςは目的地への移動を示す。日本語では地域への到着を「パンフィリアに来た」と表すのが自然であり、「中へ」という不自然な強調を避けた。
