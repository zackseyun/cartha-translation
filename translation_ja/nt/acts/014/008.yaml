id: ACT.14.8
reference: Acts 14:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: ja
  text: リストラには、足に力がなく、生まれつき足の不自由な、一度も歩いたことのない男が座っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: （独立した接続語としては訳出せず）
  rationale: 日本語では節冒頭の「そして」を置かなくても自然に前の叙述との連続が伝わるため、文脈上の接続機能を語順と叙述の継続によって表した。
- source_word: τις ἀνὴρ
  choice: 男が
  rationale: τις は不特定の人物を導入するが、現代日本語で「ある男」とするとやや文語的になるため、存在構文の「男が」で不特定性を自然に表した。
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: 足に力がなく
  rationale: ἀδύνατος の力・能力の欠如という語義を保ち、後続する χωλός と同一表現にまとめず、原文の重ねた描写を残した。
- source_word: ἐν Λύστροις
  choice: リストラには
  rationale: 地名を標準的に音写し、人物を場面に導入する自然な日本語として場所を主題化した。
- source_word: ἐκάθητο
  choice: 座っていた
  rationale: 未完了過去の継続的・場面設定的な意味を「ていた」で表した。
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: 生まれつき足の不自由な
  rationale: 直訳的な「母の胎から」よりも日本語で同じ先天性を明瞭に伝える慣用表現を採り、χωλός は現在の一般読者に中立的で分かりやすい「足の不自由な」とした。
- source_word: ὃς οὐδέποτε περιεπάτησεν
  choice: 一度も歩いたことのない
  rationale: οὐδέποτε の全面的否定と、その時までの生涯に歩いた経験がないことを自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。原文がまず足の力の欠如を述べ、次に歩行障害を明示する重層的描写を、日本語でも「足に力がなく」「足の不自由な」と分けて保持した。
