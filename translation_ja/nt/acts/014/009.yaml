  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: ja
  text: この人はパウロが語るのを聞いていた。パウロは彼をじっと見つめ、彼が癒やされる[a]ための信仰を持っているのを見て取ると、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「救われる」。ギリシア語の動詞は「救う」と「癒やす」のどちらの意味にもなり得るが、ここでは文脈上、身体の癒やしを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: この人
  rationale: 前節の、生まれつき足の不自由な男性を指す指示代名詞。指示対象を明確にしつつ、自然な日本語とした。
- source_word: ἤκουσεν
  choice: 聞いていた
  rationale: パウロが語る間、この人が耳を傾けていたという場面を自然に表す。未完了的な日本語表現は、同時進行する分詞 λαλοῦντος との関係にも適する。
- source_word: λαλοῦντος
  choice: 語る
  rationale: 公の宣教を含み得る場面にふさわしい、平明で品位のある表現。「話す」よりも文脈に適する。
- source_word: ἀτενίσας
  choice: じっと見つめ
  rationale: 注意を集中して凝視する動作を、現代日本語で自然に表した。
- source_word: ἰδὼν
  choice: 見て取ると
  rationale: 単なる視覚だけでなく、相手の内にある信仰を認めたという文脈上の知覚を表す。
- source_word: ἔχει πίστιν
  choice: 信仰がある
  rationale: πίστις を通常の意味で「信仰」とし、本人の忠実さではなく、神の助けを信じる応答として訳した。
- source_word: τοῦ σωθῆναι
  choice: 癒やされる
  rationale: σῴζω は「救う」と「治す／癒やす」の両義を持つが、歩けない人が直後に身体的に回復する文脈では「癒やされる」が直接的な意味である。広い意味は脚注に残した。
theological_decisions:
- issue: 癒やしの物語における σωθῆναι の意味
  choice: 身体的に「癒やされる」
  alternative: より広く「救われる」
  rationale: 直後に描かれるのは足の身体的回復であり、「癒やされる」が当面の指示内容に最もよく合う。ただし、原語が持つ救済の広い響きを排除しないよう脚注で示した。
- issue: 癒やしと信仰の関係
  choice: 原文どおり「癒やされる信仰がある」とし、信仰の程度や功績を補わない
  alternative: 「癒やされるだけの信仰がある」または「十分な信仰がある」
  rationale: 原文は πίστις の量や十分さを明示していないため、「だけの」「十分な」を加えて信仰を癒やしの功績や必要量のように表すことを避けた。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。長い関係節を二文に分けて日本語の係り受けを明確にした。次節へ続く構文であるため、末尾を「見て取ると、」として継続性を保った。
