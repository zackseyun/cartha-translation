id: ACT.14.2
reference: Acts 14:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: ja
  text: しかし、信じようとしなかったユダヤ人たちは、異邦人たちを扇動し、兄弟たちに対する彼らの思いを悪くした[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信じようとしなかった」は、「従わなかった」「不従順であった」とも訳せる。ここでは、告げられた福音を受け入れなかったことを指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「異邦人たちの魂を悪くした」。ここでの「魂」は、その人たちの内面の思いや態度を指す。
    reason: lexical_alternative
  - marker: c
    text: 「兄弟たち」は、男性だけでなく、女性を含む仲間の信者全体を指していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: 信じようとしなかった
  rationale: この伝道の文脈では、単なる一般的な不従順よりも、使徒たちの知らせを受け入れず信じることを拒む意味が前面に出る。意志的な拒否の含みも保つ。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 会堂を背景とする当地の反対者たちを指す。語そのものを直接訳しつつ、全ユダヤ人を一括して指すのではないことは文脈と脚注で明確にする。
- source_word: ἐπήγειραν
  choice: 扇動し
  rationale: 敵対的な感情や行動を引き起こす使役的な意味を、簡潔で自然な現代日本語で表す。
- source_word: ἐκάκωσαν
  choice: 悪意を抱くよう……仕向けた
  rationale: ψυχάςを目的語とし、κατά以下が敵対の相手を示すため、内面の態度を悪くし敵意へ向かわせる意味に取る。「害した」では日本語として対象との関係が不明瞭になる。
- source_word: τὰς ψυχὰς
  choice: その心
  rationale: ここでは人間の構成要素としての専門的な「魂」ではなく、内面の思いや態度を表すため、日本語では「心」が自然である。
- source_word: τῶν ἐθνῶν
  choice: 異邦人たち
  rationale: 使徒言行録に見られるユダヤ人との対照では、諸国民一般ではなく非ユダヤ人を指す。
- source_word: κατὰ τῶν ἀδελφῶν
  choice: 兄弟たちに対して
  rationale: 原文の男性複数形を保つ。「兄弟たち」は初期キリスト教共同体の仲間全体を指し得るため、その包括的意味を脚注で示す。
theological_decisions:
- issue: ἀπειθήσαντεςが不従順一般を表すか、福音を信じることの拒否を表すか
  choice: 信じようとしなかった
  alternative: 従わなかった／不従順であった
  rationale: 直前の14:1に多くの人が「信じた」とあるため、ここではその知らせを拒んだ者との対照が強い。ただし原語にある不従順の含みを脚注に残す。
- issue: ἀδελφῶνが男性だけを指すか、信者共同体全体を指すか
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性複数形を本文で保持しながら、この用法が女性を含む仲間の信者全体を指し得ることを脚注で明示する。
- issue: ἐκάκωσαν τὰς ψυχὰςを内面への働きかけとしてどう表すか
  choice: 悪意を抱くよう、その心を仕向けた
  alternative: 心を毒した／魂を害した
  rationale: 敵対心を生じさせる意味を明瞭にしつつ、「魂」を実体論的・専門的な意味に固定しない。「心を毒した」は鮮烈だが、日本語ではやや翻訳調である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「扇動する」は公的朗読にも耐える語調とし、「その心を仕向けた」によって原文の内面的な敵対化を自然に表現した。「ユダヤ人たち」は当地で反対した一群を指し、民族全体への一般化を避けるため、その限定が読み取れる文脈を前提とする。
