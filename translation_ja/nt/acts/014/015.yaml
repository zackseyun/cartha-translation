id: ACT.14.15
reference: Acts 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: ja
  text: そして、こう言った。「皆さん、なぜこんなことをするのですか。私たちも、あなたがたと同じ人間にすぎません。[a] 私たちは、あなたがたがこのようなむなしいものから離れ、生ける神に立ち返るようにと、良い知らせを伝えているのです。[b] この神こそ、天と地と海と、その中のすべてのものを造られた方です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたと同じ人間にすぎません」は、直訳すれば「あなたがたと同じ性質・経験を共有する人間です」。パウロとバルナバも聞き手と同じ人間であり、神ではないことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「むなしいもの」は、この文脈では偶像や、それに伴う無益な異教的礼拝を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: 皆さん
  rationale: 男性複数への呼びかけだが、現代日本語で群衆に自然に呼びかける表現とした。文脈上、対象の性別を明示する必要はない。
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: あなたがたと同じ弱さを持つ人間
  rationale: ὁμοιοπαθήςは同じ性質・経験・限界を共有することを表す。神々ではなく同じ人間だという対比を、自然な日本語で示した。
- source_word: εὐαγγελιζόμενοι
  choice: 良い知らせを伝えている
  rationale: 動詞の「良い知らせを告げる」という基本的意味を保ち、後代の専門用語だけに限定しない表現とした。
- source_word: τῶν ματαίων
  choice: このようなむなしいもの
  rationale: 偶像そのものに限定せず、実を結ばない異教的礼拝や行為を広く指し得る原文の表現を保った。
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: 離れ、生ける神に立ち返る
  rationale: ἀπόとἐπίが示す「～から離れて～へ向かう」という転換を明確にした。「生ける神」は命ある真の神と無力な礼拝対象との対照を保つ。
- source_word: ἐποίησεν
  choice: 造られた
  rationale: 創造行為を表すποιέωの直接的な訳。「創造された」より平明で、聖書的な創造定式にもなじむ。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς
  choice: 天と地と海と、その中のすべてのもの
  rationale: 各名詞をκαίで連ねる原文のリズムと包括性を、自然な日本語で再現した。
theological_decisions:
- issue: パウロとバルナバの人間性と神的栄誉の拒絶
  choice: 私たちも、あなたがたと同じ弱さを持つ人間です
  alternative: 私たちも、あなたがたと同じ性質の人間です
  rationale: 使徒たちが神々ではなく、聞き手と同じ限界を持つ人間だという主張を明示する。「弱さ」は罪深さだけを意味するとは限らず、人間としての共通の限界を表すため、脚注で範囲を補った。
- issue: 「むなしいもの」の範囲
  choice: 広い反偶像礼拝表現を本文に保つ
  alternative: 偶像
  rationale: 文脈には偶像と異教的犠牲が含まれるが、原文は偶像を直接表す名詞ではないため、解釈を狭めず脚注で文脈を説明した。
- issue: ἐπιστρέφεινの方向性
  choice: 生ける神に立ち返る
  alternative: 生ける神へ向かう
  rationale: 日本語の聖書的・宗教的文脈で転向を自然に表す一方、以前に神を信じていたとの歴史的主張を必ずしも含めず、原語の方向転換を示す。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で dignified な口調とした。直接話法では切迫した制止を保ちつつ、「皆さん」「するのですか」によって不自然な古語調を避けた。
