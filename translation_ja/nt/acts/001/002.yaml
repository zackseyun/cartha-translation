id: ACT.1.2
reference: Acts 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: ja
  text: ご自分が選んだ使徒たちに、聖霊を通して[a]命令を与えた後、上げられた日まで。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊によって」。ギリシア語は、命令を与えることの手段または媒介を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: 日まで
  rationale: 時間的な終点を示す表現。「その日まで」と補わず、関係節の内容を受ける自然な日本語の語順にした。
- source_word: ἐντειλάμενος
  choice: 命令を与えた後
  rationale: ἐντέλλομαι の強さを保つため「教えた」ではなく「命令を与えた」とし、アオリスト分詞が主動詞に先立つ行為を表すことを「後」で明示した。
- source_word: τοῖς ἀποστόλοις
  choice: 使徒たちに
  rationale: ルカ文書で特定の集団を指す定着した訳語「使徒」を用いた。
- source_word: διὰ πνεύματος ἁγίου
  choice: 聖霊を通して
  rationale: 属格を伴う διά が示す手段または媒介を自然に表し、作用のあり方を本文以上に限定しない。
- source_word: οὓς ἐξελέξατο
  choice: ご自分が選んだ
  rationale: 主語であるイエスによる先行する選びを示す。中間態の含意に配慮して「ご自分が」としたが、「ご自分のために」とまでは限定しなかった。
- source_word: ἀνελήμφθη
  choice: 天に上げられた
  rationale: 受動形を保ち、「上げられた」とした。日本語では行き先を示さない「上げられた」が不自然で意味も曖昧になるため、文脈上の昇天を明確にする「天に」を補った。
theological_decisions:
- issue: イエスの命令と聖霊との関係
  choice: イエスが聖霊を通して使徒たちに命令を与えた
  alternative: イエスが聖霊によって使徒たちに命令を与えた
  rationale: διὰ πνεύματος ἁγίου を ἐντειλάμενος に結び付ける自然な統語関係を保った。「通して」は媒介・手段を表しつつ、聖霊の働きの様態を教理的に細かく規定しない。
- issue: ἀνελήμφθη の行為主体
  choice: 受動表現「天に上げられた」を保つ
  alternative: 「天に昇った」
  rationale: ギリシア語の受動態を保ち、イエスが上げられたという表現上の神学的含みを能動表現で消さない。
translation_notes:
  register: 現代の標準的な日本語で、簡潔かつ尊厳ある文体とした。前節から続く文の一部であるため、原文にない主節の動詞を補わず、「日まで」で結んだ。
