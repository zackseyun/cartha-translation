  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: ja
  text: この奉仕と使徒職の地位を受け継ぐためです。ユダはその地位から離れ[a]、自分の所へ行きました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこから離れ」「そこから外れ」。ギリシア語は、この奉仕と使徒職の地位から逸脱したこと、または離れたことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳「自分自身の所へ」。単にユダに属する所を指すとも、彼にふさわしい裁きの所を暗示するとも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν τὸν τόπον
  choice: 務めを担わせる
  rationale: 直訳的な「場所を受ける」は日本語では不自然なため、空いた役割を引き受ける意味を自然に表した。τόπος の比喩的意味は「務め」に含めた。
- source_word: διακονίας ταύτης καὶ ἀποστολῆς
  choice: この奉仕と使徒の務め
  rationale: διακονία を「奉仕」、ἀποστολή を使徒として委ねられた職務を示す「使徒の務め」とし、二語を区別した。
- source_word: ἀφ’ ἧς παρέβη
  choice: そこからそれて
  rationale: παραβαίνω がここで示す、委ねられた奉仕と使徒職からの逸脱・離脱を表しつつ、「背教した」などの教義的に強い限定を避けた。
- source_word: πορευθῆναι
  choice: 行きました
  rationale: πορεύομαι の基本的で簡潔な移動表現を自然な日本語で表した。
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: 自分の行くべき所へ
  rationale: ἴδιον が持ち得る「自分に属する／自分にふさわしい」という含みを簡潔に表した。ただし目的地の性質は本文で特定せず、曖昧さを保った。
theological_decisions:
- issue: ユダの「自分の所」が何を指すか
  choice: 「自分の行くべき所」として目的地を特定しない
  alternative: 墓、死後の裁き、地獄、または単にユダに属する場所と明示する
  rationale: ギリシア語は行き先を明示していないため、裁きの含意を認めながらも、本文では特定の教理的解釈に固定しない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準語。「奉仕」と「使徒の務め」を区別し、ユダの逸脱と行き先について原文の簡潔さと神学的な曖昧さを保持した。
