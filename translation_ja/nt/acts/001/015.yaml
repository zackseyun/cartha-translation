source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: ja
  text: そのころ、ペトロは兄弟たち[a]の中で立ち上がって言った。（そこに集まっていた人々は、およそ百二十人であった。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、女性を含む信仰の仲間全体を指している可能性がある。ギリシア語は男性複数形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: そのころ
  rationale: 直訳は「これらの日々に」だが、直前の出来事と同じ時期を指す自然な現代日本語として「そのころ」とした。
- source_word: ἀναστὰς
  choice: 立って
  rationale: 発言に先立ってペトロが立ち上がった具体的な動作を簡潔に表す。
- source_word: ἐν μέσῳ τῶν ἀδελφῶν
  choice: 兄弟たちの中に
  rationale: 集まった共同体の中での位置を保ち、ἀδελφῶνの男性複数形を本文では「兄弟たち」とした。文脈上女性を含み得る点は脚注に示す。
- source_word: ὄχλος ὀνομάτων
  choice: 人々
  rationale: 字義的には「名の群れ」だが、ここでは人数を数えられる人々を表す慣用的表現である。日本語で「名の群れ」や「名の数」とすると不自然で意味が伝わりにくいため、指示対象を明示した。
- source_word: ἐπὶ τὸ αὐτό
  choice: そこに集まっていた
  rationale: 一同が同じ所に集まっていたことを、自然な日本語で表した。
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: およそ百二十人
  rationale: ὡςが示す概数を「およそ」で表し、日本語として人数の助数詞「人」を補った。
- source_word: τε
  choice: （括弧内の補足文）
  rationale: 本文の進行に付随する人数説明として、独立した括弧文で自然に表した。日本語では接続詞を明示しなくても付加的関係が伝わる。
theological_decisions:
- issue: 集まった共同体におけるἀδελφῶνの性別範囲
  choice: 本文は「兄弟たち」とし、女性を含む可能性を脚注で示す。
  alternative: 「兄弟姉妹たち」または「信者たち」
  rationale: ギリシア語の男性複数形を本文に反映しつつ、使徒1:14などの文脈から共同体に女性もいたことを排除しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「ペトロ」は原語名に近い一般的な聖書表記を用いた。括弧は原文の挿入的な人数説明を保つ。
