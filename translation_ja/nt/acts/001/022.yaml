id: ACT.1.22
reference: Acts 1:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: ja
  text: ヨハネの洗礼[a]から始まり、イエスが私たちのもとから上げられた日に至るまで、これらの人々のうち一人が、私たちとともにイエスの復活の証人[b]にならなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨハネが授けた洗礼」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスの復活を証言する者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: ヨハネの洗礼から始まり
  rationale: 起点を示す分詞句を、前節から続く期間の説明として自然な日本語にした。「ヨハネの洗礼」はギリシア語の属格が持つ簡潔さを保つ。
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: …日に至るまで
  rationale: 期間の終点を表す関係節を、明瞭で格調ある現代日本語にした。
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: 私たちのもとから上げられた
  rationale: 受動態と上方への移動の含みを保ちつつ、「天に昇った」と本文にない語を補わない。「私たちから」より自然に離去の意味を表すため「私たちのもとから」とした。
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: イエスの復活の証人
  rationale: 属格構文を保ち、「復活を目撃した者」に限定せず、公に証言する務めも含み得る「証人」とした。代名詞の指示対象は日本語で明確にするため「イエス」とした。
- source_word: σὺν ἡμῖν γενέσθαι
  choice: 私たちとともに…証人にならなければなりません
  rationale: 前節の δεῖ が支配する必要性を日本語に明示し、選ばれる者が既存の使徒たちと共同で証人になることを表した。
- source_word: ἕνα τούτων
  choice: これらの人々のうち一人
  rationale: τούτων の指示を保ちながら、前節で述べられた候補者を日本語で自然に受けるため「人々」を補った。
theological_decisions:
- issue: 前節の δεῖ が表す必要性の補足
  choice: 「ならなければなりません」と明示
  alternative: 「なることです」または不定詞相当の未完結な表現
  rationale: 本節は統語上、前節の「必要である」に依存している。必要性を訳出するのは意味の追加ではなく、文を日本語として完結させるためである。
- issue: 昇天への言及
  choice: 「上げられた」
  alternative: 「天に昇られた」「取り去られた」
  rationale: 受動態と上方への移動を保つ一方、この節に明記されていない「天に」を補わず、行為者も特定しない。
- issue: 復活の証人の意味範囲
  choice: 「復活の証人」
  alternative: 「復活を証言する者」
  rationale: 原文の属格表現と「証人」という役割語を保ち、目撃と宣教のどちらか一方に意味を狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「至るまで」「証人」など聖書本文にふさわしい端正さを保った。本節が前節から続く一文であることを踏まえ、単独でも意味が通るよう主語の指示と必要性を明示した。
