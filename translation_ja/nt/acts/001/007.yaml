  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「父がご自分の権威によって[b]定められた時や時期[a]は、あなたがたの知るところではありません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「時や定められた時」、または「期間や時機」とも訳せる。原文は、時間や期間を表す語（χρόνοι）と、定められた時機を表し得る語（καιροί）を使い分けている。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「ご自分の権威のうちに」。父がこれらの事柄をご自身の権限のもとに置いておられる、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 弟子たちの問いに対するイエスの応答が、穏やかな対照と話の転換を示すため。
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: あなたがたが知ることではありません
  rationale: 単なる禁止ではなく、その知識が弟子たちに属する事柄・権限ではないというギリシア語の慣用表現を、自然な現代日本語で表した。
- source_word: χρόνους ἢ καιροὺς
  choice: 時や時期
  rationale: χρόνοςが時間や期間、καιρόςが定められた時機を指し得るという関連しつつ異なる語の組み合わせを、過度に専門化せず簡潔に保った。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 原文どおり定冠詞を伴う称号として訳し、「わたしの」など原文にない限定を加えなかった。
- source_word: ἔθετο
  choice: 定めておられる
  rationale: 置く、設定する、定めるという意味を文脈に即して表し、過去になされた決定の現在的効力も自然に伝える。
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: ご自分の権威によって
  rationale: 父ご自身に属する権威・権限による決定であることを、読みやすい日本語で示した。ἐνの字義的な形は脚注で保持する。
theological_decisions:
- issue: χρόνοιとκαιροίの区別
  choice: 時や時期
  alternative: 期間や定められた時
  rationale: 二語の差を残しつつ、終末の時をめぐる厳密な体系を本文に持ち込まず、原文の抑制を保つため。
- issue: 父のἐξουσίαの表現
  choice: ご自分の権威によって
  alternative: ご自分の権威のうちに
  rationale: 父の固有の権限を明確にしながら、後代の教理的表現を付加せず、原文の主権的な含意を自然な日本語で伝えるため。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「言われた」と「おられる」により、過度に古風にならない範囲で聖書本文にふさわしい敬意を示した。
