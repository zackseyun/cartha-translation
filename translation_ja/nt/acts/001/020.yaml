  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: ja
  text: 詩編の書にこう書かれているからです。「彼の住まいが荒れ果て、そこに住む者がいないように。」また、「ほかの者がその務め[a]を引き受けるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「務め」は「監督の職」または「職務」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: 書かれている
  rationale: 完了受動形による聖書引用の定型表現を、現在にも効力を持つ自然な日本語で表した。
- source_word: βίβλῳ ψαλμῶν
  choice: 詩編の書
  rationale: 引用元を示す属格構文を、原文の「書」を保ちつつ明瞭に訳した。
- source_word: Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος
  choice: 彼の住まいは荒れ果て……ように
  rationale: 命令形が表す祈願・宣告の響きを「ように」で保ち、ἔπαυλις は広く居所を指す「住まい」とした。
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: そこに住む者がいなくなるように
  rationale: 直訳的な存在構文の意味を保ちながら、現代日本語として自然にした。
- source_word: ἐπισκοπή
  choice: 務め
  rationale: 監督・管理を伴う役目を指すが、後代の特定の教会職制を読み込まない、文脈に適した語を選んだ。
- source_word: λαβέτω ἕτερος
  choice: ほかの者が引き受けるように
  rationale: 後任者がその役目を担う意味と、命令形の祈願的な引用調を自然な日本語で表した。
theological_decisions:
- issue: ユダの役割に適用された ἐπισκοπή の訳語
  choice: 務め
  alternative: 監督の職／職務
  rationale: 使徒団における空席となった役割を示しつつ、後代の制度化された「監督職」を当然視しないため。「監督の職」という語義上の可能性は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、詩編引用には簡潔で荘重な調子を保った。「詩編」は日本語聖書で広く通用する書名とした。脚注記号は、説明対象である「務め」を含む第二の引用の直後に置いた。
