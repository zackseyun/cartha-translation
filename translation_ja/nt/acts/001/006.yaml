id: ACT.1.6
reference: Acts 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: ja
  text: そこで、集まった人々はイエスに尋ねた。「主よ、イスラエルに[a]王国を回復なさるのは、今なのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルのために」とも訳せる。ギリシア語の与格は、王国がイスラエルに戻されること、またはその回復がイスラエルのためであることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: そこで、集まった人々は
  rationale: 分詞を時・状況を示す表現として自然な日本語にし、μὲν οὖνは物語の展開を示す「そこで」で表した。
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: イエスに尋ねた
  rationale: 未完了過去を文脈に即した通常の物語過去で表した。λέγοντεςは日本語では引用が発話内容を明示するため、重複する「言って」を置かなかった。代名詞の指示対象は文脈上イエスなので明示した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある直接呼格であり、称号としての神学的重みも保つ標準的な訳語を用いた。
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: 今なのですか
  rationale: 「この時に」を硬く直訳せず、回復の時期を問う焦点が明瞭になる自然な疑問文とした。瞬間だけに限定しない表現である。
- source_word: ἀποκαθιστάνεις
  choice: 回復なさる
  rationale: 以前の状態へ戻すという語義を「回復する」で保ち、主への直接の問いにふさわしい尊敬表現とした。
- source_word: τὴν βασιλείαν
  choice: 王国
  rationale: 支配・統治という意味を排除しない一方、この箇所で前景化されるイスラエルの王国回復への期待を率直に伝える。
- source_word: τῷ Ἰσραήλ
  choice: イスラエルに
  rationale: 与格を最も直接的に表し、王国がイスラエルに戻されるという読みを保った。「イスラエルのために」という受益の読みも可能なので脚注に示した。
theological_decisions:
- issue: 弟子たちが期待したイスラエルの王国の性質
  choice: 「イスラエルに王国を回復」と問いをそのまま訳し、政治的とも霊的とも限定しない。
  alternative: 「イスラエルのために王国を回復」「イスラエルの王国を再建」
  rationale: 本文は弟子たちの問いを記録しているのであり、そこに含まれる前提をこの節だけで肯定または修正してはいない。歴史的・神学的な緊張を訳文で解消しないためである。
translation_notes:
  register: 明瞭な現代標準日本語を用い、直接話法には敬意と品位を保った。「言って尋ねた」のような不自然な重複を避けつつ、原文の問いの焦点と曖昧さを保持した。
