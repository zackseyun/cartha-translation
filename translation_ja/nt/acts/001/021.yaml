id: ACT.1.21
reference: Acts 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: ja
  text: ですから、主イエスが私たちの間を行き来しておられた全期間、私たちと共にいた男性たち[a]の中から一人が必要です。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「私たちと共に集まった男性たち」。この文脈では、使徒たちと継続して行動を共にした男性たちを指します。
    reason: lexical_alternative
  - marker: b
    text: 原文では「必要です」の内容は次節に続き、その一人が使徒たちと共にイエスの復活の証人となることが述べられます。「行き来しておられた」は、主イエスが弟子たちの間で継続して生活し活動されたことを表す言い回しです。
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: 必要があります
  rationale: 非人称的な必要を表す。日本語では、次節へ続く内容を見越して「選ばれる」を補うと自然だが、その補足を脚注で明示した。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる結論を、明瞭で現代的な接続表現で示す。
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: 私たちと行動を共にした人々の中から、一人の男性が
  rationale: συνέρχομαι の継続的な同行・交わりを自然な日本語で表しつつ、ἀνδρῶν の男性限定の意味は「一人の男性」で保持した。属格は、次節まで続く構文上、選出母体を示す「中から」とした。
- source_word: ἐν παντὶ χρόνῳ ᾧ
  choice: 全期間
  rationale: 個々の機会すべてではなく、主イエスが弟子たちと共に活動した期間全体を指す。
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς
  choice: 私たちの間を行き来しておられた
  rationale: 継続的な生活と公の活動を指す慣用的な像を残し、日本語として理解できる形にした。敬語は主イエスへの自然な敬意を示す。
- source_word: ὁ κύριος Ἰησοῦς
  choice: 主イエス
  rationale: κύριος のキリスト論的称号を、確立した日本語聖書用語「主」で保持する。
theological_decisions:
- issue: κύριος のキリスト論的称号
  choice: 主イエス
  alternative: 主人イエス／先生イエス
  rationale: 「主」は称号の敬意と神学的重みを保ち、「主人」や「先生」よりも原語の用法に適合する。
- issue: ἀνδρῶν の性別を限定する語義
  choice: 一人の男性
  alternative: 一人の人
  rationale: ἀνήρ はここで男性を指すため中性化しない。一方、同行者集団を「男性たち」と重く表現するより、選ばれる一人について明示する方が自然である。
- issue: 次節にまたがる統語構造
  choice: 「選ばれる」を本文に補う
  alternative: 「一人の男性が必要です」として未完のまま次節へ続ける
  rationale: ギリシア語では δεῖ の内容が次節の γενέσθαι によって完結する。単節として自然な日本語にするため述語を補ったが、原文上の位置を脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用い、朗読にも適する丁寧で品位ある文体とした。節単独での可読性を優先しつつ、次節にまたがる原文構文は脚注で開示した。
