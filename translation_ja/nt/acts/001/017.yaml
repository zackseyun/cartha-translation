    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: というのも…からです
  rationale: 直前の発言を説明する因果的・説明的な接続を、現代日本語で自然に示す。
- source_word: κατηριθμημένος ἦν
  choice: 数えられ…ていた
  rationale: 完了受動の迂言形が示す、使徒の一団に数え入れられた状態を保つ。
- source_word: ἐν ἡμῖν
  choice: 私たちの一人に
  rationale: 単なる近接ではなく集団への実際の所属を明確かつ自然に表す。
- source_word: ἔλαχεν
  choice: 受けていた
  rationale: 割り当てによって得るという含みを、κλῆροςの訳語と脚注で保持しつつ自然な日本語にする。
- source_word: τὸν κλῆρον
  choice: 分け前
  rationale: 「くじ」と「割り当てられた持ち分」の語義を背景に、ここでは奉仕への参与を自然に表す。原語の幅は脚注に残す。
- source_word: τῆς διακονίας ταύτης
  choice: この奉仕の
  rationale: 使徒としての務め・奉仕を指す語として、一般読者にも明瞭で、過度に制度化しない表現を選ぶ。
theological_decisions:
- issue: ユダと使徒の務めとの関係
  choice: ユダが実際に使徒の一団に数えられ、その奉仕に割り当てられた分を持っていたことを示す。
  alternative: 一団との単なる外面的な関係として弱く読む。
  rationale: 「私たちの一人に数えられ」と「分け前を受けていた」は実際の所属と参与を述べるが、その承認や最後までの忠実さについて本文以上の結論は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説明的な文脈に合わせて丁寧体とした。「奉仕」は品位を保ちつつ一般読者にも理解しやすい語として採用した。
