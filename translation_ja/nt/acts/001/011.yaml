id: ACT.1.11
reference: Acts 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: ja
  text: 彼らはまた言った。「ガリラヤの男たちよ、なぜ天を見つめながら立っているのですか。あなたがたのもとから天に上げられたこのイエス[a]は、天へ行かれるのをあなたがたが見たのと同じように、来られます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的な訳では「この同じイエス」。ギリシア語は字義的には「このイエス」であり、「同じ」はその同一性を強調する解釈的な補足である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: ガリラヤの男たちよ
  rationale: 男性複数の呼びかけを明示しつつ、現代日本語で理解しやすい形にした。
- source_word: τί ἑστήκατε βλέποντες
  choice: なぜ天を見つめながら立っているのですか
  rationale: ἑστήκατε の現在の状態と、付随する βλέποντες の動作をともに表した。「見つめる」はこの場面での継続的な注視を自然に伝える。
- source_word: εἰς τὸν οὐρανόν
  choice: 天を／天に／天へ
  rationale: 同じ句が文中で繰り返されるため、日本語の格関係に応じて助詞を調整しつつ、οὐρανός は昇天の文脈から一貫して「天」とした。
- source_word: οὗτος ὁ Ἰησοῦς
  choice: このイエス
  rationale: 指示詞 οὗτος を直接反映した。「同じ」に当たる語は原文に明示されていないため本文には加えず、伝統的な訳を脚注に示した。
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: あなたがたのもとから天に上げられた
  rationale: 受動形と上方への移動を保ち、ἀφ’ ὑμῶν の離隔を自然な日本語で表した。
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: 見たのと同じように、来られます
  rationale: 来臨の仕方を昇天時の目撃された仕方と対応させる比較構文を、重複感のない自然な日本語にした。
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: 行かれるのをあなたがたが見た
  rationale: 目撃を示す動詞と、イエスの移動を表す分詞を簡潔に保持した。
theological_decisions:
- issue: 昇天と来臨の文脈における οὐρανός の意味
  choice: 天
  alternative: 空
  rationale: οὐρανός には「空」の意味もあるが、イエスが上げられ、そこから来られるという文脈では「天」が物語的・神学的含意をより適切に保つ。
- issue: οὗτος ὁ Ἰησοῦς に同一性を示す語を補うか
  choice: このイエス
  alternative: この同じイエス／ほかならぬこのイエス
  rationale: 原文は指示詞によって当のイエスを指すが、「同じ」に相当する独立した語はない。本文は明示された表現にとどめ、同一性を強調する伝統的理解を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「来られます」は文脈上の主語であるイエスへの自然な敬意を示す通常の日本語表現であり、原文にない教理的内容は加えていない。
