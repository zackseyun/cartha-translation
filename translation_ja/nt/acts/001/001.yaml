source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: ja
  text: テオフィロ、私は最初の記録[a]で、イエスが行うことと教えることを始めた、そのすべてについて書きました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「先の記録」「最初の書」。
    reason: πρῶτον λόγονは、前に著された記録、または第一巻を指し得る。
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: 先の書
  rationale: λόγοςはここでは単独の「言葉」ではなく、著者が先に著した文書、すなわちルカ福音書を指す。πρῶτονは第二巻との対比を含むため、自然な日本語の「先の書」とした。μένの談話上の対比も、この表現によって間接的に保たれる。
- source_word: ἐποιησάμην
  choice: 記しました
  rationale: λόγοςとともに用いられ、文書を作成したことを表す。「作りました」より自然で、「書きました」よりも内容を記述した含みを持つ。
- source_word: περὶ πάντων ... ὧν
  choice: すべてのことについて
  rationale: περί＋属格と、πάντωνを受ける関係代名詞ὧνを一体として自然な日本語にした。物語の範囲内での総括であり、絶対的な網羅性を過度に強調しない。
- source_word: ὦ Θεόφιλε
  choice: テオフィロ様
  rationale: ὦによる呼びかけを、日本語で自然かつ敬意ある「様」によって表した。「親愛なる」のような原文にない親愛の意味は加えない。
- source_word: ἤρξατο
  choice: 始めた
  rationale: 「始める」という明示的な意味を保持する。使徒言行録におけるイエスの働きの継続を示唆し得るが、その含意を訳文で説明し尽くさない。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した人名表記を用いる。
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: 行い、また教え
  rationale: τε καίの並列を「…また…」で示した。ποιεῖνの広さを保つ「行う」を用い、イエスの行為と教えの両方を区別しつつ結び付ける。
theological_decisions:
- issue: ἤρξατο（「始めた」）が、使徒言行録におけるイエスの働きの継続を示唆する可能性
  choice: 本文で「始めた」を保持し、継続の意味を明示的に補わない。
  alternative: 「イエスが行い、教えた」とする、または「使徒たちを通して続けた」と補足する。
  rationale: 原文は明確に「始めた」と述べる一方、何がどのように継続するかは明文化していない。したがって、示唆と神学的緊張をそのまま残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、冒頭の献辞にふさわしい丁寧さを保った。「テオフィロよ」は現代日本語では古風で不自然なため、「テオフィロ様」とした。
