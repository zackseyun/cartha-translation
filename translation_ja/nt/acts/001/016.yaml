revisions:
- from: 兄弟である男性の皆さん[a]。聖霊がダビデの口を通して[b]、イエスを捕らえた[c]者たちの手引きとなったユダについて前もって語った聖書の言葉は、実現しなければなりませんでした。
  to: 男性の皆さん、兄弟たち[a]、聖霊がダビデの口を通して[b]、イエスを捕らえた者たち[c]の手引きとなったユダについて前もって語った聖書の言葉は、成就する必要がありました。
  rationale: 聖書が「成就される」という原文の受動的な成就表現を、現代日本語として自然な「成就する必要がありました」で保ちました。冒頭は二重呼格の情報を落とさず、自然な呼びかけに改めました。聖霊を発話主体、ダビデを媒介者とする構文、また必要性の根拠を説明しすぎない点は維持しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:34Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な内容は原文に沿っていますが、「実現しなければなりませんでした」は、γραφὴνを主語とする受動の「成就される」を十分に表しません。聖書そのものが成就されるというルカ文書の定型を保つため、「成就する必要がありました」とするのが適切です。
  naturalness: 「兄弟である男性の皆さん」は日本語の呼びかけとして不自然です。二つの呼格を無理なく明示する「男性の皆さん、兄弟たち」のほうが、やや重複する原文の呼びかけの性格を保ちつつ明瞭です。冒頭の句点も呼びかけを本文から不自然に切り離しています。
  terminology: 「聖霊」「ダビデ」「ユダ」「イエス」は標準的で適切です。「手引き」もこの文脈でユダが逮捕者側を案内したことを表せます。「成就」は聖書の実現に関する確立した自然な用語です。
  issues:
  - severity: medium
    issue: 成就を「実現しなければなりませんでした」とした点
    rationale: πληρωθῆναιは受動不定詞で、γραφὴν（聖書）が成就されることを述べます。「実現する」は意味領域としては近いものの、受動的な聖書成就の表現と結び付きが弱く、「聖書の言葉は成就する必要がありました」とするほうが原文に忠実です。
  - severity: medium
    issue: 冒頭の呼びかけの不自然さと句点
    rationale: 「兄弟である男性の皆さん」は修飾関係が重く、呼びかけとして不自然です。また呼びかけ直後の句点は、続く発言とのつながりを不必要に断ちます。ἄνδρεςとἀδελφοίを保って「男性の皆さん、兄弟たち、」とします。
  - severity: low
    issue: 脚注aの説明の精度
    rationale: 「当時の男性複数形による呼びかけ」だけでは、原文がἄνδρες（男性たち）とἀδελφοί（兄弟たち）という二語を並べている点が不明瞭です。二重の呼格であることを明記します。
