id: ACT.1.16
reference: Acts 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: ja
  text: 男性の皆さん、兄弟たち[a]、聖霊がダビデの口を通して[b]、イエスを捕らえた者たち[c]の手引きとなったユダについて前もって語った聖書の言葉は、成就する必要がありました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「男性たち、兄弟たち」。原文は「男性たち」と「兄弟たち」という二つの男性複数の呼びかけを並べています。
    reason: linguistic_note
  - marker: b
    text: 「ダビデの口を通して」は、聖霊がダビデを人間の語り手として用いて語ったことを表す表現です。
    reason: cultural_note
  - marker: c
    text: 「捕らえた」は「逮捕した」または「拘束した」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: 兄弟である男性の皆さん
  rationale: 二つの男性複数呼格を反映しつつ、日本語の呼びかけとして理解できる形にした。「兄弟たち」だけに縮めず、ἄνδρεςの要素も明示した。
- source_word: ἔδει
  choice: しなければなりませんでした
  rationale: 非人称の未完了過去が表す必要性を保ち、その必要性の仕組みを本文以上に説明しない表現とした。
- source_word: πληρωθῆναι
  choice: 実現する
  rationale: 聖書の言葉が現実となるという成就の意味を、現代の一般読者に明瞭な語で表した。受動形の意味は文全体の「聖書の言葉は」によって保たれる。
- source_word: τὴν γραφήν
  choice: 聖書の言葉
  rationale: ここでのγραφήが聖なる書に属する特定の言葉を指すことを自然な日本語で示した。
- source_word: προεῖπε
  choice: 前もって語った
  rationale: 「予言した」と限定せず、「前に言う」という動詞本来の幅を保った。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 神的主体を表す現代日本語の標準的な訳語。
- source_word: διὰ στόματος Δαυὶδ
  choice: ダビデの口を通して
  rationale: 聖霊を語り手、ダビデを人間の媒介者とする原文の構造と、「口」という具体的な比喩を保った。
- source_word: περὶ Ἰούδα
  choice: ユダについて
  rationale: περί＋属格が示す話題・対象を簡潔に表した。
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: 手引きとなった
  rationale: γενομένουの「～となった」を保ち、ὁδηγόςをこの逮捕場面に自然な「手引き」とした。定冠詞のない原文に合わせて「その手引き」とはしなかった。
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: イエスを捕らえた者たち
  rationale: 逮捕の文脈におけるσυλλαμβάνωを平明な「捕らえる」で訳し、分詞構文を関係節として表した。
theological_decisions:
- issue: 聖書の言葉が実現する必要性
  choice: 「実現しなければなりませんでした」と訳し、必要性だけを明示した。
  alternative: 神の予定によって必ず起こることになっていた／実現するのがふさわしかった
  rationale: 本文は必要性を述べるが、その仕組みを詳述しない。神の主権、予知、人間の責任の関係を訳文で一方的に解決しないため。
- issue: 霊感における神的主体と人間的媒介
  choice: 「聖霊がダビデの口を通して…語った」とした。
  alternative: ダビデが聖霊によって語った／聖霊がダビデに書かせた
  rationale: 原文では聖霊が文法上の語り手であり、ダビデはその口を通す媒介者である。この両方をそのまま保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、公の演説にふさわしい落ち着いた調子を保った。冒頭の二重呼格は日本語ではやや硬いが、原文が男性と兄弟の両語を明示するため、「兄弟である男性の皆さん」として情報を保持し、脚注で直訳を示した。
