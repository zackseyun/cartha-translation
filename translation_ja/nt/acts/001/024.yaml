id: ACT.1.24
reference: Acts 1:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: ja
  text: そして彼らは祈った後、こう言った。「すべての人の心を知っておられる主よ[b]、あなたがこの二人のうちどちらをお選びになったのか、お示しください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「公に明らかにしてください」または「任命してください」とも訳せる。この動詞は、知らせることや公に指名することを表し得る。
    reason: lexical_alternative
  - marker: b
    text: この「主」は、神を指すとも、特にイエスを指すとも理解できる。ギリシア語本文は、ここでその相手を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: 祈って
  rationale: アオリスト分詞は主動詞「言った」に先立つ行為を表す。日本語では「祈って、こう言った」とすることで、祈りの後に発言した流れを自然に示せる。
- source_word: Σὺ κύριε
  choice: 主よ、あなたが
  rationale: κύριεを直接呼びかけの「主よ」とし、明示された代名詞Σὺを「あなたが」で表して強調を保った。
- source_word: καρδιογνῶστα πάντων
  choice: すべての人の心を知っておられる
  rationale: 複合語καρδιογνώστηςの意味とπάντωνの範囲を、現代日本語で自然かつ荘重に表した。
- source_word: ἀνάδειξον
  choice: お示しください
  rationale: 神がすでに選んだ人物を明らかにするよう求める文脈に合い、正式な任命までを断定しない訳語とした。公に指し示す、または任命する含意もあり得るため脚注に示した。
- source_word: ὃν ἐξελέξω
  choice: どちらをお選びになったのか
  rationale: 二人のうち選ばれた人物を問う日本語として自然であり、選択がすでになされたことも表す。
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: この二人のうちどちらを
  rationale: 二人から一人を選ぶ意味を、性別など原文にない情報を加えず明確に表した。
theological_decisions:
- issue: 祈りで呼びかけられている「主」が誰を指すか
  choice: 「主」とだけ訳し、指示対象を特定しない
  alternative: 父なる神への呼びかけ、または復活したイエスへの呼びかけと明示する
  rationale: ギリシア語本文はκύριεとのみ記しており、この箇所自体は指示対象を明示していない。訳文ではその解釈上の余地を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りにふさわしい丁寧で荘重な表現とした。「知っておられる」「お選びになった」「お示しください」により敬意を表しつつ、過度に古風な言い回しは避けた。
