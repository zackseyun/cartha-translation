  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: ja
  text: そこで、彼らは二人についてくじを引いた。すると、くじはマティアに当たり、彼は十一人の使徒に数え入れられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: 二人のためにくじを引くと
  rationale: 直訳は「彼らにくじを与えた」だが、文脈上は二人の候補者について選定のくじを行ったことを表す。現代日本語として自然な「くじを引く」を用い、αὐτοῖςが指す二人を明示した。
- source_word: κλήρους / ὁ κλῆρος
  choice: くじ／そのくじ
  rationale: ここでは分け前や相続分ではなく、選定に用いるくじを指す。二度目は定冠詞を「その」で表した。
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: そのくじはマティアに当たり
  rationale: ギリシア語の「くじがマティアの上に落ちた」という比喩を、日本語の自然な慣用表現「くじが当たる」で伝えた。
- source_word: Μαθθίαν
  choice: マティア
  rationale: 原語の人名を、現代日本語の聖書で理解しやすい慣用的な形に音写した。
- source_word: συγκατεψηφίσθη
  choice: 共に数えられた
  rationale: ある集団と一緒に数え入れられる、またはその一員と認められる意を持つ。原文に近く、任命の様態について余分な含意を加えない表現とした。
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: 十一人の使徒と共に
  rationale: 属格を伴うμετάの「～と共に」を保ち、既存の十一人と合わせて数えられたことを示した。
theological_decisions:
- issue: συγκατεψηφίσθηを、共同体による承認以上の神的・制度的任命まで含意する表現にするか
  choice: 十一人の使徒と共に数えられた
  alternative: 十一人の使徒に加えられた／十一人の使徒の一員となった
  rationale: 本文は、くじがマティアに当たった後、彼が十一人と合わせて数えられたと述べる。「加えられた」も可能だが、「共に数えられた」は受動形と語義をより直接に保ち、本文を越えた教会論的・職制的主張を持ち込まない。
translation_notes:
  register: 接続詞を保ちながら一文で流れよくまとめた。平明な現代標準日本語を用い、叙述の簡潔さと荘重さを両立させた。注を要するほど重要な異読・語義上の曖昧さは本文に残らないため、脚注は付していない。
