source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: ja
  text: 彼らは中に入ると、滞在していた階上の部屋へ上がった。そこに滞在していたのは、ペトロ、ヨハネ、ヤコブ、アンデレ、フィリポとトマス、バルトロマイとマタイ、アルファイの子ヤコブ、熱心党のシモン、そしてヤコブの子ユダ[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤコブの兄弟ユダ」とも訳せる。ギリシア語は「ヤコブのユダ」とだけ述べ、両者の関係を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: 中に入ると
  rationale: アオリストをὅτεの時間節として自然な日本語で表し、主動詞「上がった」に先立つ動作を示す。原文が目的地を明示しないため、「町に」などは補わない。
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: 階上の部屋へ上がった
  rationale: ἀνέβησανの上方への移動と、ὑπερῷονが指す上階の部屋の両方を簡潔に保持する。
- source_word: οὗ ἦσαν καταμένοντες
  choice: 滞在していた
  rationale: 継続してその場所にとどまっていたことを、現代日本語として自然に表す。
- source_word: Ἰάκωβος Ἁλφαίου
  choice: アルファイの子ヤコブ
  rationale: 人物一覧での属格を父称と理解するのが自然であり、同名人物を明確に識別できる。
- source_word: Σίμων ὁ ζηλωτὴς
  choice: 熱心党のシモン
  rationale: ζηλωτήςを人物の呼称として訳す標準的で分かりやすい表現。単なる性格描写とせず、識別名として示す。
- source_word: Ἰούδας Ἰακώβου
  choice: ヤコブの子ユダ
  rationale: 男性名の一覧における属格は父称である可能性が高い。ただし原文は関係語を明記していないため、別解を脚注に残す。
theological_decisions:
- issue: Ἰούδας Ἰακώβουが示す親族関係
  choice: ヤコブの子ユダ
  alternative: ヤコブの兄弟ユダ
  rationale: 属格だけでは「子」か「兄弟」かが明示されない。人物一覧における父称として「子」を本文に採用する一方、原文の曖昧さを脚注で保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、使徒名の列挙には簡潔で格調ある調子を保った。「上の部屋」という教会的連想を帯び得る定型表現より、建築上の位置を明確にする「階上の部屋」を採用した。
