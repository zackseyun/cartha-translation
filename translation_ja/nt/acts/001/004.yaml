source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: ja
  text: そして、彼らと一緒におられたとき[a]、イエスは彼らに、エルサレムを離れず、あなたがたがわたしから聞いた父の約束を待つように命じられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らと集まっておられたとき」。この句を「彼らと食事をしておられたとき」と理解する見方もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: 彼らと一緒におられたとき
  rationale: 語義には「集まる」「共に食事をする」とする理解もあるが、文脈上確実な、イエスが使徒たちと共にいたという意味を自然な日本語で示し、細かな語義の可能性は脚注に残した。
- source_word: παρήγγειλεν
  choice: 命じられた
  rationale: 権威ある指示を表す動詞なので、「教えられた」より強い「命じられた」とした。
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: エルサレムを離れず
  rationale: 場所から離れないようにとの命令を、簡潔で自然な現代日本語にした。
- source_word: περιμένειν
  choice: 待つ
  rationale: 約束の実現を期待して待つ意味を明瞭に表す。
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: 父の約束
  rationale: 属格の関係を過度に限定せず、父がなさった約束という文脈上の意味を保つ。
- source_word: ἣν ἠκούσατέ μου
  choice: あなたがたがわたしから聞いたもの
  rationale: ἀκούωに伴う属格代名詞を「わたしから」と忠実に表し、関係代名詞の先行内容も自然に受けた。
theological_decisions:
- issue: 復活後のイエスの行動に関する συναλιζόμενος の意味
  choice: イエスが弟子たちと一緒にいたという一般的な表現
  alternative: 彼らと集まっていたとき／彼らと食事をしていたとき
  rationale: この語の難しさを本文で特定の行為に限定せず、文脈上明らかな共在を本文に置いた。「食事をしていた」という古い解釈を含む代案は脚注で明示し、復活後の身体性をこの語だけで過度に強調しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「おられた」「命じられた」により、語り手がイエスに言及する際の自然な敬意を示した。直接引用を用いて、直前の「父の約束」の内容が弟子たちの聞いたものであることを読み取りやすくした。
