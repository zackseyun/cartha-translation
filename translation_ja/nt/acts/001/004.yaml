  terminology: 「父の約束」はτὴν ἐπαγγελίαν τοῦ πατρὸςを過度に解釈せず適切に訳している。「わたし」は本文のイエスの発話内容を反映し、「イエス」への言及に敬語を用いる文体とも整合する。脚注はσυναλιζόμενοςの不確定な語義を公正に保持している。
