- from: ヨハネは水でバプテスマを授けましたが、あなたがたは、今から何日もしないうちに、聖霊の中で[a]バプテスマを授けられます。
  to: ヨハネは水でバプテスマを授けましたが、あなたがたは、今から何日もしないうちに、聖霊による[a]バプテスマを授けられます。
  rationale: 「聖霊の中で」を、現代標準日本語として自然で意味の通る「聖霊による」に改めた。これはἐνの有力な手段・媒介の用法を反映する。一方、原文にある領域的な理解の可能性を本文だけで排除しないよう、脚注に「聖霊のうちに」を残した。その他の語順、未来受動、近い将来の表現、および「バプテスマ」の用語選択は維持した。
