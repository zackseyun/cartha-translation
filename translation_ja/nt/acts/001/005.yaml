  source_fidelity: 本文は水によるヨハネのバプテスマと、将来の聖霊に関わるバプテスマとの対照、未来受動、近い将来を適切に伝えている。ただし「聖霊の中でバプテスマを授けられます」は、ギリシア語ἐνの可能性の一つを字義的に写しているものの、現代標準日本語として不自然であり、意味が取りにくい。日本語では「聖霊によるバプテスマ」がこの構文を自然に表せる。領域的理解は脚注に保持する。
  naturalness: 「聖霊の中でバプテスマを授けられます」は、日本語では聖霊を物理的な場所のように読ませやすく、明瞭な現代日本語として適切ではない。「聖霊によるバプテスマを授けられます」とすると、定着した教会語を保ちながら自然になる。
  terminology: 「バプテスマを授ける／授けられる」は原文の能動・受動の対応を保つ。「聖霊」は適切である。「聖霊による」はἐνを手段・媒介として自然に訳すが、これだけで聖霊を行為者と断定するものではない。脚注に「聖霊のうちに」という領域的な代案を置き、原文の幅を保存する。
