  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: ja
  text: ヨハネは水でバプテスマを授けましたが、あなたがたは、今から何日もしないうちに、聖霊による[a]バプテスマを授けられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊のうちに」。ギリシア語の前置詞は、手段・媒介を表す「による」とも、領域を表す「うちに」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: （訳出せず、文脈上の説明として表現）
  rationale: 前節の発言の内容・根拠を導く接続語。日本語では独立した引用内容として自然につながるため、「なぜなら」などを機械的に補わない。
- source_word: ἐβάπτισεν
  choice: バプテスマを授けました
  rationale: 定着した宗教用語を用い、浸し方などの方式を特定しない。ヨハネが行為者である能動態も自然に表す。
- source_word: ὕδατι
  choice: 水で
  rationale: 無前置詞の与格が表す手段を簡潔に示し、後半のἐν πνεύματιとの対照を保つ。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊の中で
  rationale: ἐνの空間・領域的な響きを主文に残し、手段を表す「聖霊によって」という可能性は脚注に示す。ἅγιον πνεῦμαは文脈上、定まった指示対象として「聖霊」とする。
- source_word: βαπτισθήσεσθε
  choice: バプテスマを授けられます
  rationale: 未来受動を明示し、授ける主体は原文どおり特定しない。前半の同じ動詞との対応も保つ。
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: 今から何日もしないうちに
  rationale: 直訳調の「これらの多くの日々の後ではなく」を避けつつ、目前の時点を指すταύταςと、近い将来という意味を自然な現代日本語で表す。
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳの解釈
  choice: 聖霊の中で
  alternative: 聖霊によって
  rationale: ἐνは領域・環境とも手段とも理解できる。本文では前置詞の含意を比較的直接に保ち、聖霊が手段または働き手であるとの理解も脚注に残して、聖霊のバプテスマについての神学的緊張を解消しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「バプテスマ」は教会的に定着した語として保持し、「浸す」として方式を限定しない。敬体で周辺文脈になじむ形とした。
