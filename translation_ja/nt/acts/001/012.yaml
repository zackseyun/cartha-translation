base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: ja
  text: それから彼らは、オリーブ山と呼ばれる山からエルサレムに帰った。その山はエルサレムの近くにあり、安息日の道のりほど離れていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「安息日の道のり」とは、当時のユダヤ人の慣習において、安息日に移動できるとされた距離を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: それから
  rationale: 物語の出来事の順序を示す自然な現代日本語。
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: エルサレムに帰った
  rationale: 移動先と帰還を簡潔かつ自然に表す。
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: オリーブ山と呼ばれる山を下り
  rationale: ἀπόの起点を日本語として自然に示し、Ἐλαιώνを定着した地名「オリーブ山」で表した。「下り」は山から都への帰還という文脈を明瞭にする。
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: その山はエルサレムの近くにあり
  rationale: 関係節の内容を独立した文節にして、明快な日本語にした。
- source_word: σαββάτου ἔχον ὁδόν
  choice: 安息日に歩くことのできる距離であった
  rationale: 直訳的な「安息日の道のり」では意味が伝わりにくいため、当時のユダヤ人の慣習上、安息日に移動できる距離を指す表現として訳した。
theological_decisions:
- issue: σαββάτου ἔχον ὁδόνというユダヤ的距離表現
  choice: 安息日に歩くことのできる距離であった
  alternative: 安息日の道のりほど離れていた
  rationale: 教理的に解釈を加えず、文化的慣用句の意味を本文で理解できるようにした。具体的な距離は原文にないため補わない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「オリーブ山」は日本語で広く定着した地名を用いた。原文の距離表現は具体的な数値に置き換えず、文化的背景を脚注で補った。
