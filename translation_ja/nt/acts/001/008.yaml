  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: ja
  text: しかし、聖霊があなたがたの上に臨むとき、あなたがたは力を受け、エルサレム、ユダヤ全土とサマリア、そして地の果てに至るまで[a]、わたしの証人となります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地の最も遠い所に至るまで」とも訳せる。ギリシア語では「果て」が単数形で、地上の最遠部を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の7節との対比を明確にしつつ、現代日本語で自然な逆接とした。
- source_word: λήμψεσθε δύναμιν
  choice: 力を受けます
  rationale: λαμβάνωはここでは自ら取ることでなく、与えられるものを受ける意。δύναμιςは働きを可能にする力を広く表すため、「能力」などに狭めない。
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: 聖霊があなたがたの上に臨むとき
  rationale: 属格独立構文を自然な時の節で表し、ἐπίが示す「上に」という方向・到来の像を保った。「臨む」は尊厳を保ちつつ、単なる場所的な下降に限定しない。
- source_word: ἔσεσθέ μου μάρτυρες
  choice: わたしの証人となります
  rationale: 日本語では未来の状態への移行を「となります」とするのが自然。μουはイエスに属し、イエスについて証言する証人という関係を簡潔に保つ。μάρτυρεςを後代の「殉教者」の意味に限定しない。
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: ユダヤ全土とサマリアで
  rationale: πάσῃは明示的にユダヤを修飾するため「ユダヤ全土」とし、サマリアには前置詞ἐνを補って日本語の「で」にまとめた。
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: 地の果てに至るまで
  rationale: ギリシア語の単数形を反映しつつ、世界の最遠部を指す慣用表現として自然で格調ある日本語にした。
theological_decisions:
- issue: τοῦ ἁγίου πνεύματοςの指示対象
  choice: 聖霊
  alternative: 聖なる霊
  rationale: 定冠詞を伴う文脈上の特定の指示対象を表す日本語の標準的名称を用いたが、この節そのものを超える教理説明は本文に加えない。
- issue: 証人としての使命の地理的広がり
  choice: 具体的な地名から地の果てへ広がる表現をそのまま保つ
  alternative: 全体を象徴的・霊的地理として言い換える
  rationale: 原文はエルサレム、ユダヤ、サマリアを具体的に列挙し、最後に世界の最遠部を示す。特定の教会論的枠組みを付加せず、この緊張と広がりを保持した。
- issue: 聖霊の到来と力を受けることの時間関係
  choice: 「臨むとき」
  alternative: 「臨んだ後」
  rationale: アオリスト分詞は先行性を含み得るが、ここでは到来を契機とする時間関係が中心であり、厳密な時間差を本文で断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「臨む」「証人」「地の果て」によって聖書本文としての品位を保った。敬体で統一し、地名の反復構造と宣言の力強さが伝わる語順に整えた。
