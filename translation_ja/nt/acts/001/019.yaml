id: ACT.1.19
reference: Acts 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: ja
  text: このことはエルサレムに住むすべての人に知れ渡った。その結果、その地所は彼ら自身の言葉[b]で「ハケルダマク」[a]、すなわち「血の地所」と呼ばれるようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 多くの日本語訳では「アケルダマ」と表記される。ギリシア語本文の語形は Ἁκελδαμάχ である。
    reason: alternative_reading
  - marker: b
    text: 別訳「彼ら自身の方言」。ギリシア語の διάλεκτος は、地域的な方言を指すことも、より広く言語を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: 知れ渡った
  rationale: 事柄が広く知られるようになったことを表す非人称的な構文を、自然な現代日本語で表現した。
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: エルサレムに住むすべての人に
  rationale: 分詞表現の居住者という意味と、πᾶσι の包括性を明確に保った。
- source_word: ὥστε
  choice: そのため
  rationale: 後続内容が結果であることを自然に示し、単なる論理的推論には限定しない。
- source_word: κληθῆναι
  choice: 呼ばれるようになった
  rationale: 結果としてその呼称が定着したという文脈上の推移を、日本語として自然に表した。
- source_word: τὸ χωρίον ἐκεῖνο
  choice: その土地
  rationale: χωρίον は畑または一区画の土地を指し得るため、用途を限定しすぎない「土地」とした。後の説明的名称でも同じ語を用いた。
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: 彼ら自身の言葉
  rationale: διάλεκτος が「言語」と「方言」の双方を指し得る曖昧さを保ちつつ、平明な日本語とした。
- source_word: Ἁκελδαμάχ
  choice: ハケルダマク
  rationale: SBLGNT本文の語形と語頭の帯気記号および末尾のχを反映して音写した。慣用形は脚注に示した。
- source_word: τοῦτ’ ἔστιν
  choice: すなわち
  rationale: 直後の語句が名称の意味を説明する注解であることを簡潔に示した。
- source_word: Χωρίον Αἵματος
  choice: 血の土地
  rationale: ギリシア語本文が与える名称の訳を保ち、χωρίον を前半と一貫して「土地」と訳した。
