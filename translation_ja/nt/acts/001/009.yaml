  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: ja
  text: こう言った後、彼らが見ているうちに、イエスは引き上げられた[a]。そして、雲がイエスを彼らの視界から取り去った[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「取り上げられた」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「雲がイエスを受け取り、彼らの目から見えなくした」。
    reason: lexical_alternative
  - marker: c
    text: 聖書では雲が神の臨在を示す場面があり、ここにもその響きがある可能性がある。ただし、この節はそれを明言していない。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: こう言うと
  rationale: 直前のイエスの言葉を受け、アオリスト分詞が主動詞に先立つことを、簡潔で自然な日本語の時間表現で示した。接続詞 καί の物語上の連続性もこの形に含めた。
- source_word: βλεπόντων αὐτῶν
  choice: 彼らが見ている間に
  rationale: 属格独立構文が表す同時的な付帯状況を明確にし、出来事が弟子たちの目の前で起きたことを保った。
- source_word: ἐπήρθη
  choice: 上げられ
  rationale: 受動態と上方への動きを保つ表現。「上って行った」として自発的な動作に変えず、行為者も本文が明示しないままにした。
- source_word: νεφέλη
  choice: 雲
  rationale: 無冠詞単数の名詞を、特定の神学的解釈を本文へ加えずに訳した。日本語では冠詞の区別を明示できないため、単に「雲」とした。
- source_word: ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: 雲に包まれて彼らの目から見えなくなった
  rationale: 直訳的な「雲が彼を受け入れた」より自然な現代日本語で、雲がイエスを視界から取り去ったという文脈上の結果を表した。ただし、動詞の「受け入れる／取り上げる」という語感は脚注に残した。
theological_decisions:
- issue: ἐπήρθη を伝統的な昇天表現として明示するか
  choice: 上げられ
  alternative: 天に上げられ／上って行かれ
  rationale: 原文はこの節で到着先としての「天」を明記せず、受動の行為者も明示しない。「上げられ」は目に見える上昇と神的受動態の可能性を保ちながら、本文以上の説明を加えない。
- issue: νεφέλη に神の臨在を示す神現的意味を明記するか
  choice: 雲
  alternative: 神の臨在の雲／栄光の雲
  rationale: 聖書の他の箇所との響きはあり得るが、この節自体は雲を明示的に神の臨在と同定していない。その可能性は脚注で示し、本文では断定しない。
- issue: ὑπέλαβεν の主体性を直訳で保持するか
  choice: 雲に包まれて彼らの目から見えなくなった
  alternative: 雲がイエスを受け入れ、彼らの目から取り去った
  rationale: 日本語本文としての自然さと場面の明瞭さを優先した一方、雲が文法上の主語であることと「受け入れる」という訳の可能性を脚注で明示し、原文の含みを失わせないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙事の荘重さを保った。「イエス」はギリシア語では代名詞だが、日本語で主語を明確にし、前後の文脈に自然につながるよう補った。脚注記号は、それぞれが説明する語句の直後に配置した。
