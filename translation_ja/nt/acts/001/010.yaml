  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: ja
  text: イエスが行かれる間、彼らが天[a]をじっと見つめていると、見よ、白い衣服[b]を着た二人の男が彼らのそばに立っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「空」。ギリシア語は「天」と「空」のどちらも意味し得るが、ここでは昇天の文脈により「天」とした。
    reason: lexical_alternative
  - marker: b
    text: 「白い衣」または「白い装い」とも訳せる。ギリシア語は衣類を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: じっと見つめていた
  rationale: 一時的に見るのではなく、視線を据えて見続ける意味と継続性を、自然な現代日本語で表す。
- source_word: οὐρανόν
  choice: 天
  rationale: 「空」と「天」のどちらも可能だが、昇天の文脈では「天」が神学的背景に適合する。同時に語義上の別解を脚注に残す。
- source_word: πορευομένου αὐτοῦ
  choice: イエスが進んで行かれる間
  rationale: 属格独立構文が示す同時進行を「間」で表し、πορεύομαιの移動の意味を保つ。「上って行く」など本文にない方向は補わない。代名詞は日本語で指示対象が明確になるよう「イエス」とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 後続の出来事に注意を促す、際立った物語上の標識を、荘重さを保って訳す。「突然」は原語に明示されない意味を加えるため避ける。
- source_word: ἄνδρες δύο
  choice: 二人の男
  rationale: ἀνήρの性別を正確に反映し、この節が明示しない「天使」という同定を訳文に持ち込まない。
- source_word: παρειστήκεισαν
  choice: そばに立っていた
  rationale: 彼らの傍らに立っている状態を自然に表す。「現れた」は動詞自体が明示しない解釈を加えるため避ける。
- source_word: ἐσθήσεσι λευκαῖς
  choice: 白い衣服を着た
  rationale: ἐσθήςは衣類を広く指すため、特定の形状を想定する「長い衣」などではなく、包括的で明瞭な「衣服」とする。日本語として自然になるよう「を着た」で二人を修飾する。
theological_decisions:
- issue: 昇天文脈におけるοὐρανόςの訳
  choice: 天
  alternative: 空
  rationale: この語は空にも天にもなり得るが、イエスの昇天という直近の文脈では「天」が物語の神学的射程をよく表す。ただし原語の曖昧さを失わせないよう「空」を脚注に示す。
- issue: 二人の男の正体
  choice: 二人の男
  alternative: 二人の天使
  rationale: 本文はἄνδρες δύοと述べており、この節だけでは天使と明言していない。文脈から推測される同定を本文に取り込まず、表層の語を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ἰδούは物語上の強調を保つため「見よ」とした。「行かれる」は主語であるイエスへの自然な敬意を示す日本語表現で、移動そのものに解釈を加えない。脚注記号[a][b]は対応箇所に明示した。
