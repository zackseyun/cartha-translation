id: ACT.1.18
reference: Acts 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: ja
  text: さて、この人は不正による報酬で畑を手に入れた[a]。そして、真っ逆さまになって[b]胴体の中央で裂け、はらわたがすべて流れ出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不正への報酬で」とも訳せる。「手に入れた」は、その人が自ら直接買ったことまでを必ずしも意味しない。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「うつ伏せになって」。この句は、頭を先にした状態、あるいは頭からの転落を表すと解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: さて、この人は
  rationale: 直前のユダを指す指示語を保ちつつ、μέν οὖνの談話を進める働きを自然な現代日本語の「さて」で表した。
- source_word: ἐκτήσατο
  choice: 手に入れた
  rationale: 「取得した、所有するに至った」という広い意味を保ち、ユダ本人が直接購入したと限定しない。
- source_word: χωρίον
  choice: 畑
  rationale: 土地の一区画を指す語であり、文脈に即した簡潔で一般的な表現。
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: 不正の報酬で
  rationale: μισθόςの報酬・代価という意味と、ἀδικίαの道徳的含意を保つ。「で」は、その報酬を資金・手段として畑を得た関係を自然に示す。
- source_word: πρηνὴς γενόμενος
  choice: 真っ逆さまになって
  rationale: うつ伏せ、頭から先の姿勢または転落を表す可能性を、文脈上自然で鮮明な表現にした。転落そのものが明示されるかには幅があるため注を付した。
- source_word: ἐλάκησεν μέσος
  choice: 胴の真ん中から破裂し
  rationale: λακάωの裂ける・破裂する意味と、μέσοςの身体中央部を示す働きを明瞭に表した。
- source_word: ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ
  choice: はらわたが全部流れ出た
  rationale: σπλάγχναを具体的かつ過度に医学的でない「はらわた」とし、受動形ἐξεχύθηの流出を自然な日本語で表した。
theological_decisions:
- issue: ユダと畑の取得との関係
  choice: 「畑を手に入れた」とし、取得主体を本文どおりユダに結びつけながら、直接購入したとは明記しない。
  alternative: 「畑を買った」、または「ユダの金で畑が買われた」
  rationale: ἐκτήσατοは取得・所有に至ることを表し得る。マタイ27章との関係を翻訳内で調和させず、取得の仕組みに関する本文の余地と緊張を保つ。
- issue: πρηνὴς γενόμενοςが示す出来事
  choice: 「真っ逆さまになって」と訳し、頭から先の姿勢・転落という有力な意味を示す。
  alternative: 「うつ伏せになって」「頭から落ちて」
  rationale: 語は前かがみ・うつ伏せ・頭から先という状態を示し得るため、単なる姿勢とも明確な転落とも断定しすぎない表現を採用し、別訳を注記する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙述の生々しさは原文どおり保った。「はらわた」は一般読者に理解しやすく、文脈にふさわしい荘重さも損なわない。脚注記号は該当箇所に配置した。
