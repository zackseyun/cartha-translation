id: ACT.1.3
reference: Acts 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: ja
  text: イエスは苦しみを受けた後、数多くの確かな証拠によって、ご自分が生きていることを彼らに示された。そして四十日にわたって彼らに現れ、神の国について語られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷς
  choice: 彼らに
  rationale: 直前の使徒たちを受ける関係代名詞の与格。原文にない「男たち」を加えず、自然な日本語で指示関係を保つ。
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: ご自分が生きていることを彼らに示された
  rationale: 「自らを生きている者として提示した」という構造を、日本語として明瞭かつ自然に表す。復活後に生きている状態が証示されたという意味を保持する。
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: 苦しみを受けた後
  rationale: μετάを伴う冠詞付き不定詞の時間的意味をそのまま表す。「受難」のような教会用語に限定せず、παθεῖνの広がりを保つ。
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: 数多くの確かな証拠によって
  rationale: τεκμήριονは確実性を裏づける証拠を指す。「確かな」は語の証明力を自然な日本語で明示し、ἐνの手段的用法を「によって」で表す。
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: 四十日にわたって
  rationale: διά＋属格が示す期間の広がりを表し、その全期間中ずっと連続して現れていたとの含意を避けつつ、期間内に現れたことを自然に伝える。
- source_word: ὀπτανόμενος αὐτοῖς
  choice: 彼らに現れ
  rationale: 復活顕現の文脈におけるὀπτάνομαιの標準的意味を、簡潔で自然な現代日本語にする。
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: 神の国について語られた
  rationale: τὰ περὶ＋属格を「～について」と自然に表し、βασιλείαを伝統的で広く理解される「国」と訳して、支配と領域の双方の含みを残す。
theological_decisions:
- issue: 復活と証拠の表現
  choice: 苦しみの後、イエスが生きていることを数多くの確かな証拠によって示したと明記する。
  alternative: 苦しみの後、多くの証拠をもって生きた姿を示した。
  rationale: 原文は苦難後の生存と、その確実性を裏づける証拠を明言する。「絶対確実な」などの過剰な強調は避けながら、τεκμήριονの証明力を保持する。
- issue: 神の国の訳語
  choice: 神の国
  alternative: 神の支配
  rationale: βασιλείαには王的支配と領域の両面があり、「神の国」はその曖昧さを保持する定着した訳語である。「神の支配」だけに限定しない。
- issue: οἷςの性別表現
  choice: 彼らに
  alternative: この男たちに
  rationale: 文脈上は使徒たちを指すが、当該語自体に「男たち」という名詞はないため、原文に密着して代名詞で表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬語はイエスの行為を述べる日本語聖書として自然な範囲にとどめた。長いギリシア語一文は二文に分け、論理関係と読みやすさを両立させた。
