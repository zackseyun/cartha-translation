  source_fidelity: 原文の時間関係（苦しみを受けた後）、生きている者として自らを示したこと、多くの証拠、四十日間にわたる顕現、神の国についての教えを、いずれも過不足なく反映している。「四十日にわたって」は、四十日間ずっと現れ続けたという意味ではなく、その期間に及ぶ反復的な顕現を自然に表す。
  naturalness: 明瞭な現代標準日本語として自然である。原文の一文を二文に分けたことも読みやすく、意味上の結び付きは「そして」により十分保たれている。「示された」「語られた」は、イエスについて述べる文脈で不自然でない敬意を帯びた表現である。
  terminology: 「神の国」はβασιλεία τοῦ θεοῦの支配・領域の両義性を不当に限定しない定着した訳語である。「数多くの確かな証拠」はτεκμήριαの確証的な証拠という語感を適切に伝える。「苦しみを受けた後」も、特定の教会用語を押し付けずπαθεῖνを忠実に表している。
