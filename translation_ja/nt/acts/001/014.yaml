reference: Acts 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: ja
  text: この人たちは皆、女性たち[b]、イエスの母マリア、またイエスの兄弟たち[c]と共に、心を一つにして[a]、絶えず祈りに専念していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同じ思いで」または「一致して」。このギリシャ語は、彼らが目的と思いを共有していたことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「女性たちと」。ギリシャ語には冠詞がないが、文脈上、弟子たちと行動を共にしていた一群の女性たちを指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「兄弟たち」はギリシャ語ἀδελφοίの訳。この語を、より広く近親者の意味に理解する見方もあるが、ここでは具体的な関係は示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: この人たちは皆
  rationale: 指示語οὗτοιと、全員を含むπάντεςの双方を、自然な現代日本語で明確に表した。
- source_word: ἦσαν προσκαρτεροῦντες
  choice: 絶えず…専念していた
  rationale: 未完了形の迂言的構文が示す継続的な動作と、προσκαρτερέωが持つ粘り強く専心する意味を表した。
- source_word: ὁμοθυμαδόν
  choice: 心を一つにして
  rationale: 単に同じ場所にいたというだけでなく、意志と目的を共有していたことを表す、自然で格調ある表現を選んだ。
- source_word: τῇ προσευχῇ
  choice: 祈りに
  rationale: προσκαρτερέωの与格目的語として、彼らが専念していた営みを自然な日本語で示した。ギリシャ語の冠詞は日本語では明示しない。
- source_word: σὺν γυναιξίν
  choice: 婦人たち…と共に
  rationale: σύνの共同性を「と共に」で表し、γυναῖκεςは文脈上、弟子たちと行動していた婦人たちの一群を指す可能性を保った。
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: イエスの母マリア
  rationale: 同格表現を日本語として簡潔かつ明瞭に訳し、このマリアが誰かを特定した。
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: またイエスの兄弟たち…と共に
  rationale: 男性複数形ἀδελφοίを基本義に沿って「兄弟たち」と訳し、具体的な親族関係については本文で断定しなかった。反復されるσύνの意味は「また」と共通の「と共に」によって示した。
theological_decisions:
- issue: イエスのἀδελφοίが指す親族関係
  choice: 「イエスの兄弟たち」と訳し、具体的な親族関係は確定しない
  alternative: 実の兄弟、異父または異母の兄弟、近親者などと理解する
  rationale: ἀδελφοίの通常の意味を本文に反映しつつ、それがどのような意味での兄弟かについて本文がここで詳述していないため、教派ごとの解釈を訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、礼拝的な格調を保ちながら古風すぎる言い回しを避けた。「絶えず祈りに専念していた」によって継続性と献身を表し、「心を一つにして」によってルカ文書に特徴的な共同の意志を伝えた。
