  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: ja
  text: しかし、それが神から出たものなら、あなたがたは彼ら[c]を打ち倒すことはできません[a]。そうすると、あなたがたは神と戦う者[b]であることが明らかになるかもしれません。そこで、彼らは彼に説得された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅ぼす」または「崩壊させる」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「神に敵対する者であることが明らかになる」とも訳せる。原語は文字どおりには「神と戦う者」。
    reason: lexical_alternative
  - marker: c
    text: 「彼ら」は最も自然には使徒たちを指すが、その運動や働きを含めて指すと理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: 神から出たもの
  rationale: ἐκ が示す源・起源を明確にし、この計画や働きが神に由来する可能性を自然な日本語で表した。
- source_word: δυνήσεσθε
  choice: できません
  rationale: 未来の能力を表すが、日本語では条件節に続く「できません」で将来的な不可能性が自然に伝わる。
- source_word: καταλῦσαι
  choice: 滅ぼす
  rationale: 人々またはその働きを崩壊させ、存続できなくする意味を簡潔に表す。「打ち倒す」「解体する」という幅は脚注に残した。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 男性複数代名詞を保ち、最も自然な指示対象である使徒たちを指す訳とした。直前の計画や働きを含めて理解する可能性は脚注で示した。
- source_word: μήποτε καὶ
  choice: それどころか、…ことにもなりかねません
  rationale: 望ましくない結果への警告と、καί の「さえ／も」の強意を、明瞭で自然な日本語にした。
- source_word: θεομάχοι
  choice: 神と戦う者
  rationale: 「神と戦う者」を意味する複合語の比喩的な強さを直接保った。
- source_word: εὑρεθῆτε
  choice: 見なされる
  rationale: ある者であることが明らかになる、または判明するという受動的意味を自然に表した。
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: そこで、一同は彼の言葉を受け入れた
  rationale: 議員たちがガマリエルの勧告に説得され、それを受け入れたことを自然な日本語で示した。δέ は文脈上の展開を示す「そこで」とした。
theological_decisions:
- issue: αὐτούς の指示対象
  choice: 最も直接的には使徒たちを指す「彼ら」
  alternative: 前節の「この計画、この働き」を受け、その運動や働きを広く指すと理解する
  rationale: 男性複数形は人物である使徒たちを最も自然に指す。ただし、直前の計画・働きとの意味上のつながりも否定せず、脚注で解釈の幅を残した。
- issue: θεομάχοι の表現
  choice: 神と戦う者
  alternative: 神に敵対する者
  rationale: 原語の強い「戦う」という像を本文に残しつつ、敵対者という意味も脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、議会でのガマリエルの慎重で重みある警告にふさわしい端正な文体とした。「神から出たもの」「神と戦う者」によって、神的起源をめぐる条件性と警告の緊張を保った。
