revisions:
- from: しかし、それが神から出たものなら、あなたがたは彼らを[c]滅ぼすことができません。[a] それどころか、神と戦う者と見なされることにもなりかねません。[b]」そこで、一同は彼の言葉を受け入れた。
  to: しかし、それが神から出たものなら、あなたがたは彼ら[c]を打ち倒すことはできません[a]。そうすると、あなたがたは神と戦う者[b]であることが明らかになるかもしれません。そこで、彼らは彼に説得された。
  rationale: καταλῦσαιには「打ち倒す」を用いて、使徒たちを無効化・破綻させようとする意味を保った。μήποτε καὶの警告的可能性は「そうすると…かもしれません」とした。εὑρεθῆτεは「明らかになる」として、神に敵対する者であることが判明するという意味を表した。αὐτούςの複数・人物的指示と、その代替的理解は本文と脚注で維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:03Z'
