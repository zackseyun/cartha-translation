  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: ja
  text: ところが、大祭司は立ち上がり、彼と共にいた者たち、すなわちサドカイ派[a]の者たちとともに、皆ねたみ[b]に満たされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「サドカイ人の党派」とも訳せる。ギリシア語は、党派、学派、分派などを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「嫉妬」とも訳せる。このギリシア語には「熱心」という意味もあるが、ここでは文脈上、敵意を伴う意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: 立ち上がり
  rationale: アオリスト分詞を、単なる姿勢の変化ではなく行動開始を示すルカの語り口として自然に表した。
- source_word: δὲ
  choice: ところが
  rationale: 直前の民衆の好意的な反応と、指導者たちの敵対的行動との穏やかな対照を示す。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 当該職位を表す日本語の標準的な訳語。
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: その仲間たち
  rationale: 大祭司と行動を共にする一団を簡潔で自然に表し、厳密な役職関係までは読み込まない。πάντεςの全体性は、文脈上この一団全員を指す複数表現に含ませた。
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: すなわちサドカイ派の者たち
  rationale: 同格句として先行する『その仲間たち』を説明する形にした。αἵρεσιςは後代の『異端』という含意を避け、当時の宗教的党派を表す『派』とした。
- source_word: ἐπλήσθησαν
  choice: 満たされた
  rationale: πίμπλημιの受動態と属格による『～に満たされる』という表現を保持した。
- source_word: ζήλου
  choice: ねたみ
  rationale: 語自体には『熱心』の意味もあるが、使徒たちに敵対する直近の文脈では、敵意を伴う嫉妬・ねたみの意味が適切である。
theological_decisions:
- issue: αἵρεσιςの訳し方
  choice: 派
  alternative: 党派、分派
  rationale: 第二神殿期ユダヤ教内の一集団を指すため、後代の教義的断罪を連想させる『異端』を避けた。
- issue: ζῆλοςの文脈的意味
  choice: ねたみ
  alternative: 熱心、嫉妬
  rationale: 語義上の両義性は注で示しつつ、使徒たちを捕らえる行動へ進む敵対的文脈に従って否定的意味を本文に採用した。
translation_notes:
  register: 明瞭な現代標準日本語。聖書本文としての品位を保ちつつ、硬すぎる語順を避けた。原文では単数の『大祭司』に分詞が続き、その後に同伴者全体を含む複数の主動詞となるため、日本語では一団全体が立ち上がったと自然に読める形に統合した。
