  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: ja
  text: すると、ある人がやって来て、彼らにこう報告した。「ご覧ください。あなたがたが牢に入れた者たちが、神殿[a]に立って、民を教えています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿の境内」とも訳せる。ギリシア語の「ヒエロン」は、神殿の聖所そのものに限らず、境内を含む神殿区域を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος δέ τις
  choice: すると、ある人がやって来て
  rationale: δέによる場面の展開と、アオリスト分詞が示す到来後の報告という順序を、自然な現代日本語で表した。τιςの不定性は「ある人」で保持した。
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: 彼らにこう報告した
  rationale: 公的な場で知らせを伝えるἀπαγγέλλωには「報告した」が適切であり、αὐτοῖςは文脈上の指導者たちを明示せず代名詞のまま訳した。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 驚くべき事態へ注意を促す機能を保ちつつ、当局者への発言にふさわしい丁寧で自然な表現とした。
- source_word: οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: あなたがたが牢に入れた者たち
  rationale: ἄνδρεςは成人男性を指すが、日本語では関係節を伴う「者たち」が自然で、対象も明確である。τίθημιはこの文脈で拘禁を表すため「牢に入れた」とした。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿
  rationale: ἱερόνは内陣だけでなく神殿境内全体を指し得る。「神殿」を本文に置き、その範囲を脚注で明確にした。
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: 立って、民を教えています
  rationale: 完了形分詞ἑστῶτεςの結果状態と現在分詞διδάσκοντεςの継続的行為を、進行中の現場報告として自然に表した。「民」はλαόςの簡潔で文体に適した訳語である。
