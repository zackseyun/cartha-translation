id: ACT.5.9
reference: Acts 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: ja
  text: そこで、ペトロは彼女に言った。「どうして二人で、主の霊を試そうと申し合わせたのですか。見なさい。あなたの夫を葬った者たちの足が戸口のところにあります。彼らはあなたを運び出します。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί ὅτι
  choice: どうして……のか
  rationale: 理由を問いながら叱責するギリシア語の語調を、自然な現代日本語で表した。
- source_word: συνεφωνήθη ὑμῖν
  choice: あなたがたは……申し合わせた
  rationale: 受動形と複数の与格が表す相互の合意を、日本語で自然に伝える。「共謀した」ほど強い意味を語そのものに加えない。
- source_word: πειράσαι
  choice: 試そうと
  rationale: ここでは「誘惑する」ではなく、主の霊を試す、すなわち試みにかける意味が文脈に適する。
- source_word: τὸ πνεῦμα κυρίου
  choice: 主の霊
  rationale: 属格構文を簡潔に保ち、「聖霊」と説明的に拡張せず、原文の表現を維持した。
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 聞き手の注意を直ちに向ける談話標識として、現代日本語で明瞭かつ厳粛な表現を選んだ。
- source_word: οἱ πόδες τῶν θαψάντων
  choice: 葬った者たちの足
  rationale: 原文の鮮烈な換喩を保持した。「足音」とする理解も可能だが、原文は文字どおり「足」と述べる。
- source_word: τὸν ἄνδρα σου
  choice: あなたの夫
  rationale: 文脈上、ἀνήρ はサッピラの夫アナニアを指す。
- source_word: ἐπὶ τῇ θύρᾳ
  choice: 戸口にある
  rationale: 埋葬した者たちが入口に到着しているという目前の状況を表しつつ、「足」という主語を保持した。
- source_word: ἐξοίσουσίν σε
  choice: 彼らはあなたを運び出す
  rationale: 死体であることは文脈から明らかだが、原文にない「遺体」を補わず、不吉な直接性を保った。
theological_decisions:
- issue: 「主の霊」の指示対象
  choice: 「主の霊」と訳し、聖霊を指す可能性を保つ
  alternative: 「聖霊」と明示する／より一般的な主の霊的臨在と取る
  rationale: 使徒言行録5章3節との連続から聖霊を指す蓋然性は高いが、原文を解釈的に拡張せず「主の霊」を保持した。
- issue: ペトロの告発における合意の強さ
  choice: 「申し合わせた」
  alternative: 「共謀した」
  rationale: 文脈には明白な共謀性があるものの、συμφωνέω 自体の中心義は合意することであるため、強い道徳的断罪を動詞へ過度に織り込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ペトロの厳しい叱責と原文の切迫感を保った。「足」という鮮烈な表現は平滑化せず残し、文末は予告の断定性が伝わる形にした。
