revisions:
- from: すると、ペトロは彼女に言った。「どうしてあなたがたは、主の霊を試そうと申し合わせたのか。[a] 見なさい。あなたの夫を葬った者たちの足が、もう戸口にある。[b] 彼らはあなたを運び出す。」
  to: そこで、ペトロは彼女に言った。「どうして二人で、主の霊を試そうと申し合わせたのですか。見なさい。あなたの夫を葬った者たちの足が戸口のところにあります。彼らはあなたを運び出します。」
  rationale: 脚注bは原文の字義的表現を「足音」という別の内容へ寄せるため削除した。本文では「二人で」によって ὑμῖν の相互性を明示し、「戸口のところにあります」によって「足」という原文の鮮烈な換喩を保ちつつ自然な現代日本語に整えた。原文にない「遺体」や「共謀」といった解釈的補足は加えていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:43Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として原文に忠実である。συνεφωνήθη ὑμῖν の相互的な合意、πειράσαι の「試す」、τὸ πνεῦμα κυρίου の「主の霊」、および ἐξοίσουσίν σε の直接的な予告はいずれも適切に訳出されている。ただし、οἱ πόδες…ἐπὶ τῇ θύρᾳ は「足が戸口にある」より、「足が戸口のところにある」とした方が、原文の視覚的で字義的な表現を日本語として無理なく保てる。
  naturalness: 「すると」は前節との接続として不自然ではないが、δὲ の軽い場面転換には「そこで」がより自然である。また、「主の霊を試そうと申し合わせたのか」は明瞭だが、主語を重ねず「どうして二人で…申し合わせたのですか」とすることで、ὑμῖν の相互性と、ペトロが彼女に向けて発する問いとしての自然さが増す。
  terminology: 「ペトロ」「主の霊」「夫」「葬った者たち」は適切である。「主の霊」は「聖霊」と拡張せず、原文の語形と指示対象の含みを保っている。「申し合わせる」は「共謀する」ほどの評価語を加えず、συμφωνέω にふさわしい。
  issues:
  - severity: medium
    issue: 脚注bが「足」を「足音」と理解できるとしている。
    rationale: 原文は οἱ πόδες（足）を明示しており、この場面では埋葬した者たち自身が戸口にいることを、彼らの「足」によって生々しく表す。日本語で「足音」とするのは可能な連想ではあっても、原文の代替読解として提示するには根拠が弱く、意味を狭めるおそれがある。脚注は削除するのが安全である。
  - severity: low
    issue: 「足が、もう戸口にある」は字義性を保つ一方、日本語としてやや硬く不自然である。
    rationale: 「戸口のところにある」とすれば、ἐπὶ τῇ θύρᾳ の位置関係と原文の「足」という表現を保ったまま、現代標準日本語として滑らかになる。
  revised_text: そこで、ペトロは彼女に言った。「どうして二人で、主の霊を試そうと申し合わせたのですか。見なさい。あなたの夫を葬った者たちの足が戸口のところにあります。彼らはあなたを運び出します。」
  revised_footnotes:
  - marker: a
    text: 「申し合わせた」は、直訳すれば「あなたがたの間で合意された」。
    reason: συνεφωνήθη の受動形と、ὑμῖν が示す相互の合意を補足するため。
  revision_rationale: 脚注bは原文の字義的表現を「足音」という別の内容へ寄せるため削除した。本文では「二人で」によって ὑμῖν の相互性を明示し、「戸口のところにあります」によって「足」という原文の鮮烈な換喩を保ちつつ自然な現代日本語に整えた。原文にない「遺体」や「共謀」といった解釈的補足は加えていない。
