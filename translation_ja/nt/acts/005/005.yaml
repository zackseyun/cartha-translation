id: ACT.5.5
reference: Acts 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: ja
  text: アナニアがこれらの言葉を聞くと、倒れて息絶えた[a]。そして、聞いていたすべての人々[b]に、大きな恐れが生じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「息を引き取った」とも訳せる。
    reason: ἐξέψυξενは死を意味し、語としては息・命が尽きるという含みを持つため。
  - marker: b
    text: 原文は「聞いていたすべての人」とだけ述べ、何を聞いたのかを明示していない。
    reason: 分詞ἀκούονταςには目的語が示されていないため、本文でも聞いた内容を限定しない。
lexical_decisions:
- source_word: ἀκούων
  choice: 聞くと
  rationale: 現在分詞を時を表す表現として訳し、ペテロの言葉を聞いた直後の展開を自然な日本語で示した。
- source_word: δὲ
  choice: （独立した接続語を置かず、文脈上の転換を「聞くと」で表現）
  rationale: δέの弱い転換・対照は、日本語では明示的に「しかし」とすると強すぎるため、出来事の急展開によって表した。
- source_word: λόγους τούτους
  choice: この言葉
  rationale: 直前のペテロの発言を指す。日本語では集合的な単数形「言葉」が自然である。
- source_word: πεσὼν
  choice: 倒れて
  rationale: 身体的に倒れたという原文の具体的な像を保ち、「崩れ落ちた」などの解釈的な表現を避けた。
- source_word: ἐξέψυξεν
  choice: 息絶えた
  rationale: 死を明瞭に伝えつつ、語が持つ「息を引き取る」という像もある程度保持する。
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: 大きな恐れに襲われた
  rationale: 恐れが人々の上に及んだことを、明瞭で自然な現代日本語として表した。
- source_word: πάντας τοὺς ἀκούοντας
  choice: これを聞いた人々は皆
  rationale: 分詞の名詞的用法とπάνταςの包括性を自然に表した。「これ」は文脈上、この死を含む出来事を指すが、原文では聞いた対象が明示されていないため注で示した。
- source_word: Ἁνανίας
  choice: アナニア
  rationale: 日本語聖書で定着している標準的な音写を用いた。
theological_decisions:
- issue: アナニアの死の原因・仕組み
  choice: 倒れて即座に死んだ出来事をそのまま述べ、死を引き起こした仕組みは特定しない。
  alternative: 神が直接打って死なせた、または衝撃による自然死だったと明示する。
  rationale: 原文はアナニアが倒れて息絶えたとは述べるが、その機序を説明していないため、物語の強さを保ちながら原因を補わない。
- issue: 最後の「聞いた」の対象
  choice: 本文では文脈に沿って「これ」とし、注で原文の非明示性を保つ。
  alternative: ペテロの言葉を直接聞いた人々、または出来事の知らせを後から聞いた人々のいずれかに限定する。
  rationale: τοὺς ἀκούονταςには目的語がなく、直接の聴衆と伝聞で知った人々の範囲を原文だけから限定できない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語にふさわしい簡潔さと厳粛さを保った。「息絶えた」「大きな恐れに襲われた」により、過度に口語的にも古風にもならない格調を目指した。
