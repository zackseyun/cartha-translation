  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: ja
  text: そして彼は彼らに言った。「イスラエルの皆さん、この者たちに対して何をしようとしているか、よく考えなさい。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「これらの人々に関して何をしようとしているか、自分たち自身に注意しなさい」。
    reason: προσέχετε ἑαυτοῖςの再帰的な表現と、ἐπὶ τοῖς ἀνθρώποις τούτοις（「これらの人々に関して」）という構造を示すため。
lexical_decisions:
- source_word: εἶπέν τε
  choice: そして彼は言った
  rationale: τέは前の叙述との軽い連結を示すため、推論や強い時間的順序を加えず「そして」とした。
- source_word: πρὸς αὐτούς
  choice: 彼らに
  rationale: λέγωと共に用いられたπρός＋対格は発言の相手を示すので、自然な日本語の「彼らに」とした。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: イスラエルの皆さん
  rationale: イスラエル人男性たちへの正式な呼びかけ。日本語では「イスラエルの人々」より直接の呼びかけとして自然であり、聴衆への敬意も表す。文脈上、議会の男性構成員への発言であることは保たれる。
- source_word: προσέχετε ἑαυτοῖς
  choice: よく注意しなさい
  rationale: 再帰代名詞を伴う命令は、自分たちの行動について慎重になるよう警告する表現。「気をつけなさい」も可能だが、審議の場にふさわしい品位と慎重さを「よく注意しなさい」で表した。
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: この者たちを
  rationale: 注意の対象・検討事項を示し、ここでは使徒たちに対して取ろうとする行動にかかる。「この者たちに対して」より自然な構文としつつ、「敵対して」という意味までは加えていない。
- source_word: τί μέλλετε πράσσειν
  choice: どうしようとしているのか
  rationale: μέλλω＋不定詞が示す目前の意図・将来の行動を「しようとしている」で表現した。τίはここでは行動内容を問うため、自然な日本語の「どう」とした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた公的発言の文体とした。「この者たち」は話者が目前の集団を指す場面に合い、「こいつら」のような軽蔑は含ませない。脚注記号[a]は注意命令全体の直訳的構造を補足する位置に置いた。
