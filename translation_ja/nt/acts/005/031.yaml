  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: ja
  text: 神はこの方を、指導者また救い主として、ご自分の右の座に上げられました[a]。これは、イスラエルに悔い改めと罪の赦しを与えるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分の右の手によって上げられました」。ギリシア語は手段を表すとも読めるが、ここでは神の右にある、最高の誉れと権威の座への高揚を指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: この方を
  rationale: 指示代名詞の強調を保ちつつ、イエスを指す日本語として自然で敬意ある表現とした。
- source_word: ἀρχηγὸν
  choice: 指導者
  rationale: 先頭に立つ者、統治する者という広がりを持つ語。現代日本語で明瞭であり、「君主」などに限定しすぎない。
- source_word: σωτῆρα
  choice: 救い主
  rationale: 救出する者という意味と、本文のキリスト論的な重みをともに保つ定着した訳語。
- source_word: ὕψωσεν
  choice: 高く上げられました
  rationale: 単なる復活ではなく、誉れと権威ある地位への高揚を表す。日本語として「高く上げる」が原語の比喩を明瞭に保つ。
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: ご自分の右に
  rationale: 文脈上、神の右という最高の誉れある位置への高揚と理解した。ただし与格には手段の解釈も可能なので脚注に残した。
- source_word: τοῦ δοῦναι
  choice: 与えるため
  rationale: 冠詞付き不定詞の目的用法を、自然で明示的な日本語にした。
- source_word: μετάνοιαν
  choice: 悔い改め
  rationale: 単なる心変わりではなく、神へ向き直ることを含む新約聖書上の意味を伝える、明瞭で定着した訳語。
- source_word: τῷ Ἰσραὴλ
  choice: イスラエルに
  rationale: δίδωμιの受け手を示す与格をそのまま自然に表した。
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: 罪の赦し
  rationale: 罪が赦されることを明瞭かつ簡潔に表す、定着した新約聖書の表現。
theological_decisions:
- issue: 神の右への高揚の意味
  choice: 神がイエスを、ご自分の右という最高の誉れと権威の座に高く上げたと訳す。
  alternative: 神がご自分の右の手によってイエスを高く上げた。
  rationale: 高揚・即位を表す新約聖書の慣用と文脈は位置的解釈を支持するが、ギリシア語の与格は手段を表す可能性もあるため、代替解釈を脚注に示した。
- issue: μετάνοιαの意味
  choice: 「悔い改め」と訳し、神へ向き直る応答を表す。
  alternative: 「心の変化」または「方向転換」。
  rationale: 原語には認識や意志の変化が含まれるが、この文脈で単なる心理的な考え直しに狭めるのは不十分である。日本語の聖書用語として定着し、宗教的文脈でも理解可能な「悔い改め」を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、口語的になりすぎない品位を保った。「この方」で指示語の強調と敬意を両立させ、目的節は文を分けて読みやすくした。
