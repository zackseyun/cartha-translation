revisions:
- from: 使徒たちの手を通して、民の間で多くのしるしと不思議な業が行われていた。彼らは皆、心を一つにして[a]ソロモンの回廊[b]に集まっていた。
  to: 使徒たちの手を通して、民の間で多くのしるしと不思議な出来事が行われていた。彼らは皆、心を一つにして[a]ソロモンの回廊[b]にいた。
  rationale: 原文が述べる所在を「にいた」と訳し、集合する行為を加えないようにした。「不思議な業」を「不思議な出来事」に改め、τέραταの出来事としての意味を中立的に保った。主語「彼ら」の指示対象は限定せず、ὁμοθυμαδόνの一致の含意は本文と注で保持した。
