source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: ja
  text: 使徒たちの手を通して、民の間で多くのしるしと不思議な出来事が行われていた。彼らは皆、心を一つにして[a]ソロモンの回廊[b]にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「皆で一致して」。この語は、思いや目的の一致を表します。
    reason: lexical_alternative
  - marker: b
    text: 「回廊」は、柱が並ぶ屋根付きの通路です。別訳「ソロモンの柱廊」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: 使徒たちの手を通して
  rationale: διά＋属格の手段・媒介を示す働きと、原文の具体的な「手」という表現を保った。
- source_word: δὲ
  choice: （独立した接続語としては訳出しない）
  rationale: ここでは強い対立ではなく叙述の進行を示す。日本語では文脈上、接続語を補わないほうが自然である。
- source_word: ἐγίνετο
  choice: 行われていた
  rationale: 未完了過去が表す、過去における継続的・反復的な出来事を示す。
- source_word: σημεῖα καὶ τέρατα
  choice: しるしと不思議な業
  rationale: ルカ文書で奇跡的な出来事を表す定型的な組み合わせ。「不思議」だけでは現代日本語で出来事を指しにくいため、「業」を補った。
- source_word: πολλὰ ἐν τῷ λαῷ
  choice: 民の間で多くの
  rationale: πολλάが「しるしと不思議な業」の双方を修飾することと、ἐνが活動の範囲を示すことを自然な日本語で表した。
- source_word: ὁμοθυμαδὸν
  choice: 心を一つにして
  rationale: 単なる同一場所への集合だけでなく、一致した思いや目的という語の含意を明示する。
- source_word: ἅπαντες
  choice: 皆
  rationale: 対象となる集団全体を指す包括性を簡潔に表す。
- source_word: Στοᾷ Σολομῶντος
  choice: ソロモンの回廊
  rationale: στοάは柱の並ぶ屋根付き回廊を指す。「回廊」は現代日本語で明瞭かつ簡潔である。
theological_decisions:
- issue: 「彼らは皆」の指示対象
  choice: 「彼ら」として指示対象を限定しない
  alternative: 使徒たちだけ、または信者全体と明示する
  rationale: ギリシア語では主語の指示対象が明示されていないため、使徒だけ、あるいは信者全体のどちらかに翻訳で限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「民」は聖書本文にふさわしい簡潔な語として用い、原文以上に「イスラエルの民」とは限定しない。
