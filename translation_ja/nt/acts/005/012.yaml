    issue: 「集まっていた」が集合行為を付加している
    rationale: 原文はκαὶ ἦσαν ... ἐν τῇ Στοᾷという所在の叙述であり、「集まる」という動作は明示しない。主語の範囲にも解釈上の幅があるため、「いた」として留めるべきである。
  - severity: low
    issue: 「不思議な業」はτέραταの意味をやや狭める
    rationale: τέραταは驚異・不思議な出来事を指す語であり、「業」は行為者の働きをやや前景化する。「不思議な出来事」がより直接的で中立的である。
  - severity: low
    issue: 注aが物理的集合を語の意味として含意している
    rationale: ὁμοθυμαδόνの中心義は一致・共同の思いである。場所にいることは文全体のἐν τῇ Στοᾷから示されるため、注は語そのものの一致の意味に限定する。
  revised_text: 使徒たちの手を通して、民の間で多くのしるしと不思議な出来事が行われていた。彼らは皆、心を一つにして[a]ソロモンの回廊[b]にいた。
