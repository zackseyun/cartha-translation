  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: ja
  text: こう言った。「私たちは、この名によって教えてはならないと、厳しく命じた。それなのに、見よ、あなたがたは自分たちの教えでエルサレムを満たし、あの人の血を私たちの上にもたらそうとしている[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、「あの人を死なせた責任を私たちに負わせようとしている」という意味。原文は「あの人の血を私たちの上にもたらす」と表現し、流された血についての責任を負わせることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: 厳しく命じておいた
  rationale: 同語根の名詞と動詞を重ねた強意を、自然な現代日本語で表した。「命令をもって命じた」のような不自然な直訳は避けた。
- source_word: μὴ διδάσκειν
  choice: 教えてはならない
  rationale: 命令の内容である禁止を明確に表し、「教えるのをやめよ」として継続中止の意味を必要以上に加えない。
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: この名によって
  rationale: 単に「この名について」ではなく、その名を根拠または権威として教える含みを保つ。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 相手の注意を鋭く促す対決的な力を保ちつつ、聖書本文として簡潔で格調ある表現とした。
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: エルサレムを満たし
  rationale: 完了形の、すでに満たして現在もその状態にあるという効果を文脈上伝え、原文の比喩も保持する。
- source_word: τῆς διδαχῆς ὑμῶν
  choice: 自分たちの教えで
  rationale: 「教理」より一般読者に明瞭な「教え」を用い、属格は満たす内容を示す「で」とした。再帰的な「自分たちの」は非難の調子を自然に表す。
- source_word: βούλεσθε
  choice: もたらそうとしている
  rationale: 意志・意図を表す語を、不自然に断定を強めず、告発口調に合う日本語で示した。
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: 私たちの上にもたらす
  rationale: 責任や罪を負わせる慣用的意味を含むが、原文の「上に血をもたらす」という像を本文で保持した。
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: あの人の血
  rationale: 話者がイエスの名を避けて距離を置く調子を「あの人」で表し、血による死の責任という原文の慣用的比喩を残した。
theological_decisions:
- issue: 「あの人の血を私たちの上にもたらす」の含意
  choice: 本文では血を上にもたらすという原文の比喩を保持し、脚注で死の責任を負わせる意味を説明する。
  alternative: 「あの人を死なせた責任を私たちに負わせる」と本文で明示する。
  rationale: 原文は血の責任・流血の罪を示唆する慣用句だが、説明的に置き換えるとその比喩と神学的緊張が失われるため。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、宗教指導者による厳しい詰問の調子を保った。「見よ」と血の比喩には、原文の格調と対決的な力を残している。
