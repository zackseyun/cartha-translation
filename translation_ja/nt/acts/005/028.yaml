  terminology: 「この名によって」は、名を権威・根拠として教えるというἐπὶ τῷ ὀνόματιの含みを保つ。「あの人の血」は、固有名を避ける敵対的な指示と、血責任の比喩を保持している。脚注は本文の比喩を説明しており、本文を不必要に解釈的にしていない。
