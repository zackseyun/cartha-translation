id: ACT.5.20
reference: Acts 5:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: ja
  text: 「行って、神殿の境内[a]に立ち、このいのちについてのことばをすべて[b]、民に語りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿内」とも訳せる。ギリシア語は、聖所の建物だけでなく、中庭を含む神殿の区域全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「このいのちのことばをすべて」。「このいのちについてのすべてのことば」とも訳せる。ここでの「いのち」は、福音によって告げられるいのちを指すと考えられるが、原文の表現には幅がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: 行って
  rationale: 移動して次の行動に移るよう命じる現在命令形。日本語では後続の命令につなぐ「行って」が自然である。
- source_word: σταθέντες
  choice: 立ち
  rationale: アオリスト分詞を、主命令に伴う行為として自然な連用形で表した。「立って」とも訳せるが、簡潔で格調ある命令の流れを保つ。
- source_word: λαλεῖτε
  choice: 語りなさい
  rationale: 継続的に話すことを命じる現在命令形。「宣べ伝えなさい」では原語自体に明示されない宣教的含意を強めるため、より広い「語りなさい」とした。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内に
  rationale: ἱερόνは内陣そのものではなく神殿複合施設を指す。この場面で人々に語る場所として誤解の少ない「神殿の境内」とした。
- source_word: τῷ λαῷ
  choice: 民に
  rationale: 神殿に集う人々、また文脈上イスラエルの民を指しうる。「群衆」と限定せず、原語の聖書的な響きも保つ。
- source_word: πάντα τὰ ῥήματα
  choice: ことばをすべて
  rationale: πᾶςとῥῆμαの双方を明示し、「メッセージ」と意訳せず原文の表現を保った。
- source_word: τῆς ζωῆς ταύτης
  choice: このいのちについての
  rationale: 属格を日本語で自然な関係表現にした。「このいのちの」も形式上可能だが、日本語では意味関係が不明瞭になりやすい。「についての」は、福音が告げるいのちを指す可能性を示しつつ、その内容を「新しい生き方」などに限定しない。
theological_decisions:
- issue: τῆς ζωῆς ταύτης（このいのち）の意味
  choice: 「このいのちについての」とし、「いのち」の内容を説明的に限定しない。
  alternative: 「このいのちの」「この生き方についての」「いのちを与える」
  rationale: この句は、イエスに結びつく救いのいのち、使徒たちが告げるいのち、またその生き方を含みうる。原文の凝縮された神学的幅を保つため、「新しい」「永遠の」などを補わない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、天使の命令として簡潔で格調ある調子を保った。「生命」ではなく、聖書的・人格的な響きを持つ「いのち」と表記した。
