base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: ja
  text: 教会全体と、これらのことを聞いたすべての人に、大きな恐れが広がった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「教会」は「集会」または「会衆」とも訳せる（ἐκκλησία）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 生じた
  rationale: φόβοςを主語とする出来事の発生を自然な現代日本語で表す。後続のἐπί句が影響の及んだ対象を示すため、「生じた」で出来事性を保った。
- source_word: φόβος μέγας
  choice: 大きな恐れ
  rationale: アナニアとサッピラへの裁きの直後という文脈では、畏敬だけに限定せず、恐怖や畏れを含み得る「恐れ」が適切である。μέγαςは「大きな」として強意を保った。
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: 教会全体に
  rationale: ἐκκλησίαはここでは信者の共同体を指す。「教会」は日本語で標準的であり、ὅληνの包括性を「全体」で明示した。ἐπίの及ぶ対象は助詞「に」で自然に表した。
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: このことを聞いたすべての人に
  rationale: 分詞ἀκούονταςを日本語の連体節「聞いた」で自然に表し、πάνταςを「すべての人」とした。ταῦταは直訳すれば複数だが、日本語では一連の出来事を指す「このこと」が自然である。
theological_decisions:
- issue: ἐκκλησίαの訳語
  choice: 教会
  alternative: 集会、会衆
  rationale: 使徒言行録におけるキリスト者の共同体を指す標準的な訳語として「教会」を採用した。ただし語自体には「集会」「会衆」の意味もあるため、脚注で代案を示し、特定の教会制度を本文以上に読み込まないようにした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「こうして」でκαίの叙述上の帰結を表し、「恐れ」が教会内外の双方に及んだ並列構造を維持した。
