  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: ja
  text: 三時間ほどたってから、何が起こったのかを知らないまま、彼の妻が入って来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: たってから
  rationale: Ἐγένετοはここでは次の出来事を導く物語上の慣用表現であり、δὲは穏やかな展開を示す。日本語では独立した「さて」などを加えず、時間節から自然に続けることで両者の機能を表した。
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: 三時間ほどたってから
  rationale: διάστημαは時間の隔たりを示し、ὡςはここで数量のおおよそを表す。「三時間ほど」で近似性を保ち、「たってから」で経過時間を自然な現代日本語にした。
- source_word: ἡ γυνὴ αὐτοῦ
  choice: 彼の妻
  rationale: 文脈上、γυνήはアナニアの配偶者を指すため「妻」とした。αὐτοῦは直前の男性を受けて「彼の」とした。
- source_word: μὴ εἰδυῖα τὸ γεγονὸς
  choice: 何が起こったのかを知らないまま
  rationale: 否定された分詞は、妻が入って来た時点で事情を知らなかったという付帯状況を表す。「知らないまま」により主動詞と同時の状態を自然に示し、τὸ γεγονὸςは「何が起こったのか」とした。
- source_word: εἰσῆλθεν
  choice: 入って来た
  rationale: 場面の中へ入る動きを表す。日本語の物語として自然な視点を保つため「入って来た」とした。
