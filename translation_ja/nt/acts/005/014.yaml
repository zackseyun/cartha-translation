  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: ja
  text: そして、主を信じる者たち、すなわち男も女も大勢の人々が、ますます加えられていった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「加わっていった」とも訳せる。ギリシア語の動詞は、人数が継続的に増えていたことを表す。受動的に理解する場合、神が彼らを加えていたことが暗に示されている可能性がある。
    reason: προσετίθεντοには受動的な理解のほか、中動・自動詞的に「加わる」と理解しうる余地があることを示すため。
lexical_decisions:
- source_word: μᾶλλον
  choice: ますます
  rationale: 人数が継続的に増していく比較・強調の意味を、自然な現代日本語で表す。
- source_word: δὲ
  choice: そして
  rationale: ここでは強い逆接ではなく、前後をつなぐ穏やかな叙述上の接続を示す。
- source_word: προσετίθεντο
  choice: 加えられていった
  rationale: 未完了過去の継続的な進行と受動形をともに保つ。行為者を明示せず、神が加えたという含みも残す。
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: 主を信じる者たち
  rationale: 現在分詞の名詞的用法と、主に向けられた信頼を明瞭で自然な日本語にする。
- source_word: κύριος
  choice: 主
  rationale: 原文の尊称およびキリスト論的な力を保ち、指示対象を本文で説明的に「イエス」と言い換えない。
- source_word: πλήθη
  choice: 大勢
  rationale: 非常に多くの人々という規模を自然に伝える。複数形が男女それぞれの大集団を意識させうる点も、後続表現によって保つ。
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: 男も女も
  rationale: τε καίの相関的な「双方」の意味と、原文が男女を明記している点を簡潔に保持する。
theological_decisions:
- issue: 「主」の指示対象と意味
  choice: 本文では「主」とし、主に対する信仰を表す
  alternative: 指示対象を明示して「イエスを信じる者たち」とする、または一般的に神を指すと理解する
  rationale: 使徒言行録の宣教要約では復活したイエスを指す可能性が高いが、原文どおり称号を保持し、訳文だけで指示対象を説明的に限定しない。
- issue: προσετίθεντοの態と相
  choice: 継続的な受動として「加えられていった」
  alternative: 中動・自動詞的に「加わっていった」とする
  rationale: 受動形を保持することで、人数の継続的増加を示しつつ、神が暗黙の行為者である可能性を残す。原文にない主語を補わない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての簡潔さと品位を保った。「男も女も大勢であった」はπλήθη ἀνδρῶν τε καὶ γυναικῶνの同格的な説明を独立文にして、過度に長い一文を避けた。
