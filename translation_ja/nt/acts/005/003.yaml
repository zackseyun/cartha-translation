revisions:
- from: しかし、ペテロは言った。「アナニア、なぜサタンがあなたの心を満たし、あなたは聖霊にうそをつき[a]、土地[c]の売却代金の一部[b]をひそかに取っておいたのか。」
  to: しかし、ペテロは言った。「アナニア、なぜサタンがあなたの心を満たして、あなたに聖霊に偽りを言わせ、土地[c]の売却代金の一部[b]を取っておかせたのか。」
  rationale: 原文の「サタンが満たす」＋不定詞句という関係を、日本語で自然に表すため「あなたに…言わせ、…取っておかせた」とした。この使役形はサタンの働きとアナニアの行為の結び付きを表すものであり、完全な支配、不可抗力、またはアナニアの責任の免除を付加するものではない。本文で脚注aへの参照が必要なので、「偽りを言わせ」の直後に[a]を置く。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:49Z'
