  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: ja
  text: しかし、ペテロは言った。「アナニア、なぜサタンがあなたの心を満たして、あなたに聖霊に偽りを言わせ、土地[c]の売却代金の一部[b]を取っておかせたのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直訳に近くは「代金から一部を」。すなわち売却で得た代金の一部を指す。
    reason: lexical_clarification
  - marker: c
    text: 「不動産」または「畑」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: しかし、ペテロは言った
  rationale: δέは弱い接続辞だが、ここでは直前の出来事を受けてペテロの追及へ転じるため、「しかし」が文脈上自然である。
- source_word: διὰ τί
  choice: なぜ
  rationale: 理由を問う一般的で自然な現代日本語として訳した。
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: サタンがあなたの心を満たし
  rationale: サタンを動作主とする原文と「心を満たす」という比喩を保ち、支配や強制という解釈を加えない。
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: あなたは聖霊にうそをつき
  rationale: ψεύδομαιが対人目的語を伴う直接的な表現を、自然な日本語で再現した。σεを明示してアナニア本人の行為であることも保った。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語の聖書用語として定着した、明瞭で簡潔な訳語である。
- source_word: νοσφίσασθαι
  choice: 一部をひそかに取っておいた
  rationale: 自分のために一部を隠して留保するという語の含意を表しつつ、「横領した」ほど法的・解釈的に限定しない。
- source_word: ἀπὸ τῆς τιμῆς
  choice: 売却代金の一部
  rationale: ἀπό＋属格が全体からの一部を示すため「一部」を補い、売却の文脈におけるτιμήを「売却代金」と明確にした。
- source_word: τοῦ χωρίου
  choice: 土地
  rationale: χωρίονは土地、畑、不動産を指し得るが、この売却記事では「土地」が自然で、意味を過度に狭めない。
theological_decisions:
- issue: サタンがアナニアの心を満たしたことと本人の責任
  choice: 「サタンがあなたの心を満たし」と原文の動作主と比喩を保ち、続いて「あなたは」と本人の行為を示した。
  alternative: 「なぜサタンに心を支配させたのか」または「なぜサタンがあなたを操ったのか」
  rationale: 原文はサタンの働きとアナニアの行為をともに述べるが、憑依、完全な支配、不可抗力のいずれとも明言しない。その緊張を解消せずに残す。
- issue: 聖霊に対する偽りの人格的表現
  choice: 「聖霊にうそをつき」と直接訳した。
  alternative: 「聖霊を欺き」または「聖霊の前で偽りを言い」
  rationale: 原文の直接的で人格的な関係表現を保ち、聖霊論について本文以上の説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ペテロの厳しい問いの調子と「心を満たす」という原文の比喩を保持した。「うそをつく」は日常的で理解しやすいが、文全体の語調によって品位を保っている。
