  source_fidelity: 「最高法院」はこの文脈の指示対象としては理解可能ですが、συνέδριον自体は「評議会／議会」であり、「法院」は司法機関に限定する響きが強く、また「最高」は原語に明示されません。「評議会」とし、脚注でサンヘドリンという具体的な指示対象を示すほうが、原語の語義と文脈の双方に忠実です。ἔστησανの具体性は「前に立たせた」で適切に保たれます。
  naturalness: 「彼らを連れて来て、彼らを評議会の前に立たせた。そして、大祭司が彼らに尋ねた。」は、出来事を回想する叙述として自然です。「連れて来ると」は文脈によっては反復・一般条件のようにも読めるため、ここでは過去の連続動作を明示する「連れて来て」がより明瞭です。「そこで」は因果・帰結を含み得るため、穏やかな接続のδέには「そして」がより適切です。
  terminology: 「大祭司」はἀρχιερεύςの標準的で適切な訳語です。συνέδριονは本文で「評議会」と訳し、脚注で「サンヘドリン」を別称として示します。これにより、現代の特定の裁判所制度を連想させる「最高法院」を避けつつ、歴史的な指示対象を失いません。
  issues:
