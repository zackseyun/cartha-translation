lexical_decisions:
- source_word: Ἀγαγόντες
  choice: 彼らを連れて来ると
  rationale: アオリスト分詞が主動詞に先立つ動作を表すため、自然な日本語で時間的な連続を示した。
- source_word: δὲ
  choice: （訳語を立てない）
  rationale: 物語を穏やかに進める接続辞であり、日本語では文の流れによって機能が十分に表される。
- source_word: ἔστησαν
  choice: 立たせた
  rationale: ἵστημιの他動詞的用法「立たせる、置く」を具体的に保ち、審理の場に引き出された情景を示す。
- source_word: ἐν τῷ συνεδρίῳ
  choice: 最高法院の前に
  rationale: συνέδριονはこの文脈ではユダヤの最高統治・司法機関を指す。「最高法院」は現代日本語で役割を明確にし、「前に」はἔστησανとの自然な結び付きを示す。
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: ἐπερωτάωの基本義を保つ。司法的文脈は周囲から明らかであり、「尋問した」として強さを加えすぎない。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 当時のユダヤ教における職名として定着した、正確で自然な訳語。
theological_decisions:
- issue: συνέδριονの訳し方
  choice: 最高法院
  alternative: 議会／サンヘドリン
  rationale: 固有名詞風の音写を避けつつ、この文脈でのユダヤ最高評議機関という指示対象を明確にした。脚注で別称を示し、原語の制度的含意を補う。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「連れて来ると」で叙述のテンポを整え、「立たせた」によって原文の具体性を保持した。
