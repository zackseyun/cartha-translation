lexical_decisions:
- source_word: ἀναστάντες
  choice: 立ち上がって
  rationale: 行動を起こすために立ったことを表すアオリスト分詞。日本語の物語として自然に、後続の動作へつなげた。
- source_word: δὲ
  choice: すると
  rationale: 物語の展開を進める接続辞。直前の出来事を受けた次の動作として自然に表した。
- source_word: οἱ νεώτεροι
  choice: 若い者たち
  rationale: νεώτεροι は比較級形で「より若い者たち」とも、一般的に「若者たち」とも取れる。本文では自然な「若い者たち」とし、比較級の可能性を脚注に残した。文脈上男性であることは動作から理解できるため、過度に限定的な語を避けた。
- source_word: συνέστειλαν
  choice: 彼を包み
  rationale: この文脈では遺体をまとめる、または布などで包む動作を指す。「埋葬の支度をし」は解釈を加えすぎるため、具体的な動作を簡潔に表した。
- source_word: αὐτὸν
  choice: 彼を
  rationale: 直前に倒れて死んだアナニアを指す男性単数代名詞。
- source_word: ἐξενέγκαντες
  choice: 運び出して
  rationale: ἐκφέρω は内から外へ運ぶことを表す。遺体を運んだという文脈に即して訳した。
- source_word: ἔθαψαν
  choice: 葬った
  rationale: θάπτω は埋葬すること。「埋めた」よりも人の埋葬を表す自然で dignified な日本語を選んだ。
