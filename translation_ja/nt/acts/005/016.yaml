id: ACT.5.16
reference: Acts 5:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: ja
  text: また、エルサレム周辺の町々からも大勢の人々が集まって来て、病人や汚れた霊に苦しめられている人々[a]を連れて来た。そして、その人たちは皆、癒やされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「汚れた霊に悩まされている人々」。
    reason: ὀχλουμένους は、「悩まされる」「苦しめられる」「さいなまれる」といった意味の幅を持つため。
lexical_decisions:
- source_word: συνήρχετο
  choice: 集まって来て
  rationale: 未完了過去の継続的・反復的な動きを自然な日本語で表し、人々が各地から集まる方向性も示す。
- source_word: τὸ πλῆθος
  choice: 大勢の人々
  rationale: 集合的な多数を表す語を、現代日本語で自然かつ明瞭に訳す。
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: エルサレム周辺の町々から
  rationale: 属格が示す出所を文脈に即して「から」で明示し、πέριξ の地理的意味を「周辺」とした。
- source_word: φέροντες
  choice: 連れて来た
  rationale: 病人や苦しめられている人々を使徒たちのもとへ運ぶ行為を、対象が人であることに即して自然に表す。
- source_word: ἀσθενεῖς
  choice: 病人
  rationale: 癒やしの文脈における身体的な病気を簡潔に示す。
- source_word: ὀχλουμένους
  choice: 苦しめられている人々
  rationale: 受動の継続的な苦難を保ちつつ、「悩まされている」より強い苦痛も含み得る語感を示す。
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: 汚れた霊に
  rationale: ルカ文書の定型的な表現を保ち、単なる心理状態へ還元しない。
- source_word: οἵτινες
  choice: その人たちは
  rationale: 直前の病人と汚れた霊に苦しめられている人々の双方を受けることが明確になるよう訳す。
- source_word: ἐθεραπεύοντο
  choice: 癒やされていた
  rationale: 未完了過去と受動態を保ち、その場で癒やしが継続的・反復的に起きていたことを表す。
- source_word: ἅπαντες
  choice: 皆
  rationale: 連れて来られた人々全員に及ぶ包括性を簡潔に示す。
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων の解釈
  choice: 汚れた霊
  alternative: 不浄な霊
  rationale: 人格的な悪しき霊を指す新約聖書の慣用表現を保持し、心理的・比喩的説明に置き換えない。
- issue: ἅπαντες の範囲
  choice: その人たちは皆、癒やされていた
  alternative: 全員が癒やされた
  rationale: 直前に挙げられた病人と汚れた霊に苦しめられている人々の双方を包括すると読み、全体性と未完了過去の相の両方を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、使徒言行録の叙述にふさわしい簡潔で品位ある文体とした。「癒やす」は聖書文体として定着しているため漢字表記を採用し、継続性は「集まって来て」「癒やされていた」で表した。
