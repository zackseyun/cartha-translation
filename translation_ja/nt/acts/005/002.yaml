source:
  edition: SBLGNT
  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: ja
  text: 彼は、妻もそのことを知っていて、売却代金の一部をひそかに取り分け[a]、一部を持って来て、使徒たちの足もとに置いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「売却代金の一部をこっそり取り分け」。ギリシア語の動詞には、自分のために不正に、または人に隠して取っておくという含みがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「使徒たちの足もとに置いた」。金銭を使徒たちの前に差し出したことを表す具体的な言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: ひそかに自分のものとして取っておき
  rationale: νοσφίζομαι が持つ、不正に、また人に隠して自分のために取り分けるという否定的な含意を自然な日本語で示す。単なる中立的な「残しておいた」とはしない一方、法的な意味での「横領」と断定することも避けた。
- source_word: ἀπὸ τῆς τιμῆς
  choice: 売却代金の一部を
  rationale: τιμή はこの文脈では売却によって得た金額を指す。「売却代金」とすることで、単なる物の価格ではなく、実際に受け取った金銭であることを明確にした。「一部」は動詞と文脈から補われる。
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: 妻もそのことを知っている中で
  rationale: 属格独立構文が示す付帯状況と、καί の「妻も」を保つ。妻の同意や主導まで読み込まず、行為を知っていたという範囲にとどめた。
- source_word: ἐνέγκας μέρος τι
  choice: そのうちの一部を持って来て
  rationale: μέρος τι の不特定の分量を「一部」とし、アオリスト分詞の先行的な動作を「持って来て」で自然に表した。「残り」とはせず、持参額と留保額の関係を原文以上に限定しない。
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: 使徒たちの足もとに置いた
  rationale: 金銭を使徒たちの前に差し出す具体的な所作を、使徒言行録で繰り返される「足もと」の像とともに保持した。
theological_decisions:
- issue: アナニアの行為の道徳的な含意
  choice: 「ひそかに自分のものとして取っておき」とし、欺瞞を伴う留保として訳す。
  alternative: 「代金の一部を残しておき」と中立的に訳す。
  rationale: νοσφίζομαι 自体と物語の文脈は、正当な留保ではなく、隠れて自分のために取り分けたことを示す。ただし本文にない法的・教派的な評価は加えない。
- issue: 妻の関与の程度
  choice: 妻はそのことを知っていた、と訳す。
  alternative: 妻の同意を得て、または妻と共謀して、と訳す。
  rationale: συνειδυίης は知識・認識を明示するが、この句だけでは同意や共謀という法的評価までは明示しないため、原文の範囲にとどめる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙事文として簡潔かつ品位ある調子にした。「知っている中で」は妻の認識を付帯状況として示し、同意や共謀を過度に断定しない表現である。「足もと」は原文の具体的な像と周辺文脈との連続性を保つため、そのまま残した。
