base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: ja
  text: ところが、アナニアという人は、妻のサッピラとともに、所有していた財産[a]を売った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「所有物」「不動産」。ギリシア語は広く所有物や財産を指すことができる。前後の文脈では、不動産であった可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: ところが、…という人は
  rationale: δέによる直前のバルナバの記事との対照を「ところが」で示し、τιςを日本語で不自然に重くせず「…という人」として導入した。ἀνήρはここでは個人を指す「人」が自然である。
- source_word: Ἁνανίας ὀνόματι
  choice: アナニアという
  rationale: ὀνόματιの慣用的な意味「名を…という」を、現代日本語で自然な形にした。固有名は一般的な聖書表記に従った。
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: 妻のサッピラとともに
  rationale: σύνの同伴を「とともに」で表し、γυνήは所有表現を伴うため明確に「妻」と訳した。
- source_word: ἐπώλησεν
  choice: 売った
  rationale: πωλέωのアオリスト直説法を、物語文に自然な過去形で訳した。
- source_word: κτῆμα
  choice: 所有地
  rationale: κτῆμαは広く所有物・財産を意味し得るが、使徒4–5章の不動産売却という文脈では「所有地」が簡潔で自然である。ただし語そのものの意味範囲を脚注で保持した。
theological_decisions:
- issue: 直前のバルナバの記事との物語上の対照
  choice: δέを「ところが」と訳して対照を示す
  alternative: 「さて」または「そして」として、より弱い展開・継続を示す
  rationale: 直前の模範的な行為と、これから語られる欺きとの対比が文脈上明瞭であり、「ところが」はδέの穏やかな対照機能を自然な日本語で表す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語の対照と簡潔さを保った。「一人の男」は硬いため避け、「アナニアという人」とした。
