source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: ja
  text: この人の後、ガリラヤ人ユダが住民登録[a]のころに立ち上がり、人々を離反させて自分の後に従わせた[b]。彼も滅び、彼に従っていた者は皆、散らされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人口調査」とも訳せる。この語は、人口調査または公的な登録を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「人々を引き離して自分に従わせた」。この動詞には、それまでの立場や忠誠から人を離反させる意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: この人の後
  rationale: μετά＋対格の時間的な継起を示し、直前に言及された人物の後に続く出来事であることを自然に表す。
- source_word: ἀνέστη
  choice: 立ち上がり
  rationale: ここでは復活ではなく、歴史上の指導者として台頭したことを表す。原文の生き生きした表現も保つ。
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: ガリラヤ人ユダ
  rationale: 人物名と地域的呼称を、現代日本語で一般的な聖書固有名詞の形にした。
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: 住民登録のころに
  rationale: ἀπογραφήは人口調査を伴う公的登録を指し得る。「ころに」により、原文の時期を示す表現を自然に伝える。
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: 人々を離反させて自分の後に従わせた
  rationale: 使役形のἀφίστημιが持つ、以前の立場から引き離す・離反させる意味と、ὀπίσω αὐτοῦの「彼の後に従う」という像の両方を保つ。λαόνは無冠詞なので、民族全体を意味する「民」ではなく「人々」とした。
- source_word: κἀκεῖνος ἀπώλετο
  choice: 彼も滅び
  rationale: κἀκεῖνοςの継続・追加の力を「も」で示す。ἀπώλετοは死に至ったことを述べるが、その方法は明示しないため「殺された」と限定しない。
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: 彼に従っていた者は皆
  rationale: πείθομαι＋与格がこの文脈で示す、彼の言葉を受け入れて従っていた状態を自然な日本語で表す。未完了形の継続的な含みも「従っていた」で示す。
- source_word: διεσκορπίσθησαν
  choice: 散らされた
  rationale: アオリスト受動態を簡潔かつ直接的に訳し、集団が離散したことを示す。
theological_decisions:
- issue: ユダの運動の歴史的・政治的性格
  choice: 「離反させて自分の後に従わせた」とし、反乱を想起させる含みは残しつつ、明示的に「反乱を起こした」とはしない。
  alternative: 「人々を率いて反乱を起こした」
  rationale: 歴史上のユダの運動は反乱と結び付けられるが、この節のギリシア語自体は反乱を表す名詞を用いず、彼が人々を離反させて自分に従わせたと述べる。本文以上の政治的具体性を加えない。
translation_notes:
  register: 明瞭な現代標準語の常体を用いた。歴史叙述としての簡潔さと品位を保ち、原文が特定しない死因や政治的評価は補わなかった。英語相談訳では脚注記号の位置と脚注内容にずれが見られるため、各脚注を対応する日本語表現の直後に置いた。
