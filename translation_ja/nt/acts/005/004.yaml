  naturalness: 明瞭な現代標準語であり、叱責の調子も概ね適切である。「売らずに残しておけば」は仮定的に聞こえ、原文の売却前の継続状態を指す表現としては「売らずに残していたとき」のほうが直接的である。「こんなこと」はやや口語的なので、「このようなこと」が文脈により適する。
  terminology: 「人」「神」「心に決めた」「偽りを言った」は適切である。ἐξουσίαには「自由」だけでなく正当な処分権・決定権の含みがあるため、「自由にできた」として具体的に表すのがよい。
