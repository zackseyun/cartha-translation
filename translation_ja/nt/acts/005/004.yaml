id: ACT.5.4
reference: Acts 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: ja
  text: 売らずに残していたとき、それはあなたのものだったではないか。また、売られた後も、その代金はあなたの自由にできたではないか。どうして、このようなことを心に決めたのか。あなたは人にではなく、神に対して偽りを言ったのだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μένον σοὶ ἔμενεν
  choice: 売らずに残しておけば、それはあなたのものではなかったか
  rationale: 語根 μένω の反復が示す、売却前も所有が継続していたという意味を、自然な日本語で表した。分詞 μένον は文脈上「売らずに」と補って状態を明確にした。
- source_word: πραθὲν
  choice: 売った後も
  rationale: 受動分詞の意味は「売られた後」だが、日本語では所有者を主語として「売った後」とする方が自然であり、出来事の内容を変えない。
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: その代金はあなたの自由になった
  rationale: ἐξουσία の権限・処分権という意味を、金銭をどう扱うか本人に委ねられていたことが明瞭になる現代日本語で表した。単なる所有よりも、正当な決定権を含む。
- source_word: τί ὅτι
  choice: どうして
  rationale: 問いただしと叱責の響きを保ちつつ、日本語として簡潔で自然な疑問表現とした。
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: 心に決めた
  rationale: 直訳的な「心に置いた」が表す内面的な意図・決意を自然に示し、原文の「心」という表現も保持した。
- source_word: τὸ πρᾶγμα τοῦτο
  choice: こんなこと
  rationale: πρᾶγμα の広い意味を保ちながら、直前の欺きの企てを指す叱責的な文脈に合う自然な表現とした。
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: あなたは人にではなく、神に対して偽りを言った
  rationale: ψεύδομαι と与格の「〜に偽りを言う」を明示し、ἀνθρώποις は男女を限定しない一般的な「人」で表した。「人ではなく神」という対比をそのまま保持した。
theological_decisions:
- issue: 直前の5章3節との関係における聖霊の神性
  choice: 本文どおり「神に対して」と訳し、説明を加えない
  alternative: 「神、すなわち聖霊に対して」と明示的に補う
  rationale: 本節自体は τῷ θεῷ と述べる。5章3節との関係は重要だが、翻訳本文に同格説明を加えず、文脈が示す神学的含意をそのまま読者に提示する。
- issue: 土地と売却代金に対する所有者の自由
  choice: 売却前の所有と売却後の処分権を明確にする
  alternative: 単に所有していたとのみ訳し、処分の自由を明示しない
  rationale: ペトロの論旨は、財産をすべて差し出さなかったことではなく、本人に選択の自由がありながら欺いたことを問題にしている。ἐξουσία の意味を反映してこれを保持した。
- issue: ἀνθρώποις の性別を含む範囲
  choice: 一般的な人間を指す「人」とする
  alternative: 男性に限定され得る「男たち」とする
  rationale: ここでの複数形は神との対比において人間一般を指し、日本語の「人」が意味を過不足なく伝える。
translation_notes:
  register: 明瞭な現代標準語を用い、使徒の叱責にふさわしい簡潔で重みのある調子とした。「その代金」は原文では明示されないが、売却後に権限下にあった対象を日本語で誤解なく示すための文脈的補足である。脚注を必要とする実質的な異読や、本文に残すべき重大な語義上の曖昧さはない。
