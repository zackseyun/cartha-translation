id: ACT.5.19
reference: Acts 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: ja
  text: しかし、主の天使が夜の間に牢の扉を開け、彼らを外へ連れ出して言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: 天使
  rationale: 冠詞のない名詞だが、牢の扉を開いて使徒たちを救出する文脈は天的存在を示す。日本語では不定冠詞を補わず、自然に「天使」とした。
- source_word: κυρίου
  choice: 主の
  rationale: κύριοςの標準的かつ聖書的な訳語として「主」を用い、「主の天使」という属格構文を保った。
- source_word: διὰ νυκτός
  choice: 夜の間に
  rationale: διά＋属格の時間的意味を明確に表し、その夜のうちに出来事が起きたことを自然な現代日本語で示す。
- source_word: ἤνοιξε
  choice: 開け
  rationale: ἀνοίγωの基本義をそのまま表す。「鍵を開けた」では本文にない施錠の細部を加えるため避けた。
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: 牢の扉
  rationale: φυλακήを文脈に即して「牢」、θύραςを「扉」と訳した。簡潔で自然な日本語の所属表現とした。
- source_word: ἐξαγαγών
  choice: 彼らを外へ連れ出して
  rationale: ἐξάγωが示す、内から外へ出させる動作を明示した。分詞の先行動作を接続形で自然につないだ。
- source_word: τε
  choice: （接続形で表現）
  rationale: 弱い連結を日本語の「連れ出して言った」という連用的接続で表し、不自然な「そして」の重複を避けた。
- source_word: εἶπεν
  choice: 言った
  rationale: 物語叙述におけるλέγωのアオリストを自然に訳した。発言内容が次節に続くことも示せる。
theological_decisions:
- issue: ἄγγελοςが指す存在
  choice: 天的な天使
  alternative: 人間の使者
  rationale: 夜間に牢の扉を開き、拘束されていた者たちを外へ連れ出す文脈から、ここでは人間の使者ではなく天的存在と理解するのが妥当である。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: 「主の天使」は確立した聖書的表現であり、κύριοςの宗教的称号としての意味を簡潔に保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「牢獄」より日常的で理解しやすい「牢」を採用し、ギリシア語の分詞構造は自然な日本語の接続形に整えた。
