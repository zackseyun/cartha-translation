id: ACT.5.38
reference: Acts 5:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: ja
  text: 今、あなたがたに言います。この人たちから離れ、彼らを放っておきなさい。というのも、この計画またはこの活動が人間に由来するものなら[a]、滅ぼされるでしょう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間から出たものなら」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「無に帰するでしょう」または「崩壊するでしょう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: そこで今
  rationale: 現在の勧告を導入する慣用的な表現。「そこで」で直前の議論とのつながりを示し、「今」で時間的・談話的な力を自然に表した。
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: この人たちから手を引き
  rationale: 単に物理的に離れるだけでなく、彼らへの介入をやめるよう求める文脈上の実際的な意味を、現代日本語で自然に表した。
- source_word: ἄφετε αὐτούς
  choice: 放っておきなさい
  rationale: 彼らを解放するというより、これ以上干渉せず、そのままにしておくよう命じる文脈に適する。
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: 人間から出たものなら
  rationale: 出所・起源を示すἐξを保ち、次節の神との対比が明確になるようにした。ἀνθρώπωνはここでは人類一般を指すので「人間」とした。
- source_word: ἡ βουλὴ αὕτη ἢ τὸ ἔργον τοῦτο
  choice: この計画あるいはこの働き
  rationale: βουλήを意図された企てとして「計画」、ἔργονを実際に行われている営みとして「働き」と訳し、両者の区別を保った。
- source_word: καταλυθήσεται
  choice: 崩れ去るでしょう
  rationale: 解体され、存続できなくなるという結果を自然な日本語で表した。受動形を機械的に訳さず、この運動が破綻するという文脈上の意味を保った。
theological_decisions:
- issue: ἐξ ἀνθρώπωνが示す起源と次節の神的起源との対比
  choice: 人間から出たものなら
  alternative: 人間に由来するものなら
  rationale: 計画や働きの起源が人間にあるという条件を明示しつつ、それが必ず悪意ある企てだとは訳文で決めつけなかった。次節の「神から」との神学的緊張も保たれる。
- issue: καταλυθήσεταιの主体と作用者
  choice: 崩れ去るでしょう
  alternative: 滅ぼされるでしょう
  rationale: ギリシア語は未来受動形だが、作用者は明示されていない。「神に滅ぼされる」などと補わず、計画・働きが瓦解するとの結果だけを表した。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた勧告調とした。「手を引き」と「放っておきなさい」を組み合わせ、二つの命令を保ちながら不自然な重複を避けた。敬体を用い、ガマリエルの議会での発言にふさわしい品位を維持した。英語相談訳の脚注[a]は配置と内容が一致していないため、原文のἐξ ἀνθρώπωνに対応する位置へ置いた。
