  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: ja
  text: そして使徒たちを捕らえ、公の拘禁下に置いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「公の拘禁所に入れた」。ギリシア語の表現は、特定の牢獄の建物だけでなく、より広く拘留・監禁の状態を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: 捕らえ
  rationale: 字義的には「手をかける」だが、この文脈では敵対的に身柄を拘束することを表す。現代日本語では「捕らえ」が自然で明確であり、祝福や任命の按手との混同も避けられる。
- source_word: ἀποστόλους
  choice: 使徒たち
  rationale: 使徒言行録では、イエスから遣わされた者たちの定着した呼称として用いられているため、「使徒」とした。
- source_word: ἔθεντο
  choice: 入れた
  rationale: τίθημιの「置く」という意味を、拘禁所を目的地とする自然な日本語にした。
- source_word: ἐν τηρήσει
  choice: 拘禁所に
  rationale: τήρησιςは監視下での拘留、または拘留場所を指し得る。この箇所では実際に収容したことを表すため「拘禁所」としたが、特定の建造物としての牢獄に意味を限定しない。
- source_word: δημοσίᾳ
  choice: 公の
  rationale: τηρήσειを修飾し、公的・共同の拘禁を表す。「公の」は「公然と」という副詞的解釈を避けつつ、官の管理する一般拘禁施設という含みを保つ。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「手をかけた」という直訳調の慣用句は日本語では意味がずれやすいため避け、文脈上の逮捕・拘束の意味を「捕らえ」で表した。
