  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: ja
  text: そこで、神殿警備隊長[a]は部下たちと一緒に出向き、使徒たちを連れて来た。力ずくではなく、民衆に石打ちにされるのを恐れていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿警備隊長」は、神殿内の秩序維持を監督した役人を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: στρατηγὸς
  choice: 神殿警備隊長
  rationale: 文脈上、ローマ軍の将官ではなく、神殿の秩序維持を担う役人を指すため、役割が明確になる訳語とした。
- source_word: ὑπηρέταις
  choice: 部下たち
  rationale: 隊長に同行する配下の役人を指す。日本語で自然かつ、本文にないほど具体的な『警察』という制度語を避けた。
- source_word: ἤγαγεν αὐτούς
  choice: 使徒たちを連れて来た
  rationale: ἄγωの『導く、連れて来る』という意味を文脈に即して表した。代名詞の指示対象は日本語で明確になるよう『使徒たち』としたが、行き先は本文が明示しないため補わなかった。
- source_word: οὐ μετὰ βίας
  choice: ただし、力ずくではなかった
  rationale: 暴力的・強制的な手段を用いなかったことを、明快な現代日本語で表した。
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: 民衆に…のを恐れていたからである
  rationale: 未完了過去の継続的・状況的な恐れを『恐れていた』で表し、γάρの理由関係を保持した。
- source_word: μὴ λιθασθῶσιν
  choice: 石で打ち殺されるのを
  rationale: 恐れの内容を示すμή＋接続法を自然な日本語にした。λιθάζωは処刑・殺害を意図する石打ちを表すため、『石を投げられる』より明確な『石で打ち殺される』とした。
- source_word: τότε ἀπελθὼν
  choice: そこで、…出向き
  rationale: 物語の展開を示すτότεと、主動詞に伴う分詞の動作を、自然な日本語の連続動作として訳した。
