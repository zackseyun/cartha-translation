source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: ja
  text: そこで彼らは使徒たちを呼び入れ、打ったうえで、イエスの名によって[a]語ってはならないと命じ、釈放した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イエスの名について」「イエスの名に基づいて」。このギリシア語表現は、イエスについて語ることと、その権威のもとで語ることの両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: 呼び入れ
  rationale: アオリスト中動態分詞が主要動作に先立つ行為を示す。議場へ呼び戻す文脈に自然で、行為の順序も明確になる。
- source_word: τοὺς ἀποστόλους
  choice: 使徒たち
  rationale: 使徒言行録のこの文脈では、任命された証人たちを指す確立した訳語である。
- source_word: δείραντες
  choice: むちで打ったうえで
  rationale: δέρωは「打つ、殴打する」を意味するが、拘束下で科された処罰という文脈を踏まえ、日本語では「むちで打つ」が自然である。ただし厳密な刑罰方式までは特定しない。
- source_word: παρήγγειλαν
  choice: 命じ
  rationale: παραγγέλλωの強い命令の意味を、簡潔で格調を保つ現代日本語で表す。
- source_word: μὴ λαλεῖν
  choice: 語ってはならない
  rationale: μήを伴う不定詞が禁止内容を表す。「語る」は、公の宣教を含むこの場面にふさわしい。
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: イエスの名によって
  rationale: ἐπί＋与格の句が持つ、イエスを指し示して語ることと、その名の権威に基づいて語ることの双方を含み得る慣用的な幅を保つ。別の可能性は脚注に示す。
- source_word: ἀπέλυσαν
  choice: 釈放した
  rationale: 拘束または処罰を受けた者を解放する法的・公的な場面に適した訳語である。
theological_decisions:
- issue: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ の意味範囲
  choice: イエスの名によって
  alternative: イエスの名について／イエスの名に基づいて
  rationale: この句は、イエスに関して語ること、その名を掲げること、その権威に基づいて語ることを含み得る。本文では日本語の聖書的慣用として幅のある表現を採用し、一つの意味に限定しない。
translation_notes:
  register: 明瞭で現代的かつ公的な場面にふさわしい文体。「そこで」で議会がガマリエルの勧告を受け入れた後の展開を自然につなぎ、「打ったうえで」で処罰から命令、釈放への順序を示した。
