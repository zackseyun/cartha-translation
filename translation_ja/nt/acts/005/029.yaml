  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: ja
  text: しかし、ペトロと使徒たちは答えた。「人に従うより、神に従わなければなりません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: 答えた
  rationale: 分詞と定動詞を重ねる応答表現を、日本語で不自然な重複を避けて一つの動詞で表した。ギリシア語では分詞が単数形でペトロに呼応し、定動詞は複数形で一同の発言を示すが、文全体の応答機能は「答えた」で自然に伝わる。
- source_word: δὲ
  choice: しかし
  rationale: 直前の議会側の命令に対する対比・反論への転換を明確にする。
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: ペトロと使徒たち
  rationale: 固有名には日本語聖書で広く用いられる「ペトロ」を採用し、ἀπόστολοι はこの文脈で特定の使徒集団を指すため「使徒たち」とした。
- source_word: Πειθαρχεῖν
  choice: 従う
  rationale: 権威ある者に服従する意を、平明で自然な日本語の「従う」で表した。
- source_word: δεῖ
  choice: なければなりません
  rationale: 義務・必然性を表す δεῖ の力を保ち、引用内の議会への応答にふさわしい丁寧体とした。
- source_word: θεῷ μᾶλλον ἢ ἀνθρώποις
  choice: 人に従うより、神に従う
  rationale: 比較構文を自然な日本語の「人に従うより、神に従う」とし、ギリシア語の語順は日本語として明瞭になるよう入れ替えた。ἀνθρώποις は神と対比される人間一般、文脈上は人間の権威者を指す。
theological_decisions:
- issue: 神への服従と人間への服従の比較
  choice: 人に従うより、神に従わなければなりません
  alternative: 人ではなく神に従わなければなりません
  rationale: μᾶλλον ἢ は比較を表すため、「ではなく」として絶対的・無条件の二者択一に強めず、「より」で原文の比較的表現と緊張を保持した。
- issue: ἀνθρώποις の包括的な指示範囲
  choice: 人
  alternative: 人間／人々
  rationale: ἀνθρώποις はここで男性だけに限定されず、神に対置される人間、特にその権威を指す。日本語の「人」は簡潔で包括的であり、性別を不必要に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地の文は簡潔な常体、議会への直接応答は自然な丁寧体とした。
