  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: ja
  text: 私たちの先祖の神は、イエスをよみがえらせました[a]。あなたがたは、この方を木に掛けて[b]殺したのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「起こしました」。ここでは復活を指すと考えられますが、この節のギリシア語には「死者の中から」という語句はありません。
    reason: lexical_alternative
  - marker: b
    text: すなわち、十字架に掛けて。ギリシア語は「木」といい、申命記21章23節を踏まえた表現と考えられます。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 私たちの先祖の神
  rationale: イスラエルの父祖たちの神を指す契約的な表現を保ちつつ、現代日本語で自然かつ明瞭な「先祖」を用いた。
- source_word: ἤγειρεν
  choice: よみがえらせました
  rationale: 直前直後の文脈ではイエスの死からの復活を指すと理解するのが自然であり、ἐγείρωのこの用法を明瞭な現代日本語で表した。ただしギリシア語本文に「死者の中から」という句はないため、脚注で語形上の幅を示した。
- source_word: διεχειρίσασθε
  choice: 殺した
  rationale: ここでは暴力を加えて死に至らせたことを表す。後続の分詞句と合わせ、「木に掛けて殺した」と直接的かつ自然に訳した。
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: 木に掛けて
  rationale: 分詞を手段として訳し、彼らがイエスを殺した方法を示した。ξύλονはここで十字架を指すが、申命記21章23節への響きを保つため「木」とした。
theological_decisions:
- issue: ἤγειρενを復活を明示する表現にするか、より広い「起こす／立てる」とするか
  choice: よみがえらせました
  alternative: 起こされました／立てられました
  rationale: この節ではイエスを殺したとの対照と直前の復活宣言により、復活の意味が強い。ただし原文はこの節自体では「死者の中から」を明記しないため、その点を脚注に残した。
- issue: ξύλουを「十字架」と解釈して訳すか、語の形を保って「木」とするか
  choice: 木に掛けて
  alternative: 十字架に掛けて
  rationale: ξύλονは木・木材を意味し、ここでは十字架を指すと同時に申命記21章23節を想起させる。「木」を残すことで、その語彙選択と聖書間の響きを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒たちの公的な証言にふさわしい簡潔で厳粛な調子とした。「この方」でイエスへの指示を明確にし、「あなたがた」との対比を保った。
