language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: ja
  text: その結果、人々は病人たちを大通りにまで運び出し[a]、簡易寝台や敷物[b]の上に寝かせた。ペテロが通りかかるとき、せめてその影だけでも病人たちのだれか一人にかかるようにするためであった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「公共の広場にまで」とも訳せる。ギリシア語は、幅の広い通り、または開けた公共の場所を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「寝台や寝床用の敷物」とも訳せる。ギリシア語では、二種類の寝具または寝るための物が区別されている。
    reason: lexical_alternative
  - marker: c
    text: ここで述べられているのは人々の意図である。病人をその場所に寝かせたのは、ペテロの影だけでも病人たちのだれか一人にかかるようにするためだった。本節自体は、影そのものが病人を癒やしたとは明言していない。
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: そのため
  rationale: 直前の文脈で使徒たちの働きが広がった結果を導く接続表現として、後続する行動との因果関係を自然な日本語で示す。
- source_word: καὶ εἰς τὰς πλατείας
  choice: 大通りにまで
  rationale: 強調のκαίを「まで」で表し、πλατεῖαιを人々が通行する広い街路として訳した。語は公共の広場を指す可能性もあるため脚注に残した。
- source_word: ἐκφέρειν
  choice: 運び出し
  rationale: 病人を家などから公共の場所へ物理的に運び出す場面を明確に表す。
- source_word: τοὺς ἀσθενεῖς
  choice: 病人たち
  rationale: 癒やしを扱う文脈では、一般的な弱者ではなく病気の人々を指す。
- source_word: τιθέναι
  choice: 寝かせた
  rationale: 病人を寝具の上に置く動作を、現代日本語として自然に表現した。
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: 簡易寝台や敷物の上に
  rationale: 二種類の寝具または携帯可能な寝床の区別を、過度に専門的にならない現代語で保った。接続詞καίは、日本語で列挙を自然に示す「や」とした。
- source_word: ἐρχομένου Πέτρου
  choice: ペテロが通りかかるとき
  rationale: 属格独立構文が示すペテロの移動中の状況と、病人たちのそばを通る場面を自然に表した。
- source_word: κἂν
  choice: せめて…だけでも
  rationale: 影という最小限の接触にさえ期待する強意と含意を、日本語の「せめて…だけでも」で表した。
- source_word: ἡ σκιὰ ἐπισκιάσῃ
  choice: その影が…かかる
  rationale: 影が人の上に及ぶという字義的な描写を自然な日本語で示しつつ、影自体が癒やしたとは訳文に付加しない。
- source_word: τινὶ αὐτῶν
  choice: 彼らのだれかに
  rationale: 複数の病人のうち不特定の一人を指す単数不定表現を保った。
theological_decisions:
- issue: ペテロの影そのものに癒やす力があったと本文が断定しているか
  choice: 人々が、影だけでも病人のだれかにかかるよう願って配置したという目的のみを述べる。
  alternative: ペテロの影が病人を癒やしたと訳文で明示する。
  rationale: ἵναと接続法は、この箇所では人々の目的ないし期待を表す。周辺文脈は多くの癒やしを報告するが、本節自体は影が癒やしを生じさせたとは明言していないため、その神学的緊張を解消せずに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙述の格調を保った。「せめてその影だけでも」によって人々の切実な期待を示しつつ、原文が断定していない治癒の因果関係は補わなかった。
