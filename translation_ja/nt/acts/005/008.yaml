  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: ja
  text: そこで、ペテロは彼女に言った。「教えてください。あなたがたは、その土地[a]をこの額で売ったのですか。」彼女は言った。「はい、その額で売りました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「所有地」または「畑」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν
  choice: すると、ペトロは彼女に言った
  rationale: ἀπεκρίθηは応答して発言することを表すが、日本語の「答えた」では直前の問いへの返答と誤解されやすいため、自然な物語表現として「言った」とした。δέは場面の進展を示す「すると」で表した。
- source_word: Εἰπέ μοι
  choice: 答えてください
  rationale: 直訳的な「私に言いなさい」よりも、この場面で相手に回答を求める命令として自然であり、ペトロの直接的な要求を保つ。
- source_word: εἰ
  choice: …のですか
  rationale: 間接疑問を、日本語では自然な肯否疑問の形で表した。
- source_word: τοσούτου
  choice: これだけの値段で／その値段です
  rationale: 問いではその場で示された金額を指す指示性を「これだけ」で表し、返答では同じ金額を受ける自然な日本語として「その値段」とした。
- source_word: τὸ χωρίον
  choice: あの土地
  rationale: χωρίονは土地、畑、所有地を意味しうる。文脈上、夫妻とペトロの双方が承知している売却物件なので「あの土地」とした。語義の幅は脚注に残した。
- source_word: ἀπέδοσθε
  choice: あなたがたは…売った
  rationale: 商取引の文脈でἀποδίδωμιは「売る」の意味。動詞が複数形なので、サッピラ一人だけでなく夫妻を指す「あなたがた」を明示した。
- source_word: Ναί
  choice: はい
  rationale: 単純な肯定の返答を、現代日本語で自然に表した。
