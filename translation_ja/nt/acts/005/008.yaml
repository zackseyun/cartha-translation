  naturalness: 「答えてください」も理解可能ですが、εἰπέ μοι はここでは質問への回答を求める「教えてください」が自然です。「その土地」「この額で」「はい、その額で売りました」により、尋問場面として明快で自然な現代標準日本語になります。
  terminology: 人名は日本語の聖書翻訳で広く定着している「ペテロ」を用いるのが適切です。χωρίον は「土地」とし、語義の代案を脚注に残します。
