revisions:
- from: すると、ペトロは彼女に言った。「答えてください。あなたがたは、あの土地[a]をこれだけの値段で売ったのですか。」彼女は言った。「はい、その値段です。」
  to: そこで、ペテロは彼女に言った。「教えてください。あなたがたは、その土地[a]をこの額で売ったのですか。」彼女は言った。「はい、その額で売りました。」
  rationale: δέは文脈上の応答・進行を自然に示す「そこで」とした。εἰπέ μοι は質問への回答を求める表現として「教えてください」と訳した。売却動詞の複数形は「あなたがた」で保持した。土地には原文にない距離的含意を避けて「その土地」を用い、反復される ποσούτου は「この額／その額」で対応させた。返答には日本語で自然に補われる「売りました」を加え、原文の省略の意味を明確にした。
