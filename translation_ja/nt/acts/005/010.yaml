id: ACT.5.10
reference: Acts 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: ja
  text: すると彼女は、たちまちペトロの足もとに倒れ、息を引き取った。若者たちが入って来て、彼女が死んでいるのを見つけ、運び出して夫のそばに葬った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 出来事がその場ですぐ起きたことを、簡潔で自然な現代日本語で表す。
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: ペトロの足もとに
  rationale: 代名詞の指示対象を文脈に即して明示し、日本語での読みやすさを確保する。πρόςの位置関係は「足もとに」で自然に表す。
- source_word: ἐξέψυξεν
  choice: 息を引き取った
  rationale: 語義である生命の息が絶えることを保ちつつ、現代日本語で死を表す自然で厳粛な表現とする。単なる「死んだ」より原語の表現性を反映する。
- source_word: οἱ νεανίσκοι
  choice: 若者たち
  rationale: 語の一般的な意味をそのまま保ち、役職など原文にない限定を加えない。
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: 夫のそばに
  rationale: πρόςが示す近接関係を「そばに」と訳し、同じ墓か隣接する場所かを原文以上に特定しない。
theological_decisions:
- issue: ἐξέψυξενを直訳的に表すか、結果としての死を簡潔に表すか
  choice: 息を引き取った
  alternative: 死んだ
  rationale: 原語の比喩的・身体的な表現を保持しながら、日本語として自然である。特定の死生観を付加する意図はない。
- issue: αὐτοῦの指示対象
  choice: ペトロ
  alternative: 彼
  rationale: 直前の文脈で語りかけている人物はペトロであり、日本語では固有名を補うことで曖昧さを避けられる。神学的解釈を追加するものではない。
translation_notes:
  register: 明瞭で現代的かつ厳粛な物語文。原文の簡潔な叙述と出来事の急展開を保ち、過度に古風な語法や説明的な補足を避けた。
