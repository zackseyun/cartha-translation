  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: ja
  text: というのも、この少し前に、テウダが現れ、自分は何か重要な人物だと主張し、男たちおよそ四百人が彼に加わりました[a]。彼は殺され、彼に説得されていた者たちは皆、散り散りになり、無に帰しました[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼に付き従いました」「彼の側につきました」。
    reason: προσεκλίθηには、ある人物の側につき、その一団に加わる意味があるため。
  - marker: c
    text: 直訳「何ものにもなりませんでした」。
    reason: ἐγένοντο εἰς οὐδένは、結局無に帰し、何の結果にも至らなかったことを表す慣用表現であるため。
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: というのは、この少し前にも
  rationale: πρό＋属格の先行時を自然な日本語で示し、γάρは直前の勧告を説明する論旨として「というのは」で保持した。「この日々より前」という不自然な直訳は避けた。
- source_word: ἀνέστη Θευδᾶς
  choice: テウダが立ち上がり
  rationale: ここでのἀνίστημιは復活ではなく、指導者として現れ運動を起こす意味。「立ち上がり」は比喩的な力を保ちつつ自然である。人名は日本語で一般的な「テウダ」とした。
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: 自分は大人物だと称した
  rationale: τινα ἑαυτόνは、自分を何者か重要な人物として示す慣用表現。「何者かである」は現代日本語では意味が曖昧すぎるため、含意を「大人物」で明示した。
- source_word: ᾧ προσεκλίθη ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: 四百人ほどの男たちが彼に加わりました
  rationale: ὡςの概数を「ほど」で、ἀνδρῶνの男性指定を「男たち」で保持した。προσεκλίθηは指導者に同調して一団に加わることを表す。
- source_word: ὃς ἀνῃρέθη
  choice: 彼は殺され
  rationale: ἀναιρέωのこの文脈での意味を、受動態も保って明確な現代語にした。
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: 彼に説き伏せられて従っていた者たちも皆
  rationale: ἐπείθοντοの受動的な「説得される」と、結果として従う意味の双方を表した。単に「従った者」だけにして説得の含みを失わないようにした。
- source_word: διελύθησαν
  choice: 散り散りになり
  rationale: 集団が解体・離散したことを自然な日本語で表す。
- source_word: ἐγένοντο εἰς οὐδέν
  choice: その動きは跡形もなくなりました
  rationale: 字義は「無に帰した」。日本語では人物たち自身が無になったと誤読されないよう、運動の消滅を自然に表現した。脚注でより形式的な訳を示す。
theological_decisions:
- issue: ガマリエルの演説中に置かれたテウダについての歴史的報告
  choice: ギリシア語本文どおり、ガマリエルが実例として語る歴史的叙述をそのまま訳す。
  alternative: 外部資料との年代上の関係を示唆する限定表現を加える、または調和させる。
  rationale: 本文はこの事例をガマリエルの論証の一部として提示している。翻訳本文で史的評価や調和案を付け加えず、原文の緊張をそのまま保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、ガマリエルの丁寧な演説調に合わせて敬体とした。「大人物」は古風すぎず、自己を重要人物として売り込む慣用的含意を伝える。本文中の脚注記号[a]〜[c]はすべて対応する位置に置いた。
