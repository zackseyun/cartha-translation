  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: ja
  text: ところが、到着した下役たちは、使徒たちを牢の中に見つけなかった。そこで引き返して、報告した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: 到着しても
  rationale: 下役たちが牢に着いた時を表す分詞。文頭の対照を自然な日本語で示すため、「ところが」と呼応させて「到着しても」とした。
- source_word: ὑπηρέται
  choice: 下役たち
  rationale: ここではユダヤ人指導者たちの命令を受けて行動する公的な係員を指す。「役人」より従属的な職務を示し、「宮の警備隊」と限定するほど解釈を加えない。
- source_word: οὐχ εὗρον
  choice: 見つけることができなかった
  rationale: 実際に捜したが見つからなかったという物語上の意味を、明瞭で自然な日本語にした。
- source_word: αὐτούς
  choice: 使徒たち
  rationale: 日本語で指示対象を明確にするため、直前の文脈で牢に入れられていた使徒たちを明示した。
- source_word: ἐν τῇ φυλακῇ
  choice: 牢の中に
  rationale: 定冠詞のある、すでに言及された特定の牢を指す。「牢の中に」は所在を明確に表す。
- source_word: ἀναστρέψαντες
  choice: 引き返し
  rationale: 派遣先の牢から、彼らを遣わした者たちのもとへ戻る動きを自然に表す。
- source_word: ἀπήγγειλαν
  choice: 報告した
  rationale: 任務を受けた下役たちが結果を公式に伝える場面に適した表現。
- source_word: δέ
  choice: ところが／そこで
  rationale: 最初のδέは予想との対照を「ところが」で示し、二つ目は出来事の展開を自然に結ぶ「そこで」で表した。
