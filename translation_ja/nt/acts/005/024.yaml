source:
  edition: SBLGNT
  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: ja
  text: ところが、神殿の守衛長と祭司長たちはこの知らせを聞くと、このことがいったいどうなるのか[a]と、途方に暮れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「このことがどのような結果になるのか」とも訳せる。ギリシア語は、この事態の成り行きや結果についての疑問を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: ところが、〜聞くと
  rationale: ὡςの時間的な関係を「聞くと」で表し、δέが示す物語上の展開を「ところが」で自然に伝えた。
- source_word: τοὺς λόγους τούτους
  choice: この知らせ
  rationale: 直訳は「これらの言葉」だが、ここでは役人たちが受けた報告を指すため、現代日本語で明確な「この知らせ」とした。
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: 神殿の守衛長
  rationale: 神殿域の警備を指揮する役人を表す。軍一般の指揮官と誤解されにくく、役職の性格が伝わる訳語を選んだ。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 当時の祭司階層の指導者たちを指す複数形であり、複数の現職大祭司を意味するとは限らないため、慣用的な訳語とした。
- source_word: διηπόρουν
  choice: 途方に暮れた
  rationale: 強い困惑と、どう理解し対処すべきか分からない状態を自然な日本語で表した。未完了過去の継続的状態も文脈上含意される。
- source_word: περὶ αὐτῶν
  choice: このことが
  rationale: 代名詞は直前の言葉または報告された出来事を受け得る。「このこと」として指示対象を不必要に限定せず、後続の結果への問いと自然につないだ。
- source_word: τί ἂν γένοιτο τοῦτο
  choice: このことがいったいどうなるのか
  rationale: ἄνを伴う希求法が表す、成り行きについての不確かさを「いったい」「どうなるのか」で表現した。
theological_decisions: []
