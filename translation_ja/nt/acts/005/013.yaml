  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: ja
  text: しかし、ほかの者たちはだれも、あえて彼らに加わろうとはしなかった。その一方で、民は彼らを高く評価していた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: しかし、ほかの者たちは
  rationale: 属格を伴う実質的な「残りの者たち」を自然な日本語で表し、δὲの対照を「しかし」で示した。文脈上その範囲は明示されていないため、「信者でない者」などとは限定しない。
- source_word: οὐδεὶς ἐτόλμα
  choice: だれも、あえて…しようとはしなかった
  rationale: 不完了過去の継続的な態度と、τολμάωの「勇気を出してする／あえてする」という含意を表した。
- source_word: κολλᾶσθαι αὐτοῖς
  choice: 彼らに加わろう
  rationale: κολλάομαιの字義は「結び付く、密着する」であり、ここでは集団との結び付き・参加を指すため、自然な「加わる」とした。単なる一時的接近より強い関係を含み得る曖昧さは保たれる。
- source_word: ἀλλ’
  choice: それでも
  rationale: 前節との単純な逆接ではなく、「加わる勇気はない一方で高く評価した」という譲歩的対照を自然に示した。
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: 民は彼らを高く評価していた
  rationale: μεγαλύνωの「大いなるものとする、称賛する」の意味をこの文脈に即して表し、不完了過去も「していた」で反映した。ὁ λαόςは使徒言行録の語調を保つ「民」とした。
theological_decisions:
- issue: 「ほかの者たち」と「民」の関係
  choice: 両者を本文で同一視も明確に区別もせず、原文どおり別の表現で訳す
  alternative: 「ほかの人々、すなわち民衆」のように同一集団と解釈する
  rationale: 原文はτῶν λοιπῶνとὁ λαόςを用いるが、両者の範囲や重なりを明示しない。解釈上の余地を残した。
- issue: 「彼ら」の指示対象
  choice: 代名詞のまま「彼ら」とする
  alternative: 「使徒たち」と明示する
  rationale: 文脈上は使徒たちを指す可能性が高いが、原文はαὐτοῖς／αὐτούςという代名詞を用いているため、本文で補足的に限定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、叙述の簡潔さと dignified な聖書本文の調子を保った。「それでも」によって、恐れて加わらないことと高く評価することの緊張を自然に表した。
