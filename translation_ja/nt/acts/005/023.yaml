revisions:
- from: こう報告した。「牢は厳重に鍵がかけられ、番兵たちが扉の前に立っているのを確認しました。ところが、開けてみると、中にはだれもいませんでした。」
  to: こう報告した。「牢は厳重に鍵がかけられており、番兵たちは扉の前に立っていました。しかし、扉を開けると、中にはだれもいませんでした。」
  rationale: 「確認しました」を避け、原文が報告する観察内容を直接的に表した。「扉を開けると」は ἀνοίξαντες の目的語を直前の「扉」から自然に補い、原文の時間的関係を明確にする。「しかし」は δέ がこの文脈で示す、厳重な警備にもかかわらず内部が空だったという対照を自然に表す。
