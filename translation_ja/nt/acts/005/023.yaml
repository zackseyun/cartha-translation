  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: ja
  text: こう報告した。「牢は厳重に鍵がかけられており、番兵たちは扉の前に立っていました。しかし、扉を開けると、中にはだれもいませんでした。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: こう報告した
  rationale: 前節の役人たちによる報告を導く分詞構文。日本語では文脈とのつながりと発話行為を自然に示す。
- source_word: δεσμωτήριον
  choice: 牢
  rationale: 拘禁場所を指す。物語の時代背景に合い、現代の読者にも明瞭な語。
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: 厳重に鍵がかけられ
  rationale: 完了受動分詞が示す閉鎖された状態と、ἐν πάσῃ ἀσφαλείᾳ の十分な警備・安全性の強調を簡潔に表す。
- source_word: τοὺς φύλακας ἑστῶτας
  choice: 番兵たちが…立っている
  rationale: 拘禁施設を守る者たちと、その場に立っていたという視覚的な描写を保つ。
- source_word: ἐπὶ τῶν θυρῶν
  choice: 扉の前に
  rationale: 扉に近接して警備している位置関係を自然な日本語で表す。複数形は施設の扉を集合的に表す日本語の「扉」で処理した。
- source_word: ἀνοίξαντες δὲ
  choice: ところが、開けてみると
  rationale: 逆接の δέ と、開けた後に判明した出来事を示すアオリスト分詞の時間的関係を自然に表現する。目的語は直前の「牢」またはその扉として理解できるため明示しない。
- source_word: ἔσω οὐδένα εὕρομεν
  choice: 中にはだれもいませんでした
  rationale: 牢の内部に人が一人も見つからなかったという意味を、報告として自然で明瞭な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、役人たちの正式な報告らしい丁寧語を直接話法の中で採用した。「確認しました」は εὕρομεν の認知的な結果を文脈に即して表すが、後半では自然さを優先して「いませんでした」とした。原文の警備の厳重さ、番兵の位置、牢内が空だったという対照を保持した。
