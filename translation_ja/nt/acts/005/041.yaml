- from: そこで使徒たちは、その御名のために辱められるに値する者とされたことを喜びながら、最高法院の前から立ち去った。[a]
  to: そこで使徒たちは、御名[a]のために辱めを受けるにふさわしい者と認められたことを喜びながら、最高法院のもとを去って行った。
  rationale: 本文の指示対象を「イエス」と明示せず、原文の絶対的な「名」の表現を「御名」として保った。κατηξιώθησαν の受動態は行為者を補わず「認められた」とし、ἀτιμασθῆναι は「辱めを受ける」と訳した。脚注アンカーを「御名」に置き、注の対象を明確にした。
