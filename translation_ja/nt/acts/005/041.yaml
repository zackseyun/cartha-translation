    rationale: 原文は定冠詞を伴う τοῦ ὀνόματος であり、日本語の「その」は訳出上の選択である。脚注では原文が単に『名』とする省略表現であることを説明するのが正確である。
  revised_text: そこで使徒たちは、御名[a]のために辱めを受けるにふさわしい者と認められたことを喜びながら、最高法院のもとを去って行った。
