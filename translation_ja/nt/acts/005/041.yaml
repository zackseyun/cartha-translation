  source_fidelity: ギリシア語の構文と意味は概ね適切に反映されている。ただし、ἐπορεύοντο（未完了形）の継続的な移動は「立ち去った」より「去って行った」がよく表す。また、ἀτιμασθῆναι は「辱められる」より「辱めを受ける」とすると、日本語として自然に受動的被辱の意味を保てる。
  naturalness: 「最高法院の前から立ち去った」はやや硬く不自然であるため、「最高法院のもとを去って行った」とする。「辱められるに値する者とされた」も日本語としてぎこちないため、「辱めを受けるにふさわしい者と認められた」と改める。
  terminology: 「最高法院」はこの文脈の συνέδριον を指す歴史的に定着した訳語として使用可能である。「御名」は原文の絶対的な「名」の用法を保つが、「その」は日本語では必須でなく、削ることでより自然かつ原文の簡潔さに近づく。脚注は「その名」とするギリシア語本文という不正確な説明を改める。
  issues:
