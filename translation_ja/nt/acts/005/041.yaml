id: ACT.5.41
reference: Acts 5:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: ja
  text: そこで使徒たちは、御名[a]のために辱めを受けるにふさわしい者と認められたことを喜びながら、最高法院のもとを去って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、イエスの名を指す。ギリシア語本文は、畏敬を込めた省略表現として、単に「名」と記している。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: 立ち去った
  rationale: 未完了過去は彼らがその場を離れて行く動きを描く。日本語では物語の流れに即して「立ち去った」とするのが自然である。
- source_word: χαίροντες
  choice: 喜びながら
  rationale: 現在分詞が、立ち去る動作と同時に伴う態度を表すため、「喜びながら」とした。
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: 最高法院の前から
  rationale: ἀπὸ προσώπου の「面前から」という意味を自然な日本語で表し、συνέδριον はこの文脈のユダヤ人最高統治機関を指すため「最高法院」とした。
- source_word: κατηξιώθησαν
  choice: 値する者とされた
  rationale: 神的受動を断定せず、受動形の「ふさわしいと認められた／値する者とされた」という評価の意味を保持する。
- source_word: ὑπὲρ
  choice: のために
  rationale: ここではその御名との関係を理由・ゆえとして示すため、自然で簡潔な「のために」とした。
- source_word: τοῦ ὀνόματος
  choice: その御名
  rationale: 原文は指示対象を明記せず絶対的に「その名」を用いる。日本語では畏敬を帯びた定型表現として「その御名」とし、イエスという補足は本文に加えない。
- source_word: ἀτιμασθῆναι
  choice: 辱められる
  rationale: 受動不定詞と名誉・恥辱の対照を保ちつつ、現代日本語として理解しやすい表現である。
theological_decisions:
- issue: 「その名」の絶対的用法
  choice: 本文では「その御名」とし、指示対象を明示しない。
  alternative: 「イエスの名」または「イエスの御名」
  rationale: 文脈上はイエスを指すが、ギリシア語本文は τοῦ ὀνόματος とだけ記す。原文の畏敬的な省略と含みを保ち、解釈上の補足は脚注に置く。
- issue: κατηξιώθησαν の受動主体
  choice: 「値する者とされた」として行為者を明示しない。
  alternative: 「神に、値する者と認められた」
  rationale: 神が暗黙の行為者である可能性は高いが、原文は主体を明示しないため、本文でも受動表現を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、使徒たちが辱めを喜ぶという逆説と、「その御名」の畏敬的な響きを保持した。「最高法院」は歴史的な議会（サンヘドリン）を一般読者に分かりやすく示す語として採用した。
