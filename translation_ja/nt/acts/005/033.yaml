  terminology: 「激しく憤り」は文脈上の殺意と整合し、διεπρίοντοを悔悟的な意味に狭めない。「殺す」もこの文脈のἀνελεῖνにふさわしく直接的である。脚注は原語の切断の比喩と敵対的な情動を保持している。
