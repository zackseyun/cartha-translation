id: ACT.5.33
reference: Acts 5:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ δὲ ⸀ἀκούσαντες διεπρίοντο καὶ ἐβούλοντο ἀνελεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/033.yaml
  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: ja
  text: ところが、これを聞いた者たちは激しく憤り[a]、彼らを殺そうと思った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「切り裂かれ」。激しい敵意に心をかき乱された様子を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: ところが、…者たちは
  rationale: δέの緩やかな逆接を「ところが」で示し、実質的に名詞として働く冠詞を、直前までに示された議員たちを指す「者たちは」と訳した。
- source_word: ἀκούσαντες
  choice: これを聞いた
  rationale: アオリスト分詞の時間的関係を自然な日本語で表し、文脈上明らかな聞いた内容を「これ」で補った。
- source_word: διεπρίοντο
  choice: 激しく憤り
  rationale: 語源的には「切り裂かれる、のこぎりでひかれる」という強烈な比喩であり、ここでは悔い改めではなく、殺意へ向かう敵意に満ちた激しい怒りを表すため、「激しく憤り」とした。原語の比喩は脚注に残した。
- source_word: ἐβούλοντο
  choice: …しようと思った
  rationale: 未完了過去が示す意志・願望を表し、実際に殺害を試みたとまでは断定しない自然な表現とした。
- source_word: ἀνελεῖν
  choice: 殺そう
  rationale: この文脈のἀναιρέωは命を奪うことを意味するため、直接的で明瞭な「殺す」を用いた。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 文脈上、尋問を受けている使徒たちを指す代名詞を、そのまま自然な日本語の代名詞で表した。
theological_decisions:
- issue: διεπρίοντοが表す反応の性質
  choice: 敵意に満ちた激しい憤りとして訳す
  alternative: 「心を刺された」「心を切り裂かれた」と比喩を本文に残す
  rationale: 同じような比喩が悔悟を連想させる場合もあるが、この箇所では直後の殺意が反応の敵対的性質を明らかにしている。ただし、原語そのものの鮮烈な比喩は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、物語の急転と議員たちの激しい敵意が伝わる、簡潔で品位ある文体とした。「殺そうとした」は実際の未遂行為まで含意し得るため避け、意志を表す「殺そうと思った」とした。
