revisions:
- from: ところが、議会[a]の中で、ガマリエルという名のファリサイ派の人が立ち上がった。彼は律法の教師で、民全体から尊敬されていた。彼は、その者たち[b]をしばらく外に出すよう命じた。
  to: ところが、議会[a]で、ガマリエルという名のファリサイ派の一人、すなわち民全体から尊敬されている律法の教師が立ち上がり、人々をしばらく外に出すよう[b]命じた。
  rationale: 本文の意味を変えずに、「その者たち」を文脈に即して明瞭な「人々」に改めた。「議会で」とし、ガマリエルの所属・名・社会的評価・命令を原文の構文関係に沿って一文で示した。脚注アンカー[a][b]は、それぞれ歴史的指示対象と「外に出す」の慣用的意味に対応する位置に保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:01Z'
