id: ACT.5.34
reference: Acts 5:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: ja
  text: ところが、議会[a]で、ガマリエルという名のファリサイ派の一人、すなわち民全体から尊敬されている律法の教師が立ち上がり、人々をしばらく外に出すよう[b]命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「議会」は、ユダヤ人の最高法院であるサンヘドリンを指す。
    reason: cultural_note
  - marker: b
    text: 「人々」は、文脈上、議会の前に立っていた使徒たちを指す。ギリシア語の表現は、彼らを一時的に外へ出す、すなわち退席させるよう命じたという意味。
    reason: referent_and_lexical_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: 立ち上がった
  rationale: 会議の場で発言や行動のために起立したことを、現代日本語で自然に表す。
- source_word: δέ
  choice: ところが
  rationale: 直前の展開からガマリエルの介入へ転じる、穏やかな対比と物語上の転換を示す。
- source_word: ἐν τῷ συνεδρίῳ
  choice: 議会の中で
  rationale: συνέδριονを固有名称に限定せず直接的に訳し、歴史的な指示対象は脚注で補う。
- source_word: Φαρισαῖος ὀνόματι Γαμαλιήλ
  choice: ガマリエルという名のファリサイ派の人
  rationale: 人物名と所属集団を、明瞭で自然な現代日本語として示す。
- source_word: νομοδιδάσκαλος
  choice: 律法の教師
  rationale: ユダヤ教の律法を教える者という複合語の意味を、確立した簡潔な表現で保持する。
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: 民全体から尊敬されていた
  rationale: τίμιοςがここで表す社会的評価と、παντὶ τῷ λαῷの範囲を自然に伝える。
- source_word: ἐκέλευσεν
  choice: 命じた
  rationale: 司法的な場での権威ある指示というκελεύωの力を保つ。
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: しばらく外に出すよう
  rationale: 字義的には『少しの間、外にする』という慣用表現であり、一時的に退席させる意味を自然に表す。
- source_word: τοὺς ἀνθρώπους
  choice: その者たち
  rationale: 文脈上は使徒たちを指すが、この節単独でも過度に名詞を補わず、指示対象を保つ。性別を曖昧にする意図ではなく、日本語の自然な照応を優先した。
theological_decisions:
- issue: τοὺς ἀνθρώπουςの指示対象と性別表現
  choice: その者たち
  alternative: 男たち／使徒たち
  rationale: 文脈上の指示対象は議会の前にいる男性の使徒たちである。ただし日本語で「男たち」とすると性別が不必要に強調され、「使徒たち」は原文にない呼称を補うため、自然な照応表現を採った。脚注で指示対象を明示する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語文を三文に分け、人物紹介と命令を読み取りやすくした。固有の歴史用語は本文を平明にし、脚注で補足した。
