id: ACT.5.42
reference: Acts 5:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: ja
  text: そして毎日、神殿で、また家々で、教え、イエスがメシアであるという良い知らせを宣べ伝えることをやめなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「メシアであるイエスについて良い知らせを宣べ伝えた」とも、「イエスをメシアとして宣べ伝えた」とも訳せる。
    reason: τὸν χριστὸν Ἰησοῦν は、宣べ伝える良い知らせの内容を表すとも、εὐαγγελιζόμενοι の目的語的表現として理解するともできるため。
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: そして毎日
  rationale: 時間の広がりを表す対格と、前の叙述につなぐ τε を、自然な現代日本語で継続的・習慣的な意味が伝わるようにした。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόν は聖所そのものより神殿境内を指すが、本文では簡潔で一般的な「神殿」とした。
- source_word: κατ’ οἶκον
  choice: 家々で
  rationale: κατά と単数 οἶκον の配分的な意味を表し、個々の家で活動したことを自然な日本語で示す。
- source_word: οὐκ ἐπαύοντο
  choice: やめなかった
  rationale: 未完了過去が示す継続を、明快な現代語で表した。
- source_word: διδάσκοντες
  choice: 教え
  rationale: 継続中の使徒たちの教示を表す標準的な訳語。
- source_word: εὐαγγελιζόμενοι
  choice: 良い知らせを宣べ伝える
  rationale: 良い知らせを告知するという動詞の意味を保ちつつ、聖書本文にふさわしい自然で格調ある表現とした。
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: イエスがメシアであるとの
  rationale: Χριστός を称号として「メシア」と訳し、この対格句を知らせの内容として明示した。同時に、別の統語的表現が可能であることは脚注に残した。
theological_decisions:
- issue: Χριστός の訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名の一部というより、イエスの身分について告げる称号として機能しているため、その意味を示す「メシア」とした。
- issue: εὐαγγελιζόμενοι に続く τὸν χριστὸν Ἰησοῦν の統語的な力
  choice: 知らせの内容として「イエスがメシアである」と表す
  alternative: 目的語句として「メシアであるイエスを良い知らせとして宣べ伝える」または「メシア、すなわちイエスを宣べ伝える」
  rationale: 原文は圧縮された対格表現で複数の自然な展開が可能である。本文では日本語として明瞭な内容節を採り、目的語的な読みは脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「宣べ伝える」によって聖書本文としての品位を保った。「家々で」は配分的意味を簡潔に示す。脚注記号 [a] は、対応する文全体の末尾に置いた。
