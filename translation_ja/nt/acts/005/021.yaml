id: ACT.5.21
reference: Acts 5:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: ja
  text: 彼らはこれを聞くと、夜明けごろ、神殿の境内に入って教えていた。大祭司とその同行者たちが来ると、彼らは最高法院とイスラエルの子らの長老会全体[a]を招集し、彼らを連れて来させるため、牢獄へ人を遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「最高法院」と「イスラエルの子らの長老会全体」の関係は、同じ会議体を説明・強調しているとも、並列された集団とも理解できる。より慣用的には「イスラエルの長老会全体」。
    reason: καί が示す二つの名詞句の関係を本文で確定せず、γερουσία および「イスラエルの子ら」の慣用的な訳語の可能性を示すため。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 彼らはこれを聞くと
  rationale: アオリスト分詞を時間的に取り、前節の御使いの命令を受ける「これ」を補って、出来事の順序を自然な日本語で示した。
- source_word: ὑπὸ τὸν ὄρθρον
  choice: 夜明けごろに
  rationale: 夜明けの早い時間を表す慣用的な時間表現。時刻を一点に限定しすぎない「ごろ」を用いた。
- source_word: ἱερὸν
  choice: 神殿の境内
  rationale: ναόςが指し得る聖所そのものではなく、神殿複合施設を指すため、「境内」として区別を明確にした。
- source_word: ἐδίδασκον
  choice: 教えていた
  rationale: 未完了過去の継続的な動作を保った。
- source_word: Παραγενόμενος
  choice: 到着すると
  rationale: 次の出来事を導くアオリスト分詞を、自然な時間節として訳した。
- source_word: οἱ σὺν αὐτῷ
  choice: その一行
  rationale: 同行者の具体的な身分を本文以上に特定せず、簡潔で自然な日本語にした。
- source_word: συνεκάλεσαν
  choice: 招集し
  rationale: 会議体を召集する意味を明確に表した。
- source_word: συνέδριον
  choice: 最高法院
  rationale: この文脈のユダヤ統治議会を指す歴史的呼称として、日本語で通用する「最高法院」を採用した。
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: イスラエルの子らの長老会全体
  rationale: γερουσίαを「長老会」とし、πᾶσανの全体性と、伝統的な民族呼称「イスラエルの子ら」を保持した。συνέδριονとの関係には同格・補足的に読める曖昧さがあるため、本文では「すなわち」としつつ脚注で別解を示した。
- source_word: δεσμωτήριον
  choice: 牢獄
  rationale: 拘禁場所を指す標準的で品位ある日本語を選んだ。
- source_word: ἀχθῆναι αὐτούς
  choice: 彼らを連れて来させるために
  rationale: 受動不定詞が表す目的と、使者を介して連行させる間接的な使役関係を自然な日本語で表した。
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ の訳し方
  choice: イスラエルの子らの
  alternative: イスラエルの／イスラエル人の
  rationale: 明示された男性複数の親族的・民族的表現を保持した。ただしここでは伝統的な民族総称として機能するため、より慣用的な訳も可能である。
- issue: συνέδριον と γερουσία の関係
  choice: 同格・説明的に「最高法院、すなわち…長老会全体」
  alternative: 二つの別個または重なり合う集団として「最高法院と…長老会全体」
  rationale: καίは単純な並列にも説明的な連結にもなり得る。文脈上、γερουσίαが最高法院を言い換え、またはその全構成員を強調する可能性を本文に採ったが、統語上の別解を脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら、物語本文にふさわしい端正な文体とした。「神殿の境内」「最高法院」は歴史的背景を一般読者にも伝えやすい語。「一方」で場面転換と同時進行の対照を示した。
