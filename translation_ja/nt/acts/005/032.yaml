  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: ja
  text: 私たちは、これらのこと[a]の証人です。また、神が神に従う人々にお与えになった聖霊も、証人です[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらの言葉」または「これらの事柄」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では直訳すると「また聖霊も」。前の節から「証人です」という意味が引き継がれている。
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: 証人
  rationale: 使徒たちが自ら知る事実を証言するという、使徒言行録における法廷的・証言的な意味を明確に保つ、自然で標準的な訳語。
- source_word: τῶν ῥημάτων τούτων
  choice: これらのこと
  rationale: ῥῆμαには「言葉」「事柄」の両義があるが、ここでは直前に語られた出来事とその内容をまとめて指すため、現代日本語として自然な「これらのこと」とした。語義の幅は脚注に残す。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語の聖書・キリスト教用語として定着しており、原文の指示対象を簡潔かつ尊厳ある形で示す。
- source_word: ἔδωκεν
  choice: お与えになった
  rationale: 神を主語とする日本語として敬意を保ちつつ、ギリシア語アオリストの出来事を自然な過去表現で訳した。
- source_word: τοῖς πειθαρχοῦσιν αὐτῷ
  choice: ご自分に従う人々に
  rationale: πειθαρχέωが持つ、権威ある者に服従し従う意味を「従う」で明瞭に表した。αὐτῷの指示先が神であることは「ご自分に」によって自然に示した。
theological_decisions:
- issue: 聖霊が使徒たちと並ぶ証人として提示されているか
  choice: 「聖霊も、証人です」とし、前半から共有される述語を補った。
  alternative: 「また聖霊も」とだけ訳し、「証人である」を文脈に委ねる。
  rationale: 後半のギリシア語節には動詞・述語が明記されていないが、前半の「私たちは証人です」が自然に引き継がれる。日本語で述語を補うことで、原文の統語関係を明瞭にしつつ、新たな内容は加えない。
- issue: 聖霊を受ける者についての表現
  choice: 「神がご自分に従う人々にお与えになった」と訳した。
  alternative: 「神に服従する者たちに与えた」
  rationale: 「従う」はπειθαρχέωの権威への服従という含意を保ちながら、現代の一般読者にも自然である。聖霊の賜与と従順との関係は、原文どおりに述べ、神学的な因果関係を追加説明しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「です」体に統一し、神を主語とする箇所には「お与えになった」を用いた。聖霊に関するギリシア語の文法上の中性は日本語に対応する区別がないため、不要な注は設けていない。
