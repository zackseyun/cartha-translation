id: ACT.10.3
reference: Acts 10:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: ja
  text: 彼は昼の第九時ごろ[a]、幻の中で、神の天使が自分のところに入って来て、「コルネリウス」と呼びかけるのを、はっきりと[b]見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 現代の時刻では、午後三時ごろ。
    reason: cultural_note
  - marker: b
    text: 別訳「明らかに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: 見た
  rationale: ὁράωのアオリスト直説法であり、幻の中で実際に目にしたという物語上の出来事を、自然で具体的な日本語で表す。
- source_word: ἐν ὁράματι
  choice: 幻の中で
  rationale: ὅραμαは超自然的な「幻、幻視」を指す。「幻の中で」は、その体験の様態を過度に説明せずに伝える。
- source_word: φανερῶς
  choice: はっきりと
  rationale: 幻が明瞭で見まちがえようのないものであったことを示す副詞。現代日本語として自然な「はっきりと」を採用した。
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: 昼の第九時ごろ
  rationale: 古代の時刻表現を本文に残し、ὡσεὶとπερὶが示す概略を「ごろ」で表した。現代の時刻換算は脚注に示す。
- source_word: ἄγγελον τοῦ θεοῦ
  choice: 神の御使い
  rationale: 幻という文脈では人間の使者ではなく天的な存在を指す。「御使い」は聖書文体として定着しつつ、敬意ある自然な表現である。
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: 自分のところに入って来て
  rationale: εἰσέρχομαιが表す「中へ入る」動きを保ち、コルネリウスのいる場所へ来たことが自然に伝わるようにした。
- source_word: καὶ εἰπόντα αὐτῷ
  choice: 「コルネリウス」と呼びかける
  rationale: εἰπόντα αὐτῷの発話内容が呼格の名前だけであるため、日本語では単に「言う」より「呼びかける」が自然である。分詞構文全体は「～のを見た」にまとめた。
- source_word: Κορνήλιε
  choice: コルネリウス
  rationale: Κορνήλιοςの呼格。日本語では呼格語尾を区別せず、一般的な音写を用いる。
theological_decisions:
- issue: ἄγγελοςの性質
  choice: 天的な存在としての「神の御使い」
  alternative: 神から遣わされた人間の使者
  rationale: 明示的に幻の中で現れ、「神の」と限定されるこの文脈では、超自然的な使者が自然な読みである。ただし本文にない性質や位階は補わない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「第九時」「御使い」によって原文の時刻表現と聖書的な荘重さを保った。原文でφaνερῶςがどの要素にかかるかには語順上わずかな幅があるため、「幻の中で、はっきりと」と区切り、過度に限定しない形にした。英語相談文では脚注記号と脚注内容の位置が対応していないため、日本語稿では時刻注を「第九時ごろ」に、語義注を「はっきりと」に付した。
