  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: ja
  text: 彼は非常に空腹になり、何か食べたいと思った[a]。人々が食事を用意している間に、彼は恍惚状態に陥った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「何かを味わいたいと思った」。ここでは食べることを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「トランス状態に陥った」とも訳せる。ここでのギリシア語は、幻による啓示と結びついた通常とは異なる意識状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: 彼はひどく空腹になり
  rationale: πρόσπεινος の強い空腹を「ひどく空腹」とし、ἐγένετο の状態変化を「なり」で表した。
- source_word: ἤθελεν γεύσασθαι
  choice: 何か食べたいと思った
  rationale: γεύομαι は字義的には「味わう」だが、この文脈では食物を口にすることを指す。「何か」は日本語として自然に暗示された目的語を補う。
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: 人々が食事を用意している間に
  rationale: 属格独立構文の同時性を「間に」で示した。目的語は原文では明示されないが、文脈上の食事を補って自然な日本語とした。
- source_word: ἐγένετο ἐπ’ αὐτὸν ἔκστασις
  choice: 彼は我を忘れたような状態になった
  rationale: ἔκστασις がここでは幻を伴う通常とは異なる意識状態を表すことを伝えつつ、日本語で「恍惚」とした場合に生じうる歓喜や神秘主義的含意を避けた。
theological_decisions:
- issue: ἔκστασις が表すペトロの状態
  choice: 我を忘れたような状態
  alternative: 恍惚状態／夢心地／驚き
  rationale: 直後に啓示的な幻が語られるため、単なる驚きではなく通常とは異なる意識状態を指すと判断した。ただし、その状態の仕組みや性質は説明せず、原文の幅を保った。
translation_notes:
  register: 現代の一般読者に明瞭な叙述調。「ひどく空腹」で語の強さを保ち、「我を忘れたような状態」で専門的・宗派的な表現を避けながら幻の場面への移行を示した。
