  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: ja
  text: カイサリアに、コルネリウスという人がいた[a]。彼は、「イタリア隊」と呼ばれる部隊[b]に属する百人隊長であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「カイサリアに一人の人がいた」。ギリシア語は、新しい人物を導入する不定の表現を用いている。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「部隊」はローマ軍の軍事単位（コホルス）である。「イタリア隊」は、イタリアと関係のある部隊、またはイタリア人兵士で編成された部隊を指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: さて、…という人がいた
  rationale: δέの穏やかな場面転換を「さて」で示し、τιςによる新人物の不定的な導入を、自然な日本語の存在構文で表した。Ἀνήρは成人男性を指すが、日本語では「人」で文脈上十分明瞭である。
- source_word: ἐν Καισαρείᾳ
  choice: カイサリアに
  rationale: 場所を示す前置詞句を自然な日本語の所在表現とした。地名は一般的な聖書表記を採用した。
- source_word: ὀνόματι Κορνήλιος
  choice: コルネリウスという
  rationale: ὀνόματιと固有名による「名を〜という」を、現代日本語で自然な人物紹介にした。
- source_word: ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の役職を示す、日本語聖書および歴史用語として定着した訳語である。
- source_word: ἐκ σπείρης
  choice: 部隊の
  rationale: ἐκは所属を表し、σπεῖραはここではローマ軍のコホルスに相当する部隊を指す。本文では理解しやすい「部隊」とし、制度的説明は脚注に置いた。
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: 「イタリア隊」と呼ばれる
  rationale: καλουμένηςを「呼ばれる」と直接反映し、Ἰταλικῆςを部隊名として自然に表した。
