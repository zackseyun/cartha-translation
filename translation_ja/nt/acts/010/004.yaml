id: ACT.10.4
reference: Acts 10:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: ja
  text: コルネリウスは御使いをじっと見つめ、恐ろしくなって言った。「主よ、何でしょうか。」御使いは彼に言った。「あなたの祈りと施し[a]は、神の前に記念として上った。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「憐れみの行い」とも訳せる。ギリシャ語は特に、困窮している人への慈善的な援助を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: じっと見つめ
  rationale: 視線を固定して注意深く見ることを表す分詞の強さを、自然な現代日本語で伝える。
- source_word: ἔμφοβος γενόμενος
  choice: 恐れにとらわれて
  rationale: 恐れの状態に入ったことを表す γενόμενος の起動的な意味を保ちつつ、感情の度合いを不必要に強めない。
- source_word: Τί ἐστιν
  choice: 何でしょうか
  rationale: 何事なのか、何を求められているのかを尋ねる簡潔な問いとして、敬意を含む自然な表現を選んだ。
- source_word: κύριε
  choice: 主よ
  rationale: 天上の使者への畏敬を込めた呼びかけとして原語の κύριε を保つ。ここでイエスへの信仰告白であると断定するものではない。
- source_word: ἐλεημοσύναι
  choice: 施し
  rationale: 困窮者への慈善的な援助を特に指す語であり、日本語でも簡潔かつ聖書文脈に適した表現である。
- source_word: ἀνέβησαν
  choice: 上り
  rationale: 祈りや供え物が神のもとへ上るという方向性と祭儀的な比喩を保持する。
- source_word: εἰς μνημόσυνον
  choice: 覚えられるものとなった
  rationale: 神の前で記憶に留められるものとなったという結果を、意味の不明瞭な直訳調の「記念として」を避けて自然に表す。
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: 神の前に
  rationale: 神の臨在または神の御前を示す句を簡潔に訳した。
theological_decisions:
- issue: 天上の使者に対する κύριε の意味合い
  choice: 「主よ」と訳し、畏敬を込めた呼びかけとして読める形を保つ。
  alternative: 「先生」「あなた様」などの敬称として訳す。
  rationale: 文脈上は天使への敬称であって、必ずしもキリスト論的な告白ではない。しかし「主よ」は原語の高い敬意と語義上の幅を保ち、本文で意味を一方に限定しない。
- issue: εἰς μνημόσυνον が示す神の記憶と祭儀的響き
  choice: 「覚えられるものとなった」とし、神の前に届いて記憶に留められるという中心的意味を示す。
  alternative: 「記念として上った」と形式的に訳し、供え物に関する祭儀用語との響きを前面に出す。
  rationale: 原語には供え物を神に覚えていただくという祭儀的な響きがあり得るが、ここで具体的な供え物と断定はしない。自然な日本語で主要な意味を伝えつつ、その神学的含意を狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。代名詞だけでは指示対象が曖昧になりやすいため、文脈上の人物を「コルネリウス」「御使い」と明示した。会話では畏敬を示しつつ、過度に古風な言い回しを避けた。
