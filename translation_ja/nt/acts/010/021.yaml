    issue: 「その人たち」がἄνδραςの性別情報を省いている。
    rationale: ἀνήρ（複数ἄνδρες）は一般的な『人々』ではなく男性を指す。この場面ではコルネリウスが遣わした男たちであり、「男たち」と訳すのが適切である。
