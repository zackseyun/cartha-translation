  verdict: revise
  source_fidelity: 「ἄνδρας」はこの文脈で訪問してきた成人男性たちを指すため、「その人たち」では性別の情報が失われます。「男たち」とするのが原文により忠実です。πάρεστεは現在の『居合わせている／来ている』状態を表しますが、日本語では訪問の理由を尋ねる「ここに来たのですか」で自然に表せます。
  naturalness: 全体として明瞭ですが、「ここに来られたのですか」の尊敬語は、原文にない敬意を加え、ペテロの発話としてやや不釣り合いです。「来たのですか」が自然で適度に丁寧です。「ほら」はἰδούの注意喚起を現代的な会話日本語で表します。
  terminology: ペテロは定着した人名表記です。「男たち」はἀνήρの複数形に対応します。神学用語に関する問題はありません。
