  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: ja
  text: そこでペテロは、その男たちのところへ降りて行って言った。「ほら、あなたがたが捜しているのは私です。どのような理由でここに来たのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς δὲ Πέτρος
  choice: そこでペテロは…降りて行って
  rationale: アオリスト分詞の動作を主動詞に先立つ動作として自然な日本語にし、屋上から下へ向かう方向性を「降りて行って」で保持した。δὲは強い対比ではなく物語の進行を示すため「そこで」とした。
- source_word: πρὸς τοὺς ἄνδρας
  choice: その人たちのところへ
  rationale: πρός＋対格の移動先を自然に表す。ἄνδραςは成人男性を指すが、この文脈では訪問者たちを指すため、過度に性別を強調しない「その人たち」とした。
- source_word: Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε
  choice: ご覧のとおり、あなたがたが捜しているのは私です
  rationale: ἰδούの注意喚起と、ἐγώの強調を伴う自己同定を、現代日本語の会話として自然かつ明瞭に表した。
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: どのような理由でここに来られたのですか
  rationale: αἰτίαの明示的な「理由」を残しつつ、πάρειμιの到着後の現在性を文脈に即して自然な敬語表現にした。「なぜここにいるのですか」より、訪問目的を尋ねる意味が明瞭になる。
