  terminology: 「コルネリウス」は定着した表記である。「祈り」「施し」「神の御前」「覚えられる」はいずれも適切である。「施し」はἐλεημοσύναιの具体的な慈善的援助・贈与の意味を簡潔に伝え、脚注が行為・贈与の両面を適切に補っている。
